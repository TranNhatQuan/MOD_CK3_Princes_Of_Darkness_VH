l_english: 
 # Boilerplate copy for the standard countermeasures.
  scheme_countermeasure_type_bounties_for_whispers: "Tiền thưởng cho lời đồn"
  scheme_countermeasure_type_bounties_for_whispers_desc: "#WEAK Tiền có thể khiến lời đồn lan truyền — dù điều này *có* nghĩa là phải nghe chúng.#!"
  scheme_countermeasure_type_arbitrary_arrests: "Bắt giữ tùy tiện"
  scheme_countermeasure_type_arbitrary_arrests_desc: "#WEAK Xích chân tay mọi Bạn Bè, tùy tùng, và sứ giả chỉ vì họ nháy mắt chắc chắn là biện pháp cưỡng ép hiệu quả. Chỉ là không được lòng dân.#!"
  scheme_countermeasure_type_strengthen_sentries: "Tăng cường lính canh"
  scheme_countermeasure_type_strengthen_sentries_desc: "#WEAK Đôi mắt cảnh giác giữ những kẻ tán tỉnh rình rập ngoài cửa rất tốt, nhưng lại khó chống lại những kẻ âm mưu có tổ chức và vũ trang đầy đủ.#!"
  scheme_countermeasure_type_redouble_guards: "Tăng gấp đôi vệ binh"
  scheme_countermeasure_type_redouble_guards_desc: "#WEAK Các tùy tùng vũ trang xuất sắc trong việc ngăn chặn những kẻ có ác ý nghiêm trọng, nhưng không thể ngăn được lá thư giấu dưới cửa hay cuộc trò chuyện ở góc tối.#!"
  scheme_countermeasure_type_withdraw_from_view: "Rút khỏi tầm nhìn"
  scheme_countermeasure_type_withdraw_from_view_desc: "#WEAK Khi sự an toàn là mối quan tâm nghiêm trọng nhưng mối nguy chưa rõ, đơn giản bỏ qua mọi trách nhiệm cũng là một lựa chọn.#!"

  calculating_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('overthrow_regent').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('steal_back_artifact').GetTypeName]"
  opportunistic_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('convert_to_witchcraft').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
  indirect_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'tgp_disbelieve_mandala_boilerplate.tt' )]"
  tgp_disbelieve_mandala_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('disbelieve_mandala').GetTypeName]"

