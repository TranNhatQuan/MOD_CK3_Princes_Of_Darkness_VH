	diarch_imprison_reason_for_player.tt:1 "@portrait_punishment_icon! #weak Tội phạm — Ngài được phép hợp pháp bỏ tù [recipient.GetShortUIName] nếu có cơ hội#!"

	char_interaction.0261.desc:0 "Nhân danh quyền lực được trao cho ta bởi [intermediary.GetTitledFirstName], ta chính thức tước bỏ quyền cai trị giả mạo của ngươi đối với [landed_title.GetName]. Ngươi phải giao nộp tước vị này cho ta để giữ dưới danh nghĩa Vương quyền, có hiệu lực ngay lập tức."
	char_interaction.0261.a:0 "Một sự lạm quyền trắng trợn!"

	char_interaction.0262.desc:0 "[intermediary.GetTitledFirstName] sẽ nghe chuyện này, nhưng $char_interaction.0199.desc$ "
	char_interaction.0262.a:0 "[intermediary.GetSheHe|U] đã biết rồi."

	char_interaction.0263.desc:0 "Ngươi không phải là [intermediary.GetTitleAsNameNoTooltip] và ta không cúi đầu trước những ý thích nhỏ nhen của ngươi. Nếu ngươi muốn [landed_title.GetName], ngươi sẽ phải giành lấy nó bằng vũ lực."
	char_interaction.0263.result.criminal:0 "Nếu [actor.GetShortUINameNoTooltip] chịu lùi bước"
	char_interaction.0263.result.war:0 "Nếu [actor.GetShortUINameNoTooltip] quyết tâm đòi lại yêu sách"
	char_interaction.0263.a:0 "Vậy thì đó là phản loạn."
	char_interaction.0263.a.tt:0 "Tội trạng của Ngài sẽ được báo cáo tới [intermediary.GetTitledFirstName]"
	char_interaction.0263.b:0 "Ngươi nghĩ ta đang hù dọa sao? Ra chiến trường!"

	char_interaction.0271.desc:0 "Nhân danh quyền lực của chức vị được trao cho ta bởi [intermediary.GetTitledFirstName], ta sẽ sửa lại một vài sự bất nhất nhỏ trong biên giới của vương quốc.\n\nNgươi được lệnh phải trao quyền chư hầu của [intermediary.GetTitledFirstName] cho lãnh chúa hợp pháp của [intermediary.GetHerHis]. Chính là ta."
	char_interaction.0271.a:0 "Ta không thể từ chối, nhưng nếu ta #EMP có thể#!..."

	char_interaction.0272.desc:0 "Ngươi đã vượt quá quyền hạn của mình, nhưng ta không thể chống lại quyền lực của chức vị [intermediary.GetTitleAsName] của ta, ngay cả khi chỉ là #EMP ngươi#! đang thi hành nó.\n\nTa chấp nhận việc ngươi thu hồi chư hầu của ta."
	char_interaction.0272.a:0 "Ngươi chưa từng có lựa chọn nào, [recipient.GetFirstNameNoTooltip]."

	char_interaction.0273.desc:0 "Ta đã thề bảo vệ các chư hầu của mình, kể cả khỏi những kẻ tàn bạo như #EMP ngươi#!.\n\nNgươi có thể giành [intermediary.GetTitledFirstName] và lãnh địa của [intermediary.GetHerHis] khỏi ta trên chiến trường, hoặc cút về cái hang bị [recipient.GetFaith.random_GoodGodNames] nguyền rủa nào đó mà ngươi đang trú ẩn."
	char_interaction.0273.result.criminal:0 "$char_interaction.0263.result.criminal$"
	char_interaction.0273.result.war:0 "$char_interaction.0263.result.war$"
	char_interaction.0273.a:0 "Ngươi sẽ hối hận vì chuyện này, [recipient.GetFirstNameNoTooltip]."
	char_interaction.0273.a.tt:0 "$char_interaction.0263.a.tt$"
	char_interaction.0273.b:0 "Thật là một lời mời #EMP dễ chịu#!!"


	char_interaction.0281.desc:0 "Nhân danh quyền lực của chức vị mà [intermediary.GetTitledFirstName] đã trao cho ta, ta đặt ngươi dưới lệnh bắt giữ vì nghi ngờ có những hành vi bất chính.\n\nHãy đầu hàng binh lính của ta hoặc đối mặt với trừng phạt."
	char_interaction.0281.a:0 "Ta không còn lựa chọn nào."

	char_interaction.0282.desc:0 "Không giống như hành động của ta, yêu cầu của ngươi mới là tội ác.\n\nVì lợi ích của vương quốc, ta sẽ tuân theo, nhưng hãy biết rằng ta sẽ không quên sự sỉ nhục này."
	char_interaction.0282.a:0 "Ta đã tạo ấn tượng rằng ta muốn ngươi #EMP quên đi#! sao?"

	char_interaction.0283.desc:0 "Tự nộp mình cho lòng thương hại của ngươi sao? Ta không nghĩ vậy. Nếu ngươi muốn tống ta vào ngục, thì hãy tự mình đến bắt ta.\n\nTuy nhiên, nếu ngươi khăng khăng, có lẽ ta #EMP có thể#! đến gặp ngươi... nếu ngươi cho phép ta mang theo vài #EMP người Ngài#!."
	char_interaction.0283.a:0 "Cuối cùng rồi ngươi sẽ hối hận."
	char_interaction.0283.a.tt:0 "$char_interaction.0263.a.tt$"
	char_interaction.0283.b:0 "Có lẽ ngươi không hiểu. Đây không phải là một yêu cầu."

	char_interaction.0291.desc.positive:0 "Dù ta tin tưởng ngươi sẽ đại diện cho lợi ích của ta, nhưng lần này ngươi đã sai. [recipient.GetTitledFirstName] là một thần dân trung thành và có giá trị, và ngươi nên dồn sức vào việc khác."
	char_interaction.0291.desc.negative:0 "Ngươi không làm #EMP được việc gì#! cho ra hồn sao? Ngay cả kẻ đần độn nhất vùng đất này cũng thấy rằng [recipient.GetTitledFirstName] không phải là mục tiêu ngươi nên tập trung. Hãy ngừng bắt nạt những chư hầu tốt hơn và làm tròn bổn phận của mình."
	char_interaction.0291.desc.neutral:0 "Hiện tại việc này không phù hợp với lợi ích của ta. Ta tin rằng ngươi hiểu điều đó và sẽ tiếp tục cai trị với phẩm giá thay mặt ta."
	char_interaction.0291.a:0 "Hẳn là lãnh chúa của ta biết điều gì là tốt nhất."
	char_interaction.0291.b:0 "Thằng nhãi láo xược!"
	char_interaction.0291.c:0 "Đồ ngu chảy dãi!"
	char_interaction.0291.d:0 "Lão già lú lẫn!"
	char_interaction.0291.e:0 "Ta. Ghét. Cái. #EMP [intermediary.GetWomanMan|U].#!"
	char_interaction.0291.f:0 "Đồ #EMP khốn kiếp#!."
	char_interaction.0291.g:0 "Ta mong ngươi mục rữa trong ngục!"
	char_interaction.0291.h:0 "[intermediary.GetSheHe|U] chắc chắn sẽ không ngăn ta lần sau..."

