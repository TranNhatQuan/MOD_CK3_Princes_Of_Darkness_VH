	invite_to_council_position_interaction:0 "Lời Mời Vào Hội Đồng"
	liege_offer_council_position_exchange:1 "\nTa đã xác định rằng cần phải tổ chức lại hội đồng của mình. Có hiệu lực ngay lập tức, khanh sẽ thay vào đó phục vụ ta với vai trò [target.GetPositionName].\n"
	liege_offer_council_position_liked:1 "\nKhanh là một  Bề Tôi trung thành và tận tụy, và ta muốn thưởng cho sự phục vụ của khanh.\n\nĐể ghi nhận điều đó, ta chính thức đề nghị khanh giữ chức [target.GetPositionName] của [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
	liege_offer_council_position_powerful:1 "\nVới tư cách là một [recipient.GetTitleAsNameNoTooltip] đầy ảnh hưởng, việc khanh có tiếng nói trong hội đồng của ta là điều hợp lý.\n\nVì vậy, ta chính thức đề nghị khanh giữ chức [target.GetPositionName] của [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
	liege_offer_council_position_disliked:1 "\nTa đã đi đến kết luận không thể tránh khỏi rằng khanh thực sự là ứng viên tốt nhất mà ta có cho vị trí hội đồng đang bỏ trống.\n\nDù điều này khiến ta khó chịu, ta vẫn buộc phải đề nghị khanh giữ chức [target.GetPositionName] của [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
	liege_offer_council_position_skilled:1 "\nTài năng đáng kể của khanh đã không bị bỏ qua, [recipient.GetFirstNameNoTooltip].\n\nĐể ghi nhận kỹ năng của khanh, ta muốn đề nghị khanh giữ chức [target.GetPositionName] của [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
	liege_offer_council_position_fallback:1 "\nVận may đang mỉm cười với khanh, [recipient.GetFirstNameNoTooltip], vì ta đang cần một [target.GetPositionName] mới và khanh là ứng viên duy nhất hiện có.\n\nTa tin rằng khanh sẽ nhận nhiệm vụ này?\n"
	auto_accept_interaction_ai:1 "Điều này phù hợp với lợi ích của [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip]"

	council_interaction.0000.opening:0 "[sender.Custom2('AppropriateGreeting', receiver)]"
	council_interaction.0001.desc:1 "Ta vinh dự trước lời đề nghị của ngài muốn ta phục vụ với vai trò [sender.GetActiveCouncilTask.GetPositionName]."
	council_interaction.0001.desc.accept:0 "Ta sẽ bắt đầu thực hiện trách nhiệm mới của mình ngay lập tức, và sẽ gặp ngài tại cuộc họp hội đồng tiếp theo!"
	council_interaction.0002.desc.refuse:0 "Đáng tiếc là các trách nhiệm hiện tại của ta không cho phép ta đảm nhận thêm nhiệm vụ nào nữa, vì vậy ta buộc phải từ chối lời đề nghị của ngài."
	council_interaction.0001.a:0 "Tuyệt vời!"
	council_interaction.0002.a:0 "Có lẽ ta phải tìm người khác..."

	council_interaction.0011.desc:0 "Gần đây sự chú ý của ta bị phân tán quá nhiều, và ta gặp khó khăn trong việc hoàn thành mọi trách nhiệm của mình.\n\nPhải có điều gì đó phải buông bỏ, và ta tin rằng tốt nhất cho cả hai chúng ta nếu ta từ chức [council_task.GetPositionName]."
	council_interaction.0011.a:0 "Thật đáng tiếc."

	council_interaction.0021.desc:0 "Ta đã hy vọng mọi chuyện không đi đến bước này, nhưng ta không còn lựa chọn nào khác. Ta buộc phải thu hồi việc bổ nhiệm khanh làm [council_task.GetPositionName] của [sender.GetPrimaryTitle.GetNameNoTierNoTooltip], có hiệu lực ngay lập tức."
	council_interaction.0021.a:0 "Sao [sender.GetSheHe] dám chứ!?"
