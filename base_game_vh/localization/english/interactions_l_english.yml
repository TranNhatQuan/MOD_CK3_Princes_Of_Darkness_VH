	sumptuary_debate_interaction.tt_winnings_actor:0 "Nếu Ngài thắng, Ngài nhận được [prestige|E] từ [recipient.GetTitledFirstNameNoTooltip]"
	sumptuary_debate_interaction.tt_winnings_recipient:0 "Nếu [recipient.GetSheHe] thắng, [recipient.GetSheHe] sẽ lấy [prestige|E] từ #EMP Ngài!#!"
	sumptuary_debate_has_been_debated:0 "Nhân vật này gần đây đã bị buộc tội"
	sumptuary_debate_timing:0 "Gần đây Ngài chưa buộc tội ai vi phạm luật xa xỉ"
	not_sumptuary_debate_timing:0 "Gần đây Ngài đã buộc tội ai đó vi phạm luật xa xỉ"
	court_amenities_interactions.0001.b_turned_down:0 "[recipient.GetShortUIName|U] đã chịu áp lực và thay đổi phong cách ăn mặc của [recipient.GetHerHis]"
	sumptuary_violation_opinion:0 "$sumptuary_crime_hook$"

	used_sumptuary_debate_modifier:0 "Mới Tranh luận"
	used_sumptuary_debate_modifier_desc:0 "Nhân vật này gần đây đã bắt đầu một cuộc tranh luận về luật xa xỉ của vương quốc."
	sumptuary_debated_modifier:0 "Mới Tranh luận"
	sumptuary_debated_modifier_desc:0 "Nhân vật này gần đây đã tham gia vào một cuộc tranh luận về luật xa xỉ của vương quốc."
	court_amenities_interactions.0001.t:0 "Bị buộc tội Vi phạm Luật Xa xỉ!"
	court_amenities_interactions.0001.desc_intro:1 "Khi ta đang dạo bước trong các sảnh đường của [debate_locale.GetNameNoTierNoTooltip], [actor.GetTitledFirstName] đột ngột chặn đường!\n\nKẻ đó dí ngón tay vào ngực ta một cách đầy thách thức."
	court_amenities_interactions.0001.desc_byzantine:0 "“Tại sao ngươi lại nghĩ rằng mình có quyền mặc màu tím? Chỉ #EMP gia tộc của ta#! mới có vinh dự đó! Cởi nó ra ngay lập tức!”"
	court_amenities_interactions.0001.desc_court_position:0 ""Ngươi gọi #EMP thứ đó#! là trang phục xứng với một [recipient.GetTitleAsNameNoTooltip] sao? Trông ngươi thật lố bịch! Cởi ra ngay lập tức, nếu không ta sẽ gọi lính canh!""
	court_amenities_interactions.0001.desc.nakey:0 ""Dù cơ thể đáng được tôn vinh dưới mọi hình dạng, ít nhất ngươi cũng nên chăm sóc bản thân! Lần cuối ngươi tắm là khi nào?""
	court_amenities_interactions.0001.desc:0 ""Ngươi tưởng mình là ai khi dám nghênh ngang trong bộ trang phục lố bịch đó? Đây là triều đình hoàng gia, không phải nhà thổ! Đi tìm thứ gì đó khiêm tốn hơn đi!""
	court_amenities_interactions.0001.desc_outro:0 "\n\n[actor.GetSheHe|U ] buộc tội Ta vi phạm luật xa xỉ của [actor.GetPrimaryTitle.GetAdjective], một vết nhơ xã hội mà Ta khó lòng gột rửa — dù biết đâu Ta vẫn có thể xoay chuyển tình thế trước [actor.GetTitledFirstNameNoTooltip]! Có lẽ còn có thể đòi bồi thường..."
	court_amenities_interactions.0001.a:0 ""Vậy chính xác NGƯƠI đang mặc cái gì vậy?""
	court_amenities_interactions.0001.a.tt_success: "#positive_value Ngài đã bảo vệ thành công lựa chọn trang phục của mình#!"
	court_amenities_interactions.0001.a.tt_failure: "#negative_value Lập luận về trang phục của Ngài không mấy thuyết phục#!"
	court_amenities_interactions.0001.b:0 "Ta sẽ trả giá bằng danh dự của mình..."
	court_amenities_interactions.0001.b.tt:0 "$religious_interaction.2400.b.tt$"
	court_amenities_interactions.0002.t:0 "Một Cuộc Tranh luận Thời trang"
	court_amenities_interactions.0002.desc_intro:0 "Chúng Ta hẳn đã đứng tranh luận hàng giờ về các quy định chải chuốt và trang phục đúng mực, liên tục chỉ trỏ và viện dẫn những luật cổ mà dường như ít ai trong triều đình biết tới. Khi màn kịch cuối cùng lắng xuống,"
	court_amenities_interactions.0002.desc_won.nakey:0 "có vẻ như Ta đã thắng!\n\n Vì vậy, [actor.GetName] buộc phải mặc trang phục của thường dân và che giấu cơ thể bị bỏ bê đáng xấu hổ của mình khỏi thế gian."
	court_amenities_interactions.0002.desc_won:0 "có vẻ như ta đã thắng!\n\nVì thế, [recipient.GetName] buộc phải cởi bỏ xiêm y chỉ còn lại lớp lót! Tất cả triều thần đều đã chiêm ngưỡng kẻ đó đúng như cách mà [ROOT.Char.GetFaith.CreatorName] đã tạo ra!"
	court_amenities_interactions.0002.desc_lost.nakey:0 "Ta kinh ngạc nhận ra rằng chính mình mới là kẻ vi phạm luật!\n\n Lần đầu tiên trong đời, Ta cảm thấy xấu hổ về cơ thể mà [ROOT.Char.GetFaith.CreatorName] đã ban cho mình, và khi sự trần truồng trở nên khó coi, những lính canh và người hầu trang phục gần đó tiến tới khoác lên Ta những mảnh giẻ rách của thường dân."
	court_amenities_interactions.0002.desc_lost:0 "Ta kinh ngạc nhận ra rằng chính mình mới là kẻ vi phạm luật!\n\n Ta đứng đó xấu hổ khi lính canh và người hầu của lâu đài [debate_locale.GetNameNoTierNoTooltip] lột quần áo Ta xuống chỉ còn đồ lót rồi tiếp tục lột thêm! Bị phơi bày trước triều đình, Ta bỏ chạy khỏi nơi đó với lòng tự trọng tan nát."
	court_amenities_interactions.0002.a_won:0 "Ha! Thật là một trò vui!"
	court_amenities_interactions.0002.a_lost.humble:0 "Cứ để họ nhìn. Ta chẳng xấu hổ."
	court_amenities_interactions.0002.a_lost.lustful:0 "Ta thường chỉ dành vinh dự này cho người tình của mình."
	court_amenities_interactions.0002.a_lost:0 "Có lẽ Ta sẽ không bao giờ dám lộ mặt nữa."
	court_amenities_interactions.0003.desc_won.nakey:0 "có vẻ như Ta đã thắng!\n\n Vì vậy, [actor.GetName] buộc phải mặc trang phục của thường dân và che giấu cơ thể bị bỏ bê đáng xấu hổ của mình khỏi thế gian."
	court_amenities_interactions.0003.desc_won:0 "có vẻ như ta đã thắng!\n\nVì thế, [actor.GetName] buộc phải cởi bỏ xiêm y chỉ còn lại lớp lót! Tất cả triều thần đều đã chiêm ngưỡng kẻ đó đúng như cách mà [ROOT.Char.GetFaith.CreatorName] đã tạo ra!"
	court_amenities_interactions.0004.desc:0 "có vẻ như hành vi vi phạm pháp luật của [victim.GetNameNoTooltip] là một tội danh có thể bị trừng phạt tối đa theo luật của [debate_locale.GetNameNoTierNoTooltip]! Điều đó có nghĩa là Ta có thể tống giam [victim.GetNameNoTooltip]! Dù đây không phải kết quả Ta mong đợi, nhưng điều này chắc chắn đặt Ta vào một vị thế đầy quyền lực!"
	court_amenities_interactions.0004.a:0 "Có lẽ Ta sẽ bỏ qua vi phạm này, đổi lấy một ân huệ..."
	court_amenities_interactions.0004.b:0 "[victim.GetSheHe|U] sẽ hợp với áo tù hơn!"

