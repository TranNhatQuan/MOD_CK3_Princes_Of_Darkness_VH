	set_primary_spouse_interaction:0 "Đặt Phối ngẫu Chính"
	set_primary_spouse_interaction_desc:0 "Đặt [recipient.GetFirstNameNoTooltip] làm phối ngẫu chính của Ngài. Điều này cho phép [recipient.GetHerHim] tham gia [council|E] của Ngài và giúp điều hành công việc của lãnh địa."
