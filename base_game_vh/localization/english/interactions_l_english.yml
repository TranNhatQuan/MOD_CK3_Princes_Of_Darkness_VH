	char_interaction.0250.desc:1 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nTa rất tiếc phải thông báo rằng Ta đã quyết định tăng nghĩa vụ trong khế ước của Ngài.\n\nChắc hẳn Ngài hiểu hoàn cảnh của Ta – [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] đang rất cần được bảo vệ, và sự đóng góp của Ngài đóng vai trò rất lớn.\n\nHơn nữa, Ngài #emphasis thực sự nợ Ta!#!"
	char_interaction.0250.a:0 "Có vẻ Ta không còn lựa chọn nào..."
	char_interaction.0251.desc:1 "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nTa đã là một chư hầu tốt với ngài, nhưng chắc hẳn ngài hiểu rằng Ta cũng có thần dân của riêng mình!\n\nKhế ước hiện tại của Ta quá ràng buộc, chắc hẳn ngài sẽ thấy khôn ngoan nếu nới lỏng nó?\n\nHơn nữa, ngài #emphasis thực sự nợ Ta!#!"

	char_interaction.0253.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nTa đã quyết định thay đổi loại hình quản trị của [recipient.GetPrimaryTitle.GetNameNoTooltip].\n\nQuyết định này phục vụ lợi ích lớn hơn của [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
	char_interaction.0253.a: "Ta sẽ đảm nhận trách nhiệm mới của mình."

	char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nĐể ghi nhận các cống phẩm và sự tôn kính của chúng Ta đối với [recipient.GetPrimaryTitle.GetNameNoTooltip], Ta mong ngài thể hiện sự đáp lại bằng cách ban cho [SCOPE.Custom('CelestialTributaryRequest')].\n\nMong rằng ân huệ này sẽ củng cố sự hòa hợp giữa ngai vàng của ngài và lãnh thổ khiêm nhường của chúng Ta."
	char_interaction.0252.a: "Ta sẽ cho Ngài quyền tiếp cận các quầy chợ của chúng Ta."
	char_interaction.0252.b: "Đúng vậy, triều đại của Ngài đã chứng tỏ xứng đáng để liên kết với triều đại của Ta."
	char_interaction.0252.c: "Miễn là Ngài vẫn trung thành với [recipient.GetTitleTierName] của mình!"
	char_interaction.0252.d: "Hãy xem như nghĩa vụ thuế của Ngài được giảm."
	char_interaction.0252.d.alt: "Thay vào đó Ta sẽ giảm nghĩa vụ thuế của Ngài."
	char_interaction.0252.e: "Ta sẽ công nhận chủ quyền của [actor.GetPrimaryTitle.GetNamePossessiveNoTooltip]."
	char_interaction.0252.e.alt: "Thay vào đó hãy để Ta công nhận chủ quyền của [actor.GetPrimaryTitle.GetNamePossessiveNoTooltip]."
