	IS_NEIGHBOR_OR_DEJURE_LIEGE:0 "[TARGET_CHARACTER.GetShortUINameNotMe] phải là láng giềng , hoặc là [de_jure|E] liege của thủ đô của Ngài"
	OFFER_VASSALIZATION_INTERACTION_NOTIFICATION:1 "Ta muốn mở rộng sự bảo hộ của mình dành cho ngươi với tư cách là lãnh chúa tối cao mới của ngươi. Đổi lại, ta chỉ yêu cầu lời thề trung thành của ngươi..."
	GRANT_INDEPENDENCE_INTERACTION_NOTIFICATION:0 "Ta đã quyết định trao cho ngươi quyền độc lập. Kể từ hôm nay, ngươi được giải phóng khỏi lời thề trung thành."
	FORCE_VOTE_INTERACTION_NOTIFICATION:0 "Ta đã quyết định dùng ảnh hưởng của mình để buộc ngươi bỏ phiếu cho người kế vị mà ta chọn trong cuộc bầu cử tiếp theo."
	FORCE_JOIN_FACTION_NOTIFICATION:0 "Ta đã quyết định dùng ảnh hưởng của mình để buộc ngươi gia nhập phe của ta."
	OFFER_FEALTY_INTERACTION_NOTIFICATION:1 "Ta khiêm nhường xin ngài chấp nhận lời thề trung thành của ta với tư cách là lãnh chúa tối cao mới của ta."
	BECOME_TRIBUTARY_INTERACTION_NOTIFICATION: "Ta khiêm nhường xin ngài chấp nhận cống phẩm của ta và trở thành tông chủ mới của ta."
	DEMAND_TRIBUTARY_INTERACTION_NOTIFICATION: "Lãnh thổ của ngươi dường như đang cần được bảo vệ. Với tư cách là tông chủ mới của ngươi, ta sẽ mang lại sự an toàn đó, đổi lại là cống phẩm từ [recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
	OFFER_TRIBUTARY_STATUS_INTERACTION_NOTIFICATION: "Hãy đến, nhìn thấy ánh sáng và gia nhập hàng ngũ các chư hầu triều cống trung thành của ta. Cùng nhau chúng ta sẽ làm thế giới này tốt đẹp hơn."
	REQUEST_ARREST_NOTIFICATION_TEXT:0 "Ngươi bị bắt giữ vì những tội ác chống lại Vương Quyền."
	REQUEST_VOWS_NOTIFICATION_TEXT:0 "Ngươi được yêu cầu rời vị trí tại triều đình và tuyên thệ tu hành."
	CHARACTER_INTERACTION_ALLOWED_TO_MARRY:0 "Cho phép kết hôn"
	CHARACTER_INTERACTION_ALLOW_MARRIAGE:0 "#T Cho phép kết hôn\n#!#I Nhấp để cho phép [CHARACTER.GetUIName] tự do kết hôn theo ý [CHARACTER.GetHerHis]#!"
	CHARACTER_INTERACTION_DISALLOW_MARRIAGE:0 "#T Cấm kết hôn\n#!#I Nhấp để cấm [CHARACTER.GetUIName] tự kết hôn theo ý [CHARACTER.GetHerHis]#!"
	CHARACTER_INTERACTION_TOGGLE_FAVORITE: "[SelectLocalization( InteractionItem.IsFavorite, 'CHARACTER_INTERACTION_TOGGLE_FAVORITE_OFF', 'CHARACTER_INTERACTION_TOGGLE_FAVORITE_ON' )]"
	CHARACTER_INTERACTION_TOGGLE_FAVORITE_ON: "#T Thêm vào Yêu Thích\n#!Lần tới khi Ngài mở danh sách này, '[InteractionItem.GetName]' sẽ xuất hiện trong mục Yêu Thích."
	CHARACTER_INTERACTION_TOGGLE_FAVORITE_OFF: "#T Xóa khỏi Yêu Thích\n#!Lần tới khi Ngài mở danh sách này, '[InteractionItem.GetName]' sẽ không còn xuất hiện trong mục Yêu Thích."
	CHARACTER_INTERACTION_CANT_CONTROL_MARRIAGE:0 "#T Cấm kết hôn\n#!#X [CHARACTER.GetUIName] đã là người cai trị hơn $YEARS|V$ năm và có thể tự kết hôn theo ý [CHARACTER.GetHerHis]#!"
	ASK_FOR_DIVORCE_NOTIFICATION:0 "Cuộc hôn nhân của ta với [secondary_recipient.GetShortUIName] rõ ràng không được [actor.GetFaith.HighGodName] ban phước. Ngài có cho phép ta ly hôn không?"
	OFFER_RANSOM_PROPOSAL_PERSONAL:0 "Ta sẵn sàng thả ngươi khỏi sự giam giữ của ta, nhưng tự do không phải là miễn phí. Hãy cân nhắc đề nghị của ta."
	OFFER_RANSOM_PROPOSAL:0 "Ta sẵn sàng thả [secondary_recipient.GetShortUIName] khỏi sự giam giữ của ta, nhưng tự do không phải là miễn phí. Hãy cân nhắc đề nghị của ta."
	PAY_RANSOM_PROPOSAL_PERSONAL:0 "Ta không thể chịu đựng cảnh giam cầm này thêm nữa! Ngươi có chấp nhận đề nghị này để đổi lấy tự do cho ta không?"
	PAY_RANSOM_PROPOSAL:0 "[secondary_recipient.GetShortUIName|U] rất quan trọng với ta. Ngươi có thể thả [secondary_recipient.GetHerHim] để đổi lấy đề nghị này không?"
	RELEASE_PRISONER_OFFER:0 "Dù ta khá thích việc làm chủ nhà của ngươi, ta đã quyết định thả ngươi đi."
	RELEASE_PRISONER_OFFER_CONDITIONAL:0 "Ta sẵn sàng thả ngươi khỏi ngục, nhưng không phải vô điều kiện..."
	HOUSE_HEAD_DEMAND_CONVERSION:0 "Với tư cách là Gia Chủ của ngươi, ta phải yêu cầu ngươi theo đức tin chân chính duy nhất: [actor.GetFaith.GetName]."
	CONVERT_TO_RELIGION:0 "Ta đã quyết định theo [recipient.GetFaith.GetName], đức tin chân chính duy nhất."
	LIEGE_DEMAND_CONVERSION:0 "Đã đến lúc ngươi từ bỏ con đường sai lầm và theo đức tin chân chính duy nhất, [actor.GetFaith.GetName]!"
	GRANT_VASSAL_PROPOSAL:1 "Tin tốt! Ta đã quyết định phong [secondary_actor.GetFullName] làm chư hầu của ngươi."
	RETRACT_VASSAL_PROPOSAL:1 "Ta đã đi đến kết luận rằng, vì lợi ích lớn hơn của [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip], [recipient.GetFullName] phải được đặt làm chư hầu trực tiếp dưới quyền ta."
	REVOKE_TITLE_PROPOSAL:0 "Ta đã đi đến kết luận rằng ngươi không thể được giao phó phẩm giá và trách nhiệm của tước hiệu [landed_title.GetName]. Vì vậy ta yêu cầu ngươi lập tức từ bỏ tước hiệu này."
	RELIGIOUS_HEAD_SEEK_INDULGENCES:1 "Dù ta cố gắng trở thành một [actor.GetFaith.GetAdherentName] tốt, ta vẫn đôi khi vấp ngã. Vì vậy ta muốn hiến tặng số vàng này cho Giáo hội để bù đắp cho những sai lầm của mình."
	RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE:0 "Ta đã nhận ra lỗi lầm của mình và sau khi ăn năn về những tội lỗi đã gây ra, ta thỉnh cầu ngài gỡ bỏ lệnh tuyệt thông để ta có thể trở lại với các anh chị em cùng đức tin."
	RELIGIOUS_HEAD_REQUEST_EXCOMMUNICATION:0 "[secondary_recipient.GetShortUIName|U] đã vượt quá giới hạn với những hành động sai trái gần đây của [secondary_recipient.GetHerHis]. Ta thỉnh cầu ngài tuyệt thông [secondary_recipient.GetHerHim] để mọi người biết rằng chúng ta lên án hành động của [secondary_recipient.GetHerHis]."
	RELIGIOUS_HEAD_ASK_GOLD:1 "Là một [actor.GetFaith.GetAdherentName] trung thành, ta nhận ra mình bị cản trở trong việc làm điều thiện vì thiếu tiền. Ngài có thể hỗ trợ ta một ít để ta thực hiện ý chí của thần linh không?"
	RELIGIOUS_HEAD_ASK_CLAIM:1 "[secondary_recipient.GetShortUIName|U] đã không giữ gìn tốt các giá trị của đức tin, và các [actor.GetFaith.GetAdherentNamePlural] tại [target.GetNameNoTier] đang phải chịu khổ. Ngài có ban phước cho ta giải phóng vùng đất đó khỏi sự cai trị sai lầm của [secondary_recipient.GetHerHis] không?"
	RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET:0 "Lòng nhiệt thành đáng được ngưỡng mộ, nhưng nếu muốn đức tin của chúng ta chiến thắng, chúng ta cũng phải thực tế. Có lẽ sẽ khôn ngoan hơn nếu biến [target.GetNameNoTier] thành mục tiêu của thánh chiến?"
	ASK_TO_TAKE_VOWS:0 "Ta tin rằng việc gia nhập một lời thề tu hành sẽ có lợi cho ngươi. Dù ta không thể ép buộc, nhưng ngươi thực sự nên cân nhắc..."
	SEND_GIFT_PROPOSAL:0 "Xin hãy nhận món quà nhỏ bé này. Nó không nhiều, nhưng ta hy vọng nó sẽ hữu ích. Vì tình bằng hữu lâu dài của chúng ta!"
	SEND_GIFT_ACCEPT:0 "Ta chấp nhận món quà của ngươi!"
	SEND_GIFT_REJECT:0 "Ta từ chối lòng bố thí của ngươi"

	call_ally.0001.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
	call_ally.0001.desc:0 "Ta kêu gọi ngươi tôn trọng [alliance|E] của chúng ta và tham gia vào [target.GetName]!"
	call_ally.0001.a:0 "Ra trận!"

	call_ally.0100.opening:0 "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
	call_ally.0100.desc:0 "Tất nhiên ta sẽ tham gia cuộc chiến này cùng ngươi! Kẻ thù của chúng ta sẽ học được cách sợ hãi những [recipient.Custom('WomenMenPeople_GenderPreference')] của [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

	call_ally.0101.desc:0 "Đáng tiếc thay, ta không ở trong vị thế có thể bị cuốn vào các cuộc chiến của ngươi."
	call_ally.0101.a:0 "Thật là một [recipient.Custom2('InsultAdjective', ROOT.Char)] [recipient.Custom2('InsultNoun', ROOT.Char)]!"

	char_interaction.0001.opening:1 "[recipient.Custom2('AppropriateGreeting', actor )]"
	char_interaction.0001.desc:0 "Ta chấp nhận lời đề nghị chư hầu hóa hào hiệp của ngươi. Thưa lãnh chúa của ta!"

	char_interaction.0002.desc:0 "Ta không cần sự bảo hộ của ngươi và muốn giữ lại sự phồn thịnh của Vương Lĩnh của mình."
	char_interaction.0002.a:0 "Ta sẽ phải tìm những lựa chọn khác..."

	char_interaction.0010.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
	char_interaction.0010.desc: "[actor.GetFirstName], ta nghĩ đây là khởi đầu của một mối quan hệ chư hầu tuyệt vời!"
	char_interaction.0010.a: "Thưa lãnh chúa của ta!"
 
	char_interaction.0011.desc: "Dù ta trân trọng lời đề nghị tuyên thệ trung thành của ngươi, ta không thể chấp nhận."
	char_interaction.0011.a:0 "Thật đáng tiếc."

	char_interaction.0020.opening:2 "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
	char_interaction.0020.desc:1 "Với tư cách là Gia Chủ Triều Đại, ta tuyên bố từ bỏ và tước quyền thừa kế của ngươi! Ngươi sẽ không thừa kế bất kỳ tước hiệu nào từ bất kỳ thành viên nào của Triều Đại [actor.GetDynastyName]."
	char_interaction.0020.a:0 "Cái gì? Tại sao!?"

	char_interaction.0030.opening:0 "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
	char_interaction.0030.desc:1 "Với tư cách là Gia Chủ Triều Đại, ta khôi phục quyền thừa kế các tước hiệu từ các thành viên của Triều Đại [actor.GetDynastyName] cho ngươi!"
	char_interaction.0030.a:0 "Ta vô cùng biết ơn!"

	char_interaction.0040.desc:1 "Với tư cách là Gia Chủ Triều Đại, ta tuyên bố ngươi là kẻ bại hoại và là nỗi ô nhục của toàn bộ Triều Đại [actor.GetDynastyName]!"
	char_interaction.0040.a:0 "Cái gì? Tại sao!?"

	char_interaction.0041.desc: "Hành vi [recipient.Custom2('InsultBehavior', SCOPE.sC('actor'))] và lối sống sa đọa của ngươi mang lại sự ô nhục cho toàn bộ gia tộc [actor.GetHouse.GetBaseName] — và với tư cách Gia Chủ Gia Tộc, ta thấy bổn phận của mình là thông báo cho toàn bộ dòng tộc về những cách hành xử [recipient.Custom2('InsultAdjective', SCOPE.sC('actor'))] của ngươi.\n\nCầu mong ánh sáng của [actor.GetFaith.HighGodNamePossessive] dẫn dắt ngươi trở lại con đường đức hạnh... dù ta nghi ngờ điều đó."
	char_interaction.0041.a: "Vu khống!"

	char_interaction.0042.desc: "Ngươi vừa [recipient.Custom('FormalComplimentAdjective')] vừa [recipient.Custom('ComplimentAdjective')], là nguồn cảm hứng cho toàn bộ gia tộc [actor.GetHouse.GetBaseName] — và với tư cách Gia Chủ Gia Tộc, bổn phận của ta là ca ngợi những đức hạnh của ngươi trước toàn bộ dòng tộc!\n\nCầu mong ngươi luôn ở trong ân sủng của [actor.GetFaith.HighGodNamePossessive]."
	char_interaction.0042.a: "Thật tuyệt vời!"

	char_interaction.0050.desc:1 "Với tư cách Gia Chủ Triều Đại, ta tha thứ cho những lỗi lầm trong quá khứ của ngươi và rút lại lời tố cáo đối với ngươi trong số các thành viên của Triều Đại [actor.GetDynastyName]!"
	char_interaction.0050.a:0 "Công lý đã được thực thi!"

	char_interaction.0060.desc:1 "Ta khá thích [target.GetName], vì vậy với tư cách Gia Chủ Triều Đại của ngươi, ta đã quyết định đặt yêu sách lên nó. Ngươi hiểu sao thì hiểu."
	char_interaction.0060.a:0 "Điều này không ổn chút nào."

	char_interaction.0070.opening:0 "[actor.Custom2('AppropriateGreeting', recipient )]"
	char_interaction.0070.desc:1 "Cuộc nội chiến trong Triều Đại [actor.GetDynastyName] này thật không thể chấp nhận và phải chấm dứt ngay lập tức. Với tư cách Gia Chủ Triều Đại, ta tuyên bố Hòa Trắng giữa ngươi và kẻ thù trong Triều Đại!"
	char_interaction.0070.a:0 "Thật là một kẻ xen vào không thể chịu nổi!"

	char_interaction.0071.desc:2 "Cuộc nội chiến trong Triều Đại [actor.GetDynastyName] này thật không thể chấp nhận và phải chấm dứt ngay lập tức. Với tư cách Gia Chủ Triều Đại, ta đã ra lệnh cho [recipient.GetFullName] chấp nhận Hòa Trắng với ngươi."
	char_interaction.0071.a:0 "Ta vô cùng biết ơn!"

	char_interaction.0078.desc_them:0 "Ta biết chúng ta đã đồng ý để [ward.GetTitledFirstName] được ta giáo dục, nhưng vấn đề là... ta đã rất bận với những học trò khác. Xin lỗi."
	char_interaction.0078.desc:0 "Ta biết chúng ta đã đồng ý để [ward.GetTitledFirstName] được [guardian.GetTitledFirstName] giáo dục, nhưng vấn đề là... [guardian.GetSheHe|U] đã rất bận với những học trò khác. Xin lỗi."
	char_interaction.0078.a:0 "Thật là một sự xúc phạm...!"

	char_interaction.0079.desc_them:0 "Ta tưởng chúng ta đã đồng ý để ngươi giáo dục [ward.GetTitledFirstName], nhưng giờ ta nghe rằng ngươi đã quá bận với những học trò khác?! Thật đáng xấu hổ."
	char_interaction.0079.desc:0 "Ta ngỡ rằng chúng ta đã đồng ý để [guardian.GetTitledFirstName] dạy bảo [ward.GetTitledFirstName], thế mà nay ta nghe tin kẻ đó lại quá bận rộn với những đứa trẻ khác?! Thật đáng hổ thẹn."
	char_interaction.0079.a:0 "Có lẽ ta đã phạm sai lầm..."

	char_interaction.0080.desc:0 "Ta rất vui nếu [guardian.GetShortUINameNoFormat] giáo dục [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] của ta, [ward.GetShortUINameNoFormat] — một sự giáo dưỡng cao quý cho một tâm hồn cao quý!"
	char_interaction.0080.desc_self:0 "Ta rất vui nếu ngươi giáo dục [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] của ta, [ward.GetShortUINameNoFormat] — một sự giáo dưỡng cao quý cho một tâm hồn cao quý!"
	char_interaction.0080.desc_guardian_self_ward: "Ta rất vui được giáo dục ngươi — một sự giáo dưỡng cao quý cho một tâm hồn cao quý!"
	char_interaction.0080.desc_guardian_self: "Ta rất vui được giáo dục [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))] của ngươi, [ward.GetShortUIName] — một sự giáo dưỡng cao quý cho một tâm hồn cao quý!"
	char_interaction.0080.desc_guardian: "Ta rất vui nếu [guardian_liege.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] của ta, [guardian.GetShortUINameNoFormat], giáo dục [ward.GetShortUINameNoFormat] — một sự giáo dưỡng cao quý cho một tâm hồn cao quý!"
	char_interaction.0080.desc_ward_selfaccept:0 "Ta rất vinh hạnh khi được Người giáo dưỡng — một sự nuôi dạy cao quý dành cho một tâm hồn cao quý!"

	char_interaction.0081.desc:0 "Thật không may, chúng ta không thấy thỏa đáng với sự sắp xếp giáo dục mà ngươi đề xuất."
	char_interaction.0081.a:0 "Thật đáng tiếc."

	char_interaction.0082.t: "Một Người Thầy Cho Ta"
	char_interaction.0082.intro: "[guardian.GetTitledFirstName] cuối cùng cũng đã đến từ [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], mang theo những cuốn sách và cuộn giấy."
	char_interaction.0082.desc.liege: "\n\n[guardian.GetSheHe|U] nói rằng các bài học của [ward.GetFirstNamePossessiveNoTooltip] sẽ sớm bắt đầu!"
	char_interaction.0082.desc: "\n\n[guardian.GetSheHe|U] nói rằng các bài học của ta sẽ sớm bắt đầu!"
	char_interaction.0082.a: "Rất tốt."

	char_interaction.0083.t: "Một Tâm Trí Cần Được Uốn Nắn"
	char_interaction.0083.intro: "Thiếu niên [ward.GetTitledFirstName],"
	char_interaction.0083.not_related: "[ward_liege.GetTitledFirstNamePossessive] [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))],"
	char_interaction.0083.related:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))] của ta,"
	char_interaction.0083.outro: "cuối cùng đã từ [ward_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] tới nơi để bắt đầu việc giáo dục."
	char_interaction.0083.desc.host: "\n\n[guardian.GetTitledFirstName] sẽ sớm bắt đầu các bài học của [guardian.GetHerHis]."
	char_interaction.0083.desc: "\n\nKhi [ward.GetSheHe] ổn định chỗ ở, các bài học sẽ bắt đầu."
	char_interaction.0083.a: "Tuyệt vời."

	char_interaction.0084.desc: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))] của ngươi, [ward.GetTitledFirstName], đã an toàn đến [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], và ta sẽ bắt đầu việc dạy dỗ [ward.GetHerHis] ngay lập tức."
	char_interaction.0084.a: "Rất tốt."

	char_interaction.0090.from_ward.desc:0 "Ta e rằng việc giáo dục của ta tại triều đình của ngươi không còn phù hợp với nhu cầu của ta. Ta sẽ trở về [capital.GetNameNoTierNoTooltip] ngay lập tức."
	char_interaction.0090.two_wards.desc:0 "Ta e rằng việc giáo dục của [ward.GetTitledFirstName] và [ward_2.GetTitledFirstName] tại triều đình của ngươi không còn phù hợp với nhu cầu của chúng ta. Họ sẽ được triệu hồi trở về."
	char_interaction.0090.one_ward.desc:1 "Ta e rằng việc giáo dục của [ward.GetTitledFirstName] tại triều đình của ngươi không còn phù hợp với nhu cầu của chúng ta. [ward.GetSheHe|U] sẽ được triệu hồi trở về."
	char_interaction.0090.a:0 "Ta nên cảm thấy bị xúc phạm sao?"

	char_interaction.0100.desc:0 "Bằng hữu của ta, xin hãy nhận món quà nhỏ bé này như một dấu hiệu của lòng cảm kích."
	char_interaction.0100.a:0 "Một bổ sung đáng hoan nghênh cho kho bạc của ta!"

	char_interaction.0110.desc:0 "Ta hereby ban cho ngươi [landed_title.GetName], cùng cấp bậc, lãnh thổ chính thức và nguồn thu nhập đi kèm. Mong ngươi cai trị nó thật tốt!"
	char_interaction.0110.a:0 "Quyền lực của ta gia tăng!"

	char_interaction.0111.desc: "Ta hereby bổ nhiệm ngươi làm tổng đốc của [landed_title.GetName]. Mong ngươi chứng tỏ mình là đại diện xứng đáng của [actor.GetTitleAsNameNoTooltip] và cai quản nó thật tốt!"

	char_interaction.0120.desc:0 "Sau khi cân nhắc kỹ lưỡng, ta đã quyết định chọn ngươi làm người thừa kế hợp pháp của ta. Đừng khiến ta thất vọng, vì ta vẫn có thể đổi ý."
	char_interaction.0120.a:0 "Điều này là lẽ đương nhiên!"

	char_interaction.0130.a:0 "Một thỏa thuận tốt."

	char_interaction.0131.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
	char_interaction.0131.desc:0 "Ta thấy đề nghị của ngươi hoàn toàn vô lý. Hãy làm điều danh dự và thả [secondary_recipient.GetShortUIName] ra."
	char_interaction.0131.desc_personal:0 "Ta thà mục rữa trong ngục của ngươi còn hơn chấp nhận khoản tiền chuộc vô lý đó."
	char_interaction.0131.a:0 "Đã đến lúc cắt bớt khẩu phần của [recipient.GetHerHis]..."

	char_interaction.0140.desc:0 "Ta chấp nhận đề nghị tiền chuộc của ngươi. [secondary_recipient.GetShortUIName|U] sẽ được trả lại cho ngươi ngay lập tức!"

	char_interaction.0141.desc:0 "Khoản tiền chuộc của ngươi thật quá tầm thường. Ta nghĩ hiện giờ ta sẽ tiếp tục giữ [secondary_recipient.GetShortUIName]."
	char_interaction.0141.a:0 "Nguyền rủa tên [actor.Custom2('InsultAdjective', ROOT.Char)] [actor.Custom2('InsultNoun', ROOT.Char)] đó!"

	char_interaction.0150.desc:0 "Được thôi, ta sẽ thả ngươi, dù phải thừa nhận rằng ta đã quen với sự hiện diện của ngươi."

	char_interaction.0151.desc:0 "Ta e rằng phải từ chối đề nghị tiền chuộc của ngươi. Ngươi sẽ phải chịu đựng lòng hiếu khách của ta thêm một thời gian nữa."

	char_interaction.0160.desc:0 "Ta không còn lựa chọn nào khác ngoài việc chấp nhận điều kiện của ngươi để được thả."
	char_interaction.0160.desc_demand_conversion: "Ta sẽ cải đạo sang [actor.GetFaith.GetName]."
	char_interaction.0160.desc_renounce_claims: "Ta sẽ từ bỏ mọi yêu sách đối với vùng đất [recipient.Custom2('InsultAdjective', actor)] của ngươi."
	char_interaction.0160.desc_banish: "Ta sẽ rời đi và không bao giờ quay trở lại."
	char_interaction.0160.desc_gain_hook: "Ta sẽ mắc nợ ngươi."
	char_interaction.0160.desc_take_vows: "Ta sẽ gia nhập [recipient.Custom('NunMonkPlural')]."
	char_interaction.0160.desc_become_executioner: "Ta sẽ phục vụ với tư cách là đao phủ của ngươi."
	char_interaction.0160.desc_recruit: "Ta sẽ gia nhập triều đình [recipient.Custom2('InsultAdjective', actor)] của ngươi."
	char_interaction.0160.desc_demand_admin: "Ta sẽ trở thành một phần trong bộ máy hành chính [recipient.Custom2('InsultAdjective', actor)] của ngươi."
	char_interaction.0160.a:1 "Tạm biệt, [recipient.GetFirstNameNoTooltip]..."
	char_interaction.0160.a.courtier:0 "Liệu mà coi chừng bước chân đấy, [recipient.GetFirstNameNoTooltip]..."

	char_interaction.0161.desc:0 "Ta thà mục rữa trong ngục của ngươi còn hơn chấp nhận những yêu cầu vô lý đó."

	char_interaction.0170.t:0 "Khoảnh Khắc Khó Khăn"
	char_interaction.0170.desc:0 "Ta bị đánh thức vào những giờ đầu buổi sáng bởi hai lính canh xa lạ. Khi bị dẫn ra ngoài, ta không hề ảo tưởng về điều sắp xảy ra. Khi quỳ xuống trước đao phủ của [actor.GetShortUINamePossessive], ta trải qua một khoảnh khắc tĩnh lặng và minh mẫn tuyệt đối."
	char_interaction.0170.desc_burned:0 "Ngay khi ta vừa ăn xong bữa ăn ít ỏi của mình, cánh cửa bật mở và ta bị lôi ra ngoài một cách thô bạo. Đây sẽ không phải cái chết dễ dàng — giàn thiêu đã được châm lửa và ta đã cảm thấy sức nóng lan tới đôi chân. Đám đông bỗng im lặng khi chứng kiến những giây phút cuối cùng của ta với vẻ mặt điên loạn."
	char_interaction.0170.desc_devoured:0 "Cánh cửa bật mở, những kẻ thị vệ của [actor.GetShortUINamePossessive] xông vào quật ngã ta xuống đất. Sau đó, [actor.GetTitleAsNameNoTooltip] tiến vào, tay cầm dao, nụ cười rạng rỡ đầy ác ý.\n\nMặc cho ta gào thét, kẻ đó dùng cả dao lẫn răng xé xác ta. Trong cơn mê man, ta nhìn thấy khuôn mặt kẻ đó nhuốm đầy máu — máu của #EMP chính ta#! — ta van xin, nhưng khi thấy kẻ đó nhai nuốt một cách khoái trá, ta hiểu rằng đây chính là cái chết của mình."
	char_interaction.0170.desc_public:0 "Vừa rạng đông ta bị hai lính canh thô bạo đánh thức và lôi ra ngoài.\n\nKhi họ dẫn ta tới một bục hành hình dựng giữa đám đông tụ tập, tim ta chùng xuống, và khi đao phủ của [actor.GetShortUINamePossessive] mỉm cười với ta và nâng thanh kiếm nặng nề của [executioner.GetHerHis], ta rơi vào tuyệt vọng.\n\nĐám đông im lặng khi đao phủ đứng sừng sững trước ta, nơi ta bị ép phải quỳ xuống, và với một tiếng gầm nặng nhọc cùng một cú #EMP vút#! gần như không tiếng động, mọi thứ chìm vào bóng tối."
	char_interaction.0170.a:0 "Nguyền rủa linh hồn đen tối của ngươi, [actor.GetFirstNameNoTooltip]!!!"
	char_interaction.0170.life_is_just_a_joke.a:0 "Cuộc đời #EMP đúng là#! chỉ là một trò đùa, phải không?"
	char_interaction.0180.desc:0 "Với tư cách Gia Chủ của ngươi, ta đã quyết định rằng ngươi phải tiếp nhận [actor.GetFaith.GetName], đức tin chân chính duy nhất. Ta e rằng ngươi không có lựa chọn nào khác trong chuyện này."
	char_interaction.0180.desc.liege:0 "Với tư cách lãnh chúa của ngươi, ta yêu cầu ngươi từ bỏ tà giáo của mình và ngay lập tức gia nhập cùng ta với tư cách một [actor.GetFaith.GetAdherentName]."
	char_interaction.0180.a:0 "Có lẽ ta phải chấp nhận thôi."

	char_interaction.0181.desc:1 "Được thôi, ta sẽ tiếp nhận đức tin [actor.GetFaith.GetAdjective], dù việc từ bỏ quá nhiều điều quen thuộc sẽ khiến ta cảm thấy lạ lẫm."

	char_interaction.0182.desc:0 "Ta sẽ không bao giờ từ bỏ đức tin của mình, thay vào đó ta sẽ lập nên Gia Tộc riêng!"
	char_interaction.0182.a:0 "Thật đáng thất vọng..."

	char_interaction.0190.desc:1 "Được thôi, ta sẽ tiếp nhận đức tin [actor.GetFaith.GetAdjective], dù việc từ bỏ quá nhiều điều quen thuộc sẽ khiến ta cảm thấy lạ lẫm."
	char_interaction.0191.desc:0 "Đức tin của ta là cốt lõi của con người ta — ta sẽ không bao giờ từ bỏ nó."

	char_interaction.0200.desc:0 "Ta đã đi đến kết luận rằng ngươi không thể được trao phó phẩm giá và trách nhiệm của [landed_title.GetName]. Vì vậy, vì lợi ích của Vương Quốc, ta chính thức tước bỏ tước vị này khỏi ngươi."
	char_interaction.0200.a:0 "Ta không thể tin nổi!"
	char_interaction.0201.desc:0 "[landed_title.GetName] vốn thuộc về Gia Tộc [recipient.GetHouse.GetName]. Ta sẽ không từ bỏ nó trong bất kỳ hoàn cảnh nào."
	char_interaction.0201.a:0 "[recipient.GetSheHe] dám sao!"
	char_interaction.0199.desc:0 "Ta không còn lựa chọn nào khác ngoài việc cúi đầu trước quyết định tước bỏ [landed_title.GetName] của ngươi."
	char_interaction.0199.a:0 "Đúng vậy."

	char_interaction.0211.desc:0 "Ta thực sự trân trọng đề nghị hào phóng của ngươi khi biến [secondary_recipient.GetShortUIName] thành chư hầu của ta, nhưng ta e rằng phải từ chối."
	char_interaction.0211.a:0 "Kẻ vô ơn!"

	char_interaction.0220.desc:0 "Ta chấp nhận việc ngươi rút lại chư hầu của ta, [secondary_recipient.GetShortUIName], dù ta cho rằng điều đó không công bằng."
	char_interaction.0220.a:0 "Tốt."

	char_interaction.0221.desc:0 "Ta không thể phản bội lời thề trung thành của [secondary_recipient.GetShortUIName]. Ta sẽ bảo vệ chư hầu của mình, ngay cả khi điều đó có nghĩa là phá vỡ lời thề mà ta đã dành cho ngươi."
	char_interaction.0221.a:0 "Đây là phản loạn!"

	char_interaction.0230.title:0 "Kẻ Phản Loạn!"
	char_interaction.0230.desc.courtier:0 "[recipient.GetTitledFirstName] đã tránh được việc bị bắt và chạy trốn về vùng nông thôn!"
	char_interaction.0230.desc.courtier_court_chaplain_stayed:0 "[recipient.GetTitledFirstName] đã tránh được việc bị bắt, và nói rằng [recipient.GetSheHe] không hài lòng với hành động của ta thì vẫn còn là nói giảm nói tránh."
	char_interaction.0230.a:0 "Kẻ phản bội!"
	char_interaction.0230.a_court_chaplain_stayed:0 "Chuyện này thật là... khó xử."

	char_interaction.0231.title:0 "Công Lý"
	char_interaction.0231.desc_prison:0 "[recipient.GetTitledFirstName] đã bị bắt giữ và đang chờ số phận của [recipient.GetHerHis] trong ngục tối của ta."
	char_interaction.0231.desc_house_arrest:0 "Theo lệnh ta, [recipient.GetTitledFirstName] sẽ bị giam lỏng tại tư gia. Ta đã cho thị vệ canh giữ cẩn mật để đảm bảo kẻ đó không thể bước chân ra ngoài."
	char_interaction.0231.desc_stockade:0 "Theo lệnh ta, [recipient.GetTitledFirstName] sẽ bị giam tại gông cùm, chờ đợi phán quyết cuối cùng."
	char_interaction.0231.a:0 "Tốt."

	char_interaction.0232.desc:0 "Đã quá lâu ta phải chịu đựng những sự sỉ nhục từ [actor.GetTitledFirstName].\n\n"
	char_interaction.0232.liege: "Ta không thể đứng nhìn chúa tể lạm quyền ngược đãi các chư hầu trung thành. Hãy cùng ta đứng lên phế truất tên bạo chúa này."
	char_interaction.0232.regent: "Ta sẽ không đứng yên khi [actor.GetSheHe] ngược đãi các chư hầu trung thành của [ceremonial_liege.GetTitledFirstNamePossessive]. Ta kêu gọi ngươi tham gia cùng ta trong cuộc chiến phế truất tên bạo chúa này."
	char_interaction.0232.a:0 "Ngươi sẽ không chiến đấu một mình!"
	char_interaction.0232.b:0 "Kẻ phản bội chính là ngươi!"

	char_interaction.0233.desc:0 "Vì tội ác chống lại Vương Quyền, ngươi bị bắt giữ."
	char_interaction.0233.a:0 "Cái gì!?! Thật vô lý!"

	marriage_interaction.0010.desc:0 "Ta vui vẻ chấp nhận lời cầu hôn của ngươi!"
	marriage_interaction.0010.b_desc:0 "Ta vui vẻ chấp nhận lời đính hôn của ngươi!"
	marriage_interaction.0010.c_desc:0 "Ta chấp nhận lời cầu hôn của ngươi."
	marriage_interaction.0010.d_desc:0 "Ta chấp nhận lời đính hôn của ngươi."
	marriage_interaction.0010.e_desc:0 "Ta, [secondary_recipient.GetFirstName], vui vẻ chấp nhận kết hôn với ngươi!"
	marriage_interaction.0010.mid.a_desc:0 "\n\n[actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] của ngươi, [secondary_actor.GetFirstName], và [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] của ta, [secondary_recipient.GetFirstName], sẽ được kết hợp trong [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
	marriage_interaction.0010.mid.a_no_acquaintance_desc:0 "\n\nCận thần của ngươi, [secondary_actor.GetFirstName], và [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] của ta, [secondary_recipient.GetFirstName], sẽ được kết hợp trong [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
	marriage_interaction.0010.mid.b_desc:0 "\n\nNgươi sẽ kết hôn với [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] của ta, [secondary_recipient.GetFirstName], trong [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
	marriage_interaction.0010.mid.c_desc:0 "\n\nTa sẽ trân trọng nắm tay [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] của ngươi, [secondary_actor.GetFirstName], trong [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
	marriage_interaction.0010.mid.c_no_acquaintance_desc:0 "\n\nTa sẽ trân trọng nắm tay cận thần của ngươi, [secondary_actor.GetFirstName], trong [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
	marriage_interaction.0010.mid.d_desc:0 "\n\n[actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] của ngươi, [secondary_actor.GetFirstName], sẽ được đính hôn với [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] của ta, [secondary_recipient.GetFirstName]."
	marriage_interaction.0010.mid.e_desc:0 "\n\nNgươi sẽ được đính hôn với [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] của ta, [secondary_recipient.GetFirstName]."
	marriage_interaction.0010.mid.f_desc:0 "\n\nTa sẽ trân trọng nắm tay [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] của ngươi, [secondary_actor.GetFirstName], khi thời điểm đến."
	marriage_interaction.0010.mid.g_desc:0 "\n\n[actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))] của ngươi, [secondary_actor.GetFirstName], và ta sẽ là cặp đôi tuyệt vời #EMP nhất#!!"
	marriage_interaction.0010.mid.h_desc:0 "\n\nNgươi và ta sẽ là cặp đôi tuyệt vời #EMP nhất#!!"
	marriage_interaction.0010.gwedding.desc:0 "\n\nTa cũng mong chờ lễ [GetActivityType('activity_wedding').GetName] đã hứa; đừng làm ta thất vọng."

