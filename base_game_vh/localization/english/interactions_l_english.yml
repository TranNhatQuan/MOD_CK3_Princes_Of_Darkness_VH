	end_war_attacker_victory_interaction:0 "Đề nghị Hòa bình"
	end_war_attacker_white_peace_interaction:0 "$end_war_attacker_victory_interaction$"
	end_war_attacker_defeat_interaction:0 "$end_war_attacker_victory_interaction$"
	end_war_attacker_victory_attacker_desc:0 "\nAi cũng thấy rõ ta đã đánh bại ngươi. Tại sao còn tiếp tục kháng cự? Biết chấp nhận số phận của mình cũng là một loại phẩm giá."
	end_war_attacker_victory_defender_desc:0 "\nNgươi đã đánh bại ta. Ta không thể kháng cự thêm — ta xin đầu hàng trước ngươi và quân đội của ngươi. Chỉ mong ta còn giữ được chút phẩm giá."
	end_war_attacker_white_peace_attacker_desc:0 "\nGiờ ta đã nhận ra rằng việc tấn công ngươi là sai lầm. Đủ máu đã đổ trong cuộc chiến này — hãy kết thúc cuộc chiến vô nghĩa này."
	end_war_attacker_white_peace_defender_desc:0 "\nChẳng phải đã có quá nhiều máu đổ trong cuộc chiến vô nghĩa này rồi sao? Không ai trong chúng ta có lợi khi tiếp tục chiến đấu. Hãy lập hòa."
	end_war_attacker_defeat_attacker_desc:0 "\nTa ước mình biết điều gì khiến ta nghĩ rằng có thể đối đầu với một kẻ địch đáng gờm như ngươi. Than ôi, ta không thể thay đổi quá khứ, chỉ có thể thay đổi tương lai.\n\nTa đầu hàng — hãy kết thúc cuộc xung đột này."
	end_war_attacker_defeat_defender_desc:0 "\nNgươi có thể đã nghĩ rằng mình sẽ đánh bại ta, nhưng ta đã chứng minh điều ngược lại. Đừng làm mọi thứ rối ren hơn nữa — hãy đầu hàng và kết thúc cuộc chiến này."
