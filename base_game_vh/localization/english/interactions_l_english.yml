# Long life and many children
	marriage_interaction.0010.ending.a_desc:0 "\n\nCầu mong [recipient.GetFaith.HighGodName] ban cho họ cuộc sống lâu dài và nhiều con cháu!"
	marriage_interaction.0010.ending.a_actor_desc:0 "\n\nCầu mong [recipient.GetFaith.HighGodName] ban cho Ngài cuộc sống lâu dài và nhiều con cháu!"
	marriage_interaction.0010.ending.a_recipient_desc:0 "\n\nCầu mong [recipient.GetFaith.HighGodName] ban cho chúng ta cuộc sống lâu dài và nhiều con cháu!"
	marriage_interaction.0010.ending.a_both_desc:0 "\n\nCầu mong [recipient.GetFaith.HighGodName] ban cho chúng ta cuộc sống lâu dài và nhiều con cháu, hỡi [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')] của ta!"
# May HighGod bless the union
	marriage_interaction.0010.ending.b_desc:0 "\n\nCầu mong [recipient.GetFaith.FertilityGodName] ban phúc cho cả hai!"
	marriage_interaction.0010.ending.b_actor_desc:0 "\n\nCầu mong [recipient.GetFaith.FertilityGodName] ban phúc cho hai Ngài!"
	marriage_interaction.0010.ending.b_recipient_desc:0 "\n\nCầu mong [recipient.GetFaith.FertilityGodName] ban phúc cho cả hai chúng ta!"
	marriage_interaction.0010.ending.b_both_desc:0 "\n\nCầu mong [recipient.GetFaith.FertilityGodName] ban phúc cho cả hai chúng ta, hỡi [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')] của ta!"
# Happy and fulfilling marriage
	marriage_interaction.0010.ending.c_desc:0 "\n\nCầu mong họ mang lại cho nhau hạnh phúc và sự viên mãn!"
	marriage_interaction.0010.ending.c_actor_desc:0 "\n\nCầu mong hai Ngài mang lại cho nhau hạnh phúc và sự viên mãn!"
	marriage_interaction.0010.ending.c_recipient_desc:0 "\n\nCầu mong chúng ta mang lại cho nhau hạnh phúc và sự viên mãn!"
	marriage_interaction.0010.ending.c_both_desc:0 "\n\nCầu mong chúng ta mang lại cho nhau hạnh phúc và sự viên mãn, hỡi [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')] của ta!"
# Strength and support
	marriage_interaction.0010.ending.h_desc:0 "\n\nCầu mong họ tìm thấy sức mạnh và sự nâng đỡ nơi nhau!"
	marriage_interaction.0010.ending.h_actor_desc:0 "\n\nCầu mong hai Ngài tìm thấy sức mạnh và sự nâng đỡ nơi nhau!"
	marriage_interaction.0010.ending.h_recipient_desc:0 "\n\nCầu mong chúng ta tìm thấy sức mạnh và sự nâng đỡ nơi nhau!"
	marriage_interaction.0010.ending.h_both_desc:0 "\n\nCầu mong chúng ta tìm thấy sức mạnh và sự nâng đỡ nơi nhau, hỡi [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')] của ta!"
# Fruitful in spite of hatred
	marriage_interaction.0010.ending.d_desc:0 "\n\nCầu mong cuộc hôn nhân của họ vẫn sinh sôi dù giữa họ có hiềm khích."
	marriage_interaction.0010.ending.d_actor_desc:0 "\n\nCầu mong cuộc hôn nhân của hai Ngài vẫn sinh sôi dù giữa hai người có hiềm khích."
	marriage_interaction.0010.ending.d_recipient_desc:0 "\n\nCầu mong cuộc hôn nhân của chúng ta vẫn sinh sôi dù giữa chúng ta có hiềm khích."
	marriage_interaction.0010.ending.d_both_desc:0 "\n\nCầu mong cuộc hôn nhân của chúng ta vẫn sinh sôi dù giữa chúng ta có hiềm khích, hỡi [secondary_actor.Custom2('InsultAdjective', ROOT.Char)] [secondary_actor.Custom('WifeHusband')] của ta!"
# Perfect match
	marriage_interaction.0010.ending.e_desc:0 "\n\nTa chưa từng thấy cặp đôi nào hoàn hảo đến vậy, họ sinh ra là để dành cho nhau!"
	marriage_interaction.0010.ending.e_actor_desc:0 "\n\nTa chưa từng thấy cặp đôi nào hoàn hảo đến vậy, hai Ngài sinh ra là để dành cho nhau!"
	marriage_interaction.0010.ending.e_recipient_desc:0 "\n\nCuối cùng chúng ta cũng kết hợp trong [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')] cũng như trong tâm hồn và trái tim!"
	marriage_interaction.0010.ending.e_both_desc:0 "\n\nCuối cùng chúng ta cũng kết hợp trong [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')] cũng như trong tâm hồn và trái tim, hỡi [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')] của ta!"
# Recipient hates secondary recipient
	marriage_interaction.0010.ending.f_desc:0 "\n\nTa không hiểu nổi vì sao lại có người muốn cưới cái [secondary_recipient.Custom2('InsultAdjective', ROOT.Char)] [secondary_recipient.Custom2('InsultNoun', ROOT.Char)] đó, nhưng ta vẫn chúc họ may mắn."
	marriage_interaction.0010.ending.f_actor_desc:0 "\n\nTa không hiểu nổi vì sao lại có người muốn cưới cái [secondary_recipient.Custom2('InsultAdjective', ROOT.Char)] [secondary_recipient.Custom2('InsultNoun', ROOT.Char)] đó, nên chúc may mắn vậy."
# Sinner, or criminal
	marriage_interaction.0010.ending.g_desc:0 "\n\nTa cầu nguyện rằng họ cùng nhau có thể tìm thấy sự chuộc lỗi và sám hối, cũng như hạnh phúc."
	marriage_interaction.0010.ending.g_actor_desc:0 "\n\nTa cầu nguyện rằng hai Ngài cùng nhau có thể tìm thấy sự chuộc lỗi và sám hối, cũng như hạnh phúc."
	marriage_interaction.0010.ending.g_recipient_desc:0 "\n\nTa cầu nguyện rằng chúng ta cùng nhau có thể tìm thấy sự chuộc lỗi và sám hối, cũng như hạnh phúc."
	marriage_interaction.0010.ending.g_both_desc:0 "\n\nTa cầu nguyện rằng chúng ta cùng nhau có thể tìm thấy sự chuộc lỗi và sám hối, cũng như hạnh phúc, [secondary_actor.Custom('WifeHusband')]."

	marriage_interaction.0011.desc:0 "Sau khi cân nhắc kỹ lưỡng, ta buộc phải từ chối lời cầu hôn của ngươi.\n\n[secondary_actor.GetFirstName] và [secondary_recipient.GetFirstName] không sinh ra để dành cho nhau."
	marriage_interaction.0011.b_desc:0 "Sau khi cân nhắc kỹ lưỡng, ta buộc phải từ chối lời đính hôn của ngươi.\n\n[secondary_actor.GetFirstName] và [secondary_recipient.GetFirstName] không sinh ra để dành cho nhau."
	marriage_interaction.0011.a:0 "Thật đáng tiếc..."

	marriage_interaction.0020.desc:0 "Ta đã quyết định hủy bỏ hôn ước giữa [rejecting_betrothed.GetShortUIName] và [rejected_betrothed.GetShortUIName]."
	marriage_interaction.0020.actor_desc:0 "Ta đã quyết định hủy bỏ hôn ước của mình với [rejected_betrothed.GetShortUIName]."
	marriage_interaction.0020.recipient_desc:0 "Ta đã quyết định hủy bỏ hôn ước của ngươi với [rejecting_betrothed.GetShortUIName]."
	marriage_interaction.0020.both_desc:0 "Ta đã quyết định hủy bỏ hôn ước của chúng ta. Hôn nhân này sẽ không xảy ra."
	marriage_interaction.0020.a:0 "Thật ô nhục!"

	marriage_interaction.0030.desc:0 "Rõ ràng cuộc hôn nhân của chúng ta không được [actor.GetFaith.HighGodName] chúc phúc. Mọi chuyện kết thúc rồi."
	marriage_interaction.0030.a:0 "Cuối cùng ta cũng thoát khỏi cái [actor.Custom2('InsultAdjective', ROOT.Char)] [actor.Custom2('InsultNoun', ROOT.Char)] đó!"
	marriage_interaction.0030.a_love:0 "[actor.GetFirstName], không! Ta yêu ngươi!"

	marriage_interaction.0040.desc:1 "Ta đã quyết định nhận ngươi làm thê thiếp."
	marriage_interaction.0040.a:0 "Vậy cũng được."

	marriage_interaction.0041.desc:1 "Ta đã thả [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] của ngươi khỏi ngục để phục vụ như thê thiếp của ta."
	marriage_interaction.0041.a:0 "Đồ quỷ dữ khốn kiếp!"

	marriage_interaction.0042.desc:1 "Ta đã quyết định giao ngươi cho [recipient.GetTitledFirstName] làm thê thiếp của [recipient.GetHerHis]."
	marriage_interaction.0043.desc_concubine:1 "Ta đã thả thê thiếp của ngươi khỏi ngục để phục vụ như thê thiếp của [recipient.GetTitledFirstNamePossessive]."
	marriage_interaction.0043.desc_spouse: "Ta đã thả [secondary_recipient.Custom('WifeHusband')] của ngươi khỏi ngục để phục vụ như thê thiếp của [recipient.GetTitledFirstNamePossessive]."

	marriage_interaction.0050.desc:1 "Ngươi không còn được cần đến với tư cách thê thiếp của ta nữa."
