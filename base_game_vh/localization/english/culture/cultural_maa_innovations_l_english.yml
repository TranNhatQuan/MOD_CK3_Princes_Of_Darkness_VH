 #Military
  tradition_hird_name:0 "$innovation_hird$"
  tradition_hird_desc:0 "$innovation_hird_desc$"
  innovation_hird:0 "Hird"
  innovation_hird_desc:0 "Truyền thống duy trì các đội tùy tùng vũ trang phục vụ cho một gia tộc đã mang lại nhiều lợi ích cho chúng ta. Bằng cách chính thức hóa và mở rộng hệ thống này, chúng ta có thể triển khai cả những trung đoàn huscarl trong quân đội."

  innovation_zweihanders:0 "Zweihander"
  innovation_zweihanders_desc:1 "Những thanh đại kiếm hai tay khổng lồ này vừa có khả năng chém gục các $knight_culture_player_plural_no_tooltip_lowercase$ đang xung phong, vừa phá vỡ đội hình giáo binh của kẻ địch, khiến chúng trở thành sự bổ sung đáng gờm cho các trung đoàn giáo binh của chúng ta."

 #innovation_longbows:0 "Longbow"
 #innovation_longbows_desc:0 "Taking advantage of the strong yew wood that grows here, our bowyers have learned to make longbows so powerful they require specialized training from an early age to use effectively. This investment is worth it, as our longbowmen can shoot arrows which travel further and penetrate deeper than those fired by other archers."

  innovation_adaptive_militia:0 "Dân binh thích ứng"
  innovation_adaptive_militia_desc:1 "Những vũ khí như goedendag rẻ tiền, dễ sản xuất nhưng lại tỏ ra đặc biệt hiệu quả khi chống lại các đợt xung phong của kỵ binh. Sự tồn tại của chúng cho phép chúng ta điều chỉnh dân binh để có cơ hội tốt hơn nhiều khi đối đầu với các $knight_culture_player_plural_no_tooltip_lowercase$ bọc giáp."

  innovation_valets:0 "Gia nhân kỵ sĩ"
  innovation_valets_desc:1 "Việc thiết lập một hệ thống gia nhân chuyên phục vụ cho các kỵ sĩ quý tộc sẽ cho phép chúng ta triển khai các $knight_culture_player_plural_no_tooltip_lowercase$ được trang bị và bảo vệ tốt hơn."

  innovation_pike_columns:0 "Đội hình giáo dày"
  innovation_pike_columns_desc:0 "Binh sĩ cầm giáo từ lâu đã là những người phòng thủ vững chắc, nhưng họ thường thiếu tính cơ động và khả năng tấn công. Việc phát triển các đội hình mới để khắc phục điểm yếu này sẽ cải thiện đáng kể cơ hội chiến thắng trên chiến trường."

  innovation_legionnaires:0 "Quân đoàn binh"
  innovation_legionnaires_desc:1 "Cũng như việc chúng ta đã khôi phục Đế chế La Mã, chúng ta sẽ tái lập cấu trúc của quân đoàn La Mã cổ đại cùng những đơn vị tinh nhuệ đáng sợ của nó!"

  innovation_desert_tactics:0 "Chiến thuật sa mạc"
  innovation_desert_tactics_desc:0 "Vùng Levant là một miền đất xa lạ với địa hình bất lợi cho các đợt xung phong của kỵ binh. Chúng ta cần thích nghi với vùng đất này và triển khai kỵ binh phù hợp hơn để chiến đấu tại quê hương mới."

  innovation_caballeros:0 "Caballeros"
  innovation_caballeros_desc:0 "Những chiến mã Andalusia vượt trội hơn các giống ngựa khác trong việc di chuyển và chiến đấu trên địa hình hiểm trở. Chúng ta có thể huấn luyện các đơn vị kỵ binh chuyên biệt để tận dụng lợi thế này."

  innovation_cataphracts:0 "Kỵ binh Cataphract"
  innovation_cataphracts_desc:0 "Được bao bọc hoàn toàn trong những bộ giáp sắt, kỵ binh cataphract đáng sợ của chúng ta có thể phá vỡ gần như mọi tuyến phòng thủ bằng cách xông thẳng vào với trường thương."

  innovation_hobbies:0 "Ngựa Hobby"
  innovation_hobbies_desc:1 "Kỵ sĩ cưỡi ngựa hobby Celt vừa nhanh vừa linh hoạt — hoàn hảo cho việc trinh sát và cướp phá trên địa hình hiểm trở, nơi các $knight_culture_player_plural_no_tooltip_lowercase$ của đối phương không muốn bén mảng tới."

  innovation_rectilinear_schiltron:0 "Schiltron hình chữ nhật"
  innovation_rectilinear_schiltron_desc:0 "Đội hình vòng tròn giáo truyền thống là một phương thức phòng thủ mạnh mẽ nhưng bị hạn chế về tấn công và cơ động. Dù đòi hỏi kỷ luật cao, schiltron hình chữ nhật của chúng ta là một đội hình vượt trội, có khả năng thực hiện cả chiến thuật tấn công lẫn phòng thủ hiệu quả."

  tradition_forest_wardens_name:0 "$innovation_forest_wardens$"
  tradition_forest_wardens_desc:0 "$innovation_forest_wardens_desc$"
  innovation_forest_wardens:0 "Hộ lâm rừng sâu"
  innovation_forest_wardens_desc:0 "Tổ tiên chúng ta đã sinh sống trong những khu rừng này qua nhiều thế hệ, nhưng giờ đây chúng đang bị đe dọa bởi ngoại nhân. Hàng thế kỷ kinh nghiệm chiến đấu trong rừng sẽ giúp chúng ta bảo vệ quê hương tổ tiên."

  innovation_compound_bows:0 "Cung hợp chất"
  innovation_compound_bows_desc:0 "Được chế tạo từ các lớp sừng, gỗ và gân ép lại, cung hợp chất nhỏ gọn hơn nhiều so với cung truyền thống nhưng sức mạnh không hề kém. Kích thước gọn nhẹ cho phép bắn dễ dàng khi cưỡi ngựa, giúp chúng ta triển khai các kỵ xạ thủ thực sự hủy diệt."

  tradition_khadga_puja_name:0 "Khadga Puja"
  tradition_khadga_puja_desc:0 "Nền văn hóa này tôn vinh võ thuật và nghi lễ thờ phụng kiếm đại đao hai tay, từ đó nuôi dưỡng những chiến binh mạnh mẽ và thiện chiến. Những thanh trọng kiếm cho phép họ chém ngã cả bộ binh lẫn kỵ binh."
  innovation_khandayats:0 "Khandayat"
  innovation_khandayats_desc:0 "Tinh thông việc sử dụng đại đao khanda, những bộ binh tinh nhuệ của chúng ta rất thiện chiến trong rừng rậm cũng như khi tiêu diệt kỵ binh hạng nhẹ của địch."

  tradition_garuda_warriors_name:0 "Chiến binh Garuda"
  tradition_garuda_warriors_desc:0 "Những chiến binh kiệt xuất trong nền văn hóa này được phong danh hiệu Garuda và được kỳ vọng chiến đấu đến chết. Ngay cả những người đi theo Garuda cũng được trông đợi sẽ chết nếu thủ lĩnh của họ ngã xuống, dù là trên chiến trường hay bằng chính tay mình."

  tradition_futuwaa_name:0 "$innovation_futuwaa$"
  tradition_futuwaa_desc:0 "$innovation_futuwaa_desc$"
  innovation_futuwaa:0 "Futuwaa"
  innovation_futuwaa_desc:0 "Thanh niên của chúng ta đã bắt đầu lập nên các hội nhóm đề cao sức mạnh, nghị lực và đạo đức. Bằng cách ủng hộ các hội này, chúng ta sẽ đảm bảo nguồn binh sĩ khỏe mạnh sẵn sàng được triệu tập."

  tradition_land_of_the_bow_name:0 "Vùng đất của cung"
  tradition_land_of_the_bow_desc:0 "Trên vùng đất trù phú được bồi đắp bởi sông Nile và trí tuệ của chính mình, người Nubia đã thịnh vượng qua nhiều thế hệ. Gần như chừng đó thời gian, cây cung luôn là vũ khí được ưa chuộng để xua đuổi bọn cướp bóc và kẻ xâm lăng từ sa mạc."

  tradition_desert_ribat_name:0 "Ribat sa mạc"
  tradition_desert_ribat_desc:0 "Nền văn hóa này có truyền thống xây dựng các ribat kiên cố giữa sa mạc, nơi những người mộ đạo sống hòa mình với bầu trời và cát bụi. Lối sống ấy tạo nên những chiến binh sa mạc vừa thiện chiến vừa mộ đạo, đồng thời thu hút các nhà thần bí."

  tradition_mubarizuns_name:0 "$innovation_mubarizuns$"
  tradition_mubarizuns_desc:0 "$innovation_mubarizuns_desc$"
  innovation_mubarizuns:0 "Mubarizun"
  innovation_mubarizuns_desc:0 "Lấy cảm hứng từ những dũng sĩ huyền thoại của quân Rashidun, binh sĩ Mubarizun được huấn luyện để xuất sắc cả trong đội hình lẫn các cuộc đấu tay đôi."

  tradition_hussar_name:0 "$innovation_hussar_raids$"
  tradition_hussar_desc:0 "$innovation_hussar_raids_desc$"
  innovation_hussar_raids:1 "Đột kích $hussar$"
  innovation_hussar_raids_desc:1 "Là kỵ binh hạng nhẹ có thể nhanh chóng tấn công kẻ địch sơ hở rồi rút lui an toàn, các $hussar$ của chúng ta có thể được tổ chức thành những đơn vị chuyên về quấy rối và cướp phá."

  tradition_druzhina_name:0 "$innovation_druzhina$"
  tradition_druzhina_desc:0 "$innovation_druzhina_desc$"
  innovation_druzhina:0 "Druzhina"
  innovation_druzhina_desc:0 "Những chiến binh Varangian từ lâu đã phục vụ như vệ binh uy nghi cho các quân chủ, nhưng họ cũng có thể trở thành bộ binh hạng nặng tận tụy trong quân đội của chúng ta."

  tradition_horn_mountain_skirmishing_name:0 "$innovation_mountain_skirmishing$"
  tradition_horn_mountain_skirmishing_desc:0 "$innovation_mountain_skirmishing_desc$"
  innovation_mountain_skirmishing:0 "Đánh quấy rối miền núi"
  innovation_mountain_skirmishing_desc:0 "Những dãy núi lớn ở Sừng châu Phi gây khó khăn hậu cần cho nhiều đạo quân, nhưng các đơn vị đánh quấy rối của chúng ta có thể dễ dàng thích nghi để đánh bại quân xâm lược."

  tradition_bush_hunting_name:0 "$innovation_bush_hunting$"
  tradition_bush_hunting_desc:0 "$innovation_bush_hunting_desc$"
  innovation_bush_hunting:0 "Săn bắn rừng rậm"
  innovation_bush_hunting_desc:0 "Rừng rậm là nơi hiểm trở và khắc nghiệt, nhưng lại đầy cơ hội cho những ai biết khai thác. Huấn luyện cung thủ theo những kỹ thuật này sẽ giúp họ có lợi thế khi giao chiến tại đó."

  tradition_mobile_guards_name:0 "$innovation_mobile_guards$"
  tradition_mobile_guards_desc:0 "$innovation_mobile_guards_desc$"
  innovation_mobile_guards:0 "Chiến thuật phòng thủ"
  innovation_mobile_guards_desc:0 "Dân tộc chúng ta đã nhiều lần bị lưu đày và xua đuổi. Dù bi thương, những trải nghiệm này đã khiến chúng ta trở nên đặc biệt thành thạo trong các chiến thuật hậu vệ nhằm giảm thiểu thương vong."

  innovation_alpine_supremacy:0 "Bá chủ núi cao"
  innovation_alpine_supremacy_desc:0 "Độ cao khắc nghiệt của quê hương đòi hỏi phương thức hậu cần và chiến đấu khác biệt so với vùng thấp. Làm chủ những kỹ năng này sẽ biến chúng ta thành chúa tể không thể tranh cãi của núi rừng."

  innovation_sahel_horsemen:0 "Kỵ binh Sahel"
  innovation_sahel_horsemen_desc:0 "Sahel là một vùng đồng bằng khô hạn, nơi những quãng đường dài thường được vượt qua bằng ngựa. Kỵ binh Sahel là những chiến binh cưỡi ngựa sử dụng áo giáp nhẹ và lao, đủ sức tàn phá kẻ thù. Họ nhanh nhẹn và có thể dễ dàng chinh phục sa mạc và vùng đất khô cằn."
 
  innovation_bamboo_bows:0 "Cung tre"
  innovation_bamboo_bows_desc:0 "Một trong những vũ khí truyền thống lâu đời nhất của bộ binh Ấn Độ là cung tre, vừa rẻ vừa dễ chế tạo, bảo dưỡng. Do cung cũng là vũ khí ưa thích của thợ săn, quân đội Ấn Độ không bao giờ thiếu những cung thủ giàu kinh nghiệm."

  innovation_zbrojnosh:0 "Zbrojnosh"
  innovation_zbrojnosh_desc:0 "Những ngọn đồi và dãy núi rậm rạp của quê hương đòi hỏi một cách tiếp cận chiến tranh khác biệt. Những chiến binh vũ trang của chúng ta — Zbrojnosh — được huấn luyện để biến địa hình thành lợi thế và đã chứng minh là những đấu sĩ thiện chiến, đủ sức đánh bại cả những đạo quân đông gấp nhiều lần."

  tradition_upland_skirmishing_name:0 "$innovation_upland_skirmishing$"
  tradition_upland_skirmishing_desc:0 "$innovation_upland_skirmishing_desc$"
  innovation_upland_skirmishing:0 "Tác chiến quấy rối vùng cao"
  innovation_upland_skirmishing_desc:0 "Những ngọn đồi của thảo nguyên rừng rậm đã là quê hương của chúng ta qua nhiều thế hệ. Tổ tiên đã truyền lại cách tận dụng địa hình này, và khi bọn cướp đe dọa biên giới, chúng ta có thể vận dụng tri thức ấy để phòng thủ."
 
  innovation_sarawit:0 "Sarawit"
  innovation_sarawit_desc:0 "Vùng cao nguyên nơi tổ tiên chúng ta định cư đòi hỏi một phương thức canh tác đặc thù. Việc xây dựng ruộng bậc thang đã giúp chúng ta phát triển những chiến thuật quân sự mới, được các binh sĩ Sarawit vận dụng hiệu quả."
 
  tradition_mountain_herding_name:0 "Chăn nuôi miền núi"
  tradition_mountain_herding_desc:0 "Nền văn hóa này đã chọn những vùng núi mát mẻ làm quê hương giữa một khu vực khô hạn và cằn cỗi. Những người chăn nuôi và canh tác vùng cao đã trở thành các chiến binh bền bỉ và cường tráng, và theo thời gian, lao động của họ đã giúp dân tộc này hưng thịnh vượt xa vùng sa mạc trơ trụi."
  innovation_desert_mountain_herding:0 "Chăn thả núi sa mạc"
  innovation_desert_mountain_herding_desc:0 "Từ thời cổ đại, cư dân vùng núi của chúng ta đã tìm kiếm phương pháp chăn thả gia súc trên địa hình khắc nghiệt. Điều này đã rèn luyện họ thành những chiến binh vô cùng dẻo dai và cường tráng, được gọi là Abudrar."
 
  tradition_burman_royal_army_name:0 "Quân đội Hoàng gia"
  tradition_burman_royal_army_desc:0 "$innovation_royal_army_tradition_desc$"
  innovation_royal_army_tradition:0 "Truyền thống Quân đội Hoàng gia"
  innovation_royal_army_tradition_desc:0 "Chúng ta có truyền thống lâu đời về một đạo quân thường trực nhằm bảo vệ kinh đô. Điều này cho phép chúng ta sử dụng những binh sĩ cứng cỏi, phối hợp đặc biệt hiệu quả với các lực lượng yểm trợ như Chiến tượng."
 
  innovation_repeating_crossbow: "Nỏ liên phát"
  innovation_repeating_crossbow_chinese: "Shenbigong (Thần Tí Cung)" # 神臂弓
  innovation_repeating_crossbow_desc: "Kết hợp cánh nỏ căng bằng thép với cơ cấu kéo cơ khí, những cây nỏ tiên tiến này gia tăng đáng kể cả tầm bắn lẫn sức sát thương. Đổi mới này đánh dấu sự chuyển dịch từ phòng thủ dựa trên số lượng sang triển khai chiến trường chú trọng độ chính xác, trao cho các đạo quân chuyên nghiệp những công cụ xứng tầm đế chế."
  innovation_repeating_crossbow_chinese_desc: "$innovation_repeating_crossbow_desc$"

  innovation_men_at_arms:0 "Quân chính quy"
  innovation_men_at_arms_desc:0 "Huấn luyện và trang bị các đạo quân thường trực, luôn nằm dưới quyền kiểm soát trực tiếp của quân chủ, sẽ là bước đệm quan trọng trên con đường tập trung hóa quyền lực."

  innovation_pole_vault:0 "Nhảy sào"
  innovation_pole_vault_desc:0 "Nhảy sào là một phát minh đơn giản nhưng đòi hỏi quá trình huấn luyện và rèn luyện lâu dài để làm chủ. Một người nhảy sào lành nghề có thể tự phóng mình vượt qua những khe sâu, tảng đá cao, thậm chí cả một số công trình phòng thủ."
