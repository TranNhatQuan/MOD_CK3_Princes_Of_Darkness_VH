##############
# Tribal Era #
##############

 #Military
  innovation_motte: "Công sự đất"
  innovation_motte_desc:0 "Đơn giản nhưng hiệu quả, việc xây dựng lâu đài của chúng ta trên các gò đất cao là cách tốt nhất để bảo đảm rằng chúng ta — theo đúng nghĩa đen — luôn chiếm thế cao trước kẻ thù."

  innovation_motte_chinese: "Hāng Tu" # 夯土
  innovation_motte_chinese_desc: "Đơn giản nhưng hiệu quả, việc xây dựng công sự bằng đất nện là cách tốt nhất để bảo đảm rằng chúng ta — theo đúng nghĩa đen — luôn chiếm thế cao trước kẻ thù."

  innovation_motte_actual_motte: "Gò đất phòng thủ"
  innovation_motte_actual_motte_desc: "$innovation_motte_desc$"

  innovation_catapult:0 "Onager"
  innovation_catapult_desc:0 "Dù nạp đạn và khai hỏa chậm, các loại máy bắn đá dùng lực xoắn như thế này cho phép chúng ta công kích công sự của kẻ địch mà vẫn đứng ngoài tầm bắn của cung thủ."

  innovation_catapult_chinese: "Nỏ công thành"
  innovation_catapult_chinese_desc: "Những cây nỏ lớn có thể di chuyển, với nhiều cánh cung đối xứng để tăng chiều dài và lực kéo, thường được gắn trên khung có bánh xe để tăng tính cơ động."

  innovation_barracks:0 "Doanh trại"
  innovation_barracks_desc:0 "Bằng cách xây dựng các công trình chuyên dụng để binh lính đóng quân, chúng ta có thể bảo đảm đủ không gian để chứa các đạo quân ngày càng đông."

  innovation_mustering_grounds:0 "Bãi tập kết"
  innovation_mustering_grounds_desc:0 "Chỉ có người sẵn sàng chiến đấu là chưa đủ để giành chiến thắng. Dành không gian cho việc huấn luyện và tập hợp quân sẽ cho phép chúng ta duy trì các nhóm chiến binh dày dạn kinh nghiệm, đủ sức dẫn dắt chúng ta tới chiến thắng."

  innovation_bannus:0 "Bannus"
  innovation_bannus_desc:0 "Dựa trên quyền ra lệnh cho binh sĩ trong chiến trận, bann trao cho các quân chủ quyền buộc đàn ông tự do phải cầm vũ khí phục vụ mình, tạo nền tảng pháp lý cho việc huy động những đạo quân lớn."
  eligible_accolade_vanguard_attribute_ACCOLADES_DLC:0 "[knights|E] của [culture|E] này đủ điều kiện nhận [accolades|E] [GetAccoladeType('vanguard_attribute').GetName]"
  eligible_accolade_vanguard_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_vanguard_attribute_ACCOLADES_DLC')]"
  unlock_maa_armored_footmen: "Có thể tuyển [GetMaA('armored_footmen').GetName] làm [men_at_arms|E]"
  unlock_maa_onager: "Có thể tuyển [GetMaA('onager').GetName] làm [men_at_arms|E]"

  innovation_quilted_armor:0 "Giáp chần bông"
  innovation_quilted_armor_desc:0 "Được tạo thành từ hơn một tá lớp vải lanh khâu chồng lên nhau, loại áo giáp này có thể chặn cả những mũi tên nặng và là cách tiết kiệm để trang bị giáp cho toàn bộ một trung đoàn."

 #Civic
  innovation_gavelkind:0 "Chia gia tài"
  innovation_gavelkind_desc:0 "Ổn định và thịnh vượng luôn song hành. Thay vì để các chư hầu tranh giành quyền lực khi vị quân chủ cũ qua đời, chúng ta có thể xác lập một hệ thống thừa kế công bằng, định sẵn, loại bỏ phần lớn bất ổn vốn thường xảy ra khi chuyển giao quyền lực."

  innovation_crop_rotation:0 "Luân canh cây trồng"
  innovation_crop_rotation_desc:0 "Bằng cách chuyển từ mô hình canh tác hai thửa truyền thống sang luân canh ba thửa, chúng ta có thể trồng được nhiều hoa màu hơn mỗi năm mà không làm cạn kiệt đất đai."

  innovation_city_planning:0 "Quy hoạch đô thị"
  innovation_city_planning_desc:0 "Việc thiết kế thành phố ngay từ trước khi xây dựng cho phép chúng ta lập nên các khu định cư mới ở vị trí chiến lược, vừa thực dụng vừa mỹ quan hơn những khu cũ hình thành một cách tự phát."

  innovation_casus_belli:0 "Cớ chiến tranh"
  innovation_casus_belli_desc:0 "Sức mạnh quyết định lẽ phải đã là luật lệ qua nhiều thế hệ, nhưng nếu có lý do chính đáng cho chiến tranh, chúng ta có thể tránh chọc giận láng giềng  và những đòn trả đũa thường đi kèm."

  innovation_plenary_assemblies:0 "Hội nghị toàn thể"
  innovation_plenary_assemblies_desc:0 "Để cai trị hiệu quả, chúng ta phải triệu tập toàn bộ những người đàn ông tự do trong lãnh thổ để thảo luận và giải quyết các vấn đề lập pháp. Việc tham dự là bắt buộc; ai vắng mặt sẽ bị phạt và mất quyền ảnh hưởng đến mọi quyết định được đưa ra."

  innovation_development_01:0 "Công trình công cộng"
  innovation_development_01_desc:0 "Tài trợ cho việc xây dựng các công trình công cộng như đường sá, trường học và cầu dẫn nước sẽ giúp các khu định cư phát triển lớn mạnh hơn, bảo đảm sự thịnh vượng cho nhiều thế hệ."

  innovation_currency_01:0 "Tiền tệ"
  innovation_currency_01_desc:0 "Trao đổi hàng hóa vừa chậm vừa kém hiệu quả; việc áp dụng một loại tiền tệ được công nhận chính thức như vỏ sò cowrie hay thỏi kim loại sẽ thúc đẩy thương mại và lan tỏa tri thức trong lãnh thổ."

  innovation_ledger:0 "Sổ ghi chép"
  innovation_ledger_desc:0 "Khi lãnh thổ mở rộng, chúng ta cần cách tốt hơn để quản lý tài sản. Việc duy trì sổ ghi chép sẽ bảo đảm rằng chúng ta luôn biết mình đang có những nguồn lực nào."

 #Regional
  innovation_viking_tradition:0 "Chiến thuật Viking"
  innovation_viking_tradition_desc:0 "Người phương Bắc có truyền thống lâu đời về buôn bán, nhưng cũng nổi tiếng với cướp biển. Ít ai sẵn sàng đối phó với mối đe dọa bất ngờ xuất hiện từ bờ sông, và các chiến binh Viking là bậc thầy của lối đánh này."
 
  innovation_longboats:1 "Thuyền trường"
  innovation_longboats_desc:1 "Những chiếc thuyền trường của chúng ta là tàu biển đáng gờm, có thể đi gần như khắp mọi nơi và chịu được thời tiết khắc nghiệt, mang lại khả năng cơ động vượt trội trên biển."

  innovation_war_camels:0 "Lạc đà chiến"
  innovation_war_camels_desc:0 "Lạc đà vốn thích nghi tự nhiên với môi trường sa mạc, nhưng không phải sinh ra để chiến đấu. Các nhà lai tạo và huấn luyện của chúng ta có thể thay đổi điều đó, mang đến cho chúng ta kỵ binh linh hoạt đủ sức làm chủ cát nóng."
  eligible_accolade_camelry_attribute_ACCOLADES_DLC:0 "[knights|E] của [culture|E] này đủ điều kiện nhận [accolades|E] [GetAccoladeType('camelry_attribute').GetName]"
  eligible_accolade_camelry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_camelry_attribute_ACCOLADES_DLC')]"

  innovation_elephantry:0 "Tượng binh"
  innovation_elephantry_desc:0 "Voi rất khó nuôi trong điều kiện nuôi nhốt, vì vậy mỗi quản tượng phải tự bắt và huấn luyện voi hoang. Điều này khiến việc sử dụng hiệu quả những sinh vật khổng lồ này trong chiến trận trở thành một nghệ thuật tinh tế — và đó là nghệ thuật mà chúng ta quyết tâm làm chủ."
  eligible_accolade_elephantry_attribute_ACCOLADES_DLC:0 "[knights|E] của [culture|E] này đủ điều kiện nhận [accolades|E] [GetAccoladeType('elephantry_attribute').GetName]"
  eligible_accolade_elephantry_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_elephantry_attribute_ACCOLADES_DLC')]"
 
  innovation_wootz_steel:0 "Thép Wootz"
  innovation_wootz_steel_desc:0 "Còn được gọi là thép Hinduwani hoặc Seric, kim loại giàu carbon này rất lý tưởng để chế tạo vũ khí. Thép Wootz được buôn bán rộng rãi và được coi là loại thép tốt nhất thế giới. Trong phần lớn lịch sử, nó đã thu hút sự chú ý của các thương nhân Ả Rập, Ai Cập, Trung Hoa và thậm chí cả La Mã."
 
  innovation_african_canoes:0 "Xuồng Tây Phi"
  innovation_african_canoes_desc:0 "Những chiếc xuồng lớn của Tây Phi rất phù hợp cho việc di chuyển trên sông ngòi, cho phép chúng ta nhanh chóng vận chuyển binh lính tới nơi cần thiết."
 
  innovation_table_of_princes:0 "Bàn của các Vương công"
  innovation_table_of_princes_desc:0 "Bàn của các Vương công là ngai vị hoàng gia của các quân chủ Bohemia; người ngồi vào bàn được công nhận là vị vua chính thống. Theo luật trưởng tộc, tước vị được trao cho thành viên còn sống cao tuổi nhất của triều đại."
  unlock_single_heir_dynasty_house_changing:0 "Có thể ban hành $single_heir_dynasty_house$ ở bất kỳ mức [crown_authority|E] nào"


  tradition_visigothic_codes_name:0 "$innovation_visigothic_codes$"
  tradition_visigothic_codes_desc:0 "$innovation_visigothic_codes_desc$"
  innovation_visigothic_codes:0 "Bộ luật Visigoth"
  innovation_visigothic_codes_desc:0 "Dù nhiều truyền thống cổ xưa của người Visigoth đã bị xóa nhòa theo thời gian, con cháu vùng Pyrenees vẫn ghi nhớ những tập tục xưa, đặc biệt là cách chia đất cho con trai và con gái một cách thực tế nhưng công bằng."
  unlock_equal_succession_changing:0 "Có thể ban hành [law|E] $equal_law$ ở bất kỳ mức [crown_authority|E] nào"

######################
# Early Medieval Era #
###################### 
 
 #Military 
  innovation_battlements:0 "Tường thành"
  innovation_battlements_desc:0 "Không chỉ củng cố riêng tháp chính, việc xây dựng một bức tường ngoài kiên cố, nơi cung thủ có thể trú đóng an toàn, sẽ mang lại cho lâu đài của chúng ta thêm một lớp bảo vệ trước kẻ tấn công."

  innovation_mangonel:0 "Mangonel"
  innovation_mangonel_desc:0 "Là một bước cải tiến lớn so với các thiết kế máy bắn đá trước đây, mangonel dùng lực kéo có tốc độ nạp và bắn nhanh hơn nhiều so với các máy dùng lực xoắn."

  innovation_mangonel_chinese: "Thang mây"
  innovation_mangonel_chinese_desc: "Những chiếc thang công thành gấp khớp, thường được trang bị khiên, tời, móc leo và các thiết bị nâng dùng ròng rọc. Chúng cũng được sử dụng như điểm quan sát cao trong các cuộc vây hãm."
  eligible_accolade_besieger_attribute_ACCOLADES_DLC:0 "[knights|E] của [culture|E] này đủ điều kiện nhận [accolades|E] [GetAccoladeType('besieger_attribute').GetName]"
  eligible_accolade_besieger_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_besieger_attribute_ACCOLADES_DLC')]"

  innovation_burhs: "Pháo đài đá"
  innovation_burhs_desc: "Rải rác khắp vùng nông thôn, những địa điểm tập kết và trung tâm hành chính tốt nhất được bảo vệ bằng các bức tường đá vững chắc."

  innovation_burhs_japan: "Suki" # 柵
  innovation_burhs_japan_desc: "Kể từ khi công trình #italic Mizuki#! được xây dựng dưới triều Thiên hoàng Tenji, tầm quan trọng của công sự ngày càng được coi trọng. Chúng ta có thể sử dụng những trung tâm kiên cố như thế này vừa để tập kết quân, vừa làm trung tâm hành chính."

  innovation_burhs_chinese: "Wū Bì" # 塢壁
  innovation_burhs_chinese_desc: "Rải rác khắp vùng nông thôn, wū bì là những khu định cư kiên cố quan trọng, có thể dùng để tập kết quân cũng như làm trung tâm hành chính."

  innovation_burhs_anglo_saxon: "Burhs"
  innovation_burhs_anglo_saxon_desc: "Rải rác khắp vùng nông thôn, burhs là những khu định cư kiên cố quan trọng, có thể dùng để tập kết quân cũng như làm trung tâm hành chính."

  innovation_burhs_latin: "Castra"
  innovation_burhs_latin_desc: "Những nguyên tắc công sự cổ xưa đến nay vẫn còn giá trị, và chúng ta có thể sử dụng các trung tâm kiên cố như vậy vừa để tập kết quân, vừa làm trung tâm hành chính."

  innovation_house_soldiers:0 "Gia binh"
  innovation_house_soldiers_desc:0 "Khi các gia tộc quý tộc ngày càng lớn mạnh, họ cần binh sĩ để thi hành ý chí của mình. Việc thiết lập một đội gia binh chuyên nghiệp sẽ bảo đảm chúng ta có lực lượng được huấn luyện và trang bị tốt hơn quân trưng binh thông thường."

  innovation_horseshoes:0 "Móng ngựa"
  innovation_horseshoes_desc:0 "Một con ngựa bị nứt móng sẽ nhanh chóng què quặt và không thể lao động hay xung trận. Bằng cách đóng móng bằng đồng hoặc sắt, chúng ta có thể giữ cho móng ngựa khỏe mạnh và được bảo vệ khỏi hư hại."

  innovation_arched_saddle:0 "Yên cong"
  innovation_arched_saddle_desc:0 "Kỵ binh nhẹ rất đáng gờm, nhưng chưa thể khai thác hết tiềm năng của chiến mã. Yên cong cho phép chúng ta triển khai các chiến binh bọc giáp nặng với thương kẹp nách, giúp họ tận dụng tối đa đà xung phong khi lao vào đội hình địch."
  eligible_accolade_lancer_attribute_ACCOLADES_DLC:0 "[knights|E] của [culture|E] này đủ điều kiện nhận [accolades|E] [GetAccoladeType('lancer_attribute').GetName]"
  eligible_accolade_lancer_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_lancer_attribute_ACCOLADES_DLC')]"
  unlock_maa_armored_horsemen: "Có thể tuyển [GetMaA('armored_horsemen').GetName] làm [men_at_arms|E]"

 #Civic
  innovation_hereditary_rule:0 "Thế tập"
  innovation_hereditary_rule_desc:0 "Việc chia đều lãnh thổ cho tất cả người thừa kế hợp pháp sẽ làm tan rã sự thống nhất của dân chúng. Thay vì xé nát vương quốc sau mỗi lần kế vị, chúng ta có thể xây dựng một vùng lõi ổn định và thịnh vượng bằng cách thiết lập chế độ thế tập."

  innovation_manorialism:0 "Chế độ lãnh địa"
  innovation_manorialism_desc:0 "Khi quyền sở hữu đất đai tập trung trong tay tầng lớp tinh hoa, nhiều người dân không còn đất để canh tác. Chúng ta sẽ thiết lập hệ thống lãnh địa, nơi người tự do có thể làm ruộng để đổi lấy tiền thuê, còn những ai không trả nổi sẽ phục dịch như nông nô bị ràng buộc."

  innovation_royal_prerogative:0 "Đặc quyền hoàng gia"
  innovation_royal_prerogative_desc:0 "Khi hoàng tộc phải gánh vác trách nhiệm cai trị lớn hơn, họ cũng xứng đáng được ban cho những đặc quyền chỉ dành riêng cho mình."

  innovation_chronicle_writing:0 "Biên niên sử"
  innovation_chronicle_writing_desc:0 "Những chiến công của gia tộc ta sẽ không còn chỉ được truyền miệng. Chúng ta sẽ ghi chép mọi thành tựu đạt được, vừa để truyền cảm hứng cho hậu thế, vừa để chứng minh quyền sở hữu chính đáng đối với các vùng đất."

  innovation_armilary_sphere:0 "Thiên cầu"
  innovation_armilary_sphere_desc:0 "Gồm một khung cầu với các vòng chuyển động, những thiết bị này cho phép chúng ta theo dõi và dự đoán chuyển động của thiên thể. Ngoài giá trị chiêm tinh, kiến thức này còn giúp các thuyền trưởng định hướng khi đi xa bờ."

  innovation_baliffs: "Quan tư pháp"
  innovation_baliffs_desc: "Một vị quân chủ không thể có mặt ở mọi nơi cùng lúc. Bằng cách bổ nhiệm các quan tư pháp và đại diện khác để thi hành luật của lãnh chúa trên khắp lãnh thổ, chúng ta có thể cai trị một vùng đất rộng lớn hiệu quả hơn."

  innovation_baliffs_bailiffs: "Chấp hành quan"
  innovation_baliffs_bailiffs_desc: "$innovation_baliffs_desc$"

  innovation_baliffs_latin: "Potestas"
  innovation_baliffs_latin_desc: "Người La Mã cổ đại định nghĩa quyền lực của quan chức trong việc lập pháp, hành pháp và xét xử là #italic potestas#!. Bằng cách trao #italic potestas#! cho quan chức địa phương, chúng ta có thể cai trị một lãnh thổ rộng lớn hiệu quả hơn."

  innovation_development_02:0 "Chính quyền cộng đồng"
  innovation_development_02_desc:0 "Các thị trấn lớn thường xuyên đối mặt với những vấn đề ngày càng phức tạp. Trao bớt quyền hạn cho hội đồng địa phương sẽ giúp họ tự giải quyết mà không cần đến nhà vua."

  innovation_currency_02:0 "Đúc tiền"
  innovation_currency_02_desc:0 "Tiền tệ không được kiểm soát rất khó quản lý và thiếu ổn định. Những đồng tiền được đúc theo trọng lượng tiêu chuẩn và đóng dấu hoàng gia sẽ mang lại niềm tin mới cho các giao dịch thương mại."

 #Regional

  innovation_reconquista:1 "Bành trướng tín ngưỡng"
  innovation_reconquista_desc:0 "Bị phân tâm bởi nội chiến, chúng ta đã dung túng sự hiện diện của những kẻ ngoại đạo tại Hispania quá lâu. Đã đến lúc tập hợp lực lượng để quét sạch chúng khỏi vùng đất này mãi mãi!"

  innovation_stem_duchies:0 "Công quốc bộ tộc"
  innovation_stem_duchies_desc:0 "Dù xuất thân từ các bộ tộc khác nhau, chúng ta vẫn nhận ra tầm quan trọng của đoàn kết và hợp tác. Độc lập bị đề cao quá mức khi chính sự ổn định mới dẫn tới an toàn và thịnh vượng."

  innovation_ghilman:0 "Ghilman"
  innovation_ghilman_desc:0 "Là các nô binh bị bắt trong chiến tranh, ghilman là những chiến binh tận tụy, trung thành hơn với chúng ta và có chi phí thấp hơn lính đánh thuê thông thường."

#####################
# High Medieval Era #
#####################

 #Military
  innovation_hoardings:0 "Hoarding"
  innovation_hoardings_desc:0 "Được đặt trên đỉnh tường thành, những kết cấu gỗ này vươn ra phía ngoài chân tường lâu đài.\n\nChúng cho phép quân phòng thủ bắn tên, thả đá hoặc đổ dầu sôi xuống kẻ tấn công mà vẫn hoàn toàn được che chắn khỏi cung thủ địch."

  innovation_trebuchet:0 "Máy bắn đối trọng"
  innovation_trebuchet_desc:0 "Là một kỳ quan kỹ thuật, máy bắn đối trọng có thể phóng những vật nặng đi xa hơn bất kỳ khí cụ công thành nào trước đó."

  innovation_trebuchet_chinese: "Tháp công thành di động"
  innovation_trebuchet_chinese_desc: "Để chiếm các tháp đá của địch, những tháp gỗ cao có bánh xe này được đẩy sát vào tường, cho phép binh sĩ tiếp cận với mức độ an toàn tương đối."

  innovation_castle_baileys:0 "Ngoại thành lâu đài"
  innovation_castle_baileys_desc:0 "Dù tháp chính là trung tâm của lâu đài, nó không phải công trình quan trọng duy nhất. Việc xây dựng chuồng ngựa và kho vũ khí trong khu ngoại thành được bảo vệ sẽ bảo đảm chúng ta luôn có thể đồn trú và trang bị cho quân trưng binh."
 
  innovation_men-at-arms:0 "Quân chính quy"
  innovation_men-at-arms_desc:0 "Những người tinh thông cưỡi ngựa và dùng thương luôn được săn đón nhưng không phải lúc nào cũng sẵn có. Việc duy trì các đội quân chính quy thường trực sẽ bảo đảm chúng ta không thiếu chiến binh dày dạn khi chiến tranh nổ ra."

  innovation_knighthood:0 "Hiệp sĩ"
  innovation_knighthood_desc:0 "Bằng cách phong tước hiệp sĩ cho những chiến binh xuất sắc nhất và ban thưởng bằng đất đai thay vì chỉ tiền bạc, chúng ta vừa trao cho họ danh dự xứng đáng, vừa bảo đảm lòng trung thành."

  innovation_advanced_bowmaking:0 "Chế tác cung tiên tiến"
  innovation_advanced_bowmaking_desc:0 "Trước đây cung thủ tự chế tạo và bảo dưỡng cung của mình, nhưng nay các thợ thủ công đã tạo ra những loại cung mới mạnh mẽ và phức tạp hơn. Việc đón nhận các thiết kế này sẽ biến những bậc thầy chế cung thành tài sản quân sự vô giá."
  unlock_maa_crossbowmen: "Có thể tuyển [GetMaA('crossbowmen').GetName] làm [men_at_arms|E]"
  eligible_accolade_crossbower_attribute_ACCOLADES_DLC:0 "[knights|E] của [culture|E] này đủ điều kiện nhận [accolades|E] [GetAccoladeType('crossbowmen_attribute').GetName]"
  eligible_accolade_crossbower_attribute:1 "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_crossbower_attribute_ACCOLADES_DLC')]"

 #Civic

  innovation_heraldry:0 "Huy hiệu"
  innovation_heraldry_desc:0 "Việc thiết lập các biểu trưng mang tính kế thừa để nhận diện những gia tộc quý tộc sẽ khiến các thành viên của họ xem mình là một phần của một chỉnh thể lớn hơn, khuyến khích họ cải thiện danh tiếng của triều đại thay vì chỉ ám ảnh với địa vị cá nhân."

  innovation_windmills:0 "Cối xay gió"
  innovation_windmills_desc:0 "Phát minh ra cối xay gió trục đứng cho phép chúng ta khai thác sức mạnh của gió hiệu quả hơn rất nhiều so với trước đây, giảm đáng kể sức lao động cần thiết để xay ngũ cốc và xử lý nguyên liệu thô."

  innovation_divine_right:0 "Thiên mệnh"
  innovation_divine_right_desc:0 "Đã đến lúc chúng ta thừa nhận rằng chính ý chí của thần linh đã đặt các vị quân chủ lên ngai vàng của họ, và chống đối họ cũng chính là chống lại thần linh."

  innovation_land_grants:0 "Ban cấp đất đai"
  innovation_land_grants_desc:0 "Đất đai là phần thưởng giá trị nhất mà chúng ta có thể ban cho thần dân, nhưng lượng đất do chúng ta trực tiếp sở hữu là có hạn. Tuy nhiên, nếu chúng ta cho phép họ bắt đầu canh tác những vùng đất bỏ hoang kia... ai sẽ phản đối chứ? Kể cả nếu có xung đột xảy ra, rõ ràng chúng ta sẽ đứng về chính nghĩa khi bảo vệ thần dân của mình!"

  innovation_scutage:0 "Thuế thay nghĩa vụ quân sự"
  innovation_scutage_desc:0 "Nghĩa vụ quân sự từ lâu đã được mong đợi ở thần dân, nhưng vẫn có những người không thể hoặc không muốn thực hiện. Bằng cách cho phép họ hoàn thành nghĩa vụ bằng tiền thay vì gươm giáo, chúng ta có thể đảm bảo thu được phần đóng góp từ tất cả mọi người."

  innovation_guilds:0 "Phường hội"
  innovation_guilds_desc:0 "Khi lãnh thổ của chúng ta mở rộng, việc trực tiếp quản lý mọi hoạt động thương mại trong lãnh địa ngày càng trở nên kém hiệu quả. Bằng cách ban hiến chương phường hội cho các tổ chức thương nhân và thợ thủ công, chúng ta có thể trao cho họ quyền tự chủ lớn hơn trong kinh doanh, đồng thời vẫn đảm bảo thu lợi từ các hoạt động đó."

  innovation_development_03:0 "Đô thị hóa"
  innovation_development_03_desc:0 "Những thành phố vĩ đại như Roma, Byzantium và Delhi từ lâu đã nổi bật như tàn tích của một di sản huy hoàng không thể sánh kịp. Khi cơ sở hạ tầng và dân số của chúng ta tăng trưởng, cuối cùng chúng ta cũng có đủ điều kiện để phát triển những khu định cư mới sánh ngang các trung tâm đô thị cổ đại này."

  innovation_currency_03:0 "Ngân hàng"
  innovation_currency_03_desc:0 "Những giao dịch đặc biệt lớn hoặc đắt đỏ thường đòi hỏi một lượng tiền kim loại nặng nề và cồng kềnh. Gửi của cải đó vào các kho bạc an toàn và chuyển quyền sở hữu mà không cần di chuyển tiền xu vật lý sẽ cho phép trao đổi khối lượng hàng hóa lớn dễ dàng hơn."

 #Regional

  innovation_east_settling:0 "Ostsiedlung"
  innovation_east_settling_desc:0 "Những vùng đất phía đông của chúng ta thưa thớt dân cư nhưng giàu tài nguyên thiên nhiên. Việc khởi xướng một chương trình mở rộng và lập trang trại tại đó sẽ dẫn đến sự tăng trưởng và thịnh vượng cho dân tộc của chúng ta."

  innovation_seigneurialism:0 "Chế độ lãnh chúa"
  innovation_seigneurialism_desc:0 "Bằng cách giao thêm trách nhiệm cho các quý tộc địa phương, chúng ta vừa có thể làm hài lòng họ, vừa giải phóng sự tập trung của mình để chú tâm hơn vào lãnh địa trung ương."

  innovation_muladi:0 "Muladi"
  innovation_muladi_desc:0 "Chiến tranh, cướp phá và đàn áp trên khắp thế giới đã khiến nhiều người phải rời bỏ quê hương. Bằng cách chào đón những con người lưu lạc này đến lãnh thổ của chúng ta, bất kể xuất thân của họ, chúng ta có thể xây dựng một xã hội giàu có và thịnh vượng."

  innovation_french_peerage:0 "Hàng ngũ đại quý tộc"
  innovation_french_peerage_desc:0 "Bằng cách chính thức công nhận những chư hầu quý tộc lỗi lạc nhất trong vương quốc, chúng ta sẽ nuôi dưỡng tinh thần trung thành lớn hơn đối với hoàng quyền."

#####################
# Late Medieval Era #
##################### 
 
 #Military
  innovation_machicolations: "Lỗ đổ đá"
  innovation_machicolations_desc: "Là một cải tiến đáng kể so với các công trình che chắn trước đây, các lỗ đổ đá bằng đá thực hiện cùng chức năng nhưng bền bỉ hơn nhiều và mang lại sự bảo vệ tốt hơn cho quân phòng thủ."

  innovation_gunpowder: "Thuốc súng"
  innovation_gunpowder_desc: "Sự phát triển của các loại bột nổ đã tạo ra những dòng vũ khí mới và những loại chiến binh mới để sử dụng chúng. Việc triển khai những hỏa khí mạnh mẽ này đòi hỏi dây chuyền sản xuất và tiếp tế chưa từng có trước đây, nhưng chi phí đó hoàn toàn xứng đáng với sức mạnh mà công nghệ mới này mang lại."

  innovation_royal_armory:0 "Kho vũ khí hoàng gia"
  innovation_royal_armory_desc:0 "Khi quy mô quân đội ngày càng tăng, chúng ta phải đảm bảo rằng mọi binh sĩ đều được trang bị vũ khí và giáp trụ đầy đủ. Việc thành lập một kho vũ khí hoàng gia để sản xuất và lưu trữ toàn bộ trang bị quân đội sẽ góp phần lớn vào việc đáp ứng nhu cầu này."

  innovation_standing_armies:0 "Quân đội thường trực"
  innovation_standing_armies_desc:0 "Quân lính trưng binh mang lại cho chúng ta số lượng lớn binh sĩ, nhưng dù được huấn luyện và trang bị tốt đến đâu, họ vẫn kém hơn lính chuyên nghiệp. Việc thiết lập một quân đội thường trực lớn sẽ đảm bảo lợi ích của vương quốc được thực thi bởi những chiến binh tinh nhuệ nhất."

  innovation_sappers:0 "Công binh đào ngầm"
  innovation_sappers_desc:0 "Tường thành của kẻ địch có kiên cố đến đâu cũng vô nghĩa nếu mặt đất bên dưới có thể bị đào xuyên qua. Sử dụng công binh để phá hoại nền móng công sự là một cách hiệu quả để xuyên thủng ngay cả những tuyến phòng thủ cứng rắn nhất."

  innovation_plate_armor:0 "Giáp bản"
  innovation_plate_armor_desc:0 "Hình thức bảo vệ cá nhân tối thượng, một bộ giáp bản được chế tác tinh xảo có các khớp nối linh hoạt, cho phép phạm vi cử động vượt trội so với các loại giáp trước đây, đồng thời gần như không thể xuyên thủng bởi vũ khí của kẻ thù."

 #Civic

  innovation_primogeniture:0 "Trưởng nam thừa kế"
  innovation_primogeniture_desc:0 "Một vương quốc, một người thừa kế. Dù những người con trẻ hơn của quân chủ có thể cảm thấy bị bỏ rơi khi không được thừa kế, đây vẫn là cách tốt nhất để đảm bảo một vương quốc ổn định, không bị xé nát bởi khủng hoảng kế vị."

  innovation_cranes:0 "Cần cẩu"
  innovation_cranes_desc:0 "Một kỳ quan kỹ thuật bị lãng quên, người La Mã đã sử dụng cần cẩu bánh xe giẫm chân rất hiệu quả khi xây dựng đế chế của họ, và chúng ta cũng sẽ làm như vậy."

  innovation_noblesse_oblige:0 "Nghĩa vụ của giới quý tộc"
  innovation_noblesse_oblige_desc:0 "Quý tộc không chỉ là đặc quyền và quyền lợi; nó còn đi kèm với nghĩa vụ đối với vương quốc, trách nhiệm phải hành xử đúng mực và công bằng. Việc xác định rõ những gì được mong đợi từ tầng lớp tinh hoa sẽ cho chúng ta một lý tưởng để hướng tới và gắn kết mọi người trong quá trình đạt được nó."

  innovation_rightful_ownership:0 "Quyền sở hữu chính đáng"
  innovation_rightful_ownership_desc:0 "Việc sở hữu các vùng đất pháp lý của chúng ta là quyền thiêng liêng, và đã đến lúc thế giới phải công nhận điều đó. Chúng ta sẽ không còn bị kìm hãm bởi những nghi thức và phép tắc lỗi thời."

  innovation_ermine_cloaks: "Trang phục vương giả ngoại lai"
  innovation_ermine_cloaks_desc: "Bất kỳ ai cũng có thể xưng danh một tước vị, nhưng để trở thành một quân vương thực thụ, họ phải khơi dậy sự kính sợ và uy nghi nơi thần dân. Việc sử dụng những vật liệu hiếm có và ngoại lai nhất trong trang phục hoàng gia chắc chắn sẽ đạt được điều đó."

  innovation_ermine_cloaks_ermine: "Áo choàng lông chồn ermine"
  innovation_ermine_cloaks_ermine_desc: "Bất kỳ ai cũng có thể xưng danh một tước vị, nhưng để trở thành một quân vương thực thụ, họ phải khơi dậy sự kính sợ và uy nghi nơi thần dân. Những chiếc áo choàng lông ermine mới của chúng ta là một dạng trang phục vương giả chắc chắn sẽ đạt được điều đó."

  innovation_court_officials:0 "Quan chức triều đình"
  innovation_court_officials_desc:0 "Vương quốc của chúng ta đã mở rộng đến mức ngay cả các quý tộc nhỏ cũng không thể quản lý mọi thứ một cách hiệu quả. Việc bổ nhiệm các quan chức và viên lại triều đình để xử lý những công việc thường nhật sẽ đảm bảo bộ máy cai trị tiếp tục vận hành trơn tru."

  innovation_development_04:0 "Tư tưởng Phục Hưng"
  innovation_development_04_desc:0 "Những tiến bộ trong khoa học, triết học và logic đã biến các thành phố của chúng ta thành những trung tâm giáo dục và đổi mới kỳ diệu. Những bước nhảy vọt to lớn về công nghệ và văn hóa mà chúng ta đang đạt được đã đặt trong tầm tay tiềm năng chưa từng được mơ tới."

  innovation_currency_04:0 "Hối phiếu"
  innovation_currency_04_desc:0 "Là sự tiến hóa của các hệ thống ngân hàng trước đó, hối phiếu bằng giấy cho phép thần dân của chúng ta nhanh chóng và an toàn trao đổi hàng hóa và dịch vụ trên những khoảng cách xa, mà không bị đè nặng bởi tiền kim loại nặng nề."

 #Regional

  innovation_wierdijks:0 "Wierdijks"
  innovation_wierdijks_desc:0 "Xây dựng những con đê vững chắc và đáng tin cậy là nhiệm vụ thiết yếu nếu chúng ta muốn sinh sống và thịnh vượng ở vùng đất trũng thấp. Các kỹ thuật mới gia cố đê đất bằng thảm rong biển sẽ làm tăng độ bền và tuổi thọ của chúng."

  innovation_condottieri:0 "Condottieri"
  innovation_condottieri_desc:0 "Vừa giàu có vừa nằm ở vị trí trung tâm, Ý đã trở thành một điểm đến lớn cho các đoàn lính đánh thuê khi họ không tham gia chiến dịch. Vì họ đã có mặt tại đây, chúng ta có thể thương lượng mức giá tốt hơn so với bình thường."

  innovation_deccan_unity:0 "Thống nhất Deccan"
  innovation_deccan_unity_desc:0 "Làn sóng các tín ngưỡng và tôn giáo mới tràn vào xã hội của chúng ta đã cho thấy rằng sự tập trung vào chủ nghĩa khu vực trong quá khứ là một sai lầm. Chúng ta nên liên kết với những người cùng đức tin để bảo đảm một quốc gia vững mạnh và bền bỉ, đủ sức chống lại các áp lực từ bên ngoài."

  students_of_knighthood:1 "Những đứa trẻ hoàn thành [education|E] với [education_focus|E] [martial|E] sẽ nhận được [trait|E] $trait_education_martial_prowess$"

 # Sponsor Research Related
  fp3_innovation_mural_sextant: "Lục phân nghi gắn tường"
  fp3_innovation_mural_sextant_desc: "Những dụng cụ thiên văn cỡ lớn gắn cố định này có thể được dùng để đọc và đo đạc chính xác vị trí của các thiên thể."

  fp3_innovation_fritware: "Đồ gốm frit"
  fp3_innovation_fritware_desc: "Đồ gốm đá tinh xảo lấy cảm hứng từ sứ phương Đông, được tạo ra bằng cách trộn các vật liệu như thạch anh hoặc thủy tinh. Chúng vừa là hàng hóa có giá trị, vừa là những món quà ấn tượng."
  fp3_innovation_fritware_tooltip: "[opinion|E] nhận được từ [send_gift|E]: #P +20%#!"

 #################
 # The Silk Road #
 #################

  culture_parameter_silk_road_innovation_parameter: "Chỉ có thể đạt được như một [cultural_fascination|E] tiềm năng thông qua [GetCulturePillar('heritage_chinese').GetName] [heritage|E], [GetCultureTradition('tradition_sinophilic').GetName] [tradition|E], hoặc [silk_road|E]"

  innovation_fire_medicine: "Hỏa dược" # 'Huoyao,' 火藥
  innovation_fire_medicine_desc: "Đào sâu vào những bí ẩn của sự sống đôi khi lại khám phá ra những thứ chỉ tạo nên cái chết. Hỏa dược, một hỗn hợp mạnh gồm lưu huỳnh, diêm tiêu và vật liệu dễ cháy, tạo ra ngọn lửa chết chóc bùng cháy dữ dội, gần như mang tính nổ."

  innovation_champa_rice: "Lúa Champa"
  innovation_champa_rice_desc: "Lúa thường đòi hỏi nhiều thời gian và nước — ngoại trừ giống lúa Champa. Giống này sinh trưởng nhanh hơn, chịu hạn tốt hơn và cho năng suất dồi dào hơn hầu như mọi loại lúa khác từng được biết đến. Trong một số trường hợp, nó thậm chí có thể được thu hoạch hai vụ trong một năm. Nếu được quản lý đúng cách, giống lúa này có thể thúc đẩy nông nghiệp và tạo ra bùng nổ dân số."

  culture_parameter_champa_rice_wet_land_paddies: "Dòng [buildings|E] gồm [GetBuilding('paddy_fields_01').GetTypeName|V] và [GetBuilding('farm_estates_01').GetTypeName|V] có thể được xây dựng trên [GetTerrain( 'wetlands' ).GetName]"
  culture_parameter_champa_rice_building_bonuses: "Chuỗi [buildings|E] [GetBuilding('paddy_fields_01').GetTypeName|V] nhận thêm các lợi ích bổ sung"
  building_paddy_fields_requirement_terrain_tt: "Một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$[province|E] là [GetTerrain( 'terraced_hills' ).GetName]\n$EFFECT_LIST_BULLET$[province|E] là [GetTerrain( 'floodplains' ).GetName] và thuộc [GetGeographicalRegion('paddy_fields_region').GetName] [region|E]\n$EFFECT_LIST_BULLET$[province|E] là [GetTerrain( 'wetlands' ).GetName] và [culture|E] có #V $innovation_champa_rice$#! [innovation|E]\n$EFFECT_LIST_BULLET$[province|E] là [GetTerrain( 'hills' ).GetName] hoặc [GetTerrain( 'jungle' ).GetName] và [culture|E] có [GetCultureTradition('tradition_tgp_rice_cultivators').GetName|V] [tradition|E]"

  innovation_sericulture: "Nghề tơ tằm"
  innovation_sericulture_desc: "Nghệ thuật sản xuất lụa là một quy trình phức tạp nhưng mang lại lợi ích rất lớn, và kiến thức về nó được những người hưởng lợi từ ngành này giữ gìn hết sức nghiêm ngặt."
  culture_parameter_unlocks_silk_buildings_parameter: "Mở khóa chuỗi [domicile_buildings|E] [GetDomicileBuilding('silk_01').GetNameNoTooltip|V]"

  innovation_dragon_kiln: "Lò rồng"
  innovation_dragon_kiln_desc: "Loại sứ tốt nhất chỉ có thể được sản xuất tại những lò nung chuyên biệt cao, đặt gần các mỏ tài nguyên quý giá. Những lò này được xây dựng trên sườn dốc đứng, giúp tạo ra luồng nhiệt xoáy để nung những loại gốm cứng nhất. Dù khó xây dựng, sản phẩm của chúng lại là những món đồ gốm thời thượng nhất — và sinh lợi nhiều nhất — mà bất kỳ triều đình nào cũng biết đến."

  innovation_rocket_cart: "Xe hỏa tiễn"
  innovation_rocket_cart_chinese: "Huochē" # 火車 (Huǒchē)
  innovation_rocket_cart_koreanic: "Hwacha" # 火車 (화차)
  innovation_rocket_cart_desc: "Sử dụng các công thức thuốc nổ thô sơ hơn nhiều so với những gì cần cho pháo hạng nặng, những loạt mưa tên lửa khổng lồ có thể được bắn ra từ một thiết bị duy nhất. Vì các mũi tên lửa này vẫn chỉ gây sát thương như… một mũi tên, chúng phù hợp hơn nhiều để bắn #italic từ#! trên tường thành thay vì bắn #italic vào#! chúng."
  innovation_rocket_cart_chinese_desc: "$innovation_rocket_cart_desc$"
  innovation_rocket_cart_koreanic_desc: "$innovation_rocket_cart_desc$"

  innovation_compass: "La bàn"
  innovation_compass_desc: "Chỉ với một mẩu đá nam châm đơn giản, con người có thể luôn biết mình đang di chuyển theo hướng nào. Theo thời gian và với sự phát triển thêm, cuối cùng việc định hướng có thể trở nên khả thi mà không cần phải dừng lại hỏi đường."
  culture_parameter_cheaper_adventure_inspiration: "Chi phí [inspiration|E] Phiêu lưu: #P -50%#!"

  innovation_block_printing: "In khắc gỗ"
  innovation_block_printing_desc: "Bằng cách sử dụng một loạt các bản khắc gỗ, người ta có thể lắp ráp một hệ thống con dấu để tái sử dụng nhiều lần nhằm sao chép cùng một văn bản và hình ảnh lên bất kỳ vật liệu phù hợp nào. Điều này đơn giản hóa rất nhiều quy trình sản xuất sách, giảm chi phí và khiến chữ viết trở nên dễ tiếp cận hơn với mọi người."
  culture_parameter_block_printing_scriptorium_bonuses: "[SelectLocalization( HasDlcFeature( 'legends' ), 'culture_parameter_block_printing_scriptorium', 'blank_line' )]"
  culture_parameter_block_printing_scriptorium: "Chuỗi [buildings|E] [GetBuilding('scriptorium_01').GetTypeName|V] nhận thêm các lợi ích bổ sung"
  culture_parameter_block_printing_university_bonuses: "[SelectLocalization( HasDlcFeature( 'wards_and_wardens' ), 'culture_parameter_block_printing_university_bonuses_text', 'blank_line' )]"
  culture_parameter_block_printing_university_bonuses_text: "Chi phí tài liệu học tập của [GetActivityType('activity_adult_education').GetName]: #P -50%#!"

  innovation_grenades: "Lựu đạn"
  innovation_grenades_desc: "Bất chấp mọi tiến bộ trong chiến tranh, một công cụ cổ xưa vẫn vô cùng hữu dụng: cánh tay con người. Những vật chứa nhỏ nhồi chất dễ cháy hoặc chất nổ có thể dễ dàng chế tạo và được ném bởi bất kỳ ai có kỹ năng ném khá. Việc phát lựu đạn cho binh sĩ trước trận chiến mang lại cho họ một phương thức tấn công phụ để gây sốc cho kẻ thù."

  innovation_cupellation: "Luyện Kim Tách Bạc"
  innovation_cupellation_desc: "Những lò nung nhiệt độ cao chuyên dụng có thể nung chảy kim loại quý từ các mẫu khai khoáng, tách chúng ra khỏi quặng đã luyện và tạo ra mẫu tinh luyện để các giám định viên tiếp tục kiểm tra. Việc luyện quặng từ mỏ chì là cách tốt nhất để xác định hàm lượng bạc của mỏ đó, và luyện vàng có thể xác định độ tinh khiết của nó cho việc đúc tiền."
  culture_parameter_cupellation_mine_building_bonuses: "[baronies|E] có #V Mỏ#! [special_building|E] [holding|E] [taxes|E]: #P @gold_icon![EmptyScope.ScriptValue('innovation_cupellation_mine_tax_bonus_value')|%0+=]#! "

  innovation_lacquered_armor: "Giáp Sơn Mài"
  innovation_lacquered_armor_desc: "Việc phủ cẩn thận các loại nhựa đặc biệt lên giáp giúp tăng độ bền đáng kể và chống chịu thời tiết cho các tấm sắt nặng. Dù kỹ thuật này đã được biết đến từ lâu, nó chủ yếu chỉ dùng cho hộp, chai và các vật dụng khác. Giáp sơn mài mở ra một phương thức mới để bảo vệ cả binh sĩ lẫn trang bị của họ."
  culture_parameter_higher_quality_armor_artifacts_parameter: "Giáp [artifacts|E] từ [sponsored|E] [inspirations|E] và [GetDecision('commission_artifact_decision').GetName] có Chất lượng cao hơn"

  innovation_double_entry_bookkeeping: "Kế Toán Kép"
  innovation_double_entry_bookkeeping_desc: "Sổ sách phải theo kịp sự phức tạp ngày càng tăng của tài chính và kinh tế. Ghi chép riêng biệt mọi khoản thu vào và chi ra giúp duy trì bảng cân đối đáng tin cậy và đảm bảo không có khoản nào bị bỏ sót — hay "vô tình" bỏ sót — khi kiểm tra sổ sách."
  culture_parameter_bookkeeping_collect_taxes_bonus: "$task_collect_taxes$ [councillor_task|E]: [gold_i|E]#P +10%#!"

  innovation_waterworks: "Công Trình Thủy Lợi"
  innovation_waterworks_desc: "Nước là nguồn sống, nhưng còn có nhiều công dụng ngoài việc giải khát hay tưới tiêu. Khi được khai thác khéo léo, nguồn tài nguyên từ trời này có thể vận hành những cỗ máy mạnh hơn nhiều lần so với gia súc, tạo điều kiện cho giao thương qua các kênh đào nhân tạo, hoặc đơn giản là giữ cho phố xá đông đúc luôn sạch sẽ và đáng sống."
  culture_parameter_unlocks_waterworks_buildings: "Mở khóa chuỗi [GetBuilding('waterworks_01').GetTypeName|V] [buildings|E]"

  innovation_tiefutu: "$tiefutu$"
  innovation_tiefutu_desc: "$tiefutu_flavor$"

  innovation_bulkheads: "Vách Ngăn Kín Nước"
  innovation_bulkheads_desc: "Cách chắc chắn nhất để tàu không chìm là không để thân tàu bị thủng ngay từ đầu. Nhưng nếu điều đó xảy ra, con tàu vẫn có thể được cứu nếu thân tàu được chia thành các khoang với các vách ngăn kín nước giữa chúng. Ngay cả khi bị hư hại, vách ngăn có thể ngăn nước làm chìm toàn bộ con tàu, cứu lấy con người, vật tư và chính con tàu."

  innovation_coking: "Luyện Than Cốc"
  innovation_coking_desc: "Than củi là yếu tố thiết yếu trong nghề rèn, nhưng cần rừng lớn để tạo ra. Than đá, khi được nung trong lò tương tự lò than củi, có thể chuyển thành than cốc. Than cốc hữu dụng không kém than củi trong rèn và các lò công nghiệp khác, mà không cần phá rừng quy mô lớn."
  culture_parameter_coking_smith_bonuses: "Chuỗi [GetBuilding('smiths_01').GetTypeName|V] và [GetBuilding('blacksmiths_01').GetTypeName|V] [buildings|E] nhận thêm бонус"

  innovation_composite_crossbow: "Nỏ Hợp Chất"
  innovation_composite_crossbow_desc: "Giống như cung thường, sức mạnh của cánh cung quyết định lực bắn. Bằng cách gia cố bằng sừng hoặc thậm chí thép, lực kéo, tầm bắn và sức mạnh của nỏ có thể vượt xa các loại gỗ thông thường, đồng thời tăng độ bền và tuổi thọ."

  innovation_pharmacopoeia: "Dược Điển"
  innovation_pharmacopoeia_desc: "Một thầy thuốc giỏi cần biết cách bào chế đúng thuốc, đúng lúc, với đúng nguyên liệu và liều lượng thích hợp. Dù kiến thức này thường truyền từ thầy sang trò, #italic việc ghi chép lại#! cách làm thuốc cụ thể giúp chuẩn hóa và phổ biến phương pháp điều trị hiệu quả hơn."
  culture_parameter_physician_pharmacopoeia_bonus: "[GetCourtPositionType('court_physician_court_position').GetName()] [court_position|E] Hiệu quả Điều trị: #P +20%#!"

