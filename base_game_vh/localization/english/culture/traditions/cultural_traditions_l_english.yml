  culture_emergence_events.0001.t:0 "Sự Giao Thoa Văn Hóa"
  culture_emergence_events.0001.desc:0 "Ta là người [ROOT.Char.GetCulture.GetName], nhưng dân cư tại thủ đô của ta — [capital_county_scope.GetBaseName] — lại là [hybdridization_offer_culture.GetName]. Gần đây, ta nhận thấy các thần dân [hybdridization_offer_culture.GetNameNoTooltip] đang noi theo ta và phong tục của người [ROOT.Char.GetCulture.GetNameNoTooltip].\n\nHọ đang hòa trộn các truyền thống của chúng ta. Có cái cũ, có cái mới — nhưng quan trọng nhất là họ ngày càng chấp nhận sự cai trị của ta hơn!\n\nCó lẽ sự phát triển này nên được khuyến khích?"
  culture_emergence_events.0001.a:0 "Nếu họ hành xử như ta, thì ta cũng sẽ hành xử như họ. Chẳng mấy chốc chúng ta sẽ như là một."
  culture_emergence_events.0001.b:0 "Sự ngưỡng mộ đó là đủ!"
  cultural_acceptance_gain_event:0 "Từ sự kiện"
  cultural_acceptance_loss_event:0 "Từ sự kiện"
  new_hybrid_culture_tt:0 "Một [hybrid_culture|E] sẽ xuất hiện, kết hợp các [traditions|E] và [culture_pillars|E] từ cả [ROOT.Char.GetCulture.GetName] và [hybdridization_offer_culture.GetName] [cultures|E]."
  culture_emergence_events.0001.existing_hybrid:0 "Ngài và lãnh thổ của mình sẽ chấp nhận [existing_hybrid_culture.GetName] [culture|E]"
  culture_emergence_events.0001.new_hybrid:0 "Ngài và lãnh thổ của mình sẽ chấp nhận một [hybrid_culture|E] mới xuất hiện"
 
  culture_emergence_events.0002.t:0 "Một Bản Sắc Mới"
  culture_emergence_events.0002.desc:0 "Dân tộc của ta — những [ROOT.Char.GetCulture.GetCollectiveNoun] — là một cộng đồng rộng lớn và đầy tự hào.\n\nTuy vậy, dù có nhiều điểm tương đồng, ta không thể phủ nhận rằng các thần dân dưới quyền ta đã bắt đầu hành xử khác với những [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ở nơi khác. Đôi khi thậm chí còn xảy ra xung đột giữa các nhóm [ROOT.Char.GetCulture.GetNameNoTooltip] ghé thăm và những người sống dưới sự cai trị của ta.\n\nChúng ta đang hình thành một bản sắc mới — chúng ta là [ROOT.Char.GetCulture.GetNameNoTooltip], nhưng đồng thời cũng không hoàn toàn như vậy. Có lẽ sự phát triển này nên được khuyến khích?"
  culture_emergence_events.0002.a:0 "Chúng ta sẽ xây dựng một bản sắc mới, mạnh mẽ hơn!"
  culture_emergence_events.0002.b:0 "Chúng ta là [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] và không là gì khác! Vào khuôn phép!"
  new_divergent_culture_tt:0 "Một [divergent_culture|E] sẽ xuất hiện, giữ lại phần lớn [traditions|E] và [culture_pillars|E] của [ROOT.Char.GetCulture.GetName] [culture|E], nhưng có [ethos|E] mới và một số Truyền thống bị thay thế."
  culture_emergence_events.0002.new_divergence:0 "Ngài và lãnh thổ của mình sẽ chấp nhận một [divergent_culture|E] mới"
  culture_emergence_events.vassals:0 "[vassals|E] có thể tham gia hoặc không"
 
  culture_emergence_events.0003.desc:0 "[culture_check_2.GetName]\n[duchy_title.GetName]\n[diverge_dummy.GetFullName]"

  culture_emergence_events.0005.t: "Khúc Lãng Mạn của Romansh"
  culture_emergence_events.0005.desc: "Trong khi [county_scope.GetNameNoTierNoTooltip] đang ăn mừng sự xuất hiện của [new_culture_scope.GetName], ta nhận thấy rằng một số người dân #italic quê mùa#! nơi đây vẫn nói một phương ngữ không hoàn toàn giống như ta nghĩ về [new_culture_scope.GetNameNoTooltip].\n\nMột nông dân đứng gần con đường khi ta đi ngang qua, đang trò chuyện với ai đó ngoài đồng. \"Ngươi kia!\" ta quát lớn. \"Rốt cuộc thứ tiếng ngươi nói là gì vậy?\"\n\nNgười [rustic_peasant.GetWomanMan] dừng lại. \"Ta đoán là,\" [rustic_peasant.GetSheHe] chậm rãi trả lời bằng [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], \"chúng Ta chỉ gọi nó là #italic Romansh#! thôi.\"\n\n'Romansh,' ư? Đây mới thực sự là con người của dân ta sao?"
  culture_emergence_events.0005.a: "Lưỡi nói của chúng ta phải Romansh như chính trái tim mình."
  culture_emergence_events.0005.a.tt: "[new_culture_scope.GetNameNoTooltip] sẽ #bold chỉ#! sử dụng tên Romansh"
  culture_emergence_events.0005.b: "Romansh sẽ trở thành một phần trong bức khảm của [new_culture_scope.GetName]."
  culture_emergence_events.0005.b.tt: "[new_culture_scope.GetNameNoTooltip] sẽ sử dụng tên Romansh #bold bổ sung#! bên cạnh các tên hiện có"
  culture_emergence_events.0005.c: "Thứ tiếng của lũ nông dân này chẳng có giá trị gì với [new_culture_scope.GetName]!"
  culture_emergence_events.0005.c.tt: "[new_culture_scope.GetNameNoTooltip] sẽ giữ nguyên như hiện tại"
 
