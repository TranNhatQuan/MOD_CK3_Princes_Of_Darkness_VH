  recruit_dry_specialist_decision:0 "Chiêu Mộ Tướng Chuyên Địa Hình Khô"
  recruit_dry_specialist_decision_desc:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] quen với nắng gắt, rong ruổi khắp nơi dưới ánh hào quang thiêu đốt. Nếu ta muốn di chuyển quân mà không khiến họ bỏ mạng dưới nắng, phải nhờ chỉ dẫn của họ."
  recruit_dry_specialist_decision.tt:0 "Một [commander|E] cao [martial|E] mang [GetTrait('desert_warrior').GetName( GetNullCharacter )] [trait|E] gia nhập [court|E]"
