  remove_marriage_traditions:0 "[culture|E] [culture_scope.GetName] sẽ mất mọi [traditions|E] liên quan đến [marriage|E] vốn xung đột với [doctrines|E] của [faith_scope.GetName]"
  culture_tradition_events.0100.t:0 "Xung Đột Giữa Văn Hóa và Đức Tin"
  culture_tradition_events.0100.desc:0 "Một bức thư từ [head_of_faith.GetTitledFirstName] vừa được gửi tới. Mở đầu là những lời xã giao, tiếp đó là việc nhấn mạnh tầm quan trọng của ta trong mắt người dân [culture_scope.GetName].\n\n"
  culture_tradition_events.0100.tradition_monogamous:0 "\"Ngươi phải hiểu rằng, chừng nào dân của ngươi còn thực hành chế độ một vợ một chồng, thì ngươi vẫn đang vi phạm giáo lý của [faith_scope.GetAdjective]! Ta chỉ mong sự cứu rỗi cho ngươi. Bổn phận của một tín đồ [faith_scope.GetAdjectiveNoTooltip] chân chính không thể hoàn thành chỉ với một người phối ngẫu.\" bức thư viết."
  culture_tradition_events.0100.tradition_polygamous:0 "\"Việc ngươi thực hành chế độ đa thê hoàn toàn đối nghịch với giáo lý của [faith_scope.GetAdjective], và là tội lỗi trước mắt [faith_scope.HighGodName]! Ta chỉ mong sự cứu rỗi cho ngươi. Hãy dẫn dắt dân ngươi bước ra ánh sáng và từ bỏ những người phối ngẫu dư thừa!\" bức thư viết."
  culture_tradition_events.0100.tradition_concubines:0 "\"Việc duy trì thê thiếp không được giáo lý [faith_scope.GetAdjective] ủng hộ; chỉ thông qua hôn nhân chính danh thì [faith_scope.HighGodName] mới mỉm cười với dân ngươi! Ta chỉ mong sự cứu rỗi cho ngươi. Hãy từ bỏ thê thiếp, vì lợi ích của tất cả chúng ta.\" bức thư viết."
  culture_tradition_events.0100.end:0 "\n\nQuả là một nan đề... Ta coi trọng điều gì hơn — phong tục của dân ta, hay giáo lý của đức tin?"
  culture_tradition_events.0100.a:0 "Chúng ta phải tuân theo giáo lý [faith_scope.GetAdjectiveNoTooltip]."
  culture_tradition_events.0100.b:0 "Phong tục của dân ta quan trọng hơn!"

  culture_tradition_events.0101.t:0 "Tâm Trí Kẻ Huyền Bí"
  culture_tradition_events.0101.desc:0 "Thật hiếm hoi để ta có được một bữa ăn yên tĩnh mà không bị bọn nịnh thần hay quốc sự làm phiền, nhưng tối nay ta đã làm được. Một bữa tối nhẹ nhàng, tĩnh lặng, và cơ hội để đôi tai xã giao của ta được nghỉ ngơi.\n\nChỉ trong chớp mắt, cánh cửa bật tung khỏi bản lề với một sự tất yếu đầy bi kịch, và một [mendicant_mystic.GetFaith.PriestNeuter] hành khất xông thẳng vào phòng. [mendicant_mystic.GetSheHe|U] cầm theo một cây gậy đi đường gồ ghề, vẫn còn dính đầy mảnh gỗ vụn do vừa phá cửa chỉ bằng một cú quật duy nhất.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] cao quý, ta đến đây với một lời đề nghị! Với một khoản thù lao nho nhỏ, ta, #EMP [mendicant_mystic.GetFirstName]#!, sẽ truyền dạy tri thức về những lề thói cổ xưa của dân tộc ta cho các hài nhi trong triều đình của ngài!\""
  culture_tradition_events.0101.a:0 "Dĩ nhiên rồi, thưa [mendicant_mystic.GetFaith.PriestNeuter] cao quý. Làm ơn hạ cây gậy xuống."
  culture_tradition_events.0101.a.tt:0 "Tất cả [children|E] hiện có tại [court|E] đều được tăng tiến trong quá trình [education|E] đang theo học"
  culture_tradition_events.0101.b:0 "Chẳng phải việc này hơi quá đà đối với công việc của [mendicant_mystic.GetFaith.HighGodNamePossessive] sao?"
  culture_tradition_events.0101.b.tt.success:0 "Ngài thương lượng khiến vị huyền sĩ nhượng bộ"
  culture_tradition_events.0101.b.tt.failure:0 "Vị huyền sĩ rời khỏi triều đình của Ngài trong phẫn nộ"
  culture_tradition_events.0101.c:0 "Cút đi, đồ ăn mày, ta đang ăn tối!"

  culture_tradition_events.0111.t:0 "Bài Thuyết Giảng Của Kẻ Huyền Bí"
  culture_tradition_events.0111.desc:0 ""...đó là lý do vì sao chúng ta phải dâng mình cho lòng nhân từ của [mendicant_mystic.GetFaith.HighGodName] trong từng khoảnh khắc của mỗi ngày trong cuộc đời. Ngươi hiểu chứ? Ta có nên tiếp tục không?"\n\nHai. Tiếng. Đồng. Hồ.\n\nTa thậm chí còn không biết [mendicant_mystic.GetName] đã tìm cách vào được phòng của ta bằng cách nào, nhưng [mendicant_mystic.GetFaith.PriestNeuter] này đã giảng giải cho ta về những điểm tinh túy trong thần học [mendicant_mystic.GetFaith.GetName] suốt #EMP hai. Tiếng. Đồng. Hồ.#!\n\nCuối cùng, [mendicant_mystic.GetWomanMan] cũng im lặng, nhìn ta chờ đợi một câu trả lời. Ta cảm thấy mí mắt mình bắt đầu giật giật."
  culture_tradition_events.0111.a:0 "Thật là những lời lẽ truyền cảm hứng!"
  culture_tradition_events.0111.b:0 "Ngươi nói đủ rồi, giờ đến lượt ta..."
  culture_tradition_events.0111.a.tt.success:0 "Ngài đập tan lập luận của vị huyền sĩ"
  culture_tradition_events.0111.a.tt.failure:0 "Ngài vấp váp trong lời nói"
  culture_tradition_events.0111.c:0 "Ai cho tên lang thang này vào nhà ta? Lính đâu! CỨU!"

  culture_tradition_events.0121.t:0 "Sự Phụng Sự Của Kẻ Huyền Bí"
  culture_tradition_events.0121.desc:0 "Gần như trái với tính cách thường thấy trong nghề nghiệp của [mendicant_mystic.GetHerHis], [mendicant_mystic.GetFirstName] đã kiên nhẫn chờ đợi trong phòng chờ cho đến khi ta có thể tiếp kiến [mendicant_mystic.GetHerHim].\n\n[The mendicant_mystic.GetFaith.PriestNeuter] dường như có chút lo lắng khi ta bước vào, nhưng vẫn lập tức bắt đầu một bài diễn thuyết vội vã ngay khi ta xuất hiện.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đã là một người hành khất trong một thời gian, và dù đây là công việc của [mendicant_mystic.GetFaith.HighGodNamePossessive], nó cũng bào mòn tâm trí và thể xác chẳng kém gì việc nuôi dưỡng tâm hồn.\"\n\n\"Nếu ngài chấp nhận ta, ta sẽ treo cây trượng của kẻ lữ hành lên và phục vụ ngài tại triều đình bằng tất cả khả năng của mình. N-ngài có nhận ta vào không?\""
  culture_tradition_events.0121.a:0 "Ta quả thực có thể tận dụng tài năng của một [mendicant_mystic.GetWomanMan] như ngươi..."
  culture_tradition_events.0121.b:0 "Một [mendicant_mystic.GetFaith.PriestNeuter] trung thành, ngươi nói sao..."
  culture_tradition_events.0121.c:0 "Với cái bộ dạng đó, lại còn #EMP bốc mùi#! như vậy, mà ngươi muốn sống ở đây ư?"

  culture_tradition_events.0131.t:0 "Cơn Thịnh Nộ Của Kẻ Huyền Bí"
 # Big credit to the greatest NPC of 2011.
  culture_tradition_events.0131.desc:0 ""[ROOT.Char.GetTitleAsNameNoTooltip] ư? Ngươi chỉ là một con sâu bọ, #EMP đang quằn quại trong vũng lầy của chính sự tha hóa của mình#!! Hãy sám hối tội lỗi của ngươi trước [mendicant_mystic.GetFaith.HighGodName]! [mendicant_mystic.GetFaith.HighGodName] Đấng Toàn Năng! [mendicant_mystic.GetFaith.HighGodName] Đấng Không Sai Lầm! [mendicant_mystic.GetFaith.HighGodName] Đấng Bất Khả Xâm Phạm!"\n\nKhốn kiếp và đáng nguyền rủa tên [mendicant_mystic.GetFaith.PriestNeuter] phiền nhiễu này. Mọi chuyện đã đủ tệ khi [mendicant_mystic.GetSheHe] còn đứng ở góc phố! Nếu ta #EMP có thể#! tìm ra kẻ đã để [mendicant_mystic.GetFirstName] bước vào #EMP nhà#! của ta, ta sẽ móc mắt hắn; [mendicant_mystic.GetSheHe] mới ở đây chưa đầy mười phút mà ta đã bắt đầu đau đầu dữ dội.\n\nTa không thể chịu đựng thêm bài công kích của kẻ hành khất này nữa, ta phải hành động thật nhanh trong lúc [mendicant_mystic.GetHerHis] lời lẽ đang tạm thời ngừng lại."
  culture_tradition_events.0131.a:0 "#EMP Tội lỗi của ta#! ư? Vậy hãy nói về #EMP chính ngươi#! xem nào."
  culture_tradition_events.0131.a.tt.success:0 "Ngài chứng minh vị huyền sĩ chỉ là một kẻ đạo đức giả trắng trợn"
  culture_tradition_events.0131.a.tt.failure:0 "Vị huyền sĩ khiến Ngài trông như một kẻ ngu xuẩn"
  culture_tradition_events.0131.b:0 "Ngài... ngài có thể dạy ta trở nên tốt hơn không?"
  culture_tradition_events.0131.b.tt.success:0 "Vị huyền sĩ giúp Ngài vượt qua những khiếm khuyết của bản thân"
  culture_tradition_events.0131.b.tt.failure:0 "Ngài bị nhấn chìm trong dày vò tinh thần"
  culture_tradition_events.0131.c:0 "#EMP Quằn quại trong vũng bẩn?#! Ném tên điên này xuống hố phân gần nhất!"

  culture_tradition_events.0141.t:0 "Giao Kèo Của Kẻ Huyền Bí"
  culture_tradition_events.0141.desc:0 "\"Chẳng lẽ ngài không thấy sao, [ROOT.Char.Custom('FormOfAddressForLiege')], rằng ngài đang đem linh hồn mình ra đánh cược với cái gọi là tín ngưỡng [ROOT.Char.GetFaith.GetName] đó? Hãy để ta dẫn dắt ngài bước vào ánh sáng của đức tin chân chính [mendicant_mystic.GetFaith.GetAdjective], và cứu rỗi ngài khỏi khổ đau vĩnh hằng!\"\n\nLà một [mendicant_mystic.GetFaith.PriestNeuter] hành khất, [mendicant_mystic.GetFirstName] đã quá quen với việc giảng đạo cho đám dân [ROOT.Char.GetCulture.GetName] không tin giáo, nhưng những chiêu thức hiệu quả với thường dân chưa chắc đã thuyết phục được giới quý tộc.\n\nSự im lặng bao trùm giữa chúng ta, và ta nhận ra mình đang chăm chú nhìn sâu vào đôi mắt của vị [mendicant_mystic.GetWomanMan], nơi những tia hy vọng và khát khao lấp lánh, nhảy múa phía sau ánh nhìn ấy."
  culture_tradition_events.0141.a:0 "Ta thấy lời nói của ngươi rất thuyết phục, thưa [mendicant_mystic.GetFaith.PriestNeuter]."
  culture_tradition_events.0141.b:0 "Hãy để ta làm sáng tỏ những giá trị của đức tin [ROOT.Char.GetFaith.GetNameNoTooltip]..."
  culture_tradition_events.0141.b.tt.success:0 "Ngài khai sáng cho [mendicant_mystic.GetFirstNameNoTooltip]"
  culture_tradition_events.0141.b.tt.failure:0 "Hai bên vẫn bất đồng gay gắt"
  culture_tradition_events.0141.c:0 "[mendicant_mystic.GetFaith.HighGodName] của ngươi à? Vậy [mendicant_mystic.GetFaith.HighGodNameSheHe|U] có bao nhiêu quân lính?"

 #EP2 Traditions
  tradition_ep2_avid_falconers_name:0 "Những Bậc Thầy Săn Chim Ưng"
  tradition_ep2_avid_falconers_desc:0 "Nghệ thuật nhân giống, huấn luyện và săn bắn bằng các loài chim săn mồi như chim ưng hay diều hâu là một trong những thú vui danh giá bậc nhất của tầng lớp tinh hoa trong nền văn hóa này."
  culture_parameter_falconer_traits_more_common:0 "[characters|E] dễ đạt được [trait_level_track_xp|E] Thợ Săn Chim Ưng hơn"
  culture_parameter_forest_hunt_success_chance:0 "Tăng [hunt_success_chance|E] tại [GetTerrain( 'forest' ).GetName] và [GetTerrain( 'taiga' ).GetName]"
  culture_parameter_hills_hunt_success_chance:0 "Tăng [hunt_success_chance|E] tại [GetTerrain( 'hills' ).GetName]"
  culture_parameter_desert_hunt_success_chance:0 "Tăng [hunt_success_chance|E] tại [GetTerrain( 'desert' ).GetName] và [GetTerrain( 'oasis' ).GetName]"
