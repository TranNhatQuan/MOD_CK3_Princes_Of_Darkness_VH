  appoint_podesta_interaction:0 "Bổ nhiệm Giám sát Cộng hòa"
  appoint_podesta_desc:0 "Bổ nhiệm [recipient.GetShortUINameNoTooltip] giám sát thành phố đang phát triển [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], biến [recipient.GetHerHim] thành một chư hầu Cộng hòa."
  REQUEST_REPUBLIC_TEXT:0 "Xin chào, [actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] của ta. Trong một thời gian, đã rõ ràng rằng phần giàu có nhất trong lãnh thổ ngươi cai trị chính là cộng đồng đô thị nằm trong đó. Ta mời ngươi đảm nhận nhiệm vụ giám sát nền Cộng hòa đang lớn mạnh này nhân danh ta."
  spar_with_knight_interaction.effect.tt:0 "Có thể nhận được hiệu ứng có lợi"
