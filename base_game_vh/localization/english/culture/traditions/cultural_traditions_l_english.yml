  culture_parameter_mandala_tributaries: "[decision|E] [GetDecision('convert_to_mandala_government_decision').GetName] biến toàn bộ [confederates|E] thành [tributaries|E]"
  culture_parameter_confederation_tribal_authority: "Có thể tăng [tribal_authority|E] ngay cả khi đang trong một [confederation|E]"
  confederates_to_tributaries_tt: "Toàn bộ [confederates|E] trở thành [tributaries|E] của Ngài"
