  recruit_dry_specialist_decision_confirm:0 "$invite_knights_decision_confirm$"
 
  recruit_hill_specialist_decision:0 "Chiêu Mộ Tướng Chuyên Đồi"
  recruit_hill_specialist_decision_desc:0 "[ROOT.Char.GetCulture.GetCollectiveNoun] quen sống nơi đồi núi, chăn dắt gia súc và trấn áp thú dữ. Không thiếu người tài giỏi dẫn quân qua địa hình hiểm trở như vậy."
  recruit_hill_specialist_decision.tt:0 "Một [commander|E] cao [martial|E] mang [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] [trait|E] gia nhập [court|E]"
  recruit_hill_specialist_decision_tooltip:0 "$recruit_hill_specialist_decision.tt$"
  recruit_hill_specialist_decision_confirm:0 "$invite_knights_decision_confirm$"
 
  recruit_jungle_specialist_decision:0 "Chiêu Mộ Tướng Chuyên Rừng Nhiệt Đới"
  recruit_jungle_specialist_decision_desc:0 "Rừng rậm hiểm trở và nguy khốn — nhưng nhân dân ta, [ROOT.Char.GetCulture.GetCollectiveNoun], đã thuần thục cách đi lại nơi đó. Các lữ tướng lão luyện sẵn sàng dẫn quân qua chốn rậm rạp đầy mối nguy."
  recruit_jungle_specialist_decision.tt:0 "Một [commander|E] cao [martial|E] mang [GetTrait('jungle_stalker').GetName( GetNullCharacter )] [trait|E] gia nhập [court|E]"
  recruit_jungle_specialist_decision_tooltip:0 "$recruit_jungle_specialist_decision.tt$"
  recruit_jungle_specialist_decision_confirm:0 "$invite_knights_decision_confirm$"

  recruit_open_specialist_decision:0 "Chiêu Mộ Tướng Chuyên Thảo Nguyên"
  recruit_open_specialist_decision_desc:0 "Nơi đồng cỏ mênh mông, việc cơ động gần như không bị cản trở, [ROOT.Char.GetCulture.GetCollectiveNoun] thành thạo cách khai thác. Trong hàng ngũ, ta dễ dàng tìm ra tướng biết dùng quân để vây hãm và bao vây."
  recruit_open_specialist_decision.tt:0 "Một [commander|E] cao [martial|E] mang [GetTrait('open_terrain_expert').GetName( GetNullCharacter )] [trait|E] gia nhập [court|E]"
