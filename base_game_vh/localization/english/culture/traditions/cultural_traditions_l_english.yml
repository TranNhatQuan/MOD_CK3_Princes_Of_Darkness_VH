  sparring_sprained_ankle_modifier:0 "Đấu tập: Bong gân mắt cá"
  culture_tradition_events.0002.t:0 "Đấu tập với [GetPlayer.Custom( 'KnightCultureNoTooltip' )]: Kết thúc"
  culture_tradition_events.0002.desc:0 "Ta hạ vũ khí xuống và quay sang [recipient.GetTitledFirstName], dành cho [recipient.GetHerHim] một tràng pháo tay theo nghi thức. [recipient.GetSheHe|U] cũng làm điều tương tự.\n\n"
  culture_tradition_events.0002.desc_actor_victor_good:0 "\"Đánh hay lắm, thưa [actor.GetTitleTierName|U]! Ngài đã thắng Ta một cách công bằng.\" [recipient.GetFirstNameNoTooltip] nói.\n\"Buổi luyện tập này chắc chắn sẽ giúp ích nếu chiến tranh nổ ra trong tương lai của [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\"\n\nThật sảng khoái, ta cảm thấy khỏe khoắn và sẵn sàng!"
  culture_tradition_events.0002.desc_actor_victor_bad:0 "\"Đánh hay lắm, thưa [actor.GetTitleTierName|U], Ta hoàn toàn bại trận.\" [recipient.GetFirstNameNoTooltip] rên rỉ.\n\"Nhưng xin nhớ, đừng để chiến thắng này làm ngài kiêu ngạo. Ta không phải kẻ thù của ngài — họ vẫn còn ngoài kia.\"\n\nHừm! Ta vẫn thấy ổn!"
  culture_tradition_events.0002.desc_recipient_victor_good:0 "\"Đánh hay lắm, thưa [actor.GetTitleTierName|U], ván này Ta thắng!\" [recipient.GetFirstNameNoTooltip] nói với giọng hào sảng. \"Giờ thì chúng ta đã sẵn sàng đối mặt với mọi thử thách!\"\n\nQuả đúng vậy — có lẽ ta nên cân nhắc cuộc chinh phạt tiếp theo?"
  culture_tradition_events.0002.desc_recipient_victor_bad:0 "\"Đánh hay lắm, thưa [actor.GetTitleTierName|U]. Ta xin lỗi nếu đã làm ngài bị thương. Trong khoảnh khắc đó Ta như rơi vào trạng thái xuất thần — Ta và vũ khí hòa làm một...\" [recipient.GetFirstNameNoTooltip] áy náy nói.\n\"Có lẽ ngài nên nghỉ ngơi một chút?\"\n\nVớ vẩn, ta khỏe như trâu!"
  culture_tradition_events.0002.a:0 "Một trận đấu hay!"
  culture_tradition_events.0002.b:0 "Dù thua, nhưng đó là buổi huấn luyện tốt!"
 
