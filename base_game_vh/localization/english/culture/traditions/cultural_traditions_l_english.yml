  tradition_tgp_religious_hospitality_name: "Hiếu Khách Tôn Giáo"
  tradition_tgp_religious_hospitality_desc: "Nền văn hóa này khéo léo dung hòa các tôn giáo ngoại lai với phong tục bản địa, hình thành nên một xã hội mang tính quốc tế cao, nơi nhiều đức tin cùng chung sống hòa bình. Điều này chủ yếu đạt được thông qua thương mại và quan hệ đối ngoại."
