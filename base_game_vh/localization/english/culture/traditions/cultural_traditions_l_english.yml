  culture_parameter_permafrost_modifier_removal_condition: "#V $mpo_siberian_permafrost_modifier$#! [modifier|E] có thể được loại bỏ bằng [decision|E] #V $expand_the_steppe_decision_generic$#! hoặc [interaction|E] #V $feudalize_holding_interaction$#! hoặc [interaction|E] #V $demand_admin_interaction$#!"
