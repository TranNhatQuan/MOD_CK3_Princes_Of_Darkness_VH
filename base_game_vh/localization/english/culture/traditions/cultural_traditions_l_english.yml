  culture_parameter_permafrost_unlock_tribal_building: "Nâng cấp [building|E] [tribal|E] không yêu cầu [innovations|E] tại [counties|E] của [culture|E] này nếu có [modifier|E] #V $mpo_siberian_permafrost_modifier$#!"
