l_english:
 # Ethoses
  ethos_bellicose_name:0 "Hiếu chiến"
  ethos_bellicose_desc:1 "Nền văn hóa này coi xung đột và bạo lực là những trạng thái tồn tại tất yếu; trong con người họ ăn sâu ý niệm rằng mỗi người phải đứng lên và chiến đấu để bảo vệ chính mình."
  ethos_stoic_name:0 "Khắc kỷ"
  ethos_stoic_desc:1 "Nền văn hóa này tin vào việc đứng vững như núi, đón nhận mọi gian khổ mà cuộc đời ném tới và chịu đựng tất cả bằng ý chí lạnh lùng cùng tinh thần bất khuất."
  ethos_bureaucratic_name:1 "Quan liêu"
  ethos_bureaucratic_desc:2 "Không có nền văn hóa nào tồn tại lâu hơn bản ghi chép cổ xưa nhất của nó, và nền văn hóa này tin vào việc sổ sách được ghi chép tỉ mỉ đến mức có thể bảo đảm sự bất tử."
  ethos_spiritual_name:0 "Tâm linh"
  ethos_spiritual_desc:1 "Trong khi một số nền văn hóa hướng tới chiến tranh và những nền văn hóa khác tìm kiếm tri thức thế tục, nền văn hóa này đặt niềm tin vào thứ duy nhất bất biến xuyên suốt lịch sử của họ — thần linh. Tâm linh là con đường duy nhất để tiến bước trong một thế giới khắc nghiệt và thờ ơ."
  ethos_courtly_name:1 "Nghi lễ"
  ethos_courtly_desc_nhc:1 "Nghi thức của đời sống triều đình ăn sâu đến mức trở thành một phần cốt lõi trong hành vi xã hội của con người. Mỗi người đều có vị trí của mình, và ai cũng ở đúng vị trí đó."
  ethos_egalitarian_name:0 "Bình đẳng"
  ethos_egalitarian_desc:1 "Sự bất dung và chủ nghĩa biệt lập có thể là con đường của kẻ khác, nhưng nền văn hóa này nhận ra rằng chấp nhận khác biệt tốt hơn rất nhiều so với tiêu diệt nó."
  ethos_communal_name:0 "Cộng đồng"
  ethos_communal_desc:1 "Nền văn hóa này đề cao các mối liên kết cộng đồng hơn tất cả, nuôi dưỡng lòng trung thành và sự tận tâm lớn lao bằng cách cùng nhau hướng tới những mục tiêu chung."

 # Martial Customs
  martial_custom_equal_name:0 "Bình đẳng"
  martial_custom_equal_desc:2 "Trong nền văn hóa này, bất kỳ ai trong gia đình có đủ khả năng thể chất đều có thể cầm vũ khí phục vụ chư hầu của mình khi được triệu tập."
  martial_custom_male_only_name:0 "Chỉ nam giới"
  martial_custom_male_only_desc:0 "Nền văn hóa này cho rằng chỉ có nam giới mới đủ sức mạnh và sự cứng cỏi về thể chất để chiến đấu."
  martial_custom_female_only_name:0 "Chỉ nữ giới"
  martial_custom_female_only_desc:0 "Nền văn hóa này cho rằng chỉ có nữ giới mới đủ sức mạnh và sự cứng cỏi về thể chất để chiến đấu."
 ## ^The above descs mirror each other deliberately.
 
 # Traditions
  tradition_court_eunuchs_name:0 "Hoạn quan triều đình"
  tradition_court_eunuchs_desc:1 "Nền văn hóa này sử dụng hoạn quan rộng rãi trong triều đình, đảm nhiệm các vị trí từ gia nhân nội phủ cho đến quan lại hành chính, thậm chí cả chỉ huy quân sự. Những người đàn ông không còn dục vọng là những kẻ dễ đặt niềm tin."
  tradition_byzantine_succession_name:1 "Truyền thống Byzantine"
  tradition_byzantine_succession_desc:1 "Nền văn hóa này gắn bó chặt chẽ với các truyền thống đế quốc của Đế chế La Mã phương Đông và di sản của nó dưới dạng một bộ quy tắc lễ nghi triều đình phức tạp và tinh vi."
  tradition_african_tolerance_name:0 "Khoan dung châu Phi"
  tradition_african_tolerance_desc:1 "Dù có kẻ coi đó là sự yếu mềm, một vương quốc được xây dựng trên sự thấu hiểu và khoan dung là một vương quốc có nền móng vững bền."
  tradition_memories_of_bactria_name:0 "Ký ức về Bactria"
  tradition_memories_of_bactria_desc:1 "Được khắc sâu trong ký ức văn hóa của dân tộc này là lý tưởng về miền đất Bactria hoàn mỹ, vương miện rực rỡ của phương Đông, nơi thời đại huy hoàng rồi sẽ một lần nữa quay trở lại."
  tradition_equal_inheritance_name:0 "Thừa kế bình đẳng"
  tradition_equal_inheritance_desc:0 "Nền văn hóa này có truyền thống các quân vương chia lãnh thổ cho toàn bộ con cái của mình, kể cả những người theo lẽ thường vốn sẽ bị loại trừ."
  tradition_equal_inheritance_link:0 "Thừa kế bình đẳng"
  tradition_the_witenagemot_name:0 "Witenagemot"
  tradition_the_witenagemot_desc:1 "Nền văn hóa này có lịch sử lâu đời trong việc triệu tập các hội nghị gồm những thế lực cầm quyền trong vùng, nơi chính trị, luật pháp và tài chính được bàn thảo — và quan trọng nhất là cách tốt nhất để... #EMP cố vấn#! cho quân vương."
  tradition_things_name:1 "Hội Ting"
  tradition_things_desc:1 "Tại Scandinavia, khoảng cách xa xôi và vùng hoang dã khiến quyền lực tập trung trở nên kém hiệu quả. Khi cần giải quyết tranh chấp và đưa ra quyết định, #EMP Hội Ting #!sẽ được triệu tập — một hội đồng đồng đẳng do người tuyên luật chủ trì."
  tradition_caravaneers_name:0 "Thương nhân lữ hành"
  tradition_caravaneers_desc:1 "Nền văn hóa này gắn bó sâu sắc với các hoạt động thương mại của khu vực, và người dân của họ được biết đến rộng rãi qua việc buôn bán bằng đoàn lữ hành."
  tradition_xenophilic_name:0 "Hiếu ngoại"
  tradition_xenophilic_desc:0 "Nền văn hóa này đón nhận mọi người và thực sự bị cuốn hút bởi tất cả các nền văn hóa khác."
  tradition_legalistic_name:0 "Pháp trị"
  tradition_legalistic_desc:1 "Nền văn hóa này coi thượng tôn pháp luật và việc hệ thống hóa luật pháp là yếu tố quan trọng nhất của một xã hội văn minh."
  tradition_warrior_culture_name:0 "Văn hóa chiến binh"
  tradition_warrior_culture_desc:0 "Nền văn hóa này đề cao sức mạnh và năng lực quân sự hơn tất cả. Trẻ em được nuôi dạy với kiến thức chiến đấu và bị discouraging theo đuổi con đường học thuật. Sự yếu đuối không được dung thứ."
  tradition_philosopher_culture_name:0 "Văn hóa triết gia"
  tradition_philosopher_culture_desc:0 "Nền văn hóa này khuyến khích tư duy và sự tự phản tỉnh."
  tradition_chivalry_name:0 "Hiệp sĩ đạo"
  tradition_chivalry_desc:1 "Nền văn hóa này đã tiếp nhận tinh thần hiệp sĩ và các quy tắc hiệp sĩ đạo như một phương thức xã hội để điều chỉnh hành vi. Sức mạnh quân sự, nghĩa vụ, danh dự và đạo đức được đề cao — cũng như thơ dở và văn chương lãng mạn."
  tradition_hit_and_run_name:0 "Chiến thuật đánh nhanh rút gọn"
  tradition_hit_and_run_desc:0 "Nền văn hóa này đã làm chủ việc sử dụng các đơn vị trang bị nhẹ để giáng đòn mạnh vào kẻ thù rồi nhanh chóng rút lui."
  tradition_stand_and_fight_name:0 "Đứng vững và chiến đấu!"
  tradition_stand_and_fight_desc:0 "Các chiến binh của nền văn hóa này kiên cường và bất khuất. Họ không rút lui — ngay cả trước những tỷ lệ bất lợi áp đảo, dù tốt hay xấu."
  tradition_horse_lords_name:0 "Chúa tể kỵ mã"
  tradition_horse_lords_desc:0 "Nền văn hóa này đã làm chủ loài ngựa và cách sử dụng chúng trong chiến tranh."
  tradition_adaptive_skirmishing_name:0 "Du kích thích nghi"
  tradition_adaptive_skirmishing_desc:0 "Nền văn hóa này biết cách triển khai lực lượng du kích một cách hiệu quả trong mọi môi trường."
  tradition_formation_fighting_name:0 "Bậc thầy đội hình chiến đấu"
  tradition_formation_fighting_desc:0 "Nền văn hóa này biết cách tạo ra sự phối hợp giữa các loại binh chủng thông qua những đội hình phòng hộ hiệu quả."
  tradition_republican_legacy_name:0 "Di sản cộng hòa"
  tradition_republican_legacy_desc:1 "Nền văn hóa này có truyền thống lâu đời về các giá trị cộng hòa, nơi tầng lớp đô thị quan trọng không kém gì các địa chủ nông thôn."
  tradition_hereditary_hierarchy_name:0 "Thứ bậc cha truyền con nối"
  tradition_hereditary_hierarchy_desc:0 "Ăn sâu trong nền văn hóa này là niềm tin rằng quyền lực được truyền lại bằng huyết thống, quý tộc được gắn chặt với những lâu đài bằng đá, và trật tự phong kiến là không thể lay chuyển. Họ không dễ quên những kẻ phá vỡ luật lệ phong kiến."
  tradition_theocratic_autonomy_name:0 "Tự trị thần quyền"
  tradition_theocratic_autonomy_desc:1 "Giới chức tôn giáo trong nền văn hóa này được các nhà cầm quyền thế tục trao cho nhiều quyền tự do hành động và nhận được sự kính trọng cùng phục tùng từ dân chúng."
  tradition_saharan_nomads_name:0 "Du mục Sahara"
  tradition_saharan_nomads_desc:1 "Nền văn hóa này gắn bó mật thiết với sa mạc Sahara, nơi họ đã băng qua suốt nhiều thế kỷ, kết nối Địa Trung Hải với các vương quốc Hạ Sahara của vùng Sahel."
  tradition_himalayan_settlers_name:0 "Cư dân Himalaya"
  tradition_himalayan_settlers_desc:1 "Nền văn hóa này đã chọn sinh sống trên 'nóc nhà thế giới', nơi không khí trong lành nhưng lạnh giá, và mùa đông dài dằng dặc, khắc nghiệt. Họ tự hào rằng rất ít nền văn hóa ở vùng thấp có thể sinh tồn tốt như họ giữa những đỉnh núi và cao nguyên, nơi mà ngoài cừu ra thì hiếm loài nào có thể phát triển."
  tradition_esteemed_hospitality_name:0 "Hiếu khách danh giá"
  tradition_esteemed_hospitality_desc:0 "Trong nền văn hóa này, các quân vương nổi tiếng — và được kỳ vọng — sẽ đón tiếp bất kỳ ai đến triều đình của mình bằng vòng tay rộng mở, tổ chức tiếp đãi khách khứa một cách long trọng và xa hoa."
  tradition_hard_working_name:0 "Cần cù"
  tradition_hard_working_desc:1 "Nền văn hóa này đề cao và khắc sâu những giá trị về sự cần mẫn và lao động chăm chỉ vì lợi ích của cộng đồng."
  tradition_loyal_soldiers_name:1 "Thần dân trung thành"
  tradition_loyal_soldiers_desc:2 "Đối với nền văn hóa này, phụng sự quân chủ và quốc gia vừa cao quý vừa chính đáng — đó là nghĩa vụ và vinh dự, chứ không phải một thỏa thuận tham lam hay gánh nặng miễn cưỡng."
  tradition_female_only_inheritance_name:0 "Mẫu hệ"
  tradition_female_only_inheritance_desc:1 "Nền văn hóa này áp đặt một trật tự mẫu hệ, trong đó tầng lớp thống trị chủ yếu là phụ nữ."
  tradition_pacifism_name:0 "Chủ nghĩa hòa bình"
  tradition_pacifism_desc:1 "Đối với nền văn hóa này, việc sử dụng bạo lực không bao giờ có thể được biện minh. Chỉ bằng cách theo đuổi con đường phi bạo lực, con người mới thực sự sống trong hòa bình."
  tradition_scientific_curiosity_name:0 "Hiếu kỳ khoa học"
  tradition_scientific_curiosity_desc:1 "Phần lớn mọi người nhìn sang trái, sang phải, về sau hay về trước để tìm câu trả lời. Không phải dân tộc này. Họ ngước nhìn lên cao."
  tradition_spartan_name:0 "Khắc khổ"
  tradition_spartan_desc:1 "Nền văn hóa này không đề cao những phù hoa của quyền lực — nghi lễ, của cải hay sự trang trí vô nghĩa. Họ quan tâm nhiều hơn đến bản thân quyền lực, tốt nhất là dưới hình thức những bức tường và pháo đài sừng sững."
  tradition_tribe_unity_name:0 "Đoàn kết bộ lạc"
  tradition_tribe_unity_desc:1 "Nền văn hóa này nhấn mạnh các mối liên kết gia tộc và cộng đồng mà người dân chia sẻ, thúc đẩy họ ghi nhớ nguồn gốc chung của mình."
  tradition_astute_diplomats_name:0 "Nhà ngoại giao lão luyện"
  tradition_astute_diplomats_desc:1 "Trong nền văn hóa này, người ta tin rằng biểu hiện thuần túy nhất của sự vượt trội là khả năng khuất phục kẻ thù mà không cần giao chiến."
  tradition_collective_lands_name:0 "Đất đai tập thể"
  tradition_collective_lands_desc:1 "Ý niệm cá nhân sở hữu đất đai là điều xa lạ với nền văn hóa này; đất đai thuộc về toàn thể dân chúng, vì lợi ích chung."
  tradition_horse_breeder_name:0 "Người gây giống ngựa"
  tradition_horse_breeder_desc:1 "Nền văn hóa này đã dày công tích lũy tri thức và kinh nghiệm trong nghệ thuật và khoa học gây giống ngựa. Dù là chiến mã hay tuấn mã, ngựa của họ đều lừng danh bởi sự vượt trội."
  tradition_hunters_name:0 "Thợ săn thiện nghệ"
  tradition_hunters_desc:1 "Do nhu cầu kinh tế — hoặc có lẽ là kỳ vọng xã hội — nền văn hóa này đã tinh luyện kỹ nghệ săn bắn của mình thành một nghệ thuật chính xác và gần như tuyệt mỹ."
  tradition_sacred_mountains_name:0 "Núi thiêng"
  tradition_sacred_mountains_desc:1 "Nền văn hóa này coi núi non là cầu nối với thần linh và đối xử với chúng bằng sự tôn kính và kính sợ."
  tradition_culinary_art_name:0 "Nghệ thuật ẩm thực"
  tradition_culinary_art_desc:1 "Đối với nền văn hóa này, ẩm thực không chỉ để no bụng; đó vừa là nghệ thuật vừa là nghi lễ, là trung tâm gắn kết gia đình và cộng đồng."
  tradition_festivities_name:0 "Lễ hội thường xuyên"
  tradition_festivities_desc:1 "Tần suất và sự náo nhiệt trong các lễ hội của nền văn hóa này có thể bị người khác coi là phô trương, nhưng tiệc tùng thì vẫn là tiệc tùng!"
  tradition_tea_ceremony_name:0 "Nghi lễ trà đạo"
  tradition_tea_ceremony_desc:1 "Đôi khi, tất cả những gì cần để mọi thứ trở nên tốt đẹp hơn chỉ là một tách trà ngon."
  tradition_vegetarianism_name:0 "Ăn chay"
  tradition_vegetarianism_desc:1 "Nền văn hóa này đã hình thành sự ác cảm mạnh mẽ với việc tiêu thụ thịt động vật, và thực hành chế độ ăn chay trên toàn xã hội."
  tradition_alpine_supremacy_name:0 "Bá chủ miền núi cao"
  tradition_alpine_supremacy_desc:1 "Người dân của nền văn hóa này đã thích nghi với cuộc sống trong và quanh các vùng núi, và kiến thức cũng như kinh nghiệm của họ về khí hậu núi cao là vô song."
  tradition_seafaring_name:0 "Dân biển cả"
  tradition_seafaring_desc:1 "Đối với nền văn hóa này, tiếng gọi của đại dương là không thể cưỡng lại; họ sống để dong buồm trên mặt biển trong vắt như mơ, hoặc cưỡi trên đỉnh những cơn bão cuồng nộ."
  tradition_strength_display_name:0 "Phô diễn sức mạnh"
  tradition_strength_display_desc:1 "Chỉ sở hữu sức mạnh là chưa đủ. Ngươi phải #EMP thể hiện#! sức mạnh ấy trước người khác, để biết mình có thể đối mặt với một đối thủ xứng tầm, hay sát cánh cùng một đồng minh đáng giá."
  tradition_mystical_ancestors_name:0 "Tổ tiên huyền thoại"
  tradition_mystical_ancestors_desc:1 "Dòng dõi có ý nghĩa vô cùng to lớn đối với nền văn hóa này, đến mức tổ tiên đã trở thành những nhân vật thần thoại và huyền sử, với nhiều người tự nhận là hậu duệ của họ."
  tradition_priestly_caste_name:0 "Đẳng cấp tăng lữ"
  tradition_priestly_caste_desc:1 "Nền văn hóa này áp đặt một hệ thống đẳng cấp nhằm tôn vinh giới tăng lữ trong xã hội. Đối với họ, những người diễn giải ý chí của thần linh phải được bảo vệ và tuân phục."
  tradition_religion_blending_name:0 "Dung hòa tôn giáo"
  tradition_religion_blending_desc:1 "Người dân của nền văn hóa này thường chung sống cùng những người theo các đức tin khác nhau, và rất giỏi tiếp thu các yếu tố ngoại lai vào việc thờ phụng của mình."
  tradition_religious_festivities_name:0 "Lễ hội tôn giáo"
  tradition_religious_festivities_desc:1 "Chuyển động của Mặt Trời và tinh tú không mấy liên quan đến cách nền văn hóa này cảm nhận thời gian. Thay vào đó, cách phổ biến hơn để đánh dấu ngày tháng là vô số lễ hội và nghi lễ tôn giáo thường xuyên — nơi mọi người đều được mời tham dự!"
  tradition_religious_patronage_name:0 "Bảo trợ tôn giáo"
  tradition_religious_patronage_desc:1 "Để cứu rỗi linh hồn, con người phải dấn thân vào những công trình mang ý nghĩa tôn giáo. Ngươi không thể mua lấy sự chuộc tội, nhưng việc có một ngôi đền với các giáo sĩ hát lời ca tụng ngươi thì #EMP cũng giúp đấy.#!"
  tradition_medicinal_plants_name:0 "Thảo dược trị liệu"
  tradition_medicinal_plants_desc:1 "Nền văn hóa này từ lâu đã phát triển kiến thức về dược tính của cây cỏ và thảo mộc; đối với họ, hầu hết bệnh tật đều có thể chữa trị bằng cao dán, thuốc bôi hay một nồi hầm thích hợp."
  tradition_storytellers_name:0 "Người kể chuyện"
  tradition_storytellers_desc:1 "Nền văn hóa này có truyền thống truyền khẩu mạnh mẽ và bền bỉ. Quá khứ được lưu giữ qua những câu chuyện mang tính nghi lễ, nơi các anh hùng và huyền thoại được truyền lại qua nhiều thế hệ."
  tradition_sacred_hunts_name:0 "Cuộc săn thiêng liêng"
  tradition_sacred_hunts_desc:1 "Săn bắn không phải là thể thao hay tiêu khiển; đó là biểu hiện thuần khiết nhất của trải nghiệm nhân sinh, nơi con người có thể kết nối với thần linh bằng cách thể hiện quyền năng của mình trước thiên nhiên."
  tradition_wedding_ceremonies_name:1 "Nghi lễ hôn phối"
  tradition_wedding_ceremonies_desc:1 "Đối với nền văn hóa này, sự kết hợp hôn nhân giữa hai con người là một sự kiện mang tính công khai cao và đậm màu sắc nghi lễ."
  tradition_music_theory_name:0 "Học thuyết âm nhạc"
  tradition_music_theory_desc:1 "Nền văn hóa này coi âm nhạc gần như là ngôn ngữ của thần linh, vì thế nhiều người đã theo đuổi con đường cao quý và được tôn vinh của việc nghiên cứu âm nhạc từ khi còn rất trẻ."
  tradition_poetry_name:0 "Thi ca tinh luyện"
  tradition_poetry_desc:0 "Thi ca được xem là một nghệ thuật cao quý trong nền văn hóa này, và nhiều người dành cả đời để dệt nên những vần từ đầy ý nghĩa và suy tưởng."
  tradition_culture_blending_name:0 "Dung hợp văn hóa"
  tradition_culture_blending_desc:1 "Người dân của nền văn hóa này thường xuyên chung sống cùng các dân tộc khác. Qua sự tiếp xúc, họ trở nên thành thạo trong việc tiếp thu ngôn ngữ, truyền thống và phong tục ngoại lai vào đời sống của mình."
  tradition_family_entrepreneurship_name:0 "Nghề nghiệp gia tộc"
  tradition_family_entrepreneurship_desc:2 "Nền văn hóa này khuyến khích các hoạt động kinh doanh phát triển theo huyết thống gia đình, mỗi thế hệ tiếp nhận công cụ và kỹ nghệ từ thế hệ trước, tạo nên một truyền thống nghề nghiệp tổ tiên bền vững."
  tradition_fishermen_name:0 "Ngư dân thiện nghệ"
  tradition_fishermen_desc:1 "Ai cũng có thể đánh cá, nhưng để làm điều đó với kỹ nghệ sao cho mẻ lưới luôn đầy ắp bất kể thủy triều hay gió lớn thì lại là tài năng hiếm có. Không ai hiểu rõ bờ biển, đất liền hay đại dương hơn những ngư dân này."
  tradition_metal_craftsmanship_name:0 "Thợ kim khí"
  tradition_metal_craftsmanship_desc:1 "Nền văn hóa này đã dễ dàng tiếp cận sắt trong nhiều thế kỷ. Theo thời gian, họ phát triển hiểu biết về kim loại đến mức tên tuổi của họ trở thành biểu tượng cho vũ khí và áo giáp bền bỉ, chất lượng cao."
  tradition_isolationist_name:0 "Biệt lập"
  tradition_isolationist_desc:0 "Nền văn hóa này ưa sống khép kín và hiếm khi hướng ánh nhìn ra ngoài phạm vi của chính mình."
  tradition_winter_warriors_name:0 "Chiến binh mùa đông"
  tradition_winter_warriors_desc:0 "Nền văn hóa này đã quen với thực tại của những cơn gió buốt và giá lạnh khắc nghiệt."
  tradition_forest_fighters_name:0 "Chiến binh rừng sâu"
  tradition_forest_fighters_desc:0 "Nền văn hóa này rất thành thạo trong việc chiến đấu giữa rừng rậm."
  tradition_mountaineers_name:0 "Sơn binh"
  tradition_mountaineers_desc:0 "Binh sĩ của nền văn hóa này mang theo mọi thứ cần thiết để băng qua núi non."
  tradition_warriors_of_the_dry_name:0 "Chiến binh xứ khô hạn"
  tradition_warriors_of_the_dry_desc:0 "Nền văn hóa này đã làm chủ nghệ thuật chiến đấu trong những vùng khí hậu cực kỳ khô cằn."
  tradition_highland_warriors_name:0 "Chiến binh cao nguyên"
  tradition_highland_warriors_desc:0 "Các chiến binh của nền văn hóa này chiến đấu hiệu quả trên sườn dốc và thung lũng của vùng đồi núi quê hương."
  tradition_jungle_warriors_name:0 "Chiến binh rừng rậm"
  tradition_jungle_warriors_desc:0 "Các chiến binh của nền văn hóa này rất am hiểu việc di chuyển và tác chiến trong những khu rừng nhiệt đới hiểm trở."
  tradition_only_the_strong_name:0 "Chỉ dành cho kẻ mạnh"
  tradition_only_the_strong_desc:0 "Nền văn hóa này đặc biệt coi trọng việc duy trì một lực lượng chiến binh tinh nhuệ nhưng ít ỏi. Nếu ngươi không thuộc hàng xuất sắc nhất, ngươi không được phép phục vụ."
  tradition_warriors_by_merit_name:0 "Chiến binh theo công trạng"
  tradition_warriors_by_merit_desc:0 "Nền văn hóa này tin rằng nếu ngươi đã chứng minh được năng lực chiến đấu, ngươi xứng đáng được ra trận — bất kể ngươi là ai."
  tradition_warrior_monks_name:0 "Tu sĩ chiến binh"
  tradition_warrior_monks_desc:0 "Nền văn hóa này tin rằng nếu ngươi chọn theo đuổi con đường thần học, ngươi cũng phải có khả năng bảo vệ đức tin của mình."
  tradition_talent_acquisition_name:0 "Nhận diện nhân tài"
  tradition_talent_acquisition_desc:0 "\"Hãy giết ta nếu ngươi muốn, nhưng nếu cho ta sống, ta sẽ trung thành phụng sự ngươi.\""
  tradition_strength_in_numbers_name:0 "Lấy đông làm mạnh"
  tradition_strength_in_numbers_desc:0 "Nền văn hóa này từ bỏ việc xây dựng quân đội tinh nhuệ, thay vào đó ưu tiên các đạo quân đông đảo."
  tradition_frugal_armorsmiths_name:0 "Thợ giáp tiết kiệm"
  tradition_frugal_armorsmiths_desc:0 "Một bộ giáp hảo hạng có thể cứu một mạng người, nhưng mười bộ giáp khá dùng được có thể thắng cả một trận chiến."
  tradition_malleable_invaders_name:0 "Kẻ xâm lăng thích nghi"
  tradition_malleable_invaders_desc:1 "Chúng ta sẽ lấy đất đai của ngươi, con cái của ngươi, truyền thống của ngươi, và cả #EMP tương lai#! của ngươi."
  tradition_quarrelsome_name:0 "Hiếu chiến"
  tradition_quarrelsome_desc:0 "Xung đột biên giới là chuyện thường tình đối với các lãnh chúa của nền văn hóa này. Đất đai thường xuyên đổi chủ theo những cách bất công."
  tradition_swords_for_hire_name:0 "Kiếm thuê"
  tradition_swords_for_hire_desc:0 "Nền văn hóa này nhìn nhận công việc lính đánh thuê một cách tích cực và khuyến khích chiến binh tìm kiếm vinh quang với tư cách lính đánh thuê giữa các cuộc chiến."
  tradition_reverence_for_veterans_name:0 "Tôn kính cựu binh"
  tradition_reverence_for_veterans_desc:0 "Nền văn hóa này không khinh miệt những người không còn khả năng chiến đấu vì thương tích; ngược lại, họ được tôn vinh như anh hùng và được trọng dụng làm người truyền dạy."
  tradition_stalwart_defenders_name:0 "Hộ vệ kiên cường"
  tradition_stalwart_defenders_desc:0 "Việc bảo vệ những gì thuộc về mình là điều tối thượng đối với nền văn hóa này."
  tradition_battlefield_looters_name:0 "Kẻ cướp chiến trường"
  tradition_battlefield_looters_desc:0 "Trong nền văn hóa này, chiến tranh không phải vì danh dự mà vì lợi nhuận. Danh tiếng có nghĩa gì nếu ngươi không đủ tiền trả cho cuộc chiến?"
  tradition_fervent_temple_builders_name:0 "Những người xây đền cuồng tín"
  tradition_fervent_temple_builders_desc:0 "Nền văn hóa này coi việc xây dựng đền đài là con đường trực tiếp nhất dẫn đến thần linh. Các quân vương mộ đạo được kỳ vọng sẽ dựng nên nhiều ngôi đền to lớn và tráng lệ."
  tradition_lords_of_the_elephant_name:0 "Chúa tể voi chiến"
  tradition_lords_of_the_elephant_desc:0 "Nền văn hóa này tôn thờ voi, ví chúng như bậc vương giả. Họ là bậc thầy trong việc bắt giữ, huấn luyện và sử dụng voi để tạo ra sức tàn phá khủng khiếp trên chiến trường."
  tradition_zealous_people_name:0 "Tín đồ cuồng tín"
  tradition_zealous_people_desc:0 "Người dân của nền văn hóa này đặc biệt nhiệt thành và tận hiến cho đức tin của mình."
  tradition_welcoming_name:1 "Lôi cuốn"
  tradition_welcoming_desc:1 "Người dân của nền văn hóa này xuất sắc trong ngoại giao, và phép tắc xã giao được coi trọng hơn hết thảy."
  tradition_agrarian_name:0 "Nông nghiệp"
  tradition_agrarian_desc:0 "Nền văn hóa này mang đậm tính nông nghiệp, đất đai của họ sản xuất dồi dào lương thực cho những đạo quân đói khát. Tuy không phải vật lộn vì cái ăn giúp có nhiều nông dân nhập ngũ, nhưng cũng khiến mỗi binh sĩ kém quyết tâm hơn so với những người đến từ vùng đất khắc nghiệt."
  tradition_eye_for_an_eye_name:0 "Ăn miếng trả miếng"
  tradition_eye_for_an_eye_desc:0 "Trong nền văn hóa này, sự xúc phạm không bao giờ bị lãng quên hay tha thứ. Con người mang mối thù rất lâu, và sự báo oán được thực hiện với niềm say mê mãnh liệt."
  tradition_forbearing_name:0 "Nhẫn nhịn"
  tradition_forbearing_desc:1 "Trong nền văn hóa này, sự kiên nhẫn và tiết chế trước nghịch cảnh là điều thường thấy."
  tradition_equitable_name:0 "Công bằng"
  tradition_equitable_desc:0 "Trong nền văn hóa này, chân lý và công lý vô tư được đề cao."
  tradition_charitable_name:0 "Bác ái"
  tradition_charitable_desc:0 "Bất kể đức tin nào, người dân của nền văn hóa này đều được thúc đẩy giúp đỡ những kẻ kém may mắn hơn."
  tradition_modest_name:0 "Khiêm Nhường"
  tradition_modest_desc:0 "Nền văn hóa này coi trọng sự khiêm tốn; mỗi người không nên chiếm quá nhiều không gian hay tự cho mình hơn người khác."
  tradition_hill_dwellers_name:0 "Cư Dân Đồi Núi"
  tradition_hill_dwellers_desc:0 "Nền văn hóa này quen thuộc với vùng đồi và biết cách khai thác đất đai hiệu quả."
  tradition_forest_folk_name:0 "Dân Rừng"
  tradition_forest_folk_desc:0 "Nền văn hóa này sinh sống gần những khu rừng rộng lớn và biết cách thu hái sản vật của rừng."
  tradition_mountain_homes_name:0 "Xứ Núi Cao"
  tradition_mountain_homes_desc:0 "Nền văn hóa này biết cách sinh tồn và phát triển trên các cao nguyên gần những sườn núi khắc nghiệt."
  tradition_dryland_dwellers_name:0 "Cư Dân Vùng Khô Hạn"
  tradition_dryland_dwellers_desc:0 "Nền văn hóa này quen sống trong khí hậu khô cằn, biết tìm nguồn nước và canh tác đất đai."
  tradition_jungle_dwellers_name:0 "Cư Dân Rừng Rậm"
  tradition_jungle_dwellers_desc:0 "Nền văn hóa này sinh sống gần rừng rậm và biết cách khai thác sự giàu có của nó."
  tradition_faith_bound_name:0 "Ràng Buộc Đức Tin"
  tradition_faith_bound_desc:0 "Trong nền văn hóa này, theo một đức tin khác đồng nghĩa với việc không có quyền kế vị."
  tradition_by_the_sword_name:0 "Bằng Gươm Giáo"
  tradition_by_the_sword_desc:0 "Người của nền văn hóa này tin rằng nhà truyền giáo tốt nhất là kẻ mang theo thanh kiếm. Dù chiến tranh thánh được ủng hộ rộng rãi, động cơ vẫn bị soi xét để đảm bảo sự chấp thuận của Thần linh."
  tradition_language_scholars_name:0 "Học Giả Ngôn Ngữ"
  tradition_language_scholars_desc:0 "Học được lời nói của láng giềng  sẽ đưa Ngài tiến gần hơn đến ngôn ngữ của Thần linh."
  tradition_pastoralists_name:0 "Dân Chăn Nuôi Du Mục"
  tradition_pastoralists_desc:0 "Nền văn hóa này quen thuộc với những vùng đất rộng mở, nơi họ chăn dắt những đàn gia súc lớn."
  tradition_desert_nomads_name:1 "Lữ Hành Sa Mạc"
  tradition_desert_nomads_desc:1 "Nền văn hóa này không xa lạ gì với môi trường khắc nghiệt của sa mạc và đã thuần thục việc sử dụng lạc đà trong di chuyển, chiến tranh và đời sống thường nhật."
  tradition_gardening_name:0 "Kiến Trúc Sư Vườn Tược"
  tradition_gardening_desc:0 "Nền văn hóa này có truyền thống lâu đời trong việc xây dựng và chăm sóc nhiều loại vườn, tự tạo cho mình những thiên đường thu nhỏ."
  can_appoint_court_gardener_name: "[GetCultureTradition('tradition_gardening').GetName]"
  tradition_monogamous_name:0 "Đơn Phối"
  tradition_monogamous_desc:0 "Trong nền văn hóa này, mỗi người chỉ có một phối ngẫu, bất kể đức tin."
  tradition_polygamous_name:0 "Đa Phối"
  tradition_polygamous_desc:0 "Trong nền văn hóa này, một người thường có nhiều phối ngẫu, bất kể đức tin."
  tradition_concubines_name:1 "Thê Thiếp"
  tradition_concubines_desc:1 "Những người cai trị của nền văn hóa này thường nuôi nhiều thê thiếp trong gia đình, bất kể đức tin."
  tradition_mendicant_mystics_name:0 "Ẩn Tu Du Hành"
  tradition_mendicant_mystics_desc:1 "Những bậc thánh nhân của nền văn hóa này tin rằng đức tin cần được truyền bá giữa đời, và những tín đồ mộ đạo nhất thường lang thang khắp thế gian."
  tradition_parochialism_name:0 "Chủ Nghĩa Địa Phương"
  tradition_parochialism_desc:0 "Cư dân thành thị của nền văn hóa này vô cùng cạnh tranh và độc lập. Họ đầu tư rất nhiều tiền bạc và công sức để đảm bảo rằng #EMP thành phố của họ#! là tráng lệ nhất."
  tradition_martial_admiration_name:0 "Tôn Vinh Võ Dũng"
  tradition_martial_admiration_desc:0 "Những ai sẵn sàng cầm kiếm chiến đấu vì nền văn hóa của mình đều xứng đáng được ngưỡng mộ, bất kể nghịch cảnh."
  tradition_chanson_de_geste_name:0 "Khúc Ca Anh Hùng"
  tradition_chanson_de_geste_desc:0 "Nền văn hóa này trân trọng những chiến công anh hùng của tổ tiên xa xưa. Những câu chuyện lãng mạn về các hiệp sĩ như Guillaume hay Roland sẽ truyền cảm hứng cho nhiều thế hệ."
  tradition_ruling_caste_name:0 "Đẳng Cấp Thống Trị"
  tradition_ruling_caste_desc:0 "Những người cai trị của nền văn hóa này quen thống trị các thần dân không cùng văn hóa. Họ biết cách đàn áp nổi loạn hiệu quả, dù phải trả giá bằng hình ảnh trước công chúng."
  tradition_staunch_traditionalists_name:0 "Bảo Thủ Kiên Định"
  tradition_staunch_traditionalists_desc:1 "Truyền thống là truyền thống — bất di bất dịch và không thể thay đổi. Chúng ta phải sẵn sàng đứng lên bảo vệ điều làm nên bản sắc của mình."
  tradition_sacred_groves_name:0 "Thánh Lâm"
  tradition_sacred_groves_desc:0 "Cây cối được xem là thiêng liêng trong nền văn hóa này. Khu rừng là một sinh thể sống cần được chăm sóc — không phải phá hủy."
  tradition_hold_the_line_name:0 "Giữ Vững Tuyến"
  tradition_hold_the_line_desc:1 "Nền văn hóa này khiến mọi chiến binh đều tự hào về sức mạnh của mình. Những bài diễn thuyết hùng hồn của chỉ huy giữ cho binh sĩ vững chí đến phút cuối."
  tradition_legendary_noble_families_name:0 "Gia Tộc Quý Tộc Huyền Thoại"
  tradition_legendary_noble_families_desc:1 "Nếu Ngài không thuộc về một trong những gia tộc quý tộc đã góp phần định hình vận mệnh của nền văn hóa này, thì Ngài chẳng là gì cả."
  tradition_castle_keepers_name:0 "Người Giữ Thành"
  tradition_castle_keepers_desc:1 "Tấn công không phải là phòng thủ tốt. Phòng thủ tốt là sở hữu nhiều lâu đài nhất trong thế giới đã biết."
  tradition_city_keepers_name:0 "Người Giữ Đô Thị"
  tradition_city_keepers_desc:1 "Thành phố là trái tim đô thị đang đập của nền văn hóa này, và họ mong muốn mỗi đại đô thị trở thành viên ngọc khiến cả thế giới thèm muốn."
  tradition_fractious_name:0 "Chia Rẽ"
  tradition_fractious_desc:1 "Kẻ thù của kẻ thù Ta #EMP cũng#! là kẻ thù của Ta."
  tradition_runestones_name:1 "Dựng Bia Rune"
  tradition_runestones_desc:1 "Cái chết, chinh phục, thăng tiến — chẳng phải đó là những điều định nghĩa cuộc sống của giới quý tộc hay sao? Nơi người của chúng ta đặt chân đến, nơi đó có dấu ấn giá trị đời người."
  tradition_insular_spirit_name:0 "Tinh Thần Biệt Lập"
  tradition_insular_spirit_desc:1 "Nền văn hóa này quyết tâm không chệch khỏi lối đi nguyên bản của mình và sẽ chiến đấu để bảo vệ bất kỳ đồng tộc nào bị văn hóa khác tấn công."
  tradition_monastic_communities_name:0 "Cộng Đồng Tu Viện"
  tradition_monastic_communities_desc:1 "Nền văn hóa này có truyền thống lâu đời gửi con cháu quý tộc phụng sự đức tin. Nhiều nhà tư tưởng chính trị được kính trọng đã xuất thân từ các dòng tu."
  tradition_roman_legacy_name:1 "Di Sản Đông La Mã"
  tradition_roman_legacy_desc:1 "Tổ chức quân sự của Đế chế La Mã vẫn còn in đậm trong ký ức của nền văn hóa này. Họ ưa chuộng quân đội chuyên nghiệp hơn là quân trưng binh."
  tradition_longbow_competitions_name:0 "Thi Bắn Trường Cung"
  tradition_longbow_competitions_desc:1 "Nền văn hóa này ưa chuộng loại cung mạnh đến mức ít ai kéo nổi, và việc luyện tập hằng tuần được coi trọng chẳng kém bất kỳ nghi lễ tôn giáo nào."
  tradition_illyrian_grit_name:0 "Ý Chí Illyria"
  tradition_illyrian_grit_desc:1 "Nền văn hóa này có thể luôn tự đấu đá lẫn nhau, nhưng sẽ cùng nhau đứng lên chống lại mọi kẻ xâm lược khi thời khắc đến."
  tradition_maritime_mercantilism_name:0 "Trọng Thương Hàng Hải"
  tradition_maritime_mercantilism_desc:1 "Thế giới có thể được cai trị bằng quân đội, nhưng nền văn hóa này biết rằng nó thực sự nằm trong tay kẻ kiểm soát dòng chảy vàng bạc trên biển."
  tradition_sacral_kingship_name:0 "Vương Quyền Thánh Thiêng"
  tradition_sacral_kingship_desc:1 "Người cai trị của nền văn hóa này được xem là Thần linh, hoặc ngôi vua được coi là một đức hạnh thiêng liêng. Một vị vua là gì trước một vị Thần?"
  tradition_reavers_name:0 "Kẻ Cướp Biển"
  tradition_reavers_desc:1 "Nhiều người sống ven biển trong nền văn hóa này thường lên tàu đi cướp bóc các cảng khác. Dù không được lãnh chúa trực tiếp tán thành, ai cũng biết điều đó tạo ra những binh sĩ thiện chiến."
  tradition_practiced_pirates_name:0 "Hải Tặc Lão Luyện"
  tradition_practiced_pirates_desc:1 "Đánh chiếm cảng, đốt phá và lấy đi mọi thứ chưa bị đóng chặt có thể không cao quý, nhưng #EMP lại#! sinh lợi."
  tradition_determined_independence_name:0 "Quyết Tâm Độc Lập"
  tradition_determined_independence_desc:1 "Thà chết chứ không khuất phục! Những người cai trị của nền văn hóa này không coi thất bại nào tệ hơn việc trở thành chư hầu."
  tradition_merciful_blindings_name:0 "Làm Mù Nhân Từ"
  tradition_merciful_blindings_desc:1 "Dù một kẻ đã vượt xa giới hạn tha thứ, nền văn hóa này vẫn cho rằng móc mắt tốt hơn là xuyên tim."
  tradition_reindeer_hunters_name:0 "Thợ Săn Tuần Lộc"
  tradition_reindeer_hunters_desc:1 "Săn đuổi tuần lộc chỉ như một điệu vũ trên băng giá vĩnh cửu của taiga. Nền văn hóa này đã học cách tận dụng tối đa mọi công cụ săn bắn."
  tradition_mountaineer_ruralism_name:0 "Chủ Nghĩa Nông Thôn Miền Núi"
  tradition_mountaineer_ruralism_desc:1 "Từ những ngọn đồi của Rừng Bohemia đến các vách đá Ore và Tatra, người của nền văn hóa này không chỉ biết băng qua địa hình hiểm trở mà còn sống dễ dàng trên núi."
  tradition_life_is_just_a_joke_name:0 "Đời Chỉ Là Trò Đùa"
  tradition_life_is_just_a_joke_desc:1 "Nền văn hóa này vẫn có thể cười ngay cả khi đứng trên đoạn đầu đài với lưỡi rìu treo trên đầu."
  tradition_steppe_tolerance_name:0 "Khoan Dung Thảo Nguyên"
  tradition_steppe_tolerance_desc:1 "Những ai sống trên thảo nguyên luôn có nhiều điểm chung với những người cùng lối sống. Dù thờ phụng khác nhau, họ vẫn sống trên lưng ngựa."
  tradition_nubian_warrior_queens_name:0 "Nữ Vương Chiến Binh"
  tradition_nubian_warrior_queens_desc:0 "Người Đông Phi luôn ghi nhớ những Nữ Vương Chiến Binh vĩ đại từng chống lại kẻ xâm lược và dựng nên các vương quốc Kush. láng giềng  có thể đề cao nam giới, nhưng chúng ta nối dõi theo mẹ, và tiếng thét chiến trận của phụ nữ Nubia khiến bọn đàn ông ngoại bang bỏ chạy."
  tradition_nubian_warrior_kings_name:0 "Chiến Vương"
  tradition_nubian_warrior_kings_desc:0 "Người Đông Phi luôn ghi nhớ những Chiến Vương vĩ đại từng chống lại kẻ xâm lược và dựng nên các vương quốc Kush. láng giềng  có thể đề cao nữ giới, nhưng chúng ta nối dõi theo cha, và tiếng thét chiến trận của đàn ông Nubia khiến bọn đàn bà ngoại bang bỏ chạy."
  tradition_maritime_mangroves_name:0 "Đầm Lầy Hàng Hải"
  tradition_maritime_mangroves_desc:1 "Nền văn hóa này đã học cách di chuyển trên những vùng đầm lầy mà các nền văn hóa khác cho là không thể vượt qua. Họ dùng điều đó để xây dựng những căn cứ bất khả xâm phạm phục vụ giao thương, cướp bóc và thám hiểm."
  tradition_mixed_governance_name:0 "Quản Trị Hỗn Hợp"
  tradition_mixed_governance_desc:1 "Nền văn hóa này cho rằng mọi ý kiến đều đáng lắng nghe và mọi phương thức cai trị mới đều đáng thử. Người cai trị khuyến khích chư hầu tự quản theo cách họ thấy phù hợp."
  tradition_ritual_scarrification_name:0 "Nghi Thức Tạo Sẹo"
  tradition_ritual_scarrification_desc:1 "Nền văn hóa này tôn trọng những người có làn da từng nếm lưỡi dao. Dù để chứng minh bản lĩnh hay tạo hoa văn đẹp mắt, họ tự khắc sẹo lên cơ thể mình."
  tradition_hidden_cities_name:0 "Thành Phố Ẩn Mình"
  tradition_hidden_cities_desc:2 "Dù nằm trên ngọn cây rừng rậm hay được che chở bởi mê cung tự nhiên, người ngoài thậm chí có thể không biết các thành phố của nền văn hóa này tồn tại, chứ đừng nói đến việc bao vây."
  tradition_hereditary_bards_name:0 "Thi Sĩ Thế Tập"
  tradition_hereditary_bards_desc:1 "Với một số nền văn hóa, những câu chuyện truyền qua nhiều thế hệ có giá trị không kém bất kỳ khế ước đất đai nào."
  tradition_ancient_miners_name:0 "Thợ Mỏ Cổ Xưa"
  tradition_ancient_miners_desc:1 "Nền văn hóa này từ lâu đã được bao quanh bởi tài nguyên thô, quặng và đá quý chưa cắt. Họ có năng khiếu trong việc tìm kiếm các mỏ khai thác."
  tradition_wetlanders_name:0 "Dân Vùng Đầm Lầy"
  tradition_wetlanders_desc:1 "Nền văn hóa này đã thuần thục việc sinh tồn trong bùn lầy và đầm marsh. Dù cuộc sống đôi khi là cuộc chiến với nấm mốc, họ biết cách tận dụng than bùn cho lợi ích của mình."
  tradition_diasporic_name:0 "Ly Tán"
  tradition_diasporic_desc:1 "Người của nền văn hóa này đã mất đi quê hương từng yêu dấu. Một số lang bạt khắp thế giới để tìm nơi có thể bắt đầu lại."
  tradition_sorcerous_metallurgy_name:0 "Luyện Kim Pháp Thuật"
  tradition_sorcerous_metallurgy_desc:1 "Số nhà giả kim cố biến kim loại thành vàng trong nền văn hóa này nhiều chẳng kém số thợ rèn vũ khí. Có gì quan trọng nếu của cải và binh khí được tăng cường bằng phù phép?"
  tradition_polders_name:0 "Polder"
  tradition_polders_desc:0 "Nền văn hóa này có truyền thống lâu đời cải tạo đất từ biển. Điều đó cho phép họ sử dụng đáy biển nông vốn vô dụng cho nông nghiệp và xây dựng."
  tradition_caucasian_wolves_name:0 "Sói Caucasus"
  tradition_caucasian_wolves_desc:0 "Sau nhiều thế kỷ sinh sống quanh Cổng Caucasus, nền văn hóa này đã trở nên thuần thục với mọi khía cạnh của chiến tranh miền núi."
  tradition_artisans_name:0 "Nghệ Nhân Lão Luyện"
  tradition_artisans_desc:0 "Trẻ em trong nền văn hóa này thường nối nghiệp cha mẹ, tích lũy kiến thức và kỹ năng sâu rộng cho nghề nghiệp qua nhiều thế hệ."

 # Debug Traditions
  tradition_debug_name:0 "Lối Sống Thất Thường"
  tradition_debug_desc:0 "Nền văn hóa này nổi tiếng với những lập trường đa dạng, pha tạp và đầy mâu thuẫn."

 # FP1 Traditions
  tradition_fp1_coastal_warriors_name:0 "Chiến Binh Ven Biển"
  tradition_fp1_coastal_warriors_desc:1 "Chúng ta luôn bị bờ biển mê hoặc. Vị mặn của gió biển, tiếng hải âu kêu gọi, mùi cá hun khói... chiến binh nào lại chọn sống xa mặt nước và sự tự do của nó?"
  tradition_fp1_performative_honour_name:0 "Danh Dự Thể Hiện"
  tradition_fp1_performative_honour_desc:1 "Danh dự có thể được sinh ra, nhưng cũng được giành lấy và đánh mất qua hành động. Truy đòi và trả thù những sự sỉ nhục — hay không làm vậy — sẽ khiến binh sĩ hóa cặn bã, còn kẻ non nớt lớn lên thành chiến binh."
  tradition_fp1_northern_stories_name:0 "Những Câu Chuyện Phương Bắc"
  tradition_fp1_northern_stories_desc:1 "Cuộc sống được sống, được kể và được ghi nhớ qua lăng kính của những câu chuyện. Điều chúng ta nói và điều người khác nói về chúng ta quan trọng chẳng kém việc chúng ta làm gì. Chúng ta luôn ghi nhớ điều đó, và nó thể hiện trong các câu chuyện của mình."
  tradition_fp1_trials_by_combat_name:0 "Phán Xử Bằng Đấu Tay Đôi"
  tradition_fp1_trials_by_combat_desc:1 "Lời nói chỉ là sự thay thế hèn nhát cho vũ khí. Tại sao lại giao công lý cho những bộ luật mục ruỗng và quan lại thối nát, khi tranh chấp có thể được giải quyết nhanh hơn và công bằng hơn bằng lưỡi kiếm?"
  tradition_fp1_the_right_to_prove_name:0 "Quyền Chứng Minh Bản Thân"
  tradition_fp1_the_right_to_prove_desc:0 "Dù không phải ai sinh ra cũng là chiến binh, nhưng với bản lĩnh đúng đắn và cánh tay cầm kiếm vững vàng, bất kỳ ai cũng có thể chứng tỏ mình mang trái tim chiến binh và trở thành một người như thế bằng hành động."

