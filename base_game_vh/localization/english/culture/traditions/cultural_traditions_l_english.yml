  tradition_strong_kinship_name:0 "Huyết Tộc Gắn Kết"
  tradition_strong_kinship_desc:0 "Nền văn hóa này đề cao mối quan hệ huyết thống trong đại gia đình hoặc thị tộc. Khi lâm vào hoàn cảnh khó khăn, một người cai trị luôn có thể dựa vào thân tộc của mình."
  tradition_amharic_highlanders_name:0 "Người Cao Nguyên Amhara"
  tradition_amharic_highlanders_desc:0 "Vùng cao nguyên Amhara rất thích hợp cho canh tác, miễn là biết cách tiếp cận đúng đắn. Qua nhiều thế hệ, dân tộc này đã sinh sống và lao động tại đây, phát triển thịnh vượng cùng những truyền thống và tập tục riêng."

