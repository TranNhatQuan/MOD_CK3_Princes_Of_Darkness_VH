 #BP2 Traditions
  tradition_noble_adoption_name: "Nhận Con Quý Tộc"
  tradition_noble_adoption_desc: "Việc nhận trẻ mồ côi vào các phủ quý tộc là chuyện thường thấy trong xã hội này. Máu giao ước đậm đà hơn nước lòng mẹ."
  culture_parameter_allows_adoption: "[characters|E] của [culture|E] này có thể ban [adoption|E] cho những [children|E] không trực hệ với bất kỳ [rulers|E] nào."
  culture_parameter_free_adoption: "[characters|E] của [culture|E] này có thể [adopt|E] mà không tốn một đồng [prestige|E] hay [dynasty_prestige|E]."
