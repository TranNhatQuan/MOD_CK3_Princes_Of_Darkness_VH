  REQUEST_SPARRING_TEXT:0 "Xin chào, [actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] của ta. Cả hai chúng ta đều cần chuẩn bị cho chiến tranh, rèn luyện kỹ năng và mài giũa trí tuệ. Ta mời ngươi đấu tập cùng ta — hãy mang theo bất kỳ vũ khí nào ngươi muốn!"
