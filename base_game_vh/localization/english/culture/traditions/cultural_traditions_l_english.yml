  traditionalist_discount_desc: "[culture|E] được [culture_head|E] dẫn dắt theo khuynh hướng truyền thống."
  culture_parameter_more_hostage_acceptance: "[characters|E] của [culture|E] này sẵn lòng gửi đi, bắt giữ, và trả lại [hostages|E] hơn thường lệ."
  culture_parameter_more_hostage_acceptance_for_vassals: "[characters|E] của [culture|E] này sẵn lòng gửi đi, bắt giữ, và trả lại [hostages|E] cùng với [liege|E] của họ."

#EP3 Traditions
  tradition_ep3_indomitable_azatani_name: "Azatani Bất Khuất"
  tradition_ep3_indomitable_azatani_desc: "Với giới quý tộc kiêu hãnh và ngoan cường của nền văn hóa này, những kỵ sĩ lao xuống từ các thành trì trên cao với tiếng sấm rền, \"Vết thương do dao găm sẽ lành, nhưng vết thương do lời nói — thì không bao giờ!\""
  culture_parameter_house_hostility_more_common: "[rulers|E] hành xử quyết liệt hơn với các [houses|E] khác"
  culture_parameter_vassals_more_likely_to_refuse_demands: "[characters|E] có xu hướng từ chối [imprisonment|E], [retractions|E] và [revocations|E] nhiều hơn"

  tradition_ep3_audacious_cadets_name: "Những Kẻ Kế Thừa Táo Bạo"
  tradition_ep3_audacious_cadets_desc: "Những đứa con trai thứ đầy bất an định hình nên nền văn hóa này. Táo bạo và không màng đạo đức, các kỵ binh này theo đuổi những giấc mơ phiêu lưu nơi đất xa, các cuộc chiến đánh thuê tàn bạo, và vinh quang chinh phục."

  culture_parameter_ambitious_trait_more_common: "[trait|E] [GetTrait('ambitious').GetName( GetNullCharacter )] xuất hiện thường xuyên hơn"
  culture_parameter_reduced_bodyguard_aptitude: "Giảm [aptitude|E] của [GetCourtPositionType('bodyguard_court_position').GetName()]"

  tradition_ep3_imperial_tagmata_name: "Tagmata Đế Chế"
  tradition_ep3_imperial_tagmata_desc: "Những trung đoàn tinh nhuệ, được trang bị giáp trụ hoàn hảo, tạo thành xương sống cho các chiến dịch quân sự của nền văn hóa này. Binh sĩ kiêu ngạo của họ coi thường các quý tộc võ sĩ tầm thường và những hành vi liều lĩnh mang tính cá nhân; thay vào đó, họ tôn vinh kỷ luật và những danh xưng thiêng liêng của đơn vị mình. #EMP Exkoubitoi! Scholai! Hikanatoi!#!"

  domain_counties_with_stables_desc: "Hiện tại [culture_head|E] không nắm giữ đủ #high 8#! [counties|E] có xây dựng $building_type_stables_01$ trong một [holdings|E] của mình"

  tradition_ep3_roman_ceremonies_name: "Nghi Lễ La Mã"
  tradition_ep3_roman_ceremonies_desc: "Các hoàng đế quá khứ đã để lại cho nền văn hóa này một di sản huy hoàng còn sót lại: những nghi thức lộng lẫy, sự tôn kính dành cho ngôi vị hoàng đế... và một đời sống công cộng đầy bất ổn."

  tradition_ep3_palace_politics_name: "Chính Trị Cung Đình"
  tradition_ep3_palace_politics_desc: "Những hoạn quan quyền thế và đám nịnh thần khoác lụa vận hành một bộ máy chính trị khổng lồ, phô trương xa hoa, tâng bốc bằng danh dự, và âm mưu tàn độc để mưu cầu thăng tiến."
  culture_head_court_grandeur_desc: "[culture_head|E] không đạt [court_grandeur_level|E] #high 8#! hoặc cao hơn"
  culture_parameter_unlock_akolouthos: "Có thể bổ nhiệm [court_position|E] [GetCourtPositionType('akolouthos_court_position').GetName()], khi Đội Cận Vệ Varangian đã được thành lập."

  tradition_tgp_bushido_name: "Võ Sĩ Đạo"
  tradition_tgp_bushido_desc: "Bén rễ từ di sản danh dự và kỷ luật võ đạo, truyền thống này đề cao mối quan hệ giữa lãnh chúa và chư hầu thông qua sự trung thành và chiến công. Sức mạnh nhân cách cùng những hành động chính trực rèn nên lòng trung nghĩa và sự kính trọng không gì lay chuyển được."
  culture_parameter_must_pledge_loyalty_to_liege: "Phải #v Thề Trung Thành#! ngay khi [decision|E] khả dụng"
  culture_parameter_better_petition_outcomes: "[decision|E] #v Thỉnh Nguyện#! cho kết quả tốt hơn"
  culture_parameter_opinion_from_prowess: "Thưởng [opinion|E] từ [prowess|E]"
  culture_parameter_honorable_trait_bonuses: "Các [personality_traits|E] Chăm Chỉ, Khiêm Nhường, Dũng Cảm và Chính Trực được tăng hiệu quả"
  culture_parameter_unlock_infantry_samurai_units: "Có thể tuyển [GetMaA('samurai').GetName] làm [men_at_arms|E]"
  culture_parameter_stalwart_leader_non_admin_duels: "[GetPerk('stalwart_leader_perk').GetName(GetPlayer)] cho phép [single_combat_fight|E] với bất kỳ [character|E] không thuộc [administrative|E], cùng hoặc thấp hơn [rank|E], và thuộc giới tính [martial|E]"
  culture_parameter_non_admin_close_family_non_martial_gender_knights_in_defensive_wars: "[close_family|E] chưa kết hôn và [spouses|E] không thuộc giới tính [martial|E] của các [rulers|E] không phải [administrative|E] có thể phục vụ như $knight_culture_player_plural$ trong các [wars|E] phòng thủ"

  tradition_tgp_court_machinations_name: "Âm Mưu Cung Đình"
  tradition_tgp_court_machinations_desc: "Trong những hành lang mê cung của triều đình, hoạn quan thao túng quyền lực, phi tần tranh giành ân sủng, và những lời thì thầm phản bội vang vọng khắp các gian phòng dát vàng."

  tradition_tgp_art_of_war_name: "Võ Học"
  tradition_tgp_art_of_war_desc: "Dân tộc này đã nghiên cứu binh pháp nghìn năm, tướng soái sở hữu vô số binh thư lẫn sách vở. Kho tàng tri thức ấy chỉ bị lu mờ bởi sự tinh thông kỹ thuật chế tạo giáp bền và vũ khí sắc bén."
  duchies_with_examination_halls_desc: "[culture|E] không sở hữu #high 5#! [duchies|E] nào có $building_type_examination_hall_01$ xây trong một trong các [holdings|E] của mình."
  culture_parameter_unlock_maa_tiefutu: "Có thể chiêu mộ [GetMaA('tiefutu').GetName] làm [men_at_arms|E]."
  culture_parameter_unlock_maa_black_armor_cavalry: "Có thể chiêu mộ [GetMaA('black_armor_cavalry').GetName] làm [men_at_arms|E]."
  culture_parameter_unlock_zhanmadao: "Có thể chiêu mộ [GetMaA('zhanmadao_infantry').GetName] làm [men_at_arms|E]."
  culture_parameter_unlock_burenjia: "Có thể chiêu mộ [GetMaA('burenjia').GetName] làm [men_at_arms|E]."
  culture_parameter_unlock_shenbigong_innovation: "#high $innovation_repeating_crossbow$#! [innovation|E] có thể dùng từ thời $culture_era_tribal$ [era|E] trở đi."
  culture_parameter_military_governor_appointment_score: "[learning_skill|E] làm tăng [candidate_score|E] cho các Tỉnh [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )]"

  tradition_tgp_ephemeral_grace_name: "Vẻ Đẹp Vô Thường"
  tradition_tgp_ephemeral_grace_desc: "Triết lý thẩm mỹ #EMP Mono no Aware#! tôn vinh vẻ đẹp mong manh của những khoảnh khắc thoáng qua. Nó nuôi dưỡng sự hòa hợp sâu sắc với thiên nhiên và khả năng chiêm nghiệm nghệ thuật cùng tính vô thường của kiếp sống."
  culture_parameter_stress_loss_bonus_from_harmonious_traits: "Tăng mức giảm [stress|E] từ các [traits|E] [GetTrait('temperate').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] và [GetTrait('compassionate').GetName( GetNullCharacter )]"

  tradition_tgp_imperial_peace_name: "Hòa Bình Mong Manh"
  tradition_tgp_imperial_peace_desc: "Dù phần lớn được đại dương che chở khỏi xâm lược, việc phòng thủ trước các cuộc cướp bóc từ phương bắc và duy trì hòa bình thời Kanmu trước những kẻ tiếm quyền hay tổng đốc nổi loạn vẫn đòi hỏi chiến binh tinh nhuệ và tổ chức chặt chẽ."
  culture_parameter_unlock_mounted_samurai_units: "Có thể tuyển [GetMaA('japanese_horse_archers').GetName] làm [men_at_arms|E]"

  tradition_tgp_rice_cultivators_name: "Những Người Trồng Lúa"
  tradition_tgp_rice_cultivators_desc: "Lúa gạo là mạch sống của nền văn hóa này. Nhờ lao động cần cù và kiến thức nông nghiệp vững vàng, mùa màng của họ dồi dào miễn là kiểm soát được vùng đất thích hợp. Kết quả là thịnh vượng kinh tế và sức mạnh quân sự của họ vượt xa các láng giềng  kém phát triển hơn."

  tradition_tgp_inward_perfection_name: "Tu Dưỡng Nội Tâm"
  tradition_tgp_inward_perfection_desc: "Nền văn hóa này đề cao tự lực và bồi đắp phẩm hạnh nội tại hơn là ảnh hưởng ngoại lai. Quan hệ ngoại giao có thể phai nhạt, nhưng tri thức và sự chiêm nghiệm nở rộ trong trạng thái cô lập yên bình."

  tradition_tgp_fortified_strongholds_name: "Thành Trì Kiên Cố"
  tradition_tgp_fortified_strongholds_desc: "Nền văn hóa này được đặc trưng bởi những đô thị kiên cố đồ sộ, vừa đảm nhiệm vai trò tôn giáo, quân sự lẫn hành chính. Việc bảo vệ các thành trì văn hóa này là tối quan trọng, và việc xây dựng thêm những đô thị mới là một vấn đề mang ý nghĩa danh giá lớn."
  culture_parameter_founding_temple_citadels_gives_more_piety: "Thành lập [temple_citadel|e] [holdings|e] ban cho #P +100%#! [piety|e]"
  culture_parameter_warmonger_city_founders: "Thành lập [temple_citadel|e] [holdings|e] sẽ đặt [control_i|e][control|e] lên mức #P 100%#!"
  culture_parameter_temple_citadel_fort_level_bonus: "[temple_citadels|e] có [fort_level_i][fort_level|E] tăng thêm"
  culture_parameter_temple_citadel_control_bonus: "[temple_citadels|e] cung cấp một lượng nhỏ [control_i][control|E]"
  not_a_defense_focused_culture: "Ít hơn #N 50%#! [culture|e] [counties|e] là [coastal|e]"

  tradition_tgp_hydraulic_builders_name: "Những Người Xây Dựng Thủy Công"
  tradition_tgp_hydraulic_builders_desc: "Nền văn hóa này đặt tầm quan trọng lớn vào việc khai thác các công trình thủy lợi theo hướng tâm linh. Trọng tâm của sự sùng bái này là [GetBuilding('sacred_pool_06').GetName], thường được mở rộng thành những hồ chứa lớn mang ý nghĩa tôn giáo sâu sắc."
  culture_parameter_sacred_pool_additional_bonuses: "Dòng [buildings|E] [GetBuilding('sacred_pool_01').GetTypeName|V] nhận thêm lợi ích trong các [counties|E] thuộc [culture|E] này"
  culture_parameter_waterworks_additional_bonuses: "Dòng [buildings|E] [GetBuilding('waterworks_01').GetTypeName|V] nhận thêm lợi ích trong các [counties|E] thuộc [culture|E] này"
  culture_parameter_may_build_sacred_pools_ahead_of_time: "Tất cả [buildings|E] thuộc dòng [GetBuilding('sacred_pool_01').GetTypeName|V] có thể được xây sớm hơn một [era|E]"

  tradition_tgp_esoteric_power_name: "Quyền Năng Huyền Bí"
  tradition_tgp_esoteric_power_desc: "Thiêng liêng và huyền bí là hai từ dùng để mô tả tầng lớp quý tộc trong con mắt của nền văn hóa này. Những người cai trị muốn củng cố thiên mệnh của mình phải tham gia vào các nghi lễ phức tạp và thể hiện quyền lực thông qua việc trưng bày các thánh vật."
  culture_parameter_increases_effect_of_mandala_realm_contracts: "[piety|e] và [legitimacy|e] nhận được từ [mandala_rituals|e] được gia tăng"
  culture_parameter_may_commission_kris: "Có thể sử dụng [decision|e] [GetDecisionWithKey('commission_artifact_decision').GetName] để chế tác [artifacts|E] Kris"
  culture_parameter_piety_level_affect_artifact_quality: "[inspirations|E] tạo ra [artifacts|E] có chất lượng cao hơn tùy theo [piety_level|E] của người đặt chế tác"
  culture_parameter_kris_artifacts_are_more_powerful: "Các [artifacts|e] Kris $artifact_dagger$ được chế tác nhận thêm hiệu ứng"

  tradition_tgp_barangay_confederations_name: "Liên Minh Barangay"
  tradition_tgp_barangay_confederations_desc: "Những người cai trị của nền văn hóa này lãnh đạo nhiều tiểu quốc rải rác dọc theo các cửa sông và vùng duyên hải. Các quốc gia này khác biệt lớn về quy mô, nhưng thường liên kết thành các liên minh, do một thủ lĩnh được bầu chọn từ hàng ngũ các [Glossary( 'Datu', 'DATU_GLOSS' )] lãnh đạo."
  DATU_GLOSS: "Danh xưng dùng để chỉ các thủ lĩnh của những chính thể khác nhau trên khắp Philippines."
  culture_parameter_religious_relations_is_empowered: "[piety|e] nhận được từ [religious_relations|e] tăng #P +20%#!"
  culture_parameter_forming_confederations_is_easier: "Việc thành lập một [confederation|E] không còn yêu cầu láng giềng  hùng mạnh, hoặc [GetTrait('diplomat').GetName(GetNullCharacter)] hay [GetTrait('family_first').GetName(GetNullCharacter)] [traits|E]"
