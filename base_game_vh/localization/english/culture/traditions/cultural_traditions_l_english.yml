  recruit_terrain_specialist_decision_desc: "Quân thù vô số, binh lính không phải lúc nào cũng chọn được địa hình. \n\nĐể thắng khắp nơi, cần những tướng biết biến đất đai thành lợi thế cho quân mình."
 
  commander_recruited.t:0 "Đã Chiêu Mộ Tướng"
  commander_recruited.desc:0 "[new_commander.GetUIName] đã gia nhập triều đình của ngươi!"
 
  recruit_gardener_decision:0 "Chiêu Mộ Người Làm Vườn"
  recruit_gardener_decision_desc:0 "Chúng ta, [ROOT.Char.GetCulture.GetCollectiveNoun], hiểu biết thấu đáo về việc tạo hình và chăm sóc vườn. Không thiếu những người làm vườn tài năng mà ta có thể dụng."
