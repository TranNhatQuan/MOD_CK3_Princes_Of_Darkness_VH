  culture_parameter_martial_traits_give_out_hcav_bonus: "[traits|E] [GetTrait('gallant').GetName( GetNullCharacter )], [GetTrait('overseer').GetName( GetNullCharacter )] và [GetTrait('strategist').GetName( GetNullCharacter )] cung cấp bonus cho [men_at_arms|E] [heavy_cavalry|E]"
  culture_parameter_stewardship_traits_give_out_cav_bonus: "[traits|E] [GetTrait('avaricious').GetName( GetNullCharacter )], [GetTrait('architect').GetName( GetNullCharacter )] và [GetTrait('administrator').GetName( GetNullCharacter )] cung cấp bonus cho [men_at_arms|E] [light_cavalry|E], [heavy_cavalry|E] và [archer_cavalry|E]"

  mpo_siberian_permafrost_modifier: "Băng vĩnh cửu Siberia"
  mpo_siberian_permafrost_modifier_desc: "Lớp đất đã đóng băng suốt hàng thiên niên kỷ, không có nguồn nước ngầm, thảm thực vật thưa thớt. Địa hình thay đổi mỗi năm do quá trình tan băng và đóng băng lặp đi lặp lại. Để biến những vùng đất này thành quê hương của mình, những người sinh sống tại đây cần hàng thế kỷ để thích nghi. Tất cả những kẻ khác, mọi thứ khác, sẽ diệt vong và hòa vào những người đã chết từ thời cổ đại bên dưới lớp băng.\n\n#weak Có thể loại bỏ [modifier|E] này bằng [interaction|E] #V $feudalize_holding_interaction$#! hoặc #V $demand_admin_interaction$#!, hoặc sau khi chinh phục toàn bộ phương Bắc bằng [decision|E] #V $expand_the_steppe_decision_generic$#! cho khu vực #V $dlc_mpo_steppe_siberia_further_expansion_tooltip$#!#!\n\n"

  mpo_siberian_permafrost_modifier_bad: "$mpo_siberian_permafrost_modifier$"
  mpo_siberian_permafrost_modifier_bad_desc: "$mpo_siberian_permafrost_modifier_desc$"
  cannot_hybridize_northern_tribes: "[tradition|E] #high $tradition_mpo_northern_tribes_name$#! không thể được chọn cho một [hybrid_culture|E]"

 # TGP
  tradition_cultural_primacy_name: "Ưu Thế Văn Hóa"
  tradition_cultural_primacy_desc: "Nền văn hóa đầy tự hào này hài lòng khi chỉ nhìn lại lịch sử phong phú và đời sống xã hội của chính mình, và hầu như không thấy cần phải hạ mình giao hòa với các láng giềng ."
  culture_parameter_reduced_marriage_acceptance_outside_culture: "[characters|E] ít sẵn lòng kết hôn với các [cultures|E] khác"
  culture_parameter_reduced_marriage_acceptance_distant_realms: "[characters|E] ít sẵn lòng kết hôn với các [realms|E] xa xôi"
  REDUCED_MARRIAGE_ACCEPTANCE_OUTSIDE_CULTURE_REASON: "[secondary_recipient.GetCulture.GetName] miễn cưỡng kết hôn với các [cultures|E] khác: $VALUE|=+0$"
  REDUCED_MARRIAGE_ACCEPTANCE_DISTANT_REALMS_REASON: "[secondary_recipient.GetCulture.GetName] miễn cưỡng kết hôn với các [realms|E] xa xôi: $VALUE|=+0$"
  REDUCED_MARRIAGE_ACCEPTANCE_DISTANT_REALMS_INVERTED_REASON: "Sự miễn cưỡng mang tính tương hỗ của [secondary_recipient.GetCulture.GetName] trong việc kết hôn với các [realms|E] xa xôi: $VALUE|=+0$"
  REDUCED_MARRIAGE_ACCEPTANCE_HOUSE_RELATION_REASON: "[house_relation|E]: $VALUE|=+0$"

  tradition_maritime_way_of_life_name: "Lối Sống Hàng Hải"
  tradition_maritime_way_of_life_desc: "Từ thuở hồng hoang, những chiếc thuyền hai thân vượt sóng của nền văn hóa này đã xuất hiện nơi chân trời. Những chuyến hải hành dài ngày là bản năng thứ hai của dân tộc này.\nVới những ai coi cuộc sống trên biển là điều tự nhiên, không có giới hạn nào về nơi họ có thể định cư, cách họ buôn bán hay kẻ thù họ có thể cướp bóc."

  tradition_nudists_name: "Chủ Nghĩa Khỏa Thân"
  tradition_nudists_desc: "Những người theo nền văn hóa này không tin vào việc che chắn cơ thể trước các yếu tố tự nhiên, mà chọn sống đúng như cách đấng sáng tạo đã tạo ra họ."

  tradition_stratified_society_name: "Xã Hội Phân Tầng"
  tradition_stratified_society_desc: "Có những người sinh ra để lãnh đạo, và cũng có những kẻ sinh ra để phục tùng. Trong một $tradition_stratified_society_name$, thực tế của đặc quyền cha truyền con nối thường lấn át các nguyên tắc về năng lực, và sự gần gũi với quyền lực là tất cả."
  culture_parameter_family_shares_merit: "Khi đạt tới @merit_level_5_icon![GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] [merit|E], mọi [close_family_member|E] thuộc giới tính ưu tiên dưới cấp bậc này sẽ nhận được một lượng lớn [merit|E]"
  culture_parameter_family_skips_exams: "Ngoài ra, những [close_family_members|E] đó cũng sẽ được coi như đã vượt qua @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
  culture_parameter_marrying_into_the_ruling_family_gives_influence: "Khi một [independent_ruler|E] kết hôn với một [character|E] trong cùng [realm|E] và cùng chia sẻ [tradition|E] này, [house_head|e] của [spouse_possessive|e] sẽ nhận được một lượng lớn [influence|E]"
  culture_parameter_unlocks_gakgung_archers_maa: "Có thể tuyển [GetMaA('gakgung_archers').GetName] làm [men_at_arms|E]"

  tradition_stratified_society_toast_title: "[ROOT.Char.GetHouse.GetNameNoTooltip] Trỗi Dậy"
  tradition_stratified_society_toast_desc: "Nhờ đặc quyền từ địa vị cao quý của Ngài, các thân thích gần đã nhận được [merit|E] và không cần tham gia @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
  tradition_stratified_society_family_member_toast_title: "$tradition_stratified_society_toast_title$"
  tradition_stratified_society_family_member_toast_desc: "Nhờ thành tựu của [family_success.GetName], Ngài đã nhận được [merit|E] và không cần tham gia @provincial_exam_icon! [GetActivityType( 'activity_local_examination' ).GetName]"
  tgp_nepotism_bypass_exams_modifier: "Miễn Khảo Thí"
  tgp_nepotism_bypass_exams_modifier_desc: "Nhân vật này đã né tránh kỳ khảo thí thông thường để trở thành quan lại nhờ ảnh hưởng của thân thích."
 
  tradition_fortress_mastery_name: "Bậc Thầy Pháo Đài"
  tradition_fortress_mastery_desc: "Nền văn hóa này có truyền thống lâu đời về sự khéo léo trong phòng thủ, biết tận dụng địa hình địa phương để bảo vệ quê hương và đẩy lùi những kẻ muốn xâm lược. Họ kết hợp kỹ năng này với sự tinh thông cung thuật cùng các đạo quân cơ động, có khả năng điều binh vượt trội hơn bất kỳ kẻ thù nào."
  culture_parameter_governor_trait_gives_counter_resistance: "Mỗi cấp của [trait|E] [GetTrait('governor').GetName( GetPlayer )] sẽ cộng thêm [EmptyScope.ScriptValue('governor_trait_counter_bonus_value')|+%0] $MOD_COMBAT_COUNTER_RESISTANCE|V$"

  tenet_takamin_name: "Takamin"
  tenet_takamin_desc: "Tin rằng loài gấu là hiện thân của thần linh, sự linh thiêng của chúng phải được tôn trọng, và việc săn giết phải được tiến hành với sự thành kính tối đa."
  doctrine_parameter_allows_bear_sacrifice: "Mở khóa [GetDecisionWithKey('sacrifice_bear_decision').GetName] [decision|E]"
  doctrine_parameter_chance_to_gain_prowess_during_bear_hunts: "Hạ sát một #V Gấu#! trong [GetActivityType('activity_hunt').GetName] sẽ cho [prowess_i][prowess|e] và [martial_i][martial|E]"
  doctrine_parameter_frequent_bear_sightings: "[hunt_sightings|E] về #V Gấu#! sẽ xuất hiện định kỳ"
  doctrine_parameter_efficient_hunt_cornering: "Trong các [GetActivityType('activity_hunt').GetName], phương thức #V Dồn Góc#! có khả năng thành công cao hơn"
  culture_tradition_events.3000.t: "Phát Hiện Gấu"
  culture_tradition_events.3000.desc: "Thợ săn tại [bear_sighting.GetName] đã phát hiện dấu vết của một [bear_sighting_county.Custom('GetAnimalGroup')] [bear_sighting_county.Custom('GetAnimalPlural')] lang thang trong [bear_sighting.Custom('GetTerrainTypePlural')] — dấu chân lớn trên bùn, thân cây bị cào xước, bụi rậm gãy nát.\n\nNếu ta [GetActivityType('activity_hunt').GetName|l] và giết hoặc bắt được một con, chắc chắn các linh hồn sẽ chú ý."
  culture_tradition_events.3000.a: "Chuẩn bị giáo mác..."
  bear_sacrifice_war_modifier: "Hiến Tế Gấu Cho Chiến Tranh"
  bear_sacrifice_war_modifier_desc: "Nhân vật này đã hiến tế một con gấu và tin rằng mình được ban phúc cho chiến tranh."
  bear_sacrifice_authority_modifier: "Hiến Tế Gấu Cho Quyền Uy"
  bear_sacrifice_authority_modifier_desc: "Nhân vật này đã hiến tế một con gấu và tin rằng mình được ban phúc về uy quyền."
  sacrifice_bear_decision_effect: "Nhận lựa chọn giữa [piety_i][piety|E], [GetModifier('bear_sacrifice_war_modifier').GetNameWithTooltip], hoặc [GetModifier('bear_sacrifice_authority_modifier').GetNameWithTooltip]"
  culture_tradition_events.3100.t: "Lễ Hiến Tế Gấu"
  culture_tradition_events.3100.desc: "Chúng ta trói con gấu lớn trong im lặng. Thợ săn cất tiếng hát trầm, khói hương vươn lên cùng mùi nhựa thông.\n\nTa quỳ xuống, áp trán vào mõm nó và thì thầm lời cảm tạ trước khi lưỡi dao hạ xuống. Chúng ta sẽ chia sẻ thịt nó, để sức mạnh của nó sống tiếp trong cộng đồng."
  culture_tradition_events.3100.a: "Hãy mở tiệc!"
  culture_tradition_events.3100.b: "Kẻ thù sẽ gục ngã!"
  culture_tradition_events.3100.c: "Hãy phục tùng, vì linh hồn gấu đứng về phía ta."
 
  tradition_ordo_riders_name: "Kỵ Sĩ Ordo"
  tradition_ordo_riders_desc: "Nhu cầu chăn thả và sự cần thiết phải củng cố sự đoàn kết của bộ tộc đã khiến nhiều người du mục của nền văn hóa này trở thành những chiến binh dạn dày, vừa có thể chống trả kẻ thù vừa thu thập tiếp tế hiệu quả cho cộng đồng."
  culture_parameter_unlocks_ordo_riders_maa: "Có thể tuyển [GetMaA('ordo_riders_horse_archers').GetName] làm [men_at_arms|E]"
  culture_parameter_reaver_gives_buffs_to_horse_archers: "[GetTrait('reaver').GetName( GetNullCharacter )] [traits|E] sẽ tăng cường sức mạnh cho [archer_cavalry|e] [men_at_arms|e]"
 
  tradition_chinese_arts_name: "Nghệ Thuật Trung Hoa"
  tradition_chinese_arts_desc: "Con đường của bút mực, con đường của thư họa — những yếu tố cốt lõi của nền văn hóa này. Thay vì chỉ dựa vào sức mạnh quân sự hay bộ máy hành chính phức tạp, người Trung Hoa đề cao việc hoàn thiện mọi hình thức nghệ thuật."
  culture_parameter_commissions_cheaper: "[decision|e] #bold $commission_artifact_decision$#! rẻ hơn #P 50%#! [gold_i][gold|e]"
  culture_parameter_scholars_and_poets_are_viewed_more_positively: "[GetTrait('lifestyle_poet').GetName( GetNullCharacter )] và [GetTrait('scholar').GetName( GetNullCharacter )] [traits|E] được đánh giá tích cực hơn"

  tradition_sinophilic_name: "Sùng Hán"
  tradition_sinophilic_desc: "Ảnh hưởng từ bá quyền Trung Hoa đã khiến nhiều người trong lãnh thổ này tiếp nhận phong tục của họ."
  culture_parameter_can_adopt_chinese_culture: "Có thể tiếp nhận [GetCultureByKey('han').GetCollectiveNoun] [culture|e]"
  culture_parameter_more_successful_kowtows: "[tribute_missions|E] có tỷ lệ thành công cao hơn"
  culture_parameter_may_adopt_silk_road_innovations: "Có thể tiếp cận [silk_road_innovations|E] mà [GetCultureByKey('han').GetCollectiveNoun] [culture|E] đã biết"

  tradition_tgp_warrior_monks_name: "Tu Sĩ Chiến Binh"
  tradition_tgp_warrior_monks_desc: "Sống đạo đức không đồng nghĩa với việc từ bỏ vũ lực, nhất là khi cần bảo vệ cộng đồng tôn giáo khỏi các giáo phái đối địch, quan lại tha hóa, hay để che chở cho kẻ yếu."
  culture_parameter_unlock_warrior_monk_units: "Có thể tuyển [GetMaA('warrior_monks').GetName] làm [men_at_arms|E]"

  tradition_scholar_officials_name: "Quan Lại Nho Học"
  tradition_scholar_officials_desc: "Bút mực mạnh hơn gươm giáo... Nền văn hóa này tin tưởng sâu sắc vào lý tưởng trao quyền lực cho những quan lại trung thành, được giáo dục trong các nghệ thuật cao quý."
  culture_parameter_can_always_convert_to_confucianism: "Có thể dùng [GetDecisionWithKey('convert_to_confucianism').GetName] [decision|E]"
  culture_parameter_can_always_convert_to_taoism: "Có thể dùng [GetDecisionWithKey('convert_to_taoism').GetName] [decision|E]"
  culture_parameter_can_author_books: "Có thể thực hiện [decision|E] #V $author_book_decision$#!"
  culture_parameter_scholar_official_trait_bonuses: "[GetTrait('confucian_education').GetName( GetNullCharacter )] và [GetTrait('loyal').GetName( GetNullCharacter )] [traits|E] có thêm hiệu ứng"
  culture_parameter_wants_to_learn_chinese: "Nhân vật thuộc [culture|E] này thường sẽ học [language|E] Trung Hoa"
  culture_parameter_learn_language_success_chance_for_others: "[GetScheme('learn_language').GetTypeName] [success_chance|E]: #P +50%#! khi học [language|E] của nền văn hóa này"
  culture_parameter_mystic_trait_from_education: "Trẻ em có thể nhận [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] nếu có [guardian|E] cùng [culture|E] này với #V 12+#! [learning_i][learning|E]"

  tradition_cultivation_name: "Tu Luyện"
  tradition_cultivation_desc: "Điều hòa thân thể, hơi thở và tâm trí cho đến khi bùn trong lòng lắng xuống, để nội đức trỗi dậy như làn nước trong."

  tradition_intensive_farming_name: "Canh Tác Thâm Canh"
  tradition_intensive_farming_desc: "Nền văn hóa này đặc biệt coi trọng tầng lớp nông dân đông đảo nhằm nuôi sống dân cư phi nông nghiệp. Qua hàng thiên niên kỷ tích lũy kinh nghiệm, họ đã gia tăng đáng kể sản lượng lúa mì và lúa nước, tùy theo điều kiện địa phương."

 # ACH
  oath_mend_the_fracture_tradition_name:0 "Di Sản Hòa Giải Thệ Ước"
  oath_mend_the_fracture_tradition_desc:0 "Từ cơn phẫn nộ và sự ngờ vực đẫm máu, một tiến trình hòa giải đã hình thành. Được dẫn dắt bởi vị quân chủ mang thệ ước, nền văn hóa này đã hàn gắn vết rạn nứt giữa mình và các dân tộc khác trong lãnh thổ, đạt tới hòa bình và thịnh vượng."
  culture_parameter_synergy_cultures_counties_development: "Mỗi ba năm, các [counties|E] của [culture|E] này có thể nhận được [GetModifier('oath_mend_the_fracture_county').GetNameWithTooltip] [modifier|E]"
  culture_parameter_synergy_cultures_maa_spawn: "Mỗi ba năm, [culture_head|E] có thể nhận thêm các [soldiers|E] đặc biệt"
  culture_parameter_synergy_cultures_opinion_gain: "Mỗi ba năm, [culture_head|E] có thể nhận được [opinion|E] với [culture_head|E] của [culture|E] đã được hòa giải"
  culture_parameter_synergy_cultures_positive_chance_desc: "Xác suất và mức độ của các hiệu ứng trên bị ảnh hưởng bởi [cultural_acceptance|E] giữa các [cultures|E] đã được hòa giải và [opinion|E] với [culture_head|E] còn lại"
  ach_culture_synergy_troops: "Quân Đoàn Thệ Ước"

