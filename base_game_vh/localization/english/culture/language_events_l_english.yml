l_english:
  language_events.0001.t:0 "Sự Trì Trệ Từ Vựng"
  language_events.0001.desc:1 "Thật khó để giữ hết từng ấy ngôn ngữ trong đầu, ta cứ liên tục quên mất mình đang nói thứ tiếng nào!\n\nMới hôm kia thôi, ta đã vô tình tự giới thiệu bản thân bằng một mớ hỗn hợp lộn xộn giữa từ ngữ của [language_to_forget.GetLanguage.GetNameNoTooltip] và [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]... mà mãi đến khi có người chỉ ra, ta mới nhận ra mình đã làm vậy!\n\nCó lẽ ta nên để cho [language_to_forget.GetLanguage.GetNameNoTooltip] dần trôi khỏi tâm trí mình..?"
  language_events.0001.a:0 "Hãy để nó rơi vào quên lãng..."
  language_events.0001.b:0 "Không! Ta phải nỗ lực hơn và học hành chăm chỉ hơn nữa!"
  language_events.0002.b.tt:0 "Ngài phái người thu thuế để 'đánh thuế' [gold_i]#P 50#! từ mỗi quận của [vassal_speaking_other_language.GetCulture.GetName] trong lãnh địa của [vassal_speaking_other_language.GetTitledFirstNamePossessive]"
  language_events.0002.t:0 "Một Ngôn Ngữ Chung"
  language_events.0002.desc:0 "Tin đã truyền đến tai ta rằng chư hầu của ta, [vassal_speaking_other_language.GetTitledFirstName], đang công khai ca ngợi khả năng thông thạo tiếng [vassal_speaking_other_language.GetCulture.GetLanguage.GetName] của ta — chính là ngôn ngữ mà thần dân của [vassal_speaking_other_language.GetHerHis] đang sử dụng!\n\nCác cận thần khuyên ta nên tận dụng cơ hội này bằng cách gửi một bức thư viết bằng [vassal_speaking_other_language.GetCulture.GetLanguage.GetNameNoTooltip] cho [vassal_speaking_other_language.GetHerHim], ghi nhận những hành động của [vassal_speaking_other_language.GetHerHis]."
  language_events.0002.a:0 ""Hiểu biết sâu sắc hơn sẽ mang lại thịnh vượng chung!""
  language_events.0002.b:0 ""Ồ hô hô! Giờ thì ta có thể đánh thuế ngươi hiệu quả hơn rồi, hỡi chư hầu thân mến.""

  language_events.0010.t:0 "Đến Giờ Học Tiếng [language_to_forget.GetLanguage.GetNameNoTooltip|U] Của Ngươi Rồi!"
  language_events.0010.desc:0 "Ta giật mình tỉnh giấc trong mồ hôi sau một cơn ác mộng kinh hoàng, nơi một con cú cứ liên tục theo sát ta và kiểm tra kiến thức của ta về ngôn ngữ [language_to_forget.GetLanguage.GetNameNoTooltip].\n\nLà biểu tượng của trí tuệ trong một số nền văn hóa, con quái vật có lông vũ ấy đã rình rập ta suốt đêm dài, và ta sợ hãi việc làm nó thất vọng. Có lẽ đúng là tồn tại khái niệm \"quá nhiều tri thức\", và giấc mơ này chính là hệ quả của toàn bộ áp lực mà ta phải gánh chịu để giữ cho kỹ năng của mình luôn sắc bén."
  language_events.0010.a:0 "Chuyện này không thể tiếp diễn."
  language_events.0010.b:0 "Ta sẽ tiếp tục tự thúc ép bản thân mỗi ngày!"
