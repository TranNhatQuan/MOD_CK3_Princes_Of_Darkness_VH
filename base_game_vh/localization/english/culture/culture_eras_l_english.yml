 #ERAS
  culture_era_tribal:0 "Thời kỳ Bộ lạc"
  culture_era_tribal_desc:0 "Thời kỳ Bộ lạc của một [culture|E] có trước sự hình thành các bộ luật thành văn và một chính quyền được thể chế hóa. Các người cai trị theo [tribal_government|E] và [nomadic_government|E] chỉ có thể sử dụng các [innovations|E] thuộc Thời kỳ Bộ lạc."
  culture_era_early_medieval:0 "Thời Trung Cổ Sơ kỳ"
  culture_era_early_medieval_desc:0 "Thời Trung Cổ Sơ kỳ chứng kiến sự xuất hiện của các viên chức chuyên nghiệp và nhiều [innovations|E] quan trọng, cho phép một [culture|E] thoát khỏi Thời kỳ Tăm tối."
  culture_era_high_medieval:0 "Thời Trung Cổ Đỉnh cao"
  culture_era_high_medieval_desc:0 "Thời Trung Cổ Đỉnh cao là giai đoạn có những tiến bộ vượt bậc về công nghệ và hành chính, khi các thị trấn phát triển thành đô thị và tầng lớp thị dân trỗi dậy, dù giới quý tộc vẫn nắm quyền tối cao."
  culture_era_late_medieval:0 "Thời Trung Cổ Hậu kỳ"
  culture_era_late_medieval_desc:0 "Thời Trung Cổ Hậu kỳ đánh dấu đỉnh cao của thế giới phong kiến. Quan lại, thợ thủ công, thương nhân và chủ cho vay tiền bắt đầu lấn át quyền lực của các tầng lớp đặc quyền cũ, ngoại trừ chính các quân vương."
