 # Kurultai Task Tooltips
 kurultai_task.1001.notification: "Bầy Gia Súc Phồn Thịnh"
 kurultai_task.1001.desc: "Nhờ sự chăm chỉ của [councillor.GetShortUIName], bầy gia súc của chúng ta đang phát triển mạnh mẽ."

 kurultai_task.1006.notification: "Chiêu Mộ Horde"
 kurultai_task.1006.desc: "Một nhóm nhỏ những người chăn nuôi bị đuổi khỏi vùng đất của họ đã tuyên thệ trung thành với bộ tộc chúng ta."
 kurultai_herder_army: "Horde Người Chăn Nuôi"

 kurultai_task.1051.notification: "Bầy Gia Súc Suy Giảm"
 kurultai_task.1051.desc: "Bất chấp nỗ lực của [councillor.GetShortUINamePossessive], bầy gia súc của chúng ta đã suy giảm."

 kurultai_task.1056.notification: "Quyền Kiểm Soát Suy Giảm"
 kurultai_task.1056.desc: "Những nỗ lực cải thiện bầy gia súc của [councillor.GetShortUINamePossessive] đã gây ra xáo trộn và xung đột trong dân chúng."

 kurultai_task.1101.notification: "Sinh Sản Hưng Thịnh"
 kurultai_task.1101.desc: "[county.GetDefinitiveName] đang phát triển mạnh mẽ nhờ [councillor.GetShortUIName]."

 kurultai_task.1106.notification: "Sự Cai Trị Được Lòng Dân"
 kurultai_task.1106.desc: "Công việc của [councillor.GetShortUINamePossessive] tại [county.GetDefinitiveName] đã mang lại một vận may bất ngờ."

 kurultai_task.1151.notification: "Sinh Sản Suy Giảm"
 kurultai_task.1151.desc: "[councillor.GetShortUIName] đã xử lý kém bầy gia súc của chúng ta tại [county.GetDefinitiveName], khiến khả năng sinh sản trong khu vực suy giảm."

 kurultai_task.1156.notification: "Sự Cai Trị Bị Ghét Bỏ"
 kurultai_task.1156.desc: "Cách xử lý [county.GetNameNoTier] của [councillor.GetShortUINamePossessive] vô cùng không được lòng dân, và điều đó ảnh hưởng đến sự cai trị của ta với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip]."

 kurultai_task.1201.notification: "Sự Cai Trị Đầy Đức Tin"
 kurultai_task.1201.desc: "Dân chúng của ta ấn tượng với công việc mà [astrologer.GetShortUIName] và [councillor.GetShortUIName] đang thực hiện thay mặt ta."

 kurultai_task.1206.notification: "$court_astrologer_court_position$ Thân Thiện"
 kurultai_task.1206.desc: "[kurultai|E] của ta, [councillor.GetShortUIName], đã xây dựng mối quan hệ gắn bó hơn với [astrologer.GetShortUIName] thay mặt ta."

 kurultai_task.1251.notification: "Sự Cai Trị Đáng Xấu Hổ"
 kurultai_task.1251.desc: "Dân chúng đang chỉ trích [astrologer.GetShortUIName] và [councillor.GetShortUIName] vì lạm dụng chức vị của họ."

 kurultai_task.1256.notification: "$court_astrologer_court_position$ Phẫn Nộ"
 kurultai_task.1256.desc: "[kurultai|E] của ta, [councillor.GetShortUIName], liên tục bất hòa với $court_astrologer_court_position$ của ta, [astrologer.GetShortUIName]."

 kurultai_task.1301.notification: "Phát Hiện Bất Ngờ"
 kurultai_task.1301.desc: "[councillor.GetShortUIName] đã thu thập được nhiều vàng hơn dự kiến tại [county.GetNameNoTier]."

 kurultai_task.1306.notification: "Xây Dựng Danh Tiếng"
 kurultai_task.1306.desc: "Ta đã mang tiếng là một kẻ cai trị tàn bạo sau khi giao cho [councillor.GetShortUIName] khai thác [county.GetNameNoTier]."

 kurultai_task.1351.notification: "Vùng Đất Bị Khai Thác"
 kurultai_task.1351.desc: "Những nỗ lực tận dụng tối đa [county.GetNameNoTier] của [councillor.GetShortUINamePossessive] đã gây ra những hệ quả ngoài dự kiến, dù không quá bất ngờ."

 kurultai_task.1356.notification: "Người Dân Bị Bóc Lột"
 kurultai_task.1356.desc: "Công việc của [councillor.GetShortUIName] đã gây ra hậu quả thảm khốc cho các bộ lạc địa phương sinh sống tại [county.GetNameNoTier]."

 kurultai_task.1401.notification: "Những Kẻ Cướp Bóc Ấn Tượng"
 kurultai_task.1401.desc: "Những kẻ cướp bóc của chúng ta bị khiếp sợ khắp nơi nhờ sự huấn luyện của [councillor.GetShortUIName]."

 kurultai_task.1406.notification: "Những Kẻ Cướp Bóc Đáng Sợ"
 kurultai_task.1406.desc: "Những kẻ cướp bóc của chúng ta gieo rắc nỗi sợ hãi khắp nơi, cả trong lẫn ngoài biên giới."

 kurultai_task.1451.notification: "Những Kẻ Cướp Bóc Kém Ấn Tượng"
 kurultai_task.1451.desc: "Không hiểu sao, những kẻ cướp bóc của ta giờ còn kém cỏi hơn cả khi [councillor.GetShortUIName] bắt đầu làm việc với họ."

 kurultai_task.1456.notification: "Những Kẻ Cướp Bóc Thảm Hại"
 kurultai_task.1456.desc: "Ăn mày, bợm nhậu, và lũ yếu đuối. [councillor.GetShortUIName], trả lại cho ta những kẻ cướp bóc!"

 kurultai_task.1501.notification: "Xây Dựng Quan Hệ Văn Hóa"
 kurultai_task.1501.desc: "$task_accept_culture_acceptance_gain$"

 kurultai_task.1506.notification: "Gắn Kết Văn Hóa"
 kurultai_task.1506.desc: "Nhờ những nỗ lực của [councillor.GetShortUIName], người ngoại quốc cảm thấy được chào đón tại triều đình."

 kurultai_task.1551.notification: "Quan Hệ Văn Hóa Suy Yếu"
 kurultai_task.1551.desc: "Những nỗ lực của [councillor.GetShortUINamePossessive] chỉ khiến mối quan hệ văn hóa trở nên tệ hơn."

 kurultai_task.1556.notification: "Mối Quan Hệ Tan Vỡ"
 kurultai_task.1556.desc: "Bất chấp những nỗ lực của [councillor.GetShortUIName], người ngoại quốc cảm thấy không được chào đón tại triều đình."

