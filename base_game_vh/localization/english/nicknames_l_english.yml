l_english:
  DEFAULT_NICKNAME_DESC:2 "Bạn Bè và kẻ thù khắp đất nước biết [CHARACTER.GetShortUINameNoTooltipNoFormat] với tên gọi '[CHARACTER.GetNicknameNoTooltip]'."

  nick_tiny:0 "Nhỏ Bé"
  nick_tiny_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được biết đến vì... tham vọng về chiều cao của [CharYourHerHis(CHARACTER)]."
  nick_bluetooth:0 "Răng Khểnh"
  nick_bluetooth_desc:1 "Một chiếc răng đen duy nhất tạo cho [CHARACTER.GetShortUINameNoTooltipNoFormat] một nụ cười nổi tiếng đặc biệt."
  nick_canmore:1 "Đầu To"
  nick_canmore_desc:1 "Còn gọi là 'Đại Thủ Lĩnh', [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] được coi là một sức mạnh đoàn kết mạnh mẽ cho vương quốc."
  nick_tanglehair:0 "Tóc Rối"
  nick_tanglehair_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] đã thề sẽ không bao giờ chải, cắt hay gội tóc [CharYourHerHis(CHARACTER)] trước khi thống nhất các lãnh chúa tranh chấp ở Na Uy."
  nick_fairhair:0 "Tóc Vàng"
  nick_fairhair_desc:1 "Sau khi thống nhất Na Uy dưới cờ của [CharYourHerHis(CHARACTER)], [CharYouSheHe(CHARACTER)] có quyền cắt, tạo kiểu và ướp hương cho tóc [CharYourHerHis(CHARACTER)]. Không có mái tóc nào đẹp hơn mái tóc được giành bằng công sức và đấu tranh."
  nick_haardraade:0 "Kẻ Thống Trị Cứng Rắn"
  nick_haardraade_desc:1 "Trước mặt [CharYourHerHis(CHARACTER)], mọi người gọi [CharYouHerHim(CHARACTER)] là $nick_haardraade$. Sau lưng [CharYourHerHis(CHARACTER)], thái độ lạnh lùng và công lý khắc nghiệt của [CharYourHerHis(CHARACTER)] khiến họ gọi [CharYouHerHim(CHARACTER)] là $nick_the_tyrant$."
  nick_hardeknud:0 "Harthacnut"
  nick_hardeknud_desc:1 "[CharYourHerHis(CHARACTER)|U] nhiều thần dân không thể thống nhất cách phát âm chính xác tên [CharYourHerHis(CHARACTER)], và [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] được biết đến với nhiều biến thể."
  nick_hildetand:0 "Răng Mạnh"
  nick_hildetand_desc:1 "Truyền thuyết kể về [CHARACTER.GetShortUINameNoTooltipNoFormat] mất răng dữ dội trong trận chiến — chỉ để mọc lại hai chiếc răng mới một cách thần kỳ."
  nick_lodbrok:1 "Loðbrók"
  nick_lodbrok_desc:1 "Đám đông run sợ trên thế gian gọi [CharYouHerHim(CHARACTER)] là \"Quần Lông\", bởi người ta nói rằng [CharYouSheHe(CHARACTER)] mặc chiếc quần làm từ da bị xé ra từ xác của một con rồng khổng lồ. Dĩ nhiên, đó là con rồng mà #EMP [CharYouSheHe(CHARACTER)]#! đã giết."
  nick_ring:0 "Nhẫn"
  nick_ring_desc:1 "Không ai thực sự biết tại sao thế giới gọi [CharYouHerHim(CHARACTER)] là '$nick_ring$', nhưng nông dân hy vọng đó là vì [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] hào phóng với túi tiền của [CharYourHerHis(CHARACTER)]."
  nick_snake_in_the_eye:0 "Mắt Rắn"
  nick_snake_in_the_eye_desc:1 "Những kẻ lữ hành thì thầm rằng [CharYouSheHe(CHARACTER)] mang biểu tượng ouroboros như một vết bớt trong mắt [CharYourHerHis(CHARACTER)] — biểu tượng vĩnh cửu của con rắn đang cắn chính cái đuôi của mình. Ít ai dám đến đủ gần để kiểm chứng sự thật của những lời đồn này."
  nick_the_affable:0 "Hiền Hòa"
  nick_the_affable_desc:1 "Bình tĩnh, dễ gần, thân thiện. [CharYouSheHe(CHARACTER)|U] [CharDontDoesnt(CHARACTER)] bận tâm người khác gọi [CharYouHerHim(CHARACTER)] bằng danh hiệu nào, nhưng may mắn thay, nó gần như luôn là điều gì đó #EMP tốt đẹp#!."
  nick_the_apostle:0 "Tông Đồ"
  nick_the_apostle_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] là một trong những Ngài đồng hành của Chúa Giêsu, theo Ngài suốt đời và rao giảng sau khi Ngài tử đạo."
  nick_the_avenger:0 "Kẻ Báo Thù"
  nick_the_avenger_desc:1 "Kẻ thù của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] biết [CharYouHerHim(CHARACTER)] là một sức mạnh không thể lay chuyển, không khoan nhượng cho công lý bằng mọi giá."
  nick_the_bald:0 "Hói"
  nick_the_bald_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] thiếu tóc trầm trọng, và không ai để [CharYouHerHim(CHARACTER)] quên điều đó."
  nick_the_bald_ironic:0 "$nick_the_bald$"
  nick_the_bald_ironic_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] đã dành phần lớn cuộc đời mà không có một chiếc vương miện xứng đáng nào trên đầu [CharYourHerHis(CHARACTER)], và triều đình không bao giờ để [CharYouHerHim(CHARACTER)] quên điều đó."
  nick_the_bastard:0 "Con Ngoài Hôn Nhân"
  nick_the_bastard_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] sinh ngoài hôn nhân, và [CharYouSheHe(CHARACTER)] không thể quên điều đó. Thế giới chắc chắn cũng không."
  nick_the_betrayer:0 "Kẻ Phản Bội"
  nick_the_betrayer_desc:1 "Mọi người đều biết [CharYouSheHe(CHARACTER)] đã làm gì."
  nick_the_black:0 "Đen Tối"
  nick_the_black_desc:1 "Thái độ tàn nhẫn, những giao dịch khét tiếng bất công, và phong thái bị nguyền rủa đối với đồng loại khiến [CHARACTER.GetShortUINameNoTooltipNoFormat] mang tiếng xấu."
  nick_the_blessed:0 "Được Phúc"
  nick_the_blessed_desc:1 "Tấm lòng chính trực và giọng nói vững vàng trong việc bảo vệ đức tin là điều mọi người nhớ về [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_blind:0 "Mù"
  nick_the_blind_desc:1 "[CharYourHerHis(CHARACTER)|U] mất thị giác dường như là điều duy nhất thế giới thấy về [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_bold:0 "Dũng Cảm"
  nick_the_bold_desc:1 "Táo bạo, gan dạ, can trường, dũng cảm, anh hùng — tên tuổi của [CharYourHerHis(CHARACTER)] đồng nghĩa với hành động trực tiếp được thực hiện nhanh chóng. Ngay cả kẻ thù của [CharYourHerHis(CHARACTER)] cũng gọi [CHARACTER.GetShortUINameNoTooltipNoFormat] là \"$nick_the_bold$\"; ít nhất điều đó giúp chặn lại cơn lũ những từ đồng nghĩa."
  nick_the_boneless:0 "Xương Yếu"
  nick_the_boneless_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] khung xương mỏng manh che giấu trí tuệ và tinh thần mãnh liệt của [CharYourHerHis(CHARACTER)]."
  nick_the_brave:0 "Can Đảm"
  nick_the_brave_desc:1 "Không cơn run chân hay run tay nào ngăn cản [CHARACTER.GetShortUINameNoTooltipNoFormat] đạt được mục tiêu của [CharYourHerHis(CHARACTER)]."
  nick_the_chaste:0 "Trong Sạch"
  nick_the_chaste_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì [CharYourHerHis(CHARACTER)] ưu tiên giấc ngủ ngon."
  nick_the_confessor:0 "Người Xưng Tội"
  nick_the_confessor_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì [CharYourHerHis(CHARACTER)] ăn năn về cả những tội lỗi nhỏ nhất."
  nick_the_conqueror:0 "Kẻ Chinh Phục"
  nick_the_conqueror_desc:1 "Công việc hùng mạnh nào hơn việc chinh phục cả một #EMP vương quốc#?! [CharYouSheHe(CHARACTER)|U] chắc chắn sẽ không để người khác quên thành tựu [CharYourHerHis(CHARACTER)]."
  nick_the_cruel:0 "Tàn Nhẫn"
  nick_the_cruel_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] thích nghĩ rằng [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] tính tình khá dễ chịu. Mọi người chỉ không hiểu #EMP khiếu hài hước#! của [CharYourHerHis(CHARACTER)]."
  nick_the_child_of_devilgod:0 "Con Của [CHARACTER.GetFaith.DevilName|U]"
 # _Oh my_, an extra E? Wonder what _that_ could mean!
 ## Shh, it's fine. Leave it alone.
  nick_the_child_of_devilgod_desc:1 "Những lời xì xào cho rằng [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] là đứa con hoang của [CHARACTER.GetFaith.DevilName|U]. Ít nhất là cho đến khi [CharYouSheHe(CHARACTER)] xé toạc lưỡi của họ."
  nick_the_crusader:0 "Kẻ Thập Tự"
  nick_the_crusader_desc:1 "Kẻ ngoại đạo, kẻ bỏ đạo và kẻ dị giáo đều gục trước lưỡi kiếm của [CharYourHerHis(CHARACTER)]."
  nick_the_destroyer:0 "Kẻ Hủy Diệt"
  nick_the_destroyer_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì đốt phá tài sản, thiêu rụi tòa nhà và để lại đất đai rải muối cùng xương cốt người chết."
  nick_the_destroyer_prophecy:0 "$nick_the_destroyer$"
  nick_the_destroyer_prophecy_desc:1 "Một lời tiên tri nổi tiếng gán tên [CharYourHerHis(CHARACTER)]. Liệu số phận [CharYourHerHis(CHARACTER)] là phá bỏ trật tự tham nhũng hay thiêu rụi trật tự chính đáng là điều còn tranh cãi."
  nick_the_devil:0 "Kẻ Ác Quỷ"
  nick_the_devil_desc:1 "Ác ý bao phủ hành động của [CharYourHerHis(CHARACTER)] như một chiếc áo choàng, và mọi người nghĩ về việc làm của [CharYourHerHis(CHARACTER)] với ác tâm tột cùng."
  nick_the_drunkard:0 "Kẻ Say"
  nick_the_drunkard_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] dành [CharYourHerHis(CHARACTER)] cả đời tìm kiếm sự sáng suốt dưới đáy cốc rượu. Ai cũng biết [CharYouSheHe(CHARACTER)] sẽ không bao giờ tìm thấy nó."
  nick_the_fair:0 "Đẹp Trai"
  nick_the_fair_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được cho là có diện mạo dễ nhìn."
  nick_the_fat:0 "Béo"
  nick_the_fat_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] cằm nặng nề từng được đồn thổi có thể rớt ra cả đùi gà."
  nick_the_fearless:0 "Vô Sợ"
  nick_the_fearless_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] các chiến sĩ nói rằng họ chưa từng thấy [CharYouSheHe(CHARACTER)] chùn bước — không trước người, ngựa, hay tên bắn. Hầu hết đều tin điều đó."
  nick_the_fowler:0 "Kẻ Bẫy Chim"
  nick_the_fowler_desc:1 "Những lời đồn trong triều nói rằng [CharYouSheHe(CHARACTER)] dành nhiều thời gian săn chim hoang dã cũng như [CharYouSheHe(CHARACTER)] [CharDoDoes(CHARACTER)] việc cai trị."
  nick_the_gentle:0 "Hiền Hòa"
  nick_the_gentle_desc:1 "Khi [CharYouSheHe(CHARACTER)] [CharDoDoes(CHARACTER)] đúng việc, mọi người sẽ không chắc [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] đã làm gì cả."
  nick_the_german:0 "Người Đức"
 # East Francia will be renamed...
  nick_the_german_desc:1 "Người dân trong vương quốc [CharYourHerHis(CHARACTER)] gọi [CharYouHerHim(CHARACTER)] là $nick_the_german$, nhưng [CharYouSheHe(CHARACTER)] [CharDontDoesnt(CHARACTER)] thực sự hiểu tại sao."
  nick_the_german_post_mortem:0 "$nick_the_german$"
 # ... Germany when you die!
  nick_the_german_post_mortem_desc:1 "Cái chết của [CharYourHerHis(CHARACTER)|U] đánh dấu sự chuyển tiếp khi Đông Francia bắt đầu được gọi là Đức."
  nick_the_good:0 "Lương Thiện"
  nick_the_good_desc:1 "[CharYourHerHis(CHARACTER)|U] tính chính trực và cam kết với giá trị của đức tin [CharYourHerHis(CHARACTER)] khiến các [CHARACTER.GetFaith.GetAdherentNamePluralNoTooltip] khác kính nể [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_gouty:0 "Gút"
  nick_the_gouty_desc:1 "[CharYourHerHis(CHARACTER)|U] khớp sưng tấy, chi tê cứng đau đớn khiến [CHARACTER.GetShortUINameNoTooltipNoFormat] nổi bật trong tầng lớp thượng lưu xa hoa. Có lẽ #EMP quá#! xa hoa."
  nick_the_great:0 "Vĩ Đại"
  nick_the_great_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] thành tích huyền thoại — thường dân hát về việc làm [CharYourHerHis(CHARACTER)], quý tộc thì lẩm bẩm về kỳ vọng bất công."
  nick_the_hammer:0 "Búa"
  nick_the_hammer_desc:1 "Ai muốn biết tại sao gọi [CharYouHerHim(CHARACTER)] là $nick_the_hammer$ chỉ cần hỏi kẻ thù bất hạnh của [CharYourHerHis(CHARACTER)]."
  nick_the_handsome:0 "Đẹp Trai"
  nick_the_handsome_desc:1 "#EMP Trời ơi#!. Ít người trên đời sở hữu xương quai xanh, vai thẳng và đôi [CHARACTER.Custom('Eye_ArticleBlank')] mắt [CHARACTER.Custom('EyeEyes')] đẹp như vậy."
  nick_the_heathen:0 "Ngoại Đạo"
  nick_the_heathen_desc:1 "Trong một cuộc cải đạo thực sự nghiêm trọng, [CharYouSheHe(CHARACTER)] không chỉ rời bỏ [CharYourHerHis(CHARACTER)] tín ngưỡng, không chỉ rời bỏ [CharYourHerHis(CHARACTER)] tôn giáo, mà còn rời bỏ #EMP toàn bộ#! truyền thống tôn giáo của mình, chuyển sang một quan điểm hoàn toàn khác về trật tự thần linh."
  nick_the_heathen_rebel:0 "$nick_the_heathen$"
  nick_the_heathen_rebel_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được biết đến vì cuộc nổi loạn chống lại những gì [CharYouSheHe(CHARACTER)] xem là con đường thờ ngẫu tượng của đồng bào [CharYourHerHis(CHARACTER)] và nền thần học sai lầm của họ."
  nick_the_holy:0 "Thánh"
  nick_the_holy_desc:1 "Không tật xấu, không tội lỗi, không xúc phạm, không bất kính làm vấy bẩn cuộc đời được định bởi thần thánh của [CharYourHerHis(CHARACTER)]."
  nick_the_hunchback:0 "Còng Lưng"
  nick_the_hunchback_desc:1 "Không ai nhìn vào [CHARACTER.GetShortUINameNoTooltipNoFormat] mà không nhận thấy cái bướu đặc biệt trên lưng và phần đầu nhô ra của [CharYourHerHis(CHARACTER)]. Đôi khi dường như đó là tất cả những gì họ có thể nhìn thấy."
  nick_the_hunter:0 "Thợ Săn"
  nick_the_hunter_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] tay bắn nhanh và mắt tinh nhạy nổi tiếng khắp mọi hướng. Một số người nói cung của [CharYourHerHis(CHARACTER)] có thể vươn xa như tên tuổi [CharYourHerHis(CHARACTER)]."
  nick_the_ironside:0 "Thép"
  nick_the_ironside_desc:1 "Giáo, rìu, kiếm, tên — [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] được cho là có thể tránh bất kỳ đòn đánh nào, từ quét uy nghi đến lưỡi dao sát thủ."
  nick_the_just:0 "Công Bằng"
  nick_the_just_desc:0 "Luật pháp và trật tự là nền tảng của mọi điều tốt đẹp trong đời. Không luật thì trật tự bạo ngược, không trật tự thì luật pháp vô hiệu."
  nick_the_kind:0 "Nhân Hậu"
  nick_the_kind_desc:1 "Một lời nói nhẹ nhàng, một nụ cười trấn an, một lời mời gọi vào ngày lạnh giá — [CharYouSheHe(CHARACTER)] tin rằng thế giới có thể được lay chuyển chỉ bằng một chút lòng trắc ẩn."
  nick_the_lame:0 "Chân Cụt"
  nick_the_lame_desc:1 "Bị đau chân, thế giới không chỉ từ chối thuận tiện, mà còn không để [CHARACTER.GetShortUINameNoTooltipNoFormat] quên điều đó."
  nick_the_lawgiver:0 "Người Ban Luật"
 # em-dashes out in memory of Maxi.
  nick_the_lawgiver_desc:1 "Luật lệ, trật tự, thủ tục đúng đắn — những món quà mà [CharYourHerHis(CHARACTER)] dành cho [CharYourHerHis(CHARACTER)] người dân là vô số."
  nick_the_liberator:0 "Kẻ Giải Phóng"
  nick_the_liberator_desc:1 "Bằng thép bén hay lời lẽ uyển chuyển, [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] mang lại tự do lớn lao cho những kẻ bị xiềng xích."
  nick_the_lion:0 "Sư Tử"
  nick_the_lion_desc:1 "Quý tộc, dữ dội, uy nghi: nếu sư tử là Vua Thú, thì sự giống nhau rõ ràng với [CharYourHerHis(CHARACTER)] gợi ý một số phận rực rỡ cho [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_lionheart:0 "Trái Tim Sư Tử"
 # I wish to protest having to write nice things about Richard the Lionheart.
 ## Everyone knows Edward I is the superior English king, and that his great uncle sucks.
  nick_the_lionheart_desc:1 "Dũng cảm tới mức vượt quá lý trí, tàn phá trong trận chiến, chết chóc trong một trận đấu tay đôi. Ai thắc mắc cách [CharYouSheHe(CHARACTER)] có được tên này rõ ràng chưa gặp [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_lisp_and_lame:0 "Ngọng và Chân Cụt"
  nick_the_lisp_and_lame_desc:1 "Không chỉ đi đứng chậm chạp, vụng về, [CHARACTER.GetFaith.HealthGodName] còn thấy nên nguyền rủa [CHARACTER.GetShortUINameNoTooltipNoFormat] với một sự ngọng xấu xí nữa."
  nick_the_magnificent:0 "Tráng Lệ"
  nick_the_magnificent_desc:1 "Truyền thuyết về những việc làm tuyệt vời của [CharYourHerHis(CHARACTER)] được kể từ Ireland tới Cathay."
  nick_the_martyr:0 "Tử Đạo"
  nick_the_martyr_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] đã chết vì [CHARACTER.GetFaith.HighGodName], và những [CHARACTER.GetFaith.GetAdherentNamePlural] trên thế giới nhớ tới hy sinh của [CharYourHerHis(CHARACTER)]."
  nick_the_merry:0 "Vui Vẻ"
  nick_the_merry_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được biết đến bởi [CharYourHerHis(CHARACTER)] sự vui vẻ, những câu chuyện cười duyên dáng và những bữa tiệc tuyệt vời."
  nick_the_honorable:0 "Danh Dự"
  nick_the_honorable_desc:1 "Khi một thỏa thuận được thực hiện, khi [CharYourHerHis(CHARACTER)] giữ lời, [CharYouSheHe(CHARACTER)] có thể được tin tưởng như thép."
  nick_the_greedy:0 "Tham Lam"
  nick_the_greedy_desc:0 "Cái gì tốt hơn một túi bạc? Hai túi bạc!"
  nick_the_monk:0 "Nhà Sư"
  nick_the_monk_desc:1 "[CharYourHerHis(CHARACTER)|U] tôn nghiêm và lối sống giản dị khiến [CHARACTER.GetShortUINameNoTooltipNoFormat] là nhà sư lý tưởng trong mắt nhiều người."
  nick_the_noble:0 "Quý Tộc"
 # Technically "HerHim" would be more correct here, be "SheHe" reads nicer IMHO.
  nick_the_noble_desc:1 "Mặc dù có nhiều quý tộc trên đời, ít ai sống theo lý tưởng của từ này bằng [CharYouSheHe(CHARACTER)]."
  nick_the_old:0 "Già"
  nick_the_old_desc:1 "Không hiếm khi người ta chào [CHARACTER.GetShortUINameNoTooltipNoFormat] với sự kinh ngạc rằng [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] vẫn còn sống."
  nick_the_pious:0 "Sùng Đạo"
  nick_the_pious_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] lòng nhiệt thành và sự tận tụy với [CHARACTER.GetFaith.GetName] được xem là dấu hiệu của sự sùng kính sâu sắc, truyền cảm hứng."
  nick_the_proud:0 "Tự Hào"
  nick_the_proud_desc:1 "Hầu hết quý tộc học cách giữ lưng thẳng mọi lúc, nhưng ít ai biến đó thành niềm tự hào như [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_quarreller:0 "Hay Cãi"
  nick_the_quarreller_desc:1 "Được coi là khôn ngoan nếu không bắt chuyện với [CHARACTER.GetShortUINameNoTooltipNoFormat] trừ khi Ngài có vài giờ rảnh. Đôi khi là vài ngày."
  nick_the_restorer:0 "Người Phục Hưng"
  nick_the_restorer_desc:1 "Khi vương quốc tưởng chừng chìm trong bóng tối, #EMP [CharYouSheHe(CHARACTER)]#! xuất hiện đưa nó trở lại ánh sáng."
  nick_the_saint:0 "Thánh Nhân"
  nick_the_saint_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] đi vào lịch sử của [CHARACTER.GetFaith.GetName] như một trong những tín đồ may mắn nhất. Luôn luôn."
  nick_the_scholar:0 "Học Giả"
  nick_the_scholar_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] trí tuệ và kiến thức là một phần trong kho tàng của nhiều học viện uyên bác."
  nick_the_silent:0 "Im Lặng"
  nick_the_silent_desc:1 "Im lặng là vàng, và [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] một kho tàng về điều đó."
  nick_the_stammerer:0 "Ngập Ngừng"
  nick_the_stammerer_desc:1 "Dù cách diễn đạt của [CharYourHerHis(CHARACTER)] có thể rất tao nhã, nhưng cách nói của [CharYourHerHis(CHARACTER)] lại không được như mong muốn."
  nick_the_stranger:0 "Người Lạ"
  nick_the_stranger_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tới vương quốc [CharYourHerHis(CHARACTER)] từ xa — ngay cả bây giờ, nhiều phong thái của [CharYourHerHis(CHARACTER)] vẫn lạ và xa lạ."
  nick_the_strong:0 "Mạnh Mẽ"
  nick_the_strong_desc:1 "Thế giới rộng lớn cho rằng [CharYouHerHim(CHARACTER)] có thể bẻ nát đá. Bằng răng của [CharYourHerHis(CHARACTER)]."
  nick_the_troubadour:0 "Kẻ Hát Rong"
  nick_the_troubadour_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được biết đến bởi giọng hát tuyệt vời và niềm say mê âm nhạc của [CharYourHerHis(CHARACTER)]. Ít nhất là bởi những người yêu thích [CharYouHerHim(CHARACTER)]."
  nick_the_unready:0 "Chưa Sẵn Sàng"
  nick_the_unready_desc:1 "Hiếm khi có xung đột hay cuộc thảo luận nào mà [CHARACTER.GetShortUINameNoTooltipNoFormat] không hoàn toàn bị choáng ngợp."
  nick_the_unready_anglo_saxon:0 "$nick_the_unready$"
  nick_the_unready_anglo_saxon_desc:1 "[CharYourHerHis(CHARACTER)|U] tên thật ra dịch là 'Nghị Viên Quý Tộc'. Việc gọi là $E_thelrE_d$-Unræd, hay 'Nghị Viên Quý Tộc-Không Có Hội Đồng' khiến [CharYouHerHim(CHARACTER)] khá khó chịu. Chắc ai đó thấy trò chơi chữ vui."
  nick_the_usurper:0 "Kẻ Chiếm Ngôi"
  nick_the_usurper_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] đã lật đổ vị lãnh chúa hợp pháp của vương quốc [CharYourHerHis(CHARACTER)], chiếm lấy thứ đáng lẽ thuộc về họ bằng mũi kiếm."
  nick_the_victorious:0 "Kẻ Chiến Thắng"
  nick_the_victorious_desc:1 "Chiến thắng đến tự nhiên với [CHARACTER.GetShortUINameNoTooltipNoFormat], và thế giới đồng ý."
  nick_the_viking:0 "Viking"
  nick_the_viking_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] luôn tin rằng tài sản là khái niệm linh hoạt hơn hầu hết mọi người."
  nick_the_young:0 "Trẻ"
  nick_the_young_desc:1 "Khi còn là một [CHARACTER.GetWomanMan] trẻ tuổi, [CharYouSheHe(CHARACTER)] đã tạo dựng được danh tiếng và sự nổi bật. Dù bao nhiêu năm trôi qua, [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] chắc chắn biệt danh này sẽ còn tồn tại."
  nick_the_younger:0 "Trẻ Hơn"
  nick_the_younger_desc:2 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] không may khi chia sẻ tên của [CharYourHerHis(CHARACTER)] với một nhân vật nổi tiếng khác, và vì thế [CharHaveHas(CHARACTER)] mãi mãi bị hạ xuống thành [CHARACTER.GetFirstName] #EMP $nick_the_younger$#!."
  nick_whiteshirt:0 "Áo Trắng"
  nick_whiteshirt_desc:1 "Mọi người thường hỏi [CHARACTER.GetShortUINameNoTooltipNoFormat] tại sao gọi [CharYouHerHim(CHARACTER)] là $nick_whiteshirt$. [CharYouSheHe(CHARACTER)|U] chỉ mỉm cười[_s(CHARACTER)]."
  nick_the_cannibal:0 "Kẻ Ăn Thịt Người"
  nick_the_cannibal_desc:1 "Ít ai chịu được nụ cười hở răng của [CharYourHerHis(CHARACTER)], nhất là khi máu tươi chảy trên hàm răng được chăm sóc kỹ lưỡng của [CharYourHerHis(CHARACTER)]."
  nick_the_dragon:0 "Rồng"
  nick_the_dragon_desc:0 "$nick_the_dragoness_desc$"
  nick_the_devourer:0 "Kẻ Nuốt Chửng"
  nick_the_devourer_desc:1 "Thế giới rùng mình khi nghĩ tới bao nhiêu sinh mạng rơi vào hàm sâu không đáy của [CharYourHerHis(CHARACTER)]..."
  nick_the_bewitched:0 "Bị Thần Bí Quấn"
  nick_the_bewitched_desc:1 "Bị bỏ rơi bởi [CHARACTER.GetFaith.HighGodName], bị nguyền rủa bởi [CHARACTER.GetFaith.WitchGodName], khi người ta nhắc tới [CHARACTER.GetShortUINameNoTooltipNoFormat], thường là với lòng thương hại."
  nick_the_witch:0 "Phù Thủy"
  nick_the_witch_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được coi là người buôn bán những điều kỳ lạ vượt ngoài thế giới thường nhật."
  nick_the_unfaithful:0 "Không Trung Thành"
  nick_the_unfaithful_desc:1 "Theo [CharYourHerHis(CHARACTER)], lời thề cưới chỉ giống như... hướng dẫn cưới hỏi."
  nick_the_unchaste:0 "Đồi Bại"
  nick_the_unchaste_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được cho là kẻ dâm dục ngoài hôn nhân."
  nick_the_beguiling:0 "Mê Hoặc"
  nick_the_beguiling_desc:1 "Người ta nói một ánh nhìn e ấp từ [CHARACTER.GetShortUINameNoTooltipNoFormat] có thể làm... đầu gối mềm nhũn."
  nick_the_temptress:0 "Quyến Rũ"
  nick_the_temptress_desc:1 "Trên ngón tay cong vẹo của [CharYourHerHis(CHARACTER)], quý tộc và thường dân đều bị mắc bẫy."
  nick_the_seductress:0 "Nữ Quyến Rũ"
  nick_the_seductress_desc:0 "Một nụ cười nói lên ngàn lời — những lời mà có lẽ không thể nói trong xã giao lịch thiệp."
  nick_the_lewd:0 "Dâm Dục"
  nick_the_lewd_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] lời nói, cách cư xử và đôi khi cử chỉ mạnh mẽ về thể chất, tối đa cũng chỉ là lộ liễu."
  nick_the_lecher:0 "Dâm Loạn"
  nick_the_lecher_desc:1 "Người ta [CharYouSheHe(CHARACTER)] [CharFancyFancies(CHARACTER)] quen với nước bọt của [CharYourHerHis(CHARACTER)]. Hoặc họ bỏ đi."
  nick_the_seducer:0 "Kẻ Quyến Rũ"
  nick_the_seducer_desc:0 "$nick_the_seductress_desc$"
  nick_the_shadow:0 "Bóng Tối"
 # Big RIP Bleden Mark.
  nick_the_shadow_desc:1 "Nghe đồn rằng nơi nào bóng tối phủ xuống, [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] tai nghe."
  nick_the_whisperer:0 "Kẻ Thì Thầm"
  nick_the_whisperer_desc:1"Được gọi như vậy bởi vì [CharYouSheHe(CHARACTER)] dành[_s(CHARACTER)] nhiều thời gian nói chuyện nhỏ nhẹ hơn mức được xem là phù hợp."
  nick_the_spider:0 "Con Nhện"
  nick_the_spider_desc:0 "Hãy cẩn thận xung quanh triều đình, người ta nói. Bất cứ nơi nào Ngài đi, Ngài sẽ gặp $nick_the_spider$."
  nick_the_fox:0 "Con Cáo"
  nick_the_fox_desc:1 "Quỷ quyệt, tinh ranh, tham vọng — những đức tính của [CharYourHerHis(CHARACTER)] có thể không hiệp nghĩa, nhưng #EMP hiệu quả#!."
  nick_the_shrewd:0 "Tinh Ranh"
  nick_the_shrewd_desc:1 "Thật khôn ngoan khi không bao giờ chơi bài với [CharYouSheHe(CHARACTER)] — rất ít người có thể chắc chắn [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] giấu thứ gì trong tay áo [CharYourHerHis(CHARACTER)]."
  nick_the_gracious:0 "Nhân Hậu"
  nick_the_gracious_desc:1 "[CharYourHerHis(CHARACTER)|U] phép tắc, phẩm cách cao quý và cách nhún nhường khiến [CHARACTER.GetShortUINameNoTooltipNoFormat] trở thành [CHARACTER.GetWomanMan] được yêu mến tại nhiều bàn tiệc."
  nick_the_magnanimous:0 "Hào Hiệp"
  nick_the_magnanimous_desc:1 "Không ai có thể nói rằng [CharYouSheHe(CHARACTER)] bỏ sót điều gì đã hứa."
  nick_the_architect:0 "Kiến Trúc Sư"
  nick_the_architect_desc:1 "Hầu hết mọi người nhìn vào một đống gạch và gỗ rồi thấy công việc của người lao động. [CharYouSheHe(CHARACTER)|U] lại nhìn thấy #EMP tiềm năng#!."
  nick_the_wise:0 "Khôn Ngoan"
  nick_the_wise_desc:1 "Được coi là khôn ngoan nếu hỏi ý kiến [CharYourHerHis(CHARACTER)], nếu [CharYouSheHe(CHARACTER)] chịu đưa ra."
  nick_the_impaler:0 "Kẻ Xiên Người"
  nick_the_impaler_desc:1 "Phương pháp thực thi công lý của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] có thể nghiêm khắc, nhưng tỉ lệ tái phạm #EMP thấp#!."
  nick_the_tormentor:0 "Kẻ Hành Hạ"
  nick_the_tormentor_desc:1 "Hầu hết thà chết dưới lưỡi gươm của cai ngục còn hơn để mình bị đưa vào ngục tối của [CharYourHerHis(CHARACTER)]."
  nick_the_depraved:0 "Đồi Bại"
  nick_the_depraved_desc:1 "Những người tốt bụng thì thầm rằng ham muốn của [CharYourHerHis(CHARACTER)] là trái tự nhiên. [CharYouSheHe(CHARACTER)|U] lại xem[_s(CHARACTER)] chúng đơn giản là #EMP tinh tế#!."
  nick_the_monster:0 "Quái Vật"
  nick_the_monster_desc:1 "Người nông dân nghĩ [CHARACTER.GetShortUINameNoTooltipNoFormat] là yêu quái, cơn ác mộng hút máu tới để ăn tủy con trẻ họ. Hy vọng họ nhầm."
  nick_the_wicked:0 "Hiểm Ác"
  nick_the_wicked_desc:1 "[CHARACTER.GetFaith.GetName] có rất nhiều điều cấm đoán — [CharYouSheHe(CHARACTER)] thường[_s(CHARACTER)] phá vỡ chúng theo thói quen."
  nick_the_accursed:0 "Bị Nguyền Rủa"
  nick_the_accursed_desc:1 "Hiếm có [CHARACTER.GetFaith.PriestNeuter] nào có thể nói tên [CharYourHerHis(CHARACTER)] mà không phun xuống đất."
  nick_priest_hater:0 "Kẻ Ghét Linh Mục"
  nick_priest_hater_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] ghét giáo sĩ nổi tiếng và, nhờ sự biết chữ của linh mục, được ghi chép đầy đủ."
  nick_priest_eater:0 "Kẻ Ăn Linh Mục"
  nick_priest_eater_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] không thích[_s(CHARACTER)] mọi thứ về giới giáo sĩ ngoại trừ hương vị của họ."
  nick_the_able:0 "Toàn Năng"
  nick_the_able_desc:1 "Trị vì một vương quốc? Chiến đấu một trận chiến? Nấu một bữa ăn? Làm dịu một đứa trẻ? Thiết kế một công trình? Nhổ một chiếc răng? Hầu như không có gì [CharYouSheHe(CHARACTER)] không thể làm khi [CharYouSheHe(CHARACTER)] đặt[_s(CHARACTER)] tâm trí [CharYourHerHis(CHARACTER)] vào đó. Sau cùng, chuyên môn hóa là dành cho côn trùng."
  nick_the_mad:0 "Điên"
  nick_the_mad_desc:1 "Nếu họ chỉ biết những gì [CharYouSheHe(CHARACTER)] biết[_s(CHARACTER)], họ cũng sẽ cười như vậy: toàn bộ cuộc đời này chỉ là trò chơi của một vị thần điên loạn nào đó."
  nick_the_ruthless:0 "Tàn Nhẫn"
  nick_the_ruthless_desc:1 "Không phải ai cũng có sức mạnh làm điều cần làm. Không phải ai, nhưng [CharYouSheHe(CHARACTER)] [CharDoDoes(CHARACTER)]."
  nick_the_simple:0 "Đơn Giản"
  nick_the_simple_desc:1 "Suy nghĩ của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] có thể miêu tả là 'may mắn không gánh nặng'."
  nick_the_leper:0 "Phong Hủi"
  nick_the_leper_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] không bao giờ quên căn bệnh tàn phá từng chút cơ thể [CharYourHerHis(CHARACTER)]. Thế giới vẫn thích nhắc [CharYouHerHim(CHARACTER)]."
  nick_half_hand:0 "Bán Tay"
  nick_half_hand_desc:1 "Một số câu chuyện nói rằng [CharYouSheHe(CHARACTER)] thiếu[_s(CHARACTER)] một ngón tay, những câu chuyện khác nói rằng mất cả nửa bàn tay [CharYourHerHis(CHARACTER)], còn nhiều câu chuyện khác nói rằng cánh tay [CharYourHerHis(CHARACTER)] bị tách dọc đến tận khuỷu tay. [CharYouSheHe(CHARACTER)|U] [CharDontDoesnt(CHARACTER)] không thích bình luận."
  nick_the_hideous:0 "Kinh Khủng"
  nick_the_hideous_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] gương mặt mà hy vọng ít nhất mẹ cũng yêu được."
  nick_the_frog:0 "Con Ếch"
  nick_the_frog_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] nét mặt có gì đó giống ếch — những lời giải thích #EMP lịch sự#! thường được dùng ngoài tai."
  nick_the_repulsive:0 "Ghê Tởm"
  nick_the_repulsive_desc:1 "Quá đông hiếm khi là vấn đề khi [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] xuất hiện."
  nick_the_frail:0 "Yếu Ớt"
  nick_the_frail_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] xương thường được nói làm bằng thủy tinh — ít nhất là vỡ như thủy tinh."
  nick_the_weak:0 "Yếu"
  nick_the_weak_desc:1 "Một số trẻ con khoe khoang nghĩ họ có thể vật [CHARACTER.GetShortUINameNoTooltipNoFormat] và thắng. [CharYouSheHe(CHARACTER)|U] thích không thử lý thuyết đó."
  nick_the_brute:0 "Thô Lỗ"
  nick_the_brute_desc:1 "Chưa bao giờ né tránh bạo lực, [CharYouSheHe(CHARACTER)] không phân biệt nhiều giữa tổn thương thể chất, xã hội và tinh thần. Cuối cùng thì tất cả đều đau đớn như nhau, đúng không?"
  nick_the_bear:0 "Gấu"
  nick_the_bear_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] hình dáng to lớn, nhiều lông có thể đáng sợ — dù không phải #EMP với tất cả#!."
  nick_the_terrible:0 "Kinh Khủng"
  nick_the_terrible_desc:1 "Trẻ con khóc, nông dân run sợ, và sữa bị chua khi [CharYouSheHe(CHARACTER)] đi qua. Ít nhất là người ta nói vậy."
  nick_the_tyrant:0 "Bạo Chúa"
