  nick_the_quick_ironic_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nói[_s(CHARACTER)] với mọi người rằng đó là vì [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] nhanh trí. Nhưng thực ra không phải vậy."
  nick_the_selfish:0 "Ích Kỷ"
  nick_the_selfish_desc:1 "Cả thế giới đều biết rằng [CharYouSheHe(CHARACTER)] [CharDontDoesnt(CHARACTER)] không nghĩ đến bất kỳ ai khác ngoài #EMP [CharYourHerHimself(CHARACTER)]#!."
  nick_the_worthy:0 "Xứng Đáng"
  nick_the_worthy_desc:1 "Ai là người phán xét [CHARACTER.GetShortUINameNoTooltipNoFormat] như vậy vẫn còn là vấn đề tranh luận, nhưng tất cả đều đồng ý rằng [CharYouSheHe(CHARACTER)] thực sự [CharAreIs(CHARACTER)] là một [CHARACTER.GetWomanMan] có phẩm giá."
  nick_the_unworthy:0 "Không Xứng"
  nick_the_unworthy_desc:0 "Một [CHARACTER.GetWomanMan] thất bại, cả trong lý thuyết lẫn thực tiễn."
  nick_the_traitor:0 "Kẻ Phản Bội"
  nick_the_traitor_desc:1 "Lời của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] giá trị chỉ bằng không khí mà nó trôi qua."
  nick_the_courageous:0 "Dũng Cảm"
  nick_the_courageous_desc:1 "Qua lửa đỏ và ngọn lửa, [CharYouSheHe(CHARACTER)] có thể được tin tưởng để tiếp tục."
  nick_the_brilliant:0 "Tài Năng"
  nick_the_brilliant_desc:1 "Ít người có thể sánh với trí tuệ của [CharYourHerHis(CHARACTER)] — còn ít người hơn dám thử."
  nick_the_demon:0 "Quỷ Dữ"
  nick_the_demon_desc:1 "[CHARACTER.GetFaith.DevilName|U] chắc chắn sẽ đưa [CHARACTER.GetShortUINameNoTooltipNoFormat] một lời giới thiệu tốt tại Quốc Hội [CHARACTER.GetFaith.random_NegativeAfterLife]."
  nick_the_immortal:0 "Bất Tử"
  nick_the_immortal_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] trông[_s(CHARACTER)] khá trẻ so với tuổi của [CharYourHerHis(CHARACTER)]."
  nick_the_generous:0 "Hào Phóng"
  nick_the_generous_desc:1 "Ngài sẽ sẵn sàng cho ai đó chiếc áo trên lưng [CharYourHerHis(CHARACTER)] — nếu người trước đó chưa lấy mất nó."
  nick_the_diplomat:0 "Nhà Ngoại Giao"
