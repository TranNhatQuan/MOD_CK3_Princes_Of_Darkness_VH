  nick_blue_snake:0 "Rắn Xanh"
  nick_blue_snake_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharDoDoes(CHARACTER)] không trả lời câu hỏi về danh xưng của [CharYourHerHis(CHARACTER)]."
  nick_the_loyal:0 "Trung Thành"
  nick_the_loyal_desc:1 "Dù mưa hay nắng, bất kể chuyện gì xảy ra, bạn bè của [CharYourHerHis(CHARACTER)] biết rằng [CharYouSheHe(CHARACTER)] sẽ luôn đứng bên cạnh họ."
  nick_troublemaker:0 "Kẻ Gây Rối"
  nick_troublemaker_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được biết đến bởi những quan điểm, sự hiểu biết và giọng nói lớn của [CharYourHerHis(CHARACTER)]."
  nick_the_seer:0 "Nhà Tiên Tri"
  nick_the_seer_desc:1 "Nhìn thấy là tin, nhưng những kẻ không thấy phải tìm đến người như [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_timid:0 "Nhút Nhát"
  nick_the_timid_desc:1 "Hiền lành, thậm chí nhạy cảm, [CharYouSheHe(CHARACTER)] [CharDontDoesnt(CHARACTER)] xử lý tốt khi đối diện trực tiếp."
  nick_the_red:0 "Đỏ"
  nick_the_red_desc:1 "Mái tóc đỏ rực của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] khiến nhiều người chú ý. Theo kinh nghiệm [CharYourHerHis(CHARACTER)], điều này xảy ra thường xuyên."
  nick_the_truthspeaker:0 "Người Nói Thật"
  nick_the_truthspeaker_desc:1 "Dù việc nghiêm trọng đến đâu, người ta biết họ có thể dựa vào sự trung thực và liêm chính của [CharYourHerHis(CHARACTER)]."
  nick_the_curthose:0 "Curthose"
  nick_the_curthose_desc:1 "Khi còn nhỏ, cha của [CharYourHerHis(CHARACTER)] gọi [CHARACTER.GetShortUINameNoTooltipNoFormat] là 'Little Boot'. Khi trưởng thành, [CharYouSheHe(CHARACTER)] không thể khiến mọi người #EMP ngừng#! gọi [CharYouHerHim(CHARACTER)] như vậy."
  nick_the_deep_minded:0 "Suy Tư Sâu"
  nick_the_deep_minded_desc:1 "Người đời nói về những suy nghĩ sâu sắc và những quan điểm nặng ký của [CharYourHerHis(CHARACTER)]. [CharYouSheHe(CHARACTER)|U] thích[_s(CHARACTER)] ngồi lại và suy ngẫm."
  nick_the_white:0 "Trắng"
  nick_the_white_desc:1 "Dù họ gọi [CHARACTER.GetShortUINameNoTooltipNoFormat] là $nick_the_white$ vì làn da nhợt nhạt hay mái tóc còn nhợt nhạt hơn của [CharYourHerHis(CHARACTER)], [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] không chắc. Có những cái tên còn tệ hơn nhiều."
  nick_wang_khan:0 "Vương Khan"
  nick_wang_khan_desc:1 "Những chiến thắng lớn của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] trước người Tatar khiến [CharYouHerHim(CHARACTER)] được ca ngợi như Vua Khan! Chắc chắn một tương lai dài và sáng lạng đang chờ phía trước?"
  nick_the_bard:0 "Nhà Thơ Ca"
  nick_the_bard_desc:1 "Giọng hát tuyệt đẹp và những ngón tay chơi nhạc tài hoa của [CharYourHerHis(CHARACTER)|U] khiến [CHARACTER.GetShortUINameNoTooltipNoFormat] trở thành một nhân vật nổi tiếng tại mọi triều đình mà [CharYouSheHe(CHARACTER)] hạ cố[_s(CHARACTER)] ghé thăm."
  nick_the_bard_ironic:0 "$nick_the_bard$"
  nick_the_bard_ironic_desc:1 "Người ta gọi [CHARACTER.GetShortUINameNoTooltipNoFormat] là "$nick_the_bard$", bởi vì [CharYouSheHe(CHARACTER)] sẽ thú vị hơn khi buộc vào sườn ngựa phi nước đại thay vì cố hát."
  nick_hotspur:0 "Hotspur"
  nick_hotspur_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] kẻ thù thì thầm rằng, khi chinh chiến, cựa giày của [CharYourHerHis(CHARACTER)] thậm chí chưa từng chạm đất, bởi [CharYourHerHis(CHARACTER)] dành quá nhiều thời gian trên yên ngựa và sự cuồng nộ trong những đòn tấn công của [CharYourHerHis(CHARACTER)]. Điều này phần nào cũng thể hiện qua kỹ năng bóng đá chỉ ở mức trung bình của [CharYourHerHis(CHARACTER)]."
  nick_the_black_adder:0 "Rắn Đen"
  nick_the_black_adder_desc:1 "Với vô số kế hoạch xảo quyệt, dù kẻ thù của [CharYourHerHis(CHARACTER)] cho rằng [CharYouSheHe(CHARACTER)] là một [CHARACTER.GetWomanMan] nhỏ bé đáng ghê tởm."
  nick_the_inevitable:0 "Không Thể Tránh"
  nick_the_inevitable_desc:1 "Cuối cùng, mọi chuyện luôn diễn ra theo ý của [CharYourHerHis(CHARACTER)]. Người ta sẽ tự học được điều đó, hoặc nếu không thì [CharYouSheHe(CHARACTER)] sẽ dạy[_es(CHARACTER)] cho họ."
  nick_the_plump:0 "Mũm Mĩm"
  nick_the_plump_desc:1 "Hầu hết mọi người gọi [CharYouHerHim(CHARACTER)] là $nick_the_plump$, vì có quá nhiều điều yêu quý ở [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_diseased:0 "Bệnh Hoạn"
  nick_the_diseased_desc:1 "Điều đầu tiên người ta thường nghe về [CHARACTER.GetShortUINameNoTooltipNoFormat] là tiếng ho của [CharYourHerHis(CHARACTER)]."
  nick_the_flash:0 "Chớp của [CHARACTER.GetFaith.HighGodName]"
  nick_the_flash_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharTryTries(CHARACTER)] không nghĩ bản thân [CharYourHerHimself(CHARACTER)] là Cơn Thịnh Nộ của [CHARACTER.GetFaith.HighGodName]. \"Tia Chớp\" nghe ngoại giao hơn nhiều."
  nick_hand:0 "Bàn Tay Xấu"
  nick_hand_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] sự thiếu may mắn và thói quen đưa ra những quyết định về sau trở thành thảm họa đôi khi đã được người đời ghi nhận."
  nick_bloody:0 "Máu Me"
  nick_bloody_desc:1 "Việc giới quý tộc giết một vài kẻ thù trong đời không phải chuyện hiếm. Một số người không khỏi khó chịu tự hỏi có bao nhiêu #EMP [CharYouSheHe(CHARACTER)]#! đã phải giết để trở nên nổi tiếng hoàn toàn chỉ vì điều đó."
  nick_the_oathbreaker:0 "Phá Lời Thề"
  nick_the_oathbreaker_desc:0 "Một [CHARACTER.GetWomanMan] giá trị bao nhiêu tùy thuộc vào lời hứa của [CHARACTER.GetHerHis]."
  nick_little:0 "Nhỏ Bé"
  nick_little_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] có thể nhỏ bé, nhưng [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] tất cả sự giận dữ và cuồng nộ của một con chồn sói bị dại."
  nick_the_honest:0 "Thật Thà"
  nick_the_honest_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] consider[_s(CHARACTER)] sự trung thực #EMP luôn luôn#! là chính sách tốt nhất."
  nick_the_passionate:0 "Đam Mê"
  nick_the_passionate_desc:1 "Bạn bè và đồng minh của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] yêu thích nhiệt huyết của [CharYourHerHis(CHARACTER)], nhưng những kẻ chỉ trích [CharYourHerHis(CHARACTER)] cho rằng [CharYouSheHe(CHARACTER)] cần[_s(CHARACTER)] phải bình tĩnh lại."
  nick_the_silly:0 "Ngớ Ngẩn"
  nick_the_silly_desc:1 "Dù người khác có thể nói gì về [CHARACTER.GetShortUINameNoTooltipNoFormat] vì điều đó, [CharYouSheHe(CHARACTER)] không bao giờ xem cuộc đời #EMP quá#! nghiêm trọng."
  nick_one_eyed:0 "Một Mắt"
