  nick_the_trembling:0 "Run Rẩy"
  nick_the_trembling_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tiếc rằng không được biết đến với sức hấp dẫn hay những cuộc xung phong táo bạo."
  nick_the_rash:0 "Nóng Nảy"
  nick_the_rash_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nghĩ[_s(CHARACTER)] bản thân [CharYourHerHimself(CHARACTER)] là người thẳng thắn, nhưng thế giới bên ngoài nhìn [CHARACTER.GetShortUINameNoTooltipNoFormat] như một kẻ hấp tấp và thiếu suy nghĩ."
  nick_moneybags:0 "Hàm Tiền"
  nick_moneybags_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] có lẽ muốn được gọi là 'Giàu Có', nhưng đáng tiếc mọi người có cái nhìn rất cụ thể về sự giàu có của [CharYourHerHis(CHARACTER)]."
  nick_the_elegant:0 "Thanh Lịch"
  nick_the_elegant_desc:0 "Chạm nhẹ tạo kết quả duyên dáng, quy trình tinh tế nuôi dưỡng danh tiếng tao nhã."
  nick_the_eager:0 "Nhiệt Tình"
  nick_the_eager_desc:1 "Nhiệt huyết là phương châm của [CharYourHerHis(CHARACTER)], hăng say là tín điều của [CharYourHerHis(CHARACTER)]."
  nick_the_insane:0 "Điên Rồ"
  nick_the_insane_desc:1 "Mọi người đi như đi trên vỏ trứng quanh [CHARACTER.GetShortUINameNoTooltipNoFormat] — có thể công bằng, cũng có thể không, nhưng tại sao mạo hiểm làm phật lòng kẻ điên [CHARACTER.GetWomanMan]?"
  nick_the_sleeper:0 "Người Ngủ"
  nick_the_sleeper_desc:1 "Người ta thường nhận xét rằng [CharYouSheHe(CHARACTER)] sẽ hạnh phúc hơn nếu là một con mèo nhà."
  nick_the_quick:0 "Nhanh Nhẹn"
  nick_the_quick_desc:0 "Nhanh trí, nhanh nhẹn."
