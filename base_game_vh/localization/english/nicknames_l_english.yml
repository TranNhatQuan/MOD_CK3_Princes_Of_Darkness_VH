  nick_the_glass_desc:1 "Sự ám ảnh của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] với việc xây những ngôi nhà lạ bằng thủy tinh gây bàn tán và bối rối không kém."
  nick_the_trojan:0 "Người Trojan"
  nick_the_trojan_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] sánh ngang những thành tựu của Corineus cổ đại, khôi phục vị thừa kế thực sự của Troy — Dumnonia."
  nick_the_butcher:0 "Người Hành Xác"
  nick_the_butcher_desc:0 "Thịt là thịt. Cuối cùng thì mọi thứ cũng ngừng kêu la."
  nick_the_fishy:0 "Người Hôi Cá"
