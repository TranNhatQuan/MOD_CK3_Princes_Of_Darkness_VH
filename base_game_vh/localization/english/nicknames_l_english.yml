  nick_the_peacemaker:0 "Người Hòa Giải"
  nick_the_peacemaker_desc:0 "Hòa bình đáng giá mọi giá."
  nick_the_tactician:0 "Nhà Chiến Thuật"
  nick_the_tactician_desc:0 "Chiến lược cần sự mưu lược, nhưng chiến thuật cần trí tuệ."
  nick_the_overseer:0 "Người Giám Sát"
  nick_the_overseer_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì sự... chú ý sát sao của [CharYourHerHis(CHARACTER)]."
  nick_the_guardian:0 "Người Bảo Hộ"
  nick_the_guardian_desc:1 "Dù mưa hay nắng, Ngài hay thù, [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] luôn có mặt vì những người mà [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] thề bảo vệ."
  nick_the_chivalrous:0 "Hào Hiệp"
  nick_the_chivalrous_desc:1 "Danh dự có thể rẻ với người khác, nhưng với [CHARACTER.GetShortUINameNoTooltipNoFormat], không gì quý giá hơn."
  nick_the_valiant:0 "Dũng Vị"
  nick_the_valiant_desc:0 "Người lãnh đạo mà không dám đi đầu thì không phải lãnh đạo."
  nick_the_deceiver:0 "Kẻ Lừa Dối"
  nick_the_deceiver_desc:0 "Tại sao phải tốn thép và máu, khi lời nói miễn phí?"
  nick_the_crow:0 "Quạ"
  nick_the_crow_desc:1 "Những người yêu quý [CHARACTER.GetShortUINameNoTooltipNoFormat] nói rằng đó là vì trí tuệ sắc bén và tầm nhìn chính xác của [CharYourHerHis(CHARACTER)]. Những kẻ không thích [CharYouHerHim(CHARACTER)] lại nói rằng cái chết luôn lảng vảng quanh [CharYouHerHim(CHARACTER)]."
  nick_the_trickster:0 "Kẻ Lừa Gạt"
  nick_the_trickster_desc:1 "Liệu [CharYouSheHe(CHARACTER)] thật sự #EMP nói dối trắng trợn#! như những câu chuyện người khác kể về [CharYouHerHim(CHARACTER)]?"
  nick_the_chronicler:0 "Người Ghi Chép"
  nick_the_chronicler_desc:1 "Các thế hệ sau chắc chắn sẽ biết ơn mũi nhạy bén trong việc ghi chép tỉ mỉ của [CharYourHerHis(CHARACTER)]."
  nick_the_truthseeker:0 "Kẻ Tìm Sự Thật"
  nick_the_truthseeker_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng trong việc theo đuổi sự thật, bất kể nơi đâu và giá nào phải trả."
  nick_the_sage:0 "Nhà Hiền Triết"
  nick_the_sage_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] uyên bác và sẵn sàng truyền kiến thức cho thế hệ trẻ."
  nick_the_historian:0 "Nhà Sử Học"
  nick_the_historian_desc:0 "Những ai không cố gắng học lịch sử sẽ bị định mệnh lặp lại nó."
  nick_the_sly:0 "Xảo Quyệt"
  nick_the_sly_desc:0 "Hửm? Ánh nhìn đó à? Chẳng có gì đâu. Đừng bận tâm."
  nick_the_cucumber_king:0 "Vua Dưa Leo"
  nick_the_cucumber_king_desc:0 "Không nhiều người có thể nói rằng họ từng đoạt vương quốc. Ít người hơn có thể cho rằng một củ cây ăn củ chiến lược là chìa khóa."
  nick_the_peaceful:0 "Hiền Hòa"
  nick_the_peaceful_desc:0 "Chẳng phải tất cả chúng ta đều có thể hòa thuận sao?"
  nick_the_whetstone:0 "Đá Mài"
  nick_the_whetstone_desc:1 "Như mọi đá mài tốt, [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] nổi tiếng vì nhường cho cả lưỡi dao cùn."
  nick_the_slayer_of_the_snake:0 "Xóa Bạn Rắn"
  nick_the_slayer_of_the_snake_desc:1 "Xuất thân từ Baghdad, [CharYouSheHe(CHARACTER)] đã giết con rắn hùng mạnh Sarki, nguyên nhân gây hạn hán kinh hoàng, để giành được tay của Nữ Hoàng Daura."
  nick_the_illuminator:0 "Người Chiếu Sáng"
  nick_the_illuminator_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được ca ngợi vì là người đầu tiên mang ánh sáng đức tin #EMP Chân Thật#! đến cho dân chúng [CharYourHerHis(CHARACTER)], trở thành nguồn cứu rỗi của họ."
  nick_the_builder:0 "Người Xây Dựng"
  nick_the_builder_desc:1 "Hầu hết các vị vua chỉ xây dựng vương quốc về mặt lý thuyết. [CharYouSheHe(CHARACTER)|U] [CharDoDoes(CHARACTER)] không như vậy."
  nick_the_martyrophile:0 "Người Yêu Thương Liệt Sĩ"
  nick_the_martyrophile_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được tín đồ [CharYourHerHis(CHARACTER)] đánh giá cao vì ghi chép cuộc đời các vị tử đạo thánh thiện."
  nick_the_campeador:0 "Chiến Binh Vĩ Đại"
  nick_the_campeador_desc:1 "Nhiều người cho rằng chưa từng có biểu hiện nào thuần khiết hơn của đức hạnh võ sĩ và lòng tốt hiệp sĩ — [CharYouSheHe(CHARACTER)] khinh thường[_s(CHARACTER)] lời ca ngợi, và [CharAreIs(CHARACTER)] hài lòng khi sống đúng với những lý tưởng mà [CharYouSheHe(CHARACTER)] đặt[_s(CHARACTER)] cho [CharYourHerHimself(CHARACTER)]."
  nick_the_girthy:0 "Đậm Người"
  nick_the_girthy_desc:1 "Thân hình đồ sộ, sự to lớn bền bỉ và vóc dáng khổng lồ của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] là chủ đề bàn tán ở mọi thị trấn mà [CharYouSheHe(CHARACTER)] ghé thăm[_s(CHARACTER)]."
  nick_the_missionary:0 "Nhà Truyền Giáo"
  nick_the_missionary_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] sẽ không nghỉ ngơi chừng nào còn linh hồn chưa được cứu rỗi dưới ánh sáng của [CHARACTER.GetFaith.GetName]."
 # Version of Hotspur _without_ the football reference.
  nick_the_hotspur:0 "Ngựa Nóng"
  nick_the_hotspur_desc:1 "Người ta nói [CharYouSheHe(CHARACTER)] đưa ra các quyết định của [CharYourHerHis(CHARACTER)] nhanh đến mức cựa giày nơi gót chân của [CharYourHerHis(CHARACTER)] hiếm khi chạm đất."
  nick_the_vanquisher:0 "Kẻ Chinh Phục"
  nick_the_vanquisher_desc:1 "Bất kỳ ai muốn đối đầu với [CHARACTER.GetShortUINameNoTooltipNoFormat] hãy cứ bước lên — [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] là lưỡi hái của [CHARACTER.GetFaith.DeathDeityName]."
  nick_the_bloody:0 "Đẫm Máu"
  nick_the_bloody_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] không hề nao núng trước một chút hỗn loạn — bất kể thứ hỗn loạn ấy từng là bao nhiêu con người."
  nick_the_shy:0 "Nhút Nhát"
  nick_the_shy_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] hiếm khi được nhìn thấy đến mức biệt danh của [CharYourHerHis(CHARACTER)] là tất cả những gì phần lớn mọi người biết về [CharYouHerHim(CHARACTER)]."
  nick_the_giant:0 "Gã Khổng Lồ"
  nick_the_giant_desc:1 "Tin đồn nói rằng [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] lớn bằng cả một ngôi nhà — nhưng theo kinh nghiệm của [CharYourHerHis(CHARACTER)], điều đó còn tùy thuộc vào ngôi nhà nào."
  nick_bad_hand:0 "Bàn Tay Xui"
  nick_bad_hand_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] khẳng định đó là cú đấm phải mạnh mẽ của [CharYourHerHis(CHARACTER)], nhưng phần lớn mọi người biết rằng [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] chỉ đơn giản là vô vọng khi chơi bài."
  nick_the_little:0 "Nhỏ Bé"
  nick_the_little_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] thường được xem là người có vóc dáng thấp bé."
  nick_the_one_eyed:0 "Một Mắt"
  nick_the_one_eyed_desc:0 "$nick_monophthalmos_desc$"
  nick_the_oppressor:0 "Bạo Chúa"
  nick_the_oppressor_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] không phải là vị quân chủ được thần dân [CharYourHerHis(CHARACTER)] ghi nhớ nhiều nhất trong lịch sử."
  nick_the_apostate:0 "Kẻ Bội Giáo"
  nick_the_apostate_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] đã đứng lên chống lại làn sóng thành công của một đức tin khác và thay vào đó tuyên bố tình yêu cùng lòng trung thành của [CharYourHerHis(CHARACTER)] dành cho [CHARACTER.GetFaith.HighGodName]."
  nick_the_pagan:0 "Ngoại Giáo"
  nick_the_pagan_desc:1 "Đa số muốn chế nhạo [CHARACTER.GetShortUINameNoTooltipNoFormat] khi gán cho [CharYouHerHim(CHARACTER)] danh xưng này. Cứ để họ. [CharYouSheHe(CHARACTER)|U] biết[_s(CHARACTER)] sự thật."
  nick_the_heretic:0 "Dị Giáo"
  nick_the_heretic_desc:1 "Việc [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] cải đạo sang [CHARACTER.GetFaith.GetName] thật kịch tính, là một trong những điều người ta nhớ nhất về [CharYouSheHe(CHARACTER)]."
  nick_the_savage:0 "Dã Nhân"
  nick_the_savage_desc:1 "Không có gì và không ai mà [CharYouSheHe(CHARACTER)] ngần ngại xé xác. Nam, nữ, trẻ con, chó — [CharYouSheHe(CHARACTER)] sẽ giết tất cả, và để [CHARACTER.GetFaith.HighGodName] xử lý."
  nick_the_defiant:0 "Ngạo Mạn"
  nick_the_defiant_desc:1 "Cứ đến đi, tất cả hãy đến đi! Con đường của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] mới là con đường đúng đắn, và [CharYouSheHe(CHARACTER)] sẽ giết bao nhiêu người mà [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] phải giết để chứng minh điều đó!"
  nick_the_sea_king:1 "Vua Biển-[CHARACTER.Custom('GetQueenKing')|U]"
  nick_the_sea_king_desc:1 "Cách của [CharYourHerHis(CHARACTER)] là cướp bóc và chiếm đoạt, lấy đi những gì [CharYouSheHe(CHARACTER)] muốn[_s(CHARACTER)] từ bất kỳ ai mà [CharYouSheHe(CHARACTER)] muốn[_s(CHARACTER)]. [CharYouSheHe(CHARACTER)|U] từ chối[_s(CHARACTER)] thay đổi cách sống của [CharYourHerHis(CHARACTER)] trong chuyện này, cũng như không cho phép người dân của [CharYourHerHis(CHARACTER)] thay đổi."
  nick_the_great_and_terrible:0 "Vĩ Đại và Khủng Khiếp"
  nick_the_great_and_terrible_desc:1 "Một tên cướp biển vô đối, một [CHARACTER.GetLadyLord] của máu và vàng, hiện thân của thanh kiếm sáng chói vươn lên trên sóng biển mặn. [CharYouSheHe(CHARACTER)|U] xứng đáng được gọi là Vĩ Đại, và [CharYouSheHe(CHARACTER)] tạo dựng danh tiếng để được gọi là #EMP Khủng Khiếp#!."
  nick_the_stonefaced:0 "Khuôn Mặt Đá"
  nick_the_stonefaced_desc:0 "Cười lên đi. Làm ơn? Chỉ một lần thôi?"
  nick_the_dry:0 "Khô Khan"
  nick_the_dry_desc:1 "Người ta cho rằng không thể biết được liệu [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] luôn cười thầm trong lòng mà không biểu lộ ra ngoài, hay chỉ đơn giản là... không hiểu khái niệm #EMP vui vẻ#! ngay từ đầu."
  nick_the_joyless:0 "Không Hài Hước"
  nick_the_joyless_desc:1 "Bất kỳ ai phải giao tiếp với [CHARACTER.GetShortUINameNoTooltipNoFormat] hằng ngày đều sớm học được cách dùng từ ngữ chính xác và cẩn thận, bởi vì trong sự hiểu biết của [CharYouSheHe(CHARACTER)], [CharYouSheHe(CHARACTER)] sẽ không bao giờ chấp nhận điều gì kém hơn."
  nick_lacks_laughs:0 "Thiếu Cười"
  nick_lacks_laughs_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng là người cực kỳ nghiêm nghị đến mức người ta đồn rằng [CharYouSheHe(CHARACTER)] chưa từng nghe tiếng cười của con người cho đến khi [CharYouSheHe(CHARACTER)] [CharWereWas(CHARACTER)] đã là một [CHARACTER.GetWomanMan] trưởng thành hoàn toàn. [CharYouSheHe(CHARACTER)|U] nghĩ rằng họ đang lên cơn co giật."
  nick_the_dull:0 "Nhàm Chán"
  nick_the_dull_desc:1 "Không ai thực sự nhớ chính xác vì sao [CharYouSheHe(CHARACTER)] [CharWereWas(CHARACTER)] lần đầu tiên được gọi là $nick_the_dull$. Tất cả đều đồng ý rằng nó chẳng đáng để nhớ."
  nick_the_snorer:0 "Ngáy"
  nick_the_snorer_desc:1 "Việc [CharYouSheHe(CHARACTER)] có ngáy hay không vẫn là chuyện để người đời suy đoán lúc nhàn rỗi, nhưng khi [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] ở nhà, triều đình của [CharYourHerHis(CHARACTER)] chắc chắn tràn ngập điều đó."
  nick_troll_slayer:0 "Sát Yêu Tinh"
  nick_troll_slayer_desc:1 "Người dân thường tự hào khoe chạm tay phòng vệ của [CharYourHerHis(CHARACTER)], về cách [CharYouSheHe(CHARACTER)] giết một con yêu tinh thay họ."
  nick_the_bane_of_danes:0 "Ác Mộng của Người Đan Mạch"
  nick_the_bane_of_danes_desc:1 "Đa số đều cho rằng không có gia đình nào ở Scandinavia chưa mất người thân dưới lưỡi kiếm của [CharYourHerHis(CHARACTER)]."
  nick_the_culture_wall:0 "Bức Tường [CHARACTER.GetCulture.GetNameNoTooltip]"
  nick_the_culture_wall_desc:1 "Không kẻ cướp ngoại bang nào, không tên Viking buôn nô lệ nào, không kẻ cướp bóc đói khát nào có thể đi lại trên thủy lộ của [CharYourHerHis(CHARACTER)] hay săn đuổi người dân của [CharYourHerHis(CHARACTER)]."
  nick_nord_foe:0 "Kẻ Thù Nord"
  nick_nord_foe_desc:1 "Một số kẻ ngốc nói [CharYouSheHe(CHARACTER)] không thể làm Nord sợ, rằng họ có băng trong huyết quản. [CharYouSheHe(CHARACTER)|U] biết[_s(CHARACTER)] họ chết la hét và chảy máu như mọi người khác."
  nick_the_scourge_of_the_northerners:0 "Ác Quỷ Miền Bắc"
  nick_the_scourge_of_the_northerners_desc:1 "Chúng đến vùng đất của [CharYourHerHis(CHARACTER)] để tìm kiếm nô lệ và của cải cướp bóc. Người Đan Mạch, người Na Uy, người Thụy Điển. [CharYouSheHe(CHARACTER)|U] chỉ ban[_s(CHARACTER)] cho chúng cái chết nhanh chóng và sự tồn tại vĩnh hằng tại [CHARACTER.GetFaith.random_NegativeAfterLife]."
  nick_the_burner_of_ash:0 "Kẻ Đốt Tro"
  nick_the_burner_of_ash_desc:0 "Không gì thơm bằng mùi tàu chiến đang cháy vào buổi sáng mùa xuân."
  nick_the_garlic:0 "Vua Tỏi"
  nick_the_garlic_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] thường được miêu tả một cách chế giễu trong một bài đồng dao trẻ em."
  nick_garlic_queen:0 "Nữ Hoàng Tỏi"
  nick_garlic_queen_desc:0 "$nick_the_garlic_desc$"
  nick_gajapati:0 "Gajapati"
  nick_gajapati_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] sử dụng voi chiến sáng tạo chắc chắn sẽ được ghi vào lịch sử."
  nick_the_transcriber:0 "Người Biên Chép"
  nick_the_transcriber_desc:0 "Tri thức dựa vào việc truyền đạt, và còn công cụ nào tốt hơn sách và cuộn giấy có thể đọc qua nhiều thế hệ?"
  nick_of_clairvaux:0 "của Clairvaux"
 # I really, sincerely hate the Problem of the Three Bernards.
 ## Not least because there's more than three of them.
 ### I realize that Clairvaux is not in Occitania but I had to slog through dozens of Occitan/Catalan Bernards and now the greater French region's Bernard population are hopelessly tainted for me.
  nick_of_clairvaux_desc:1 "Nguồn gốc của [CharYourHerHis(CHARACTER)|U] quan trọng để phân biệt [CharYouHerHim(CHARACTER)] với một số lượng vô lý các Bernard khác."
  nick_the_headless:0 "Không Đầu"
  nick_the_headless_desc:1 "Nhanh và dứt khoát. Giống như kết thúc của [CharYourHerHis(CHARACTER)]."
  nick_the_footstool:0 "Bệ Chân"
  nick_the_footstool_desc:1 "Nhiệm vụ của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] thật... nặng nề. Và được bàn tán nhiều."
  nick_father_of_the_baltic:0 "Cha của Baltic"
  nick_father_of_the_baltic_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] đã mang Livonia vào thế giới này bằng máu, mồ hôi và lao động."
  nick_mother_of_the_baltic:0 "Mẹ của Baltic"
  nick_mother_of_the_baltic_desc:0 "$nick_father_of_the_baltic_desc$"
  nick_scourge_of_the_baltic:0 "Ác Quỷ của Baltic"
  nick_scourge_of_the_baltic_desc:1 "Nhờ [CHARACTER.GetShortUINameNoTooltipNoFormat], Livonia chắc chắn sẽ tồn tại — trên nền tảng vững chắc từ xương và đau khổ."
  nick_the_mountain_king:0 "Vua Núi"
  nick_the_mountain_king_desc:1 "Các đại sảnh của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] nổi tiếng lẫy lừng."
  nick_beth_nahrain: "Chủ Nhân Hai Sông"
  nick_beth_nahrain_desc: "Chỉ riêng sự hiện diện của nhân vật này đã tạo nên một làn sóng chấn động trong quần chúng, khiến họ bị cuốn đi bởi sự kinh ngạc và thán phục trước những thành tựu thống nhất của [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_child_killer:0 "Xóa Bạn Trẻ Em"
  nick_the_child_killer_desc:1 "Các học giả Kinh Thánh thường cho rằng [CharYouSheHe(CHARACTER)] đã hiểu sai phán quyết của Solomon."
  nick_the_anathema:0 "Lời Nguyền Rủa"
  nick_the_anathema_desc:1 "Sự hỗn loạn của thế gian co rúm trước [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_angel_of_death:1 "Thiên Thần của [CHARACTER.GetFaith.DeathDeityName|U]"
  nick_the_angel_of_death_desc:1 "Theo suy nghĩ của [CharYourHerHis(CHARACTER)], [CharYouSheHe(CHARACTER)] đã kết thúc nỗi đau của họ. Nhưng thế giới lại nhìn nhận khác."
  nick_monophthalmos:0 "Đơn Nhãn"
  nick_monophthalmos_desc:1 "Con mắt còn lại của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] nhận được nhiều chú ý hơn cả hai mắt trước đây."
  nick_health_god_mercy:0 "Lòng Thương Xót của [CHARACTER.GetFaith.HealthGodNamePossessive|U]"
  nick_health_god_mercy_desc:1 "Dù xuất thân không mấy tốt đẹp, [CharYouSheHe(CHARACTER)] đã tìm được con đường vào thế giới y học và tạo dựng danh tiếng cho [CharYourHerHimself(CHARACTER)] bằng việc chăm sóc người nghèo."
  nick_genghis_khan:0 "Genghis Khan"
  nick_genghis_khan_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] là sự trừng phạt của [CHARACTER.GetFaith.HighGodName] dành cho mọi tội lỗi của thế gian — bởi nếu thế giới không đầy rẫy kẻ tội lỗi, liệu [CHARACTER.GetFaith.HighGodName] có gửi một người như #EMP [CharYouHerHim(CHARACTER)]#! đến để trừng phạt hay không?"
  nick_cengiz_khan: "Cengiz Khan"
  nick_cengiz_khan_desc: "$nick_genghis_khan_desc$"
  nick_yekhe_khagan: "Yekhe Khagan"
  nick_yekhe_khagan_desc: "Đấng Vĩ Đại, Đấng Cao Cả, vị quân chủ của biển cỏ và mọi vùng đất định cư! [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] là chiến mã chinh phục cả thế giới."
  nick_dort_yonlug_khagan: "Dört Yönlüg Khagan"
  nick_dort_yonlug_khagan_desc: "Đất trải dài về bốn phương rộng lớn, và — ngay cả đến những nơi cuối cùng, nơi tối tăm, chưa biết — tất cả đều thuộc về [CHARACTER.GetShortUINameNoTooltipNoFormat]! Vũ trụ được sắp xếp thuận tiện cho [CharYourHerHis(CHARACTER)], theo lệnh của [CharYourHerHis(CHARACTER)]."
  nick_tengri_khagan: "Tengri Khagan"
  nick_tengri_khagan_desc: "Ngày xưa, thời các Khagan hùng mạnh của Göktürks, danh hiệu này được khắc trên đá! Tengri Khagan — Sinh ra từ Trời, Khôn Ngoan: [CHARACTER.GetShortUINameNoTooltipNoFormat] được Trời Xanh tạo ra để cai trị thế giới."
  nick_xormuzta: "Xormuzta"
  nick_xormuzta_desc: "Một tước hiệu cổ xưa liên quan đến 'thần trời' của người Iran Cổ, và giờ đây được các Cơ Đốc Đông phương dùng để tôn kính các nhà sáng lập huyền thoại như [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_mar_sargis: "Mar Sargis"
  nick_mar_sargis_desc: "Được cho là được dẫn dắt đến cầm quyền đạo đức nhờ những thị kiến linh thiêng, người bảo trợ của [CharYourHerHis(CHARACTER)] là tử đạo St. Sargis."
  nick_cihangir: "Cihangir"
  nick_cihangir_desc: "Theo ý chí thiêng liêng của Allah, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] kẻ chinh phục toàn thế giới. Chưa từng có khi nào Dar al-Islam và những vùng đất của kẻ ngoại đạo lại nghe tiếng vó ngựa vang dội đến thế!"
  nick_culture_khagan: "[CHARACTER.GetCulture.GetNameNoTooltip] Khagan"
  nick_culture_khagan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được tôn kính như vĩ đại nhất trong tất cả [CHARACTER.GetCulture.GetCollectiveNounNoTooltip], và [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] của [CharYourHerHis(CHARACTER)] — những đứa con của định mệnh, những kỵ sĩ giẫm nát thành phố, những người nắm giữ gươm và roi của đế chế!"
  nick_akhshunwar: "Akhshunwar"
  nick_akhshunwar_desc: "Từ lâu các chủ nhân Con Đường Tơ Lụa mang danh hiệu cao quý như #EMP Ikhshid#!, #EMP Shahanshah#!, và #EMP Akhshunwar#!, nhưng chưa ai xứng đáng như [CHARACTER.GetShortUINameNoTooltipNoFormat] để giữ danh hiệu 'người mang quyền lực'!"

  nick_fabulous_she_he:0 "Tuyệt Vời [CHARACTER.GetSheHe|U], [CHARACTER.GetFirstNameNoTooltip|U]"
  nick_fabulous_she_he_desc:2 "Không hiếm khi người qua đường quỳ xuống để tôn trọng khi người này đi ngang."
  nick_the_wary:0 "Cảnh Giác"
