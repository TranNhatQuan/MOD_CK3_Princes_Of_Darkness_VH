  nick_wolf_slayer: "Sát Thủ Sói"
  nick_wolf_slayer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi danh khắp vùng vì đã dũng cảm giết một con sói dữ giận dữ trong trại."
  nick_wolf_father: "Cha Sói"
  nick_wolf_father_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi danh khắp vùng vì giúp một con sói mang thai sinh và nuôi đàn con."
  nick_wolf_mother: "Mẹ Sói"
  nick_wolf_mother_desc: "$nick_wolf_father_desc$"

  nick_old_man_of_the_mountain: "Lão Nhân Trên Núi"
  nick_old_man_of_the_mountain_desc: "Râu trắng dài và gậy cong, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] khiến kẻ ngoại đạo kinh sợ vì đã tổ chức và lãnh đạo những sát thủ đáng sợ từ pháo đài trên núi của mình."

  nick_barbarossa: "Barbarossa"
  nick_barbarossa_desc: "Do nét danh tiếng mơ hồ từ chiếc áo đỏ từng che cằm, [CHARACTER.GetShortUINameNoTooltipNoFormat] được kẻ thù Ý đặt cho biệt danh #italic Barbarossa#! — Râu Đỏ."

  nick_danishmend: "Danişmend"
  nick_danishmend_desc: "Được ban cho kiến thức uyên thâm, học vấn của [CHARACTER.GetShortUINamePossessiveNoFormat] được nhiều người biết đến và kính trọng."

  nick_protosebastos: "Protosebastos"
  nick_protosebastos_desc: "Một danh hiệu cao cấp trong triều Byzantine dành cho rất ít người, tước hiệu 'first Augustus' đánh dấu [CHARACTER.GetShortUINameNoTooltipNoFormat] với uy tín hoàng gia."

  nick_protosebaste: "Protosebaste"
  nick_protosebaste_desc: "Một danh hiệu cao cấp trong triều Byzantine dành cho rất ít người, tước hiệu 'first Augusta' đánh dấu [CHARACTER.GetShortUINameNoTooltipNoFormat] với uy tín hoàng gia."

  nick_the_narrow_minded: "Bảo Thủ"
  nick_the_narrow_minded_desc: "Mọi thứ quen thuộc đều tốt với [CHARACTER.GetShortUINameNoTooltipNoFormat|U], và điều ngược lại cũng đúng."

 # Bandit King nicknames
  nick_the_bandit_king: "Vua Cướp"
  nick_the_bandit_king_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] bị sợ hãi khắp vùng vì là một tên cướp bạo lực và phản trắc."
  nick_the_bandit_queen: "Nữ Vương Cướp"
  nick_the_bandit_queen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] bị sợ hãi khắp vùng vì là một tên cướp bạo lực và phản trắc."
  nick_the_pirate_king: "Vua Cướp Biển"
  nick_the_pirate_king_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] là nỗi khiếp sợ của biển cả, gieo sợ hãi vào lòng tất cả kẻ dám liều lĩnh ra khơi."
  nick_the_pirate_queen: "Nữ Vương Cướp Biển"
  nick_the_pirate_queen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] là nỗi khiếp sợ của biển cả, gieo sợ hãi vào lòng tất cả kẻ dám liều lĩnh ra khơi."

  nick_the_rhymer: "Kẻ Ngâm Thơ"
  nick_the_rhymer_desc: "Với con mắt nhạy bén cho các điệp âm và cặp câu đối, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] được đồng nghiệp ngưỡng mộ vì sử dụng thơ điêu luyện."
  nick_the_elegist: "Kẻ Thơ Ai Điệu"
  nick_the_elegist_desc: "Những câu thơ u sầu mà [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] nổi tiếng làm rơi lệ ngay cả những người cứng rắn nhất."
  nick_the_poetaster: "Kẻ Thơ Kém"
  nick_the_poetaster_desc: "Thơ của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] nổi tiếng, nhưng có lẽ không phải vì lý do mà họ mong muốn."
  nick_the_elysian_muse: "Nàng Thơ Elysian"
  nick_the_elysian_muse_desc: "Nổi danh khắp vùng này và nhiều nơi khác vì khả năng tuyệt vời tạo ra những câu thơ tuyệt mỹ, [CHARACTER.GetShortUINameNoTooltipNoFormat] thể hiện sự thuần thục hoàn toàn trong mọi hình thức ngôn từ."

  nick_iscariot: "Iscariot"
  nick_iscariot_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì phản bội những nguyên tắc quý giá nhất trong lòng [CharYourHerHis(CHARACTER)], bán tất cả vì lợi ích riêng của [CharYourHerHis(CHARACTER)]."

  nick_the_foreign_mother: "Người Mẹ [CHARACTER.GetMother.GetCulture.GetNameNoTooltip]"
  nick_the_foreign_mother_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] không thể thoát khỏi nỗi hổ thẹn vì dòng dõi mẫu hệ ngoại quốc của [CharYourHerHis(CHARACTER)], và [CharAreIs(CHARACTER)] phải chịu vô số lời chế nhạo dân tộc rẻ tiền."
  nick_the_foreign_father: "Người Cha [CHARACTER.GetFather.GetCulture.GetNameNoTooltip]"
  nick_the_foreign_father_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] không thể thoát khỏi nỗi hổ thẹn vì dòng dõi phụ hệ ngoại quốc của [CharYourHerHis(CHARACTER)], và [CharAreIs(CHARACTER)] phải chịu vô số lời chế nhạo dân tộc rẻ tiền."
  nick_the_corpulent: "Người Phì Nộn"
  nick_the_corpulent_desc: "Ngựa và sàn nhà đều run rẩy trước đống thịt phì nộn là [CHARACTER.GetShortUINameNoTooltipNoFormat]."
  nick_the_insubordinate: "Người Bất Tuân"
  nick_the_insubordinate_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] luôn sẵn sàng chống lại và trả thù, là người hầu khủng khiếp và chư hầu bất trung."
  nick_the_backstabber: "Kẻ Đâm Sau Lưng"
  nick_the_backstabber_desc: "Nhiều con dao, cả nghĩa đen lẫn nghĩa bóng, đã được giáng vào lưng theo lệnh của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]."
  nick_the_corrupt: "Kẻ Thối Nát"
  nick_the_corrupt_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] là sinh vật tinh ranh, ngồi trên kho vàng đầy nghi vấn."
  nick_the_incompetent: "Kẻ Vô Năng"
  nick_the_incompetent_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] không thực sự phù hợp với quyền lực và trách nhiệm được giao vào tay [CharYourHerHis(CHARACTER)]."
  nick_the_gambler: "Kẻ Đánh Bạc"
  nick_the_gambler_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] đặt cược khổng lồ, dù cơ hội mong manh... và #EMP đặc biệt#! khi đặt cược cao."
  nick_the_obscene: "Kẻ Thô Lỗ"
  nick_the_obscene_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì sự thô tục, lời nói bẩn thỉu. Sự trong sáng không tồn tại lâu trong tầm nghe của họ."
  nick_the_miser: "Kẻ Keo Kiệt"
  nick_the_miser_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] keo kiệt đến mức cực đoan, làm các Ta tớ và thân tộc bất mãn."
  nick_the_unfortunate: "Người Đen Đủi"
  nick_the_unfortunate_desc: "Có điều gì đó trong sự tồn tại của [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]… thật bất hạnh. Đứng dưới bóng cờ của [CharYourHerHis(CHARACTER)] là biết được sự khó chịu."
  nick_brown_cheeks: "Má Nâu"
  nick_brown_cheeks_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] cố gắng khởi nghĩa chống lại lãnh đạo [CharYourHerHis(CHARACTER)]… và đã sợ hãi thật sự."
  nick_the_drunkard_michael_iii: "Kẻ Say"
  nick_the_drunkard_michael_iii_desc: "Thương Michael, một hoàng đế trẻ, sa sút vì sự #EMP không mấy Kitô giáo#! mê rượu. Một bài học cho tất cả rằng sinh ra có thể báo hiệu tài năng, nhưng không đảm bảo điều đó."
  nick_the_pious_michael_iii: "Người Mộ Đạo"
  nick_the_pious_michael_iii_desc: "Dù một tai nạn bi thảm cướp đi mạng sống của ông quá sớm, Michael chắc hẳn được ngự trị cao nơi Thiên đường nhờ vai trò #EMP then chốt#! trong việc chấm dứt sự phá hoại hình ảnh thánh thần."
  nick_the_young_michael_iii: "Người Trẻ"
  nick_the_young_michael_iii_desc: "Làm vua từ thuở nhỏ, thật dường như là một trò đùa tàn nhẫn khi Michael có triều đại dài mà lại chết quá trẻ. Một cách tình cờ."
  nick_the_exile: "Kẻ Lưu Đày"
  nick_the_exile_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] bị đuổi khỏi [CharYourHerHis(CHARACTER)] quê hương hoặc rời đi để tránh gánh nặng bất ngờ nào đó, tìm nơi nương náu ở nước ngoài."
  nick_lackland_young: "Kẻ Không Đất"
  nick_lackland_young_desc: "Tội nghiệp [CHARACTER.GetShortUINameNoTooltipNoFormat], sinh ra là con út trong đám anh em lừng lẫy. Làm sao có thể trông đợi [CharYouSheHe(CHARACTER)] cai trị được phần lớn điều gì?"
  nick_lackland_ironic: "$nick_lackland_young$"
  nick_lackland_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] có thể từng là con trai ít quyền lực của những bậc cha lớn, nhưng [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] vẫn xoay sở được một lãnh thổ đáng nể bất chấp mọi khó khăn — và cả những tiếng cười nhạo không tinh tế."
  nick_lackland_old: "$nick_lackland_young$"
  nick_lackland_old_desc: "Thật xấu hổ cho [CHARACTER.GetShortUINameNoTooltipNoFormat] khi sở hữu một tài sản lớn như vậy mà lại mất đi nhiều — và làm sao mà biệt danh của [CharYourHerHis(CHARACTER)] lại tiên tri đến vậy."
  nick_curtmantle: "Áo Choàng Ngắn"
  nick_curtmantle_desc: "Một [CHARACTER.GetWomanMan] thực dụng, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] nổi tiếng vì ưa thích áo choàng ngắn đi lại hơn là những bộ trang phục phức tạp hoặc hoa mỹ."

 # BP3
  nick_pauper_king: "Vua Nghèo"
  nick_pauper_king_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì thường xuyên uống rượu với dân chúng địa phương tại các thị trấn và thành phố của [CharYourHerHis(CHARACTER)]."

  nick_the_mapmaker: "Người Vẽ Bản Đồ"
  nick_the_mapmaker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] nổi tiếng vì đi nhiều nơi, nhưng cũng dành nhiều thời gian vẽ bản đồ các khu vực mà [CharYouSheHe(CHARACTER)] đã đi qua."

  nick_the_ploughman: "Người Cày"
  nick_the_ploughman_desc: "Chỉ là một nông dân khiêm tốn lúc bấy giờ, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] đang cày ruộng khi các sứ giả tới triệu tập [CharYouHerHim(CHARACTER)] lên ngôi."

 # MPO
  nick_the_dreadful: "Người Kinh Khủng"
  nick_the_dreadful_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tin rằng cách duy nhất để được tôn trọng là khiến người khác sợ hãi."

 # TGP
  nick_shinno: "Thiên Hoàng"
  nick_shinno_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được biết đến vì tự xưng là \"vị hoàng đế mới\" của Nhật Bản và lãnh đạo một cuộc nổi loạn chống lại chính quyền trung ương."
  nick_murasaki_shikibu: "Murasaki Shikibu"
  nick_murasaki_shikibu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] nổi tiếng với biệt hiệu #EMP Murasaki Shikibu#!, xuất phát từ màu tím — #EMP murasaki#! — hoa tử đằng, nổi tiếng là #EMP fujiwara#!, từ đó gia đình cô lấy tên, và vị trí của cha cô trong #EMP Shikibu-shō#!, Bộ Lễ nghi."
  nick_izumi_shikibu: "Izumi Shikibu"
  nick_izumi_shikibu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] nổi tiếng với biệt hiệu #EMP Izumi Shikibu#!, xuất phát từ chức vị chồng cô làm tổng quản tỉnh #EMP Izumi#!, và chức vị cha cô trong #EMP Shikibu-shō#!, Bộ Lễ nghi."
  nick_sei_shonagon: "Sei Shōnagon"
  nick_sei_shonagon_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] nổi tiếng với biệt hiệu #EMP Sei Shōnagon#!, xuất phát từ #EMP Sei#!, cách đọc tiếng Trung của #EMP Kiyohara#!, tên gia đình cô, và vị trí của một người thân nam là #EMP Shōnagon#!, Hội viên phụ chính phủ."
  nick_the_fierce: "Người Dữ"
  nick_the_fierce_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] danh tiếng về sự kiên cường vượt xa [CHARACTER.GetHerHim]."
  nick_tenjin: "Thiên Thần"
  nick_tenjin_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] được tin là đã trở thành linh hồn báo thù sau khi [CHARACTER.GetHerHis] bị đối xử bất công, và nay được thờ như một thực thể thiên thần."
  nick_ushiwakamaru: "Ushiwakamaru"
  nick_ushiwakamaru_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nổi tiếng với sức mạnh và sự bền bỉ của một con bò non, khiến những người xung quanh [CharYourHerHim(CHARACTER)] kinh sợ."
  nick_ho_seung: "Ho-seung"
  nick_ho_seung_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] được bao quanh bởi một truyền thuyết bay lơ lửng kể về một con hổ đã chết sau khi rơi vào bẫy hố, tái sinh thành con người, và trở thành một nhà sư. Theo truyền thuyết đó, nhà sư này không ai khác chính là [CHARACTER.GetHerselfHimself]."
