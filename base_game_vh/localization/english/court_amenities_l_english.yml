l_english:
 court_fashion:0 "Thời Trang Triều Đình"
 court_fashion_default:2 "Thời Trang Thế Kỷ Trước"
 court_fashion_default_desc:0 "Các cận thần ăn mặc theo lối truyền thống, an toàn nhưng không mấy sáng tạo."
 court_fashion_acceptable:1 "Thời Trang Lỗi Mốt"
 court_fashion_acceptable_desc:0 "Các cận thần thu hút ánh nhìn khi ghé thăm thị trấn và thành phố."
 court_fashion_decent:0 "Thời Trang Tươm Tất"
 court_fashion_decent_desc:0 "Các cận thần linh hoạt cập nhật tủ đồ theo mùa, bỏ đi y phục cũ khi phong cách mới xuất hiện."
 court_fashion_good:1 "Thời Trang Sành Điệu"
 court_fashion_good_desc:0 "Phong cách của triều đình này thường lan rộng khắp thế giới và ảnh hưởng đến các triều đình khác."
 court_fashion_fantastic:1 "Thời Trang Cao Cấp"
 court_fashion_fantastic_desc:0 "Triều đình này được xem là kẻ tiên phong về phong cách. Người hầu ăn mặc như quân vương ở các vương quốc khác, và chủ nhân của họ sẽ được nhớ mãi vì gu ăn mặc."

 court_food_quality:0 "Chất Lượng Thức Ăn"
 court_food_quality_default:1 "Thức Ăn Nhạt Nhẽo"
 court_food_quality_modest:0 "Thức Ăn Đạm Bạc"
 court_food_quality_decent:0 "Thức Ăn Tươm Tất"
 court_food_quality_lavish:0 "Yến Tiệc Xa Hoa"
 court_food_quality_exotic:0 "Ẩm Thực Dị Quốc"
 court_food_quality_default_desc:0 "Không ai mong chờ bữa ăn ở triều đình này, nhưng người ta nói rằng bầu Ngài đã bù đắp tất cả."
 court_food_quality_modest_desc:0 "Khách được phục vụ đầy đủ với ẩm thực địa phương vừa phải."
 court_food_quality_decent_desc:0 "Triều đình này có thể thỉnh thoảng cung cấp những món ăn mới lạ."
 court_food_quality_lavish_desc:0 "Một đội ngũ đầu bếp cung cấp liên tục các món ngon. Người hầu với khay thức ăn luôn theo sát mọi buổi tụ họp."
 court_food_quality_exotic_desc:0 "Người hầu được gửi đến vùng đất xa xôi và trở về với vô vàn món ăn dị quốc. Không có thú vui ẩm thực nào chưa từng xuất hiện tại đây."

 court_lodging_standards:0 "Tiêu Chuẩn Lưu Trú"
 court_lodging_standards_default:1 "Chỗ Ở Chật Hẹp"
 court_lodging_standards_small:0 "Chỗ Ở Nhỏ"
 court_lodging_standards_middling:0 "Chỗ Ở Trung Bình"
 court_lodging_standards_spacious:0 "Chỗ Ở Rộng Rãi"
 court_lodging_standards_grand:0 "Chỗ Ở Lộng Lẫy"
 court_lodging_standards_default_desc:0 "Đôi khi xảy ra sự cố ngoại giao khi khách được yêu cầu ở chung phòng."
 court_lodging_standards_small_desc:0 "Có đủ không gian để mỗi cận thần có phòng riêng."
 court_lodging_standards_middling_desc:0 "Phòng của mỗi cận thần đều được trang bị đầy đủ."
 court_lodging_standards_spacious_desc:0 "Bất kỳ ai trong triều đình này đều có thể mong đợi một dãy phòng riêng."
 court_lodging_standards_grand_desc:0 "Khách có thể yêu cầu mọi tiện nghi trong phòng. Bất kỳ cuốn sách nào cho phòng đọc, bất kỳ ly rượu đêm khuya nào – phòng luôn có người phục vụ mọi giờ."

 court_servants:0 "Người Hầu Triều Đình"
 court_servants_default:1 "Rất Ít Người Hầu"
 court_servants_few:0 "Ít Người Hầu"
 court_servants_some:0 "Một Số Người Hầu"
 court_servants_many:0 "Nhiều Người Hầu"
 court_servants_endless:0 "Vô Số Người Hầu"
 court_servants_default_desc:0 "Số ít người hầu của triều đình này kiệt sức vì phải đáp ứng mọi yêu cầu của khách."
 court_servants_few_desc:0 "Triều đình này có người hầu có thể đáp ứng hầu hết những tiện nghi thiết yếu."
 court_servants_some_desc:0 "Triều đình này có những người hầu chuyên biệt và tự hào về công việc của mình."
 court_servants_many_desc:0 "Triều đình này có người hầu cho mọi mục đích có thể nghĩ đến."
 court_servants_endless_desc:0 "Triều đình này có nhiều người hầu đến mức không ai biết dùng sao cho hết. Ngay cả việc đơn giản nhất cũng khó thực hiện nếu không có người hầu xin làm thay Ngài."
 court_servants_few_guest_recruitment:0 "Chi phí chiêu mộ [guest|E]: #P -20%#!"
 court_servants_some_guest_recruitment:0 "Chi phí chiêu mộ [guest|E]: #P -30%#!"
 court_servants_many_guest_recruitment:0 "Chi phí chiêu mộ [guest|E]: #P -40%#!"
 court_servants_endless_guest_recruitment:0 "Chi phí chiêu mộ [guest|E]: #P -50%#!"
 court_lodgings_small_inspirations:0 "Chất lượng [inspiration|E] hoàn thành có một cơ hội nhỏ được cải thiện"
 court_lodgings_middling_inspirations:0 "Chất lượng [inspiration|E] hoàn thành có cơ hội được cải thiện"
 court_lodgings_spacious_inspirations:0 "Chất lượng [inspiration|E] hoàn thành có cơ hội khá cao được cải thiện"
 court_lodgings_grand_inspirations:0 "Chất lượng [inspiration|E] hoàn thành có cơ hội tốt được cải thiện"
 owner_court_lodgings_small:2 "[guests|E] có thể ở lại lâu hơn\n$EFFECT_LIST_BULLET$[guest|E] chấp nhận tham gia âm mưu tại triều đình của Ngài với vai trò [agent|E]: #P +5#!"
