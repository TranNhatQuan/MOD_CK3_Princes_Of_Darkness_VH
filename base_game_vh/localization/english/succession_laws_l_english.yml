 celestial_grand_marshal_appointment_succession_law: "Bổ Nhiệm Đại Nguyên Soái"
 celestial_grand_marshal_appointment_succession_law_subname: "$celestial_military_appointment_succession_law_subname$"
 celestial_grand_marshal_appointment_succession_law_effects: "\n[succession|E] dựa trên [merit_level|E] và [merit_pools|E]\n\n#high Một dạng của [appointment_succession_law|E] chỉ được sử dụng bởi [minister_grand_marshal|E], vị trí dành riêng cho các chỉ huy có [merit_levels|E] cao nhất. Theo $celestial_grand_marshal_appointment_succession_law$, [title|E] sẽ được thừa kế bởi ứng viên có [candidate_score|E] cao nhất. Điểm số chủ yếu bị ảnh hưởng bởi [martial_skill|E], việc sở hữu [commander_traits|E], hoặc tiêu hao [influence|E].#!"

