 celestial_ministry_appointment_succession_law_effects: "\n[succession|E] dựa trên [merit_level|E] và [merit_pools|E]\n\n#high Một dạng của [appointment_succession_law|E]. $celestial_appointment_succession_law$ là chế độ thừa kế dành cho các [titles|E] Bộ. Đây là những vị trí danh giá dành cho những người có [merit_levels|E] cao nhất. [movements|E], [merit|E], và [influence|E] đóng vai trò quan trọng trong việc gia tăng [candidate_score|E] của ứng viên.#!"
