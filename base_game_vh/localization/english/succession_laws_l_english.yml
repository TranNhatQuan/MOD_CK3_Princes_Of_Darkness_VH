 meritocratic_regency_succession_law: "Thừa Kế Nhiếp Chính Trọng Dụng"
 meritocratic_regency_succession_law_subname: "$appointment_succession_law_subname$"
 meritocratic_regency_succession_law_effects: "Theo $meritocratic_regency_succession_law$, [title|E] và các [holdings|E] liên quan sẽ được thừa kế bởi ứng viên có điểm số cao nhất. Danh sách ứng viên bao gồm các [noble_families|E], [governors|E] trong lãnh địa và thành viên gia đình của họ.\n\nNếu [ceremonial_liege|E] được chọn làm [ceremonial_regent|E] tiếp theo, họ sẽ được trao lựa chọn hoặc thoái vị, hoặc cố gắng tái lập quyền cai trị trực tiếp."
