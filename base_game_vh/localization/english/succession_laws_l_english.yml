 holy_order_succession_law_effects:0 "Khi kế vị, toàn bộ [titles|e] của Đại Thống Lĩnh sẽ trao cho người kế nhiệm, thường là [knight|E] có chỉ số [martial|E] cao nhất."
 mercenary_company_succession_law:1 "Đoàn Lính Đánh thuê"
 mercenary_company_succession_law_effects:0 "Khi kế vị, toàn bộ [titles|e] của Đội trưởng sẽ trao cho người kế nhiệm, thường là [knight|E] có chỉ số [martial|E] cao nhất."
 city_succession_law:1 "Cộng hòa"
 city_succession_law_effects:0 "Khi kế vị, toàn bộ [titles|e] của người cai trị sẽ trao cho người kế nhiệm."
