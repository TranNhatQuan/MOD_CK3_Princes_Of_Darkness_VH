 saxon_elective_electors:0 "$feudal_elective_electors$"
 saxon_elective_electors_tooltip:0 "Để là một [elector|E] hợp lệ theo Witenagemot, một chư hầu phải đáp ứng tất cả các điều kiện sau:\n$EFFECT_LIST_BULLET$Là [vassal|E] [de_jure|E] của tước vị\n$EFFECT_LIST_BULLET$Là chư hầu trực tiếp của tước vị\n$EFFECT_LIST_BULLET$Đã trưởng thành\n$EFFECT_LIST_BULLET$KHÔNG bị Mất năng lực"

 scandinavian_elective_candidates:0 "Gia đình Mở rộng và Người có Yêu sách"
