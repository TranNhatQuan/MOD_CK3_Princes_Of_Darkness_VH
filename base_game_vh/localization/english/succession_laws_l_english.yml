 meritocratic_appointment_succession_law_effects: "\n#high Một dạng của [appointment_succession_law|E]. Theo $meritocratic_appointment_succession_law$, [title|E] và các [holdings|E] liên quan sẽ được thừa kế bởi ứng viên có [candidate_score|E] cao nhất. Bất kỳ [adult|E] nào trong [realm|E] đều có thể tìm cách đạt được một [governorship|E] thông qua nhiều phương thức khác nhau, như có [merit_level|E] cao hoặc tiêu hao [influence|E].#!\n\n"
