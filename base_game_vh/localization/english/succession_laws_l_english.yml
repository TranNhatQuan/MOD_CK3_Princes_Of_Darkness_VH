 male_only_law_effects:0 "$EFFECT_LIST_BULLET$Phụ nữ không được quyền thừa kế\n$EFFECT_LIST_BULLET$Phụ nữ không thể thừa kế [claims|E]\n$EFFECT_LIST_BULLET$[rulers|E] nam có thể có [concubines|E] hoặc nhiều [spouses|E] nếu [faith|E] của họ có giáo lý [GetFaithDoctrine('doctrine_concubines').GetBaseName] hoặc [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [doctrine|E]"
 male_preference_law_effects:0 "$EFFECT_LIST_BULLET$Nam giới được ưu tiên hơn nữ giới trong kế vị\n$EFFECT_LIST_BULLET$[rulers|E] nam có thể có [concubines|E] hoặc nhiều [spouses|E] nếu [faith|E] của họ có giáo lý [GetFaithDoctrine('doctrine_concubines').GetBaseName] hoặc [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [doctrine|E]"
 equal_law_effects:3 "$EFFECT_LIST_BULLET$Nam và nữ bình đẳng trong quyền kế vị\n$EFFECT_LIST_BULLET$Tất cả [rulers|E] có thể có [concubines|E] hoặc nhiều [spouses|E] nếu [faith|E] của họ có [GetFaithDoctrine('doctrine_concubines').GetBaseName] hoặc [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [doctrine|E]"
 female_preference_law_effects:2 "$EFFECT_LIST_BULLET$Nữ được ưu tiên hơn nam trong quyền kế vị\n$EFFECT_LIST_BULLET$[rulers|E] là nữ có thể có [concubines|E] hoặc nhiều [spouses|E] nếu [faith|E] của họ có [GetFaithDoctrine('doctrine_concubines').GetBaseName] hoặc [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [doctrine|E]"
 female_only_law_effects:2 "$EFFECT_LIST_BULLET$Nam giới bị loại khỏi quyền thừa kế\n$EFFECT_LIST_BULLET$Nam giới không thể thừa kế [claims|E]\n$EFFECT_LIST_BULLET$[rulers|E] là nữ có thể có [concubines|E] hoặc nhiều [spouses|E] nếu [faith|E] của họ có [GetFaithDoctrine('doctrine_concubines').GetBaseName] hoặc [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [doctrine|E]"
 SUCCESSION_FORM_NAME: "[Character.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName] [Character.GetActiveLawInGroupWithFlag('succession_order_laws').GetName]"
 feudal_elective_succession_law:0 "Bầu cử Phong kiến"
 princely_elective_succession_law:0 "Bầu cử Thân vương"
 feudal_elective_succession_law_effects:1 "[ruler|E] và tất cả [vassals|E] [de_jure|E] trực thuộc thấp hơn [title|E] một hoặc hai [ranks|E] có thể đề cử một [title_heir|E] từ chính họ và từ [close_family|E] của người cai trị."
 princely_elective_succession_law_effects:1 "Hoàng đế và bảy Thân vương Tuyển hầu có thể đề cử một [title_heir|E] từ chính họ, bất kỳ con cái và anh chị em [legitimate|E] nào của [ruler|E], cũng như bất kỳ [vassal|E] [de_jure|E] quan trọng nào khác của Đế chế. Nếu một [title|E] Tuyển hầu lịch sử bị người ngoại đạo nắm giữ hoặc không tồn tại, một [de_jure|E] vassal khác sẽ thay thế. [succession_law|E] này đặc biệt coi trọng [faith|E] và [piety|E].\n\nThe Electoral titles for this realm are the Counties of Cologne, Mainz and Trier, and the Duchies of Bohemia, East Franconia, Ostfalen and Ostmark."
 gaelic_elective_succession_law:0 "Bầu cử Tanistry"
 gaelic_elective_succession_law_effects:2 "[ruler|E] và tất cả [vassals|E] trên cấp [baron|E] và thấp hơn [title|E] một hoặc hai [ranks|E] có thể đề cử một [title_heir|E] — Tanist — từ các thành viên trong [dynasty|E] của người cai trị. Các chư hầu có xu hướng ủng hộ những thân thích lớn tuổi, họ hàng xa hơn thay vì [close_family|E]."
 saxon_elective_succession_law:1 "Bầu cử Saxon"
 saxon_elective_succession_law_subname:0 "Witenagemot"
 saxon_elective_succession_law_effects:1 "[ruler|E] và tất cả [vassals|E] [de_jure|E] trực thuộc, đã trưởng thành, thấp hơn [title|E] một hoặc hai [ranks|E] có thể đề cử một [title_heir|E] từ [powerful_vassal|E] mạnh nhất trong số họ, các con [legitimate|E] của người cai trị, hoặc bất kỳ [claimant|E] hợp lệ nào khác."
 scandinavian_elective_succession_law:1 "Bầu cử Scandinavia"
 scandinavian_elective_succession_law_subname:0 "Thing"
 scandinavian_elective_succession_law_effects:2 "[ruler|E] và tất cả [vassals|E] [de_jure|E] (trừ Nam tước) có thể đề cử một [title_heir|E] trong số [extended_family|E] của người cai trị và bất kỳ [claimants|E] nào hiện có. [voting_power|E] trong [succession_law|E] này bị ảnh hưởng bởi tổng [county_development|E] trong [domain|E] của [elector|E] và [county_opinion|E] tại [capital|E]."

 feudal_elective_candidates:0 "Gia đình Thân cận, Người có Yêu sách và Tuyển cử viên"
 feudal_elective_candidates_tooltip:1 "Để là Ứng viên hợp lệ theo Bầu cử Phong kiến, một nhân vật phải đáp ứng một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$Là thành viên [close_family|E] hợp pháp của người cai trị hiện tại và không nằm trong hàng thừa kế một Thần quyền hoặc Cộng hòa. Con của ứng viên không thể được đề cử\n$EFFECT_LIST_BULLET$Là một [claimant|E] đối với tước vị và không nằm trong hàng thừa kế một Thần quyền hoặc Cộng hòa\n$EFFECT_LIST_BULLET$Là một [elector|E] Phong kiến hợp lệ của tước vị"
 feudal_elective_electors:0 "Người cai trị và Chư hầu"
 feudal_elective_electors_tooltip:0 "Để là một [elector|E] hợp lệ theo Bầu cử Phong kiến, một chư hầu phải đáp ứng tất cả các điều kiện sau:\n$EFFECT_LIST_BULLET$Là [vassal|E] [de_jure|E] của tước vị\n$EFFECT_LIST_BULLET$Là chư hầu trực tiếp của tước vị\n$EFFECT_LIST_BULLET$Chỉ thấp hơn tước vị một hoặc hai [ranks|E]"

 princely_elective_candidates:0 "$feudal_elective_candidates$"
 princely_elective_candidates_tooltip:1 "Để là Ứng viên hợp lệ theo Bầu cử Thân vương, một nhân vật phải đáp ứng một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$Là thành viên [close_family|E] hợp pháp của người cai trị hiện tại và không nằm trong hàng thừa kế một Thần quyền hoặc Cộng hòa. Con của ứng viên không thể được đề cử\n$EFFECT_LIST_BULLET$Là một [claimant|E] đối với tước vị và không nằm trong hàng thừa kế một Thần quyền hoặc Cộng hòa\n$EFFECT_LIST_BULLET$Là một [elector|E] Phong kiến hợp lệ của tước vị"
 princely_elective_electors:0 "Thân vương Tuyển hầu"
 princely_elective_electors_tooltip:1 "Ngoài [SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsNameNoTooltip], những người nắm giữ các [titles|E] sau được ưu tiên làm [electors|E] theo [SuccessionElectionWindow.GetSuccessionLaw.GetName]:[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nIf any of the above are not created, not held by a [de_jure|E] Imperial [vassal|E], already held by another Elector, or the holder's [faith|E] differs from the Emperor's, another De Jure title held by a direct Imperial vassal or [independent_ruler|E] will be selected based on these criteria:\n$EFFECT_LIST_BULLET$Rulers of Emperor's [faith|E] and [culture|E] are favored\n$EFFECT_LIST_BULLET$[theocratic|E] and [feudal|E] rulers are favored"

 gaelic_elective_candidates:0 "Thành viên Triều đại"
 gaelic_elective_candidates_tooltip:1 "Tất cả thành viên hợp pháp trong [dynasty|E] của người cai trị hiện tại và không nằm trong hàng thừa kế một Thần quyền hoặc Cộng hòa đều là ứng viên hợp lệ theo Tanistry. Con của ứng viên không thể được đề cử."
