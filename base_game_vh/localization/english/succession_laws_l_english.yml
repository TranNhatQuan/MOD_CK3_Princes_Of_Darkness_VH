l_english: 
 succession_order_laws:0 "[succession_laws|E]"
 succession_order_laws_singular:0 "[succession_law|E]"
 partition_succession_law:1 "Phân chia"
 partition_succession_law_subname:0 "Mọi con cái thừa kế ngang nhau"
 partition_succession_law_effects:1 "\n#V Theo chế độ $partition_succession_law$ [succession], các [titles] của Ngài sẽ được chia đều cho con cái.#!\n\n#weak $partition_base_desc$#!"
 partition_base_desc:2 "#weak Khi kế vị, tất cả [titles|E] của [ruler|E] quá cố sẽ được chia cho các [eligible_children|E], trong đó [player_heir|E] luôn nhận [primary_title|E], [realm_capital|E] và các tước vị [de_jure|E] trực thuộc.\n\nNhững người con nhỏ hơn sẽ được trao các Tước vị bắt đầu từ cùng [rank|E] với Tước vị Chính; nếu không có sẽ nhận tước vị cấp thấp hơn. Người thừa kế của Ngài không thể được ban trước các Tước vị mà họ không có quyền thừa kế.\n#!"
 high_partition_succession_law:1 "Phân chia Cao"
 high_partition_succession_law_subname:0 "Mọi con cái đều thừa kế"
 high_partition_succession_law_effects:2 "\n#V Theo chế độ $high_partition_succession_law$ [succession], phần lớn [titles] sẽ thuộc về [player_heir] – phần còn lại chia cho các con khác.#!\n\n#weak $partition_base_desc$\nNgười thừa kế của Ngài sẽ #emp luôn#! nhận ít nhất một nửa số Tước vị của vị cai trị quá cố.\n#!"
 confederate_partition_succession_law:1 "Phân chia Liên bang"
 confederate_partition_succession_law_subname:0 "Mọi con cái thừa kế ngang nhau"
 confederate_partition_succession_law_effects:2 "\n#V Theo chế độ $confederate_partition_succession_law$, các [titles] sẽ được chia đều cho con cái. Có thể tạo Tước vị mới cho các [realm_heirs] nhỏ hơn.#!\n\n#weak $partition_base_desc$\nNếu đủ đất đai, các con nhỏ hơn sẽ được tạo Tước vị mới cho mình.\n\n#!#X Các nhà cai trị Bộ lạc bị khóa ở chế độ kế vị này.#!\n"
 single_heir_succession_law:4 "Trưởng nam thừa kế"
 single_heir_succession_law_subname:0 "Con cả thừa kế"
 single_heir_succession_law_effects:1 "\n#V Theo chế độ $single_heir_succession_law$ [succession], con cả của Ngài sẽ thừa kế toàn bộ [titles].#!\n\n#weak Khi kế vị, toàn bộ [titles|e] của người cai trị quá cố sẽ trao cho [player_heir|E], tức [eligible_child|E] lớn tuổi nhất. Các con nhỏ hơn sẽ không nhận gì.\n#!"
 single_heir_succession_law_youngest:4 "Út kế thừa"
 single_heir_succession_law_youngest_subname:0 "Con út thừa kế"
 single_heir_succession_law_youngest_effects:1 "\n#V Theo chế độ $single_heir_succession_law_youngest$ [succession], con út của Ngài sẽ thừa kế toàn bộ [titles].#!\n\n#weak Khi kế vị, toàn bộ [titles|e] của người cai trị quá cố sẽ trao cho [player_heir|E], tức [eligible_child|E] nhỏ tuổi nhất. Các con lớn hơn sẽ không nhận gì.\n#!"
 single_heir_dynasty_house:1 "Trưởng tộc Gia tộc"
 single_heir_dynasty_house_subname:0 "Thành viên [house] lớn tuổi nhất thừa kế"
 single_heir_dynasty_house_effects:1 "\n#V Theo chế độ $single_heir_dynasty_house$ [succession], thành viên lớn tuổi nhất của [house] sẽ thừa kế toàn bộ tước vị.#!\n\n#weak Khi kế vị, toàn bộ [titles|e] của người cai trị quá cố sẽ trao cho thành viên đủ điều kiện lớn tuổi nhất trong [house|E]. Con cái của Ngài sẽ không nhận gì trừ khi một trong số họ là người lớn tuổi nhất của Gia tộc.\n#!"
 same_faith_theocratic_succession_law:0 "Cùng Đức tin"
 same_faith_theocratic_succession_law_effects:0 "Chỉ những nhân vật cùng [faith|E] với [ruler|E] hiện tại mới có thể thừa kế."
 same_faith_only_law:0 "$same_faith_theocratic_succession_law$"
