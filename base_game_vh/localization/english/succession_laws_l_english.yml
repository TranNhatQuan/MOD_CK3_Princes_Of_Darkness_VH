 bishop_theocratic_succession_law:1 "Thần quyền"
 bishop_theocratic_succession_law_effects:0 "Khi kế vị, toàn bộ [titles|e] của [realm_priest_possessive|E] sẽ trao cho người kế nhiệm, được xác định theo giáo lý của [faith|E]."
