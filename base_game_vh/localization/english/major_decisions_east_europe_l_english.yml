l_english:
 
  east_europe.0001.t:1 "Người Tây Slavs Thống Nhất"
  east_europe.0001.desc:0 "Những bộ tộc cũ một lần nữa đoàn kết. Ta đã mang họ lại với nhau, giống như Samo đã làm cách đây nhiều thế kỷ. Đế chế của ông ta chết theo ông, nhưng ta chắc chắn [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ có một tương lai thịnh vượng. Đây chỉ mới là khởi đầu!"
  east_europe.0001.a:0 "Vinh quang cho [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

  east_europe.0002.desc:0 "Giống như Samo đã thống nhất các bộ tộc Wendish cách đây nhiều thế kỷ, [western_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)] đã tập hợp người Tây Slavs dưới một lá cờ. Liệu liên minh này có tồn tại qua thử thách của thời gian, hay sẽ sụp đổ như đế chế của Samo? Chỉ có [ROOT.Char.GetFaith.FateGodName] biết."

  east_europe.0005.t:0 "Người Nam Slavs Thống Nhất"
  east_europe.0005.desc:0 "Ta đã thống nhất các bộ tộc cũ dưới một lá cờ. Cùng nhau, chúng ta mạnh mẽ hơn bao giờ hết. Chúng ta sẽ không bị chinh phục! Chúng ta sẽ không bị xoá bỏ!"

  east_europe.0006.desc:0 "[southern_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã tập hợp người Nam Slavs dưới một lá cờ. Liệu liên minh này có tồn tại lâu dài, hay những mối thù và tập tục cũ sẽ xé tan nó? Chỉ có [ROOT.Char.GetFaith.FateGodName] biết."

  east_europe.0010.t:0 "Sự Ra Đời của Slavia"
  east_europe.0010.desc:0 "Ta đã làm điều không thể — vào ngày hôm nay, tất cả người Slavs đoàn kết dưới một lá cờ. Đế chế mới của ta trải dài từ trung tâm châu Âu ở phía Tây đến các vùng băng giá ở phía Đông!\n\nChỉ vài anh hùng trong lịch sử từng làm được điều này! Giờ ta là một trong số họ, và tên tuổi ta sẽ sống mãi."
  east_europe.0010.a:0 "Vinh quang cho Slavia!"

  east_europe.0011.desc:0 "[slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã làm điều không thể – [slav_uniter.GetSheHe] đã thống nhất tất cả người Slavs dưới một lá cờ. Liệu đế chế rộng lớn này có tiếp tục thịnh vượng, hay những mối thù và tập tục cũ sẽ xé tan nó? Chỉ có [ROOT.Char.GetFaith.FateGodName] biết."

  east_europe.0015.t:0 "Những Người Bảo Vệ [defender_of_highgod.GetFaith.HighGodName]"
  east_europe.0015.desc:0 "Đại sảnh Anh Hùng đã được xây dựng tại..."
  east_europe.0015.a:0 "... [target_list_member_a.GetNameNoTierNoTooltip]."
  east_europe.0015.b:0 "... [target_list_member_b.GetNameNoTierNoTooltip]."
  east_europe.0015.c:0 "... [target_list_member_c.GetNameNoTierNoTooltip]."
  east_europe.0015.d:0 "... [target_list_member_d.GetNameNoTierNoTooltip]."
  east_europe.0015.tooltip:0 "Nơi này nhận được [special_building|E] [GetBuilding('hall_of_heroes_01').GetName]"

  east_europe.0016.desc:1 "Dưới sự lãnh đạo của Ta, các tộc đã đoàn kết để dựng một đại sảnh chiến tranh tại [holy_site.GetNameNoTierNoTooltip]. Trong những bức tường đá dày, chúng ta chuẩn bị cho chiến tranh...\n\nTrong nhiều thế hệ, những kẻ xâm lược từ nước ngoài luôn nhòm ngó đất của chúng ta. Hãy đến đi, Ta nói! Hãy thử sức mạnh của họ với những anh hùng [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip] dũng cảm của chúng ta! Hãy để máu họ thấm vào đất và nhuộm đỏ các dòng sông!"
  east_europe.0016.a:1 "Chúc mừng [defender_of_highgod.GetFaith.WarGodName]!"

  east_europe.0017.desc:1 "[defender_of_highgod.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã thống nhất các tộc trong lãnh thổ của [defender_of_highgod.GetHerHis] để chống lại kẻ xâm lược. Một đại sảnh chiến tranh đã được xây dựng tại [holy_site.GetNameNoTierNoTooltip], nơi những anh hùng [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip] đầy tự hào đã tụ họp."


#HUNGARIAN DECISIONS
  east_europe.0030.t:0 "Khởi Đầu Mới"
  east_europe.0030.desc:0 "Bằng cách cho phép các thương nhân, nông dân và thợ thủ công kinh nghiệm từ các vùng Tây và Nam định cư, [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ sớm trở thành một trung tâm thương mại thịnh vượng và cuối cùng thoát khỏi gốc rễ bộ tộc của mình.\n\nHy vọng rằng những người định cư Kitô giáo mới này cũng sẽ giúp dẹp bỏ những kẻ ngoại giáo còn sót lại giữa thần dân của Ta và củng cố [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] như một lãnh thổ [scoped_ruler.GetFaith.GetAdjective] thực thụ."
  east_europe.0030.a:0 "Mọi người đều được chào đón!"
  east_europe.0031.t:0 "Những Người Định Cư Mới"
  east_europe.0031.desc.vassals:0 "[scoped_ruler.GetTitledFirstName] đã quyết định chào đón những người định cư nước ngoài từ các vùng lân cận theo đạo [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip].\n\n[scoped_ruler.GetSheHe|U] hy vọng những người mới này sẽ giúp dân số đất nước tăng nhanh hơn và thúc đẩy thương mại với các đồng minh."
  east_europe.0031.desc.others:1 "[scoped_ruler.GetTitledFirstName] đã quyết định chào đón những người định cư ngoại quốc từ các lãnh thổ [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] lân cận [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\n[scoped_ruler.GetSheHe|U] hy vọng rằng những người mới đến này sẽ giúp cư dân lấp đầy vùng đất của [scoped_ruler.GetHerHis] nhanh hơn và tăng cường giao thương với các đồng minh của [scoped_ruler.GetHerHis]."
  east_europe.0031.a:0 "Ừ thì, Ta không tin họ!"
  east_europe.0031.b:0 "Ta hiểu rồi..."

  east_europe.0032.t:0 "Nghi Lễ Cổ"
  east_europe.0032.desc:1 "Các bậc tiền nhiệm của Ta đã tiếp nhận [old_faith.GetNameNoTooltip] trong một nỗ lực sai lầm nhằm kéo [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] tiến vào thời hiện đại, nhưng điều đó chỉ mang đến nổi loạn, nghèo đói và xung đột.\n\nVới quyền lực trần tục và giáo hội khổng lồ mà Ta đang nắm giữ, Ta sẽ sửa sai này và đưa chúng ta trở lại đức tin thực sự của $magyar_pagan$.\n\nTuy nhiên, đây là một bước ngoặt, và mặc dù việc quay trở lại con đường Cổ là cần thiết, có lẽ cách giải thích chính xác của nó có thể được điều chỉnh đôi chút?"
  east_europe.0032.a:1 "Chúng ta trở lại Con Đường Cổ, trong sáng."
  east_europe.0032.b:0 "Có lẽ — chúng ta có thể giữ lại vài giáo lý mới..."
  east_europe.0032.c:0 "Đầu cho [ROOT.Char.GetFaith.WarGodName]!"
  east_europe.0032.d:0 "Sự trung thành cứng nhắc với truyền thống cũ, bất kể loại nào, là một điểm yếu."

  east_europe.0034.t:0 "Phục Hưng [scoped_ruler.GetFaith.GetAdherentNameNoTooltip]"
  east_europe.0034.desc.vassals:0 "Sau khi tích lũy sức mạnh gần như vô hạn trong lãnh thổ,"
  east_europe.0034.desc.outsiders:0 "Sau khi tích lũy sức mạnh gần như vô hạn trong [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip],"
  east_europe.0034.desc.intro:0 "[scoped_ruler.GetTitledFirstName] đã chứng tỏ bản thân [scoped_ruler.GetHerHim] là kẻ bội giáo!\n\nTrong một hành động thách thức công khai, [scoped_ruler.GetSheHe] đã từ bỏ [old_faith.HighGodName], tống khứ các [old_faith.PriestNeuterPlural] [old_faith.GetAdherentNameNoTooltip] cấp cao, và tước bỏ vị thế quốc giáo của [old_faith.GetNameNoTooltip]. Thậm chí ngay lúc này, nhiều [scoped_ruler.GetCulture.GetCollectiveNounNoTooltip] ở nông thôn đang đổ xô đi theo [scoped_ruler.GetHerHim].\n\n"
  east_europe.0034.desc.conversion_vanilla:0 "Mặc dù về mặt chính trị đã ngủ yên một thời gian, $magyar_pagan$ vẫn giữ nhiều tín đồ ở nông thôn, và [scoped_ruler.GetTitledFirstNameNoTooltip] không gặp khó khăn trong việc tái thiết Con Đường Cổ."
  east_europe.0034.desc.conversion_syncretic:0 "Mặc dù vậy, tôn giáo [scoped_ruler.GetFaith.GetAdherentNameNoTooltip] mới dường như vẫn giữ nhiều đặc điểm riêng biệt của [old_faith.GetNameNoTooltip], kết hợp rõ rệt Con Đường Cổ với điều Mới."
  east_europe.0034.desc.conversion_bloodthirsty:0 "Thậm chí tệ hơn, [scoped_ruler.GetTitledFirstNameNoTooltip] tuyên bố các vị thần giận dữ sẽ chỉ tha thứ cho sự yếu kém của người [scoped_ruler.GetCulture.GetNameNoTooltip] trong việc chuyển đổi nếu được dâng hiến thường xuyên các lễ vật người!"
  east_europe.0034.desc_conversion_adaptive:0 "Với nhiều thay đổi mà người [scoped_ruler.GetCulture.GetNameNoTooltip] và đức tin của họ đã trải qua trong vài thế kỷ qua, sự hồi sinh này của Con Đường Cổ dường như rất cởi mở và thực dụng."
  east_europe.0034.a:0 "Cuối cùng! Vinh quang cho [ROOT.Char.GetFaith.HighGodName]!"
  east_europe.0034.b:0 "Có lẽ là gió đang thổi về phía [scoped_ruler.GetFaith.HighGodName]..."
  east_europe.0034.c:0 "Cái ngoại giáo hèn hạ nào thế này!?"
  east_europe.0034.d:0 "Chuyện này không liên quan đến Ta."

#BOSNIAN DECISIONS
  east_europe.0101.t:0 "Vị [founder.GetTitleAsNameNoTooltip] đầu tiên của Toàn Bosnia"
  east_europe.0101.desc:0 "Bosnia núi non, hàng thế kỷ qua, luôn bị tung hứng giữa mọi thế lực chiến tranh ở Balkans. Người Slav từ Bắc và Nam, các lãnh chúa ngựa Carpathia thời đó, các hoàng đế Bulgaria hay Constantinople, thậm chí các hoàng tử-thương nhân Adriatic.\n\nTừ hôm nay, không còn nữa.\n\nVới lễ đăng quang của Ta, Bosnia là một vương quốc riêng, và sức mạnh cùng vinh quang đang chờ đón!"
  east_europe.0101.a:0 "Di sản của ta sẽ được nhớ đến hàng thế kỷ!"
  east_europe.0101.b:0 "[founder.GetFaith.HighGodName] phù hộ cho chúng ta!"
  east_europe.0101.c:0 "Thành thật mà nói, miễn là Ta là [founder.GetTitleAsNameNoTooltip] của #EMP đâu đó#!..."
  east_europe.0102.t:0 "$east_europe.0101.t$"
  east_europe.0102.desc:0 "Các sứ giả của Ta mang tin từ các thung lũng Dinaric Alps: rõ ràng, [founder.GetShortUIName] đã được tung hô là [founder.GetTitleAsNameNoTooltip] của [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nVới những thung lũng núi có thể phòng thủ và rừng rậm u tối ở cao nguyên Bosnia dưới quyền kiểm soát của [founder.GetHerHis], cùng sự ủng hộ của người dân địa phương, vương quốc của [founder.GetTitledFirstNamePossessiveNoTooltip] dường như được bảo đảm an toàn.\n\nTạm thời."
  east_europe.0102.a:0 "Một kẻ mới nổi đáng khinh, nhiều nhất là vậy."
  east_europe.0102.b:0 "Chúc mừng [founder.GetShortUINameNoTooltip]!"
  east_europe.0102.c:0 "Chúng ta sẽ xem điều này kéo dài được bao lâu..."

  east_europe.0111.t.setup:0 "Những Kẻ Dị Giáo Trong Chúng Ta"
  east_europe.0111.tt.announce_failure:0 "Nỗ lực buộc tội $bosnian_church$ dị giáo của Ngài thất bại!"
  east_europe.0111.tt.cancellation_cooldown:0 "$bosnian_church$ không thể bị buộc tội dị giáo lại trong [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_cancellation_cooldown_value')|0] năm"
  east_europe.0111.tt.regular_cooldown:0 "$bosnian_church$ không thể bị buộc tội dị giáo lại trong [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_failure_cooldown_value')|0] năm"
  east_europe.0111.tt.critical_cooldown:0 "$bosnian_church$ không thể bị buộc tội dị giáo lại trong [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_critical_failure_cooldown_value')|0] năm"
 #[EmptyScope.ScriptValue('vengeful_scheme_success_chance_modifier')|0]
  east_europe.0111.t:0 "$east_europe.0111.t.setup$: Viết cho [hof.GetTitledFirstNameNoTooltip]"
  east_europe.0111.desc:0 "Ai có thể nói được những kẻ tự xưng là [heretic.GetFaith.GetAdherentNamePluralNoTooltip] đã đi ngoài tầm mắt bao lâu rồi? Một thập kỷ? Một thế kỷ? Kể từ lần thăm của Thánh Martin được ban phước?\n\nDù dị giáo này đã tồn tại bao lâu trong hoang dã Bosnia, sự khoan dung của tổ tiên đã sinh ra trái đắng, và Ta không thể chịu nổi! Nhìn thấy một [heretic.Custom2('InsultNoun', ROOT.Char)] như [heretic.GetTitledFirstName] công khai khoe [accuser.GetFaith.HighGodName]!\n\nThế giới ngu dốt cho rằng họ cơ bản là người tốt, dù nông thôn, [accuser.GetFaith.GetAdherentNamePluralNoTooltip]. Có lẽ, chỉ với vài lời khéo léo gửi tới [hof.GetTitledFirstName], điều này không cần thiết phải như vậy..."
  east_europe.0111.a:0 "Mang cho ta [ROOT.Char.Custom('WritingInstrument')] và [ROOT.Char.Custom('GetWritingMaterial')]!"
  east_europe.0111.a.tt:0 "Một bức thư được viết ra"
  east_europe.0111.b:0 "Ta còn việc quan trọng hơn..."
  east_europe.0112.t:0 "[hof.Custom2('AppropriateGreeting',accuser)]"
  east_europe.0112.desc.intro:0 "Việc Ngài khăng khăng cho rằng [heretic.GetFaith.GetAdherentNamePluralNoTooltip] là dị giáo thật nực cười."
  east_europe.0112.desc.culture:0 "[accuser.GetTitledFirstName] là đồng hương của ta, còn ngài đơn giản là kẻ ngu muội không hiểu lề thói của chúng ta."
  east_europe.0112.desc.rival:0 "Thật tình, nếu #EMP ai đó#! có thể phạm dị giáo, thì đó chính là Ngài, kẻ [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))], [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))], [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))] [accuser.Custom2('InsultNoun', SCOPE.sC('hof'))]!"
  east_europe.0112.desc.sinful:0 "Tội lỗi của Ngài gần như không đếm xuể, vậy mà còn dám chỉ trích người khác?"
  east_europe.0112.desc.negative_opinion:0 "Có lẽ nếu Ta tôn trọng ý kiến của Ngài một chút, Ta sẽ xem trọng suy nghĩ đó. Thật tiếc, Ta không."
  east_europe.0112.desc.fallback:0 "Những cáo buộc vô lý này không xứng với một [accuser.GetWomanMan] của địa vị Ngài."
  east_europe.0112.desc.outro:0 "\n\nHy vọng đây sẽ là kết thúc vấn đề, và lần sau, Ngài nên suy nghĩ trước khi viết."
  east_europe.0112.a:0 "Kẻ mù quáng thật!"
  east_europe.0113.t:0 "[hof.Custom2('AppropriateGreeting',accuser)]"
  east_europe.0113.desc:0 "Lời của Ngài làm Ta rất lo lắng. Nghĩ mà xem, sự tha hóa sâu sắc như vậy lại có thể ẩn náu ngay gần trung tâm Kitô giáo!\n\nTa sẽ tham khảo ý kiến [heretic.GetTitledFirstNameNoTooltip], và xác định sự thật của vấn đề này."
  east_europe.0113.a:0 "Bánh xe công lý thần thánh đang quay!"
  east_europe.0113.a.tt:0 "[hof.GetTitledFirstNameNoTooltip] viết cho [heretic.GetTitledFirstNameNoTooltip]..."
  east_europe.0114.t:0 "$east_europe.0111.t.setup$: Tòa án [hof.GetFaith.GetAdjectiveNoTooltip]"
  east_europe.0114.desc:0 "Bức thư từ [hof.GetTitledFirstName] nằm trong tay Ngài run rẩy, dù Ngài không thể phân biệt sự run là do sợ hãi hay giận dữ: thông qua mưu mẹo của kẻ xảo quyệt [accuser.GetName], [hof.GetTitledFirstNameNoTooltip] đe dọa sẽ tuyên bố tất cả [heretic.GetFaith.GetAdherentNamePluralNoTooltip] là dị giáo!\n\nHành động khủng khiếp này chắc chắn sẽ khiến các Kitô hữu đồng đạo nổi giận, trừ khi Ngài có thể thuyết phục [hof.GetTitledFirstNameNoTooltip] khác đi.\n\nMột bức thư trả lời phải được soạn thảo."
  east_europe.0114.a:0 "Có lẽ một bài luận thần học tinh vi?"
  east_europe.0114.a.tt_success:0 "[hof.GetTitledFirstNameNoTooltip] đã bị thuyết phục"
  east_europe.0114.a.tt_success.tt:0 "Cáo buộc dị giáo đã được ngăn chặn!"
  east_europe.0114.a.tt_failure:0 "Lập luận của Ngài thất bại"
  east_europe.0114.a.tt_failure.tt:0 "Cáo buộc dị giáo vẫn đúng..."
  east_europe.0114.b:0 "Có lẽ chỉ cần một tờ nhắc nhở nhỏ..."
  east_europe.0114.b.tt:0 "[hof.GetTitledFirstName] sẽ bị buộc phải đứng về phía Ngài!"
  east_europe.0114.c:0 "Nếu [hof.GetSheHe] chỉ có thể thấy chuyện này theo chính trị..."
  east_europe.0114.c.tt_success:0 "Câu chuyện chuyển sang chính trị hoài nghi"
  east_europe.0114.c.tt_failure:0 "Lập luận vẫn mang tính thần học"
  east_europe.0114.d:0 "Chúng ta không thể chống lại Giáo hội rộng lớn: Ta #EMP phải#! cải đạo."
  east_europe.0114.d.tt:0 "Ngài sẽ phải quyết định cải đạo chân thành hay cơ hội"
  east_europe.0114.e:0 "Đức tin của chúng ta cũng hợp pháp như họ! Một bức thư thách thức!"
  east_europe.0114.e.tt:0 "[hof.GetTitledFirstName] chắc chắn sẽ tuyên bố $bosnian_church$ là dị giáo!"
  east_europe.0115.t:0 "$east_europe.0116.t$"
  east_europe.0115.desc.intro:0 "Đáng chết và nguyền rủa đôi mắt của [heretic.GetHerHis], [heretic.GetTitledFirstName] đã cải đạo!\n\n"
  east_europe.0115.desc.political:0 "Dù [hof.GetTitledFirstName] có vẻ hoàn toàn bị thuyết phục, ta thừa thấy đây chỉ là một động thái chính trị nửa vời: #EMP duy nhất#! [heretic.GetFirstNameNoTooltip] khẳng định lòng trung thành của [heretic.GetHerHis] đối với [hof.GetFaith.GetNameNoTooltip]. Không một chư hầu hay thành viên gia tộc nào sát cánh cùng [heretic.GetHerHim]."
  east_europe.0115.desc.wholehearted:0 "Hành động này có vẻ thành tâm, và [heretic.GetSheHe] đã đưa gia đình ruột thịt của [heretic.GetHerHis] cùng một vài quyền thần quan trọng đến với tín ngưỡng [hof.GetFaith.GetAdjective] cùng với [heretic.GetHerHim]. Điều đó gần như làm ta thêm tức giận."
  east_europe.0115.desc.outro:0 "\n\nHiện tại, vấn đề đã được giải quyết. Dị giáo hay không, [hof.GetTitledFirstNameNoTooltip] đã tin rằng $bosnian_church$ nằm gọn trong quyền kiểm soát của [hof.GetHerHis]."
  east_europe.0115.a:0 "Đồ ngu, Ta bỏ cuộc!"
  east_europe.0115.b:0 "Một khi là dị giáo, #EMP luôn luôn#! là dị giáo!"
  east_europe.0115.b.toast:0 "[accuser.GetShortUIName] Giận dữ vì Ngài lẩn tránh"
  east_europe.0116.t:0 "$east_europe.0111.t.setup$: Thay đổi Tâm Trí"
  east_europe.0116.desc:0 "[hof.GetTitledFirstName] yêu cầu một hành động hối lỗi trọn vẹn: một sự cải đạo, hoàn toàn đón nhận [hof.GetFaith.GetNameNoTooltip].\n\nTuy nhiên, Ta biết những người đồng đạo [heretic.GetFaith.GetAdherentNamePluralNoTooltip] rất kiên cường. Có lẽ, chỉ cần #EMP Ta#! cải đạo thôi, cũng đủ rồi.\n\nMặt khác, điều đó chỉ trì hoãn vấn đề. Có lẽ tốt nhất là chúng ta nên đón nhận thay đổi này ngay bây giờ, khi còn có thể hòa bình?"
  east_europe.0116.a:0 "Không, chỉ cần một cải đạo cá nhân là đủ."
  east_europe.0116.b:0 "Đủ rồi, tất cả chúng ta sẽ thành tín đồ [hof.GetFaith.GetAdherentNamePluralNoTooltip]!"
  east_europe.0117.t:0 "$east_europe.0111.t.setup$: Khoảng Thở Tạm Thời"
  east_europe.0117.desc.intro:0 "Thật tiếc, [hof.GetTitledFirstName] đã quyết định #EMP không#! lên án $bosnian_church$ là dị giáo.\n\n"
  east_europe.0117.desc.critical_success:0 "Điều tệ hơn, bằng cách nào đó, [heretic.GetTitledFirstName] đã thuyết phục [hof.GetFaith.ReligiousHeadName] ra lệnh truất phế Ta! Phép thuật đen hay bí mật nào dẫn đến điều này, chỉ có [heretic.GetFirstNameNoTooltip] biết, nhưng giờ tất cả các lãnh chúa Kitô đều nhìn Ta với vẻ khinh bỉ dành cho kẻ ngoại đạo và ly giáo."
  east_europe.0117.desc.theological_debate:0 "Vài tuần tranh luận học thuật căng thẳng giữa [hof.GetHerHim] và [heretic.GetTitledFirstName] đã khiến [hof.GetFaith.ReligiousHeadName] dần nghiêng về cách nghĩ của [heretic.GetFirstNamePossessiveNoTooltip], đồng ý rằng [heretic.GetFaith.GetAdherentNamePluralNoTooltip] chỉ là [hof.GetFaith.GetAdherentNamePluralNoTooltip] hơi lạc hậu."
  east_europe.0117.desc.political_leverage:0 "Tình huống xung quanh vấn đề này ít nhất cũng đáng nghi, khi kết quả của các thẩm tra viên gửi tới [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] vừa công khai vừa đầy sức nặng. Có vẻ một yếu tố #EMP khác#! đã làm thay đổi suy nghĩ của [hof.GetFaith.ReligiousHeadName]."
  east_europe.0117.desc.political_manoeuvrings:0 "Vài tuần viết thư căng thẳng, bằng chứng giả mạo, và hối lộ các thẩm tra viên điều tra [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] đã khiến [hof.GetFaith.ReligiousHeadName] tin rằng cáo buộc của Ta chỉ vì lợi ích chính trị, và cáo buộc hoàn toàn không có thật."
  east_europe.0117.desc.outro:0 "\n\nHiện tại, các dị giáo đã mua được cho mình chút thời gian thở. Những [hof.GetFaith.ReligiousHeadName] tương lai có thể sẽ không nhìn họ dễ dãi như vậy..."
  east_europe.0117.a:0 "Đồ lãng phí thời gian và công sức."
  east_europe.0117.b:0 "Quá bất công!"
  east_europe.0117.c:0 "[accuser.GetFaith.HighGodName] có thể tha thứ, nhưng Ta thì không!"
  east_europe.0117.c.toast:0 "$east_europe.0115.b.toast$"
  east_europe.0117.d:0 "Từ chối #EMP Ta#! rước lễ? Vậy Ta sẽ lập một nhà thờ #EMP nguyền rủa#! của riêng mình!"
  east_europe.0118.t:0 "$east_europe.0111.t.setup$: Khoảng Thở"
  east_europe.0118.desc.intro:0 "Phải mất vài tuần thương lượng và những lá thư được soạn kỹ, nhưng cuối cùng, [hof.GetTitledFirstName] đã đồng ý với quan điểm của Ta.\n\n"
  east_europe.0118.desc.critical_success:0 "Thực tế, với việc vận dụng ảnh hưởng khá quá mức của Ta lên [hof.GetFaith.ReligiousHeadTitleName], Ta thậm chí đã lật ngược tình thế đối với kẻ [accuser.Custom2('InsultAdjective', ROOT.Char)] [accuser.GetTitledFirstName].\n\nVì những cáo buộc vô lý của [accuser.GetHerHis] đối với các Kitô hữu trung thành, [hof.GetTitledFirstNameNoTooltip] đã đồng ý truất phế [accuser.GetHerHim]!"
  east_europe.0118.desc.theological_debate:0 "Dù [hof.GetFaith.ReligiousHeadTitleName] vẫn coi chúng ta là những kẻ lạc hậu, họ thừa nhận rằng, dù sai lạc, chúng ta không phải dị giáo."
  east_europe.0118.desc.political_leverage:0 "Toàn bộ sự kiện đã làm Ta mất đi chút ảnh hưởng với [hof.GetFaith.ReligiousHeadTitleName], nhưng [hof.GetTitledFirstNameNoTooltip] miễn cưỡng đồng ý rằng chúng ta không phải dị giáo, chỉ là chưa học hỏi đủ."
  east_europe.0118.desc.political_manoeuvrings:0 "Quá trình này không thiếu những cáo buộc trả đũa, thư giả từ [accuser.GetTitledFirstName], và hối lộ khéo léo các thẩm tra viên, nhưng [hof.GetFaith.ReligiousHeadTitleName] đã chính thức tuyên bố chúng ta vô tội và toàn bộ vụ việc chỉ là chuyện địa phương."
  east_europe.0118.desc.outro:0 "\n\nCác tín đồ [heretic.GetFaith.GetAdherentNamePluralNoTooltip] trên khắp nơi có thể thở phào nhẹ nhõm."
  east_europe.0118.a:0 "[heretic.GetFaith.FateGodName] mỉm cười với chúng ta!"
  east_europe.0118.b:0 "Ta chỉ mừng rằng vấn đề này chắc chắn đã được giải quyết."
  east_europe.0119.t:0 "$east_europe.0111.t.setup$: Tước Khoan Dung"
  east_europe.0119.desc.intro:0 "Dự đoán được, ngay khi [hof.GetSheHe] bắt đầu xem xét vấn đề nghiêm túc, [hof.GetTitledFirstName] đã phát hiện #EMP đủ#! bằng chứng về dị giáo trong số [heretic.GetFaith.GetAdherentNamePluralNoTooltip].\n\n"
  east_europe.0119.desc.theological_debate:0 "[heretic.GetTitledFirstName], dĩ nhiên, đã cố tìm cách luồn lách để thoát tội, nhưng [hof.GetFaith.ReligiousHeadName] đã bác bỏ những lý lẽ thần học rẻ tiền của [heretic.GetHerHis] bằng sự chế nhạo."
  east_europe.0119.desc.political_manoeuvrings:0 "[heretic.GetTitledFirstName] cố gắng đổ lỗi bức thư của Ta là xuất phát từ lợi ích cá nhân, nhưng chiêu chính trị thô thiển này không được [hof.GetFaith.ReligiousHeadName] cảm thông, người cho rằng đó chỉ là né tránh vấn đề."
  east_europe.0119.desc.unrepentant_heretics:0 "Khi đối diện, [heretic.GetTitledFirstName] không che giấu sự khinh bỉ [heretic.GetHerHis] dành cho [hof.GetFaith.ReligiousHeadTitleName], công khai chế nhạo [hof.GetFaith.ReligiousHeadName] trong khi bảo vệ tính hợp pháp của đức tin trụy lạc của [heretic.GetHerHis]!"
  east_europe.0119.desc.outro:0 "\n\nCác bức thư chính thức đã được gửi tới tất cả các Kitô hữu gần đó thuộc mọi giáo phái, lên án [heretic.GetFirstNameNoTooltip] và đức tin blasphemy của [heretic.GetHerHis]."
  east_europe.0119.a:0 "Được minh chứng!"
  east_europe.0120.t:0 "[hof.Custom2('AppropriateGreeting',heretic)]"
  east_europe.0120.desc.intro:0 "Ta đau lòng thông báo rằng Ta thấy đức tin của Ngài cực kỳ sai lệch, và không phải, như Ta mong, chỉ là lạc hậu và có thể sửa chữa được.\n\n"
  east_europe.0120.desc.theological_debate:0 "Những lời biện minh lủng củng của Ngài rơi vào tai điếc. Những lập luận thần học vô căn cứ này chỉ #EMP chứng minh#! tội lỗi của Ngài, và Ta không thể chịu đựng sự sai trái như vậy."
  east_europe.0120.desc.political_manoeuvrings:0 "Những nỗ lực của Ngài cho rằng đây chỉ là một động thái chính trị vô cảm rõ ràng là những lời dối trá tuyệt vọng của một dị giáo, và Ta sẽ không chấp nhận việc chất vấn động cơ của các tín đồ [hof.GetFaith.GetAdherentNamePluralNoTooltip] tốt lành."
  east_europe.0120.desc.unrepentant_heretics:0 "Việc Ngài thừa nhận tội lỗi một cách công khai làm Ta bối rối và buồn bã, vì nó cho thấy không còn cơ hội cứu rỗi cho Ngài. Ta cầu nguyện cho linh hồn lạc lõng của những thần dân đã mất, nhưng cần phải làm."
  east_europe.0120.desc.outro:0 "\n\nTừ ngày hôm nay trở đi, [heretic.GetFaith.GetAdherentNamePluralNoTooltip] sẽ bị coi là dị giáo bởi tất cả Kitô hữu chính thống. Nguyện sự hôi thối của Ngài mục nát trong địa ngục!"
  east_europe.0120.a:0 "Thật thảm họa!"
  east_europe.0120.a.tt:0 "Các tín đồ [hof.GetFaith.GetAdherentNameNoTooltip] đói khát hướng về vùng đất của Ngài..."
  east_europe.0121.t:0 "$east_europe.0119.t$"
  east_europe.0121.desc.intro:0 "Vài tuần gần đây đã chứng kiến một cuộc chiến lời lẽ dữ dội ba bên giữa [accuser.GetFullName], [heretic.GetFullName], và [hof.GetTitledFirstName] về tình trạng đại kết của $bosnian_church$.\n\n"
  east_europe.0121.desc.theological_debate:0 "Phần lớn cuộc thảo luận mang tính thần học, với [heretic.GetFirstNameNoTooltip] cố gắng trấn an [hof.GetTitledFirstNameNoTooltip] rằng [heretic.GetFaith.GetAdherentNamePluralNoTooltip] là những tín đồ tốt [hof.GetFaith.GetAdherentNamePluralNoTooltip], chỉ hơi nông thôn trong phong cách.\n\nĐáng tiếc cho [heretic.GetHerHim], điều này không thành công."
  east_europe.0121.desc.political_manoeuvrings:0 "Dù [heretic.GetFirstNameNoTooltip] nỗ lực vẽ cáo buộc của [accuser.GetFirstNamePossessiveNoTooltip] như một mưu đồ chính trị, [hof.GetFaith.ReligiousHeadName] vẫn đứng về phía chống lại [heretic.GetHerHim].\n\n"
  east_europe.0121.desc.unrepentant_heretics:0 "Cuối cùng, có vẻ như vị thế của [heretic.GetFirstNamePossessiveNoTooltip] đã bị định sẵn từ đầu, khi [heretic.GetSheHe] thừa nhận cáo buộc dị giáo trong khi cố gắng chứng minh đức tin của [heretic.GetHerHis] vẫn hợp pháp.\n\n"
  east_europe.0121.desc.outro:0 "Theo sắc lệnh của [hof.GetTitledFirstNameNoTooltip], [heretic.GetFaith.GetAdherentNamePluralNoTooltip] từ nay được xem là dị giáo đối với tất cả Kitô hữu đại kết!"
  east_europe.0121.a:0 "Dị giáo? Ngay giữa chúng ta?!"
  east_europe.0121.b:0 "Ta thật sự không quan tâm."
  east_europe.0121.c:0 "Chúng Ta chỉ muốn được yên thôi!"
  east_europe.0123.t:0 "$east_europe.0124.t$"
  east_europe.0123.desc.intro:0 "$east_europe.0124.desc.intro$"
  east_europe.0123.desc.hof_died:0 "Với cái chết của [hof.GetTitledFirstName], lực lượng giáo hội thúc đẩy cuộc điều tra dị giáo tại [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] đã biến mất."
  east_europe.0123.desc.heretic_died:0 "Với cái chết của [heretic.GetTitledFirstName], [hof.GetTitledFirstName] dường như hài lòng rằng mọi dị giáo đáng kể cũng đã chấm dứt, và cuộc điều tra tại [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] đã bị rút lại."
  east_europe.0123.desc.hof_no_longer_hof:0 "$east_europe.0124.desc.hof_no_longer_hof$"
  east_europe.0123.desc.heretic_not_independent_ruler:0 "Vì [heretic.GetTitledFirstName] không còn là một quyền lực Kitô độc lập, [hof.GetTitledFirstName] không còn xem [heretic.GetHerHim] là đáng để điều tra như một nguồn gốc dị giáo."
  east_europe.0123.desc.heretic_now_ecumenical_christian:0 "Với việc [heretic.GetTitledFirstNamePossessive] cải đạo sang [heretic.GetFaith.GetName], [hof.GetTitledFirstName] đã tin tưởng vào lòng sùng đạo chân thành của [heretic.GetHerHis] đối với [hof.GetFaith.HighGodName]."
  east_europe.0123.desc.heretic_now_different_heresy:0 "Với việc [heretic.GetTitledFirstNamePossessive] cải đạo sang [heretic.GetFaith.GetName], vấn đề dị giáo chuyển từ 'liệu có' sang 'dạng nào': các thẩm tra viên của [hof.GetFaith.ReligiousHeadName] không thể điều tra dị giáo trong vùng đất do một dị giáo cai trị công khai."
  east_europe.0123.desc.heretic_now_infidel:0 "Với việc [heretic.GetTitledFirstNamePossessive] cải đạo sang [heretic.GetFaith.GetName], [heretic.GetSheHe] đã chuyển từ tiềm năng dị giáo sang chắc chắn ngoại đạo. Không cần phải nói, các thẩm tra viên của [hof.GetFaith.ReligiousHeadName] đã bị đuổi thẳng khỏi [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  east_europe.0123.desc.heretic_now_heathen:0 "Với việc [heretic.GetTitledFirstNamePossessive] cải đạo sang [heretic.GetFaith.GetName], [heretic.GetSheHe] đã chuyển từ tiềm năng dị giáo sang ngoại đạo công khai. Sau cú tát lộ liễu vào mặt [hof.GetFaith.HighGodNamePossessive], tình trạng đại kết của $bosnian_church$ có vẻ không còn quan trọng."
  east_europe.0123.desc.fallback:0 "$east_europe.0124.desc.fallback$"
  east_europe.0123.desc.outro:0 "$east_europe.0124.desc.outro$"
  east_europe.0123.a:0 "Chẳng lẽ mọi chuyện lại kết thúc thế này!"
  east_europe.0124.t:0 "$east_europe.0111.t.setup$: Vụ Việc Lung Lay"
  east_europe.0124.desc.intro:0 "Có vẻ vận may đang đứng về phía $bosnian_church_adherent_plural$.\n\n"
  east_europe.0124.desc.hof_died:0 "Sau cái chết của [hof.GetTitledFirstName], cuộc điều tra dị giáo tại [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] đã tan rã, nhiều quan chức giáo hội quan trọng bị triệu hồi để lo việc kế vị giáo hội."
  east_europe.0124.desc.heretic_died:0 "Sau cái chết của [heretic.GetTitledFirstName], [hof.GetTitledFirstName] dường như hài lòng rằng mọi sai lệch lớn trong số $bosnian_church_adherent_plural$ sẽ sớm biến mất, vì kẻ bị nghi là dị giáo chắc chắn đã qua đời và đi tới [hof.GetFaith.NegativeAfterLife|U]."
  east_europe.0124.desc.hof_no_longer_hof:0 "Với việc loại bỏ cựu-[absolute_faith.ReligiousHeadName] [hof.GetFirstName], hỗn loạn bao trùm cuộc điều tra tại [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip], và mọi cơ hội cho một phán quyết hữu ích đã biến mất."
  east_europe.0124.desc.heretic_not_independent_ruler:1 "Giờ đây khi [Select_CString(heretic.IsLocalPlayer,'ta',heretic.GetShortUIName)][Select_CString(heretic.IsLocalPlayer,'',' đã')] không còn là một quân vương Cơ Đốc giáo độc lập, [hof.GetTitledFirstName] không còn thấy [Select_CString(heretic.IsLocalPlayer,'ta','họ')] đáng để điều tra nữa."
  east_europe.0124.desc.heretic_now_ecumenical_christian:0 "Với việc Ta vừa cải đạo sang [heretic.GetFaith.GetName], [hof.GetTitledFirstName] không còn lý do nào để nghi ngờ đức tin của Ta vào [hof.GetFaith.HighGodName]."
  east_europe.0124.desc.heretic_now_different_heresy:0 "Với việc ta vừa cải đạo sang [heretic.GetFaith.GetName], [hof.GetTitledFirstName] #EMP vốn đã#! xem ta là một kẻ dị giáo, và đang quá bận rộn lên án sự vô tín hèn hạ của ta để có thể nghiêm túc hậu thuẫn cho tòa án dị giáo của [hof.GetHerHis] đi điều tra những mầm mống dị giáo nhỏ nhặt hơn."
  east_europe.0124.desc.heretic_now_infidel:0 "Với việc Ta vừa cải đạo sang [heretic.GetFaith.GetName], [hof.GetTitledFirstName] đã tuyên bố Ta là một [hof.Custom('GetDerogatoryNonbeliever')] và kẻ phản bội trước mặt [hof.GetFaith.HighGodName]. Những tội tiềm năng của $bosnian_church_adherent_plural$ chắc chắn trở nên nhỏ bé so với Ta."
  east_europe.0124.desc.heretic_now_heathen:0 "Với việc Ta vừa cải đạo sang [heretic.GetFaith.GetName], [hof.GetTitledFirstName] đã tuyên bố Ta là [hof.Custom('GetDerogatoryNonbeliever')] vô hồn và là kẻ phản đạo tồi tệ nhất. Nếu Ta còn quan tâm đến thần chết của [hof.GetHerHis], có lẽ Ta sẽ hơi tổn thương."
  east_europe.0124.desc.fallback:0 "Những biến cố ngoài tầm kiểm soát đã ngăn chặn mọi cơ hội thành công cho cuộc điều tra tại [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  east_europe.0124.desc.outro:0 "\n\nHiện tại, [absolute_faith.ReligiousHeadTitleName] đã bỏ vụ việc, khẳng định còn nhiều chuyện cấp bách hơn để lo."
  east_europe.0124.a:0 "Chà, ít nhất thì chuyện đó cũng xong."

  east_europe.0141.t:0 "Hơi Thở Cuối Cùng của Cuộc Di Cư Lớn"
  east_europe.0141.desc:0 "Cuộc sống trên thảo nguyên vốn đã khắc nghiệt. Gần đây, nó còn trở nên tồi tệ hơn, khi nhiều bộ lạc du mục ganh tỵ tìm cách đàn áp chúng ta vì thành công của mình. Người Pecheneg, Khazar, và nhiều bộ tộc khác từ xa đến quấy rối liên minh của chúng ta.\n\nTrong những thế kỷ trước, cả các dân tộc đã rời bỏ mảnh đất này để đến các cánh đồng màu mỡ và vương quốc yếu ớt của châu Âu.\n\nNgày nay, Ta quyết định noi theo thành công của những du mục xưa, và tạo lập một quê hương mới cho $mogyer_collective_noun$ ở vùng Pannonia xa xôi, di dời toàn bộ lãnh thổ của Ta trong quá trình này.\n\nChẳng bao lâu, chúng ta sẽ băng qua Carpathian như một khối, và mở ra một chương mới cho dân tộc mình."
  east_europe.0141.a:0 "Đến Pannonia!"
  east_europe.0141.a.tt:0 "Ngài có thể sử dụng [hungarian_invasion_casus_belli|E] chỉ một lần đối với bất kỳ lãnh chúa nào ở Pannonia"
  east_europe.0142.t:0 "$east_europe.0141.t$"
  east_europe.0142.desc:0 "Trong một động thái đầy bất ngờ, chư hầu của ta, [mogyer_invader.GetShortUIName], đã phái sứ giả thông báo rằng [mogyer_invader.GetSheHe] mưu tính đưa người dân của [mogyer_invader.GetHerHis] rời khỏi lãnh thổ hiện tại của [mogyer_invader.GetHerHis] và di cư toàn bộ đến Pannonia.\n\nNếu việc này thành công, quyền kiểm soát của ta trong khu vực có khả năng sẽ tan rã."
  east_europe.0142.a:0 "Một việc làm liều lĩnh!"
  east_europe.0142.a.tt:0 "Dân $mogyer_collective_noun$ bắt đầu [hungarian_invasion|E]"
  east_europe.0143.t:0 "$east_europe.0141.t$"
  east_europe.0143.desc.pannonian_capital:0 "Tin xấu từ thảo nguyên! Thương nhân và gián điệp mang tin"
  east_europe.0143.desc.pannonian_territory:0 "Tin lo ngại từ thảo nguyên! Các lãnh chúa địa phương cho biết"
  east_europe.0143.desc.fallback:0 "Tin xấu từ thảo nguyên! Các chư hầu lo lắng đã gửi báo cáo"
  east_europe.0143.desc.outro:0 "rằng [mogyer_invader.GetShortUIName], một thủ lĩnh $mogyer$, đang tập hợp toàn bộ lực lượng [mogyer_invader.GetHerHis] để mở một cuộc xâm lược toàn diện Pannonia.\n\nNgay cả bây giờ, các đạo quân $mogyer$ đang tập hợp, chuẩn bị tràn xuống đồng bằng trên những chiến mã quỷ và đảo lộn toàn bộ trật tự địa phương!"
  east_europe.0143.a:0 "Chắc chắn họ không thể vượt qua dãy Carpathian chứ?"
  east_europe.0143.a.tt:0 "$east_europe.0142.a.tt$"

#LIVONIAN DECISIONS
  east_europe.0200.t:0 "Người [founder.GetTitleAsNameNoTooltip] của Livonia"
  east_europe.0200.desc.christian:1 "Vùng Baltic đã nhiều thế kỷ sống nguyên sơ và hoang dã, chỉ là nơi cư trú của các tín ngưỡng dị giáo và kẻ thờ quỷ. Với lễ đăng quang của [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] [founder.GetTitleAsNameNoTooltip] của Livonia, quyền năng của [founder.GetFaith.HighGodName] làm ấm vùng đất lạnh lẽo, ẩm ướt này.\n\nVới sứ mệnh [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] thành công ở Baltic, Ta tự do tuyên bố Livonia; một tước hiệu để thống nhất toàn bộ Baltic dưới sứ mệnh chung truyền bá lời của [founder.GetFaith.random_GoodGodNames]."
  east_europe.0200.desc.nonchristian:1 "Người Baltic nhiều thế kỷ không có vương quốc cho riêng mình, trong khi Viking tàn phá làng mạc ven biển và các nhà truyền giáo nước ngoài coi chúng ta nguyên thủy và hoang dã — nhưng giờ đã khác. Các dân tộc Baltic phân tán giờ quỳ gối cùng nhau trước vương miện Livonia.\n\nVới lễ đăng quang của Ta là [founder.GetTitleAsNameNoTooltip], Ta sẽ mở ra một thời đại vàng không chỉ cho người [founder.GetCulture.GetName], mà cho toàn bộ Baltic ven biển."
  east_europe.0200.desc.outro:0 "\n\nTa nắm vận mệnh Baltic trong tay, và với nền móng của Vương quốc này, Ta sẽ mở ra một thời đại vàng mới của đức tin và vinh quang dưới [founder.GetFaith.HighGodName]."
  east_europe.0200.a:0 "Di sản của Ta sẽ tồn tại sau khi Ta qua đời!"
  east_europe.0200.b:0 "Vì [founder.GetFaith.HighGodName] và vinh quang!"
 
  east_europe.0201.t:0 "$east_europe.0101.t$"
  east_europe.0201.desc:0 "Các sứ giả mang tin từ bờ biển lạnh lẽo của Livonia: [founder.GetShortUIName] đã được tuyên bố là [founder.GetTitleAsNameNoTooltip] của [founder.GetPrimaryTitle.GetNameNoTier].\n\nVới toàn bộ Baltic giờ thống nhất dưới một biểu ngữ, dường như người Livonia cuối cùng cũng có một bản sắc thống nhất để hướng về, không còn phân tán và bối rối trong việc bảo vệ quê hương.\n\nVới hành động thống nhất này, Livonia có vẻ nằm trong tay an toàn… ít nhất là hiện tại."
  east_europe.0201.a:0 "Họ vẫn là man di."
  east_europe.0201.b:0 "Chào mừng [founder.GetShortUINameNoTooltip]!"
  east_europe.0201.c:0 "Thống nhất hay chia rẽ, người Baltic không thể tồn tại lâu."
