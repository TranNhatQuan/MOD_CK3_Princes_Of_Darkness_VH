l_english:
  dynasty_interaction_header:1 "[dynast_interaction|E]\n"
  disinherit_interaction:0 "Tước quyền thừa kế"
  disinherit_interaction_desc:0 "$dynasty_interaction_header$Loại bỏ [recipient.GetShortUINameNoTooltip] khỏi [line_of_succession|E]"
  disinherit_interaction_notification:0 "Thành viên Gia tộc bị tước quyền thừa kế"
  courtly_vassal_disapproves_disinheriting:0 "Mọi [vassal|E] ([actor.MakeScope.ScriptValue('number_of_courtly_vassals')|V0]) theo lập trường [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] đều mất #N 20#! [opinion|E] đối với [actor.GetShortUIName] trong #V 10 năm#! #weak (Phản đối việc tước quyền thừa kế của người thừa kế không tranh chấp)#!"


  restore_inheritance_interaction:0 "Khôi phục quyền thừa kế"
  restore_inheritance_interaction_desc:0 "$dynasty_interaction_header$Khôi phục [recipient.GetShortUINameNoTooltip] vào [line_of_succession|E] chính thống\n\n#weak Điều này khả dụng vì [recipient.GetSheHe] đã bị [disinherited|E]#!"
  restore_inheritance_interaction_notification:0 "Đã khôi phục quyền thừa kế"

  denounce_interaction:0 "Lên án"
  denounce_interaction_desc:0 "$dynasty_interaction_header$[denounce|E] [recipient.GetShortUINameNoTooltip]\n\n#weak Điều này sẽ cho tất cả thành viên trong [dynasty|E] của chúng ta một [imprisonment_reason|E] đối với [recipient.GetHerHim]#!"
  denounce_interaction_notification:0 "Đã lên án thành viên Gia tộc"

  forgive_interaction:0 "Tha thứ"
  denounced_change_to_forgiven:0 "[opinion|E] #V $denounced_opinion$#! #weak (-50)#! chuyển thành #V $forgave_denounced_opinion$#! #weak (-25)#! (#P +25#! [opinion|E])"
  forgiven_changed_to_denounced:0 "[opinion|E] #V $forgave_denounced_opinion$#! #weak (-25)#! chuyển thành #V $denounced_opinion$#! #weak (-50)#! (#N -25#! [opinion|E])"
  forgive_interaction_desc:0 "$dynasty_interaction_header$Thu hồi việc [denouncement|E] đối với [recipient.GetShortUINameNoTooltip]"
  forgive_interaction_notification:0 "Đã tha thứ cho thành viên Gia tộc"

  call_dynasty_member_to_war_interaction:0 "Gọi thành viên Gia tộc tham chiến"
  call_dynasty_member_to_war_interaction_desc:0 "Gọi [recipient.GetShortUINameNoTooltip] phục vụ [dynasty|E] của [recipient.GetHerHis] trong chiến tranh"
  call_dynasty_member_to_war_interaction_extra_icon:0 "$hook_extra_icon$"

  dynast_legitimize_bastard_interaction:1 "Hợp pháp hóa con hoang #weak (Gia tộc)#!"
  dynast_legitimize_bastard_interaction_desc:2 "$dynasty_interaction_header$Tuyên bố [recipient.GetShortUINameNoTooltip] là một $game_concept_legitimized_bastard$\n\n#weak Điều này khả dụng vì [recipient.GetSheHe] là một [bastard|E] thuộc [dynasty|E] của ta#!"
  dynast_legitimize_bastard_interaction_notification:0 "Đã hợp pháp hóa con hoang"

  dynast_claim_title_interaction:0 "Đòi danh hiệu"
  dynast_claim_title_interaction_desc:0 "$dynasty_interaction_header$[claim|EU] một [title|E] do [recipient.GetShortUINameNoTooltip] nắm giữ cho bản thân"
  dynast_claim_title_interaction_notification:0 "Đã đòi danh hiệu"
  ALREADY_HAVE_CLAIM_ON_THIS_TITLE:0 "Ngài đã có quyền đòi danh hiệu này"
  ALREADY_HAVE_CLAIMS_ON_ALL_TITLES:1 "Ngài đã có quyền đòi tất cả các danh hiệu của [TARGET_CHARACTER.GetShortUINamePossessive]"

  dynast_end_dynasty_wars_interaction:0 "Chấm dứt chiến tranh Gia tộc"
  dynast_end_dynasty_wars_interaction_desc:0 "$dynasty_interaction_header$Yêu cầu [recipient.GetShortUINameNoTooltip] lập tức chấm dứt mọi cuộc chiến tranh tấn công chống lại bất kỳ thành viên nào khác trong [dynasty|E] của chúng ta"
  dynast_end_dynasty_wars_interaction_notification:0 "Đã chấm dứt chiến tranh Gia tộc"

  recipient_secondary_legitimize_bastard_interaction:0 "Con hoang"

  send_to_varangian_guard_interaction:0 "Gửi đến Đội Cận vệ Varangian #weak (Gia tộc)#!"
  send_to_varangian_guard_interaction_desc:0 "$dynasty_interaction_header$Gửi [recipient.GetShortUINameNoTooltip] đi để giành vinh quang và tài sản trong Đội Cận vệ Varangian. Ai mà biết được, có khi còn giúp rèn giũa nhân cách!"
  send_to_varangian_guard_interaction_toast:1 "[recipient.GetShortUIName] đã lên đường tới Đội Cận vệ Varangian"
  send_to_varangian_guard_interaction_toast_desc:0 "Danh tiếng và vinh quang đang chờ đợi!"
