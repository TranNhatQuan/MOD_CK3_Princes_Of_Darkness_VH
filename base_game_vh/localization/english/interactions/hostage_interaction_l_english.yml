  char_interaction.0300.desc: "Ta không thấy có lợi ích gì khi nhận [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] của ngươi, [secondary_actor.GetFirstName], làm con tin vào lúc này."
  char_interaction.0300.a: "Ra là vậy sao?"
  char_interaction.0301.desc: "Ta chỉ có thể từ chối yêu cầu thô lỗ của ngươi về việc nhận [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] của ta, [secondary_recipient.GetFirstName], làm con tin."
  char_interaction.0301.a: "Thật ngu xuẩn."
  char_interaction.0311.desc: "Xin hãy chấm dứt những nỗ lực hòa giải giữa chúng ta; hiện tại ta không thể đồng ý trao đổi con tin với ngươi."
  char_interaction.0311.a: "Tùy ngươi."
  char_interaction.0320.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient )]"
  char_interaction.0320.desc: "Ta không tìm thấy lý do nào để tiếp tục giữ [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] của ngươi, [secondary_recipient.GetFirstName], làm con tin của [actor.GetPrimaryTitle.GetAdjectiveNoTooltip] nữa."
  char_interaction.0320.a: "[secondary_recipient.GetSheHe|U] đã trở về!"
  char_interaction.0330.desc: "Ta sẵn lòng nhận [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ngươi, [hostage.GetFirstName], làm con tin.\n\nTa mong chờ [hostage.GetHerHis] đến [hostage_taker.GetCapitalLocation.GetNameNoTooltip]."
  char_interaction.0330.a: "Rất tốt."
  char_interaction.0331.desc: "Ta không còn lựa chọn nào khác ngoài việc chấp nhận yêu cầu của ngươi, nhận [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], làm con tin.\n\n[hostage.GetSheHe|U] sẽ lập tức lên đường tới [hostage_taker.GetCapitalLocation.GetNameNoTooltip]."
  char_interaction.0331.a: "Tuyệt vời."
  char_interaction.0332.desc: "Ta buộc phải chấp nhận đề nghị trao đổi con tin của ngươi: [hostage_sender_2.Custom2('RelationToMeShort', SCOPE.sC('hostage_2'))] của ta, [hostage_2.GetTitledFirstName], và [hostage_sender_1.Custom2('RelationToMeShort', SCOPE.sC('hostage_1'))] của ngươi, [hostage_1.GetTitledFirstName]."
  char_interaction.0332.a: "Hoàn hảo."
  char_interaction.0340.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
  char_interaction.0340.desc: "Ta chấp nhận yêu cầu trả lại [home_court.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ngươi, [hostage.GetFirstNamePossessive].\n\nTa tin rằng điều này sẽ không làm tổn hại mối quan hệ giữa chúng ta."
  char_interaction.0340.a: "Tạ ơn [ROOT.Char.GetFaith.HighGodNameAlternate]."
  char_interaction.0341.desc: "E rằng ta vẫn phải giữ [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] của ngươi, [secondary_recipient.GetFirstName], tại [recipient.GetCapitalLocation.GetNameNoTooltip] thêm một thời gian nữa."
