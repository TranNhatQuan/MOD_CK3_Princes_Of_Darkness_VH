  action_should_pay_ransom_combined_group_name:0 "$action_should_pay_ransom_combined_group_label$"
  action_should_pay_ransom_desc:0 "[actor.Custom2('RelationToMe', secondary_recipient)] của ngài, [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUIName] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], đang bị giam cầm trong [secondary_recipient.Custom('PrisonTypeModifier')]. Nếu không cứu kịp thời, kẻ đó có thể lâm bệnh hoặc bị [executed|E]. Ngài nên cân nhắc chuộc lại kẻ đó để bảo toàn [health|E].\n\nTiền chuộc là @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! [gold|E].$action_should_pay_ransom_HELP$"
  action_should_pay_ransom_combined_group_description:0 "Ngài có những nhân vật quan trọng đang bị [imprisoned|E], Ngài nên trả tiền chuộc để bảo vệ [health|E] của họ.$action_vassal_ransom_gives_hook_HELP$"
  action_should_pay_ransom_label:0 "@gold_icon! Ngài nên trả tiền chuộc cho [actor.Custom2('RelationToMe', secondary_recipient)] [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUINameNoTooltip] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
  action_should_pay_ransom_combined_label:0 "[actor.Custom2('RelationToMe', secondary_recipient)] của ngài, [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUINameNoTooltip] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
