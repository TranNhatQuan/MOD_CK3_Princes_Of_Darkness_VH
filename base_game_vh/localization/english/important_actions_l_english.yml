  action_can_propose_alliance_to_family_member_desc:3 "Ngài có thể đàm phán một [alliance|E] với [actor.Custom2('RelationToMe', recipient)] [recipient.GetUIName] vì Ngài đã có mối quan hệ huyết thống.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nCẩn thận! Một số [alliances|E] có thể phiền phức hơn lợi...\n\nHãy chắc chắn rằng Ngài thực sự muốn [alliance|E] này, vì Ngài có thể bị kéo vào những xung đột vô nghĩa.#!"
  action_can_propose_alliance_to_family_member_combined_group_description:3 "Ngài có thể đàm phán [alliances|E] với một số thành viên trong [family|E] hoặc người họ đã kết hôn mà không cần sắp xếp một [marriage|E] mới, vì Ngài đã có mối quan hệ huyết thống.#help \n\nCẩn thận! Một số [alliances|E] có thể phiền phức hơn lợi...\n\nHãy chắc chắn rằng Ngài thực sự muốn [alliance|E] này, vì Ngài có thể bị kéo vào những xung đột vô nghĩa.#!"
  action_can_propose_alliance_to_family_member_label:1 "@alliance_icon! Ngài có thể Đàm phán Liên minh với [actor.Custom2('RelationToMe', recipient)] [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
