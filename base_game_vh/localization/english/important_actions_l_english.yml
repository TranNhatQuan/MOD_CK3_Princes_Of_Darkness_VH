  action_above_domain_limit_desc:2 "Ngài đang vượt quá [actor.GetDomainLimitOverrunWithoutGracePeriod|V] [holdings|E] so với giới hạn [domain|E] [actor.GetDomainLimit|V], điều này sẽ giảm [taxes|E] và [levies|E] của Ngài.\n\n#help Là một [ruler|E], Ngài chỉ có thể giữ số lượng Holdings giới hạn. Số Holdings còn lại trong [realm|E] của Ngài nên được [vassals|E] nắm giữ.\n\nNgài nên trao một số [titles|E] với Holdings đi. [courtiers|E] và [guests|E] là lựa chọn tốt, vì họ yếu. [Vassals] hiện tại cũng có thể nhận Tước vị, nhưng họ sẽ mạnh hơn và có thể trở thành mối đe dọa trong tương lai!#!"
  action_above_domain_limit_click:0 "#I Nhấp để xem Tước hiệu của ngài#!"
  action_above_vassal_limit:0 "Vượt quá [vassal_limit|E]"
  action_above_vassal_limit_label:0 "Vượt quá [vassal_limit|E]"
  action_above_vassal_limit_desc:1 "Ngài đang vượt quá [actor.GetVassalLimitOverrun|V] [direct_vassals|E] so với Giới hạn Vassal [actor.GetVassalLimit|V], điều này sẽ giảm [taxes|E] và [levies|E] nhận từ [vassals|E] của Ngài.\n#help Mỗi [ruler|E] chỉ có thể kiểm soát số lượng Direct Vassals nhất định. Thay vì giữ họ là Direct Vassals, họ nên được quản lý bởi một [vassal] khác của Ngài. Để làm điều này, trao một trong số Vassal của Ngài cho Vassal khác.#!"
