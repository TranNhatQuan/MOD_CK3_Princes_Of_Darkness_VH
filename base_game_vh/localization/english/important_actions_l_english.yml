  action_not_rightful_liege_desc:3 "Ngài không phải là [rightful_liege|E] của [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nNgài nên kiểm tra xem có thể [create|E] hoặc [usurp|E] một tước hiệu nào đó để trở thành [de_jure|E] [liege|E] của [recipient.GetHerHis]; việc này sẽ cải thiện [opinion|E] của [recipient.GetHerHis] đối với Ngài và tăng [taxes|E] cũng như [levies|E] mà Ngài nhận từ [recipient.GetHerHim].\n\nNếu không thể, Ngài có thể cân nhắc [transferring|E] họ cho một chư hầu khác của Ngài, đặc biệt nếu chư hầu đó sẽ là [rightful_liege|E] của họ."
  action_not_rightful_liege_combined_group_description:1 "Ngài không phải là [rightful_liege|E] của một số chư hầu.\n\nKiểm tra xem Ngài có thể [create|E] hoặc [usurp|E] các tước hiệu để trở thành [de_jure|E] [liege|E] của họ; việc này sẽ cải thiện [opinion|E] của họ với Ngài và tăng [taxes|E] cùng [levies|E] Ngài nhận được.\n\nNếu không thể, Ngài có thể cân nhắc [transferring|E] họ cho một chư hầu khác, đặc biệt nếu chư hầu đó là [rightful_liege|E] của họ."
  action_not_rightful_liege_label:0 "$action_not_rightful_liege$"
  action_not_rightful_liege_combined_label:1 "[recipient.GetShortUINameNoTooltip]"
  action_not_rightful_liege_click:0 "#I Click để xem các [vassals|E] bị ảnh hưởng#!"

