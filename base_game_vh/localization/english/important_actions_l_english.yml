  CREATE_USURP_TITLE_PROS_CONS:1 "\n$BULLET_WITH_TAB$Ngài có thể tăng [rank|E]\n$BULLET_WITH_TAB$Ngài sẽ có [de_jure|E] [casus_bellis|E]\n$BULLET_WITH_TAB$[vassals|E] có thể coi Ngài là [rightful_liege|E]\n$BULLET_WITH_TAB$Ngài nhận được [prestige|E]\n\nTuy nhiên, có một số nhược điểm:\n$BULLET_WITH_TAB$[Vassals] của Ngài có thể mong muốn tước vị\n$BULLET_WITH_TAB$Nếu [realm|E] của Ngài có [succession_law|E] với nhiều [realm_heirs|E], điều này sẽ ảnh hưởng ai kế thừa tước vị."
