  action_can_assign_guardian_HELP:0 "\n\n#help Con của Ngài có thể được chỉ định Người giám hộ, người sẽ truyền dạy [skills|E] và các kiến thức khác. Người giám hộ có [education_trait|E] tốt sẽ truyền lại cho con, trong khi [vassal|E] nhận giáo dục con sẽ tăng [opinion|E] của họ đối với Ngài. Ngài có thể tự mình giáo dục con để kiểm soát quá trình này tốt hơn.#!"
  
