  action_can_potentially_propose_alliance_to_family_member_combined_group_description:0 "Những nhân vật này hiện tại #EMP sẽ không#! chấp nhận [alliance|E] với Ngài, nhưng có thể thuyết phục được.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nNếu Ngài cần Liên minh, cải thiện [opinion|E] hoặc có được [hook|E] có thể giúp Ngài đàm phán.\n\nNgài có thể kiểm tra mức độ chấp nhận bằng cách di chuột vào điểm chấp nhận khi mở tương tác.#!"
