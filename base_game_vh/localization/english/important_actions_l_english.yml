  action_can_ransom_desc:2 "Ngài có thể chuộc [prisoner|E], [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUIName], lấy [gold|E].\n\n[recipient.GetSheHe|U] hiện có @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! số Vàng mà Ngài có thể yêu cầu.$action_can_ransom_HELP$"
  action_can_ransom_combined_group_description:1 "Ngài có thể chuộc [prisoners|E] lấy [gold|E].$action_can_ransom_HELP$"
