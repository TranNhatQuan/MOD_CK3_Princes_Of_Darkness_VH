  action_wrong_holding_type_HELP:0 "\n\n#help Mỗi nhà cai trị có một loại Hình thức Chính quyền, xác định các loại [holdings|E] mà họ có thể quản lý đúng cách. Ví dụ, nhà cai trị Feudal chỉ quản lý tốt [castles|E]. Lãnh địa sai loại gần như vô giá trị, chỉ tính vào [domain_limit|E] của Ngài.\n\nNgài nên cấp những loại Lãnh địa này cho thành viên [unlanded|E] trong [court|E] của Ngài, họ sẽ trở thành [vassal|E] của Ngài.#!"

