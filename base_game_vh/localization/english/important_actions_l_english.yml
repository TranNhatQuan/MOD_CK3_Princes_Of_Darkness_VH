  action_should_pay_ransom_HELP:0 "\n\n#help Ngài nên đảm bảo [heirs|E] của mình an toàn, đặc biệt là [player_heir|E].\n\nTrừ khi #EMP chẳng may#! kỹ năng [skills|E] của họ kém và một người em nhỏ hơn có khả năng hơn — trong trường hợp đó cái chết tất yếu của họ trong ngục tù nước ngoài chỉ là một bi kịch kinh khủng...#!"
