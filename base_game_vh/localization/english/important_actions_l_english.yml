  action_in_line_of_succession_for_title_combined_group_description:3 "Ngài đang ở vị trí cao trong [line_of_succession|E] cho nhiều [titles|E].\n\n#help Mặc dù Ngài có thể thừa kế các tước hiệu này mà không cần hành động, một [GetScheme('murder').GetTypeName] có thể vừa giúp Ngài thừa kế nhanh hơn, vừa giữ vị trí của Ngài trong dòng kế thừa.#!"
  action_in_line_of_succession_for_title_label:0 "$action_in_line_of_succession_for_title$"
  action_in_line_of_succession_for_title_combined_label:2 "#high [actor.GetPlaceInSuccession(landed_title)|O]#! trong dòng kế thừa [landed_title.Custom('GetTierIcon')][landed_title.GetNameNoTooltip] [actor.Custom2('GetInOrOutsideRealm', landed_title.GetHolder)]"
