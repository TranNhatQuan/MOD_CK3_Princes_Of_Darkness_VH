  action_primary_heir_wrong_dynasty_but_replacement_exists_desc:3 "[primary_heir|E] của Ngài không thuộc [dynasty|E]!\n\n#help [primary_title|E] của Ngài được đặt để thừa kế bởi người ngoài Dynasty. Điều này nghĩa là Ngài sẽ mất một phần đất khi chết. Có các thành viên [dynasty|E] của Ngài ở dòng kế vị. Ngài nên đảm bảo một người trong số họ thừa kế, thông qua thay đổi [succession_laws|E] hoặc thậm chí Ám sát...#!"
