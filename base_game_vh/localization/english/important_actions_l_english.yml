  action_title_election:1 "@law_icon! Cuộc Bầu cử đang diễn ra tại [landed_title.GetBaseNameNoTooltip]"
  action_title_election_combined_group_label:0 "Các Cuộc Bầu cử đang diễn ra"
  action_title_election_combined_group_name:0 "Có thể Xem Trước các Cuộc Bầu cử đang diễn ra"
  action_title_election_desc:1 "Hiện đang có một cuộc bầu cử tại [landed_title.Custom('GetTierIcon')][landed_title.GetName], một [title|E] do [landed_title.GetHolder.GetShortUIName] cai trị. Hiện tại, ứng cử viên dẫn đầu là [landed_title.GetHeir.GetUIName].\n\n#help Nếu Ngài là một [elector|E], đáng để theo dõi các cuộc bầu cử đang diễn ra, ngay cả khi Ngài đã bỏ phiếu. Hãy nhớ rằng Ngài có thể thay đổi phiếu bất kỳ lúc nào!\n\nNgay cả khi Ngài không phải là [elector|E], cũng nên theo dõi các cuộc bầu cử. Rốt cuộc, mọi chuyện đều có thể xảy ra... có thể là #emp Ngài#! sẽ là ứng cử viên hàng đầu!#!"
  action_title_election_combined_group_description:0 "Có các cuộc bầu cử đang diễn ra trong vương quốc của Ngài.\n\n#help Nếu Ngài là một [elector|E], đáng để theo dõi các cuộc bầu cử đang diễn ra, ngay cả khi Ngài đã bỏ phiếu. Hãy nhớ rằng Ngài có thể thay đổi phiếu bất kỳ lúc nào!\n\nNgay cả khi Ngài không phải là [elector|E], cũng nên theo dõi các cuộc bầu cử. Rốt cuộc, mọi chuyện đều có thể xảy ra... có thể là #emp Ngài#! sẽ là ứng cử viên hàng đầu!#!"
  action_title_election_label:1 "@law_icon! Cuộc Bầu cử đang diễn ra tại [landed_title.GetBaseNameNoTooltip]"
  action_title_election_combined_label:1 "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip|U]"
  action_title_election_click:0 "#I Click để xem Cuộc Bầu cử#!"
  action_grant_vassal_to_rightful_liege:1 "@vassal_icon! Có thể trao Chư hầu cho Chúa thừa kế hợp pháp"
  action_grant_vassal_to_rightful_liege_combined_group_label:1 "@vassal_icon! Có thể trao các Chư hầu cho Chúa thừa kế hợp pháp"
  action_grant_vassal_to_rightful_liege_combined_group_name:1 "@vassal_icon! Các Chư hầu có thể được trao cho Chúa thừa kế hợp pháp của họ"
  action_grant_vassal_to_rightful_liege_desc:0 "Bằng cách chuyển [secondary_actor.GetNameNoTooltip] cho [recipient.GetNameNoTooltip], Ngài sẽ loại bỏ hình phạt [rightful_liege|E].$action_grant_vassal_to_rightful_liege_HELP$"
  action_grant_vassal_to_rightful_liege_combined_group_description:0 "Ngài có thể chuyển một [vassal|E] cho [rightful_liege|E] của họ.$action_grant_vassal_to_rightful_liege_HELP$"
  action_grant_vassal_to_rightful_liege_label:1 "@vassal_icon! Ngài có thể chuyển [secondary_actor.GetPrimaryTitle.Custom('GetTierIcon')][secondary_actor.GetUINameNoTooltip] cho [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
  action_grant_vassal_to_rightful_liege_combined_label:1 "Trao [secondary_actor.GetPrimaryTitle.Custom('GetTierIcon')][secondary_actor.GetUINameNoTooltip] cho [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
  action_grant_vassal_to_rightful_liege_click:0 "#I Click để Trao Chư hầu#!"
  action_grant_vassal_to_rightful_liege_HELP:0 "\n\n#help [vassals|E] mà Ngài không phải là Chúa hợp pháp sẽ cung cấp ít tài nguyên hơn và có [opinion|E] thấp hơn với Ngài. Đôi khi tốt nhất là trao những Chư hầu này cho Chúa hợp pháp của họ, giả sử họ cũng là chư hầu của Ngài.\n\nViệc trao một Chư hầu cho Chúa hợp pháp đôi khi có nghĩa là Ngài kiếm được ít hơn, nhưng thường vẫn đáng để trao – Chúa hợp pháp của họ sẽ có hình phạt Opinion nghiêm trọng với Ngài vì giữ Chư hầu mà họ cho là của mình.\n\nDuy trì cấu trúc chư hầu tốt là chìa khóa cho một vương quốc ổn định.#!"
  action_can_create_head_of_faith_title:1 "@titles_icon! Ngài có thể Tạo [head_of_faith|E] của [actor.GetFaith.GetAdjectiveNoTooltip]"
  action_can_create_head_of_faith_title_desc:1 "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help Khi tạo tước vị head of faith, Ngài cũng trở thành [temporal_head_of_faith|E]!#!"
  action_can_create_head_of_faith_title_label:1 "@titles_icon! Ngài có thể Tạo [head_of_faith|E] của [actor.GetFaith.GetAdjectiveNoTooltip]"
  action_can_create_head_of_faith_title_click:0 "#I Click để xem Faith#!"
  action_can_claim_liege_title:1 "@titles_icon! Ngài có thể Yêu cầu Tước vị của Chúa"
  action_can_claim_liege_title_desc:2 "Ngài kiểm soát phần lớn [counties|E] thuộc [de_jure|E] của một trong các [titles|E] của [liege_possessive|E]. Điều này có nghĩa là Ngài có thể dùng [prestige|E] để có [unpressed_claim|E]!\n\n#help Có một Unpressed Claim trên Tước vị cấp cao hơn sẽ giúp Ngài tăng hạng. Ngài có thể dùng nó để lập [claimant_faction|E] hoặc tuyên chiến [war|E] trực tiếp với Chúa của mình.#!"
