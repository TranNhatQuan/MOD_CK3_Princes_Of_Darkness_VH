  action_can_ransom_combined_label:1 "[actor.Custom2('RelationToMe', recipient)] của ngài, [recipient.Custom('GetPrimaryTitleTierIcon')][recipient.GetShortUINameNoTooltip], @gold_icon!#V [recipient.MakeScope.ScriptValue('current_situation_gold_ransom')|0]/[recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
