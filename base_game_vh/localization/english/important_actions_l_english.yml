  action_can_ransom_HELP:0 "\n\n#help Nếu tù nhân là mối đe dọa với Ngài, như [rival|E], Ngài có thể không muốn chuộc họ. Trong trường hợp đó, Ngài có thể [execute|E] họ hoặc để họ thối trong ngục tù vô thời hạn...#!"
 
