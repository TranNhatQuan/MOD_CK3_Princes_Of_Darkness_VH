  action_can_raze_holding_click: "#I Nhấp để chọn Tước hiệu#!"
  action_can_raze_holding_HELP: "\n\n#help Nếu Ngài không có kế hoạch định cư sử dụng $step_away_from_the_steppe_decision$ hoặc $settle_people_decision$ [decisions|E], Ngài nên cân nhắc phá hủy [holdings|E] để biến chúng thành [nomadic_holdings|E].\n\n[nomadic_holdings|E] cải thiện [fertility_equilibrium|E] và làm cho vùng đất không hấp dẫn cho các nhà cai trị định cư.\n\nĐể phá hủy Lãnh địa, nhấp vào nút tròn ở góc dưới bên trái của giao diện Lãnh địa.#!"

