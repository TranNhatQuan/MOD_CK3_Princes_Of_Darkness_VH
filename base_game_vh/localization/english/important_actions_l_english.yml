  action_can_use_hook_to_change_contract_combined_group_name:0 "$action_can_use_hook_to_change_contract_combined_group_label$"
  action_can_use_hook_to_change_contract_desc:1 "Vì Ngài có [hook|E] trên [GetGovernment( 'feudal_government' ).GetName] [vassal|E] [recipient.GetUIName], Ngài có thể dùng nó để sửa đổi [vassal_contract|E] của họ.\n\n#help Tăng [obligations|E] của [vassals_possessive|E] đối với Ngài là một trong những cách sử dụng [hook] đáng giá nhất.\n\nThông thường, đề xuất thay đổi [vassal_contract|E] bất công sẽ gây [tyranny|E] – nhưng Ngài tránh được bằng cách dùng [hook|E]. Ngài chỉ được đề xuất một thay đổi bất công, nhiều hơn sẽ vẫn gây [tyranny].\n\nNhớ #high tích vào ô 'Use a Hook'#! khi sửa đổi [vassal_contract|E]!#!"
  action_can_use_hook_to_change_contract_combined_group_description:0 "Vì Ngài có [hooks|E] trên [GetGovernment( 'feudal_government' ).GetName] [vassals|E], Ngài có thể dùng chúng để sửa đổi [vassal_contracts|E].\n\n#help Tăng [obligations|E] của [vassals_possessive|E] đối với Ngài là một trong những cách sử dụng [hook] đáng giá nhất.\n\nThông thường, đề xuất thay đổi [vassal_contract|E] bất công sẽ gây [tyranny|E] – nhưng Ngài tránh được bằng cách dùng [hook|E]. Ngài chỉ được đề xuất một thay đổi bất công, nhiều hơn sẽ vẫn gây [tyranny].\n\nNhớ #high tích vào ô 'Use a Hook'#! khi sửa đổi [vassal_contract|E]!#!"
  action_can_use_hook_to_change_contract_label:1 "@cs_weak_hook_icon! Ngài có thể Thay đổi Hợp đồng của [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUINamePossessiveNoTooltip]"
