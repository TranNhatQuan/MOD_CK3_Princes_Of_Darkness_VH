l_english:
  conqueror.0001.t: "Thống Trị Cả Thế Giới"
  conqueror.0001.desc: "Mọi thứ ngày càng rõ ràng. Từ những người nông dân thấp hèn nhất cho đến các chư hầu cao quý nhất của ta — tất cả đều đang thì thầm tên ta, thì thầm về sức mạnh của ta, thì thầm về #EMP chiến tranh!#! Có sự ủng hộ cho chính nghĩa của ta, bởi dân chúng xem ta là một kẻ thống trị xứng đáng với cả thế giới.\n\nSức mạnh của [ROOT.Char.GetPrimaryTitle.GetBaseName] nằm trong tay ta — và ta sẽ sử dụng nó. Người ta trông đợi ta tiến ra ngoài, dùng vũ lực để đoạt lấy những gì lẽ ra thuộc về ta. Ta sinh ra để thống trị, để khuất phục những kẻ xung quanh và biến họ thành một phần của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta.\n\nCó nhân dân đứng sau lưng, ta không thể thất bại."
  conqueror.0001.desc.temujin: "\n\nTừ sói xám xanh và nai cái lông vàng, ta chỉ mang đến diệt vong hoặc sự khuất phục."
  conqueror.0001.a: "Hãy để cuộc chinh phạt bắt đầu!"
  conqueror_flavor: "Ngài sẽ bắt đầu nhận được sự ủng hộ từ các chư hầu và dân chúng, nhưng hãy cẩn thận — sự ủng hộ đó sẽ suy giảm nếu Ngài hòa bình quá lâu, thua quá nhiều cuộc chiến, trở thành  Bề Tôi của một lãnh thổ khác, hoặc thất sủng...\n\nNếu Ngài chết, con cái Ngài được kỳ vọng sẽ tiếp tục ngọn cờ chinh phạt."
  conqueror.0001.b: "Ta thà ở lại đây và ngửi mùi [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]..."
 
  conqueror.0002.t: "Kẻ Chinh Phạt Thất Bại"
  conqueror.0002.intro: "Mọi thứ đã chấm dứt. Những người từng là Ngài quay lưng, dòng ủng hộ đều đặn tan vỡ, và binh sĩ của ta buông kiếm trong thất vọng.\n\n"
  conqueror.0002.peace: "\"Một kẻ chinh phạt 'vĩ đại' mà không chinh phạt gì cả, đúng là trò cười!\" Tiếng nói của thần dân vang vọng khắp đại sảnh. \"Chúng ta không muốn hòa bình, chúng ta muốn #EMP vinh quang!#!\""
  conqueror.0002.prestige: "\"Danh tiếng của [root_scope.GetHerHis|U] còn chẳng đáng giá bằng bùn đất!\" Thần dân chế nhạo. \"Ai lại đi theo một kẻ đã tự làm ô danh mình chứ?\""
  conqueror.0002.debt_level: "\"[root_scope.GetSheHe|U] đã phá nát [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\" Thần dân mỉa mai. \"Ngân khố trống rỗng hoàn toàn, sao [ROOT.Char.GetTitleAsNameNoTooltip] lại để chuyện này xảy ra!\""
  conqueror.0002.lost_wars: "\"[ROOT.Char.GetTitleAsNameNoTooltip] thật yếu đuối.\" Những tiếng xì xào vang lên. \"[root_scope.GetSheHe|U] thua trận này đến trận khác, ai lại đi theo một kẻ chỉ huy bất tài như vậy?\""
  conqueror.0002.independence: "\"Không một kẻ chinh phạt #EMP thực thụ#! nào lại cúi mình trước kẻ khác.\" Thần dân thì thầm với nhau. \"Đó là yếu đuối, hoàn toàn là yếu đuối.\""
  conqueror.0002.incapable: "\"Trí óc của [root_scope.GetHerHis|U] đã không còn, chẳng còn ai ở đó để lãnh đạo chúng ta.\" Thần dân thì thầm. \"Ít ra thì cũng đã từng tốt đẹp...\""
  conqueror.0002.count: "\"[root_scope.GetFirstName], chỉ là một [ROOT.Char.GetTitleAsNameNoTooltip] tầm thường... thảm hại!\" Thần dân thì thầm. \"Danh hiệu đó chẳng đáng giá #EMP gì cả#!, chúng ta muốn theo một vị vua — không phải kẻ bần cùng!\""
  conqueror.0002.outro: "Những lời đó như cứa vào tai ta.\n\nCó vẻ như các cuộc chinh phạt của ta đã kết thúc. Ít nhất là bây giờ."
  conqueror.0002.a: "Mọi thứ quá tốt để có thể là thật..."
  conqueror_end_flavor: "Ngài sẽ không còn nhận được sự ủng hộ từ các chư hầu và dân chúng."
 
  conqueror_title: "Ngài sẽ không còn nhận được sự ủng hộ từ các chư hầu và dân chúng."
  conqueror_prefix: "Kẻ Chinh Phạt:"
 
  conqueror.1000.t: "$conqueror_prefix$ Vì Quỹ Chiến Tranh"
  conqueror.1000.desc: "\"Vì quỹ chiến tranh.\" Thư của [generous_vassal.GetTitledFirstNamePossessive] viết. \"Hãy sử dụng số tiền này một cách khôn ngoan, hỡi [ROOT.Char.GetTitleAsNameNoTooltip] — để dự trữ kho vũ khí, nuôi binh sĩ, hoặc tăng cường lực lượng bằng lính đánh thuê. Ta khao khát được chứng kiến vinh quang mà ngài sẽ mang lại cho [ROOT.Char.GetPrimaryTitle.GetBaseName]!\"\n\nTa có thể tận dụng việc này rất tốt."
  conqueror.1000.a: "Số vàng này thật đáng hoan nghênh."
  conqueror.1000.b: "Dùng số vàng để chiêu mộ lính đánh thuê!"
  conqueror.1000.c: "Cảm tạ [generous_vassal.GetHerHim] thật trọng hậu, nhưng ta không cần quà cáp!"
  mercenary_bolstering: "Quân Số Được Tăng Cường Bởi Lính Đánh Thuê"
  mercenary_bolstering_desc: "Nhân vật này đã thu hút sự chú ý của nhiều lính đánh thuê, những kẻ kéo đến vì vinh quang."
 
  conqueror.1100.t: "$conqueror_prefix$ Tăng Cường Quân Ngũ"
  conqueror.1100.desc: "\"Xin chào, thưa [ROOT.Char.GetTitleAsNameNoTooltip].\" $knight_culture_player_no_tooltip$ nói, thông báo sự hiện diện của [maa_leader.GetHerHis]. \"Ta là [maa_leader.GetFirstName], được [generous_vassal.GetTitledFirstName] phái đến để phục vụ ngài — cùng Ta là một đội tùy tùng gồm những binh sĩ tinh nhuệ nhất mà [generous_vassal.GetCapitalLocation.GetTitle.GetName] có thể huy động!\"\n\n\"Điều duy nhất mà [generous_vassal.GetTitleAsNameNoTooltip] yêu cầu là ngài hãy sử dụng chúng Ta cho xứng đáng, và dẫn dắt chúng Ta tới vinh quang!\" [maa_leader.GetSheHe|U] đứng nghiêm."
  conqueror.1100.a: "Ta sẽ sắp xếp doanh trại cho các ngươi!"
  conqueror.1100.b: "Chia binh sĩ vào các trung đoàn của ta."
  conqueror.1100.c: "[generous_vassal.GetFirstNameNoTooltip] thật hào phóng, nhưng ta không cần các ngươi."
  maa_recruitment_boon: "Chiêu Mộ Quân Chính Quy Hiệu Quả"
  maa_recruitment_boon_desc: "Nhân vật này đang nhận được sự hỗ trợ từ các chư hầu trong việc chiêu mộ binh sĩ chuyên nghiệp."
  war_war_war_opinion: "Chiến tranh, chiến tranh, chiến tranh!"
 
  conqueror.1200.t: "$conqueror_prefix$ Thả Lỏng Những Kẻ Khát Vinh Quang"
  conqueror.1200.desc: "Những tiếng hô vang vọng khắp đại sảnh, kinh đô, lãnh thổ của ta — khắp toàn bộ lãnh địa; \"Chiến tranh! Chiến tranh! Chiến tranh!\"\n\nNhững chư hầu khát khao vinh quang kêu gọi máu của kẻ thù phải đổ, để ta mang về danh tiếng vốn là định mệnh của mình.\n\nTa có được sự ủng hộ tuyệt đối của họ."
  conqueror.1200.a: "Ta sẽ không làm họ thất vọng!"
  conqueror.1200.b: "Nếu họ muốn chiến tranh, ta cần binh sĩ."
  glory_hound_contribution: "Sự Ủng Hộ Của Kẻ Khát Vinh Quang"
  glory_hound_contribution_desc: "Nhân vật này đang nhận được sự ủng hộ tuyệt đối từ các chư hầu [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] của mình."
 
  conqueror.1300.t: "$conqueror_prefix$ Sự Ủng Hộ Của Dân Chúng"
  conqueror.1300.desc: ""Bẩm [root_scope.GetLadyLord], bẩm [ROOT.Char.GetTitleAsNameNoTooltip|l], bẩm vị #EMP lãnh chúa#! [root_scope.Custom('ComplimentAdjective')] vĩ đại không thể tranh cãi của chúng tiểu nhân!" Tên nông dân lắp bắp, phủ phục [portrait_peasant.GetHerselfHimself] trước mặt ta.\n\n"Chúng tiểu nhân từ những thôn ấp hèn mọn của [peasant_barony.GetBaseName] mang đến lễ vật — ngũ cốc, thú săn và vàng. Chúng tiểu nhân đã làm lụng vất vả, nhưng chúng tiểu nhân biết ngài sẽ mang lại sự phồn vinh!" [portrait_peasant.GetSheHe|U] nói tiếp.\n\nBọn chúng có thể là những thần dân thấp kém nhất của ta, nhưng chúng sẽ làm bất cứ điều gì ta yêu cầu."
  conqueror.1300.a: "Những món quà tuyệt vời, ta cảm ơn tất cả các ngươi!"
  conqueror.1300.b: "Khi các ngươi thấy binh sĩ của ta — hãy nuôi họ."
  conqueror.1300.c: "Hãy để ruộng đồng cằn cỗi thêm một thời gian nữa, ta cần các ngươi."
  peasant_supplies: "Sự Ủng Hộ Rộng Khắp Của Nông Dân"
  peasant_supplies_desc: "Nhân vật này rất được lòng nông dân, những người sẵn sàng cung cấp nhiều tiếp tế hơn bình thường."
  peasant_draft: "Tuyển Mộ Nông Dân"
  peasant_draft_desc: "Nông dân kéo đến dưới ngọn cờ của nhân vật này, sẵn sàng cầm vũ khí tham gia quân dịch."
 
  conqueror_feed_county_gift: "[county_target.GetNameNoTooltip] Gửi Vàng"
  conqueror_feed_county_gift_desc: "Nông dân tại [county_target.GetName] hào hứng trước các cuộc chinh phạt của Ngài và gửi vàng cho Ngài."
  conqueror_feed_county_gift_herd: "[county_target.GetNameNoTooltip] Gửi Gia Súc"
  conqueror_feed_county_gift_desc_herd: "Những người chăn nuôi bình dân ở [county_target.GetName] kính phục vị [ROOT.Char.GetTitleAsName] vĩ đại và dâng tặng Ngài những con vật thượng hạng."
  conqueror_feed_knight_joins: "$knight_culture_player_no_tooltip$ Gia Nhập Chính Nghĩa Của Ngài"
  conqueror_feed_knight_joins_desc: "$knight_culture_player_no_tooltip$ [knight.GetFullName] đã thề thốt lòng trung thành của [knight.GetHerHis] với ngài! (@skill_prowess_icon![knight.GetProwess])"
  conqueror_feed_angry_vassal: "Chư Hầu Giận Dữ Bị Thuyết Phục"
  conqueror_feed_angry_vassal_desc: "[vassal|E] của Ngài là [angry_vassal.GetFullName] ấn tượng trước các cuộc chinh phạt của Ngài."
  conqueror_feed_generous_courtier: "[generous_courtier.GetFirstName] Quyên Góp Vàng"
  conqueror_feed_generous_courtier_desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] của Ngài là [generous_courtier.GetFullName] quyên góp vàng cho chính nghĩa của Ngài!"
  conqueror_feed_siege_engineer: "Kỹ Sư Công Thành Gia Nhập"
  conqueror_feed_siege_engineer_desc: "[GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] gia nhập hàng ngũ của Ngài!"
 
