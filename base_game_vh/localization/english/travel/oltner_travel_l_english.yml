  EVENT_WINDOW_OPTION_AVAILABLE_FAMILY: "Tùy chọn này khả dụng vì một trong các bên liên quan thuộc [family|E] của Ngài"
  friend_bonded_on_the_road: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã gắn kết với nhau trong chuyến du hành qua [PROVINCE.Custom('TerrainTypeProvince')] của [PROVINCE.GetName] trong vai trò thành viên đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  friend_bonded_on_the_road_corresponding: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã gắn kết với nhau trong chuyến du hành qua [PROVINCE.Custom('TerrainTypeProvince')] của [PROVINCE.GetName] trong vai trò thành viên đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  friend_travel_child_bonded_entertainers: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã trở thành Bạn Bè khi cùng đi qua [PROVINCE.GetName] và xem một đoàn nghệ sĩ biểu diễn."
  friend_travel_child_bonded_entertainers_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] đã trở thành Bạn Bè khi cùng đi qua [PROVINCE.GetName] và xem một đoàn nghệ sĩ biểu diễn."
 
  travel_events_oltner_2.1170.t: "Con Đường Kình Địch"
  travel_events_oltner_2.1170.desc: "Khi băng qua địa hình gồ ghề của [location.GetName], một thử thách nảy sinh khi [location.Custom('GetPrecariousTerrainFeature')].\n\n[ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] và [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName] bắt đầu tranh cãi gay gắt về cách tốt nhất để vượt qua lối mòn nguy hiểm này. \"[entourage_member_1.GetFirstNameNoTooltip], đề xuất của ngươi quá liều lĩnh!\" [entourage_member_2.GetFirstNameNoTooltip] gắt lên đầy bực bội. [entourage_member_1.GetFirstNameNoTooltip] đáp trả, \"Còn của ngươi thì hèn nhát!\"\n\nCó vẻ như đoàn tùy tùng của ta đang rơi vào bế tắc..."
  travel_events_oltner_2.1170.a: "\"Nghe ta nói, các ngươi cần phải #EMP hợp tác#! với nhau.\""
  travel_events_oltner_2.1170.b: "\"[entourage_member_1.GetFirstNameNoTooltip] đúng, chúng ta không thể chần chừ.\""
  travel_events_oltner_2.1170.c: "\"Hãy làm theo sự cẩn trọng như [entourage_member_2.GetFirstNameNoTooltip] đề xuất.\""
  travel_events_oltner_2.1170.d: "\"Ôi lạy [ROOT.Char.GetFaith.HighGodName], đúng là trẻ con...\""
  rival_conflict_on_the_road: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã xảy ra xung đột lớn về việc chọn lộ trình khi cố gắng vượt qua [PROVINCE.Custom('TerrainTypeProvince')] của [PROVINCE.GetName] trong đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  rival_conflict_on_the_road_corresponding: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã xảy ra xung đột lớn về việc chọn lộ trình khi cố gắng vượt qua [PROVINCE.Custom('TerrainTypeProvince')] của [PROVINCE.GetName] trong đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  terrain_challenge_desert: "cát dịch chuyển khó lường"
  terrain_challenge_desert_mountains: "lối đi trở nên dốc đứng và nguy hiểm"
  terrain_challenge_drylands: "mặt đất nứt vỡ và sụp lở"
  terrain_challenge_farmlands: "cánh đồng biến thành bãi lầy"
  terrain_challenge_floodplains: "mặt đất ngập nước và trơn trượt"
  terrain_challenge_forest: "rừng rậm dày đặc, khó xuyên qua"
  terrain_challenge_hills: "sườn đồi dốc đứng bất ngờ"
  terrain_challenge_jungle: "rừng rậm dày lên, che khuất lối đi"
  terrain_challenge_mountains: "gờ đá thu hẹp thành vực sâu"
  terrain_challenge_oasis: "rìa ốc đảo rậm rạp, rối rắm"
  terrain_challenge_plains: "thảo nguyên hóa thành mê cung cỏ cao"
  terrain_challenge_steppe: "thảo nguyên mở ra một không gian mênh mông, gây mất phương hướng"
  terrain_challenge_taiga: "mặt đất băng giá trơn trượt và nguy hiểm"
  terrain_challenge_wetlands: "đầm lầy biến thành mê cung nước và bùn"
  terrain_challenge_terraced_hills: "những thửa ruộng bậc thang ngập đầy bùn nước"
  travel_events_oltner_2.1170.a.success: "Chiến lược mạo hiểm của [entourage_member_1.GetFirstNamePossessive] đã mang lại kết quả"
  travel_events_oltner_2.1170.a.failure: "Sự liều lĩnh của [entourage_member_1.GetFirstNamePossessive] dẫn đến chấn thương"
  travel_events_oltner_2.1170.c.success: "Chiến lược thận trọng của [entourage_member_2.GetFirstNamePossessive] đã phát huy tác dụng"
  travel_events_oltner_2.1170.c.failure: "Sự quá cẩn trọng của [entourage_member_2.GetFirstNamePossessive] gây ra trì hoãn"
  safe_routes_modifier: "Lộ Trình An Toàn"
  safe_routes_modifier_desc: "Đoàn tùy tùng này đang áp dụng các biện pháp phòng ngừa kỹ lưỡng."
  do_it_yourself: "Muốn xong việc thì tốt hơn hết là tự mình làm..."

  travel_events_oltner_2.1180.t: "Lời Thổ Lộ Dưới Trăng"
  travel_events_oltner_2.1180.desc: "Dưới ánh trăng tại [location.GetName], ta vô tình nghe thấy một cuộc trò chuyện đầy thân mật giữa [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] và [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName].\n\n\"Ôi [entourage_member_1.GetFirstNameNoTooltip], [entourage_member_1.Custom('RomanticComplimentAdjective')] [entourage_member_1.Custom('RomanticComplimentNoun')] của ta, ngươi khiến những đêm sao này trở nên không thể nào quên,\" [entourage_member_2.GetFirstNameNoTooltip] thổ lộ, giọng [entourage_member_2.GetHerHis] run run. [entourage_member_1.GetFirstNameNoTooltip] dịu dàng đáp lại, \"Ta chưa từng nghĩ sẽ gặp được người hiểu ta đến vậy.\"\n\nCó vẻ như tình yêu đang nảy nở trong đoàn tùy tùng của ta..."
  travel_events_oltner_2.1180.a: "Dễ thương đấy, nhưng [seduced_entourage.GetFirstNameNoTooltip] không thể cưỡng lại #EMP ta#!."
  travel_events_oltner_2.1180.b: "\"Chào! Mọi người đang nói chuyện gì thế? Ta tham gia được không!?\""
  travel_events_oltner_2.1180.c: "Kịch tính thật... Sẽ là #EMP đáng tiếc lắm#! nếu chuyện này bị lộ ra..."
  travel_events_oltner_2.1180.d: "Thật dịu dàng, ta sẽ để họ yên."
  lover_moonlit_evening_on_the_road: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã yêu nhau sau khi cùng ngắm sao tại [PROVINCE.GetName] trong đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  lover_moonlit_evening_on_the_road_corresponding: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã yêu nhau sau khi cùng ngắm sao tại [PROVINCE.GetName] trong đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  i_saw_nothing: "Không. Ta chẳng thấy gì cả. Không có gì #EMP hết#!. Tốt hơn là quên chuyện này đi."
 
  travel_events_oltner_2.1190.t: "Kỷ Vật Bị Đánh Cắp"
  travel_events_oltner_2.1190.desc: "Trong sự tĩnh lặng của trại chúng ta gần [location.GetName], một tiếng ồn ào chói tai phá tan sự bình yên. [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] của ta, [entourage_member_1.GetFirstName], đối mặt với [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] của ta, [entourage_member_2.GetFirstName], một cách buộc tội, khi đang cầm một món [entourage_member_1.Custom('GetRandomSmallPreciousItem')] quý giá.\n\n\"Đồ trộm cắp! Đây là của mẹ ta!\" [entourage_member_1.GetFirstNameNoTooltip] kêu lên, đôi mắt rực lửa giận dữ. [entourage_member_2.GetFirstNameNoTooltip] kịch liệt phủ nhận lời cáo buộc, \"Đồ [entourage_member_1.Custom2('InsultNoun', SCOPE.sC('entourage_member_2'))] dối trá, nó luôn thuộc về ta!\""
  travel_events_oltner_2.1190.a: "\"Nó thuộc về [entourage_member_1.GetFirstNameNoTooltip].\""
  travel_events_oltner_2.1190.b: "\"[entourage_member_2.GetFirstNameNoTooltip] sẽ giữ nó.\""
  travel_events_oltner_2.1190.c: "\"Cả hai các ngươi đều là trẻ con, đưa đây!\""
  travel_events_oltner_2.1190.d: "\"Chúng ta thật sự #EMP không#! có thời gian cho chuyện này!\""
  travel_events_oltner_2.1190.d.1: "[entourage_member_2.GetName] lấy nó"
  travel_events_oltner_2.1190.d.2: "[entourage_member_1.GetName] lấy nó"
  loc_small_item_1: "mặt dây chuyền"
  loc_small_item_2: "bùa hộ mệnh"
  loc_small_item_3: "nhẫn"
  loc_small_item_4: "vòng tay"
  loc_small_item_5: "bùa may mắn"
  loc_small_item_6: "huy chương"
  loc_small_item_7: "ghim cài"
  loc_small_item_8: "bùa chú"
  loc_small_item_9: "mề đay"
  rival_stole_on_the_road: "[CHARACTER.GetShortUIName|U] đã đánh cắp kỷ vật quý giá của [TARGET_CHARACTER.GetShortUINamePossessive] khi du hành qua [PROVINCE.GetName] trong đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  rival_stole_on_the_road_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã đánh cắp kỷ vật quý giá của [CHARACTER.GetShortUINamePossessive] khi du hành qua [PROVINCE.GetName] trong đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
 
  travel_events_oltner_2.1200.t: "Thiên Thần Hộ Mệnh"
  travel_events_oltner_2.1200.desc: "Trong lúc băng qua vùng [location.Custom('TerrainTypeProvince')] của [location.GetName], [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName] đã [location.Custom('GetRandomHazardAndRescue')] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName].\n\n\"[entourage_member_2.GetFirstNameNoTooltip], ngươi cần cẩn thận hơn,\" [entourage_member_1.GetFirstNameNoTooltip] khiển trách, sự lo lắng hiện rõ trong giọng nói của [entourage_member_1.GetHerHis]. [entourage_member_2.GetFirstNameNoTooltip] đáp lại bằng một nụ cười ngượng ngùng nhưng đầy biết ơn. \"Cảm ơn, ta nợ ngươi một lần!\""
  travel_events_oltner_2.1200.a: "Phản xạ nhanh đấy, [entourage_member_1.GetFirstNameNoTooltip]!"
  travel_events_oltner_2.1200.b: "[entourage_member_2.GetFirstNameNoTooltip], ngươi không nợ [entourage_member_1.GetHerHim] điều gì cả."
  travel_events_oltner_2.1200.c: "Chúng ta hãy di chuyển hết sức cẩn trọng trong một thời gian."
  travel_events_oltner_2.1200.d: "Chết tiệt, chúng ta phải đi thật nhanh!"
  trap_scenario_falling_net: "suýt bước vào một chiếc lưới bẫy giấu phía trên, nhưng nhanh chóng được kéo ra bởi"
  trap_scenario_pit_trap: "tiến sát đầy nguy hiểm một hố bẫy được che giấu, nhưng được chộp lại kịp thời bởi"
  trap_scenario_snare_trap: "chỉ còn khoảnh khắc nữa là kích hoạt bẫy thòng lọng, nhưng được cảnh báo đúng lúc bởi"
  trap_scenario_river_current: "suýt bị cuốn đi bởi một dòng nước ngầm được che giấu, nhưng nhanh chóng được cứu bởi"
  trap_scenario_thin_ice: "sắp bước lên một mảng băng mỏng phủ ao đóng băng, nhưng được cảnh báo khẩn cấp và giữ lại bởi"
  trap_scenario_rockslide: "suýt bị cuốn vào một trận lở đá, nhưng được kéo ra an toàn bởi"
  trap_scenario_snake_nest: "vừa kịp né một ổ rắn ẩn mình, nhờ con mắt tinh tường của"
  trap_scenario_irrigation_ditch: "tránh được việc rơi xuống một mương tưới tiêu ngụy trang, nhờ lời cảnh báo kịp thời từ"
  trap_scenario_quicksand: "suýt lún xuống cát lún, nhưng được kéo ra vội vàng bởi"
  trap_scenario_hunters_snare: "suýt bước vào bẫy của thợ săn, nhưng được ngăn lại đúng lúc bởi"
  trap_scenario_wire_trap: "sắp vấp phải một bẫy dây giấu kín, nhưng được cảnh báo nhanh chóng bởi"
  trap_scenario_pit_of_spikes: "thoát hiểm trong gang tấc khỏi một hố chông được che giấu, nhờ tiếng hô kịp thời từ"
  trap_scenario_cliff_edge: "gần như bước khỏi mép vách đá bị che giấu, nhưng được chộp lại vào giây cuối bởi"
  trap_scenario_water_hole: "suýt rơi vào một hố nước phủ lau sậy, nhưng nhanh chóng được giữ vững bởi"
  trap_scenario_burrow_of_vipers: "chỉ còn khoảnh khắc nữa là quấy động một hang rắn độc ẩn giấu, nhưng được cảnh báo kịp thời bởi"
  trap_scenario_thorny_brush: "suýt bị mắc kẹt trong bụi gai ngụy trang giữa cỏ, nhưng được cứu nhờ sự cảnh giác của"
  trap_scenario_snow_laden_branch: "sắp bước dưới một cành cây yếu oằn vì tuyết, nhưng bị kéo lùi vội vàng bởi"
  trap_scenario_water_covered_ditch: "suýt vấp ngã xuống một mương sâu phủ nước, nhưng bị giật ngược lại bởi"
  friend_praised: "[CHARACTER.GetShortUIName|U] đã công khai ca ngợi phản xạ nhanh nhạy của [TARGET_CHARACTER.GetShortUINamePossessive]."
  friend_praised_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã công khai ca ngợi phản xạ nhanh nhạy của [CHARACTER.GetShortUINamePossessive]."
  avoiding_traps_modifier: "Tránh Bẫy"
  avoiding_traps_modifier_desc: "Đoàn tùy tùng này đang tránh bẫy bằng mọi giá."

  travel_events_oltner_2.1210.t: "Khúc Serenade Ban Đêm"
  travel_events_oltner_2.1210.desc: "Dưới bầu trời đầy sao của [location.GetName], doanh trại được thưởng thức một màn biểu diễn bất ngờ. [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName] khiến mọi người kinh ngạc với một giai điệu đầy cảm xúc, giọng ca của [entourage_member_2.GetHerHis] vang lên những lời ca ngợi dành cho [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName].\n\n[entourage_member_1.GetFirstName] lắng nghe chăm chú, trông rõ vẻ bối rối. Khi khúc hát kết thúc, một sự thấu hiểu lặng lẽ thoáng qua giữa họ."
  travel_events_oltner_2.1210.a: "Nếu giữa hai người đó có chuyện gì, ta sẽ tìm ra..."
  travel_events_oltner_2.1210.b: ""[entourage_member_2.GetFirstNameNoTooltip], cả thế giới nên được nghe ngươi đàn và hát!""
  travel_events_oltner_2.1210.c: ""Ngươi... ngươi có thể dạy ta chơi như vậy được không?""
  travel_events_oltner_2.1210.d: ""À, thật là một giai điệu tuyệt đẹp.""
  travel_events_oltner_2.1210.a.success: "Ngươi phát hiện ra điều gì đó"
  travel_events_oltner_2.1210.a.failure: "Không có gì để phát hiện"
  something_happens: "Có chuyện xảy ra"
  travel_events_oltner_2.1210.c.success: "Ngươi học được cách chơi, ít nhất là một chút"
  travel_events_oltner_2.1210.c.failure: "Ngươi không học được bao nhiêu"
  lover_serenaded_on_the_road: "[CHARACTER.GetShortUIName|U] đã hát khúc tình ca đầy lãng mạn cho [TARGET_CHARACTER.GetShortUIName] tại [PROVINCE.GetName], giữa đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."
  lover_serenaded_on_the_road_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã hát khúc tình ca đầy lãng mạn cho [CHARACTER.GetShortUIName] tại [PROVINCE.GetName], giữa đoàn tùy tùng của [TARGET_CHARACTER_2.GetFirstNamePossessive]."

  travel_events_oltner_2.1220.t: "Hồi Kết Của Kẻ Thù"
  travel_events_oltner_2.1220.desc: "Giữa đêm khuya trong doanh trại gần [location.GetName], ta lặng lẽ bước ra ngoài. Âm thanh vừa rồi là gì vậy?\n\nRồi ta thấy điều đó: [location.Custom('GetTerrainMurderMethod')|U]\n\n[entourage_member_1.GetFirstNameNoTooltip] nhanh chóng quan sát xung quanh, không hề hay biết rằng ta đã chứng kiến tất cả."
  travel_events_oltner_2.1220.a: "Hm. Kỹ thuật thật đáng chú ý."
  travel_events_oltner_2.1220.b: ""#EMP LÍNH GÁC!#!""
  travel_events_oltner_2.1220.c: "Ta đã thấy... không có gì cả..."
  assassination_scenario_desert: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] lặng lẽ tiếp cận [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ dưới một cây cọ. Đột ngột, [entourage_member_1.GetFirstNameNoTooltip] vùi tay của [entourage_member_1.GetHerHis] vào cát quanh cổ [entourage_member_2.GetFirstNamePossessiveNoTooltip], khiến [entourage_member_2.GetHerHim] chết ngạt trong im lặng."
  assassination_scenario_desert_mountains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] lén lút tiến về phía [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ gần mép vực. Với một cú đẩy mạnh và nhanh, [entourage_member_1.GetFirstName] khiến [entourage_member_2.GetFirstNameNoTooltip] rơi thẳng xuống sườn núi dốc đứng."
  assassination_scenario_drylands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] rón rén áp sát [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang nghỉ cạnh một bụi cây khô. Chộp lấy một tảng đá, [entourage_member_1.GetFirstNameNoTooltip] giáng mạnh vào đầu [entourage_member_2.GetFirstNamePossessiveNoTooltip] với lực chí mạng, chỉ để lại một vệt đen trên mặt đất."
  assassination_scenario_farmlands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] tiến đến [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ cạnh một cái cày. Trong một hành động bạo lực bất ngờ, [entourage_member_1.GetFirstNameNoTooltip] xiên [entourage_member_2.GetFirstNameNoTooltip] vào những răng cày sắc nhọn, kết liễu nhanh chóng."
  assassination_scenario_floodplains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] lén tiếp cận [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName] bên bờ sông. Với một cú đẩy bất ngờ, [entourage_member_1.GetFirstNameNoTooltip] dìm chết [entourage_member_2.GetFirstNameNoTooltip] trong dòng nước đục cuồn cuộn."
  assassination_scenario_forest: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] âm thầm tiến đến [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ dưới gốc cây. Dùng dây thừng, [entourage_member_1.GetFirstNameNoTooltip] nhanh chóng siết cổ [entourage_member_2.GetFirstNameNoTooltip], để [entourage_member_2.GetHerHim] treo lơ lửng trên cành cây."
  assassination_scenario_hills: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] rón rén đến gần [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang lim dim trên sườn đồi. [entourage_member_1.GetFirstNameNoTooltip] lăn [entourage_member_2.GetFirstNameNoTooltip] xuống dốc, nơi những tảng đá sắc nhọn đảm bảo một cái chết nhanh và đau đớn."
  assassination_scenario_jungle: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] l silently tiến về phía [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ dưới tán lá rậm rạp. [entourage_member_1.GetFirstNameNoTooltip] dùng dây leo siết cổ [entourage_member_2.GetFirstNameNoTooltip], để [entourage_member_2.GetHerHim] mắc kẹt và bất động."
  assassination_scenario_mountains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] rón rén áp sát [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang nghỉ cạnh một vực sâu. Một cú đẩy mạnh bất ngờ khiến [entourage_member_2.GetFirstNameNoTooltip] lao thẳng xuống vực thẳm."
  assassination_scenario_oasis: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] l quietly tiến đến [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ bên mép nước. [entourage_member_1.GetFirstNameNoTooltip] nhanh chóng dìm đầu [entourage_member_2.GetFirstNamePossessiveNoTooltip] xuống nước, khiến [entourage_member_2.GetHerHim] chết đuối trong im lặng."
  assassination_scenario_plains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] l silently tiến lại gần [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ giữa cánh đồng trống. Với một tảng đá nặng, [entourage_member_1.GetFirstNameNoTooltip] nghiền nát hộp sọ [entourage_member_2.GetFirstNamePossessiveNoTooltip], để lại cỏ cây nhuốm máu."
  assassination_scenario_steppe: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] rình rập [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ dưới bầu trời mênh mông. [entourage_member_1.GetFirstNameNoTooltip] nhanh chóng bẻ gãy cổ [entourage_member_2.GetFirstNamePossessiveNoTooltip], để [entourage_member_2.GetHerHim] nằm bất động trên thảo nguyên rộng lớn."
  assassination_scenario_taiga: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] tiến đến [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ giữa rừng thông. Dùng một mảnh băng nhọn, [entourage_member_1.GetFirstNameNoTooltip] đâm [entourage_member_2.GetFirstNameNoTooltip], máu làm tan băng thấm vào nền tuyết."
  assassination_scenario_wetlands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] l quietly lội tới [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName], đang ngủ trên vùng đất lầy. [entourage_member_1.GetFirstNameNoTooltip] làm [entourage_member_2.GetFirstNameNoTooltip] chết ngạt trong bùn, để [entourage_member_2.GetHerHim] nằm bất động giữa đầm lầy."
 
  travel_events_oltner_2.1230.t: "Buổi Sáng Kinh Hoàng"
  travel_events_oltner_2.1230.desc: ""Nhân danh [ROOT.Char.GetFaith.HighGodName], đã xảy ra một #EMP vụ giết người!#!\"\n\n\"Ai lại muốn lấy mạng [entourage_member_2.Custom('ComplimentAdjective')] của chúng ta là [entourage_member_2.GetFirstName]? Và vì sao lại #EMP dã man đến vậy?!#!\" [player_scope.Custom2('RelationToMeShort', corpse_finder )] của ta là [corpse_finder.GetFirstName] tiếp lời.\n\n\"Phải rồi... ai mà #EMP lại có thể mơ#! làm điều như vậy với [entourage_member_2.GetFirstNameNoTooltip] tội nghiệp, vô tội chứ.\" [entourage_member_1.GetFirstName] nói. Ở khóe mắt, ta thấy [entourage_member_1.GetHerHim] đang cố nhịn cười."
  travel_events_oltner_2.1230.a: ""Chính là [corpse_finder.GetFirstNameNoTooltip]. [entourage_member_1.GetFirstNameNoTooltip], #EMP giết [corpse_finder.GetHerHim].#!""
  travel_events_oltner_2.1230.b: ""Ta đã thấy [corpse_finder.GetFirstNameNoTooltip] lén lút trong đêm, bắt lấy [corpse_finder.GetHerHim]!""
  travel_events_oltner_2.1230.c: ""Đây rõ ràng là dấu vết của một con [ROOT.Char.Custom('RegionalFerociousAnimal')], không còn nghi ngờ gì nữa.""
  travel_events_oltner_2.1230.d: ""Chúng ta... chúng ta nên rời đi thôi...""
  might_strike_again: "[entourage_member_1.GetFirstName] có thể sẽ ra tay lần nữa... nhưng ta biết [entourage_member_1.GetHerHis] [secret|E] và có thể vạch trần bất cứ lúc nào."
 
  travel_events_oltner_2.1240.t: "Đoàn Hí Khúc Lưu Động"
  travel_events_oltner_2.1240.desc: "Khi bước vào [location.GetTitle.GetName], chúng ta được chào đón bởi một đoàn nghệ sĩ lưu động. Có múa rối, vũ điệu và ca hát!\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_1'))] của ta là [entourage_member_1.GetFirstName] dường như rất thích âm nhạc, và đặc biệt bị cuốn hút bởi một tên hề! [local_character.GetWomanMan] ấy là một nghệ sĩ phi thường – vừa tung hứng nhiều nhạc cụ, vừa chơi chúng!"
  travel_events_oltner_2.1240.a: "Có lẽ ta nên dành chút thời gian riêng với [entourage_member_1.GetFirstNameNoTooltip]."
  travel_events_oltner_2.1240.b: "Ta đang cần một tên hề, và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_1'))] của ta sẽ rất thích [local_character.GetHerHim]!"
  travel_events_oltner_2.1240.c: "Một khoảng nghỉ xứng đáng cho tất cả chúng ta."
