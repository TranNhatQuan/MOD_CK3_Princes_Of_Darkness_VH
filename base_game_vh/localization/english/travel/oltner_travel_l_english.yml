  bridge_crossing_jungle: "một con lạch uốn lượn"
  bridge_crossing_mountains: "một dòng thác đá dựng đứng"
  bridge_crossing_oasis: "một con suối thất thường"
  bridge_crossing_plains: "một con sông rộng giữa thảo nguyên"
  bridge_crossing_steppe: "một con sông theo mùa chảy xiết"
  bridge_crossing_taiga: "một con sông tan băng"
  bridge_crossing_wetlands: "một thủy lộ lầy lội"
