l_english:
  travel_events_oltner_2.1000.t: "Cát Được Canh Tác"
  travel_events_oltner_2.1000.desc: "Mặt trời thiêu đốt những đụn cát của [location.GetName], khiến mỗi bước đi đều là một minh chứng cho sức chịu đựng. Thế nhưng, giữa vùng đất khô cằn ấy, một ốc đảo xanh tươi lại nở rộ — một kỳ tích nông nghiệp ngay giữa lòng sa mạc.\n\nKhi chúng ta còn đang chiêm ngưỡng điều dị thường này, người quản lý vùng đất tiến đến với nụ cười nhuốm màu nắng gió. \"Lữ khách,\" [local_character.GetSheHe] cất tiếng, \"hãy đến mà xem thành quả lao động của chúng Ta. Biết đâu các vị sẽ mang những câu chuyện về chiến thắng của chúng Ta trước cát bụi trở về quê hương!\""
  travel_events_oltner_2.1000.option.a: "\"Hãy cho chúng ta thấy các ngươi đã thuần phục sa mạc ra sao.\""
  travel_events_oltner_2.1000.option.b: "\"Chúng Ta xin cảm ơn, nhưng buộc phải từ chối.\""
  travel_events_oltner_2.1000.option.c: "\"Có lẽ cho chúng Ta một ít nông sản để tiếp sức chặng đường?\""
  travel_events_oltner_2.1000.option.d: "\"Ta muốn nghe thêm về cuộc sống của các ngươi nơi đây.\""
  cultural_acceptance_gain_travel_stories: "Những Câu Chuyện Được Chia Sẻ Trong Chuyến [travel|E]"
 
  travel_events_oltner_2.1010.t: "Nhà Tế Bần Hiếu Khách"
  travel_events_oltner_2.1010.desc: "Khi chúng ta băng qua vùng [location.Custom('TerrainTypeProvince')] của [location.GetName], một nhà tế bần được trang trí bằng những tác phẩm nghệ thuật tuyệt đẹp của văn hóa [location.GetCulture.GetNameNoTooltip] hiện ra bên vệ đường.\n\n\"Lữ khách, trông các vị có vẻ mệt mỏi. Cửa của chúng Ta luôn rộng mở để nghỉ ngơi và chữa trị,\" một vị thầy thuốc mỉm cười hiền hòa nói. Bên trong, không khí yên bình, tràn ngập hương thảo dược dịu nhẹ.\n\n\"Nào, hãy thử #EMP 'Thang Thuốc Hoa [location.Custom('get_region_flower_type')|U]'#! trứ danh của Ta, nó sẽ tiếp thêm sinh lực cho tâm hồn các vị!\""
  travel_events_oltner_2.1010.b: "\"À, để ta thưởng thức thang thuốc ấy!\""
  travel_events_oltner_2.1010.c: "\"[ROOT.Char.Custom('GetCourtType')] của ta đang cần một thầy thuốc, sao ngươi không theo chúng ta?\""
  travel_events_oltner_2.1010.d: "\"Đây là một khoản quyên góp, hãy dùng nó để giúp đỡ người bệnh.\""
  well_funded_hospices_modifier: "Nhà Tế Bần Được Tài Trợ Dồi Dào"
  well_funded_hospices_modifier_desc: "Các nhà tế bần tại vùng đất này đang phát triển mạnh nhờ sự hào phóng của các lữ khách."
  local_character_aptitude_physician: "[local_character.GetUINamePossessive] [aptitude|E] với vai trò [GetCourtPositionType('court_physician_court_position').GetName()] là [local_character.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 
  travel_events_oltner_2.1020.t: "Yến Tiệc Của Người Chăn Lạc Đà"
  travel_events_oltner_2.1020.desc: "Khi đoàn tùy tùng của ta và ta băng qua vùng đất rộng lớn của [location.GetName], bóng dáng đặc trưng của một trang trại lạc đà hiện ra. Khi màn đêm dần buông, một người chăn lạc đà tiến đến.\n\n\"Chào mừng những vị khách đáng kính,\" [local_character.GetSheHe] rạng rỡ nói. \"Những con lạc đà của [location.GetName] nuôi sống chúng Ta, và đêm nay chúng Ta tôn vinh những sinh vật cao quý ấy. Các vị có muốn cùng chúng Ta dự tiệc dưới bầu trời đầy sao và nghe những câu chuyện về sa mạc không?\""
  travel_events_oltner_2.1020.a: "\"Hãy để cuộc vui đêm nay tiếp thêm sinh lực cho chúng ta!\""
  travel_events_oltner_2.1020.b: "\"Ta tò mò về sức bền của loài lạc đà.\""
  travel_events_oltner_2.1020.c: "\"Ta muốn mua con lạc đà tốt nhất cho quân đội của mình.\""
  travel_events_oltner_2.1020.d: "\"Đáng tiếc, ta phải tiếp tục hành trình và xin từ chối.\""
  travel_hardy_camels_modifier: "Lạc Đà Dẻo Dai"
  travel_hardy_camels_modifier_desc: "Chuyến đi này được hỗ trợ bởi một nhóm lạc đà đặc biệt bền bỉ và đáng tin cậy."
  war_camel_modifier: "Lạc Đà Chiến Uy Mãnh"
  war_camel_modifier_desc: "Nhân vật này sở hữu một con lạc đà chiến đặc biệt ấn tượng."

  travel_events_oltner_2.1030.t: "Đoàn Thương Lữ Nặng Hàng"
  travel_events_oltner_2.1030.desc: "Trên hành trình băng qua những bãi cát của [location.GetName], một đoàn lạc đà chất đầy hàng hóa đã băng ngang qua con đường của chúng ta. Người quản lý đoàn caravan nhận thấy đoàn tùy tùng của ta và ra lệnh dừng đoàn người lại.\n\n\"Những vị khách quý,\" [local_character.GetSheHe] cất tiếng với ánh mắt sắc sảo trong đôi mắt [local_character.GetHerHis], \"có lẽ các ngài muốn ngó qua những báu vật mà những con thú cường tráng này đang mang theo? Với mức giá phù hợp, những kỳ quan của sa mạc có thể đồng hành cùng các ngài trên chuyến đi.\""
  travel_events_oltner_2.1030.a: "\"Ta rất muốn xem hàng hóa của ngươi, hãy thương lượng.\""
  travel_events_oltner_2.1030.b: "\"Không cần mua bán, nhưng có lẽ chúng ta có thể đồng hành cùng nhau một đoạn?\""
  travel_events_oltner_2.1030.c: "\"Hãy cho ta xem thứ gì đó độc nhất, một báu vật thực sự của [location.GetNameNoTooltip].\""
  travel_events_oltner_2.1030.d: "\"Chúng ta đã mang đủ gánh nặng rồi...\""
  traveling_with_camel_merchants_modifier: "Đồng Hành Cùng Thương Nhân Lạc Đà"
  traveling_with_camel_merchants_modifier_desc: "Đoàn tùy tùng này đã nhập đoàn cùng các thương nhân sa mạc, khiến hành trình an toàn hơn."
  artifact_purchased: "Đã Mua Bảo Vật"
  purchase_artifact_trinket_tt: "Ngài nhận được một [artifact|E] Trang Sức ngẫu nhiên"
  purchase_artifact_famed_tt: "Ngài nhận được một [artifact|E] Danh Tiếng ngẫu nhiên"

  travel_events_oltner_2.1040.t: "Ốc Đảo Tĩnh Lặng"
  travel_events_oltner_2.1040.desc: "Khi chúng ta băng qua những đồng bằng khô cằn của [location.GetName], một ốc đảo yên bình hiện ra trước mắt, được bao quanh bởi một đàn lạc đà.\n\nMột bậc trưởng lão uyên bác nằm nghỉ bên dòng nước nhận ra chúng ta và ra hiệu mời gọi. \"Lữ khách mệt mỏi,\" [local_character.GetSheHe] nhẹ nhàng cất lời, giọng [local_character.GetHerHis] dịu như làn gió chiều, \"linh hồn của sa mạc có thể rất khắc nghiệt. Hãy nghỉ ngơi bên dòng nước của chúng Ta, để sức mạnh trầm lặng của lạc đà hồi phục các vị.\""
  travel_events_oltner_2.1040.a: "\"Nhân danh [ROOT.Char.GetFaith.HighGodName], hãy ở lại đây vài ngày!\""
  travel_events_oltner_2.1040.b: "\"Ngươi có vẻ uyên bác, sao không theo chúng ta?\""
  travel_events_oltner_2.1040.c: "\"Có lẽ chúng ta nên giao thương?\""
  travel_events_oltner_2.1040.d: "\"Ốc đảo của ngươi thật dễ chịu, nhưng thời gian thì không cho phép.\""

  travel_events_oltner_2.1050.t: "Sứ Giả Tuấn Mã"
  travel_events_oltner_2.1050.desc: "Khi chúng ta băng qua vùng ngoại vi của [location.GetName], tiếng vó ngựa vang dội phá tan sự tĩnh lặng. Một tốp kỵ sĩ cưỡi những con ngựa tuyệt đẹp tiến đến, tạo nên một khung cảnh uy nghi trên nền [location.Custom('TerrainTypeProvincePrefix')] [location.Custom('TerrainTypeProvince')].\n\n\"Chào lữ khách!\" thủ lĩnh của họ cất tiếng. \"Chúng Ta là sứ giả đến từ [location.GetTitle.GetName]. Các vị có muốn chứng kiến sức mạnh của những tuấn mã này không?\""
  travel_events_oltner_2.1050.a: "\"Rất sẵn lòng!\""
  travel_events_oltner_2.1050.b: "\"Bao nhiêu vàng cho con khỏe nhất?\""
  travel_events_oltner_2.1050.c: "\"Ta quan tâm hơn đến #EMP chính#! bản lĩnh của các $knight_culture_player_plural_no_tooltip_lowercase$!\""
  travel_events_oltner_2.1050.d: "\"Những sinh vật thật tuyệt đẹp, nhưng ta phải ưu tiên hành trình.\""
  prefix_verdant: "xanh tươi"
  prefix_rolling: "nhấp nhô"
  prefix_mighty: "hùng vĩ"
  prefix_endless: "bạt ngàn"
  prefix_lush: "trù phú"
  prefix_rich: "phì nhiêu"

  travel_events_oltner_2.1060.t: "Quản Lý Chuồng Ngựa"
  travel_events_oltner_2.1060.desc: "Mùi cỏ khô và tiếng hí vang dẫn chúng ta đến những chuồng ngựa trứ danh của [location.GetName]. Người quản lý chuồng, một nhân vật được kính trọng trong vùng, niềm nở chào đón.\n\n\"Chào mừng,\" [local_character.GetSheHe] nói, \"ngựa của Ta thuộc hàng nhanh nhẹn nhất hiện nay. Ngài có cân nhắc mua một người Ngài đồng hành cao quý cho chuyến đi của mình không?\""
  travel_events_oltner_2.1060.a: "\"Hãy cho ta xem con ngựa nhanh nhất.\""
  travel_events_oltner_2.1060.b: "\"Ta cần tất cả những con ngựa tốt nhất của ngươi!\""
  travel_events_oltner_2.1060.c: "\"Ngươi có muốn mua những con ngựa cái dư của chúng ta không?\""
  travel_events_oltner_2.1060.d: "\"Thật tiếc, chúng ta phải #EMP nhanh chóng#! rời đi...\""
  swift_horse_modifier: "Ngựa Nhanh Nhẹn"
  swift_horse_modifier_desc: "Người dẫn đầu chuyến đi sở hữu một con ngựa đặc biệt nhanh."
  swift_horses_modifier: "Những Con Ngựa Nhanh Nhẹn"
  swift_horses_modifier_desc: "Nhân vật này trang bị cho đoàn tùy tùng toàn những con ngựa nhanh nhất."
  sold_horses_modifier: "Đã Bán Ngựa"
  sold_horses_modifier_desc: "Đoàn tùy tùng này đã bán những con ngựa dư thừa."
 
  travel_events_oltner_2.1070.t: "Người Chữa Trị Ngựa"
  travel_events_oltner_2.1070.desc: "Giữa những đồng cỏ yên bình của [location.GetName], một nhân vật đang chăm sóc cho một con ngựa bị thương ở chân. Khi chúng ta tiến lại gần, người chữa trị ngẩng đầu lên, đôi mắt của [local_character.GetHerHis] phản chiếu bao năm kinh nghiệm.\n\n\"Chỉ là một bước hụt thôi,\" [local_character.GetSheHe] giải thích, \"nhưng nó sẽ lại chạy được.\" Xúc động trước sự tận tâm của [local_character.GetHerHis], chúng ta dừng chân trên hành trình."
  travel_events_oltner_2.1070.a: "\"Chúng Ta có thể giúp ngươi chữa trị cho sinh vật cao quý này không?\""
  travel_events_oltner_2.1070.b: "\"Ngươi nên trở thành Trưởng Chuồng Ngựa của ta!\""
  travel_events_oltner_2.1070.c: "\"Này, ngươi có thể dạy ta nghề này không?\""
  travel_events_oltner_2.1070.d: "\"Mong nó sớm hồi phục, tạm biệt.\""
  free_court_position: "Làm Việc Không Công"
  master_of_the_horse_free: "[local_character.GetFirstName] sẽ được tuyển làm [GetCourtPositionType('master_of_horse_court_position').GetName()] của Ngài và không tốn lương"
  excellent_horse_care_modifier: "Chăm Sóc Ngựa Xuất Sắc"
  excellent_horse_care_modifier_desc: "Nhân vật này rất tinh thông nghệ thuật chăm sóc ngựa."
 
  travel_events_oltner_2.1080.t: "Kỳ Tài Mùi Nồng"
  travel_events_oltner_2.1080.desc: "Khi chúng ta đi ngang qua các trang trại lạc đà của [location.GetName], một mùi nồng nặc ập vào khứu giác. Lạc đà, dù vô cùng quan trọng, lại tạo ra thứ mùi thấm vào từng ngóc ngách.\n\nBất ngờ, một con ngựa của chúng ta hoảng sợ và phi thẳng vào khoảng không xa xa, dường như khiếp đảm trước mùi đó.\n\n\"Xin thứ lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" người nông dân kêu lên. \"Ta sẽ để ngài chọn một trong những con lạc đà tốt nhất của Ta để bù đắp cho mất mát này.\""
  travel_events_oltner_2.1080.a: "\"Ta chọn con lạc đà oai vệ nhất của ngươi.\""
  travel_events_oltner_2.1080.b: "\"Ta muốn con khỏe mạnh nhất.\""
  travel_events_oltner_2.1080.c: "\"Con nhanh nhất là được.\""
  travel_events_oltner_2.1080.d: "\"Ta thà ngươi bồi thường bằng vàng thì hơn...\""
  exchange_camel_fast_modifier: "Lạc Đà Nhanh Nhẹn"
  exchange_camel_fast_modifier_desc: "Một con ngựa của đoàn du hành đã bỏ chạy và được thay thế bằng một con lạc đà nhanh nhẹn."
  exchange_camel_sturdy_modifier: "Lạc Đà Vạm Vỡ"
  exchange_camel_sturdy_modifier_desc: "Một con ngựa của đoàn du hành đã bỏ chạy và được thay thế bằng một con lạc đà vạm vỡ."

  travel_events_oltner_2.1090.t: "Người Gác Cồn Cát Tĩnh Lặng"
  travel_events_oltner_2.1090.desc: "Trong sự tĩnh lặng của [location.GetName], nơi những cơn gió nóng tạc hình cát bụi, một tháp canh đơn độc đứng gác. Người trông coi, một lính gác nghiêm nghị, niềm nở chào đón chúng ta.\n\n\"Quý khách đáng kính!\" [local_character.GetWomanMan] gọi lớn từ trên cao. \"Ta có thể giúp gì cho các vị không? Có lẽ các vị muốn cùng ta ngắm nhìn sự yên bình của [location.Custom('TerrainTypeProvince')] chăng?\""
  travel_events_oltner_2.1090.a: "\"Hãy để chúng ta nghỉ ngơi dưới sự bảo vệ của ngươi.\""
  travel_events_oltner_2.1090.b: "\"Nói ta nghe, chúng ta có đang đi đúng đường không?\""
  travel_events_oltner_2.1090.c: "\"Có lẽ ngươi có thể làm người dẫn đường cho chúng ta tại vùng đất này?\""
  travel_events_oltner_2.1090.d: "\"Chúng ta phải nhanh chóng lên đường.\""
  watchtower_guidance_modifier: "Chỉ Dẫn Từ Tháp Canh"
  watchtower_guidance_modifier_desc: "Đoàn tùy tùng này đã nhận được sự chỉ dẫn từ một người gác tháp có tầm nhìn xa."
  watchman_guidance_modifier: "Người Gác Sa Mạc"
  watchman_guidance_modifier_desc: "Đoàn tùy tùng này được một người gác thông thạo địa hình địa phương đồng hành."

  travel_events_oltner_2.1100.t: "Đàn Gia Súc Trù Phú"
  travel_events_oltner_2.1100.desc: "Hành trình xuyên qua [location.GetName] mở ra những đồng cỏ rộng lớn điểm xuyết những đàn gia súc. Khi đoàn tùy tùng của ta dừng lại ở rìa một cánh đồng xanh tươi, người chăn gia súc tiến lại gần. Vui vẻ gảy cây đàn lute của [local_character.GetHerHis], [local_character.GetSheHe] nở một nụ cười rạng rỡ để chào đón.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [local_character.GetSheHe] bắt đầu, \"những con thú này là niềm tự hào của tỉnh chúng ta! Ngài sẽ cùng ta chứng kiến công việc của chúng ta, bổ sung nguồn cung cấp, hay có lẽ cùng thưởng thức loại phô mai xanh [location.GetTitle.GetNameNoTierNoTooltip] nổi tiếng của chúng ta chứ?\""
  travel_events_oltner_2.1100.a: "\"Cho ta xem cách ngươi chăn dắt đàn gia súc.\""
  travel_events_oltner_2.1100.b: "\"Hãy làm đầy kho tiếp tế — và cả bụng chúng ta nữa!\""
  travel_events_oltner_2.1100.c: "\"Phô mai xanh [location.GetTitle.GetNameNoTierNoTooltip] nghe thật #EMP ngon tuyệt!#!\""
  travel_events_oltner_2.1100.d: "\"Chúng ta phải đi gấp.\""
  extra_supplies_modifier: "Tiếp Tế Dồi Dào"
  extra_supplies_modifier_desc: "Đoàn du hành này đang mang theo lượng tiếp tế phong phú."
  herding_insights_modifier: "Hiểu Biết Về Chăn Nuôi"
  herding_insights_modifier_desc: "Người cai trị vùng đất này đang áp dụng các kỹ thuật chăn nuôi tiên tiến học được trong chuyến du hành."

  travel_events_oltner_2.1110.t: "Tiếng Búa Lò Rèn"
  travel_events_oltner_2.1110.desc: "Chuyến hành trình đưa chúng ta đến [location.GetName], nơi tiếng búa nhịp nhàng của các thợ rèn tạo nên nhịp đập của thương mại địa phương. Khói bay nghi ngút từ các ống khói khi những người thợ rèn, đẫm mồ hôi và bồ hóng, biến những thứ thô sơ thành những sản phẩm đáng kinh ngạc.\n\nMột trong những người thợ rèn lau trán [local_character.GetHerHis] và vẫy ta lại gần, \"Chào mừng, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [local_character.GetSheHe] tuyên bố. \"Chúng ta là những thợ rèn [local_character.GetCulture.GetNameNoTooltip] bậc thầy, những người giỏi nhất hiện có! Xin mời, hãy xem qua hàng hóa của chúng ta.\""
  travel_events_oltner_2.1110.a: "\"Một bộ giáp thì không bao giờ thừa.\""
  travel_events_oltner_2.1110.b: "\"Ta đang tìm một vũ khí.\""
  travel_events_oltner_2.1110.c: "\"Các ngươi có làm khiên không?\""
  travel_events_oltner_2.1110.d: "\"Ta tin dùng thợ rèn của mình hơn, tạm biệt.\""
  purchase_artifact_common_armor_tt: "Ngài mua một [artifact|E] Giáp có [rarity|E] không xác định"
  purchase_artifact_common_weapon_tt: "Ngài mua một [artifact|E] Vũ Khí có [rarity|E] không xác định"
  purchase_artifact_common_shield_tt: "Ngài mua một [artifact|E] Khiên Thành có [rarity|E] không xác định"

  travel_events_oltner_2.1120.t: "Thợ Rèn Gục Ngã"
  travel_events_oltner_2.1120.desc: "Khi đoàn tùy tùng đi ngang qua [location.GetName], chúng ta bắt gặp một xưởng rèn trong cảnh hỗn loạn. Người thợ rèn, phủ đầy bồ hóng, trông vô cùng tuyệt vọng khi than khóc bên lò rèn bị vỡ nát.\n\n\"Ôi, [local_character.GetFaith.HighGodName] đã nguyền rủa kẻ khốn khổ [local_character.GetTitledFirstName]! Tai họa giáng xuống đe của ta!\" [local_character.GetSheHe] than vãn. \"Không sửa được nó, tay nghề — và kế sinh nhai của ta — sẽ lụi tàn mất thôi!\""
  travel_events_oltner_2.1120.a: "\"Đây, hãy nhận số vàng này để đứng dậy lại.\""
  travel_events_oltner_2.1120.b: "\"Hãy theo chúng ta, chúng ta đang cần một thợ rèn.\""
  travel_events_oltner_2.1120.c: "\"Thật đáng tiếc. À mà thôi!\""
  becomes_inspired: "Trở Nên [inspired|E]"
 
  travel_events_oltner_2.1130.t: "Người Gác [location.Custom('TerrainTypeProvince')|U]"
  travel_events_oltner_2.1130.desc: "Khi bóng dáng của [location.GetName] hiện ra phía trước, những pháo đài trên đồi với đường nét gồ ghề thống trị khung cảnh.\n\nMột nhóm chiến binh thô kệch tiến đến, kẻ cầm đầu là người cục cằn nhất. \"[ROOT.Char.Custom('FormOfAddressForLiege')],\" [local_character.GetSheHe] gật đầu, \"chúng ta là [local_character.GetWomenMen] từ đồn trú của [location.GetTitle.GetHolder.GetTitledFirstNamePossessive]. Với một khoản phí nhỏ, chúng ta có thể bảo vệ ngài trên hành trình. Ngài thấy sao?\""
  travel_events_oltner_2.1130.a: "\"Hãy hộ tống chúng ta an toàn qua [location.Custom('TerrainTypeProvince')].\""
  travel_events_oltner_2.1130.b: "\"Các ngươi trông rất mạnh. Sao không theo ta?\""
  travel_events_oltner_2.1130.c: "\"Các ngươi đều đáng gờm — ta sẽ trả gấp đôi số [location.GetTitle.GetHolder.GetFirstNameNoTooltip] đang trả!\""
  travel_events_oltner_2.1130.d: "\"Không cần, nhưng cảm ơn.\""
  hill_fort_guards_modifier: "Vệ Binh Pháo Đài Đồi"
  hill_fort_guards_modifier_desc: "Đoàn tùy tùng này đang thuê những vệ binh pháo đài đồi dày dạn."
  toll_payed: "Đã Trả Phí Lộ Trình"
 
  travel_events_oltner_2.1140.t: "Những Người Bảo Vệ Bé Nhỏ"
  travel_events_oltner_2.1140.desc: "Dưới chân một pháo đài đồi đặc biệt đồ sộ tại [location.GetName], một nhóm trẻ con đang chơi trò chiến binh, tiếng cười của chúng đối lập hoàn toàn với vẻ nghiêm trang của khối đá.\n\nMột đứa trẻ táo bạo, mắt sáng, tiến đến với thanh kiếm gỗ. \"Đứng lại! Không ai được đi qua pháo đài của [local_character.GetFirstName] và đội quân [local_character.Custom('ComplimentAdjective')] của [local_character.GetHerHis]!\" đứa trẻ hô vang đầy phấn khích. \"Ơ… khoan đã, ngài là… một [ROOT.Char.GetTitleAsNameNoTooltip] sao!?\""
  travel_events_oltner_2.1140.a: "\"Đúng vậy! Giờ thì đi kể cho cả làng nghe về ta đi!\""
  travel_events_oltner_2.1140.b: "\"Những người bảo vệ dũng cảm, hãy chỉ cho ta con đường nhanh nhất qua [location.Custom('TerrainTypeProvince')].\""
  travel_events_oltner_2.1140.c: "\"#EMP *Rút vũ khí ra và dọa bọn trẻ chạy mất*#!\""
  travel_events_oltner_2.1140.d: "\"Hãy trân trọng trò chơi của mình, nhóc con. Chúng ta phải đi rồi.\""
  travel_hastened: "Hành Trình Được Đẩy Nhanh"
  travel_delayed: "Hành Trình Bị Trì Hoãn"
  famous_visit_modifier: "Khách Thăm Nổi Tiếng"
  famous_visit_modifier_desc: "Các ngôi làng quanh vùng này xôn xao tin tức về những quý tộc ghé thăm. Điều này thu hút thương nhân và lữ khách từ khắp nơi, nhưng cũng lôi kéo cả bọn cướp nhắm đến những kẻ lắm vàng."
  child_scouts_modifier: "Trinh Sát Nhí"
  child_scouts_modifier_desc: "Đoàn tùy tùng này được một nhóm trẻ con đầy thiện chí dẫn đường."
  extra_patrols_modifier: "Tuần Tra Tăng Cường"
  extra_patrols_modifier_desc: "Lãnh địa này đã tăng cường tuần tra sau khi trẻ em địa phương bị lữ khách đe dọa."

  travel_events_oltner_2.1150.t: "Tiếng Tù Và Vang Vọng"
  travel_events_oltner_2.1150.desc: "Tiếng tù và vang vọng khắp không trung khi chúng ta băng qua [location.Custom('TerrainTypeProvince')] gần [location.GetName]. Những pháo đài trên đồi cộng hưởng âm thanh ấy — lời hiệu triệu chiến đấu đã vang lên suốt bao thế hệ.\n\nChỉ vài giây sau hồi kèn đầu tiên, một nhóm đông đảo chiến binh đồn trú thuộc văn hóa [local_character.GetCulture.GetName] lao ra từ công sự gần nhất, xông thẳng vào một bọn thảo khấu và cướp đường đang hoảng loạn."
  travel_events_oltner_2.1150.a: "\"Chúng ta phải giúp họ, xông lên!\""
  travel_events_oltner_2.1150.b: "\"Cứ chờ đã, rồi ta sẽ lục soát xác sau.\""
  travel_events_oltner_2.1150.c: "\"[retinue_member.GetFirstNameNoTooltip], giúp họ đi! Còn chúng ta thì… ở lại đây.\""
  travel_events_oltner_2.1150.d: "\"Đây không phải trận chiến của ta.\""
  cultural_acceptance_gain_assisted_battle: "Hỗ trợ giao tranh chống cướp trong lúc [travel|E]"
  travel_events_oltner_2.1150.a.success: "Ngài giết sạch bọn cướp"
  travel_events_oltner_2.1150.a.failure: "Bọn cướp giết chết chỉ huy rồi bỏ chạy"
  travel_events_oltner_2.1150.b.success: "Quân đồn trú giành chiến thắng"
  travel_events_oltner_2.1150.b.failure: "Bọn cướp giành chiến thắng"
  travel_events_oltner_2.1150.c.success: "[retinue_member.GetFirstName] chém chết thủ lĩnh bọn cướp"
  travel_events_oltner_2.1150.c.failure: "[retinue_member.GetFirstName] bị \"hy sinh một cách bi thảm\""

  travel_events_oltner_2.1160.t: "Gắn Kết Bên Đường"
  travel_events_oltner_2.1160.desc: "Khi băng qua một lối đi đầy thử thách tại [location.GetName], ta nghe thấy tiếng cười phía trước. [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] của ta là [entourage_member_1.GetFirstName] và [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] của ta là [entourage_member_2.GetFirstName] đang cùng nhau tìm cách vượt qua [location.Custom('GetRandomCrossingToBridge')].\n\n\"[entourage_member_1.GetFirstNameNoTooltip], ý tưởng dựng cầu tạm của ngươi thật tuyệt!\" [entourage_member_2.GetFirstNameNoTooltip] reo lên. [entourage_member_1.GetFirstNameNoTooltip] cười khẽ đáp lại, \"Còn sự lanh trí của ngươi với mấy thứ [location.Custom('GetRandomImprovisedBridgeMaterial')] kia mới là thứ gắn kết tất cả lại!\"\n\nCó vẻ như chướng ngại này đã mở ra một Tình bạn mới!"
  travel_events_oltner_2.1160.a: "\"Sự khéo léo của các ngươi thật đáng khen!\""
  travel_events_oltner_2.1160.b: "\"Đừng có giao du với kẻ dưới mình!\""
  travel_events_oltner_2.1160.c: "\"Quả thực việc này sẽ giúp hành trình nhanh hơn.\""
  bridge_crossing_river: "một đoạn vượt sông hiểm hóc"
  bridge_crossing_desert: "một khe cát nguy hiểm"
  bridge_crossing_desert_mountains: "một hẻm núi chênh vênh"
