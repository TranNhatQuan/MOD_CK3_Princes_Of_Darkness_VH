l_english:
 ### Battle Poi - BP3
  TRAVEL_POINT_OF_INTEREST_TT_poi_battles: "#T Trận chiến tại $BattlePoiProvince$#!\n$BattlePoiInfo$\n$BattlePoiDescription$\n\n"
  BattlePoiInfo: "#emp $BattlePoiVictoriousSide$\n$BattlePoiLosingSide$\n$BattlePoiDate$#!"
  BattlePoiVictoriousSide: "Bên chiến thắng: [Province.MakeScope.Var('battle_poi_winner').Char.GetName]"
  BattlePoiLosingSide: "Bên bại trận: [Province.MakeScope.Var('battle_poi_loser').Char.GetName]"
  BattlePoiDate: "Ngày: [Province.Custom('OrdinalIndicatorPoI')] tháng [Province.Custom('MonthBattlePoI')], năm [Province.MakeScope.Var('battle_poi_date_year').GetValue] SCN"
  BattlePoiDescription: "#weak [Province.Custom('BattlePoIDescriptionLocIntro')] [Province.Custom('BattlePoIDescriptionLocMid')] [Province.Custom('BattlePoIDescriptionLocOutcome')] [Province.Custom('BattlePoIDescriptionLocOutro')]#!"


  poi_battles.visit: "Đã viếng thăm chiến trường tại [province.GetNameNoTooltip]"
  poi_battles.learn: "Học hỏi từ trận chiến tại [province.GetNameNoTooltip]"
  OrdinalIndicatorPoIST: "[Province.MakeScope.Var('battle_poi_date_day').GetValue]"
  OrdinalIndicatorPoIND: "[Province.MakeScope.Var('battle_poi_date_day').GetValue]"
  OrdinalIndicatorPoIRD: "[Province.MakeScope.Var('battle_poi_date_day').GetValue]"
  OrdinalIndicatorPoIFallback: "[Province.MakeScope.Var('battle_poi_date_day').GetValue]"

  BattlePoiProvince: "[Province.GetNameNoTooltip]"

  BattlePoiCommander: "[Province.MakeScope.Var('battle_poi_winner').Char.GetTitledFirstNameNoTooltip]"
  BattlePoiCommanderHisHer: "[Province.MakeScope.Var('battle_poi_winner').Char.GetHerHis]"
  BattlePoiCommanderCulture: "[Province.MakeScope.Var('battle_poi_winner').Char.GetCulture.GetNameNoTooltip]"
  BattlePoiEnemyCommander: "[Province.MakeScope.Var('battle_poi_loser').Char.GetTitledFirstNameNoTooltip]"
  BattlePoiEnemyCommanderSheHe: "[Province.MakeScope.Var('battle_poi_loser').Char.GetSheHe]"
  BattlePoiEnemyCommanderHisHer: "[Province.MakeScope.Var('battle_poi_loser').Char.GetHerHis]"
  BattlePoiEnemyCommanderCulture: "[Province.MakeScope.Var('battle_poi_loser').Char.GetCulture.GetNameNoTooltip]"

  BattlePoiBraveKnight: "[Province.MakeScope.Var('battle_poi_brave_knight').Char.GetName]"

 # Intro
  BattlePoiDescriptionIntro1: "Hai phe giao tranh tại $BattlePoiProvince$, một bên do $BattlePoiCommander$ chỉ huy, bên còn lại do $BattlePoiEnemyCommander$ lãnh đạo."
  BattlePoiDescriptionIntroAttacker2: "$BattlePoiCommander$ phát động một đợt tấn công dữ dội nhằm vào quân đội của $BattlePoiEnemyCommander$."
  BattlePoiDescriptionIntroDefender2: "$BattlePoiCommander$ tổ chức một tuyến phòng thủ xuất sắc để chống lại đạo quân đang tiến đến của $BattlePoiEnemyCommander$."
  BattlePoiDescriptionIntroAttackerFallback: "$BattlePoiCommander$ dũng cảm dẫn dắt binh sĩ của $BattlePoiCommanderHisHer$ xông lên tấn công đạo quân $BattlePoiEnemyCommanderCulture$ do $BattlePoiEnemyCommander$ chỉ huy."
  BattlePoiDescriptionIntroDefenderFallback: "$BattlePoiCommander$ dũng cảm dẫn dắt binh sĩ của $BattlePoiCommanderHisHer$ phòng thủ trước đạo quân $BattlePoiEnemyCommanderCulture$ của $BattlePoiEnemyCommander$."

 # Key Moment
  BattlePoiDescriptionLocArchers: "Khoảnh khắc then chốt của trận chiến là khi các cung thủ $BattlePoiCommanderCulture$ luồn vòng qua được kẻ địch, "
  BattlePoiDescriptionLocHeavyInfantry: "Trận chiến được định đoạt khi một đội bộ binh nặng $BattlePoiCommanderCulture$ phá vỡ hàng ngũ đối phương,"
  BattlePoiDescriptionLocLightCavalry: "Kết cục được quyết định khi kỵ binh $BattlePoiCommanderCulture$ vòng ra sau đội hình quân địch,"
  BattlePoiDescriptionLocHeavyCavalry: "Trận chiến khép lại khi kỵ binh nặng $BattlePoiCommanderCulture$ xé toạc chiến tuyến và lao thẳng vào trung tâm đội hình đối phương,"
  BattlePoiDescriptionLocPikemen: "Chiến thắng được đảm bảo khi đội thương binh $BattlePoiCommanderCulture$ đẩy lùi đợt xung phong của kẻ địch,"
  BattlePoiDescriptionLocArchersKnight: "Khoảnh khắc then chốt của trận chiến là khi các cung thủ $BattlePoiCommanderCulture$ do $BattlePoiBraveKnight$ chỉ huy luồn vòng qua được kẻ địch, "
  BattlePoiDescriptionLocHeavyInfantryKnight: "Trận chiến được định đoạt khi một đội bộ binh nặng $BattlePoiCommanderCulture$ do $BattlePoiBraveKnight$ dẫn đầu phá vỡ hàng ngũ đối phương,"
  BattlePoiDescriptionLocLightCavalryKnight: "Kết cục được quyết định khi kỵ binh $BattlePoiCommanderCulture$ do $BattlePoiBraveKnight$ chỉ huy vòng ra sau đội hình quân địch,"
  BattlePoiDescriptionLocHeavyCavalryKnight: "Trận chiến khép lại khi kỵ binh nặng $BattlePoiCommanderCulture$ do $BattlePoiBraveKnight$ dẫn đầu xé toạc chiến tuyến và lao thẳng vào trung tâm đội hình đối phương,"
  BattlePoiDescriptionLocPikemenKnight: "Chiến thắng được đảm bảo khi đội thương binh $BattlePoiCommanderCulture$ do $BattlePoiBraveKnight$ chỉ huy đẩy lùi đợt xung phong của kẻ địch,"
  BattlePoiDescriptionLocVarangian: "Trận chiến kết thúc khi một toán Vệ binh Varangian do $BattlePoiBraveKnight$ dẫn đầu xuyên phá chiến tuyến và tiến sâu vào đội hình đối phương,"
  BattlePoiDescriptionLocBerserker: "Trận chiến bất ngờ rẽ sang hướng khác khi $BattlePoiBraveKnight$ lao thẳng qua hàng ngũ quân $BattlePoiEnemyCommanderCulture$,"
  BattlePoiDescriptionLocMidFallback: "Hai bên bào mòn lẫn nhau, và cuối cùng quân $BattlePoiCommanderCulture$ bao vây được kẻ địch"

 # Outcome
  BattlePoiDescriptionLocOutcomeBerserker: "một mình phá tan tinh thần quân địch khi hạ gục hàng chục chiến binh đối phương,"
  BattlePoiDescriptionLocOutcomeBerserkerFled: "và một mình phá tan tinh thần quân địch khi hạ gục hàng chục chiến binh đối phương."
  BattlePoiDescriptionLocOutcomeDevastation: "tiêu diệt hoàn toàn quân thù,"
  BattlePoiDescriptionLocOutcomeDevastationFled: "và tiêu diệt đội quân đối phương."
  BattlePoiDescriptionLocOutcomeChaos: "gây ra tổn thất nặng nề cho kẻ địch,"
  BattlePoiDescriptionLocOutcomeChaosFled: "và gây ra tổn thất nặng nề cho kẻ địch."
  BattlePoiDescriptionLocOutcomeLoss: "làm tan vỡ tinh thần chiến đấu của đối phương,"
  BattlePoiDescriptionLocOutcomeLossFled: "và làm tan vỡ tinh thần chiến đấu của đối phương."

 # Outro
  BattlePoiDescriptionLocOutroImprisoned: "và bắt giữ $BattlePoiEnemyCommander$."
  BattlePoiDescriptionLocOutroSlain: "và giết chết $BattlePoiEnemyCommander$."
  BattlePoiDescriptionLocOutroFledChaos: "Giữa cơn hỗn loạn, $BattlePoiEnemyCommander$ đã kịp thời đào thoát cùng những cận thần thân cận nhất của $BattlePoiCommanderHisHer$."
  BattlePoiDescriptionLocOutroFledOrganized: "Dù chịu tổn thất nặng nề, $BattlePoiEnemyCommander$ vẫn kịp tổ chức một cuộc rút lui có trật tự."


