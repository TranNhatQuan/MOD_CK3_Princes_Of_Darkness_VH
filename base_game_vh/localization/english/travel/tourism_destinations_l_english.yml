l_english:
  building_holy_site_mahabodhi_temple_destination_desc: "Lang thang qua khu thánh địa của [GetBuilding('holy_site_mahabodhi_temple_01').GetName], ta cảm nhận được sự thanh tịnh nơi đây. Nơi Đức Phật chứng ngộ dưới gốc Bồ-đề là chốn bình yên sâu sắc. Những hoa văn tinh xảo kể lại hành trình giác ngộ của Người nhắc ta nhớ con đường tâm linh mà ai cũng phải bước qua."
  building_goguryeo_tomb_destination_desc: "Một kim tự tháp khổng lồ chiếm lĩnh cảnh quan từ xa, dù được gọi là [GetBuilding('goguryeo_tomb_01').GetName] nhưng không ai biết chắc vị vua nào an táng tại đây. Tuy nhiên, quy mô đồ sộ và kiến trúc độc đáo của lăng, cùng với các bích họa bên trong khắc họa kỵ binh uy dũng, kể lại câu chuyện về quá khứ huy hoàng nơi đất này."
  building_buddha_kamakura_destination_desc: "Bước vào đại điện chứa [GetBuilding('buddha_kamakura_01').GetName], ta lập tức choáng ngợp bởi kích thước khổng lồ. Ngồi trong tư thế hoa sen, Đức Phật vẫn cao hơn nhiều người gộp lại. Tượng đồng khổng lồ khiến lòng ta kính ngưỡng, đồng thời thán phục tay nghề tuyệt đỉnh đã tạo nên kiệt tác này."
  building_pyramid_lingapura_destination_desc: "[GetBuilding('pyramid_lingapura_01').GetName] là điểm nhấn chính của thành phố, và khi bước vào khuôn viên, ta không khỏi trầm trồ trước kim tự tháp đồ sộ vươn cao. Nhiều đền nhỏ và miếu thờ phủ quanh bậc thang dẫn lên đỉnh, nơi đền chính đặt lingam vàng trên bệ cao uy nghi."
  building_maijishan_grottoes_destination_desc: "Từ xa núi Maijishan sừng sững giữa cảnh quan, càng đến gần càng thấy nhiều hơn [GetBuilding('maijishan_grottoes_01').GetName] khắc vào sườn núi đỏ. Số hang động nhiều đến không đếm xuể, từng lối vào được trang trí bằng vô số tượng đất sét."
  building_three_pagodas_dali_destination_desc: "Vươn lên trước khu đền Congsheng, [GetBuilding('three_pagodas_dali_01').GetName] là nét đặc trưng của Đại Lý, đồng thời là công trình vĩ đại nhất của vương quốc. Tháp chính 16 tầng nhắc ta biết sự nhỏ bé của một cá nhân giữa cõi đời rộng lớn. Khu vực xung quanh đầy khách hành hương và tăng lữ, kẻ vô tình với công trình, người thì trầm trồ lần đầu chiêm ngưỡng."
  building_iron_lion_cangzhou_destination_desc: "Đúc bằng sắt, [GetBuilding('iron_lion_cangzhou_01').GetName] khổng lồ đã tồn tại qua động đất và lụt lội. Nghe thương nhân địa phương kể, con sư tử vĩ đại còn được xem như vật trấn thủ chống nước biển dâng."
  building_dengfeng_observatory_destination_desc: "Bước vào thành, [GetBuilding('dengfeng_observatory_01').GetName] hiện ra từ xa. Nơi này được cho là trung tâm trái đất, các nhà thiên văn Trung Hoa quan sát bầu trời hàng thế kỷ. Ban ngày, công trình như đồng hồ mặt trời khổng lồ; ban đêm là đài quan sát sao trời."
  building_muara_takus_destination_desc: "[GetBuilding('muara_takus_01').GetName] nhắc ta nhớ sức mạnh của đế quốc Srivijaya, đồng thời là trung tâm thờ phụng quan trọng. Khi đến gần, ta vây quanh bởi hành hương từ các đảo lân cận. Suốt nhiều thế kỷ, khu đền nơi đây là trung tâm quyền lực tôn giáo và thế tục."
  building_stone_pagoda_destination_desc: "[GetBuilding('stone_pagoda_01').GetName] được cho là cổ nhất vùng này, lớp tường trắng tinh phản chiếu nắng chói. Ta được biết, nó được xây trên ao cạn theo lệnh một vị vua xưa, và thợ khắp các vương quốc Triều Tiên góp công tạo nên."
  building_thuriang_kilns_destination_desc: "Ta không khỏi ngưỡng mộ vẻ đẹp đền đài và hào nước đầy Sukhotai. Thành phố rõ ràng không chỉ là trung tâm tín ngưỡng, qua khu vực nhộn nhịp ta thấy [GetBuilding('thuriang_kilns_01').GetName] nơi các bậc thầy chế tạo đồ gốm Celadon tuyệt mỹ xuất khẩu khắp vùng."
  building_yuelu_academy_destination_desc: "Đi qua sân chính [GetBuilding('yuelu_academy_01').GetName], lòng ta tràn ngập kính trọng với học giả và sinh viên Nho học đến giảng dạy và tranh luận. Dễ hiểu vì sao vô số quan học thụ lợi từ tri thức nơi sân này."
  building_chocolate_hills_destination_desc: "[GetBuilding('chocolate_hills_01').GetName] là cảnh quan kỳ lạ. Hầu hết năm xanh mướt, mùa khô chuyển sang nâu đỏ hoặc gần cam. Ta chưa từng thấy nơi nào như vậy và hoàn toàn bị mê hoặc bởi kỳ quan này."
  building_fanfang_guangzhou_destination_desc: "Minaret không phải cảnh thường thấy ở đây, song tại [GetBuilding('fanfang_guangzhou_01').GetName], tháp của một đền Hồi giáo hiện ra ngay từ phố. Qua khu phố, ta nghe đủ thứ ngôn ngữ Á và Hồi giáo, nơi người ngoại quốc đủ loại sinh sống và làm việc trong đế quốc."
  building_wilwatikta_palace_destination_desc: "Khu đô thị của thành đền rộng lớn và ấn tượng, đi qua khu dân cư đến [GetBuilding('wilwatikta_palace_01').GetName], ta không khỏi suy ngẫm về sự giàu có và quyền lực chính trị của đảo Java cùng dân cư nơi đây."
  building_ha_long_bay_destination_desc: "[GetBuilding('ha_long_bay_01').GetName] đẹp nhất khi quan sát từ biển, nên ta lên thuyền nhỏ ở vịnh Bắc Bộ. Khi tiến vào vịnh, mọi lời nói im bặt, trong im lặng tuyệt đối ta trôi qua cảnh quan karst. Núi non bốn bề hùng vĩ có lẽ là điều đẹp nhất từng thấy."
  building_my_son_sanctuary_destination_desc: "[GetBuilding('my_son_sanctuary_01').GetName] là trung tâm văn minh Chăm nhiều thế kỷ, các vua nối tiếp xây thêm đền và tượng, tạo nên nơi yên bình tuyệt đối. Ta đầy kính trọng khi quan sát các tu sĩ Chăm, hành hương và quan lại thực hiện nghi lễ quanh ta."
  building_gunung_api_destination_desc: "[GetBuilding('gunung_api_01').GetName] được cho là núi thiêng, hình dáng chắc chắn khác lạ so với mọi nơi ta từng đi qua. Đá nhọn, mảnh vươn cao, làm cây cối xung quanh trở nên nhỏ bé."
  building_suwalesi_megaliths_destination_desc: "Một loại Megalith độc đáo rải rác khắp thung lũng này. Những bức tượng đá lớn, khuôn mặt giản lược, xung quanh ta. Một dân làng bảo có nơi hiến tế, số khác mục đích còn là bí ẩn với cả dân cư địa phương."
  building_izumo_taisha_destination_desc: "Ta đến đúng dịp lễ hội, đâu đâu cũng thấy dân chúng mừng thần hôn nhân Kotoamatsuikami. Qua đám đông, cuối cùng ta đến [GetBuilding('izumo_taisha_01').GetName], ngôi đền cổ hơn bất kỳ nơi nào khác trên đảo."
  building_confucius_temple_destination_desc: "Khó mà không cảm thấy kính trọng tại [GetBuilding('confucius_temple_01').GetName]. Đây là thánh điện cổ xưa của bậc thầy vĩ đại và tấm gương mẫu mực đã ảnh hưởng thế giới. Ta lặng lẽ xếp hàng cùng hành hương khác chiêm bái mộ phần của Người và đồ đệ."
  building_citadel_linan_destination_desc: "Trên sườn đồi Phượng Hoàng, [GetBuilding('citadel_linan_01').GetName] là trung tâm quyền lực hành chính không chỉ cho thành này mà cả vùng lân cận. Bước qua cổng, ta bao quanh bởi quan chức và học giả, tất cả thực hiện vai trò lễ nghi vị trí của mình."
  building_sanchi_stupa_destination_desc: "Mái vòm [GetBuilding('sanchi_stupa_01').GetName] là điểm nhấn trên đồi ngoài khu định cư Sanchi. Giữa đông đảo hành hương và tăng lữ, nhiều người khẳng định khu đền đã được sử dụng hàng ngàn năm."
  building_boudhanath_destination_desc: "Mái vòm khổng lồ [GetBuilding('boudhanath_01').GetName] chứa di cốt và thánh tích nhiều Phật lịch sử, cũng là công trình cao nhất Kathmandu. Vươn cao trên thành phố, nó chứng tỏ tầm quan trọng Phật giáo. Khi đến gần, ta bao quanh bởi khách, hành hương và thương nhân dừng nghỉ và cầu nguyện."
  building_mont_st_michel_destination_desc: "Tiến gần đảo thủy triều [GetBuilding('mont_st_michel_01').GetName] lúc rút nước, nhà thờ và tường thành tráng lệ hiện ra trên chân trời, nhắc nhở quyền năng Chúa trên Trời và Đất. Nơi đây vừa là trung tâm tôn giáo quan trọng vừa là pháo đài cho tăng nhân và ngư dân địa phương."
  building_holy_site_st_peters_basilica_destination_desc: "Sừng sững trên đồi Vatican, trên mộ Thánh Phêrô, [GetBuilding('holy_site_st_peters_basilica_01').GetName] nhắc nhở quyền lực của Giáo hội phương Tây và các giáo hoàng. Linh mục và nữ tu khắp nơi, cùng với kẻ ăn xin cầu xin bố thí từ hành hương."
  building_holy_site_imam_ali_mosque_destination_desc: "Bước vào thành, mái vòm vàng [GetBuilding('holy_site_imam_ali_mosque_01').GetName] tỏa sáng như ngọn hải đăng. Thánh địa này, nơi Imam [ali.GetFirstName] an nghỉ, đầy hành hương bày tỏ lòng kính trọng. Không khí ngập tràn sùng đạo, những chữ khắc tinh xảo trên tường nói lên lòng thành với Thần linh."
  building_yazd_mosque_destination_desc: "Ngước nhìn tháp trên cổng lớn [GetBuilding('yazd_mosque_01').GetName], lòng ta trào dâng kính trọng. Trên đường tới, dân địa phương nhắc rằng thành phố là trung tâm tôn giáo từ lâu lắm. Hôm nay, đường phố vẫn đầy hành hương và linh mục, những tín đồ xa xôi đến thăm nơi tuyệt mỹ này."
  building_holy_site_great_mosque_of_mecca_destination_desc: "Nhìn [GetBuilding('holy_site_great_mosque_of_mecca_01').GetName], lòng ta trào dâng kinh ngạc. Hình ảnh Kaaba, thánh địa từ thuở xưa, chứng minh sức sống bền bỉ của [GetReligionByKey('islam_religion').GetName]. Dòng hành hương, ai cũng tìm sự gần gũi thần thánh, chuyển động như một thể thống nhất trong sùng tín."
  building_holy_site_great_mosque_of_cordoba_destination_desc: "Lang thang qua đại sảnh [GetBuilding('holy_site_great_mosque_of_cordoba_01').GetName], rừng cột và vòm đỏ trắng khiến ta ngỡ ngàng trước kiến trúc tài tình. Sự hòa trộn thiết kế [GetReligionByKey('islam_religion').GetName] và [visigothic_culture.GetName] cho thấy vùng đất giàu lịch sử và văn hóa."
  building_holy_site_great_mosque_of_djenne_destination_desc: "Thấy [GetBuilding('holy_site_great_mosque_of_djenne_01').GetName] sừng sững giữa lòng thành, ta trầm trồ. Kiến trúc adobe độc đáo, phản chiếu cảnh Sahel, là biểu tượng tự hào của đức tin và tài năng xây dựng."
  building_holy_site_great_mosque_of_samarra_destination_desc: "Đứng trước [GetBuilding('holy_site_great_mosque_of_samarra_01').GetName], tháp xoắn độc đáo vươn cao. Kiến trúc riêng biệt làm nơi đây trở thành viên ngọc thế giới [GetReligionByKey('islam_religion').GetName]."
  building_holy_site_cologne_cathedral_destination_desc: "Tiến gần [GetBuilding('holy_site_cologne_cathedral_01').GetName], tháp chưa hoàn thiện và công trường nhắc ta tham vọng của thời đại. Giữa giàn giáo và đá, ta thấy tầm vóc uy nghi hình thành, biểu tượng đức tin tồn tại hàng thế kỷ."
  building_holy_site_canterbury_cathedral_destination_desc: "Bước qua đại sảnh [GetBuilding('holy_site_canterbury_cathedral_01').GetName], ta cảm nhận sức nặng lịch sử. Nền tảng của đức tin Kitô giáo chứa đầy chuyện tử đạo và thánh nhân. Hoa văn tinh xảo và không khí trang nghiêm vang vọng lời cầu nguyện của vô số hành hương."
  building_holy_site_prophetic_mosque_destination_desc: "[GetBuilding('holy_site_prophetic_mosque_01').GetName], với sân thanh tịnh và vòm uyển chuyển, là nơi thiêng liêng. Nơi Muhammad đi và giảng đạo, không khí đầy an bình. Tín đồ tụ họp trang nghiêm, lời cầu như thì thầm dưới bầu trời rộng lớn."
  building_doges_palace_destination_desc: "Vẻ tráng lệ [GetBuilding('doges_palace_01').GetName] khiến ta câm nín. Mặt tiền trang trí, nội thất xa hoa biểu tượng quyền lực và thịnh vượng Venice. Tác phẩm tinh xảo và trang trí sang trọng nói lên quyền lực và sự giàu có của lãnh đạo."
  building_walls_of_genoa_destination_desc: "Mạnh mẽ [GetBuilding('walls_of_genoa_01').GetName], hàng rào bảo vệ thành phố, thể hiện sức mạnh quân sự và chiến lược tài tình của lãnh đạo."
  building_visby_ringmur_destination_desc: "[GetBuilding('visby_ringmur_01').GetName] bao quanh thị trấn, bằng chứng đá cho tầm quan trọng thương mại và phòng thủ. Đi dọc tường, ta ngưỡng mộ tay nghề thợ xây và tầm nhìn lãnh đạo, bảo đảm an toàn và thịnh vượng cho dân."
  building_walls_of_benin_destination_desc: "Vĩ đại [GetBuilding('walls_of_benin_01').GetName] trải dài tầm mắt, công sức khổng lồ của dân địa phương. Công trình đất đồ sộ, lớn hơn nhiều nơi từng thấy, là biểu tượng kiêu hãnh sức mạnh và trí tuệ đất này."
  building_theodosian_walls_destination_desc: "Hùng vĩ [GetBuilding('theodosian_walls_01').GetName] bảo vệ Constantinople, kỳ công kỹ thuật. Vóc dáng sừng sững và nhiều lớp cho thấy thành phố sẵn sàng mọi bao vây. Tầm nhìn khi dựng phòng thủ rõ ràng."
  building_aurelian_walls_destination_desc: "Bao quanh thành vĩnh hằng, [GetBuilding('aurelian_walls_01').GetName] vững vàng trước thời gian và loạn lạc. Phòng thủ cổ xưa, mở rộng và củng cố qua năm tháng, chứa đựng lịch sử phong phú, pháo đài di sản Rome bền lâu."
  building_the_colosseum_destination_desc: "Trước mặt ta [GetBuilding('the_colosseum_01').GetName], tàn tích đồ sộ của thời xưa. Một nơi huy hoàng ngày trước, giờ chỉ còn nửa sụp, nhắc về quyền lực và tầm ảnh hưởng [GetTitleByKey('h_roman_empire').GetNameNoTier], vang vọng câu chuyện quá khứ vừa huy hoàng vừa nhiễu nhương."
  building_iron_pillar_of_delhi_destination_desc: "Cột sắt [GetBuilding('iron_pillar_of_delhi_01').GetName] đứng hiên ngang trước thử thách của thời gian, hợp kim chống gỉ của ngươi là một kỳ quan luyện kim. Được dựng để tôn vinh Vua Chandragupta II, nó là minh chứng cho trí tuệ và tài nghệ cao siêu của các nghệ nhân thời bấy giờ."
  building_iron_pillar_of_dhar_destination_desc: "Cột sắt [GetBuilding('iron_pillar_of_dhar_01').GetName] đứng như người anh em ít được biết nhưng không kém phần kỳ thú so với bản tại Delhi. Minh chứng cho sự tài tình của các nghệ nhân cổ xưa này vẫn là đề tài tò mò cho biết bao lữ khách và học giả."
  building_the_pyramids_destination_desc: "[GetBuilding('the_pyramids_01').GetName], cổ xưa và uy nghi, vươn lên từ cát như đã tồn tại hàng thiên niên kỷ. Những lăng mộ của các pharaoh, nay đã mất lớp đá vôi bóng, vẫn khiến người ta kính phục, là ký ức còn sót lại của một nền văn minh hùng vĩ."
  building_stonehenge_destination_desc: "Bí ẩn [GetBuilding('stonehenge_01').GetName] đứng trên Đồng bằng Salisbury, mục đích của nó đã bị thời gian xóa nhòa. Những tảng đá lớn này, xếp thành hình phức tạp, nói lên kiến thức cổ xưa và mối liên hệ với thiên thể, từ lâu trước thời của ngươi."
  building_offas_dyke_destination_desc: "Đi qua cảnh quan, [GetBuilding('offas_dyke_01').GetName] hiện lên như một công trình đất đáng chú ý, một ranh giới được tạo ra thời Vua [offa.GetFirstName]. Tuy nay bị bào mòn một phần nhưng vẫn nhận ra, nó đánh dấu tuyến phòng thủ và phân định cổ xưa, hé lộ những cuộc tranh quyền lực thời bấy giờ."
  building_hadrians_wall_destination_desc: "Khi ta đi dọc theo tàn tích [GetBuilding('hadrians_wall_01').GetName], ta suy ngẫm uy lực của tổ tiên [roman_culture.GetName]. Hàng rào kiên cố ngày xưa, nay chỉ còn loạt tàn tích, từng là biên giới phía bắc, minh chứng cho phạm vi và giới hạn của một đế chế."
  building_petra_destination_desc: "Thành cổ [GetBuilding('petra_01').GetName], khắc vào vách đá đỏ hồng, là cảnh tượng tráng lệ. Al-Khazneh nổi tiếng, dù phai mờ theo thời gian, vẫn vang vọng sự thịnh vượng của một thời đại đã qua, là kỳ quan kỹ thuật và nghệ thuật."
  building_buddhas_of_bamian_destination_desc: "Những bức tượng khổng lồ [GetBuilding('buddhas_of_bamian_01').GetName], khắc vào vách đá, đứng như minh chứng lặng lẽ cho lịch sử tôn giáo và văn hóa nơi này. Dù trải qua mài mòn của thời gian, tài nghệ và lòng tôn kính của các nghệ nhân xưa vẫn hiện hữu trong những tác phẩm tuyệt vời."
  building_alhambra_destination_desc: "[GetBuilding('alhambra_01').GetName], với kiến trúc Moor tinh xảo và vườn tược xanh mát, là viên ngọc của Granada. Toàn bộ khu cung điện, kết hợp giữa hình thức và công năng, phản ánh gu thẩm mỹ tinh tế và quyền lực của các vua."
  building_citadel_of_aleppo_destination_desc: "Ngôi thành uy nghi [GetBuilding('citadel_of_aleppo_01').GetName], pháo đài trên đồi, chiếm lĩnh cảnh quan thành phố. Những bức tường đồ sộ và công trình vững chắc, trải qua thời gian, chứng kiến vô số cuộc bao vây và sức sống bền bỉ của thành cổ này."
  building_house_of_wisdom_destination_desc: "Ngôi [GetBuilding('house_of_wisdom_01').GetName] tại Baghdad đứng như ngọn hải đăng tri thức. Thư viện và trung tâm học giả rộng lớn này, lập bởi các Caliph Abbasid, thu hút học giả khắp nơi, háo hức khám phá kho tàng văn bản và học thuật."
  building_the_tower_of_london_destination_desc: "[GetBuilding('the_tower_of_london_01').GetName], với kiến trúc vững chãi, vừa là cung điện hoàng gia vừa là nhà tù. Không khí trong các bức tường nặng trĩu lịch sử, câu chuyện về vua, hoàng hậu và tù nhân khắc vào đá."
  building_london_bridge_destination_desc: "[GetBuilding('london_bridge_01').GetName], với các vòm chắc chắn và cửa hàng nhộn nhịp, bắc qua sông Thames như mạch sống xuyên trung tâm London. Nó không chỉ là cầu bắc mà còn là trung tâm thương mại, nơi thương nhân, lữ khách và dân chúng tụ hội."
  building_notre_dame_destination_desc: "Ngôi [GetBuilding('notre_dame_01').GetName] uy nghi, với các ngọn tháp cao và mặt tiền tráng lệ, là kiệt tác kiến trúc Gothic. Bên trong, không khí vang vọng sự sùng đạo, từng cửa kính màu và tác phẩm điêu khắc kể một câu chuyện thiêng liêng."
  building_brihadeeswarar_temple_destination_desc: "[GetBuilding('brihadeeswarar_temple_01').GetName], công trình đá granite khổng lồ, sừng sững trên Thanjavur. Tháp vimana cao và các phù điêu tinh xảo nói lên tráng lệ của triều đại [chola_dynasty.GetName], thời mà nghệ thuật và lòng sùng đạo đạt tới cảnh giới tuyệt vời."
  building_shwedagon_pagoda_destination_desc: "[GetBuilding('shwedagon_pagoda_01').GetName], với ngọn tháp vàng vươn tới trời cao, là kỳ quan đáng chiêm ngưỡng. Nơi linh thiêng này, chứa xá lợi Phật, là nơi hành hương và sùng đạo, phản ánh trái tim tâm linh của Miến Điện."
  building_ananda_temple_destination_desc: "[GetBuilding('ananda_temple_01').GetName], với sikhara lấp lánh và bậc thềm tráng lệ, là minh chứng cho tài năng kiến trúc triều đại [pagan_dynasty.GetName]. Ngôi đền tuyệt mỹ này, trang trí chạm khắc tinh xảo, là ngọn hải đăng Phật giáo Nguyên thủy."
  building_the_friday_mosque_destination_desc: "[GetBuilding('the_friday_mosque_01').GetName], với công trình đồ sộ và ngọn tháp thanh lịch, là nơi thờ phượng trung tâm. Mỗi tuần, nơi đây trở thành trung tâm cầu nguyện, tín đồ tụ họp đông đảo, khẳng định sức mạnh và đoàn kết cộng đồng [GetReligionByKey('islam_religion').GetName]."
  building_khajuraho_destination_desc: "[GetBuilding('khajuraho_01').GetName], với những tác phẩm điêu khắc tinh xảo và táo bạo, là lễ hội của cuộc sống, tình yêu và tôn thờ. Những kỳ quan kiến trúc này, do các vua Chandela xây dựng, là minh chứng cho tầm nhìn nghệ thuật và tinh thần của thời đại."
  building_palace_of_aachen_destination_desc: "[GetBuilding('palace_of_aachen_01').GetName] là di sản của [charlemagne.GetFirstNameNicknamed]. Nguyện đường tráng lệ, với thiết kế bát giác và mái vòm, phản ánh tham vọng của hoàng đế trong việc khôi phục vinh quang [GetTitleByKey('h_roman_empire').GetNameNoTier]."
  building_hagia_sophia_christian_destination_desc: "Khi ta dạo bước trong ngôi [GetBuilding('hagia_sophia_01').GetName] tráng lệ, sự hùng vĩ khiến ta kinh ngạc. Mái vòm rộng dường như chạm tới trời, các khảm tinh xảo lấp lánh dưới ánh sáng. Ta cảm nhận chiều sâu tâm linh nơi này, vang vọng hàng thế kỷ thờ phượng Kitô và uy nghi Byzantine."
  building_hagia_sophia_islamic_destination_desc: "Bước vào [GetBuilding('hagia_sophia_02').GetName], nay là thánh đường Hồi giáo, ta bị mê hoặc bởi sự biến đổi của nó. Ngọn tháp vươn cao, bổ sung cho mái vòm hùng vĩ. Bên trong, chữ Hồi giáo và trang trí hòa hợp với kiến trúc Byzantine, tạo ra bầu không khí tôn kính và giao thoa văn hóa sâu sắc."
  building_dome_of_the_rock_destination_desc: "[GetBuilding('dome_of_the_rock_01').GetName], với mái vòm vàng lấp lánh dưới ánh mặt trời, là địa danh linh thiêng ở Jerusalem. Ngôi đền này, chứa tảng đá thánh, là nơi có ý nghĩa tâm linh sâu sắc, được tôn kính bởi cả Hồi giáo và Do Thái."
  building_temple_in_jerusalem_destination_desc: "Tàn tích [GetBuilding('temple_in_jerusalem_01').GetName], linh thiêng với cả Do Thái và Kitô giáo, gợi lên cảm giác lịch sử và tâm linh. Bức tường Tây, tất cả còn lại của ngôi đền tráng lệ xưa, nhắc nhở xúc động về quá khứ sóng gió của thành phố."
  building_rammelsberg_mines_destination_desc: "[GetBuilding('rammelsberg_mines_01').GetName] là một tổ ong hoạt động nhộn nhịp, đào sâu vào lòng đất tìm các quặng quý. Sự khéo léo và bền bỉ của các thợ mỏ nơi đây là điều thiết yếu cho sự thịnh vượng và nghề thủ công của vùng đất này."
  building_guiyang_mines_destination_desc: "[GetBuilding('guiyang_mines_01').GetName] đã để lại dấu ấn rõ rệt trên khu định cư nơi này suốt nhiều thế kỷ. Những đồng tiền được đúc ở đây đã lưu hành khắp Trung Hoa từ thời Tây Hán."
  building_kaibao_mines_destination_desc: "[GetBuilding('kaibao_mines_01').GetName] là nguồn bạc cho kho bạc hoàng triều hơn một nghìn năm và điều này rõ ràng khi ta du hành qua vùng này. Bạc và đồng tiền thu hút sự giàu có. Thương nhân và nghệ nhân ở đây thịnh vượng nhờ những gì thợ mỏ đem tới cho lò luyện."
  building_zijinshan_mines_destination_desc: "Nếu không có [GetBuilding('zijinshan_mines_01').GetName] cùng vàng của nó, có lẽ vùng này không phát triển như nay. Khu định cư rõ ràng chịu ảnh hưởng từ ngành khai thác và các kỹ sư, nghệ nhân từ các vùng lân cận."
  building_liangzhe_mines_destination_desc: "[GetBuilding('liangzhe_mines_01').GetName] cùng thương vụ bạc làm cho vùng này phát triển thịnh vượng. Bạc thu hút thợ thủ công, thợ mỏ ở đây và những đồng tiền đúc là điều thu hút tất cả thương nhân."
  building_hanxing_mines_destination_desc: "[GetBuilding('hanxing_mines_01').GetName]."
  building_kutna_hora_mines_destination_desc: "[GetBuilding('kutna_hora_mines_01').GetName] là nguồn bạc quan trọng, nuôi dưỡng cả thương mại lẫn tiền tệ. Hệ thống đường hầm và giếng, được các thợ mỏ bền bỉ khai thác, minh họa sự tháo vát và lao động thúc đẩy nền kinh tế vùng này."
  building_kremnica_mines_destination_desc: "[GetBuilding('kremnica_mines_01').GetName] nổi tiếng với trữ lượng vàng. Việc khai thác kim loại quý này, biểu tượng của sự giàu sang và quyền lực, hỗ trợ việc đúc tiền và sự tráng lệ của triều đình các vị vua."
  building_baofeng_mines_destination_desc: "Khai thác là nguồn lao động chính tại vùng này, và hầu hết nhà dân tập trung gần [GetBuilding('baofeng_mines_01').GetName]. Dọc bờ sông, những xưởng nghiền bạc chạy bằng nước nối dài khắp các con phố."
  building_jiaodong_mines_destination_desc: "Thường gọi là Thành phố Vàng Thiên đường, [GetBuilding('jiaodong_mines_01').GetName] nổi tiếng với lượng vàng lớn. Thành phố này đã trở thành trung tâm thương mại quan trọng, tập trung quanh việc chế tác và buôn bán kim loại quý."
  building_chihu_mines_destination_desc: "[GetBuilding('chihu_mines_01').GetName] được cho là hoạt động từ thời Tam Quốc, và hơn một thiên niên kỷ nay cung cấp sắt và vũ khí cho các triều đại Trung Hoa. Trong thành phố, điều này hiện hữu khắp nơi, xưởng đúc và lò rèn dọc phố, xe chở quặng sắt đã xuất hiện trước cả khi thấy khu định cư thật sự."
  building_zigong_mines_destination_desc: "[GetBuilding('zigong_mines_01').GetName] đã cung cấp muối cho người Trung Hoa hàng ngàn năm, cảnh quan thành phố bị chi phối bởi các giếng khoan, khu bay hơi và cơ sở hạ tầng chuyên dùng cho khai thác muối."
  building_falun_mines_destination_desc: "[GetBuilding('falun_mines_01').GetName] là mê cung đường hầm tìm đồng. Màu đỏ rực rỡ Falu, chiết xuất từ mỏ, trang trí nhiều công trình nơi đây, nhắc nhở sinh động về tầm quan trọng của mỏ đối với cộng đồng địa phương."
  building_konasamudram_mines_destination_desc: "[GetBuilding('konasamudram_mines_01').GetName] nổi tiếng với đất giàu kim cương. Sự lấp lánh của những viên đá quý này phản ánh không chỉ sự giàu có mà còn tài năng và công sức của những người khai thác."
  building_dean_mines_destination_desc: "[GetBuilding('dean_mines_01').GetName] là nguồn sắt quan trọng. Tiếng búa va và ánh lửa lò rèn không ngừng vang lên, thợ mỏ và thợ rèn miệt mài tạo vật liệu phục vụ quân sự và xây dựng."
  building_phnom_dek_mines_destination_desc: "[GetBuilding('phnom_dek_mines_01').GetName] hay 'Núi Sắt' là nguồn sắt lớn của vùng này. Khi tiến về thành phố, khó tránh khỏi nhiều xe tải nặng đang hướng về đồng bằng quanh Angkor."
  building_schwaz_mines_destination_desc: "[GetBuilding('schwaz_mines_01').GetName] là trung tâm sản xuất bạc. Sự giàu có khai thác từ lòng đất đã biến thành phố này thành trung tâm thương mại nhộn nhịp, thu hút thương nhân và nghệ nhân từ khắp nơi."
  building_argentiera_mines_destination_desc: "[GetBuilding('argentiera_mines_01').GetName] nổi tiếng với các tĩnh mạch chì và bạc dồi dào. Điều kiện khắc nghiệt mà thợ mỏ đối mặt nhấn mạnh sự theo đuổi không ngừng nghỉ của những tài nguyên quý giá này."
  building_srebrenica_mines_destination_desc: "[GetBuilding('srebrenica_mines_01').GetName] là nguồn bạc quan trọng. Lao động không ngừng của thợ mỏ, đào sâu vào lòng đất, nuôi dưỡng sự thịnh vượng của vùng, biến nơi đây thành trung tâm thương mại thiết yếu."
  building_kollur_mines_destination_desc: "[GetBuilding('kollur_mines_01').GetName], tọa lạc trong rừng rậm Kollur, nổi tiếng với kim cương tuyệt mỹ. Đá quý từ mỏ này không chỉ trang trí vương miện các vua mà còn biểu tượng sự giàu có của vùng và tài nghệ của người khai thác."
  building_siderokausia_mines_destination_desc: "[GetBuilding('siderokausia_mines_01').GetName] nhộn nhịp khai thác sắt, thiết yếu cho nhu cầu vùng. Nỗ lực bền bỉ của thợ mỏ quyết tâm tận dụng tài nguyên của đất."
  building_zawar_mines_destination_desc: "[GetBuilding('zawar_mines_01').GetName] là nguồn kẽm và chì cổ xưa. Sự khéo léo của thợ mỏ, khai thác sâu trong lòng đất, rất quan trọng cho sự phát triển và tăng trưởng vùng này."
  building_pansjhir_mines_destination_desc: "[GetBuilding('pansjhir_mines_01').GetName] nổi tiếng với đá lapis lazuli quý giá. Viên đá xanh sống động này, được khao khát vì vẻ đẹp và hiếm có, là báu vật của vùng, được thợ thủ công và thương nhân săn lùng."
  building_nishapur_mines_destination_desc: "[GetBuilding('nishapur_mines_01').GetName] nổi tiếng với đá turquoise tuyệt mỹ. Viên đá sống động này, quý giá trong trang sức và trang trí, phản ánh sự giàu có của văn hóa và tay nghề [persian_culture.GetName]."
  building_ratnapura_mines_destination_desc: "[GetBuilding('ratnapura_mines_01').GetName] lấp lánh hứa hẹn sapphire và ruby. Những viên đá này, chôn sâu trong lòng đất, được săn lùng khắp thế giới, minh chứng cho sự giàu có của vùng đất này."
  building_mogok_mines_destination_desc: "[GetBuilding('mogok_mines_01').GetName] lấp lánh hứa hẹn ruby và sapphire. Những viên đá chôn sâu trong lòng đất này được săn lùng khắp thế giới, và ánh sáng của chúng được cho là vô song."
  building_allaq_mines_destination_desc: "[GetBuilding('allaq_mines_01').GetName], ẩn mình trong núi Allaq, là nguồn đồng quan trọng. Tiếng rì rầm của cuốc trên đá vang khắp không gian, thợ mỏ miệt mài cung cấp kim loại thiết yếu này."
  building_takkeda_mines_destination_desc: "[GetBuilding('takkeda_mines_01').GetName] nhộn nhịp nổi tiếng với các tĩnh mạch bạc phong phú. Kim loại khai thác nơi đây không chỉ nuôi dưỡng nghề thủ công địa phương mà còn đóng góp lớn vào kho bạc vùng."
  building_turda_mines_destination_desc: "[GetBuilding('turda_mines_01').GetName] là nguồn muối quan trọng. 'Vàng trắng' này, cần thiết cho bảo quản và thương mại, đã biến mỏ thành trung tâm kinh tế trọng yếu."
  building_taghaza_mines_destination_desc: "Giữa lòng Sahara, [GetBuilding('taghaza_mines_01').GetName] là nguồn muối khắc nghiệt nhưng quan trọng. Các đoàn lữ hành vượt quãng đường dài tới nơi hoang vu này, tìm kiếm muối quý hơn vàng trong vùng đất này."
  building_phocaea_mines_destination_desc: "[GetBuilding('phocaea_mines_01').GetName] nổi tiếng với nhôm (alum). Quy trình khai thác khoáng chất thiết yếu này, dùng trong nhuộm và thuộc da, đòi hỏi kỹ năng và kiến thức truyền qua nhiều thế hệ."
  building_verespatak_mines_destination_desc: "[GetBuilding('verespatak_mines_01').GetName] là nguồn vàng giàu có. Sự dồi dào này biến vùng thành trung tâm khai thác nhộn nhịp, thu hút các nhà phiêu lưu và thương nhân bởi sức hấp dẫn của sự giàu sang."
  building_suvarnadvipa_mines_destination_desc: "Dọc chân núi Barisan, [GetBuilding('suvarnadvipa_mines_01').GetName] mang đến công việc vất vả nhưng bổ ích cho thợ, đồng thời làm giàu cho các nghệ nhân và thương nhân địa phương."
  building_khetri_mines_destination_desc: "[GetBuilding('khetri_mines_01').GetName] nổi tiếng với trữ lượng đồng dồi dào. Nỗ lực cần cù của thợ mỏ và thợ rèn địa phương, khai thác và tinh luyện kim loại thiết yếu này, duy trì sinh kế của vùng."
  building_trepca_mines_destination_desc: "[GetBuilding('trepca_mines_01').GetName] là nguồn chì và bạc quan trọng. Cộng đồng thợ mỏ địa phương, thành thạo trong địa hình thử thách, đóng vai trò then chốt trong sự thịnh vượng vùng."
  building_rudnik_mines_destination_desc: "[GetBuilding('rudnik_mines_01').GetName] nhộn nhịp khai thác bạc quý. Sự chăm chỉ của thợ mỏ địa phương và sự giàu có họ đem lại đã biến vùng này thành trung tâm kinh tế phát triển."
  building_ijil_mines_destination_desc: "[GetBuilding('ijil_mines_01').GetName] rộng lớn chứa trữ lượng muối phong phú. Thợ mỏ lành nghề đã biến nơi này thành đóng góp quan trọng cho thương mại và phát triển vùng."
  building_cevennes_mines_destination_desc: "Các mỏ địa phương ở [GetBuilding('cevennes_mines_01').GetName] là nguồn bạc thiết yếu. Lao động không ngừng của thợ mỏ và thành quả thu được đóng vai trò quan trọng trong việc duy trì sinh kế vùng."
  building_hetian_mines_destination_desc: "Các mỏ ở [GetBuilding('hetian_mines_01').GetName] là nguồn ngọc bích quý giá nhất tồn tại. Kinh tế địa phương phụ thuộc lớn vào thương vụ này, và thợ mỏ lẫn nghệ nhân ngọc xuất hiện khắp thành phố."
  building_xiuyan_mines_destination_desc: "Loại ngọc khai thác từ [GetBuilding('xiuyan_mines_01').GetName] đã trang trí nghề thủ công bình dân bằng sắc xanh đặc trưng qua nhiều thế kỷ."
  building_itoigawa_mines_destination_desc: "Được các nhà sư và ẩn sĩ khu vực trân trọng, ngọc từ [GetBuilding('itoigawa_mines_01').GetName] có lịch sử lâu đời về uy danh. Vẻ đẹp của nó luôn thu hút đoàn lữ hành từ khắp đảo để cung cấp cho thợ thủ công."
  building_lantian_mines_destination_desc: "[GetBuilding('lantian_mines_01').GetName] là nguồn ngọc nổi bật, làm các ngọn đồi xung quanh trở nên ngoạn mục với mỏ khai thác khắc vách và đá xanh lấp lánh xa xa."
  building_fengtian_mines_destination_desc: "Từ thời cổ, thợ mỏ [GetBuilding('fengtian_mines_01').GetName] đã vung cuốc mở rộng hố và thu thập ngọc kiểm tra. Trong khi đó, thương nhân trên đảo làm đầy kho bạc."
  building_hpakant_mines_destination_desc: "Ẩn trong rừng rậm và sông rộng, [GetBuilding('hpakant_mines_01').GetName] là nguồn ngọc thịnh vượng cho nghệ nhân địa phương. Việc khai thác giúp họ biểu đạt văn hóa tốt hơn."
  building_dushan_mines_destination_desc: "[GetBuilding('dushan_mines_01').GetName] chi phối kinh tế địa phương. Ngọc nơi đây là quý giá nhất, được cho là có màu sắc phong phú hơn bất kỳ nơi nào khác."
  building_mali_mines_destination_desc: "Trên vùng đất rộng lớn Mali, [GetBuilding('mali_mines_01').GetName] chứa quặng quý, nguồn giàu sang và tự hào. Thợ mỏ và nghệ nhân nơi đây lâu nay khai thác các mỏ, thúc đẩy kinh tế và thương mại địa phương."
  building_al_azhar_university_destination_desc: "[GetBuilding('al_azhar_university').GetName] tại Cairo đứng như ngọn hải đăng học thuật trong thế giới [GetReligionByKey('islam_religion').GetName]. Học đường linh thiêng này đã nuôi dưỡng nhiều thế hệ học giả, đóng góp lớn cho trí thức và văn hóa vùng."
  building_sankore_university_destination_desc: "Tại thành phố huyền thoại Timbuktu, [GetBuilding('sankore_university').GetName] là trung tâm học thuật và tri thức. Học giả và sinh viên tụ hội nơi đây, nghiên cứu nhiều lĩnh vực, từ thần học đến thiên văn."
  building_siena_university_destination_desc: "Đại học Siena, tọa lạc giữa lòng Tuscany và đại diện bởi [GetBuilding('siena_university').GetName], là trung tâm giáo dục và tư tưởng. Giảng viên danh tiếng cùng sinh viên háo hức tạo nên cộng đồng học thuật sôi nổi, đóng vai trò then chốt trong đời sống trí thức dân địa phương."
  building_nalanda_university_destination_desc: "[GetBuilding('nalanda_university').GetName] là trung tâm học thuật Vệ-đà vĩ đại. Viện cổ xưa này thu hút học giả khắp Á Châu, di sản của nó được dân địa phương trân trọng, coi như biểu tượng của lịch sử và văn hóa của họ."
  building_hotin_fort_destination_desc: "[GetBuilding('hotin_fort_01').GetName] hùng mạnh nhìn ra sông Dniester. Tường dày kiên cố và vị trí chiến lược chứng tỏ quyết tâm của dân địa phương trong việc bảo vệ đất đai khỏi kẻ xâm lược."
  building_heddal_stave_church_destination_desc: "Giữa phong cảnh yên bình Na Uy, [GetBuilding('heddal_stave_church_01').GetName] hiện lên như ví dụ tuyệt vời về tay nghề thời trung cổ. Các điêu khắc gỗ tinh xảo và cấu trúc cao vút phản ánh lòng sùng kính và kỹ năng của nghệ nhân địa phương."
  building_temple_of_uppsala_destination_desc: "[GetBuilding('temple_of_uppsala_01').GetName], bao phủ trong ánh hào quang linh thiêng, là nơi tôn kính nơi truyền thống Bắc Âu cổ xưa hòa quyện với hiện tại. Hàng lang được tôn thờ này từ lâu là nơi tụ họp, nguồn vọng âm của các hành hương khắp nơi."
  building_lund_cathedral_destination_desc: "[GetBuilding('lund_cathedral_01').GetName], với kiến trúc Romanesque ấn tượng, chiếm trọn tầm nhìn. Trung tâm tâm linh này, nổi tiếng với hầm mộ và đồng hồ thiên văn, là điểm tụ họp tín ngưỡng của cộng đồng Cơ đốc địa phương."
  building_danevirke_destination_desc: "[GetBuilding('danevirke_01').GetName], hệ thống phòng thủ đất đồ sộ, trải dài trên bán đảo Jutland. Phòng tuyến cổ xưa này, được dân địa phương xây dựng và mở rộng, tượng trưng cho quyết tâm bảo vệ lãnh thổ và duy trì quyền tự trị."
  building_roman_wall_of_lugo_destination_desc: "[GetBuilding('roman_wall_of_lugo_01').GetName], bao quanh thị trấn cổ, là minh chứng đáng kinh ngạc cho kỹ thuật của [roman_culture.GetName]. Dân cư địa phương tự hào về di tích lịch sử này, vốn vẫn đứng vững như biểu tượng kiên cố của quá khứ."
  building_rock_of_gibraltar_destination_desc: "[GetBuilding('rock_of_gibraltar_01').GetName], sừng sững trên biển, là dấu ấn chiến lược và biểu tượng. Dân địa phương, hiểu rõ tầm quan trọng quân sự, đã củng cố nơi này qua các thế kỷ, biến nó thành pháo đài bảo vệ lối ra vào hai thế giới."
  building_aljaferia_palace_destination_desc: "[GetBuilding('aljaferia_palace_01').GetName] tại Zaragoza là viên ngọc kiến trúc [GetReligionByKey('islam_religion').GetName] giữa lòng Aragon. Các vòm trang trí và sân yên tĩnh phản ánh sự hòa trộn văn hóa giữa người Moor và Cơ đốc giáo, di sản được dân địa phương trân quý."
  building_tower_of_hercules_destination_desc: "Đứng sừng sững gần bờ biển là [GetBuilding('tower_of_hercules_01').GetName], ngọn hải đăng cổ đã dẫn đường thủy thủ suốt nhiều thế kỷ. Công trình [roman_culture.GetName] này, thấm đẫm huyền thoại và lịch sử, là biểu tượng của sự bền bỉ và dẫn lối cho cộng đồng biển địa phương."
  building_city_wall_of_toledo_destination_desc: "Bao quanh thành phố cổ, [GetBuilding('city_wall_of_toledo_01').GetName] vững chãi minh chứng cho quá khứ huy hoàng. Các bức tường này, pha trộn giữa [roman_culture.GetName], [visigothic_culture.GetName] và phong cách Moor, là niềm tự hào và lá chắn an ninh cho dân cư bên trong."
  building_alcazar_of_segovia_destination_desc: "[GetBuilding('alcazar_of_segovia_01').GetName], tọa lạc trên mỏm đá cao, là lâu đài cổ tích hiện hữu. Pháo đài với hình dáng độc đáo và lịch sử phong phú này khơi gợi trí tưởng tượng của dân địa phương và khách viếng."
  building_holy_site_basilica_santiago_destination_desc: "[GetBuilding('holy_site_basilica_santiago_01').GetName] là ngọn đèn dẫn lối cho hành hương khắp Cơ đốc giáo. Nhà thờ lộng lẫy này, điểm kết Camino de Santiago, được tôn kính nhờ thánh tích và kiến trúc Romanesque tuyệt đẹp, được tín đồ sùng bái."
  building_cilician_gates_destination_desc: "[GetBuilding('cilician_gates').GetName] là ngã ba chiến lược qua nhiều thế kỷ. Con đường thiên nhiên này, được thương nhân và quân đội sử dụng, mang ý nghĩa quan trọng với cộng đồng địa phương đã đi qua nơi này từ lâu."
  building_fairy_chimneys_destination_desc: "[GetBuilding('fairy_chimneys').GetName] ở Cappadocia được gió và nước tạo hình. Những khối đá độc đáo này, với hình dáng đặc biệt, không chỉ thu hút khách du lịch mà còn là nơi cư trú và thờ phụng của dân địa phương."
  building_sofia_ohrid_destination_desc: "Khi [GetBuilding('sofia_ohrid').GetName] hiện ra, ta bị mê hoặc bởi vẻ đẹp thanh bình. Mỗi bích họa và khảm đều kể câu chuyện về đức tin và nghệ thuật, di sản đã vượt qua thời gian và vẫn truyền cảm hứng cho tín đồ và khách viếng."
  building_hosios_loukas_destination_desc: "[GetBuilding('hosios_loukas').GetName], ẩn mình trong núi miền Trung Hy Lạp, là viên ngọc nghệ thuật Byzantine. Kiến trúc tuyệt đẹp và bích họa nơi tu viện được tín đồ địa phương tôn kính, là ngọn hải đăng của Cơ đốc giáo Chính thống."
  building_cattolica_stilo_destination_desc: "[GetBuilding('cattolica_stilo').GetName] là ví dụ nổi bật về kiến trúc Byzantine tại Ý. Nhà thờ nhỏ nhưng hấp dẫn này, với mặt bằng hình thánh giá đặc trưng, chiếm vị trí đặc biệt trong lòng cộng đồng địa phương."
  building_etchmiadzin_cathedral_destination_desc: "[GetBuilding('etchmiadzin_cathedral').GetName], nơi linh thiêng ở Vagharshapat, được xem là trung tâm tâm linh của người Armenia toàn cầu. Nhà thờ cổ xưa này, với lịch sử phong phú và ý nghĩa tôn giáo, là niềm tự hào và an ủi tinh thần cho cộng đồng Armenia địa phương."
  building_jvari_monastery_destination_desc: "Tọa lạc trên đỉnh đồi, [GetBuilding('jvari_monastery').GetName] nhìn ra nơi sông hợp lưu bên dưới. Tu viện Chính thống Georgia này, với kiến trúc hài hòa, là nơi tĩnh dưỡng và biểu tượng của đức tin Cơ đốc bền vững tại vùng đất này."
  building_saint_catherine_destination_desc: "Ẩn mình dưới chân núi Sinai, [GetBuilding('saint_catherine').GetName] là pháo đài của đức tin. Tu viện cổ xưa với các bản thảo quý giá và thánh tích, là nơi suy ngẫm của cộng đồng Chính thống và khách viếng."
  building_apollinare_nuovo_destination_desc: "Tại thành phố lịch sử Ravenna, [GetBuilding('apollinare_nuovo').GetName] là minh chứng nghệ thuật và kiến trúc Cơ đốc sơ kỳ. Khảm tuyệt đẹp mô tả cảnh Kinh Thánh, gây kinh ngạc và truyền cảm hứng cho tín đồ địa phương và những người yêu lịch sử."
  building_mount_athos_destination_desc: "[GetBuilding('mount_athos_01').GetName], bán đảo phía Bắc Hy Lạp, là cộng đồng tu viện độc đáo. Ngọn núi linh thiêng này, nơi có nhiều tu viện, là thiên đường tâm linh, thấm đẫm truyền thống Chính thống, được các tu sĩ và hành hương tôn kính."
  building_meteora_destination_desc: "Tại Thessaly, các tu viện [GetBuilding('meteora_01').GetName] hiện lên hùng vĩ trên các cột đá cao. Những nơi linh thiêng này, như treo giữa đất trời, tượng trưng cho khát vọng tâm linh của các tu sĩ địa phương."
  building_despot_palace_destination_desc: "Tráng lệ của [GetBuilding('despot_palace').GetName] là cảnh tượng đáng chiêm ngưỡng. Hành lang rộng lớn và sân trang nhã tràn đầy nhộn nhịp triều thần và giai điệu ca vũ. Cung điện, trung tâm chính trị và nghệ thuật, là biểu tượng quyền lực và tinh tế."
  building_maiden_tower_destination_desc: "[GetBuilding('maiden_tower').GetName] canh giữ cửa Bosphorus. Tường thành thấm đẫm truyền thuyết, chứng kiến thăng trầm của các đế quốc. Nay, tháp vẫn canh chừng, điểm chiến lược kiểm soát tàu thuyền qua vùng nước huyền thoại này."
  building_patras_castle_destination_desc: "[GetBuilding('patras_castle').GetName] đã đứng như lính canh qua các thế kỷ. Tường và tháp vững chắc, mang dấu ấn các thời đại, là minh chứng tầm quan trọng lịch sử và giá trị chiến lược của thành phố."
  building_sumela_monastery_destination_desc: "Khắc vào vách đá Trabzon, [GetBuilding('sumela_monastery_01').GetName] là kỳ quan kiến trúc tu viện. Nơi ẩn dật này, bám trên sườn núi, mang đến tầm nhìn ngoạn mục và sự bình yên sâu sắc cho khách viếng."
  building_saint_lazarus_destination_desc: "Giữa lòng Larnaca, [GetBuilding('saint_lazarus').GetName] là nơi thờ kính uy nghiêm. Kiến trúc đẹp với biểu tượng và thánh tích tinh xảo, giữ vị trí quan trọng trong đời sống tinh thần cộng đồng Chính thống địa phương."
  building_kassiopi_castle_destination_desc: "[GetBuilding('kassiopi_castle').GetName], sừng sững trên biển Ionian, là ngọn hải đăng cảnh giác. Lâu đài, trung tâm hoạt động hải quân và quân sự, đóng vai trò quan trọng trong an ninh và thịnh vượng vùng, lịch sử hòa quyện với Đông La Mã."
  building_hagios_demetrios_destination_desc: "Nhà thờ [GetBuilding('hagios_demetrios').GetName] tại Thessaloniki là nơi linh thiêng, tôn kính thánh bảo trợ thành phố. Hành lang thánh, trang trí bằng khảm tuyệt đẹp, vang vọng lời cầu nguyện và ca hát của tín đồ địa phương."
  building_church_of_the_theotokos_destination_desc: "Dưới bóng thành Constantinople, [GetBuilding('church_of_the_theotokos').GetName] là ngọn hải đăng đức tin. Nhà thờ cổ với bầu không khí thanh tịnh và biểu tượng thánh, là nền tảng đời sống tôn giáo và văn hóa cộng đồng địa phương."
  building_parthenon_destination_desc: "[GetBuilding('parthenon').GetName] trên Acropolis tại Athens là biểu tượng bền vững của nền văn minh Hy Lạp cổ. Ngôi đền hùng vĩ, dù phần nào đổ nát, vẫn khiến khách kinh ngạc bởi kiến trúc và giá trị lịch sử."
  building_imam_reza_shrine_destination_desc: "[GetBuilding('imam_reza_shrine_01').GetName] là nơi có ý nghĩa tâm linh to lớn. Quần thể nguy nga với mái vòm vàng và tháp, thu hút vô số hành hương tìm kiếm bình an và thanh tẩy tâm hồn."
  building_soltaniyeh_destination_desc: "[GetBuilding('soltaniyeh_01').GetName] là kiệt tác kiến trúc thời Ilkhanate. Thiết kế sáng tạo và gạch xanh tuyệt đẹp biến nơi này thành dấu ấn đặc sắc."
  building_palace_of_ctesiphon_destination_desc: "[GetBuilding('palace_of_ctesiphon_01').GetName] gợi lên sự tráng lệ của Đế chế Sassanid. Vòm Taq Kasra, vẫn tồn tại mặc thời gian, nhắc nhở về tài năng kiến trúc của nền văn minh cổ."
  building_falak_ol_aflak_citadel_destination_desc: "Nhìn ra Khorramabad, [GetBuilding('falak_ol_aflak_citadel_01').GetName] là pháo đài vững chắc và đẹp mắt. Thành cổ với tường cao và vị trí chiến lược là biểu tượng di sản giàu có và tinh thần kiên cường vùng này."
  building_minarets_and_remains_of_jam_destination_desc: "Khi ta tiến đến [GetBuilding('minarets_and_remains_of_jam_01').GetName], lòng tràn ngập cảm giác kinh ngạc. Những cấu trúc cao vút, di tích triều đại Ghurid, đứng đơn độc trên cảnh quan khắc nghiệt, gạch hoa tinh xảo là minh chứng cho một thời đại đã quên."
  building_great_wall_of_gorgan_destination_desc: "Băng qua cảnh quan, ta khiêm nhường trước quy mô [GetBuilding('great_wall_of_gorgan_01').GetName]. Phòng tuyến đồ sộ trải dài tít tắp, nhắc nhở quyền lực cổ xưa trong việc bảo vệ biên cương khỏi kẻ thù."
  building_maharloo_lake_destination_desc: "Nhìn [GetBuilding('maharloo_lake_01').GetName] gần Shiraz, ta bị mê hoặc. Nước hồng tạo nên phong cảnh gần như siêu thực. Hồ, hiện tượng thiên nhiên độc đáo, thu hút ta bởi vẻ đẹp lạ thường và yên bình."
  building_rainbow_mountains_destination_desc: "Ngước mắt nhìn [GetBuilding('rainbow_mountains_01').GetName], ta ngỡ ngàng bởi các lớp màu sặc sỡ. Những hình thành thiên nhiên tuyệt đẹp này, kỳ quan địa chất, khiến ta kinh ngạc trước nghệ thuật của Trái Đất."
  building_mount_damavand_destination_desc: "Ngọn [GetBuilding('mount_damavand_01').GetName] hùng vĩ, sừng sững trên cảnh quan xung quanh, khiến ta vừa kính phục vừa sùng bái. Là đỉnh cao nhất [GetGeographicalRegion('world_persian_empire').GetName], đỉnh phủ tuyết và gắn liền truyền thuyết kích thích trí tưởng tượng."
  building_tomb_of_cyrus_destination_desc: "Đứng trước [GetBuilding('tomb_of_cyrus_01').GetName] tại Pasargadae, lòng ta tràn ngập cảm giác lịch sử sâu sắc. Công trình đơn giản nhưng trang nhã này, dành cho mẹ của vua Solomon, vang vọng di sản uy nghi."
  building_ark_of_bukhara_destination_desc: "Đi qua cổng uy nghiêm của [GetBuilding('ark_of_bukhara_01').GetName], ta cảm nhận sức nặng của nhiều thế kỷ. Pháo đài cổ xưa này, nơi các emir địa phương trị vì từ khi thành lập, tường dày đã đón vô số đoàn lữ hành trên Con đường Tơ lụa."
  building_shah_i_zinda_destination_desc: "Khám phá [GetBuilding('shah_i_zinda_01').GetName] tại Samarkand là chuyến du hành qua thời gian và nghệ thuật. Mỗi lăng mộ, với gạch khảm tinh xảo, kể câu chuyện, gợi lòng tôn kính di sản văn hóa và tinh thần giàu có vùng này."
  building_alamut_castle_destination_desc: "[GetBuilding('alamut_castle_01').GetName], ẩn mình trên núi ở thung lũng Alamut, gợi lên cảm giác huyền bí. Từng là căn cứ của Hội Sát Thủ, vị trí chiến lược và quá khứ huyền thoại vẫn thu hút ta và khách địa phương."
  building_golden_gate_of_kiev_destination_desc: "Tiến đến [GetBuilding('golden_gate_of_kiev_01').GetName], ta kinh ngạc trước sự tráng lệ sống động. Cổng, lối vào thành phố, vang vọng âm thanh thương mại. Kiến trúc kiên cố, minh chứng quyền lực thành phố, vẫn truyền cảm hứng kính cẩn và kết nối với quá khứ huy hoàng Kiev."
  building_sar_i_sang_mines_01_destination_desc: "Tại [GetBuilding('sar_i_sang_mines_01').GetName], không khí đặc quánh bụi đá lapis lazuli. Đá xanh thẳm, quý giá nhờ màu sắc mãnh liệt, được thợ khai thác khéo léo lấy ra. Mỏ vang vọng lịch sử thương mại và xa xỉ, lapis đã trang trí báu vật tinh hoa của các đế quốc."
 
  building_drassanes_01_destination_desc: "Đại kho vũ khí [GetBuilding('drassanes_01').GetName] chuẩn bị hạm đội chiến thuyền, ban cho chủ sở hữu quyền uy khắp Địa Trung Hải. Dưới các vòm đá nhọn, công nhân làm việc không mệt mỏi."
  building_kyz_kala_01_destination_desc: "[GetBuilding('kyz_kala_01').GetName] sừng sững trên ốc đảo xanh tươi Merv, chiếu bóng dài lên vùng khô cằn. Nền móng vững trên bệ chắc chắn, tường có rãnh ôm lấy xưởng, kho vũ khí và các đại sảnh nơi sứ giả và quan lại tất bật đi lại."
  building_cluny_abbey_01_destination_desc: "Một món đất và quyền lợi, đổi lấy sự cứu rỗi vĩnh hằng. Đó là giao ước giữa cộng đồng tu viện [GetBuilding('cluny_abbey_01').GetName] và chúa đất địa phương."
  building_cluny_abbey_02_destination_desc: "[GetBuilding('cluny_abbey_02').GetName], nhà thờ lớn nhất từng được mơ tưởng. Năm gian giữa dài hơn Vatican, các vòm đá đồ sộ là kỳ công kiến trúc với tháp và mái chồng tầng. Đây thực sự là Rome mới."
  building_york_walls_01_destination_desc: "Trải dài nhiều dặm, [GetBuilding('york_walls_01').GetName] bảo vệ thành phố từ thời Caesar. Vị trí chọn không để chiếm cao điểm, mà tận dụng hai con sông uốn lượn qua đồng cỏ xung quanh."
  building_damascus_mosque_01_destination_desc: "[GetBuilding('damascus_mosque_01').GetName] là một trong những nơi linh thiêng nhất của Hồi giáo, có câu chuyện đáng kính. Nền móng xây trên đền La Mã cổ và basilica Cơ đốc sơ khai, nhiều thế kỷ tâm linh và sáng tạo tuyệt diệu xếp chồng lên nhau."
  building_jokhang_01_destination_desc: "[GetBuilding('jokhang_01').GetName] là phức hợp mê cung với sân và khu tu viện, xuyên qua hành lang rộng và đại sảnh bôi bơ yak. Hm, bơ yak, có lẽ ta nên thử một chút..."
  building_wartburg_01_destination_desc: "Ẩn mình trong rừng Thuringia và trên vách đá cao, pháo đài hùng mạnh [GetBuilding('wartburg_01').GetName] kiểm soát mọi di chuyển hàng hóa và con người trong vùng. Đại sảnh đá lạnh được sưởi ấm bởi nhiều lò sưởi bên trong."
  building_beta_giyorgis_01_destination_desc: "[GetBuilding('beta_giyorgis_01').GetName] được tạc hoàn toàn từ đá núi lửa đỏ ấm. Đại sảnh chính bên trong đá được sơn bích họa tuyệt đẹp, trong khi biểu tượng thánh trang trí khắp tường."
  building_holy_wisdom_01_destination_desc: "[GetBuilding('holy_wisdom_01').GetName] tráng lệ được mô phỏng theo Hagia Sophia, thể hiện ánh sáng, của cải và quyền lực giữa xứ lạnh phương Bắc. Ngoại hình đá vôi trắng khắc khổ giấu đi sắc màu tráng lệ bên trong các bích họa."
  building_kano_walls_01_destination_desc: "[GetBuilding('kano_walls_01').GetName] cao chót vót bao quanh thành cổ Kano, dẫn đường các tuyến thương mại quan trọng qua những cổng lớn."
  building_somapura_university_01_destination_desc: "[GetBuilding('somapura_university_01').GetName] nhiều thế kỷ là trung tâm học thuật quan trọng Ấn Độ, thu hút học giả từ vùng xa nhờ liên kết rộng với các tu viện Phật giáo, Jain và Hindu."
  building_duomo_florence_01_destination_desc: "Theo tường La Mã cổ gần cổng phía bắc, [GetBuilding('duomo_florence_01').GetName] là nơi cư trú của Cơ đốc giáo từ trước thời Constantine. Qua thời gian, chịu hỏa hoạn và cướp bóc, rồi trùng tu và ban phước."
  building_duomo_florence_02_destination_desc: "[GetBuilding('duomo_florence_02').GetName] là nhà rửa tội bát giác khổng lồ tại trung tâm thành phố, thờ Thánh Gioan bảo trợ.\nĐược ốp đá cẩm thạch quý và trang trí bằng điêu khắc và khảm vàng tinh xảo, minh chứng cho sự giàu có của thành phố."
  building_duomo_florence_03_destination_desc: "[GetBuilding('duomo_florence_03').GetName] là nhà thờ xứng đáng với Florence giàu có. Mặt tiền đầy tượng nhân hình các tiên tri, thần và vị bảo trợ; tháp chuông cao đổ bóng dài, đánh dấu giờ lao động và cầu nguyện cho dân và khách."
  building_duomo_florence_04_destination_desc: "[GetBuilding('duomo_florence_04').GetName] là kỳ tích của thợ xây Florence, đứng mảnh mai như bay giữa bầu trời xanh. Cao và rộng hơn tưởng tượng, không có hệ thống chống đổ, nhưng khéo léo dùng hai lớp gạch và đá."
  building_konark_temple_01_destination_desc: "Được hàng nghìn nghệ nhân tạo tác, [GetBuilding('konark_temple_01').GetName] thờ thần mặt trời Surya. Toàn bộ khu phức hợp mô phỏng chiến xa hùng mạnh của thần, mang ánh sáng từ biển về phương Đông."
  building_al_qarawiyyin_university_01_destination_desc: "Được thành lập bởi thương nhân và di dân từ Kairouan, [GetBuilding('al_qarawiyyin_university_01').GetName] là trung tâm học thuật uy tín nhất thế giới Hồi giáo phương Tây, thu hút học giả từ mọi miền."
  building_kairouan_basins_01_destination_desc: "[GetBuilding('kairouan_basins_01').GetName] được xây để cung cấp nước sạch cho thành phố khi cần, các hồ lớn này lọc nước mưa, lắng cặn và giữ lại phù sa."
  building_ghana_palace_01_destination_desc: "Bao quanh bởi rừng linh thiêng là [GetBuilding('ghana_palace_01').GetName] - nơi ở của các thủ lĩnh hoàng gia thành phố.\nKhu phức hợp gồm các tòa nhà đá sa thạch và gạch bùn, được bảo vệ bởi hàng rào. Lâu đài hùng vĩ này thống trị thị trấn xung quanh."
  building_visegrad_castle_01_destination_desc: "[GetBuilding('visegrad_castle_01').GetName] là hệ thống tường và tháp hoành tráng, vững chắc, bảo vệ khúc uốn sông Danube và kiểm soát thương mại giàu có."
  building_wawel_cathedral_01_destination_desc: "Được thợ khắp Cơ đốc giáo xây dựng, nhà thờ đá vĩ đại này là công trình đầu tiên loại hình tại Ba Lan. Trên đỉnh [GetBuilding('wawel_cathedral_01').GetName], chuông hai tháp gọi dân chúng dự lễ trong các gian nến dài."
  building_vatapi_caves_01_destination_desc: "Được triều Chalukya sơ khai xây dựng, [GetBuilding('building_vatapi_caves_01').GetName] tạc sâu vào đá sa thạch uy nghi. Bên trong là thế giới thinh lặng linh thiêng. Cổng chiến thắng dẫn hành hương vào mặt núi khối monolithic."
  building_jaisalmer_fort_01_destination_desc: "Khi mặt trời lặn, tường [GetBuilding('jaisalmer_fort_01').GetName] chuyển màu mật ong ấm, tỏa sáng giữa sa mạc. Pháo đài được xây để bảo vệ thị trấn bên trong khỏi mọi mối đe dọa."
  building_pleasure_dome_01_destination_desc: "[GetBuilding('pleasure_dome').GetName] vươn lên như giấc mơ trở thành hiện thực. Bao quanh bởi vườn và suối, đại sảnh đá cẩm thạch và gian thoáng mời nghỉ ngơi và suy tư, lan tỏa nhạc và hương thơm."
  building_burkhan_khaldun_01_destination_desc: "Ẩn mình trong sương mù và sự tôn kính, [GetBuilding('burkhan_khaldun_01').GetName] linh thiêng giữa các đỉnh Khentii. Nơi cầu nguyện và hành hương, sườn núi yên tĩnh được cho là che chở linh hồn đất và dân."

  building_nanhua_temple_01_destination_desc: "[GetBuilding('nanhua_temple_01').GetName] sừng sững giữa những ngọn đồi xanh và dòng sông yên bình, mái ngói lóe sáng qua sương mai. Những cây bách cổ thụ dọc lối, hành hương cúi mình trước các đại sảnh vang vọng nhiều thế kỷ tu tập và học thuật tĩnh lặng."
  building_jizu_shan_temples_01_destination_desc: "Trên các sườn núi bậc thang, [GetBuilding('jizu_shan_temples_01').GetName] nhìn ra những áng mây trôi như thủy triều. Bánh xe cầu nguyện bằng đồng quay theo gió, trong khi các tăng sĩ chăm sóc hương giữa cây cổ thụ. Hành hương kiên nhẫn leo từng bậc đá, tìm kiếm vang vọng giác ngộ xưa."
  building_tiantai_monasteries_01_destination_desc: "[GetBuilding('tiantai_monasteries_01').GetName] bám vách núi phủ sương trên thung sâu. Suối róc rách qua đá rêu, các tăng sĩ mang kinh luận tranh biện nơi các sư phụ từng dạy thiền, giáo lý, và vạn vật."
  building_maoshan_academy_01_destination_desc: "[GetBuilding('maoshan_academy_01').GetName] vươn giữa các đỉnh ngọc bích phủ sương mù, sân trong tỏa hương thông và mực. Học giả sao chép văn bản dưới ánh đèn, kết hợp y thuật và huyền bí khi hạc bay quanh các dãy núi chạm đền thờ xa xa."
  building_lize_academy_01_destination_desc: "Kết thúc chuyến hành trình, [GetBuilding('maoshan_academy_01').GetName] hiện ra trước mắt, bên hồ yên ả phản chiếu liễu và mái ngói. Lại gần, ta nghe học giả nơi xa, mặc áo bình thường, đọc kinh điển Khổng Tử."
  building_culai_academy_01_destination_desc: "Khi [GetBuilding('culai_academy_01').GetName] hiện ra, ta càng bị mê hoặc bởi vẻ đẹp thanh tịnh. Sương từ đỉnh núi Culai tràn qua sân trong, nơi kẻ tìm học theo đuổi tham vọng học thuật."
  building_shigu_academy_01_destination_desc: "Chuyến đi cuối cùng đưa ta đến [GetBuilding('shigu_academy_01').GetName], ẩn trên đồi phủ sương và bao quanh rừng xanh. Leo cầu thang, cổng nổi tiếng là cảnh chào đón với chữ khắc tinh xảo, mái mới phục hồi che bóng."
  building_white_deer_grotto_academy_01_destination_desc: "Tiến đến [GetBuilding('white_deer_grotto_academy_01').GetName], ta ấn tượng vì sự hòa hợp với đồi núi xung quanh. Các công trình đá nằm giữa rừng trúc, gợi nhớ nơi học giả xưa tìm kiếm chân lý và hài hòa."
  building_gongsanseong_fortress_01_destination_desc: "Khi [GetBuilding('gongsanseong_fortress_01').GetName] hiện ra, ta sửng sốt trước uy nghi trên thung lũng sông. Tường cổ vang vọng chiến công xưa, vua trung thành, và tinh thần kiên cường của vương quốc tự hào."
  building_besakih_temple_01_destination_desc: "Khác với tên khiêm tốn [GetBuilding('besakih_temple_01').GetName], ta không thấy chỉ một đền, mà cả khu phức hợp rộng lớn với đền công cộng và tư nhân, nơi cầu nguyện và nghi lễ, nên gọi là 'Đền Mẫu'."
  building_mount_apo_01_destination_desc: "Khi [GetBuilding('mount_apo_01').GetName] hiện ra trên đường chân trời, ta cúi mình trước uy nghiêm yên tĩnh. Mây ôm lấy sườn gồ ghề, hương mưa và tro thoang thoảng, đỉnh núi linh thiêng bảo vệ linh hồn đất và lửa."
  building_dieng_plateau_01_destination_desc: "[GetBuilding('dieng_plateau_01').GetName] tĩnh lặng phi thường khiến mắt người kinh ngạc. Hơi nước bốc từ miệng núi xanh, đền đá cổ nổi lên trong sương. Vùng đất ngoạn mục, nơi thiên nhiên và thần linh như chung một hơi thở."
  building_plain_of_jars_01_destination_desc: "[GetBuilding('plain_of_jars_01').GetName] trải rộng trước mắt, mênh mông im lìm dưới bầu trời nhợt nhạt. Rải rác trên đồi, các bình khổng lồ nửa chôn trong cỏ và bóng tối, mục đích quên lãng thì thầm về một nền văn minh đã mất mà chưa hoàn toàn biến đi."
  building_pagoda_of_fogong_temple_01_destination_desc: "[GetBuilding('pagoda_of_fogong_temple_01').GetName] hiện ra trước mắt, các tầng gỗ vươn lên như lời cầu khấn chạm trời. Mỗi tầng mang hương hương xưa, minh chứng cho lòng thành và kỹ nghệ gần nghìn năm."
  building_hanging_temple_01_destination_desc: "[GetBuilding('hanging_temple_01').GetName] treo bên vách núi như ảo ảnh giữa đất và trời. Đại sảnh gỗ vươn ra từ vách đá, dầm dường như chống lại trọng lực, nơi các tăng sĩ cầu nguyện giữa gió, tĩnh lặng và lòng thành kiên định."
  building_muaro_jambi_01_destination_desc: "[GetBuilding('muaro_jambi_01').GetName] trải dọc bờ sông, mê cung các thánh điện gạch giữa rừng rậm. Dây leo quấn quanh stupa xây tinh xảo, không khí vang vọng tuổi đời. Tiếng học giả, hành hương còn lưu lại cho buôn bán và tín ngưỡng."
  building_liuhe_pagoda_01_destination_desc: "Bên bờ sông, [GetBuilding('liuhe_pagoda_01').GetName] chào ta bằng vẻ uy nghi nhiều tầng, sáng trên tối dưới. Bên trong, từng bậc thang có tường ngoài, hành lang zigzag, tường trong, phòng nhỏ đầy học giả chuyên tâm."
  building_dau_temple_01_destination_desc: "[GetBuilding('dau_temple_01').GetName] đứng nơi đồng bằng sông Hồng chạm trời, sân trong tỏa hương và lời cầu nguyện. Đền cổ lấp lánh dưới nắng, ghi dấu nơi sinh của Phật giáo vùng này và nhiều thế kỷ tu tập bền bỉ."
  building_mount_baekdu_01_destination_desc: "Khi [GetBuilding('mount_baekdu_01').GetName] hiện ra, đỉnh phủ tuyết rực rỡ trên chân trời. Nói rằng trên đỉnh có hồ núi lửa rộng lớn, như gương soi trời, phản chiếu hạnh phúc thiên thu."
  building_byeokran_port_01_destination_desc: "Từ vách đá cao, [GetBuilding('byeokran_port_01').GetName] trải dài theo vịnh lấp lánh. Nhà kho nằm ven bờ cạnh cột buồm gỗ, tiếng hải âu hòa với tiếng mỏ neo vang vọng."
  building_hwangnyongsa_01_destination_desc: "Ta đứng trước [GetBuilding('hwangnyongsa_01').GetName], nơi chín tầng tháp sáng rực dưới nắng. Các tăng sĩ tụng kinh sân rộng, lòng tin và bền bỉ hiện hữu trong từng viên đá và dầm vàng."
  building_hakata_port_01_destination_desc: "[GetBuilding('hakata_port_01').GetName] nhộn nhịp thương nhân và thủy thủ từ phương xa, bến cảng đầy lụa, gốm và gia vị. Tàu gỗ kêu cóng, cánh buồm đón gió biển, trung tâm thương mại, văn hóa và ảnh hưởng đế quốc."
  building_chinjufu_01_destination_desc: "[GetBuilding('chinjufu_01').GetName] tràn đầy kỷ luật, doanh trại và xưởng tàu vang tiếng giáp và tiếng gọi thủy thủ. Tháp canh dọc vịnh, giám sát biển Bắc của vương quốc, nơi từng nhịp tim đều vì phòng thủ và nhiệm vụ."
  building_dazaifu_01_destination_desc: "[GetBuilding('dazaifu_01').GetName] ẩn giữa đồi lượn sóng và vườn mận, nhộn nhịp với thư ký, sứ giả và quan lại. Trung tâm truyền chỉ thị hành chính ra các tỉnh xa, sắc lệnh được niêm phong bằng mực, hương và quyền uy tinh tế."
  building_enryaku_ji_01_destination_desc: "[GetBuilding('enryaku_ji_01').GetName] đội núi Hiei, đại sảnh ẩn trong sương. Hành hương leo đường quanh co qua tăng tụng kinh và chuông ngân, nơi giáo lý $SaichO_$ vẫn định hình đức tin và kỷ luật quốc gia."
  building_kofuku_ji_01_destination_desc: "[GetBuilding('kofuku_ji_01').GetName] vươn bên hồ đục, tháp năm tầng đổ bóng dài trên phố cổ. Triều thần và tăng sĩ đi qua cổng kiên cố, học giả thiền định trong an tĩnh Phật giáo."
  building_ise_jingu_01_destination_desc: "[GetBuilding('ise_jingu_01').GetName] vươn bên hồ đục, tháp năm tầng đổ bóng dài trên phố cổ. Triều thần và tăng sĩ đi qua cổng kiên cố, học giả thiền định trong an tĩnh Phật giáo."
  building_heian_palace_01_destination_desc: "[GetBuilding('heian_palace_01').GetName] dọc đại lộ, cổng đỏ mở ra sân rộng đá trắng cạo răng cưa. Triều thần thơm hương trượt qua đại sảnh sơn mài, bình vàng và đàn tranh xa vọng, vang vẻ thanh lịch đời hoàng gia."
  building_itsukushima_jinja_01_destination_desc: "[GetBuilding('itsukushima_jinja_01').GetName] đứng trên nước triều, torii đỏ rực như nổi giữa biển trời. Đèn lồng đung đưa dưới mái gỗ, tăng sĩ thực hiện nghi lễ, tụng kinh hòa nhịp sóng."
  building_mount_fuji_01_destination_desc: "[GetBuilding('mount_fuji_01').GetName] sừng sững trên đồng bằng, đỉnh tuyết sáng dưới trời quang. Dân làng và hành hương ngước nhìn tôn kính, vừa gắn với thần nữ, vừa là gương phản chiếu vẻ đẹp vĩnh hằng."

  building_sunday_bazaar_01_destination_desc: "[GetBuilding('sunday_bazaar_01').GetName] nhộn nhịp, các con phố rực nắng đầy lụa, gia vị và gia súc. Thương nhân từ các vùng xa xăm trao đổi bằng nhiều thứ tiếng, tạo nên tấm thảm sinh động của âm thanh và hàng hóa, hiện thân tinh thần Con đường Tơ lụa."
  building_dunhuang_market_01_destination_desc: "[GetBuilding('dunhuang_market_01').GetName] vang vọng dưới nắng sa mạc, thương nhân từ khắp nơi trao đổi hàng hóa xa xôi và thiết yếu. Lạc đà nghỉ bên cổng khi hành hương và dân địa phương trao đổi kinh văn và câu chuyện hướng đến các ốc đảo xa."
  building_hamadan_bazaar_01_destination_desc: "[GetBuilding('hamadan_bazaar_01').GetName] uốn lượn qua các hẻm vòm đầy hương nhụy hoa nghệ tây và da. Thương nhân hô lớn từ quầy bóng râm, hàng hóa sẵn sàng cho chủ mới khi lữ khách và dân phố qua lại trung tâm thương mại lịch sử này."
  building_lahur_bazaar_01_destination_desc: "[GetBuilding('lahur_bazaar_01').GetName] vang vọng âm thanh và màu sắc, các hẻm hẹp nhộn nhịp với người bán gia vị, thợ nhuộm và thợ kim hoàn. Khói thơm bốc lên từ quầy đồ ăn, mọi góc đều tràn đầy năng lượng hưng thịnh và thương mại sôi động."
  building_changan_market_01_destination_desc: "[GetBuilding('changan_market_01').GetName] nhộn nhịp thương nhân khắp thế giới dưới những lá cờ sặc sỡ. Hàng ngoại thêm màu sắc, nghệ sĩ đường phố và học giả hòa lẫn trong trung tâm thương mại sống động."
  building_khiva_bazaar_01_destination_desc: "[GetBuilding('khiva_bazaar_01').GetName] uốn lượn qua hẻm nắng dưới các tháp màu ngọc lam, đầy hương thì là và len. Thương nhân mặc cả trên thảm và ngà voi, tiếng họ vang vọng dưới mái vòm phản chiếu thương mại và đế chế sa mạc xưa."
  building_lhasa_market_01_destination_desc: "[GetBuilding('lhasa_market_01').GetName] trải dài dưới lá cờ cầu nguyện phất phơ, các quầy tràn bơ, hạt màu và len yak. Tăng sĩ, du mục và thương nhân giao tiếp trong không khí núi cao, mặc cả được làm dịu bởi tiếng chuông đền xa xa."
  building_dvin_shuka_01_destination_desc: "Khi đi qua [GetBuilding('dvin_shuka_01').GetName], không khí vang vọng giọng nói từ phương xa. Đồng lóe dưới mái che, thương nhân thúc ta thử kẹo và xem lụa sặc sỡ. Mỗi giao dịch hé lộ phần sinh khí của thành phố."
  building_herat_bazaar_01_destination_desc: "Ta đi qua các hành lang vòm [GetBuilding('herat_bazaar_01').GetName], gạch sáng bóng trên quầy bóng râm. Nước chảy qua rãnh đá, hương nhuộm và bụi còn thoang thoảng trong nhịp thương mại đều đều."
  building_hoshi_ryokan_01_destination_desc: "Ta đến [GetBuilding('hoshi_ryokan_01').GetName], dầm gỗ sáng bóng qua nhiều thế kỷ hiếu khách. Đèn lồng sáng dọc hành lang tatami, hương tuyết tùng và suối nóng thoang thoảng từ phòng tắm, thời gian dường như trôi chậm hơn."
  building_borobudur_01_destination_desc: "Bình minh, ta đứng trước [GetBuilding('borobudur_01').GetName], các bậc thang nổi lên như mandala đá từ sương mù. Phật chạm trổ quan sát ánh nắng chạm lên stupa, con đường từ đất đến giác ngộ khắc trên đá núi lửa."
  building_krakatoa_01_destination_desc: "Trên thuyền ở eo biển, ta quan sát [GetBuilding('krakatoa_01').GetName] hiện lên chân trời, sườn núi phủ khói bay. Biển thì thầm bất an, hương tro sắc nhọn nhắc nhở tâm núi bất an dưới sóng."
  building_po_klong_garai_01_destination_desc: "Ta đến [GetBuilding('po_klong_garai_01').GetName] dưới nắng chói, các tháp gạch đỏ vươn từ đồi khô như than hồng lòng thành. Các điêu khắc thần linh và rắn canh giữ thánh điện, nơi hương và tĩnh lặng tôn vinh vua hóa huyền thoại."
  building_citadel_thang_long_01_destination_desc: "Ta đi dọc lũy thành [GetBuilding('citadel_thang_long_01').GetName], tường đất vươn đến sông. Tháp canh nhìn ra hồ sen và mái ngói, binh sĩ và triều thần đi qua làn hương và sương mai, bảo vệ kinh thành đang lớn mạnh."
  building_citadel_thang_long_02_destination_desc: "Ta đi qua cổng [GetBuilding('citadel_thang_long_02').GetName], rồng cuộn trên tường đá cổ. Sân trong vang bước quân lính, mùi mưa trên gạch hòa với uy quyền lâu đời."
  building_angkor_wat_01_destination_desc: "Ta băng qua lối đá sa thạch tới [GetBuilding('angkor_wat_01').GetName], các tháp như nụ sen trên hào nước soi gương. Cột chạm và hành lang sắp xếp đối xứng, từng viên đá khắc thần linh, vũ công và nhịp điệu vượt thời gian."
  building_quanzhou_seaport_01_destination_desc: "[GetBuilding('quanzhou_seaport_01').GetName] nhộn nhịp, tàu dỡ hàng tại bến, thủy thủ hô vang giữa dây và xe, quan viên ghi chép cẩn thận từng thuyền. Nhịp điệu thương mại xác định trung tâm cảng sôi động này."
  building_qianling_mausoleum_01_destination_desc: "Ta đến [GetBuilding('qianling_mausoleum_01').GetName], lối đá dẫn lên đồi mộ hoàng gia. Tượng ngựa và sứ giả đứng hàng im lìm, bảo vệ Hoàng đế Cao Tông và Hoàng hậu Võ dưới lòng đất trang nghiêm."
  building_forbidden_city_01_destination_desc: "Ta bước vào [GetBuilding('forbidden_city_01').GetName] qua cổng đỏ cao, mái men óng ánh như nắng trên nước. Sân trong viền rồng chạm trổ, bố trí đối xứng, các điện xếp theo ngai vàng hoàng đế."
  building_kaifeng_palace_01_destination_desc: "Sương mai [GetBuilding('kaifeng_palace_01').GetName] hé lộ điện hoàng gia, dầm vẽ uyển chuyển. Nồi đồng bốc hơi bên sân ngói, thư pháp gia và quan lại đi dưới chạm khắc lưới, vang uy quyền triều Tống."
  building_giant_wild_goose_pagoda_01_destination_desc: "Ta đứng trước [GetBuilding('giant_wild_goose_pagoda_01').GetName], tháp bảy tầng gạch vàng đất, đầu đồng bảo vệ kinh Phật. Biểu tượng của lòng thành, học thuật và giao lưu văn hóa."
  building_lingyin_temple_01_destination_desc: "Khi tiến gần [GetBuilding('lingyin_temple_01').GetName] qua thung lũng sương Hàng Châu, Phật đá nhìn từ đỉnh Phi Lai. Trong điện chính, Phật Thích Ca dát vàng tỏa sáng giữa hương và tụng kinh."
  building_shaolin_monastery_01_destination_desc: "Ta đến [GetBuilding('shaolin_monastery_01').GetName] gần núi Tung, nơi tăng sĩ luyện tập giữa hương thông và hương, kết hợp thiền và võ thuật thành kỷ luật nhịp nhàng."
  building_wudang_mountain_temples_01_destination_desc: "Ta leo các đường quanh co [GetBuilding('wudang_mountain_temples_01').GetName], chùa bám vách núi mù sương. Mái đồng lóe qua mây, tăng sĩ di chuyển lặng lẽ giữa đền và thông. Nơi linh thiêng, kiến trúc và thiên nhiên hòa làm một."
  building_yungang_grottoes_01_destination_desc: "[GetBuilding('yungang_grottoes_01').GetName] là quần thể hang, vách đá màu mật chạm thành thánh điện lớn. Trong bóng mát mát, hàng Phật khổng lồ hướng ra ngoài, gương mặt điềm tĩnh còn dấu sơn xưa."
  building_leshan_giant_buddha_01_destination_desc: "Ta đứng trước [GetBuilding('leshan_giant_buddha_01').GetName], khắc vào vách đỏ trên ngã ba sông. Sương tụ quanh gối khổng lồ, tăng sĩ gần đó tụng kinh nhẹ, lời cầu hòa cùng gió đã hình thành núi thiêng."
  building_wulingyuan_01_destination_desc: "Chuyến đi đưa ta qua thung lũng phủ sương [GetBuilding('wulingyuan_01').GetName], trụ sa thạch cao như canh gác xưa trên rừng xanh mượt. Thác nước siêu thực đổ xuống vách đá, đền ẩn bám vách núi."
  building_swahili_port_lamu_destination_desc: "Ta đến [GetBuilding('swahili_port_lamu').GetName], nhà đá san hô hướng ra biển, thuyền trôi theo thủy triều. Không khí vang tiếng địa phương, hương đinh hương và muối lan tỏa trong hẻm nắng hẹp."
  building_swahili_port_pate_destination_desc: "Bờ [GetBuilding('swahili_port_pate').GetName] rực rỡ dưới nắng trưa, bến đá nhộn nhịp thương nhân gọi hàng trên thùng ngà và lúa. Cây chà là đung đưa sau tường cảng, cả đảo nhịp sống cùng tiếng biển xa."
  building_swahili_port_mombasa_destination_desc: "[GetBuilding('swahili_port_mombasa').GetName] trải dài vịnh lưỡi liềm, nước sống động với buồm và tiếng hò reo. Pháo đài đá giám sát cảng, chợ lan ra bờ, đầy hương dầu cọ, đồng, và lời hứa biển cả bất an."
  building_swahili_port_zanzibar_destination_desc: "[GetBuilding('swahili_port_zanzibar').GetName] nhộn nhịp dưới mây trôi khi ta đến, cánh cửa gỗ chạm dẫn vào hẻm đầy quầy gia vị, tàu ngoại cập cảng."
  building_swahili_port_pemba_destination_desc: "[GetBuilding('swahili_port_pemba').GetName] vang lên với mục đích yên tĩnh, hương đinh hương nặng nề trong không khí. Thương nhân xa lạ từ bờ Bắc trao đổi bạc, thuyền nhỏ dỡ bao gia vị cho các chợ xa."


  building_koganeyama_mines_destination_desc: "Đảo Kinka điểm xuyết những thợ mỏ cần cù của [GetBuilding('koganeyama_mines_01').GetName], tìm kiếm bụi vàng nổi tiếng mà Kanayama, thần khai thác, đã giấu nơi đây."
  building_tsushima_mines_destination_desc: "Danh tiếng [GetBuilding('tsushima_mines_01').GetName] thu hút dòng thợ mỏ không ngừng trải khắp đảo, khai thác quặng đen và tìm kiếm mạch mới."
  building_sado_mines_destination_desc: "Một nơi khiêm nhường, hoang vắng và biệt lập, nhưng dưới lòng đất, thợ mỏ [GetBuilding('sado_mines_01').GetName] miệt mài khai thác kho báu ẩn giấu của đảo."
  building_tada_mines_destination_desc: "Giữa núi rừng Settsu, [GetBuilding('tada_mines_01').GetName] vang vọng tiếng lao động của những thợ đồng, khai thác kho báu tiềm ẩn của đất."
  building_mozu_tombs_destination_desc: "[GetBuilding('mozu_tombs').GetName] là kỳ quan kỳ lạ. Nói là nơi an nghỉ của các hoàng đế xưa, các gò mộ đồ sộ với hào hình ổ khóa tạo nên cảnh quan vật lý cũng như tinh thần."
  building_trosky_castle_01_destination_desc: "[GetBuilding('trosky_castle_01').GetName] hùng vĩ được xây dựng giữa hai khối đá bazan khổng lồ, nơi các bậc trưởng lão tương truyền là những ngọn núi lửa đang ngủ say. Dù cái tên của nó mang nghĩa mỉa mai là 'tàn tích' do hình dáng của các vách đá, nhưng thực tế nơi đây hoàn toàn trái ngược."
 
  legendary_watchtower_destination_desc: "[GetBuilding('legendary_watchtower').GetName] vươn cao sừng sững, dõi theo vùng đất bằng ánh nhìn không bao giờ dao động. Kết cấu kiên cố của nó — một ngọn hải đăng có thể trông thấy từ nhiều dặm — là minh chứng cho sự cảnh giác của những người đã dựng nên công trình này. Không chỉ là nơi quan sát, tháp canh còn là biểu tượng của sự che chở trước bất kỳ kẻ nào dám đe dọa hòa bình của lãnh thổ."
  legendary_hunting_ground_destination_desc: "[GetBuilding('legendary_hunting_lodge').GetName] là một cõi giới nơi thiên nhiên hoang dã ngự trị tối cao. Vùng đất rộng lớn, tràn đầy hệ động thực vật phong phú, tạo nên một thánh địa nguyên sơ cho nghệ thuật săn bắn cao quý. Tại đây, truyền thống và thiên nhiên hòa quyện, mang đến một thử thách khắc nghiệt nhưng xứng đáng cho những ai muốn kiểm chứng bản lĩnh của mình trước hoang dã."
  legendary_palace_destination_desc: "Bao trùm trong vẻ huy hoàng, [GetBuilding('legendary_palace').GetName] là một kiệt tác kiến trúc mê hoặc mọi kẻ đặt chân vào lãnh địa của nó. Những đại sảnh và khu vườn xa hoa là minh chứng cho đỉnh cao của thành tựu nghệ thuật. Vừa là trung tâm quyền lực, vừa là biểu tượng của cái đẹp, cung điện này khơi dậy sự kính sợ và ngưỡng mộ trong lòng du khách."
  legendary_statue_destination_desc: "[GetBuilding('legendary_statue').GetName] sừng sững như một cống hiến bất tử dành cho lòng dũng cảm và những đức hạnh mà nó đại diện. Được tạc từ đá nhưng thấm đẫm tinh thần huyền thoại, pho tượng thu hút ánh nhìn của mọi người qua lại. Đây là tâm điểm của niềm tự hào và cảm hứng, hiện thân cho ký ức tập thể và khát vọng của nhân dân."
  legendary_shrine_destination_desc: "Nép mình trong sự tĩnh lặng, [GetBuilding('legendary_shrine').GetName] là một ốc đảo linh thiêng thu hút cả tín đồ lẫn những kẻ hiếu kỳ. Đây là nơi chiêm nghiệm và sùng kính, nơi nghi lễ và lời cầu nguyện vang vọng trên nền thời gian. Ngôi đền mang lại sự an yên và kết nối với thần linh, như một cây cầu giữa trần thế và cõi siêu linh."
  building_generic_destination_desc: "Khi ta đặt chân đến nơi này, bản sắc độc đáo cùng hơi thở lịch sử của nó lập tức hiện rõ. Công trình đứng đó như một minh chứng cho di sản trường tồn của vùng đất, và mỗi khía cạnh nơi đây đều kể một câu chuyện đang chờ được khám phá."

 
  building_castle_arrival_01_desc: "Sự háo hức dâng trào khi ta tiến gần [location.GetTitle.GetName]. Viễn cảnh được tận mắt chiêm ngưỡng vẻ huy hoàng của nơi này khiến ta tràn đầy mong đợi."
  building_castle_arrival_02_desc: "Tiến về phía [location.GetTitle.GetName], tim ta rộn ràng trước cảm giác được khám phá những truyền thuyết ẩn sâu sau các bức tường của nó."
  building_castle_arrival_03_desc: "Khi [location.GetTitle.GetName] hiện ra trước mắt, một tinh thần phiêu lưu trỗi dậy trong ta."
  building_castle_arrival_04_desc: "Quang cảnh của [location.GetTitle.GetName] khiến ta choáng ngợp, khơi dậy sự tò mò mãnh liệt về những câu chuyện mà nó cất giữ."
  building_castle_arrival_05_desc: "Khi đến gần [location.GetTitle.GetName], ta nóng lòng muốn khám phá những câu chuyện mà nó đã chứng kiến qua bao thời đại."
  building_city_arrival_01_desc: "Đặt chân đến [location.GetTitle.GetName], ta hào hứng trước ý nghĩ được khám phá những điều ẩn giấu và nền văn hóa sôi động nơi đây."
  building_city_arrival_02_desc: "Sự nhộn nhịp của [location.GetTitle.GetName] tiếp thêm sinh khí cho ta, khi ta mong chờ được hòa mình vào những con phố tấp nập."
  building_city_arrival_03_desc: "Khi bước vào [location.GetTitle.GetName], cảm giác kinh ngạc bao trùm lấy ta, háo hức khám phá những kho tàng văn hóa và con hẻm nhuốm màu lịch sử."
  building_city_arrival_04_desc: "Đặt chân vào [location.GetTitle.GetName], ta mong chờ được trải nghiệm những khu chợ sầm uất và các địa danh lịch sử."
  building_city_arrival_05_desc: "Nguồn năng lượng của [location.GetTitle.GetName] bao trùm lấy ta, khơi dậy sự tò mò muốn đào sâu vào nhịp sống sôi động và quá khứ huy hoàng của nó."
  building_temple_arrival_01_desc: "Bước vào [location.GetTitle.GetName], ta háo hức mong đợi những kỳ quan tâm linh đang chờ đón bên trong."
  building_temple_arrival_02_desc: "Hào quang thanh tịnh của [location.GetTitle.GetName] vẫy gọi ta, hứa hẹn một hành trình vào cõi an yên và trí tuệ cổ xưa."
  building_temple_arrival_03_desc: "Khi tiến gần [location.GetTitle.GetName], một cảm giác tôn kính sâu sắc bao trùm, mong chờ những điều linh thiêng mà nơi này mang lại."
  building_temple_arrival_04_desc: "Bước vào [location.GetTitle.GetName], ta sẵn sàng cảm nhận chiều sâu tâm linh và vẻ đẹp mà nơi đây ẩn chứa."
  building_temple_arrival_05_desc: "[location.GetTitle.GetName] hiện ra trước mắt ta như một thánh địa đức tin, và ta háo hức hòa mình vào bầu không khí linh thiêng của nó."
  building_tribal_holding_arrival_01_desc: "Khi đến gần [location.GetTitle.GetName], ta cảm nhận được tinh thần cộng đồng gắn kết nồng hậu đang chào đón mình."
  building_tribal_holding_arrival_02_desc: "Bầu không khí sôi động của [location.GetTitle.GetName] chào đón ta bằng những sắc màu rực rỡ và bản sắc văn hóa đậm nét."
  building_tribal_holding_arrival_03_desc: "Tiến về phía [location.GetTitle.GetName], sự hòa quyện hài hòa giữa thiên nhiên và truyền thống lập tức hiện rõ."
  building_tribal_holding_arrival_04_desc: "Nét mộc mạc của [location.GetTitle.GetName] khiến ta tràn đầy mong đợi và háo hức học hỏi."
  building_tribal_holding_arrival_05_desc: "Bước vào [location.GetTitle.GetName], ta ấn tượng trước sự giản dị và ấm áp của cộng đồng địa phương."

 
  building_religious_learning_outro_01_desc: "Chuyến viếng thăm này đã giúp ta hiểu sâu sắc hơn về những niềm tin và thực hành tâm linh đã định hình các nền văn minh."
  building_religious_learning_outro_02_desc: "Khám phá thánh địa này đã làm giàu thêm nhận thức của ta về ảnh hưởng sâu rộng của đức tin đối với lịch sử và văn hóa nhân loại."
  building_religious_learning_outro_03_desc: "Hành trình này đã soi sáng những cách thức đa dạng mà lòng mộ đạo tôn giáo được thể hiện và tôn kính qua dòng thời gian."
  building_diplomatic_learning_outro_01_desc: "Trải nghiệm này đã mở rộng góc nhìn của ta về sự phức tạp và tinh tế trong quan hệ ngoại giao và nghệ thuật trị quốc."
  building_diplomatic_learning_outro_02_desc: "Ta rời đi với sự trân trọng lớn hơn dành cho nghệ thuật ngoại giao tinh vi và những sắc thái của các liên minh chính trị."
  building_diplomatic_learning_outro_03_desc: "Thời gian ở đây đã giúp ta hiểu rõ hơn thế cân bằng quyền lực mong manh và vai trò then chốt của ngoại giao trong việc định hình lịch sử."
  building_martial_learning_outro_01_desc: "Binh pháp và những hiểu biết chiến lược thu nhận được từ chuyến đi này đã mở rộng đáng kể nhận thức của ta về chiến tranh."
  building_martial_learning_outro_02_desc: "Cuộc khám phá này mang lại những bài học quý giá về chiến thuật quân sự và nghệ thuật dụng binh, điều cốt yếu với bất kỳ nhà lãnh đạo nào."
  building_martial_learning_outro_03_desc: "Ta đã lĩnh hội được nhiều tri thức quan trọng về chiến lược trận mạc và vai trò của võ nghệ trong việc xoay chuyển dòng lịch sử."
  building_economic_learning_outro_01_desc: "Chuyến viếng thăm này đã giúp ta nắm vững hơn các nguyên lý kinh tế và vai trò then chốt của thương mại đối với sự thịnh vượng của các quốc gia."
  building_economic_learning_outro_02_desc: "Khám phá nơi đây đã giúp ta hiểu sâu hơn về những cơ chế phức tạp của sự phát triển kinh tế."
  building_economic_learning_outro_03_desc: "Ta rời đi với một góc nhìn phong phú hơn về tầm quan trọng sống còn của sự am hiểu kinh tế trong việc duy trì những cường quốc hùng mạnh."
  building_man_made_wonder_learning_outro_01_desc: "Sự khéo léo và tay nghề thủ công được chứng kiến nơi đây đã để lại trong ta ấn tượng sâu sắc về sức sáng tạo và tham vọng của con người."
  building_man_made_wonder_learning_outro_02_desc: "Kỳ quan kiến tạo này đã mở rộng sự ngưỡng mộ của ta đối với những đỉnh cao thành tựu mà con người có thể vươn tới."
  building_man_made_wonder_learning_outro_03_desc: "Ta rời đi với nguồn cảm hứng từ di sản kiến trúc phi thường, minh chứng cho tiềm năng to lớn của nhân loại."
  building_natural_wonder_learning_outro_01_desc: "Vẻ đẹp choáng ngợp và sự hùng vĩ của kỳ quan thiên nhiên này đã khiến ta càng trân trọng hơn những kỳ diệu của thế giới."
  building_natural_wonder_learning_outro_02_desc: "Chuyến viếng thăm này đã gieo vào lòng ta một niềm kính awe sâu sắc đối với thiên nhiên và vô vàn điều kỳ diệu của nó."
  building_natural_wonder_learning_outro_03_desc: "Ta ra đi với sự tôn kính renewed dành cho sức mạnh và vẻ đẹp choáng ngợp của thiên nhiên, cũng như khả năng định hình thế giới và góc nhìn của con người."

  building_exploration_01_desc: "Với sự háo hức tràn đầy, ta bắt đầu cuộc khám phá!"
  building_exploration_02_desc: "Đôi mắt mở to vì tò mò, ta háo hức tiến bước!"
  building_exploration_03_desc: "Tràn ngập phấn khích, ta lên đường khám phá những kỳ diệu của nơi này!"
  building_exploration_04_desc: "Mang theo cảm giác kinh ngạc, ta bắt đầu khám phá từng ngóc ngách!"
  building_exploration_05_desc: "Ta sải bước với niềm hứng khởi khám phá, háo hức tiếp thu tri thức mà nơi này hứa hẹn!"
  building_exploration_06_desc: "Với tinh thần nhiệt thành, ta bắt đầu cuộc thám hiểm!"
  building_exploration_07_desc: "Với trái tim rộn ràng, ta khởi hành hành trình qua nơi này!"
  building_exploration_08_desc: "Mang trong mình tinh thần phiêu lưu, ta lên đường băng qua vùng đất này!"
  building_exploration_09_desc: "Ta háo hức bắt đầu cuộc khám phá, mỗi bước chân đều tràn đầy mong đợi!"
  building_exploration_10_desc: "Với tinh thần nhiệt huyết, ta lang thang khám phá nơi chốn này!"
  building_exploration_11_desc: "Ta bước tới với tinh thần mạo hiểm, háo hức tìm hiểu bề dày lịch sử của nơi này!"
  building_exploration_12_desc: "Với những bước chân vui tươi, ta bắt đầu khám phá!"
  building_exploration_13_desc: "Ta háo hức khởi hành hành trình quanh nơi này, mong chờ những phát hiện phía trước!"
  building_exploration_14_desc: "Đầy phấn khích, ta tiến vào nơi chốn này, trông đợi những cảnh tượng mà nó hứa hẹn!"
  building_exploration_15_desc: "Ta bắt đầu cuộc khám phá với cảm giác kinh ngạc, khao khát học hỏi từ di sản của nơi này!"
  building_exploration_16_desc: "Với sự mong chờ rạo rực, ta dạo bước qua nơi đây, sẵn sàng bị vẻ đẹp của nó cuốn hút!"
  building_exploration_17_desc: "Ta bắt đầu cuộc khám phá với cảm giác phấn khích tột độ!"
  building_exploration_18_desc: "Ta khởi hành hành trình qua nơi này với sự tò mò háo hức!"
  building_exploration_19_desc: "Với trái tim đầy nhiệt huyết, ta lên đường khám phá!"
  building_exploration_20_desc: "Ta bắt đầu cuộc khám phá, háo hức được cảm nhận sự tráng lệ mà nơi này toát lên!"

  travel_destinations.1000.t: "Những danh thắng của [location.GetNameNoTooltip]"
  travel_destinations.1000.desc: "[location.Custom('GetTouristHoldingIntro')]\n\n[location.Custom('GetSpecialBuildingTouristDescriptor')]\n\n[location.Custom('GetTouristStartEventOutro')]"
 
  the_with_space: "the "
  travel_start_event.1090.t_activity_roaming: "$activity_roaming$: Lại lên đường"
  travel_start_event.1090.t_activity_journey: "Thám hiểm: Hướng tới [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!"
  travel_start_event.1090.t_activity_survey: "$activity_survey$: Thị sát lãnh thổ"
  travel_start_event.1000.norwegian: "Ra ngoài là vui, chẳng bao giờ buồn!"
  travel_start_event.1090.desc_activity_roaming: "Cuối cùng thì con đường rộng mở cũng hiện ra trước mắt ta! Chẳng bao lâu nữa, ta sẽ đặt chân tới vùng [location.Custom('TerrainTypeProvincePrefix')] [location.Custom('TerrainTypeProvince')] của [location.GetName] xinh đẹp.\n\nÔi, ta khao khát biết bao những [location.Custom('GetProvinceFoliageDesc')] nơi ấy cùng hương thơm ngọt ngào của [location.Custom('get_region_flower_type_plural')]. Được ngắm nhìn những [location.Custom('GetRandomRegionalWildDaytimeBirdProvince')] bay lượn trên bầu trời rộng mở phía trên ta!\n\nTa phải lên đường ngay thôi!"
  travel_start_event.1090.desc_activity_journey: "Con đường tới [location.GetName] còn dài, nhưng ta không thể chờ đợi thêm để khai mở những bí mật của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] cùng những người [location.GetTitle.GetHolder.Custom('ComplimentAdjective')] thuộc [location.GetCounty.GetTitle.GetAdjective] [location.GetCulture.GetCollectiveNoun] đang sinh sống nơi đó! [ROOT.Char.Custom('IntentInitialEventDesc')]\n\nGiá mà ta đã ở đó rồi, chúng ta phải mau chóng lên đường!"
  knowledge_hoarding_1: "Ta sẽ ghi chép không ngừng và nuốt trọn từng mẩu tri thức nhỏ nhất mà ta có thể tìm thấy."
  knowledge_hoarding_2: "Ta sẽ biên soạn những ghi chép toàn diện và tiếp thu mọi mảnh vụn trí tuệ có thể đạt được."
  knowledge_hoarding_3: "Ta dự định thu thập những tư liệu đầy đủ và hấp thụ từng hiểu biết có thể lĩnh hội."
  curiosity_1: "Ta háo hức mong chờ được gặp gỡ người dân địa phương, hy vọng được hòa mình vào những câu chuyện và truyền thống của họ."
  curiosity_2: "Viễn cảnh được gắn kết với cộng đồng địa phương và học hỏi từ những trải nghiệm của họ khiến ta tràn đầy niềm vui."
  curiosity_3: "Sự phấn khích trong ta ngày càng lớn khi nghĩ tới việc gặp gỡ những người gọi nơi này là quê hương, cùng sẻ chia chuyện kể và tri thức."
  spread_legend_1: "Ta sẽ dệt câu chuyện về [ROOT.Char.GetPromotedLegend.GetName] vào chính mảnh đất này, để lại dấu ấn của nó trong lịch sử."
  spread_legend_2: "Chuyến đi của ta cũng là một sứ mệnh: lan truyền danh tiếng của [ROOT.Char.GetPromotedLegend.GetName], biến nó thành một phần trong truyền thuyết địa phương."
  spread_legend_3: "Mục tiêu của ta là thấy [ROOT.Char.GetPromotedLegend.GetName] được tôn vinh bởi những người ta gặp, để huyền thoại ấy lớn mạnh qua từng lần truyền kể."
 
  travel_start_event.1090.desc_activity_survey: "Đã đến lúc ta phải tự mình nắm quyền. Ta sẽ trực tiếp giám sát mọi hoạt động tại [location.GetName], kiểm kê từng [root_scope.Custom('RegionalFarmAnimal')], từng công sự, từng thanh gươm và từng bao lương thực!\n\nLãnh địa của ta sẽ được quản lý chặt chẽ bậc nhất — lên ngựa nào!"
