l_english:
  tgp_natural_disaster_recovery_tax_burden: "Gánh nặng thuế phục hồi cho người sống sót"
  tgp_natural_disaster_recovery_tax_burden_desc: "Những người thu thuế của nhân vật này đã được chỉ thị chuyển hướng thuế sang các nỗ lực phục hồi sau thảm họa."
  tgp_natural_disaster_recovery_tax_burden_reduced: "$tgp_natural_disaster_recovery_tax_burden$"
  tgp_natural_disaster_recovery_tax_burden_reduced_desc: "$tgp_natural_disaster_recovery_tax_burden_desc$"
  tgp_natural_disaster_recovery_popular_hero: "Anh hùng cứu trợ thảm họa"
  tgp_natural_disaster_recovery_popular_hero_desc: "Nhân vật này được ca ngợi rộng rãi vì đã tài trợ cho các nỗ lực phục hồi sau thảm họa, qua đó giành được sự kính trọng trên khắp lãnh thổ."
  tgp_natural_disaster_memorial_fortifications: "Công sự tưởng niệm"
  tgp_natural_disaster_memorial_fortifications_desc: "Các công sự trong vùng này không chỉ được xây dựng lại mà còn được cải thiện, vừa là đài tưởng niệm những người đã khuất vừa là biểu tượng cho chiến thắng trước thảm họa."
  tgp_natural_disaster_built_memorial_fortifications: "Người xây dựng công sự tưởng niệm"
  tgp_natural_disaster_built_memorial_fortifications_desc: "Nhân vật này đã hào phóng tài trợ cho việc xây dựng các công sự được cải tiến tại nơi xảy ra thảm họa, tạo nên dấu ấn lâu dài về cam kết của triều đại họ đối với phúc lợi của vùng đất."
  tgp_natural_disaster_memorial_fortifications_wierdijks: "$tgp_natural_disaster_memorial_fortifications$"
  tgp_natural_disaster_memorial_fortifications_wierdijks_desc: "$tgp_natural_disaster_memorial_fortifications_desc$"
  tgp_natural_disaster_keeper_of_order: "Người giữ gìn trật tự"
  tgp_natural_disaster_keeper_of_order_desc: "Sự giám sát quyết đoán của nhân vật này đối với các nỗ lực dọn dẹp — nhanh chóng dọn sạch đống đổ nát và khôi phục trật tự — đã mang lại cho họ sự kính trọng từ các chư hầu."
  tgp_natural_disaster_cleanup_material_recovery: "Thu hồi vật liệu sau thảm họa"
  tgp_natural_disaster_cleanup_material_recovery_desc: "Các vật liệu thu hồi được từ việc tổ chức dọn dẹp sau thảm họa đã được tái sử dụng, giúp giảm đáng kể chi phí xây dựng."
  tgp_natural_disaster_reconstruction_economic_activity: "Bùng nổ kinh tế tái thiết"
  tgp_natural_disaster_reconstruction_economic_activity_desc: "Các nỗ lực tái thiết đã kích thích hoạt động kinh tế đáng kể tại hạt này, với hoạt động kinh doanh gia tăng từ các công việc xây dựng lại."
  tgp_natural_disaster_reconstruction_development_growth: "Thúc đẩy phát triển nhờ tái thiết"
  tgp_natural_disaster_reconstruction_development_growth_desc: "Những nỗ lực tái thiết quy mô lớn đã mang đến các kỹ thuật, vật liệu và cơ sở hạ tầng mới, giúp tăng tốc độ phát triển của hạt này."
  tgp_natural_disaster_resettlement_domain_burden: "Gánh nặng lãnh địa do tái định cư sau thảm họa"
  tgp_natural_disaster_resettlement_domain_burden_desc: "Việc quản lý các cộng đồng bị di dời khỏi vùng thảm họa đã làm quá tải năng lực hành chính, làm giảm hiệu quả quản lý lãnh địa."
  tgp_natural_disaster_resettlement_taxation_loss: "Thất thu thuế do tái định cư"
  tgp_natural_disaster_resettlement_taxation_loss_desc: "Sự di dời hỗn loạn của dân cư đã dẫn đến việc giảm thu thuế."
  tgp_natural_disaster_resettlement_levy_growth: "Quân dịch từ người tị nạn"
  tgp_natural_disaster_resettlement_levy_growth_desc: "Nhiều người sống sót bị di dời sau thảm họa gần đây sẵn sàng tình nguyện tham gia phục vụ quân sự."
  tgp_natural_disaster_aid_monthly_expense: "Chi phí cứu trợ thảm họa hàng tháng"
  tgp_natural_disaster_aid_monthly_expense_desc: "Chi phí hàng tháng phát sinh từ việc cung cấp viện trợ nhân đạo cho các nạn nhân thảm họa, bao gồm lương thực, chỗ ở và vật tư y tế."
  tgp_natural_disaster_relief_savior: "Đấng cứu tinh cứu trợ thảm họa"
  tgp_natural_disaster_relief_savior_desc: "Nhân vật này được tôn kính rộng rãi nhờ sự hỗ trợ đầy lòng trắc ẩn dành cho các nạn nhân thảm họa, qua đó giành được sự kính trọng và ghi nhận tinh thần lâu dài."
  tgp_natural_disaster_aid_control_recovery: "Phục hồi kiểm soát nhờ cứu trợ thảm họa"
  tgp_natural_disaster_aid_control_recovery_desc: "Các nỗ lực viện trợ nhân đạo đã giúp khôi phục trật tự và ổn định tại các khu vực bị ảnh hưởng bởi thảm họa, đẩy nhanh quá trình phục hồi quyền kiểm soát hành chính địa phương."
  tgp_natural_disaster_drainage_reduce_levies: "Nỗ lực thoát nước: Giảm quân dịch"
  tgp_natural_disaster_drainage_reduce_levies_desc: "Quân dịch địa phương được điều hướng để hỗ trợ các công việc thoát nước, làm giảm đáng kể lực lượng quân sự sẵn có trong một thời gian."
  tgp_natural_disaster_drainage_work_levy_shortage: "Thiếu hụt quân dịch do công tác thoát nước"
  tgp_natural_disaster_drainage_work_levy_shortage_desc: "Nhiều quân dịch của chúng ta đang bận rộn với công việc thoát nước sau lũ lụt, làm suy giảm nghiêm trọng khả năng bổ sung lực lượng quân sự."
  tgp_natural_disaster_recovery_minister_chancellor: "Đại Thừa Tướng Hỗ Trợ Khắc Phục Thiên Tai"
  tgp_natural_disaster_recovery_minister_chancellor_desc: "Nỗ lực khắc phục thiên tai của nhân vật này được Đại Thừa Tướng hậu thuẫn."
  tgp_natural_disaster_recovery_minister_of_personnel: "Bộ Lại Hỗ Trợ Khắc Phục Thiên Tai"
  tgp_natural_disaster_recovery_minister_of_personnel_desc: "Nỗ lực khắc phục thiên tai của nhân vật này được Bộ Lại hậu thuẫn."
  tgp_natural_disaster_recovery_minister_of_rites: "Bộ Lễ Hỗ Trợ Khắc Phục Thiên Tai"
  tgp_natural_disaster_recovery_minister_of_rites_desc: "Nỗ lực khắc phục thiên tai của nhân vật này được Bộ Lễ hậu thuẫn."
  tgp_natural_disaster_recovery_minister_of_war: "Bộ Binh Hỗ Trợ Khắc Phục Thiên Tai"
  tgp_natural_disaster_recovery_minister_of_war_desc: "Nỗ lực khắc phục thiên tai của nhân vật này được Bộ Binh hậu thuẫn."
