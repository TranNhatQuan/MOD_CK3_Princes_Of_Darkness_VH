l_english:
  bp1_1000_time_with_bf_modifier:0 "Thời Gian Chất Lượng Bên Bạn Thân"
  bp1_1000_time_with_bf_modifier_desc:0 "Nhân vật này đang dành thời gian chất lượng bên người Bạn Thân nhất của mình"
  bp1_1000_focus_on_work_modifier:0 "Tập Trung Vào Công Việc"
  bp1_1000_focus_on_work_modifier_desc:0 "Nhân vật này sao nhãng Bạn Bè để tập trung vào bổn phận của mình."

  bp1_1020_friend_with_modifier:0 "Người Ngài Chu Đáo"
  bp1_1020_friend_with_modifier_desc:0 "Một người Ngài tận tâm đang ngồi bên giường của nhân vật này."
  bp1_superstition_modifier:0 "Mê Tín"
  bp1_superstition_modifier_desc:0 "Cuộc sống của nhân vật này bị chi phối bởi niềm tin vào các thế lực siêu nhiên mang lại vận may hoặc xui xẻo."
  bp1_1070_unlucky_charm_modifier:0 "Bùa Xui Xẻo"
  bp1_1070_unlucky_charm_modifier_desc:0 "Vận rủi đã bị một kẻ thù độc ác gieo lên nhân vật này."
  bp1_well_fed_pigs_modifier:0 "Lợn Được Nuôi No"
  bp1_well_fed_pigs_modifier_desc:0 "Nhân vật này có một số gia súc béo tốt một cách đáng ngờ..."

  humiliated_by_rival_modifier:0 "Bị Sỉ Nhục"
  humiliated_by_rival_modifier_desc:0 "Nhân vật này đã bị một kình địch bẽ mặt công khai, và vẫn chưa thể rũ bỏ nỗi nhục."
  triumphant_over_rival_modifier:0 "Đắc Thắng"
  triumphant_over_rival_modifier_desc:0 "Nhân vật này đã công khai đánh bại một kình địch, và vì thế bước đi với tinh thần phấn chấn hơn hẳn."

  dead_best_friend_modifier:0 "Nỗi Đau Dai Dẳng"
  dead_best_friend_modifier_desc:0 "Người Bạn Thân nhất của nhân vật này đã qua đời, và họ vẫn chưa thể hoàn toàn vượt qua."

  linguistically_challenged_modifier:0 "Khiếm Khuyết Ngôn Ngữ"
  linguistically_challenged_modifier_desc:0 "Nhân vật này phát âm một số từ khác với chuẩn mực được chấp nhận, và vì thế bị chế giễu."

  descriptivist_modifier:0 "Chủ Nghĩa Mô Tả"
  descriptivist_modifier_desc:0 "Nhân vật này khăng khăng sử dụng cách tiếp cận ngôn ngữ của riêng mình, cho thấy sự thiếu hụt rõ rệt về giáo dục ngôn ngữ học."

  sneaking_suspicion_modifier:0 "Nghi Ngờ Âm Ỉ"
  sneaking_suspicion_modifier_desc:0 "Nhân vật này tỏ ra có vẻ lạc quan, như thể đã gạt sang một bên những sự kiện đáng lo ngại. Hoặc ít nhất, họ đã #EMP cố gắng#! làm vậy..."

  busy_guards_modifier:0 "Vệ Binh Bận Rộn"
  busy_guards_modifier_desc:0 "Nhân vật này đã chuyển hướng nỗ lực của vệ binh sang những việc vụn vặt thay vì bảo vệ chính mình."

  lacking_supplies_modifier:0 "Thiếu Nguồn Cung"
  lacking_supplies_modifier_desc:0 "Nhân vật này đã để những hành vi mờ ám của kẻ khác không bị điều tra, và vì thế kho lương thực bị thiếu hụt."

  optimist_modifier:0 "Lạc Quan"
  optimist_modifier_desc:0 "Với nhân vật này, cốc rượu lúc nào cũng đầy một nửa."

  lacking_poultry_modifier:0 "Thiếu Sản Phẩm Gia Cầm"
  lacking_poultry_modifier_desc:0 "Hạt này đang thiếu lương thực và sản phẩm do gà cung cấp."

  obsessively_neurotic_modifier:0 "Ám Ảnh Lo Âu"
  obsessively_neurotic_modifier_desc:0 "Nhân vật này nhìn thấy hiểm nguy ở khắp mọi nơi, và sống trong sợ hãi."

  unhappy_spouse_modifier:0 "Hôn Nhân Bất Hạnh"
  unhappy_spouse_modifier_desc:0 "Những chứng lo âu của nhân vật này đã làm rạn nứt cuộc hôn nhân của họ, có thể đến mức không thể cứu vãn."

  disdained_modifier:0 "Bị Khinh Miệt"
  disdained_modifier_desc:0 "Nhân vật này nổi tiếng là bị chính các chư hầu của mình thao túng, những kẻ công khai coi thường nỗ lực giữ trật tự của họ."

  cat_revenge_modifier:0 "Báo Thù Cho Mèo"
  cat_revenge_modifier_desc:0 "Con mèo của nhân vật này đã bị kẻ thù không đội trời chung sát hại, và vì thế họ bị ám ảnh bởi ý nghĩ trả thù."

  cat_survived_modifier:0 "Bất Ngờ Mèo Sống Sót"
  cat_survived_modifier_desc:0 "Con mèo của nhân vật này bằng cách nào đó đã sống sót sau một âm mưu sát hại của kẻ thù."

  sated_modifier:0 "Thỏa Mãn"
  sated_modifier_desc:0 "Nhân vật này đã có một khoảng thời gian #EMP chất lượng#! bên người tình của mình."
  family_troubles_modifier:0 "Rắc Rối Gia Đình"
  family_troubles_modifier_desc:0 "Nhân vật này có một số người thân trong đại gia đình đang gặp vận rủi."
 
  skinned_pet_modifier:0 "Thú Cưng Bị Lột Da"
  skinned_pet_modifier_desc:0 "Thú cưng yêu quý của nhân vật này đã bị lột da và biến thành trang phục bởi âm mưu của một kình địch."
