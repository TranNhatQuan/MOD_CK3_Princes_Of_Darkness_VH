l_english:
  court_possessed_improved_condition_modifier:0 "Điều Trị Thành Công Chứng Bị Nhập"
  court_possessed_improved_condition_modifier_desc:1 "Nhân vật này cảm thấy khá hơn sau khi được điều trị, và những người khác cũng bớt sợ hãi hơn."
  6050_juicy_readings_modifier:0 "Đọc Những Tác Phẩm Gợi Cảm"
  6050_juicy_readings_modifier_desc:0 "Nhân vật này đã đắm chìm trong những tác phẩm mang tính gợi dục, và áp dụng những điều học được."
  court_no_wine_modifier:0 "Kiêng Rượu"
  court_no_wine_modifier_desc:1 "Nhân vật này đã áp dụng một lối sống khắc khổ bằng cách kiêng rượu hoàn toàn."
  court_moderate_drinking_modifier:0 "Uống Rượu Điều Độ"
  court_moderate_drinking_modifier_desc:1 "Nhân vật này là người uống rượu có chừng mực trong giao tiếp xã hội."
  rivers_of_wine_modifier: "Sông Rượu"
  rivers_of_wine_modifier_desc: "Nhân vật này theo đuổi cách tiếp cận khoái lạc đối với rượu; không hẳn là tốt cho sức khỏe, nhưng ít nhất Bạn Bè của họ cũng được uống rượu rẻ."
  court_fancy_seal_modifier:0 "Con Dấu Sáp Cầu Kỳ"
  court_fancy_seal_modifier_desc:1 "Một con dấu sáp cầu kỳ để ký tài liệu mà không cần đọc nội dung."
  court_tax_relief_county_modifier:0 "Giảm Thuế"
  court_tax_relief_county_modifier_desc:1 "Lãnh chúa của tỉnh này đã ban hành chính sách giảm thuế, khuyến khích sự phát triển."
  hold_court_inspector_modifier:0 "Thanh Tra Chính Thức"
  hold_court_inspector_modifier_desc:1 "Nhân vật này được triều đình trung ương cử đến để giám sát sự phát triển địa phương."
  hold_court_bilingual_readings_modifier:0 "Đọc Song Ngữ"
  hold_court_bilingual_readings_modifier_desc:1 "Nhân vật này đang nghiên cứu những tác phẩm văn học vĩ đại nhất của một nền văn hóa khác."
  hold_court_mysterious_book_modifier:0 "Cuốn Sách Bí Ẩn"
  hold_court_mysterious_book_modifier_desc:1 "Nhân vật này sở hữu một cuốn sách cổ được viết bằng một ngôn ngữ bí ẩn."
  court_6080_cultural_hostility_modifier:0 "Thù Địch Với Nền Văn Hóa Khác"
  court_6080_cultural_hostility_modifier_desc:1 "Nhân vật này đã đàn áp một nền văn hóa khác trong lãnh thổ của mình."
  court_6090_almoners_county_modifier:0 "Phát Chẩn"
  court_6090_almoners_county_modifier_desc:0 "Việc bố thí hào phóng khuyến khích dân địa phương cải đạo."
  court_6090_executioners_county_modifier:0 "Xử Tử"
  court_6090_executioners_county_modifier_desc:0 "Những cuộc hành quyết mang tính răn đe đối với kẻ ngoại đạo giúp giữ trật tự cho dân chúng."
  6110_war_compensations_county_modifier:0 "Bồi Thường Chiến Tranh"
  6110_war_compensations_county_modifier_desc:0 "Người cai trị vùng đất này đã gửi tiền để giảm bớt khổ đau cho dân chúng trong thời chiến."
  6110_sent_alms_county_modifier:0 "Bố Thí Từ Lãnh Chúa"
  6110_sent_alms_county_modifier_desc:0 "Người cai trị vùng đất này đã gửi bố thí hào phóng để giảm bớt khổ đau cho dân chúng trong thời chiến."
  6120_extra_taxes_modifier:0 "Thuế Phụ"
  6120_extra_taxes_modifier_desc:0 "Thuế đặc biệt chưa bao giờ được các chư hầu ưa chuộng."
  6121_seneschal_domesday_modifier:0 "Khảo Sát Đất Đai Của Tổng Quản"
  6121_seneschal_domesday_modifier_desc:0 "Việc đánh thuế chư hầu của nhân vật này hiệu quả hơn nhờ cuộc khảo sát toàn diện lãnh thổ."
  6121_steward_domesday_modifier:0 "Khảo Sát Đất Đai Của Quản Gia"
  6121_steward_domesday_modifier_desc:0 "Việc đánh thuế chư hầu của nhân vật này hiệu quả hơn nhờ cuộc khảo sát toàn diện lãnh thổ."
  6131_mapped_wilderness_county_modifier:0 "Hoang Dã Được Lập Bản Đồ"
  6131_mapped_wilderness_county_modifier_desc:0 "Hồ sơ địa chính địa phương đã bao gồm cả vùng hoang dã, giúp khu vực an toàn và dễ kiểm soát hơn."
  6140_new_carpet_modifier:0 "Thảm Da"
  6140_new_carpet_modifier_desc:0 "Nhân vật này sở hữu một tấm thảm ấm áp được làm từ da của một sinh vật hùng vĩ."
  6140_pet_modifier:0 "Quái Thú Nuôi"
  6140_pet_modifier_desc:0 "Một sinh vật đáng sợ để gieo rắc nỗi sợ và sự kính nể trong giới cận thần và chư hầu."
  6140_animal_guardian_modifier:0 "Hộ Vệ Hung Dữ"
  6140_animal_guardian_modifier_desc:0 "Một con thú gầm gừ đang canh giữ tù nhân này."
  6160_seneschal_help_modifier:0 "Hỗ Trợ Từ Tổng Quản"
  6160_seneschal_help_modifier_desc:0 "Nhân vật này đang nhận được sự giúp đỡ của tổng quản trong các vấn đề hành chính."
  6190_safe_graves_county_modifier:0 "Nghĩa Địa An Toàn"
  6190_safe_graves_county_modifier_desc:0 "Lãnh chúa của hạt này đã chấm dứt các hoạt động đào trộm mộ mờ ám."
  6190_grave_robbing_county_modifier:0 "Khuyến Khích Đào Trộm Mộ"
  6190_grave_robbing_county_modifier_desc:0 "Lãnh chúa của hạt này dung túng và thậm chí khuyến khích đào trộm mộ vì mục đích nghiên cứu."
  6210_architect_county_modifier:0 "Bị Ấn Tượng Bởi Văn Hóa"
  6210_architect_county_modifier_desc:0 "Người dân trong hạt này bị ấn tượng bởi những thành tựu của nền văn hóa của lãnh chúa."
  6230_new_elephants_modifier:0 "Voi Hung Dữ"
  6230_new_elephants_modifier_desc:0 "Quân đội của nhân vật này được hỗ trợ bởi một đàn voi hoang dã đặc biệt hung hãn."
  6230_elephant_slayer_county_modifier:0 "Kẻ Tàn Sát Voi"
  6230_elephant_slayer_county_modifier_desc:0 "Lãnh chúa của hạt này đã ra lệnh thảm sát voi."
  6230_rebuilding: "Tái Thiết"
  6230_rebuilding_desc: "Hạt này đã được cấp nguồn tài trợ lớn để tái thiết sau một sự cố nghiêm trọng liên quan đến voi điên cuồng tàn phá."

  court_fashion_foreign_modifier: "Sự Hiện Diện Kinh Ngạc"
  court_fashion_foreign_modifier_desc: "Tất cả người ngoại quốc đều ngưỡng mộ và ghen tị với thời trang của triều đình nhân vật này. Tăng hiệu quả của [foreign_affairs|E]."
  court_fashion_culture_modifier: "Nền Văn Hóa Rực Rỡ Nhất"
  court_fashion_culture_modifier_desc: "Tất cả người ngoại quốc đều muốn bắt chước thời trang của triều đình nhân vật này. Tăng hiệu quả của [promote_culture|E]."
  court_fashion_sell_modifier: "Thời Trang Thượng Hạng"
  court_fashion_sell_modifier_desc: "Tất cả người ngoại quốc đều muốn mua trang phục theo phong cách của triều đình nhân vật này."
  healthy_and_modest_diet_modifier: "Chế Độ Ăn Uống Lành Mạnh Và Giản Dị"
  healthy_and_modest_diet_modifier_desc: "Nhân vật này đã chọn một chế độ ăn điều độ và khiêm nhường."
  cant_poison_soup_modifier: "Không Thể Đầu Độc Cùng Một Món Canh"
  cant_poison_soup_modifier_desc: "Ngài không thể nhận ra mùi vị của thuốc độc nếu món canh lúc nào cũng có cùng một hương vị!\nCác [GetScheme('murder').GetTypeName] [scheme|E] thù địch có [success_chance|E] #P -50#!."
  cant_poison_soup_modifier_value: "$cant_poison_soup_modifier$: $VALUE|+0=-+$"
  lodgings_epidemics_resistance_modifier: "Chỗ Ở Được Cải Thiện"
  lodgings_epidemics_resistance_modifier_desc: "Khu lưu trú của triều đình nay sạch sẽ và rộng rãi hơn, giúp giảm sự lây lan của bệnh tật."
  lodgings_epidemics_resistance_modifier_1: "$lodgings_epidemics_resistance_modifier$"
  lodgings_epidemics_resistance_modifier_1_desc: "$lodgings_epidemics_resistance_modifier_desc$"
  lodgings_epidemics_resistance_modifier_2: "$lodgings_epidemics_resistance_modifier$"
  lodgings_epidemics_resistance_modifier_2_desc: "$lodgings_epidemics_resistance_modifier_desc$"
  lodgings_epidemics_no_resistance_modifier: "Điều Kiện Sống Tồi Tệ"
  lodgings_epidemics_no_resistance_modifier_desc: "Khu lưu trú của triều đình chật chội và bẩn thỉu, làm gia tăng sự lây lan của dịch bệnh."
  court_war_immigration_modifier: "Người Tị Nạn Chiến Tranh"
  court_war_immigration_modifier_desc: "Hạt này đang chứng kiến làn sóng người tị nạn chiến tranh ổn định từ các hạt giáp ranh."
  spies_behind_every_corner_modifier: "Gián Điệp Khắp Mọi Ngóc Ngách"
  spies_behind_every_corner_modifier_desc: "Triều đình của nhân vật này có quá nhiều người hầu đến mức không thể theo dõi hết.\nTăng mức chấp nhận [agent|E] và [success_chance|E] cho các [hostile_schemes|E] cả khi thực hiện lẫn khi bị nhắm tới."
  servants_aplenty_cleaning_modifier: "Đầy Đủ Người Hầu"
  servants_aplenty_cleaning_modifier_desc: "Một lãnh chúa không cần biết tên hay mặt của từng người hầu; chỉ cần biết rằng họ đang làm việc chăm chỉ để giữ nơi ở luôn trong tình trạng tốt nhất."
  humble_appearance_modifier: "Diện Mạo Giản Dị"
  humble_appearance_modifier_desc: "Nhân vật này không quan tâm đến trang phục xa hoa hay vẻ bề ngoài phù phiếm; tiết kiệm vàng hữu ích hơn nhiều."
  ghost_writer_at_court_modifier: "Người Viết Diễn Văn"
  ghost_writer_at_court_modifier_desc: "Nhân vật này đang thuê một nghệ sĩ ngôn từ để soạn thảo các bài diễn văn công khai."
  poet_for_diplo_schemes_modifier: "Thi Sĩ Lưỡi Bạc"
  poet_for_diplo_schemes_modifier_desc: "Nhân vật này đang thuê một thi sĩ tài năng để hỗ trợ các âm mưu của mình.\nTăng [success_chance|E] của các [schemes|E] ngoại giao #P +15#!."
  poet_for_seduction_schemes_modifier: "Lời Lẽ Quyến Rũ"
  poet_for_seduction_schemes_modifier_desc: "Nhân vật này đang thuê một thi sĩ tài năng để hỗ trợ các âm mưu của mình.\nTăng [success_chance|E] của [GetScheme('seduce').GetTypeName] [scheme|E] #P +20#!."
  court_confident_rider_modifier: "Kỵ Sĩ Tự Tin"
  court_confident_rider_modifier_desc: "Nhân vật này được một người cha hoặc mẹ yêu quý dạy cưỡi ngựa từ khi còn nhỏ, và đã tiếp nhận điều đó với sự nhiệt tình."
  pressured_to_learn_court_language_modifier: "Học Ngôn Ngữ Triều Đình"
  pressured_to_learn_court_language_modifier_desc: "Nhân vật này bị ép phải học Ngôn Ngữ Triều Đình và đang rất cố gắng."
  linguist_help_for_court_language_modifier: "Hỗ Trợ Từ Nhà Ngôn Ngữ Học"
  linguist_help_for_court_language_modifier_desc: "Nhân vật này đang học Ngôn Ngữ Triều Đình của gia đình với sự giúp đỡ của một nhà ngôn ngữ học đủ năng lực."
  architect_building_program_county_modifier: "Kiến trúc sư $building_program_county_modifier$"
  architect_building_program_county_modifier_desc: "Chương trình xây dựng của hạt này đang nằm trong tay một kiến trúc sư có năng lực."
  building_program_county_modifier: "Chương Trình Xây Dựng Tham Vọng"
  building_program_county_modifier_desc: "Người cai trị hạt này đang thúc đẩy một chương trình xây dựng đầy tham vọng."
  estate_building_program_modifier: "$building_program_county_modifier$"
  estate_building_program_modifier_desc: "Nhân vật này đang thúc đẩy một chương trình xây dựng đầy tham vọng tại điền trang của gia tộc."
