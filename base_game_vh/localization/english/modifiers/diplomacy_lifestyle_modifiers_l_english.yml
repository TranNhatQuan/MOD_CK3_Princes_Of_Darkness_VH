l_english:
  statecraft_well_mannered_modifier:0 "Lễ Độ Chu Toàn"
  statecraft_well_mannered_modifier_desc:0 "Hầu hết sai lầm và khuyết điểm về tính cách đều có thể được tha thứ nếu người gây ra có phép lịch sự tốt."
  diplomacy_foreign_3001_trade_deal_modifier:0 "Thỏa Thuận Thương Mại"
  statecraft_emphasises_unity_modifier:0 "Nhấn Mạnh Sự Đoàn Kết"
  statecraft_emphasises_unity_modifier_desc:1 "Nhân vật này đang thúc đẩy sự đoàn kết của lãnh thổ, khẳng định phải đứng chung một hàng, vững mạnh trước kẻ thù bên ngoài, thay vì tự đối đầu lẫn nhau."
  statecraft_just_judgements_modifier:0 "Phán Quyết Công Bằng"
  statecraft_encouraged_feasting_modifier:0 "Khuyến Khích Yến Tiệc"
  diplomacy_majesty_4030_basic_strategy_modifier:0 "Chiến Thuật Đối Thoại Cơ Bản"
  diplomacy_majesty_4030_basic_strategy_modifier_desc:0 "Nhân vật này đang luyện tập việc sử dụng các chiến thuật đối thoại để thuyết phục người khác rằng mình đúng."
  diplomacy_majesty_4030_advanced_strategy_modifier:0 "Chiến Thuật Đối Thoại Nâng Cao"
  diplomacy_majesty_4030_advanced_strategy_modifier_desc:0 "Nhân vật này đã làm chủ việc sử dụng các chiến thuật đối thoại để thuyết phục người khác rằng mình đúng."
  diplomacy_majesty_4090_resplendent_raiment_modifier:0 "Y Phục Lộng Lẫy"
  diplomacy_majesty_4090_resplendent_raiment_modifier_desc:0 "Nhân vật này đang mặc áo choàng da chồn ermine và nhung theo mốt mới nhất."
  diplomacy_majesty_4090_traditional_raiment_modifier:0 "Y Phục Truyền Thống"
  diplomacy_majesty_4090_traditional_raiment_modifier_desc:0 "Nhân vật này đang mặc một bộ trang phục ấn tượng, lấy cảm hứng từ phong tục địa phương."
  diplomacy_majesty_4090_no_raiment_modifier:0 "Không Y Phục"
  diplomacy_majesty_4090_no_raiment_modifier_desc:0 "Nhân vật này không mặc gì ngoài một nụ cười."
  diplomacy_foreign_1017_internal_affairs_modifier:0 "Xoa Dịu Chư Hầu"
  diplomacy_foreign_1017_internal_affairs_modifier_desc:0 "Nhân vật này đang tập trung vào việc xoa dịu các chư hầu của mình."
