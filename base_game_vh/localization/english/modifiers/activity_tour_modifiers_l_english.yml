l_english:
  liege_respected_fighter_modifier:0 "Thủ Lĩnh Nông Dân Bị Làm Nhục"
  liege_respected_fighter_modifier_desc:0 "Một thủ lĩnh nông dân địa phương tại hạt này gần đây đã bị làm nhục trong một trận ẩu đả tay đôi với chúa thượng của họ."
  reduced_taxes_modifier:0 "Giảm Thuế"
  reduced_taxes_modifier_desc:0 "Hạt này đã thành công trong việc thương lượng "
  scared_of_liege_modifier:0 "Tra Tấn Gần Đây"
  scared_of_liege_modifier_desc:0 "Một nông dân địa phương đã không xưng hô với chúa thượng đúng lễ nghi và bị tra tấn dã man làm hình phạt, gây phẫn nộ và gieo rắc nỗi sợ hãi trong dân chúng."
  terrified_of_liege_modifier:0 "Tra Tấn Tàn Bạo"
  terrified_of_liege_modifier_desc:0 "Một nông dân địa phương đã không xưng hô với chúa thượng đúng lễ nghi và nội tạng của họ đã bị vung vãi khắp vùng quê."
  sacred_touch:0 "Thánh Chạm"
  sacred_touch_desc:0 "Hạt này gần đây đã được ban phước bởi sự chạm tay của một hoàng tộc quan trọng."
  alms_distributed:0 "Phát Chẩn"
  alms_distributed_desc:0 "Người nghèo tại hạt này gần đây đã nhận được sự bố thí rộng lượng."
  chastised_tyrant_modifier:0 "Bạo Chúa Bị Khiển Trách"
  chastised_tyrant_modifier_desc:0 "Người cai trị của lãnh thổ gần đây đã bị khiển trách vì đã áp đặt sự chuyên chế lên hạt này."
  locals_terrorised_modifier:0 "Dân Địa Phương Bị Khủng Bố"
  locals_terrorised_modifier_desc:0 "Những kẻ phạm tội vặt gần đây đã bị khủng bố một cách không cần thiết tại hạt này."
  sacred_site_vandalised_modifier:0 "Thánh Địa Bị Phá Hoại"
  sacred_site_vandalised_modifier_desc:0 "Một nơi linh thiêng bậc nhất đối với người dân hạt này gần đây đã bị một lãnh chúa địa phương phá hoại."
  kings_carving_modifier:0 "Dấu Ấn Cao Quý"
  kings_carving_modifier_desc:0 "Một quý tộc cấp cao đã để lại dấu ấn của mình tại vùng đất này, khiến người dân địa phương cảm thấy được ghi nhận."
  tutored_by_landless_modifier:0 "Quý Tộc Chỉ Dạy"
  tutored_by_landless_modifier_desc:0 "Nhân vật này gần đây đã được chỉ dạy về một chủ đề khó."
  healed_by_wise_woman_modifier:0 "Chữa Lành Huyền Bí"
  healed_by_wise_woman_modifier_desc:0 "Nhân vật này gần đây đã được một thầy chữa tâm linh bí ẩn chăm sóc."
  tended_by_wise_woman_modifier:0 "Chăm Sóc Huyền Bí"
  tended_by_wise_woman_modifier_desc:0 "Vết thương của nhân vật này gần đây đã được một thầy chữa tâm linh bí ẩn chăm sóc."
  balanced_by_wise_woman_modifier:0 "Cân Bằng Thể Dịch"
  balanced_by_wise_woman_modifier_desc:0 "Thông qua những nghi thức huyền bí kỳ lạ, thể dịch của nhân vật này gần đây đã được cân bằng."
  makeover_from_wise_woman_modifier:0 "Mỹ Phẩm Thảo Dược"
  makeover_from_wise_woman_modifier_desc:0 "Nhân vật này gần đây đã được chăm sóc ngoại hình bằng liệu pháp thẩm mỹ từ một thầy chữa tâm linh."
  hurt_by_wise_woman_modifier:0 "Liệu Pháp Bất Tịnh"
  hurt_by_wise_woman_modifier_desc:0 "Nhân vật này gần đây đã tìm đến một thầy chữa tâm linh và rời đi trong tình trạng tệ hơn lúc ban đầu."
  bad_makeover_from_wise_woman_modifier:0 "Mỹ Phẩm Kinh Dị"
  bad_makeover_from_wise_woman_modifier_desc:0 "$makeover_from_wise_woman_modifier_desc$"
  full_of_dessert_modifier:0 "No Nê Tráng Miệng"
  full_of_dessert_modifier_desc:0 "Nhân vật này gần đây đã thưởng thức một bữa tiệc tráng miệng thịnh soạn, khiến họ no nê và thỏa mãn."
  stomach_ache_modifier:0 "Đau Dạ Dày"
  stomach_ache_modifier_desc:0 "Nhân vật này gần đây đã ăn quá nhiều và bị đau dạ dày."
  ate_human_heart:0 "Dạ Dày Gan Dạ"
  ate_human_heart_desc:0 "Nhân vật này gần đây đã ăn thứ gì đó mà họ tin rằng đã ban cho mình sức mạnh của một chiến binh hùng mạnh."
  ate_human_heart_bad:0 "Dạ Dày Bất Ổn"
  ate_human_heart_bad_desc:0 "Nhân vật này gần đây đã ăn thứ gì đó mà họ tin rằng đã ban cho mình sức mạnh của một chiến binh hùng mạnh, nhưng cơ thể họ đã phản ứng tiêu cực."
  succesful_food_experiment_modifier:0 "Thử Nghiệm Ẩm Thực Thành Công"
  succesful_food_experiment_modifier_desc:0 "Nhân vật này đã thử nghiệm với ẩm thực và trải nghiệm những cảm giác mà người ta chỉ có thể mơ tới."
  well_rested_modifier:0 "Nghỉ Ngơi Đầy Đủ"
  well_rested_modifier_desc:0 "Nhân vật này đã có được sự nghỉ ngơi xứng đáng."
  tour_sleep_deprived_modifier:0 "Thiếu Ngủ"
  tour_sleep_deprived_modifier_desc:0 "Nhân vật này đã thức trắng đêm để ám ảnh lục soát nơi ở của mình nhằm săn lùng các bí mật."
  highwaymen_eliminated_modifier:0 "Bọn Cướp Bị Tiêu Diệt"
  highwaymen_eliminated_modifier_desc:0 "Một tuyến đường đi lại phổ biến trong hạt này gần đây đã được quét sạch bọn cướp, mang lại sự an toàn cho lữ khách và thương nhân."

  courtier_cook_modifier:0 "Đầu Bếp Triều Đình"
  courtier_cook_modifier_desc:0 "Nhân vật này đã chiêu mộ được một đầu bếp tài năng."

  drunken_stupor:0 "Say Mèm"
  drunken_stupor_desc:0 "Nhân vật này gần đây đã uống đến mức mê man. Những hành vi đáng xấu hổ mà họ có thể đã làm có lẽ sẽ không bao giờ được nhắc lại."
  boozeless_modifier:0 "Cạn Rượu"
  boozeless_modifier_desc:0 "Kho rượu của nhân vật này đã cạn sạch hoàn toàn, khiến họ trở thành một chủ nhà tồi."

  tour_liege_extra_taxation_county_modifier:0 "Thuế Của Chúa Thượng"
  tour_liege_extra_taxation_county_modifier_desc:0 "Chủ sở hữu của hạt này đang bù đắp khoản thuế tăng thêm của chúa thượng bằng cách đánh thuế dân chúng."
  tours_grounds_luxury_dining_modifier:0 "Ẩm Thực Xa Hoa"
  tours_grounds_luxury_dining_modifier_desc:0 "Nhân vật này đã trưng thu một lượng lớn hàng hóa xa xỉ từ một chư hầu và đang tận hưởng chúng."
  tours_grounds_hunting_companions_modifier:0 "Ngài Đồng Hành Săn Bắn"
  tours_grounds_hunting_companions_modifier_desc:0 "Nhân vật này đã trưng thu một số thú săn xuất sắc từ một chư hầu."
  tours_grounds_excellent_horses_modifier:0 "Ngựa Bị Trưng Thu"
  tours_grounds_excellent_horses_modifier_desc:0 "Nhân vật này đã trưng thu một số con ngựa xuất sắc từ một chư hầu."
  tours_grounds_sharing_tips_with_friend_modifier:0 "Chia Sẻ Kinh Nghiệm Với Ngài"
  tours_grounds_sharing_tips_with_friend_modifier_desc:0 "Nhân vật này thường xuyên chia sẻ kinh nghiệm với một người Ngài về những mối quan tâm chung."
  tour_grounds_hidden_assets_modifier:0 "Tài Sản Che Giấu"
  tour_grounds_hidden_assets_modifier_desc:0 "Nhân vật này đã xoay xở để che giấu một số tài sản có giá trị khỏi sự đánh thuế của chúa thượng."

  embarassing_performance_modifier:0 "Màn Trình Diễn Đáng Xấu Hổ"
  embarassing_performance_modifier_desc:0 "Nhân vật này đã xúc phạm chúa thượng của mình thông qua một màn trình diễn đáng xấu hổ"
  skirmisher_learnings:0 "Đổi Mới Bộ Binh Nhẹ"
  skirmisher_learnings_desc:0 "Nhân vật này gần đây đã quan sát cách một lãnh thổ ngoại bang quản lý bộ binh nhẹ."
  heavy_infantry_learnings:0 "Đổi Mới Bộ Binh Nặng"
  heavy_infantry_learnings_desc:0 "Nhân vật này gần đây đã quan sát cách một lãnh thổ ngoại bang quản lý bộ binh nặng."
  archers_learnings:0 "Đổi Mới Cung Thủ"
  archers_learnings_desc:0 "Nhân vật này gần đây đã quan sát cách một lãnh thổ ngoại bang quản lý cung thủ."
  cavalry_learnings:0 "Đổi Mới Kỵ Binh"
  cavalry_learnings_desc:0 "Nhân vật này gần đây đã quan sát cách một lãnh thổ ngoại bang quản lý kỵ binh."
  general_maa_learning:0 "Quản Lý Hiệu Quả"
  general_maa_learning_desc:0 "Nhân vật này gần đây đã học được một cách hiệu quả hơn để bố trí quân thường trực."
  clearing_crime_modifier:0 "Quét Sạch Tội Phạm"
  clearing_crime_modifier_desc:0 "Gần đây, hành động quân sự đã được tiến hành tại hạt này để dẹp bỏ tội phạm. Dù hiệu quả trong việc thể hiện quyền lực, người dân địa phương lại đang bị tổn hại bởi các biện pháp bạo lực này."
  liege_bad_micromanagement:0 "Quản Lý Yếu Kém"
  liege_bad_micromanagement_desc:0 "Một quý tộc địa phương tin rằng họ có thể cải thiện quân thường trực của nhân vật này. Họ đã nhầm."
  totally_lost_modifier:0 "Hoàn Toàn Lạc Lối"
  liesurely_studies:0 "Nghiên Cứu Thư Thả"
  liesurely_stroll:0 "Dạo Bước Thư Thả"
  guarded_garden:0 "Khu Vườn Canh Gác"
  military_studies:0 "Nghiên Cứu Quân Sự"
  festival_disruption:0 "Gián Đoạn Lễ Hội"
  liege_judged_festival:0 "Quý Tộc Đánh Giá Lễ Hội"
  pious_liege:0 "Chúa Thượng Mộ Đạo"
  tolerant_liege:0 "Chúa Thượng Khoan Dung"
  recent_cultural_festival:0 "Lễ Hội Văn Hóa Gần Đây"
  ep2_popular_liege:0 "Chúa Thượng Được Yêu Mến"
