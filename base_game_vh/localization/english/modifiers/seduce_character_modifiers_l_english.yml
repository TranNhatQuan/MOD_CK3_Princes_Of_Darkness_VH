l_english:
  seduce_tapestry_gift_modifier:0 "Thảm Treo Tường Gia Tộc"
  seduce_tapestry_gift_modifier_desc:0 "Một tấm thảm ghi lại những chiến thắng vĩ đại và các khoảnh khắc đáng nhớ của gia tộc."
  seduce_horse_gift_modifier:0 "Ngựa Thuần Chủng"
  seduce_horse_gift_modifier_desc:0 "Một con ngựa có vóc dáng tuyệt hảo."
  seduce_tailor_gift_modifier:0 "Trang Phục May Đo Hoàn Hảo"
  seduce_tailor_gift_modifier_desc:0 "Được cắt may để đảm bảo người mặc toát lên khí chất uy nghi."
  seduce_rare_book_gift_modifier:0 "Sách Quý Hiếm"
  seduce_rare_book_gift_modifier_desc:0 "Những trang còn đọc được hé lộ một kho tàng trí tuệ to lớn."
  seduce_embroidery_gift_modifier:0 "Thêu Thùa Gia Tộc"
  seduce_embroidery_gift_modifier_desc:0 "Hình thêu tinh xảo mang huy hiệu gia tộc."
  seduce_poem_gift_modifier:0 "Bài Thơ Dâng Tặng"
  seduce_poem_gift_modifier_desc:0 "Một bài thơ về mọi niềm vui của cuộc sống, được đề tặng đích danh."
  seduce_woodcarving_gift_modifier:0 "Tác Phẩm Chạm Gỗ Lâu Đài"
  seduce_woodcarving_gift_modifier_desc:0 "Tinh vi và chi tiết đến mức người ta có thể tưởng tượng những binh lính tí hon tuần tra trên tường thành và các gia nhân vội vã băng qua những sân gỗ sồi."
  seduce_object_gift_modifier:0 "Kỷ Vật"
  seduce_object_gift_modifier_desc:0 "Một vật mang ý nghĩa cá nhân sâu sắc. Nó có thể tượng trưng cho một mối quan hệ đã qua, hoặc một ngọn lửa vẫn còn cháy sáng."
  seduce_jewelry_gift_modifier:0 "Mặt Dây Chuyền Bạc"
  seduce_jewelry_gift_modifier_desc:0 "Một món trang sức tinh tế, nhưng chắc chắn sẽ thu hút mọi ánh nhìn lang thang."
  seduce_stuffed_animal_gift_modifier:0 "Cáo Nhồi Bông"
  seduce_stuffed_animal_gift_modifier_desc:0 "Một con vật được \"tái sinh\" một cách điêu luyện, thích hợp để trưng bày trên bất kỳ bệ lò sưởi nào."
  seduce_flower_display_gift_modifier:0 "Trưng Bày Hoa"
  seduce_flower_display_gift_modifier_desc:0 "Một vật trang trí sân vườn chắc chắn sẽ gây ấn tượng với khách khứa, miễn là được chăm sóc cẩn thận."
  seduce_handkerchief_gift_modifier:0 "Khăn Tay Cao Cấp"
  seduce_handkerchief_gift_modifier_desc:0 "Một mảnh vải nhỏ mang huy hiệu của một gia tộc quý tộc khác."
  seduce_warfare_military_ideas_modifier:0 "Ý Tưởng Quyến Rũ"
  seduce_warfare_military_ideas_modifier_desc:0 "Những ý tưởng về cải cách quân sự này vô cùng thú vị, và lại đến từ một nguồn không ngờ tới..."
  seduce_intrigue_knowing_knowledge_modifier:0 "Ta Biết Rằng Họ Biết"
  seduce_intrigue_knowing_knowledge_modifier_desc:1 "À, mạng lưới mưu mô phức tạp, nơi gián điệp theo dõi lẫn nhau, biết rằng tất cả đều để lại dấu vết giả — chẳng khác nào một điệu nhảy quyến rũ..."
  seduce_diplomatic_practice_modifier:0 "Thực Hành Ngoại Giao"
  seduce_diplomatic_practice_modifier_desc:1 "Khi đối diện trực tiếp, nhân vật này đang luyện tập việc nói ra điều họ muốn mà không bao giờ nói đúng điều họ nghĩ."
  seduce_rested_modifier:0 "Được Nghỉ Ngơi Đầy Đủ"
  seduce_rested_modifier_desc:0 "Những giờ nghỉ ngơi dài và chất lượng đã mang lại tác dụng!"
  seduce_obviously_courted_modifier:0 "Minh Xác Được Theo Đuổi"
  seduce_obviously_courted_modifier_desc:0 "Toàn thể triều đình đều biết rằng một ai đó đang dấn bước trên con đường tình ái."
  seduce_figting_modifier:0 "Xuất Sắc Trong Giao Chiến"
  seduce_figting_modifier_desc:1 "Khớp tay trầy xước và môi rách; không điều gì có thể làm chậm bước nhân vật này!"

  seduce_bold_start_modifier:0 "Được Tiếp Thêm Can Đảm Bởi Lần Quyến Rũ"
  seduce_bold_start_modifier_desc:0 "Cảm thấy dũng cảm sau khi có những bước tiến táo bạo trong một buổi gặp gỡ lãng mạn."
  seduce_gentle_start_modifier:0 "Trở Nên Dịu Lại Sau Lần Quyến Rũ"
  seduce_gentle_start_modifier_desc:0 "Hoàn toàn thư thái sau một cách tiếp cận nhẹ nhàng."
