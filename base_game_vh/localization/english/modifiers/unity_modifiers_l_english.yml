l_english:
  unity_antagonistic_maa_modifier: "Sĩ Quan Quân Đội Trung Thành"
  unity_antagonistic_maa_modifier_desc: "Các thành viên của gia tộc này đã gom góp nguồn lực để tăng cường binh lực trong quân đội của họ."

  unity_competitive_spies_modifier: "Mạng Lưới Mật Vụ"
  unity_competitive_spies_modifier_desc: "Các thành viên của gia tộc này chia sẻ những mưu đồ với nhau, thiết lập một mạng lưới gián điệp độc quyền cho gia tộc."
 
  unity_impassive_tax_modifier: "Cải Thiện Hành Chính"
  unity_impassive_tax_modifier_desc: "Các thành viên của gia tộc này đang hưởng lợi từ hiệu quả hành chính được nâng cao."

  unity_friendly_bailiff_modifier: "Tăng Cường Quan Tòa"
  unity_friendly_bailiff_modifier_desc: "Các thành viên của gia tộc này hợp tác với lãnh chúa của mình để giảm tham nhũng trên khắp lãnh thổ."
 
  unity_harmonious_placation_modifier: "Xoa Dịu"
  unity_harmonious_placation_modifier_desc: "Các thành viên của gia tộc này đã tái khẳng định quyền cai trị của lãnh chúa trong sự hòa hợp."
 
  unity_house_organized_for_war_modifier: "Tổ Chức Cho Chiến Tranh"
  unity_house_organized_for_war_modifier_desc: "Các thành viên của gia tộc này đều đã cam kết tiến hành chiến tranh.\n[rulers|E] sẽ áp dụng [warlike_i|E][ai_warlike_personality|L] [economical_archetype|E]"
 
  unity_house_focused_on_economy_modifier: "Khuyến Khích Kinh Tế"
  unity_house_focused_on_economy_modifier_desc: "Các thành viên của gia tộc này đang tích cực cải thiện nền kinh tế với sự nhiệt tình lớn.\n[rulers|E] sẽ áp dụng [builder_i][ai_economical_boom_personality|L] [economical_archetype|E]"

  unity_house_focused_on_diplomacy_modifier: "Nỗ Lực Ngoại Giao"
  unity_house_focused_on_diplomacy_modifier_desc: "Các thành viên của gia tộc này đang cùng nhau hợp tác để gây ảnh hưởng một cách hiệu quả."
 
  fp3_unity_promoted_development_modifier: "Thúc Đẩy Phát Triển"
  fp3_unity_promoted_development_modifier_desc: "Các thành viên của gia tộc này đang hợp tác để phát triển lãnh địa của họ."
 
  fp3_unity_improved_logistics_modifier: "Hậu Cần Quân Đội Chung"
  fp3_unity_improved_logistics_modifier_desc: "Các thành viên của gia tộc này chia sẻ hậu cần và tiếp tế quân đội."
