l_english:
  stress_frozen_grief:0 "Nỗi Đau Đông Cứng"
  stress_frozen_grief_desc:0 "Chưa bao giờ thực sự đối diện và xử lý cái chết của người thân yêu, nhân vật này cảm thấy khó kết nối với người khác hơn."
  stress_stuffed_corpse:0 "Xác Ướp Nhồi"
  stress_stuffed_corpse_desc:0 "Nhân vật này giữ bên mình xác ướp nhồi của người thân yêu và trò chuyện với họ — một tập tục vừa gây bất an vừa mang tính báng bổ."
  stress_managed_grief:0 "Nỗi Đau Được Kiểm Soát"
  stress_managed_grief_desc:0 "Nhân vật này đang từng ngày vượt qua mất mát của người thân yêu."

 #Coping Mechanism Penalties
  stress_disturbing_confession:0 "Lời Thú Nhận Gây Rúng Động"
  stress_disturbing_confession_desc:0 "Nhân vật này đã công khai thú nhận những điều khiến người khác bất an..."
  stress_drinking_binge:0 "Say Sưa Triền Miên"
  stress_drinking_binge_desc:0 "Nhân vật này đang tìm đến rượu chè nhiều hơn thường lệ."
  stress_hashish_habit:0 "Thói Quen Hút Hashish"
  stress_hashish_habit_desc:0 "Dạo này hiếm khi thấy nhân vật này tỉnh táo."
  stress_hashish_stupor:0 "Cơn Mê Hashish"
  stress_hashish_stupor_desc:1 "Nhân vật này đã tự làm mình mê man bằng chất kích thích."
  stress_inappetetic_hunger_1:0 "Đói Lả"
  stress_inappetetic_hunger_1_desc:0 "Nhân vật này không ăn đủ để duy trì sức khỏe."
  stress_inappetetic_hunger_2:0 "Chết Đói"
  stress_inappetetic_hunger_2_desc:0 "Nhân vật này đang chịu đựng tình trạng thiếu ăn nghiêm trọng."
  stress_inappetetic_hunger_3:0 "Suy Kiệt"
  stress_inappetetic_hunger_3_desc:0 "Nhân vật này đã không ăn gì suốt nhiều tuần, và điều đó thể hiện rõ ràng."

  angry_at_everyone_modifier:0 "Cơn Thịnh Nộ Không Kiềm Chế"
  angry_at_everyone_modifier_desc:0 "Nhân vật này ngập tràn cơn giận dữ, và không ai được tha."
 
  stress_smelling_of_sweat:0 "Mùi Mồ Hôi Nồng Nặc"
  stress_smelling_of_sweat_desc:0 "Mùi mồ hôi bám theo nhân vật này khắp nơi."

  stress_busy_writing:0 "Bận Rộn Viết Lách"
  stress_busy_writing_desc:0 "Nhân vật này dành phần lớn thời gian để viết."

  irritating_everyone_modifier:1 "Trút Giận"
  irritating_everyone_modifier_desc:1 "Nhân vật này không hề cố gắng kiềm chế sự bực bội và cơn giận của mình."

  irritating_everyone_courtier_modifier:1 "$irritating_everyone_modifier$"
