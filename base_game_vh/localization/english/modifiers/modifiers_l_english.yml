  prestige_level_2_laamp_desc: "Mở khóa các nội dung sau:\n\t#weak $EP3_LAAMP_INVASION_CB_COUNTY_NAME$ [casus_belli|e]\n\t$purchase_land_interaction$ [interaction|E] cho [counties|E]\n\t$hire_laamp_mercenaries_interaction$ phần thưởng [county|E]\n\t$procure_estate_interaction$ [interaction|E] #!"
