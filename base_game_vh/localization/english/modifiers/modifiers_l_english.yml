  fertile_desert_mountains_modifier_desc:0 "Từ thời cổ đại, miền nam Ả Rập đã được biết đến là xứ Ả Rập phì nhiêu, hay hạnh phúc. Vùng này có dân cư đông đúc hơn và đất đai màu mỡ hơn so với các khu vực xung quanh bán đảo.\nCó thể xây dựng [GetBuilding('cereal_fields_01').GetName]"
  dodekapolis_modifier: "Dodekapolis"
  dodekapolis_modifier_desc: "Kể từ thời Homer, khi những người định cư Aeolia và Ionia đặt chân lên bờ biển phía tây Anatolia, mười hai thành bang ven biển Anatolia — #EMP dodekapolis#! — đã đứng vững như những ngọn hải đăng rực rỡ của văn minh và sự phát triển nhân loại.\nCó thể xây dựng [GetBuilding('cereal_fields_01').GetName]"
  backwater_county_modifier: "Vùng Hẻo lánh"
  backwater_county_modifier_desc: "Càng lớn thì càng dễ sụp đổ. Hạt này, từng là lãnh thổ của những kẻ cai trị Hellas không khoan nhượng, nay đã rơi vào cảnh suy tàn đáng buồn. Dù hiện tại chỉ còn là cái bóng của quá khứ huy hoàng, hạt này hoàn toàn có thể trỗi dậy trở lại.\n\n#X @warning_icon! Modifier này có thể bị loại bỏ bằng [GetDecisionWithKey('restore_backwater_counties_decision').GetName] [decision|E] khi [development|E] của [county|E] này đạt #V 50#! hoặc cao hơn!#!\n\n"

  dance_plague_modifier:0 "Dịch Vũ điệu Bị Xem nhẹ"
  dance_plague_modifier_desc:0 "Những người nông dân trong khu vực này mắc chứng ngộ độc nấm lúa mạch đã bị giới cầm quyền phớt lờ lời kêu cứu."

  disease_spreading_modifier:0 "Tàn phá bởi Dịch bệnh"
  disease_spreading_modifier_desc:0 "Dịch bệnh đang lan rộng khắp vùng đất này"

