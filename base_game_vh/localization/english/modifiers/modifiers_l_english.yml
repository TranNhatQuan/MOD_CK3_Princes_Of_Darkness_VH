  piety_level_7: "Bán thần"
  piety_level_7_desc: "$piety_level_7$ là cấp [piety_level|E] thứ bảy. Cấp tiếp theo là [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L].\n\nKhi một [mandala|E] [ruler|E] chết theo cách được [aspect|E] của họ chấp nhận, sau khi đạt [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L], [heir|E] của vị cai trị đó có thể tiến lên cấp độ Sùng kính này.\n\nHiệu ứng:\n[GetPietyLevelDesc('(int32)7')|=+]"
  piety_level_8: "Thần linh"
  piety_level_8_desc: "$piety_level_8$ là cấp [piety_level|E] thứ tám và cao nhất đối với chính quyền [mandala|E].\n\nKhi một [mandala|E] [ruler|E] chết theo cách được [aspect|E] của họ chấp nhận, sau khi đạt [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L], [heir|E] của vị cai trị đó có thể tiến lên cấp độ Sùng kính tối thượng này.\n\nHiệu ứng:\n[GetPietyLevelDesc('(int32)8')|=+]"

  prestige_level_0: "Ô nhục"
