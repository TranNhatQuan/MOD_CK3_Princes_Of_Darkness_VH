l_english:
  cat_story_modifier:0 "Mèo Cưng"
  cat_story_modifier_desc:0 "Nhân vật này thích bầu Ngài cùng một người Ngài mèo"
  dog_story_modifier:0 "Chó Cưng"
  dog_story_modifier_desc:0 "Một chú chó trung thành theo nhân vật này đến bất cứ nơi đâu"
  dog_story_walking_modifier:0 "Dắt Chó Đi Dạo"
  dog_story_walking_modifier_desc:0 "Nhân vật này thích những buổi đi dạo thường xuyên cùng chú chó của mình"
  dog_story_fur_carpet_modifier:0 "Thảm Lông"
  dog_story_fur_carpet_modifier_desc:0 "Nhân vật này sở hữu một tấm thảm lông tuyệt đẹp"
  cat_story_allergy_modifier:0 "Nhạy Cảm Với Mèo"
  cat_story_allergy_modifier_desc:0 "Nhân vật này đang gặp những triệu chứng khó chịu do sự hiện diện của một con mèo"
  cat_killing_rodents_modifier:0 "Không Còn Chuột"
  cat_killing_rodents_modifier_desc:0 "Nơi ở của nhân vật này gần như hoàn toàn không còn chuột"
  cat_story_fur_mittens_modifier:0 "Găng Tay Lông"
  cat_story_fur_mittens_modifier_desc:0 "Nhân vật này có một đôi găng tay lông để giữ ấm đôi tay khi trời lạnh"
  rat_hunting_dog_modifier:0 "Chó Bắt Chuột"
  rat_hunting_dog_modifier_desc:0 "Chú chó của nhân vật này là một thợ săn loài gặm nhấm rất hiệu quả."
  rat_hunting_cat_modifier:0 "Mèo Bắt Chuột"
  rat_hunting_cat_modifier_desc:0 "Con mèo của nhân vật này là một thợ săn loài gặm nhấm rất hiệu quả."
  cat_dopey_modifier: "Mèo Ngốc Nghếch"
  cat_dopey_modifier_desc: "Con mèo của nhân vật này, nói sao nhỉ, hơi vụng về một chút."
  cat_wrangler_modifier: "Bậc Thầy Điều Khiển Mèo"
  cat_wrangler_modifier_desc: "Nhân vật này đã chứng minh mình là một chuyên gia trong nghệ thuật khó nhằn của việc xử lý mèo."
  cat_coitus_interrupted_modifier: "Kẻ Phá Bĩnh Mèo"
  cat_coitus_interrupted_modifier_desc: "Nhân vật này đã có những cuộc gặp gỡ ái ân bị gián đoạn bởi sự hiện diện của một con mèo quá mức thân thiện."
  cat_rejection_modifier: "Bị Mèo Từ Chối"
  cat_rejection_modifier_desc: "Nhân vật này phát hiện ra, trong sự bực bội của mình, rằng con mèo của họ lại thích bầu Ngài với người khác hơn."
  cat_ill_modifier: "Y Tá Mèo"
  cat_ill_modifier_desc: "Nhân vật này được bầu Ngài trong thời gian dưỡng bệnh bởi con mèo thân thiện của mình."
  cat_lover_modifier: "Người Yêu Mèo"
  cat_lover_modifier_desc: "Nhân vật này hết mực tận tụy với người Ngài lông xù của mình, đến mức khiến hội đồng của họ có chút khó chịu."
  eagle_story_modifier: "Đại Bàng Săn Bắn"
  eagle_story_modifier_desc: "Nhân vật này có một con đại bàng uy nghi làm Ngài đồng hành trong việc săn bắn và rong ruổi trên thảo nguyên.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
  brave_eagle_story_modifier: "Đại Bàng Dũng Mãnh"
  brave_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này đặc biệt dũng cảm và không hề né tránh bất kỳ mối nguy hiểm bị nghi ngờ nào\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!."
  curious_eagle_story_modifier: "Đại Bàng Hiếu Kỳ"
  curious_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này hiếu kỳ như một đứa trẻ, và thường điều tra những thứ thu hút ánh nhìn của nó.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
  loyal_eagle_story_modifier: "Đại Bàng Trung Thành"
  loyal_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này vô cùng trung thành và sẽ không bao giờ rời xa chủ nhân của mình.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
  calm_eagle_story_modifier: "Đại Bàng Điềm Tĩnh"
  calm_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này điềm tĩnh và chín chắn, không bao giờ quá kích động hay hoảng sợ.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
  wise_eagle_story_modifier: "Đại Bàng Thông Thái"
  wise_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này thông thái vượt xa tuổi đời, và thường đưa ra những quyết định khiến chủ nhân phải ngạc nhiên.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
  cunning_eagle_story_modifier: "Đại Bàng Xảo Quyệt"
  cunning_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này xảo quyệt và thường vượt mặt con mồi của nó\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!."
  weak_eagle_modifier: "Đại Bàng Yếu Ớt"
  weak_eagle_modifier_desc: "Con đại bàng săn bắn của nhân vật này yếu ớt và thường chật vật trong việc bắt mồi."
  very_weak_eagle_modifier: "Đại Bàng Hấp Hối"
  very_weak_eagle_modifier_desc: "Con đại bàng săn bắn của nhân vật này đang đau yếu và cận kề cái chết."
  strong_eagle_modifier: "Đại Bàng Cường Tráng"
  strong_eagle_modifier_desc: "Con đại bàng săn bắn của nhân vật này có sức khỏe và thể lực vượt trội."
  skilled_eagle_modifier: "Người Nuôi Đại Bàng Lão Luyện"
  skilled_eagle_modifier_desc: "Nhân vật này là một người huấn luyện chim săn lành nghề, và con đại bàng của họ được huấn luyện đặc biệt tốt."
  eagle_personality_level_desc: "Không Được Huấn Luyện"
  observant_eagle_story_modifier: "Đại Bàng Tinh Mắt"
  observant_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này đặc biệt tinh ý, và thường phát hiện những điều mà chủ nhân có thể bỏ lỡ."
  protective_eagle_story_modifier: "Đại Bàng Bảo Vệ"
  protective_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này có tính bảo vệ chủ nhân, và thường can thiệp để ngăn họ bị tổn hại."
  aggressive_eagle_story_modifier: "Đại Bàng Hung Hãn"
  aggressive_eagle_story_modifier_desc: "Con đại bàng săn bắn của nhân vật này đặc biệt hiếu chiến, và thường tấn công những gì nó coi là mối đe dọa mà không cần cảnh báo."
  eagle_hunter_childhood_modifier: "Định Mệnh Là Người Nuôi Chim Săn"
  eagle_hunter_childhood_modifier_desc: "Nhân vật này đã được huấn luyện cùng đại bàng từ khi còn nhỏ, và có tiềm năng trở thành một người nuôi chim săn lành nghề.\n[hunt_success_chance|E]: #P +5%#!"
  hunt_success_chance.eagle_hunter_childhood_modifier: "[GetModifier('eagle_hunter_childhood_modifier').GetNameWithTooltip]"
