l_english:

  ach_how_to_lose_a_war_listener_modifier: "Chuyện Kể Những Cuộc Chiến Thất Bại: Người Nghe"
  ach_how_to_lose_a_war_listener_modifier_desc: "Nhân vật này đã lắng nghe một câu chuyện đầy khổ đau về một cuộc chiến đã mất, và rút ra được bài học về những điều không nên làm trong đời và trên chiến trường."
  ach_how_to_lose_a_war_talker_modifier: "Chuyện Kể Những Cuộc Chiến Thất Bại: Người Kể"
  ach_how_to_lose_a_war_talker_modifier_desc: "Nhân vật này đã nói đi nói lại câu chuyện đầy khổ đau của mình. Việc chia sẻ quá nhiều và lặp lại không ngừng tuy vậy cũng mang lại chút an ủi tinh thần."
  ach_peace_broker_modifier: "Sứ Giả Hòa Bình Lưỡi Bạc"
  ach_peace_broker_modifier_desc: "Vào đêm trước lễ đăng quang, nhân vật này đã ngăn chặn sự tái diễn của một cuộc chiến phục thù, tránh được một sai lầm đẫm máu lần thứ hai."
  ach_neutered_revanchist_modifier: "Kẻ Phục Thù Hiếu Chiến Bị Thuần Hóa"
  ach_neutered_revanchist_modifier_desc: "Nhân vật này đã có một cuộc trò chuyện mang tính thay đổi cuộc đời trong buổi lễ đăng quang, khiến họ phải suy ngẫm lại cách tiếp cận với cuộc sống và quá khứ của mình."
  ach_partners_in_revanchism_passive_modifier: "Đồng Minh Phục Thù: Chuẩn Bị"
  ach_partners_in_revanchism_passive_modifier_desc: "Nhân vật này đang chuẩn bị hợp tác chặt chẽ với một vị quân chủ khác để tiến hành một cuộc chiến báo thù.\n\n#weak Hiệu ứng này sẽ có thêm tác dụng khi chiến tranh được tuyên bố với mục tiêu dự định. Vị quân chủ cùng chia sẻ hiệu ứng này sẽ được triệu tập và tham chiến, nếu có thể. Hiệu ứng chiến tranh mới của Ngài sẽ tồn tại trong vòng một năm#!"
  ach_partners_in_revanchism_active_modifier: "Đồng Minh Phục Thù: Chiến Tranh"
  ach_partners_in_revanchism_active_modifier_desc: "Nhân vật này đang hợp tác chặt chẽ với một vị quân chủ khác trong cuộc chiến báo thù."
  ach_hof_visit_modifier: "Chuyến Viếng Thăm Của Giáo Chủ"
  ach_hof_visit_modifier_desc: "Vùng đất này trở nên náo nhiệt do chuyến viếng thăm của vị lãnh đạo tôn giáo cùng đoàn tùy tùng hùng hậu theo sau. Tín đồ đổ về tỉnh, còn người dân địa phương thì được ban phước lành và bố thí dồi dào."

  ach_beat_peasants_modifier: "Đánh Đập Nông Dân"
  ach_beat_peasants_modifier_desc: "Nhân vật này đã gây dựng danh tiếng vì đích thân trấn áp những kẻ thấp kém hơn khi họ vượt quá giới hạn."

  ach_positive_rumors_modifier: "Tin Đồn Tốt"
  ach_positive_rumors_modifier_desc: "Dân thường trong lãnh thổ dường như đang xôn xao với những câu chuyện chưa được kiểm chứng về vinh quang của nhân vật này."

  ach_negative_rumors_modifier: "Tin Đồn Xấu"
  ach_negative_rumors_modifier_desc: "Những lời đồn đại gần đây chẳng mang lại lợi lộc gì cho danh tiếng của nhân vật này."

  ach_arrested_rumormongers_modifier: "Vừa Bắt Giữ Kẻ Tung Tin Đồn"
  ach_arrested_rumormongers_modifier_desc: "Những kẻ gieo tin đồn tại địa phương gần đây đã im hơi lặng tiếng vì sợ bị lãnh chúa của họ đàn áp."

  ach_arrested_rumormongers_character_modifier: "$ach_arrested_rumormongers_modifier$"
  ach_arrested_rumormongers_character_modifier_desc: "Nhân vật này đã mang tiếng là sẵn sàng bắt giữ những nông dân buôn chuyện, một dấu ấn của nỗi sợ hãi và sự bất an nhất định."

  ach_imperious_modifier: "Kiêu Quyền"
  ach_imperious_modifier_desc: "Nhân vật này đã xây dựng danh tiếng là kẻ đứng trên những mối bận tâm tầm thường."

  ach_coronation_treated_wound_modifier: "Băng Bó Vết Thương"
  ach_coronation_treated_wound_modifier_desc: "Những vết thương của nhân vật này đã được chăm sóc một cách khéo léo."

  ach_coronation_crackdown_modifier: "Đàn Áp Lễ Đăng Quang"
  ach_coronation_crackdown_modifier_desc: "Đám đông binh lính đã tràn xuống dân chúng trong khu vực này để lập lại trật tự. Nhiều thứ đã bị phá hủy, nhưng trật tự đã được khôi phục."

  ach_coronation_crackdown_character_modifier: "$ach_coronation_crackdown_modifier$"
  ach_coronation_crackdown_character_modifier_desc: "Nhân vật này đã thể hiện sự sẵn sàng thả binh lính của mình đàn áp dân chúng để lập lại trật tự, khiến nhiều người kính trọng nhưng cũng làm không ít kẻ ghê tởm."

  ach_awed_peasantry_modifier: "Dân Chúng Kinh Phục"
  ach_awed_peasantry_modifier_desc: "Nhân vật này đã có một bài diễn thuyết xoa dịu đám đông hỗn loạn, với sự hùng biện khiến hàng trăm người rơi lệ."

  ach_coronation_blissful_ignorance_modifier: "Vô Minh An Lạc"
  ach_coronation_blissful_ignorance_modifier_desc: "Nhân vật này hiểu rằng có những vấn đề tiềm ẩn tốt nhất nên được vui vẻ phớt lờ."

  ach_coronation_trusts_nobody_modifier: "Không Tin Bất Kỳ Ai"
  ach_coronation_trusts_nobody_modifier_desc: "Nhân vật này giật mình trước mọi cái bóng và ngày càng tin rằng các chư hầu của mình đang âm mưu lật đổ họ."

  ach_coronation_stampede_modifier: "Giẫm Đạp Lễ Đăng Quang"
  ach_coronation_stampede_modifier_desc: "Một chuỗi sự kiện không may đã dẫn đến hàng chục người — chủ yếu là dân thường — bị giẫm đạp đến chết."

  ach_declarations_of_loyalty_modifier: "Tuyên Thệ Trung Thành"
  ach_declarations_of_loyalty_modifier_desc: "Nhân vật này dường như chẳng nói chuyện gì với các chư hầu khác ngoài sự chính danh của quân chủ mà họ phụng sự."

  ach_coronation_theocratic_allies_modifier: "Đồng Minh Thần Quyền"
  ach_coronation_theocratic_allies_modifier_desc: "Nhân vật này đã được hưởng lợi rất lớn từ những lời kêu gọi giới giáo sĩ của một chư hầu."

  ach_coronation_little_birds_modifier: "Những Chú Chim Nhỏ"
  ach_coronation_little_birds_modifier_desc: "Nhân vật này được hậu thuẫn bởi mạng lưới gián điệp của một chư hầu — một sự nhẹ nhõm lớn lao!"

  ach_coronation_expended_resources_modifier: "Tiêu Hao Nguồn Lực"
  ach_coronation_expended_resources_modifier_desc: "Nhân vật này gần đây đã tiêu tốn nhiều nguồn lực để hỗ trợ một vị quân chủ khác."
  ach_coronation_expended_resources_martial_modifier: "$ach_coronation_expended_resources_modifier$"
  ach_coronation_expended_resources_martial_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ Ngay cả quân đội của chính họ cũng đã kiệt quệ."
  ach_coronation_expended_resources_martial_nomad_modifier: "$ach_coronation_expended_resources_modifier$"
  ach_coronation_expended_resources_martial_nomad_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ Ngay cả quân đội của chính họ cũng đã kiệt quệ."

  ach_coronation_expended_resources_intrigue_modifier: "$ach_coronation_expended_resources_modifier$"
  ach_coronation_expended_resources_intrigue_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ Kết quả là mạng lưới gián điệp của chính họ đang bị quá tải nghiêm trọng."

  ach_focusing_on_prayer_modifier: "Chuyên Tâm Cầu Nguyện"
  ach_focusing_on_prayer_modifier_desc: "Nhân vật này đang dồn nén không ít sự bức bối bằng cách tập trung vào các vấn đề đức tin."

  ach_familial_support_modifier: "Hậu Thuẫn Gia Tộc"
  ach_familial_support_modifier_desc: "Triều đại này nổi tiếng vì luôn hành động như một chỉnh thể thống nhất."

  ach_reign_of_terror_modifier: "Triều Đại Khủng Bố"
  ach_reign_of_terror_modifier_desc: "Tỉnh này đang phải hứng chịu những đòn trả thù tàn nhẫn từ một chủ nhân bị xúc phạm."

  ach_reign_of_terror_character_modifier: "Triều Đại Khủng Bố"
  ach_reign_of_terror_character_modifier_desc: "Nhân vật này đã đáp lại những lời đồn trong dân chúng bằng một chuỗi biện pháp trả thù tàn bạo và tàn nhẫn."

  ach_useful_crowds_modifier: "Đám Đông Hữu Dụng"
  ach_useful_crowds_modifier_desc: "Các đặc vụ của nhân vật này di chuyển không bị phát hiện giữa đám đông địa phương."

  ach_coronation_good_listener_modifier: "Người Nghe Giỏi"
  ach_coronation_good_listener_modifier_desc: "Nhân vật này đã dành thời gian quan sát con người, và vì thế học được rất, rất nhiều điều..."
 
  ach_coronation_studying_ceremony_modifier: "Nghiên Cứu Lễ Đăng Quang"
  ach_coronation_studying_ceremony_modifier_desc: "Nhân vật này đang học hỏi nhiều điều khi chứng kiến những khó khăn trong việc tổ chức một buổi lễ đăng quang."
 
  ach_coronation_gossips_with_servants_modifier: "Tám Chuyện Với Gia Nhân"
  ach_coronation_gossips_with_servants_modifier_desc: "Nhân vật này đã bắt đầu trao đổi tin đồn với đám gia nhân."

  ach_social_distancing_modifier: "Giữ Khoảng Cách"
  ach_social_distancing_modifier_desc: "Nhân vật này giữ khoảng cách rộng rãi với tất cả mọi người. Dù khá hiệu quả trong việc duy trì sức khỏe, việc phải hét to qua các căn phòng để được nghe thấy vẫn chẳng mấy lý tưởng."

  ach_favored_minority_modifier: "Thiểu Số Được Ưu Ái"
  ach_favored_minority_modifier_desc: "Vị thống trị của tỉnh này đã chọn ưu ái dân chúng nơi đây dù khác biệt về văn hóa."
 
  ach_drunk_province_1_modifier: "Dân Chúng Say Xỉn"
  ach_drunk_province_1_modifier_desc: "Người dân địa phương đã tận hưởng việc uống rượu hết mình trong dịp lễ đăng quang vừa qua."
 
  ach_drunk_province_2_modifier: "Dân Chúng Say Mèm"
  ach_drunk_province_2_modifier_desc: "Lượng rượu bia tràn lan một cách thái quá trong lễ đăng quang vừa qua đã dẫn đến mức độ say xỉn chưa từng có tại tỉnh này."
 
  ach_generous_coronation_drinks_modifier: "Đồ Uống Hào Phóng Trong Lễ Đăng Quang"
  ach_generous_coronation_drinks_modifier_desc: "Nhân vật này đã đảm bảo dân thường được uống thỏa thích trong lễ đăng quang của mình, và đến nay họ vẫn lè nhè hô vang tên của ngài."

  ach_secret_stash_modifier: "Kho Cất Giấu Bí Mật"
  ach_secret_stash_modifier_desc: "Nhân vật này đã có được một nguồn hashish ngoại lai.\n\nCho phép sử dụng một lần [decision|E] [GetDecisionWithKey('stress_loss_hashishiyah_decision').GetName]"

  ach_liege_subsidies_modifier: "Trợ Cấp Hoàng Gia"
  ach_liege_subsidies_modifier_desc: "Vị thống trị địa phương này được quân chủ của mình ưu ái, và lãnh địa của họ cũng vậy."
