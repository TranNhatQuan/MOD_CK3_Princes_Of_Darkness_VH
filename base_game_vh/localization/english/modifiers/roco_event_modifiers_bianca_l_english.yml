 # Court Events: Character Modifiers
  smelly_court_roco_modifier:0 "Triều đình bốc mùi"
  smelly_court_roco_modifier_desc:0 "Nhân vật này có một triều đình tai tiếng, bị khiếp sợ vì mùi hôi thối khủng khiếp."
  drenched_in_excrement_roco_modifier:1 "Bị tắm trong phân"
  drenched_in_excrement_roco_modifier_desc:0 "Nhân vật này từng bị nhìn thấy ướt sũng trong chất thải và đến giờ vẫn còn bốc mùi."
  creative_burst_roco_modifier:0 "Bùng nổ sáng tạo"
  creative_burst_roco_modifier_desc:0 "Sau khi nhận được những lời khen, nhân vật này được truyền cảm hứng để tiếp tục sáng tạo."
  mocked_for_creative_burst_roco_modifier:0 "Nhà sáng tạo buồn bã"
  mocked_for_creative_burst_roco_modifier_desc:1 "Nhân vật này bị chế giễu vì sự sáng tạo của mình và giờ đang giữ kín các tác phẩm viết lách."
  trying_new_things_modifier:0 "Thử những điều mới"
  trying_new_things_modifier_desc:0 "Nhân vật này đang cố gắng mở rộng tầm nhìn bằng cách thử những điều mới và viết về nhiều chủ đề khác nhau."
  found_their_focus_modifier:0 "Tìm thấy trọng tâm"
  found_their_focus_modifier_desc:0 "Nhân vật này đã tìm ra chủ đề yêu thích để viết và đang đào sâu hơn vào việc sáng tác."
  moment_of_calm_and_clarity_roco_modifier:0 "Khoảnh khắc bình thản và sáng suốt"
  moment_of_calm_and_clarity_roco_modifier_desc:0 "Nhân vật này đã đạt được trạng thái tinh thần yên bình."
  made_a_fool_of_rival_roco_modifier:0 "Làm đối thủ bẽ mặt"
  made_a_fool_of_rival_roco_modifier_desc:0 "Nhân vật này đã công khai làm nhục đối thủ của mình, khiến mọi người xung quanh phải cân nhắc lại việc chọc giận họ."

 # Petition Events: Character Modifiers
  petition_event_artifact_exhibition_for_gold:0 "Triển lãm bảo vật thu phí"
  petition_event_artifact_exhibition_for_gold_desc:0 "Nhân vật này đang tổ chức một buổi triển lãm bảo vật có thu phí vào cửa."
  petition_event_artifact_exhibition_for_prestige:0 "Triển lãm bảo vật miễn phí"
  petition_event_artifact_exhibition_for_prestige_desc:0 "Nhân vật này đang tổ chức một buổi triển lãm bảo vật miễn phí."
 
 # Petition Events: County Modifiers
  hold_court_grateful_peasants_modifier:0 "Nông dân hài lòng"
  hold_court_grateful_peasants_modifier_desc:1 "Một phản hồi đối với thỉnh nguyện đã làm hài lòng nông dân trong khu vực này."
  hold_court_displeased_peasants_modifier:0 "Nông dân bất mãn"
  hold_court_displeased_peasants_modifier_desc:0 "Một quyết định tại triều đình đã khiến nông dân trong khu vực này vô cùng bất mãn."
  hold_court_less_building_cost_modifier:0 "Giảm chi phí xây dựng"
  hold_court_less_building_cost_modifier_desc:0 "Một quyết định tại triều đình đã dẫn đến việc giảm chi phí xây dựng trong khu vực này."

 # Court Events: County Modifiers
  county_dismissed_servants_fear_modifier:0 "Nỗi sợ của gia nhân bị phớt lờ"
  county_dismissed_servants_fear_modifier_desc:0 "Vị quân chủ này đã coi thường nỗi sợ của thần dân mình."
  county_acknowledged_servants_fear_modifier:0 "Thừa nhận nỗi sợ của gia nhân"
  county_acknowledged_servants_fear_modifier_desc:0 "Vị quân chủ này lắng nghe khi gia nhân của họ nói về những nỗi sợ hãi."

