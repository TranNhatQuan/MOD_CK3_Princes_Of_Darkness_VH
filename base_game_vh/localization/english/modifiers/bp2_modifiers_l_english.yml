l_english: 

  bp2_stranger_at_home_modifier: "Kẻ Xa Lạ Nơi Quê Nhà"
  bp2_stranger_at_home_modifier_desc: "Sau khi bị làm con tin, nhân vật này đã chấp nhận sự xa cách của mình với quê hương"
  bp2_stranger_no_more_modifier: "Tái Hòa Nhập"
  bp2_stranger_no_more_modifier_desc: "Sau khi bị làm con tin, nhân vật này đang nỗ lực để quen trở lại với quê hương của mình"
  bp2_uni_bad_encounters_modifier: "Những Cuộc Gặp Gỡ Tồi Tệ"
  bp2_uni_bad_encounters_modifier_desc: "Trong quá trình học tập khi đã trưởng thành, nhân vật này đã vướng vào rắc rối với những kẻ xấu"
  bp2_dialogue_with_the_masters_modifier: "Đối Thoại Với Các Bậc Thầy"
  bp2_dialogue_with_the_masters_modifier_desc: "Trong thời gian học tại Đại học, nhân vật này đã có thể trực tiếp đối thoại với các Bậc Thầy bằng ngôn ngữ phụng vụ của họ"
  foolish_endeavor_modifier: "Tự Làm Mình Bẽ Mặt"
  foolish_endeavor_modifier_desc: "Nỗ lực ngốc nghếch nhằm trò chuyện ngang hàng với các giảng sư tại Đại học của nhân vật này đã thất bại thảm hại"
  bp2_uni_connections_modifier: "Mối Quan Hệ Đại Học"
  bp2_uni_connections_modifier_desc: "Trong thời gian học tại Đại học, nhân vật này đã hòa nhập rất tốt với cộng đồng sinh viên địa phương"
  bp2_uni_isolation_modifier: "Cô Lập Học Tập"
  bp2_uni_isolation_modifier_desc: "Trong thời gian học tại Đại học, nhân vật này đã không thể kết nối với Bạn Bè đồng trang lứa"
  bp2_understanding_modifier: "Thấu Hiểu"
  bp2_understanding_modifier_desc: "Nhân vật này có trực giác để nhận ra khi người khác không hào hứng với một điều gì đó như họ."
  bp2_careful_modifier: "Cẩn Trọng Với Tài Sản"
  bp2_careful_modifier_desc: "Sau một tai nạn liên quan đến quả bóng đá khi còn nhỏ, nhân vật này giờ đây rất cẩn thận với tài sản của mình."
  bp2_cowardly_modifier: "Hèn Nhát"
  bp2_cowardly_modifier_desc: "Dù hiện tại có tính cách ra sao, nhân vật này vẫn mang vết nhơ vì đã bỏ mặc một đứa trẻ khác bị bắt nạt khi còn nhỏ."
  bp2_disrespects_elderly_modifier: "Khinh Thường Người Già"
  bp2_disrespects_elderly_modifier_desc: "Từ khi còn nhỏ, nhân vật này đã thể hiện sự coi thường lành mạnh đối với những người lớn tuổi hơn — và được cho là — khôn ngoan hơn, điều này ít nhất cũng khiến họ được giới trẻ yêu mến."
  bp2_guilt_ridden_modifier: "Day Dứt Tội Lỗi"
  bp2_guilt_ridden_modifier_desc: "Nhân vật này bị ám ảnh bởi việc đã không hành động trong một trận bóng đá, chỉ đứng nhìn khi một đứa trẻ khác bị đám đông giẫm đạp."
  bp2_ringing_ears_modifier: "Ù Tai"
  bp2_ringing_ears_modifier_desc: "Tai của nhân vật này vẫn còn ù đi sau khi một phụ huynh quá khích đã la hét om sòm với cả nhóm trong một trận bóng đá."
  bp2_self_preserving_modifier: "Tự Bảo Toàn"
  bp2_self_preserving_modifier_desc: "Bản năng tự bảo toàn của nhân vật này đã từng giúp họ rất nhiều trong quá khứ."

  imaginary_friend_modifier: "Ngài Tưởng Tượng"
  imaginary_friend_modifier_desc: "Nhân vật này có một người Ngài tưởng tượng."

  imaginary_friend_murder_scheme_modifier: "$imaginary_friend_modifier$"
  imaginary_friend_murder_scheme_modifier_desc: "Nhân vật này tin chắc vào thành công của âm mưu này sau khi bị người Ngài tưởng tượng của mình tác động"

  imaginary_friend_mad_modifier: "Điên Loạn Hoàn Toàn"
  imaginary_friend_mad_modifier_desc: "Nhân vật này có một cơn ngứa đặc biệt... và cách duy nhất để gãi nó là #EMP giết người#!"

  bp2_stifled_potential_modifier: "Tiềm Năng Bị Kìm Hãm"
  bp2_stifled_potential_modifier_desc: "Nhân vật này có nguồn tiềm năng to lớn chưa được khai thác, bị ngăn cản bởi những mưu đồ của kẻ khác."
  bp2_destined_modifier: "Định Mệnh Vinh Quang"
  bp2_destined_modifier_desc: "Nhân vật này có một điều gì đó đặc biệt khiến nhiều người tin rằng họ được sinh ra để trở nên vĩ đại."
  bp2_destiny_tutor_modifier: "Lời Khuyên Quân Sự"
  bp2_destiny_tutor_modifier_desc: "Nhân vật này đã nhận được những lời khuyên chiến lược vững chắc mà họ sẽ ghi nhớ trong một thời gian dài."
  bp2_tool_of_fate_modifier: "Công Cụ Của Định Mệnh"
  bp2_tool_of_fate_modifier_desc: "Sức hút tự nhiên của nhân vật này đã khiến họ nổi bật từ khi còn nhỏ, và những tài năng được bồi dưỡng đã tách họ ra khỏi đám đông."

  rock_story_modifier: "Hòn Đá Cưng"
  rock_story_modifier_desc: "Nhân vật này tận hưởng sự đồng hành của một người Ngài bằng đá."
  sated_stone_modifier: "Hòn Đá Thỏa Mãn"
  sated_stone_modifier_desc: "Nhân vật này cảm thấy dễ chịu hơn sau khi chiều chuộng hòn đá cưng của mình."
  rock_dopey_modifier: "Hòn Đá Ngớ Ngẩn"
  rock_dopey_modifier_desc: "Hòn đá cưng của nhân vật này, nói sao nhỉ, có phần hơi vụng về."
  lost_rock_modifier: "Mất Hòn Đá"
  lost_rock_modifier_desc: "Hòn đá cưng của nhân vật này đã bị thất lạc và sau đó mất vĩnh viễn. Họ vẫn chưa thể nguôi ngoai."
  bp2_bed_rock_modifier: "Đá Trên Giường"
  bp2_bed_rock_modifier_desc: "Nhân vật này yêu hòn đá cưng đến mức cho phép nó ngủ chung trên giường, khiến bất kỳ người Ngài đời nào cũng khó chịu."
  bp2_sore_thumb_modifier: "Đau Ngón Tay"
  bp2_sore_thumb_modifier_desc: "Nỗ lực làm đồ thủ công của nhân vật này đã khiến họ bị thương nhẹ."
  bp2_valued_friendship_modifier: "Mối Quan Hệ Đá"
  bp2_valued_friendship_modifier_desc: "Nhân vật này đã từ chối cơ hội tôn thờ hòn đá cưng trong nhà, thay vào đó mang nó theo bên mình mọi lúc."
  bp2_solid_foundations_modifier: "Nền Móng Vững Chắc"
  bp2_solid_foundations_modifier_desc: "Nhân vật này coi trọng sự vững chắc của kết cấu đến mức còn gắn hòn đá cưng vào tường nhà mình."

  bp2_one_upper_modifier: "Luôn Hơn Một Bậc"
  bp2_one_upper_modifier_desc: "Nhân vật này trở nên nổi tiếng vì thói quen khó chịu luôn cố tỏ ra hơn người khác trong các cuộc trò chuyện."
  bp2_trusted_parent_modifier: "Cha Mẹ Đáng Tin"
  bp2_trusted_parent_modifier_desc: "Cha mẹ của nhân vật này đã giành được lòng tin của họ, và điều đó sẽ được họ ghi nhớ trong nhiều năm."
  bp2_tight_knit_modifier: "Gia Đình Gắn Bó"
  bp2_tight_knit_modifier_desc: "Nhân vật này nhớ về tuổi thơ an toàn và ấm áp trong vòng tay gia đình, và đến nay vẫn giữ mối liên kết chặt chẽ với họ."
  bp2_listened_elders_modifier: "Lời Khuyên Trưởng Bối"
  bp2_listened_elders_modifier_desc: "Nhân vật này tìm đến lời khuyên của các trưởng bối, lắng nghe sự thông thái của họ để rút ra những hiểu biết quý giá."
  bp2_foreign_influences_modifier: "Ảnh Hưởng Ngoại Lai"
  bp2_foreign_influences_modifier_desc: "Sự quan tâm của nhân vật này đối với các nền văn hóa khác khiến những người thân cận nghi ngờ."
  bp2_parental_heartbreak_modifier: "Tổn Thương Từ Cha Mẹ"
  bp2_parental_heartbreak_modifier_desc: "Nhân vật này vẫn đang phải đối mặt với những vết thương tinh thần do cha hoặc mẹ gây ra."
  bp2_culturally_adventurous_modifier: "Phiêu Lưu Văn Hóa"
  bp2_culturally_adventurous_modifier_desc: "Sự sẵn sàng đón nhận điều xa lạ của nhân vật này đã khiến họ trở nên khôn ngoan và được chấp nhận rộng rãi hơn."
  bp2_expanded_horizons_modifier: "Tầm Nhìn Mở Rộng"
  bp2_expanded_horizons_modifier_desc: "Tầm nhìn của nhân vật này đã được mở rộng từ khi còn nhỏ nhờ giao lưu với những người thuộc nền văn hóa khác."

  parent_helped_grief_modifier: "Được Giúp Vượt Qua Nỗi Đau"
  parent_helped_grief_modifier_desc: "Cha hoặc mẹ của nhân vật này đã giúp họ đối mặt với nỗi đau mất đi người vú nuôi yêu quý."
  wet_nurse_bonding_modifier: "Gắn Kết Với Vú Nuôi"
  wet_nurse_bonding_modifier_desc: "Nhân vật này đã gắn bó với người vú nuôi của mình thông qua đức tin và văn hóa chung."
  wet_nurse_faith_bonding_modifier: "$wet_nurse_bonding_modifier$"
  wet_nurse_faith_bonding_modifier_desc: "Nhân vật này đã gắn bó với người vú nuôi của mình thông qua cùng đức tin."
  wet_nurse_cultural_bonding_modifier: "$wet_nurse_bonding_modifier$"
  wet_nurse_cultural_bonding_modifier_desc: "Nhân vật này đã gắn bó với người vú nuôi của mình thông qua cùng văn hóa."
  bp2_good_parent_modifier: "Cha Mẹ Nhân Ái"
  bp2_good_parent_modifier_desc: "Nhân vật này nhân ái và quan tâm đến cảm xúc cũng như hành động của con cái mình."
  under_childs_boot_modifier: "Bị Con Cái Sai Khiến"
  under_childs_boot_modifier_desc: "Nhân vật này hành động theo những ý thích và mong muốn thất thường của con cái."

  bp2_strong_willed_modifier: "Ý Chí Mạnh Mẽ"
  bp2_strong_willed_modifier_desc: "Sự bướng bỉnh và tự phụ khi còn nhỏ đã khiến nhân vật này gặp nhiều rắc rối với người lớn, nhưng lại được Bạn Bè đồng trang lứa ngưỡng mộ."

  bp2_sweet_treat_modifier: "Món Ngọt Yêu Thích"
  bp2_sweet_treat_modifier_desc: "Nhân vật này đã lén lấy được một món ngọt từ nhà bếp. Món khoái khẩu của họ!"

  bp2_empathetic_modifier: "Đồng Cảm"
  bp2_empathetic_modifier_desc: "Nhân vật này đã thể hiện khả năng thấu hiểu cảm xúc đa dạng khi đối xử với người khác."

  bp2_joust_prodigy_modifier: "Thần Đồng Đấu Thương"
  bp2_joust_prodigy_modifier_desc: "Nhân vật này đã thể hiện tài năng thiên bẩm trong đấu thương từ khi còn rất trẻ."

  bp2_afterlife_citer_modifier: "Tin Vào Thế Giới Bên Kia"
  bp2_afterlife_citer_modifier_desc: "Sự chắc chắn công khai của nhân vật này về sự tồn tại của thế giới bên kia khiến họ được xem là đặc biệt dễ gần."

  bp2_numbed_to_death_modifier: "Chai Lì Trước Cái Chết"
  bp2_numbed_to_death_modifier_desc: "Những trải nghiệm sớm với cái chết đã khiến nhân vật này mang dáng vẻ lạnh lùng khi đối diện với những vấn đề đó."

  shaven_bald_modifier: "Cạo Trọc Tàn Nhẫn"
  shaven_bald_modifier_desc: "Mái tóc của nhân vật này đã bị cạo sạch trong một nghi thức trưởng thành, chỉ còn lại da đầu trầy xước."

  scorched_soles_modifier: "Bàn Chân Cháy Xém"
  scorched_soles_modifier_desc: "Sau nghi thức đi trên lửa đầy gian khổ, nhân vật này bước đi cẩn trọng trên đôi bàn chân bị bỏng nặng."

  tough_and_confident_modifier: "Cứng Cỏi & Tự Tin Bộ Tộc"
  tough_and_confident_modifier_desc: "Vượt qua các nghi thức trưởng thành, nhân vật này đã học được lòng nhiệt huyết, quyết tâm và sự tự lực."

  peace_over_honor_modifier: "Hòa Bình Hơn Danh Dự"
  peace_over_honor_modifier_desc: "Khi một triều đình đang giữ thân nhân làm con tin bị đe dọa, nhân vật này đã từ chối viện trợ."

  a_noble_fight_modifier: "Cuộc Chiến Cao Quý"
  a_noble_fight_modifier_desc: "Bằng việc đáp lại lời cầu cứu của một con tin đang gặp nguy hiểm, nhân vật này đã dấn thân vào con đường phiêu lưu quân sự."

  aggressive_unpredictable_modifier: "Hiếu Chiến, Khó Lường"
  aggressive_unpredictable_modifier_desc: "Kẻ hiếu chiến này nổi tiếng vì có thể từ đình chiến chuyển sang tấn công bạo lực chỉ với một sự khiêu khích nhỏ nhất."
