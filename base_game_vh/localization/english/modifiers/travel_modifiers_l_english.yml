l_english:
 
  travel_returning_home_modifier:0 "Trở Về Quê Nhà"
  travel_returning_home_modifier_desc:0 "Đoàn lữ hành này đang rất nóng lòng được trở về nhà."
  positive_roadside_reading_modifier:0 "Hành Trình: Điềm Lành"
  negative_roadside_reading_modifier:0 "Hành Trình: Điềm Gở"
  nonverbal_modifier:0 "Không Giao Tiếp Bằng Lời"
  nonverbal_modifier_desc:0 "Nhân vật này có khả năng hiểu ngôn ngữ nói rất hạn chế."
  feral_modifier:0 "Hoang Dã"
  feral_modifier_desc:0 "Nhân vật này được nuôi lớn nơi hoang dã, xa rời nền văn minh loài người. Điều đó kéo theo vô số vấn đề về phát triển và sức khỏe khó có thể khắc phục."
  stalked_by_feral_child_modifier:0 "Bị Theo Dõi"
  stalked_by_feral_child_modifier_desc:0 "Nhân vật này từng bị một đứa trẻ hoang dã theo dõi. Dù nó đã biến mất, ký ức ám ảnh về đôi mắt vô hồn ấy vẫn để lại cảm giác bất an."
  heatstroke_modifier:0 "Khó Chịu Vì Nóng"
  heatstroke_modifier_desc:0 "Nhân vật này trở nên mệt mỏi vì cái nóng."
  cheaper_merc_contracts:0 "Mối Quan Hệ Với Lính Đánh Thuê"
  cheaper_merc_contracts_desc:0 "Nhân vật này đã tạo được mối liên hệ cá nhân với một lính đánh thuê có thế lực."
  good_soup_modifier:0 "Bữa Ăn Ngon"
  good_soup_modifier_desc:0 "Gần đây nhân vật này đã nếm thử món ăn dân dã của nông dân tại một khu chợ ẩm thực ngoại lai — và nó rất ngon!"
  bad_soup_modifier:0 "Bữa Ăn Kinh Tởm"
  bad_soup_modifier_desc:0 "Gần đây nhân vật này đã ăn phải món ăn nông dân cực kỳ khó nuốt."
  exotic_recipe_modifier:0 "Công Thức Ngoại Lai"
  exotic_recipe_modifier_desc:0 "Đầu bếp của nhân vật này gần đây được chỉ dẫn cách chế biến một món ăn ngoại lai, ngon miệng từ nguyên liệu địa phương."
  ignores_gender_army_rules:0 "Chỉ Huy Xứng Đáng"
  ignores_gender_army_rules_desc:0 "Nhân vật này đã chứng minh bản thân xứng đáng chỉ huy quân đội, bất chấp quan điểm xã hội về giới tính."
  offended_eastern_modifier:0 "Xúc Phạm Tôn Giáo"
  offended_eastern_modifier_desc:0 "Nhân vật này đã tự cô lập mình khỏi cả một cộng đồng tôn giáo."
  offended_pagan_modifier:0 "$offended_eastern_modifier$"
  offended_pagan_modifier_desc:0 "$offended_eastern_modifier_desc$"
  offended_christian_modifier:0 "$offended_eastern_modifier$"
  offended_christian_modifier_desc:0 "$offended_eastern_modifier_desc$"
  offended_muslim_modifier:0 "$offended_eastern_modifier$"
  offended_muslim_modifier_desc:0 "$offended_eastern_modifier_desc$"
  offended_jewish_modifier:0 "$offended_eastern_modifier$"
  offended_jewish_modifier_desc:0 "$offended_eastern_modifier_desc$"
  xenophile_bonus_modifier:0 "$offended_eastern_modifier$"
  xenophile_bonus_modifier_desc:0 "$offended_eastern_modifier_desc$"
  interpreter_option_modifier:0 "Thông Dịch Viên"
  pampered_by_locals_modifier:0 "Được Dân Địa Phương Tiếp Đãi"
  pampered_by_locals_modifier_desc:0 "Gần đây nhân vật này đã được cho thấy thế nào là Lòng Hiếu Khách Nghi Lễ."
  caught_thief_modifier:0 "Kẻ Trộm"
  caught_thief_modifier_desc:0 "Nhân vật này gần đây bị bắt quả tang khi cố trộm một vật quý từ đoàn thương nhân."
  travel_well_fed_travellers:0 "Lữ Khách No Đủ"
  travel_well_fed_travellers_desc:0 "Những lữ khách này gần đây đã thương lượng với dân địa phương để có thêm lương thực."
  laamp_provisions_forgiveness_travel_modifier:0 "$travel_well_fed_travellers$"
  laamp_provisions_forgiveness_travel_modifier_desc:0 "$travel_well_fed_travellers_desc$"
  travel_alone_with_strangers_modifier:0 "Ở Cùng Người Lạ"
  travel_alone_with_strangers_modifier_desc:0 "Nhóm hành hương vui vẻ này hầu như không biết gì về nhau và chỉ mang theo vũ trang rất nhẹ..."
  travel_obligatory_pilgrimage_modifier:0 "Thượng Lộ Bình An"
  travel_obligatory_pilgrimage_modifier_desc:0 "Đức tin của nhân vật này dường như thúc đẩy họ đến đích #EMP cực kỳ#! nhanh chóng."
  travel_contemplative_pilgrimage_modifier:0 "Chiêm Nghiệm Đức Tin"
  travel_contemplative_pilgrimage_modifier_desc:0 "Nhân vật này đang suy ngẫm về mối quan hệ của bản thân và mối quan hệ với đức tin. Việc chú ý đến con đường chỉ là thứ yếu."
  quarreling_entourage_modifier:0 "Tùy Tùng Cãi Vã"
  quarreling_entourage_modifier_desc:0 "Đoàn tùy tùng của nhân vật này nổi tiếng vì dành nhiều thời gian tranh cãi hơn là bước đi."
  entourage_mediator_modifier:0 "Hòa Giải Tùy Tùng"
  entourage_mediator_modifier_desc:0 "Nhân vật này đã thành công trong việc hòa giải tranh chấp giữa các thành viên trong đoàn tùy tùng khi di chuyển."
  flesh_wound_modifier: "Vết Thương Ngoài Da"
  flesh_wound_modifier_desc: "Nhân vật này bị thương khá nặng, nhưng không sâu."
  travel_ate_poisonous_plant_modifier:0 "Bệnh Do Cây Lạ"
  travel_ate_poisonous_plant_modifier_desc:0 "Nhân vật này đã ăn phải một loài cây không rõ trong lúc di chuyển, gây tổn hại nghiêm trọng đến dạ dày."
  travel_touched_poisonous_plant_modifier:0 "Phát Ban Do Cây Lạ"
  travel_touched_poisonous_plant_modifier_desc:0 "Nhân vật này chạm phải một loài cây không rõ trong lúc di chuyển, khiến da đỏ và ngứa."
  travel_good_poisonous_plant_modifier:0 "Khoan Khoái Do Cây Lạ"
  travel_good_poisonous_plant_modifier_desc:0 "Nhân vật này đã ăn phải một loài cây không rõ trong lúc di chuyển, khiến cơ thể và tinh thần được tiếp thêm sinh lực."
  travel_mild_frostbite_modifier:0 "Tê Cóng Nhẹ"
  travel_mild_frostbite_modifier_desc:0 "Nhân vật này bị tê cóng nhẹ trong lúc di chuyển."
  travel_severe_frostbite_modifier:0 "Tê Cóng Nặng"


  travel_severe_frostbite_modifier_desc:0 "Nhân vật này bị tê cóng trong lúc di chuyển và tình trạng đã trở nên nghiêm trọng."
  travel_brought_home_new_dessert:0 "Món Tráng Miệng Ngoại Lai"
  travel_brought_home_new_dessert_desc:0 "Nhân vật này đã mang về một loại tráng miệng mới mà họ gặp trong chuyến du hành đến những vùng đất xa xôi."
  travel_brought_home_new_dessert_no_court:0 "$travel_brought_home_new_dessert$"
  travel_brought_home_new_dessert_no_court_desc:0 "$travel_brought_home_new_dessert_desc$"
  travel_brought_home_new_techniques:0 "Kỹ Thuật Mới"
  travel_brought_home_new_techniques_desc:0 "Nhân vật này đã mang về các kỹ thuật sản xuất và phong cách thời trang mới từ những thành phố lớn nơi phương xa. Điều này đã thúc đẩy sự phát triển kinh tế của quê hương họ."
  contemplated_life:0 "Chiêm Nghiệm"
  contemplated_life_desc:0 "Nhân vật này đã dành thời gian suy ngẫm về sự mong manh của sự sống và tìm được sự tập trung mới để sống trọn từng ngày."
  travel_city_existential_dread:0 "Nỗi Sợ Hiện Sinh"
  travel_city_existential_dread_desc:0 "Nhân vật này đã dành thời gian chiêm nghiệm. Nỗi sợ về cái chết bất ngờ thúc đẩy họ tập trung vào nhiệm vụ khi vẫn còn thời gian."
  travel_city_history_city_planning:0 "Bài Học Quy Hoạch Đô Thị"
  travel_city_history_city_planning_desc:0 "Nhân vật này đã thu được những hiểu biết mới về quy hoạch đô thị bằng cách nghiên cứu bố cục và cấu trúc của các đại đô thị trong lịch sử."
  travel_city_history_underground_tunnels:0 "Bài Học Xây Dựng Ngầm"
  travel_city_history_underground_tunnels_desc:0 "Nhân vật này đã thu được những hiểu biết mới khi nghiên cứu hệ thống đường hầm ngầm phức tạp của một trong những đại đô thị lịch sử."
  travel_city_history_spoilage:0 "Spolia"
  travel_city_history_spoilage_desc:0 "Nhân vật này đã học được cách tận dụng hiệu quả tàn tích của các công trình cũ khi xây dựng công trình mới, giúp tăng tốc đáng kể việc xây dựng các dự án."
  travel_city_history_irrigation:0 "Bài Học Quản Lý Nguồn Nước"
  travel_city_history_irrigation_desc:0 "Nhân vật này đã thu được những hiểu biết sâu sắc về cách quy hoạch bể chứa và cầu dẫn nước để đáp ứng tốt nhu cầu nước lớn."
  travel_city_history_rulership:0 "Bài Học Về Trị Quốc"
  travel_city_history_rulership_desc:0 "Nhân vật này đã thu được những hiểu biết về trị quốc thông qua việc nghiên cứu các bậc minh quân và học giả pháp luật của những vùng đất xa xưa."
  travel_city_roman_rulership:0 "Bài Học Về Trị Quốc La Mã"
  travel_city_roman_rulership_desc:0 "Nhân vật này đã thu được những hiểu biết về nghệ thuật trị quốc La Mã khi chiêm nghiệm đế chế lâu đời nhất của thế giới trung cổ."
  travel_city_history_intrigue:0 "Bài Học Mưu Lược"
  travel_city_history_intrigue_desc:0 "Nhân vật này đã thu được hiểu biết về mưu lược sau khi nghiên cứu các nhà cầm quyền và bộ óc chính trị kiệt xuất trong lịch sử."
  travel_city_history_fortifications:0 "Bài Học Về Công Sự"
  travel_city_history_fortifications_desc:0 "Nhân vật này đã thu được hiểu biết về cách quy hoạch công sự vững chắc khi nghiên cứu các thành phố kiên cố của quá khứ."
  travel_steeds_acquired_modifier:0 "Thu Được Thú Cưỡi"
  travel_steeds_acquired_modifier_desc:0 "Đoàn lữ hành này đã có thêm thú cưỡi."
  travel_ignored_pasture_issue_modifier:0 "Phớt Lờ Vấn Đề Đồng Cỏ"
  travel_ignored_pasture_issue_modifier_desc:0 "Người lãnh đạo đoàn lữ hành này đã phớt lờ các vấn đề địa phương rõ ràng để ưu tiên tốc độ."
  scheme_poisonous_herbs_modifier:0 "Sử Dụng Thảo Dược Độc"
  travel_soothing_quack_modifier:0 "Tiếng Quạc Dịu Êm"
  travel_soothing_quack_modifier_desc:0 "Tiếng quạc của một con vịt có tác dụng xoa dịu đáng kinh ngạc."
  travel_bundle_of_quacks_modifier:0 "Vịt Con"
  travel_bundle_of_quacks_modifier_desc:0 "Nhân vật này đã bắt gặp một đàn vịt con lông xù. Đáng yêu!"
  travel_well_fed_modifier:0 "Ăn Uống Đầy Đủ"
  travel_well_fed_modifier_desc:0 "Nhân vật này đã có một trải nghiệm ẩm thực tuyệt vời."
  travel_choke_on_a_bone_modifier:0 "Hóc Xương"
  travel_choke_on_a_bone_modifier_desc:0 "Nhân vật này đã có một trải nghiệm ăn uống vô cùng khó chịu."
  travel_ran_like_the_wind_modifier:0 "Chạy Nhanh Như Gió"
  travel_ran_like_the_wind_modifier_desc:0 "Nhân vật này chắc chắn hiểu rõ giá trị của tốc độ."
  travel_soothed_modifier:0 "Được Xoa Dịu"
  travel_soothed_modifier_desc:0 "Nhân vật này đã được xoa dịu đầy đủ."
  travel_soothed_child_modifier:0 "Xoa Dịu Trẻ Nhỏ"
  travel_soothed_child_modifier_desc:0 "Nhân vật này đã xoa dịu thành công một đứa trẻ."
  travel_local_hero_modifier:0 "Anh Hùng Cứu Hỏa"
  travel_local_hero_modifier_desc:0 "Nhân vật này đã cứu một số công nhân địa phương trong một vụ hỏa hoạn."
  travel_taking_in_the_views_modifier:0 "Ngắm Nhìn Phong Cảnh"
  travel_taking_in_the_views_modifier_desc:0 "Nhân vật này đã chiêm ngưỡng quang cảnh ngoạn mục từ trên cao."
  travel_sore_muscles_modifier:0 "Đau Nhức Cơ Bắp"
  travel_sore_muscles_modifier_desc:0 "Nhân vật này đã lao động tay chân lần đầu sau một thời gian dài."
  travel_bull_fighter_modifier:0 "Đấu Sĩ Bò Tót"
  travel_bull_fighter_modifier_desc:0 "Nhân vật này đã đánh bại một con bò điên cuồng."
  travel_health_boost_modifier:0 "Tăng Cường Sức Khỏe"
  travel_health_boost_modifier_desc:0 "Sức khỏe của nhân vật này đã được cải thiện."
  travel_witch_enthralled_modifier:0 "Say Đắm"
  travel_witch_enthralled_modifier_desc:0 "Nhân vật này đã phải lòng một người vô cùng đặc biệt."
  travel_approachable_modifier:0 "Dễ Gần"
  travel_approachable_modifier_desc:0 "Nhân vật này đã thể hiện bản lĩnh và vượt lên trên những lời chế giễu công khai."
  travel_rich_dining_modifier:0 "Ẩm Thực Thịnh Soạn"
  travel_rich_dining_modifier_desc:0 "Nhân vật này đã khuyến khích công nhân được thưởng thức những bữa ăn thịnh soạn."
  travel_down_to_earth_modifier:0 "Gần Gũi Thiên Nhiên"
  travel_down_to_earth_modifier_desc:0 "Nhân vật này đã dành thời gian để hòa mình nhiều hơn với thiên nhiên."
  travel_manhunted_prisoner_modifier:0 "Săn Người"
  travel_manhunted_prisoner_modifier_desc:0 "Nhân vật này đã dành thời gian săn đuổi một tù nhân để tiêu khiển."
  travel_heightened_senses_modifier:0 "Giác Quan Nhạy Bén"
  travel_heightened_senses_modifier_desc:0 "Nhân vật này có các giác quan nhạy bén hơn sau khi sống sót qua một âm mưu ám sát."
  travel_chivalrous_deeds_modifier:0 "Hành Động Hiệp Nghĩa"
  travel_chivalrous_deeds_modifier_desc:0 "Nhân vật này đã cứu một nhân vật khác khỏi một âm mưu ám sát."

  travel_mismanaged_pasture_modifier:0 "Đồng Cỏ Quản Lý Kém"
  travel_mismanaged_pasture_modifier_desc:0 "Các đồng cỏ tại quận này bị quản lý cực kỳ yếu kém."
  travel_slightly_better_pasture_modifier:0 "Đồng Cỏ Ít Tệ Hơn"
  travel_slightly_better_pasture_modifier_desc:0 "Các đồng cỏ tại quận này không tệ như mức có thể xảy ra."
  travel_improved_pasture_modifier:0 "Đồng Cỏ Được Cải Thiện"
  travel_improved_pasture_modifier_desc:0 "Các đồng cỏ này đang ở tình trạng cực kỳ tốt."
  travel_burned_orchard_modifier:0 "Vườn Cây Bị Thiêu Rụi"
  travel_burned_orchard_modifier_desc:0 "Vườn cây địa phương đã bị thiêu rụi hoàn toàn."
  travel_pillaged_plantation_modifier:0 "Đồn Điền Bị Cướp Phá"
  travel_pillaged_plantation_modifier_desc:0 "Đồn điền địa phương đã bị cướp phá."
  travel_rescued_workers_modifier:0 "Cứu Công Nhân"
  travel_rescued_workers_modifier_desc:0 "Công nhân đồn điền địa phương đã được cứu trong một vụ hỏa hoạn."
  travel_burning_plantation_modifier:0 "Đồn Điền Cháy"
  travel_burning_plantation_modifier_desc:0 "Đồn điền địa phương đã bị thiêu rụi."
  travel_appreciated_quarry_modifier:0 "Mỏ Đá Được Đánh Giá Cao"
  travel_appreciated_quarry_modifier_desc:0 "Mỏ đá địa phương được chúa tể đánh giá cao."
  travel_insulted_quarry_modifier:0 "Mỏ Đá Bị Khinh Thường"
  travel_insulted_quarry_modifier_desc:0 "Chúa tể không quan tâm đến mỏ đá địa phương."
  travel_taxman_modifier:0 "Thuế Đồ Uống"
  travel_taxman_modifier_desc:0 "Quận này đã phải đối mặt với sự thật khắc nghiệt của việc tăng thuế đồ uống."
  travel_efficiency_improvements_modifier:0 "Nâng Cấp Hiệu Suất"
  travel_efficiency_improvements_modifier_desc:0 "Quận này đã nhận được một số lời khuyên về hiệu suất. Rất hiệu quả."
  travel_wellfed_workers_modifier:0 "Công Nhân No Đủ"
  travel_wellfed_workers_modifier_desc:0 "Công nhân tại quận này đã được chăm lo đầy đủ."
  travel_indifferent_liege_modifier:0 "Chúa Tể Thờ Ơ"
  travel_indifferent_liege_modifier_desc:0 "Chúa tể thờ ơ trước những khó khăn của công nhân."
  travel_cruel_liege_modifier:0 "Chúa Tể Tàn Nhẫn"
  travel_cruel_liege_modifier_desc:0 "Công nhân tại quận này đã bị trừng phạt vì những khó khăn của họ."
  travel_fine_dining_workers_modifier:0 "Công Nhân Ăn Uống Thịnh Soạn"
  travel_fine_dining_workers_modifier_desc:0 "Công nhân tại quận này đã được nếm trải cuộc sống xa hoa."
  travel_safe_roads_modifier:0 "Đường Xá An Toàn"
  travel_safe_roads_modifier_desc:0 "Quận này có hệ thống đường xá an toàn vượt trội."
  travel_sacrificed_levies_modifier:0 "Quân Dịch Hy Sinh"
  travel_sacrificed_levies_modifier_desc:0 "Thái ấp này đã bảo vệ một lữ khách bị tấn công."
  discounted_church_holding_build_cost_modifier:0 "Hiểu Biết Xây Dựng Đền Thờ"
  discounted_church_holding_build_cost_modifier_desc:0 "Nghiên cứu một ngôi đền vĩ đại có thể mang lại lợi ích cho quê nhà."
  played_it_cool_modifier:0 "Giữ Kín Bí Mật"
  played_it_cool_modifier_desc:0 "Nhân vật này rất giỏi che giấu bí mật của mình."
  bountiful_harvest_modifier:0 "Vụ Mùa Bội Thu"
  bountiful_harvest_modifier_desc:0 "Chư hầu của nhân vật này có những vụ mùa bội thu và vì thế đóng góp nhiều hơn cho lãnh địa."
  prowess_demonstration_modifier:0 "Phô Diễn Võ Dũng"
  prowess_demonstration_modifier_desc:0 "Quận này đã chứng kiến võ nghệ và tài thao lược quân sự của triều đình chúa tể."
  bird_ate_supplies:0 "Thiếu Lương Thực"
  bird_ate_supplies_desc:0 "Một con chim đã phá hủy nhiều lương thực mà đoàn lữ hành phụ thuộc vào."
  ate_a_bird:0 "Bữa Ăn Ngon"
  ate_a_bird_desc:0 "Một con chim đã ăn mất nhiều lương thực của đoàn lữ hành. May mắn thay, số còn lại đủ để làm món chim quay thơm ngon."
  bird_superstition:0 "Điềm Gở"
  bird_superstition_desc:0 "Một con chim đã bị giết và ăn trong chuyến đi, điều mà nhiều người cho là điềm xấu."
  the_home_away_from_home_modifier: "Nhà Xa Quê"
  the_home_away_from_home_modifier_desc: "Với một số người, ngao du thiên hạ còn dễ chịu hơn nhiều so với việc bị giam chân ở nhà."
  charlatan_inspiration: "Cảm Hứng Từ Kẻ Lang Băm"
  charlatan_inspiration_desc: "Nhân vật này đã tích lũy kinh nghiệm sau khi giải cứu thành công một đoàn diễn viên lưu động."
  travel_speed_actor: "Tiến Quân Thần Tốc"
  sold_provisions: "Binh Sĩ Đói Khát"
  sold_provisions_desc: "Việc phân phối khẩu phần nghiêm ngặt đã làm suy yếu binh sĩ đồn trú tại thái ấp này."
  diminished_regiment: "Đơn Vị Suy Giảm"
  diminished_regiment_desc: "Đơn vị đồn trú tại thái ấp này đã phải trả giá bằng máu vì sự ngạo mạn của mình."
  celebrated_leader: "Chỉ Huy Được Ca Tụng"
  celebrated_leader_desc: "Quân đội của nhân vật này được ăn uống đầy đủ và háo hức đền đáp bằng máu của kẻ thù."
  alert_soldiers: "Binh Sĩ Cảnh Giác"
  alert_soldiers_desc: "Quân đội của nhân vật này đặc biệt cảnh giác."
  whipped_soldiers: "Binh Sĩ Kỷ Luật"
  whipped_soldiers_desc: "Đơn vị đồn trú tại thái ấp này luyện tập hằng ngày."
  reluctant_recruits: "Tân Binh Miễn Cưỡng"
  reluctant_recruits_desc: "Việc tuyển mộ binh sĩ mới tốn kém hơn do kỷ luật nghiêm khắc và đôi khi chết người của nhân vật này."
  intrepid_traveler_travel_modifier: "Những Lữ Hành Gia Bất Khuất"
  intrepid_traveler_travel_modifier_desc: "Được truyền cảm hứng từ lòng dũng cảm của vị thủ lĩnh, cả đoàn lữ hành tiếp tục lên đường với tinh thần phấn chấn cao độ."
