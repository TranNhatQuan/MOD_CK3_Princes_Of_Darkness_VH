l_english:
  tgp_doddering_magistrate_modifier: "Quan Lại Lẩm Cẩm"
  tgp_doddering_magistrate_modifier_desc: "Thật sự ấn tượng khi chỉ một người cũng có thể gây ra từng ấy hỗn loạn hành chính."
  tgp_disrespected_elderly_modifier: "Bất Kính Với Người Già"
  tgp_disrespected_elderly_modifier_desc: "Chỉ một bậc cao niên bất mãn cũng có thể khuấy động một lượng rắc rối đáng ngạc nhiên."
  tgp_reduced_taxes_modifier: "Giảm Gánh Nặng Thuế Khóa"
  tgp_reduced_taxes_modifier_desc: "Giảm thuế có thể không làm giàu cho quốc khố, nhưng chắc chắn mang lại lợi ích lớn về mặt lòng dân."
  tgp_imprisoned_poor_modifier: "Giam Giữ Người Nghèo"
  tgp_imprisoned_poor_modifier_desc: "Việc bỏ tù người nghèo hóa ra lại cực kỳ không được lòng dân."
  tgp_compelled_labor_modifier: "Lao Động Cưỡng Bức"
  tgp_compelled_labor_modifier_desc: "Dân chúng bị đưa vào lao động, và dù không mấy hào hứng với viễn cảnh này, họ vẫn làm việc khá hiệu quả."
  tgp_appreciative_populace_modifier: "Dân Chúng Biết Ơn"
  tgp_appreciative_populace_modifier_desc: "Những vị quan liêm chính luôn được tầng lớp bình dân trân trọng."
  tgp_pardoned_prisoners_modifier: "Phóng Thích Tù Nhân"
  tgp_pardoned_prisoners_modifier_desc: "Ngay cả những kẻ ít tội nhất vẫn là có tội — và một số nhanh chóng quay lại thói quen cũ."
  tgp_convict_labor_modifier: "Lao Động Tù Nhân"
  tgp_convict_labor_modifier_desc: "Trong xây dựng, tù nhân từ lâu đã là giải pháp quen thuộc cho tình trạng thiếu nhân công."
  tgp_enforced_justice_on_official_modifier: "Công Lý Nghiêm Khắc"
  tgp_enforced_justice_on_official_modifier_desc: "Một chính quyền đối xử nghiêm khắc với chính người của mình như với kẻ khác xứng đáng được tôn trọng."
  tgp_potent_physick: "Dược Phẩm Mạnh"
  tgp_potent_physick_desc: "Thứ thuốc của gã bán rong đã chứng tỏ là #EMP đầy sinh lực#! theo nhiều cách hơn một."
  tgp_expelled_popular_peddler_modifier: "Trục Xuất Người Bán Rong Được Ưa Chuộng"
  tgp_expelled_popular_peddler_modifier_desc: "Khu chợ tiếc thương sự mất mát của một thứ linh dược hiệu quả đến vậy."
  tgp_delayed_taxes_modifier: "Hoãn Thu Thuế"
  tgp_delayed_taxes_modifier_desc: "Dân cư của tỉnh này được phép trì hoãn việc nộp thuế — gây tổn hại cho ngân khố, nhưng lại được lòng dân."
  tgp_reassured_populace: "Dân Chúng Được Trấn An"
  tgp_reassured_populace_desc: "Một nhà lãnh đạo đáng tin cậy là nguồn trấn an to lớn đối với những người dân đang lo lắng."
  tgp_state_annexed_land: "Đất Bị Nhà Nước Trưng Thu"
  tgp_state_annexed_land_desc: "Nhà nước muốn gì thì thường sẽ lấy được, và rất ít người có thể phản đối."
  tgp_empowered_merchants_association: "Hiệp Hội Thương Nhân Được Trao Quyền"
  tgp_empowered_merchants_association_desc: "Trao đặc quyền cho một nhóm thương nhân cụ thể có thể giải quyết nhiều vấn đề của thị trường, nhưng cũng tạo ra tiền lệ nguy hiểm."
  tgp_army_reconstruction: "Tái Thiết Với Sự Hỗ Trợ Của Quân Đội"
  tgp_army_reconstruction_desc: "Binh lính có thể càu nhàu khi bị đưa đi làm các dự án lao động, nhưng hiệu quả của họ thì không thể phủ nhận."
  tgp_well_planned_bridge: "Cây Cầu Được Quy Hoạch Tốt"
  tgp_well_planned_bridge_desc: "Gần đây, một cây cầu đáng khen ngợi đã được xây dựng tại đây."
  tgp_settled_caravans: "Đoàn Lữ Hành Định Cư"
  tgp_settled_caravans_desc: "Thuyết phục các đoàn thương nhân định cư lâu dài đã chứng tỏ là một lợi ích lớn cho kinh tế địa phương."
  tgp_suppressed_popular_storyteller: "Đàn Áp Người Kể Chuyện Được Ưa Chuộng"
  tgp_suppressed_popular_storyteller_desc: "Bịt miệng một tiếng nói thẳng thắn có thể dập tắt bất ổn, nhưng cũng có thể gây ra nó."
  tgp_state_sponsored_storytellers: "Người Kể Chuyện Được Nhà Nước Bảo Trợ"
  tgp_state_sponsored_storytellers_desc: "Người dân nơi đây thường xuyên được nghe những câu chuyện về các quan lại nhân từ và binh sĩ anh hùng."
  tgp_converted_storyteller: "Người Kể Chuyện Trở Mặt"
  tgp_converted_storyteller_desc: "Ít ai truyền bá với sự cuồng nhiệt như một kẻ cải đạo, và điều này dường như đúng với người kể chuyện không kém gì tu sĩ."
  tgp_consolidated_population: "Dân Cư Được Tập Trung"
  tgp_consolidated_population_desc: "Việc tập trung dân cư từ các làng mạc rải rác vào một địa điểm duy nhất đã thúc đẩy đáng kể sự phát triển của khu vực."
  tgp_market_regulation: "Thị Trường Được Quản Lý Chặt Chẽ"
  tgp_market_regulation_desc: "Bàn tay nghiêm khắc của nhà nước đảm bảo việc buôn bán được tiến hành đúng đắn và theo quy định."
  tgp_purchased_land: "Thâu Tóm Đất Đai"
  tgp_purchased_land_desc: "Sự nghiệp quan trường thường mang lại nhiều cơ hội dồi dào cho việc làm giàu cá nhân."
  tgp_hastily_rebuilt_bridge: "Cây Cầu Được Xây Lại Vội Vã"
  tgp_hastily_rebuilt_bridge_desc: "Vội vàng không phải lúc nào cũng là lựa chọn khôn ngoan trong xây dựng, nhưng đôi khi nhu cầu quá cấp bách để chờ đợi."
  tgp_ferry_crossing: "Bến Phà"
  tgp_ferry_crossing_desc: "Những vấn đề khó khăn thường đòi hỏi giải pháp sáng tạo, và một bến phà là sự thay thế thích hợp cho cây cầu."
  tgp_harem_medical_treatment_modifier: "Chăm Sóc Hậu Cung"
  tgp_harem_medical_treatment_modifier_desc: "Những đóa hoa trong hậu cung mong manh không kém phần mỹ lệ, sức khỏe của họ cần được bảo vệ nghiêm ngặt chẳng kém gì sự trinh tiết."
  tgp_emperors_notice_modifier: "Lọt Vào Mắt Thiên Tử"
  tgp_emperors_notice_modifier_desc: "Nhân vật này, dù xuất thân thấp kém, đã được Thiên Tử chú ý giữa đám đông trong kỳ thi Đô Thành."
  tgp_harsh_cultivation_modifier: "Tu Luyện Khắc Nghiệt"
  tgp_harsh_cultivation_modifier_desc: "Sự cạnh tranh khốc liệt với các môn đồ khác của sư phụ tạo nên môi trường học tập khắc nghiệt, nhưng đổi lại là sự quan tâm dồi dào."
  tgp_strict_supervision_modifier: "Giám Sát Nghiêm Ngặt"
  tgp_strict_supervision_modifier_desc: "Muôn vàn ánh mắt ngước nhìn bầu trời. Rất ít được bầu trời nhìn lại. Và chỉ nhân vật này bị dõi theo với sự chú ý đặc biệt."
