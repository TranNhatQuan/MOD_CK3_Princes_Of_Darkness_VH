l_english:
  fp2_smooth_market_oversight_modifier:0 "Giám Sát Thị Trường Hiệu Quả"
  fp2_smooth_market_oversight_modifier_desc:0 "Sự cảnh giác của viên muḥtasib địa phương đang giúp các giao dịch diễn ra thuận lợi và đáng tin cậy."
  fp2_inefficient_market_oversight_modifier:0 "Giám Sát Thị Trường Kém Hiệu Quả"
  fp2_inefficient_market_oversight_modifier_desc:0 "Các muḥtasib địa phương không đủ khả năng giải quyết vấn đề tại chợ, khiến qāḍī bị quá tải."
  fp2_free_market_boom_modifier:0 "Thị Trường Tự Do Khỏi Hisba"
  fp2_free_market_boom_modifier_desc:0 "Các khu chợ của thị trấn này không tuân theo hisba và cũng không chịu sự giám sát của các muḥtasib."
  fp2_ruthless_market_oversight_modifier:0 "Giám Sát Thị Trường Tàn Nhẫn"
  fp2_ruthless_market_oversight_modifier_desc:0 "Các muḥtasib địa phương dựa vào binh lính để cưỡng chế ngay cả những quy định nhỏ nhất bằng vũ lực."
  fp2_forsaken_turned_levies_modifier:0 "Chủ Nghĩa Quân Phiệt Gia Tăng"
  fp2_forsaken_turned_levies_modifier_desc:0 "Các đội dân binh nông dân nhỏ đang hình thành để săn lùng các phe phản bội và giành được ân huệ của chủ nhân."
  fp2_veteran_mercenaries_as_instructors_modifier:0 "Thuê Lính Đánh Thuê Lão Luyện Làm Huấn Luyện Viên"
  fp2_veteran_mercenaries_as_instructors_modifier_desc:0 "Bá quốc này thuê các đội trưởng lính đánh thuê dạn dày trận mạc để huấn luyện quân địa phương."
  fp2_mercenary_acquaintances_modifier:0 "Quan Hệ Với Lính Đánh Thuê"
  fp2_mercenary_acquaintances_modifier_desc:0 "Nhân vật này quen biết nhiều cựu đội trưởng lính đánh thuê và đã học hỏi được nhiều điều từ họ."
  fp2_mercs_slaughtered_populance_modifier:0 "Lính Đánh Thuê Tàn Sát Dân Chúng"
  fp2_mercs_slaughtered_populance_modifier_desc:0 "Một toán binh lính vũ trang đã tàn phá vùng đất này, cướp sạch của cải và không để lại ai sống sót để kể lại."
  fp2_local_garrison_slaughtered_modifier:0 "Đồn Trú Địa Phương Bị Tiêu Diệt"
  fp2_local_garrison_slaughtered_modifier_desc:0 "Đồn trú địa phương của bá quốc này gần như bị tiêu diệt hoàn toàn, khiến khu vực không còn khả năng phòng thủ."
  fp2_elite_tactics_for_civil_guards_modifier:0 "Đồn Trú Địa Phương Dùng Chiến Thuật Tinh Nhuệ"
  fp2_elite_tactics_for_civil_guards_modifier_desc:0 "Quân lính thuộc đồn trú này là những người giữ gìn trật tự dày dạn kinh nghiệm, đủ khả năng tiến hành các biện pháp trấn áp đúng mực."
  fp2_mercs_turned_farmers_modifier:0 "Lính Đánh Thuê Trở Thành Nông Dân"
  fp2_mercs_turned_farmers_modifier_desc:0 "Một toán lính đánh thuê nguy hiểm đã đến vùng đất này để... làm nông. Tuy hiện tại hòa bình, nhưng họ có thể được triệu tập phục vụ cho lãnh chúa mới nếu cần."
  fp2_lenient_towards_foreign_merchants_modifier:0 "Khoan Dung Với Thương Nhân Ngoại Quốc"
  fp2_lenient_towards_foreign_merchants_modifier_desc:0 "Nhân vật này sẵn sàng nới lỏng sự bất khoan dung tôn giáo vì lợi ích thương mại, thu về giàu có lớn nhưng cũng chuốc lấy sự khinh miệt của đồng đạo."
  fp2_2001_promise_reminder:0 "Lời Hứa Giải Phóng"
  fp2_2001_promise_reminder_desc:1 "Nhân vật này đã đặt danh dự của mình vào việc giải phóng một ngôi làng đang lâm nguy trong vài năm tới."
  fp2_inexplicable_accounting_modifier:0 "Sổ Sách Bất Thường"
  fp2_inexplicable_accounting_modifier_desc:0 "Sổ sách của bá quốc này không khớp, vàng bạc bị thất thoát."
  fp2_improved_administrative_checks_modifier:0 "Tăng Cường Kiểm Tra Hành Chính"
  fp2_improved_administrative_checks_modifier_desc:0 "Bá quốc này có các biện pháp kiểm tra nghiêm ngặt để đảm bảo ngay cả gian lận kinh tế nhỏ nhất cũng bị chính quyền phát hiện."
  fp2_mozarab_quarter_modifier:0 "Khu Dân Cư Mozarab"
  fp2_mozarab_quarter_modifier_desc:0 "Các thành phố của bá quốc này có những khu riêng biệt dành cho người Mozarab."
  fp2_mozarab_church_modifier:0 "Chấp Nhận Người Mozarab"
  fp2_mozarab_church_modifier_desc:0 "Nhân vật này cho phép xây dựng các nhà thờ Mozarab trên lãnh thổ của mình."
  fp2_mozarab_rejected_modifier:0 "Phân Biệt Đối Xử Với Mozarab"
  fp2_mozarab_rejected_modifier_desc:0 "Nhân vật này không cho phép người Mozarab xây dựng nhà thờ trên lãnh thổ của mình."
  fp2_multifaith_county_modifier:0 "Khoan Dung Đa Tín Ngưỡng"
  fp2_multifaith_county_modifier_desc:0 "Nhân vật này đã thể hiện sự khoan dung đối với những người thuộc các đức tin khác trong lãnh thổ."
  fp2_religious_strife_modifier:0 "Xung Đột Tôn Giáo"
  fp2_religious_strife_modifier_desc:0 "Việc cải đạo cưỡng bức tại bá quốc này đã dẫn đến căng thẳng tôn giáo lan rộng."
  fp2_camino_santiago_ho_protected_modifier:0 "Được Dòng Tu Bảo Vệ"
  fp2_camino_santiago_ho_protected_modifier_desc:0 "Con đường đến Santiago đi qua bá quốc này được bảo vệ bởi một [holy_order|E]."
  fp2_camino_santiago_protected_modifier:0 "Thuê Lính Gác"
  fp2_camino_santiago_protected_modifier_desc:0 "Con đường đến Santiago đi qua bá quốc này được bảo vệ bởi các lính gác được thuê."
  fp2_horchata_colonialism_modifier:0 "Khai Thác Horchata"
  fp2_horchata_colonialism_modifier_desc:0 "Bá quốc này bị ép buộc chỉ sản xuất củ chufa để làm horchata."
  fp2_funded_agriculture_modifier:0 "Tài Trợ Nông Nghiệp"
  fp2_funded_agriculture_modifier_desc:0 "Bá quốc này đã được cung cấp nguồn lực cần thiết để mở rộng đất canh tác."
  fp2_vow_against_conscription_modifier:0 "Lời Thề Chống Tuyển Quân"
  fp2_vow_against_conscription_modifier_desc:0 "Bá quốc này được trao quyền từ chối các yêu cầu tổng động viên, cho phép họ tập trung vào các vấn đề dân sự."
  fp2_monument_to_war_modifier:0 "Đài Tưởng Niệm Chinh Phục"
  fp2_monument_to_war_modifier_desc:0 "Một đài tưởng niệm dành cho kẻ chinh phục vương quốc này tọa lạc trên đống đổ nát, xung quanh là những tòa nhà bị thiêu rụi."
  fp2_village_rebuiling_efforts_modifier:0 "Nỗ Lực Tái Thiết Làng Mạc"
  fp2_village_rebuiling_efforts_modifier_desc:0 "Bá quốc này đang cố gắng tái thiết sau một thảm họa lớn, lãnh chúa đã quyên góp tài nguyên cần thiết để đẩy nhanh quá trình."
  fp2_border_encampments_modifier:0 "Doanh Trại Ngoại Vi"
  fp2_border_encampments_modifier_desc:0 "Bá quốc này đầy rẫy lều trại và tiền đồn, nơi trú đóng các toán tuần tra nhỏ để bảo vệ những gì còn sót lại."
  fp2_scallop_shell_artifact:0 "Vỏ Sò Điệp"
  fp2_scallop_shell_artifact_desc:0 "Vỏ sò điệp này đánh dấu chủ nhân là người đã hoàn thành hành trình gian khổ trên con đường Camino de Santiago."
  fp2_fake_scallop_shell_artifact:0 "Vỏ Sò Điệp Giả"
  fp2_fake_scallop_shell_artifact_desc:0 "Một vỏ sò điệp thường thuộc về người đã hoàn thành cuộc hành hương đến Santiago. Tuy nhiên, chiếc này rõ ràng là đồ đánh cắp."
  fp2_malato_bark_artifact:0 "Vỏ Cây Malato"
  fp2_malato_bark_artifact_desc:0 "Một mảnh vỏ nhỏ lấy từ cây Malato nổi tiếng của xứ Basque."
  fp2_dismantling_verracos_modifier:0 "Tháo Dỡ Verracos"
  fp2_dismantling_verracos_modifier_desc:0 "Những bức tượng lợn rừng cổ đại rải rác khắp bá quốc này đang bị tháo dỡ để làm vật liệu xây dựng, khiến quan chức địa phương bất bình."
  fp2_saints_tombs_modifier:0 "Mộ Thánh Nhân"
  fp2_saints_tombs_modifier_desc:0 "Những bức tượng lợn rừng bằng đá rải rác khắp bá quốc này được cho là mộ của các thánh Kitô giáo."
  fp2_controls_the_mediterranean_house_modifier:1 "Bá Chủ Địa Trung Hải"
  fp2_controls_the_mediterranean_house_modifier_desc:0 "Gia tộc này nổi tiếng vì đã giành quyền kiểm soát Địa Trung Hải và dòng thương mại lưu thông qua đó."
  fp2_aragon_title_reward_house_modifier:0 "Những Người Sáng Lập Aragón"
  fp2_aragon_title_reward_house_modifier_desc:0 "Gia tộc này đã thành lập vương quốc Aragón trên vùng đất có địa hình khắc nghiệt và các chiến binh còn khắc nghiệt hơn."
  fp2_sponsored_golden_age_modifier:0 "Bảo Trợ Thời Kỳ Hoàng Kim"
  fp2_sponsored_golden_age_modifier_desc:0 "Nhân vật này đã bảo trợ cho thời kỳ hoàng kim tiếp theo của sự tiến bộ học thuật trong khu vực."
  fp2_part_of_golden_age_modifier:0 "Hiện Diện Trong Thời Kỳ Hoàng Kim"
  fp2_part_of_golden_age_modifier_desc:0 "Nhân vật này đã sống trong thời điểm bắt đầu của một thời kỳ hoàng kim về học thuật."
  fp2_epicenter_of_golden_age_modifier:0 "Trung Tâm Thời Kỳ Hoàng Kim"
  fp2_epicenter_of_golden_age_modifier_desc:0 "Địa điểm này là trung tâm tri thức, nơi những bộ óc vĩ đại nhất của thời kỳ hoàng kim cư trú và làm việc."
  fp2_translated_skill_book_diplomacy_modifier:0 "Ghi Chú Ngoại Giao Cổ Đại"
  fp2_translated_skill_book_diplomacy_modifier_desc:0 "Nhân vật này đã dịch các bản sao của những ghi chép cổ xưa, trình bày cách xử lý vô số tình huống ngoại giao."
  fp2_translated_skill_book_martial_modifier:0 "Sách Lịch Sử Quân Sự"
  fp2_translated_skill_book_martial_modifier_desc:0 "Nhân vật này đã đọc nhiều sách lịch sử quân sự, học được các chiến thuật và mưu lược của người xưa."
  fp2_translated_skill_book_stewardship_modifier:0 "Sách Lý Thuyết Kinh Tế"
  fp2_translated_skill_book_stewardship_modifier_desc:0 "Nhân vật này sở hữu nhiều sách lý giải cách các đế chế cổ đại quản lý và tổ chức để duy trì nền kinh tế khổng lồ."
  fp2_translated_skill_book_intrigue_modifier:0 "Những Câu Chuyện Âm Mưu"
  fp2_translated_skill_book_intrigue_modifier_desc:0 "Nhân vật này có nhiều sách viết về mưu mô, mang lại cho họ vô số ý tưởng sáng tạo cho các kế hoạch."
  fp2_translated_skill_book_learning_modifier:0 "Tác Phẩm Triết Học Đã Dịch"
  fp2_translated_skill_book_learning_modifier_desc:0 "Nhân vật này đã cho dịch các tác phẩm triết học cổ đại, cho phép họ đạt được mức độ hiểu biết cao hơn."
  fp2_rejection_of_old_thoughts_modifier:0 "Bác Bỏ Tư Tưởng Cũ"
  fp2_rejection_of_old_thoughts_modifier_desc:0 "Bá quốc này thu hút những nhà tư tưởng bác bỏ việc học hỏi từ quá khứ; nhiều ý tưởng mới sẽ nảy nở nhưng không ý tưởng nào tồn tại lâu dài."
  fp2_removed_cataracts_modifier:0 "Loại Bỏ Đục Thủy Tinh Thể Thành Công"
  fp2_removed_cataracts_modifier_desc:0 "Nhân vật này đã được chữa khỏi chứng đục thủy tinh thể, từ gần như mù lòa nay có thể nhận biết các mảng màu và hình dạng mờ."
  fp2_religious_riots_modifier:0 "Bạo Loạn Tôn Giáo Hoành Hành"
  fp2_religious_riots_modifier_desc:0 "Xung đột tôn giáo đang xé nát đường phố các khu định cư lớn của bá quốc này."
  fp2_religious_riots_suppressed_modifier:0 "Bạo Loạn Tôn Giáo Bị Đàn Áp"
  fp2_religious_riots_suppressed_modifier_desc:0 "Dù vẫn âm ỉ, xung đột tôn giáo tại bá quốc này đã bị trấn áp một cách tàn bạo."
  fp2_religious_riots_defused_modifier:0 "Ngăn Chặn Bạo Loạn Tôn Giáo"
  fp2_religious_riots_defused_modifier_desc:0 "Một số người vẫn bất mãn, nhưng xung đột tôn giáo gần đây đã được ngăn chặn tại bá quốc này."
  fp2_pilgrim_roads_modifier:0 "Đường Hành Hương"
  fp2_pilgrim_roads_modifier_desc:0 "Bá quốc này có mạng lưới đường sá rộng lớn để dẫn lối cho các tín đồ hành hương đến thánh địa."
  fp2_trusted_by_pilgrim_warriors_modifier:0 "Được Các Chiến Binh Thánh Tín Nhiệm"
  fp2_trusted_by_pilgrim_warriors_modifier_desc:0 "Nhân vật này nổi tiếng vì đối xử tốt với các chiến binh của đức tin, và đổi lại họ dành cho nhân vật này sự ưu ái."
  fp2_kept_accused_traitor_in_court_modifier:0 "Lời Thì Thầm Về Sự Yếu Đuối"
  fp2_kept_accused_traitor_in_court_modifier_desc:0 "Một hành động của nhân vật này đã làm dấy lên đủ loại lời đồn ác ý về họ."
  fp2_kept_op_knight_in_court_modifier:0 "Chiến Binh U Ám"
  fp2_kept_op_knight_in_court_modifier_desc:0 "Các hiệp sĩ dưới quyền nhân vật này đang chán nản vì cái bóng của một chiến binh vượt trội."
  fp2_kept_upstart_knight_in_court_modifier:0 "Hiệp Sĩ Trẻ Nổi"
  fp2_kept_upstart_knight_in_court_modifier_desc:0 "Giới quý tộc đang âm mưu chống lại nhân vật này để đảm bảo không còn chiến binh trẻ nổi nào xuất hiện tại triều đình."
  fp2_kept_godless_mercenary_in_court_modifier:0 "Lính Đánh Thuê Tim Đen"
  fp2_kept_godless_mercenary_in_court_modifier_desc:0 "Những ảnh hưởng bên ngoài đã khiến tất cả hiệp sĩ được nhân vật này thuê mang tiếng xấu là những chiến binh vô đạo, chiến đấu chỉ vì lòng tham."
