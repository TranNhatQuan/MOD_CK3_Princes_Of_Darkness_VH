 pilgrimage_perfect_worldly_reward_modifier:0 "Người Hành Hương Văn Minh"
 pilgrimage_perfect_worldly_reward_modifier_desc:0 "Nhân vật này vô cùng cởi mở với các nền văn hóa và cách thể hiện khác nhau."
 pilgrimage_high_worldly_reward_modifier:0 "Người Hành Hương Vị Tha"
 pilgrimage_high_worldly_reward_modifier_desc:0 "Nhân vật này rất cởi mở với các nền văn hóa và cách thể hiện khác nhau."
 pilgrimage_mid_worldly_reward_modifier:0 "Người Hành Hương Hiếu Kỳ"
 pilgrimage_mid_worldly_reward_modifier_desc:0 "Nhân vật này chấp nhận các nền văn hóa và cách thể hiện khác nhau."
 pilgrimage_low_worldly_reward_modifier:0 "Người Hành Hương Khép Kín"
