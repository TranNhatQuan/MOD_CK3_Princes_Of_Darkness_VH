 pilgrimage_accepting_modifier:0 "Chấp Nhận"
 pilgrimage_accepting_modifier_desc:0 "Nhân vật này đã chấp nhận đi theo lộ trình phong cảnh trong chuyến hành hương."

 keen_eye_modifier:0 "Con Mắt Tinh Tường"
 keen_eye_modifier_desc:0 "Nhân vật này có thể nhận ra các thánh tích giả."

 pilgrimage_combat_omen_modifier:0 "Điềm Báo Chiến Trận"
 pilgrimage_combat_omen_modifier_desc:0 "Gần đây nhân vật này đạt nhiều chiến công quân sự hơn sau khi chứng kiến một điềm báo."

 pilgrimage_watchful_omen_modifier:0 "Điềm Báo Cảnh Giác"
 pilgrimage_watchful_omen_modifier_desc:0 "Nhân vật này trở nên thận trọng hơn sau khi chứng kiến một điềm báo."

 pilgrimage_hostile_omen_modifier:0 "Điềm Báo Báo Thù"
 pilgrimage_hostile_omen_modifier_desc:0 "Nhân vật này đã trải qua một điều mà họ tin là dấu hiệu kẻ thù sẽ sụp đổ."

 pilgrimage_failure_omen_modifier:0 "Điềm Xấu"
 pilgrimage_failure_omen_modifier_desc:0 "Nhân vật này tin rằng sự đau khổ của mình đã được định sẵn."

 pilgrimage_horny_omen_modifier:0 "Điềm Sinh Sôi"
 pilgrimage_horny_omen_modifier_desc:0 "Nhân vật này tin rằng họ sẽ sớm có con."

 pilgrimage_family_omen_modifier:0 "Điềm Gia Đình"
 pilgrimage_family_omen_modifier_desc:0 "Nhân vật này gần đây đã dành nhiều thời gian hơn cho gia đình sau khi trải qua một điềm báo."

 determination_modifier:0 "Quyết Tâm"
 determination_modifier_desc:0 "Nhân vật này đã suy ngẫm về cái chết và được lấp đầy bởi quyết tâm!"

 determined_to_live_modifier:0 "Quyết Tâm Sống"
 determined_to_live_modifier_desc:0 "Nhân vật này đã suy ngẫm về cái chết và được lấp đầy bởi ý chí mãnh liệt để tiếp tục sống!"

 imperial_contemplation_modifier:0 "Chiêm Nghiệm Đế Chế"
 imperial_contemplation_modifier_desc:0 "Nhân vật này gần đây đã suy ngẫm về tính phù du của những đế chế vĩ đại trong lịch sử."

 contemplated_ancient_gods_modifier:0 "Chiêm Nghiệm Thần Linh"
 contemplated_ancient_gods_modifier_desc:0 "Nhân vật này gần đây đã suy ngẫm về tín ngưỡng của các nền văn minh cổ đại và bản chất sự thờ phụng của con người đối với thần thánh."

 pilgrimage_touched_divine_modifier:0 "Chạm Vào Lửa Thiêng"
 pilgrimage_touched_divine_modifier_desc:0 "Nhân vật này đã trèo lên cột buồm trong một cơn bão dữ và chạm vào ngọn lửa thiêng."

 pilgrim_group_joined_modifier:0 "Đoàn Hành Hương"
 pilgrim_group_joined_modifier_desc:0 "Nhân vật này đã hỗ trợ một nhóm hành hương nông dân trên đường đến thánh địa."

  pilgrimage_temple_architect_modifier:0 "Cảm Hứng Đền Đài"
  pilgrimage_temple_architect_modifier_desc:0 "Nhân vật này đã chiêm ngưỡng các ngôi đền bên ngoài lãnh thổ của mình trong chuyến hành hương."

  pilgrimage_forgiving_modifier:0 "Khoan Dung"
  pilgrimage_forgiving_modifier_desc:0 "Nhân vật này được đồn rằng có bản tính khoan dung."

  pilgrimage_exotic_wares_modifier:0 "Hàng Hóa Ngoại Lai"
  pilgrimage_exotic_wares_modifier_desc:0 "Nhân vật này đang mang theo các món hàng ngoại lai có thể bán lại khi trở về quê nhà."

  pilgrimage_super_exotic_wares_modifier:0 "Hàng Hóa Ngoại Lai Đặc Biệt"
  pilgrimage_super_exotic_wares_modifier_desc:0 "Nhân vật này đang mang theo những món hàng ngoại lai đặc biệt hiếm lạ, có thể bán lại khi trở về quê nhà."

  local_expert_modifier:0 "Thông Thạo Địa Phương"
  local_expert_modifier_desc:0 "Nhân vật này đã làm mới kiến thức địa lý của mình sau khi lật giở một cuốn cẩm nang."
  pilgrim_guide_modifier:0 "$local_expert_modifier$"

  architectural_interest_modifier:0 "Quan Tâm Kiến Trúc"
  architectural_interest_modifier_desc:0 "Nhân vật này đã thể hiện sự quan tâm đến kiến trúc thế tục."

  pilgrimage_burial_at_destination_modifier:0 "An Nghỉ Thiêng Liêng"
  pilgrimage_burial_at_destination_modifier_desc:0 "Nhân vật này đang mang theo hài cốt của người tiền nhiệm để an táng tại thánh địa đích đến."

  pilgrimage_burial_at_capital_modifier:0 "An Nghỉ Tại Kinh Đô"
  pilgrimage_burial_at_capital_modifier_desc:0 "Nhân vật này đang mang theo hài cốt của người tiền nhiệm để an táng khi trở về quê nhà."

  pilgrimage_turned_back_buried_modifier:0 "An Táng Nhanh Chóng"
  pilgrimage_turned_back_buried_modifier_desc:0 "Nhân vật này đã ưu tiên việc an táng hài cốt của người tiền nhiệm tại quê nhà."

  pilgrimage_buried_at_destination_modifier:0 "Nơi An Nghỉ Thiêng Liêng"
  pilgrimage_buried_at_destination_modifier_desc:0 "Nhân vật này đã an táng hài cốt của người tiền nhiệm tại một thánh địa."

  pilgrimage_buried_at_capital_modifier:0 "An Nghỉ Của Người Hành Hương"
  pilgrimage_buried_at_capital_modifier_desc:0 "Nhân vật này đã hoàn thành chuyến hành hương đang dở dang trước khi an táng hài cốt của người tiền nhiệm."

  hajj_hygienic_modifier:0 "Giữ Gìn Vệ Sinh"
  hajj_hygienic_modifier_desc:0 "Nhân vật này đã tránh việc tiếp xúc dịch thể với đám đông trong thời gian Hajj."

  hajj_prophet_like_modifier:0 "Theo Gương Nhà Tiên Tri"
  hajj_prophet_like_modifier_desc:0 "Nhân vật này đã thực hiện một lễ hiến tế tôn giáo lớn lao theo tinh thần của Nhà Tiên Tri trong Hajj."

  hajj_camel_knowledge_modifier:0 "Hiến Tế Lạc Đà"
  hajj_camel_knowledge_modifier_desc:0 "Nhân vật này đã hiến tế một con lạc đà trong Hajj."
 
  hajj_pushed_the_marwah_modifier:0 "Marwah Mãnh Liệt"
  hajj_pushed_the_marwah_modifier_desc:0 "Nhân vật này đã dốc hết sức khi chạy giữa Safa và Marwah trong Hajj."

  hajj_skimp_on_safa_modifier:0 "Safa Thư Thả"
  hajj_skimp_on_safa_modifier_desc:0 "Nhân vật này đã điềm tĩnh và thong thả khi chạy giữa Safa và Marwah trong Hajj."

  hajj_caught_on_safa_modifier:0 "Lười Biếng Ở Safa"
  hajj_caught_on_safa_modifier_desc:0 "Nhân vật này đã bị phát hiện là quá thong thả khi chạy giữa Safa và Marwah trong Hajj."

  hajj_prayer_wealth_modifier:0 "Hướng Đến Tài Phú"
  hajj_prayer_wealth_modifier_desc:0 "Nhân vật này đã nhận được cảm hứng thiêng liêng và tập trung vào của cải."

  hajj_prayer_prestige_modifier:0 "Hướng Đến Danh Vọng"
  hajj_prayer_prestige_modifier_desc:0 "Nhân vật này đã nhận được cảm hứng thiêng liêng và tập trung vào uy danh."

  hajj_prayer_opinion_modifier:0 "Hướng Đến Thiện Cảm"
  hajj_prayer_opinion_modifier_desc:0 "Nhân vật này đã nhận được cảm hứng thiêng liêng và tập trung vào sự được yêu mến."

  ghost_pilgrimage_promised_modifier:0 "Bị Linh Hồn Ảnh Hưởng"
  ghost_pilgrimage_promised_modifier_desc:0 "$pilgrimage_promised_modifier_desc$"

  hajj_promised_modifier:0 "Hứa Nguyện Hajj"
  hajj_promised_modifier_desc:0 "Chuyến Hajj tiếp theo của nhân vật này sẽ tốn ít chi phí hơn."

  pilgrimage_promised_modifier:0 "Hứa Nguyện Hành Hương"
  pilgrimage_promised_modifier_desc:0 "Chuyến hành hương tiếp theo của nhân vật này sẽ tốn ít chi phí hơn."

  pilgrimage_herbalist_modifier:0 "Thầy Thuốc Hành Hương"
  pilgrimage_herbalist_modifier_desc:0 "Nhân vật này đã hỗ trợ một người hành hương khác bằng kiến thức thảo dược."

  pilgrimage_chill_ship_modifier:0 "Thời Gian Thư Giãn"
  pilgrimage_chill_ship_modifier_desc:0 "Nhân vật này đã có khoảng thời gian thư giãn trên biển."

  pilgrim_protection_modifier:0 "Bảo Vệ Người Hành Hương"
  pilgrim_protection_modifier_desc:0 "Đoàn hành hương này đã thuê thêm sự bảo vệ từ các tay mạnh địa phương."

  pilgrimage_seduction_modifier: "Dòng Nước Quyến Rũ"
  pilgrimage_seduction_modifier_desc: "Nhân vật này đã từ bỏ [Glossary('Brahmacharya', 'BRAHMACHARAYA_GLOSS')] trong chuyến hành hương. Buông mình theo dục vọng, sự ham muốn của họ càng bùng cháy khi được dòng nước lấp lánh nơi họ dừng lại tắm rửa khơi dậy."

  pilgrimage_conversion_modifier: "Kalama Sutta"
  pilgrimage_conversion_modifier_desc: "Trong chuyến hành hương, nhân vật này đã củng cố lý trí của những kẻ đang hoang mang, tin chắc rằng theo thời gian họ sẽ đón nhận [GetReligionByKey('buddhism_religion').GetName]."

  buddhist_teachings_conversion_modifier: "Giáo Huấn Phật Giáo"
  buddhist_teachings_conversion_modifier_desc: "Dân cư của hạt này sẽ dễ dàng cải đạo sang các đức tin Phật giáo hơn.\n\n$EFFECT_LIST_BULLET$[convert_county|E] sang [GetReligionByKey('buddhism_religion').GetName]: #P +100%#!"

  light_in_shadow_modifier: "Ánh Sáng Trong Bóng Tối"
  light_in_shadow_modifier_desc: "Trong chuyến hành hương, nhân vật này đã nhận ra sự tương đồng giữa kẻ trộm và những giáo sĩ sa đọa. Họ thề sẽ soi rọi bóng tối, không cho bọn gian ác nơi nào để ẩn náu."
 
  spymaster_eyes_modifier: "Ta Đã Mở Mắt"
  spymaster_eyes_modifier_desc: "Trong chuyến hành hương, nhân vật này đã nhận ra sự tương đồng giữa kẻ trộm và những giáo sĩ sa đọa. Họ đã chỉ thị cho trưởng gián điệp phải cảnh giác với những kẻ như vậy.\n\n$EFFECT_LIST_BULLET$[GetCouncilTaskType('task_find_secrets').GetName|V] [councillor_task|E]:\n$TAB$#P +10%#! cơ hội bổ sung để phát hiện một [secret|E]"
