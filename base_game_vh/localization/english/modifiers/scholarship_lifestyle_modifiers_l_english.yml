l_english:
  scholarship_bird_automaton_modifier:0 "Tự động điểu máy"
  scholarship_bird_automaton_modifier_desc:0 "Nhân vật này sở hữu một con chim máy kỳ diệu, hót vang như thể có sự sống."
  scholarship_bird_dissection_modifier:0 "Nghiên cứu chim máy"
  scholarship_bird_dissection_modifier_desc:0 "Nhân vật này đang nghiên cứu cấu trúc bên trong của những cỗ máy phức tạp."
  book_translation_excellent_modifier:0 "Dịch giả xuất sắc"
  book_translation_excellent_modifier_desc:0 "Nhân vật này đã biên soạn một bản dịch được đánh giá cao của một tác phẩm kinh điển."
  book_translation_mediocre_modifier:0 "Dịch giả tập sự"
  book_translation_mediocre_modifier_desc:0 "Nhân vật này đã biên soạn một bản dịch của một tác phẩm kinh điển."
  terrified_courtiers_modifier:0 "Cận thần khiếp sợ"
  terrified_courtiers_modifier_desc:0 "Các cận thần của nhân vật này bị uy hiếp bởi kỷ luật hà khắc của họ."
  book_translation_ongoing_modifier:0 "Đang dịch sách"
  book_translation_ongoing_modifier_desc:0 "Nhân vật này hiện đang dịch một cuốn sách."
  scholarship_astrological_insights_modifier:0 "Thấu hiểu thiên giới"
  scholarship_astrological_insights_modifier_desc:0 "Nhân vật này hiểu biết sâu sắc về sự vận động của bầu trời."
  scholarship_down_to_earth_modifier:0 "Tập trung trần thế"
  scholarship_down_to_earth_modifier_desc:0 "Nhân vật này tập trung vào các vấn đề trần thế, trong khi giáo sĩ lo liệu những chuyện siêu nhiên."
  logical_thinking_modifier:0 "Tư duy logic"
  logical_thinking_modifier_desc:0 "Nhân vật này biết cách sử dụng logic để tiết kiệm thời gian khi nghiên cứu."
  chronic_headaches_modifier:0 "Đau đầu mãn tính"
  chronic_headaches_modifier_desc:0 "Nhân vật này mắc chứng đau đầu mãn tính, gây cáu kỉnh."
  rich_fertilizer_modifier:0 "Phân bón dồi dào"
  rich_fertilizer_modifier_desc:0 "Các nông trại của quận hạt này đã được bón phân rất tốt trong năm nay."
  tomb_defiler_modifier:0 "Kẻ báng bổ mồ mả"
  tomb_defiler_modifier_desc:0 "Những lời đồn rùng rợn nhất đang bao quanh vị cai trị của vùng đất này."
  wide_vocabulary_modifier:0 "Vốn từ phong phú"
  exercise_modifier:0 "Tập luyện"

  introspective_rest_modifier:0 "Nghỉ ngơi chiêm nghiệm"
  introspective_rest_modifier_desc:0 "Nhân vật này có thói quen tự giam mình lại và giao cảm với thần linh — tuyệt đối không cho phép bị quấy rầy!"

  theology_dangerous_habits_modifier:0 "Thói quen nguy hiểm"
  theology_dangerous_habits_modifier_desc:0 "Cuộc truy cầu các “khải tượng” của nhân vật này đang khiến họ suy kiệt."

  mystic_suspicious_reputation_modifier:0 "Danh tiếng đáng ngờ"
  mystic_suspicious_reputation_modifier_desc:0 "Nhân vật này đang làm… #EMP điều gì đó#! sau những cánh cửa khóa kín."

  mystic_great_openness_modifier:0 "Cởi mở lớn lao"
  mystic_great_openness_modifier_desc:0 "Nhân vật này đang nỗ lực để mở lòng và cho phép người khác bước vào."

  mystic_dangerous_to_know_modifier:0 "Nguy hiểm khi tiếp cận"
  mystic_dangerous_to_know_modifier_desc:0 "Nhân vật này đang dính líu tới những điều kỳ lạ và khác thường. Ai cũng biết rằng chọc giận họ sẽ phải gánh chịu hậu quả nghiêm trọng. Có lẽ vậy."

  mystic_devout_protector_modifier:0 "Hộ vệ mộ đạo"
  mystic_devout_protector_modifier_desc:0 "Nhân vật này đã công khai tuyên bố sự tận tâm của mình đối với an toàn và phúc lợi của người khác."

  divine_guidance_modifier:0 "Sự dẫn dắt thiêng liêng"
  divine_guidance_modifier_desc:0 "Những tiếng nói từ cõi bên kia trợ giúp nhân vật này. Ít nhất thì họ giải thích như vậy."

  court_of_poetry_modifier:0 "Triều đình thi ca"
  court_of_poetry_modifier_desc:0 "Đại sảnh của nhân vật này vang vọng những lời lẽ tinh tế — bầu không khí tràn ngập các mỹ từ hoa mỹ."

  beauty_of_language_modifier:0 "Vẻ đẹp ngôn từ"
  beauty_of_language_modifier_desc:0 "Nhân vật này đã tìm thấy niềm vui vô tận trong bí ẩn thanh nhã của ngôn từ: một đam mê cần được sẻ chia."

  welcoming_inclusivist_modifier:0 "Người bao dung cởi mở"
  welcoming_inclusivist_modifier_desc:0 "Nhân vật này tin tưởng vững chắc rằng sự khác biệt bổ trợ cho nhau, và điểm yếu nằm ở sự đồng nhất mù quáng."

  consorting_with_muslims_modifier:0 "Giao du với người Hồi giáo"
  consorting_with_muslims_modifier_desc:0 "Nhân vật này được biết là có qua lại với dị giáo."

  rebuked_the_heathen_modifier:0 "Khiển trách dị giáo"
  rebuked_the_heathen_modifier_desc:0 "Nhân vật này không dung thứ cho dị giáo, tà thuyết, kẻ bỏ đạo và những kẻ có phẩm chất #EMP đáng khinh#! khác."

  refused_heathen_knowledge_modifier:0 "Khước từ tri thức dị giáo"
  refused_heathen_knowledge_modifier_desc:0 "Nhân vật này thích những cuốn sách mang tính mộ đạo và thuần khiết."
