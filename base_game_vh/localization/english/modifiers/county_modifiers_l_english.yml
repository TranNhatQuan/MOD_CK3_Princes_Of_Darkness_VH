  county_increased_presence_modifier:0 "Tăng Cường Hiện Diện"
  county_increased_presence_modifier_desc:0 "Hạt này có sự hiện diện gia tăng của các quan chức bạo lực"
  county_confident_in_humanity_modifier:0 "Tin Tưởng Vào Nhân Tính Của Lãnh Chúa"
  county_superstitious_of_ruler_modifier:0 "Mê Tín Về Người Cai Trị"
  county_chastised_beloved_adventurer_modifier_desc:0 "Một món đồ nội thất được yêu thích tại quán rượu địa phương — nhà phiêu lưu phần lớn chẳng mấy truyền cảm hứng — đã bị một người cai trị không tán thành cho dỡ bỏ"
 
  harassing_merchants_modifier:0 "Quấy Rối Thương Nhân"
  opulent_pigsty_modifier:0 "Chuồng Heo Xa Hoa"

  hold_court_cropsharing:0 "Chia Sẻ Mùa Màng"
  hold_court_cropsharing_desc:0 "Tình trạng thiếu hụt do bệnh dịch cây trồng đã được giảm nhẹ tại Hạt này nhờ các làng địa phương chia sẻ vụ thu hoạch."
  hold_court_free_labor:0 "Lao Động Miễn Phí"
  hold_court_free_labor_desc:0 "Những người lao động tại Hạt này đáp lại lòng hào phóng của lãnh chúa bằng mồ hôi và sức lực."
  hold_court_ploughs_to_swords:0 "Từ Cày Sang Gươm"
  hold_court_ploughs_to_swords_desc:0 "Những nông trại tại Hạt này bị bỏ hoang; tá điền nhập ngũ chiến đấu thay vì gieo trồng."

  promote_culture_modifier:0 "Văn Hóa Được Tôn Vinh"

  small_investment_in_revolt_modifier:0 "Nông Dân Phẫn Nộ"
  small_investment_in_revolt_modifier_desc: "[county_corruption|E]\nNông dân đang lên tiếng bày tỏ lo ngại dưới ảnh hưởng ngoại bang tại Hạt này"
  medium_investment_in_revolt_modifier:0 "Nông Dân Tức Giận"
  medium_investment_in_revolt_modifier_desc: "[county_corruption|E]\nNông dân bị kích động bởi các thế lực ngoại bang và từ chối lao động tại Hạt này"
  high_investment_in_revolt_modifier:0 "Bạo Loạn Nông Dân"
  high_investment_in_revolt_modifier_desc: "[county_corruption|E]\nNông dân bị tuyên truyền ngoại bang xúi giục nổi loạn khắp Hạt này, "
  divide_and_conquer_modifier:0 "Tuyên Truyền Tôn Giáo"
  divide_and_conquer_modifier_desc:0 "Dân địa phương của Hạt này đã bị tuyên truyền tôn giáo tác động, tập hợp họ dưới ngọn cờ của lãnh chúa."

  debug_max_popular_opinion_modifier: "$send_friendliness$"
  debug_max_popular_opinion_modifier_desc: "$debug_generic_option$"
  debug_min_popular_opinion_modifier: "$debug_make_dislike_me_interaction$"
  debug_min_popular_opinion_modifier_desc: "$debug_generic_option$"

  lost_holy_order_modifier:0 "Mất Dòng Tu Thánh"
  lost_holy_order_modifier_desc:0 "Sự bất mãn gia tăng do việc giải thể Dòng Tu Thánh từng kiểm soát vùng đất này."

  helped_construct_makeshift_temple:0 "Đền Thờ Tạm"
  helped_construct_makeshift_desc:0 "Một ngôi đền tạm đã được xây dựng tại đây để người dân có nơi cầu nguyện."

  cared_for_war_widow:0 "Chăm Sóc Quả Phụ Chiến Tranh"
  cared_for_war_widow_desc:0 "Một quả phụ chiến tranh tại Hạt này đã được chính quyền trực tiếp chăm sóc"
  ignored_war_widow:0 "Bỏ Mặc Quả Phụ Chiến Tranh"
  ignored_war_widow_desc:0 "Một quả phụ chiến tranh tại Hạt này đã bị khinh thường và bỏ mặc."

  entertained_peasants:0 "Giải Trí Cho Nông Dân"
  entertained_peasants_desc:0 "Nông dân trong Hạt này đã được giải trí trong chuyến vi hành."

  scared_peasants:0 "Nông Dân Khiếp Sợ"
  scared_peasants_desc:0 "Nông dân trong Hạt này đã bị làm cho khiếp sợ trong chuyến vi hành."

  ugly_statue:0 "Tượng Xấu Xí"
  ugly_statue_desc:0 "Hạt này có một bức tượng xấu xí được dựng lên."

  accurate_statue:0 "Tượng Chân Thực"
  accurate_statue_desc:0 "Hạt này có một bức tượng của một người cai trị đáng kính được dựng lên. Dù bị nhiều người coi là xấu, người cai trị lại cho rằng đó là hình ảnh chân thực của mình."

  destroyed_statue:0 "Tượng Bị Phá Hủy"
  destroyed_statue_desc:0 "Hạt này có một bức tượng đã bị phá hủy."

  released_criminal:0 "Thả Tội Phạm"
  released_criminal_desc:0 "Một tội phạm đã được thả tại Hạt này, trái với mong muốn của dân địa phương."

  martially_inspired:0 "Được Truyền Cảm Hứng Quân Sự"
  martially_inspired_desc:0 "Nông dân trong Hạt này đã được truyền cảm hứng về quân sự."

  inspired_by_tales:0 "Được Truyền Cảm Hứng Từ Truyền Thuyết"
  inspired_by_tales_desc:0 "Nông dân trong Hạt này đã được truyền cảm hứng từ những câu chuyện anh hùng ca."

  desecrated_local_saint_modifier:0 "Xúc Phạm Mộ Thánh"
  desecrated_local_saint_modifier_desc:0 "Việc bác bỏ một vị thánh ngoài giáo luật đã khiến nhân vật này vừa nhận được sự ủng hộ lẫn oán giận."
  patronized_local_saint_modifier:0 "Bảo Trợ Thánh Địa Phương"
  patronized_local_saint_modifier_desc:0 "Sự khoan dung với một vị thánh ngoài giáo luật đã khiến nhân vật này vừa nhận được sự ủng hộ lẫn oán giận."
  local_saint_modifier:0 "Thánh Địa Phương"
  local_saint_modifier_desc:0 "Việc bảo trợ một vị thánh địa phương, không được giáo sĩ cấp cao công nhận, đã dần trở nên phổ biến tại Hạt này."
 
  super_sleuth_modifier:0 "Kẻ Lật Tung Mọi Viên Đá"
  super_sleuth_modifier_desc:0 "Nhân vật này sẽ không dừng lại trước bất cứ điều gì để tìm ra sự thật và thực thi công lý."
  celebrity_executioner_modifier:0 "Đao Phủ Nổi Tiếng"
  celebrity_executioner_modifier_desc:0 "Người dân trong Hạt này đã chứng kiến một cuộc hành quyết mà họ sẽ còn nhắc tới trong nhiều năm."

  hamlet_bandit_modifier:0 "Khắc Tinh Thổ Phỉ"
  hamlet_bandit_modifier_desc:0 "Nhân vật này đã đích thân quét sạch bọn thổ phỉ đào ngũ đang quấy nhiễu dân thường."
  hamlet_bandit_remains_modifier:0 "Thổ Phỉ Hoành Hành"
  hamlet_bandit_remains_modifier_desc:0 "Hạt này đã bị tàn phá bởi các nhóm thổ phỉ đào ngũ không bị kiểm soát."

  optimized_weighting_sucess:0 "Tối Ưu Hóa Cân Đo Thị Trường"
  optimized_weighting_sucess_desc:0 "Tại Hạt này, thương nhân phải nộp thuế cao hơn một chút, phần lớn mà không hề nhận ra."
  optimized_weighting_failure:0 "Bị Phát Hiện Gian Lận Cân Đo"
  optimized_weighting_failure_desc:0 "Thương nhân có xu hướng tránh Hạt này do hệ thống cân đo không công bằng."
  new_weighting_system:0 "Hệ Thống Cân Đo Mới"
  new_weighting_system_desc:0 "Hạt này được hưởng lợi từ một hệ thống cân đo mới, ưu việt hơn."

  innkeeper_bad_result: "Quán Trọ Hôi Hám"
  innkeeper_bad_result_desc: "Có một quán trọ trong khu vực này kiếm được lợi nhuận khá, nhưng lại thu hút những kẻ bất mãn."
  innkeeper_average_result: "Quán Trọ Tầm Thường"
  innkeeper_average_result_desc: "Có một quán trọ trong khu vực này giúp dân chúng giải trí — dù không hẳn là vui vẻ."
  innkeeper_good_result: "Quán Trọ Xa Hoa"
  innkeeper_good_result_desc: "Có một quán trọ trong khu vực này khiến tinh thần dân chúng luôn phấn chấn."
 
