l_english:
  held_hunt_modifier:0 "Vừa Tổ Chức Săn Bắn"
  held_hunt_modifier_desc:0 "Nhân vật này gần đây đã tổ chức một cuộc săn, và sẽ không thể làm lại cho đến ngày được chỉ định."
 
  hunt_punished_locals_modifier:0 "Trừng Phạt Kẻ Săn Trộm"
  hunt_punished_locals_modifier_desc:1 "Người dân trong Hạt này đang phải gánh chịu hậu quả để bù đắp cho hành vi săn trộm trong rừng.\n#weak $hunt_modifier_success_slightly_improved_location_tt$#!\n"
 
  hunt_poacher_training_modifier:0 "Huấn Luyện Săn Trộm"
  hunt_poacher_training_modifier_desc:0 "Nhân vật này đã được các thợ săn trộm huấn luyện kỹ năng săn bắn."
 
  hunt_upset_hunting_county_modifier:0 "Phẫn Nộ Vì Săn Trộm"
  hunt_upset_hunting_county_modifier_desc:0 "Hạt này phẫn nộ vì bị đối xử khắc nghiệt do hành động của một nhóm nhỏ thợ săn trộm."

  modifier_hunt_hunting_trophy:0 "Chiến Lợi Phẩm Săn Bắn"
  modifier_hunt_hunting_trophy_desc:0 "Một chiến lợi phẩm săn bắn đầy ấn tượng được treo trong đại sảnh của nhân vật này, phô bày những thành tựu của họ."
 
  modifier_hunt_friend_of_animal:0 " Bạn củaMuông Thú"
  modifier_hunt_friend_of_animal_desc:0 "Nhân vật này có khả năng đặc biệt trong việc xử lý và thuần phục động vật."
 
  hunt_guide_local_madman_modifier:0 "Hướng Dẫn Viên Địa Phương"
  hunt_guide_local_madman_modifier_desc:2 "Nhân vật này đã được chủ nhân của vùng đầm lầy dẫn đường trong một chuyến săn.\n#weak $hunt_modifier_success_slightly_improved_location_tt$#!\n"
  hunt_guide_local_madman_modifier_custom_desc:0 "Nhân vật này đã được chủ nhân của vùng đầm lầy dẫn đường trong một chuyến săn.\n#weak Trong khi hiệu ứng này còn tồn tại, [hunt_success_chance|E] của Ngài sẽ được #positive_value tăng nhẹ#! tại [SCOPE.sTitle('activity_place').GetNameNoTier]#!\n"

  hunt_killed_local_madman_modifier:1 "Giết Người Địa Phương"
  hunt_killed_local_madman_modifier_desc:0 "Một cư dân đầm lầy nổi tiếng của hạt này đã bị một thợ săn quá khích giết chết."
 
  hunt_talked_to_madman_modifier:1 "Lắng Nghe Mối Lo Của Dân Địa Phương"
  hunt_talked_to_madman_modifier_desc:0 "Người dân trong hạt này hài lòng vì những rắc rối của họ đã được giới quý tộc đi săn lắng nghe."

  hunt_peasants_denied_forest_modifier:0 "Cấm Nông Dân Vào Rừng"
  hunt_peasants_denied_forest_modifier_desc:0 "Nông dân trong hạt này bị tước quyền kiếm ăn trong rừng."

  hunt_peasants_hunted_modifier:0 "Săn Đuổi Nông Dân"
  hunt_peasants_hunted_modifier_desc:0 "Nông dân sợ hãi không dám định cư tại hạt này vì những điều không thể nói ra đã xảy ra nơi đây."

  hunt_aided_peasants_modifier:0 "Giúp Đỡ Nông Dân"
  hunt_aided_peasants_modifier_desc:0 "Những người nghèo nhất trong hạt này đã nhận được sự cứu trợ từ thiện đáng kể."

  hunt_falconry_practiced_modifier: "Thực Hành Nghệ Thuật Săn Bằng Chim Ưng"
  hunt_falconry_practiced_modifier_desc: "Nhân vật này đã luyện tập săn bằng chim ưng trước cuộc săn."
  hunt_poet_romance_aptitude_modifier: "Săn Bắn Kết Hợp Săn Chim"
  hunt_poet_romance_aptitude_modifier_desc: "Nhân vật này đã có một cuộc trao đổi lãng mạn trong chuyến săn, truyền cảm hứng cho thi ca của họ."
  hunt_faith_desecrated_place_of_worship: "Xúc phạm nơi thờ tự"
  hunt_faith_desecrated_place_of_worship_desc: "Nhân vật này đã xúc phạm một nơi thờ tự."
  tgp_hunt_burnt_local_crops: "Thiêu rụi hoa màu dân làng"
  tgp_hunt_burnt_local_crops_desc: "Nhân vật này đã đốt ruộng của dân địa phương khi cố dồn thú săn."
  hunt_fresh_air_and_exercise_modifier:0 "Không Khí Trong Lành Và Vận Động"
  hunt_fresh_air_and_exercise_modifier_desc:0 "Nhân vật này đã tận hưởng việc rèn luyện thể lực khắc nghiệt trong các cuộc săn."

  hunt_focused_attention_modifier:0 "Tập Trung Cao Độ"
  hunt_focused_attention_modifier_desc:0 "Nhân vật này biết cách tập trung vào những việc đòi hỏi sự chú ý tức thời."

  modifier_hunt_dog_trophy_modifier:0 "Chiến Lợi Phẩm Săn Bắn"
  modifier_hunt_dog_trophy_modifier_desc:0 "Một chiến lợi phẩm săn bắn đầy ấn tượng được treo trong đại sảnh của nhân vật này, phô bày những thành tựu của họ."

  modifier_hunt_dog_fighting_modifier:0 "Nâng Cao Võ Dũng"
  modifier_hunt_dog_fighting_modifier_desc:0 "Nhân vật này đã thể hiện một chiến công võ dũng ấn tượng trong các cuộc săn."

  modifier_hunt_resisted_advances:0 "Khước Từ Quyến Rũ"
  modifier_hunt_resisted_advances_desc:0 "Nhân vật này đã chống lại tiếng gọi mê hoặc của cám dỗ."

  hunt_mediated_fight_modifier:0 "Hòa Giải"
  hunt_mediated_fight_modifier_desc:0 "Nhân vật này đã thành công hòa giải giữa hai người đang xung đột – một bài học quý giá."

  hunt_protected_peasants_modifier:0 "Bảo Vệ Nông Dân"
  hunt_protected_peasants_modifier_desc:1 "Nông dân trong hạt này cảm thấy an toàn."

  hunt_disturbed_locals_modifier:0 "Dân Địa Phương Bị Quấy Nhiễu"
  hunt_disturbed_locals_modifier_desc:1 "Người dân trong hạt này chỉ muốn được yên ổn."

  hunt_focused_effort_modifier:0 "Tập Trung Vào Săn Bắn"
  hunt_focused_effort_modifier_desc:1 "Nhân vật này đang dồn toàn bộ sự chú ý vào cuộc săn."

  hunt_treated_injury_modifier:0 "Thực Hành Phẫu Thuật Dã Chiến"
  hunt_treated_injury_modifier_desc:1 "Nhân vật này gần đây đã có kinh nghiệm với những phương pháp điều trị y tế đầy thử thách."

  hunt_tasted_the_belt_modifier:0 "Nếm Đòn Roi"
  hunt_tasted_the_belt_modifier_desc:1 "Nhân vật này đang chịu đựng một cái mông bầm dập."

  hunt_treated_wound_modifier:0 "Băng Bó Vết Thương"
  hunt_treated_wound_modifier_desc:1 "Những vết thương của nhân vật này đã được chăm sóc một cách khéo léo."
 
  hunt_chose_truth_modifier:0 "Thành Thật Khiêm Nhường"
  hunt_chose_truth_modifier_desc:1 "Nhân vật này đã nói ra sự thật dù điều đó gây bất lợi cho chính mình."

  hunt_mystical_animal_modifier:0 "Săn Linh Thú"
  hunt_mystical_animal_modifier_desc:2 "Nhân vật này đã săn và giết một sinh vật huyền bí."

  hunt_protected_their_secret_modifier:0 "Giữ Kín Bí Mật"
  hunt_protected_their_secret_modifier_desc:0 "Nhân vật này đang giữ kín những lá bài của mình."

  hunt_sighting_standard_modifier:0 "Phát Hiện Con Mồi"
  hunt_sighting_standard_modifier_desc:1 "Một lượng lớn con mồi đầy hứa hẹn đã được phát hiện tại hạt này.\n#weak [hunt_success_chance|E] được tăng trong [county|E] này#!"
  hunt_sighting_standard_modifier_custom_desc:1 "Nhiều [SCOPE.sTitle('sighting_county').Custom('GetAnimalPlural')] được báo cáo là đã xuất hiện tại hạt này.\n#weak Tăng [hunt_success_chance_no_prefix|E] cho các cuộc săn [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U]#!"
 
  hunt_sighting_dangerous_modifier:0 "Phát Hiện Mãnh Thú"
  hunt_sighting_dangerous_modifier_desc:1 "Một mãnh thú hung dữ được cho là đang gieo rắc kinh hoàng tại hạt này.\n#weak [hunt_success_chance|E] được tăng trong [county|E] này#!"
  hunt_sighting_dangerous_modifier_custom_desc:1 "Một [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')] hung dữ được báo cáo là đang gieo rắc kinh hoàng tại hạt này.\n#weak Tăng [hunt_success_chance_no_prefix|E] cho các cuộc săn [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U]#!"

  hunt_sighting_legendary_modifier:0 "Phát Hiện Huyền Thoại"
  hunt_sighting_legendary_modifier_desc:2 "Một loài sinh vật huyền thoại được cho là đã xuất hiện tại quận này.\n#weak Có thể tổ chức một cuộc [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName] $hunt_type_legendary$ tại [county|E] này#!"
  hunt_sighting_legendary_modifier_custom_desc:1 "Một [SCOPE.sTitle('sighting_county').Custom('GetLegendaryColor')] [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')] huyền thoại được cho là đã xuất hiện tại quận này.\n#weak Có thể săn một [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|UV] [SCOPE.sTitle('sighting_county').Custom('GetLegendaryColor')|UV] Huyền Thoại tại [county|E] này#!"
 
  hunt_sighting_falconry_modifier:0 "Phát Hiện Chim"
  hunt_sighting_falconry_modifier_desc:0 "Những lần nhìn thấy chim sinh sản hoặc di cư gần đây khiến quận này trở nên lý tưởng để luyện tập nghệ thuật săn chim bằng chim ưng.\n#weak [hunt_success_chance|E] $hunt_type_falconry$ được tăng tại [county|E] này#!"
  hunt_sighting_falconry_modifier_custom_desc:1 "Những lần nhìn thấy [SCOPE.sTitle('sighting_county').Custom('GetAnimalPlural')] sinh sản hoặc di cư khiến quận này trở nên lý tưởng để luyện tập nghệ thuật săn chim bằng chim ưng.\n#weak Tăng [hunt_success_chance_no_prefix|E] cho các cuộc săn [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U]#!"
 
  hunt_heir_murder_exposed_modifier:0 "Công Lý Dân Gian"
  hunt_heir_murder_exposed_modifier_desc:1 "Nhân vật này đã đặt công lý lên trên danh tiếng của một cận thần."
 
  hunt_disrespected_locals_modifier:0 "Xúc Phạm Dân Địa Phương"
  hunt_disrespected_locals_modifier_desc:0 "Cảm xúc của thường dân tại quận này đã bị những thợ săn chà đạp."
 
  hunt_happy_hounds_modifier:0 "Bầy Chó Vui Vẻ"
  hunt_happy_hounds_modifier_desc:1 "Những con chó săn của nhân vật này được tưởng thưởng hậu hĩnh.\n#weak $hunt_modifier_success_slightly_improved_tt$#!\n\n"
 
  hunt_savage_hounds_modifier:0 "Bầy Chó Hung Dữ"
  hunt_savage_hounds_modifier_desc:1 "Những con chó săn của nhân vật này nổi tiếng với việc hạ gục con mồi mạnh mẽ.\n#weak $hunt_modifier_success_slightly_improved_tt$#!\n\n"
 
  hunt_savaged_hounds_modifier:0 "Bầy Chó Bị Tàn Sát"
  hunt_savaged_hounds_modifier_desc:1 "Chuồng chó của nhân vật này đã bị quét sạch do thả chó săn lao vào thú dữ.\n#weak $hunt_modifier_success_slightly_worse_tt$#!\n\n"
 
  crushed_by_boulder_modifier:0 "Bị Đá Nghiền Nát"
  crushed_by_boulder_modifier_desc:0 "Màn thể hiện sự liều lĩnh của nhân vật này đã phản tác dụng khi họ bị tảng đá lăn nghiền nát lúc cố nhảy qua nó."
 
  hunt_blooming_garden_modifier:0 "Khu Vườn Nở Rộ"
  hunt_blooming_garden_modifier_desc:0 "Khu vườn của nhân vật này được trang trí phong phú bằng hoa dại tìm thấy trong một cuộc săn gần đây."
 
  hunt_stocked_medicus_modifier:0 "Thầy Thuốc Đầy Đủ Vật Tư"
  hunt_stocked_medicus_modifier_desc:0 "Ngự y của nhân vật này có sẵn nhiều dược liệu chữa bệnh, cả hiếm lẫn thường."
 
  hunt_witch_protector_modifier:0 "Mục Tử Quan Tâm"
  hunt_witch_protector_modifier_desc:0 "Nhân vật này đã thể hiện sự quan tâm sắc sảo trong việc bảo vệ những anh chị em đồng đạo."
 
  hunt_left_in_trap_modifier:0 "Bị Bỏ Trong Bẫy"
  hunt_left_in_trap_modifier_desc:0 "Nhân vật này đã bị bỏ lại trong bẫy săn quá lâu, gây hại nghiêm trọng đến sức khỏe."
 
  hunt_punished_trappers_modifier:0 "Trừng Phạt Thợ Đặt Bẫy"
  hunt_punished_trappers_modifier_desc:0 "Những chiếc bẫy săn của nông dân trong quận này đã phải chịu cơn thịnh nộ của chủ nhân vùng đất."
 
  hunt_witch_suspicion_modifier:0 "Nghi Ngờ Phù Thủy"
  hunt_witch_suspicion_modifier_desc:0 "Sự quan tâm của nhân vật này đối với thiên nhiên đã làm dấy lên nghi vấn về lòng trung thành của họ với vị thần chân chính."
 
  hunt_mismanaged_game_modifier:0 "Quản Lý Thú Săn Kém"
  hunt_mismanaged_game_modifier_desc:0 "Việc săn hươu cái đã làm suy giảm quần thể thú săn của quận này.\n#weak [hunt_success_chance|E] trong tương lai đối với loài thú này sẽ #negative_value kém hơn một chút#! tại [county|E] này#!"
  hunt_mismanaged_game_modifier_custom_desc:0 "Nhân vật này đã bắt một con hươu non và nuôi thuần để đánh lừa những con hoang dã cùng loài.\n#weak [hunt_success_chance|E] [ROOT.Char.Custom('GetAnimalTypeMismanaged')|UV] trong tương lai sẽ #negative_value kém hơn một chút#! tại [county|E] này#!"

  hunt_tame_deer_modifier:0 "Hươu Non Thuần Hóa"
  hunt_tame_deer_modifier_desc:0 "Nhân vật này đã bắt một con hươu non và nuôi thuần để đánh lừa những con hoang dã cùng loài.\n#weak Trong tương lai, [hunt_success_chance|E] khi săn loài động vật này sẽ #positive_value tốt hơn một chút#!#!\n"
  hunt_tame_deer_modifier_custom_desc:0 "Nhân vật này đã bắt một con hươu non và nuôi thuần để đánh lừa những con hoang dã cùng loài.\n#weak [hunt_success_chance|E] [ROOT.Char.Custom('GetAnimalTypeTame')|UV] sẽ #P tốt hơn một chút#!#!"

  hunt_captive_beast_modifier:0 "Thú Bị Giam Giữ"
  hunt_captive_beast_modifier_desc:0 "Nhân vật này đã bắt sống một con thú nguy hiểm để trưng bày và giải trí.\n#weak Có thể dùng để [GetActivityType('activity_hunt').GetName] loài thú này với [hunt_success_chance_no_prefix|E] #P cao#!\n"
  hunt_captive_beast_modifier_custom_desc:0 "Nhân vật này nuôi giữ một [ROOT.Char.Custom('GetAnimalAdjectiveCaptive')] [ROOT.Char.Custom('GetAnimalTypeCaptive')] để trưng bày và giải trí.\n#weak Có thể dùng để [GetActivityType('activity_hunt').GetName] một [ROOT.Char.Custom('GetAnimalTypeCaptive')|UV] với [hunt_success_chance_no_prefix|E] #P cao#!"

  dog_story_scenthound_modifier:0 "Chó Đánh Hơi"
  dog_story_scenthound_modifier_desc:1 "Một con chó trung thành, được huấn luyện để lần theo dấu vết thú hoang, theo sát nhân vật này mọi lúc\n#weak Tăng nhẹ [hunt_success_chance|E]#!"
  dog_story_beasthound_modifier:0 "Chó Săn Thú Dữ"
  dog_story_beasthound_modifier_desc:1 "Một con chó trung thành, được huấn luyện để chiến đấu với những con thú nguy hiểm, theo sát nhân vật này mọi lúc\n#weak Tăng nhẹ [hunt_success_chance|E]#! khi đối đầu với thú [hunt_dangerous|E]"

  hunt_success_chance.trait:0 "[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]"
