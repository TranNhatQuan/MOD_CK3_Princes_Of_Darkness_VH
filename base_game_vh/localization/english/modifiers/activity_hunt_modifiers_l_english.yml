  hunt_success_chance.dog_story_scenthound_modifier:0 "[GetModifier( 'dog_story_scenthound_modifier' ).GetNameWithTooltip]"
  hunt_success_chance.dog_story_beasthound_modifier:0 "[GetModifier( 'dog_story_beasthound_modifier' ).GetNameWithTooltip]"
