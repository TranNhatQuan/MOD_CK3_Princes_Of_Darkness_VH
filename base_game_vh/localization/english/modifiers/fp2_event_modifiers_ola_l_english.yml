l_english:
  tolerance_gospel_modifier:0 "Giáo Lý Khoan Dung"
  tolerance_gospel_modifier_desc:0 "Nhân vật này đã kêu gọi dân chúng của mình đón nhận sự kiên nhẫn và đoàn kết."
  fanatical_recruits_modifier:0 "Tân Binh Cuồng Tín"
  fanatical_recruits_modifier_desc:0 "Nhân vật này có một nguồn tân binh cuồng tín ổn định."
  tensions_eased_province_modifier:0 "Căng Thẳng Dịu Bớt"
  tensions_eased_province_modifier_desc:0 "Căng thẳng tôn giáo tại tỉnh này đang giảm dần."
  riots_and_murders_province_modifier:0 "Bạo Loạn và Thảm Sát"
  riots_and_murders_province_modifier_desc:0 "Hạt này đã bị rung chuyển bởi các vụ thảm sát và trục xuất những kẻ bị coi là không mong muốn."
  hate_monger_modifier:0 "Kẻ Gieo Rắc Thù Hận"
  hate_monger_modifier_desc:0 "Nhân vật này nổi tiếng là kẻ gieo rắc bất hòa và thù hận."

  nursing_salaries_for_single_mothers_modifier:0 "Trợ Cấp Nuôi Con"
  nursing_salaries_for_single_mothers_modifier_desc:0 "Nhân vật này đã thiết lập một hệ thống trả lương cho các bà mẹ đơn thân để họ nuôi dưỡng con cái trong một thời gian."
  widows_and_widowers_amazing_funds_modifier:0 "Quỹ Góa Phụ"
  widows_and_widowers_amazing_funds_modifier_desc:0 "Nhân vật này đã lập ra một quỹ cho những người góa bụa vì chiến tranh hoặc bất hạnh — nhưng những người có con ngoài giá thú thì không được nhận gì."
  starving_single_mothers_and_children_modifier:0 "Những Người Mẹ Đói Khát"
  starving_single_mothers_and_children_modifier_desc:0 "Các góa phụ, cha mẹ đơn thân và con cái của họ bị bỏ mặc cho chết đói trong lãnh địa của nhân vật này."
  destitute_single_mothers_modifier:0 "Gánh Xiếc Khốn Khổ"
  destitute_single_mothers_modifier_desc:0 "Triều đình của nhân vật này đầy rẫy những bà mẹ đơn thân cùng con cái trong cảnh bần cùng và thảm hại."

  anti_innovation_muslim_modifier:0 "Nizamiyyah"
  anti_innovation_muslim_modifier_desc:0 "Nhân vật này đã thể hiện sự quan tâm tới một phong trào tôn giáo mới, căm ghét chủ nghĩa duy lý và khoa học."
  rolling_in_filth_modifier:0 "Lăn Lộn Trong Dơ Bẩn"
  rolling_in_filth_modifier_desc:0 "Nhân vật này không bận tâm tới sự sạch sẽ hay cái gọi là vệ sinh."
  cannot_read_greek_modifier:0 "Tự Nhận Biết Tiếng Hy Lạp"
  cannot_read_greek_modifier_desc:0 "Nhân vật này tự nhận mình tinh thông ngôn ngữ của các học giả cổ đại, nhưng bằng chứng cho thấy điều ngược lại."
  misread_medicine_incompetence_modifier:0 "Hiểu Sai Kinh Điển Y Học"
  misread_medicine_incompetence_modifier_desc:0 "Nhân vật này đã đọc Kinh Điển Y Học và các tác phẩm lớn về sức khỏe và vệ sinh, nhưng lại hiểu sai hoàn toàn."
  inspired_medicine_modifier:0 "Được Truyền Cảm Hứng Từ Y Học"
  inspired_medicine_modifier_desc:0 "Nhân vật này đã quan tâm tới những đổi mới gần đây trong lĩnh vực y học của các học giả Ba Tư và Andalusia."
  medical_insights_modifier:0 "Hiểu Biết Y Học"
  medical_insights_modifier_desc:0 "Nhân vật này đã đọc Hippocrates và Galen, và giờ đây khăng khăng yêu cầu mọi người rửa tay tại triều đình."

  fp2_advanced_maritime_technology_modifier:0 "Công Nghệ Hàng Hải Tiên Tiến"
  fp2_advanced_maritime_technology_modifier_desc:0 "Nhân vật này đang sở hữu công nghệ hải quân vượt xa phần còn lại của thế giới."
  fp2_successful_shipyards_modifier:0 "Bậc Thầy Đóng Tàu"
  fp2_successful_shipyards_modifier_desc:0 "Địa điểm này là nơi tập trung các thợ thủ công hải quân giàu kinh nghiệm, có thể đóng cả những con tàu phức tạp nhất."

  foreboding_visions_modifier:0 "Những Linh Ảnh Điềm Gở Về Tương Lai"
  foreboding_visions_modifier_desc:0 "Trong những cơn sốt mê sảng và những cơn co giật có thể là bị quỷ ám, nhân vật này trải qua những linh ảnh u ám về các sự kiện sắp tới."

  mysterious_prophetess_illness_modifier:0 "Căn Bệnh Của Nữ Tiên Tri"
  mysterious_prophetess_illness_modifier_desc:0 "Nhân vật này mắc một căn bệnh suy mòn dường như có liên quan tới những giấc mơ tiên tri."

  frightened_by_portent_modifier:0 "Kinh Hãi Trước Điềm Báo"
  frightened_by_portent_modifier_desc:0 "Nhân vật này đã nhận được một điềm báo về những sự kiện kinh hoàng sắp xảy ra."

  cortes_modifier:0 "Cortes"
  cortes_modifier_desc:0 "Nhân vật này cho phép các đại diện được bầu của các đô thị tự do tham gia các cuộc họp hội đồng."

  extra_large_cortes_modifier:0 "Nghị Viện Nhân Dân"
  extra_large_cortes_modifier_desc:0 "Nhân vật này cho phép #italic bất kỳ ai#! tham gia các cuộc họp hội đồng."

  vineyards_burnt_county_modifier:0 "Vườn Nho Bị Thiêu Rụi"
  vineyards_burnt_county_modifier_desc:0 "Hạt này từng sở hữu những vườn nho tráng lệ, nhưng nay đã bị phá hủy hoàn toàn."

  vineyards_protected_county_modifier:0 "Vườn Nho Được Bảo Vệ"
  vineyards_protected_county_modifier_desc:0 "Những vườn nho của hạt này được bảo vệ khỏi các tín đồ cuồng tín tôn giáo muốn thiêu rụi chúng."

  crusading_against_iberian_wine_modifier:0 "Chiến Dịch Chống Rượu Vang"
  crusading_against_iberian_wine_modifier_desc:0 "Nhân vật này quyết tâm chấm dứt thói quen uống rượu bị coi là báng bổ của các thần dân Iberia."

  wine_supply_secure_modifier:0 "Nguồn Rượu Được Đảm Bảo"
  wine_supply_secure_modifier_desc:0 "Nhân vật này đã đảm bảo rằng không điều gì có thể đe dọa nguồn cung rượu vang địa phương hảo hạng cho triều đình của mình."

 


  toledo_steel_armaments_modifier:0 "Vũ Trang Như Quân La Mã"
  toledo_steel_armaments_modifier_desc:0 "Binh lính của nhân vật này mang theo những lưỡi kiếm được rèn từ thép Iberia tinh xảo, như các quân đoàn La Mã thời xưa."

  toledo_steel_county_modifier:0 "Thép Toledo"
  toledo_steel_county_modifier_desc:0 "Hạt này sản xuất một loại thép bền chắc đã nổi tiếng từ thời cổ đại."

  tortured_smith_spilling_secrets_modifier:0 "Bí Quyết Chế Tạo Kiếm"
  tortured_smith_spilling_secrets_modifier_desc:0 "Nhân vật này đã học được những bí mật rèn kiếm từ một bậc thầy thợ rèn bị tra tấn."

  guild_rights_protected_modifier:0 "Quyền Phường Hội Được Bảo Vệ"
  guild_rights_protected_modifier_desc:0 "Phường hội thợ rèn của hạt này đã được bảo vệ khỏi sự can thiệp từ bên ngoài."

  master_smith_npc_modifier:0 "Bậc Thầy Thợ Rèn"
  master_smith_npc_modifier_desc:0 "Kỹ năng rèn của nhân vật này gần như không có đối thủ."


  great_translation_school_modifier:0 "Đại Học Viện Dịch Thuật"
  great_translation_school_modifier_desc:0 "Nhân vật này đã sáng lập một học viện dịch thuật, nơi các tác phẩm vĩ đại từ nước ngoài được phổ biến nhằm mang lại lợi ích cho toàn bộ nền văn minh."

  mediocre_translation_school_modifier:0 "Học Viện Dịch Thuật Tầm Thường"
  mediocre_translation_school_modifier_desc:0 "Nhân vật này đã tài trợ cho một học viện dịch thuật, nhưng những người tham gia có năng lực khá đáng nghi."

  translation_effort_modifier:0 "Nỗ Lực Dịch Thuật"
  translation_effort_modifier_desc:0 "Nhân vật này đã thuê một học giả có năng lực để dịch các tác phẩm quan trọng."

  dusty_libraries_modifier:0 "Thư Viện Phủ Bụi"
  dusty_libraries_modifier_desc:0 "Những thư viện từng tráng lệ trong lãnh địa của nhân vật này nay đã trở nên bụi bặm và bừa bộn. Tuy vậy, bên trong vẫn tồn tại một cảm giác tĩnh lặng kỳ lạ."





  mystery_meat_unhealth_benefits_modifier:0 "Cảm Thấy Kỳ Lạ"
  mystery_meat_unhealth_benefits_modifier_desc:0 "Nhân vật này đã ăn một lượng lớn thịt từ một xác khổng lồ bí ẩn dạt vào bờ biển. Có lẽ họ không nên làm vậy..."

  mystery_meat_health_benefits_modifier:0 "Dinh Dưỡng Tuyệt Vời"
  mystery_meat_health_benefits_modifier_desc:0 "Nhân vật này đã ăn một lượng lớn thịt từ một xác khổng lồ dạt vào bờ biển. Nó rất ngon."

  lay_ruler_issued_fatwa_modifier:0 "Phán Quyết Tôn Giáo"
  lay_ruler_issued_fatwa_modifier_desc:0 "Vị cai trị này đã ban hành một ý kiến pháp lý về vấn đề tôn giáo — dù một số người cho rằng họ không có thẩm quyền để làm vậy."

  saw_the_world_from_above_modifier:0 "Nhìn Thế Giới Từ Trên Cao"
  saw_the_world_from_above_modifier_desc:0 "Nhân vật này đã có một trải nghiệm sâu sắc khi bay lượn trên bầu trời."


  felt_something_modifier:0 "Choáng Ngợp Trước Vẻ Đẹp"
  felt_something_modifier_desc:0 "Nhân vật này đã được nghe thứ âm nhạc mang vẻ đẹp siêu trần thế."

  investing_in_music_modifier:0 "Đầu Tư Vào Âm Nhạc"
  investing_in_music_modifier_desc:0 "Nhân vật này đang nỗ lực để những nhạc công tài năng, kể cả thường dân, được biểu diễn tại triều đình của mình."

  great_pine_chopped_down_county_modifier:0 "Cây Thông Lớn Bị Đốn Hạ"
  great_pine_chopped_down_county_modifier_desc:0 "Tại hạt này từng đứng một cây thông đá cổ thụ khổng lồ, tỏa bóng mát dễ chịu. Nay nó đã không còn."

  aversion_to_joy_modifier:0 "Chán Ghét Niềm Vui"
  aversion_to_joy_modifier_desc:0 "Nhân vật này tự nhủ rằng niềm vui và cái đẹp chỉ là những thứ phù phiếm làm con người trở nên yếu đuối."




  memorable_public_execution_modifier:0 "Cuộc Xử Tử Công Khai Đáng Nhớ"
  memorable_public_execution_modifier_desc:0 "Nhân vật này đã xử tử ai đó theo một cách #italic vô cùng #!ghê rợn."

  compelling_apology_modifier:0 "Lời Xin Lỗi Thuyết Phục"
  compelling_apology_modifier_desc:0 "Dù đã phạm lỗi gì, nhân vật này cũng đã đưa ra một lời xin lỗi #italic vô cùng #!chân thành."

  restitution_to_minorities_modifier:0 "Bồi Thường Cho Thiểu Số Địa Phương"
  restitution_to_minorities_modifier_desc:0 "Nhân vật này đã khắc phục một phần những bất công mà các cộng đồng thiểu số địa phương phải gánh chịu."

  obligations_fulfilled_modifier:0 "Nghĩa Vụ Đáng Ngờ"
  obligations_fulfilled_modifier_desc:0 "Nhân vật này đã hoàn thành nghĩa vụ của mình với một vị quân chủ khác — bằng cách giao nộp những nô lệ đào tẩu..."

  saqaliba_settlers_county_modifier:0 "Người Định Cư Saqaliba"
  saqaliba_settlers_county_modifier_desc:0 "Những cựu nô lệ gốc Đông Âu đã định cư tại tỉnh này."

  former_slave_npc_modifier:0 "Cựu Nô Lệ"
  former_slave_npc_modifier_desc:0 "Nhân vật này từng là nô lệ, và vô cùng quyết tâm bảo vệ tự do của mình."
