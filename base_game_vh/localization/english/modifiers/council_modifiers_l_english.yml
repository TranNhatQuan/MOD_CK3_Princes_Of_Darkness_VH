  marshal_task_levy_desertions_modifier_desc:1 "Yêu cầu cao và cách làm hà khắc đã khiến một lượng lớn quân dịch đào ngũ khỏi quân đội của nhân vật này."

  marshal_task_unused_farmland_modifier:0 "Đất Canh Tác Bị Bỏ Hoang"
  marshal_task_unused_farmland_modifier_desc:0 "Nông dân bị tuyển mộ một cách bừa bãi từ quận này, dẫn đến thiếu lao động cho những vùng đất rộng lớn."

  marshal_task_organized_service_modifier:0 "Phục Vụ Có Tổ Chức"
  marshal_task_organized_service_modifier_desc:0 "Dân cày trong quận này đã được tổ chức theo một hệ thống nhằm tối đa hóa hiệu quả phục vụ quân sự và nông nghiệp."

  marshal_task_military_presence_modifier:0 "Hiện Diện Quân Sự"
  marshal_task_military_presence_modifier_desc:0 "Ban cho khả năng miễn nhiễm với [county_corruption|E].\n\nQuận này có sự hiện diện quân đội được tổ chức tốt, hỗ trợ các lãnh chúa địa phương khi cần."

  marshal_task_increase_control_decreased_opinion_modifier:0 "Sự Kiểm Soát Ngột Ngạt"
  marshal_task_increase_control_decreased_opinion_modifier_desc:0 "Quận này đang chịu đựng sự giám sát hà khắc của Thống Soái của lãnh thổ."

  marshal_task_increase_control_increased_opinion_modifier:0 "Sự Hướng Dẫn Của Thống Soái"
  marshal_task_increase_control_increased_opinion_modifier_desc:0 "Quận này được hưởng lợi rất lớn từ sự quan tâm của Thống Soái của lãnh thổ."

  task_manage_guards_disorganized_modifier_desc:0 "Sự hỗn loạn trong hàng ngũ Vệ Binh Hoàng Gia khiến việc bắt giữ những kẻ âm mưu thù địch kịp thời trở nên khó khăn hơn."

  tax_collector_free_rein_modifier: "Toàn Quyền"
  tax_collector_free_rein_modifier_desc: "Nhân vật này đã cho người thu thuế của mình quyền tự do rộng rãi trong việc tính toán thu nhập phải nộp."
  tax_collector_fair_arbiter_modifier: "Trọng Tài Công Bằng"
  tax_collector_fair_arbiter_modifier_desc: "Nhân vật này đã giúp người thu thuế thu thập các khoản đóng góp một cách công bằng và hiệu quả."
  steward_construction_slowdown_modifier:0 "Xây Dựng Chậm Trễ"
  steward_construction_slowdown_modifier_desc:0 "Quản lý tài nguyên kém khiến việc xây dựng quy mô lớn trở nên khó khăn."
  steward_task_efficient_taxation_modifier:0 "Đánh Thuế Hiệu Quả"
  steward_task_efficient_taxation_modifier_desc:0 "Hệ thống hóa việc thu thuế đã cải thiện đáng kể hiệu quả của nó."
  steward_settler_resistance_modifier:0 "Chống Đối Hành Chính"
  steward_settler_resistance_modifier_desc:0 "Quận này tin rằng họ không cần sự hỗ trợ, cũng như các nghĩa vụ bổ sung do Quan Quản Lý của lãnh thổ áp đặt."
  steward_welcome_administration_modifier:0 "Chào Đón Hành Chính"
  steward_welcome_administration_modifier_desc:0 "Quận này đã nhận được sự trợ giúp và hỗ trợ hữu ích từ Quan Quản Lý của lãnh thổ."
  steward_realm_identity_modifier:0 "Quân Dịch Tự Nguyện"
  steward_realm_identity_modifier_desc:0 "Dân cày của quận này coi việc phục vụ trong quân dịch là một phần thiết yếu trong nghĩa vụ của họ."
  steward_population_mismanaged_modifier:0 "Dân Số Bị Quản Lý Kém"
  steward_population_mismanaged_modifier_desc:0 "Cư dân của quận này vô cùng bất mãn với cách Quan Quản Lý của lãnh thổ đối xử với họ."
  steward_administration_embraced_modifier:0 "Chấp Nhận Hành Chính"
  steward_administration_embraced_modifier_desc:0 "Cư dân của quận này hài lòng với sự quan tâm đặc biệt mà Quan Quản Lý của lãnh thổ dành cho họ."
  steward_redoubled_development_modifier: "Gia Tăng Phát Triển"
  steward_redoubled_development_modifier_desc: "Mọi lợi nhuận từ sự phát triển của quận này đều được tái đầu tư để tài trợ cho chính sự phát triển đó."
  steward_redoubled_taxation_modifier: "Gia Tăng Thu Thuế"
  steward_redoubled_taxation_modifier_desc: "Mọi lợi nhuận từ sự phát triển của quận này đều chảy thẳng vào túi của chủ quân."
