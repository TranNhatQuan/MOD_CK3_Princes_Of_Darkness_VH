  steward_de_jure_denied_modifier:0 "Bị Từ Chối De Jure"
  steward_de_jure_denied_modifier_desc:0 "Cư dân của quận này bất mãn với người cai trị của họ, kẻ đã từ chối cho phép họ gia nhập lãnh chúa De Jure của mình."

