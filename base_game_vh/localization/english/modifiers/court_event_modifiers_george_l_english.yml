## Court Event 7030
  cultural_acceptance_foreign_merchants:0 "Cộng Đồng Thương Nhân [foreign_merchant.GetCulture.GetName]"
  cultural_acceptance_foreigners_expelled:0 "Trục Xuất Thương Nhân [foreign_merchant.GetCulture.GetName]"
  court_7030_merchant_privileges:0 "Mở Rộng Đặc Quyền Thương Nhân"
  court_7030_merchant_privileges_desc:0 "Nhân vật này đã ban cho một nhóm thương nhân ngoại quốc các đặc quyền đặc biệt, đổi lại là quyền tiếp cận hạm đội thương mại hùng hậu của họ."
  foreign_merchant_community:0 "Cộng Đồng Thương Nhân Ngoại Quốc"
  foreign_merchant_community_desc:0 "Một cộng đồng thương nhân ngoại quốc đang phát triển thịnh vượng tại hạt này."
## Court Event 7040
  fervor_gain_ascetic_example:0 "Được Truyền Cảm Hứng Bởi Khổ Hạnh"
  court_7040_ascetic_practices:0 "Thực Hành Khổ Hạnh"
  court_7040_ascetic_practices_desc:0 "Nhân vật này đã áp dụng một số thực hành khổ hạnh nhằm sống gần hơn với các lý tưởng tôn giáo của mình."
## Court Event 7050
  cultural_artifact_gift_accepted:0 "Nhận Bảo Vật [friend.GetCulture.GetName]"
  cultural_artifact_gift_rejected:0 "Từ Chối Bảo Vật [friend.GetCulture.GetName]"
  cultural_artifact_heretical:0 "Bảo Vật [friend.GetCulture.GetName] Bị Xem Là Dị Giáo"
  intolerance_of_icons:0 "Không Khoan Dung Với Các Nền Văn Hóa Phi Chính Thống"
  court_7050_listens_to_church:0 "Tín Đồ Ngoan Đạo"
  court_7050_listens_to_church_desc:0 "Nhân vật này thực sự cuồng tín, và luôn lắng nghe các linh mục cũng như nhà chức trách tôn giáo."
  court_7050_tolerance:0 "Khoan Dung Với Người Khác"
  court_7050_tolerance_desc:0 "Nhân vật này có tư duy cởi mở đối với tập tục của người khác, điều này khiến giới chức tôn giáo khó chịu nhưng lại được những người khác đức tin trân trọng."
