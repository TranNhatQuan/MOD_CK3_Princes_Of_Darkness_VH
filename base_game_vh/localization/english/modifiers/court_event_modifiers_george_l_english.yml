## Court Event 7400
  expensive_guests:0 "Chủ Nhà Xa Hoa"
  expensive_guests_desc:0 "Vị thống trị này nổi tiếng với sự hiếu khách phung phí quá mức."
  inhospitable_court:0 "Chủ Nhà Không Hiếu Khách"
  inhospitable_court_desc:0 "Triều đình của vị thống trị này không phải là nơi chào đón nhất."
## Court Event 7610
  struggling_with_destrier:0 "Vật Lộn Với Ngựa Chiến"
  struggling_with_destrier_desc:0 "Nhân vật này cưỡi một con ngựa chiến cỡ lớn, dù thực tế chưa đủ kinh nghiệm để kiểm soát nó."
  practicing_with_palfrey:0 "Luyện Tập Với Ngựa Palfrey"
  practicing_with_palfrey_desc:0 "Nhân vật này không sinh ra đã quen yên ngựa, nhưng đã rèn luyện kỹ năng cưỡi ngựa với một con chiến mã phù hợp."
## Court Event 7620
  peregrine_falcon:1 "Chim Săn Mồi"
  peregrine_falcon_desc:3 "Nhân vật này sở hữu một con chim ưng hoặc diều hâu, một loài chim danh giá dùng để săn bắn và phô trương.\n#weak Cải thiện [hunt_success_chance|E] của $hunt_type_falconry$#!"
## Court Event 7630
  master_of_horse_cavalry_bonus:0 "Được Khích Lệ $master_of_horse_court_position$"
  master_of_horse_cavalry_bonus_desc:1 "[GetCourtPositionType('master_of_horse_court_position').GetName()] của nhân vật này có lý do để nỗ lực hơn trong nhiệm vụ gian khổ là hướng dẫn người khác chăm sóc ngựa thật tốt."
  master_of_hunt_activity_bonus:0 "Được Khích Lệ $master_of_hunt_court_position$"
  master_of_hunt_activity_bonus_desc:1 "[GetCourtPositionType('master_of_hunt_court_position').GetName()] của nhân vật này dốc thêm công sức cho mọi cuộc săn đã lên lịch, để tỏ lòng biết ơn trước sự ủng hộ và trung thành của nhân vật này.\n\nHoạt động [GetActivityType('activity_hunt').GetName] [activity|E] tiêu tốn ít [gold|E] hơn một chút."
## Court Event 7700
  honorable_ruler:0 "Nhà Cầm Quyền Danh Dự"
  honorable_ruler_desc:0 "Nhân vật này đã chọn con đường chính trực dù không bắt buộc phải làm vậy."
  pigeon_thief:0 "Bồ Câu Nuôi"
  pigeon_thief_desc:0 "Nhân vật này luôn đi trước một bước nhờ con bồ câu nuôi #EMP gian xảo#! của mình."
  profiting_from_pigeon_thievery:0 "Chỉ Điểm Viên Bồ Câu"
  profiting_from_pigeon_thievery_desc:0 "Một số người gọi chỉ điểm viên của họ là “những chú chim nhỏ”. Nhân vật này thì hiểu theo nghĩa đen."
