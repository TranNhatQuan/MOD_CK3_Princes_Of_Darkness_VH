l_english:
  VIRTUE_MODIFIER:0 "[TRAIT.GetName( GetPlayer )|L] ([virtue|E])"
  SIN_MODIFIER:0 "[TRAIT.GetName( GetPlayer )|L] ([sin|E])"

  recent_excommunication:0 "Vừa bị rút phép thông công"
  recent_excommunication_desc:0 "Nhân vật này gần đây đã bị [excommunicated|E], làm tổn hại nghiêm trọng đến vị thế của họ trong mắt đức tin của mình."
 
  excommunication_recently_lifted:0 "Vừa được gỡ bỏ rút phép thông công"
  excommunication_recently_lifted_desc:0 "Sẽ cần một thời gian trước khi vết nhơ từ lần [excommunication|E] trước đây của nhân vật này hoàn toàn phai nhạt."

  vow_of_poverty_modifier:0 "Lời thề nghèo khó"
  vow_of_poverty_modifier_desc:0 "Nhân vật này đã lập một lời thề thiêng liêng là sẽ cho đi phần lớn tài sản của mình."

  temporal_condemnation_modifier:0 "Bị kết án trần thế"
  temporal_condemnation_modifier_desc:0 "Các nhà chức trách tôn giáo đã lên án nhân vật này là không phù hợp để dẫn dắt các tín đồ."

  scorned_theocrats_modifier:0 "Bị giáo sĩ khinh miệt"
  scorned_theocrats_modifier_desc:0 "Nhân vật này đã công khai xúc phạm và đe dọa một thành viên của giới giáo sĩ."

  known_non_believer:0 "Kẻ không có đức tin"
  known_non_believer_desc:0 "Nhân vật này đã bị lộ là một kẻ không có đức tin."

  dynasty_beneficiary_won_ghw:0 "Triều đại nhiệt huyết"
  dynasty_beneficiary_won_ghw_desc:1 "Không ai có thể phủ nhận lòng nhiệt thành và dũng cảm mà các thành viên của triều đại này đã thể hiện hết lần này đến lần khác trong chiến tranh, đặc biệt là trong các vấn đề liên quan đến đức tin."

  house_beneficiary_won_ghw_crusade:0 "Gia tộc Thập tự chinh"
  house_beneficiary_won_ghw_crusade_desc:0 "Khi đến lúc chứng minh lòng tận hiến với Giáo hội, các thành viên của gia tộc này đã sẵn sàng hưởng ứng lời kêu gọi vũ trang và tỏa sáng trong các trận chiến chống lại kẻ ngoại đạo."
  house_beneficiary_won_ghw_jihad:0 "Gia tộc Mujahid"
  house_beneficiary_won_ghw_jihad_desc:0 "Không còn nghi ngờ gì nữa: tinh thần của cuộc thánh chiến vẫn đang sống động và mạnh mẽ trong các thành viên của gia tộc này."
  house_beneficiary_won_ghw:0 "Những chiến binh thánh"
  house_beneficiary_won_ghw_desc:0 "Các thành viên của gia tộc này đã nhiều lần tỏ rõ bản thân trong cuộc chiến chống lại kẻ thù của Đức Tin, chứng minh không thể chối cãi lòng nhiệt thành của họ."
  resurging_saoshyant:0 "Saoshyant tái xuất"
  resurging_saoshyant_desc:0 "Triều đại này đã sinh ra Saoshyant theo lời tiên tri, trở lại để dẫn dắt thế giới thoát khỏi bóng tối."

  wind_spirit_blessing:0 "Phúc lành của Linh hồn Gió"
  wind_spirit_blessing_desc:0 "Người ta đồn rằng nhân vật này đã được các linh hồn ban phúc."
  water_spirit_blessing:0 "Phúc lành của Linh hồn Nước"
  water_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"
  rock_spirit_blessing:0 "Phúc lành của Linh hồn Đá"
  rock_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"
  tree_spirit_blessing:0 "Phúc lành của Linh hồn Cây"
  tree_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"
  bush_spirit_blessing:0 "Phúc lành của Linh hồn Bụi cây"
  bush_spirit_blessing_desc:0 "$wind_spirit_blessing_desc$"

  bhakti_hinduism_ganga:0 "Tín đồ của Ganga"
  bhakti_hinduism_ganga_desc:0 "Bhakti của nhân vật này dành cho Ganga, vị thần của sự thanh khiết, chuộc tội và moksha."
  bhakti_hinduism_saraswati:0 "Tín đồ của Saraswati"
  bhakti_hinduism_saraswati_desc:0 "Bhakti của nhân vật này dành cho Saraswati, nữ thần của học vấn, âm nhạc, nghệ thuật và trí tuệ."
  bhakti_hinduism_kali:0 "Tín đồ của Kali"
  bhakti_hinduism_kali_desc:0 "Bhakti của nhân vật này dành cho Kali, nữ thần của sự hủy diệt các thế lực tà ác."
  bhakti_hinduism_kubera:0 "Tín đồ của Kubera"
  bhakti_hinduism_kubera_desc:0 "Bhakti của nhân vật này dành cho Kubera, vị thần dị dạng của sự giàu có, công lý và của cải vật chất."
  bhakti_vaishnavism_lakishmi:0 "Tín đồ của Lakishmi"
  bhakti_vaishnavism_lakishmi_desc:0 "Bhakti của nhân vật này dành cho Lakishmi, nữ thần của sự giàu có, vận may và thịnh vượng."
  bhakti_vaishnavism_jagganath:0 "Tín đồ của Jagganath"
  bhakti_vaishnavism_jagganath_desc:0 "Bhakti của nhân vật này dành cho Jagganath, Chúa tể của Vũ trụ."
  bhakti_vaishnavism_hayagriva:0 "Tín đồ của Hayagriva"
  bhakti_vaishnavism_hayagriva_desc:0 "Bhakti của nhân vật này dành cho Haygriva, vị thần đầu ngựa của tri thức và trí tuệ."
  bhakti_shaivism_parvati:0 "Tín đồ của Parvati"
  bhakti_shaivism_parvati_desc:0 "Bhakti của nhân vật này dành cho Parvati, nữ thần của sinh sản, tình yêu, vẻ đẹp, hôn nhân, con cái và lòng tận hiến."
  bhakti_shaivism_virabhadra:0 "Tín đồ của Vīrabhadra"
  bhakti_shaivism_virabhadra_desc:0 "Bhakti của nhân vật này dành cho Vīrabhadra, một hiện thân cực kỳ dữ dội và đáng sợ của Shiva, hiện thân của cơn thịnh nộ và sự phẫn nộ chính nghĩa."
  bhakti_shaivism_munishwarar:0 "Tín đồ của Munīshwarar"
  bhakti_shaivism_munishwarar_desc:0 "Bhakti của nhân vật này dành cho Munīshwarar, một hiện thân thánh thiện của Shiva, hiện thân của tình yêu gia đình."
  bhakti_shaivism_dakshinamoorthy:0 "Tín đồ của Dakshinamoorthy"
  bhakti_shaivism_dakshinamoorthy_desc:0 "Bhakti của nhân vật này dành cho Dakshinamoorthy, vị thần của học vấn dưới mọi hình thức."
  bhakti_smartism_ganesha:0 "Tín đồ của Ganesha"
  bhakti_smartism_ganesha_desc:0 "Bhakti của nhân vật này dành cho Ganesha, vị thần đầu voi của tri thức, chữ viết, trí tuệ và những khởi đầu mới."
  bhakti_smartism_vishnu:0 "Tín đồ của Vishnu"
  bhakti_smartism_vishnu_desc:0 "Bhakti của nhân vật này dành cho Vishnu, vị thần trông coi và bảo vệ sự sáng tạo."
  bhakti_smartism_shiva:0 "Tín đồ của Shiva"
  bhakti_smartism_shiva_desc:0 "Bhakti của nhân vật này dành cho Shiva, vị thần săn lùng và tiêu diệt cái ác dưới mọi hình thức."

  bhakti_germanic_generic_odin:0 "Tín đồ của Odin"
  bhakti_germanic_generic_odin_desc:0 "Vị thần được nhân vật này sùng kính là Odin, thần của chiến tranh, pháp thuật, cái chết và thi ca."
  bhakti_germanic_not_danish_ullr:0 "Tín đồ của Ullr"
  bhakti_germanic_not_danish_ullr_desc:0 "Vị thần được nhân vật này sùng kính là Ullr, thần của chiến tranh và danh dự."
  bhakti_germanic_danish_tyr:0 "Tín đồ của Tyr"
  bhakti_germanic_danish_tyr_desc:0 "Vị thần được nhân vật này sùng kính là Tyr, thần của chiến tranh và lòng dũng cảm."
  bhakti_germanic_generic_thor:0 "Tín đồ của Thor"
  bhakti_germanic_generic_thor_desc:0 "Vị thần được nhân vật này sùng kính là Thor, thần của sự bảo hộ, bão tố, nhân loại và sức mạnh."
  bhakti_germanic_generic_freyr:0 "Tín đồ của Freyr"
  bhakti_germanic_generic_freyr_desc:0 "Vị thần được nhân vật này sùng kính là Freyr, thần của hòa bình, mùa màng và sự cai trị nhân hậu."

  meditating_in_seclusion_modifier:0 "Thiền định trong ẩn cư"
  meditating_in_seclusion_modifier_desc:0 "Nhân vật này đã bắt đầu một hành trình nội tâm và ít chú ý đến các vấn đề vật chất."

  astrology_great_battle:0 "Chuẩn bị cho đại chiến"
  astrology_great_battle_desc:0 "Nhân vật này đang dự đoán và rèn luyện cho một trận đại chiến."
  astrology_new_friends:0 "Kết giao bằng hữu mới"
  astrology_new_friends_desc:0 "Nhân vật này đang hàn gắn những mối thù cũ và kết bạn mới."
  astrology_hard_work:0 "Lao động tận tụy"
  astrology_hard_work_desc:0 "Nhân vật này dự định chứng minh rằng sự chăm chỉ và cống hiến sẽ được đền đáp."
  astrology_betrayal:0 "Nghi ngờ người khác"
  astrology_betrayal_desc:0 "Điều gì đó đã khiến nhân vật này trở nên nghi ngờ và mất lòng tin vào người khác."
  astrology_new_beginnings:0 "Cởi mở tư duy"
  astrology_new_beginnings_desc:0 "Nhân vật này đang tích cực cố gắng giữ cho mình một tư duy cởi mở."

  feud_with_the_church_modifier:0 "Thù địch với Giáo hội"
  feud_with_the_church_modifier_desc:0 "Nhân vật này được biết là đang dính vào một mối thù cay đắng với Giáo hội, và có thể sẽ làm điều gì đó cực đoan."

  sun_trial_suspicious_modifier: "Thử thách Mặt Trời đáng ngờ"
  sun_trial_suspicious_modifier_desc: "Nhân vật này được biết là đã tiến hành một Thử thách Mặt Trời với kết cục có phần đáng ngờ, khiến danh tiếng của họ bị hoen ố."
