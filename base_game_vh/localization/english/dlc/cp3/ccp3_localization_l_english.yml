l_english:
 #Drassanes
  building_type_drassanes_01: "$building_drassanes_01$"
  building_type_drassanes_01_desc: "$building_drassanes_01_desc$"
  building_drassanes_01: "Drassanes"
  building_drassanes_01_desc: "Bên ngoài tường thành Barcelona, dưới chân đồi #italic Montjuich#!, kho xưởng ụ khô khổng lồ này trang bị và bảo vệ một hạm đội thuyền chiến galley.\nDưới những mái vòm đá nhọn, các thợ thủ công lao động không ngừng nghỉ. Những tòa tháp cao và bức tường dài che giấu bí mật công việc của họ khỏi ánh mắt người ngoài."
 #Great Kyz Kala
  building_type_kyz_kala_01: "$building_kyz_kala_01$"
  building_type_kyz_kala_01_desc: "$building_kyz_kala_01_desc$"
  building_kyz_kala_01: "Đại Kyz Kala"
  building_kyz_kala_01_desc: "Cung điện đồ sộ này sừng sững bên trên ốc đảo xanh tươi của Merv. Những bức tường gợn sóng bao bọc các xưởng chế tác, kho vũ khí và những đại sảnh rộng lớn nơi các sứ giả và quan lại thực hiện công việc của mình.\nNửa là nơi ở, nửa là pháo đài, công trình vĩ đại này vừa đủ sức tổ chức những yến tiệc tráng lệ nhất, vừa có thể đẩy lùi những cuộc tập kích man rợ nhất."
 #Cluny Abbey
  building_type_cluny_abbey_01: "Tu Viện Cluny"
  building_type_cluny_abbey_01_desc: "$building_cluny_abbey_01_desc$"
  building_cluny_abbey_01: "Tu Viện Cluny"
  building_cluny_abbey_01_desc: "Một món quà gồm đất đai và đặc quyền, đổi lấy sự cứu rỗi vĩnh cửu. Đó là giao ước được thiết lập giữa cộng đồng tu sĩ Cluny và vị lãnh chúa địa phương.\nTheo thời gian, nơi đây đã phát triển thành một cộng đồng sôi động và có ảnh hưởng lớn, không chịu sự can thiệp của thế quyền, thực thi kỷ luật Biển Đức trên khắp các vùng.\n\nDưới những mái ngói đỏ, các tu sĩ cầu nguyện, lao động và chép sáng bản thảo — một khuôn mẫu để khắp lục địa noi theo."
  building_cluny_abbey_02: "Maior Ecclesia"
  building_cluny_abbey_02_desc: "Những ngôi nhà tu viện nhỏ bé trước kia đã được thay thế bằng một quần thể tôn giáo rộng lớn.\nĐể củng cố di sản này, các viện phụ đã khởi công một dự án xây dựng đồ sộ: #italic Maior Ecclesia#!. Được định hình là nhà thờ lớn nhất trong toàn cõi Kitô giáo, năm gian chính của nó dài hơn cả Vatican, và những mái vòm đá khổng lồ là một kỳ tích kiến trúc, dày đặc tháp và mái."
 #Walls of York
  building_type_york_walls_01: "$building_york_walls_01$"
  building_type_york_walls_01_desc: "$building_york_walls_01_desc$"
  building_york_walls_01: "Tường Thành York"
  building_york_walls_01_desc: "Trải dài nhiều dặm, những bức tường đồ sộ này đã bảo vệ thành phố từ thời các Hoàng đế La Mã. Chúng khéo léo tận dụng hai con sông uốn lượn qua đồng cỏ, che chắn thành phố khỏi kẻ thù từ đông sang tây. Mọi giao thông đều bị dẫn qua các điểm nghẽn cố định — những #italic Bars#! — nơi có thể thu thuế, hoặc trút xuống mưa tên và lửa."
 #Great Mosque of Damascus
  building_type_damascus_mosque_01: "$building_damascus_mosque_01$"
  building_type_damascus_mosque_01_desc: "$building_damascus_mosque_01_desc$"
  building_damascus_mosque_01: "Đại Thánh Đường Damascus"
  building_damascus_mosque_01_desc: "Thánh đường này mang trong mình một câu chuyện đáng kính. Tại đây, nhiều thế kỷ tâm linh và tài nghệ kỳ diệu chồng lớp lên nhau, khi nó được xây dựng trên nền một ngôi đền La Mã và một đại giáo đường Kitô giáo sơ kỳ.\nCông trình nổi tiếng với những phiến đá cẩm thạch lộng lẫy, rực rỡ sắc màu, cùng các bức khảm vàng do nghệ nhân đến từ tận Constantinople thực hiện."
 #Jokhang Temple
  building_type_jokhang_01: "$building_jokhang_01$"
  building_type_jokhang_01_desc: "$building_jokhang_01_desc$"
  building_jokhang_01: "Đền Jokhang"
  building_jokhang_01_desc: "Truyền thuyết kể rằng Jokhang được dựng lên trên một hồ thiêng cổ xưa — trái tim của một nữ quỷ mang hình dáng Tây Tạng. Ba lần ngôi đền được xây dựng, và ba lần bị cơn thịnh nộ của hồ nước nuốt chửng, cho đến khi những lời cầu nguyện và lễ hiến tế của hoàng hậu vị hoàng đế đầu tiên cuối cùng đã xoa dịu được nó.\nNgôi đền là nơi linh thiêng nhất vùng đất, một quần thể mê cung gồm sân trong và khu tu viện, được nối với nhau bằng những hành lang và đại sảnh sâu thẳm, phủ đầy bơ yak."
 #Wartburg
  building_type_wartburg_01: "$building_wartburg_01$"
  building_type_wartburg_01_desc: "$building_wartburg_01_desc$"
  building_wartburg_01: "Wartburg"
  building_wartburg_01_desc: "Giữa rừng Thuringia, tọa lạc trên một mỏm đá cao chót vót, pháo đài này kiểm soát mọi dòng chảy hàng hóa và nhân lực trong khu vực.\nMột barbacan nặng nề canh giữ lối vào duy nhất của lâu đài, và những bức tường trắng cao uốn lượn theo các khe núi. #italic Palas#! là công trình quan trọng nhất trong quần thể, một đại sảnh đá lạnh lẽo được sưởi ấm bởi vô số lò sưởi bên trong."
 #Beta Giyorgis
  building_type_beta_giyorgis_01: "$building_beta_giyorgis_01$"
  building_type_beta_giyorgis_01_desc: "$building_beta_giyorgis_01_desc$"
  building_beta_giyorgis_01: "Thánh George ở Lalibela"
  building_beta_giyorgis_01_desc: "#italic Beta Giyorgis#! được đục tạc hoàn toàn từ khối đá núi lửa đỏ ấm. Bao quanh là hơn một tá các đền thờ và công trình chị em khác, tượng trưng cho cả Jerusalem Trần Thế lẫn Thiên Giới. Đây là bằng chứng sống động cho mối liên kết giữa Vương quốc Thánh và vùng đất này.\nẨn sâu trong lòng đá, đại sảnh chính của nhà thờ được trang hoàng bằng những bức bích họa tuyệt mỹ, trong khi các thánh tượng linh thiêng tô điểm cho các bức tường."
 #Holy Wisdom of Novgorod 
  building_type_holy_wisdom_01: "$building_holy_wisdom_01$"
  building_type_holy_wisdom_01_desc: "$building_holy_wisdom_01_desc$"
  building_holy_wisdom_01: "Thánh Đường Minh Triết của Thượng Đế"
  building_holy_wisdom_01_desc: "Ngôi thánh đường tráng lệ này được mô phỏng theo Hagia Sophia, nhằm thể hiện cùng một ánh sáng, sự giàu có và quyền lực nơi vùng đất phương bắc băng giá. Đá vôi trắng khắc khổ tương phản với sắc màu choáng ngợp của các bích họa bên trong. Dưới ánh nến ấm áp, những cái bóng nhảy múa quanh các bức khảm vàng trên nhiều mái vòm của nhà thờ."
 #Kano Earthworks
  building_type_kano_walls_01: "$building_kano_walls_01$"
  building_type_kano_walls_01_desc: "$building_kano_walls_01_desc$"
  building_kano_walls_01: "Thành Đất Kano"
  building_kano_walls_01_desc: "Những bức tường đất và bùn khổng lồ, cao nhiều mét, bao quanh thành phố cổ Kano.\nHệ thống công sự này bao phủ diện tích lớn hơn nhiều so với khu dân cư, vây trọn cả các cánh đồng lúa mì để nuôi sống dân chúng trong những cuộc vây hãm kéo dài."
 #Somapura University
  building_type_somapura_university_01: "$building_somapura_university_01$"
  building_type_somapura_university_01_desc: "$building_somapura_university_01_desc$"
  building_somapura_university_01: "Đại Học Somapura"
  building_somapura_university_01_desc: "Trong nhiều thế kỷ, Somapura đã là một trong những trung tâm học thuật quan trọng nhất của Ấn Độ, thu hút học giả từ những vùng đất xa xôi nhờ mối liên kết rộng khắp với các tu viện Phật giáo, Kỳ-na giáo và Ấn Độ giáo.\nMặt bằng hình tứ giác thể hiện sự hài hòa và thuần khiết tuyệt đối của vũ trụ — một nơi hoàn hảo để trí tuệ phát triển."
 #Duomo of Florence
  building_type_duomo_florence_01: "Duomo Firenze"
  building_type_duomo_florence_01_desc: "Là trụ sở của tổng giám mục địa phương và là niềm tự hào to lớn của toàn thể dân chúng Florence, Duomo là một trong những kỳ tích kiến trúc vĩ đại nhất từng được tạo dựng."
  building_duomo_florence_01: "Santa Reparata"
  building_duomo_florence_01_desc: "Nằm dọc theo các bức tường La Mã cổ gần cổng phía bắc, thánh đường Kitô giáo sơ kỳ này đã là nơi sinh hoạt tôn giáo của các tín đồ Florence từ trước thời Constantine. Công trình từng trải qua hỏa hoạn, cướp bóc, tái thiết và ban phước, nhưng vẫn giữ được ba gian chính nguyên bản cùng những mái vòm tròn thanh nhã.\nTuy nhiên, khi thành phố ngày càng mở rộng, ngôi thánh đường cũ có lẽ cũng cần phát triển theo."
  building_duomo_florence_02: "Nhà Rửa Tội Thánh Gioan"
  building_duomo_florence_02_desc: "Đây là một nhà rửa tội bát giác khổng lồ nằm ở trung tâm thành phố, được hiến dâng cho vị thánh bảo trợ là Thánh Gioan.\nCông trình được bao phủ bằng đá cẩm thạch đắt giá và trang trí bằng những tác phẩm điêu khắc điêu luyện cùng các bức khảm vàng, minh chứng rực rỡ cho sự giàu có của thành phố. Truyền thuyết kể rằng nơi đây từng là đền thờ thần Mars, và diện mạo của nó rất giống với điện Pantheon ở Rome."
  building_duomo_florence_03: "Santa Maria del Fiore"
  building_duomo_florence_03_desc: "Một thánh đường vĩ đại — một #italic Duomo#! — xứng đáng với sự giàu có của Florence nay sừng sững trên thành phố.\nNhững gian chính dài và hậu cung bát giác khổng lồ được phủ bằng các loại đá cẩm thạch có màu sắc nổi bật, tạo nên những hiệu ứng thị giác về chiều sâu. Mặt tiền được trang trí bằng tượng các nhà tiên tri, thần thánh và các vị bảo trợ. Tháp chuông cao vút của nó đánh dấu nhịp lao động và cầu nguyện của dân chúng."
  building_duomo_florence_04: "Mái Vòm"
  building_duomo_florence_04_desc: "Mái vòm #italic Cupola#! vươn cao đồ sộ trên toàn bộ quần thể. Thanh thoát và nhẹ như không khí giữa nền trời xanh, đây là thành tựu vĩ đại nhất của các kiến trúc sư Florence.\nMái vòm cao và rộng hơn bất kỳ công trình nào từng được hình dung, không cần trụ chống hay hệ thống đỡ bên ngoài để tránh sụp đổ, nhờ vào kỹ thuật khéo léo sử dụng cấu trúc hai lớp bằng gạch và khối xây."
 #Konarak Sun Temple
  building_type_konark_temple_01: "$building_konark_temple_01$"
  building_type_konark_temple_01_desc: "$building_konark_temple_01_desc$"
  building_konark_temple_01: "Đền Mặt Trời Konarak"
  building_konark_temple_01_desc: "Được xây dựng bởi hàng nghìn nghệ nhân, Đền Mặt Trời Konark là một ngôi đền đồ sộ hiến dâng cho thần Mặt Trời Surya. Toàn bộ quần thể được thiết kế mô phỏng cỗ chiến xa hùng vĩ của vị thần, mang ánh sáng từ biển hướng về phía đông.\nLà một ví dụ tuyệt mỹ của kiến trúc Kalinga, ngôi đền được phủ kín các phù điêu và tượng điêu khắc khắc họa thần linh, binh sĩ, nhạc công và những sinh vật huyền thoại, kể lại các kinh điển Ấn Độ giáo."
 #University of al-Qarawiyyin
  building_type_al_qarawiyyin_university_01: "$building_al_qarawiyyin_university_01$"
  building_type_al_qarawiyyin_university_01_desc: "$building_al_qarawiyyin_university_01_desc$"
  building_al_qarawiyyin_university_01: "Đại học al-Qarawiyyin"
  building_al_qarawiyyin_university_01_desc: "Được thành lập bởi các thương nhân và người di cư từ Kairouan, quần thể rộng lớn này đã trở thành một trong những trung tâm giáo dục bậc cao danh giá nhất của thế giới Hồi giáo phương Tây. Nơi đây thu hút học giả từ những vùng đất xa xôi và đào tạo tầng lớp tinh hoa địa phương trong các lĩnh vực học thuật cao cấp.\nTrường #italic madrasa#! bao gồm nhiều sảnh và phòng, cung cấp chỗ nghỉ ngơi cho sinh viên ngoại quốc, với #italic Sahn#! làm sân trung tâm cho các cuộc thảo luận công cộng."
 #Kairouan Basins
  building_type_kairouan_basins_01: "$building_kairouan_basins_01$"
  building_type_kairouan_basins_01_desc: "$building_kairouan_basins_01_desc$"
  building_kairouan_basins_01: "Hồ Chứa Nước Kairouan"
  building_kairouan_basins_01_desc: "Được xây dựng để cung cấp nước ngọt cho thành phố trong những thời điểm khó khăn, các bể chứa khổng lồ này làm sạch nước mưa bằng cách lắng cặn và lọc bỏ trầm tích.\nHệ thống bao gồm nhiều khu vực liên thông, từ một bể nhỏ, đến một bể lớn hơn, và cuối cùng là một bể nước xây bằng đá được trang trí."
 #Ghana Palace
  building_type_ghana_palace_01: "$building_ghana_palace_01$"
  building_type_ghana_palace_01_desc: "$building_ghana_palace_01_desc$"
  building_ghana_palace_01: "Cung điện Ghana"
  building_ghana_palace_01_desc: "Được bao quanh bởi một khu rừng linh thiêng là cung điện của các #italic Ghana#! — những thủ lĩnh hoàng gia của thành phố.\nQuần thể được xây dựng từ đá sa thạch và gạch bùn, được bảo vệ bởi một khu vực khép kín có cổng. Các bức tường phủ đầy những phù điêu và chạm khắc rực rỡ sắc màu. Là một công trình đồ sộ, cung điện này thống trị toàn bộ khu dân cư xung quanh."
 #Visegrad Citadel
  building_type_visegrad_castle_01: "$building_visegrad_castle_01$"
  building_type_visegrad_castle_01_desc: "$building_visegrad_castle_01_desc$"
  building_visegrad_castle_01: "Pháo đài Visegrad"
  building_visegrad_castle_01_desc: "Pháo đài này là một hệ thống tường thành và tháp canh hoành tráng, không thể xuyên thủng. Nó bảo vệ khúc quanh sông Danube và kiểm soát tuyến thương mại trù phú.\nPháo đài Visegrad gồm một phần hạ thành với tháp lục giác hùng mạnh hướng ra sông, và một khu thượng thành nằm trên đỉnh đồi cao. Công trình phòng thủ hình tam giác đồ sộ này vừa là nơi cư trú vừa là một khu săn bắn xa hoa."
 #Archcollegiate Church of St. Mary and St. Alexius in Tum
  building_type_wawel_cathedral_01: "$building_wawel_cathedral_01$"
  building_type_wawel_cathedral_01_desc: "$building_wawel_cathedral_01_desc$"
  building_wawel_cathedral_01: "Nhà thờ Hiệp sĩ Thánh Maria và Thánh Alexius"
  building_wawel_cathedral_01_desc: "Được xây dựng từ đá gneiss và đá vôi với sự trợ giúp của các thợ thủ công đến từ Đức, nhà thờ đá đồ sộ này là một trong những công trình đầu tiên thuộc loại hình này trên đất Ba Lan và là minh chứng cho quyền lực của Giáo hội.\nNhững bức tường dày mang đến cho tín đồ lời hứa về sự cứu rỗi và sự bảo vệ cần thiết trong cõi trần. Tháp phía tây được cho là mang dấu vết móng vuốt của Quỷ dữ, minh chứng cho tiềm năng phòng thủ của công trình."
  building_wawel_cathedral_02: "Nhà thờ Tổng Hiệp sĩ Thánh Maria và Thánh Alexius"
  building_wawel_cathedral_02_desc: "$building_wawel_cathedral_01_desc$\nSau khi được nâng lên hàng Tổng Hiệp sĩ, công trình nay được quản lý bởi một hội đồng giáo sĩ, một tổ chức chỉ bao gồm các tu sĩ. Quy mô và sự lộng lẫy của nó thật tráng lệ, nhưng vì không phải là trụ sở của một giám mục, nó không mang danh hiệu nhà thờ chính tòa."
  building_wawel_cathedral_03: "Nhà thờ Chính tòa Thánh Maria và Thánh Alexius"
  building_wawel_cathedral_03_desc: "$building_wawel_cathedral_01_desc$\nSau khi đầu tư nguồn lực đáng kể, Giáo hoàng cuối cùng đã thành lập một giáo phận mới tại đây, cùng với trụ sở của một giám mục. Cuối cùng, công trình kiêu hãnh này có thể được gọi là một nhà thờ chính tòa."
 #Vatapi Caves
  building_type_vatapi_caves_01: "$building_vatapi_caves_01$"
  building_type_vatapi_caves_01_desc: "$building_vatapi_caves_01_desc$"
  building_vatapi_caves_01: "Hang động Vatapi"
  building_vatapi_caves_01_desc: "Được xây dựng bởi triều đại Chalukya sơ kỳ, những hang động linh thiêng này được đục sâu vào một khối sa thạch hùng vĩ. Bên trong là một thế giới nội tâm thánh thiện và tĩnh lặng.\nMột cổng khải hoàn dẫn lối cho người hành hương tiến vào mặt đá nguyên khối của ngọn núi. Các hang động được trang trí bằng tượng thờ của tất cả các tôn giáo lớn tại Ấn Độ."
 #Golden fort of Jaisalmer
  building_type_jaisalmer_fort_01: "$building_jaisalmer_fort_01$"
  building_type_jaisalmer_fort_01_desc: "$building_jaisalmer_fort_01_desc$"
  building_jaisalmer_fort_01: "Pháo đài Vàng"
  building_jaisalmer_fort_01_desc: "Những bức tường vàng óng của Jaisalmer không chỉ bao bọc một công trình phòng thủ mà là cả một thành phố, nằm giữa sa mạc Thar.\nKhi mặt trời lặn, các bức tường được cho là chuyển sang màu mật ong ấm áp, còn ban ngày chúng khiến thành phố hòa lẫn với cảnh quan xung quanh."

