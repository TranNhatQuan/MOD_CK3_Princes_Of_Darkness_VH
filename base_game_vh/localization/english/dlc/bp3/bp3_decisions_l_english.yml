l_english:
  enact_legacy_of_adventurer_decision: "Di sản của [GetPlayer.GetHouse.GetBaseNameNoTooltip]"
  enact_legacy_of_adventurer_decision_desc: "Qua năm tháng, doanh trại khiêm tốn của ta đã lớn mạnh cả về quy mô lẫn tinh thần.\n\nVới mỗi nhiệm vụ hoàn thành, mối gắn kết của chúng ta với vùng đất này và con người nơi đây càng bền chặt. Chiến công của chúng ta được ca tụng trong quán rượu và tên tuổi được thì thầm trong bóng tối, và sẽ còn như vậy qua nhiều thế hệ."
  enact_legacy_of_adventurer_decision_confirm: "Vì [GetPlayer.GetPrimaryTitle.GetNameNoTooltip]!"
  enact_legacy_of_adventurer_decision_tooltip: "Củng cố vị thế của [house|E] [GetPlayer.GetHouse.GetBaseNameNoTooltip] trong thế giới của [adventurers|E]"
  have_enough_followers_tt: "Ngài có ít nhất #V 15#! [followers|E] #weak (#color_white [GetPlayer.MakeScope.ScriptValue('tally_current_followers')]#!)#!"
  have_enough_patrons_tt: "Ngài có ít nhất #V 5#! người trong [contact_list|E] của mình #weak (#color_white [GetPlayer.MakeScope.ScriptValue('tally_roll_of_patrons')]#!)#!"
  has_max_level_pavilion_tt: "[GetDomicileBuilding('camp_main_01').GetName] [building|E] của Ngài đang ở Cấp #V 4#! #weak (#color_white [GetPlayer.MakeScope.ScriptValue('camp_pavillion_level')]#!)#!"
  has_enough_contracts_tt: "Ngài đã hoàn thành #V [contract_tally]/50#! [task_contracts|E] không phải [criminal|E]"
  legacy_adventurer_legitimacy_on_landing: "Nếu bất kỳ [adventurer|E] nào thuộc [house|E] [GetPlayer.GetHouse.GetBaseName] trở thành một [ruler|E]:\n$BULLET$ Họ sẽ nhận được [legitimacy_i][GetPlayer.MakeScope.ScriptValue('massive_legitimacy_gain')|+0] [legitimacy|E]\n$BULLET$ Với mỗi [follower|E] họ từng có, họ sẽ nhận được [soldier_i] #P 25#! [levies|E]"
  criminal_contracts_blocked_tt: "@warning_icon! #warning Ngài sẽ không còn có thể nhận các [task_contracts|E] [criminal|E]#!"
  task_successful_noncrim_contract_count_effect_tt: "Ngài đạt tiến triển trong [decision|E] $enact_legacy_of_adventurer_decision$"
  remnants_adventurer_army: "Tàn quân của [prev_title.GetNameNoTooltip]"

  legacy_adventurer_house_modifier: "Dòng máu Phiêu lưu"
  legacy_adventurer_house_modifier_desc: "Gia tộc này coi trọng lối sống của một kẻ phiêu lưu, và không phải bận tâm đến các vấn đề triều chính.\n[adventurer_i] [task_contract|E] [prestige|E] Phần thưởng: [prestige_i]#P +15%#!"

  bp3_decisions.0100.t: "$enact_legacy_of_adventurer_decision$"
  bp3_decisions.0100.desc: "Với tất cả những ai đi theo ta, ta mang đến một nơi an toàn để nghỉ ngơi và cơ hội để ghi dấu ấn của mình lên thế giới.\n\nTrong thế giới của ta, không có chỗ cho tham nhũng tràn lan hay những trò mờ ám, và mọi việc chúng ta làm đều vì sự thịnh vượng của những vùng đất ta băng qua — đó chính là ý nghĩa của việc trở thành một [GetPlayer.GetHouse.GetBaseName].\n\nChừng nào ta còn lãnh đạo [GetPlayer.GetPrimaryTitle.GetName], chúng ta sẽ trừng phạt kẻ ác!"
  bp3_decisions.0100.a: "Tiến lên, hỡi những người theo ta!"
  bp3_decisions.0100.a_tt: "Tạo tối đa #V 3#! [justicar_task_contracts|E] trên bản đồ"
  bp3_decisions.0100.b: "Dẫu vậy, ta vẫn khao khát đất đai..."
