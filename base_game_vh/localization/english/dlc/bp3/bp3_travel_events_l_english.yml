l_english:
 
  travel_events_bp3.1.t: "Những mùa đổi thay"
  travel_events_bp3.1.desc: "Khi chúng Ta chuẩn bị lên đường vào buổi sáng, Ta thấy [ROOT.Char.Custom2('RelationToMeShort', friendly_character)] của mình là [friendly_character.GetFirstName] đứng một mình bên ngoài trại. Khi Ta bước tới để nói chuyện với [friendly_character.GetHerHim], Ta nhận ra có sự thay đổi trong gió.\n\n"
  travel_events_bp3.1.desc.spring: "Một làn gió ấm bất ngờ khẽ vuốt qua mặt Ta trong chốc lát, một sự khác biệt rõ rệt so với cái lạnh mà chúng Ta đã trải qua gần đây. Cuối cùng thì mùa xuân cũng đã đến."
  travel_events_bp3.1.desc.summer: "Một luồng gió ấm làm lay động quần áo Ta trong giây lát, và Ta nhận ra ánh nắng dễ chịu đang chiếu xuống trại. Những dấu hiệu của những ngày ấm áp sắp tới."
  travel_events_bp3.1.desc.autumn: "Một cơn gió thu mát lành lan khắp trại, cuốn theo lá cây và bụi bặm từ mặt đất. Mùa hè đã ở lại phía sau, đã đến lúc chuẩn bị cho cái lạnh của mùa thu và mùa đông."
  travel_events_bp3.1.desc.autumn_desert: "Một cơn gió thu mát lành lan khắp trại, cuốn theo cát và bụi từ mặt đất. Mùa hè đã ở lại phía sau, đã đến lúc chuẩn bị cho cái lạnh của mùa thu và mùa đông."
  travel_events_bp3.1.desc.winter: "Ta kéo chặt áo quanh người khi một cơn gió lạnh thổi mạnh vào lưng. Cái lạnh thì thầm rằng đã đến lúc mùa đông quay trở lại, thêm một lần nữa."
  travel_events_bp3.1.desc.winter_snow: "Ta kéo chặt áo quanh người khi một cơn gió lạnh thổi mạnh vào lưng, và Ta thấy những dấu hiệu đầu tiên của tuyết. Cái lạnh thì thầm rằng đã đến lúc mùa đông quay trở lại, thêm một lần nữa."
  travel_events_bp3.1.desc.dry_season: "Một cơn gió khô thổi qua trại, để lại một làn bụi mờ phía sau. Mùa khô đã tới, hãy hy vọng nó sẽ không ảnh hưởng quá nhiều đến hành trình của chúng Ta."
  travel_events_bp3.1.desc.rainy_season: "Một cơn gió giật kéo áo Ta trong giây lát và trời bắt đầu mưa nhẹ, nhưng những đám mây xám đậm trên đầu như đang gào thét rằng một cơn bão đang hình thành."
  travel_events_bp3.1.a: ""Lại đến lúc của [ROOT.Char.Custom('GetSeason')] rồi nhỉ?""
  travel_events_bp3.1.b: ""Quay lại lên ngựa đi, [friendly_character.GetFirstNameNoTooltip].""
  travel_events_bp3.1.b.flavor: ""Chúng ta sẽ có thừa thời gian để ngắm cảnh khi di chuyển tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].""

  travel_events_bp3.5.t: "Mắc kẹt ngoài trời"
  travel_events_bp3.5.desc.snow: "Ngay khi chúng Ta chuẩn bị khởi hành, tuyết bắt đầu rơi. Ta không khỏi rủa xả vận rủi của mình, nhưng Ta đã thấy mây kéo tới từ trước. Và có vẻ nó sẽ không sớm dứt.\n\nNếu muốn kịp hành trình đúng hạn thì chúng Ta phải lên đường, nhưng cưỡi ngựa xuyên qua bão tuyết thì ít nhất cũng rất nguy hiểm."
  travel_events_bp3.5.desc.rain: "Ngay khi chúng Ta chuẩn bị khởi hành, mưa bắt đầu trút xuống. Mưa, trải dài đến tận chân trời. Ta không khỏi rủa xả vận rủi của mình, nhưng Ta đã thấy những đám mây đen kéo tới từ trước.\n\nNếu muốn kịp hành trình đúng hạn thì chúng Ta phải lên đường, nhưng đây sẽ là một chuyến đi đầy rủi ro với thời tiết như thế này."
  travel_events_bp3.5.a: "Ta cho rằng đây là một cơ hội để nghỉ ngơi."
  travel_events_bp3.5.b.snow: "Một chút tuyết thì chẳng hại ai đâu."
  travel_events_bp3.5.b.rain: "Một chút mưa thì chẳng hại ai đâu."
  travel_events_bp3.5.b.tt: "Các thành viên [entourage|E] có thể mắc [trait|E] #color_white [GetTrait('ill').GetName(GetNullCharacter)]#!"

  travel_events_bp3.10.t: "Những người hành hương đến [holy_location.GetNameNoTooltip]"
  travel_events_bp3.10.desc: "Khi chúng Ta ngồi bên đống lửa trại sau một ngày dài, một nhóm lữ khách tiến đến trong bóng tối. "
  travel_events_bp3.10.desc.holy_order: "Một toán hiệp sĩ, dẫn đầu bởi một [holy_order_character.GetWomanMan] trông đầy kiêu hãnh. Mỗi hiệp sĩ đều có vẻ giàu có hơn người trước.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thật vinh hạnh được gặp ngài. Ta là [holy_order_character.GetName] của [grandmaster.GetPrimaryTitle.GetName]. Chúng Ta đã trải qua một hành trình dài để tới [holy_location.GetName], và cần nghỉ ngơi trước chặng cuối, liệu chúng Ta có thể chung lửa trại với ngài không?\""
  travel_events_bp3.10.desc.pilgrims: "Họ trông như một đám hành hương lạc lối, dẫn đầu bởi một [pilgrim_character.GetWomanMan] với vẻ ngoài tiều tụy. Dù ấn tượng ban đầu là vậy, Ta nhận ra họ đều mang theo những vật có giá trị nào đó.\n\n\"Xin hãy cho phép, [ROOT.Char.Custom('FormOfAddressForLiege')], chúng Ta được nghỉ chân bên lửa trại của ngài? Chúng Ta đã trải qua một hành trình dài...\""
  travel_events_bp3.10.a: ""Nào, nào! Hãy tận hưởng lửa trại của chúng ta và kể cho chúng ta nghe về chuyến đi của các người!""
  travel_events_bp3.10.b: ""Chúng ta có thể cùng nhau đi tới [holy_location.GetNameNoTooltip].""
  travel_events_bp3.10.c.holy_order: ""#emp Phục kích! Bảo vệ trại!#!""
  travel_events_bp3.10.c.pilgrims: ""Ồ, ta sẽ giúp các ngươi trút bỏ gánh nặng...""
  travel_events_bp3.10.c.flavor: "Sẽ chẳng ai để ý nếu vài người hành hương bị lạc trên đường đi, đúng không?"
  travel_events_bp3.10.d: ""Không, ở đây không có chỗ cho các người.""

  holy_pilgrims_travel_modifier: "Dẫn đường cho người hành hương"
  holy_pilgrims_travel_modifier_desc: "Đoàn tùy tùng này đang bảo vệ một nhóm hành hương trên đường tới thánh địa."

  holy_knights_travel_modifier: "Du hành cùng các hiệp sĩ"
  holy_knights_travel_modifier_desc: "Đoàn tùy tùng này được bảo vệ bởi một nhóm hiệp sĩ dũng cảm."

  travel_events_bp3.15.t: "Những khúc ca về [liege.GetTitledFirstNameNoTooltip]"
  travel_events_bp3.15.desc: "Khi chúng ta đi qua vùng ngoại ô của [location.GetName], chúng ta bất chợt nhìn thấy một [bard_character.GetWomanMan] vui vẻ ở phía xa. Vừa nhảy múa, vừa ca hát cho chính mình nghe, [bard_character.GetSheHe] quả là một nhân vật khá đặc biệt.\n\n\"Các ngài có muốn nghe vài bài hát của ta về "
  travel_events_bp3.15.desc.murderer: "#emp '[liege.GetFirstName] con cóc bạo ngược của [liege.GetCulture.GetName]'#!"
  travel_events_bp3.15.desc.lustful.man: "#emp '[liege.GetFirstName] kẻ trăng hoa của [liege.GetPrimaryTitle.GetName]#!'#!"
  travel_events_bp3.15.desc.lustful.woman: "#emp '[liege.GetFirstName] ả trụy lạc của [liege.GetPrimaryTitle.GetName]#!'#!"
  travel_events_bp3.15.desc.gluttonous: "#emp '[liege.GetFirstName] con lợn của triều đình [liege.GetCulture.GetName]'#!"
  travel_events_bp3.15.desc.fool: "#emp '[liege.GetFirstName] kẻ ngốc nghếch của [liege.GetPrimaryTitle.GetAdjective]'#!"
  travel_events_bp3.15.desc.craven: "#emp '[liege.GetFirstName] kẻ nhát gan [liege.GetTitleAsNameNoTooltip]'#!"
  travel_events_bp3.15.desc.outro: "?!\" [bard_character.GetSheHe|U] hét lên khi chúng Ta vừa đủ gần để nghe thấy. Trước khi chúng Ta kịp đáp lời, [bard_character.GetSheHe] đã bắt đầu hát một khúc ca vui nhộn về những thói đồi bại của [liege.GetTitledFirstNameNoTooltip]."
  travel_events_bp3.15.a: ""Hãy kể ta nghe thêm về [liege.GetTitleAsNameNoTooltip].""
  travel_events_bp3.15.a.tt: "Ngài có thể biết được một trong những [secrets|E] của [liege.GetFirstNamePossessive]"
  travel_events_bp3.15.b: ""Ngươi trông khá thú vị đấy, [bard_character.GetWomanMan], có muốn đi cùng ta không?""
  travel_events_bp3.15.c: ""Câm miệng lại, đồ dân đen hèn hạ!""

  travel_events_bp3.20.t: "[SCOPE.Custom('LocalGuildsLoc')]"
  travel_events_bp3.20.desc: "Khi đoàn tùy tùng của Ta đi qua [ROOT.Char.GetCurrentLocation.GetName], chúng Ta bắt chuyện với một đại diện của [SCOPE.Custom('LocalGuildsLoc')] địa phương, một [merchant_character.GetWomanMan] nhiệt tình và đầy sức hút tên là [merchant_character.GetFirstName].\n\n\"Từ [ROOT.Char.GetPrimaryTitle.GetNameNoTier], phải không? Thực ra chúng Ta đang quan tâm đến việc mở một xưởng tại [new_home_province.GetName]. Ngài có thể giúp chúng Ta một việc chứ?\" [merchant_character.GetSheHe|U] nháy mắt với Ta và đặt một đồng xu lên bàn."
  travel_events_bp3.20.a: ""Ở [new_home_province.GetNameNoTooltip]] ư? Được thôi, tại sao không!""
  travel_events_bp3.20.b: ""Đưa tiền trực tiếp cho ta, và ta có thể xoay xở được việc này...""
  travel_events_bp3.20.b.tt: "Chắc chẳng ai phiền nếu chúng ta lách qua vài luật lệ và quy định để thương vụ này thành công đâu."
  travel_events_bp3.20.c: ""Vậy thì hãy kể ta nghe thêm về công việc kinh doanh và thành phố xinh đẹp của các ngươi.""

  travel_events_bp3.25.t: "Gánh nặng của chiến tranh"
  travel_events_bp3.25.desc: "Khi chúng Ta đi qua các con phố của [ROOT.Char.GetCurrentLocation.GetName], một đoàn binh sĩ xuất hiện từ một con hẻm bên cạnh. Hầu hết họ đều bị thương và được những thường dân tiều tụy dìu đỡ.\n\nMột viên truyền lệnh đứng hiên ngang trước đám đông đang tụ tập quanh chợ và tuyên bố lớn tiếng: \"Chúng ta đã lại nghiền nát lũ chó [opponent.GetPrimaryTitle.GetAdjective] ấy! Chỉ còn là vấn đề thời gian trước khi chiến thắng thuộc về ta!\"\n\n"
  travel_events_bp3.25.desc.outro: "Thế nhưng những lời ăn mừng ấy trở nên nhạt nhòa khi Ta nhìn vào những người lính bị thương và thân nhân đang than khóc của họ."
  travel_events_bp3.25.desc.outro.sadistic: "Thế nhưng Ta không thể nhịn cười khi nhìn những kẻ ngu ngốc đã hủy hoại cuộc đời mình."
  travel_events_bp3.25.a: "Ta sẽ quyên góp vài đồng cho những kẻ khốn khổ này."
  travel_events_bp3.25.b: "Có lẽ họ có chút kinh nghiệm để chia sẻ từ những trận chiến?"
  travel_events_bp3.25.b.insulted: "Ngài xúc phạm những người sống sót"
  travel_events_bp3.25.b.stories: "Ngài nghe được vài câu chuyện về các trận chiến"
  travel_events_bp3.25.b.martial: "Ngài nghe về những sai lầm chiến lược của [liege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  travel_events_bp3.25.b.prowess: "Ngài nghe về cách [liege.GetPrimaryTitle.GetAdjectiveNoTooltip] đã chiến đấu"
  travel_events_bp3.25.c: "Thôi nào... Đủ u ám rồi, chúng ta còn phải lên đường."

  travel_events_bp3.30.t: "Đám lính đánh thuê của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
  travel_events_bp3.30.desc: "Chúng Ta đang ngồi trong một quán rượu yên tĩnh ở [ROOT.Char.GetCurrentLocation.GetName], thì một toán lính đánh thuê trông rách rưới ồn ào xông vào. Tên thủ lĩnh thô lỗ của chúng đẩy một lính gác của Ta sang bên và ngang nhiên ngồi xuống bàn của Ta.\n\n\"Một vị [ROOT.Char.GetWomanMan] cao quý, hả? '[ROOT.Char.GetLadyLord]' của Ta? Có hứng thú với dịch vụ của toán lính đánh thuê tốt nhất ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]] không? Những kẻ trung thành hơn thì ngài sẽ không bao giờ tìm thấy đâu! Ít nhất là nếu ngài trả đủ tiền...\""
  travel_events_bp3.30.a: "\"Bài #emp hay nhất#! sao? Ngươi đã thu hút sự chú ý của ta rồi đấy...\""
  travel_events_bp3.30.b: ""Ngươi có muốn gia nhập đội của ta không?""
  travel_events_bp3.30.c: ""Ta có công việc #emp hoàn hảo#! cho các ngươi.""
  travel_events_bp3.30.d: ""Không, ta chỉ ở đây để nghỉ ngơi một chút thôi.""
  travel_events_bp3.30.e: ""#bold #emp Cái gì cơ?#!#!""

  mercenary_army_default: "Lính đánh thuê"

  travel_events_bp3.35.t: "Người thầy của các hiệp sĩ"
  travel_events_bp3.35.desc.traveling: "Trong lúc đi qua các con phố của [ROOT.Char.GetCurrentLocation.GetName], [kid_character.GetFirstName] bất ngờ chạy về phía một con hẻm. Cả đoàn tùy tùng đều giật mình và chạy theo [kid_character.GetHerHim], chỉ để thấy [kid_character.GetHerHim] đang vung một thanh kiếm gỗ méo mó về phía một [soldier_character.GetWomanMan] già nua.\n\n\"Đó là tất cả những gì con làm được sao, tiểu [kid_character.Custom('GetPrincessPrince')]?\" Ông ta quay về phía chúng Ta sau khi trêu chọc [kid_character.GetFirstNameNoTooltip] đang tức giận,"
  travel_events_bp3.35.desc.home: "Trong lúc đi qua các con phố của [ROOT.Char.GetCurrentLocation.GetName], chúng Ta thấy một đám trẻ nông dân tụ tập quanh một [soldier_character.GetWomanMan] già nua trong một con hẻm nhỏ. Nhiều đứa trong số chúng đang vung những thanh kiếm gỗ méo mó và hét lên đầy phấn khích khi cố gắng đánh trúng [soldier_character.GetHerHim].\n\n\"Ai mà ấn tượng với bộ pháp như thế chứ, hả?\" [soldier_character.GetSheHe|U] quay về phía chúng Ta sau khi trêu chọc một đứa trẻ,"
  travel_events_bp3.35.outro.non_martial_gender: "cúi nhẹ đầu chào ta. \"Ta có thể giúp gì cho Ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]? Ta hy vọng mình không mạo phạm, ta chỉ đang chỉ dẫn cho vài đứa trẻ cách sử dụng kiếm mà thôi.\""
  travel_events_bp3.35.outro.martial_gender: "và nhận xét với một nụ cười nhếch mép: \"Ngài cũng muốn tham gia chứ, [ROOT.Char.Custom('FormOfAddressForLiege')]? Ta nghĩ ngài hơi lớn tuổi hơn nhóm thường ngày của Ta đấy.\""
  travel_events_bp3.35.a.travel: ""Ta muốn ngươi tiếp tục dạy [kid_character.GetFirstNameNoTooltip].""
  travel_events_bp3.35.a.home: ""Ngươi có sẵn sàng đến [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] để giảng dạy không?""
  travel_events_bp3.35.a.tt: "Cải thiện kết quả [education|E] của [ward|E] là [kid_character.GetFirstName]"
  travel_events_bp3.35.b.martial: ""Được thôi, ta sẽ thử xem.""
  travel_events_bp3.35.b.non_martial: ""Thực ra ta cũng muốn thử sức mình...""
  travel_events_bp3.35.b.win: "Ngài thắng cuộc đấu tay đôi"
  travel_events_bp3.35.b.lose: "Ngài thua cuộc đấu tay đôi, nhưng [soldier_character.GetSheHe] giúp Ngài mài giũa kỹ năng"
  travel_events_bp3.35.c.travel: ""Cảm ơn vì đã tìm thấy [kid_character.Custom('GetDaughterSon')] của ta.""
  travel_events_bp3.35.c.home: ""Không, ta chỉ đứng xem thôi.""

  knight_teacher_modifier: "Người Dạy Dỗ Hiệp Sĩ"
  knight_teacher_modifier_desc: "Một hiệp sĩ già đã dành cả cuộc đời để chiến đấu và dạy dỗ người khác.\n\nCải thiện [education|E] của [ward|E]"

  travel_events_bp3.40.t: "Cuộc Tỷ Thí Võ Nghệ"
  travel_events_bp3.40.desc: "Khi chúng ta đi qua khu chợ ở [ROOT.Char.GetCurrentLocation.GetName] thì nghe thấy một tiếng hét lớn và vô tình bắt gặp một cuộc ẩu đả đang diễn ra giữa hai [soldier_character.GetWomenMen], được một nhóm người quan sát chặt chẽ.\n\nĐám đông reo hò dữ dội khi một trong số họ bị quật ngã khỏi đôi chân [soldier_character.GetHerHis], mặt úp trang nghiêm xuống đất, qua đó kết thúc trận đấu.\n\n\"Ai tiếp theo?!\" [soldier_character.GetWomanMan] hét lên với đám đông, và ánh mắt [soldier_character.GetHerHis] dừng lại ở nhóm chúng ta. "
  travel_events_bp3.40.outro.challenger: "Bên cạnh ta, [challenger_character.GetTitledFirstName] khịt mũi đáp lại lời thách thức."
  travel_events_bp3.40.fallback: "Khuôn mặt [soldier_character.GetHerHis|U] tách ra thành một nụ cười hiểm độc khi [soldier_character.GetSheHe] nhìn về phía chúng ta."
  travel_events_bp3.40.a: "\"Ta sẽ làm.\""
  travel_events_bp3.40.b: "\"Đi nào, ngươi làm được mà [challenger_character.GetFirstNameNoTooltip]!\""
  travel_events_bp3.40.c: "Có vẻ như đã đến lúc rời đi..."

  travel_events_bp3.40.win: "Thắng trong trận đấu tay đôi"
  travel_events_bp3.40.lose: "Thua trong trận đấu tay đôi"

  travel_events_bp3.45.t: "Hiệp Sĩ Lang Thang"
  travel_events_bp3.45.desc: "Khi chúng ta đi dọc các con phố của [ROOT.Char.GetCurrentLocation.GetName], có một sự náo loạn lớn tại một quầy hàng trong chợ, với hai [knight_character.GetWomenMen] đang hét vào mặt nhau. Trước khi chúng ta kịp tiến đến, một [knight_character.GetWomanMan] đã bước vào giữa và xoa dịu tình hình.\n\n\"Thấy chưa, sẽ ổn thôi mà?\" [knight_character.GetSheHe|U] mỉm cười nói với [knight_character.GetWomanMan] trong quầy hàng, và trao cho [knight_character.GetHerHim] một [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')]. Và với hành động tử tế giản đơn ấy, mọi chuyện trở lại bình thường.\n\n[knight_character.GetSheHe|U] quay sang chúng ta khi ta tiến lại gần, không có cờ hiệu hay dấu hiệu nào cho biết bất kỳ lãnh chúa nào. Có lẽ là một hiệp sĩ lang thang?"
  travel_events_bp3.45.a: "\"Một hiệp sĩ danh dự như ngươi nên phụng sự một [ROOT.Char.GetLadyLord], như ta.\""
  travel_events_bp3.45.b: "\"Ta có thể mời ngươi một ly không?\""
  travel_events_bp3.45.diplomacy: "Những câu chuyện về lòng hào hiệp"
  travel_events_bp3.45.prowess: "Những câu chuyện về dũng mãnh"
  travel_events_bp3.45.piety: "Những câu chuyện về hiệp nghĩa"
  travel_events_bp3.45.prestige: "Những câu chuyện về lòng quả cảm"
  travel_events_bp3.45.b.flavor: "Có lẽ [knight_character.GetSheHe] có vài câu chuyện để kể?"
  travel_events_bp3.45.c: "Ta không có thời gian cho kẻ lang thang này."

  travel_events_bp3.50.t: "Một Nhóm Hai Người"
  travel_events_bp3.50.desc: "Đi qua một con hẻm phía sau ở [ROOT.Char.GetCurrentLocation.GetName], ta thấy một đứa trẻ cô độc và con chó của [child_character.GetHerHis] đang ngồi trong một góc phía sau một bức tường thấp. \"Đây này, Valor.\" [child_character.GetSheHe|U] nói với nó khi [child_character.GetSheHe] đưa cho nó một mẩu bánh mì nhỏ, không giữ lại chút nào cho [child_character.GetHerselfHimself].\n\nNhìn vào hai kẻ ấy, rõ ràng con chó được chăm sóc tốt hơn chủ của nó rất nhiều. Đứa trẻ hẳn đã cho nó tất cả những gì [child_character.GetSheHe] có thể kiếm được."
  travel_events_bp3.50.a: "\"Đây là chút thức ăn cho ngươi, đứa trẻ.\""
  travel_events_bp3.50.b: "\"Đi theo ta, ta sẽ chăm sóc ngươi.\""
  travel_events_bp3.50.c: "\"Con chó của ngươi? #bold Con chó của ta#!.\""
  travel_events_bp3.50.d: "Ta không có thời gian cho lũ trẻ mồ côi bẩn thỉu."

  heartless_modifier: "Vô Tâm"
  heartless_modifier_desc: "Một kẻ cai trị vô tâm, kẻ cướp bóc của cải từ những đứa trẻ mồ côi."

  kind_ruler_modifier: "Người Cai Trị Nhân Từ"
  kind_ruler_modifier_desc: "Nổi tiếng vì đối xử tử tế ngay cả với những đứa trẻ mồ côi thấp kém nhất."

  travel_events_bp3.55.t: "Thương Nhân Du Hành"
  travel_events_bp3.55.desc: "Khi ta dạo quanh khu chợ của [ROOT.Char.GetCurrentLocation.GetName], một sự náo loạn lớn vang lên chỉ cách ta vài quầy hàng. Có một [merchant_character.GetWomanMan] đang tức giận, kích động và vung vẩy đôi tay [merchant_character.GetHerHis]. \"[republic_ruler.GetTitledFirstName] sẽ lấy đầu ngươi vì chuyện này!\" [merchant_character.GetSheHe|U] hét vào một thương nhân khác, kẻ trông còn giận dữ hơn nữa.\n\n\"Ta rất muốn xem [republic_ruler.GetHerHim] thử làm được gì!\" Chủ quầy hàng phẩy tay dismissing thương nhân kia. Quay người giận dữ về phía các vệ sĩ của [merchant_character.GetHerHis], vị thương nhân rõ ràng định ép buộc một thỏa thuận bằng cách này hay cách khác."
  travel_events_bp3.55.a: "Hãy giúp [merchant_character.GetHerHim], trước khi mọi chuyện vượt khỏi tầm kiểm soát."
  travel_events_bp3.55.a.flavor: "Một cơ hội hoàn hảo để xây dựng quan hệ với [republic_ruler.GetTitledFirstName], nếu chúng ta có thể giúp đỡ thuộc hạ của [republic_ruler.GetHerHis]."
  travel_events_bp3.55.a.tt: "Tạo một [alliance|E] với [republic_ruler.GetName]"
  travel_events_bp3.55.b: "Có vẻ như đây là thời điểm hoàn hảo để kiếm chút tiền..."
  travel_events_bp3.55.b.flavor: "Hãy xem liệu ta có thể ép lấy một ít hàng hóa từ [merchant_character.GetHerHim] với giá rẻ không."
  travel_events_bp3.55.b.win: "Lợi dụng tình thế"
  travel_events_bp3.55.b.lose: "Bị lợi dụng"
  travel_events_bp3.55.c: "Ta sẽ đứng xem màn kịch này."

  travel_events_bp3.60.t: "Một Giao Kèo Nhỏ"
  travel_events_bp3.60.desc: "Khi chúng ta đi qua [ROOT.Char.GetCurrentLocation.GetName], chúng ta bị cuốn vào một đám đông đang chờ một chiếc xe lớn chở đầy vật liệu xây dựng tránh đường.\n\n\"Ta không cần đồ của ngươi, ta đã mua được rẻ hơn ở chỗ khác rồi!\" Một [merchant_character.GetWomanMan] hét vào mặt người kia. Người còn lại trông thất thần và bối rối.\n\n\"Nhưng—nhưng... Vậy ta phải làm gì với đống này đây?\" [merchant_character.GetSheHe|U] yếu ớt đáp lại, nói nhiều hơn với chính [merchant_character.GetHerselfHimself] là với bất kỳ ai khác."
  travel_events_bp3.60.a: "\"Ta sẽ mua toàn bộ vật liệu của ngươi.\""
  travel_events_bp3.60.b: "\"Mang hàng hóa của ngươi đến [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]!\""
  travel_events_bp3.60.c: "\"Tránh đường ra ngay!\""

  travel_extra_building_resources_modifier: "Vật Liệu Xây Dựng Dư"
  travel_extra_building_resources_modifier_desc: "Tỉnh này có một lượng lớn tài nguyên còn dư sẵn sàng được sử dụng cho các dự án xây dựng mới.\n\n"

  MODIFIER_DEFINITION_EXTRA_BUILDING_RESOURCES: "#emp Được sử dụng khi xây dựng một công trình mới#!\nTài nguyên [building|E] còn lại: #bold $MULTIPLIER|0$/3#!"
  modifier_extra_building_resources_desc: "\t#weak Giảm đi cho mỗi lần sử dụng còn lại#!"

  travel_extra_building_resources_character_modifier: "Giao Thương Tài Nguyên"
  travel_extra_building_resources_character_modifier_desc: "Một tuyến thương mại có giá trị giúp dễ dàng tiếp cận vật liệu xây dựng."

  travel_events_bp3.65.t: "Cuộc Truy Đuổi Túi Tiền"
  travel_events_bp3.65.desc: "Khi ta đang xem các quầy hàng trong chợ ở [ROOT.Char.GetCurrentLocation.GetName], ta cảm thấy dây buộc túi tiền của mình bị cắt. Dù phản ứng ngay lập tức, tên trộm đã biến mất trong đám đông.\n\nChỉ nhờ sự trùng hợp thuần túy, một trong các vệ sĩ của ta đã thấy [thief_character.GetWomanMan] khi [thief_character.GetSheHe] chạy vào một con hẻm phía sau. \"Dừng lại, nếu không ta sẽ lấy đầu ngươi!\" Một vệ sĩ của ta hét vào [thief_character.GetHerHim], và tên trộm quay lại, ném cho chúng ta một ánh nhìn giận dữ và láo liên."
  travel_events_bp3.65.a: "\"Ta có một lời đề nghị công việc cho ngươi, hãy coi số tiền đó là khoản thanh toán đầu tiên.\""
  travel_events_bp3.65.b: "\"Tên trộm bẩn thỉu, ngươi nghĩ mình có thể trộm của #bold #emp ta#!#! sao?\""
  travel_events_bp3.65.c: "\"Trả lại tiền, và chúng ta coi như xong.\""

  travel_events_bp3.70.t: "Lễ Hội [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
  travel_events_bp3.70.desc: "Khi chúng ta bước vào [ROOT.Char.GetCurrentLocation.GetName], ta nhận thấy bầu không khí vui vẻ và những đồ trang trí mang dáng vẻ lễ hội khắp thành phố. Trước khi kịp nhận ra, toàn bộ đoàn tùy tùng của ta đã bị cuốn vào các hoạt động lễ hội.\n\n"
  travel_events_bp3.70.desc.entourage: "\"Nơi này thật thân thiện, ngươi không thấy vậy sao?\" [dancing_partner.GetFirstName] hỏi ta, khi cả hai cùng khiêu vũ giữa đám đông."
  travel_events_bp3.70.desc.local: "\"Chào mừng đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!\" Một [local_character.GetWomanMan] mà ta kết thúc việc khiêu vũ cùng nói đầy hào hứng, khi [local_character.GetSheHe] đặt bàn tay [local_character.GetHerHis] lên tay ta."
  travel_events_bp3.70.desc.outro: " Ta nghe thấy một tiếng reo hò lớn từ tất cả những người xung quanh khi các nhạc công kết thúc một bản nhạc và bắt đầu bản tiếp theo."
  travel_events_bp3.70.a: "Ước gì [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] cũng được như thế này..."
  travel_events_bp3.70.a.cultural_acceptance: "[cultural_acceptance|E] cần để [hybridize|E] với [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName] giảm #color_white 25%#!"
  travel_events_bp3.70.a.counties: "Có thể [hybridize|E] với [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName] ngay cả khi không có [counties|E] nào trong [realm|E] của Ngài mang [culture|E]"
  travel_events_bp3.70.b: "Cảm giác này giống như ở nhà vậy!"

  travel_events_bp3.75.t: "Những Giấc Mơ Đang Ủ"
  travel_events_bp3.75.desc: "Đi ngang qua một quảng trường chợ nhỏ ở [ROOT.Char.GetCurrentLocation.GetName], ta thấy một [brewmaster_character.GetWomanMan] đang phát đồ uống cho tất cả những ai đi ngang qua. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [brewmaster_character.GetSheHe] nói khi [brewmaster_character.GetSheHe] đưa cho ta một chiếc cốc. Hương thơm của [ROOT.Char.Custom('RegionalDrink')] lập tức xộc vào mũi ta, và ta thấy thứ bia bên trong khẽ xoáy nhẹ khi ta nhận lấy. Giống như những người khác, ta uống cạn trong một hơi, và nó #emp kinh ngạc thay#! ngon.\n\n\"Có chấp nhận được không, [ROOT.Char.Custom('FormOfAddressForLiege')|U]?\" [brewmaster_character.GetSheHe|U] hỏi với một ánh nhìn tò mò trong đôi mắt [brewmaster_character.GetHerHis], và nhìn ta đầy tha thiết khi [brewmaster_character.GetSheHe] tiếp tục. \"Giá mà ta có một nơi nào đó để có thể làm ra nhiều hơn như thế này...\""
  travel_events_bp3.75.a: "\"[target_barony.GetNameNoTierNoTooltip] đang cần một người như ngươi.\""
  travel_events_bp3.75.b: "\"Hãy chuyển việc làm ăn của ngươi đến đất của ta và gia nhập triều đình của ta.\""
  travel_events_bp3.75.c: "\"Cảm ơn, rất tuyệt!\""

  travel_events_bp3.80.t: "Một Cuộc Đời Phụng Sự"
  travel_events_bp3.80.desc.holy_order: "Khi chúng ta đang thăm một [ROOT.Char.Custom('GetFaithTemple')] ở [ROOT.Char.GetCurrentLocation], ta nhận thấy [monk_character.GetFirstName] đang trò chuyện say sưa với một [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] đang du hành. [monk_character.GetSheHe|U] dường như bám lấy từng lời nói, đôi mắt [monk_character.GetHerHis] sáng lên vì hứng thú.\n\n\"[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U], ta đã quyết định mình muốn làm gì với cuộc đời mình.\" [monk_character.GetSheHe|U] long trọng nói với ta khi ta bước đến gần họ. Vị [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] gật đầu và vỗ nhẹ vào lưng [monk_character.GetHerHim], rõ ràng đang cố gắng ủng hộ [ROOT.Char.Custom2('RelationToMeShort', monk_character)] của ta và quyết định của [monk_character.GetHerHis]. \"Ta muốn dành nó để phụng sự [ROOT.Char.GetFaith.HighGodName] và [grandmaster.GetPrimaryTitle.GetName].\""
  travel_events_bp3.80.desc.monk: "Khi chúng ta đang thăm một [ROOT.Char.Custom('GetFaithTemple')] ở [ROOT.Char.GetCurrentLocation], ta nhận thấy [monk_character.GetFirstName] đang trò chuyện say sưa với một giáo sĩ địa phương. [monk_character.GetSheHe|U] dường như bám lấy từng lời nói, đôi mắt [monk_character.GetHerHis] sáng lên vì hứng thú.\n\n\"[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U], ta đã quyết định mình muốn làm gì với cuộc đời mình.\" [monk_character.GetSheHe|U] long trọng nói với ta khi ta bước đến gần họ. Vị giáo sĩ mỉm cười với ta, rõ ràng đang cố gắng ủng hộ [ROOT.Char.Custom2('RelationToMeShort', monk_character)] của ta và quyết định của [monk_character.GetHerHis]."
  travel_events_bp3.80.desc.adult: "$travel_events_bp3.80.desc.monk$ \"Ta muốn dành nó để phụng sự [ROOT.Char.GetFaith.HighGodName] tại đây ở [ROOT.Char.GetCurrentLocation.GetName].\""
  travel_events_bp3.80.desc.child: "$travel_events_bp3.80.desc.monk$ \"Ta muốn dành nó để phụng sự [ROOT.Char.GetFaith.HighGodName].\""
  travel_events_bp3.80.a: "\"Nếu điều đó khiến ngươi hạnh phúc...\""
  travel_events_bp3.80.b: "\"Hãy nghĩ cho tương lai của mình, [monk_character.GetFirstNameNoTooltip]!\""

  travel_events_bp3.85.t: "Những Thợ Nấu Bia Nổi Danh"
  travel_events_bp3.85.desc.monk: "Khi đi ngang qua [ROOT.Char.GetCurrentLocation.GetName], chúng ta biết rằng mình phải ghé thăm xưởng nấu bia tu viện nổi tiếng của nơi này. Ngay khi bước vào tòa nhà, ta thấy một nhóm người đang được phục vụ tại một chiếc bàn nhỏ gần cửa, trong khi các tu sĩ đang tiến hành công việc của họ ở phía sau."
  travel_events_bp3.85.desc: "Khi đi ngang qua [ROOT.Char.GetCurrentLocation.GetName], chúng ta biết rằng mình phải ghé thăm xưởng nấu bia địa phương nổi tiếng của nơi này. Ngay khi bước vào tòa nhà, ta thấy một nhóm người đang được phục vụ tại một chiếc bàn nhỏ gần cửa, trong khi các thợ nấu bia đang tiến hành công việc của họ ở phía sau."
  travel_events_bp3.85.desc.outro: "\n\nSau khi chờ nhóm trước rời đi, cuối cùng chúng ta cũng được phát cho đồ uống. Ta khẽ xoay nhẹ chiếc cốc trong tay và ngửi thấy mùi hương đặc trưng của bia ale tỏa lên từ bên trong. Thấy mọi người khác đều đang nếm thử, cuối cùng ta cũng tự mình uống một ngụm."
  travel_events_bp3.85.a: "Nó chẳng là gì so với bia ale truyền thống của [brewery_county.GetAdjectiveNoTooltip]."
  travel_events_bp3.85.a.tt: "Do truyền thống nấu bia ở [brewery_county.GetName] đã tồn tại hơn #color_white [brewery_county.MakeScope.ScriptValue('brewery_counter_25')|0]#! năm:"
  travel_events_bp3.85.b: "Ta sẽ mua một ít để mang về nhà."
  travel_events_bp3.85.c: "Không có gì lạ khi nó lại nổi tiếng đến vậy."

  popular_beer_character_modifier: "Bia Ale Phổ Biến"
  popular_beer_character_modifier_desc: "Một loại bia ale nổi tiếng từ phương xa đã trở nên cực kỳ phổ biến tại triều đình."

  travel_events_bp3.90.t: "Người Bảo Trợ của [ROOT.Char.Custom('GetFaithTemple')|U]"
  travel_events_bp3.90.desc: "Tại trung tâm [ROOT.Char.GetCurrentLocation.GetName] là một [ROOT.Char.Custom('GetFaithTemple')] lớn, mọi thứ khác trong thành phố đều xoay quanh nó. Ngay khi chúng Ta bước vào công trình linh thiêng, một [priest_character.GetWomanMan] chạy vội tới.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trông ngài như một [ROOT.Char.GetWomanMan] có của cải, liệu ngài có sẵn lòng quyên góp cho [ROOT.Char.Custom('GetFaithTemple')] của chúng Ta không?\" Vừa cào vừa cúi người, [priest_character.GetSheHe] trơ trẽn chìa tay [priest_character.GetHerHis] ra. Ta thấy có một vài công việc nhỏ đang được thực hiện quanh tòa nhà, nhưng chúng hoàn toàn không đủ để bù đắp cho mọi thiếu sót của [ROOT.Char.Custom('GetFaithTemple')]."
  travel_events_bp3.90.a: "\"Hãy coi ta là người bảo trợ của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!\""
  travel_events_bp3.90.a.flavor: "Với sự hậu thuẫn của ta, nơi này có thể một lần nữa trở thành một địa điểm thờ phụng đúng nghĩa."
  travel_events_bp3.90.b: "\"Dĩ nhiên rồi, một khoản quyên góp nhỏ là điều hợp lẽ.\""
  travel_events_bp3.90.c: "Có vẻ đã đến lúc tiếp tục lên đường..."

  church_investment_modifier: "Nhà Bảo Trợ Mộ Đạo"
  church_investment_modifier_desc: "Nhân vật này đã dành ra tài sản và phương tiện cá nhân để hỗ trợ giới giáo sĩ địa phương.\n\n"

  church_investment_cost_modifier: "Đầu Tư Mộ Đạo"
  church_investment_cost_modifier_desc: "$church_investment_modifier_desc$#emp Có thể bị gỡ bỏ bằng quyết định #color_white Kết Thúc Đầu Tư Mộ Đạo#! [decision|E]#!"

  MODIFIER_DEFINITION_CHURCH_INVESTMENTS: "Hiệu ứng này tăng lên mỗi hai năm, hiện đang được nhân với #bold $MULTIPLIER|0$#!"
  modifier_church_investments_desc: "\t#weak Tăng lên sau mỗi hai năm trôi qua#!"

  end_investments_minor_decision: "Kết Thúc Đầu Tư Mộ Đạo"
  end_investments_minor_decision_desc: "Lũ ký sinh này vẫn chưa hút đủ tiền của ta sao? Ta còn những việc khác để tiêu tiền!"
  end_investments_minor_decision_tooltip: "Kết thúc các khoản đầu tư của Ngài vào [ROOT.Char.Custom('GetFaithTemple')]"
  end_investments_minor_decision_confirm: "Kết Thúc Đầu Tư"

  travel_events_bp3.95.t: "Câu Chuyện Của Người Hành Hương"
  travel_events_bp3.95.desc: "Khi chúng ta đi qua [ROOT.Char.Custom('GetFaithTemple')] tại [ROOT.Char.GetCurrentLocation.GetName], ta tình cờ nghe thấy một nhóm lữ khách đang nhỏ giọng trò chuyện với nhau. Một trong số họ, một [pilgrim_character.GetWomanMan], bắt đầu mô tả và so sánh nơi này với chuyến hành hương của [pilgrim_character.GetHerHis] đến [unvisited_holy_site.GetNameNoTier].\n\nTa không thể không lắng nghe cuộc trò chuyện khi [pilgrim_character.GetSheHe] tiếp tục kể chi tiết về những điều tuyệt vời mà [pilgrim_character.GetSheHe] đã chứng kiến tại [unvisited_holy_site.GetProvince.GetCounty.GetName]. Nhìn quanh nơi này, ta chỉ có thể tưởng tượng rằng nơi đó hẳn phải tuyệt vời hơn nhiều so với cảnh tượng nhỏ bé, thanh nhã mà ta đang thấy ở đây..."
  travel_events_bp3.95.a: "\"Hãy kể thêm cho ta về [unvisited_holy_site.GetNameNoTierNoTooltip]!\""
  travel_events_bp3.95.a.tt: "Du hành tới [unvisited_holy_site.GetName] trong một [pilgrimage|E] sẽ mang lại [piety|E] và [stress_loss|E]"
  travel_events_bp3.95.a.tt.wanderer: "Du hành tới [unvisited_holy_site.GetName] trong một [pilgrimage|E] sẽ mang lại [piety|E], [stress_loss|E], và Kinh nghiệm [wanderer_lifestyle|E]"
  travel_events_bp3.95.a.flavor: "Có lẽ ta có thể thuyết phục [pilgrim_character.GetHerHim] kể thêm về [unvisited_holy_site.GetProvince.GetCounty.GetName]?"
  travel_events_bp3.95.b: "Thật là một câu chuyện thú vị."

  travel_events_bp3.100.t: "Vùng Đất Của Sữa Và... Cá?"
  travel_events_bp3.100.desc: "Khi Ta thức dậy vào sáng sớm, Ta không thể không ngáp thật to. Vươn vai, Ta bước ra khỏi lều và thấy mọi người đã bắt đầu đi lại nhộn nhịp.\n\nTa để ý thấy [friend_character.GetFirstName] đang rời đi với thứ trông như một chiếc cần câu tạm bợ giữa sự ồn ào và náo nhiệt của trại. \"Ngài đi đâu vậy?\" Ta hỏi [friend_character.GetHerHim].\n\n[friend_character.GetSheHe|U] đáp lại với một cái nhún vai thản nhiên, \"Hôm nay là một ngày đẹp để câu cá.\""
  travel_events_bp3.100.a: "\"Nghe cũng là một ý hay đấy.\""
  travel_events_bp3.100.a.flavor: "Quả thật #emp là#! một ngày đẹp để câu cá."
  travel_events_bp3.100.b: "Chúng ta hãy nghỉ lại đây vài ngày."
  travel_events_bp3.100.b.flavor: "Có vẻ đây là một nơi dễ chịu để nghỉ ngơi trước chặng đường tiếp theo."
  travel_events_bp3.100.c: "\"Lên ngựa ngay, [friend_character.GetFirstNameNoTooltip], chúng ta còn nơi phải đến!\""

  travel_events_bp3.105.t: "Một [lifestyle_character.GetWomanMan|U] Với Kỹ Năng Đặc Biệt"
  travel_events_bp3.105.desc: "Sau khi cùng nhau du hành một thời gian, Ta nhận ra có điều gì đó rất đặc biệt ở [lifestyle_character.GetFirstName]."
  travel_events_bp3.105.desc.reveler: "Mỗi khi chúng Ta dừng chân, [lifestyle_character.GetSheHe] luôn là người đầu tiên đi khám phá một thành phố hay ngôi làng mới.\n\nNgay cả tối nay, [lifestyle_character.GetSheHe] lại tiếp tục bắt chuyện và giao lưu với mọi người. Bằng cách nào đó, [lifestyle_character.GetSheHe] khiến ai cũng cảm thấy như ở nhà, ngay cả ở nơi hoang vu này. Có lẽ ta có thể học được điều gì đó từ [lifestyle_character.GetHerHim]?"
  travel_events_bp3.105.desc.blademaster: "Mỗi buổi sáng, [lifestyle_character.GetSheHe] đều thức dậy để luyện tập, vung lưỡi kiếm của [lifestyle_character.GetHerHis] không ngừng.\n\nNgay cả tối nay, trong khi mọi người khác đang bận thưởng thức bữa ăn, [lifestyle_character.GetSheHe] vẫn một mình luyện tập những bài tập đáng kinh ngạc của [lifestyle_character.GetHerHis]. Ta không thể không muốn noi theo một phần lối sống của [lifestyle_character.GetHerHis]."
  travel_events_bp3.105.desc.hunter: "Có lần Ta thấy [lifestyle_character.GetHerHim] bắn hạ một con chim đang bay khi đang di chuyển, như thể đó là việc dễ dàng nhất trần đời.\n\nHôm nay [lifestyle_character.GetSheHe] cùng vài người khác đi săn thức ăn cho cả đoàn và trở về với chiến lợi phẩm. Sự nổi tiếng, số lượng người vây quanh [lifestyle_character.GetHerHim]... Ta không thể không muốn thử sức mình."
  travel_events_bp3.105.desc.mystic: "[lifestyle_character.GetSheHe|U] dường như biết những điều kỳ lạ nhất, thường xuyên rơi vào những cuộc trò chuyện đầy tò mò với những người xung quanh [lifestyle_character.GetHerHim].\n\n[lifestyle_character.GetSheHe|U] đôi khi tiến rất gần tới dị giáo với một số suy nghĩ của [lifestyle_character.GetHerHis], thường xuyên đặt câu hỏi về những điều mà phần còn lại của chúng ta coi là hiển nhiên... Thế nhưng Ta vẫn không thể không cảm thấy rằng [lifestyle_character.GetSheHe] đúng trong rất nhiều quan điểm của [lifestyle_character.GetHerHis]."
  travel_events_bp3.105.desc.physician: "[lifestyle_character.GetSheHe|U] thường xuyên giúp đỡ người khác với những vết thương và trầy xước nhỏ, pha chế các loại cao thuốc đơn giản như không có gì.\n\nKhi chúng Ta đi qua [ROOT.Char.GetCurrentLocation.GetName], Ta thấy [lifestyle_character.GetHerHim] đột ngột chạy tới một đứa trẻ nông dân nhỏ đang khó thở và chuyển sang màu da bất thường trong một con hẻm, và chỉ trong chớp mắt khuôn mặt đứa trẻ đã trở lại bình thường. [lifestyle_character.GetSheHe] đã làm điều đó như thế nào?"
  travel_events_bp3.105.desc.herbalist: "Luôn nhặt các loại thảo mộc hoặc hoa trên đường đi, cẩn thận cất giữ chúng cho những mục đích sau này.\n\nHôm nay Ta nghe [lifestyle_character.GetHerHim] nói rất lâu về đặc tính của một loại thảo mộc mà [lifestyle_character.GetSheHe] đã hái được. Nó có thể được dùng cho cả điều tốt lẫn điều xấu. Có lẽ sở thích này thực sự có giá trị?"
  travel_events_bp3.105.desc.gardener: "Ta nhận thấy [lifestyle_character.GetHerHim] thường là người đầu tiên chạy đi khi chúng ta đặt chân đến một ngôi làng hoặc thành phố mới.\n\nHôm nay ta bắt gặp [lifestyle_character.GetSheHe] đang nghiên cứu một khu vườn nhỏ khi chúng ta ghé thăm [ROOT.Char.GetCurrentLocation.GetName]. Phải mất vài lần ta gọi thì [lifestyle_character.GetSheHe] mới nhận ra rằng ta đang ở đó, hoặc đang cố nói chuyện với [lifestyle_character.GetHerHim]."
  travel_events_bp3.105.a.reveler: "\"Làm sao ta có thể hòa đồng như ngươi?\""
  travel_events_bp3.105.a.blademaster: "\"Ngươi có thể dạy ta thêm về kiếm thuật không?\""
  travel_events_bp3.105.a.hunter: "\"Ngươi có thể dạy ta cách sử dụng cung không?\""
  travel_events_bp3.105.a.mystic: "\"Ta muốn nghe thêm về những điều ngươi biết.\""
  travel_events_bp3.105.a.physician: "\"Làm sao ngươi biết nhiều về bệnh tật và thương tích đến vậy?\""
  travel_events_bp3.105.a.herbalist: "\"Ngươi có thể kể thêm cho ta về những loại thảo mộc ngươi tìm được không?\""
  travel_events_bp3.105.a.gardener: "\"Điều gì ở chúng khiến ngươi thấy hứng thú đến vậy?\""
  travel_events_bp3.105.b: "\"Ngươi là niềm tự hào của đoàn tùy tùng này, [lifestyle_character.GetFirstNameNoTooltip].\""

  bp3_skill_travel_skill_learn_win: "Tiếp thu cách sống của [lifestyle_character.GetHerHis]"
  bp3_skill_travel_skill_learn_fail: "Ta chỉ đơn giản là không làm được"

  travel_events_bp3.110.t: "Tâm Sự Bên Đống Lửa"
  travel_events_bp3.110.desc.intro: "Rất lâu sau khi hầu hết mọi người đã đi ngủ, ta vẫn còn ngồi bên đống lửa trại. \"Có chuyện gì vậy?\" [friend_character.GetFirstName] hỏi khi [friend_character.GetSheHe] ngồi xuống cạnh ta, vẻ lo lắng hiện rõ trên gương mặt [friend_character.GetHerHis].\n\nBan đầu ta không biết phải nói gì, nhưng khi bắt đầu mở lời thì mọi thứ cứ thế tuôn ra — tất cả áp lực, nỗi lo, những rắc rối thường ngày. \"Ta cứ mãi nghĩ về "
  travel_events_bp3.110.desc.negative_memory: "khoảnh khắc khi [negative_memory.GetDescription]. "
  travel_events_bp3.110.desc.fallback: "những quyết định gần đây của mình. "
  travel_events_bp3.110.desc.outro: "Ta không khỏi tự hỏi liệu mình có nên làm khác đi hay không.\""
  travel_events_bp3.110.a: "\"Còn ngươi thì sao?\""
  travel_events_bp3.110.a.flavor: "Biết đâu lắng nghe những nỗi niềm của [friend_character.GetHerHis] sẽ giúp ta nhẹ lòng hơn?"
  travel_events_bp3.110.b: "\"Ngươi sẽ không tin ta phải trải qua những gì đâu...\""
  travel_events_bp3.110.b.flavor: "Đây là chuyện của ta — không phải của [friend_character.GetFirstName]."

  travel_events_bp3.115.t: "Đêm Bên Đống Lửa Trại"
  travel_events_bp3.115.desc.intro: "Khi màn đêm đã buông xuống, ta thấy mình đang cười đùa, kể chuyện và uống rượu cùng "
  travel_events_bp3.115.desc.3_characters: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] của ta là [character_number_1.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] của ta là [character_number_2.GetFirstName], và [ROOT.Char.Custom2('RelationToMeShort', character_number_3)] của ta là [character_number_3.GetFirstName]."
  travel_events_bp3.115.desc.2_characters: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] của ta là [character_number_1.GetFirstName] và [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] của ta là [character_number_2.GetFirstName]."
  travel_events_bp3.115.desc.1_character: "[ROOT.Char.Custom2('RelationToMeShort', character_number_1)] của ta là [character_number_1.GetFirstName]."
  travel_events_bp3.115.desc.outro: "Ta không ngờ [character_number_1.GetSheHe] lại có khả năng đó, nhưng [character_number_1.GetFirstNameNoTooltip] cuối cùng đã kể một câu chuyện đặc biệt tục tĩu về bốn người nông dân mà [character_number_1.GetSheHe] từng gặp tại [ROOT.Char.GetCapitalLocation.GetName].\n\nSau khi lau đi những giọt nước mắt vì cười quá nhiều, và uống một chút để thông cổ họng, ta sẽ..."
  travel_events_bp3.115.a: "Kể một câu chuyện của riêng mình..."
  travel_events_bp3.115.b: "... và thêm thắt cho kịch tính hơn!"
  travel_events_bp3.115.b.impressed: "Họ bị ấn tượng"
  travel_events_bp3.115.b.unimpressed: "Họ không mấy ấn tượng"
  travel_events_bp3.115.c: "Yêu cầu [character_number_1.GetFirstNameNoTooltip] kể thêm một câu chuyện nữa!"

  travel_events_bp3.120.t: "Con Thuyền Đắm"
  travel_events_bp3.120.desc.intro.coast: "Khi chúng ta đi dọc theo bờ biển của [ROOT.Char.GetCurrentLocation.GetName],"
  travel_events_bp3.120.desc.intro.river: "Khi chúng ta di chuyển dọc theo [river_province.Custom('RiverNameLoc')],"
  travel_events_bp3.120.desc: "Ta nhận thấy một [merchant_character.GetWomanMan] đang lớn tiếng nguyền rủa số phận của mình và than phiền về thủy thủ đoàn phản bội. Khi chúng ta đến gần hơn, ta thấy [merchant_character.GetHerHim] đang đứng bên cạnh phần còn lại của một chiếc thuyền buôn nhỏ đã bị đắm.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], liệu ta có thể xin Ngài một chút thời gian không? Ta sẵn lòng trả tiền cho thức ăn và sự giúp đỡ để sửa chữa con thuyền của ta." [merchant_character.GetSheHe|U] nói với nụ cười đau khổ trên gương mặt [merchant_character.GetHerHis]. Ta nhận thấy phần lớn hàng hóa của [merchant_character.GetHerHis] dường như vẫn còn nguyên vẹn, bất chấp vận rủi mà [merchant_character.GetHerHis] đã gặp phải."
  travel_events_bp3.120.a: "Dĩ nhiên rồi, chúng ta sẽ giúp."
  travel_events_bp3.120.b: "Với một cái giá thì có lẽ..."
  travel_events_bp3.120.c: "\"Ngươi nói là mình có bao nhiêu tiền nhỉ?\""
  travel_events_bp3.120.d: "\"Xin lỗi, nhưng chúng ta đang vội.\""

  RiverNameTheNile: "[ROOT.Province.GetName]"
  RiverNameNotTheNile: "sông [ROOT.Province.GetName]"

