l_english: 

# Struggle
  game_concept_persian_struggle: "Giai Đoạn Trung Gian Ba Tư"
  game_concept_persian_struggle_desc: "$game_concept_persian_struggle$ miêu tả sự suy tàn hỗn loạn của Caliphate Abbasid, nơi Lưỡng Hà bị tàn phá bởi các cuộc nổi loạn và đấu tranh quyền lực, và một số lãnh chúa Ba Tư tuyên bố độc lập.\n\nMặc dù [struggle_involved|E] [characters|E] có thể có nhiều mục tiêu, hầu hết sẽ muốn trở thành một [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )] và làm việc để khôi phục quyền lực của Caliphate, hoặc một [GetTrait('fp3_struggle_detractor').GetName( GetNullCharacter )] và cố gắng phá hủy nó.\n\n[Struggle|E] chuyển đổi giữa hai [struggle_phase_phases|E] - [struggle_persia_phase_unrest|E] và [struggle_persia_phase_stabilisation|E]."

# Legacy Track Stuff

  game_concept_kindle_royal_fire_decision: "Quyết Định Thắp Lửa Hoàng Gia"
  game_concept_kindle_royal_fire_decision_desc: "Một [decision|E] cho phép Ngài thắp lên một ngọn lửa hoàng gia, nhận các lợi ích về [health|E] và [dynasty_prestige|E]."
  game_concept_fp3_embellish_capital_decision: "Quyết Định $fp3_embellish_capital_decision_name$"
  game_concept_fp3_embellish_capital_decision_desc: "Một [decision|E] cho phép Ngài cải thiện [capital|E] của mình với chi phí từ một [county|E] mới chiếm được"

  game_concept_master_assassin: "Sát Thủ Chủ Chốt"
  game_concept_master_assassin_desc: "$game_concept_master_assassin$ là một [court_position|E] được mở bởi [faiths|E] với [GetFaithDoctrine('tenet_fp3_fedayeen').GetBaseName] [core_tenet|E]. $game_concept_master_assassin$ là một kẻ cuồng tín nguy hiểm, hợp tác với các sát thủ cấp dưới để hạ sát những kẻ được coi là kẻ thù của đức tin."
  game_concept_assassin: "Sát Thủ"

  game_concept_research_project: "Dự Án Nghiên Cứu"
  game_concept_research_projects: "Các Dự Án Nghiên Cứu"
  game_concept_research_project_desc: "Một Dự Án Nghiên Cứu là một [inspiration|E] dựa vào [aptitude|E] của $court_scholar_court_position$ để mang lại lợi ích cho người sử dụng.\n\nTrong một số trường hợp hiếm, Dự Án Nghiên Cứu có thể khám phá ra một [innovation|E] mới."

  game_concept_ending_phase: "Giai Đoạn Kết Thúc"
  game_concept_ending_phase_desc: "Một $game_concept_ending_phase$ là loại [struggle_phase|E] đặc biệt, kết thúc [struggle|E] khi được kích hoạt. [Struggle_involved|E] và [struggle_interloper|E] [characters|E] có thể tiến tới giai đoạn kết thúc theo cách bình thường, sử dụng [struggle_catalyst_catalysts|E]."

  game_concept_struggle_ending_decision: "Quyết Định Kết Thúc"
  game_concept_struggle_ending_decisions: "Các Quyết Định Kết Thúc"
  game_concept_struggle_ending_decision_desc: "Một $game_concept_struggle_ending_decision$ là một [decision|E] duy nhất để kết thúc một [struggle|E]. Những quyết định như vậy thường chỉ khả dụng trong các [struggle_phase_phases|E] nhất định."

  game_concept_struggle_persia_phase_stabilisation: "Ổn Định"
  game_concept_struggle_persia_phase_stabilisation_desc: "Mặc dù có nhiều rối ren, Caliph vẫn được tôn trọng. Các cuộc nổi loạn và phe phái đã bị kiềm chế, nhưng các lãnh chúa Ba Tư sẽ không dễ dàng bị khuất phục.\n\nCăng thẳng có thể dẫn tới [struggle_persia_phase_unrest|E], đồng nghĩa với việc hỗn loạn sẽ tiếp diễn."
  game_concept_struggle_persia_phase_unrest: "Bất Ổn"
  game_concept_struggle_persia_phase_unrest_desc: "Bị bao vây bởi nổi loạn và mưu mô, Caliphate sụp đổ. Những lãnh chúa tham vọng và các thống đốc xảo quyệt đều tìm cách chiếm quyền lực, liên tục đấu đá nhau.\n\nTheo thời gian, nếu tình hình không được giải quyết bởi [ending_phase|E], lãnh thổ sẽ bước vào giai đoạn [struggle_persia_phase_stabilisation|E] khi những người ủng hộ tuyệt vọng giành lại quyền lực caliphal."
  game_concept_struggle_persia_phase_concession: "Nhượng Bộ"
  game_concept_struggle_persia_phase_concession_desc: "Theo thời gian, khi căng thẳng ở Ba Tư giảm và cả những người ủng hộ lẫn phản đối Caliphate mệt mỏi với đổ máu liên tục, [persian_struggle|E] có thể kết thúc một cách tự nhiên: không bằng tiếng nổ lớn, mà bằng tiếng rên rỉ nhỏ nhẹ."

  game_concept_fp3_request_turkic_invasion_interaction: "$fp3_request_turkic_invasion_interaction$"
  game_concept_fp3_request_turkic_invasion_interaction_desc: "Tài trợ cho bất kỳ [ruler|E] nào có dòng dõi Turkic để xâm chiếm một trong các lãnh chúa lân cận của Ngài"

  game_concept_fp3_install_loyalist_cb: "Đặt Một Người Ủng Hộ"
  game_concept_fp3_install_loyalist_cb_desc: "Cho phép Ngài phát động một [war|E] để đưa một [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )] của Caliphate lên lãnh đạo [realm|E] mục tiêu"

  game_concept_fp3_demand_submission_interaction: "$fp3_demand_submission_interaction$"
  game_concept_fp3_demand_submission_interaction_desc: "Đòi hỏi [character_possessive|E] sự trung thành dưới dạng [hook|E] bằng cách sử dụng đức tin, mưu mẹo, hoặc đe dọa."

  game_concept_fp3_request_house_unity_change_interaction: "$fp3_request_house_unity_change_interaction$"
  game_concept_fp3_request_house_unity_change_interaction_desc: "$fp3_request_house_unity_change_interaction_desc$"

  game_concept_fp3_request_honorary_titles_interaction: "$fp3_request_honorary_titles_interaction$"
  game_concept_fp3_request_honorary_titles_interaction_desc: "$fp3_request_honorary_titles_interaction_desc$"

  game_concept_fp3_free_house_member_cb: "$fp3_free_house_member_cb_name$"
  game_concept_fp3_free_house_member_cb_desc: "Một [casus_belli|E] có sẵn cho [house_heads|E] buộc mục tiêu phải thả tất cả các [imprisoned|E] thành viên [house|E]."

  game_concept_fp3_unify_house_cb: "$fp3_unify_house_cb_name$"
  game_concept_fp3_unify_house_cb_desc: "Một [casus_belli|E] cho phép [house_head|E] thu hồi các thành viên [house|E] từ [realm|E] khác làm [vassal|E]."
