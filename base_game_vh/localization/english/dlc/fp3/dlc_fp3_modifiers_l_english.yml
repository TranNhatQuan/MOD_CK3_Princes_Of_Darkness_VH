l_english: 

  fp3_brutal_predations_county_modifier: "Tàn Bạo Cướp Bóc"
  fp3_brutal_predations_county_modifier_desc: "Người dân trong vùng này kinh hoàng trước loạt hành vi bạo lực của một lính đánh thuê tàn sát, kẻ vẫn đang lẩn trốn."

  fp3_low_frontier_morale_county_modifier: "Tinh Thần Biên Cương Thấp"
  fp3_low_frontier_morale_county_modifier_desc: "Các binh sĩ trấn giữ pháo đài trong vùng cảm thấy bị chúa của họ lãng quên."

  fp3_boosted_frontier_morale_county_modifier: "Tinh Thần Biên Cương Cao"
  fp3_boosted_frontier_morale_county_modifier_desc: "Các binh sĩ trấn giữ pháo đài trong vùng cảm thấy hăng hái hơn kể từ khi chúa của họ ghé thăm trực tiếp."

  fp3_visited_the_frontier_modifier: "Đã Ghé Biên Cương"
  fp3_visited_the_frontier_modifier_desc: "Nhân vật này gần đây đã tiếp xúc với binh sĩ ở các pháo đài biên cương, và do đó phơi nhiễm với nhiều loại mầm bệnh trong điều kiện sinh hoạt chật chội."

  fp3_frontier_heresy_county_modifier: "Dị Giáo Biên Cương"
  fp3_frontier_heresy_county_modifier_desc: "Những tín ngưỡng cực đoan đã bén rễ giữa binh sĩ và dân cư trong hạt này."

  fp3_garrison_decimated_county_modifier: "Tiểu Đoàn Bị Tàn Sát"
  fp3_garrison_decimated_county_modifier_desc: "Các binh sĩ từng bảo vệ tỉnh này đã bị chúa của họ tàn sát vì theo tín ngưỡng ngoại đạo."

  fp3_jinx_modifier: "Xui Xẻo"
  fp3_jinx_modifier_desc: "Nhân vật này tin rằng có người với ý đồ xấu đã sử dụng Ác Nhãn chống lại họ."

  fp3_call_of_the_wild_modifier: "Bị Lôi Cuốn Ra Biên Cương"
  fp3_call_of_the_wild_modifier_desc: "Nhân vật này cảm thấy thôi thúc khám phá các thảo nguyên xa xôi, sa mạc khắc nghiệt và núi cao, để thấy những gì nằm bên kia."

  fp3_marriage_material_modifier: "Người Lý Tưởng Kết Hôn"
  fp3_marriage_material_modifier_desc: "Nhân vật này tin rằng tốt nhất là tuân lời cha mẹ và kết hôn – nhưng liệu có thật sự đúng không?"

  fp3_dutiful_scion_modifier: "Con Cháu Hiếu Thảo"
  fp3_dutiful_scion_modifier_desc: "Nhân vật này cống hiến cả đời cho gia tộc, không bị phân tâm bởi những thú vui cá nhân hay phiêu lưu."

  fp3_worried_sick_modifier: "Lo Lắng Quá Độ"
  fp3_worried_sick_modifier_desc: "Nhân vật này lo lắng khôn nguôi về người thân đã đi đối mặt với hiểm nguy nơi xa."

  fp3_gross_persecutions_county_modifier: "Đàn Áp Tàn Bạo"
  fp3_gross_persecutions_county_modifier_desc: "Nhiều tín đồ trong tỉnh phải trốn tránh hoặc bỏ chạy sau những cuộc đàn áp tôn giáo bạo lực của chúa."

  fp3_galvanized_heretics_county_modifier: "Dị Giáo Căm Phẫn"
  fp3_galvanized_heretics_county_modifier_desc: "Sự áp bức đã biến dân chúng hạt này thành những phần tử cực đoan, kiên quyết bảo vệ đức tin bất chấp mọi giá."

  fp3_promoting_arabic_modifier: "Thúc Đẩy Tiếng Ả Rập"
  fp3_promoting_arabic_modifier_desc: "Nhân vật này đang khuyến khích việc sử dụng tiếng Ả Rập."

  fp3_conversion_curious_county_modifier: "Tò Mò Chuyển Đạo"
  fp3_conversion_curious_county_modifier_desc: "Trong dân chúng hạt này, sự tò mò về các tín ngưỡng khác đang gia tăng."

  fp3_teapot_alcoholism_modifier: "Người Uống Trà Không Ngừng"
  fp3_teapot_alcoholism_modifier_desc: "Nhân vật này luôn giữ bên cạnh một ấm trà xinh xắn, và nổi tiếng uống lượng lớn chất chứa bí ẩn trong đó."

  ulema_displeased_drinking: "Bê Bối Uống Rượu Công Khai"
  ulema_displeased_drinking_desc: "Thói quen uống rượu nổi tiếng của nhân vật này gây ra bê bối công khai, với giáo sĩ công khai nghi ngờ tác động đến khả năng cai trị."

  fp3_mountain_redoubt_modifier: "Pháo Đài Trên Núi"
  fp3_mountain_redoubt_modifier_desc: "Pháo đài này, tọa lạc trên đỉnh núi cao, gần như bất khả xâm phạm. Trước đây do lãnh đạo Khurramite Javidhan và Babak chiếm giữ, nay đã được xây dựng lại, trở thành chốt phòng thủ kiên cố cho cư dân hiếu chiến vùng Núi Đen."

  fp3_royal_fire_modifier: "Ngọn Lửa Hoàng Gia"
  fp3_royal_fire_modifier_desc: "Chúa tể này có ngọn lửa vĩnh cửu thắp tên mình, để ban phước cho triều đại với ánh sáng vinh quang."
  fp3_plundered_county_modifier: "Bị Cướp & Khai Thác"
  fp3_plundered_county_modifier_desc: "Hạt này đã bị chúa tể vắt kiệt tài nguyên để tài trợ cho các dự án xa hoa khác."

  fp3_architectural_splendor_county_modifier: "Kiến Trúc Lộng Lẫy"
  fp3_architectural_splendor_county_modifier_desc: "Hạt này chứng kiến đầu tư lớn vào kiến trúc đồ sộ và công trình công cộng hoành tráng."

  fp3_efficient_splendor_county_modifier: "Nhà Xây Dựng Hiệu Quả"
  fp3_efficient_splendor_county_modifier_desc: "Hạt này chứng kiến một cơn sốt xây dựng công trình đồ sộ và các công trình công cộng hoành tráng."

  fp3_luxurious_bathhouse_modifier: "Hammam Tráng Lệ"
  fp3_luxurious_bathhouse_modifier_desc: "Nhân vật này trang trí kinh đô bằng một nhà tắm mới vô cùng tráng lệ và chất lượng."

  fp3_less_luxurious_bathhouse_modifier: "Hammam Hư Hỏng"
  fp3_less_luxurious_bathhouse_modifier_desc: "Mặc dù có nhà tắm tráng lệ, nhưng công trình chưa hoàn hảo, bắt đầu xuất hiện nứt trên gạch và đá."

  fp3_very_lofty_tower_modifier: "Tháp Cao Ngất"
  fp3_very_lofty_tower_modifier_desc: "Dinh thự của nhân vật này có một tháp cực cao, rất đẹp, nơi có thể leo lên để nhìn xuống thế giới — và tách biệt khỏi mọi ánh mắt tò mò."

  fp3_less_lofty_tower_modifier: "Tháp Thấp Hơn"
  fp3_less_lofty_tower_modifier_desc: "Dinh thự nhân vật này có một tháp cao, mảnh mai. Dù không cao như dự định, cảnh từ trên đỉnh vẫn khiến lòng người rung động — và cung cấp chỗ tách biệt khi cần."

  fp3_spiritual_splendor_county_modifier: "Vẻ Lộng Lẫy Tôn Giáo"
  fp3_spiritual_splendor_county_modifier_desc: "Hạt này chứng kiến nhiều công trình và tu bổ các đài tưởng niệm tôn giáo đủ loại."

  fp3_great_tower_of_silence_modifier: "Tháp Im Lặng Vĩ Đại"
  fp3_great_tower_of_silence_modifier_desc: "Nhân vật này đã giám sát xây dựng một dakhma quy mô chưa từng có, và thường nhìn ngắm công trình u ám, suy ngẫm về điều gì nằm ngoài thế giới đất và xác thịt."

  fp3_less_great_tower_of_silence_modifier: "Tháp Im Lặng"
  fp3_less_great_tower_of_silence_modifier_desc: "Nhân vật này đã giám sát xây dựng một dakhma lớn, và khi nhìn những con kền kền thảo nguyên lao xuống, thường suy ngẫm về sự sống và cái chết."

  police_chief_of_baghdad_modifier: "Đội Trưởng Baghdad"
  police_chief_of_baghdad_modifier_desc: "Nhân vật này giữ chức Sahib al-Shurta, đội trưởng bảo vệ Baghdad. Dù gần đây có biến động, vị trí này vẫn mang lại một số cơ hội ảnh hưởng."

  fp3_light_of_the_walayah_modifier: "Ánh Sáng Walayah"
  fp3_light_of_the_walayah_modifier_desc: "Dòng họ này được cho là sở hữu #italic nūr#!, ánh sáng huyền bí dẫn dắt của Thượng Đế."

  fp3_azariqa_ascendancy_modifier: "Sự Thăng Hoa của Muhakkima"
  fp3_azariqa_ascendancy_modifier_desc: "Nhân vật này đã dẫn dắt Muhakkima đạt tới vinh quang chưa từng thấy."

  fp3_promoted_persian_scripture_modifier: "Nhà Phiên Dịch Vĩ Đại"
  fp3_promoted_persian_scripture_modifier_desc: "Nhân vật này giám sát việc phiên dịch các tác phẩm tôn giáo Ả Rập; điều trước đây bị coi là cấm kỵ."

  fp3_persian_resurgence_county_modifier: "Sự Trỗi Dậy của Ba Tư"
  fp3_persian_resurgence_county_modifier_desc: "Hạt này bùng cháy với lòng sùng đạo kết hợp tinh thần yêu nước địa phương trỗi dậy, từ đó có thể xảy ra những điều bất ngờ."

  fp3_forgotten_runestones_county_modifier: "Đá Rune Bị Lãng Quên"
  fp3_forgotten_runestones_county_modifier_desc: "Trong hạt này có ba tảng đá bí ẩn, khắc các rune tinh xảo theo phong cách Rus. Tuy nhiên, chúng đã phần nào mục nát, và giờ không ai hiểu được ý nghĩa của chúng."

  fp3_dismayed_daylamites_county_modifier: "Dân Rừng Lo Lắng"
  fp3_dismayed_daylamites_county_modifier_desc: "Dân địa phương từng phát triển mê tín sợ hãi quanh một số tảng đá rune bí ẩn sâu trong rừng. Khi những tảng đá mất tích, họ lo sợ bị trừng phạt từ những người tạo ra chúng, bất kể là ai."

  fp3_insulted_chinese_noble_modifier: "Bị Khinh Thường Ở Trung Quốc"
  fp3_insulted_chinese_noble_modifier_desc: "Nhân vật này đã xúc phạm một quý tộc Trung Quốc nổi tiếng, người hiện lan truyền tin đồn ác ý về họ tại các triều đình Trường An, Khai Phong và Lạc Dương."

  fp3_vengeful_nomads_county_modifier: "Du Mục Trả Thù"
  fp3_vengeful_nomads_county_modifier_desc: "Hạt này đang chịu các cuộc tấn công bừa bãi từ du mục, nhằm trả thù cho một thủ lĩnh bị giết một cách bất công."

  fp3_nomad_recruits_modifier: "Tân Binh Du Mục"
  fp3_nomad_recruits_modifier_desc: "Dòng họ này cho phép du mục định cư trên đất của mình, cung cấp nguồn tuyển mộ lính ngựa rất tốt."

  fp3_nomad_friction_county_modifier: "Mâu Thuẫn Đồng Cỏ"
  fp3_nomad_friction_county_modifier_desc: "Hạt này bị ảnh hưởng bởi xung đột giữa nông dân định cư và bộ lạc du mục."

  fp3_resentful_nomads_county_modifier: "Du Mục Oán Giận"
  fp3_resentful_nomads_county_modifier_desc: "Hạt này đang trải qua xung đột do những du mục bất mãn và khó kiểm soát."

  fp3_banning_archery_modifier: "Cấm Bắn Cung"
  fp3_banning_archery_modifier_desc: "Nhân vật này đã cấm luyện tập bắn cung ở một số vùng lãnh thổ, làm giảm hiệu quả của cung thủ nhưng chắc chắn giảm tai nạn."

  fp3_crushed_by_failure_modifier: "Suy Sụp Vì Thất Bại"
  fp3_crushed_by_failure_modifier_desc: "Dù việc gì, nhân vật này đã thất bại thảm hại, và sự nghi ngờ đang gặm nhấm tâm trí họ."

  fp3_silk_road_secure_county_modifier: "Con Đường Tơ Lụa An Toàn"
  fp3_silk_road_secure_county_modifier_desc: "Các chiến binh du mục ở tỉnh này thề giữ an toàn cho các tuyến đường buôn bán."

  fp3_nomad_attacks_county_modifier: "Cướp Bừa Bãi"
  fp3_nomad_attacks_county_modifier_desc: "Hạt này chịu các cuộc cướp bóc nhằm vào đoàn lữ hành, làm gián đoạn đáng kể thương mại."

  fp3_gnostic_fervor_county_modifier: "Nhiệt Huyết Mặc Khải"
  fp3_gnostic_fervor_county_modifier_desc: "Hạt này gần đây trở thành nơi trú ẩn cho một nhóm tị nạn Maniche diligent."

  fp3_lackluster_diet_modifier: "Chế Độ Ăn Nhạt Nhẽo"
  fp3_lackluster_diet_modifier_desc: "Nhân vật này bị đặt vào chế độ ăn nhạt nhẽo gồm cá mặn và cần tây sống, với hy vọng sẽ chữa được sự u sầu."

  fp3_herbal_remedies_modifier: "Thuốc Thảo Dược"
  fp3_herbal_remedies_modifier_desc: "Nhân vật này dùng hỗn hợp hạt fennel, dưa chuột và các loại thảo mộc khác để chữa u sầu."

  fp3_worshipping_in_solitude_modifier: "Thờ Phượng Trong Cô Đơn"
  fp3_worshipping_in_solitude_modifier_desc: "Nhân vật này dành nhiều giờ trong nhà nguyện riêng, tránh mọi ánh mắt tò mò. Nhiều lời đồn đoán về những gì diễn ra bên trong."

  fp3_rare_books_modifier: "Sách Hiếm"
  fp3_rare_books_modifier_desc: "Nhân vật này sở hữu một bộ sưu tập sách hiếm, cứu từ các thư viện huyền thoại như Ctesiphon, Gundeshapur, có thể cả Alexandria."

  fp3_oil_of_vitriol_modifier: "Dầu Vitriol"
  fp3_oil_of_vitriol_modifier_desc: "Nhân vật này tiếp cận lượng lớn chất ăn mòn cực mạnh do một nhà giả kim Ba Tư chế tạo."

  fp3_dabbling_in_alchemy_modifier: "Chơi Bài Giả Kim"
  fp3_dabbling_in_alchemy_modifier_desc: "Nhân vật này thử nghiệm giả kim và tiếp xúc với nhiều chất độc hại."

  fp3_alchemical_insights_modifier: "Hiểu Biết Giả Kim"
  fp3_alchemical_insights_modifier_desc: "Cùng với nhà giả kim Ba Tư, nhân vật này có những phát hiện lớn về chất lỏng và vật chất, học hỏi nhiều về cấu tạo thế giới."

  fp3_reneged_on_promise_modifier: "Bội Ứng Lời Hứa"
  fp3_reneged_on_promise_modifier_desc: "Nhân vật này phá vỡ lời hứa trả tiền cho nỗ lực văn học của một nhà thơ nổi tiếng, giờ bị coi là kém tin cậy."

  fp3_broken_icehouses_county_modifier: "Kho Lạnh Hỏng"
  fp3_broken_icehouses_county_modifier_desc: "Hạt này từng nổi tiếng sản xuất đồ ngọt lạnh, trước khi kho lạnh sụp đổ do động đất."

  fp3_court_austerity_modifier: "Nghiêm Ngặt Triều Đình"
  fp3_court_austerity_modifier_desc: "Triều đình nhân vật này nghiêm ngặt – ít xa hoa, ít tiếng cười, và đặc biệt – không có món ngọt."

  fp3_securing_sorbet_supply_modifier: "Đảm Bảo Nguồn Faloodeh"
  fp3_securing_sorbet_supply_modifier_desc: "Nhân vật này đã chiếm toàn bộ nguồn đồ ngọt lạnh trong vương quốc – làm vui lòng triều thần, nhưng gây phẫn nộ cho các chư hầu."

  fp3_thinking_about_the_afterlife_modifier: "Suy Ngẫm Về Cõi Chết"
  fp3_thinking_about_the_afterlife_modifier_desc: "Nhân vật này gần đây dành nhiều thời gian để suy nghĩ về điều gì đang chờ họ ở thế giới bên kia."

  fp3_sufi_initiate_modifier: "Người Tập Sufi"
  fp3_sufi_initiate_modifier_desc: "Nhân vật này quan tâm đến huyền môn Sufi và thiền Muraqaba, đào sâu mối quan hệ giữa trái tim và Đấng Tạo Hóa."

  fp3_avoiding_dark_places_modifier: "Tránh Nơi Tối"
  fp3_avoiding_dark_places_modifier_desc: "Nhân vật này đã trải qua quá nhiều trải nghiệm rùng rợn, và giờ rất muốn tránh bóng tối."

  fp3_looking_for_bodyguards_modifier: "Tìm Vệ Sĩ"
  fp3_looking_for_bodyguards_modifier_desc: "Nhân vật này đã gặp một trải nghiệm đáng sợ quá nhiều lần, và đang tìm kiếm thêm vệ sĩ."

  fp3_relentless_skeptic_modifier: "Người Hoài Nghi Kiên Định"
  fp3_relentless_skeptic_modifier_desc: "Nhân vật này bắt đầu nghi ngờ nhiều niềm tin dân gian và giả định về thế giới vô hình. Người khác có thể xem họ là kẻ hoài nghi, phản loạn, thậm chí là kẻ bỏ đạo."

  fp3_womens_faith_galvanized_modifier: "Niềm Tin Phụ Nữ"
  fp3_womens_faith_galvanized_modifier_desc: "Nhân vật này cảm thấy bị đàn áp vì tôn kính một nữ thánh, nhưng điều đó chỉ củng cố quyết tâm của họ."

  fp3_promoted_persian_mathematics_modifier: "Thúc Đẩy Toán Học Ba Tư"
  fp3_promoted_persian_mathematics_modifier_desc: "Các học giả của nhân vật này đang phát triển các khám phá toán học để sánh với $indo_aryan_group_collective_noun$."

  fp3_denied_religious_protection_modifier: "Tước Bỏ Bảo Hộ Tôn Giáo"
  fp3_denied_religious_protection_modifier_desc: "Vị vua này đã từ chối cho kẻ ngoại đạo tự do thực hành tín ngưỡng của họ."

  patron_of_the_sciences: "Dù chưa có khám phá lớn, dự án này mang lại danh tiếng cho Ngài như một nhà bảo trợ khoa học quan trọng."

  fp3_treatise_on_development_modifier: "Luận Văn Về Quản Trị"
  fp3_treatise_on_development_modifier_desc: "Một bài viết về giá trị của bộ máy quan liêu, với nhiều gợi ý về cách đảm bảo đường truyền thông từ hoàng gia đến cấp địa phương."

  fp3_treatise_on_building_modifier: "Luận Văn Về Quản Lý"
  fp3_treatise_on_building_modifier_desc: "Một luận văn về cách quản lý tài nguyên để tối đa hóa hiệu quả."

  fp3_treatise_on_control_modifier: "Luận Văn Về Quyền Lực"
  fp3_treatise_on_control_modifier_desc: "Một bài viết về cách lãnh đạo thực hiện nhiệm vụ cai trị và dập tắt nổi loạn."

  fp3_treatise_on_mathematics_modifier: "Luận Văn Toán Học"
  fp3_treatise_on_mathematics_modifier_desc: "Một luận văn chuyên sâu về toán học, với các ghi chú về cách ứng dụng trong đời sống hằng ngày."

  fp3_treatise_on_taxation_modifier: "Luận Văn Về Thuế"
  fp3_treatise_on_taxation_modifier_desc: "Một luận văn dài về thuế và các bước tiếp cận hiệu quả vấn đề thuế."

  fp3_treatise_on_light_warfare_modifier: "Hướng Dẫn Chiến Thuật Nhẹ"
  fp3_treatise_on_light_warfare_modifier_desc: "Một luận văn ngắn về giá trị của bộ binh nhẹ, và cách tận dụng hiệu quả."

  fp3_treatise_on_heavy_warfare_modifier: "Hướng Dẫn Chiến Tranh Phòng Thủ"
  fp3_treatise_on_heavy_warfare_modifier_desc: "Luận văn về đội hình bộ binh nặng, kèm hướng dẫn nhỏ về luyện tập để tăng tính gắn kết quân đội."

  fp3_treatise_on_cavalry_modifier: "Lịch Sử Chiến Thuật Kỵ Binh"
  fp3_treatise_on_cavalry_modifier_desc: "Một bài viết dài về lịch sử các cuộc xung phong kỵ binh, tập trung cách thay đổi cục diện trận đánh từ lưng ngựa."

  fp3_treatise_on_siege_modifier: "Hướng Dẫn Công Thành"
  fp3_treatise_on_siege_modifier_desc: "Một hướng dẫn ngắn gọn về bản chất các cuộc vây hãm và cách tiếp cận kẻ thù với hoặc không có pháo binh."

  fp3_treatise_on_strategy_modifier: "Lịch Sử Chiến Lược"
  fp3_treatise_on_strategy_modifier_desc: "Luận văn dài nhưng dễ tiếp cận về lịch sử chiến lược và chiến thuật, với ví dụ từ nhiều thế kỷ trước."

  fp3_fearsome_example_modifier: "Tấm Gương Khiếp Sợ"
  fp3_fearsome_example_modifier_desc: "Vị vua này tàn sát một cộng đồng tôn giáo ở biên giới, thể hiện sẵn sàng đàn áp dị giáo một cách đáng sợ."

  fp3_refused_the_caliph_modifier: "Từ Chối Chiến Tranh Thánh"
  fp3_refused_the_caliph_modifier_desc: "Nhân vật này từ chối yêu cầu của người đứng đầu tôn giáo tấn công một vị vua ngoại đạo láng giềng ."

  fp3_praying_too_much_modifier: "Cầu Nguyện Quá Nhiều"
  fp3_praying_too_much_modifier_desc: "Nhân vật này dành quá nhiều thời gian ở đền thờ, bỏ bê các nhiệm vụ khác."

  fp3_name_read_in_friday_prayer_modifier: "Tên Được Đọc Trong Lễ Thứ Sáu"
  fp3_name_read_in_friday_prayer_modifier_desc: "Nhân vật này ra lệnh tên của họ được đọc thay tên caliph trong buổi lễ quan trọng nhất tuần — một tuyên bố công khai về lòng trung thành và vị thế."

  fp3_displayed_pious_submission_to_caliph_modifier: "Nhấn Mạnh Sự Phục Tùng Caliph"
  fp3_displayed_pious_submission_to_caliph_modifier_desc: "Nhân vật này ra lệnh đọc tên caliph trước tiên trong Lễ Thứ Sáu, buổi thờ quan trọng nhất mỗi nhà thờ — cả thế giới biết ai là người họ tuân phục."

  fp3_honored_by_the_faithful_modifier: "Được Tín Đồ Kính Trọng"
  fp3_honored_by_the_faithful_modifier_desc: "Tên nhân vật này được đọc trong lễ Thứ Sáu tại ghế lãnh đạo tôn giáo, mang lại uy tín đáng kể."

  fp3_rule_by_fear_modifier: "Cai Trị Bằng Sợ Hãi"
  fp3_rule_by_fear_modifier_desc: "Nhân vật này thể hiện khả năng và sẵn sàng giết người tùy tiện, duy trì vương quốc bằng nỗi sợ."

  fp3_minor_child_spy_network_modifier: "Mạng Lưới Trinh Sát Trẻ Em"
  fp3_minor_child_spy_network_modifier_desc: "Nhân vật này sử dụng một mạng lưới nhỏ trẻ em làm gián điệp để khám phá bí mật của dòng họ."

  fp3_better_company_modifier: "Ứng Xử Tốt Hơn"
  fp3_better_company_modifier_desc: "Nhân vật này đã bị các bậc trưởng bối khiển trách và đang học cách cư xử xứng đáng với hậu duệ dòng họ."

  fp3_justification_for_taxation_modifier: "Lý Do Thu Thuế"
  fp3_justification_for_taxation_modifier_desc: "Người thu thuế của nhân vật này đưa ra lý do đáng ngờ để buộc chư hầu đóng góp nhiều hơn mức công bằng."

  fp3_excuses_for_extortion_modifier: "Cái Cớ Cưỡng Bức"
  fp3_excuses_for_extortion_modifier_desc: "$fp3_justification_for_taxation_modifier_desc$"

  fp3_locals_intimidated_county_modifier: "Dân Bị Hăm Dọa"
  fp3_locals_intimidated_county_modifier_desc: "Người dân thường ở hạt này bị sợ hãi buộc phải tuân phục."

  fp3_locals_infuriated_county_modifier: "Dân Phẫn Nộ"
  fp3_locals_infuriated_county_modifier_desc: "Người dân ở hạt này nổi giận vì cách vua đối xử với quan địa phương được dân yêu mến."

  fp3_looking_the_other_way_modifier: "Làm Ngơ"
  fp3_looking_the_other_way_modifier_desc: "Nhân vật này áp dụng chính sách làm ngơ với một số sai phạm kinh tế của chư hầu và thần dân — vì lợi ích vương quốc hoặc sự an tâm của bản thân."

  fp3_capable_magistrates_modifier: "Quan Tài Năng"
  fp3_capable_magistrates_modifier_desc: "Nhân vật này được hỗ trợ bởi các quan tài năng, có thể làm mọi phán quyết trở nên công bằng."

  fp3_delegated_payments_modifier: "Ủy Quyền Thanh Toán"
  fp3_delegated_payments_modifier_desc: "Nhân vật này ủy quyền cho người thu thuế trả lương cho quân đội, một biện pháp hiệu quả – cho tới nay."

  fp3_army_influence_modifier: "Ảnh Hưởng Quân Đội"
  fp3_army_influence_modifier_desc: "Nhân vật này được chư hầu trao quyền lực đáng kể đối với quân đội."

  fp3_messy_payments_modifier: "Thanh Toán Không Ổn Định"
  fp3_messy_payments_modifier_desc: "Trách nhiệm trả lương binh lính được phân chia lộn xộn, đôi khi gây chậm trễ và ảnh hưởng tinh thần."

  fp3_cutting_corners_modifier: "Làm Qua Quýt"
  fp3_cutting_corners_modifier_desc: "Nhân vật này quá bận rộn, dẫn đến làm việc hơi cẩu thả."

  fp3_promoting_zoroastrianism_modifier: " Bạn củaNgười Zoroastrian"
  fp3_promoting_zoroastrianism_modifier_desc: "Nhân vật này được biết là luôn cố gắng giúp đỡ cộng đồng Zoroastrian."

  fp3_blessed_by_fire_modifier: "Được Ban Phép Bởi Lửa"
  fp3_blessed_by_fire_modifier_desc: "Nhân vật này đã trải qua trải nghiệm sâu sắc khi gặp lửa sinh ra từ tia sét, nguyên tố tinh khiết nhất trên thế giới này."

  fp3_bad_tower_of_silence_county_modifier: "Tháp Điên"
  fp3_bad_tower_of_silence_county_modifier_desc: "Một nỗ lực xây dựng dakhma mới lớn ở hạt này đã thất bại, và xác thối đang đầu độc nguồn nước ngầm bên dưới."

  fp3_wary_of_sabotage_modifier: "Cảnh Giác Với Phá Hoại"
  fp3_wary_of_sabotage_modifier_desc: "Nhân vật này sẽ không dung thứ bất cứ trò gian trá nào trong hạt được giao."

  fp3_antagonize_character_interaction_known_liar: "Nổi Tiếng Khuếch Đại"
  fp3_antagonize_character_interaction_known_liar_desc: "Mọi người mệt mỏi với những lời nói của nhân vật này, vì chúng thường bị thổi phồng quá mức."

  fp3_not_puppeteering_kingmaker_modifier: "Người Điều Khiển Thất Bại"
  fp3_not_puppeteering_kingmaker_modifier_desc: "Nhân vật này thất bại trong việc lật đổ một vị vua không thân thiện để thay bằng người phù hợp hơn với lợi ích của mình. Giờ đây uy tín của họ bị đặt dấu hỏi."

  fp3_sickly_monkey_modifier: "Khỉ Ốm"
  fp3_sickly_monkey_modifier_desc: "Nhân vật này đang cố chăm sóc một con khỉ ốm. Móng vuốt sắc và răng nhọn của nó gây khó khăn."

  fp3_chess_playing_monkey_modifier: "Khỉ Chơi Cờ"
  fp3_chess_playing_monkey_modifier_desc: "Nhân vật này sở hữu một con khỉ được đồn là đã được dạy chơi cờ bởi một vị vua triết gia phương Đông."

  fp3_paper_surplus_modifier: "Giàu Giấy"
  fp3_paper_surplus_modifier_desc: "Nhân vật này có nguồn giấy ổn định để ghi chép các nghiên cứu của mình."

  fp3_paper_shortage_modifier: "Thiếu Giấy"
  fp3_paper_shortage_modifier_desc: "Nhân vật này không có giấy ổn định, phải dùng các nguồn giấy da hiếm hoi."

  fp3_liquid_wisdom_modifier: "Trí Tuệ Lỏng"
  fp3_liquid_wisdom_modifier_desc: "Nhân vật này chứng minh mình là chủ nhà tốt cho các học giả đến thăm, nhận lợi ích từ việc trao đổi ý tưởng tự do."

  fp3_morbid_insights_modifier: "Hiểu Biết U Ám"
  fp3_morbid_insights_modifier_desc: "Nhân vật này đã học được một số bài học không may về bản chất con người."

  fp3_wheat_shortage_modifier: "Thiếu Lúa Mì"
  fp3_wheat_shortage_modifier_desc: "Thợ làm bánh hoàng gia trong hạt này đang tích trữ lúa mì, để không còn một chút nào cho dân thường."

  fp3_generous_bakers_modifier: "Thợ Bánh Hào Phóng"
  fp3_generous_bakers_modifier_desc: "Các thợ bánh trong hạt này hào phóng chia bánh sau khi một thợ tham lam bị xử tử."

  fp3_impious_tax_collector_modifier: "Người Thu Thuế Vô Đức"
  fp3_impious_tax_collector_modifier_desc: "Nhân vật này bị phơi bày công khai là thu thuế kém vì tội lỗi của mình."

  fp3_incapable_tax_collector_modifier: "Người Thu Thuế Bất Lực"
  fp3_incapable_tax_collector_modifier_desc: "Nhân vật này không thể làm thu thuế nữa vì tội lỗi của chính mình."

  fp3_religious_desertion_modifier: "Bỏ Đạo"
  fp3_religious_desertion_modifier_desc: "Quân lính trong hạt này đã từ bỏ để tránh chiến đấu chống lại lãnh đạo tôn giáo của họ."

  fp3_struggle_supremacy_house_reward_modifier: "Ưu Thế Sunni"
  fp3_struggle_supremacy_house_reward_modifier_desc: "Caliph thuộc dòng này tuyên bố quyền lực rộng lớn nhờ khôi phục thành công quyền lực ở Iran."

  fp3_struggle_caliph_super_suspicious_modifier: "Cực Kỳ Nghi Ngờ"
  fp3_struggle_caliph_super_suspicious_modifier_desc: "Do bất ổn gia tăng trong vùng, nhân vật này cảm thấy mình đang gặp nguy hiểm lớn."
  has_fp3_struggle_caliph_super_suspicious_modifier: "[target.GetShortUIName] đang $fp3_struggle_caliph_super_suspicious_modifier$: $VALUE|+0=-+$"

  fp3_irrigation_insights_modifier: "Hiểu Biết Về Thủy Lợi"
  fp3_irrigation_insights_modifier_desc: "Bằng cách nghiên cứu hệ thống Qanat cổ xưa, nhân vật này đã học được về tưới tiêu."

  disturbed_sky_burial: "Chôn Cất Trời Bị Xáo Trộn"
  disturbed_sky_burial_desc: "Những kẻ hăng hái trong vương quốc ấn tượng với cách nhân vật này xử lý nghiêm minh các nghi thức ngoại đạo, như chôn cất trên trời."
  disturbed_funerals: "Phép Thờ Bị Xem Thường"

  fp3_untrained_falcon: "Diều Hâu Chưa Huấn Luyện"
  fp3_untrained_falcon_desc: "Nhân vật này tìm thấy một con chim trong lễ chôn cất trên trời. Nó chỉ gây rắc rối cho đến nay, nhưng họ hy vọng có thể huấn luyện thành thợ săn thực thụ."

  fp3_aggressive_falcon: "Diều Hâu Hung Dữ"
  fp3_aggressive_falcon_desc: "Nhân vật này tìm thấy một con chim trong lễ chôn cất trên trời. Nó dường như thích thịt người, và họ quyết định nuôi dưỡng sở thích này."

  fp3_had_delicious_kumis: "Đã Thưởng Thức Kumis Ngon"
  fp3_had_delicious_kumis_desc: "Nhân vật này chia sẻ đồ uống từ sữa ngựa thơm ngon với các lữ khách Turkic họ gặp trên đường."

  turkic_war_band: "Đội Chiến Binh Turkic Thuê"
  turkic_war_band_desc: "Nhân vật này thuê một nhóm du mục Turkic để huấn luyện quân đội, khiến một số chư hầu kinh hãi."

  rebuffed_turkic_war_band: "Khước Từ Chiến Binh Turkic"
  rebuffed_turkic_war_band_desc: "Trong một màn thể hiện dũng cảm ấn tượng, nhân vật này đã công khai xúc phạm một nhóm chiến binh du mục lớn khi đi du hành."

  ancient_persian_relics: "Kho Báu Cổ Ba Tư"
  ancient_persian_relics_desc: "Một khoản lợi bất ngờ đã khiến nhân vật này nổi tiếng về sự giàu có và hào phóng."

  fp3_house_modifier_conceded_hegemony: "Nhượng Quyền Lực"
  fp3_house_modifier_conceded_hegemony_desc: "Dòng họ này phải nhượng quyền lực bá chủ để làm dịu kẻ thù"
  fp3_house_modifier_rebuilding_efforts: "Nỗ Lực Xây Dựng Lại"
  fp3_house_modifier_rebuilding_efforts_desc: "Dòng họ này đang xây dựng lại lãnh thổ sau cuộc chiến đẫm máu với kẻ thù của Caliphate"
  fp3_house_modifier_frontier_ambitions: "Tham Vọng Biên Giới"
  fp3_house_modifier_frontier_ambitions_desc: "Dòng họ này tìm kiếm các hướng mở rộng mới sau cuộc đấu tranh vô ích với Caliphate"

  fp3_house_modifier_destroyed_the_caliphate: "Tiêu Diệt Caliphate"

  fp3_established_futuwaa_lodges_modifier: "Thành Lập Các Hội Futuwaa"
  fp3_established_futuwaa_lodges_modifier_desc: "Nhân vật này đã lập các câu lạc bộ võ thuật cho thanh niên lêu lổng tại thủ đô."
  fp3_established_madrasas_modifier: "Thành Lập Madrasas"
  fp3_established_madrasas_modifier_desc: "Nhân vật này đã mở trường học để giáo dục thanh niên lêu lổng tại thủ đô."

  fp3_rekindler_of_iran_modifier: "Ngọn Lửa Ba Tư"
  fp3_rekindler_of_iran_modifier_desc: "Dòng họ này đã giải quyết Intermezzo Iran bằng cách thổi bùng lại ngọn lửa Ba Tư."
  fp3_rekindler_of_iran_modifier_reason: "Ngài có [GetModifier('fp3_rekindler_of_iran_modifier').GetNameWithTooltip|L] [modifier|E]: $VALUE|=+0$"

  dreaded_beauty: "Sắc Đẹp Đáng Sợ"
  dreaded_beauty_desc: "Người ta nói sự tàn nhẫn của nhân vật này xuất phát từ cách người khác phản ứng với dị tật của họ."

  generous_beauty: "Sắc Đẹp Hào Phóng"
  generous_beauty_desc: "Có lẽ để bù đắp cho những lời bàn tán về ngoại hình, vị vua này nổi tiếng vừa hào phóng vừa sẵn sàng tha nợ thuế."

  fp3_flame_of_iran_modifier: "Tinh Thần Ba Tư Được Thổi Bùng"
  fp3_flame_of_iran_modifier_desc: "Tâm trí nhân vật này đang bùng cháy với tinh thần độc lập và cộng đồng mạnh mẽ."

  unified_the_persian_region_house_modifier: "Dòng Họ Người Sáng Lập"
  unified_the_persian_region_house_modifier_desc: "Dòng họ này mang lại sự ổn định cho vùng đất bằng cách thống nhất khu vực"

  fp3_resisted_the_struggle_modifier: "Chống Lại Caliphate"
  fp3_resisted_the_struggle_modifier_desc: "Nhân vật này đã chiến đấu với Caliphate và đạt trạng thái cân bằng quyền lực"

  scheme_helpful_sympathizer_modifier: "Người Thông Cảm Hữu Ích"
  scheme_helpful_sympathizer_modifier_desc: "Một triều thần của mục tiêu đang bí mật cung cấp thông tin cho những kẻ ám sát."

  scheme_untrustworthy_sympathizer_modifier: "Người Thông Cảm Không Đáng Tin"

