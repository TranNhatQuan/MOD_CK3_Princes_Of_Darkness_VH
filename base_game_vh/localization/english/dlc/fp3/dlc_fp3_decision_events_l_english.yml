 # Decision EVENTS 
 ##################################################
  fp3_decision.0001.t: "Thắp Lửa Hoàng Gia"
  fp3_decision.0001.desc_mazdakist: "Dù Mazdak, nếu còn sống, sẽ yêu cầu ta đóng các đền lửa, gọi chúng là biểu tượng của sự phù phiếm, nhưng ta là [ROOT.Char.GetTitleTierName], và có thể chọn một con đường khác. Nếu muốn tôn vinh di sản của ông, ta phải ban phước cho triều đại mình bằng lửa, như các vị vua vĩ đại xưa kia."
  fp3_decision.0001.desc_khurramite: "Có lẽ không ai xứng đáng là [ROOT.Char.GetTitleTierName] của thế giới này. Nhưng nhân dân đã giao phó cho ta vị trí này, và họ xứng đáng được sự bảo hộ của Ātar, #italic yazata#! của nhiệt và ánh sáng."
  fp3_decision.0001.desc_general_zoroastrian: "Giờ khi ta là [ROOT.Char.GetTitleTierName], ta phải cai trị theo ánh sáng vinh quang từ tổ tiên, và cố gắng nhận được thiện cảm của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  fp3_decision.0001_desc_ending: "Ta sẽ tổ chức một nghi lễ tại [ROOT.Char.Custom('ResidenceBuilding')] của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], thắp lên một ngọn lửa lớn, và mong rằng ngọn lửa này cháy suốt triều đại của ta."
  fp3_decision.0001_vassal_and_courtier_opinion_impressed: "Các quan và chư hầu theo tín ngưỡng thù địch có thể không thích, nhưng người khác sẽ #italic rất#! ấn tượng."
  fp3_decision.0001_vassal_and_courtier_opinion: "Các quan và chư hầu theo tín ngưỡng thù địch có thể không thích, nhưng những người khác sẽ ấn tượng."
  fp3_decision.0001.a: "Ta đang làm gì vậy? Các đền phải bị phá bỏ."
  fp3_decision.0001.b: "Một nghi lễ trang trọng, xứng với vinh quang của các vua Ba Tư!"
  fp3_decision.0001.c: "Một nghi lễ khiêm tốn là đủ."
  fp3_decision.0001.d: "Ngọn lửa có thể đợi."
  fp3_decision.0001_pledged_to_quench_fire: "Quyết định này sẽ không khả dụng trong 20 năm."
  fp3_decision.0001.a.tt: "Ngươi thề sẽ dập tắt các ngọn lửa thiêng."

  fp3_decision.0002.t: "Dập Tắt Ngọn Lửa Hoàng Gia"
  fp3_decision.0002.desc: "Tai họa ập đến! Khi quân đội của [occupant.GetName] cướp phá [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] và tấn công [ROOT.Char.Custom('ResidenceBuilding')], một số binh sĩ đã vào phòng chứa lửa hoàng gia của ta và tàn nhẫn dập tắt nó. Điều này có thể được coi là điềm xấu khủng khiếp cho triều đại [ROOT.Char.GetDynastyNameNoTooltip]."
  fp3_decision.0002_fire_destroyed_tt: "Các quan và chư hầu mê tín hoặc nhiệt thành coi đây là điềm xấu cho triều đại của Ngài."
  fp3_decision.0002.a: "Không sao, nó chỉ là một biểu tượng thôi."
  fp3_decision.0002.b: "Tội ác này phải được trả thù!"
  fp3_decision.0002.c: "Giờ ta phải làm gì đây?"
 
  fp3_dynasty_decision.0003.t: "Một Dự Án Ba Tư"
  fp3_dynasty_decision.0003.intro: "Đã đến lúc nhân dân [capital_county.GetName] được chiêm ngưỡng một công trình mới hùng vĩ."
  fp3_dynasty_decision.0003.char: "Ta không thể chọn người phù hợp hơn cho công trình này ngoài [chosen_architect.GetName]. [chosen_architect.GetSheHe|U] có toàn bộ sự tin tưởng của ta."
  fp3_dynasty_decision.0003.desc: "\n\nChúng ta có thể dùng chiến lợi phẩm vừa cướp từ [target_county.GetName] để công trình trở nên lộng lẫy, nhưng điều đó chắc chắn sẽ làm dân chúng phẫn nộ.\n\nNgoài ra, ta có thể tự mình chi trả cho công trình từ ngân khố của mình..."
  fp3_dynasty_decision.0003.a: "Hãy để nhân dân [target_county.GetNameNoTierNoTooltip] thể hiện lòng trung thành!"
  fp3_dynasty_decision.0003.b: "Ta sẽ tự chi trả cho công trình này."
  fp3_dynasty_decision.0003.c: "Ngẫm lại, có lẽ nên để hôm khác."
  cultural_acceptance_built_magnificent_capital: "Công trình địa phương hùng vĩ"

  splurge_above_expectations_toast: "Công trình vượt quá kỳ vọng"
  splurge_as_expected_toast: "Công trình theo đúng kế hoạch"

  fp3_dynasty_decision.0004.t: "Tham Vọng Kiến Trúc"
  fp3_dynasty_decision.0004.intro: "[chosen_architect.GetFirstName] làm việc chăm chỉ, tập hợp lực lượng lao động cho dự án mới."
  fp3_dynasty_decision.0004.plunder.desc: "Vật liệu và công nhân từ [target_county.GetNameNoTier] được đưa đến với số lượng lớn."
  fp3_dynasty_decision.0004.desc: ""Mọi thứ sắp được chuẩn bị xong, [ROOT.Char.Custom('FormOfAddressForLiege')]", [chosen_architect.GetSheHe] tuyên bố. "Nhưng nên xây gì đây?"\n\n"Ta nghĩ đến một lăng mộ vĩ đại, trang trí bằng lapis lazuli từ mỏ Sar-i Sang. Hoặc có thể tân trang [ROOT.Char.Custom('ResidenceBuilding')] theo phong cách truyền thống — chắc chắn sẽ gây ấn tượng với dân chúng [capital_province.GetNameNoTooltip]. Chúng ta cũng có thể mở rộng #italic qanats#!, đài phun nước và bồn tắm, trang trí thật hoành tráng."\n\n"Ngươi muốn gì, [ROOT.Char.GetTitleTierName]?""
  fp3_dynasty_decision.0004.a: "Một lăng mộ cho triều đại [ROOT.Char.GetDynastyNameNoTooltip]."
  fp3_dynasty_decision.0004.b: "Tân trang [ROOT.Char.Custom('ResidenceBuilding')] của ta."
  fp3_dynasty_decision.0004.c: "Bồn tắm và đài phun nước trang trí lộng lẫy."
  every_house_member: "Mọi thành viên của [root_scope.MakeScope.Char.GetHouse.GetBaseNameNoTooltip] [house|E]"

  fp3_dynasty_decision.0005.t: "Tầm Nhìn Hùng Vĩ"
  fp3_dynasty_decision.0005.desc: "Vòng tròn thâm quầng làm gương mặt vốn sáng sủa của [chosen_architect.GetName] trở nên mệt mỏi. [chosen_architect.GetSheHe|U] đã thức trắng đêm, vẽ kế hoạch trang trí tương lai cho [capital_province.GetName].\n\n"Ta hình dung, [ROOT.Char.Custom('FormOfAddressForLiege')], một hammam xinh đẹp, lát gạch sứ nhiều màu. Bên trong, sàn khảm, bồn tắm hơi, hồ nước mát, cây cối trồng trong chậu sứ Trung Quốc..."\n\n"... nhưng nếu ngươi muốn một [ROOT.Char.GetFaith.HouseOfWorship] hoặc một cung điện nhỏ, ta sẽ vẽ kế hoạch mới.""
  fp3_dynasty_decision.0005.a: "Hammam nghe thật tuyệt."
  fp3_dynasty_decision.0005.b: "Ta muốn một [ROOT.Char.GetFaith.HouseOfWorship]."
  fp3_dynasty_decision.0005.c: "Một [ROOT.Char.GetWomanMan] có quá nhiều cung điện sao?"
  fp3_decisons_closer_to_love.tt: "Ngươi và [chosen_architect.GetFirstNameNoTooltip] trở nên thân thiết hơn"

  fp3_dynasty_decision.0007.t: "Xây Dựng Tôn Giáo"
  fp3_dynasty_decision.0007_desc_beginning: "[chosen_architect.GetTitledFirstName] không lãng phí thời gian, bắt đầu vẽ kế hoạch cho một công trình mới tại [capital_province.GetName].\n\n"Chúng ta có thể xây một [ROOT.Char.GetFaith.HouseOfWorship] mới", [chosen_architect.GetSheHe] gợi ý, "với mái vòm lộng lẫy và mặt tiền bằng đá cẩm thạch theo phong cách Ba Tư mới nhất."\n\n"
  fp3_dynasty_decision.0007_dakhma: ""Hoặc một dakhma, Tháp Im Lặng, nơi người chết yên nghỉ cho đến khi [ROOT.Char.Custom('GetRegionalEagleType')] đến ăn. Nhưng ta sẽ làm nó thật vĩ đại, đẹp lộng lẫy, khiến cả chim kền kền cũng phải dừng lại chiêm ngưỡng.""\n\n"
  fp3_dynasty_decision.0007_madrasa: ""Hoặc một madrasa lớn, với các phòng yên tĩnh để học tập và suy ngẫm, nơi tụ họp của các [ROOT.Char.Custom('LevyMenWomen')] học thức từ mọi miền đất nước."\n\n"
  fp3_dynasty_decision.0007_outro: ""Hoặc một bức tranh tường lớn ở tường phía đông, kết hợp chủ đề tôn giáo với lịch sử nhà [ROOT.Char.GetDynastyNameNoTooltip] sẽ thật tuyệt vời!""
  fp3_dynasty_decision.0007.a: "Ta muốn một [ROOT.Char.GetFaith.HouseOfWorship], nếu có thể làm thật tráng lệ."
  fp3_dynasty_decision.0007.b: "Xây dakhma để chúng ta có thể tôn vinh người chết."
  fp3_dynasty_decision.0007.c: "Một madrasa mới chắc chắn sẽ cải thiện vương quốc."
  fp3_dynasty_decision.0007.d: "Ta muốn chiêm ngưỡng bức tranh tường đó..."

  fp3_dynasty_decision.0008.t: "Một Tượng Đài Cho Bản Thân"
  fp3_dynasty_decision.0008.desc: "Ta đã dành nhiều giờ cô độc, vẽ thiết kế để cải thiện [capital_province.GetName].\n\nChắc chắn dự án này sẽ tốt hơn khi là sản phẩm trí tuệ của ta, thay vì bị các tay trung gian và quan lại nịnh hót can thiệp. Nhưng nó sẽ trở thành gì đây?\n\nTa nhìn xuống các ghi chú, thấy ba thiết kế hứa hẹn. Ta có thể..."
  fp3_dynasty_decision.0008.a: "Trang trí và mở rộng chợ."
  fp3_dynasty_decision.0008.b: "Xây quảng trường và giếng nước lớn."
  fp3_dynasty_decision.0008.c: "Xây lăng mộ lớn, cho ngày ta qua đời."
  fp3_dynasty_decision.0008.d: "Thiết kế bồn tắm sang trọng."
  fp3_dynasty_decision.0008.e: "Xây tháp canh cao và lấp lánh."
  fp3_dynasty_decision.0008.f: "Xây cung điện mùa hè để thư giãn."
  fp3_dynasty_decision.0008.g: "Khánh thành một [ROOT.Char.GetFaith.HouseOfWorship] tuyệt vời."

  fp3_decision.0003.t: "Pháo Đài Badd"
  fp3_decision.0003.desc_recently: "Chỉ vài thập kỷ trước, trong thời kháng chiến Khurramite chống lại Abbasids, lãnh đạo nông dân Babak trú ẩn cùng các môn đồ trong pháo đài Parthia cổ. Đó là trận phòng thủ cuối cùng của ông, nhưng Abbasids phải trả giá đắt cho chiến thắng."
  fp3_decision.0001.desc_less_recently: "Ngày đầu triều đại Abbasid, quân đội truy đuổi lãnh đạo Khurramite Babak tới pháo đài cao trên núi trong rừng Arasbaran, nơi ông thực hiện trận phòng thủ cuối cùng. Dù tàn tích đã mòn theo thời gian, địa điểm vẫn ấn tượng và sẽ là một pháo đài tuyệt vời."
  fp3_decision.0001.desc_long_ago: "Trên dãy núi Đen của rừng Arasbaran, một pháo đài bỏ hoang tọa lạc trên đỉnh phủ tuyết. Nơi này từng là trận phòng thủ cuối cùng của anh hùng Khurramite Babak, từ lâu, và ta sẽ khôi phục nó về vinh quang xưa."
  fp3_decision.0003.desc_khurramite: "Người [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] địa phương rất cảm thông với công việc của ta, và đã hứa giúp khôi phục và bảo vệ địa điểm.\n\n"
  fp3_decision.0003.desc_zandik: "Nông dân và người chăn nuôi ở những núi hiểm trở này nổi tiếng khó bảo, nhưng họ ghét giáo sĩ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] cũ, và đã hứa sẽ ủng hộ ta.\n\n"
  fp3_decision.0003.desc_fallback: "Người dân địa phương hiếu chiến và dễ nổi loạn, nhưng họ yêu mến ký ức về Babak, được ghi trong sử thi và bài ca, và sẽ giúp ta xây dựng lại ngôi nhà núi cũ của ông.\n\n"
  fp3_decision.0003.desc_ending: "Đã đến lúc thiết lập một trụ sở mới cho nhà [ROOT.Char.GetDynastyHouseNameNoTooltip], và nó sẽ tồn tại lâu dài!"
  fp3_decision.0003.a: "Ta có thể tìm cách bù đắp một phần chi phí..."
  fp3_decision.0003.b: "Nó sẽ là một pháo đài hùng mạnh!"
  fp3_decision.0003.c: "Ta không cần vinh quang, chỉ cần một pháo đài an toàn."

  fp3_decision.0004.t: "Một Tín Ngưỡng Cho Nhân Dân"
  fp3_decision.0004_alternate.t: "Dập Tắt Ngọn Lửa Vĩnh Hằng"
  fp3_decision.0004_desc: "Chúng ta [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] từ lâu vẫn đi theo con đường riêng, thờ [ROOT.Char.GetFaith.HighGodName] theo cách phù hợp với tâm hồn. Ngay cả trong những ngày xưa vinh quang, chúng ta cũng không cần các [ROOT.Char.GetFaith.random_AltPriestTermPlural] cao nhất với những nghi lễ rườm rà. Giờ đây, thế giới khác xưa, với nhiều thử thách cho đức tin của chúng ta, nhu cầu cải cách chưa bao giờ lớn hơn. Từ nay, giáo sĩ sẽ gần gũi hơn với nhân dân. Chúng ta sẽ tạo tương lai cho chính mình, với vị trí [ROOT.Char.GetFaith.PriestNeuter] mở cho bất kỳ ai được cộng đồng tin tưởng."
  fp3_decision.0004_alternate_desc: "Các [ROOT.Char.GetFaith.random_AltPriestTermPlural] đã từ lâu đàn áp chúng ta [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. Họ bám lấy các ngọn lửa thiêng, quyền lực và tài sản thừa kế. Người ngoài tôn giáo chúng ta từ lâu đã coi những thực hành này với sự khinh miệt. Đủ rồi! Trong [ROOT.Char.GetFaith.GetNameNoTooltip], các [ROOT.Char.GetFaith.HouseOfWorshipPlural] sẽ bị đóng, và các ngọn lửa vĩnh hằng sẽ bị dập tắt mãi mãi. Điều này sẽ phá vỡ quyền lực của các [ROOT.Char.GetFaith.random_AltPriestTermPlural], và mở ra một khởi đầu mới cho [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]. Từ nay, chúng ta sẽ không bị dẫn dắt bởi các [ROOT.Char.Custom('DefaultPriestWomenMen')] phàm trần — chỉ bởi [ROOT.Char.GetFaith.HighGodName]."
  fp3_decision.0004.a: "Điều này sẽ mở ra biết bao cơ hội...cho ta!"


  fp3_decision.0004.b: "Và xin những than hồng hóa tro lạnh!"
  fp3_decision.0004.c: "Ngay cả kẻ nghèo cũng có thể trở thành giáo sĩ."
  fp3_decision.0004.d: "Việc này vì lợi ích chung của mọi người."
  fervor_gain_magi_destroyed: "Các Magi đã được Cải cách"
  destroy_the_magi_opinion_tooltip: "Những nhà cai trị [root_religion.GetAdjective] có tín ngưỡng ôn hòa hơn sẽ rất phẫn nộ vì việc này."
  replace_the_high_priest_effect_tooltip: "[head_of_faith|E] thay đổi từ [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] sang [GetFaithDoctrine('doctrine_no_head').GetBaseName]"

  fp3_decision.0008.t: "Tiếp Nhận Ánh Sáng"
  fp3_decision.0008.desc: "Những [founder.GetFaith.GetAdherentNamePlural] khốn khó đã lâu vật lộn vô vọng, thiếu sự lãnh đạo đúng đắn. Giờ đây nhục nhã của họ đã chấm dứt, vì ta đã tiếp nhận #italic walayah#!, quyền bảo hộ tín đồ, và #italic ánh sáng trên ánh sáng#! của [ROOT.Char.GetFaith.HighGodNameAlternate]. Ta sẽ dẫn dắt họ bằng tất cả kỹ năng và sự sáng suốt mà [ROOT.Char.GetFaith.HighGodNameAlternate] trong trí tuệ [ROOT.Char.GetFaith.HighGodHerHis] ban cho, và hậu duệ của ta sẽ tiếp nối sau. Nguyện điều này mở ra một khởi đầu mới cho [founder.GetFaith.GetAdherentNamePluralNoTooltip]!"
  fp3_decision.0008.a: "Đây sẽ là bổn phận và gánh nặng của ta."
  fp3_decision.0008.b: "Nguyện ánh sáng vô nhiệt chiếu rọi mái nhà của ta!"

  fp3_decision.0009.t: "Một [founder.GetFaith.ReligiousHeadName] Mới"
  fp3_decision.0009.desc: "[founder.GetFirstName] đã tự mình đứng ra nhận lấy trọng trách [founder.GetFaith.ReligiousHeadName] cho các [founder.GetFaith.GetAdherentNamePlural], và dường như nhiều tín đồ của [founder.GetHerHis] đang ủng hộ nước đi táo bạo này. Họ nói rằng [founder.GetSheHe] sở hữu #italic walayah#!, sự dẫn dắt huyền bí của [ROOT.Char.GetFaith.HighGodNameAlternate] cho phép [founder.GetHerHim] dẫn dắt các tín đồ. Mặc dù hiện tại ta có thể chưa ở vị thế để thách thức trực tiếp yêu sách này, nhưng là một trong những nhân vật hàng đầu của [founder.GetFaith.GetNameNoTooltip], ý kiến của ta sẽ rất quan trọng. Ta nên chấp nhận [founder.GetFirstNameNoTooltip] là thủ lĩnh mới của các tín đồ, hay kín đáo chống lại [founder.GetHerHim]?"
  fp3_decision.0009.a: "[founder.GetTitledFirstNameNoTooltip] chắc chắn sẽ chứng minh xứng đáng."
  fp3_decision.0009.b: "Đây là một sự bất công."
  fp3_decision.0009.a.tt: "Ngươi hoàn toàn chấp nhận [founder.GetFaith.ReligiousHeadName] này."
  fp3_decision.0009.b.tt: "Ngươi âm thầm tuân thủ… tạm thời."
  fp3_decision.0009.c: "[founder.GetFaith.GetAdherentNamePluralNoTooltip] xứng đáng có một lãnh đạo thực sự…"

  fp3_decision.0010.t: "Một [founder.GetFaith.ReligiousHeadName] Mới"
  fp3_decision.0010.desc: "[founder.GetFirstName] đã tập hợp đủ sự ủng hộ và lòng mộ đạo được công nhận để tự xưng là [founder.GetFaith.ReligiousHeadName] của các [founder.GetFaith.GetAdherentNamePlural]. Trong khi một số người Shiite ăn mừng điều này như một chiến thắng nhỏ cho niềm tin của họ vào #italic ismah#!, sự không thể hư hỏng của [founder.GetFaith.ReligiousHeadTitleName], thì nhiều [islam_religion_adherent_plural] mang tư tưởng cộng đồng lại than khóc về sự xuất hiện của một vết nứt khác trong Ummah. Trong khi đó, [founder.GetFaith.GetAdherentNamePluralNoTooltip] có vẻ còn cực đoan hơn bao giờ hết."
  fp3_decision.0010.a: "Ta cần suy nghĩ về việc này..."
  fp3_decision.0010.b: "Ta phải cảnh giác..."


  fp3_decision.0011.t: "Báo Thù Cho Các Anh Hùng Tử Đạo"
  fp3_decision.0011_opening.desc: "Từ lâu, sự phản kháng kiên cường của Muhakkima đối với sự thỏa hiệp hèn nhát của [ali.GetFirstNamePossessive] với kẻ chiếm ngôi [muawiya.GetFirstName] đã khiến chúng ta trở thành kẻ ghét của cả Sunni lẫn Shia. Kể từ đó, những #italic fedayeen#! của chúng ta đã ngã xuống để giết kẻ phản bội và kẻ bỏ đạo, và đưa Muhakkima trở lại vị thế nổi bật.\n\nGiờ đây, ngày ấy đã đến — các caliph phản bội đã sụp đổ, và dưới sự lãnh đạo của ta, [ROOT.Char.GetFaith.GetAdherentNamePlural] đã giành lại Mesopotamia và các địa điểm linh thiêng cổ xưa của chúng ta."
  fp3_decision.0011_fanatic_murderer.desc: "Sớm thôi, tất cả [ROOT.Char.GetFaith.GetReligion.GetName] sẽ từ bỏ những niềm tin sai lầm, và gia nhập cuộc chiến chính nghĩa của chúng ta — hoặc chết!"
  fp3_decision.0011_unfanatic_unmurderer.desc: "Sớm thôi, những diễn giả và thi nhân vĩ đại của chúng ta sẽ được nghe khắp Ummah, và quy hướng vô số người theo con đường chính nghĩa của chúng ta."
  fp3_decision.0011.a: "Lā ḥukma illā lillāh!"  

  fp3_decision.0012.t: "Sự Trỗi Dậy của [avenger.GetFaith.GetNameNoTooltip]"
  fp3_decision.0012.desc: "[avenger.GetName] đã tập hợp đủ ủng hộ và đức hạnh để khởi xướng làn sóng ủng hộ [avenger.GetFaith.GetAdherentName] trên nhiều vùng rộng lớn của thế giới Hồi giáo. Tin đồn rằng nhiều nhà cai trị và thị trấn đã theo đạo của [avenger.GetHerHis], dù tự nguyện hay không, và chỉ có [ROOT.Char.GetFaith.HighGodName] mới biết [avenger.GetSheHe] sẽ làm gì tiếp theo."
  fp3_decision.0012.a: "Đây là một ngày vinh quang cho Hồi giáo!"
  fp3_decision.0012.b: "Thật kinh khủng…"

  fp3_decision.0013.t: "Sự Phản Đối của [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
  fp3_decision.0013.desc: "Đặc sứ của [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetNamePossessive], [hof_emissary.GetName], có vẻ rất tức giận, điều này có thể ám chỉ đôi chút về cảm xúc của chính [righteous_caliph.GetTitledFirstNamePossessive] trong vấn đề này.\n\n\"[righteous_caliph.GetFaith.ReligiousText] đã được mặc khải cho thế giới bằng tiếng Ả Rập, và không được phép đọc bằng bất kỳ ngôn ngữ nào khác\", [hof_emissary.GetFirstNameNoTooltip] tuyên bố, \"cũng không được phép đọc bất kỳ cuốn sách, cuộn giấy hay bảng sáp nào khác về vấn đề đức tin, không phải khi chủ nhân của ta, [righteous_caliph.GetTitleTierName] vĩ đại, vẫn còn hơi thở. [righteous_caliph.GetSheHe|U] yêu cầu ngươi chấm dứt ngay những nỗ lực dịch thuật sai lầm của mình, và cắt đứt mối liên hệ với những học giả phạm thượng.\" [hof_emissary.GetSheHe|U] tạm dừng.\n\n\"Nhưng đừng tuyệt vọng, [righteous_caliph.GetTitleTierName] trong sự hào phóng của [righteous_caliph.GetHerHis] sẽ trả lại cho ngươi phần lớn số vàng ngươi đã tiêu tốn cho trò hề này.\""
  fp3_decision.0013.a: "Chà, con đường của ta đã được định."
  fp3_decision.0013.b: "Được thôi, ta sẽ đảo ngược chính sách."

  fp3_decision.0014.t: "Niềm Tự Hào Ba Tư"
  fp3_decision.0014_opening.desc: "Dù sự bảo trợ của ta mới chỉ bắt đầu, một số #italic ulama#! ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] đã bắt đầu sản xuất tác phẩm bằng ngôn ngữ địa phương, và [persian_genius_ulama.GetName] dường như đặc biệt hăng hái.\n\n“Ta đã ủng hộ điều này từ lâu,” [persian_genius_ulama.GetSheHe] nói. “Vĩ đại của [ROOT.Char.GetFaith.GetReligion.GetName] được xây dựng trên sự kết hợp giữa tài năng Ả Rập và sự tinh tế, tri thức Ba Tư, và đã đến lúc Ba Tư khôi phục vai trò là ngọn hải đăng của ánh sáng tinh thần. Ta đã dịch và chú giải nhiều hadith, thậm chí tìm lại một số tác phẩm thất lạc của Hasan al-Basri, được lưu giữ trong các thư viện cũ ở Gundeshapur…"
  fp3_decision.0014_there_is_caliph.desc: "Trong khi đó, [uncaring_caliph.GetTitledFirstName] vẫn im lặng, quan sát những diễn biến này với sự lo ngại."
  fp3_decision.0014_no_caliph.desc: "Ta nhìn vào [persian_genius_ulama.GetWomanMan] đầy tham vọng này. Có lẽ ta có thể tận dụng [persian_genius_ulama.GetHerHim] tốt hơn?"
  fp3_decision.0014.a: "Nghe có vẻ hứa hẹn!"
  fp3_decision.0014.b: "Ngươi nên ở lại và làm việc trực tiếp cho ta."
  promote_persian_scripture_cannot_take_decision.tt: "Ngươi sẽ không thể thực hiện quyết định này lần nữa trong 30 năm."
  pledged_to_not_promote_persian_desc: "Ngươi đã cam kết không thúc đẩy kinh điển Ba Tư."

  fp3_decision.0015.t: "Thông Báo Trong Buổi Cầu Nguyện Thứ Sáu"
  fp3_decision.0015.desc.switch.supporter_becoming_detractor: "Ta đã tuyên bố rằng từ nay, trong lãnh thổ của ta, tên của [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] sẽ được đọc cuối cùng trong buổi cầu nguyện thứ Sáu, khi tất cả [ROOT.Char.Custom('LevyMenWomen')] trong vương quốc tập trung tại [ROOT.Char.GetFaith.HouseOfWorshipPlural] địa phương.\n\nDấu hiệu rõ ràng của chủ nghĩa ly khai này chắc chắn sẽ khiến những kẻ hầu hạ ta tức giận, nhưng ai quan tâm đến ý kiến của bọn nịnh thần?"
  fp3_decision.0015.desc.switch.detractor_becoming_supporter: "Ta đã tuyên bố rằng từ nay, trong lãnh thổ của ta, tên của [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] sẽ được đọc đầu tiên và quan trọng nhất trong buổi cầu nguyện thứ Sáu.\n\nĐây là thời điểm [ROOT.Char.Custom('LevyMenWomen')] vương quốc tập trung tại [ROOT.Char.GetFaith.HouseOfWorshipPlural] địa phương để thờ cúng, và điều này sẽ là dấu hiệu rõ ràng về sự phục tùng và ủng hộ của ta cho sự thống nhất của caliphate."
  fp3_decision.0015.desc.switch.presently_neutral: "Các nhà cai trị xung quanh đang chọn phe, hoặc ủng hộ sự thống nhất của [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetName] hoặc khẳng định độc lập.\n\nDù hiện tại ta chưa chọn, thay đổi quan điểm là đơn giản. Ta chỉ cần tuyên bố liệu tên của [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] sẽ được đọc đầu hay cuối trong buổi cầu nguyện thứ Sáu — trước mặt [ROOT.Char.Custom('LevyMenWomen')] tập trung tại [ROOT.Char.GetFaith.HouseOfWorshipPlural] địa phương."
  fp3_decision.0015.desc.liege.presently_neutral: "Chắc chắn [ROOT.Char.GetLiege.GetTitledFirstName] hy vọng ta sẽ theo bước [ROOT.Char.GetLiege.GetHerHis] trong vấn đề này."
  fp3_decision.0015.desc.liege.aligning: "May mắn thay, điều này đưa ta hoàn toàn phù hợp với lãnh chúa [ROOT.Char.GetLiege.GetTitledFirstName], người chia sẻ niềm tin mới của ta."
  fp3_decision.0015.desc.liege.contradicting: "Tuy nhiên, lo lắng là lãnh chúa [ROOT.Char.GetLiege.GetTitledFirstName] không chia sẻ quan điểm của ta, và có thể đánh giá thấp lập trường mới của ta."
  fp3_decision.0015.desc.liege.fallback: "Dù quan trọng với ta và [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNameNoTooltip], ta nghi ngờ lãnh chúa [ROOT.Char.GetLiege.GetTitledFirstName] quan tâm đến chính trị Sunni nội bộ này."
  fp3_decision.0015.a: "Ta ủng hộ [ROOT.Char.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip], nhưng không ủng hộ [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]."
  fp3_decision.0015.a.tt: "Tên của ngươi được đọc thay cho [ROOT.Char.Custom2('YourCharacterIntroduction', ROOT.Char.GetLiege)]"
  fp3_decision.0015.b: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNameNoTooltip] có lòng trung thành của ta!"
  fp3_decision.0015.c: "Ta quan trọng hơn cả hai kẻ ngu này."
  fp3_decision.0015.c.tt: "$fp3_decision.0015.a.tt$"
  fp3_decision.0015.d: "Vị trí của [ROOT.Char.GetFaith.GetReligiousHead.GetHerHis|U] là ở [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], không phải [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  fp3_decision.0015.e: "Có lẽ tên của ta nên thay cho tên lãnh chúa..."
  fp3_decision.0015.e.tt: "$fp3_decision.0015.a.tt$"
  fp3_decision.0015.f: "Ta đã làm một việc táo bạo ở đây."
  fp3_decision.0015.vassal_semi_rebel: "Chư hầu bác bỏ quyền bá chủ của ngươi"

  fp3_misc_decisions.0010.opening: "Gửi Đến Chỉ Huy Tín Đồ,"
  fp3_misc_decisions.0010.desc_intro: "Ta hân hạnh công nhận triều đại được ban phước và đức hạnh của ngươi trên thế giới này."
  fp3_misc_decisions.0010.desc_struggle: "Nguyện [recipient.GetFaith.HighGodName] ban phước cho nỗ lực của ngươi chống lại những kẻ nổi loạn độc ác đe dọa quyền cai trị của ngươi."
  fp3_misc_decisions.0010.a: "Tuyệt vời."

  fp3_misc_decisions.0011.desc: "Dù ta công nhận ngươi là [recipient.GetFaith.ReligiousHeadName] hợp pháp của ta, ta không thể tuân theo yêu cầu của ngươi."
  fp3_misc_decisions.0011.a: "Kẻ vô đức!"

  fp3_misc_decisions.0015.t: "Theo Đạo Zoroastrian"
  fp3_misc_decisions.0015.desc: "Dù thế nào, ta sẽ theo lời dạy của $zoroastrianism_good_god_zoroaster$ và chống lại sự hủy diệt của $zoroastrianism_devil_name$. Nhưng trong lúc cần thiết, tín ngưỡng nào sẽ là của riêng ta?"
  fp3_misc_decisions.0015.a: "Ta sẽ thực hành [zoroastrian_faith_1.GetName]."
  fp3_misc_decisions.0015.b: "[zoroastrian_faith_2.GetName|U] là lựa chọn rõ ràng."
  fp3_misc_decisions.0015.c: "Trái tim ta nghiêng về [zoroastrian_faith_3.GetName]."

  fp3_misc_decisions.0020.t: "Thách Thức Được Đáp: Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
  fp3_misc_decisions.0020.desc.a: "Bầm dập và đầy vết thương, [recipient.GetFirstName] đã hiểu rằng [recipient.GetSheHe] phải nhường bước cho kẻ nắm vững ngôi nhà chúng ta hơn.\n\nSức mạnh đơn thuần không làm ta xứng đáng; cuối cùng, chính quyết tâm dẫn dắt Nhà [ROOT.Char.GetHouse.GetBaseName] đến vinh quang — điều mà [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] yếu đuối chưa từng làm được — đã chiến thắng."
  fp3_misc_decisions.0020.desc.a.lethal: "[recipient.GetFirstName], vết nhơ trong danh tiếng gia tộc, đã chết, và quyền lãnh đạo của ta trong ngôi nhà không thể chối cãi.\n\nSức mạnh đơn thuần không làm ta xứng đáng; cuối cùng, quyết tâm dẫn dắt Nhà [ROOT.Char.GetHouse.GetBaseName] đến vinh quang — điều mà [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] yếu đuối chưa từng làm được — đã chiến thắng."
  fp3_misc_decisions.0020.desc.b: "Kiệt sức, ta ngước nhìn khuôn mặt [recipient.GetFirstNamePossessive]. Ánh mắt cứng rắn của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('recipient'))] xác nhận điều ta đã biết: ta đã thất bại...\n\n"Phải có can đảm để dẫn dắt một ngôi nhà," [recipient.GetSheHe] thở dài. "Chính ta phải gánh vác gánh nặng Nhà [ROOT.Char.GetHouse.GetBaseName]."\n\nKhông còn nghi ngờ gì nữa, [recipient.GetFirstNameNoTooltip] đã chứng minh điểm yếu của ta trước triều đình..."
  fp3_misc_decisions.0020.lose.a: "Ta không đủ mạnh."
  fp3_misc_decisions.0020.lose.b: "Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] là #bold #EMP CỦA TA!#!"
  fp3_misc_decisions.0020.win.a: "Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] cúi phục ta!"
  fp3_misc_decisions.0020.win.b: "Ngươi đã chiến đấu anh dũng, đứng đầu gia tộc chúng ta!"

  fp3_misc_decisions.0022.t: "Thách Thức Đặt Ra: Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
  fp3_misc_decisions.0022.desc.intro: "Khi ta đến [duel_location.GetBaseNameNoTierNoTooltip], [recipient.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] của ta, đã sẵn sàng chờ đợi. [recipient.GetSheHe|U] chào đón ta như một người thân [ROOT.Char.GetWomanMan], đánh giá ta khi triều đình tập trung để chứng kiến lời thách thức của ta."
  fp3_misc_decisions.0022.desc.body: "\n\n"Thế thì hãy ra trận," [recipient.GetSheHe] nói một cách cứng rắn, "Hãy quyết định số phận của Nhà [ROOT.Char.GetHouse.GetBaseName].""
  fp3_misc_decisions.0022.trigger_failure.actor: "[trial_by_combat_trial|E] của ta với [recipient.GetFirstNameNoTooltip] đã bị vô hiệu."
  fp3_misc_decisions.0022.trigger_failure.recipient: "[trial_by_combat_trial|E] của ta với [actor.GetFirstNameNoTooltip] đã bị vô hiệu."
  fp3_misc_decisions.0022.a: "Người [actor.GetWomanMan] xuất sắc hơn sẽ thắng."
  fp3_misc_decisions.0022.a.tt: "[single_combat_duel|E] bắt đầu!"

  fp3_misc_decisions.0023.desc.a: "Bầm dập và đầy vết thương, [actor.GetFirstName] đã hiểu rằng [actor.GetSheHe] thật ngớ ngẩn khi thách thức ta làm lãnh đạo ngôi nhà.\n\nThử thách của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('actor'))] yếu đuối chỉ chứng minh ta xứng đáng là lãnh đạo đối với cả Nhà [ROOT.Char.GetHouse.GetBaseName] và thần dân."
  fp3_misc_decisions.0023.desc.a.lethal: "Cuối cùng, [actor.GetFirstName] nằm chết, cùng tất cả tham vọng phá hoại và xấu xa của [actor.GetHerHis].\n\nThử thách yếu đuối của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('actor'))] chỉ chứng minh ta xứng đáng là lãnh đạo đối với cả Nhà [ROOT.Char.GetHouse.GetBaseName] và thần dân."
  fp3_misc_decisions.0023.desc.b: "Kiệt sức, ta ngước nhìn khuôn mặt [actor.GetFirstNamePossessive]. Ánh mắt chiến thắng của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('recipient'))] xác nhận điều ta đã biết: ta đã thất bại...\n\n"Cuối cùng, ngôi nhà chúng ta sẽ có lãnh đạo mạnh mẽ" [actor.GetSheHe] thở dài. "Chính ta phải gánh vác gánh nặng Nhà [ROOT.Char.GetHouse.GetBaseName]."\n\nKhông còn nghi ngờ gì nữa, [actor.GetFirstNameNoTooltip] đã chứng minh điểm yếu của ta trước triều đình..."
  fp3_misc_decisions.0023.lose.a: "Ta không đủ mạnh."
  fp3_misc_decisions.0023.win.a: "Người chăn cừu phải giữ đàn [ROOT.Char.GetHerHis] trong tầm kiểm soát."

  fp3_misc_decisions.0025.t: "Người [SCOPE.sC('recipient').Custom2('RelationToMeShort', SCOPE.sC('actor'))] của ta [ROOT.Char.GetFirstNameNoTooltip],"
  fp3_misc_decisions.0025.desc: "Rõ ràng ngươi chưa sẵn sàng gánh vác trách nhiệm lãnh đạo Nhà [ROOT.Char.GetHouse.GetBaseName].\n\nTa phải từ chối thử thách sai lầm này, vì lợi ích của gia tộc."
  fp3_misc_decisions.0025.a: "Cuối cùng, ngươi sẽ buộc phải công nhận ta!"
  fp3_misc_decisions.0025.b: "Sự coi thường ngu ngốc của ngươi sẽ không bị quên."

  fp3_misc_decisions.0026.desc: "Khi ta đến [duel_location.GetBaseNameNoTierNoTooltip], người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] của ta, [recipient.GetTitledFirstName], đang bình tĩnh chờ đợi. [recipient.GetSheHe|U] ôm ta trước mặt triều đình, tuân thủ tất cả nghi lễ của gia tộc.\n\n[recipient.GetSheHe|U] mỉm cười mỏng manh, 'Hãy đến đây [recipient.Custom2('RelationToMeShort', SCOPE.sC('actor'))], hãy cho ta nghe điều ngươi muốn nói.'\n\n[recipient.GetFirstNameNoTooltip] yêu cầu chuẩn bị trà rượu khi chúng ta ngồi xuống, rồi quay sang ta đầy trông đợi."
  fp3_misc_decisions.0026.desc.no_court: "Khi ta đến [duel_location.GetBaseNameNoTierNoTooltip], người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] của ta, [recipient.GetTitledFirstName], đang bình tĩnh chờ đợi. Chúng ta ôm nhau, tuân thủ tất cả nghi lễ của gia tộc.\n\n[recipient.GetSheHe|U] mỉm cười mỏng manh, 'Hãy đến đây [recipient.Custom2('RelationToMeShort', SCOPE.sC('actor'))], hãy cho ta nghe điều ngươi muốn nói.'\n\n[recipient.GetFirstNameNoTooltip] yêu cầu chuẩn bị trà rượu khi chúng ta ngồi xuống, rồi quay sang ta đầy trông đợi."
  fp3_misc_decisions.0026.a: "Bắt đầu từ đâu nhỉ..."
  fp3_misc_decisions.0026.a.tt: "Cuộc trò chuyện bắt đầu!"

  fp3_misc_decisions.0027.desc: "Ta bắt đầu với lịch sử Nhà [actor.GetHouse.GetBaseName] và những thành tựu của [actor.GetHouse.GetFounder.GetTitledFirstName], từ từ dẫn tới hiện tại.\n\n[recipient.GetFirstName] lắng nghe kiên nhẫn, thi thoảng gật đầu khi ta tóm tắt những mối đe dọa đối với gia tộc và cách đối phó.\n\nKhi ta kết thúc, người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] nói bình tĩnh, 'Vâng, rất tốt. Nhưng tại sao #EMP ngươi#! lại xứng đáng lãnh đạo gia tộc hơn ta?'"
  fp3_misc_decisions.0027.desc.founder: "Ta bắt đầu với lịch sử Nhà [actor.GetHouse.GetBaseName] và những thành tựu của tổ tiên, từ từ dẫn tới hiện tại.\n\n[recipient.GetFirstName] lắng nghe kiên nhẫn, thi thoảng gật đầu khi ta tóm tắt các mối đe dọa đối với gia tộc và cách đối phó.\n\nKhi ta kết thúc, người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] nói bình tĩnh, 'Vâng, rất tốt. Nhưng tại sao #EMP ngươi#! lại xứng đáng lãnh đạo gia tộc hơn ta?'"
  fp3_misc_decisions.0027.a.sick: "Hãy nhìn sức khỏe của ngươi, ta có thể gánh vác gánh nặng thay ngươi."
  fp3_misc_decisions.0027.a.sick.tt: "Lựa chọn này khả dụng vì [recipient.GetSheHe] đang ốm yếu"
  fp3_misc_decisions.0027.a.old: "Đã đến lúc thế hệ tiếp theo lèo lái gia tộc."
  fp3_misc_decisions.0027.a.old.tt: "Lựa chọn này khả dụng vì [recipient.GetSheHe] lớn tuổi hơn ngươi nhiều"
  fp3_misc_decisions.0027.a.young: "Ngươi còn trẻ và thiếu kinh nghiệm, còn nhiều điều phải học."
  fp3_misc_decisions.0027.a.young.tt: "Lựa chọn này khả dụng vì [recipient.GetSheHe] trẻ hơn ngươi"
  fp3_misc_decisions.0027.a.trigger: "[recipient.GetSheHe|U] phải đang ốm yếu, hoặc lớn tuổi hơn hoặc trẻ hơn ngươi"
  fp3_misc_decisions.0027.b.vassal: "Là thần dân của [actor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], hãy nghe ta."
  fp3_misc_decisions.0027.b.vassal.tt: "Lựa chọn này khả dụng vì [recipient.GetSheHe] là [vassal|E] của ngươi hoặc thấp hơn"
  fp3_misc_decisions.0027.b.tier: "Là [recipient.GetTitleAsNameNoTooltip], hãy nghe lời ta với tư cách [actor.GetTitleAsNameNoTooltip]."
  fp3_misc_decisions.0027.b.tier.tt: "Lựa chọn này khả dụng vì [recipient.GetHerHis] [rank|E] thấp hơn"
  fp3_misc_decisions.0027.b.military: "Chỉ có ta mới đủ sức bảo vệ gia tộc."
  fp3_misc_decisions.0027.b.military.tt: "Lựa chọn này khả dụng vì quân đội của [recipient.GetHerHis] nhỏ hơn nhiều"
  fp3_misc_decisions.0027.b.dread: "Ngươi có thật sự muốn khiến ta tức giận?"
  fp3_misc_decisions.0027.b.dread.tt: "Lựa chọn này khả dụng vì [recipient.GetSheHe] sợ ngươi"
  fp3_misc_decisions.0027.b.trigger: "Ngươi phải là [recipient.GetHerHis] [liege|E], có [rank|E] cao hơn, có quân đội lớn hơn nhiều, hoặc [dreadful|E]"
  fp3_misc_decisions.0027.accept: "[recipient.GetFirstNameNoTooltip] chấp nhận lập luận của ngươi"
  fp3_misc_decisions.0027.bargain: "[recipient.GetFirstNameNoTooltip] muốn nhận một điều đổi lại"
  fp3_misc_decisions.0027.bargain.tt: "[recipient.GetFirstName] sẽ đưa ra một yêu cầu"
  fp3_misc_decisions.0027.reject: "[recipient.GetFirstNameNoTooltip] từ chối lập luận của ngươi"
  fp3_misc_decisions.0027.c: "Xin tha lỗi, nhưng ngươi #EMP biết#! Ta năng lực hơn."
  fp3_misc_decisions.0027.c.trigger: "[skills|E] tổng hợp của ngươi phải cao hơn [recipient.GetHerHis]"
  fp3_misc_decisions.0027.c.tt: "Lựa chọn này khả dụng vì kỹ năng tổng hợp của ngươi cao hơn [recipient.GetFirstNamePossessiveNoTooltip]"
  fp3_misc_decisions.0027.d: "Hãy bước sang một bên, [recipient.GetFirstNameNoTooltip]."
 
  fp3_misc_decisions.0028.desc: "[actor.GetFirstName] đã đến [duel_location.GetBaseNameNoTierNoTooltip] để đưa ra những lý lẽ ngụy biện của [actor.GetHerHis] về việc tiếp quản vị trí người đứng đầu Gia tộc [actor.GetHouse.GetBaseName]. Ta đủ lịch sự để ôm [actor.GetHerHim] trước khi đàm phán.\n\n[actor.GetSheHe|U] nói về lịch sử gia tộc chúng ta, từ những ngày của [actor.GetHouse.GetFounder.GetTitledFirstName] cho đến hiện tại, và ta kiên nhẫn chờ đợi điểm mấu chốt trong lập luận của [actor.GetHerHis].\n\nCuối cùng, nó cũng đến: \"[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U]...\""
  fp3_misc_decisions.0028.desc.founder: "[actor.GetFirstName] đã đến [duel_location.GetBaseNameNoTierNoTooltip] để đưa ra những lý lẽ ngụy biện của [actor.GetHerHis] về việc tiếp quản vị trí người đứng đầu Gia tộc [actor.GetHouse.GetBaseName]. Ta đủ lịch sự để ôm [actor.GetHerHim] trước khi đàm phán.\n\n[actor.GetSheHe|U] nói về lịch sử gia tộc chúng ta, từ những ngày của tổ tiên xa xưa cho đến hiện tại, và ta kiên nhẫn chờ đợi điểm mấu chốt trong lập luận của [actor.GetHerHis].\n\nCuối cùng, nó cũng đến: \"[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U]...\""
  fp3_misc_decisions.0028.sick: "$fp3_misc_decisions.0027.a.sick$" Vậy là vì sức khỏe của ta à...? $fp3_misc_decisions.0028.perhaps$"
  fp3_misc_decisions.0028.old: "$fp3_misc_decisions.0027.a.old$" Vậy là vì tuổi tác của ta à...? $fp3_misc_decisions.0028.perhaps$"
  fp3_misc_decisions.0028.young: "$fp3_misc_decisions.0027.a.young$" Vậy là vì ta còn trẻ à...? $fp3_misc_decisions.0028.perhaps$"
  fp3_misc_decisions.0028.vassal: "$fp3_misc_decisions.0027.b.vassal$" Ta không thể phủ nhận. $fp3_misc_decisions.0028.perhaps$"
  fp3_misc_decisions.0028.tier: "$fp3_misc_decisions.0027.b.tier$" Ta không thể phủ nhận. $fp3_misc_decisions.0028.perhaps$"
  fp3_misc_decisions.0028.military: "$fp3_misc_decisions.0027.b.military$" Ta không thể phủ nhận. $fp3_misc_decisions.0028.perhaps$"
  fp3_misc_decisions.0028.dread: "$fp3_misc_decisions.0027.b.dread$" Thật khiếp nhỉ! Mặc dù... $fp3_misc_decisions.0028.perhaps$"
  fp3_misc_decisions.0028.skill: "$fp3_misc_decisions.0027.c$\n\nTa không đến nỗi vô năng vậy chứ…?"
  fp3_misc_decisions.0028.fallback: "$fp3_misc_decisions.0027.a.sick$" Chẳng lẽ đó là tất cả những gì [actor.GetSheHe] muốn nói?"
  fp3_misc_decisions.0028.perhaps: "Có lẽ [actor.GetSheHe] đúng."
  fp3_misc_decisions.0028.bargain.tt: "Nếu [actor.GetShortUIName] đồng ý:"

  fp3_misc_decisions.0028.a: "Ngươi đúng, #EMP ngươi#! xứng đáng lãnh đạo gia tộc."
  fp3_misc_decisions.0028.b: "Được thôi, nhưng ta muốn giữ vai trò cố vấn."
  fp3_misc_decisions.0028.c: "Một lãnh đạo xứng đáng chắc chắn có khả năng chứng minh lời nói của [actor.GetHerHis]."
  fp3_misc_decisions.0028.d: "Có lẽ ngươi có thể tiếp quản, nhưng ta muốn đảm bảo từ ngươi."
  fp3_misc_decisions.0028.e: "Không, ta không nghĩ vậy."

  fp3_misc_decisions.0029.desc: "[recipient.GetFirstName] suy nghĩ về lời ta, chăm chú nhìn mặt ta khi triều đình xôn xao xung quanh. Sau một thời gian dài, [recipient.GetSheHe]"
  fp3_misc_decisions.0029.desc.no_court: "[recipient.GetFirstName] suy nghĩ về lời ta, chăm chú nhìn mặt ta khi căn phòng xôn xao xung quanh. Sau một thời gian dài, [recipient.GetSheHe]"
  fp3_misc_decisions.0029.accept: "gật đầu.\n\n'Vâng. Có thể ngươi đúng.' [recipient.GetSheHe|U] nói đầy suy tư. 'Từ hôm nay, ngươi sẽ là thủ lĩnh Nhà [actor.GetHouse.GetBaseName]. Nguyện [recipient.GetFaith.HighGodName] dẫn dắt ngươi và gia tộc chúng ta.'"
  fp3_misc_decisions.0029.regent: "ngồi thẳng dậy.\n\n'Ta có thể sẵn sàng nhường chỗ,' [recipient.GetSheHe|U] nói cẩn trọng. 'Nếu ngươi cho ta một vị trí trong chính quyền [actor.GetPrimaryTitle.GetBaseNameNoTooltip]...'"
  fp3_misc_decisions.0029.gold: "nhướn mày.\n\n'Ta có thể sẵn sàng nhường chỗ,' [recipient.GetSheHe|U] nói cẩn trọng. 'Nếu ngươi chứng minh trước rằng có đủ tài sản để chăm lo cho gia tộc chúng ta...'"
  fp3_misc_decisions.0029.hook: "mỉm cười.\n\n'Ta có thể sẵn sàng nhường chỗ,' [recipient.GetSheHe|U] nói cẩn trọng. 'Nếu ngươi đảm bảo sẽ là một người Ngài...'"
  fp3_misc_decisions.0029.fail: "nhăn mặt.\n\n'Không. Lập luận của ngươi quá yếu,' [recipient.GetSheHe|U] nói khinh thường. 'Là thủ lĩnh chính thức của Nhà [actor.GetHouse.GetBaseName], ta ra lệnh ngươi quên đi ý tưởng nực cười này.'"
  fp3_misc_decisions.0029.a: "Ta sẽ làm hết sức mình."
  fp3_misc_decisions.0029.b: "Được thôi, sẽ thực hiện."
  fp3_misc_decisions.0029.c: "Số phận của gia tộc chúng ta không phải để mặc cả."
  fp3_misc_decisions.0029.d: "Tên ngốc #EMP đó#! sẽ học được giá trị của ta, bằng cách này hay cách khác."

  fp3_misc_decisions.0030.desc: "[recipient.GetFirstName] cân nhắc đề xuất của ta, dò xét ta bằng ánh mắt [recipient.GetHerHis].\n\n"
  fp3_misc_decisions.0030.accept: "Cuối cùng [recipient.GetSheHe] thở dài, 'Được thôi, [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))], ngươi sẽ có điều ngươi muốn.'"
  fp3_misc_decisions.0030.reject: "Cuối cùng [recipient.GetSheHe] lắc đầu và nói, với vẻ khinh miệt: \"Số phận của gia tộc chúng ta không phải để đem ra mặc cả!\""
  fp3_misc_decisions.0030.a: "Rất tốt!"
  fp3_misc_decisions.0030.b: "Vậy thì không còn gì để bàn..."

  fp3_misc_decisions.0041.intro: "Khi [house_head.GetFirstName] quay người bỏ đi, gương mặt đầy vẻ khinh miệt, ta nắm lấy cơ hội của mình.\n\n\""
  fp3_misc_decisions.0041.desc.success: "Kẻ ngu ngốc đó khó lòng nhận ra sự tiếp cận nhanh chóng của ta, gần như không phản ứng khi ta đâm con dao găm vào ngực [house_head.GetHerHis].\n\nKhi [house_head.GetSheHe] nhìn xuống, đầy khó hiểu, ta tiến lại gần và thì thầm: \"Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip], là #bold #EMP CỦA TA!#!#!\", trước khi rút lưỡi dao ra khỏi bụng [house_head.GetHerHis]."
  fp3_misc_decisions.0041.desc.failure: "Con chó ranh mãnh đó đã kịp thời né tránh con dao găm vung vẩy của ta, và kêu gọi lính canh của [house_head.GetHerHis]! Ta không thể dồn [house_head.GetHerHim] vào góc trước khi họ ập đến, ghim chặt ta xuống sàn.\n\n[house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))] của ta đứng phía trên ta và gầm gừ: \"Ném con rắn này vào ngục tối!\""
  fp3_misc_decisions.0041.a: "Lãnh đạo một gia tộc cần sự tinh ranh, [house_challenger.Custom2('RelationToMeShort', SCOPE.sC('house_head'))]!"
  fp3_misc_decisions.0041.b: "Ngươi sẽ trả giá cho điều này!"

  fp3_misc_decisions.0042.intro: "Khi ta quay người bỏ đi để mặc [house_challenger.GetFirstName] đang bị sỉ nhục với những suy nghĩ độc ác của [house_challenger.GetHerHis], một tia sáng lọt vào mắt ta."
  fp3_misc_decisions.0042.desc: "$fp3_misc_decisions.0042.intro$\n\nTa kịp thời nhảy né ra để tránh con dao găm vung vẩy của [house_challenger.GetHerHis], và kêu gọi lính canh của ta.\n\n[house_challenger.GetSheHe|U] nhanh chóng bị ghim xuống sàn, quằn quại và gào thét: \"Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] là #bold #EMP CỦA TA!#!#!\""
  fp3_misc_decisions.0042.a: "Ném con rắn này vào ngục!"

  fp3_misc_decisions.0043.desc: "$fp3_misc_decisions.0042.intro$\n\nCon quỷ đứng trước mặt ta, một tia sáng độc ác trong mắt [house_challenger.GetHerHis], cánh tay [house_challenger.GetHerHis] đưa ra, nắm đấm siết chặt lấy chuôi kiếm...\n\n[house_challenger.GetSheHe|U] tiến lại gần và thì thầm: \"Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip], là #bold #EMP CỦA TA!#!#!\", trước khi rút lưỡi dao ra khỏi bụng ta."
  fp3_misc_decisions.0043.a: "#DIE1 [house_head.Custom2('RelationToMeShort', SCOPE.sC('house_challenger'))]....#!"

  fp3_misc_decisions.0051.t: "Phong tục gia tộc"
  fp3_misc_decisions.0051.desc: "Ta nhận ra ràng buộc gia đình là chìa khóa quan trọng nhất cho sự cai trị chính đáng và ổn định.\n\nTheo gương [ROOT.Char.GetHouse.GetHeadOfHouse.GetTitledFirstName], ta đã ra lệnh sắp xếp lại chính quyền [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] theo khuôn mẫu của Nhà [ROOT.Char.GetHouse.GetBaseName]."
  fp3_misc_decisions.0051.a: "Gia đình là trên hết!"
 
  fp3_struggle.8000.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char)]"
  fp3_struggle.8000.desc: "Kết thúc của chúa công ngươi, [defender.GetTitledFirstNamePossessive], sự phản bội chống lại Caliph chính đáng của [defender.GetHerHis] đã đến.\n\nLà một người trung thành, ta sẽ đảm bảo ngươi lên ngôi [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] thay cho [defender.GetHerHis]."
  fp3_struggle.8000.a: "Thật sao?"
  fp3_struggle.8001.desc: "Kết thúc sự phản bội chống lại Caliph chính đáng đã đến.\n\nĐã đến lúc [loyalist_puppet.GetTitledFirstName], một người trung thành, cai trị [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] thay ngươi."
  fp3_struggle.8001.a: "Qua xác ta đi!"
  fp3_struggle.8002.desc: "Cuối cùng, kẻ phản bội [defender.GetTitledFirstName] đã bị đánh bại, và [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] lại nằm trong tay một người trung thành với Caliph.\n\nNguyện triều đại ngươi lâu dài và được ban phước!"
  fp3_struggle.8002.a: "Hoan hô!"
  fp3_struggle.8002.alliance_tt: "[attacker.GetTitledFirstName] giờ là [ally|E] của ngươi"
  install_loyalist_puppet_declared_puppet: "Chiến tranh để đưa người trung thành lên ngôi"
  install_loyalist_puppet_declared_defender: "$install_loyalist_puppet_declared_puppet$"
  install_loyalist_puppet_won_puppet: "$install_loyalist_puppet_declared_puppet$"

  fp3_misc_decisions.0031.desc.intro: "Như ta nghĩ, dù một số quý tộc có thể bị sốc về ý tưởng này, vẫn có tài năng trong các văn phòng nhỏ và bộ máy phụ thuộc [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nCác ứng viên có thể được rút gọn chỉ còn hai nhóm: một bên là [batch_a_char1.GetFirstName], [batch_a_char2.GetFirstName], và [batch_a_char3.GetFirstName], bên còn lại là [batch_b_char1.GetFirstName] và [batch_b_char2.GetFirstName]."
 # I don't know why it demands we scope out of the county then back into it — roll with it.
