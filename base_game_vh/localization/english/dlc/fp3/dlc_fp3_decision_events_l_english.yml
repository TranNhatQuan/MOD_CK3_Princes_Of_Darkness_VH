l_english:
 ##################################################
 # STRUGGLE EVENTS 
 ##################################################
  fp3_struggle.0051.t: "Khúc Dạo Trung Gian Iran"
  fp3_struggle.0051.desc: "Cuộc nội chiến đẫm máu bao trùm [Mostaza.GetPrimaryTitle.GetBaseName], vốn từng được xem là bất khả xâm phạm: gia tộc cầm quyền giết chóc và gây chiến lẫn nhau, tranh giành để soán ngôi [GetFaithByKey('ashari').ReligiousHeadTitleName|U]. Iraq chao đảo, trong khi phía bên kia những dãy núi phía đông, các lãnh chúa biên cương Ba Tư lợi dụng tình hình để khẳng định sự độc lập của mình, xây dựng những đế chế riêng từ đống đổ nát của Baghdad.\n\n"
  fp3_struggle.0051.desc.caliph: "Sau lưng ta là hàng dài những bóng ma nhợt nhạt; các [Mostaza.GetTitleTierName] [Mutawakkil.GetFirstName], [Muntasir.GetFirstName], và [Mustain.GetFirstName] — tất cả đều là nạn nhân của cuộc [struggle|E] này. Những kẻ Ba Tư nổi loạn và lũ người Thổ phản trắc nóng lòng muốn thấy ta gia nhập hàng ngũ bóng ma của các tiền nhiệm, nhưng ta vẫn có thể xoay chuyển cục diện!"
  fp3_struggle.0051.desc.involved: "Đây là thời điểm để gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] hành động và vươn tới vinh quang — liệu chúng ta sẽ trở thành những người cứu rỗi Caliphate, hay phá tan giấc mơ về một Ummah thống nhất mãi mãi?"
  fp3_struggle.0051.desc.interloper: "Khi ba [Mostaza.GetTitleAsNameNoTooltip] cuối cùng đều bị đưa đến cái chết đột ngột và bi thảm, mọi người đều cho rằng [Mostaza.GetFirstName] cũng sẽ sớm theo gót. Trong cơn hỗn loạn và bất định này, cơ hội mở ra khắp nơi cho gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]..."
  fp3_struggle.0051.desc.supporter: "Chưa bao giờ lòng trung thành và sự tận tụy giữ vững trật tự của gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] lại cần thiết đến vậy. Đây là lúc chúng ta theo đuổi vinh quang, cứu lấy Caliphate, và trở thành những nhà vô địch thực sự cho chính nghĩa [ROOT.Char.GetFaith.GetAdjective]!"
  fp3_struggle.0051.desc.detractor: "Khi những người cai quản thế giới Hồi giáo bị mắc kẹt trong khủng hoảng triền miên, đây là cơ hội có một không hai để gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] làm chủ vận mệnh của mình và khắc tên vào biên niên sử lịch sử."
  fp3_struggle.0051.desc.unrest: "$fp3_struggle.0051.desc$"
  fp3_struggle.0051.desc.stabilization: "Sau một thời kỳ khủng hoảng, [Mostaza.GetPrimaryTitle.GetName] đang hồi phục, cuộc đấu tranh đẫm máu ở Ba Tư dần lắng xuống."
  fp3_struggle.0051.desc.stabilization_actor: "Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] phải bước đi cẩn trọng ở đây. Chúng ta có thể tận dụng tình hình để đặt nền móng cho một tương lai thịnh vượng — hoặc gieo rắc hỗn loạn và bất hòa mới có thể giúp chúng ta leo lên những đỉnh cao còn lớn hơn..."
  fp3_struggle.0051.a:0 "Cầu mong [ROOT.Char.GetFaith.HighGodName] ở bên ta!"
  fp3_struggle.0051.b:0 "Những tham vọng ngu xuẩn này phải bị dập tắt!"

  fp3_struggle.0071.t: "[struggle_liege.GetFirstNameNoTooltip|U] Tái Khẳng Định Quyền Thống Trị"
  fp3_struggle.0071.desc.caliph: "Cuộc đấu tranh đã kết thúc! Dù là nhờ chiến thắng trong chiến tranh, ngoại giao khéo léo hay quyền uy vốn có của địa vị ta, những kẻ phản bội và nổi loạn đã đổi giọng. Giờ đây chúng vội vã thề những lời trung thành mới trước ngai vàng của ta, tranh nhau cúi đầu sâu nhất và tái khẳng định niềm tin vào [ROOT.Char.GetTitleTierName] chính danh của mình.\n\nNhững lãnh chúa Ba Tư nổi loạn đã thề phục tùng và hối lỗi vì sự ngu dại của mình, hoặc bị thay thế bởi các tổng đốc [ROOT.Char.GetCulture.GetName] đáng tin cậy và ngoan đạo. Ta đã hoàn thành cuộc chinh phục Ba Tư mà Rashidun Caliphate khởi đầu hai thế kỷ trước, vì vinh quang bất diệt của [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
  fp3_struggle.0071.desc.supporter: "Bằng những lời hứa và đe dọa, bằng mưu trí và sức mạnh, quyền lực của [struggle_liege.GetTitledFirstName] đã được tái khẳng định. Những kẻ nổi loạn trước kia đã bị khuất phục, và các lãnh chúa Ba Tư hỗn loạn đang tranh nhau phủ phục trước ngai vàng của [struggle_liege.GetTitleTierName].\n\nNhưng phía sau ngai vàng ấy, #italic ta#! đứng. Trong thời loạn này, ta đã bước lên đối mặt thử thách, chứng minh mình là người ủng hộ vĩ đại nhất của [Mostaza.GetTitleTierName], và đưa trật tự trở lại thế giới. Chắc chắn mọi người sẽ sớm công nhận đóng góp của ta, mang lại vinh quang bất diệt cho gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]..."
  fp3_struggle.0071.a: "Ta chiến thắng!"
  fp3_struggle.0071.b: "Chiến thắng thật ngọt ngào, nhưng chúng ta có thể trở thành điều gì đó vĩ đại hơn!"

  fp3_struggle.0072.t: "$fp3_struggle.0071.t$"
  fp3_struggle.0072.desc.caliph: "Bằng những lời hứa và đe dọa, bằng mưu trí và sức mạnh, quyền lực của ta đối với #italic dar-al-Islam#! đã được tái khẳng định. Dù nhiều người sẽ cho rằng điều này là nhờ ân sủng của [ROOT.GetCharacter.GetFaith.HighGodNameAlternate], nhưng chính nhờ kỹ năng và sự điều binh khiển tướng khéo léo của ta mà [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] đã được cứu khỏi một cuộc nội chiến còn đẫm máu hơn.\n\nĐiều này sẽ mở ra một ngày mới vĩ đại cho Ba Tư, cho thế giới! Và cho #italic ta!#!"
  fp3_struggle.0072.desc.supporter: "Bằng những lời hứa và đe dọa, bằng mưu trí và sức mạnh, quyền lực của [struggle_liege.GetTitledFirstName] đã được tái khẳng định. Dù nhiều người giờ sẽ cho rằng điều này là nhờ ân sủng của [ROOT.GetCharacter.GetFaith.HighGodNameAlternate], nhưng chỉ với sự hỗ trợ của những đồng minh như ta mà [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] đã được cứu khỏi một cuộc nội chiến còn đẫm máu hơn.\n\nTa không nghi ngờ rằng mình sẽ được tưởng thưởng cho nỗ lực và lòng trung thành, dù đôi khi ta không khỏi tự hỏi liệu đứng về phía bên kia có thể mang lại nhiều lợi ích hơn..."
  fp3_struggle.0072.desc.detractor: "Bằng những lời hứa rỗng tuếch và các lời đe dọa bỉ ổi, [struggle_liege.GetTitleTierName] đã tái khẳng định cái gọi là quyền lực của [struggle_liege.GetHerHis], và lấy lại lòng trung thành của những kẻ ngu ngốc và xu nịnh từng tụ tập tại triều đình của [struggle_liege.GetHerHis].\n\nDù ta đã cố gắng hết sức, Caliphate mục nát [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] vẫn tồn tại. Đây là một ngày u ám cho Ba Tư, nhưng có lẽ vẫn chưa phải kết thúc. Một ngày mới sẽ đến, mang theo những cơ hội mới..."
  fp3_struggle.0072.desc.uninvolved: "Cuộc đấu tranh vì Ba Tư lắng xuống, khi [struggle_liege.GetTitledFirstName] không chỉ khôi phục quyền lực và đế chế của [struggle_liege.GetHerHis], mà còn giành được sức mạnh lớn hơn bao giờ hết.\n\nBằng cách dựng lên những bù nhìn [struggle_liege.GetCulture.GetName] để cai trị Ba Tư và khuất phục mọi kẻ chống đối [struggle_liege.GetHerHim], [struggle_liege.GetSheHe] đã tái khẳng định quyền tối cao của [struggle_liege.GetFaith.GetAdjective] tại [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip].\n\nThật khó thấy ai có thể thách thức [struggle_liege.GetHerHim] lúc này, nhưng có lẽ vẫn chưa phải là hết hy vọng..."
  fp3_struggle.0072.desc.involved: "Sự hỗn loạn bao trùm Ba Tư đang dần suy giảm, giờ đây [struggle_liege.GetTitledFirstName] không những đã khôi phục được quyền uy và đế chế của [struggle_liege.GetHerHis], mà còn khẳng định được uy thế và quyền lực lớn hơn bao giờ hết.\n\nBằng việc đưa những con rối [struggle_liege.GetCulture.GetName] lên cai trị Ba Tư và khuất phục tất cả những kẻ dám thách thức [struggle_liege.GetHerHim], [struggle_liege.GetSheHe] đã tái khẳng định vị thế tối cao của đức tin [struggle_liege.GetFaith.GetAdjective] tại [struggle_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip].\n\nNgười đời hiện nay cho rằng quyền uy của [struggle_liege.GetHerHis] là không thể thách thức, nhưng có lẽ ta nên đưa điều đó ra kiểm chứng..."
  fp3_struggle.0072.desc.interloper: "Cuộc đấu tranh vì Ba Tư đang lắng xuống, giờ đây [struggle_liege.GetTitledFirstName] không những đã khôi phục được quyền uy và đế chế của [struggle_liege.GetHerHis], mà còn đạt được quyền lực lớn hơn bao giờ hết.\n\nBằng việc đưa những con rối [struggle_liege.GetCulture.GetName] lên cai trị Ba Tư và khuất phục tất cả những kẻ dám thách thức [struggle_liege.GetHerHim], [struggle_liege.GetSheHe] đã tái khẳng định vị thế tối cao của đức tin [struggle_liege.GetFaith.GetAdjective] tại [struggle_liege.GetPrimaryTitle.GetBaseNameNoTooltip].\n\nVì quyền uy của [struggle_liege.GetHerHis] giờ đây sẽ rất khó để thách thức, có lẽ chính ta cũng nên lấy lòng [struggle_liege.GetHerHim], để có được chỗ đứng vững chắc hơn trên vùng đất Ba Tư..."
  fp3_struggle.0072.a: "[ROOT.GetCharacter.GetFaith.HighGodNameAlternate] ở bên ta!"
  fp3_struggle.0072.b: "Một ngày mới sẽ đến!"

  fp3_struggle.0082.t: "[GetTitleByKey('d_sunni').GetNameNoTooltip] Nhượng Bộ"
  fp3_struggle.0082.desc.intro: "Sau nhiều năm đấu tranh vô vọng trước những khó khăn không thể vượt qua, [struggle_liege.GetTitledFirstName] đã nhượng bộ và từ bỏ mọi hy vọng tái thống nhất khu vực. Biên cương phía đông giờ thuộc về những nhà cai trị mới, những người sẽ tiếp tục chiến đấu với dân du mục thảo nguyên và với nhau, như vẫn luôn xảy ra từ trước đến nay.\n\n"
  fp3_struggle.0082.desc.supporter: "Bị kẻ thù bao vây tứ phía, sự phản bội và vận rủi đã xé nát Caliphate của gia tộc [struggle_liege.GetHouse.GetNameNoTooltip]. Nếu ta có thể xoay chuyển cục diện thì chỉ [ROOT.GetCharacter.GetFaith.HighGodName] mới biết, nhưng ta đã nhận một ván bài tồi và chỉ có thể tự hỏi tương lai sẽ ra sao. Dù đây là một đòn giáng khủng khiếp, nó #italic không#! phải là kết thúc!\n\nHãy để những kẻ ngu dại đã chống lại ta nghỉ ngơi một chút, bởi khi chúng ít ngờ nhất, quân đội ta sẽ lại tiến quân và giẫm nát cờ hiệu phản bội của chúng xuống bụi đất."
  fp3_struggle.0082.desc.involved: "Dù đây có thể không phải kết cục mà ta mong muốn, nó vẫn có thể được sử dụng vì lợi ích của ta, nếu vương quốc của ta có thể vươn lên vinh quang trong khoảng trống mà gia tộc [struggle_liege.GetHouse.GetNameNoTooltip] để lại."
  fp3_struggle.0082.desc.interloper: "Với tư cách là một kẻ ngoài cuộc bước lên sân khấu Ba Tư, có lẽ đây là cơ hội để ta giành một vai trò lớn hơn và lấp đầy khoảng trống mà gia tộc [struggle_liege.GetHouse.GetNameNoTooltip] để lại. Hoặc ta có thể mặc kệ mớ hỗn loạn này và tìm nơi khác cho tương lai của gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]..."
  fp3_struggle.0082.desc.detractor: "Sau nhiều năm đấu tranh vô ích và đau khổ, cuối cùng [struggle_liege.GetTitledFirstName] đã buộc phải nhượng bộ. Bất kỳ quyền lực nào mà gia tộc [struggle_liege.GetHouse.GetNameNoTooltip] từng nắm giữ ở Ba Tư giờ đã biến mất từ lâu, khiến mọi kẻ nổi loạn và đối thủ càng thêm táo bạo.\n\nGia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] có thể vươn lên từ hỗn loạn này, mạnh mẽ hơn bao giờ hết, kiêu hãnh và #italic tự do#!."
  fp3_struggle.0082.desc.uninvolved: "Sau nhiều năm hao mòn và hỗn loạn, [struggle_liege.GetTitledFirstName] đã âm thầm nhượng bộ và từ bỏ mọi hy vọng tái thống nhất Arabia và Ba Tư.\n\nPhương Đông giờ thuộc về những nhà cai trị mới, những người sẽ tiếp tục chiến đấu với dân du mục thảo nguyên và với nhau, trong khi Caliph chỉ có thể bất lực quan sát từ xa.\n\nRõ ràng sự sụp đổ của gia tộc [struggle_liege.GetHouse.GetNameNoTooltip] có thể mang lại nhiều cơ hội cho bất kỳ gia tộc nào đủ táo bạo để nắm lấy..."
  fp3_struggle.0082.a: "Chúng sẽ hối hận vì ngày phản bội chúng ta..."
  fp3_struggle.0082.b: "Bình minh sẽ trở lại!"
  fp3_struggle.0082.c: "Vì vinh quang bất diệt của Ba Tư!"

  fp3_struggle.0091.t: "[struggle_ender.GetPrimaryTitle.GetNameNoTooltip|U] Thành lập: Một Ba Tư Mới"
  fp3_struggle.0091.desc.detractor: "Khi mặt trời mọc sau núi Damavand, ánh sáng dịu nhẹ của nó sưởi ấm những cánh đồng nhạt màu. Vương miện của [GetTitleByKey('e_persia').GetBaseName|U] sẽ không còn chỉ là một dòng dõi lịch sử thuần túy, mà là biểu tượng cho cuộc đấu tranh anh hùng của chúng ta chống lại [struggle_liege.GetTitledFirstName].\n\nKhông kẻ xâm lược ngoại bang nào có thể kìm hãm chúng ta một lần nữa; chúng ta đã đòi lại quyền lực và vinh quang của những ngày cổ đại, khi cả thế giới phải run rẩy trước Vua của các vị Vua.\n\nChẳng bao lâu nữa, toàn bộ Ba Tư sẽ tung bay lá cờ của một đế chế mới. #italic Đế chế của ta#!!"
  fp3_struggle.0091.desc.supporter: "Dù lý tưởng của [struggle_liege.GetName] là chính đáng, nó có lẽ đã thất bại từ đầu. Nhân dân Ba Tư muốn một lãnh đạo mới, thắp lại ngọn lửa cổ xưa và vinh quang đã mất. Và Ta đã đáp lại tiếng gọi của họ. Từ nền tảng Ta đã xây dựng, một đế chế mới có thể trỗi dậy, lần đầu tiên ở Ba Tư kể từ khi [sassanid_dynasty.GetName] sụp đổ. Hoặc Ta có thể hài lòng với những gì đã đạt được, củng cố đất nước và khơi dậy ngọn lửa trong trái tim mỗi người Ba Tư..."
  fp3_struggle.0091.a: "Điều này sẽ đảm bảo di sản của dòng họ [ROOT.Char.GetHouse.GetNameNoTooltip]."

  fp3_struggle.0092.t: "$fp3_struggle.0091.t$"
  fp3_struggle.0092.intro: "Khi mặt trời mọc phía sau núi Damavand, ánh sáng dịu dàng sưởi ấm những cánh đồng nhợt nhạt. [struggle_ender.GetName] đã đủ mạnh và hợp pháp để tuyên bố tái lập [persia_loc.GetName|U], và một cường quốc mới nay cai trị vùng đất này, là bức tường chắn chống lại các lãnh chúa báo thù ở Ả Rập và những kẻ du mục man rợ ở các thảo nguyên, giành lại vinh quang của các vị vua xưa."
  fp3_struggle.0092.desc.iranian: "Vai trò của Ta trong đế chế của [struggle_ender.GetTitledFirstNamePossessivesNoTooltip] vẫn chưa rõ ràng — với sự trợ giúp của Ta, [struggle_ender.GetSheHe] có thể xây dựng một di sản trường tồn, hoặc có thể [struggle_ender.GetSheHe] chỉ là một kẻ chinh phục khác trong biên niên sử, vĩ đại nhưng chóng tàn."
  fp3_struggle.0092.desc.non-iranian: "Những gì từng chỉ là một biên cương của đế chế sụp đổ giờ trở thành hạt nhân của một đế chế đang trỗi dậy. Thế giới quan sát với sự quan tâm, tự hỏi liệu [struggle_ender.GetTitledFirstNameNoTooltip] có thể xây dựng một di sản trường tồn, hay chỉ là một kẻ chinh phục khác, vĩ đại nhưng chóng tàn."
  fp3_struggle.0092.a: "Điều này là tất yếu"

  fp3_struggle.0095.t: "Sự Trỗi Dậy của [struggle_ender.GetFaith.GetAdherentNameNoTooltip]"
  fp3_struggle.0095.desc.shia_and_zandaqa: "Những người Sunni lạc lối đã quá lâu cho rằng đế chế suy tàn của họ là quyền tối cao trên thế giới này, chỉ trừ Đức Chúa; họ thật sai lầm.\n\nVới sự sụp đổ của [struggle_liege.GetTitledFirstName], Ta tự nhận trách nhiệm dẫn dắt #EMP ummah#!, trả thù trận Karbala cho những người theo [ali.GetFirstName]. Ta sẽ mở ra một kỷ nguyên mới của sự thống trị [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], và chiếm ngôi báu vĩ đại nhất thế giới này.\n\nNhững người Sunni, vốn tự tin vào sự ưu việt kiêu căng của họ, sẽ không còn lựa chọn nào ngoài việc tuân theo."
  fp3_struggle.0095.desc.muhakkima: "Những người Sunni ngu dốt lâu nay cho rằng đế chế tham nhũng của họ là quyền tối cao trên thế giới, nhưng trong sự ngu dốt, họ quên rằng phán xét thuộc về Đức Chúa! Ta đã làm những gì nhiều [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] trước Ta đã cố gắng, và kết thúc đế chế Sunni. Dù chưa đủ để trả thù cho trận Nahrawan và hàng thế kỷ bị đàn áp, đây chỉ là khởi đầu. Ta đã trở thành caliph của [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], và sẽ dẫn dắt họ đến đại quyết chiến với Shia, điều chắc chắn sẽ xảy ra."
  fp3_struggle.0095.desc.fallback: "Đế chế Caliphate vốn dẫn dắt ummah trên Trái đất theo con đường thiêng liêng, nhưng trong sự ngu dốt, chúng ta đã để nó trở nên yếu kém và tham nhũng. Điều này thay đổi hôm nay khi Ta mở ra kỷ nguyên mới cho cả Ba Tư và Hồi giáo dưới sự lãnh đạo khôn ngoan và không tham nhũng của Ta.\n\nDù còn nhiều việc phải làm, không thể phủ nhận rằng những gì Ta đã làm sẽ thay đổi lịch sử Ba Tư mãi mãi. Giờ đây chúng ta hướng về tương lai; về đức tin [ROOT.Char.GetFaith.GetAdjective] và [GetTitleByKey('e_persia').GetName]!"
  fp3_struggle.0095.a: "Xin [ROOT.Char.GetFaith.HighGodNameAlternate] dẫn dắt triều đại của Ta!"

  fp3_struggle.0096.t: "$fp3_struggle.0095.t$"
  fp3_struggle.0096.desc.supporter: "Than ôi, vương quốc của [struggle_liege.GetName] đã sụp đổ, và từ tro tàn, [struggle_ender.GetName] trỗi dậy, chiếm caliphate cho [struggle_ender.GetFaith.GetAdherentName]. Sự ủng hộ của Ta dành cho [struggle_liege.GetTitledFirstNameNoTooltip] vì thế là vô ích, tất cả vàng bạc và nỗ lực đều uổng phí. Nhưng có lẽ chưa quá muộn để cứu vãn lý tưởng Sunni — hoặc đổi phe, và hoàn toàn liên kết với [struggle_ender.GetFaith.GetAdherentNamePluralNoTooltip]..."
  fp3_struggle.0096.desc.involved: "Sự hỗn loạn và vô chính phủ dường như đã kết thúc, khi [struggle_ender.GetName] vượt qua tất cả những thách thức và chiếm Caliphate nhân danh [struggle_ender.Char.GetFaith]. Chắc chắn [struggle_ender.GetSheHe] nay có cả người ủng hộ lẫn phản đối, với một số gọi đây là kết thúc của #italic ummah#!, và những người khác ăn mừng chiến thắng của đức tin, Ta phải suy nghĩ kỹ Ta sẽ đứng về bên nào. [struggle_ender.GetTitledFirstNameNoTooltip] sẵn sàng mở ra kỷ nguyên mới cho Hồi giáo và mang lại hòa bình cho Mesopotamia và Ba Tư — nhưng có thể thành hay bại nhờ sự ủng hộ của Ta..."
  fp3_struggle.0096.desc.interloper: "$fp3_struggle.0096.desc.involved$"
  fp3_struggle.0096.desc.detractor: "Cuối cùng, vương quốc tham nhũng của [struggle_liege.GetTitledFirstName] đã sụp đổ. Từ tro tàn, [struggle_ender.GetTitledFirstName] trỗi dậy, báo hiệu một caliphate [struggle_ender.GetFaith.GetAdherentName] và một kỷ nguyên mới.\n\nCuộc đấu tranh lâu dài của Ta chống lại [struggle_liege.GetTitledFirstNameNoTooltip] đã có kết quả, dù có thể không phải kết thúc Ta mong muốn. Nhưng vẫn còn hy vọng cho lý tưởng Sunni, và Ta có thể trở thành ngọn hải đăng của nó. Hoặc Ta có thể hoàn toàn liên kết với [struggle_ender.GetFaith.GetAdherentNamePluralNoTooltip]..."
  fp3_struggle.0096.desc.uninvolved: "Cuộc đấu tranh lâu dài ở Ba Tư đã kết thúc, với [struggle_ender.GetName] vượt qua tất cả những thách thức và chiếm Caliphate nhân danh [struggle_ender.Char.GetFaith]. Dù [struggle_ender.GetSheHe] làm đúng hay sai, không ai có thể nói, nhưng rõ ràng [struggle_ender.GetSheHe] sẵn sàng mở ra kỷ nguyên mới cho Hồi giáo và mang lại hòa bình cho Mesopotamia và Ba Tư. Dù không phải tất cả trong #italic ummah#! đều vui mừng với diễn biến này, và các lãnh chúa biên cương có thể buồn bực ở những pháo đài xa xôi, nhưng hiện tại họ phải nghiến răng chịu đựng."
  fp3_struggle.0096.a: "[ROOT.Char.GetFaith.HighGodNameAlternate] vĩ đại và nhân từ!"
  fp3_struggle.0096.b: "Đây là một ngày đen tối..."

  fp3_struggle.0100.t: "Thành lập: Caliphate Bị Thống Trị"
  fp3_struggle.0100.desc: "Từ lâu, người Hồi giáo đã chấp nhận rằng Đế quốc Caliphate là quyền lực tối cao của thế giới này, ngoại trừ Thiên Chúa, nhưng khi vương quốc rơi vào sự chán chường và suy đồi, đã đến lúc cần phải suy nghĩ lại về tình trạng này.\n\nGiờ đây, một [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip|U] mới đã trỗi dậy, với ta là người đứng đầu, để dẫn dắt Caliph dưới sự bảo hộ và cảnh giác của ta. [struggle_liege.GetName] có thể là thủ lĩnh của các tín đồ, nhưng kể từ nay #italic ta#! sẽ là chúa tể của [struggle_liege.GetHerHis], là [Select_CString( ROOT.Char.IsFemale, 'stewardess', 'steward' )] mới của Hồi giáo, và [struggle_liege.GetSheHe] sẽ làm #EMP tốt#! nếu ghi nhớ điều đó!"
  fp3_struggle.0100.desc.shia_and_zandaqa: "Người Hồi giáo lâu nay chấp nhận rằng Caliphate là quyền tối cao trên thế giới này, chỉ trừ Đức Chúa, nhưng khi vương quốc rơi vào tuyệt vọng và suy đồi, rõ ràng những người theo Ali có quyền hợp pháp hơn trên các tín đồ.\n\nTa đã tự nhận trách nhiệm bảo hộ và giám sát Caliphate [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]. Ta sẽ mở ra kỷ nguyên mới của sự thống trị [ROOT.Char.GetFaith.GetAdherentName] trong #EMP ummah#!, và những kẻ phản đối nên tuân theo!"
  fp3_struggle.0100.desc.muhakkima: "Người Sunni lâu nay chấp nhận rằng Caliphate là quyền tối cao trên thế giới này, chỉ trừ Đức Chúa, nhưng khi vương quốc run sợ trước sức mạnh của Muhakkima, họ nhận ra sai lầm.\n\nVới Ta đứng đầu, [ROOT.Char.GetFaith.GetAdherentNamePlural] đã kiểm soát Caliph tội nghiệp [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], và toàn bộ #EMP ummah#! sớm sẽ phải chấp nhận lời thiêng liêng của chúng Ta — phán xét thuộc về Đức Chúa!"
  fp3_struggle.0100.a: "Một ngày mới cho Hồi giáo!"

  fp3_struggle.0101.t: "$fp3_struggle.0100.t$"
  fp3_struggle.0101.desc.detractor: "Rằng Caliphate [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] chỉ là hổ giấy không nên làm ai ngạc nhiên, và thực sự, quân đội của nó đã tan rã, các trung thành viên phá vỡ lời thề hoặc ẩn náu ở biên cương bị lãng quên. [struggle_ender.GetName] nay tuyên bố là #italic người bảo vệ#! của Caliph, nhưng chỉ kẻ ngốc mới không nhận ra — Caliphate Sunni đã bị thống trị và bị hạ thấp, với [struggle_ender.GetHerHim] là chủ mới.\n\nLà kẻ đối lập lâu năm với [struggle_liege.GetTitledFirstNameNoTooltip], Ta phải đảm bảo vị trí quan trọng trong trật tự mới này cho Ta và dòng họ [ROOT.Char.GetHouse.GetNameNoTooltip]..."
  fp3_struggle.0101.desc.supporter: "Dù Ta ủng hộ kiên định, Caliphate [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] tỏ ra quá phân rã, hoặc kẻ thù quá đông và bền bỉ. [struggle_ender.GetName] nay tuyên bố là #italic người bảo vệ#! của Caliph, nhưng điều này có nghĩa là [struggle_ender.GetSheHe] đã hạ gục chính quyền công chính của #italic dar-al-Islam#!.\n\nTa phải thận trọng để bảo vệ tương lai của dòng họ [ROOT.Char.GetHouse.GetNameNoTooltip]..."
  fp3_struggle.0101.desc.interloper: "Những hành động quyết đoán của [struggle_ender.GetName] dường như đã chấm dứt, dù mong manh, tình trạng hỗn loạn ở Ba Tư. Sau khi thống trị [struggle_liege.GetTitledFirstName], [struggle_ender.GetTitledFirstNameNoTooltip] nay tuyên bố bảo hộ Caliphate Sunni và công nhận là vị lãnh tụ vĩ đại nhất vùng đất.\n\nCâu hỏi bây giờ — dòng họ [ROOT.Char.GetHouse.GetNameNoTooltip] có chấp nhận hay phản đối trạng thái này?"
  fp3_struggle.0101.desc.involved: "$fp3_struggle.0101.desc.interloper$"
  fp3_struggle.0101.desc.uninvolved: "Cuộc đấu tranh ở Ba Tư và Mesopotamia đã kết thúc, với [struggle_ender.GetName] thống trị [struggle_liege.GetName] và kiểm soát phần lớn #italic dar-al-Islam#!. Quyền lực và vinh quang của Caliphate Sunni bị giảm sút mãi mãi, trong khi [struggle_ender.GetPrimaryTitle.GetName] trở thành ánh sáng tỏa sáng. Chỉ thời gian mới biết liệu nó tồn tại lâu dài hay chỉ là một ngôi sao băng..."
  fp3_struggle.0101.a: "Mong điều này báo hiệu một ngày mới!"
  fp3_struggle.0101.b: "Đây là một ngày đen tối cho Hồi giáo."

  fp3_struggle.0191.t: "Sự Kết Thúc của [GetTitleByKey('d_sunni').GetName]"
  fp3_struggle.0191.desc: "Đấu tranh vô vọng chống lại các tướng tham vọng, thần dân bất mãn và nô lệ cũ, [GetTitleByKey('d_sunni').GetNameNoTooltip] gặt hái những gì họ gieo. Kiêu ngạo và hư vinh đã quá lớn, chi tiêu hoang phí và thất thường, triều đình phản bội chưa từng thấy.\n\nĐế chế đã sụp đổ, và #italic Ta#! là kiến trúc sư của sự sụp đổ đó. Ta đứng đây trong vinh quang, trong khi triều đại [struggle_liege.GetFirstNamePossessive], tối đa, sẽ trở thành câu chuyện cảnh tỉnh trong sách lịch sử, một khoảng dừng ngắn trong biên niên sử Ba Tư."
  fp3_struggle.0191.a: "Đây là khoảnh khắc vĩ đại nhất của Ta!"
  fp3_struggle.0191.b: "Ta đã làm những gì phải làm."

  fp3_struggle.0192.t: "$fp3_struggle.0191.t$"
  fp3_struggle.0192.desc.caliph: "Mọi người đều phản bội Ta. Cố vấn, thần dân, Bạn Bè. Dù Ta có cố gắng cứu vương quốc [ROOT.Char.GetHouse.GetNameNoTooltip], tất cả vô vọng, và dù Ta tự hỏi liệu có gì khác Ta có thể làm, chỉ có [ROOT.GetCharacter.GetFaith.HighGodName] biết sự thật. Vương quốc nằm trong hoang tàn, giữa những tòa tháp đổ nát và tàn tích vinh quang xưa. Ta không còn cách nào ngoài việc ẩn mình trong [ROOT.Char.Custom('ResidenceBuilding')] khi tất cả sụp đổ xung quanh, và hài lòng rằng ít nhất Ta vẫn còn sống."
  fp3_struggle.0192.desc.supporter_or_vassal: "Bị kẹt trong cuộc đấu tranh vô vọng chống lại các tướng tham vọng, thần dân bất mãn và nô lệ cũ, [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] không thể tồn tại. Chi phí vàng, máu và công sức khổng lồ, và dù thế giới không công nhận vai trò của Ta, [ROOT.GetCharacter.GetFaith.HighGodName] sẽ thấy. Dù tốt hay xấu, chúng ta giờ đối mặt vương quốc tan vỡ, mở cửa cho những kẻ tấn công các vị vua với hậu quả chết người. Nhưng sự diệt vong của dòng họ [struggle_liege.GetHouse.GetNameNoTooltip] có thể không thuộc về Ta, và từ tro tàn này, hoa mới có thể nở."
  fp3_struggle.0192.desc.detractor: "Đấu tranh vô vọng chống lại các tướng tham vọng, thần dân bất mãn và nô lệ cũ, [struggle_liege.GetPrimaryTitle.GetNameNoTooltip] gặt hái những gì họ gieo. Kiêu ngạo và hư vinh đã quá lớn, chi tiêu hoang phí và thất thường, triều đình phản bội chưa từng thấy. Dòng họ [struggle_liege.GetHouse.GetNameNoTooltip] đã sụp đổ, và sự sụp đổ quá lớn đến mức không ai có thể thấy họ đứng dậy lần nữa. Tên tuổi của họ, tối đa, sẽ trở thành câu chuyện cảnh tỉnh trong sách lịch sử, một khoảng dừng ngắn trong biên niên sử Ba Tư."
  fp3_struggle.0192.a: "Dù tốn gì, Ta phải bảo vệ tương lai của triều đại."
  fp3_struggle.0192.b: "Đây chỉ là một bước lùi tạm thời."
  fp3_struggle.0192.c: "Điều này mở ra cơ hội mới — cho Ta."
  fp3_struggle.0123.d: "Thật là một tai họa..."


  sway_outcome.1004.t: "Lời Cam Kết Trung Thành"
  sway_outcome_magnanimity.1004.desc: ""[ROOT.Char.GetTitleTierName] của ta", [target.GetName] nói, "giờ ta nhận ra mình đã sai khi nghi ngờ ngươi. Tấm lòng rộng lượng của ngươi là điều đáng khen trong những thời khắc khó khăn này, khi chúng ta nên đoàn kết vì lợi ích của vương quốc." [target.GetSheHe|U] cúi đầu trước ta, và có vẻ thực lòng thật sự. Có lẽ ta thực sự đã thuyết phục được [target.GetHerHim] về phe mình."
  sway_outcome_blessed.1004.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]", [target.GetName] tuyên bố, cúi đầu sâu. "Có lẽ ngươi thực sự được [ROOT.GetCharacter.GetFaith.HighGodName] ban phước, như người ta nói, hoặc có lẽ lời ngươi chỉ trúng đích một cách tình cờ, nhưng điều quan trọng là ta cảm động trước những tương tác gần đây của chúng ta. Chúng ta cần giữ vương quốc đoàn kết trong thời khủng hoảng này, và ta sẽ sát cánh cùng ngươi.""
  sway_outcome_grudgingly.1004.desc: ""[ROOT.Char.GetTitleTierName] của ta", [target.GetName] nói miễn cưỡng, "giờ ta thấy rõ, khi kẻ thù chung vây quanh, rằng chúng ta nên cố gắng tin tưởng nhau. Vì vậy, ta cúi đầu trước ngươi, và một lần nữa tuyên bố trung thành.""
  sway_outcome_flattery.1004.desc: ""Ôi [ROOT.Char.GetTitleTierName] vĩ đại", [target.GetName] nói, cúi đầu. "Người dưới bóng của ngươi mà ta may mắn được đứng gần, chúa công từ bi và huy hoàng, ta hối hận vì từng nghi ngờ ngươi. Ta xin tách mình ra khỏi mọi điều không may, dù thật hay tưởng tượng, mà người ta từng nói về ngươi.""
  sway_outcome_dharmic.1004.desc: ""Ôi [ROOT.Char.GetTitleTierName]", [target.GetName] tuyên bố trang nghiêm. "Mỗi vương quốc đều cần một người lãnh đạo đứng trên tất cả, kẻ xoay bánh xe, người có thể nhìn xa hơn thế giới tạm bợ đầy thịt và sự ngu dốt này. Có thể thật sự ngươi là [ROOT.Char.GetTitleTierName] đó, và vì vậy, ta sẽ quên đi nghi ngờ và tính kiêu căng của mình, và tái cam kết trung thành với ngươi.""
  sway_outcome_caliph.1004.desc: "[target.GetName] nhìn thẳng vào mắt ta trong chốc lát, trước khi cúi đầu sâu. "Ngươi là [ROOT.Char.GetTitleTierName], chúa công của ta, và là lãnh đạo hợp pháp của #italic ummah#!. Ta từng nghi ngờ, không thể phủ nhận, nhưng không thể để lý tưởng của những tín đồ gặp nguy hiểm. Ta chưa quên lời cam kết đã thề với ngươi, và sẽ không thất hứa lần nữa.""
  sway_outcome.1004.a: "Được lắm...nhưng ta sẽ để mắt đến ngươi!"
  sway_outcome.1004.b: "Mọi chuyện đã được tha thứ."


