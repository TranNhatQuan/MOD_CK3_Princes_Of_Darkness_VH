l_english:
 
  fp3_clan.1000.t: "Giá Trị Hơn Vàng?"
  fp3_clan.1000.desc: "Người thu thuế của ta, [target_tax_collector.GetFirstName], đã trở về từ chuyến đi gần đây quanh vương quốc của [target_tax_collector.GetHerHis]. [target_tax_collector.GetSheHe|U] đã xin được yết kiến, tuyên bố rằng đã mang về một thứ gì đó #EMP giá trị hơn#! vàng.\n\n\"Thưa chủ nhân, ta vừa thu xong khoản thuế của vương triều tại [secret_holder.GetCapitalLocation.GetName]. Trong thời gian ở đó, ta đã nghe những lời đồn thổi rằng [secret_holder.GetTitledFirstName] [target_secret.Custom('SecretDescriptionThirdPerson')]...\"\n\n\"...và sau khi điều tra thêm, những lời đồn này quả thực có vẻ là sự thật.\""
  fp3_clan.1000.a: "Một ít tiền thưởng cho nỗ lực của ngươi."
  fp3_clan.1000.b: "Công việc tuyệt vời như vậy xứng đáng nhận phần thưởng!"
  fp3_clan.1000.c: "#EMP Ngon tuyệt#!! Công việc xuất sắc, [target_tax_collector.GetFirstNameNoTooltip]!"

  fp3_clan.1010.t: "Cái cốc [target_tax_collector.GetHerHis|U] đã tràn đầy"
  fp3_clan.1010.desc: "Thủ hầu của ta, [steward.GetTitledFirstName], đã xem sổ sách thu thuế và phát hiện một vài sự không nhất quán trong hồ sơ thu thuế của [target_tax_collector.GetFirstNamePossessive] — sự không nhất quán này lên tới gần [ROOT.Var('embezzled_gold').GetValue] vàng...\n\nLý do duy nhất hợp lý là [target_tax_collector.GetFirstNameNoTooltip] đã biển thủ từ vương miện. Ta đã gọi [target_tax_collector.GetHerHim] đến để trả lời các cáo buộc.\n\n'Đúng vậy, bệ hạ. Mặc dù hơi xấu hổ, Ta cầu xin ngài thấy sự tinh khôn trong hành động của Ta — kỹ năng mà ngài có thể dùng trong các công việc tương lai...'"
  fp3_clan.1010.a: "Ngươi sẽ trả lại những gì nợ #EMP ngay lập tức#!"
  fp3_clan.1010.a.success: "Ngươi thuyết phục [target_tax_collector.GetFirstNameNoTooltip] trả lại tiền"
  fp3_clan.1010.a.failure: "[target_tax_collector.GetFirstNameNoTooltip] không bị thuyết phục"
  fp3_clan.1010.b: "Cơ hội cộng với bản năng bằng lợi nhuận."
  fp3_clan.1010.b.flavor: "Ngài ca ngợi [target_tax_collector.GetFirstNameNoTooltip] vì sự khôn ngoan của [target_tax_collector.GetHerHis]"
  fp3_clan.1010.c: "Một trận roi sẽ nhắc nhở ngươi rằng ngươi đang thu thuế cho ai."

  fp3_clan.1020.t: "Học Thực Tiễn"
  fp3_clan.1020.desc: "Thủ hầu của ta, [steward.GetTitledFirstName], đến gặp ta với [target_tax_collector.GetFirstName], người thu thuế, theo sát phía sau.\n\n'[target_tax_collector.GetFirstNameNoTooltip] gần đây thể hiện khả năng xuất sắc.'"
  fp3_clan.1020.stewardship: "[target_tax_collector.GetSheHe|U] đã thể hiện tiềm năng trong quản lý và tính toán."
  fp3_clan.1020.intrigue: "[target_tax_collector.GetSheHe|U] đã thể hiện sự yêu thích với những nghệ thuật tinh tế hơn trong công việc của [target_tax_collector.GetHerHis].\"\n\n\""
  fp3_clan.1020.diplomacy: "[target_tax_collector.GetSheHe|U] thể hiện kỹ năng sâu sắc trong nghệ thuật ngoại giao."
  fp3_clan.1020.outro: "'Ta nói [target_tax_collector.GetSheHe] xứng đáng được khen thưởng, bệ hạ. Việc rèn luyện kỹ năng này có thể mang lại nhiều vàng hơn cho kho bạc vương quốc.'"
  fp3_clan.1020.a: "'Làm tốt lắm, [target_tax_collector.GetFirstNameNoTooltip]! Ngươi nên tự hào về nghề của mình.'"
  fp3_clan.1020.b: "'Có lẽ ngươi nên dạy những người thu thuế khác vài điều?'"
  fp3_clan.1020.every_tax_collector: "Mỗi [tax_collector|E]"
  fp3_clan.1020.b.improved_tax_collectors: "Người Thu Thuế Được Cải Thiện"
  fp3_clan.1020.b.improved_tax_collectors.desc: "[target_tax_collector.GetFirstNameNoTooltip] đã chia sẻ những kiến thức của [target_tax_collector.GetHerHis] với [ROOT.Var('num_improved_tax_collectors').GetValue] người thu thuế"
  fp3_clan.1020.b.none_improved: "Không Có Người Thu Thuế Nào Được Cải Thiện"
  fp3_clan.1020.b.none_improved.desc: "[target_tax_collector.GetFirstNameNoTooltip] thất bại trong việc truyền đạt bất kỳ bài học nào cho đồng nghiệp thu thuế của [target_tax_collector.GetHerHis]"
  fp3_clan.1020.c: "'Ta không có thời gian để bơm phồng cái Ta của ngươi!'"

  fp3_clan.1030.t: "Tranh Chấp Thuế"
  fp3_clan.1030.desc: "\"Ta từ chối nộp thuế cho một kẻ [target_tax_collector.Custom2('InsultAdjective', SCOPE.sC('target_taxed_vassal'))] [target_tax_collector.GetFaith.GetAdherentNameNoTooltip]!\" [target_taxed_vassal.GetTitledFirstName] hét vào mặt [target_tax_collector.GetFirstName].\n\n\"Đó là bổn phận của ta để thu thuế cho vương triều! Một sự xúc phạm đến nhân cách của ta chính là xúc phạm đến [ROOT.Char.GetNameNoTooltip]!\" [target_tax_collector.GetFirstNameNoTooltip] đáp lại. \"Thưa chủ nhân, xin hãy giải quyết tranh chấp này để ta có thể tiếp tục công việc của mình.\"\n\n[target_taxed_vassal.GetTitledFirstNameNoTooltip] đứng đó bốc hỏa trong khi [target_tax_collector.GetFirstNameNoTooltip] gõ chân thiếu kiên nhẫn. Rõ ràng, ta phải quyết định xem nên xoa dịu chư hầu của mình hay hỗ trợ người thu thuế..."
  fp3_clan.1030.a: "Rõ ràng [target_tax_collector.GetFirstNameNoTooltip] không phù hợp với khu thuế này."
  tax_collector_fired_on_religious_grounds: "Người Thu Thuế Bị Sa Thải Do Lý Do Tôn Giáo"
  fp3_clan.1030.b: "[target_taxed_vassal.GetFirstNameNoTooltip] sẽ nộp những gì [target_taxed_vassal.GetHerHis] phải trả."
  fp3_clan.1030.c: "Hãy tự giải quyết với nhau."

  fp3_clan.1040.t: "Đất Bị Quản Lý Kém"
  fp3_clan.1040.desc: "Người thu thuế của ta, [target_tax_collector.GetFirstName], cung cấp một báo cáo về khảo sát mới nhất của [target_tax_collector.GetHerHis] về vương quốc và nêu ra một vấn đề đáng lo ngại:\n\n\"Thưa chủ nhân, cách mà [target_taxed_vassal.GetTitledFirstName] quản lý vùng đất của [target_taxed_vassal.GetHerHis] là hoàn toàn không thể chấp nhận được! Nhiều việc có thể làm hơn nữa với những vùng đất của [target_taxed_vassal.GetPrimaryTitle.GetNameNoTier] nếu họ có một người quản lý có năng lực.\""
  fp3_clan.1040.a: "Nhắc nhở tất cả chư hầu về trách nhiệm của họ."
  fp3_clan.1040.b: "Ta sẽ dạy [target_taxed_vassal.GetHerHim] vài điều!"
  fp3_clan.1040.b.success: "Ngươi thành công trong việc chỉ dẫn [target_taxed_vassal.GetTitledFirstNameNoTooltip]"
  fp3_clan.1040.b.failure: "[target_taxed_vassal.GetTitledFirstNameNoTooltip] không hiểu bài học của ngươi"
  fp3_clan.1040.c: "Có lẽ cần một nhắc nhở #EMP vật lý#! hơn về quyền uy của ta..."
