  favour_skilled_outsiders_decision_desc: "Có những người trong bộ máy của Ta giữ các vị trí lãnh đạo mà họ ít năng lực — trong khi những người tài năng lại bị bỏ quên dưới lớp bất tài và tầm thường, chỉ vì họ có vẻ ngoài lạ với giới quý tộc [ROOT.Char.GetCulture.GetName] như Ta.\n\nTại sao nhiều thần dân xuất sắc của Ta không được thăng tiến trong phục vụ của Ta?"
