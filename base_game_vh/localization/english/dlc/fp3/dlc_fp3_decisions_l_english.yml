  destroy_the_magi_decision_alternate: "Dập tắt Ngọn Lửa Vĩnh Hằng"
  destroy_the_magi_decision_desc: "Người dân nông thôn lâu nay đã có tập tục riêng, tự chăm sóc các ngọn lửa vĩnh hằng. Đã đến lúc chấm dứt các nghi lễ rối rắm và giáo điều phân cấp của giáo sĩ, để vai trò [ROOT.Char.GetFaith.PriestNeuter] trở nên khả dụng với bất kỳ ai được cộng đồng tin tưởng."
  destroy_the_magi_decision_alternate_desc: "Đức tin [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] lâu nay bị ràng buộc bởi mê tín và nghi lễ lỗi thời, do các giáo sĩ quyền lực áp đặt. Đã đến lúc mở ra một kỷ nguyên mới, một đức tin phù hợp với thế giới hiện đại. Ta sẽ chấm dứt thực hành thờ lửa lỗi thời và cải cách [ROOT.Char.GetFaith.random_AltPriestTermPlural] trên đất nước Ta."
