l_english:

 # Assertion
  struggle_persia_ending_assertion: "Khôi phục Caliphate"
  struggle_persia_ending_assertion_decision_desc: "Sau khi dẹp yên các cuộc nổi loạn và lực lượng âm mưu chống lại Caliphate tại cả Iran và Mesopotamia, ta có thể quyết liệt khôi phục niềm tin của dân chúng vào Đế chế Abbasid và quyền lực to lớn mà nó từng nắm giữ trên thế giới."
  struggle_persia_ending_assertion_decision_confirm: "Kết thúc $persian_struggle$"
  struggle_persia_ending_assertion_tooltip: "Caliphate chính đáng phải được bảo vệ bằng mọi giá, và kẻ thù của Hồi giáo bị nghiền nát dưới bụi đất."
  struggle_persia_ending_assertion.b: "@warning_icon! #X Lãnh thổ mất trong cuộc đấu tranh sẽ không được khôi phục!#!"
  fp3_struggle_assertion_arabia_absorb_persia_swing_rewards_tt: "Toàn bộ [GetTitleByKey('e_persia').GetName|l] trở thành một phần [de_jure|E] của [GetTitleByKey('e_arabia').GetName]"
  struggle_persia_ending_assertion.l: "Hơn [SCOPE.ScriptValue('fp3_persia_supporter_rulers_decimal_value')|V0%] các [struggle_involved|E] [count|E] hoặc các [independent|E] [rulers|E] hoặc chư hầu trực tiếp của Caliph có [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )] [trait|E] ([SCOPE.ScriptValue('fp3_persia_supporter_rulers_count_value')]/[SCOPE.ScriptValue('fp3_persia_supporter_rulers_half_value')])"
  struggle_persia_ending_assertion.2: "Không có [independent|E] [struggle_involved|E] hoặc [struggle_interloper|E] [duke|E] trở lên nào có [GetTrait('fp3_struggle_detractor').GetName( GetNullCharacter )] [trait|E] #weak (hiện tại [SCOPE.ScriptValue('fp3_persia_independent_detractor_rulers_count_value')|V0])#!"
  struggle_persia_ending_assertion.3: "Không có [independent|E] [struggle_involved|E] hoặc [struggle_interloper|E] [duke|E] trở lên nào theo một [faith|E] không phải [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] #weak (hiện tại [SCOPE.ScriptValue('fp3_persia_independent_non_sunni_rulers_count_value')|V0])#!"

  struggle_persia_ending_decision_caliphate_exists_tt: "[holder|E] của [GetTitleByKey('d_sunni').GetBaseName] cũng nắm giữ [GetTitleByKey('e_arabia').GetDefinitiveName]"
  fp3_struggle_ending_conversion_modifier_desc: "Kết thúc $persian_struggle$"

 # Sundering
  fp3_sunder_the_caliphate_decision: "Phá hủy Caliphate"
  fp3_sunder_the_caliphate_decision_desc: "Sau khi tiêu diệt các tay sai của [GetTitleByKey('d_sunni').GetHolder.GetHouse.GetBaseName] và chiếm các cứ điểm của họ ở Mesopotamia, số phận của [GetTitleByKey('d_sunni').GetName] nằm trong tay ta. Ta có thể phá hủy nó, một lần và mãi mãi."
  fp3_sunder_the_caliphate_decision_confirm: "Tiêu diệt nó"
  fp3_sunder_the_caliphate_decision_tooltip: "Phá hủy Caliphate và mở đường cho một tương lai mới cho khu vực"
  fp3_sunder_the_caliphate_same_faith_vassal_tt: "Tất cả [vassals|E] cùng [faith|E] #weak ([THIS.Char.GetFaith.GetName])#! của [GetTitleByKey('d_sunni').GetHolder.GetTitledFirstNamePossessive]"
  fp3_sunder_the_caliphate_hostile_faith_vassal_tt: "Tất cả các [vassals|E] của [GetTitleByKey('d_sunni').GetHolder.GetTitledFirstNamePossessive] thuộc [faiths|E] [faith_hostile|E] với ngài #weak ([GetTitleByKey('d_sunni').GetHolder.GetFaith.GetName])#!"
  fp3_sunder_the_caliphate_same_faith_vassal_hook_tt: "[sunderer.GetShortUIName|U] sẽ nhận một [weak_hook|E] #weak ($favor_hook$)#! với họ"
  fp3_sunder_the_caliphate_sunni_vassal_tt: "Mỗi [vassal|E] của [faith|E] [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName]"
  fp3_struggle_assertion_caliph_detractor_tt: "Mỗi [GetTrait('fp3_struggle_detractor').GetName(GetNullCharacter)] sẽ bị đánh dấu là [criminal|E] đối với Caliph #weak ([imprisonment|E] và [revocation|E])#!"
  fp3_struggle_assertion_subjugation_expanded_tt: "Các [house_heads|E] của [house|E] của ngươi và Nhà [GetTitleByKey('d_sunni').GetHolder.GetHouse.GetBaseName] nhận quyền truy cập vĩnh viễn vào #V Subjugation#! [casus_belli|E] chống lại #EMP tất cả#! các chi nhánh [GetFaithByKey('ashari').GetReligion.GetAdjective] #weak ([GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName], [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName], [GetFaithDoctrine('muhammad_succession_muhakkima_doctrine').GetBaseName], [GetFaithDoctrine('muhammad_succession_zandaqa_doctrine').GetBaseName])#!"
  fp3_struggle_assertion_caliphal_muslim_faction_protection_tt: "Các [rulers|E] [GetFaithByKey('ashari').GetReligion.GetAdjective] sẽ không thể tạo [dissolution_factions|E] hoặc [independence_factions|E] chống lại Caliph [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName]"

 # Concession
