  choose_nizari_name: "[GetFaithByKey('nizari').GetNameNoTooltip]"
  choose_zayidi_desc: "[GetFaithByKey('zayidi').GetName]"
  choose_zayidi_tooltip: "[GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName] [GetFaithByKey('zayidi').GetAdjective] [faith|E] có thể là lựa chọn đúng cho khu vực, nó là [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] trong khi vẫn là [GetFaithDoctrine('tenet_unrelenting_faith').GetBaseName]. Sức mạnh đến từ sự đa dạng — chứ không phải sự thống nhất qua phục tùng Caliph!"
