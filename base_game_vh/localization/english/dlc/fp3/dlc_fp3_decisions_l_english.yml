  invite_former_slave_soldiers_decision: "Tuyển Chiến binh Bộ tộc"
  invite_former_slave_soldiers_decision_desc: "Với tư cách [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], Ta luôn cần những tâm hồn dũng cảm để lấp đầy hàng ngũ $knight_culture_player_plural_no_tooltip_lowercase$ ưu tú. Không nguồn nào tốt hơn các chiến binh từ các bộ tộc rải rác xung quanh lãnh thổ, vì vậy Ta có thể ra lệnh cho [marshal|E] chọn ra những người giỏi nhất phục vụ triều đình trực tiếp."
  invite_former_slave_soldiers_decision_confirm: "Hãy đưa những người giỏi nhất đến trước Ta!"
