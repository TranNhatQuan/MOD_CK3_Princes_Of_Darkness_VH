  fp3_promote_persian_scripture_decision_name: "Khuyến khích Kinh điển Ba Tư"
  fp3_promote_persian_scripture_decision_desc: "Ngôn ngữ Ả Rập lâu nay được xem là vượt trội, đặc biệt trong vấn đề tôn giáo. Đã đến lúc thách thức niềm tin này, khuyến khích văn học Hồi giáo bằng tiếng Ba Tư, và thậm chí dịch các Hadith quan trọng. Điều này có thể không làm người Ả Rập hoặc các chư hầu, giáo sĩ bảo thủ vừa ý, nhưng dân chúng xứng đáng biết [ROOT.Char.GetFaith.HighGodNameAlternate] bằng tiếng của họ, như ngày xưa."
