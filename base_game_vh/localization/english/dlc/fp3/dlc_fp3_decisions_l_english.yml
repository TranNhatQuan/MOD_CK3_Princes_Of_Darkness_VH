  destroy_the_apostates_decision_name: "Tiêu diệt kẻ ngoại đạo"
  avenge_the_battle_of_nahrawan_decision_desc: "Trong những ngày đầu của [ROOT.Char.GetFaith.GetReligion.GetName], sau khi bị phản bội bởi Caliphate Rashidun, Muhakkima bị thất bại nhục nhã tại trận Nahrawan. Kể từ đó, chúng ta chiến đấu không ngừng để tiêu diệt mọi kẻ ngoại đạo và chứng minh rằng sự phán xét thuộc về [ROOT.Char.GetFaith.HighGodNameAlternate] mà thôi. Ta quyết tâm chấm dứt cuộc chiến với những kẻ không tin một lần và mãi mãi."
