  fp3_concession_frontier_ambitions_tt: "Mỗi [house|E] do [GetTrait('fp3_struggle_detractor').GetName( GetNullCharacter )] lãnh đạo nhận [GetModifier('fp3_house_modifier_frontier_ambitions').GetNameWithTooltip|L] trong [Scope.ScriptValue('fp3_house_modifier_concession_ending_duration')|V0] năm"
  fp3_concession_truce_reason: "Là một phần của nhượng bộ để kết thúc [GetStruggle('persian_struggle').GetName] [struggle|E], các lãnh chúa trong khu vực đã đồng ý một hiệp ước đình chiến dài hạn."
  fp3_concession_truce_tt: "Tất cả [independent|E] [struggle_involved|E] [rulers|E] nhận hiệp ước [truce|E] 50 năm với nhau"
