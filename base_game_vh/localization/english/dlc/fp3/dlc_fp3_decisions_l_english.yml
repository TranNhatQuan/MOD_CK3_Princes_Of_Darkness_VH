  fp3_rally_troops_in_rebellion_decision: "Tập hợp quân nổi loạn"
  fp3_rally_troops_in_rebellion_decision_desc: "Giữa hỗn loạn, cơ hội luôn xuất hiện. Thời đại này cũng không ngoại lệ, với tư cách [ROOT.Char.Custom('GetCouncilOrCourtPosition')], Ta có hàng trăm — thậm chí hàng nghìn — đồng chí sẵn sàng tập hợp và giúp Ta chiếm lấy đất đai riêng. Trước đây, [ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseName] đã công nhận tài năng Ta và ban cho quyền lực ít ỏi. Hôm nay, với thanh gươm trong tay, vận mệnh sẽ công nhận tham vọng thật sự của Ta."
