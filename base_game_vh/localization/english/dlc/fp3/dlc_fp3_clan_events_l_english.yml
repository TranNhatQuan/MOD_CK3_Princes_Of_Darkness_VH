 ##################################################

#Usury against Unity, by Ola Jentzsch 
  fp3_clan.8000.t: "Cho vay nặng lãi chống lại sự đoàn kết"
  fp3_clan.8000.desc: "[concerned_one.GetName] tiến đến gần Ta với vẻ đầy lo ngại. \"Ta nghe nói [usurer.GetTitledFirstName] đang cho các cận thần gặp khó khăn tài chính vay tiền, lợi dụng sự khốn khó của họ với mức lãi suất cắt cổ của [usurer.GetHerHis]. Mọi người đều nói rằng [usurer.GetSheHe] là kẻ cho vay nặng lãi và cần phải bị quy trách nhiệm.\"\n\nKhi Ta đối chất với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('usurer'))] bị cáo buộc của mình, [usurer.GetSheHe] lập tức phản đối kịch liệt. \"Đây là một lời buộc tội bỉ ổi! Đúng là vài người Ngài đã nhờ Ta giúp đỡ tiền bạc, nhưng Ta không hề có ý xấu và cũng không yêu cầu nhiều hơn những gì hợp lý.\n\nThực ra [concerned_one.GetTitledFirstNameNoTooltip] đang nợ tiền Ta, vì thế [concerned_one.GetHerHis] mới xen vào chuyện này.\""
  fp3_clan.8000.a: "Vài ngày trong ngục sẽ khiến ngươi thay đổi, [usurer.GetFirstName]."
  fp3_clan.8000.b: "Chia sẻ số tiền kiếm được bất chính của ngươi, và chúng ta có thể quên chuyện này."
  fp3_clan.8000.c: "Nghe có vẻ là chuyện các ngươi nên tự giải quyết với nhau."
  fp3_relations_reaction_to_imprisonment.tt: "Các thành viên gia tộc và chư hầu có thiện cảm với [usurer.GetTitledFirstNameNoTooltip] sẽ phản ứng tiêu cực với việc này."

 #Clan Quarrel, by Ola Jentzsch 
  fp3_clan.8001.t: "Tranh cãi trong gia tộc"
  fp3_clan.8001_beginning: "[bickerer_1.GetTitledFirstName] và [bickerer_2.GetTitledFirstName] gần đây đã xảy ra cãi vã trong một buổi tiệc riêng, và cả hai đều khăng khăng muốn lôi Ta về phía mình trong cuộc xung đột này."
  fp3_clan.8001_faith_schism: "Sự bất đồng của họ dường như bắt nguồn từ một cuộc tranh luận gay gắt về bản chất của [bickerer_1.GetFaith.PantheonTerm].\n\n\"[bickerer_1.GetFirstNameNoTooltip] đang giữ những quan điểm #EMP rất#! đáng nghi\", [bickerer_2.GetFirstNameNoTooltip] nói. \"Nếu là ngài, Ta đã đuổi [bickerer_1.GetHerHim] khỏi triều đình rồi!\"\n\n\"Ta sẽ không kể chi tiết ghê tởm về những thứ được gọi là lập luận của [bickerer_2.GetFirstNamePossessiveNoTooltip]\", [bickerer_1.GetFirstNameNoTooltip] phản đối, \"nhưng hãy tin ta, #EMP ta#! không phải kẻ phạm thượng ở đây...\""
  fp3_clan.8001_generic_fallback: "Mặc dù không rõ chính xác chuyện gì đã xảy ra, cả hai đều rất háo hức kể cho ta nghe chi tiết suy nghĩ của họ về người kia.\n\n\"[bickerer_2.GetFirstNameNoTooltip] là một kẻ [Select_CString(bickerer_2.IsFemale,'ngốc nghếch','thô lỗ')] sinh ra từ hàng rào, đơn giản và rõ ràng\", [bickerer_1.GetFirstNameNoTooltip] tranh luận.\n\n\"Im lặng đi, đồ [bickerer_1.Custom2('InsultNoun', SCOPE.sC('bickerer_2'))]\", [bickerer_2.GetFirstNameNoTooltip] gầm gừ đáp lại.\n\nViệc hòa giải giữa họ dường như là một nỗ lực vô ích vào lúc này, nhưng ta lo rằng nếu không làm gì thì mọi chuyện sẽ chỉ trở nên tồi tệ hơn."
  fp3_clan.8001.a: "Đã đến lúc bỏ qua chuyện này, vì lợi ích của tất cả mọi người."
  fp3_clan.8001.b: "Thực ra [bickerer_1.GetFirstNameNoTooltip] cũng có vài điểm đúng..."
  fp3_clan.8001.c: "Ta còn việc quan trọng hơn phải làm... ở đâu đó."
  fp3_clan.8001.d: "Đừng kéo Ta vào chuyện này."
  fp3_clan_making_conflict_worse_flavor: "Ngài cố gắng khoét sâu thêm rạn nứt giữa [bickerer_1.GetFirstNameNoTooltip] và [bickerer_2.GetFirstNameNoTooltip]."
  fp3_clan.8001.b.success: "Họ mắc bẫy thao túng của Ngài"
  fp3_clan.8001.b.failure: "Họ nhìn thấu sự lừa dối của Ngài"
  fp3_clan.8001.b.success.tt: "Ngài đã gây ra một rạn nứt trong gia tộc"
  fp3_clan.8001.b.failure.tt: "Ngài không thể gieo rắc bất hòa"
  fp3_clan.8001.a.success: "Ngài đã hàn gắn thành công rạn nứt này"
  fp3_clan.8001.a.success.tt: "Việc hòa giải của Ngài thành công"
  fp3_clan.8001.a.failure: "Ngài chỉ khiến mọi chuyện tệ hơn"
  fp3_clan.8001.a.failure.tt: "Việc hòa giải của Ngài thất bại"


 #Bonds of Faith, by Ola Jentzsch 
  fp3_clan.8002.t: "Mối Ràng Buộc Đức Tin"
  fp3_clan.8002.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]", [chaplain.GetCouncilTitle] của Ta là [chaplain.GetFirstName] nói với vẻ lo lắng, "chúng ta cần nói về những vấn đề tâm linh." [chaplain.GetSheHe|U] dừng lại một lúc để chắc rằng không có ai xung quanh.\n\n"Ta đã nghe [clan_member.GetName] bàn tán về việc ngài hiếm khi đến [ROOT.Char.GetFaith.HouseOfWorship].\n\nDĩ nhiên, Ta không dám suy đoán về mối quan hệ cá nhân của ngài với thần linh, thưa [ROOT.Char.GetTitleTierName]. Nhưng việc ngài #EMP được nhìn nhận#! là mộ đạo đến mức nào lại vô cùng quan trọng đối với những người mà ngài cai trị.""
  fp3_clan.8002.a: "Có lẽ ta đã lơ là và bỏ bê bổn phận của mình..."
  fp3_clan.8002.b: "Một khoản quyên góp sẽ được dành cho [ROOT.Char.GetFaith.HouseOfWorship] địa phương."
  fp3_clan.8002.c: "Cứ để những kẻ cả tin đó #EMP nghĩ#! rằng ta quan tâm..."
  fp3_clan.8002.d: "[clan_member.GetFirstNameNoTooltip], ngươi nói sao? Ta sẽ cắt lưỡi [clan_member.GetHerHis] vì chuyện này..."
  fp3_clan.8002.e: "Ta không cần phải nói dối về lòng trung thành với đức tin của mình."
  fp3_pretending_to_be_pious_flavor: "Ngài dành nhiều thời gian hơn tại [ROOT.Char.GetFaith.HouseOfWorship] — hoặc ít nhất khiến mọi người nghĩ là như vậy."
  fp3_clan.8002.b.success: "Sự lừa dối của Ngài thành công"
  fp3_clan.8002.b.failure: "Ngài không lừa được ai"
  fp3_clan.8002.b.success.tt: "Lòng mộ đạo của Ngài không ai có thể nghi ngờ"
  fp3_clan.8002.b.failure.tt: "Sự mộ đạo giả tạo của Ngài bị vạch trần"

 #The Power of a Name, by Ola Jentzsch
  fp3_clan.8003.t: "Quyền Lực Của Danh Tiếng"
  fp3_clan.8003_fear_opening: ""[ROOT.Char.GetName], ngài đã trở nên vĩ đại giữa [ROOT.Char.Custom('LevyMenWomen')], và những chiến công cùng danh tiếng của ngài được tôn trọng... và sợ hãi." Sứ giả của [righteous_caliph.GetTitledFirstNamePossessive] là [hof_emissary.GetFirstName] ngập ngừng lo lắng.\n\n"
  fp3_clan.8003_respect_opening: ""[ROOT.Char.GetName], ngài đã trở nên vĩ đại giữa [ROOT.Char.Custom('LevyMenWomen')], và những chiến công cùng gia tộc của ngài được mọi người tôn trọng và vinh danh." Sứ giả của [righteous_caliph.GetTitledFirstNamePossessive] là [hof_emissary.GetFirstName] dừng lại một cách trang nghiêm.\n\n"
  fp3_clan.8003_ending: ""Đó là lời của [righteous_caliph.GetTitleTierName]", [hof_emissary.GetSheHe] tuyên bố, "và [righteous_caliph.GetSheHe] đã quyết định ban cho ngài một vinh dự lớn. Tên của ngài sẽ được xướng lên trong buổi cầu nguyện thứ Sáu, ngay tại [caliphal_location.GetName]. Tất cả những gì [righteous_caliph.GetTitleTierName] yêu cầu đổi lại là ngài đừng quên lòng nhân từ của [righteous_caliph.GetHerHis] khi ban cho ngài ân huệ này..."\n\nGiọng nói của [hof_emissary.GetHerHis|U] dần nhỏ lại, như muốn nhấn mạnh ý nghĩa ẩn sau những lời đó."
  fp3_clan.8003.a: "Đó là một vinh dự."
  fp3_clan.8003.b: "Đọc một lần là đủ."
  fp3_clan.8003.c: "Ta không xứng đáng với điều này."

 #Bonds of Fear, by Ola Jentzsch
  fp3_clan.8004.t: "Mối Ràng Buộc Của Nỗi Sợ"
  fp3_clan.8004.desc: "[murder_enthusiast.Custom('GetCouncilOrCourtPosition')] [murder_enthusiast.GetFirstName] của ta đã yêu cầu một cuộc trò chuyện riêng, với vẻ mặt lo lắng trên khuôn mặt mình.\n\n\"Nghe này, hỡi [ROOT.Char.GetTitleTierName]\", [murder_enthusiast.GetSheHe] nói, gần như thì thầm. \"[clan_member.GetName] đang âm mưu điều gì đó, có lẽ lại đang âm mưu chống lại ngài lần nữa. Có lẽ đã đến lúc thực hiện một động thái chống lại ai đó thân cận với [clan_member.GetHerHim] để gửi đi một thông điệp? Ta nghe nói [clan_member.GetSheHe] có một người hầu mà [clan_member.GetSheHe] rất ưu ái...\""
  fp3_clan.8004.a: "Làm đi — nhưng phải kín đáo."
  fp3_clan.8004.b: "Không cần kín đáo — cứ giết thẳng tay."
  fp3_clan.8004.c: "Không, và đừng bao giờ nhắc đến chuyện này nữa."
  fp3_clan.8004.a.success: "Ngài đã thành công khiến [clan_member.GetTitledFirstNameNoTooltip] khiếp sợ"
  fp3_clan.8004.a.success.tt: "Ngài khiến gia tộc phải sợ hãi"
  fp3_clan.8004.a.failure: "Âm mưu của Ngài phản tác dụng"
  fp3_clan.8004.a.failure.tt: "[clan_member.GetTitledFirstNameNoTooltip] không hề nao núng"

 #A Proper Position, by Ola Jentzsch
  fp3_clan.8005.t: "Một Vị Trí Xứng Đáng"
  fp3_clan.8005.desc: "\"Thật không công bằng\", [ambitious_consort.GetTitledFirstName] phàn nàn, cuối cùng cũng cất tiếng lên về sự oán giận dường như đã bị kìm nén từ lâu.\n\n\"[heir_child.GetFirstName], đứa [heir_child.Custom('GetDaughterSon')] được nuông chiều của [heir_parent.GetTitledFirstName], sẽ thừa kế [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], trong khi đứa [empowered_child.Custom('GirlBoy')] thông minh của ta, [empowered_child.GetFirstName], sẽ chẳng nhận được gì cả.\n\nTa muốn ngài cấp cho [empowered_child.GetFirstNameNoTooltip] tước hiệu [title_to_grant.GetName] ngay lập tức để [empowered_child.GetSheHe] có cơ hội chứng minh mình cũng có năng lực như những người cùng trang lứa\"."
  fp3_clan.8005.a: "#EMP Không bao giờ#!, nghe rõ chưa? Và đừng bao giờ nhắc đến chuyện này nữa."
  fp3_clan.8005.b: "Thật vô lý, nhưng được thôi..."
  fp3_clan.8005.d: "[empowered_child.GetSheHe|U] còn quá trẻ để giữ một tước hiệu!"
  fp3_clan.8005.e: "Ta hứa với ngươi, [empowered_child.GetSheHe] sẽ nhận được phần thừa kế vào thời điểm thích hợp."
  original_heir_upset_flavor: "Người thừa kế ban đầu của tước hiệu sẽ không hài lòng nếu Ngài làm điều này."
  fp3_clan.8005.e.success: "Ngài trấn an [ambitious_consort.GetFirstNameNoTooltip]"
  fp3_clan.8005.e.success.tt: "Ngài đã làm dịu [ambitious_consort.GetFirstNameNoTooltip]"
  fp3_clan.8005.e.failure: "Ngài không thuyết phục được [ambitious_consort.GetHerHim]"
  fp3_clan.8005.e.failure.tt: "[ambitious_consort.GetFirstNameNoTooltip] không còn tin tưởng Ngài"
  fp3_empowered_child.tt: "Trong vài năm tới, nếu [empowered_child.GetFirstNameNoTooltip] vẫn giữ tước hiệu này, [empowered_child.GetSheHe] sẽ nhận được cải thiện [skill|E] tùy theo các [traits|E] hiện tại của [empowered_child.GetHerHis]."
  fp3_8007_studies_pay_off_toast: "[empowered_child.GetFirstName] cho thấy nhiều triển vọng"

#Smaller Spies, by Ola Jentzsch
  fp3_clan.8006.t: "Những gián điệp nhỏ"
  fp3_clan.8006.desc: "[paranoia_enthusiast.GetName], [paranoia_enthusiast.Custom('GetCouncilOrCourtPosition')] của ta, dạo gần đây dường như đặc biệt quan tâm đến [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_child'))] của ta là [sneaky_child.GetFirstName].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tình hình trong gia tộc [ROOT.Char.GetDynastyHouseNameNoTooltip] ngày càng căng thẳng theo từng ngày. Người thân của ngài luôn âm mưu chống lại ngài.\" [paranoia_enthusiast.GetSheHe|U] nói, khẽ thúc [sneaky_child.GetFirstNameNoTooltip] bước ra phía trước.\n\n\"Nhưng Ta đã xây dựng một mạng lưới những người cung cấp tin trẻ tuổi, để giúp ngài có lợi thế, vì những gián điệp nhỏ có rất nhiều công dụng... Dù những đứa trẻ đó chỉ là thường dân, nhưng tiểu [sneaky_child.GetLadyLord] [sneaky_child.GetFirstNameNoTooltip] ở đây có tài năng đáng chú ý và có thể mang lại lợi ích cho ngài...\""
  fp3_clan.8006.a: "Đứa [sneaky_child.Custom('GetDaughterSon')] của ta là một quý tộc, không phải là một tên gián điệp tầm thường!"
  fp3_clan.8006.b: "Đi đi nhóc, hãy mở to mắt để phát hiện sự phản bội trong gia tộc chúng ta..."
  fp3_clan.8006.c: "Đây, hãy thuê vài gián điệp, nhưng tránh xa gia đình ta."

 #Bleeding Them Dry, by Ola Jentzsch
  fp3_clan.8008.t: "Vắt kiệt họ"
  fp3_clan.8008.desc: "Gần đây, viên thu thuế tàn nhẫn của ta là [ambitious_tax_collector.GetName] đã dành nhiều thời gian trầm ngâm suy nghĩ. Nhưng cuối cùng dường như [ambitious_tax_collector.GetSheHe] cũng đã có kết quả khi tìm đến ta.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], các chư hầu của ngài luôn nghĩ ra đủ mọi lý do để không nộp thuế nhiều như họ đáng ra phải nộp. Nhưng Ta cũng có thể đưa ra... #italic những lý do#!...\"\n\n[ambitious_tax_collector.GetSheHe|U] lấy ra một văn kiện trông khá cũ: \"Chứng thư này cho thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beleaguered_clan_member'))] của ngài là [beleaguered_clan_member.GetTitledFirstName] nợ ngài nhiều hơn so với trước đây ta nghĩ, và Ta cũng có vài thứ tương tự cho những thần dân khác của ngài...\""
  fp3_clan.8008.a: "Càng nhiều càng tốt!"
  fp3_clan.8008.b: "Hãy tập trung vào [beleaguered_clan_member.GetTitledFirstNameNoTooltip]."
  fp3_clan.8008.c: "Ta sẽ không để lòng tham gây chia rẽ gia tộc."
  unlock_extortion.tt: "Mở khóa [decision|E] [extort_subjects|E] trong 20 năm."

 #Popular with the People, by Ola Jentzsch
  fp3_clan.8009.t: "Được lòng dân chúng"
  fp3_clan.8009.desc: "\"Hơn nữa, [corrupt_mayor.GetName] là một nhà quản lý khá có năng lực và được lòng dân, cả trong lãnh địa của [corrupt_mayor.GetHerHis] lẫn toàn bộ [fawazil_county.GetNameNoTier]. Tuy nhiên, [corrupt_mayor.GetSheHe] có thói quen lén lút khấu trừ một khoản đáng kể từ số thuế [corrupt_mayor.GetSheHe] gửi cho ngài, như ta có thể thấy rõ ở cột trên cùng bên trái của bảng thu nhập năm ngoái.\"\n\nBản báo cáo thuế dài dòng và chi tiết của [righteous_tax_collector.GetNamePossessive] kết thúc bằng một tiết lộ đáng kinh ngạc."
  fp3_clan.8009.a: "Dám ăn cắp của ta? Đóng đinh [corrupt_mayor.GetHerHim] lên thập giá!"
  fp3_clan.8009.b: "Luật pháp đứng về phía ta – cách chức [corrupt_mayor.GetHerHim]."
  fp3_clan.8009.c: "Hừm, [corrupt_mayor.GetTitleAsNameNoTooltip]? Chỉ là con [ROOT.Char.Custom('GetRegionalFish')] nhỏ."
  fp3_clan.8009.a.success: "Ngài khiến những người ủng hộ [corrupt_mayor.GetFirstNamePossessiveNoTooltip] khuất phục vì sợ hãi"
  fp3_clan.8009.a.failure: "Dân chúng trở nên phẫn nộ hơn là sợ hãi"
  fp3_clan.8009.a.success.tt: "Sự tàn nhẫn của Ngài được đền đáp"
  fp3_clan.8009.a.failure.tt: "Sự tàn nhẫn của Ngài vô ích"
  fp3_clan.8009.a.eccentric: "Sao [corrupt_mayor.GetSheHe] dám chống lại ta!"

 #More Magistrates, by Ola Jentzsch
  fp3_clan.8010.t: "Thêm quan tòa"
  fp3_clan.8010_muslim.t: "Những Qadi có năng lực"
  fp3_clan.8010.desc_beginning: "\"Ta không thể làm việc như thế này\", viên thu thuế của ta là [competent_tax_collector.GetName] kêu lên đầy thất vọng và chán nản.\n\n"
  fp3_clan.8010_muslim_version: "\"Mọi tòa án #italic sharia#! trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] đều là ổ của sự bất tài, cản trở mọi nỗ lực của Ta. Việc thu thuế hiệu quả cần những #italic qadi#! có năng lực để kiểm soát các quý tộc địa phương, khiến sự cai trị của ngài trở nên chính đáng trước [ROOT.Char.GetFaith.HighGodNameAlternate] và yêu sách thu phần lớn thuế của ngài trở nên hợp lý.\n\nNgài phải cấp cho Ta ngân quỹ để thuê thêm những người giỏi hơn cho các tòa án và quyền sa thải những qadi già nua tham nhũng.\""
  fp3_clan.8010_non_muslim_version: "\"Mọi tòa án trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] đều là nơi đáng buồn nơi lòng tham lấn át hiệu quả và công lý, cản trở mọi nỗ lực của Ta. Việc thu thuế hiệu quả cần những quan tòa có năng lực để kiểm soát các quý tộc địa phương, khiến sự cai trị của ngài trông chính đáng và yêu sách thu thuế trở nên hợp lý.\n\nNgài phải cấp cho Ta ngân quỹ để thuê thêm những người giỏi hơn cho các tòa án và quyền sa thải những kẻ ngu dốt hiện đang ngồi ở đó.\""
  fp3_clan.8010.a: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('capable_magistrate_candidate'))] [capable_magistrate_candidate.GetFirstNameNoTooltip] của ta rất có năng lực, ngài có thể xoay xở với [capable_magistrate_candidate.GetHerHim]."
  fp3_clan.8010.b: "Được thôi, ta sẽ cung cấp những gì ngươi cần."
  fp3_clan.8010.c: "Ta trông giống làm bằng tiền lắm sao?"
  tax_farming_capable_courtier_flavor: "Ngài cử [capable_magistrate_candidate.GetFirstNameNoTooltip] đi làm quan tòa."
  increase_aptitude.tt: "Modifier này có thể tăng [aptitude|E] của [competent_tax_collector.GetFirstNamePossessiveNoTooltip]"

 #A Proper Paymaster, by Ola Jentzsch
  fp3_clan.8011.t: "Người quản lý quân lương đúng nghĩa"
  fp3_clan.8011.desc: "Luôn có nhiều ý tưởng để cải thiện nguồn thu của vương quốc, [competent_tax_collector.GetName] tìm đến ta khi ta đang tiến hành kiểm tra quân đội thường lệ.\n\n\"Ôi [ROOT.Char.GetTitleTierName], Ta nhận thấy rằng trong lãnh địa của ngài, các quý tộc nhỏ địa phương luôn tìm cách làm đầy túi mình bằng cách bớt xén tiền của binh lính. Ta đề nghị ngài trao cho Ta quyền giám sát việc trả lương cho binh sĩ, khi đó Ta có thể chống tham nhũng và đảm bảo quân đội của ngài được tài trợ hiệu quả hơn.\"\n\n\"Tuy nhiên, Ta e rằng [concerned_marshal.GetTitledFirstName] sẽ không hài lòng, vì mọi việc liên quan đến binh lính từ trước đến nay đều thuộc trách nhiệm của [concerned_marshal.GetHerHis].\""
  fp3_clan.8011.a: "[concerned_marshal.GetSheHe|U] dù sao cũng đã có quá nhiều việc phải làm trên đôi vai của mình rồi..."
  fp3_clan.8011.b: "Hai người có thể chia sẻ trách nhiệm này."
  fp3_clan.8011.c: "Không, ta sẽ giữ mọi thứ như hiện tại."
  fp3_clan.8011.b.success: "[competent_tax_collector.GetFirstNameNoTooltip] và [concerned_marshal.GetFirstNameNoTooltip] miễn cưỡng đồng ý hợp tác"
  fp3_clan.8011.b.failure: "Cả hai đều ghét cải cách này"
  fp3_clan.8011.b.success.tt: "Ngài đã đạt được thỏa hiệp"
  fp3_clan.8011.b.failure.tt: "Thỏa hiệp của Ngài thất bại"

  fp3_clan.8012.t: "Lòng tham may mắn"
  fp3_clan.8012.desc: ""Đôi khi, [ROOT.Char.Custom('FormOfAddressForLiege')], vận may bất ngờ cũng xảy ra." Viên thu thuế của ta là [greedy_tax_collector.GetName] xoa hai tay [greedy_tax_collector.GetHerHis] với vẻ hài lòng khó giấu.\n\n"Ta đã tìm được những nhân chứng sẵn sàng làm chứng rằng [extorted_vassal.GetTitledFirstName] nợ ngài một khoản đáng kể, từ những khoản thuế đất đối với cây lâu năm và cối xay nước đã #italic bị quên#! một cách rất thuận tiện. Ta đã tự tiện thu chúng rồi.\n\nTuy nhiên, một thuộc hạ của Ta gặp chút rắc rối khi hộ tống số vàng ra khỏi [extorted_vassal.GetCapitalLocation.GetName], vì bị lính canh địa phương quấy nhiễu, nên có lẽ ngài nên để mắt tới [extorted_vassal.GetFirstNameNoTooltip]...""
  fp3_clan.8012.a: "Làm tốt lắm!"
  fp3_clan.8012.b: "Hãy đem nó dâng cho [ROOT.Char.GetFaith.HouseOfWorship], khi đó [extorted_vassal.GetSheHe] sẽ không thể phản đối."
  fp3_clan.8012.c: "Ta sẽ thể hiện sự rộng lượng, bằng cách trả lại cho [extorted_vassal.GetHerHim] một phần như món quà."

  fp3_clan.8013.t: "Gánh nặng của việc thu thuế khoán"
  fp3_clan.8013.desc: "Khi đang tản bộ trong [ROOT.Char.Custom('ResidenceBuilding')], ta đi ngang qua thư viện, nơi viên thu thuế của ta là [stressed_tax_collector.GetName] trông có vẻ vô cùng chán nản.\n\n"Ôi [ROOT.Char.GetFaith.HighGodNameAlternate]", [stressed_tax_collector.GetSheHe] lẩm bẩm với chính [stressed_tax_collector.GetHerselfHimself], "Ta không thể làm nổi việc này. Những luận văn luật thuế này quá cũ, quá mơ hồ, quá lộn xộn. Làm sao ta có thể tìm được bất cứ thứ gì trong đây?\n\nTa chỉ muốn kiểm tra một chi tiết nhỏ trước khi lại lên đường tới các tỉnh...""
  fp3_clan.8013.a: "Bình tĩnh nào, chúng ta có thể cùng xem xét."
  fp3_clan.8013.b: "Làm việc đi, nếu không ta sẽ cho ngươi ăn roi!"
  fp3_clan.8013.c: "Ta sẽ đi tiếp..."
  fp3_clan.8013.a.success: "Ngài trấn an [stressed_tax_collector.GetFirstNameNoTooltip]"
  fp3_clan.8013.a.failure: "[stressed_tax_collector.GetSheHe|U] vẫn tiếp tục tuyệt vọng"
  fp3_clan.8013.b.success: "Ngài khiến [stressed_tax_collector.GetFirstNameNoTooltip] sợ hãi và làm việc chăm chỉ hơn"
  fp3_clan.8013.b.failure: "Sự đe dọa của Ngài hầu như không có tác dụng"
  fp3_clan.8013.a.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] lấy lại sự tập trung"
  fp3_clan.8013.a.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] trở nên cẩu thả"
  fp3_clan.8013.b.success.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] sợ Ngài"
  fp3_clan.8013.b.failure.tt: "[stressed_tax_collector.GetFirstNameNoTooltip] nhìn thấu lời đe dọa của Ngài"

  fp3_clan.8015.t: "Hậu duệ tai tiếng"
  fp3_clan.8015.desc: "[concerned_parent.GetName] bước vào đại sảnh của ta, kéo theo [concerned_parent.GetHerHis] [scandalous_scion.Custom('GetDaughterSon')] là [scandalous_scion.GetFirstName], người trông có vẻ không mấy vui vẻ.\n\n"[ROOT.Char.GetTitleTierName] của Ta", [concerned_parent.GetFirstNameNoTooltip] nói, "hẳn ngài đã nghe về cách đứa [scandalous_scion.Custom('GetDaughterSon')] này của Ta cư xử — giao du trong các hội #EMP futuwwa#! với những chiến binh lang bạt tụ tập ở đó, uống rượu cùng họ tại các quán rượu mờ ám và lang thang khắp thị trấn." [concerned_parent.GetSheHe|U] thở dài.\n\n"Chúng ta cần bảo vệ danh tiếng của [scandalous_scion.GetHerHis], kẻo chuyện này trở thành bê bối công khai. Ta nghĩ [scandalous_scion.GetSheHe] có thể ở lại đây để học vài phép tắc tại triều đình của ngài.""
  fp3_clan.8015.a: "Được thôi, [scandalous_scion.GetSheHe] có thể gia nhập triều đình của ta."
  fp3_clan.8015.b: "[scandalous_scion.GetSheHe|U] là con của ngươi, không phải của ta."

  fp3_clan.8016.t: "Hỗn loạn tại nhà tắm Hammam"
  fp3_clan.8016.opening_desc: "Trong khi ta đang tận hưởng bồn tắm thư giãn cùng [chaplain.GetCouncilTitle] của ta là [chaplain.GetFirstName], [chaplain.GetSheHe] đột nhiên nhắc tới một vấn đề nghiêm trọng hơn.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [chaplain.GetSheHe] thì thầm, "tối qua [scandalous_clan_member.GetName] đã ở nhà tắm này, cùng với một đoàn tùy tùng gồm những kẻ vô lại râu ria xồm xoàm"
  fp3_clan.8016.deviant_desc: ", những kẻ lệch lạc, và một con lừa."
  fp3_clan.8016.drunkard_desc: ", những kẻ say xỉn và truỵ lạc."
  fp3_clan.8016.rakish_desc: ", gái điếm và những kẻ đồi bại."
  fp3_clan.8016.hashishiyah_desc: " và những kẻ nghiện ngập mê muội."
  fp3_clan.8016.ending_desc: "Sau đó họ còn thực hiện những hành vi mà ta khó lòng mô tả, và nhất quyết không chịu rời khỏi nơi này. Và đây cũng không phải là lần đầu [scandalous_clan_member.GetFirstNamePossessiveNoTooltip] gây chuyện." [chaplain.GetFirstNameNoTooltip] dừng lại, trông đầy lo lắng.\n\n"Ngài nên công khai lên án [scandalous_clan_member.GetHerHim], trước khi những thói hư tật xấu của [scandalous_clan_member.GetHerHis] làm hoen ố cả gia tộc.""
  fp3_clan.8016.a: "Được thôi, ta sẽ khiển trách hắn"
  fp3_clan.8016.b: "Không, ta sẽ đứng về phía gia đình mình, dù họ tiêu khiển thế nào đi nữa."

  fp3_clan.8017.t: "Một chức vụ đáng ngờ"
  fp3_clan.8017.opening_desc: ""[tax_collector.GetName] đã phục vụ một thời gian với tư cách là người thu thuế của ngài tại vùng đất của Ta, và làm việc cũng khá ổn, nhưng [tax_collector.GetSheHe] gần đây còn bắt đầu tự cho mình vai trò giám sát đạo đức công cộng."\n[unclan_taxpayer.GetTitledFirstName] trông lo lắng, và có lẽ hơi áy náy.\n\n"
  fp3_clan.8017.overly_eager.desc: ""[tax_collector.GetSheHe|U] đã quá mức sốt sắng, cho đánh roi thần dân chỉ vì những vi phạm nhỏ nhặt — từ những trò say rượu vô hại, chơi nhạc ngoài phố, cho tới việc nam nữ vô tình gặp nhau trong nhà tắm...""
  fp3_clan.8017.corrupt.desc: "Than ôi, có vẻ như [tax_collector.GetSheHe] không hề chính trực hay công bằng, nhận bạc để làm ngơ."
  fp3_clan.8017.cruel.desc: "Ta e rằng [tax_collector.GetSheHe] đã tỏ ra khá tàn nhẫn, sẵn sàng dùng roi vọt hoặc thậm chí ném đá làm hình phạt cho những tội nhỏ nhặt."
  fp3_clan.8017.generic.desc: "Sự nhiệt thành tự nó không phải là tội, cũng không hẳn tham nhũng hay tàn nhẫn, nhưng dân địa phương rất căm ghét [tax_collector.GetHerHim].""
  fp3_clan.8017.ending.desc: "\n\n"Xin ngài, Ta biết [tax_collector.GetSheHe] là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('tax_collector'))] của ngài, nhưng ngài phải bảo [tax_collector.GetHerHim] dừng lại.""
  fp3_clan.8017.a: "[tax_collector.GetSheHe|U] đang làm việc nhân danh [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
  fp3_clan.8017.b: "Ngươi sợ [tax_collector.GetNameNoTooltip] sẽ phát hiện điều gì?"
  fp3_clan.8017.c: "Được thôi, nhưng đừng quên ân huệ này."
  fp3_clan.8017.d: "Các ngươi phải tự giải quyết chuyện này."
  fp3_clan_protect_kinsman_flavor: "Ngài bảo vệ [tax_collector.GetNameNoTooltip] trước những cáo buộc này"
  fp3_clan_accuse_accuser_flavor: "Đe dọa [unclan_taxpayer.GetTitledFirstNameNoTooltip] sẽ khiến [unclan_taxpayer.GetHerHim] cân nhắc lại yêu cầu của mình"

  fp3_clan.3000.t: "Những bông tulip bị tàn phá"
  fp3_clan.3000.desc: "Hôm nay, thời tiết dễ chịu đã mời gọi ta bước ra khu vườn.\nHàng dài những bông hoa đẹp nhất ở [fp3_clan_3000_loc_loc.GetNameNoTooltip] đã được trồng cẩn thận ở đây chỉ để ta thưởng thức.\n\nTuy nhiên, niềm vui của ta nhanh chóng bị cắt ngang khi ta đến thăm những bông tulip quý giá của mình: [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_clan_3000_bad_child'))] của ta là [fp3_clan_3000_bad_child.GetFirstName] đã không thương tiếc nhổ những bông tulip đẹp khỏi chỗ của chúng để tặng cho [fp3_clan_3000_bad_child.GetHerHis] [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMeShort', SCOPE.sC('fp3_clan_3000_random_family_member'))] làm quà. "Nhìn này, con tìm được mấy bông hoa đẹp, con nghĩ [fp3_clan_3000_random_family_member.GetFirstName] sẽ thích chúng!""
  fp3_clan.3000.a: "Dễ thương quá, [SCOPE.sC('fp3_clan_3000_bad_child').Custom2('RelationToMeShort', SCOPE.sC('fp3_clan_3000_random_family_member'))] của con sẽ thích lắm!"
  fp3_clan.3000.b: "Ra khỏi vườn của ta! #italic Trả lại đây!!#!"
  fp3_clan.3000.c: "Hay là chúng ta cùng trồng lứa hoa tiếp theo?"
  fp3_clan.3000.c.flavor: "Ngài tận dụng cơ hội này để dạy [fp3_clan_3000_bad_child.GetFirstNameNoTooltip] niềm vui làm vườn"
  fp3_clan.3000.d: "Đủ rồi. #italic Ta sẽ biến ngươi thành phân bón.#!"

