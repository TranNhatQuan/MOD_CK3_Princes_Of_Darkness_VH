  tradition_fp3_enlightened_magnates_desc: "Nền văn hóa này có truyền thống lâu đời về năng lực hành chính và tài năng thi ca. Một vị quân chủ tốt nên sở hữu sự kết hợp rực rỡ của cả hai — hoặc tìm lời khuyên từ những người có chúng."

