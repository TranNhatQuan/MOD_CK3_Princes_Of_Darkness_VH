l_english:
 ###################################
 # Regiments
 ###################################
  asawira: "Asawira"
  asawira_flavor: "#F Hàng ngũ Asawira gồm các quý tộc Iran thiện chiến với cả thương và cung. Nay được khôi phục thành một lực lượng quân sự, họ sẵn sàng tấn công kẻ thù của Ba Tư.#!"

  tarkhan: "Tarkhan"
  tarkhan_flavor: "#F Kỵ binh tinh nhuệ của thảo nguyên, sự kết hợp giữa thương, chùy và cung của Tarkhan có thể phá vỡ gần như mọi tuyến phòng thủ.#!"

  zupin_warrior: "Lính giáo Zupin"
  zupin_warrior_flavor: "#F Những chiến binh Daylamite này là lực lượng rất linh hoạt, vừa có thể lập nên tường khiên vững chắc, vừa có thể tản ra và phóng những ngọn giáo ngắn vào kẻ thù.#!"

  tawashi: "Tawashi"
  tawashi_flavor: "#F Lực lượng kỵ binh linh hoạt này kết hợp kiếm, giáo và cung để bảo vệ quê hương miền núi của họ khỏi những kẻ ngoại lai.#!"

 ###################################
 # Court Positions
 ###################################
  master_assassin_court_position: "Đại Thích Khách"
  master_assassin_court_position_desc: "Bị ràng buộc bởi đức tin hoặc tín điều, Đại Thích Khách hỗ trợ lãnh chúa của mình bằng những phương thức chiến tranh, gián điệp, khủng bố và ám sát đầy phi truyền thống."
 
  has_no_particular_noble_roots_trigger: "Là [lowborn|E] hoặc thuộc một [dynasty|E] không đáng kể"

  court_scholar_court_position: "Học Giả Triều Đình"
  court_scholar_court_position_desc: "Đại diện cho nền tri thức của vương quốc, Học Giả Triều Đình hỗ trợ việc khám phá các [innovations|E] trong tương lai."

 ###################################
 # Buildings
 ###################################
  building_type_sar_i_sang_mines_01: "Các Mỏ Sar-i Sang"
  building_type_sar_i_sang_mines_01_desc: "Nguồn cung lapis lazuli chính của thế giới, các mỏ Sar-i Sang đã hoạt động từ thời tiền sử, và những viên đá xanh của chúng có thể được thấy trong mọi triều đình thời cổ đại. Công nhân địa phương làm việc ngày đêm tại đây để khai thác những viên đá xanh trứ danh."
  building_sar_i_sang_mines_01: "Mỏ Cổ Sar-i Sang"
  building_sar_i_sang_mines_01_desc: "$building_type_sar_i_sang_mines_01_desc$"
  building_sar_i_sang_mines_02: "Mỏ Sar-i Sang Được Khôi Phục"
  building_sar_i_sang_mines_02_desc: "Những đường hầm cổ xưa đã được mở rộng và gia cố, các kỹ sư cũng được đưa tới để mở một giếng mỏ mới, cùng những khả năng mới."
  building_sar_i_sang_mines_03: "Mỏ Sar-i Sang Mở Rộng"
  building_sar_i_sang_mines_03_desc: "Khi hoạt động khai thác phát triển, các mỏ cũng mở rộng theo. Nhiều lối vào mới được xây dựng và giếng mỏ cổ ngày càng được đào sâu hơn."
  building_sar_i_sang_mines_04: "Khu Phức Hợp Khai Mỏ Sar-i Sang"
  building_sar_i_sang_mines_04_desc: "Việc khai thác đá lapis lazuli đã đạt quy mô gần như công nghiệp, với số lượng công nhân lên tới hàng nghìn người. Ngọn núi cổ xưa từng hẻo lánh này nay đã trở thành trung tâm của một nền kinh tế sôi động."

