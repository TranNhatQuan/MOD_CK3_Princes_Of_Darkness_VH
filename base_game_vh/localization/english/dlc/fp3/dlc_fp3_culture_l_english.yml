 # Turko-Iranian
  tradition_fp3_frontier_warriors_name: "Chiến Binh Biên Cương"
  tradition_fp3_frontier_warriors_desc: "Nền văn hóa này luôn trong cuộc đấu tranh không ngừng để chinh phục vùng biên hoang dã, sử dụng sự kết hợp biến động giữa binh lính tinh nhuệ, lính đánh thuê bộ lạc và những tình nguyện viên cuồng tín."

  tradition_fp3_irrigation_experts_name: "Bậc Thầy Thủy Lợi"
  tradition_fp3_irrigation_experts_desc: "Nền văn hóa này là bậc thầy về công nghệ nước, và thông qua sự sáng tạo cùng nỗ lực cộng đồng, họ có thể khiến ngay cả những sa mạc khắc nghiệt nhất cũng nở hoa."

  tradition_fp3_beacon_of_learning_name: "Ngọn Hải Đăng Tri Thức"
  tradition_fp3_beacon_of_learning_desc: "Là điểm giao thoa của học thuật Hy Lạp, Ấn Độ và Ả Rập, nền văn hóa này tự hào về những tiến bộ khoa học của mình."
  culture_parameter_can_appoint_court_scholar:0 "Có thể bổ nhiệm [court_position|E] #high $court_scholar_court_position$#!"
  culture_parameter_guardian_education_better_outcomes: "[guardians|E] thuộc nền văn hóa này có nhiều khả năng mang lại [education_traits|E] tốt hơn cho [wards|E] của họ"

  tradition_fp3_jirga_name: "Jirga"
  tradition_fp3_jirga_desc: "Các trưởng lão và lãnh đạo của nền văn hóa này có thể tổ chức những hội nghị để giải quyết tranh chấp theo bộ luật bộ lạc cổ xưa của họ — và tôn lập các vị vua của vùng đất."

  tradition_fp3_pragmatic_creed_name: "Tín Điều Thực Dụng"
  tradition_fp3_pragmatic_creed_desc: "Các chiến binh của nền văn hóa này không bị ràng buộc bởi sự phô trương, và nhấn mạnh giá trị cũng như khả năng thích nghi của người lính bình thường thay vì tầng lớp kỵ binh tinh hoa truyền thống."

  tradition_fp3_fierce_independence_name: "Tinh Thần Độc Lập Mãnh Liệt"
  tradition_fp3_fierce_independence_desc: "Qua nhiều năm, vô số bạo chúa đã cố gắng chà đạp nền văn hóa này. Nhưng nhờ sự kiên cường và những chiến công quân sự, nó vẫn tồn tại."

