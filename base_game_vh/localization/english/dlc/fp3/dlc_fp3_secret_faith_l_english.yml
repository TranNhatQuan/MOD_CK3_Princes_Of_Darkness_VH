l_english: 

  secret_faith.1001.message: "Kết Nạp [guardian.GetSecretFaith.GetName]"
  child_secret_faith_conversion_success_effect.desc: "[child.GetFirstNameNoTooltip] đã tin tưởng"
  child_secret_faith_conversion_failure_effect.desc: "[child.GetFirstNameNoTooltip] còn nghi ngờ"
  child_secret_faith_conversion_critical_failure_effect.desc: "[child.GetFirstNameNoTooltip] tiết lộ bí mật của Ta"
  child_secret_faith_conversion_critical_failure_effect.liege.desc: "[child.GetFirstNameNoTooltip] tiết lộ người bảo hộ [guardian.GetSecretFaith.GetName]"

  secret_faith.1002.t: "Thời Đại Tri Thức"
  secret_faith.1002.desc: "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lơ lửng giữa tuổi thơ và trưởng thành. Ta đã dạy [child.GetHerHim] đủ để hiểu chân lý, và [child.GetSheHe] vẫn còn đủ trẻ để cởi mở tâm trí.\n\nNếu Ta muốn kết nạp [child.GetHerHim] vào phục vụ [ROOT.Char.GetSecretFaith.HighGodName], thì bây giờ là cơ hội duy nhất."
  secret_faith.1002.a: "[child.GetSheHe|U] xứng đáng biết sức mạnh của [ROOT.Char.GetSecretFaith.HighGodNameAlternatePossessive]."
  secret_faith.1002.b: "[child.GetFirstNameNoTooltip] là một trường hợp vô vọng."

  secret_faith.1003.t: "Tri Thức Bí Ẩn"
  secret_faith.1003.desc: "Có những điều [guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] đã kể cho Ta mà không ai khác nhắc tới. Chúng Ta chưa bao giờ đi sâu vào các chủ đề này, và Ta biết không nên hỏi thêm.\n\nTuy nhiên, tối nay, cảm giác giữa chúng Ta có gì đó khác lạ. Khi chúng Ta ngồi xuống đọc sách, [guardian.GetSheHe] hỏi Ta có điều gì muốn biết không..."
  secret_faith.1003.a: "Có, hãy kể tất cả cho Ta! Làm ơn!"
  secret_faith.1003.b: "Không, Ta không nghĩ vậy..."
  secret_faith.1003.c: "Đây là hành vi báng bổ!"
