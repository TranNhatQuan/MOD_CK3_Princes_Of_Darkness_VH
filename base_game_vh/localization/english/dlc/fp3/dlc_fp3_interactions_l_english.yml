  fp3_antagonize_character_interaction.success_notif.discovered: "[secondary_recipient.GetTitledFirstNameNoTooltip] biết rồi!"
  fp3_antagonize_character_interaction.success_notif.discovered.tooltip: "[secondary_recipient.GetTitledFirstName] lần theo tin đồn đến Ngài!"
  fp3_antagonize_character_interaction.success_notif.positive.desc: "Tin đồn tích cực về Ngài đã lan truyền, khiến [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] nghĩ tốt hơn về Ngài.\n"
  fp3_antagonize_character_interaction.success_notif.positive.desc.alt: "[actor.GetTitledFirstName] đã lan truyền những tin đồn tích cực về Ngài, khiến [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] nghĩ tốt hơn về Ngài.\n"
  fp3_antagonize_character_interaction.success_notif.negative.desc: "Tin đồn và lời nói dối không hay lan tràn, [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] đã tin và bắt đầu nghĩ xấu về Ngài!\n"
  fp3_antagonize_character_interaction.success_notif.negative.desc.alt: "[actor.GetTitledFirstName] đã lan truyền những lời dối trá quá đáng về Ngài, khiến [secondary_recipient.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] nghĩ xấu về Ngài!\n"
  fp3_antagonize_character_interaction.success_notif.negative.desc.alt.alt: "Tin đồn không bị truy đến Ngài..."
  fp3_antagonize_character_interaction.success_tooltip.positive: "Tin Ngài và #P được#! [opinion|E] của [secondary_recipient.GetTitledFirstName]"
  fp3_antagonize_character_interaction.success_tooltip.negative: "Tin Ngài và #N mất#! [opinion|E] của [secondary_recipient.GetTitledFirstName]"
  fp3_antagonize_character_interaction.success_tooltip.positive.past: "[recipient.GetTitledFirstName] #P đã tăng#! [opinion|E] về Ngài"
  fp3_antagonize_character_interaction.success_tooltip.negative.past: "[recipient.GetTitledFirstName] #N đã giảm#! [opinion|E] về Ngài"
  fp3_antagonize_character_interaction.recipient_message.fallback: "Ngài nên biết rằng [secondary_recipient.GetTitledFirstName] là một [secondary_recipient.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))] và nên được xem như vậy, Ngài có đồng ý không?"
  fp3_antagonize_character_interaction.recipient_message.01: "Ngài nên biết rằng chúa tể của Ngài, [secondary_recipient.GetTitledFirstName], đang âm mưu chống lại Ngài sau lưng. Hãy cẩn trọng với mối quan hệ với tên lừa đảo đó!"
  fp3_antagonize_character_interaction.recipient_message.02: "Ta có lý do tin rằng chúa tể của Ngài, [secondary_recipient.GetTitledFirstName], đang âm mưu giết Ngài! Hãy dè chừng [secondary_recipient.GetHerHim], dù họ có vẻ thân thiện đến đâu!"
  fp3_antagonize_character_interaction.recipient_message.03: "Tin đồn trong triều thần cho rằng chúa tể của Ngài, [secondary_recipient.GetTitledFirstName], đang theo dõi Ngài #italic rất sát#! mà Ngài không biết. Ta không rõ ý định của [secondary_recipient.GetHerHis], nhưng Ngài nên cẩn trọng với [secondary_recipient.GetHerHim]."
  fp3_antagonize_character_interaction.recipient_message.04: "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], đã hành xử ngớ ngẩn gần đây và làm xấu danh tiếng của nhà [recipient.GetHouse.GetBaseNameNoTooltip] trong mắt dân chúng."
  fp3_antagonize_character_interaction.recipient_message.05: "Ta nghĩ mình nên thông báo cho ngài biết rằng chúa tể của ngài, [secondary_recipient.GetTitledFirstName], bí mật chỉ là một con rối của các cận thần của [secondary_recipient.GetHerHis]! Mỗi lần [secondary_recipient.GetSheHe] phớt lờ lời khuyên của ngài, đó đều là mệnh lệnh từ lũ người hạ đẳng!"
  fp3_antagonize_character_interaction.recipient_message.06: "Ngài nên biết rằng [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], đang đặt những câu hỏi #italic nguy hiểm#! về nhà [recipient.GetHouse.GetBaseNameNoTooltip]... Hãy cẩn thận, nhưng đừng nói với ai rằng Ta đã báo cho Ngài!"
  fp3_antagonize_character_interaction.recipient_message.07: "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], đang cố làm xấu tên tuổi nhà [recipient.GetHouse.GetBaseNameNoTooltip] bằng cách nói sau lưng Ngài rằng Ngài đang trộm gia súc!"
  fp3_antagonize_character_interaction.recipient_message.08: "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], không ngừng gửi thư đến triều đình Ta tuyên bố sự 'vượt trội' của nhà [recipient.GetHouse.GetBaseNameNoTooltip]. Xin hãy làm gì đó!"
  fp3_antagonize_character_interaction.recipient_message.09: "[secondary_recipient.GetTitledFirstName] đã lan truyền tin đồn xấu về Ngài và khi bị bắt thì nói rằng 'chỉ là trò đùa'! Người lan truyền tin đồn thật tồi tệ và họ đã làm xấu tên tuổi của Ngài!"
  fp3_antagonize_character_interaction.recipient_message.10: "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], bị bắt quả tang ăn đồ rơi xuống đất như chó! Theo ý Ta, Ngài nên đối xử với họ như vậy!"
  fp3_antagonize_character_interaction.recipient_message.11: "Hãy biết rằng [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], gần đây đã đánh bại mười hai sát thủ có vũ khí một mình. [secondary_recipient.GetSheHe|U] không nói với ai về điều này — để không làm lo lắng triều đình, nhưng Ta muốn Ngài biết thành tích tuyệt vời này để công nhận [secondary_recipient.GetHerHis]!"
  fp3_antagonize_character_interaction.recipient_message.12: "Ngài thật may mắn khi có một [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] tốt như [secondary_recipient.GetTitledFirstName]. Ta nghe nói [secondary_recipient.GetSheHe] gần đây đã trả lại một số tiền vàng lớn cho một trong những chư hầu của [secondary_recipient.GetHerHis] sau khi nghe tin quản gia đã tính toán sai số tiền nợ!"
  fp3_antagonize_character_interaction.recipient_message.13: "Ngài có một [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] rất tốt. [secondary_recipient.GetTitledFirstName] gần đây gặp một thành viên khác của nhà [house|E] [secondary_recipient.GetHouse.GetBaseName] và giúp giải quyết tranh chấp, nếu sai sẽ làm xấu danh tiếng [secondary_recipient.GetFirstName]."
  fp3_antagonize_character_interaction.recipient_message.14: "[recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetTitledFirstName], thực sự khác biệt — chưa từng thấy ai sẵn sàng bảo vệ nhà [house|E] như [secondary_recipient.GetHerHim]. Ngài thật may mắn có [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] đáng tin cậy."
  fp3_antagonize_character_interaction.recipient_message.15: "[secondary_recipient.GetTitledFirstName] là người tuyệt vời, Ngài đã nghĩ đến việc đánh giá lại cách nhìn về [secondary_recipient.GetHerHim] chưa?"

