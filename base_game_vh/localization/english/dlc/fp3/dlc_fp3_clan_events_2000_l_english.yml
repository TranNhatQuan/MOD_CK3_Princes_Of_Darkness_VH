l_english: 
  clan_event.2000.t: "Học Việc Khi Đang Làm"
  clan_event.2000.desc: "Có vẻ như [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('improved_tax_collector'))] [improved_tax_collector.GetName] của ta gần đây đã làm việc đặc biệt tốt. Và vì vậy, một cơ hội đã xuất hiện, cho phép ta hướng dẫn và ảnh hưởng rất nhiều đến công việc của [improved_tax_collector.GetHerHis] trong tương lai gần.\n\nCó lẽ đây là cơ hội để [improved_tax_collector.GetHerHim] nâng cao hơn nữa các kỹ năng của mình?"
  clan_event.2000.a: "Hãy quan tâm đến nhu cầu của người dân."
  clan_event.2000.b: "Sắp xếp các cuộc tuần tra của lính gác. #EMP Như thế#! sẽ khiến các chư hầu vào khuôn khổ."
  clan_event.2000.c: "Ghi chép sổ sách và sắp xếp công việc cho gọn gàng."
  clan_event.2000.d: "Theo dõi các thần dân của ta. Quan sát kỹ sẽ học được nhiều điều."
  clan_event.2000.d.tt: "Nếu có bí mật chưa được biết đến, hãy khám phá một bí mật từ một chư hầu bị [improved_tax_collector.GetName] thu thuế"
  clan_event.2000.e1: "Dành thời gian cho việc nghiên cứu học thuật."
  clan_event.2000.e2: "Dành thời gian cho các vấn đề đức tin. Không ai vượt trên [ROOT.Char.GetFaith.HighGodName]."
  clan_event.2000.option_f: "Ngươi ở đây để thu thuế, đúng không? Vậy thì #EMP mang#! thuế về cho ta!"
  clan_event.2000.g: "Hãy nói tốt về ta trong các chuyến đi của ngươi."
  clan_event.2000.a.success: "[improved_tax_collector.GetNameNoTooltip] khiến các chư hầu hài lòng"
  clan_event.2000.b.success: "[improved_tax_collector.GetNameNoTooltip] khiến các chư hầu lo sợ"
  clan_event.2000.c.success: "[improved_tax_collector.GetNameNoTooltip] cải thiện việc thu thuế"
  clan_event.2000.d.success: "[improved_tax_collector.GetNameNoTooltip] phát hiện một bí mật"
  every_taxed_vassal_tt: "Mọi [taxpayer|E] được giao cho [tax_collector_name.GetName]"
 
  clan_event.2001.t: "Thu Thuế Mang Tính Giáo Dục"
  clan_event.2001.opening_desc: "[educational_tax_collector.GetName] dường như đã học hỏi được rất nhiều trong các nhiệm vụ với tư cách là người thu thuế. Điều này được thể hiện khá rõ ràng khi [educational_tax_collector.GetSheHe] giải trình về những nỗ lực gần đây nhất của mình.\n\n"
  clan_event.2001.education_diplomacy: ""... và ta đã giải quyết toàn bộ tình huống chỉ bằng lời nói! Nghệ thuật ngoại giao thật tuyệt vời.""
  clan_event.2001.education_martial: ""... nhưng ta đã tận dụng tốt những binh lính đi cùng, họ đảm bảo rằng chúng ta thu được từng đồng xu mà họ nợ ngài, thưa [ROOT.Char.GetLadyLord]!""
  clan_event.2001.education_stewardship: "... hóa ra ta #EMP thực sự#! biết ơn vì mình đã ghi chép sổ sách chi tiết như vậy. Từ giờ ta sẽ luôn mang theo các sổ cái."
  clan_event.2001.education_intrigue: ""... sau vài lời đe dọa kín đáo, họ cuối cùng cũng trả tiền và ta có thể rời đi. Nhưng ta tự hỏi liệu lần sau quay lại đó có phải cảnh giác hơn không...""
  clan_event.2001.education_learning: ""... rồi chúng ta rơi vào một cuộc tranh luận khá gay gắt. Dĩ nhiên, ta dùng logic vượt trội để thắng cuộc. Cuối cùng, họ thậm chí còn #EMP vui vẻ#! trả nốt những đồng xu cuối cùng!""
  clan_event.2001.a: "Thuế mang lại lợi ích cho cả hai chúng ta!"
  clan_event.2001.b: "Chắc hẳn ngươi có thể làm tốt hơn?"
  clan_event.2001.success: "Kỹ năng của [educational_tax_collector.GetNamePossessiveNoTooltip] tăng lên"
 
  clan_event.2002.t: "Người Thu Thuế Kiệt Sức"
  clan_event.2002.desc: "Đã muộn, nhưng ta có thể thấy một tia sáng phát ra từ căn phòng bên cạnh, nơi cánh cửa vẫn khép hờ. Ta nhẹ nhàng đẩy cửa và tìm thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('troubled_tax_collector'))] [troubled_tax_collector.GetName] của ta với đôi mắt nặng trĩu, cúi mình trên cuốn sổ cái đang mở. Một chồng sổ cái khác đứng cạnh [troubled_tax_collector.GetHerHim].\n\n[troubled_tax_collector.GetSheHe|U] ngẩng đầu lên và nhận thấy sự hiện diện của ta: \"Ôi, thứ lỗi cho ta, thưa [ROOT.Char.GetLadyLord], nhưng ta vẫn phải giải quyết những tài khoản thuế mới nhất này...\""
  clan_event.2002.a: "Để ta giúp một tay!"
  clan_event.2002.b: "Sao ngươi không nghỉ ngơi một chút?"
  clan_event.2002.c: "Tốt. Các chư hầu của ta #EMP mong đợi#! thuế được xử lý hiệu quả..."
 
  clan_event.2005.t: "Đề Nghị Người Thay Thế"
  clan_event.2005.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))] [loyal_vassal.GetName] của ta đã xuất hiện tại triều đình một cách bất ngờ, với một [tax_collector_replacement.GetWomanMan] theo sát phía sau.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại! Không khó để ta nhận thấy rằng người thu thuế [bad_tax_collector.GetName] của ngài, phải nói là, #EMP thiếu#! các kỹ năng cần thiết để thực hiện công việc của [bad_tax_collector.GetHerHis] một cách đầy đủ. Vì vậy, ta mang đến cho ngài một món quà.\"\n\n[loyal_vassal.GetFirstNameNoTooltip] ra hiệu cho người đồng hành của mình; \"[tax_collector_replacement.GetName] sẽ phục vụ ngài một cách đáng ngưỡng mộ.\""
  clan_event.2005.a: "Một món quà thật đáng trân trọng!"
  clan_event.2005.b: "Ngươi có thể giữ người hầu của mình. Lòng trung thành của ngươi là đủ."
  clan_event.2005.c: "[bad_tax_collector.GetNameNoTooltip] chỉ cần làm việc chăm chỉ hơn..."
 
  clan_event.2007.t: "Cuốn Sổ Cái Rắc Rối"
  clan_event.2007.desc: "Ta đã nhìn chằm chằm vào cuốn sổ cái ngu ngốc này hàng giờ rồi. Nó #EMP rõ ràng#! không khớp. Tuy nhiên, ta dường như không thể tìm ra vấn đề thực sự...\n\nTa đột nhiên nhận thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('helping_tax_collector'))] [helping_tax_collector.GetName] của ta nhìn qua vai, kiểm tra cuốn sổ cái trước mặt ta. [helping_tax_collector.GetSheHe|U] gõ ngón tay vào đầu trang.\n\n\"Ngài có thể muốn bắt đầu từ đó, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]\"."
  clan_event.2007.a: "Ờm... có lẽ ngươi có thể giúp ta chuyện này?"
  clan_event.2007.b: "Ta tự xử lý được, cảm ơn."
  clan_event.2007.c: "Ngươi vừa tình nguyện xử lý nó phải không? Cảm ơn!"
  clan_event.2007.success_tt: "Ngài giải quyết được sổ cái và tìm ra vấn đề"
  clan_event.2007.success: "Ngài đã sắp xếp thành công sổ cái"
  clan_event.2007.failure_tt: "Ngài không thể hiểu nổi nó"
  clan_event.2007.failure: "Cuốn sổ cái vẫn là một mớ hỗn độn"
  clan_event.2007.tt: "#weak [helping_tax_collector.GetName] phát hiện thêm những bất thường trong sổ cái, nơi một vài địa chủ nhỏ còn nợ thuế của Ngài.#!"
  clan_event.2007.successful_tax_collector: "[helping_tax_collector.GetName] thu được số thuế còn thiếu"
 
  fp3_efficient_tax_collector: "Người Thu Thuế Lão Luyện"
  fp3_efficient_tax_collector_desc: "Một người thu thuế trong chính quyền của nhân vật này đặc biệt có năng lực, không bỏ sót bất kỳ nguồn tiền nào."
 
  fp3_outrageous_tax_collection_opinion: "Phẫn nộ vì thuế"
  fp3_diplomatic_tax_collection_opinion: "Hài lòng với [tax_collector|E]"
  fp3_thankful_tax_collector_opinion: "Biết ơn"
