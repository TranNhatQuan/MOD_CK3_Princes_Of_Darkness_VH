l_english: 
 ##################################################
 # IRANIAN INTERMEZZO FRONTIER FLAVOR EVENTS 
 ##################################################

  fp3_yearly.2000.t: "Người Kiểm Soát Ban Ngày"
  fp3_yearly.2000.desc_drinking: "Suốt đêm Ta đã uống rượu với các chư hầu và Ngài đồng hành. Khi Ta thưởng thức ngụm cuối cùng của buổi sáng,"
  fp3_yearly.2000.desc_hashish: "Suốt đêm Ta đã chia sẻ cần sa với các chư hầu và Ngài đồng hành cho đến khi mặt trời mọc. Khi Ta lén lấy chiếc bánh cần sa cuối cùng,"
  fp3_yearly.2000.desc_warning: "[cautious_vassal.GetTitledFirstName] kéo Ta sang một bên khi Ta còn lâng lâng:\n\n\"Nếu [prudish_liege.GetTitledFirstNamePossessive] #italic muhtasib#! thấy ngươi như thế trong chợ, [prudish_liege.GetSheHe] sẽ bắt và đánh roi ngươi. Nghỉ trong nhà cho đến khi cầu #italic dhuhr#! buổi chiều rồi hãy đi khi tỉnh táo.\""
  fp3_yearly.2000.a: "Vâng, ngươi nói đúng."
  fp3_yearly.2000.b: "[prudish_liege.GetTitleAsNameNoTooltip] sẽ không bao giờ bắt ta!"
  fp3_yearly.2000.b_flavor: "Ta tin rằng [prudish_liege.GetTitledFirstName] sẽ không cố tình hại Ta nhân danh luật [prudish_liege.GetFaith.GetAdjective]."
  fp3_yearly.2000.b_success: "Ta trở về nhà an toàn"
  fp3_yearly.2000.b_failure: "[prudish_liege.GetTitledFirstNamePossessiveNoTooltip|U] #italic muhtasib#! bắt và đánh Ta"

  fp3_yearly.2001.t: "Say Xỉn Nơi Công Cộng"
  fp3_yearly.2001.desc_intro: "Người #italic muhtasib#! của Ta báo rằng [intoxicated.Custom2('MyCharacterIntroduction', ROOT.Char)] đang lang thang trong chợ,"
  fp3_yearly.2001.desc_drinking: "loạng choạng và líu lưỡi khi nói năng,"
  fp3_yearly.2001.desc_hashish: "cười khúc khích và ngước nhìn mây trời"
  fp3_yearly.2001.desc_outro: "dù ban ngày!\n\nHình phạt thông thường cho hành vi bừa bãi này là bắt và đánh kẻ tín đồ lạc đường này."
  fp3_yearly.2001.a: "Tha roi..."
  fp3_yearly.2001.b: "[ROOT.Char.GetFaith.HighGodName] sẽ tha thứ lần này."

  fp3_yearly.2010.t: "Cân Lúa"
  fp3_yearly.2010.desc: "Không có tin hạn hán hay nạn đói, nhưng dân [bakers_county.GetNameNoTier] vẫn than phiền rằng bánh mì trở nên quá đắt.\n\n\"Đó là do thợ bánh hoàng gia của ngài, [greedy_baker.GetFirstName],\" [random_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] nói với Ta. \"[greedy_baker.GetSheHe|U] đã mua tất cả lúa mì và bột vào thành phố và không cho chúng Ta mua một #italic maund#! nào cả.\""
  fp3_yearly.2010.a: "[greedy_baker.GetSheHe|U] sẽ bị dẫm dưới chân"
  fp3_yearly.2010.a.tt: "[greedy_baker.GetFirstName] bị giẫm và chúng ta bù đắp lượng lúa thiếu để làm vừa lòng dân"
  fp3_yearly.2010.a_elephants: "voi!"
  fp3_yearly.2010.a_camels: "lạc đà!"
  fp3_yearly.2010.a_horses: "ngựa!"
  fp3_yearly.2010.b: "Thật thú vị, Ta nên giữ [greedy_baker.GetHerHim] gần bên."
  fp3_yearly.2010.c: "Tội ác thật sự là giấu những khoản lợi nhuận này khỏi Ta."

  fp3_yearly.2020.t: "Điều Chỉnh Cân"
  fp3_yearly.2020.desc_intro: "Người thu thuế của Ta, [sinful_tax_collector.GetTitledFirstName], còn xa mới phải là một [sinful_tax_collector.GetWomanMan] đức hạnh."
  fp3_yearly.2020.desc_greedy: "Tình yêu của [sinful_tax_collector.GetHerHis|U] dành cho vàng chỉ tương xứng với tình yêu của chính cuộc sống của [sinful_tax_collector.GetHerHis]; [sinful_tax_collector.GetSheHe] sẽ làm bất cứ điều gì để thu thêm dù chỉ một đồng bạc hơn mức nợ."
  fp3_yearly.2020.desc_arbitrary: "[sinful_tax_collector.GetSheHe|U] không có tình yêu với công lý; [sinful_tax_collector.GetSheHe] thu thuế theo ý thích của [sinful_tax_collector.GetHerHis] và sẽ phớt lờ bất kỳ quy định nào mà [sinful_tax_collector.GetSheHe] thấy phiền phức."
  fp3_yearly.2020.desc_cynical: "[sinful_tax_collector.GetSheHe] ít quan tâm tôn giáo và không yêu mến [ROOT.Char.GetFaith.HighGodName]; [sinful_tax_collector.GetSheHe] ngủ quên lúc cầu sáng và ăn trộm thức ăn suốt Ramadan."
  fp3_yearly.2020.desc_contrite: "[sinful_tax_collector.GetSheHe] không đáng tin về bí mật; sẽ chia sẻ tài chính của bất cứ ai; không gì đến tai chúa tể mà không đến với chín người khác."
  fp3_yearly.2020.desc_outro: "\n\nLàm sao một [sinful_tax_collector.GetWomanMan] như vậy được giao tài chính của vương quốc – và của Ta?"
  fp3_yearly.2020.a: "[liege.GetTitledFirstNameNoTooltip] phải trả lời về tội lỗi của [sinful_tax_collector.GetTitledFirstNamePossessiveNoTooltip]."
  fp3_yearly.2020.a_success: "[sinful_tax_collector.GetTitledFirstNameNoTooltip] bị sa thải khỏi vị trí của [sinful_tax_collector.GetHerHis]"
  fp3_yearly.2020.a_failure: "Phản đối của Ta không được nghe"
  fp3_yearly.2020.a_failure.tt: "[sinful_tax_collector.GetTitledFirstNameNoTooltip] có thể gây rắc rối cho Ta."
  fp3_yearly.2020.b: "Ta phải lên án [sinful_tax_collector.GetTitledFirstNameNoTooltip] vì lợi ích vương quốc."
  fp3_yearly.2020.b.t: "Lên án Người Thu Thuế"
  fp3_yearly.2020.b.desc: "Điều này xảy ra vì chư hầu [denouncing_taxpayer.GetShortUIName] đã lên án tội lỗi của [sinful_tax_collector.GetShortUIName]."
  fp3_yearly.2020.c: "Ta sẽ cầu nguyện cho [sinful_tax_collector.GetHerHim]."

  fp3_yearly.2021.desc_intro: "Dù [sinful_tax_collector.GetTitledFirstName] có năng lực, [denouncing_taxpayer.GetName] đã trình bày nghi ngại rõ rệt.\n\n"
  fp3_yearly.2021.desc_greedy: "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] hoàn toàn ích kỷ, ham tiền hơn công lý. [sinful_tax_collector.GetSheHe|U] thường thu nhiều hơn mức cần và không đóng gì cho thuế từ thiện.\""
  fp3_yearly.2021.desc_arbitrary: "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] hiếm khi tuân theo bất kỳ luật lệ hay quy định nào, thay vào đó thu thuế dựa trên ý thích của [sinful_tax_collector.GetHerHis]. Những người nông dân thường xuyên bị quấy rầy bởi sự thu thuế không nhất quán của [sinful_tax_collector.GetHerHis].\""
  fp3_yearly.2021.desc_cynical: "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] không sợ [ROOT.Char.GetFaith.HighGodName], thường xuyên ngủ quên trong giờ cầu nguyện buổi sáng và ăn vụng trong tháng Ramadan. Tất cả chúng ta đều sợ sự công lý của [ROOT.Char.GetFaith.HighGodNamePossessive] đối với [sinful_tax_collector.GetHerHis].\""
  fp3_yearly.2021.desc_contrite: "\"[sinful_tax_collector.GetTitledFirstNameNoTooltip] không thể tin tưởng được về sự kín đáo; [sinful_tax_collector.GetSheHe] sẽ chia sẻ tài chính của vương quốc với bất kỳ ai chịu lắng nghe. Chỉ là vấn đề thời gian cho đến khi thông tin này lọt vào tay kẻ thù.\""
  fp3_yearly.2021.desc_outro: "\n\n[denouncing_taxpayer.GetTitledFirstNameNoTooltip] [denouncing_taxpayer.Custom('quirk_pos_present')], rõ ràng mong Ta sa thải [sinful_tax_collector.GetTitledFirstNameNoTooltip] vì lỗi này."
  fp3_yearly.2021.a: "[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] sẽ bị sa thải, inshallah."
  fp3_yearly.2021.b: "Ta sẽ ghi nhớ lời ngươi."

  fp3_yearly.2030.t: "Một Triều Đại Đẹp"
  fp3_yearly.2030.desc_intro: "Khi nhìn mình trong gương, đặt trên"
  fp3_yearly.2030.desc_beauty_bad: "vẻ xấu kinh khủng,"
  fp3_yearly.2030.desc_spindly: "chiều dài mảnh mai, xương lồi,"
  fp3_yearly.2030.desc_disfigured: "khuôn mặt biến dạng sau mặt nạ,"
  fp3_yearly.2030.desc_scaly: "da sần, ngứa,"
  fp3_yearly.2030.desc_albino: "da trắng bạch và mắt quỷ,"
  fp3_yearly.2030.desc_hunchbacked: "lồi xấu,"
  fp3_yearly.2030.desc_inbred: "thân hình cong vẹo,"
  fp3_yearly.2030.desc_outro: "Ta lo rằng dân chúng sẽ ghét ta vì vẻ ngoài khó chịu của mình. Chính lúc đó [reassuring_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] truyền lại trí tuệ của [reassuring_courtier.GetHerHis] cho ta:\n\n\"Nếu ngài chỉ coi vàng là kẻ thù của mình, thì tất cả [ROOT.Char.GetWomenMen] sẽ coi ngài là bạn.\""
  fp3_yearly.2030.a: "Vậy hãy để ta làm Ngài với toàn vương quốc."
  fp3_yearly.2030.b: "Cảm ơn, [reassuring_courtier.GetNameNoTooltip]."
  fp3_yearly.2030.c: "Sợ hãi, không phải yêu thương, sẽ mua lòng trung thành của họ."
  fp3_yearly.2030.d: "Thời gian sẽ cho họ hiểu Ta."

  fp3_yearly.2040.t: "Chỉ Huy Tín Đồ"
  fp3_yearly.2040.desc_attacker_is_muslim: "Ai chống lại Ta là chống lại chính Tiên Tri, nhưng [infidel.Custom2('InsultNoun', ROOT.Char)] [infidel.GetTitledFirstName] dám tuyên chiến với Ta.\n\nKhông phải ai cũng vô đạo; nếu Ta đứng trước quân [infidel.GetTitledFirstNameNoTooltip] và nhắc họ quyền lực Ta từ Tiên Tri, chắc chắn một số sẽ chịu lui."
  fp3_yearly.2040.desc_attacker_is_not_muslim: "Không biết lời Tiên Tri, [infidel.Custom2('InsultNoun', ROOT.Char)] [infidel.GetTitledFirstName] tuyên chiến và muốn phá vỡ triều đại thần thánh của Ta.\n\nKhông phải ai cũng vô đạo; có người trong đất của [infidel.GetTitledFirstNamePossessiveNoTooltip] tuân lời [caliph.GetFaith.HighGodName]. Nếu Ta nhắc quyền lực Ta từ Tiên Tri, chắc chắn họ sẽ lui."
  fp3_yearly.2040.a: "Sứ Giả sẽ dẫn đường cho ta!"
  fp3_yearly.2040.a.flavor: "Sùng đạo và hiểu biết [caliph.GetFaith.ReligiousText] sẽ dẫn lời Ta."
  fp3_yearly.2040.a_success: "Quân lính tuân lệnh"
  fp3_yearly.2040.a_failure: "Quân lính chế giễu và đánh Ngài"
  fp3_yearly.2040.b: "Sứ Giả sẽ dẫn [imam.GetTitledFirstName]."
  fp3_yearly.2040.b.flavor: "[imam.GetTitledFirstNameNoTooltip] am hiểu tôn giáo hơn ta."
  fp3_yearly.2040.b_success: "Quân lính tôn trọng [imam.Custom('MyPriestTitle')] của Ngài"
  fp3_yearly.2040.b_failure: "Quân lính chém [imam.Custom('MyPriestTitle')] của Ngài"
  fp3_yearly.2040.c: "Không, quá nguy hiểm."

  fp3_yearly.2041.desc_cynical: "[caliph.GetTitledFirstName|U] đã ra lệnh rằng những binh lính [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] của ta phải hạ vũ khí với lý do [caliph.GetSheHe] là người kế vị hợp pháp của Tiên Tri, và họ đã tuân theo [caliph.GetHerHim]!\n\nAi quan tâm đến việc liệu [caliph.GetSheHe] có phải là người kế vị của chính cái mông của [caliph.GetHerHis] hay không? Điều đó sẽ không ngăn cản ta đặt chân vào nó."
  fp3_yearly.2041.desc_fallback: "Chính ta biết rằng cuộc chiến của ta chống lại [caliph.GetName] được [ROOT.Char.GetFaith.HighGodName] chấp thuận. Tuy nhiên, tên [caliph.Custom2('InsultNoun', ROOT.Char)] đó đã thuyết phục được binh lính [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] của ta rằng, vì [caliph.GetSheHe] là người kế vị của Tiên Tri, họ phải hạ vũ khí và trở về nhà.\n\nNhiều binh lính của ta đã tuân theo, và giờ ta phải đối mặt với hậu quả của một đội quân tận tụy nhưng nhỏ bé..."
  fp3_yearly.2041.a: "Nguyền rủa [caliph.Custom2('InsultNoun', ROOT.Char)]!"

  fp3_yearly.2050.t: "Các Liên Đoàn Futuwaa"
  fp3_yearly.2060.t_madrasas: "Các Trường Học"
  fp3_yearly.2060.t_houses_of_worship: "Giáo Dục Trong [ROOT.Char.GetFaith.HouseOfWorshipPlural|U]"
 
 #Ghazi Gone Bad, by Ola Jentzsch 
  fp3_yearly.8000.t: "Ghazi Sa Nguy"
  fp3_yearly_non_islamic.t: "Chiến Binh Biên Cương?"
  fp3_yearly.8000.desc_opening: "[raging_ghazi.GetFirstName] là một trong số nhiều #italic ghazi tự xưng#! tiến về biên cương để chiến đấu với những kẻ ngoại đạo,"
  fp3_yearly.8000.desc_unislamic_opening: "[raging_ghazi.GetFirstName] là một #italic chiến binh tự xưng của [ROOT.Char.GetFaith.WarGodName]#! tiến về biên cương để chiến đấu với những kẻ man rợ,"
  fp3_yearly.8000_dancing_girl.desc: "khi [raging_ghazi.GetSheHe] tình cờ say rượu ở thị trấn [murder_barony.GetNameNoTier]. Trong trạng thái rất say xỉn, [raging_ghazi.GetSheHe] đã xảy ra cãi vã và đánh chết chủ quán trọ, một vũ nữ, cùng chú khỉ cưng của cô ấy.\n\n"
  fp3_yearly.8000_bath_inspector.desc: "khi [raging_ghazi.GetSheHe] tình cờ đi ăn chơi với các kỹ nữ và kẻ gian ở thị trấn [murder_barony.GetNameNoTier]. Trong nhóm người tai tiếng đó, [raging_ghazi.GetSheHe] xảy ra cãi vã với một lính canh và một thanh tra tắm, và đâm chết cả hai.\n\n"
  fp3_yearly.8000_townsfolk.desc: "khi [raging_ghazi.GetSheHe] tình cờ bị lừa và cướp bởi một vài kẻ lừa đảo gợi cảm ở thị trấn [murder_barony.GetNameNoTier]. [raging_ghazi.GetSheHe|U] đã trút cơn giận của mình lên khu chợ địa phương, đánh chết một người bán trà và một con lừa bằng một chiếc ghế đệm chân.\n\n\""
  fp3_yearly.8000.desc: "\"[raging_ghazi.GetWomanMan] này phải bị trừng phạt nghiêm khắc\", [righteous_marshal.GetCouncilTitle] chính trực [righteous_marshal.GetFirstName] nói, \"để làm vừa lòng người dân tốt bụng ở [murder_barony.GetNameNoTierNoTooltip].\"\n\n\"Không\", [raging_ghazi.GetFirstNameNoTooltip] van xin, treo trên xích trong ngục, \"ngài phải cho Ta đi tới biên cương, vì đó là mục đích của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive].\""
  fp3_yearly.8000.a: "Ta cũng đã đi trên con đường thánh - hãy đi bình an."
  fp3_yearly.8000.b: "Ta có một phòng giam mới tuyệt vời, dành riêng cho ngươi!"
  fp3_yearly.8000.c: "Ta có thể dùng một người có tài năng như ngươi..."
  fp3_yearly.8000.flavor.a.tt: "Ngài cho phép [raging_ghazi.GetFirstNameNoTooltip] tiếp tục hành trình tìm kiếm sự tử vì đạo của [raging_ghazi.GetHerHis]."
  fp3_yearly.8000.flavor.b.tt: "Điều này sẽ làm vừa lòng dân chúng."

 #Frontier Fortress Benefactor, by Ola Jentzsch 
  fp3_yearly.8001.t: "Nhà Hảo Tâm Biên Cương"
  fp3_yearly.8001.desc: "[concerned_councillor.GetCouncilTitle] [concerned_councillor.GetFirstName] cảnh giác gần đây lo lắng về tình trạng phòng thủ biên cương của chúng ta.\n\n\"Ngài phải ngay lập tức thăm các pháo đài ở [frontier_fort_county.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Điều này sẽ nâng cao tinh thần binh sĩ của ngài, những người đang khá chán nản.\"\n\n[concerned_councillor.GetSheHe|U] ngập ngừng. \"Nhưng ta nên nói rằng có tin đồn, hoàn toàn vô căn cứ, về một đợt dịch nhỏ...\""
  fp3_yearly.8001.a: "Rất tốt, ta sẽ đi."
  fp3_yearly.8001.b: "[dutiful_spouse.GetWifeHusband] ta, [dutiful_spouse.GetFirstName], cần thêm nhiệm vụ, [dutiful_spouse.GetSheHe] có thể đi."
  fp3_yearly.8001.c: "Ta sẽ đi... vài ngày nữa..."
  fp3_yearly.8001.d: "Biên cương là dành cho binh sĩ và người định cư, không phải ta."
  convincing_councillor_toast.success: "[concerned_councillor.GetFirstName] tin tưởng ngươi"
  convincing_councillor_toast.failure: "[concerned_councillor.GetFirstName] nghĩ ngươi coi [concerned_councillor.GetHerHim] là kẻ ngốc"
  delegated_fortress_inspection_toast.success: "[dutiful_spouse.GetFirstName] gây ấn tượng tốt với binh sĩ"
  delegated_fortress_inspection_toast.failure: "[dutiful_spouse.GetFirstName] thất bại trong việc khích lệ binh sĩ"
  fp3_yearly.8001.flavor.b.tt: "[concerned_councillor.GetFirstNameNoTooltip] không tán thành [dutiful_spouse.GetWomenMen] trong vai trò quân sự."
  fp3_yearly.8001.flavor.c.tt: "Ngươi thực sự không có ý định."

 #Faith at the Frontier, by Ola Jentzsch 
  fp3_yearly.8002.t: "Đức Tin Biên Cương"
  fp3_yearly.8002.desc: "[concerned_person.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_person'))], đã nhận được tin lo lắng về binh sĩ trấn giữ pháo đài ở [frontier_fort_county.GetName].\n\n\"Họ âm thầm theo tà đạo ghê tởm của [regional_heresy.GetName]\", [concerned_person.GetSheHe] run rẩy nói với ta. \"Dù ta không biết lãnh đạo của họ là ai, nhưng nếu không làm gì, họ có thể sớm cầm vũ khí #italic ngươi#! đã trả tiền và tìm cách lật đổ ngươi.\""
  fp3_yearly.8002.a: "Ta sẽ thiêu sạch họ và rắc muối lên đất."
  fp3_yearly.8002.b: "[regional_heresy.GetNameNoTooltip] à? Nghe thú vị đấy..."
  fp3_yearly.8002.c: "Vì ngươi quá lo lắng, #italic ngươi#! có thể đi và cải hóa họ."
  fp3_yearly.8002.d: "Chúng ta nên chờ xem tình hình phát triển thế nào."
  dealing_with_soldier_heresy_toast.success: "[concerned_person.GetNameNoTooltip] đã đưa những kẻ dị giáo trở lại giáo lý chính thống."
  dealing_with_soldier_heresy_toast.failure: "[concerned_person.GetNameNoTooltip] thất bại trong việc thuyết phục binh sĩ."
