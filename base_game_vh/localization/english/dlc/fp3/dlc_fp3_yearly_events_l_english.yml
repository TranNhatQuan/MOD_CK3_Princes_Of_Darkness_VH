 #Exotic Espand, by Ola Jentzsch
  fp3_yearly.8003.t: "Espand Kỳ Lạ"
  fp3_yearly.8003.desc: "[superstitious_consort.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_consort'))] của ta, có thói quen đốt hạt #italic espand#! để xua đuổi các thế lực tà ác. Nhưng giờ đây [superstitious_consort.GetSheHe] khẳng định rằng [cruel_consort.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cruel_consort'))] của ta, đã nguyền rủa [superstitious_consort.GetHerHim] bằng Ánh mắt Ác độc (Evil Eye) và lấy trộm nguồn cung cấp espand của [superstitious_consort.GetHerHis]. [cruel_consort.GetFirstNameNoTooltip], tất nhiên, phủ nhận mọi sự hiểu biết về vấn đề này. Nhưng [superstitious_consort.GetFirstNameNoTooltip] có vẻ hoàn toàn tập trung vào việc thu thập espand mới, để giải trừ cho [superstitious_consort.GetHerselfHimself] khỏi lời nguyền này.\n\n\"Xin ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]\", [superstitious_consort.GetSheHe] cầu xin, \"Một vị Magi đã kể cho ta nghe về một ngọn núi thiêng ở [espad_mountain_province.GetName], chỉ ở đó hoa espand tốt nhất mới nở. Ngài phải gửi người đi lấy chúng, vì ta.\""
  fp3_yearly.8003.a: "Hãy đặt niềm tin vào [ROOT.Char.GetFaith.HighGodNameAlternate], không phải mê tín vớ vẩn."
  fp3_yearly.8003.b: "Ta sẽ gửi những trinh sát giỏi nhất mà vàng có thể mua."
  fp3_yearly.8003.c: "Ta sẽ cử [quest_chaplain.GetCouncilTitle] [quest_chaplain.GetFirstName] đi lấy cho ngươi."
  fp3_yearly.8003.d: "Ngươi không thể hái espand bình thường như mọi người sao?"
  questing_for_espand_toast.success: "[quest_chaplain.GetFirstName] đã mang về những hạt espand tốt nhất."
  questing_for_espand_toast.failure: "[quest_chaplain.GetFirstName] trở về tay trắng."
  fp3_espand_found.tt: "[quest_chaplain.GetFirstNameNoTooltip] tìm thấy thảo dược espand thiêng"
  fp3_espand_unfound.tt: "[quest_chaplain.GetFirstNameNoTooltip] thất bại trong nhiệm vụ của [quest_chaplain.GetHerHis]"
  fp3_closer_to_love.tt: "Ngươi và [superstitious_consort.GetFirstNameNoTooltip] trở nên thân thiết hơn"

####The Frontiers' Call, by Ola Jentzsch####
  fp3_yearly.8004.t: "Tiếng Gọi Biên Cương"
  fp3_yearly.8004.desc: "Với một số người sống ở những thành phố tráng lệ của xứ này, gió rít từ các thảo nguyên phương Bắc vẫn vang vọng trong tim họ. Dù tốt hay xấu, [fp3_child_to_leave.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))], đã bắt đầu cảm nhận tiếng gọi này.\n\n\"[parent.GetMotherFather|U], ngài phải để con đi. Con muốn rèn trí óc và kiếm thuật nơi biên cương hoang dã, đi theo đoàn lữ hành và dân núi, và có thể còn tìm được ngọn núi #italic Hara Berezaiti#! huyền thoại.\"\n\nNhưng [worried_relation.GetFirstName] thương [fp3_child_to_leave.GetFirstNameNoTooltip] rất nhiều và cầu xin ta từ chối yêu cầu của [fp3_child_to_leave.GetHerHis]."
  fp3_yearly.8004.a: "Rút kiếm, kẻ bất hạnh! "
  fp3_yearly.8004.b: "Ngươi sẽ không ở lại vì [worried_relation.GetFirstNamePossessiveNoTooltip] sao?"
  fp3_yearly.8004.c: "Nếu rời đi, ngươi không phải [fp3_child_to_leave.Custom('GetDaughterSon')] của ta."
  fp3_yearly.8004.d: "Ta cũng đã cảm nhận tiếng gọi đó. Ngươi nên đi, [fp3_child_to_leave.Custom('GetDaughterSon')] của ta."
  fp3_yearly.8004.c.flavor: "Ngươi sẽ tước quyền thừa kế của [fp3_child_to_leave.GetFirstNameNoTooltip] nếu [fp3_child_to_leave.GetSheHe] rời đi."
  fp3_yearly.8004.a.tt: "#V Đấu tay đôi#! với [fp3_child_to_leave.GetFirstName] để bắt [fp3_child_to_leave.GetHerHim] ở lại!\n#weak Cuộc đấu này KHÔNG tử chiến.#!\nNếu ngài thắng, ngài sẽ nhận [prestige_i] [prestige|E]\n\n[prowess|E] của ngài: [prowess_i]#V [parent.GetProwess]#!\n[prowess|E] của [fp3_child_to_leave.GetFirstNamePossessive]: [prowess_i]#V [fp3_child_to_leave.GetProwess]#!"
  fp3_yearly.8004.b.success: "[fp3_child_to_leave.GetFirstNameNoTooltip] từ bỏ ước mơ phiêu lưu của [fp3_child_to_leave.GetHerHis]"
  fp3_yearly.8004.b.failure: "[fp3_child_to_leave.GetFirstNameNoTooltip] vẫn quyết tâm rời đi"
  fp3_yearly.8007.t: "Nuôi Dạy Con Theo [ROOT.Char.GetCulture.GetName]"
  fp3_yearly.8007.desc: "\"Ta đầu hàng! Ta đầu hàng, [parent.GetMotherFather]! Không thêm nữa!\" [fp3_child_to_leave.Custom('GetDaughterSon')] của ta rút lui.\n\n\"Nếu đây là điều ngươi muốn ta ở lại, ta sẽ ở lại. Ta sẽ là [fp3_child_to_leave.Custom('GetDaughterSon')] ngoan ngoãn mà ngươi mong muốn. [ROOT.Char.GetFaith.HighGodNameAlternate] sẽ phán xét ngươi cuối cùng.\""
  fp3_yearly.8007.a: "Ta sẽ không làm phụ lòng."
  fp3_yearly.8007.b: "Tốt. Ta có #italic trách nhiệm thật#! dành cho ngươi."
  fp3_yearly.8007.c: "Và bây giờ ngươi phải kết hôn!"
  fp3_yearly.8008.t: "Một Thất Bại Nhục Nhã"
  fp3_yearly.8008.desc: "Ta loạng choạng lùi lại, máu me và kiệt sức, khi [fp3_child_to_leave.GetFirstNameNoTooltip] tiến tới với vũ khí trên tay.\n\n\"Ta đã nói với ngươi rồi, [parent.GetMotherFather], ta #italic sẽ#! đi. Ta sẽ đến biên cương, theo trái tim mong muốn, xa dọc Con Đường Tơ Lụa, và #italic ngươi#! sẽ trả giá.\" \n\nTa không thể làm gì ngoài việc nhìn [fp3_child_to_leave.Custom('GetDaughterSon')] rời đi, đầu ngẩng cao, mang theo một túi vàng Kushan và Sasanian từ kho bạc của ta."
  fp3_yearly.8008.a: "Ta có thể mất [fp3_child_to_leave.Custom('GetDaughterSon')], nhưng cả vàng nữa sao?"
  fp3_yearly.8008.b: "Thà là làm thái giám còn hơn..."
  fp3_yearly.8008.c: "Định mệnh sẽ đưa ngươi trở về với ta, ngươi sẽ thấy..."

  fp3_yearly.8009.t: "Mối Lo Đức Tin [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
  fp3_yearly.8009.desc_beginning: "Biên Cương Phương Đông từ lâu là nơi ẩn náu của kẻ ngoại đạo và các giáo phái lạ. Nhưng ở [caliphal_location.GetName], [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] ngày càng lo lắng về điều này.\n\n\"Chúng ta nghe nói về [very_heretic_county.GetCountyData.GetFaith.GetAdherentNamePlural] ở [very_heretic_county.GetName], thực hành các nghi lễ kỳ quái.\" Sứ giả [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip] [hof_emissary.GetName] ngập ngừng, như gom dũng khí, trước khi [hof_emissary.GetSheHe] tiếp tục bằng giọng nhỏ, bị sốc. \"Một số còn nói, về các nghi lễ #italic nhục dục#!. Đủ rồi.\""
  fp3_yearly.8009.desc_muslim_or_jewish_insult_ending: "[righteous_caliph.GetTitleTierName] muốn ngươi trừng phạt những Bạn ta."
  fp3_yearly.8009.desc_other_insult_ending: "[righteous_caliph.GetTitleTierName] muốn ngươi trừng phạt những kẻ báng bổ bẩn thỉu này."
  fp3_yearly.8009.qurans.flavor: "Ngươi bảo trợ các bản sao của [righteous_caliph.GetFaith.ReligiousText] bằng [righteous_caliph.GetCulture.GetLanguage.GetNameNoTooltip]."
  fp3_yearly.8009.a: "Ta sẽ làm gương cho họ."
  fp3_yearly.8009.b: "Kinh văn bằng ngôn ngữ thích hợp sẽ chỉ đường cho họ."
  fp3_yearly.8009.c: "[loyal_chaplain.GetCouncilTitle], [loyal_chaplain.GetFirstNameNoTooltip] sẽ giảng đạo cho họ."
  fp3_yearly.8009.d: "Chà, ta còn nhiều vấn đề cấp bách hơn."
  cultural_acceptance_gain_arabic_books: "Sản xuất sách bằng tiếng Ả Rập"
  dealing_with_frontier_heresy_toast.success: "Nhiệm vụ của [loyal_chaplain.GetTitledFirstNameNoTooltip] đạt một số thành công"
  dealing_with_frontier_heresy_toast.failure: "[concerned_person.GetTitledFirstNameNoTooltip] thất bại trong việc thuyết phục ai"
  fp3_county_listened.tt: "Một số dân địa phương trở lại đức tin chân chính"
  fp3_county_unfazed.tt: "Người dân địa phương vẫn bình thản"
  fp3_gross_persecutions_toast: "Những kẻ dị giáo bị tan rã"
  fp3_galvanized_heretics_toast: "Những kẻ dị giáo được kích động"

  fp3_yearly.8010.t: "Nơi Ở Của Chiến Tranh"
  fp3_yearly.8010.desc_muslim: "Các học giả Lưỡng Hà đã chia thế giới thành ba phần. Họ nói về #italic Dar al-Tawhid#! của những người trung thành, và #italic Dar al-'Ahd#! của các đồng minh, nhưng cũng về #italic Dar al-Harb#!, biên cương, Nơi Ở Của Chiến Tranh. [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] rất tin tưởng vào thế giới quan này và luôn lo lắng về mối đe dọa từ phương Đông.\n\n\"Nhiệm vụ của ngươi như một [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] là đưa biên cương ngoại giáo vào tầm giám sát của chúng ta\", [righteous_caliph.GetSheHe] nói với Ta. \"Chúng ta đã chịu đựng quá lâu các hành vi thờ ngẫu tượng của [pagan_ruler.GetTitledFirstName]. Ta sẽ gửi cho ngươi những quân #italic ghazi#! trung thành và lính đánh thuê Thổ Nhĩ Kỳ, để ngươi giải phóng [pagan_county.GetNameNoTier] khỏi sự cai trị của [pagan_ruler.GetHerHis].\""
  fp3_yearly.8010.desc_not_muslim: "[righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] tin rằng thế giới là cuộc đấu tranh vô tận giữa văn minh và man rợ, và luôn lo lắng về những kẻ thù vô đạo đang rình rập ở phương Đông hoang dã.\n\n\"Nhiệm vụ của ngươi như một [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]\", [righteous_caliph.GetSheHe] nói với Ta, \"là đưa biên cương ngoại giáo vào tầm giám sát của chúng ta. Chúng ta đã chịu đựng quá lâu các hành vi thờ ngẫu tượng của [pagan_ruler.GetTitledFirstName]. Ta sẽ gửi cho ngươi những quân #italic ghazi#! trung thành và lính đánh thuê Thổ Nhĩ Kỳ, để ngươi giải phóng [pagan_county.GetNameNoTier] khỏi sự cai trị của [pagan_ruler.GetHerHis].\""
  fp3_yearly.8010.a: "Ta sẽ tấn công [pagan_ruler.GetHerHim] ngay lập tức!"
  fp3_yearly.8010_warmonger.tt: "Ngươi sẽ phải chiếm [pagan_county.GetNameNoTier] trong #bold năm năm#!."
  fp3_yearly.8010.b: "Giúp ta tài trợ cuộc chiến này, và ta sẽ bắt đầu."
  fp3_yearly.8010.c: "Ngài phải thấy, đại [righteous_caliph.GetTitleTierName], rằng thời điểm chưa thích hợp."
  fp3_yearly.8010.d: "Ngài không có quyền cai quản đất của ta."
  convincing_the_caliph_toast.success: "Ngươi đã thuyết phục [righteous_caliph.GetTitleTierName] suy nghĩ lại"
  convincing_the_caliph_toast.failure: "Lý lẽ của ngươi không thuyết phục được ai"
  fp3_caliph_convinced.tt: "[righteous_caliph.GetTitleTierName] sẽ tạm tránh chiến tranh."
  fp3_caliph_unconvinced.tt: "[righteous_caliph.GetTitleTierName] phẫn nộ vì sự yếu kém của ngươi."
  fp3_caliph_dead.title: "Cam Kết Hủy Bỏ"
  fp3_caliph_dead.desc: "Người đứng đầu đức tin trước đây không còn nữa, và lời cam kết chinh phục của ngươi trở nên vô hiệu."

  fp3_yearly.8012.t: "Lời Hứa Được Thực Hiện"
  fp3_yearly.8012.desc: "\"Có vẻ như\", [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] tuyên bố, \"ngươi không chần chừ trong việc thực hiện lời hứa chinh phục [pagan_county.GetNameNoTier] nhân danh đức tin của chúng ta. Ngươi đã chứng minh mình là một người cai trị đáng tin cậy và là một [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] sùng đạo, và chúng ta sẽ không quên điều này.\""
  fp3_yearly.8012.a: "Ta chỉ làm điều mà bất kỳ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] nào cũng sẽ làm."
  become_faith_warrior.toast: "Ngươi đã trở thành chiến binh của [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]"

  fp3_yearly.8013.t: "Nỗi Thất Vọng Của [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
  fp3_yearly.8013.desc: "\"Năm năm trước\", [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] tuyên bố, \"ngươi đã hứa trước chúng ta sẽ giải phóng [pagan_county.GetNameNoTier] khỏi những kẻ ngoại đạo. Làm sao có thể, mà điều này chưa thành hiện thực?\""
  fp3_yearly.8013.a: "Ta xin lỗi, hoàn cảnh chống lại ta."
  fp3_yearly.8013.b: "Ta không công nhận ngài, cũng như bất kỳ lời hứa nào đã đưa ra."
 
  fp3_yearly.8014.t: "Bí Mật Của Ấm Trà"
  fp3_yearly.8014.desc: "Ta đã lâu vật lộn để hòa hợp tình yêu rượu của mình với quan điểm đạo đức của [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. May mắn thay, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('smart_courtier'))] [smart_courtier.GetFirstName] đã nghĩ ra một giải pháp.\n\n\"Ta biết rằng những [ROOT.Char.Custom('LevyMenWomen')] ở Osrushana\", [smart_courtier.GetSheHe] nói, \"cần một lượng rượu nhất định để chịu được thời tiết lạnh. Và tất nhiên để tận hưởng cuộc sống. Họ có thói quen rót rượu vào một ấm đồng, để bất cứ người xem quá nhiệt tình nào cũng tưởng họ uống trà, chứ không phải rượu. Ta cũng đã làm như vậy một thời gian, và thật tiện lợi.\""
  fp3_yearly.8014.a: "Ý tưởng tuyệt vời!"
  fp3_yearly.8014.b: "[ROOT.Char.Custom('LevyMenWomen')|U] có thể không đánh giá ta, nhưng [ROOT.Char.GetFaith.HighGodNameAlternate] sẽ."
  fp3_yearly.8014.c: "Ta sẽ không làm, và #italic ngươi cũng không#!."
  f3_yearly.8014_forbidding_teapot_alcohol_flavor: "Ngài buộc [smart_courtier.GetNameNoTooltip] dừng việc che giấu tội lỗi của [smart_courtier.GetHerHis]."

 #Forgotten Runestones, by Ola Jentzsch 
  fp3_yearly.8016.t: "Những Viên Đá Bị Lãng Quên"
  fp3_yearly.8016.desc: "[hyrcanian_vassal.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hyrcanian_vassal'))] của ta, đã mời ta đi xem một bộ ba những hòn đá khắc kỳ lạ, sâu trong khu rừng Hyrcanian trên lãnh địa của hắn.\n\n\"Chúng chắc chắn được dựng lên bởi một đoàn thám hiểm bị mất tích của những kẻ man di #italic Rusiyyah#!\", [hyrcanian_vassal.GetSheHe] nói với ta. \"Giờ đây, những người sống trong rừng địa phương đã yêu thích những hòn đá này, và tin rằng những người tạo ra chúng không rõ danh tính sẽ giáng xuống họ từ Biển Caspian với sự trả thù nhanh chóng và đẫm máu nếu những hòn đá bị phá hủy. Nhưng ta không tin những câu chuyện như vậy. Mặc dù ta không thể đọc những chữ cái trên những hòn đá này, chúng chắc chắn là những thần tượng ngoại giáo, và phải bị đập nát thành từng mảnh. Chẳng phải vậy sao, thưa chủ nhân của ta?\""
  fp3_yearly.8016.a: "Đưa Ta cái búa tạ!"
  fp3_yearly.8016.b: "Không, chúng ta sẽ lắng nghe dân rừng."
  fp3_yearly.8016.c: "Ta sẽ mang chúng đi, và dựng lại ngoài [ROOT.Char.Custom('ResidenceBuilding')] của Ta..."
  fp3_hyrcanian_vassal_convinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip] chấp nhận giải pháp này."
  fp3_hyrcanian_vassal_unconvinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip] thắc mắc tại sao Ngài lại làm như vậy."
  convincing_the_hyrcanian_vassal_toast.success: "[hyrcanian_vassal.GetTitledFirstName] đã chấp nhận đề xuất của Ngài."
  convincing_the_hyrcanian_vassal_toast.failure: "[hyrcanian_vassal.GetTitledFirstName] nhìn theo trong im lặng khi những viên đá bị kéo đi."

 #Hyrcanian Havoc, by Ola Jentzsch 
  fp3_yearly.8017.t: "Biến Loạn Hyrcanian"
  fp3_yearly.8017.desc: "Thảm họa đã xảy ra! Những chiến binh #italic Rus#! giận dữ tràn xuống [runestone_county.GetNameNoTier] như những con kền kền trên xác chết, tàn sát tất cả trong tầm mắt. [hyrcanian_vassal.GetTitledFirstName] [hyrcanian_vassal.GetHerselfHimself] bị hạ bởi một nhát rìu, trong tình trạng nguy kịch, bị thương nặng. Nhưng nhanh chóng như họ tới, những kẻ cướp đã trở lại thuyền của họ, và biến mất trong sương sớm trên Biển Caspi.\n\nCó những tin đồn lan truyền giữa những người sống sót rằng kẻ tấn công có thể đã tìm cách trả thù [hyrcanian_vassal.GetFirstNameNoTooltip] vì đã xúc phạm những viên đá Rus' cách đây nhiều năm..."
  fp3_yearly.8017.a: "[ROOT.Char.GetFaith.HighGodNameAlternate], chúng ta đã làm gì khiến Ngài tức giận?"
  fp3_yearly.8017.b: "Ta sẽ gửi một ít vàng, dù có ích gì đi nữa."
  fp3_yearly.8017.c: "Đây là điềm xấu... Ta nên phục hồi những viên đá về [runestone_county.GetNameNoTierNoTooltip]."

 #A Heavenly Horse, by Ola Jentzsch 
  fp3_yearly.8018.t: "Chiếc Ngựa Thiên Thần"
  fp3_yearly.8018.desc_eunuch: "Khi Ta đang huấn luyện với [ROOT.Char.Custom('WarhorseStoryName')], một lữ khách từ xa tiến đến. Anh cúi mình với những cử chỉ tinh tế, đo lường cẩn thận, ám chỉ một sự nghiệp dài trong các triều đình tráng lệ.\n\n\"Ta phục vụ một vị quý bà lớn\", anh nói, \"ở Trung Quốc, vượt qua những dãy núi lớn này. Quý bà của Ta là một người chơi #italic chovgan#! nhiệt tình, nhưng cũng hay khoe khoang, và bà nói với Bạn Bè rằng trong trò chơi tiếp theo, bà sẽ cưỡi con ngựa tuyệt nhất trên thiên hạ. Dân tộc Ta lâu nay trân trọng những #italic ngựa thiên thần#! của đất nước ngài, và có vẻ, [ROOT.Char.Custom('FormOfAddressForLiege')], ngài sở hữu con tuyệt nhất trong số đó. Nhưng Ta cũng biết rằng ngài gặp một số khó khăn #italic tài chính#!...\"\n\n\"Vậy ngài nói sao, Ta có thể mua con [ROOT.Char.Custom('HorseStoryMareStallion')] tuyệt đẹp này không?\""
  fp3_yearly.8018.desc_grand_old_lady: "Khi Ta đang huấn luyện với [ROOT.Char.Custom('WarhorseStoryName')], một quý bà ăn mặc lạ lẫm tiến đến cùng đoàn tùy tùng.\n\n\"Ta đến\", bà nói, \"từ các triều đình lớn ở Trung Quốc. Gần đây Ta đã quan tâm đến #italic chovgan#!, môn thể thao cưỡi ngựa phổ biến ngay cả trong vương quốc nhỏ của ngài. Nhưng trong trò chơi tới, Ta đã hứa sẽ cưỡi một #italic ngựa thiên thần#!, những chiến mã chảy máu từ Ferghana mà dân Ta trân trọng hơn cả Trụ Bất Tử. Giờ đây, Ta biết rằng ngài, [ROOT.Char.GetLadyLord] nhỏ bé nơi này, sở hữu một [ROOT.Char.Custom('HorseStoryMareStallion')] tinh xảo hơn bất kỳ con nào khác. Ta cũng biết rằng ngài đang mắc nợ...\"\n\nBà trao cho Ngài một túi vàng nặng, và ý định của bà rõ ràng."
  fp3_yearly.8018.a: "Được thôi, Ta sẽ bán ngựa cho bà."
  fp3_yearly.8018.b: "Ta sẽ không bao giờ bán [ROOT.Char.Custom('WarhorseStoryName')]."
  fp3_yearly.8018.c: "Biến khỏi mắt Ta, mụ không ngựa!"



 ##################################################
 #THE FRONTIER STORY CYCLE 
 ##################################################

  fp3_yearly.8888.t: "Mối Bất Bình Khi Chăn Thả"
  fp3_yearly.8888.desc: "[upset_vassal.GetName] tìm đến Ta, rõ ràng rất bức xúc.\n\n\"Bệ hạ\", [upset_vassal.GetSheHe] nói, \"bộ lạc [turkic_leader.GetCulture.GetName] do [turkic_leader.GetName] lãnh đạo đã cướp hết các đồng cỏ ở [nomads_county.GetNameNoTier], và nói chung gây rối cho dân cư yên ổn. Ta đã cố gắng gửi những chiến binh #italic ghazi#! để đuổi họ đi, nhưng họ chỉ rút lui và ẩn nấp ở vùng hoang vắng, rồi một tháng sau lại quay lại. Ngài phải giúp Ta trục xuất bọn man rợ bẩn thỉu này - một lần cho xong.\" \n\n\"Ta có thể xử lý họ\", [possibly_capable_marshal.GetCouncilTitle] [possibly_capable_marshal.GetFirstName] nói, \"gửi Ta tới [nomads_county.GetNameNoTierNoTooltip].\""
  fp3_yearly.8888.a: "Không, Ta sẽ đến và tự giải quyết với họ."
  fp3_yearly.8888.b: "Rất tốt, [possibly_capable_marshal.GetFirstNameNoTooltip] - dẫn quân đến [nomads_county.GetNameNoTierNoTooltip]."
  fp3_yearly.8888.c: "[upset_vassal.GetTitledFirstNameNoTooltip], chuyện này là giữa ngươi và [turkic_leader.GetFirstNameNoTooltip]."
  fp3_fighting_turks.success.tt: "[possibly_capable_marshal.GetFirstName] bắt được thủ lĩnh du mục"
  fp3_fighting_turks.failure.tt: "Họ né tránh quân của ngài"
  fp3_treating_with_turks.success.tt: "Người [turkic_leader.GetCulture.GetName] đồng ý thương lượng"
  fp3_treating_with_turks.failure.tt: "Ngài không thuyết phục được họ"
  fp3_treating_with_turks_toast.failure: "Những người du mục từ chối thương lượng với ngài."
  fp3_fighting_turks_toast.failure: "[possibly_capable_marshal.GetTitledFirstName] thất bại trong việc đánh bại bọn du mục cứng đầu."

  fp3_yearly.8889.t: "Cỏ Đủ Cho Mọi Người"
  fp3_yearly.8889.desc: "[turkic_leader.GetName] tiếp đón Ta với tất cả lòng hiếu khách xứng với tước vị của Ta, mời trà, thịt ngựa khô và nước suối tươi. Nhưng [turkic_leader.GetSheHe] nói về [upset_vassal.GetName] với vẻ khinh miệt.\n\n\"[upset_vassal.GetTitledFirstNameNoTooltip] đang nói dối\", thủ lĩnh du mục nói với Ta, \"có đủ cỏ cho tất cả. Hãy để dân Ta ở lại [nomads_county.GetNameNoTierNoTooltip], và chúng Ta có thể cho mượn cung và kiếm cho quân đội ngài. Ta thậm chí sẽ đến triều đình ngài, và phục vụ như [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')].\""
  fp3_yearly.8889.a: "Nghe có vẻ hợp lý."
  fp3_yearly.8889.b: "Ngươi không thể ở lại đây, nhưng hãy chăn thả ở [nomads_new_county.GetNameNoTierNoTooltip]."
  fp3_yearly.8889.c: "Tiếc thay, không thể đạt thỏa thuận này."

  fp3_yearly.8890.t: "Số phận của một [Select_CString(turkic_leader.IsFemale,'Chieftess','Chieftains')]"
  fp3_yearly.8890.desc_beginning: "Bị kéo đến trước mặt Ta, thủ lĩnh du mục [turkic_leader.GetName] trông rất tuyệt vọng. [turkic_leader.GetSheHe|U] ít Bạn Bè ở đây, nếu có.\n\n\"Chúng Ta đã mai phục người [turkic_leader.GetCulture.GetName]\", [possibly_capable_marshal.GetFirstName] giải thích, \"bắt giữ [turkic_leader.GetWomanMan] này cùng một số chiến binh của [turkic_leader.GetHerHis].\""
  fp3_yearly.8890_brutal_demands: "\"Chém đầu họ đi\", [upset_vassal.GetName] nhấn mạnh, \"vì bọn man rợ này đã giết nhiều thần dân của ta.\""
  fp3_yearly.8890_nonbrutal_demands: "\"Hãy bắt họ hứa rời khỏi đất của ta mãi mãi\", [upset_vassal.GetTitledFirstName] gợi ý, \"giữ [turkic_leader.GetFirstNameNoTooltip] làm con tin để đảm bảo họ tuân thủ.\""
  fp3_yearly.8890.desc_ending: "\"Thật vậy\", [turkic_leader.GetNameNoTooltip] nói, \"Ta không sợ giết những kẻ cầm giáo đến chống lại Ta. Nhưng kiếm và cung của Ta, cùng của các chiến binh, sẽ phục vụ ngài, bệ hạ [ROOT.Char.GetTitleTierName], nếu ngài thả Ta đi.\""
  fp3_yearly.8890.a: "Rất tốt, để dân ngươi định cư ở [nomads_new_county.GetNameNoTierNoTooltip] - và phục vụ ta."
  fp3_yearly.8890.b: "Không, mạng ngươi bị tước bỏ."
  fp3_yearly.8890.c: "Ta sẽ giữ ngươi làm con tin, để yên dân tộc ngươi."

 
  nomad_friction_gone.tt: "Những người du mục đã được xoa dịu"
  nomad_friction_active.tt: "Những người du mục nổi giận"

  fp3_frontier_story_cycle.0001_opening: "Bệ hạ thân mến"
  fp3_frontier_story_cycle.0001_letter: "Ta sẽ gửi đến ngài hai đứa trẻ mồ côi, cha mẹ chúng chết đói sau khi bầy [turkic_leader.GetCulture.GetName] dẫm nát cánh đồng và vườn cây của họ. Vì ngài yêu thích người du mục man rợ, ta tin rằng ngài cũng sẽ chăm sóc những nạn nhân này. Mong [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] chiếu sáng trị vì của ngài."
  fp3_frontier_story_cycle.0001.a: "Cái gì..."
  children_arriving_shortly.tt: "Trẻ em sẽ sớm đến"

  fp3_frontier_story_cycle.0002_opening: "Vị [ROOT.Char.GetTitleTierName] vĩ đại"
  fp3_frontier_story_cycle.0002_letter: "Ta hối tiếc về hành vi của mình trong sự việc với người du mục. Họ thực sự đã rời khỏi [nomads_county.GetNameNoTier], và Ta nghe rằng xung đột giữa họ và nông dân đã giảm. Trong khi Ta vẫn cho rằng ngài nên coi mối đe dọa từ du mục nghiêm túc, Ta xin gửi tặng những đồng vàng đẹp này, đúc từ thời Đế quốc Kushan xưa, làm dấu tôn trọng."
  fp3_frontier_story_cycle.0002.a: "Một món quà tuyệt. Mọi chuyện đã được tha thứ."
  fp3_frontier_story_cycle.0002.b: "Ta không cần đồ trang sức của ngài, cũng không chấp nhận lời bào chữa."

  fp3_frontier_story_cycle.0003.t: "Trả Phần Của Họ"
  fp3_frontier_story_cycle.0003_beginning: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))] [greedy_chaplain.GetFirstName] đã dành nhiều thời gian suy nghĩ về [turkic_leader.GetName] và bộ lạc du mục của [turkic_leader.GetHerHis].\n\n\"Thật vậy, [ROOT.Char.Custom('FormOfAddressForLiege')]\", [greedy_chaplain.GetFirstNameNoTooltip] nói, \"họ luôn trong lời cầu nguyện của Ta. Vì Ta biết rằng một số trong họ vẫn theo tín ngưỡng ngoại giáo.\""
  fp3_frontier_story_cycle.0003_jizya: "Chúng ta nên để họ nộp #italic jizya#! để giữ phong tục ngoại giáo của họ."
  fp3_frontier_story_cycle.0003_not_jizya: "Chúng ta nên làm như người Hồi giáo, và để họ nộp thêm thuế, vì chắc chắn ngài đã rộng lượng với họ?"
  fp3_frontier_story_cycle.0003_ending: "\"Thật không công bằng\", [turkic_leader.GetFirstNameNoTooltip] phản đối. \"Ta đã cống hiến một trăm cung thủ ngựa cho ngài, cùng bản thân. Nếu ngài không thu thuế theo cách này, Ta hứa sẽ không quên ân huệ.\""
  fp3_frontier_story_cycle.0003.a: "Chúng ta sẽ tìm từng đồng bạc bộ lạc ngươi giấu."
  fp3_frontier_story_cycle.0003.b: "Không, [greedy_chaplain.GetFirstNameNoTooltip] đúng, ngươi phải bị đánh thuế."
  fp3_frontier_story_cycle.0003.c: "Rất tốt, [turkic_leader.GetFirstNameNoTooltip], nghe hợp lý."
  resentful_nomads.toast: "Người du mục bức xúc"

  fp3_frontier_story_cycle.0004.t: "Mồ Côi Vì [turkic_leader.GetCulture.GetNameNoTooltip]"
  fp3_frontier_story_cycle.0004.desc: "[orphan_girl.GetName] trông thật tội nghiệp, cũng như cậu em nhỏ [orphan_boy.GetName], dường như gặp đủ loại bất hạnh.\n\n\"Xin bệ hạ [ROOT.Char.GetTitleTierName]\", cô bé run giọng nói, \"chúng Ta đã nhịn đói một tuần. Ta chỉ xin một ít bánh mì thôi. Dù mốc cũng không sao, miễn là ngài có thể cho...\"\n\nKhi hỏi thêm, cô không rõ ai là thủ phạm gây ra bất hạnh cho gia đình mình. \"Kỵ sĩ đến và dẫm nát mùa màng, cướp cừu của chúng Ta... rồi họ biến mất. Giờ Ta không biết chuyện gì sẽ xảy ra, nhưng Ta rất tiếc rằng [upset_vassal.GetTitledFirstName] đã phiền bực ngài vì chuyện nhỏ nhặt này.\""
  fp3_frontier_story_cycle.0004.a: "Đừng lo, ta sẽ nhận các ngươi."
  fp3_frontier_story_cycle.0004.b: "Có lẽ công bằng khi các ngươi được nhận vào bộ tộc của [turkic_leader.GetFirstNamePossessiveNoTooltip]."
  fp3_frontier_story_cycle.0004.c: "Ta sẽ gửi các ngươi đến tu viện."
  fp3_frontier_story_cycle.0004.d: "Ta không biết [upset_vassal.GetFirstNameNoTooltip] trông đợi gì. Đi tìm trại trẻ mồ côi đi."
  fp3_pay_for_upkeep_flavor: "Ngài sẽ phải trả tiền nuôi dưỡng họ."

  fp3_frontier_story_cycle.0005.t: "Hai Trăm Kỵ Sĩ"
  fp3_frontier_story_cycle.0005.desc: "Khi Ta suy nghĩ về chiến lược và các trận đánh, [turkic_leader.GetName] đến cùng hàng trăm kỵ sĩ.\n\n\"[ROOT.Char.GetTitleTierName] của ta\", [turkic_leader.GetSheHe] nói, cúi chào, \"ta đã hứa sẽ hỗ trợ ngài, như toàn bộ bộ tộc. Giờ ngài đang trong chiến tranh, chúng Ta có thể gửi thêm hai trăm cung thủ ngựa tài ba, nhưng chỉ trong suốt xung đột hiện tại. Khi mọi việc yên ổn, họ sẽ về lều và gia đình. Đổi lại, chúng Ta chỉ mong ngài không quên ân huệ này.\""
  fp3_frontier_story_cycle.0005.a: "Ta đồng ý điều đó."
  fp3_frontier_story_cycle.0005.b: "Ta chán nghe chuyện ân huệ rồi!"
  fp3_frontier_story_cycle.0005.c: "Không cần, ta có thể tự quản lý."

  fp3_frontier_story_cycle.0006.t: "Mũi Tên Lạc"
  fp3_frontier_story_cycle.0006_beginning: "[one_eyed_child.GetName] đang chạy nhảy khám phá [ROOT.Char.Custom('ResidenceBuilding')], như cái cách mà [one_eyed_child.GetSheHe] vẫn thường làm, thì thảm họa ập đến. [turkic_leader.GetName] đang luyện bắn cung cùng với vài chiến binh của [turkic_leader.GetHerHis], và một mũi tên lạc đã bắn trúng thẳng vào mắt đứa con hoang dã của ta, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))]."
  fp3_frontier_story_cycle.0006_has_court_physician: "\"[one_eyed_child.GetSheHe|U] sẽ ổn, Ta tin vậy\", bác sĩ [scoped_physician.GetFirstName] nói, \"nhưng tiếc rằng sẽ sống với một mắt kém. Mong ngài cẩn thận, bớt mũi tên bay qua sân trong tương lai.\""
  fp3_frontier_story_cycle.0006_no_court_physician: "Một bác sĩ địa phương được gọi vội xác nhận rằng [one_eyed_child.GetSheHe] sẽ hồi phục, nhưng mắt sẽ mất vĩnh viễn."
  fp3_frontier_story_cycle.0006_ending: "\"Đây là tai nạn\", [turkic_leader.GetFirstName] van xin. \"Đừng quá vội trừng phạt, [ROOT.Char.Custom('FormOfAddressForLiege')]. Nếu chúng Ta không luyện tập, làm sao bảo vệ đất của ngài?\""
  fp3_frontier_story_cycle.0006.a: "Ngươi có thể trau dồi kỹ năng bắn cung... trong ngục."
  fp3_frontier_story_cycle.0006.b: "Từ nay, cấm bắn cung quanh [ROOT.Char.Custom('ResidenceBuilding')]."
  fp3_frontier_story_cycle.0006.c: "Ta đoán đây là ý muốn của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."


  fp3_frontier_story_cycle.0007.t: "Tai Họa Đoàn Lữ Hành"
  fp3_frontier_story_cycle.0007.desc: "\"Thưa [ROOT.Char.GetTitleTierName]\", [warmonger_councillor.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))] của ta, nói, \"các thương nhân ở [bandits_county.GetName] kể về những cuộc đột kích của bọn cướp trên lưng ngựa. Giờ đây các đoàn lữ hành phải đi đường vòng tránh khỏi vùng đất đó, gây tổn hại đến việc buôn bán của chúng ta trên Con đường Tơ lụa. Ta cầu xin ngài hãy cử ta đi điều tra vụ việc này.\"\n\n\"Không\", [turkic_leader.GetName] dữ dội xen vào, \"ta có thể cử các chiến binh của mình đi bảo vệ các tuyến đường lữ hành vĩnh viễn — nếu từ nay chúng ta được phép chăn thả ngựa tại [bandits_county.GetNameNoTierNoTooltip]. Chắc chắn đó sẽ là một hướng hành động tốt hơn?\"\n\nNhưng [warmonger_councillor.GetFirstNameNoTooltip] phản đối. \"Hãy cẩn thận, thưa [ROOT.Char.Custom('FormOfAddressForLiege')] — người nông dân ghê tởm cảnh ngài để lũ du mục lang thang tự do.\""
  fp3_frontier_story_cycle.0007.a: "Dù sao, kế hoạch của [turkic_leader.GetFirstNamePossessiveNoTooltip] hợp lý hơn."
  fp3_frontier_story_cycle.0007.b: "Được rồi, ta cho ngươi cơ hội này."
  fp3_frontier_story_cycle.0007.c: "Nếu chờ một chút, thương nhân sẽ trở lại."
  fp3_investigating_attacks_successful: "[warmonger_councillor.GetFirstNameNoTooltip] ngăn chặn các vụ tấn công, và học hỏi từ đó"
  fp3_investigating_attacks_dismal_failure: "[warmonger_councillor.GetFirstNameNoTooltip] trở về mà không có kết quả"
  fp3_investigating_attacks_toast_successful: "[bandits_county.GetNameNoTierNoTooltip] đã an toàn"
  fp3_investigating_attacks_toast_dismal_failure: "Cướp hoành hành ở [bandits_county.GetNameNoTierNoTooltip]"
  attacks_abated.toast: "Các vụ cướp đã giảm bớt"

  fp3_frontier_story_cycle.0099.t: "Phong tước [turkic_leader.GetFirstNamePossessiveNoTooltip]"
  fp3_frontier_story_cycle.0099.desc: "\"Từ lâu ta đã phục vụ ngài một cách trung thành, thưa chúa tể, và dành nhiều sự ủng hộ cho mục tiêu của ngài, với chi phí cá nhân rất lớn.\" [turkic_leader.GetName] trông như thể [turkic_leader.GetSheHe] đã chờ đợi thời điểm này, và chẳng cần phải là một [Select_CString(turkic_leader.IsFemale,'nhà tiên tri nữ','nhà tiên tri')] để nhận ra điều gì sắp xảy ra tiếp theo.\n\n\"Đã quá lâu rồi ngài mới ban cho ta phần thưởng và trọng trách xứng đáng với ta. Hãy ban cho ta [title_to_grant.GetName], để nắm giữ vĩnh viễn, và bộ lạc của ta sẽ phục vụ gia tộc [ROOT.Char.GetDynastyHouseName] mãi mãi về sau. Nó còn lâu mới là vùng đất giàu có nhất của ngài, nhưng đang rất cần sự cai trị trực tiếp hơn. Hãy vinh danh ta theo cách này, nếu không ta có thể sẽ đưa các chiến binh của mình đến nơi khác.\""
  fp3_frontier_story_cycle.0099.a: "Hãy coi nó là của ngài."
  fp3_frontier_story_cycle.0099.b: "Ngài không muốn nhận [extra_title_to_grant.GetNameNoTooltip] sao?"
  fp3_frontier_story_cycle.0099.c: "Ta có thể ban cho ngài [extra_extra_title_to_grant.GetNameNoTierNoTooltip], nhưng chỉ vậy thôi."
  fp3_frontier_story_cycle.0099.d: "Không."

 #Refuge of Light, by Ola Jentzsch 
  fp3_yearly.8019.t: "Nơi Ẩn Náu Ánh Sáng"
  fp3_yearly.8019.desc: "[hateful_ruler.GetTitleTierName] [hateful_ruler.GetFirstName] đã khởi xướng một cuộc bức hại các [manichean_leader.GetFaith.GetAdherentNamePlural] còn lại trên lãnh thổ [hateful_ruler.GetHerHis]. [manichean_leader.GetName], một lãnh đạo của tín ngưỡng đang lâm nguy này, nay tìm đến Ta, mang theo một đống sách phủ bụi.\n\n\"Đại [ROOT.Char.GetTitleTierName]\", [manichean_leader.GetSheHe] nói, \"đức tin của Ta đã có từ lâu, là một đối thủ với Thiên Chúa giáo khi nó còn non trẻ. Chúng Ta sở hữu nhiều kiến thức về thế giới vật chất sa ngã, và cả một chút hiểu biết khiêm tốn về thế giới ánh sáng cao hơn. Một số đồng đạo của chúng Ta đã định cư tại [refuge_of_light.GetNameNoTier] - liệu ngài có cho phép những người theo Ta cũng làm như vậy không?\"\n\n\"Đổi lại, Ta có thể ở lại phục vụ ngài và chia sẻ kho kiến thức quý giá này từ các thư viện cổ của chúng Ta ở Baghdad và Ctesiphon trước khi chúng sụp đổ.\""
  fp3_yearly.8019.a: "Ta vui lòng chấp nhận đề nghị này."
  fp3_yearly.8019.b: "Người có thể định cư tại [refuge_of_light.GetNameNoTierNoTooltip] - nếu nộp thuế thích hợp."
  fp3_yearly.8019.c: "Ta sẽ không che chở ngươi trên đất của ta."
  manicheans_sent_away.tt: "Ngươi đuổi các [manichean_leader.GetFaith.GetAdherentNamePlural] đi."

 #The Lady of the Land, by Ola Jentzsch
  fp3_yearly.8020.t: "Quý Nương Của Vùng Đất"
  fp3_yearly.8020.desc: "Có một đền thờ tại [temple_county.GetNameNoTier], dành cho [bibi_shahrbanu.GetFirstName], một công chúa Sassanian đã kết hôn với [imam_husayn.GetTitledFirstName]. Khi chạy trốn trên ngựa khỏi Trận Karbala, người ta kể rằng [bibi_shahrbanu.GetFirstNameNoTooltip] kêu cứu và một ngọn núi mở ra che chở. Từ đó, nhiều nữ hành hương đã đến nơi này để tôn kính bà.\n\nNhưng [righteous_caliph.GetTitledFirstName] khẳng định đền thờ ban đầu dành cho thần ngoại giáo [GetFaithByKey('mazdayasna').FertilityGodName], và lòng sùng kính ở đây là sai trái và không hợp đạo. [righteous_caliph.GetSheHe|U] muốn phá hủy nó.\n\n\"Ngài không thể làm vậy\", [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('pious_woman'))] [pious_woman.GetFirstName] cầu xin. \"[bibi_shahrbanu.GetFirstNameNoTooltip] là biểu tượng cho mọi phụ nữ ở Ba Tư. Ngài phải để đền thờ được tồn tại.\""
  fp3_yearly.8020.a: "Ta sẽ cho lính bảo vệ nó, vì ngươi."
  fp3_yearly.8020.b: "Bà ấy là #italic công chúa#! của Ba Tư! Không ai được hủy hoại đền thờ."
  fp3_yearly.8020.c: "Thật tiếc, nó phải bị phá hủy."
  supporting_womens_faith_flavor: "Ngươi bắt đầu ủng hộ giáo phái [bibi_shahrbanu.GetFirstNameNoTooltip]."
  fp3_sharhabanu_devotees_angry.tt: "Những tín đồ [bibi_shahrbanu.GetFirstNameNoTooltip] tại triều đình có thể phản đối việc này."

 #Acidic Advancements, by Ola Jentzsch
  fp3_yearly.8021.t: "Một Tai Nạn Axit"
  fp3_yearly.8021.desc: "Vài ngày trước, [alchemy_enthusiast.GetName], kẻ học thức [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] của [upset_vassal.GetFirstName], vị chư hầu của ta, đã tham gia vào một thí nghiệm với dầu vitriol do nhà giả kim lừng danh [enthusiastic_alchemist.GetName] điều chế. Rõ ràng là có thứ gì đó đã sai lệch một cách khủng khiếp.\n\n\"Ngài phải trừng phạt [enthusiastic_alchemist.GetFirstNameNoTooltip] thật nặng tay\", [upset_vassal.GetTitledFirstNameNoTooltip] nói với ta, \"hãy nhìn tình trạng thảm hại của [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] của ta đây!\"\n\n\"Không, thưa [ROOT.Char.GetTitleTierName] của ta\", [enthusiastic_alchemist.GetFirstNameNoTooltip] cầu xin, \"ta chỉ đơn giản là đã hoàn thiện một công thức mà các nhà thông thái hằng tìm kiếm. Không phải lỗi của ta khi [alchemy_enthusiast.GetTitledFirstNameNoTooltip] đã bất cẩn với cả một #italic uqiyyah#! chất ăn mòn nhất từng thấy trên thế gian này.\""
  fp3_acid_delving_deeper_tooltip: "Ngươi bỏ qua oán giận của [upset_vassal.GetFirstNamePossessiveNoTooltip] để khám phá phát hiện của [enthusiastic_alchemist.GetNamePossessiveNoTooltip]."
  fp3_yearly.8021.a: "[enthusiastic_alchemist.GetNameNoTooltip], kể ta nghe thêm về những khám phá này..."
  fp3_yearly.8021.b: "Được rồi, [upset_vassal.GetTitledFirstNameNoTooltip], ta sẽ ra lệnh tử hình [enthusiastic_alchemist.GetHerHim]."
  fp3_yearly.8021.c: "Ta còn chỗ trong ngục cho nhà giả kim gầy còm này..."
  fp3_yearly.8021.d: "Không ai đáng trách ở đây, các ngươi phải tha thứ cho nhau."

  fp3_yearly.8022.t: "Những Tầm Nhìn Axit"
  fp3_yearly.8022.desc: "\"Những gì ta phát minh dựa trên một khoáng chất giống thủy tinh mà người Babylon và Hy Lạp xưa gọi là #italic vitriol#!\", [enthusiastic_alchemist.GetName] giải thích. \"Bằng cách nung kỹ vitriol xanh trong bình sắt, ta tạo ra chất ăn mòn này. Nó có thể dùng cho học thuật và y học, nhưng hãy cẩn thận [ROOT.Char.GetLadyLord], vì nó không phải trò chơi, như [alchemy_enthusiast.GetTitledFirstName] đã học được. Có lẽ ngài sẽ tài trợ nghiên cứu thêm?\""
  fp3_yearly.8022.a: "Ta sẽ tự nghiên cứu chất này!"
  fp3_yearly.8022.b: "Có thể nó dùng cho... #italic quân sự#! không?"
  fp3_yearly.8022.c: "Tốt lắm, nhưng ta không cần."
  fp3_studying_acid_ominously_tooltip: "Ngươi theo đuổi nghiên cứu thêm..."
  fp3_yearly.8022.b.flavor: "[enthusiastic_alchemist.GetNameNoTooltip] ở lại triều để nghiên cứu thêm."
  fp3_yearly.8022.c.flavor: "[enthusiastic_alchemist.GetNameNoTooltip] đem tri thức của [enthusiastic_alchemist.GetHerHis] đến nơi khác."

  fp3_yearly.8023.t: "Những Vấn Đề Ăn Mòn"
  fp3_yearly.8023.desc: "Khi ta nhẹ nhàng rót chất lỏng sủi bọt đầy ám ảnh từ chai này sang chai khác, [enthusiastic_alchemist.GetName] nhìn ta đầy lo lắng.\n\n\"Ôi [ROOT.Char.GetTitleTierName]\", [enthusiastic_alchemist.GetSheHe] nói, \"Ta chủ yếu là học giả lịch sử và thần học, so với ngài, Ta chỉ là người chơi thử trong giả kim. Kinh nghiệm cho thấy chúng ta không thể học thêm gì nữa lúc này. Chúng ta nên ngừng thí nghiệm với dầu vitriol này, nếu không [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] sẽ trừng phạt chúng ta vì kiêu ngạo. Có lẽ axit này không nên tồn tại trên trái đất.\""
  fp3_yearly.8023.a: "Không, ta sẽ theo đến cùng."
  fp3_yearly.8023.b: "Có lẽ ngươi đúng. Nhưng ngươi nên ở lại phục vụ ta."
  fp3_yearly.8023.c: "Tuỳ ngươi. Đi đi, và đem axit theo."
  experimenting_with_acid_toast.failure: "Thí nghiệm thất bại"
  experimenting_with_acid_toast.success: "Thí nghiệm thành công"
  fp3_horrible_accident.flavor: "Ngươi đối mặt nguy cơ tai nạn khủng khiếp."

  fp3_yearly.8024.t: "Trở Về Trời"
  fp3_yearly.8024.desc: "Khi cơn sốt và những cơn run rẩy lắng xuống trong chốc lát, [dying_consort.GetFirstName] nhìn ta với một nụ cười nhợt nhạt. \"[ROOT.Char.GetWifeHusband] thân yêu, ta không còn nhiều thời gian trên thế gian này nữa. Ngay cả những bác sĩ giỏi nhất cũng chỉ có thể trì hoãn điều không thể tránh khỏi, ta có thể cảm nhận được điều đó.\" Dường như [dying_consort.GetHerHim] phải cố gắng rất nhiều mới giữ được tỉnh táo thêm một lúc nữa.\n\n\"Hãy nghe đây\", [dying_consort.GetSheHe] nói với giọng yếu ớt, \"vì đây là tâm nguyện cuối cùng của ta. Ta muốn thi thể của mình được trao cho lũ chim ăn xác, theo cách của tổ tiên ta, để linh hồn ta có thể được đưa trở lại nơi cư ngụ của nó trên thiên đàng. Xin đừng chôn cất hay hỏa táng, ta cầu xin ngài. Ta đã thoáng thấy thế giới bên kia trong những giấc mơ sốt mê man của mình... Ta muốn kết thúc theo cách cũ, như một [dying_consort.Custom('GetDaughterSon')] chân chính của Ba Tư.\""
  fp3_yearly.8024.a: "Ta sẽ thực hiện, ta hứa."
  fp3_yearly.8024.b: "Ta có thể làm lễ mai táng trên trời bí mật, nhưng vương quốc không được biết."
  fp3_yearly.8024.c: "Thật tiếc, ta không thể xúc phạm [ROOT.GetCharacter.GetFaith.HighGodNameAlternate]."
  fp3_relations_care_about_sky_burial.tt: "[courtiers|E], [vassals|E] và [close_family_members|E] sẽ có ý kiến về việc này."
  hiding_sky_burial_toast.success: "Ngươi đã giấu lễ Mai táng Trên Trời"
  hiding_sky_burial_toast.failure: "Lễ Mai táng Trên Trời bị phát hiện"
  fp3_hidden_sky_burial.tt: "Ngươi thực hiện nghi lễ trong bí mật"
  fp3_unhidden_sky_burial.tt: "Nghi lễ bị phát hiện sau đó"
  fp3_helpful_courtier.tt: "[helpful_courtier.GetName] sẽ giúp ngươi trong việc này."

  fp3_yearly.8025.t: "Buổi Sáng Thứ Tư"
  fp3_yearly.8025.desc: "Với tất cả nghi lễ thích hợp, thi hài [dying_consort.GetName] được đặt vào các ngách của #italic dakhma#! cổ xưa, trơ dưới trời cho kền kền đồng cỏ vòng quanh.\n\nĐã ba ngày kể từ khi [dying_consort.GetHerHis] qua đời, và ta vẫn đứng bên dakhma cho đến bình minh. Theo truyền thuyết, vào buổi sáng thứ tư sau cái chết, linh hồn sẽ trở về #italic fravashi#! ở thế giới cao hơn, và truyền lại tất cả kiến thức đã học để trợ giúp trong trận chiến vĩnh cửu chống lại ác. Nhưng ta không thấy linh hồn nào bay lên trời từ bức tường khô héo của dakhma, chỉ thấy bóng tối của kền kền trên nền ánh sáng nhạt của mặt trời mọc."
  fp3_yearly.8025.a: "Mong [dying_consort.GetSheHe] yên nghỉ nơi bờ bên kia."
  fp3_yearly.8025.b: "Ta đã tôn trọng di nguyện cuối cùng của [dying_consort.GetHerHis]."

  fp3_yearly.8026.t: "Dakhma Bí Ẩn"
  fp3_yearly.8026.desc: "Xa bên ngoài [ROOT.Char.Custom('ResidenceBuilding')] của Ta, có một #italic dakhma#! cổ xưa, một Tháp Im Lặng, đang dần đổ nát dưới những cơn gió lạnh từ thảo nguyên. Dường như ở đây không có ánh mắt tò mò, và cùng với [helpful_courtier.GetFirstName], Ta mang thi hài [dying_consort.GetTitledFirstName] tới nơi an nghỉ cuối cùng trong các ngách khô héo bên trong. Ta lặng lẽ quan sát khi kền kền thảo nguyên hạ xuống như một đám mây đen, và tự hỏi, trong khoảnh khắc, chúng đến từ đâu – phải chăng được gửi bởi các vị thần xưa, hay bởi [ROOT.Char.GetFaith.DevilName]? Ta sẽ không bao giờ biết.\n\n[helpful_courtier.GetFirstNameNoTooltip] giữ im lặng, có vẻ bị ảnh hưởng bởi bầu không khí u ám."
  fp3_yearly.8026.a: "Hy vọng không ai phát hiện ra việc này..."
  fp3_yearly.8026.b: "Ta nên làm [helpful_courtier.GetFirstNameNoTooltip] im lặng mãi mãi, chỉ để chắc chắn..."

  fp3_yearly.8027.t: "Chín Trăm Chín Mươi Chương Vàng"
  fp3_yearly.8027.desc: "Nhà văn nổi tiếng [snubbed_poet.GetName] đã bất hòa với nhà bảo trợ lâu năm của ông, [former_employer.GetName].\n\n\"[former_employer.GetSheHe|U] hứa sẽ trả Ta chín trăm chín mươi talent vàng\", [snubbed_poet.GetFirstNameNoTooltip] kể, \"một talent cho mỗi chương trong bài thơ sử thi mà Ta đã chuẩn bị từ lâu thay mặt [former_employer.GetHerHis]. Ta định dùng số vàng này để phục hồi các #italic qanats#! bị sập ở làng quê Ta. Nhưng khi Ta ở nhà tắm, một người đưa thư mang phần thưởng hứa hẹn tới – nhưng tiền là #italic bạc#!! Bực mình vì bị phản bội, Ta đã trao tất cả cho người đưa thư, chủ nhà tắm, và một người bán nước ép. Giờ Ta cần một nhà bảo trợ mới, trong khi hoàn thành những chương cuối, và Ta nghe nói ngài có đủ vàng để bằng với đề nghị trước...\""
  fp3_yearly.8027.a: "Ta sẽ trao cho ngươi #italic một nửa#! số đó – khi ta thấy cuốn sách hoàn thành."
  fp3_yearly.8027.b: "Chắc hẳn đây là hiểu lầm với [former_employer.GetTitledFirstNameNoTooltip]..."
  fp3_yearly.8027.c: "Ngươi coi ta là kẻ hoang phí sao? Đi nơi khác đi."
  fp3_mediation_fails.tt: "Việc hòa giải thất bại"
  fp3_mediation_succeeds.tt: "Việc hòa giải thành công"
  fp3_poet_leaves.tt: "[snubbed_poet.GetNameNoTooltip] sẽ chuyển đến triều đình [former_employer.GetFirstNamePossessiveNoTooltip], nhưng ngươi sẽ nhận được [opinion|E] và [prestige|E]"
  fp3_promise_to_pay_for_book.tt: "Ngươi hứa trả 495 [gold|E] cho cuốn sách khi hoàn thành."
  fp3_mediate_between_them.flavor: "Ngươi cố gắng giải quyết tình huống giữa [snubbed_poet.GetNameNoTooltip] và [former_employer.GetFirstNameNoTooltip]."

  fp3_yearly.8028.t: "Sách Vua Chúa"
  fp3_yearly.8028.desc: "\"Cuốn sách đã hoàn thành\", [snubbed_poet.GetName] tuyên bố, \"như Ta đã hứa, tất cả 990 chương, kể sử thi về lòng dũng cảm của các anh hùng Ba Tư và những kỳ quan xưa. Ta đã dồn hết tâm hồn vào tác phẩm này, và sẽ không bao giờ làm lại. Ta chỉ là một thi nhân phàm tục khiêm tốn. Nhưng nhờ sự bảo trợ của ngài, có lẽ sách Ta sẽ trường tồn qua các thời đại, và trở thành ngọn hải đăng niềm tự hào phục hưng cho Ba Tư.\"\n\n\"Vậy... ngài đã hứa trả Ta 495 talent vàng sao?\""
  fp3_yearly.8028.a: "Chúng là của ngươi, và ngươi nên ở lại phục vụ ta."
  fp3_yearly.8028.b: "Được, lấy đi và hãy giúp làng của ngươi."
  fp3_yearly.8028.c: "Cái #italic này#! là thứ Ta đã trả tiền sao? Thật thất vọng."

  shahnameh_name: "Sách Vua Chúa"
  shahnameh_desc: "Cuốn sách đồ sộ này kể chi tiết bằng thơ về lịch sử huyền thoại của Đế chế Ba Tư từ khi tạo dựng thế giới cho tới khi bị Hồi giáo chinh phục. Nó dường như chạm đến trái tim mọi người Ba Tư khi đọc."

  persian_epic_name: "Sử Thi Ba Tư"
  persian_epic_desc: "Cuốn sách chứa đầy thơ sử thi ca ngợi chiến công và định mệnh của các anh hùng Ba Tư xưa."

  fp3_yearly.8029.t: "Câu Chuyện Vinh Quang Xưa"
  fp3_yearly.8029.desc: "[snubbed_poet.GetName] trao cho Ta bản thảo, với nhiều trang đã trang trí bằng những hình minh họa tinh xảo. \"Đây là cuốn sách Ta đã hứa với ngài\", [snubbed_poet.GetSheHe] tuyên bố đầy tự hào. \"Với kỹ năng khiêm tốn mà Ta có, Ta hứa ngài sẽ không thấy nó thiếu sót. Nó kể về các anh hùng như Arash cung thủ, Fereydun sát rồng, những công chúa xinh đẹp và vinh quang cổ xưa của Ba Tư. Ta còn làm một cặp câu ghép liên kết triều đại vĩ đại của ngài với tất cả...\"\n\n\"Vậy, chúng ta đã nói về 495 talent vàng sao?\""
  fp3_yearly.8029.a: "Chúng là của ngươi, và ngươi nên ở lại phục vụ ta."
  fp3_yearly.8029.b: "Được, lấy đi và giúp làng của ngươi."
  fp3_yearly.8029.c: "Nhiều vàng đến vậy cho #italic cái này#!?"


  fp3_yearly.8030.opening: "[former_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  fp3_yearly.8030.desc: "Ngươi coi ta là kẻ ngốc sao? [snubbed_poet.GetName] đã tiêu pha tài sản của ta cho những kẻ bán hàng rong tồi tàn và chủ #italic hammam#! suy đồi, và dù [snubbed_poet.GetSheHe] nay tuyên bố rằng [snubbed_poet.GetSheHe] nhận được bạc, nhưng những người đáng tin cậy hơn ngươi đã nói rằng thực ra là vàng. Thế mà [snubbed_poet.GetSheHe] lại mang cuốn sách ta được hứa đi, để #italic cho ngươi#!. Mong [former_employer.GetFaith.HighGodNameAlternate] xóa ngươi khỏi vườn địa đàng!"
  fp3_yearly.8030.a: "Thật đáng tiếc ngươi không thấy lý trí..."

  fp3_yearly.8031.opening: "[former_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  fp3_yearly.8031.desc: "Thật vậy, hóa ra một triều thần hằn học đã phản bội ta, và trao cho [snubbed_poet.GetName] ít hơn những gì ta đã hứa với [snubbed_poet.GetHerHim]. Cảm ơn ngươi đã làm sáng tỏ hiểu lầm giữa ta và nhà thơ, người nay sẽ trở lại phục vụ ta. Ta sẽ nói tốt về ngươi với các vị quân vương khác trên thế gian này."
  fp3_yearly.8031.a: "Đây là niềm vui của Ta."

  fp3_yearly.8032.t: "Mười Ngày Của Người Chết"
  fp3_yearly.8032.desc: "Khi cuối năm cũ của lịch Ba Tư đến gần, đã đến lúc #italic Frawardigan#!, lễ cổ xưa tưởng nhớ linh hồn người đã khuất. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('death_enthusiast'))] [death_enthusiast.GetTitledFirstName] của Ta trở nên lặng lẽ và gần như chán nản, bày thức ăn cúng tổ tiên bên cửa.\n\n\"Ngươi nên thắp đèn\", [death_enthusiast.GetSheHe] bảo Ta, \"để đón #italic fravashi#!, linh hồn tổ tiên, chắc chắn ông bà ngươi đang nhìn ta từ bên kia bức tường mỏng của thế giới vật chất. Hãy nghĩ đến [ancestor_1.GetName] và những tổ tiên vĩ đại khác của nhà ngươi.\""
  fp3_yearly.8032.a: "Thật tiếc, Ta không cúng bái theo nghi lễ ngoại giáo."
  fp3_yearly.8032.b: "Dĩ nhiên, thưa quý vị."
  fp3_yearly.8032.c: "Ngôi nhà [ROOT.Char.GetDynastyHouseName] quả thật huy hoàng, giờ nhắc mới nhớ..."
  fp3_yearly.8032.d: "Quả thật... đời người như ngọn nến nhỏ, dễ dàng tắt lịm."

  fp3_yearly.8033.t: "Niềm Vui Đông Lạnh"
  fp3_yearly.8033.desc: "Trước bất kỳ ai khác, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sorbet_enthusiast'))] [sorbet_enthusiast.GetTitledFirstName] tinh mắt và yêu ngọt của Ta nhận ra một thiếu sót rõ rệt trên bàn ăn.\n\n\"Không có #italic faloodeh#!!\" [sorbet_enthusiast.GetSheHe] thốt lên, ám chỉ món tráng miệng lạnh với bún, siro và nước hoa hồng mà mọi người Ba Tư đều yêu thích. \"Ta đã gọi người cung cấp\", [sorbet_enthusiast.GetSheHe] tiếp tục, \"và được báo rằng các #italic yakhchal#! ở [yakhchal_county.GetNameNoTier] đã sập do động đất. Chúng ta phải làm gì ngay, kẻo toàn triều đình sẽ chịu khổ và trông tiều tụy như những nhà huyền bí phương Đông!\""
  fp3_yearly.8033.a: "Ta phải bảo đảm toàn bộ nguồn faloodeh của vương quốc, khi còn kịp!"
  fp3_yearly.8033.b: "Ta không cần loại xa xỉ này, và ngươi cũng vậy."
  fp3_yearly.8033.c: "Ngươi nói đúng. Ta sẽ gửi vàng để phục hồi các kho băng."
  fp3_yearly.8033.d: "Lần sau, hãy làm phiền ta với một vấn đề #italic thực sự#!."

  fp3_yearly.8034.t: "Kho Tàng Hephthalite"
  fp3_yearly.8034.desc: "\"Hãy nghe ta, thưa [ROOT.Char.GetTitleTierName]\", [wronged_vassal.GetName] khẩn cầu trước mặt ta. \"Một tháng trước, khi đang khảo sát những vùng đất cạnh một dòng sông ở [hephthalite_hoard_province.GetNameNoTier], ta tình cờ tìm thấy một kho báu vàng tuyệt đẹp. Ta có thể thấy từ hình dạng hộp sọ kéo dài của các vị vua được khắc trên đồng xu, rằng kho báu này hẳn phải do một dân tộc Hung nô cất giấu, có lẽ là Đế quốc Hephthalite, những người đã cai trị vùng đất của ta không lâu trước đây. Giờ đây, là hậu duệ của họ, ta nghĩ rằng mình có quyền tuyên bố sở hữu kho báu này. Nhưng vị chúa tể [greedy_vassal.GetTitledFirstName] đang tranh chấp điều đó. [greedy_vassal.GetSheHe|U] đang cố lấy kho báu từ tay ta, tuyên bố đó là quyền của [greedy_vassal.GetHerHis] với tư cách là người kế vị quyền kiểm soát Hephthalite trên những vùng đất đó. Xin hãy ủng hộ ta.\""
  fp3_yearly.8034.a: "Việc này dễ thôi - #italic ta#! sẽ lấy vàng."
  fp3_yearly.8034.b: "Ngươi phải trao hết cho [greedy_vassal.GetFirstNameNoTooltip]."
  fp3_yearly.8034.c: "Cần thỏa hiệp - trao cho dân [hephthalite_hoard_province.GetNameNoTierNoTooltip]."
  fp3_yearly.8034.d: "Ta sẽ để ngươi giữ - nhưng đừng quên ân này."

  fp3_yearly.8035.t: "Trái Tim và Đấng Sáng Tạo"
  fp3_yearly.8035.desc: "Khi Ta đi bộ bồn chồn dưới ánh trăng, [sufi_mystic.GetTitledFirstName] theo cùng.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [sufi_mystic.GetSheHe] nói nghiêm trang, \"ngươi muốn tiến gần [ROOT.GetCharacter.GetFaith.HighGodNameAlternate]? Ta gặp một ẩn sĩ Sufi từ Khorasan, người dạy ta thiền #italic muraqabah#!. Con đường không dễ, nhưng qua đó, ngươi có thể thanh lọc bản năng phàm tục, khám phá kiến thức ẩn giấu và thăng hoa tâm linh, hòa làm một với [ROOT.Char.GetFaith.ReligiousText] và vũ trụ. Ngươi có để ta dẫn dắt không?\""
  fp3_yearly.8035.a: "Vâng, ta sẵn sàng thử."
  fp3_yearly.8035.b: "Dù gì đi nữa, việc này hẳn là tà ác."
  fp3_yearly.8035.c: "Ta thà đi ngủ còn hơn, cảm ơn."
  fp3_unlock_meditation.tt: "Mở khóa quyết định Thiền Ẩn"
  learning_muraqaba_toast.success: "Ngươi đã học những kiến thức cơ bản về #italic muraqabah#!."
  learning_muraqaba_toast.failure: "Ngươi thất bại khi học những kiến thức cơ bản về #italic muraqabah#!."

  fp3_yearly.8036.t: "Thành Phố Không Miệng"
  fp3_yearly.8036.desc: "Mặt trời đã lặn khi Ta cưỡi qua hoang dã bên ngoài [spooky_county.GetNameNoTier], cùng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_councillor'))] [superstitious_councillor.GetTitledFirstName].\n\nDưới ánh trăng u ám, chúng Ta đến nơi Ta từng nghe nói. Một mê cung đá đứng — nham nhở và lệch — nơi chôn cất hay thánh địa của dân tộc bị quên lãng từ lâu. Trên đá khắc hình người, nhưng thiếu miệng. Những tượng khô héo nhìn chúng Ta lạnh lùng khi đi qua, gần như chuyển động.\n\n\"Đừng ở lại đây lâu\", [superstitious_councillor.GetFirstNameNoTooltip] run rẩy nói. Nhưng Ta không khỏi tự hỏi — họ là ai? Có thật sự có ma không?"
  fp3_yearly.8036.a: "Chúng ta sẽ ở lại một chút và khám phá nơi này."
  fp3_yearly.8036.b: "Hãy rời khỏi đây ngay và tìm thêm vệ sĩ..."
  fp3_yearly.8036.c: "Bình tĩnh, [superstitious_councillor.GetFirstNameNoTooltip]. Chỉ là bóng và bụi."
  fp3_yearly.8036.d: "Ta nên đọc một lời cầu nguyện, để chắc chắn."

  fp3_yearly.8037.t: "Phòng Chống Buồn Chán"
  fp3_yearly.8037.desc: "Khi ta đang lang thang vô định dưới ánh trăng, [court_physician.GetTitledFirstName], vị [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] của ta tiến lại gần.\n\n \"Thưa [ROOT.Char.GetTitleAsNameNoTooltip]\", [court_physician.GetSheHe] nói, \"Gần đây ngài có vẻ khá buồn bã. Ta không thể không thử đưa ra chẩn đoán... Ta tin rằng ngài đang mắc chứng acedia, tình trạng u sầu khốn khổ thường hành hạ những ẩn sĩ và những [Select_CString(ROOT.Char.IsFemale,'người phụ nữ','người đàn ông')] thông thái. Nhưng có học giả [persian_polymath.GetName], một bác sĩ giỏi hơn ta nhiều. [persian_polymath.GetSheHe|U] gần đây đã viết một cuốn sách về những nỗi thống khổ của tâm trí, và có thể sẽ điều trị được cho ngài.\""
  fp3_yearly.8037.a: "Vậy thì hãy gọi [persian_polymath.GetHerHim] đến, bất kể [persian_polymath.GetSheHe] đòi hỏi cái giá nào."
  fp3_yearly.8037.b: "Để ta yên."

  fp3_yearly.8038.t: "Đen Tối"
  fp3_yearly.8038.desc: "Sau khi quan sát Ta kỹ từ khi tới [ROOT.Char.Custom('GetCourt')], [persian_polymath.GetFirstName] đưa ra chẩn đoán.\n\n\"Đó là thừa dịch đen trong não, [ROOT.Char.GetTitleTierName] của ta. Người xưa đã hiểu cơ bản về bệnh này, nhưng các học giả Khorasan và Khwarezm đã nghiên cứu lâu. #italic Malikhulia#! ta gọi, khiến ngươi chán nản và uể oải. Một số bệnh nhân mất cảm giác thèm ăn hoặc bắt chước hành vi động vật, nhưng cũng có thể trở nên sáng tạo và thông minh, có lẽ không hẳn xấu.\" \n\n\"Nhưng thôi... ngươi có muốn thử chế độ ăn cá muối và cần tây? Kinh nghiệm cho thấy có thể hiệu quả.\""
  fp3_yearly.8038.a: "Được, ta sẽ thử."
  fp3_yearly.8038.b: "#italic Đó#! là phương pháp tốt nhất sao? Ta sẽ tìm người khác..."
  lackluster_diet.tt: "Ngươi sẽ không thể thực hiện quyết định Thưởng Thức Thức Ăn [decision|E] trong khi đang ăn kiêng này."

  fp3_yearly.8039.t: "Thảo Dược & Dịch Thể"
  fp3_yearly.8039.desc: "[persian_polymath.GetFirstName] trầm tư. \"Chế độ ăn ta kê dường như không có tác dụng, [ROOT.Char.Custom('FormOfAddressForLiege')]. Nhưng ngươi phải tránh an ủi bằng trăng sao, bùa chú hay các phương thuốc sơ khai, vì chúng vô hiệu. Ta đề nghị hàng ngày dùng một số thảo dược, như thân cây thì là, dưa leo, và nhựa trầm. Nó có thể trung hòa dịch đen, cân bằng lại dịch thể, và tăng sức mạnh tâm linh, chắc chắn có lợi cho ngươi.\""
  fp3_yearly.8039.a: "Có vẻ đáng thử."
  fp3_yearly.8039.b: "Ta muốn giữ niềm tin vào chế độ ăn, cứ tiếp tục một thời gian nữa."
  fp3_yearly.8039.c: "Ta chán ngươi và các phương thuốc vô dụng. Đi đi."

  fp3_yearly.8040.t: "Sức Mạnh Tâm Linh"
  fp3_yearly.8040.desc: "\"Than ôi, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]\", [persian_polymath.GetFirstName] nói. \"Mặc dù ta nghĩ chúng ta đã thấy một số cải thiện trong tâm trạng và tình trạng thể chất của ngài, nhưng ta vẫn chưa chữa khỏi chứng u sầu cho ngài. Các căn bệnh của tâm trí là những đối thủ cứng đầu. Tuy nhiên, vẫn còn những phương thuốc để thử. Trong cuốn sách của mình, ta đã khẳng định rằng tâm lý con người là một hệ thống độc lập, tác động đến khía cạnh thể chất của [persian_polymath.GetHerHis]. Chúng ta phải cải thiện năng lực tâm linh của ngài, bằng cách chứng minh với tiềm thức của ngài rằng tinh thần là vĩnh cửu, không bị cái chết làm hoen ố. Nói một cách đơn giản - ngài phải khẳng định lại đức tin của mình vào [ROOT.GetCharacter.GetFaith.HighGodNameAlternate].\""
  fp3_yearly.8040.a: "Ta sẽ tìm học Sufi."
  fp3_yearly.8040.b: "Ta sẽ tham khảo [court_chaplain.GetTitledFirstName]."
  fp3_yearly.8040.c: "Đức tin ta chưa từng lung lay. Ngươi coi ta là ai?"
  fp3_yearly.8040.d: "Vô ích, đi bán những \"thuốc\" đó chỗ khác đi."
  fp3_refusing_faith_treatment_flavor: "Ngươi từ chối phương pháp này, nhưng nỗ lực của [persian_polymath.GetFirstNamePossessiveNoTooltip] có thể vẫn tiếp tục."

  fp3_yearly.8041.t: "An Ủi Trong Im Lặng"
  fp3_yearly.8041.desc: "\"Con đường này khó nhọc\", [sufi_mystic.GetName] nói sau khi nghe về rắc rối của Ta.\n\n\"Các đường lối #italic tariqa#! của dòng Sufi có thể mang lại hiểu biết về bản thân và vũ trụ, nhưng cần kỷ luật khắt khe để đạt được. Ta chỉ là người nhập môn. Tuy nhiên, [ROOT.Char.GetTitleTierName], chúng ta có thể thử đạt #italic fana#!, trạng thái thiền khi ngươi, như một giọt nước nhỏ trong giấc mơ của [ROOT.GetCharacter.GetFaith.HighGodNameAlternatePossessive], nhận ra biển cả xung quanh. Ta nghĩ điều này sẽ mang lại góc nhìn mới về cuộc sống ngắn ngủi này.\""
  fp3_yearly.8041.a: "Ta sẵn sàng."
  fp3_yearly.8041.b: "Ta muốn thử một phương pháp khác..."

  fp3_yearly.8042.t: "Linh Hồn Bất Diệt"
  fp3_yearly.8042.desc: "\"Quả thật\", [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName] nói, \"những gian truân và phiền muộn trong đời trần chỉ là phù du, nhưng linh hồn ngươi sẽ tồn tại. Dù ta hiểu, [ROOT.Char.Custom('FormOfAddressForLiege')], nếu lời này vẫn chưa đủ an ủi ngươi.\" \n\n[court_chaplain.GetSheHe|U] trải ra một cuộn giấy. \"Đây là một phần của [ROOT.Char.GetFaith.ReligiousText2], được chép lại bởi các [ROOT.Char.Custom('LevyMenWomen')] thánh thiện, thông thái hơn chúng ta nhiều. Nó chứa những mô tả sống động về cõi vĩnh hằng, và những câu thơ có thể gợi ý ý nghĩa của tất cả. Ta gợi ý ngươi hãy học đi học lại nhiều lần nếu cần, cho đến khi tâm hồn ngươi thanh thản. Nhưng nếu ngươi không thích đọc sách, có thể tới [ROOT.Char.GetFaith.HouseOfWorship], để đối thoại nội tâm với [ROOT.GetCharacter.GetFaith.HighGodName].\""
  fp3_yearly.8042.a: "Chỉ cần đọc văn bản là đủ."
  fp3_yearly.8042.b: "Có lẽ [ROOT.Char.GetFaith.HouseOfWorship] thích hợp hơn với ta."
  fp3_yearly.8042.c: "Có vẻ cuối cùng ngươi cũng không giúp được ta."

  fp3_yearly.8043.t: "Hết Phương Thuốc"
  fp3_yearly.8043.desc: "[persian_polymath.GetFirstName] đã quan sát ta nhiều tuần liền, trầm ngâm suy nghĩ.\n\n\"Thật tiếc, ta đã hết cách, đại [ROOT.Char.GetTitleTierName]. Ta đã dùng mọi kiến thức và kỹ năng sẵn có, nhưng như đã nói, bệnh tâm trí khó chữa. Tuy nhiên, ta nghĩ chúng ta đã tiến triển, khi dịch thể của ngươi dường như cân bằng hơn và tinh thần ngươi mạnh mẽ hơn. Nếu ngươi kiên nhẫn, tiếp tục ăn cá và dùng một số thảo dược ta kê, nếu [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] muốn, ngươi có thể chiến thắng #italic malikhulia#!\" \n\n\"Nhưng ta phải đi, vì còn kiến thức khác cần theo đuổi.\""
  fp3_yearly.8043.a: "Ta sẽ mua cho ngươi mọi cuốn sách ngươi muốn. Ta vẫn cần ngươi."
  fp3_yearly.8043.b: "Có lẽ từ đầu đã vô vọng."
  fp3_polymath_stays_flavor: "[persian_polymath.GetFirstNameNoTooltip] ở lại triều đình ngươi."

  fp3_yearly.8044.t: "Ánh Sáng Của Thế Gian"
  fp3_yearly.8044.desc: "Suốt thời gian dài, thế giới dường như tẻ nhạt và u sầu. Những điều từng khiến ta vui giờ chỉ là những thứ thoáng qua, trống rỗng ý nghĩa. Tâm trí ta lang thang đến những vùng tối tăm, và giấc mơ đầy nỗi sợ. Nhưng nỗi u uất dai dẳng đó bắt đầu tan biến.\n\nKhi nhìn ra xung quanh, ta thấy ánh sáng xuyên qua mây. Ta thấy vẻ đẹp trái đất và mọi bí ẩn. Có lẽ là nhờ các phương thuốc [persian_polymath.GetFirstName] kê, có lẽ còn lý do khác. Ta không biết chắc. Nhưng trong lòng đã có sự thay đổi. Ta cảm thấy trọn vẹn trở lại."
  fp3_yearly.8044.a: "Ta nên trân trọng cảm giác này, vì có thể nó sẽ không kéo dài."

 # Sick Monkey Chain 
  fp3_yearly.8045.t: "Gói Bí Ẩn"
  fp3_yearly.8045.desc: "Trong một buổi đi dạo dưới ánh trăng, Ta gặp [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName], bồng một gói to như trẻ sơ sinh. Nhưng nhìn bên ngoài có thể đánh lừa — những âm thanh lạ phát ra từ gói và khuôn mặt [buzina_enthusiast.GetNamePossessiveNoTooltip] đầy vết xước.\n\n\"Đây không phải trẻ em, [ROOT.Char.Custom('FormOfAddressForLiege')], mà là một con khỉ,\" [buzina_enthusiast.GetSheHe] thì thầm. \"Khi thu thuế cho [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], ta chấp nhận nó thay cho vàng. Người ta nói nó từng thuộc về một vị vua phương Đông vĩ đại, dạy nó chơi cờ. Nhưng tiếc thay, nó đã bệnh và trở nên... hung hãn một chút.\" \n\n[buzina_enthusiast.GetSheHe|U] trao gói cho Ta và tiếp tục: \"Nhưng chắc chắn, dưới sự chăm sóc của ngươi, nó sẽ sớm hồi phục.\""
  fp3_yearly.8045.a: "Thầy thuốc của ta chắc có phương thuốc..."
  fp3_yearly.8045.b: "Ta trả tiền để thu vàng, #EMP không phải khỉ!#!"
  fp3_yearly.8045.c: "Ta không chắc về việc này..."
  sick_monkey_flavor_desc: "Một con khỉ biết chơi cờ chắc hẳn sẽ rất thú vị"
  playing_with_monkey.tt: "Mở khóa quyết định Chơi với Khỉ [decision|E] miễn là ngươi giữ nó"
  fp3_inspired_tax_collector: "[buzina_enthusiast.GetShortUIName] cố gắng thu thuế tốt hơn"

  fp3_yearly.8046.t: "Thuốc Cho Khỉ"
  fp3_yearly.8046.desc: "\"Theo ta biết\", [court_physician.GetName] nói, \"khỉ là hậu duệ Gayōmart, người đàn ông đầu tiên. Cơ thể chúng tương tự chúng ta, có lẽ cả tinh thần cũng vậy. Một số, nghe nói, còn biết nói!\"\n\n\"Ta có thể chữa căn bệnh nhỏ này, nhưng cách tốt nhất là dùng thảo dược đắt tiền. Ngoài ra có thể dùng chế độ ăn cá muối và nhựa trầm...\"\n\n[court_physician.GetSheHe|U] nhìn móng khỉ sắc nhọn với vẻ lo lắng."
  fp3_yearly.8046.a: "Không tiếc chi phí."
  fp3_yearly.8046.b: "Nó khỏe mạnh, chế độ ăn hợp lý là đủ."
  fp3_wait_and_see.tt: "Chỉ thời gian mới cho biết phương thuốc có hiệu quả"
  monkey_recover_better_chances_tt: "Khả năng hồi phục của khỉ sẽ được cải thiện"

  playing_chess_with_monkey.tt: "Ngươi có thể dùng tương tác Thách Đấu Trò Cờ [interaction|E] miễn là khỉ còn sống."

  fp3_yearly.8047.t: "Cảm Giác Khỏe Lại"
  fp3_yearly.8047.desc: "Thầy thuốc đưa Ta con khỉ ốm mà [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))], [buzina_enthusiast.GetName] trước đây mang về nhà.\n\n\"Chúa công, ta vui thông báo rằng khỉ đã lấy lại sinh khí và tính tình dịu đi. Dù không phải là #EMP bậc thầy#! cờ, nhưng chắc chắn đã được huấn luyện chơi trò này ở mức nhất định.\"\n\nNgay cả khi khỉ không phải bậc thầy cờ, người ta sẽ từ xa đến tận nơi để chiêm ngưỡng sự kỳ diệu này..."
  fp3_yearly.8047.a: "Đến lúc gửi thư mời rồi!"

  monkey_died_from_sickness_toast: "Khỉ cưng của ngươi đã chết vì bệnh."

 ##################################################
 # ZOROASTRIAN EVENTS 
 ##################################################

  fp3_yearly.8050.t: "Số Phận Của Người Chết"
  fp3_yearly.8050_zoroastrian.desc: "Là [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], chúng ta có bổn phận thiêng liêng chống lại ảnh hưởng của Nasu, vị daeva của sự suy tàn. Vì vậy [dakhma_enthusiast.GetCouncilTitle] [dakhma_enthusiast.GetFirstName] tỏ ra khá lo lắng trước tin tức mà [dakhma_enthusiast.GetSheHe] mang về từ [dakhma_county.GetName]."
  fp3_yearly.8050_unzoroastrian.desc: "Có những lời phàn nàn về nghi lễ mai táng của thần dân Zoroastrian tại [dakhma_county.GetName], và [dakhma_enthusiast.GetCouncilTitle] [dakhma_enthusiast.GetFirstName] tỏ ra đặc biệt lo lắng."
  fp3_yearly.8050_early_period.desc: "\n\n\"Trước đây, đại [ROOT.Char.GetTitleTierName] khôn ngoan của ta\", [dakhma_enthusiast.GetSheHe] bắt đầu, \"truyền thống là để xác chết phơi ngoài thiên nhiên, để không làm ô uế ba yếu tố thiêng liêng.\"\n\n\"Nhưng khi các khu định cư phát triển ở [dakhma_county.GetNameNoTierNoTooltip], không còn đủ không gian, và con người vô tình làm phiền xác chết. Chúng ta nên xây một #italic dakhma#!, Tháp Im Lặng, nơi người chết được an toàn, tiếp xúc với chó và chim ăn xác thối, cho đến khi chỉ còn bụi tro.\""
  fp3_yearly.8050_late_period.desc: "\n\n\"Ngày xưa, đại [ROOT.Char.GetTitleTierName] khôn ngoan\", [dakhma_enthusiast.GetSheHe] nói, \"một #italic dakhma#! nhỏ đã được xây ở [dakhma_county.GetNameNoTierNoTooltip], nơi xác chết có thể phơi ngoài trời và tiếp xúc chim ăn xác thối. Nhưng tháp này đã cũ và sụp đổ, có lo ngại rằng chất thải từ xác chết đã thấm ra, làm ô uế ba yếu tố thiêng liêng.\"\n\n\"Người dân địa phương sẽ rất biết ơn nếu chúng ta giúp họ xây một tháp mới, nơi người chết được yên ổn.\""
  fp3_yearly.8050.a: "Kiến trúc sư của ta, [architect.GetFirstNameNoTooltip], có thể giúp tiết kiệm chút chi phí..."
  fp3_yearly.8050.b: "Chắc chắn, ta sẽ đóng góp một phần kho báu cho việc này."
  fp3_yearly.8050.c: "Những ngoại đạo đó muốn để xác chết ở mương thì mặc họ."
  fp3_yearly.8050.d: "Nghe có vẻ tốn kém. Cách cũ vẫn hiệu quả, giờ cũng vậy thôi."
  fp3_zoroastrian_courtiers_and_vassals_happy: "Các [GetReligionByKey('zoroastrianism_religion').GetAdjective] [courtiers|E], [guests|E] và [vassals|E] ngoan đạo sẽ tăng [opinion|E] về ngươi."
  building_a_dakhma.failure: "[architect.GetFirstName] thiết kế Tháp Im Lặng sai"
  building_a_dakhma.success: "[architect.GetFirstName] thiết kế Tháp Im Lặng thành công"
  fp3_cheap_architecture_flavor: "Càng rẻ càng tốt!"
  fp3_silence_architecture_success_toast: "Tiết kiệm chi phí thành công"
  fp3_silence_architecture_failure_toast: "Việc xây dựng #italic rất#! đáng nghi ngờ"

  fp3_yearly.8051.t: "Ngọn Lửa Tinh Khiết Nhất"
  fp3_yearly.8051_opening.desc: "Ngọn lửa thiêng từng cháy trong đền [sacred_fire_province.GetName] gần đây"
  fp3_yearly.8051_torrential_rain: "bị dập tắt bởi cơn mưa như trút, mạnh đến nỗi thấm qua mái đền xuống lửa phía dưới."
  fp3_yearly.8051_earthquake: "bị dập tắt khi trận động đất rung đền, gần như làm tách đôi công trình."
  fp3_yearly.8051_sandstorm: "bị dập tắt bởi cơn bão cát mạnh, phá hỏng cửa đền."
  fp3_yearly.8051_gust_of_wind: "bị dập tắt bởi một cơn gió lạnh, chắc từ một khe hở trong tường đền."
  fp3_yearly.8051_islamic_zealots: "bị dập tắt bởi những kẻ cuồng tín Hồi giáo, phá đền và báng bổ theo cách rất sáng tạo."
  fp3_yearly.8051_invisible_hand: "và bị dập tắt một cách bí ẩn, như bởi bàn tay vô hình."
  fp3_yearly.8051_ending.desc: "Dù điềm xấu, [magi.GetName] dường như không thất vọng.\n\n\"Chúng ta phải nhóm lại ngọn lửa\", [magi.GetSheHe] tuyên bố. \"Ngọn lửa tinh khiết và vĩ đại nhất là #italic Atash Behram#!, Lửa Chiến Thắng, sinh ra từ sấm sét giữa mây. Nhưng vì đây là đền nhỏ, có lẽ chúng ta chỉ lấy #italic Atash Adaran#!, Lửa Các Ngọn Lửa, mà lò thợ kim hoàn có thể tạo. Hoặc loại thấp nhất, #italic Atash Dadgah#!, có thể làm từ bất cứ ngọn lửa gia đình nào...\""
  fp3_yearly.8051.a: "Chỉ sấm sét mới được. Ta sẽ tìm cho ngươi."
  fp3_yearly.8051.b: "Hãy lấy ngọn lửa của thợ kim hoàn."
  fp3_yearly.8051.c: "Ta không bận tâm điềm báo. Ngọn lửa gia đình là đủ."
  fp3_yearly.8051_chasing_lightning.tt: "Ngươi sẽ chờ cơn giông sấm tới..."

  fp3_yearly.8052.t: "Theo Đuổi Mây"
  fp3_yearly.8052.desc: "[ROOT.Char.GetFaith.AltPriestTermPlural] liên tục nhắc nhở ta về lời hứa tìm Lửa Chiến Thắng cho đền ở [sacred_fire_province.GetName]. Không phải ta quên đâu... Ta đã cử trinh sát khắp nơi để tìm cơn giông, để tìm dấu hiệu từ [ROOT.GetCharacter.GetFaith.HighGodName]. Nhưng sấm sét vẫn khó nắm bắt.\n\nGiờ đây ta đứng ngoài [ROOT.Char.Custom('ResidenceBuilding')], nghe tiếng sấm rền xa và chớp lóe trên mây đen. Hầu cận vội vã, cố bắt sấm bằng cột cao, trong khi ta quan sát đất trời, tìm bất kỳ tia lửa nào. Mọi nỗ lực vô ích — mây tan, sấm biến mất vào trời cao.\n\n[ROOT.GetCharacter.GetFaith.HighGodName], phải chăng đây là ý muốn của ngài? Ta sẽ không bao giờ tìm thấy ngọn lửa mình mong?" 
  fp3_yearly.8052.a: "Ta chỉ nên mang lửa thợ kim hoàn cho đền..."
  fp3_yearly.8052.b: "Ta có thể lấy ngọn lửa thấp hơn."
  fp3_give_up_the_quest.flavor: "Ngươi từ bỏ nhiệm vụ tìm Lửa Chiến Thắng... tạm thời."
  
  fp3_yearly.8053.t: "Ngọn Lửa Chiến Thắng"
  fp3_yearly.8053.desc: "Ngày tuần trôi qua, trinh sát tìm khắp vương quốc lửa từ sấm, vô ích. Khi ta bắt đầu nản chí, bỗng mây đen tụ lại xa xa, tiếng sấm vang vọng. Ta vội bước ra khỏi [ROOT.Char.Custom('ResidenceBuilding')] hướng về bão, hầu cận theo sau, và đúng thật, cơn bão tiến gần, như bị bàn tay vô hình dẫn dắt.\n\nRồi ngay trước mắt, ánh sáng rực xuyên qua mây, chiếu xuống như mũi giáo từ [ROOT.Char.GetFaith.DivineRealm], trúng một cây cô độc. Gỗ khô bốc cháy ngay, ngọn lửa trắng như tinh khiết #italic fravashi#!. Ta đã tìm thấy, Ngọn Lửa Chiến Thắng. Nó đến với ta!"
  fp3_yearly.8053.a: "Ta không thể tin nổi..."


 ##################################################
 # SCHOLARSHIP EVENTS 
 ##################################################
  fp3_scholarship.0001.t: "Học Giả Đã Đến"
  fp3_scholarship.0001.desc: "[scholar.GetTitledFirstName] đã đến với hy vọng nhận được bảo trợ khoa học."

  fp3_scholarship.1000.t: "Aryabhata Thứ Hai"
  fp3_scholarship.1000.desc: "Danh tiếng toán học Ấn Độ đã đến tai ta, ngay cả từ những học trò số học thấp nhất. Nếu ta lấp đầy cung điện với các học giả [nearby_indian_ruler.GetCulture.GetName], thì có lẽ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] sẽ trở thành trung tâm toán học thực thụ.\n\nTa có thể yêu cầu [nearby_indian_ruler.GetTitledFirstName] gửi vài học giả như vậy, nhưng liệu [nearby_indian_ruler.GetSheHe] có chấp nhận đề nghị này?"
  fp3_scholarship.1000.a: "[nearby_indian_ruler.GetSheHe|U] chắc chắn sẽ không từ chối yêu cầu của ta."
  fp3_scholarship.1000.b: "Một món quà hào phóng sẽ làm đề nghị thêm hấp dẫn."
  fp3_scholarship.1000.c: "Các học giả [ROOT.Char.GetCulture.GetNameNoTooltip|U] không cần sự giúp đỡ của [nearby_indian_ruler.GetCulture.GetNameNoTooltip]!"
  fp3_scholarship.1000.duel_success: "[nearby_indian_ruler.GetNameNoTooltip] chấp nhận yêu cầu của ta."
  fp3_scholarship.1000.duel_success_tt: "Một số nhà toán học [nearby_indian_ruler.GetCulture.GetNameNoTooltip] sẽ sớm đến triều đình ta."
  fp3_scholarship.1000.duel_failure: "[nearby_indian_ruler.GetNameNoTooltip] cười nhạo sự táo bạo của ta."
  fp3_scholarship.1000.gift_failure: "[nearby_indian_ruler.GetNameNoTooltip] giữ lại món quà của ta."
  fp3_scholarship.1000.native_tt: "Một nhà toán học văn hóa [SCOPE.GetRootScope.GetCharacter.GetCulture.GetNameNoTooltip] sẽ được nâng lên triều đình nhờ tài trợ của chúng ta."
  fp3_scholarship.1001.t: "Nhà Toán Học Đã Đến"
  fp3_scholarship.1001.desc: "[mathematician.GetTitledFirstName] được [nearby_indian_ruler.GetTitledFirstNameNoTooltip] gửi đến triều đình ta."
  fp3_scholarship.1001.native.desc: "[mathematician.GetTitledFirstName] hiện đã gia nhập triều đình."
  fp3_scholarship.1000.d: "Ta không có thời gian hay hứng thú cho việc này."

  fp3_scholarship.1010.t: "Pháp Sư Đơn Độc"
  fp3_scholarship.1010.desc_dying_faith: "\"Chúng Ta chỉ mong được thực hành đức tin trong yên bình đến cuối đời. Nếu ngươi hứa điều này, ta sẽ phục vụ ngươi đến khi tim ngừng đập.\"\n\nDù đức tin [magus_faith.GetName] đang lụi tàn, những tín đồ lang thang vẫn tồn tại trong các đền lửa bỏ hoang ở [magus_county.GetProvince.GetCounty.GetName]. Vị linh mục này giờ quỳ trước [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] của ta, van xin khoan dung."
  fp3_scholarship.1010.desc_living_faith: "\"Xin thương xót! Chúng Ta chỉ muốn tôn vinh tổ tiên. Nếu ngươi bảo vệ chúng Ta, ta hứa sẽ phục vụ ngươi tận ngày cuối đời.\"\n\nĐức tin [magus_faith.GetName] vẫn là gai trong mắt ta, dường như các đền lửa ở [magus_county.GetProvince.GetCounty.GetName] lại nóng lên ban đêm. [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] và ta đã bắt gặp một pháp sư lầm lạc trong nghi lễ bí ẩn, nhưng thay vì chạy trốn, y dũng cảm quỳ trước ta."
  fp3_scholarship.1010.a: "Không bao giờ, [ROOT.Char.GetFaith.HighGodName] muốn ngươi thất bại!"
  fp3_scholarship.1010.b: "Ta sẽ bảo vệ [magus_county.GetNameNoTooltip]."
  fp3_scholarship.1010.b.tt: "[magus_county.GetNameNoTooltip] không thể bị cải đạo trong 20 năm\n[magus.GetShortUINameNoTooltip] không bao giờ bị cải đạo."
  fp3_scholarship.1010.c: "Không hứa cho tương lai, nhưng ta để ngươi đi."

  fp3_scholarship.2000.t: "Đáng Giá"
  fp3_scholarship.2000.desc: "Nguồn cung giấy từ phương Đông gần như cạn kiệt, một số nhà thơ phải dùng lá cọ và vỏ cây để ghi chép. Ngay cả Học Giả Triều Đình [court_scholar.GetTitledFirstName] cũng khó mà có được lá vàng.\n\n\"Ta có thể quay lại dùng da cừu, nhưng rất hiếm hiện nay. Thêm giấy chắc chắn là giải pháp tốt hơn...\""
  fp3_scholarship.2000.a: "Tất cả giấy sẽ được thu cho mục đích của ngươi."
  fp3_scholarship.2000.b: "Vậy chúng ta phải nhập khẩu giấy."
  fp3_scholarship.2000.c: "Ngươi phải tạm dùng những gì có sẵn."

  fp3_scholarship.2010.t: "Trí Tuệ Lỏng"
  fp3_scholarship.2010.desc: "Các nhân viên kiểm duyệt của ta thông báo rằng Học giả Cung đình [court_scholar.GetTitledFirstName] đang lén lút uống rượu cùng một học giả ngoại quốc.\n\nNếu là với bất kỳ ai khác, ta sẽ phá vỡ cuộc hẹn này và đưa ra một lời cảnh cáo nghiêm khắc cho [court_scholar.GetTitledFirstNameNoTooltip]. Tuy nhiên, [court_scholar.GetSheHe|U] dường như đang tham gia vào một cuộc trò chuyện khai sáng với người bạn đồng hành của [court_scholar.GetHerHis], hoặc đó là những gì ta được kể."
  fp3_scholarship.2010.a: "Nhiệm vụ với [ROOT.Char.GetFaith.HighGodName] là trên hết."
  fp3_scholarship.2010.b: "Có thể họ chỉ đang uống trà?"

  fp3_scholarship.2020.t: "Những Hiểu Biết U Ám"
  fp3_scholarship.2020.desc: "\"Nghiên cứu của Ta đã gặp bế tắc,\" Học Giả Triều Đình [court_scholar.GetTitledFirstNameNoTooltip] nói với ta [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', court_scholar)]. \"Sách vở chỉ giúp được đến mức này. Nhưng nếu ngươi cho Ta mượn [specimen.GetTitledFirstName] một thời gian ngắn, Ta tin chúng ta sẽ có bước đột phá.\"\n\n[court_scholar.GetSheHe|U] không đảm bảo an toàn cho [specimen.GetTitledFirstNamePossessiveNoTooltip]."
  fp3_scholarship.2020.a: "Ngươi có toàn quyền của ta."
  fp3_scholarship.2020.b: "Giữ thí nghiệm xoắn này trong nhật ký thôi."

  fp3_scholarship.2030.t: "Công Bố Phát Hiện"
  fp3_scholarship.2030.desc: "\"...và vì vậy Ta rất vui được báo cáo tiến bộ ổn định trong hiểu biết về [ROOT.Char.Custom('education_conversation_subject')].\"\n\nĐôi khi khó biện minh việc giữ học giả trong triều. Công việc họ hiếm khi trực tiếp lợi cho vương quốc. Không nghi ngờ gì, Học Giả Triều Đình [court_scholar.GetName] biết rõ điều này [court_scholar.GetHerselfHimself]. Báo cáo chi tiết hôm nay được trình bày với nhiệt tình đến mức gần như giả tạo."
  fp3_scholarship.2030.a: "Tiến bộ chỉ có lợi thôi."
  fp3_scholarship.2030.tt: "[court_scholar.GetNameNoTooltip] được hưởng lợi từ các trung tâm nghiên cứu trong vương quốc ngươi."

  fp3_research_project_title: "Nghiên Cứu:"

  fp3_scholarship_research_success_loss_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] sẽ có #N cơ hội thấp hơn#! để thành công."
  fp3_scholarship_research_success_slight_loss_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] sẽ có #N cơ hội hơi thấp hơn#! để thành công."
  fp3_scholarship_research_success_gain_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] sẽ có #P cơ hội cao hơn#! để thành công."
  fp3_scholarship_research_success_slight_gain_effect: "[inspiration_owner.GetShortUINamePossessive|U] [research_project|E] sẽ có #P cơ hội hơi cao hơn#! để thành công."
 
  fp3_scholarship.8000.t: "Một $game_concept_research_project$ Mới"
  fp3_scholarship.8000.desc: "Học Giả Triều Đình [court_scholar.GetName] vội đến với vài hầu cận, tất cả mang sách, cuộn giấy, hoặc da giấy cổ.\n\n\"Ta tin có thể đạt bước đột phá, nếu chỉ được đủ thời gian, kinh phí, và đủ mực để nhuộm sông Ấn Độ màu đen.\""
  fp3_scholarship.8000.a: "Cầm quyền đi, [court_scholar.GetFirstNameNoTooltip]."
  fp3_scholarship.8000.b: "Có lẽ lúc khác?"
  fp3_scholarship.8000.a.tt: "[court_scholar.GetFirstNameNoTooltip] sẽ bắt đầu thực hiện [research_project|E]"

  fp3_scholarship.8500.t: "Sức Hút Của Vàng"
  fp3_scholarship.8500.desc: "\"Ta chắc chắn rằng mình có thể khám phá những bí mật của chính sự sáng tạo, nếu ngài chỉ cần cung cấp cho ta đúng công cụ và trợ lý!\"\n\n[court_scholar.GetName], Học giả Cung đình của ta, đã nói chuyện được một lúc rồi. [court_scholar.GetSheHe|U] đang khẩn nài ta cho phép [court_scholar.GetHerHim] tiêu #EMP vàng và bạc của ta#!, vào việc cố gắng khám phá bí mật về cách các nguyên tố, chẳng hạn như #EMP vàng#! và #EMP bạc#!, được tạo ra.\n\n[court_scholar.GetFirstNameNoTooltip] rõ ràng rất phấn khích, và thật ấn tượng khi [court_scholar.GetSheHe] đã xoay xở để hiểu được những ghi chú bí ẩn như những gì mà [court_scholar.GetSheHe] đã giải mã về chủ đề này, nhưng không rõ liệu đây có phải là một nỗ lực có lợi hay không."
  fp3_scholarship.8500.a.tt: "[court_scholar.GetFirstNameNoTooltip] sẽ bắt đầu thực hiện Alchemy [inspiration|E]"

  fp3_scholarship.8600.t: "Sức Mạnh Của Chữ Viết"
  fp3_scholarship.8600.desc: "\"Sự hỗ trợ liên tục của ngươi đã cao quý và vị tha, nhưng những quan sát thông minh mà không ghi chép sẽ dễ bị quên lãng! Ai sẽ biết suy nghĩ của ta khi ta chết và không thể nói? Thế giới sẽ nghèo nàn nếu chúng không được lưu giữ.\"\n\n[court_scholar.GetName], Học Giả Triều Đình, có dự án mới. [court_scholar.GetSheHe|U] muốn thuyết phục ta tài trợ tạo ra một cuốn sách mới. Một bản thảo xa hoa mà [court_scholar.GetSheHe] khẳng định sẽ khiến đối thủ ghen tỵ.\nCó lẽ ý tưởng này cũng vì uy tín của [court_scholar.GetHerHis] như vì ta, nhưng không có nghĩa là xấu..."
  fp3_scholarship.8600.a.tt: "[court_scholar.GetFirstNameNoTooltip] sẽ bắt đầu thực hiện [inspiration|E] để viết một cuốn sách."

  fp3_scholarship.8999.tt_failure: "Nghiên cứu của [court_scholar.GetShortUINamePossessiveNoTooltip] không tạo ra gì hữu ích."
  fp3_scholarship.8999.tt_success: "[court_scholar.GetShortUINameNoTooltip] đạt bước đột phá khoa học nhỏ cho nhà [THIS.Char.GetHouse.GetNameNoTooltip]."
  fp3_scholarship.8999.tt_crit_success: "[court_scholar.GetShortUINameNoTooltip] khám phá một sáng kiến mới cho văn hóa [THIS.Char.GetCulture.GetName]."
 
  fp3_scholarship.8100.t: "$fp3_research_project_title$ Thư Viện Tốt Hơn"
  fp3_scholarship.8100.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] liên tục phàn nàn về trạng thái thư viện hoàng gia, mang đến trước ta đống cuộn giấy vàng ố và sách mục nát.\n\n\"Một số văn bản đã cũ hàng trăm năm, thậm chí hơn. Ta làm sao nghiên cứu mới nhất với những cuốn sách cổ như vậy?\""
  fp3_scholarship.8100.a: "Thư viện hoàng gia sẽ được trang bị theo ý ngươi."
  fp3_scholarship.8100.b: "Thư viện hoàng gia hiện tại là hoàn hảo."

  fp3_scholarship.9000.t: "$fp3_research_project_title$ Thất Bại"
  fp3_scholarship.9000.desc: "\"Không được đâu!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] hét lên với ta. Đôi mắt [inspiration_owner.GetHerHis|U] tối sầm vì bao đêm thức trắng.\n\n\"Ta không thể nhìn ra ngoài biển số liệu. Phải bỏ dự án này, ít nhất là tạm thời.\""
  fp3_scholarship.9000.a: "Thôi được rồi."
  fp3_scholarship.9000.b: "Ta trả lương cho ngươi nghiên cứu, chứ không phải bào chữa!"

  fp3_scholarship.9100.t: "$fp3_research_project_title$ Phát Hiện Mới"
  fp3_scholarship.9100.desc: "\"[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]! Công việc của Ta đã hoàn tất.\"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nói dài về các phát hiện của họ, và cách chúng có thể ảnh hưởng đến vương quốc. Ta cố chen lời nhưng vô ích.\n\nKhi [inspiration_owner.GetSheHe] cuối cùng ngồi xuống, Ta thấy sự bối rối của mình phản chiếu trong mắt các triều thần, nhưng Ta vẫn đưa ra câu trả lời duy nhất có thể."
  fp3_scholarship.9100.a: "Làm tốt lắm, [inspiration_owner.GetShortUINameNoTooltip]."

  fp3_scholarship.9200.t: "$fp3_research_project_title$ Sáng Kiến Mới"
  fp3_scholarship.9200.desc: "\"[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]!\" tiếng kêu vang lên với ta. Ta quay lại và thấy đôi mắt của [inspiration_owner.GetHerHis] mệt mỏi trong niềm vui và vòng tay đầy những bản thảo; công việc của [inspiration_owner.GetHerHis] đã hoàn thành.\n\nTa sẽ chỉ hiểu sau này ý nghĩa về khám phá của [inspiration_owner.GetHerHis], và ta sẽ không sống đủ lâu để thấy chúng thay đổi toàn bộ lịch sử. Nhưng bây giờ, chỉ cần ta nói:"
  fp3_scholarship.9200.a: "Rất xuất sắc."

  fp3_scholarship.9900.t: "$fp3_research_project_title$ Bị Hủy"
  fp3_scholarship.9900.tt: "[court_scholar.GetShortUIName|U] đã qua đời và không thể tiếp tục nghiên cứu của [court_scholar.GetHerHis]."
  fp3_scholarship.9901.tt: "[court_scholar.GetShortUIName|U] không còn là $court_scholar_court_position$ của Ta và không thể tiếp tục nghiên cứu của [court_scholar.GetHerHis]."

 # Al-Khul Event
  fp3_h_yearly.0001.t: "Sức Hút Của Al-Khul"
  fp3_h_yearly.0001.desc.main: "Khi ta đang thư giãn ở một góc yên tĩnh của [ROOT.Char.Custom( 'FortifiedBuilding' )] tại [ROOT.GetCharacter.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip], trên tay là một ly [ROOT.Char.Custom('RegionalAlcoholicDrink')], thì [ulema_member.GetName], vị [ROOT.Char.Custom2('RelationToMe', ulema_member)] của ta tiến lại gần với vẻ mặt nghiêm nghị.\n\n\"Sự ám ảnh của ngài với #italic al-khul#! thật đáng xấu hổ!\nMột nửa số người trong triều đình này đã mất đi sự tôn trọng dành cho ngài và nửa còn lại đã đánh mất ý thức đạo đức của chính họ! Trên đường phố, những kẻ bất mãn đang công khai coi thường các quy tắc đức tin của chúng ta, đó là sự phản chiếu những tội lỗi của chủ nhân họ ngay trong chính cung điện này!\"\n\n[ulema_member.GetNameNoTooltip|U] giờ đang bốc hỏa, [ulema_member.GetSheHe] đang hét lên và thu hút sự chú ý. Một vài cận thần lặng lẽ đặt những chiếc ly của chính họ xuống, nóng lòng không muốn thu hút sự chú ý của vị giáo sĩ đang giận dữ."
  fp3_h_yearly.0001.a: "Lời nói dũng cảm cho một nô lệ của [ulema_member.Custom('RegionalAlcoholicDrink')]!"
  fp3_h_yearly.0001.a.notif.t: "Hãy làm theo lời Ta nói, đừng làm theo Ta!"
  fp3_h_yearly.0001.b: "Dù [ROOT.Char.Custom('RegionalAlcoholicDrink')] làm chậm trí, nó xoa dịu tinh thần."
  fp3_h_yearly.0001.bb: "Uống rượu là niềm vui của mọi [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]. Chúng ta không thể thiếu niềm vui đó!"
  fp3_h_yearly.0001.b.desc: "Ngươi cố thuyết phục [ulema_member.GetFirstNameNoTooltip] và triều đình rằng uống có thể có lợi."
  fp3_h_yearly.0001.b.success: "Ngươi làm [ulema_member.GetFirstNameNoTooltip] xấu hổ."
  fp3_h_yearly.0001.b.failure: "Ngươi làm bản thân trông ngu ngốc."
  fp3_h_yearly.0001.c: "Ta sẵn sàng làm một khoản từ thiện."
  fp3_h_yearly.0001.c.tt: "Ngươi cố hối lộ [ulema_member.GetNameNoTooltip]."
  fp3_h_yearly.0001.c.success: "Khoản đóng góp làm dịu phản đối của [ulema_member.GetNameNoTooltip]."
  fp3_h_yearly.0001.c.failure: "[ulema_member.GetNameNoTooltip] từ chối hối lộ."
  fp3_h_yearly.0001.d: "Ta chỉ là kẻ tội lỗi, nhưng sẽ cố gắng cải thiện."
  fp3_h_yearly.0001.e: "Im lặng! Ngươi quên đang nói với ai."

 # Seljuk story cycle
  fp3_story_cycle_seljuks_invasion_events.0001.t: "Du Mục Tuyệt vọng"
  fp3_story_cycle_seljuks_invasion_events.0001.desc: "Những người du mục [lead_seljuk.GetCulture.GetNameNoTooltip] từ biên giới đến cầu xin trước ta. Họ mong được định cư tại [fp3_seljuk_settle_target.GetNameNoTier]"
  fp3_story_cycle_seljuks_invasion_events.0001.desc_vassal: " như thần dân, hứa trung thành và hỗ trợ chiến đấu để được nghỉ dưới bóng quyền lực của ta.\n\nSự tuyệt vọng của họ rõ ràng. Không còn nơi nào khác, từ chối sẽ dẫn tới xung đột."
  fp3_story_cycle_seljuks_invasion_events.0001.desc_independent: " như láng giềng  mới, trao kiến thức chiến đấu để đổi lấy một phần đất.\n\nSự tuyệt vọng rõ ràng. Nhưng quân đội mạnh mẽ phía sau họ giống như một tối hậu thư hơn là một đề nghị."
  fp3_story_cycle_seljuks_invasion_events.0001.a_liege: "Miễn là đáp lời chủ, [fp3_seljuk_settle_target.GetNameNoTierNoTooltip] sẽ là của ngươi."
  fp3_story_cycle_seljuks_invasion_events.0001.a: "[fp3_seljuk_settle_target.GetNameNoTierNoTooltip] là của ngươi, láng giềng !"
  fp3_story_cycle_seljuks_invasion_events.0001.b: "Không bao giờ! Ta sẽ không để đất của ta bị ô uế chiếm!"

# Zanj Rebellion
  fp3_story_cycle_zanj_rebellion_events.0002.t: "Kẻ Nổi Loạn Nói Thẳng"
  fp3_story_cycle_zanj_rebellion_events.0002.desc: "[outspoken_rebel.GetName], kẻ nổi loạn lôi cuốn, từng cố lật đổ ở Bahrain, giờ xuất hiện tại [outspoken_rebel.GetCurrentLocation.GetCounty.GetName].\n\nNgười tự xưng thánh này đi lang thang vùng đầm lầy mặn, kích động dân. Trong số họ có Zanj từ miền đông châu Phi, nhiều người làm thuê hoặc nô lệ. Đây có thể là cơ hội bắt và trừng phạt [outspoken_rebel.GetHerHim]."
  fp3_story_cycle_zanj_rebellion_events.0002.a: "Chúng ta sẽ bẫy [outspoken_rebel.GetHerHim]."
  fp3_story_cycle_zanj_rebellion_events.0002.a.success: "Ngươi bắt được kẻ kích động."
  fp3_story_cycle_zanj_rebellion_events.0002.a.failure: "[outspoken_rebel.GetSheHe|U] trốn thoát."
  fp3_story_cycle_zanj_rebellion_events.0002.a.failure.tt: "Nguyên nhân của [outspoken_rebel.GetHerHis] sẽ thu hút thêm người theo."
  fp3_story_cycle_zanj_rebellion_events.0002.c: "Bỏ qua [outspoken_rebel.GetHerHim], [outspoken_rebel.GetSheHe] vô hại."
  fp3_story_cycle_zanj_rebellion_events_cause_strengthened_tt: "Nguyên nhân của [outspoken_rebel.GetName] được củng cố."
  fp3_story_cycle_zanj_rebellion_events_cause_greatly_strengthened_tt: "Nguyên nhân của [outspoken_rebel.GetName] được củng cố rất nhiều."
  fp3_zanj_rebellion_opressed_me: "Đã bị ngươi áp bức."
  fp3_story_cycle_zanj_rebellion_leaves_for_baghdad: "[outspoken_rebel.GetName] rời đi Baghdad."
  fp3_story_cycle_zanj_rebellion_events.0004.t: "Tự Xưng Thần Thánh"
  fp3_story_cycle_zanj_rebellion_events.0004.desc: "[zanj_leader.GetName], kẻ gây rối nổi tiếng, xuất hiện tại Baghdad. [zanj_leader.GetSheHe|U] trốn Basra sau khi nổi dậy thất bại. Kẻ xấc xược tự xưng là hậu duệ Zayd Ibn Ali và thuộc nhà Tiên tri.\n\nDù điều này vô lý, đối thủ có thể thuận tiện tin và gieo nghi ngờ về quyền lực hợp pháp của ta."
  fp3_story_cycle_zanj_rebellion_events.0004.a: "Ta sẽ bác bỏ những tuyên bố của [zanj_leader.GetHersHis]."
  fp3_story_cycle_zanj_rebellion_events.0004.a.success: "Ngươi chứng minh [zanj_leader.GetHerHim] là kẻ gian dối."
  fp3_story_cycle_zanj_rebellion_events.0004.a.failure: "Ta không thể bác bỏ tuyên bố phóng đại của [zanj_leader.GetHerHis]."
  fp3_story_cycle_zanj_rebellion_events.0004.b: "Ta sẽ bỏ qua kẻ ngốc này."

  fp3_story_cycle_zanj_rebellion_events.0006.t: "Một Zanj Tiến Bước"
  fp3_story_cycle_zanj_rebellion_events.0006.desc.a: "[zanj_representative.GetName], lãnh đạo công nhân Zanj, chịu trách nhiệm khai phá đầm lầy mặn Basra, đến cầu xin điều kiện làm việc tốt hơn. Họ sống ở đây nhiều thế hệ và là thiểu số đáng kể tại Basra.\n\n"
  fp3_story_cycle_zanj_rebellion_events.0006.desc.b: "Ta nghi ngờ [zanj_leader.GetName] và lời nói nổi loạn của [zanj_leader.GetHerHis] góp phần khiến họ bất mãn.\n\n"
  fp3_story_cycle_zanj_rebellion_events.0006.desc.c: "\"[ROOT.Char.GetTitleAsName], xin hỏi, [ROOT.Char.GetFaith.HighGodName] không trân trọng đối xử nhân đạo với người lao động sao, bất kể nguồn gốc?\""

  fp3_story_cycle_zanj_rebellion_events.0006.a: "Ngươi sẽ được thưởng vì làm việc chăm chỉ."
  fp3_rival_gave_title_away: "[CHARACTER.GetShortUIName|U] đã cho đất của [TARGET_CHARACTER.GetShortUIName] đi."
  fp3_landed_zanj_reason: "Đổi đất lấy hòa bình."
  fp3_story_cycle_zanj_rebellion_events.0006.b: "Ta có thể nhượng bộ một chút..."
  fp3_zanj_rebellion_interfered_with_my_workers: "[CHARACTER.GetShortUIName|U] can thiệp vào lực lượng lao động của [TARGET_CHARACTER.GetShortUIName]."
  fp3_story_cycle_zanj_rebellion_events.0006.c: "Đó là số phận của Zanj."
  fp3_rival_stayed_out_of_my_business: "[CHARACTER.GetShortUIName|U] không can thiệp việc của [TARGET_CHARACTER.GetShortUIName]."

  fp3_story_cycle_zanj_rebellion_events.0008.t: "Cuộc Nổi Dậy Zanj"
  fp3_story_cycle_zanj_rebellion_events.0008.desc.a: "Báo cáo nổi loạn ở đầm lầy mặn Basra đến tai ta."
  fp3_story_cycle_zanj_rebellion_events.0008.desc.b: "[zanj_leader.GetName], kẻ mà nhiều người cho là một tên lang băm vô hại, đã xoay xở để đoàn kết những người lao động Zanj bất mãn và các bộ lạc Ả Rập nổi loạn dưới lá cờ của [zanj_leader.GetHerHis]. Mặc dù [zanj_leader.GetHerHim] là người [zanj_leader.GetCulture.GetName] chứ không phải tự bản thân [zanj_leader.GetHerHim] là một người Zanj, những kẻ nổi loạn đã dần coi [zanj_leader.GetHerHim] như một thủ lĩnh."
  fp3_story_cycle_zanj_rebellion_events.0008.desc.c: "[zanj_leader.GetName], một người Zanj đặc biệt thẳng thắn, đã đoàn kết những người lao động làm việc quá sức và các bộ lạc Ả Rập nổi loạn dưới lá cờ của [zanj_leader.GetHerHis]. Mặc dù [zanj_leader.GetHerHim] là người [zanj_leader.GetCulture.GetName] chứ không phải tự bản thân [zanj_leader.GetHerHim] là người Ả Rập, những kẻ nổi loạn đã dần coi [zanj_leader.GetHerHim] như một thủ lĩnh."
  fp3_story_cycle_zanj_rebellion_events.0008.desc.d: "\n\nHọ đặt một sà lan trôi trên sông Basra, trên đó đặt đầu của các chủ nhân Zanj đã bị giết. Một thử thách không thể nhầm lẫn với quyền lực của ta."

  fp3_story_cycle_zanj_rebellion_events.0008.a: "Arvand sẽ trở thành dòng sông máu."
