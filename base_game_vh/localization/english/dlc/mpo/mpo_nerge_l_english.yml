l_english:
  hunt_type_nerge: "Nerge"
  hunt_type_nerge_desc: "$BULLET$ Săn hàng trăm con vật để thể hiện kỹ năng và sức mạnh\n$BULLET$ Nhận [legitimacy_i][legitimacy|E], [gold_i][gold|E], [dread_i][dread|E], và [prestige_i][prestige|E] tùy theo kết quả\n$BULLET$ Có thể nhận [martial_i][martial|E], [command_modifier_i][commander_traits|E], hoặc [trait_level_track_xp|E]\n$hunt_type_nerge_flavor$"
  hunt_type_nerge_flavor: "#weak Nerge là một cuộc săn lớn, nơi hàng trăm, nếu không muốn nói là hàng nghìn con vật bị giết. Đây là cơ hội để [GetPlayer.GetTitleAsNameNoTooltip] gây ấn tượng với cả chư hầu và các nước chư thuộc bằng sức mạnh của [GetPlayer.GetHerHis].#!"
  activity_window_character_master_of_chase: "Bậc thầy Săn"
  activity_hunt_conclusion_nerge_desc_failed: "Đó là một cuộc săn thất bại, thật xấu hổ cho tất cả những người tham gia."
  activity_hunt_conclusion_nerge_desc_standard: "Đó là một cuộc săn thành công, đáng nhớ trong năm tới. Thịt sẽ đủ để nuôi dân chúng một thời gian."
  activity_hunt_conclusion_nerge_desc_excellent: "Đó là một cuộc săn xuất sắc, sẽ được nhớ đến nhiều năm sau. Chúng Ta mang về thịt cho tất cả mọi người, và thời gian lễ hội đã đến."
  activity_hunt_location_nerge_recently_visited_tt: "Một [county|E] chỉ có thể tổ chức một [nerge|E] mỗi #V 30#! năm"
