 ### Events ###
  mpo_nerge.0010.t: "Bắt đầu Cuộc Săn Lớn Nerge"
  mpo_nerge.0010.desc.intro: "Các kỵ sĩ xếp hàng phía sau Ta, thành một cột kéo dài sang trái và phải. Tất cả đang chờ tín hiệu bắt đầu, để [ROOT.Char.GetTitleAsNameNoTooltip] bắt đầu cuộc săn lớn.\n\n"
  mpo_nerge.0010.desc.intro.master_of_hunt: "Các kỵ sĩ xếp hàng phía sau Ta, thành một cột kéo dài sang trái và phải. 'My [ROOT.Char.GetTitleAsNameNoTooltip], tất cả đang chờ tín hiệu bắt đầu.' [master_of_hunt.GetFirstName] nói với Ta, khi [master_of_hunt.GetSheHe] nghiêng gần hơn một chút. 'Mọi chuẩn bị đã xong.'\n\n"
  mpo_nerge.0010.desc.outro: "Ta căng dây tên, nâng cung, và thả mũi tên. Với tiếng la đau đớn, Ta thấy một con dê mũm mĩm rơi quằn quại xuống đất. Tiếng kêu hoảng loạn vang lên khi hỗn loạn lan ra giữa các con vật, tiếp theo là nhịp chân ngựa khi các kỵ sĩ lao vào cuộc săn."
  mpo_nerge.0010.desc.outro.alt.moh: "Ta gật đầu với [master_of_hunt.GetHerHim], và [master_of_hunt.GetSheHe] nâng cây cung đã lắp sẵn tên của [master_of_hunt.GetHerHis] lên. Nó ngân lên khi [master_of_hunt.GetSheHe] buông tên, theo sau là một tiếng hét của con vật. Cuộc đi săn bắt đầu."
  mpo_nerge.0010.desc.outro.alt: "Ta gật đầu với một trong những kỵ sĩ của mình, và [ROOT.Char.GetSheHe] nâng cây cung đã lắp sẵn tên của [ROOT.Char.GetHerHis] lên. Nó ngân lên khi [ROOT.Char.GetSheHe] buông tên, theo sau là một tiếng hét của con vật. Cuộc đi săn bắt đầu."
  mpo_nerge.0010.a: "Cho Ta thấy sức mạnh của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"

  mpo_nerge.0015.t: "$mpo_nerge.0010.t$"
  mpo_nerge.0015.desc: "Sau một hồi chờ đợi, cuối cùng chúng ta cũng xếp hàng. Sau một chút thảo luận qua lại, cuối cùng, [host.GetTitledFirstName] nâng cây cung của [host.GetHerHis] lên, để hạ con vật đầu tiên. Một tiếng kêu đau đớn theo sau là tiếng kêu be be hoảng loạn, khi lũ vật nuôi trở nên điên cuồng.\n\nNgay khi nghe tiếng hét, vài kỵ sĩ lập tức xuất phát. Tất cả họ đều đang cố gắng chứng tỏ bản thân, với chính mình, với nhau, và với [host.GetTitleAsNameNoTooltip]."
  mpo_nerge.0015.a: "Và Ta sẽ là thợ săn giỏi nhất ở đây!"

  mpo_nerge.0110.t: "Nerge Thất Bại"
  mpo_nerge.0110.desc: "Dù đã cố gắng hết sức, cuộc săn vẫn là một cảnh tượng đáng thất vọng. Một vài con vật đã chết, nhưng không nhiều như chúng Ta dự tính hay hy vọng.\n\nNhững người kỵ sĩ cùng Ta nhìn Ta với ánh mắt chán nản, nỗi xấu hổ nặng nề trên họ như trên Ta. Làm sao chúng Ta có thể xuất hiện ở [ROOT.Char.GetCapitalLocation.GetName] sau chuyện này?"
  mpo_nerge.0110.a: "Thật là xấu hổ..."

  mpo_nerge.0115.t: "Nerge Thành Công"
  mpo_nerge.0115.desc: "Khi chúng Ta hoàn tất Nerge, chúng Ta nhìn tất cả các con vật đã bị giết mà chúng Ta săn được. Thật là một cảnh tượng, khi chúng Ta bắt đầu phân loại và mổ thịt trước khi hỏng.\n\nKhông khí vui vẻ khi mọi người làm việc, ai cũng hài lòng với kết quả của cuộc săn."
  mpo_nerge.0115.a: "Thịt sẽ đủ cho cả mùa."

  mpo_nerge.0120.t: "Nerge Đáng Giá"
  mpo_nerge.0120.desc: "Đó là một cuộc săn thành công, khi hàng tá con vật nằm chết dưới chân chúng Ta. May mắn là có đủ người để xử lý tất cả, mổ thịt và mang về phần thịt dư thừa.\n\nMùi máu và mồ hôi nặng nề trong không khí, nhưng mọi người vẫn vui vẻ chia sẻ những câu chuyện hay nhất từ cuộc săn."
  mpo_nerge.0120.a: "Thịt này sẽ đủ cho vài mùa."

  mpo_nerge.0125.t: "Nerge Vĩ Đại"
  mpo_nerge.0125.desc: "Cuộc săn của chúng Ta thật sự thành công, và Ta từ từ đi qua những ngọn đồi nhỏ của các con vật bị giết. Thật là cảnh tượng ấn tượng, mọi người bận rộn mổ thịt.\n\nTa nghe vài thợ săn khoe chiến tích, mỗi người kể câu chuyện còn hoang đường hơn người trước. Chắc chắn sẽ có đủ thịt cho nhiều bữa tiệc sắp tới."
  mpo_nerge.0125.a: "Thật là một thành tựu!"

  mpo_nerge.0130.t: "Nerge Xuất Sắc"
  mpo_nerge.0130.desc: "Một biển thịt và máu nhuốm đất, mùi máu nồng nặc trong không khí. Dù vậy, chỉ có niềm vui giữa các thợ săn, họ vui vẻ di chuyển giữa các con vật bị giết.\n\nNgười tham gia và các thành viên khác bận rộn mổ thịt, nhưng Ta không thể rời mắt khỏi cảnh tượng này. Chúng Ta sẽ mang tất cả số thịt này về nhà như thế nào?"
  mpo_nerge.0130.a: "Người dân chúng ta sẽ nhớ Nerge này."

  mpo_nerge.1000.t: "Tín Hiệu [ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
  mpo_nerge.1000.desc: "Đại bàng của Ta, [ROOT.Char.Custom('EagleStoryName')], bay qua đoàn săn của chúng Ta, tìm mồi. [ROOT.Char.Custom('EagleStorySheHe')|U] quay về đậu trên tay Ta, mang theo da của [ROOT.Char.Custom('GetAnimalArticle')] [ROOT.Char.Custom('GetAnimalType')].\n\n[ROOT.Char.Custom('EagleStorySheHe')|U] có thể dẫn đường cho cuộc săn, hoặc chỉ là một may mắn tình cờ."
  mpo_nerge.1000.a: "[ROOT.Char.Custom('EagleStoryName')], dẫn chúng Ta đến [activity.Custom('GetAnimalPlural')]!"
  mpo_nerge.1000.a.tt.success: "Hướng dẫn của [ROOT.Char.Custom('EagleStoryNamePossessive')|U] dẫn đến việc tìm thấy nhiều [activity.Custom('GetAnimalPlural')] hơn"
  mpo_nerge.1000.a.tt.failure: "Không tìm thấy [activity.Custom('GetAnimalPlural')] nào"
  mpo_nerge.1000.b: "Những kỵ sĩ giỏi nhất của Ta có thể đi tìm [ROOT.Char.Custom('GetAnimalType')] này..."
  mpo_nerge.1000.b.tt.success: "Các kỵ sĩ tìm thấy một số [activity.Custom('GetAnimalPlural')]"
  mpo_nerge.1000.c: "Bắt được tốt, nhưng vẫn có những thứ tốt hơn để tìm."

  mpo_nerge.1005.t: "Một Tiếng Nói Nghi Ngờ"
  mpo_nerge.1005.desc: "Hàng trăm thú hoang đã bị giết, xác và máu của chúng nhuốm đất. Nhưng dù thành công gần kề, vẫn có người không hài lòng với chiến lợi phẩm.\n\n'Ta tưởng chúng ta đến để chứng kiến quyền lực.' [dissenter.GetFirstName] nói, giọng [dissenter.GetHerHis] vang lên giữa tiếng ồn của cuộc săn. 'Chúng ta phải làm nhiều hơn. Nếu Ta là người bắn mũi tên đầu tiên, chúng ta đã có đủ thịt cho cả chục mùa đông!'\n\n[dissenter.GetFirstNameNoTooltip] nhìn Ta, mắt [dissenter.GetHerHis] cháy sáng. 'Ngươi không đồng ý sao, [ROOT.Char.GetTitleAsNameNoTooltip]?'"
  mpo_nerge.1005.a: "Rất tốt, ta sẽ cho ngươi thấy sức mạnh."
  mpo_nerge.1005.a.tt: "Ngài dẫn một nhóm nhỏ kỵ sĩ đi săn thêm [activity.Custom('GetAnimalPlural')]"
  mpo_nerge.1005.a.tt.success: "Kế hoạch của Ngài thành công"
  mpo_nerge.1005.a.tt.failure: "Các kỵ sĩ của Ngài không bắt được con mồi nào"
  mpo_nerge.1005.b: "Chứng minh giá trị của ngươi, [dissenter.GetFirstNameNoTooltip]!"
  mpo_nerge.1005.b.tt: "[dissenter.GetFirstNameNoTooltip] dẫn một nhóm kỵ sĩ nhỏ"
  mpo_nerge.1005.c: "Mục tiêu của Ta không phải để gây ấn tượng với ngươi."
  mpo_nerge.1005.b.tt.success: "[dissenter.GetFirstNameNoTooltip] bắt được một số [activity.Custom('GetAnimalPlural')]"
  mpo_nerge.1005.b.tt.failure: "[dissenter.GetFirstNameNoTooltip] làm [dissenter.GetHerHim] xấu hổ"

  mpo_nerge.1010.t: "Phá Vỡ Vòng Tròn"
  mpo_nerge.1010.desc: "Với từng thợ săn ở vị trí, các kỵ sĩ tiến sát một bầy [activity.Custom('GetAnimalPlural')]. Một số dò trước bằng cách chạy nhanh hơn đội hình, trong khi số khác sẵn sàng tấn công.\n\nNgớ ngẩn thay, [chaser.GetFirstName] chạy ở đầu, khiến một phần [activity.Custom('GetAnimalPlural')] tản ra. Nỗ lực của [chaser.GetHerHis|U] để dồn chúng lại vô ích, và bầy thú cố trốn thoát."
  mpo_nerge.1010.a: "Để [chaser.GetHerHim] cho [activity.Custom('GetAnimalPlural')]!"
  mpo_nerge.1010.a.tt.death: "[chaser.GetFirstNameNoTooltip] bị [activity.Custom('GetAnimalPlural')] giẫm chết"
  mpo_nerge.1010.a.tt.injury: "[chaser.GetFirstNameNoTooltip] bị [activity.Custom('GetAnimalPlural')] làm bị thương"
  mpo_nerge.1010.b: "Tập hợp lại, và thu thập những gì có thể từ xác chúng."
  mpo_nerge.1010.b.tt.success: "Ngài bắt được nhiều [activity.Custom('GetAnimalPlural')] đang chạy trốn"
  mpo_nerge.1010.b.tt.failure: "Chỉ còn lại vài [activity.Custom('GetAnimalPlural')]"
  mpo_nerge.1010.c: "[chaser.GetSheHe|U] vẫn là một trong chúng ta, sai lầm này chỉ là con người."
  mpo_nerge.1010.c_obedience: "Miễn là [chaser.GetSheHe] cúi đầu trước Ta, [chaser.GetSheHe] sẽ được tha."

  mpo_nerge.1015.t: "Cuộc Thoát Trên Thảo Nguyên"
  mpo_nerge.1015.desc: "'[GetPlayer.GetTitleAsNameNoTooltip]! Bầy [activity.Custom('GetAnimalPlural')] đã phá vòng vây!' [hunter_1.GetFirstName] la lên, [hunter_2.GetFirstName] chạy sát theo.\n\nTrên đường chân trời, hàng chục [activity.Custom('GetAnimalPlural')] lao về phía kỵ sĩ và trại. Rõ ràng cuộc săn đã sai lầm, nhưng không thể rút lui."
  mpo_nerge.1015.a: "Đây là cơ hội của chúng ta, giết hết chúng!"
  mpo_nerge.1015.a.tt.success: "Bầy [activity.Custom('GetAnimalPlural')] bị giẫm chết"
  mpo_nerge.1015.a.tt.failure: "Bầy thú làm bị thương vài kỵ sĩ"
  mpo_nerge.1015.b: "Để chúng đi, nhưng hạ gục kẻ tách đoàn."
  mpo_nerge.1015.c: "Chúng tự nhiên trốn, để chúng quay về hoang dã."
  mpo_nerge.1015.d: "[hunter_1.GetFirstNameNoTooltip] và [hunter_2.GetFirstNameNoTooltip] sẽ phải trả giá cho những mất mát."

  mpo_nerge.1020.t: "Con Mồi Tản Ra"
  mpo_nerge.1020.desc: "'Mặc dù đã có bằng chứng vững chắc về tiến trình, Ta lo rằng sẽ còn quá ít [activity.Custom('GetAnimalPlural')] sống sót,' [master_of_hunt.GetFirstName] giải thích. 'Ta không muốn để đất trống.'\n\nChúng Ta đã giết đủ [activity.Custom('GetAnimal')] để nuôi sống nhiều tháng, nhưng săn dần trở nên mệt mỏi khi số lượng giảm. [master_of_hunt.GetFirstNameNoTooltip] đã hướng dẫn các kỵ sĩ tìm các khu vực khác, nhưng [activity.Custom('GetAnimalPlural')] ngày càng hiếm."
  mpo_nerge.1020.a: "Lấy những gì cần, để lại phần còn lại."
  mpo_nerge.1020.a.tt: "Một số [activity.Custom('GetAnimalPlural')] được để lại để sinh sản"
  mpo_nerge.1020.b: "Nhượng bộ là yếu đuối. Chúng ta phải săn!"
  mpo_nerge.1020.c: "Quan sát [activity.Custom('GetAnimalPlural')] này — hãy tìm kẻ yếu nhất."
  mpo_nerge.1020.c.tt: "Ngài chỉ định tiêu diệt những [activity.Custom('GetAnimalPlural')] ít khả năng sống nhất"
  mpo_nerge.1020.c.tt.success: "Những [activity.Custom('GetAnimalPlural')] còn lại không bị hại"
  mpo_nerge.1020.c.tt.failure: "Gần như không còn [activity.Custom('GetAnimalPlural')] nào"

  mpo_nerge_overhunting_modifier: "Săn Quá Mức"
  mpo_nerge_overhunting_modifier_desc: "Hạt này đã bị săn quá mức, sẽ khó duy trì sự sống ở đây."

  mpo_nerge.1025.t: "Thợ Săn Vĩ Đại Nhất"
  mpo_nerge.1025.desc: "Hàng chục [activity.Custom('GetAnimalPlural')] đã bị giết, và con lớn nhất bị một mũi tên vô danh hạ gục. Trước khi ai kiểm tra con thú, [hunter_1.GetFirstName] tiến lên để nhận vinh quang. [hunter_2.GetFirstName] theo sau, và cả hai bắt đầu tranh cãi ai xứng đáng.\n\n'Rõ ràng mũi tên của Ta đã trúng con thú!' [hunter_1.GetFirstName] hô. 'Ngươi còn quá xa để bắn trúng!' \n\n[hunter_2.GetFirstName] khinh thường. Sự căng thẳng giữa hai người tăng, làm họ mất tập trung..."
  mpo_nerge.1025.a: "Vinh quang không quan trọng, tất cả chúng ta sẽ chia chiến lợi phẩm."
  mpo_nerge.1025.a.flavor: "Thật là món khai vị hoàn hảo cho một bữa tiệc!"
  mpo_nerge.1025.a.tt: "Nếu Ngài #bold không#! tổ chức [GetActivityType('activity_feast').GetName] trước một năm, Ngài sẽ mất [prestige|E] và [opinion|E]"
  mpo_nerge.1025.b: "Điều này dễ quyết định bằng thử thách sức mạnh."
  mpo_nerge.1025.b.tt: "Các thợ săn giải quyết tranh chấp bằng một trận đấu"
  mpo_nerge.1025.b.tt.hunter_1: "[hunter_1.GetFirstNameNoTooltip] thắng trận đấu"
  mpo_nerge.1025.b.tt.hunter_2: "[hunter_2.GetFirstNameNoTooltip] thắng trận đấu"
  mpo_nerge.1025.c: "Các ngươi ngốc! Chính mũi tên của ta trúng con thú!"
  mpo_nerge.1025.c.tt: "Ngài cố gắng nhận con thú cho riêng mình"
  mpo_nerge.1025.c.tt.success: "Các thợ săn khác đứng về phía Ngài"
  mpo_nerge.1025.c.tt.failure: "Không ai tin lời Ngài"
  mpo_nerge.1025.d: "Ta thấy rồi, [intent_target.GetFirstNameNoTooltip] đã trúng con thú!"

  mpo_nerge_feast_discount: "Thịt Chuẩn Bị"
  mpo_nerge_feast_discount_desc: "Nhân vật này đã chuẩn bị thịt từ Nerge gần đây, và có thể tổ chức bữa tiệc với chi phí thấp hơn.\n[GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName]  Chi phí: -#P 50%#!"

  mpo_nerge_promised_feast_fail: "Lời Hứa Bị Phá Vỡ"
  mpo_nerge_promised_feast_fail_desc: "Nhân vật này gần đây đã hứa với ai đó, nhưng không thực hiện được."

  mpo_nerge.1026.t: "Lời Hứa Bị Phá Vỡ"
  mpo_nerge.1026.desc: "Ta đã hứa với các thợ săn một bữa tiệc từ chiến lợi phẩm Nerge, nhưng cuối cùng, thịt đã bị lãng phí.\n\nTốt hơn là không hứa gì còn hơn hứa rồi thất hứa, và các thợ săn không hài lòng với thất bại của Ta."
  mpo_nerge.1026.a: "..."

  mpo_nerge.1030.t: "Cảnh Tượng Hiếm Gặp"
  mpo_nerge.1030.desc: "Cách nhóm săn chính một quãng, [master_of_hunt.GetFirstName] kể về một con [ROOT.Char.Custom('GetRegionalDeerType')] trắng tuyệt đẹp đã được phát hiện. 'Nó khác bất cứ thứ gì Ta từng thấy,' [master_of_hunt.GetSheHe] nói, mắt [master_of_hunt.GetHerHis] mở to. 'Nhưng nó không đơn độc, có vài con nhỏ đi cùng, tất cả trắng như tuyết.'\n\nTa đã săn sói, hươu, và mèo rừng, nhưng giết được sinh vật này có thể đem lại danh tiếng lớn."
  mpo_nerge.1030.a: "Nó sẽ là của Ta!"
  mpo_nerge.1030.a.tt.success: "Con [ROOT.Char.Custom('GetRegionalDeerType')] ngã xuống trước mũi tên của Ngài"
  mpo_nerge.1030.a.tt.failure: "Con [ROOT.Char.Custom('GetRegionalDeerType')] thoát"
  mpo_nerge.1030.b: "Chúng ta nên theo dõi [ROOT.Char.Custom('GetRegionalDeerType')], nhưng không gây hại."
  mpo_nerge.1030.b.tt.success: "Ngài thu được thông tin về [ROOT.Char.Custom('GetRegionalDeerType')]"
  mpo_nerge.1030.b.tt.failure: "Con [ROOT.Char.Custom('GetRegionalDeerType')] thoát, nhưng không bị hại"
  mpo_nerge.1030.b.tt.effect: "[county.GetName] sẽ nhận được [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] trong 2 năm"
  mpo_nerge.1030.c: "Chúng ta đến để săn, không phải để tham quan."
  mpo_nerge.1030.d: "Tại sao ngươi muốn gài bẫy ta?"

  mpo_nerge.1031.t: "Bảo tồn mang lại kết quả"

  mpo_nerge.1035.t: "Chiến Thuật Truy Đuổi"
  mpo_nerge.1035.desc: "Cơn hưng phấn của cuộc săn đã dịu xuống, nhiều thợ săn trở về trại để bàn kế hoạch, trong khi những người còn lại quan sát [activity.Custom('GetAnimalPlural')] từ xa.\n\n'Chúng ta phải tàn nhẫn! Như cách chúng ta đối với kẻ thù!' [hunter_1.GetFirstName] hô to. [hunter_2.GetFirstName] gật đầu đồng ý và thêm, 'Nhưng không có sức mạnh trong số lượng nếu chúng ta không hợp tác.' Trước khi một cuộc tranh luận khác nổ ra, [hunter_3.GetFirstName] tiến tới đưa ra lời khuyên của [hunter_3.GetHerHis]. 'Chúng ta có thể tuân theo truyền thống,' [hunter_3.GetFirstNameNoTooltip] nói. 'Nhưng phải kiên nhẫn. Quan sát thú, tiến gần chậm rãi, và tấn công khi chúng không ngờ tới.'\n\nGiữa lúc họ bàn tán, họ nhìn về phía Ta, chờ đợi ý kiến của Ta."
  mpo_nerge.1035.a: "Đánh mạnh và nhanh!"
  mpo_nerge.1035.a.tt: "Phương pháp này #bold nguy hiểm#!, nhưng kết quả tốt hơn."
  mpo_nerge.1035.b: "Chia nhóm và phối hợp."
  mpo_nerge.1035.b.tt: "Phương pháp này sẽ #bold ít thu hoạch hơn#!, nhưng nâng cao ý kiến của các thợ săn khác về Ngài, hoặc thậm chí khiến họ [obedient|E]."
  mpo_nerge.1035.c: "Một vụ mai phục là cần thiết."
  mpo_nerge.1035.c.tt: "Phương pháp này tương đối #bold an toàn#!, nhưng không thu được nhiều."
  mpo_nerge.1035.d: "Để cung quyết định kết quả."
  mpo_nerge.1035.tt.success: "Kế hoạch thành công"
  mpo_nerge.1035.tt.failure: "Kế hoạch thất bại"

  mpo_nerge_investigation: "Quan Sát Thú"
  mpo_nerge_investigation_desc: "Nhân vật này quan sát thú trong cuộc săn, và sử dụng kiến thức đó để quản lý bầy thú của mình."
 
  mpo_nerge.1040.t: "Bị Lãng Quên"
  mpo_nerge.1040.desc: "\"Chờ đã!\" [hunter.GetTitledFirstName] đột ngột xuống khỏi ngựa, quỳ xuống đất. \"Ta nghĩ ta đã thấy... ở đây!\"\n\n\"Chắc hẳn thuộc về những thợ săn kém may mắn hơn,\" [hunter.GetSheHe] mỉa mai nhận xét, đưa ra một cây cung dính máu, gỗ bị sứt mẻ."
  mpo_nerge.1040.a: "'Đưa nó cho [ROOT.Char.GetTitleAsNameNoTooltip] của ngươi.'"
  mpo_nerge.1040.b: "'Nếu ở đất của ta, nó thuộc về ta.'"
  mpo_nerge.1040.c: "'Ngươi có thể giữ nó.'"
  mpo_nerge.1040.c.tt: "[hunter.GetShortUIName] giữ [newly_created_artifact.GetName]"
  mpo_nerge.1040.d: "'Lên ngựa ngay!'"
 
  mpo_nerge.1050.t: "Trình Diễn Sức Mạnh"
  mpo_nerge.1050.desc: "\"Một con [ROOT.Char.Custom('GetAnimalTypeMismanaged')] lang thang,\" [hunter.GetTitledFirstName] thông báo bằng giọng trầm. \"Một mũi tên nhắm thẳng vào tim nó và nó sẽ là của chúng ta, thưa [ROOT.Char.GetTitleAsNameNoTooltip].\"\n\n[hunter_2.GetTitledFirstName] gật đầu và giương cây cung của [hunter_2.GetHerHis] lên, chờ đợi chỉ thị của ta."
  mpo_nerge.1050.a: "'[hunter.GetFirstNameNoTooltip], [hunter.Custom('SisterBrother')] của ta, chúng ta hành động như một!'"
  mpo_nerge.1050.a.tt.success: "Con thú ngã dưới chân Ngài"
  mpo_nerge.1050.a.tt.failure: "Con thú thoát"
  mpo_nerge.1050.b: "'Để ta lo.'"
  mpo_nerge.1050.b.tt.success: "Ngài giết con thú"
  mpo_nerge.1050.b.tt.failure: "Ngài bị nhục nhã"
  mpo_nerge.1050.c: "'Ngắm thật chính xác.'"
  mpo_nerge.1050.c.tt.success: "Con thú chết"
  mpo_nerge.1050.c.tt.failure: "Con thú né được mũi tên"
  mpo_nerge.1050.d: "'Đừng để nó làm phân tâm!'"
 
  mpo_nerge.1060.t: "Sự Phân Tâm Ngon Lành"
  mpo_nerge.1060.desc: "'Nhìn kìa!' [hunter.GetTitledFirstName] chỉ vào một nhóm [ROOT.Char.Custom('RegionalEdibleAnimalPlural')] hoang dã, ẩn trên lối đi bên trái. 'Hãy săn chúng! Bụng Ta đã kêu đói!'"
  mpo_nerge.1060.a: "'Ta chưa bao giờ thấy cái bẫy nào rõ ràng hơn.'"
  mpo_nerge.1060.b: "'Cơ hội để thể hiện sức mạnh của Ta!'"
  mpo_nerge.1060.b.tt.success: "Những con thú chết dưới tay Ngài"
  mpo_nerge.1060.b.tt.failure: "Ngài làm bản thân xấu hổ"
  mpo_nerge.1060.c: "'Bắt càng nhiều càng tốt!'"
  mpo_nerge.1060.c.tt.success: "Ngài săn được số lượng ấn tượng"
  mpo_nerge.1060.c.tt.failure: "Ngài hầu như chẳng bắt được gì"
  mpo_nerge.1060.c.tt_feast: "Bữa [GetActivityType('activity_feast').GetName] tiếp theo của Ngài sẽ #high free#!"
  mpo_nerge.1060.d: "'Không cần theo một bầy bị bỏ lại.'"
  nerge_evaded_trap_modifier: "Tránh Bẫy"
  nerge_evaded_trap_modifier_desc: "Nhân vật này nghĩ rằng họ đã nhận diện đúng một cái bẫy trong Nerge."
  mpo_nerge_1060_free_feast_desc: "Sự kiện Nerge"
