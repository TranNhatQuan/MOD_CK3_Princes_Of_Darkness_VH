l_english:
  court_astrologer_events.0002.t: "Nhìn Sang Hàng Xóm"
  court_astrologer_events.0002.desc.intro: "[astrologer.GetShortUIName] tiến đến Ta khi mặt trời lặn sau dãy núi. [astrologer.GetSheHe|U] [astrologer.Custom('quirk_pos_present')] khi [astrologer.GetSheHe] đến gần, quan sát vùng đất.\n\n"
  court_astrologer_events.0002.desc.bad: ""[astrologer.GetFaith.HighGodName] không thương xót chúng ta, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip]. Đồng cỏ khô héo, như xác chết già.""
  court_astrologer_events.0002.desc.meh: ""Ngay cả với phước lành của [astrologer.GetFaith.HighGodNamePossessive], bầy gia súc vẫn khó khăn," [astrologer.GetSheHe] nói, chỉ vào vài con ngựa đi lại."
  court_astrologer_events.0002.desc.outro: "\n\n"Vùng đất lân cận của [target_realm.GetName] màu mỡ hơn nhiều. Ngươi phải thuyết phục [target_realm_owner.GetTitledFirstName] nhường đường cho dân chúng ta.""
  court_astrologer_events.0002.a: ""Ta tin lời ngươi.""
  court_astrologer_events.0002.a.tt: "Nếu Ngài #EMP di cư hòa bình#! [migrate|E] đến [target_realm.GetName] trong vòng #V 5#! năm tới, Ngài sẽ nhận được [GetModifier('astrologer_desired_area_modifier').GetNameWithTooltip] khi đến nơi."
  court_astrologer_events.0002.b: ""Ngươi nói những lời đạo hạnh.""
  court_astrologer_events.0002.c: ""Chỉ kẻ yếu mới bỏ chạy.""
