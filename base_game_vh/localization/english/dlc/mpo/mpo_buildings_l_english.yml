l_english:
 
  building_type_nomadic_camp_01: "Khu Định Cư Du Mục"
  building_type_nomadic_camp_01_desc: "Một cụm lều yurt phá vỡ sự đơn điệu của thảo nguyên. Mọi thứ ở đây có thể được gói lại và di chuyển đến một vùng đất mới màu mỡ hơn."
  building_nomadic_camp_01: "$building_type_nomadic_camp_01$"
  building_nomadic_camp_01_desc: "$building_type_nomadic_camp_01_desc$"

  building_type_herder_camp_01: "Trại Chăn Nuôi"
  building_type_herder_camp_01_desc: "Một vài lều yurt nhỏ co cụm lo lắng, được bao quanh bởi bức tường tạm bằng đất và phân động vật, vừa chắn gió vừa làm nhiên liệu cho lửa."
  building_herder_camp_01: "$building_type_herder_camp_01$"
  building_herder_camp_01_desc: "$building_type_herder_camp_01_desc$"
