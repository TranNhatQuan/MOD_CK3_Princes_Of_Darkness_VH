l_english:
  nomad_events_oltner.0001.t: "Dấu Vết Mới"
  nomad_events_oltner.0001.desc: "Có rất nhiều thú rừng ở vùng đất của Ta. Các thợ săn kể Ta nghe về một [sighting_county_1.Custom('GetAnimalGroup')] gồm [sighting_county_1.Custom('GetAnimalPlural')] ở [sighting_province_1.Custom('GetTerrainTypePlural')] của [sighting_county_1.GetBaseNameNoTier], và về một [sighting_county_2.Custom('GetAnimalAdjective')] [sighting_county_2.Custom('GetAnimalType')] đang ẩn mình trong [sighting_county_2.GetBaseNameNoTier] [sighting_province_2.Custom('GetTerrainType')].\n\nLà [ROOT.Char.GetTitleAsNameNoTooltip], Ta nên chọn một để săn theo."
  nomad_events_oltner.0001.a: "Đêm nay chúng ta sẽ thưởng thức [sighting_county_1.Custom('GetAnimalType')]."
  nomad_events_oltner.0001.b: "Giết [sighting_county_2.Custom('GetAnimalAdjective')] [sighting_county_2.Custom('GetAnimalType')] sẽ chứng tỏ giá trị của Ta."
  nomad_events_oltner.0001.c: "Còn những việc khác đang cần Ta chú ý."
  nomad_events_oltner.0002.t: "Dấu Vết Lông Chim"
  nomad_events_oltner.0002.desc: "Tin đồn lan về một [sighting_province_1.Custom('GetAnimalGroup')] gồm [sighting_county_1.Custom('GetAnimalPlural')] được nhìn thấy trong [sighting_province_1.Custom('GetTerrainTypePlural')] của [sighting_county_1.GetBaseNameNoTier] — cơ hội hoàn hảo để huấn luyện chim săn.\n\nDĩ nhiên, Ta cũng có thể chọn săn thú lớn hơn."
  nomad_events_oltner.0002.a: "Một con [sighting_county_1.Custom('GetAnimalType')] béo sẽ sớm được hầm trong nồi của Ta."
  nomad_events_oltner.0002.b: "Ta thà huấn luyện chó."
  nomad_events_oltner.0002.c: "Ta không thể lãng phí thời gian cho việc này."
  nomad_events_oltner.0003.t: "Một [sighting_county_1.Custom('GetAnimalGroup')|U] gồm [sighting_county_1.Custom('GetAnimalPlural')|U]"
  nomad_events_oltner.0003.desc: "Hai mươi con cừu chết, một người chăn bị thương, và dấu vết dẫn vào [sighting_province_1.Custom('GetTerrainTypePlural')]. Một [sighting_county_1.Custom('GetAnimalAdjective')] [sighting_county_1.Custom('GetAnimalGroup')] gồm [sighting_county_1.Custom('GetAnimalPlural')] đang lấy đi những gì thuộc về Ta ở [sighting_county_1.GetBaseNameNoTier].\n\nTa nên chuẩn bị cung và túi tên. Danh tiếng của Ta với tư cách [ROOT.Char.GetTitleAsNameNoTooltip] đang bị đặt cược."
  nomad_events_oltner.0003.a: "Mũi tên của Ta sẽ xuyên thủng trái tim [sighting_county_1.Custom('GetAnimalPlural')]."
  nomad_events_oltner.0003.b: "[maa_regiment.GetNameNoTooltip] của Ta sẽ giết [sighting_county_1.Custom('GetAnimalGroup')]."
  nomad_events_oltner.0003.c: "[ROOT.Char.GetFaith.FertilityGodName] sẽ khiến chúng di chuyển đi."
  nomad_events_oltner.0004.t: "[sighting_county_1.Custom('GetAnimalPlural')|U] trong Zud"
  nomad_events_oltner.0004.desc: "[my_subregion.GetCurrentPhase.GetName] chỉ có tuyết và băng. Cho đến khi [sighting_county_1.Custom('GetAnimalGroup')] gồm [sighting_county_1.Custom('GetAnimalPlural')] xuất hiện. Chúng ăn mọi thứ trong tầm mắt. Giờ chúng Ta cũng đang đối diện với cái chết.\n\nTa sẽ không ngồi yên khi đàn gia súc và dân chúng của Ta chết."
  nomad_events_oltner.0004.a: "Ta sẽ săn lùng từng [sighting_county_1.Custom('GetAnimalType')] còn lại!"
  nomad_events_oltner.0004.b: "Quên [sighting_county_1.Custom('GetAnimalPlural')] đi. Chúng ta cần rời đi."
  nomad_events_oltner.0005.t: "Dấu Vết Mới Để Theo"
  nomad_events_oltner.0005.desc: "Mùa [my_subregion.GetCurrentPhase.GetName] này hứa hẹn săn bắn tốt. Con mồi phong phú, tụ về [sighting_province_1.Custom('GetTerrainTypePlural')] của [sighting_county_1.GetBaseNameNoTier] thành đàn — một mùa thật sự được [ROOT.Char.GetFaith.WealthGodName] ban phước.\n\nDù Ta chọn săn gì, Ta sẽ có nhiều lựa chọn."
  nomad_events_oltner.0005.a: "Ta sẽ săn một con thú hung dữ."
  nomad_events_oltner.0005.b: "Chúng ta đi săn hươu và nai!"
  nomad_events_oltner.0005.c: "Móng vuốt của chim săn tìm con mồi mới."
  nomad_events_oltner.0006.t: "Cống Vật Của Cuộc Săn"
  nomad_events_oltner.0006.desc: "\"Thần cúi đầu trước ngài, vị chúa tể [ROOT.Char.Custom('FormalComplimentAdjective')] của thần,\" chư hầu [generous_tributary.GetTitledFirstName] của ta nói, quỳ rạp [generous_tributary.GetHerselfHimself] trước ta.\n\n\"Thần xin dâng lên ngài sự phục vụ của [offered_master_of_the_hunt.GetFirstNameNicknamed], vị [GetCourtPositionType('master_of_hunt_court_position').CalcTriggeredNameNoTooltip( ROOT.Char )] xuất sắc nhất trong khắp vùng [generous_tributary.GetPrimaryTitle.GetAdjective]. Cầu mong [offered_master_of_the_hunt.GetSheHe] hạ được nhiều con thú nhân danh ngài.\""
  nomad_events_oltner.0006.a: "[offered_master_of_the_hunt.GetFirstNameNoTooltip] sẽ phục vụ Ta tốt."
  nomad_events_oltner.0006.b: "Một lễ vật tuyệt vời, để Ta thưởng cho ngài."
  nomad_events_oltner.0006.c: "Giữ [offered_master_of_the_hunt.GetHerHim], và chúc cuộc săn thành công."
  nomad_events_oltner.0007.t: "Cống Vật Lông Chim"
  nomad_events_oltner.0007.desc: "\"[ROOT.Char.Custom('FormalComplimentAdjective')|U] chư hầu, Ta dâng ngài món quà này.\" [generous_tributary.GetTitledFirstName], tributary của Ta, giơ một con chim oai phong trước mặt Ta.\n\n\"Con chim săn này đến từ [tribute_capital.Custom('GetTerrainTypePlural')] của [tribute_capital_county.GetBaseNameNoTier], và Ta tự huấn luyện từ khi nó còn non. Nó sẽ hạ hàng trăm vịt và trĩ cho ngài; Ta thề điều đó.\""
  nomad_events_oltner.0007.a: "Ta sẽ đặt tên nó là '[ROOT.Char.Custom('GetBirdName')|U]'!"
  nomad_events_oltner.0007.b: "Xin giữ lại nó."
 
  chaotic_kurultai_title: "Hậu Thế Hỗn Loạn:"
  chaotic_kurultai_intro_1: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_parent'))] của Ta [dead_parent.GetFirstNameNicknamed] [dead_parent.GetDeathReasonHideKiller]. Bình minh triều đại của Ta ló dạng. Tiếng nói chia rẽ của Kurultai vang vọng trên [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvincePrefix')] [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')].\n\n"
  chaotic_kurultai_intro_2: "Bình minh triều đại của Ta ló dạng. Tiếng nói chia rẽ của Kurultai vang vọng khắp [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvincePrefix')] [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')]\n\n"
  mpo_chaotic_kurultai_succession.0001.t: "$chaotic_kurultai_title$ Ghen Tỵ"
  mpo_chaotic_kurultai_succession.0001.desc: "[sibling_rival_1.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] #EMP '[sibling_rival_1.Custom('ComplimentAdjective')]'#! của ta là [sibling_rival_1.GetFirstNameNicknamed] thề trên mạng sống [sibling_rival_1.GetHerHis] rằng [sibling_rival_1.GetSheHe] mới là người nên cai trị [ROOT.Char.GetPrimaryTitle.GetName]. Rằng việc ta là [ROOT.Char.GetTitleAsName] chỉ là một trò đùa của các vị thần độc ác trong tôn giáo của [sibling_rival_1.GetFaith.EvilGodNames]. [sibling_rival_1.GetSheHe|U] thật [sibling_rival_1.Custom('DescriptorNegativeStandalone')] và yếu đuối."
  mpo_chaotic_kurultai_succession.0001.desc_addition: "\n\nVà dường như [sibling_rival_2.Custom2('InsultNoun', ROOT.Char)] của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_2'))] [sibling_rival_2.GetFirstNameNicknamed] cũng quyết định theo chân."
  mpo_chaotic_kurultai_succession.0001.a: "Ta sẽ chứng minh giá trị của mình theo thời gian."
  rival_kurultai_succession: "[TARGET_CHARACTER.GetShortUIName|U] [CharWereWas(TARGET_CHARACTER)] không được Kurultai chọn nhất trí khi kế vị, làm [CHARACTER.GetShortUIName|U] nổi giận."
  rival_kurultai_succession_corresponding: "[CHARACTER.GetShortUIName|U] [CharWereWas(CHARACTER)] không được Kurultai chọn nhất trí khi kế vị, làm [TARGET_CHARACTER.GetShortUIName|U] nổi giận."
 
  mpo_chaotic_kurultai_succession.0002.t: "$chaotic_kurultai_title$ Cướp Lấy Cống Vật"
  sibling_usurped_tributary_lands_tt: "[sibling_rival_1.GetShortUIName|U] chiếm toàn bộ đất đai và thần dân của [tributary|E] [tributary_usurped.GetShortUIName|U] và trở thành [independent_ruler|E]"
  mpo_chaotic_kurultai_succession.0002.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.GetFirstNameNicknamed] đã dẫn nhóm [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] vào đất của [tributary_usurped.GetTitledFirstNameNicknamed], cưỡng đoạt [tributary_usurped.GetHerHis] lãnh thổ."
  mpo_chaotic_kurultai_succession.0002.desc_addition: "Với sự hậu thuẫn của thành viên phản bội Kurultai, [backing_kurultai.GetFirstNameNicknamed]."
  mpo_chaotic_kurultai_succession.0002.desc_end: "\n\nĐó là một bước đi sai lầm chết người."
  mpo_chaotic_kurultai_succession.0002.a: "[sibling_rival_1.GetSheHe|U] dám lấy đi của Ta sao?"
 
  mpo_chaotic_kurultai_succession.0003.t: "$chaotic_kurultai_title$ Ngưng Nộp Cống"
  mpo_chaotic_kurultai_succession.0003.desc: "Chư hầu [tributary_leaving.GetFirstNameNicknamed] của [tributary_leaving.GetPrimaryTitle.GetName] đã quyết định chấm dứt việc cống nạp của [tributary_leaving.GetHerHis]."
  mpo_chaotic_kurultai_succession.0003.desc_addition: "[backing_kurultai.GetFirstNameNicknamed], thành viên nổi loạn của Kurultai, đồng lõa với sự phản bội này."
  mpo_chaotic_kurultai_succession.0003.a: "Ta sẽ nghiền nát [tributary_leaving.GetHerHim] vì sự xấc xược của [tributary_leaving.GetHerHis]!"
  mpo_chaotic_kurultai_succession.0003.desc_end: "\n\nTa sẽ lấy lại cống vật bằng mọi cách."
 
  mpo_chaotic_kurultai_succession.0004.t: "$chaotic_kurultai_title$ Mất Kiểm Soát"
  mpo_chaotic_kurultai_succession.0004.desc: "Đồng cỏ của Ta bị cướp phá bởi những kẻ trộm, chó và [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] du mục. Họ cướp yurts, giết ngựa và đốt cờ của Ta."
  mpo_chaotic_kurultai_succession.0004.desc_addition: "Rõ ràng họ bị thúc đẩy bởi [backing_kurultai.GetFirstNameNicknamed], một thành viên [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] của Kurultai."
  mpo_chaotic_kurultai_succession.0004.a: "Trật tự sẽ được khôi phục, đúng lúc."
  mpo_chaotic_kurultai_succession.0004.desc_end: "\n\nHọ sẽ xếp hàng theo trật tự."
 
  mpo_chaotic_kurultai_succession.0005.t: "$chaotic_kurultai_title$ Mất Danh Dự"
  mpo_chaotic_kurultai_succession.0005.desc: "Tên tuổi của Ta bị kéo xuống bùn. Bị ngựa giẫm lên. Bị coi thường, bị vứt bỏ."
  mpo_chaotic_kurultai_succession.0005.desc_addition: "Và phần lớn lời phỉ báng đến trực tiếp từ miệng của [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamedPossessive]."
  mpo_chaotic_kurultai_succession.0005.a: "Danh dự của Ta sẽ được khôi phục."
 
  mpo_chaotic_kurultai_succession.0006.t: "$chaotic_kurultai_title$ Mất Đàn"
  mpo_chaotic_kurultai_succession.0006.desc: "Trong đêm, một phần lớn đàn gia súc của Ta biến mất. Mất, hoặc bị lấy trộm."
  mpo_chaotic_kurultai_succession.0006.desc_addition: "Ta nghi ngờ [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] đã thả chúng vào ban đêm."
  mpo_chaotic_kurultai_succession.0006.desc_end: "\n\nChúng có thể đang đi nửa đường đến [rustler.GetCapitalLocation.Custom('TerrainTypeProvince')] của [rustler.GetCapitalLocation.GetName]. Ta sẽ không thấy chúng nữa."
  mpo_chaotic_kurultai_succession.0006.a: "Sức mạnh của Ta sẽ trở lại."
 
  mpo_chaotic_kurultai_succession.1006.t: "Đàn Bị Mất"
  mpo_chaotic_kurultai_succession.1006.desc: "Một đàn dê và cừu, bị mất hoặc bỏ rơi, xuất hiện trong đêm.\n\nĐàn vật hiền lành và có thể dễ dàng gia tăng đàn của Ta. Một số người nói rằng sự kế vị hỗn loạn của [ruler_rustled.GetTitledFirstNameNicknamed] của [ruler_rustled.GetPrimaryTitle.GetName] là nguyên nhân."
  mpo_chaotic_kurultai_succession.1006.desc_addition: "Các kỵ sĩ của Ta báo thấy [backing_kurultai.GetTitledFirstNameNicknamed], một thành viên bất tuân của Kurultai [ruler_rustled.GetFirstNamePossessiveNoTooltip], lẩn quanh ở ngoại vi. Rất có thể đây là việc của [backing_kurultai.GetHerHis]."
  mpo_chaotic_kurultai_succession.1006.a: "Thêm chúng vào đàn của Ta."
  mpo_chaotic_kurultai_succession.1006.b: "Gửi chúng trở lại [ruler_rustled.GetFirstNameNoTooltip] như một món quà."
  mpo_chaotic_kurultai_succession.1006.b.title: "[rustler.GetFirstName] trả lại Đàn của Ngài"
  mpo_chaotic_kurultai_succession.1006.b.tt: "[ruler_rustled.GetShortUINamePossessive] mất [herd|E] được trả lại"
 
  mpo_chaotic_kurultai_succession.0007.t: "$chaotic_kurultai_title$ Triều Quan Ly Dị"
  mpo_chaotic_kurultai_succession.0007.desc: "Ba triều quan giỏi nhất của Ta biến mất: [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed], và [courtier_3.GetFirstNameNicknamed] — sự giận dữ của họ nảy sinh từ cuộc tranh luận kế vị."
  mpo_chaotic_kurultai_succession.0007.desc_addition: "Chắc chắn được thúc đẩy bởi [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed]."
  mpo_chaotic_kurultai_succession.0007.desc_end: "\n\nHọ khinh thường quyền lực của Ta và giờ đang đi về [courtier_stealer.GetCapitalLocation.GetName], tìm một chủ mới."
  mpo_chaotic_kurultai_succession.0007.a: "Ta vẫn còn nhiều thần dân trung thành."
 
  mpo_chaotic_kurultai_succession.1007.t: "Những Người Mới Đến"
  mpo_chaotic_kurultai_succession.1007.desc: "Ba người lang thang, [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed], và [courtier_3.GetFirstNameNicknamed], đến tìm chỗ trong triều đình Ta.\n\nHọ đến từ [ruler_rustled.GetPrimaryTitle.GetName], bị đuổi bởi sự kế vị hỗn loạn của [ruler_rustled.GetTitledFirstNameNicknamedPossessive]."
  mpo_chaotic_kurultai_succession.1007.desc_addition: "Rất có thể họ được thúc đẩy bởi [backing_kurultai.GetTitledFirstNameNicknamed], một thành viên bất tuân của Kurultai [ruler_rustled.GetFirstNamePossessiveNoTooltip]."
  mpo_chaotic_kurultai_succession.1007.a: "Họ sẽ phục vụ Ta tốt."
  mpo_chaotic_kurultai_succession.1007.b: "Gửi họ trở lại [ruler_rustled.GetFirstNameNoTooltip]."
  mpo_chaotic_kurultai_succession.1007.b.title: "[courtier_stealer.GetFirstName] trả lại Triều Quan của Ngài"
 
  mpo_chaotic_kurultai_succession.0008.t: "$chaotic_kurultai_title$ Binh Ly Dị"
  mpo_chaotic_kurultai_succession.0008.desc: "Trong hỗn loạn kế vị, [defecting_maa.GetName] tinh nhuệ nhất của Ta chán nản. Những chiến binh [maa_stealer.Custom2('InsultAdjective', ROOT.Char)] này giờ bỏ rơi Ta."
  mpo_chaotic_kurultai_succession.0008.desc_addition: "Rất có thể [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] kích động."
  mpo_chaotic_kurultai_succession.0008.desc_end: "\n\nBụi từ móng ngựa của họ theo hướng [maa_stealer.GetPrimaryTitle.GetName]. Ta hy vọng họ chết ở đó."
  mpo_chaotic_kurultai_succession.0008.a: "Ai cần họ nữa?"
 
  mpo_chaotic_kurultai_succession.1008.t: "[defecting_maa.GetNameNoTooltip] Sẵn Sàng"
  mpo_chaotic_kurultai_succession.1008.desc: "Một nhóm [defecting_maa.GetName] vũ trang đứng trước mặt Ta. Họ không giống cướp; thay vào đó, họ muốn phục vụ trong hàng ngũ của Ta.\n\nHọ đến từ [ruler_rustled.GetPrimaryTitle.GetName], chán nản bởi sự kế vị hỗn loạn của [ruler_rustled.GetTitledFirstNameNicknamedPossessive]."
  mpo_chaotic_kurultai_succession.1008.desc_addition: "Việc họ có mặt ở đây rất có thể vì [backing_kurultai.GetTitledFirstNameNicknamed], thành viên bất tuân của Kurultai [ruler_rustled.GetFirstNamePossessiveNoTooltip]."
  mpo_chaotic_kurultai_succession.1008.a: "Ta có thể dùng những binh sĩ này."
  mpo_chaotic_kurultai_succession.1008.b: "Gửi họ trở lại [ruler_rustled.GetFirstNameNoTooltip]."
  mpo_chaotic_kurultai_succession.1008.b.title: "[maa_stealer.GetFirstName] trả lại Binh Sĩ của Ngài"
  chaos_upgrade_maa_tt: "Những [men_at_arms|E] khác có thể được nâng cấp"
  regiment_destroyed_tt: "[regiment|E] của [defecting_maa.GetName] gia nhập [maa_stealer.GetFirstName]"
 
  mpo_chaotic_kurultai_succession.0009.t: "$chaotic_kurultai_title$ Kho Chia Rẽ"
  mpo_chaotic_kurultai_succession.0009.desc: "Anh chị em Ta giận dữ với phán quyết của Kurultai, cướp kho bạc lấy phần của họ."
  mpo_chaotic_kurultai_succession.0009.desc_addition: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.GetFirstNameNicknamed] của Ta nổi giận với phán quyết của Kurultai, cướp kho bạc lấy phần của [sibling_rival_1.GetHerHis].\n\n[sibling_rival_1.GetSheHe|U] sẽ trả giá cho sự phản bội này."
  mpo_chaotic_kurultai_succession.0009.desc_addition2: "\n\n[sibling_rival_1.GetFirstNameNicknamed], [sibling_rival_2.GetFirstNameNicknamed],"
  mpo_chaotic_kurultai_succession.0009.desc_addition3: "[sibling_rival_3.GetFirstNameNicknamed],"
  mpo_chaotic_kurultai_succession.0009.desc_addition4: "[sibling_rival_4.GetFirstNameNicknamed],"
  mpo_chaotic_kurultai_succession.0009.desc_addition5: "[sibling_rival_5.GetFirstNameNicknamed],"
  mpo_chaotic_kurultai_succession.0009.desc_end: "họ sẽ trả giá cho sự phản bội này."
  mpo_chaotic_kurultai_succession.0009.a: "Tham lam của họ sẽ bị trừng phạt."
 
  mpo_chaotic_kurultai_succession.0010.t: "$chaotic_kurultai_title$ Quyền Lực Yếu Đi"
  mpo_chaotic_kurultai_succession.0010.desc: "Họ cười nhạo Ta, gọi Ta là [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)]. Họ nói Ta yếu, không xứng làm [ROOT.Char.GetTitleAsNameNoTooltip]."
  mpo_chaotic_kurultai_succession.0010.desc_addition: "[backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] cười to hơn tất cả."
  mpo_chaotic_kurultai_succession.0010.desc_end: "\n\nChúng dám sỉ nhục sức mạnh của Ta sao!?"
  mpo_chaotic_kurultai_succession.0010.a: "Ta cần chứng minh họ sai..."
 
  mpo_chaotic_kurultai_succession.0011.t: "$chaotic_kurultai_title$ Cuồng Nộ Đàn Vật"
  mpo_chaotic_kurultai_succession.0011.desc: "Trong đêm khuya, đàn gia súc của Ta hoảng loạn — lửa bùng, thú vật hoảng sợ. Đây không phải tai nạn; chúng đã bị kích động, bị tổn thương."
  mpo_chaotic_kurultai_succession.0011.desc_addition: "[backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] chào Ta với nụ cười răng nhấp nháy."
  mpo_chaotic_kurultai_succession.0011.desc_end: "\n\nTa đã thu hồi được phần lớn. Số còn lại vẫn lao về [rustler.GetCapitalLocation.GetName]."
  mpo_chaotic_kurultai_succession.0011.a: "Nguyền rủa những thú vật nhát gan này!"
 
  mpo_chaotic_kurultai_succession.0012.t: "$chaotic_kurultai_title$ Vương Quốc Chia Rẽ"
  mpo_chaotic_kurultai_succession.0012.desc: "Quyết định đã được đưa ra. Ta chỉ thừa hưởng một nửa vương quốc. Phần còn lại thuộc về [sibling_rival_1.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.GetFirstNameNicknamed], người đã chuyển đến [sibling_rival_1.GetCapitalLocation.GetName]!\n\nHơn một nửa Kurultai ủng hộ điều này. Họ là những kẻ ngốc lầm đường."
  mpo_chaotic_kurultai_succession.0012.a: "Kurultai sẽ phải trả giá cho điều này!"
  sibling_tool_50_percent_tt: "[sibling_rival_1.GetFirstNameNicknamed], với sự giúp đỡ của [kurultai|E], đã tách một phần lớn [realm|E] của Ngài thành một [de_jure|E] [kingdom|E] mới"
 
  mpo_chaotic_kurultai_succession.0013.t: "$chaotic_kurultai_title$ Vương Quốc Tách Ra"
  mpo_chaotic_kurultai_succession.0013.desc: "Phán quyết rõ ràng — phần lớn lãnh thổ là của Ta. Phần còn lại thuộc về [sibling_rival_1.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.GetFirstNameNicknamed].\n\nMong [sibling_rival_1.GetSheHe] mục nát ở [sibling_rival_1.GetCapitalLocation.GetName]."
  mpo_chaotic_kurultai_succession.0013.a: "Nó sẽ là của Ta..."
  sibling_tool_20_percent_tt: "[sibling_rival_1.GetFirstNameNicknamed], với sự giúp đỡ của [kurultai|E], đã tách một phần nhỏ [realm|E] của Ngài thành một [de_jure|E] [kingdom|E] mới"
 
  mpo_chaotic_kurultai_succession.0014.t: "$chaotic_kurultai_title$ Tan Rã"
  mpo_chaotic_kurultai_succession.0014.desc: "Giận dữ, bực bội, la hét, tranh cãi. Không còn chỗ cho luật pháp, không còn chỗ cho quyết định. Chỉ còn chia rẽ.\n\nĐây là sự kết thúc của [ROOT.Char.GetPrimaryTitle.GetName]."
  mpo_chaotic_kurultai_succession.0014.desc_alt: "Nhưng những tiếng nói yếu ớt, bất lực. Không thể có quyết định, không thể có đúng sai, không có luật pháp.\n\nĐây là sự kết thúc của [ROOT.Char.GetPrimaryTitle.GetName]. Giá mà người tiền nhiệm Ta đã chọn đủ thành viên cho Kurultai..."
  mpo_chaotic_kurultai_succession.0014.a: "Ta sẽ rèn lại vương quốc của mình!"
  liege_primary_title_chaos_desc: "Chủ tể của Ngài mất [primary_title|E] do [succession|E] hỗn loạn"
  title_chaos_dissolved_tt: "[kurultai|E], không thể đi đến kết luận, đã khiến [realm|E] của Bạn tan rã"
 
  mpo_chaotic_kurultai_succession.0015.t: "$chaotic_kurultai_title$ Sấm Không Kỵ Sĩ"
  mpo_chaotic_kurultai_succession.0015.desc: "Họ bắt đầu chia đàn, cãi vã, tranh chấp, cho đến khi đánh nhau bùng nổ. Vật nuôi tán loạn, chạy cuồng loạn khắp nơi."
  mpo_chaotic_kurultai_succession.0015.desc_addition: "[backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] bất lực cố gắng gom đàn thú mà [backing_kurultai.GetSheHe] [backing_kurultai.GetHerselfHimself] đã làm hoảng sợ."
  mpo_chaotic_kurultai_succession.0015.desc_end: "\n\nTa đã mất cả ngày để cố gắng thu chúng lại. Phần lớn bị lạc hướng về [rustler.GetCapitalLocation.GetName]."
  mpo_chaotic_kurultai_succession.0015.a: "Đàn của Ta bị tàn sát!"
 
  mpo_chaotic_kurultai_succession.0016.t: "$chaotic_kurultai_title$ Chư Hầu Rút Lui"
  mpo_chaotic_kurultai_succession.0016.desc: "[tributary_leaving.GetFirstNameNicknamed] của [tributary_leaving2.GetPrimaryTitle.GetName], [tributary_leaving2.GetFirstNameNicknamed] của [tributary_leaving.GetPrimaryTitle.GetName], và [tributary_leaving3.GetFirstNameNicknamed] của [tributary_leaving3.GetPrimaryTitle.GetName] ngừng nộp cống tiền và đàn gia súc."
  mpo_chaotic_kurultai_succession.0016.desc_addition: "[backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] đã tiếp sức cho họ dám chống lại Ta."
  mpo_chaotic_kurultai_succession.0016.desc_end: "\n\nHọ sẽ lại quỳ lạy sớm thôi."
  mpo_chaotic_kurultai_succession.0016.a: "Những con cừu tới lò sát sinh."
 
  mpo_chaotic_kurultai_succession.0017.t: "$chaotic_kurultai_title$ Cống Vật Suy Yếu"
  mpo_chaotic_kurultai_succession.0017.desc: "Các chư hầu của Ta chứng kiến sự hỗn loạn. Họ thấy yếu đuối, chế nhạo, rồi rời đi. Những lời cãi vã át hết tiếng nói của Ta."
  mpo_chaotic_kurultai_succession.0017.desc_addition: "Hơn ai hết, [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] đã thổi bùng ngọn lửa, tiếp thêm dũng khí cho họ quay lưng lại với Ta."
  mpo_chaotic_kurultai_succession.0017.desc_end: "\n\nChỉ còn lại kẻ nhút nhát."
  mpo_chaotic_kurultai_succession.0017.a: "Họ sẽ sớm phục vụ Ta trở lại."
 
  mpo_chaotic_kurultai_succession.1000.t: "Các Khanate Kế Nhiệm"
  mpo_chaotic_kurultai_succession.1000.desc: "Đế quốc nằm trong tình trạng chia rẽ. Các người thừa kế tranh giành quyền lực, nhưng không ai đủ mạnh để chiếm đoạt. Ngoại trừ..."
  mpo_chaotic_kurultai_succession.1000.a: "Ta, tất nhiên."
  mpo_chaotic_kurultai_succession.1000.b: "[ilkhanate_ruler.GetFullNameNoTooltip]."
  mpo_chaotic_kurultai_succession.1000.c: "[red_horde_ruler.GetFullNameNoTooltip]."
