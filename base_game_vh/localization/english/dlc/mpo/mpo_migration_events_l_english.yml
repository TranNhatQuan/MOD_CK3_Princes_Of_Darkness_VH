l_english:

  migration_events.0001.t: "Một Nơi Để Gọi Là Nhà"
  migration_events.0001.desc.intro: "Bầu trời không một gợn mây sắp nhuốm đỏ khi chúng Ta đến [ROOT.Char.GetCurrentLocation.GetName]. Màu của một vết thương mới.\n\n"
  migration_events.0001.desc.drought: "Mảnh đất nứt nẻ chào đón chúng Ta với màu sắc ảm đạm. Hạn hán không hề nhẹ nhàng nơi đây.\n\n"
  migration_events.0001.desc.white_zud: "Tuyết mềm kêu cót két dưới móng ngựa. Lớp tuyết dày đến nỗi che phủ hết cỏ.\n\n"
  migration_events.0001.desc.havsarsan_zud: "Mưa, tuyết, gió mạnh. Thời tiết không chào đón chúng Ta như mong đợi.\n\n"
  migration_events.0001.desc.blessing: "Những tia nắng chiếu rọi những bông hoa nở rộ phủ kín cánh đồng tận tầm mắt. Ta ngửa cổ tận hưởng chút ấm áp.\n\n"
  migration_events.0001.desc.tributary: ""Những vùng đất này nộp cống hiến đầy đủ cho [overlord.GetTitledFirstName]", [recipient.GetTitledFirstName] cảnh báo. "Ta không mong [overlord.GetSheHe] chấp nhận khác đi."\n\n"
  migration_events.0001.desc.nomad: ""Hãy chăm sóc vùng đất," [recipient.GetTitledFirstName] gặp chúng Ta tại cửa vào khu định cư, mặc dù hầu hết dân đã rời đi.\n\n"
  migration_events.0001.desc.herder: "[recipient.GetTitledFirstName] chăn dắt đàn gia súc nhỏ [recipient.GetHerHis] với một chút khó khăn, biến mất vào phía xa. \n\n\""
  migration_events.0001.desc.nomad_obedient: ""[ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip] của Ta," [recipient.GetTitledFirstName] gặp chúng Ta tại cửa khu định cư, "Thật vinh dự khi Ta dâng đất này cho Ngài.\n\n""
  migration_events.0001.desc.nomad_angry: "[recipient.GetTitledFirstName] đi cuối đoàn rời trại. "Chúc may mắn," [recipient.GetSheHe] nói khô khan trước khi nhập đoàn.\n\n"
  migration_events.0001.desc.good: "Mùi cỏ non tươi hứa hẹn như Ta mong đợi. Chúng Ta sẽ ổn."
  migration_events.0001.desc.bad: "Cỏ khô vàng héo khi mặt trời rực đỏ. Không dễ dàng, nhưng một đời sống dễ dàng không tạo ra chiến binh giá trị."
  migration_events.0001.desc.meh: "Chất lượng đồng cỏ không tốt như Ta mong. Ít điều trong đời đúng như mong muốn."
  migration_events.0001.aaa: "Ta sẽ tôn trọng phong tục nơi đây."
  migration_events.0001.aa: "Ta không cúi trước ai."
  migration_events.0001.aa.cb_tt: "Nhận một #EMP $retaliation_cb$#! [casus_belli|E] trên Ngài trong #V 5#! năm"
  migration_events.0001.a: "Cuối cùng, chúng Ta đã đến đúng nơi."
  migration_events.0001.a.tt: "Tùy chọn này có vì Ngài đã theo ý muốn của [GetCourtPositionType('court_astrologer_court_position').GetName()]"
  migration_events.0001.b: "Hãy dựng trại."
  astrologer_desired_area_modifier: "Di Trú Mong Muốn"
  astrologer_desired_area_modifier_desc: "Nhờ tuân theo mong muốn của $court_astrologer_court_position$, nhân dân của nhân vật này quyết tâm chăm sóc đồng cỏ mới tốt nhất."
  msg_tributary_toast: "Lễ Nộp Cống"
  msg_tributary_toast_tt: "[new_tributary.GetShortUIName] đã di chuyển đến vùng đất của một trong những [tributaries|E] của Ngài và cúi chào"
  msg_tributary_toast_bad: "Từ Chối Cống"
  msg_tributary_toast_bad_tt: "[new_tributary.GetShortUIName] đã di chuyển đến vùng đất của một trong những [tributaries|E] của Ngài\nNgài nhận $retaliation_cb$ [casus_belli|E] trên [new_tributary.GetHerHim] trong #V 5#! năm"
 
  migration_events.0002.t: "Di Cư: Chiếm Đất"
  migration_events.0002.desc.intro: "Máu chảy xuống khuỷu tay Ta, nhuộm đất. Chúng Ta đã giành được vùng đất mới này và trại sẽ sớm dựng lên.\n\n"
  migration_events.0002.desc: "Tuy nhiên, người cai trị trước đây đã nộp cống cho [overlord.GetTitledFirstName], và [overlord.GetSheHe] sẽ không chấp nhận gì khác từ chúng Ta."
  migration_events.0002.desc.high_dominance: "Người ta nói [overlord.GetTitledFirstName] là chúa tể của những vùng đất này, vì [recipient.GetTitledFirstName] vẫn thường xuyên cống nạp cho [overlord.GetHerHim]. Chúng ta cũng mạnh mẽ như [overlord.GetSheHe], tại sao phải quỳ dưới chân [overlord.GetHerHis] mà cầu xin sự bảo hộ?"
  migration_events.0002.a: "Điều đó là công bằng."
  migration_events.0002.b: "Ta đã giành được đất của Ta!"
  migration_events.0002.b.alt: "Hah, cứ để [overlord.GetHerHim] tới đây nếu [overlord.GetSheHe] muốn vàng của ta."

  migration_events.1000.t: "Một Góc Xanh"
  migration_events.1000.desc: "Ngựa của bộ tộc Ta hổn hển, háo hức nếm cỏ địa phương. Ở đây, tại [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier], cỏ mọc dày và xanh. Người giàu nơi đây"
  migration_events.1000.desc.ruler_present: "tuân phục [local_ruler.GetFirstName], một [local_ruler.GetCulture.GetName] nhỏ [local_ruler.GetTitleAsNameNoTooltip]."
  migration_events.1000.desc.ruler_away: "trung thành với [local_ruler.GetCulture.GetName] [local_ruler.GetTitledFirstName], dù kỵ binh [local_ruler.GetHerHis] không thấy đâu."
  migration_events.1000.desc_outro: "\n\nChúng Ta được chào đón nồng hậu, nhận sữa và thịt... nhưng, qua giọng run rẩy, [ROOT.Char.GetCulture.GetCollectiveNoun] của Ta được thúc đi tiếp."
  migration_events.1000.a: "Marmot, chồn... da tốt có thể lấy được ở đây."
  migration_events.1000.a.flavor: "Ngài săn một vài thú hoang địa phương."
  migration_events.1000.b: ""#EMP Quà! Cống nộp!#! Nếu không, chúng Ta sẽ ập vào Ngài như bầy sói!"" 
  migration_events.1000.b.flavor: "Ngài tống tiền dân giàu và cướp trại họ."
  migration_events.1000.c: "Đàn Ta sẽ ăn cỏ ở đây một thời gian."
  migration_events.1000.d: "Ta cảm ơn và lên ngựa."
  custom.every_consort: "Mọi [spouse|E] và [concubine|E]"
  nomadic_comforts_modifier: "Tiện Nghi Du Hành Du Mục"
  nomadic_comforts_modifier_desc: "Du mục quý hiếm này chọn sự an toàn thoải mái thay vì yên ngựa."

  migration_events.1010.t: "Tại Sao Phi Khi Có Thể Cưỡi?"
  migration_events.1010.desc: "Từ chiếc lều lớn trên bánh xe, dưới cờ ngựa, đánh dấu trung tâm đoàn chúng Ta, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))|l] [spouse.GetFirstName] đến.\n\n"Con bò hùng mạnh có khóc khi thêm trọng lượng của một [ROOT.Char.GetWomanMan] không?" cô hỏi. "Không? Có lẽ Ngài sẽ ngồi cùng gia đình...?"\n\nNhà Ta được kéo bởi nhiều bò như vậy. Bên trong có gối ấm. Nhưng các kỵ sĩ khác nhìn Ta đầy xét đoán."
  migration_events.1010.a: "Cơ thể Ta cần nghỉ ngơi."
  migration_events.1010.b: ""Người thân yêu... có thể con đường #EMP gập ghềnh#! đang chờ.""
  migration_events.1010.c: ""Ta cưỡi đầu [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]. Luôn luôn.""
  migration_events.1010.d: "Ta sẽ bước lên."
  migration_events.1010.d.flavor: "Sau nhiều giờ cưỡi... một [ROOT.Char.GetWomanMan] thèm cảm giác rung lắc, nhún nhảy quen thuộc ở nhà."

  migration_events.1020.t: "Người Thầy Cho Người Chăn Dê"
  migration_events.1020.desc: "\"[ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier], họ gọi nơi này là thế!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l] của ta, [aspirant.GetFirstName], phun ra những lời khinh miệt. \"Những đàn cừu của nó... ai bảo vệ chúng? Một con chó, và một [herder.GetWomanMan] nhỏ bé tên là [herder.GetTitledFirstName]!\"\n\n\"Chỉ vài con ngựa, vài kỵ sĩ thiện chiến — #EMP bóp nát cổ [herder.GetFirstNamePossessiveNoTooltip] trong tay ta#! — và vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] này có thể là của ta!\"\n\n[aspirant.GetFirstNameNoTooltip] nhìn chằm chằm vào bầy dê đi ngang qua đầy thèm khát... và chờ đợi sự ban phước từ [aspirant.GetHerHis] [aspirant.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|l]."
  migration_events.1020.a: ""Ngươi sẽ nộp cống cho ta, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l].""
  migration_events.1020.b: ""Đi, và sử dụng quyền lực của [ROOT.Char.GetHouse.GetNameNoTooltip]!"" 
  migration_events.1020.b.flavor: "Ngài thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l] đã được thiết lập vững chắc ở đây."
  migration_events.1020.c: ""Hãy dẫn theo vài người, và chia tay họ hàng.""
  migration_events.1020.d: ""Ở lại với dân của ngươi, [aspirant.GetFirstNameNoTooltip].""

  migration_events.1030.t: "Con Đường Cằn Cỗi"
  migration_events.1030.desc: "Chúng Ta dẫn đàn lớn ngựa, bò, dê và cừu. Nếu gặp đồng cỏ tốt, đàn có thể nghỉ và ăn... nhưng đất trống, nơi cỏ chưa bị cắt thấp, hiếm ở [location_county.GetNameNoTier].\n\nChúng Ta để ngựa tốt ăn cỏ còn sót. Phần còn lại yếu đói."
  migration_events.1030.a: "Người cai trị địa phương #EMP sẽ#! cho dùng đất tốt nhất của [local_ruler.GetHerHis]."
  migration_events.1030.b: "Ta có thể trao đổi những con yếu nhất..."
  migration_events.1030.b.flavor: "Đồ của Ngài trông như cái chết, nhưng [local_ruler.GetNameNoTooltip] vẫn có thể bị thuyết phục mua."
  migration_events.1030.c: "Nếu chúng sẽ chết... thì tốt hơn hết để ăn."
  migration_events.1030.c.flavor: "Giết gia súc và tổ chức tiệc cho dân."
  migration_events.1030.d: "Chúng Ta phải tìm đồng cỏ tốt nơi đây."
  migration_events.1030.d.success: "Ngài dẫn đàn đến no nê"
  migration_events.1030.d.failure: "Không tìm thấy gì, đàn đói"

  migration_events.1040.t: "Chào Đón Tại [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]"
  migration_events.1040.desc: "Người cai trị địa phương — [local_ruler.GetName] — đến chào nồng hậu. [ROOT.Char.GetCulture.GetCollectiveNoun] và gia súc đi qua.\n\n"[ROOT.Char.GetTitleAsName], ngươi ngồi cạnh Ta và ăn bữa ấm?" [local_ruler.GetFirstNameNoTooltip] hỏi, theo tục lệ.\n\n[local_ruler.GetHerHis|U] bầy Ta tặng quà:"
  migration_events.1040.furs: "đồ trang trí từ sừng, lông thú, và một con ngựa non mạnh mẽ."
  migration_events.1040.camels: "nước mát từ suối địa phương, và một đàn lạc đà cao."
  migration_events.1040.wool: "áo choàng len mịn, đàn cừu, và một con dê cao như ngựa đực."
  migration_events.1040.horses: "yên cương da tốt và đôi ngựa khỏe."
  migration_events.1040.a: ""#EMP Chỉ thế này thôi...? Chỉ tặng thế này thôi...?"" 
  migration_events.1040.b: "Với vui mừng, Ta trao quà đổi quà."
  migration_events.1040.c: "Không còn thời gian cho ngươi, nhỏ [local_ruler.GetTitleAsNameNoTooltip]."
  migration_events.1040.d: "Ta sẽ ăn."

  mpo_refusing_diplomatic_stops_modifier: "Khước Từ Các Dừng Ngoại Giao"
  mpo_refusing_diplomatic_stops_modifier_desc: "Du mục này dẫn nhân dân đi liên tục, vượt qua dân địa phương thân thiện và phép lịch sự thường lệ."
  cultural_acceptance_meal_of_hospitality: "Tiếp đón du cư và khách lữ hành"

  migration_raiding_effect_tt: "[holdings|E] Ngài [migrate|E] qua sẽ mang @gold_icon![gold|E] và @herd_icon![herd|E], nhưng Ngài mất [opinion|E] và [cultural_acceptance|E] với [holder|E] của họ"
  migration_raiding_effect_no_culture_tt: "[holdings|E] Ngài [migrate|E] qua sẽ mang @gold_icon![gold|E] và @herd_icon![herd|E], nhưng Ngài mất [opinion|E] với [holder|E] của họ"

  cultural_acceptance_recompense_for_raiding: "Đền Bù Cho Bạo Lực"
  cultural_acceptance_raiding_migrators: "Cướp Bóc Du Cư"

  migration_events.1051_title: "Cướp Bóc Khi Di Cư"
  migration_events.1051_tooltip: "Nhân dân Ngài cướp [raided_settlement.GetName]."

  migration_events.1050.t: "Đi Qua Như Lửa"
  migration_events.1050.desc: "Kỵ binh tiên phong của Ta, lan rộng xa khỏi đàn và xe, tuần tra đất đi qua như báo.\n\n"Dân địa phương bắn mũi tên đầu tiên!" báo cáo trưởng kỵ binh, [warrior.GetFirstName], "nhưng với lửa và kiếm, chúng ta khiến họ hối hận! Chúng Ta mang mọi chiến lợi phẩm của trại họ — và [newly_created_artifact.GetName]!"" 
  migration_events.1050.a: "Sự dữ dội của [warrior.GetFirstNamePossessiveNoTooltip] xứng đáng được thưởng."
  migration_events.1050.b: ""#EMP Ấp vào mọi nhà chúng ta đi qua, chiến binh của ta!#!"" 
  migration_events.1050.c: "Trả chiến lợi phẩm và xin lỗi chủ."
  migration_events.1050.d: "Phân phát chiến lợi phẩm cho chiến binh."
  migration_events.1050.e: "Ta chiếm chiến lợi phẩm tại [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]."

  migration_events.1060.t: "Chậm Như Cừu"
  migration_events.1060.desc_desert: "Gia súc khát, nhưng qua [root_location.GetName], nước rất ít. Chúng Ta lê từng bước dưới nắng cháy."
  migration_events.1060.desc_forest: "Cây cối ở [root_location.GetName] đứng sát như binh lính, cỏ rậm hơn nữa. Dây gai xé lông cừu. Chúng Ta dẫn đàn qua lối hẹp."
  migration_events.1060.desc_wetlands: "Đường qua [root_location.GetName] như ruột bẩn: bùn dính và nước thối. Gia súc vấp ướt, kêu la. Lúc nào cũng phải giải cứu."
  migration_events.1060.desc_hilly: "Con đường của chúng ta băng qua [root_location.GetName] uốn lượn lên những con dốc đứng, đi xuống những khe núi hẹp, làm cả người và thú đều kiệt sức. Những người chăn gia súc của ta phải ghé vai đẩy lũ gia súc cứng đầu, hò hét và kéo chúng, nhưng lũ vật nuôi kiệt quệ vẫn gần như không thể leo nổi."
  migration_events.1060.desc_winter: "Tuyết trắng phủ đất [root_location.GetName], đường đi chỉ bằng đá và lết. Gia súc tụ lại giữ ấm, đói làm chậm."
  migration_events.1060.desc: "\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('warrior'))|l] [warrior.GetFirstName] không kiên nhẫn với tốc độ tồi tệ này.\n\n"Để Ta tập hợp kỵ sĩ trẻ nhất!" [warrior.GetSheHe] cầu xin. "Chúng ta sẽ phi tới [destination.GetNameNoTier], chuẩn bị cho Ngài. Cực nhọc này, dẫn bò và dê, không xứng với chiến binh!""
  migration_events.1060.a: "Ta sẽ tìm đường nhanh, nhẹ hơn."
  mpo_migration_events.1060.a.success: "Ngài dẫn dân qua đường nhẹ nhàng hơn"
  mpo_migration_events.1060.a.failure: "Một vòng đi mệt mỏi và ngu ngốc"
  migration_events.1060.b: ""Đi, trinh sát nơi ở mới! Chuẩn bị tốt.""
  migration_events.1060.c: ""Ở lại, giúp kẻ yếu. Họ cần sức Ngài.""

  mpo_migration_prepared_home_modifier: "Nhà Mới Chuẩn Bị Tốt"
  mpo_migration_prepared_home_modifier_desc: "Chọn được nơi tốt nhất cho định cư du mục và dọn dẹp chướng ngại địa phương."
  mpo_migrating_accolade_duke_modifier: "Chiến Đoàn Di Cư"
  mpo_migrating_accolade_king_modifier: "$mpo_migrating_accolade_duke_modifier$"
  mpo_migrating_accolade_emperor_modifier: "$mpo_migrating_accolade_duke_modifier$"
  mpo_migrating_without_labor_modifier: "Di Cư Thiếu Lao Động"
  mpo_migrating_without_labor_modifier_desc: "Nhân vật này di chuyển dân qua đất mà không có sự giúp đỡ của kỵ sĩ trẻ."
  mpo_found_paths_for_herds_modifier: "Đường Nhẹ Nhàng Cho Đàn"
  mpo_found_paths_for_herds_modifier_desc: "Lãnh đạo khôn ngoan này dẫn gia súc bằng sự hiểu biết và cẩn trọng với đất đai."
