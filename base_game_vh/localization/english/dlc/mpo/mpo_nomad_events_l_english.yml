  mpo_nomad_events.1120.t: "Bầy Sói Mùa Đông"
  mpo_nomad_events.1120.desc: "Gió băng không gào thét một mình ở [capital_province.GetTitle.GetNameNoTier]. Không trong mùa đông ác độc này. Không trong đêm này.\n\n#EMP "Sói! Sói giữa đàn cừu!"#! vang lên, khi kỵ sĩ và ta nhanh chóng trèo lên yên.\n\nĐàn cừu, tụm lại, phát ra tiếng thét kinh hãi. Những con thú lông tối kéo chân, cổ chúng và lao về phía hoang mạc tối tăm."
  mpo_nomad_events.1120.a: "Sói? Phì! Kỵ sĩ ta vô số."
  mpo_nomad_events.1120.a.flavor: "Không loài săn mồi nào ở [capital_county.GetNameNoTierNoTooltip] có thể lọt qua bầy ta…"
  mpo_nomad_events.1120.b: "Cưỡi nhanh — vây chúng lại!"
  mpo_nomad_events.1120.b.success: "Không con sói nào nhanh hơn ngựa ngươi"
  mpo_nomad_events.1120.b.failure: "Trong hỗn loạn, sói thoát đi"
  mpo_nomad_events.1120.c: "#EMP Tên! Tên!#! Ta sẽ lấy da chúng!"
  mpo_nomad_events.1120.c.success: "Mũi tên của ngươi kết liễu thú"
  mpo_nomad_events.1120.c.failure: "Mũi tên của ngươi trúng ngựa và cừu"
  mpo_nomad_events.1120.d: "Dừng! Chúng chỉ loại bỏ đàn yếu."
  mpo_nomad_events.1120.d.flavor: "Trong mùa này, không còn cừu con để ăn cắp: chỉ còn già và bệnh. Chúng ta không nên từ chối điều đó cho sói."
