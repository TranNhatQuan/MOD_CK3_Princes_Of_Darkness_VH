l_english:
  GetMongolHonorific_dreaded: "khét tiếng"
  GetMongolHonorific_dreadful: "kinh khủng"
  GetMongolHonorific_mighty: "mạnh mẽ"
  GetMongolHonorific_fearsome: "đáng sợ"
  GetMongolHonorific_frightful: "khủng khiếp"
 
  nomad_events.ill_advised.header: "Thiếu Sáng Suốt"
  nomad_events.0001.t: "$nomad_events.ill_advised.header$?"
  nomad_events.0001.desc: "Một bước chân nặng nề và ồn ào phá vỡ sự im lặng của đêm.\n\n"Ngươi hẳn cũng thấy điều đó, [ROOT.Char.Custom('FormOfAddressForLiege')]," [jealous_courtier.GetFirstName] — người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier'))|l] của ta — quở trách khi [jealous_courtier.GetSheHe] bước vào ger của ta, "Người đó, [achmach_scope.GetTitledFirstName], xuất sắc quá mức trong công việc. [achmach_scope.GetSheHe|U] nói quá nhiều, nhận quá nhiều ủng hộ, đi lại quá thường xuyên. Mọi thứ dường như luôn thuận theo [achmach_scope.GetHerHis]."\n\nĐôi mắt [jealous_courtier.GetFirstNamePossessiveNoTooltip] hẹp lại, "Chẳng lẽ không phải, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip] của ta, rằng [achmach_scope.GetSheHe] đang dùng một thứ... ma thuật đen tối để đạt được điều [achmach_scope.GetSheHe] muốn?""
  nomad_events.0001.a: "[achmach_scope.GetSheHe|U] phải ra đi."
  nomad_events.0001.b: "Lời nói của kẻ đố kỵ."
  achmach_firing_tt: "@alert_icon! [achmach_scope.GetShortUIName] không thể được thuê lại trong 5 năm#!"
 
  nomad_events.0002.t: "$nomad_events.ill_advised.header$: Những Câu Hỏi"
  nomad_events.0002.desc.calm: "\"Thành thật mà nói, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip],\" [achmach_scope.GetTitledFirstName] khăng khăng, hạ thấp giọng [achmach_scope.GetHerHis] cho đến khi gần như không thể phân biệt được với ngọn lửa đang cháy lách tách. \"Thần có thể làm điều gì khác đi không? Thần đã làm ngài thất vọng thế nào?\""
  nomad_events.0002.desc.angry: "\"Đôi mắt của thần không thể tin rằng [ROOT.Char.GetTitleAsNameNoTooltip] đáng sợ của chúng ta lại bị lừa như vậy.\" [achmach_scope.GetTitledFirstNameNoTooltip] càu nhàu, quay mặt [achmach_scope.GetHerHis] đi khỏi ngọn lửa. \"Nếu sự hiện diện cai trị của ngài chỉ nghe theo những lời đồn thổi, thần hy vọng ngài chắc chắn đâu là điều có thật.\""
  nomad_events.0002.desc.fallback: ""Ta sẽ không hỏi vì sao, khét tiếng [ROOT.Char.GetTitleAsNameNoTooltip] của ta, rằng ta bị xa rời bên cạnh ngươi, nhưng sẽ cảnh báo ngươi về điều gì đó," [achmach_scope.GetTitledFirstNameNoTooltip] nói sau khi uống [achmach_scope.GetHerHis] [Glossary( 'kumis', 'KUMIS_GLOSS')]."
  nomad_events.0002.desc.outro: "\n\n"Hãy suy nghĩ một chút, và tự hỏi... có lý do gì mà [jealous_courtier.GetTitledFirstName] đã nói xấu ta không? Có lẽ ai đó đang cố ngăn ngươi đến gần những kẻ chăm lo cho ngươi nhất.""
  nomad_events.0002.a: ""Ta hối hận đã đẩy ngươi ra khỏi bên cạnh ta.""
  nomad_events.0002.b: ""Ta đã đưa ra quyết định của mình.""
 
  nomad_events.0003.t: "$nomad_events.ill_advised.header$: Nơi Có Khói"
  nomad_events.0003.desc.intro: "Đống lửa giờ hầu như chỉ còn tro. Những cuộc trò chuyện say xỉn lặng dần trước khi lại vang lên. Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier_2'))|l] [jealous_courtier_2.GetFirstName] tiến đến gần ta, chẳng chút tế nhị.\n\n"
  nomad_events.0003.desc.rehired: ""Lòng tốt của ngươi quá lớn, [ROOT.GetCharacter.Custom('GetMongolHonorific')] của ta. [achmach_scope.GetTitledFirstName] hẳn đã dùng ma lực hùng mạnh để lừa ngươi như vậy.""
  nomad_events.0003.desc.not_rehired: ""Ngay cả khi đã đẩy [achmach_scope.GetTitledFirstName] ra khỏi bên cạnh ngươi, ta e rằng mưu kế của [achmach_scope.GetHerHis] vẫn chưa dừng.""
  nomad_events.0003.desc.outro: "\n\n"Những đau khổ do [achmach_scope.GetHerHim] gây ra dường như không có hồi kết!" [jealous_courtier_2.GetSheHe] thở dài lớn. "Chẳng còn nghi ngờ gì rằng [achmach_scope.GetSheHe] thì thầm những nghi thức cấm kỵ và ma thuật nguy hiểm, bởi tất cả [dummy_attracted_gender.GetWomenMen] đều chạy đến vòng tay [achmach_scope.GetHerHis]!""
  nomad_events.0003.a: "Ta hiểu vì sao rồi..."
  nomad_events.0003.b: "Chuyện này chấm dứt."
  nomad_events.0003.c: "#EMP Ha, ha, ha!#!"
  nomad_events_0003_b_tt: "Bản tính thất thường của ngươi gây ấn tượng kém"
  mpo_assertion_modifier: "Lãnh Chúa Bảo Vệ"
  mpo_assertion_modifier_desc: "Nhân vật này khẳng định quyền của mình trước một cố vấn đa tình."
  nomad_events_0003_a_tt: "[scheme|E] của Ngài khởi đầu với tiến trình cao hơn và nhận được [modifier|E] [GetModifier('extra_success_chance_modifier').GetNameWithTooltip]"
 
  nomad_events.0004.opening: "Gửi tới [ROOT.Char.GetTitleAsNameNoTooltip] nhân từ nhất,"
  nomad_events.0004.desc: "Ta cầu xin ngươi nhận món quà khiêm tốn này, thu thập bằng mọi nỗ lực.\n\nCảm ơn lòng tin lớn lao của ngươi dành cho ta."
  nomad_events.0004.a: "Thật là một chi tiết đẹp."
 
  nomad_events.0005.desc: "Kền kền sẽ đến bóc lột ngươi.\n\nHãy cẩn thận."
  nomad_events.0005.a: "Cái gì thế này...?"
  nomad_events_0005_tt: "Ngươi có thể dùng $interrogate_interaction$ [character_interaction|E] trên [achmach_scope.GetShortUIName], [jealous_courtier.GetShortUIName] và [jealous_courtier_2.GetShortUIName]"
  nomad_events_0005_tt_only_one: "Giờ đây Ngài có thể sử dụng [character_interaction|E] $interrogate_interaction$ lên [achmach_scope.GetShortUIName] và [jealous_courtier.GetShortUIName] để tìm ra ý nghĩa của bức thư bí ẩn"
 
  nomad_events.0006.t: "$nomad_events.ill_advised.header$: Thẩm Vấn"
  nomad_events.0006.desc.achmach: "Lều của [recipient.GetTitledFirstNamePossessive] tối đến mức khó nhìn nếu không nheo mắt. [recipient.GetFirstNameNoTooltip] ngồi trên một chiếc đệm [ROOT.Char.Custom('GetSimpleColor')].\n\n"Ah, [ROOT.GetCharacter.Custom('GetMongolHonorific')] của ngươi, sao ngươi lại ban phúc cho ta như vậy?"" 
  nomad_events.0006.desc.courtier: "[recipient.GetTitledFirstName] nằm trên giường của [recipient.GetHerHis], bình thản nhấp một chút [Glossary( 'boal', 'BOL_GLOSS')].\n\n\"[ROOT.GetCharacter.Custom('GetMongolHonorific')|U]!\" [recipient.GetSheHe] đứng dậy ngay lập tức khi ta bước vào, và đưa cho ta bát của chính [recipient.GetHerHis]: \"Xin ngài, thần phải hỏi tại sao ngài lại ghé thăm thần.\""
  nomad_events.0006.desc.courtier_2: "[recipient.GetTitledFirstName] [recipient.Custom('quirk_pos_present')] khi ta bước vào lều của [recipient.GetHerHis]. Mùi cỏ tươi vẫn còn vương trên quần áo của [recipient.GetHerHis].\n\n\"Thưa [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.GetCharacter.GetLadyLord] của thần! Xin ngài hãy nói, thần có thể phục vụ ngài thế nào?\""
  nomad_events.0006.desc.calm: "\n\nTa đưa thông điệp cho [recipient.GetHerHim], chờ lời giải thích."
  nomad_events.0006.desc.fallback: "\n\nTa ném thông điệp xuống chân [recipient.GetHerHis], đòi giải thích."
  nomad_events.0006.desc.achmach_outro: "\n\n"Ah, ta thấy thông điệp đã tới ngươi. Ta đã cảnh báo trước, kẻ đáng sợ. Ta có thể nhịn đói những con chó cho đến khi chúng không đi nổi, để chúng không cắn chủ.""
  nomad_events.0006.desc.courtier_outro: "\n\n"Chắc ngươi không tin điều đó nói về ta, [ROOT.Char.GetTitleAsNameNoTooltip] của ta. Ta chỉ cố bảo vệ ngươi!""
  nomad_events.0006.desc.courtier_outro_2: "\n\n[recipient.GetFirstNameNoTooltip] lo lắng gãi cổ [recipient.GetHerHis] trước khi khăng khăng: \"Thần không có gì liên quan đến việc đó.\""
  nomad_events.0006.a: "Ta sẽ moi ra sự thật từ ngươi như vắt sữa ngựa."
  nomad_events.0006.b: "Bức thư rõ ràng nói về ma thuật đen."
  nomad_events.0006.c: "Sao ngươi trông lo lắng thế?"
  nomad_events.0006.d: "Biến kẻ thù của ta thành xác thối."
  nomad_events.0006.e: "Ngươi không đáng tin."
  nomad_events.0006.f: "Ta tin điều đó không liên quan đến ngươi."
  bol: "bol"
  BOL_GLOSS: "Một loại đồ uống lên men từ mật ong, tương tự rượu mead."
  nomad_events_0006_d_tt: "Tất cả [GetScheme('murder').GetTypeName] [schemes|E] của ngươi sẽ có [success_chance|E] cao hơn miễn là [achmach_scope.GetShortUIName] là [councillor|E] của ngươi"
  nomad_events_0006_c_success_info: "Ngươi phát hiện lý do sự bất an"
  nomad_events.0006.c.success: "[recipient.GetShortUIName] thú nhận"
  nomad_events_0006_c_success_loyal: "Họ chỉ ghen tị"
  nomad_events_0006_c_success_disloyal: "Họ chứng kiến một nghi lễ đen"
  nomad_events.0006.c.failure: "Ý định của [recipient.GetShortUINamePossessive] vẫn chưa rõ"
 
  ACHMACH_MURDER_BONUS: "Lời hứa của cố vấn tài ba"
 
  nomad_events.0007.t: "$nomad_events.ill_advised.header$: Gạc Bị Gãy"
  nomad_events.0007.desc.imprisoned: "Không nhiều người tiếp cận tù nhân. Không có đống lửa khiến họ run rẩy. Nhưng khi ta tiến lại gần, nhận thấy [achmach_scope.GetTitledFirstName] chẳng thấy đâu."
  nomad_events.0007.desc.fallback: "Ta thấy [achmach_scope.GetTitledFirstName] xin phép rời khỏi cuộc uống rượu và đánh nhau, sớm hơn thường lệ. [achmach_scope.GetSheHe|U] đi qua lều của [achmach_scope.GetHerHis], và tiến về phía vùng hoang dã."
  nomad_events.0007.desc.outro: "\n\nMột tiếng nứt đột ngột giúp ta dễ dàng theo dõi các bước chân của [achmach_scope.GetHerHis] và ta thấy [achmach_scope.GetHerHim] đang ngồi xổm trên mặt đất, cái bóng dài của [achmach_scope.GetHerHis] lơ lửng trên một vài công cụ.\n\n[achmach_scope.GetSheHe|U] bẻ gãy gạc hươu như những cành cây mỏng manh, những mảnh vụn của chúng bay ra theo mọi hướng."
  nomad_events.0007.aa: "Ta biết rồi! [achmach_scope.GetSheHe|U] chống lại ta! Ai cũng vậy!"
  nomad_events.0007.a: "#EMP Ha!#! Ta đã thấy chuyện này cả triệu lần."
  nomad_events.0007.b: "Ngươi #EMP thực sự#! đang làm gì?"
  nomad_events.0007.b.success: "Ngươi chắc chắn về ý định của [achmach_scope.GetShortUINamePossessive]"
  nomad_events.0007.b.failure: "Ý định của [achmach_scope.GetShortUINamePossessive] vẫn chưa rõ với ngươi"
  nomad_events.0007.c: "Nói sự thật đi. #EMP Ngay lập tức.#!"
  nomad_events_0007_b_success_info: "Ngài sẽ khám phá ra bản chất thực sự của buổi nghi lễ"
 
  nomad_events.0008_0009.desc.intro: "Khói bốc ra, nhợt nhạt như thịt xác chết. [achmach_scope.GetTitledFirstName] lẩm bẩm một câu thần chú, rồi lớn tiếng hơn, [achmach_scope.GetSheHe] tuyên bố:\n\n"
  nomad_events.0008.t: "$nomad_events.ill_advised.header$: Ưu Ái Trời"
  nomad_events.0008.desc: "$nomad_events.0008_0009.desc.intro$"Nguyện sự ưu ái của [achmach_scope.GetFaith.HighGodName] bảo vệ [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip], [ROOT.Char.Custom('FormOfAddressForLiege')]. Nguyện kẻ thù của [ROOT.Char.GetHerHis] ngã xuống như đá từ núi cao."\n\n[achmach_scope.GetSheHe|U] quay lại nhìn ta, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('achmach_scope'))], "[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] của ngươi, bầu trời sẽ bảo vệ ngươi bây giờ," [achmach_scope.GetSheHe] nói, đưa ta một bùa làm từ gạc."
  nomad_events.0008.a: "Thần [achmach_scope.GetFaith.HighGodName] mà ngươi nhắc tới... hãy kể cho ta nghe thêm."
  nomad_events.0008.b: "Ta sẽ luôn đeo nó."
  nomad_events.0008.c: "Công việc thật ấn tượng! Xin, hãy tập trung vào nó."
  magic_amulet: "Bùa Bảo Vệ"
  magic_amulet_desc: "Một mảnh gạc gãy, còn ướt máu. Ngạnh gạc bị cháy sém."
  nomad_events_0008_b_tt: "Cho phép truy cập $pray_to_protective_amulet_decision$ [decision|E] miễn là [newly_created_artifact.GetName] [artifact|E] đang được trang bị."
  pray_to_protective_amulet_decision: "Cầu nguyện $magic_amulet$"
  pray_to_protective_amulet_decision_desc: "Một bùa thiêng cho mục đích bảo vệ."
  pray_to_protective_amulet_decision_confirm: "Cầu nguyện."
  pray_to_protective_amulet_decision_tooltip: "Giảm [stress|E] qua cầu nguyện"
  pray_to_protective_amulet_decision_valid_tt: "$magic_amulet$ [artifact|E] phải đang được trang bị"
  pray_to_protective_amulet_decision_toast: "Lời cầu nguyện mang lại bình yên"
 
  nomad_events.0009.t: "$nomad_events.ill_advised.header$: Máu trên Xương"
  nomad_events.0009.desc: "$nomad_events.0008_0009.desc.intro$\"Cầu mong sự phẫn nộ của [achmach_scope.GetFaith.HighGodName] đổ lên kẻ không xứng đáng [ROOT.Char.GetTitledFirstNameNoTooltip]. Cầu mong cuộc đời của [ROOT.Char.GetHerHis] ngắn ngủi và đầy đau khổ.\"\n\n[achmach_scope.GetSheHe|U] quay lại và nhìn thấy ta, hai tay [achmach_scope.GetHerHis] ngay lập tức nắm chặt lấy lá bùa trên ngực [achmach_scope.GetHerHis] để bảo vệ."
  nomad_events.0009.a: "Ta sẽ bổ vỡ đầu ngươi!"
  nomad_events.0009.b_imprisoned: "Ngươi cầm gì đó?"
  nomad_events.0009.b: "Tan thành tro bụi! Và đưa cho ta cái đó."
  nomad_events.0009.c: "Đây là lần #EMP cuối cùng#! chúng bắt ta bất ngờ."
  mpo_eyes_everywhere_modifier: "Mắt Nhìn Mọi Nơi"
  mpo_eyes_everywhere_modifier_desc: "Nhân vật này đã quyết định dồn toàn lực để ngăn chặn các âm mưu nhắm vào mình."
 
  nomad_events.0010.t: "$nomad_events.ill_advised.header$: Dao trong Bóng Tối"
  nomad_events.0010.desc.intro: "Tôi mơ về bầu trời vô tận, mây xoáy, tan biến, mưa và sấm chớp liên miên. Một giọt nước rơi xuống ngực và cái lạnh đánh thức tôi.\n\n"
  nomad_events.0010.desc.loyal: "Một bóng người đội mũ trùm đứng trên người tôi, dao áp vào cổ.\n\n"Hạ xuống!" [achmach_scope.GetTitledFirstName] đẩy họ ra, và họ rên lên khi lưng va vào tường."
  nomad_events.0010.desc.disloyal: "[achmach_scope.GetTitledFirstName] đứng trên người tôi, dao áp vào cổ. Tôi đẩy [achmach_scope.GetHerHim] xuống nhưng [achmach_scope.GetSheHe] đứng dậy gần như ngay lập tức."
  nomad_events.0010.aaa: "Ngươi không biết mình đang đùa với ai đâu..."
  nomad_events.0010.aa: "Ta #EMP ra ngoài#!!"
  nomad_events_0010_aa_tt: "Ngươi chạy hết sức mình"
  nomad_events.0010.a: "[achmach_scope.GetShortUIName], tấn công [assassin.GetHerHim]!"
  nomad_events.0010.a.success: "[achmach_scope.GetShortUIName] giết được sát thủ"
  nomad_events.0010.a.failure: "Sát thủ làm [achmach_scope.GetShortUIName] bị thương"
  nomad_events.0010.b: "Bảo vệ! Bảo vệ!"
  nomad_events.0010.b.success: "Bảo vệ của ngươi đã chờ sẵn bên ngoài"
  nomad_events.0010.b.failure: "Bảo vệ của ngươi lơ là"
  nomad_events.0010.c_imprisoned: "Quay về hang của ngươi!"
  nomad_events.0010.c: "Ngươi sẽ trả giá!"
  nomad_events.0010.c.success: "Ngươi thắng trong cuộc chiến"
  nomad_events.0010.c.failure: "[dueling_enemy.GetShortUIName] làm ngươi bị thương"
  mpo_imprisoned_assassin_modifier: "Kẻ Thù Bị Giam"
  mpo_imprisoned_assassin_modifier_desc: "Nhân vật này đã giam được kẻ định giết mình."
 
  nomad_events.0100.t: "Không Phải Đàn Của Ta"
  nomad_events.0100.desc: ""Ngươi có tin được không, [ROOT.Char.GetTitleAsNameNoTooltip]!?" [vassal_1.GetTitledFirstName] phi nước đại về phía tôi. "Kẻ [vassal_2.Custom2('InsultAdjective', SCOPE.sC('vassal_1'))] [vassal_2.GetFirstName] đã lấy trộm vài con thú của ta trong đêm, len lỏi vào chuồng như sâu qua khe hở."\n\n"Ta yêu cầu tất cả những gì bị lấy đều được trả lại, nếu không ta sẽ thu hồi chúng chính tay.""
  nomad_events.0100.aa: ""Ta nghĩ những con đó là của ta.""
  nomad_events.0100.a: ""[vassal_2.GetTitledFirstNameNoTooltip] phải trả lại đàn thú.""
  nomad_events.0100.b: ""Ta không tin những cáo buộc này.""
  nomad_events.0100.c: ""Ngươi rảnh rỗi mà làm phiền [ROOT.Char.GetTitleAsNameNoTooltip] với những chuyện vô lý này?"" 
  friend_supported_in_herd_dispute: "[CHARACTER.GetShortUIName|U] đã ủng hộ [TARGET_CHARACTER.GetShortUIName] trong tranh chấp đàn thú"
  friend_supported_in_herd_dispute_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] được [CHARACTER.GetShortUIName] ủng hộ trong tranh chấp đàn thú"
 
  nomad_events.0110.t: "Bị Dồn Vào Góc"
  nomad_events.0110.desc: "Tuyết. Cây rì rào. Tiếng hú xa xa. Mặc dù... không quá xa.\n\n"Giúp với! Giúp với!" Không khó nhận ra giọng [victim.GetTitledFirstNamePossessive], và tôi chạy tới. #EMP "Xin cứu với!"#!\n\nKhi tới, tôi thấy [victim.GetFirstNameNoTooltip] trú sau mấy tảng đá, và một con sói đơn độc đang tiến đến [victim.GetHerHim]."
  nomad_events.0110.a: ""$knight_culture_player_plural_no_tooltip$, tấn công nó!"" 
  nomad_events.0110.b: ""Ta sẽ gãy cổ ngươi, thú dữ!"" 
  nomad_events.0110.b.success: "Ngươi xua đuổi được con thú"
  nomad_events.0110.b.failure: "Con thú làm ngươi bị thương"
  nomad_events.0110.c: ""Chạy đi, [victim.GetFirstNameNoTooltip]!"" 
  nomad_events.0110.c.success: "[victim.GetShortUIName] chạy với tốc độ nhanh nhất mà [victim.GetSheHe] từng chạy"
 
  nomad_events.0120.t: "Cuộc Phiêu Lưu Buổi Tối"
  nomad_events.0120.desc: "Những đám mây trên đầu tạo hình các loài thú, và [companion.GetFirstName] và tôi tiến xa hơn khỏi trại một chút.\n\n"Ngươi đã từng đi xa nhất bao nhiêu, [ROOT.Char.GetTitleAsNameNoTooltip]?"\n\n"Với ta thì không xa lắm," giọng [companion.GetHerHis] gần như ngại ngùng. "Nhưng một ngày nào đó ta muốn đến một vùng đất mà không ai hiểu ngôn ngữ của ta.""
  nomad_events.0120.a: ""Để ta hiểu về ngươi.""
  nomad_events.0120.b: "Cơ hội để hiểu rõ [companion.GetFirstNameNoTooltip] hơn..."
  nomad_events.0120.c: "Ta phải tập trung vào cưỡi ngựa."
  lover_evening_ride: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã có một buổi cưỡi ngựa lãng mạn buổi tối"
  lover_evening_ride_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] đã có một buổi cưỡi ngựa lãng mạn buổi tối"
  friend_evening_ride: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] gắn kết trong một buổi cưỡi ngựa buổi tối"
  friend_evening_ride_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] gắn kết trong một buổi cưỡi ngựa buổi tối"
 
  nomad_events.0130.t: "Một Thỏa Thuận Hài Lòng"
  nomad_events.0130.desc: "Một khuôn mặt lạ lẫm kéo cương một vài con ngựa, cố gắng trấn an chúng.\n\n\"Ngoan nào,\" [merchant.GetSheHe] dỗ dành chúng. \"À, một cuộc gặp gỡ thật vui vẻ!\" [merchant.GetSheHe] quay người về phía ta với một nụ cười rạng rỡ.\n\n\"Nếu ta có thể khiến ngài hứng thú với việc mua một số món hàng của ta,\" [merchant.GetSheHe] đề nghị, chỉ vào những con ngựa, \"ta còn có thêm vài con cừu ngay trên cánh đồng kia nữa.\""
  nomad_events.0130.a: ""Đi đi. Và để lại thú của ngươi.""
  nomad_events.0130.b: ""Ta cần một thương nhân đáng tin.""
  nomad_events.0130.c: ""Ta sẽ vui vẻ mua vài con.""
  nomad_events.0130.d: ""Ta không quan tâm.""
 
  nomad_events.0140.t: "Xa Nhà"
  nomad_events.0140.desc: ""...Ngươi có thấy [merchant.GetHerHim] không?", "Ngươi nghĩ [merchant.GetSheHe] từ đâu đến?", "Còn trang phục của [merchant.GetHerHis] thì sao?"\n\nTiếng lẩm bẩm gần như không thể tránh khi tôi đi qua trại. Lý do nhanh chóng rõ ràng: một [merchant.GetWomanMan] ăn mặc lạ đứng bên lửa trại của tôi.\n\n"Chào, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.GetCharacter.GetTitleAsNameNoTooltip]. Ta là một thương nhân [merchant.GetFaith.GetAdjectiveNoTooltip], lạc vào vùng đất lạ này. Ta mong được dành vài năm tại triều đình của ngươi.""
  nomad_events.0140.a: ""Hãy kể thêm về [merchant.GetFaith.GetNameNoTooltip] của ngươi...""
  nomad_events.0140.b: ""Trại của ta hoan nghênh ngươi.""
  nomad_events.0140.c: ""Rời đi. Ngay lập tức.""
  nomad_events.0140.a.tt: "Ngươi nhận được #P giảm 50%#! khi chuyển sang [merchant.GetFaith.GetName]"
 
  nomad_events.0150.t: "Uống Thêm Ly Nữa"
  nomad_events.0150.desc: "[Glossary( 'kumis', 'KUMIS_GLOSS')] được chuyền qua các bát đầy tràn. "Nào, nào!", [companion.GetTitledFirstName] ra hiệu, cố lấy thêm. "Ngươi [ROOT.Char.GetTitleAsNameNoTooltip] mà đòi!" [companion.GetSheHe] cười, mỉm nhìn tôi. "Chậm như ngựa con! Nhanh lên!"\n\n"Ah!" Cuối cùng, một bát được đưa vào tay [companion.GetHerHis], và [companion.GetSheHe] ngay lập tức đưa cho tôi.\n\n"Hãy cùng uống, người tốt [ROOT.Char.GetTitleAsNameNoTooltip], đêm còn dài và chẳng mấy chốc ta sẽ không còn!""
  nomad_events.0150.a: ""Ngươi biết ai mới thực sự hèn nhát không? Kẻ ngốc [rival.GetFirstNameNoTooltip] đó.""
  nomad_events.0150.a.tt: "Tùy chọn này khả dụng vì ngươi có một [rival|E]"
  nomad_events.0150.b: ""Cùng uống đi!""
  nomad_events.0150.c: "Một dịp ngon để khoe thể lực."
  KUMIS_GLOSS: "Một loại rượu lên men từ sữa ngựa cái, phổ biến khắp Thảo Nguyên Lớn. Trong tiếng Mông Cổ còn gọi là #EMP airag#!"
  friend_drank_together: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã chia sẻ một đêm uống rượu và vui đùa"
  friend_drank_together_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] đã chia sẻ một đêm uống rượu và vui đùa"
 
  nomad_events.0160.t: "Một Lời Khen"
  nomad_events.0160.desc.intro: ""Có điều gì đó vẫn còn vương trong tâm trí tôi," [spouse.GetFirstName] nói, nằm trên giường. "Gần đây tôi nhận ra điều gì đó về ngươi."\n\n"
  nomad_events.0160.desc.dread: ""Sự hiện diện của ngươi khiến [ROOT.Char.GetWomenMen] kinh hãi. Họ la hét, chạy trốn và van xin ngươi tha cho.""
  nomad_events.0160.desc.prowess: ""Sức mạnh của ngươi không ai sánh kịp. Các [ROOT.Char.GetWomenMen] khác nhìn ngươi bằng ánh mắt ganh tị, đầy ghen ghét." 
  nomad_events.0160.desc.lover: ""Tình yêu tôi dành cho ngươi ngày càng lớn. Như hoa dại, không bao giờ tàn."
  nomad_events.0160.desc.brave: ""Sự dũng cảm của ngươi truyền cảm hứng cho [ROOT.Char.GetWomenMen] và làm tràn đầy lòng họ mong muốn theo ngươi."
  nomad_events.0160.desc.generic: ""Tâm trí ngươi mạnh như cánh tay. [ROOT.Char.GetWomenMen|U] sẽ theo ngươi bất cứ nơi đâu."
  nomad_events.0160.desc.outro: "Ta đã chú ý. Và thật sự ấn tượng."\n\n[spouse.GetSheHe|U] ra hiệu để tôi tiến lại gần."
  nomad_events.0160.a: ""Cuối cùng, ngươi cũng sáng suốt."" 
  nomad_events.0160.b: ""Ta cũng yêu ngươi, người thân."" 
  nomad_events.0160.c: ""Hãy chắc rằng mọi người đều biết."" 
  lover_admirable_thing: "[TARGET_CHARACTER.GetShortUIName|U] đã thú nhận sự ngưỡng mộ sâu sắc của [TARGET_CHARACTER.GetHerHis] dành cho [CHARACTER.GetShortUIName]"
  lover_admirable_thing_corresponding: "[CHARACTER.GetShortUIName|U] đã thú nhận sự ngưỡng mộ sâu sắc của [CHARACTER.GetHerHis] dành cho [TARGET_CHARACTER.GetShortUIName]"
 
  nomad_events.0170.t: "Người Bị Khiếp Sợ"
  nomad_events.0170.desc: "[spouse.GetFirstName] đang ngồi bên bếp lửa khi ta bước vào lều. Giật mình, [spouse.GetSheHe] khẽ thở dài khi nhìn thấy ta, hạ thấp ánh mắt [spouse.GetHerHis].\n\n[spouse.GetSheHe|U] không nói gì trong khi ta cởi đồ và vốc nước lên mặt. Sau một lúc, sự im lặng trở nên quá nặng nề:\n\n\"Ta cần nói chuyện với ngài, [ROOT.Char.GetTitleAsNameNoTooltip] thân yêu của ta,\" giọng [spouse.GetHerHis] nhỏ nhẹ, \"Ai cũng sợ ngài. Và ta cũng chẳng khác gì họ,\" [spouse.GetSheHe] thú nhận."
  nomad_events.0170.a: ""Ngươi nghĩ ta #EMP yếu#!?""
  nomad_events.0170.b: ""Ta đã nghe cơn giận của mình quá lâu.""
  nomad_events.0170.c: ""Đây là cách duy nhất.""
  dread_spouse_modifier: "Tốt Hơn Khi Bị Khiếp Sợ"
  dread_spouse_modifier_desc: "Hơn là được yêu thương."
 
  nomad_events.0180.t: "Mắt Xích Yếu Nhất"
  nomad_events.0180.desc: "Ta nghe thấy tiếng cười của [rival.GetTitledFirstNamePossessive] trước khi nhìn thấy [rival.GetHerHim]. Lưng [rival.GetHerHis|U] gần như quay về phía ta, hơi thở [rival.GetHerHis] nồng nặc mùi [Glossary( 'kumis', 'KUMIS_GLOSS')].\n\n\"#EMP Ai#! sẽ cai trị chúng ta khi [ROOT.Char.GetTitledFirstNameNoTooltip] rời bỏ chúng ta để về với tổ tiên? Có phải là [child.GetFirstName]? Cánh tay [child.GetHerHis|U] yếu đến mức [child.GetSheHe] khó mà giữ cho các ngón tay của chính mình không rụng xuống.\"\n\n\"Không. Chắc chắn đó sẽ không phải là [child.GetFirstNameNoTooltip] ngọt ngào và dễ bảo đâu.\""
  nomad_events.0180.a: ""Ngươi sẽ #EMP không bao giờ#! nói về gia đình ta như vậy nữa.""
  nomad_events.0180.b: "Đã đến lúc [child.GetFirstNameNoTooltip] học hỏi."
  nomad_events.0180.c: "Để lời [rival.GetFirstNamePossessiveNoTooltip] trôi theo gió."
 
  nomad_events.0190.t: "Ngày Xưa"
  nomad_events.0190.desc: "\"Ngài [Glossary( 'đội chiếc mũ thật vừa vặn', 'TAKE_HAT_GLOSS')], thưa [ROOT.Char.GetTitleAsNameNoTooltip] tốt bụng của ta,\" [friend.GetTitledFirstName] kéo dây cương ngựa của [friend.GetHerHis] và vỗ nhẹ vào đầu nó cho đến khi nó bình tĩnh lại, cười lớn. \"Này! Bình tĩnh nào!\"\n\n[friend.GetSheHe|U] quay ánh mắt [friend.GetHerHis] về phía ta, \"Ta không thể tin rằng ngài vẫn là chính ngài của nhiều năm về trước. Ngài có bao giờ nghĩ chúng ta sẽ kết thúc như thế này không?\"\n\nKhi [friend.GetSheHe] nói, ta không thể không mỉm cười, nhớ lại khi [memory.GetDescription]."
  nomad_events.0190.a: ""Ngươi gần gũi với ta như máu thịt.""
  nomad_events.0190.b: ""Ở bên ngươi, ta thấy an yên.""
  nomad_events.0190.c: ""Ha! Và đó chỉ mới là khởi đầu!""
  nomad_events.0190.d: ""Hãy để mọi cây đều nghe câu chuyện của chúng ta!""
  mpo_good_memory_modifier: "Tấm Lòng Ấm Áp"
  mpo_good_memory_modifier_desc: "Những ký ức tốt đẹp làm nhân vật này tràn đầy vui sướng."
  TAKE_HAT_GLOSS: "Câu nói Mông Cổ ám chỉ quyền lực, sự uy vương."
  friend_cute_memory: "[CHARACTER.GetShortUIName] và [TARGET_CHARACTER.GetShortUIName] cùng nhau hồi tưởng một kỷ niệm đẹp nhiều năm sau."
  friend_cute_memory_corresponding: "[TARGET_CHARACTER.GetShortUIName] và [CHARACTER.GetShortUIName] cùng nhau hồi tưởng một kỷ niệm đẹp nhiều năm sau."
 
  nomad_events.0200.t: "Trong Giấc Mơ"
  nomad_events.0200.desc.intro: "[courtier.GetTitledFirstName] ngồi xuống cạnh ta trong khi ta uống cạn ly [Glossary( 'boal', 'BOL_GLOSS')]. Với ánh mắt [courtier.GetHerHis] tập trung vào ngọn lửa, [courtier.GetSheHe] bắt đầu trò chuyện:\n\n\"Đêm qua thần có một giấc mơ. Một con chim ưng trắng hạ xuống\""
  nomad_events.0200.desc.good: "từ mặt trăng và đậu trên tay ngươi. Nó bùng cháy và bay đi.""
  nomad_events.0200.desc.bad: "từ mặt trời và bị chó hoang ăn thịt. Thân thể nó nằm trong vũng máu.""
  nomad_events.0200.desc.outro: "\n\nSức nóng từ lửa dường như tăng lên. Trán tôi toát mồ hôi."
  nomad_events.0200.a: ""Ta sẽ khắc số phận mình trên xương gục.""
  nomad_events.0200.b: ""Xin hãy hiểu điều này.""
  nomad_events.0200.c: ""Điềm xấu chỉ tôi luyện những [ROOT.Char.GetWomenMen] tốt hơn.""
  nomad_events.0200.d: ""Nó sẽ là điều [ROOT.Char.GetFaith.HighGodName] đòi hỏi.""
  mpo_no_omens_modifier: "Số Phận Tự Chủ"
  mpo_no_omens_modifier_desc: "Nhân vật này không để giấc mơ quyết định vận mệnh."
 
  nomad_events.0210.t: "Chỉ Còn Rễ"
  nomad_events.0210.desc.intro: "Những con chó lang thang quanh trại, số lượng giảm dần, xương lộ ra qua da mỏng. Một con cừu chết đêm qua. Sáng hôm sau không còn gì.\n\n"
  nomad_events.0210.desc.spouse: ""Người thân của ta..." [family.GetFirstName] tiến đến, [family.GetSheHe] nắm chặt một nắm rễ. "Ta đã đi tìm cả buổi sáng, nhưng đây là tất cả những gì tìm được.""
  nomad_events.0210.desc.child: "\"[ROOT.Char.GetMotherFather|U]...\" [family.GetFirstName] tiến lại gần ta, mắt [family.GetHerHis] đỏ hoe và tay [family.GetHerHis] nắm chặt một nắm rễ cây. \"Con đã thu lượm những thứ này cho ngài... Con xin lỗi vì đã không tìm được nhiều hơn.\""
  nomad_events.0210.aa: "[courtier.GetShortUINameNoTooltip] dạo này trông khá tốt..."
  nomad_events.0210.a: ""Ta không cần lòng thương hại của ngươi.""
  nomad_events.0210.b.child: ""Cảm ơn con, đứa trẻ.""
  nomad_events.0210.b.spouse: ""Người yêu dấu..."" 
  nomad_events.0210.c: ""Ta sẽ không để ngươi thế này.""
  nomad_events_0210_c_tt: "Sử dụng $mpo_ask_for_herd_interaction$ [character_interaction|E] sẽ giúp tăng [herd|E] trong #value 5#! năm tiếp theo"
  friend_offered_roots: "[TARGET_CHARACTER.GetShortUIName] đã tặng một ít rễ cây thu lượm được để giúp [CHARACTER.GetShortUIName] trong lúc [CHARACTER.GetHerHis] hoạn nạn."
  friend_offered_roots_corresponding: "[CHARACTER.GetShortUIName] đã tặng một ít rễ cây thu lượm được để giúp [TARGET_CHARACTER.GetShortUIName] trong lúc [TARGET_CHARACTER.GetHerHis] hoạn nạn."
 
  nomad_events.0220.t: "Cánh Tay Yếu"
  nomad_events.0220.desc: "[spouse.GetFirstName] dùng một mảnh gỗ nhỏ xỉa răng, nằm nghiêng trên một bên [spouse.GetHerHis]. [spouse.GetSheHe|U] đảo mắt khi cuối cùng [spouse.GetSheHe] nhận ra ta đã bước vào lều.\n\n\"Hôm nay ngài đã làm gì?\" [spouse.GetSheHe] hỏi, \"Có phải ngài đã vuốt ve một chú cừu non bị lạc hay ngài đã hôn vào ngón chân kẻ thù của mình rồi?\"\n\n\"Ta không kết hôn để lấy một cành cây yếu ớt. Ngài phải đứng vững như cây [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] hùng vĩ kia.\""
  nomad_events.0220.a: ""Ngươi nói đúng. Chuyện này phải chấm dứt.""
  nomad_events.0220.b: ""Ta sẽ rèn luyện hết sức có thể.""
  nomad_events.0220.c: ""Chống lại tự nhiên vô ích. Ta là ta.""
 
  nomad_events.0230.t: "Nhớ Nhà"
  nomad_events.0230.desc: "Mắt tôi nặng trĩu khi mở ra. Không còn dấu hiệu ánh sáng ban mai. Tiếng thút thít nhẹ của [spouse.GetFirstNamePossessive] hiện rõ khi tôi quen với việc thức giấc.\n\n"Ta… ta xin lỗi. Không có ý làm ngươi mất ngủ. Chỉ là… ta nhớ nhà quá. Ở đây không như nhà ta. Vùng đất [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] không bao giờ giống [spouse.GetCulture.GetNameNoTooltip].""
  nomad_events.0230.a: ""Ta hiểu cảm giác đó.""
  nomad_events.0230.b: ""Ta sẽ biến nơi này thành nhà của ngươi.""
  nomad_events.0230.c: ""Ngươi phải để quá khứ lại phía sau.""
  lover_homesick_comfort: "[CHARACTER.GetShortUIName] an ủi [TARGET_CHARACTER.GetShortUIName] khi [TARGET_CHARACTER.GetSheHe] nhớ nhà."
  lover_homesick_comfort_corresponding: "[TARGET_CHARACTER.GetShortUIName] an ủi [CHARACTER.GetShortUIName] khi [CHARACTER.GetSheHe] nhớ nhà."
  mpo_hardened_modifier: "Chấp Nhận"
  mpo_hardened_modifier_desc: "Nhân vật này học được rằng nỗi hoài niệm là điều nguy hiểm."
 
  nomad_events.0240.t: "Khách Không Mời"
  nomad_events.0240.desc: "Tiếng kêu be be vang lên không ngớt quanh trại. \"Làm cho chúng im đi!\" Ta nghe [courtier.GetTitledFirstName] than thở, xoa trán [courtier.GetHerHis] trong một cái nhăn mặt đau đớn.\n\n\"À, thưa [ROOT.Char.GetTitleAsNameNoTooltip]! Cuối cùng ngài cũng ở đây!\" [courtier.GetSheHe] mỉm cười, chỉ vào đàn cừu đang đứng cạnh [courtier.GetHerHim].\n\n\"Người dân của chúng ta đã tìm thấy đàn gia súc bị lạc này ở biên giới với lãnh thổ của [ruler.GetTitledFirstNamePossessive]. Chúng ta có lý do để tin rằng chúng thuộc về [ruler.GetHerHim].\""
  nomad_events.0240.a: ""Giữ tất cả trừ một. Gửi đầu của nó cho [ruler.GetFirstNameNoTooltip].""
  nomad_events.0240.b: ""Gửi trả chúng về cho [ruler.GetShortUINameNoTooltip].""
  nomad_events.0240.c: ""Thật là một ngày may mắn.""
  mpo_honorable_ruler: "Người Chăn Cừu Danh Dự"
  mpo_honorable_ruler_desc: "Nhân vật này đã trả lại một đàn cừu lạc cho chủ nhân thực sự của chúng."
  house_feud_stolen_herd: "đàn cừu bị đánh cắp"
  house_feud_stolen_herd_flavor: "[ROOT.Var('house_feud_attacker').Char.GetFirstName] đã nâng tầm sự thù địch vốn có của [ROOT.Var('house_feud_attacker').Char.GetHerHis] với [ROOT.Var('house_feud_victim').Char.GetFirstName] khi [ROOT.Var('house_feud_attacker').Char.GetSheHe] đánh cắp đàn gia súc của [ROOT.Var('house_feud_victim').Char.GetHerHis]."
  friend_returned_herd: "[CHARACTER.GetShortUIName] chứng minh danh dự bằng cách trả lại đàn cừu cho [TARGET_CHARACTER.GetShortUINamePossessive]."
  friend_returned_herd_corresponding: "[TARGET_CHARACTER.GetShortUIName] chứng minh danh dự bằng cách trả lại đàn cừu cho [CHARACTER.GetShortUINamePossessive]."
 
  nomad_events.0250.t: "[priest.GetWomanMan|U] của [priest.GetFaith.HighGodName]"
  nomad_events.0250.desc: ""[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.GetTitleAsNameNoTooltip]," một giọng nói lạ vang lên. "Nhiều tháng trăng, [priest.GetFaith.HighGodName] đã bắt ta tìm ngươi."\n\n"Trong giấc mơ, ta thấy ngươi nằm dưới chân sói, mở miệng đầy máu và từ đó rơi ra biểu tượng của [priest.GetFaith.ReligiousSymbol].""
  nomad_events.0250.a: ""Ta nhận ra lời tiên tri khi nghe thấy nó.""
  nomad_events.0250.b: ""Thú vị… hãy ở lại cùng ta.""
  nomad_events.0250.c: ""Vớ vẩn! Ta trục xuất ngươi!""
  chosen_by_the_heavens_modifier: "Được Chọn Bởi Trời"
  chosen_by_the_heavens_modifier_desc: "Nhân vật này tin rằng mình được trời chọn, và dân chúng cũng đồng tình."
 
  nomad_events.0260.t: "Chuyện Tôn Giáo"
  nomad_events.0260.desc: ""Chào, [ROOT.Char.GetName]. Ta là [priest.GetFullName]," [priest.GetWomanMan] lạ cúi chào tôi. "Ta đến từ [distant_realm.GetBaseName] xa xôi theo lệnh của [other_ruler.GetLadyLord], [other_ruler.GetTitledFirstName]."\n\n"Theo yêu cầu của [other_ruler.GetHerHis], ta đến để chỉ cho ngươi con đường đức tin đúng, [priest.GetFaith.GetName].""
  nomad_events.0260.a: ""Ngươi dám bất kính với đức tin của ta!?""
  nomad_events.0260.b: ""Ta muốn tìm hiểu thêm về [priest.GetFaith.GetNameNoTooltip].""
  nomad_events.0260.c: ""Thần bé nhỏ của ngươi không bằng [ROOT.Char.GetFaith.HighGodName].""
  nomad_events.0260.c.tt.crit_success: "Mọi người đều ấn tượng"
  nomad_events.0260.c.tt.success: "[priest.GetShortUINameNoTooltip] ấn tượng"
  nomad_events.0260.c.tt.failure: "Ngươi trông thật ngớ ngẩn"
  nomad_events.0260.d: ""Biến khỏi tầm mắt ta.""

  mpo_nomad_events.1080.t: "Người Đeo Còng"
  mpo_nomad_events.1080.desc_high_intro: "[neighbor_ruler.GetTitledFirstName], người có lều gần [neighbor_county.GetBaseNameNoTier], cưỡi qua đồng cỏ của ta mà không xin phép. Và như bầy sói săn mồi, kỵ sĩ của ta vây quanh đoàn vũ trang của [neighbor_ruler.GetHerHis].\n\n"Lớn lao [ROOT.Char.GetTitleAsNameNoTooltip]!""
  mpo_nomad_events.1080.desc_low_intro: "[neighbor_ruler.GetTitledFirstName], cai trị tại [neighbor_county.GetNameNoTier] gần đó, cưỡi qua đồng cỏ của ta. Với tiếng hô hoảng loạn vang lên, ta tập hợp [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] và gặp đoàn vũ trang của [neighbor_ruler.GetHerHis].\n\n"Ngươi — [ROOT.Char.GetTitleAsNameNoTooltip]!""
  mpo_nomad_events.1080.desc_1: "chào [neighbor_ruler.GetFirstNameNoTooltip], "Chúng ta săn một"
  mpo_nomad_events.1080.criminal: "tội phạm"
  mpo_nomad_events.1080.desc_2: "chạy trốn vào [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] của ngươi. Dù mang [Glossary( 'cangue', 'CANGUE_GLOSS' )], [escaped_warrior.GetFirstName] leo trèo như dê; dù thiếu ngủ, [escaped_warrior.GetSheHe] vẫn lừa được thợ săn của ta."\n\n"Con mồi ở trong lãnh thổ ngươi, [ROOT.Char.GetTitleAsNameNoTooltip] — ngươi có săn không?""
  CANGUE_GLOSS: "Một công cụ hình phạt dùng ở thảo nguyên và Đông Á. #G cangue#! là cái yên gỗ nặng đeo trên vai. Mang trong nhiều ngày hay tuần, nó làm kiệt sức, nhục nhã, cản trở di chuyển, và có thể khiến đói bằng cách ngăn người mang tự nuôi mình."

  mpo_nomad_events.1080.a: "Kẻ chạy trốn này có vẻ khéo léo và mạnh mẽ..."
  mpo_nomad_events.1080.a.flavor: "Sức mạnh [escaped_warrior.GetFirstNamePossessiveNoTooltip] sẽ không mai một dưới #EMP cangue#!. Ngược lại, nó sẽ tăng sức mạnh cho bầy ta!"
  mpo_nomad_events.1080.b: "Đuổi [neighbor_ruler.GetFirstNameNoTooltip] đi bằng mưa tên."
  mpo_nomad_events.1080.b.flavor: "Dù là kẻ trốn hay không, [neighbor_ruler.GetTitleAsNameNoTooltip] đã xâm nhập đây — và phải bị đuổi đi trong đau đớn!"
  mpo_nomad_events.1080.c: "Ta sẽ truy bắt con dê lạc."
  BOUND_TO_FAMILY_WIDOW: "Ngươi đã thề chăm sóc góa phụ của người thân trong gia đình"


  ranged_and_searched_modifier: "Đi Trinh Sát Và Lục Soát"
  ranged_and_searched_modifier_desc: "Các đội cưỡi đã đi khắp thung lũng, khe núi và đỉnh đồi… và qua đó đã phát hiện những bãi cỏ che chắn và nơi ẩn náu."
  family_widow_cant_divorce_tt: "@alert_icon! #alert_trial Ngài không thể [divorce|E] [widow.GetFirstName] trong #high 10 năm#!#!"
  family_widow_cant_dismiss_tt: "@alert_icon! #alert_trial Ngươi không thể sa thải [widow.GetFirstName] trong #high 10 năm#!#!"
  family_widow_seduce_romance_bonus_tt: "Khi nhắm vào [widow.GetFirstName] bằng [GetScheme('seduce').GetTypeName] hoặc [GetScheme('courting').GetTypeName] [schemes|E]: #P +20#! [success_chance|E]"
  scheme_family_widow_seduce_romance: "Được cứu khỏi cảnh góa phụ: $VALUE|0=-+$"
  inspired_in_wifely_duties_modifier: "Được Yêu Thương Và Truyền Cảm Hứng"
  inspired_in_wifely_duties_modifier_desc: "Người phụ nữ này quản lý gia đình với lòng tận tụy mạnh mẽ, bởi nàng hiểu rõ tình yêu và lòng trung thành của gia đình chồng."
  concubine_lavished_attention_modifier: "Được Chăm Sóc Tận Tình"
  concubine_lavished_attention_modifier_desc: "Người phụ nữ này đã trải qua sự tận tâm của một vị quân chủ cùng mọi xa xỉ kèm theo."
  truce_family_widow: "\nHòa ước được thiết lập khi [ROOT.Char.GetShortUIName] cưới góa phụ [widow.GetShortUIName]"

  mpo_nomad_events.1091.t: "Số Phận Của Góa Phụ"
  mpo_nomad_events.1091.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] của ta đã chết. [dead_husband.GetFirstName] thuộc về gió. [dead_husband.GetHerHis|U] góa phụ, [widow.GetName], đã là một phần gia đình từ khi [widow.GetSheHe] bước vào lều của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] ta, than khóc và thương tiếc.\n\nTrái tim [widow.GetFirstNamePossessiveNoTooltip|U] có thể thuộc về [ROOT.Char.GetHouse.GetName], nhưng vị trí của [widow.GetHerHis] với chúng ta, sự bảo vệ của [widow.GetHerHis], giờ phụ thuộc vào ta… vào nghĩa vụ của ta trong việc nhận lấy những gì [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] đã bỏ lại.\n\n"
  mpo_nomad_events.1091.desc.marry: "Theo tập tục, ta phải cưới [dead_husband.GetHerHis] [widow.GetTitledFirstNameNoTooltip]."
  mpo_nomad_events.1091.desc.concubine: "Theo tập tục, ta phải lấy [dead_husband.GetHerHis] [widow.GetTitledFirstNameNoTooltip] làm người phụ nữ của mình."
  mpo_nomad_events.1091.a: "#EMP Cuối cùng ― [widow.GetSheHe] là của ta!#!"
  mpo_nomad_events.1091.a.flavor: "Vợ của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l], #EMP một nữ thần#!, xứng đáng với từng mảnh nhỏ và giọt cuối cùng của sự tận tâm của ta."
  mpo_nomad_events.1091.b: "Cuộc hôn nhân của chúng ta sẽ làm hài lòng [widow_relative.GetTitledFirstNameNoTooltip]…"
  mpo_nomad_events.1091.b.flavor: "...và cả ta nữa. Cuộc hôn nhân này sẽ phục vụ tốt cho ta."
  mpo_nomad_events.1091.c: "Ta sẽ sở hữu #EMP tất cả#! những thứ quý giá của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l], đúng vậy."
  mpo_nomad_events.1091.d: "Gia đình ta bảo vệ người nhà. Luôn luôn."
  mpo_nomad_events.1091.e: "Ngươi giờ phải quỳ trước chó, [widow.GetWomanMan]."

  mpo_nomad_events.1100.t: "Những đồng cỏ của [capital_province.GetTitle.GetNameNoTierNoTooltip]"
  mpo_nomad_events.1100.desc: "Đàn gia súc, người chăn và kỵ sĩ chăm chỉ đi lại trên [capital_province.GetTerrain.GetNameNoTooltip|l] quanh lều lớn của ta. Chúng ta tận dụng vùng đất này, [capital_province.GetTitle.GetNameNoTier], cho từng bụi cây và thớ cỏ nó có.\n\n"
  mpo_nomad_events.1100.desc.camel: "Nhưng trong cái khô cằn và nóng bức, ít thứ mọc lên. Trong bốn con vật của đàn, chỉ một chịu nổi sự trống rỗng và kêu gọi muốn đi lang thang trên [capital_province.GetTerrain.GetNameNoTooltip|l] — lạc đà.\n\nTrong khi các loài khác ăn ở những nơi tốt nhất, lạc đà đi khắp [capital_province.GetTitle.GetNameNoTierNoTooltip]."
  mpo_nomad_events.1100.desc.sheep: "Đất ở đây khô cằn và nhiều đá. Thức ăn thô không hợp với ngựa và bò, nhưng với cừu và dê — đây là thiên đường.\n\nSữa và len đến tay [ROOT.Char.GetCulture.GetCollectiveNoun] của ta dồi dào."
  mpo_nomad_events.1100.desc.hunting: "Nhưng ở đây cây cỏ mọc quá cao: ít đồng cỏ trống. Gia súc trở nên gầy, trong khi [ROOT.Char.GetCulture.GetCollectiveNoun] của ta sử dụng cung và chim săn mồi để kiếm ăn.\n\nChúng ta trao đổi da hươu thay vì len cừu."
  mpo_nomad_events.1100.desc.horses: "Theo ý chí của [ROOT.Char.GetFaith.HighGodNamePossessive], nơi này được dành cho ngựa: một biển cỏ thanh bình, nơi chân nhanh và tâm hồn cao quý phục vụ ngựa đến no nê.\n\nỞ đây, [ROOT.Char.GetCulture.GetCollectiveNoun] của ta chăn ngựa cho đến khi tất cả đều mập mạp và hạnh phúc."
  mpo_nomad_events.1100.a: "Nơi có [capital_province.GetTerrain.GetNameNoTooltip|l], chúng ta là chủ."
  mpo_nomad_events.1100.a.flavor: "Biết một nơi là biết tất cả những gì nó mang lại, sẵn sàng và bí mật."
  mpo_nomad_events.1100.b: "Dân chúng ta không yêu nơi này."
  mpo_nomad_events.1100.c.camel: "Đổi vật khác lấy lạc đà!"
  mpo_nomad_events.1100.c.sheep: "Mùa sinh cừu tốt đẹp."
  mpo_nomad_events.1100.c.hunting: "Ở đây, ta săn hoặc chết đói."
  mpo_nomad_events.1100.c.horse: "Một vùng đất cho ngựa."

  custom.every_camel_terrain_county_tt: "Mỗi [realm|E] [county|E] có [GetTerrain( 'desert' ).GetName], [GetTerrain( 'desert_mountains' ).GetName] hoặc [GetTerrain( 'oasis' ).GetName] [terrain|E]"
  custom.every_sheep_terrain_county_tt: "Mỗi [realm|E] [county|E] có [GetTerrain( 'mountains' ).GetName], [GetTerrain( 'hills' ).GetName] hoặc [GetTerrain( 'drylands' ).GetName] [terrain|E]"
  custom.every_hunting_terrain_county_tt: "Mỗi [realm|E] [county|E] có [GetTerrain( 'forest' ).GetName], [GetTerrain( 'taiga' ).GetName], [GetTerrain( 'jungle' ).GetName] hoặc [GetTerrain( 'wetlands' ).GetName] [terrain|E]"
  custom.every_horse_terrain_county_tt: "Mỗi [realm|E] [county|E] có [GetTerrain( 'steppe' ).GetName], [GetTerrain( 'plains' ).GetName] hoặc [GetTerrain( 'floodplains' ).GetName] [terrain|E]"
  major_county_fertility_gain_tt: "[county_fertility|E] tăng [EmptyScope.ScriptValue('major_county_fertility_gain')|P0]"
  medium_county_fertility_gain_tt: "[county_fertility|E] tăng [EmptyScope.ScriptValue('medium_county_fertility_gain')|P0]"
  minor_county_fertility_gain_tt: "[county_fertility|E] tăng [EmptyScope.ScriptValue('minor_county_fertility_gain')|P0]"
  minor_county_fertility_loss_tt: "[county_fertility|E] giảm [EmptyScope.ScriptValue('minor_county_fertility_loss')|P=N0]"
  mpo_bountiful_sheep_cheaper_feasts.desc: "$feast_type_tsagaan_sar$ [GetActivityType( 'activity_feast' ).GetName] Chi phí: @gold_icon!#P -20%#!"
  mpo_bountiful_hunting_cheaper_hunts_desc: "[GetActivityType( 'activity_hunt' ).GetName] Chi phí: @gold_icon!#P -20%#!"
  mpo_restless_for_migration_modifier: "Băng Đảng Khát Di Cư"
  mpo_restless_for_migration_modifier_desc: "Từng cưỡi cuối cùng của bộ lạc này sẵn sàng xông vào vùng đất mới."

  mpo_bountiful_camels_modifier: "Đàn Lạc Đà Phong Phú"
  mpo_bountiful_camels_modifier_desc: "Dân chúng của vị quân chủ này thích nghi tốt với sa mạc, có nhiều đàn lạc đà."
  mpo_bountiful_sheep_modifier: "Đàn Cừu Phong Phú"
  mpo_bountiful_sheep_modifier_desc: "Len, sữa cừu và thịt cừu là những nguồn sống quan trọng của vị quân chủ này và dân chúng."
  mpo_bountiful_hunting_modifier: "Trại Săn Bắn"
  mpo_bountiful_hunting_modifier_desc: "Người du mục của vị quân chủ này chủ yếu sống nhờ săn bắn."
  mpo_bountiful_horses_modifier: "Ngựa No Nê"
  mpo_bountiful_horses_modifier_desc: "Các đoàn du mục cưỡi ngựa khỏe mạnh và nhanh nhẹn, dẫn theo nhiều ngựa dự phòng."
  mpo_bountiful_hunting_cheaper_hunts_tt: "[GetActivityType( 'activity_hunt' ).GetName] Chi phí: @gold_icon!#P -20%#! trong #high 10 năm#!"

  mpo_bountiful_sheep_cheaper_feasts_tt: "$feast_type_tsagaan_sar$ [GetActivityType( 'activity_feast' ).GetName] Chi phí: @gold_icon!#P -20%#! trong #high 10 năm#!"
 
  mpo_nomad_events.1110.t: "Đồng Cỏ Ẩm Ướt"
  mpo_nomad_events.1110.desc_river: "Dòng nước xanh của con sông ngân nga"
  mpo_nomad_events.1110.desc_sea: "Dòng nước mênh mông của biển vỗ bờ"
  mpo_nomad_events.1110.desc_lake: "Mặt hồ yên bình màu xanh"
  mpo_nomad_events.1110.desc: "ngay bên ngoài trại tại [capital_province.GetTitle.GetNameNoTier].\n\n[ROOT.Char.GetCulture.GetCollectiveNoun] đứng ở vùng nông, reo hò trước con cá dài như kiếm, vảy nâu sáng dưới ánh mặt trời. Một [dummy_gender.GetWomanMan] địa phương giơ cao con cá, khoe chiến lợi phẩm.\n\nCon cá khổng lồ là minh chứng cho thịt ngon có thể kiếm được — nếu [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] dành thời gian săn những sinh vật sống trên nước."
  mpo_nomad_events.1110.a: "Xây thuyền để đi lại trên vùng nước phong phú này."
  mpo_nomad_events.1110.a_repeat: "Thuyền của chúng ta sẽ phục vụ tốt."
  mpo_nomad_events.1110.b: "Ta sẽ #EMP dìm chết#! bất kỳ [dummy_gender.GetWomanMan] nào dám rời khỏi ngựa của [dummy_gender.GetHerHis]!"
  mpo_nomad_events.1110.c: "Lưới, dệt thật nhiều lưới."

  custom.every_fishing_county_tt: "Mỗi [domain|E] [county|E] ven biển, ven sông hoặc ven hồ"
  fishing_counties_gold_scaling: "#weak Vàng kiếm được dựa trên các Hạt miền Ven biển, Ven sông và Ven hồ#!"
  maritime_tradition_unlock_tt: "#weak Mở do [cultural|E] [tradition|E] hàng hải#!"
