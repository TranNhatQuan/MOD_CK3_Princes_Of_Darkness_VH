l_english:
  mpo_temujin_flavor.0001.t: "Bị Bỏ Rơi, Không Còn"
  mpo_temujin_flavor.0001.desc: "Đêm tối hơn. Chỉ còn lại [jamukha.GetTitledFirstName] và Ta trong trại.\n\n"[ROOT.Char.GetFirstNameNoTooltip]," [jamukha.GetFirstNameNoTooltip] chỉ vào Ta bằng dao găm [jamukha.GetHerHis]. "Trong những ngày chiến tranh, ta chiến đấu bên cạnh ngươi để lấy lại vợ của ngươi. Trong thời bình, ta sẽ nghe lời khuyên của ngươi, trao đổi quà cáp với ngươi, và theo ngươi cho đến khi chân ta không còn sức." \n\nDao găm chạm vào lòng bàn tay và cắt một vết thương sâu: "Hãy để máu thề những gì lời nói không thể.""
  mpo_temujin_flavor.0001.a: ""Ta sẽ ở bên ngươi cho đến khi mắt ta trắng dã.""
  mpo_temujin_flavor.0001.b: ""Sói không cần cừu.""
 
  mpo_temujin_flavor.0010.t: "Chia Tay"
  mpo_temujin_flavor.0010.desc.intro: ""Thời khắc đã đến, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetFirstNameNoTooltip]," [jamukha.GetFirstName] ngồi trước đống lửa trại. "Dưới sự cai trị chính đáng của ngươi, ta đã thịnh vượng, nhưng hạt giống không thể mọc dưới bóng cây."\n\nNgười đứng lên."
  mpo_temujin_flavor.0010.desc.rejected: ""Ngươi đã từ chối ta một lần. Ta hy vọng ngươi sẽ hiểu.""
  mpo_temujin_flavor.0010.desc.blood_brothers: ""Chính trước ngọn lửa này, chúng ta đã thề, và ta định giữ lời. Nhưng dân ta đòi tự do.""
  mpo_temujin_flavor.0010.desc.fallback: ""Dân ta chỉ muốn tự do như dân ngươi.""
  mpo_temujin_flavor.0010.aa: ""Đi đi! Trốn như sâu đất ngươi là.""
  mpo_temujin_flavor.0010.aa_remove_blood_brother: "Ngươi không còn là [blood_brothers|E] với [jamukha.GetShortUIName]"
  mpo_temujin_flavor.0010.a: ""Ngươi ép dân ngươi ăn đất.""
  mpo_temujin_flavor.0010.a.tt.success: "[jamukha.GetShortUIName] bị chế giễu"
  mpo_temujin_flavor.0010.a.tt.failure: "Không ai quan tâm dường như"
  mpo_temujin_flavor.0010.b: ""#EMP Ở lại.#!"" 
  mpo_temujin_flavor.0010.c: ""Ngươi đã chọn con đường của mình.""
  every_non_brave_compassionate_courtier: "Mỗi [courtier|E] không [GetTrait('brave').GetName( GetNullCharacter )] hoặc [GetTrait('compassionate').GetName( GetNullCharacter )]"
 
  mpo_temujin_flavor.0020.t: "Phản Bội của [jamukha.GetFirstNamePossessiveNoTooltip]"
  mpo_temujin_flavor.0020.desc.intro: "\"[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip]!\" Một giọng nói quen thuộc đánh thức ta vào giữa đêm khuya. \"Ta xin lỗi, nhưng chuyện đã đến mức này rồi,\" [jamukha.GetFirstName] đang cưỡi trên con ngựa của [jamukha.GetHerHis], ngay tại cửa lều của ta.\n\n\"Ta đến đây để cảnh báo ngài.\""
  mpo_temujin_flavor.0020.desc.blood_brothers: "Vì máu chúng ta từng đổ cùng nhau.""
  mpo_temujin_flavor.0020.desc.friend: "Vì Tình bạn mà chúng ta từng chia sẻ.""
  mpo_temujin_flavor.0020.desc.rival: "Một sự tôn trọng mà ta dành cho đối thủ xứng đáng.""
  mpo_temujin_flavor.0020.desc.fallback: "Một sự tôn trọng dành cho [ROOT.Char.GetLadyLord] trước đây của ta.""
  mpo_temujin_flavor.0020.desc.outro: "\n\n"Từ khoảnh khắc này, ta sẽ truy đuổi ngươi và săn ngươi. Ta sẽ chém qua nước sâu và bào mòn đá sáng. Không gì là ta không làm để kết thúc ngươi — bởi chính ta sinh ra để lãnh đạo tất cả người Mông Cổ — #EMP không phải ngươi!#!"" 
  mpo_temujin_flavor.0020.a: ""Ngươi, người mà ta từng gọi là anh em...""
  mpo_temujin_flavor.0020.b: ""Dao găm của ta sẽ tìm đến cổ ngươi.""
  mpo_temujin_flavor.0020.c: ""Ngươi sẽ hối hận!""
  temujin_jamukha_truce: "Chúa Tể trước đây"
  mpo_temujin_flavor.0020.cb.tt: "[temujin.GetShortUIName] và [jamukha.GetShortUIName] nhận #high $retaliation_cb$#! [casus_bellis|E] lẫn nhau"
  mpo_temujin_flavor.0020.jamukha_gok_requirement: "[jamukha.GetShortUIName] phải bị đánh bại để thực hiện #high $mpo_become_greatest_of_khans_decision$#! [decision|E]"
  mpo_temujin_flavor.0020.a_war_win: "Chiến thắng #high offensive#! [war|E] chống lại [jamukha.GetShortUIName] sẽ nhận thêm @legitimacy_icon![legitimacy|E] và @prestige_icon![prestige|E]"
  mpo_temujin_flavor.0020.b_murder: "Ngươi nhận #P #EMP cực lớn#! bonus cho [GetScheme('murder').GetTypeName] [schemes|E] nhắm vào [jamukha.GetShortUIName]"
  TEMUJIN_JAMUKHA_MURDER_BONUS: "Ngươi thề giết [target.GetShortUIName]: $VALUE|+0=$"
  temujin_jamukha_war_modifier: "Báo thù anh em"
  temujin_jamukha_war_modifier_desc: "Nhân vật này bị phản bội bởi người gần gũi trong lòng."
  temujin_jamukha_war_smaller_modifier: "Báo thù đẫm máu"
  temujin_jamukha_war_smaller_modifier_desc: "Nhân vật này bị phản bội bởi người mà họ tin tưởng."
  mpo_temujin_flavor.0020.remove_friend: "Ngươi không còn là [friends|E] với [jamukha.GetShortUIName]"
 
  mpo_temujin_flavor.0030.t: "Cuộc Công Kích của [mergid.GetDynastyNameNoTooltip]"
  mpo_temujin_flavor.0030.desc: "\"[ROOT.Char.GetFirstNameNoTooltip],\" [borte.GetFirstNameNoTooltip] khẽ gọi khi bước vào lều của ta. Má [borte.GetHerHis|U] đỏ ửng và tóc [borte.GetHerHis] rối bời. \"Kể từ khi ta bị [mergid.GetDynastyName] bắt làm con tin, ta cảm thấy không khỏe.\"\n\n[borte.GetSheHe|U] che tử cung của [borte.GetHerHis] bằng đôi tay run rẩy."
  mpo_temujin_flavor.0030.a: ""[mergid.GetSheHe|U] sẽ phải trả giá cho chuyện này.""
  mpo_temujin_flavor.0030.b: ""#EMP Ngươi#! là điều quan trọng nhất ở đây.""
  mpo_temujin_flavor.0030.c: ""Tại sao ngươi lại làm phiền ta với những điều vô nghĩa này?""
  mpo_temujin_flavor.0030.a.tt: "Ngươi nhận #high $retaliation_cb$#! [casus_belli|E] trên [mergid.GetShortUIName]"
  mpo_temujin_flavor.0030.pregnancy_tt: "[borte.GetShortUIName] sẽ sớm có dấu hiệu mang thai"
  pregnancy.1002.d.borte: "Thời khắc đáng sợ đã đến..."
  pregnancy.1002.a.borte: "Bây giờ đã xong."
  birth.1003.desc.borte: "\n\nTuy nhiên, sự trung thực của [mother.GetFirstNamePossessiveNoTooltip] thật đáng ngưỡng mộ, và điều này không được làm Ta xao nhãng trước những gì đang diễn ra."
  birth.1003.desc.empty: ""
