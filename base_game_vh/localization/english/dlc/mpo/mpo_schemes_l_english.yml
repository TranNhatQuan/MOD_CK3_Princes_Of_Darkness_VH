 # Events
  steal_herd_event_title: "Lấy trộm Herd:"
  steal_herd_outcome.1001.t: "$steal_herd_event_title$ Thành công!"
  steal_herd_outcome.1001.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] của Ta, [courtier.GetName], chạy vào trại một cách kiêu hãnh. Theo sau [courtier.GetHerHim], một người chăn cừu lạ hướng dẫn gia súc đến với Ta.\n\n"Từ trại của [target.GetTitledFirstName]!" [courtier.GetSheHe|U] kêu lên. Khi Ta điều hướng người chăn cừu với những con vật mới, Ta không khỏi nở nụ cười tinh quái. Đàn gia súc của Ta ngày càng mạnh, với chi phí rất ít."
  steal_herd_outcome.1001.a: "Ta biết ơn 'sự hào phóng' của Ngài, [target.GetFirstNameNoTooltip]!"

  steal_herd_outcome.1003.desc: "[courtier.GetSheHe|U] kể chi tiết vụ trộm, bao gồm khả năng kiểm soát phòng thủ của [target.GetFirstNamePossessiveNoTooltip]. Vì chúng Ta đã xâm nhập trại [target.GetFirstNamePossessiveNoTooltip] quá dễ dàng, Ta tự hỏi còn gì khác có thể lấy từ [target.GetHerHis]..."
  steal_herd_outcome.1003.a: "[courtier.GetFirstNameNoTooltip], có thể giải thích lại không?"
  steal_herd_outcome.1003.a_desc: "Ngài cố gắng lấy thêm [herd|E] của [target.GetFirstNamePossessiveNoTooltip]"
  steal_herd_outcome.1003.win: "Vụ trộm tiếp tục"
  steal_herd_outcome.1003.lose: "Ngài không thể lấy thêm"
  steal_herd_outcome.1003.b: "Ta sẽ lục soát kho của [target.GetHerHis]."
  steal_herd_outcome.1003.b_desc: "Ngài cố gắng lấy vàng từ [target.GetFirstNameNoTooltip]"
  steal_herd_outcome.1003.c: "[target.GetPrimarySpouse.GetFirstName] hiện cũng thuộc về [target.GetFirstNameNoTooltip], tạm thời."
  steal_herd_outcome.1003.c_tt: "Ta bắt đầu một [scheme|E] [GetScheme('seduce').GetTypeName] nhắm vào [target.GetPrimarySpouse.GetFirstName] với #p Tỉ lệ thành công cao hơn#! #V #!"
  mpo_steal_herd_seduce_modifier: "Ngón tay của Người chăn cừu"
  mpo_steal_herd_murder_modifier: "Đặc vụ trên đồng cỏ"
  steal_herd_outcome.1003.d: "Có thể là mạng sống của [target.GetHerHis|U]?"
  steal_herd_outcome.1003.d_tt: "Ta bắt đầu một [scheme|E] [GetScheme('murder').GetTypeName] nhắm vào [target.GetFirstName] với #p Tỉ lệ thành công cao hơn#! #V #!"
  steal_herd_outcome.1003.e: "Ta đã lấy đủ rồi."

  steal_herd_outcome.1002.t: "$steal_herd_event_title$ Herd bị lấy!"
  steal_herd_outcome.1002.desc: "[spymaster.GetName] đến gặp ta với tin tức nghiêm trọng. \"Thưa [ROOT.Char.GetFirstName], một vài con vật chúng ta giữ trong sân đã không cánh mà bay.\"\n\n[spymaster.GetSheHe|U] hắng giọng, \"Sau khi điều tra cẩn thận, dường như [owner.GetName] đã cử vài kẻ tay sai đến để 'lấy lại' đàn gia súc, và thuyết phục người chăn cừu rằng đó là theo lệnh của ngài.\""
  steal_herd_outcome.1002.desc_monies: "\n\nSau khi nghe điều này, Ta nhận thấy một rương, trước đây chứa nửa đầy trang sức, giờ đã vơi. Biết kẻ gây ra là cùng người, Ta thở dài."
  steal_herd_outcome.1002.a: "Chúc Ngài sống vĩnh hằng trong [ROOT.Char.GetFaith.NegativeAfterLife], [owner.GetFirstNameNoTooltip]!"

  steal_herd_outcome.2001.t: "$steal_herd_event_title$ Thất bại"
  steal_herd_outcome.2001.desc: "Kế hoạch lấy trộm herd từ [target.GetTitledFirstName] đã thực hiện theo kế hoạch, nhưng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] trở về tay trắng, không mang theo một sợi len nào.\n\n"[owner.GetFirstNameNoTooltip], Ta xin lỗi. [target.GetFirstNameNoTooltip] đã phát hiện chúng ta." [courtier.GetFirstNameNoTooltip] thở dài. "May mà chúng ta thoát trước khi kỵ binh [target.GetHerHis] đuổi kịp.""
  steal_herd_outcome.2001.a: "[target.GetFirstNameNoTooltip] chắc hẳn được thần che chở..."

  steal_herd_outcome.2002.desc: "[courtier.GetName] dẫn ta ra ngoài, và thật đáng thất vọng, một đàn gia súc đã biến mất!\n\n[courtier.GetFirstNameNoTooltip] giải thích rằng chúng ta đã thất bại trong việc đánh cắp đàn gia súc từ [target.GetTitledFirstName]. Nhưng thay vì để các kỵ sĩ của chúng ta trốn thoát, [target.GetSheHe] lập tức trả đũa, và phái một băng nhóm theo sau [courtier.GetFirstNameNoTooltip] và những người khác có liên quan, dẫn họ thẳng đến đồng cỏ của ta. Các kỵ sĩ của [target.GetHerHis|U] đã bắt đi cừu và gia súc khác, rồi rời đi thật nhanh."
  steal_herd_outcome.2002.a: "Sao chúng Ta lại bất tài thế này?!"

  steal_herd_outcome.2003.t: "Đàn Herd của [owner.GetTitledFirstName]"
  steal_herd_outcome.2003.desc: "Một sự náo động xảy ra, [courtier.GetName] tiến đến. [courtier.GetSheHe|U] mỉm cười, ra dấu Ta bước vào sân.\n\nBên ngoài, [courtier.GetSheHe] chỉ vào đàn cừu và ngựa, dẫn bởi một kỵ sĩ của Ta. [courtier.GetFirstNameNoTooltip] nhìn Ta chăm chú. "Thật táo tợn của [owner.GetFirstNameNoTooltip]!" [courtier.GetSheHe] nói. "[owner.GetSheHe|U] đã cố hạ uy tín #italic Ngài#! và lấy đàn của Ngài! May mà [courtier.GetFaith.HighGodName] đã có kế hoạch khác. Những con vật này thuộc về [owner.GetFirstNameNoTooltip] [owner.GetHerHim].""
  steal_herd_outcome.2003.a: "Thất bại của họ hôm nay có lợi cho Ta, [owner.GetFirstNameNoTooltip]!"
 
  steal_herd_ongoing.1001.t: "$steal_herd_event_title$ Tuần tra"
  steal_herd_ongoing.1001.desc: "Để lấy Herd của [target.GetTitledFirstNamePossessive], Ta phải biết đất đai và người của [target.GetHerHis]. Vì vậy Ta ghi chú những đồng cỏ gần nhà [target.GetHerHis], và những nơi xa xôi, hẻo lánh.\n\nQuan sát các cao điểm gần [target.GetCapitalLocation.GetTitle.GetName], chiến binh dẫn bởi [target_knight.GetWomanMan] cưỡi ngựa tiếp cận đoàn Ta từ phía sau. "Các người đến đây làm gì?" Lãnh đạo họ, [target_knight.GetFirstName] hỏi."
  steal_herd_ongoing.1001.a: "Ai đó để thử sức Ta!"
  steal_herd_ongoing.1001.a_win: "Ngài gây ấn tượng với [target_knight.GetFirstNameNoTooltip] nhờ kỹ năng chiến đấu"
  steal_herd_ongoing.1001.duel_desc: "Ngài cố gắng đánh lạc sự chú ý của [target_knight.GetFirstNamePossessiveNoTooltip]"
  steal_herd_ongoing.1001.lose: "[target_knight.GetFirstNameNoTooltip] thắng Ngài"
  steal_herd_ongoing.1001.b: "Tất nhiên là ngưỡng mộ lãnh địa của [target.GetFirstNamePossessiveNoTooltip]."
  steal_herd_ongoing.1001.b_win: "[target_knight.GetFirstNameNoTooltip] đánh giá cao sự quan tâm của Ngài"
  steal_herd_ongoing.1001.c: "Thưởng thức một ly! Ngài có tham gia không?"
  steal_herd_ongoing.1001.c_win: "Ngài và [target_knight.GetFirstNameNoTooltip] uống cả đêm"
  steal_herd_ongoing.1001.c_win_big: "Ngài thuyết phục [target_knight.GetFirstNameNoTooltip] say rượu tham gia vào mục tiêu của Ngài"
  steal_herd_ongoing.1001.d: "Không, Ta đi tiếp."

  steal_herd_ongoing.1002.t: "$steal_herd_event_title$ Chăn cừu trá hình"
  steal_herd_ongoing.1002.desc: "[chosen_agent.GetName] nói với Ta rằng các chăn cừu của [target.GetTitledFirstNamePossessive] thường thất bại khi dẫn một con cừu trong đàn [target.GetHerHis].\n\n"Tại sao Ngài không mặc đồ chăn cừu? Đi đến [target.GetFirstNameNoTooltip], và đề nghị 'giúp' các chăn cừu bất tài của [target.GetHerHis]," Ta gợi ý với [chosen_agent.GetFirstNameNoTooltip]. [chosen_agent.GetSheHe|U] nhìn Ta lo lắng, và thở dài."
  steal_herd_ongoing.1002.a: "Đi đi, [chosen_agent.GetFirstNameNoTooltip], giúp [target.GetHerHim]!"
  steal_herd_ongoing.1002.b: "Và Ta biết Ngài nên nói gì..."
  steal_herd_ongoing.1002.c: "Thực ra, thôi."
  steal_herd_ongoing.1002.duel_desc: "[chosen_agent.GetFirstName] giả làm chăn cừu"
  steal_herd_ongoing.1002.win: "Ngụy trang của [chosen_agent.GetHerHis|U] thuyết phục"
  steal_herd_ongoing.1002.b_tt: "Ngài giúp [chosen_agent.GetFirstName] với ngụy trang của [chosen_agent.GetHerHis]"
  steal_herd_ongoing.1002.lose: "[chosen_agent.GetSheHe|U] không thể giả trang thành công"

  random_negative_scheme_modifier_tt: "Kế hoạch Lấy trộm Herd của [target.GetNameNoTooltip] nhận #n một tiêu cực#! hiệu ứng"
  mpo_steal_herd_observation_modifier: "Khảo sát đất"
  mpo_steal_herd_almost_caught_modifier: "Đôi mắt soi mói"
  mpo_steal_herd_almost_caught_modifier_2: "Nghi ngờ nảy sinh"
  mpo_steal_herd_almost_caught_modifier_3: "Trở ngại nhỏ"
  mpo_steal_herd_friend_modifier: "Quan hệ nội bộ"
  mpo_steal_herd_shepherd_modifier: "Giúp việc thuê"
