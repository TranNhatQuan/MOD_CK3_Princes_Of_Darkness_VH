l_english:

  mpo_storyteller_fantastical_creatures_modifier: "Sinh Vật Kỳ Thú"
  mpo_storyteller_fantastical_creatures_modifier_desc: "Nhân vật này đã được kể về nhiều loài thú cần cẩn trọng khi đi qua thảo nguyên."

  mpo_storyteller_humorous_tales_modifier: "Truyện Hài Hước"
  mpo_storyteller_humorous_tales_modifier_desc: "Nhân vật này đã nghe những câu chuyện ngớ ngẩn khiến bất kỳ ai cũng phải bật cười."

  mpo_storyteller_heroic_triumphs_modifier: "Chiến Công Anh Hùng"
  mpo_storyteller_heroic_triumphs_modifier_desc: "Nhân vật này được truyền cảm hứng chiến đấu sau khi nghe về những chiến binh bất khuất và các trận chiến oanh liệt."

  mpo_whistling_is_difficult_modifier: "Thổi Sáo Khó Khăn"
  mpo_whistling_is_difficult_modifier_desc: "Nhân vật này đã cố học thổi sáo nhưng không thành công nhiều."

  mpo_sufficient_liar_modifier: "Mọi Thứ Đã Chuẩn Bị"
  mpo_sufficient_liar_modifier_desc: "Nhân vật này đã lừa thành công đoàn tùy tùng về việc là chủ một cái bẫy để chống đói."

  mpo_trapped_fawn_modifier: "Vòng Đời"
  mpo_trapped_fawn_modifier_desc: "Nhân vật này thả một con nai khỏi bẫy, hy vọng nó góp phần vào tương lai của quần thể nai."

  mpo_messenger_positive_liege_modifier: "Tin Từ Tiền Tuyến"
  mpo_messenger_positive_liege_modifier_desc: "Nhân vật này nhận được một tin khẩn cấp từ thuộc hạ để chuẩn bị cho sự kiện sắp tới."

  mpo_messenger_negative_liege_modifier: "Lúng Túng Trong Bóng Tối"
  mpo_messenger_negative_liege_modifier_desc: "Nhân vật này chưa từng nhận được một tin quan trọng, khiến họ không kịp chuẩn bị."

  mpo_inspiring_tunes_modifier: "Khúc Nhạc Truyền Cảm Hứng"
  mpo_inspiring_tunes_modifier_desc: "Nhân vật này được truyền cảm hứng từ những khúc nhạc hoài niệm về cội nguồn của họ."
