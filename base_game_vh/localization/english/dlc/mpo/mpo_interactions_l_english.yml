  ask_for_herd_county_depleted_modifier_desc: "Những người chăn trong hạt này đã bị tách đàn cưỡng bức. Không có gia súc, chu trình tự nhiên của màu mỡ bị gián đoạn.\nSét đánh cháy cỏ chưa ăn; đất trở nên khô cằn nếu không có móng gia súc; không có hệ thống phân bón từ móng, vùng đất này bị nguyền và sẽ có #EMP nhiều năm #!cằn cỗi phía trước."
 
