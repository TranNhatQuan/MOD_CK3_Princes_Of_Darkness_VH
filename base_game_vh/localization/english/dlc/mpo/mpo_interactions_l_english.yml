  influence_child_commander_interaction: "Huấn luyện Chiến thuật cho Trẻ"
  influence_child_commander_interaction_desc: "Truyền [commander_trait|E] của Ngài cho [ward|E]"
  influence_child_commander_interaction_trait_limit: "[CHARACTER.GetShortUINameNoTooltip] đã có [commander_trait|E]"
  influence_child_commander_interaction_all_same_traits: "[CHARACTER.GetShortUINameNoTooltip] đã có tất cả các [commander_traits|E]"
  guardian_influenced_commander: "Huấn luyện Chiến thuật cho Trẻ"
  guardian_influenced_commander_desc: "[actor.GetShortUINameNoTooltip] huấn luyện thuộc tính [target_trait.GetName(recipient)] cho con Ngài, [recipient.GetShortUINameNoTooltip]."
  guardian_influenced_commander_fail: "Dạy Thuộc tính Chỉ huy Thất bại"
  guardian_influenced_commander_fail_desc: "[actor.GetShortUINameNoTooltip] cố gắng huấn luyện thuộc tính [target_trait.GetName(actor)] cho con Ngài, [recipient.GetShortUINameNoTooltip], nhưng thất bại."
  mpo_interactions_events.0101.t: "$influence_child_commander_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Thành công"
  mpo_interactions_events.0101.desc_intro: "[recipient.GetName] trông chán nản sau nhiều giờ xem các chiến thuật quân sự trên bản đồ. Ta đứng dậy, ném cho [recipient.GetHerHim] một thanh kiếm tập và hét:\n\n"Ra ngoài nào, ai đánh trúng cơ thể trước thắng!"\n\n"
  mpo_interactions_events.0101.logistician: "Ta rút kiếm tập ra, sẵn sàng chiến đấu. [recipient.GetFirstNameNoTooltip] nắm lấy [recipient.GetHersHis] và lập tức vào trận. Đánh dữ dội nhưng chính xác. Chúng Ta chiến đấu lâu, nhưng không rõ người thắng, cả hai đều mệt nhoài.\n\n"Ta nghỉ chút, ngày mai tiếp tục.""
  mpo_interactions_events.0101.desc_logistician: "$mpo_interactions_events.0101.logistician$ Ta bắt đầu nghỉ ngơi, nhưng [recipient.GetSheHe|U] lại cảm thấy khó chịu và với tay vào chiếc túi của [recipient.GetHersHis]. \n\n\"Không, chúng ta có thể tiếp tục!\" người đó kêu lên và đưa cho ta một mảnh [recipient.Custom('GetLocalStreetFood')]."
  mpo_interactions_events.0101.military_engineer: "Chúng Ta trao đổi các đòn đều nhau, nhưng không trúng mục tiêu. Cuối cùng, [recipient.GetFirstNameNoTooltip] tạo khoảng cách lớn hơn và ngã xuống đất.\n\n"Ngài có bị thương không?" Ta bắt đầu lo lắng"
  mpo_interactions_events.0101.desc_military_engineer: "$mpo_interactions_events.0101.military_engineer$, nhưng rồi một viên đá văng ngang đầu Ta.\n\n"Gần trúng rồi!" [recipient.GetSheHe|U] hét khi nạp lại ná."
  mpo_interactions_events.0101.aggressive_attacker: "Ta lập tức lao vào [recipient.GetHerHim] và dồn ép [recipient.GetHerHis] kiếm.\n\n"Hãy nhớ, trong chiến đấu là Ngài hoặc họ. Dùng hết sức lực và còn hơn thế nữa!""
  mpo_interactions_events.0101.desc_aggressive_attacker: "$mpo_interactions_events.0101.aggressive_attacker$\n\nTrước khi Ta kịp nói hết câu, [recipient.GetFirstNameNoTooltip] nhảy vào Ta. [recipient.GetHerHis|U] đánh mạnh khiến mảnh gỗ văng tung, phá vỡ kiếm Ta. Không còn gì để phòng thủ, Ta phải chịu thua."
  mpo_interactions_events.0101.desc_unyielding_defender: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] không nao núng. Mỗi đòn đều được chặn hoặc né, Ta không thể chạm vào [recipient.GetHerHim]."
  mpo_interactions_events.0101.forder: "Chúng Ta xuống sông để bắt đầu trận đấu. Sau vài cú đánh Ta bị đẩy xuống nước. Ta nhảy lên một vài ụ đất để tìm chỗ đứng vững."
  mpo_interactions_events.0101.desc_forder: "$mpo_interactions_events.0101.forder$\n\n"Ngài quá chậm, già [ROOT.Char.GetWomanMan]!" [recipient.GetFirstNameNoTooltip] xuất hiện trước mặt Ta và đẩy Ta xuống nước."
  mpo_interactions_events.0101.flexible_leader: ""Đi chuyển chân, giữ tư thế, tìm sơ hở, đừng phân tâm!" Ta lao tới hy vọng làm [recipient.GetHerHim] bối rối bởi lời la rầy của Ta."
  mpo_interactions_events.0101.desc_flexible_leader: "$mpo_interactions_events.0101.flexible_leader$ Tuy nhiên, [recipient.GetFirstNameNoTooltip] né được và phản công, kết thúc trận đấu trước khi nó bắt đầu."
  mpo_interactions_events.0101.desert_warrior: "Chúng Ta xoay quanh nhau chờ sơ hở. Khi Ta thấy, Ta lập tức tấn công. [recipient.GetFirstNameNoTooltip] đợi đến phút cuối để ném một nắm"
  mpo_interactions_events.0101.desc_desert_warrior: "$mpo_interactions_events.0101.desert_warrior$ cát vào mặt Ta, làm Ta mù tạm thời. Ta trượt, để lộ sơ hở cho [recipient.GetHerHim] thắng đấu."
  mpo_interactions_events.0101.jungle_stalker: "[recipient.GetFirstNameNoTooltip] chạy ra trước, trốn vào rừng. Ta cố tìm [recipient.GetHerHim] nhưng càng đi sâu, rừng càng tối và rậm rạp."
  mpo_interactions_events.0101.desc_jungle_stalker: "$mpo_interactions_events.0101.jungle_stalker$\n\n"Ta bắt được ngươi!" [recipient.GetFirstNameNoTooltip] nhảy từ cây xuống, khiến Ta bất ngờ và thua trận."
  mpo_interactions_events.0101.reaver: "Để khởi động, chúng Ta trao đổi vài cú nhanh."
  mpo_interactions_events.0101.desc_reaver: "$mpo_interactions_events.0101.reaver$ [recipient.GetFirstNameNoTooltip] kéo Ta vào ôm. Chúng Ta vật lộn cho đến khi [recipient.GetSheHe] đột ngột lùi lại.\n\n"Chắc cái này là của ngươi?" [recipient.GetSheHe|U] cười khi thử #EMP nhẫn của Ta#!"
  mpo_interactions_events.0101.reckless: "Chúng Ta lập tức bắt đầu chiến đấu. Đánh, trượt; Thọc, né; Đá, trúng! [recipient.GetFirstNameNoTooltip] lăn xuống sông. [recipient.GetSheHe|U] lắc nước và hét:\n\n"Ta ghét ngươi!" rồi lao vào Ta.\n\n"Không, đừng!""
  mpo_interactions_events.0101.desc_reckless: "$mpo_interactions_events.0101.reckless$ Ta cố tránh, nhưng đánh giá sai tốc độ [recipient.GetHerHis]. [recipient.GetSheHe] đập đầu vào Ta."
  mpo_interactions_events.0101.holy_warrior: "Trước khi chiến đấu, Ta cầu nguyện:\n\n"Thần [ROOT.Char.GetFaith.WarGodName]! Hãy dẫn tay ta, để cú đánh nhanh và mạnh.""
  mpo_interactions_events.0101.desc_holy_warrior: "$mpo_interactions_events.0101.holy_warrior$\n\n"Hãy ban sức mạnh để ta khoan dung với kẻ thù!" [recipient.GetFirstNameNoTooltip] kết thúc và đứng tư thế hoàn hảo."
  mpo_interactions_events.0101.terrain_expert: "Chúng Ta vào một khe gần đó. Trận đấu kéo dài vì không thể chạm nhau giữa các cành cây. Cuối cùng,"
  mpo_interactions_events.0101.desc_open_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$\n\n[recipient.GetFirstNameNoTooltip] nhìn thấy khoảng trống phía sau Ta.\n\n"Giờ ta bắt được ngươi!" [recipient.GetSheHe|U] hô và đẩy Ta ra chỗ trống. Với sân rộng, di chuyển [recipient.GetHerHis] quá nhanh và khó đoán. [recipient.GetSheHe|U] đánh trúng Ta dễ dàng."
  mpo_interactions_events.0101.rough_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$"
  mpo_interactions_events.0101.desc_rough_terrain_expert: "$mpo_interactions_events.0101.rough_terrain_expert$\n\n[recipient.GetFirstNameNoTooltip] thấy mảnh đất gồ ghề phía sau Ta.\n\n"Giờ ta bắt được ngươi!" [recipient.GetSheHe|U] hô và đẩy Ta vào đá. Trong đồi đá, di chuyển [recipient.GetHerHis] quá nhanh và khó đoán. [recipient.GetSheHe|U] đánh trúng Ta dễ dàng."
  mpo_interactions_events.0101.forest_fighter: "$mpo_interactions_events.0101.terrain_expert$ [recipient.GetFirstNameNoTooltip] trèo lên cây.\n\n"Này lấy cái này!" [recipient.GetSheHe|U] bẻ cành ném vào Ta. Ta né nhưng quá muộn. Ta cảm nhận kiếm [recipient.GetHerHis] chạm chân Ta."
  mpo_interactions_events.0101.desc_forest_fighter: "$mpo_interactions_events.0101.forest_fighter$"
  mpo_interactions_events.0101.desc_cautious_leader: "Ta thử vài cú đánh, nhảy lên và chọc. [recipient.GetFirstNameNoTooltip] không để lộ sơ hở. Ta giậm chân hét, cố hù dọa [recipient.GetHerHim]. [recipient.GetSheHe|U] vẫn giữ phòng thủ.\n\n"Đủ rồi!" Ta mất bình tĩnh lao vào [recipient.GetHerHim], nhưng đó là lúc [recipient.GetSheHe] chờ sẵn! Thấy sơ hở, [recipient.GetSheHe] đánh Ta, thắng trận."
  mpo_interactions_events.0101.organizer: "Chúng Ta cầm kiếm tập và chiến đấu suốt giờ đồng hồ."
  mpo_interactions_events.0101.desc_organizer: "$mpo_interactions_events.0101.organizer$ Ta bắt đầu mệt, nhưng [recipient.GetHerHis] vẫn nhanh và chính xác. Ta không theo kịp. Với hơi thở cuối cùng, Ta cố thọc, nhưng [recipient.GetSheHe] né và phản công như vừa bắt đầu. Ta chịu thua."
  mpo_interactions_events.0101.winter_soldier: "$mpo_interactions_events.0101.desert_warrior$"
  mpo_interactions_events.0101.desc_winter_soldier: "$mpo_interactions_events.0101.winter_soldier$ cát, nhưng Ta né được. Để [recipient.GetHerHim] không phòng thủ, Ta đánh trúng và thắng dễ dàng."
  mpo_interactions_events.0101.a: ""Một ngày nào đó ngươi sẽ là chỉ huy vĩ đại!""
  mpo_interactions_events.0101.a.flavor: "[recipient.GetFirstNameNoTooltip] dường như đã nắm được tinh thần [target_trait.GetNameNoTooltip(GetPlayer)]."
  mpo_interactions_events.0102.t: "$influence_child_commander_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Thất bại"
  mpo_interactions_events.0102.desc_intro: "$mpo_interactions_events.0101.desc_intro$"
  mpo_interactions_events.0102.desc_logistician: "$mpo_interactions_events.0101.logistician$ [recipient.GetSheHe|U] nghỉ, nhưng Ta với tay vào túi đưa [recipient.GetHerHim] một miếng [ROOT.Char.Custom('GetLocalStreetFood')].\n\n"Không, ta tiếp tục!""
  mpo_interactions_events.0102.desc_military_engineer: "$mpo_interactions_events.0101.military_engineer$ khi ta nghe thấy một tiếng rên rỉ nhẹ. \n\n\"Ta đã muốn bắn súng cao su vào ngươi, n-nhưng...\" [recipient.GetSheHe|U] bật khóc và cho ta thấy những ngón tay của [recipient.GetHerHis] bị vướng vào dây chằng."
  mpo_interactions_events.0102.desc_aggressive_attacker: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] bắt đầu vung kiếm trước mặt [recipient.GetHerHim] và chạy về phía ta với đôi mắt [recipient.GetHerHis] nhắm nghiền. Ta chạy qua [recipient.GetHerHim] và tung một cú đánh"
  mpo_interactions_events.0102.desc_unyielding_defender: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] bỏ cuộc sau vài đòn nữa. [recipient.GetSheHe|U] buông kiếm và mở ra một cú vung mạnh. Ta suýt nữa đã #EMP không#! đánh với toàn bộ sức lực."
  mpo_interactions_events.0102.desc_forder: "$mpo_interactions_events.0101.forder$ [recipient.GetFirstNameNoTooltip] cố gắng bắt lấy ta, nhưng những viên đá quá trơn trượt. [recipient.GetSheHe|U] ngã ngay dưới chân ta, vì vậy ta đã dễ dàng tung một cú đánh vào [recipient.GetHerHim]!"
  mpo_interactions_events.0102.desc_flexible_leader: "$mpo_interactions_events.0101.flexible_leader$ [recipient.GetSheHe|U] không kịp né, Ta đánh trúng dễ dàng."
  mpo_interactions_events.0102.desc_desert_warrior: "$mpo_interactions_events.0101.desert_warrior$ cát, nhưng Ta đỡ bằng khiên, phản lại [recipient.GetHerHim]. Mù lòa, [recipient.GetSheHe] vô phòng thủ, Ta đánh trúng dễ dàng và thắng."
  mpo_interactions_events.0102.desc_jungle_stalker: "$mpo_interactions_events.0101.jungle_stalker$\n\n"Á! Rắn!" [recipient.GetFirstNameNoTooltip] ngã từ cây, rơi ngay dưới chân Ta, dễ dàng thắng."
  mpo_interactions_events.0102.desc_reaver: "$mpo_interactions_events.0101.reaver$ Ta kéo [recipient.GetFirstNameNoTooltip] vào ôm. Chúng Ta vật lộn cho tới khi Ta tháo được nhẫn khỏi ngón [recipient.GetHerHis].\n\n"Cẩn thận, lần sau có thể mất cả tay!""
  mpo_interactions_events.0102.desc_reckless: "$mpo_interactions_events.0101.reckless$ Ta né tránh khiến [recipient.GetHerHim] mất thăng bằng. [recipient.GetSheHe|U] trượt và ngã tiếp."
  mpo_interactions_events.0102.desc_holy_warrior: "$mpo_interactions_events.0101.holy_warrior$\n\n"Nói ít, đánh nhiều!" [recipient.GetFirstNameNoTooltip] ngắt lời và tấn công.\n\n"[ROOT.Char.GetFaith.HighGodName] tha thứ!" Ta thì thầm và hạ gục [recipient.GetFirstNameNoTooltip] chỉ bằng một đòn."
  mpo_interactions_events.0102.desc_open_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$\n\nTa nhìn thấy khoảng trống phía sau [recipient.GetFirstNameNoTooltip].\n\nTa đẩy [recipient.GetHerHim] ra ngoài. Với ưu thế sân rộng, Ta di chuyển nhanh và khó đoán. [recipient.GetSheHe|U] không có chỗ trốn, Ta đánh trúng dễ dàng."
  mpo_interactions_events.0102.desc_rough_terrain_expert: "$mpo_interactions_events.0101.rough_terrain_expert$\n\nTa thấy mảnh đất gồ ghề phía sau [recipient.GetFirstNameNoTooltip].\n\nTa đẩy [recipient.GetHerHim] vào đồi đá. Với địa hình gồ ghề, di chuyển Ta nhanh và khó đoán. [recipient.GetSheHe|U] không chỗ trốn, Ta đánh trúng dễ dàng."
  mpo_interactions_events.0102.desc_forest_fighter: "$mpo_interactions_events.0101.forest_fighter$ Ta trèo lên cây.\n\n"Này lấy cái này!" Ta hét, bẻ cành ném vào [recipient.GetHerHim]. [recipient.GetSheHe|U] né nhưng quá muộn. Ta lao theo và đánh trúng [recipient.GetHerHis] dễ dàng."
  mpo_interactions_events.0102.desc_cautious_leader: "[recipient.GetSheHe|U] thử vài cú vung, bước tới và đâm. Ta không để lộ bất kỳ sơ hở nào. [recipient.GetSheHe|U] dậm chân và hét lên, cố gắng đe dọa ta. Nhưng ta không hề lay chuyển. \n\n\"Đủ rồi!\" [recipient.GetSheHe|U] mất bình tĩnh [recipient.GetHerHis] và lao vào ta, nhưng đây chính là thời điểm ta chờ đợi! Nhận thấy sơ hở, ta tấn công, giành chiến thắng trong cuộc đấu tay đôi."
  mpo_interactions_events.0102.desc_organizer: "$mpo_interactions_events.0101.organizer$ Ta nhận thấy hơi thở nặng nhọc của [recipient.GetHerHis], các động tác chậm lại và những cú đánh trượt mục tiêu. [recipient.GetSheHe|U] không thể theo kịp nữa. Với hơi thở cuối cùng của [recipient.GetHerHis], [recipient.GetSheHe] cố gắng lao tới, nhưng ta chỉ đơn giản là né sang một bên. [recipient.GetSheHe|U] gục ngã vì kiệt sức."
  mpo_interactions_events.0102.desc_winter_soldier: "$mpo_interactions_events.0101.winter_soldier$ cát, Ta né được. Để [recipient.GetHerHim] không phòng thủ, Ta đánh trúng dễ dàng và thắng."
  mpo_interactions_events.0102.a: ""Có lẽ lần sau.""
  mpo_interactions_events.0102.a.flavor: "Huấn luyện chứng minh [recipient.GetFirstNameNoTooltip] còn một chặng đường dài."
  mpo_interactions_events.0102.b: ""Chúng ta sẽ luyện lại cho đến khi ngươi thắng!""
  mpo_interactions_events.0102.b.flavor: "Với sự #EMP kiên trì#! đầy đủ, [recipient.GetFirstNameNoTooltip] có thể đạt được bất cứ điều gì ngài thiết lập cho [recipient.GetHerHim]."

