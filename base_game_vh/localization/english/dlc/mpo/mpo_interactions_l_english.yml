  mpo_interactions_events.0006.desc: "cuộc đời chúng ta trở thành một! [ROOT.Char.Custom('SisterBrother')|U] — Ta thề sẽ yêu thương Ngài mãi mãi, và bảo vệ Bạn Tốt."\n\nTa thề cùng, gây vết thương và trộn máu với [blood_bro.Custom('SisterBrother')] mới.\n\nHiệp ước đã được niêm phong, chúng Ta trao đổi quà tặng, ăn uống no đủ, và chia sẻ một tấm da cho giấc ngủ ban đêm. Chúng Ta mơ về"
