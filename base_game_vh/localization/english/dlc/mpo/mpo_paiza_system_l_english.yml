l_english:

  mpo_establish_paiza_system_decision: "Thiết Lập Hệ Thống Paiza"
  mpo_establish_paiza_system_decision_desc: "Một hệ thống bảng đặc biệt sẽ được thiết lập để thu hút người nước ngoài giàu có và trao quyền cho các thần dân trung thành của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]. [ROOT.Char.GetSheHe|U] ai mang [paiza|E] có khắc tên [ROOT.Char.GetTitledFirstNameNoTooltip] sẽ mang quyền lực của Ta và được đi lại an toàn trên lãnh thổ của Ta. Ai dám bất kính với tên Ta sẽ bị xử tử như chó."
  mpo_establish_paiza_system_decision_tooltip: "Trao quyền cho thần dân trung thành của Ngài"
  mpo_establish_paiza_system_decision_confirm: "Bằng quyền lực của Thiên Định Vĩnh Cửu"
  mpo_establish_paiza_system_decision_is_gurkhan: "Ngươi là [gurkhan|E]"

  mpo_establish_paiza_system_decision.grant_paiza_interaction_unlocked: "Mở khóa #V $mpo_interaction_grant_paiza$#! [character_interaction|E] có thể sử dụng với [courtiers|E], [vassals|E], và [tributaries|E] của Ngài"
  mpo_establish_paiza_system_decision.request_paiza_interaction_unlocked: "Mở khóa #V $mpo_interaction_ask_for_paiza$#! [character_interaction|E] dành cho [vassals|E], [tributaries|E], và [adventurers|E] đến thăm [court|E] của Ngài"
  mpo_establish_paiza_system_decision.paiza_obedient: "Những nhân vật nhận Paiza [artifacts|E] sẽ trở nên [obedient|E] với Ngài."
  mpo_establish_paiza_system_decision.paiza_abuse_authority_unlocked: "@alert_icon! Nhân vật mang Paiza có thể truy cập #V $mpo_abuse_authority_paiza_decision$#! [decision]"
  mpo_establish_paiza_system_decision.leverage_khan_authority_unlocked: "@alert_icon! Nhân vật mang Paiza có thể truy cập #V $mpo_interaction_leverage_khan_authority$#! [interaction]"
  mpo_establish_paiza_system_decision.call_for_merchants_decision_unlocked: "Mở khóa [GetDecisionWithKey('mpo_call_for_merchants_decision').GetName] [decision|E]"
  mpo_establish_paiza_system_decision.paiza_recently_established: "Hệ thống Paiza đã được [THIS.Char.GetName] thiết lập. [THIS.Char.GetHerHis|U] còn sống ngăn cản Ngài lập hệ thống mới. Mỗi hơi thở đáng thương của [THIS.Char.GetHerHis] là một sự xúc phạm đến quyền lực của Ngài."

  mpo_decisions_events.0099.t: "Hệ Thống Paiza Được Thiết Lập"
  mpo_decisions_events.0099.desc: "Quyền lực của Ta như chính thảo nguyên: trải dài vô tận đến chân trời. Nhưng Ta lại như một giọt nước duy nhất trong mưa, chỉ gắn với một nơi. \n\nBên ngoài thảo nguyên, dân thành thị dùng sổ sách để truyền tri thức vượt khỏi tầm nhìn hạn hẹp của họ. Ta sẽ dùng ý tưởng đó và phát Paiza. Thần dân trung thành sẽ mang những lời quan trọng nhất: #EMP tên của Ta.#!\n\n[ROOT.Char.GetTitledFirstNameNoTooltip]: những chữ khắc trên hiện vật sẽ mang lại sự sợ hãi và tuân phục tuyệt đối."
  mpo_decisions_events.0099.a: "Ý chí của Ta đã trở thành hiện thực."

  paiza_artifact_title: "Paiza của [patron.GetTitledFirstNameNoTooltip]"
  paiza_artifact_desc: "[paiza|E], một tấm bảng kim loại đơn giản nhưng uy nghiêm, có thể đem lại quyền lực và tai họa. Mặt sau khắc dòng chữ: \n\nBằng quyền lực của Thiên Định Vĩnh Cửu. Dưới sự bảo hộ của Thần Phúc Hoàng Gia. Một sắc lệnh của [patron.GetTitledFirstName]; bất cứ ai không tôn trọng sẽ bị trừng phạt, sẽ bị xử tử."

  mpo_call_for_merchants: "Triệu Tập Khách Giàu Có"

  mpo_call_for_merchants_decision: "$mpo_call_for_merchants$: Paiza"
  mpo_call_for_merchants_decision_desc: "Thảo nguyên rộng lớn hơn hẳn những thành phố nước ngoài béo phì, hư hỏng. Nhưng họ sở hữu hàng hóa, thiết bị và ý tưởng có thể hữu ích cho ta. Có lẽ một trong những kẻ giàu có ngu ngốc sẽ dám đi xa tới đây."
  mpo_call_for_merchants_decision_tooltip: "$mpo_call_for_merchants_decision.merchant_will_arrive$"
  mpo_call_for_merchants_decision_confirm: "Gửi sứ giả"
  mpo_call_for_merchants_dead_merchant_toast: "Khách Giàu Có Chết Trên Đường"
  mpo_call_for_merchants_dead_merchant_desc: "Khách giàu có [merchant.GetShortUIName] đã tử vong trong chuyến đi tới [merchant.GetHerHis]"

  mpo_call_for_merchants_small_decision: "$mpo_call_for_merchants$: Đề Nghị Địa Phương"
  mpo_call_for_merchants_small_decision_desc: "$mpo_call_for_merchants_decision_desc$"
  mpo_call_for_merchants_small_decision_tooltip: "Cải thiện binh lính hoặc cho phép tạo [artifact|E]."
  mpo_call_for_merchants_small_decision_confirm: "Gửi sứ giả"
  mpo_call_for_merchants_decision.merchant_will_arrive_smol: "$mpo_call_for_merchants_decision.merchant_will_arrive_generic$\n$BULLET_WITH_TAB$Khoảng #P 20%#! của số [gold|E] đầu tư của Ngài"
  mpo_call_for_merchants_decision.merchant_will_arrive_generic: "Một người nước ngoài giàu có sẽ đến triều đình của Ngài, dẫn đầu đoàn lữ hành đến các thành phố phát triển và ổn định. Khi trở về, Ngài có thể nhận được lợi ích sau:\n$BULLET_WITH_TAB$Khoảng #P 40%#! số [gold|E] Ngài đầu tư\n$BULLET_WITH_TAB$Nguyên liệu tạo [artifact|E] mở khóa #V $commission_artifact_decision$#! [decision|E]\n$BULLET_WITH_TAB$Vũ khí cho [horde|E] và [archer_cavalry|E] của Ngài"
  mpo_call_for_merchants_decision.gold_needed_smol: "Đề nghị sinh lợi hơn yêu cầu đầu tư [gold|E] cao hơn, lên tới 800 [gold_i|E]"


  mpo_call_for_merchants_decision.robbed_merchants: "Khách nước ngoài trước đây đã trả lời triệu tập của Ngài biến mất một cách dữ dội, và tin tức này đã lan ra. Sẽ mất một thời gian trước khi kẻ liều lĩnh khác dám xuất hiện."
  mpo_call_for_merchants_decision.merchant_will_arrive: "$mpo_call_for_merchants_decision.merchant_will_arrive_generic$\n$BULLET_WITH_TAB$Tiến trình [innovation|E] ngẫu nhiên"
  mpo_call_for_merchants_decision.buildings: "Các [internal_upgrades|E] khác cho [GetDomicileBuilding('trade_yurt_01').GetName] [yurt_building|E] mang lại lợi ích bổ sung."
  mpo_call_for_merchants_decision.gold_needed: "Đề nghị sinh lợi hơn yêu cầu đầu tư [gold|E] cao hơn, lên tới 2400 [gold_i|E]"

  mpo_decisions_events.0100.t: "$mpo_call_for_merchants_decision$"
  mpo_decisions_events.0100.desc: "$mpo_decisions_events.2141.desc$"
  mpo_decisions_events.0100.a: "Mang đến cho ta ý tưởng mới."
  mpo_decisions_events.0100.a_not_unlocked: "Ngươi chưa có [GetDomicileBuilding('trade_yurt_01').GetName] [yurt_building|E]"
  mpo_decisions_events.0100.b: "Thép sẽ được sử dụng hiệu quả."
  mpo_decisions_events.0100.c: "Áo giáp cho Hordes của ta."
  mpo_decisions_events.0100.d: "Trước tiên đổi đàn gia súc lấy vàng."
  mpo_decisions_events.0100.d.unlocked: "Ngươi có thể chọn hàng hóa sau khi trao đổi [herd|E].\n#weak Ngươi có tùy chọn này vì đã có [GetDomicileBuilding('herd_trade_yurt_01').GetName] [yurt_building|E].#!"
  mpo_decisions_events.0100.e: "Của cải và mạng sống của ngươi. Ngay bây giờ."
  mpo_decisions_events.0100.e.warning: "@alert_icon! #alert_trial Trong hai thập kỷ tới, sẽ không còn khách giàu có nào dám tới triều đình của Ngài. Ngài sẽ không thể thực hiện #V $mpo_call_for_merchants_decision$#! trong khoảng thời gian này.#!"

  mpo_decisions_events.2141.t: "$mpo_call_for_merchants_small_decision$"
  mpo_decisions_events.2141.desc: "[paiza_merchant.GetName] đến sớm hơn ta mong đợi, với bụi bặm trên đôi ủng của [paiza_merchant.GetHerHis] và ánh sáng trong mắt [paiza_merchant.GetHerHis].\n\n\"Cảm ơn ngài đã cho phép thần có mặt ở đây, thưa [ROOT.Char.GetTitleAsNameNoTooltip] khôn ngoan và quyền năng. Thần nghe nói ngài quan tâm đến hàng hóa từ [merchant_origin.GetNameNoTier], những món hàng thần có thể mang đến lều yurt của ngài. Thần sẽ dẫn đoàn lữ hành đến đó và quay trở lại.\n\nThần sẽ khiêm tốn mang đến cho ngài những gì ngài mong muốn. Đó là thép thô từ những lò luyện tốt nhất? Bộ giáp có thể phản lại mọi đòn tấn công? Hay thứ gì khác?\""
  mpo_decisions_events.2141.b: "$mpo_decisions_events.0100.b$"
  mpo_decisions_events.2141.c: "$mpo_decisions_events.0100.c$"
  mpo_decisions_events.2141.d: "$mpo_decisions_events.0100.d$"
  mpo_decisions_events.2141.d.unlocked: "$mpo_decisions_events.0100.d.unlocked$"
  mpo_decisions_events.2141.e: "$mpo_decisions_events.0100.e$"
  mpo_decisions_events.2141.e.warning: "$mpo_decisions_events.0100.e.warning$"
  mpo_decisions_events.2141.upon_merchant_return: "$mpo_decisions_events.0100.upon_merchant_return$"


  mpo_decisions_events.0100.upon_merchant_return: "Khi [paiza_merchant.GetNameNoTooltip] trở về từ chuyến đi của [paiza_merchant.GetHerHis] đến [merchant_origin.GetName]:"

  mpo_decisions_events.0101.t: "Người Nước Ngoài Trở Về"
  mpo_decisions_events.0101.desc: "[paiza_merchant.GetName] đã tới và đang nhấm nháp [Glossary( 'kumis', 'KUMIS_GLOSS')] trong yurt của Ta, sau chuyến đi dài và gian truân tới [merchant_origin.GetName].\n\nNhững hàng hóa quý giá Ta yêu cầu đang được dỡ xuống. Sói thảo nguyên và cừu thành phố tìm được cách tồn tại cùng nhau, dù chỉ một thời gian."
  mpo_decisions_events.0101.a: "Tuyệt vời!"
  mpo_decisions_events.0101.b: "Kể cho ta nghe chuyện đất xa xôi"
  mpo_decisions_events.0101.b.desc: "[paiza_merchant.GetName] sẽ kể cho ngươi nghe những chuyến đi qua các vùng đất mà [paiza_merchant.GetSheHe] đã đi."

  mpo_decisions_events.2137.t: "Những Chuyến Đi Của [paiza_merchant.GetFirstNameNoTooltip]"
  mpo_decisions_events.2137.desc_intro: "[paiza_merchant.GetName] hít một hơi, nhìn xa và bắt đầu kể chuyện:\n#weak"
  mpo_decisions_events.2137.desc_interludium: "\n\n#![paiza_merchant.GetSheHe|U] thở hổn hển, rồi kể tiếp về một vùng đất khác:\n#weak"
  mpo_decisions_events.2137.a: "Ta hiểu"
  mpo_decisions_events.2137.b: "Kể thêm cho ta!"
  mpo_decisions_events.2137.c: "Ở lại yurt của ta."

  mpo_decisions_events.2138.t: "Đổi Đàn Gia Súc Lấy Vàng"
  mpo_decisions_events.2138.desc: "Ngươi và [paiza_merchant.GetName] đi đến [GetDomicileBuilding('trade_yurt_01').GetName] để bàn chi tiết. [paiza_merchant.GetSheHe|U] giải thích:\n\n"Ta có thể mua từ ngươi một số lượng lớn đàn gia súc. Ta đã kết nối được trong chuyến đi tới đây. Không có người mua sỉ, nhưng Ta sẽ thăm đủ những người chăn nhỏ trên đường trở về để có lợi nhuận. Hoặc ít nhất không lỗ quá nhiều.\n\nTa đưa đề nghị này ra, để tôn trọng ngươi và uy quyền của ngươi, [ROOT.Char.GetTitleAsNameNoTooltip] của Ta.""
  mpo_decisions_events.2138.desc_rate_1: "[GetDomicileBuilding('herd_trade_yurt_01').GetName] 6 [herd_i] đổi 1 [gold_i]"
  mpo_decisions_events.2138.desc_rate_2: "[GetDomicileBuilding('herd_trade_yurt_03').GetName] 4 [herd_i] đổi 1 [gold_i]"
  mpo_decisions_events.2138.desc_rate_3: "[GetDomicileBuilding('herd_trade_yurt_06').GetName] 2 [herd_i] đổi 1 [gold_i]"
  mpo_decisions_events.2138.a: "Đồng ý."
  mpo_decisions_events.2138.b: "Cho nhiều, thu nhiều."
  mpo_decisions_events.2138.c: "Quay lại thôi."
  mpo_decisions_events.2138.c.desc: "Ngươi sẽ không thực hiện trao đổi [herd|E] và quay lại bàn về mục tiêu chuyến đi của [paiza_merchant.GetNamePossessive]."
  mpo_decisions_events.2141.already_traded: "Ngươi đã trao đổi [herd|E] lấy [gold|E]"

  mpo_abuse_authority_paiza_decision: "Lạm Quyền Của Gurkhan"
  mpo_abuse_authority_paiza_decision_tooltip: "[gurkhan|E] nói thông qua ta!"
  mpo_abuse_authority_paiza_decision_desc: "Ta mang theo tên của Gurkhan. Những chữ khắc trên Paiza làm người ta khiếp sợ. Đất xung quanh màu mỡ, nhưng dân cư nơi đây yếu ớt. Ta sẽ lấy từ họ những gì có thể, không bằng sức mạnh vô song của ta, mà qua danh nghĩa Gurkhan."
  mpo_abuse_authority_paiza_decision_confirm: "Nhân danh [gurkhan|E]!"
  mpo_abuse_authority_paiza_decision.paiza_patron_not_topdog: "Người bảo trợ [paiza|E] không còn là [gurkhan|E]"
  mpo_abuse_authority_paiza_decision.not_topdog_realm_or_steppe: "Quyền lực của [gurkhan|E] không được công nhận nơi này"
  mpo_abuse_authority_paiza_decision.no_more_paiza_abuse: "[gurkhan|E] đã phản ứng với hành động của Ngài"
  mpo_abuse_authority_paiza_decision.region_already_abused: "Vùng đất này đã từng chứng kiến việc lạm quyền của [gurkhan|E]"
  mpo_abuse_authority_paiza_decision.nothing_to_abuse: "Không còn đất nào ở [location|E] để lạm quyền"

  mpo_decisions_events.0110.t: "Nhân Danh [paiza_patron.GetTitleAsNameNoTooltip]"
  mpo_decisions_events.0110.desc: "Ta là thần dân #EMP trung thành#! của [paiza_patron.GetTitledFirstNamePossessive]. Ta mang tên của [paiza_patron.GetHerHis] khắc trên kim loại và ý chí của [paiza_patron.GetHerHis] trong lời nói và việc làm của mình. Sức mạnh của ta chính là của [paiza_patron.GetHerHis].\n\n[local_boi.GetName] yếu đuối kia có thể cầu xin bao nhiêu tùy thích. Điều đó sẽ không làm thay đổi sắc lệnh của Gurkhan truyền ra từ miệng ta.\n\nTất cả của cải, tất cả những con vật thích hợp từ những vùng đất này, phải được thu gom ngay lập tức và mang đến cho ta. Vì sự yếu đuối của các người xúc phạm đến thẩm quyền của [paiza_patron.GetTitleAsNamePossessiveNoTooltip] và ta sẽ sử dụng tất cả chúng cho... một mục đích #EMP tốt hơn#!."
  mpo_decisions_events.0110.a: "Thu thập tất cả những gì di chuyển!"
  mpo_decisions_events.0110.b: ""Đừng hé răng nửa lời, bọn chó!""
  mpo_decisions_events.0110.c: "Ta thay đổi ý định."
  mpo_decisions_events.0110.d: "Điều này là #EMP sai lầm#!. Đi ngay!"
  mpo_decisions_events.0110.b.success: "Thành công"
  mpo_decisions_events.0110.b.success_desc: "Không một lời về chuyện xảy ra ở đây đến được [paiza_patron.GetTitledFirstName]"
  mpo_decisions_events.0110.b.failure: "[paiza_patron.GetTitledFirstName] nghe về việc lạm quyền này"
  custom.mpo_resources_gained_abuse: "Cướp bóc từ các [counties|E] lân cận"

  mpo_decisions_events.0111.t: "Cơn Thịnh Nộ Của Gurkhan"
  mpo_decisions_events.0111.desc: "Gurkhan giống như chính thảo nguyên vậy. Sức mạnh và ý chí của [paiza_patron.GetNamePossessive] trải dài khắp nơi. Tên của [paiza_patron.GetHerHis|U] được thì thầm bởi gió.\n\nTa mang theo tên của [paiza_patron.GetHerHis] bên mình, khắc trên miếng kim loại Paiza. Ta đã sử dụng nó để gieo rắc nỗi sợ hãi và sự vâng lời vào lòng người. Có vẻ như đã một lần quá nhiều.\n\nGiờ đến lượt ta phải sợ hãi. Gurkhan đã nghe về những hành động của ta và gọi chúng là sự lạm dụng lời nói, tên tuổi của [paiza_patron.GetHerHis]. Và vì thế, ta sẽ trở thành một ví dụ khủng khiếp cho cả thảo nguyên nhìn thấy."
  mpo_decisions_events.0111.a: "Ta sẵn sàng nhận phán quyết."
  mpo_decisions_events.0111.b: ""Ah, nhưng việc ta làm là chính đáng, ngươi thấy…"""

  mpo_decisions_events.0112.t: "$mpo_decisions_events.0111.t$"
  mpo_decisions_events.0112.desc: "Ta giống như chính thảo nguyên vậy. Sức mạnh và ý chí của ta trải dài khắp nơi. Tên ta được thì thầm bởi gió.\n\nCác kỵ sĩ mang theo tên của ta bên mình, khắc trên kim loại của những chiếc Paiza của họ. Tuy nhiên, một vài kẻ trong số họ vặn vẹo nó như những con rắn, những kẻ tham lam ngu ngốc như [paiza_abuser.GetName] và [paiza_abuser_1.GetName]. Không lâu trước đây, [paiza_abuser.GetSheHe] đã quỳ rạp cơ thể giun dế của [paiza_abuser.GetHerHis|U] trước ta, giờ [paiza_abuser.GetSheHe] lại ngược đãi các thần dân trung thành của ta, những người đang trông chờ vào ta để tìm câu trả lời, tìm công lý. Hãy để gió mang ý chí thực sự của ta đi ngay bây giờ!\n\n\"Tin tức vừa truyền đến tai ta. Hãy cho chúng biết [ROOT.Char.GetTitledFirstNameNoTooltip] sẵn sàng đối đầu với bất kỳ tên hoạn quan nào, [paiza_abuser.GetFirstNameNoTooltip], [paiza_abuser_1.GetFirstNameNoTooltip], bất kể là ai. Tên của ta là tên của ta!\""
  mpo_decisions_events.0112.a: "Mang đầu họ đến cho ta!"
  mpo_decisions_events.0112.a.desc: "Những [characters|E] khác mang [paiza|E] của ngươi sẽ bớt muốn lạm quyền nếu cả [paiza_abuser.GetFirstName] và [paiza_abuser_1.GetFirstName] đều chết."
  mpo_decisions_events.0112.b: "Ta sẽ bỏ qua… tạm thời."
  mpo_decisions_events.0112.c: "Đừng bao giờ làm phiền ta nữa."
  mpo_decisions_events.0112.c.flavor: "Sẽ có lạm quyền tiếp theo, nhưng ngươi sẽ không được thông báo nữa."


