 # Contract 1
  nomadic_migration_contract_1_contract: "$nomadic_migration_contract_1_desc_title$"
  nomadic_migration_contract_1_desc_title: "Những Người Chăn Bất Đồng"
  nomadic_migration_contract_1_desc: "Sau khi định cư tại [TaskContract.GetLocation.GetName], chúng Ta gặp vài xung đột với nhóm chăn gia súc địa phương theo [TaskContract.GetEmployer.GetName]. Khiêu khích của họ kéo dài quá lâu — đã đến lúc chấm dứt tình trạng bất ổn này."
  nomadic_migration_contract_1_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0005.t: "$nomadic_migration_contract_1_desc_title$"
  mpo_contract_events.0005.desc: "Chỉ vài khoảnh khắc gặp một trong những người chăn ở Karakorum, vấn đề đã lộ rõ. [herder_character.GetName] cho rằng cộng đồng [herder_character.GetHerHis] sống ở vùng này từ nhiều thế hệ, nhưng chỉ đến khi chúng Ta đến, họ mới gặp thiếu lương thực.\n\nHọ từ chối rời tổ tiên, nhưng một biểu hiện quyền lực có thể thuyết phục họ — trừ khi chúng ta tìm cách lợi dụng sự hiện diện của họ."
  mpo_contract_events.0005.a: "Tham gia với Ta, chúng ta sẽ mạnh hơn."
  mpo_contract_events.0005.a.impressed: "Chúng Ta đi đến thỏa thuận"
  mpo_contract_events.0005.a.unimpressed: "Họ không ấn tượng với lập luận của chúng ta"
  mpo_contract_events.0005.b: "Làm việc cho Ta, Ta sẽ giải quyết vấn đề thực phẩm."
  mpo_contract_events.0005.c: "Đuổi họ ra khỏi #emp đất của chúng ta#!"

 # Contract 2
  nomadic_migration_contract_2_contract: "$nomadic_migration_contract_2_desc_title$"
  nomadic_migration_contract_2_desc_title: "Đàn Hoang Dã"
  nomadic_migration_contract_2_desc: "Một đàn hoang dã chạy khắp cánh đồng quanh [TaskContract.GetLocation.GetName]. Đàn của chúng ta sẽ bị ảnh hưởng nếu những thú này được bỏ mặc."
  nomadic_migration_contract_2_request: "$nomadic_migration_contract_request$"
  mpo_si_slaughtered_for_a_feast: "Đầy Bữa Tiệc"
  mpo_si_slaughtered_for_a_feast_desc: "Nhân vật này mang về một bữa tiệc hoành tráng cho dân."
  migration_contract_2_herd_reward_tt: "#V Ngài#! nhận [herd_i] #P [SCOPE.ScriptValue('miniscule_herd_value_static')]-[SCOPE.ScriptValue('minor_herd_value_static')]#! [herd|E]"

  mpo_contract_events.0015.t: "$nomadic_migration_contract_2_desc_title$"
  mpo_contract_events.0015.desc: "Ngay từ xa, đàn thú chăn thả là một cảnh tượng đáng xem. Chúng đã ăn hết cỏ đất, ít chỗ cho đàn của chúng ta phát triển.\n\nNgười chăn của chúng ta yêu cầu giải quyết trước khi đàn chúng ta bị đói và chết."
  mpo_contract_events.0015.a: "Ta sẽ bắt một phần cho đàn của chúng ta."
  mpo_contract_events.0015.a.successful: "Ngài bắt được phần lớn đàn hoang dã"
  mpo_contract_events.0015.a.failure: "Ngài bắt được một phần nhỏ đàn hoang dã"
  mpo_contract_events.0015.b: "Giết chúng và chuẩn bị một bữa tiệc nhỏ."
  mpo_contract_events.0015.c: "Chúng sẽ mang lại cho chúng ta một khoản nhỏ."

 # Contract 3
  nomadic_migration_contract_3_contract: "$nomadic_migration_contract_3_desc_title$"
  nomadic_migration_contract_3_desc_title: "Đồng Cỏ Gây Tranh Cãi"
  nomadic_migration_contract_3_desc: "Đã xảy ra xung đột kéo dài giữa [TaskContract.GetTaker.Custom('KnightCulturePluralNoTooltip')] của Ta về những đồng cỏ tốt nhất quanh [TaskContract.GetLocation.GetName], dần dần leo thang cho tới khi tự hào khiến họ mâu thuẫn sâu sắc."
  nomadic_migration_contract_3_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0025.t: "$nomadic_migration_contract_3_desc_title$"
  mpo_contract_events.0025.desc: "Sau khi chúng Ta di cư đến [task_contract.GetLocation.GetName], đã có tranh chấp liên tục giữa [task_contract.GetEmployer.GetFirstName] và [knight_2.GetFirstName] về đồng cỏ gần đó.\n\nBan đầu chỉ là rắc rối nhỏ, nhưng nó đã leo thang và giờ tự hào khiến cả hai bên không chịu nhượng bộ. Ta nên can thiệp trước khi tình hình tệ hơn và ảnh hưởng morale trong trại."
  mpo_contract_events.0025.a: "[task_contract.GetEmployer.GetFirstNameNoTooltip] đúng, đất thuộc về [task_contract.GetEmployer.GetHersHis]."
  mpo_contract_events.0025.b: "Thực ra, [knight_2.GetFirstNameNoTooltip] có lý hơn."
  mpo_contract_events.0025.c: "Đàn của Ta sẽ phát triển tốt trên mảnh đất đó."

 # Contract 4
  nomadic_migration_contract_4_contract: "$nomadic_migration_contract_4_desc_title$"
  nomadic_migration_contract_4_desc_title: "Thiếu Dụng Cụ"
  nomadic_migration_contract_4_desc: "Cuộc di cư đến [TaskContract.GetLocation.GetName] đã làm hao hụt kho vật liệu và dụng cụ của chúng ta. Nếu không được bổ sung, điều này sẽ sớm ảnh hưởng đến bộ tộc."
  nomadic_migration_contract_4_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0035.t: "$nomadic_migration_contract_4_desc_title$"
  mpo_contract_events.0035.desc: "Cuộc di cư mới nhất đến [task_contract.GetLocation.GetName] đã làm dân chúng thiếu nhiều dụng cụ cơ bản hằng ngày. Ngay cả những việc đơn giản cũng bị chậm lại.\n\nNếu không có thương nhân mang đến hàng hóa cần thiết, dân chúng sẽ tiếp tục khổ sở."
  mpo_contract_events.0035.a: "Thương nhân của chúng ta sẽ xử lý."
  mpo_contract_events.0035.b: "Chúng ta sẽ tìm thương nhân để có dụng cụ."
  mpo_contract_events.0035.c: "Tên Ta đã nổi tiếng khắp nơi, sẽ có người lo liệu."
  mpo_contract_events.0035.d: "Dân chúng sẽ phải thiếu thốn."
  EVENT_WINDOW_OPTION_AVAILABLE_TRADE_YURT: "Lựa chọn này khả dụng nhờ [GetDomicileBuilding('trade_yurt_01').GetName]"
  mpo_si_lacking_tools: "Thiếu Dụng Cụ"
  mpo_si_lacking_tools_desc: "Dân của nhân vật này không có đủ dụng cụ chăm sóc bộ tộc."
  mpo_si_lacking_tools_2: "$mpo_si_lacking_tools$"
  mpo_si_lacking_tools_2_desc: "$mpo_si_lacking_tools_desc$"
  mpo_si_lacking_tools_3: "$mpo_si_lacking_tools$"
  mpo_si_lacking_tools_3_desc: "$mpo_si_lacking_tools_desc$"

 # Contract 5
  nomadic_migration_contract_5_contract: "$nomadic_migration_contract_5_desc_title$"
  nomadic_migration_contract_5_desc_title: "Bộ Tộc Tan Rã"
  nomadic_migration_contract_5_desc: "Tách biệt với phần còn lại dưới sự lãnh đạo của Ta, bộ tộc ở [TaskContract.GetLocation.GetName] yêu cầu có một thủ lĩnh địa phương."
  nomadic_migration_contract_5_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0045.t: "$nomadic_migration_contract_5_desc_title$"
  mpo_contract_events.0045.desc: "Bộ lạc tại [task_contract.GetLocation.GetName] vốn dĩ, ngay cả trước khi chúng ta di cư đến khu vực này, đã thường có chút tách biệt với phần còn lại của [ROOT.Char.GetPrimaryTitle.GetName]. Giờ đây, hơn bao giờ hết, dường như họ muốn có sự độc lập lớn hơn và một thủ lĩnh riêng xứng đáng.\n\nKhi ta đến nơi, một [new_chieftain.GetWomanMan] tên là [new_chieftain.GetFirstName] dường như là đại diện của họ. [new_chieftain.GetSheHe|U] có vẻ là một [new_chieftain.GetWomanMan] biết lý lẽ, sẵn lòng thề phục tùng ta miễn là người dân của [new_chieftain.GetHerHis] được phép sống theo cách của riêng họ."
  mpo_contract_events.0045.a: "Chúng ta có thể bàn bạc."
  mpo_contract_events.0045.a.successful: "Ta đã thuyết phục họ"
  mpo_contract_events.0045.a.failure: "Họ vẫn chưa tin"
  mpo_contract_events.0045.b: "[new_chieftain.GetFirstNameNoTooltip] à? Hãy để [new_chieftain.GetHerHim] cai trị họ."
  mpo_contract_events.0045.b.tt: "[task_contract.GetLocation.GetName] có thể trở thành [divergent_culture|E] của [task_contract.GetLocation.GetCulture.GetName]"
  mpo_contract_events.0045.c: "Một món quà nhỏ sẽ nhắc họ về tất cả những gì Ta làm cho họ."
  mpo_contract_events.0045.d: "Họ sẽ quen với điều đó."
  mpo_si_accepting_cultures: "Chấp Nhận Tan Rã"
  mpo_si_accepting_cultures_desc: "Nhân vật này đã chấp nhận bộ tộc tách ra từ bộ tộc chính."

 # Contract 6
  nomadic_migration_contract_6_contract: "$nomadic_migration_contract_6_desc_title$"
  nomadic_migration_contract_6_desc_title: "Đất Độc"
  nomadic_migration_contract_6_desc: "Vùng đất quanh [TaskContract.GetLocation.GetName] dường như làm đàn của chúng ta yếu đi, mắc bệnh sau khi định cư."
  nomadic_migration_contract_6_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0055.t: "$nomadic_migration_contract_6_desc_title$"
  mpo_contract_events.0055.desc: "Đàn đã yếu, bước đi không còn vững. Quan sát, Ta thấy vài con nằm yên, không đủ năng lượng để di chuyển.\n\nNếu tình trạng này tiếp tục, toàn bộ đàn ở [task_contract.GetLocation.GetName] có nguy cơ lây bệnh. Bộ tộc sẽ ra sao nếu điều đó xảy ra?"
  mpo_contract_events.0055.a: "Chúng sẽ vượt qua, Ta sẽ đảm bảo."
  mpo_contract_events.0055.a.successful: "Đàn hồi phục"
  mpo_contract_events.0055.a.failure: "Đàn yếu đi"
  mpo_contract_events.0055.b: "Ta sẽ tìm người giúp chúng."
  mpo_contract_events.0055.c: "Giết chúng trước khi bệnh lan rộng."
  mpo_si_slaughtered_animals: "Thịt Dự Trữ"
  mpo_si_slaughtered_animals_desc: "Nhân vật này đã dự trữ nhiều thịt.\n#emp Loại bỏ lần tới khi tổ chức [GetActivityType('activity_feast').GetName]#!\n\nChi phí [GetActivityType('activity_feast').GetName]: #P [gold_i]-50%#!"

 # Contract 7
  nomadic_migration_contract_7_contract: "$nomadic_migration_contract_7_desc_title$"
  nomadic_migration_contract_7_desc_title: "Hàng Xóm Phiền Phức"
  nomadic_migration_contract_7_desc: "Kỵ sĩ từ bộ tộc láng giềng  đi ngang [TaskContract.GetLocation.GetName], mang theo một đàn thú lớn."
  nomadic_migration_contract_7_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0065.t: "$nomadic_migration_contract_7_desc_title$"
  mpo_contract_events.0065.desc: "Dù ít, kỵ sĩ từ [neighbor_leader.GetPrimaryTitle.GetBaseName] dũng cảm đi qua [task_contract.GetLocation.GetName] với đàn thú lớn. Họ dường như đang truy tìm đàn mất khi chúng Ta định cư.\n\nKhi đất trống đến với họ, Ta không thể để họ tự do đi qua lãnh thổ.\n\n#bold Những vùng đất này là cho đàn của Ta, chỉ của Ta.#!"
  mpo_contract_events.0065.a: "Chúng ta để họ rời đi hòa bình, nhưng phải trả giá."
  mpo_contract_events.0065.a.successful: "Họ trả chi phí"
  mpo_contract_events.0065.a.failure: "Chúng ta không cản được họ"
  mpo_contract_events.0065.b: "Đây là #emp đất của chúng ta#!, và đó là #emp đàn của chúng ta#!"
  mpo_contract_events.0065.c: "Để họ yên."

 # Contract 8
  nomadic_migration_contract_8_contract: "$nomadic_migration_contract_8_desc_title$"
  nomadic_migration_contract_8_desc_title: "Di Tích Còn Lại"
  nomadic_migration_contract_8_desc: "Có vẻ chúng ta vừa phát hiện dấu vết của nhóm người trước ở khu vực này. Có một đàn thú và những túp lều hỏng quanh trại mới ở [TaskContract.GetLocation.GetName]."
  nomadic_migration_contract_8_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0075.t: "$nomadic_migration_contract_8_desc_title$"
  mpo_contract_events.0075.desc: "Khi đi qua [barony_location.Custom('HoldingNoHoldingTerrainRoaming')], Ta gặp đàn thú bán thuần đã từng được quan sát nhiều lần. Ngay cả khi tiếp cận, rõ ràng chúng đã từng tương tác với con người.\n\nNếu để chúng tự do, chúng sẽ tiếp tục gặm trên những vùng đất có thể dùng cho đàn của chúng ta. Ta nên đưa chúng về [ROOT.Char.GetCapitalLocation.GetName], hay xử lý theo cách khác? Giải pháp tốt nhất cho dân tộc của Ta là gì?"
  mpo_contract_events.0075.a: "Chúng sẽ là bổ sung tuyệt vời cho đàn của chúng ta."
  mpo_contract_events.0075.b: "Đuổi chúng ra khỏi [task_contract.GetLocation.GetNameNoTooltip]."
  mpo_contract_events.0075.c: "Giết toàn bộ đàn thú."

 # Contract 9
  nomadic_migration_contract_9_contract: "$nomadic_migration_contract_9_desc_title$"
  nomadic_migration_contract_9_desc_title: "Kẻ Vẽ Ranh Giới"
  nomadic_migration_contract_9_desc: "Sau khi định cư ở [TaskContract.GetLocation.GetName] đã xảy ra bất đồng về một số đồng cỏ tốt gần đó. [TaskContract.GetEmployer.GetName] đã cố gắng hòa giải giữa các bộ tộc nhưng không thành công."
  nomadic_migration_contract_9_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0085.t: "$nomadic_migration_contract_9_desc_title$"
  mpo_contract_events.0085.desc: "[task_contract.GetEmployer.GetName] đã giải thích tình hình chi tiết với Ta. Có vẻ sau khi chúng Ta di cư, bộ tộc ở [other_county.GetName] là những người đầu tiên chiếm đồng cỏ, nhưng vùng đất lại gần [task_contract.GetLocation.GetName] hơn.\n\nDù [task_contract.GetEmployer.GetSheHe] đã cố hòa giải, nỗ lực của [task_contract.GetEmployer.GetNamePossessiveNoTooltip] không thành công. Một trong hai bên sẽ thất vọng, nhưng phải đưa ra quyết định sớm."
  mpo_contract_events.0085.a: "Đồng cỏ sẽ thuộc về [task_contract.GetLocation.GetNameNoTooltip]."
  mpo_contract_events.0085.b: "Nó thuộc về [other_county.GetNameNoTooltip]."
  mpo_si_spurned_tribe: "Bộ Tộc Bị Từ Chối"

 # Contract 10
  nomadic_migration_contract_10_contract: "$nomadic_migration_contract_10_desc_title$"
  nomadic_migration_contract_10_desc_title: "Bộ Tộc Cũ"
  nomadic_migration_contract_10_desc: "Trại của chúng Ta ở [TaskContract.GetLocation.GetName] đã được tiếp cận bởi những cộng đồng nhỏ từng sống ở đây trước khi chúng Ta đến."
  nomadic_migration_contract_10_request: "$nomadic_migration_contract_request$"

  mpo_contract_events.0095.t: "$nomadic_migration_contract_10_desc_title$"
  mpo_contract_events.0095.desc: "Trại của ta đã được tiếp cận bởi [new_chieftain.GetName], một thủ lĩnh chỉ có trong tay một nhóm người nhỏ bé. Phương ngữ của [new_chieftain.GetHerHis|U] rất lạ, nhưng [new_chieftain.GetSheHe] nói với sự tự tin và lòng kiêu hãnh về người dân của [new_chieftain.GetHerHis] cũng như những gian khổ mà họ đã trải qua.\n\n#emp \"[ROOT.Char.GetTitleAsNameNoTooltip], nếu ngài có thể tìm cho chúng ta một khoảng không gian giữa những căn lều yurt của ngài, chúng ta sẽ dâng hiến bầy gia súc của mình và thần sẽ phục vụ ngài đích thân. Nếu không... Chẳng còn lại bao nhiêu cho chúng thần ở những vùng đất này nữa.\"#!"
  mpo_contract_events.0095.a: "Chúng ta sẽ tiếp nhận họ."
  mpo_contract_events.0095.b: "Họ không thuộc về đây, loại bỏ họ đi."
  mpo_si_old_tribe: "Bộ Tộc Ngoại Lai"
 
