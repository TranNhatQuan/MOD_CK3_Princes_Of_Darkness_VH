l_english:
  mpo_nomads_season_events.0001.t: "Cưỡi Trên Bão"
  mpo_nomads_season_events.0001.desc: ""Ngài có thấy hình dạng của những đám mây không? Chúng trông như bị móng vuốt của chim ưng cào xước," [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('storm_chaser'))] [storm_chaser.GetTitledFirstName] Ta nói, chỉ tay lên bầu trời. \n\n"Đây báo hiệu một cơn bão khủng khiếp. Ta nói chúng ta hãy lợi dụng nó. Hãy mang ngựa và cung lao vào cơn gió dữ, tấn công [raid_target.GetTitledFirstName] bất ngờ, và cướp đàn gia súc của [raid_target.GetHerHis].""
  mpo_nomads_season_events.0001.a: "Ngày mai, chúng ta xuất phát!"
  mpo_nomads_season_events.0001.b: "Chúng ta phải đảm bảo chỗ trú cho mình."
  mpo_storm_shelter_modifier: "Trại Chống Bão"
  mpo_storm_shelter_modifier_desc: "Trại này đã buộc yurt kép xuống đất, đàn vật nuôi được giữ gần nhau, để chống lại cơn bão sắp tới."
 
  mpo_nomads_season_events.0005.t: "Bụng Đói"
  mpo_nomads_season_events.0005.desc: "Cơn gió gào thét đập vào những bức tường lều yurt của ta. \n\nTa ngạc nhiên trước sự xuất hiện của [hungry_neighbour.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hungry_neighbour'))] của ta, người đã dũng cảm vượt qua những nguy hiểm của cơn bão để quỳ rạp [hungry_neighbour.GetHerselfHimself] trước ta, đặt một chai [Glossary( 'kumis', 'KUMIS_GLOSS')] dưới chân ta như một lễ vật. \n\n\"Đây là những thời khắc tồi tệ, và người dân của thần đang chết đói. Thần chẳng còn lựa chọn nào khác ngoài việc cầu xin sự giúp đỡ.\""
  mpo_nomads_season_events.0005.a: "Dân của ngươi sẽ không còn đói nữa."
  mpo_nomads_season_events.0005.b: "Ngươi sẵn sàng trao gì để đổi lại?"
  mpo_nomads_season_events.0005.c: "Ở đây không có gì cho ngươi."

  mpo_nomads_season_events.0010.t: "Mùa Sung Túc"
  mpo_nomads_season_events.0010.desc: "Tiếng kêu blee của đàn cừu làm Ta mất yên bình buổi sáng. Tiếp theo là mùi chúng, nồng nặc dưới nắng. Cuối cùng, chủ nhân của chúng xuất hiện. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rich_neighbour'))] [rich_neighbour.GetTitledFirstName] "
  mpo_nomads_season_events.0010.desc_offered_herd: "cẩn thận cởi bỏ đôi giày của [rich_neighbour.GetHerHis], để không làm bẩn bên trong lều yurt của ta. \n\n\"Thần đã không quên sự hào phóng mà ngài đã thể hiện khi người dân của thần đang chết đói. Thần đến đây để trả món nợ của mình.\""
  mpo_nomads_season_events.0010.desc_fallback: "làm bẩn cửa yurt của Ta với phân khi [rich_neighbour.GetSheHe] bước vào. \n\n"#EMP Thân mến của Ta#! [ROOT.Char.GetTitleTierName]!" [rich_neighbour.GetSheHe] tuyên bố. "Ta phải cảm ơn trời đất vì đàn vật sung túc. Có dư nếu ngươi có tiền.""
  mpo_nomads_season_events.0010.a: "Nói cho ta biết giá của ngươi."
  mpo_nomads_season_events.0010.b: "Ta chấp nhận lễ vật của ngươi."
  mpo_nomads_season_events.0010.c: "Giữa [rich_neighbour.Custom('SisterBrother')]s không có nợ nần."
  mpo_nomads_season_events.0010.d: "Đưa cho ta đàn vật, hoặc đầu ngươi!"
  mpo_nomads_season_events.0010.e: "Ta không cần trao đổi gì."
  mpo_nomads_season_events.0010.d.tt.success: "Ngươi đã đánh bại [rich_neighbour.GetTitledFirstName] và vệ sĩ của [rich_neighbour.GetHerHis]"
  mpo_nomads_season_events.0010.d.tt.failure: "[rich_neighbour.GetTitledFirstName] và vệ sĩ của [rich_neighbour.GetHerHis] kịp thoát"
  given_herd: "Ngươi có tùy chọn này vì trước đó đã đưa [herd|E] cho nhân vật này."

  mpo_nomads_season_events.0015.t: "Tính Khẩu Nóng"
  mpo_nomads_season_events.0015.desc: "Mọi nơi ta nhìn, ta đều thấy thần dân của mình vét đáy những chiếc bát rỗng, cố gắng cứu vãn từng mẩu nhỏ nguồn cung cấp đang cạn kiệt của chúng ta. \n\nSự im lặng bị phá vỡ bởi một tiếng loảng xoảng lớn. Chiếc bát [Glossary( 'kumis', 'KUMIS_GLOSS')] của [kurultai_2.GetTitledFirstName] nằm lật úp trên mặt đất, nội dung bên trong thấm vào vùng đất khô cằn. [kurultai_1.GetTitledFirstName] đứng phía trên hiện trường cười lớn, và nói, \"Ta không thấy ngươi ở đó.\"\n\n[kurultai_2.GetTitledFirstName] lao đến bên chân [kurultai_2.GetHerHis], vai gồng lên. Có vẻ như hai thành viên Kurultai của ta sắp lao vào ẩu đả."
  mpo_nomads_season_events.0015.a: "Đừng khóc vì #EMP kumis#! bị đổ, [kurultai_2.GetTitledFirstNameNoTooltip]."
  mpo_nomads_season_events.0015.b: "Tiếp tục, đánh đi! Giải trí cho chúng Ta."
  mpo_nomads_season_events.0015.c: "Buông bỏ đi, cả hai."
  mpo_nomads_season_events.0015.b.tt.success: "[kurultai_1.GetTitledFirstName] bị thương trong trận đấu"
  mpo_nomads_season_events.0015.b.tt.failure: "[kurultai_2.GetTitledFirstName] bị thương trong trận đấu"


