l_english:
  mpo_events_tova.0001.t: "Tiếp Đón Lạnh Lùng"
  mpo_events_tova.0001.desc: "Không lâu sau khi trở về, ta nhận thấy [demanding_relation.GetTitledFirstName] lảng vảng theo sau ta với vẻ mặt đầy mong đợi. Chúng ta đã không gặp nhau một thời gian, vì [demanding_relation.GetSheHe] ở lại triều đình trong chuyến đi mới nhất của ta, nhưng rõ ràng là [demanding_relation.GetSheHe] mong đợi nhiều hơn là sự có mặt của ta. \n\n[demanding_relation.GetSheHe|U] nhìn lên ta với đôi mắt sáng rực và hỏi, \"Ngài có mang gì về cho ta từ chuyến đi không?\" \n\nTa lục lọi khắp các túi nhưng không thấy gì ngoài một [ROOT.Char.Custom('RandomWeirdObject')]. Ta không có chút ký ức nào về việc làm thế nào mà nó lại nằm trong đó."
  mpo_events_tova.0001.a: "Để Ta kể cho Ngài nghe về chuyến đi của Ta."
  mpo_events_tova.0001.a.tt.failure: "Ngài không gây ấn tượng với [demanding_relation.GetTitledFirstName]."
  mpo_events_tova.0001.a.tt.success: "Ngài gây ấn tượng với [demanding_relation.GetTitledFirstName]."
  mpo_events_tova.0001.b: "Ta sẽ đi chợ và mua cho Ngài một món quà."
  mpo_events_tova.0001.b.equipped_tt: "Mua [wanderer_toy.GetName] cho [demanding_relation.GetTitledFirstName]."
  gifted_toy_name: "Ngựa Đồ Chơi"
  gifted_toy_desc: "Một con ngựa đồ chơi bằng gỗ, được chạm khắc tinh xảo."
  mpo_events_tova.0001.c: "Ta có sẵn sàng nói dối một đứa trẻ không?"
  mpo_events_tova.0001.c.tt.failure: "[demanding_relation.GetTitledFirstName] không dễ bị lừa."
  mpo_events_tova.0001.c.tt.success: "Ngài thuyết phục [demanding_relation.GetTitledFirstName] rằng món đồ này thật đặc biệt."
 
  mpo_events_tova.0002.t: "Những Âm Thanh Xa Xôi"
  DynamicIntroLanded: "Khi Ta lang thang trong các sảnh"
  DynamicIntroWanderer: "Khi Ta đi qua trại"
  mpo_events_tova.0002.desc: "[ROOT.Char.Custom('DynamicIntroLoc')], ta nghe thấy tiếng nhạc thoang thoảng phát ra từ sân trong. \n\nNhững hợp âm chảy tràn thành một điệp khúc hài hòa, khiến ta khựng lại và tấn công ta bằng một nỗi nhớ sâu sắc. Ta không cần nghe lời ca để biết rằng bài hát này nói về nỗi nhớ nhà. \n\nLần theo âm thanh, ta gặp [musician.GetTitledFirstName], vị [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('musician'))] của ta. [musician.GetSheHe|U] đã đi một quãng đường xa rời quê nhà, và đang chơi bài hát của [musician.GetHerHis] như thể để hồi tưởng lại nơi [musician.GetSheHe] đã sinh ra. \n\nQuả thực, nếu ta nhắm mắt lại, ta có thể hình dung ra [journey_province.Custom('TerrainInspirationLoc')] của [journey_province.GetName]."
  mpo_events_tova.0002.a: "Ta nên đến thăm nơi này một ngày nào đó."
  mpo_events_tova.0002.a.tt: "Ngài có thể nhận thêm kinh nghiệm [wanderer_lifestyle|E] nếu ghé thăm [journey_province.GetName] trong một [GetActivityType('activity_journey').GetName]."
  mpo_events_tova.0002.b: "Ta sẽ dùng tình yêu âm nhạc để chiêu mộ [musician.GetHerHim]."
  mpo_events_tova.0002.b.flavor: "Một nhóm chắc chắn tốt hơn một hợp âm đơn độc?"
  mpo_events_tova.0002.b.tt.success: "Ngài thành công thuyết phục [musician.GetTitledFirstName] gia nhập."
  mpo_events_tova.0002.b.tt.failure: "Ngài thất bại trong việc thuyết phục [musician.GetTitledFirstName] gia nhập."
  cultural_acceptance_enjoyed_music: "Sự [cultural_acceptance|E] giữa [journey_province.GetCounty.GetCulture.GetCollectiveNoun] và [journey_provice.GetCounty.GetCulture.GetCollectiveNoun] tăng lên [minor_cultural_acceptance_gain]."
  mpo_events_tova.0002.c: "Ngồi lại một lúc và thưởng thức âm nhạc."

  mpo_events_tova.0003.t: "Trò Đùa Quá Đà"
  mpo_events_tova.0003.desc: "Tiếng quạ rùng rợn chào đón Ta khi Ta rời khỏi rìa rừng, nơi những chiếc thòng lọng trống treo lắc lư trên cành [unruly_province.Custom('GetRandomRegionalWood')]. Ba người đàn ông bị xiềng gối dưới thòng lọng. Một người trong số họ trông gần giống [unruly_province_owner.GetTitledFirstName]. \n\n'Những kẻ hèn hạ này đã chế nhạo quyền cai trị chính đáng của [unruly_province_owner.GetTitleTierName] chúng ta!' người hành hình gào lên. 'Chúng là nông dân nổi loạn giả danh diễn viên, và chiến dịch phỉ báng của họ sẽ kết thúc bằng cái chết.' \n\n'Xin hãy cứu chúng Ta,' một trong những người bị cáo kêu gọi Ta."
  mpo_events_tova.0003.a: ""Thật ra, những diễn viên đó là của Ta và Ta muốn họ trở lại.""
  mpo_events_tova.0003.a.tt: "Chiêu mộ các diễn viên bằng cách thuyết phục người hành hình rằng họ là thần dân của Ngài và chỉ Ngài mới quyết định số phận họ."
  mpo_events_tova.0003.a.tt.success: "Ngài thuyết phục người hành hình rằng các diễn viên và số phận họ thuộc về Ngài."
  mpo_events_tova.0003.a.tt.failure: "Ngài bị lừa phát hiện và [unruly_province_owner.GetTitledFirstName] biết về hành động của Ngài."
  mpo_events_tova.0003.b: ""Hình phạt này không tương xứng với tội lỗi.""
  mpo_events_tova.0003.b.tt: "Thuyết phục người hành hình tha cho các tù nhân."
  mpo_events_tova.0003.b.tt.success: "Ngài thuyết phục người hành hình thả các tù nhân."
  mpo_events_tova.0003.b.tt.failure: "Ngài thất bại trong việc thuyết phục người hành hình và [unruly_province_owner.GetTitledFirstName] không hài lòng với sự can thiệp của Ngài."
  mpo_events_tova.0003.c: "Ta còn việc phải làm. Đi thôi."
  mpo_events_tova.0003.c.tt: "Họ nên bị trừng phạt vì hành vi xấu xa của mình!"

  mpo_events_tova.0004.t: "Thiếu Trung Thành"
  mpo_events_tova.0004.desc: "Bóng tối buổi tối được xua tan bởi ánh sáng từ đống lửa bập bùng, nơi một nhóm binh sĩ đang đóng trại cùng nhau dùng bữa. \n\n'Ngay cả khi nhắm mắt và bịt mũi, Ta vẫn khó nuốt thứ bã này. Ta không thể chịu thêm loại cháo này, hay đi tìm hạt mốc để ăn hàng ngày!' \n\nNgười đàn ông này dường như là thủ lĩnh nhóm, dựa vào niềm vui và những cái vỗ vai mà anh nhận được từ người khác."
  mpo_events_tova.0004.a: "Phân phát khẩu phần nghiêm ngặt để rèn kỷ luật."
  mpo_events_tova.0004.a.flavor: "Hy vọng binh sĩ bất mãn không làm điều gì quá đáng..."
  mpo_events_tova.0004.a.tt: "Ngài bán một phần lương thực của quân đội."
  mpo_events_tova.0004.b: "Ta sẽ chặt đầu thủ lĩnh."
  mpo_events_tova.0004.b.tt: "Kẻ trẻ tuổi kiêu ngạo bị giết ngay tại chỗ."
  mpo_events_tova.0004.c: "Ta sẽ chi tiền cho lương thực tốt hơn."

  mpo_events_tova.0005.t: "Binh Sĩ Vui Vẻ"
  mpo_events_tova.0005.desc: "Một cột khói bốc lên phía trước, và ngay cả từ khoảng cách này ta cũng có thể ngửi thấy mùi thịt quay thơm phức. Lần theo mùi hương, ta bắt gặp một nhóm binh lính đồn trú của mình đang thưởng thức không dưới ba con chim cút. \n\n\"Ta có thể quen với cuộc sống này đấy,\" kẻ ồn ào nhất trong nhóm tuyên bố. \"Sự tĩnh lặng và yên bình rất tốt cho tâm hồn, và bất cứ nơi nào chúng ta đến, người nông dân đều có dư thừa thực phẩm. Chúng ta thật may mắn khi được sống trong những thời kỳ hòa bình như vậy, và phục vụ một [ROOT.Char.GetTitleTierName] nhân từ với [ROOT.Char.GetHerHis] thần dân.\""
  mpo_events_tova.0005.a: "Quất vào mông những kẻ lười biếng."
  mpo_events_tova.0005.b: "Rèn kỷ luật vì không cảnh giác."
  mpo_events_tova.0005.c: "Hãy trân trọng niềm vui và lời khen của họ."
  mpo_events_tova.0006.t: "Trả Giá"
  mpo_events_tova.0006.desc: "Tin buồn, bệ hạ: Binh sĩ của ngài đã cướp và đốt kho thóc ở [maa_province.GetCounty.GetName]. Họ than đói và buộc tội phản nghịch rằng ngài, bệ hạ, buộc họ ăn trộm và cướp bóc để sống. \n\nMột số trốn vào hoang dã, những ai không trốn đều bị sát hại ngay lập tức bởi những người trung thành với ngài. Đói khiến con người tuyệt vọng, có vẻ vậy."
  mpo_events_tova.0006.a: "Những kẻ bất lương đó!"

  mpo_special_flavor_events.0001.t: "Thảo Nguyên Nước Vô Tận"
  mpo_special_flavor_events.0001.desc: "Ta nghe những câu chuyện về biển. Về vẻ đẹp và sự dữ dội của nó, vượt cả thảo nguyên. Hôm nay, Ta lần đầu tiên nhìn thấy đại dương. \n\nCuối cùng Ta hiểu ánh mắt người kể chuyện khi họ tìm từ ngữ mô tả nước vô tận. Ta ngồi xuống và nhìn ra chân trời, nơi bầu trời trong xanh của Tengri chạm nhẹ vào mặt nước xanh biếc. \n\nTa cảm nhận sương mặn ve nhẹ lên mặt. Nhịp điệu êm đềm của sóng lấp đầy tai Ta. Sự tĩnh lặng của biển khiến lòng Ta choáng ngợp, dù chỉ trong chốc lát."
  mpo_special_flavor_events.0001.a: "Thật uy nghiêm..."
  mpo_special_flavor_events.0001.b: "Ta nghĩ mình sẽ ở lại đây một lúc"

  mpo_events_tova.0025.t: "Bắn Xương Ngón"
  mpo_events_tova.0025.desc: "Ta nghe bài hát quen thuộc của trò chơi và #EMP — RẮC!#! — tiếng xương chạm mục tiêu gỗ, trước khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('challenger_anda'))] [challenger_anda.GetTitledFirstName] tiến đến với ánh mắt thách đấu quen thuộc trong [challenger_anda.GetHerHis] mắt.\n\n'Ngài nghĩ sao? Hãy cùng thi một ván [Glossary( 'shagai', 'SHAGAI_GLOSS')]!'"
  mpo_events_tova.0025.a: "Hãy dùng trí thông minh để đánh bại đối thủ."
  mpo_events_tova.0025.a.tt.success: "Ngài thắng trò chơi nhờ chiến thuật xuất sắc"
  mpo_events_tova.0025.a.tt.failure: "Đầu óc Ngài tỏ ra cùn"
  mpo_events_tova.0025.b: "Ta sẽ nghiền nát xương của đối thủ!"
  mpo_events_tova.0025.b.tt.success: "Ngài thắng trò chơi nhờ sức mạnh"
  mpo_events_tova.0025.b.tt.failure: "Sức mạnh của Ngài tỏ ra yếu ớt"
  mpo_events_tova.0025.c: "Hôm nay thì thôi, ."
  mpo_sharp_wits_modifier: "Đầu Óc Sắc Sảo"
  mpo_sharp_wits_modifier.desc: "Nhân vật này rèn luyện giác quan và trí tuệ qua các chiến thuật trong trò bắn xương ngón."
  mpo_thunder_knuckles_modifier: "Nắm Đấm Sấm Sét"
  mpo_thunder_knuckles_modifier.desc: "Nhân vật này ném xương ngón với lực mạnh như tiếng sấm vang dội."

  mpo_events_tova.0030.t: "Một Thị Giác Thần Thánh"
  mpo_events_tova.0030.desc: "Mặt trời vừa chạm đến chân trời thì [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visionary'))] [visionary.GetTitledFirstName] vội vã đến bên Ta, má đỏ rực và mắt sáng rực. \n\n'[ROOT.Char.GetTitleTierName] của Ta, Ta phải kể cho Ngài nghe một thị giác đến với Ta trong giấc mơ!' [visionary.GetSheHe] kêu lên. 'Ta đã thấy '"
  mpo_events_tova.0030.desc_red: "một con bò đỏ với chuông treo trên sừng, quăng đầu qua lại. Nó gầm lên "
  mpo_events_tova.0030.desc_white: "một con báo trắng nhảy từ mây xuống và khoét sâu vào cát. Nó gầm lên "
  mpo_events_tova.0030.desc_green: "một con gà trống xanh chạy trên tia nắng mặt trời và vỗ cánh. Nó gáy "
  mpo_events_tova.0030.desc_outro: "rằng vĩ nhân [ROOT.Char.GetTitledFirstNameNoTooltip] định mệnh sẽ cai trị cả trời và đất!'"
  mpo_events_tova.0030.a: "Ngài thật sự được ban phước với tài năng đặc biệt!"
  mpo_events_tova.0030.b: "Trời phải ủng hộ Ta và những việc Ta làm."
  mpo_events_tova.0030.c: "Một câu chuyện tuyệt vời."
  mpo_heavens_favor_modifier: "Ân Trên Trời"
  mpo_heavens_favor_modifier.desc: "Nhân vật này được cổ vũ nhờ những thị giác may mắn."
  mpo_heavens_favor_martial_modifier: "$mpo_heavens_favor_modifier$"
  mpo_heavens_favor_martial_modifier.desc: "$mpo_heavens_favor_modifier.desc$"
  mpo_heavens_favor_diplo_modifier: "$mpo_heavens_favor_modifier$"
  mpo_heavens_favor_diplo_modifier.desc: "$mpo_heavens_favor_modifier.desc$"

  mpo_events_tova.0035.t: "Người Đến Từ Núi"
  mpo_events_tova.0035.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('distressed_anda'))] [distressed_anda.GetTitledFirstName] đẩy tấm nỉ sang một bên khi xông vào lều của Ta. Ngực anh ta dâng đầy bực tức. \n\n'Nghe đây!' anh ta hét lên. '[pregnant_woman.GetTitledFirstName] đang mang thai và Ta chắc chắn rằng đứa trẻ không phải của Ta.'\n\n'Khi bị chất vấn, cô ấy kể rằng cô mơ thấy một con gấu từ núi cao xuống, con thú biến thành khói hình người, rồi khói bao phủ bụng cô. Sáng hôm sau, cô ấy cảm nhận được dấu hiệu mang thai đầu tiên.'"
  mpo_events_tova.0035.a: "Hãy vui mừng! Trời đã gửi cho ngài một đứa trẻ."
  mpo_events_tova.0035.a.tt: "Đứa trẻ có thể sinh ra với một kỹ năng đặc biệt."
  mpo_events_tova.0035.b: "Cô ấy chỉ đang cho Ngài ăn những lời dối trá."
  mpo_events_tova.0035.c: "Đây là chuyện hài nhất Ta từng nghe!"

  mpo_events_tova.0045.t: "Một Người Ngài Quý Giá"
  mpo_events_tova.0045.desc: "'[ROOT.Char.GetTitleAsName] của Ta, dù Tình bạn chúng ta cứng cỏi như cổ cừu, Ta muốn tặng Ngài một món quà làm biểu tượng cho lòng trung thành không đổi,' [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_anda'))] [generous_anda.GetTitledFirstName] nói với Ta khi chúng Ta chia sẻ hơi ấm từ đống lửa trại."
  mpo_events_tova.0045.desc_knucklebone: "Anh ấy lấy ra một túi nhỏ, mở ra để lộ một quân [Glossary( 'shagai', 'SHAGAI_GLOSS')] nặng đồng. Sau đó, anh tiếp tục: 'Ta đã thắng nhiều cuộc thi với xương ngón này, và Ta chắc chắn nó sẽ mang lại may mắn cho Ngài.'"
  mpo_events_tova.0045.desc_herd: "Anh ấy chỉ về phía đàn cừu xa xa và tiếp tục: 'Ta mang đến một đàn cừu mà Ta thắng trong trò chơi [Glossary( 'shagai', 'SHAGAI_GLOSS')]. Mong chúng nuôi dưỡng và bảo vệ Ngài cùng gia đình.'"
  mpo_events_tova.0045.desc_axe: "Anh ấy lộ ra một rìu chiến, được đánh bóng kỹ và chắc chắn sắc bén. Sau đó, anh tiếp tục: 'Ta lấy vũ khí này trong trận chiến gần đây khi chúng ta chiến đấu cùng nhau, giành được nó từ tay lạnh của kẻ thù đã ngã.'"
  mpo_events_tova.0045.a: "Cảm ơn vì món quà hào phóng."
  mpo_events_tova.0045.a.equipped_tt: "Nhận [gift.GetName]."
  mpo_events_tova.0045.b: "Tình  Bạn củangài là món quà duy nhất Ta cần."
  gifted_bone_name: "Xương Ngón Nặng Đồng"
  gifted_bone_desc: "Xương ngón cừu được đính đồng, dùng trong trò bắn xương ngón."
  gifted_axe_name: "Rìu Chinh Phục"
  gifted_axe_desc: "Một rìu chiến, cân bằng hoàn hảo."

