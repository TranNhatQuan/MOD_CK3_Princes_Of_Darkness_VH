  mpo_nomad_events.1050.t: "Đồng Cỏ Rộng Hơn"
  mpo_nomad_events.1050.desc: "[herder.GetTitledFirstName], một [herder.GetWomanMan] tồi tàn bốc mùi nước tiểu dê, tự xưng là người trông coi [herder.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] gần đó của [herder_county.GetNameNoTierPossessive].\n\n\"Những người chăn gia súc [ROOT.Char.GetPrimaryTitle.GetAdjective] của ngài phớt lờ những giới hạn truyền thống!\" [herder.GetSheHe] nói. \"Thần di chuyển bầy gia súc đến vùng đất mới, và đất đai thì cằn cỗi! Gió mang theo tiếng cười cợt của các kỵ sĩ của ngài, và âm thanh của những con ngựa béo của họ!\"\n\n\"Chúng ta không thể chia sẻ đất đai một cách công bằng sao, thưa [ROOT.Char.GetTitleAsName]?\""
  mpo_nomad_events.1050.a: "Với Ta, ranh giới truyền thống #EMP chẳng có nghĩa gì#!."
  mpo_nomad_events.1050.b: "'Cho ta mượn lưỡi thật thà và dũng khí của ngươi!'"
  mpo_nomad_events.1050.b.flavor: "Ta sẽ biến tên chăn dê thối nát, ồn ào này thành một kỵ binh đáng kính!"
  mpo_nomad_events.1050.c: "'Ta sẽ hủy diệt những kẻ đã hại ngươi.'"
  mpo_nomad_events.1050.c.flavor: "Có vẻ như đàn của Ta đã vượt ngoài kiểm soát..."
  mpo_nomad_events.1050.d: "'#EMP Chạy đi trước đàn ngựa của ta, chăn dê!#!'"

  mpo_nomad_events.1060.t: "Trao Đổi Với Dê"
  mpo_nomad_events.1060.desc: "Ngay ngoài đồng cỏ của Ta là khu định cư [neighbor_province.GetName], vang tiếng búa, tiếng rên của bánh xe, tiếng xôn xao của đám đông [county_culture.GetName].\n\nChúng Ta đến trao đổi gia súc lấy hàng tinh xảo. Thương nhân bụng mềm nhìn chúng Ta nghi ngờ và sợ hãi.\n\n'Nhìn này, vũ khí làm từ [neighbor.Custom('RegionalWeaponMetal')]! Trang phục [neighbor.Custom('RegionalFabric')] đẹp!' các Ngài đồng hành reo. 'Và tiền kim loại quý!'"
  mpo_nomad_events.1060.a: "Ngươi nghĩ #EMP đồng bạc này#! đáng giá bao nhiêu...?"
  mpo_nomad_events.1060.a.flavor: "Những kẻ định cư yếu ớt này sớm sẽ biết rằng chúng Ta 'man di' không dễ bị lừa..."
  mpo_nomad_events.1060.b: "'Giật hết đi! #EMP Và cưỡi thật nhanh!#!'"
  mpo_nomad_events.1060.b.flavor: "Một [ROOT.Char.Custom('GetDaughterSon')] thực thụ của thảo nguyên không giao dịch với kẻ yếu!"
  mpo_nomad_events.1060.b.success: "Nhóm của Ngài thoát được cùng hàng hóa lấy được"
  mpo_nomad_events.1060.b.failure: "Ngài bỏ lại chiến lợi phẩm để thoát sát nút"
  mpo_nomad_events.1060.c: "'Mang về da thú, sữa chua, ngựa tốt!'"
  mpo_nomad_events.1060.c.flavor: "Trao đổi hàng hóa với các khu định cư [neighbor.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] chỉ đem lại lợi ích cho chúng Ta."

  nomad_trading_mastery_modifier: "Bậc Thầy Giao Dịch"
  nomad_trading_mastery_modifier_desc: "Du mục này hiểu rõ giá trị thực của tiền và hàng xa xỉ. Có thể còn hơn cả những người bán chúng."

  nomad_trading_partners_modifier: "Thỏa Thuận Thương Mại Định Cư"
  nomad_trading_partners_modifier_desc: "Du mục này tích cực trao đổi sản phẩm chăn nuôi lấy công cụ, hàng xa xỉ và tiền."

  mpo_nomad_events.1070.t: "Lạc Giữa Đêm"
  mpo_nomad_events.1070.desc_intro: "Ta thức dậy, miệng còn mùi hơi ngựa.\n\n"
  mpo_nomad_events.1070.desc_has_horse: "Khi ngựa [ROOT.Char.Custom('WarhorseStoryName')] của Ta"
  mpo_nomad_events.1070.desc_new_horse: "Khi một con ngựa lạ"
  mpo_nomad_events.1070.desc: "cọ vào Ta, gió rít qua [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]. Chúng Ta hai người cô độc giữa hoang dã.\n\nTâm trí Ta như viên đá nhẵn — chuyện gì #EMP đã xảy ra#! giữa hoàng hôn hôm qua và sáng sớm lạnh lẽo này? Dân chúng Ta... đã bỏ rơi Ta sao? Không! Ký ức quay về,"
  mpo_nomad_events.1070.desc_spiritual: "mang theo thì thầm của linh hồn, kể về trạng thái thần thánh khiến Ta rời giường, dẫn Ta đến một con ngựa cô đơn dưới ánh trăng..."
  mpo_nomad_events.1070.desc_mental_thing: "rống lên lời nguyền điên dại giữa đêm: dù gia tộc cố xoa dịu, Ta không thể ở giữa họ. Ta bước vào đêm cùng con ngựa lặng yên này..."
  mpo_nomad_events.1070.desc_new_drunk: "mang theo những bát [Glossary( 'kumis', 'KUMIS_GLOSS')] đầy ắp, tiếng móng ngựa, và cảm giác một bờm tóc tối màu ép vào má ta..."
  mpo_nomad_events.1070.a: "Ngươi là thú trung thành, phải không?"
  begin_warhorse_story_tt: "Con ngựa này trở thành yêu thích của Ngài"
  mpo_nomad_events.1070.b: "Không bao giờ nữa! Ta thề, ngựa à: #EMP không bao giờ nữa!#!"
  mpo_nomad_events.1070.c: "[ROOT.Char.GetFaith.HighGodNamePossessive] đã dẫn Ta tới nơi linh thiêng này."
  mpo_nomad_events.1070.c.flavor: "Ta không cần hoảng loạn. Có những lực lượng tự nhiên ở đây mà Ta là Ngài, và chúng sẽ dẫn Ta về nhà."
  mpo_nomad_events.1070.d: "Về nhà! Du mục không bao giờ lạc đường."
  mpo_nomad_events.1070.d.flavor: "Ngay cả khi hộp sọ đau nhức tới mức [ROOT.Char.GetSheHe] gần như không thể nhìn..."
  mpo_nomad_events.1070.d.success: "Ngài lần theo dấu vết ngựa"
  mpo_nomad_events.1070.d.failure: "Ngài không tìm thấy nhà trước khi đêm về"
  mpo_nomad_events.1070.e: "Chắc chắn, ngựa à, ngươi nhớ đường về..."

  nomad_alone_in_adversity_modifier: "Tin Tưởng Vào Ngựa"
  nomad_alone_in_adversity_modifier_desc: "Khi gặp tình huống tồi tệ, du mục này tin tưởng vào bản năng sinh tồn và tốc độ của ngựa hơn bất cứ điều gì."
