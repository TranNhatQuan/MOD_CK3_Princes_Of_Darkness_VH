l_english:

  mpo_nomad_events.1000.t: "Một Đầu Được Giải Cứu"
  mpo_nomad_events.1000.army_camp: "Những người sống sót sau trận chiến đẫm máu tại [beheaded_warrior_location.GetName] gia nhập đội quân của Ta, quất roi lên ngựa đến hơi thở cuối cùng. Từ dây yên của một người, một cái đầu chảy máu đung đưa — mang khuôn mặt tử thần của"
  mpo_nomad_events.1000.capital: "Những người sống sót sau trận chiến đẫm máu tại [beheaded_warrior_location.GetName] gửi tin từ chiến trường, kèm theo... cái đầu đang nhỏ máu của"
  mpo_nomad_events.1000.family: "[beheaded_warrior.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beheaded_warrior'))] của Ta."
  mpo_nomad_events.1000.vassal: "[beheaded_warrior.GetName], thuộc hạ từng hùng mạnh của Ta."
  mpo_nomad_events.1000.councillor: "[beheaded_warrior.GetName], cố vấn tin cậy của Ta."
  mpo_nomad_events.1000.generic_knight: "[beheaded_warrior.GetName], [ROOT.Char.Custom('KnightCultureNoTooltip')|l] đáng kính của Ta."
  mpo_nomad_events.1000.desc: "\n\n\"[beheaded_warrior.GetSheHe|U] đã chết như một chiến binh, chiến đấu vào tận trung tâm của băng đảng chiến tranh [beheaded_warrior_foe.GetTitledFirstNamePossessive] cho đến khi cái đầu của [beheaded_warrior.GetHerHis] bị chặt khỏi vai [beheaded_warrior.GetHerHis]! Vì tình yêu dành cho [beheaded_warrior.GetHerHim], các kỵ sĩ của chúng ta đã thu hồi những gì có thể.\"\n\nMột cái kết tàn khốc... nhưng các bô lão thông thái của chúng ta nói rằng cái đầu của một chiến binh cao quý vẫn giữ lại được một phần sinh lực và vận mệnh của [beheaded_warrior.GetHerHis]."
  mpo_nomad_events.1000.a: "Ta sẽ tôn vinh cái đầu vĩ đại của [beheaded_warrior.GetWomanMan]."
  mpo_nomad_events.1000.a.flavor: "[beheaded_warrior.GetTitledFirstNameNoTooltip] sẽ được đặt trên một tấm thảm nỉ trắng, nơi gia đình ta sẽ tặng cho [beheaded_warrior.GetHerHim] những thức uống nghi lễ và thực hiện các nghi thức."
  mpo_nomad_events.1000.b: "[beheaded_warrior.GetFirstNameNoTooltip] thuộc về dân tộc của [beheaded_warrior.GetHerHis]."
  mpo_nomad_events.1000.c: "Hãy để [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] tôn kính đồng đội đã ngã xuống."
  mpo_nomad_events.1000.d: "Chôn [beheaded_warrior.GetFirstNameNoTooltip] xuống đất."

  mpo_warriors_grave_modifier: "Mộ Chiến Binh Bị Chém"
  mpo_warriors_grave_modifier_desc: "Cái đầu bị chém khỏi cơ thể trong trận chiến, méo mó với tiếng thét chiến tranh, được chôn trong đất này. Mộ này thường được gia đình những người đã ra trận đến thăm."

  mpo_noble_warriors_grave_modifier: "Mộ Quý Tộc Bị Chém"
  mpo_noble_warriors_grave_modifier_desc: "Cái đầu của một nhân vật quý tộc uy danh, bị chém trong trận chiến, được chôn trong đất này. Mộ là nơi linh thiêng, nổi tiếng và thường được viếng thăm."
  custom.every_beheaded_family: "Mỗi [close_family_member|E] của [beheaded_warrior.GetShortUIName]"

  warriors_head_artifact: "[beheaded_warrior.GetTitledFirstNamePossessiveNoTooltip|U] Đầu Được Tôn Kính"
  kin_head_artifact_desc: "Khuôn mặt mục rữa, không thể nhận ra của [beheaded_warrior.GetFirstName], người con được yêu mến của Nhà [beheaded_warrior.GetHouse.GetName], bị lực lượng [beheaded_warrior_foe.GetNamePossessive] giết tại [beheaded_warrior_location.GetName]."
  accolade_head_artifact_desc: "Xác đầu kinh khủng của [beheaded_warrior.GetFirstName], một [ROOT.Char.Custom('KnightCultureNoTooltip')|l] nổi tiếng được gọi là '[beheaded_warrior_accolade.GetName].' Các chiến binh của [beheaded_warrior_foe.GetNamePossessive|U] nhận công hạ gục [beheaded_warrior.GetHerHim] trên chiến trường [beheaded_warrior_location.GetName]."
  warriors_head_artifact_desc: "Cái đầu bị chém của chiến binh dũng cảm [ROOT.Char.Custom('KnightCultureNoTooltip')|l] [beheaded_warrior.GetFirstName], ngã xuống khi chiến đấu với đội quân [beheaded_warrior_foe.GetNamePossessive] tại [beheaded_warrior_location.GetName]. Được các đồng đội tôn kính, mặc dù mùi hôi khó chịu."
  keep_warrior_head_tt: "Ngài giữ [head_artifact.GetName]"

  gain_illustrious_victim_head_artifact_tt: "Có thể giữ đầu [victim.GetFirstNamePossessive] làm $illustrious$ [inventory_artifact|E]"
  gain_famed_victim_head_artifact_tt: "Có thể giữ đầu [victim.GetFirstNamePossessive] làm $famed$ [inventory_artifact|E]"
  send_head_for_warscore_tt: "Gửi đầu [victim.GetFirstNamePossessive] cho [victim.GetHerHis] [heir|E] có thể tăng [peace|E] Acceptance đối với #high Ngài#!"
  send_head_for_vassalization_tt: "Gửi đầu [victim.GetFirstNamePossessive] cho [victim.GetHerHis] [heir|E] có thể tăng [vassalization|E] Acceptance"
  send_head_for_hook_tt: "Gửi đầu [victim.GetFirstNamePossessive] cho [victim.GetHerHis] [heir|E] có thể cung cấp [weak_hook|E]"
  send_head_for_prestige_tt: "Có thể nhận [prestige|E] bằng cách gửi đầu [victim.GetFirstNamePossessive] cho [victim.GetHerHis] [heir|E]"
  send_head_for_obedience_tt: "Gửi đầu [victim.GetFirstNamePossessive] cho [victim.GetHerHis] [heir|E] có thể khiến họ [obedient|E]"
  headless_heir_rises_to_challenge_tt: "#N Nếu Người Nhận dám thề trả thù:#!"

  mpo_nomad_events.1011.t: "Chém Đầu"
  mpo_nomad_events.1011.desc_execution_spite: "[victim.GetName] phun lời nguyền và, khi lưỡi kiếm chặt đầu [victim.GetHerHis], vẫn nhìn trừng trừng về phía Ta."
  mpo_nomad_events.1011.desc_execution_beg: "[victim.GetName] lắp bắp và cầu xin mạng sống của [victim.GetHerHis]. Sau đó, với một đòn mạnh, cái đầu của [victim.GetHerHis] bị chặt lìa khỏi vai [victim.GetHerHis]."
  mpo_nomad_events.1011.desc_execution_pray: "Vẫn lẩm bẩm những lời cầu nguyện, [victim.GetName] bị buộc phải quỳ xuống đầu gối của [victim.GetHerHis]. Sau đó, một đòn mạnh duy nhất tách cái đầu của [victim.GetHerHis] khỏi vai [victim.GetHerHis]."
  mpo_nomad_events.1011.desc_bad_execution: "Không phải bằng một đòn gọn gàng duy nhất, mà là với nhiều nhát chém thô bạo, cái đầu của [victim.GetNamePossessive] bị chặt lìa khỏi cơ thể khốn khổ của [victim.GetHerHis]."
  mpo_nomad_events.1011.desc: "\n\nTa nhìn thẳng vào mắt [victim.GetCulture.GetName] khi họ quay cuồng lần cuối, máu [victim.GetHerHis] thấm vào đất."
  mpo_nomad_events.1011.desc_send_head: "\n\nNếu người kế vị [victim.GetFirstNamePossessiveNoTooltip], [headless_heir.GetTitledFirstName], chứng kiến cảnh tượng tăm tối này — [headless_heir.GetSheHe] có thể học cách sợ quyền lực và ý chí sói của Ta..."
  mpo_nomad_events.1011.desc_cant_send: "[victim.GetFirtNameNoTooltip] chỉ còn là miếng thịt bỏ đi, bữa ăn cho kền kền..."
  mpo_nomad_events.1011.desc_keep_head: "\n\n...hoặc có lẽ cái đầu nổi tiếng này thuộc về [ROOT.Char.GetSheHe] đã lấy nó."
  mpo_nomad_events.1011.a: "Đừng để ai quên [victim.GetTitleAsNameNoTooltip] bị chém đầu này."
  mpo_nomad_events.1011.a.flavor: "Và chính #EMP Ta#! đã kết thúc mạng sống huy hoàng của [victim.GetHerHis]!"
  mpo_nomad_events.1011.b: "Gửi 'món quà' này cho [headless_heir.GetTitledFirstNameNoTooltip]."
  mpo_nomad_events.1011.b.success: "Sự nhẫn tâm của Ngài khiến [headless_heir.GetTitledFirstNameNoTooltip] phải khiếp sợ"
  mpo_nomad_events.1011.b.fail: "[headless_heir.GetTitledFirstNameNoTooltip] thề trả thù táo bạo"
  mpo_nomad_events.1011.b.flavor: "Chủ mới của [victim.GetPrimaryTitle.GetNameNoTierNoTooltip] phải biết số phận duy nhất dành cho kẻ thù Ta! #EMP [headless_heir.GetSheHe|U] sẽ nhìn thẳng vào điều đó!#!"
  mpo_nomad_events.1011.c: "Bỏ [victim.GetFirstNameNoTooltip] cho kền kền."
  headless_heir_high_tier_warning_tt: "@alert_icon! #alert_trial Cảnh báo: [headless_heir.GetShortUIName] không sợ Ngài!#!"
  headless_heir_ignores_challenge_tt: "#P Nếu Người Nhận co rúm trước sự xúc phạm này:#!"

  mpo_nomad_events.1012.t: "[victim.GetTitleAsNameNoTooltip] Trở Về"
  mpo_nomad_events.1012.desc: "Ta cho phép máu cũ nhỏ xuống giày, nắm lấy da lạnh trong tay — vì đầu lìa khỏi thân [victim.GetName] đã được trả về cho Ta.\n\n'Một sự sỉ nhục! Một nỗi nhục!' vang lên trong tai Ta, trẻ con khóc. [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] của Ta lắc kiếm và thề trả thù.\n\nNhưng liệu cái đầu hỏng này có chỉ nhằm gieo nỗi sợ trong tim Ta? Hay... [executioner.GetTitledFirstName] khao khát hận thù của Ta?"
  mpo_nomad_events.1012.a: "Tôn vinh phần còn lại của [victim.GetFirstNamePossessiveNoTooltip] là quan trọng nhất."
  mpo_nomad_events.1012.a_flavor: "'Sự xúc phạm' này cho phép chúng ta rửa sạch, trang trí, và dâng lời cầu nguyện trước đầu quý tộc [victim.GetTitledFirstNamePossessiveNoTooltip]."
  mpo_nomad_events.1012.b: "#EMP Sự sỉ nhục này sẽ được báo thù!#!"
  mpo_nomad_events.1012.b_flavor: "Ta được gửi khuôn mặt đẫm máu của chiến tranh. Tiếng gọi tử thần của [victim.GetFirstName] yêu cầu máu [executioner.GetTitledFirstNamePossessive]!"
  mpo_nomad_events.1012.c: "Ta phải nhượng bộ, nếu không sẽ phải đối mặt số phận này..."

  peace_acceptance_head_scare_tt: "[headless_heir.GetShortUINamePossessive] [peace|E] Acceptance đối với #high Ngài#!: #P +30#! trong #high 20 năm#!"
  COWED_BY_SEVERED_HEAD_MODIFIER: "Sợ hãi vì tiền nhiệm bị chém đầu: $VALUE|+=0$"
  severed_head_revenge_modifier: "Tìm kiếm trả thù vì tiền nhiệm bị chém đầu: $VALUE|+=0$"
  severed_head_cb_revenge_tt: "[casus_belli|E] chi phí chống lại #high [executioner.GetShortUIName]#!: #P -75%#!"
  severed_head_vassalization_tt: "[headless_heir.GetShortUINamePossessive|U] [offer_vassalization|E] $ep3_laamps.0010.connector$ #high $demand_tributary_interaction$#! Acceptance đối với [executioner.GetShortUIName]: #P +200#! trong #high 20 năm#!"

  mpo_nomad_events.1013: "Xóa Bạn [victim.GetTitledFirstNameNoTooltip],"
  mpo_nomad_events.1013.desc_takes_it_sedentary: "Một mối đe dọa tàn nhẫn xuất hiện tại [headless_heir.Custom('ResidenceBuilding')|l] — đầu bị chặt của một quý tộc, tổ tiên Ta.\n\nXin hãy, lãnh chúa ngựa! Ở [headless_heir.GetPrimaryTitle.GetNameNoTier], chúng Ta hiếm khi gặp những cảnh kinh hoàng như vậy và không ưa chúng. Ta thà đối xử hòa nhã với Ngài hơn là bị hạ nhục như vậy."
  mpo_nomad_events.1013.desc_takes_it: "[victim.GetHerHis|U] [victim.GetCulture.GetCollectiveNoun] hy vọng được nhìn thấy [victim.GetHerHim] một lần nữa. Nay, [victim.GetHerHis] đầu ngồi trong máu, trái tim họ đen tối trước cảnh tượng dị thường.\n\nXin hãy để [victim.GetFirstName] yên trong [headless_heir.GetFaith.PositiveAfterLife]. Xin miễn chúng Ta khỏi cơn thịnh nộ của Ngài!"
  mpo_nomad_events.1013.desc_angeee: "Bằng cách gửi đầu [victim.GetPrimaryTitle.GetNameNoTierPossessive], Ngài đã gửi cho Ta khuôn mặt đẫm máu của chiến tranh; Ngài đã gửi đôi môi xám vẫn kêu gào báo thù.\n\nTa sẽ nhìn thấy thân thể sống của Ngài mục rữa. Ta sẽ hạ gục Ngài như cây già.\n\nTa sẽ đặt đầu [victim.GetFirstNamePossessive] giữa xương Ngài."
  mpo_nomad_events.1013.a.cowed: "Như con cừu, [headless_heir.GetTitleAsNameNoTooltip] kêu rên và khóc lóc!"
  mpo_nomad_events.1013.a.revenge: "Và vì thế... [headless_heir.GetFirstNameNoTooltip] thề trả thù."

  executed_head_artifact: "[victim.GetTitledFirstNamePossessiveNoTooltip|U] Đầu Quyền Năng"
  executed_head_emperor_artifact_desc: "Vẫn đội vương miện, đôi môi xám và lông mày trộn tóc ngựa tạo thành biểu cảm uy nghi, đầu bị chặt của [victim.GetTitleAsNameNoTooltip] của [victim.GetPrimaryTitle.GetNameNoTier] khơi dậy nỗi kinh sợ.\n\nNếu một chủ quyền mạnh mẽ như vậy có thể gặp số phận kinh khủng này, thì bao nhiêu nỗi kinh hoàng đang chờ tất cả kẻ khác?"
  executed_head_king_artifact_desc: "Phần còn lại cuối cùng của [victim.GetName], được bảo quản và trang trí phù hợp với đẳng cấp của [victim.GetHerHis] lúc sống. Một minh chứng cho ý chí tàn nhẫn của người giữ nó."
  nomad_defected_invite_desc: "Ngài đã trục xuất nhân vật này trong 5 năm gần đây"
  nomad_defector_wont_come_back_tt: "Ngài không thể sử dụng #high Mời Vào Triều#! với [rowdy_boy.GetShortUIName] trong #high 5 năm#!"
  nomad_defector_family_tt: "[rowdy_boy.GetShortUINamePossessive] các thành viên trong gia đình rời khỏi triều Ngài"
  nomad_defector_family_wont_come_back_tt: "Ngài không thể sử dụng #high Mời Vào Triều#! với những người bị trục xuất này trong #high 5 năm#!"
  nomad_defector_gain_all_courtiers_tt: "Nhận một số [courtiers|E] thất nghiệp của Ngài"




  mpo_nomad_events.1020.t: "Người Thèm Khát Nhất Trong Bầy"
  mpo_nomad_events.1020.desc: "[rowdy_boy.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))] của ta gần đây trở nên bồn chồn.\n\n\"Gặm xương trong bữa ăn của ngài! Húp sữa chua chua dưới bóng lều của ngài! Đó có phải là cuộc sống của #EMP ta#! không?\" [rowdy_boy.GetSheHe] phun ra. \"Ta đã sẵn sàng để lãnh đạo, [rowdy_boy.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))]! Và có những người trong số đám đông [ROOT.Char.GetDomicile.GetCulture.GetName] của ngài sẽ theo ta.\"\n\nChiến binh kiêu hãnh thuộc [rowdy_boy.GetHouse.GetName] mà ta giữ như một thú cưng bất lực... đang nhe nanh [rowdy_boy.GetHerHis] ra."

  mpo_nomad_events.1020.a: "'Im đi, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))]. Biết vị trí của ngươi.'"
  mpo_nomad_events.1020.b: "\"Không ai có thể thách thức ta mà #EMP còn sống!#!\""
  mpo_nomad_events.1020_duel_tt: "#V Đấu tay đôi#! [rowdy_boy.GetFirstName].\n@death_icon! #X Trận đấu này quyết tử!#!\nNếu Ngài thắng, Ngài sẽ nhận @skill_prowess_icon![prowess|E], @dread_icon![dread|E], @prestige_icon![prestige|E] và @stress_icon![stress|E]. Nếu thua, [rowdy_boy.GetShortUIName] sẽ tiếp quản [titles|E] của Ngài như [primary_heir|E].\n\n[prowess|E] của Ngài: [prowess_i]#V [root_scope.GetProwess]#!\n[prowess|E] của [rowdy_boy.GetFirstNamePossessive]: [prowess_i]#V [rowdy_boy.GetProwess]#!"
  mpo_nomad_events.1020.c: "'Ta có đồng cỏ dư thừa.'"
  mpo_nomad_events.1020.c.flavor: "Hãy để kẻ nổi loạn sở hữu đàn gia súc của [rowdy_boy.GetHerHis]... dưới sự kiểm soát của Ta."
  mpo_nomad_events.1020.d: "'Cưỡi xa và làm rạng danh tên ngươi!'"
  mpo_nomad_events.1020.d.flavor: "[rowdy_boy.GetFirstNameNoTooltip] sẽ có mọi thứ [rowdy_boy.GetSheHe] cần để xây dựng [rowdy_boy.GetHerselfHimself]."
  mpo_nomad_events.1020.e: "'Ngươi sẽ không ở lại sao, nếu [rowdy_boy.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] mong muốn?'"
  mpo_nomad_events.1020.e.success: "[rowdy_boy.GetFirstNameNoTooltip] đồng ý ở lại và phục vụ"
  mpo_nomad_events.1020.e.failure: "[rowdy_boy.GetFirstNameNoTooltip] và những người ủng hộ [rowdy_boy.GetHerHis] lặng lẽ rút đi"
  mpo_nomad_events.1020.f: "'Ngươi bị trục xuất, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))]! Biến đi!'"
  mpo_nomad_events.1020.f.flavor: "Con đường hoang dã và tự do đang chờ đón!"

  attacked_family_opinion: "Tấn công thành viên gia đình Ta"

  mpo_nomad_events.1022.t: "Cái Chết Của Kẻ Nổi Loạn"
  mpo_nomad_events.1022.desc: "Như con báo nhảy liều mạng từ vách đá, như chim ưng lao xuống bóng của chính nó, như lạc đà đực cắn gót con non... Ta đã bị cơn thịnh nộ nuốt chửng.\n\nKết thúc trận đấu danh dự, [rowdy_boy.GetFirstName] – [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))] của Ta – đã chết.\n\nKhi tiếng trống giận dữ của Ta dịu xuống, Ta bắt đầu nghe âm thanh than khóc. Dân chúng Ta khóc trước minh chứng quyền lực của Ta."
  mpo_nomad_events.1022.a: "Ta đã làm những gì một [ROOT.Char.GetTitleAsNameNoTooltip] phải làm."

  mpo_quelled_family_dissent_modifier: "Đã Giết Người Gia Tộc Nổi Loạn"
  mpo_quelled_family_dissent_modifier_desc: "Một thành viên gia đình từng thách thức quyền lực đáng sợ của nhân vật này... không sống sót lâu."

  mpo_nomad_events.1030.t: "Giáo Dục Ba Trò Chơi"
  mpo_nomad_events.1030.desc: "Khi Ta cân nhắc kỹ năng chiến binh của [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] được đưa đến.\n\n'[child.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|U],' đứa trẻ hỏi, 'trong ba trò chơi, trò nào là quan trọng nhất?'"
  mpo_nomad_events.1030.desc_mongolic: "[Glossary( 'nadaam', 'NADAAM_GLOSS')]?"\n\n[child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta, có thể cam kết [child.GetHerselfHimself] với bài kiểm tra tàn bạo của [Glossary( 'bökh', 'BOKH_GLOSS')],"
  mpo_nomad_events.1030.desc_non_mongolic: "các môn thể thao lớn?\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của Ta có thể hứa [child.GetHerselfHimself] với thử thách khốc liệt của vật tay,"
  mpo_nomad_events.1030.desc.outro: "nghệ thuật tinh tế của cung... hoặc có lẽ [child.GetSheHe] nên làm chủ kỹ năng cưỡi ngựa, điều khiển đàn gia súc và đưa những kỵ binh về nhà nhanh chóng?"

  NADAAM_GLOSS: "Các #bold Erin Gurban Naadam#! hay 'ba trò chơi nam tính' là môn thể thao chính của người Mông cổ từ thời Đồ Đá Mới, và là trung tâm của lễ hội và các cuộc thi. Bao gồm: bắn cung composite, vật tay, và đua ngựa đường dài."
  BOKH_GLOSS: "Phong cách vật tay cổ truyền của Mông cổ, mục tiêu chính là kéo đối thủ ngã xuống đất. Một số kiểu cho phép nắm và đá chân, nhưng chủ yếu là thử thách sức mạnh và sự bất động, có thể kéo dài hàng giờ."

  mpo_nomad_events.1030.a: "Để Ta luyện tập một mình!"
  mpo_nomad_events.1030.a.flavor: "Cố gắng tới mức thở hổn hển và đau nhức là tất cả những gì quan trọng!"
  mpo_nomad_events.1030.b: "Chứng tỏ ngươi vững như núi."
  mpo_nomad_events.1030.c: "Ngươi sẽ được bữa tối nhờ mũi tên của mình."
  mpo_nomad_events.1030.c.flavor: "Một con chuột marmot khôn ngoan hơn bất kỳ mục tiêu nào trong tầm bắn... nhưng ít ra nó là mục tiêu lớn hơn."
  mpo_nomad_events.1030.d: "Hãy chiếm được lòng tin của ngựa, [child.Custom('GirlBoy')]."
  mpo_nomad_events.1030.d.flavor: "Và trên lưng ngựa vâng lời, ngươi có thể hò reo và tham gia vào các cuộc đua dài."


