  capital_county_not_in_steppe_tt: "[capital|E] của Ngài không nằm trong [the_great_steppe|E]"
  higher_prestige_cost_because_pagan_tt: "@warning_icon! #X @prestige_icon![prestige|E] tăng gấp bốn vì [faith|E] của Ngài là [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName]"

  nomad_domicile_buildings_converted: "[former_nomad.GetShortUINamePossessive|U] [domicile|E] [buildings|E] được đổi thành [gold_i][gold|E]"

  nomad_settling_gain_kingdom_counties_tt: "Bị [revoked|E], nếu do [vassal|E] [culture|E] khác nắm giữ"

  mpo_nomad_events.1040.t: "Một Ngôi Nhà Bên Ngoài Thảo Nguyên"
  mpo_nomad_events.1040.desc_duchy: "#EMP Out, [defender.GetTitledFirstName]!#! Away with the craven, away with the defeated [defender.Custom('MistressMaster')] of this place! A new [ROOT.Char.GetTitleAsName] rules [defender.GetHerHis] soft [expelled_culture.GetCollectiveNoun] now. They will learn to please [ROOT.Char.GetHerHim], or they will find this to be only the dawn of their subjugation!\n\n[target.GetBaseNameNoTier] will be a fine home to my people. No longer are we blown like dust across the plains! Here, settled lives are ours, and the labors of the locals serve our comforts.\n\nIn [ROOT.Char.GetCapitalLocation.GetName], in the opulent [ROOT.Char.Custom('ResidenceBuilding')] that rules over its [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l], my war-weary body will rest... as my mind begins to ponder"
  mpo_nomad_events.1040.desc: "#EMP Cút ra, [defender.GetTitledFirstName]! Cút đi, [expelled_culture.GetCollectiveNoun]!#! Với những đứa con béo tròn trên vai, với của cải của các ngươi vương vãi phía sau, hãy chạy trốn khỏi kỵ sĩ [ROOT.Char.GetCulture.GetName] và những mũi tên của [dummy_soldier.GetHerHis]!\n\n[target.GetBaseNameNoTier] đã được để lại cho người dân của ta. Chúng ta không còn bị thổi bay như bụi trên bình nguyên nữa! Ở đây, cuộc sống định cư là của chúng ta: lao động của người dân địa phương còn lại và những thường dân của chính chúng ta phục vụ cho sự tiện nghi của chúng ta.\n\nTại [ROOT.Char.GetCapitalLocation.GetName], trong căn [ROOT.Char.Custom('ResidenceBuilding')] xa hoa cai trị [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] của nó, cơ thể mệt mỏi vì chiến tranh của ta sẽ nghỉ ngơi... khi tâm trí ta bắt đầu suy ngẫm"
  mpo_nomad_events.1040.desc_tribal: "nơi một [ROOT.Char.GetTitleAsNameNoTooltip] định cư tìm thấy sức mạnh."
  mpo_nomad_events.1040.desc_clan: "một dòng họ quý tộc [ROOT.Char.GetTitleAsNamePossessiveNoTooltip], với nhiều thuế của [ROOT.Char.GetHerHis]."
  mpo_nomad_events.1040.desc_feudal: "theo luật lệ của một [ROOT.Char.GetTitleAsNameNoTooltip] phong kiến."

  mpo_nomad_events.1040.a: "Ở đây chấm dứt cuộc lang thang của dân chúng Ta."

