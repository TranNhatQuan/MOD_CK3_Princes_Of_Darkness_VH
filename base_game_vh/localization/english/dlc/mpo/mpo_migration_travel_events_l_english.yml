l_english:
  mpo_migration_travel_events.0001.t: "[ruler.GetFirstNamePossessiveNoTooltip] 'Món Quà'"
  mpo_migration_travel_events.0001.desc: "Một [messenger.GetWomanMan] chăn cừu tiến tới, nói: \"Chào ngài, [ROOT.Char.GetTitledFirstNameNoTooltip].\"\n\n\"[ruler.GetTitleAsNameNoTooltip] của Ta, [ruler.GetFirstName], và Ta đã chứng kiến đàn thú của ngài ngày càng giảm. Xin nhận lấy một đàn nhỏ làm quà tặng. Tất cả [ruler.GetTitleAsNameNoTooltip] mong muốn chỉ là một ân huệ nhỏ đáp lại.\""
  mpo_migration_travel_events.0001.a: "Ta khiêm tốn nhận món quà của [ruler.GetHerHis]."
  mpo_migration_travel_events.0001.b: "Hãy nói với [ruler.GetFirstNameNoTooltip] rằng Ta không quan tâm."

  mpo_migration_travel_events.0010.t: "Đàn Thú Khống Chế"
  mpo_migration_travel_events.0010.desc: "\"[ROOT.Char.GetTitleAsNameNoTooltip], ngài không thể nào dám đưa cả một đàn gia súc khổng lồ như vậy băng qua thảo nguyên!\" [messenger.GetFirstName] thốt lên. \"Những người chăn gia súc của chúng ta đã phải chật vật quá lâu rồi, chắc chắn ngài không cần nhiều đến thế đâu!\"\n\n[messenger.GetFirstNameNoTooltip] lấy lại bình tĩnh. \"Thay vào đó, thần khẩn cầu ngài hãy ban một số con vật của ngài cho một trong những thần dân, nếu chỉ để giảm bớt căng thẳng cho đàn gia súc của chúng ta. [vassal_1.GetTitledFirstName] phục vụ ngài rất tốt, nhưng [vassal_2.GetTitledFirstName] có lẽ sẽ trân trọng cử chỉ đó từ vị cai trị mới của [vassal_2.GetHerHis].\""
  mpo_migration_travel_events.0010.a: "[vassal_1.GetFirstNameNoTooltip] có thể nhận một ít làm quà chia tay."
  mpo_migration_travel_events.0010.b: "Đầu tư vào đất đai của [vassal_2.GetFirstNamePossessiveNoTooltip] thay vì vậy."
  mpo_migration_travel_events.0010.c: "Bỏ lại những con thú thừa."
  mpo_migration_travel_events.0010.d: "Đây là đàn của Ta, và Ta sẽ mang theo."
  no_longer_herd_limit_tt: "Ngài không còn vượt quá giới hạn [herd|E] của mình."
  nomad_keep_herd_modifier: "Đàn Thú Ổn Định"
  nomad_keep_herd_modifier_desc: "Đàn thú của nhân vật này đã lớn, và sẽ khó phát triển cùng tốc độ cũ."

  mpo_migration_travel_events.0020.t: "Vùng Đất Cằn Cỗi"
  mpo_migration_travel_events.0020.desc: "Khi đàn thú di chuyển, trinh sát mang tin lo lắng. Cỏ ở [target_title.GetNameNoTier], nơi chúng ta định định cư, thưa thớt và vùng đất gần như không thể sống."
  mpo_migration_travel_events.0020.a: "Dù sao, [target_title.GetNameNoTierNoTooltip] sẽ là nhà của chúng ta."
  mpo_migration_travel_events.0020.b: "Quay lại! Chúng ta không thể sống ở đó!"
  mpo_migration_travel_events.0020.c: "Giảm số lượng chúng có thể giúp chúng ta tồn tại."
  mpo_migration_travel_events.0020.d: "[ROOT.Char.GetFaith.FertilityGodName], xin hãy giúp chúng Ta!"
  mpo_migration_travel_events.0020.d_tt: "Ngài nhờ [astrologer.GetFirstName] cầu nguyện cho sự màu mỡ."
  mpo_migration_travel_events.0020.win: "Lời cầu nguyện của [astrologer.GetFirstNamePossessiveNoTooltip] đã được đáp lại!"
  mpo_migration_travel_events.0020.lose: "Lời nói của [astrologer.GetFirstNamePossessiveNoTooltip] tỏ ra vô hiệu"

  mpo_migration_travel_events.0030.t: "$travel_danger_prefix$ Dịch Bệnh Trong Đàn"
  mpo_migration_travel_events.0030.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('messenger'))|l] của ta cưỡi một con ngựa ốm yếu tiến về phía ta, khuôn mặt [messenger.GetHerHis] nhăn nhúm vì lo lắng.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], đàn gia súc của chúng ta đã đổ bệnh. Lũ vật nuôi đang chết dần, và bệnh dịch lan rộng theo từng ngày. Xin hãy giúp chúng thần, nếu không chúng thần sẽ chẳng còn gì nữa!\" [messenger.GetFirstName] khẩn cầu.\n\nKhi ta đón nhận lời thỉnh cầu của [messenger.GetHerHis], ta nhìn thấy những con vật ốm yếu ở đằng xa, và dõi theo cách con ngựa của [messenger.GetFirstNamePossessiveNoTooltip] khịt mũi một cách bất thường."
  mpo_migration_travel_events.0030.a: "Giết những thú ốm để ngăn lây lan."
  mpo_migration_travel_events.0030.b: "Có thể một người chăn cừu địa phương biết về căn bệnh này."
  mpo_migration_travel_events.0030.b_good: "Phương pháp của người chăn cừu rất hiệu quả"
  mpo_migration_travel_events.0030.b_bad: "Phương pháp của người chăn cừu hầu như không giúp gì"
  mpo_migration_travel_events.0030.c: "Chúng ta phải chờ tự nhiên xử lý."
  mpo_migration_travel_events.0030.c_none: "Dịch bệnh được kiểm soát"
  mpo_migration_travel_events.0030.c_medium: "Dịch bệnh qua đi với ít tổn thất"
  mpo_migration_travel_events.0030.c_massive: "Dịch bệnh tàn phá đàn"
  mpo_migration_travel_events.0030.c_major: "Đàn suy yếu vì dịch"

  nomad_weak_herd_modifier: "Đàn Thú Yếu"
  nomad_weak_herd_modifier_desc: "Đàn thú của nhân vật bị yếu đi vì bệnh."
  nomad_slow_horses_modifier: "Ngựa Chậm"

  mpo_migration_travel_events.0040.t: "Dòng Sông Dữ"
  mpo_migration_travel_events.0040.desc: "Một dòng nước làm ngựa Ta giật mình khi đến gần sông ở [county.GetNameNoTier]. Nước dường như quá cao để băng qua, những con nhỏ nhất có thể bị cuốn đi.\n\nKhông có đường dễ dàng, và đàn bắt đầu bồn chồn."
  mpo_migration_travel_events.0040.a: "Chúng ta sẽ vượt sông bằng sức mình!"
  mpo_migration_travel_events.0040.a_tt: "Ngài dẫn đàn qua sông"
  mpo_migration_travel_events.0040.win: "Đàn vượt sông an toàn"
  mpo_migration_travel_events.0040.lose: "Ngài mất một số thú do dòng nước"
  mpo_migration_travel_events.0040.b: "Dùng bè để an toàn."
  mpo_migration_travel_events.0040.b_flavor: "Ngài đóng bè để giúp đàn qua sông."
  mpo_migration_travel_events.0040.c: "Có bến đò gần không?"
  mpo_migration_travel_events.0040.c_christian: "Nếu [ROOT.Char.GetFaith.HighGodName] có thể chia biển, chắc chắn [ROOT.Char.GetFaith.HighGodSheHe] có thể giúp ta vượt sông."

  mpo_migration_travel_events.0050.t: "Tình Yêu Trên Thảo Nguyên"
  mpo_migration_travel_events.0050.desc: "[courtier.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))|l] của ta, đã bị thấy là rời khỏi đàn gia súc thường xuyên hơn bao giờ hết. Khi chúng ta chuẩn bị rời đi đến điểm đến tiếp theo, [courtier.GetSheHe] tiến lại gần, đôi mắt [courtier.GetHerHis] tràn đầy sự luyến tiếc.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], thần đã tìm thấy ý trung nhân của mình ở đây,\" [courtier.GetFirstNameNoTooltip] thú nhận. \"Thần muốn rời bỏ đàn gia súc và ở lại với [local.GetHerHim], [local.GetFirstName] của thần. Xin hãy cho phép thần đi.\""
  mpo_migration_travel_events.0050.a: "Hãy đi theo trái tim mình, [courtier.GetFirstNameNoTooltip]."
  mpo_migration_travel_events.0050.b: "Rời bỏ [ROOT.Char.GetTitleAsNameNoTooltip] vì tình yêu? Ha!"
  mpo_migration_travel_events.0050.c: "Hãy hướng tình cảm về Ta, [courtier.GetFirstNameNoTooltip]."
  mpo_migration_travel_events.0050.c_tt: "Ngài cố gắng quyến rũ [courtier.GetFirstNameNoTooltip]"
  mpo_migration_travel_events.0050.win: "[courtier.GetFirstNameNoTooltip] xiêu lòng trước sức hấp dẫn của Ngài"
  mpo_migration_travel_events.0050.lose: "[courtier.GetFirstNameNoTooltip] vẫn rời đi"
  mpo_migration_travel_events.0050.d: "Sao ngươi lại xiêu lòng người khác!?"

  mpo_migration_travel_events.0060.t: "$travel_danger_prefix$ Ngựa Hoang"
  mpo_migration_travel_events.0060.desc: "Sự hoảng loạn lan truyền khắp trại khi một con ngựa thoát khỏi dây buộc, suýt nữa làm [courtier.GetFirstName] rơi khỏi lưng nó. Nó đã trở nên điên cuồng vì chuyến đi, hoặc có lẽ bị khiêu khích, và chạy loạn xạ, không màng đến bất kỳ ai đang cố gắng trấn an nó.\n\n[courtier.GetFirstNameNoTooltip] thét lên khi [courtier.GetSheHe] nhận ra mình không còn kiểm soát được con thú, và ngày càng gần hơn với việc trượt khỏi lưng ngựa mỗi lần nó chồm lên."
  mpo_migration_travel_events.0060.a: "Hạ nó đi, nhanh lên!"
  mpo_migration_travel_events.0060.a_tt: "Ngài hy sinh ngựa để cứu [courtier.GetFirstNameNoTooltip] và những người khác"
  mpo_migration_travel_events.0060.a_bad: "Ngựa chết"
  mpo_migration_travel_events.0060.a_bad_tt: "@death_icon!#n Một thuộc hạ chết#!"
  mpo_migration_travel_events.0060.win: "Ngựa được làm dịu mà không xảy ra sự cố khác"
  mpo_migration_travel_events.0060.b: "Ta có thể xử lý. Lùi ra!"
  mpo_migration_travel_events.0060.tt: "Ngài cố gắng làm dịu ngựa"
  mpo_migration_travel_events.0060.lose: "Ngựa lao đi"
  mpo_migration_travel_events.0060.c: "Hy vọng [courtier.GetFirstNameNoTooltip] là nạn nhân duy nhất..."
  mpo_migration_travel_events.0060.herd: "Ngựa giẫm lên một phần đàn"
  mpo_migration_travel_events.0060.people: "Ngựa giẫm lên nhiều người trong đoàn"
  mpo_migration_travel_events.0060.people_tt: "#n Một vài người có thể bị ngựa giẫm#!"
