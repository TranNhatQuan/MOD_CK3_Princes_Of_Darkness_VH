l_english:
  mpo_flavor_events_settled.0001.t: "Cơn Bão Đang Đến"
  mpo_flavor_events_settled.0001.desc: "Gió lạnh cắt vào má Ta như những mảnh thủy tinh. Thời tiết dạo này bất thường, rất lạnh.\n\nTiếng ngựa hí làm Ta chú ý ngay khi Ta quay lại vào trong. Người cưỡi nó gần như không giữ nổi dây cương.\n\n'Giúp...,' [nomad.GetSheHe] thì thầm, sắp ngã. 'Mùa đông khắc nghiệt đã đến. Dân chúng Ta chết dần, cố trốn khỏi thảo nguyên.'"
  mpo_flavor_events_settled.0001.aa: ""Đi khỏi đây!""
  mpo_flavor_events_settled.0001.a: ""Để họ đến!""
  mpo_flavor_events_settled.0001.b: ""Chúng ta phải chuẩn bị cho những kẻ du mục này.""
  mpo_flavor_events_settled.0001.c: ""Ngươi có thể nghỉ ngơi bây giờ.""
  mpo_settled_preparations_war_county_modifier: "Chuẩn Bị Chiến Tranh"
  mpo_settled_preparations_war_county_modifier_desc: "Nhân vật này đang chuẩn bị cho cuộc xâm lược của kẻ du mục sắp tới bằng cách củng cố quân đội."
  mpo_settled_preparations_building_county_modifier: "Chuẩn Bị Đất Đai"
  mpo_settled_preparations_building_county_modifier_desc: "Nhân vật này đang chuẩn bị cho cuộc xâm lược của kẻ du mục sắp tới bằng cách đảm bảo các hạt giống đất của họ sẵn sàng."
  mpo_flavor_events_settled.0001.tt: "@alert_icon! #alert_trial [nomads|E] có thể cố gắng chiếm lấy đất đai của chúng ta#!"
 
  mpo_flavor_events_settled.0010.t: "Chúa Ngựa"
  mpo_flavor_events_settled.0010.desc: "#Emp 'Ksk! Ksk!'#! Một [nomad.GetWomanMan] lạ chạm vào bên hông ngựa của [nomad.GetHerHis] để dỗ nó, rồi tiến về phía Ta.\n\n'Chào [ROOT.Char.GetTitleAsNameNoTooltip] đáng kính, Ta là sứ giả của đại [nomad_lord.GetTitledFirstName]. [nomad_lord.GetLadyLord] đã gửi Ta đến để đề xuất một thỏa thuận hòa bình giữa dân chúng chúng ta.'"
  mpo_flavor_events_settled.0010.a: ""Xin hãy nhận lễ vật của Ta.""
  mpo_flavor_events_settled.0010.b: ""Ta chắc rằng chúng ta có thể đạt được sự hiểu biết.""
  mpo_flavor_events_settled.0010.b_perk_tt: "Perk [GetPerk('defensive_measures_perk').GetName( GetNullCharacter )] của Ngài cho phép Ngài thương lượng được giá tốt hơn"
  mpo_flavor_events_settled.0010.c: "#EMP Nhổ xuống đất.#!"
  mpo_flavor_events_settled.0010.d: ""Gửi lời kính trọng của Ta đến [nomad_lord.GetLadyLord] của Ngài.""
