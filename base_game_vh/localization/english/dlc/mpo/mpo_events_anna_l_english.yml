l_english:

  mpo_events_anna.0001.t: "Huấn Luyện Từ Nhỏ"
  mpo_events_anna.0001.desc: "Ta và [pushy_adult.GetFirstName], vị [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('pushy_adult'))] của ta đang quan sát [child.GetFirstName], đứa [child.Custom('GetDaughterSon')] của ta, khi nó vui vẻ nhảy nhót khắp khu trại với vài hòn đá trên tay, sẵn sàng để chơi cùng. [pushy_adult.GetFirstNameNoTooltip] hào hứng quay sang ta với nụ cười rạng rỡ.\n\n\"Ngài không nghĩ đã đến lúc [child.GetFirstNameNoTooltip] học cách cưỡi ngựa thay vì chơi những trò con nít sao? Ta đã chuẩn bị một chú ngựa tơ ngoan ngoãn nhất và vài sợi dây thừng để giữ an toàn cho [child.GetHerHim] trong chuyến cưỡi ngựa đầu tiên của [child.GetHerHis] rồi.\""

  mpo_events_anna.0001.a: "Đặt [child.GetFirstNameNoTooltip] lên ngựa một mình."
  mpo_events_anna.0001.a.tt: "Ta buộc [child.GetFirstNameNoTooltip] vào ngựa bằng dây."
  mpo_events_anna.0001.a.toast.good: "[child.GetFirstNameNoTooltip] học cưỡi ngựa thành công"
  mpo_events_anna.0001.a.toast.neutral: "[child.GetFirstNameNoTooltip] không học được cách cưỡi ngựa"
  mpo_events_anna.0001.a.toast.bad: "[child.GetFirstNameNoTooltip] ngã khỏi ngựa"
  mpo_events_anna.0001.b: "Cưỡi cùng [child.GetFirstNameNoTooltip] để dạy họ."
  mpo_events_anna.0001.c: ""[child.GetFirstNameNoTooltip] sẽ hiểu cách cưỡi vào lúc thích hợp.""

  mpo_events_anna.0005.t: "Những Câu Chuyện Xưa"
  mpo_events_anna.0005.desc: "Khi đêm xuống, các vì sao chiếu sáng từ những góc tối nhất của bầu trời. Một đống lửa lập lòe giữa các lều, tạo cảnh tượng mời gọi đám đông tập trung.\n\n[storyteller.GetFirstName], người kể chuyện cho buổi tối, nhìn qua đám đông hớn hở, dường như đang tìm kiếm thứ gì đó, hoặc #EMP ai đó#!.\n\nÁnh mắt chúng Ta chạm nhau, và [storyteller.GetFirstNameNoTooltip] bất ngờ nhảy về phía Ta khiến nhóm đứng xung quanh giật mình. Một ngón tay từ từ được giơ lên bởi [storyteller.GetHerHim], cuối cùng chỉ thẳng về phía Ta. 'Bây giờ đến lượt Ngài chọn một câu chuyện xưa để kể lại!'"
  mpo_events_anna.0005.a: ""Hãy kể về điều gì đó kỳ diệu.""
  mpo_events_anna.0005.a.tt: "Ngựa hoang có cánh để bay, thú nói chuyện với con người và thời tiết hung dữ do thần linh điều khiển."
  mpo_events_anna.0005.b: ""Có lẽ một vài câu chuyện cười để làm chúng Ta vui nhỉ?""
  mpo_events_anna.0005.b.tt: "Những trò tinh nghịch của người già, những yêu cầu bị hiểu lầm và những cuộc đua đi theo hướng hoàn toàn bất ngờ."
  mpo_events_anna.0005.c: ""Huyền thoại về anh hùng!""
  mpo_events_anna.0005.c.tt: "Những trận chiến huy hoàng, tình đồng đội và các chiến binh huyền thoại khiến kẻ thù khiếp sợ."

  mpo_events_anna.0010.t: "Huýt Sáo Như Mũi Tên"
  mpo_events_anna.0010.desc: "Từ xa, Ta thấy vài con ngựa của trại đang gặm cỏ bình yên. Ta rất muốn hiểu chúng hơn, nhưng thu hút sự chú ý của chúng thật khó. Ta đã thử ra dấu, đi đi lại lại và hét — chỉ nhận được sự im lặng.\n\nFrustrated với những nỗ lực vô ích, Ta quay lại trại, chỉ để va đầu vào [whistler.GetFirstName].\n\n'Chúng ta sẽ phải dạy Ngài vài mánh mới để gọi ngựa. Hãy theo Ta.'"
  mpo_events_anna.0010.a: "Nghe kỹ hướng dẫn."
  mpo_events_anna.0010.a.tt.learning: "[whistler.GetFirstNamePossessive] [learning skill|E] sẽ tăng cơ hội thành công của Ngài"
  mpo_events_anna.0010.a.tt.success: "Ngài huýt sáo thành công"
  mpo_events_anna.0010.a.tt.failure: "Ngài không hiểu hướng dẫn của [whistler.GetFirstNamePossessiveNoTooltip]"
  mpo_events_anna.0010.b: ""Ta học khi nào Ta muốn!""

  mpo_events_anna.0015.t: "Một Miếng Thịt"
  mpo_events_anna.0015.desc: "Tiếng kêu yếu ớt của thú vang khắp những ngọn đồi. Tò mò, Ta tiến lại gần để xem kỹ hơn.\n\nCó một con nai con bị bỏ rơi mắc kẹt trong [Glossary( 'khogste', 'KHOGSTE_GLOSS' )], cố gắng kéo chân ra và kêu gọi mẹ — nhưng vô vọng.\n\nDù không phải của chúng ta, nhưng chúng ta phải làm mọi cách để sống sót qua hành trình khó khăn phía trước."
  mpo_events_anna.0015.a: "Ăn trộm con mồi để bổ sung lương thực."
  mpo_events_anna.0015.b: "Nói dối rằng đây là bẫy của Ta từ đầu."
  mpo_events_anna.0015.c: "Thả con vật để nó có cơ hội lớn lên."
  mpo_events_anna.0015.d: "Không phải của Ta để lấy."
  KHOGSTE_GLOSS: "Một cái bẫy chân được chôn và cố định xuống đất, làm từ nhiều loại đá khác nhau."

  mpo_events_anna.0020.t: "Cuộc Đua Với Thời Gian"
  mpo_events_anna.0020.desc: "Tiếng móng ngựa rung chuyển dồn dập băng qua cánh đồng, lao thẳng về phía chúng ta. Bóng dáng của một [messenger.GetWomanMan] trên lưng ngựa xuất hiện, đang cố hết sức [messenger.GetHerHis] để không ngã khỏi [messenger.GetHerHis] chiến mã, đang vật lộn để giữ chặt.\n\n[messenger.GetSheHe|U] đột ngột dừng lại trước mặt chúng ta, chậm rãi hạ mình xuống [messenger.GetHerHis] ngựa, rõ ràng là đang rất chật vật. Một vết thương nặng nề hiện rõ trên lưng [messenger.GetHerHis], thật là một phép màu khi [messenger.GetSheHe] vẫn còn đứng vững.\n\n“N-ngài ph-ph-ải chuy-ển… l-l-àm ơn…” là những từ cuối cùng [messenger.GetSheHe] cố gắng thốt lên trong khi đau đớn chỉ tay về phía chân trời, với một thông điệp được mã hóa trên tay, trước khi nhắm [messenger.GetHerHis] mắt lại và gục xuống nghỉ ngơi… "
  mpo_events_anna.0020.war_impact.tt: "Hậu quả của lựa chọn của Ngài #EMP có thể#! ảnh hưởng đến người khác nơi khác"
  mpo_events_anna.0020.a: "Điều trị vết thương của [messenger.GetHerHis] ngay lập tức!"
  mpo_events_anna.0020.a.toast.good: "Ngài điều trị thành công cho sứ giả"
  mpo_events_anna.0020.a.toast.bad: "Ngài không điều trị vết thương cho sứ giả"
  mpo_events_anna.0020.b: "Thực hiện di nguyện của [messenger.GetHerHis] và tự mình chuyển thư."
  mpo_events_anna.0020.b.toast.good: "Ngài chuyển thư thành công đến người tiếp theo"
  mpo_events_anna.0020.b.toast.bad: "Ngài lạc đường, không thể chuyển tiếp thư"
  mpo_events_anna.0020.c: "Ta không quen người này và không biết [messenger.GetSheHe] có đáng tin không."
  mpo_events_anna.0020.c_flavor: "#EMP Cướp thi thể [messenger.GetHerHis], cũng không như [messenger.GetSheHe] còn cần nữa#!"

  mpo_events_anna.0025.t: "Giai Điệu Thân Thuộc"
  mpo_events_anna.0025.desc: "Bài hát kết nối con người qua nhiều thế kỷ, mang cảm hứng, an ủi và tiếp thêm sức mạnh vượt qua khó khăn. Một số bài giúp tinh thần chiến đấu không mệt mỏi. Những bài hát như vậy hiếm khi bị quên lãng, và là một phần di sản của chúng ta.\n\nCuộc gặp với một ca sĩ ngồi trên đá nhắc Ta về điều đó, khi Ta bị mê hoặc bởi màn trình diễn."
  mpo_events_anna.0025.a: "Cố gắng bắt chước và hát theo."
  mpo_events_anna.0025.a.toast.success: "Ngài hát theo thành công với [throat_singer.GetFirstName]"
  mpo_events_anna.0025.a.toast.failure: "Nhịp điệu và cao độ của Ngài hơi lệch"
  mpo_events_anna.0025.b: "Lắng nghe và thưởng thức."
