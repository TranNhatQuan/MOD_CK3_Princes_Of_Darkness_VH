l_english:
  mpo_bb_events.0001.t: "Một Trận Đùa Thân Thiết"
  mpo_bb_events.0001.desc: "Phía chân trời, ta phát hiện một kỵ sĩ lẻ loi đang tiến lại gần. Đó là anh em kết nghĩa và là [my_blood_brother.Custom2('RelationToMe', ROOT.Char )] thân yêu của ta, [my_blood_brother.GetTitledFirstName]! \n\n[my_blood_brother.GetSheHe|U] xuống ngựa và đối diện với ta với vẻ mặt nghiêm nghị trên khuôn mặt [my_blood_brother.GetHerHis]. \n\n[my_blood_brother.GetSheHe|U] hạ thấp người với đôi tay [my_blood_brother.GetHerHis] dang rộng. Đây chắc chắn là một lời thách đấu vật. \n\n\"Ngài nghĩ sao về một cuộc thi nhỏ [ROOT.Char.GetFirstNameNoTooltip]?\""
  mpo_bb_events.0001.a: "#italics Ta sẽ cho ngươi thấy sức mạnh của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] #!!"
  mpo_bb_events.0001.b: "Thay vào đó, với lấy tay để ôm nhau."
  mpo_bb_events.0001.c: "Quét chân [my_blood_brother.GetHerHis] ra khỏi mặt đất!"
  mpo_bb_events.0001.a.tt_success: "Ngươi chiến thắng"
  mpo_bb_events.0001.a.tt_failure: "Ngươi thất bại"
 
