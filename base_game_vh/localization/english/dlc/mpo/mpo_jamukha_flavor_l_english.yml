l_english:
  jamukha_choose_blood_brother_tt: "[jamukha.GetShortUIName] sẽ quyết định liệu có thực hiện việc trở thành [blood_brothers|E] hay không"
  jamukha_warhorse_tt: "#high Ngài#! sẽ tặng [jamukha.GetShortUIName] một [GetModifier('horse_story_modifier').GetNameWithTooltip]"
  temujin_warhorse_tt: "[jamukha.GetShortUIName] sẽ tặng Ngài một [GetModifier('horse_story_modifier').GetNameWithTooltip]"
  temujin_warhorse_jamukha_tt: "#high Ngài#! tặng [temujin.GetShortUIName] một [GetModifier('horse_story_modifier').GetNameWithTooltip]"
  jamukha_warhorse_jamukha_tt: "[temujin.GetShortUIName] tặng Ngài một [GetModifier('horse_story_modifier').GetNameWithTooltip]"
  blood_brother_gains_hook_tt: "Nhận một [strong_hook|E] #EMP (Blood Brother)#! trên #high Ngài#!"
  blood_brother_gains_hook_other_tt: "#high Ngài#! nhận một [strong_hook|E] #EMP (Blood Brother)#! trên [blood_bro.GetShortUIName]"

  mpo_jamukha_flavor.0001.t: "Những Năm Hữu Huyết"
  mpo_jamukha_flavor.0001.desc: "[temujin.GetTitledFirstName] và Ta ngồi bên lửa trại. Nhân dân của chúng Ta quây quần quanh trong một trại lớn.\n\nBao năm đã trôi qua kể từ khi Ta lần đầu đề nghị kết bạn với anh ta, chiến binh trẻ bị bỏ rơi bởi bộ tộc của cha. Chúng Ta gieo xương ngón tay trên băng của sông Onon. Chúng Ta thề sẽ luôn là Ngài.\n\nKhi đó chúng Ta còn là trẻ con. Kể từ đó, chúng Ta cùng nhau chiến đấu, và Tình bạn đã lớn lên. Giờ đây, khi trưởng thành, chúng Ta biết lời để trở thành [Glossary( 'anda', 'ANDA_GLOSS' )] trọn đời."
  mpo_jamukha_flavor.0001.a: "Ta sẽ trao [temujin.GetFirstNameNoTooltip] lời thề huynh đệ của Ta."
  mpo_jamukha_flavor.0001.a.tt: "Và chúng Ta sẽ trao đổi những món quà xứng đáng."
  mpo_jamukha_flavor.0001.b: "Ta ở đây để tranh quyền lực. Không phải vì tình yêu."

  mpo_nerge_promised_feast_failed: "Lời Hứa Thịt Không Thành"
  mpo_nerge_promised_feast_failed_desc: "Đối với những thợ săn quý tộc, nhân vật này đã hứa một núi thịt ngon. Nhưng không thực hiện được."
  jamukha_temujin_response_warning_tt: "@warning_icon! #X [temujin.GetShortUIName] có thể làm hại @prestige_icon![prestige|E] và @dread_icon![dread|E] của Ngài#!"
  negotiate_togrul_alliance_effect_tooltip: "[jamukha.GetShortUIName] và [togrul.GetShortUIName] lập một [alliance|E] chung"
  mpo_jamukha_flavor.0010.t: "Những Lời Nhục Mà Không Người Mông Cổ Nào Chịu Được"
  mpo_jamukha_flavor.0010.desc: "Ta đã dẫn dắt nhân dân mình, từ lâu rồi, bên cạnh [temujin.GetTitledFirstNamePossessive], trung thành với mọi ý muốn của anh ta, kiên định dù tâm trí Ta đầy rối ren.\n\nPhụ nữ thì thầm độc hại vào tai [temujin.GetFirstNamePossessiveNoTooltip]. Vệ sĩ đêm của anh ta nhìn Ta đầy nghi hoặc khi Ta đến lều của anh ta. Ta chịu đựng những sỉ nhục này được bao lâu?\n\n"
  mpo_jamukha_flavor.0010.desc_togrul: "Và quyền lực [togrul.GetName] đã hứa bảo vệ [togrul.GetHerHis], nếu Ta vứt bỏ [temujin.GetFirstNamePossessiveNoTooltip]..."

  mpo_jamukha_flavor.0020.t: "Những Người Đàn Ông Với Giấc Mơ Đẫm Máu"
  mpo_jamukha_flavor.0020.desc: "Ta cưỡi ngựa ban đêm đến trại của [temujin.GetTitledFirstNamePossessive], bùng lên cơn giận và xấu hổ. Định mệnh — những suy nghĩ đen tối ngoài ánh lửa trong tâm trí Ta — thúc ép Ta.\n\nKhi [temujin.GetFirstNameNoTooltip] và Ta còn nhỏ, chúng Ta mổ xác một con chuột đất. Thịt nó đã nằm trong bụng Ta, như độc, suốt những năm qua. Lời hứa Bạn Bè đốt cháy tâm trí Ta, bóc mặt Ta ra khi Ta nhớ lại. #EMP Làm sao#! Ta có thể thề với người đàn ông định mệnh cai trị toàn bộ Mông Cổ — #EMP định mệnh của Ta#!? Với lời hứa của một đứa trẻ, Ta đã trao mình một cuộc sống phản bội.\n\n#EMP "Ta sẽ tiêu diệt ngươi!"#! Ta hét lên, khi [temujin.GetFirstNameNoTooltip] nhếch môi cười. #EMP "Ta, [ROOT.Char.GetFirstName], là Khan của [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun]!"#!"
  mpo_jamukha_flavor.0010.a: "Ta phải tìm định mệnh của mình. Không có [temujin.GetFirstNameNoTooltip]."
  mpo_jamukha_flavor.0010.b: "Lời Ta buộc Ta, như một thanh gươm trên thắt lưng [temujin.GetFirstNamePossessiveNoTooltip]."
  jamukha_chose_loyalty_modifier: "Chọn Trung Thành với Temujin"
  jamukha_chose_loyalty_modifier_desc: "Jamukha đã chứng minh là Ngài hữu cao quý và chân thành, ngay cả khi phải hy sinh cái Ta của chính mình."

  jamukha_temujin_no_more_positive_tt: "@alert_icon! #X Mọi [relations|E] tích cực giữa #high Ngài#! và [temujin.GetShortUIName] đã bị phá hủy"
  jamukha_temujin_rivals_tt: "[temujin.GetShortUIName] đã trở thành [rival|E] của Ngài"
  jamukha_gain_from_defectors_tt: "#weak @herd_icon![herd|E] và @prestige_icon![prestige|E] thu được do Mông Cổ tập trung chiến tranh"
  temujin_gain_from_defectors_tt: "$jamukha_gain_from_defectors_tt$"
  mpo_jamukha_flavor.0020.a: "#EMP "Ngươi hèn hạ, đã từng là huynh đệ của ta!"#!"
  mpo_jamukha_flavor.0020.b: ""Cái chết của ngươi sẽ thảm hại, [temujin.GetFirstNameNoTooltip]...""
  mpo_jamukha_flavor.0020.c: ""Trên chiến trường, #EMP định mệnh của ngươi sẽ là của ta!#!""


  mpo_jamukha_flavor.0020.b_murder: "Ngài nhận #P #EMP cộng lớn#!#! cho [GetScheme('murder').GetTypeName] [schemes|E] nhắm vào [temujin.GetShortUIName]"
  mpo_jamukha_flavor.0020.a_war_win: "Chiến thắng một #high cuộc tấn công#! [war|E] chống lại [temujin.GetShortUIName] sẽ mang lại thêm @legitimacy_icon![legitimacy|E] và @prestige_icon![prestige|E]"
