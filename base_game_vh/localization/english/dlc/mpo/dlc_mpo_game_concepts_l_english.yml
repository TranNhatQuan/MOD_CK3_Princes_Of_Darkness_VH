l_english: 
  game_concept_nomadic_government: "Chính Quyền Du Mục"
  game_concept_nomadic: "Du Mục"
  game_concept_nomadic_desc: "[rulers|E] du mục chăn thả trên [county_fertility|E] để tăng [herd|E] của họ. Họ có thể dùng Herd như [horde|E], có thể nâng cấp thành [men_at_arms|E]. Họ có một [yurt|E].\n\nNgười Du Mục có thể [migrate|E] để tìm vùng đất màu mỡ hơn, dù các [realms|E] du mục lớn có thể tăng herd bằng [tributaries|E] hoặc đạt [fertility_equilibrium|E] cao.\n\nNgười Du Mục có giới hạn tối đa [dread|E] cao hơn."
  game_concept_nomad_i: "@government_type_nomad!"
  game_concept_nomads: "Người Du Mục"
  game_concept_nomads_desc: "$game_concept_nomadic_desc$"
  game_concept_nomad: "Người Du Mục"
  game_concept_nomad_desc: "$game_concept_nomadic_desc$"


  game_concept_confederation_government: "Chính Quyền Liên Bang"
  game_concept_confederation: "Liên Bang"
  game_concept_confederations: "Các Liên Bang"
  game_concept_confederation_desc: "Một mối quan hệ ràng buộc các [tribal|E] hoặc [nomadic|E] [rulers|E] trong phòng thủ lẫn nhau, tương tự như một [alliance|E]. Được hình thành qua #high $call_for_confederation_decision$#! [decision|E], một liên bang yêu cầu các thành viên tham gia [wars|E] phòng thủ của nhau. Liên bang hiển thị trong tab Diplomacy.\n\nCác [confederates|E] cũng không được tấn công hoặc [raid|E] lẫn nhau. Họ bị hạn chế ở mức cao của [tribal_authority|E] và [nomadic_authority|E], và không được tạo [titles|E] mới.\n\n[confederates|E] có thể dùng #high $leave_confederation_decision$#! [decision|E] hoặc [migrate|E] để trở nên [independent|E]. Nếu liên bang chỉ còn một thành viên, nó sẽ bị phá hủy."

  game_concept_confederate: "Thành Viên Liên Bang"
  game_concept_confederates: "Các Thành Viên Liên Bang"
  game_concept_confederate_desc: "Một [ruler|E] trong một [confederation|E]. Họ sẽ tự động tham gia các [wars|E] phòng thủ của các thành viên khác và bị hạn chế không được tấn công hoặc [raiding|E] họ."

  game_concept_county_fertility: "Độ Phì Nhiêu Hạt Tỉnh"
  game_concept_county_fertility_desc: "$game_concept_county_fertility$ tồn tại ở các [counties|E] trong [the_great_steppe|E], và có thể được [GetGovernment( 'nomad_government' ).GetName] [rulers|E] chăn thả để tăng [herd|E].\n\nĐộ phì nhiêu của Hạt Tỉnh phản ánh chất lượng đồng cỏ.\n\nFertility ổn định quanh [fertility_equilibrium|E], cho phép [rulers|E] du mục với [domain_limit|E] lớn duy trì sự tăng trưởng Herd. Fertility bị ảnh hưởng bởi [steppe_seasons|E] và từ từ được phục hồi bởi [herders|E].\n\nKhi độ phì nhiêu của [realm|E] thấp, đó là dấu hiệu để [migrate|E].\n\n[county_control|E] làm chậm tốc độ tăng Fertility bằng tỉ lệ phần trăm bằng mức kiểm soát hiện tại."
  game_concept_county_fertility_i: "@county_fertility_icon!"

  game_concept_fertility_equilibrium: "Cân Bằng Phì Nhiêu"
  game_concept_fertility_equilibrium_desc: "Fertility Equilibrium dự đoán độ phì nhiêu của [county|E] trong thời gian dài. Đây là giá trị mà [county_fertility|E] sẽ đạt được theo thời gian.\n\nNếu [county_fertility|E] hiện tại thấp hơn Equilibrium, nó sẽ tăng; nếu cao hơn, nó sẽ giảm.\n\nFertility Equilibrium và tốc độ thay đổi phụ thuộc vào tỉ lệ giữa Growth và Consumption của [county|E]. Nếu cả Growth và Consumption đều nhỏ, bất kỳ thay đổi nào cũng ảnh hưởng lớn đến Equilibrium."
  game_concept_equilibrium: "Cân Bằng"

  game_concept_domain_fertility: "Độ Phì Nhiêu Lãnh Thổ"
  game_concept_domain_fertility_desc: "Domain Fertility là tổng [county_fertility|E] của tất cả các [counties|E] Ngài đang nắm giữ."
 
  game_concept_seasonal_prediction: "Dự Báo Theo Mùa"
  game_concept_seasonal_prediction_desc: "Một $court_position_court_astrologer$ khéo léo có thể dự đoán [steppe_season|E] tiếp theo trong khu vực, cung cấp thông tin hữu ích cho chúa tể để lập kế hoạch hành động."
 
  game_concept_kurultai: "Kurultai"
  game_concept_kurultais: "Kurultais"
  game_concept_kurultai_member: "Thành Viên Kurultai"
  game_concept_kurultai_members: "Các Thành Viên Kurultai"
  game_concept_kurultai_desc: "Kurultai thay thế [council|E] cho [nomadic_government|E]. Các thành viên Kurultai là tinh hoa của lãnh thổ, và cần được làm hài lòng hoặc ép vào [obedience|E] để đảm bảo [succession|E] suôn sẻ.\n\nSau một sự kiện kế vị hỗn loạn, họ có thể chiếm một phần [herd|E], bỏ [liege|E] mới và giành [claim|E] trên [realm|E] [title|E]."
  game_concept_kurultai_1_desc: "$game_concept_kurultai_desc$"
  game_concept_kurultai_2_desc: "$game_concept_kurultai_desc$"
  game_concept_kurultai_3_desc: "$game_concept_kurultai_desc$"
  game_concept_kurultai_4_desc: "$game_concept_kurultai_desc$"

  game_concept_herd: "Bầy Đàn"
  game_concept_herd_desc: "$game_concept_herd$ đại diện cho [ruler|E] của [GetGovernment( 'nomad_government' ).GetName] và đàn vật nuôi như ngựa, cừu và dê.\n\nCó thể thu được thông qua việc giữ các [counties|E] với [county_fertility|E] cao, [vassals|E] hoặc [tributaries|E]. Các [traditions|E] văn hóa, [dynasty_perks|E], [legitimacy|E], và một số [yurt_buildings|E] cung cấp thêm lợi ích khi tăng $game_concept_herd$.\n\nMột phần của Bầy Đàn được chuyển thành [horde|E] khi ruler huy động [armies|E], và có thể biến thành [men_at_arms|E] với chi phí giảm. Khi quân đội giải tán, phần horde còn lại sẽ chuyển ngược lại thành herd.\n\nBầy Đàn cung cấp một lượng nhỏ [gold|E], và cũng có thể dùng làm tiền cho một số [decisions|E] hoặc tăng [migration|E] acceptance."
  game_concept_herd_i: "@herd_icon!"

  game_concept_horde: "Bầy Đàn Du Mục"
  game_concept_horde_desc: "$game_concept_horde$ đại diện cho sức mạnh quân sự của [ruler|E] [GetGovernment( 'nomad_government' ).GetName]. Nó được lấy từ một phần [herd|E] và chỉ xuất hiện khi [ruler|E] huy động [armies|E].\n\nChúng được chuyển thành [GetMaA('nomadic_riders').GetName] và có thể nâng cấp thành các [men_at_arms|E] khác bằng [gold|E].\n\nMột số [traditions|E] văn hóa, [dynasty|E] legacy perks và [yurt_buildings|E] có thể tăng tỷ lệ chuyển đổi."
 
  game_concept_herder: "Người Chăn Nuôi"
  game_concept_herder_desc: "Các vùng lãnh thổ herder tách biệt khỏi mọi khía cạnh cai trị. Họ không chỉ huy [armies|E], không sở hữu [buildings|E], không tạo [alliances|E] hoặc tuyên chiến [wars|E]. Khi [nomads|E] [migrate|E] tới [holding|E], herders sẽ từ từ phục hồi [county_fertility|E] nhờ đàn vật nhỏ hơn.\n\nHọ bị áp lực bởi các [ruler|E] du mục thực thụ và sẽ ngay lập tức đầu hàng khi bị thách thức."
  game_concept_herder_i: "@government_type_herder!"
  game_concept_herders: "Người Chăn Nuôi"
  game_concept_herders_desc: "$game_concept_herder_desc$"

  game_concept_nomadic_holding: "Khu Định Cư Du Mục"
  game_concept_nomadic_holding_desc: "$game_concept_nomadic_holdings$ đại diện cho sự tồn tại của một [yurt|E] trên bản đồ. Đây là một [holding_type|E] dùng bởi [rulers|E] [GetGovernment( 'nomad_government' ).GetName] và cung cấp một lượng nhỏ [county_control|E] và [county_opinion|E]."
  game_concept_nomadic_holdings: "Khu Định Cư Du Mục"
  game_concept_nomadic_holdings_desc: "$game_concept_nomadic_holding_desc$"

  game_concept_herder_holding: "Khu Định Cư Chăn Nuôi"
  game_concept_herder_holding_desc: "Một $game_concept_herder_holding$ là nhỏ nhất trong các [holding_types|E]. Nó đại diện cho sự hiện diện của [herders|E] trong khu vực và cung cấp lợi ích cho [county_fertility|E]."

  game_concept_nomadic_authority: "Thống Trị"
  game_concept_nomadic_authority_desc: "$game_concept_nomadic_authority$ thể hiện quyền lực dự kiến của [ruler|E] [GetGovernment( 'nomad_government' ).GetName]. Có thể tăng bằng quy mô [herd|E] và mở khóa các tùy chọn [migration|E] bổ sung.\n\nCó năm cấp độ $game_concept_nomadic_authority$: [unruly_nomadic|E], [limited_nomadic|E], [high_nomadic|E], [absolute_nomadic|E] và [unrestricted_nomadic|E].\n\n#weak Cấp độ cuối chỉ có thể đạt được bởi một ruler duy nhất trong mỗi lượt chơi.#!"
  game_concept_dominance: "$game_concept_nomadic_authority$"

  game_concept_unruly_nomadic: "Người Du Mục Hỗn Loạn"
  game_concept_unruly_nomadic_desc: "$game_concept_unruly_nomadic$ là cấp độ thấp nhất của [nomadic_authority|E]. Ở cấp độ này, [migration|E] chỉ nhắm vào các [de_jure|E] [county|E] [titles|E] trong [the_great_steppe|E] và [characters|E] không thể bị [imprisoned|E]."

  game_concept_limited_nomadic: "Hạn Chế"
  game_concept_limited_nomadic_desc: "$game_concept_limited_nomadic$ là cấp độ thứ hai thấp nhất của [nomadic_authority|E]. [migration|E] có thể nhắm tới [de_jure|E] [duchy|E] [titles|E] trong [the_great_steppe|E], [titles|E] có thể bị thu hồi và liege có thể [imprison|E] [characters|E] trong [realm|E].\n\nCó thể dùng #V $step_away_from_the_steppe_decision$#! [decision|E]"

  game_concept_high_nomadic: "Cao"
  game_concept_high_nomadic_desc: "$game_concept_high_nomadic$ là cấp độ trung bình của [nomadic_authority|E]. Ở cấp này, [migration|E] có thể nhắm tới [de_jure|E] [kingdom|E] [titles|E] trong [the_great_steppe|E] và liege có thể [retract|E] vassals của một [vassal|E]."

  game_concept_absolute_nomadic: "Tuyệt Đối"
  game_concept_absolute_nomadic_desc: "$game_concept_absolute_nomadic$ là cấp độ thứ hai cao nhất của [nomadic_authority|E]. Ở cấp này, [migration|E] có thể nhắm tới [de_jure|E] [empire|E] [titles|E] trong [the_great_steppe|E].\n\n[independent|E] [rulers|E] có thể định cư ngoài steppe bằng #high $settle_the_steppe_decision$#! [decision|E]"

  game_concept_unrestricted_nomadic: "Không Giới Hạn"
  game_concept_unrestricted_nomadic_desc: "$game_concept_unrestricted_nomadic$ là cấp cao nhất của [nomadic_authority|E]. Cấp này chỉ có thể đạt bởi một [character|E] duy nhất trong cả trò chơi, và họ sẽ trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )].\n\n[independent|E] [rulers|E] có thể dùng #high $mpo_become_greatest_of_khans_decision$#! và #high $mpo_gok_world_conquest_decision$#! [decisions|E]"

  game_concept_the_great_steppe: "Đại Mông Cổ"
  game_concept_the_great_steppe_desc: "$game_concept_the_great_steppe$ đại diện cho biển cỏ bất tận của Eurasian Steppe, các điều kiện khí hậu ảnh hưởng tới nó, chia thành ba vùng: Tây, Trung và Đông.\n\nCác [steppe_seasons|E] khác nhau mô tả các sự kiện tích cực và tiêu cực, tạo cơ hội cho các hành động đặc biệt chỉ có trong thời gian đó, và ảnh hưởng đến [county_fertility|E] của từng vùng.\n\nChỉ [GetGovernment( 'nomad_government' ).GetName] và [herder|E] [rulers|E] tham gia [situation|E] này, và [gurkhan|E] là ruler quyền lực nhất toàn vùng."

  game_concept_suzerain: "Chúa Tể"
  game_concept_suzerain_desc: "Một $game_concept_suzerain$ là [ruler|E] có ít nhất một [tributary|E]. Suzerains có thể là Tributaries của ruler khác, nhưng không bao giờ là [vassals|E]."
  game_concept_suzerains: "Các Chúa Tể"
  game_concept_suzerains_desc: "$game_concept_suzerain_desc$"
  game_concept_suzerain_possessive: "Của Chúa Tể"

  game_concept_tributary: "Chư Hầu"
  game_concept_tributary_desc: "Một $game_concept_tributary$ là [ruler|E] đã đạt thỏa thuận với ruler khác, [suzerain|E] của họ.\n\n$game_concept_tributary$ cung cấp cống phẩm định kỳ dưới dạng [herd|E], [taxes|E], [prestige|E] hoặc [piety|E] (tùy loại) và đổi lại có [truce|E] với $game_concept_suzerain$.\n\nChư Hầu là dạng thần dân lỏng lẻo, không thể tham gia [factions|E], nhưng có thể thoát nếu điều kiện không được đáp ứng.\n\nNếu Suzerain không còn [landed|E] hoặc [migrating|E], các Tributaries sẽ tự do sau một thời gian ngắn."
  game_concept_tributaries: "Các Chư Hầu"
  game_concept_tributary_possessive: "Của Chư Hầu"
  game_concept_tributaries_desc: "$game_concept_tributary_desc$"

  game_concept_subject: "Thần Dân"
  game_concept_subject_desc: "Một $game_concept_subject$ là bất kỳ [ruler|E] nào đã tuyên thệ trung thành với ruler khác. Họ có nhiều loại, như [vassals|E] hoặc [tributaries|E], mỗi loại có đặc thù riêng."
  game_concept_subjects: "Các Thần Dân"
  game_concept_subjects_desc: "$game_concept_subject_desc$"

  game_concept_steppe_season: "Mùa Thảo Nguyên"
  game_concept_steppe_season_desc: "Một $game_concept_steppe_season$ đại diện cho khí hậu hiện tại của [the_great_steppe|E], và ảnh hưởng đến [county_fertility|E], cùng các hành động có sẵn cho [situation|E] [rulers|E].\n\n$game_concept_steppe_seasons$ độc lập cho từng vùng, và [GetGovernment( 'nomad_government' ).GetName] Rulers có thể di chuyển tới vùng có Seasons tích cực.\n\nĐôi khi, cùng một Season có thể xuất hiện đồng thời ở nhiều [situation_sub_region|E]."
  game_concept_steppe_seasons: "Các Mùa Thảo Nguyên"
  game_concept_steppe_seasons_desc: "$game_concept_steppe_season_desc$"

  game_concept_situation: "Tình Huống"
  game_concept_situation_situations: "Các Tình Huống"
  game_concept_situation_desc: "$game_concept_situation_situations$ là những sự kiện trung đến dài hạn liên quan đến các nhân vật trong một [situation_sub_region|E] địa lý, chuyển đổi giữa các [situation_phases|E] khác nhau."
  game_concept_situation_phase: "Giai Đoạn Tình Huống"
  game_concept_situation_phase_desc: "Mỗi $game_concept_situation_phase$ có các hiệu ứng và điều kiện riêng ảnh hưởng đến các nhân vật tham gia.\n\nMột số $game_concept_situation_phases$ được kích hoạt bởi điều kiện cụ thể, trong khi số khác diễn ra theo dòng thời gian."
  game_concept_situation_phases: "Các Giai Đoạn Tình Huống"
  game_concept_situation_phases_desc: "$game_concept_situation_phase_desc$"
  game_concept_situation_sub_region: "Vùng Tình Huống"
  game_concept_situation_sub_regions: "Các Vùng Tình Huống"
  game_concept_situation_sub_region_desc: "[situation_situations|E] có thể có nhiều vùng, mỗi vùng có các [situation_phases|E] độc lập."
  game_concept_situation_sub_regions_desc: "$game_concept_situation_sub_region_desc$"
  game_concept_situation_participant_group: "Nhóm Tham Gia"
  game_concept_situation_participant_groups: "Các Nhóm Tham Gia"
  game_concept_situation_participant_group_desc: "Nhóm Tham Gia trong một [situation|E] là tập hợp các nhân vật chịu cùng hiệu ứng trong mỗi [situation_phase|E]."
  game_concept_situation_catalyst: "Chất Xúc Tác Tình Huống"
  game_concept_situation_catalyst_catalyst: "Chất Xúc Tác"
  game_concept_situation_catalyst_catalysts: "Các Chất Xúc Tác"
  game_concept_situation_catalyst_desc:2 "Một số [situation_situations|E] chuyển đổi giữa các [situation_phases|E] khi xảy ra $game_concept_situation_catalyst$.\n\nDanh sách $game_concept_situation_catalyst$ quan trọng trong mỗi $game_concept_situation_phase$ có thể xem trong cửa sổ $game_concept_situation$."

  game_concept_migration: "Di Cư"
  game_concept_migration_desc: "$game_concept_migration$ rất quan trọng với [nomads|E]. Khi [county_fertility|E] trong [realms|E] của họ thấp, họ thường di chuyển để tìm đồng cỏ tươi tốt hơn.\n\nDi cư chỉ nhắm tới [de_jure|E] [titles|E] và [title_tiers|E] có thể tiếp cận bị giới hạn bởi [nomadic_authority|E] của [ruler|E].\n\nMột đề xuất sẽ gửi tới Nomad có [herd|E] lớn nhất ở khu vực mong muốn, và họ quyết định rời đi hòa bình hay chiến đấu để bảo vệ đất đai.\n\n[herders|E] luôn rời đi, vì họ không có khả năng tự vệ."
  game_concept_migrate: "Di Chuyển"
  game_concept_migrate_desc: "$game_concept_migration_desc$"
  game_concept_migrates: "Đã Di Chuyển"
  game_concept_migrated: "Đã Di Cư"
  game_concept_migrating: "Đang Di Cư"
 
  game_concept_raid_intent: "Mục Đích Cướp"
  game_concept_raid_intent_desc: "Một $game_concept_raid_intent$ có thể thay đổi loại phần thưởng nhận được từ [raid|E] hoặc tốc độ di chuyển/khả năng [loot|E] của quân đội. Ngoài việc cướp thông thường để lấy [gold|E] và [prestige|E], còn có các lựa chọn khác như phá [buildings|E] hoặc tăng cơ hội [imprisoning|E] [characters|E]."
  game_concept_raid_intents: "Các Mục Đích Cướp"
  game_concept_raid_intents_desc: "$game_concept_raid_intent_desc$"
 
  game_concept_gurkhan: "Gurkhan"
  game_concept_gurkhan_desc: "Mối đe dọa lớn nhất của [the_great_steppe|E]. $game_concept_gurkhan$ là [ruler|E] [GetGovernment( 'nomad_government' ).GetName] với [herd|E] lớn nhất toàn vùng, đánh dấu họ là đồng minh mạnh mẽ hoặc kẻ thù đáng sợ.\n\nChỉ $game_concept_gurkhan$ mới đạt được cấp cao nhất của [nomadic_authority|E], trở thành [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] và trở thành mục tiêu."
 
  game_concept_yurt: "Thủ Đô Du Mục"
  game_concept_yurt_desc: "$game_concept_yurts$ là các bộ lều di động, vật nuôi, người và ngựa. Chúng có thể từ vài con cừu tới một bầy hùng mạnh.\n\n[rulers|E] [GetGovernment( 'nomad_government' ).GetName] sở hữu $game_concept_yurt$ mà họ phát triển bằng [yurt_buildings|E] và mang theo khi [migrate|E]. Họ không thể xây [buildings|E] bình thường trong [holdings|E].\n\n$game_concept_yurt$ có [faith|E] và [culture|E] đại diện cho đa số người di cư, có thể khác với [ruler|E].\n\nToàn bộ [court|E], [family|E], [kurultai|E] và [knights|E] của họ cũng di chuyển cùng."
  game_concept_yurts: "Các Thủ Đô Du Mục"
  game_concept_yurts_desc: "$game_concept_yurt_desc$"
 
  game_concept_yurt_buildings: "Công Trình Yurt"
  game_concept_yurt_buildings_desc: "$game_concept_yurt_buildings$ là cải tiến đặc biệt cho $game_concept_yurt$.\n\nVề cơ chế, chúng là [domicile_buildings|E] — nhiều công trình thể hiện phong tục xã hội hoặc khu vực tập trung của bộ tộc $game_concept_nomad$, thay vì cấu trúc vật lý.\n\nCác lợi ích bao gồm:\n$EFFECT_LIST_BULLET$ Mở khóa [court_positions|E], [decisions|E] và [character_interaction|E]\n$EFFECT_LIST_BULLET$ Tăng [herd|E] và [county_fertility|E], bao gồm chuyên môn [terrain|E]\n$EFFECT_LIST_BULLET$ Mở khóa và nâng cấp [men_at_arms|E], tăng sức mạnh [horde|E]\n$EFFECT_LIST_BULLET$ Lợi ích văn hóa [culture_tradition|E] độc đáo\n$EFFECT_LIST_BULLET$ Quản lý [vassals|E] và [tributaries|E], ảnh hưởng [characters|E] tại [court|E]\n$EFFECT_LIST_BULLET$ Lợi ích [kurultai|E] và [obedience|E]"
  game_concept_yurt_building: "Công Trình Yurt"
  game_concept_yurt_building_desc: "$game_concept_yurt_buildings_desc$"
 
  game_concept_obedience: "Sự Tuân Lệnh"
  game_concept_obedience_desc: "Trong [GetGovernment( 'nomad_government' ).GetName] [realms|E], obedience xác định lòng trung thành của [character|E] với [liege|E], [suzerain|E] hoặc chủ sở hữu [court|E]. Nhân vật chỉ tuân lệnh một [ruler|E] tại một thời điểm.\n\nNhân vật tuân lệnh ít tham gia [hostile_schemes|E], [wars|E] hay [factions|E] chống lại liege. Họ luôn hỗ trợ liege trong [succession|E] và không theo đuổi [claims|E]. [tributaries|E] không tuân lệnh có thể cố gắng thoát."
  game_concept_obedient: "Tuân Lệnh"
  game_concept_obedience_i: "@obedience_icon!"
  game_concept_obedient_desc: "$game_concept_obedience_desc$"
  obedience_value: "[obedience|E]:"
  obedience_threshold_value: "[obedience_threshold|E]:"

  game_concept_disobedient: "Không Tuân Lệnh"
  game_concept_disobedience_i: "@disobedience_icon!"
  game_concept_disobedient_desc: "$game_concept_obedience_desc$"

  game_concept_obedience_threshold: "Ngưỡng Tuân Lệnh"
  game_concept_obedience_threshold_desc: "$game_concept_obedience_threshold$ là điểm mà [characters|E] cần đạt để được xem là [obedient|E].\n\nNgưỡng ảnh hưởng bởi nhiều yếu tố: [close_family|E] của [overlord|E], [primary_heir|E], [friendship|E], [rivalry|E], [traits|E] và việc sử dụng họ trong [kurultai|E] hoặc [court|E]. [children|E] có xu hướng tuân lệnh hơn người lớn.\n\n[rulers|E] [GetGovernment( 'nomad_government' ).GetName] có thể dùng #EMP $mpo_desperate_stance_decision$#! [decision|E] để khiến tất cả tuân lệnh, #EMP $impose_obedience_intent$#! [intent|E] trong [GetActivityType( 'activity_hunt').GetName] để nhắm tới một nhân vật, và #EMP $mpo_demand_obedience_interaction$#! [character_interaction|E] nếu họ có [dread|E] đủ cao."

  game_concept_overlord: "Chúa Tể Tối Cao"
  game_concept_overlord_desc: "Một $game_concept_overlord$ là [ruler|E] mà một ruler khác đã cam kết tuân lệnh, dưới dạng [vassal|E] hoặc [tributary|E]. Cả [suzerains|E] và [lieges|E] đều là overlords."
  game_concept_overlord_possessive: "Của Chúa Tể Tối Cao"

  game_concept_settlement_issue: "Vấn Đề Định Cư"
  game_concept_settlement_issue_desc: "Vấn Đề Định Cư là nhiệm vụ dành cho [nomad|E] [ruler|E] sau khi hoàn tất [migration|E] đến vùng đất mới. Giúp xử lý xung đột và tăng [county_control|E] tại [domain|E] mới.\n\nCác vấn đề này tiếp tục xảy ra trong những năm đầu sau khi ruler di cư, khi county có kiểm soát thấp."

  game_concept_settlement_issue_tier: "Cấp Vấn Đề Định Cư"
  game_concept_settlement_issue_tier_desc: "Mỗi [settlement_issue|E] có Cấp Vấn Đề Định Cư, phản ánh phần thưởng tổng thể khi giải quyết thành công. Giải quyết vấn đề cấp cao thường nhận phần thưởng lớn hơn ngoài [county_control|E]."

  game_concept_unmanaged_holdings: "Các Lãnh Thổ Không Quản Lý"
  game_concept_unmanaged_holding: "Lãnh Thổ Không Quản Lý"
  game_concept_unmanaged_holdings_desc: "Đây là các [holdings|E] bị vô hiệu, không tính vào [domain_limit|E]."

  game_concept_nerge: "Nerge"
  game_concept_nerge_outcome: "Kết Quả Nerge"
  game_concept_nerge_desc: "Nerge là dạng [GetActivityType('activity_hunt').GetName] đặc biệt cho [GetGovernment( 'nomad_government' ).GetName] [rulers|E]. Thay vì săn một con vật, đây là săn quy mô lớn với hàng trăm hoặc nghìn vật bị giết.\n\nThay vì [hunt_success_chance|E] thông thường, nó tính điểm Kết Quả Nerge dựa trên số lượng vật bị giết, quyết định phần thưởng [activity_host_short|E] và [activity_guests_short|E].\n\nNerge thành công thường thưởng:\n$BULLET_WITH_TAB$[legitimacy_i][legitimacy|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[dread_i][dread|E]\n$BULLET_WITH_TAB$[gold_i][gold|E]\nTrong một số trường hợp:\n$BULLET_WITH_TAB$[martial_i][martial|E]\n$BULLET_WITH_TAB$[command_modifier_i][commander_trait|E] hoặc [trait_level_track_xp|E]"

  game_concept_dominate_title: "Chinh Phục Chức Vụ"
  game_concept_domination_war: "Chiến Tranh Thống Trị"
  game_concept_dominate_title_desc: "[nomads|E] muốn giành [title|E] cao hơn mà không [migrating|E] có thể chiến đấu với dân cư địa phương để đoạt chức, miễn là có [dominance|E] thích hợp.\n\nNếu có người giữ title, họ sẽ bắt đầu chiến tranh để đoạt title. Nếu không, họ chiến đấu với tất cả phi-[tributary|E], phi-[ally|E] trong khu vực [de_jure|E].\n\nThắng trận, kẻ tấn công giành title, tất cả defenders trở thành Tributary. Thua trận, trả [gold_i][gold|E] và mất nhiều [dread_i][dread|E].\n\nNếu [decision|E] holder nắm toàn bộ De Jure, họ giành title ngay lập tức."

  game_concept_expand_dominance: "Mở Rộng Quyền Lực"
  game_concept_dominance_expansion: "Mở Rộng Quyền Lực"
  game_concept_expand_dominance_desc: "Chiến tranh đặc biệt cho [GetGovernment( 'nomad_government' ).GetName] [rulers|E] để mở rộng khu vực [de_jure|E] hoặc thêm vùng biên giới mới.\n\nTất cả Nomadic Rulers có [duchy|E] [title_tier|E] trở lên có thể bắt đầu chiến tranh trong De Jure. Thắng trận, họ có thể [vassalize|E] defender, bắt làm [tributary|E] hoặc chiếm đất.\n\nĐể mở rộng sang đất ngoại quốc, ruler cần [kingdom|E] Tier hoặc cao hơn. Thắng trận, vẫn Vassalize, Tributarize hoặc chiếm đất, đồng thời vùng đất chuyển De Jure về primary title của ruler."

  game_concept_paiza: "Paiza"
  game_concept_paiza_desc: "Paiza, hay gerege, là bảng kim loại nhỏ do các [characters|E] quyền lực trong [the_great_steppe|E] phát hành, mở rộng quyền lực Khan cho người mang.\n\nVề cơ chế, là [artifacts|E] mà ruler mạnh [GetGovernment( 'nomad_government' ).GetName] phát cho người ưa thích thông qua #V$mpo_interaction_grant_paiza$#! [character_interaction|E].\nSau khi dùng #V $mpo_establish_paiza_system_decision$#! [decision|E], Ngài có #V $mpo_call_for_merchants_decision$#! [decision|E] để giao thương với dân định cư, được cải thiện nhờ [internal_upgrades|E] của [GetDomicileBuilding('trade_yurt_01').GetName] [yurt_buildings|E]\n\n[characters|E] mang Paiza có tên Gurkhan sống được dùng #V $mpo_abuse_authority_paiza_decision$#! [decision|E] và #V $mpo_interaction_leverage_khan_authority$#! [character_interaction|E]\n\n#weak Bởi quyền lực của Thiên Đường Vĩnh Hằng. Bởi sự bảo hộ của Phúc Lộc Hoàng Đế. Chiếu lệnh của Khan; bất kỳ ai không tôn trọng sẽ bị trừng phạt, bị chết.#!"
