l_english:
  mpo_the_great_steppe.0001.t: "Thảo Nguyên Vĩ Đại"
  mpo_the_great_steppe.0001.desc: "Một biển cỏ và đá vô tận. Thảo nguyên không phải là một mái nhà nhân từ. Lều trại được dựng lên và tháo xuống theo mùa — cả làng di chuyển qua bão tuyết khắc nghiệt hoặc trước kẻ thù mạnh hơn.\n\nCon người phải phụ thuộc vào thú dữ. Những gì bầy gia súc cần để sống sót, đó là những gì chúng sẽ có.\n\nAi sẽ chinh phục thiên nhiên và vươn lên làm Khan của các Khan?"
  mpo_the_great_steppe.0001.a: "Cùng nhau, ta cưỡi!" 
 
  mpo_the_great_steppe.0002.t: "[my_subregion.GetNameNoTooltip]: [my_subregion.GetCurrentPhase.GetName]"
  mpo_the_great_steppe.0002.desc.cold_zud: "Cái lạnh cắt da thịt, da quanh má Ta bắt đầu bong tróc. Thú vật run rẩy dưới gió mạnh, thiếu năng lượng để tự kiếm thức ăn."
  mpo_the_great_steppe.0002.desc.drought: "Đất cằn cỗi và khô khan như vết thương chưa lành. Cỏ đã héo khô và thú vật tranh giành từng cọng cuối cùng.\n\nĐã đến lúc chiến đấu hoặc chạy trốn."
  mpo_the_great_steppe.0002.desc.white_zud: "Không cỏ nào có thể nhìn thấy dưới lớp tuyết dày. Trắng như mặt trăng, cái chết đến để lấy đi thú vật của chúng ta."
  mpo_the_great_steppe.0002.desc.warm_nights: "Chim hót và trẻ con nô đùa. Ta thấy [person.GetFirstName] nằm trên cỏ với mắt [person.GetHerHis] nhắm nghiền, tắm mình trong ánh nắng.\n\nTiếng kêu yếu ớt vang lên từ giữa lũ vật nuôi, những con bê và cừu non mới sinh được chăm sóc bằng sự dịu dàng nhất.\n\nNếu chỉ có thể mãi như thế này thì tốt biết bao."
  mpo_the_great_steppe.0002.desc.abundant_grazing: "Cỏ mọc cao đến mức trẻ con bị lạc trong đó, các bà mẹ cười khi tìm thấy chúng.\n\nMột bầy gia súc khỏe mạnh hơn không thể tưởng tượng nổi, hay một thời gian hạnh phúc hơn."
  mpo_the_great_steppe.0002.desc.havsarsan_zud: "Sông cạn và đồng cỏ chết khô. Băng phủ đất, không gì có thể mọc. Thú vật chết rơi rụng và chúng ta cũng sớm theo sau.\n\n[ROOT.Char.GetFaith.HighGodName] hãy cứu chúng ta, nếu không chúng ta sẽ phải xuống [ROOT.Char.GetFaith.NegativeAfterLife]."
  mpo_the_great_steppe.0002.desc.sky_blessing: "Hoa nở rộ và thú vật khỏe mạnh hơn bao giờ hết. Đồng cỏ lan rộng tới những vùng tưởng chừng đã chết suốt nhiều thế hệ.\n\nMỗi đứa trẻ sinh ra được ban phước với tình yêu của [ROOT.Char.GetFaith.HealthGodName] và sức mạnh của [ROOT.Char.GetFaith.WarGodName].\n\nChỉ cần nhắm mắt lại, Ta có thể tưởng tượng chúng ta đang ở [ROOT.Char.GetFaith.PositiveAfterLife]."
  mpo_the_great_steppe.0002.desc.obedience: "\n\nTuy nhiên, với khả năng sống sót thấp hơn, con người dễ dàng bị buộc phải thề phục tùng."
  mpo_the_great_steppe.0002.a: "Và thế giới vẫn tiếp tục xoay."
  mpo_the_great_steppe.0002.tt: "Mùa [steppe_season|E] đã thay đổi"
  mpo_the_great_steppe_0002_souvenirs_aplenty_tt: "Nhờ [GetPerk('souvenirs_aplenty_perk').GetName( GetPlayer )] [perk|E] của ngươi"
  souvenirs_aplenty_perk_county_modifier: "Sự Thay Đổi Của Các Mùa"
  souvenirs_aplenty_perk_county_modifier_desc: "Nhờ trải nghiệm lối sống, nhân vật này đã học cách đối phó tốt nhất với sự thay đổi của các mùa."
