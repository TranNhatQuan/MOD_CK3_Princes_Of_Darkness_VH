  mpo_decisions_events.0120.t: "Con đường của Người Du Mục"
  mpo_decisions_events.0120.desc.intro: "Đã đến lúc biến trại của ta thành một thứ gì đó lớn hơn: một khu định cư di động băng qua thảo nguyên theo nhịp đổi mùa.\n\n\"Ta hy vọng những vùng đất này sẽ phục vụ tốt cho ngươi,\" người chăn cừu dẫn dắt dân trước chúng ta chào đón chúng ta vào lều của [herder.GetHerHis]."
  mpo_decisions_events.0120.desc.subject: "\n\n\"[nomad.GetTitledFirstName] là chúa tể của ta,\" [herder.GetSheHe] tiếp tục với giọng cảnh báo, \"và cống phẩm là điều mà [nomad.GetSheHe] đòi hỏi.\""
  mpo_decisions_events.0120.a: "\"Dẫu sao đây cũng là đất đai của [nomad.GetHerHis].\""
  mpo_decisions_events.0120.b: "\"Ta không đến đây để làm thần phục ai cả.\""
  mpo_decisions_events.0120.c: "\"Không có lý do gì để ngươi phải rời đi.\""
  mpo_decisions_events.0120.d: "\"Chúng ta sẽ tiếp quản từ đây.\""

  invite_a_siege_engineer_decision: "Tìm Kỹ Sư Công Thành"
  invite_a_siege_engineer_decision_tooltip: "Các thuộc hạ của Ngài sẽ đề xuất một số ứng viên phù hợp cho vị trí [GetCourtPositionType('siege_engineer_court_position').GetName()]"
  invite_a_siege_engineer_decision_desc: "Đã đến lúc tìm một người có thể phá vỡ tường thành của kẻ thù."
  mpo_decisions_events.0080.t: "Chuyên môn từ xa"
  mpo_decisions_events.0080.desc: "Ta đã gửi thư khắp nơi, tìm kiếm một người có thể hỗ trợ ta về chuyên môn kỹ thuật. Dù lúc đầu dường như là nhiệm vụ bất khả, cuối cùng hai ứng viên đã xuất hiện tại trại của ta.\n\n[great_siege_engineer_option.GetFirstName] là lựa chọn tốt hơn trong hai người, nhưng đắt hơn [good_siege_engineer_option.GetFirstName]. Dù sao đi nữa, ta cuối cùng cũng có người hỗ trợ quân đội nơi chúng ta thiếu thốn."
  mpo_decisions_events.0080.a: "[great_siege_engineer_option.GetFirstNameNoTooltip] biết việc."
  mpo_decisions_events.0080.b: "[good_siege_engineer_option.GetFirstNameNoTooltip] sẽ ổn."
  mpo_decisions_events.0080.c: "Ta không quan tâm đến cả hai."
  mpo_decisions_events.0080.a.aptitude: "[great_siege_engineer_option.GetFirstNamePossessiveNoTooltip] [aptitude|E] là [great_siege_engineer_option.GetCourtPositionAptitude( GetCourtPositionType( 'siege_engineer_court_position' ) )]"
  mpo_decisions_events.0080.b.aptitude: "[good_siege_engineer_option.GetFirstNamePossessiveNoTooltip] [aptitude|E] là [good_siege_engineer_option.GetCourtPositionAptitude( GetCourtPositionType( 'siege_engineer_court_position' ) )]"

  invite_a_foreign_emissary_decision: "Tìm Sứ Giả Ngoại Quốc"
  invite_a_foreign_emissary_decision_tooltip: "Các thuộc hạ của Ngài sẽ đề xuất một số ứng viên phù hợp cho vị trí [GetCourtPositionType('foreign_emissary_court_position').GetName()]"
  invite_a_foreign_emissary_decision_desc: "Ta cần một người kể chuyện lạ lùng để giải trí triều đình."
  mpo_decisions_events.0090.t: "Một hoặc Ba Câu Chuyện"
  mpo_decisions_events.0090.desc: "Ta ngả lưng trên ghế và cảm thấy buồn ngủ khi nghe [courtier.GetFirstName] kể lại cùng một câu chuyện lần thứ mười lăm. Ta cần một người, #emp ai đó#!, kể cho ta điều gì đó mới mẻ.\n\nSau khi gửi thông điệp qua các thương nhân đi qua, hai cá nhân cuối cùng xuất hiện tại [ROOT.Char.GetCapitalLocation.GetName]. Họ đều kể về những vùng đất lạ, núi cao chót vót và sa mạc vô tận."
  mpo_decisions_events.0090.a: "[great_foreign_emissary_option.GetFirstNameNoTooltip] có rất nhiều câu chuyện để kể."
  mpo_decisions_events.0090.b: "[good_foreign_emissary_option.GetFirstNameNoTooltip] có vẻ dễ mến."
  mpo_decisions_events.0090.c: "Cả hai đều thiếu sót."
  mpo_decisions_events.0090.a.aptitude: "[great_foreign_emissary_option.GetFirstNamePossessiveNoTooltip] [aptitude|E] là [great_foreign_emissary_option.GetCourtPositionAptitude( GetCourtPositionType( 'foreign_emissary_court_position' ) )]"
  mpo_decisions_events.0090.b.aptitude: "[good_foreign_emissary_option.GetFirstNamePossessiveNoTooltip] [aptitude|E] là [good_foreign_emissary_option.GetCourtPositionAptitude( GetCourtPositionType( 'foreign_emissary_court_position' ) )]"

  nomad_higher_tier_title_decision: "[ROOT.Char.Custom('GetDominateTitleLoc')]"
