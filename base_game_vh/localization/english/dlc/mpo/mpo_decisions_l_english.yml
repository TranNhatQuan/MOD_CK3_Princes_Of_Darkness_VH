  nomad_higher_tier_title_decision_desc: "Đã đến lúc chứng tỏ quyền thống trị của ta trên khu vực này, và khuất phục những ai sinh sống tại đây. Tất cả sẽ bị nghiền nát dưới móng ngựa của chúng ta khi chúng ta giành lấy những gì thuộc về mình."
