  become_nomadic_decision: "Trở Thành Du Mục"
  become_nomadic_decision_desc: "Mặt đất dưới chân chúng ta đã neo giữ chúng ta hàng thế hệ, nhưng thảo nguyên không ưu ái kẻ đứng yên. Chúng ta đã chứng kiến các kỵ sĩ thảo nguyên — họ phiêu du tự do, không ràng buộc bởi tường thành, của cải mang theo như gió.\n\nGiờ đây, ta bỏ lại gánh nặng của đời sống định cư."
  become_nomadic_decision_tooltip: "Áp dụng [GetGovernment( 'nomad_government' ).GetNameWithIcon] [government|E]"
  become_nomadic_decision_confirm: "Không nhà nào ngoài lều du mục."

  settle_the_steppe_decision: "Định Cư Trên Thảo Nguyên"
  settle_the_steppe_decision_desc: "Thảo nguyên đã nuôi đàn vật, chở kỵ sĩ, và xua đuổi kẻ thù. Nhưng giờ ta trải đá nơi ngựa từng dậm. Không còn theo đuổi chân trời — ta sẽ đem chân trời đến với ta.\n\nTa vẫn là con của thảo nguyên. Nhưng ta sẽ mọc rễ trên đất, xây tường trong gió, và biến lửa trại thành lò sưởi."
  settle_the_steppe_decision_tooltip: "Định cư [ROOT.Char.GetDomicile.GetFaith.GetAdjective] [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] của Ngài theo [GetGovernment('tribal_government').GetName], [GetGovernment('feudal_government').GetName], hoặc [GetGovernment('clan_government').GetName], từ bỏ lối sống [GetGovernment( 'nomad_government' ).GetName]."
