  mpo_decisions_events.0021.t: "Phong Tục Chào Đón"
  mpo_decisions_events.0021.desc_intro: "Khi [friendship_target.GetSheHe] sắp xếp thức ăn và đồ uống để chào đón,"
  mpo_decisions_events.0021.desc_warm: "[ROOT.Char.Custom2('RelationToMe', friendship_target)] của Ta, [friendship_target.GetTitledFirstName], dường như băn khoăn không biết phải làm gì với chúng Ta. [friendship_target.GetSheHe|U] bày ra những chiến lợi phẩm trong ngày. Chúng Ta nói về những cuộc săn lùng huy hoàng trong quá khứ. [ROOT.Char.Custom2('RelationToMe', loc_heir)] của Ta ít nói, và mỉm cười lặng lẽ."
  mpo_decisions_events.0021.desc_cold: "[ROOT.Char.Custom2('RelationToMe', friendship_target)] của Ta, [friendship_target.GetTitledFirstName], lạnh lùng và vô cảm như một đống đá cổ. Và mặc dù [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] biết ý muốn của Ta, [heir.GetFirstName] chỉ [heir.Custom('quirk_pos_present')], rồi lặng lẽ tận hưởng hơi ấm của lửa."
  mpo_decisions_events.0021.desc: "\n\nChính Ta phải dắt hai con ngựa này vào cùng một chuồng, phải tạo dựng lòng tin vượt qua cả xác thịt sống của mình..."
  mpo_decisions_events.0021.a.success: "Ngài giúp [friendship_target.GetFirstNameNoTooltip] thấy được phẩm chất cao quý nhất của [heir.GetFirstNamePossessiveNoTooltip]"
  mpo_decisions_events.0021.a: "Chỉ lời nói của Ta mới có thể gắn kết họ."
  mpo_decisions_events.0021.a.flavor: "Dựa vào khả năng ngoại giao của Ngài."
  mpo_decisions_events.0021.a.fail: "Sự hiện diện của Ngài làm lu mờ [heir.GetFirstNamePossessiveNoTooltip]"
  mpo_decisions_events.0021.b: "\"Cũng như Ngài, [heir.GetFirstNameNoTooltip] là một [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]!\""
  mpo_decisions_events.0021.b.flavor: "Dựa vào điểm chung giữa người thừa kế và [ROOT.Char.Custom2('RelationToMeShort', friendship_target)]: cả hai đều là [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]."
  mpo_decisions_events.0021.b.success: "[heir.GetFirstNameNoTooltip] và [friendship_target.GetFirstNameNoTooltip] tận hưởng sở thích chung"
  mpo_decisions_events.0021.b.fail: "Họ cãi nhau và bất hòa"
  mpo_decisions_events.0021.c: "Cả hai đều giỏi thể thao truyền thống."
  mpo_decisions_events.0021.c.flavor: "Dựa vào kinh nghiệm [GetTrait('tourney_participant').GetName( GetNullCharacter )] mà hai người chia sẻ."
  mpo_decisions_events.0021.c.success: "Tình bạn được gắn kết qua cạnh tranh"
  mpo_decisions_events.0021.c.fail: "[heir.GetFirstNameNoTooltip] và [friendship_target.GetFirstNameNoTooltip] cư xử quá thô bạo với nhau"
  mpo_decisions_events.0021.d: "Hai người quá giống nhau."
  mpo_decisions_events.0021.d.flavor: "Dựa vào những phẩm chất chung của cả hai."
  mpo_decisions_events.0021.d.success: "[heir.GetFirstNameNoTooltip] và [friendship_target.GetFirstNameNoTooltip] gắn kết nhờ các phẩm chất chung"
  mpo_decisions_events.0021.d.fail: "Sự giống nhau không làm họ rung động"
  mpo_decisions_events.0021.e: "\"Chúng ta chia sẻ những mối liên kết quý giá, và chúng #EMP phải#! bền lâu.\""
  mpo_decisions_events.0021.e.flavor: "Dựa vào bất kỳ mối liên kết văn hóa, gia đình và cá nhân giữa Ngài và [friendship_target.GetTitledFirstNameNoTooltip]."
  mpo_decisions_events.0021.e.success: "Ngài dễ dàng giải thích về quan hệ huyết thống với [friendship_target.GetFirstNameNoTooltip]"
  mpo_decisions_events.0021.e.fail: "[heir.GetFirstNameNoTooltip] chỉ thấy một người lạ thân thiện"
  mpo_decisions_events.0021.f: "Quà tặng sẽ nâng cao tinh thần họ..."
  mpo_decisions_events.0021.f.flavor: "Dựa vào niềm vui từ của cải."

  heir_friend_will_not_become_friends_tt: "[heir.GetFirstNameNoTooltip] và [friendship_target.GetFirstNameNoTooltip] chưa trở thành [friends|E]"

  mpo_heir_friend_if_accept_tt: "Nếu [friendship_target.GetShortUIName] chấp nhận:"
  mpo_heir_friend_if_do_not_accept_tt: "\"Nếu [friendship_target.GetShortUIName] không chấp nhận:\""

  mpo_decisions_events.0022.t: "Khách từ [root_scope.GetCapitalLocation.GetNameNoTooltip]"
  mpo_decisions_events.0022.desc_intro: "[ROOT.Char.Custom2('RelationToMeShort', root_scope)], [root_scope.GetName], đã đến [ROOT.Char.GetCapitalLocation.GetName]. [heir.GetFirstName], người thừa kế [heir.Custom('ComplimentAdjective')] của [root_scope.GetHerHis], ôm lấy Ta.\n\nKhi Ta quấn [Glossary( 'khatag', 'KHATAG_GLOSS' )] bằng da cừu quanh ngón tay đeo nhẫn và đưa đầu khăn ra để chào,"
  KHATAG_GLOSS: "Một chiếc khăn lễ bằng lụa hoặc da cừu biểu thị sự tôn trọng, dùng làm quà, dấu hiệu chào đón, và cúng trong các nơi linh thiêng. #G khatag#! bắt nguồn từ Tây Tạng, nhưng được cả Phật tử và những người theo Tengrism ở thảo nguyên Eurasia sử dụng."
  mpo_decisions_events.0022.desc_personal_charm: "[root_scope.GetFirstNameNoTooltip] nói về [root_scope.Custom2('RelationToMe', loc_heir)] của mình: \"Một [heir.GetCulture.GetName] thực thụ! Một [heir.GetWomanMan] được định mệnh đánh dấu! Ta đã kể với [heir.GetFirstNameNoTooltip] về [friendship_target.Custom('ComplimentAdjective')] quyền lực của Ngài. [heir.GetSheHe|U] muốn hiểu Ngài nhiều hơn cả Ta.\""
  mpo_decisions_events.0022.desc_lifestyle: "[heir.GetFirstNameNoTooltip] nói: \"Một người [lifestyle_trait.GetNameNoTooltip( loc_heir )|l] chào hỏi người khác! Cùng nhau, chúng ta sẽ nói về quyền lực và tình thân — và làm những gì chúng ta thực sự yêu thích.\""
  mpo_decisions_events.0022.desc_sports: "[heir.GetFirstNameNoTooltip] mời Ta ra sân. \"Ngài và Ta là bậc thầy của cùng một môn thể thao! Trong khi nói về huyết thống và quyền lực, hãy rèn luyện kỹ năng của một [ROOT.Char.GetCulture.GetName]!\""
  mpo_decisions_events.0022.desc_shared_traits: "[root_scope.GetFirstNameNoTooltip] cười. \"[heir.GetFirstNameNoTooltip] thực sự là phản chiếu của Ngài trong nước! [heir.GetSheHe|U] cư xử y hệt. Ta luôn nói với [heir.GetHerHim]: chính Ngài giống người đó nhất, sẽ hiểu người đó tốt nhất, ủng hộ nhiều nhất!\""
  mpo_decisions_events.0022.desc_kinship: "[heir.GetFirstNameNoTooltip] nắm chặt vai Ta.\n\n\"Với [heir.Custom2('RelationToMeShort', root_scope)], Ngài là con ngựa trung thành không bỏ đi. Nhưng Ngài sẽ ở lại bên chúng Ta trong những năm tới chứ? Ngài sẽ tìm thấy Ta khi [root_scope.GetHerHis] lạnh lẽo?\""
  mpo_decisions_events.0022.desc_gift: "[root_scope.GetFirstNameNoTooltip] tặng Ta và [heir.GetFirstNameNoTooltip] [Glossary( 'deels', 'DEEL_GLOSS' )] lót cashmere và cương của hai con ngựa trắng. \"Như các Ngài đồng đều trong sự thịnh vượng,\" [root_scope.GetSheHe] nói, \"hãy để hai Ngài đồng đều trong Tình bạn. Chỉ trong Tình bạn, thịnh vượng mới phát triển.\""
  DEEL_GLOSS: "Chiếc áo khoác gấp, hình thức truyền thống của trang phục dân thảo nguyên, mặc bởi cả nam và nữ."
  mpo_decisions_events.0022.desc_outro: "\n\nHai vị khách của Ta ra về, kể về cách [heir.GetFirstNameNoTooltip] sẽ một ngày dẫn dắt [root_scope.GetHouse.GetName]... và vị trí danh dự mà Ta sẽ có trong [heir.GetHerHis] [root_scope.Custom('ResidenceBuilding')|l]."

  mpo_decisions_events.0022.a: "\"#EMP Im đi, lời nói!#! Mối quan hệ của chúng ta sẽ được xây bằng máu.\""
  mpo_decisions_events.0022.b: "\"Vì [heir.GetSheHe] đã được hứa hẹn, Ta vui lòng tuân lệnh [root_scope.GetTitleAsNameNoTooltip]!\""
  mpo_decisions_events.0022.c: "\"Mong Ngài thường xuyên trở lại, để ngồi bên lửa của Ta.\""
  mpo_decisions_events.0022.d: "Chúng ta sẽ có một buổi tối khai sáng qua trò chuyện. Ít hơn thế thôi."

  cultural_acceptance_friendly_visit: "Những chuyến thăm thân thiện giữa quý tộc"

  mpo_decisions_events.0023.t: "Vượt Qua Phong Tục"
  mpo_decisions_events.0023.desc: "Những ngọn lửa cuối cùng vẫn còn sáng.\n\nChúng Ta đã dùng bữa và trò chuyện khuya, làm các đứa trẻ ngủ gật bật dậy bởi tiếng cười và hốt hoảng bởi tiếng hát cổ họng. Ta hầu như không cần hát — hay nói — khi [friendship_target.GetTitledFirstName] và [heir.GetFirstName] tán gẫu về những cuộc vui trong ngày, và mơ về những cuộc vui sắp tới.\n\nTối nay, Ta đã mang hai tâm hồn quý tộc đến Tình bạn."
  mpo_decisions_events.0023.desc_fail: "Những ngọn lửa cuối cùng vẫn còn sáng.\n\nDù vậy, tiếng cười nhẹ nhàng; lời nói dễ chịu, nhưng bay đi như những chú chim nhỏ. Dù Ta đã khuyên bảo, trái tim [friendship_target.Custom('ComplimentAdjective')] của [friendship_target.GetFirstName] dường như vẫn ẩn giấu khỏi người thừa kế.\n\nTa chỉ hy vọng rằng, khi Ta chỉ còn là xương cốt, họ có thể tạo nên Tình bạn."
  mpo_decisions_events.0023.desc_accidental_friend: "Có lẽ [ROOT.Char.Custom2('RelationToMeShort', accidental_friend)] của Ta, người mà [friendship_target.GetTitledFirstName] #EMP dường như hoàn toàn say mê, sẽ đưa [heir.GetFirstName] vào cùng mối quan hệ ấy!"

  mpo_decisions_events.0023.a: "Một người ủng hộ trung thành cho [heir.GetFirstNameNoTooltip]."
  mpo_decisions_events.0023.a_fail: "Một thất vọng, nhưng đêm vẫn vui vẻ."

  EVENT_WINDOW_OPTION_AVAILABLE_HASTILUDER: "Tùy chọn này có sẵn nhờ kinh nghiệm [GetTrait('tourney_participant').GetName( GetNullCharacter )]"

  study_commander_trait_decision: "Thành thạo Nghệ Thuật Chỉ Huy"
  study_commander_trait_decision_desc: "Nhân dân của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] là phản chiếu của lãnh đạo. Ta không thể ngồi yên khi dân của Ta chết vì đất đai, và các chỉ huy thất bại trong việc học từ sai lầm. Ta phải nắm quyền, và dẫn dắt họ đến vinh quang."
  study_commander_trait_decision_tooltip: "Nhận [stress|E] để có cơ hội đạt [commander_trait|E]"
  study_commander_trait_decision_confirm: "Hướng đến Chiến Thắng!"
  study_commander_trait_decision_effect: "Ngài sẽ bắt đầu một hành trình [Concept('stress','stressful')|E] để có cơ hội đạt [commander_trait|E]"

  mpo_decisions_events.0200.t: "Đến $study_commander_trait_decision$"
  mpo_decisions_events.0200.desc: "Ta tới kho vũ khí, chọn một thanh kiếm tốt từ giá. Ta quan sát binh sĩ, động tác, sự say xỉn, và thiếu kỷ luật của họ. Trước khi ghê tởm, Ta phải học cách chỉ huy họ. Tại sao một người lại tuân theo luật nếu luật không tuân theo người đó?\n\nKhi Ta rời đi, Ta thấy [commander_trait_mentor.GetName] quan sát từ xa. [commander_trait_mentor.GetSheHe|U] là chiến binh hùng mạnh, dù xung quanh toàn kẻ yếu trong kho vũ khí này. Có lẽ [commander_trait_mentor.GetSheHe] có thể dạy Ta vài điều."
  mpo_decisions_events.0200.desc_my_mentor: "[commander_trait_mentor.GetSheHe|U] đã giúp Ta trong việc này trước đây, nên Ta có thể tìm đến [commander_trait_mentor.GetHerHim] lần nữa."
  mpo_decisions_events.0200.desc_mentor: "[commander_trait_mentor.GetSheHe|U] đã giúp người khác trong việc này trước đây, nên [commander_trait_mentor.GetSheHe] có uy tín tốt."
  mpo_decisions_events.0200.mentor: "Hình như [commander_trait_mentor.GetSheHe] sẽ có một học trò mới."
  mpo_decisions_events.0200.my_mentor: "Chúng ta gặp lại, [commander_trait_mentor.GetTitledFirstName]."
  mpo_decisions_events.0200.mentor_flavor: "Ngài nhờ sự giúp đỡ của [commander_trait_mentor.GetNameNoTooltip] trong nỗ lực trở thành chỉ huy giỏi hơn."
  mpo_decisions_events.0200.mentor_traits: "Nhờ [commander_trait_mentor.GetNamePossessive] [commander_traits|E]:"
  study_commander_trait_bonus: "Nhờ vào [traits|E] của Ngài:"
  mpo_decisions_events.0200.a: "Ta phải làm việc này một mình."
  mpo_decisions_events.0200.alone: "Hành trình của Ngài sẽ phần nào #bold không thể đoán trước#! và #bold không có hướng dẫn#!"
  mpo_decisions_events.0200.martial: "Tư duy chiến thuật của Ta sắc bén, và sẽ đủ."
  mpo_decisions_events.0200.martial_flavor: "Con đường đến chiến thắng là cô độc, nhưng Ngài sẽ #bold được dẫn dắt#! nhờ hiểu biết về chiến tranh."
  mpo_decisions_events.0200.learning: "Ta thích học từ các biên niên sử và trí tuệ của học giả."
  mpo_decisions_events.0200.learning_flavor: "Ngài sẽ #bold được dẫn dắt#! nhờ trí tuệ từ các trận chiến trước và tác phẩm của các tướng vĩ đại."
  mpo_decisions_events.0200.intrigue: "Ta sẽ đánh lừa kẻ thù và khôn khéo vượt qua đối thủ."
  mpo_decisions_events.0200.intrigue_flavor: "Ngài sẽ #bold được dẫn dắt#! nhờ mưu mẹo, được tiếp sức từ lời đồn đại trong triều đình và chiến tranh."

  mpo_decisions_events.0201.t: "Những Thử Thách Lãnh Đạo"
  mpo_decisions_events.0201.desc_intro: "Bây giờ khi Ta đã bắt đầu huấn luyện nghiêm túc, Ta phải tìm hiểu điểm mạnh và điểm yếu của mình. Ta nhận ra rằng thường Ta [ROOT.Char.Custom('DescriptorNegativeStandalone')], nhưng Ta không thể để điều đó làm hại mình.\n\nTa phải tập trung vào điểm yếu nhất của mình."
  mpo_decisions_events.0201.desc_mentor: "\n\n'Mỗi trận đấu sẽ khác nhau, [ROOT.Char.GetFirstName].' [commander_trait_mentor.GetNameNoTooltip] nói, 'Ngài phải chuẩn bị cho mọi thứ. Kẻ thù sẽ không chờ Ngài sẵn sàng. Điểm yếu của Ngài trong trận chiến là gì? Hãy nói cho Ta.'"
  mpo_decisions_events.0201.martial_1: "Trên chiến trường, Ta chỉ là một trong nhiều người. Nhưng một mình, Ta yếu."
  study_commander_trait_option_mentor_desc: "Ngài đối đầu với [commander_trait_mentor.GetNameNoTooltip]"
  study_commander_trait_option_success: "Ngài học được nhiều từ thử thách"
  study_commander_trait_option_success_ok: "Ngài tiến bộ trong huấn luyện"
  study_commander_trait_option_fail: "Ngài vẫn chưa nắm được vấn đề"
  study_commander_trait_option_fail_ok: "Ngài vẫn chưa thành thạo nghệ thuật chỉ huy"
  mpo_decisions_events.0201.martial_1_mentor_success: "Ngài đánh bại [commander_trait_mentor.GetNameNoTooltip] trong một trận đấu tay đôi"
  mpo_decisions_events.0201.martial_1_mentor_fail: "[commander_trait_mentor.GetNameNoTooltip] chiến thắng Ngài"
  mpo_decisions_events.0201.martial_1_flavor: "Điểm yếu của Ngài là không thể chiến đấu một mình"
  mpo_decisions_events.0201.martial_1_tt: "Cố gắng rèn luyện kỹ năng đấu tay đôi và luyện tập với một binh sĩ trong doanh trại"
  mpo_decisions_events.0201.martial_1_success: "Ngài đánh bại đối thủ"
  mpo_decisions_events.0201.martial_1_fail: "Binh sĩ đánh bại Ngài"
  mpo_decisions_events.0201.martial_2: "Ta phải học cách chiến đấu cùng người khác."
  mpo_decisions_events.0201.martial_2_flavor: "Điểm yếu của Ngài là không thể chiến đấu cùng người khác"
  mpo_decisions_events.0201.martial_2_tt: "Ngài tập hợp một nhóm binh sĩ để luyện tập đội hình trong sân"
  mpo_decisions_events.0201.martial_2_success: "Ngài dẫn dắt một phòng thủ kiên cố"
  mpo_decisions_events.0201.martial_2_fail: "Binh sĩ của Ngài rối loạn và dễ bị đánh bại"
  mpo_decisions_events.0201.learning_1: "Hiểu kẻ thù là một nửa trận chiến, nắm vững địa hình là nửa còn lại."
  mpo_decisions_events.0201.learning_1_flavor: "Điểm yếu của Ngài là thiếu hiểu biết về địa hình"
  mpo_decisions_events.0201.learning_1_tt: "Ngài khảo sát vùng đất, tìm vị trí tốt nhất để bố trí lực lượng."
  mpo_decisions_events.0201.learning_1_mentor: "[commander_trait_mentor.GetNameNoTooltip] giúp Ngài khảo sát"
  mpo_decisions_events.0201.learning_1_success: "Ngài tìm được vị trí hoàn hảo cho cả phục kích và phòng thủ"
  mpo_decisions_events.0201.learning_1_fail: "Ngài bị lạc trong hoang dã"
  mpo_decisions_events.0201.learning_2: "Vũ khí mang lại lợi thế lớn nhất, nếu Ngài biết sử dụng chúng."
  mpo_decisions_events.0201.learning_2_flavor: "Ngài muốn cải thiện kiến thức về vũ khí và công sự"
  mpo_decisions_events.0201.learning_2_tt: "Ngài nghiên cứu tiến bộ về vũ khí, và cách sử dụng chúng để có lợi thế"
  mpo_decisions_events.0201.learning_2_mentor: "[commander_trait_mentor.GetNameNoTooltip] giải thích chi tiết về vũ khí"
  mpo_decisions_events.0201.learning_2_success: "Ngài có thể sử dụng vũ khí hiệu quả hơn, thậm chí cải thiện vũ khí mình có"
  mpo_decisions_events.0201.learning_2_fail: "Những thay đổi trong lịch sử quá khó để Ngài nắm bắt"
  mpo_decisions_events.0201.intrigue_1_flavor: "Ngài muốn cải thiện khả năng thuyết phục hoặc thao túng kẻ thù và đồng minh"
  mpo_decisions_events.0201.intrigue_1: "Ta phải hiểu tâm lý người khác."
  mpo_decisions_events.0201.intrigue_1_tt: "Ngài tập hợp một nhóm dân thường và cố thuyết phục họ làm theo ý Ngài"
  mpo_decisions_events.0201.intrigue_1_mentor: "[commander_trait_mentor.GetNameNoTooltip] đưa ra lời khuyên về thao túng"
  mpo_decisions_events.0201.intrigue_1_success: "Đám đông bị thuyết phục, mặc dù ban đầu họ miễn cưỡng"
  mpo_decisions_events.0201.intrigue_1_fail: "Không ai lắng nghe Ngài"
  mpo_decisions_events.0201.intrigue_2: "Đôi khi, cách tốt nhất để thắng là không chiến đấu."
  mpo_decisions_events.0201.intrigue_2_flavor: "Ngài muốn cải thiện khả năng tránh xung đột"
  mpo_decisions_events.0201.intrigue_2_tt: "Ngài cố thuyết phục một đám đông buông vũ khí"
  mpo_decisions_events.0201.intrigue_2_success: "Đám đông chấp nhận điều kiện của Ngài, và Ngài tránh được một trận chiến"
  mpo_decisions_events.0201.intrigue_2_fail: "Đám đông càng giận dữ hơn bởi lời Ngài nói"
  mpo_decisions_events.0201.none_1: "Không ai sẽ theo một người để họ đói."
  mpo_decisions_events.0201.none_1_flavor: "Ngài muốn học cách phân phối lương thực hiệu quả hơn"
  mpo_decisions_events.0201.none_1_tt: "Ngài suy nghĩ cách tốt nhất để nuôi binh sĩ"
  mpo_decisions_events.0201.none_1_success: "Lương thực đầy đủ, binh sĩ no nê"
  mpo_decisions_events.0201.none_1_fail: "Kế hoạch thất bại, binh sĩ bị đói"
  mpo_decisions_events.0201.none_2: "Mạnh mẽ là bước đầu tiên."
  mpo_decisions_events.0201.none_2_flavor: "Ngài muốn cải thiện sức mạnh thể chất"

  mpo_decisions_events.0202.t: "Diễn Biến Bất Ngờ"
  mpo_decisions_events.0202.desc_battlefield: "Khi trở về từ chiến trường,"
  mpo_decisions_events.0202.desc_study: "Khi trở về sau việc học tập,"
  mpo_decisions_events.0202.desc_terrain: "Khi trở về từ chuyến đi,"
  mpo_decisions_events.0202.desc_town: "Khi trở về từ thị trấn,"
  mpo_decisions_events.0202.desc: "Ta được chào đón bởi [situation_alerter.GetName]. [situation_alerter.GetSheHe|U] bắt đầu kể về một sự kiện gần đây mà [situation_alerter.GetSheHe] cho rằng Ta sẽ quan tâm."
  mpo_decisions_events.0202.desc_1_intro: "[situation_alerter.GetSheHe|U] mô tả một nơi không xa đây.\n\n'Và một nhóm cướp đã chiếm cứ ở đó,' [situation_alerter.GetSheHe] nói. 'Vì lý do đó…'"
  mpo_decisions_events.0202.desc_1_outro: "'Quân thường không có cơ hội!' [situation_alerter.GetSheHe] thốt lên."
  mpo_decisions_events.0202.desc_2: "[situation_alerter.GetSheHe|U] kể về một pháo đài bị bao vây, và cách các binh sĩ phòng thủ nhanh chóng thất thủ. 'Chỉ một phát trebuchet, tường sụp,' [situation_alerter.GetSheHe] nói hớn hở. 'Không ngạc nhiên khi Chúa ở đó đầu hàng nhanh, ông ta không thể chống cự lâu.'"
  mpo_decisions_events.0202.desc_3: "[situation_alerter.GetSheHe|U] kể về một nhóm sĩ quan và binh sĩ bất mãn phản bội, tạo ra âm mưu lật đổ chỉ huy của họ. 'Và giữa đêm – bị đâm!' [situation_alerter.GetSheHe] nói, 'Chỉ huy không hề thấy chuyện này đến.'"
  mpo_decisions_events.0202.desc_outro: "\n\n[situation_alerter.GetFirstNameNoTooltip] hắng giọng, \"Vậy, ngài sẽ làm gì?\""
  mpo_decisions_events.0202.martial_situation_1: "Ta sẽ học địa hình và dùng nó để có lợi."
  mpo_decisions_events.0202.martial_situation_1_flavor: "Ngài nói với [situation_alerter.GetFirstNameNoTooltip] về tầm quan trọng của việc nắm vững địa hình chiến đấu"
  mpo_decisions_events.0202.learning_situation_1: "Nhóm cướp đến từ đâu?"
  mpo_decisions_events.0202.learning_situation_1_flavor: "Ngài giải thích với [situation_alerter.GetFirstNameNoTooltip] rằng học về kẻ thù là bước đầu để đánh bại họ"
  mpo_decisions_events.0202.success: "[situation_alerter.GetFirstNameNoTooltip] gật đầu đồng ý"
  mpo_decisions_events.0202.fail: "[situation_alerter.GetFirstNameNoTooltip] nhìn Ngài với đôi mày nhướn"
  mpo_decisions_events.0202.intrigue_situation_1: "Cướp à? Ta sẽ lợi dụng lòng tham của họ."
  mpo_decisions_events.0202.intrigue_situation_1_flavor: "Ngài chỉ cho [situation_alerter.GetFirstNameNoTooltip] cách khai thác điểm yếu của kẻ thù"
  mpo_decisions_events.0202.none_situation_1: "Họ sẽ không bao giờ phá được phòng thủ của Ta!"
  mpo_decisions_events.0202.none_situation_1_flavor: "Ngài giải thích với [situation_alerter.GetFirstNameNoTooltip] rằng cách tốt nhất để đánh bại kẻ thù là luôn sẵn sàng"
  mpo_decisions_events.0202.martial_situation_2: "Sao lại núp sau tường? Phá hủy nó đi!"
  mpo_decisions_events.0202.martial_situation_2_flavor: "Ngài giải thích với [situation_alerter.GetFirstNameNoTooltip] rằng Ngài sẽ phá hủy thiết bị công sự bằng vũ lực"
  mpo_decisions_events.0202.learning_situation_2: "Mỗi vũ khí đều có đối sách."
  mpo_decisions_events.0202.learning_situation_2_flavor: "Ngài gợi ý nghiên cứu thiết kế vũ khí công sự, tìm điểm yếu hoặc cải tiến"
  mpo_decisions_events.0202.intrigue_situation_2: "Nếu sức mạnh nằm ở vũ khí, hãy lấy nó từ họ"
  mpo_decisions_events.0202.intrigue_situation_2_flavor: "Ngài gợi ý với [situation_alerter.GetFirstNameNoTooltip] rằng Ngài sẽ phá hủy thiết bị công sự"
  mpo_decisions_events.0202.none_situation_2: "Di tản dân thường và để tường sụp."
  mpo_decisions_events.0202.none_situation_2_flavor: "Ngài giải thích với [situation_alerter.GetFirstNameNoTooltip] rằng Ngài sẽ cứu dân và để kẻ thù chiếm pháo đài"
  mpo_decisions_events.0202.martial_situation_3: "Tập hợp những người trung thành và mang trận chiến đến họ!"
  mpo_decisions_events.0202.martial_situation_3_flavor: "Ngài giải thích với [situation_alerter.GetFirstNameNoTooltip] rằng Ngài sẽ không lãng phí thời gian để ngăn phản bội"
  mpo_decisions_events.0202.learning_situation_3: "Hiểu kế hoạch của họ và đảm bảo nó thất bại."
  mpo_decisions_events.0202.learning_situation_3_flavor: "Ngài gợi ý với [situation_alerter.GetFirstNameNoTooltip] rằng Ngài sẽ phân tích kế hoạch kẻ thù và tìm cách ngăn chặn từ xa"
  mpo_decisions_events.0202.intrigue_situation_3: "Giả vờ liên minh với kẻ phản bội và phá họ từ bên trong."
  mpo_decisions_events.0202.intrigue_situation_3_flavor: "Ngài gợi ý với [situation_alerter.GetFirstNameNoTooltip] rằng Ngài sẽ thâm nhập kẻ phản bội và phá kế hoạch của họ"
  mpo_decisions_events.0202.none_situation_3: "Hãy cho mọi người biết âm mưu của kẻ hèn nhát!"
  mpo_decisions_events.0202.none_situation_3_flavor: "Ngài giải thích với [situation_alerter.GetFirstNameNoTooltip] rằng Ngài sẽ phơi bày kẻ phản bội và để dân quyết định số phận họ"

  mpo_decisions_events.0203.t: "Những Khoảnh Khắc Yên Lặng"
  mpo_decisions_events.0203.desc_intro: "Tâm trí Ta trôi xa khỏi chiến trường, và Ta thấy mình ở một nơi yên tĩnh. Ta một mình, và âm thanh duy nhất là tiếng lá xào xạc trong gió bên ngoài."
  mpo_decisions_events.0203.desc: "Máu đã đổ trong những trận chiến này, và vô số sinh mạng đã mất. Nhưng không phải vô ích, cũng không phải để tận hưởng. Trong thời gian này, Ta phải nhớ lại khuôn mặt những người đã ngã, và tên của những người còn sống.\n\nTa đang làm điều này vì ai, và tại sao?"
  mpo_decisions_events.0203.desc_mentor: "[commander_trait_mentor.GetNameNoTooltip] ngồi gần đó, nhìn Ta với sự chú ý. 'Ta thấy Ngài đang băn khoăn,' [commander_trait_mentor.GetSheHe] nói. 'Nhưng Ngài phải tự hỏi mình, Ngài đang chiến đấu vì ai, và tại sao?'"
  mpo_decisions_events.0203.a: "Để đảm bảo [heir_person.GetName] có thể cai trị như Ta đã làm."
  mpo_decisions_events.0203.b: "Để Ta có thể trở về bên [ROOT.Char.Custom2('RelationToMeShort', love_person)], [love_person.GetFirstName]."
  mpo_decisions_events.0203.c: "Để giết kẻ thù của Ta."
  mpo_decisions_events.0203.c_rival: "Vì chính Ta, để Ta được tận hưởng cái chết của [hate_person.GetNamePossessive]."
  mpo_decisions_events.0203.d: "Vì vinh quang của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!"
  mpo_decisions_events.0203.d_landless: "Vì những người mà Ta lãnh đạo."
  mpo_decisions_events.0203.e: "Để tôn vinh [ROOT.Char.GetFaith.HighGodName]!"
  mpo_decisions_events.0203.sentiment: "Vì [target_person.GetFirstName] đáp lại tình cảm:"
  mpo_decisions_events.0203.dread: "Vì [dread|E] của Ngài:"
  mpo_decisions_events.0203.prestige: "Vì [prestige_level|E] của Ngài:"
  mpo_decisions_events.0203.piety: "Vì [piety_level|E] của Ngài:"
  mpo_decisions_events.0204.t: "Con Đường Mới"
  mpo_decisions_events.0204.desc: "Đã qua một thời gian kể từ khi Ta bắt đầu huấn luyện, và Ta nghĩ mình đã sẵn sàng gặt hái thành quả lao động. Đã đến lúc thử thách bản lĩnh, và xem liệu Ta có thật sự trở thành bậc thầy trong nghệ thuật chỉ huy hay không."
  mpo_decisions_events.0204.desc_mentor: "Tất nhiên, Ta rất vui khi nhận được sự chỉ dẫn của [commander_trait_mentor.GetNamePossessive]."
  mpo_decisions_events.0204.a: "Đến chiến thắng!"
  mpo_decisions_events.0204.a_success: "Ngài #p đạt được#! một [commander_trait|E] ngẫu nhiên"
  mpo_decisions_events.0204.a_success_desc: "Ngài có thể thử lại trong #V 10#! năm"
  mpo_decisions_events.0204.a_fail: "Ngài #n không thành công#! trong việc đạt được [commander_trait|E]"
  mpo_decisions_events.0204.a_fail_desc: "Ngài có thể thử lại sau #V 5#! năm"

