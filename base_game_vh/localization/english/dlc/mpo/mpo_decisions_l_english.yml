  mpo_decisions_events.0300.t: "Nghi Lễ Đất Đai"
  mpo_decisions_events.0300.desc: "[shaman.GetTitledFirstName] hướng mắt lên trời, đọc những câu kinh ca ngợi sự tận tâm của [shaman.GetHerHis] với [shaman.GetFaith.FertilityGodName].\n\n'Hãy cùng nhớ cách tổ tiên chúng ta chăm sóc mảnh đất này,' [shaman.GetSheHe] nói, mời mọi người cùng chia sẻ lời khuyên.\n\n'Ông bà chúng ta học được gì về cừu non? Các dì của chúng ta nói gì về đất?'"
  mpo_decisions_events.0300.tt: "Cuộc họp ở [fertility_county.GetName] đã bắt đầu."
  mpo_decisions_events.0300.a: "[shaman.GetFaith.FertilityGodName], giúp chúng Ta nhớ lại."
  mpo_decisions_events.0300.b: "Ta sẽ tham gia cùng [shaman.GetNameNoTooltip] trong những suy ngẫm của [shaman.GetHerHis]."
  mpo_decisions_events.0300.b_tt: "Kết quả của cuộc họp sẽ #V hiệu quả hơn#!"
  mpo_fertility_dance_county_modifier: "Cuộc Họp Sinh Sản"
  mpo_fertility_dance_county_modifier_desc: "Một cuộc tụ họp lớn diễn ra tại quận này, mọi người chia sẻ kiến thức của mình với tư cách là những người chăn nuôi."

  friend_heir_may_become_blood_brother: "Có thể trở thành [heir.GetShortUINamePossessive] [blood_brother|E]"
  friend_heir_may_become_obedient: "Có thể trở thành [obedient|E]"
 
  mpo_pax_mongolica_decision: "$mpo_nomad_legacy_5_name$"
  mpo_pax_mongolica_decision_desc: "Vinh quang của triều đại chúng ta tỏa sáng khắp Thảo Nguyên Lớn. Những thành phố sẽ phát triển trên những nơi từng là tro tàn.\n\nCác tiền đồn sẽ được lập ra, ca ngợi lòng nhân từ của Khan của các Khan."
  mpo_pax_mongolica_decision_confirm: "Không còn thời gian để lãng phí"
  mpo_pax_mongolica_decision_tooltip: "Giúp xây dựng các thành phố ở Thảo Nguyên Lớn"
  pax_mongolica_ruler_modifier: "$mpo_nomad_legacy_5_name$"
  pax_mongolica_ruler_modifier_desc: "Nhân vật này đã đảm bảo các thành phố ở Thảo Nguyên Lớn được kết nối tốt."
  pax_mongolica_every_county_in_steppe_tt: "Mỗi [county|E] thuộc [the_great_steppe|E] do thành viên trong [dynasty|E] của Ngài nắm giữ:"

  mpo_decisions_events.0400.t: "Hòa Bình Đất Đai"
  mpo_decisions_events.0400.desc: "'...Gia vị từ phương Đông xa xôi!', 'Hạt tiêu thật, hái từ hang rồng!', 'Lụa đẹp nhất, màu sắc phong phú nhất!'\n\nCác thương nhân hô to và vẫy tay với tất cả ai sẵn sàng lắng nghe, khoe hàng hóa với sự hăng hái không ngừng.\n\n'Ở khắp nơi đều như vậy, đại [ROOT.Char.GetTitleAsNameNoTooltip],' [courtier.GetTitledFirstName] cúi chào sâu khi [courtier.GetHerHis] chào hỏi. 'Toàn thế giới giờ thuộc triều đại [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]. Người ta đến các thành phố của Ngài, bị thu hút bởi sự thịnh vượng.'"
  mpo_decisions_events.0400.a: "Giữ cổng mở."
 
  mpo_desperate_stance_decision: "Thời Khắc Tuyệt Vọng"
  mpo_desperate_stance_decision_desc: "Đất đai cằn cỗi. Bê chết trong bụng mẹ, không ai thấy ánh mặt trời. Ngựa gầy như que củi, gãy chân rời rạc.\n\nChỉ còn một cách: đó là ra đi."
  mpo_desperate_stance_decision_confirm: "Tập hợp dân chúng"
  mpo_desperate_stance_decision_tooltip: "Đoàn kết dân chúng trong nỗ lực tuyệt vọng cuối cùng"
  mpo_desperate_stance_decision_tt: "[the_great_steppe|E] đang trong $situation_steppe_havsarsan_zud_season$ [steppe_season|E]"
 
  mpo_decisions_events.0500.t: "Biện Pháp Tuyệt Vọng"
  mpo_decisions_events.0500.desc: "Những lớp băng bao phủ trên đám cỏ héo tàn, mõm của lũ gia súc giờ đã trầy xước vì cố gắng chạm tới nó.\n\n[courtier.GetShortUIName|U], vị [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))|U] của ta tiến lại gần, cơ thể [courtier.GetHerHis] co rúm lại chỉ bằng kích thước của một con búp bê:\n\n\"[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.GetTitleAsNameNoTooltip], thần dân của ngài đang chết dần mỗi khi mặt trời mọc, xin hãy giải cứu chúng tôi khỏi địa ngục trống rỗng này.\""
  mpo_decisions_events.0500.a: "Theo Ta!"
  mpo_desperate_stance_invasion_cb_enable_var_tt: "Ngài sẽ có thể sử dụng $invasion_war$ [casus_belli|E]"

  expand_the_steppe_decision_generic: "Mở Rộng Thảo Nguyên"
  expand_the_steppe_decision_desc: "Chúng ta đã trở nên mạnh mẽ ở quê hương, nhưng những cuộc chinh phục và phiêu lưu đã đưa chúng ta ngày càng xa những đồng cỏ và nơi săn bắn xưa, và hướng tới những vùng đất đầy người định cư với các tập tục sinh hoạt ổn định.\n\nChúng ta nên giới thiệu cách sống của mình đến những vùng đất mới lạ này."
  expand_the_steppe_decision_tooltip: "Thêm các vùng mới vào [the_great_steppe|E]"
