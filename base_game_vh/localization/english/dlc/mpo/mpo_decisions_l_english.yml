  mpo_become_greatest_of_khans_decision: "Trở Thành Đại Khan Vĩ Đại"
  mpo_become_greatest_of_khans_decision_desc: "Tập hợp các bộ lạc! Tuyên bố rằng thế giới thuộc về ngươi, ôi Đại Khan của các Đại Khan, và — dù các khan và thủ lĩnh nổi dậy chống lại ngươi — ngươi sẽ trở thành [ROOT.Char.GetLadyLord|U] của tất cả dưới bầu Trời."
  mpo_become_greatest_of_khans_decision_tooltip: "Tuyên bố rằng ngươi là [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] và bắt đầu chinh phục thế giới — nhưng trước hết, ngươi phải giành chiến thắng trong $mpo_great_war_of_defiance_cb$"
  mpo_become_greatest_of_khans_decision_genghis_warning: "\n\n#EMP Hãy cảnh báo!#! Các dấu hiệu cho thấy một Con Trời hùng mạnh, người Mông Cổ được tiên tri, một ngày nào đó sẽ tuyên bố điều này. Và một khi hắn đã chinh phục, không một chúa ngựa nào có thể sánh với vinh quang của hắn!"
  mpo_become_greatest_of_khans_decision_confirm: "#EMP Đánh trống báo chiến!#!"
  greatest_of_khans_obedience_req_tt: "Tất cả [powerful_vassals|E] [nomadic|E] của ngươi đều [obedient|E] với #high ngươi#!"
