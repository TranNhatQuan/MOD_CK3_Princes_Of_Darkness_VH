  confederation_kingdom_decision: "Nâng Cấp Liên Bang"
  confederation_kingdom_decision_desc: "Điều từng là một liên kết do nhu cầu — các chiến binh thề đứng cùng nhau chống lại bão táp — giờ phải trở thành điều lớn hơn. Hãy để các lãnh đạo băng nhóm chiến binh trở thành lãnh chúa, các thủ lĩnh trở thành chư hầu, và liên bang đứng dưới một lá cờ duy nhất."
  confederation_kingdom_decision_tooltip: "Giải tán [confederation|E] và thành lập [kingdom|E] mới với các [confederates|E]"
  confederation_kingdom_decision_confirm: "Với Ta là [ROOT.Char.Custom('get_queen_king')|U]!"
  mpo_decisions_events.0004.t: "Sự Ra Đời của [new_king_ruler.GetPrimaryTitle.GetTierAsNameNoTooltip|U]"
  mpo_decisions_events.0004.desc: "Đã có lúc, chúng ta cai trị bằng ý chí của riêng mình, những toán quân của chúng ta chẳng trả lời ai khác. Giờ đây, chúng ta quỳ gối — không phải như những [ROOT.Char.GetWomenMen] suy sụp, mà như những chư hầu.\n\nĐiều từng là sự tụ họp của những người bình đẳng đã trở thành một [new_king_ruler.GetPrimaryTitle.GetTierAsName], và những lưỡi kiếm của chúng ta đang thề nguyện với [new_king_ruler.GetTitledFirstNameNicknamed] — người đứng đầu trong số những người bình đẳng...\n\n[new_king_ruler.GetPrimaryTitle.GetTierAsName] này có thể trường tồn, hoặc cũng có thể sụp đổ như vạn vật vẫn thế."
  mpo_decisions_events.0004.a: "$mpo_decisions_events.0005.a$"
  mpo_decisions_events.0004.b: "Ta sẽ không tham gia vào việc này."
  mpo_decisions_events.0005.t: "$mpo_decisions_events.0004.t$"
  mpo_decisions_events.0005.desc: "Ngày xưa, chúng ta là băng nhóm chiến binh gắn kết vì nhu cầu, đoàn kết như mùa màng thoảng qua. Giờ đây, chúng ta đứng thành một.\n\nCác chiến binh từng cưỡi bên cạnh Ta nay quỳ trước ngai vàng của Ta.\n\nHãy để họ cùng ca tụng tên Ta tại bàn lớn — [new_king_ruler.GetPrimaryTitle.GetTierAsName] đã ra đời, và Ta là chủ quyền của nó."
  mpo_decisions_events.0005.a: "Nguyện chúng ta thịnh vượng, cùng nhau!"
