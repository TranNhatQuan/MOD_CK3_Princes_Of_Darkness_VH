  call_for_confederation_decision: "Triệu tập Liên minh"
  call_for_confederation_decision_desc: "Chống lại các cường quốc khinh thường kẻ yếu — người [ROOT.Char.GetCulture.GetName] chiến đấu một mình sẽ chết một mình.\n\nTa phải tìm những ai yêu mến dân ta, và sẽ thề một lời thề thiêng liêng chiến đấu cùng đến chết."
