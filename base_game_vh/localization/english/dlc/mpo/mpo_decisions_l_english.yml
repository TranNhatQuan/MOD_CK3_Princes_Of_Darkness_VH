  confederation_restrictions_tribe_warning_tt: "#alert_trial @alert_icon! Thuộc về [confederation|E] hạn chế [tribal_authority|E] của Ngài và ngăn tạo [titles|E] mới#!"
  confederation_restrictions_warning_tt: "#alert_trial @alert_icon! Thuộc về [confederation|E] hạn chế [nomadic_authority|E] của Ngài và ngăn tạo [titles|E] mới#!"
