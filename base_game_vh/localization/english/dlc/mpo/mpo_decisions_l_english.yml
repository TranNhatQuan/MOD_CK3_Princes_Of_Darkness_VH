  CONFEDERATION_DUCHY_NAME: "Liên minh [capital_duchy.GetBaseNameNoTierNoTooltip|U]"
  CONFEDERATION_DUCHY_NAME_ADJ: "[capital_duchy.GetAdjectiveNoTooltip|U]"
  article_CONFEDERATION_CULTURE_NAME: "the "
  new_confederation_created_tt: "Ngài đã tạo [new_confederation.GetName]"
  joined_confederation_tt: "Ngài đã tham gia [confederation.GetName]"

  superior_max_military_strength_tt: "Có ít nhất gấp đôi Sức mạnh Quân sự của Ngài"
  confederation_threat_tt: "Bất kỳ [ruler|E] lân cận, [suzerain|E] của [ruler|E] lân cận hoặc [ruler|E] trong cùng [de_jure|E] [kingdom|E] với [capital|E] của Ngài:\n$EFFECT_LIST_BULLET$$superior_max_military_strength_tt$\n$EFFECT_LIST_BULLET$Không #bold phải#! [allied|E] với #high Ngài#!\n$EFFECT_LIST_BULLET$Ít nhất một trong số những điều sau:\n  $EFFECT_LIST_BULLET$Chức danh cao nhất nắm giữ ≥ Hạng Vương quốc [rank|E]\n  $EFFECT_LIST_BULLET$$considers_faith_evil_tt$\n  $EFFECT_LIST_BULLET$Có đặc điểm: [GetTrait('conqueror').GetName( GetNullCharacter )]\n  $EFFECT_LIST_BULLET$Có đặc điểm: [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]"
  considers_faith_evil_tt: "Cho rằng [faith|E] của Ngài là [faith_evil|E]"
  mpo_decisions_events.0001.t: "Tập hợp các Bộ tộc"
  mpo_decisions_events.0001.desc: "Theo ý muốn của [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetPrimaryTitle.GetTierAsName] của ta có thể bị gãy như trục một mũi tên đơn! Bộ tộc nhỏ bé của ta chia đất [home_kingdom.GetNameNoTier] với những đội quân như [threat.GetTitledFirstNamePossessive] đáng sợ của [threat.GetCulture.GetCollectiveNoun].\n\nNhưng — nếu mũi tên của dân ta kết hợp với Bạn Bè và người thân? Kẻ thù có thể dễ dàng phá tan ta không?\n\n#EMP Anh em, chị em — không cần bậc thầy, nhưng hãy cất tiếng nói cho các bộ tộc! Một tiếng nói để chế nhạo [threat.GetTitledFirstNameNoTooltip], và cả thế giới!#!"
  mpo_decisions_events.0001.a: "Ta phải tìm những người sẵn sàng."
  mpo_decisions_events.0001.b: "#EMP Bah! Hèn nhát!#!"

  every_confederation_member: "Mỗi [confederate|E] đồng minh"
  confederation_offerer_tt: "[primary_title|E] của [liege|E] là một [confederation|E]"
#But do the wolves circling the fire-light not hunt as a pack? Do they not fight as brothers?
#EMP Let us live and die as one!#!
  leave_confederation_decision: "Rời Liên minh"
  leave_confederation_decision_desc: "Ta đã đứng bảo vệ các đồng minh đủ lâu. Giờ ta sẽ đứng một mình. Và nếu liên minh không tồn tại được nếu thiếu ta — nó đáng bị tiêu vong!"
  leave_confederation_decision_confirm: "[ROOT.Char.GetFaith.HighGodName] che chở. Ta sẽ không."
  leave_confederation_decision_tooltip: "Rời [confederation|E] và từ bỏ sự hỗ trợ từ các [confederates|E]"
  confederaton_blocks_faction: "[vassals|E] của một [confederation|E] không thể tạo [faction|E] này"
  mpo_confederation_member_modifier: "Đồng cỏ Liên minh"
  mpo_confederation_member_modifier_desc: "Chia sẻ đồng cỏ với các đồng minh và các tributary nhỏ hơn, giảm áp lực lên đồng cỏ nhà mình."
  confederation_modifier_tt: "[confederates|E] nhận [GetModifier('mpo_confederation_member_modifier').GetNameWithTooltip] và một phần [county_fertility|E]"
  confederates_lose_opinion_tt: "Mỗi [confederate|E] mất #N 20#! [opinion|E] về #high Ngài#!"

  mpo_decisions_events.0002.t: "Bỏ Liên minh"
  mpo_decisions_events.0002.desc: "Lời truyền đi nhanh, và sớm tiếng kêu của [confederation.GetName] vang lên trong sợ hãi — [ROOT.Char.GetName] đã chấm dứt với họ!\n\n"
  mpo_decisions_events.0002.desc_confederation_survives: "Những kẻ yếu này còn trông cậy vào sức mạnh ai? Lòng nhân từ ai? #EMP Hòa bình ai?#! Liên minh chỉ còn rơi vào hỗn loạn.\n\nThịnh vượng sẽ thuộc về [ROOT.Char.GetPrimaryTitle.GetNameNoTier] một mình."
  mpo_decisions_events.0002.desc_confederation_done: "Chỉ còn [other_confederate.GetTitledFirstName] giữ lời thề... liên minh không còn. Hòa bình? Thịnh vượng? Giờ chỉ thuộc về kẻ mạnh."
  mpo_decisions_events.0002.a: "Ta là tất cả những gì dân ta cần."

  mpo_decisions_events.0003.t: "Sự mất mát của Liên minh"
  mpo_decisions_events.0003.desc: "Một điềm báo nặng nề bao trùm lấy thần dân của ta, vì [leaver.GetTitledFirstName] đã bội bạc lời hứa sẽ sát cánh cùng chúng ta. [leaver.GetSheHe|U] đã từ bỏ liên minh của chúng ta. Chúng ta sẽ không còn cưỡi ngựa cùng với [leaver.GetPrimaryTitle.GetNameNoTier] để chống lại những kẻ hùng mạnh nữa.\n\n\""
  mpo_decisions_events.0003.desc_confederation_survives: "[confederation.GetName] bị suy yếu bởi điều này. Nhưng ta vẫn đứng vững."
  mpo_decisions_events.0003.desc_confederation_done: "Khi ta #EMP một mình#! trung thành với lời thề, liên minh không còn ý nghĩa. Nó đã chấm dứt."
  mpo_decisions_events.0003.a: "Kẻ phản bội!"

  leaver_left_confederation_tt: "[leaver.GetShortUIName] đã rời [confederation.GetName]"
  leaver_destroyed_confederation_tt: "[leaver.GetShortUIName] đã giải tán [confederation|E] của Ngài"

