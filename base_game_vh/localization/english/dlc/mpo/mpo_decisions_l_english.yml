  mpo_gok_world_conquest_decision: "Cải Cách Đại Khaganate"
  mpo_gok_world_conquest_decision_desc: "[ROOT.Char.GetPrimaryTitle.GetName] trải dài xa hơn các vùng cỏ rộng lớn, xa hơn biển muối, xa hơn mọi giấc mơ của kẻ du mục từng mơ.\n\nTất cả đều giành được trên lưng ngựa. Tất cả có thể giữ, có thể cai trị... chỉ từ ngai vàng. Từ đó, như [ROOT.Char.GetFaith.CreatorName], ta phải quan sát và thấy sự hình thành của một vũ trụ mới: với luật lệ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], trí tuệ mới, và sự cai trị vĩnh hằng của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]."
  mpo_gok_world_conquest_decision_tooltip: "Thiết lập vị thế lâu dài của [dynasty|E] Ngài như các chủ quyền hùng mạnh: áp dụng hình thức [government|E] mới hoặc tuyên bố toàn bộ [realm|E] cho [nomads|E]."
