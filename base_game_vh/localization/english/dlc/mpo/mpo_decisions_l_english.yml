  mpo_valid_heir_friend_tt: "Bất kỳ [direct_vassals|E], [allies|E] hoặc [relations|E] nào của Ngài:\n$EFFECT_LIST_BULLET$Ít nhất #V 12#! tuổi\n$EFFECT_LIST_BULLET$Có ít nhất #V 50#! [opinion|E] về Ngài\n$EFFECT_LIST_BULLET$Không #bold đang chiến tranh#! với Ngài\n$EFFECT_LIST_BULLET$$not_friends_with_player_heir_tt$\n$EFFECT_LIST_BULLET$Không #bold phải#! là [blood_brothers|E] với [player_heir|E] của Ngài\n$EFFECT_LIST_BULLET$$not_bad_relation_with_player_heir_tt$\n$EFFECT_LIST_BULLET$Không #bold bị giam#!\n$EFFECT_LIST_BULLET$Không #bold không có khả năng#!\n$EFFECT_LIST_BULLET$$nomadic_government_or_philosophy_tt$\n$EFFECT_LIST_BULLET$Chức danh cao nhất nắm giữ ≥ Hạng Hạt [rank|E]\n$EFFECT_LIST_BULLET$Phải là [ally|E], [friend|E], [soulmate|E], [blood_brother|E] hoặc [obedient|E] [vassal|E] của Ngài"

  mpo_decision_introduce_heir: "Giới thiệu Người Thừa Kế"
  introduce_heir_decision_desc: "Nếu người kế vị của ta muốn làm chủ [ROOT.Char.GetPlayerHeir.GetHerHis] định mệnh, [ROOT.Char.GetPlayerHeir.GetSheHe] sẽ cần những người Ngài danh dự. Ta phải để [ROOT.Char.GetPlayerHeir.GetHerHis] được biết đến, giọng nói [ROOT.Char.GetPlayerHeir.GetHerHis] vang lên trong những ngôi nhà lụa của những kẻ quyền lực.\n\nNgười đứng một mình dưới bầu trời là [ROOT.Char.GetPlayerHeir.GetWomanMan] đã đánh dấu bằng định mệnh."
  introduce_heir_decision_tooltip: "Để [player_heir|E] của Ngài trở thành [friends|E] với một trong các [vassals|E], [allies|E] hoặc [relations|E] của Ngài"
  mpo_decision_introduce_heir_confirm: "#EMP [ROOT.Char.GetPlayerHeir.GetTitledFirstNameNoTooltip], lên ngựa!#!"

  mpo_decisions_events.0020.t: "Giới thiệu Người Thừa Kế"
  mpo_decisions_events.0020.desc: "Máu của ta, [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] [heir.GetFirstName], một ngày nào đó phải đòi lòng trung thành của toàn bộ [ROOT.Char.GetHouse.GetName], và nhiều dân tộc khác. Không có những người Ngài vững chắc hậu thuẫn [heir.GetHerHim], tiếng nói của người thừa kế có thể bị bỏ ngoài tai.\n\nKhi chúng ta cưỡi ngựa, ta đếm những người trung thành với ta."
  mpo_decisions_events.0020.desc_multiple: "[target_1.Custom('ComplimentAdjective')] [target_1.GetTitledFirstName] chắc chắn sẽ dành cho [heir.GetFirstNameNoTooltip] một chỗ cạnh lửa [target_1.GetHerHis], nhưng ai là người [heir.GetSheHe] #EMP phải gây ấn tượng nhất#!..."
  mpo_decisions_events.0020.desc_one: "Họ ít, và chỉ có một người duy nhất mà ta thật sự tin cậy..."
  mpo_decisions_events.0020.a: "[ROOT.Char.Custom2('RelationToMeShort', target_1)], [target_1.GetFirstNameNoTooltip] của [target_1.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  mpo_decisions_events.0020.b: "[ROOT.Char.Custom2('RelationToMeShort', target_2)], [target_2.GetFirstNameNoTooltip] của [target_2.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  mpo_decisions_events.0020.c: "[ROOT.Char.Custom2('RelationToMeShort', target_3)], [target_3.GetFirstNameNoTooltip] của [target_3.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  mpo_decisions_events.0020.d: "[ROOT.Char.Custom2('RelationToMeShort', target_4)], [target_4.GetFirstNameNoTooltip] của [target_4.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  mpo_decisions_events.0020.e: "[ROOT.Char.Custom2('RelationToMeShort', target_5)], [target_5.GetFirstNameNoTooltip] của [target_5.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  mpo_decisions_events.0020.f: "Bah, quên điều này đi."

