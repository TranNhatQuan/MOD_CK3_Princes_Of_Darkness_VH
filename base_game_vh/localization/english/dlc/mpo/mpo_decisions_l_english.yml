  settle_people_decision: "Di Dân Vào Vùng Chiếm Được"
  settle_people_decision_desc: "Những vùng đất này không sinh ra cho chúng ta, nhưng chúng vẫn uốn theo ý muốn ta. Thành phố mang tên lạ, đất đai được cày xới bởi bàn tay không phải của chúng ta — nhưng giờ thì khác.\n\nTa chiếm lấy những gì đã giành được và đóng cọc xuống đất. Hãy gọi chúng ta là kẻ chinh phục — ta sẽ trở thành vua."
  settle_people_decision_tooltip: "Di chuyển [ROOT.Char.GetDomicile.GetFaith.GetAdjective] [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] của Ngài vào vùng đất chiếm được, từ bỏ lối sống [GetGovernment( 'nomad_government' ).GetName]."
