  step_away_from_the_steppe_decision: "Từ Bỏ Lối Sống Du Mục"
  step_away_from_the_steppe_decision_desc: "Cuộc sống trên lưng ngựa thật mệt mỏi. Ngài có thấy ở thị trấn thế nào không? Một chiếc giường mềm trong bức tường kiên cố... không còn đau yên ngựa, không cần liên tục di chuyển... đôi khi, thật hấp dẫn khi xuống yên và nằm trên nệm."
