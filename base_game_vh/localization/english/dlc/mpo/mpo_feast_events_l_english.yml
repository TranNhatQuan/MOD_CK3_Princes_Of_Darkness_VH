l_english:
  feast_type_tsagaan_sar: "Tsagaan Sar"
  feast_type_tsagaan_sar_desc: "$EFFECT_LIST_BULLET$ Lễ Tống Cựu sẽ là thời điểm nhận quà, như [herd|E] và [gold|E]\n$EFFECT_LIST_BULLET$ Các sự kiện sẽ cung cấp cơ hội tăng [opinion|E]\n$EFFECT_LIST_BULLET$ Một số lựa chọn sẽ cho phép giảm [stress|E]\n\n#weak Trăng Trắng mới mọc - và chúng ta hân hoan!#!"
  feast_type_tsagaan_sar_valid_tt: "Ngài đã tổ chức một Tsagaan Sar [GetActivityType('activity_feast').GetName] trong 5 năm qua"
  feast_type_tsagaan_sar_valid_tt_time: "Tsagaan Sar chỉ có thể tổ chức từ tháng 1 đến tháng 3"

  # Events
  feast_tsagaan_sar_events.0001.t: "Đêm Trước Mặt"
  feast_tsagaan_sar_events.0001.desc: "Ngựa tập trung bên ngoài các túp lều, các kỵ sĩ vuốt ve chúng lần cuối trước khi đi giao lưu. Thanh niên nô đùa, chơi trò đuổi bắt và trêu chọc người lớn. Tất cả mặc trang phục trắng tinh, áo mới may, mới như năm mới.\n\nTrong khi [ROOT.Char.Custom('GetWomenOrMenBasedOnFaith')] lăn lộn và vật tay, không khí yên bình: những cuộc tranh chấp nhỏ và trò cá cược củng cố tình anh em. [ROOT.Char.Custom('GetWomenOrMenBasedOnFaithOpposite')] chuẩn bị bàn tiệc, mùi thịt cừu lan tỏa.\n\nLễ hội này sẽ đáng nhớ — miễn là Ta để ý đến..."
  feast_tsagaan_sar_events.0001.a: "...những hòm tiền Ta sẽ nhận."
  feast_tsagaan_sar_events.0001.a_tt: "Ngài có khả năng nhận được [gold|E] từ khách mời nhiều hơn"
  feast_tsagaan_sar_events.0001.b: "...những vật phẩm nhỏ Ta nhận được và câu chuyện đi kèm."
  feast_tsagaan_sar_events.0001.b_tt: "Ngài có khả năng nhận được [artifacts|E] từ khách mời nhiều hơn"
  feast_tsagaan_sar_events.0001.c: "...các khách mời. Sẽ không vui gì nếu thiếu họ."
  feast_tsagaan_sar_events.0001.c_tt: "Ngài có khả năng nhận được một [hook|E] từ khách mời"
  feast_tsagaan_sar_events.0001.d: "...những lời chúc phúc của [ROOT.Char.GetFaith.HighGodName] trong năm mới."
  feast_tsagaan_sar_events.0001.d_tt: "Ngài có khả năng nhận được [piety|E] từ khách mời nhiều hơn"
  feast_tsagaan_sar_events.0001.e: "...thức ăn!"
  feast_tsagaan_sar_events.0001.f: "...bầu không khí lễ hội!"
  feast_tsagaan_sar_events.0001_none: "Không khách nào trong [activity_guests|E] có thể tặng Ngài gì năm nay"
  feast_tsagaan_sar_events.0001_tt: "#V [gifters_list_size]#! khách #p sẽ#! tặng Ngài thứ gì đó"

  feast_tsagaan_sar_events.0002.t: "Chuẩn Bị Quà"
  feast_tsagaan_sar_events.0002.desc: "Lễ hội đã bắt đầu, và trong khi ta biết ơn [host.GetName] vì lời mời của [host.GetHerHis], ta suy ngẫm về món quà mình phải tặng cho [host.GetHerHim]. Điều này vượt ra ngoài vấn đề truyền thống: nó là vấn đề về danh dự. \n\nTa quan sát những quý tộc khác mang theo những rương đầy tiền ngoại tệ, và những người nông dân mang theo những bao nhỏ chứa vật phẩm quý giá. Những người khác thì dắt ngựa và chăm sóc chúng để chuẩn bị cho chủ nhân mới. Một vài vị khách thì trao tặng một lễ vật vô hình, nói lên những lời thề trung thành trân quý. \n\nNhưng câu hỏi đặt ra là, ta có thể hy sinh điều gì cho [host.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] của ta đây?"
  feast_tsagaan_sar_events.0002.desc_again: "Một lần nữa, Ta phải nghĩ cách thể hiện sự tôn trọng với [host.GetName]. Ta có thể từ chối, hy vọng [host.GetSheHe] không để ý. Thời gian không còn nhiều; đây có thể là cơ hội cuối để chuẩn bị quà cho [host.GetHerHim]."
  feast_tsagaan_sar_events.0002.nothing_arrogant: "Sự hiện diện của Ta là đủ cho [host.GetHerHim]."
  feast_tsagaan_sar_events.0002.nothing_fickle: "Có lẽ Ta sẽ quyết định sau?"
  feast_tsagaan_sar_events.0002.nothing: "Dường như Ta không có gì để tặng..."
  feast_tsagaan_sar_events.0002.herd_1: "Vài con cừu sẽ hợp với [host.GetHerHim]."
  feast_tsagaan_sar_events.0002.herd_2: "Ta có một con ngựa thừa..."
  feast_tsagaan_sar_events.0002.herd_3: "Gia súc hay cừu, nên chọn gì?"
  feast_tsagaan_sar_events.0002.herd_4: "Đàn của Ta có thể phù hợp sau cùng."
  feast_tsagaan_sar_events.0002.herd_tt: "Ngài sẽ chọn số lượng [herd_i] [herd|E] để tặng [host.GetName]"
  feast_tsagaan_sar_events.0002.gold_1: "Ta có thể để dành chút vàng cho [host.GetHerHim]."
  feast_tsagaan_sar_events.0002.gold_2: "Một túi vàng là đủ!"
  feast_tsagaan_sar_events.0002.gold_3: "Ta không ngại chia giàu sang với [host.GetFirstNameNoTooltip]!"
  feast_tsagaan_sar_events.0002.gold_tt: "Ngài sẽ chọn số lượng [gold_i] [gold|E] để tặng [host.GetName]"
  feast_tsagaan_sar_events.0002.artifact: "Ta có thể tặng một vật của mình."
  feast_tsagaan_sar_events.0002.artifact_tt: "Ngài sẽ chọn một [artifact|E] để tặng [host.GetName]"
  feast_tsagaan_sar_events.0002.loyalty: "Lòng trung thành là món quà lớn nhất."
  feast_tsagaan_sar_events.0002.prestige: "Ta sẽ nói tốt về [host.GetHerHim]!"
  feast_tsagaan_sar_events.0002.prestige_tt: "Ngài sẽ truyền danh tiếng về [host.GetFirstNamePossessiveNoTooltip], ban cho [host.GetHerHim] một phần [prestige_i] [prestige|E]"
  feast_tsagaan_sar_events.0002.blessing: "[host.GetFaith.HighGodName] sẽ ban phúc lành cho [host.GetHerHim], Ta sẽ đảm bảo."
  feast_tsagaan_sar_events.0002.blessing_tt: "Ngài sẽ ban phước lành lên [host.GetFirstNameNoTooltip], ban cho [host.GetHerHim] một chút [piety_i] [piety|E] của ngài"
  feast_tsagaan_sar_events.0002.nothing_important: "@warning_icon! #warning Vì Ngài quan trọng với [host.GetFirstNameNoTooltip], [host.GetSheHe] sẽ phật ý về việc này.#!"
  feast_tsagaan_sar_events.0002.nothing_tt: "Vì Ngài không có gì để tặng [host.GetFirstNameNoTooltip], [host.GetSheHe] sẽ không phiền."
  feast_tsagaan_sar_events.0002.nothing_unimportant: "@warning_icon! #warning Dù Ngài không quan trọng với [host.GetFirstNameNoTooltip], [host.GetSheHe] có thể phật ý vì thiếu quà.#!"

  feast_tsagaan_sar_events.0003.herd: "Đàn gia súc của Ta sẽ là món quà đáng kể cho [host.GetName]. Người dân [host.GetHerHis|U] sẽ phát triển khi di chuyển và chiến đấu trên ngựa của Ta. Nhưng vẫn còn câu hỏi, Ta sẽ tặng bao nhiêu?"
  feast_tsagaan_sar_events.0003.gold: "Vàng quý giá khắp nơi, và chắc [host.GetName] cũng đồng ý. Kho bạc Ta không vô tận, [host.GetFirstNameNoTooltip] chỉ có thể nhận bấy nhiêu."
  feast_tsagaan_sar_events.0003.prestige: "[host.GetName] được người dân [host.GetHerHis] biết đến là [host.Custom('ComplimentAdjective')], Ta muốn lan tỏa điều đó."
  feast_tsagaan_sar_events.0003.piety: "[host.GetFaith.HighGodName] sẽ nhìn [host.GetName] với sự ưu ái cao độ, nhưng để làm được điều đó, ta phải hướng về [host.GetFaith.PositiveAfterLife] và kể cho [host.GetFaith.HighGodName] về những việc làm tốt của [host.GetFirstNamePossessiveNoTooltip]."

  feast_tsagaan_sar_events.0003.minor.herd: "Một con ngựa là đủ."
  feast_tsagaan_sar_events.0003.minor.herd_2: "Một hai con cừu, có lẽ."
  feast_tsagaan_sar_events.0003.medium.herd: "Một vài đàn gia súc là đủ."
  feast_tsagaan_sar_events.0003.medium.herd_2: "Một bầy ngựa, đủ cho gia đình [host.GetHerHis]."
  feast_tsagaan_sar_events.0003.major.herd: "[host.GetFirstNameNoTooltip] sẽ có đủ gia súc cho nhiều dặm!"
  feast_tsagaan_sar_events.0003.minor.gold: "Ta sẽ đưa vài đồng cho [host.GetHerHis]."
  feast_tsagaan_sar_events.0003.minor.gold_2: "Một túi nhỏ thôi."
  feast_tsagaan_sar_events.0003.medium.gold: "Một rương cho [host.GetTitleAsNameNoTooltip]!"
  feast_tsagaan_sar_events.0003.medium.gold_2: "[host.GetSheHe|U] xứng đáng hơn vài đồng."
  feast_tsagaan_sar_events.0003.major.gold: "Ngân khố [host.GetFirstNamePossessiveNoTooltip] tràn đầy!"
  feast_tsagaan_sar_events.0003.minor.prestige: "Người dân sẽ biết đến [host.GetFirstNameNoTooltip]."
  feast_tsagaan_sar_events.0003.medium.prestige: "Ta sẽ ca ngợi [host.GetHerHim]!"
  feast_tsagaan_sar_events.0003.major.prestige: "[host.GetFirstNamePossessiveNoTooltip] vang danh khắp đất và [ROOT.Char.GetFaith.PositiveAfterLife]!"
  feast_tsagaan_sar_events.0003.minor.piety: "Ta biết [host.GetFirstNameNoTooltip] là một [host.GetFaith.GetAdherentName] thực thụ!"
  feast_tsagaan_sar_events.0003.medium.piety: "Với lời cầu nguyện, [host.GetFirstNameNoTooltip] chắc chắn vào [host.GetFaith.PositiveAfterLife]."
  feast_tsagaan_sar_events.0003.major.piety: "Tên [host.GetFirstNamePossessiveNoTooltip] sẽ được tất cả [host.GetFaith.GetAdherentNamePlural] biết đến!"
  feast_tsagaan_sar_events.0002.choose: "Có lẽ Ta nên chọn món khác."
  feast_tsagaan_sar_events.0002.choose_tt: "Ngài sẽ chọn một món quà khác cho [host.GetName]"
  feast_tsagaan_sar_events.0002.none: "Thật ra, Ta sẽ không tặng [host.GetFirstNameNoTooltip] gì cả."

  feast_tsagaan_sar_events.0004.desc: "May mắn là kho đồ của Ta không rỗng, và [host.GetTitledFirstName] có thể cần một món trong số đó.\n\nVấn đề là [host.GetSheHe] sẽ thích món nào, hoặc Ta có thể chọn món ít giá trị với mình."
  feast_tsagaan_sar_events.0004.a: "[artifact_1.GetName] thôi!"
  feast_tsagaan_sar_events.0004.b: "Ta cũng không cần [artifact_2.GetName]..."
  feast_tsagaan_sar_events.0004.c: "[host.GetSheHe|U] có thể lấy [artifact_3.GetName] của Ta!"

  feast_tsagaan_sar_events.0100.t: "Quà Tặng Sai Lệch"
  feast_tsagaan_sar_events.0100.desc: "Một triều thần của [host.GetName], [gift_collector.GetName], tiến đến. 'Chào, [ROOT.Char.Custom('ComplimentAdjective')] [host.GetTitleAsNameNoTooltip]. Chúng Ta chưa nhận được món quà của ngài cho [host.GetTitledFirstNameNoTooltip],' [gift_collector.GetFirstNameNoTooltip] nói. 'Đừng bảo Ta ngài đến tay không!' [gift_collector.GetSheHe] đùa.\n\n'Ngài đang nói gì vậy?' Ta đáp. 'Ta đã tặng [ROOT.Char.Custom('GetTsagaanSarGiftDesc')], không đủ cho [host.GetFirstNameNoTooltip] sao?' [gift_collector.GetFirstNameNoTooltip] thở dài, 'Có lẽ chưa được tính đến?'"
  feast_tsagaan_sar_events.0100.a: "Ta sẽ chọn món quà khác cho [host.GetHerHim]."
  feast_tsagaan_sar_events.0100.b: "Chắc Ta có thể tặng thêm một chút..."
  feast_tsagaan_sar_events.0100.c: "Có vẻ lần này [host.GetSheHe] chẳng nhận gì!"
  feast_tsagaan_sar_events.0100.c_paranoid: "Mất sao? Ta không tin đâu."

  feast_tsagaan_sar_events.0101.t: "Một Nàng Ngựa Tuyệt Vời"
  feast_tsagaan_sar_events.0101.desc: "Từ bên kia cánh đồng, Ta thấy một con ngựa tuyệt đẹp, lông trắng như trăng. Cô ấy xinh đẹp, vượt cả các thiếu nữ đẹp nhất với bờm dài, mượt và đôi mắt sáng như sao.\n\nKỵ sĩ, [horse_haver.GetName], nhận ra Ta đang trố mắt. 'Ngươi có con mắt tinh tường,' [horse_haver.GetFirstNameNoTooltip] nói. 'Ngươi có thể cưỡi thử một vòng, nhưng cẩn thận. Cô ấy hoang dã lắm.'"
  feast_tsagaan_sar_events.0101.a: "Ta sẽ nhận lời."
  feast_tsagaan_sar_events.0101.b: "Ta muốn một thỏa thuận #EMP lâu dài#!"
  feast_tsagaan_sar_events.0101.b.success: "[horse_haver.GetFirstNameNoTooltip] đồng ý bán ngựa cho Ngài"
  feast_tsagaan_sar_events.0101.b.failure: "[horse_haver.GetFirstNameNoTooltip] không muốn bán ngựa"
  feast_tsagaan_sar_events.0101.b.duel: "Ngài yêu cầu [horse_haver.GetFirstNameNoTooltip] bán ngựa"
  feast_tsagaan_sar_events.0101.c: "Được thôi, chỉ cưỡi 'tạm thời'."
  feast_tsagaan_sar_events.0101.c.duel: "Ngài cố gắng lấy trộm ngựa khi cưỡi thử"
  feast_tsagaan_sar_events.0101.c.success: "Ngài cưỡi ra ngoài tầm mắt [horse_haver.GetFirstNamePossessiveNoTooltip]" 
  feast_tsagaan_sar_events.0101.c.failure: "[horse_haver.GetFirstNameNoTooltip] bắt kịp Ngài"
  rival_stole_my_horse: "[CHARACTER.GetShortUIName|U] đã lấy mất con ngựa yêu thích của [TARGET_CHARACTER.GetShortUINamePossessive|U]."
  rival_stole_my_horse_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã lấy mất con ngựa yêu thích của [CHARACTER.GetShortUINamePossessive|U]."

  feast_tsagaan_sar_events.0200.t: "Trò Chơi Shagai"
  feast_tsagaan_sar_events.0200.desc: ""Xin chào, [ROOT.Char.GetFirstNameNoTooltip]!" [gambler.GetName] gọi. "Ta thấy Ngài có chút thời gian. Ngài có muốn tham gia trò chơi [Glossary( 'Shagai', 'SHAGAI_GLOSS' )] cùng Ta không?" [gambler.GetSheHe] hỏi, đổ vài chiếc xương chân vào tay [gambler.GetHerHis].\n\n[gambler.GetSheHe|U] ngồi bắt chéo chân trên mặt đất, ra hiệu cho Ta làm theo. [gambler.GetFirstNameNoTooltip] nhắc Ta về luật chơi, và chúng Ta lần lượt tung xương."
  ts_wager: "Ngài cược [gold_i]"
  feast_tsagaan_sar_events.0200.a: "Không mạo hiểm thì đâu vui?"
  feast_tsagaan_sar_events.0200.a_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#!"
  feast_tsagaan_sar_events.0200.b_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#!"
  feast_tsagaan_sar_events.0200.c_tt: "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#!"
  feast_tsagaan_sar_events.0200.b: "Ta có thể cược nhiều hơn một chút."
  feast_tsagaan_sar_events.0200.c: "Ta sẽ cược một phần nhỏ của tài sản."
  feast_tsagaan_sar_events.0200.d_content: "Ta không cần đánh bạc."
  feast_tsagaan_sar_events.0200.d: "Không, nhưng cảm ơn."
  feast_tsagaan_sar_events.0200_lose: "Ngài thua trò chơi"
  feast_tsagaan_sar_events.0200_win: "Ngài thắng trò chơi"
  friend_played_party_games: "[CHARACTER.GetShortUIName|U] gắn kết với [TARGET_CHARACTER.GetShortUIName] qua trò chơi may rủi."
  friend_played_party_games_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] gắn kết với [CHARACTER.GetShortUIName] qua trò chơi may rủi."
  SHAGAI_GLOSS: "#bold Shagai#! là trò bói may bằng xương chân cừu hoặc dê. Xương được tung như xúc xắc và sẽ rơi trên một trong bốn mặt: ngựa, cừu, lạc đà hoặc dê. Ngựa và lạc đà được xem là may mắn, trong khi cừu và dê thì không."
 
  feast_tsagaan_sar_events.0210.t: "Trí Khôn Người Chăn Dắt"
  feast_tsagaan_sar_events.0210.desc: "Các gia đình tụ tập quanh lửa, bàn ăn, chia sẻ thức ăn và câu chuyện. Ta ngồi cạnh một người chăn cừu thông thái, [herder.GetName]. [herder.GetSheHe|U] nghiêng về phía Ta, chỉ về một đàn cừu lớn ở xa. "Đó là của Ta," [herder.GetFirstNameNoTooltip] nói. "Một món quà cho [ROOT.Char.GetInvolvedActivity.GetHost.GetTitleAsNameNoTooltip] năm nay."\n\nTa quan sát đàn cừu, ngưỡng mộ sự điềm tĩnh và số lượng đông đảo của chúng. Có lẽ Ta nên hỏi [herder.GetFirstNameNoTooltip] cách quản lý đàn cừu của mình."
  feast_tsagaan_sar_events.0210.a: "Hỏi [herder.GetHerHim] làm thế nào để [herder.GetSheHe] quản lý đàn cừu lớn như vậy."
  feast_tsagaan_sar_events.0210.tt: "Ngài trả tiền cho [herder.GetFirstNameNoTooltip] để nhận lời khuyên"
  feast_tsagaan_sar_events.0210.b: "Tìm hiểu về các phương pháp chăn dắt thông minh."
  feast_tsagaan_sar_events.0210.c: "Ta không cần lời khuyên."

  feast_tsagaan_sar_events.0220.t: "Cuộc Gặp Lại Kẻ Thù"
  feast_tsagaan_sar_events.0220.desc: "Ta đối mặt với [old_rival.GetName], sinh vật [old_rival.Custom2('InsultAdjectiveArticle', ROOT.Char)]. "À… Ta thấy Ngài ở đây, [ROOT.Char.GetFirstNameNoTooltip]. Hy vọng Ngài chưa quên quá khứ và những lỗi lầm Ngài đã gây ra cho Ta." [old_rival.GetFirstNameNoTooltip] nhếch môi.\n\nTa cảm nhận được căng thẳng trong lời nói của [old_rival.GetHerHis], nhưng [old_rival.GetSheHe] vẫn bình tĩnh tiếp tục: "Nhân dịp năm mới, Ta đề nghị chúng ta bỏ qua những lỗi lầm trước đây.""
  feast_tsagaan_sar_events.0220.a: "Ta đồng ý, hòa bình là cách tốt nhất."
  feast_tsagaan_sar_events.0220.b: "Ồ, chúng ta có thể làm #EMP nhiều hơn#! thế."
  feast_tsagaan_sar_events.0220.b_flavor: "Một tia lửa đam mê bùng lên, ẩn sau căng thẳng của quá khứ."
  feast_tsagaan_sar_events.0220_win: "[old_rival.GetSheHe|U] đáp lại tình cảm của Ngài"
  feast_tsagaan_sar_events.0220_lose: "[old_rival.GetSheHe|U] cảm thấy chán ghét"
  feast_tsagaan_sar_events.0220.c: "Tại sao không mở rộng sự khoan hồng hơn nữa?"
  feast_tsagaan_sar_events.0220.d_vengeful: "Không, chừng nào Ngài còn sống!"
  feast_tsagaan_sar_events.0220.d: "Không, Ta không nghĩ vậy."

  friend_feast_rivalry: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] trở thành bạn sau khi gác lại sự cạnh tranh trong một bữa tiệc."

  feast_tsagaan_sar_events.0230.t: "Tiếng Nói Của Mặt Trăng"
  feast_tsagaan_sar_events.0230.desc_intro: "Một nhóm khách kéo đến một túp lều ở xa, bàn tán về một màn trình diễn. Ta theo sự náo nhiệt và nhìn thấy mọi ánh mắt hướng về [throat_singer.GetName]. [throat_singer.GetSheHe|U] bùng nổ trong bài hát, ca về [throat_singer.Custom('GetRandomThroatSingingTheme')].\n\nÂm thanh giống như"
  feast_tsagaan_sar_events.0230.desc_sygyt: "một tiếng huýt cao và trong, như gió thổi qua cây cối."
  feast_tsagaan_sar_events.0230.desc_hoomei: "một luồng gió rền rĩ, như cơn bão hoặc dòng khí để lại bởi chim bay."
  feast_tsagaan_sar_events.0230.desc_kargyraa: "một tiếng gầm sâu, trầm, như tiếng sấm hoặc gầm của gấu."
  feast_tsagaan_sar_events.0230.desc_outro: "[observer.GetName] quay sang Ta và thì thầm, "[throat_singer.GetHerHis|U] [throat_singer.Custom('GetThroatSingingStyle')] thật ấn tượng, Ngài có thấy không?"\n\nTa nhìn [throat_singer.GetSheHe] kết thúc giai điệu đầu tiên, và đám đông vỗ tay."
  feast_tsagaan_sar_events.0230.a: "[throat_singer.GetFirstNameNoTooltip] thật tài năng."
  feast_tsagaan_sar_events.0230.b: "[throat_singer.GetSheHe|U] có thể cải thiện..."
  feast_tsagaan_sar_events.0230.b_tt: "Ngài la ó màn trình diễn của [throat_singer.GetFirstNamePossessiveNoTooltip], gây xấu hổ cho [throat_singer.GetHerHim]"
  feast_tsagaan_sar_events.0230.c: "Có lẽ Ta sẽ cùng [throat_singer.GetHerHim] hát."
  feast_tsagaan_sar_events.0230.d: "À, Ta cũng muốn hát theo [throat_singer.Custom('GetThroatSingingStyle')|U]!"
  feast_tsagaan_sar_events.0230.d.duel: "Ngài cố gắng bắt chước phong cách của [throat_singer.GetHerHis]"
  feast_tsagaan_sar_events.0230.d.success: "Nỗ lực của Ngài thành công"
  feast_tsagaan_sar_events.0230.d_tt: "Ngài học được phong cách hát cổ họng [throat_singer.Custom('GetThroatSingingStyle')|U]"
  feast_tsagaan_sar_events.0230.d.failure: "Nỗ lực thất bại, nhưng Ngài vẫn học được chút ít"

  feast_tsagaan_sar_events.0240.t: "Món Quà Âm Nhạc"
  feast_tsagaan_sar_events.0240.desc: "Thưởng thức một đêm uống rượu và cười đùa với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('audience'))], [audience.GetFirstName], [audience.GetSheHe] nhắc đến việc hát cổ họng. Ta thoáng nhắc đến kinh nghiệm của mình, và [audience.GetSheHe] cười rạng rỡ.\n\n"Ngài có thể hát theo [ROOT.Char.Custom('GetThroatSingingStyle')]?" [audience.GetFirstNameNoTooltip] hỏi. "Ta muốn nghe một bài hát!""
  feast_tsagaan_sar_events.0240.a: "Hãy coi đó là món quà của Ngài."
  feast_tsagaan_sar_events.0240.duel: "Ngài trình diễn cho [audience.GetFirstNameNoTooltip]"
  feast_tsagaan_sar_events.0240.duel_new: "Ngài trình diễn cho [audience.GetFirstNameNoTooltip], theo phong cách mới"
  feast_tsagaan_sar_events.0240.success: "[audience.GetSheHe|U] bị cuốn hút bởi tài năng của Ngài"
  feast_tsagaan_sar_events.0240.ok: "Màn trình diễn của Ngài phần nào gây ấn tượng với [audience.GetFirstNameNoTooltip]"
  feast_tsagaan_sar_events.0240.sygyt: "Ta muốn thử hát theo [Glossary( 'sygyt', 'SYGYT_GLOSS' )]..."
  feast_tsagaan_sar_events.0240.hoomei: "Còn thử phong cách [Glossary( 'hoomei', 'HOOMEI_GLOSS' )] thì sao?"
  feast_tsagaan_sar_events.0240.kargyraa: "Thực ra Ta muốn hát theo [Glossary( 'kargyraa', 'KARGYRAA_GLOSS' )]."
  feast_tsagaan_sar_events.0240.d_shy: "Lẽ ra Ta không nên nói gì."
  feast_tsagaan_sar_events.0240.d: "Ta không phải người trình diễn giỏi."
  feast_tsagaan_sar_events.0240.success_sygyt_tt: "Ngài quên phong cách cũ, học phong cách hát cổ họng sygyt"
  feast_tsagaan_sar_events.0240.success_hoomei_tt: "Ngài quên phong cách cũ, học phong cách hát cổ họng hoomei"
  feast_tsagaan_sar_events.0240.success_kargyraa_tt: "Ngài quên phong cách cũ, học phong cách hát cổ họng kargyraa"
  SYGYT_GLOSS: "#bold Sygyt#! là phong cách hát cổ họng thường giống tiếng huýt hoặc sáo. Trong và cao, dùng để mô phỏng âm thanh gió hoặc tiếng chim hót."
  HOOMEI_GLOSS: "Phong cách hát cổ họng phổ biến nhất, #bold Hoomei#! hay #bold Khoomei#! có âm thanh rền rĩ, thường hát ở tông trung."
  KARGYRAA_GLOSS: "Phong cách hát cổ họng sâu, gần như gầm, được gọi là #bold Kargyraa#!. Dùng dây thanh giả của người hát, giống tiếng thú gầm hoặc sấm rền."

  friend_throat_singing: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] gắn kết qua màn trình diễn hát cổ họng."
  rival_throat_singing: "[CHARACTER.GetShortUIName|U] xúc phạm màn hát cổ họng của [TARGET_CHARACTER.GetShortUINamePossessive|U]."
  rival_throat_singing_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] xúc phạm màn hát cổ họng của [CHARACTER.GetShortUINamePossessive|U]."

  feast_tsagaan_sar_events.0250.t: "Những Kỵ Sĩ của [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
  feast_tsagaan_sar_events.0250.desc: "Một người chăn gia súc dẫn đến một đàn ngựa, bộ lông của chúng lấp lánh dưới ánh trăng. Khách mời tụ tập xung quanh, ngắm nhìn những con vật, [horse_rider_1.GetName] háo hức lao tới cưỡi ngựa, với [horse_rider_2.GetName] theo sau.\n\n"Đấu với cậu nhé, [horse_rider_1.GetFirstNameNoTooltip]!" [horse_rider_2.GetFirstNameNoTooltip] gọi. [horse_rider_1.GetFirstNameNoTooltip] cười đáp. "Chúng ta đừng vội vàng, [horse_rider_2.GetFirstNameNoTooltip]. Phải tiết kiệm sức cho cuộc đua!"\n\n[horse_rider_2.GetFirstNameNoTooltip] gật đầu đồng ý. "Có ai muốn tham gia với chúng Ta không? Hay đặt cược?" [horse_rider_2.GetSheHe|U] hỏi."
  feast_tsagaan_sar_events.0250.a: "[horse_rider_1.GetFirstNameNoTooltip] sẽ thắng!"
  feast_tsagaan_sar_events.0250.a_tt: "Ngài đặt cược [horse_rider_1.GetFirstNameNoTooltip] thắng cuộc đua"
  feast_tsagaan_sar_events.0250.b: "[horse_rider_2.GetFirstNameNoTooltip] có vẻ là đối thủ mạnh."
  feast_tsagaan_sar_events.0250.b_tt: "Ngài đặt cược [horse_rider_2.GetFirstNameNoTooltip] thắng cuộc đua"
  feast_tsagaan_sar_events.0250.c: "Ta sẽ thắng cả hai người!"
  feast_tsagaan_sar_events.0250.c_tt: "Ngài tham gia vào cuộc đua"
  feast_tsagaan_sar_events.0250.d: "Ta chỉ xem thôi."
  feast_tsagaan_sar_events.0250.after_tt: "Cuộc đua bắt đầu..."

  feast_tsagaan_sar_events.0251.desc_intro: "Các kỵ sĩ đã sẵn sàng, và đám đông háo hức chờ kết quả. [horse_rider_1.GetName] và [horse_rider_2.GetName] đã chuẩn bị, các khách mời khác chuẩn bị xem."
  feast_tsagaan_sar_events.0251.desc_watch: "Ta leo lên một con ngựa gần đó và chậm rãi đi lên một ngọn đồi, tìm chỗ quan sát tốt hơn đường đua. Họ bắt đầu, và khách mời reo hò khi họ phi qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]."
  feast_tsagaan_sar_events.0251.desc_race: "Khi Ta cưỡi ngựa, [horse_rider_1.GetFirstNameNoTooltip] và [horse_rider_2.GetFirstNameNoTooltip] liếc Ta một cái. "Cậu tham gia với chúng Ta à?" [horse_rider_1.GetFirstNameNoTooltip] hỏi. "Có," Ta đáp, và chúng Ta lao đi, đua qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')].\n\nChúng Ta cưỡi với tốc độ đều, và Ta nhanh chóng suy nghĩ cách giành lợi thế."
  feast_tsagaan_sar_events.0251.a: "Những kỵ sĩ tuyệt vời!"
  feast_tsagaan_sar_events.0251.b: "Một cú húc vào [horse_rider_1.GetFirstNameNoTooltip] sẽ ổn thôi."
  feast_tsagaan_sar_events.0251.b.duel: "Ngài cố gắng hất [horse_rider_1.GetFirstNameNoTooltip] khỏi ngựa của [horse_rider_1.GetHerHis]"
  feast_tsagaan_sar_events.0251.b_tt: "#p [horse_rider_1.GetFirstNameNoTooltip] bị loại khỏi cuộc đua#!"
  feast_tsagaan_sar_events.0251.c: "[horse_rider_2.GetFirstNameNoTooltip] trông có vẻ nguy hiểm..."
  feast_tsagaan_sar_events.0251.c.duel: "Ngài cố gắng hất [horse_rider_2.GetFirstNameNoTooltip] khỏi ngựa của [horse_rider_2.GetHerHis]"
  feast_tsagaan_sar_events.0251.c_tt: "#p [horse_rider_2.GetFirstNameNoTooltip] bị loại khỏi cuộc đua#!"
  feast_tsagaan_sar_events.0251.success: "Ngài phá hoại kỵ sĩ thành công"
  feast_tsagaan_sar_events.0251.failure: "Ngài thất bại trong việc làm hại kỵ sĩ"
  feast_tsagaan_sar_events.0251.lose: "#n Ngài bị loại khỏi cuộc đua#!"
  feast_tsagaan_sar_events.0251.d: "Ta sẽ giữ nhịp điệu của mình."
  feast_tsagaan_sar_events.0251.d.knocked_out_1: "[horse_rider_1.GetFirstNameNoTooltip] không theo kịp"
  feast_tsagaan_sar_events.0251.d.knocked_out_2: "[horse_rider_2.GetFirstNameNoTooltip] bị bỏ lại phía sau"
  feast_tsagaan_sar_events.0251.d.knocked_out_3: "Nhịp điệu của Ngài quá chậm"
  feast_tsagaan_sar_events.0251.after_tt: "Cuộc đua tiếp tục..."
  feast_tsagaan_sar_events.0251.d_title: "Một kỵ sĩ bị loại khỏi cuộc đua!"

  rival_cheated_horse_race: "[CHARACTER.GetShortUIName|U] gian lận trong cuộc đua ngựa với [TARGET_CHARACTER.GetShortUINamePossessive|U]."
  rival_cheated_horse_race_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] gian lận trong cuộc đua ngựa với [CHARACTER.GetShortUINamePossessive|U]."

  feast_tsagaan_sar_events.0252.desc_knocked: "Ta nhìn hai kỵ sĩ vượt qua, và không khỏi cảm thấy ghen tị một chút. Lẽ ra Ta mới là người chiến thắng, nhưng Ta không thể theo kịp tốc độ của họ."
  feast_tsagaan_sar_events.0252.desc_knocked_1: "Ta liếc ra sau khi [horse_rider_1.GetFirstNameNoTooltip] ngã xuống, chỉ còn [horse_rider_2.GetFirstNameNoTooltip]. Chúng Ta sát nút nhau, khách mời reo hò phấn khích."
  feast_tsagaan_sar_events.0252.desc_knocked_2: "Ta liếc ra sau khi [horse_rider_2.GetFirstNameNoTooltip] ngã xuống, chỉ còn [horse_rider_1.GetFirstNameNoTooltip]. Chúng Ta sát nút nhau, khách mời reo hò phấn khích."
  feast_tsagaan_sar_events.0252.desc_watch: "[horse_rider_1.GetFirstNameNoTooltip] và [horse_rider_2.GetFirstNameNoTooltip] sát nút nhau, đám đông hồi hộp. Các kỵ sĩ gần vạch đích, khách mời hò reo."
  feast_tsagaan_sar_events.0252.a: "Chắc [final_opponent.GetFirstNameNoTooltip] sẽ không phiền nếu Ta thắng..."
  feast_tsagaan_sar_events.0252.a.duel: "Ngài cố vượt mặt [final_opponent.GetFirstNameNoTooltip]"
  feast_tsagaan_sar_events.0252.success: "Ngài lừa được [final_opponent.GetFirstNameNoTooltip]"
  feast_tsagaan_sar_events.0252.failure: "[final_opponent.GetFirstNameNoTooltip] phát hiện mưu kế của Ngài"
  feast_tsagaan_sar_events.0252.b: "Xem nó kết thúc ra sao..."
  feast_tsagaan_sar_events.0252.c: "Thêm một cú thúc nữa!"
  feast_tsagaan_sar_events.0252.after_tt: "Cuộc đua kết thúc"

  feast_tsagaan_sar_events.0253.desc_lost: "[rider_winner.GetName] nhanh chóng quay ngựa của [rider_winner.GetHerHis], và ta bị bỏ lại trong làn bụi mù. Ta quan sát [rider_winner.GetSheHe] băng qua vạch đích, và đám đông vỡ òa trong sự phấn khích."
  feast_tsagaan_sar_events.0253.desc_won: "Ta nỗ lực lần cuối, ngựa Ta vượt qua [rider_winner.GetName]. Ta băng vạch đích, đám đông reo hò phấn khích."
  feast_tsagaan_sar_events.0253.desc_watch: "[horse_rider_1.GetName] và [horse_rider_2.GetName] tăng tốc chậm, chưa rõ người thắng. Đột nhiên, [rider_winner.GetFirstNameNoTooltip] vượt lên và về nhất. Đám đông reo hò."
  feast_tsagaan_sar_events.0253.a: "Thật một màn trình diễn!"
  feast_tsagaan_sar_events.0253.winner: "Ta là người chiến thắng!"
  feast_tsagaan_sar_events.0253.b:  "Ấn tượng, [rider_winner.GetFirstNameNoTooltip]."
  feast_tsagaan_sar_events.0253.c: "Lần sau Ta sẽ thắng."
  feast_tsagaan_sar_events.0253.d: "Ta có thể cần một kỵ sĩ như Ngài, [rider_winner.GetFirstNameNoTooltip]."
  feast_tsagaan_sar_events.0253.bet_tt: "Ngài thắng cược"

  feast_tsagaan_sar_events.0260.t: "Bộ Sưu Tập Lộng Lẫy của [drip_haver.GetFirstNamePossessiveNoTooltip]"
  feast_tsagaan_sar_events.0260.desc: "Ta phát hiện [drip_haver.GetName] từ xa, và thấy mình đang nhìn chằm chằm vào những bộ trang phục thanh tao của [drip_haver.GetHerHis]. [drip_haver.GetSheHe|U] được trang hoàng trong một chiếc [Glossary( 'deel', 'DEEL_GLOSS' )] lụa màu trắng tuyệt đẹp, được tô điểm bằng những sợi lông vũ mềm mại. \n\n[drip_haver.GetFirstNameNoTooltip] tiến lại gần ta, và [drip_haver.GetSheHe] cười say sưa. \"À, [ROOT.Char.GetFirstNameNoTooltip]! Ta hy vọng tối nay ngài có sự bình yên trong tâm hồn.\" Ta gật đầu đồng ý, và suy ngẫm xem nên nói gì tiếp theo."
  feast_tsagaan_sar_events.0260.a: "Khen ngợi [drip_haver.GetHerHim] về trang phục của [drip_haver.GetHerHis]."
  feast_tsagaan_sar_events.0260.b_shy: "Lặng lẽ đi chỗ khác."
  feast_tsagaan_sar_events.0260.b: "Rời đi."

  friend_tsagaan_sar_compliment: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] trở thành bạn sau khi [CHARACTER.GetShortUIName|U] khen ngợi trang phục của [TARGET_CHARACTER.GetShortUINamePossessive|U]."

  feast_tsagaan_sar_events.0270.t: "Thử Thách Của Chén Rượu"
  feast_tsagaan_sar_events.0270.desc: "[drinker.GetName] đi lạch bạch tới Ta, cầm trong tay một chén [Glossary( 'airag', 'AIRAG_GLOSS' )]. [drinker.GetSheHe|U] cười, nâng chén chúc mừng. "Chúc Ngài, [ROOT.Char.GetFirstNameNoTooltip]!" [drinker.GetFirstNameNoTooltip] hô to.\n\nTa cầm chén, nâng lên môi. Airag mạnh, và Ta cảm nhận ngay tác dụng. "Ta cá là Ta uống được nhiều hơn cậu," [drinker.GetFirstNameNoTooltip] thách thức."
  AIRAG_GLOSS: "#bold Airag#! hoặc #bold Kumis#! là thức uống truyền thống của Mông Cổ và Turkic làm từ sữa ngựa cái lên men."
  feast_tsagaan_sar_events.0270.win: "Ngài uống nhiều hơn [drinker.GetFirstNameNoTooltip]"
  feast_tsagaan_sar_events.0270.win_price: "Ngài uống nhiều hơn [drinker.GetFirstNameNoTooltip], nhưng phải trả giá"
  feast_tsagaan_sar_events.0270.lose: "[drinker.GetFirstNameNoTooltip] đánh bại Ngài"
  feast_tsagaan_sar_events.0270.a: "Được thôi, [drinker.GetFirstNameNoTooltip]!"
  feast_tsagaan_sar_events.0270.b: "Ta đã uống đủ tối nay."
  feast_tsagaan_sar_events.0270.b_paranoid: "Đợi đã... cậu vừa đưa Ta cái gì vậy?"

  feast_tsagaan_sar_events.0280.t: "Trí Tuệ Của Người Già"
  feast_tsagaan_sar_events.0280.desc: "Trong khoảnh khắc yên tĩnh, Ta nhìn thấy [elder.GetName] ngồi một mình, lơ đãng suy tư. Ta nhẹ nhàng chạm vào vai [elder.GetHerHis] xem [elder.GetSheHe] còn thức không, và [elder.GetSheHe] giật mình tỉnh dậy.\n\n"Ah, [ROOT.Char.GetFirstNameNoTooltip]," [elder.GetFirstNameNoTooltip] cười. "Xin lỗi. Ta đã tham dự nhiều lễ hội này, và vẫn rót tràn chén. Hy vọng Ngài đang vui vẻ." Ta cúi chào, ngồi cạnh [elder.GetHerHim], và chúng Ta chia sẻ khoảnh khắc im lặng. [elder.GetSheHe|U] nắm tay Ta và bắt đầu nói.\n\n"Ta thấy Ngài là người có tiềm năng lớn, [ROOT.Char.GetFirstNameNoTooltip]. Hỏi Ta cách xử lý mọi việc, Ta sẽ trả lời hết khả năng của mình.""
  feast_tsagaan_sar_events.0280.a: "Kể cho Ta về gia đình."
  feast_tsagaan_sar_events.0280.a_grow: "[elder.GetSheHe|U] gợi ý Ngài mở rộng gia đình"
  feast_tsagaan_sar_events.0280.a_strength: "[elder.GetSheHe|U] gợi ý Ngài củng cố mối quan hệ trong gia đình"
  feast_tsagaan_sar_events.0280.b: "Kể cho Ta về chiến tranh."
  feast_tsagaan_sar_events.0280.b_defense: "[elder.GetSheHe|U] gợi ý Ngài tập trung bảo vệ lãnh thổ"
  feast_tsagaan_sar_events.0280.b_attack: "[elder.GetSheHe|U] gợi ý Ngài tập trung chinh phục kẻ thù"
  feast_tsagaan_sar_events.0280.c: "Kể cho Ta về đàn gia súc."
  feast_tsagaan_sar_events.0280.c_tend: "[elder.GetSheHe|U] gợi ý Ngài chăm sóc đàn gia súc"
  feast_tsagaan_sar_events.0280.c_migrate: "[elder.GetSheHe|U] gợi ý Ngài di chuyển đàn gia súc"
  feast_tsagaan_sar_events.0280.d: "Ta chỉ muốn thưởng thức bầu không khí bên Ngài."

  feast_tsagaan_sar_events.0290.t: "Năm Con [ROOT.Char.Custom('GetLunarNewYearAnimal')|U]"
  feast_tsagaan_sar_events.0290.desc: "Đêm đã về khuya, với những âm thanh của tiếng cười và tiếng chén bát chạm nhau vang vọng khắp không gian. [wise_guy.GetName] tập hợp mọi người quanh chiếc yurt để nâng ly chúc mừng. \"Anh chị em!\" [wise_guy.GetSheHe|U] hét lên. \n\n\"Khi vầng trăng mới mọc, chúng ta tôn kính sức mạnh của [ROOT.Char.Custom('GetLunarNewYearAnimal')], và những phước lành mà nó mang lại. Cầu mong chúng ta [ROOT.Char.Custom('GetLunarNewYearAnimalToastDesc')].\" [wise_guy.GetFirstNameNoTooltip] nâng ly của [wise_guy.GetHerHis], và các vị khách làm theo, cổ vũ đồng thanh."
  feast_tsagaan_sar_events.0290.a: "Chúc mừng [ROOT.Char.Custom('GetLunarNewYearAnimal')]!"
  feast_tsagaan_sar_events.0290.b: "Wow, [wise_guy.GetFirstNameNoTooltip] thật uyên bác."
  feast_tsagaan_sar_events.0300.t: "Một Bàn Tay Giúp Đỡ"
  feast_tsagaan_sar_events.0300.desc: "Buổi tối đang dần kết thúc, và ta thấy mình ở một góc yên tĩnh của căn yurt. [cleaner.GetName] lầm bầm khe khẽ khi [cleaner.GetSheHe] vội vã dọn dẹp khu vực, nhặt nhạnh mọi mảnh vụn còn sót lại. Mặc dù các vị khách của ta được chào đón để tận hưởng thời gian mà không cần phải làm việc, nhưng [cleaner.GetFirstNameNoTooltip] đã tự mình nhận lấy việc dọn dẹp sau họ, giữ cho không gian chào đón năm mới thật tươi mới."
  feast_tsagaan_sar_events.0300.a: "Cảm ơn vì đã chăm chỉ, [cleaner.GetFirstNameNoTooltip]."
  feast_tsagaan_sar_events.0300.a_tt: "Ngài bày tỏ lòng biết ơn với [cleaner.GetFirstNameNoTooltip]"
  feast_tsagaan_sar_events.0300.b: "Ồ, hình như Ngài bỏ sót chỗ này."
  feast_tsagaan_sar_events.0300.b_tt: "Ngài cố tình tạo bừa cho [cleaner.GetFirstNameNoTooltip] dọn dẹp"
  feast_tsagaan_sar_events.0300.c: "À, thật tốt."

  feast_tsagaan_sar_events.0310.t: "Những Lời Thú Nhận Liều Lĩnh"
  feast_tsagaan_sar_events.0310.desc: "\"Quà cho [ROOT.Char.GetFirstName]? Ha! Thà bị quạ ăn còn hơn," [bragger.GetName] khoe với [bragger_friend.GetName]. "Shh!" [bragger_friend.GetFirstNameNoTooltip] xì, liếc về phía Ta. "Ngài không biết ai đang nghe đâu."\n\nNhưng lời nhắc của [bragger_friend.GetFirstNamePossessiveNoTooltip] đã muộn, và Ta nghe đủ lời khoe khoang của [bragger.GetHerHis] để biết [bragger.GetFirstNameNoTooltip] chưa tặng quà cho Ta năm nay."
  feast_tsagaan_sar_events.0310.a: "Cậu không có chỗ trong nhà Ta."
  feast_tsagaan_sar_events.0310.b: "Cần có một lễ vật để được ở lại."
  feast_tsagaan_sar_events.0310.b.duel: "Ngài cố lấy quà từ [bragger.GetFirstNameNoTooltip]"
  feast_tsagaan_sar_events.0310.b.success: "[bragger.GetFirstNameNoTooltip] nhượng bộ và chọn quà"
  feast_tsagaan_sar_events.0310.b.failure: "[bragger.GetFirstNameNoTooltip] từ chối tặng quà cho Ngài"
  feast_tsagaan_sar_events.0310.c: "Lần này Ta sẽ bỏ qua lời [bragger.GetHerHis]."

  feast_tsagaan_sar_events.0320.t: "Tôn Kính Người Già"
  feast_tsagaan_sar_events.0320.desc: "Thời gian trôi qua, trí tuệ tăng trưởng. Có những người sống nhiều năm trăng, truyền lại câu chuyện chinh phục và bài học cuộc sống. Thân thể họ yếu, giác quan mờ đi, nhưng trí óc vẫn minh mẫn, lời nói có giá trị.\n\nKhi thời gian của họ trên đời ít dần, không hại gì nếu thể hiện sự tôn trọng bằng một lễ vật."
  feast_tsagaan_sar_events.0320.a: "Tặng họ thật nhiều quà!"
  feast_tsagaan_sar_events.0320.a_tt: "Mỗi [activity_guest|E] lớn hơn #V 50#!:\n$EFFECT_LIST_BULLET$Nhận #p 10#! [opinion|E] về #V Ngài#!"
  feast_tsagaan_sar_events.0320.b: "Họ đã được tôn kính đủ."

  feast_tsagaan_sar_events.0010.t: "Tsagaan Sar"
  feast_tsagaan_sar_events.0010.desc: "\"[ROOT.Char.GetTitleAsNameNoTooltip],\" [gift_collector.GetName] gọi. "Đã đến lúc thu nhận lễ vật từ khách mời. Hy vọng Ngài sẵn sàng." [gift_collector.GetFirstNameNoTooltip] ra hiệu về phía cửa túp lều, nơi hàng khách đang chờ để dâng quà.\n\nTa gật đầu đồng ý, chuẩn bị cho phần còn lại của buổi tối."
  feast_tsagaan_sar_events.0010.a: "Mang lễ vật ra!"
  feast_tsagaan_sar_events.0010.a_tt: "Tổng cộng, Ngài nhận được:\n$EFFECT_LIST_BULLET$ [gold_i] #V [GetPlayer.MakeScope.Var('feast_gold_total').GetValue]#! [gold|E]\n$EFFECT_LIST_BULLET$ [herd_i] #V [GetPlayer.MakeScope.Var('feast_herd_total').GetValue]#! [herd|E]\n$EFFECT_LIST_BULLET$ [piety_i] #V [GetPlayer.MakeScope.Var('feast_piety_total').GetValue]#! [piety|E]\n$EFFECT_LIST_BULLET$ [prestige_i] #V [GetPlayer.MakeScope.Var('feast_prestige_total').GetValue]#! [prestige|E]"

