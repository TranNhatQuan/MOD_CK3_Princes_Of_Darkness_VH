l_english:
 
 #Pet Rock events
  pet_rock.0001.t: "Những Viên Đá Lót Đường"
  pet_rock.0001.desc: " #EMP Keng!#! \n\nTa đang đi dạo bên ngoài thì chiếc giày của ta va phải một viên đá nhỏ. Hòn sỏi va leng keng vào vài viên đá khác bên cạnh, rồi dừng lại cách ta một đoạn ngắn. Bị thu hút bởi sự tò mò, ta nhặt nó lên. Bề mặt gồ ghề của nó lại cảm thấy ấm áp một cách kỳ lạ.\n\nĐột nhiên, ta biết chính xác nó muốn gì. Viên đá đang tỏa ra một luồng khí #EMP thân thiện#!. Khi ta cúi nhìn nó, nằm gọn trong lòng bàn tay ta, sức nặng của nó cùng lúc mang lại cảm giác an tâm và đầy phấn khích."
  pet_rock.0001.a: "Chúng ta sẽ là Bạn Thân nhất!"
  pet_rock.0001.a.tt: "Cuộc phiêu lưu của hai Ngài chính thức bắt đầu!"
  pet_rock.0001.b: "Mình đang nghĩ cái gì vậy?"
  pet_rock.0001.b.tt: "Mình nên dành ít thời gian ở ngoài trời hơn..."

  pet_rock.0002.t: "Một Hòn Đá"
  pet_rock.0002.desc: "Khi hòn đá nằm yên trong lòng Ta, trông thật mãn nguyện, Ta bắt đầu suy nghĩ nên đặt tên cho [ROOT.Char.Custom('RockStoryHerHim')] là gì. Một cái tên mang tính lịch sử? Một cái tên gợi liên tưởng đến hình dạng của [ROOT.Char.Custom('RockStoryHerHis')]? Hay một cái tên để diễn tả cảm giác dễ chịu mà Ta có khi vuốt ve bề mặt [ROOT.Char.Custom('RockColor')] của [ROOT.Char.Custom('RockStoryHerHis')]?\n\nÀ, Ta biết rồi! Ta sẽ đặt tên cho [ROOT.Char.Custom('RockStoryHerHim')] là..."
  pet_rock.0002.a: "Đúng là một cái tên tuyệt vời!"

  pet_rock.0100.t: "[ROOT.Char.Custom('RockStoryName')]: Giá Trị Trầm Tích"
  pet_rock.0100.desc: "Sau thêm một ngày đầy căng thẳng, Ta ngồi phịch xuống ghế trong [ROOT.Char.Custom('GetChamber')] của mình – Ta còn có thể tiếp tục thế này được bao lâu nữa?\n\nKhi dịch chuyển chân, Ta nghe thấy một tiếng lạch cạch khe khẽ và phát hiện hòn đá cưng [ROOT.Char.Custom('RockStoryName')] đang nằm cạnh chỗ ngồi. Ta ngồi cùng [ROOT.Char.Custom('RockStoryHerHim')] một lúc, chỉ lắng nghe sự tĩnh lặng êm dịu và vuốt ve bề mặt [ROOT.Char.Custom('RockColor')] của [ROOT.Char.Custom('RockStoryHerHis')]."
  pet_rock.0100.a: "Ta nghĩ mình có thể tiếp tục thêm một thời gian nữa."

  pet_rock.0101.t: "[ROOT.Char.Custom('RockStoryName')]: Ánh Bóng Như Gương"
  pet_rock.0101.desc: "Trên mép bàn, hòn đá [ROOT.Char.Custom('RockStoryName')] của Ta nằm đó với vẻ u sầu. Ta liếc nhìn [ROOT.Char.Custom('RockStoryHerHim')]. Rõ ràng là [ROOT.Char.Custom('RockStorySheHe')] đang dỗi.\n\nCả hai chúng Ta đều biết [ROOT.Char.Custom('RockStorySheHe')] muốn được đánh bóng, để làm nổi bật lớp vỏ [ROOT.Char.Custom('RockColor')] xinh đẹp ấy. Chỉ có điều là loại chất đánh bóng yêu thích của [ROOT.Char.Custom('RockStoryHerHis')] lại #EMP đắt đỏ#!..."
  pet_rock.0101.a: "Được rồi, được rồi, ta sẽ đánh bóng cho ngươi."
  pet_rock.0101.b: "Ngươi đành chịu vậy nhé."

  pet_rock.0102.t: "[ROOT.Char.Custom('RockStoryName')]: Sạch Bong Kin Kít"
  pet_rock.0102.desc: "Màu [ROOT.Char.Custom('RockColor')] vốn rực rỡ trên bề mặt của [ROOT.Char.Custom('RockStoryName')] hôm nay trông có vẻ hơi xỉn. [ROOT.Char.Custom('RockStorySheHe')|U] ngồi ở vị trí quen thuộc của mình với ánh nhìn trách móc, cầu xin Ta cho [ROOT.Char.Custom('RockStoryHerHis')] đi tắm.\n\nHôm nay Ta #EMP có#! buổi thiết triều quan trọng, đúng không nhỉ? Giải thích chuyện này có vẻ không dễ chút nào..."
  pet_rock.0102.a: "Buổi họp có thể đợi!"
  pet_rock.0102.b: "Để hôm khác nhé, [ROOT.Char.Custom('RockStoryName')]."

  pet_rock.0103.t: "[ROOT.Char.Custom('RockStoryName')]: Dinh Dưỡng Lén Lút"
  pet_rock.0103.desc: "Một đĩa thức ăn đầy ắp nữa được đặt trước mặt Ta, dạ dày Ta gần như rên rỉ dưới sức nặng của những món trước đó. Một mùi hương tuyệt vời xộc vào mũi Ta: bạc hà!\n\nVừa ngửi thấy mùi này là Ta nghĩ ngay đến hòn đá [ROOT.Char.Custom('RockStoryName')] của mình. Bạc hà là mùi hương yêu thích của [ROOT.Char.Custom('RockStoryHerHis')]!\n\nTa gần như có thể #EMP cảm nhận#! được sự hiện diện nài nỉ của [ROOT.Char.Custom('RockStoryHerHis')] đang lan tỏa từ vị trí của [ROOT.Char.Custom('RockStoryHerHis')] trong túi áo Ta."
  pet_rock.0103.a: "Thử lén mang vài lá cho [ROOT.Char.Custom('RockStoryHerHim')] xem sao..."
  pet_rock.0103.b: "Tốt hơn là không nên."

  pet_rock.0104.t: "[ROOT.Char.Custom('RockStoryName')]: Chạm Đáy"
  pet_rock.0104.desc: "Ta trầm ngâm suy nghĩ khi bước qua [ROOT.Char.Custom('GetRoom')]. Bao thử thách và gian truân dồn lên vai một [ROOT.Char.GetTitleAsNameNoTooltip]! Có lẽ hòn đá [ROOT.Char.Custom('RockStoryName')] của Ta sẽ cho Ta một lời khuyên hay?\n\nTa vỗ vào túi áo, chỗ đậu quen thuộc của [ROOT.Char.Custom('RockStoryHerHis')]. Không có gì cả. Đột nhiên, Ta cảm thấy lạc lõng khi thiếu đi sự dẫn dắt bình thản của [ROOT.Char.Custom('RockStoryHerHis')].\n\nSự hoảng loạn bắt đầu dâng lên."
  pet_rock.0104.a: "Ừm, bên ngoài có một hòn trông #EMP khá giống#!..."
  pet_rock.0104.b: " #EMP [ROOT.Char.Custom('RockStoryName')]!#! [ROOT.Char.Custom('RockStorySheHe')] đâu rồi?"
  pet_rock.0104.b.success: "Ngài tìm thấy [ROOT.Char.Custom('RockStoryHerHim')] trong một chiếc rương"
  pet_rock.0104.b.failure: "...[ROOT.Char.Custom('RockStoryName')]?"
  pet_rock.0104.b.failure.tt: "Người  Bạn của bạn đã ra đi mãi mãi."
  pet_rock.0104.c: "Có khi nào [ROOT.Char.Custom('RockStorySheHe')] đi thăm một người Ngài khác không?"
  pet_rock.0104.c.tt: "Có lẽ [ROOT.Char.Custom('RockStorySheHe')] đã bước tiếp..."

  pet_rock.0105.t: "[ROOT.Char.Custom('RockStoryName')]: Rất Vui Được Gặp Ngươi"
  pet_rock.0105.desc: "Ta đang trò chuyện với hòn đá [ROOT.Char.Custom('RockStoryName')] bên ngoài, hồi tưởng về lần đầu chúng Ta gặp nhau, thì một tiếng reo vui vang lên bên tai. [other_rock_owner.GetFirstName] đang tiến lại gần Ta, ôm chặt... kia là một—\n\n\"Ta rất vui khi thấy ngài cũng có một người Ngài bằng đá, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [other_rock_owner.GetFirstName] đưa ra hòn đá của [other_rock_owner.GetHerHis] mình. \"Có lẽ chúng có thể làm Ngài với nhau chăng?\""
  pet_rock.0105.a: "Đúng là một hòn đá trông ngu ngốc."
  pet_rock.0105.b: "Ta chắc chắn chúng sẽ rất hợp nhau!"
  pet_rock.0105.c: "Xin lỗi, [ROOT.Char.Custom('RockStoryName')] hơi nhút nhát."

  pet_rock.0106.t: "[ROOT.Char.Custom('RockStoryName')]: Thụp!"
  pet_rock.0106.desc: "Ta đang ngồi tại bàn, đọc qua vài bức thư và bản báo cáo. [ROOT.Char.Custom('RockStoryName')] ngồi cạnh Ta, tận hưởng hơi ấm từ một tia nắng chiếu vào.\n\nTa với tay ra để vuốt ve bề mặt [ROOT.Char.Custom('RockColor')] của [ROOT.Char.Custom('RockStoryHerHis')], nhưng có vẻ [ROOT.Char.Custom('RockStorySheHe')] đang rất nghịch ngợm. Khi Ta vừa chạm tới, cái bàn chao đảo, và [ROOT.Char.Custom('RockStoryName')] lao cả thân mình khỏi mép bàn!"
  pet_rock.0106.a: "Ha ha! Đồ ngốc bé nhỏ!"

  pet_rock.0107.t: "[ROOT.Char.Custom('RockStoryName')]: Bị Xem Nhẹ Như Đá"
  pet_rock.0107.desc: "Khi Ta mang [ROOT.Char.Custom('RockStoryName')] về phòng mình, bề mặt [ROOT.Char.Custom('RockColor')] của [ROOT.Char.Custom('RockStoryHerHis')] nằm gọn trong tay Ta đầy mãn nguyện, Ta tự hỏi liệu [ROOT.Char.Custom('RockStorySheHe')] có đang ghen tị với Ta không. Rốt cuộc thì Ta có cả một [ROOT.Char.Custom('ResidenceBuilding')] cho riêng mình, có thể trang trí theo ý muốn, và là nơi che chở cho Bạn Bè cùng gia đình.\n\nCòn [ROOT.Char.Custom('RockStoryName')] thì không. Vậy có lẽ đã đến lúc khắc phục điều đó?\n\nTa nhìn xuống [ROOT.Char.Custom('RockStoryHerHim')] và trầm ngâm."
  pet_rock.0107.a: "[ROOT.Char.Custom('RockStoryName')] có thể ở cùng Ta trên giường!"
  pet_rock.0107.b: "Thử xem sao, tại sao không."
  pet_rock.0107.b.success: "Ngài xây dựng được một nơi trú ẩn tạm ổn"
  pet_rock.0107.b.failure: "Ngài đập trúng ngón tay cái"
  pet_rock.0107.c: "Ta nghĩ [ROOT.Char.Custom('RockStorySheHe')] thuộc kiểu hòn đá thích ở ngoài trời."

  pet_rock.0108.t: "[ROOT.Char.Custom('RockStoryName')]: Tất Cả Hay Không Gì Cả?"
  pet_rock.0108.desc: "Có một chỗ nhỏ khá kỳ lạ trên bức tường này, Ta nghĩ vậy, khi [ROOT.Char.Custom('RockStoryName')] nằm trong lòng bàn tay Ta. Bức tường bên ngoài [ROOT.Char.Custom('ResidenceBuilding')] của Ta bị thiếu mất một mảng.\n\nTa có thể cảm nhận được sự tò mò của [ROOT.Char.Custom('RockStoryName')] trong lòng bàn tay. Ta nâng [ROOT.Char.Custom('RockStoryHerHim')] lên quan sát, rồi theo một ý nghĩ chợt đến, đặt thẳng [ROOT.Char.Custom('RockStoryHerHim')] vào cái hốc đó. Đúng như Ta dự đoán, [ROOT.Char.Custom('RockStorySheHe')] vừa khít hoàn hảo.\n\nMột ý nghĩ lóe lên: có lẽ sẽ tốt hơn cho cả Ta và [ROOT.Char.Custom('RockStoryHerHim')] nếu [ROOT.Char.Custom('RockStorySheHe')] ở lại đây,"
  pet_rock.0108.landed: "như một phần của ngôi nhà và tổ ấm của Ta? Biết đâu chúng ta còn có thể tìm ra những cách mới và tốt hơn để sắp xếp những người  Bạn của[ROOT.Char.Custom('RockStoryHerHis')] thành các công trình của riêng họ?"
  pet_rock.0108.adventurer: "hạnh phúc trong ngôi nhà mới này chứ? Có lẽ chúng ta thậm chí còn có thể tìm cho [ROOT.Char.Custom('RockStoryHerHim')] một vài người bạn mới để giới thiệu [ROOT.Char.Custom('RockStoryHerHim')] khi lần tới chúng ta quay về..."
  pet_rock.0108.a: "Ta không thể nghĩ ra vinh dự nào lớn hơn!"
  pet_rock.0108.a.adventurer: "Đã đến lúc buông tay."
  pet_rock.0108.a.tt: "Cuộc phiêu lưu của Ngài cùng hòn đá khép lại."
  pet_rock.0108.b: "Ta không bao giờ có thể rời xa [ROOT.Char.Custom('RockStoryHerHim')]!"
  pet_rock.0108.b.tt: "[ROOT.Char.Custom('RockStorySheHe')|U] sẽ luôn đồng hành cùng Ta."
