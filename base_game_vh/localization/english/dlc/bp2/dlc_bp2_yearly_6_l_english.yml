l_english:
  bp2_yearly.6000.t: "Không phải cách của người [ROOT.Char.GetCulture.GetNameNoTooltip]"
  bp2_yearly.6000.desc.intro: "Khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hosted_child'))] của ta, [hosted_child.GetName], tự giới thiệu bản thân, [tutor.GetName] kể lại một tuần đầy những thất bại trong việc dạy dỗ và sự thất vọng."

  bp2_yearly.6000.desc.fault.bellicose: "\n\n\"Đứa trẻ chưa bao giờ được dạy rằng mọi thứ [hosted_child.GetSheHe] mong muốn đều phải #EMP giành lấy#!! [hosted_child.GetFirstNameNoTooltip] lại chọn hòa bình với bạn bè thay vì khẳng định bản thân! Đây là tất cả những gì đứa [hosted_child.Custom('GirlBoy')] này biết!\""
  bp2_yearly.6000.desc.fault.bureaucratic: "\n\n\"Đứa trẻ là một thảm họa vô tổ chức! [hosted_child.GetSheHe|U] mơ mộng cả ngày. [hosted_child.GetSheHe|U] còn chẳng phân biệt được đồ lót sạch với đồ bẩn! Hỗn loạn là tất cả những gì đứa [hosted_child.Custom('GirlBoy')] này biết!\""
  bp2_yearly.6000.desc.fault.communal: "\n\n\"Đứa trẻ nói xấu chính mẹ của [hosted_child.GetHerHis]! Chưa bao giờ [hosted_child.GetSheHe] được cảnh báo về điều đó. Đứa [hosted_child.Custom('GirlBoy')] này bị bỏ mặc để tự hành động, tự đứng vững, và không quan tâm đến những người thân đang chờ đợi [hosted_child.GetHerHim].\""
  bp2_yearly.6000.desc.fault.courtly: "\n\n\"Đứa trẻ chẳng được dạy gì về những điều tao nhã! Ta phải đập vào đầu [hosted_child.GetHerHis] để khiến [hosted_child.GetHerHim] cúi chào trước Ngài, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. [hosted_child.GetSheHe] có thể ngâm thơ không? Có thể cư xử đúng mực với người khác giới không? Không!\""
  bp2_yearly.6000.desc.fault.egalitarian: "\n\n\"[hosted_child.GetSheHe|U] chưa bao giờ được dạy phải tôn trọng những người dân cùng chung sống trên vùng đất này. Đứa trẻ bắt chước giọng của một nhân vật danh giá thuộc nhóm thiểu số [realm_minority.GetNameNoTooltip] bằng cách kêu be be như cừu! Đó là nền giáo dục của [hosted_child.GetHerHis] sao?!\""
  bp2_yearly.6000.desc.fault.egalitarian_no_culture: "\n\n\"[hosted_child.GetSheHe|U] chưa bao giờ được dạy phải tôn trọng những người dân cùng chung sống trên vùng đất này. Đứa trẻ bắt chước ngôn ngữ của họ bằng cách kêu be be như cừu! Đó là nền giáo dục của [hosted_child.GetHerHis] sao?!\""
  bp2_yearly.6000.desc.fault.spiritual: "\n\n\"Đứa trẻ có dừng lại để thể hiện lòng biết ơn vì thức ăn [hosted_child.GetHerHis] được ban cho không? [hosted_child.GetSheHe] có cầu xin thần linh giúp đỡ không? Không! [hosted_child.GetSheHe|U] đã được nuôi dưỡng cho một cuộc đời không có sự kính trọng.\""
  bp2_yearly.6000.desc.fault.stoic: "\n\n\"Đứa trẻ nhăn mũi trước vẻ đẹp của quê hương chúng ta. [hosted_child.GetSheHe|U] khinh thường việc phải đứng lên, chiến đấu — để bảo vệ dân tộc chúng ta! [hosted_child.GetSheHe|U] chỉ được dạy về sự ích kỷ hèn nhát.\""

  bp2_yearly.6000.desc.mid: "\n\nCơn thịnh nộ của [tutor.GetFirstNamePossessiveNoTooltip] trút lên [hosted_child.Custom2('RelationToMeShort', SCOPE.sC('childs_home_liege'))] của đứa trẻ.\n\n\"Có còn chút nào"

  bp2_yearly.6000.desc.value.bellicose: "nhiệt huyết và tinh thần chiến đấu"
  bp2_yearly.6000.desc.value.bureaucratic: "lý trí và trật tự"
  bp2_yearly.6000.desc.value.communal: "tình yêu gia tộc và cộng đồng"
  bp2_yearly.6000.desc.value.courtly: "phong thái quý tộc"
  bp2_yearly.6000.desc.value.egalitarian: "lễ nghĩa xã hội"
  bp2_yearly.6000.desc.value.spiritual: "sự tôn kính các nghi lễ thiêng liêng"
  bp2_yearly.6000.desc.value.stoic: "ý thức bổn phận với thần dân của [childs_home_liege.GetHerHis]"

  bp2_yearly.6000.desc.outro: "trong triều đình của [childs_home_liege.GetTitledFirstName]? Làm sao những thanh thiếu niên [ROOT.Char.GetCulture.GetNameNoTooltip] đúng nghĩa có thể xuất thân từ một nơi chẳng dạy gì về truyền thống của chúng ta?\""

  bp2_yearly.6000.a: "Tất cả sẽ biết sự khinh miệt của [childs_home_liege.GetTitleAsNamePossessiveNoTooltip]!"
  bp2_yearly.6000.a.tt: "Bênh vực đứa trẻ đáng thương [hosted_child.GetFirstNameNoTooltip], nạn nhân của sự thờ ơ với phong tục từ [hosted_child.GetHerHis] [hosted_child.Custom2('RelationToMeShort', SCOPE.sC('childs_home_liege'))]."

  bp2_yearly.6000.a.response: "[childs_home_liege.GetShortUIName] có thể mất [opinion|E] với những người cùng văn hóa [childs_home_liege.GetCulture.GetCollectiveNounNoTooltip]"

  bp2_yearly.6000.b: "Ta sẽ tự mình uốn nắn đứa trẻ."
  bp2_yearly.6000.b.success: "Những giá trị cao đẹp được khắc sâu"
  bp2_yearly.6000.b.failure: "Một vài giáo điều bị hiểu sai và bám chặt"
  bp2_yearly.6000.c: "Đừng làm phiền ta với mớ phong tục chết tiệt đó."

  defender_of_bellicose_ways_modifier: "Người Bảo Vệ Lối Sống Hiếu Chiến"
  defender_of_bellicose_ways_modifier_desc: "Nhân vật này kiên quyết chống lại mọi sự bôi nhọ các tập tục văn hóa của mình."
  defender_of_bureaucratic_ways_modifier: "Người Bảo Vệ Lối Sống Quan Liêu"
  defender_of_bureaucratic_ways_modifier_desc: "$defender_of_bellicose_ways_modifier_desc$"
  defender_of_communal_ways_modifier: "Người Bảo Vệ Lối Sống Cộng Đồng"
  defender_of_communal_ways_modifier_desc: "$defender_of_bellicose_ways_modifier_desc$"
  defender_of_courtly_ways_modifier: "Người Bảo Vệ Lối Sống Cung Đình"
  defender_of_courtly_ways_modifier_desc: "$defender_of_bellicose_ways_modifier_desc$"
  defender_of_egalitarian_ways_modifier: "Người Bảo Vệ Lối Sống Bình Đẳng"
  defender_of_egalitarian_ways_modifier_desc: "$defender_of_bellicose_ways_modifier_desc$"
  defender_of_spiritual_ways_modifier: "Người Bảo Vệ Lối Sống Tâm Linh"
  defender_of_spiritual_ways_modifier_desc: "$defender_of_bellicose_ways_modifier_desc$"
  defender_of_stoic_ways_modifier: "Người Bảo Vệ Lối Sống Khắc Kỷ"
  defender_of_stoic_ways_modifier_desc: "$defender_of_bellicose_ways_modifier_desc$"

  bp2_yearly.6001.opening: "[childs_host.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp2_yearly.6001.desc: "Việc chăm sóc [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hosted_child'))] của ngài là [hosted_child.GetName] đã phơi bày một sự thật đáng buồn: ngài chẳng mấy quan tâm đến các giá trị truyền thống của người [ROOT.Char.GetCulture.GetNameNoTooltip]. Những đứa trẻ không biết gì về phong tục của chúng ta rồi sẽ lớn lên thành"

  bp2_yearly.6001.desc.insult.bellicose: "những kẻ yếu hèn"
  bp2_yearly.6001.desc.insult_bureaucratic: "những kẻ vô dụng"
  bp2_yearly.6001.desc.insult.communal: "những kẻ lang thang"
  bp2_yearly.6001.desc.insult.courtly: "những kẻ thô lỗ"
  bp2_yearly.6001.desc.insult.egalitarian: "những kẻ vô lại"
  bp2_yearly.6001.desc.insult.spiritual: "những kẻ dị giáo"
  bp2_yearly.6001.desc.insult.stoic: "những kẻ ác nhân"

  bp2_yearly.6001.desc.outro: "trong triều đình của ngài.\n\nCác vị lãnh đạo trong dân ta đều biết chuyện này. Ta đã đảm bảo điều đó."
  bp2_yearly.6001.a: "Ta phải giải quyết việc này! Chúng ta phải chứng minh [childs_host.GetHerHim] đã sai!"
  bp2_yearly.6001.a.tt: "Những người dạy dỗ trong triều ta cần một cuộc nói chuyện nghiêm khắc về các giá trị."
  bp2_yearly.6001.b: "Ta sẽ hành động theo ý mình."
  bp2_yearly.6001.b.tt: "Ta không phải là người [ROOT.Char.GetCulture.GetNameNoTooltip] điển hình, nhưng ta có thể là một kẻ xuất chúng."
  enforcing_cultural_values_modifier: "Áp Đặt Giá Trị Văn Hóa"
  enforcing_cultural_values_modifier_desc: "Nhân vật này không ngừng yêu cầu các phong tục văn hóa của mình phải được thực thi."

  rejecting_bellicose_ways_modifier: "Khước Từ Lối Sống Hiếu Chiến"
  rejecting_bellicose_ways_modifier_desc: "\"Truyền thống ư? Kẻ ngu nào còn bận tâm đến mấy thứ truyền thống đó?\""
  rejecting_bureaucratic_ways_modifier: "Khước Từ Lối Sống Quan Liêu"
  rejecting_bureaucratic_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"
  rejecting_communal_ways_modifier: "Khước Từ Lối Sống Cộng Đồng"
  rejecting_communal_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"
  rejecting_courtly_ways_modifier: "Khước Từ Lối Sống Cung Đình"
  rejecting_courtly_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"
  rejecting_egalitarian_ways_modifier: "Khước Từ Lối Sống Bình Đẳng"
  rejecting_egalitarian_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"
  rejecting_spiritual_ways_modifier: "Khước Từ Lối Sống Tâm Linh"
  rejecting_spiritual_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"
  rejecting_stoic_ways_modifier: "Khước Từ Lối Sống Khắc Kỷ"
  rejecting_stoic_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"

  bp2_yearly.6010.t: "Không Có [sad_boi.GetWomanMan|U] Nào Bị Giam Giữ"
  bp2_yearly.6010.desc: ""#EMP Ta có nhiều bạn bè, nhưng quà tặng của họ thì chẳng có bao nhiêu...#!\" [sad_boi.GetFirstName] hát lên, giọng [sad_boi.GetHerHis] nghẹn lại vì xúc động.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sad_boi'))] của ta ném nhạc cụ sang một bên, bật khóc: \"Đủ rồi, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] này!\""
  bp2_yearly.6010.adult: "Nơi này thiếu thốn mọi sự an ủi.\"\n\nLiếc ta bằng ánh mắt héo hon, [sad_boi.GetSheHe] nói thêm: \"Bài hát này sẽ là lời cầu cứu của ta trong cảnh giam cầm bất hạnh này. Một ít tiền bạc... nếu dân ta vẫn còn quan tâm đến ta...\""
  bp2_yearly.6010.child: "Con buồn lắm ở đây.\"\n\nNgước nhìn ta với đôi mắt đẫm lệ, đứa [sad_boi.Custom('GirlBoy')] nói thêm: \"Nghe bài hát này, gia đình con sẽ mềm lòng! Họ sẽ gửi thứ gì đó để khiến cuộc #EMP lưu đày#! này dễ chịu hơn, nếu... họ vẫn còn quan tâm đến con...\""
  bp2_yearly.6010.outro: "\n\n[sad_boi.GetSheHe|U] lại cất lên giai điệu buồn bã ấy, ánh mắt [sad_boi.GetHerHis] hướng về một quê nhà xa xôi."
  bp2_yearly.6010.a: "Ừ, xem thử \"lòng hảo tâm\" của họ được đến đâu..."
  bp2_yearly.6010.a.tt: "...cho túi tiền của ta."
  bp2_yearly.6010.b: "Buồn ư?! #EMP Ta có thể giúp chứ?#!"
  bp2_yearly.6010.b.tt: "Triều đình của ta không thể bị ca tụng như một chốn khổ ải!"
  bp2_yearly.6010.c: "Ta phải dạy cho [sad_boi.GetHerHim] biết nơi này mới là chỗ của [sad_boi.GetHerHis]."
  bp2_yearly.6010.c.tt: "Dù sinh ra ở đây hay không, tất cả chúng ta đều phải chịu gian khổ với sự điềm tĩnh."
  bp2_yearly.6010.c.success: "[sad_boi.GetSheHe|U] sẽ cho [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] thêm một cơ hội"
  bp2_yearly.6010.c.tt_education: "Kết quả giáo dục của [sad_boi.GetFirstNamePossessive] sẽ được cải thiện"
  bp2_yearly.6010.c.failure: "Việc phủ nhận sự thật trong lời ca của [sad_boi.GetHerHis] khiến [sad_boi.GetFirstNameNoTooltip] khó chịu"
  bp2_yearly.6010.d: "Thực ra đây là một tác phẩm rất đẹp."
  bp2_yearly.6010.d.tt: "Hãy để khúc bi ca này được hát khắp nơi: vẻ đẹp của nó quan trọng hơn nội dung."

  bp2_yearly.6020.t: "Trẻ Con Nói Toàn Chuyện Buồn Cười"
  bp2_yearly.6020.desc: "Khi ta chia sẻ tin tức mới nhất từ triều đình của [snitch.GetHomeCourt.GetTitledFirstNamePossessive], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))] của ta là [snitch.GetName] trông có vẻ thích thú lạ thường, nụ cười xa xăm"
  bp2_yearly.6020.child: "trên khuôn mặt nhỏ bé của [snitch.GetHerHis].\n\n\"Ta có một câu chuyện, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Một câu chuyện do chính mắt ta chứng kiến! Nhưng... ta không được phép nói. Ta đã hứa rồi.\"\n\n[snitch.GetSheHe|U] khúc khích đầy tinh nghịch, thích thú với quyền lực hiếm có trước những bậc trưởng bối của [snitch.GetHerHis].\n\n\"Hư quá!\" [snitch.GetFirstNameNoTooltip] reo lên."
  bp2_yearly.6020.youth: "trên khuôn mặt nhờn bóng của tuổi thiếu niên [snitch.GetHerHis].\n\n\"Ta có một câu chuyện, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Ngài vừa khiến ta nhớ đến nó: một chuyện tuyệt đối không được kể lại! Nhưng... khi ấy ta còn quá nhỏ. Giờ nghĩ lại, cảm giác như đã lâu lắm rồi.\"\n\n[snitch.GetSheHe|U] cười khúc khích đầy hiểm ý, thích thú với quyền lực hiếm có trước những người mà [snitch.GetSheHe] từng được nuôi dưỡng bên cạnh.\n\n\"Hư quá!\" [snitch.GetFirstNameNoTooltip] reo lên."
  bp2_yearly.6020.liege: "\"Thiêng liêng làm sao, mà cũng hư hỏng làm sao!\""
  bp2_yearly.6020.family: "\"Gia đình cũng có thể hư hỏng lắm chứ!\""

  bp2_yearly.6020.a: "Cứ nói tiếp đi..."
  bp2_yearly.6020.a.secret: "Ngài biết được một [secret|e] của gia đình [snitch.GetShortUINamePossessive]"
  bp2_yearly.6020.a.non_family_secret: "Ngài biết được một [secret|e] từ vòng trong triều đình của [no_no_doer.GetShortUINamePossessive] [court|E]"
  bp2_yearly.6020.a.success: "Một câu chuyện dơ bẩn đầy khoái trá"
  bp2_yearly.6020.a.failure: "Chỉ là sự ngây ngô trẻ con mà thôi..."
  bp2_yearly.6020.a.no_secret: "Ngài không biết được điều gì quan trọng"
  bp2_yearly.6020.b: "Lắm lời sẽ dẫn đến ô nhục."
  bp2_yearly.6020.b.tt: "[snitch.GetFirstNameNoTooltip] nên coi trọng đức tính kín miệng hơn là buôn chuyện."
  bp2_yearly.6020.b.discretion: "[snitch.GetShortUIName] ít có khả năng tiết lộ [secrets|E] của Ngài hơn"

  bp2_yearly.6030.t: "Đôi Mắt Của Gia Tộc"
  bp2_yearly.6030.desc: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))] [snitch.GetFirstName] [snitch.Custom('ComplimentAdjective')] của ta khiến buổi dạo bước mơ màng trong một buổi sáng mờ sương trở nên tươi sáng hơn, khi kể cho ta nghe về quãng thời gian làm con tin dưới sự chăm sóc của [warden.GetNamePossessive].\n\n[snitch.GetSheHe|U] đã trở về với nhiều thay đổi: khôn ngoan hơn, tinh ý hơn. Một thành viên trung thành của Nhà [snitch.GetDynastyHouseName], thích nghi tốt với cuộc sống nơi đất khách quê người.\n\nMột thành viên trung thành của Nhà [snitch.GetDynastyHouseNameNoTooltip]... có lẽ việc gia tộc ta từng có người hiện diện tại triều đình của [warden.GetTitledFirstNamePossessiveNoTooltip] cũng đem lại những giá trị nhất định...?"
  bp2_yearly.6030.hostage_reticent: "\n\nTuy nhiên, [snitch.GetFirstNameNoTooltip] tỏ ra #negative_value cực kỳ miễn cưỡng#! khi làm chỉ điểm cho ta. Có lẽ nó thậm chí đã bị cảnh cáo về việc đó."
  bp2_yearly.6030.hostage_normal: "\n\nCụ thể thì — [snitch.GetFirstNameNoTooltip] biết được những gì, nếu có?"

  bp2_yearly.6030.a: "Ta có thể moi ra bí mật của [warden.GetPrimaryTitle.GetNameNoTierNoTooltip]..."
  bp2_yearly.6030.maybe_secret: "#high [snitch.GetFirstName]#! #EMP có thể#! chia sẻ một [secret|E] từ vòng trong của [warden.GetShortUINamePossessive]"
  bp2_yearly.6030.a.success: "Ngài biết tất cả những gì [snitch.GetFirstNameNoTooltip] biết"
  bp2_yearly.6030.a.failure: "[snitch.GetFirstNameNoTooltip] lảng tránh thẩm vấn"
  bp2_yearly.6030.a.no_secret: "[snitch.GetFirstName] biết... không có gì quan trọng"
  bp2_yearly.6030.a.evade: "#high [snitch.GetFirstName]#! không chia sẻ điều gì hữu ích"

  bp2_yearly.6030.b: "Vì những đóng góp cho gia tộc [snitch.GetHerHis] — hãy ban thưởng!"
  bp2_yearly.6030.b.tt: "Hãy cho [snitch.GetHerHim] biết ta tưởng thưởng hậu hĩnh cho các điệp viên và chỉ điểm!"
  bp2_yearly.6030.b.failure: "[snitch.GetFirstNameNoTooltip] không cung cấp [secrets|E] nào"
  bp2_yearly.6030.b.rewarded: "#high [snitch.GetFirstName]#! có khả năng cao hơn nhiều tham gia vào các [schemes|E] của Ngài"

  bp2_yearly.6030.refuse_reward: "#high [snitch.GetFirstName]#! không hợp tác và không bị lay chuyển"


  bp2_yearly.6030.c: "Không có danh dự thì việc giữ con tin chẳng có giá trị gì."
  bp2_yearly.6030.c.tt: "Các quy tắc của thỏa thuận này là nghiêm ngặt và bất khả xâm phạm."
  bp2_yearly.6030.c.honor: "[rulers|E] sẽ có xu hướng đề nghị và yêu cầu [hostages|E] với Ngài nhiều hơn"
  bp2_yearly.6030.c.hostage_secrets: "@alert_icon! #alert_trial Ngài sẽ nhận [tyranny|E] khi ép buộc khai thác [secrets|E] từ [hostages|E]#!"

  honorable_warden_modifier: "Người Giám Hộ Danh Dự"
  honorable_warden_modifier_desc: "Nhân vật này cam kết dành cho [hostages|e] sự tôn nghiêm bất khả xâm phạm."

  bp2_yearly.6040.t: "Tất Cả Những Gì Ta Không Phải"
  bp2_yearly.6040.desc: "Ta quan sát những đứa trẻ trẻ nhất trong số [ROOT.Char.GetCulture.GetCollectiveNoun] tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] học tập. Chậm hiểu, thiếu kỷ luật, chúng cãi vã chẳng khác gì cha mẹ mình.\n\nHoàn toàn không giống với [advanced_culture.GetCollectiveNoun] tại vùng đất kỳ diệu [childhood_location.GetCounty.GetTitle.GetNameNoTier]. Vương quốc của họ là trật tự, là những công trình vĩ đại và tư tưởng lớn lao. Khi ta từng"
  bp2_yearly.6040.hostage: "bị giữ làm con tin"
  bp2_yearly.6040.education: "được giáo dục"
  bp2_yearly.6040.outro: "ở đó, ta đã được khai sáng.\n\nTa dần nhìn dân tộc mình như những kẻ nguyên thủy.\n\nTa có thể thay đổi điều đó. Được trang bị kiến thức [advanced_culture.GetNameNoTooltip] từ thuở thiếu thời... có lẽ ta nên dẫn dắt họ bước lên con đường cải cách đầy bất định?"

  bp2_yearly.6040.a: "Triều đại của ta có thể là một cuộc tái sinh."
  bp2_yearly.6040.a.tt: "Du nhập tri thức ngoại bang để thay thế con đường cũ — hoặc đưa dân tộc ta lên đỉnh cao mới."
  bp2_yearly.6040.a.reforms: "Ngài sẽ cố gắng cải cách và phát triển [culture|E], [court|E] và [realm|E] theo mô hình [advanced_culture.GetName]"
  bp2_yearly.6040.a.warning: "@alert_icon! #alert_trial Việc này sẽ rất khó khăn và tốn kém. Hãy chắc chắn rằng Ngài đã sẵn sàng.#!"
  bp2_yearly.6040.b: "Tại sao lại #EMP nghĩ tới#! việc thách thức truyền thống của chúng ta?"
  bp2_yearly.6040.b.tt: "Ta ôm trọn những giá trị tinh túy của [ROOT.Char.GetCulture.GetNameNoTooltip] và quay lưng với mọi thứ khác!"
  bp2_yearly.6040.b.promote_culture: "Nhiệm vụ [promote_culture|E] của [councillor_task|E] sẽ hiệu quả hơn trong #high 25 năm#!"
  bp2_yearly.6040.b.no_reforms: "Ngài sẽ không cân nhắc các cải cách này thêm lần nào nữa"
  bp2_yearly.6040.c: "Bây giờ đơn giản là chưa phải lúc."
  bp2_yearly.6040.c.recurring: "Động lực cải cách này nhiều khả năng sẽ xuất hiện trở lại"

  devoted_to_tradition_modifier: "Người Bảo Vệ Truyền Thống"
  devoted_to_tradition_modifier_desc: "Từ chối giao du với người ngoài, nhân vật này là một người cổ vũ nổi tiếng cho dân tộc mình."
  bp2_devoted_to_tradition_modifier_conversion_task_desc: "$devoted_to_tradition_modifier$"

  bp2_yearly.6050.t: "Đá, Sắt, Đất Sét và Gỗ Đan"
  bp2_yearly.6050.desc: "Theo lệnh ta, những con đường mới đẽo gọt và các tiền đồn khiêm tốn đầu tiên vươn ra từ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] — được xây dựng theo phong cách của các con đường, pháo đài và văn phòng thuế vĩ đại của [advanced_culture.GetName].\n\nDẫu vậy, kinh đô của ta vẫn chưa thể sánh với [childhood_location.GetCounty.GetTitle.GetNameNoTier] lộng lẫy, cũng như [ROOT.Char.GetPrimaryTitle.GetNameNoTier] chưa phải là vùng đất đông đúc, giàu thương mại và thủ công. #EMP Nhưng rồi sẽ là.#!\n\nBên cạnh ta, [noble_representative.GetTitledFirstName] nhìn những công trình mới và các kiến trúc sư ngoại bang của ta với ánh mắt nghi ngờ.\n\n\"Ngài đang làm giàu cho #EMP thương nhân#! và #EMP thường dân#!,\" người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noble_representative'))] của ta cười khẩy, \"trong khi giới quý tộc trung thành của ngài hoàn toàn có thể dựng nên những đại sảnh mới từ ân huệ của ngài!\""

  bp2_yearly.6050.a: "Kinh đô mới vĩ đại của ta sẽ phồn thịnh!"
  bp2_yearly.6050.a.tt: "Một viên ngọc mới sẽ tỏa sáng giữa các thành phố của vùng đất định cư; cư dân của nó sẽ giàu có — và ta cũng vậy."
  bp2_yearly.6050.b: "Người văn minh chúng ta không #EMP ban phát#!. Chúng ta đánh thuế và xây dựng."
  bp2_yearly.6050.b.tt: "Những khoản thu này là điều bình thường ở xứ người — và giờ đây cũng là như vậy tại đây!"
  bp2_yearly.6050.every_county_development: "Mức [development|E] ở mọi [county|E] trong [domain|E] của Ngài sẽ thay đổi #positive_value +1#!"
  bp2_yearly.6050.county_control_loss: "Mức [control|E] sẽ thay đổi #negative_value -30#! tại mọi [county|E] trong [domain|E] của Ngài"
  bp2_yearly.6050.county_opinion_modifier: "Mọi [county|E] không thuộc [advanced_culture.GetName] trong [domain|E] của Ngài nhận [GetModifier('unprecedented_taxation_modifier').GetNameWithTooltip]"
  bp2_yearly.6050.c: "Ta không thể quay lưng với giới quý tộc!"
  bp2_yearly.6050.c.tt: "Ta sẽ luôn ưu ái các đại quý tộc của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] hơn tất cả."
  bp2_yearly.6020.pay_vassals: "Ngài trả [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]#! cho toàn bộ [powerful_vassals|E] #EMP và#! mất [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]"

  bp2_yearly.6050.reaffirmation_path: "@alert_icon! #alert_trial Điều này #EMP nhanh chóng#! góp phần củng cố các phong tục [root_scope.GetCulture.GetNameNoTooltip]#!"
  bp2_yearly.6050.reform_path: "@alert_icon! #alert_trial Điều này góp phần thúc đẩy các cải cách sâu rộng theo [advanced_culture.GetNameNoTooltip]#!"

  cultural_acceptance_gain_beginning_reforms: "Một [ruler|E] bắt đầu du nhập phong tục của [culture_possessive|E] khác"
  cultural_acceptance_gain_building_familiar_settlements: "Một [realm|E] của nhà cải cách được tái thiết theo phong cách nay đã trở nên quen thuộc"
  cultural_acceptance_turned_away_trade: "Bằng những lời dối trá về đại công trình, một [ruler|E] đã lừa gạt thợ xây và thương nhân của [culture|E] khác"

  massive_construction_efforts_modifier: "Nỗ Lực Xây Dựng Quy Mô Lớn"
  massive_construction_efforts_modifier_desc: "Các bậc thợ lành nghề được nhập khẩu ồ ạt để thực hiện những dự án vĩ đại tại đây."

  great_builder_modifier: "Đại Kiến Trúc Sư"
  great_builder_modifier_desc: "Một người bảo trợ tận tâm cho các công trình tham vọng: nhà hiện đại hóa và là người sử dụng nhân tài ngoại quốc."

  unprecedented_taxation_modifier: "Thuế Khóa Chưa Từng Có"
  unprecedented_taxation_modifier_desc: "Các loại thuế theo kiểu ngoại bang, khắc nghiệt hơn cả những gì từng tưởng tượng, tài trợ cho sự phát triển địa phương đầy bất mãn."

  loyal_realm_nobility_modifier: "Được Giới Quý Tộc Trong Nước Yêu Mến"
  loyal_realm_nobility_modifier_desc: "Nhân vật này đã vun đắp mối quan hệ cuồng nhiệt với các chiến binh quý tộc của dân tộc mình."

  bp2_yearly.6060.t: "Nghiên Cứu Về Vĩnh Cửu"
  bp2_yearly.6060.desc: "Những nghi lễ bẩn thỉu của [ROOT.Char.GetCulture.GetName], con đường thờ phụng [ROOT.Char.GetFaith.GetName] của chúng ta... chẳng lẽ ta chỉ là lũ trẻ khóc lóc trong bóng tối?\n\nKhi [clergy_representative.GetFirstName] và các [clergy_representative.GetFaith.PriestNeuterPlural] thiển cận của ta cầu xin ân sủng từ [ROOT.Char.GetFaith.HighGodName], tâm trí ta lại bị cuốn theo tiếng áo lễ thiêng liêng của [advanced_culture.GetName], bị chinh phục bởi chân lý trong lời lẽ của họ. Ta khao khát những đại sảnh học thuật của [childhood_location.GetCounty.GetTitle.GetNameNoTier], để lang thang trong các huyền nhiệm được hé lộ nơi đó.\n\n"

  bp2_yearly.6060.same_faith: "Với [advanced_culture.GetCollectiveNounNoTooltip], đức tin tồn tại trong sự tráng lệ, được củng cố bằng học vấn. Nó lan tỏa từ tầng lớp cao nhất đến thấp nhất và, không giống mê tín của chúng ta, nó luôn nhất quán."
  bp2_yearly.6060.different_faith: "Liệu tất cả linh hồn trong một vương quốc — nơi có ít đền thờ và còn ít chữ nghĩa hơn — lại trông cậy vào đôi môi ta để truyền đạt chân lý của [advanced_culture_faith.GetName]?"



#My guardian Kopti ensured I knew that, though we share the same faith, with few temples and fewer lettered folk in our land... wisdom slips, like water, through Karluk fingers.

  bp2_yearly.6060.a: "Ta đã sống chỉ vì điều này. Ta là tín đồ của [advanced_culture_faith.GetAdherentNameNoTooltip]."
  bp2_yearly.6060.a.tt: "Ai khác có thể kết nối hai đức tin? Và còn đức tin nào tốt hơn để mang trật tự tinh thần và sự khai sáng đến cho [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]?"

  bp2_yearly.6060.b: "Đức tin phải được xây dựng, phải được sắp đặt."
  bp2_yearly.6060.b.tt: "Chúng ta sẽ noi theo cách các tôn giáo ngoại bang được tổ chức, cách họ vươn lên trời cao và thấm vào mọi mặt của đời sống."
  bp2_yearly.6060.b.conversion_bonus: "Tốc độ Tiến triển [convert_county|E]: #P +[EmptyScope.ScriptValue('zealous_proselytizer_percentage')|0]%#!"

  bp2_yearly.6060.c: "Tri thức là cội nguồn của mọi sức mạnh."
  bp2_yearly.6060.c.tt: "Và nếu ta là người uyên bác và khôn ngoan nhất, nếu ta hoàn toàn tận hiến, thì vương quốc của ta ắt sẽ phồn thịnh!"
  bp2_yearly.6060.c.nerd: "Giảm tất cả kỹ năng trừ [learning|E] đi #negative_value 2#!"
  bp2_yearly.6060.c.tribal_warning: "@warning_icon! #X Ngài chỉ có thể xây dựng $building_type_generic_university$ khi không còn là [tribal_government|E]#!"
  bp2_yearly.6060.d: "Thế nhưng ta lại cảm thấy... #EMP chính chúng ta#! mới là những kẻ có đức tin chân chính!"
  bp2_yearly.6060.d.tt: "Không có gì phô trương, không có gì rườm rà, trong chân lý của chúng ta. Đây là chính đạo."

  fervor_gain_reformer_converts: "Một nhà cải cách lừng danh đã cải đạo"
  fervor_gain_reformer_champions_faith: "Một vị cai trị đang hồi sinh [faith|E] này"
  fervor_loss_reformer_rejects_faith: "Một nhà vô địch lừng danh khác của [faithpossessive|E] đã lên án nó"

  adapted_rituals_modifier: "Nghi Lễ Ngoại Bang Được Điều Chỉnh"
  adapted_rituals_modifier_desc: "Khi các đền thờ theo phong cách ngoại bang được dựng lên, các nghi thức ngoại bang được du nhập, người ta nói rằng hoặc chẳng có gì là thiêng liêng với người này... hoặc mọi thứ đều là thiêng liêng?"

  court_of_scholars_modifier: "Triều Đình Học Giả"
  court_of_scholars_modifier_desc: "Là người bảo trợ cho cả trí thức lẫn kẻ lập dị, nhân vật này cai trị một dân tộc đang thay đổi nhanh chóng."

  bp2_yearly.6070.t: "Nơi Cả Thế Gian Dõi Nhìn"
  bp2_yearly.6070.desc: "\"Ta đã phục vụ [advanced_court_owner.GetTitledFirstName] từ lâu, người vĩ đại nhất trong số [advanced_culture.GetName] còn sống,\" [foreign_official.GetName] tự xưng, một viên chức所谓 của [advanced_court_owner.GetPrimaryTitle.GetNameNoTier].\n\n\"Thi ca của quyền lực [advanced_court_owner.GetHerHis], thời trang làm mê hoặc thế giới, những vũ khúc cung đình, phù hiệu, và mọi thứ khác — ngài muốn dự phần vào nền văn hóa tối thượng sao, [ROOT.Char.GetTitleAsNameNoTooltip]? Ta có thể giúp. Ta biết nơi những của cải #EMP độc nhất#! được cất giấu.\"\n\nTham vọng cải cách của ta thu hút những sinh vật vô đạo đức này — những kẻ cũng đầy tham vọng: chúng nhìn sự quan tâm của ta với thay đổi... bằng thứ cơ hội chủ nghĩa đầy cào cấu."

  bp2_yearly.6070.a: "Ta muốn học cách [advanced_court_owner.GetTitleAsNameNoTooltip] cai trị."
  bp2_yearly.6070.a.tt: "Ta không quan tâm đến vẻ hào nhoáng, mà là phương thức của văn minh."
  bp2_yearly.6070.b: "Hãy mang đến lễ nghi văn minh, y phục lộng lẫy."
  bp2_yearly.6070.b.tt: "Vì những bộ trang phục [advanced_culture.GetNameNoTooltip] tinh xảo nhất — với cái giá cao nhất! Bất kể nguồn gốc của chúng..."
  bp2_yearly.6070.artifact_warning: "@warning_icon! #X [advanced_court_owner.GetTitledFirstName] có thể sẽ đòi lại chúng#!"
  bp2_yearly.6070.change_clothes: "Một số thần dân của Ngài sẽ ăn mặc như [advanced_culture.GetCollectiveNoun] chừng nào Ngài còn cai trị"
  bp2_yearly.6070.change_clothes_heir: "Một số thần dân của Ngài sẽ ăn mặc như [advanced_culture.GetCollectiveNoun], chừng nào Ngài hoặc [primary_heir|E] hiện tại còn cai trị"
  bp2_yearly.6070.c: "Ngôn ngữ của quyền lực là thứ quan trọng nhất trong mọi hào nhoáng."
  bp2_yearly.6070.c.tt: "Nếu ta thực sự làm chủ được [advanced_culture.GetLanguage.GetNameNoTooltip], ta sẽ là kẻ ngang hàng mà không cần đến phù hoa."
  bp2_yearly.6070.court_language_discount: "Ngài tốn ít hơn rất nhiều [prestige|E] khi thay đổi [court_language|E]"
  bp2_yearly.6070.d: "Ngươi, [advanced_culture.GetNameNoTooltip], chỉ là một con côn trùng ghê tởm!"
  bp2_yearly.6070.d.tt: "Ta #EMP bị#! xem là đồng loại với con sâu này sao? Lấy [foreign_official.GetHerHim] ra làm gương sẽ thay đổi điều đó!"

  artifact_admired_culture_regalia: "Bộ Phù Hiệu Xa Hoa Của [advanced_court_owner.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  artifact_famed_culture_regalia_desc: "Một bộ sưu tập xa xỉ các món trang sức [advanced_culture.GetName] \"nhập khẩu\", đạt tới chất lượng mà chính [advanced_court_owner.GetTitleAsNameNoTooltip] có thể đặt làm từ những nghệ nhân tinh xảo nhất của [advanced_court_owner.GetHerHis]."

  artifact_admired_culture_crown: "Vương Miện Của [root_scope.GetFirstNameNoTooltip]"
  artifact_famed_culture_crown_desc: "Một chiếc vương miện vàng theo phong cách [advanced_culture.GetName] đầy uy nghi, kiểu dáng chưa từng thấy tại vùng đất [root_scope.GetCulture.GetName], đã chu du xa xôi để yên vị trên đầu một [root_scope.GetTitleAsNameNoTooltip] có tầm nhìn."

  artifact_advanced_culture_treatise: "Một Chuyên Luận [advanced_culture.GetLanguage.GetNameNoTooltip] Của [root_scope.GetPrimaryTitle.GetAdjectiveNoTooltip]"

  bp2_yearly.6080.t: "Dòng Máu [ROOT.Char.GetCulture.GetNameNoTooltip]"
  bp2_yearly.6080.desc: "Một đội quân lính đánh thuê người [advanced_culture.GetName], dưới sự chỉ huy của hai vị thủ lĩnh dày dạn kinh nghiệm, đang mong muốn được phục vụ với tư cách là cận vệ hoàng cung và huấn luyện quân đội của ta. Họ đang chờ đợi bên ngoài cổng thành. Bên trong, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_vassal'))] của ta là [angry_vassal.GetTitledFirstName] gầm lên phản đối ta.\n\n\"#EMP Kẻ phản bội, [ROOT.Char.GetTitleAsNameNoTooltip], con chó của tập thể người [advanced_culture.GetCollectiveNounNoTooltip]!#! Ngài muốn trở thành một bạo chúa, khác biệt với bất kỳ [ROOT.Char.GetCulture.GetName] chân chính nào, sử dụng những luật lệ xa lạ và sức mạnh ngoại bang sao? Ngài coi thường phong tục của chúng ta ư?!\"\n\n\"Vậy thì lời thề trung thành của chúng ta cũng phải bị vứt bỏ!\" [angry_vassal.GetSheHe] nói, đứng giữa đội hộ vệ có vũ trang của [angry_vassal.GetHerHis]. \"Chúng ta, những chư hầu, đều đã thống nhất: trừ khi người [advanced_culture.GetCollectiveNounNoTooltip] rời đi, mối ràng buộc giữa chúng ta và ngài chẳng còn ý nghĩa gì nữa!\""

  bp2_yearly.6080.a: "Ta có thể định cư họ như những người nhập cư ôn hòa chăng?"
  bp2_yearly.6080.a.tt: "Giới quý tộc của ta hẳn có thể bị thuyết phục bỏ qua, miễn là thường dân bị thay thế..."
  bp2_yearly.6080.pop_opinion_modifier: "Mọi [county|E] không thuộc [advanced_culture.GetName] trong cùng [duchy|E] nhận #N [GetModifier('forcible_resettlement_modifier').GetNameWithTooltip]#!"
  bp2_yearly.6080.b: "Một kẻ cầm đầu phản loạn! #EMP Bắt lấy [angry_vassal.GetHerHim]!#!"
  bp2_yearly.6080.b.tt: "Hãy xem những kẻ yêu truyền thống khác xoay xở thế nào khi thiếu hắn!"
  bp2_yearly.6080.b.success: "Kẻ bất đồng bị bắt giữ"
  bp2_yearly.6080.b.failure: "[angry_vassal.GetFirstNameNoTooltip] tìm cách thoát thân bằng vũ lực"
  bp2_yearly.6080.add_both_courtiers: "[foreign_mercenary_1.GetName] và [foreign_mercenary_2.GetName] gia nhập triều đình của Ngài"
  bp2_yearly.6080.c: "Mọi ràng buộc cũ đều vô hiệu: ta sẽ không bị ngăn cản."
  bp2_yearly.6080.c.tt: "Dân tộc chúng ta đang được tái sinh. Nghĩa vụ nguyên thủy, nợ nần cũ kỹ, đều không còn quan trọng. Chỉ việc hoàn tất cải cách của ta là điều đáng kể."
  bp2_yearly.6080.hook_removal_vassals: "[vassals|E] mất toàn bộ [hooks|E] họ có đối với Ngài"
  bp2_yearly.6080.hook_removal: "@warning_icon! #X Ngài mất toàn bộ [hooks|E] Ngài có đối với [vassals|E]#!"
  bp2_yearly.6080.truce_removal: "@warning_icon! #X Mọi [truces|E] giữa Ngài và các [vassals|E] của Ngài đều bị hủy#!"
  bp2_yearly.6080.d: "Máu của dân ta không được đổ."
  bp2_yearly.6080.d.tt: "Dân tộc ta, chính nghĩa chung của ta, phải là động lực và sợi dây gắn kết chúng ta: chúng ta phải thề nguyện với nhau."

  elite_foreign_guard_modifier: "Doanh Trại Cận Vệ Tinh Nhuệ"
  elite_foreign_guard_modifier_desc: "Những chiến binh kỷ luật cao, phần lớn đến từ các vùng đất và dân tộc khác, được đóng quân tại đây. Họ rèn luyện kỹ năng chiến đấu và chờ lệnh lãnh chúa."

  custom.every_non_advanced_culture_vassal: "Mọi [vassal|E] không thuộc [advanced_culture.GetName]"
  custom.every_non_advanced_culture_unhooked_no_truce_vassal: "Mọi [vassal|E] không thuộc [advanced_culture.GetName] mà Ngài không có [truce|E] hay [hook|E]"

  forcible_resettlement_modifier: "Tái Định Cư Cưỡng Bức"
  forcible_resettlement_modifier_desc: "Những người di cư, bị đẩy đi bởi các định cư dân từ nền văn hóa tiên tiến hơn, khơi dậy sự phẫn nộ dữ dội tại đây."

  common_noble_cause_modifier: "Chính Nghĩa Chung Của Giới Quý Tộc"
  common_noble_cause_modifier_desc: "Nhân vật này truyền cảm hứng cho các thành viên cùng văn hóa bằng lời kêu gọi về mục tiêu chung."

  cultural_acceptance_learning_from_culture: "Một [innovation|E] đã được truyền đạt giữa các [cultures|E]"

  bp2_yearly.6090.t: "Quyền Thừa Kế, Được Tái Khẳng Định"
  bp2_yearly.6090.desc: "Ta đã chạy theo sự công nhận của [advanced_culture.GetName], thèm khát những hào nhoáng ngoại bang, và tự biến mình thành kẻ ngốc vì những giấc mơ. Không còn nữa.\n\n"
  bp2_yearly.6090.burn_letters: "Những món quà khác nhau do [advanced_court_owner.GetTitledFirstName] gửi tới bốc cháy, trong khi giới quý tộc [ROOT.Char.GetCulture.GetName] tôn vinh tên tuổi ta.\n\n"
  bp2_yearly.6090.burn_else: "Phần lớn những vật dụng [advanced_culture.GetNameNoTooltip] của ta bốc cháy, trong khi giới quý tộc [ROOT.Char.GetCulture.GetName] tôn vinh tên tuổi ta.\n\n"

  bp2_yearly.6090.reaffirm_social: "Khi những kẻ [advanced_culture.GetCollectiveNounNoTooltip] khát quyền lực lợi dụng lòng tham của ta, các chư hầu đã thúc giục ta thận trọng."
  bp2_yearly.6090.reaffirm_realm: "Trong khi ta xé nát quê hương, họ xây dựng những đại sảnh khang trang và trang bị cho các $knight_culture_player_plural_no_tooltip_lowercase$ thiện chiến."
  bp2_yearly.6090.reaffirm_ritual: "Dẫu ta xúc phạm những tín ngưỡng cổ xưa của họ, ta vẫn hiện diện trong lời cầu nguyện của họ."
  bp2_yearly.6090.reaffirm_maa: "Họ đặt cược danh dự và sinh mạng để ngăn ta trao [ROOT.Char.GetPrimaryTitle.GetNameNoTier] cho người ngoài."
  bp2_yearly.6090.outro: "\n\nTuổi trẻ của ta tại [childhood_location.GetCounty.GetTitle.GetNameNoTier] đã dẫn ta lạc lối. [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] là dân tộc của ta. Và họ chẳng cần ai đến để \"khai hóa\"."

  bp2_yearly.6090.a.bow: "Cả thế gian phải cúi đầu trước chúng ta."
  bp2_yearly.6090.a.strength: "Cả thế gian phải cảm nhận sức mạnh của chúng ta."
  bp2_yearly.6090.a.governed: "Cả thế gian phải lắng nghe trí tuệ của chúng ta."
  bp2_yearly.6090.a.zeal: "Cả thế gian phải biết đến nhiệt huyết của chúng ta."
  bp2_yearly.6090.a.kin: "Cả thế gian phải đáp lời huyết thống của chúng ta."
  bp2_yearly.6090.a.virtue: "Cả thế gian phải ngưỡng mộ đức hạnh của chúng ta."
  bp2_yearly.6090.a.tt: "Hãy thắp lại những mối ràng buộc cổ xưa — trong ngọn lửa thiêu rụi mọi kẻ dám nghi ngờ [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
  bp2_yearly.6090.tribal_invasion: "Ngài có thể sử dụng [casus_belli|E] Xâm Lược thêm một lần"
  bp2_yearly.6090.non_tribal_invasion: "Ngài có thể sử dụng [casus_belli|E] Xâm Lược một lần"
  bp2_yearly.6090.no_invasion_req: "Xâm Lược [casus_belli|E] của Ngài không yêu cầu [prestige_level|E]"
  bp2_yearly.6090.b: "Chúng ta phải bảo vệ quê hương, gia đình mình, mãi mãi."
  bp2_yearly.6090.b.tt: "Tim ta tan nát khi nghĩ đến việc mất đi tất cả. Hãy đứng vững, hãy tận hiến: điều đó không bao giờ được phép xảy ra."
  bp2_yearly.6090.traditionalist_traditions: "Ngài sẽ nhận được giảm giá cho các [traditions|E] liên quan"

  a_cultures_great_defender_modifier: "Người Bảo Vệ Vĩ Đại Nhất Của Dân Tộc"
  a_cultures_great_defender_modifier_desc: "Vượt qua cơn dịch nghi ngờ, nhân vật này trở thành anh hùng lừng danh của dân tộc mình và là người tận hiến cho quê hương."

  inspired_defenders_modifier: "Truyền Cảm Hứng Trong Ách Thống Trị, Truyền Cảm Hứng Trong Kháng Cự"
  inspired_defenders_modifier_desc: "Cư dân của vùng đất này bảo vệ dữ dội những gì thuộc về họ và hăng hái đứng lên vì lãnh chúa của mình."

  uniter_and_conqueror_modifier: "Người Hợp Nhất Và Chinh Phục"
  uniter_and_conqueror_modifier_desc: "Nhà lãnh đạo có tầm nhìn này đã thử thách bản lĩnh dân tộc mình, cho đến khi sự vĩ đại của định mệnh chung trở nên rõ ràng với tất cả."

  cultural_acceptance_loss_rejected_influence: "Một nhà cải cách đã từ chối nền văn hóa kia và chọn con đường cô lập"

  bp2_yearly.6091.t: "Một Dân Tộc Bất Biến"
  bp2_yearly.6091: "Giữa các cận thần trong đại sảnh lộng lẫy của ta và cả đám dân quê thấp hèn, những cải cách dang dở của ta đã để lại một cái giá rõ rệt.\n\nBiến động đã làm trái tim của mọi người [ROOT.Char.GetCulture.GetName] trở nên cứng rắn trước người ngoài. Sự nghi kỵ và thù địch ngự trị, nhưng đồng thời cũng là sự gìn giữ đầy yêu thương các truyền thống xưa, những lễ hội rộn ràng, và tinh thần thượng võ đầy kiêu hãnh.\n\nCác cố vấn nói với ta về nguyện vọng của dân chúng: rằng những người lãnh đạo như ta sẽ hướng về truyền thống, đức tin,"
  bp2_yearly.6091.dominance: "và vận mệnh của họ trong những năm tới."
  bp2_yearly.6091.defense: "và sự phòng vệ của họ trong những năm tới."
  bp2_yearly.6091.a: "Hãy cùng tôn vinh tất cả những gì chúng ta là."
  bp2_yearly.6091.a.tt: "...và không gì khác."

  bp2_yearly.6091.aggressive: "Văn hóa của Ngài giờ tiêu tốn ít [prestige|E] hơn khi nhận các truyền thống [GetCultureTradition('tradition_ruling_caste').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_zealous_people').GetName], [GetCultureTradition('tradition_faith_bound').GetName], và [GetCultureTradition('tradition_warrior_culture').GetName]"
  bp2_yearly.6091.defensive: "Văn hóa của Ngài giờ tiêu tốn ít [prestige|E] hơn khi nhận các truyền thống [GetCultureTradition('tradition_isolationist').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_tribe_unity').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_stalwart_defenders').GetName], [GetCultureTradition('tradition_zealous_people').GetName], và [GetCultureTradition('tradition_faith_bound').GetName]"

  bp2_yearly.6100.t: "Dân Tộc [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] Tái Sinh!"
  bp2_yearly.6100.desc: "Những năm tháng bị khinh miệt và nghi kỵ, hy sinh và biến động... tất cả là vì khoảnh khắc này.\n\nKhi [ROOT.Char.GetCulture.GetCollectiveNoun] quỳ gối trước ta, những lời cuối cùng của sắc lệnh cải cách vĩ đại nhất vang lên như sấm dậy. Chúng ta sẽ cai trị theo một cách thức mới, lấy cảm hứng từ [advanced_culture.GetName]. Chúng ta sẽ xây dựng cho đến khi sánh ngang với vinh quang của [childhood_location.GetCounty.GetTitle.GetNameNoTier]. Và mọi đứa trẻ [ROOT.Char.GetCulture.GetNameNoTooltip] sẽ học những kỹ năng — thấu hiểu những điều kỳ diệu — như ta từng biết thuở ấu thơ.\n\nRất nhiều thứ đã đổi thay!"
  bp2_yearly.6100.reform_court: "Một sự tao nhã mới thổi luồng sinh khí vào triều đình của ta."
  bp2_yearly.6100.reform_maa: "Vũ khí bằng sắt và luật lệ vững vàng bảo vệ quyền lực của ta."
  bp2_yearly.6100.reform_faith: "Đức tin của ta trở nên tập trung, tinh luyện, và siêu việt."
  bp2_yearly.6100.reform_realm: "Thương mại hưng thịnh, khu dân cư mở rộng, và ngày càng nhiều người di cư đến [ROOT.Char.GetPrimaryTitle.GetNameNoTier] tái sinh của ta mỗi ngày."
  bp2_yearly.6100.outro: "\n\nTa vẫn là [ROOT.Char.GetCulture.GetNameNoTooltip]. Nhưng ta là một [ROOT.Char.GetCulture.GetNameNoTooltip] mới."

  bp2_yearly.6100.a: "Đây là di sản của ta - nó phải là tuyệt đối!"
  bp2_yearly.6100.a.tt: "Những thay đổi lớn hơn sẽ rất tốn kém, các lãnh chúa nhỏ không dễ bị thuyết phục... nhưng chúng ta có thể tiếp thu thêm nữa từ [advanced_culture.GetCollectiveNounNoTooltip]!"
  bp2_yearly.6100.b: "Ta đã làm được!"
  bp2_yearly.6100.b.tt: "Dân chúng không cần bị thúc ép thêm nữa. Ta đã dẫn dắt họ bước vào khởi đầu của một kỷ nguyên mới."

  cultural_acceptance_gain_completed_reform: "Một người cai trị đã hoàn toàn biến đổi lãnh địa của mình theo mô hình của một nền văn hóa khác"

  bp2_yearly.6100.2_more_innovations: "Văn hóa [root_scope.GetCulture.GetName] nhận thêm #high 2#! [innovations|E] từ văn hóa [advanced_culture.GetName]"
  bp2_yearly.6100.1_more_innovation: "Văn hóa [root_scope.GetCulture.GetName] nhận thêm #high 1#! [innovation|E] từ văn hóa [advanced_culture.GetName]"
  bp2_yearly.6100.gained_2_innovations: "Văn hóa [root_scope.GetCulture.GetName] đã nhận #high 2#! [innovations|E] ngẫu nhiên từ văn hóa [advanced_culture.GetName]"
  bp2_yearly.6100.gained_1_innovation: "Văn hóa [root_scope.GetCulture.GetName] đã nhận #high 1#! [innovation|E] ngẫu nhiên từ văn hóa [advanced_culture.GetName]"

  flourishing_settlements_modifier: "Khu Dân Cư Hưng Thịnh"
  flourishing_settlements_modifier_desc: "Nhờ việc áp dụng các tập tục và công nghệ mới, người dân địa phương biết ơn và ngày càng phồn thịnh."

  bp2_yearly.6110.t: "Cải Cách Ngoại Lai"
  bp2_yearly.6110.realm: "Ta nhìn một cậu hầu nhóm lửa. Ánh sáng ấy chỉ le lói trong chốc lát, thật thảm hại trước màn đêm của đêm nay.\n\nCó lẽ chính cách chúng ta sinh sống, với tư cách là [ROOT.Char.GetCulture.GetCollectiveNoun], đã có vấn đề. Một kẻ thù hùng mạnh đến vậy — liệu trong ta còn đủ quyết tâm để sánh với toàn bộ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]?\n\nTa nghĩ về lối sống của [advanced_culture.GetName], cách họ sinh hoạt và cai trị. Có lẽ một phần nào đó xứng đáng được áp đặt lên dân ta?"
  bp2_yearly.6110.combat: "Ta nhìn các $knight_culture_player_plural_no_tooltip_lowercase$ trong gia đình mình nhàn rỗi dưới nắng chiều, kể cho nhau nghe những chiến công đã qua.\n\nHọ đã có những chiến thắng, và chiến đấu giỏi theo phong cách truyền thống của [ROOT.Char.GetCulture.GetName]. Thế nhưng... ta nghĩ đến kỹ năng và chiến thuật của những chiến binh [advanced_culture.GetName] được vũ trang. Liệu các chiến sĩ của ta có nên thích nghi với cách tiến hành chiến tranh của họ?\n\nHay có lẽ chúng ta nên tiếp nhận một hình thức ảnh hưởng [advanced_culture.GetNameNoTooltip] khác?"
  bp2_yearly.6110.social: "Khu chợ. Cách nói chuyện đặc trưng của [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] bằng ngôn ngữ [ROOT.Char.GetCulture.GetLanguage.GetName] vang bên tai ta. [ROOT.Char.GetCulture.GetCollectiveNoun], dù kính sợ ta, vẫn tiếp tục công việc lao động thường nhật.\n\nTa biết ta giống họ, nhưng #EMP không hoàn toàn#!. Chính họ và [advanced_culture.GetCollectiveNoun] mới thật sự khác biệt.\n\nLiệu đây có phải điều nên thay đổi, và thay đổi vội vàng? Bởi dù ta không lớn lên giữa họ, ý muốn của ta lại định hình tương lai của mọi người [ROOT.Char.GetCulture.GetNameNoTooltip]. Những khía cạnh của văn hóa [advanced_culture.GetNameNoTooltip] là thứ ta có thể đưa vào."
  bp2_yearly.6110.ritual: "Luật lệ của các vị thần ngoại bang, theo lời kể, khác biệt chẳng kém gì luật lệ của con người. Và ở những nơi khác nhau, con người hưởng thụ những điều khác nhau — trong khi các vị thần của họ khuyến khích điều họ cho là đúng hay sai.\n\n[ROOT.Char.GetFaith.HouseOfWorship] yên tĩnh, trầm mặc.\n\nLiệu các tổ tiên [ROOT.Char.GetCulture.GetHeritage.GetName] thuở xưa, hay [ROOT.Char.GetFaith.HighGodName], có thật sự phẫn nộ... nếu tập tục của dân ta đổi thay? Nhưng trong các truyền thống của [advanced_culture.GetName], đâu là thứ từng phục vụ tốt nhất cho những người đã nuôi dạy ta?"
  bp2_yearly.6110.regional: "Bước đi trong đại điện gần như trống rỗng, ta giằng xé giữa ký ức và mộng tưởng.\n\nTa chồng lên những con phố của [childhood_location.GetCounty.GetTitle.GetNameNoTier] trong quá khứ một [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] của tương lai, thấy một bữa tiệc [advanced_culture.GetName] trên bàn tiệc [ROOT.Char.GetCulture.GetName], dẫn dắt những đội quân tái tổ chức đến chiến thắng đầu tiên.\n\nĐiều gì khiến [advanced_culture.GetCollectiveNounNoTooltip] trở nên nổi bật giữa các dân tộc? Một phong tục như vậy có thể được tiếp thu, nhưng nó bắt đầu từ triều đình của ta, từ chính ta."


  bp2_yearly.6110.a: "[considered_tradition_1.GetNameNoTooltip]"
  bp2_yearly.6110.b: "[considered_tradition_2.GetNameNoTooltip]"
  bp2_yearly.6110.c: "[considered_tradition_3.GetNameNoTooltip]"
  bp2_yearly.6110.d: "[considered_tradition_4.GetNameNoTooltip]"
  bp2_yearly.6110.e: "Ta thà cân nhắc những thay đổi khác..."
  bp2_yearly.6110.e.tt: "Ta thật sự không thể hình dung được việc người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] sẽ chấp nhận những tập tục này."

  cultural_acceptance_gain_adapted_tradition: "Một [tradition|E] đã được điều chỉnh"

  introduced_foreign_custom_modifier: "Du nhập tập tục ngoại lai"
  introduced_foreign_custom_modifier_desc: "Không cho dân chúng đủ thời gian thích nghi, nhân vật này đã áp đặt một tập tục xa lạ lên tất cả mọi người."
  repeated_foreign_reforms_modifier: "Cải cách ngoại lai lặp đi lặp lại"
  repeated_foreign_reforms_modifier_desc: "Các thành viên trong nền văn hóa của nhân vật này đang phẫn nộ trước những cuộc công kích vào lối sống của họ."
  assault_on_tradition_modifier: "Tấn công truyền thống"
  assault_on_tradition_modifier_desc: "Chỉ trong một đời, nhân vật này đã khiến nền văn hóa của mình trở nên hoàn toàn không còn nhận ra được."

  bp2_yearly.6120.t: "Khi Mối Liên Kết Bị Thử Thách"
  bp2_yearly.6120.desc: "Con tin của ta, [hostage.GetName], bồn chồn đầy lo lắng nhưng vẫn tràn đầy hy vọng. [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] của [hostage.GetHerHis|U], [hostage_giver.GetTitledFirstName], đang ở gần đây, ngay tại [ROOT.Char.GetCurrentLocation.GetName], và đã rất lâu rồi kể từ lần cuối chuyện này xảy ra.\n\nĐứa [hostage.Custom('GirlBoy')] giờ đang sống cùng ta. [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] của [hostage.GetHerHis|U] và ta có một hiệp ước. [hostage.GetFirstNameNoTooltip] nằm dưới quyền thống trị của ta, và [hostage.GetSheHe] nên trung thành với #EMP ta#!. Việc để [hostage.GetHerHim] khơi lại tình cảm với gia đình [hostage.GetHerHis] ẩn chứa rủi ro...\n\n\"Xin Ngài,\" [hostage.GetSheHe] van nài. \"Xin Ngài, thưa [ROOT.Char.GetTitleAsNameNoTooltip], ta nhớ [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] của mình bằng cả trái tim!\""


  bp2_yearly.6120.a: "Hãy tận hưởng cuộc đoàn tụ này. Nó thật quý giá."
  bp2_yearly.6120.a.tt: "[hostage.Custom('GirlBoy')] dù sao vẫn là người của Nhà [hostage.GetDynastyHouseNameNoTooltip], và nên được ở trong ân sủng của gia đình [hostage.GetHerHis]."
  bp2_yearly.6120.b: "Ta mong đợi một sự đền đáp xứng đáng cho ân huệ hào phóng này!"
  bp2_yearly.6120.b.tt: "Giữ con tin để làm gì, nếu không phải để moi ra những thứ như thế này?"
  bp2_yearly.6120.hook: "Nếu [hostage_giver.GetShortUIName] chấp nhận, Ngài nhận được một [weak_hook|E] với [hostage_giver.GetHerHim]"
  bp2_yearly.6120.hook_acceptance: "[personality|E] của [hostage_giver.GetShortUINamePossessive] quyết định liệu [hostage_giver.GetSheHe] có chấp nhận hay không"
  bp2_yearly.6120.c: "Nào, hãy cùng ta nói chuyện với [hostage_giver.GetHerHim] #EMP cùng nhau#!."
  bp2_yearly.61020.c.tt: "Ta có thể quyến rũ tên nhàm chán đó, khiến chính người thân của [hostage_giver.GetHerHis] thích ở cạnh ta hơn là ở cạnh [hostage_giver.GetHerHis]!"
  bp2_yearly.6120.c.success: "Ngài hoàn toàn áp đảo trong cuộc tương tác với [hostage_giver.GetFirstNameNoTooltip]"
  bp2_yearly.6120.c.failure: "Ngài tỏ ra là một kẻ phiền phức, áp đặt"
  bp2_yearly.6120.d: "#EMP Im lặng!#! Ngươi đã đáng bị một cái tát, [hostage.Custom('GirlBoy')]!"
  bp2_yearly.6120.d.tt: "[hostage.GetFirstNameNoTooltip] thuộc về ta, không phải để ở bên gia đình của [hostage.GetHerHis]. Một trận đòn sẽ giúp [hostage.GetHerHim] nhớ rõ điều đó."

  bp2_yearly.6121.t: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U] Bị Bỏ Lại"
  bp2_yearly.6121.reunion: "Ta đã chờ đợi khoảnh khắc này. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], con tin bảo đảm cho hòa bình của ta, đang đứng trước mặt ta tại [ROOT.Char.GetCurrentLocation.GetName].\n\n\"[hostage.Custom2('RelationToMeShort', ROOT.Char)|U]!\"\n\nKhi [hostage.GetSheHe] chạy vào vòng tay ta, cảm giác như thể [hostage.GetSheHe] chưa từng rời xa. Thế nhưng, cái siết chặt nơi vòng tay của [hostage.GetHerHis] đã bộc lộ nỗi khao khát trở về nhà của [hostage.Custom('GirlBoy')].\n\n[warden.GetTitledFirstName] đã rộng lượng cho phép chúng ta được ở bên nhau, nhưng như vậy vẫn là quá ít."

  bp2_yearly.6121.intrusion: "Với [warden.GetTitledFirstName] ở bên cạnh, [hostage.GetFirstName] đứng trước mặt ta. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta đã thay đổi rất nhiều kể từ khi ta gửi [hostage.GetHerHim] đi làm con tin, nhưng ta có thể nhận ra một người Nhà [ROOT.Char.GetDynastyHouseName] ở bất cứ đâu!\n\nTa ôm lấy đứa [hostage.Custom('GirlBoy')]. [hostage.GetSheHe|U] cố gắng giữ bình tĩnh, nhưng cái siết chặt trong vòng tay [hostage.GetHerHis] đã phản bội nỗi khao khát quê nhà của [hostage.GetHerHis].\n\nSau đó [warden.GetTitledFirstNameNoTooltip] xen vào, kéo sự chú ý của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta sang nơi khác, huyên thuyên về cuộc đoàn tụ này... và cả những vụ mùa địa phương ở [ROOT.Char.GetCurrentLocation.GetName]?\n\nDù thế nào đi nữa, ta vẫn thay mặt gia đình mình cảm tạ [ROOT.Char.GetFaith.HouseholdGodName]."
  bp2_yearly.6121.hook: "\"Ngài đang tự hỏi liệu mình có được đoàn tụ với [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của mình không, phải chăng?\" [warden.GetTitledFirstName] thì thầm. \"Đứa [hostage.Custom('GirlBoy')] [hostage.GetFirstName], người mà ngài đã hào phóng trao đi vì hòa bình.\"\n\n[warden.GetFirstNameNoTooltip] tỏ ra vô cùng đắc ý.\n\n\"Miễn là chúng ta còn ở cùng nhau tại [ROOT.Char.GetCurrentLocation.GetName], ngài có thể ở bên con tin, dù điều đó làm lung lay thỏa thuận của chúng ta...\"\n\n\"...nếu ngài thề rằng sự hào phóng này của ta sẽ không bị lãng quên.\""
  bp2_yearly.6121.forbidden: "\"Ngài nghĩ rằng chỉ vì ngài và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ngài là [hostage.GetFirstName] đều đang ở [ROOT.Char.GetCurrentLocation.GetName], thì hai người sẽ được ở bên nhau sao?\"\n\n[warden.GetTitledFirstName] lắc đầu.\n\n\"Con tin của ta rất bận rộn. Dù thế nào đi nữa, trong thời hạn của thỏa thuận này, [hostage.GetSheHe] chỉ thuộc về ta.\"\n\nQuả thật, ta hầu như không còn nhìn thấy chút dấu vết nào của đứa [hostage.Custom('GirlBoy')] đã được gửi đi..."

  bp2_yearly.6121.a: "\"[hostage.GetFirstNameNoTooltip]! Ta sẽ đưa con về nhà.\""
  bp2_yearly.6121.a.tt: "Bất chấp danh dự: [hostage.GetFirstNameNoTooltip] phải ở bên ta! Cứ để [warden.GetTitledFirstNameNoTooltip] làm điều [warden.GetSheHe] muốn."
  bp2_yearly.6121.b: "\"Một món quà hậu hĩnh, để ngươi không phải chết đói!\""
  bp2_yearly.6121.b.tt: "\"Ăn đi! Ăn đi! Và hãy phô trương thân phận người của Nhà [ROOT.Char.GetDynastyHouseNameNoTooltip].\""
  bp2_yearly.6121.c: "\"Thật tốt khi được gặp con, [hostage.Custom('GetLassLad')].\""
  bp2_yearly.6121.d: "Mọi thứ vì tình yêu dành cho Nhà [ROOT.Char.GetDynastyHouseNameNoTooltip]."
  bp2_yearly.6121.d.tt: "Không người thân nào của ta sẽ bị chính người thân của [hostage.GetHerHis] bỏ rơi."
  bp2_yearly.6121.e: "Chỉ một cái ôm vụng trộm thôi, ta không cần xin phép..."
  bp2_yearly.6121.e.tt: "[warden.GetTitledFirstNameNoTooltip] không thể nào ngăn cản ta tìm [hostage.GetFirstNameNoTooltip] và nói chuyện với [hostage.GetHerHim], dù chỉ trong chốc lát."
  bp2_yearly.6121.e.success: "Ngài lén lút trao một cái ôm"
  bp2_yearly.6121.e.failure: "Ngài bị phát hiện"
  bp2_yearly.6121.f: "Hừm. Ta chẳng nhớ [hostage.GetHerHim]."
  bp2_yearly.6121.f.tt: "Rồi ta sẽ lại gặp [hostage.GetHerHim] thôi... và thế là đủ."

  bp2_yearly.6122.t: "Chưa Bị Lãng Quên"
  bp2_yearly.6122.sneaking: "Khi các mật thám của ta vội vàng đưa [hostage.GetFirstName] rời khỏi đám lính canh của [warden.GetTitledFirstNamePossessive], lợi dụng buổi tiệc tối long trọng, ta cũng lẻn đến cuộc đoàn tụ gia đình này.\n\nNhững hoàn cảnh không mấy danh dự ấy hầu như không còn nằm trong tâm trí ta khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta ôm lấy ta, cười vì những nếp nhăn trên khuôn mặt ta, tràn đầy phấn khích.\n\n[hostage.GetSheHe|U] đã rời xa ta quá lâu, và chẳng bao lâu nữa sẽ phải trở về với người giám hộ của mình. Đây là lẽ thường tình, nhưng ta không hề ghen tị với người chủ nhân khắt khe của [hostage.GetHerHim]."
  bp2_yearly.6122.rescue: "[warden.GetTitledFirstName] đã giận dữ ra sao khi ta xua đuổi [warden.GetHerHim] khỏi sự hiện diện của mình, với [hostage.GetFirstName], con tin một thời của [warden.GetHerHis], đứng bên cạnh.\n\n\"[warden.GetSheHe] có quay lại không, [hostage.Custom2('RelationToMeShort', ROOT.Char)]?\" [hostage.Custom('GirlBoy')] hỏi. \"Con muốn về nhà, nhưng... con không muốn khiến người phải đối đầu với [warden.GetPrimaryTitle.GetNameNoTier].\"\n\nTa trấn an [hostage.GetFirstNameNoTooltip], nhưng sự thật vẫn rất rõ ràng.\n\nTa đã phá vỡ một hiệp ước. Dù tốt hay xấu, có lẽ ta đã đánh đổi hòa bình."

  bp2_yearly.6122.c: "\"Cùng nhau, chúng ta sẽ chờ xem điều gì xảy đến.\""
  bp2_yearly.6122.c.tt: "Nếu đó là chiến tranh, thì ít nhất [hostage.GetFirstNameNoTooltip] cũng sẽ không phải là người đầu tiên ngã xuống..."

  bp2_yearly.6123.t: "Hậu Duệ Của Hòa Bình"
  bp2_yearly.6123.desc: "Cuộc đoàn tụ của những người thân là một cảnh tượng đầy xúc động, và ta vui lòng đứng ra chủ trì.\n\n[hostage_giver.GetTitledFirstName] truyền dạy cho [hostage.GetFirstName] vài lời ngụ ngôn khôn ngoan khi ngày dần trôi, còn ta thì chờ đợi con tin của mình trở lại trong tinh thần tốt đẹp.\n\n\"Hãy chăm sóc [hostage.GetHerHim] cẩn thận,\" [hostage_giver.GetTitleAsNameNoTooltip] căn dặn, khi ta đưa [hostage_giver.GetHerHis] [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] đi. \"Hãy giữ [hostage.GetHerHim] tránh xa những kẻ xa lạ như ta.\""
  bp2_yearly.6123.stolen_hostage: "[hostage_giver.GetTitledFirstName] đã làm điều không tưởng! Chính nghĩa mà [hostage_giver.GetSheHe] rao giảng lại gặp phải phản bội.\n\nTên khốn xua ta đi, trong khi [hostage.Custom('GirlBoy')] [hostage.GetFirstName], biểu tượng cho hòa bình của chúng ta, lại đứng sai chỗ bên cạnh [hostage_giver.GetHerHis]... và ta buộc phải rời đi. Ta mang theo quá ít lực lượng. Thật là sỉ nhục! Thật hèn hạ!\n\nGiờ đây ta lên đường về nhà, bị coi thường và khinh rẻ, không hề có bảo đảm rằng những điều tồi tệ hơn sẽ không xảy đến.\n\n[hostage_giver.GetFirstNameNoTooltip] rồi sẽ phải hối hận vì sự ngu xuẩn này, cũng như ta hối hận vì đã đưa con tin của mình đến gần một con rắn tham lam như vậy..."
  bp2_yearly.6123.favor_accepted: "Ta đã phán đoán đúng... [hostage_giver.GetTitledFirstName] là một [hostage_giver.Custom('WomanManPerson_GenderPreference')] sẵn sàng bị thúc ép.\n\nKhi [hostage_giver.GetSheHe] ôm chặt [hostage.GetFirstName], sự dịu dàng mà [hostage_giver.GetSheHe] dành cho gia đình mình hiện rõ không che giấu.\n\nVới một nghĩa vụ mới để nắm giữ trên tay [hostage_giver.GetHerHim], và một con tin được yêu mến đang ở trong sự chăm sóc của ta, ta không thấy mối đe dọa nào từ [hostage_giver.GetTitleAsNameNoTooltip] trong những ngày sắp tới."
  bp2_yearly.6123.sneaker: "[hostage_giver.GetTitledFirstName], con chuột không danh dự, dường như chẳng tôn trọng quyền lực của ta đối với [hostage_giver.GetHerHis] [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName].\n\n[hostage_giver.GetSheHe|U] phủ nhận việc đã phái những kẻ hầu ranh mãnh đi lôi kéo [hostage.Custom('GirlBoy')] rời khỏi bàn tiệc được canh gác cẩn mật của ta. Nhưng ta biết [hostage_giver.GetSheHe] chỉ chăm chăm phá vỡ những thỏa thuận giữa chúng ta.\n\n\"Dối trá!\" [hostage_giver.GetSheHe] phản đối.\n\nChừng nào [hostage.GetSheHe] còn sống tại triều đình của ta, [hostage.GetFirstNameNoTooltip] #EMP phải#! luôn ở thật xa [hostage_giver.GetTitleAsNameNoTooltip]."
  bp2_yearly.6123.forbidden_desc: "Dù ta nghi ngờ điều này khiến [hostage_giver.GetHerHim] phiền lòng, [hostage_giver.GetTitledFirstName] vẫn tôn trọng quyết định của ta về việc liệu [hostage_giver.GetSheHe] có được gặp [hostage_giver.GetHerHis] [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] hay không.\n\n\"Ta hầu như chẳng nhớ đứa [hostage.Custom('GetLassLad')] đó,\" [hostage_giver.GetSheHe] nói. \"Ta gần như còn thấy vui khi ngươi buộc phải tiếp tục xử lý sự ngu ngốc của [hostage.GetHerHis] thêm một thời gian nữa.\"\n\nDù sao thì đây cũng là cách mọi chuyện phải diễn ra... hơn nữa, thật tốt khi thử thách một [hostage_giver.Custom('WomanManPerson_GenderPreference')] và biết được lập trường của [hostage_giver.GetSheHe]."

  bp2_yearly.6123.a: "Quả là một gia đình đáng nể, [hostage_giver.Custom('WomanManPerson_GenderPreference')], [hostage_giver.GetFirstNameNoTooltip]."

  bp2_yearly.6123.return_hostage: "[hostage.GetShortUIName] không còn là [hostage|E] của Ngài nữa"

  bp2_yearly.6130.t: "Bị Giam Giữ, Bị Cuốn Hút"
  bp2_yearly.6130.desc.different_ages: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta, [kin.GetFirstName], và con tin [hostage.GetName], dù chênh lệch tuổi tác, dường như ngày càng trở nên không thể tách rời.\n\nNgười lớn tuổi hơn kiên định che chở cho người kia, đưa ra những lời khuyên hữu ích về thế sự, còn người trẻ hơn thì luôn mang lại nụ cười.\n\nNhìn hai người Ngài đồng hành khó ngờ này, ta không khỏi xót xa cho cuộc chia ly sắp tới. Một ngày nào đó, thỏa thuận con tin với thân tộc của [hostage.GetFirstNamePossessiveNoTooltip] sẽ kết thúc..."
  bp2_yearly.6130.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta [kin.GetFirstName] và con tin [hostage.GetName] dường như đang trở thành những người bạn đồng hành thân thiết, những người có thể tin tưởng lẫn nhau.\n\n[hostage.GetFirstNameNoTooltip], mỗi khi nhớ nhà, luôn được [kin.GetFirstNameNoTooltip] động viên. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta, người đôi khi phải chịu sức nặng từ địa vị của mình, đã có [hostage.GetFirstNameNoTooltip] cùng chia sẻ những bổn phận của [kin.GetHerHim].\n\nNhìn hai đứa trẻ chia sẻ niềm vui với nhau, ta không khỏi thương cảm cho cuộc chia ly sắp tới. Một ngày nào đó, thỏa thuận con tin với thân tộc của [hostage.GetFirstNamePossessiveNoTooltip] sẽ kết thúc..."
  bp2_yearly.6130.a: "\"Hãy thề sẽ luôn nâng đỡ lẫn nhau.\""
  bp2_yearly.6130.a.tt: "Một mối liên kết giữa hai triều đình của chúng ta... có lẽ đó là điều nên vun đắp?"
  bp2_yearly.6130.b: "\"Tình thân phải được đặt lên trên hết!\""
  bp2_yearly.6130.b.tt: "Hãy đi chơi với người sẽ luôn ở bên con, [kin.Custom('GirlBoy')]."

  bp2_yearly.6130.family_opinion: "[kin.GetShortUIName] nhận được #P 30#! [opinion|E] đối với [close_family|E] của [kin.GetHerHis]"

  bp2_yearly.6130.alliance: "Nếu cả hai đều trở thành [rulers|E], [kin.GetShortUIName] và [hostage.GetShortUIName] có thể đàm phán một [alliance|E]"

  bp2_yearly.6140.t: "Vì Hòa Hiếu, Còn Quá Trẻ"
  bp2_yearly.6140.desc: "Khi các nghi lễ thiêng liêng làm xao nhãng mọi người trông coi, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta, [kin.GetFirstName], và con tin [hostage.GetName] trút bỏ mối thù hằn ngày càng lớn.\n\n\"[kin.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] của ta là [ROOT.Char.GetTitleAsName] hùng mạnh nhất khắp vùng đất!\" [kin.GetFirstNameNoTooltip] rít lên. \"Một ngày nào đó, nhờ người ấy, cái xứ hèn hạ [home_court.GetPrimaryTitle.GetNameNoTier] sẽ chìm trong lửa, và đầu ngươi sẽ treo trên yên ngựa của một $knight_culture_player_no_tooltip_lowercase$!\"\n\n\"Ta ước gì [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] của ta đưa ta về nhà,\" [hostage.GetFirstNameNoTooltip] đáp lại, \"khi đó ngươi sẽ sợ đến chết mà không dám sỉ nhục ta!\"\n\nTừ khi nào [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta lại nói năng như vậy? Lại còn với một vị khách được tôn trọng!"
  bp2_yearly.6140.a: "Cạnh tranh sẽ mài giũa trí tuệ của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta."
  bp2_yearly.6140.a.tt: "Hãy làm nhục [hostage.GetHerHim], [kin.Custom('GirlBoy')]! [hostage.GetFirstNameNoTooltip] là một kẻ thù ngay trong tầm tay con."
  bp2_yearly.6140.b: "Con tin được giữ lại không phải để xung đột, mà vì hòa bình."
  bp2_yearly.6140.b.tt: "Tốt hơn hết hãy cầu nguyện #EMP chống lại#! cảnh chém đầu, các con."

  bp2_yearly.6150.t: "Lời Bảo Đảm Lên Tiếng"
  bp2_yearly.6150.desc: "Theo thông lệ, con tin có mặt, đứng cùng các quan chức và gia quyến, khi những [ROOT.Char.GetTitleAsName] như ta tiếp nhận thỉnh cầu và cử hành nghi lễ.\n\nCon tin của ta, [hostage.GetFirstName], không hề thích điều này.\n\n\"Làm cảnh để người ta dòm ngó, làm chiến lợi phẩm...\" [hostage.GetSheHe] phản đối, khi những người thỉnh cầu cuối cùng rời đi.\n\n\"Con cảm giác như một linh hồn bị kéo khỏi [hostage.GetFaith.NegativeAfterLife]. Ai cũng nhìn chằm chằm vào con... họ biết con không thuộc về nơi này.\""
  bp2_yearly.6150.a: "Con thuộc về gia đình ta. Hãy đứng cùng họ."
  bp2_yearly.6150.a.tt: "Không có gì phải sợ cả! Con gần như là người nhà rồi."
  bp2_yearly.6150.b: "Vậy thì hãy đi học với các [ROOT.Char.GetFaith.PriestNeuterPlural], ta đoán vậy..."
  bp2_yearly.6150.b.tt: "Ta có thể tự mình thể hiện sự huy hoàng: bổn phận đầu tiên của ta với những con tin này là bồi dưỡng họ."
  bp2_yearly.6150.c: "Con là của ta để ta đối xử tùy ý."
  bp2_yearly.6150.c.tt: "Ta không thể để con tin của mình quyết định việc ta làm."

  hostages_accepted_into_family_modifier: "Chấp Nhận Con Tin Vào Gia Đình"
  hostages_accepted_into_family_modifier_desc: "Một chủ nhà hào phóng và trang trọng, cố ý đối xử với con tin như người thân."
  eschews_flaunting_of_hostages_modifier: "Không Phô Trương Con Tin"
  eschews_flaunting_of_hostages_modifier_desc: "Con tin của nhân vật này được chăm sóc và bồi dưỡng, chứ không bị phô bày."

  bp2_yearly.6150.family_opinion_hostage: "[hostage.GetShortUIName] nhận được #P 20#! [opinion|E] đối với [close_family|E] của Ngài"

  bp2_yearly.6160.t: "Tệ Nhất Trong Đám Kỵ Sĩ Của Ta"
  bp2_yearly.6160.desc: "Giữa những tiếng khóc lóc và lời dối trá, ta biết được sự thật của đêm qua.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta, [kin.GetFirstName], và con tin [hostage.GetFirstName] đã lén rời đi trong bóng tối. Hiếu kỳ với thế giới bên ngoài gia thất của ta, chúng lẻn vào một khu dân cư.\n\nNgắm nghía những con ngựa của một gia đình địa phương, chúng sớm bị phát hiện — và bỏ chạy trên những con tuấn mã bị đánh cắp.\n\nLũ trẻ vụng về lao ngựa xuống mương.\n\n\"[hostage.GetFirstNameNoTooltip] xúi con làm đấy!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta bị thương nức nở, giống như dân làng than khóc cho con ngựa nay đã què."
  bp2_yearly.6160.a: "Hãy nếm mùi lao động để trả nợ."
  bp2_yearly.6160.a.tt: "Lũ trẻ muốn trải nghiệm đời thường ư? Vậy thì hãy để chúng làm việc cho chủ ngựa một thời gian."
  bp2_yearly.6160.b: "Ngươi làm hại [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta, con tin?! #EMP Cút đi!#!"
  bp2_yearly.6160.b.tt: "Không một thỏa ước nào đáng giá đến mức đặt gia đình ta vào hiểm nguy bởi sự hiện diện của hạng ô hợp như thế!"
  bp2_yearly.6160.c: "#EMP Thở dài.#! Chắc ta sẽ phải trả cho chuyện này..."
  bp2_yearly.6160.d: "Chữa lành cho con ngựa ư? Quá dễ."
  bp2_yearly.6160.e: "Chúng chỉ là trẻ con thôi! Chuyện này vẫn xảy ra."
  bp2_yearly.6160.e.tt: "Hãy để bọn gây rối này nghỉ ngơi. Không có bê bối gì ở đây."

  labored_with_the_commons_modifier: "Lao Động Cùng Dân Thường"
  labored_with_the_commons_modifier_desc: "Được biết đến vì đã làm việc cùng những người giữ chuồng và nuôi ngựa, để bù đắp cho những bồng bột của tuổi trẻ."

  renowned_knowledge_of_horses_modifier: "Kiến Thức Về Ngựa Nổi Danh"
  renowned_knowledge_of_horses_modifier_desc: "Nhiều người tìm đến trí tuệ của nhân vật này trong việc chữa trị bệnh tật và bồi dưỡng sức mạnh cho ngựa."

 
  bp2_yearly.6200.t: "Nơi [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] Biết Đến Hòa Bình"
  bp2_yearly.6200.desc: "Khi hội đồng của ta đang lên kế hoạch phòng thủ [ROOT.Char.GetPrimaryTitle.GetNameNoTier], con tin của ta là [hostage.GetName] được dẫn vào.\n\n\"Thưa [ROOT.Char.GetTitleAsName] cao quý, ngài đã đối đãi với ta công bằng và tử tế. Khi tai họa đang rình rập, liệu có đúng không khi tại quê hương ta — [home_court.GetPrimaryTitle.GetNameNoTier] — những [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] lại ngồi yên, cờ hiệu cuốn lại?\"\n\n[hostage.GetSheHe|U] quỳ xuống.\n\n\"Xin cho phép ta lên đường — ta sẽ mang lời cầu viện của chúng ta đến [home_court.GetTitledFirstName]! Ta mang dòng máu của [home_court.GetHerHis]. [home_court.GetSheHe|U] sẽ ủng hộ ngài, vì ta!\""
  bp2_yearly.6200.a: "Hãy đi, và trở về cùng sắt thép."
  bp2_yearly.6200.a.tt: "Xin hãy chứng minh lòng trung thành! Xin hãy cứu ta trong giờ phút nguy nan này!"
  bp2_yearly.6200.hostage_travel: "[hostage.GetShortUIName] sẽ lên đường đến [home_court.GetCapitalLocation.GetTitle.GetName]"
  bp2_yearly.6200.hostage_warning: "@alert_icon! #alert_trial [hostage.GetShortUIName] có thể sẽ không còn là [hostage|E] của Ngài#!"
  bp2_yearly.6200.war_positive: "[home_court.GetShortUIName] có thể sẽ hỗ trợ Ngài trong [war|E]"
  bp2_yearly.6200.b: "Hãy mang theo một món quà hậu hĩnh."
  bp2_yearly.6200.b.tt: "Sự hào phóng sẽ khơi dậy khát vọng chiến tranh của [home_court.GetTitleAsNameNoTooltip]."
  bp2_yearly.6200.c: "Mang theo [target_knight.GetFirstNameNoTooltip] trung thành và lên đường ngay!"
  bp2_yearly.6200.war_very_positive: "#P [home_court.GetShortUIName] rất có khả năng sẽ hỗ trợ Ngài trong [war|E]#!"
  bp2_yearly.6200.c.tt: "Một người hộ tống vững vàng… và cũng để bảo đảm [hostage.GetFirstNameNoTooltip] không quên lợi ích của ta."
  bp2_yearly.6200.hostage_positive: "#P [hostage.GetShortUIName] có nhiều khả năng quay trở lại [court|E] của Ngài#!"
  bp2_yearly.6200.hostage_travel_knight: "[hostage.GetShortUIName] và [target_knight.GetShortUIName] sẽ lên đường đến [home_court.GetCapitalLocation.GetTitle.GetName]"
  bp2_yearly.6200.imprison_warning: "@alert_icon! #alert_trial [target_knight.GetShortUIName] có thể bị [home_court.GetShortUIName] giam giữ#!"
  bp2_yearly.6200.d: "Không, ta không thể cho phép một con tin rời đi."
  bp2_yearly.6200.d.tt: "Không có gì đảm bảo ngươi sẽ quay lại! Cũng không có gì đảm bảo [home_court.GetTitledFirstNameNoTooltip] sẽ không chọn đứng về phía kẻ thù của ta."

  bp2_yearly.6202.t: "[hostage.Custom2('AppropriateGreeting', ROOT.Char )]"
  bp2_yearly.6202.opening: "Ta lại một lần nữa có mặt tại [home_court.GetCapitalLocation.GetTitle.GetNameNoTier]."
  bp2_yearly.6202.assembled_nobles: "Những quý tộc danh giá đứng chật triều đình của [home_court.GetTitleAsNamePossessive] khi ta trình bày lời cầu viện của ngài.\n\n"
  bp2_yearly.6202.nostalgia: "Làn gió lướt qua những hàng cây quen thuộc. Ta đã khiến khó khăn của ngài được biết đến nơi này.\n\n"
  bp2_yearly.6202.impatient: "Những quý tộc nhỏ nhen, chỉ biết ta khi còn là một đứa trẻ, ban đầu xuýt xoa rồi dần lặng im.\n\n"

  bp2_yearly.6202.received_empathy: "Những người có mặt đã rơi lệ trước tai ương của [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive]. [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] của ta dường như rất xúc động"
  bp2_yearly.6202.received_debate: "Một cuộc tranh luận nổ ra dữ dội. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] của ta, dù không phải là đồng minh của ngươi, vẫn muốn trở thành người bảo vệ cho gia tộc của [home_court.GetHerHis]."
  bp2_yearly.6202.received_scorn: "\"Dựa vào quyền gì mà [ROOT.Char.GetSheHe] dám cầu xin sự trợ giúp của chúng ta?\" ta bị hỏi, và không có câu trả lời thỏa đáng. [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] của ta tỏ ra bất mãn"
  bp2_yearly.6202.received_apathy: "Có kẻ chẳng mảy may quan tâm, trong khi vài [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] tụ tập để chờ quyết định của [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ta. [home_court.GetSheHe|U] hỏi khi nào ta định rời đi"

  bp2_yearly.6202.fears_returning: "— và [home_court.GetSheHe] lo sợ việc ta quay lại vùng đất đầy biến động của ngài."
  bp2_yearly.6202.awaiting: "— nhưng chúng ta vẫn đang chờ phán quyết của [home_court.GetHerHis]."
  bp2_yearly.6202.want_to_stay: "— nhưng [home_court.GetSheHe] quá khôn ngoan để đưa ra phán quyết vội vàng."
  bp2_yearly.6202.want_to_return: "— nhưng [home_court.GetSheHe] giữ ta lại đây, trong khi chiến tranh vẫn tiếp diễn!"
  bp2_yearly.6202.a: "Ít nhất thì [hostage.GetFirstNameNoTooltip] vẫn còn sống."

  bp2_yearly_6203_army_name: "Đạo quân của [ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetFirstNamePossessiveNoTooltip] xứ [ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetHomeCourt.GetPrimaryTitle.GetAdjectiveNoTooltip]"

  bp2_yearly.6203.t: "[ROOT.Char.GetNameNoTooltip],"
  bp2_yearly.6203.join_war: "[home_court.GetPrimaryTitle.GetNameNoTier] sát cánh cùng ngài! [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] của ta, [home_court.GetTitledFirstName] quả cảm, sẽ dùng binh lực để tôn vinh mối liên kết giữa ngài và [home_court.GetSheHe].\n\nĐừng ai dám đe dọa một đại sảnh che chở cho [hostage.GetDynastyHouseName]!\n\n"
  bp2_yearly.6203.assist: "Thật đau buồn khi [home_court.GetName] không thể đích thân đến viện trợ cho ngài. Tuy nhiên, với lời hứa về chiến tranh và những vinh quang mà nó mang lại, chúng ta đã tập hợp một đội quân gồm những kẻ phiêu bạt nghèo khó và các nhà phiêu lưu [home_court.GetPrimaryTitle.GetAdjectiveNoTooltip]! Mong rằng họ sẽ chiến đấu thật tốt vì [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\n\n"
  bp2_yearly.6203.betray: "Chúng ta không thể làm ngơ trước sự yếu đuối bộc lộ trong lời cầu xin của ngài. [home_court.GetTitledFirstName] sẽ đặt niềm tin vào sức mạnh của kẻ thù ngài. Hãy chuẩn bị cho cuộc viếng thăm của [home_court.GetHerHis].\n\nSau khi [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] của ta cướp phá kinh đô của ngài, có lẽ ta sẽ lại xuất hiện tại triều đình ngài."
  bp2_yearly.6203.decline: "Ta đã làm mọi điều có thể, nhưng [home_court.GetTitledFirstName] không thấy được nhiều giá trị trong những lập luận của ngài. Không có liên minh, toàn bộ [home_court.GetPrimaryTitle.GetNameNoTier] sẽ không hành quân khi [ROOT.Char.GetPrimaryTitle.GetNameNoTier] kêu gọi. [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] của ta cảm ơn ngài vì đã đưa ta đến gặp [home_court.GetHerHim], và gửi lời thăm hỏi.\n\n"
  bp2_yearly.6203.dont_keep_knight: "Vị trí của ta là tại triều đình ngài, vì vậy [target_knight.GetFirstName] và ta sẽ sớm quay lại."
  bp2_yearly.6203.dont_keep: "Vị trí của ta là tại triều đình ngài, ta sẽ sớm quay lại."
  bp2_yearly.6203.keep: "Nhưng ta không còn là con tin của ngài nữa."

  bp2_yearly.6203.a: "Phúc lành cho họ! Mối liên kết của chúng ta vượt xa thân phận con tin."
  bp2_yearly.6203.a.tt: "Và [home_court.GetFirstNameNoTooltip] cầm vũ khí bảo vệ người thân, đáp lại lời cầu cứu của kẻ cần giúp — [home_court.GetSheHe] quả là một bằng hữu đáng có."
  bp2_yearly.6203.b: "#EMP Phản bội!#! Ta sẽ nhuộm đất bằng máu!"
  bp2_yearly.6203.b.tt: "Ta sẽ tiêu diệt mọi kẻ thù, và giành lại mối thù này!"

  bp2_yearly.6203.c.positive: "Ra trận thôi, [hostage.GetFirstNameNoTooltip]! #EMP Ra trận!#!"
  bp2_yearly.6203.c.negative: "Ta thật ngu ngốc khi để [hostage.GetHerHim] rời khỏi tầm mắt..."
  bp2_yearly.6203.c.tt: "Ta bảo hộ ngươi, còn ngươi bảo hộ cả vương quốc!"

  from_victory_vengeance_modifier: "Từ Chiến Thắng, Sinh Ra Báo Thù"
  from_victory_vengeance_modifier_desc: "Nhân vật này thúc đẩy quân đội và kỵ sĩ thực hiện những hành động tàn bạo không khoan nhượng, nung nấu ý chí báo thù cho sự phản bội trong quá khứ."

  bp2_yearly.6204.t: "Lời Cầu Xin Từ Máu Mủ"
  bp2_yearly.6204.desc: "Bám đầy bụi đường và mùi mồ hôi ngựa, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta là [hostage.GetFirstName] bất ngờ quay trở lại!\n\n\"Ta không làm tổn hại đến hiệp ước đình chiến của ngài, [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))],\" [hostage.GetSheHe] thở dốc. \"Chiến tranh không đến đây! Không — chiến tranh khủng khiếp đang ập đến [warden.GetPrimaryTitle.GetNameNoTier] — đến chính đại sảnh nơi ta bị giữ làm con tin!\"\n\n"
  bp2_yearly.6204.desc_gift: "[hostage.GetSheHe|U] trao cả một bức thư lẫn một túi vàng từ [warden.GetTitledFirstName]."
  bp2_yearly.6204.desc_chaperone: "[hostage.GetHerHis|U] người hộ tống cảnh giác là [target_knight.GetName] trao một bức thư từ [warden.GetTitledFirstName]."
  bp2_yearly.6204.desc_outro: "\n\n\"Ngài không có nghĩa vụ phải trợ giúp,\" [hostage.GetFirstNameNoTooltip] nói, \"nhưng người giám hộ của ta đã đối đãi rất tốt với ta! [warden.GetSheHe|U] không đáng bị hủy diệt bởi [attacker.GetName]!\""
  bp2_yearly.6204.desc_none: "[hostage.GetSheHe|U] trao một bức thư từ [warden.GetTitledFirstName]."
  bp2_yearly.6204.a: "Mang [ROOT.Char.Custom('signature_weapon')] của ta tới! #EMP Dòng tộc [ROOT.Char.GetDynastyHouseNameNoTooltip] sẽ chiến đấu!#!"
  bp2_yearly.6204.a.tt: "Đừng ai dám đe dọa một đại sảnh che chở cho người thân của ta!"
  bp2_yearly.6204.b: "Ta sẽ giúp chi trả và vũ trang cho một lực lượng."
  bp2_yearly.6204.b.tt: "Tập hợp những thanh niên cầm vũ khí và các kẻ phiêu bạt nghèo khó để gửi đi cùng [hostage.GetFirstNameNoTooltip]! Họ có thể chiến đấu mà không cần sự can dự chính thức của ta."
  bp2_yearly.6204.c: "Việc phòng thủ [warden.GetPrimaryTitle.GetNameNoTierNoTooltip] không phải nghĩa vụ của ta."
  bp2_yearly.6204.c.tt: "Chúng ta chỉ có một hiệp ước đình chiến. Chúng ta không phải đồng minh!"
 
  bp2_yearly.6205.t: "Đến Những Vùng Đất Loạn Lạc"
  bp2_yearly.6205.desc: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], trèo lên lưng chiến mã của [hostage.GetHerHis], im lặng đến rợn người. Phía trước là vùng [warden.GetCapitalLocation.Custom('TerrainTypeProvince')] của [warden.GetCapitalLocation.GetTitle.GetNameNoTier] — nơi những [attacker.Custom('KnightCulturePluralNoTooltip')|l] [attacker.GetPrimaryTitle.GetAdjective] đáng sợ có thể đang chờ đợi.\n\n"
  bp2_yearly.6205.desc_gift: "Kho bạc của ta căng đầy quà tặng từ [warden.GetTitledFirstNamePossessive], nhưng người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta gần như đơn độc cưỡi ngựa tiến vào chiến tranh.\n\n"
  bp2_yearly.6205.desc_chaperone: "[target_knight.GetFirstName], [warden.GetTitledFirstNamePossessive] [warden.Custom2('RelationToMeShort', SCOPE.sC('target_knight'))], sẽ là người hộ tống duy nhất của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))] của ta. Nắm chặt dây cương bằng cả trái tim, [target_knight.GetSheHe] thề sẽ hy sinh vì gia tộc ta, nếu ngày đó thực sự đến.\n\n"
  bp2_yearly.6205.desc_none: "Một vài thanh niên rách rưới đã tụ tập để phục vụ cho mục đích của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))] ta, nhưng toàn bộ quân đội của ta sẽ ở lại đây... trong khi [hostage.GetFirstNameNoTooltip] cưỡi ngựa tiến vào cuộc chiến của [warden.GetTitledFirstNamePossessive].\n\n"
  bp2_yearly.6205.desc_outro: "Thế nhưng — chính [warden.GetFirstNameNoTooltip] đã bày ra cảnh tượng khủng khiếp này trước mắt ta! Một kẻ [warden.GetWomanMan] yếu đuối, [warden.GetSheHe] sai khiến những vị khách được tôn kính như người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta phải cúi rạp mình chỉ vì tiếng lách cách của một thanh kiếm!\n\nVà ta phải tin tưởng #EMP con sâu bọ#! này cùng đồng bọn của [warden.GetHerHis] sẽ bảo vệ huyết mạch của ta sao?"
 
  bp2_yearly.6205.a: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta sẽ ở lại đây."
  bp2_yearly.6205.b: "Ta sẽ khiến [warden.GetFirstNameNoTooltip] phải trả giá cho sự xúc phạm này!"
  bp2_yearly.6205.c: "Ừ thì... chúc may mắn, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]."

  bp2_yearly.6170.t: "Khế Ước Với Kẻ Man Di"
  bp2_yearly.6170.desc: ""Không một ai trong Nhà [ROOT.Char.GetDynastyHouseName] hài lòng với việc ngươi đã làm!" người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] của ta, [kin.GetFirstName], gằn giọng.\n\n"Làm sao ngươi có thể gửi [hostage.GetName], người [kin.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.Custom('ComplimentAdjective')] của ta, đến một đại sảnh hôi hám nơi đám đàn ông man rợ gào lên '[warden.Custom('CulturalCurse')|U]!' mà chẳng bao giờ 'Tán tụng [ROOT.Char.GetFaith.HighGodName]'? Nơi chó phóng uế tự do lên cả đám dã nhân lẫn các lãnh chúa [warden.GetCulture.GetName] địa phương?"\n\nQuả thật, [warden.GetName] chẳng phải là kẻ có văn hóa như [ROOT.Char.GetCulture.GetName], nhưng dẫu vậy vẫn khá đáng giá—\n\n"[hostage.GetFirstNameNoTooltip] đang bị giữ làm con tin trong một túp lều!" [kin.GetFirstNameNoTooltip] hét lên. "#EMP Hãy lo cho nhu cầu của [hostage.GetHerHis]!#! Quyền lợi của một người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] thuộc [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"" 
  bp2_yearly.6170.a: "Đúng vậy, đó là sự xúc phạm đến phẩm giá của [hostage.GetHerHis] — và của cả ta."
  bp2_yearly.6170.a.tt: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta phải được hưởng mọi tiện nghi tinh tế như ở quê nhà!"
  bp2_yearly.6170.b: "Bổn phận với gia tộc ràng buộc tất cả các ngươi."
  bp2_yearly.6170.b.tt: "Sự hy sinh của [hostage.GetFirstNamePossessiveNoTooltip] chỉ nên là một trong rất nhiều hy sinh vì Nhà [ROOT.Char.GetDynastyHouseNameNoTooltip]."
  bp2_yearly.6170.c: "[hostage.GetSheHe|U] sẽ hiểu cách những dân tộc khác sinh sống."
  bp2_yearly.6170.c.tt: "Sống như những kẻ thô mộc sẽ dạy người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta biết chịu thiếu thốn, trở nên cứng cỏi và tháo vát..."

  bp2_yearly.6170.scheme_bonus: "[close_family|E] và [spouses|E] có nhiều khả năng tham gia các [hostile_schemes|E] của Ngài trong #high 10 năm#!"
  bp2_yearly.6170.leave_court_bonus: "[close_family|E] [courtiers|E] ít có khả năng rời triều đình trong #high 10 năm#!"

  lavish_care_modifier: "Chăm Sóc Xa Hoa"
  lavish_care_modifier_desc: "Nhân vật này được nuông chiều bởi hàng chục gia nhân có văn hóa, sống trong sự xa hoa và tiện nghi."

  trained_by_the_uncivilized_modifier: "Được Rèn Luyện Bởi Dân Dã"
  trained_by_the_uncivilized_modifier_desc: "Khi làm con tin, nhân vật này được dạy những lối sống và phương thức mộc mạc của một nền văn hóa \"thấp kém\"."
  cultural_acceptance_hostage_exchange: "Tiếp Xúc Qua Con Tin Danh Giá"

  united_family_modifier: "Gia Tộc Đoàn Kết"
  united_family_modifier_desc: "Nhân vật này yêu cầu thân tộc của mình phải hết sức coi trọng mối ràng buộc với nhau."

  bp2_yearly.6180.notification_high: "Cải Cách: Người Cai Trị [advanced_culture.GetNameNoTooltip] Hài Lòng"
  bp2_yearly.6180_notification_tooltip_high: "[pleased_ruler.GetTitledFirstName] ca ngợi sự quan tâm của Ngài trong việc noi theo [advanced_culture.GetCollectiveNoun] cao quý."

  bp2_yearly.6181.notification_high: "Cải Cách: Lãnh Địa Bị Bỏ Bê Bị Lên Án"
  bp2_yearly.6181_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName] thất vọng vì các cải cách của Ngài không mang lại nhiều cơ hội mới cho thương nhân [advanced_culture.GetName]."

  bp2_yearly.6182.notification_high: "Cải Cách: Lãnh Chúa Ngoại Bang Lên Án Nghi Lễ"
  bp2_yearly.6182_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName] thúc giục Ngài từ bỏ những mê tín của [ROOT.Char.GetCulture.GetName], nếu muốn dẫn dắt dân chúng."

  bp2_yearly.6183.notification_high: "Cải Cách: Quý [disappointed_ruler.GetWomanMan] Than Phiền Sự Thô Tục"
  bp2_yearly.6183_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName] tỏ ra khó chịu trước sự tiếp đón \"man rợ\" của Ngài đối với các cận thần [advanced_culture.GetName] tinh tế."

  bp2_yearly.6184.notification_high: "Cải Cách: Lãnh Chúa Chiến Tranh Thể Hiện Sự Khinh Miệt"
  bp2_yearly.6184_notification_tooltip_high: "[disappointed_ruler.GetTitledFirstName] lên án việc Ngài gạt bỏ giới tinh hoa [advanced_culture.GetName] và khả năng kiểm soát chư hầu yếu kém."

  bp2_yearly.6185.notification_high: "Cải Cách: Lính Đánh Thuê Tấn Công [ROOT.Char.Custom('KnightCultureNoTooltip')]"
  bp2_yearly.6185_notification_tooltip_high: "[beaten_knight.GetTitledFirstName] bị đánh đập và làm nhục nặng nề bởi một băng lính đánh thuê [advanced_culture.GetName] đầy thù hận."

  bp2_yearly.6186.notification_high: "Cải Cách: Tin Đồn Man Rợ"
  bp2_yearly.6186_notification_tooltip_high: "Triều đình của Ngài bị chế giễu là sào huyệt của những phép tắc thô lỗ, một nơi bị các cận thần từ những nền văn hóa tinh tế xa lánh."

  dearth_of_intellectuals_modifier: "Thiếu Hụt Trí Thức"
  dearth_of_intellectuals_modifier_desc: "Những kẻ cuồng tín đã xua đuổi nhiều học giả, giáo sĩ và quan chức ngoại quốc khỏi lãnh thổ của nhân vật này."
  bereft_of_intellectuals_modifier: "Cạn Kiệt Trí Thức"
  bereft_of_intellectuals_modifier_desc: "Những kẻ cuồng tín đã xua đuổi gần như toàn bộ học giả, giáo sĩ và quan chức ngoại quốc khỏi lãnh thổ của nhân vật này."

  bp2_yearly.6187.notification_high: "Cải Cách: Người Ngoại Quốc Tài Giỏi Bỏ Trốn"
  bp2_yearly.6187_notification_tooltip_high: "[zealot_vassal.GetTitledFirstName] dẫn đầu các kẻ cuồng tín khác trong việc xua đuổi học giả, giáo sĩ và quan chức khỏi lãnh thổ"
  bp2_yearly.6187_no_vassal_notification_tooltip_high: "Những kẻ cuồng tín mới bị kích động đang xua đuổi học giả, giáo sĩ và quan chức khỏi lãnh thổ"

  bp2_yearly.6188.notification_high: "Cải Cách: Quý Tộc Địa Phương Thống Trị"
  bp2_yearly.6188_notification_tooltip_high: "Tại [isolating_county.GetName], các quý tộc nhỏ được trao quyền đàn áp đô thị hóa, bóp nghẹt thương mại và tích trữ của cải."

  bp2_yearly.6189.notification_high: "Cải Cách: Xây Dựng Quá Nhanh"
  bp2_yearly.6189_notification_tooltip_high: "Các công trình đồ sộ theo phong cách [advanced_culture.GetName] tại [affected_province.GetName] được quy hoạch sai lầm: binh lính bị trưng dụng phải lao lực để ngăn thảm họa."

  grand_buildings_collapsed_modifier: "Xây Dựng Trục Trặc"
  grand_buildings_collapsed_modifier_desc: "Hạt này phẫn nộ trước sự tàn phá do các dự án xây dựng đầy tham vọng gây ra."
  conscripted_warriors_modifier: "Chiến Binh Bị Trưng Dụng"
  conscripted_warriors_modifier_desc: "Toàn bộ đàn ông khỏe mạnh tại đây đều kiệt quệ vì công việc xây dựng nặng nhọc và gấp gáp."

  bp2_yearly.6190.notification_high: "Cải Cách: [ROOT.Char.GetFaith.HouseOfWorship|U] Bị Cướp Phá"
  bp2_yearly.6190_notification_tooltip_high: "Tại [affected_county.GetName], các [ROOT.Char.GetFaith.AltPriestTermPlural] cuồng tín địa phương đã phá hủy các biểu tượng và vật phẩm thờ cúng quý giá của [advanced_culture.GetName]."

  bp2_yearly.6191.notification_high: "Cải Cách: Xa Rời Họ Hàng"
  bp2_yearly.6191_notification_tooltip_high: "Các nhân vật có thế lực của [annoyed_culture.GetName] cảm thấy bị xa lánh bởi văn hóa triều đình của Ngài, vốn ngày càng khác biệt với họ."

  cultural_acceptance_diverging_court: "[court|E] [cultures|E] phân hóa"

  bp2_yearly.6192.notification_high: "Cải cách: Chư hầu mất niềm tin"
  bp2_yearly.6192_notification_tooltip_high: "[vassal.GetTitledFirstName] cảm thấy lạc lõng trong một lãnh thổ thay đổi quá nhanh và không còn thấy giá trị trong việc giữ lòng trung thành tuyệt đối."

  bp2_yearly.6193.notification_high: "Cải cách: Quyền lực quản trị được củng cố"
  bp2_yearly.6193_notification_tooltip_high: "Các đại địa chủ sẽ không còn được giấu của cải nữa! Hạ tầng theo phong cách [advanced_culture.GetName] đã củng cố quyền uy của Ngài."

  bp2_yearly.6194.notification_high: "Cải cách: Chư hầu biết ơn"
  bp2_yearly.6194_notification_tooltip_high: "[vassal.GetTitledFirstName] ca ngợi danh tiếng của Ngài trước những người đồng cấp, biết ơn vì những món quà Ngài ban tặng và sự củng cố lại mối liên kết giữa hai người."

