l_english: 
  bp2_yearly.4000.t: "Nỗi Sợ Từ Quá Khứ"
  bp2_yearly.4000.desc: "Khi ta ôm đứa con mới chào đời của mình, [first_babby.Custom('GetDaughterSon')] [first_babby.GetName], niềm vui sướng tột cùng xen lẫn với nỗi buồn, cùng một nỗi sợ hãi nhói lên chạy dọc sống lưng ta.\n\nLiệu [ROOT.Char.GetMotherFather] của ta có từng ôm ta như thế này trước khi cả [ROOT.Char.GetSheHe] và mẫu thân qua đời, khi ta vẫn còn nhỏ tuổi, để rồi bỏ lại ta cô độc trên đời?\n\nĐây có phải là một lời nguyền chăng? Liệu [ROOT.Char.GetFaith.FateGodName] sẽ cướp đi cha mẹ của đứa con bé bỏng của ta, giống như [ROOT.Char.GetFaith.FateGodSheHe] đã từng làm với ta sao?"
  bp2_yearly.4000.a: "Ta hứa! Ta sẽ không bao giờ bỏ rơi con!"
  bp2_yearly.4000.a.flavor: "Liệu ta có thể giữ được lời hứa ấy không?"
  bp2_yearly.4000.b: "Thế giới này vốn tàn nhẫn, con của ta."
  bp2_yearly.4000.b.flavor: "Và ai rồi cũng phải bước đi một mình."
  bp2_yearly.4000.c: "Ta đặt niềm hy vọng của mình nơi [ROOT.Char.GetFaith.HighGodNameAlternate]."

  bp2_yearly.4001.t: "Công Lý Đến Muộn"
  bp2_yearly.4001.desc: "Ta chỉ là một đứa trẻ khi mạng sống của [ROOT.Char.Custom2('RelationToMeShort', murdered_relative)] của ta, [murdered_relative.GetName], đột ngột kết thúc theo lệnh của [imprisoned_murderer.GetName]. Khi ấy ta bất lực, không thể ngăn cản việc đó, cũng không thể thực thi công lý.\n\nNgày hôm nay, kẻ bất lực lại chính là [imprisoned_murderer.GetNameNoTooltip], bị trói buộc và phải chịu sự phán quyết của ta. Ta tự hỏi [murdered_relative.GetFirstNameNoTooltip] sẽ mong muốn điều gì? Báo thù, lấy mạng đền mạng, hay là một sự khoan dung?"
  bp2_yearly.4001.a: "[murdered_relative.GetSheHe|U] giờ đã không còn mong cầu điều gì nữa, tất cả là nhờ ngươi, [imprisoned_murderer.Custom2('InsultNoun', ROOT.Char)]!"
  bp2_yearly.4001.b: "Tha thứ cũng là một sức mạnh, là lựa chọn con đường chính nghĩa."

  bp2_yearly.4002.t: "Tiếng Gọi Từ Linh Hồn"
  bp2_yearly.4002.desc:1 "Lại thêm một đêm nữa, lại thêm một vòng rượu. Ta đã uống bao lâu rồi? Vài ngày? Vài tuần? Điều đó còn quan trọng sao? Trong làn bọt xoáy của chiếc vại rượu còn vơi một nửa, ta thấy điều kỳ lạ và quái dị nhất. Gương mặt lo lắng của những người thân đã khuất từ lâu, [first_aa_relative.GetFirstNameNoTooltip] và [second_aa_relative.GetFirstNameNoTooltip], đang nhìn lên ta.\n\nCơn say mờ ảo bị xé toạc bởi ký ức tuổi thơ đã bị lãng quên từ lâu — cảnh ta phát hiện họ chết vì quá chìm đắm trong rượu chè, thân xác phình trương, vẫn còn say sưa khi đã lìa đời.\n\nLiệu ta có phải chia sẻ số phận của họ không?"
  bp2_yearly.4002.a: "Hỡi tổ tiên, xin hãy ban cho ta sức mạnh! Ta sẽ không uống nữa!"
  bp2_yearly.4002.b: "Cạn chén vì hai người, [first_aa_relative.GetFirstNameNoTooltip] và [second_aa_relative.GetFirstNameNoTooltip]!"

  bp2_yearly.4003.t: "Con Đường Của Một Quân Vương"
  bp2_yearly.4003.desc: "[child_ruler.GetName|U] giờ đây đã bằng tuổi ta khi ta bắt đầu nắm quyền cai trị. Con đường của ta khi ấy đầy gian nan, phải gánh vác cả một vương quốc khi tuổi đời còn quá trẻ, nhưng chính điều đó đã tạo nên [ROOT.Char.GetWomanMan] của ngày hôm nay. Tuổi thơ của ta khác xa những người đồng trang lứa: thay vì những trò chơi trẻ con, ta phải tham gia vào cuộc chơi của người lớn. Ta đã trải qua nó và học hỏi rất nhiều.\n\nCó một vùng đất thích hợp, [giveaway_county.GetDefinitiveName], nơi [child_ruler.GetFirstNameNoTooltip] có thể trở thành một người cai trị giống như ta từng làm. Nhưng liệu [child_ruler.GetSheHe] đã sẵn sàng chưa? Liệu con đường của ta có phải là cách duy nhất để chuẩn bị cho một tương lai khắc nghiệt?"
  bp2_yearly.4003.a: "Con sẽ đi theo con đường của ta, [child_ruler.GetFirstNameNoTooltip]."
  bp2_yearly.4003.b: "Chúng ta sẽ không lặp lại những sai lầm của quá khứ."
  bp2_yearly.4003.c: "Vùng đất này còn giá trị hơn cả việc giáo dục của [child_ruler.GetHerHis]!"

 #parental prestige event chain
  bp2_yearly.4010.t: "Bóng Của Danh Vọng: Hoàng Hôn"
  bp2_yearly.4010.desc:1 "Ở bất cứ nơi đâu ta đến, những lời thì thầm về câu chuyện và chiến công của [famous_parent.GetMotherFather] ta, [ROOT.Char.Custom('ParentPrestigeLevelText')] [famous_parent.GetTitledFirstName], luôn theo sát ta. Gần hay xa, dường như không có ai là chưa từng nghe đến tên [famous_parent.GetHerHis].\n\nTa tự hỏi, liệu ta sẽ mãi sống trong cái bóng của [famous_parent.GetMotherFather]? Hay ta có thể đạt được danh tiếng lớn lao như [famous_parent.GetHerHim]? Ta có thể vươn cao đến mức nào?"
  bp2_yearly.4010.a: "Khiêm nhường ư? Ta không hề khiêm nhường!"
  bp2_yearly.4010.b: "Một ngày nào đó con sẽ giống như người, [famous_parent.GetFirstNameNoTooltip]!"
  bp2_yearly.4010.b.flavor: "Ta sẽ trở nên lừng danh, sẽ tỏa sáng rực rỡ, bất chấp cái giá phải trả."
  bp2_yearly.4010.c: "Ta rất tự hào khi có một [famous_parent.GetMotherFather] lừng danh như vậy!"
  bp2_yearly.4010.c.flavor: "Và ta mãn nguyện khi sống trong cái bóng của [famous_parent.GetHerHis]."

  bp2_yearly.4011.t: "Bóng Của Danh Vọng: Bình Minh"
  bp2_yearly.4011.desc:1 "Vị [famous_dead_parent.GetMotherFather] của ta, bậc vĩ nhân [famous_dead_parent.GetTitledFirstName], đã [famous_dead_parent.GetDeathReason] từ rất lâu. Thế nhưng ngọn lửa trong cuộc đời [famous_dead_parent.GetHerHis] vẫn còn tỏa sáng rực rỡ. Những điều từng bao quanh [famous_dead_parent.GetHerHim] giờ đây dường như cũng đang đi theo ta.\n\nNhiều người vẫn chỉ xem ta là [ROOT.Char.Custom('GetDaughterSon')] của [famous_dead_parent.GetHerHis], thay vì một [ROOT.Char.GetWomanMan] với danh tiếng của riêng mình! Mới hôm qua, một lão nông vẫn ca ngợi [famous_dead_parent.GetHerHim] như thể [famous_dead_parent.GetSheHe] vẫn còn sống!\n\nĐã đến lúc ta bước ra khỏi cái bóng của [famous_dead_parent.GetHerHis]! Để tự tạo nên dấu ấn của mình trên thế giới! Để được công nhận là vị [ROOT.Char.GetTitledFirstName] vĩ đại!"
  bp2_yearly.4011.a: "Thế gian sẽ ghi nhớ [famous_dead_parent.GetFirstNameNoTooltip] là [famous_dead_parent.GetMotherFather] #EMP của ta#!"
  bp2_yearly.4011.b: "Than ôi, ta sẽ mãi chỉ là [ROOT.Char.Custom('GetDaughterSon')] của [famous_dead_parent.GetHerHis]."
  bp2_yearly.4011.c: "Những gì ta đạt được đến nay đã là đủ."
  bp2_yearly.4011.d: "$bp2_yearly.4011.a$"

  bp2_yearly.4012.t: "Bóng Của Danh Vọng: Ánh Sáng Ban Ngày"
  bp2_yearly.4012.desc: "Đã rất lâu kể từ khi ta quyết định dốc sức noi theo danh tiếng của [famous_dead_parent.GetMotherFather] quá cố, và còn lâu hơn nữa kể từ ngày [famous_dead_parent.GetHerHis] qua đời. Việc bước ra khỏi cái bóng ấy vừa căng thẳng vừa khắc nghiệt. Ta vẫn cảm nhận được ánh mắt phán xét của thế gian — không chỉ dựa trên thành tựu của ta, mà luôn so sánh ta với [famous_dead_parent.GetTitledFirstName].\n\nTa biết mình được kính trọng, nhưng liệu như thế đã đủ chưa? Ta còn có thể làm gì hơn nữa để được ghi nhớ? Để trở nên vĩ đại hơn cả [famous_dead_parent.GetMotherFather] từng là!"
  bp2_yearly.4012.a: "Ta vẫn còn rất nhiều điều phải đạt được."
  bp2_yearly.4012.b: "À, bận tâm làm gì. Ta sẽ mãi sống trong cái bóng của [famous_dead_parent.GetFirstNameNoTooltip]."
  bp2_yearly.4012.c: "Giờ chúng ta đã ngang bằng nhau rồi, [famous_dead_parent.GetMotherFather|U]."
  bp2_yearly.4012.d: "Không bao giờ là đủ! Không bao giờ!"

  bp2_yearly.4013.t: "Bóng Của Danh Vọng: Đỉnh Cao"
  bp2_yearly.4013.desc_success: "Hôm nay, lần đầu tiên trong đời, ta thức dậy với một niềm tin chắc chắn: danh tiếng của ta dường như không còn giới hạn, và ta không còn chỉ là [ROOT.Char.Custom('GetDaughterSon')] của [famous_dead_parent.GetTitledFirstName]. Cuối cùng, ta có thể đắm mình trong vinh quang của chính mình, tự do khỏi cái bóng của [famous_dead_parent.GetMotherFather].\n\nĐã đến lúc tạm dừng cuộc truy cầu danh vọng không ngừng nghỉ này chưa? Hay ta nên tiếp tục bùng cháy và tỏa sáng, cho đến khi mọi đứa trẻ — kể cả nhiều thế hệ sau — đều nhắc đến tên ta?"
  bp2_yearly.4013.desc_failure: "Hôm nay ta thức dậy với một ý nghĩ nặng nề: bất chấp bao năm nỗ lực, những thành tựu của đời ta vẫn lu mờ trước [famous_dead_parent.GetMotherFather] vĩ đại, [famous_dead_parent.GetTitledFirstName]. Ta đã tự ép mình tiến lên, vậy mà vẫn không thể thoát khỏi cái bóng dài của danh tiếng [famous_dead_parent.GetHerHis].\n\nĐây có phải là một lời nguyền mà mọi [famous_dead_parent.GetMotherFather] đều để lại cho con cái mình không? Chẳng lẽ tất cả chúng ta đều sinh ra để chạy đua vô vọng với những người khổng lồ của quá khứ?"
  bp2_yearly.4013.a: "Ta đã làm người thất vọng, [famous_dead_parent.GetFirstNameNoTooltip], và cũng đã làm chính mình thất vọng."
  bp2_yearly.4013.b: "[ROOT.Char.Custom('PrestigeLevelText')] [ROOT.Char.GetFirstNameNoTooltip]. Ta thích cách gọi đó."
  bp2_yearly.4013.c: "Ta sẽ không nghỉ ngơi cho đến khi danh tiếng của ta vang khắp toàn cõi thế gian!"

 #parental piety event chain
  bp2_yearly.4020.t: "Bóng Dáng Đức Tin: Hoàng Hôn"
  bp2_yearly.4020.desc: "Thật hạnh phúc biết bao khi được làm một [ROOT.Char.Custom('GetDaughterSon')] của một người phụng sự gương mẫu của [ROOT.Char.GetFaith.HighGodName]! Ngọn lửa nhiệt thành trong tim ta bùng cháy mỗi khi nghe mọi người nhắc đến [pious_parent.GetHerHim] như là [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]! Đức hạnh của [pious_parent.GetHerHis|U] được tôn kính bởi cả [ROOT.Char.GetFaith.PriestNeuterPlural] lẫn những [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] mộ đạo.\n\nTa tự hỏi, liệu mình sẽ khiêm nhường sống mãi trong cái bóng của [pious_parent.GetMotherFather]? Hay ta sẽ tự mình đạt tới và vượt qua đức tin ấy? Liệu ân sủng của [ROOT.Char.GetFaith.HighGodName] có hiển hiện nơi ta rõ ràng như nơi [pious_parent.GetHerHim] chăng?"
  bp2_yearly.4020.b: "Một ngày nào đó con sẽ giống như người, [pious_parent.GetFirstNameNoTooltip]!"
  bp2_yearly.4020.b.flavor: "Con sẽ sống đức hạnh, sẽ phụng sự [ROOT.Char.GetFaith.HighGodName], dù phải trả giá thế nào."
  bp2_yearly.4020.c: "Con thật may mắn khi có một [pious_parent.GetMotherFather] mộ đạo như vậy!"
  bp2_yearly.4020.c.flavor: "Và con hài lòng khi được sống trong cái bóng của [pious_parent.GetHerHis]."

  bp2_yearly.4021.t: "Bóng Dáng Đức Tin: Bình Minh"
  bp2_yearly.4021.desc: "Nhiều năm đã trôi qua kể từ khi vị [pious_dead_parent.GetMotherFather] vĩ đại của ta, [pious_dead_parent.GetTitledFirstName], [pious_dead_parent.GetDeathReason]. Ta hy vọng giờ đây [pious_dead_parent.GetSheHe] đang phụng sự [ROOT.Char.GetFaith.HighGodName] tại [ROOT.Char.GetFaith.PositiveAfterLife|U]. Thế nhưng tinh thần đức tin của [pious_dead_parent.GetHerHis] vẫn hiện hữu giữa những người còn sống, vừa là nguồn cảm hứng, vừa là thử thách. Ta vẫn được những tín đồ sùng đạo của [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] xem là [ROOT.Char.Custom('GetDaughterSon')] của [pious_dead_parent.GetHerHis]. Mới hôm qua, một [ROOT.Char.GetFaith.PriestNeuter] lớn tuổi còn ca ngợi [pious_dead_parent.GetHerHim] như thể [pious_dead_parent.GetSheHe] vẫn là người cai trị hiện tại!\n\nTa tự hỏi liệu [ROOT.Char.GetFaith.HighGodName] có nhìn nhận ta như vậy không? Ta cảm thấy cần phải chứng minh bản thân là một [ROOT.Char.GetWomanMan] có đức tin của riêng mình, để bước ra khỏi cái bóng của vị [pious_dead_parent.GetMotherFather] của ta!"
  bp2_yearly.4021.a: "[ROOT.Char.GetFaith.HighGodName] sẽ nhìn thấy con người thật của ta!"
  bp2_yearly.4021.b: "Than ôi, ta sẽ tôn vinh ký ức của [pious_dead_parent.GetFirstNameNoTooltip] và [ROOT.Char.GetFaith.HighGodName] bằng cách tiếp tục ở trong cái bóng của [pious_dead_parent.GetHerHis]."
  bp2_yearly.4021.c: "Ta đã đạt được đủ rồi."
  bp2_yearly.4021.d: "[ROOT.Char.GetFaith.HighGodName] sẽ biết [pious_dead_parent.GetFirstNameNoTooltip] là #EMP vị [pious_dead_parent.GetMotherFather] của ta#!"

  bp2_yearly.4022.t: "Bóng Dáng Đức Tin: Ánh Sáng Ban Ngày"
  bp2_yearly.4022.desc: "Ánh sáng của [ROOT.Char.GetFaith.HighGodName] dẫn lối ta trong cuộc hành trình thánh thiện này, cũng như từng dẫn lối cho [pious_dead_parent.GetMotherFather] của ta, vị vĩ nhân [pious_dead_parent.GetTitledFirstName]. Cuộc đời của một tôi tớ sùng đạo của [ROOT.Char.GetFaith.HighGodNamePossessive] không phải là một con đường dễ dàng, nhưng ta cảm thấy mình phải trở nên vĩ đại hơn cả [pious_dead_parent.GetMotherFather] của ta.\n\nLiệu một tín đồ tốt của [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] có luôn phải không ngừng theo đuổi sự công nhận từ cả đồng loại và [ROOT.Char.GetFaith.HighGodName] hay không? Tấm gương của một [pious_dead_parent.GetMotherFather] là ngọn hải đăng để noi theo, hay là mục tiêu để đạt tới và vượt qua?"
  bp2_yearly.4022.a: "Ta vẫn còn rất nhiều điều phải đạt được."
  bp2_yearly.4022.b: "À, bận tâm làm gì. Mong rằng [ROOT.Char.GetFaith.HighGodName] sẽ khoan dung."
  bp2_yearly.4022.c: "Giờ thì chúng ta đã ngang hàng rồi, [pious_dead_parent.GetMotherFather|U]."
  bp2_yearly.4022.d: "Không bao giờ là đủ! Không bao giờ!"

  bp2_yearly.4023.t: "Bóng Dáng Đức Tin: Đỉnh Cao"
  bp2_yearly.4023.desc_success: "[ROOT.Char.GetFaith.FateGodNamePossessive|U] được ca ngợi! Hôm nay ta thức dậy với một niềm tin chắc chắn lần đầu tiên trong đời: ta đã chứng minh không còn nghi ngờ gì rằng mình là một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] gương mẫu, không chỉ đơn thuần là [ROOT.Char.Custom('GetDaughterSon')] của [pious_dead_parent.GetTitledFirstName]. Ta đắm mình trong ánh sáng của [ROOT.Char.GetFaith.HighGodName]. Ta không còn ở trong cái bóng của vị [pious_dead_parent.GetMotherFather] của mình nữa.\n\nĐã đến lúc tập trung hơn vào những vấn đề thế tục và yên tâm rằng ta đang nhận được ân sủng của [ROOT.Char.GetFaith.HighGodNamePossessive]? Hay một tín đồ tốt của [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] không bao giờ được mệt mỏi, không bao giờ dừng lại trong cuộc theo đuổi sự công nhận của [ROOT.Char.GetFaith.HighGodNamePossessive]?"
  bp2_yearly.4023.desc_failure: "Hôm nay ta thức dậy với một ý nghĩ nặng nề: suốt bao năm qua ta đã ép bản thân trở nên mộ đạo nhất có thể. Thế nhưng ánh sáng của [ROOT.Char.GetFaith.HighGodName] vẫn bị che khuất bởi ký ức về [pious_dead_parent.GetMotherFather] — vĩ đại [pious_dead_parent.GetTitledFirstName]. Đây có phải là ý chí của [ROOT.Char.GetFaith.FateGodNamePossessive]?\n\nPhải chăng đây là lời nguyền mà mọi bậc cha mẹ để lại cho con cái? Chúng ta sinh ra chỉ để chạy đua vô vọng với những người khổng lồ của quá khứ sao? Có phải đây là thế giới mà [ROOT.Char.GetFaith.CreatorName] mong muốn?"
  bp2_yearly.4023.a: "Con đã phụ lòng Ngài! [ROOT.Char.GetFaith.HighGodName], xin hãy tha thứ cho con."
  bp2_yearly.4023.b: "[ROOT.Char.Custom('PietyLevelText')] [ROOT.Char.GetFirstNameNoTooltip]. Ta thích cách gọi này."
  bp2_yearly.4023.c: "[ROOT.Char.GetFaith.PositiveAfterLife|U] và trần thế sẽ mãi khắc ghi tên ta!"

  bp2_yearly.4030.t: "Một Buổi Tối Tuyết Rơi"
  bp2_yearly.4030.desc: "\"Ch-chúng ta đã hành quân qua vùng đất băng giá này bao lâu rồi, chỉ có [frosty_knight.GetFaith.CreatorName] mới biết! Trong khi đám người ở [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] thì chẳng làm gì, ngủ yên trong những chiếc giường ấm áp!\" $knight_culture_player_no_tooltip$ của ta, [frosty_knight.GetFirstName], vừa càu nhàu vừa run lên vì lạnh.\n\nTa nhắm mắt lại. Mặt trời! Ta chợt nhớ về ánh nắng đầu tiên sau một mùa đông dài đằng đẵng — mùa đông tưởng chừng kéo dài suốt cả đời ta. Ký ức thời thơ ấu ấy lan tỏa như nước ấm trong huyết quản, mang theo sự an ủi và thanh thản. Rồi xuân cũng đến.\n\nVà lần này cũng vậy!"
  bp2_yearly.4030.a: "Và cùng với mặt trời, là chiến thắng!"
  bp2_yearly.4030.b: ""[frosty_knight.GetSheHe] là ai mà lại mong muốn như vậy? Vị $knight_culture_player_no_tooltip$ của ta, [frosty_knight.GetFirstNameNoTooltip] sao?""
  bp2_yearly.4030.b.flavor: "Hãy nghe ta, những chiến binh của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! Đêm có dài đến đâu thì mặt trời vẫn sẽ mọc! Và cùng với nó là chiến thắng! Chúng ta sẽ trở về trong vinh quang bất diệt, với niềm tin rằng không gian khổ nào có thể ngăn cản chúng ta!"
  bp2_yearly.4030.c: "Một mùa đông khắc nghiệt nữa ư? Luyện tập tốt cho mùa sau!"
  bp2_yearly.4030.c.tt: "Rèn luyện qua mùa đông khắc nghiệt"

  bp2_yearly.4031.t: "Vòng Tròn Giam Cầm"
  bp2_yearly.4031.desc_first:1 "Một lần nữa trong đời, ta lại bị tước đoạt tự do và xiềng xích giam cầm. Khi còn là đứa trẻ, ta từng bị giam giữ bởi [old_imp.Custom2('InsultAdjective', ROOT.Char)] [old_imp.GetTitledFirstName].\n\n"
  bp2_yearly.4031.desc_base: "Giờ đây, chính [new_imp.Custom2('InsultAdjective', ROOT.Char)] [new_imp.GetTitledFirstName] là kẻ giam cầm ta.\n\nPhải chăng số phận đã đưa ta trở lại nơi này? Liệu ngay cả những sợi xích cũng vẫn như xưa? Tự do của ta chỉ là một khoảng gián đoạn ngắn ngủi trong chuỗi giam cầm bất tận?"
  bp2_yearly.4031.desc_same_captor: "Giờ đây, [old_imp.GetSheHe] lại bắt giữ ta một lần nữa!\n\nKẻ [old_imp.Custom2('InsultNoun', ROOT.Char)] già nua đó còn trơ trẽn dành cho ta #EMP sự tử tế#! là được ở đúng cái phòng giam cũ! Phải chăng chỉ vì ác ý của [old_imp.GetHerHis] mà ta lại quay trở về đây? Hay số phận đã định rằng sự tự do của ta chỉ là một khoảng gián đoạn ngắn ngủi trong kiếp tù đày?\n\n"
  bp2_yearly.4031.desc_last: "Liệu ta có mãi mãi bị chi phối bởi ý muốn của kẻ khác?\n\nKhông! Ta đã sống sót khi còn nhỏ và giành lại tự do. Giờ thì điều gì đang cản bước ta?"
  bp2_yearly.4031.a: "Không bao giờ nữa! Ta sẽ được tự do!"
  bp2_yearly.4031.a.flavor: "Phá tan những xiềng xích đáng nguyền rủa này!"
  bp2_yearly.4031.a.ct: "Các nỗ lực trốn thoát sẽ dễ thành công hơn, nhưng nếu thất bại thì hậu quả sẽ nguy hiểm hơn..."
  bp2_yearly.4031.b: "Kiên nhẫn nào, [ROOT.Char.GetFirstNameNoTooltip]. Ta đã chịu đựng được trước kia."
  bp2_yearly.4031.b.flavor: "Và ta sẽ chịu đựng được lần này."

  bp2_yearly.4032.t: "Con Tin: Quá Khứ và Hiện Tại"
  bp2_yearly.4032.desc: "Đã đến lúc [hostage_kiddo.GetFirstName] phải rời đi. Ta nhìn vào đôi mắt của [hostage_kiddo.GetHerHis] và thấy chính mình khi còn nhỏ, khi ta được gửi đi làm con tin cho [new_papa.GetTitledFirstName]. Khi ấy, [tru_papa.GetTitledFirstName] đã nhìn ta. Ta không còn nhớ những lời nào đã được nói vào ngày hôm đó. Khi ta rời đi, [tru_papa.GetSheHe] đã có những suy nghĩ gì?\n\nLiệu sau này [hostage_kiddo.GetFirstNameNoTooltip] có gửi con cái của [hostage_kiddo.GetHerHis] đi làm con tin hay không? Vào khoảnh khắc cuối cùng này, ta có thể trao cho [hostage_kiddo.GetHerHim] điều gì?"
  bp2_yearly.4032.a: "[ROOT.Char.GetHouse.GetMotto], hỡi [hostage_kiddo.Custom('GetDaughterSon')] của ta."
  bp2_yearly.4032.a.flavor: "Hãy ghi nhớ những lời này. Mỗi thành viên của [ROOT.Char.GetDynasty.GetNameNoTooltip] rồi sẽ có ngày phải phụng sự. Ngày của con chính là hôm nay."
  bp2_yearly.4032.b: "Rồi một ngày con sẽ trở về nhà, giống như ta đã từng."


