l_english:
 
 # My Favorite Councilor

  bp2_yearly_extra.0001.t: "Cố vấn yêu thích của Ta"
  bp2_yearly_extra.0001.desc: "Thật hấp dẫn và lôi cuốn. Ta đã quan sát hội đồng làm việc, và có một vị cố vấn đặc biệt [ROOT.Char.Custom2( 'RelationToMe', target_councilor )], [target_councilor.GetTitledFirstName], đã thu hút sự chú ý của Ta.\n\nRõ ràng là chúng Ta có chung những đam mê. Ta nhận ra mình dành ngày càng nhiều thời gian hơn với hội đồng."
  bp2_yearly_extra.0001.a: "Ta muốn giúp một tay!"
  bp2_yearly_extra.0001.a.tt: "Giúp đỡ hay gây rối? Lăn xả vào việc sẽ giúp Ngài học hỏi."
  bp2_yearly_extra.0001.b: "Ta chỉ thích xem họ làm việc."
  bp2_yearly_extra.0001.b.tt: "Luôn an toàn hơn khi đứng ngoài và ghi chép lại."
