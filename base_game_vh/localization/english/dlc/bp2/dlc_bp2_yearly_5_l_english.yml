l_english:
  bp2_yearly.5000.t: "Mối Lo Còn Sót Lại"
  bp2_yearly.5000.desc: "Quyền lực của ta với tư cách nhiếp chính gần như tuyệt đối, nhưng ta vẫn không thể xua đi cảm giác rằng uy quyền ấy được xây dựng trên nền móng bất ổn. Ta là kẻ tiếm quyền, và những kẻ như ta thường phải dùng đến các biện pháp quyết liệt.\n\nCó một cái gai đặc biệt trong mắt ta mà, nếu cẩn thận, có thể nhổ bỏ. [tower_prince.GetFirstName|U] còn trẻ, nhưng [tower_prince.GetSheHe] vẫn là [tower_prince.GetTitleAsNameNoTooltip] chính thống. Dù vòng kiểm soát của ta đang siết chặt lấy vương quốc này, vẫn sẽ có những kẻ nghi ngờ vị thế của ta khi thằng nhóc ấy trưởng thành.\n\nVậy thì, có lẽ đứa trẻ nên được đặt dưới sự kiểm soát của ta? Chỉ cần bôi trơn đúng chỗ..."
  bp2_yearly.5000.a: "Phải làm thôi."
  bp2_yearly.5000.a.flavor: "#WEAK Tòa Tháp hùng vĩ sẽ giam giữ [tower_prince.Custom('GetPrincessPrince')] xấu số!#!"
  bp2_yearly.5000.a.success: "Mưu kế thành công"
  bp2_yearly.5000.a.failure: "Nước cờ của Ngài thất bại"
  bp2_yearly.5000.a.tt: "Tất cả chư hầu của [tower_prince.GetFirstName|U] mất #negative_value 15#! thiện cảm với #value Ngài#!"
  bp2_yearly.5000.b: "Ta không phải quái vật."

  bp2_yearly.5001.t: "[tower_prince.Custom('GetPrincessPrince')] Trong Tòa Tháp"
  bp2_yearly.5001.desc: "Với kế hoạch mạo hiểm của ta đã thành công và [tower_prince.GetFirstName|U] bị âm thầm giam cầm, quyền lực của ta gần như không còn ai dám nghi ngờ. Thế nhưng, ta vẫn nghe thấy những lời thì thầm vang lên từ đôi môi của các thành viên trong triều đình, những lời thì thầm chất vấn, cầu nguyện, đòi hỏi: #EMP Vị [tower_prince.GetTitleAsNameNoTooltip] trẻ tuổi đang ở đâu?#!\n\nĐể đứa trẻ còn sống và lợi dụng [tower_prince.GetHerHim] nhằm củng cố địa vị của ta có thể là nước đi đúng đắn, nhưng đưa [tower_prince.GetHerHim] trở lại có thể khích lệ những kẻ muốn phế truất ta.\n\nVẫn còn một cách thứ ba. Tâm trí con người vốn hay thay đổi. Những lời này sẽ nhanh chóng biến mất nếu [tower_prince.GetSheHe]... không may gặp phải chuyện gì đó?"
  bp2_yearly.5001.a: "Vĩnh biệt, kẻ quấy rầy giấc ngủ ngọt ngào của ta..."
  bp2_yearly.5001.a.flavor: "[tower_prince.Custom('GetPrincessPrince')] trẻ tuổi sẽ lại thấy ánh sáng ban ngày, nhưng bằng một đôi mắt rất khác..."
  bp2_yearly.5001.b: "Có lẽ giờ ta có thể ép buộc vài kẻ rồi..."
  bp2_yearly.5001.b.tt: "Tất cả [vassals|E] của [tower_prince.GetFirstName|U] nhận #P 25#! thiện cảm với #value Ngài#!"
  bp2_yearly.5001.b.flavor: "Một khoản tiền lớn đặt đúng chỗ, và ta sẽ đặt nền móng cho một cuộc đảo chính!"
  bp2_yearly.5001.b.bypass: "#WEAK Điều này cho phép Ngài bỏ qua yêu cầu thời gian [regency|E] cho quyết định [decision|E] Mưu Lật Đổ Chủ Quân#!"
  bp2_yearly.5001.c: "[tower_prince.GetSheHe|U] có thể được thả, nếu [tower_prince.GetSheHe] ủng hộ vị thế của ta."
 
  bp2_yearly.5005.t: "Một Người Ngoại Quốc [foreign_hostage.Custom('GetPrettyAdjective')|U]"
  bp2_yearly.5005.desc: "Càng nhìn [foreign_hostage.GetFirstName], ta càng bị cuốn hút bởi sự hiện diện của [foreign_hostage.GetHerHis]. [foreign_hostage.GetSheHe|U] xoay người rồi lao đi để lách qua ta khi cả hai đuổi nhau trong khu vườn, ánh nắng lốm đốm chiếu lên khuôn mặt [foreign_hostage.GetHerHis].\n\nTim ta đập loạn nhịp, không chỉ vì mệt. Ta chậm rãi dừng lại. Chuyện gì đang xảy ra với ta vậy?\n\n\"[ROOT.Char.GetFirstNameNoTooltip]? Có chuyện gì sao?\" [foreign_hostage.GetFirstName] dừng lại một chút, hơi lo lắng trước sự bối rối của ta.\n\nTa #EMP quá#! hồi hộp..."
  bp2_yearly.5005.a: "Ta..."
  bp2_yearly.5005.a.tt: "Có lẽ người ấy cũng cảm thấy như vậy?"
  bp2_yearly.5005.b: "Không... không có gì."

  bp2_yearly.5006.t: "Những Lời Thì Thầm Ngọt Ngào"
  bp2_yearly.5006.desc: "Khi ta và [crusher.GetFirstName] đuổi bắt trong khu vườn, ta nhận ra [crusher.GetSheHe] đã dừng lại. Ta quay lại nhìn [crusher.GetHerHim], nhưng [crusher.GetSheHe] tránh ánh mắt ta, chỉ nhìn xuống đất.\n\n\"Ta... Ta...\" [crusher.GetSheHe] lắp bắp sau vài giây. Nuốt nước bọt thật mạnh, [crusher.GetSheHe] ngẩng [crusher.GetHerHis] đầu lên, nhìn chằm chằm vào một điểm ngay phía trên đầu ta.\n\n\"Ta thật sự... thích Ngài!\" [crusher.GetSheHe] cố thốt ra, gần như run rẩy vì căng thẳng."
  bp2_yearly.5006.a: "Ta cũng thích Ngài!"
  bp2_yearly.5006.b: "Kỳ lạ thật. Ngài đúng là kỳ lạ."

  bp2_yearly.5007.t: "Tình Yêu Tuổi Trẻ"
  bp2_yearly.5007.desc: "Thật nhẹ nhõm vô cùng, khuôn mặt [foreign_hostage.GetFirstNamePossessive] bừng sáng. [foreign_hostage.GetSheHe|U] mỉm cười, gật đầu rụt rè nhưng đầy hào hứng. Cả hai chúng ta đều chẳng tìm được nhiều lời để nói.\n\nThay vào đó, [foreign_hostage.GetFirstNameNoTooltip] đưa tay ra và khẽ nắm lấy tay ta. [foreign_hostage.GetSheHe|U] lại mỉm cười.\n\nChúng ta cùng nhau dạo bước trong khu vườn có hàng cột, tay trong tay, chẳng để tâm đến thế giới bên ngoài. Trong thầm lặng, ta ước khoảnh khắc này sẽ không bao giờ kết thúc."
  bp2_yearly.5007.a: "Ta có một món quà cho Ngài."
  bp2_yearly.5007.b: "Thành công rồi! Đây là cảm giác tuyệt vời nhất ta từng có!"

  bp2_yearly.5008.t: "Lưỡi Dao Xuyên Tim"
  bp2_yearly.5008.desc: "Kinh hoàng thay, khuôn mặt [foreign_hostage.GetFirstNamePossessive] thoáng hiện vẻ nhăn nhó đầy do dự.\n\n\"Ý Ngài là sao? Sao Ngài lại cư xử kỳ lạ thế?\" [foreign_hostage.GetSheHe|U] hỏi với vẻ khinh khỉnh.\n\nTrái tim ta vỡ vụn trên nền sỏi khu vườn. Ta che mặt để [foreign_hostage.GetSheHe] không thấy những giọt nước mắt.\n\n\"Không có gì. Ta cần phải đi.\""
  bp2_yearly.5008.a: "Có lẽ... có lẽ [foreign_hostage.GetSheHe] sẽ thay đổi ý định sau này?"
  bp2_yearly.5008.b: "Sao Ngài có thể #EMP tàn nhẫn#! như vậy, [foreign_hostage.GetFirstNameNoTooltip]?"

  bp2_yearly.5009.t: "Lập Kế Hoạch Cho Tương Lai"
  bp2_yearly.5009.desc: "Ánh mặt trời vui vẻ chiếu xuống khi [marry_crush.GetFirstName] và ta cùng nhau dạo quanh khu vườn. [marry_crush.GetSheHe|U] quay sang ta.\n\n"Khi chúng ta lớn lên, liệu chúng ta có kết hôn không?" [marry_crush.GetSheHe|U] chân thành hỏi. Vẻ mặt bối rối của ta rõ ràng đã khiến [marry_crush.GetSheHe] nói tiếp. "Khi cả hai chúng ta đủ tuổi, chúng ta chắc chắn nên kết hôn. Đó là định mệnh của chúng ta!"\n\nTa lặng lẽ suy nghĩ về khả năng ấy. Niềm đam mê trong ta bùng cháy mãnh liệt: chắc chắn tương lai của ta sẽ chẳng thể trọn vẹn nếu thiếu [marry_crush.GetFirstNameNoTooltip]?"
  bp2_yearly.5009.a: "Tất nhiên là có!"
  bp2_yearly.5009.b: "Nhiều thứ có thể thay đổi..."

  bp2_yearly.5010.t: "Dư Âm Quá Khứ"
  bp2_yearly.5010.desc: ""Giống như ngày xưa vậy, phải không?"\n\nTa thoát khỏi dòng hồi tưởng khi nghe [marry_crush.GetFirstName]. [marry_crush.GetSheHe|U] ngồi xuống bên cạnh ta, nở nụ cười rạng rỡ. Chỉ cần có [marry_crush.GetHerHim] ở khu vườn này cùng ta cũng đủ gợi lại ký ức về thời cả hai còn trẻ và vụng về hết lòng vì nhau.\n\n"Ngươi có nhớ tất cả những chuyện ngày đó không? Chúng ta thậm chí còn hứa rằng sẽ kết hôn với nhau nếu khi trưởng thành vẫn chưa thành thân!" [marry_crush.GetSheHe|U] bật cười trước ký ức ấy. Quả thật khi đó cả hai chúng ta đều quá ngây thơ.\n\nDù vậy..."
  bp2_yearly.5010.a: "Vậy thì... sao không chứ?"
  bp2_yearly.5010.a.flavor: "Những tàn lửa của cảm xúc tuổi thơ vẫn còn le lói..."
  bp2_yearly.5010.a.tt: "Ngài ngỏ lời cầu hôn với [marry_crush.GetFirstNameNoTooltip]"
  bp2_yearly.5010.b: "Đó là những ngày tháng đẹp, phải không?"

  bp2_yearly.5011.t: "Một Lời Cầu Hôn Đứng Đắn"
  bp2_yearly.5011.desc: ""Ngươi có nhớ không," [root_crush.GetFirstName] nói, quay sang ta khi chúng ta trò chuyện trong khu vườn, "rằng khi còn nhỏ chúng ta đã hứa sẽ kết hôn với nhau nếu khi trưởng thành cả hai vẫn chưa thành thân?"\n\nBất ngờ, ta lục lại ký ức của mình. Ta #EMP có#! nhớ. Trong một khu vườn rất giống nơi này, chúng ta đã đưa ra những lời hứa ngây thơ nhưng đầy hy vọng ấy. Khi đó chúng ta còn quá trẻ, quá nhiệt thành. Ký ức ấy khiến ta bất giác mỉm cười.\n\n"Ta chưa từng quên." [root_crush.GetFirstNameNoTooltip] nghiêm túc hơn ta tưởng. [root_crush.GetSheHe|U] nắm lấy tay ta bằng [root_crush.GetHersHis]. "Ta thật sự nghiêm túc với những lời đã nói. Cả hai chúng ta đều chưa kết hôn. Ta nhớ chúng ta đã từng hạnh phúc đến thế nào.""
  bp2_yearly.5011.a: "...vâng. Vâng, hãy làm vậy."
  bp2_yearly.5011.b: "Thật là những lời hứa trẻ con! Tỉnh táo lại đi."

  bp2_yearly.5012.t: "Bùng Cháy Trở Lại"
  bp2_yearly.5012.desc: "Gương mặt của [marry_crush.GetFirstNamePossessive] không thể hiện cảm xúc trong giây lát, nhưng nhanh chóng chuyển thành vẻ bất ngờ vui mừng.\n\n"Tất nhiên ta đồng ý! Tất nhiên rồi!" [marry_crush.GetSheHe|U] lao vào vòng tay ta. Trong khoảnh khắc ấy, chúng ta như trở lại thời thơ ấu, lần mò qua những cảm xúc vừa vui sướng vừa khó hiểu.\n\nTa nắm lấy tay [marry_crush.GetHerHis], và chúng ta tiến về phía lối vào khu vườn. Dù sao thì vẫn còn rất nhiều thứ cần chuẩn bị."
  bp2_yearly.5012.a: "Mãi mãi và luôn luôn!"
  bp2_yearly.5012.b: "...có lẽ ta nên suy nghĩ lại thì hơn."

  bp2_yearly.5013.t: "Tắt Lịm"
  bp2_yearly.5013.desc: "Gương mặt của [marry_crush.GetFirstNamePossessive] không thể hiện cảm xúc trong giây lát, nhưng nhanh chóng chuyển thành vẻ bối rối.\n\n"Ý ngươi là gì? Ngươi nghiêm túc sao?" [marry_crush.GetSheHe|U] cau mày. "Tại sao ngươi lại nói về những lời hứa trẻ con ngày xưa?"\n\nTa cố gắng tìm lời giải thích, nhưng [marry_crush.GetSheHe] đã quay bước rời đi, lắc đầu đầy thất vọng."
  bp2_yearly.5013.a: "Ồ..."

  bp2_yearly.5050.t: "Nhà Thông Thạo Ngôn Ngữ"
  bp2_yearly.5050.desc: "Khi ta dạo bước qua sân trong, một mảnh giấy da xoáy tròn trong gió. Ta bắt lấy nó, nhưng những nét chữ kỳ lạ trên đó hoàn toàn xa lạ với ta.\n\n\"À! Ngài tìm thấy mảnh ghi chú của Ta rồi!\" giọng nói của [polyglot.GetFirstNamePossessive] khiến ta giật mình. Nhận ra vẻ bối rối của ta, [polyglot.GetSheHe] vỗ nhẹ vào mảnh giấy một cách trấn an.\n\n\"Đó là một ngôn ngữ khác, thưa [ROOT.Char.GetLadyLord] nhỏ bé của Ta, đừng lo! Ta đọc được, còn Ngài thì chưa cần bận tâm đến nó lúc này.\""
  bp2_yearly.5050.a: "\"Ta biết hơn một thứ tiếng rồi! Dạy Ta đi!\""
  bp2_yearly.5050.b: "Nhưng... Ta muốn mà!"
  bp2_yearly.5050.c: "Ít nhất thì cũng biết được điều này."

  bp2_yearly.5051.t: "Ú Òa!"
  bp2_yearly.5051.desc: "Ta có thể nghe thấy âm thanh ấy, vang vọng khắp [ROOT.Char.Custom('ResidenceBuilding')]. Những tiếng cười khúc khích nhẹ nhàng, thỉnh thoảng lại bật lên thành những tràng cười vui vẻ. Khi ta bước vào một [ROOT.Char.Custom('GetRoom')], thủ phạm đã lộ diện.\n\n[child.GetFirstName] — judging theo những cuốn sách bị bỏ lại rải rác trên bàn, việc học của [child.GetHerHis] đã hoàn toàn bị bỏ quên — đang ôm chặt [child.Custom2('RelationToMe', baby)] của [child.GetHerHis], [baby.GetFirstName], trong vòng tay. Đứa trẻ cười khúc khích vui vẻ khi [child.GetFirstNameNoTooltip] nhìn trộm [baby.GetHerHim] qua những kẽ ngón tay, cả hai cùng bật cười thích thú."
  bp2_yearly.5051.a: "Thật tốt khi chúng dành thời gian cho nhau!"
  bp2_yearly.5051.b: "\"[child.GetFirstNameNoTooltip]! Nhớ làm bài học đi chứ!\""

  bp2_yearly.5052.t: "Những Câu Chuyện Xưa"
  bp2_yearly.5052.desc: "Bước chân ta chậm lại khi tiến đến một [ROOT.Char.Custom('GetRoom')]. Ta tưởng như có thể nghe thấy một giọng nói. Đúng vậy, nó ở ngay đó!\n\nTa nhìn thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('grandparent'))] của ta, [grandparent.GetFirstName], đang uy nghi ôm đứa cháu [child.GetFirstName] của [grandparent.GetHerHis], khiến đứa trẻ say mê với một câu chuyện. Ta cũng lắng nghe, chỉ bắt gặp được vài đoạn rời rạc.\n\n[grandparent.GetFirstNameNoTooltip] đang kể lại những câu chuyện từ một cuộc đời đáng nhớ, và những ký ức về thời xưa lẫn thời nay rõ ràng rất có ý nghĩa với [child.GetFirstNameNoTooltip], người đang háo hức đến mức há hốc miệng."
  bp2_yearly.5052.a: "\"Thế còn lần #EMP ta#! làm chuyện đó thì sao, hả?\""
  bp2_yearly.5052.b: "\"Ta tham gia cùng được chứ?\""
  bp2_yearly.5052.c: "Thật dễ thương. Tốt nhất là để họ yên."

  bp2_yearly.5053.t: "Con Tin Của Trái Tim"
  bp2_yearly.5053.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))] của ta, [ward.GetFirstName], cười toe toét trước lời trêu đùa của ta, vẫy tay chào đầy trìu mến khi [ward.GetSheHe] quay trở lại việc học. Bất chợt [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_kid'))] của ta, [angry_kid.GetFirstName], xông đến trước mặt ta.\n\n\"Thừa nhận đi!\" [angry_kid.GetSheHe|U] giận dữ hét lên. \"Ngài ngày càng say mê tên #EMP ngoại quốc#! đó! Ngài còn quan tâm đến [ward.GetHerHim] hơn cả #EMP ta#! — chính con ruột của Ngài!\"\n\nRõ ràng, cảm giác ngày càng thấy [ward.GetFirstNameNoTooltip] thực sự #EMP thuộc về#! nơi này của ta không phải ai cũng cảm nhận được..."
  bp2_yearly.5053.a: "\"Con biết là ta không bao giờ thay thế gia đình mình mà, [angry_kid.GetFirstNameNoTooltip].\""
  bp2_yearly.5053.b: "\"Ta không bao giờ cảm thấy như vậy!\""
  bp2_yearly.5053.b.success: "Ngài thuyết phục được họ"
  bp2_yearly.5053.b.failure: "Họ không tin Ngài"
  bp2_yearly.5053.c: "[ward.GetFirstNameNoTooltip] còn giống con của ta hơn ngươi từng là!"

  bp2_yearly.5054.t: "Bạn Bè Thân Thiết"
  bp2_yearly.5054.desc: "Tiếng cười và sự rộn ràng tràn vào phòng ta, báo hiệu sự xuất hiện của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] của ta, [child.GetFirstName], và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName]. Hai đứa đang vui vẻ đuổi nhau vòng quanh với đồ chơi.\n\nHai đứa trẻ xuất thân hoàn toàn khác biệt lại vô tư chơi đùa cùng nhau, và những điểm giống nhau của chúng hóa ra còn nhiều hơn cả khác biệt.\n\nCó lẽ đây là điều tốt?"
  bp2_yearly.5054.a: "Thật tốt khi thấy chúng hòa thuận."
  bp2_yearly.5054.b: "\"[child.GetFirstNameNoTooltip]! Đợi một chút, nghe ta nói này...\""
  bp2_yearly.5054.b.tt: "[child.GetSheHe|U] sẽ phải hiểu rằng không thể tin tưởng tất cả mọi người."

  bp2_yearly.5100.t: "Kẻ Thách Đấu Xuất Hiện"
  bp2_yearly.5100.desc: "#EMP Vút—rẹt!#! Âm thanh của thanh kiếm gỗ xé gió rồi trúng đích khiến ta phấn khích. Ta chuẩn bị vung thêm một nhát nữa thì chợt bắt gặp ánh nhìn của kẻ khác. [challenger.GetFirstName] lạch cạch chạy xuống bậc thềm, vung vẩy một thanh kiếm của riêng [challenger.GetHerHis].\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Để xem ngươi đấu với #EMP ta#! thế nào!#\"\n\nTa nhìn [challenger.GetFirstNameNoTooltip] từ đầu đến chân đầy dè chừng. Những 'thanh kiếm' này chắc chắn có thể gây đau nếu đâm trúng ai đó, mà [challenger.GetFirstNameNoTooltip] trông có vẻ hơi quá... #EMP hăng máu#! so với gu của ta."
  bp2_yearly.5100.a: "Được thôi. Vào tư thế đi!"
  bp2_yearly.5100.a.tt: "Kích hoạt một trận đấu tay đôi với [challenger.GetFirstNameNoTooltip]."
  bp2_yearly.5100.b: "Hay ta tổ chức một trận giả đấu thì hơn?"
  bp2_yearly.5100.b.tt: "Tập trung vào di chuyển thì chắc sẽ tránh được việc đau đầu..."

  bp2_yearly.5101.t: "Ngựa Gỗ Yêu Thích"
  bp2_yearly.5101.desc: "Cánh cửa bật mở khi ta phi theo [child.GetFirstName], cả hai cùng cưỡi ngựa gỗ và cười vang khi chạy khắp phòng làm việc. [councillor.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta, mệt mỏi ngẩng lên khỏi chồng giấy tờ mà [councillor.GetSheHe] đang xem.\n\n\"Các người nhất thiết phải gây ra cái ồn ào địa ngục này ở đây sao?\" [councillor.GetSheHe|U] kêu lên, chỉ tay về phía hai chúng ta. \"#EMP Ai đó#! còn phải điều hành vương quốc này, [ROOT.Char.Custom('FormOfAddressForLiege')], và ta rất cần sự yên tĩnh để làm việc!\"\n\nTa quay lại nhìn [child.GetFirstNameNoTooltip], kẻ vẫn đang nhảy nhót đầy phấn khích."
  bp2_yearly.5101.a: "Ngươi dám #EMP ra lệnh#! cho ta sao?!"
  bp2_yearly.5101.b: "Thi chạy ra ngoài không, [child.GetFirstNameNoTooltip]!"
  bp2_yearly.5101.b.tt: "Cả hai sẽ không nhận ra ta làm vậy chỉ để đưa chúng ta ra khỏi phòng..."
  bp2_yearly.5101.b.success: "Ngài thắng cuộc đua"
  bp2_yearly.5101.b.failure: "Ngài thua cuộc đua"
  bp2_yearly.5101.c: "\"Xin lỗi, [councillor.GetFirstNameNoTooltip]. Chúng Ta sẽ dừng lại.\""

  bp2_yearly.5102.t: "Hậu Quả Lập Tức"
  bp2_yearly.5102.desc: "Đến lượt [sibling.GetFirstNamePossessive] đuổi bắt ta khi chúng ta chơi đùa trong sân, và tim ta đập thình thịch khi ta chạy lách qua những luống hoa.\n\nMất thăng bằng, [sibling.GetFirstNameNoTooltip] đang xoay người, và không chút suy nghĩ, ta lập tức nhân cơ hội đẩy [sibling.GetHerHim] một cái. [sibling.GetFirstNameNoTooltip] ngã nhào... thẳng vào một bụi hoa hồng đầy gai!\n\nTiếng khóc nức nở vang lên ngay sau đó vừa dễ đoán lại vừa ồn ào. Loạng choạng đứng dậy, [sibling.GetSheHe] lập tức chạy về hướng — ta kinh hãi nhận ra — căn phòng của [parent.GetMotherFather] chúng ta."
  bp2_yearly.5102.a: "Làm ơn dừng lại! Ta... ta sẽ mua cho ngươi đồ chơi!"
  bp2_yearly.5102.a.tt: "[sibling.GetFirstNameNoTooltip] nhận được [newly_created_artifact.GetName]"
  bp2_yearly.5102.b: "Không, không, đừng nói với [parent.GetMotherFather]!"
  bp2_yearly.5102.b.success: "Ngài thuyết phục được [sibling.GetFirstNameNoTooltip]"
  bp2_yearly.5102.b.failure: "[sibling.GetFirstNameNoTooltip] không nao núng"
  bp2_yearly.5102.c: "\"Thôi đi, đồ nhóc mít ướt!\""

  bp2_yearly.5103.t: "Lén Mang Đồ Ngọt"
  bp2_yearly.5103.desc: "Khi đi ngang qua, ta ngửi thấy mùi hương tuyệt vời tỏa ra từ nhà bếp. Cái bụng réo rắt thúc ta tiến lại gần cửa, và một cái liếc thận trọng hé lộ đúng thứ ta hằng mong.\n\n[ROOT.Char.Custom('FavoriteTreatDemand')|U]! Bị bỏ mặc! Hoặc ít nhất là #EMP có vẻ#! như vậy. Một cái nhìn dè chừng nữa quanh phòng không phát hiện gì đáng ngờ. Ta chỉ cần lao tới và—\n\n\"[ROOT.Char.GetFirstNameNoTooltip]!\" Ta cứng người, bàn tay duỗi ra, chỉ còn cách thiên đường trong gang tấc. \"Con nghĩ mình đang làm gì vậy?\" Giọng của [ROOT.Char.Custom2('RelationToMeShort', parent)], [parent.GetFirstNamePossessive], nghiêm khắc đến đau lòng."
  bp2_yearly.5103.a: "\"Người không ngăn được ta đâu! Chẳng bao lâu nữa ta sẽ #EMP cai trị#!!\""
  bp2_yearly.5103.b: "Chạy thôi!"
  bp2_yearly.5103.b.success: "Ngài trốn thoát thành công, tay cầm món ngọt"
  bp2_yearly.5103.b.failure: "[child.Custom2('RelationToMeShort', parent)] của Ngài bắt được và đánh Ngài"
  bp2_yearly.5103.c: "\"Con xin lỗi. Con sẽ không làm nữa.\""

  bp2_yearly.5104.t: "Đứa Trẻ Cô Đơn"
  bp2_yearly.5104.desc: "Ta tung tăng chạy vào sân, tay cầm đồ chơi, chỉ để thấy [child.GetFirstName] ngồi thõng trên một băng ghế. [child.GetSheHe|U] hầu như không để ý đến ta, chỉ thở dài trước những nỗ lực làm [child.GetHerHim] vui lên của ta. Đồ chơi của ta bị bỏ mặc, khiến ta gãi đầu khó hiểu.\n\nGiờ ta nên làm gì?"
  bp2_yearly.5104.a: "Ta sẽ ngồi đây và chia sẻ tâm trạng với họ."
  bp2_yearly.5104.b: "\"Nào, [child.GetFirstNameNoTooltip], ra chơi đi!\""
  bp2_yearly.5104.b.success: "Ngài thuyết phục được [child.GetFirstNameNoTooltip] ra chơi, và họ sớm vui lên"
  bp2_yearly.5104.b.failure: "Không gì Ngài làm có thể lay chuyển [child.GetFirstNameNoTooltip]"
  bp2_yearly.5104.c: "Ừm... tốt nhất là để họ yên?"
  bp2_yearly.5104.c.tt: "Có lẽ ta có thể học được điều gì đó từ chuyện này..."

  bp2_yearly.5105.t: "Vì Danh Dự và Vinh Quang!"
  bp2_yearly.5105.desc: ""[ROOT.Char.GetFirstNameNoTooltip]!" Một giọng nói the thé vang lên khắp sân. "Ta thách Ngài một trận đấu thương để bảo vệ danh dự của Ngài! Hãy chọn chiến mã và cầm lấy cây thương của mình, hỡi chiến binh vĩ đại!"\n\n[child.GetFirstName] vung một cành cây lên, hai chân kẹp chặt một con ngựa gỗ đồ chơi. Chiến mã của ta đã được đặt ngay ngắn trên một chiếc ghế gần đó, bên cạnh một cành cây có kích thước tương tự.\n\nCó vẻ như [child.GetFirstNameNoTooltip] đã thực sự chuẩn bị sẵn sàng cho trận chiến!"
  bp2_yearly.5105.a: "\"Vậy thì tới đây, [child.GetLadyLord|U] [child.GetFirstNameNoTooltip]! Xung phong!\""
  bp2_yearly.5105.a.tt: "Cuộc đấu thương bắt đầu!"
  bp2_yearly.5105.a.success: "Ngài đánh trúng đòn"
  bp2_yearly.5105.a.failure: "[child.GetFirstNameNoTooltip] tung đòn trước"
  bp2_yearly.5105.b: "Có lẽ thận trọng vẫn hơn."

  bp2_yearly.5106.t: "Một Đòn, Đã Ghi Nhận"
  bp2_yearly.5106.desc.winning: "'Cây thương' của ta đánh trúng ngực [child.GetFirstName], để lại một vết hằn nhỏ trên da. Ta xoay người rút lui đầy đắc thắng khi [child.GetSheHe] xoa xoa thân mình [child.GetHerHis] đầy ấm ức."
  bp2_yearly.5106.desc.losing: "'Cây thương' của [child.GetFirstNamePossessive] đánh trúng thẳng vào ngực ta, khiến ta loạng choạng lùi lại. [child.GetSheHe|U] xoay người rút lui đầy tự hào."
  bp2_yearly.5106.ending: "\n\nLần xung phong đầu tiên lúc nào cũng mang tính may rủi. Giờ đây, tất cả phụ thuộc vào việc ghi nhớ huấn luyện và bài học, và ta cân nhắc mọi lợi thế chiến thuật có thể có.\n\nGió lay động tán lá khi chúng ta vào vị trí cho một lần xung phong nữa — có thể là lần mang tính quyết định."
  bp2_yearly.5106.a: "Để xem lượt này sẽ ra sao..."
  bp2_yearly.5106.a.tt: "Vòng này mang tính then chốt: hoặc giành chiến thắng, hoặc tiếp tục trụ lại cuộc đấu..."
  bp2_yearly.5106.a.success: "Đòn đánh của Ngài trúng đích"
  bp2_yearly.5106.a.failure: "Cây gậy của [child.GetFirstNamePossessiveNoTooltip] lẻn qua phòng thủ" 
  bp2_yearly.5106.b: "\"Chúng ta dừng lại được không?\""

  bp2_yearly.5107.t: "Một Đòn, Trả Lại"
  bp2_yearly.5107.desc.winning: "Cây gậy của ta hạ xuống, bật lên, lướt nhanh bên dưới [child.GetFirstNamePossessive] và đánh trúng [child.GetHerHim] ngay giữa bụng! Bị cú đánh làm mất hết hơi thở, [child.GetFirstNameNoTooltip] chật vật đứng dậy."
  bp2_yearly.5107.desc.losing: "[child.GetFirstName] không hề dễ xơi như ta hy vọng. Thay vì chùn lại, cây gậy của [child.GetHerHis] nện thẳng vào bụng ta. Ta gập người xuống, cố giấu sự bực bội khi [child.GetFirstNameNoTooltip] nở một nụ cười rạng rỡ."
  bp2_yearly.5107.ending: "Giờ đây, cả hai chúng ta đều mang trên người những dấu tích của trận đấu.\n\nLần xung phong đầu tiên giúp trấn tĩnh, lần thứ hai triển khai chiến thuật, nhưng lần thứ ba... lần thứ ba là tất cả về việc đọc vị đối thủ, vận dụng toàn bộ kiến thức đã tích lũy, và tung đòn vào những sơ hở.\n\nTa đã sẵn sàng."
  bp2_yearly.5107.a: "Vì chiến thắng!"
  bp2_yearly.5107.a.success: "Ngài đánh trúng đích và giành chiến thắng trong cuộc đấu thương"
  bp2_yearly.5107.a.failure: "[child.GetFirstNameNoTooltip] đơn giản là quá nhanh" 
  bp2_yearly.5107.b: "\"Mỗi bên đều đã thắng một lượt, sao không coi như hòa?\""
  bp2_yearly.5107.b.tt: "\"Một cuộc đấu thương hòa—thật sát nút\""
  bp2_yearly.5107.b.tt_success: "Ngài có thể thắng giải đấu tiếp theo"
  bp2_yearly.5107.b.tt_fail: "Dù sao thì cũng chỉ là trò chơi"
  bp2_yearly.5107.b_tt_fail: "Ngài chẳng học được gì từ chuyện này"

  bp2_yearly.5108.t: "Một Pha Xung Phong Tuyệt Đẹp!"
  bp2_yearly.5108.desc.winning: "Ta gần như nhắm mắt lại khi đòn đánh chạm mục tiêu, nhưng cú đánh của ta một lần nữa vẫn chính xác. Cây gậy của ta đập thẳng vào xương ức của [child.GetFirstNamePossessive], vỡ vụn thành từng mảnh đầy ấn tượng.\n\nThực tế, nó khiến [child.GetHerHim] ngã lăn ra đất, và ta thấy mình đứng phía trên cơ thể nằm bất động của [child.GetHerHis] trong chốc lát trước khi [child.GetFirstNameNoTooltip] chật vật đứng dậy.\n\nChiến thắng thuộc về ta, và nó thực sự, #EMP thực sự#! ngọt ngào."
  bp2_yearly.5108.desc.losing: "Cây gậy của [child.GetFirstNamePossessive] chao đảo trong chốc lát, nhưng đó không phải là mất thăng bằng mà là một đòn nghi binh. Nó nện thẳng vào thân ta, đánh bật không khí khỏi phổi, khiến ta đổ sập xuống đất.\n\n[child.GetFirstNameNoTooltip] đứng lùi lại khi ta gượng mình đứng lên, nhưng nỗi đau của thất bại còn nhức nhối hơn cả những vết trầy xước và bầm dập."
  bp2_yearly.5108.a: "\"Con đấu thương rất điêu luyện đấy, [child.GetFirstNameNoTooltip].\""
  bp2_yearly.5108.b: "\"Hah! Và đó là lý do ta là kẻ #EMP giỏi nhất!#!\""
  bp2_yearly.5108.c: "\"Một pha xung phong tuyệt vời, [child.GetFirstNameNoTooltip]!\""
  bp2_yearly.5108.d: "Ta sẽ trả đũa [child.GetHerHim] vì pha ăn may này..."

  bp2_yearly.5109.t: "Nỗi Đau Còn Mãi"
  bp2_yearly.5109.desc: "Sân trong vang lên tiếng nức nở khe khẽ. [child.GetFirstName] ngồi trên băng ghế, nước mắt chảy dài trên gương mặt [child.GetHerHis]. [child.GetSheHe|U] cố nén lại khi ta tiến đến, buồn bã ra hiệu cho ta ngồi xuống bên cạnh [child.GetHerHim].\n\n"
  bp2_yearly.5109.desc_unrelated: ""Ta chỉ nhớ [parent.GetMotherFather] của ta quá nhiều. Ta... ta không thể ngừng nghĩ về [parent.GetHerHim]."\n\nĐã khá lâu kể từ khi [parent.GetFirstName], [parent.GetMotherFather] của [child.GetFirstNamePossessiveNoTooltip], qua đời, nhưng rõ ràng [child.GetSheHe] vẫn cảm nhận nỗi mất mát ấy một cách sâu sắc."
  bp2_yearly.5109.desc_sibling: ""Ta chỉ nhớ [parent.GetMotherFather] quá nhiều. Ta... ta không thể ngừng nghĩ về [parent.GetHerHim]."\n\nĐã khá lâu kể từ khi [parent.GetFirstName], [parent.GetMotherFather] của chúng ta, qua đời, nhưng rõ ràng [child.GetSheHe] vẫn cảm nhận nỗi mất mát ấy một cách sâu sắc."
  bp2_yearly.5109.a: "\"Hãy nhớ rằng. [parent.GetSheHe|U] luôn dõi theo con.\""
  bp2_yearly.5109.b: "Thử làm [child.GetHerHis] phân tâm đi vậy."
  bp2_yearly.5109.b.success: "Ngài an ủi được [child.GetHerHim]"
  bp2_yearly.5109.b.failure: "[child.GetFirstNameNoTooltip] không thể nguôi ngoai"
  bp2_yearly.5109.c: "Ta... không biết nên nói gì lúc này."
  bp2_yearly.5109.c.tt: "Xem thử ta có thể lặng lẽ rút lui không..."
