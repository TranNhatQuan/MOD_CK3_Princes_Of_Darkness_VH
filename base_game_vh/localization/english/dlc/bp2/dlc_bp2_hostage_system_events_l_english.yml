l_english: 
  bp2_hostage_system.0100.t: "Bằng Mọi Giá"
  bp2_hostage_system.0100.intro: "Khi cuộc [war.Custom('WarCasusBelliShort')] của ta đã chính thức khởi sự, số phận của con tin của ta — [hostage_home_court.GetTitledFirstNamePossessive] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName] — vẫn chưa được định đoạt.\n\n"
  bp2_hostage_system.0100.desc: "Bất kỳ tổn hại nào ta có thể gây ra cho lũ [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip] khốn kiếp đều có ích, và [hostage_home_court.GetFirstNameNoTooltip] chỉ có thể tự trách [hostage_home_court.GetHerselfHimself]."
  bp2_hostage_system.0100.executed_hostage: "Tên khốn đó đã xử tử [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] của ta, [victim.GetFirstName]. Công lý đòi hỏi ta phải tàn nhẫn..."
  bp2_hostage_system.0100.spared_hostage: "[hostage_home_court.GetFirstNameNoTooltip] đã tỏ ra khoan dung với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName]. Có lẽ để những tranh chấp của chúng ta lại cho chiến trường là điều nên làm..."
  bp2_hostage_system.0100.my_hostage: "\n\nNhưng còn [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName] thì sao — [my_hostage.GetSheHe] đang nằm trong tay [hostage_home_court.GetTitledFirstNamePossessiveNoTooltip]..."
  bp2_hostage_system.0100.a: "Ta đã đưa ra quyết định."
  bp2_hostage_system.0100.b: "[hostage.GetFirstNameNoTooltip] vẫn an toàn — tạm thời."

  bp2_hostage_system.0110.t: "Lời Hứa Rỗng Tuếch"
  bp2_hostage_system.0110.desc: "Mặc dù ta đã gửi [hostage_home_court.GetHerHis] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], đến triều đình của mình, [hostage_home_court.GetTitledFirstName], tên [hostage_home_court.Custom2('InsultNoun', ROOT.Char)] phản trắc ấy vẫn phát động chiến tranh với ta từ [hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\n[hostage_home_court.GetSheHe|U] hẳn nghĩ ta yếu mềm, hoặc hoàn toàn chẳng màng đến sự an nguy của [hostage.GetFirstNamePossessiveNoTooltip], khi dám tiến hành một cuộc [war.Custom('WarCasusBelliShort')] chống lại người giám hộ con tin của [hostage_home_court.GetHerHis]..."
  bp2_hostage_system.0110.a: "[hostage_home_court.GetFirstNameNoTooltip] đã đưa ra lựa chọn của [hostage_home_court.GetHerHis]."
  bp2_hostage_system.0110.b: "Đừng vội vàng..."
 
  bp2_hostage_system.0120.t: "Kẻ Thù Của Bằng Hữu Ta"
  bp2_hostage_system.0120.intro: "Những biến cố đang chống lại con tin của ta — [hostage_home_court.GetTitledFirstNamePossessive] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName]. Dù ta đã đưa [hostage.GetHerHis] về triều đình với ý định danh dự, ta vẫn còn những nghĩa vụ khác cần thực hiện trong cuộc [war.Custom('WarCasusBelliShort')] của [war_joiner_ally.GetTitledFirstNamePossessive]...\n\n"
  bp2_hostage_system.0120.desc: "Hòa bình với [hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip] từng là mục tiêu của ta, nhưng giờ thì không còn gì có thể làm được. Khoan dung có thể duy trì một mức độ tin cậy nào đó — nhưng trong thời chiến, mọi thứ đều có thể chấp nhận."
  bp2_hostage_system.0120.a: "Tình thế đã thay đổi."
  bp2_hostage_system.0120.b: "Đây là chuyện giữa [war_joiner_ally.GetFirstNameNoTooltip] và [hostage_home_court.GetFirstNameNoTooltip]..."

  bp2_hostage_system.0130.t: "Bằng Hữu Của Kẻ Thù Ta"
  bp2_hostage_system.0130.desc: "Ta đã biết rằng [hostage_home_court.GetTitledFirstName] ngu ngốc đứng lên cầm vũ khí cùng phe với kẻ thù của ta là [war_joiner_ally.GetTitledFirstName], bất chấp việc đã gửi [hostage_home_court.GetHerHis] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], đến làm con tin của ta.\n\nCuộc [war.Custom('WarCasusBelliShort')] nhỏ nhen này đã phơi bày giá trị thật sự của những lời hứa hòa bình từ [hostage_home_court.GetHerHis], cũng như sự thờ ơ tàn nhẫn của [hostage_home_court.GetHerHis] đối với [hostage.GetFirstNameNoTooltip]."
  bp2_hostage_system.0130.a: "Ta không bao giờ đe dọa suông."
  bp2_hostage_system.0130.b: "Mọi chuyện không hẳn chỉ có trắng và đen."

  bp2_hostage_system.0140.opening: "[executioner.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp2_hostage_system.0140.attacker: "Âm mưu lừa dối ta bằng những lời hứa hòa bình đáng khinh của ngươi kết thúc tại đây. Mong rằng [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ngươi, [hostage.GetFirstName], sẽ tìm được sự yên bình hơn nơi [executioner.GetFaith.PositiveAfterLife]."
  bp2_hostage_system.0140.defender: "Cuộc xâm lược vô liêm sỉ của ngươi, ngay cả sau khi đã gửi [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] của mình — [hostage.GetFirstName] — làm con tin, chỉ có thể nhận lấy một kết cục. Mong rằng cả [hostage.GetSheHe] lẫn [executioner.GetFaith.HighGodName] sẽ tha thứ cho ngươi."
  bp2_hostage_system.0140.attacker_ally: "Chúng ta lâm vào chiến tranh vì [war_joiner_ally.GetTitledFirstName], và vì thế sinh mạng con tin của ta — [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ngươi, [hostage.GetFirstName] — bị tước đoạt."
  bp2_hostage_system.0140.defender_ally: "Sự phản bội của ngươi đã khiến [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ngươi, [hostage.GetFirstName], phải trả giá bằng mạng sống. Ta chỉ hy vọng tình bạn của ngươi với [war_joiner_ally.GetTitledFirstName] là xứng đáng với điều đó."
  bp2_hostage_system.0140.a.attacker: "Không thể nào..."
  bp2_hostage_system.0140.a.defender: "Ngươi sẽ phải trả giá..."
  bp2_hostage_system.0140.a.attacker_ally: "Sao [executioner.GetSheHe] lại có thể..."
  bp2_hostage_system.0140.a.defender_ally: "Thật vô nhân tính..."

  bp2_hostage_system.0141.opening: "[hostage_sparer.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp2_hostage_system.0141.intro: "Ta đã quyết định tha mạng cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ngươi — [hostage.GetFirstName],"
  bp2_hostage_system.0141.attacker: "vì [hostage.GetSheHe] chỉ là một quân cờ vô tội trong những trò lừa lọc của ngươi."
  bp2_hostage_system.0141.defender: "bất chấp cuộc tấn công phản trắc của ngươi, coi thường các hiệp ước của chúng ta."
  bp2_hostage_system.0141.attacker_ally: "vì [hostage.GetSheHe] không đáng phải chịu khổ vì [war_joiner_ally.GetTitledFirstNamePossessive]."
  bp2_hostage_system.0141.defender_ally: "vì [hostage.GetSheHe] không đáng phải chịu khổ vì [war_joiner_ally.GetTitledFirstNamePossessive]."
  bp2_hostage_system.0141.request: "\n\nTa tin rằng ngươi cũng sẽ thể hiện lòng khoan dung tương tự với [spared.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName]."
  bp2_hostage_system.0141.a.attacker: "Tạ ơn [ROOT.Char.GetFaith.HighGodName]..."
  bp2_hostage_system.0141.a.defender: "Có lẽ [hostage_sparer.GetSheHe] không tệ đến thế..."
  bp2_hostage_system.0141.a.attacker_ally: "Thật nhẹ nhõm..."
  bp2_hostage_system.0141.a.defender_ally: "Ít ra thì cũng còn thế..."

  bp2_hostage_system.0200.t: "Trưởng Thành Hoàn Toàn"
  bp2_hostage_system.0200.desc: "Con tin của ta — [hostage.GetFirstName] — nay đã là một [hostage.GetWomanMan], và mong sớm được trở về nhà theo tập tục. [hostage.GetHerHis|U] [hostage.Custom2('RelationToMe', SCOPE.sC('hostage_home_court'))], [hostage_home_court.GetTitledFirstName], chắc hẳn cũng trông đợi điều đó."
  bp2_hostage_system.0200.my_hostage: "\n\nCó lẽ duy trì thiện chí vẫn là lựa chọn tốt hơn — ít nhất là khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName], vẫn còn nằm trong tay [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
  bp2_hostage_system.0200.closing: "\n\nTuy nhiên, ta phải đặt lợi ích của chính #EMP gia tộc#! mình lên hàng đầu."
  bp2_hostage_system.0200.a: "Thu dọn đồ đạc đi, đã đến lúc về nhà."
  bp2_hostage_system.0200.b: "[hostage.GetFirstNameNoTooltip] phải ở lại thêm một thời gian."
  bp2_hostage_system.0200.b.my_hostage: "Khi [my_hostage.GetFirstNameNoTooltip] được trả về, [hostage.GetFirstNameNoTooltip] cũng sẽ được như vậy."
  hostage_more_likely_to_return_tt: "[hostage_home_court.GetTitledFirstName] sẽ có xu hướng trả lại [my_hostage.GetFirstName] nhiều hơn"

  bp2_hostage_system.0201.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetTitledFirstName], người đã được gửi đi làm con tin [hostage_warden.GetPrimaryTitle.GetAdjectiveNoTooltip], cuối cùng cũng đã trở về khi trưởng thành thành một [hostage.GetWomanMan]! Hiệp ước với [hostage_warden.GetTitledFirstName] đã kết thúc, nhưng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta vẫn an toàn."
  bp2_hostage_system.0201.my_hostage_adult: "\n\nTuy nhiên, [hostage_warden.GetFirstNamePossessiveNoTooltip] [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] — [my_hostage.GetFirstName] — vẫn là con tin của ta, dù đã là một [my_hostage.GetWomanMan], và dõi theo với chút ghen tị. Có lẽ cũng nên trả tự do cho [my_hostage.GetHerHim]..."
  bp2_hostage_system.0201.my_hostage: "\n\n[hostage_warden.GetFirstNamePossessiveNoTooltip] [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName], vẫn là con tin của ta, nhưng [my_hostage.GetSheHe] vẫn chỉ là một [my_hostage.Custom('GirlBoy')]."
  bp2_hostage_system.0201.a: "Có quá nhiều điều cần bù đắp!"
  bp2_hostage_system.0201.b: "[my_hostage.GetFirstNameNoTooltip] cũng có thể về."
  bp2_hostage_system.0201.c: "Có lẽ khi [my_hostage.GetSheHe] lớn hơn."
  bp2_hostage_system.0201.c.adult: "Ta không nghĩ vậy."

  bp2_hostage_system.0202.t: "Ngày Trở Về Mong Đợi"
  bp2_hostage_system.0202.desc: "Ta đã chờ đợi trong hy vọng khi sinh nhật của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstNamePossessive], đến gần, bởi theo phong tục, các con tin sẽ được đưa trở về nhà một khi họ không còn là trẻ con nữa.\n\nThan ôi, có vẻ như kế hoạch của [hostage_warden.GetTitledFirstNamePossessive] là giữ [hostage.GetFirstNameNoTooltip] ở lại [hostage_warden.GetCapitalLocation.GetNameNoTooltip] thêm một thời gian nữa...\n\n"
  bp2_hostage_system.0202.a: "Hẳn là có lý do chính đáng."

  bp2_hostage_system.0203.t: "Lại Về Nhà"
  bp2_hostage_system.0203.desc: "Ta đã chờ đợi với đôi chút lo lắng trước phản hồi của [hostage_home_court.GetTitledFirstNamePossessive], sau khi gửi [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] của [hostage_home_court], [hostage.GetFirstName], lên đường trở về.\n\n"
  bp2_hostage_system.0203.closing: "Phản hồi đến rất nhanh — và chẳng bao lâu sau, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName], đã đứng trước cổng thành!"
 
  bp2_hostage_system.0204.t: "Mắc Kẹt Trong Lưng Chừng"
  bp2_hostage_system.0204.closing: "Phản hồi rất rõ ràng; [hostage_home_court.GetSheHe] buộc phải tiếp tục giữ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName], trong tương lai gần để đảm bảo hòa bình..."
  bp2_hostage_system.0204.a: "Tội nghiệp [my_hostage.Custom('GirlBoy')]..."

  bp2_hostage_system.0300.t: "Dưới Sự Giám Hộ Của Ta"
  bp2_hostage_system.0300.intro: "Việc đảm bảo an toàn cho con tin là trách nhiệm và lời thề danh dự của một người giám hộ. Ta đã lập giao ước bảo vệ [hostage.GetHerHim] khỏi mọi tổn hại,"
  bp2_hostage_system.0300.killer: "vậy mà cuối cùng vẫn chính tay ta đoạt mạng [hostage.GetFirstName]."
  bp2_hostage_system.0300.violent: "thế nhưng [hostage.GetFirstName] đã gặp kết cục bi thảm tại triều đình của ta."
  bp2_hostage_system.0300.fallback: "và giờ đây [hostage.GetFirstName] đã chết."
  bp2_hostage_system.0300.desc: "\n\nKhông còn gì có thể làm được nữa; [hostage_home_court.GetTitledFirstName] chắc chắn sẽ phẫn nộ khi tin tức đến tai triều đình [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip], và mọi hiệp ước sẽ tan vỡ."
  bp2_hostage_system.0300.my_hostage: "\n\nTa chỉ mong rằng [hostage_home_court.GetTitledFirstName] sẽ không trút cơn thịnh nộ lên [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName]."
  bp2_hostage_system.0300.a.killer: "Thôi thì..."
  bp2_hostage_system.0300.a.violent: "Thật đáng tiếc..."
  bp2_hostage_system.0300.a: "Bi thảm..."

  bp2_hostage_system.0301.opening: "[hostage_warden.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp2_hostage_system.0301.intro: "Ta rất tiếc phải báo tin rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ngươi — [hostage.GetFirstName] — đã qua đời.\n\n"
  bp2_hostage_system.0301.killer: "Hãy hiểu rằng ta không còn lựa chọn nào khác ngoài việc tước đoạt sinh mạng [hostage.GetHerHis]."
  bp2_hostage_system.0301.violent: "Cách mà [hostage.GetSheHe] rời khỏi cõi đời này, khi đang dưới sự bảo vệ của ta, sẽ ám ảnh ta mãi."
  bp2_hostage_system.0301.fallback: "Xin tha thứ cho ta vì đã hoàn toàn thất bại trong bổn phận giám hộ [hostage.GetHerHis]."
  bp2_hostage_system.0301.desc: "Ta hy vọng một ngày nào đó ngươi có thể tha thứ cho ta — vì lợi ích của cả hai chúng ta."
  bp2_hostage_system.0301.my_hostage: "\n\nDù chuyện gì đã xảy ra ở đây, [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta — [my_hostage.GetFirstName] — hoàn toàn vô tội."
  bp2_hostage_system.0301.a.killer: "Tên... #EMP khốn kiếp!#!"
  bp2_hostage_system.0301.a.violent: "[hostage.GetFirstNameNoTooltip]... tại sao...?"
  bp2_hostage_system.0301.a: "Không thể nào..."
  bp2_hostage_system.0301.b: "Mắt đền mắt!"

  bp2_hostage_system.0400.t: "Thay đổi hoàn cảnh"
  bp2_hostage_system.0400.landed_hostage: "Với việc con tin của ta, [hostage.GetFirstNamePossessive], thừa kế [hostage.GetPrimaryTitle.GetNameNoTierNoTooltip], ta giờ đây phải chăm sóc một [hostage.GetTitleAsNameNoTooltip]!"
  bp2_hostage_system.0400.ruler_hostage: "Với con tin của ta, [hostage.GetFirstName], giờ đây đã nắm quyền cai quản một [hostage.GetDomicile.GetType.GetName|l] của riêng [hostage.GetHerHis], ta thấy mình đang chăm sóc cho một [hostage.GetTitleAsNameNoTooltip]!"
  bp2_hostage_system.0400.imprisoned_hostage_self: "Với con tin trước đây của ta, [hostage.GetFirstName], nay đang mục rữa trong ngục của ta, hiệp ước với [home_court.GetTitledFirstName] chắc chắn đã chấm dứt."
  bp2_hostage_system.0400.imprisoned_hostage_fail: "Với con tin trước đây của ta, [hostage.GetFirstName], đã trốn thoát khỏi những nỗ lực giam giữ [hostage.GetHerHim] của ta, hiệp ước với [home_court.GetTitledFirstName] chắc chắn đã kết thúc."
  bp2_hostage_system.0400.imprisoned_hostage: "Với con tin của ta, [hostage.GetFirstName], đang mòn mỏi trong ngục của [imprisoner.GetTitledFirstNamePossessive], hiệp ước với [home_court.GetTitledFirstName] đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0400.unrelated_hostage: "Với con tin của ta, [hostage.GetFirstNamePossessive], nay không còn liên quan gì tới [home_court.GetTitledFirstName], hiệp ước của chúng ta đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0400.unlanded_warden_title: "Với việc mất [lost_title.GetNameNoTierNoTooltip], hiệp ước của ta với [home_court.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của con tin [hostage.GetFirstName], đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0400.unlanded_warden: "Với việc ta mất toàn bộ lãnh thổ, hiệp ước với [home_court.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của con tin [hostage.GetFirstName], đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0400.unlanded_home_court_title: "[home_court.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của con tin ta, [hostage.GetFirstName], đã mất các vùng đất [lost_title.GetAdjectiveNoTooltip] của [home_court.GetHerHis], và hiệp ước của chúng ta đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0400.unlanded_home_court: "[home_court.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của con tin ta, [hostage.GetFirstName], đã mất lãnh thổ của [home_court.GetHerHis], và hiệp ước của chúng ta đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0400.dead_home_court: "[home_court.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của con tin [hostage.GetFirstName], đã qua đời mà không đảm bảo được sự kế vị của Nhà [home_court.GetHouse.GetBaseNameNoTooltip], và hiệp ước của chúng ta đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0400.imprisoned_self: "\n\n[home_court.GetFirstNameNoTooltip] chắc chắn sẽ không hài lòng..."
  bp2_hostage_system.0400.imprisoned: "\n\nTa tin rằng [hostage.GetFirstNameNoTooltip] sẽ sớm được trả tự do..."
  bp2_hostage_system.0400.ruler: "\n\n[hostage.GetFirstNameNoTooltip] sẽ sớm rời đi để lên ngôi tại [hostage.GetCapitalLocation.GetName]."
  bp2_hostage_system.0400.family: "\n\n[hostage.GetFirstNameNoTooltip] được tự do rời đi và đoàn tụ với gia đình của [hostage.GetHerHis], nếu [hostage.GetSheHe] lựa chọn như vậy."
  bp2_hostage_system.0400.no_family: "\n\n[hostage.GetFirstNameNoTooltip] được tự do rời đi, dù số phận của [hostage.GetHerHis] vẫn còn rất bất định."
  bp2_hostage_system.0400.adopted: "Với con tin trước đây của ta, [hostage.GetFirstName], nay được xem là thành viên chính thức của Nhà [ROOT.Char.GetHouse.GetBaseName], thỏa thuận trước đó với [home_court.GetTitledFirstName] trở nên không còn cần thiết."
  bp2_hostage_system.0400.adopted_stay: "\n\nDẫu vậy, [hostage.GetSheHe] vui vẻ quyết định tiếp tục ở lại triều đình của ta tại [ROOT.Char.GetCapitalLocation.GetName] thêm một thời gian."
  bp2_hostage_system.0400.my_hostage: "\n\nTa mong con tin của chính ta, [warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName], cũng sẽ được trả về."
  bp2_hostage_system.0400.a: "Không còn gì có thể làm."
  bp2_hostage_system.0400.b: "Và [hostage.GetSheHe] rất được chào đón!"
  bp2_hostage_system.0400.home: "[hostage.GetFirstNameNoTooltip] rời đi"

  bp2_hostage_system.0401.landed_hostage: "Với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstNamePossessive], được thừa kế [hostage.GetPrimaryTitle.GetNameNoTierNoTooltip], [warden.GetTitledFirstName] giờ đây thấy mình đang chăm sóc cho một [hostage.GetTitleAsNameNoTooltip]!"
  bp2_hostage_system.0401.ruler_hostage: "Với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], giờ đây đang cai quản một [hostage.GetDomicile.GetType.GetName|l] của riêng [hostage.GetHerHis], [warden.GetTitledFirstName] thấy mình đang chăm sóc cho một [hostage.GetTitleAsNameNoTooltip]!"
  bp2_hostage_system.0401.imprisoned_hostage_self: "Ta được biết [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], đã bị [warden.GetTitledFirstName] ngang nhiên giam cầm, kẻ từng hứa sẽ chăm sóc [warden.GetHerHim] như một con tin."
  bp2_hostage_system.0401.imprisoned_hostage_fail: "Ta được biết [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], đã suýt bị quản ngục của [hostage.GetHerHis], [imprisoner.GetTitledFirstName], tống giam!"
  bp2_hostage_system.0401.imprisoned_hostage: "Với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], đang mòn mỏi trong ngục của [imprisoner.GetTitledFirstNamePossessive], hiệp ước của ta với [warden.GetTitledFirstName] đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0401.unrelated_hostage: "Với việc [hostage.GetFirstName], người được gửi từ đây làm con tin [warden.GetPrimaryTitle.GetAdjectiveNoTooltip], nay không còn liên quan gì tới [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], hiệp ước của ta với [warden.GetTitledFirstName] đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0401.unlanded_home_court_title: "Với việc mất [lost_title.GetNameNoTierNoTooltip], hiệp ước của ta với [warden.GetTitledFirstName], người giám hộ của [hostage.GetFirstName], đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0401.unlanded_home_court: "Với việc mất toàn bộ lãnh thổ, hiệp ước của ta với [warden.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))] của con tin [hostage.GetFirstName], đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0401.unlanded_warden_title: "[warden.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))] của con tin ta, [hostage.GetFirstName], đã mất các vùng đất [lost_title.GetAdjectiveNoTooltip] của [warden.GetHerHis], và hiệp ước của chúng ta đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0401.unlanded_warden: "[warden.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))] của con tin ta, [hostage.GetFirstName], đã mất lãnh thổ của [warden.GetHerHis], và hiệp ước của chúng ta đột nhiên trở nên vô nghĩa."
  bp2_hostage_system.0401.dead_warden: "[warden.GetTitledFirstName], người giám hộ của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] ta là [hostage.GetFirstName], đã qua đời mà không đảm bảo được sự kế vị của Nhà [warden.GetHouse.GetBaseNameNoTooltip]."
  bp2_hostage_system.0401.imprisoned: "\n\nTa cầu nguyện [ROOT.Char.GetFaith.HighGodName] sẽ nhân từ và [hostage.GetFirstNameNoTooltip] sớm được trả tự do."
  bp2_hostage_system.0401.imprisoned_fail: "\n\nQuả là cách đối xử đáng phẫn nộ với một con tin, nhưng việc [hostage.GetFirstNamePossessiveNoTooltip] trở về an toàn vẫn là một phước lành."
  bp2_hostage_system.0401.adopted: "Ta đã nghe những lời đồn rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], giờ đây xem bản thân [hostage.GetHerselfHimself] là một thành viên của Nhà [hostage.GetHouse.GetBaseName]! [warden.GetTitledFirstName], kẻ [warden.Custom2('InsultNoun', ROOT.Char)] đó, chắc chắn đã đầu độc tâm trí [hostage.GetHerHis]!"
  bp2_hostage_system.0401.adopted_stay: "\n\nNgười ta thậm chí còn nói rằng [hostage.GetFirstNameNoTooltip] xem #EMP [warden.GetCapitalLocation.GetName]#! là quê hương thực sự của [hostage.GetHerHis], chứ không phải [ROOT.Char.GetCapitalLocation.GetName]!"
  bp2_hostage_system.0401.a: "Thì cứ vậy đi."
  bp2_hostage_system.0401.b: "Phản bội!"

  bp2_hostage_system.0402.inherited: "Sáng nay có tin từ [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]; [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của ta, [home_court.GetTitledFirstName], đã qua đời...\n\nNgười ta nói rằng [home_court.GetSheHe] [home_court.GetDeathReasonHideKiller].\n\n[warden.GetTitledFirstName] đã cho phép ta rời đi, và với tư cách là người thừa kế của [home_court.GetFirstNamePossessiveNoTooltip], ta phải mạnh mẽ và gánh vác trọng trách của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
  bp2_hostage_system.0402.dead: "\n\nTa sẽ không bao giờ còn được nhìn thấy [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của mình nữa..."
  bp2_hostage_system.0402.a: "Chúng ta phải đi."

  bp2_hostage_system.0410.t: "Đổi thay vận mệnh"
  bp2_hostage_system.0410.desc: "Hoàn cảnh của [home_court.GetTitledFirstName], người [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] của con tin ta là [hostage.GetFirstName], đã thay đổi; giờ đây [home_court.GetSheHe] thấy bản thân chỉ còn là một [home_court.GetTitleAsNameNoTooltip] nhỏ bé.\n\nHiệp ước của chúng ta được lập nên dựa trên những giả định hoàn toàn khác, và có lẽ giờ đây sẽ là lúc thích hợp để xem xét lại..."
  bp2_hostage_system.0410.a: "[hostage.GetFirstNameNoTooltip] và [my_hostage.GetFirstNameNoTooltip] sẽ trở về nhà."
  bp2_hostage_system.0410.b: "[my_hostage.GetFirstNameNoTooltip] phải trở về ngay."
  bp2_hostage_system.0410.c: "Ngươi không còn giá trị gì nữa, [hostage.GetFirstNameNoTooltip]."
  bp2_hostage_system.0410.d: "Mọi thứ không thay đổi."

  bp2_hostage_system.0411.opening: "[warden.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp2_hostage_system.0411.intro: "Hoàn cảnh của ngươi đã thay đổi kể từ khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ngươi, [hostage.GetTitledFirstName], được gửi tới làm con tin của ta.\n\n"
  bp2_hostage_system.0411.my_hostage: "Ta yêu cầu ngươi lập tức trả lại [warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetTitledFirstName]."
  bp2_hostage_system.0411.hostage: "[hostage.GetSheHe|U] sẽ sớm trở về, và hiệp ước của chúng ta chấm dứt."
  bp2_hostage_system.0411.both: "[hostage.GetTitledFirstName] đang trên đường trở về, và ta tin chắc rằng [warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] của ta, [my_hostage.GetFirstName], cũng sẽ sớm như vậy."
  bp2_hostage_system.0411.a: "Rất tốt."

  bp2_hostage_system.0500.t: "Ngôi nhà mới"
  bp2_hostage_system.0500.desc: "Ta được báo rằng con tin của ta, [hostage.GetFirstName], cuối cùng đã đến từ [hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  bp2_hostage_system.0500.anxious: "[hostage_home_court.GetTitledFirstNamePossessive] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] hẳn sẽ rất lo lắng cho cuộc sống mới của [hostage.GetHerHis] tại [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  bp2_hostage_system.0500.home: "\n\n\"Hãy tin vào [hostage.Custom2('RelationToMe', SCOPE.sC('hostage_home_court'))] của ngươi,\" ta trấn an [hostage.GetHerHim]. \"Ngươi sẽ được đối đãi tử tế tại đây.\""
  bp2_hostage_system.0500.away: "\n\nTa tin rằng người của ta sẽ khiến [hostage.GetHerHim] cảm thấy như ở nhà."
  bp2_hostage_system.0500.a.home: "Ta sẽ dẫn ngươi tới phòng."
  bp2_hostage_system.0500.a: "Hiệp ước đã được thiết lập."

  bp2_hostage_system.0501.opening: "Kính chào [hostage.Custom2('RelationToMe', hostage_home_court)],"
  bp2_hostage_system.0501.desc: "Ta đã đến an toàn tại [hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip], và [hostage_warden.GetTitledFirstName] đã xác nhận hiệp ước của ngài.\n\n"
  bp2_hostage_system.0501.child_alone: "Ở đây không có đứa trẻ nào khác, và nơi này thật lạ lẫm."
  bp2_hostage_system.0501.child: "Con đã gặp những đứa trẻ khác trong triều. Chúng có vẻ tốt."
  bp2_hostage_system.0501.adult: "Xin đừng quên con."
  bp2_hostage_system.0501.a.child_alone: "Tội nghiệp [hostage.Custom('GirlBoy')]..."
  bp2_hostage_system.0501.a.child: "Ta mong [hostage.GetSheHe] hạnh phúc ở đó."
  bp2_hostage_system.0501.a: "Mọi thứ đúng như kế hoạch."

  bp2_hostage_system.0502.opening: "[hostage_warden.Custom2('AppropriateGreeting', hostage_home_court)]"
  bp2_hostage_system.0502.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ngài, [hostage.GetFirstName], đã đến an toàn tại [hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nXin xem hiệp ước của chúng ta đã được xác nhận."
  bp2_hostage_system.0502.a: "Rất tốt."

  bp2_hostage_system.0510.intro: "Ta được lính gác báo rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] của ta, [hostage.GetFirstName], đang tiến về [ROOT.Char.GetCapitalLocation.GetNameNoTooltip],"
  bp2_hostage_system.0510.duration_short: "dù dường như mới chỉ hôm qua [hostage.GetSheHe] rời đi tới [warden.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  bp2_hostage_system.0510.duration_long: "sau nhiều năm xa cách tại [hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip]. $bp2_hostage_system.0510.older$"
  bp2_hostage_system.0510.duration: "trở về sau thời gian lưu trú tại [hostage_warden.GetPrimaryTitle.GetNameNoTierNoTooltip]. $bp2_hostage_system.0510.older$"
  bp2_hostage_system.0510.older: "[hostage.GetSheHe|U] đã lớn hơn, nhưng ta nhận ra [hostage.GetHerHim] ngay lập tức."
  bp2_hostage_system.0510.home: "\n\nChúng ta ôm nhau trước cổng thành, \"Ngươi phải kể cho ta mọi thứ, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] của ta! Có tệ lắm không?\""
  bp2_hostage_system.0510.away: "\n\nChúng ta sẽ trò chuyện khi ta về nhà."
