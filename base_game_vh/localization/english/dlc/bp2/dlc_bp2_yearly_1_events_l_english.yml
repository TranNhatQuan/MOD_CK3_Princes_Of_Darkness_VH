l_english:
 ##EVENTS
 #Parent/Guardian: Your child/ward walks in on you performing your stress trait
  bp2_yearly.1000.t: "Gieo Nhân Nào..."
  bp2_yearly.1000.desc_drunkard: "\"Một... một vòng nữa thôi, thưa chẻ-văng, làm ơn... #EMP *hic*!#!\"\n\nThứ [ROOT.Char.Custom('RegionalAlcoholicDrink')] đang làm hỏng giọng nói của ta, nhưng ta đang quá chìm đắm trong cảm giác dễ chịu của nó để mà bận tâm. Thật ra là chẳng buồn quan tâm đến hầu hết mọi thứ.\n\nTrong một cơn ướt át dữ dội, rượu quyết định rời khỏi cơ thể ta — thẳng lên bữa tối của ta! Những vị khách xung quanh khịt mũi ghê tởm."
  bp2_yearly.1000.desc_hashishiyah: "Lần này hashish thật sự là hảo hạng — mạnh đến mức da ta bắt đầu ngứa ran và quần áo thì #EMP chật quá mức!#!\n\nTa cởi sạch đồ và, theo một cơn bốc đồng, chạy ra ngoài đuổi theo tiếng chim hót. Một lát sau, ta quay lại..."
  bp2_yearly.1000.desc_reclusive: "\"Lũ ngu rủa và chó thối, tất cả bọn chúng!\" ta lẩm bẩm khi cuối cùng cũng được ở một mình trong im lặng. Ta xoa thái dương và nhắm mắt lại.\n\nMột tiếng động bất ngờ kéo ta về thực tại. Mắt ta bật mở. #EMP Chẳng lẽ ta không được ở một mình, như điều ta khao khát sao?!#! Ta rủa thầm."
  bp2_yearly.1000.desc_irritable: "Đã khuya. Đám người ăn theo tầm thường cứ lải nhải quanh ta. Cái đầu nhức nhối như đóng đinh vào suy nghĩ.\n\nMột cái vò rơi xuống sàn ngay cạnh ta.\n\nKhông chút do dự, ta nổi giận và hét vào mặt tên gia nhân gây chuyện: \"Ngươi thật là đồ #EMP [dummy_gender.Custom2('InsultNounClumsy', ROOT.Char)] vô lễ!#! Ngươi được sinh ra bởi một con yêu tinh [dummy_gender.Custom2('InsultAdjectiveClumsy', ROOT.Char)] sao?!\""
  bp2_yearly.1000.desc_flagellant: "#EMP *RẮC!*#! Roi của ta quất vào người ta, điên cuồng, #EMP lần nữa#! và #EMP lần nữa.#! Cơn đau bỏng rát, cô lập và dữ dội khiến tâm trí ta tập trung lại.\n\nTa quất thêm vài roi nữa. Mỗi nhát đưa ta tiến gần hơn một chút tới sự cứu rỗi ngọt ngào."
  bp2_yearly.1000.desc_profligate: "#EMP Hừm#! cái này trông hay đấy. Ừ, cả cái kia nữa. Mua xong, ta ném đống hàng xa xỉ cho đám gia nhân.\n\nQuay lại, ta nhìn thấy cả một núi đồ phù phiếm mình đã gom góp. Nó đang trở nên khá là... đồ sộ. Và túi tiền của ta thì đã... trống rỗng."
  bp2_yearly.1000.desc_improvident: "Một bài giảng tuyệt vời, một nghi lễ hoàn hảo. Khi rời khỏi [ROOT.Char.GetFaith.HouseOfWorship], ta — dĩ nhiên — tỏ lòng kính trọng với vị [ROOT.Char.Custom('DefaultPriestTitle')] không chỉ bằng tiền xu, mà còn cả toàn bộ trang sức ta có thể cho đi. Vài người nhìn ta đầy nghi hoặc.\n\nNhưng vàng bạc chỉ là thứ phù du! Gánh nặng của tội lỗi và xấu hổ mới thật nặng nề..."
  bp2_yearly.1000.desc_contrite: "[other_guest.GetTitledFirstName] trố mắt nhìn ta, kinh hãi trước những thông tin riêng tư mà ta vừa thú nhận trong bữa tối. \"Ngươi đã #EMP làm gì cơ#!?\" [other_guest.GetSheHe] lặp lại, đầy bối rối.\n\nSự ăn năn của ta cũng có mặt được — và mặt mất. Ta thấy nhẹ nhõm hơn... nhưng liệu đó có phải vì ta đang trút gánh nặng lên người khác?"
  bp2_yearly.1000.desc_comfort_eater: "Ta ngả lưng ra ghế, #EMP có lẽ#! đã no căng, nhưng thêm một món ngọt quyến rũ nữa lại trôi qua môi ta. Những mệt mỏi của buổi sáng bận rộn dường như đã bị chôn vùi.\n\nTa nhận ra xung quanh mình là vô số đĩa rỗng của [ROOT.Char.Custom('FavoriteTreat')]. Vô số."
  bp2_yearly.1000.desc_inappetetic: "Ta gẩy gẩy thức ăn trước mặt, di chuyển nó để tạo cảm giác rằng ta đã ăn. Ta không muốn khiến ai lo lắng.\n\nAi có thời gian để ăn chứ? Ban ngày là để cai trị; ban đêm là để chính trị. Làm sao ta có thể vui thú với đồ ăn khi tất cả những điều này đè nặng lên ta?"
  bp2_yearly.1000.desc_journaller: "Ta thở phào nhẹ nhõm, đặt dụng cụ viết sang một bên. Ánh mắt ta lướt dọc cuốn nhật ký nhỏ, đã sờn mép, luôn kè kè bên mình — một tập hợp những dòng ghi chép vụn vặt.\n\nNgẩng đầu lên, ta nhận ra ánh nắng ban mai đã nhường chỗ cho hoàng hôn. #EMP Bao lâu rồi#! ta còn mải mê với câu chữ của mình?"
  bp2_yearly.1000.desc_confider: "Dù là bữa sáng hay một buổi tụ họp không chính thức, ta thường nghiêng sang người tri kỷ của mình, [confider_friend.GetTitledFirstName], để chia sẻ quan điểm.\n\nThật dễ chịu khi được nghe suy nghĩ của chính mình qua lời nói, và đặt niềm tin vào ý kiến của một người Ngài! Với lời khuyên của [confider_friend.GetFirstNamePossessiveNoTooltip] về một chuyện vặt vãnh, ta đưa mắt nhìn khắp bàn tiệc đông đúc..."
  bp2_yearly.1000.desc_athletic: "Ta hoàn thành thêm một vòng quanh [ROOT.Char.Custom('ResidenceBuilding')], mồ hôi chảy dọc lưng, thu hút vài ánh nhìn của người xung quanh. Một cơ thể khỏe mạnh quả thật sinh ra một tâm trí lành mạnh!\n\nGầm lên một tiếng, ta dừng lại; nắm lấy một tảng đá lớn và nhấc nó lên trước ngực."
  bp2_yearly.1000.outro_bad: "\n\n...rồi ta bắt gặp [appropriate_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, đang nhìn chằm chằm vào ta. #EMP Hừm.#!"
  bp2_yearly.1000.outro: "\n\n...rồi ta để ý thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], đang nhìn ta với vẻ tò mò."
  bp2_yearly.1000.a: "Không hẳn là khoảnh khắc vẻ vang nhất của ta..."
  bp2_yearly.1000.a_good: "Nào, ta đang làm tới đâu rồi nhỉ..."
  bp2_yearly.1000.a.flavor: "Ta chắc [appropriate_child.GetFirstNameNoTooltip] sẽ ổn thôi..."
  bp2_yearly.1000.a.flavor_good: "Không phải thói quen nào cũng xấu, phải không?"
  bp2_yearly.1000.a.tt: "Hành động của Ngài có thể để lại ảnh hưởng lâu dài lên [appropriate_child.GetShortUIName]"
  bp2_yearly.1000.b: "Muốn tham gia cùng ta không?"
  bp2_yearly.1000.b_drunkard: "Muốn #EMP *hic*#! tham gia cùng ta không?"
  bp2_yearly.1000.b_contrite: "Thế còn #EMP tội lỗi#! của con thì sao, nhóc?"
  bp2_yearly.1000.b_inappetetic: "Thức ăn là dành cho loài vật."
  bp2_yearly.1000.b_us: "Muốn tham gia cùng bọn ta không?"
  bp2_yearly.1000.b_hashishiyah: "...muốn thử một ít không?"
  bp2_yearly.1000.b_reclusive: "Làm ơn #EMP đi đi#!."
  bp2_yearly.1000.b_flagellant: "Đôi khi roi vọt là sự an ủi duy nhất."
  bp2_yearly.1000.b_improvident: "Túi tiền của ta nhẹ đi, nhưng trái tim ta còn nhẹ hơn."
  bp2_yearly.1000.b_athletic: "Ta thậm chí còn có thể chạy nhanh hơn cả [ROOT.Char.GetFaith.WitchGodName], đấy."
  bp2_yearly.1000.b_agitated: "Ngươi #EMP nhìn#! cái gì hả!?"
  bp2_yearly.1000.b.flavor: "Càng đông càng vui!"
  bp2_yearly.1000.b.flavor_contrite: "Bí mật giống như vết thương nhiễm trùng..."
  bp2_yearly.1000.b.flavor_inappetetic: "Chúng ta nên quay lại làm việc thực sự."
  bp2_yearly.1000.b.flavor_confider: "Tâm sự là một nghệ thuật!"
  bp2_yearly.1000.b.flavor_flagellant: "Đó là sự thật."
  bp2_yearly.1000.b.flavor_improvident: "Chúng ta phải quan tâm đến những người kém may mắn."
  bp2_yearly.1000.b.flavor_athletic: "...à thì, ít nhất là ta chưa thử."
  bp2_yearly.1000.b.flavor_agitated: "Thật là #EMP quá đáng#!!"
 #Follow-up; the child is mimicking your stress behavior
  bp2_yearly.1001.t: "...Gieo Gì"
  bp2_yearly.1001.desc_drunkard: "Kho chứa thường được #EMP bảo vệ cẩn thận#!; điều này dễ dàng được nhớ tới bởi những lời than phiền không ngừng của đầu bếp về lũ chuột. Một cách thận trọng, ta tiến đến [ROOT.Char.Custom('GetRoom')] tối tăm đang mở cửa.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], xuất hiện trước mắt, miệng há hốc, đôi mắt lờ đờ, hơi thở [appropriate_child.GetHerHis] nồng nặc mùi [ROOT.Char.Custom('RegionalAlcoholicDrink')] — cùng với những món ăn bị đánh cắp."
  bp2_yearly.1001.desc_hashishiyah: "Một tiếng cười khúc khích vang lên từ [ROOT.Char.Custom('GetRoom')] tưởng như bỏ hoang. Ta tò mò bước vào và phát hiện [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], đang trốn trong một góc.\n\n[appropriate_child.GetSheHe|U] cố kìm nén sự thích thú, nhưng ta #EMP biết#! nụ cười gian xảo đó — chưa kể đôi mắt đỏ ngầu và mùi băm nồng nặc của [appropriate_child.GetHerHis]!"
  bp2_yearly.1001.desc_reclusive: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], đã nhiều ngày không thấy xuất hiện quanh dinh thự. Gia nhân bắt đầu xì xào, họ hàng thì lo lắng, nên ta tiến đến [ROOT.Char.Custom('GetChamber')] của [appropriate_child.GetHerHis].\n\nKhi ta bước vào — suy cho cùng thì #EMP tất cả#! đều là lãnh địa của ta — [appropriate_child.GetFirstNameNoTooltip] quay phắt lại, không chút lễ nghi hay nhã nhặn, khịt mũi bảo ta đi ra và để [appropriate_child.GetHerHim] yên tĩnh."
  bp2_yearly.1001.desc_irritable: "Trên đường từ bữa tối đến nhà xí, ta bắt gặp một [appropriate_child.GetFirstName] đang #EMP cực kỳ#! tức giận.\n\n\"#EMP Đồ [appropriate_child.Custom2('InsultNounClumsy', SCOPE.sC('appropriate_child'))] hỗn xược!#!\" [appropriate_child.GetSheHe] gào lên. \"Ngươi làm bẩn [appropriate_child.Custom('child_object_of_interest')] của ta rồi! Sao không đi mà dìm mình trong thứ [ROOT.Char.Custom('RegionalDrink')] đó luôn đi!?\""
  bp2_yearly.1001.desc_flagellant: "Những [ROOT.Char.Custom('GetDungeonPlural')] của ta vang vọng bởi những tiếng hét đau đớn... #EMP những tiếng hét trẻ thơ#!. Ta vội vã tiến tới.\n\nNheo mắt nhìn, ta thấy thủ phạm chính là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], và... #EMP đó có phải là một trong những chiếc roi của ta không?!#! Ta chết lặng khi [appropriate_child.GetFirstNameNoTooltip] tự làm tổn thương [appropriate_child.GetHerselfHimself] nhân danh [ROOT.Char.GetFaith.HighGodNameAlternate]."
  bp2_yearly.1001.desc_profligate: "Đây đã là lần thứ ba trong vài tuần qua, [appropriate_child.GetFirstName] nài nỉ xin một món đồ chơi đắt tiền mới. Đám người buôn bán bám theo từng bước chân chúng ta từ [ROOT.Char.Custom('FortifiedBuilding')].\n\nĐiều này khiến ta hơi lo lắng. Rốt cuộc thì nếu một ngày nào đó [appropriate_child.GetSheHe] có ngân khố riêng thì sao? Kiểu tiêu xài này...\n\nVà cái gì đây? [appropriate_child.GetSheHe] đã mua đúng cái [ROOT.Char.Custom('GetAccessory')] mà ta từng mua ư?"
  bp2_yearly.1001.desc_improvident: "Trong vài ngày qua, ta nhận thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], đang đem cho đi rất nhiều đồ chơi của [appropriate_child.GetHerHis] cho những đứa trẻ khác.\n\nTrong những khoảnh khắc hiếm hoi giữa dân thường, [appropriate_child.GetSheHe] liên tục thúc giục ta bố thí cho những người ăn xin — và dừng lại khóc thương trước từng câu chuyện khốn khổ của những góa phụ nghèo!"
  bp2_yearly.1001.desc_contrite: "[appropriate_child.GetFirstName] của chúng ta đang đứng trên một cái rương. [appropriate_child.GetSheHe|U] tập hợp một đám trẻ con, kể cho chúng nghe những bí mật tầm thường nhất có thể tưởng tượng. Đổi lại, [appropriate_child.GetSheHe] thuyết phục bọn trẻ thú nhận lỗi lầm của chính mình.\n\n\"C-con lấy miếng [appropriate_child.Custom('FavoriteTreat')] cuối cùng,\" một [dummy_gender.Custom('GirlBoy')] thú nhận, run rẩy. \"Con giết một con chuột!\" một đứa khác thì thầm."
  bp2_yearly.1001.desc_comfort_eater: "Trong lúc sinh hoạt thường ngày, ta nhận ra một điều lạ: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], đang chia sẻ một chỗ trốn cùng cả đống [appropriate_child.Custom('FavoriteTreat')], vừa trốn vừa ăn.\n\nGần đây #EMP đã#! xảy ra khá nhiều chuyện, và [appropriate_child.GetSheHe] #EMP đã#! tròn trịa lên đôi chút..."
  bp2_yearly.1001.desc_inappetetic: "Trong bữa tối, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], lúc nào cũng tỏ ra thiếu kiên nhẫn, ra hiệu cho gia nhân bưng khay tránh xa mình.\n\nCó lẽ [appropriate_child.GetSheHe] chỉ háo hức đi làm việc khác? Hay — nếu ta không tưởng tượng — má [appropriate_child.GetHerHis] đang hơi... tái và gầy đi?"
  bp2_yearly.1001.desc_journaller: "Gần đây có rất nhiều mẩu giấy ghi chép viết tay vương vãi khắp [ROOT.Char.Custom('GetCourt')] của ta. Nguồn gốc của chúng? [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], đang cúi mình trong một [ROOT.Char.Custom('GetChamber')] trống, miệt mài viết theo ý thích.\n\nTa nghĩ đến thói quen viết lách của chính mình, cuốn nhật ký chứa đầy những suy ngẫm cá nhân. Có lẽ ta đã chia sẻ một thói quen đáng giá."
  bp2_yearly.1001.desc_confider: "Gần đây ta nhận thấy một thay đổi nhỏ ở [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName]. [appropriate_child.GetSheHe|U] dành nhiều thời gian hơn với những người bạn thân, thì thầm và cười đùa.\n\nTa thề rằng những [appropriate_child.Custom('GirlBoyPlural')] đó còn biết nhiều về [appropriate_child.GetHerHim] hơn cả ta, và mối liên kết giữa họ dường như rất bền chặt. Những người bạn như vậy, những người bạn đáng tin cậy có thể thẳng thắn trò chuyện, quả thực là một món quà."
  bp2_yearly.1001.desc_athletic: "Bước ra ngoài, những đứa trẻ vụt chạy qua: một đứa rõ ràng nhanh nhẹn và linh hoạt hơn những bạn đồng trang lứa.\n\nĐó chính là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] của ta, [appropriate_child.GetFirstName], đang vượt qua tất cả!\n\nTa mỉm cười khích lệ, ấn tượng trước ý chí và sự kiên trì bất ngờ của [appropriate_child.GetHerHis]. Chẳng bao lâu sau, những người chạy khác lần lượt dừng lại. Niềm tự hào dành cho [appropriate_child.GetFirstNameNoTooltip] bùng cháy trong lòng ta!"
  bp2_yearly.1001.outro_bad: "\n\nTa lảo đảo rời khỏi cảnh tượng đó. Đây là cách #EMP ta#! hành xử sao?"
  bp2_yearly.1001.outro: "\n\nCó lẽ cũng không phải là một thói quen tệ đến thế?"
  bp2_yearly.1001.a: "[appropriate_child.GetFirstNameNoTooltip], lại đây."
  bp2_yearly.1001.a.flavor: "Hãy làm theo lời ta nói, đừng làm theo việc ta làm."
  bp2_yearly.1001.a.flavor_good: "Hành vi này đáng được khuyến khích!"
  bp2_yearly.1001.a.no_trait.t: "Được Uốn Nắn"
  bp2_yearly.1001.a.no_trait.desc: "[appropriate_child.GetFirstNameNoTooltip] từ bỏ thói quen này"
  bp2_yearly.1001.a.trait.t: "Nhận Được Đặc Tính"
  bp2_yearly.1001.a.trait.desc: "[appropriate_child.GetFirstNameNoTooltip] ngày càng sa vào thói quen này"
  bp2_yearly.1001.b: "Ta #EMP đang#! làm cái gì vậy?"
  bp2_yearly.1001.b.flavor: "Ta nên tự cải thiện bản thân."
  bp2_yearly.1001.c: "Ta... không thể đối mặt chuyện này ngay bây giờ."
  bp2_yearly.1001.c_ecc_sadist: "Đúng là [appropriate_child.Custom('GirlBoy')] của ta!"
  bp2_yearly.1001.c_callous: "Ta là ai mà xen vào chứ?"
  bp2_yearly.1001.c.flavor: "Chắc sẽ có người khác xử lý thôi."
  bp2_yearly.1001.c.flavor_ecc_sadist: "Hãy để thân xác #EMP cất tiếng.#!"
  bp2_yearly.1001.c.flavor_callous: "Ai nói nuôi dạy trẻ con là khó?"
 #Child: You notice your parent/guardian performing a stress trait
  bp2_yearly.1005.t: "Trẻ Thấy, Trẻ..."
  bp2_yearly.1005.intro: "Ta đã quan sát [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stressed_adult'))] của mình, [stressed_adult.GetTitledFirstName],"
  bp2_yearly.1005.desc_drunkard: "gần đây thường xuyên uống [ROOT.Char.Custom('RegionalAlcoholicDrink')].\n\nCó lần ta thậm chí còn tìm thấy [stressed_adult.GetHerHim] trong một góc khuất của [stressed_adult.Custom('ResidenceBuilding')], úp mặt xuống một vũng chất lỏng... không rõ nguồn gốc. [stressed_adult.GetSheHe] đã say đến mức mất hết lý trí.\n\nNhưng bất kể vẻ ngoài của [stressed_adult.GetHerHis] có ra sao, [stressed_adult.GetSheHe] dường như #EMP thực sự#! rất bình yên."
  bp2_yearly.1005.desc_hashishiyah: "gần đây thường lén lút đi sử dụng hashishiyah.\n\nCó lần ta thấy [stressed_adult.GetHerHim] nằm dài trên sàn [stressed_adult.GetHerHis] [stressed_adult.Custom('GetChamber')] suốt cả ngày, \"để quan sát trần nhà,\" [stressed_adult.GetSheHe] nói, đôi mắt đờ đẫn.\n\nTrông có vẻ khá thư giãn."
  bp2_yearly.1005.desc_reclusive: "gần đây thường ở khuất tầm mắt trong [stressed_adult.GetHerHis] [stressed_adult.Custom('GetChamber')].\n\nTuần trước, [stressed_adult.GetSheHe] ở lì trong đó nhiều ngày liền, thậm chí còn cho mang bữa ăn tới.\n\nTrông có vẻ khá yên bình, dù việc đó khiến [stressed_adult.GetSheHe] bỏ bê vài sự kiện trong [stressed_adult.Custom('GetCourt')]."
  bp2_yearly.1005.desc_irritable: "gần đây thường xuyên đưa ra những bài giảng nghiêm khắc và nổi giận vì những chuyện nhỏ nhặt.\n\nMột ngày nọ, [stressed_adult.GetSheHe] suýt mắng nhiếc một người hầu chỉ vì người đó trải ga giường của [stressed_adult.GetHerHis] không đúng cách.\n\nTuy nhiên sau đó, [stressed_adult.GetSheHe] dường như lại khá bình thản."
  bp2_yearly.1005.desc_flagellant: "gần đây thường tự gây tổn thương cho chính mình.\n\nMới ngày hôm kia, ta nghe thấy [stressed_adult.GetHerHim] dùng roi đánh vào cơ thể [stressed_adult.GetHerHis] trong khi tụng những câu kinh tôn giáo.\n\nBan đầu điều đó khiến ta sợ hãi — nhưng dường như nó lại giúp tâm trí [stressed_adult.GetHerHis] được thanh thản hơn."
  bp2_yearly.1005.desc_profligate: "gần đây thu thập rất nhiều vật phẩm độc đáo.\n\nMột số người hầu xem những món đồ ấy chỉ là những thứ vụn vặt vô nghĩa và mô tả hành động của [stressed_adult.GetHerHis] là \"ném vàng xuống giếng\".\n\nTa thì không chắc như vậy — [stressed_adult.GetSheHe] dường như thực sự thích sưu tầm những món đồ nhỏ ấy?"
  bp2_yearly.1005.desc_improvident: "gần đây quyên góp rất nhiều vàng cho từ thiện.\n\nTa nhận thấy điều này bị một số người trong triều dị nghị — thậm chí họ còn cho rằng [stressed_adult.GetSheHe] không biết quản lý tiền bạc.\n\nNhưng nếu nó khiến tinh thần [stressed_adult.GetHerHis] tốt hơn, thì chẳng phải là điều tốt sao...?"
  bp2_yearly.1005.desc_contrite: "gần đây thường xuyên thừa nhận và thú nhận những lỗi lầm nhỏ nhặt nhất.\n\nMới ngày hôm kia, [stressed_adult.GetSheHe] thú nhận với một người hầu rằng [stressed_adult.GetSheHe] không thực sự quan tâm nhiều đến trang phục của người đó, và rằng [stressed_adult.GetSheHe] cảm thấy áy náy vì chuyện ấy.\n\nĐiều đó có vẻ hơi vụn vặt, nhưng nếu nó khiến tâm trí [stressed_adult.GetHerHis] được nhẹ nhõm...?"
  bp2_yearly.1005.desc_comfort_eater: "gần đây ăn rất nhiều [stressed_adult.Custom('FavoriteTreat')].\n\nKhông phải chỉ năm hay mười — mà là gấp ba lần, và ta còn nghe gia nhân thì thầm rằng cỡ áo của [stressed_adult.GetHerHis] cần phải nới rộng.\n\nTuy vậy; việc buông thả này dường như cũng giúp xoa dịu [stressed_adult.GetHerHim]..."
  bp2_yearly.1005.desc_inappetetic: "gần đây đôi khi bỏ bữa.\n\nThực ra thì ta không thấy [stressed_adult.GetHerHim] ăn gì kể từ sáng hôm qua. Gia nhân cũng xì xào rằng thợ may đã phải giảm cỡ áo của [stressed_adult.GetHerHis] vào tuần trước.\n\nNhư vậy là xấu sao?"
  bp2_yearly.1005.desc_journaller: "gần đây thường có những vết mực trên ngón tay của [stressed_adult.GetHerHis].\n\n[stressed_adult.GetSheHe|U] không đi đâu mà không mang theo cuốn sách bìa da bên cạnh, liên tục ghi chép.\n\nBỏ qua những vết mực, [stressed_adult.GetSheHe] dường như bình tĩnh và ngăn nắp hơn trước. Điều đó thật... dễ chịu."
  bp2_yearly.1005.desc_confider: "gần đây dường như luôn kề bên người bạn tâm giao [confidant_friend.GetTitledFirstNamePossessive] của [stressed_adult.GetHerHis].\n\nHọ dường như chia sẻ mọi chuyện với nhau, vừa đi cạnh nhau vừa cười khúc khích.\n\nHẳn thật tuyệt khi có thể kể lại mọi điều tốt đẹp lẫn khó khăn trong cuộc sống cho một ai đó."
  bp2_yearly.1005.desc_athletic: "dù nắng hay mưa, gần đây vẫn thường xuyên chạy nhiều vòng quanh khu vực [stressed_adult.Custom('ResidenceBuilding')].\n\nMột số quý tộc trong triều khinh thường mùi mồ hôi còn vương lại sau khi tập luyện; nhưng có vẻ những lời thì thầm chê bai ấy chỉ khiến [stressed_adult.GetHerHim] càng kiên định hơn với quyết tâm của mình.\n\nĐiều đó khiến ta thấy tò mò."
  bp2_yearly.1005.a: "Ta nên thử xem."
  bp2_yearly.1005.a.flavor: "Thì có hại gì đâu...?"
  bp2_yearly.1005.a.stressed.t: "Căng Thẳng"
  bp2_yearly.1005.a.stressed.desc: "Đó #EMP không#! phải là một trải nghiệm dễ chịu"
  bp2_yearly.1005.a.trait.desc: "Ngài #EMP cực kỳ#! thích điều đó"
  bp2_yearly.1005.a.insight.t: "Thấu Hiểu"
  bp2_yearly.1005.a.insight.desc: "Ngài tìm ra một cách tốt hơn"
  bp2_yearly.1005.b: "Tốt hơn là không."
 #Parent/Guardian: Your child gives you a hug
  bp2_yearly.1010.t: "Vô Điều Kiện"
  bp2_yearly.1010.intro: "Khi ta cúi người trên tấm bản đồ trong [ROOT.Char.Custom('GetChamber')] của mình, một tiếng #EMP kẽo kẹt#! bất ngờ khiến ta ngoảnh đầu về phía lối vào. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hugging_child'))] của ta, [hugging_child.GetFirstName], xuất hiện nơi ngưỡng cửa"
  bp2_yearly.1010.desc_toddler: "lẫm chẫm bước đến chỗ ta với tốc độ đáng ngạc nhiên so với độ tuổi của [hugging_child.GetHerHis].\n\n[hugging_child.GetSheHe|U] ôm chặt lấy chân ta, siết vòng tay quanh ta và ngẩng đầu lên nhìn ta."
  bp2_yearly.1010.desc_rambler: "chạy như gió về phía ta, hét lớn #EMP \"Ôôôm!\"#!\n\n[hugging_child.GetSheHe|U] lao tới và vòng tay ôm chặt lấy hông ta."
  bp2_yearly.1010.desc_kid: "bước vào phòng.\n\n[hugging_child.GetSheHe|U] nhìn ta bằng ánh mắt khó đoán trong giây lát, rồi tiến lại gần, ôm chặt lấy ta."
  bp2_yearly.1010.desc_teenager: "lững thững bước vào [ROOT.Char.Custom('GetRoom')], dường như chẳng mấy bận tâm đến sự hiện diện của ta.\n\nRồi không một lời báo trước, ta bị siết chặt trong một cái ôm. [hugging_child.GetSheHe|U] nhanh chóng buông ra, gương mặt lộ rõ vẻ ngượng ngùng."
  bp2_yearly.1010.outro_callous: "\n\nCảm giác ấm áp này trong lồng ngực ta là gì thế này...?"
  bp2_yearly.1010.outro_young: "\n\nTa nhìn [hugging_child.GetHerHim], khóe mắt ẩn hiện giọt lệ trong khi tay ta vuốt ve mái tóc [hugging_child.GetHerHis] để đáp lại cử chỉ ấy."
  bp2_yearly.1010.outro_older: "\n\nTa nhìn [hugging_child.GetHerHim], khóe mắt ẩn hiện giọt lệ trong khi tay ta siết nhẹ bờ vai [hugging_child.GetHerHis] để đáp lại cử chỉ ấy."
  bp2_yearly.1010.a: "Con là một [hugging_child.Custom('GetDaughterSon')] ngoan..."
  bp2_yearly.1010.a_callous: "Ừ, ừ."
  bp2_yearly.1010.a.flavor: "Đừng khóc. ĐỪNG khóc."
  bp2_yearly.1010.a.flavor_callous: "Rồi, buông ta ra đi..."
 #Parent/Guardian: Your child/ward found a pouch of gold while exploring
  bp2_yearly.1015.t: "Đứa Trẻ Vàng"
  bp2_yearly.1015.intro: "Một buổi sáng khi ta đang chuẩn bị cho ngày mới, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('golden_child'))] của ta, [golden_child.GetFirstName], tiến lại gần:"
  bp2_yearly.1015.desc_guardian: "\n\n\"[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip],\""
  bp2_yearly.1015.desc_parent: "\n\n\"[golden_child.Custom2('RelationToMeShort', ROOT.Char)|U],\""
  bp2_yearly.1015.outro: "chúng ta đã tìm thấy thứ này khi khám phá [ROOT.Char.Custom('ResidenceBuilding')] vào hôm qua. Ngài nên giữ nó." [golden_child.GetSheHe] đưa cho ta một chiếc túi đựng tiền nhỏ đã sờn cũ. Nó phát ra tiếng leng keng."
  bp2_yearly.1015.a: "Ta rất cảm kích!"
  bp2_yearly.1015.a.flavor: "Thật là một đứa trẻ dễ mến."
  bp2_yearly.1015.a.flavor_greedy: "Chỉ có vậy thôi sao...?"
  bp2_yearly.1015.b: "Con cứ giữ lấy. Hãy đầu tư nó!"
  bp2_yearly.1015.b.tt: "Điều này sẽ cải thiện thêm [golden_child.GetFirstNamePossessiveNoTooltip] [stewardship|E] [education_focus|E]"
  bp2_yearly.1015.b.tt_matching: "Điều này sẽ cải thiện rất nhiều [golden_child.GetFirstNamePossessiveNoTooltip] [stewardship|E] [education_focus|E]"
 #Parent/Guardian: Your child/ward has found a secret in court
  bp2_yearly.1020.t: "Nơi Cất Giấu Bí Mật"
  bp2_yearly.1020.intro: "Khi ta cúi xuống nhặt một bản kinh để đọc, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('secrety_child'))] của ta, [secrety_child.GetFirstName], xông thẳng vào [ROOT.Char.Custom('GetRoom')], phá vỡ sự tĩnh lặng của ta.\n\n"
  bp2_yearly.1020.desc_guardian: "\"[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip]!\""
  bp2_yearly.1020.desc_parent: "\"[secrety_child.Custom2('RelationToMeShort', ROOT.Char)|U]!\""
  bp2_yearly.1020.desc: "\"Ngài sẽ #EMP không tin nổi#! điều ta phát hiện ra về [secret_keeper.GetTitledFirstName]!\" [secrety_child.GetSheHe|U] dừng lại để lấy hơi, tạo thêm phần kịch tính."
  bp2_yearly.1020.a: "Vậy thì nói mau!"
  bp2_yearly.1020.a.secret.t: "Học Được Bí Mật"
  bp2_yearly.1020.a.tt: "Ngài học được một bí mật về một cận thần"
  bp2_yearly.1020.b: "A-a! Bí mật là tiền tệ đấy, [secrety_child.Custom('GirlBoy')] yêu quý!"
  bp2_yearly.1020.b.tt: "Điều này sẽ cải thiện thêm [secrety_child.GetFirstNamePossessiveNoTooltip] [intrigue|E] [education_focus|E]"
  bp2_yearly.1020.b.tt_matching: "Điều này sẽ cải thiện rất nhiều [secrety_child.GetFirstNamePossessiveNoTooltip] [intrigue|E] [education_focus|E]"
 #Parent: Your child does not have the same educational trait as you. Change?
  bp2_yearly.1030.t: "Quả Táo Rơi"
  bp2_yearly.1030.desc: "Gần đây ta suy ngẫm về việc giáo dục [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('focus_child'))] của mình, [focus_child.GetFirstName] — liệu [focus_child.Custom('GetChildEducationFocus')] có thực sự là hướng đi phù hợp?\n\nĐược rèn luyện trong lĩnh vực [ROOT.Char.Custom('education_focus')] từ trước, ta nhận thấy kiến thức đó đã phục vụ ta rất tốt.\n\nChắc hẳn nó cũng nên làm điều tương tự cho [focus_child.GetHerHim]?"
  bp2_yearly.1030.a: "Uốn nắn [focus_child.GetHerHim] theo hình mẫu của ta."
  bp2_yearly.1030.a.tt_change: "[focus_child.GetFirstNamePossessiveNoTooltip] [education_focus|E] chuyển sang [THIS.Char.Custom('GetEducationTraitConcept')]"
  bp2_yearly.1030.a.tt_tutor: "Ngài đích thân dạy dỗ [focus_child.GetFirstNameNoTooltip] để bù đắp phần giáo dục bị thiếu"
  bp2_yearly.1030.b: "Một bộ kỹ năng đa dạng chỉ mang lại lợi ích."
  bp2_yearly.1030.b.tt: "Điều này sẽ cải thiện thêm [focus_child.GetFirstNamePossessiveNoTooltip] [focus_child.Custom('GetEducationTraitConcept')] [education_focus|E]"
 #Parent/Guardian: Your child/ward has a rock collection
  bp2_yearly.1035.t: "Viên Ngọc Chưa Mài"
  bp2_yearly.1035.desc: "Trong một buổi học tại [ROOT.Char.Custom('GetChamber')] của [rock_child.GetFirstNamePossessive], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rock_child'))] của ta, ta nhận thấy một số lượng đá đáng kinh ngạc được trưng bày ngay ngắn trên một chiếc kệ.\n\nMột trong những viên đá nổi bật giữa bộ sưu tập — bề ngoài khá thô ráp, nhưng khi quan sát kỹ hơn, ta thấy bên trong nó chứa một sắc đỏ rực rỡ và sâu thẳm.\n\n[rock_child.GetFirstNameNoTooltip] nhận ra sự thích thú của ta khi [rock_child.GetSheHe] nhặt nó lên và đưa cho ta: \"Ngài có thể giữ nó,\" "
  bp2_yearly.1035.desc_guardian: "[ROOT.Char.Custom('MistressMaster')] [ROOT.Char.GetFirstNameNoTooltip].\""
  bp2_yearly.1035.desc_parent: "[rock_child.Custom2('RelationToMeShort', ROOT.Char)].\""
  bp2_yearly.1035.a: "Ồ. Cảm ơn con."
  bp2_yearly.1035.a.flavor: "Đó là... một viên ngọc sao?"
  gemstone_trinket_rough: "Đá Quý Thô"
  gemstone_trinket_rough.desc: "Một viên đá quý thô được [rock_child.GetTitledFirstNameNoTooltip] khai quật ở khu vực gần [trinket_location.GetNameNoTooltip]."
  gemstone_trinket_modest: "Đá Quý Bình Thường"
  gemstone_trinket_modest.desc: "Một viên đá quý tinh xảo được [rock_child.GetTitledFirstNameNoTooltip] khai quật ở khu vực gần [trinket_location.GetNameNoTooltip]."
  gemstone_trinket_brilliant: "Đá Quý Rực Rỡ"
  gemstone_trinket_brilliant.desc: "Một viên đá quý lấp lánh được [rock_child.GetTitledFirstNameNoTooltip] khai quật ở khu vực gần [trinket_location.GetNameNoTooltip]."
  bp2_yearly.1035.b: "Con nên nghiên cứu viên đá đó, nhóc."
  bp2_yearly.1035.b.tt: "Điều này sẽ cải thiện thêm [rock_child.GetFirstNamePossessiveNoTooltip] [learning|E] [education_focus|E]"
  bp2_yearly.1035.b.tt_matching: "Điều này sẽ cải thiện rất nhiều [rock_child.GetFirstNamePossessiveNoTooltip] [learning|E] [education_focus|E]"
 #Parent/Guardian: Your child/ward has a text about martial arts
  bp2_yearly.1040.t: "Ngòi Bút Quyền Lực"
  bp2_yearly.1040.desc: "Khi nhặt những thanh kiếm gỗ bọc đệm lên để đấu tập cùng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sparring_child'))] [sparring_child.GetFirstName], Ta để ý thấy một cuốn sổ rách nát bị vứt sang một bên.\n\nNhìn từ bìa, có vẻ nó ghi chép các bài tập và những phương pháp tốt nhất liên quan đến võ thuật.\n\n[sparring_child.GetFirstNameNoTooltip] liếc nhìn Ta: \"Ồ. Thứ đó à — Ta chủ yếu đọc vì hình minh họa thôi. Ngài có thể mượn.\""
  bp2_yearly.1040.a: "Thú vị thật."
  bp2_yearly.1040.a.flavor: "\"Nắm chuôi kiếm, đừng nắm đầu nhọn.\" Hừm."
  bp2_yearly.1040.b: "Chúng ta nên thử áp dụng!"
  bp2_yearly.1040.b.tt: "Điều này sẽ giúp phát triển thêm [martial|E] [education_focus|E] của [sparring_child.GetFirstNamePossessiveNoTooltip]"
  bp2_yearly.1040.b.tt_matching: "Điều này sẽ giúp phát triển mạnh mẽ [martial|E] [education_focus|E] của [sparring_child.GetFirstNamePossessiveNoTooltip]"
#Parent/Guardian: There is a brawl among some children
  bp2_yearly.1045.t: "Nhà Hòa Giải"
  bp2_yearly.1045.intro: "Trong lúc dạo bộ buổi chiều trên đường phố [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('diplomacy_child'))] [diplomacy_child.GetFirstName] chạy đến chỗ Ta:"
  bp2_yearly.1045.desc_guardian: "$bp2_yearly.1020.desc_guardian$"
  bp2_yearly.1045.desc_parent: "\"[diplomacy_child.Custom2('RelationToMeShort', ROOT.Char)|U]!\""
  bp2_yearly.1045.desc: "Chúng vừa bắt đầu lao vào đánh nhau thì...\"\n\n[diplomacy_child.GetSheHe|U] bị cắt ngang bởi một tiếng thét chói tai, khiến cả hai chúng Ta quay sự chú ý về cuộc ẩu đả dưới phố.\n\nNhững kẻ tham chiến dường như là hai cậu nhóc trẻ thuộc #EMP triều đình của ta#! [ROOT.Char.Custom('GetCourt')], đang xoay vòng quanh nhau để chuẩn bị cho một trận nữa."
  bp2_yearly.1045.a: "#EMP Dừng lại ngay, cả hai đứa.#!"
  bp2_yearly.1045.a.perk.t: "Nhận Được Perk"
  bp2_yearly.1045.a.flavor: "Đánh nhau; #EMP ngay trong sân nhà mình#!..."
  bp2_yearly.1045.b: "#EMP Hấp dẫn thật#!! Ta muốn đặt cược vào..."
  bp2_yearly.1045.b.flavor: "Đứa kia trông khá dữ."
  bp2_yearly.1045.b.win.t: "Chiến Thắng"
  bp2_yearly.1045.b.win.desc: "Võ sĩ của Ngài chiến thắng"
  bp2_yearly.1045.b.loss.t: "Thất Bại"
  bp2_yearly.1045.b.loss.desc: "Võ sĩ của Ngài thua cuộc"
  bp2_yearly.1045.c: "[diplomacy_child.GetFirstNameNoTooltip], giúp chúng hòa giải đi."
  bp2_yearly.1045.c.tt: "Điều này sẽ giúp phát triển thêm [diplomacy|E] [education_focus|E] của [diplomacy_child.GetFirstNamePossessiveNoTooltip]"
  bp2_yearly.1045.c.tt_matching: "Điều này sẽ giúp phát triển mạnh mẽ [diplomacy|E] [education_focus|E] của [diplomacy_child.GetFirstNamePossessiveNoTooltip]"
 #The tide/sandstorm is ruining your sandcastle!
  bp2_yearly.1050.t_builder: "Người Xây Dựng"
  bp2_yearly.1050.t: "$bp2_yearly.1050.t_builder$: Lâu Đài Cát Giữa Biển Cát"
  bp2_yearly.1050.t_twig: "$bp2_yearly.1050.t_builder$: Cơn Bão Đang Kéo Đến"
  bp2_yearly.1050.desc: "Lâu đài cát hùng vĩ vươn cao trên bãi biển, khi Ta đã dành cả buổi chiều để chạm khắc từng chi tiết nhỏ trong lớp cát ướt và thô ráp.\n\nThế nhưng, thời gian không ngừng trôi, và thủy triều cũng vậy, mỗi giây trôi qua nó lại tiến gần hơn tới kiệt tác bùn đất của Ta, gặm nhấm phần chân móng.\n\nTa tuyệt vọng trừng mắt nhìn con nước, cố tìm cách bảo đảm an toàn cho lâu đài trước khi buộc phải rút lui."
  bp2_yearly.1050.desc_desert: "Gia nhân đã mang nước đến cho lâu đài cát sa mạc hùng vĩ của Ta suốt cả ngày, trong khi mặt trời không thương tiếc thiêu đốt lưng chúng Ta.\n\nTa khắc nốt chi tiết cuối cùng trên tòa tháp cao nhất thì nhận ra một cơn bão cát đang tiến đến nơi chân trời.\n\nTrán Ta lập tức nhíu lại, khi cố nghĩ cách bảo vệ lâu đài khỏi cơn bão sắp tới trước khi rút lui."
  bp2_yearly.1050.desc_twig: "Mô hình lâu đài tráng lệ Ta làm từ cành cây và đá nhỏ thực sự toát lên vẻ uy nghi.\n\nKhi Ta đặt những nét hoàn thiện cuối cùng lên tháp cao nhất, mưa bắt đầu trút xuống khi cơn bão ủ sẵn nơi chân trời cuối cùng cũng ập tới.\n\nTa tuyệt vọng liếc nhìn cơn bão, cuống cuồng tìm cách bảo vệ công trình của mình trước khi rút lui."
  bp2_yearly.1050.a: "Ta sẽ hối lộ thủy triều bằng những viên sỏi sáng bóng này!"
  bp2_yearly.1050.a.flavor: "Ta thực sự rất thích mấy viên sỏi này; nhưng vì mục đích cao cả."
  bp2_yearly.1050.a_twig: "Ta sẽ hối lộ cơn bão bằng những viên đá lấp lánh này!"
  bp2_yearly.1050.a.flavor_twig: "Ta thực sự rất thích mấy viên đá này; nhưng vì mục đích cao cả."
  bp2_yearly.1050.b: "Ta nên gia cố các bức tường bên ngoài."
  bp2_yearly.1050.b.flavor: "#EMP Ta#! luôn cảm thấy an toàn khi có tường thành."
  bp2_yearly.1050.c: "Một ngôi đền nhỏ ở quảng trường chính là đủ."
  bp2_yearly.1050.c.flavor: "[ROOT.Char.GetFaith.HighGodNameAlternate] chắc chắn sẽ bảo hộ nó!"
 #Follow-up: Curse you, tide!
  bp2_yearly.1051.t: "$bp2_yearly.1050.t_builder$: Cát Dịch Chuyển"
  bp2_yearly.1051.t_twig: "$bp2_yearly.1050.t_builder$: Những Gì Còn Sót Lại"
  bp2_yearly.1051.desc: "Ngày hôm sau khi quay lại bãi biển, Ta vội vàng chạy đến nơi mà chỉ một ngày trước đó lâu đài hùng vĩ của Ta còn sừng sững trên cát ướt."
  bp2_yearly.1051.desc_desert: "Khi cơn bão tan đi vào ngày hôm sau, Ta vội chạy đến nơi mình đã cẩn thận xây dựng lâu đài cát hùng vĩ chỉ mới ngày hôm trước."
  bp2_yearly.1051.desc_twig: "Vào lúc rạng đông sớm, cơn bão cuối cùng cũng dịu xuống, và Ta lao vào bụi rậm để xem xét thiệt hại gây ra cho lâu đài cành cây tráng lệ của mình."
  bp2_yearly.1051.outro: "\n\nHầu hết mọi thứ đã biến mất, nhưng vẫn còn một phần đứng vững — tòa tháp cao nhất, với phù hiệu nhỏ Ta đã cẩn thận khắc cho riêng mình. #EMP Thành công.#!\n\nDưới chân nó, Ta tìm thấy một viên đá óng ánh nhỏ, bị chôn nửa trong đất. Có thể Ta đang tưởng tượng, nhưng khi nhìn kỹ hơn, Ta mơ hồ nhận ra hình dạng của một chiếc... búa nhỏ?"
  bp2_yearly.1051.a: "Ngươi thắng #EMP lần này#!, thủy triều."
  bp2_yearly.1051.a_twig: "Ngươi thắng #EMP lần này#!, cơn bão."
  iridescent_stone_trinket: "Viên Đá Óng Ánh"
  iridescent_stone_trinket.desc: "Viên đá óng ánh mịn màng được tìm thấy tại [ROOT.Char.GetCurrentLocation.GetName] có một vết sẫm màu hình chiếc búa nhỏ ở một bên. Thật kỳ lạ."
 #You are challenged to a den-building competition
  bp2_yearly.1055.t: "$bp2_yearly.1050.t_builder$: Và Rồi Hang Được Dựng Nên..."
  bp2_yearly.1055.desc: "Cả ngày hôm đó trôi qua với những trò chơi ngoài trời — nói chung là một ngày khá dễ chịu — thì đột nhiên Ta được tiếp cận bởi"
  bp2_yearly.1055.desc_related: "my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))], [den_challenger.GetTitledFirstName]: \"Ta thách ngươi thi xây hang trú ẩn, [den_challenger.Custom2('RelationToMeShort', ROOT.Char )]!\""
  bp2_yearly.1055.desc_relations: "my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))], [den_challenger.GetTitledFirstName]: \"Ta thách ngươi thi xây hang trú ẩn, [ROOT.Char.GetFirstNameNoTooltip]!\""
  bp2_yearly.1055.desc_liege: "một đứa trẻ địa phương: \"Ta là [den_challenger.GetTitledFirstName], và ta thách ngươi thi xây hang trú ẩn, [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]!\""
  bp2_yearly.1055.outro: "\n\n[den_challenger.GetSheHe|U] bước đi phô trương và cười nhếch mép đầy đắc thắng về phía Ta, hoàn toàn tin rằng mình sẽ thắng."
  bp2_yearly.1055.a: "Để ta thuê thêm vài người giúp việc..."
  bp2_yearly.1055.a.flavor: "Không gọi là gian lận nếu đã trả tiền."
  bp2_yearly.1055.b: "Chúng ta có thể xây một cái hang vững chắc hơn #EMP cùng nhau!#!"
  bp2_yearly.1055.b.flavor: "Với những bức tường cao."
  bp2_yearly.1055.c: "Ta đang bận dựng bàn thờ này. Đi chỗ khác đi."
  bp2_yearly.1055.c.flavor: "[ROOT.Char.GetFaith.HighGodName] là kẻ duy nhất có quyền phán xét #EMP công trình của ta#!."
 #Follow-up: Things went down in the woods
  bp2_yearly.1056.t_economy: "$bp2_yearly.1050.t_builder$: ... Nhiều"
  bp2_yearly.1056.t_martial: "$bp2_yearly.1050.t_builder$: ... Hai"
  bp2_yearly.1056.t_pious: "$bp2_yearly.1050.t_builder$: ... Ướt Sũng"
  bp2_yearly.1056.desc_economy: "Huy động đám trẻ địa phương và trả công cho chúng bằng [ROOT.Char.Custom('RegionalRootVegetablePlural')] đã mang lại hiệu quả kỳ diệu, giúp xây dựng chiếc hang lộng lẫy nhất phía này của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\n[den_challenger.GetTitledFirstName|U] miễn cưỡng liếc nhìn công trình của Ta rồi càu nhàu khi cái hang đơn sơ một-[den_challenger.GetWomanMan] của [den_challenger.GetHerHis] chỉ vừa đủ ngăn mưa."
  bp2_yearly.1056.desc_martial: "[den_challenger.GetTitledFirstName] khỏe hơn Ta tưởng, và giữa hai chúng Ta, một cái hang chắc chắn và vững vàng được dựng lên — vừa kịp lúc bầu trời mở ra và trút xuống một cơn mưa lớn.\n\nNhững tia sét xé toạc bầu trời; nhưng không tia nào đánh trúng khi chúng Ta được bảo vệ bởi các bức tường của hang.\n\nNgồi bên trong nơi trú ẩn, khô ráo và an toàn nhờ công sức của mình, Ta không khỏi suy ngẫm về giá trị của sự đoàn kết và tình đồng đội."
  bp2_yearly.1056.desc_pious: "Khi Ta đặt cây gậy cũ lên đỉnh bàn thờ, mưa bắt đầu trút xuống dữ dội, buộc chúng Ta phải tìm chỗ trú. Một tia sét khổng lồ từ bầu trời giáng thẳng xuống bàn thờ với tiếng *RẦM* vang dội, và Ta vội chạy tới để kiểm tra thiệt hại.\n\nKhi bàn thờ hiện ra trước mắt, một làn khói mờ bốc lên từ cây gậy, một đầu bị cháy đen và hằn rõ dấu vết của cú đánh.\n\nTa quan sát cẩn thận khi nhặt nó lên. Nó vẫn còn ấm trong tay."
  bp2_yearly.1056.a_economy: "Việc làm quả thực là #EMP gốc rễ#! của sự thịnh vượng."
  bp2_yearly.1056.a_martial: "Liên minh là một hàng phòng thủ tuyệt vời. Và cả tường thành nữa."
  bp2_yearly.1056.a_pious: "Đây hẳn là một dấu hiệu từ [ROOT.Char.GetFaith.HighGodNameAlternate]!"
  holy_stick: "Gậy Thánh"
  holy_stick.desc: "Được tạo ra trong một cú sét đánh tại [ROOT.Char.GetCurrentLocation.GetName]. Một vết cháy đen hình chiếc búa đánh dấu phần chuôi."
 #Appreciate the architecture of your capital
  bp2_yearly.1060.t: "$bp2_yearly.1050.t_builder$: Khung Cảnh Đáng Nhớ"
  bp2_yearly.1060.desc: "Không có kế hoạch gì cho ngày hôm nay, đây là cơ hội tuyệt vời để Ta mở mang hiểu biết về nhiều khía cạnh của lãnh địa huy hoàng của chúng ta, [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName].\n\nCâu hỏi là điều gì sẽ mang lại lợi ích lớn nhất — Ta nên đến khu quân sự do [martial_character.GetTitledFirstName] quản lý, khu thương mại do [steward_character.GetTitledFirstName] điều hành, hay ghé thăm [learned_character.GetTitledFirstName] tại [ROOT.Char.GetFaith.HouseOfWorship] địa phương?"
  economical_architecture_book: "Kiến Trúc Thương Mại"
  economical_architecture_book_desc: "Biên niên sử về lịch sử các cảng thương mại và vị trí của chúng."
  martial_architecture_book: "Lâu Đài Và Những Người Phục Vụ"
  martial_architecture_book_desc: "Biên niên sử về nghệ thuật xây dựng lâu đài."
  religious_architecture_book: "Dei Gratia"
  religious_architecture_book_desc: "Một tập ghi chép được biên soạn công phu về những nơi thờ phụng nổi bật tại [ROOT.Char.GetCurrentLocation.GetCounty.GetName] và vùng lân cận."
  bp2_yearly.1060.a: "[steward_character.GetTitledFirstNameNoTooltip] có vẻ rất am hiểu."
  bp2_yearly.1060.a.flavor: "Điều gì làm nên một trung tâm thương mại tốt?"
  bp2_yearly.1060.b: "Ta nên kiểm tra hệ thống phòng thủ tại doanh trại."
  bp2_yearly.1060.b.flavor: "Phòng thủ tốt là tấn công tốt nhất. ... khoan đã."
  bp2_yearly.1060.c: "Đức tin là trên hết. Đến [ROOT.Char.GetFaith.HouseOfWorship] thôi."
  bp2_yearly.1060.c.flavor: "Làm sao để chúng ta xây dựng bản thân gần hơn với [ROOT.Char.GetFaith.HighGodNameAlternate]?"
 #Follow-up: You spend the day with WhatsTheirFace
  bp2_yearly.1061.t: "$bp2_yearly.1050.t_builder$: Trước Hoàng Hôn"
  bp2_yearly.1061.desc_steward: "Chúng Ta dành cả ngày đi qua các hội quán phường hội, xem xét cách bố trí thợ thủ công so với khu chợ của họ và các khía cạnh kinh tế khác của việc xây dựng đô thị.\n\n[architecture_character.GetTitledFirstName|U] là một người hướng dẫn am hiểu, nói về thuế má và lệ phí, phác họa nên bức tranh về tình hình kinh tế hiện tại của chúng Ta."
  bp2_yearly.1061.desc_martial: "Cả ngày được dành để kiểm tra các trang bị quân sự của [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName], những điểm mạnh — và cả — những điểm yếu của nó.\n\nMột chuỗi chỉ mạnh bằng mắt xích yếu nhất của nó, [architecture_character.GetTitledFirstName] cứ lặp lại trong suốt chuyến đi, và Ta thấy điều đó hoàn toàn đúng."
  bp2_yearly.1061.desc_religion: "Thật khó để nhớ ra một ngày nào thanh thản và yên bình hơn, khi [architecture_character.GetTitledFirstName|U] và Ta tản bộ qua các [ROOT.Char.GetFaith.HouseOfWorshipPlural] và đền thờ của [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName].\n\nCó lúc, [architecture_character.GetSheHe] quay sang Ta và nói: \"Một mái vòm được xây dựng tốt có thể gợi lên một dạng linh thiêng nhất định — ngài không nghĩ vậy sao?\""
  bp2_yearly.1061.outro: "\n\n[architecture_character.GetSheHe|U] kết thúc chuyến tham quan bằng cách trao cho Ta [book_to_get.GetName], một cuốn sách đã sờn cũ về chủ đề này."
  bp2_yearly.1061.a: "Hôm nay quả là một ngày tốt đẹp."
  bp2_yearly.1061.a.flavor: "Ta đã học được rất nhiều."
 #Your input is desired on the next building target
  bp2_yearly.1065.t: "$bp2_yearly.1050.t_builder$: Khu Sinh Hoạt Chung"
  bp2_yearly.1065.intro_parent: "Đã đến lúc thay thế khu sinh hoạt chung của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName], và [current_regent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] của ta, đã yêu cầu ta cho ý kiến."
  bp2_yearly.1065.intro_regent: "Đã đến lúc thay thế khu sinh hoạt chung của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName], và [current_regent.GetTitledFirstName], [ROOT.Char.GetDiarchTitle|l] của ta, đã yêu cầu ta cho ý kiến."
  bp2_yearly.1065.intro: "Đã đến lúc thay thế khu sinh hoạt chung của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName], và ta được yêu cầu đưa ra ý kiến."
  bp2_yearly.1065.desc_parent_mayor: "\n\nNgười cai trị của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip], [province_holder.GetTitledFirstName], và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] của ta đã tranh luận căng thẳng suốt cả buổi sáng và giờ đây rơi vào bế tắc."
  bp2_yearly.1065.desc_parent: "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] của ta và vị kiến trúc sư trưởng của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] đã tranh cãi nảy lửa cả buổi sáng, và giờ đây rơi vào bế tắc."
  bp2_yearly.1065.desc_regent_mayor: "\n\nNgười cai trị của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip], [province_holder.GetTitledFirstName], và [current_regent.GetFirstNameNoTooltip] đã tranh luận căng thẳng suốt cả buổi sáng và giờ đây rơi vào bế tắc."
  bp2_yearly.1065.desc_regent: "\n\n[current_regent.GetFirstNameNoTooltip] và vị kiến trúc sư trưởng của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] đã tranh cãi nảy lửa cả buổi sáng, và giờ đây rơi vào bế tắc."
  bp2_yearly.1065.desc_mayor: "\n\nNgười cai trị của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip], [province_holder.GetTitledFirstName], và vị kiến trúc sư trưởng của [province_holder.GetHerHis] đã tranh luận căng thẳng suốt cả buổi sáng và giờ đây rơi vào bế tắc."
  bp2_yearly.1065.desc: "\n\nVị kiến trúc sư trưởng và viên quản lý hậu cần của [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] đã đối đầu gay gắt suốt cả buổi sáng về việc những cải tiến mới nên là gì, và các cuộc tranh luận giờ đã rơi vào bế tắc."
  bp2_yearly.1065.outro: "\n\nKhi ta bước vào phòng, họ liền chuyển sự chú ý sang ta, rõ ràng đang chờ đợi câu trả lời cho vấn đề này."
  bp2_yearly.1065.a: "Chúng ta nên tập trung vào thương mại và sản xuất."
  bp2_yearly.1065.a.flavor: "Một nền kinh tế hưng thịnh sẽ có lợi cho tất cả."
  bp2_yearly.1065.b: "Khu đất này cần thêm sức mạnh quân sự."
  bp2_yearly.1065.b.flavor: "Một chút bạo lực có thể giải quyết mọi vấn đề."
  bp2_yearly.1065.c: "Thêm lòng mộ đạo sẽ chỉ mang lại lợi ích."
  bp2_yearly.1065.c.flavor: "Đức tin là tất cả những gì chúng ta cần."
  bp2_yearly.1065.c.tt: "#X Điều này sẽ thay đổi [holding_type|E] cũng như loại bỏ mọi công trình không hợp lệ tại [1065_province_for_building.GetName]#!"
 #All of our efforts have culminated into _this_
  bp2_yearly.1070.t: "$bp2_yearly.1050.t_builder$: Bản Chất Của Mái Vòm"
  bp2_yearly.1070.intro: "Tất cả những năm tháng ta dành để nghiên cứu nghệ thuật xây dựng — từ việc dựng những lâu đài giả khi còn nhỏ, làm lán ngoài thiên nhiên, nghiên cứu kiến trúc vĩ đại của [sightseed_capital.GetName] và cố vấn cho việc mở rộng [constructed_building_in.GetName], cùng nhiều điều khác — đều đã dẫn ta đến khoảnh khắc này."
  bp2_yearly.1070.desc: "\n\nĐã đến lúc ta ghi dấu ấn của mình lên thế giới bằng cách khai lập một thái ấp mới tại tỉnh [1070_province_to_build_in.GetName]; và chính ta sẽ quyết định phương hướng của nó."
  bp2_yearly.1070.desc_no_province: "\n\n[1070_province_to_buff.GetName] cần được chỉnh sửa đôi chút, và ta sẽ áp dụng kiến thức của mình để cải thiện thái ấp hiện tại."
  bp2_yearly.1070.desc_no_province_no_buff: "\n\nVà trong khi lãnh địa của ta hoàn hảo và không cần thêm bất kỳ công việc hay chỉnh sửa nào; ta vẫn bị dằn vặt bởi câu hỏi lẩn khuất trong tâm trí — bản chất của xây dựng nằm ở đâu? Kinh tế? Đức tin?"
  bp2_yearly.1070.a: "Một thành thị sẽ là lựa chọn hợp lý."
  bp2_yearly.1070.a_buff: "Điều chỉnh theo hướng thương mại là một ý hay."
  bp2_yearly.1070.a_none: "Xây dựng vì kinh tế; rồi họ sẽ tìm đến."
  bp2_yearly.1070.a.flavor: "Chúng ta sẽ xây dựng một trung tâm kinh tế phồn thịnh!"
  bp2_yearly.1070.a.flavor_none: "Một túi tiền nặng có thể giải quyết mọi vấn đề."
  bp2_yearly.1070.b: "Thêm các lâu đài mới là con đường của tương lai."
  bp2_yearly.1070.b_buff: "Phòng thủ là sự bảo đảm tốt nhất cho thịnh vượng."
  bp2_yearly.1070.b_none: "Những bức tường sẽ gắn kết dân chúng."
  bp2_yearly.1070.b.flavor: "Với những bức tường tráng lệ."
  bp2_yearly.1070.b.flavor_none: "... và ngăn chặn những vật thể bay lạc."
  bp2_yearly.1070.c: "[ROOT.Char.GetFaith.HighGodName] ban cho sự phát triển."
  bp2_yearly.1070.c.flavor: "Thái ấp này sẽ được hiến dâng cho [ROOT.Char.GetFaith.HighGodNameAlternate]."
  bp2_yearly.1070.c.flavor_none: "Quả thực là vậy."
 #Follow-up: Get the sweet sweet loo... I mean, sweet sweet effects!
  bp2_yearly.1071.t_city: "Người Xây Dựng Thành Thị"
  bp2_yearly.1071.t_castle: "Người Xây Dựng Lâu Đài"
  bp2_yearly.1071.t_temple: "Người Xây Dựng Đền Thờ"
  bp2_yearly.1071.desc_city: "Sự nhộn nhịp của khu chợ được quy hoạch tỉ mỉ hòa quyện liền mạch vào các khu thủ công, rồi tiếp nối sang các thương quán chuyên vận chuyển và tiếp nhận hàng hóa từ phương xa."
  bp2_yearly.1071.desc_castle: "Những tòa tháp lấp lánh dưới nắng sớm; các bức tường uy nghi giữ mọi kẻ tấn công ngoài tầm với."
  bp2_yearly.1071.desc_temple: "Một minh chứng cho [ROOT.Char.GetFaith.HighGodNameAlternate] — những mái vòm toát lên vẻ linh thiêng; các bức tường có nền móng vững chắc, cũng như đức tin của chúng ta."
  bp2_yearly.1071.outro: "\n\n[constructed_holding.GetName] thực sự là một công trình tráng lệ, và sẽ được ghi vào lịch sử như khởi đầu đầy hứa hẹn của một tài năng kiến trúc mới — chính là ta."
  bp2_yearly.1071.a: "Như vậy là đủ."
  bp2_yearly.1071.a.flavor: ""
 #Clean up: You dun messed up, son
  bp2_yearly.1072.t: "$bp2_yearly.1050.t_builder$: Kẻ Xây Dựng Những Giấc Mơ Tan Vỡ"
  bp2_yearly.1072.desc: "Ta... ta... không rõ chuyện gì đã xảy ra. Công trình dự kiến xây dựng tại [cancelled_holding.GetName] đã dần lụi tàn và không còn tồn tại nữa."
  bp2_yearly.1072.a: "Thôi vậy."

