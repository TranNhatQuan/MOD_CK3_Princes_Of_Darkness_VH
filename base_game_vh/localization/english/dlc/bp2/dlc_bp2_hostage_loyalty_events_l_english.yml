l_english:
  bp2_yearly.8050.t: "Ta là ai?"
  bp2_yearly.8050.desc.intro: "Hôm nay ta thấy [hostage.GetName] trông đầy u sầu và trầm tư, ánh mắt nhìn xuống những con người phía dưới.\n\nTa tiến lại, đặt tay lên bờ vai rũ xuống của [hostage.GetHerHis], rồi hỏi điều gì đang đè nặng trong tâm trí [hostage.GetHerHis].\n\n\"Ôi [ROOT.Char.Custom('GetAuntUncle')],"
  bp2_yearly.8050.desc.mid.friendship: "người còn là một người Ngài với con hơn bất kỳ ai ở nơi mà con từng gọi là quê nhà.\""
  bp2_yearly.8050.desc.mid.childhood_friendship: "[hostage_friend.GetFirstName] còn là một người Ngài với con hơn bất kỳ ai ở nơi mà con từng gọi là quê nhà.\""
  bp2_yearly.8050.desc.mid.hatred: "[hated_parent.Custom2('MyCharacterIntroduction', SCOPE.sC('hostage'))] đúng là một [hated_parent.Custom2('InsultAdjective', SCOPE.sC('hostage'))] [hated_parent.Custom2('InsultNoun', SCOPE.sC('hostage'))] thực thụ, và con không thể chịu nổi ý nghĩ phải quay về với [hated_parent.GetHerHim].\""
  bp2_yearly.8050.desc.mid.culture: "Con đơn giản là không còn gắn bó với văn hóa [hated_parent.GetCulture.GetName] nữa, và con cảm thấy mình sẽ như kẻ xa lạ đối với [hated_parent.GetMotherFather] của mình. Con thấy bản thân thoải mái hơn rất nhiều với những phong tục [hostage.GetCulture.GetName] mà con đã học được ở đây.\""
  bp2_yearly.8050.desc.mid.faith: "[hated_parent.GetMotherFather] của con là một tín đồ [hated_parent.GetFaith.GetAdherentName], còn con là một [hostage.GetFaith.GetAdherentName]. Sao con có thể tự gọi mình là [hostage.Custom('GetDaughterSon')] của [hated_parent.GetHerHis] khi niềm tin của chúng ta đối nghịch nhau đến vậy?\""
  bp2_yearly.8050.desc.mid.traits: "Con chỉ cảm thấy rằng con có nhiều điểm chung với mọi người ở đây hơn là với những người ở nơi mà con từng gọi là quê nhà.\""
  bp2_yearly.8050.desc.outro: "Ta không khỏi tự hỏi, ta là ai? Một người của [hostage.GetHouse.GetName|U] hay của [ROOT.Char.GetHouse.GetName]?"
  bp2_yearly.8050.a: "\"Dĩ nhiên rồi, ta là [ROOT.Char.Custom('GetAuntieUncle')] của con.\""
  bp2_yearly.8050.b: "\"Con chỉ là con tin, không hơn không kém.\""
  bp2_yearly.8051.t: "Những bức thư tai hại"
  bp2_yearly.8051.desc: "Ta bước vào phòng ngủ của [hostage.GetFirstNamePossessive], nhưng không thấy [hostage.GetHerHim] đâu. Tuy nhiên, rải rác trên bàn viết của [hostage.GetHerHis], ta phát hiện một chồng thư viết dở, được gửi đến [hostage.GetHomeCourt.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nNhững bức thư chứa đầy chi tiết về triều đình của ta: các nơi ẩn náu, ai cung cấp bữa ăn cho ta, và tên những kẻ hầu bất mãn có khả năng phản bội. Ta quay lại và thấy [hostage.GetFirstNameNoTooltip] đứng sững ở ngưỡng cửa, như một con thú bị săn đuổi ngay trước khi bỏ chạy."
  bp2_yearly.8051.a: "\"Ôi [hostage.Custom('GetNieceNephew')], mọi chuyện đều được tha thứ.\""
  bp2_yearly.8051.b: "\"Con sẽ không bao giờ được viết thư về nhà nữa.\""
  bp2_yearly.8051.c: "\"Con sẽ không bao giờ rời khỏi căn phòng này nữa!\""
  invalidates_hostage_tt: "[hostage.GetFirstName|U] sẽ không còn là con tin của Ngài nữa"
  bp2_yearly.8052.t: "Bắt nạt"
  bp2_yearly.8052.desc: "Sân trong tràn ngập những âm thanh quen thuộc của tiếng chạy nhảy và la hét, khi bọn trẻ trong triều đang vui chơi. Bất chấp sự ồn ào, khung cảnh lại yên bình lạ thường, cho đến khi những tiếng kêu đau đớn của [hostage.GetFirstName] khiến ta phải can thiệp.\n\n\"Dừng lại! Dừng lại đi! [ROOT.Char.GetFirstNameNoTooltip], [mean_child.GetFirstName] cứ đánh con mãi!\""
  bp2_yearly.8052.a: "[mean_child.GetFirstNameNoTooltip] nên ngừng bắt nạt người khác."
  bp2_yearly.8052.b: "Ta nên khuyến khích [hostage.GetFirstNameNoTooltip] tự bảo vệ [hostage.GetHerselfHimself]."
  bp2_yearly.8052.b.success: "[hostage.GetFirstName] trân trọng bài học này"
  bp2_yearly.8052.b.failure: "[hostage.GetFirstName] đã bị thương"
  bp2_yearly.8052.c: "Ta không quan tâm."
  bp2_yearly.8053.t: "Một câu nói tuyệt vời"
  bp2_yearly.8053.desc: "Lũ trẻ lại đang chơi đùa trong sân, và hôm nay chúng vung vẩy những thanh kiếm đồ chơi. [hostage.GetFirstName|U] tỏ ra không khoan nhượng với bọn trẻ khác, đối đầu với nhiều đứa cùng lúc và dễ dàng đánh bại chúng.\n\nGiữa những tiếng la hét quen thuộc, tai ta bỗng giật mình khi [hostage.GetSheHe] hét lên \"#EMP [ROOT.Char.GetHouse.GetMotto]#!, đồ hạ đẳng!\""
  bp2_yearly.8053.a: "Một câu nói hay."
  bp2_yearly.8053.b: "Những lời đó chỉ dành cho đôi môi của nhà [ROOT.Char.GetHouse.GetNameNoTooltip] mà thôi!"
  bp2_yearly.8054.t: "Truyền thuyết của nhà [ROOT.Char.GetHouse.GetNameNoTooltip|U]"
  bp2_yearly.8054.desc: "Ta tìm được một khoảnh khắc hiếm hoi ở riêng cùng [hostage.GetFirstName], truyền đạt những bài học thường lệ của ta về cả những vấn đề thế tục lẫn lòng mộ đạo, nhưng [hostage.Custom('GirlBoy')] dường như lại đang bận tâm đến một điều khác.\n\n"Ta luôn bị cuốn hút bởi gia tộc danh giá của ngài, [ROOT.Char.Custom('GetAuntUncle')]. Ngài có thể kể cho ta nghe một vài truyền thuyết về Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] được không?""
  bp2_yearly.8054.a: "Cháu đã nghe nói về [ROOT.Char.GetHouse.GetFounder.GetNameNoTooltip] chưa?"
  bp2_yearly.8054.b: "Bản thân ta cũng là một truyền thuyết."
  bp2_yearly.8054.b.success: "[hostage.GetFirstName] bị ấn tượng bởi câu chuyện của Ngài"
  bp2_yearly.8054.b.failure: "[hostage.GetFirstName] không tin Ngài"
  bp2_yearly.8054.c: "Ta có từng kể rằng ta đã giết một con rồng chưa?"
  bp2_yearly.8055.t: "Xung đột tính cách"
  bp2_yearly.8055.desc: "[hostage.GetFirstName] dạo gần đây tỏ ra khá xa cách và dè chừng với ta, tránh né trong những khoảnh khắc hiếm hoi chúng ta tiếp xúc. Khi cuối cùng ta bắt được một lúc ở riêng với [hostage.GetHerHim], ta đặt tay một cách cảm thông lên bờ vai lạnh lẽo của [hostage.GetHerHis].\n\n[hostage.GetSheHe|U] chỉ hất tay ta ra rồi lùi lại. \"Người muốn gì ở ta? Mỗi khoảnh khắc ở bên người đều thật tra tấn! Người đúng là một [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('hostage'))], và ta không thể chờ để rời khỏi nơi này.\""
  bp2_yearly.8055.a: "Có lẽ ta có thể thay đổi!"
  bp2_yearly.8055.b: "Ta không sống để làm vừa lòng [hostage.GetHerHim]."
  bp2_yearly.8055.c: "[hostage.GetSheHe|U] nên được khuyến khích thay đổi."
  bp2_yearly.8055.c.success: "Ngài thuyết phục được [hostage.GetHerHim] theo cách của mình"
  bp2_yearly.8055.c.failure: "[hostage.GetFirstName|U] cảm thấy bị xúc phạm"
  bp2_yearly.8056.t: "Con tin hòa nhã"
  bp2_yearly.8056.desc: "Trò chuyện với [hostage.GetFirstName] thật sự là một niềm vui, và [hostage.GetSheHe] dường như cũng cảm thấy như vậy. Chúng ta có quá nhiều điểm chung, đến mức đôi khi có cảm giác như đang chung một suy nghĩ.\n\nTrong buổi học hôm nay, [hostage.GetSheHe] chăm chú lắng nghe từng lời của ta, quả thực là một đứa trẻ xứng đáng được gọi là [hostage.Custom('GetNieceNephew')] của ta."
  bp2_yearly.8056.a: "Tuyệt vời."
  bp2_yearly.8056.b: "Cuối cùng cũng có người thực sự #EMP hiểu#! ta."
  bp2_yearly.8057.t: "Như một [hostage.Custom('SisterBrother')|U]"
  bp2_yearly.8057.desc: "Ngoài sân, [hostage.GetFirstName] và [nice_child.GetFirstName] đang vui vẻ chơi đùa, đúng như trẻ con nên thế. Giữa những tiếng chim hót và xào xạc quen thuộc của tạo hóa [ROOT.Char.GetFaith.CreatorNamePossessive] là tiếng cười hạnh phúc của lũ trẻ, khiến thế giới dường như đúng với trật tự vốn có.\n\nTrong khoảnh khắc yên bình ấy, ta thậm chí còn nghe [nice_child.GetFirstNameNoTooltip] buột miệng gọi [hostage.GetFirstNameNoTooltip] là \"[hostage.Custom('SisterBrother')]\"."
  bp2_yearly.8057.a: "Thật tuyệt vời."
  bp2_yearly.8057.b: "Điều này đáng được tán dương!"
  bp2_yearly.8060.t: "[ROOT.Char.GetMotherFather|U]?"
  bp2_yearly.8060.desc: "Cuối cùng thì [hostage.GetFirstName] cũng chính thức trở thành một [hostage.GetWomanMan], và ta không thể tự hào hơn khi nhìn thấy [hostage.GetHerHim] tự tin bước vào triều đình sáng nay, với tất cả sự duyên dáng và uy nghi mà ta mong đợi ở chính con cái của mình. Vẫn chưa biết liệu [hostage.GetSheHe] có tiếp tục ở lại triều đình hay không, nhưng khi [hostage.GetSheHe] tiến đến chào hỏi ta theo nghi thức thường lệ, ta có cảm giác như đang nhìn thấy chính [hostage.Custom('GetDaughterSon')] của mình.\n\n"Thật là một vinh dự khi được gặp ngài, [ROOT.Char.GetMotherFather]." Phải mất vài tiếng thở kinh ngạc và những lời xì xào từ triều đình thì [hostage.GetHerHim] mới nhận ra sai lầm của mình. "Ồ, ý ta là [ROOT.Char.Custom('GetAuntUncle')]!""
  bp2_yearly.8060.a: "\"[ROOT.Char.GetMotherFather|U] nghe cũng ổn đấy.\""
  bp2_yearly.8060.b: "\"Con là [hostage.Custom('GetDaughterSon')] của ta, nhưng chỉ trên danh nghĩa.\""
  bp2_yearly.8060.c: "\"Ta sẽ mãi là [ROOT.Char.Custom('GetAuntUncle')] của con.\""
  bp2_yearly.8061.t: "[ROOT.Char.Custom('GetAuntUncle')|U] mãi mãi"
  bp2_yearly.8061.desc: "Đã rất lâu kể từ ngày [hostage.GetFirstName] lần đầu tiên đến triều đình và ta trở thành [ROOT.Char.Custom('GetAuntUncle')] của [hostage.GetHerHis]. Giờ đây khi nhìn thấy [hostage.GetHerHim] đã trưởng thành, ta cảm nhận được một mối liên kết gia đình với [hostage.GetHerHim], như thể chúng ta có chung một dòng máu.\n\n[hostage.GetFirstNameNoTooltip] quỳ xuống trước ta trong triều đình và thề nguyện lòng trung thành vĩnh viễn với ta, với tư cách là [ROOT.Char.Custom('GetAuntUncle')] yêu quý nhất của [hostage.GetHerHis]."
  bp2_yearly.8061.a: "Tuyệt vời."
  bp2_yearly.8063.t: "Con tin bị khinh ghét"
  bp2_yearly.8063.desc: "Đã rất lâu kể từ ngày [hostage.GetFirstName] lần đầu đến triều đình và ta trở thành [ROOT.Char.Custom('GetAuntUncle')] của [hostage.GetHerHis]. Giờ đây đã là một [hostage.GetWomanMan], [hostage.GetSheHe] hầu như không thể chịu nổi việc nhìn mặt ta. Ngồi trong triều, ánh mắt [hostage.GetHerHis] tràn ngập thù hằn và ác ý, chỉ có thể quy cho nỗ lực vụng về của ta trong việc nuôi dạy theo đúng khuôn phép nhà [ROOT.Char.GetHouse.GetNameNoTooltip]."
  bp2_yearly.8063.a: "Ối."
  bp2_yearly.8065.t: "[ROOT.Char.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
  bp2_yearly.8065.desc: "Từ lâu ta đã cảm thấy [new_parent.GetFirstName] mới là [new_parent.GetMotherFather] thực sự của mình, và cuối cùng điều đó cũng đã được ghi thành văn bản. Kể từ hôm nay, ta không còn liên hệ với gia tộc cũ nữa và chính thức trở thành một thành viên thực thụ của nhà [new_parent.GetHouse.GetName]."
  bp2_yearly.8065.a: "Thật điên rồ!"
  rival_manipulated_me: "[TARGET_CHARACTER.GetShortUIName|U] đã cố gắng thao túng [CHARACTER.GetShortUIName]"
  rival_manipulated_me_corresponding: "[CHARACTER.GetShortUIName|U] đã cố gắng thao túng [TARGET_CHARACTER.GetShortUIName]"
  friend_deep_understanding: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã chia sẻ một sự thấu hiểu sâu sắc với nhau"
  rival_chastised_child: "[CHARACTER.GetShortUIName|U] đã quở trách [TARGET_CHARACTER.GetShortUIName]"
  rival_chastised_child_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã quở trách [CHARACTER.GetShortUIName]"
  bp2_security_compromised: "An ninh bị xâm phạm"
  bp2_security_compromised_desc: "Nhân vật này đã phát hiện có người trong triều đang chia sẻ những thông tin nhạy cảm"
  bp2_start_loyalty_story_cycle: "[hostage.GetFirstName] sẽ bắt đầu đặt câu hỏi rằng [hostage.GetSheHe] nên dành lòng trung thành của [hostage.GetHerHis] cho ai."
  bp2_make_hostage_more_loyal: "[hostage.GetFirstName] sẽ có xu hướng trung thành với Ngài hơn khi [hostage.GetSheHe] trưởng thành"
  bp2_make_hostage_less_loyal: "[hostage.GetFirstName] sẽ ít có khả năng trung thành với Ngài hơn khi [hostage.GetSheHe] trưởng thành"
  hostage_loyalty: "Con tin trung thành"
