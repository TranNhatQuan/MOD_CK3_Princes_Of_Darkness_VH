 ##################################################
 # #Misc
  teeming_horde_of_cats_modifier: "Bầy Mèo Đông Đúc"
  teeming_horde_of_cats_modifier_desc: "Nhân vật này dường như luôn bị bao quanh bởi một bầy mèo ngạo mạn lang thang. Những con vật đầy vẻ tôn nghiêm này đảm bảo rằng không một loài gây hại nào có thể xuất hiện quanh họ."
  loyal_pack_of_hounds_modifier: "Bầy Chó Săn Trung Thành"
  loyal_pack_of_hounds_modifier_desc: "Nhân vật này không bao giờ thiếu những con chó săn trung thành bên cạnh. Họ đi đâu, lũ chó theo đó — khiến triều đình có phần gượng gạo, nhưng các chiến dịch thì dễ chịu hơn nhiều."
  frequent_daydreamer_modifier: "Hay Mơ Mộng"
  frequent_daydreamer_modifier_desc: "Nhân vật này thường tỏ ra lạc vào những suy tư sâu xa và nặng nề."
  strong_flock_of_eagles_modifier: "Đàn Đại Bàng Hùng Mạnh"
  strong_flock_of_eagles_modifier_desc: "Nhân vật này thường được nhìn thấy cùng một đàn đại bàng, dường như theo họ đến bất cứ nơi đâu. Những loài chim ấy là biểu tượng của sức mạnh và quyền lực."

  bp2_yearly_0641_vs_courtly_modifier: "Thanh Danh: Chư Hầu Trọng Lễ Nghi"
  bp2_yearly_0641_vs_courtly_modifier_desc: "Ai đó đã rót những lời mật ngọt vào tai các chư hầu của nhân vật này."
  bp2_yearly_0641_vs_glory_hound_modifier: "Thanh Danh: Chư Hầu Ham Danh Vọng"
  bp2_yearly_0641_vs_glory_hound_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
  bp2_yearly_0641_vs_parochial_modifier: "Thanh Danh: Chư Hầu Bảo Thủ"
  bp2_yearly_0641_vs_parochial_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
  bp2_yearly_0641_vs_zealot_modifier: "Thanh Danh: Chư Hầu Cuồng Tín"
  bp2_yearly_0641_vs_zealot_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
  bp2_yearly_0641_vs_minority_modifier: "Thanh Danh: Chư Hầu Thiểu Số"
  bp2_yearly_0641_vs_minority_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
  bp2_yearly_0641_vs_baron_modifier: "Thanh Danh: Chư Hầu Nam Tước"
  bp2_yearly_0641_vs_baron_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
  bp2_yearly_0641_dynasty_modifier: "Thanh Danh: Gia Tộc"
  bp2_yearly_0641_dynasty_modifier_desc: "Ai đó đã rót những lời mật ngọt vào tai các thành viên trong gia tộc của nhân vật này."
  bp2_yearly_0641_fellow_vassals_modifier: "Thanh Danh: Đồng Chư Hầu"
  bp2_yearly_0641_fellow_vassals_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
  bp2_yearly_0641_powerful_vassal_modifier: "Thanh Danh: Chư Hầu Quyền Thế"
  bp2_yearly_0641_powerful_vassal_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
  bp2_yearly_0641_hof_modifier: "Thanh Danh: Giáo Chủ"
  bp2_yearly_0641_hof_modifier_desc: "Ai đó đã rót những lời mật ngọt vào tai giới giáo sĩ của nhân vật này."
  bp2_yearly_0641_realm_priest_modifier: "Thanh Danh: Giáo Sĩ Vương Quốc"
  bp2_yearly_0641_realm_priest_modifier_desc: "$bp2_yearly_0641_hof_modifier_desc$"
  bp2_yearly_0641_maa_maintenance_modifier: "Thắt Lưng Buộc Bụng"
  bp2_yearly_0641_maa_maintenance_modifier_desc: "Ai đó đang vận hành đội quân thường trực của nhân vật này với ngân sách eo hẹp nhưng hiệu quả."
  bp2_yearly_0641_cowed_vassal_modifier: "Lời Nhắc Nhở Lịch Sự"
  bp2_yearly_0641_cowed_vassal_modifier_desc: "Các chư hầu của nhân vật này đã học được cách đọc hiểu những hàm ý ngầm một cách cực kỳ thành thạo."
  bp2_yearly_0641_war_income_modifier: "Thuế Thời Chiến"
  bp2_yearly_0641_war_income_modifier_desc: "Hoàn cảnh chính trị đã mang lại cho nhân vật này một sự hậu thuẫn đáng kể khi đang trong chiến tranh."
  next_free_ho_hire_modifier: "Thuê Dòng Tu Thánh Miễn Phí"
  next_free_ho_hire_modifier_desc: "Lần tiếp theo nhân vật này thuê một dòng tu thánh sẽ không tốn chi phí."
  bp2_yearly_0641_mercenary_cost_reduction_modifier: "Chủ Nghĩa Thương Mại Lính Đánh Thuê"
  bp2_yearly_0641_mercenary_cost_reduction_modifier_desc: ""
  bp2_yearly_0641_raid_speed_modifier: "Chúa Tể Cướp Phá"
  bp2_yearly_0641_raid_speed_modifier_desc: "Quân đội của nhân vật này quy tụ những tên trộm lão luyện bậc nhất trong thời chiến."

 ##################################################
 # #Flavour Events
  bp2_yearly.0601.t: "Cai Trị Đúng Đắn"
  bp2_yearly.0601.desc.intro: "Với tư cách là [ROOT.Char.GetDiarchTitle] của ta, [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] dường như quyết tâm dạy ta những phương pháp cai trị ưa thích của [regent.GetHerHis]."
  bp2_yearly.0601.desc.rationale.disloyal.likes_you: "[regent.GetSheHe|U] là một kẻ khá ngông cuồng với vai trò [ROOT.Char.GetDiarchTitle], nhưng dù vậy, [regent.GetWomanMan] dường như lại hứng thú với việc dạy dỗ ta.\n\n"
  bp2_yearly.0601.desc.rationale.neutral.likes_you: "[regent.GetSheHe|U] hầu như không phải là [ROOT.Char.GetDiarchTitle] tận tâm nhất, nhưng dù vậy, [regent.GetWomanMan] vẫn dành thời gian để chỉ dạy ta bất cứ khi nào có thể.\n\n"
  bp2_yearly.0601.desc.rationale.loyal.predecessor_hook: "Hiếm khi những buổi học này trôi qua mà không có việc [regent.GetWomanMan] nhắc lại lời thề mà [regent.GetSheHe] đã tuyên thệ với người tiền nhiệm của ta.\n\n"
  bp2_yearly.0601.desc.rationale.loyal.loyalty_hook: "Hầu như lần nào bài học cũng bắt đầu bằng việc [regent.GetWomanMan] nhắc lại rằng [regent.GetSheHe] đã thề trung thành với ta trong mọi phương diện, kể cả việc học hành.\n\n"
  bp2_yearly.0601.desc.rationale.loyal.honourable: "Những phương pháp ấy dường như luôn xoay quanh danh dự, những quy tắc nghiêm ngặt để duy trì nó, và cách để đạt được nó.\n\n"
  bp2_yearly.0601.desc.rationale.loyal.fallback: "Những bài học kéo dài, nhưng dường như chúng xuất phát từ lòng tốt trong trái tim [regent.GetHerHis], hoặc ít nhất là từ sự yêu mến mà [regent.GetHerHis] dành cho ta.\n\n"
  bp2_yearly.0601.desc.rationale.fallback: "Vì sao [regent.GetSheHe] làm điều này, ta chưa bao giờ hiểu được, nhưng đôi khi [regent.GetWomanMan] vẫn khăng khăng như vậy.\n\n"
  bp2_yearly.0601.desc.skill.boilerplate: "Buổi học hôm nay lại tiếp tục bàn về #EMP nhiều hơn nữa#!"
  bp2_yearly.0601.desc.diplomacy.arrogant: "nghệ thuật trị quốc. Với [regent.GetHerHim], mọi thứ đều quy về việc đặt kẻ khác vào đúng vị trí của họ, thể hiện quyền lực và nâng cao uy nghiêm. Lời nói là công cụ để [regent.GetSheHe] thiết lập sự thống trị tuyệt đối."
  bp2_yearly.0601.desc.diplomacy.humble: "nghệ thuật trị quốc. Với [regent.GetHerHim], mấu chốt nằm ở sự thấu cảm — người đối diện có thể thấp kém hơn, nhưng khiêm nhường trong ngoại giao sẽ trở thành sự khoan dung, và sự khoan dung ấy ngầm xuất phát từ vị thế mạnh mẽ."
  bp2_yearly.0601.desc.diplomacy.fallback: "nghệ thuật trị quốc. Tư thế, lời ăn tiếng nói, hùng biện, những phức tạp của đàm phán — toàn bộ những thứ ồn ào và màu mè mà chính trị của người lớn dường như say mê."
  bp2_yearly.0601.desc.martial.wrathful: "lý thuyết quân sự. [regent.GetSheHe|U] gần như sôi sục suốt buổi, nhấn mạnh rằng một khi giao tranh bắt đầu, bạo lực phải được sử dụng nhanh chóng và triệt để để đảm bảo chiến thắng. Nương tay chỉ mời gọi thất bại."
  bp2_yearly.0601.desc.martial.calm: "lý thuyết quân sự. [regent.GetSheHe|U] tập trung vào lợi ích của sự kiềm chế trong hoạch định, duy trì một đội quân gọn nhẹ và dùng chiến lược để giảm thiểu sinh mạng phải bỏ ra. Với [regent.GetHerHim], sự cẩn trọng và điềm tĩnh mang lại chiến thắng."
  bp2_yearly.0601.desc.martial.fallback: "lý thuyết quân sự. Nơi hạ trại, cách chăm sóc số lượng lớn ngựa khi hành quân, đội hình nào hiệu quả nhất trước kẻ thù truyền thống của chúng ta, và cứ thế tiếp diễn..."
  bp2_yearly.0601.desc.stewardship.greedy: "thương mại và thuế khóa. Không điều gì khiến [regent.GetHerHim] hăng hái hơn thương mại và thuế. Vẻ tham lam hân hoan hiện rõ trên [regent.Custom('MaskFace_BehindAcross')] [regent.GetHerHis] [regent.Custom('MaskFace')], gần như ngây ngất khi say mê liệt kê từng cách một để thu về bạc, kéo dài hàng giờ."
  bp2_yearly.0601.desc.stewardship.generous: "thương mại và thuế khóa. Với [regent.GetHerHim], bạc chỉ là phương tiện chứ không phải mục đích. Tiền phải được một vị quân chủ thu lấy, đúng, nhưng chỉ khi cần thiết, và luôn phải được phân phát rộng rãi."
  bp2_yearly.0601.desc.stewardship.fallback: "thương mại và thuế khóa. Thuế và thương mại. Một bài diễn thuyết bất tận về chi tiết tiền tệ, những phương pháp tối ưu để rút của cải, và vô số cách mà cả dân thường lẫn quý tộc tìm cách che giấu phần nghĩa vụ của ta."
  bp2_yearly.0601.desc.intrigue.compassionate: "mưu lược chính trị. Với [regent.GetHerHim], vấn đề là làm sao vượt qua tổ rắn độc mà không vấy máu tay, trừ khi hoàn toàn không còn lựa chọn."
  bp2_yearly.0601.desc.intrigue.callous: "mưu lược chính trị. [regent.GetSheHe|U] nói bằng những câu ngắn gọn, dứt khoát và luôn đưa ra phán quyết nhanh chóng. Kẻ thù phải bị xử lý kịp thời, bằng vũ lực hoặc mưu mẹo, không trừng phạt thừa thãi cũng chẳng khoan dung ngu xuẩn."
  bp2_yearly.0601.desc.intrigue.sadistic: "mưu lược chính trị. [regent.GetSheHe|U] dành phần lớn thời gian để khoái trá mô tả những hình phạt sáng tạo dành cho đối thủ, bàn luận cách gây dựng thanh danh, và nhấn mạnh rằng khiến người khác sợ hãi luôn dễ hơn được yêu mến."
  bp2_yearly.0601.desc.intrigue.fallback: "mưu lược chính trị. Phòng ngừa âm mưu, gây ảnh hưởng bằng hàm ý, những chức vị nào nắm quyền lực ngầm, và nhiều điều khác nữa. Tệ hơn, chính bài học cũng chồng chất những tầng nghĩa kép và suy diễn."
  bp2_yearly.0601.desc.learning.shy: "học thuật và thần học. Dù [regent.GetSheHe] nói rất khẽ, ta gần như không nghe được [regent.GetHerHim], nhưng [regent.GetSheHe] vẫn lẩm bẩm không ngừng, nói về vô vàn bài học trị quốc rút ra từ các bậc hiền triết xưa."
  bp2_yearly.0601.desc.learning.gregarious: "chủ nghĩa kinh viện và thần học. Với giọng nói vang dội đầy nhiệt huyết, [regent.GetSheHe] tuôn ra danh sách những sử gia và triết gia yêu thích của [regent.GetHerHis], những ngôi sao học thuật đang lên, các lý thuyết gây tranh luận sôi nổi, cùng cách mà tri thức mang lại lợi ích cho cả người cai trị lẫn thần dân."
  bp2_yearly.0601.desc.learning.fallback: "học thuật và thần học. Một bài giảng khô khan về lịch sử, triết học, những học giả kỳ lạ đến từ những vùng đất xa xôi — toàn những thứ tầm thường quen thuộc — nhưng trọng tâm của [regent.GetHerHis] dường như là: một vị quân chủ có học vấn sẽ mang lại một dân chúng hạnh phúc."
  bp2_yearly.0601.desc.child_reaction.disgust: "\n\nĐiều này nghe thật sai trái đối với ta. Có điều gì đó thật kinh khủng khi tưởng tượng [regent.GetFirstNameNoTooltip] đối xử với những kẻ thấp kém hơn [regent.GetHerHis] như vậy, và còn cho rằng đó là một điều #EMP tốt#!."
  bp2_yearly.0601.desc.child_reaction.admiration: "\n\nCó điều gì đó trong đây khiến ta cảm thấy hoàn toàn đúng đắn. [regent.GetFirstNameNoTooltip] hiểu rõ trật tự thực sự của vạn vật, rằng giới quý tộc chân chính #EMP nên#! hành xử như thế này."
  bp2_yearly.0601.desc.child_reaction.boredom: "\n\nTa thấy quan điểm của [regent.GetFirstNamePossessiveNoTooltip] về chuyện này #EMP hoàn toàn#! chán ngắt, nhưng lại bị mắc kẹt trong bài giảng. Chẳng phải ta sẽ có cả khối thời gian để học những thứ này khi tự mình trở thành [ROOT.Char.GetTitleAsNameNoTooltip] sao?"
  bp2_yearly.0601.option.skill: "Chú ý đến các chi tiết kỹ thuật."
  bp2_yearly.0601.option.perk: "Tập trung vào tinh thần của lời khuyên."
  bp2_yearly.0601.a: "$bp2_yearly.0601.option.skill$"
  bp2_yearly.0601.b: "$bp2_yearly.0601.option.perk$"
  bp2_yearly.0601.c: "$bp2_yearly.0601.option.skill$"
  bp2_yearly.0601.d: "$bp2_yearly.0601.option.perk$"
  bp2_yearly.0601.e: "$bp2_yearly.0601.option.skill$"
  bp2_yearly.0601.f: "$bp2_yearly.0601.option.perk$"
  bp2_yearly.0601.g: "$bp2_yearly.0601.option.skill$"
  bp2_yearly.0601.h: "$bp2_yearly.0601.option.perk$"
  bp2_yearly.0601.i: "$bp2_yearly.0601.option.skill$"
  bp2_yearly.0601.j: "$bp2_yearly.0601.option.perk$"
  bp2_yearly.0601.k: "Mơ màng cho qua buổi học chiều nay."

  bp2_yearly.0611.t: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] – Kinh Đô Thứ Hai"
  bp2_yearly.0611.desc.intro.bad_history: "Bất chấp những gì [regent.GetSheHe] từng làm với ta và gia đình ta trong quá khứ, [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] vẫn là [ROOT.Char.GetDiarchTitle] của ta. Dẫu vậy, [regent.GetSheHe] hầu như chẳng bao giờ rời khỏi [regent_capital.GetBaseNameNoTier].\n\n"
  bp2_yearly.0611.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] làm việc chăm chỉ với tư cách là [ROOT.Char.GetDiarchTitle] của ta, luôn bận rộn trong văn phòng của [regent.GetHerHis] tại [regent_capital.GetBaseNameNoTier].\n\n"
  bp2_yearly.0611.desc.regent_opinion.positive: "Ta biết [regent.GetSheHe] có bổn phận bảo vệ ta cho đến khi ta trưởng thành thành một [ROOT.Char.GetWomanMan], nhưng ngay cả khi [regent.GetSheHe] ghé thăm, dường như lúc nào cũng chỉ là"
  bp2_yearly.0611.desc.regent_opinion.negative: "Ta biết [regent.GetSheHe] chẳng mấy quan tâm đến ta, nhưng chẳng lẽ ta lại đáng khinh đến mức mỗi lần ghé thăm đều chỉ là"
  bp2_yearly.0611.desc.regent_opinion.fallback: "Ta biết [regent.GetSheHe] nghĩ ta chỉ là một đứa trẻ, nhưng chẳng lẽ ta không đáng để dành ra một chút thời gian sao? Thay vào đó, mọi lần ghé thăm đều hoàn toàn"
  bp2_yearly.0611.desc.government.tribal: "để nói chuyện với một vị trưởng lão có thế lực, hoặc bàn bạc với hội đồng, hoặc mượn sứ giả chính thức, hoặc... hoặc..."
  bp2_yearly.0611.desc.government.fallback: "để xử lý vài văn kiện quan trọng, hoặc dùng con dấu gia tộc, hoặc nói chuyện với một viên chức nào đó, hoặc... hoặc..."
  bp2_yearly.0611.desc.outro: "\n\nTa chỉ ước gì [regent.GetSheHe] thỉnh thoảng nghĩ đến #EMP ta#!, chứ không chỉ mỗi [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]."
  bp2_yearly.0611.a: "Có lẽ một bức thư chân thành sẽ khiến [regent.GetHerHim] động lòng..."
  bp2_yearly.0611.b: "#BER Ta là [ROOT.Char.GetTitleAsNameNoTooltip] và ta yêu cầu được lắng nghe!"
  bp2_yearly.0611.b.tt: "Ngài nổi cơn ăn vạ cho đến khi [regent.GetFirstNameNoTooltip] đưa Ngài đến các cuộc họp quan trọng của [regent.GetHerHis]"
  bp2_yearly.0611.c: "Ai quan tâm chứ? Thêm thời gian ra ngoài chơi!"
  bp2_yearly.0611.d: "Ta ngửi thấy mùi cơ hội."
  bp2_yearly.0611.d.tt.success: "Ngài xoay xở để moi được khoản bồi hoàn đã hứa từ [regent.GetFirstName]"
  bp2_yearly.0611.d.tt.failure: "[regent.GetSheHe|U] khó chịu vì những lời than vãn của Ngài"
  bp2_yearly.0611.d.tt.failure.deceitful: "Do [regent.GetHerHis] [personality|E], [regent.GetFirstNameNoTooltip] lại tôn trọng nỗ lực này"
  bp2_yearly.0611.e: "Không biết trong khu riêng tư của [regent.GetHerHis] có gì khi [regent.GetSheHe] vắng mặt nhỉ?"
  bp2_yearly.0611.f.young: "Ta sẽ tìm người khác đọc sách cho ta!"
  bp2_yearly.0611.f.fallback: "Hừ, ta tự đọc lịch sử cũng được, chẳng cần [regent.GetHerHim]."
  bp2_yearly.0611.g: "Hừm, ta có thể tự sắp xếp trò vui cho mình."
  bp2_yearly.0611.g.tt: "Hoạt động [GetActivityType('activity_playdate').GetName] [activity|E] tiếp theo của Ngài miễn phí, và [characters|E] có khả năng tham gia cao hơn"

  bp2_yearly.0621.t.close_family: "Quà Tặng Dành Cho [ROOT.Char.GetTitleAsNameNoTooltip]"
  bp2_yearly.0621.t.fallback: "Quà Tặng Của [regent.Custom('GetAuntUncle')|U] [regent.GetFirstNamePossessiveNoTooltip]"
  bp2_yearly.0621.desc.intro.bad_history: "Dù [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] từng làm sai với ta trong quá khứ, [regent.GetSheHe] dường như quyết tâm bù đắp bằng những món quà cầu kỳ.\n\n"
  bp2_yearly.0621.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gần đây đặc biệt chu đáo. [regent.GetSheHe|U] dường như luôn mang đến cho ta những món quà tuyệt vời nhất, khiến [regent.GetHerHim] trở thành [ROOT.Char.GetDiarchTitle] tuyệt nhất.\n\n"
  bp2_yearly.0621.desc.midtro: "\"À, con đây rồi, [ROOT.Char.Custom('MistressMaster')] trẻ tuổi,\" [regent.GetSheHe] cười khi ta chạy ào vào sân, nơi [regent.GetWomanMan] đang chờ với một vật được phủ vải. \"Hôm nay ta có thứ gì đó rất đặc biệt dành cho con,\" [regent.GetSheHe] thì thầm đầy ẩn ý.\n\nNgay sau đó, tấm vải được kéo ra để lộ"
  bp2_yearly.0621.desc.gift.gold: "những chồng tiền vàng bạc cao ngất, được xếp thành hình một chiếc vương miện."
  bp2_yearly.0621.desc.gift.prestige: "một đoàn ca sĩ và vũ công lao ra, xoay tròn và ngân nga một khúc hát sáng tác riêng về ta."
  bp2_yearly.0621.desc.gift.piety: "một mô hình tinh xảo của [ROOT.Char.GetFaith.HouseOfWorship], cùng một tấm bảng giải thích về cánh mới sẽ được xây dựng bằng khoản cúng dường của ta."
  bp2_yearly.0621.desc.gift.event_troops: "một cận vệ mặc giáp, quỳ xuống và dâng tay [dummy_soldier.GetHerHis] để thề trung thành."
  bp2_yearly.0621.desc.gift.dog: "một con chó săn thanh thoát, cao quý, chiếc đuôi vẫy lia lịa."
  bp2_yearly.0621.desc.gift.cat: "một con mèo tao nhã, nhấc một chân lên, trông chẳng khác gì đang kinh ngạc khi thấy ta — y như ta khi thấy nó."
  bp2_yearly.0621.desc.gift.eagle: "một con đại bàng non lanh lợi, sải cánh rộng, đậu trên giá."
  bp2_yearly.0621.extra_stuff.success: "[regent.GetFirstName] tìm được thêm quà để tặng trong thời gian ngắn"
  bp2_yearly.0621.extra_stuff.failure: "Có gì dùng nấy và Ngài phải hài lòng với nó"
  bp2_yearly.0621.a: "Thật là một bất ngờ tuyệt đẹp!"
  bp2_yearly.0621.b: "Ừm... vật tay để nhân đôi chứ?"
  bp2_yearly.0621.c: "Ngài không nghĩ là còn thiếu một chút gì sao?"
  bp2_yearly.0621.d: "Ngài còn giấu thứ gì đó nữa, ta biết mà..."
  bp2_yearly.0621.e: "Ta đọc đâu đó rằng tặng quà lớn sẽ mang lại may mắn..."
  bp2_yearly.0621.f: "Không thể nào đây là tất cả được?"
  bp2_yearly.0621.g.bad_blood: "Ngài không thể mua được tình cảm của ta đâu, #EMP [regent.GetFirstNameNoTooltip]#!."
  bp2_yearly.0621.g.good_terms: "Cảm ơn, nhưng ta đã có một cái rồi. Có lẽ vậy."

  bp2_yearly.0631.t: "Những Lời Thì Thầm"
  bp2_yearly.0631.desc.intro.positive: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nhìn chung đã chứng tỏ là một [ROOT.Char.GetDiarchTitle] trung thành, những lời khuyên của [regent.GetHerHis] luôn hướng đến lợi ích tốt nhất cho ta.\n\nVì thế, việc [regent.GetSheHe] kể cho ta nghe về hàng loạt những tội lỗi nhỏ nhặt nhưng ghê tởm mà [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] bị cáo buộc lại trở nên vừa nghiêm trọng vừa đáng lo ngại.\n\n"
  bp2_yearly.0631.desc.intro.negative: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] có một thành tích... khá lẫn lộn trong vai trò [ROOT.Char.GetDiarchTitle] của ta. [regent.GetSheHe|U] lẽ ra phải là lá chắn và người bảo hộ của ta, nhưng [regent.GetSheHe] dường như chỉ mải làm giàu cho [regent.GetHerselfHimself].\n\nVì vậy, ta không lấy làm lạ khi bản thân tỏ ra hoài nghi lúc [regent.GetSheHe] kể cho ta nghe về những tội lỗi khủng khiếp mà [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] bị cáo buộc.\n\n"
  bp2_yearly.0631.desc.intro.vague: "Sự phục vụ của [regent.Custom2('MyCharacterIntroductionPossessive', ROOT.Char)|U] với tư cách là [ROOT.Char.GetDiarchTitle] chưa bao giờ hoàn toàn như những gì [regent.GetSheHe] hứa hẹn; đôi lúc [regent.GetSheHe] giúp đỡ ta, nhưng cũng không ít lần [regent.GetSheHe] chỉ chăm lo cho bản thân.\n\nVì thế, ta vô cùng phân vân khi [regent.GetSheHe] kể cho ta nghe về những tội lỗi khủng khiếp mà [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] bị cáo buộc.\n\n"
  bp2_yearly.0631.desc.rationale.nemesis: ""...cái con sâu nhỏ đáng ghê tởm đó chắc chắn đang âm mưu hủy diệt con, [ROOT.Char.GetFirstNameNoTooltip], cũng như [rival_successor.GetSheHe] đang âm mưu hủy diệt ta, và xé nát toàn bộ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]!""
  bp2_yearly.0631.desc.rationale.warmonger: ""... [rival_successor.GetSheHe] là một kẻ hung tàn và hiếu chiến, [ROOT.Char.GetFirstNameNoTooltip], một kẻ có cơn khát tàn phá bất công không hề có giới hạn. [rival_successor.GetSheHe|U] sẽ đẩy toàn bộ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] vào nội chiến nếu có dù chỉ là một cơ hội nhỏ nhất!""
  bp2_yearly.0631.desc.rationale.rival: ""... cái [rival_successor.GetWomanMan] đó là một kẻ đê tiện bậc nhất, [ROOT.Char.GetFirstNameNoTooltip] — một kẻ dối trá, trộm cắp và vô lại, chỉ chăm chăm gieo rắc xung đột và bất hòa trong lãnh thổ của con"."
  bp2_yearly.0631.desc.rationale.revenge: ""... cái tên rít gào, tay sai của [regent.GetFaith.DevilName] đó đã gây ra những tội ác không thể dung thứ với ta và người thân của ta, [ROOT.Char.GetFirstNameNoTooltip], và chắc chắn sẽ trút cơn thịnh nộ của [rival_successor.GetHerHis] lên toàn bộ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] nếu có cơ hội"."
  bp2_yearly.0631.desc.rationale.criminality: ""... [rival_successor.GetSheHe] là một tội phạm khét tiếng, [ROOT.Char.GetFirstNameNoTooltip], một kẻ chắc chắn đang tìm thêm cơ hội cho tội lỗi và sa đọa. Quyền lực mà [rival_successor.GetHerHim] có được nếu [rival_successor.GetSheHe] trở thành [ROOT.Char.GetDiarchTitle]...""
  bp2_yearly.0631.desc.rationale.opposing_traits: ""... chỉ cần nói chuyện với [rival_successor.GetHerHim] hơn một khắc cũng đủ khiến một [regent.GetWomanMan] phát điên, [ROOT.Char.GetFirstNameNoTooltip] — thật đáng kinh ngạc khi một [rival_successor.GetWomanMan] có thể sai trái đến mức #EMP mọi thứ#! như vậy"."
  bp2_yearly.0631.desc.rationale.sins: ""... ta không thể chấp nhận việc dùng chung bàn với cái [rival_successor.GetWomanMan] đó, không một [regent.GetFaith.GetAdherentName] đứng đắn nào có thể — và con cũng không nên, [ROOT.Char.GetFirstNameNoTooltip], trừ khi con muốn những tội lỗi của [rival_successor.GetHerHis] in hằn lên trái tim non nớt của mình"."
  bp2_yearly.0631.desc.rationale.petty_opinions: ""... không phải vì một sự cố cụ thể nào, [ROOT.Char.GetFirstNameNoTooltip], mà là mọi thứ trong cách cái [rival_successor.GetWomanMan] đó cư xử với chính [rival_successor.GetHerselfHimself] — cho thêm thời gian, [rival_successor.GetSheHe] sẽ khiến toàn bộ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] quay lưng lại với con chỉ vì sự khó chịu đơn thuần"."
  bp2_yearly.0631.desc.rationale.hideousness: ""... ý ta là, hãy #EMP nhìn#! cái [rival_successor.GetWomanMan] đó đi! Nếu có thể gọi [rival_successor.GetSheHe] là '[rival_successor.GetWomanMan]' — ta từng thấy những con ếch bị bánh xe nghiền nát còn dễ nhìn hơn. Sự xấu xí ấy hẳn là dấu hiệu của đủ loại ham muốn thấp hèn và tội lỗi đang sôi sục dưới làn da khốn khổ của [rival_successor.GetHerHis]"."
  bp2_yearly.0631.desc.rationale.generic: ""... bất cứ nơi nào [rival_successor.GetSheHe] đến, [rival_successor.GetSheHe] đều tạo ra kẻ thù, [ROOT.Char.GetFirstNameNoTooltip], ta cũng là một trong số đó. Đối xử quá tử tế với cái [rival_successor.GetWomanMan] đó, và [rival_successor.GetSheHe] chắc chắn sẽ lợi dụng lòng hào phóng của con rồi phản bội con chỉ trong thời gian ngắn"."
  bp2_yearly.0631.desc.outro: "\n\n"Nếu con không lên tiếng chống lại [rival_successor.GetHerHim] ngay bây giờ, [rival_successor.GetSheHe] vẫn có thể tìm cách chiếm lấy vị trí của ta và gây cho con tổn hại #EMP vĩnh viễn#!"."
  bp2_yearly.0631.a: "Nếu... đó là điều ngài cho là tốt nhất..."
  bp2_yearly.0631.b: "Không bao giờ! Đây chỉ là những lời dối trá méo mó mà ngài nói ra!"
  bp2_yearly.0631.b.tt: "Ngài từ chối việc công khai phủ nhận [rival_successor.GetFirstNameNoTooltip]"
  bp2_yearly.0631.c.rowdy: "Con đủ lớn để nhận ra đây chỉ là mâu thuẫn cá nhân."
  bp2_yearly.0631.c.charming: "Con chắc là mình có thể nói chuyện phải trái với [rival_successor.GetHerHim] nếu cần."
  bp2_yearly.0631.c.curious: "Con khó mà tin lời riêng của bất kỳ ai trong hai người, [regent.GetFirstNameNoTooltip]."
  bp2_yearly.0631.c.pensive: "Con... con sẽ phải suy nghĩ thêm về chuyện này..."
  bp2_yearly.0631.c.bossy: "Đừng mang mấy vấn đề cá nhân của ngài đến #EMP con#!."

  bp2_yearly.0641.t: "Có Qua Có Lại"
  bp2_yearly.0641.desc.intro.request_boilerplate: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] và [ROOT.Char.GetTitleAsNameNoTooltip], với tư cách là [ROOT.Char.GetDiarchTitle] của ngài, ta cần thêm một chút thẩm quyền để giải quyết một việc khá quan trọng."
  bp2_yearly.0641.desc.intro.tribal: "Một vị phát ngôn luật lệ già nua theo sát [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] khi [regent.GetSheHe] bước vào phòng làm việc nhỏ.\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Nhân chứng này sẽ xác nhận lời thề của ngài".\n\n"
  bp2_yearly.0641.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bước vào phòng làm việc nhỏ với dáng vẻ tự tin, tay cầm một xấp giấy da.\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Nếu ngài vui lòng, hãy ký và đóng dấu vào những văn kiện này".\n\n"
  bp2_yearly.0641.desc.midtro: ""Tất nhiên, ta sẽ không bao giờ đến tay không! Đổi lại cho ân huệ nhỏ này, ta sẽ"
  bp2_yearly.0641.desc.vs_courtly: "nói chuyện với những chư hầu tao nhã nhất của ngài, đảm bảo ngài luôn được họ nể trọng"."
  bp2_yearly.0641.desc.vs_glory_hound: "nói chuyện với những chư hầu hiếu chiến nhất của ngài, khiến họ tin tưởng vào vận mệnh vinh quang của ngài"."
  bp2_yearly.0641.desc.vs_parochial: "nói chuyện với những chư hầu khép kín nhất, cho họ biết triều đình vẫn quan tâm đến mối lo của họ"."
  bp2_yearly.0641.desc.vs_zealot: "nói chuyện với những chư hầu cuồng tín nhất, đảm bảo với họ về lòng mộ đạo của ngài nhân danh [ROOT.Char.GetFaith.HighGodName]"."
  bp2_yearly.0641.desc.vs_minority: "nói chuyện với những chư hầu đa dạng hơn, giữ cho bức tranh muôn màu của lãnh thổ luôn ổn định"."
  bp2_yearly.0641.desc.vs_baron: "nói chuyện với những chư hầu nhỏ hơn, giữ cho tầng lớp thấp nhất trong giới quý tộc luôn nghe lời"."
  bp2_yearly.0641.desc.dynasty: "cho viết những bức thư tâng bốc thay mặt ngài, kể cả với những thành viên gia tộc xa nhất"."
  bp2_yearly.0641.desc.fellow_vassals: "cho viết thư hữu nghị gửi đến các chư hầu khác của [ROOT.Char.GetLiege.GetTitledFirstName], giúp ngài kết bạn trong [ROOT.Char.GetLiege.GetPrimaryTitle.GetDefinitiveName]"."
  bp2_yearly.0641.desc.powerful_vassal: "nói chuyện với những đại quý tộc hùng mạnh nhất trong lãnh thổ, đảm bảo rằng tiếng nói của họ được lắng nghe"."
  bp2_yearly.0641.desc.hof: "gửi một bức thư nồng nhiệt tới [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName], nâng cao vị thế của ngài với vị đại diện được [ROOT.Char.GetFaith.HighGodNamePossessive] lựa chọn"."
  bp2_yearly.0641.desc.realm_priest: "nói chuyện với [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName] của ngài để đảm bảo ngài vẫn được giới giáo sĩ ủng hộ"."
  bp2_yearly.0641.desc.maa_maintenance: "xem liệu chúng ta có thể tìm thêm chút tiền cho quân hộ vệ của ngài không"."
  bp2_yearly.0641.desc.cowed_vassal: "sắp xếp để thu thêm #EMP cống nạp#! từ những chư hầu khiếp sợ nhất của ngài"."
  bp2_yearly.0641.desc.war_income: "sắp xếp thu thuế chiến tranh trong thời buổi khó khăn này"."
  bp2_yearly.0641.desc.free_ho_hire: "sắp xếp sử dụng các chiến binh hung mãnh nhất của đức tin chúng ta, phục vụ trong thời kỳ nhiếp chính của ngài"."
  bp2_yearly.0641.desc.mercenary_cost_reduction: "sắp xếp giảm giá với các đội lính đánh thuê đang tụ tập trong lãnh thổ của ngài. Tất nhiên là dùng sau khi ngài trưởng thành"."
  bp2_yearly.0641.desc.raid_speed: "sắp xếp để các tay cướp kỳ cựu gia nhập đội quân của ngài, giúp mang về chiến lợi phẩm ngoại bang dồi dào"."
  bp2_yearly.0641.desc.outro.tribal: "\n\nTa chỉ cần nói vài lời."
  bp2_yearly.0641.desc.outro.fallback: "\n\nTa chỉ cần viết vài dòng."
  bp2_yearly.0641.a: "Nếu ngài nói vậy..."
  bp2_yearly.0641.b: "Ngài đi quá giới hạn rồi, [regent.GetFirstNameNoTooltip]."
  bp2_yearly.0641.c.rowdy: "Ngài là [ROOT.Char.GetDiarchTitle] — tự lo lấy đi!"
  bp2_yearly.0641.c.charming: "Ngài biết rõ nhất mà — chẳng phải #EMP ngài#! nên tự xử sao!?"
  bp2_yearly.0641.c.curious: "Thật mệt mỏi — không thể nói chuyện khác sao?"
  bp2_yearly.0641.c.pensive: "Con còn phải lo việc học hành, e là không được."
  bp2_yearly.0641.c.bossy: "Chuyện này không xứng tầm ta — cứ làm theo ý ngài."
  bp2_yearly.0641.c.tt: "Ngài cho [regent.GetFirstNameNoTooltip] toàn quyền hành động nhưng không công khai ủng hộ"

  bp2_yearly.0651.t: "Bất Cứ Khi Nào Ngươi Cần [regent.GetHerHim|U]"
  bp2_yearly.0651.desc.intro: "[ROOT.Char.GetDiarchTitle] của ta, [regent.GetFirstName], chăm chú lắng nghe câu chuyện của ta, đôi mắt ánh lên sự quan tâm và trìu mến khi"

  bp2_yearly.0651.desc.story.rowdy.invented_game: "Ta giải thích chi tiết luật chơi của trò chơi bóng mới mà ta vừa phát minh. Ta #EMP rất#! tự hào về nó."
  bp2_yearly.0651.desc.story.rowdy.climbed_roof: "Ta kể tỉ mỉ con đường đã leo lên ngọn tháp mới — khá là nguy hiểm, nhưng ta là người leo giỏi nhất ở [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]."
  bp2_yearly.0651.desc.story.rowdy.prank: "Ta cười khúc khích kể lại trò đùa mới nhất mình bày ra — có thể chỉ mình ta cười, nhưng ta đã cười #EMP hết cỡ#!."
  bp2_yearly.0651.desc.story.charming.composed_poem: "Ta bàn về biểu tượng và ý nghĩa của bài thơ mình viết. Ta nghĩ đó là tác phẩm hay nhất từ trước đến nay, dù vẫn chưa dám gọi mình là một thi sĩ."
  bp2_yearly.0651.desc.story.charming.new_friend: "Ta kể cho [regent.GetHerHim] nghe về một đứa trẻ con của gia nhân dường như bị cuốn hút bởi các trò chơi của ta. Ta nghĩ mình đã kết bạn, ít nhất là trong mùa này."
  bp2_yearly.0651.desc.story.charming.new_word: "Ta giải thích cách phát âm của từ mới mà ta đã sáng tạo. Ta mong nó sẽ sớm được lan truyền, một khi thần dân nghe thấy chính #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! sử dụng nó."
  bp2_yearly.0651.desc.story.curious.distant_land: "Ta kể cho [regent.GetHerHim] nghe về một vùng đất xa xôi kỳ lạ mà ta mới học được, cùng những con người khác thường sinh sống ở đó."
  bp2_yearly.0651.desc.story.curious.book_gift: "Ta giải thích chi tiết nội dung của cuốn sách mà một chư hầu nhỏ đã mua tặng ta — không phải tác phẩm vĩ đại gì, nhưng ta đã ngấu nghiến nó với sự thích thú."
  bp2_yearly.0651.desc.story.curious.strange_bird: "Ta chỉ ra từng phần khác nhau trong bản phác thảo của mình, cố gắng truyền đạt cách con chim kỳ lạ ấy chuyển động một cách khác thường, bộ lông của nó trông ra sao, và cố gắng bắt chước tiếng hót lanh lảnh của nó."
  bp2_yearly.0651.desc.story.pensive.distant_letter: "Ta nói về bức thư mà ta đã cẩn thận viết nên để gửi cho một quý tộc xa xôi mà ta chỉ mới nghe danh. Ta không biết thư có đến nơi hay không, nhưng chỉ nghĩ đến việc họ có thể hồi âm thôi cũng đã khiến ta vui sướng."
  bp2_yearly.0651.desc.story.pensive.foreign_custom: "Ta kể cho [regent.GetHerHim] nghe về một phong tục ngoại quốc kỳ lạ mà ta mới nghe gần đây, một phong tục mà ta thật lòng mong cũng là chuẩn mực ở [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]."
  bp2_yearly.0651.desc.story.pensive.draft_law: "đạo luật mà ta đang cố gắng soạn thảo. Nó... vẫn chưa #EMP hoàn chỉnh#!, nhưng ta tự hào về việc mình đã đi được xa đến mức nào."
  bp2_yearly.0651.desc.story.bossy.servants_caught: "Ta kể cho [regent.GetHerHim] nghe về những gia nhân mà ta bắt gặp đang lười biếng, và cách ta nghiêm khắc kỷ luật họ vì thái độ làm việc cẩu thả."
  bp2_yearly.0651.desc.story.bossy.court_protocol: "Ta trình bày và minh họa nghi thức triều đình mới mà ta muốn áp dụng. Ta nghĩ nó sẽ thực sự thể hiện phẩm giá của ta với tư cách là [ROOT.Char.GetTitleAsName] duy nhất của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]."
  bp2_yearly.0651.desc.story.bossy.organised_game: "Ta giải thích cách mình tổ chức một trò chơi với các đứa trẻ khác trong triều, chia chúng thành các đội, và tự mình điều hành toàn bộ trò chơi."
  bp2_yearly.0651.desc.rationale.predecessor: "\n\n\"[ROOT.Char.GetFirstNameNoTooltip] bé nhỏ, con làm ta nhớ đến [predecessor.GetFirstName] rất nhiều khi con nói như vậy,\" [regent.GetWomanMan] thở dài, rõ ràng đang chìm trong ký ức cùng lời nói của ta; \"con trông hệt như [ROOT.Char.Custom2('RelationToMeShort', predecessor)] của mình.\""
  bp2_yearly.0651.desc.rationale.loyalty: "\n\n\"Con có biết con làm ta tự hào thế nào không? Tự hào khi được bảo vệ con lúc còn là một [ROOT.Char.Custom('GirlBoy')], và một ngày nào đó, còn tự hào hơn nữa khi được phục vụ con với tư cách là một [ROOT.Char.GetWomanMan].\""
  bp2_yearly.0651.desc.rationale.compassion: "\n\n"Ta cảm thấy thật may mắn khi được phục vụ ngài, tiểu [ROOT.Char.GetFirstNameNoTooltip]," [regent.GetSheHe] thở dài, "thật may mắn khi được chứng kiến [ROOT.Char.GetWomanMan] mà ngài đang dần trở thành.""
  bp2_yearly.0651.desc.rationale.fallback: "\n\n"Tiểu [ROOT.Char.GetFirstNameNoTooltip], một ngày nào đó, ngài sẽ trở thành [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại nhất mà [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] từng có. Ta vô cùng tự hào về [ROOT.Char.GetWomanMan] mà ngài đang trở thành.""
  bp2_yearly.0651.desc.outro: "\n\n\"Ta sẽ luôn ở bên con, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Dù cho chính [regent.GetFaith.random_NegativeAfterLife] trỗi dậy, con vẫn có thể tin cậy vào ta.\""
  bp2_yearly.0651.a: "Vậy ngươi thề sẽ không bao giờ phản bội ta chứ?"
  bp2_yearly.0651.b: "[ROOT.Char.GetFirstNameNoTooltip] và [regent.GetFirstNameNoTooltip], Bạn Bè mãi mãi!"
  bp2_yearly.0651.c: "Hay đấy, nhưng ta đang kể chuyện."
  bp2_yearly.0651.d: "Nào, hãy cùng đi kể cho cả triều nghe về ngày hôm nay của ta!"

  bp2_yearly.0661.t: "Công Cụ Cho Kẻ Nắm Giữ"
  bp2_yearly.0661.desc: ""#EMP [offended_family.Custom2('GetWomanManGirlBoy', ROOT.Char)] đó là [offended_family.Custom2('RelationToMeShort', ROOT.Char)] của ta!#!" [offended_family.GetFirstName] hét lên, đối mặt với [ROOT.Char.GetDiarchTitle] của ta là [regent.GetFirstName] trong một trong vô số hành lang trống trải của [ROOT.Char.GetCapitalLocation.GetName], "ngươi không thể ngăn ta gặp [ROOT.Char.GetHerHim] như thế này được".\n\nTa vốn không định nghe lén, chỉ vô tình bắt gặp cuộc trò chuyện này khi đang đuổi theo một người hầu, nhưng giờ đây ta đứng nán lại ngoài tầm mắt khi hai người họ tranh cãi.\n\n"[ROOT.Char.GetSheHe|U] có thể là [offended_family.Custom2('RelationToMeShort', ROOT.Char)] của ngươi, nhưng [ROOT.Char.GetSheHe] là trách nhiệm #EMP của ta#!, cho đến khi ta thấy [ROOT.Char.GetHerHim] đủ khả năng tự quản lý công việc của mình. Cho đến lúc đó, ta sẽ thay mặt [ROOT.Char.GetTitledFirstName] lên tiếng, và theo ý kiến của ta, hạng người như ngươi là loại ảnh hưởng tồi tệ nhất đối với một tâm hồn trẻ thơ.""
  bp2_yearly.0661.a: "[regent.GetFirstNameNoTooltip] nói đúng, thật đáng xấu hổ cho ngươi, [offended_family.GetFirstNameNoTooltip]!"
  bp2_yearly.0661.b: "[offended_family.GetFirstNameNoTooltip] là [ROOT.Char.Custom2('RelationToMeShort', offended_family)] của ta và ngươi phải tôn trọng [offended_family.GetHerHim]."
  bp2_yearly.0661.c.rowdy: "Cứ để họ tự giải quyết, ta còn việc phải làm."
  bp2_yearly.0661.c.charming: "Chẳng được gì khi chọn phe ở đây cả."
  bp2_yearly.0661.c.curious: "Thật thú vị, nhưng còn chuyện tên gia nhân đó thì sao..."
  bp2_yearly.0661.c.pensive: "Ta không muốn dính dáng đến cuộc tranh cãi này."
  bp2_yearly.0661.c.bossy: "Ta sẽ xử lý hai người này khi ta thực sự trở thành [ROOT.Char.GetTitleAsNameNoTooltip]."
