  erratic_behaviour: "Hành vi thất thường"
  erratic_behaviour_desc: "Nhân vật này gần đây khiến triều đình khó chịu vì những hành vi phi lý và kỳ quặc."
  bird_cruelty: "Căm ghét chim chóc"
  bird_cruelty_desc: "Nhân vật này gần đây phản ứng thái quá với chim chóc. Chỉ một tiếng hót hay quạ kêu bên ngoài cũng đủ khiến họ nổi cơn thịnh nộ."
  child_personality.keeps_eccentric_tt: "[child.GetFirstName] giữ lại đặc tính [GetTrait('eccentric').GetName( child.Self )]"
  friend_boardgames_on_horseback: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUiName] đã cùng nhau trải qua một ngày chơi cờ bàn khi cưỡi ngựa"
 
  close_tutelage: "Kèm cặp sát sao"
  close_tutelage_desc: "Nhân vật này đang nhận được sự quan tâm đặc biệt từ một người thầy, khiến việc học tập trở nên dễ dàng hơn nhiều."
  close_tutelage_scheme: "Kèm cặp sát sao"
  close_tutelage_tutor: "Kèm cặp sát sao"
  close_tutelage_tutor_desc: "Nhân vật này đang trực tiếp kèm cặp một đứa trẻ, hỗ trợ quá trình giáo dục của nó, nhưng phải đánh đổi bằng sự ổn định tinh thần của chính mình."
  changing_habits: "Thay đổi thói quen"
  changing_habits_desc: "Nhân vật này đang cố gắng điều chỉnh hành vi của mình để làm hài lòng người khác."

