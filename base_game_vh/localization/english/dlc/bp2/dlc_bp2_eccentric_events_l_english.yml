l_english:
  child_personality.7300.t: "Một Người  Bạn củaMuôn Thú"
  child_personality.7300.desc: "Ta thường cảm thấy thoải mái hơn rất nhiều khi ở cạnh những con vật trong vườn thú và chuồng ngựa so với khi ở bên Bạn Bè đồng trang lứa và các gia sư nơi triều đình. Ta lại thấy mình quay trở lại chuồng ngựa, chải lông và cưỡi con ngựa của mình.\n\nTa cảm nhận được một mối gắn kết mạnh mẽ, như giữa những người Bạn Thân. Ta xuống ngựa, chải lông cho chiến mã thật kỹ, và tự hỏi liệu có lẽ chúng ta nên đối xử với những con ngựa của mình như đồng đội hơn là công cụ."
  child_personality.7300.a: "Ta... ta nghĩ mình nói chuyện được với ngựa!"
  child_personality.7300.b: "Chúng cũng giống như chúng ta."
  child_personality.7300.c: "Dã thú chỉ là công cụ, không hơn."
  child_personality.7301.t: "$child_personality.7300.t$"
  child_personality.7301.desc: "[child.GetFirstName] gần đây dành một khoảng thời gian bất thường ở chuồng ngựa và đã bắt đầu lơ là những người bạn đồng trang lứa tại triều đình. Đứa trẻ dường như bị ám ảnh bởi một con ngựa cụ thể"
  child_personality.7301.eccentric.desc: "và thậm chí còn bắt đầu khẳng định rằng [child.GetSheHe] "biết nói tiếng ngựa".\n\nSau đó, đứa trẻ bắt đầu búng môi tạo ra những âm thanh phì phì và hí vang như ngựa, thỉnh thoảng lại dừng lại để nói cho ta biết [child.GetSheHe] và con ngựa đang trò chuyện về điều gì."
  child_personality.7301.eccentric.obligatory_glitterhoof_reference: "Dường như con dã thú này còn có tham vọng vươn lên giữ chức [child.GetFaith.ReligiousHeadName]."
  child_personality.7301.eccentric.fallback: "Dường như con dã thú này muốn ngồi vào hội đồng."
  child_personality.7301.compassionate.desc: "và khẳng định rằng ngay cả dã thú cũng xứng đáng được chăm sóc và đối xử tử tế.\n\nCon ngựa được chải chuốt hoàn hảo đến không tì vết, trái ngược với [child.GetFirstNameNoTooltip], người rõ ràng đã làm công việc của một người giữ chuồng."
  child_personality.7301.callous.desc: "nhưng khi bị chất vấn, [child.GetSheHe] khăng khăng rằng dã thú chỉ là một công cụ để sử dụng rồi vứt bỏ khi không còn hữu ích.\n\n[child.GetFirstNameNoTooltip] hoàn toàn không quan tâm đến sự an toàn hay thoải mái của con vật khi cưỡi, thậm chí còn tỏ ra cáu kỉnh khi con ngựa thể hiện sự lo lắng cho chính nó."
  child_personality.7301.eccentric: "Thật là một trí tưởng tượng tuyệt vời."
  child_personality.7301.compassionate: "Hãy đối xử với người khác như cách con muốn được đối xử..."
  child_personality.7301.callous: "\"Tuyệt lắm, hãy giữ lấy cảm giác đó.\""
  child_personality.7301.change.eccentric: "\"Không, hãy nói chuyện với con ngựa. Kể ta nghe nó nói gì.\""
  child_personality.7301.change.compassionate: "\"Một con ngựa là người Ngài đồng hành không giống bất kỳ ai, [child.GetFirstNameNoTooltip].\""
  child_personality.7301.change.callous: "\"Đồ ngốc, ngựa chỉ là công cụ mà thôi.\""
  child_personality.7400.t: "Chơi Hay Cưỡi Ngựa?"
  child_personality.7400.desc: "Ta đã vui vẻ dành gần trọn một ngày bên [other_child.GetFirstName], và cảm thấy như mình có thể chơi với [other_child.GetHerHim] cho đến khi mệt lả.\n\nNhưng rồi ta thấy gương mặt [other_child.GetHerHis] chùng xuống khi ta lấy bộ [ROOT.Char.Custom('BG_GameType_Generic')] của mình ra.\n\n"
  child_personality.7400.desc.outro.young: "\"Ta không muốn chơi thứ ngu ngốc và chán ngắt đó. Ta muốn cưỡi ngựa!\""
  child_personality.7400.desc.outro.older: "\"Ôi nào, [ROOT.Char.GetFirstNameNoTooltip], chúng ta ở trong nhà cả ngày rồi. Có lẽ nên ra ngoài cưỡi ngựa chứ!\""
  child_personality.7400.a: "\"Sao không làm cả hai?\""
  child_personality.7400.b: "\"Không, chúng ta sẽ chơi TRÒ CỦA TA theo CÁCH CỦA TA!\""
  child_personality.7400.c: "\"Được thôi, cưỡi ngựa cũng ổn…\""
  child_personality.7401.t: "$child_personality.7400.t$"
  child_personality.7401.desc: "[child.GetFirstName] suốt cả ngày nay tỏ ra lặng lẽ một cách kỳ lạ, nên ta quyết định đi xem [child.GetHerHim] thế nào. Ta tìm thấy [child.GetHerHim]"
  child_personality.7401.eccentric.desc: "ngoài bãi cưỡi ngựa cùng [other_child.GetFirstName]. Cả hai đang la hét từ trên lưng ngựa, đọc vang những thứ nghe như các nước đi trong [child.Custom('BG_GameType_Generic')]. Quan sát kỹ hơn, ta nhận ra hai đứa đang chơi cờ bàn trên lưng ngựa, hoặc ít nhất là đang cố gắng làm vậy. Khắp sân cưỡi ngựa vương vãi đầy quân cờ, và cả hai đã ngã khỏi ngựa không chỉ một lần."
  child_personality.7401.fickle.desc: "ở bãi cưỡi ngựa cùng với [other_child.GetFirstName]. [child.GetFirstNameNoTooltip|U] dường như không mấy hào hứng khi có mặt ở đó, như thể [child.GetSheHe] bị người bạn chơi của mình ép phải đến đây.\n\n"Ta muốn chơi trò chơi bàn cờ hơn, nhưng [other_child.GetFirstNameNoTooltip] nói rằng chúng ta nên cưỡi ngựa, và nghe cũng có vẻ hay đấy!""
  child_personality.7401.stubborn.desc: "trong phòng riêng của [child.GetHerHis], cùng [other_child.GetFirstName], người đang chơi [child.Custom('BG_GameType_Generic')] một cách hời hợt với [child.GetFirstNameNoTooltip] đầy hào hứng.\n\n\"[other_child.GetFirstNameNoTooltip|U] muốn cưỡi ngựa, nhưng con quyết định chúng ta nên chơi cờ bàn thay vào đó!\""
  child_personality.7401.eccentric: "\"Một sự thỏa hiệp tuyệt vời!\""
  child_personality.7401.fickle: "\"Ý thích thay đổi còn nhanh hơn cả thời tiết.\""
  child_personality.7401.stubborn: "\"Hãy vững vàng như đá tảng.\""
  child_personality.7401.change.eccentric: "\"Sao không chơi cả hai cùng lúc?\""
  child_personality.7401.change.fickle: "\"Ý thích của con người phải linh hoạt như dòng nước.\""
  child_personality.7401.change.stubborn: "\"Không, hãy đứng yên tại chỗ và bắt người khác phải nhường.\""
  stress_threshold.2360.t: "Khủng Hoảng Tinh Thần: Một Vị Khách"
  stress_threshold.2360.desc: "Cuối cùng ta cũng tìm được chút thanh thản khỏi áp lực của cuộc sống nơi [ROOT.Char.Custom('GetCourt')|l] trong căn [ROOT.Char.Custom('GetChamber')|l] riêng của mình, nhưng khi đang lơ mơ bên bờ giấc ngủ, ta nghe thấy những tiếng gõ cứng theo nhịp điệu.\n\nTa mở toang [ROOT.Char.Custom('GetDoor')] để xem vị khách nửa đêm là ai, chỉ để khuôn mặt mình bị tấn công bởi một con chim nhỏ màu đen.\n\nThông thường, một chuyến viếng thăm từ sinh vật của [ROOT.Char.GetFaith.CreatorNamePossessive] sẽ là một điềm lành, nhưng con vật nhỏ đáng ghét này cứ bay loạn khắp [ROOT.Char.Custom('GetRoom')|l], kêu quang quác và rít lên không ngừng. Ta cảm thấy tay mình siết chặt và tim bắt đầu đập dồn dập."
  stress_threshold.2360.a.eccentric.gain: "Ta nghĩ nó đang nói chuyện với ta."
  stress_threshold.2360.a.eccentric.effect: "À ha, một vị khách vào giờ này! Nào, cùng trò chuyện thôi."
  stress_threshold.2360.b.irritable.gain: "Ta không chịu nổi nữa!"
  stress_threshold.2360.b.irritable.effect: "Ta sẽ giết con chim chết tiệt đó!"
  stress_threshold.2360.c: "Chắc rồi nó cũng sẽ tự bay đi thôi."
  bp2_yearly.8000.t: "Theo Hình Ảnh Của Ta"
  bp2_yearly.8000.desc.intro: "[hostage.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gần đây chỉ nói chuyện với ta bằng [ROOT.Char.GetCourtLanguage.GetNameNoTooltip], và [hostage.GetSheHe] làm điều đó với trình độ đáng kinh ngạc.\n\n"
  bp2_yearly.8000.desc.tutor: "Không nghi ngờ gì nữa, chính khoảng thời gian được chăm sóc dưới sự chỉ dẫn của gia sư triều đình của ta, [tutor.GetFirstName], đã khiến đứa trẻ này trở nên xuất sắc về ngôn ngữ như vậy, và ta rất mong chờ được thấy khả năng làm chủ ngôn ngữ cung đình của [hostage.GetHerHis] còn tiến xa hơn nữa."
  bp2_yearly.8000.desc.chaplain: "[hostage.GetFirstNameNoTooltip|U] nói với ta rằng các nhà giáo dục thuộc giới giáo sĩ của [hostage.GetHerHis], chẳng hạn như [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)], chính là những người đáng được cảm ơn vì khả năng làm chủ ngôn ngữ cung đình của [hostage.GetHerHis]."
  bp2_yearly.8000.desc.guardian: "Rõ ràng là [hostage.GetFirstNameNoTooltip] và [tutor.GetFirstName] đang xây dựng một mối gắn kết khá sâu sắc, và ta có thể mong đợi thêm nhiều bất ngờ đáng mừng nữa trong quá trình giáo dục của [hostage.GetHerHis]."
  bp2_yearly.8000.a: "Ta sẽ đích thân dạy dỗ [hostage.GetHerHim]."
  bp2_yearly.8000.b: "Một nỗ lực thật đáng thương với [ROOT.Char.GetCourtLanguage.GetNameNoTooltip]."
  bp2_yearly.8000.c: "Cũng được."
  bp2_yearly.8000.b.tt: "[hostage.GetFirstNameNoTooltip|U] sẽ bị làm nản lòng trong việc học [court_language|E] của Ngài"
  tutor_child_in_language_tt: "[hostage.GetFirstNameNoTooltip|U] sẽ bắt đầu một [scheme|E] để học [court_language|E] của Ngài với một lợi thế lớn"
  child_learning_language_tt: "[hostage.GetFirstNameNoTooltip|U] sẽ được khuyến khích bắt đầu một [scheme|E] để học [court_language|E]"
  bp2_yearly.8010.t: "Cách Nói Kỳ Quặc"
  bp2_yearly.8010.desc: "Ta đang ở giữa một buổi học với [child.Custom2('MyCharacterIntroduction', ROOT.Char)] thì nụ cười bị nén lại của [child.GetHerHim] khiến ta nghi ngờ rằng [child.GetSheHe] chẳng hề chú ý đến bất kỳ lời nào ta nói. Thỉnh thoảng, [child.GetSheHe] chỉ đơn giản là lặp lại điều ta vừa nói bằng một giọng điệu kỳ quái.\n\n\"Con đang làm gì vậy?\"\n\n\"Con đang làm gì vậy?\" [child.Custom2('InsultNoun', ROOT.Char)] bật cười phá lên. \"Xin lỗi nhé, giọng của ngài buồn cười quá!\""
  bp2_yearly.8010.a: "Có lẽ ta nên dạy cho [child.GetHerHim] chút [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] cơ bản."
  bp2_yearly.8010.a.tt: "Ngài sẽ dành vài buổi học tiếp theo để nói [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] cơ bản"
  tutor_child_in_native_language_tt: "[child.GetFirstName|U] sẽ bắt đầu một [scheme|E] để học [language|E] của Ngài với một lợi thế lớn"
  bp2_yearly.8010.a.success: "Ngài dạy thành công [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]"
  bp2_yearly.8010.a.failure: "Ngài không thể dạy được [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]"
  bp2_yearly.8010.b: "\"Không, chính #EMP ngài#! mới nói chuyện buồn cười!\""
  bp2_yearly.8010.b.success: "Ngài chế giễu đứa trẻ thành công"
  bp2_yearly.8010.b.failure: "Ngài bị bẽ mặt thêm lần nữa"
  bp2_yearly.8010.c: "Được thôi."
  bp2_yearly.8010.d: "Oway areway uway?"
  bp2_yearly.8010.d.tt: "Ngài dành buổi học để cùng nhau sáng tạo ra một ngôn ngữ bí mật"
  bp2_yearly.8020.t: "Con Muốn Làm Gì?"
  bp2_yearly.8020.desc: "Ta đã chơi cùng [other_child.Custom2('MyCharacterIntroduction', ROOT.Char)] gần trọn một ngày, và ta đã vui đến không thể tả! Chúng ta chơi [ROOT.Char.Custom('BG_GameType_Generic')], và khi ván chơi kết thúc, [other_child.GetSheHe] đánh bại ta, khiến ta sững sờ.\n\n\"Vui thật đấy! Giờ chúng ta làm gì tiếp?\"\n\nĐây là cơ hội để ta chọn thứ gì đó mà ta vẫn có thể thắng..."
  bp2_yearly.8020.a: "Cùng thi chạy cà kheo nhé!"
  bp2_yearly.8020.b: "Chơi con quay teetotum đi!"
  bp2_yearly.8020.c: "Ai cũng thắng khi chơi múa rối."
  bp2_yearly.8021.t: "Trò Chơi"
  bp2_yearly.8021.desc.intro: "Chúng ta cất bàn cờ đi và chuẩn bị"
  bp2_yearly.8021.desc.stilts: "cà kheo của mình. Ta được nâng lên cao, gần bằng chiều cao của người lớn, và đôi chân bé nhỏ của ta chật vật giữ thăng bằng ở độ cao choáng ngợp này. Khi đối thủ của ta cũng đứng vững với dáng đi không ổn định của [other_child.GetHerHis], chúng ta bắt đầu!"
  bp2_yearly.8021.desc.teetotum: "con quay teetotum. Nó quay vòng vòng, mỗi đứa chúng ta đều đặt cược những viên bi của mình vào kết quả. Dù chẳng có thứ gì giá trị bị đặt cược, ta vẫn cảm thấy tim mình đập dồn dập khi nó sắp ngã xuống.\n\nTrò chơi diễn ra qua lại, những viên bi đổi chủ liên tục, nhưng chẳng bao lâu ta nhận ra"
  bp2_yearly.8021.desc.stilts.outro: "\n\n[other_child.GetFirstNameNoTooltip|U] hầu như không đi được vài thước trước khi ngã sấp mặt xuống đất, để ta trở thành người chiến thắng. Từ trên đôi cà kheo oai vệ của mình, ta đứng nhìn xuống đối thủ, và giờ ta có thể tự do nhận lấy phần thưởng của mình."
  bp2_yearly.8021.desc.teetotum.outro: "rằng mình đã sở hữu toàn bộ số bi vào cuối cùng. [other_child.GetFirstNameNoTooltip|U] thở dài thất vọng, còn ta thì tự hào trở thành chủ nhân của tất cả những viên bi."
  bp2_yearly.8021.a: "Quá dễ! Đồ thua cuộc!"
  bp2_yearly.8021.b: "Chơi hay lắm."
  bp2_yearly.8021.c: "Ta đã nói là người thắng sẽ được một ân huệ mà..."
  bp2_yearly.8022.desc.stilts.outro: "\n\nTa chạy nhanh nhất có thể trên đôi chân không vững của mình, nhưng chỉ sau vài bước, ta ngã dúi dụi và [other_child.GetFirstNameNoTooltip] trở thành người chiến thắng."
  bp2_yearly.8022.desc.teetotum.outro: "Ta đã hoàn toàn hết sạch bi, khiến [other_child.GetFirstNameNoTooltip] trở thành người chiến thắng."
  bp2_yearly.8022.desc.rubbed_it_in: "\n\n[other_child.GetSheHe|U] chẳng hề khiêm tốn trong chiến thắng, chế giễu và hạ nhục ta vì đã thua cuộc."
  bp2_yearly.8022.desc.normal_child: "\n\n\"Vui thật đấy!\""
  bp2_yearly.8022.a: "Kệ đi."
  bp2_yearly.8022.a.mean: "\"Im đi! Ta ghét ngươi!\""
  bp2_yearly.8022.b: "\"Lính gác!\""
  bp2_yearly.8022.c: "\"Ừ, chúng ta chơi lại nhé!\""
  bp2_yearly.8030.t: "Con Búp Bê Cô Đơn"
  bp2_yearly.8030.desc: "Lửa cháy và tiếng la hét bao quanh ta tại [ROOT.Char.GetCurrentLocation.GetName] khi quân đội của ta cướp bóc hàng hóa quý giá và tù binh. Mùi khét của thịt cháy lan tỏa khắp không khí.\n\nGiữa đống đổ nát, một con búp bê nhỏ bị vứt sang một bên. Đôi mắt cúc áo bé xíu và nụ cười được khâu tay khiến ta nhớ đến sự ngây thơ đang chờ đợi ta nơi quê nhà.\n\nDù lấm đầy bùn đất, mái tóc mềm mại của nó vẫn mang lại cảm giác tinh tế trong tay ta. Ta không thể không nghĩ rằng đây sẽ là món quà hoàn hảo cho một trong những đứa trẻ nơi triều đình."
  bp2_yearly.8030.a: "[child_1.GetFirstNameNoTooltip] chắc chắn sẽ rất thích món này!"
  bp2_yearly.8030.b: "Con búp bê này khiến ta nhớ rất nhiều đến [child_2.GetFirstNameNoTooltip]."
  bp2_yearly.8020.a.win: "Ngài thắng!"
  bp2_yearly.8020.a.lose: "Ngài thua..."
  bp2_yearly.8040.t: "[crush.GetSheHe|U] giờ đã là một [crush.GetWomanMan|U]"
  bp2_yearly.8040.desc.intro: "Đã khá lâu rồi kể từ lần cuối ta gặp mối tình thầm kín thuở xưa của mình, [crush.GetFirstName]."
  bp2_yearly.8040.desc.mid.same_location: "Rồi ta thấy [crush.GetHerHim] bước vào [ROOT.Char.Custom('GetCourt')] của ta, vẫn rực rỡ như ngày nào, như một viễn cảnh của [ROOT.Char.GetFaith.PositiveAfterLife] nếu từng tồn tại. Tim ta bắt đầu đập loạn nhịp, lòng bàn tay ướt mồ hôi, giống hệt như khi ta còn là một [ROOT.Char.Custom('GirlBoy')].\n\nThật khó tin rằng [crush.GetSheHe] vẫn là [crush.Custom('GirlBoy')] mà ta từng say mê thuở nhỏ, và còn khó tin hơn khi cảm xúc của ta vẫn không hề thay đổi."
  bp2_yearly.8040.desc.mid.different_location: "Ngay cả sau từng ấy năm, hình ảnh [crush.GetHerHim] với tư cách là đối tượng của mối si mê thời thơ ấu vẫn chiếm lấy tâm trí ta trong những giờ khuya khoắt.\n\n[crush.GetSheHe|U] giờ đã là một [crush.GetWomanMan], và ta không sao ngăn được bản thân với tay lấy cây bút lông mỗi khi nghĩ đến [crush.GetHerHim]."
  bp2_yearly.8040.desc.outro: "Có lẽ cuối cùng ta cũng nên nói rõ tình cảm của mình."
  bp2_yearly.8040.a: "Ta sẽ thổ lộ tình yêu của mình!"
  bp2_yearly.8040.b: "Ta phải gạt bỏ những suy nghĩ trẻ con này."
  bp2_yearly.8040.c: "Chúng ta sẽ cưới nhau vào sáng mai!"
  bp2_yearly.8041.t: "Giờ [ROOT.Char.GetWomanMan|U] đã trưởng thành rồi"
  bp2_yearly.8041.desc.intro.same_location: "Ta bước vào [ROOT.Char.Custom('ResidenceBuilding')] của mình và thấy [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)] nhìn chằm chằm ta như một [crushee.GetWomanMan] hoang dã đang đói khát nhắm đến bữa ăn tiếp theo của [crushee.GetHerHis]. [crushee.GetSheHe|U] chen qua đám đông và"
  bp2_yearly.8041.desc.intro.different_location: "Giữa những bức thư quốc sự thường lệ, ta phát hiện ra một thứ vô cùng khác lạ. Một bức thư được gói cẩn thận bằng dải ruy băng đỏ như máu, con dấu sáp in hình một trái tim.\n\nThư đến từ [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)] và bày tỏ những tình cảm sâu sắc của [crushee.GetHerHis] dành cho ta."
  bp2_yearly.8041.desc.mid.same_location_marriage: "quỳ xuống dưới chân ta.\n\n"Ôi người yêu dấu [ROOT.Char.Custom('LoverPetName')] của ta, ta đã để ý đến ngươi kể từ khi chúng ta còn là những đứa trẻ. Tình yêu của ta trong sáng hơn bất kỳ thứ gì ngươi có thể tìm thấy trên thế gian này, và ta muốn trở thành [crushee.Custom('WifeHusband')] của ngươi nếu ngươi chấp nhận ta!""
  bp2_yearly.8041.desc.mid.different_location_marriage: "Sau khi kể lại quãng thời gian dài [crushee.GetHerHis] thầm thương trộm nhớ ta thuở nhỏ, bức thư tiếp tục bằng lời cầu hôn rằng [crushee.GetSheHe] muốn trở thành [crushee.Custom('WifeHusband')] của ta!\n\n\"Chúng ta sẽ nên duyên ngay khi người hồi đáp, tình yêu của em. Hãy chấp nhận em, và em sẽ dành cả đời mình để mang lại hạnh phúc cho người.\""
  bp2_yearly.8041.desc.mid.same_location_lovers: "kéo ta sang một góc yên tĩnh của [ROOT.Char.Custom('GetCourt')] và khẽ thì thầm bên tai ta.\n\n\"Em đã yêu người sâu đậm từ khi chúng ta còn là trẻ con. Em trao trọn tình yêu này cho người, nếu người chấp nhận.\""
  bp2_yearly.8041.desc.mid.different_location_lovers: "\n\n\"Tình yêu của em, em chỉ sống vì người, và em không thể chịu đựng được việc phải xa cách thêm nữa. Em đã yêu người từ khi em chỉ là một [crushee.Custom('GirlBoy')]. Xin hãy đáp lại tình cảm của em, và em hứa sẽ khiến người hạnh phúc mãi mãi.\""
  bp2_yearly.8041.a: "Ta đáp lại tình yêu của [crushee.GetHerHis]!"
  bp2_yearly.8041.b: "Ta không có cảm xúc như vậy."
  bp2_yearly.8042.t: "Tình Cảm Được Đáp Lại"
  bp2_yearly.8042.desc.intro: "Ta thổ lộ tình yêu của mình với [crush.GetFirstName]"
  bp2_yearly.8042.desc.mid.same_location: "và [crush.GetSheHe] nghiêng người thì thầm lại bên tai ta những tình cảm của [crush.GetHerHis]."
  bp2_yearly.8042.desc.mid.different_location: "qua một bức thư, và chỉ vài ngày sau [crush.GetHerHim] đã hồi âm rằng [crush.GetSheHe] cũng có cùng cảm xúc!"
  bp2_yearly.8042.desc.outro: "\n\nTa tràn ngập niềm hân hoan và vô cùng kinh ngạc khi tình yêu của chúng ta có thể vượt qua sự ngây ngô của tuổi trẻ để nở rộ thành một mối quan hệ trưởng thành."
  bp2_yearly.8042.a: "Thật tuyệt vời."
  bp2_yearly.8043.t: "Tình Cảm Bị Khước Từ"
  bp2_yearly.8043.desc: "Có vẻ như tình cảm của ta chỉ xuất phát từ một phía. [crush.GetFirstName|U] hoàn toàn không hứng thú với ta trên cương vị một người yêu, và ta chỉ còn lại nỗi đau tan vỡ."
  bp2_yearly.8043.a: "Có lẽ [crush.GetSheHe] vẫn có thể bị thuyết phục."
  bp2_yearly.8043.b: "Than ôi."
  bp2_yearly_8040_confess_crush: "Ngài và [crush.GetFirstName] có thể trở thành người yêu"
  bp2_yearly_8042_rejection: "[crushee.GetFirstName] sẽ được thông báo về sự từ chối của Ngài"

