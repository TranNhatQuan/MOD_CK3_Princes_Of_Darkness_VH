l_english:
 
  bp2_yearly.2000.t: "Theo Dấu Chân Tổ Tiên"
  bp2_yearly.2000.desc_dynasty: ""...và đó, thưa [story_teller.Custom2( 'RelationToMeShort', ROOT.Char )], là cách mà Đại Gia Tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U] vĩ đại đã ra đời! [ROOT.Char.Custom2( 'RelationToMeShort', root_house_founder )] của con, [root_house_founder.GetTitledFirstName], từng lừng danh vì là người [target_trait.GetName( GetPlayer )|l]."\n\n[ROOT.Char.Custom2( 'RelationToMeShort', story_teller )] của Ta, [story_teller.GetTitledFirstName], kết thúc câu chuyện về nguồn gốc tổ tiên của gia tộc. [story_teller.GetSheHe|U] thích dạy Ta lịch sử của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], nhưng hôm nay, cuộc trò chuyện của chúng Ta lại tràn ngập những câu chuyện đầy cảm hứng về [ROOT.Char.Custom2( 'RelationToMeShort', root_house_founder )] của Ta, người sáng lập Gia tộc."
  bp2_yearly.2000.desc: ""...và đó, thưa [ROOT.Char.Custom('GirlBoy')], là cách mà Gia tộc [ROOT.Char.GetHouse.GetBaseName|U] ra đời. [root_house_founder.GetTitledFirstName] từng nổi danh vì là người [target_trait.GetName( ROOT.Char )|l]."\n\n[ROOT.Char.Custom2( 'RelationToMeShort', story_teller )] của Ta, [story_teller.GetTitledFirstName], kết thúc câu chuyện về nguồn gốc tổ tiên của gia tộc. [story_teller.GetSheHe|U] thường dạy Ta lịch sử của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], nhưng hôm nay lại là những câu chuyện đầy cảm hứng về [ROOT.Char.Custom2( 'RelationToMeShort', root_house_founder )] của Ta, [root_house_founder.GetFirstNameNoTooltip], người sáng lập Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U]."
  bp2_yearly.2000.a: "Ta nên khôn ngoan mà noi theo [root_house_founder.GetHerHim]..."
  bp2_yearly.2000.a.negative: "Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U] không thể trở nên vĩ đại nếu không chấp nhận rủi ro..."
  bp2_yearly.2000.b: "Ta phải tạo nên sự khác biệt so với các bậc tiền nhân."
  bp2_yearly.2000.c: "Ta sẽ tự hào mang trên mình huy hiệu của Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!"
  bp2_yearly.2000.c.tt: "Ngài yêu cầu [GetCourtPositionType( 'court_artificer_court_position' ).GetNameNoTooltip] của mình, [artificer.GetName], rèn một món trang sức mang huy hiệu Gia tộc [GetPlayer.GetHouse.GetBaseNameNoTooltip]"
  bp2_yearly.2000.d: "Ta chỉ muốn ra ngoài chơi thôi!"

  bp2_yearly.2001.desc: ""...và đó, thưa [ROOT.Char.Custom('GirlBoy')], là câu chuyện về [ROOT.Char.Custom2( 'RelationToMe', ancestor )] của con, [ancestor.GetTitledFirstName]; [ancestor.GetSheHe] từng lừng danh vì là người [target_trait.GetName( GetPlayer )|l]."\n\n[ROOT.Char.Custom2( 'RelationToMe', story_teller )] của Ta, [story_teller.GetTitledFirstName], kết thúc những truyền thuyết về tổ tiên. [story_teller.GetSheHe|U] thích dạy Ta lịch sử gia tộc, nhưng cuộc trò chuyện hôm nay lại tràn ngập những câu chuyện kỳ diệu và đầy cảm hứng về những chiến công của gia đình Ta."
  bp2_yearly.2001.a: "Ta nên khôn ngoan mà noi theo [ancestor.GetHerHim]..."

  bp2_yearly.2002.desc: "[ROOT.Char.Custom2( 'RelationToMe', artificer )] của Ta, [artificer.GetFirstName], đã hoàn thành [newly_created_artifact.GetNameNoTooltip] mà Ta yêu cầu! [artificer.GetSheHe|U] trình nó cho Ta:\n\n\"Thưa bệ hạ, đây chính là [newly_created_artifact.GetDesc|l]\""
  bp2_yearly.2002.a: "Một tác phẩm xuất sắc, [artificer.GetFirstNameNoTooltip]!"


  house_founder_ring_name: "Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] $artifact_ring$"
  house_founder_ring_desc: "Một chiếc nhẫn thanh lịch với tay nghề tinh xảo. Trên đó nổi bật huy hiệu của Gia tộc [ROOT.Char.GetHouse.GetBaseName]. $house_founder_artifact_motto_desc$"
  house_founder_necklace_name: "Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] $artifact_necklace$"
  house_founder_necklace_desc: "[newly_created_artifact.GetDesc]\n\nHuy hiệu của Gia tộc [ROOT.Char.GetHouse.GetBaseName] được khắc ở chính giữa. $house_founder_artifact_motto_desc$"
  house_founder_brooch_name: "Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] $artifact_brooch$"
  house_founder_brooch_desc: "[newly_created_artifact.GetDesc]\n\nHuy hiệu của Gia tộc [ROOT.Char.GetHouse.GetBaseName] được khắc ở chính giữa. $house_founder_artifact_motto_desc$"
  house_founder_artifact_motto_desc: "\"#EMP [ROOT.Char.GetHouse.GetMotto]#!\" được khắc bằng nét chữ tinh xảo ở mặt sau."

 # Imaginary Friend Events
  gained_imaginary_friend: "Có Ngài Tưởng Tượng"
  imaginary_friend_significantly_increase_relationship: "Tình bạn với [THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] sẽ #difficulty_easy được cải thiện rất nhiều#!"
  imaginary_friend_increase_relationship: "Tình bạn với [THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] sẽ #p được cải thiện#!"
  imaginary_friend_decrease_relationship: "Tình bạn với [THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] sẽ bị #n tổn hại#!"
  please_imaginary_friend: "[THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] sẽ hài lòng"
  displease_imaginary_friend: "[THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] sẽ không hài lòng"

  bp2_yearly.2010.t: "Người Ngài Mới Bí Ẩn"
  bp2_yearly.2010.desc: "Ta ngồi một mình, lại chơi với [ROOT.Char.Custom( 'child_favorite_toy' )] của mình...\n\nCuộc sống của một [ROOT.Char.GetTitleAsNameNoTooltip] có rất nhiều thứ dư dả. Nhưng dư dả nhất trong tất cả chính là sự cô đơn. "
  bp2_yearly.2010.desc.landed: "Đặc biệt là khi [ROOT.Char.Custom2( 'RelationToMeShort', ruler_parent )] của Ta cai trị [ruler_parent.GetPrimaryTitle.GetNameNoTier], còn Ta thì gánh vác mọi trách nhiệm với [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
  bp2_yearly.2010.desc.parents_dead: "Đặc biệt là khi cả cha lẫn mẹ Ta đều đã qua đời."
  bp2_yearly.2010.outro: "\n\nTiếng bước chân khe khẽ vang lên bên tai Ta. Ngước nhìn, Ta thấy một đứa trẻ lạ mặt, trạc tuổi mình. [ROOT.Char.Custom('GetSheHeOpposite')|U] tò mò nhìn món đồ chơi của Ta.\n\n\"Ta không nhớ nổi tên mình...\" [ROOT.Char.Custom('GetSheHeOpposite')] lẩm bẩm, nước mắt bắt đầu dâng lên trong mắt [ROOT.Char.Custom('GetHerHisOpposite')].\n\n\"Không sao cả! Ta sẽ gọi ngươi là...\""
  bp2_yearly.2010.a: "[name_option_1.GetFirstNameNoTooltip]"
  bp2_yearly.2010.b: "[name_option_2.GetFirstNameNoTooltip]"
  bp2_yearly.2010.c: "[name_option_3.GetFirstNameNoTooltip]"

  bp2_yearly.2011.t: "Trò Chơi Tưởng Tượng"
  bp2_yearly.2011.desc: "Bạn ta, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], và Ta đang mải mê trong một trò chơi [ROOT.Char.Custom('BG_GameType_Generic')] đầy kịch tính thì [participant.GetFirstName], [ROOT.Char.Custom2( 'RelationToMe', participant )|l] của Ta, nghênh ngang bước tới với nụ cười khinh khỉnh trên mặt [participant.GetHerHis].\n\n\"Tự tập [ROOT.Char.Custom('BG_GameType_Generic')] một mình à — #EMP thảm hại thật!#! Chắc khi chẳng có Bạn Bè thì đó là thứ duy nhất ngươi làm được...\"\n\n[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] lặng lẽ nhìn chằm chằm, buồn bã và bối rối..."
  bp2_yearly.2011.a: "Đừng nói về [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] như thể [ROOT.Char.Custom('GetSheHeOpposite')] không có mặt ở đây!"
  bp2_yearly.2011.b: "Ngươi không có việc gì tốt hơn để làm sao?"
  bp2_yearly.2011.c: "Ta chỉ đang luyện tập thôi..."
  bp2_yearly.2011.bully.toast: "Nhận được $relation_bully$"

  bp2_yearly.2012.t: "Khẳng Định Quyền Lực"
  bp2_yearly.2012.desc: "[ROOT.Char.Custom2( 'RelationToMe', regent_scope )] của Ta, [regent_scope.GetFirstName], đã tìm cách chèn ép Ta trong mọi chuyện. Ta bắt đầu mệt mỏi với những âm mưu của [regent_scope.GetHerHis] nhằm chiếm lấy quyền lực vốn thuộc về Ta. Đáng buồn thay, nhiều cận thần của Ta đều đã nằm trong túi tiền của [regent_scope.GetHerHis].\n\n\"Cậu nên đứng lên đối đầu với [regent_scope.GetHerHim],\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] nói, bất ngờ xuất hiện bên cạnh Ta. \"Hoặc ít nhất là bày ra một tình huống khiến [regent_scope.GetHerHim] phải bẽ mặt.\""
  bp2_yearly.2012.a: "Đã đến lúc ta xuất hiện trước triều đình và khẳng định năng lực của mình."
  bp2_yearly.2012.a.success: "Ngài nhắc nhở triều đình về quyền uy của mình"
  bp2_yearly.2012.a.failure: "[regent_scope.GetFirstNameNoTooltip] khiến Ngài trở thành trò cười"
  bp2_yearly.2012.b: "Ta sẽ phá hoại yên ngựa của [regent_scope.GetHerHis]."
  bp2_yearly.2012.b.success: "Ngài khiến [regent_scope.GetFirstNameNoTooltip] bẽ mặt"
  bp2_yearly.2012.b.failure: "[regent_scope.GetFirstNameNoTooltip] phát hiện ra vụ phá hoại"
  bp2_yearly.2012.c: "Phá vỡ thế cân bằng quyền lực quá nguy hiểm."

  bp2_yearly.2013.t: "Ngươi Có Chắc Không?"
  bp2_yearly.2013.desc: "Bạn ta, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], đã cằn nhằn về hành vi của Ta suốt cả ngày. Cuối cùng, có vẻ như cuộc tranh cãi của chúng Ta đã đi đến cao trào.\n\n\"Ta nhận thấy dạo gần đây cậu ngày càng trở nên [target_trait.GetNameNoTooltip( ROOT.Char )|l]... Cậu không nghĩ rằng mình sẽ trở thành một [ROOT.Char.GetTitleAsNameNoTooltip|l] tốt hơn nếu thay vào đó là [opposite_trait.GetNameNoTooltip( ROOT.Char )|l] sao?\""
  bp2_yearly.2013.a: "Ta hoàn toàn hài lòng khi là một người [target_trait.GetNameNoTooltip( ROOT.Char )|l]."
  bp2_yearly.2013.b: "Ta nghĩ ngươi đúng một phần..."
  bp2_yearly.2013.c: "Ngươi nói đúng — ta sẽ hiệu quả hơn nếu trở thành [opposite_trait.GetNameNoTooltip( ROOT.Char )|l]."

  bp2_yearly.2014.t: "Một Mối Cảm Nắng Tiềm Tàng"
  bp2_yearly.2014.desc: "[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] và ta đang đi dạo trong khu vườn thì [ROOT.Char.Custom( 'GetSheHeOpposite' )] chuyển cuộc trò chuyện sang chủ đề tình yêu và khao khát.\n\n\"Ta biết trong lòng ngươi: ngươi thầm thích [crush.GetFirstName]. Ngươi nên gửi cho [crush.GetHerHim] một bức thư tràn đầy lời ca ngợi, tán dương [crush.GetHerHis] những phẩm chất [crush.Custom( 'RomanticComplimentAdjective' )] của [crush.GetHerHis].\"\n\n\"Nếu ngươi cảm thấy đặc biệt táo bạo, có lẽ ngươi thậm chí có thể nói rằng ngươi nhận ra [crush.GetHerHim] thực sự [crush.Custom( 'RomanticComplimentAdjective')] đến nhường nào...\""
  bp2_yearly.2014.a: "Người [crush.Custom( 'RomanticComplimentAdjective')] này sẽ biết được lòng ta!"
  bp2_yearly.2014.a.success: "[crush.GetFirstNameNoTooltip] nảy sinh cảm nắng với Ngài"
  bp2_yearly.2014.b: "Tốt hơn là đừng làm [crush.GetHerHim] hoảng sợ."
  bp2_yearly.2014.c: "Thật ra ta lại hứng thú với #EMP ngươi#! hơn..."
  bp2_yearly.2014.d: "Ta không thể làm vậy!"

  bp2_yearly.2015.t: "Người Ngài Động Viên"
  bp2_yearly.2015.desc: "\"Ta sẽ không bao giờ thoát khỏi tên [bully.Custom2('InsultNoun', ROOT.Char)] đó sao?!\" Ta than thở, cúi gằm đầu trong thất bại sau khi một lần nữa phải chịu sự chế giễu công khai từ kẻ bắt nạt ta, [bully.GetFirstName].\n\nKhi những giọt nước mắt nóng hổi lăn dài trên mặt, ta bất ngờ cảm nhận một cái chạm nhẹ lên vai. Đó là người bạn của ta, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. [ROOT.Char.Custom('GetSheHeOpposite')|U] luôn ở bên cạnh khi ta cần [ROOT.Char.Custom('GetHerHim')].\n\n\"Đã đến lúc ngươi phải đứng lên chống lại kẻ đáng ghét đó, [bully.GetFirstNameNoTooltip]. Ta đề nghị hãy bắt đầu một lời đồn về việc [bully.GetSheHe] thường làm gì với [bully.GetHerHis] [bully.Custom('child_favorite_toy')] khi ở một mình trong phòng riêng...\""
  bp2_yearly.2015.a: "Ta sẽ đứng lên và bảo vệ danh dự của mình."
  bp2_yearly.2015.a.success: "Ngài đánh cho [bully.GetFirstNameNoTooltip] một trận"
  bp2_yearly.2015.a.failure: "[bully.GetFirstNameNoTooltip] đánh cho Ngài một trận"
  bp2_yearly.2015.b: "Tin đồn đó sẽ lan nhanh như cháy rừng!"
  bp2_yearly.2015.b.success: "Ngài lan truyền thành công một tin đồn tai tiếng"
  bp2_yearly.2015.b.failure: "Tin đồn của Ngài không có tác dụng"
  bp2_yearly.2015.c: "Hậu quả sẽ quá nghiêm trọng..."

  bp2_yearly.2016.t: "Tình bạn Đơm Hoa"
  bp2_yearly.2016.desc: "Thật là một bản hòa tấu xa hoa của những mùi hương dễ chịu.\n\nTa tận hưởng việc thong thả dạo bước trong khu vườn. Chỉ ước rằng có ai đó ở đây để cùng chia sẻ những khoái cảm giác quan này. Cuộc sống của một [ROOT.Char.GetTitleAsNameNoTooltip|l] thật cô đơn.\n\nChưa kịp dứt dòng suy nghĩ, Bạn ta [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] bất ngờ nhảy ra sau một khóm hoa: \"Hãy hái [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] và làm vòng hoa đội đầu nào!\""
  bp2_yearly.2016.a: "Ta không thể mong gì hơn!"
  bp2_yearly.2016.b: "Ta không có tâm trạng cho những chuyện phù phiếm như vậy."

  bp2_yearly.2017.t: "Thức Trắng Đêm Khuya"
  bp2_yearly.2017.desc: "[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] và Ta đã vùi mình bên đống sách gần như suốt cả ngày. Nhưng thời gian đã về khuya. Ta đã quá đắm chìm vào chữ nghĩa và bắt đầu sao nhãng những bổn phận khác.\n\nKhi Ta khép sách lại, Bạn ta liền nhìn Ta bằng ánh mắt sắc bén.\n\n\"Nào, [ROOT.Char.GetFirstNameNoTooltip],\" [ROOT.Char.Custom('GetSheHeOpposite')] nói. \"Làm ơn ở lại đọc cùng ta. Cậu có một trí óc tò mò như vậy — ta không muốn thấy nó bị lãng phí vào bất cứ thứ gì ngoài tri thức.\""
  bp2_yearly.2017.a: "Có lẽ indulging thêm một chút cũng không hại gì..."
  bp2_yearly.2017.a.tt: "Điều này sẽ greatly cải thiện [education_focus|E] về [learning|E] của Ngài"
  bp2_yearly.2017.b: "Không, cơ thể cũng cần rèn luyện như trí óc."
  bp2_yearly.2017.b.tt: "Điều này sẽ greatly cải thiện [education_focus|E] về [martial|E] của Ngài"

  bp2_yearly.2018.t: "Người Tâm Sự Thân Thiết"
  bp2_yearly.2018.desc: "Ta ngồi một mình, xoa bóp thái dương mệt mỏi sau một ngày dài đầy công việc và trách nhiệm.\n\n\"Dạo này cậu có vẻ quá bận tâm, [ROOT.Char.GetFirstNameNoTooltip].\" Bạn ta, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], xuất hiện bên cạnh và nhẹ nhàng lên tiếng.\n\n\"Điều quan trọng là cậu phải dành thời gian cho bản thân hoặc tìm một người để tâm sự khi gánh nặng của cương vị [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] trở nên quá sức chịu đựng.\"\n\n\"Ta luôn sẵn sàng lắng nghe khi cậu cần,  Bạn củata. Nhưng đôi khi thật khó để nói thành lời những điều làm ta trăn trở. Có lẽ thơ ca sẽ là cách phù hợp để cậu trút bỏ gánh nặng đó?\""
  bp2_yearly.2018.a: "Một người tâm sự đáng tin cậy chính là điều ta cần."
  bp2_yearly.2018.b: "Ta sẽ thử sắp xếp suy nghĩ thành một tác phẩm nào đó..."
  bp2_yearly.2018.c: "Thứ ta thực sự cần là một chế độ huấn luyện nghiêm túc!"

  bp2_yearly.2019.t: "Những Lập Dị"
  bp2_yearly.2019.desc.intro: "[ROOT.Char.Custom2( 'RelationToMe', target_councilor )] của Ta, [target_councilor.GetTitledFirstName], tiến lại gần Ta và Bạn ta, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], khi chúng Ta đang trò chuyện.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [target_councilor.GetFirstNameNoTooltip] hỏi, nhíu mày suy tư. \"Nếu Ta có thể xin ngài một chút thời gian, Ta muốn bàn về "
  bp2_yearly.2019.desc.chaplain: "tình trạng các [ROOT.Char.Custom('GetFaithTemple')] trong lãnh địa.\""
  bp2_yearly.2019.desc.chaplain_unlanded: "tình trạng điện thờ gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\""
  bp2_yearly.2019.desc.steward: "chiến lược thu thuế của chúng ta.\""
  bp2_yearly.2019.desc.steward_unlanded: "chiến lược tài chính của gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\""
  bp2_yearly.2019.desc.marshal: "chế độ huấn luyện cho các tân binh.\""
  bp2_yearly.2019.desc.marshal_unlanded: "chế độ huấn luyện cho các tân binh.\""
  bp2_yearly.2019.desc.spymaster: "việc bố trí các mật vụ chủ chốt tại các triều đình ngoại bang.\""
  bp2_yearly.2019.desc.spymaster_unlanded: "việc bố trí các mật vụ chủ chốt trên khắp lãnh thổ.\""
  bp2_yearly.2019.desc.chancellor: "quan hệ của chúng ta với các lãnh bang láng giềng .\""
  bp2_yearly.2019.desc.chancellor_unlanded: "quan hệ của chúng ta với các gia tộc láng giềng .\""
  bp2_yearly.2019.desc.kurultai: "tình trạng đàn gia súc của chúng ta.\""
  bp2_yearly.2019.desc.outro: "\n\n\"Dĩ nhiên rồi!\" Ta đáp. \"Đi cùng ta nào, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. Ta muốn nghe ý kiến của ngươi về những vấn đề này.\"\n\n\"N-nhưng, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [target_councilor.GetFirstNameNoTooltip] cau mày, \"Ở đây ngoài hai chúng ta ra thì còn ai đâu...\""
  bp2_yearly.2019.a: "Tất nhiên là có chứ! [ROOT.Char.Custom('GetSheHeOpposite')|U] là cố vấn đáng tin cậy nhất của ta!"
  bp2_yearly.2019.a.tt: "Ngài chấp nhận mối quan hệ với [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"
  bp2_yearly.2019.b: "#EMP À...#! Ta lỡ lời. Hãy bàn chuyện này riêng tư."
  bp2_yearly.2019.b.tt: "Ngài chối bỏ mối quan hệ với [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"

  bp2_yearly.2020.t: "Người Ngài Bí Ẩn Trở Lại"
  bp2_yearly.2020.desc: "\"[ROOT.Char.GetFirstNameNoTooltip]... Thật vui khi lại được gặp cậu... Đã lâu rồi kể từ lần cuối chúng ta nói chuyện.\" Một giọng nói quen thuộc vang lên từ hành lang tối.\n\nGiật mình, cuối cùng Ta cũng nhận ra giọng nói ấy thuộc về ai... nhưng không... không thể nào! #EMP [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]?!#! Người Ngài tưởng tượng thuở ấu thơ của Ta?\n\n\"Là ta đây, [ROOT.Char.GetFirstNameNoTooltip]. Chúng ta đã cần nhau suốt những năm tháng ấy, và giờ đây chúng ta lại cần nhau một lần nữa.\"\n\n\"Ta cần cậu làm một việc cho ta — #EMP cho chúng ta#!. Cậu phải giết [ROOT.Char.Custom2( 'RelationToMeShort', murder_target )] của mình, [murder_target.GetFirstName]. Chỉ những điều tốt đẹp mới đến từ việc này thôi... rồi cậu sẽ thấy.\""
  bp2_yearly.2020.a: "Nếu ngươi khăng khăng..."
  bp2_yearly.2020.b: "Không! Ta sẽ không làm!"
  imaginary_friend_first_murder_scheme_tt: "Ngài nhận được một bonus #EMP cực lớn#! cho [scheme|E] [GetScheme('murder').GetTypeName] nhắm vào [murder_target.GetName]"
  imaginary_friend_future_murder_scheme_tt: "Ngài nhận được một bonus #EMP cực lớn#! cho [scheme|E] [GetScheme('murder').GetTypeName] nhắm vào [new_murder_target.GetName]"

 # Why haven't you started your murder scheme yet?
  bp2_yearly.2021.t: "Vụ Ám Sát Bị Trì Hoãn"
  bp2_yearly.2021.desc: ""Chậc, chậc, #EMP chậc!#!"\n\n"Chúng ta đã có thỏa thuận rồi, [ROOT.Char.GetFirstNameNoTooltip]. Ngươi đã đồng ý giết [new_murder_target.GetTitledFirstName] nhưng lại chẳng hề có chút nỗ lực nào để đạt được mục tiêu đó," [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] khiển trách ta vì sự thiếu hành động.\n\n"Ta thật sự rất thất vọng...""
  bp2_yearly.2021.a: "Ta sẽ bắt đầu ngay."
  bp2_yearly.2021.b: "Ta chỉ cần thêm chút thời gian để chuẩn bị..."
  bp2_yearly.2021.c: "Chúng ta #EMP xong rồi#!, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]!"

 # Murder Successful
  bp2_yearly.2022.t: "$bp2_yearly.2020.t$"
  bp2_yearly.2022.desc: ""#EMP Tốt lắm [ROOT.Char.GetFirstNameNoTooltip], tốt lắm#!..."\n\n"Ngươi đã làm rất tốt,  Bạn củata." [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] chúc mừng ta vì đã ám sát thành công [ROOT.Char.Custom2( 'RelationToMeShort', target )] quá cố của ta, [target.GetFirstName].\n\n"Cái thứ [target.Custom2('InsultAdjective', ROOT.Char)] [target.Custom2('InsultNoun', ROOT.Char)] đó xứng đáng với tất cả những gì [target.GetSheHe] phải nhận. Chúng ta là một đội #EMP tuyệt vời#!," [ROOT.Char.Custom('GetSheHeOpposite')] tiếp lời. "Ngươi thấy khá hơn rồi chứ? Đúng như ta đã hứa..."\n\n"
  bp2_yearly.2022.desc.next_target: ""Nhưng đừng chần chừ — còn nhiều niềm vui hơn đang chờ phía trước, Ngài hiền của ta. [new_murder_target.GetFirstName] đã #EMP chín muồi để bị tàn sát...#!"" 
  bp2_yearly.2022.a: "Cảm giác đó thật sự... #EMP tuyệt vời#!."
  bp2_yearly.2022.b: "Không! Làm ơn, hãy biến đi..."

 # Murder Invalidated
  bp2_yearly.2023.t: "Âm Mưu Ám Sát Bị Ngăn Chặn"
  bp2_yearly.2023.desc: ""Có vẻ như đã xảy ra... #EMP những tình huống ngoài dự liệu#!... xoay quanh âm mưu giết [target.GetTitledFirstName] của ngươi. Không sao cả. Chúng ta sẽ sớm sửa chữa sai lầm này."\n\n"
  bp2_yearly.2023.a: "$bp2_yearly.2020.a$"
  bp2_yearly.2023.b: "Ta chịu đủ rồi..."

 # Murder Failed
  bp2_yearly.2024.t: "$bp2_yearly.2023.t$"
  bp2_yearly.2024.desc: "$bp2_yearly.2023.desc$"
  bp2_yearly.2024.a: "$bp2_yearly.2020.a$"
  bp2_yearly.2024.b: "$bp2_yearly.2023.b$"

 # Devil Imaginary Friend Conclusion
  bp2_yearly.2025.t: "[ROOT.Char.GetTitleAsNameNoTooltip] Điên Loạn"
  bp2_yearly.2025.desc: "\"Đúng vậy, [ROOT.Char.GetFirstNameNoTooltip]! Ta rất tự hào về ngươi.\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] xuất hiện trước mặt ta.\n\nTa chỉ có thể tưởng tượng và #EMP tận hưởng#! âm thanh chói tai từ tiếng thét của [ROOT.Char.Custom2( 'RelationToMePossessive', target )] khi [target.GetSheHe] trút hơi thở cuối cùng đầy thảm hại!\n\n\"Ta tin rằng công việc của ta đã hoàn thành ở đây,\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] nói.\n\n...nhưng ta hầu như không nghe thấy [ROOT.Var('imaginary_friend_name').Char.GetHerHis] nói gì giữa tiếng cười điên loạn của chính mình."
  bp2_yearly.2025.a: "Ta khao khát #EMP máu!#!"
  imaginary_friend_mad_modifier_bribe_discount: "Mời [agents|E] tham gia [schemes|E] tốn ít hơn 50%"

 # Angle Imaginary Friend Conclusion
  bp2_yearly.2030.t: "Một Sứ Giả"
  bp2_yearly.2030.desc: ""#EMP [ROOT.Char.GetFirstNameNoTooltip]...#!"\n\nQuay người lại, ta thấy người  Bạn củamình, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], đang đứng phía sau — vẻ thanh thản hiện rõ trên gương mặt [ROOT.Char.Custom('GetHerHisOpposite')].\n\n"Ta có điều cần nói với ngươi. Suốt những năm qua, ta đã âm thầm dẫn dắt ngươi với tư cách là một người Ngài. Tuy nhiên, ta không chỉ là Ngài, mà còn là sứ giả của [ROOT.Char.GetFaith.HighGodName]."\n\n"Ta có một thỉnh cầu cuối cùng dành cho ngươi. Ngươi phải thắp một ngọn nến để tưởng niệm ta tại [target_holy_site.GetNameNoTier]. Chỉ khi đó, ta mới có thể rời đi và trở về [ROOT.Char.GetFaith.PositiveAfterLife].""
  bp2_yearly.2030.a: "Ta hiểu mình phải làm gì."
  bp2_yearly.2030.a.tt: "Chuyến [GetActivityType('activity_pilgrimage').GetNameNoTooltip] tiếp theo tới [target_holy_site.GetNameNoTier] rẻ hơn 50%"
  bp2_yearly.2030.b: "Thật sao? Có lẽ ta nên suy nghĩ lại lập trường của mình về những điều này..."
  bp2_yearly.2030.c: "Ta tin [ROOT.Char.GetFaith.HighGodName] sẽ nghe thấy lời cầu nguyện của ta từ nơi đây."
  imaginary_friend_pilgrimage_discount: "Tưởng niệm người Ngài tưởng tượng"

  bp2_yearly.2031.t: "Tưởng Niệm [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"
  bp2_yearly.2031.desc: "Giờ đây khi cuối cùng ta đã đến được [ROOT.Char.GetCurrentLocation.GetName], đã đến lúc ta tưởng nhớ người bạn của mình, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. [ROOT.Char.Custom('GetSheHeOpposite')|U] đã cùng ta vượt qua biết bao thời khắc khó khăn — quả là một phước lành trong cuộc đời ta. Ta nghi ngờ rằng mình có thể trở thành [ROOT.Char.GetWomanMan] như ngày hôm nay nếu không có [ROOT.Char.Custom('GetHerHimOpposite')].\n\nDù [ROOT.Char.Custom('GetSheHeOpposite')] có thể không còn ở bên ta nữa, ký ức về [ROOT.Char.Custom('GetHerHisOpposite')] sẽ mãi sống trong ta. Khi ta thắp một ngọn nến để tưởng nhớ [ROOT.Char.Custom('GetHerHisOpposite')], ta cảm nhận một cái chạm nhẹ lên vai mình. Ngọn lửa trên cây nến khẽ lay động. Một tiếng thì thầm yếu ớt vang lên: \"#EMP Tạm biệt [ROOT.Char.GetFirstNameNoTooltip]...#!\"\n\nCảm ơn, người bạn của ta."
  bp2_yearly.2031.a: "Hãy an nghỉ nhé, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]."
  imaginary_friend_pilgrimage_log_title: "[CHARACTER.GetName] đã tưởng nhớ người bạn tưởng tượng của [CHARACTER.GetHerHis]"
  imaginary_friend_pilgrimage_log: "[CHARACTER.GetName] đã tưởng nhớ người bạn tưởng tượng của [CHARACTER.GetHerHis] tại [PROVINCE.GetBaronyNameExplicitly]"
  honored_imaginary_friend_memory: "đã tưởng nhớ người bạn tưởng tượng"
  honored_imaginary_friend_memory_desc: "Ta đã tưởng nhớ người bạn tưởng tượng của mình, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], tại [ROOT.Var('location').GetProvince.GetNameNoTooltip]"
  honored_imaginary_friend_memory_desc_second_perspective: "Ngươi đã tưởng nhớ người bạn tưởng tượng của mình, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], tại [ROOT.Var('location').GetProvince.GetNameNoTooltip]"
  honored_imaginary_friend_memory_desc_third_perspective: "[owner.GetFirstName] đã tưởng nhớ người bạn tưởng tượng của [owner.GetHerHis], [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], tại [ROOT.Var('location').Province.GetNameNoTooltip]"

 # Neutral Imaginary Friend Conclusion
  bp2_yearly.2040.t: "Một Người Ngài Rời Đi"
  bp2_yearly.2040.desc: ""[ROOT.Char.GetFirstNameNoTooltip], ngươi đã trưởng thành thành một [ROOT.Char.GetTitleAsNameNoTooltip] thật đáng kinh ngạc," [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] nói, đôi mắt [ROOT.Char.Custom('GetHerHisOpposite')] ánh lên vẻ xúc động.\n\n"Ngươi không còn cần ta nữa. Đã đến lúc ta rời đi, để ngươi sống trọn vẹn cuộc đời huy hoàng của mình. Có rất nhiều người xung quanh sẵn sàng trở thành chỗ dựa cho ngươi."\n\n"
  bp2_yearly.2040.desc.lover: ""[lover.GetFirstNameNoTooltip] — người [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('lover') )] của ngươi — nhìn ngươi đầy quyến rũ. Có lẽ ngươi chưa từng nhận ra, nhưng đó là sự thật. [lover.GetSheHe|U] khao khát được chạm vào ngươi."\n\n"
  bp2_yearly.2040.desc.friend: "\"[friend.GetFirstNameNoTooltip] đã trở thành bằng hữu của ngài cách đây [ROOT.Char.Custom( 'GetPeriodOfTimeWord' )]. Có lẽ khi ấy [friend.GetSheHe] chưa nhận ra, nhưng lòng tận tâm của [friend.GetHerHis] dành cho ngài là vô hạn. Sự ủng hộ của [friend.GetHerHis] dành cho ngài chưa bao giờ lay chuyển.\""
  bp2_yearly.2040.a: "[lover.GetFirstNameNoTooltip] sẽ sưởi ấm ta khi ngươi vắng mặt."
  bp2_yearly.2040.b: "Ta nào hay biết về sự tận tụy của [friend.GetFirstNamePossessiveNoTooltip] dành cho ta!"

  bp2_yearly.2100.t: "Đặt Nền Móng"
  bp2_yearly.2100.desc: "Sỏi đá lạo xạo dưới chân khi [interlocutor.GetFirstName] và ta lê bước. Âm thanh ấy khiến ta liên tưởng đến những bức tường gồ ghề của các công trình khắp vùng đất.\n\n\"Ta muốn xây dựng thứ gì đó.\" [interlocutor.GetFirstNameNoTooltip] buột miệng nói, rõ ràng đang chia sẻ suy nghĩ của ta. \"Chúng ta nên dựng một thứ gì đó, ngay tại đây, ở chỗ này! Một mô hình nào đó!\" [interlocutor.GetSheHe|U] lập tức quan sát xung quanh để tìm vật liệu.\n\nKhi [interlocutor.GetFirstNameNoTooltip] chạy về phía đống gỗ gần đó, ta trầm ngâm suy nghĩ. Xây dựng #EMP thứ gì#!, chính xác là gì?"
  bp2_yearly.2100.a: "Có lẽ là một [ROOT.Char.Custom('GetDiplomacyBuilding')]?"
  bp2_yearly.2100.b: "Một [ROOT.Char.Custom('GetMartialBuilding')] để mài giũa kiếm thuật!"
  bp2_yearly.2100.c: "Hay một [ROOT.Char.Custom('GetStewardshipBuilding')] để học cách trân trọng tiền bạc?"
  bp2_yearly.2100.d: "Một thứ gì đó thật lớn, như một [ROOT.Char.Custom('GetIntrigueBuilding')]!"
  bp2_yearly.2100.e: "Trung tâm học thuật của riêng chúng ta, như một [ROOT.Char.Custom('GetLearningBuilding')]!"
  bp2_yearly.2100.a.tt: "Thúc đẩy [education_focus|E] về [diplomacy|E]"
  bp2_yearly.2100.b.tt: "Thúc đẩy [education_focus|E] về [martial|E]"
  bp2_yearly.2100.c.tt: "Thúc đẩy [education_focus|E] về [stewardship|E]"
  bp2_yearly.2100.d.tt: "Thúc đẩy [education_focus|E] về [intrigue|E]"
  bp2_yearly.2100.e.tt: "Thúc đẩy [education_focus|E] về [learning|E]"

  bp2_yearly.2110.t: "[GetTrait('humble').GetNameNoTooltip( ROOT.Char )] hay [GetTrait('arrogant').GetNameNoTooltip( ROOT.Char )]?"
  bp2_yearly.2110.desc: "Ta và [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )] của mình, [interlocutor.GetFirstName], đang luyện tập võ nghệ trong sân.\n\n\"#EMP Ugh!#!\" [interlocutor.GetSheHe] rên lên khi ta quật ngã [interlocutor.GetHerHim] xuống đất. [interlocutor.GetSheHe|U] ngước nhìn ta với ánh mắt đầy thán phục. \"Ngươi dùng vũ khí thật thành thạo, [ROOT.Char.GetFirstNameNoTooltip]. Ta ước gì mình có được dù chỉ một nửa kỹ năng của ngươi.\""
  bp2_yearly.2110.a: "\"Rồi ngươi sẽ làm được thôi, [interlocutor.GetFirstNameNoTooltip]. Nào, thử lại lần nữa!\""
  bp2_yearly.2110.b: "\"Ta sinh ra để trở thành chiến binh vĩ đại nhất của Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\""
  bp2_yearly.2110.c: "Giữ im lặng."

  bp2_yearly.2120.t: "[GetTrait('temperate').GetNameNoTooltip( ROOT.Char )] hay [GetTrait('gluttonous').GetNameNoTooltip( ROOT.Char )]?"
  bp2_yearly.2120.desc: "#EMP Keng, keng!#!\n\nChiếc thìa cạo xuống đáy bát khi ta ăn thêm một phần hầm nữa. Ta giải khát bằng những ngụm lớn từ chiếc cốc sắp cần được rót đầy lại. Ta thật sự không thể dừng lại.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Ngươi đang làm gì vậy? Ngươi không thấy mình đã... à thì, #EMP ăn quá nhiều#! dạo gần đây sao?\""
  bp2_yearly.2120.a: "\"Ngươi nói đúng. Ta cần kiềm chế sự háu ăn của mình.\""
  bp2_yearly.2120.b: "\"Yến tiệc #EMP quả thật#! làm nên một [ROOT.Char.GetTitleAsNameNoTooltip]!\""

  bp2_yearly.2130.t: "[GetTrait('generous').GetNameNoTooltip( ROOT.Char )] hay [GetTrait('greedy').GetNameNoTooltip( ROOT.Char )]?"
  bp2_yearly.2130.desc: "Hiếm hoi lắm ta mới có thể lén rời khỏi sự giám sát của các hầu cận và dành được vài khoảnh khắc quý giá cho riêng mình — một cơ hội để cảm thấy mình giống như những đứa trẻ khác.\n\nÔm chặt [ROOT.Char.Custom( 'child_favorite_toy' )] trong tay, ta dạo bước trên những con phố của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], thu vào mắt mọi cảnh tượng và mùi hương. Người người tấp nập; thương nhân rao bán hàng hóa.\n\nTa bắt gặp một đứa trẻ nông dân trông ốm yếu đang co ro trong góc một con hẻm."
  bp2_yearly.2130.a: "\"Này, mong rằng ngươi sẽ trân trọng [ROOT.Char.Custom( 'child_favorite_toy' )] này như ta đã từng.\""
  bp2_yearly.2130.a.flavor: "Ngài trao món đồ chơi của mình cho đứa trẻ"
  bp2_yearly.2130.b: "\"Những kẻ kém may mắn không xứng đáng với lòng hào phóng của ta.\""

  bp2_yearly.2140.t: "[GetTrait('honest').GetNameNoTooltip( ROOT.Char )] hay [GetTrait('deceitful').GetNameNoTooltip( ROOT.Char )]?"
  bp2_yearly.2140.desc: "Ta lặng lẽ rón rén đi dọc hành lang, trên tay là món ăn đêm yêu thích. Nhà bếp luôn chuẩn bị sẵn chúng vào những giờ đầu buổi sáng. Chẳng có gì tuyệt vời hơn việc thưởng thức một phần [ROOT.Char.Custom( 'FavoriteTreat' )] vừa mới được làm.\n\nKhi ta rẽ qua một góc hành lang, trước mắt ta hiện ra [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )] của ta, [interlocutor.GetFirstName], với đôi mắt ngái ngủ đang dụi đi cơn buồn ngủ. \"[ROOT.Char.GetFirstNameNoTooltip]! Ngài lại #EMP lục tung#! nhà bếp nữa sao?\"\n\nTa áy náy giấu món [ROOT.Char.Custom( 'FavoriteTreat' )] ra sau lưng."
  bp2_yearly.2140.a: "\"Vâng, [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )]. Ta không cưỡng lại được.\""
  bp2_yearly.2140.b: "\"Dĩ nhiên là không rồi! Ta chỉ là không ngủ được thôi.\""

  bp2_yearly.2150.t: "[GetTrait('lifestyle_herbalist').GetNameNoTooltip( ROOT.Char )] hay [GetTrait('lifestyle_gardener').GetNameNoTooltip( ROOT.Char )]?"
  bp2_yearly.2150.desc: "Suốt hai tuần qua, [GetCourtPositionType('court_physician_court_position').GetNameNoTooltip] của ta, [interlocutor.GetFirstName], đã dạy ta tất cả về việc trồng trọt, chăm sóc cây cối cũng như công dụng của từng loại trong y học.\n\nHôm nay, [interlocutor.GetSheHe] đưa ta đến xem những cuốn sách của [interlocutor.GetHerHis]. \"[interlocutor.Custom2( 'RelationToMeShort', ROOT.Char )] của ta, ngài đã tiến bộ vượt bậc. Tuy nhiên, đã đến lúc lựa chọn trọng tâm cho việc học của ngài.\"\n\n\"Ngài muốn tập trung vào chính nghệ thuật làm vườn, hay ngài hứng thú hơn với những tác dụng thực tiễn mà các loài cây này mang lại?\""
  bp2_yearly.2150.a: "Thảo dược là vô dụng nếu không hiểu rõ công dụng của chúng."
  bp2_yearly.2150.b: "Nuôi dưỡng sự sống mới là điều không gì sánh được."
  bp2_yearly.2150.c: "Ta sẽ không tiếp tục lãng phí thời gian với cây cối nữa."

  bp2_yearly.2160.t: "[GetTrait('compassionate').GetNameNoTooltip( ROOT.Char )] hay [GetTrait('sadistic').GetNameNoTooltip( ROOT.Char )]?"
  bp2_yearly.2160.desc: "Khi đang tản bộ qua [ROOT.Char.Custom('GetCourtyard')], ta nhìn thấy [interlocutor.GetFirstNameNoTooltip] đang giao đấu với vài đứa trẻ khác dưới sự chỉ dẫn của [marshal.GetTitledFirstName]. Đáng tiếc là [interlocutor.GetSheHe] không thể hiện quá tốt, và bất chợt bị đánh bật lùi, suýt nữa khiến ta ngã xuống.\n\n\"Thần xin lỗi, [interlocutor.Custom2( 'RelationToMeShort', ROOT.Char )] của ngài,\" [interlocutor.GetSheHe] nói khi [interlocutor.GetSheHe] đứng dậy, phủi bụi khỏi người.\n\nVết thương của [interlocutor.GetHerHis] vẫn còn rất mới."
  bp2_yearly.2160.a: "\"Đừng lo, [interlocutor.GetFirstNameNoTooltip]. Luyện tập rồi ngươi sẽ tiến bộ.\""
  bp2_yearly.2160.b: "\"Thêm đau đớn sẽ giúp ngươi không bao giờ quên sai lầm này!\""
  bp2_yearly.2160.b.flavor: "Ngài chà đất từ nền [ROOT.Char.Custom('GetCourtyard')] vào vết thương của [interlocutor.GetHerHis]"

