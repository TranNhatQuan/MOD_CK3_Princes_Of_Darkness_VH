l_english:

 # What's a Study Day Worth?
  bp2_yearly.3000.t: "Một Ngày Học Đáng Giá Bao Nhiêu?"
  bp2_yearly.3000.desc: "Giọng nói của [educator.Custom2('MyCharacterIntroduction', ROOT.Char)] cứ đều đều vang lên khi [educator.GetSheHe] giảng cho ta hết lần này đến lần khác về những phép tắc đúng đắn của một [ROOT.Char.GetLadyLord], xen lẫn là những trích dẫn nghiêm khắc từ [educator.GetFaith.ReligiousText|U]."
  bp2_yearly.3000.desc_no_educator: "Lật sang một trang sách khác, ta buồn bã nhìn những đứa trẻ khác trong [ROOT.Char.Custom('GetCourt')] đang vui đùa bên ngoài. Tiếng cười, những tiếng reo hò đầy hân hoan... Ta lại cúi nhìn bản sao của [ROOT.Char.GetFaith.ReligiousText|U] đang đặt trên bàn."
  bp2_yearly.3000.desc_ending: "\n\nDĩ nhiên, tất cả những điều này đều rất quan trọng cho tương lai của ta, nhưng... Liệu có ai thực sự để ý nếu ta lén ra ngoài chơi một lần — hay thậm chí là hai lần — không?"
  bp2_yearly.3000.a: "Tri thức là chìa khóa của vũ trụ!"
  bp2_yearly.3000.a.tt: "Có cơ hội để việc giáo dục của Ngài đạt kết quả tốt hơn"
  bp2_yearly.3000.b: "Bỏ ra một chút công sức cũng không hại gì."
  bp2_yearly.3000.c: "Học làm gì khi có thể #EMP chơi#!?"
 # SheHe Knows This Room
  bp2_yearly.3010.t: "[child.GetSheHe|U] Biết Căn Phòng Này"
  bp2_yearly.3010.desc: "Tim ta thắt lại khi nhìn đứa con yêu quý của mình, [child.Custom('GetDaughterSon')] [child.GetFirstName], đang ngây người nhìn khung cảnh xung quanh, một lần nữa bối rối và không còn nhận ra nơi này.\n\n[child.GetSheHe|U] đã từng bước những bước chân đầu tiên ngay trong chính căn phòng này, nhưng đó đã là chuyện từ rất lâu rồi. Những năm tháng dài đằng đẵng ở nơi đất khách quê người với tư cách con tin hẳn đã xóa nhòa ký ức trong tâm trí non nớt của [child.GetHerHis].\n\nMột lần nữa, [child.GetSheHe] nhìn quanh rồi khẽ thở dài."
  bp2_yearly.3010.a: "Ta cần nói chuyện với [child.GetHerHim]."
  bp2_yearly.3010.b: "[child.GetSheHe|U] rồi sẽ vượt qua thôi."
 # I've Walked This Floor
  bp2_yearly.3011.t: "Ta Đã Từng Bước Trên Nền Nhà Này"
  bp2_yearly.3011.desc: "Ở một góc nào đó trong tâm trí, ta #EMP biết#! rằng mình đã từng ở đây trước kia, nhưng ký ức thì mờ nhạt hơn cả những giấc mơ — mà những giấc mơ về quê nhà thì trước đây cũng đã từng lừa dối ta. Sau ngần ấy năm sống xa xứ với thân phận con tin, thật khó để phân biệt đâu mới là #EMP quê hương#! và đâu thì #EMP không phải#!...\n\nLò sưởi này có luôn ở đây không? Hành lang này có luôn tối tăm như vậy không? Ta thực sự không biết."
  bp2_yearly.3011.desc_parent: "\n\nKhi ánh mắt ta gặp ánh mắt của [parent.GetMotherFather] bên kia căn phòng, ta thấy nỗi buồn của chính mình phản chiếu trong đôi mắt [parent.GetHerHis], và chúng ta ôm chặt lấy nhau."
  bp2_yearly.3011.desc_no_parent: "\n\nKhi ánh mắt ta gặp ánh mắt của [parent.GetMotherFather] bên kia căn phòng, [parent.GetSheHe] chỉ khẽ thở dài rồi quay đi."
  bp2_yearly.3011.a: "Giờ ta đã là một kẻ xa lạ."
  bp2_yearly.3011.b: "Ta vẫn thuộc về nơi này!"
  bp2_yearly.3010.a.tt: "[child.GetFirstNameNoTooltip] đã đón nhận sự khác biệt của [child.GetHerHis]"
  bp2_yearly.3010.b.tt: "[child.GetFirstNameNoTooltip] vẫn gắn bó với nguồn cội của [child.GetHerHis]"
