  bp2_adult_education.1012.t: "Ngôn Ngữ Của Bậc Thầy"
  bp2_adult_education.1012.desc: "[teacher.GetFirstName|U], một trong những giảng viên được kính trọng nhất tại [location.GetBaronyNameExplicitly], rõ ràng là người ngoại quốc: giọng nói và cử chỉ của [teacher.GetHerHis] đã tố cáo [teacher.GetHerHim] là một người [teacher.GetCulture.GetName].\n\nDù không thực sự cần thiết cho việc học, việc học tiếng mẹ đẻ của [teacher.GetHerHis] sẽ giúp xây dựng mối quan hệ đặc biệt với [teacher.GetFirstNameNoTooltip], và chắc chắn đây là một khoản đầu tư tốt cho tương lai."
  learned_language_of_teacher_log: "[CHARACTER.GetTitledFirstName|U] đã học được ngôn ngữ của một giảng viên Đại học"
  learned_language_of_teacher_log_title: "Học Được Ngôn Ngữ Của Bậc Thầy"
  bp2_adult_education.1012.a: "Điều này sẽ giúp ta gần gũi hơn với Magister!"
  bp2_adult_education.1012.b: "Ta sẽ cần ai đó giúp đỡ..."
  bp2_adult_education.1012.b.tt: "Mọi thứ đều có thể với những mối quan hệ phù hợp!"
