  bp2_adult_education.9000.t: "Diễn Giả Khách Mời"
  bp2_adult_education.9000.desc: "\"Các sinh viên, hôm nay chúng ta có một diễn giả đáng kính đến tham gia!\" thầy giáo [teacher.GetFirstName] của Ta thốt lên. \"Hãy chào đón [guest_speaker.GetFullName] — học giả uyên thâm bậc nhất về giáo lý [guest_speaker.GetFaith.GetAdjective] tại [location.GetName].\"\n\n\"Xin chào.\" [guest_speaker.GetFirstNameNoTooltip] mở lời đầy trang nghiêm, trong khi [guest_speaker.Custom('quirk_pos_pp')]. \"Hôm nay chúng ta sẽ tìm hiểu [guest_speaker.Custom('education_conversation_subject')], và mối liên hệ của nó với bản chất của [guest_speaker.GetFaith.HighGodName].\"\n\nCác sinh viên khác liền ngồi thẳng lưng và lấy bút lông ra. Chuyện này chắc sẽ còn kéo dài."
  bp2_adult_education.9000.a: "Cái gì cơ!? Đó là tư tưởng dị giáo!"
  bp2_adult_education.9000.a.success: "Ngài nghiền nát [guest_speaker.GetFirstNameNoTooltip] bằng #EMP sự thật#! và #EMP logic#!"
  bp2_adult_education.9000.a.failure: "Ngài bị hộ tống ra khỏi giảng đường một cách không chút nể nang"
  defeated_guest_speaker_log: "[CHARACTER.GetShortUIName|U] đã đánh bại hoàn toàn [TARGET_CHARACTER.GetShortUIName] trong một cuộc tranh luận"
  defeated_guest_speaker_log_title: "Đánh Bại Diễn Giả Khách Mời"
  defeated_by_guest_speaker_log: "[TARGET_CHARACTER.GetShortUIName|U] đã đánh bại hoàn toàn [CHARACTER.GetShortUIName] trong một cuộc tranh luận"
  defeated_by_guest_speaker_log_title: "Bị Diễn Giả Khách Mời Đánh Bại"
  bp2_adult_education.9000.b: "#EMP *Cắm cúi ghi chép điên cuồng*#!"
  bp2_adult_education.9000.c: "\"Ai cũng biết nó liên quan đến bản chất của [guest_speaker.GetFaith.random_EvilGodNames]!\""
  bp2_adult_education.9000.d: "Không ở lại được, Ta có hẹn với vài ly [ROOT.Char.Custom('GetExpensiveDrink_Singular')] rồi!"
  bp2_adult_education.9000.e: "À ha? Hm. Ồ? Thật hấp dẫn, phải, phải..."
  you_learn_something: "Ngài Học Được Điều Gì Đó"
  you_are_hampered: "Việc Học Bị Cản Trở"
 
  bp2_adult_education.9100.t: "Bữa Tiệc Của Đám Nông Dân"
  bp2_adult_education.9100.desc: "Ta đột ngột bị phân tâm khỏi việc học khuya bởi một tiếng #EMP *Rầm*#! lớn, tiếp theo là một tiếng #EMP *ẦM*#! chói tai và một âm thanh #EMP *Choang*#! nghe rõ là rất đắt tiền. Rốt cuộc chuyện quái gì đang xảy ra vậy!?\n\nNguồn cơn của sự náo loạn hóa ra là hai tên nông dân, [ROOT.Char.GetFaith.HighGodName] biết bằng cách nào chúng chui được vào đây, đang ngấu nghiến tu sạch một thùng [ROOT.Char.Custom('GetExpensiveDrink_Singular')] của trường đại học!\n\n\"Thế này mới #EMP *hic*#! dạy cho chúng một bài học!\" một tên gào lên. \"Phải đó, chúng nghĩ mình hơn bọn ta chỉ vì chúng biết #EMP đọc chữ!#!\" tên còn lại phụ họa."
  bp2_adult_education.9100.read: "Tội nghiệp những linh hồn khốn khổ... Ta sẽ đảm bảo các ngươi học được cách đọc!"
  bp2_adult_education.9100.a: "Ta cũng đang cần vài người hầu để khiêng sách..."
  bp2_adult_education.9100.b: "\"Này nông dân — mang thêm cốc đến đây, ta gọi các sinh viên khác!\""
  bp2_adult_education.9100.c: "Tốt hơn hết là báo cho các thầy trước khi họ phá nát chỗ này..."
  changed_my_life_opinion: "Đã Thay Đổi Cuộc Đời Ta"
 
  bp2_adult_education.9200.t: "Giờ Nghỉ Học Đầy Cám Dỗ"
  bp2_adult_education.9200.desc: "Thư viện vắng tanh, chỉ có Ta và [student_flirt.GetFirstName]. Ta đã đọc đi đọc lại cùng một trang trong [SCOPE.Custom('RandomInformativeTextName')] hết lần này đến lần khác, nhưng vô ích — Ta không thể tập trung nổi.\n\nKhông phải khi [student_flirt.GetSheHe] cứ khẽ cắn đầu bút lông của [student_flirt.GetHerHis], trong lúc nhẹ nhàng lướt ngón tay dọc theo [student_flirt.GetHerHis] [student_flirt.Custom('ObjectifiedFeature')] — và còn nhìn thẳng vào mắt Ta #EMP không hề chớp#! khi làm vậy!\n\n\"Em nghĩ chúng ta xứng đáng có một chút... nghỉ ngơi, hả [ROOT.Char.Custom('RomanticComplimentNoun')] của em?\" [student_flirt.GetSheHe|U] thì thầm."
  bp2_adult_education.9200.a: "Phải. Tập trung. Vào. Sách."
  bp2_adult_education.9200.b: "\"Muốn làm chuyện đó trên mái trường không?\""
  bp2_adult_education.9200.c: "Có lẽ đã đến lúc nghiên cứu giải phẫu theo cách thực hành rồi!"
  bp2_adult_education.9200.d: "Thế này vô ích quá... Ta cần nghỉ ngơi..."
  blew_off_some_steam_opinion: "Cùng Nhau Xả Stress"
 
  bp2_adult_education.9300.t: "Những Ý Tưởng Lập Dị"
  bp2_adult_education.9300.desc: "\"Nghe Ta nói đây!\" [eccentric_student.GetFirstName] hét lên đầy cuồng loạn. \"Nếu anh đọc kỹ giữa các dòng trong [SCOPE.Custom('RandomInformativeTextName')] thì sẽ thấy ngay thôi; chỉ cần kết hợp [eccentric_student.Custom('ThrowableObjectArticle')], một [eccentric_student.Custom('RandomWeirdObject')], và một [eccentric_student.Custom('GetObjectToBalanceOnNose')] — đồng thời tuân thủ các nguyên lý của [eccentric_student.Custom('EruditeTopic')] — tin Ta đi, #EMP sẽ thành công!#!\"\n\nCó lẽ để [eccentric_student.GetFirstNameNoTooltip] học liên tục ba mươi sáu tiếng đồng hồ không phải là một ý hay..."
  bp2_adult_education.9300.eccentric: "Quá rõ ràng rồi còn gì!"
  bp2_adult_education.9300.a: "Ta không có thời gian cho mấy thứ nhảm nhí của anh đâu, [eccentric_student.GetFirstNameNoTooltip]."
  bp2_adult_education.9300.b: "Nói tiếp đi! Kể cho Ta nghe #EMP mọi thứ#!!"
  bp2_adult_education.9300.c: "Ta... đi đây."
 
  bp2_adult_education.9400.t: "Chuyến Thăm Của [local_ruler.GetTitleAsNameNoTooltip]"
  bp2_adult_education.9400.desc: "\"Tất cả sinh viên chú ý!\" thầy giáo [teacher.GetFirstName] của Ta hô lớn, theo sau là [local_ruler.GetTitledFirstName]. \"Ân nhân của chúng ta [local_ruler.GetTitledFirstNameNoTooltip] đã hạ cố đến thăm — [local_ruler.GetSheHe] là người cai trị vùng đất này — hãy cư xử cho đúng mực!\"\n\n\"Ồ, các ngươi đang tranh luận về [local_ruler.Custom('education_conversation_subject')] sao? Ta cũng rất yêu thích chủ đề đó! Mong là việc học của các ngươi đang tiến triển tốt.\" [local_ruler.GetTitleAsNameNoTooltip] nói trong khi [local_ruler.Custom('quirk_pos_pp')].\n\n[local_ruler.GetTitleAsNameNoTooltip] có quyền ban đặc ân cho những sinh viên như Ta, có lẽ Ta nên nhân cơ hội này lên tiếng..."
  bp2_adult_education.9400.friend: "\"Thật vui được gặp lại ngài!\""
  bp2_adult_education.9400.liege: "\"À, thần dân trung thành của ta. Ngươi có phiền nhắc mọi người ta là ai không?\""
  bp2_adult_education.9400.tier: "\"Các ngươi nên lấy làm vinh dự khi có một [root_scope.GetTitleAsNameNoTooltip] đến dự!\""
  bp2_adult_education.9400.tier.toast: "[root_scope.GetTitleAsNameNoTooltip] thăm Trường Đại Học của Ngài"
  bp2_adult_education.9400.gold_lots: "\"Ta muốn thực hiện một khoản quyên góp hào phóng!\""
  bp2_adult_education.9400.gold_lots.toast: "Sinh Viên Đại Học Quyên Góp Rất Nhiều Vàng"
  bp2_adult_education.9400.drink: "\"Chán thật. Ta ra thị trấn đây!\""
  bp2_adult_education.9400.gold: "\"Xin hãy nhận món quà khiêm tốn này.\""
  bp2_adult_education.9400.gold.toast: "Sinh Viên Đại Học Quyên Góp Vàng"
  bp2_adult_education.9400.nothing: "\"Ngài thật là [local_ruler.Custom('ComplimentAdjective')].\""
  available_friend_lover: "Lựa chọn này khả dụng vì Ngài là [friends|E] hoặc [lovers|E]"
  available_liege: "Lựa chọn này khả dụng vì Ngài là [liege|E] của [local_ruler.GetFirstNamePossessive]"
  available_higher_tier: "Lựa chọn này khả dụng vì [rank|E] của Ngài cao hơn [local_ruler.GetFirstName]"
