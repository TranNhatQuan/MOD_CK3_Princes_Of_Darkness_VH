 # EVENTS
  goliardic_shenanigans_effect_tt: "Ngài tham gia vào [goliardic_shenanigans|E]!"
  bp2_adult_education.0005.t: "Bị Hủy Bỏ"
  bp2_adult_education.0005.desc: "Những hy vọng và ước mơ phát triển bản thân của Ta đã bị nghiền nát.\n\nKhi ngồi trong xà lim, Ta chỉ có thể mơ màng tưởng tượng về tất cả tri thức mà mình lẽ ra đã có thể tiếp thu. Mọi thứ sẽ phải đợi đến một dịp khác."
  bp2_adult_education.0005.a: "Sớm thôi."
  bp2_adult_education.0009.t: "Kết Thúc"
  bp2_adult_education.0009.desc: "Đây thực sự là một trải nghiệm tuyệt vời!\n\nKhi rời đi, Ta thậm chí không thể tưởng tượng được số lượng học giả uyên bác đang học tập tại [province.GetName], chiều sâu tư duy của họ, và bề rộng nghiên cứu của họ! Chỉ cần được sống trong cùng môi trường ấy cũng đã khiến Ta trở thành một con người tốt hơn rất nhiều, và với lượng kiến thức mới có được, Ta trở về nhà trong sự mãn nguyện."
  bp2_adult_education.0009.desc_teacher_1: "\n\nTuy nhiên, trong thời gian lưu lại, Ta đã trở nên rất thân thiết với một trong những người thầy của mình, [teacher_1.GetFirstName], và Ta thực sự không nỡ rời xa."
  bp2_adult_education.0009.desc_teacher_2: "\n\nMặt khác, người thầy [teacher_2.GetFirstName] đã để lại ấn tượng sâu sắc trong Ta, và Ta muốn dành thêm thời gian bên nhau."
  bp2_adult_education.0009.a: "Tri thức là sức mạnh!"
  bp2_adult_education.0009.b: "[teacher_1.GetFirstNameNoTooltip] sẽ là một bổ sung tuyệt vời cho [ROOT.Char.Custom('GetCourt')] của ta."
  bp2_adult_education.0009.c: "[teacher_2.GetFirstNameNoTooltip], ta cần ngươi dạy ta thêm nữa!"
  bp2_adult_education.0009.d: "Vị trí của người thầy là bên cạnh học trò."
  bp2_adult_education.0009.e: "Chúng ta sẽ giữ liên lạc."
  imprisoned_adult_education: "[GetActivityType('activity_adult_education').GetName] Bị Gián Đoạn Bởi Việc Bị Giam"
  imprisoned_adult_education_desc: "[GetActivityType('activity_adult_education').GetName] của Ta đã bị gián đoạn khi Ta bị giam bởi [jailor.GetTitledFirstName]"
  imprisoned_adult_education_desc_second_perspective: "[GetActivityType('activity_adult_education').GetName] của Ngài đã bị gián đoạn khi Ngài bị giam bởi [jailor.GetTitledFirstName]"
  imprisoned_adult_education_desc_third_perspective: "[owner.GetTitledFirstNamePossessive|U] [GetActivityType('activity_adult_education').GetName] đã bị gián đoạn khi [owner.GetSheHe] bị giam bởi [jailor.GetTitledFirstName]"
  completed_adult_education: "Hoàn Thành [GetActivityType('activity_adult_education').GetName]"
  completed_adult_education_desc: "Ta đã hoàn thành [GetActivityType('activity_adult_education').GetName] tại [ROOT.Var('education_destination').GetProvince.GetName]"
  completed_adult_education_desc_second_perspective: "Ngài đã hoàn thành [GetActivityType('activity_adult_education').GetName] tại [ROOT.Var('education_destination').GetProvince.GetName]"
  completed_adult_education_desc_third_perspective: "[owner.GetTitledFirstName|U] đã hoàn thành [GetActivityType('activity_adult_education').GetName] của [owner.GetHerHis] tại [ROOT.Var('education_destination').GetProvince.GetName]"
  bp2_adult_education.0010.t: "Đến [location.GetBaronyNameExplicitlyNoTooltip]"
  bp2_adult_education.0010.desc_uni: "Cuối cùng ta cũng đã đến trước cổng [location.GetBaronyNameExplicitly], nơi đặt trụ sở của Đại Học danh tiếng.\n\nMọi tri thức đều được lưu giữ trong những đại sảnh linh thiêng này, và các học giả lừng danh từ khắp thế giới tụ hội tại đây để gìn giữ và phát triển một kho tàng trí tuệ thực sự. Và chẳng bao lâu nữa, ta sẽ trở thành một phần trong số họ!"
  bp2_adult_education.0010.desc_religious: "Cuối cùng ta cũng đã ở đây, bước đi trong những đại sảnh thiêng liêng của [location.GetBaronyNameExplicitly], trung tâm tôn kính của mọi tri thức trong thế giới [location.GetCounty.GetFaith.GetAdjective|U].\n\nTa còn rất nhiều điều phải học từ những nam nữ tu sĩ thánh thiện tụ họp bên trong những bức tường cổ kính này! Còn những cuộn thư và sách cổ thì sao chứ?"
  bp2_adult_education.0010.desc_end: "\n\nDĩ nhiên, các trung tâm văn hóa lớn cũng là những khu chợ sôi động, cung cấp mọi #EMP cám dỗ#! mà một sinh viên có thể mong muốn..."
  bp2_adult_education.0010.desc_very_very_far: "\n\nKhi cân nhắc mọi khả năng, dân địa phương nhìn Ta với ánh mắt vừa tò mò vừa bối rối. Rõ ràng là không phải ngày nào họ cũng thấy những người như chúng ta — [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
  bp2_adult_education.0010.a: "Đến lúc bắt đầu rồi."
 # An Intellectual Debate
  bp2_adult_education.1000.t: "Cuộc Tranh Luận Trí Thức"
  bp2_adult_education.1000.desc: "[location.GetBaronyNameExplicitly] thường là nơi diễn ra những cuộc tranh luận gay gắt giữa giảng viên và sinh viên. Sau một bài giảng đặc biệt khai sáng của thầy [teacher.GetTitledFirstName], Ta bị kéo vào một cuộc tranh luận như vậy với một sinh viên khác, [student.GetFirstName].\n\n\"KHÔNG! Cậu nói chẳng có lý gì cả! Cậu đang hoàn toàn xuyên tạc quan điểm của Nhà Triết học!\" Ta hét lên.\n\n\"#EMP Cậu#! mới là kẻ hoàn toàn mê muội!\" [student.GetSheHe|U] đáp trả.\n\nTừ khóe mắt, Ta thấy [teacher.GetFirstNameNoTooltip] nhìn chúng Ta với vẻ trầm tư hiện rõ trên gương mặt [teacher.GetHerHis]."
  bp2_adult_education.1000.a: "Nhưng, như bậc Thầy đã nói..."
  bp2_adult_education.1000.a.tt: "Ngài trích dẫn kinh điển"
  bp2_adult_education.1000.b: "Lập luận của Ta đúng, và cậu không thể phản bác!"
  bp2_adult_education.1000.b.tt: "Ngài cố làm rối trí [student.GetHerHim] bằng những vần điệu khiêu khích"
  bp2_adult_education.1000.b.success: "[student.GetFirstNameNoTooltip] cứng họng"
  bp2_adult_education.1000.b.success.tt: "Ngài đã đánh bại [student.GetFirstNameNoTooltip] bằng trí tuệ"
  bp2_adult_education.1000.b.failure: "[student.GetFirstNameNoTooltip] không bị lay chuyển"
  bp2_adult_education.1000.b.failure.tt: "Ngài không thuyết phục được [student.GetFirstNameNoTooltip]"
  bp2_adult_education.1000.c: "Thôi vậy, ta còn nhiều sách phải đọc."
  bp2_adult_education.1000.a.success: "[student.GetFirstNameNoTooltip] bị thuyết phục"
  bp2_adult_education.1000.a.success.tt: "Ngài đã thuyết phục được [student.GetFirstNameNoTooltip]"
  bp2_adult_education.1000.a.failure: "Ngài thừa nhận rằng [student.GetFirstNameNoTooltip] đúng"
  bp2_adult_education.1000.a.failure.tt: "[student.GetFirstNameNoTooltip] đã áp đảo Ngài"
  university_debate_won_log: "[CHARACTER.GetTitledFirstName|U] đã đánh bại [TARGET_CHARACTER.GetTitledFirstName] trong một cuộc tranh luận trí thức"
  university_debate_won_log_title: "Chiến Thắng Tranh Luận Trí Thức"
 # The Language of the People/of Knowledge/of the Master
  bp2_adult_education.1010.t: "Ngôn Ngữ Của Dân Chúng"
  bp2_adult_education.1010.desc: "Việc học của Ta tại [location.GetBaronyNameExplicitly] tiến triển tốt, nhưng Ta không khỏi cảm thấy hơi bị tách biệt khỏi cộng đồng xung quanh.\n\nTa là kẻ lạ trên vùng đất xa lạ, và ngôn ngữ của những miền đất này — [location.GetCounty.GetCulture.GetLanguage.GetName] — như được người dân địa phương sử dụng trong quán rượu và chợ búa, vừa kỳ lạ vừa bí ẩn đối với Ta. Ngay cả giữa các Ngài học và giảng viên, nhiều người sinh ra và lớn lên tại đây, và việc có thể chia sẻ tri thức trực tiếp hơn với họ chắc chắn sẽ cải thiện chất lượng việc học của Ta."
  learned_language_of_uni_log: "[CHARACTER.GetTitledFirstName|U] đã học được ngôn ngữ được sử dụng tại Đại học"
  learned_language_of_uni_log_title: "Học Được Ngôn Ngữ Đại Học"
  bp2_adult_education.1010.a: "Ta cần học tập chăm chỉ để hòa nhập!"
  bp2_adult_education.1010.b: "Thơ ca sẽ là người thầy của ta!"
  bp2_adult_education.1010.c: "Ta không thể để việc này làm xao nhãng."
  bp2_adult_education.1010.d: "Còn người thầy nào tốt hơn chính dân chúng?"
  bp2_adult_education.1010.d.tt: "Ngài cố học ngôn ngữ qua lầu xanh, quán rượu và chợ búa."
  bp2_adult_education.1010.b.success: "Ngài đã làm chủ ngôn ngữ địa phương"
  bp2_adult_education.1010.b.success.tt: "Ngài đã thành thạo ngôn ngữ địa phương"
  bp2_adult_education.1010.b.failure: "Ngài vẫn chưa hiểu được ngôn ngữ địa phương"
  bp2_adult_education.1010.b.failure.tt: "Ngôn ngữ địa phương vẫn ngoài tầm với của Ngài!"
  bp2_adult_education.1011.t: "Ngôn Ngữ Của Tri Thức"
  bp2_adult_education.1011.desc: "Những người từ khắp thế giới đã biết tụ họp tại các trường đại học và trung tâm tôn giáo để tiếp thu và chia sẻ tri thức, nhưng điều đó chỉ có thể thực hiện được nhờ sự hiểu biết chung về một ngôn ngữ phổ quát, thường là một ngôn ngữ cổ dùng trong nghi lễ, mang đậm quyền uy truyền thống.\n\nĐáng tiếc thay, Ta không mấy quen thuộc với ngôn ngữ học thuật được sử dụng tại [location.GetBaronyNameExplicitly], khiến việc học của Ta trở nên khó khăn hơn nhiều so với mức cần thiết.\n\nĐây không phải là một nỗ lực dễ dàng, nhưng chẳng phải giáo dục bậc cao vốn là như vậy sao?"
  learned_language_of_lithurgy_log: "[CHARACTER.GetTitledFirstName|U] đã học được ngôn ngữ phụng vụ của Đại học"
  learned_language_of_lithurgy_log_title: "Học Được Ngôn Ngữ Phụng Vụ"
