 # The Goliards
  bp2_adult_education.1020.t: "Những Goliard"
  bp2_adult_education.1020.desc: "Khi Ta rời lớp sau một buổi giảng sâu sắc, đầy gợi mở của thầy [teacher.GetFirstName], sự chú ý của Ta bị thu hút bởi những tràng cười hỗn loạn và tiếng la hét vang lên từ bên ngoài."
  bp2_adult_education.1020.desc.lusty_poetry: "\n\nMột nhóm sinh viên ồn ào do [student.GetFirstName] dẫn đầu đang tiến lại gần, tất cả cùng hát một khúc ca #EMP trụy lạc#! về những cuộc phiêu lưu tình ái của họ — mà phải nói là rất chi tiết."
  bp2_adult_education.1020.desc.drinking_poetry: "\n\n[student.GetFirstName], rõ ràng đã say khướt và gần như không đứng vững trên đôi chân của [student.GetHerHis], vậy mà vẫn khiến đám đông cổ vũ thích thú bằng những vần thơ tao nhã ca ngợi thú vui rượu chè — điều mà giới giáo sĩ địa phương vốn quá quen thuộc."
  bp2_adult_education.1020.desc.satyre_poetry: "\n\nThứ mà Ta chỉ có thể mô tả là một #EMP đám rước#! sinh viên đang tiến đến, với [student.GetFirstName] đi đầu. Vừa cố giữ vẻ nghiêm túc, họ vừa luân phiên trích dẫn các đoạn từ [location.GetCounty.GetFaith.ReligiousText] và những bản nhại báng bổ các nghi thức của nó."
  bp2_adult_education.1020.desc.carmina_burana: "\n\n\"#EMP O Fortuna velut luna statu variabilis, semper crescis aut decrescis#!\" [student.GetFirstName] cất tiếng hát, được bao quanh bởi một đám đông reo hò."
  bp2_adult_education.1020.desc.dice: "\n\nMột nhóm sinh viên ầm ĩ vây quanh [student.GetFirstName] và một người khác mà Ta không nhận ra, khi họ đang chơi xúc xắc trên bậc thềm của [location.Custom('GetLocationFaithTemple')]."
  bp2_adult_education.1020.desc.donkey: "\n\n[student.GetFirstName] đang dắt theo một con #EMP lừa#!, vừa đi vừa hát ca ngợi nó. Một đám sinh viên đáp lại sau mỗi câu hát: \"He Haw, Sire Ass, He haw!\""
  bp2_adult_education.1020.desc.end: "Khi họ nhận ra Ta, họ đồng thanh hô vang về phía Ta: \"THAM GIA ĐI! THAM GIA ĐI!\"\n\nCái cau mày trên gương mặt của [teacher.GetFirstNamePossessiveNoTooltip] đã nói lên tất cả suy nghĩ của [teacher.GetHerHis] về toàn bộ sự việc."
  participated_in_goliardy_log: "[CHARACTER.GetTitledFirstName|U] đã theo [TARGET_CHARACTER.GetFirstName] và những Goliard khác trong các cuộc ăn chơi của họ"
  participated_in_goliardy_log_title: "Tham Gia Goliard"
  bp2_adult_education.1020.a: "Thật là #EMP VÔ LÝ#!!"
  bp2_adult_education.1020.b: "Tại sao không chứ...?"
  bp2_adult_education.1020.c: "Còn phải hỏi sao?"
  bp2_adult_education.1020.d: "Có lẽ lần sau."
  goliard_shenanigans_get_lovers_pox.tt: "Ngài mắc phải [GetTrait('lovers_pox').GetName( GetNullCharacter )]"
  bp2_adult_education.1020.c.tt: "Ngài đã tham gia những trò quậy phá ra trò!"
  bp2_adult_education.1020.b.tt: "Nếm thử cái gọi là \"Lối Sống Goliard\" thì cũng đâu có tệ, phải không?"
 # One of the GirlsBoys
  bp2_adult_education.1030.t: "Một Trong Số [ROOT.Char.Custom('GirlBoyPlural')|U]"
  bp2_adult_education.1030.desc: "Các trường đại học và trung tâm giáo dục bậc cao luôn là những tổ ong sôi động của giao tiếp xã hội.\n\nTrong những hành lang vang vọng này, sinh viên đều là đồng môn, đều là những kẻ học việc trên con đường tìm kiếm tri thức — vì thế, việc kết bạn và cảm thấy mình là một phần của cộng đồng có thể rất hữu ích."
  bp2_adult_education.1030.desc_alcohol: "\n\nÍt nhất đó là những suy nghĩ đầu tiên của Ta khi [student.GetFirstName] tiến lại gần, mùi [student.Custom('RegionalAlcoholicDrink')] phảng phất trong hơi thở của [student.GetHerHis].\n\n\"Tham gia cùng ta và Bạn Bè ta đi, [ROOT.Char.GetFirstNameNoTooltip]! Hãy chứng minh sức mạnh của một [ROOT.Char.GetTitleAsNameNoTooltip] bằng cách uống nhiều chén hơn bất kỳ ai, và chúng ta sẽ coi ngươi là người của bọn ta!\""
  bp2_adult_education.1030.desc_fallback: "\n\nÍt nhất đó là những suy nghĩ đầu tiên của Ta khi [student.GetFirstName] tiến lại gần, với một nụ cười đầy ẩn ý trên gương mặt của [student.GetHerHis].\n\n\"Tham gia cùng ta và Bạn Bè ta đi, [ROOT.Char.GetFirstNameNoTooltip]! Hãy chứng minh sức bền của một [ROOT.Char.GetTitleAsNameNoTooltip] bằng cách tiệc tùng suốt cả đêm! Khi đó, chúng ta sẽ coi ngươi là người của bọn ta!\""
  bp2_adult_education.1030.a: "...có lẽ?"
  bp2_adult_education.1030.b: "Chơi luôn!"
  bp2_adult_education.1030.b.tt: "Họ rất ấn tượng với Ngài!"
  bp2_adult_education.1030.a.success: "Những sinh viên khác hô vang tên Ngài"
  bp2_adult_education.1030.a.success.tt: "Họ thích Ngài"
  bp2_adult_education.1030.a.failure: "Những sinh viên khác cười nhạo nỗ lực yếu ớt của Ngài"
  bp2_adult_education.1030.a.failure.tt: "Ngài không gây được ấn tượng"
  bp2_adult_education.1030.c: "Không, cảm ơn."
  one_of_the_boys_log: "[CHARACTER.GetTitledFirstName|U] đã gây ấn tượng với người bạn học [TARGET_CHARACTER.GetFirstName] bằng những cuộc vui của [CHARACTER.GetHerHis]."
  one_of_the_boys_log_title: "Một Trong Số Chúng Ta"
 # Schools of Thought
  bp2_adult_education.1040.t: "Các Trường Phái Tư Tưởng"
  bp2_adult_education.1040.desc: "Những hành lang của Đại học [location.GetBaronyNameExplicitly] thường vang vọng các cuộc tranh luận giữa sinh viên và giảng viên, trong đó một số leo thang thành những mối kình địch khét tiếng — như giữa [teacher_1.GetFirstName] và [teacher_2.GetFirstName].\n\nKhi Ta bắt gặp họ hôm nay, họ — như thường lệ — đang la hét vào mặt nhau, cố chứng minh lĩnh vực nghiên cứu của ai phù hợp hơn để bàn luận về [teacher_1.Custom('EruditeTopic')]. Tuy nhiên, điều ít thấy hơn là họ đột nhiên nhận ra Ta đang đến gần và yêu cầu #EMP Ta#! phải chọn lập trường."
  bp2_adult_education.1040.a: "[teacher_1.GetFirstNameNoTooltip] đúng."
  bp2_adult_education.1040.b: "[teacher_2.GetFirstNameNoTooltip] theo đuổi tri thức xứng đáng nhất."
  bp2_adult_education.1040.c: "Cả hai ngành đều có giá trị to lớn."
  bp2_adult_education.1040.c.success: "Họ bị thuyết phục và hài lòng với luận điểm của Ngài"
  bp2_adult_education.1040.c.success.tt: "Ngài đã gây ấn tượng với các thầy"
  bp2_adult_education.1040.c.failure: "Họ cho rằng Ngài chỉ đang làm mọi thứ thêm rối"
  bp2_adult_education.1040.c.failure.tt: "Các giảng viên không mấy ấn tượng"
  bp2_adult_education.1040.d: "Sao chúng ta không mang cuộc tranh luận này ra quán rượu?"
  bp2_adult_education.1040.d.success: "Họ đạt được thỏa thuận nhờ Ngài"
  bp2_adult_education.1040.d.success.tt: "Ngài đã xoa dịu các giảng viên"
  bp2_adult_education.1040.d.failure: "Cuộc tranh luận leo thang"
  bp2_adult_education.1040.d.failure.tt: "Các giảng viên đổ lỗi cho Ngài"
  bp2_adult_education.1040.d.tt: "Ngài có thể làm dịu [teacher_1.GetFirstNameNoTooltip] và [teacher_2.GetFirstNameNoTooltip] bằng đồ ăn ngon và rượu"
  bp2_adult_education.1040.e: "Việc này có thực sự quan trọng không?"
  sided_with_teacher_log: "[CHARACTER.GetTitledFirstName|U] đã đứng về phía [TARGET_CHARACTER.GetFirstName] trong một tranh chấp học thuật"
  sided_with_teacher_log_title: "Đứng Về Phía Giảng Viên"
  balanced_teachers_opinions_log: "[CHARACTER.GetTitledFirstName|U] đã giúp các giáo viên của [CHARACTER.GetHerHis] đạt được sự đồng thuận trong một cuộc tranh luận học thuật"
  balanced_teachers_opinions_log_title: "Tìm Được Sự Cân Bằng Giữa Các Giảng Viên"
 # Foreigners in This Land
  bp2_adult_education.1050.t: "Những Kẻ Ngoại Quốc Trên Vùng Đất Này"
  bp2_adult_education.1050.desc: "[location.GetBaronyNameExplicitly] thực sự là một trung tâm học thuật thu hút sinh viên từ khắp nơi trên thế giới!\n\nSuy nghĩ này đến với Ta khi Ta nhận ra rằng bản thân Ta và nhiều đồng môn theo đuổi tri thức khác, bao gồm [student_1.GetFirstName] và [student_2.GetFirstName], đều là người ngoại quốc tại [location.GetBaronyNameExplicitlyNoTooltip]. Ta tự hỏi liệu có cách nào để tận dụng điều này không..."
  bp2_adult_education.1050.a: "Chúng ta đều có thể học hỏi lẫn nhau!"
  bp2_adult_education.1050.b: "Nâng cốc vì sự khác biệt của chúng ta!"
  bp2_adult_education.1050.c: "Ta chỉ đến đây để học."
 # Yes and No
  bp2_adult_education.1060.t: "Có và Không"
  bp2_adult_education.1060.desc: "Những nghiên cứu chuyên sâu của Ta về giáo lý [ROOT.Char.GetFaith.GetAdjective] tại [location.GetBaronyNameExplicitly] đã khiến Ta đối mặt với vô số câu hỏi mới, mà không phải câu nào cũng có câu trả lời rõ ràng. Một số thậm chí còn có những cách giải thích mâu thuẫn!\n\nĐức tin có cần được bổ sung bởi lý trí hay không?\nĐức tin chỉ liên quan đến những điều vô hình hay không?\nLiệu chúng ta có thể biết được điều vô hình hay không?\n\n#EMP Có hay không?#!"
  bp2_adult_education.1060.a: "Hẳn phải có ý nghĩa trong những mâu thuẫn ấy..."
  bp2_adult_education.1060.b: "Câu trả lời phải đến từ trải nghiệm thực nghiệm!"
  bp2_adult_education.1060.c: "Đầu ta đau quá."
  bp2_adult_education.1060.a.tt: "Ngài nhận được một Thánh Tích Sách"
  sic_et_non_log: "[CHARACTER.GetTitledFirstName|U] đã viết một cuốn sách về các vấn đề thần học dựa trên ghi chép của [CHARACTER.GetHerHis] trong thời gian học tập"
  sic_et_non_log_title: "Viết Sách"
  bp2_adult_education.1060.a.crit_success: "Những suy tư của Ngài khai sáng đến mức có thể giúp ích cho các học giả tương lai"
  bp2_adult_education.1060.a.crit_success.tt: "Mọi thứ giờ đã sáng tỏ"
  bp2_adult_education.1060.a.success: "Ngài cảm thấy khôn ngoan hơn và gần với chân lý hơn"
  bp2_adult_education.1060.a.success.tt: "Ngài đã đạt được một chút tiến bộ"
  bp2_adult_education.1060.a.failure: "Ngài còn bối rối hơn cả trước đây"
  bp2_adult_education.1060.a.failure.tt: "Ngài không thể hiểu ra được"
  sic_et_non_book_name: "Có và Không"
  sic_et_non_book_desc: "Cuốn sách này là kết quả của những suy ngẫm thần học và triết học của [book_creator.GetTitledFirstNamePossessive] trong thời gian học tập tại [location.GetBaronyNameExplicitly].\n\nNó chứa đựng một cuộc thảo luận sâu sắc và chặt chẽ về những mâu thuẫn trong thần học [book_creator.GetFaith.GetAdjective], cũng như cách tốt nhất để dung hòa chúng."
  bp2_adult_education.1060.b.tt: "Câu hỏi ban nãy là gì nhỉ?"
 # The Debate
  bp2_adult_education.1070.t: "Cuộc Tranh Luận"
  bp2_adult_education.1070.desc: "Việc giảng dạy tại [location.GetBaronyNameExplicitly] phần lớn diễn ra dưới hình thức truyền miệng, và học viên được khuyến khích rèn luyện khả năng hùng biện cũng như thể hiện tiến bộ trong học tập thông qua các cuộc tranh luận trước Bạn Bè và thầy cô.\n\nHôm nay, [teacher.GetFirstName] đã yêu cầu Ta và [student.GetFirstName] đứng ở hai phía đối lập về chủ đề [teacher.Custom('EruditeTopic')] để thảo luận."
  bp2_adult_education.1070.a: "Hãy để Ta bắt đầu từ [ROOT.Char.GetFaith.ReligiousText|U]. Như mọi người đều biết..."
  bp2_adult_education.1070.b: "Ta không thể nói rằng Ngài sai, nhưng nếu Ta nói vậy thì có phải Ta đang nói dối không?"
  bp2_adult_education.1070.c: "Ta cứ tưởng [student_2.GetFirstNameNoTooltip] cũng muốn thử sức chứ!"
  won_a_debate_log: "[CHARACTER.GetTitledFirstName|U] đã áp đảo [TARGET_CHARACTER.GetFirstName] trong một cuộc tranh luận học thuật trên lớp"
  won_a_debate_log_title: "Tranh Luận Trên Lớp"
  bp2_adult_education.1070.a.success: "Lập luận của Ngài vững vàng hơn"
  bp2_adult_education.1070.a.success.tt: "Ngài đã thắng cuộc tranh luận!"
  bp2_adult_education.1070.a.failure: "Ngài bị áp đảo"
  bp2_adult_education.1070.a.failure.tt: "Ngài đã thua cuộc tranh luận!"
  bp2_adult_education.1070.b.success: "Ngài khéo léo làm rối vấn đề đến mức đối thủ phải đầu hàng"
  bp2_adult_education.1070.b.failure: "Ngài không thể làm rối trí [student.GetFirstNamePossessiveNoTooltip]"
 # A Matter of Faith?
  bp2_adult_education.1080.t: "Vấn Đề Đức Tin?"
  bp2_adult_education.1080.desc: "[location.GetBaronyNameExplicitly] là một trung tâm học thuật danh tiếng, nơi quy tụ giáo viên và học viên từ khắp nơi.\n\nTa vốn không mấy để tâm cho đến hôm nay, khi một lời dẫn chiếu tôn giáo từ [teacher.GetFirstName] khiến Ta choáng váng vì nó báng bổ và trái ngược hoàn toàn với mọi điều Ta từng được dạy. Điều đó phơi bày [teacher.GetHerHim] là một [teacher.GetFaith.GetAdherentNameNoTooltip], đúng nghĩa là một [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)], và Ta không biết mình nên cảm thấy thế nào."
  bp2_adult_education.1080.a: "Ta không quan tâm, miễn là [teacher.GetSheHe] còn có điều gì đó để dạy."
  bp2_adult_education.1080.b: "Đó là bổn phận [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] của Ta khi trêu chọc tên [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)] này!"
  bp2_adult_education.1080.c: "Làm sao một [teacher.GetFaith.GetAdherentNameNoTooltip] lại có thể dạy Ta điều gì có giá trị chứ?!"
  bp2_adult_education.1080.d: "Có lẽ [teacher.GetSheHe] có những câu trả lời mà Ta vẫn luôn thiếu..."
  bp2_adult_education.1080.e: "[teacher.GetFirstNameNoTooltip] hẳn còn rất nhiều điều để dạy Ta!"
  bp2_adult_education.1080.b.tt: "Trò đùa này mang lại kết quả ngoài dự đoán"
 # To Have a Gander
  bp2_adult_education.1090.t: "Xem Cho Biết"
  bp2_adult_education.1090.desc: "\"Hôm nay,\" thầy giáo của chúng ta, [teacher.GetFirstName], bắt đầu, \"chúng ta sẽ nghiên cứu giải phẫu của một con chim ưng.\"\n\nMột làn sóng xôn xao đầy phấn khích lan khắp giảng đường, khi tất cả chúng Ta chiêm ngưỡng con chim đội mũ che mắt đang đứng hiên ngang trên cánh tay đeo găng của thầy.\n\n\"Rất nhiều điều có thể học được khi nghiên cứu cơ thể động vật, như người xưa từng dạy. Có ai muốn giúp Ta trong buổi trình diễn giải phẫu không?\""
  bp2_adult_education.1090.a: "Ta xin tình nguyện giúp!"
  bp2_adult_education.1090.a.tt: "Hành động này đi ngược lại niềm tin của Ngài"
  bp2_adult_education.1090.b: "Thưa thầy, để em xử lý con vật này..."
  bp2_adult_education.1090.b.tt: "Ngài nhanh chóng tháo mũ che và thả nó ra trong lớp để quan sát cảnh hỗn loạn diễn ra!"
  bp2_adult_education.1090.c: "Thật thú vị."

 #APAs
  apa_leveraging_language_skills_title: "Khả năng diễn giải bản thảo bằng [second.Custom('GetFaithSacredLanguage')] của [first.GetShortUINamePossessive|U] được ca ngợi"
