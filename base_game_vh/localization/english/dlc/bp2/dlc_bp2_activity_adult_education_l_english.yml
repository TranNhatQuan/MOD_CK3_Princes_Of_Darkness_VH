  education_study_phase: "$activity_adult_education$"
  education_study_phase_desc: "Một học kỳ dành riêng cho việc dự lớp, tham gia tranh luận và sống cuộc sống của một sinh viên."
  study_hard_intent: "Học Hết Mình"
  study_hard_intent_desc: "Ngài đã đi một chặng đường dài để học tập tại đây, và Ngài dự định tận dụng tối đa cơ hội này."
  university_revelry_intent: "Lối Sống Goliard"
  university_revelry_intent_desc: "Ngài muốn trải nghiệm cuộc sống sinh viên, cả trong lẫn ngoài khuôn viên Đại Học."
  activity_adult_education_predicted_cost: "Chi phí của một [GetActivityType( 'activity_adult_education' ).GetNameNoTooltip] chủ yếu bị ảnh hưởng bởi các [activity_options|E] Ngài lựa chọn."
  activity_adult_education_desc: "Dành một học kỳ tại một trung tâm học thuật danh tiếng, học hỏi từ những bộ óc uyên bác nhất của vùng đất.\n\nĐây là cơ hội để bù đắp những thiếu sót trong quá trình giáo dục thời trẻ, đồng thời hoàn thiện bản thân toàn diện hơn, phát triển kỹ năng, học năng lực mới và xây dựng các mối quan hệ quan trọng."
  activity_adult_education_host_desc: "$BULLET_WITH_TAB$Có thể nâng cấp [education_trait|E]\n$BULLET_WITH_TAB$Có thể nhận điểm [skill|E]\n$BULLET_WITH_TAB$Có thể nhận [lifestyle_experience|E]\n$BULLET_WITH_TAB$Có thể nhận [lifestyle_traits|E]\n$BULLET_WITH_TAB$Có thể nhận Sách [artifacts|E]\n$BULLET_WITH_TAB$Có thể chiêu mộ một nhân vật có kỹ năng cao\n$BULLET_WITH_TAB$[trait_level_track_xp|E] cho [GetTrait('confucian_education').GetName( GetNullCharacter )] tại các Đại Học [GetReligionByKey('confucianism_religion').GetAdjective]"
