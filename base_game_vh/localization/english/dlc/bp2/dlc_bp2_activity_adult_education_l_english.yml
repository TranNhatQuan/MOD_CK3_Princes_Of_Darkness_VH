  bp2_adult_education.1011.d: "Chính các bậc Thầy sẽ dạy ta!"
  bp2_adult_education.1011.d.success: "Ngài đã làm chủ ngôn ngữ phụng vụ"
  bp2_adult_education.1011.d.success.tt: "Ngài đã thành thạo ngôn ngữ phụng vụ"
