l_english:
  bp2_yearly.8070.t: "Giờ chơi"
  bp2_yearly.8070.desc.intro: "Cuối cùng ta cũng được ở một mình để chơi đùa, và dĩ nhiên ta lấy"
  bp2_yearly.8070.desc.mid.horses: "chú ngựa gỗ trung thành ra khỏi hộp đồ chơi và mơ về việc cưỡi nó tiến vào một giải đấu vĩ đại."
  bp2_yearly.8070.desc.mid.puppets: "những con rối nhỏ quen thuộc ra khỏi hộp đồ chơi để chơi đùa. Thật dễ chịu khi hoàn toàn kiểm soát cuộc sống bé nhỏ của chúng, và dựng nên các kịch bản theo đúng ý muốn của ta."
  bp2_yearly.8070.desc.mid.board_game: "bàn cờ [ROOT.Char.Custom('BG_GameType_Generic')] yêu thích ra khỏi rương đồ chơi. Không gì tuyệt hơn việc chứng minh trí tuệ của ta và nhìn mọi quân cờ dần đi vào đúng vị trí — và không có đối thủ nào tốt hơn chính ta."
  bp2_yearly.8070.desc.mid.teetotum: "con quay khó lường ra khỏi hộp đồ chơi. Có điều gì đó thật thỏa mãn khi nhìn nó xoay tròn, đặt cược xem nó sẽ dừng lại ở đâu."
  bp2_yearly.8070.desc.mid.marbles: "những viên bi tuyệt đẹp ra khỏi hộp đồ chơi. Quả thật không gì gắn  kết bạn Bè hơn một túi bi và một chút trí tưởng tượng!"
  bp2_yearly.8070.desc.outro: "\n\nNhưng rồi, [other_child.GetFirstName|U] tiến lại gần với vẻ mong đợi và hỏi: \"Mình chơi cùng được không?\""
  bp2_yearly.8070.a: "Ta muốn chơi một mình hơn."
  bp2_yearly.8070.b: "Có Ngài thì mọi thứ vui hơn!"
  bp2_yearly.8070.b.success: "Hai người có khoảng thời gian vui vẻ"
  bp2_yearly.8070.b.failure: "Hai người cãi cọ om sòm"
  bp2_yearly.8071.t: "Kỷ vật tuổi thơ"
  bp2_yearly.8071.desc.intro: "Khi lục lọi đồ đạc cũ để tìm chuyện chính sự, ta bất chợt bắt gặp một thứ quen thuộc."
  bp2_yearly.8071.desc.mid.horses: "Một chú ngựa gỗ nhỏ nằm trong góc khuất của tủ áo, vùi lấp giữa quần áo. Nó nhẹ và bé đến lạ trong tay ta. Giờ đây đôi tay này đã là tay của một [ROOT.Char.GetWomanMan] — thời gian đã trôi đi đâu rồi?\n\n"
  bp2_yearly.8071.desc.mid.puppets: "Một bộ sưu tập nhỏ những con rối phủ bụi nằm im lìm dưới đáy chiếc rương cũ. Màu sắc đã phai, quần áo rách nát vì nhiều năm được yêu thương sử dụng, và còn nhiều hơn nữa vì bị lãng quên.\n\n"
  bp2_yearly.8071.desc.mid.board_games: "Bàn cờ [ROOT.Char.Custom('BG_GameType_Generic')] đầu tiên của ta nằm dưới đáy rương, thiếu ít nhất một nửa quân cờ và hư hỏng nặng. Mỗi vết nứt, mỗi mảnh sứt mẻ đều là một câu chuyện thời thơ ấu mà ta ngỡ đã quên.\n\n"
  bp2_yearly.8071.desc.mid.spinning_top: "Một con quay nhỏ nằm lẫn giữa những thư từ chính sự. Đã có thời chẳng điều gì quan trọng với ta hơn món đồ chơi này, giờ đây nó chỉ còn là một vật chặn giấy. Sao ta lại để mọi thứ thành ra thế này?\n\n"
  bp2_yearly.8071.desc.mid.marbles: "Ta tìm thấy một túi da nhỏ đựng bi, phủ đầy bụi, giấu giữa những đồ đạc bị bỏ quên khác. Nhiều viên đã hỏng hoặc thất lạc, nhưng những viên còn lại với ta còn quý giá hơn vàng.\n\n"
  bp2_yearly.8071.desc.mid.other_child_alive: "Ta nhớ đã trải qua biết bao buổi chiều hè chơi cùng [other_child.GetFirstName], khi ấy chẳng điều gì khác mattered. Ta tự hỏi giờ [other_child.GetSheHe] ra sao, hay liệu [other_child.GetSheHe] còn nhớ những trò chơi chúng ta từng chia sẻ không.\n\n"
  bp2_yearly.8071.desc.mid.other_child_dead: "Ta nhớ tuổi thơ mình tràn ngập tiếng cười của [other_child.GetFirstName] khi chúng ta chơi cùng nhau. Đó là tiếng cười ta sẽ không bao giờ quên — cũng không bao giờ được nghe lại nữa.\n\n"
  bp2_yearly.8071.desc.outro: "Với món đồ chơi yêu thích giờ đang nằm trong tay, ta có cảm giác như đang nắm giữ chính tuổi thơ của mình."
  bp2_yearly.8071.a.puppet: "Ta có thể lại làm người điều khiển con rối!"
  bp2_yearly.8071.a.gambler: "Ta luôn biết khi nào nên đặt cược an toàn."
  bp2_yearly.8071.a.marbles: "Ta phải gắn kết mọi người, như những viên bi của ta đã từng."
  bp2_yearly.8071.a: "Ta nên sống tiếp những giấc mơ tuổi thơ."
  bp2_yearly.8071.b: "Xem thử [other_child.GetFirstNameNoTooltip] giờ ra sao!"
  bp2_yearly.8071.c: "Giờ ta đã là một con người khác — và như vậy cũng tốt."
  bp2_yearly.8080.t: "Sức Quyến Rũ Của [ward.Custom('GirlBoy')|U]"
  bp2_yearly.8080.desc: "Dù đã cố gắng thế nào, tình cảm của [target.Custom2('MyCharacterIntroduction', ROOT.Char)] vẫn luôn lẩn tránh ta, nhưng ta cảm nhận được mình đang tiến rất gần. Với việc ta trực tiếp dạy dỗ [ward.Custom2('MyCharacterIntroduction', ROOT.Char)], có lẽ ta vẫn còn cơ hội thành công trong cuộc theo đuổi này!\n\nChỉ cần một cú hích nhỏ, có lẽ [ward.GetFirstNameNoTooltip] sẽ ca ngợi những đức tính của ta, và chứng minh rằng ta có cách khiến trẻ con quý mến — điều mà bất kỳ [target.GetWomanMan] nào cũng khó lòng cưỡng lại."
  bp2_yearly.8080.a: "Làm thôi!"
  bp2_yearly.8080.a.likes.tt: "[ward.GetFirstNameNoTooltip] nói tốt về Ngài"
  bp2_yearly.8080.a.dislikes.tt: "[ward.GetFirstNameNoTooltip] nói xấu về Ngài"
  bp2_yearly.8080.b: "Ta sẽ không hạ mình đến mức này."
  bp2_yearly.8081.t: "Ca ngợi ta"
  bp2_yearly.8081.desc: "Ta đưa [ward.GetFirstName] đến chỗ người mà ta thầm thương trộm nhớ, và chẳng bao lâu sau [target.GetFirstName] đã nhìn về phía ta với nụ cười trên gương mặt khi [target.GetSheHe] trò chuyện cùng người hầu trẻ tuổi của ta."
  bp2_yearly.8081.a: "Đúng là một đứa trẻ tuyệt vời."
  bp2_yearly.8082.t: "Bị Khinh Miệt"
  bp2_yearly.8082.desc: "Ta đưa [ward.GetFirstName] đến chỗ người mà ta thầm thương trộm nhớ, với những kỳ vọng tốt đẹp nhất trong lòng. Nhưng chẳng bao lâu sau, [target.GetFirstName] lại liếc nhìn về phía ta và cười khúc khích không ngừng mỗi khi [ward.GetFirstNameNoTooltip] mở miệng.\n\nTa không thể nghe rõ mọi thứ, nhưng ta vẫn nghe thấy những lời như \"[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('ward'))]\", \"[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('ward'))]\" và \"hôi hám\" liên tục được nhắc đến."
  bp2_yearly.8082.a: "Khốn kiếp thật, nhóc con!"
  bp2_yearly.8082.b: "Hôi hám ư? Ta phải can thiệp!"
  bp2_yearly.8090.t: "Đồ Chơi Quen Thuộc"
  bp2_yearly.8090.desc: "Ta được [monk.Custom2('MyCharacterIntroduction', ROOT.Char)] dẫn vào một căn phòng mờ tối. [monk.GetSheHe|U] đưa ra trước mặt ta một loạt đồ chơi cũ kỹ, tất cả đều sứt mẻ và mục nát theo thời gian.\n\n\"Ta từ lâu đã nghi ngờ Ngài là linh hồn tái sinh của [ancestor.GetName], và giờ khi Ngài đã [ROOT.Char.GetAge] tuổi, đã đến lúc ta kiểm chứng giả thuyết đó. Trước mặt Ngài là năm món đồ, nhưng chỉ một trong số đó từng thuộc về vị vĩ đại [ancestor.GetFirstNameNoTooltip]. Ngài có còn nhớ [ancestor.GetWomanMan] mà mình từng là không? Món đồ nào trong số này là của Ngài?\""
  bp2_yearly.8090.a: "Con ngựa."
  bp2_yearly.8090.b: "Những con rối."
  bp2_yearly.8090.c: "Bàn cờ [ROOT.Char.Custom('BG_GameType_Generic')]."
  bp2_yearly.8090.d: "Con quay."
  bp2_yearly.8090.e: "Những viên bi."
  bp2_yearly.8090.f: "Không món nào cả."
  ancestor_horse_guess_tt: "Ngài cảm thấy tổ tiên mình yêu thích con ngựa..."
  ancestor_puppet_guess_tt: "Ngài cảm thấy tổ tiên mình yêu thích những con rối..."
  ancestor_board_games_guess_tt: "Ngài cảm thấy tổ tiên mình yêu thích [ROOT.Char.Custom('BG_GameType_Generic')]..."
  ancestor_spinning_tops_guess_tt: "Ngài cảm thấy tổ tiên mình yêu thích những con quay..."
  ancestor_marbles_guess_tt: "Ngài cảm thấy tổ tiên mình yêu thích những viên bi..."
  ancestor_nothing_guess_tt: "Ngài cảm thấy tổ tiên mình không thích món nào trong số này..."
  bp2_yearly.8091.t: "Tái sinh!"
  bp2_yearly.8091.desc: "Khi ta đưa ra câu trả lời, ta thấy đôi mắt của [monk.GetNamePossessive] mở lớn. [monk.GetSheHe|U] quỳ xuống trước mặt ta với lòng kính phục.\n\n\"Đứa trẻ thiên tài! Ta không còn nghi ngờ gì nữa, Ngài chắc chắn chính là [ancestor.GetName] tái sinh!\""
  bp2_yearly.8091.a: "Ồ! Người đó là ai vậy?"
  bp2_yearly.8091.a.knew_them: "Ta chính là [ROOT.Char.Custom2('RelationToMeShort',ancestor)] của mình."
  bp2_yearly.8092.t: "Không Còn Tái Sinh Nữa"
  bp2_yearly.8092.desc: "Ta đưa ra câu trả lời, và [monk.GetName] thất vọng khuỵu xuống.\n\n\"Than ôi, có lẽ trí tưởng tượng của ta đã đi quá xa. Món đồ đó không thuộc về vị vĩ đại [ancestor.GetName], và cuộc tìm kiếm linh hồn của [ancestor.GetHerHis] vẫn sẽ tiếp tục.\""
  bp2_yearly.8092.a: "Ta thử lại được không?"
  bp2_yearly.8100.t: "Lăn tròn"
  bp2_yearly.8100.desc: "Ta đang chơi đùa trong khu vườn của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] cùng những Ngài đồng trang lứa, trong một khoảnh khắc hiếm hoi không bị ánh mắt giám sát của người giám hộ và gia sư đè nặng.\n\nMọi thứ xảy ra quá bất ngờ — ta bị hất ngã và lăn xuống một sườn dốc đứng, với [potential_crush.GetFirstName] ôm chặt lấy ta khi cả hai cứ thế lăn mãi. Khi chạm đáy, ta choáng váng, bắt gặp ánh mắt [potential_crush.GetHerHis] nhìn sâu vào mắt ta khi [potential_crush.GetSheHe] mỉm cười và khúc khích.\n\nTa cảm thấy có điều gì đó lạ lẫm trong lồng ngực khi nhìn lại [potential_crush.GetHerHim]… cảm giác này là gì?"
  bp2_yearly.8100.a: "Tình yêu!"
  bp2_yearly.8100.b: "Thù ghét!"
  bp2_yearly.8100.c: "Khó tiêu!"
  bp2_yearly.8110.t: "Cận thần tận tụy"
  bp2_yearly.8110.desc: "Việc mang trong mình một đứa trẻ là điều thiêng liêng và tuyệt vời, nhưng nó cũng khiến những sinh hoạt hằng ngày thử thách sự kiên nhẫn của ta. May mắn thay, khi bụng ngày càng lớn, ta không thiếu những người sẵn sàng nâng đỡ.\n\n[caretaker_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] luôn túc trực để chứng tỏ lòng tận hiến của [caretaker_1.GetHerHis] với cả [caretaker_1.GetFaith.HighGodName|U] lẫn ta, sẵn sàng chiều theo mọi ý muốn của ta. [caretaker_2.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cũng dường như đang cố gắng chiếm được thiện cảm của ta bằng cách giảm bớt gánh nặng thường nhật. [caretaker_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U], trung thành như mọi khi, thậm chí còn đoán trước được nhu cầu của ta mà ta chưa cần mở lời."
  bp2_yearly.8110.a: "\"Cảm ơn tất cả mọi người.\""
  bp2_yearly.8110.b: "Ta biết mình luôn có thể dựa vào [caretaker_1.GetFirstNameNoTooltip]."
  bp2_yearly.8110.c: "[caretaker_2.GetFirstNameNoTooltip] đã chiếm được cảm tình của ta."
  bp2_yearly.8110.d: "[caretaker_3.GetFirstNameNoTooltip] hiểu rõ ta cần gì."
  bp2_yearly.8120.t: "Gánh nặng thai nghén"
  bp2_yearly.8120.desc: "[spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] giờ đây đang mang thai nặng nề, và ngay cả những công việc đơn giản nhất dường như cũng trở thành gánh nặng thực sự đối với [spouse.GetHerHim]. Ta nằm trên giường và nhìn [spouse.GetSheHe] chật vật cởi bỏ y phục, dù đã có sự trợ giúp của gia nhân.\n\n[spouse.GetSheHe|U] quay sang nhìn ta, trong mắt [spouse.GetHerHis] vừa có vẻ mong mỏi vừa mệt mỏi, như thể đang cầu xin ta giúp đỡ."
  bp2_yearly.8120.a: "Ta sẽ làm mọi thứ vì nàng."
  bp2_yearly.8120.b: "Chẳng phải đó là việc của người hầu sao?"
  bp2_yearly.8120.c: "Ta nghĩ mình biết cách giúp nàng bớt căng thẳng."
