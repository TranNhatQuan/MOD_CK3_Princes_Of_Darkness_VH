l_english:
 
  influence_child_personality_interaction: "Ảnh hưởng tính cách của Hộ nhi"
  influence_child_personality_interaction_desc: "Truyền một [personality_trait|E] cho [ward|E] của Ngài"
  had_guardian_influence_interaction: "Đã thực hiện tương tác gần đây vào [DATE.GetStringLong]"
  bp2_character_interaction.1001.t: "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Thành công"
  bp2_character_interaction.1001.desc_intro: "Ta tiếp cận [ROOT.Char.Custom2('RelationToMeShort', recipient)] của ta là [recipient.GetFirstName]"
  bp2_character_interaction.desc_lustful: "với câu hỏi: \"Con đã từng biết đến tình yêu chưa?\"\n\n\"Rồi,\" [recipient.GetSheHe] đáp một cách dè dặt. \"Con yêu gia đình mình! Và... ừm... có một người mà con không thể ngừng nghĩ tới...\"\n\n\"Hãy theo đuổi cảm xúc đó đi, [recipient.Custom('GirlBoy')]. Lãng mạn và thỏa mãn không tự tìm đến — chúng phải được theo đuổi! Hãy đón nhận cuộc săn đuổi ấy, bởi khát khao của con chỉ đơn giản là bản chất con người.\"\n\n"
  bp2_character_interaction.1001.desc_lustful: "$bp2_character_interaction.desc_lustful$\"Ồ, tuyệt thật,\" [recipient.GetSheHe] cười. \"Biết đâu một ngày nào đó con sẽ hôn cả [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\""
  bp2_character_interaction.desc_chaste: "với câu hỏi: \"Khi nhìn vào người khác, tim con có bao giờ bừng cháy không?\"\n\n\"Có...\" [recipient.GetSheHe] đáp ngập ngừng. \"Đôi khi.\"\n\n\"Ngọn lửa ấy phải được dập tắt. Khi tim con cháy bỏng ngọn lửa của [ROOT.Char.GetFaith.NegativeAfterLife], con nghĩ [ROOT.Char.GetFaith.FertilityGodName] sẽ ban phúc cho con sao? Khi con đắm mình trong những dục vọng ô uế ư? Không! Hãy nhớ lấy, [recipient.Custom('GirlBoy')]: dục vọng là con đường diệt vong.\"\n\n"
  bp2_character_interaction.1001.desc_chaste: "$bp2_character_interaction.desc_chaste$\"Con thề,\" [recipient.GetFirstNameNoTooltip] tuôn ra, \"sẽ căm ghét xác thịt!\""
  bp2_character_interaction.desc_gluttonous_common: "và nhìn khuôn mặt tội lỗi, nhễ nhại mỡ của [recipient.GetHerHis], ta hỏi [recipient.GetHerHim]: \"Con ăn cái gì thế này...?\"\n\n\"Ôi! Sao món [recipient.Custom('GetLocalStreetFood')] này lại ở đây được nhỉ?\"\n\n"
  bp2_character_interaction.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous_common$\"Bọn hầu có mang thêm cho con nữa không?\" Ta cười. \"Ta #EMP đói lắm!#!\"\n\nKhi cùng nhau ăn uống, ta khuyến khích [recipient.Custom('GirlBoy')] ăn, ăn nữa, để [recipient.GetSheHe] lớn lên khỏe mạnh. \"Đừng xấu hổ vì những giấc mơ và ham muốn! Hãy tận hưởng mọi ân huệ của triều đình.\"\n\n"
  bp2_character_interaction.1001.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous$\"Vâng ạ!\" [recipient.GetSheHe] ợ một tiếng."
  bp2_character_interaction.desc_temperate: "$bp2_character_interaction.desc_gluttonous_common$Ta giật lấy món [recipient.Custom('GetLocalStreetFood')] và ném đi. \"Con #EMP không có kiên nhẫn sao?! Không có tự chủ ư?#! Hãy thề sẽ tiết chế bản thân trong mọi việc, [recipient.Custom('GirlBoy')]. Hãy thề giữ sự chừng mực trước [ROOT.Char.GetFaith.HealthGodName]! Thế gian này không cần thêm một kẻ suy đồi nữa.\"\n\n"
  bp2_character_interaction.1001.desc_temperate: "$bp2_character_interaction.desc_temperate$\"Con thề,\" [recipient.GetSheHe] nói nhỏ. \"[recipient.Custom2('RelationToMeShort', ROOT.Char)] ơi, con xấu hổ quá...\""
  bp2_character_interaction.desc_greedy_common: "khi [recipient.GetSheHe] vung cung, hét tên một thiếu niên khác.\n\n\"Một trong đám tiểu đồng của [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]!\" [recipient.GetSheHe] gào lên. \"Con sẽ bắn thủng cổ hắn vì dám đòi thứ thuộc về con!\"\n\n"
  bp2_character_interaction.desc_greedy: "$bp2_character_interaction.desc_greedy_common$\"Bình tĩnh, vì cái đầu lạnh mới sinh lợi. Đúng, ai rồi cũng sẽ van xin — nhưng khi họ biết con bảo vệ thứ thuộc về mình, họ sẽ lùi bước. Không ai moi được máu từ đá! Đừng cho máu hay vàng, [recipient.GetFirstNameNoTooltip].\"\n\n"
  bp2_character_interaction.1001.desc_greedy: "$bp2_character_interaction.desc_greedy$\"Hoặc,\" [recipient.GetSheHe] đáp. \"Có lẽ một cuộc trao đổi sẽ tốt hơn... một #EMP cực kỳ#! có lợi...\""
  bp2_character_interaction.desc_generous: "$bp2_character_interaction.desc_greedy_common$\"Bao nhiêu cuộc xô xát chỉ vì những chuyện vặt vãnh? Hạ cung xuống đi, [recipient.Custom('GirlBoy')]. Con sẽ không bao giờ mất thứ gì quý giá bằng danh dự. Và nếu con đủ khôn ngoan, mọi thứ cho đi rồi cũng sẽ phục vụ con.\"\n\n"
  bp2_character_interaction.1001.desc_generous: "$bp2_character_interaction.desc_generous$\"Vì người,\" [recipient.GetFirstNameNoTooltip] thở dài, \"con có thể cố gắng sống vì người khác.\""
  bp2_character_interaction.desc_lazy_common: "và hỏi: \"Khi ta gọi con đến hầu hạ, con có làm tốt không?\"\n\n\"Con... con cố hết sức, [ROOT.Char.GetTitleAsNameNoTooltip].\"\n\n"
  bp2_character_interaction.desc_lazy: "$bp2_character_interaction.desc_lazy_common$\"Thật ra... đạt chuẩn mà không cần nỗ lực cũng tốt như vượt chuẩn,\" ta nói, xoa đầu [recipient.GetHerHis]. \"Con rồi sẽ trở thành con người mà con vốn sẽ trở thành thôi. Bỏ qua mấy chuyện 'phục vụ' đó đi! Ngủ trưa nhiều hơn có lẽ hợp lý đấy.\"\n\n"
  bp2_character_interaction.1001.desc_lazy: "$bp2_character_interaction.desc_lazy$Ngáp nhẹ một cái, [recipient.GetFirstNameNoTooltip] đồng ý. \"Ồ vâng!\""
  bp2_character_interaction.desc_diligent: "$bp2_character_interaction.desc_lazy_common$\"Hết sức à? Ta chưa mong con có kỹ năng đâu, [recipient.Custom('GirlBoy')]. Ta mong con có sự bền bỉ. Con không thấy niềm vui khi làm tốt công việc sao? Đừng nghi ngờ, đừng suy nghĩ — làm đi! Cứ làm đi!\"\n\n"
  bp2_character_interaction.1001.desc_diligent: "$bp2_character_interaction.desc_diligent$[recipient.GetFirstNameNoTooltip] lập tức đứng bật dậy. "Ta sẽ không làm ngài thất vọng đâu, [recipient.Custom2('RelationToMeShort', ROOT.Char)]!""
  bp2_character_interaction.desc_wrathful_common: "với câu hỏi: \"Quyền lực là gì?\"\n\n"
  bp2_character_interaction.desc_wrathful: "$bp2_character_interaction.desc_wrathful_common$Một tia lửa nhỏ lóe lên trong mắt [recipient.GetHerHis], khi ta trả lời. \"Quyền lực là tự do trong cơn giận. Tự do để đánh gục, để sỉ nhục, những kẻ khiến con phẫn nộ.\"\n\n\"Như khi có đứa ngốc [recipient.Custom('GirlBoy')] nào đó xé toạc áo choàng của con! Con chưa bao giờ thấy mình bốc lửa đến thế,\" [recipient.GetSheHe] gào lên, khi ta cười phụ họa.\n\n"
  bp2_character_interaction.1001.desc_wrathful: "$bp2_character_interaction.desc_wrathful$\"Cứ đợi đấy,\" [recipient.GetSheHe] hét lên, \"bọn ngu xuẩn sẽ biết #EMP ta phun ra lửa!#!\""
  bp2_character_interaction.desc_calm: "$bp2_character_interaction.desc_wrathful_common$\"Có [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] và quý tộc dưới quyền? Hôm nay ta làm mất món [recipient.Custom('GetAccessory')] yêu thích mà chẳng ai quan tâm cả...\"\n\n\"Quyền lực bắt đầu từ quyền lực với chính bản thân,\" ta giải thích. \"Khi nhìn sang người khác, khi nổi giận và trút cơn thịnh nộ, con chỉ đang đẩy lùi cảm giác bất lực và ngu muội. Thay vào đó, hãy hít sâu và tìm sự phán đoán sáng suốt.\"\n\n"
  bp2_character_interaction.1001.desc_calm: "$bp2_character_interaction.desc_calm$Sau một lúc im lặng, [recipient.GetFirstName] thở dài và nói: \"Con sẽ cố gắng.\""
  bp2_character_interaction.desc_impatient_common: "và đặt một quả trứng vào tay [recipient.GetHerHis], nói: \"Giữ lấy. Ta sẽ quay lại.\"\n\nTa rời đi, làm việc của mình. Sau nhiều giờ trôi qua, ta trở lại và thấy [recipient.Custom('GirlBoy')] vẫn ủ rũ trên cùng chiếc ghế, quả trứng vẫn nằm trong tay.\n\n"
  bp2_character_interaction.desc_impatient: "$bp2_character_interaction.desc_impatient_common$Ta đập mạnh lòng bàn tay [recipient.GetHerHis] xuống, làm vỡ quả trứng. Lòng trứng nhầy nhụa bao phủ bàn tay [recipient.GetHerHis] — sự kinh ngạc hiện rõ trên khuôn mặt [recipient.GetHerHis]!\n\n"Ngươi đã lãng phí cả ngày rồi, [recipient.Custom('GirlBoy')]..." ta nói khi thong thả bước đi.\n\n"
  bp2_character_interaction.1001.desc_impatient: "$bp2_character_interaction.desc_impatient$\"Con sẽ không bao giờ chờ người nữa!\" [recipient.GetFirstNameNoTooltip] gào lên. \"#EMP Con thề đấy!#!\""
  bp2_character_interaction.desc_patient: "$bp2_character_interaction.desc_impatient_common$Ta lấy quả trứng từ tay [recipient.GetHerHim]] và ôm [recipient.Custom('GirlBoy')]. \"Ta tự hào về con. Gà mái nuôi dưỡng sự sống thế nào? Gà trống cảnh giác bảo vệ Ngài đời ra sao? Kiên nhẫn.\"\n\n"
  bp2_character_interaction.1001.desc_patient: "$bp2_character_interaction.desc_patient$[recipient.GetFirstNameNoTooltip] mỉm cười. \"Có thời gian để suy nghĩ thật tốt.\""
  bp2_character_interaction.desc_arrogant_common: "và chúc mừng [recipient.GetHerHim] vì đã đánh bại một trong những gia sư của [recipient.GetHerHis] trong [SCOPE.Custom('BG_GameType_Generic')].\n\n"Chẳng có gì to tát cả," [recipient.GetSheHe] đáp. "Thực ra, ta đã đánh bại hầu hết những người lớn mà ta từng chơi cùng!"\n\n"
  bp2_character_interaction.desc_arrogant: "$bp2_character_interaction.desc_arrogant_common$\"Tuyệt vời. Đó là vì con có một vận mệnh vĩ đại, [recipient.Custom('GirlBoy')]. Đừng sợ kiêu hãnh: chỉ kẻ hèn nhát mới không tin vào khả năng của mình! Hãy để thiên hạ thấy con là ai, và họ sẽ tôn vinh con đúng như vậy!\"\n\n"
  bp2_character_interaction.1001.desc_arrogant: "$bp2_character_interaction.desc_arrogant$\"Hah!\" [recipient.GetFirstNameNoTooltip] khịt mũi. \"Hay là người hơi ghen tị nhỉ?\""
  bp2_character_interaction.desc_humble: "$bp2_character_interaction.desc_arrogant_common$\"Con muốn đối mặt với... ta không? Ta sẽ mời toàn bộ [ROOT.Char.GetPrimaryTitle.GetTierAsName],\" ta giả vờ, trong khi [recipient.GetFirstNameNoTooltip] co rúm lại và phản đối.\n\n\"Chúng ta phải cẩn trọng,\" ta nói, \"đừng để say men đức hạnh đến mức vô lễ, đến mức đánh giá sai bản thân.\"\n\n"
  bp2_character_interaction.1001.desc_humble: "$bp2_character_interaction.desc_humble$\"Xin hãy tha thứ!\" [recipient.GetFirstNameNoTooltip] van nài. \"Con lỗi rồi!\""
  bp2_character_interaction.desc_deceitful_common: "với câu hỏi: \"Con có nói dối ta không?\"\n\n\"Con... ờ... không bao giờ!\"\n\n"
  bp2_character_interaction.desc_deceitful: "$bp2_character_interaction.desc_deceitful_common$"Giờ ngươi đang nói dối đấy," ta bật cười khẽ. "Một cách tệ hại. Khi nào ngươi mới học được rằng nên giữ những lời nói dối thật nhỏ bé nhưng liên tục, tất cả đều được bao bọc bởi hương vị ngọt ngào của sự thật? Muốn trở thành một [recipient.GetWomanMan] vĩ đại sao? Thế giới này là một ổ rắn độc, và chỉ những kẻ xảo quyệt nhất mới có thể đứng trên đỉnh cao."\n\n"
  bp2_character_interaction.1001.desc_deceitful: "$bp2_character_interaction.desc_deceitful$\"Ôi, [recipient.Custom2('RelationToMeShort', ROOT.Char)] của con! Người là con rắn mà con yêu nhất,\" [recipient.GetFirstNameNoTooltip] nói dối."
  bp2_character_interaction.desc_honest: "$bp2_character_interaction.desc_deceitful_common$\"Có lẽ. Đây là điều ta không thể biết,\" ta giải thích. \"Nhưng con không #EMP cảm nhận#! được lời nói dối sao, [recipient.Custom('GirlBoy')]? Ta biết kẻ nói dối là ai: [recipient.GetSheHe] là người không danh dự, không màng hậu quả của sự gian dối... đó có phải con người mà con muốn trở thành không?\"\n\n"
  bp2_character_interaction.1001.desc_honest: "$bp2_character_interaction.desc_honest$\"Ừm... con từng nói dối,\" [recipient.GetFirstNameNoTooltip] thừa nhận. \"Nhưng con muốn trở thành như người, [recipient.Custom2('RelationToMeShort', ROOT.Char)]. Tốt đẹp và chân thật!\""
  bp2_character_interaction.desc_craven_common: "và túm cổ áo [recipient.GetHerHim], nhổ toẹt: #EMP \"Đánh ta đi!\"#!\n\n[recipient.GetSheHe|U] run rẩy phản đối: \"Nhưng người là [ROOT.Char.GetTitleAsNameNoTooltip]!\"\n\n"
  bp2_character_interaction.desc_craven: "$bp2_character_interaction.desc_craven_common$"Đúng vậy, [recipient.Custom('GirlBoy')]. Đụng một tay vào ta cũng phải chịu sự trừng phạt khủng khiếp. Ngươi phải nhớ điều này: cả bổn phận lẫn đam mê đều có thể hủy hoại ngươi. Thà sống sót còn hơn chết vì sự ngu ngốc!"\n\n"
  bp2_character_interaction.1001.desc_craven: "$bp2_character_interaction.desc_craven$[recipient.GetFirstNameNoTooltip] quỳ rạp. \"Xin đừng làm hại con!\" [recipient.GetSheHe] van xin."
  bp2_character_interaction.desc_brave: "$bp2_character_interaction.desc_craven_common$\"Làm đi!\" ta thúc ép, cho đến khi ta bị đánh trúng mặt đang cười.\n\n\"Đừng sợ gì cả, [recipient.Custom('GirlBoy')]! Vì nếu con dám đánh ta, thì còn điều #EMP gì không thể#!? Hãy thử, hãy nỗ lực, hãy thất bại! Rồi con sẽ chết vì danh dự, tình yêu, bổn phận — tất cả đều tốt hơn cái chết vô nghĩa trên giường bệnh!\"\n\n"
  bp2_character_interaction.1001.desc_brave_self: "$bp2_character_interaction.desc_brave$\"[recipient.GetFaith.HighGodName] và [recipient.GetPrimaryTitle.GetNameNoTier]!\" [recipient.GetFirstNameNoTooltip] kêu lên. \"Con sẽ không thất bại đâu!\""
  bp2_character_interaction.1001.desc_brave_liege: "$bp2_character_interaction.desc_brave$\"[recipient.GetFaith.HighGodName] và [recipient.GetLiege.GetPrimaryTitle.GetNameNoTier]!\" [recipient.GetFirstNameNoTooltip] kêu lên. \"Con sẽ không thất bại đâu!\""
  bp2_character_interaction.1001.desc_brave_root: "$bp2_character_interaction.desc_brave$\"[recipient.GetFaith.HighGodName] và [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\" [recipient.GetFirstNameNoTooltip] kêu lên. \"Con sẽ không thất bại đâu!\""
  bp2_character_interaction.desc_shy_common: "khi [recipient.GetSheHe] chơi một mình — điều mà dạo gần đây [recipient.GetSheHe] làm khá thường xuyên. Ta hỏi: \"Tại sao?\"\n\n\"Có ích gì đâu hả [recipient.Custom2('RelationToMeShort', ROOT.Char)]? Bao nhiêu tiếng cười khúc khích, bao nhiêu chuyện phiếm... tất cả chỉ là lãng phí thôi.\"\n\n"
  bp2_character_interaction.desc_shy: "$bp2_character_interaction.desc_shy_common$\"E là điều đó sẽ chẳng bao giờ thay đổi,\" ta thở dài. \"Con sẽ luôn đối mặt với những lời mời gọi phải hòa vào đám đông, phải trở thành một khuôn mặt công chúng mà không có linh hồn riêng. Hãy đứng vững. Ở sự cô độc cũng có phẩm giá.\"\n\n"
  bp2_character_interaction.1001.desc_shy: "$bp2_character_interaction.desc_shy$[recipient.GetFirstNameNoTooltip] khẽ đáp lời, tránh ánh mắt ta."
  bp2_character_interaction.desc_gregarious: "$bp2_character_interaction.desc_shy_common$\"Hãy nghĩ xem,\" ta đáp. \"Có kỷ niệm nào đáng trân quý khi ở một mình không? Sự hứng khởi, hơi ấm và tình yêu ở đâu? Nếu con muốn, ta có thể dạy con kể chuyện, pha trò: những tiếng cười và lời tán gẫu sẽ nằm trong tay con!\"\n\n"
  bp2_character_interaction.1001.desc_gregarious: "$bp2_character_interaction.desc_gregarious$\"Được thôi,\" [recipient.GetFirstNameNoTooltip] mỉm cười. \"Hãy dạy con.\""
  bp2_character_interaction.desc_ambitious_common: "với câu hỏi: "Ngươi có thích làm một đứa trẻ không?"\n\n"Không," [recipient.GetSheHe] nhăn mũi, "Người lớn đối xử với ta như một con chó săn vậy! Họ lúc nào cũng bảo ta phải làm gì!"\n\n"
  bp2_character_interaction.desc_ambitious: "$bp2_character_interaction.desc_ambitious_common$\"Vậy hãy chứng minh họ ngu muội đi! Thể hiện nhiệt huyết; hãy vươn lên hơn con người hiện tại. Trừ khi... con #EMP muốn#! bị khinh thường như một đứa trẻ... ngay cả khi thân xác con héo mòn theo năm tháng?\"\n\n"
  bp2_character_interaction.1001.desc_ambitious: "$bp2_character_interaction.desc_ambitious$\"Không! Còn quá nhiều việc phải làm,\" [recipient.GetFirstNameNoTooltip] đáp. \"Cứ chờ xem! Rồi một ngày mọi người sẽ nhìn về sự lãnh đạo của con.\""
  bp2_character_interaction.desc_content: "$bp2_character_interaction.desc_ambitious_common$\"Nhưng,\" ta phản bác, \"con có muốn giải quyết tranh chấp đất đai, tính thuế, và cảm nhận những người con yêu phụ thuộc hoàn toàn vào con, mãi mãi không? Chẳng bao lâu nữa, trò chơi sẽ không còn dành cho con. Hãy trân trọng những gì con đang có, [recipient.Custom('GirlBoy')]. Trân trọng thật sâu sắc.\"\n\n"
  bp2_character_interaction.1001.desc_content: "$bp2_character_interaction.desc_content$\"Con biết ơn — thật sự là vậy! Biết ơn khoảng thời gian này bên người, [recipient.Custom2('RelationToMeShort', ROOT.Char)],\" [recipient.GetFirstNameNoTooltip] rạng rỡ nói."
  bp2_character_interaction.desc_arbitrary_common: "mang theo món [recipient.Custom( 'child_favorite_toy' )] yêu thích của một đứa trẻ khác và nói: "Ngươi có thể giữ lấy thứ này."\n\n"Tại sao?" [recipient.GetSheHe] thắc mắc. "Ta thậm chí còn không muốn nó."\n\n"
  bp2_character_interaction.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary_common$\"Vậy thì vứt đi! Nó chỉ là biểu tượng thôi, [recipient.Custom('GirlBoy')]. Hãy hành động chỉ theo cảm xúc và phán đoán của riêng con, phớt lờ luật lệ và quy tắc, và con sẽ được tự do làm điều mình muốn. Con có thể có mọi thứ con khao khát.\"\n\n"
  bp2_character_interaction.1001.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary$\"Đúng vậy,\" [recipient.GetFirstNameNoTooltip] đồng tình, cầm lấy món đồ chơi, \"sao phải công bằng trong một thế giới bất công chứ?\""
  bp2_character_interaction.desc_just: "$bp2_character_interaction.desc_arbitrary_common$\"Không ư? Sao lại không? Thèm muốn thứ không thuộc về mình là điều tự nhiên, hả hê khi vượt qua người khác cũng vậy. Sao không lấy những gì con có thể, và để ta dùng quyền lực của mình theo ý muốn?\"\n\n"
  bp2_character_interaction.1001.desc_just: "$bp2_character_interaction.desc_just$\"Đừng làm bạo chúa, [ROOT.Char.GetTitleAsNameNoTooltip]! Như thế là sai!\"\n\n\"Đúng vậy,\" ta mỉm cười. \"Đó là bất công.\""
  bp2_character_interaction.desc_cynical_common: "với câu hỏi: \"Vì sao con theo [recipient.GetFaith.GetName]?\"\n\n\"Vì [ROOT.Char.GetFaith.HighGodName] là tốt lành,\" [recipient.GetSheHe] đọc thuộc.\n\n"
  bp2_character_interaction.desc_cynical: "$bp2_character_interaction.desc_cynical_common$\"Không chỉ tốt lành, mà còn #EMP quyền năng#!. [ROOT.Char.GetFaith.HighGodName] giữ trật tự trong các lãnh địa [recipient.GetFaith.GetAdjectiveNoTooltip]. Và bằng cách viện đến thánh thần, [ROOT.Char.GetFaith.AltPriestTermPlural] có thể bắt chước lãnh chúa, còn [ROOT.Char.GetFaith.DevoteeNeuterPlural] thì mưu cầu lợi ích trần thế. Con thấy bàn tay của [ROOT.Char.GetFaith.HighGodName] trong những điều ấy không? Hay chỉ là mưu tính của con người?\"\n\n"
  bp2_character_interaction.1001.desc_cynical: "$bp2_character_interaction.desc_cynical$\"Con thấy...\" [recipient.GetFirstNameNoTooltip] chật vật nói, \"một thế giới buồn bã.\""
  bp2_character_interaction.desc_zealous: "$bp2_character_interaction.desc_cynical_common$"Đúng vậy. Lòng tốt của ngươi thuộc về [ROOT.Char.GetFaith.HighGodNamePossessive]. Sự khôn ngoan của ngươi thuộc về [ROOT.Char.GetFaith.KnowledgeGodNamePossessive]. Lòng dũng cảm của ngươi thuộc về [ROOT.Char.GetFaith.WarGodNamePossessive]. Ngươi muốn cô độc trong thế giới này, trở nên trống rỗng sao? Hay ngươi muốn trở thành tiếng nói của thần linh? Ta có thể dẫn dắt ngươi đến điều đó."\n\n"
  bp2_character_interaction.1001.desc_zealous: "$bp2_character_interaction.desc_zealous$\"Con nổi da gà rồi, [recipient.Custom2('RelationToMeShort', ROOT.Char)]!\" [recipient.GetFirstNameNoTooltip] hét lên. \"Con cảm nhận được ân huệ của [recipient.GetFaith.HighGodName]!\""
  bp2_character_interaction.desc_paranoid_common: "với câu hỏi: \"Con tin ai nhất?\"\n\n\"Dĩ nhiên là người —\" [recipient.GetSheHe] ngoan ngoãn đáp.\n\n"
  bp2_character_interaction.desc_paranoid: "$bp2_character_interaction.desc_paranoid_common$\"Vậy hãy tin ta khi ta nói rằng... trong triều đình, chúng ta luôn bị theo dõi. Hãy lắng nghe những lời thì thầm sau lưng con. Đừng thậm chí... đừng thậm chí tin cả ta...\"\n\nMột khuôn mặt tối sầm hiện lên nơi cửa sổ gần đó. \"#EMP Nhanh lên!#!\" ta rít lên. \"Núp sau ta đi, [recipient.Custom('GirlBoy')]!\"\n\n"
  bp2_character_interaction.1001.desc_paranoid: "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip] lao tới nép sau ta, để lộ một con dao găm được giấu rất khéo."
  bp2_character_interaction.desc_trusting: "$bp2_character_interaction.desc_paranoid_common$Ta quỳ trước [recipient.GetHerHim] và nắm lấy tay [recipient.GetHerHis].\n\n\"Ta thề sẽ không bao giờ bỏ rơi con. Con #EMP phải#! dựa vào người khác để sống sót trong thế giới phàm trần này, và quan trọng nhất trong số những người con có thể tin cậy... sẽ luôn là ta.\"\n\n"
  bp2_character_interaction.1001.desc_trusting: "$bp2_character_interaction.desc_trusting$Nước mắt ứa lên trong mắt [recipient.GetHerHis], [recipient.GetFirstNameNoTooltip] đáp: \"Con tin người.\""
  bp2_character_interaction.desc_compassionate: "$bp2_character_interaction.desc_callous_common$\"Trái tim họ vốn tốt,\" ta thì thầm, ôm lấy [recipient.GetHerHim]. \"Nhưng quyền lực có thể làm mù lòa và sức mạnh mê hoặc. Đừng để những cảnh tượng xấu xa làm mờ trái tim con: hãy nhìn thấy trong đó nhu cầu của lòng nhân ái.\"\n\n"
  bp2_character_interaction.1001.desc_compassionate: "$bp2_character_interaction.desc_compassionate$\"Con sẽ cố gắng sống cao thượng suốt đời!\" [recipient.GetFirstNameNoTooltip] nức nở."
  bp2_character_interaction.desc_callous_common: "trong nỗi lo lắng. Gần đây [recipient.GetSheHe|U] đã chứng kiến một trong những [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] của ta làm tàn phế một người hầu không tuân lệnh.\n\nĐứa trẻ sợ hãi hỏi: \"Vì sao con người lại bạo lực đến vậy?\"\n\n"
  bp2_character_interaction.desc_callous: "$bp2_character_interaction.desc_callous_common$\"Tên hầu đó,\" ta đáp, \"chỉ làm việc vì sợ bị đánh đập. Không có bạo lực, không có cưỡng ép, vị thế của chúng ta trong thế giới này sẽ mất đi. Với lại... con có muốn lãng phí cuộc đời mình để khóc thương cho đám hầu hạ không?\"\n\n"
  bp2_character_interaction.1001.desc_callous: "$bp2_character_interaction.desc_callous$\"Ghê quá,\" [recipient.GetFirstNameNoTooltip] khịt mũi. \"Không.\""
  bp2_character_interaction.desc_sadistic: "$bp2_character_interaction.desc_callous_common$\"Thế giới này là bạo lực,\" ta đáp. \"Con người yếu đuối và ích kỷ, con à. Và họ thì đông. Đổ máu của họ chẳng có ý nghĩa gì. Hãy nghĩ đến sức mạnh mà [ROOT.Char.Custom('KnightCultureNoTooltip')|l] của ta đã cảm nhận. Con cũng muốn sức mạnh đó chứ...?\"\n\n"
  bp2_character_interaction.1001.desc_sadistic: "$bp2_character_interaction.desc_sadistic$\"Có,\" [recipient.GetFirstNameNoTooltip] thì thầm. \"Con muốn...\""
  bp2_character_interaction.desc_stubborn: "đầy quả quyết, hỏi: \"Hôm nay có niềm vui gì nhỉ?\"\n\n\"Ồ... Bạn Bè con lại rủ con đi nhặt mấy bông hoa ngớ ngẩn nữa rồi...\"\n\n\"[recipient.GetFirstNameNoTooltip]!\" ta kêu lên. \"Con sẽ lãng phí bao nhiêu cuộc đời mình theo ý thích của người khác nữa? Hãy kiên định với phán đoán của con; hãy đứng vững như một [ROOT.Char.Custom('KnightCultureNoTooltip')|l]! Chẳng phải con nghĩ lựa chọn của mình mới là vui nhất sao?\"\n\n"
  bp2_character_interaction.1001.desc_stubborn: "$bp2_character_interaction.desc_stubborn$\"Đúng vậy,\" [recipient.GetSheHe] trầm ngâm. \"Con biết mình muốn gì! Sao con phải để ai đó thay đổi con chứ?\""
  bp2_character_interaction.desc_fickle: "bất chợt hỏi: \"Hôm nay có niềm vui gì nhỉ?\"\n\nKhi [recipient.GetSheHe] liệt kê kế hoạch, ta nhăn mặt.\n\n\"Kẻ thù sẽ dễ dàng theo dõi bước đi của con biết bao! Nghĩ xem những thú vui này sẽ chóng chán thế nào! Có thể lên kế hoạch để cảm thấy vui sao? Để biết đau khổ ư? Không! Hãy để cho mình sự tự do làm bất cứ điều gì con muốn.\"\n\n"
  bp2_character_interaction.1001.desc_fickle: "$bp2_character_interaction.desc_fickle$[recipient.GetSheHe|U] nhún vai và nói: \"Ừ. Dù sao thì con cũng chẳng còn hứng thú với mấy thứ đó nữa.\""
  bp2_character_interaction.desc_eccentric: "rồi khéo léo ném một con chuột đang giãy giụa vào lòng [recipient.GetHerHis].\n\nSau khi [recipient.GetSheHe] nhảy dựng lên và kêu ré lên vì bất ngờ, [recipient.GetSheHe] hỏi: \"Tại sao? Tại sao vậy?!\"\n\n\"Một người không nên sống trong nỗi xấu hổ khốn khổ vì sự khác biệt của mình. Đặc biệt là một [ROOT.Char.GetTitleAsNameNoTooltip]! Hãy khinh thường những kỳ vọng, bước đi con đường riêng của con, và con sẽ trở thành... một thứ gì đó. Một thứ gì đó vĩ đại.\"\n\n"
  bp2_character_interaction.1001.desc_eccentric: "$bp2_character_interaction.desc_eccentric$"Cười khúc khích, [ROOT.Char.Custom2('RelationToMeShort', recipient)] của ta lè lưỡi tỏ vẻ đồng ý.""
  bp2_character_interaction.desc_vengeful: "khi [recipient.GetSheHe] ủ rũ tiếc nuối một ván thua trong [ROOT.Char.Custom('BG_GameType_Generic')].\n\n\"Tên khốn đó gian lận!\" [recipient.Custom('GirlBoy')] khăng khăng. \"Bạn Bè con có bao giờ ngừng tìm cách lấn át con không?\"\n\nTa chớp lấy cơ hội, nói: \"Chúng biết rằng có thể chèn ép con mà không sợ hãi. Hãy chọc quân cờ vào mắt kẻ gian lận! Đập bàn cờ lên lưng hắn! Hãy để tất cả biết rằng con không tha thứ cho bất kỳ sai trái nào!\"\n\n"
  bp2_character_interaction.1001.desc_vengeful: "$bp2_character_interaction.desc_vengeful$\"Báo thù,\" [recipient.GetFirstName] khúc khích, \"con có vài ý tưởng rồi...\""
  bp2_character_interaction.desc_forgiving: "khi [recipient.GetSheHe] ủ rũ tiếc nuối một ván thua trong [ROOT.Char.Custom('BG_GameType_Generic')].\n\n\"Con bé kia gian lận!\" [recipient.Custom('GirlBoy')] khăng khăng. \"Nó đáng bị chọc quân cờ vào mắt! Nhưng... giờ nó không muốn làm Ngài với con nữa...\"\n\nTa chớp lấy cơ hội, nói: \"Hãy nghĩ về sự tha thứ. Hãy để nó sống trong tim con, luôn luôn. Nếu con đã khoan dung với kẻ gian lận, chẳng phải giờ con đã có thêm một người Ngài sao?\"\n\n"
  bp2_character_interaction.1001.desc_forgiving: "$bp2_character_interaction.desc_forgiving$\"Vâng,\" [recipient.GetSheHe] thở dài. \"Con sẽ nhớ điều này.\""
  bp2_character_interaction.1001.a: "Đó mới là [recipient.Custom('GirlBoy')] của ta!"
  bp2_character_interaction.1001.a.tt: "Truyền lại đặc điểm [target_trait.GetNameNoTooltip(GetPlayer)|l]"
  bp2_character_interaction.1001.a.flavor: "Hai người bắt đầu hiểu nhau hơn, và [recipient.GetSheHe] dần trở nên giống Ngài hơn."
  bp2_character_interaction.1002.t: "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Thất bại"
  bp2_character_interaction.1002.desc_intro: "$bp2_character_interaction.1001.desc_intro$"
  bp2_character_interaction.1002.desc_lustful: "$bp2_character_interaction.desc_lustful$"Ôi..." [recipient.GetSheHe] càu nhàu. "Nhưng còn bao nhiêu thứ #EMP hay hơn#! để làm mà...""
  bp2_character_interaction.1002.desc_chaste: "$bp2_character_interaction.desc_chaste$"Nhưng..." [recipient.GetFirstNameNoTooltip] than vãn, "trái tim con sẽ không phản bội con như thế đâu!""
  bp2_character_interaction.1002.desc_gluttonous: "$bp2_character_interaction.desc_gluttonous$"Nhưng... con chỉ muốn cảm thấy #EMP kiểm soát#! thôi...""
  bp2_character_interaction.1002.desc_temperate: "$bp2_character_interaction.desc_temperate$"Nhưng — chỉ một chút [recipient.Custom('GetLocalStreetFood')] thôi?" [recipient.GetSheHe] phản đối. "Và [ROOT.Char.GetFaith.HealthGodName] cũng cho phép niềm vui từ việc đó mà!""
  bp2_character_interaction.1002.desc_greedy: "$bp2_character_interaction.desc_greedy$"Một hòn đá à?" [recipient.GetSheHe] thắc mắc. "Ừm... chắc chẳng ai thích một người cứng nhắc như đá cả...""
  bp2_character_interaction.1002.desc_generous: "$bp2_character_interaction.desc_generous$"Cho con một chiếc mũ mới viền chỉ vàng đi," [recipient.GetFirstNameNoTooltip] nài nỉ, "rồi con sẽ #EMP nghĩ#! về chuyện đó...""
  bp2_character_interaction.1002.desc_lazy: "$bp2_character_interaction.desc_lazy$"Không!" [recipient.GetFirstNameNoTooltip] đáp. "Con không thể thất bại! Con sẽ cố gắng hơn nữa.""
  bp2_character_interaction.1002.desc_diligent: "$bp2_character_interaction.desc_diligent$"Con không biết phải làm gì!" [recipient.GetFirstNameNoTooltip] than khóc. "Làm ơn để con yên...""
  bp2_character_interaction.1002.desc_wrathful: "$bp2_character_interaction.desc_wrathful$"Nhưng..." [recipient.GetSheHe] nuốt nước bọt, "con không bao giờ muốn cảm giác đó nữa...""
  bp2_character_interaction.1002.desc_calm: "$bp2_character_interaction.desc_calm$"Phán đoán của con rất rõ ràng!" [recipient.GetFirstNameNoTooltip] gắt lên. "Con cho rằng chuyện này thật ngu ngốc!""
  bp2_character_interaction.1002.desc_impatient: "$bp2_character_interaction.desc_impatient$"Ờ..." Ta nghe [recipient.GetFirstNameNoTooltip] lẩm bẩm, "đóng vai gà mái cũng khá thư giãn.""
  bp2_character_interaction.1002.desc_patient: "$bp2_character_interaction.desc_patient$"Thôi nào," [recipient.GetFirstNameNoTooltip] càu nhàu, "con không muốn làm gà đâu.""
  bp2_character_interaction.1002.desc_arrogant: "$bp2_character_interaction.desc_arrogant$"Con không biết nữa... có khi con thắng chỉ là may mắn...""
  bp2_character_interaction.1002.desc_humble: "$bp2_character_interaction.desc_humble$"Sớm thôi..." [recipient.GetName] lẩm bẩm. "Sớm thôi, con sẽ bất bại...""
  bp2_character_interaction.1002.desc_deceitful: "$bp2_character_interaction.desc_deceitful$"Có cái hố thật," [recipient.GetFirstNameNoTooltip] cãi lại, "nhưng con nghĩ chỉ có mấy con rắn bị nhốt bên trong thôi.""
  bp2_character_interaction.1002.desc_honest: "$bp2_character_interaction.desc_honest$""Con à? Tất nhiên là không," [recipient.GetFirstNameNoTooltip] khăng khăng, giọng trống rỗng. "Như con đã nói... con luôn trung thực.""
  bp2_character_interaction.1002.desc_craven: "$bp2_character_interaction.desc_craven$"Buông con ra!" [recipient.GetFirstNameNoTooltip] hét lên. "Như một [recipient.Custom('KnightCultureNoTooltip')|l] cao quý, con không sợ cái chết!""
  bp2_character_interaction.1002.desc_brave: "$bp2_character_interaction.desc_brave$"Nhưng... con," [recipient.GetFirstNameNoTooltip] thút thít. "Con không muốn chết...""
  bp2_character_interaction.1002.desc_shy: "$bp2_character_interaction.desc_shy$"Nếu ngươi nghe thấy những điều người ta nói khi ngươi không có mặt ở đó, [recipient.Custom2('RelationToMeShort', ROOT.Char)]... ngươi sẽ không còn cảm thấy mình duyên dáng nữa đâu.""
  bp2_character_interaction.1002.desc_gregarious: "$bp2_character_interaction.desc_gregarious$"Làm ơn..." [recipient.Custom('GirlBoy')] co rúm lại, "cứ để con yên đi.""
  bp2_character_interaction.1002.desc_ambitious: "$bp2_character_interaction.desc_ambitious$"Con... không quan tâm," [recipient.GetFirstNameNoTooltip] thở dài. "Dù sao con cũng sẽ héo mòn thôi.""
  bp2_character_interaction.1002.desc_content: "$bp2_character_interaction.desc_content$"Nhưng một ngày nào đó," [recipient.GetFirstNameNoTooltip] lẩm bẩm, "một ngày nào đó con sẽ có nhiều hơn nữa...""
  bp2_character_interaction.1002.desc_arbitrary: "$bp2_character_interaction.desc_arbitrary$"Có lẽ đó là quyền của [ROOT.Char.GetTitleAsNameNoTooltip]," [recipient.GetFirstNameNoTooltip] đáp, "nhưng con thì không được #EMP phép#! như vậy...""
  bp2_character_interaction.1002.desc_just: "$bp2_character_interaction.desc_just$"Được thôi," [recipient.GetFirstName] nói, nở nụ cười nham hiểm, "nếu người đã nhất quyết như vậy...""
  bp2_character_interaction.1002.desc_cynical: "$bp2_character_interaction.desc_cynical$"Con thấy trật tự được [recipient.GetFaith.HighGodNamePossessive] lựa chọn!" [recipient.GetFirstNameNoTooltip] đáp trả. "Và [recipient.GetFaith.HighGodName] là tốt lành!""
  bp2_character_interaction.1002.desc_zealous: "$bp2_character_interaction.desc_zealous$"Làm ơn đi, [recipient.Custom2('RelationToMeShort', ROOT.Char)]," [recipient.GetFirstNameNoTooltip] càu nhàu, "người vừa phun đầy nước bọt lên con rồi.""
  bp2_character_interaction.1002.desc_paranoid: "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip] khúc khích cười."
  bp2_character_interaction.1002.desc_trusting: "$bp2_character_interaction.desc_trusting$"Ừ-hử," [recipient.GetFirstNameNoTooltip] lẩm bẩm. "#EMP Chắc rồi..."" 
  bp2_character_interaction.1002.desc_compassionate: "$bp2_character_interaction.desc_compassionate$"Lòng nhân ái ư? Lần tới con có thể bị tổn thương — vậy thì lòng nhân ái bảo vệ con thế nào đây?!""
  bp2_character_interaction.1002.desc_callous: "$bp2_character_interaction.desc_callous$"Thì cũng phải có ai đó quan tâm đến những kẻ khốn khổ ấy chứ!""
  bp2_character_interaction.1002.desc_sadistic: "$bp2_character_interaction.desc_sadistic$"Không bao giờ!" [recipient.GetFirstNameNoTooltip] lùi lại. "Con muốn trở thành người tốt!""
  bp2_character_interaction.1002.desc_stubborn: "$bp2_character_interaction.desc_stubborn$"Có lẽ..." [recipient.GetSheHe] thở dài. "Nhưng vậy cũng được...""
  bp2_character_interaction.1002.desc_fickle: "$bp2_character_interaction.desc_fickle$"Nhưng," [recipient.GetSheHe] phản đối, "con đã hứa với Bạn Bè rồi!""
  bp2_character_interaction.1002.desc_eccentric: "$bp2_character_interaction.desc_eccentric$"Con nghĩ," [recipient.GetSheHe] rùng mình, "con thà hòa nhập còn hơn...""
  bp2_character_interaction.1002.desc_vengeful: "$bp2_character_interaction.desc_vengeful$"Nhưng... như vậy thì cậu ta sẽ không bao giờ chơi với con nữa...""
  bp2_character_interaction.1002.desc_forgiving: "$bp2_character_interaction.desc_forgiving$"Một #EMP người Ngài thôi à?!#!" [recipient.GetSheHe] gào lên. "Không! Con vẫn sẽ bị một #EMP kẻ gian lận#!! đeo bám thôi!""
  bp2_character_interaction.1002.a: "Liệu ta có bao giờ chạm tới được [recipient.Custom('GetLassLad')] này không...?"
  bp2_character_interaction.1002.a.tt: "Không thể truyền lại đặc điểm [target_trait.GetNameNoTooltip(GetPlayer)|l]"
  bp2_character_interaction.1002.a.flavor: "Những lời dạy của Ngài rơi vào đôi tai không muốn lắng nghe."
