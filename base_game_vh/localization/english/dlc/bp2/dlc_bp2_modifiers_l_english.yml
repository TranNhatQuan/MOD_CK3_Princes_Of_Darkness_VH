l_english:

  holding_torch_modifier: "Ôm mối tương tư"
  holding_torch_modifier_desc: "Nhân vật này vẫn còn nuôi giữ tình cảm đơn phương chưa được đáp lại, khiến họ trở nên phần nào dễ tổn thương."

  reminiscing_modifier: "Hoài niệm"
  reminiscing_modifier_desc: "Nhân vật này đã dành chút thời gian để hồi tưởng về những năm tháng tuổi trẻ của mình."

  delayed_heartbreak_modifier: "Tan vỡ muộn màng"
  delayed_heartbreak_modifier_desc: "Nhân vật này đã cố gắng hâm nóng một mối tình cũ, nhưng chỉ nhận lại sự từ chối."

  besotted_modifier: "Si mê"
  besotted_modifier_desc: "Ngập tràn những đam mê rực lửa của tuổi trẻ, nhân vật này đang thực sự say đắm một người khác."
 
