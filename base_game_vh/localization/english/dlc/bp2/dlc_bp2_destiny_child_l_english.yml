l_english:
  destiny_child.0001.t: "Đứa Trẻ Được Định Mệnh Chọn"
  destiny_child.0001.desc: "Có một sự mãnh liệt đặc biệt trong ánh nhìn của [destiny_child.GetFirstNamePossessive].\n\n[destiny_child.GetSheHe|U] bước đi với dáng vẻ kiêu hãnh và duyên dáng. [destiny_child.GetSheHe|U] nói chuyện đầy conviction và chắc chắn, với sự rõ ràng tinh tế trong từng âm tiết. Những bậc trưởng lão lớn tuổi gấp năm lần [destiny_child.GetHerHis] đều lắng nghe chăm chú khi [destiny_child.GetSheHe] nói, bị cuốn hút bởi sức hút trong tính cách của [destiny_child.GetFirstNamePossessiveNoTooltip] như thiêu thân lao vào lửa.\n\nCó điều gì đó rất đặc biệt ở đứa trẻ này. Những bài ca cổ kể về những người được đánh dấu để dẫn dắt dân tộc mình tiến về phía trước, một hình tượng có phong thái lớn lao và năng lực còn vĩ đại hơn. Liệu điều đó có thể là thật?\n\nLiệu [destiny_child.GetFirstNameNoTooltip] có được số phận xức dầu chọn lựa?"
  destiny_child.0001.a: "Đứa trẻ này cần được nuôi dưỡng."
  destiny_child.0001.a.tt: "Có gì đó #EMP thật đặc biệt#! về [destiny_child.GetHerHim]..."
  destiny_child.0001.b: "Thật vớ vẩn. Con nhóc này phải biết vị trí của [destiny_child.GetHerHis]."

  destiny_child.1000.t: "Một Thiếu Niên Cường Tráng"
  destiny_child.1000.desc: "Ta chợt nhận ra — khi quan sát [destiny_child.GetFirstName] luyện tập những đường kiếm — rằng [destiny_child.GetSheHe] thực sự đang phát triển thành một thân thể vô cùng xuất sắc.\n\nMột nhát chém khác rít lên trong không khí, [destiny_child.GetFirstNameNoTooltip] hoàn tất động tác với sự điềm tĩnh và quyết tâm. Ta rùng mình khi tưởng tượng sẽ ra sao nếu đứng ở đầu bên kia của cú đánh ấy, nhưng một phần nhỏ trong Ta lại tự hỏi liệu việc quá chú trọng vào sức mạnh có thực sự mang lại lợi ích hay không."
  destiny_child.1000.a: "\"Đường kiếm rất tốt! Tiếp tục đi!\""
  destiny_child.1000.b: "\"Đừng lơ là sức bền, [destiny_child.GetFirstNameNoTooltip].\""

  destiny_child.1005.t: "Tư Duy Đa Chiều"
  destiny_child.1005.desc: "Ta rẽ qua một góc và bắt gặp [destiny_child.GetFirstName] cùng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))|U] của ta, [realm_priest.GetFirstName], đang tham gia vào một cuộc tranh luận khá sôi nổi. Không phải là một cuộc cãi vã, ít nhất theo những gì ta có thể nhận thấy, mà đúng hơn là một cuộc trao đổi ý tưởng đầy nhiệt huyết.\n\n[destiny_child.GetFirstNameNoTooltip], với đôi mắt sáng ngời, đang nhiệt tình tranh luận về những vấn đề tôn giáo chi tiết với sự am hiểu sâu sắc. [realm_priest.GetFirstNameNoTooltip|U], phải công nhận rằng, dường như đang đối xử với [destiny_child.GetFirstNameNoTooltip] như một người ngang hàng bất chấp sự khác biệt về tuổi tác."
  destiny_child.1005.a: "Thật hùng biện! Thật uyên bác!"
  destiny_child.1005.b: ""Ngài đang cản trở [destiny_child.GetFirstNameNoTooltip] theo đuổi con đường quân sự của mình đấy, [realm_priest.GetFirstNameNoTooltip].""
  destiny_child.1005.c: "Ta chắc rằng [destiny_child.GetFirstNameNoTooltip] sẽ học được rất nhiều từ việc này."

  destiny_child.1010.t: "Tư Duy Quân Sự"
  destiny_child.1010.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))|U] của ta, [marshal.GetFirstName], và ta đang chìm sâu trong một ván chiến tranh giả lập, chăm chú xem xét một bàn cờ với những quân cờ nhỏ đại diện cho các đội quân khác nhau. Ta gần như không nhận ra [destiny_child.GetFirstName] lặng lẽ tiến đến, nhưng ánh mắt sắc bén của [destiny_child.GetHerHis] hướng thẳng vào mặt bàn ngay lập tức cho thấy sự tính toán mãnh liệt đang diễn ra trong tâm trí [destiny_child.GetHerHis].\n\n"Đây." Giọng nói của [destiny_child.GetFirstNamePossessiveNoTooltip] khiến ta giật mình. "Đội quân đó đang bị giao chiến trực diện. Nếu ngài sử dụng khu rừng này để che giấu hướng tiếp cận, ngài có thể khiến chúng hoàn toàn bất ngờ..."\n\n[marshal.GetFirstNameNoTooltip] nhướng mày nhìn qua vai [destiny_child.GetFirstNamePossessiveNoTooltip] khi [destiny_child.GetSheHe] cúi xuống di chuyển những quân cờ."
  destiny_child.1010.a: "\"Đúng, nhưng như vậy sẽ khiến họ bị hở sườn. Thấy không?\""
  destiny_child.1010.a.tt: "Sự am hiểu về chiến lược quân sự của [destiny_child.GetFirstNamePossessiveNoTooltip|U] đã rất đáng nể, nhưng vẫn còn nhiều điều [destiny_child.GetSheHe] chưa biết."
  destiny_child.1010.b: "Thật không thể tin được. [destiny_child.GetFirstNameNoTooltip|U] nói đúng!"
  destiny_child.1010.c: "\"Nào, cùng ta xem lại một lần nữa nhé?\""

  destiny_child.1015.t: "Luyện Tập Tạo Nên..."
  destiny_child.1015.desc: "Hai lưỡi kiếm va chạm nhau dưới ánh nắng chói chang, cọ dọc theo chiều dài của nhau với tiếng kim loại #EMP choang!#!.\n\n[destiny_child.GetFirstName] lướt nhẹ lùi về sau, cầm kiếm như thể nó là phần nối dài của cánh tay [destiny_child.GetHerHis]. Đối thủ tập luyện của [destiny_child.GetHerHis|U], [knight.GetFirstName|U], loạng choạng đuổi theo [destiny_child.GetHerHim], thở hổn hển.\n\nHai người đã giao đấu được một lúc, vậy mà [destiny_child.GetFirstNameNoTooltip] gần như không hề đổ mồ hôi. Ta tự hỏi liệu [destiny_child.GetSheHe] có thực sự #EMP đang cố gắng#! hay không?"
  destiny_child.1015.a: "\"Con phải ép bản thân hơn nữa, [destiny_child.GetFirstNameNoTooltip]!\""
  destiny_child.1015.a.success: "[destiny_child.GetFirstNameNoTooltip] đạt tới tầm cao năng lực mới"
  destiny_child.1015.a.failure: "[destiny_child.GetSheHe|U] quá sức và tự làm tổn hại [destiny_child.GetHerselfHimself]"
  destiny_child.1015.a.critfailure: "[destiny_child.GetSheHe|U] mắc một sai lầm nghiêm trọng vì áp lực"
  destiny_child.1015.b: "Hay là ta vào thay?"
  destiny_child.1015.b.success: "Những chỉ dẫn của Ngài thậm chí còn giá trị hơn của [knight.GetFirstNamePossessiveNoTooltip]"
  destiny_child.1015.b.failure: "Ngài cũng không theo kịp được [destiny_child.GetFirstNameNoTooltip]"
  destiny_child.1015.c: "\"Cứ tiếp tục đi hai người, và ít tiền thưởng cho công sức của [knight.GetFirstNamePossessiveNoTooltip]!\""

  destiny_child.1020.t: "Học Tập Ngoài Giờ"
  destiny_child.1020.desc: "Những cảnh tượng kỳ lạ thường xuất hiện vào lúc ta ít ngờ tới nhất. Điều đó lại đúng khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('physician'))|U] của ta, [physician.GetFirstName], và [herbalist.GetFirstName], một lương y dày dạn kinh nghiệm, dẫn theo [destiny_child.GetFirstName] đầy phấn khích đến trước mặt ta.\n\n\"Cậu bé [destiny_child.GetFirstNameNoTooltip] mong muốn học một trong những nghề của chúng Ta, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [physician.GetFirstNameNoTooltip] mở lời, \"và chúng Ta sẵn lòng dạy dỗ [destiny_child.GetHerHim].\" [herbalist.GetFirstNameNoTooltip] xen vào đầy bực bội.\n\n\"Chúng Ta chỉ cần sự cho phép của ngài thôi, vì Ta sẽ không tự ý kéo [destiny_child.GetHerHim] khỏi việc học hành của [destiny_child.GetHerHis] đâu!\""
  destiny_child.1020.a: "Thời gian bên một thầy thuốc có thể rất đáng giá..."
  destiny_child.1020.b: "Thảo dược học là một lĩnh vực nghiên cứu thú vị!"
  destiny_child.1020.c: "\"Chỉ là... đừng để nó chiếm quá nhiều thời gian học tập của con.\""

  destiny_child.1025.t: "Danh Tiếng Lan Xa"
  destiny_child.1025.desc: "Tiếng hí vang của một con ngựa khiến ta giật mình. Một [famous_knight.Custom('KnightCultureNoTooltip')|l] cưỡi chiến mã tiến về phía ta.\n\n"[ROOT.Char.GetTitledFirstName]! Là ngài sao?" [famous_knight.GetSheHe|U] cúi đầu kính cẩn. "Ta đến đây để tìm một đứa trẻ — [destiny_child.GetFirstNameNoTooltip]. [destiny_child.GetSheHe|U] đang dưới sự chăm sóc của ngài, đúng chứ?" Ta gật đầu khi những người lính canh cảnh giác của ta tiến lại gần.\n\n"Xin đừng lo lắng. Bản thân ta cũng là người có danh tiếng... nhưng lời đồn về tài năng của [destiny_child.GetFirstNamePossessiveNoTooltip] lan truyền nhanh như lửa cháy trên đồng cỏ! Ta sẽ rất vinh dự được làm quen với [destiny_child.GetHerHis] và có lẽ giúp bồi dưỡng tài năng của [destiny_child.GetHerHis].""
  destiny_child.1025.a: "#EMP \"Cút đi,#! tên thích khách bẩn thỉu! #EMP Lính đâu!#!\""
  destiny_child.1025.b: "Huấn luyện [destiny_child.GetHerHim]? Ý tưởng tuyệt vời!"
  destiny_child.1025.c: "\"Có lẽ ngươi cũng có thể ở lại chăng?\""

  destiny_child.1030.t: "Người Kế Vị Tiếp Theo?"
  destiny_child.1030.desc: "[destiny_child.GetFirstName] thực sự là một tài năng phi thường. Những lời nói của [destiny_child.GetHerHis|U] mang sức nặng của một người lớn hơn [destiny_child.GetHerHis] hàng thập kỷ, và mọi người theo bản năng đều làm theo sự dẫn dắt của [destiny_child.GetHerHis]. Không còn nghi ngờ gì nữa về việc tương lai của gia tộc ta sẽ nằm ở đâu. Thế nhưng, và thế nhưng...\n\nDù cho sức hấp dẫn và tài năng của [destiny_child.GetFirstNamePossessiveNoTooltip] có lớn đến đâu, luật lệ của [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'trại', 'lãnh địa')] vẫn là như vậy. [destiny_child.GetSheHe|U] không phải là người thừa kế chính của ta. Khi ta qua đời, tất cả tài năng và năng lực đó sẽ chỉ được sử dụng để phục vụ cho những mưu tính của [current_heir.GetFirstNamePossessive], [destiny_child.Custom2('RelationToMeShort', SCOPE.sC('current_heir'))] của [destiny_child.GetHerHis].\n\nỞ đâu đó, le lói trong góc tâm trí ta, là những điều đang bị đặt cược. Đây là một quyết định mà di sản của ta sẽ phụ thuộc vào."
  destiny_child.1030.a: "Nếu ta vận dụng mọi mưu lược, có lẽ việc này sẽ thành..."
  destiny_child.1030.a.success: "Âm mưu thầm lặng của Ngài thành công"
  destiny_child.1030.a.failure: "Kế hoạch bị phát hiện, và làn sóng phản đối bùng lên"
  destiny_child.1030.b: "Ta không thể để câu chuyện của [destiny_child.GetFirstNamePossessiveNoTooltip] bị chôn vùi."
  destiny_child.1030.c: "Luật lệ đã định. Không thể bẻ cong."
  destiny_child.1030.c.tt: "Ta phải chuẩn bị người thừa kế thực sự, đồng thời trang bị cho [destiny_child.GetFirstNameNoTooltip] kỹ năng để bảo vệ [current_heir.GetHerHim]."

  destiny_child.1035.t: "Tình Cảm Tuổi Trẻ"
  destiny_child.1035.desc: "Năng lực của [destiny_child.GetFirstNamePossessive] đôi khi khiến ta quên mất rằng [destiny_child.GetSheHe] vẫn chỉ là một đứa trẻ, nhưng khi chúng ta băng qua [ROOT.Char.Custom('GetCourtyard')] và ta nghe thấy tiếng khúc khích của hai đứa trẻ bên cạnh, ta chợt nhớ ra rằng trẻ con thì vẫn luôn là trẻ con.\n\nHai đứa trẻ cười khúc khích ấy rõ ràng đã phải lòng [destiny_child.GetFirstNameNoTooltip], đến mức cả hai lập tức cúi gằm mặt xuống đất khi [destiny_child.GetSheHe] vui vẻ chào hỏi chúng."
  destiny_child.1035.interested: "\n\nDù [destiny_child.GetSheHe] thông thái vượt xa độ tuổi của [destiny_child.GetHerHis], ta vẫn có thể thấy nụ cười thấp thoáng nơi khóe miệng của [destiny_child.GetFirstNamePossessiveNoTooltip]..."
  destiny_child.1035.notinterested: "\n\nTuy nhiên, trái với mong đợi của ta, [destiny_child.GetSheHe] không nói thêm lời nào. Hoàn toàn không nao núng, [destiny_child.GetSheHe] tiếp tục bước đi, nhảy phốc lên những bậc thềm dẫn vào bên trong."
  destiny_child.1035.a: "[destiny_child.GetFirstNameNoTooltip] có vẻ để ý đến [flirter_1.GetFirstNameNoTooltip]..."
  destiny_child.1035.b: "Ta nghĩ [destiny_child.GetFirstNameNoTooltip] có cảm tình với [flirter_2.GetFirstNameNoTooltip]!"
  destiny_child.1035.c: "\"Tốt lắm khi con không để những chuyện phù phiếm ấy làm ảnh hưởng, [destiny_child.GetFirstNameNoTooltip].\""
  destiny_child.1035.d: "\"Con phải tập trung hơn, [destiny_child.GetFirstNameNoTooltip]!\""
  destiny_child.1035.d.tt: "Rồi sẽ có thời gian cho #EMP chuyện đó#! sau này trong đời [destiny_child.GetHerHis]..."

  destiny_child.9999.t: "Định Mệnh Thành Hình"
  destiny_child.9999.desc: "Sự trưởng thành liên tục của [destiny_child.GetFirstName] đã diễn ra một cách lặng lẽ, nhưng giờ đây ta nhìn [destiny_child.GetHerHim] bằng ánh mắt của một người ngang hàng. Ngày ấy, ta đã nhìn thấy tiềm năng của [destiny_child.GetHerHis] và quyết định nuôi dưỡng nó. Khi đó ta chẳng biết điều gì đang chờ phía trước, nhưng giờ thì rõ ràng mọi nỗ lực của ta không hề uổng phí.\n\n[destiny_child.GetFirstNameNoTooltip] đứng đối diện ta, mỉm cười, và dù đã quen thuộc đến vậy ta vẫn không thể không cảm nhận được sức hút tự nhiên mà [destiny_child.GetSheHe] tỏa ra. Không còn nghi ngờ gì nữa: [destiny_child.GetWomanMan] này được đánh dấu cho sự vĩ đại theo một cách huyền bí nào đó.\n\nTa tin chắc rằng mình đã làm điều đúng đắn khi giúp [destiny_child.GetHerHis] bước đi trên con đường số mệnh đầy hiểm trở và đan xen."
  destiny_child.9999.a: "Đó là một vinh dự."
