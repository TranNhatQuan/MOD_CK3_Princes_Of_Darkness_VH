l_english:
 #St Peter's Basilica
building_type_holy_site_st_peters_basilica_01: "$building_holy_site_st_peters_basilica_01$"
building_type_holy_site_st_peters_basilica_01_desc: "$building_holy_site_st_peters_basilica_01_desc$"
building_holy_site_st_peters_basilica_01: "Vương Cung Thánh Đường Thánh Phêrô"
building_holy_site_st_peters_basilica_01_desc: "Được kiến lập trên nơi an táng Thánh Phêrô tại đồi Vatican theo mệnh lệnh của Hoàng Đế Constantine I sau khi Ngài quy y Kitô giáo, Vương Cung Thánh Đường Thánh Phêrô trở thành trung tâm Kitô giáo phương Tây. \n\nNhà thờ này truyền thống là chỗ ngự của Giáo Hoàng La Mã, qua các thế kỷ đã mở rộng thành một quần thể rộng lớn, được bảo vệ bởi Thành Leonine."
 
 
 #Mont-Saint-Michel
building_type_mont_st_michel_01: "Mont-Saint-Michel"
building_type_mont_st_michel_01_desc: "$building_mont_st_michel_01_desc$"
building_mont_st_michel_01: "Nguyện Đường Thánh Aubert kính Thánh Michael"
building_mont_st_michel_01_desc: "Vào năm 708, Thánh Aubert, Giám Mục Avranches, chiêm bao thấy Thần Sứ Michael hiện ra, chỉ dẫn Ngài xây một nguyện đường trên đảo triều gần đó. Thuở đầu, Aubert bỏ qua điềm mộng ấy, cho rằng là trò lừa của Quỷ. Sau cùng, Thần Sứ thuyết phục Ngài – theo truyền thuyết, bằng cách châm lỗ trên hộp sọ Ngài – và Giám Mục truyền xây đền mới trên Mont Tombe. \n\nNhư vậy, lịch sử Mont-Saint-Michel bắt đầu từ đây."
building_mont_st_michel_02: "Tu Viện Romanesque Mont-Saint-Michel"
building_mont_st_michel_02_desc: "Nhà thờ mới của tu viện tọa lạc trên điểm cao nhất của đảo, minh chứng quyền năng của Thiên Chúa trên trời và đất, cùng sự khéo léo của loài người. \n\nDưới tu viện, một thị trấn nhỏ của những kẻ hành hương và ngư dân dần hình thành."
building_mont_st_michel_03: "Merveille"
building_mont_st_michel_03_desc: "Tu viện được mở rộng bằng nhiều hành lang, phòng thánh, hầm rượu, Phòng Hiệp Sĩ và nhiều nơi cư ngụ, tạo thành quần thể Gothic kỳ vĩ, thật sự là kỳ công kiến trúc. \n\nTu viện còn được gia cố tường thành uy nghi, và khu dân cư bên dưới nay đã trở thành thị trấn chính thức, đón tiếp hành hương và dân bản địa."
building_mont_st_michel_04: "Tu Viện Phòng Thủ Mont-Saint-Michel"
building_mont_st_michel_04_desc: "Những cuộc chiến gần đây chứng minh rằng ngay cả một đảo bình yên như Mont-Saint-Michel cũng có thể là điểm chiến lược trọng yếu. Do vậy, hòn đá được gia cố bằng thành lũy kiên cố, thêm nhiều nơi cư ngụ cho binh sĩ. \n\nThị trấn ven biển nay là thành phố nhộn nhịp, gần như toàn đảo phủ đầy nhà cửa."
 
 
 #Sanchi Stupa
building_type_sanchi_stupa_01: "$building_sanchi_stupa_01$"
building_type_sanchi_stupa_01_desc: "$building_sanchi_stupa_01_desc$"
building_sanchi_stupa_01: "Đại Tháp Sanchi"
building_sanchi_stupa_01_desc: "Đại Tháp được xây bởi Hoàng Đế Maurya Ashoka thế kỷ thứ ba trước Công Nguyên, gần nơi kết hôn của Ngài với hoàng hậu Devi. Công trình hùng vĩ chứa xá lợi Phật, là một trong những tháp cổ xưa nhất và nổi tiếng với các cổng torana chạm khắc tinh xảo."
 
 
 #Boudhanath
building_type_boudhanath_01: "$building_boudhanath_01$"
building_type_boudhanath_01_desc: "$building_boudhanath_01_desc$"
building_boudhanath_01: "Boudhanath"
building_boudhanath_01_desc: "Tháp Boudha tại Kathmandu, còn gọi Jarung Kashor hay Khāsa Chaitya, là một trong những tháp lớn nhất của Phật giáo, và có thể là nơi sinh ra nhánh Phật giáo Tây Tạng. Vòm tháp khổng lồ và mandala chứa di cốt nhiều Phật và vô số xá lợi thiêng liêng đủ hình dạng. \n\nDo tọa lạc trên tuyến thương lộ cổ giữa Nepal và Tây Tạng, lữ khách và thương nhân thường dừng chân hành lễ và nghỉ ngơi."
 
 
 #Grand Mosque of Yazd
building_type_yazd_mosque_01: "$building_yazd_mosque_01$"
building_type_yazd_mosque_01_desc: "$building_yazd_mosque_01_desc$"
building_yazd_mosque_01: "Đại Thánh Đường Yazd"
building_yazd_mosque_01_desc: "Được xây trên nền Đền Lửa thế kỷ thứ tư, công trình tráng lệ khiến lữ khách và hành hương kinh ngạc với các iwan uy nghi, vòm lát gạch, và cổng chính hùng vĩ cùng đôi tháp cao vút trời."
 
 
 #Qutb Minar
building_type_qutb_minar_01: "$building_qutb_minar_01$"
building_type_qutb_minar_01_desc: "$building_qutb_minar_01_desc$"
building_qutb_minar_01: "Cột Sắt Delhi"
building_qutb_minar_01_desc: "Cột Sắt Delhi sừng sững, minh chứng vinh quang vua Chandragupta II, dù các vị vua sau cũng khắc tên lên. Dù tồn tại lâu, không một vết gỉ – minh chứng tài nghệ thợ rèn Ấn Độ."
building_qutb_minar_02: "Qutb Minar"
building_qutb_minar_02_desc: "Quwwat-ul-Islam, thánh đường bao quanh Cột Sắt cũ của Delhi, được vươn cao với tháp Qutb Minar khổng lồ. \n\nCông trình hùng vĩ tôn vinh uy quyền các vị vua Delhi."
building_qutb_minar_03: "Mở Rộng Thánh Đường Quwwat-ul-Islam"
building_qutb_minar_03_desc: "Quần thể quanh Qutb Minar được mở rộng thêm nhiều sân, cổng, và lăng tẩm, quy mô tráng lệ đến mức huyền thoại."
building_qutb_minar_04: "Tháp Alai"
building_qutb_minar_04_desc: "Một tháp thứ hai được xây, mô phỏng Qutb Minar nhưng gấp đôi kích thước. Quần thể khổng lồ trấn giữ Delhi, đỉnh cao kiến trúc Ấn – Hồi giáo."
