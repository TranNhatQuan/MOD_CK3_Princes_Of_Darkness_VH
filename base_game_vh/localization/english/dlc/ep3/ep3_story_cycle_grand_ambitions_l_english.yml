 ### SCHEME MODIFIERS
  scheme_grand_ambitions_modifier: "Tham Vọng Đáng Gờm"
  scheme_grand_ambitions_modifier_desc: "Nhân vật này đang nhắm tới một phần thưởng vô cùng to lớn."
  scheme_grand_ambitions_bribed_functionaries_modifier: "Quan Chức Bị Mua Chuộc"
  scheme_grand_ambitions_bribed_functionaries_modifier_desc: "Các quan chức trong hoàng cung, bất mãn với triều đại hiện tại, âm thầm hình thành liên minh, đặt nền móng cho một sự chuyển giao quyền lực êm thấm."
  scheme_grand_ambitions_bribed_merchants_modifier: "Thương Nhân Bị Mua Chuộc"
  scheme_grand_ambitions_bribed_merchants_modifier_desc: "Thương nhân và thủy thủ trung thành với sự nghiệp mang tin tức đi khắp đế chế, bảo đảm liên lạc nhanh chóng và an toàn."
  scheme_grand_ambitions_bribed_scribes_modifier: "Thư Lại Bị Mua Chuộc"
  scheme_grand_ambitions_bribed_scribes_modifier_desc: "Các thư lại hoàng gia, được giao phó những bí mật của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l], âm thầm sửa đổi thư từ, che giấu tiến trình của âm mưu khỏi những con mắt cảnh giác."
  scheme_grand_ambitions_embezzling_modifier: "Tham Ô"
  scheme_grand_ambitions_powerful_family_modifier: "Liên Minh Gia Tộc Hùng Mạnh"
  scheme_grand_ambitions_powerful_family_modifier_desc: "Một liên minh với một gia tộc hùng mạnh khác trong lãnh thổ đã đẩy âm mưu này tiến nhanh trên con đường thành công."
