l_english:

  grand_ambitions_header: "Đại Tham Vọng"

# Starting Event: Powerful Family Coup (grand_ambitions.0001)
  grand_ambitions.0001.t: "$grand_ambitions_header$"
  grand_ambitions.0001.desc: "Là gia chủ của một trong những gia tộc quyền thế nhất tại [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier|l], tầm ảnh hưởng của ta trải rộng khắp nơi, ngân khố dồi dào, và tham vọng — vô hạn.\n\n[target_char.GetTitledFirstName] không xứng đáng với ngai vàng, chỉ là một sợi chỉ tầm thường trong bức thảm vĩ đại của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]. Được hậu thuẫn bởi thanh thế của Nhà [ROOT.Char.GetHouse.GetName], ta có đủ năng lực để khôi phục vinh quang cho đế quốc vĩ đại này.\n\nHành động của ta không chỉ định hình tương lai của gia tộc, mà còn vang vọng trong sử sách."
  grand_ambitions.0001.a: "Hãy để số phận của [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] được Ta luyện lại bằng thép!"
  grand_ambitions.0001.a.flavor: "Ta sẽ tập hợp toàn đế quốc dưới ngọn cờ của mình, vì [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] cần một quân vương có đức hạnh và sức mạnh!"
  grand_ambitions.0001.b: "Âm mưu trong bóng tối sẽ lật đổ [target_char.GetTitleAsNameNoTooltip], không cần chiến tranh."
  grand_ambitions.0001.b.flavor: "[target_char.GetTitleAsNameNoTooltip] sẽ không gục ngã bởi gươm giáo, mà bởi ngàn lời thì thầm phản bội."
 
  grand_ambitions.0001.b.toast: "Bắt đầu Âm mưu Phế truất"
  grand_ambitions.0001.c: "Thời cơ vẫn chưa chín muồi..."
  grand_ambitions_start_depose_scheme_tt: "Bắt đầu một [scheme|E] [GetScheme('depose').GetTypeName] chống lại [THIS.Char.GetTopLiege.GetShortUIName] với [GetModifier('scheme_grand_ambitions_modifier').GetNameWithTooltip]"

  grand_ambitions.0100.powerful_family_joins_faction: "[powerful_family_head.GetTitledFirstName] thề gia nhập [claimant_faction|E] của Ngài"

  grand_ambitions.0100.t: "$grand_ambitions_header$: Một Đề Nghị Táo Bạo"
  grand_ambitions.0100.intro: "Sự tĩnh lặng trong thư phòng của ta bị phá vỡ khi [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] trình lên một bức thư mới nhận. \"Một đề nghị từ bên ngoài biên giới của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l],\" [interlocutor.GetSheHe] nói.\n\n"
  grand_ambitions.0100.claim: "Con dấu trên thư mang huy hiệu của Nhà [foreign_ruler.GetDynastyHouseName]. Nội dung đưa ra một lời đề nghị táo bạo: liên minh chống lại [target_char.GetTitleAsName], với điều kiện nhượng lại [foreign_claim.GetName]. Sự táo tợn của yêu cầu chỉ thua kém tiềm năng mà nó mang lại.\n\n"
  grand_ambitions.0100.conclusion: "Đây là lưỡi gươm hai lưỡi: một lưỡi mở đường đến chiến thắng, lưỡi còn lại gây tổn thương sâu sắc cho [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
  grand_ambitions.0100.a: "Một [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip|l] phải biết hy sinh."
  grand_ambitions.0100.a.claim: "Ngài đồng ý ban [foreign_ruler.GetTitledFirstName] quyền sở hữu [foreign_claim.GetName] khi Ngài lên ngôi"
  grand_ambitions.0100.a.faction_tooltip: "Ngài sẽ có thể triệu tập [foreign_ruler.GetTitledFirstName] làm đồng minh trong một [civil_war|E] tương lai chống lại [THIS.Char.GetTopLiege.GetTitledFirstName]"
  grand_ambitions.0100.b: "Thỏa hiệp thì sao, có lẽ [compromise_county.GetNameNoTooltip] sẽ phù hợp?"
  grand_ambitions.0100.b.success: "[foreign_ruler.GetTitledFirstName] chấp nhận đề xuất phản hồi của Ngài"
  grand_ambitions.0100.b.success.tt: "Ngài hứa ban [compromise_county.GetName] cho [foreign_ruler.GetName] khi Ngài lên ngôi"
  grand_ambitions.0100.b.failure: "[foreign_ruler.GetTitledFirstName] từ chối đề xuất phản hồi của Ngài"
  grand_ambitions.0100.c: "Ta sẽ không bán rẻ chính xương cốt của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!"

  grand_ambitions.0110.t: "$grand_ambitions_header$: Hiệu Triệu Vũ Trang"
  grand_ambitions.0110.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] báo cáo: \"Những nhà bảo trợ giàu có đang tụ họp dưới ngọn cờ của chúng ta, và binh sĩ — chán ghét triều đại của [target_char.GetTitleAsNamePossessiveNoTooltip] — đã sẵn sàng gia nhập.\"\n\nLàn sóng ủng hộ này, từ ngân khố của đồng minh đến trái tim của những [ROOT.Char.Custom('GetMartialMenWomen')] dũng cảm nhất của [target_char.GetTitleAsNamePossessiveNoTooltip], đánh dấu một bước ngoặt. Quân số của ta sẽ tăng, tài nguyên sẽ mở rộng. Khoảnh khắc này không chỉ chứng minh tính chính nghĩa của sự nghiệp, mà còn là dấu hiệu rõ ràng: chiến tranh đang đến rất gần."
  grand_ambitions.0110.a: "Hãy đưa những binh sĩ đó vào việc."
  grand_ambitions.0110.b: "Với số vàng này, ta có thể trợ giá chi phí tuyển quân."
  grand_ambitions.0110.c: "Không phải ai cũng xứng đáng gia nhập sự nghiệp của ta!"

  grand_ambitions.0120.t: "$grand_ambitions_header$: Nền Móng Phòng Thủ"
  grand_ambitions.0120.desc: "Khi những lời thì thầm nổi loạn vang vọng khắp điền trang, thực tế nghiệt ngã về cuộc đối đầu sắp tới với hoàng đế phủ bóng lên mọi sự chuẩn bị. Sức mạnh hữu hình của hệ thống phòng thủ và tài nguyên của [estate.GetNamePossessive] là điều tối quan trọng.\n\n[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] trình bày các kế hoạch then chốt để củng cố nền tảng quyền lực của ta. \"Giờ là lúc gia cố điền trang,\" [interlocutor.GetSheHe] thúc giục, chỉ ra các vị trí dự kiến xây dựng."
  grand_ambitions.0120.a: "[maa_flavor.GetNameNoTooltip|l] của ta cần một nơi tập kết đàng hoàng."
  grand_ambitions.0120.b: "Đồng cỏ sẽ cung cấp ngựa khỏe cho [maa_flavor.GetNameNoTooltip|l]."
  grand_ambitions.0120.c: "Một tháp canh chắc chắn sẽ cải thiện [maa_flavor.GetNameNoTooltip|l] của ta."
  grand_ambitions.0120.d: "Thuê mọi lao công có thể — còn rất nhiều việc phải làm!"

  grand_ambitions.0130.t: "$grand_ambitions_header$: Lời Thì Thầm Trong Gió"
  grand_ambitions.0130.desc.intro: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] tiếp cận với một đề xuất nhằm đẩy xa hơn âm mưu chống lại [target_char.GetTitledFirstName].\n\n"
  grand_ambitions.0130.desc.legitimacy.6: "\"Dân chúng yêu mến [target_char.GetTitleAsNameNoTooltip],\" [interlocutor.GetSheHe] mở lời, \"nhưng tình yêu là thứ mong manh và đa nghi. Với đủ công sức, nó có thể biến thành nỗi sợ phản bội, rồi thành thù hận.\""
  grand_ambitions.0130.desc.legitimacy.5: "\"Dân chúng tung hô [target_char.GetTitleAsNameNoTooltip],\" [interlocutor.GetSheHe] nói, \"nhưng bao nhiêu người sẵn sàng chết vì [target_char.GetHerHim]? Chỉ cần đúng lời, đúng tai, và thêm vài đồng vào giá bánh mì là đủ khiến đám đông phát cuồng.\""
  grand_ambitions.0130.desc.legitimacy.4: "\"Niềm tin của dân chúng vào [target_char.GetTitleAsNameNoTooltip] có vẻ kiên định,\" [interlocutor.GetSheHe] nói, \"nhưng đám đông vốn thất thường. Với đủ nỗ lực, lòng trung thành của họ có thể mua được, dù chỉ trong một đêm.\""
  grand_ambitions.0130.desc.legitimacy.3: "\"Niềm tin của dân chúng vào [target_char.GetTitleAsNameNoTooltip] không hề bất khả xâm phạm,\" [interlocutor.GetSheHe] nói. \"Chỉ cần #EMP bấy nhiêu#! là đủ để bào mòn [target_char.GetHerHim], kéo [target_char.GetWomanMan] xuống biển hận thù.\""
  grand_ambitions.0130.desc.legitimacy.2: "\"Niềm tin của dân chúng vào [target_char.GetTitleAsNameNoTooltip] đang suy giảm,\" [interlocutor.GetSheHe] nói. \"Chỉ cần một hơi thở, ta có thể thổi bùng bất mãn thành ngọn lửa dữ dội.\""
  grand_ambitions.0130.desc.legitimacy.1: "\"Dân chúng chẳng còn chút niềm tin nào vào kẻ [target_char.GetTitleAsNameNoTooltip] giả dối,\" [interlocutor.GetSheHe] nói. \"Cơn thịnh nộ của họ mạnh mẽ nhưng vô định — ta chỉ cần chỉ cho họ một hướng.\""
  grand_ambitions.0130.desc.outro: "\n\n\"Dư luận tại [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] có thể lật đổ một [target_char.GetTitleAsNameNoTooltip] cũng dễ dàng như khi dựng nên hắn. Và nó đã từng bị xoay chuyển...\""
  grand_ambitions.0130.a: "Hãy gọi lại vài ân huệ."
  grand_ambitions.0130.b: "Mong những lời thì thầm có cánh!"
  grand_ambitions.0130.b.success: "Những lời thì thầm của Ngài đã lan xa"
  grand_ambitions.0130.b.failure: "Những lời thì thầm của Ngài không làm hoen ố danh tiếng của [target_char.GetTitleAsNamePossessive]"
  grand_ambitions.0130.b.crit_failure: "Những lời thì thầm đã phản bội ý đồ của Ngài trước [target_char.GetTitleAsName]"
  grand_ambitions.0130.c: "Vàng bạc thường khiến lưỡi dân thường lỏng hơn..."
  grand_ambitions.0130.d: "Ta sẽ không dựa vào #EMP lời đồn#!. Ta không phải trẻ con."

  grand_ambitions.0131.opening: "[interlocutor.Custom2( 'AppropriateGreeting', ROOT.Char )]"
  grand_ambitions.0131.desc: "Có vẻ như những tin đồn tai tiếng về Ngài đang lan truyền tại [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  grand_ambitions.0131.desc_secret: "\n\nChúng ta đã phát hiện ra rằng những lời đồn này do [schemer.GetTitledFirstName] lan truyền, kẻ đang nhắm đến ngai vàng của Ngài cho chính [schemer.GetHerselfHimself]."
  grand_ambitions.0131.conclusion: "\n\nNếu không bị ngăn chặn, điều này có thể dẫn đến thảm họa..."
  grand_ambitions.0131.a: "Ta cũng không thiếu mưu mô của riêng mình."
  grand_ambitions.0131.b: "Kẻ tung tin đồn không nằm ngoài tầm với của ta."
  grand_ambitions.0131.c: "Ta sẽ không bận tâm vì chuyện nhỏ nhặt như vậy."
  grand_ambitions.0131.d: "Nguyền rủa cái [schemer.Custom2('InsultAdjective', ROOT.Char)] [schemer.Custom2('InsultNoun', ROOT.Char)] đó..."

  grand_ambitions.0140.t: "$grand_ambitions_header$: Một [target_gov.GetTitleAsNameNoTooltip] Đồng Chí"
  grand_ambitions.0140.desc: "\"Ta đã nói là đừng làm phiền!\" ta quát lên khi cánh cửa thư phòng mở ra. Nhưng đứng dưới khung cửa là một vị khách bất ngờ: [target_gov.GetFirstName], [target_gov.GetTitleAsNameNoTooltip] của [target_gov.GetPrimaryTitle.GetNameNoTier].\n\n\"Xin lỗi vì đã quấy rầy, [ROOT.Char.GetFirstNameNoTooltip], nhưng ta đến để đề nghị sự ủng hộ.\""
  grand_ambitions.0140.faction: "\"Ta muốn cùng ngài tham gia nỗ lực phế truất [target_char.GetTitleAsName].\""
  grand_ambitions.0140.no_faction: "\"Ta biết ngài đang tích tụ quyền lực tại [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], chuẩn bị phế truất [target_char.GetTitleAsName].\""
  grand_ambitions.0140.a: "Càng đông càng vui."
  grand_ambitions.0140.b: "Ta không cần sự trợ giúp của ngươi."

  grand_ambitions.0150.t: "$grand_ambitions_header$: Một Đặc Vụ Bổ Sung"
  grand_ambitions.0150.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] bước tới, vẻ nặng nề của đại nghiệp phủ lên nét mặt [interlocutor.GetHerHis]. \"Kế hoạch phế truất [target_char.GetTitledFirstName] vẫn tiến triển thuận lợi,\" [interlocutor.GetSheHe] nói trang nghiêm.\n\n\"Tuy nhiên, nếu thiếu đủ đồng minh ở đúng vị trí, kế hoạch có thể thất bại. Một đặc vụ bổ sung sẽ giúp đảm bảo thành công.\""
  grand_ambitions.0150.a: "Một kẻ xâm nhập lành nghề chắc chắn sẽ thúc đẩy âm mưu."
  grand_ambitions.0150.b: "Hãy dùng một mồi nhử để giữ bí mật."
  grand_ambitions.0150.c: "Có người ca ngợi đức hạnh của ta tại triều đình sẽ rất hữu ích."

  grand_ambitions.0151.t: "$grand_ambitions_header$: Bậc Thầy Lời Thì Thầm"
  grand_ambitions.0151.desc: "Trong ánh sáng mờ ảo của buổi chiều sớm, [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] của ta đến gần với một tia sáng tinh ranh trong mắt [interlocutor.GetHerHis].\n\n\"Một cơ hội độc nhất đang hiện ra,\" [interlocutor.GetSheHe] thì thầm, đảm bảo rằng ngay cả những bức tường cũng không thể nghe thấy. \"[GetCourtPositionType( 'chief_eunuch_court_position' ).GetNameNoTooltip] của triều đình [target.GetTitleAsNamePossessiveNoTooltip], một cái bóng di chuyển lặng lẽ qua các hành lang quyền lực, có thể bị lung lay để theo phe chúng ta. Ảnh hưởng của [eunuch.GetHerHis|U] là vô song, bí mật của [eunuch.GetHerHis] thật bao la.\"\n\n\"[eunuch.GetSheHe|U] có thể là chốt chặn trong thiết kế vĩ đại của chúng ta nhằm định hình lại [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\""
  grand_ambitions.0151.a: "Hãy để những lời thì thầm của [eunuch.GetHerHis] dẫn đường."
  grand_ambitions.0151.b: "Tài năng của [eunuch.GetHerHis|U] quá quý giá để chỉ mượn tạm."
  ga_0151_b_eunuch_aptitude: "[eunuch.GetShortUINamePossessive] có [aptitude|E] với chức vụ [GetCourtPositionType( 'chief_eunuch_court_position' ).GetName] là [eunuch.GetCourtPositionAptitude( GetCourtPositionType( 'chief_eunuch_court_position' ) )]"
  grand_ambitions.0151.c: "Vẫn còn những cách khác để dệt nên âm mưu."

  grand_ambitions.0155.t: "$grand_ambitions_header$: Gọi Lại Ân Huệ"
  grand_ambitions.0155.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] tiến đến, gương mặt trầm ngâm.\n\n\"Âm mưu lật đổ [target_char.GetTitleAsNameNoTooltip] cần một nội gián mới — kẻ có thể đảm nhiệm vai trò [agent_slot.GetName]. Ta đã xác định ba ứng viên tiềm năng có thể xoay chuyển cục diện,\" hắn nói.\n\nHắn lùi vào bóng tối hành lang, để lại trước mắt Ngài những cái tên — mỗi cái là một lời hứa thầm lặng về quyền lực hoặc hiểm họa."
  grand_ambitions.0155.a: "[agent_choice_1.GetFirstNameNoTooltip] chắc chắn sẽ hỗ trợ ta."
  grand_ambitions.0155.b: "Có lẽ [agent_choice_2.GetFirstNameNoTooltip] là lựa chọn tốt hơn."
  grand_ambitions.0155.c: "Mặt khác, [agent_choice_3.GetFirstNameNoTooltip]..."
  grand_ambitions.0155.d: "Không ai trong số này phù hợp."

  grand_ambitions.0160.t: "$grand_ambitions_header$: Những Sợi Dây Mưu Trá"
  grand_ambitions.0160.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] mang đến tin tức về kế hoạch phế truất [target_char.GetTitledFirstName]. \"Nền móng cho đại tham vọng của chúng ta đã sẵn sàng,\" hắn mở lời, giọng điệu vững vàng.\n\n\"Chúng ta có đồng minh ở cả tầng cao lẫn chốn thấp, mỗi người sẵn sàng đóng vai trò của mình trong đại cục. Ta sẽ đặt niềm tin vào ai?\""
  grand_ambitions.0160.a: "Quan chức trong cung điện sẽ là đồng minh then chốt."
  grand_ambitions.0160.b: "Thương nhân sẽ mang thông điệp của ta, nhanh và kín."
  grand_ambitions.0160.c: "Thư lại hoàng gia sẽ đảm bảo chúng ta không bị lộ."

  grand_ambitions.0170.t: "$grand_ambitions_header$: Một Liên Minh Hùng Mạnh"
  grand_ambitions.0170.desc: "[ROOT.Char.Custom2( 'RelationToMe', interlocutor )] [interlocutor.GetFirstName] của ta tiếp cận ta với sự khẩn thiết lặng lẽ.\n\n\"Một đề nghị,\" [interlocutor.GetSheHe] bắt đầu, \"từ người đứng đầu một trong những gia tộc lẫy lừng nhất của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]. Họ đã đánh hơi được những khát vọng của chúng ta và thấy một cơ hội để cùng trục lợi.\" Hắn mở một cuộn giấy, con dấu của Gia tộc [powerful_house.GetName] hiện lên đầy đe dọa trong ánh sáng mờ nhạt.\n\n\"Sự hỗ trợ của họ có thể làm nghiêng cán cân về phía chúng ta. Tuy nhiên, lòng trung thành như vậy đi kèm với cái giá của nó — một sự đền bù mà họ tin là ngang bằng với rủi ro.\""
  grand_ambitions.0170.a: "Chúng ta sẽ trả giá — bất kể là gì."
  grand_ambitions.0170.b: "Hãy ràng buộc họ với chúng ta bằng lời hứa đền đáp trong tương lai."
  grand_ambitions.0170.c: "Hãy kết nối hai gia tộc bằng một mối hôn phối thiêng liêng."
  grand_ambitions.0170.d: "Tham vọng của ta sẽ không bị xiềng xích bởi nợ nần."

  grand_ambitions.0180.t: "$grand_ambitions_header$: Một Lễ Đăng Quang Xứng Đáng"
  grand_ambitions.0180.intro_hagia_sofia: "Tại đây, dưới mái vòm vàng rộng lớn và uy nghi của Hagia Sophia,"
  grand_ambitions.0180.desc: "Ta đứng trước [hof.GetTitleAsName], vị lãnh đạo tinh thần của dân chúng. Không khí nặng mùi hương trầm và sức nặng của hàng thế kỷ.\n\nGiành được sự ủng hộ của [hof.GetHerHis] không chỉ đem lại tính chính danh cho yêu sách của ta với [target_title.GetName], mà còn có thể lay động trái tim của các tín đồ trên khắp đế chế. [hof.GetSheHe|U] phải trao vương miện cho ta.\n\n[hof.GetTitleAsNameNoTooltip] không chỉ là một nhân vật tôn giáo đơn thuần; [hof.GetSheHe] hiểu rất rõ những toan tính trần tục của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l]."
  grand_ambitions.0180.a: "\"Điều này đã được định đoạt bởi thánh ý.\""
  grand_ambitions.0180.a.flavor: "[ROOT.Char.GetFaith.HighGodName] đã muốn vậy, và sẽ là như vậy."
  grand_ambitions.0180.b: "\"Thánh thượng, xin cho phép ta trở thành  Bề Tôi của [ROOT.Char.GetFaith.HighGodName].\""
  grand_ambitions.0180.d.flavor: "#EMP Khuất phục trước ý chí của ta, [hof.GetFirstName]!#!"
  grand_ambitions.0180.b.success: "[hof.GetTitledFirstNameNoTooltip] đồng ý làm lễ đăng quang cho Ngài"
  grand_ambitions.0180.b.success.tt: "Nếu thành công trong việc phế truất [target_char.GetTitledFirstName], Ngài sẽ nhận được #P [EmptyScope.ScriptValue('major_legitimacy_gain')]#! [legitimacy|E]"
  grand_ambitions.0180.b.failure: "[hof.GetTitledFirstNameNoTooltip] từ chối làm lễ đăng quang cho Ngài"
  grand_ambitions.0180.c: "Ngay cả [hof.GetTitleAsNameNoTooltip] cũng có thể bị thuyết phục bằng của cải..."
  grand_ambitions.0180.d: "Ngay cả [hof.GetPrimaryTitle.GetNameNoTierNoTooltip|l] cũng không miễn nhiễm trước ảnh hưởng của ta."
  grand_ambitions.0180.e: "\"Ngài #EMP sẽ#! phải đội vương miện cho ta với tư cách [target.GetTitleAsNameNoTooltip], [hof.GetFirstNameNoTooltip]!\""
  grand_ambitions.0180.f: "Có lẽ ta sẽ quay lại sau."

  grand_ambitions.0190.t: "Giữ Bạn Bè thật gần..."
  grand_ambitions.0190.desc: "\"...nhưng kẻ thù còn gần hơn,\" [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] của ta kết thúc câu nói, thuật lại những âm mưu vừa bị phơi bày của [secret_owner.GetTitledFirstNamePossessive] nhằm chiếm đoạt [ROOT.Char.GetPrimaryTitle.GetName|l] cho [secret_owner.GetHerselfHimself].\n\nCái #EMP trơ trẽn#! của tên [secret_owner.GetWomanMan] này! Ta không thể để chuyện này trôi qua!"
  grand_ambitions.0190.a: "Có lẽ [secret_owner.GetSheHe] sẽ hài lòng với một chỗ ngồi trên bàn quyền lực..."
  grand_ambitions.0190.a.tt: "Ngài đề nghị vị trí [co_emperor|E] cho [secret_owner.GetShortUIName]"
  co_emperor_accepts: "#HIGH [secret_owner.GetSheHe|U] chấp nhận#!"
  co_emperor_rejects: "#HIGH [secret_owner.GetSheHe|U] từ chối#!"
  grand_ambitions.0190.a.tt.1: "[emperor.GetShortUIName|U] bước vào một [duumvirate|E] với [secret_owner.GetShortUIName] trong vai trò [co_emperor|E] của [CharYourHerHis( emperor )]"
  grand_ambitions.0190.a.tt.2: "Chấm dứt các âm mưu của [secret_owner.GetHerHis]"
  grand_ambitions.0190.b: "Tống [secret_owner.GetHerHim] mục rữa trong ngục tối!"
  every_family_member_of_secret_owner: "Mọi thành viên trong gia đình của [secret_owner.GetTitledFirstName]"
  grand_ambitions.0190.c: "Mọi sự rồi cũng sẽ đến hồi kết đúng lúc."

  grand_ambitions.0191.t: "$grand_ambitions_header$: Một Lời Đề Nghị Định Mệnh"
  grand_ambitions.0191.desc: "\"#EMP [ROOT.Char.GetTitleAsNameNoTooltip]!#!\"\n\n[interlocutor.GetTitledFirstName], [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )] của ta, xông vào phòng làm việc của ta và thở hổn hển. \"Một cơ hội định mệnh đã xuất hiện!\" [interlocutor.GetSheHe] thở dốc. \"[emperor.GetTitledFirstNameRegnal] đã biết về kế hoạch giành ngai vàng của ngài!\"\n\n\"Nhưng [emperor.GetSheHe] đã gửi một đề nghị: #EMP Đồng Hoàng đế#! [emperor.GetSheHe|U] muốn ngài từ bỏ những âm mưu của mình và thay vào đó hãy giữ một vị trí bên cạnh ngài để cai trị [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l] vĩ đại của chúng ta từ [emperor.GetCapitalLocation.GetBaronyNameExplicitly] huy hoàng.\""
  grand_ambitions.0191.a: "#EMP Thật hấp dẫn...#!"
  grand_ambitions.0191.a.tt.1: "Ngài trở thành [co_emperor|E] của [emperor.GetShortUINamePossessive]"
  grand_ambitions.0191.a.tt.2: "Ngài chấm dứt các âm mưu của mình"
  grand_ambitions.0191.b: "Ta sẽ không bao giờ chia sẻ quyền lực với tên [emperor.Custom( 'InsultNoun' )] đó!"

  grand_ambitions.0200.t: "$grand_ambitions_header$: Đêm Định Mệnh"
  grand_ambitions.0200.opening: "Hôm nay, chính nền móng của [target.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] rung chuyển dưới sức nặng của Gia tộc [ROOT.Char.GetHouse.GetName]. Một cuộc cách mạng thầm lặng đã lật đổ một [target.GetTitleAsNameNoTooltip], đánh dấu bình minh của một kỷ nguyên mới.\n\n"
  grand_ambitions.0200.eunuch: "[GetAgentSlotType( 'agent_eunuch' ).GetName], bậc thầy nắm giữ bí mật của hoàng cung, đã hoàn thành vai diễn của mình một cách hoàn hảo. Những lời thì thầm của hắn gieo mầm bất hòa, những cái gật đầu lặng lẽ trong hành lang tối tăm đã dọn đường cho chiến thắng của chúng ta.\n\n"
  grand_ambitions.0200.powerful_family: "Dĩ nhiên, sự đăng vị của ta sẽ là điều không tưởng nếu thiếu sự ủng hộ của gia tộc [story.MakeScope.Var('powerful_family').House.GetName], "
  grand_ambitions.0200.powerful_family.currency: "rõ ràng là xứng đáng với trọng lượng của họ tính bằng vàng."
  grand_ambitions.0200.powerful_family.hook: "dù ta không mấy vui vẻ khi nhớ tới món ân tình còn nợ họ."
  grand_ambitions.0200.powerful_family.marriage: "mà giờ đây ta đã gắn kết bằng hôn nhân."
  grand_ambitions.0200.powerful_family.fallback: "dù ta không mấy muốn thừa nhận."
  grand_ambitions.0200.desc: "Những hành động phản loạn nhỏ bé — mỗi cánh cửa hé mở, mỗi thông điệp bị lạc hướng — đã dệt nên tấm vải chiến thắng của chúng ta, chứng minh rằng sức mạnh của cả một đế chế có thể bị lay chuyển bởi những bàn tay khiêm nhường nhất."
  grand_ambitions.0200.conclusion: "\n\nChúng ta đứng trước bờ vực của một kỷ nguyên mới. Ngày mai, đế chế sẽ thức tỉnh không phải với một di sản cũ kỹ mệt mỏi, mà là lời hứa về triều đại của ta.\n\n\"Ngươi, [target.GetFirstName], giờ chỉ còn là tiếng vọng tàn phai của #EMP đế chế của ta#!!\""
  grand_ambitions.0200.a: "[target.GetPrimaryTitle.GetNameNoTooltip] sẽ tung cánh trên đôi cánh của Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]!"

  grand_ambitions.0201.t: "$grand_ambitions_header$: Con Đường Tới Quyền Lực"
  grand_ambitions.0201.desc: "\"Thánh ý dẫn dắt vận mệnh của các đế chế đã chọn ra một vị quân vương mới,\" giọng nói của [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstNamePossessive] vang vọng khắp ngai điện, thấm đẫm sự trang nghiêm của khoảnh khắc.\n\nÁnh mắt [ROOT.Char.GetFaith.GetReligiousHead.GetHerHis|U] chạm vào ta, một sự thừa nhận thầm lặng cho giao ước đã đưa chúng ta tới giây phút này. \"Nhân danh ân sủng của [ROOT.Char.GetFaith.HighGodName], ta đội vương miện cho ngươi, [ROOT.Char.GetName].\"\n\nKhi sức nặng của vương miện đặt lên trán, ta cảm nhận được gánh nặng của hàng thế kỷ đè lên vai mình. Con đường đến quyền lực của ta có thể không chính thống, nhưng nó đã dẫn ta đến đây, tới khoảnh khắc huy hoàng này.\n\n"
  grand_ambitions.0201.conc_greek: "\"[Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )]!\" Ta hô vang đầy tự tin."
  grand_ambitions.0201.a: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] đang chờ đợi."

  grand_ambitions.0202.t: "$grand_ambitions_header$: Số Phận Kẻ Bại Trận"
  grand_ambitions.0202.desc: "Trước mặt ta, [ROOT.Char.GetTitleAsNameNoTooltip] bị phế truất đang chờ đợi số phận của [old_emp.GetHerHis] dưới cái bóng của trái tim đang âm ỉ của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l].\n\nCách ta lựa chọn xử lý con người trước mặt không chỉ là vấn đề báo thù cá nhân hay lòng khoan dung; đó là viên đá đầu tiên đặt vào nền móng di sản của ta.\n\nLiệu đó sẽ là con đường của báo oán và xung đột bất tận, hay của khoan dung và hy vọng? Ánh mắt của triều đình, của thần dân, và của chính lịch sử đang dõi theo ta."
  grand_ambitions.0202.a: "Hãy ra đi trong bình yên, [old_emp.GetFirstNameNoTooltip]."
  grand_ambitions.0202.a.flavor: "Để [old_emp.GetHerHim] biến mất vào màn đêm, rời xa tro tàn của triều đại [old_emp.GetHerHis]."
  grand_ambitions.0202.b: "Hãy để [old_emp.GetHerHim] mang trên mình những vết sẹo của sự sụp đổ."
  grand_ambitions.0202.b.flavor: "Nhưng [old_emp.GetSheHe] sẽ sống. Ở đó, ta tìm thấy sự cân bằng giữa công lý và lòng thương xót, một lời cảnh báo về cái giá khủng khiếp của sự kiêu ngạo."
  grand_ambitions.0202.c: "Đánh dấu [old_emp.GetHerHim] và trục xuất [old_emp.GetHerHim] ra ngoài tường thành!"
  grand_ambitions.0202.c.flavor: "Khi [old_emp.GetHerHis] lang thang khắp nơi, thì [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] cũng sẽ rời xa quá khứ, tìm kiếm một con đường mới phía trước."
  grand_ambitions.0202.d: "Ta vẫn chưa xong với ngươi."
  grand_ambitions.0202.d.tt: "[old_emp.GetFirstName] vẫn bị [imprisoned|E] trong ngục tối của Ngài"

  grand_ambitions.0250.t: "$grand_ambitions_header$: Cuối Con Đường"
  grand_ambitions.0250.desc: "Trái với sự đón tiếp mà ta mong đợi, [ROOT.Char.Custom2( 'RelationToMe', interlocutor )] của ta, [interlocutor.GetFirstName], tiến đến gặp ta bên ngoài cổng thành.\n\n\"Chúng ta đã bước đi trên lưỡi dao và dường như đã ngã về phía sai lầm,\" [interlocutor.GetSheHe] nói với vẻ u ám.\n\nKinh đô, với những tòa nhà cao vút và bóng tối sâu hun hút, dường như không đổi sau mọi nỗ lực của chúng ta. [target.GetTitleAsNameNoTooltip] vẫn ngự trên ngai vàng của [target.GetHerHis], có lẽ không hề hay biết cơn gió đổi thay đã suýt quét qua [target.GetCapitalLocation.GetBaronyNameExplicitly]."
  grand_ambitions.0250.a: "Con đường tới quyền lực trở nên u tối..."

  grand_ambitions.0300.t: "$grand_ambitions_header$: Gieo Gì Gặt Nấy"
  grand_ambitions.0300.desc: "[foreign_ruler.GetTitledFirstName|U] đứng trước mặt ta, vị [ROOT.Char.GetTitleAsNameNoTooltip] mới đăng vị của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Và điều đó, phần nào, là nhờ sự hậu thuẫn của [foreign_ruler.GetHerHis]...\n\nHệ quả là, [foreign_ruler.GetSheHe] đã đến để đòi hỏi thứ đã được hứa hẹn: [demand.GetName]."
  grand_ambitions.0300.a: "Ta là một [ROOT.Char.GetWomanMan] giữ lời. [demand.GetNameNoTierNoTooltip] là của ngươi."
  grand_ambitions.0300.b: "Ta có thứ còn vĩ đại hơn để dâng hiến..."
  grand_ambitions.0300.b.success: "[foreign_ruler.GetTitledFirstName|U] bị thuyết phục"
  grand_ambitions.0300.b.failure: "[foreign_ruler.GetTitledFirstName|U] không bị thuyết phục"
  grand_ambitions.0300.c: "Sự ngây thơ của ngươi thật đáng yêu."

  grand_ambitions_ally_joins_war: "Đồng Minh Tham Chiến: [joiner.GetTitledFirstName]"

  grand_ambitions.0500.opening: "[interlocutor.Custom2('AppropriateGreeting', ROOT.Char)]"
  grand_ambitions.0500.dead: "Ta hân hạnh thông báo rằng [story.MakeScope.Var('target_char').Char.GetTitledFirstName] đã chết. Liệu kế hoạch của chúng ta có tiếp tục nhằm phế truất [ROOT.Char.GetTopLiege.GetTitledFirstName] không?"
  grand_ambitions.0500.wrong_title: "Ta hân hạnh thông báo rằng [previous_story_target.GetTitledFirstName] không còn nắm giữ [story.Var('target_title').GetName] nữa. Liệu kế hoạch của chúng ta có tiếp tục nhằm phế truất [ROOT.Char.GetTopLiege.GetTitledFirstName] không?"
  grand_ambitions.0500.a: "Ta sẽ không nghỉ ngơi cho đến khi #EMP ta chính là [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]!#!"
  grand_ambitions.0500.b: "Dừng mọi chuẩn bị. Hãy cùng ăn mừng!"
  grand_ambitions.0500.b.tt: "Ngài chấm dứt nỗ lực [depose|E] [THIS.Char.GetTopLiege.GetTitleAsName]"

