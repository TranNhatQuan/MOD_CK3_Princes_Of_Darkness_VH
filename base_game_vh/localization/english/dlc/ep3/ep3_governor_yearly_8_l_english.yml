l_english: 
  ep3_governor_yearly.8010.opening: "[governor.Custom2('AppropriateGreeting', ROOT.Char)]"
  ep3_governor_yearly.8010.desc: "Hỡi [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstNameNoTooltip], Ta nhận thấy một cơ hội để thúc đẩy lợi ích của dòng họ [ROOT.Char.GetHouse.GetBaseName] cũng như của gia tộc Ta, Nhà [governor.GetHouse.GetBaseName].\n\nĐổi lại cho"
  ep3_governor_yearly.8010.hook: "một lời hứa mà Ta có thể viện dẫn trong tương lai,"
  ep3_governor_yearly.8010.candidacy: "sự ủng hộ cho việc bổ nhiệm Ta thay vì [their_title.GetNameNoTier],"
  ep3_governor_yearly.8010.candidacy_heir: "sự ủng hộ cho việc bổ nhiệm [governor.Custom2('RelationToMeShort', SCOPE.sC('their_title_receiver'))] của Ta, [their_title_receiver.GetFirstNamePossessive], thay vì [their_title.GetNameNoTier],"
  ep3_governor_yearly.8010.influence: "lời tiến cử của ngài tại triều đình hoàng gia"
  ep3_governor_yearly.8010.gold: "một vật chứng thiện chí mang tính vật chất"
  ep3_governor_yearly.8010.end: "Ta sẵn sàng tự mình hy sinh."
  ep3_governor_yearly.8010.a: "Ân huệ đổi lấy ân huệ."
  ep3_governor_yearly.8010.b: "Một đề nghị hay, nếu đảo ngược lại."
  ep3_governor_yearly.8010.b.success: "[governor.GetSheHe|U] chấp nhận đề xuất của Ngài"
  ep3_governor_yearly.8010.b.failure: "[governor.GetSheHe|U] không hứng thú"
  ep3_governor_yearly.8010.c: "Ta không cần đến việc này."

  ep3_governor_yearly.8020.t: "Đòn Bẩy Tỉnh Lỵ"
  ep3_governor_yearly.8020.desc: "Giữa vô số tiểu điền, làng mạc và thị trấn của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta, điền trang của gia tộc [estate_owner.GetHouse.GetBaseName] nổi bật như một ngoại lệ.\n\nTài sản tư nhân trên danh nghĩa của [estate_owner.GetTitledFirstNamePossessive] được hưởng sự bảo hộ của ta với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTier], và sự thờ ơ mang tính đặc quyền của [estate_owner.GetHerHis] đối với ân huệ của ta có thể nhanh chóng biến thành lòng biết ơn nếu viễn cảnh bị rút lại được khéo léo đưa ra..."
  ep3_governor_yearly.8020.a: "Giữ cho đường sá an toàn dạo này tốn kém #EMP lắm#!."
  ep3_governor_yearly.8020.success: "[estate_owner.GetSheHe|U] hiểu ý Ngài"
  ep3_governor_yearly.8020.b: "Những nỗ lực to lớn của ta xứng đáng được đền đáp."
  ep3_governor_yearly.8020.c: "Ân sủng của ta trong việc này cần được phô bày đôi chút."
  ep3_governor_yearly.8020.d: "Ta không thể làm tổn hại một điền trang đẹp đến vậy."
  ep3_governor_yearly_8020_failure_tt: "Nếu họ từ chối:"
  ep3_governor_yearly.8020.failure: "[estate_owner.GetSheHe|U] từ chối yêu sách của Ngài"
  ep3_governor_yearly.8020.reason: "Việc chấp nhận một phần dựa trên tính cách của [estate_owner.GetFirstNamePossessive]"

  ep3_governor_yearly.8030.t: "Ân Huệ Ngoài Dự Tính"
  ep3_governor_yearly.8030.desc: "Gia tộc ta từ lâu đã tranh luận, đôi khi khá gượng ép, với dân địa phương và quan chức phàn nàn rằng việc phát triển điền trang của Nhà [ROOT.Char.GetHouse.GetBaseName] tại [estate.GetLocation.GetBaronyNameExplicitlyNoTooltip] mang lại lợi ích cho toàn bộ [estate.GetLocation.GetTitle.GetDeJureLiege.GetNameNoTier], nếu không muốn nói là cho cả [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!\n\nVì vận may kỳ lạ nào thì ta không rõ — nhưng điều đó lại hoàn toàn đúng!"
  ep3_governor_yearly.8030.martial: "Sự hiện diện của đội cận vệ của ta đã xua đuổi bọn cướp thường thấy, và sự vắng bóng của chúng là một ân huệ lớn cho toàn vùng."
  ep3_governor_yearly.8030.agriculture: "Những cải tiến nông nghiệp trên đất của ta đã truyền cảm hứng cho các tiểu điền chủ, và nỗ lực của họ là một ân huệ lớn cho toàn vùng."
  ep3_governor_yearly.8030.commerce: "Các cơ hội thương mại đã thu hút nhiều thương nhân, và sự hiện diện của họ là một ân huệ lớn cho toàn vùng."
  ep3_governor_yearly.8030.fallback: "Việc mở rộng điền trang đã thu hút đủ loại thợ thủ công, và sự hiện diện của họ là một ân huệ lớn cho toàn vùng."
  ep3_governor_yearly.8030.a: "Nghe như là #EMP lợi nhuận#! cần được thu về."
  ep3_governor_yearly.8030.b: "Phát triển địa phương nên được khuyến khích."
  ep3_governor_yearly.8030.c: "Một sự trùng hợp lành tính, hiếm hoi thay."

  ep3_governor_yearly.8040.t: "Những Xao Nhãng Gia Tộc"
  ep3_governor_yearly.8040.desc: "[ROOT.Char.Custom2('RelationToMeShort', complainant)] của ta, [complainant.GetFirstName], [complainant.GetTitleAsNameNoTooltip|l] của [complainant.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [complainant.GetPrimaryTitle.GetNameNoTier], đã đến [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] với một vấn đề 'khẩn cấp'.\n\n\"[complainant.Custom2('RelationToMeShort', ROOT.Char)] của ta, ta biết ngươi phải lo cho việc riêng cũng như việc của [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip], nhưng ta e rằng điền trang của Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] đang chiếm quá nhiều sự chú ý — và ngân quỹ — của ngươi, thay vì dành cho [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]...\"\n\n\"Chỉ riêng việc quản lý tỉnh của ngươi đã đủ bận rộn rồi, không cần thêm sự xao nhãng từ điền trang nữa.\""
  ep3_governor_yearly.8040.a: "Có lẽ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta cần được chú ý hơn."
  ep3_governor_yearly.8040.b: "Ôi thôi, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] gần như tự vận hành mà!"
  ep3_governor_yearly.8040.c: "Hay là #EMP ngươi#! nên gánh bớt việc đi, [complainant.GetTitleAsNameNoTooltip]."
  ep3_governor_yearly.8040.d: "Ngươi đang #EMP ám chỉ#! rằng ta quá bất tài để quản lý cả hai sao?"
  ep3_governor_yearly.8040.d.success: "Ngài xoay xở để quán xuyến mọi việc"
  ep3_governor_yearly.8040.d.failure: "Ngài quá bất tài để quản lý cả hai"

  ep3_governor_yearly.8050.t: "Kẻ Thù Trước Cổng Thành"
  ep3_governor_yearly.8050.desc: "Từ viên chức thấp hèn nhất cho đến chính [war_liege.GetTopLiege.GetTitleAsNameNoTooltip] [war_liege.GetHerselfHimself], toàn bộ [war_liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] đều cúi mình bảo vệ [target_title.GetBaseNameNoTier] khỏi [war_attacker.GetPrimaryTitle.GetDefinitiveName]. Với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], mối đe dọa này là vô cùng thực tế —"
  ep3_governor_yearly.8050.kingdom: "một phần lớn công cuộc phòng thủ của khu vực đặt lên vai ta."
  ep3_governor_yearly.8050.neighbour: "nếu không bị ngăn chặn, quân xâm lược có thể tiến sâu vào [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]] tiếp theo."
  ep3_governor_yearly.8050.end: "\n\nTa đã làm tròn phần việc của mình — bố trí đồn trú, sửa chữa công sự, tuyển mộ binh lính — nhưng vẫn còn nhiều việc hơn nữa có thể làm. Bất kỳ sự hỗ trợ nào hẳn sẽ được hoan nghênh tại [war_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
  ep3_governor_yearly.8050.a: "Quân đội đế quốc cần mọi binh sĩ có thể huy động!"
  ep3_governor_yearly.8050.b: "Phòng thủ của [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] còn yếu kém..."
  ep3_governor_yearly.8050.c: "...và sẽ #EMP diệt vong#! nếu không có thêm tài nguyên."
  ep3_governor_yearly.8050.d: "Mọi việc đều trong tầm kiểm soát."

  ep3_governor_yearly.8060.t: "Kho Bạc Cám Dỗ"
  ep3_governor_yearly.8060.desc: "Với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], toàn bộ bộ máy quan liêu của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] nằm trong tay ta — kể cả kho bạc khiêm tốn nằm ở trung tâm [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nNhững viên chức nhỏ lui tới nơi này mọi giờ, đổi vàng hoàng gia lấy biên nhận rồi mang đi trả lương đồn trú, sửa chữa công trình, cứu tế người nghèo... [ROOT.Char.GetFaith.HighGodName] mới biết là gì.\n\nVới tư cách là #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!, nhu cầu của #EMP ta#! và của [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] thực chất là một — chẳng phải sao?"
  ep3_governor_yearly.8060.a: "Không ai để ý nếu có thêm vài khoản trưng thu."
  ep3_governor_yearly.8060.b: "Sổ sách xấu, lỗi làm tròn — mấy chuyện này vẫn xảy ra..."
  ep3_governor_yearly.8060.c: "Và vì thế, nhu cầu của [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] cũng là của #EMP ta#! để chia sẻ."
  ep3_governor_yearly.8060.d: "Đám quan lại biết họ đang làm gì."
  ep3_governor_yearly.8060.a.success: "Sự biến mất không bị ai phát hiện"
  ep3_governor_yearly.8060.a.failure: "Có người phát hiện thiếu tiền"
  ep3_governor_yearly.8060.a.failure_tt: "@warning_icon! #N Vị trí của số [gold|E] sẽ bị chất vấn#!"
  ep3_governor_yearly.8060.embezzle_tt: "Kho Bạc Bị Biển Thủ"
  ep3_governor_yearly.8060.efficiency_tt: "Trong 10 năm: Hiệu quả [governor|E]: #N -5%#!"
  ep3_otherwise_tt: "Ngoài ra:"

  ep3_governor_yearly.8062.desc: "Tại yêu cầu đầu tiên của [complainant.GetHerHis] để gặp mặt và thảo luận #EMP về các tài khoản#!, ta biết mình sắp phải đối mặt với nó. Ta đã cố gắng từ chối [complainant.GetHerHim], nhưng cuối cùng đã đồng ý gặp người [ROOT.Char.Custom2('RelationToMeShort', complainant)] của ta, [complainant.GetFirstName].\n\n[complainant.GetSheHe|U] nói với ta qua tất cả, vàng bị thiếu, các mục nhập không chính xác, biên lai đặt nhầm chỗ... Cuối cùng, [complainant.GetSheHe] kết luận, "Ta chỉ không hiểu được nó, lời giải thích duy nhất là một tên quan lại trộm cắp!"\n\n[complainant.GetSheHe|U] suy nghĩ một lúc nhìn quanh hội trường của ta, rồi nhìn ta một cách kỳ lạ, và giấu đi sự bàng hoàng của [complainant.GetHerHis], lẩm bẩm: "Trừ khi...""
  ep3_governor_yearly.8062.a: "Tất cả chuyện này đều có thể giải thích được."
  ep3_governor_yearly.8062.a.success: "[complainant.GetSheHe|U] chấp nhận lời biện hộ"
  ep3_governor_yearly.8062.a.failure: "[complainant.GetSheHe|U] phơi bày sự tham nhũng của Ngài"
  ep3_governor_yearly.8062.b: "Không cần hé môi nửa lời về chuyện này."
  ep3_governor_yearly.8062.b.success: "[complainant.GetSheHe|U] hiểu ý"
  ep3_governor_yearly.8062.b.failure: "$ep3_governor_yearly.8062.a.failure$"
  ep3_governor_yearly.8062.c: "Nghe này, lấy phần của ngươi đi rồi im lặng."
  ep3_governor_yearly.8062.c.success: "[complainant.GetSheHe|U] nhận hối lộ"
  ep3_governor_yearly.8062.c.failure: "$ep3_governor_yearly.8062.a.failure$"
  ep3_governor_yearly.8062.d: "Chỉ là một sai sót nhỏ, số vàng sẽ được hoàn trả..."

  ep3_governor_yearly.8070.t: "Công Việc Của Một Tổng Đốc"
  ep3_governor_yearly.8070.desc: "Danh dự, uy tín, quyền lực. Là một [ROOT.Char.GetTitleAsNameNoTooltip] có thể mang lại những điều đó, nhưng #EMP quả thật#! cũng có cái giá phải trả...\n\nTừng núi [ROOT.Char.Custom('GetWritingMaterial')] cuộn cong lại, chờ con dấu hay cái liếc mắt của ta, trong khi vô số quan lại tranh nhau đến lấp đầy tai ta bằng những chi tiết nhức óc.\n\nKhông ai nói với ta rằng sẽ có #EMP nhiều đến thế#! công việc — và lại là thứ công việc rốt cuộc dường như tự vận hành."
  ep3_governor_yearly.8070.a: "Ta có thể xử lý hết, chỉ cần tập trung."
  ep3_governor_yearly.8070.b: "Thuê thêm người sẽ giảm bớt gánh nặng."
  ep3_governor_yearly.8070.c: "Đây là việc của đám quan lại cấp thấp, không phải của #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!"

  ep3_governor_yearly.8080.t: "Quan Phán Tham Nhũng"
  ep3_governor_yearly.8080.desc: "Gần đây, các cáo buộc tham nhũng liên tiếp xuất hiện tại [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], nơi nhiều người đã đứng ra nêu rõ bất bình đối với một trong các quan phán chủ chốt — một [magistrate.GetWomanMan] tên là [magistrate.GetFirstName].\n\n[magistrate.GetSheHe|U] bị dẫn đến trước mặt ta để trả lời những cáo buộc này, bao gồm việc đòi hối lộ cắt cổ để đổi lấy cả những chức năng cơ bản nhất.\n\n\"Thật lòng mà nói, thưa [ROOT.Char.GetTitleAsNameNoTooltip]...\" [magistrate.GetSheHe] khàn giọng, \"Tất cả chỉ là một sự hiểu lầm!\""
  ep3_governor_yearly.8080.a: "Ngươi sẽ hoàn trả số hối lộ này và bị bãi chức."
  ep3_governor_yearly.8080.b: "Loại súc vật như ngươi cần một hình phạt #EMP thực sự#!."
  ep3_governor_yearly.8080.c: "Chuyện này có thể bỏ qua nếu các khoản tiền được... phân phối lại."
  ep3_governor_yearly.8080.d: "Ngươi sẽ trả món nợ này bằng việc phục vụ ta... #EMP [magistrate.GetFirstNameNoTooltip]#!."

  ep3_governor_yearly.8090.t: "Chính Trị Cay Đắng"
  ep3_governor_yearly.8090.desc: "Cỗ máy xoay vần không ngừng của các bổ nhiệm và thay thế trong đế quốc có thể đã đưa ta tạm thời nắm quyền cai quản [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], nhưng chẳng ai lạ gì việc [old_holder.GetTitledFirstName] vẫn khao khát chức vị này quay về tay Gia tộc [old_holder.GetHouse.GetBaseName].\n\nCác tổng đốc dĩ nhiên không có quyền đòi lại chức vụ cũ — ít nhất là theo luật — nhưng những mưu đồ mà [old_holder.GetFirstNamePossessiveNoTooltip] đang dệt tại [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] vẫn là một cơn đau đầu..."
  ep3_governor_yearly.8090.a: "Bịa đặt những vấn đề do Gia tộc [old_holder.GetHouse.GetBaseNameNoTooltip] để lại."
  ep3_governor_yearly.8090.a.success: "Gia tộc [old_holder.GetHouse.GetBaseNameNoTooltip] mất mặt"
  ep3_governor_yearly.8090.a.failure: "Những lời dối trá của Ngài bị bác bỏ"
  ep3_governor_yearly.8090.b: "Có lẽ vẫn có thể dùng lý lẽ với [old_holder.GetSheHe]."
  ep3_governor_yearly.8090.c: "Một chút đền bù có thể khiến [old_holder.GetHerHim] im lặng."
  ep3_governor_yearly.8090.d: "Bah, hãy để [old_holder.GetWomanMan] làm điều tồi tệ nhất của [old_holder.GetHerHis]!"

  ep3_governor_yearly.8100.t: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của láng giềng"
  ep3_governor_yearly.8100.desc: "Trong số các thông điệp hôm nay từ [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], ta vô cùng phẫn nộ khi biết rằng [governor.GetFirstName], [governor.GetTitleAsNameNoTooltip] của [governor.GetPrimaryTitle.GetTierAsNameNoTooltip] [governor.GetPrimaryTitle.GetAdjective] láng giềng, đang công khai khẳng định sự phù hợp của [governor.GetHerHis] [governor.Custom2('RelationToMePossessive',SCOPE.sC('neighboring_promoted_char'))] với văn phòng #EMP của ta#!!\n\nCó vẻ như [governor.Custom2('InsultNoun', ROOT.Char)] khao khát tỉnh của ta, và dành những ngày của [governor.GetHerHis] tại [governor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] âm mưu cách để tống khứ ta ra khỏi [ROOT.Char.Custom('FortifiedBuilding')] của ta..."
  ep3_governor_yearly.8100.a: "#EMP Ồ!#! Hai bên đều chơi được trò này!"
  ep3_governor_yearly.8100.b: "Âm mưu trơ trẽn này phải bị tố cáo."
  ep3_governor_yearly.8100.c: "Hả? Tên ngu đó còn chẳng cai quản nổi một tu viện."
  ep3_governor_yearly.8100.d: "Những mưu đồ vặt vãnh như vậy không xứng với phẩm giá của một [governor.GetTitleAsNamePossessiveNoTooltip]."

  ep3_governor_yearly.8110.t: "Những Tổng Đốc Hiếu Chiến"
  ep3_governor_yearly.8110.desc: "Gần đây, hàng loạt tin đồn lan truyền về sự bất mãn ngày càng tăng giữa hai tổng đốc láng giềng  của ta, [governor_1.GetTitledFirstName] và [governor_2.GetTitledFirstName], khi mỗi người đều công khai chỉ trích năng lực và hành vi của người kia.\n\nĐây có thể là cơ hội để thúc đẩy lợi ích của riêng ta, trong lúc Gia tộc [governor_1.GetHouse.GetBaseName] và [governor_2.GetHouse.GetBaseName] đang bị phân tâm..."
 
  ep3_governor_yearly.8110.a: "Một vài tin đồn giả có thể dễ dàng đổ thêm dầu vào lửa."
  ep3_governor_yearly.8110.a.success: "Tin đồn bén rễ"
  ep3_governor_yearly.8110.a.failure: "Lời dối trá của Ngài bị lần ra"
  ep3_governor_yearly.8110.a.failure_tt: "[governor_1.GetFirstName] và [governor_2.GetFirstName] mất #N 25#! [opinion|E] với Ngài"
  ep3_governor_yearly.8110.b: "[governor_1.GetFirstNameNoTooltip] rõ ràng là người đúng."
  ep3_governor_yearly.8110.c: "Ta không tin một lời nào chống lại [governor_2.GetFirstNameNoTooltip]."
  ep3_governor_yearly.8110.d: "Lời kêu gọi đoàn kết sẽ phơi bày sự ngu xuẩn của họ."
  ep3_governor_yearly.8110.d.tt: "[governor_1.GetFirstName] và [governor_2.GetFirstName] mất #N 15#! [opinion|E] với Ngài"

  ep3_governor_yearly.8120.t: "Ý Chỉ Của [ROOT.Char.GetFaith.HighGodName]"
  ep3_governor_yearly.8120.desc: "Hôm nay ta nhận được tin dữ về một thảm họa kinh hoàng trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của mình:"
  ep3_governor_yearly.8120.earthquake: "một trận động đất nhỏ nhưng dữ dội đã san phẳng nhiều thôn xóm hẻo lánh của [disaster_county.GetNameNoTierPossessive],"
  ep3_governor_yearly.8120.storm: "một cơn bão hung dữ đã quét sạch nhiều thôn xóm hẻo lánh của [disaster_county.GetNameNoTierPossessive],"
  ep3_governor_yearly.8120.ending: "phá hủy nhà cửa, công trình công cộng và cướp đi sinh mạng...\n\nTa nhanh chóng nhận ra rằng, với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], ta rốt cuộc phải chịu trách nhiệm cho những con người và vùng đất này."
  ep3_governor_yearly.8120.a: "Ta sẽ đích thân giám sát việc cứu trợ cho dân chúng."
  ep3_governor_yearly.8120.a.success: "Những nỗ lực của Ngài mang lại kết quả"
  ep3_governor_yearly.8120.a.failure: "Mọi nỗ lực trở thành thảm họa"
  ep3_governor_yearly.8120.b: "Những nạn nhân sẽ được trợ giúp."
  ep3_governor_yearly.8120.c: "Dù đau đớn, chúng ta phải chấp nhận ý muốn của [ROOT.Char.GetFaith.HighGodNamePossessive]."

  ep3_governor_yearly.8130.t: "Tham Lam Và Cơ Hội"
  ep3_governor_yearly.8130.desc: "Với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] được bổ nhiệm của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], ta là công cụ của [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], nắm toàn quyền đối với bộ máy quan liêu, thần dân và dĩ nhiên là cả #EMP thuế khóa#! của [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip].\n\nSuy ngẫm về tài chính địa phương, ta chợt nhận ra rằng việc áp đặt một khoản thu nhỏ mới lên dân chúng hoàn toàn nằm trong thẩm quyền của ta — tất nhiên là chỉ vì lợi ích của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
  ep3_governor_yearly.8130.a: "Đáng tiếc thay, #EMP một ít#! khoản đóng góp bổ sung #EMP là#! cần thiết..."
  ep3_governor_yearly.8130.b: "Chỉ cần thu thêm một khoản nhỏ là đủ."
  ep3_governor_yearly.8130.c: "Những người khốn khó của [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] cần được giúp đỡ."
  ep3_governor_yearly.8130.d: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] không phải là ví tiền riêng của ta!"

  ep3_governor_yearly.8140.t: "Kiềm Chế Gia Tộc [estate_owner.GetHouse.GetBaseNameNoTooltip]"
  ep3_governor_yearly.8140.desc: "Một nông dân từ [estate_county.GetNameNoTier] được dẫn đến trước mặt ta, đại diện cho chuỗi dài những lời than phiền của cộng đồng [peasant.GetHerHis] đối với điền trang Gia tộc [estate_owner.GetHouse.GetBaseName] gần đó tại [estate.GetLocation.GetBaronyNameExplicitly].\n\n\"Phước lành của [peasant.GetFaith.HighGodNamePossessive] ban cho ngài, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Đám quý tộc của điền trang địa phương đã tước đoạt đất đai của chúng Ta, cấm tiếp cận đất công và đòi thu thuế — tất cả dưới sự đe dọa bạo lực!\""
  ep3_governor_yearly.8140.a: "Thật quá đáng, chuyện này sẽ được giải quyết!"
  ep3_governor_yearly.8140.b: "Ta sẽ đứng ra hòa giải cho cả hai bên."
  ep3_governor_yearly.8140.c: "[estate_owner.GetTitledFirstNameNoTooltip] có thể làm bất cứ điều gì [estate_owner.GetSheHe] muốn, tên nông dân."
  ep3_governor_yearly.8140.d: "Đáng tiếc, nhưng ta không thể làm gì được."

  ep3_governor_yearly.8150.t: "Bất Mãn Sôi Sục"
  ep3_governor_yearly.8150.desc: "Sự bất mãn đang bao trùm [rebel_county.GetNameNoTier], và dân chúng ngày càng trở nên xáo động. Ta sẽ mất mặt lớn nếu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta bị đe dọa bởi nổi loạn...\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))] của ta, [marshal.GetFirstName], mệt mỏi đọc to các báo cáo về vũ khí bị đánh cắp từ kho quân sự, thuế bị giữ lại, và những cuộc tấn công nhằm vào các đội tuần tra không phòng bị.\n\n\"Chuyện này #EMP nhất định phải#! được xử lý với bọn"
  ep3_governor_yearly.8150.culture: "[targeting_faction.MakeScope.Var('faction_culture').Culture.GetName] gây rối!\""
  ep3_governor_yearly.8150.faith: "[targeting_faction.MakeScope.Var('faction_faith').Faith.GetName] cuồng tín!\""
  ep3_governor_yearly.8150.peasant: "đám nông dân đáng nguyền rủa kia, thưa [ROOT.Char.GetTitleAsNameNoTooltip]!\""
  ep3_governor_yearly_8150.end: "[marshal.GetSheHe] gầm gừ."
  ep3_governor_yearly.8150.a: "Chỉ cần chặt đầu con rắn là đủ, [marshal.GetFirstNameNoTooltip]."
  ep3_governor_yearly.8150.a.success: "Chúng nhanh chóng yên lặng lại"
  ep3_governor_yearly.8150.a.failure: "Những khoản hối lộ của Ngài chỉ khiến chúng thêm phẫn nộ"
  ep3_governor_yearly.8150.b: "Nhượng bộ tượng trưng đôi chút là chúng sẽ giải tán."
  ep3_governor_yearly.8150.c: "Đúng vậy, phải làm gương."
  ep3_governor_yearly.8150.d: "Đám gây rối này rồi cũng sẽ chán thôi."
  ep3_governor_yearly.8150.d.tt: "Sẽ nhận #V 2#! [skirmisher|E] [regiments|E] khi tuyên bố [war|E]"
  ep3_governor_yearly.8150.county_tt: "Mỗi [targeting_faction.GetName] [faction|E] [county|E], và các [counties|E] có thể tham gia ([SCOPE.ScriptValue('ep3_governor_yearly_8150_total_count_value')|V0])"
  ep3_governor_yearly_8150_troop_name: "Khởi Nghĩa Nông Dân"
  cultural_acceptance_ep3_governor_yearly_8150_crackdown: "Một [governor|E] đã đàn áp quân nổi loạn địa phương"

  ep3_governor_yearly.8160.t: "Tiếp Cận Công Bằng"
  ep3_governor_yearly.8160.desc: "[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] là vùng đất của nhiều dân tộc và nhiều tín ngưỡng. Với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], ta chịu trách nhiệm đối với người ngoại bang và dị giáo, cũng như với [ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip].\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của ta, [councillor.GetFirstName], thẳng thừng bày tỏ quan điểm rằng: \"nền hành chính là lãnh địa của"
  ep3_governor_yearly.8160.culture_end: "và mọi lời kêu gọi tăng cường sự tham gia của [minority_county.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] đều phải bị dập tắt!\""
  ep3_governor_yearly.8160.faith_end: "và mọi lời kêu gọi tăng cường sự tham gia của [minority_county.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] [councillor.Custom2('GetUnbelieverTerm', administrator)] đều phải bị dập tắt!\""
  ep3_governor_yearly.8160.a: "Lưới càng lớn thì bắt được càng nhiều cá."
  ep3_governor_yearly.8160.b: "Ngươi nói đúng, chúng phải biết thân phận của mình."
  ep3_governor_yearly.8160.culture_county_tt: "Mỗi [county|E] có văn hóa [minority_county.GetCountyData.GetCulture.GetName]"
  ep3_governor_yearly.8160.faith_county_tt: "Mỗi [county|E] theo [minority_county.GetCountyData.GetFaith.GetAdjective]"
  ep3_governor_yearly.8160.culture_councillor: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — và dĩ nhiên là cả [councillor.GetCulture.GetCollectiveNounNoTooltip] —"
  ep3_governor_yearly.8160.culture_self: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — và tất nhiên cả [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] —"
  ep3_governor_yearly.8160.culture: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip],"
  ep3_governor_yearly.8160.faith: "những tín đồ ngoan đạo của [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip],"
  ep3_governor_yearly.8160.d: "Ta không thấy cần phải thay đổi điều gì."
  ep3_governor_yearly.8160.courtier_tt: "Ngài sẽ tuyển mộ một quan chức hành chính [minority_county.GetCountyData.GetCulture.GetName] theo [minority_county.GetCountyData.GetFaith.GetAdjective]"
  cultural_acceptance_promoted_bureaucrats: "[governor|E] đã thăng chức cho các quan chức ngoại bang"

  ep3_governor_yearly.8170.t.sea: "Các Cuộc Cướp Phá Trên Biển của [raider.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  ep3_governor_yearly.8170.t.land: "Các Cuộc Xâm Nhập của [raider.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  ep3_governor_yearly.8170.desc: "Việc chống trả các cuộc cướp phá từ"
  ep3_governor_yearly.8170.sea: "bên kia biển — đặc biệt là bọn cướp biển khét tiếng [raider.GetPrimaryTitle.GetAdjective] —"
  ep3_governor_yearly.8170.land: "ngoài biên giới — đặc biệt là từ [raider.GetPrimaryTitle.GetAdjective] [raider.GetPrimaryTitle.GetTierAsNameNoTooltip] láng giềng  —"
  ep3_governor_yearly.8170.ending: "là điều tối quan trọng đối với an ninh chung của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gần đây đã rà soát các biện pháp phòng thủ của chúng ta, và dành cả buổi chiều để đề xuất hàng loạt cải tiến chóng mặt. Quan trọng nhất trong số đó là một hệ thống cảnh báo, giúp các ngôi làng có thời gian sơ tán."
  ep3_governor_yearly.8170.a: "Triển khai ngay hệ thống \"cảnh báo\" này!"
  ep3_governor_yearly.8170.b: "Ta có một ý hay hơn."
  ep3_governor_yearly.8170.b.success: "Ý tưởng của Ngài cực kỳ hiệu quả"
  ep3_governor_yearly.8170.b.failure: "Ngài đã hiểu sai vấn đề một cách căn bản"
  ep3_governor_yearly.8170.c: "Có lẽ vẫn có thể thương lượng với tên cướp này."
  ep3_governor_yearly.8170.c.success: "[raider.GetTitledFirstNameNoTooltip] bị thuyết phục"
  ep3_governor_yearly.8170.c.failure: "Thông điệp của Ngài bị phớt lờ"
  ep3_governor_yearly.8170.d: "Cướp phá đơn thuần là một phần của đời sống biên giới."
  ep3_governor_yearly.8170.modifier_tt: "Mỗi [county|E] bị [raider.GetTitledFirstName] đe dọa ([THIS.Char.MakeScope.Var('threatened_counties_count').GetValue|V0])"
  ep3_governor_yearly.8170.opinion_tt: "Mỗi [vassal|E] bị [raider.GetTitledFirstName] đe dọa ([THIS.Char.MakeScope.Var('threatened_counties_count').GetValue|V0])"
  ep3_governor_yearly_8170_truce: "[raider.GetUINameNotMe|U] đã đồng ý không cướp phá các vùng đất của [governor.GetUINamePossessive|U]"
