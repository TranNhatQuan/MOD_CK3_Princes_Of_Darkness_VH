l_english:
 
  ep3_wedding.0001.t: "Chưa Hẳn Là [other_family_spouse.Custom('GetBrideGroom')|U]"
  ep3_wedding.0001.desc: "Điệu nhảy đã bắt đầu! Âm nhạc tuôn trào như một dòng sông cuộn chảy, như cơn gió khuấy động cả những cái cây hùng vĩ nhất. [flirting_in_law.GetName], [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] của [other_family_spouse.Custom('GetBrideGroom')], nhảy múa giữa những người khác, cơ thể [flirting_in_law.GetHerHis] như chiếc lá trong gió. Ánh nhìn của [flirting_in_law.GetHerHis|U] không đặt vào những vũ công khác, không... đôi mắt của [flirting_in_law.GetHerHis] dán chặt vào mắt ta. #EMP Một cách đầy mời gọi.#!\n\nĐêm càng về khuya. Những cái nhìn thiêu đốt của [flirting_in_law.GetFirstNamePossessiveNoTooltip] được nối tiếp bằng những khoảnh khắc thoáng qua của sự đụng chạm tinh tế, và sự cuồng nhiệt của [flirting_in_law.GetHerHis] bắt đầu khơi dậy điều gì đó trong ta."
  ep3_wedding.0001.desc_own_wedding: "Với [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))] của Ta là [other_family_spouse.GetFirstName] không thấy đâu, có lẽ #EMP đây chính là#! cách Ta nếm thử sức quyến rũ của gia đình [other_family_spouse.GetHerHis]...?\n\nNhưng ngay trong đám cưới của chính Ta ư? #EMP Với [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] của [other_family_spouse.Custom('WifeHusband')] Ta?!?"
  ep3_wedding.0001.desc_guest: "Và cũng đâu phải là #EMP chúng ta#! đang kết nên một mối liên kết thiêng liêng hôm nay!\n\nCó lẽ vẫn còn chỗ trong một góc tối nào đó cho một cuộc hoan lạc đầy báng bổ..."
  ep3_wedding.0001.a_non_spouse: "Ngày hôm nay là dành cho [same_family_spouse.GetFirstNameNoTooltip], chỉ riêng [same_family_spouse.GetHerHim] mà thôi!"
  ep3_wedding.0001.a_spouse: "Ngày hôm nay là dành cho [other_family_spouse.GetFirstNameNoTooltip], chỉ riêng [other_family_spouse.GetHerHim] mà thôi!"
  ep3_wedding.0001.a.flavor_non_spouse: "Ta sẽ không bao giờ phản bội niềm tin của [same_family_spouse.GetHerHis], dù chỉ bằng một phút lầm lỡ nhỏ nhoi!"
  ep3_wedding.0001.a.flavor_spouse: "Ta sẽ không bao giờ phản bội niềm tin của [other_family_spouse.GetHerHis], dù chỉ bằng một phút lầm lỡ nhỏ nhoi!"
  ep3_wedding.0001.b: "Hãy #EMP ăn mừng#!."
  ep3_wedding.0001.b.flavor: "Tiến lại gần [flirting_in_law.GetNameNoTooltip] có lẽ là một sai lầm... nhưng là một sai lầm đầy thú vị."
  ep3_wedding.0001.c: "Chỉ là một điệu nhảy thân tình thì có hại gì đâu."
  ep3_wedding.0001.c.flavor: "Dù sao thì giờ tất cả cũng là người một nhà rồi! Có gì lạ hay đáng ngờ trong việc sẻ chia những an ủi nho nhỏ với gia đình...?"
  ep3_wedding.001.b.got_caught: "@warning_icon!#X  Cuộc dan díu của Ngài đã bị phát hiện! Ngài rất có thể sẽ phải gánh chịu hậu quả#!"

  ep3_wedding.0001.b.success.desc.tt: "Say men vì dục vọng, hai người lén lút rút lui cùng nhau"
  ep3_wedding.0001.b.caught.desc.tt: "Ngài bị bắt gặp — ngay giữa lúc ân ái!"
  ep3_wedding.0001.b.fail.desc.tt: "Ghê tởm, [flirting_in_law.GetSheHe] thẳng thừng khước từ Ngài"
  own_wedding_difficulty_tooltip: "@warning_icon! #X Giảm tỷ lệ thành công — vì #EMP đây là đám cưới của chính Ngài!#!"

  ep3_wedding.0002.t: "Nhịp Điệu Trong Bóng Tối"
  ep3_wedding.0002.intro: "[flirting_in_law.GetName], [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] đầy mê hoặc của [other_family_spouse.Custom('GetBrideGroom')], dường như chưa từng ngừng khiêu vũ. Khi lễ phục cưới xa hoa của [flirting_in_law.GetHerHis] lần lượt rơi xuống bóng tối, khi [flirting_in_law.GetFirstNameNoTooltip] áp làn da ấm nóng của [flirting_in_law.GetHerHis] vào Ta... những chuyển động đung đưa của [flirting_in_law.GetHerHis] chỉ càng thêm mạnh mẽ, thêm khẩn thiết.\n\nKhi mọi việc đã xong, Ta đổ gục trong một cơn cười ngây ngất;"
  ep3_wedding.0002.own_wedding: "[other_family_spouse.Custom('WifeHusband')] của Ta, [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))], dành cho Ta một vòng xoay trần trụi cuối cùng.\n\n[other_family_spouse.Custom('WifeHusband')] mới của Ta đang chờ đợi, đúng vậy..."
  ep3_wedding.0002.others_wedding: "kẻ đồng lõa trong phút lầm lạc của Ta dành cho Ta một vòng xoay trần trụi cuối cùng.\n\nBữa tiệc cưới đang chờ chúng Ta, đúng vậy..."
  ep3_wedding.0002.lowborn: "nhưng ta đã rất thích thú khi nô đùa giữa những nhánh cây trong gia phả của [other_family_spouse.GetHerHis]."
  ep3_wedding.0002.highborn: "nhưng ta đã rất thích thú khi nô đùa giữa những nhánh cây trong gia phả nhà [other_family_spouse.GetHouse.GetName]."

  ep3_wedding.0002.a: "\"Ta... ta nghĩ là ta yêu nàng, [flirting_in_law.GetFirstNameNoTooltip].\""
  ep3_wedding.0002.a.flavor: "Ta đã phạm phải một tội lỗi lớn với [other_family_spouse.Custom('WifeHusband')] mới của mình, nhưng vì lý do cao cả nhất tồn tại: trái tim!"
  ep3_wedding.0002.a.flavor_non_spouse: "Quả thực, chuyện này hẳn đã được định sẵn, trong thời khắc tình yêu được thánh hóa này!"
  ep3_wedding.0002.a.success.desc.tt: "[flirting_in_law.GetSheHe|U] cũng đang phải lòng Ngài"
  ep3_wedding.0002.a.fail.desc.tt:  "[flirting_in_law.GetSheHe|U] cảm thấy được tâng bốc, nhưng chỉ có vậy thôi"
  ep3_wedding.0002.b: "\"Nàng sẽ lại khiêu vũ cùng ta nữa chứ...?\""
  ep3_wedding.0002.c: "\"Quay lại bữa tiệc thôi!\""
  lust_demon_success_chance: "#weak Tăng mạnh [success_chance|E] của [GetScheme('seduce').GetTypeName] [scheme|E] khi đối đầu các nhân vật mộ đạo"
  lust_demon_success_chance_tt: "Ngài nhận được mức tăng đáng kể [success_chance|E] của [GetScheme('seduce').GetTypeName] [scheme|E] khi đối đầu các nhân vật có đặc tính [GetTrait('zealous').GetName( GetNullCharacter )] trong #high 10 năm#!"
  ep3_wedding.0003.t: "Đó Là [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))|U] Của Ta!"
  ep3_wedding.0003.desc_intro: "[flirting_in_law.GetTitledFirstName] thét lên — chúng ta chạm tới những khoảnh khắc co giật cuối cùng của cuộc hoan hợp-\n\n"
  ep3_wedding.0003.desc_own_wedding: "\"#EMP [other_family_spouse.GetFaith.DevilName] hãy lấy đi đôi mắt ta!#!\" giọng nói không thể nhầm lẫn của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))] mới của ta vang lên. \"#EMP Ta đã vấp phải thứ ô uế gì thế này?!?#!\"\n\n[other_family_spouse.GetHerHis|U] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] bật khỏi thân thể trơn trượt của ta, vẫn còn thở hổn hển... nhưng [other_family_spouse.GetFirstName] đã thấy tất cả, và nghẹn họng trước sự xúc phạm tột cùng này đối với lời thề hôn nhân của chúng ta."
  ep3_wedding.0003.desc_guest: "\"#EMP [other_family_spouse.GetFaith.DevilName] hãy lấy đi đôi mắt ta!#!\" giọng nói không thể nhầm lẫn của [other_family_spouse.GetTitledFirstNamePossessive] vang lên. \"#EMP Ta đã vấp phải thứ gì thế này?!?#!\"\n\n[other_family_spouse.GetHerHis|U] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] bật khỏi thân thể trơn trượt của ta, vẫn còn thở hổn hển... nhưng [other_family_spouse.GetFirstName] đã thấy tất cả, và tỏ ra cực kỳ khó chịu."

  ep3_wedding.0003.a: "Trông nàng #EMP thật#! quyến rũ khi nổi giận..."
  ep3_wedding.0003.a.flavor: "Chẳng phải nàng muốn ăn mừng đám cưới của mình sao, hỡi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))] của ta... chỉ ba chúng ta thôi?"
  ep3_wedding.0003.b: "Nhắc đến chuyện này và ngươi sẽ chết, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))]."
  ep3_wedding.0003.c: "Ta đã bị một con quỷ dục vọng làm cho phát điên, #EMP ĐIÊN LOẠN#!!"
  ep3_wedding.0003.c.flavor: "Đúng vậy, có một ác linh đang nhập vào ta — và nếu nó không được thỏa mãn bằng xác thịt, nó sẽ... ờ thì... #EMP hủy diệt ta!#! Ta thực sự không còn lựa chọn nào khác!"
  ep3_wedding.0003.c.success.desc: "[other_family_spouse.GetFirstNameNoTooltip] rơi lệ vì nỗi khổ của Ngài"
  ep3_wedding.0003.c.fail.desc: "[other_family_spouse.GetFirstNameNoTooltip] vạch trần những lời dối trá của Ngài"
  ep3_wedding.0003.d: "Ngươi nghĩ ta #EMP quan tâm#! chuyện cuộc vui nhỏ này là \"sai trái\" ư...?"
  ep3_wedding.0003.d.flavor: "Đi lải nhải chuyện này ở chỗ khác đi, đồ ngốc ướt át."
  ep3_wedding.0003.e: "Xin đừng nói với ai! Ta vô cùng hối hận."
  ep3_wedding.0003.e.flavor: "Một khi đã bị thiêu đốt bởi ngọn lửa cấm kỵ... trái tim ta giờ đã tan nát thành muôn mảnh."
  possessed_by_lust_demon_modifier: "Bị Quỷ Dục Vọng Chiếm Hữu (Tự Nhận)"
  possessed_by_lust_demon_modifier_desc: "Nhân vật này khăng khăng rằng họ đang sống dưới mối đe dọa của một ác linh đói khát, kẻ sẽ mang đến hủy diệt nếu không được thỏa mãn bằng xác thịt."
  unflappable_boudoir_confidence_modifier: "Sự Tự Tin Phòng Khuê Không Gì Lay Chuyển"
  unflappable_boudoir_confidence_modifier_desc: "Gã trăng hoa này hoàn toàn trơ trẽn trước những ham muốn của mình... theo cách mà nhiều người cho là tai tiếng, và nhiều kẻ khác lại thấy đầy quyến rũ. "
