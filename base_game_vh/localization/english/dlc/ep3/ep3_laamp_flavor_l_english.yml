l_english:
  ep3_laamp_flavor.0001.t1: "Kẻ Ăn Xác"
  ep3_laamp_flavor.0001.t2: "Nuốt Nhục"
  ep3_laamp_flavor.0001.desc1: "Kền kền lượn vòng trên cao khi mặt trời thiêu đốt rọi xuống cái bụng rỗng không của ta. Ta lục lọi số khẩu phần còn lại; chúng ta chỉ còn bánh khô và ngay cả thứ đó cũng đang dần cạn kiệt. Chúng ta cần phải bổ sung sớm nếu không muốn đối mặt với nạn đói.\n\nTa đã đưa tình thế nguy cấp này đến sự chú ý của những người khác. Không lựa chọn nào trong số đó nghe có vẻ hấp dẫn. Gồng cánh tay cầm cung, [vulture_shooter.GetFirstName] tình nguyện bắn hạ một số con vật ăn xác thối để bổ sung vào nguồn cung cấp ít ỏi của chúng ta."
  ep3_laamp_flavor.0001.desc2: "Hải âu lượn vòng trên cao khi chuyển động chòng chành của con tàu chỉ làm nổi bật nỗi đau từ cái bụng rỗng không của ta. Ta lục lọi số khẩu phần còn lại; chúng ta chỉ còn bánh khô và ngay cả thứ đó cũng đang dần cạn kiệt. Chúng ta cần phải bổ sung sớm nếu không muốn đối mặt với nạn đói.\n\nTa đã đưa tình thế nguy cấp này đến sự chú ý của những người khác. Không lựa chọn nào nghe có vẻ hấp dẫn. Gồng cánh tay cầm cung, [vulture_shooter.GetFirstName] tình nguyện bắn hạ một số con vật ăn xác thối để bổ sung vào nguồn cung cấp ít ỏi của chúng ta."
  ep3_laamp_flavor.0001.desc: "Quạ lượn vòng trên cao khi bụng ta đau nhói vì đói. Ta lục lọi số khẩu phần còn lại; chúng ta chỉ còn bánh khô và ngay cả thứ đó cũng đang dần cạn kiệt. Chúng ta cần phải bổ sung sớm nếu không muốn đối mặt với nạn đói.\n\nTa đã đưa tình thế nguy cấp này đến sự chú ý của những người khác. Không lựa chọn nào nghe có vẻ hấp dẫn. Gồng cánh tay cầm cung, [vulture_shooter.GetFirstName] tình nguyện bắn hạ một số con vật ăn xác thối để bổ sung vào nguồn cung cấp ít ỏi của chúng ta."
  ep3_laamp_flavor.0001.a: "Một đề xuất tuyệt vời."
  ep3_laamp_flavor.0001.a.cannibal: "Ta từng ăn thứ còn tệ hơn."
  ep3_laamp_flavor.0001.b: "Chúng chắc chắn sẽ #EMP kinh tởm#! đến mức không thể nuốt nổi!"
  ep3_laamp_flavor.0001.c: "Ăn xác thối vốn nổi tiếng là gây bệnh."
  ep3_laamp_flavor.0001.d: "Ta cá là ta bắn được nhiều chim hơn [vulture_shooter.GetFirstNameNoTooltip]."
  ep3_laamp_flavor.0001.a.sick: "Ăn Thịt Xác Thối"
  ep3_laamp_flavor.0001.a.fine: "Ăn Thịt Xác Thối"
  agreed_to_shoot_vultures: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] gắn kết với nhau qua một bữa ăn thối rữa."
  agreed_to_shoot_vultures_corresponding: "[TARGET_CHARACTER.GetShortUIName] và [CHARACTER.GetShortUIName|U] gắn kết với nhau qua một bữa ăn thối rữa."
  no_vulture_eating: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] bất hòa vì viễn cảnh phải ăn xác thối."
  no_vulture_eating_corresponding: "[TARGET_CHARACTER.GetShortUIName] và [CHARACTER.GetShortUIName|U] bất hòa vì viễn cảnh phải ăn xác thối."
  ep3_laamp_flavor.0001.sick: "Thịt loài ăn xác không hợp với ta"
  ep3_laamp_flavor.0001.notsick: "Khó nuốt, nhưng vẫn sống sót được"
 
  ep3_laamp_flavor.0020.t: "Kẻ Trộm!"
  ep3_laamp_flavor.0020.intro: "Ta vội vã chạy đến quảng trường ngay khi nghe tin; [thieving_follower.GetFirstName] đã bị bắt quả tang khi đang trộm đồ ở một sạp hàng. Ngồi chủ tọa trên cao không ai khác ngoài [town_leader.GetTitledFirstName], kẻ nhìn ta bằng ánh mắt có thể giết người. Trái lại, [thieving_follower.GetFirstNameNoTooltip] có vẻ rất vui khi thấy ta xuất hiện từ cảnh ngộ khốn đốn của [thieving_follower.GetHerHis] trong cũi giam.\n\n\"Hình phạt cho hành vi trộm cắp tại [town_location.GetName] là,\" [town_leader.GetTitledFirstName] giải thích,"
  ep3_laamp_flavor.0020.desc1: "\"thường là đánh roi nặng nếu không thể nộp khoản tiền phạt theo lệ. Tuy nhiên, với tư cách là thành viên có tiếng của một băng nhóm lang bạt tội phạm, ta không định tỏ ra nhân từ.\""
  ep3_laamp_flavor.0020.desc: "\"thường là đánh roi nặng. Tuy nhiên, ta sẵn sàng miễn hình phạt này nếu nộp được khoản tiền phạt thích đáng.\""
  ep3_laamp_flavor.0020.a: "Ta sẽ nộp tiền phạt cho [thieving_follower.GetFirstNameNoTooltip]."
  ep3_laamp_flavor.0020.b: "[thieving_follower.GetFirstNameNoTooltip] phải chấp nhận hình phạt."
  ep3_laamp_flavor.0020.c: "Làm ơn đi, [town_leader.GetTitledFirstNameNoTooltip], ta cầu xin ngài. Hãy thả [thieving_follower.GetFirstNameNoTooltip]!"
  ep3_laamp_flavor.0020.d: "Chúng ta yêu cầu xét xử bằng đấu tay đôi!"
  thievery_rivalry_opinion: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] sinh lòng oán giận lẫn nhau vì một vụ trộm vặt."
  ep3_laamp_flavor.0020.d.tt.success: "Chúng ta giành chiến thắng trong trận đấu, và [thieving_follower.GetFirstName] được minh oan"
  ep3_laamp_flavor.0020.d.tt.fail: "Trận đấu thất bại, và [thieving_follower.GetFirstName] phải trả giá"
  thievery_helper_opinion: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] trở nên gắn bó khi [CHARACTER.GetShortUIName] giúp [TARGET_CHARACTER.GetShortUIName] thoát khỏi hậu quả từ những hành động của ngài."
  thievery_helper_opinion_corresponding: "[TARGET_CHARACTER.GetShortUIName] và [CHARACTER.GetShortUIName|U] trở nên gắn bó khi [CHARACTER.GetShortUIName] giúp [TARGET_CHARACTER.GetShortUIName] thoát khỏi hậu quả từ những hành động của ngài."

  ep3_laamp_flavor.0030.t: "Giấc Mơ Ngọt Ngào"
  ep3_laamp_flavor.0030.desc: "Những bàn tiệc kéo dài vô tận! Ngai vàng cao quý của ta lấp lánh hồng ngọc và lam ngọc! Khách khứa từ bốn phương thiên hạ tụ họp để chúc mừng hai mươi năm trị vì phúc lành của ta.\n\n\"Thêm một chén tiên tửu ngọt ngào nữa chứ, Hoàng đế vinh quang?\" Tổng Quản Gia Tối Cao [dream_friend.GetFirstName] hỏi, dâng lên một chiếc cốc lộng lẫy. Ta uống cạn một cách hăm hở.\n\n\"Nhảy múa cho ta xem, tên hề!\" Ta gầm lên với [dream_rival.GetFirstName] đang bị sỉ nhục và khuất phục. Đó là số phận của những kẻ dám chống lại ta. Ta nhắm mắt lại chỉ trong khoảnh khắc.\n\nKhi mở ra lần nữa, ta thấy mình nằm trên chiếc giường rơm quen thuộc đến đau lòng. Ta thở dài. Chỉ là một giấc mơ."
  ep3_laamp_flavor.0030.a: "Ta sẽ biến giấc mơ thành hiện thực."
  ep3_laamp_flavor.0030.b: "Ít nhất thì đó cũng là một giấc mơ đẹp."
  ep3_laamp_flavor.0030.c: "Ta mừng vì đã thoát khỏi cuộc đời ấy."
  dream_ambitious: "Tham Vọng Đế Vương"
  dream_envious: "Ghen Tị Với Lãnh Thổ"
  dream_content: "Tự Do Khỏi Trách Nhiệm"

  ep3_laamp_flavor.0040.t: "Tiểu Lãnh Chúa Lạc Lối"
  ep3_laamp_flavor.0040.desc: "Trong khi đi do thám [location_scope.GetTerrain.GetNameNoTooltip] tại [ROOT.Char.GetCurrentLocation.GetName], ta phát hiện một bóng người đang cho ngựa uống nước bên đường. Khi tiến lại gần, ta nhận ra [runaway_child.GetHerHim] chính là [runaway_child.GetFullName], [runaway_child.Custom('GetDaughterSon')] của [local_ruler.GetTitledFirstName]. Ánh mắt ngài phản chiếu nỗi sợ hãi và bối rối, bộ quần áo đẹp đẽ thì rách và bẩn thỉu.\n\nSau cuộc trò chuyện ngắn và căng thẳng, ta biết được rằng ngài đã bỏ nhà ra đi sau một cuộc cãi vã gia đình nào đó, chi tiết mà ta khó hiểu rõ. Không lâu sau đó ngài bị lạc lối trong vùng hoang dã. Với đôi mắt đẫm lệ, ngài hỏi liệu ngài có thể đi cùng chúng ta, hoặc ít nhất là hộ tống ngài trở lại với [local_ruler.GetMotherFather] của ngài."
  ep3_laamp_flavor.0040.a: "Đi cùng chúng ta, chúng ta sẽ đưa ngươi về nhà."
  ep3_laamp_flavor.0040.b: "Chào mừng đến với băng nhóm vui vẻ của chúng ta."
  ep3_laamp_flavor.0040.c: "Ta rất mong được viết lá thư đòi tiền chuộc."
  stole_my_child_opinion: "Bắt Cóc Con Ta"
  returned_my_child_opinion: "Trả Lại Con Ta An Toàn"

  ep3_laamp_flavor.0050.t: "Tên Pháp Sư Gọi Hồn"
  ep3_laamp_flavor.0050.desc: "Không thể ngủ được, một cuộc đi dạo đêm trong [location_scope.GetTerrain.GetNameNoTooltip|l] khiến tâm trí ta lang thang thì ta nghe thấy... #EMP tụng niệm#!?\n\nLần theo âm thanh đến nguồn của nó, ta tìm thấy một vòng đuốc đang chiếu sáng một cảnh tượng tò mò và bất an.\n\nMột người đàn ông mặc áo choàng, mắt dán chặt vào cuốn ma đạo thư, đang triệu hồi tên những con quỷ mà ông ta tìm cách ràng buộc vào ý chí của mình. Trước mặt ông ta là một vòng tròn nghi lễ được vẽ bằng phấn, phức tạp, thanh lịch và hoàn toàn điên rồ — người đàn ông này rõ ràng là một [Glossary('necromancer', 'NECROMANCER_GLOSS' )]!\n\nBị sốc, ta vấp ngã và làm ồn, vô tình công bố sự hiện diện của mình."
  ep3_laamp_flavor.0050.a: "Ngươi sẽ lập tức chấm dứt thứ tà thuật ghê tởm này!"
  ep3_laamp_flavor.0050.b: "Thú vị đấy! Ngươi có thể dạy ta gì về thuật triệu quỷ?"
  ep3_laamp_flavor.0050.c: "Ngươi có thể dạy cho [player_heir_scope.Custom('GetDaughterSon')] của ta, [player_heir_scope.GetFirstNameNoTooltip], về hắc thuật không?"
  ep3_laamp_flavor.0050.d: "Thật kinh hoàng! Ta phải bỏ chạy!"
  learned_in_demonology: "Tinh Thông Thuật Triệu Quỷ"
  ep3_laamp_flavor.0050.d.tt.success: "Tên pháp sư gọi hồn bị xua đuổi"
  ep3_laamp_flavor.0050.d.tt.fail: "Tên pháp sư áp đảo ngươi, buộc ngươi phải rút lui"
  NECROMANCER_GLOSS: "Bất chấp cái tên, thuật gọi hồn trong lịch sử bao gồm nhiều dạng huyền thuật Abraham giáo, thường liên quan đến việc cầu khẩn các linh thể bị Giáo hội xem là #EMP ô uế#!, dù là quỷ, người chết, hay những thực thể Kinh Thánh mơ hồ khác."

  ep3_laamp_flavor.0060.t: "Gánh Nặng Thừa Thãi"
  ep3_laamp_flavor.0060.desc: "\"Đủ rồi với cái kiểu rên rỉ không ngừng của ngươi! Ta cũng đã nhiều ngày chưa được ăn, và ta đâu có cái đặc quyền được khiêng đi như một hoàng tử!\" [follower.GetFirstName] đập nắm đấm của [follower.GetHerHis] vào song sắt của chiếc lồng kéo bằng ngựa giam giữ [prisoner.GetFirstNamePossessive].\n\n\"Chúng ta đang chết đói, và con chuột kia chỉ là gánh nặng vô dụng ngốn lương thực. Chúng ta nên treo cổ [prisoner.GetHerHim] rồi kết thúc mọi chuyện.\" [follower.GetFirstNameNoTooltip] chỉ tay về phía một cái cây chết ở phía trước."
  ep3_laamp_flavor.0060.a: "[prisoner.GetFirstNameNoTooltip] đã sống đủ lâu rồi."
  ep3_laamp_flavor.0060.b: "Ngươi không phải về nhà, nhưng cũng không thể ở lại đây."
  ep3_laamp_flavor.0060.c: "Tên tù nhân đó có giá trị với ta, hãy để [prisoner.GetHerHim] yên."
  burdensome_prisoner_modifier: "Gánh Nặng Thừa Thãi"
 
  ep3_camp_temperament.0001.t: "Nuôi Dưỡng Một Người Ngài"
  ep3_camp_temperament.0001.desc: "\"Bọn ta có thể không kiếm được loại thịt ngon nhất cho ngươi,\" giọng của [potential_friend.GetFirstNamePossessive] khiến ta giật mình, nụ cười toe toét hiện rõ trên gương mặt [potential_friend.GetHerHis], \"nhưng kẻ lang bạt thì không được kén cá chọn canh.\"\n\n[potential_friend.GetSheHe|U] nâng cao chiếc cốc, rồi ra hiệu về phía những người theo hầu còn lại của ta đang ngồi quanh một đống lửa leo lét. Những túi trái cây tươi được mở toang đặt bên cạnh họ.\n\n\"Đừng nghĩ rằng bọn ta không thấy những gì ngươi làm cho chúng ta,\" [potential_friend.GetSheHe] nói tiếp, giọng nhỏ lại, \"ai cũng cần phải góp phần của mình.\""
  ep3_camp_temperament.0001.a: "\"Hãy cùng nhau ăn nào!\""
  ep3_camp_temperament.0001.b: "\"Các ngươi đã bỏ độc vào đống này phải không!?\""
  ep3_camp_temperament.0001.c: "Ta có thể bán đống này lấy ít vàng..."
  ep3_camp_temperament.0001.d: "\"#EMP Ngươi#!,  Bạn củata, quả là một báu vật.\""
  ep3_camp_temperament.0001.e: "\"Cảm ơn vì những nỗ lực của ngươi.\""
 
  ep3_camp_temperament.0010.t: "Khắp Mọi Góc Khuất"
  ep3_camp_temperament.0010.desc.intro: "Cơn mưa thúc đẩy phần lớn những người theo hầu của ta tìm chỗ trú dưới cùng một [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], trong khi [enemy.GetTitledFirstNamePossessiveNoTooltip] lớn tiếng chửi rủa giữa đám đông, và ta cố gắng che giấu sự hiện diện của mình.\n\n\"Cái [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('enemy'))] đó, một kẻ hoàn toàn vô dụng, ngu xuẩn! Chẳng lẽ các ngươi không thấy rằng [ROOT.Char.GetSheHe] không đủ khả năng cai quản chính cái trại của [ROOT.Char.GetHerHis] sao? Làm sao chúng ta có thể trông đợi [ROOT.Char.GetHerHim] cai quản thứ gì lớn hơn một vũng nước?\"\n\n"
  ep3_camp_temperament.0010.desc.spouse: "Ta thật không thể tin được. Chính là người phối ngẫu của ta."
  ep3_camp_temperament.0010.desc.child: "Ta thật không thể tin được. Chính là con của ta."
  ep3_camp_temperament.0010.desc.friend: "Ta thật không thể tin được. Chính là người Bạn Thân nhất của ta."
  ep3_camp_temperament.0010.a: "Không... không phải ngươi."
  ep3_camp_temperament.0010.a.flavor: "#EMP Et tu, [enemy.GetFirstNameNoTooltip]?#!"
  ep3_camp_temperament.0010.b: "Giờ ngươi làm việc cho ta."
  ep3_camp_temperament.0010.c: "Ngươi sẽ phải trả giá vì chuyện này."
  ep3_camp_temperament.0010.d: "Có lẽ chút thức ăn sẽ lay chuyển được họ."
  ep3_camp_temperament.0010.e: "Họ không cần phải thích ta."
  ep3_camp_temperament_0010_tt: "Ngài nhận được một bonus #positive_value trung bình#! cho các [schemes|E] [GetScheme('murder').GetTypeName] và [GetScheme('sway').GetTypeName] nhắm vào [enemy.GetName]"
  ep3_heartbreak_modifier: "Kẻ Thù Thân Thuộc"
  ep3_heartbreak_modifier_desc: "Nhân vật này bị bôi nhọ trước trại của mình bởi một thành viên thân cận trong gia đình."
  SCHEME_ET_TU_BRUTE: "Ngài đã phát hiện kế hoạch của [target.GetShortUINamePossessiveNoTooltip]: $VALUE|+0=$"
  bribed_opinion: "Bị Mua Chuộc"
  ep3_determined_modifier: "Thù Hận Thúc Đẩy"
  ep3_determined_modifier_desc: "Nhân vật này quyết tâm rửa sạch danh dự của mình, bất chấp mọi giá."
 
  ep3_camp_temperament.0020.t: "Tin Đồn"
  ep3_camp_temperament.0020.desc: "Cánh cửa lều của ta mở ra và [secret_giver.GetTitledFirstName] đứng ngay trước mặt. Với một cái cúi chào nhẹ, [secret_giver.GetSheHe] bắt đầu: \"Xin thứ lỗi vì đã làm phiền ngài, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng ta mang đến một tin tức có thể khiến ngài quan tâm.\"\n\n\"Ta đang nghỉ chân tại [ROOT.Char.Custom('GetPubName')], uống rượu cùng một nhóm người, và họ tự tiết lộ rằng mình là thuộc hạ của [secret_owner.GetTitledFirstName].\"\n\n\"Họ chẳng hề e dè khi bàn tán về chủ nhân của mình. 'Còn [secret_owner.GetHerHim] thì sao?' ta hỏi, và đã moi được bí mật của [secret_owner.GetHerHis] để mang đến cho ngài.\""
  ep3_camp_temperament.0020.a: "\"Một bí mật hẳn sẽ là một câu chuyện tuyệt vời...\""
  ep3_camp_temperament.0020.b: "\"Ngươi đã làm rất tốt.\""
  ep3_camp_temperament.0020.c: "\"Ngươi làm gì trong quán rượu vậy...?\""
  ep3_camp_temperament.0020.d: "\"Nói cho ta biết ngay!\""
  ep3_camp_temperament.0020.e: "Chuyện đó là giữa [secret_owner.GetTitledFirstNameNoTooltip] và [ROOT.Char.GetFaith.HighGodName]."
  ep3_camp_temperament_0020_d_tt: "Ngài biết được [secret_owner.GetShortUINamePossessive] [secret|E]"
  ep3_inspired_by_life: "Cảm Hứng Từ Cuộc Sống"
  ep3_inspired_by_life_desc: "Nhân vật này sử dụng những bí mật mà họ biết để viết nên những câu chuyện cuốn hút."
 
  ep3_camp_temperament.0030.t: "Nổi Loạn!"
  ep3_camp_temperament.0030.desc.intro: "\"À, [ROOT.Char.GetTitledFirstName], thật vinh hạnh khi được gặp ngài trong đêm nay,\" [cocky_follower.GetTitledFirstName] chào ta khi ta tiến lại gần đống lửa trại. [cocky_follower.GetSheHe|U] là người duy nhất còn đang uống rượu quanh đó. \"Ta xin ngài,\" [cocky_follower.GetSheHe] chỉ vào một chiếc rương đối diện [cocky_follower.GetHerHim], rồi đợi đến khi ta ngồi xuống mới nói tiếp:\n\n\"Trông không ổn chút nào, phải không? Cả trại dường như đang tức giận với ngài… và có lẽ điều đó cũng có lý do,\""
  ep3_camp_temperament.0030.desc.no_food: "khi lương thực đang cạn dần... ai mà biết được.\""
  ep3_camp_temperament.0030.desc.other: "ngài không nghĩ vậy sao?\""
  ep3_camp_temperament.0030.desc.outro: "\n\n\"Sẽ thật đáng tiếc nếu có ai đó... nắm bắt thời cơ.\""
  ep3_camp_temperament.0030.a: "\"Thực ra thì... ờ... là lỗi của [bus_follower.GetShortUINamePossessiveNoTooltip]!\""
  ep3_camp_temperament.0030.b: "\"Ta sẽ cho ngươi thấy!\""
  ep3_camp_temperament.0030.b.success: "Ngài thắng trong trận đấu"
  ep3_camp_temperament.0030.b.failure: "Ngài thua trong trận đấu"
  ep3_camp_temperament.0030.c: "\"Ngươi vừa nói cái gì cơ?\""
  ep3_camp_temperament.0030.d: "\"Tất cả các ngươi đều được tự do rời đi.\""
  ep3_camp_temperament.0030.e: "\"Phân phát số vàng này cho người của ngươi.\""
  ep3_poopy_pants: "Âm Mưu Nổi Loạn Thất Bại"
  ep3_poopy_pants_desc: "Nhân vật này bị bẽ mặt công khai khi cố gắng phát động một cuộc nổi loạn chống lại thủ lĩnh của mình."
  benevolent_to_mutiniers_opinion: "Nhân Từ Với Kẻ Nổi Loạn"
 
  ep3_camp_temperament.0040.t: "Người Theo Hầu Tận Tâm"
  ep3_camp_temperament.0040.desc: "\"Xin một chút, thưa [ROOT.Char.GetTitleAsNameNoTooltip],\" [follower.GetTitledFirstName] chặn ta lại khi ta đang quan sát trại. [follower.GetSheHe|U] vẫn còn thở gấp khi lên tiếng, [follower.Custom('quirk_pos_pp')]:\n\n\"Đừng nghĩ rằng những nỗ lực của ngài không được ghi nhận. Các [dummy_gender.GetWomenMen] ngưỡng mộ ngài, trẻ con giả vờ làm ngài khi chơi đùa, và cả trại đều cho rằng ngài là [ROOT.Char.GetWomanMan] vĩ đại nhất còn sống!\"\n\n\"Ta muốn giúp ngài theo cách mà ngài đã giúp chúng ta. Ta biết về những... nỗ lực hiện tại của ngài, và ta tin rằng mình sẽ là một sự bổ sung xứng đáng.\""
  ep3_camp_temperament.0040.a: "\"Ngươi nói đúng! Ta thật vĩ đại!\""
  ep3_camp_temperament.0040.b: "\"Ta sẽ #EMP tự mình#! hoàn thành việc này.\""
  ep3_camp_temperament.0040.c: "\"Thật là một màn thể hiện lòng trung thành tuyệt vời!\""
  ep3_camp_temperament.0040.d: "\"Cứ tự nhiên.\""
  ep3_camp_temperament.0040.d.tt: "[follower.GetShortUIName|U] lấp đầy một ô [agent|E] $game_concept_success_chance_max_i$ [GetAgentSlotType( 'agent_devotee' ).GetName] mới trong [my_scheme.GetName] [scheme|E] chống lại [my_scheme.GetTargetCharacter.GetTitledFirstName]"
  ep3_camp_temperament.0040.e: "\"Hãy đảm bảo #EMP mọi người#! đều biết ta vĩ đại đến mức nào.\""
  devotee_agent_desc: "[recipient.GetShortUIName] là $agent_devotee$ của Ngài"
  ep3_arrogant_schemer_modifier: "Kẻ Âm Mưu Danh Giá"
  ep3_arrogant_schemer_modifier_desc: "Danh tiếng tốt của nhân vật này hỗ trợ cho các âm mưu cá nhân."
  ep3_self_employed_scheme_modifier: "Tự Thân Vận Động"
