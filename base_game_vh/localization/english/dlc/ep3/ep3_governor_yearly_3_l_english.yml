l_english:

  ep3_governor_yearly.3001.t: "Nhà xây dựng, Kẻ mua đất, Đại địa chủ"
  ep3_governor_yearly.3001.desc_christian: "Với những ai xứng đáng được ban thưởng, Chúa sẽ ban cho sự thịnh vượng. Đất đai của kẻ lười nhác thì cỏ dại mọc um tùm, còn điền trang của ta tại [root_domicile_province.GetTitle.GetNameNoTier] — vùng đất mang lương thực vào kho của ta, nơi tô thuế được nộp dưới danh nghĩa ta — giờ đã trải dài đến tận chân trời."
  ep3_governor_yearly.3001.desc_other: "Đất đai sao mà phồn thịnh! Kho lương sao mà đầy ắp! Quanh điền trang của ta tại [root_domicile_province.GetTitle.GetNameNoTier], ta đã mạnh tay đầu tư vào nông sản địa phương và giờ đây, thật may mắn, nhiều gia đình cần cù đang nộp tô cho ta."
  ep3_governor_yearly.3001.desc_mid: "\n\nTrong khi đó, vị [governor.GetTitleAsName] địa phương lại cai trị giữa gai góc và hỗn loạn. [target_theme.GetNameNoTierPossessive]"
  ep3_governor_yearly.3001.desc_greek: "[Glossary( 'choritai', 'CHORITAI_GLOSS' )]"
  ep3_governor_yearly.3001.desc_non_greek: "những tiểu điền chủ"
  ep3_governor_yearly.3001.desc: "hầu như chẳng biết liệu luật lệ của [governor.GetHerHis] có bảo vệ họ khỏi việc bị mua trọn hay không! Người nộp thuế của [governor.GetTitledFirstNamePossessiveNoTooltip] có thể #EMP dễ dàng đến thế#! trở thành người thuê đất của ta...\n\n"
  ep3_governor_yearly.3001.desc_garden: "Những khu vườn mới bị khép kín của ta — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_garden_leisure: "Những khu vườn mới được mở rộng của ta, trù phú với [root_domicile_province.Custom('get_region_flower_type_plural')] xinh đẹp — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_garden_fruit: "Những khu vườn mới được mở rộng của ta, ngát hương trái chín — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_grazing_land: "Những quyền chăn thả mới mà ta thương lượng đầy khôn khéo — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_horse_pasture: "Những quyền mới ký cho các đồng cỏ nuôi ngựa trù phú — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_camel_pasture: "Những đàn lạc đà thô kệch, ồn ào, bốc mùi nhưng #EMP sinh lợi#! của ta — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_grain_field: "Những cánh đồng ngũ cốc mới cày xới của ta — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_vineyard: "Những hàng giàn lá xanh bất tận của các vườn nho mới — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_olive: "Những vườn ô-liu mới mua của ta, với những thân cây quý giá đã sần sùi theo năm tháng — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_silk: "Những rặng dâu mới sản xuất tơ lụa của ta — liệu đó chỉ mới là khởi đầu?"
  ep3_governor_yearly.3001.desc_tea: "Những hàng bụi trà xanh mướt đang vươn mình của ta — liệu đó chỉ mới là khởi đầu?"

  CHORITAI_GLOSS: "#bold Choritai#! là thuật ngữ Hy Lạp cổ dùng để chỉ những người thuộc về một cộng đồng làng xã, một #EMP chorion#!."

  ep3_governor_yearly.3001.a_success: ""Ta ư? Đại địa chủ hùng mạnh nhất quanh đây sao?""
  ep3_governor_yearly.3001.a_failure: "Ngài nhanh chóng bị cuốn vào bê bối"
  ep3_governor_yearly.3001.a_govs_low: "Lựa chọn này khả dụng do [governor.GetShortUINamePossessive] có [governor_efficiency|E] cực kỳ thấp"
  ep3_governor_yearly.3001.c_gov_gain: "[governor.GetShortUINamePossessive] [governor_efficiency|E] tăng #P 5#!"

  ep3_governor_yearly.3001.a: "Ta hoàn toàn có thể mua trọn nửa [target_theme.GetTierAsNameNoTooltip] mà chẳng ai hay biết!"
  ep3_governor_yearly.3001.a.flavor: "Bộ máy hành chính vô dụng này sẽ chẳng nhận ra tài sản mới của ta cho tới kỳ thu thuế!"
  ep3_governor_yearly.3001.b: "Thà để ta khá giả thêm chút còn hơn là cái tên ngốc nghếch [governor.GetTitleAsNameNoTooltip] kia."
  ep3_governor_yearly.3001.b.flavor: "Ta có tiền để tiêu — sao không gom thêm vài mảnh đất sinh lợi?"
  ep3_governor_yearly.3001.b_gov_response: "@warning_icon! #X [governor.GetShortUIName] có thể trừng phạt Ngài!#!"
  ep3_governor_yearly.3001.c: "Hay là... ta có thể đề nghị giúp đỡ [governor.GetTitleAsNameNoTooltip]."
  ep3_governor_yearly.3001.c.flavor: "Những lời cảnh báo của ta có thể giúp kìm hãm các địa chủ khác... và chứng minh giá trị của bản thân."

  ep3_governor_yearly.3001.c_gain_influence: "Ngài nhận được #P 75#! #high Ảnh hưởng#!"
  ep3_governor_yearly.3001.minor_influence_loss: "Ngài tiêu tốn #N 75#! #high Ảnh hưởng#!"
  ep3_governor_yearly.3001.b_miniscule_influence_loss: "Ngài tiêu tốn #N 35#! #high Ảnh hưởng#!"

  vast_tracts_of_land_modifier: "Nhiều Tiểu Điền"
  vast_tracts_of_land_modifier_desc: "Gia tộc này thu tiền thuê và giám sát hoạt động của rất nhiều xưởng thủ công và các tiểu điền."
  productive_lands_modifier: "Rất Nhiều Tiểu Điền"
  productive_lands_modifier_desc: "Ranh giới điền trang của gia tộc này đã phình to nhờ cưỡng ép và những thương vụ mua bán khôn khéo."

  ep3_governor_yearly.3002.t: "Từ Người Nộp Thuế Thành Tá Điền"
  ep3_governor_yearly.3002.desc: ""Nhìn kìa — nhìn trong sổ thuế ấy!" [tax_farmer.GetName] gắt lên.\n\n"Thêm một làng nữa mà ta đã thu thuế thay ngài kể từ khi mua hợp đồng này! Và giờ thì — họ lại nộp thuế cho [landlord.GetName], địa chủ mới của họ! Còn [landlord.GetSheHe] thì chỉ trả có một khoản bèo bọt."\n\n"Cái tên" 
  ep3_governor_yearly.3002_insult_greek: "[Glossary( 'metrokoites', 'METROKOITES_GLOSS' )]"
  METROKOITES_GLOSS: "#bold Metrokoites#! là một lời chửi Hy Lạp, ám chỉ kẻ \"ngủ với chính mẹ mình.\""
  ep3_governor_yearly.3002_insult_armenian: "[Glossary( 'eshi dzag', 'ESHI_DZAG_GLOSS' )]"
  ESHI_DZAG_GLOSS: "#bold Eshi dzag#! là một lời chửi Armenia, nghĩa là \"con trai của con lừa.\""
  ep3_governor_yearly.3002_insult_generic: "[landlord.Custom2('InsultNoun', SCOPE.sC('tax_farmer'))]"
  ep3_governor_yearly.3002.desc_mid: "đã lừa gạt đám dân quê này về sự bảo hộ của họ: [landlord.GetSheHe] đang thu mua"
  ep3_governor_yearly.3002_half_duchy: "rất, #EMP rất#! nhiều"
  ep3_governor_yearly.3002_some_of_duchy: "nhiều"
  ep3_governor_yearly.3002.desc_outro: "bãi chăn thả trong vùng. Hãy nghĩ xem, hỡi [ROOT.Char.GetTitleAsNameNoTooltip]... thuế thất thoát, quân dịch hao hụt...""
  ep3_governor_yearly.3002.a: "Một tên địa chủ bé mọn mà dám đùa giỡn với #EMP ta#! sao...?"
  ep3_governor_yearly.3002.a.flavor: ""Đất đai bị #EMP cướp#! từ những #EMP người vô tội#!? Tàn bạo, hăm dọa?" Ừ, ta nghĩ đó chính là những gì các nhân chứng đang khai..."
  ep3_governor_yearly.3002.b: ""Ép chúng đi lính! Ép chúng nộp thuế!""
  ep3_governor_yearly.3002.b.flavor: "Đám dân đen ngu muội sẽ phục vụ dưới mũi gươm! Giờ chúng phải trả tiền cho gấp đôi chủ nhân."
  ep3_governor_yearly.3002.c: "Bổn phận của ta là phải tố cáo chuyện này!"
  ep3_governor_yearly.3002.c.flavor: "Làm ầm lên vụ tham lam này sẽ chứng tỏ ta là một thống đốc năng động, có năng lực ở [target_theme.GetNameNoTierNoTooltip]! Đại khái là vậy..."
  ep3_governor_yearly.3002.d: ""Hãy gửi tới gia tộc [landlord.GetDynastyHouseNameNoTooltip]... lời chúc mừng của ta.""
  ep3_governor_yearly.3002.d.flavor: "Ít nhất thì cũng sẽ có ai đó vui vẻ trong [target_theme.GetTierAsNameNoTooltip] này..."

  ep3_governor_yearly.3002.a_medium_influence_loss: " Ngài tiêu tốn #N 150#! #high Ảnh hưởng#!"
  ep3_governor_yearly.3002.b_miniscule_influence_gain: " Ngài nhận được #P 35#! #high Ảnh hưởng#!"
  ep3_governor_yearly.3002.b_minor_influence_loss_landlord: "[landlord.GetShortUIName] tiêu tốn #N 75#! #high Ảnh hưởng#!"

  ep3_governor_yearly.3000_major_governance_loss: "[governor_efficiency|E] của Ngài giảm #N 15#! trong #high 10 năm#!"
  ep3_governor_yearly.3000_governance_loss: "[governor_efficiency|E] của Ngài giảm #N 10#! trong #high 10 năm#!"
  ep3_governor_yearly.3000_miniscule_governance_loss: "[governor_efficiency|E] của Ngài giảm #N 5#! trong #high 10 năm#!"

  some_smallholds_modifier: "Một Vài Tiểu Điền"
  some_smallholds_modifier_desc: "Bất chấp sự can thiệp thô bạo, các địa chủ này vẫn thu tiền thuê từ một số tá điền ngoài vòng pháp luật."

  taxed_and_pressganged_tenants_modifier: "Tá Điền Bị Đánh Thuế Và Bắt Đi Lính"
  taxed_and_pressganged_tenants_modifier_desc: "Những tiểu điền chủ đã bán đất bị bóc lột gấp đôi và, dù là trái luật, bị cưỡng ép phục vụ trong quân đội."

  ep3_governor_yearly.3003.t: "[landlord.GetNameNoTooltip],"
  ep3_governor_yearly.3003.desc_accused_of_crime: "Ta kinh hoàng khi nghe ngươi khủng bố những tiểu điền vô tội! #EMP Rất nhiều#! nhân chứng của ta nói rằng ngươi — ngoài vô số hành vi sai trái khác — đã sai trẻ con nhổ nước bọt vào các góa phụ? Trộm chó? Đổ nước xuống ống khói? Chỉ để mua được vài bãi chăn thả cằn cỗi!\n\nViệc ngươi coi thường pháp luật, thật đáng tiếc, đã bị ghi nhận và công khai... Ta e rằng ngươi sẽ còn nghe nhiều hơn nữa về chuyện này."
  ep3_governor_yearly.3003.desc_force_used: "Hãy nói chuyện với những tá điền mới của ngươi. Bảo họ rằng thuế đất vẫn phải nộp, nghĩa vụ chiến tranh vẫn phải thực hiện. Khi binh sĩ của ta đến, đừng đứng chắn đường họ.\n\nLuật pháp quy định ngươi nay sở hữu đất đai. Nhưng con người, thì là #EMP của ta#!."
  ep3_governor_yearly.3003.desc_scandal: "Ngươi có thể nghĩ rằng ta bất tài, rằng ta chẳng mấy quan tâm tới phúc lợi của [target_theme.GetNameNoTier], nhưng chính là #EMP ngươi#! đã chà đạp truyền thống để chiếm đoạt quá nhiều thứ cho riêng mình — thật đáng hổ thẹn!\n\nNgươi sẽ thấy lòng tham của mình đã trở thành đề tài ưa thích trong các cuộc bàn tán tại [governor.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]. Đáng buồn thay, điều đó hoàn toàn xứng đáng."
  ep3_governor_yearly.3003.desc_backs_down: "Ta chúc mừng ngươi về những tài sản mới! Những ngôi làng xinh đẹp với dân cư biết điều — đó quả là vùng đất tốt lành mà ngươi đang sở hữu!\n\nPhải, sẽ có kẻ than phiền về những luật lệ cũ từng nhằm hạn chế ngươi: họ vò đầu bứt tai lo lắng cho tương lai của [root_domicile_province.GetTitle.GetNameNoTier]... nhưng bàn tay của ngươi, khôn ngoan và vững vàng, chính là kẻ thích hợp nhất để nắm giữ quyền trượng!"

  ep3_governor_yearly.3003.a_accused_of_crime: "Cáo buộc bịa đặt! Thế mà — #EMP chúng đã nhắm tới đất đai của ta rồi sao?!?#!"
  ep3_governor_yearly.3003.a_force_used: "Chuyện này sẽ khiến tá điền của ta phẫn nộ! Nó sẽ làm họ khốn cùng!"
  ep3_governor_yearly.3003.a_scandal: "[governor.GetSheHe|U] có thể làm tổn hại danh tiếng của ta... nhưng không phải điền sản!"
  ep3_governor_yearly.3003.a_backs_down: "Vị [governor.GetTitleAsNameNoTooltip] đã chùn bước! Mọi thứ giờ đều an toàn thuộc về ta."

  ep3_governor_yearly.3010.t: "Dẫu Vậy, [emperor.GetTitleAsNameNoTooltip] Vẫn Chiến Đấu"
  ep3_governor_yearly.3010.desc: "Đã nhiều năm nay, lực lượng của [emperor.GetTitledFirstName] đã"
  ep3_governor_yearly.3010.desc_attacker: "tiến hành một cuộc [war.Custom('WarCasusBelliShort')] chống lại [foe.GetName].\n\nKhắp các tỉnh, chúng ta nghe kể về những cuộc vây hãm ngắn ngủi, những trận chiến mơ hồ kết thúc trong hỗn loạn và máu đổ... chúng ta bàn tán về những giấc mộng chinh phục xứ người, những giấc mộng mà [emperor.GetTitleAsNameNoTooltip] đang theo đuổi."
  ep3_governor_yearly.3010.desc_defender: "phòng thủ trước [war.Custom('WarCasusBelliShort')] của [foe.GetNamePossessive].\n\nKhắp các tỉnh, chúng ta nghe kể về những cuộc vây hãm ngắn ngủi, những trận chiến mơ hồ kết thúc trong hỗn loạn và máu đổ... chúng ta thì thầm về đợt công kích của kẻ thù, và lo sợ cho những kẻ bị khuất phục cùng người đã chết."
  ep3_governor_yearly.3010.desc_mid: "Đức tin của dân chúng đang dao động."
  ep3_governor_yearly.3010.desc_winning: "\n\nPhải, theo mọi báo cáo thì cuộc chiến đang tiến triển tốt... nhưng nhân danh [ROOT.Char.GetFaith.HighGodName], bước tiến của [emperor.GetTitleAsNamePossessiveNoTooltip] thật là chậm chạp!"
  ep3_governor_yearly.3010.desc_losing: "\n\n[ROOT.Char.GetFaith.HighGodName] đã không ưu ái [emperor.GetTitleAsNameNoTooltip]. Theo mọi báo cáo, quân đội của [emperor.GetHerHis] đang tiến gần tới thất bại."
  ep3_governor_yearly.3010.desc_middling: "\n\nÂn sủng của [ROOT.Char.GetFaith.HighGodNamePossessive] vẫn khó nắm bắt: dường như chưa thấy hồi kết cho cuộc chiến."
  ep3_governor_yearly.3010.a: "Ta sẽ ra tiền tuyến, với tư cách một binh sĩ trung thành!"
  ep3_governor_yearly.3010.a.flavor: "Và chẳng phải một binh sĩ trung thành, hào phóng, thì nên mong được sưởi ấm trong sự coi trọng của vị chỉ huy [ROOT.Char.GetHerHis] hay sao...?"
  ep3_governor_yearly.3010.a.success: "[emperor.GetTitleAsNameNoTooltip] chấp nhận sự trợ giúp của Ngài"
  ep3_governor_yearly.3010.a.fail: "[emperor.GetTitleAsNameNoTooltip] không mấy hứng thú"
  ep3_governor_yearly.3010.b: "Một người cai trị #EMP mạnh mẽ#! đã có thể chấm dứt chuyện này."
  ep3_governor_yearly.3010.b.flavor: "Chẳng phải cõi đời nên tìm kiếm một bậc chủ nhân không chao đảo và thất bại hay sao?"
  ep3_governor_yearly.3010.c: "Các tỉnh xa xôi đến mức chẳng nằm trong suy nghĩ của [emperor.GetTitleAsNamePossessiveNoTooltip]..."
  ep3_governor_yearly.3010.c.flavor: "...và vì thế càng dễ bị ta thao túng."
  ep3_governor_yearly.3010.d: "Một khoản hiến dâng mộ đạo, một lời cầu nguyện nhân danh [emperor.GetHerHis]."
  ep3_exploited_weak_master_modifier: "Lợi Dụng Quân Chủ Đang Lâm Chiến"
  ep3_exploited_weak_master_modifier_desc: "Khi quân chủ của mình đang bị cuốn vào chiến tranh, vị thống đốc này đã biển thủ ngân quỹ và tái sắp xếp chính quyền địa phương nhằm phục vụ lợi ích cá nhân."

  msg_claimed_weak_emperors_title.t: "[ROOT.Char.GetTitleAsNameNoTooltip] Thách Thức Quyền Lực"
  msg_claimed_weak_emperors_title.flavor: "Lên án cuộc chiến kéo dài của ngươi, đám dân chúng tung hô một nhân vật quyết đoán hơn."

  msg_claimed_weak_emperors_title.t.2: "Thành Viên Phe Phái Lên Án Chiến Tranh"
  msg_claimed_weak_emperors_title.flavor.2: "Cuộc chiến lê thê của ngươi chống lại [foe.GetName] đã tiếp sức cho những kẻ chỉ trích."
  decried_weakness_score_desc: "Lên Án Sự Yếu Kém Của Đế Quyền"
  governor_challenges_weakness_candidate_score: "[ROOT.Char.GetShortUINamePossessive] [candidate_score|E] cho [emperor.GetPrimaryTitle.GetName] tăng #P 20#!"

  ep3_governor_yearly.3011.opening: "Thưa quân thượng của thần, đức [emperor.GetTitleAsName],"
  ep3_governor_yearly.3011.desc: "Đã lâu quân đội của chúng ta giao tranh với [foe.GetName], vậy mà vẫn chưa có khải hoàn nào để công bố.\n\nNếu thần dốc lực lượng gia binh và tài sản riêng để trợ giúp sự nghiệp của bệ hạ — liệu sự trung thành ấy có được trân trọng xứng đáng chăng?"
  ep3_governor_yearly.3011.a: "Miễn sao kẻ thù của ta cuối cùng cũng bị đánh bại!"
  ep3_governor_yearly.3011.b: "[governor.GetTitledFirstNameNoTooltip] chẳng phải là một đồng minh đáng giá..."

  ep3_governor_yearly.3012.opening: "Hỡi vị đại thần quả cảm của [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
  ep3_governor_yearly.3012.desc_fail: "Gạt sang một bên những điều khoản ngớ ngẩn trong đề nghị của ngươi — binh lực của ngươi hiện không đến mức cấp thiết.\n\nNgươi vẫn có thể mơ tưởng việc sát cánh cùng [emperor.GetTitleAsName] giữa khói lửa chiến tranh, nhưng nếu chỉ có tham vọng dẫn đường, tốt hơn hết hãy tận hưởng khúc nhạc êm đềm của cuộc sống yên bình."
  ep3_governor_yearly.3012.desc_success: "Ta chấp nhận đề nghị của ngươi. Chúng ta đang chờ luồng sinh lực mới từ binh sĩ của ngươi nơi chiến tuyến đã mệt mỏi.\n\nVì lòng dũng cảm, vì sự hào hiệp, vì lòng trung kiên của ngươi, hiếm có phần thưởng trần thế nào sánh kịp."
  ep3_governor_yearly.3012.kyrie_eleison: "[Glossary( 'Kýrie, eléison!', 'KYRIE_ELEISON_GLOSS' )]"
  ep3_emperor_yearly.3011.a_to_war: "Một sĩ quan ưu tú của [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip] gia nhập chiến cuộc!"
  ep3_emperor_yearly.3011.a_no_war: "Ta chỉ #EMP mong#! được phụng sự [emperor.GetTitleAsNameNoTooltip]..."

  ep3_governor_yearly.3020.t: "[ROOT.Char.GetFaith.HighGodName] Đã Chỉ Định... [emperor.GetHerHim|U] Sao?"
  ep3_governor_yearly.3020.desc: "Vị [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsName] cai trị chúng ta thường là chủ đề của những cuộc thì thầm kín đáo."
  ep3_governor_yearly.3020.desc_physical: "\n\nLiệu cõi đời này có thể vẹn toàn khi hiện thân xác thịt của nó là một kẻ dị dạng như [emperor.GetHerselfHimself]? Dung mạo tàn tạ của [emperor.GetTitledFirstNamePossessiveNoTooltip] sẽ được dập lên những đồng tiền mới chăng? Và — thật đáng sợ khi nghĩ tới — liệu từ nay những quân chủ được [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] chọn lựa sẽ đều là những kẻ tàn phế khốn cùng?\n\nKhông, vị [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsName] này khó lòng xứng đáng với áo tía..."
  ep3_governor_yearly.3020.desc_crime: "\n\nChúng ta có thực sự là cõi đời được ban phúc nhất, khi bị cai trị bởi một tên tội phạm nhơ nhớp — kẻ tội đồ thách thức giáo lý của [ROOT.Char.GetFaith.HighGodNameAlternate]? Còn bao nhiêu luật lệ nữa sẽ bị những bàn tay nhuốm bẩn này chấp bút?\n\nVị quân chủ [target_trait.GetNameNoTooltip( GetNullCharacter )|l] của chúng ta, ngồi trên ngai cao — #EMP thật là một sự sỉ nhục tột cùng!#! Một [emperor.GetWomanMan] tầm thường hơn đã bị xử tử từ lâu..."
  ep3_governor_yearly.3020.a: "Sự phản kháng sinh sôi tốt nhất trong bóng tối..."
  ep3_governor_yearly.3020.a.flavor: "Và mọi lời xì xào về sự bất xứng của đế quyền nên dẫn về phía ta."
  ep3_governor_yearly.3020.a.success: "Những kẻ buôn chuyện chú ý tới luận điệu độc địa của Ngài"
  ep3_governor_yearly.3020.a.fail: "Những mũi châm chọc của Ngài chẳng khiến ai quan tâm"
  ep3_governor_yearly.3020.b: "Ta phải viết một bức thư lên án!"
  ep3_governor_yearly.3020.flavor: "Vì dấu hiệu bị [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] ruồng bỏ này không chỉ là tai ương của [emperor.GetTitleAsNameNoTooltip], mà của cả cõi đời!"
  ep3_governor_yearly.3020.c: "Lao động cần mẫn sẽ khiến đầu óc ta thanh thản."

  governor_insulted_imperial_trait_candidate_score: "[ROOT.Char.GetShortUINamePossessive] [candidate_score|E] cho [emperor.GetPrimaryTitle.GetName] tăng [EmptyScope.ScriptValue('appointment_score_minor_value')|P0]"
  insulted_trait_score_desc: "Lên Án [trait|E] Bất Xứng Của [liege|E]"

  msg_unflattering_imperial_trait_gossip.t: "Tin Đồn Tai Tiếng"
  msg_unflattering_imperial_trait_gossip.flavor: "Những lời đồn nguy hiểm lan rộng: các đại thần của ngươi bất mãn với vị [target_trait.GetName( GetNullCharacter )] [emperor.GetTitleAsNameNoTooltip]."

  ep3_governor_yearly.3021.opening: "Tâu [emperor.GetTitleAsNameNoTooltip] của thần,"
  ep3_governor_yearly.3021.desc_physical: "Bệ hạ hẳn rõ rằng chúng thần, những người [minister.GetCulture.GetCollectiveNoun], luôn run sợ khi một thân xác khiếm khuyết ngồi trên ngai vàng của quân chủ hoàn mỹ do [minister.GetFaith.HighGodNamePossessive] an bài.\n\nThần khẩn cầu bệ hạ, vị [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsNameNoTooltip] của chúng thần, hãy cầu xin sự che chở của [minister.GetFaith.HighGodNameAlternate]! Chỉ nhờ lòng thương xót thiêng liêng, chúng ta mới có thể vượt qua những thời khắc trái lẽ tự nhiên này."
  ep3_governor_yearly.3021.desc_crime: "Vì bản tính tội lỗi của ngài, ta sợ rằng sự thống trị của ngài đang gặp nguy hiểm. [target_trait.GetNameNoTooltip( GetNullCharacter )] [emperor.GetTitleAsNameNoTooltip] — ta khẩn cầu ngài, trước toàn vương quốc, hãy tìm kiếm sự xá tội từ [minister.GetFaith.HighGodNameAlternate].\n\nMột linh hồn có thể chịu đựng sự thối rữa của tội lỗi bao lâu? Và các bậc quân vương chúng ta có thể chịu đựng sự tàn phá từ hành vi sai trái của ngài bao lâu?"
  ep3_governor_yearly.3021.a: "Dẫu không hoàn hảo, ta thề sẽ nỗ lực vì con dân của mình."
  ep3_governor_yearly.3021.b: "Vô lễ!"
  ep3_governor_yearly.3021.bad_trait: "@warning_icon! #X Điều này xảy ra vì [trait|E] [target_trait.GetName( GetNullCharacter )] của Ngài#!"
  ep3_governor_yearly.3021.a.flavor: "Ít nhất trong một thời gian, những kẻ mộ đạo có thể tha thứ cho ta, và để chuyện này trôi vào quên lãng..."
  emperor_repented_for_flaws_modifier: "Sám Hối Vì Khiếm Khuyết Đế Quyền"
  emperor_repented_for_flaws_modifier_desc: "Dù không hoàn toàn xứng đáng với cương vị tối cao, nhân vật này đã công khai nỗ lực chuộc lại những sai lầm của bản thân."
  ep3_governor_yearly.3021.blocker: "Ngài sẽ không nhận sự kiện này trong ít nhất #high 10 năm#!"

  ep3_governor_yearly.3030.t: "Những Tháng Ngày Lặng Sóng"
  ep3_governor_yearly.3030.desc_christian: ""Phúc thay cho những ai kiến tạo hòa bình!" Thánh Matthew đã viết như vậy, và qua đó ông quả thực đã truyền đạt chân lý của Chúa.\n\nSuốt nhiều năm qua, [emperor.GetPrimaryTitle.GetDefinitiveName] và [ROOT.Char.GetPrimaryTitle.GetNameNoTier] của ta đã được hưởng nền hòa bình của Đấng Christ."
  ep3_governor_yearly.3030.desc_generic: "Suốt nhiều năm qua, [emperor.GetPrimaryTitle.GetDefinitiveName] và [ROOT.Char.GetPrimaryTitle.GetNameNoTier] của ta đã sống trong hòa bình.\n\n"
  ep3_governor_yearly.3030.desc: "Gia súc béo tốt trên đồng ruộng. Thanh niên, không còn bị nghĩa vụ binh đao quấy nhiễu, nằm phơi nắng trên thảm cỏ. Trong những thị trấn yên vui của ta, thương nhân buôn bán tự do và các quan chức chuyên tâm vào việc cải thiện lợi ích công cộng.\n\nChẳng lẽ triều đại của ta và của [emperor.GetTitledFirstNamePossessive] sẽ chẳng bao giờ ghi dấu những chiến công vĩ đại, lẫy lừng sao? Chỉ đơn thuần là… sự mãn nguyện này thôi ư?"
  ep3_governor_yearly.3030.a: "Cuộc sống thái bình đã khiến chúng ta trở nên #EMP mềm yếu!#!"
  ep3_governor_yearly.3030.a.flavor: "Bước ra ngoài biên giới, thép trong tay — điều đó sẽ đánh thức binh sĩ của ta!"
  ep3_governor_yearly.3030.b: "Ta không mưu tính chiến tranh, mà là sự thịnh vượng."
  custom.every_sub_realm_county: "Mỗi [county|E] trong [realm|E] của Ngài"
  ep3_peaceful_administrator_modifier: "Quan Chấp Chính Hòa Bình"
  ep3_peaceful_administrator_modifier_desc: "Nhân vật này liên tục ban hành luật pháp nhằm cổ vũ sự thịnh vượng mang tính hòa bình."
  ep3_governor_yearly.3030.c: "Cuộc sống an nhàn này nên được tận hưởng cùng huyết tộc."
  custom.every_house_member: "Mỗi thành viên trong [house|E]"

  MODIFIER_DEFINITION_VALUE_BASED_ON_ADMIN_RAID_COUNT: " \t#weak Tăng theo mỗi lần Viễn Chinh Cướp Phá#!"
  ep3_loyal_troops_raid_modifier: "Quân Đội Được Truyền Cảm Hứng"
  ep3_loyal_troops_raid_modifier_desc: "Những đợt huấn luyện khắc nghiệt và chiến đấu dữ dội đã tạo nên các binh sĩ cứng rắn, tuân lệnh và được đãi ngộ xứng đáng."
  ep3_loyal_troops_2_raid_modifier: "Sĩ Quan Trung Thành"
  ep3_loyal_troops_2_raid_modifier_desc: "$ep3_loyal_troops_raid_modifier_desc$"
