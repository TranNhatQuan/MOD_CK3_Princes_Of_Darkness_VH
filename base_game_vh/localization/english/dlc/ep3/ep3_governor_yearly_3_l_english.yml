  ep3_loyal_troops_4_raid_modifier_desc: "$ep3_loyal_troops_raid_modifier_desc$"
  ep3_loyal_troops_5_raid_modifier: "Quân Trung Thành Cuồng Tín"
  ep3_loyal_troops_5_raid_modifier_desc: "$ep3_loyal_troops_raid_modifier_desc$"

  access_to_admin_raid_tooltip: "Mở khóa [casus_belli|E] #high $ep3_pillaging_foray$#!, dùng để quấy phá các [realms|E] láng giềng "
  admin_raid_gives_modifier_tooltip: "#weak Cuộc [war|E] này ban và cải thiện [modifier|E] [GetModifier( 'ep3_loyal_troops_raid_modifier' ).GetNameWithTooltip]#!"
  can_construct_solar_tooltip: "Mở khóa công trình [estate|E] #high [GetDomicileBuilding('grand_solar_01').GetName]#!"
  solar_estate_effect_tooltip: "#weak Giảm mức tích lũy [stress|E], tăng [dynasty|E] [opinion|E] và [dynasty_prestige|E]#!"
  unlocked_via_event: "Mở khóa thông qua Sự kiện"

  ep3_governor_yearly.3040.t_greek: "[emperor.GetTitleAsNameNoTooltip] Autokrator!"
  ep3_governor_yearly.3040.t: "[emperor.GetTitleAsNameNoTooltip] Hoàn Mỹ Tuyệt Đối"
  ep3_governor_yearly.3040.desc: "Ta đã bắt đầu đấu tranh để nhớ lại — liệu [emperor.GetPrimaryTitle.GetName] có thực sự chỉ là bóng tối và hỗn loạn trước khi [emperor.GetTitledFirstName] cao quý cầm lấy vương trượng của [emperor.GetHerHis] không?\n\nGiới thượng lưu có mơ về điều gì khác ngoài việc chia sẻ công ty của [emperor.GetHouse.GetName] không? Những người lính của chúng ta có hô vang cái tên của một kẻ lạ mặt xấu xí, lắp bắp nào không? Những ông trùm của chúng ta — họ có hạ mình hôn đôi bàn chân không được tạo ra từ xương thịt hoàn hảo của [ROOT.Char.GetFaith.HighGodNamePossessive] [emperor.GetTitleAsNameNoTooltip] không?\n\nThật ra ta không cần phải nhớ. Đặt câu hỏi về tính chính danh không sai lầm của chủ quyền của ta như vậy sẽ là vô ích."
  ep3_governor_yearly.3040.a: "Ta phải gắn kết gia tộc mình với dòng dõi cao quý của [emperor.GetHerHis]!"
  ep3_governor_yearly.3040.a.flavor: "Lòng hiếu thuận gia tộc ấy chỉ có thể khiến cả hai chúng ta thêm cường thịnh."
  ep3_governor_yearly.3040.b: "[emperor.GetTitleAsNameNoTooltip] hùng mạnh có lẽ chẳng cần đến sự trợ giúp của ta..."
  ep3_governor_yearly.3040.b.flavor: "...nhưng những kẻ khát vọng quyền lực trong Nhà [emperor.GetHouse.GetNameNoTooltip] thì mong manh hơn nhiều."
  ep3_governor_yearly.3040.c: "#EMP Chính ta#! phải trở nên bất khả lay chuyển."
  ep3_governor_yearly.3040.c.flavor: "Đừng dựa vào sức mạnh của quân chủ, mà hãy dựa vào binh sĩ vững vàng và sinh lực địa phương!"
  ep3_governor_yearly.3040.d: "Tân binh ùn ùn kéo đến muốn chiến đấu nhân danh [emperor.GetHerHis]!"
  ep3_governor_yearly.3040.d.flavor: "Và ta sẽ vui vẻ chiêu mộ họ."
  custom.every_house_member_emperor: "Mỗi thành viên của [house|E] Nhà [emperor.GetHouse.GetName]"
  independent_administrator_modifier: "Quan Chấp Chính Độc Lập"
  independent_administrator_modifier_desc: "Mọi viên chức phục vụ nhân vật này đều được kỳ vọng chỉ tuân lệnh họ và quyết liệt chống lại mọi ảnh hưởng bên ngoài."
  sycophant_boosts_credibility_candidate_score: "[candidate.GetShortUINamePossessive] [candidate_score|E] cho [emperor.GetPrimaryTitle.GetName] tăng [EmptyScope.ScriptValue('appointment_score_minor_value')|P0]"
  boosted_by_sycophant_score_desc: "Được hậu thuẫn bởi những kẻ sùng bái [house|E]"
  ep3_governor_yearly_3040_marriage_tooltip: "[houses|E] [root_scope.GetHouse.GetName] và [emperor.GetHouse.GetName] tăng mức chấp nhận [marriage|E] trong #high 30 năm#!"

  msg_governor_compliments_legitimacy.t: "[root_scope.GetTitleAsNameNoTooltip] Ca Ngợi Tính Chính Danh"

  ep3_neglecting_house_head_duties_modifier: "Xao Nhãng Nghĩa Vụ Quan Chức"
  ep3_neglecting_house_head_duties_modifier_desc: "Không làm vừa lòng cả thân tộc lẫn quân chủ, nhân vật này tiêu phí những giờ phút đáng lẽ sinh lợi trong đám mưu sĩ và kẻ leo trèo xã hội."
  ep3_governor_yearly_3050_neglect_duties_tooltip: "Ngài mất #N -5%#! [governor_efficiency|E] trong #high 10 năm#!"
  ep3_governor_yearly_3050_factions_emp_tooltip: "Các [vassals|E] khác có nhiều khả năng gia nhập các [factions|E] có [root_scope.GetShortUIName]"
  msg_governor_challenging_illegitimacy.t: "[root_scope.GetTitleAsNameNoTooltip] Bất Trung Tập Hợp Lực Lượng"
  msg_governor_challenging_illegitimacy.desc: "[root_scope.GetName] cùng những người ủng hộ [root_scope.GetHerHis] lên án sự thiếu hụt [legitimacy|E] của Ngài."
  msg_governor_supports_rule.t: "[root_scope.GetTitleAsNameNoTooltip] Bảo Vệ Chính Danh"
  msg_governor_supports_rule.desc: "[root_scope.GetName|V] công khai bảo vệ Ngài trước những kẻ bàn tán về sự bất hợp pháp của triều đại."

  ep3_governor_yearly.3050.t: "Một Trong Những Ác Quỷ Hạ Đẳng Của [ROOT.Char.GetFaith.NegativeAfterLife|U]"
  ep3_governor_yearly.3050.desc: "Những tin tức kỳ lạ tràn ngập liên quan đến [emperor.FullNameNoTooltip], [emperor.GetTitleAsNameNoTooltip] của chúng ta, người đang đứng trên bờ vực của ngai vàng của [emperor.GetHerHis]."

  ep3_governor_yearly.3050.mess: "\n\nMột người bán thuốc chữa bệnh đến nói về... những di chúc phi lý được cung cấp bởi cung điện. Mắt tôm, móng tay trẻ em, thuốc chiết xuất từ cây mandrake và nhựa đường — tất cả để [emperor.GetTitleAsNameNoTooltip] ép vào cái miệng lắp bắp của hắn! Con quái vật lảo đảo quanh cung điện, khỏa thân, được sơn bằng những loại thuốc kỳ lạ của [emperor.GetHerHis] và nguyền rủa cái tên [emperor.GetFaith.HighGodName]!"
  ep3_governor_yearly.3050.shiftless: "\n\nNhững người hầu đã trốn chạy công việc của [emperor.GetHerHis] mô tả một sự trải rộng kiểu Tartar, nồng nặc mùi nước hoa cũ... [emperor.GetTitleAsNameNoTooltip] nằm nhiều giờ trong bóng tối, cầu khẩn dưới một #EMP sinh vật#! lẩm bẩm, chân tay khẳng khiu. Khi các bộ trưởng của [emperor.GetHerHis] gọi, [emperor.GetFirstNameNoTooltip] hầu như không cử động... nhưng khi con quỷ cử động đôi môi nặng nề của nó, [emperor.GetTitleAsNameNoTooltip] hét lên đòi được tha thứ, đòi rượu và bánh ngọt."
  ep3_governor_yearly.3050.coward: "\n\nChính thân tộc của [emperor.GetHerHis|U] thì thầm truyền tai câu chuyện này. Tại quê nhà họ, một nữ thánh bị làm nhục, và khi đến kỳ sinh nở, thứ chui ra không phải một đứa trẻ, mà là… #EMP một đống giun dòi.#! Một con giun hôi thối bị chuột ăn, con chuột bị mòng biển nuốt, và con mòng biển ấy lại bị chính [emperor.GetFirstNameNoTooltip] ăn thịt. Giờ đây, [emperor.GetTitleAsNameNoTooltip] run rẩy và khóc lóc — ngay cả trước tiếng kêu của một con chuột sóc!"
  ep3_governor_yearly.3050.cruel: "\n\nMột quý bà trong hộ gia đình của [emperor.GetHerHis] thề rằng cô ấy đã thấy [emperor.GetHerHim] trong khu vườn vào ban đêm... #EMP uống máu của một con mèo hoang!#! Bên dưới lớp lông rách nát đội vương miện, bộ mặt tàn ác của [emperor.GetFirstNamePossessiveNoTooltip] gầm gừ và phun máu. [emperor.GetSheHe|U] sau đó đã trốn thoát — được hai bóng ma cánh dơi mang qua bức tường vườn!"
  ep3_governor_yearly.3050.generic_bad: "\n\nNhững kẻ chải ngựa và a hoàn thì thầm rằng [emperor.GetFirstNameNoTooltip] thực chất đã được #EMP sinh ra từ hậu môn của [ROOT.Char.GetFaith.DevilName]#!. [emperor.GetTitleAsNameNoTooltip] là sinh vật bản địa của [ROOT.Char.GetFaith.NegativeAfterLife]! Từ những hố nguyền rủa, kẻ lừa dối hôi thối bò lên, lẻn vào tẩm điện hoàng gia, rồi khoác lên mình làn da của vị [emperor.GetTitleAsNamePossessiveNoTooltip] chính thống của chúng ta!"

  ep3_governor_yearly.3050.outro: "\n\nNhững tin dữ ghê tởm như vậy vẫn không ngừng rỉ ra từ triều đình của [emperor.GetFirstNamePossessiveNoTooltip]."
  ep3_governor_yearly.3050.a: "#EMP ÁC QUỶ!#!"
  ep3_governor_yearly.3050.b: "Vì sao lại phải phục tùng tên khốn này… mà không phải là ta?"
  ep3_governor_yearly.3050.c: "#EMP Im lặng!#! Không ai được phép phỉ báng [emperor.GetTitleAsNameNoTooltip] của ta!"
  ep3_governor_yearly.3050.c.flavor: "Hãy để mọi người biết: ta coi những kẻ gieo rắc những lời dối trá quái đản này là hoàn toàn đáng khinh!"
  ep3_governor_yearly.3050.d: "Tai họa của bổn phận chính là cơ hội của kẻ làm chính trị."

  ep3_governor_yearly.3060.t: "Lời Tung Hô Rực Rỡ"
  ep3_governor_yearly.3060.t_regent: "Lời Xác Nhận Rực Rỡ"
  ep3_governor_yearly.3060.intro_regent: "Chính trị triều đình vận hành chậm chạp — phần lớn là vậy. [previous_holder.GetTitledFirstNameRegnal] không còn điều hành [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l] nữa."
  ep3_governor_yearly.3060.intro_usurper: "Vương miện đã bị giật khỏi trán quân chủ của chúng ta — [previous_holder.GetTitledFirstNameRegnal] không còn cai trị [emperor.GetPrimaryTitle.GetTierAsName] nữa."
  ep3_governor_yearly.3060.intro_deceased: "Người giám hộ của [emperor.GetPrimaryTitle.GetTierAsName], vị mục tử và quân vương của chúng ta, đã rời khỏi cõi phàm trần. [previous_holder.GetTitledFirstNameRegnal] đã chết."
  ep3_governor_yearly.3060.desc_regent: "\n\nSâu trong những hội trường của cung điện hoàng gia [emperor.GetCapitalLocation.GetTitle.GetNameNoTier], quyền lực của một [emperor.GetTitleAsNamePossessiveNoTooltip] mới được khẳng định trước các quan chức tập hợp."
  ep3_governor_yearly.3060.desc_afield: "\n\nĐóng quân tại [emp_location.GetName], giữa những lá cờ rực rỡ, một [emperor.GetTitleAsNameNoTooltip] mới được nâng cao trên một chiếc khiên lớn được đánh bóng."
  ep3_governor_yearly.3060.desc_temple: "\n\nTrong [emperor.GetCapitalLocation.GetTitle.GetNameNoTierPossessive] [emperor.GetFaith.HouseOfWorship] tối cao, giữa các chức sắc và giáo sĩ, một [emperor.GetTitleAsNameNoTooltip] mới lần đầu tiên được tán dương."
  ep3_governor_yearly.3060.desc_byzantine: "\n\n#EMP \"Vạn tuế [emperor.GetFirstNameRegnal]!\"#! những người tụ họp đồng thanh hô. #EMP \"Nhờ ân sủng của Đấng Christ, [emperor.GetTitleAsNameNoTooltip] trung tín và #EMP [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')]#! của người La Mã; nhà [emperor.GetHouse.GetName], mãi mãi [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')]!\"#!"
  ep3_governor_yearly.3060.desc_byzantine_femme: "\n\n#EMP \"Vạn tuế [emperor.GetFirstNameRegnal]!\"#! những người tụ họp đồng thanh hô. #EMP \"Nhờ ân sủng của Đấng Christ, [emperor.GetTitleAsNameNoTooltip] trung tín và #EMP [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')]#! của người La Mã; nhà [emperor.GetHouse.GetName], mãi mãi [Glossary( 'Augousta', 'AUGOUSTUS_GLOSS')]!\"#!"
  AUGOUSTOS_GLOSS: "Một tước hiệu danh dự mang nghĩa \"đáng kính\" hoặc \"uy nghi\", được ban cho những người kế vị vị hoàng đế đầu tiên của La Mã. Đến thế kỷ VII, tước hiệu Hy Lạp Basileus đã thay thế nó về tầm quan trọng hoàng đế."
  AUTOKRATOR_GLOSS: "Một tước hiệu Hy Lạp cổ điển chỉ người nắm quyền chỉ huy không có cấp trên, được phục hưng trong thời Byzantine Trung đại để dùng cho các hoàng đế cao cấp."
  ep3_governor_yearly.3060.desc_regent_acclaim: "\n\nNhững con dấu sặc sỡ và chữ ký tỉ mỉ nhanh chóng phủ kín các văn kiện chính thức. #EMP \"Theo ý chỉ của [emperor.GetFaith.HighGodName], của [ceremonial_liege.GetTitledFirstName], [emperor.GetMotherFather] của [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip]; nhà [ceremonial_liege.GetHouse.GetName], kẻ được ca tụng là tối-[ceremonial_liege.Custom('FormalComplimentAdjective')]!\"#!"
  ep3_governor_yearly.3060.desc_generic: "\n\n#EMP \"Vạn tuế [emperor.GetFirstName]!\"#! những người tụ họp đồng thanh hô. #EMP \"Theo ý chỉ của [emperor.GetFaith.HighGodName], [emperor.GetTitleAsNameNoTooltip] hùng mạnh và [emperor.GetMotherFather] của [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip]; nhà [emperor.GetHouse.GetName], kẻ được ca tụng là tối-[emperor.Custom('FormalComplimentAdjective')]!\"#!"
  ep3_governor_yearly.3060.desc_regent_legit: "\n\nThần dân của [ceremonial_liege.GetHerHis|U] cầu nguyện: #EMP \"Nguyện [emperor.GetTitledFirstName] che chở triều đại của bệ hạ, gìn giữ vương quyền của Người mãi mãi, cùng hòa bình và trật tự của [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\"#!"
  ep3_governor_yearly.3060.desc_high_legit: "\n\nThần dân của [emperor.GetHerHis|U] cầu nguyện: #EMP \"[ROOT.Char.GetFaith.random_GoodGodNames], xin gìn giữ triều đại của bệ hạ mãi mãi, nay và đời đời! Đến muôn thuở muôn đời!\"#!"
  ep3_governor_yearly.3060.desc_medium_legit: "\n\nNhững đồng tiền lấp lánh tung bay trên đoàn rước huy hoàng! Các quan chức cúi đầu trước [emperor.GetTitledFirstNameNoTooltip]... khuất phục, nếu chưa hẳn trung thành."
  ep3_governor_yearly.3060.desc_low_legit: "\n\nKhi những nghi lễ nịnh hót được cử hành, những lời thì thầm lan khắp cõi... kẻ [emperor.Custom2('InsultAdjective', ROOT.Char)] [emperor.GetTitleAsNameNoTooltip] này dựa vào quyền gì để cai trị?"
  ep3_governor_yearly.3060.a: "Giờ đây, những [emperor.GetTitleAsNamePossessiveNoTooltip] [emperor.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] sẽ được ban thưởng!"
  ep3_governor_yearly.3060.b: "Ta phải lên án chế độ này!"
  ep3_governor_yearly.3060.b.flavor: "Và trong bóng tối, chuẩn bị làm nhiều hơn là chỉ lên án..."
  ep3_governor_yearly.3060.c: "Công khai, ta ủng hộ [emperor.GetTitleAsNameNoTooltip] mới."
  ep3_governor_yearly.3060.c.flavor_high_legit: "Ai có thể làm khác được chứ?"
  ep3_governor_yearly.3060.c.flavor_low_legit: "Dù điều đó chỉ mang lại cho ta sự chế giễu."
  ep3_governor_yearly.3060.c.flavor_regent: "Ta là ai mà dám nghi ngờ ý chí của [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip]?"
  ep3_governor_yearly.3060.c.flavor_med_legit: "Sự trung thành này là điều được mong đợi."
  ep3_governor_yearly.3060.d: "Ta chẳng có mấy ý kiến về chúa thượng mới của mình."
  ep3_governor_yearly.3060.d.regent: "Ta chẳng có mấy ý kiến về vị nhiếp chính mới."
  admin_coronation_still_req_tt: "[emperor.GetShortUIName] đã giành được [emperor.GetPrimaryTitle.GetName], nhưng vẫn mang luật [GetLaw('uncrowned').GetName] [law_i][law|E] cho đến khi [emperor.GetSheHe] cử hành một [coronation|E]"

  ep3_head_of_opposition_modifier: "Trung Tâm Đối Lập"
  ep3_head_of_opposition_modifier_desc: "Những kẻ phản đối một quân vương hùng mạnh tụ họp quanh nhân vật này; họ là người đại diện nổi tiếng cho giới bất mãn."
  ep3_succession_low_legitimacy_tooltip: "#low Hiệu ứng đã bị thay đổi do [emperor.GetTitleAsNamePossessive] có [legitimacy|E] thấp#!"
  ep3_succession_high_legitimacy_tooltip: "#low Hiệu ứng đã bị thay đổi do [emperor.GetTitleAsNamePossessive] có [legitimacy|E] cao#!"

  ep3_governor_yearly.3070.t: "Chiếc Lưỡi Lưu Lạc"
  ep3_governor_yearly.3070.intro: "Một quan viên triều [liege.GetTitledFirstName], bệ hạ của ngươi, nổi tiếng với việc thử thách các con đường [liege.GetPrimaryTitle.GetTierAsNamePossessive]. Cảnh [root_capital.GetTerrain.GetNameNoTooltip|l] quanh"
  ep3_governor_yearly.3070.landed: "kinh đô của ta khá hẻo lánh... nhưng dù sao, kẻ liều lĩnh [racer.GetName] bây giờ"
  ep3_governor_yearly.3070.unlanded: "địa sản gia tộc của ta khá hẻo lánh... nhưng dù sao, kẻ liều lĩnh [racer.GetName] bây giờ"
  ep3_governor_yearly.3070.chariot: "cưỡi xe ngựa đặc trưng của [racer.GetHerHis] băng qua [root_capital.GetName]."
  ep3_governor_yearly.3070.horse: "thúc ngựa lao mạnh qua [root_capital.GetName]."
  ep3_governor_yearly.3070.desc: "\n\n"Ngươi sống tận #EMP đây sao?!?#!" [racer.GetSheHe] nhạo báng. "Không lạ gì [liege.GetTitleAsNameNoTooltip] không nhớ tên ngươi... thực ra, thật kỳ diệu nếu bất kỳ lời nào, bất kỳ lữ khách nào, từ [liege.GetCapitalLocation.GetTitle.GetNameNoTier] còn sống sót sau chuyến hành trình!""
  ep3_governor_yearly.3070.a: "Triển vọng đầy rẫy ở đây! Chúng ta chẳng đi đâu cả."
  ep3_governor_yearly.3070.b: "Thu dọn đi, thân nhân: chúng ta dọn về kinh đô."
  ep3_governor_yearly.3070.c: "Ngươi thấy vấn đề của ta rồi… giờ hãy giúp ta."
  ep3_governor_yearly.3070.c.flavor: "Sinh vật triều đình này hẳn có quan hệ ảnh hưởng — những quan hệ có thể ràng buộc ta vào một nhiệm sở khác."
  ep3_governor_yearly.3070.d: "Chuyến hành trình gian khổ? Ta sẽ lo việc sửa đường."
  ep3_governor_yearly.3070.d.success: "Xây đường gắn kết ta với kinh đô"
  ep3_governor_yearly.3070.d.fail: "Người xây đường gặp muôn vàn nan giải"
  ep3_governor_yearly.3070.e: "Ta yêu những miền ngoại vi mộc mạc này."
  domicile_move_to_province.tt: "Ngươi dời [domicile|E] đến [liege.GetCapitalLocation.GetTitle.GetNameNoTier]"

  cultural_acceptance_gain_content_governor: "[governors|E] cai trị trong sự mãn nguyện"
  contented_governing_countrymen_modifier: "Đồng Hương Được Cai Trị Hài Lòng"
  contented_governing_countrymen_modifier_desc: "Đại diện chính thức cho đồng bào của mình là một nghĩa vụ mà nhân vật này tận hưởng."
  contented_governing_countrymen_modifier_tooltip: "#weak [governor_efficiency|E] khi cai trị [provinces|E] cùng [culture|E]: @governor_efficiency!#P +10%#!#!"
  contented_distant_governor: "Hài lòng với sự mờ nhạt"
  diverging_culture_discount_tooltip: "Chi phí [diverge|E] [culture|E]: #P -33%#!"
  ep3_governor_ignored_isolation_tooltip: "Ngài mất #N -5%#! [governor_efficiency|E] trong #high 5 năm#!"
  ep3_governor_ignored_isolation_removal_tooltip: "[governor_efficiency|E] của Ngài được #P khôi phục#!"
  ep3_face_of_empire_modifier: "Cánh Tay Hành Chính"
  ep3_face_of_empire_modifier_desc: "Bằng sức mạnh từ lòng tận tụy của nhân vật này, đế quốc vươn ra ngoài lõi phục tùng của mình."
  ep3_anxious_for_new_assignment_tooltip: "Ngài mất #N -5%#! [governor_efficiency|E] trong #high 5 năm#!"
  ep3_anxious_for_new_assignment_desc: "#weak [governor_efficiency|E]: #N -5%#!#!"
  ep3_governor_yearly.3080.t: "Bị Nuốt Chửng Bởi [root_capital.GetTerrain.GetNameNoTooltip]"
  ep3_governor_yearly.3080.t_sea: "Bị Nuốt Chửng Bởi Biển Cả"
  ep3_governor_yearly.3080.intro: "Hàng ngày đường phân cách [root_capital.GetName], tổng hành dinh của ta, với [liege.GetCapitalLocation.GetTitle.GetNameNoTier]."
  ep3_governor_yearly.3080.desc_faction: "Dẫu vậy, bản báo cáo của ta về sự tụ tập của [rebel_faction.GetName] lẽ ra đã phải đến tay [liege.GetTitledFirstName] từ lâu!\n\n\"Toàn bộ quân đội ở kinh đô mà không một binh sĩ dự phòng...\" sĩ quan của ta, [captain.GetName], lo lắng. \"Không một binh lính nào lọt qua quân phản loạn mà còn sống...\"\n\nTại tiền đồn xa xôi của ta, ngọn lửa bất ổn âm ỉ cháy. Và thiếu viện binh, nó chỉ có thể bùng lên dữ dội hơn."
  ep3_governor_yearly.3080.desc: "Ta đã chờ đợi từ lâu những hàng hóa xa xỉ, những khoản lương bổng cần thiết để duy trì lòng trung thành của [ROOT.Char.GetPrimaryTitle.GetAdjective]. Nhưng chẳng có gì đến từ [liege.GetTitledFirstName].\n\n\"Thất lạc đâu đó,\" sĩ quan của ta, [captain.GetName], đoán. \"Bị thảo khấu cướp? Mắc kẹt ở vùng hiểm trở? Hay là số hàng đã bị bán cho dân địa phương?\"\n\nDù thế nào đi nữa... ta khó có thể thể hiện uy nghi của [liege.GetPrimaryTitle.GetAdjective] như một kẻ ăn mày nơi đất khách."
  ep3_governor_yearly.3080.a: "Chúng ta phải dần dần xây dựng sự tự lực."
  ep3_governor_yearly.3080.b: "[ROOT.Char.GetFaith.HighGodName], hãy đưa ta rời khỏi chức vụ #EMP đáng nguyền rủa#! này!"
  ep3_governor_yearly.3080.c: "Đi nào, [captain.GetFirstNameNoTooltip]: ta sẽ tự tay xử lý bọn chúng."
  ep3_governor_yearly.3080.c.success: "Quân phản loạn bị trấn áp"
  ep3_governor_yearly.3080.c.fail: "Quan hệ vẫn... căng thẳng"
  ep3_governor_yearly.3080.c.crit_fail: "Đội quân của Ngài bị phục kích và tiêu diệt"
  ep3_governor_yearly.3080.d: "Đi nào, [captain.GetFirstNameNoTooltip]: ta sẽ thu hồi những gì đã mất."
  ep3_governor_yearly.3080.d.success: "Nguồn tiếp tế nhanh chóng được thu hồi"
  ep3_governor_yearly.3080.d.fail: "Không tìm thấy gì"
  ep3_governor_yearly.3080.d.crit_fail: "Đàn áp, thảm họa... và vẫn chẳng có gì"
  ep3_governor_yearly.3080.e: "Ta chắc chắn mọi thứ sẽ #EMP ổn thôi.#!"
  ep3_anxious_for_new_assignment_modifier: "Nôn Nóng Muốn Được Điều Chuyển"
  ep3_anxious_for_new_assignment_modifier_desc: "Cơn khát danh vọng và ảnh hưởng — bất cứ thứ gì ngoài sự bẩn thỉu của việc cai trị — định hình viên quan này.\n[governor_efficiency|E]: @governor_efficiency!#N -5%#!"
  ep3_invested_in_power_center_modifier: "Đầu Tư Phồn Thịnh"
  ep3_invested_in_power_center_modifier_desc: "Gia tộc này bao quanh mình bằng những điền sản hưng thịnh."
  ep3_cosmopolitan_domicile_modifier: "Điền Trang Đa Văn Hóa"
  ep3_cosmopolitan_domicile_modifier_desc: "Điền trang của gia tộc này là trung tâm ảnh hưởng chính trị và tài chính."
  custom.every_realm_vassal_local_estate: "Mọi [vassal|E] đồng liêu có [domicile|E] nằm trong [domain|E] của Ngài"
  custom.every_vassal_same_domicile_location: "Mọi [vassal|E] đồng liêu cùng chung địa điểm [domicile|E] với Ngài"

  ep3_governor_yearly.3090.t: "Trái Tim Của [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  ep3_governor_yearly.3090.desc: "Ta đã thấy binh lính lầm lũi tiến ra biên giới. Nghe các quan chức, lo sợ những nhiệm sở xa xôi, than thở về những khúc hát ngoại bang thô tục và những bữa ăn nhạt nhẽo...\n\nTại [root_capital.GetName], ta không bận tâm điều đó. Công việc của chính [liege.GetPrimaryTitle.GetTierAsName] chảy qua "
  ep3_governor_yearly.3090.landed: "[ROOT.Char.GetPrimaryTitle.GetTierAsName] của ta — chúng ta buôn bán hàng hóa vương quyền, duy trì quan hệ trong cung điện của [liege.GetTitleAsNamePossessive], và giữ vai trò lớn trong chính trị toàn cõi.\n\nThật tuyệt vời biết bao khi được phục vụ tại trái tim của thực thể vĩ đại và phồn thịnh ấy."
  ep3_governor_yearly.3090.unlanded: "cổng điền trang — dĩ nhiên, chỉ bước vào bằng lễ nghi tinh tế. Nhờ vậy, gia tộc ta chưa bao giờ rời xa guồng máy của cõi đời.\n\nThật tuyệt vời biết bao khi được sống tại trái tim của thực thể vĩ đại và phồn thịnh ấy."
  ep3_governor_yearly.3090.a: "Ta có thể môi giới lối vào những đại sảnh quyền lực..."
  ep3_governor_yearly.3090.a.flavor: "...nhưng kẻ ít quan hệ hơn sẽ phải trả giá rất đắt."
  ep3_governor_yearly.3090.b: "Mở rộng các khoản đầu tư địa phương là điều khôn ngoan."
  ep3_governor_yearly.3090.c: "Ta đang hứng thú với một buổi tiệc tối!"
  ep3_governor_yearly.3090.c.flavor: "Tất nhiên là với những vị khách địa phương có tầm ảnh hưởng chính trị!"

  ep3_ignoring_realm_decline_modifier: "Phớt Lờ Khủng Hoảng Lãnh Thổ"
  ep3_ignoring_realm_decline_modifier_desc: "Trước tình trạng quản lý yếu kém của lãnh thổ... nhân vật này đang dần tự tách mình ra về mặt cảm xúc."
  ep3_ignoring_realm_decline_tooltip: "#weak [governor_efficiency|E]: #N -5%#!#!"
  ep3_ignoring_realm_decline_years_tooltip: "Ngài mất #N -5%#! [governor_efficiency|E] trong #high 10 năm#!"
  ep3_following_governorship_example_tooltip: "Mọi [vassal|E] khác của [liege.GetShortUIName] nhận #high 10#! [trait_level_track_xp|E] cho [trait|E] [GetTrait('governor').GetName( root_scope )]"

  ep3_governor_yearly.3100.t: "[liege.GetPrimaryTitle.GetTierAsNameNoTooltip] của Chúng Ta, Hỗn Loạn"
  ep3_governor_yearly.3100.intro_liege: ""[liege.GetSheHe|U] vừa ra lệnh #EMP cái gì#! thế này?" Ta lắp bắp. #EMP "Chủ quân của ta lại bắt ta làm cái gì?!?"#!"
  ep3_governor_yearly.3100.intro_governors: ""Đám đại thần vô dụng kia từ chối #EMP cái gì#!?" Ta lắp bắp. #EMP "Chúng còn không chịu làm gì cho chủ quân của ta sao?!?"#!"
  ep3_governor_yearly.3100.desc: "\n\n[messenger.GetFirstName], một sứ giả, lắp bắp: "Vị [liege.Custom('FormalComplimentAdjective')] và trường tồn [liege.GetTitledFirstNameRegnal], vì sự thịnh vượng của [liege.GetHerHis] [liege.GetPrimaryTitle.GetTierAsName], đã ban lệnh rằng mọi lao động, mọi gia nhân đều phải chịu thuế—"\n\nTa không thể nghe thêm được nữa."
  ep3_governor_yearly.3100.desc_liege_debt: "Tên [liege.Custom2('InsultNoun', ROOT.Char)] kia cùng lũ tay chân đeo đầy châu báu, khoác lụa cashmere của [liege.GetHerHis] đã rút cạn toàn bộ của cải của [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]! Với những kế hoạch mới này, chúng chỉ khiến dân chúng đói khổ và tiêu vong..."
  ep3_governor_yearly.3100.desc_liege_skill: "[liege.Custom('quirk_neg_adverb')|U], [liege.Custom2('InsultNoun', ROOT.Char)] quay sang chúng ta, những bộ trưởng, tìm kiếm những gì [liege.GetSheHe] không thể tự bảo đảm — lợi nhuận của một sự cai trị hợp lý!\n\n[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] không còn hy vọng gì nữa..."
  ep3_governor_yearly.3100.desc_governors: "Một mệnh lệnh cơ bản đến mức #EMP sơ đẳng#!! Chẳng lẽ [liege.GetTitleAsNameNoTooltip] phải cầu xin đám quan lại của [liege.GetHerHis] làm #EMP bất cứ điều gì?!#! Bất cứ điều gì ngoài việc giẫm đạp lên thành quả của cả lãnh thổ?\n\n[liege.GetPrimaryTitle.GetNameNoTier] đang bị lũ đầu óc rỗng tuếch chiếm giữ..."
  ep3_governor_yearly.3100.a: "Có lẽ ta phải dạy lại chúng thế nào là cai trị."
  ep3_governor_yearly.3100.b: "Chủ quân của ta phải sửa chữa sự quản lý thảm hại này!"
  ep3_governor_yearly.3100.b.success: "Bức thư của Ngài mang sức thuyết phục mạnh mẽ"
  ep3_governor_yearly.3100.b.fail: "[liege.GetTitleAsNameNoTooltip] cảm thấy bị xúc phạm"
  ep3_governor_yearly.3100.c: "Từ hỗn loạn sinh ra lợi nhuận."
  ep3_governor_yearly.3100.c.flavor: "Trong thời buổi mục ruỗng này, ai sẽ để ý thêm một chút tham nhũng chứ?"
  ep3_governor_yearly.3100.d: "Ta không thể sửa chữa tình cảnh thảm hại này..."
  ep3_governor_yearly.3100.d.flavor: "Chỉ nghĩ đến thôi cũng đủ khiến ta chán ghét..."

  msg_governor_upset_about_skill.t: "[root_scope.GetTitleAsNameNoTooltip] Chỉ Trích Bộ Máy Cai Trị"
  msg_governor_upset_about_skill.desc: "[vassal|E] của Ngài không hài lòng với [skills|E] yếu kém của Ngài."
  msg_governor_upset_about_governance.t: "[root_scope.GetTitleAsNameNoTooltip] Lên Án Chế Độ"
  msg_governor_upset_about_governance.desc: "[vassal|E] của Ngài không hài lòng với [skills|E] hoặc [governor_efficiency|E] thấp của Ngài."
  msg_governor_upset_about_insolvency.t: "[root_scope.GetTitleAsNameNoTooltip] Chỉ Trích Tình Trạng Vỡ Nợ"
  msg_governor_upset_about_insolvency.desc: "[vassal|E] của Ngài đã bị ảnh hưởng bởi khoản nợ [gold|E] của Ngài."
  msg_governor_upset_about_bad_govs.t: "[root_scope.GetTitleAsNameNoTooltip] Khinh Thường Đám Quan Lại Bất Tài"
  msg_governor_upset_about_bad_govs.desc: "[vassal|E] của Ngài phàn nàn về [governor_efficiency|E] thấp trong hàng ngũ đồng liêu của [root_scope.GetHerHis]."
