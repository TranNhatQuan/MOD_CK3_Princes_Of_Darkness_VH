  friend_rewarding_duties: "[CHARACTER.GetShortUIName|U] đã ban cho [TARGET_CHARACTER.GetShortUIName] một phần thưởng hậu hĩnh vì đã hoàn thành tốt bổn phận"
  friend_rewarding_duties_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã ban cho [CHARACTER.GetShortUIName] một phần thưởng hậu hĩnh vì đã hoàn thành tốt bổn phận"
