l_english:
  ep3_eparch_event.0001.t: "$eparch_court_position$: Củng cố Thủ đô"
  ep3_eparch_event.0001.desc_intro: "[emperor.GetPrimaryTitle.GetTierAsNameNoTooltip] đang lâm vào chiến tranh. Bị vây hãm bởi [attacker.GetCulture.GetCollectiveNounNoTooltip] và [attacker.Custom2('InsultAdjective', ROOT.Char)] [attacker.GetTitledFirstName].\n\n"
  ep3_eparch_event.0001.desc_winning_war: "[emperor.GetTitledFirstName] dường như đang chiếm thế thượng phong, nhưng vẫn chưa nên tuyên bố chiến thắng khi chiến tranh chưa thực sự kết thúc."
  ep3_eparch_event.0001.desc_losing_war: "[emperor.GetTitledFirstName] đang chiến đấu trong thế bất lợi. Có lẽ chỉ còn là vấn đề thời gian trước khi chiến sự lan rộng hơn nữa."
  ep3_eparch_event.0001.desc_undecided_war: "Hiện vẫn còn quá sớm để nói trước kết cục, khi chưa bên nào giành được ưu thế rõ rệt."
  ep3_eparch_event.0001.desc_outro: "\n\n[capital.GetTitle.GetNameNoTier] vẫn đang an toàn. #EMP Ít nhất là hiện tại#!. Tuy nhiên, sẽ là khôn ngoan nếu chúng ta chuẩn bị kỹ càng trong trường hợp chiến tranh ập đến ngay trước cổng thành..."
  ep3_eparch_event.0001.a: "Thủ đô #EMP nhất định#! phải được bảo vệ!"
  ep3_eparch_event.0001.b: "Một vài cải thiện vừa phải là đủ."
  ep3_eparch_event.0001.c: "Chắc chắn [capital.GetTitle.GetNameNoTierNoTooltip] không gặp #EMP nguy hiểm thực sự#! chứ?"
 
  ep3_eparch_event.0002.desc: "[eparch.GetTitledFirstName], [emperor.Custom2('RelationToMeShort',eparch)] của ta, đã áp dụng những biện pháp đáng kể nhằm giữ an toàn cho thủ đô trong thời chiến.\n\n"
  ep3_eparch_event.0002.desc_at_home: "\"Nhìn xem này!\" [eparch.GetFirstNameNoTooltip] hào hứng nói, dẫn đường bằng những bước chân đầy nhiệt huyết. \"Những bức tường này đã được gia cố và cải thiện đáng kể. Đằng kia là doanh trại mới, cho phép đồn trú một lực lượng lớn hơn nhiều.\"\n\n\"Ta dám chắc [capital.GetTitle.GetNameNoTier] đã sẵn sàng cho một cuộc vây hãm kéo dài, thưa [emperor.GetLadyLord], nếu chiến tranh chạm đến thành phố yêu dấu của chúng ta.\""
  ep3_eparch_event.0002.desc_away: "Lá thư trong tay ta mô tả chi tiết nhiều đoạn tường thành đã được gia cố và nâng cấp đáng kể, cùng với việc bổ sung thêm binh lính cho quân đồn trú. Có vẻ như [capital.GetTitle.GetNameNoTier] đang được trông coi cẩn mật và hoàn toàn sẵn sàng cho một cuộc vây hãm tiềm tàng."
  ep3_eparch_event.0002.a: "Sự tận tâm như vậy xứng đáng được tưởng thưởng!"
  ep3_eparch_event.0002.b: "[eparch.GetSheHe|U] chỉ đang làm công việc của [eparch.GetHerHis]."
 
  ep3_eparch_event.0005.t: "$eparch_court_position$: Mất Kiểm Soát"
  ep3_eparch_event.0005.desc: "Quyền kiểm soát của chúng ta đối với [capital.GetTitle.GetNameNoTier] đang suy yếu...\n\nBọn tội phạm nhanh chóng lợi dụng tình hình và hiện đang tự do tung hoành trên khắp các con phố. Đó là #EMP trách nhiệm của ta#! phải đảm bảo an toàn cho thành phố và mọi cư dân sống trong những bức tường này."
  ep3_eparch_event.0005.a: "Hãy chi tiền thuê thêm người tuần tra đường phố."
  ep3_eparch_event.0005.b: "Có lẽ ta có thể khiến bọn tội phạm quay sang chống lại nhau?"
  ep3_eparch_event.0005.b_success_tt: "Ngài thao túng thành công bọn tội phạm"
  ep3_eparch_event.0005.b_success: "Âm mưu thao túng thành công"
  ep3_eparch_event.0005.b_failure_tt: "Ngài không thể khiến bọn tội phạm quay sang chống lại nhau"
  ep3_eparch_event.0005.b_failure: "Âm mưu thao túng thất bại"
  ep3_eparch_event.0005.success_liege: "$eparch_court_position$ Thành công tăng [control|E]"
  ep3_eparch_event.0005.failure_liege: "$eparch_court_position$ Thất bại trong việc tăng [control|E]"
  ep3_eparch_event.0005.c: "[marshal.GetCouncilTitleFirstNameNoTooltip] có thể giúp được chăng?"
  ep3_eparch_event.0005.d: "Không cần phản ứng thái quá. Tình hình chưa đến mức #EMP nghiêm trọng như vậy#!."
 
  ep3_eparch_event.0010.t: "$eparch_court_position$: Dịch Bệnh Hoành Hành"
  ep3_eparch_event.0010.desc: "[capital.GetTitle.GetNameNoTier] đang bị dịch bệnh tàn phá!\n\n[capital_plague.GetName] lan rộng khắp thủ đô, lây nhiễm mọi tầng lớp dân cư, bất kể địa vị, danh tiếng hay chỗ đứng trong triều đình. Như thường lệ, những kẻ thiếu thốn tiền bạc và điều kiện để tìm thầy thuốc sẽ phải gánh chịu hậu quả nặng nề nhất.\n\n[ROOT.Char.GetTopLiege.GetTitledFirstName] chắc chắn mong đợi ta hành động và làm mọi điều có thể để ngăn chặn một thảm họa."
  ep3_eparch_event.0010.a: "Cần những biện pháp quyết liệt. Phong tỏa thành phố!"
  ep3_eparch_event.0010.b: "Lùng sục khắp thành phố tìm thầy thuốc và bắt họ làm việc."
  ep3_eparch_event.0010.c: "Thầy thuốc của ta, [physician.GetFirstNameNoTooltip], có thể giúp!"
  ep3_eparch_event.0010.d: "Ta e rằng chẳng còn gì có thể làm..."
  ep3_eparch_event.0010.c_success_tt: "[physician.GetTitledFirstName] thành công làm dịu dịch bệnh"
  ep3_eparch_event.0010.c_success: "[physician.GetTitledFirstName] Thành Công"
  ep3_eparch_event.0010.c_failure_tt: "[physician.GetTitledFirstName] thất bại trong việc làm dịu dịch bệnh"
  ep3_eparch_event.0010.c_failure: "[physician.GetTitledFirstName] Thất Bại"
 
  ep3_eparch_event.0015.t: "$eparch_court_position$: Đại Học Cần Giảng Viên"
  ep3_eparch_event.0015.desc: "Trường đại học tại [capital.GetTitle.GetNameNoTier] đã gửi một bức thư giải thích nhu cầu của họ về việc cần thêm giáo viên.\n\nNó đi sâu vào chi tiết về việc cung cấp một nền giáo dục chất lượng cao là quan trọng nhất và, nếu không có thêm nhân viên, họ sẽ không thể đáp ứng được kỳ vọng của [emperor.GetTitledFirstNamePossessive]. Trường đại học khẩn cầu ta thuê một ứng viên phù hợp một cách nhanh chóng."
  ep3_eparch_event.0015.a: "Thật trùng hợp, ta biết đúng người!"
  ep3_eparch_event.0015.b: "Gia tộc [powerful_house_head.GetHouse.GetBaseNameNoTooltip] xứng đáng với vị trí này."
  ep3_eparch_event.0015.c: "Chắc chắn trong thành phố có học giả phù hợp để thuê."
  ep3_eparch_event.0015.d: "Thực ra… sao ngươi không đến làm việc cho ta, [teacher_local_scholar.GetFirstNameNoTooltip]?"
  ep3_eparch_event.0015.e: "Tạm thời họ sẽ phải xoay xở vậy."
  ep3_eparch_event.0015.b.msg.t: "Bổ Nhiệm Giảng Viên"
  ep3_eparch_event.0015.b.msg.desc: "$eparch_court_position$ đã bổ nhiệm [teacher_powerful_family.GetShortUIName] làm giảng viên tại Đại học ở [capital.GetTitle.GetNameNoTier]"
  teacher_moves_to_capital_tt: "[teacher_tt.GetShortUIName|U] chuyển đến [capital.GetTitle.GetNameNoTier] làm giảng viên"
 
  ep3_eparch_event.0020.t: "$eparch_court_position$: Ghi Nhận Công Lao"
  ep3_eparch_event.0020.desc_intro: "Khi ta bước dọc theo hành lang lờ mờ ánh đèn, dòng suy nghĩ bỗng bị cắt ngang bởi tiếng gọi tên mình. Ta quay lại và thấy [emperor.GetShortUIName] đang tiến đến, theo sau là một người hầu.\n\n\"[eparch.GetFirstNameNoTooltip]! Ngươi đã hoàn thành xuất sắc nhiệm vụ trông coi [capital.GetTitle.GetNameNoTier]. Sự tận tâm như vậy xứng đáng được tưởng thưởng, và ta rất sẵn lòng đáp lại.\"\"\n\n"
  ep3_eparch_event.0020.desc_gold: "[emperor.GetSheHe|U] ra hiệu cho người hầu tiến lên. Người hầu mở nắp một chiếc rương nhỏ, để lộ bên trong là những đồng tiền, châu báu quý giá và đủ loại vật phẩm giá trị!"
  ep3_eparch_event.0020.desc_artifact: "Người hầu bước lên phía trước. Chỉ trong một động tác gọn gàng, tấm vải phủ được kéo sang một bên, để lộ cổ vật bên dưới."
  ep3_eparch_event.0020.desc_hook_removal: "[emperor.GetTitleAsNameNoTooltip] tiếp lời, \"Ta đã nói chuyện với [peer_with_hook.GetShortUIName] và thuyết phục [peer_with_hook.GetHerHim] từ bỏ bất kỳ ân huệ nào mà ngươi từng mắc nợ. Từ nay về sau, [peer_with_hook.GetSheHe|U] sẽ không còn gây rắc rối cho ngươi nữa.\"\""
  ep3_eparch_event.0020.desc_emperor_hook: "\"Nếu ngươi cần bất cứ điều gì — và ta nhấn mạnh là #EMP bất cứ điều gì#! — đừng ngần ngại nói với ta. Ta sẽ làm mọi thứ có thể để giúp ngươi.\"\""
  ep3_eparch_event.0020.a: "Thần xin cảm tạ, thưa [emperor.GetLadyLord]!"
 
  ep3_eparch_event.9000.t: "$eparch_court_position$: Lơ Là Bổn Phận"
  ep3_eparch_event.9000.desc: "Với tư cách là $eparch_court_position$, nhiệm vụ của [eparch.GetTitledFirstNamePossessive] là quản lý và chăm sóc mọi nhu cầu của [capital.GetTitle.GetNameNoTierPossessive] như thể thành phố đó là ngôi nhà của [eparch.GetHerHis] vậy!\n\nTuy nhiên, [eparch.GetSheHe] đã bỏ bê nghiêm trọng trách nhiệm quan trọng này, phản bội niềm tin của ta trong quá trình này và làm lãng phí #EMP đặc quyền#! mà ta đã ban cho [eparch.GetHerHim]! Và vì cái gì? Một nỗ lực phục vụ lợi ích cá nhân của [eparch.GetHerHis].\n\n[eparch.GetFirstNameNoTooltip] đang chờ sự phán xét của ta..."
  ep3_eparch_event.9000.a: "Hoàn toàn không thể chấp nhận được! Ngươi bị cách chức! #EMP cút đi#!!"
  ep3_eparch_event.9000.b: "Hãy coi đây là một lời cảnh cáo. Nhưng ngươi sẽ #EMP mắc nợ#! ta!"
  ep3_eparch_event.9000.c: "Ta sẽ làm ngơ chuyện này. Ít nhất là lúc này."
 
  ep3_eparch_event.9001.intro: "Ta đến phòng ngai vàng sau khi được triệu kiến bởi [emperor.GetTitledFirstName], rồi nhanh chóng tiến đến bệ ngai.\n\n"
  ep3_eparch_event.9001.desc_fired: "\"Ngươi đã làm ta thất vọng, [eparch.GetFirstNameNoTooltip]. Ta giao [capital.GetTitle.GetNameNoTier] cho ngươi trông coi, và ngươi đáp lại bằng cách #EMP hoàn toàn#! phớt lờ nhu cầu của thành phố! Hành vi của ngươi là không thể chấp nhận được.\"\"\n\n[emperor.GetTitleAsName] đứng dậy; \"Ngươi bị bãi nhiệm khỏi chức vụ [GetCourtPositionType('eparch_court_position').GetNameNoTooltip()]. Hãy tự coi mình là may mắn vì ta không đi xa hơn nữa.\"\""
  ep3_eparch_event.9001.desc_warned: ""Đã đến tai ta rằng ngươi đã bỏ bê nhiệm vụ của mình, [eparch.GetFirstNameNoTooltip]." [emperor.GetFirstNameNoTooltip] lắc đầu của [emperor.GetHerHis]. "Hãy coi đây là một lời cảnh báo. Ta đã quyết định để ngươi được dễ dàng. #EMP Hiện tại là vậy#!. Ta hy vọng không cần phải nói rằng ngươi sẽ nợ ta."\n\n[emperor.GetTitleAsNameNoTooltip] cho ta rời đi với một cái vẫy tay của [emperor.GetHerHis]."
  ep3_eparch_event.9001.desc_nothing: "Nhanh chóng trở nên rõ ràng rằng có điều gì đó không ổn. Sự im lặng và căng thẳng bao trùm bầu không khí nói lên tất cả.\n\n[emperor.GetSheHe|U] #EMP biết#! rằng ta đã lờ đi nhiệm vụ của mình với tư cách là quản trị viên của [capital.GetTitle.GetNameNoTierPossessive], phải không? Ta chờ đến lượt mình.\n\nNhiều phút trôi qua, nhưng không có gì xảy ra. [emperor.GetFirstNameNoTooltip] nhìn ta trong chốc lát rồi bỏ đi. Có vẻ như [emperor.GetTitleAsName] đã chọn cách lờ đi sự vi phạm của ta. Hiện tại là vậy."
  ep3_eparch_event.9001.a: "Cái gì? #EMP Bị cách chức?!#!"
  ep3_eparch_event.9001.b: "Chuyện này suýt nữa đã tệ hơn nhiều..."
  ep3_eparch_event.9001.c: "Có lẽ ta nên tự coi mình là may mắn."
 
  eparch_hook_warning: "@alert_icon! #alert_trial [eparch.GetTitledFirstName] có một ràng buộc với Ngài – hành động này sẽ gây ra những hệ quả bổ sung#!"
 
  eparch_neglecting_duty_warning_tt: "@alert_icon! #alert_trial Việc liên tục lơ là bổn phận có thể khiến [liege|E] của Ngài chú ý và ra tay#!"
  eparch_reward_msg_title: "Được Thưởng Vì Hoàn Thành Bổn Phận"
 
  duel_aptitude_challenge: "Thử Thách [aptitude|E]"
  duel_aptitude_challenge_first: "$duel_aptitude_challenge$"
  duel_aptitude_challenge_first_past: "$duel_aptitude_challenge$"
  duel_aptitude_challenge_third: "[CHARACTER.GetShortUIName|U]:\n $duel_aptitude_challenge$"
