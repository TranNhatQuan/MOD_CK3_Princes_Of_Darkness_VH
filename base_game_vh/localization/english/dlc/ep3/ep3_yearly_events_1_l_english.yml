l_english:
 
  ep3_yearly.1010.t: "Hippomania"
  ep3_yearly.1010.intro: "#EMP Cộp, cộp. Cộp, cộp.#!\n\nCưỡi trên chiến mã [horse_owner.GetHerHis], [horse_owner.Custom('WarhorseStoryName')], vị tổng trấn đồng liêu của ta, [horse_owner.GetTitledFirstName], hiên ngang thúc ngựa đi qua sân trong của ta. Con [horse_owner.Custom('HorseStoryMareStallion')] sải bước đầy kiêu hãnh, luôn ý thức rõ về dòng dõi lừng lẫy của mình.\n\n[horse_owner.GetFirstNameNoTooltip] là niềm ghen tị của mọi tổng trấn trong [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] — và ta cũng không ngoại lệ."
  ep3_yearly.1010.greek_flavor: "[Glossary( 'Hipperos', 'HIPPEROS_GLOSS' )] ăn sâu trong truyền thống Hy Lạp."
  ep3_yearly.1010.outro: "\n\n[horse_owner.Custom('WarhorseStoryName')] phải thuộc về ta! Nhưng bằng cách nào?"

  ep3_yearly.1010.a: "Có lẽ một mức giá phù hợp sẽ thuyết phục được [horse_owner.GetFirstNameNoTooltip]..."
  ep3_yearly.1010.a.tt.success: "[horse_owner.GetTitledFirstNameNoTooltip] chấp nhận đề nghị của Ngài"
  ep3_yearly.1010.a.tt.failure: "[horse_owner.GetTitledFirstNameNoTooltip] từ chối đề nghị của Ngài"

  ep3_yearly.1010.b: "[horse_owner.Custom('WarhorseStoryName')] xứng đáng với một người có địa vị cao hơn."
  ep3_yearly.1010.b.tt.success: "[horse_owner.GetTitledFirstNameNoTooltip] nhượng bộ trước ảnh hưởng của Ngài"
  ep3_yearly.1010.b.tt.failure: "[horse_owner.GetTitledFirstNameNoTooltip] từ chối đề nghị của Ngài"

  ep3_yearly.1010.c: "\"[spymaster.GetFirstNameNoTooltip], con ngựa này sẽ là của ta — bằng mọi giá.\""
  ep3_yearly.1010.c.flavor: "Ngài giao cho Trưởng gián điệp, [spymaster.GetTitledFirstNameNoTooltip], nhiệm vụ bí mật tẩu tán con [horse_owner.Custom('HorseStoryMareStallion')]"
  ep3_yearly.1010.c.tt.success: "[spymaster.GetFirstNameNoTooltip] bí mật mang con ngựa đi"
  ep3_yearly.1010.tt: "[horse_owner.Custom('WarhorseStoryName')] trở thành của Ngài"
  ep3_yearly.1010.c.tt.failure: "[spymaster.GetFirstNameNoTooltip] không thể trộm được con ngựa"
  ep3_yearly.1010.d: "Đừng soi mói con ngựa được tặng, [horse_owner.GetFirstNameNoTooltip]."
  ep3_yearly.1010.d.tt: "Ngài đầu độc con ngựa của [horse_owner.GetTitledFirstNamePossessiveNoTooltip]"
  ep3_yearly.1010.d.success: "[horse_owner.GetFirstNameNoTooltip] không hề hay biết"
  ep3_yearly.1010.d.failure: "[horse_owner.GetFirstNameNoTooltip] phát hiện ra Ngài"
  ep3_yearly.1010.d.dead_horse: "[horse_owner.Custom('WarhorseStoryName')] chết"

  HIPPEROS_GLOSS: "#bold Hipperos#! là một từ Hy Lạp cổ dùng để chỉ sự ám ảnh với ngựa."
