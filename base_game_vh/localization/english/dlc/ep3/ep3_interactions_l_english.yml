  acclamation_succession_warning_tt: "@warning_icon! #X Tước vị [target.GetName] hoặc [holder|E] của nó đang áp dụng [succession_law|E] theo hình thức Tán thành (Acclamation). Hình thức này sẽ thay thế mọi điểm số ứng viên và tước vị sẽ thuộc về người thừa kế chính thay thế.#!"

  ep3_interactions_events.0101.t: "Yêu cầu của Nhà bảo trợ: Thuê một [recipient.Custom('KnightCultureNoTooltip')]"
  ep3_interactions_events.0101.desc: "\"Xét xem ta có thể cho mượn ai...\" [recipient.GetName] lên tiếng. \"Ta đã đích thân chọn ra vài [recipient.Custom('KnightCulturePluralNoTooltip')|l] hiếu chiến nhất của mình. Ra mắt đi!\"\n\n"
  ep3_interactions_events.0101.desc_knight_1_trait: "\"Ta là một [cool_trait_1.GetName(knight_to_rent_1)] lừng danh!\" [knight_to_rent_1.GetName] khoe khoang.\n\n"
  ep3_interactions_events.0101.desc_knight_1: "\"Chỉ thế này thôi cũng đủ nói lên tất cả!\" [knight_to_rent_1.GetName] gồng [knight_to_rent_1.GetHerHis] cơ bắp.\n\n"
  ep3_interactions_events.0101.desc_knight_2_trait: "\"Chọn ta đi, và ta sẽ là [cool_trait_2.GetName(knight_to_rent_2)] mà ngài cần!\" [knight_to_rent_2.GetName] lớn tiếng kêu gọi.\n\n"
  ep3_interactions_events.0101.desc_knight_2: "\"Ta sẽ là [ROOT.Char.Custom('KnightCultureNoTooltip')|l] xuất sắc nhất của ngài!\" [knight_to_rent_2.GetName] hô hào đầy phấn khích.\n\n"
  ep3_interactions_events.0101.desc_knight_3_trait: "\"Ta được biết đến như một [cool_trait_3.GetName(knight_to_rent_3)] đáng gờm,\" [knight_to_rent_3.GetName] tự tin nói."
  ep3_interactions_events.0101.desc_knight_3: "\"Ta là một tay ẩu đả xuất chúng.\" [knight_to_rent_3.GetName] khoe khoang đầy tự tin."
  ep3_interactions_events.0101.a: "Ta thích sự tự tin của [knight_to_rent_1.GetNameNoTooltip]!"
  ep3_interactions_events.0101.b: "Ta sẽ cùng [knight_to_rent_2.GetNameNoTooltip] chia sẻ những chiến thắng huy hoàng!"
  ep3_interactions_events.0101.c: "[knight_to_rent_3.GetNameNoTooltip] trông rất triển vọng!"
  ep3_interactions_events.0101.d: "Ta không ấn tượng."
  ep3_rent_knight_effect.tt: "[rented_knight.GetShortUIName] với [rented_knight.GetProwess][prowess_i] gia nhập [camp|E] của Ngài trong #V 5 năm#!"
  ep3_interactions_events.0102.opening: "[rented_knight.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ep3_interactions_events.0102.desc: "Thời gian ta phục vụ với tư cách là [ROOT.Char.Custom('KnightCultureNoTooltip')|l] của ngài đã kết thúc. Ta hy vọng chúng ta sẽ còn gặp lại nhau, ở cùng một phía của chiến trường."
  ep3_interactions_events.0102.a: "Nguyện [ROOT.Char.GetFaith.HighGodName] phù hộ cho ngươi!"

  new_liege_government_changed_title: "Chính quyền thay đổi"
