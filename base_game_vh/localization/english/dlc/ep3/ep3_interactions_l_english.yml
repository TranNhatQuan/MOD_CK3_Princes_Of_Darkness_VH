  PROCURE_ESTATE_PROPOSAL_OUTRO: "Ta xin ngươi ban cho gia tộc ta một điền trang tại [recipient.GetCapitalLocation.GetTitle.GetNameNoTier], và cho bản thân ta một tiếng nói trong [recipient.GetTopLiege.GetPrimaryTitle.GetTierAsName]. Ta có thể trở thành một tài sản vô cùng hữu ích."

