  ep3_laamps.0401.t: "$seize_realm$: [ROOT.Char.GetTitleAsNameNoTooltip] Mới"
  ep3_laamps.0401.desc: "Kế hoạch được rà soát đi rà soát lại, mọi khả năng đều đã được chuẩn bị, từng kẻ đồng mưu sẵn sàng vào vị trí. Việc xông vào [target.Custom('ResidenceBuilding')|l] dưới vỏ bọc tuyển dụng diễn ra khá suôn sẻ...\n\nHỗn loạn bùng nổ khi báo động vang lên, nhưng giữa cảnh chém giết loạn xạ, cuối cùng chúng ta cũng thoát ra, kiệt sức nhưng chiến thắng!\n\n"
  ep3_laamps.0401.imprison: "Ta đã lôi tên [target.Custom2('InsultAdjective', ROOT.Char)] giả [ROOT.Char.GetTitleAsNameNoTooltip] đó, [target.GetFirstName], đến trước mặt ta, ngay trong phòng ngai vàng của [target.GetHerHis], kẻ tù nhân của ta để làm bất cứ điều gì ta muốn!"
  ep3_laamps.0401.death: "Tên [target.Custom2('InsultAdjective', ROOT.Char)] giả [ROOT.Char.GetTitleAsNameNoTooltip] đó, [target.GetFirstName] — quá yếu đuối cho vương miện của [target.GetHerHis] — đã chết."
  ep3_laamps.0401.outro: "Tên giả mạo [target.Custom2('InsultAdjective', ROOT.Char)] kia — giả-[ROOT.Char.GetTitleAsNameNoTooltip] [target.GetFirstName] — bằng cách nào đó đã trốn thoát, và chừng nào [target.GetSheHe] còn tự do, địa vị của ta vẫn bị đe dọa."
  ep3_laamps.0401.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] là #EMP của ta#!!"
 
  ep3_laamps.0402.t: "$seize_realm$: Hy vọng tan vỡ"
  ep3_laamps.0402.desc: "Gần như ngay từ đầu, những kế hoạch chu toàn nhất của ta đã trật bánh một cách đáng sợ. Chiếm lấy vương miện khó hơn ta tưởng...\n\nChúng ta vừa mới đặt chân vào [target.GetTitledFirstNamePossessive] [target.Custom('ResidenceBuilding')|l] thì lính canh từ đâu ập tới, phơi bày hoàn toàn âm mưu của chúng ta."
  ep3_laamps.0402.imprison: "Chúng ta chiến đấu quyết liệt, nhưng nhanh chóng bị bao vây.\n\nBị trói trong xiềng xích, ta bị lôi ra trước mặt [target.GetTitleAsNameNoTooltip], kẻ để lộ cơn thịnh nộ của [target.GetHerHis]..."
  ep3_laamps.0402.death: "Chúng ta chiến đấu quyết liệt, nhưng nhanh chóng bị bao vây.\n\nKhi ta quay đầu bỏ chạy, ta nhận ra không còn lối thoát, và binh lính lao tới với gươm giơ cao!"
  ep3_laamps.0402.outro: "Chúng ta chiến đấu quyết liệt, và may mắn thoát ra được với mạng sống.\n\n[target.GetFirstNameRegnal] vẫn là [target.GetTitleAsNameNoTooltip] của [target.GetPrimaryTitle.GetNameNoTier], an toàn trong [target.GetHerHis] [target.Custom('ResidenceBuilding')|l], và chắc chắn đang ráo riết truy bắt ta..."
  ep3_laamps.0402.a: "Khốn kiếp, ta chỉ còn #EMP chút nữa#! thôi!"
  ep3_laamps.0402.b: "Vận rủi chết tiệt..."
  ep3_laamps.0402.c: "Chết tiệt!"

  ep3_laamps.0410.t: "$seize_realm$: Vương miện bị cướp"
  ep3_laamps.0410.desc: "Một ngày tưởng chừng bình thường tại [target.GetCapitalLocation.GetBaronyNameExplicitly] bỗng chuyển hướng u ám. [target.Custom('ResidenceBuilding')|l] vang dội tiếng lính gác la hét và gia nhân thét lên khi chạy loạn khắp các hành lang.\n\nCuối cùng, một viên trung sĩ thở hổn hển giải thích rằng một nhóm côn đồ đã xâm nhập dưới danh nghĩa giả mạo và đang đánh thẳng vào phòng ngai vàng!\n\n"
  ep3_laamps.0410.imprison: "Binh lính đột ngột xông qua cửa, và chẳng mấy chốc ta bị lôi ra trước kẻ cầm đầu của chúng, [owner.GetFirstName], kẻ đắc thắng giơ cao vương miện của ta."
  ep3_laamps.0410.death: "Toan bỏ trốn, ta bị cuốn vào cơn hỗn chiến hỗn loạn, và một lưỡi kiếm quét thẳng về phía ta!"
  ep3_laamps.0410.outro: "Ta lén lút băng qua khu gia nhân, cải trang thành thường dân, rồi hòa vào đám đông đang tháo chạy khỏi [target.Custom('ResidenceBuilding')|l]..."
  ep3_laamps.0410.a: "Ta sẽ quay lại!"
  ep3_laamps.0410.b: "Đồ cóc ghẻ!"
  ep3_laamps.0410.c: "Chết tiệt!"

  ep3_laamps.0411.t: "$seize_realm$: Vương miện thèm khát"
  ep3_laamps.0411.desc: "Một ngày tưởng chừng bình thường tại [target.GetCapitalLocation.GetBaronyNameExplicitly] bỗng chuyển hướng u ám. [target.Custom('ResidenceBuilding')|l] vang dội tiếng lính gác la hét và gia nhân thét lên khi chạy loạn khắp các hành lang.\n\nCuối cùng, một viên trung sĩ thở hổn hển giải thích rằng một nhóm côn đồ đã xâm nhập dưới danh nghĩa giả mạo và đang đánh thẳng vào phòng ngai vàng!\n\nQuân lính của ta nhanh chóng kiểm soát được tình hình, và tiếng giao tranh dần lắng xuống."
  ep3_laamps.0411.imprison: "[owner.GetFirstName], một kẻ vô danh không đất đai, bị lôi ra trước mặt ta, âm mưu dùng vũ lực cướp đoạt vương miện của [owner.GetHerHis] bị phơi bày hoàn toàn."
  ep3_laamps.0411.death: "Xác của [owner.GetFirstName], một kẻ vô danh không đất đai, bị lôi ra trước mặt ta, âm mưu dùng vũ lực cướp đoạt vương miện của [owner.GetHerHis] đã hoàn toàn thất bại."
  ep3_laamps.0411.outro: "Ta được báo rằng [owner.GetFirstName], một kẻ vô danh không đất đai, là kẻ cầm đầu cuộc tấn công nhằm cướp đoạt vương miện của ta. Tên hèn đó đã cao chạy xa bay."
  ep3_laamps.0411.a: "Ngươi sẽ phải #EMP trả giá#! cho chuyện này."
  ep3_laamps.0411.b: "[owner.GetSheHe|U] đã học được cái kết dành cho kẻ tiếm quyền!"
  ep3_laamps.0411.c: "Khốn kiếp cái thứ [owner.Custom2('InsultNoun', ROOT.Char)] đó!"

  refill_maa_interaction: "Bổ sung Quân chính quy"
  refill_maa_interaction_desc: "[adventurers|E] không có nguồn nhân lực ổn định như các [rulers|E] có [landed|E], vì vậy phải [reinforce_soldiers|E] để lấp đầy các [regiments|E] [men_at_arms|E] và bù đắp tổn thất."
  reinforce_soldiers_interaction: "Vét sạch mọi nguồn lực"
  reinforce_soldiers_interaction_desc: "Đôi khi Ngài đơn giản là không còn đủ [provisions|E] hay [gold|E] để [reinforce_soldiers|E] các [regiments|E] [men_at_arms|E] của mình."
  reinforce_soldiers_option_provisions: "[provisions_i]Tuyển quân bằng Lương thực"
  reinforce_soldiers_option_provisions_desc: "Trang bị cho những kẻ bị ruồng bỏ và người khát khao vinh quang quần áo, vũ khí, áo giáp, khẩu phần ăn và lều trại để đổi lấy sự phục vụ trong hàng ngũ của Ngài."
  refill_maa_provisions_tt: "[men_at_arms|E] [regiments|E] nhận được [THIS.Char.MakeScope.ScriptValue('replenishable_troops_max_provisions_tt_value')|0P] [soldiers|E]\n#alert_trial $BULLET_WITH_TAB$Không đủ Lương thực, các đơn vị sẽ chỉ được bổ sung một phần!#!"
  refill_maa_provisions_full_tt: "[men_at_arms|E] [regiments|E] nhận được [THIS.Char.MakeScope.ScriptValue('replenishable_troops_max_provisions_tt_value')|0P] [soldiers|E]$refill_maa_regiments_fully_reinforced_tt$"
  refill_maa_regiments_fully_reinforced_tt: "\n#P #EMP $BULLET_WITH_TAB$Các đơn vị sẽ được bổ sung đầy đủ!#!#!"
  refill_maa_provision_cost_tt: "Mất [provisions_i][THIS.Char.MakeScope.ScriptValue('replenishable_troops_payed_provisions_tt_value')|0N]"
  refill_maa_gold_tt: "[men_at_arms|E] [regiments|E] nhận được [THIS.Char.MakeScope.ScriptValue('replenishable_troops_max_gold_tt_value')|0P] [soldiers|E]\n#alert_trial $BULLET_WITH_TAB$Không đủ Vàng, các đơn vị sẽ chỉ được bổ sung một phần!#!"
  refill_maa_gold_full_tt: "[men_at_arms|E] [regiments|E] nhận được [THIS.Char.MakeScope.ScriptValue('replenishable_troops_max_gold_tt_value')|0P] [soldiers|E]$refill_maa_regiments_fully_reinforced_tt$"
  refill_maa_gold_cost_tt: "Mất [gold_i][THIS.Char.MakeScope.ScriptValue('replenishable_troops_payed_gold_tt_value')|0N]"
  reinforce_soldiers_option_gold: "[gold_i]Tuyển quân bằng Vàng"
  reinforce_soldiers_option_gold_desc: "Luôn có những kẻ tuyệt vọng sẵn sàng bước vào đời phiêu lưu — tất nhiên là với đãi ngộ xứng đáng."
  reinforce_soldiers_option_prestige: "Kêu gọi Tình nguyện viên"
  reinforce_soldiers_option_prestige_desc: "Chiến binh bộ lạc là nguồn chiến lực hữu ích, nếu có thể thuyết phục được họ."
  reinforce_soldiers_option_piety: "Tuyển mộ Cuồng tín"
  reinforce_soldiers_option_piety_desc: "Các cộng đồng tôn giáo nuôi dưỡng nhiều tâm hồn phiêu lưu, sẵn sàng chiến đấu vì đức tin."
  reinforce_soldiers_option_skill: "Truyền cảm hứng cho Thuộc hạ"
  reinforce_soldiers_option_skill_desc: "Khi mọi cách khác đều thất bại, sức hút và tài năng cá nhân vẫn có thể thu hút nhiều chiến binh trung thành."
  reinforce_soldiers_option_dread: "Gây ấn tượng với Lính đánh thuê"
  reinforce_soldiers_option_dread_desc: "Những chiến binh chuyên nghiệp, dày dạn là tân binh tốt nhất, nhưng sẽ không phục vụ một kẻ vô danh."
  reinforce_soldiers_any_regiment_tt: "Ngài phải có ít nhất một [regiment|E] [men_at_arms|E]"
  reinforce_soldiers_unfull_regiment_tt: "Một [regiment|E] [men_at_arms|E] phải chưa đủ quân số"
  reinforce_soldiers_option_gold_tt: "[camp|E] của Ngài KHÔNG được ở trong [county|E] dưới [government|E] [GetGovernment('tribal_government').GetName]"
  reinforce_soldiers_option_prestige_tt: "[camp|E] của Ngài phải ở trong [county|E] dưới [government|E] [GetGovernment('tribal_government').GetName]"
  reinforce_soldiers_option_piety_tt: "[camp|E] của Ngài phải ở trong [county|E] theo [faith|E] của Ngài dưới [government|E] [GetGovernment('theocracy_government').GetName], hoặc có [lease|E] của [holy_order|E] cùng [faith|E]"
  reinforce_soldiers_option_dread_tt: "Ngài phải có ít nhất [THIS.Char.MakeScope.ScriptValue('reinforce_soldiers_dread_cost_value')|0V] [dread|E]"
  reinforce_soldiers_effect_tt: "Mỗi [regiment|E] [men_at_arms|E] hợp lệ nhận tối đa [THIS.Char.MakeScope.ScriptValue('reinforce_soldiers_regiment_max_value_tooltip')|0V] [soldiers|E]"
  refill_maa_effect_tt: "Mỗi [regiment|E] [men_at_arms|E] hợp lệ nhận tối đa [THIS.Char.MakeScope.ScriptValue('replenishable_troops_value')|0V] [soldiers|E]"
  reinforce_soldiers_skill_success: "Thuộc hạ được truyền cảm hứng"
  reinforce_soldiers_skill_failure: "Không được truyền cảm hứng"

  hire_laamp_mercenaries_interaction: "Thuê làm Lính đánh thuê"
  hire_laamp_mercenaries_interaction_desc: "Đề nghị [gold|E] để [recipient.GetName] tham gia mọi [wars|E] mà Ngài là [war_leader|E]"
  hire_laamp_mercenaries_interaction_notification: "Sẽ là vinh dự nếu ngài đứng cùng phe ta trong các cuộc chiến!"
