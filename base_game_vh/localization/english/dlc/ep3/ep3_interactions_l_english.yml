  seize_realm: "Chiếm đoạt Lãnh địa"
  seize_realm_action: "Chiếm đoạt lãnh địa từ"
  seize_realm_desc: "Cố gắng chiếm đoạt [SCHEME.GetTargetCharacter.GetShortUINamePossessiveNoTooltip] [domain|E] cùng với một số [vassals|E] của [SCHEME.GetTargetCharacter.GetHerHis]\n$seize_realm_warning$\n@warning_icon! #X Thất bại trong [scheme|E] này sẽ dẫn đến #bold hậu quả thảm khốc!#!"
  seize_realm_desc_general: "Một [scheme|E] Thù địch cho phép một [adventurer|E] chiếm đoạt [realm|E] của một [ruler|E] có [landed|E].\n\n$seize_realm_warning$"
  seize_realm_warning: "@alert_icon! #M Nếu thành công, các [vassals|E] của Lãnh địa có thể trở nên [independent|E] tùy theo mối quan hệ của họ với [ruler|E] cũ, sự khác biệt về [culture|E], [faith|E], và [opinion|E] đối với Kẻ Phiêu lưu, quy mô Tiểu lãnh địa, Sức mạnh Quân sự, khoảng cách tới [capital|E], và các yếu tố khác#!"
