  seize_realm_valid_government_tt: "[THIS.Char.GetShortUIName|U] phải có [government|E] [GetGovernment('feudal_government').GetName], [GetGovernment('japan_feudal_government').GetName], [GetGovernment('clan_government').GetName], [GetGovernment('mandala_government').GetName], [GetGovernment('wanua_government').GetName], hoặc [GetGovernment('tribal_government').GetName]"
