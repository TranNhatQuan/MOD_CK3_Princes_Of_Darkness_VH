  family_castration_fled_memory_desc_second_perspective: "ngươi đã bỏ trốn khỏi nhà sau khi [owner.Custom2('RelationToMe', SCOPE.sC('castrator'))], [castrator.GetTitledFirstName], tìm cách thiến ngươi"
