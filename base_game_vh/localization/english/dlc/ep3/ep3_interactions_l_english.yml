  ep3_interactions_events.0031.t: "Trốn chạy trước lưỡi dao"
  ep3_interactions_events.0031.desc: "Trong phòng của [recipient.GetFirstNamePossessive], quần áo và đồ đạc vương vãi khắp sàn, còn cậu bé thì biến mất. Thuộc hạ của ta lục soát khắp phố phường, nhưng chẳng thấy đâu [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))] của ta!\n\nTên nhóc ngu ngốc, chẳng coi trọng quyền uy của ta hay những #EMP tập tục#! của chúng ta, đã bỏ chạy ngay khi nghe phong thanh ý định của ta.\n\nTrong toàn bộ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], [recipient.GetFirstName] có thể đang trốn ở đâu? Một con hẻm tối nào đó chăng, ôm khư khư thứ quý giá của mình... phần thưởng được bảo vệ kỹ lưỡng đã khiến nó phải lưu vong."

  ep3_interactions_events.0031.a: "Ta sẽ cắt bi thằng nhóc đó! #EMP TÌM NÓ!#!"
  ep3_interactions_events.0031.a_success: "[recipient.GetFirstNameNoTooltip] bị tìm thấy và bị thiến"
  ep3_interactions_events.0031.a_failure: "[recipient.GetFirstNameNoTooltip] trốn thoát khỏi cuộc truy lùng"
