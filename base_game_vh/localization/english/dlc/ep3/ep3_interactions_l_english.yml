  ep3_interactions_events.0600.desc: "Nỗ lực của ta nhằm giành quyền cai trị [ROOT.Char.GetPrimaryTitle.GetNameNoTier] đã gặt hái thành quả lớn. Giờ đây, với tư cách là [ROOT.Char.GetTitleAsName], ta được bao quanh bởi những cố vấn, quan chức và kẻ giám sát mới... những kẻ không ngừng thúc giục ta tưởng thưởng hậu hĩnh cho bằng hữu và ân nhân.\n\n[supporter.GetName] — dù không thuộc [ROOT.Char.GetHouse.GetName] — đã nhiệt thành ủng hộ ứng cử của ta và là chủ nợ chính trị lớn nhất của ta. Phớt lờ sự hào hiệp của [supporter.GetHerHis] chẳng khác nào một sự sỉ nhục."
  ep3_interactions_events.0600.a: "Chúng ta luôn phải nâng đỡ lẫn nhau."
  ep3_interactions_events.0600.a.success: "Một mối quan hệ cùng có lợi được hình thành"
  ep3_interactions_events.0600.a.fail: "Ngươi không còn được ta nợ ân huệ nào nữa"
  ep3_interactions_events.0600.b: "Ta chẳng nợ gì tên #EMP cho vay nặng lãi#! đó ngoài sự khinh miệt!"
  ep3_interactions_events.0600.b.flavor: "Ta hoàn toàn, #EMP hoàn toàn#!, là [ROOT.Char.GetWomanMan] tự lập — khiển trách kẻ cơ hội này sẽ chứng minh điều đó cho tất cả!"
  ep3_interactions_events.0600.c: "Người biện hộ vĩ đại của ta xứng đáng với lòng trung thành vô hạn!"
  ep3_interactions_events.0600.c.flavor: "Ta sẵn sàng tận tâm phục vụ [supporter.GetHerHim], bằng mọi cách có thể."
  ep3_interactions_events.0600.d: "Một món quà càng ngày càng giá trị: tình  Bạn củata."
  ep3_interactions_events.0600.e: "Gửi cho [supporter.GetWomanMan] một thứ gì đó lấp lánh."
  ep3_interactions_events.0600.f: "Ai cơ?"

  ep3_interactions_events.0601.opening: "[new_landed_admin.Custom2('RelationToMeShort', SCOPE.sC('supporter'))] và người biện hộ của ta,"
  ep3_interactions_events.0601.desc: "Có người nói rằng, nếu không có sự ủng hộ nhiệt thành của ngươi, quyền cai trị [new_landed_admin.GetPrimaryTitle.GetNameNoTier] đã không bao giờ thuộc về ta.\n\n"
  ep3_interactions_events.0601.desc_repay: "Họ nói đúng."
  ep3_interactions_events.0601.desc_scorn: "Ta không chắc lắm."
  ep3_interactions_events.0601.desc_ally: "Vậy thì, hãy để sự biện hộ của ngươi trở thành hành động đầu tiên trong mối quan hệ hợp tác lâu dài và màu mỡ của chúng ta! Ngươi cũng mong muốn sự hỗ trợ lẫn nhau, đúng không?"
  ep3_interactions_events.0601.desc_insult: "Hay là, ta tự hỏi, sự thăng tiến của ta thực chất được sắp đặt bởi một gã dân đồi thất học hay một đứa trẻ ngu dốt nào đó? Ta tin rằng mình đã nghe thấy những tiếng [supporter.Custom2('InsultAdjective', ROOT.Char)] lảm nhảm như thế."
  ep3_interactions_events.0601.desc_hook: "Ta mắc ngươi một món nợ lớn, và vì thế ta sẽ tận tụy phục vụ với tư cách là [new_landed_admin.GetWomanMan] trung thành của ngươi."
  ep3_interactions_events.0601.desc_friendship: "Khi ta ổn định vị thế trong [new_landed_admin.GetPrimaryTitle.GetTierAsNameNoTooltip] này, ta xin dâng tặng một món quà ngày càng giá trị: tình  Bạn củata."
  ep3_interactions_events.0601.desc_gift: "Mong rằng món quà này, theo cách nào đó, sẽ đền đáp món nợ của ta với ngươi. Và cầu mong [new_landed_admin.GetFaith.WealthGodName] phù hộ cho ngươi."
  ep3_interactions_events.0601.desc_ignore: "Ta đã #EMP rất vất vả#! để đạt được vị trí này, giành lấy nó bằng mồ hôi và năng lực của mình, và ta cảm thấy... khá bị xúc phạm trước những ám chỉ ngược lại."

  ep3_interactions_events.0601.a_repaid: "Một chức vị xứng đáng cho một [new_landed_admin.GetWomanMan] xứng đáng!"
  ep3_interactions_events.0601.a_scorned: "Chính trị không phải trò chơi kiểu này đâu, #EMP đồ vô ơn#!"
  ep3_interactions_events.0601.b: "Ta là ân chủ! Là người bảo trợ! Không phải đối tác ngang hàng của [new_landed_admin.GetHerHis]."

