  ep3_interactions_events.0810.desc: "Giờ ta đã thấy rõ mình đã chọn sai phe trong cuộc chiến này. Chỉ mong rằng ta chưa đổi hướng quá muộn.\n\nCầu cho quân đội của chúng ta chiến thắng trước [secondary_recipient.GetTitledFirstName]!"
  ep3_interactions_events.0810.a: "Tuyệt vời."
  ep3_interactions_events.0811.desc: "Ta không phải kẻ phản trắc đổi phe! Chúng ta đã tự dọn giường cho mình, thì phải nằm lên đó.\n\nHãy khuất phục trước [secondary_recipient.GetTitledFirstName], trước khi quá muộn..."
