  ep3_interactions_events.0030.t: "Quả Ngọt Từ Cây Gia Tộc [actor.GetHouse.GetNameNoTooltip]"

  ep3_interactions_events.0030.desc.intro: "Khi ta ôm chặt [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))] của mình là [recipient.GetFirstName], cậu run rẩy.\n\n\"Hãy nghĩ đến tương lai của con,\""
  ep3_interactions_events.0030.desc.child_address: "nhiếp chính của ta nói"
  ep3_interactions_events.0030.desc.normal_address: "ta thì thầm,"
  ep3_interactions_events.0030.desc.greek: "\"với tư cách một [Glossary( 'vestes', 'VESTES_GLOSS')], một [Glossary( 'patrikios', 'PATRIKIOS_GLOSS')] — thậm chí có thể là [Glossary( 'parakoimomenos', 'PARAKOIMOMENOS_GLOSS')] của hoàng đế! Khi con thoát khỏi những ham muốn và khát vọng của tuổi nam nhi, con sẽ được tin cậy biết bao! [recipient.GetFirstNameNoTooltip], con sẽ khiến gia đình mình vô cùng tự hào.\"\n\n"
  ep3_interactions_events.0030.desc.non_greek: "\"với tư cách một đại quản gia, một quan tổng quản — thậm chí là một nhiếp chính quyền lực! Khi con thoát khỏi những ham muốn và khát vọng của tuổi nam nhi, con sẽ được tin cậy biết bao! [recipient.GetFirstNameNoTooltip], con sẽ khiến gia đình mình vô cùng tự hào.\"\n\n"
  ep3_interactions_events.0030.desc.accepted_child: "Cậu bé nhìn vào mắt ta, yếu ớt, đẫm lệ, nhưng chan chứa yêu thương.\n\n"
  ep3_interactions_events.0030.desc.accepted_youth: "Nghiến răng, nhắm chặt đôi mắt ngấn lệ, chàng thiếu niên khẽ gật đầu một cái.\n\n"
  ep3_interactions_events.0030.desc.child_resents_castration: "Những lời này vô nghĩa. Cậu bé hoảng loạn hét lên, tuyệt vọng cố bò ra xa.\n\n"
  ep3_interactions_events.0030.desc.resents_castration: "Lời nói của ta vô nghĩa. Cậu bé hoảng loạn hét lên, tuyệt vọng cố bò ra xa.\n\n"
  ep3_interactions_events.0030.desc: "Sau lưng chúng ta, ngự y đang mài sắc lưỡi dao cạo."

  VESTES_GLOSS: "Một tước vị cung đình Byzantium danh giá, liên quan đến y phục hoàng gia, có thể ban cho cả người để râu lẫn thái giám."
  PATRIKIOS_GLOSS: "Tước hiệu #bold patrikios#! — quý tộc — vẫn được sử dụng trong thời Byzantine để ban vinh dự cho người mang nó."
  PARAKOIMOMENOS_GLOSS: "\"Người ngủ cạnh phòng Hoàng đế\", #bold parakoimomenos#! là một đại thần hoàng gia có ảnh hưởng rất lớn và luôn là thái giám."

  ep3_interactions_events.0030_callous: "Một phần hạt giống bị mất đi, nhưng những cành trĩu quả vẫn còn..."
  ep3_interactions_events.0030_kind: "Một đời phụng sự bắt đầu từ đây."

  family_castration_memory: "Bị người thân thiến"
  family_castration_memory_desc: "Ta bị biến thành thái giám theo lệnh của [owner.Custom2('RelationToMe', SCOPE.sC('castrator'))], [castrator.GetTitledFirstName]"
  family_castration_memory_desc_second_perspective: "ngươi bị biến thành thái giám theo lệnh của [owner.Custom2('RelationToMe', SCOPE.sC('castrator'))], [castrator.GetTitledFirstName]"
  family_castration_memory_desc_third_perspective: "[owner.GetTitledFirstName] bị biến thành thái giám theo lệnh của [owner.GetHerHis] [owner.Custom2('RelationToMe', SCOPE.sC('castrator'))], [castrator.GetTitledFirstName]"

