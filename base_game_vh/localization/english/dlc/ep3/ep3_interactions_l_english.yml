  JOIN_FACTION_WAR_NOTIFICATION_TEXT: "Đã đến lúc dạy cho [secondary_recipient.GetShortUIName] một bài học! Ngươi có muốn tham gia vào cuộc đấu tranh chính nghĩa của chúng ta không?"
  ep3_interactions_events.0800.desc: "Chính nghĩa thuộc về các ngươi! Chúng ta sẽ cùng nhau dạy cho [secondary_recipient.GetTitledFirstName] một bài học!\n\nLực lượng của ta đang tập hợp và sẽ sớm sẵn sàng tham gia chiến dịch cùng các ngươi."
  ep3_interactions_events.0800.a: "Tuyệt vời."
  ep3_interactions_events.0801.desc: "E rằng ta không thể giúp ích cho sự nghiệp vô vọng của ngươi.\n\nCầu xin [recipient.GetFaith.HighGodName], và cả [secondary_recipient.GetTitledFirstName], hãy tỏ lòng khoan dung!"
