  HOF_INTERACTION_STATE_FAITH: "[faith|E] của Ngài không phải là [state_faith|E] của [realm|E]"
  HOF_INTERACTION_HAS_HOUSE_MODIFIER: "Gia tộc của Ngài đã có [GetModifier('ep3_requested_faith_support_modifier').GetName]"
  HOF_INTERACTION_IS_HOUSE_HEAD: "Ngài không phải là [house_head|E]"
  requested_faith_support_domicile_tt: "#weak Lượng [influence|E] nhận được tăng nhờ một [domicile_building|E]#!"
  ep3_hof_ask_for_influence_interaction: "Xin Ảnh hưởng Giáo sĩ"
  ep3_requested_faith_support_modifier: "Đặc vụ Chính trị Giáo hội"
  ep3_requested_faith_support_modifier_desc: "Nhiều sinh vật chính trị khoác áo thánh; nhiều kẻ là những người công khai rao giảng cho lợi ích của gia tộc này."
  HOF_OPINION_OF_EMPEROR: "Ý kiến của [recipient.GetShortUINamePossessive] về [top_liege|E] của ngươi: $VALUE|=+0$"
  I_AM_INFLUENTIAL: "[influence_level|E] của Ngài: $VALUE|=+0$"
  ep3_interactions_events.0620.opening: "Nhiệt thành, [actor.GetFirstName],"
  ep3_interactions_events.0620.desc_byz: "Trong Giáo hội của Người, Chúa của chúng ta đã đặt các tông đồ, thầy dạy, người làm phép lạ, những kẻ được ban ân huệ trị quốc... cùng sự đa dạng về ngôn ngữ.\n\nNhững tiếng nói thánh thiện ấy sẽ cất lời ủng hộ gia tộc [actor.GetHouse.GetName]."
  ep3_interactions_events.0620.desc: "Có những cách dời non lấp biển vượt ngoài sức mạnh thế tục, và những con đường dẫn đến quyền lực vượt xa sự thô tục trần gian.\n\nVì sự cứu rỗi vĩnh cửu, hãy hướng về [recipient.GetFaith.HighGodName]. Còn cho sự che chở nơi trần thế, gia tộc của ngài có thể dựa vào sự hậu thuẫn của các giáo sĩ [recipient.GetFaith.GetAdjective] của chúng ta."
  ep3_hof_ask_for_influence_interaction_desc: "Yêu cầu [recipient.GetShortUIName] hỗ trợ chính trị, tiêu tốn [piety|E] để nhận [influence|E] cho Ngài và [house|E] của Ngài"

  ep3_interactions_events.0620.a: "Cùng nhau, vì một chính nghĩa!"
  ep3_interactions_events.0620.b: "#EMP [recipient.GetFaith.PriestNeuterPlural|U]!#! Không ai làm chính trị giỏi hơn họ."
  ep3_interactions_events.0620.c: "Có vẻ như lời cầu nguyện của ta sắp được đáp lại."

  ep3_interactions_events.0621.opening: "Hỡi đứa con bại hoại,"
  ep3_interactions_events.0621.desc: "Ngươi lại dám yêu cầu những kẻ vốn phải dốc lòng cho sự cứu rỗi, có bổn phận chăn dắt và giảng dạy, can dự vào chuyện trần tục vì lợi ích của ngươi sao?\n\nThật là sự trơ trẽn đáng xấu hổ!"
  ep3_interactions_events.0621.a: "Hừ! Như thể bàn tay đạo hạnh của ngươi trong sạch lắm vậy!"

  depose_governor_lose_titles_tt: "@warning_icon! #X Ngài mất [recipient.GetPrimaryTitle.GetName] và toàn bộ [titles|E] có đất khác#!"

  ep3_interactions_events.0630.opening: "[recipient.GetTitleAsName] của ta tại [recipient.GetPrimaryTitle.GetNameNoTier],"
  ep3_interactions_events.0630.desc_family: "Ta đã ra lệnh bãi nhiệm ngươi. Đối với chúng ta — những hậu duệ của gia tộc [actor.GetHouse.GetName] — việc ngươi tiếp tục cai trị [recipient.GetPrimaryTitle.GetNameNoTooltip] không còn mang lại lợi ích.\n\nHãy nghĩ đến bổn phận với huyết tộc và trao lại quyền trượng chức vụ mà không oán hận. Gia đình ngươi đang chờ tại [actor.GetCapitalLocation.GetTitle.GetNameNoTier]."
  ep3_interactions_events.0630.desc_spite: "Theo luật pháp của [actor.GetPrimaryTitle.GetTierAsName] vĩ đại, quyền cai trị chỉ được ban bởi ý chí của ta — và cũng bị tước đoạt theo ý chí đó.\n\nNgươi sẽ — ngay lập tức — rời khỏi chức vụ tại [recipient.GetPrimaryTitle.GetNameNoTooltip]. Trao trả mọi quyền lực. Quên đi con người cũ của ngươi.\n\nĐó là mệnh lệnh của [actor.GetTitleAsName] khoan dung và minh triết."
  ep3_interactions_events.0630.desc_guilt: "Với nỗi day dứt nghẹn ngào, ta buộc phải ra lệnh ngươi từ nhiệm. Ngươi đã phục vụ [actor.GetPrimaryTitle.GetTierAsName] một cách tận tụy, nhưng việc tiếp tục làm vậy từ trụ sở của [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] nay đã không còn khả thi.\n\nHãy tin rằng đây là ý chỉ của [recipient.GetFaith.HighGodName], cũng như là mệnh lệnh của [actor.GetTitleAsName] của ngươi."
  ep3_interactions_events.0630.desc: "Với sự đồng thuận của toàn thể triều đình, ta chính thức chấm dứt nhiệm kỳ của ngươi với tư cách [recipient.GetTitleAsNameNoTooltip]. Mọi tước vị ngươi nắm giữ, cùng nguồn thu và vinh dự của chức vụ, đều phải được giao nộp.\n\nVì mọi cống hiến của ngươi cho [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] và [actor.GetPrimaryTitle.GetTierAsName], thần dân và quân chủ đều bày tỏ lòng biết ơn."

  ep3_interactions_events.0630.a: "#EMP Ta bị cướp đoạt! Ta bị làm nhục!#!"
  ep3_interactions_events.0630.b: "Được bổ nhiệm — rồi lại bị bãi miễn."
  ep3_interactions_events.0630.c: "Trong [actor.GetPrimaryTitle.GetTierAsNameNoTooltip], bánh xe số mệnh không ngừng xoay chuyển..."
 
  support_candidacy_cap_reached_tt: "Ngươi đã đạt đến [investment_cap|E] ([actor.MakeScope.ScriptValue('appointment_investment_cap')|0V]) cho ứng cử viên [secondary_recipient.GetShortUINamePossessive] cho [title|E] này ([target.GetNameNoTier|V])"

 #Force to Step Down
  force_step_down_interaction: "Ép Từ Chức"
  force_step_down_desc: "Tận dụng [influence|E], một [hook|E], hoặc một [secret|E] để buộc [TARGET_CHARACTER.GetShortUIName] từ chức [governorship|E] của [TARGET_CHARACTER.GetHerHis]."
  FORCE_STEP_DOWN_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName] sẽ từ chức [governorship|E] của [TARGET_CHARACTER.GetHerHis] và bị thay thế."
  FORCE_STEP_DOWN_PROPOSAL: "Đã đến lúc ngươi phải rời khỏi chức vụ [target.GetBaseName]. Ngươi hoàn toàn không xứng đáng với vị trí này, và ta sẽ đảm bảo ngươi không còn cai trị nơi đó nữa."
  loses_target_title_tt: "Từ chức khỏi mọi [governorships|E] đang nắm giữ"
  attempted_force_step_down_opinion: "Muốn Ta Từ Chức"
  force_step_down_interaction_extra_icon: "$hook_extra_icon$"

  scheme_critical_moments.1162.t: "$scheme_critical_moments.1132.t$"
  scheme_critical_moments.1162.desc: "Kết quả của hàng tháng trời mưu mô tỉ mỉ cuối cùng đã lộ diện khi [target.GetTitledFirstName] từ bỏ vị trí Thống đốc [highest_title.GetName] của [target.GetHerHis].\n\nNhững lời đồn thổi khéo léo và bằng chứng được sắp đặt thuận tiện đã làm hoen ố danh tiếng của [target.GetHerHis] không thể cứu vãn, và [target.GetSheHe] không còn lựa chọn nào khác ngoài việc tự nguyện từ chức."
  scheme_critical_moments.1162.desc_discovered: "\n\nAi cũng rõ rằng chỉ có ta mới đủ quyền lực và ảnh hưởng để làm được điều này, nhưng [target.GetSheHe] chẳng ở vị thế nào để phản kháng."
  scheme_critical_moments.1162.desc_secret: "\n\nTất nhiên, một cú đẩy mạnh mẽ như vậy không thể đến từ ai khác ngoài ta, tuy nhiên [target.GetTitledFirstNameNoTooltip] không có bằng chứng nào cho những nghi ngờ của [target.GetHerHis]."
  scheme_critical_moments.1162.a: "Xong rồi."
  scheme_critical_moments.1162.tt: "[target.GetShortUIName] đã từ chức Tổng trấn của [highest_title.GetName] và nhường chỗ cho [new_governor.GetShortUIName]"
  scheme_critical_moments.1163.t: "$scheme_critical_moments.1133.t$"
  scheme_critical_moments.1163.desc: "Bất chấp nỗ lực gieo rắc nghi ngờ thông qua những lời đồn thổi được sắp đặt cẩn thận và bằng chứng giả mạo, sức hút và những người ủng hộ trung thành của [target.GetTitledFirstNamePossessive] đã che chở cho [target.GetHerHim] khỏi bất kỳ cơn bão nào sắp ập đến."
  scheme_critical_moments.1163.desc_discovered: "\n\nNgoài ra, [target.GetSheHe] đã biết rất rõ rằng toàn bộ âm mưu này xuất phát từ ta."
  scheme_critical_moments.1163.desc_secret: "\n\n[target.GetSheHe|U] vẫn đứng vững, danh tiếng của [target.GetHerHis] vẫn nguyên vẹn, dường như không hề hay biết về âm mưu tìm cách hạ bệ [target.GetHerHim]."
  scheme_critical_moments.1163.tt: "[scheme.GetName] Bị Phát Hiện"
  scheme_critical_moments.1163.tt.desc: "[scheme.GetOwner.GetShortUIName] đã cố Ép Ngài Từ Chức, nhưng thất bại!"
  scheme_critical_moments.1163.a: "Phải có cách khác."
  scheme_critical_moments.1164.t: "Bị Ép Từ Chức"
  scheme_critical_moments.1164.desc: "Những lời thì thầm nghi kỵ, ám chỉ đủ loại sai phạm, tham nhũng, thậm chí phản quốc của ta đã len lỏi khắp triều đình suốt nhiều tháng, phủ bóng đen lên danh tiếng của ta với tư cách Tổng trấn.\n\nThật đau đớn khi phải thừa nhận, nhưng họ đã thành công. Trước những bằng chứng nặng nề và đầy tổn hại xuất hiện chống lại ta — dù rõ ràng là giả tạo — ta buộc phải từ bỏ vai trò công vụ của mình."
  scheme_critical_moments.1164.desc_discovered: "\n\nTa biết không ai khác ngoài [owner.GetTitledFirstName] đứng sau sự sụp đổ này. Có thể chưa phải hôm nay, nhưng ta thề sẽ có ngày trả thù."
  scheme_critical_moments.1164.desc_secret: "\n\nKhông nhiều người có thể thao túng dư luận mạnh mẽ đến vậy, nên ta có những nghi ngờ về kẻ chủ mưu, nhưng không có bằng chứng nào để chứng thực."
  scheme_critical_moments.1164.a: "Ta sẽ quay lại."
 
  scheme_interaction_tt_force_step_down_approved: "Cố gắng ép [recipient.GetShortUINameNoTooltip] từ chức khỏi một [governorship|E]"

