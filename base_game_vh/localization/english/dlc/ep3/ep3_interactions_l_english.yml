  ep3_interactions_events.0610.t: "Một Mái Nhà cho Nhà [ROOT.Char.GetHouse.GetNameNoTooltip]"
  ep3_interactions_events.0610.desc: "[emperor.GetPrimaryTitle.GetName|U]. Nơi các quan lại cặm cụi viết ra những điều luật khô khan đến tê dại, nơi những đôi môi son thì thầm giữa vẻ huy hoàng cung điện... và nơi ta đã mua được một điền trang khang trang.\n\n"
  ep3_interactions_events.0610.desc_emperor: "Nhờ ân huệ của [emperor.GetTitledFirstNameRegnal] [emperor.GetHerselfHimself], ta được ban cho một chốn dung thân tại đây, nép mình giữa sự ồn ào của đại đô [emperor.GetCapitalLocation.GetTitle.GetNameNoTier]."
  ep3_interactions_events.0610.desc_governor: "Sự vận động của [recipient.GetNamePossessive] mở cho ta cánh cửa bước vào thế giới chính trị của [recipient.GetHerHis], khiến ta được chào đón tại tỉnh lỵ [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] của [recipient.GetHerHis]."
  ep3_interactions_events.0610.desc_conversion: "Và, theo ý muốn của [recipient.GetHerHis], ta đã được xức dầu và trở thành một [ROOT.Char.GetFaith.GetAdherentName] mới."
  ep3_interactions_events.0610.desc_emperor_outro: "\n\nVị quân chủ mới của ta, người nắm quyền định đoạt mọi vinh dự và bổ nhiệm trong toàn bộ [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip] của [emperor.GetHerHis], hẳn sẽ không quên rằng ta — cư dân mới nhất của kinh đô — nay là kẻ thuộc về [emperor.GetHerHis]."
  ep3_interactions_events.0610.desc_non_governor_outro: "\n\nVì thế, đúng là ta mang ơn [recipient.GetTitledFirstNameNoTooltip]... nhưng chính trước [emperor.GetFirstNameRegnal] ta sẽ cúi mình khúm núm, bởi bộ máy cai trị của [emperor.GetTitleAsNamePossessiveNoTooltip] mới là kẻ nắm quyền tối thượng."

  ep3_interactions_events.0610.a: "Ta không phải một [ROOT.Char.GetLadyLord] có đất đai... nhưng những triển vọng mới đã mở ra."

  ep3_administrative_outsider_modifier: "Kẻ Ngoại Đạo Hành Chính"
  ep3_administrative_outsider_modifier_desc: "Nhân vật này đã luồn lách để chen chân vào các hành lang quyền lực hành chính, nơi họ bị đối xử bằng sự thù địch và ngờ vực."

  ep3_interactions_events.0611.opening: "Lữ khách cao quý,"
  ep3_interactions_events.0611.desc: "Ta buộc phải từ chối yêu cầu của ngươi. Ta e rằng cuộc sống tại [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] sẽ không phù hợp với ngươi... và những tinh tế trong bầu không khí chính trị của ta thì càng không.\n\nHãy gạt bỏ ý nghĩ về một văn phòng bụi bặm trong một điền trang yên ắng — ta khuyên ngươi nên trân trọng lớp bụi đường bám trên đôi ủng của mình."
  ep3_interactions_events.0611.a: "Cứ tận hưởng tiện nghi của ngươi đi, đồ rắn độc."

