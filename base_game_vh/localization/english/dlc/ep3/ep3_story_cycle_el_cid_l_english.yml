l_english:
  cid_loyalty_counter_positive: "Điều này sẽ #positive_value thể hiện#! [cid_loyalty|E] với [liege.GetTitleAsNameNoTooltip]"
  cid_loyalty_counter_very_positive: "Điều này sẽ #positive_value thể hiện mạnh mẽ#! [cid_loyalty|E] với [liege.GetTitleAsNameNoTooltip]"
  cid_loyalty_counter_negative: "Điều này sẽ #negative_value khiến#! [cid_loyalty|E] với [liege.GetTitleAsNameNoTooltip] bị nghi ngờ"
  cid_loyalty_counter_very_negative: "Điều này sẽ #negative_value khiến#! [cid_loyalty|E] với [liege.GetTitleAsNameNoTooltip] bị nghi ngờ nghiêm trọng"
  game_concept_cid_loyalty: "Lòng Trung Thành của Rodrigo"
  game_concept_cid_loyalty_desc: "Bằng việc giữ vững #V lòng trung thành#! với chúa thượng ngay cả khi bị lưu đày, El Cid có thể giành lại ân sủng của họ và khôi phục vị thế thuận lợi của mình.\n\nBằng cách trở nên #V bất trung#!, El Cid có thể mở khóa các lựa chọn đặc biệt để vươn lên như một lãnh chúa độc lập."
 
  cid.0001.t: "Theo Lệnh của [liege.GetTitleAsNameNoTooltip]"
  cid.0001.desc.intro: "Ta đặt chân lên bàn đạp, khẽ thúc đầu ngựa, và nhìn lại lần cuối nơi mà ta sẽ mãi gọi là quê hương.\n\nLưu đày. Lời của [liege.GetTitledFirstNamePossessive] không chừa chỗ cho sai sót.\n\n"
  cid.0001.desc.alfonso: "Ta đã trung thành theo anh trai của ngài, ta cũng sẽ theo ngài."
  cid.0001.desc.garcia_ordonez: "Ta từng đánh bại hắn, trong một trận chiến mà hắn không thể quên."
  cid.0001.desc.liege_hate: "Thất sủng trước [liege.GetTitleAsNamePossessiveNoTooltip]. Một chư hầu có thể tốt đến mức nào, nếu chúa thượng không yêu mến hắn?"
  cid.0001.desc.courtier: "Kẻ thù trong triều đã đầu độc tâm trí [liege.GetHerHis] của ngài. Những kẻ thù luôn tìm cách hãm hại ta, vì [liege.GetTitleAsNameNoTooltip|l] đã yêu quý ta quá đỗi."
  cid.0001.desc.outro: "\n\nMột con quạ bay bên phải chúng ta — điềm gở."
  cid.0001.a: "Ta sẽ mãi trung thành với ngài, thưa [liege.GetTitleAsNameNoTooltip]."
  cid.0001.a.flavor: "#EMP Và thế là vị Quán Quân trung nghĩa đã rời bỏ quê hương.#!"
  cid.0001.b: "Đành vậy. Những ai yêu mến ta sẽ theo ta."
  cid.0001.b.flavor: "#EMP Khi ấy Cid của ta hiểu rằng chẳng còn hy vọng nào vào ân sủng của [liege.GetTitleAsNameNoTooltip] [liege.GetFirstNameNoTooltip].#!"
  story_el_cid_tt: "#EMP Khúc Ca về El Cid#! bắt đầu"
 
  cid_exile_title: "Lưu đày:"
  cid.1000.t: "$cid_exile_title$ Cửa Đóng Then Cài"
  cid.1000.desc: "Đêm đen và lạnh lẽo. Ta sai một trong những thuộc hạ của mình gõ cửa căn nhà gần nhất, tìm kiếm một chủ nhà tử tế.\n\nKhông có câu trả lời ngay lập tức. Ta nghe thấy tiếng lầm bầm và tiếng bước chân cho đến khi một bóng người cuối cùng đứng ở lối vào.\n\n\"Đó là lệnh của [liege.GetTitleAsNameNoTooltip]; chúng tôi không dám chào đón ngài, thưa chúa công của tôi! Bức thư được niêm phong bằng con dấu hoàng gia của [liege.GetHerHis] đã ra lệnh cấm dân chúng [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] mở cửa, hay che chở cho ngài.\"\n\n[liege.GetTitledFirstName] không hề lãng phí thời gian."
  cid.1000.a: "Chúng ta sẽ không ép những người dân khốn khổ này."
  cid.1000.a.flavor: "#EMP Tài sản, nhà cửa, cả ánh mắt chúng ta — tất cả đều bị đặt cược.#!"
  cid.1000.b: "\"Mở cửa ra, nếu không sẽ bị phá!\""
  cid.1000.b.flavor: "#EMP Ít lợi cho ngươi, dù ta vì ngươi mà chuốc lấy diệt vong.#!"
  cid_opened_doors_modifier: "Cửa Bị Phá Mở"
  cid_opened_doors_modifier_desc: "Nhân vật này đã cưỡng ép dân làng mở cửa để tìm chỗ trú cho đoàn tùy tùng."
 
  cid.1010.t: "$cid_exile_title$ Không Vàng Không Bạc"
  cid.1010.desc: "Kẻ lưu đày khó mà là chủ nhân đáng tin cậy. Không có gì đảm bảo ta có thể trả công cho thuộc hạ, hay thậm chí nuôi sống họ. Ai dám đem sự an nguy của gia đình mình đặt cược cho một kẻ mất danh dự?\n\nNhững cuộc bàn tán trong trại diễn ra thẳng thắn hết mức có thể.\n\nTa ngẩng đầu lên và thấy [friend.GetTitledFirstName] tiến về phía ta, mang theo bánh mì và rượu do chính [friend.GetHerHis] mang đến:\n\n\"Campeador, sinh ra trong giờ lành, chúng ta phải lên đường, vì ta sẽ trả tiền cho những người này, và gánh lấy cơn thịnh nộ của [liege.GetTitledFirstName], bởi ta đã phục vụ ngài.\""
  cid.1010.a: "\"[cook.GetFirstNameNoTooltip], nấu #EMP bất cứ thứ gì#! ngươi tìm được.\""
  cid.1010.b: "\"Cảm ơn ngươi, người Bạn Thân yêu nhất của ta.\""
  cid.1010.b.flavor: "#EMP Nếu ta sống, ta sẽ đền đáp gấp đôi.#!"
  cid.1010.c: "\"Ta không thể mạo hiểm cơn thịnh nộ của [liege.GetTitleAsNamePossessiveNoTooltip].\""
  cid_1010_no_invite_var_desc: "Ngài đã trục xuất [recipient.GetHerHim]: $VALUE|=+0$"
 
  cid.1020.t: "$cid_exile_title$ Vĩnh Biệt, Người Thân Yêu"
  cid.1020.desc.intro: "[spouse.GetFirstName] quỳ xuống các bậc thang trước bàn thờ, cầu nguyện tha thiết với [spouse.GetFaith.HighGodName] để bảo vệ ta khỏi cái ác.\n\nTa ép [spouse.GetHerHis] vào tim mình, và [spouse.GetSheHe] hôn tay ta, [spouse.GetSheHe] trông như một người đang kiệt quệ vì đau buồn.\n\n\"Chỉ có [ROOT.Char.GetFaith.HighGodName] mới biết liệu chúng ta có gặp lại nhau không,\" ta nói, \"ngài sẽ an toàn hơn ở đây. Ta không thể để ngài phải trải qua những gì đang chờ đợi ở phía trước\""
  cid.0001.desc.children: " cho ta. Các con… hãy ngoan.\""
  cid.0001.desc.no_children: " cho ta.\""
  cid.1020.a: "\"[my_priest.GetFirstNameNoTooltip], có lẽ ngài có thể thay mặt chúng ta can thiệp?\""
  cid.1020.b: "\"Mong ngày chờ đợi sẽ ngắn ngủi.\""
  cid.1020.b.flavor: "#EMP Như khi móng tay bị giật khỏi thịt.#!"
  cid.1020.c: "\"Ta không thể rời bỏ nàng.\""
  cid.1020.c.flavor: ""
  cid_family_good_modifier: "Như Móng với Thịt"
  cid_family_good_modifier_desc: "Nhân vật này đã từ chối bỏ lại gia đình, bất chấp mệnh lệnh của chúa thượng."
 
  cid.1030.t: "$cid_exile_title$ Vì Tình Yêu dành cho [liege.GetTitleAsNameNoTooltip]"
  cid.1030.desc: "Vàng. Bạc. Châu báu. Hòm tiền của ta cuối cùng cũng đầy lên.\n\nNhẫn vàng, dây chuyền, cờ xí. [liege.GetTitledFirstName] hẳn không xa lạ gì với cảnh này.\n\nNhưng không phải tất cả đều là của ta. [liege.GetSheHe|U] vẫn là chúa thượng của ta, và vì thế một phần chiến lợi phẩm cũng thuộc về [liege.GetHerHis]."
  cid.1030.a: "[artifact.GetName] sẽ là một món quà xứng đáng."
  cid.1030.b: "Vàng thì chẳng bao giờ sai."
  cid.1030.c: "Hừ! Chính ta đã #EMP giành được#!!"
 
  cid.1040.t: "$cid_exile_title$ [ROOT.Char.GetFaith.HighGodName] Xin Thương Xót"
  cid.1040.desc: "Một số trái tim đã trở nên chai sạn và mất nhiều thời gian để nhớ lại cảm giác mềm yếu là thế nào.\n\nTa làm gì cũng chẳng quan trọng, trái tim của [liege.GetTitledFirstNamePossessive] đã quá xa tầm với của ta.\n\n\"[ROOT.Char.GetFaith.HighGodName],\" ta bắt đầu, quỳ xuống trước bàn thờ. Thuộc hạ của ta bao quanh ta, đầy tò mò. \"Cầu mong lòng tốt của ngài thay đổi trái tim của [liege.GetTitledFirstNamePossessiveNoTooltip] và khiến [liege.GetHerHim] nhớ lại tình yêu [liege.GetHerHis] dành cho ta.\""
  cid.1040.a: "Trại của chúng ta sẽ là tấm gương của lòng sùng đạo."
  cid.1040.b: "Xin hãy, [ROOT.Char.GetFaith.HighGodName], dẫn lối đưa [liege.GetHerHim] trở về với ánh sáng."
  cid.1040.c: "Mặc xác [liege.GetHerHim] xuống [ROOT.Char.GetFaith.NegativeAfterLife]."
  cid_own_prayer: "Thương Xót Chính Ta"
  cid_own_prayer_desc: "Nhân vật này quyết định dồn lời cầu nguyện cho chính mình."
  cid_1040_a_tt: "Tùy chọn này khả dụng nhờ $baggage_train_shrine_domicile_building$"
 
  cid_restoration_title: "Phục hồi:"
  cid.2000.t: "$cid_restoration_title$ Từ Khuỷu Tay Trở Xuống"
  cid.2000.desc.intro: "Trận chiến gầm thét quanh ta. Bóng chim bay trên đầu các đạo quân ngày càng dày đặc.\n\nKhông khó để nhận ra"
  cid.2000.desc.loser: "[loser.GetTitledFirstName], mang huy hiệu của [loser.GetHerHis] trên giáp ngực. \"Tiến lên,\" ta thúc ngựa và lao về phía [loser.GetHerHim]. Chỉ một trận tay đôi là đủ kết thúc tất cả.\n\nTừ thắt lưng trở xuống, xuyên qua mũ và áo giáp, ta chém đôi kẻ địch."
  cid.2000.desc.fallback: "kẻ địch, mang huy hiệu trên giáp ngực. \"Tiến lên,\" ta thúc ngựa và lao về phía hắn. Chỉ một trận tay đôi là đủ kết thúc tất cả.\n\nTừ thắt lưng trở xuống, xuyên qua mũ và áo giáp, ta chém đôi hắn."
  cid.2000.desc.outro: "Từ khuỷu tay trở xuống, máu nhỏ giọt."
  cid.2000.a: "Thanh kiếm này! Thật tuyệt mỹ!"
  cid.2000.a.flavor: "#EMP Đó là trận chiến, đó là ngày, khi ngài giành được thanh đại kiếm.#!"
  cid.2000.b: "Gửi sứ giả đến [liege.GetShortUIName]. Chiến lợi phẩm này thuộc về [liege.GetHerHis]."
  cid.2000.b.flavor: "#EMP Ta muốn gửi ngài đến [liege.GetTitledFirstNameNoTooltip], chúa công tự nhiên của ta, với một trăm con ngựa từ chiến lợi phẩm này, để ngài hôn tay [liege.GetHerHis] thay cho ta.\""
  cid_2000_liege_tt: "Nhận được [artifact|E] [newly_created_artifact.GetNameNoTooltip]"
 
  cid.2001.t: "$cid_restoration_title$ Từ Một Bậc Thầy Dũng Cảm"
  cid.2001.desc.intro: "Kiếm trong tay, từng tấc một, ta giành giật từng bước trên mặt đất. Mưa nặng hạt hơn. Trời rất lạnh.\n\n"
  cid.2001.desc.loser: "[loser.GetTitledFirstName] tiến về phía ta. \"[ROOT.Char.GetFirstNameNoTooltip],\" [loser.GetSheHe] chào, và ta cúi đầu đáp lễ. \"Không có thời gian cho xã giao.\"\n\nHết lần này đến lần khác kiếm va chạm giữa không trung cho đến khi ta chém đứt bàn tay [loser.GetHerHis]."
  cid.2001.desc.fallback: "Kẻ địch tiến về phía ta. \"[ROOT.Char.GetFirstNameNoTooltip],\" hắn chào, và ta cúi đầu đáp lễ. \"Không có thời gian cho xã giao.\"\n\nHết lần này đến lần khác kiếm va chạm giữa không trung cho đến khi ta chém đứt bàn tay hắn."
  cid.2001.desc.outro: "Một tiếng thét chói tai. Thanh kiếm rơi xuống đất, lấp lánh ánh sáng nhợt nhạt."
  cid.2001.desc.outro.tizona: "\n\nMột người Ngài đồng hành xứng đáng với Tizona của ta."
  cid.2001.a: "Còn nhiều trận chiến đang chờ phía trước!"
  cid.2001.a.tt: "Ngài trở thành chủ sở hữu của [newly_created_artifact.GetName]"
  cid.2001.a.flavor: "#EMP Ngươi biết đấy, ta giành được chúng theo lối hiệp sĩ.#!"
  cid.2001.b: "Một món quà xứng tầm với [liege.GetTitleAsNameNoTooltip]."
 
  cid.2010.t: "$cid_restoration_title$ Một Lời Đề Nghị Thuận Lợi"
  cid.2010.desc: "Sứ giả của [liege.GetTitledFirstNamePossessive] bước vào lều của ta dưới ánh sáng đầu tiên của buổi sớm.\n\n\"Hãy lắng nghe, tất cả những người có mặt, các bá tước và quý ông!,\" [herald.GetSheHe] thông báo. \"[liege.GetLadyLord] [liege.GetTitledFirstNameNoTooltip] của ta có một yêu cầu gửi tới [ROOT.Char.GetTitledFirstNameNoTooltip]. Cầu [liege.GetFaith.HighGodName] ban phước cho lợi ích của ngài, [liege.GetSheHe] hỏi xin [child.Custom('GetDaughterSon')] [child.GetFirstNameNoTooltip] của ngài làm [child.GetWifeHusband] cho [proposed_spouse.GetTitledFirstName].\"\n\nMột giọt nước mắt lăn dài trên má ta. Đây có phải là bước đầu tiên hướng tới sự hòa giải?"
  cid.2010.a: "\"Ta vui mừng chấp nhận vinh dự này!\""
  cid.2010.a.flavor: "#EMP Trong vòng tay ngài, ta gửi gắm [child.Custom('GetDaughterSon')] của ta, rực rỡ như mặt trời.#!"
  cid.2010.b: "\"Ta sẽ tự tìm hôn phối cho [child.GetHerHim], xin đa tạ.\""
  cid_refused_betrothal: "Từ Chối Chúa Thượng"
  cid_refused_betrothal_desc: "Nhân vật này đã từ chối lời đề nghị đính hôn của chúa thượng cho con mình và quyết định tự tìm hôn phối."
 
  cid.2020.t: "$cid_restoration_title$ Một Con Người Danh Dự"
  cid.2020.desc: "Ta vô cùng ngạc nhiên khi đón một vị khách mới trong lều của mình: [liege.GetTitledFirstName] được bao quanh bởi các vệ sĩ hoàng gia của [liege.GetHerHis], một nụ cười nở trên khuôn mặt [liege.GetHerHis].\n\n\"Bạn của ta!\" [liege.GetSheHe] kêu lên, \"Ngài, người luôn trung thành với ta, ngay cả khi ta đầy hối tiếc phải trục xuất ngài. Tại đây ta ân xá cho ngài, và ban cho ngài tình yêu của ta trên khắp [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] của ta kể từ ngày hôm nay.\"\n\n\"Thưa [liege.GetLadyLord] của tôi! Ta từng bị trục xuất và tước đoạt danh dự, và bằng biết bao nhọc nhằn ta mới có được những gì mình đang sở hữu. Cảm tạ [ROOT.Char.GetFaith.HighGodName] vì ân điển của ngài!\""
  cid.2020.a: "Tất cả đều xứng đáng."
  cid.2020.a.flavor: "#EMP Và Cid của ta cùng toàn bộ thuộc hạ vui mừng khi cờ hiệu của ngài tung bay trên đỉnh thành.#!"
  cid.2020.b: "Ta không thể bỏ lại trại của mình."
  cid.2020.b.flavor: "#EMP Người của Vivar quay lại với thuộc hạ và sai họ gom góp chiến lợi phẩm đã giành được.#!"
  cid_2020_b_tt: "Ngài tiếp tục là một [adventurer|E]"
  cid.2020.c: "Đã đến lúc mỗi người một ngả."
 
  cid_treason_title: "Phản nghịch:"
 
  cid.4000.opening: "Gửi [ROOT.Char.GetFirstNameNoTooltip] thất thường,"
  cid.4000.desc: "Sự thiếu cam kết của ngươi khiến ta bối rối. Nếu ý định của ngươi là trung thành với ta, ngươi đã thất bại; nếu ngươi muốn bày tỏ sự bất mãn — ngươi cũng thất bại nốt.\n\nHãy để chúng ta quên đi những điều không may này."
  cid.4000.a: "Hãy để vậy."
 
  cid.4010.t: "$cid_restoration_title$ Mio Cid"
  cid.4010.desc: "Một tiếng gõ mạnh báo hiệu [herald.GetTitledFirstName].\n\n\"Vì [herald.GetFaith.HighGodNamePossessive] sake, [ROOT.Char.GetFirstNameNoTooltip], ngươi có cần làm mọi thứ khó khăn đến thế không?\"\n\n\"Không phải ta khơi mào,\" ta đáp, nghiêm nghị hết mức có thể. \"Nếu [liege.GetTitleAsNameNoTooltip|l] muốn ta trung thành, [liege.GetSheHe] đã không nên lưu đày ta.\"\n\n\"Ta không còn nợ [liege.GetHerHim] lòng trung thành nào nữa, vì [liege.GetSheHe] không còn là chúa thượng chính danh của ta. Hãy nói với [liege.GetHerHim] như vậy.\""
  cid.4010.a: "\"Ta đã giành được lãnh thổ của riêng mình.\""
  cid.4010.a.flavor: "#EMP Chín tháng tròn ngài vây hãm, đến tháng thứ mười thì họ buộc phải đầu hàng.#!"
  cid.4010.b: "\"Con đường đang gọi ta.\""
  cid.4010.b.flavor: "#EMP Và đây là câu chuyện về Cid Campeador của ta.#!"
  cid.4010.c: "\"Ta vẫn sẽ tôn trọng quyền cai trị chính danh của [liege.GetHerHis].\""
  cid.4010.c.flavor: "#EMP Vì tình yêu dành cho [liege.GetTitledFirstNameNoTooltip], kẻ đã lưu đày ta.#!"
 
  cid.5000.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)],"
  cid.5000.desc: "Một lời gửi tới ngài, [ROOT.Char.GetLadyLord] đáng kính của ta, rằng chúa công hợp pháp của ngài, [el_cid_story.MakeScope.Var('cid_liege').GetCharacter.GetTitledFirstName], đã qua đời.\n\nBất kể chuyện gì ngài có với [el_cid_story.MakeScope.Var('cid_liege').GetCharacter.GetHerHim] thì cũng chẳng quan trọng với ta."
  cid.5000.a: "Vậy là xong."
 
  story_el_cid: "[Concept( 'story_content_el_cid', 'Bài ca về El Cid' )|E]"
  story_el_cid_desc: "Bị trục xuất oan ức bởi chính người bạn và cũng là chủ quân của mình — Sancho II vùng Castile — sau cuộc chiến với Alfonso VI, giờ đây Ngài lên đường để viết nên huyền thoại cho riêng mình. Ngài sẽ tự khai phá lối đi riêng, hay giữ trọn lòng trung quân?"
  CID_LIEGE: "Chủ Quân Không Chính Thức"
  EL_CID_CUSTOM_STRING_KEY: "Trong suốt hành trình, ngài sẽ chứng minh [Concept( 'cid_loyalty', 'Lòng trung thành' )|E] của ngài với [Story.MakeScope.Var('cid_liege').Char.GetShortUIName], người cuối cùng có thể ban cho ngài đất đai với tư cách là một [vassal|E].\n\nNgài cũng có thể tự tạo ra con đường riêng bằng cách tham gia vào các [wars|E] ở [GetGeographicalRegion('world_europe_west_iberia').GetName]. Điều này có thể thưởng cho ngài những thanh kiếm lịch sử, và có thể mang lại cho ngài một cơ hội khác để giành lấy đất đai."
