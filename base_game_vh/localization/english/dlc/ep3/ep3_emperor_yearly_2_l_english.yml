l_english:

 # X Reconquered
  ep3_emperor_yearly.2000.t: "[county.GetNameNoTierNoTooltip] Được Tái Chiếm"
  ep3_emperor_yearly.2000.desc_intro: "Những đạo quân rực rỡ của La Mã lại một lần nữa tiến vào các vùng đất mà tổ tiên ta từng cai trị, và vinh quang của chiến công này hoàn toàn thuộc về riêng ta."
  ep3_emperor_yearly.2000.desc_antioch: "\n\n[county.GetNameNoTier]: tòa ngự của Ngũ Đại Tòa Thượng Phụ, được chính Thánh Phêrô truyền giảng Tin Mừng, nơi Kitô giáo đặt những bước chân chính thức đầu tiên. Từng là một thành phố phồn thịnh của đức tin và thương mại, nơi đây đã bị bào mòn nặng nề bởi hàng thế kỷ tranh chấp biên cương, để rồi nay chỉ còn là cái bóng của vinh quang xưa.\n\nDẫu vậy, một cái bóng huy hoàng vẫn có thể được dẫn dắt trở lại thời đại vĩ đại dưới bàn tay chỉ đạo mạnh mẽ — như của ta!"
  ep3_emperor_yearly.2000.desc_antioch_not_christ: "\n\n[county.GetNameNoTier]: từng là một thành phố phồn thịnh của đức tin và thương mại và là thủ đô kiêu hãnh của Kitô giáo, nhiều lần rơi vào tay rồi lại được giành lại bởi các tín đồ, nơi đây đã bị tàn phá nặng nề bởi hàng thế kỷ tranh chấp biên cương, để rồi nay chỉ còn là cái bóng của vinh quang xưa.\n\nDẫu vậy, một cái bóng huy hoàng vẫn có thể được dẫn dắt trở lại thời đại vĩ đại dưới bàn tay chỉ đạo mạnh mẽ — như của ta!"
  ep3_emperor_yearly.2000.desc_jerusalem: "\n\n[county.GetNameNoTier], Thánh Địa, cuối cùng đã trở về trong vòng tay che chở của Hoàng Đế Chân Chính, vị đại diện hợp pháp của Thiên Chúa trên trần thế.\n\nTòa Thượng Phụ sẽ sớm được khôi phục, và từng đoàn hành hương sẽ lại có thể an toàn viếng thăm cái nôi của Kitô giáo, dưới sự bảo vệ của binh lực La Mã."
  ep3_emperor_yearly.2000.desc_jerusalem_not_christ: "\n\n[county.GetNameNoTier], Thánh Địa của ba tôn giáo. Nhiều kẻ thèm khát nơi này, nhưng kể từ những ngày đầu của Đế Chế, nó chỉ có một người cai trị hợp pháp duy nhất: Hoàng Đế.\n\nKhi chúng ta tái lập trật tự và an bình nơi đây, có thể trông đợi từng đoàn hành hương từ khắp mọi ngóc ngách của Đế Chế và xa hơn nữa!"
  ep3_emperor_yearly.2000.desc_alexandria: "\n\n[county.GetNameNoTier], viên ngọc của Ai Cập, đã trở lại dưới tay La Mã! Tòa ngự của Ngũ Đại Thượng Phụ, kinh đô văn hóa hàng thiên niên kỷ, từng là một trong những trung tâm tranh luận triết học và thần học Kitô giáo sôi động nhất, nay đã bị tàn phá và bỏ hoang bởi bàn tay tham lam của lũ ngoại đạo.\n\nMột lần nữa, thành phố của Alexandros sẽ trỗi dậy cùng với Đế Chế Chân Chính!"
  ep3_emperor_yearly.2000.desc_alexandria_not_christ: "\n\n[county.GetNameNoTier], viên ngọc của Ai Cập, đã trở lại dưới tay La Mã!\n\nTừng là nơi hội tụ toàn bộ tri thức và minh triết của thế giới, nơi đây đã bị tổn hại nghiêm trọng bởi các cuộc đàn áp Kitô giáo, đến mức chỉ còn sót lại rất ít dấu vết của vinh quang xưa. Ít ỏi, nhưng không phải là không còn, và với nhận thức đó, chúng ta sẽ tái thiết một thành phố xứng đáng với quá khứ của nó!"
  ep3_emperor_yearly.2000.desc_frontier: "\n\nNgày nay, người dân địa phương gọi vùng đất này là [county.GetNameNoTier]. Tuy chỉ trong thời gian ngắn, quân La Mã từng đặt chân lên những bờ biển này khi Hoàng Đế [GetScriptedCharacterByHistoryID( '145279' ).GetFirstName] dẫn dắt các quân đoàn anh dũng tiến sâu vào Lưỡng Hà.\n\nĐây từng là biên cương cuối cùng của Đế Chế ở phương Đông — và nay, một lần nữa, lại như vậy."
  ep3_emperor_yearly.2000.desc_edessa: "\n\nThành phố lừng danh [county.GetNameNoTier] — một trong những trung tâm truyền bá Kitô giáo sớm nhất, nơi đặt trụ sở của một Công Đồng Đại Kết, và là sân khấu cho sự tử đạo của nhiều Thánh Nhân vinh quang — đã bị tranh chấp giữa Đế Chế và các thế lực xâm lăng láng giềng  suốt nhiều thế kỷ.\n\nGiờ đây, nó đã trở lại dưới sự chăm sóc của Hoàng Đế hợp pháp, và lần này sẽ là mãi mãi, nếu [ROOT.Char.GetFaith.HighGodName] thuận lòng."
  ep3_emperor_yearly.2000.desc_edessa_not_christ: "\n\n[county.GetNameNoTier]: từng là thủ phủ của tỉnh Osroene, thành phố này đã kiêu hãnh đứng vững như bức tường ngăn cách La Mã và Ba Tư Sassanid trong suốt 400 năm trước khi thất thủ trước làn sóng bành trướng của Hồi giáo.\n\nHàng thế kỷ đã trôi qua kể từ đó, và [county.GetNameNoTierNoTooltip] liên tục bị tranh chấp giữa Đế Chế và các láng giềng  của chúng ta. Nguyện cho ngày chinh phục huy hoàng này là lần cuối cùng thành phố phải chứng kiến chiến tranh!"
  ep3_emperor_yearly.2000.desc_bari: "\n\n[county.GetNameNoTier] từ lâu đã là một hải cảng quan trọng trên Địa Trung Hải, nhưng hiếm khi là một thành trì chiến lược — cho đến khi người Ả Rập xuất hiện.\n\nCuộc xâm lăng của họ đã phơi bày một sự thật cay đắng: để đảm bảo an toàn cho cả miền Nam Ý và vùng Balkan trước nguy cơ chinh phục, chúng ta cần một bàn đạp phòng thủ vững chắc tại Ý. Nay khi [county.GetNameNoTierNoTooltip] lại nằm trong tay ta, chúng ta sẽ nỗ lực biến nơi này thành chốt then chốt của hệ thống phòng thủ phương Tây."
  ep3_emperor_yearly.2000.desc_syracuse: "\n\n[county.GetNameNoTier]: cảng thương mại, trung tâm truyền bá Kitô giáo tại phương Tây, và kinh đô phương Tây của Hoàng Đế Constans II.\n\nNơi từng là thành trì La Mã cuối cùng chống lại cuộc chinh phục Hồi giáo tại Sicilia đã thất thủ, nhưng nay đã được khôi phục! Vinh quang và phú quý đang chờ đợi kẻ chinh phục, và một bước tiến mới đã được đặt ra trên con đường phục hưng Đế Chế hợp pháp."
  ep3_emperor_yearly.2000.desc_rome: "\n\n[county.GetNameNoTier]. Thành Phố Bất Tử. Kinh đô đầu tiên và cái nôi của Đế Chế chúng ta.\n\nDù quyền lực hoàng đế từ lâu đã rời bỏ mảnh đất này để đến Constantinopolis — Tân La Mã, và vị Thượng Phụ lạc lối tại địa phương đã ngang nhiên lấp đầy khoảng trống quyền lực đó, việc trả lại Thành Phố cho vị Hoàng Đế duy nhất và hợp pháp là lý do chính đáng để hân hoan. Một kỷ nguyên huy hoàng mới đang chờ đợi Đế Chế, nay khi chúng ta đã tiến một bước vĩ đại như vậy về phương Tây."
  ep3_emperor_yearly.2000.desc_ravenna: "\n\n[county.GetNameNoTier] từng là nơi đặt ngai vàng của những Hoàng Đế cuối cùng khi phương Tây hỗn loạn, bị man di tàn phá, vẫn còn một Hoàng Đế hợp pháp ngự trị. Vì lẽ đó, Hoàng Đế Justinianus I đã chọn nơi đây làm trung tâm của nền hành chính La Mã được tái lập.\n\nHàng thế kỷ đã trôi qua kể từ khi người Lombard đẩy những người La Mã cuối cùng ra khỏi miền Bắc Ý; tuy nhiên, một thời đại mới của hòa bình, thịnh vượng và thống nhất vừa mới bắt đầu."
  ep3_emperor_yearly.2000.desc_carthago: "\n\nNgày nay, khu định cư chính của vùng này là [county.GetNameNoTier], nhưng chúng ta chưa từng quên thời kỳ người La Mã cai trị những bờ biển này từ Carthago — từng là kẻ thù chí mạng, rồi trở thành một thành phố phồn thịnh của đức tin và văn hóa, nay chỉ còn là vỏ rỗng của vinh quang xưa.\n\nDù có lẽ đã quá muộn để khôi phục thành phố về thời cực thịnh, vị trí thuận lợi của khu vực này chắc chắn sẽ đóng vai trò then chốt trong việc tái lập sự hiện diện của La Mã tại châu Phi."
  ep3_emperor_yearly.2000.desc_tingis: "\n\nNgày nay, người dân địa phương gọi thành phố này là [county.GetNameNoTier], nhưng chúng ta từng biết nó với cái tên Tingis, thủ phủ của tỉnh Mauritania Tingitana.\n\nTừng là trung tâm quyền lực La Mã phồn thịnh, thành phố đã mất khỏi tay ta và khỏi Ánh Sáng của Đức Tin Chân Chính suốt nhiều thế kỷ, sau khi các đạo quân Vandal được gửi đến trừng phạt sự sa đọa của chúng ta tràn qua nơi này, tiếp theo là Khalipha Hồi giáo. May mắn thay cho họ, thời kỳ thống trị man di dài đằng đẵng đã kết thúc, và Hòa Bình Đế Chế đã được tái lập."
  ep3_emperor_yearly.2000.desc_carthago_spartaria: "\n\nNgày nay, người dân địa phương gọi vùng đất này là [county.GetNameNoTier]. Tuy nhiên, Justinianus I đã đặt tên cho nó là Carthago Spartaria và biến nơi đây thành một trong những trung tâm chủ chốt của sự hiện diện La Mã được tái lập tại phương Tây.\n\nHàng thế kỷ đã trôi qua kể từ lần cuối thành phố rơi vào tay man di; tuy nhiên, khi quyền kiểm soát của chúng ta được tái lập tại Iberia, vinh quang của Justinianus dường như lại nằm trong tầm tay."
  ep3_emperor_yearly.2000.desc_milan: "\n\nTổ tiên chúng ta gọi vùng đất này là [county.GetNameNoTier] theo tên của những kẻ man di đã cướp nó khỏi Đế Chế đầu tiên — người Lombard. Một trong những trung tâm chính của vùng, Mediolanum, từng là kinh đô của phần Tây Đế Chế dưới thời Tứ Đầu Chế, và cũng chính tại đây, Constantinus Đại Đế đã ban hành Sắc Chỉ cho phép tự do tôn giáo trên toàn Đế Chế.\n\nDù người Lombard đã dời đô đi nơi khác, vùng đất này vẫn phồn thịnh và sẽ trở thành một thành trì tuyệt vời tại miền Bắc Ý."
  ep3_emperor_yearly.2000.desc_trier: "\n\nNgày nay, người dân địa phương gọi thành phố này là [county.GetNameNoTier], nhưng chúng ta vẫn nhớ tên mà tổ tiên từng gọi nó: Augusta Treverorum, nơi đặt trụ sở của Tứ Hoàng Đế Constantius Chlorus, phụ thân của người sáng lập Tân La Mã, Constantinus Đại Đế.\n\nNhững kẻ xâm lăng German đã chiếm cứ nơi này từ lâu, gần đây thậm chí còn tự xưng là \"Hoàng Đế\", lạm dụng một tước vị không dành cho man di. Điều đó giờ không còn quan trọng nữa. Khi các đội quân trung thành của ta tái chiếm những gì vốn thuộc về chúng ta theo lẽ phải, mọi kẻ tiếm danh sẽ bị tiêu diệt, và chỉ còn lại một Đế Chế hợp pháp duy nhất."
  ep3_emperor_yearly.2000.desc_hadrians_wall: "\n\nNhững kẻ man di chiếm giữ vùng đất này sau khi Đại Bàng La Mã cuối cùng rời đi đã gọi nó là [county.GetNameNoTier]. Ngày xưa, bức Trường Thành hùng vĩ của Hoàng Đế Hadrianus từng đủ sức ngăn chặn man di ngoài ranh giới Đế Chế, và chính những vùng đất này là biên cương cuối cùng của văn minh ở phương Bắc.\n\nGiờ đây, Trường Thành đã đổ nát, và man di đã hoành hành trên mảnh đất này suốt nhiều thế kỷ. Nhưng không còn nữa. Hôm nay, biên cương của Hadrianus lại một lần nữa được tái lập!"
  ep3_emperor_yearly.2000.desc_chandax: "\n\nNgười Ả Rập, những kẻ đầu tiên chinh phục Crete, đã dời đô của họ đến Heraklion cổ đại và gọi nó là [county.GetNameNoTier], trong khi kinh đô ban đầu là Gortyna dần suy tàn.\n\nViệc tái chiếm quyền kiểm soát trái tim mới của hòn đảo là bước đi then chốt để đảm bảo an ninh tại Địa Trung Hải và thịnh vượng cho toàn Đế Chế, khi cả thương nhân lẫn hải tặc đều có thể bị chặn đứng và kiểm soát, còn các hạm đội xâm lăng sẽ bị đánh chặn."
  ep3_emperor_yearly.2000.desc_tours: "\n\nNgày nay, người dân địa phương gọi vùng đất này là [county.GetNameNoTier], xuất phát từ tên Latin nay đã bị lãng quên của khu định cư chính, Civitas Turonum. Trong những ngày cuối của phần Tây Đế Chế, thành phố này từng là một đại đô thị thực thụ, thống trị toàn bộ tỉnh Lugdunum.\n\nKể từ đó, tầm quan trọng của nó chỉ suy giảm phần nào, khi các đoàn hành hương Kitô giáo vẫn đổ về đây trên đường tới Santiago, và nơi này đã đóng vai trò thành lũy chống lại hai cuộc xâm lăng: của người Ả Rập và của người Viking. Tinh thần La Mã đích thực vẫn còn vương vấn trên những vùng đất này, và họ sẽ phải tái khám phá nó — dù muốn hay không!"
  ep3_emperor_yearly.2000.a: "Một ngày vinh quang cho toàn thể người La Mã!"
 # The Fate of a PrincessPrince
  ep3_emperor_yearly.2010.t: "Số Phận của một [sent_off.Custom('GetPrincessPrince')]"
  ep3_emperor_yearly.2010.desc: "Triều đình hôm nay râm ran bàn tán. #EMP Đáng xấu hổ#!. Những lời đồn đại không xứng với đại sảnh trang nghiêm này.\n\n\"Tội nghiệp [sent_off.GetFirstName]...\"\n\"... Đơn độc giữa bọn [spouse.GetCulture.GetNameNoTooltip] #EMP man di#!...\"\n\"... Số phận còn tệ hơn cái chết...\"\n\"... Ta nghe nói chúng thậm chí còn không dùng #EMP nĩa#!!\"\n\nTuy vậy, ta dễ dàng nhận ra [gossip_1.Custom2('MyCharacterIntroduction', ROOT.Char)] và [gossip_2.Custom2('MyCharacterIntroduction', ROOT.Char)] đang xì xào trong một góc. Khi ánh mắt nghiêm khắc của ta hướng về phía họ, cả hai lập tức im bặt, nhưng ta đã nghe đủ để biết chính xác chủ đề của cuộc trò chuyện."
  ep3_emperor_yearly.2010.a: "Nhu cầu chính trị của Đế Chế luôn đứng trên lợi ích cá nhân."
  ep3_emperor_yearly.2010.b: "[sent_off.GetHerHis|U] tấm gương hy sinh Kitô giáo cao cả luôn hiện diện trong lời cầu nguyện của ta."
  ep3_emperor_yearly.2010.b2: "Một tấm gương sáng ngời của sự tận hiến vì lợi ích của muôn dân."
  ep3_emperor_yearly.2010.c: "Ngươi không có quyền phán xét một Hoàng Đế."
 #A Head Unworthy of the Crown
  ep3_emperor_yearly.2020.t: "Một Cái Đầu Không Xứng Với Vương Miện"
  ep3_emperor_yearly.2020.desc: "Những ngày đầu trị vì của ta với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] đầy rối ren và căng thẳng, nhưng cuối cùng cũng đã đến lúc ta chính thức tiếp nhận vương miện và phúc lành của [patriarch.GetTitleAsNameNoTooltip] trong những đại sảnh linh thiêng của [ROOT.Char.Custom('TriumphReligiousLocation')].\n\n[patriarch.GetTitledFirstName|U] chờ ta nơi lối vào — vẻ mặt nghiêm khắc hiện rõ trên gương mặt [patriarch.GetHerHis] — cánh cửa phía sau [patriarch.GetHerHim] đóng chặt một cách dứt khoát.\n\n\"Vì sao ngươi lại đến đây, [ROOT.Char.GetFirstNameNoTooltip]? Ngươi không xứng đáng! Nơi này không có chỗ cho hạng người như ngươi!\""
  ep3_emperor_yearly.2020.a: "Ta ăn năn và từ bỏ những tội lỗi của mình!"
  ep3_emperor_yearly.2020.a.tt: "Ngài công khai và chính thức bước vào con đường sám hối để được tha thứ tội lỗi!"
  ep3_emperor_yearly.2020.a.tt2: "Khi thời gian sám hối kết thúc, Ngài sẽ mất đặc điểm [target_criminal_trait.GetName(GetPlayer)]"
  ep3_emperor_yearly.2020.b: "[ROOT.Char.GetTitleAsNameNoTooltip] lựa chọn [patriarch.GetTitleAsNameNoTooltip], chứ không phải ngược lại."
  ep3_emperor_yearly.2021.t: "Sám Hối"
  ep3_emperor_yearly.2021.desc: "Tròn một năm đã trôi qua kể từ khi [patriarch.GetTitledFirstName] nghiêm khắc quở trách ta vì những tội lỗi của mình, và ta khiêm nhường bắt đầu hành trình chuộc lỗi để xứng đáng với vương miện ta mang dưới vinh quang của [ROOT.Char.GetFaith.HighGodName]."
  ep3_emperor_yearly.2021.desc_patriarch: "\n\nHôm nay chúng ta lại gặp nhau, nhưng lần này, một nụ cười nhân hậu hiện lên trên gương mặt [patriarch.GetHerHis]."
  ep3_emperor_yearly.2021.desc_patriarch_new: "\n\n[patriarch.GetTitledFirstNameNoTooltip|U] đã qua đời, nhưng người kế nhiệm của [patriarch.GetHerHis], [patriarch_portrait.GetFirstName], giờ đây đứng trước mặt ta để ban phúc lành của [patriarch_portrait.GetHerHis]."
  ep3_emperor_yearly.2021.desc_end: "\n\n\"Bình an ở cùng ngươi, [ROOT.Char.GetTitledFirstNameNoTooltip]! Sự trưởng thành tâm linh của ngươi thật lớn lao, sự sám hối của ngươi là chân thành, và vì thế những tội lỗi của ngươi đã được tha thứ. Triều đại của ngươi được [ROOT.Char.GetFaith.HighGodNameAlternate] ban phúc!\""
  ep3_emperor_yearly.2021.a: "Ta là [ROOT.Char.GetTitleAsNameNoTooltip] theo quyền con người lẫn quyền thiêng liêng."
 # Usurper
  ep3_emperor_yearly.2030.t: "Kẻ Tiếm Vị"
  ep3_emperor_yearly.2030.desc: "Quyền lực thuộc về kẻ đủ táo bạo để nắm lấy nó, và [ROOT.Char.GetFaith.HighGodName] ưu ái những kẻ dám hành động. Rõ ràng [ROOT.Char.GetFaith.HighGodNameSheHe|U] đã ưu ái #EMP ta#!, khi cuối cùng ta cũng có thể xưng mình là [ROOT.Char.GetTitleAsNameNoTooltip]. Tuy nhiên, [patriarch.GetTitledFirstName|U] dường như không đồng tình với con đường ta đã chọn.\n\n\"Ngươi đã bước lên đỉnh cao bằng con đường máu đổ, [ROOT.Char.GetFirstNameNoTooltip], và nổi loạn chống lại vị quân chủ hợp pháp của mình, [ROOT.Char.GetTitleAsNameNoTooltip] [predecessor.GetFirstName]! Ngươi thật sự nghĩ rằng [ROOT.Char.GetFaith.HighGodNameAlternate] sẽ ban phúc cho một #EMP kẻ tiếm vị#! sao?\"\n\nTa không cần [patriarch.GetTitleAsNameNoTooltip] phải ưa thích ta, nhưng ta không thể phủ nhận rằng điều này sẽ khiến mọi thứ trở nên khó khăn hơn..."
  ep3_emperor_yearly.2030.a: "Vậy thì đã đến lúc phải thay đổi!"
  ep3_emperor_yearly.2030.a.tt: "Thay thế [patriarch.GetTitleAsNameNoTooltip] hiện tại bằng một người ủng hộ Ngài"
  ep3_emperor_yearly.2030.b: "Ta sẽ chứng minh giá trị của mình."
  patriarch_support_2030_desc: "Sự Ủng Hộ của Giáo Chủ"
  patriarch_support_2030_desc_tt: "[patriarch.GetTitleAsNameNoTooltip] sẽ ủng hộ vị tiền nhiệm của Ngài cho đến khi Ngài chứng minh được bản thân"
 # Married Again
  ep3_emperor_yearly.2040.t: "Tái Hôn"
  ep3_emperor_yearly.2040.desc: "Ai cũng biết rằng [new_wife.GetTitledFirstName] không phải là [new_wife.GetWifeHusband] đầu tiên của ta. Cũng không phải người thứ hai. Cuộc hôn lễ gần nhất của ta, sau sự ra đi đáng tiếc của các phối ngẫu trước, đã gây ra một vụ bê bối lớn trong giới tôn giáo do [patriarch.GetTitledFirstName] đứng đầu.\n\n\"KHIẾT HẠNH! Khiết hạnh và sự thủy chung với ký ức về người phối ngẫu mà [ROOT.Char.GetFaith.HighGodName] đã kết hợp ngươi với! Đó là luật pháp mà [ROOT.Char.GetFaith.HighGodNameAlternate] ban cho loài người! Làm sao ta có thể chấp thuận một sự ghê tởm như vậy trước mắt [ROOT.Char.GetFaith.HighGodNamePossessive]?!\""
  ep3_emperor_yearly.2040.a: "Vậy thì sẽ có người khác làm."
  ep3_emperor_yearly.2040.b: "Một khoản cúng dường hào phóng thì sao?"
  ep3_emperor_yearly.2040.c: "Ta chắc chắn đây chỉ là một sự hiểu lầm."
  ep3_emperor_yearly.2040.c.success: "[patriarch.GetTitledFirstNameNoTooltip|U] ấn tượng trước hiểu biết của Ngài về giáo luật"
  ep3_emperor_yearly.2040.c.success.tt: "[patriarch.GetTitledFirstNameNoTooltip|U] đã ban phúc cho hôn lễ của Ngài"
  ep3_emperor_yearly.2040.c.failure: "[patriarch.GetTitledFirstNameNoTooltip|U] không bị thuyết phục"
  ep3_emperor_yearly.2040.c.failure.tt: "[patriarch.GetTitledFirstNameNoTooltip|U] không ban phúc cho hôn lễ của Ngài"
 # A <Komnenos> on the Throne
  ep3_emperor_yearly.2050.t: "Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] Lên Ngôi"
  ep3_emperor_yearly.2050.t2: "Một [ROOT.Char.GetHouse.GetBaseNameNoTooltip] Trở Lại Ngai Vàng"
  ep3_emperor_yearly.2050.desc: "Ngày hôm nay sẽ được ghi nhớ như một ngày trọng đại của Gia Tộc [ROOT.Char.GetHouse.GetBaseName]. Kể từ thời [ROOT.Char.GetTitleAsNameNoTooltip] [last_emperor.GetFirstName], chưa từng có một [ROOT.Char.GetHouse.GetBaseNameNoTooltip] nào ngồi trên ngai vàng của [title.GetName]!"
  ep3_emperor_yearly.2050.desc_first: "Hôm nay đánh dấu một cột mốc lịch sử cho Gia Tộc [ROOT.Char.GetHouse.GetBaseName]. Chưa từng có một thành viên kiêu hãnh nào của dòng họ ta ngồi trên ngai vàng của [title.GetName]! Chưa bao giờ điều này xảy ra — và hiếm khi chúng ta dám mơ tới — cho đến #EMP ta#!."
  ep3_emperor_yearly.2050.desc_diplo: "\n\nNổi danh khắp nơi như một nhà ngoại giao,"
  ep3_emperor_yearly.2050.desc_martial: "\n\nĐược kính trọng như một vị tướng mưu lược,"
  ep3_emperor_yearly.2050.desc_stewardship: "\n\nĐược công nhận rộng rãi là một người quản lý năng lực đối với các vùng đất của [last_emperor.GetHerHis],"
  ep3_emperor_yearly.2050.desc_intrigue: "\n\nBị khiếp sợ vì sự mưu mô và những thủ đoạn lén lút của [last_emperor.GetHerHis],"
  ep3_emperor_yearly.2050.desc_learning: "\n\nĐược ngưỡng mộ rộng rãi vì tri thức và trí tuệ của [last_emperor.GetHerHis],"
  ep3_emperor_yearly.2050.desc_prowess: "\n\nĐược nhớ đến chủ yếu vì sức mạnh siêu phàm và những chiến công trên chiến trường của [last_emperor.GetHerHis],"
  ep3_emperor_yearly.2050.desc_fallback: "\n\nDù không phải là dấu ấn lẫy lừng nhất,"
  ep3_emperor_yearly.2050.desc_first_accomplish: "\n\nThân tộc ta thúc giục ta kiến tạo một di sản cho muôn đời. Hàng thế kỷ sau, thế gian có thể vẫn tôn vinh mọi cái tên của Gia Tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip], và hơn hết — vị [ROOT.Char.GetTitledFirstNameNoTooltipRegnal] vĩ đại đã đưa họ tới vinh quang!"
  ep3_emperor_yearly.2050.desc_body: "[last_emperor.GetFirstNameNoTooltip] đã để lại dấu ấn trong lịch sử. Giờ đây, ta bắt đầu những bước đi đầu tiên để tạo nên dấu ấn của riêng mình!"
  ep3_emperor_yearly.2050.a: "Tiến lên, hướng tới vinh quang vĩnh cửu!"
 # The Queen of Cities
  ep3_emperor_yearly.2060.t: "Nữ Hoàng của Các Thành Phố"
  ep3_emperor_yearly.2060.desc: "Đây là [2060_councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] với vẻ mặt đầy hy vọng của [2060_councillor.GetHerHis].\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của ta, như ngài chắc chắn đã biết, lễ kỷ niệm ngày thành lập Nữ hoàng các Thành phố huy hoàng của chúng ta, [queen_city.GetNameNoTier], rơi vào ngày 11 tháng 5, sớm hơn nhiều so với người ta tưởng! Người dân đã bàn tán và than phiền vì đã nhiều năm không có lễ kỷ niệm nào được tổ chức.\n\n"Chúng ta có nên tổ chức lễ hội xứng tầm với thành phố vĩ đại của Constantine không?""
  ep3_emperor_yearly.2060.desc_century: "Đây là [2060_councillor.Custom2('MyCharacterIntroduction', ROOT.Char)], với bước chân đầy phấn khích của [2060_councillor.GetHerHis].\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của ta, như ngài chắc chắn đã biết, lễ kỷ niệm tiếp theo ngày thành lập Nữ hoàng các Thành phố huy hoàng của chúng ta, [queen_city.GetNameNoTier], sẽ đánh dấu #EMP một thế kỷ#! kể từ năm 324 xa xôi, khi Constantine Đại đế chọn nó làm Rome Mới của mình.\n\n"Đây là dịp hoàn hảo cho một lễ kỷ niệm vĩ đại không giống bất kỳ lễ kỷ niệm nào khác! Người dân sẽ yêu mến ngài, và lịch sử sẽ ghi nhớ đóng góp của ngài.""
  ep3_emperor_yearly.2060.a: "Chỉ những lễ hội vĩ đại nhất mới xứng đáng!"
  ep3_emperor_yearly.2060.b: "Vậy thì hãy tổ chức một đại lễ!"
  ep3_emperor_yearly.2060.c: "Mọi lễ hội sẽ phải chờ."
  constantinople_birthday_flag_desc: "Lễ Kỷ Niệm Thành Lập Constantinopolis"
  constantinople_birthday_flag_tt: "Tổ chức Hoạt động [GetActivityType('activity_chariot_race').GetName] trong 5 năm tới sẽ rẻ hơn 50%"
 # Exotic Gifts
  ep3_emperor_yearly.2070.t: "Những Lễ Vật Kỳ Lạ"
  ep3_emperor_yearly.2070.desc: "Vị [ambassador.GetWomanMan] đứng trước mặt ta dường như đến từ một vùng đất rất xa xôi, xét theo y phục ngoại lai và những lễ vật [ambassador.GetSheHe] mang theo: vàng, ngà voi, muối...\n\nThế nhưng, khi món lễ vật cuối cùng được đưa vào, mọi suy nghĩ lý trí của ta chợt khựng lại — #EMP nhân danh [ROOT.Char.GetFaith.HealthGodName], đó là con vật gì vậy?!#! Ta chỉ có thể mô tả nó như một con #EMP ngựa#! khổng lồ có đốm, với chiếc cổ dài...\n\n\"Tâu Đại Nhân [ROOT.Char.GetTitleAsNameNoTooltip], Ta mang đến những lễ vật từ vùng đất [ambassador_liege.GetPrimaryTitle.GetBaseNameNoTier], bao gồm cả loài sinh vật uy nghi này mà chúng Ta gọi là #EMP hươu cao cổ#!. Xin hãy nhận lấy những cống vật khiêm nhường của vị [ambassador_liege.GetLadyLord] của Ta.\""
  ep3_emperor_yearly.2070.a: "Mọi lễ vật đều được hoan nghênh."
  ep3_emperor_yearly.2070.b: "Sao #EMP ngươi#! không ở lại luôn?"
  ep3_emperor_yearly.2070.b.tt: "[ambassador.GetFirstNameNoTooltip|U] là một nhà ngoại giao xuất sắc có thể phụng sự ta!"
  ep3_emperor_yearly.2070.b.success: "[ambassador.GetFirstNameNoTooltip|U] ấn tượng trước lãnh thổ của Ngài và chấp nhận ở lại"
  ep3_emperor_yearly.2070.b.success.tt: "[ambassador.GetFirstNameNoTooltip|U] Được Tuyển Dụng"
  ep3_emperor_yearly.2070.b.failure: "[ambassador.GetFirstNameNoTooltip|U] cần thêm một chút #EMP thuyết phục bằng vàng#! để ở lại"
  ep3_emperor_yearly.2070.b.failure.tt: "$ep3_emperor_yearly.2070.b.success.tt$"
  ep3_emperor_yearly.2070.c: "Ừ, được thôi... Lui đi."
  ep3_emperor_yearly.2070.c.tt: "Quăng lễ vật vào đống kia và đưa con thú xuống nhà bếp hay đâu đó."
 # A School for the People
  ep3_emperor_yearly.2080.t: "Trường Học cho Dân Chúng"
  ep3_emperor_yearly.2080.desc: "[school_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lên tiếng, chọn lựa những từ ngữ đầy duyên dáng của [school_proposer.GetHerHis],\n\n"Người dân [school_county.GetNameNoTier] đã chú ý đến những khoản đầu tư đổ vào chương trình xây dựng gần đây của ngài. Trong khi tất cả mọi người hiển nhiên đều tự hào về sự phát triển của thành phố thân yêu của chúng ta, một số cải tiến chắc chắn sẽ gây tiếng vang lớn hơn với các thần dân của ngài, dù cao quý hay thấp hèn.""
  ep3_emperor_yearly.2080.desc_byz: "\n\n\"Thần đề nghị xây dựng một ngôi trường được hoàng gia tài trợ, với những [Glossary( 'grammatikoi', 'GRAMMATIKOS_GLOSS' )] được kính trọng; càng nhiều thường dân được tiếp cận giáo dục tốt, càng nhiều người gia nhập bộ máy hành chính hoàng gia — một lợi ích cho chúng ta, và là sự cải thiện về địa vị xã hội cho họ!\""
  ep3_emperor_yearly.2080.desc_gen: "\n\n\"Chẳng hạn, tài trợ cho một ngôi trường nơi mọi tầng lớp xã hội đều có thể học tập để bước vào hàng ngũ hành chính đế quốc!\""
  ep3_emperor_yearly.2080.a: "Một bộ máy quan liêu vận hành trơn tru luôn cần nhân sự mới."
  ep3_emperor_yearly.2080.a.tt: "Ngài sẽ gặt hái lợi ích khi công trình trường học hoàn thành, sau 5 năm."
  ep3_emperor_yearly.2080.b: "Hiện tại chúng ta còn ưu tiên khác."
  GRAMMATIKOS_GLOSS: "Hệ thống giáo dục Byzantine phần lớn kế thừa từ La Mã cổ điển, và được chia thành 3 cấp độ: #EMP grammatistes#! dạy trẻ nhỏ những kiến thức cơ bản về đọc, viết và tính toán; #EMP grammatikos#! dạy trẻ lớn hơn văn học và ngôn ngữ Hy Lạp cổ điển; cuối cùng, #EMP rhetor#! dạy thanh thiếu niên nghệ thuật hùng biện — khả năng diễn đạt rõ ràng và thuyết phục."
 # A Popular Mime
  ep3_emperor_yearly.2090.t: "Một Nghệ Sĩ Hí Kịch Nổi Tiếng"
  ep3_emperor_yearly.2090.desc: "Trước mặt ta là một gương mặt quen quen; đó là [mime.GetFirstName], [Glossary( 'mimos', 'MIMOS_GLOSS' )] được dân chúng yêu mến nhất.\n\n\"Tâu [ROOT.Char.GetTitleAsNameNoTooltip], ta không cần giới thiệu — cái tên của ta đã được mọi người biết đến và yêu mến. Trường Đua lặng im khi ta biểu diễn và reo hò theo ý ta muốn. Bệ hạ biết rõ ảnh hưởng của ta với đám đông; cả hai chúng ta đều có thể hưởng lợi từ một mối hợp tác chặt chẽ hơn.\""
  ep3_emperor_yearly.2090.a: "Ngươi có thể giúp chinh phục lòng dân tại [control_target.GetNameNoTooltip]."
  ep3_emperor_yearly.2090.b: "Chỉ có triều đình của ta mới xứng với loại hình giải trí này."
  ep3_emperor_yearly.2090.c: "Ta không có thời gian cho #EMP bọn hề#!."
  ep3_emperor_yearly.2090.a.tt: "Sự trợ giúp của [mime.GetFirstNamePossessiveNoTooltip] tăng hiệu quả nhiệm vụ $task_increase_control$ của $councillor_marshal$."
  ep3_emperor_yearly.2090.b.tt: "Tài năng và danh tiếng của [mime.GetFirstNamePossessiveNoTooltip] tăng năng lực của [mime.GetHerHis] với vai trò $court_jester_court_position$."
  court_position_famous_mime: "Nghệ Sĩ Hí Kịch Nổi Tiếng"
  MARSHAL_INCREASE_CONTROL_MIME_MODIFIER: "Được Hỗ Trợ bởi Nghệ Sĩ Hí Kịch Nổi Tiếng"
  MIMOS_GLOSS: "Bản chất chính xác của một mimos Byzantine — thường được dịch đơn giản là #EMP nghệ sĩ hí kịch#! — rất khó xác định. Thuật ngữ này bao trùm nhiều loại hình giải trí hài hước: diễn viên kịch câm thần thoại, người tung hứng, nhào lộn, vũ công, hề cung đình, và thậm chí cả những hình thức burlesque sơ khai."
 # A Border Treaty
  ep3_emperor_yearly.2100.t: "Hiệp Ước Biên Giới"
  ep3_emperor_yearly.2100.desc: "[chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến ngai vàng với một chồng tài liệu trên tay của [chancellor.GetHerHis].\n\n"Thưa [ROOT.Char.Custom('FormOfAddressForLiege')] của ta, ta đã phân tích một số hiệp ước với láng giềng [neighbor.GetTitledFirstName] của chúng ta. Có vẻ như hiệp ước biên giới liên quan đến [contested_county.GetName] tồn tại trong nhiều bản sao không trùng khớp, một vài trong số đó có lợi cho chúng ta hơn nhiều so với bản mà chúng ta hiện đang áp dụng!\n\n"Với sự cho phép của ngài, ta muốn cố gắng thực thi phiên bản có lợi nhất làm hiệp ước chính thức được tất cả các bên liên quan thông qua!""
  ep3_emperor_yearly.2100.a: "Cứ làm đi."
  ep3_emperor_yearly.2100.a.success: "Phiên bản hiệp ước của chúng ta được chấp nhận"
  ep3_emperor_yearly.2100.a.success.tt: "Phiên Bản Được Chấp Nhận"
  ep3_emperor_yearly.2100.a.failure: "Phiên bản hiệp ước của chúng ta bị từ chối"
  ep3_emperor_yearly.2100.a.failure.tt: "Phiên Bản Bị Từ Chối"
  ep3_emperor_yearly.2100.a.crit_fail: "Họ dùng một phiên bản còn cổ hơn để chống lại chúng ta"
  ep3_emperor_yearly.2100.a.crit_fail.tt: "Phát Hiện Phiên Bản Bất Lợi"
  ep3_emperor_yearly.2100.b: "Thông báo cho [neighbor.GetFirstNameNoTooltip]: hãy tìm một thỏa thuận."
  ep3_emperor_yearly.2100.c: "Chôn vùi mọi bằng chứng."
  TRUCE_COLLABORATION: "Hiệp Ước Hòa Bình"
  ep3_emperor_yearly.2100.angry_error_log: ""
 # Mediators of X
  ep3_emperor_yearly.2110.t: "Những Người Hòa Giải của [provincial_county.GetNameNoTierNoTooltip]"
  ep3_emperor_yearly.2110.desc_same: "Ta lập tức nhận ra xuất xứ của người thỉnh cầu đứng trước mặt mình: [merchant.GetSheHe] là người [merchant.GetCulture.GetNameNoTooltip], giống hệt như ta. Ngay khi [merchant.GetSheHe] cất lời, một giọng nói quen thuộc ập đến."
  ep3_emperor_yearly.2110.desc_other: "Người thỉnh cầu trước mặt ta dường như không phải người [ROOT.Char.GetCulture.GetNameNoTooltip]. Chắc là một kẻ #EMP tỉnh lẻ#! nào đó. Ngay khi [merchant.GetSheHe] bắt đầu nói, ta lập tức nghe thấy một giọng điệu man rợ nhưng mơ hồ quen tai."
  ep3_emperor_yearly.2110.desc: "\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip|U], ta đại diện cho một nhóm thương nhân đến từ [provincial_county.GetNameNoTier]. Đã sinh sống lâu dài tại vùng đất này, giao thương với người bản địa cũng như các quan chức từ Kinh đô, chúng ta hiểu rất rõ những khó khăn trong việc quản lý các cộng đồng chưa được hội nhập, và có đủ năng lực đặc biệt để hỗ trợ.\n\nVì vậy, chúng Ta xin được đề nghị phục vụ với tư cách là các phiên dịch và thông ngôn chính thức.\""
  ep3_emperor_yearly.2110.a: "Các ngươi sẽ rất cần thiết cho bộ máy hành chính địa phương."
  ep3_emperor_yearly.2110.b: "Triều đình cần các ngươi ở Kinh đô."
  ep3_emperor_yearly.2110.c: "Chính người [merchant.GetCulture.GetCollectiveNounNoTooltip] mới phải học theo phong tục của Kinh đô."
 # Foreign Pretentiousness
  ep3_emperor_yearly.2120.t: "Sự Khoa Trương Ngoại Bang"
  ep3_emperor_yearly.2120.desc: "[complainer.GetTitledFirstName] có vẻ khá khó chịu về điều gì đó.\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U] của ta, triều đình đang xôn xao với sự phẫn nộ dành cho [the_byz.Custom2('YourCharacterIntroduction', ROOT.Char)]! Hành vi kiêu ngạo và tự phụ của [the_byz.GetHerHis|U] là điều rõ ràng và, kể từ khi [the_byz.GetHerHis] đến, [the_byz.GetSheHe] đã giới thiệu những phong tục #EMP xa hoa#! vào triều đình: [the_byz.GetSheHe] ăn bằng dĩa vàng, từ chối tắm rửa tập thể như chúng ta, xức nước hoa cho căn phòng của [the_byz.GetHerHis] bằng những loại thảo mộc đáng ngờ, và mặc những bộ quần áo lụa mềm mại đến tội lỗi!\n\n"Ngài phải chấm dứt sự điên rồ này, trước khi sự suy đồi đạo đức của [the_byz.GetHerHis] lan rộng!""
  ep3_emperor_yearly.2120.a: "Chúng ta nên học hỏi từ [the_byz.GetFirstNameNoTooltip]!"
  ep3_emperor_yearly.2120.b: "Triều đình sẽ không dung thứ mấy thứ ngoại bang lố bịch này."
  ep3_emperor_yearly.2120.c: "Thành thật mà nói? Chẳng ai quan tâm cả."
 # A Plea for Freedom
  ep3_emperor_yearly.2130.t: "Lời Khẩn Cầu Tự Do"
  ep3_emperor_yearly.2130.desc: "\"Hỡi [ROOT.Char.GetTitleAsNameNoTooltip|U] cao quý và nhân từ, xin hãy nghe lời khẩn cầu của ta.\" Người thỉnh cầu bị hai lính canh kèm chặt, đôi tay [prisoner.GetHerHis] bị trói chắc chắn. Ta nhận ra ngay tù nhân của mình, [prisoner.GetTitledFirstName].\n\n\"Ta đã mòn mỏi quá lâu trong cảnh giam cầm. Xin hãy thương xót và trả lại tự do cho ta! Không gì quý giá với ta hơn tự do, và vì thế, không cái giá nào là quá đắt. Người cứ đòi hỏi bất cứ điều gì, ta nguyện tuân theo!\""
  ep3_emperor_yearly.2130.a: "Ngươi được toàn xá."
  ep3_emperor_yearly.2130.b: "Ngươi sẽ ủng hộ ta."
  ep3_emperor_yearly.2130.c: "Mạng sống của ngươi giờ thuộc về ta."
  ep3_emperor_yearly.2130.c.tt: "[prisoner.GetFirstNameNoTooltip] sẽ bị buộc phải chấp nhận làm nội gián trong mọi âm mưu của ngươi."
  ep3_emperor_yearly.2130.d: "Ngươi sẽ gửi quân cho ta."
  ep3_emperor_yearly.2130.e: "Bị từ chối. Cút khỏi mắt ta ngay."
  SCHEME_OWE_FREEDOM: "Ta nợ ngươi tự do của mình: $VALUE|+0=$"
 # Empty Coffers, Empty Mausoleums
  ep3_emperor_yearly.2140.t: "Kho Bạc Trống Rỗng, Lăng Mộ Hoang Phế"
  ep3_emperor_yearly.2140.desc: "Quản lý [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] là một việc tốn kém, và có lẽ ta đã hơi quá bất cẩn với tài chính. Nợ nần chồng chất, và kho bạc thì trống rỗng.\n\nTa có thể kiếm vàng #EMP ngay lúc này#! ở đâu?\n\nMột ý tưởng vừa đáng xấu hổ, phạm thượng, nhưng lại #EMP tuyệt vời#! bất chợt lóe lên trong đầu: các Hoàng đế vĩ đại thời xưa luôn được chôn cùng những tùy táng xa hoa! Ta chỉ cần thu hồi lại một phần trong số đó để trả nợ. Dù sao thì tất cả những của cải ấy cũng thuộc về Đế quốc, chẳng phải sao?"
  ep3_emperor_yearly.2140.a: "Chắc người chết cũng sẽ không bận tâm."
  ep3_emperor_yearly.2140.b: "Ta sẽ không hạ mình thấp đến vậy!"
 # The Saint of X
  ep3_emperor_yearly.2150.t: "Vị Thánh của [capital.GetNameNoTooltip]"
  ep3_emperor_yearly.2150.desc: "Dân chúng [capital.GetName] đang xôn xao bàn tán về một [saint.GetWomanMan] thánh thiện tên là [saint.GetFirstName], người sống một cuộc đời khổ hạnh theo gương các Thánh cổ xưa."
  ep3_emperor_yearly.2150.desc.stylite: "\n\nGiống như những người mà chúng ta thường gọi là "Stylites", [saint.GetSheHe] đã chọn một cột đá cũ trong thị trấn làm ngôi nhà của [saint.GetHerHis]; [saint.GetSheHe] dành cả cuộc đời của [saint.GetHerHis] trên đỉnh cột, buộc chặt để không bị ngã, phủ trong những mảnh giẻ rách, chỉ ăn thức ăn mà những môn đệ thiện chí kéo lên cho [saint.GetHerHim] bằng một sợi dây và ròng rọc."
  ep3_emperor_yearly.2150.desc.grazer: "\n\nGiống như những người ta thường gọi là \"Grazer\", [saint.GetSheHe] sống giữa thiên nhiên hoang dã, như một con thú giữa bầy thú; trần truồng, đơn độc, [saint.GetSheHe] sống nhờ những gì đất trời ban tặng và những bố thí lẻ tẻ của khách qua đường."
  ep3_emperor_yearly.2150.desc.iron: "\n\nGiống như những người mà chúng ta thường gọi là "Iron-Wearers", [saint.GetSheHe] dành cuộc đời của [saint.GetHerHis] trong sự bất động, bao phủ trong những sợi xích nặng nề để hành xác; sắt cứa sâu vào cổ tay của [saint.GetHerHis], nhưng không một tiếng thở dài nào thoát ra khỏi môi của [saint.GetHerHis]. Chỉ có lòng thương xót của người qua đường mới nuôi sống và che chở cho cơ thể đẫm máu của [saint.GetHerHis]."
  ep3_emperor_yearly.2150.desc.end: "\n\nKhông hiếm kẻ lừa đảo sống bằng lòng hảo tâm lầm lạc của dân chúng, giả vờ mang thương tích và phô diễn vẻ thánh thiện giả tạo, nhưng nếu [saint.GetFirstNameNoTooltip] thực sự là một vị thánh thì sao?"
  ep3_emperor_yearly.2150.a: "[saint.GetWomanMan] này đã được [ROOT.Char.GetFaith.HighGodName] ban phúc!"
  ep3_emperor_yearly.2150.a.tt: "Ta sẽ ủng hộ con đường thánh thiện của [saint.GetHerHis]!"
  ep3_emperor_yearly.2150.b: "Ta sẽ tự mình thử thách [saint.GetHerHim]!"
  ep3_emperor_yearly.2150.c: "Các [saint.GetWomenMen] thánh thiện đã từ lâu không còn bước đi giữa chúng ta."
  ep3_emperor_yearly.2150.c.tt: "[governor_efficiency|E] của ngươi tăng #P 3%#!"
  ep3_emperor_yearly.2150.b.tt.success: "Ngươi tìm ra sự thật"
  ep3_emperor_yearly.2150.b.tt.holy: "[saint.GetFirstNameNoTooltip] thực sự là một [saint.GetWomanMan] thánh thiện"
  ep3_emperor_yearly.2150.b.tt.crook: "[saint.GetFirstNameNoTooltip] chỉ là một kẻ lừa đảo tầm thường"
  ep3_emperor_yearly.2150.b.tt.failure: "Ngươi chẳng khôn ngoan hơn trước"
  ep3_emperor_yearly.2150.b.tt.continue: "Ngươi phải để [saint.GetFirstNameNoTooltip] tiếp tục con đường khổ hạnh của [saint.GetHerHis]"
  ep3_emperor_yearly.2150.b.tt: "[governor_efficiency|E] của ngươi tăng #P 10%#!"
  ep3_emperor_yearly.2151.desc: "Đã nhiều năm rồi ta không còn nghe ai nhắc đến [saint.GetFirstNameNicknamed], vị thánh của dân chúng tại [capital.GetName]. Không hiểu sao lúc này ta lại chợt nghĩ đến chuyện ấy...\n\n\"[chaplain.GetTitledFirstName|U], ngươi còn nhớ ẩn sĩ kỳ quặc đó không, [saint.GetFirstNameNoTooltip]? Rốt cuộc chuyện gì đã xảy ra với [saint.GetHerHim]?\""
  ep3_emperor_yearly.2151.desc_saint: "\n\n\"Một vị thánh chân chính, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U]! Dư âm từ những việc làm thánh thiện của [saint.GetHerHis] vẫn còn lan tỏa khắp vùng đất!\""
  ep3_emperor_yearly.2151.desc_crook: "\n\n"Chỉ là một tên lừa đảo tầm thường, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U] của ta. Chỉ vài tháng sau khi vấn đề được trình lên ngài, người ta phát hiện ra rằng [saint.GetSheHe] đã giả mạo những vết thương của [saint.GetHerHis] bằng máu cừu và ăn uống no say trong một quán rượu gần đó!""
  ep3_emperor_yearly.2151.a: "Ai mà ngờ được chứ!"
 # People of the Frontier
  ep3_emperor_yearly.2160.t: "Dân Cư Biên Giới"
  ep3_emperor_yearly.2160.desc: "Những láng giềng  [nomad_neighbor.GetCulture.GetNameNoTooltip] của chúng ta gần đây đã trở thành một mối phiền toái không nhỏ. Lối sống du mục, #EMP hỗn loạn#! của họ khiến khái niệm biên giới trở nên mơ hồ và dễ xuyên qua, đến mức ngày càng có nhiều người trong số họ thường xuyên di chuyển từ [nomad_county.GetNameNoTier] sang [our_county.GetNameNoTier].\n\nBan đầu chỉ là vài con ngựa lang thang gặm cỏ, rồi cả đàn gia súc kéo tới, và giờ đây những ngôi làng thực thụ với đầy đủ gia đình cùng tài sản đã xuất hiện trong [our_county.GetNameNoTooltip].\n\nSức ép của các cộng đồng man di lên biên giới Đế quốc không phải là vấn đề mới, nhưng thời thế đã thay đổi."
  ep3_emperor_yearly.2160.a: "Họ được chào đón nếu muốn định cư tại đây."
  ep3_emperor_yearly.2160.a.tt: "Đế quốc có truyền thống lâu đời trong việc tiếp nhận và hội nhập mọi man di mong muốn định cư trên đất của mình."
  ep3_emperor_yearly.2160.b: "Điều này không thể chấp nhận được!"
  ep3_emperor_yearly.2160.b.flavor: "Ngươi nêu vấn đề này với thủ lĩnh của họ, [nomad_neighbor.GetTitledFirstNameNoTooltip]."
  ep3_emperor_yearly.2160.b.tt.success: "Ngươi giành phần thắng trong cuộc leo thang ngoại giao"
  ep3_emperor_yearly.2160.b.tt.failure: "Cán cân ngoại giao quay lưng lại với ngươi"
  ep3_emperor_yearly.2160.b.success: "Trao đổi ngoại giao tích cực"
  ep3_emperor_yearly.2160.b.failure: "Trao đổi ngoại giao tiêu cực"
  ep3_emperor_yearly.2160.b.tt: "[governor_efficiency|E] của ngươi tăng #P 5%#!"
  ep3_emperor_yearly.2160.b.tt2: "[governor_efficiency|E] của ngươi giảm #N 5%#!"
 # Secret Tunnels
  ep3_emperor_yearly.2170.t: "Những Đường Hầm Bí Mật"
  ep3_emperor_yearly.2170.desc: "[our_county.GetNameNoTier] là một khu vực khó khăn, và sự kiểm soát của chúng ta đối với nó thường chỉ là mong manh. Người dân ở đó là những kẻ sống sót cứng cỏi, những người có kiến thức và sự làm chủ về địa thế vùng đất khắc nghiệt và hoang dã của họ là không ai sánh bằng.\n\nTrong việc này, họ được giúp đỡ bởi chính sự sáng tạo của mình: một mạng lưới đường hầm rộng lớn, những nơi trú ẩn bí mật, và các khu định cư dưới lòng đất nơi họ có thể dễ dàng biến mất bất cứ khi nào thời tiết trở nên khắc nghiệt, kẻ thù tấn công, hoặc những kẻ thu thuế của chúng ta đến gần, đòi hỏi những gì thuộc về [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]."
  ep3_emperor_yearly.2170.a: "Điều này có thể sẽ rất hữu ích..."
  ep3_emperor_yearly.2170.b: "Tập tục phi pháp này phải chấm dứt."
 # A Warm Meal?
  ep3_emperor_yearly.2180.t: "Một Bữa Ăn Ấm Áp?"
  ep3_emperor_yearly.2180.desc: "Hoàng hôn ập đến khi chúng ta còn đang băng qua vùng [location.Custom('GetTerrainTypePlural')] quanh [location.GetName], vẫn còn khá xa khu định cư gần nhất.\n\nDấu hiệu duy nhất của sự hiện diện con người trong nhiều dặm xung quanh là bức tường ngoài đáng sợ của thứ trông giống như một tư dinh."
  ep3_emperor_yearly.2180.desc_capital: "Hoàng hôn ập đến khi chúng ta vẫn còn cách xa những bức tường an toàn của [location.GetName].\n\nCác công trình phụ của một dinh thự xa hoa hiện ra trước mắt. Thật thư thái biết bao nếu được nghỉ qua đêm tại đây, tránh xa con đường bụi bặm trước khi hòa mình vào sự náo nhiệt của một Kinh đô vĩ đại!"
  ep3_emperor_yearly.2180.desc_fellow: "\n\nNếu trí nhớ ta không phản bội mình, vùng đất này hẳn thuộc về [event_host.GetTitledFirstName]. [event_host.GetSheHe|U] chắc chắn sẽ tỏ ra tử tế!"
  ep3_emperor_yearly.2180.desc_foreigner: "\n\nTiếc rằng ta không quen biết chủ nhân của vùng đất này. Mong rằng họ sẽ không từ chối những người hành hương nghèo khổ một bữa ăn ấm áp và một chỗ ngủ giản dị!"
  ep3_emperor_yearly.2180.a: "Chúng ta nên xin được tiếp đãi."
  ep3_emperor_yearly.2180.a.tt: "Chúng ta sẽ xem phản ứng họ ra sao."
  ep3_emperor_yearly.2180.b: "Không có thời gian để lãng phí."
  ep3_emperor_yearly.2181.desc: "Mặt trời vừa lặn xuống vùng đất [location.GetName] của ta thì một nhóm lữ khách ăn mặc lôi thôi xuất hiện trước cổng."
  ep3_emperor_yearly.2181.desc_fellow: "\n\n\"[ROOT.Char.GetFirstNameNoTooltip],  Bạn củata, nhân danh [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] đáng kính, người mà cả hai chúng ta đều trung thành phụng sự, xin hãy mở cửa tiếp đón những người hành hương khiêm nhường đang băng qua lãnh địa của ngươi!\""
  ep3_emperor_yearly.2181.desc_foreigner: "\n\n\"Thưa Chủ nhân của tòa dinh thự nguy nga này, Ta là [pilgrim.GetTitledFirstNameNoTooltip], nhưng hôm nay chỉ là một người hành hương khiêm nhường đi ngang qua vùng đất của Người! Xin Người rộng lòng ban cho chúng Ta một bữa ăn ấm và một chỗ ngủ qua đêm?\""
  ep3_emperor_yearly.2181.a: "Tất nhiên rồi, [ROOT.Char.GetFaith.HighGodName] phù hộ các ngươi!"
  ep3_emperor_yearly.2181.a_flavor: "Ngồi vào bàn của ta đi! Và sau bữa tối, ta còn sẽ chỉ cho các ngươi một lối tắt nữa, để các ngươi có thể kể với mọi người dọc đường rằng ta hiếu khách thế nào!"
  ep3_emperor_yearly.2181.b: "Các ngươi được chào đón tại nhà ta, và ta sẽ còn giúp đỡ thêm."
  ep3_emperor_yearly.2181.b_flavor: "Gia nhân của ta sẽ dẫn đường, và lính hộ vệ sẽ hộ tống các ngươi từ ngày mai."
  ep3_emperor_yearly.2181.c: "Lòng hiếu khách không phải là miễn phí."
  ep3_emperor_yearly.2181.a.tt: "Hiếu Khách Thân Thiện"
  ep3_emperor_yearly.2181.b.tt: "Hiếu Khách Tuyệt Hảo"
  ep3_emperor_yearly.2181.c.tt: "Từ Chối Hiếu Khách"
 # The Granaries of the Powerful
  ep3_emperor_yearly.2190.t: "Kho Thóc của Giới Quyền Thế"
  ep3_emperor_yearly.2190.desc: "Kho thóc của [Glossary( 'dynatoi', 'DYNATOI_GLOSS')] luôn đầy ắp, người nông dân trầm ngâm nói.\n\nTrong một vài trường hợp, điều này đúng hơn bao giờ hết; vào ngày này, ta đã chính thức triệu tập [landowner.GetTitledFirstName], chủ đất tại [capital.GetName], liên quan đến việc quản lý điền trang của [landowner.GetHerHis]. Theo các nguồn tin của ta, [landowner.GetFirstNameNoTooltip] đã mua một lượng lớn ngũ cốc với giá rẻ và tích trữ trong kho thóc của [landowner.GetHerHis], để bán lại với giá cao hơn trong thời điểm khan hiếm.\n\nThực hành này bị Đế quốc cấm, vì nó làm suy giảm thu nhập của những người nông dân nhỏ."
  ep3_emperor_yearly.2190.a: "Ngươi sẽ nhận lấy hình phạt thích đáng!"
  ep3_emperor_yearly.2190.b: "Ta #EMP có thể#! làm ngơ..."
  ep3_emperor_yearly.2190.c: "Ngươi thật sự không nên làm vậy."
  DYNATOI_GLOSS: "Giới Quyền Thế, đặc biệt là tầng lớp quý tộc địa phương độc chiếm đất đai và các chức vụ công."
 # The Emperor's Gold
  ep3_emperor_yearly.2200.t: "Vàng Của Hoàng Đế"
  ep3_emperor_yearly.2200.desc: "Nếu có ai đó hoàn toàn không xứng ngồi trên ngai Hoàng đế, thì chắc chắn là [liege.GetFirstName].\n\n[governorship.GetName] phải lao động và chịu khổ, và mọi thuế của ta đều rơi vào tay kẻ lười biếng ở [capital.GetNameNoTier]. Trừ khi...\n\nThuế của ta không #EMP nhất thiết phải#! đi đến đó; ta có thể sử dụng chúng tốt hơn nhiều..."
  ep3_emperor_yearly.2200.desc.c_monarch: "[liege.GetTitledFirstName] hoàn toàn không xứng dẫn dắt [ceremonial_monarch.GetTitleAsName]!\n\n[governorship.GetName] phải lao động và chịu khổ, và mọi thuế của ta đều rơi vào tay kẻ lười biếng ở [capital.GetNameNoTier]. Trừ khi...\n\nThuế của ta không #EMP nhất thiết phải#! đi đến đó; ta có thể sử dụng chúng tốt hơn nhiều..."
  ep3_emperor_yearly.2200.a: "[liege.GetSheHe|U] không xứng đáng với vàng của chúng ta."
  ep3_emperor_yearly.2200.b: "Lòng trung thành của ta thuộc về [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], chứ không phải [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]."
  ep3_emperor_yearly.2200.a.tt: "Trung thành Với Kẻ Không Xứng"
  ep3_emperor_yearly.2200.b.tt: "Trung thành Với Đế Chế"
 # A Prophecy of Power
  ep3_emperor_yearly.2210.t: "Lời Tiên Tri về Quyền Lực"
  ep3_emperor_yearly.2210.desc: "Đêm qua ta đã mơ thấy một giấc mộng: một bàn tay siêu phàm từ trên Trời giáng xuống, đặt một chiếc vương miện lên đầu ta, cùng với một giọng nói uy nghi phán rằng: \"Hãy đi! Ta ban cho ngươi [potential_title.GetName]!\"\n\nCó lẽ đó chỉ là sản phẩm của tham vọng... Nhưng nếu ta có thể thuyết phục [liege.GetTitledFirstName] rằng đây là một dấu hiệu thực sự từ Thượng giới, một lời tiên tri thì sao?"
  ep3_emperor_yearly.2210.desc_believe: "Kẻ ngốc đó sẽ tin #EMP bất cứ thứ gì#!, đúng không [liege.GetSheHe]?"
  ep3_emperor_yearly.2210.desc_jacob: "\n\nDù sao thì chẳng phải Thiên Chúa đã hiện đến với Jacob trong giấc mơ để ban cho ông Đất Hứa đó sao?"
  ep3_emperor_yearly.2210.a: "Đáng để thử!"
  ep3_emperor_yearly.2210.a.tt: "Quyết định thuộc về Chủ quân của ngươi."
  ep3_emperor_yearly.2210.a.success: "Ngươi thuyết phục được Chủ quân"
  ep3_emperor_yearly.2210.a.success.tt: "Lời Tiên Tri Được Tin"
  ep3_emperor_yearly.2210.a.failure: "\"Lời tiên tri\" của ngươi không được tin"
  ep3_emperor_yearly.2210.a.failure.tt: "Lời Tiên Tri Bị Bác Bỏ"
  ep3_emperor_yearly.2210.b: "Ta không cần mấy thứ nhảm nhí này."
  ep3_emperor_yearly.2211.desc: "Ta khá bất ngờ khi [vassal.GetTitledFirstName] xuất hiện trước mặt, buộc ta phải tiếp kiến riêng.\n\n\"Hỡi [ROOT.Char.GetTitleAsNameNoTooltip|U] vĩ đại, [vassal.GetFaith.HighGodName] đã ban cho ta một giấc mộng — không phải #EMP chỉ#! là mộng — mà là một #EMP lời tiên tri#!!\"\n\n\"Ta được chọn làm [potential_title.GetHolder.GetTitleAsNameNoTooltip] tiếp theo của [potential_title.GetName]! Các [vassal.GetFaith.PriestNeuterPlural] uyên bác nhất đã xác nhận điều đó.\""
  ep3_emperor_yearly.2211.a: "#EMP Một dấu hiệu chân thực từ Thượng giới!#!"
  ep3_emperor_yearly.2211.b: "Ta không thể hoàn toàn phớt lờ dấu hiệu này."
  ep3_emperor_yearly.2211.c: "Giá trị của ngươi phải được chứng minh bằng hành động, không phải giấc mơ!"
  ep3_emperor_yearly.2211.d: "[vassal.GetFirstNameNoTooltip] chỉ muốn mua vui bằng mấy lời nhảm nhí!"
 # Crowded Lands
  ep3_emperor_yearly.2220.t: "Đất Đai Đông Đúc"
  ep3_emperor_yearly.2220.desc: "\"Tâu [ROOT.Char.GetTitleAsNameNoTooltip|U], một bức thư khiếu nại vừa được gửi đến từ cộng đồng tu viện tại [monastery.GetName].\" [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến lại gần.\n\n\"Dường như các mục đồng từ [shepherd_province.GetName] lân cận đã xâm nhập vào đất của tu viện, không chỉ mang theo đàn gia súc mà còn cả gia đình của họ!\"\n\n\"Các tu sĩ vô cùng phẫn nộ trước sự bẩn thỉu, ồn ào và #EMP trụy lạc#! của những hàng xóm mới này, và khẩn cầu Người can thiệp.\""
  ep3_emperor_yearly.2220.a: "Các mục đồng có quyền lang thang."
  ep3_emperor_yearly.2220.b: "Các tu sĩ cần sự tách biệt!"
  ep3_emperor_yearly.2220.c: "Đó là vấn đề của họ."
 # The Value of Coin
  ep3_emperor_yearly.2230.t: "Giá Trị của Đồng Tiền"
  ep3_emperor_yearly.2230.desc: "Giống như mọi thành phố đáng kể khác, [city.GetNameNoTier] đã thu hút một đám đông thương nhân đủ mọi sắc màu từ khắp [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], và cả bên ngoài biên giới.\n\nỞ đâu có cơ hội kiếm lời, ở đó có thương nhân kéo đến, mang theo hàng hóa và tiền tệ ngoại bang, cùng những phong tục, tín ngưỡng và ngôn ngữ xa lạ. Trái lại, đám đông địa phương thì thất thường; họ yêu thích những kẻ mang đến các món [ROOT.Char.Custom('GetExpensiveDessert')] lạ lẫm, nhưng sâu thẳm vẫn khinh miệt họ.\n\nKhông rõ sự kiện nào đã châm ngòi cho ngày hôm nay — có lẽ chỉ là một hiểu lầm nhỏ — nhưng dân chúng đã cầm vũ khí tự chế và nổi loạn tại khu thương nhân."
  ep3_emperor_yearly.2230.a: "Ta sẽ điều quân đàn áp."
  ep3_emperor_yearly.2230.b: "Hỗn loạn chỉ sinh ra cơ hội!"
  ep3_emperor_yearly.2230.c: "Dân chúng sẽ nghe lời ta."
  ep3_emperor_yearly.2230.c_success: "Ngươi trấn an được đám đông"
  ep3_emperor_yearly.2230.c_success.tt: "Thành Phố Được Bình Định"
  ep3_emperor_yearly.2230.c_failure: "Dân chúng không nghe theo ngươi"
  ep3_emperor_yearly.2230.c_failure.tt: "Bạo Loạn Tiếp Diễn"
 # As The Philosopher Said...
  ep3_emperor_yearly.2240.t: "Như Bậc Hiền Triết Đã Nói..."
  ep3_emperor_yearly.2240.desc_quote_a: ""[Glossary( 'Panta rhei', 'PANTA_RHEI_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] thốt lên buồn bã khi một người hầu vấp ngã và hũ nước trên tay họ đổ nội dung xuống đất. Đó #EMP không#! phải là ý nghĩa của câu đó!"
  ep3_emperor_yearly.2240.desc_quote_b: ""[Glossary( 'Ho bíos brakhús, he dè tékhne makré', 'ARS_LONGA_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] thở dài khi [the_scholar.GetSheHe] gạch bỏ một dòng trong vài ghi chú lộn xộn. Khi nào thì [the_scholar.GetSheHe] thậm chí đã gia nhập cùng ta vậy?!"
  ep3_emperor_yearly.2240.desc_quote_c: ""[Glossary( 'Sophòn to saphés', 'SOPHON_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] lầm bầm khi [the_scholar.GetSheHe] thất bại — một lần nữa — trong việc tuân theo một số chỉ dẫn cơ bản."
  ep3_emperor_yearly.2240.desc_quote_latin: ""[Glossary( 'Omnia vincit amor', 'AMOR_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] lên giọng với vẻ mặt trang nghiêm. Điều đó liên quan gì đến những gì chúng ta đang nói vậy?!"
  ep3_emperor_yearly.2240.desc_quote_confucius: ""[Glossary( 'Người quân tử khiêm tốn trong lời nói nhưng vượt trội trong hành động.', 'CONFUCIUS_GLOSS' )]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] lên giọng với vẻ mặt trang nghiêm. Điều đó liên quan gì đến những gì chúng ta đang nói vậy?!"
  ep3_emperor_yearly.2240.desc_outro: "\n\n[the_scholar.GetSheHe|U] #EMP luôn luôn#! trích dẫn Cổ Nhân và nhét chúng vào mặt người khác không cần thiết — và thường trong bối cảnh sai hoặc dùng sai từ...\n\nNhiều người xung quanh than thở và lắc đầu. Một nền giáo dục Cổ điển vững chắc là điều cần thiết cho một nhân vật công chúng, nhưng sẽ trở nên vô ích nếu không biết dùng khôn ngoan."
  ep3_emperor_yearly.2240.a: "#EMP Thật ra#!, câu trích dẫn đúng là..."
  ep3_emperor_yearly.2240.a.flavor: "Ngươi cố cho [the_scholar.GetFirstNameNoTooltip] biết chỗ đứng của [the_scholar.GetHerHis] bằng cách chỉ ra lỗi sai của [the_scholar.GetSheHe]."
  ep3_emperor_yearly.2240.a_success: "Hiểu biết của ngươi vượt trội hơn [the_scholar.GetHersHis]"
  ep3_emperor_yearly.2240.a_success.tt: "[the_scholar.GetFirstNameNoTooltip] Bẽ Mặt!"
  ep3_emperor_yearly.2240.a_failure: "Ngươi trông ngu xuẩn hơn [the_scholar.GetHerHim]"
  ep3_emperor_yearly.2240.a_failure.tt: "Bẽ Mặt Trước Công Chúng"
  ep3_emperor_yearly.2240.b: "#EMP Im Ngay Đi!#!"
  ep3_emperor_yearly.2240.c: "Ta không có thời gian cho chuyện này."
  PANTA_RHEI_GLOSS: ""Mọi thứ đều lưu chuyển" là một câu nổi tiếng trong triết lý vũ trụ của Heraclitus."
  ARS_LONGA_GLOSS: ""Cuộc đời ngắn, nghề dài để học" là một châm ngôn được gán cho Hippocrates."
  SOPHON_GLOSS: ""Trí tuệ nằm ở sự minh bạch," trích từ Euripides."
  AMOR_GLOSS: ""Tình yêu chinh phục tất cả" là một câu nổi tiếng và thường bị trích dẫn sai của Virgil."
 # The Times Are Changing
  ep3_emperor_yearly.2300.t: "Thời Thế Đang Thay Đổi"
  ep3_emperor_yearly.2300.desc: "Với một nghi lễ long trọng tại [capital.GetBaronyNameExplicitly], [liege_loc.GetTitledFirstName] đã chính thức tuyên bố [liege_loc.GetFaith.GetName] là quốc giáo của [liege_loc.GetPrimaryTitle.GetName].\n\nNgay lập tức, những sứ giả nhanh nhất đã được phái đi khắp mọi ngóc ngách của Đế chế, truyền bá tin tức và yêu cầu toàn thể thần dân phải cải đạo."
  ep3_emperor_yearly.2300.a: "Thật quá đáng! Báng bổ!"
  ep3_emperor_yearly.2300.b: "[liege_loc.GetTitleAsNameNoTooltip] hẳn là có lý."
  ep3_emperor_yearly.2300.c: "Cuối cùng thì cũng đến lúc!"
 # Unfaithful People
  ep3_emperor_yearly.2310.t: "[liege_loc.Custom2('AppropriateGreeting', ROOT.Char)]"
  ep3_emperor_yearly.2310.desc: "Ta được biết rằng vẫn còn quá nhiều thần dân trong vùng trấn nhậm của ngươi chưa theo đức tin chân chính, [liege_loc.GetFaith.GetName]. Bổn phận của ngươi là phải chấn chỉnh tình trạng này."
  ep3_emperor_yearly.2310.desc_you_too: "Và cả việc sửa lại niềm tin của chính ngươi nữa!"
  ep3_emperor_yearly.2310.a: "Họ sớm muộn gì cũng sẽ đón nhận chính đạo."
  ep3_emperor_yearly.2310.b: "Không, xin miễn."
  ep3_emperor_yearly.2310.c: "Ta sẽ bắt đầu từ chính mình."
  ep3_emperor_yearly.2310.d: "Ta sẽ suy nghĩ thêm."
 # A Matter of Faith
  ep3_emperor_yearly.2320.t: "Một Vấn Đề Đức Tin"
  ep3_emperor_yearly.2320.desc: "\"Ta rất vinh dự vì chuyến viếng thăm của ngài,\" ta nói cứng nhắc khi tiếp [hof.GetTitledFirstName]. \"Nhưng điều gì đã mang lại vinh hạnh này?\"\n\n\"Ta được biết rằng, dù có sự lãnh đạo của ngươi, [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] vẫn còn mò mẫm trong bóng tối, đi theo một quốc giáo sai lầm.\" [hof.GetTitleAsNameNoTooltip] ngừng lại đầy ẩn ý.\n\n\"Vì vậy, ta quyết định cùng tham gia với ngươi trong nỗ lực này và dốc toàn lực để lèo lái con thuyền quốc gia đi đúng hướng.\""
  ep3_emperor_yearly.2320.a: "Cảm tạ, Thánh Thượng."
  ep3_emperor_yearly.2320.b: "Nhưng nếu quốc giáo hiện tại là đúng thì sao?"
  hof_state_faith_discount: "Sự Hậu Thuẫn của Giáo Chủ"
  ep3_emperor_yearly.2320.a.tt: "Nhận giảm giá #P 30%#! cho quyết định Đổi Quốc Giáo trong vòng 10 năm"
  every_vassal_state_faith: "Mọi chư hầu theo Quốc Giáo"
 # Heresy Brewing
  ep3_emperor_yearly.2330.t: "Dị Giáo Đang Manh Nha"
  ep3_emperor_yearly.2330.desc: "Không thể phủ nhận được nữa. Quốc giáo của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] đang đối mặt với một cuộc khủng hoảng.\n\n"
  ep3_emperor_yearly.2330.desc_hof: "[hof.GetTitledFirstName|U] đã cùng ta gặp gỡ hôm nay để bàn về một vấn đề vô cùng nghiêm trọng: cuộc khủng hoảng của quốc giáo tại [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip].\n\n\"Ngươi không thể chối bỏ điều này, [ROOT.Char.GetFirstNameNoTooltip]! Ngươi cũng thấy rõ mà!\""
  ep3_emperor_yearly.2330.desc_end: "Dấu hiệu ở khắp nơi: con người sống trong tội lỗi, [ROOT.Char.GetFaith.ReligiousText] bị lãng quên và coi thường, còn dị giáo thì đang âm thầm nảy nở trong mọi góc tối!\""
  ep3_emperor_yearly.2330.desc_end_hof: "Quyền lực thế tục và tôn giáo phải hợp lực để cứu lấy con dân của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
  ep3_emperor_yearly.2330.a: "Chúng ta phải làm gì đó!"
  ep3_emperor_yearly.2330.a.tt: "Ta sẽ đầu tư vào việc truyền bá chính đạo trong dân chúng!"
  ep3_emperor_yearly.2330.b: "Có lẽ cũng không nghiêm trọng đến vậy..."
  state_faith_fervor_campaign: "Ủng Hộ Quốc Giáo"
 # Heresy Among Us?
  ep3_emperor_yearly.2340.t: "Dị Giáo Trong Nội Bộ?"
  ep3_emperor_yearly.2340.desc: "\"Ai cũng biết rằng ngươi không theo đức tin mà Đế chế và các Tổ Tiên đã truyền lại,\" [complainer.GetTitledFirstName] quở trách ta bằng giọng khinh miệt.\n\n\"Nhiều người tự hỏi liệu ngươi có xứng đáng với tước vị đang mang hay không. Rốt cuộc, làm sao ngươi có thể dẫn dắt dân chúng đến ánh sáng khi chính bản thân còn bước đi trong bóng tối?\"\n\n\"Ta cầu xin ngươi, hãy đón nhận chính đạo, [complainer.GetFaith.GetName]!\""
  ep3_emperor_yearly.2340.a: "Có lẽ ta nên thuận theo..."
  ep3_emperor_yearly.2340.b: "Những lời lảm nhảm dị giáo của ngươi không lay chuyển được ta."
  every_fellow_vassal_state_faith: "Mọi chư hầu đồng cấp theo Quốc Giáo"
 # In the Bud - You are not a Powerful family version
  ep3_emperor_yearly.2400.t: "$ep3_powerful_families.8020.t$"
  ep3_emperor_yearly.2400.desc: "Khắp vương quốc, quyền lực của một gia tộc mới dường như đang bén rễ. Như cỏ dại, họ lan tỏa ảnh hưởng đến mọi tầng lớp xã hội, và hiếm có ngày nào trôi qua mà không nghe đến cái tên \"[new_family.GetHouse.GetBaseName]\".\n\nGia tộc quyền thế thì luôn có kẻ lên người xuống trong các đế chế lớn; chẳng có lý do gì để ta phải lo lắng hay hành động cả. Thế nhưng, một giọng nói dai dẳng trong đầu thì thầm: \"Nếu đó là chúng ta thì sao?\""
  ep3_emperor_yearly.2400.a: "Ngày của chúng ta rồi sẽ đến."
  8020_powerful_family_tt: "Gia Tộc Quyền Thế Mới"
  8020_powerful_family_desc: "[house|E] [new_family.GetHouse.GetBaseName|V] giờ được coi là một [powerful_family|E] của [new_family.GetTopLiege.GetPrimaryTitle.GetAdjective]"
 # In the Bud - Your family version
  ep3_emperor_yearly.2401.t: "$ep3_powerful_families.8020.t$"
  ep3_emperor_yearly.2401.desc: "Trong số vô vàn gia tộc có cội nguồn cao quý giữa thần dân của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName|l], chỉ có rất ít được ngồi vào bàn của [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], chia sẻ trách nhiệm và vinh dự lèo lái quốc gia.\n\nÍt ai thực sự có #EMP quyền lực#!, nhưng hôm nay, Gia tộc [ROOT.Char.GetHouse.GetBaseName] đã là một trong số đó!"
  ep3_emperor_yearly.2401.a: "Thời đại của nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] đã đến!"
 # New Nobility
  ep3_emperor_yearly.2410.t: "Quý Tộc Mới"
  ep3_emperor_yearly.2410.desc: "Một cái tên mới đã xuất hiện giữa các đại địa chủ của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName|l]: gia tộc [new_title.GetHolder.GetHouse.GetBaseName] đã giành được quyền được xem là tầng lớp quý tộc — bằng tham nhũng, mưu mô, hay thực tài, ta cũng không rõ.\n\nNhưng điều đó chẳng quan trọng. Ta tin rằng họ cũng chỉ như một hạt cát, sớm bị cuốn phăng bởi những cơn gió dữ dội của lịch sử — và bước tiến không thể cưỡng lại của Nhà [ROOT.Char.GetHouse.GetBaseName]!"
  ep3_emperor_yearly.2410.a: "Hừ. #EMP Bọn tỉnh lẻ.#!"
  2410_noble_family_tt: "Gia Tộc Quý Tộc Mới"
  2410_noble_family_tt_desc: "[new_title.GetHolder.GetShortUIName|U] đã thành lập [noble_family|E] [new_title.GetHolder.GetTopLiege.GetPrimaryTitle.GetAdjective] của Nhà [new_title.GetHolder.GetHouse.GetBaseName|V]."
 # The Shadow Behind The Throne
  ep3_emperor_yearly.2420.t: "Cái Bóng Sau Ngai Vàng"
  ep3_emperor_yearly.2420.desc: "Tham lam và đầy quyền lực, những bàn tay của Nhà [noble_family_head.GetHouse.GetBaseName] vươn ra như những xúc tu bao trùm mọi ngóc ngách của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetName].\n\nGiờ thì ai cũng thấy rõ rằng ngay cả kẻ ngồi trên ngai vàng đế chế cũng không thể cao hơn họ; chính họ mới là những kẻ thực sự làm chủ vùng đất này, thống trị đời sống chính trị và kinh tế của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  2420_noble_family_tt: "Gia Tộc Thống Trị Mới"
  2420_noble_family_tt_desc: "Gia tộc [noble_family_head.GetHouse.GetBaseName] giờ được coi là [dominant_family|E] tại [noble_family_head.GetTopLiege.GetPrimaryTitle.GetName|l]."
  ep3_emperor_yearly.2420.a: "Tin tức đáng lo ngại."
