  hasan_stroy_cycle_ultimate_foe: "Phải tiến triển trên con đường của Giáo phái Sát thủ ít nhất #V 15#! lần hoặc [caliph.GetName] đã chết, và Ngài đã chọn một kẻ thù tối thượng của [hasan.GetFaith.GetName] #weak (tiến độ hiện tại: [radical_points])#!"
