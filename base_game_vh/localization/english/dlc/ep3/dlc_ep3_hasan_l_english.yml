l_english:
 # Decisions
  hasan_evangelize_the_faith: "Truyền bá Đức tin"
  hasan_evangelize_the_faith_desc: "Thiên mệnh của ta là truyền bá lời của Allah và vị tiên tri được Người tuyển chọn."
  hasan_evangelize_the_faith_tooltip: "Cố gắng truyền bá [faith|E] của Ngài tại một quận lân cận"
  hasan_evangelize_the_faith_confirm: "Tiến hành thuyết giáo"
  hasan_agitate_the_populace: "Kích động Dân chúng Địa phương"
  hasan_agitate_the_populace_desc: "Không phải tất cả mọi người trong cõi đều nhận thức được sự tà ác của những kẻ cai trị họ. Vài lời từ thánh kinh sẽ đưa họ đi đúng hướng."
  hasan_agitate_the_populace_tooltip: "Cố gắng làm giảm [county_opinion|E] của một quận lân cận."
  hasan_agitate_the_populace_confirm: "Họ sẽ thấy được chân lý"
  hasan_ignite_the_flames: "Khởi đầu Cuộc Cách mạng"
  hasan_ignite_the_flames_desc: "Những tín đồ đã tề tựu, và thời khắc chấm dứt sự đồi bại thống trị vùng đất này đã đến."
  hasan_ignite_the_flames_tooltip: "Tuyên bố một [war|E] để giải thể đế quốc"
  hasan_ignite_the_flames_confirm: "Thời khắc của chúng ta đã tới"
  hasan_found_the_assassins: "Thành lập Giáo phái Sát thủ"
  hasan_found_the_assassins_desc: "Những kẻ báng bổ và dị giáo hoành hành khắp nơi, và đã rõ rằng lời nói không còn đủ để cảm hóa họ. Đã đến lúc nâng cuộc xung đột thần học này lên thành xung đột quân sự, và kẻ thù của đức tin sẽ phải đối mặt với lưỡi gươm."
  hasan_found_the_assassins_tooltip: "Thành lập một [holy_order|E] để bảo vệ [faith|E] của Ngài"
  hasan_found_the_assassins_confirm: "Bismillah!"
  hasan_expand_the_assassins: "Mở rộng Giáo phái Sát thủ"
  hasan_expand_the_assassins_desc: "Chúng ta cần thêm các lãnh địa để mở rộng ảnh hưởng của Giáo phái Sát thủ. Từ đó, sự sụp đổ của bọn báng bổ sẽ lộ rõ."
  hasan_expand_the_assassins_tooltip: "Mở rộng [holy_order|E] của Ngài"
  hasan_expand_the_assassins_confirm: "Một mái nhà mới"
 # Story Cycle
  ULTIMATE_FOE: "Đại Kình Địch"
  story_hasan: "Huyền thoại về Hasan Sabbah"
  story_hasan_desc: "Hơn cả những đội quân, sức mạnh của đức tin có thể lật đổ các đế chế và dệt nên những trang sử mới! Liệu Ngài sẽ thiết lập hội Sát thủ (Assassins) và giải phóng thần dân khỏi ách thống trị của người Seljuk? Liệu Ngài có thể vươn mình trở thành 'Sơn Trung Lão Nhân' huyền thoại?"
  PROGRESS_TOWARDS_ASSASSIN_PATH: "Tiến trình trở thành Sát thủ"
 # Events
  hasan_sabbah.1000.t: "Những Nhà Thuyết giáo [GetFaithByKey('ismaili').GetAdjectiveNoTooltip|U]"
  hasan_sabbah.1000.desc: "[amira.GetName|U], một tín đồ và người theo chân Khalip Ai Cập, đã rao giảng cách hiểu Hồi giáo không chính thống của [amira.GetHerHis] ngay giữa trung tâm [location.GetName]. Ta chưa bao giờ nghi ngờ chân lý của Hồi giáo và [ROOT.Char.GetFaith.HighGodName|U], cũng chưa từng tin rằng chân lý ấy có thể tồn tại bên ngoài [ROOT.Char.GetFaith.GetName], nhưng lời nói của [amira.GetFirstNamePossessiveNoTooltip] lại vang lên khác lạ trong tai ta.\n\nTa dành phần lớn thời gian còn lại trong ngày để bàn luận thánh thư và hadith với [amira.GetFirstNameNoTooltip], và lần đầu tiên ta nghe thấy chân lý trong triết lý [GetFaithByKey('ismaili').GetAdjective|U]."
  hasan_sabbah.1000.a: "Ngươi đã làm tổn thương và xuyên thủng niềm tin của ta."
  hasan_sabbah.1000.b: "Chân lý không thể được tìm thấy ngoài khuôn khổ của Hồi giáo."
  hasan_sabbah.1010.t: "Truyền giáo [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U]"
  hasan_sabbah.1010.desc: "Dân chúng tụ họp quanh ta tại trung tâm [location.GetNameNoTier], ánh mắt họ u tối vì thiếu vắng ánh sáng của [ROOT.Char.GetFaith.HighGodNamePossessive|U].\n\nThuộc lòng các đoạn trong [ROOT.Char.GetFaith.ReligiousText|U], ta bắt đầu cất lời..."
  hasan_sabbah.1010.a: "Nhân danh [ROOT.Char.GetFaith.HighGodName|U], đấng khoan dung và từ bi nhất..."
  hasan_sabbah.1010.a.win: "Đám đông đã bị thuyết phục"
  hasan_sabbah.1010.a.lose: "Đám đông không bị thuyết phục"
  hasan_sabbah.1020.t: "Lời Kêu gọi Thiêng liêng"
  hasan_sabbah.1020.desc: "Hôm nay, một sứ giả từ [ismaili_caliph.GetName] chào ta bằng một cái cúi đầu lễ độ và mang theo thông điệp.\n\n\"Khalip đã nghe về những lao động to lớn của ngài nơi đây, và mong ngài tiếp tục việc học tập với tư cách là một nhà truyền giáo [ismaili_caliph.GetFaith.GetAdjective] tại [cairo.GetNameNoTier].\""
  hasan_sabbah.1020.a: "[ROOT.Char.GetFaith.HighGodName|U] đã sắp đặt cho ta nơi đó."
  hasan_sabbah.1020.a.tt: "Ngài sẽ lên đường tới [cairo.GetProvince.GetBaronyNameExplicitly]"
  hasan_sabbah.1020.b: "Ta được cần đến nhất ở nơi này."
  hasan_sabbah.1022.t: "Vương triều Khalip [GetFaithByKey('ismaili').GetAdjectiveNoTooltip|U]"
  hasan_sabbah.1022.desc: "Ta đã đến nơi, và tình hình trong Khalip quốc quả thực đang ở mức tồi tệ. [nizar.GetFirstName|U], người kế vị hợp pháp và được ưu ái của [ismaili_caliph.GetNamePossessive], đã bị loại khỏi hàng kế vị. Rõ ràng đây không phải là điều vị tiên tri mong muốn cho tương lai của Hồi giáo.\n\nÂm mưu và dối trá của con người đã làm băng hoại sự sắp đặt của [ROOT.Char.GetFaith.HighGodNamePossessive|U], và điều gì đó phải được thực hiện!"
  hasan_sabbah.1022.a: "Ta đứng về phía [nizar.GetFirstNameNoTooltip|U]!"
  hasan_sabbah.1022.b: "Ta phải tiếp tục con đường của mình."
  hasan_sabbah.1030.t: "Cái chết của một Khalip"
  hasan_sabbah.1030.desc: "[ismaili_caliph.GetName|U] cuối cùng đã đoàn tụ với [ROOT.Char.GetFaith.HighGodName|U] và được yên nghỉ, nhưng những kẻ ở lại phải đối mặt với gánh nặng do sự vắng mặt của [ismaili_caliph.GetHerHis]. Thông qua mưu đồ chính trị và những thế lực vượt ngoài hiểu biết, "
  hasan_sabbah.1030.desc_caliph_heir: "$hasan_sabbah.1030.desc$ [new_ismaili_caliph.GetName] đã kế vị [ismaili_caliph.GetHerHim] $hasan_sabbah.1030.desc_outro$"
  hasan_sabbah.1030.desc_caliph_no_heir: "$hasan_sabbah.1030.desc$ Khalip quốc không có người kế vị $hasan_sabbah.1030.desc_outro$"
  hasan_sabbah.1030.desc_outro: ", và các tuyên bố của phe [GetFaithByKey('nizari').GetAdjective] đã bị phớt lờ.\n\nTa biết chắc rằng [nizar.GetName] là ứng viên được ưu tiên, nhưng nếu ta công khai lập trường, ta chắc chắn sẽ tự chuốc lấy kẻ thù."
  hasan_sabbah.1030.a: "Ta sẽ không diệt vong trong sự vô tín!"
  hasan_sabbah.1030.b: "[new_ismaili_caliph.GetFirstNameNoTooltip|U] là khalip chính danh."
  hasan_sabbah.1030.c: "Ta sẽ ủng hộ bất kỳ ứng viên [GetFaithByKey('ismaili').GetAdjective] nào."
  hasan_sabbah.1031.t: "Kẻ Thù của [ROOT.Char.GetFaith.GetNameNoTooltip|U]"
  hasan_sabbah.1031.desc: "Khi kết thúc bài thuyết giáo, ta nhìn ra đám đông những gương mặt đã được khai sáng đang nhìn lại ta. Tâm trí ta hướng về chủ nhân của họ, [seljuk_equivalent.GetFirstName], kẻ đã dẫn họ rời xa [ROOT.Char.GetFaith.HighGodName] ngay từ đầu. Trong khi [seljuk_equivalent.GetSheHe] hưởng thụ cuộc sống xa hoa, thần dân của [seljuk_equivalent.GetHerHis] lại lấm lem trong bùn đất, bị che khuất khỏi chân lý của đấng toàn năng.\n\nTa không thể chịu đựng điều này thêm nữa, và chỉ mong thấy dân chúng của [seljuk_equivalent.GetHerHis] được giải phóng khỏi [seljuk_equivalent.GetHerHim], đoàn kết trong triết lý [ROOT.Char.GetFaith.GetAdjective]!"
  hasan_sabbah.1031.a: "[seljuk_equivalent.GetSheHe|U] phải chết!"
  hasan_sabbah.1031.b: "Ta cảm nhận kẻ thù thực sự nằm ở nơi khác..."
  hasan_sabbah.1040.t: "Bài Thuyết giáo Sôi sục"
  hasan_sabbah.1040.desc: "Những ánh mắt thờ ơ, uể oải của đám đông trống rỗng nhìn về phía ta khi ta cầm [ROOT.Char.GetFaith.ReligiousText|U] và chuẩn bị cất lời."
  hasan_sabbah.1040.a: "[ultimate_foe.GetFirstNameNoTooltip|U] là hiện thân của [ROOT.Char.GetFaith.DevilName|U]!"
  hasan_sabbah.1040.a.win: "$hasan_sabbah.1010.a.win$"
  hasan_sabbah.1040.a.lose: "$hasan_sabbah.1010.a.lose$"
  hasan_sabbah.1050.t: "Lão Nhân Núi Thánh"
  hasan_sabbah.1050.desc: "Cuối cùng, đế quốc [defender.Custom2('InsultAdjective', ROOT.Char)] của [defender.GetNamePossessive] đã bị đẩy về [ROOT.Char.GetFaith.NegativeAfterLife], nơi nó thuộc về. Trong đống tro tàn của đế quốc, các tín đồ của ta trông cậy vào ta cho tương lai của họ, và cho tương lai của [ROOT.Char.GetFaith.GetName].\n\nGiữa cơn hỗn loạn do sự vắng mặt của [defender.GetFirstNamePossessiveNoTooltip], [hasan_home.GetName] đã chín muồi để chiếm lấy và có thể trở thành trung tâm cho mọi toan tính sau này của chúng ta trong khu vực."
  hasan_sabbah.1050.a: "Kỷ nguyên của [hasan_home.GetNameNoTierNoTooltip|U] bắt đầu từ đây."
  hasan_sabbah.1050.b: "Chúng ta tiếp tục cuộc chiến vĩnh cửu."
 # Modifiers
  ep3_agitated_populace: "Dân chúng Bị Kích động"
  ep3_agitated_populace_desc: "Gần đây, một nhà thuyết giáo có sức lôi cuốn đã tổ chức một buổi giảng đầy tính kích động, lên án sự tà ác của tầng lớp thống trị tại quận này."
  ep3_religious_doubts: "Nghi ngờ Tôn giáo"
  ep3_religious_doubts_desc: "Gần đây, một nhà truyền giáo có sức lôi cuốn đã rao giảng tôn giáo ngoại lai của mình tại tỉnh này. Dù không thể cải đạo phần lớn dân chúng, điều đó đã làm lung lay niềm tin của thường dân vào tôn giáo truyền thống."
