 #Legitimist

  laamp_legitimist_support_contract: "Ủng Hộ Chính Thống"
  laamp_legitimist_support_contract_contract: "$laamp_legitimist_support_contract$"
  laamp_legitimist_support_contract_desc_title: "Gửi đến người thừa kế hợp pháp,"
  laamp_legitimist_support_contract_desc: "Tin tức về yêu sách chính đáng của ngài đã lan truyền rộng khắp, tạo ra cơ hội để chúng ta bàn luận về sự ủng hộ của mình."
  laamp_legitimist_support_contract_request: "Theo đây, chúng Ta trân trọng mời ngài đến gặp mặt. Chúng ta sẽ cùng thảo luận về cách thức chúng Ta có thể hỗ trợ ngài trong sứ mệnh chính nghĩa của mình. Chúng Ta tin chắc rằng đôi bên sẽ đạt được sự đồng thuận về mức độ hỗ trợ to lớn mà chúng Ta có thể cung cấp — và một khoản thù lao khiêm tốn mà chúng Ta sẽ thu lại trong tương lai."


  ep3_laamps.8101.t: "$laamp_legitimist_support_contract$ — Quá Nhiều Yêu Sách"
  ep3_laamps.8101.desc: ""Chào mừng, à chào mừng. Thật mừng vì ngài đã đến," [petitioned_ruler.GetName] nói, khi ta được bí mật dẫn tới trước mặt [petitioned_ruler.GetHerHim].\n\n"Chúng ta có nhiều điều cần bàn. Nhưng trước hết, hãy giải quyết vấn đề trọng tâm của nỗ lực này. Ngài đang nắm trong tay nhiều yêu sách lên các tước vị khác nhau, và dù chúng Ta mong một ngày nào đó ngài sẽ đoạt lại tất cả, thì vẫn cần phải bắt đầu với một mục tiêu rõ ràng — nếu không, công sức sẽ bị lãng phí khi đuổi theo quá nhiều con chim bằng một mũi tên.\n\nTa nghe nói [title_2.GetName] vào thời điểm này trong năm khá dễ chịu, nhưng rốt cuộc, lựa chọn vẫn là của ngài. Vậy thì… sẽ là cái nào?""
  ep3_laamps.8101.a: "[title_1.GetName]"
  ep3_laamps.8101.a.desc: "Lựa chọn này không thể thay đổi về sau. Các cuộc thương lượng tiếp theo với những nhà bảo trợ khác cũng sẽ xoay quanh tước vị này."
  ep3_laamps.8101.b: "[title_2.GetName]"
  ep3_laamps.8101.c: "[title_3.GetName]"
  ep3_laamps.8101.d: "[title_4.GetName]"

  ep3_laamps.8102.t: "$laamp_legitimist_support_contract$ — Khúc Dạo Đầu"
  ep3_laamps.8102.desc: ""Chúng Ta có thể cung cấp vàng cùng những chiến binh tinh nhuệ nhất, đổi lại — giả sử — một nửa thu nhập hằng năm của [claimed_title.GetName]." [petitioned_ruler.GetName] rõ ràng không muốn lãng phí thời gian.\n\n"Chúng Ta nóng lòng được thấy đầu của [claimed_title.GetHolder.GetName] cắm trên ngọn giáo. À, và xin đừng làm chúng Ta chán ngấy khi ngài chắc chắn sẽ xin thêm — lòng khoan dung của chúng Ta cũng có giới hạn."\n\n#italic Ngài sẽ có [ROOT.Var('legitimist_turns').GetValue] lượt để thương lượng các điều khoản của thỏa thuận."
  ep3_laamps.8102.a: ""Điều quan trọng nhất, thưa Đức Ngài...""
  ep3_laamps.8102.a.desc: "Ngài bắt đầu thương lượng mà không đòi hỏi thêm"
  ep3_laamps.8102.b: "Làm [petitioned_ruler.GetHerHim] choáng ngợp bởi tài trí của Ngài."
  ep3_laamps.8102.b.desc: "Ngài bắt đầu thương lượng với mức hỗ trợ cao hơn"
  ep3_laamps.8102.c: "Làm [petitioned_ruler.GetHerHim] rối trí bằng những lời hoa mỹ."
  ep3_laamps.8102.c.desc: "Ngài có thêm lượt để thương lượng với [petitioned_ruler.GetName]"
  ep3_laamps.8102.d: "Thời gian chẳng bao giờ là lãng phí giữa những người Ngài!"
  ep3_laamps.8102.d.desc: "$ep3_laamps.8102.c.desc$"
  ep3_laamps.8102.e: ""Trước hết, hãy giải quyết một món nợ cũ.""
  ep3_laamps.8102.e.desc: "$ep3_laamps.8102.b.desc$"
  ep3_laamps.8102.b.success: "Ngài thuyết phục được [petitioned_ruler.GetShortUIName]"
  ep3_laamps.8102.b.failure: "Ngài mất một lượt thương lượng"

  ep3_laamps.8103.t: "$laamp_legitimist_support_contract$ — Tranh Luận"
  ep3_laamps.8103.intro_1: "[petitioned_ruler.GetName] chuyển tư thế trên ghế của [petitioned_ruler.GetHerHis], cái nhìn của [petitioned_ruler.GetHerHis] xuyên thấu qua bạn.\n\n"
  ep3_laamps.8103.intro_2: "Không khí thật căng thẳng, vì rủi ro rất cao. Từ tư thế của [petitioned_ruler.GetNamePossessive], bạn có thể hiểu vấn đề này quan trọng thế nào với [petitioned_ruler.GetHerHim].\n\n"
  ep3_laamps.8103.intro_3: "Nến đã được thay, đồ uống đã được châm đầy. Những người hầu của [petitioned_ruler.GetNamePossessive] đã rời đi mà không một lời thừa thãi, vì những người bề trên sắp lên tiếng.\n\n"
  ep3_laamps.8103.no_more_turns_flavor: ""Chúng ta đã nói đủ rồi," [petitioned_ruler.GetSheHe] nghiêm giọng. "Đây là đề nghị cuối cùng của chúng Ta. Hãy thể hiện sự khôn ngoan của ngài bằng cách chấp nhận.""
  ep3_laamps.8103.mid_1: ""Chúng Ta xem đây là nền móng cho một tương lai rực rỡ phía trước. Chúng Ta tin ngài có đủ khả năng để thực hiện — và chúng Ta không nhầm lẫn trong những đánh giá như vậy.""
  ep3_laamps.8103.mid_2: ""Phải, phải, điều này có thể thành công. Với ân sủng của [petitioned_ruler.GetFaith.HighGodNamePossessive], nó sẽ thành công! Sao ngài không đến với chúng Ta sớm hơn? Ngài cần cải thiện khả năng nắm bắt thời cơ, nếu muốn thành công.""
  ep3_laamps.8103.mid_3: ""Ha! Ta ước gì được thấy vẻ mặt của [claimed_title.GetHolder.GetName] khi ngài ung dung tiến vào [capital_barony.GetNameNoTier] cùng quân đội của chúng Ta. Hãy đảm bảo có người ghi lại từng chi tiết.""
  ep3_laamp.8103.turns_left: "\n\n#italic Ngài còn #color_yellow [ROOT.Var('legitimist_turns').GetValue] #!lượt thương lượng"
  ep3_laamps.8103.support_6: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] hứa cung cấp #EMP #color_yellow Hỗ trợ Áp đảo#! — #color_yellow 1800 vàng và 3000 quân tinh nhuệ.#!"
  ep3_laamps.8103.support_5: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] hứa cung cấp #EMP #color_yellow Hỗ trợ Hùng Hậu#! — #color_yellow 1500 vàng và 2500 quân tinh nhuệ.#!"
  ep3_laamps.8103.support_4: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] hứa cung cấp #EMP #color_yellow Hỗ trợ Đáng Kể#! — #color_yellow 1200 vàng và 2000 quân tinh nhuệ.#!"
  ep3_laamps.8103.support_3: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] hứa cung cấp #EMP #color_yellow Hỗ trợ Lớn#! — #color_yellow 900 vàng và 1500 quân tinh nhuệ.#!"
  ep3_laamps.8103.support_2: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] hứa cung cấp #EMP #color_yellow Hỗ trợ Vừa Phải#! — #color_yellow 600 vàng và 1000 quân tinh nhuệ.#!"
  ep3_laamps.8103.support_1: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] hứa cung cấp #EMP #color_yellow Hỗ trợ Chuẩn#! — #color_yellow 300 vàng và 500 quân tinh nhuệ.#!"
  ep3_laamps.8103.obligations: "\n#italic Sau khi chiếm được [claimed_title.GetName], Ngài sẽ phải thanh toán #color_yellow [ROOT.Var('legitimist_obligations').GetValue] #!lần mỗi hai năm, mỗi lần bằng #color_yellow một nửa thu nhập hằng năm của Ngài.#!"
  ep3_laamps.8103.one_obligations: "\n#italic Sau khi chiếm được [claimed_title.GetName], Ngài sẽ phải trả #color_yellow một nửa thu nhập hằng năm.#!"
  ep3_laamps.8103.a: "Vẫn cần nhiều hơn nữa."
  ep3_laamps.8103.a.desc: "Ngài nhận thêm hỗ trợ ngay bây giờ, đổi lại nghĩa vụ thanh toán nhiều hơn về sau."
  ep3_laamps.8103.b: "Vinh quang còn giá trị hơn vàng!"
  ep3_laamps.8103.b.desc: "Ngài thuyết phục [petitioned_ruler.GetNameNoTooltip] cung cấp thêm hỗ trợ mà không tăng nghĩa vụ thanh toán"
  ep3_laamps.8103.b.success: "$ep3_laamps.8102.b.success$"
  ep3_laamps.8103.b.failure: "$ep3_laamps.8102.b.failure$"
  ep3_laamps.8103.c: "Ta không thể hút cạn vương quốc của mình!"
  ep3_laamps.8103.c.desc: "Ngài cố thuyết phục [petitioned_ruler.GetNameNoTooltip] giảm số lần thanh toán đi một."
  ep3_laamps.8103.c.success: "$ep3_laamps.8102.b.success$"
  ep3_laamps.8103.c.failure: "$ep3_laamps.8102.b.failure$"
  ep3_laamps.8103.d: "Điều đó... có thể chấp nhận."
  ep3_laamps.8103.d.desc: "@warning_icon! #color_red Tùy chọn này sẽ kết thúc thương lượng#!"

  ep3_laamps.8105.t: "$laamp_legitimist_support_contract$ — Kết Cục"
  ep3_laamps.8105.desc: "Hai nhà cai trị bị khóa chặt trong một cuộc đàm phán nảy lửa, một người với vương miện trên thái dương [petitioned_ruler.GetHerHis], trong khi tôi vẫn chưa có gì. Nhưng liệu đó là sự mệt mỏi tôi cảm thấy, sức nặng đột ngột trên đầu tôi, hay vương miện của [claimed_title.GetName] đã quá gần?\n\nMột cái nhăn mặt chắc hẳn đã phản bội suy nghĩ của tôi, khi [petitioned_ruler.GetName] mỉm cười đầy ẩn ý. "Một [claimed_title.GetHolder.GetTitleAsNameNoTooltip] tuyệt vời ngài sẽ trở thành, và sớm thôi — nhiều nhất là bốn năm. Quân đội và vàng bạc của chúng ta sẽ đảm bảo điều đó. Và làm ơn, đừng lo lắng, Chúng ta sẽ nhắc nhở nếu ngài... lỡ quên mất phần việc của mình trong thỏa thuận."\n\n[petitioned_ruler.GetSheHe|U] nâng ly của [petitioned_ruler.GetHerHis], một lời chúc mừng cuối cùng để chốt giao kèo."
  ep3_laamps.8105.a: "Kiên nhẫn là chìa khóa trong quân sự."
  ep3_laamps.8105.a.desc: "Ngài xin thêm thời gian để chuẩn bị chiến tranh."
  ep3_laamps.8105.a.success: "Ngài có 8 năm để giành lấy [claimed_title.GetName]"
  ep3_laamps.8105.a.failure: "Ngài có 4 năm để giành lấy [claimed_title.GetName]"
  ep3_laamps.8105.b: "Vì tương lai của [claimed_title.GetNameNoTooltip]!"
  ep3_laamps.8105.b.desc: "Ngài chấp nhận các điều khoản. $ep3_laamps.8105.a.failure$"
  ep3_laamps.8105.c: "Thật là lãng phí thời gian."
  ep3_laamps.8105.c.desc: "@warning_icon! #color_red Ngài phá vỡ thương lượng.#! [petitioned_ruler.GetName] sẽ không ủng hộ Ngài, và chắc chắn đánh giá Ngài thấp hơn."
  ep3_laamps.8105.invalidations_reasons: "@warning_icon! #color_red Việc trở thành lãnh chúa với tước vị khác [claimed_title.GetName] hoặc thay đổi mục tiêu trại sẽ hủy bỏ thỏa thuận.#!\nNgười thừa kế của [petitioned_ruler.GetPrimaryTitle.GetName] sẽ kế thừa các nghĩa vụ. #weak Có thể vẫn có cách để lách luật và trốn tránh việc thanh toán..."

  ep3_laamps.8106.t: "$laamp_legitimist_support_contract$ — Thời Khắc Đã Đến"
  ep3_laamps.8106.desc: "Nhiều năm trước, [petitioned_ruler.GetName] đã cung cấp cho tôi những binh lính và vàng bạc xuất sắc để giúp tôi đòi lại những gì thuộc về mình.\n\nNgai vàng của [claimed_title.GetName] — đang bị kẻ tiếm quyền đê tiện [claimed_title.GetHolder.GetShortUIName] chiếm giữ!\n\n[petitioned_ruler.GetShortUIName] mong đợi tôi sớm tấn công và ngày càng mất kiên nhẫn. Nhưng lực lượng của tôi đã sẵn sàng chưa? Tôi đã đảm bảo đủ sự hỗ trợ chưa? Người dân ở [claimed_title.GetName] đã khóc đủ cho sự trở lại đầy vinh quang của tôi chưa?"
  ep3_laamps.8106.a: "[claimed_title.GetHolder.GetShortUIName] sẽ nếm mùi thép lạnh!"
  ep3_laamps.8106.a.desc: "Chúng ta phải hành động, nếu muốn sống trong một thế giới khác."
  ep3_laamps.8106.b: "Thời điểm vẫn chưa chín muồi."
  ep3_laamps.8106.b.success: "$ep3_laamps.8102.b.success$"
  ep3_laamps.8106.b.failure: "Nghĩa vụ của Ngài đã tăng lên"
  ep3_laamps.8106.b.desc: "Ngài có thêm 2 năm để giành lấy [claimed_title.GetName]"
  ep3_laamps.8106.c: "Ta thấy vận mệnh mình ở nơi khác."
  ep3_laamps.8106.c.desc: "@warning_icon! Ngài phá vỡ thỏa thuận. [petitioned_ruler.GetName] sẽ #EMP cực kỳ bất mãn"

  ep3_laamps.8107.t: "Tên [ROOT.Char.GetFirstName] Đáng Khinh,"
  ep3_laamps.8107.desc: "Không lời nào có thể diễn tả hết sự thất vọng của chúng ta dành cho ngươi. #EMP Đồ sâu bọ#! Chúng ta từng có một tương lai huy hoàng phía trước, và ngươi đã tự tay vứt bỏ tất cả.\nHãy xem như chúng ta vô cùng phẫn nộ — còn ngươi, chỉ là một con giòi. Tốt nhất hãy đủ khôn ngoan để biến mất khỏi cõi đời này, một cách lặng lẽ và thảm hại."
  ep3_laamps.8107.a: "Số phận đã rẽ sang lối khác."
  ep3_laamps.8107.a.desc: "Ngài đã thất bại trong việc giành lấy [claimed_title.GetName]"

  ep3_laamps.8108.t: "$laamp_legitimist_support_contract$ — Cái Giá Phải Trả"
  ep3_laamps.8108.desc: "Thật vui mừng biết bao khi tôi trở về đầy chiến thắng tại [claimed_title.GetName]! Sau bao nhiêu thời gian du hành trên những con đường khắc nghiệt, luôn là khách trên đất người, không nhà cửa, không danh phận xứng đáng, [claimed_title.GetTierAsNameNoTooltip] ngọt ngào của tôi. Cuối cùng, mọi thứ đã ổn thỏa, như lẽ ra phải thế ngay từ đầu. Tôi là một [ROOT.Char.GetTitleAsNameNoTooltip] hùng mạnh.\n\nTuy nhiên, có một cái gai trong bó hoa này. [petitioned_ruler.GetName], người đã giúp tôi rất nhiều để đạt được điều này, đòi tôi phải trả những gì chúng ta đã thỏa thuận từ bao năm trước. Chắc chắn, [ROOT.Char.GetHouse.GetNameNoTooltip] danh giá luôn trả các khoản nợ của [ROOT.Char.GetHerHis]?"
  ep3_laamps.8108.a: "[Glossary( 'Pacta Sunt Servanda', 'PACTA_SUNT_SERVANTA_GLOSS' )]"
  PACTA_SUNT_SERVANTA_GLOSS: "Tiếng Latin: “Khế ước đã ký thì phải được tôn trọng”"
  ep3_laamps.8108.payments_left: "#color_yellow Còn [petitioned_ruler.MakeScope.Var('legitimist_obligations_left').GetValue] #!khoản thanh toán"
  ep3_laamps.8108.no_payments_left: "Đây là khoản thanh toán cuối cùng cho [petitioned_ruler.GetName]."
  ep3_laamps.8108.b: "Ta sẽ trả — nhưng chưa phải lúc này."
  ep3_laamps.8108.b.desc: "Ngài trì hoãn khoản thanh toán sang năm sau. Dù vậy, Ngài vẫn sẽ phải trả đủ số tiền đã thỏa thuận."
  ep3_laamps.8108.b.success: "Ngài đưa ra được lập luận thuyết phục"
  ep3_laamps.8108.b.failure: "Lý lẽ của Ngài bị xem là một cái cớ vụng về"
  ep3_laamps.8108.c: "[petitioned_ruler.GetShortUINameNoTooltip], đồ ngu xuẩn!"
  ep3_laamps.8108.c.desc: "@warning_icon! Ngài sẽ không trả cho [petitioned_ruler.GetName] dù chỉ một đồng xu gãy. [petitioned_ruler.GetSheHe|U] lẽ ra phải biết trước điều này."
  ep3_laamps.8108.legitimist_too_poor: "#italic Do [income|E] quá ít, mỗi lần Ngài chỉ có thể trả đúng số tiền cố định: #color_yellow 300 #! [gold_i]"

  ep3_laamps.8109.t: "Gửi [ROOT.Char.GetNameNoTooltip]"
  ep3_laamps.8109.desc: "Nỗi buồn trĩu nặng trong lòng chúng ta khi người thân yêu [previous_ruler.GetName] không còn ngồi trên ngai vàng nữa — cầu xin [petitioned_ruler.GetFaith.HighGodName] ban phước cho linh hồn [previous_ruler.GetHerHis]. Tuy vậy, vẫn còn một khoản thanh toán chưa được giải quyết cho sự hỗ trợ mà chúng ta đã dành để đưa [previous_ruler.GetHerHim] lên ngai vị ấy. Chúng Ta tin rằng ngài đã được thông báo đầy đủ về các điều khoản, và đủ danh dự để hoàn thành nghĩa vụ của mình."
  ep3_laamps.8109.a: "$ep3_laamps.8108.a$"
  ep3_laamps.8109.a.desc: "Một năm nữa, [petitioned_ruler.GetShortUIName] sẽ chờ đợi khoản thanh toán bằng một nửa thu nhập hằng năm của toàn lãnh thổ"

  ep3_laamps.8110.t: "$laamp_legitimist_support_contract$ — Kết Cục Bất Ngờ"
  ep3_laamps.8110.desc_intro: "Từ rất lâu trước đây, một khế ước đã được ký kết — [petitioned_ruler.GetName] cung cấp binh lính và vàng bạc để giúp ta đoạt lại [claimed_title.GetName], đổi lấy một phần đáng kể thu nhập của lãnh thổ ta.\n\nTuy nhiên, [petitioned_ruler.GetSheHe] không thể nào lường trước được rằng [petitioned_ruler.GetSheHe] "
  ep3_laamps.8110.desc_war: "sẽ rơi vào một cuộc chiến sinh tử với ta"
  ep3_laamps.8110.desc_imprisoned: "sẽ bị ném vào ngục tối của ta"
  ep3_laamps.8110.desc_killer_root: "sẽ chết dưới tay ta"
  ep3_laamps.8110.desc_dead: "đã rời khỏi cõi đời này"
  ep3_laamps.8110.desc_unlanded: "đã mất cả danh dự lẫn tước vị"
  ep3_laamps.8110.desc_outro: "trước khi món nợ được thanh toán trọn vẹn. Dường như không còn ai đủ quyền thế trong lãnh thổ của [petitioned_ruler.GetHerHis] biết rõ chi tiết của thỏa thuận này. Giờ thì đã rõ — sẽ không có ai đến đòi nợ nữa.\n\nMột khúc quanh kỳ lạ của số phận, như thể có bàn tay mưu lược nào đó đã âm thầm dẫn dắt dòng chảy định mệnh."
  ep3_laamps.8110.a: "Thật tuyệt diệu!"

  ep3_laamps.8111.t: "Khoản Thanh Toán Chính Thống Sắp Tới"
  ep3_laamps.8111.desc: "Ngài sẽ phải trả cho [petitioned_ruler.GetShortUINameNoTooltip] [TopScope.GetValue('incoming_payment_value')] [gold_i] trong vòng #color_yellow sáu #!tháng!"

  request_laamp_legitimist_support: "Yêu Cầu Hỗ Trợ Chính Thống"
  request_laamp_legitimist_support_interaction_desc: "Yêu cầu một lời mời để thảo luận mức độ và điều kiện hỗ trợ cho yêu sách chính thống của Ngài"
  ep3_legitimist_army: "Quân Đội Chính Thống"
  laamp_legitimist_support_contract_success: "Sau khi chấp nhận [task_contract|E] này và đến [recipient.GetCurrentLocation.GetName], Ngài sẽ có thể thương lượng để nhận tối đa #color_yellow 1800 vàng#! và #color_yellow 3000 quân tinh nhuệ#!, đổi lại là các khoản thanh toán lớn về sau."
  laamp_legitimist_support_contract_failure: "Cuộc thương lượng thất bại. Ngài sẽ phải tìm kiếm sự trợ giúp ở nơi khác."
  request_laamp_legitimist_support_already_supporting: "Nhân vật này đã đang ủng hộ một Chính Thống"
  request_laamp_legitimist_have_claim_on_target: "Ngài có một [claim|E] đối với [realm|E] của nhân vật này"
  YOU_HAVE_HOOK_REASON: "Ngài đang nắm thóp [recipient.GetShortUINamePossessive|U]: $VALUE|=+0$"


  ep3_laamps.8200.t: "Gương Mặt Mới Trong Trại"
  ep3_laamps.8200.desc_1: "Khi tôi cố gắng tính toán hậu cần cho bước đi tiếp theo, một người qua đường to lớn dễ dàng nhấc bổng một trong những chiếc xe của chúng tôi. Một trong những người theo tôi chạy đến và cầu xin:\n\n"[ROOT.Char.Custom('MistressMaster')|U], [new_person.GetSheHe] đã nhấc cả chiếc xe qua đầu của [new_person.GetHerHis]! [new_person.GetSheHe] có thể ở lại không? [new_person.GetSheHe|U] thậm chí không cần vũ khí, [new_person.GetSheHe] chỉ cần túm lấy và ném kẻ thù của chúng ta thôi!"\n\nMột [new_person.GetWomanMan] như vậy có thể chứng minh [new_person.GetHerselfHimself] là hữu ích, đồng thời mang vác hành lý cho tôi nữa. Tuy nhiên, [new_person.GetSheHe|U] sẽ ăn rất nhiều lương thực đấy."
  ep3_laamps.8200.desc_2: "Một tiếng cười đơn độc phá tan bầu không khí u ám của màn đêm. Rồi thêm một tiếng nữa — và ta thấy những kẻ theo hầu nghiêm nghị của mình hóa thành một lũ trẻ cười nghiêng ngả. Chuyện gì đang xảy ra vậy?\n\n\"À, [ROOT.Char.GetTitledFirstNameNoTooltip], cuối cùng chúng ta cũng gặp nhau! Xin cho phép ta tự giới thiệu — ta là [new_person.GetName], một danh hề bậc thầy. Ta từng biểu diễn cho đại nhân [location_top_liege.GetName], nhưng giờ đây xin dâng tài nghệ và sự hài hước của mình cho ngài!\""
  ep3_laamps.8200.desc_3: "Chúng ta đã dừng chân một thời gian trong vùng [location.GetTerrain.GetNameNoTooltip|l] của người [location.GetCulture.GetName], tại [location_county.GetNameNoTier]. Dân địa phương thường xuyên ghé trại — để buôn bán, hoặc chỉ đơn giản là lui tới cho vui. Gần đây, ta để ý thấy một [new_person.GetWomanMan] nán lại lâu hơn những người khác.\n\n\"Ở [location_county.GetNameNoTier] này, đã có những năm đủ đầy và cũng có những năm đói kém. Và ta e rằng những năm khốn khó lại sắp trở về. Ta không muốn chết nơi mình sinh ra, cũng không muốn tiếp tục ở lại đây nữa. Ta khiêm nhường xin được gia nhập đoàn của ngài, thưa [ROOT.Char.GetLadyLord|U].\""
  ep3_laamps.8200.a: "Chào mừng ngươi, [new_person.GetFirstNameNoTooltip]!"
  ep3_laamps.8200.b: "Hãy rời đi."
  ep3_laamps.8200.c: "Hãy đi và loan tin: Tránh xa nơi này!"
  ep3_laamps.8200.c.tt: "Trong 20 năm tới, các nhân vật sẽ không còn tìm cách ngẫu nhiên gia nhập trại của Ngài"







