l_english:
  ep3_laamps.8000.t: "Sự Thật"
  ep3_laamps.8000.desc: "Kể từ khoảnh khắc ta đặt bước chân khải hoàn đầu tiên trở lại [claimed_land.GetName], tin tức về sự trở về của ta đã nhanh chóng lan rộng trong giới dân thường. Mỗi thị trấn ta đi qua đều tiếp đón ta như thể ta vẫn là người cai trị những vùng đất này, không tiếc lời ca ngợi và quà tặng.\n\nNgười dân nguyền rủa những tội ác của [claim_holder.GetName] và hát vang những khúc ca về ngày ta sẽ lật đổ [claim_holder.GetHerHim] và khôi phục lại công lý cùng sự tử tế cho vùng đất này.\n\n"
  ep3_laamps.8000.desc.outro.sinner: "Ta tự hỏi liệu họ có thực sự còn nhớ ta đã từng là người như thế nào không..."
  ep3_laamps.8000.desc.outro: "Dĩ nhiên, tất cả những điều này chỉ càng khẳng định tính chính đáng của yêu sách của ta, nhưng nếu khuyến khích họ quá mức, điều đó có thể khiến [claim_holder.GetNameNoTooltip] coi ta là một mối đe dọa."
  ep3_laamps.8000.a: "Ta đến đây để giành lại thứ vốn thuộc về ta!"
  ep3_laamps.8000.b: "Sự ủng hộ của họ sẽ giúp ích cho hành trình của ta."
  ep3_laamps.8010.t: "Người Ngài Đồng Hành Trung Thành"
  ep3_laamps.8010.desc: "Lứa chó con mới nhất từ chuồng được đưa đến trước mặt ta. Vừa mới cai sữa mẹ, chúng bò lổm ngổm, sủa inh ỏi trước một thế giới tươi mới và lạ lẫm. Một chú chó con trông khỏe mạnh và rắn rỏi phớt lờ mọi thứ xung quanh, bò thẳng về phía ta, đôi mắt mở to và chiếc đuôi quẫy loạn xạ, vô tình quật vào các anh chị em của nó khi nó nhìn ta với sự ngưỡng mộ và yêu mến."
  ep3_laamps.8010.a: "Đi theo ta nào."
  ep3_laamps.8020.t: "Người Đồng Hành Trung Thành"
  ep3_laamps.8020.desc: "Khi ta chuẩn bị nghỉ ngơi cho đêm xuống, ta nghe thấy một chút huyên náo gần chỗ lính canh. Ta khó mà tin vào mắt mình khi thấy [wouldbe_companion.GetName], một thành viên trong triều đình của chính [holder.GetFirstNamePossessive], lại chính là nguồn cơn của sự hỗn loạn này, khi [wouldbe_companion.GetSheHe] đang tranh cãi với cận vệ của ta.\n\n[wouldbe_companion.GetSheHe|U] gọi lớn về phía ta từ đầu kia của trại.\n\n\"Xin hãy nghe Ta, [ROOT.Char.GetLadyLord]! Cuộc sống nơi triều đình thật nhàm chán, Ta không thể chịu nổi thêm một ngày nào nữa! Ta mong được theo ngài trên con đường vô tận phía trước, nếu ngài cho phép.\""
  ep3_laamps.8020.a: "\"Hãy đi cùng ta.\""
  ep3_laamps.8020.a.2: "\"Ta sẽ nhận ngươi, nhưng ngươi phải chứng tỏ giá trị của mình.\""
  ep3_laamps.8020.b: "\"Quay về với chủ nhân của ngươi đi.\""
  ep3_laamps.8030.t: "Một Cơ Hội Hiếm Có"
  ep3_laamps.8030.desc: "[armorer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến gặp ta trong trại, vừa đánh bóng [artifact.GetName] của ta.\n\n\"[ROOT.Char.GetLadyLord|U], [location.GetName] rất giàu các mỏ kim loại chất lượng cao, vượt xa bất cứ nơi nào Ta từng thấy. Nếu được ngài cho phép, Ta rất hân hạnh được cải tiến [artifact.GetNameNoTooltip] của ngài bằng những vật liệu quý giá này.\""
  ep3_laamps.8030.a: "\"Ý tưởng tuyệt vời!\""
  ep3_laamps.8030.a.win: "Bảo vật của Ngài được cải tiến"
  ep3_laamps.8030.a.lose: "[armorer.GetFirstNameNoTooltip] làm hỏng việc"
  ep3_laamps.8030.b: "\"Chỉ cần sửa chữa trang bị của ta thôi.\""
  ep3_laamps.8030.c: "\"Nên đem khoáng sản này đi bán!\""
  ep3_laamps.8040.t: "Cứ Để Chó Ngủ Yên"
  ep3_laamps.8040.desc: "Một tiếng thét chói tai kéo ta ra khỏi giấc ngủ, ném ta trở lại bóng tối của đêm đen. Ta lần theo âm thanh đó và bắt gặp [frightened_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] đang co rúm trước lều của [frightened_courtier.GetHerHis].\n\n\"[ROOT.Char.GetFirstName|U]! Đừng vào trong, có một con sói trong giường của Ta!\"\n\nTa vén tấm lều lên và thấy một con sói, bụng nó căng tròn vì đang mang thai. Nó gầm gừ và nhe nanh về phía ta, hẳn đang sợ hãi trước những gì ta có thể làm với những đứa con chưa chào đời của nó."
  ep3_laamps.8040.a: "Ta sẽ giết con thú này."
  ep3_laamps.8040.a.win: "Ngài giết chết con sói"
  ep3_laamps.8040.a.lose: "Ngài bị tấn công"
  ep3_laamps.8040.b: "Những con sói con sẽ là thú cưng tuyệt vời."
  ep3_laamps.8040.c: "Xem ra đây là khởi đầu cho chuồng thú mới của chúng ta!"
  ep3_laamps.8040.d: "Chúng ta sẽ cần một cái lều mới."
  ep3_laamps.8050.t: "Không Bạn Bè, Không Che Chở"
  ep3_laamps.8050.desc.intro: "Tôi đang đi dạo gần [ROOT.Char.Custom('GetRandomCampBuilding')] thì bị một người lạ mặt lo lắng cắt ngang — một [minority.GetWomanMan] tự giới thiệu [minority.GetHerselfHimself] là [minority.GetName], và rõ ràng cũng xa lạ với [ROOT.Char.GetCurrentLocation.GetName] như tôi.\n\n"[ROOT.Char.GetLadyLord|U]","
  ep3_laamps.8050.desc.mid.samefaith: "ngài và Ta đều biết rằng những người theo [minority.GetFaith.GetAdherentNamePlural] không được chào đón ở đây. Chắc hẳn ngài cũng đã từng nếm trải sự kỳ thị mà các tín đồ của [minority.GetFaith.HighGodNamePossessive|U] phải gánh chịu tại những vùng đất này."
  ep3_laamps.8050.desc.mid.alsohated: "ngài và Ta đều biết rằng vùng đất này không dung thứ cho những kẻ thờ phụng khác với các lãnh chúa và phu nhân nơi đây."
  ep3_laamps.8050.desc.mid.fallback: "Ta cảm thấy bất an tại vùng đất này và Ta... Ta đã hy vọng rằng một [ROOT.Char.GetWomanMan] từng trải như ngài có thể sẵn lòng cưu mang một tín đồ [minority.GetFaith.GetAdherentName] vô gia cư.\""
  ep3_laamps.8050.desc.outro: "\n\nTrong chốc lát, [minority.GetSheHe] dừng lại, tự trấn an [minority.GetHerselfHimself] cho một sự từ chối đã được đoán trước.\n\n"Tôi hiểu nếu ngài đã có quá nhiều người phải chăm lo, nhưng nếu ngài nhận tôi, tôi sẽ phục vụ ngài trung thành suốt đời.""
  ep3_laamps.8050.a: "Dĩ nhiên rồi!"
  ep3_laamps.8050.b: "Giúp [minority.GetHerHim] tìm một mái nhà khác."
  ep3_laamps.8050.c: "Biến đi, kẻ lang thang."
  ep3_laamps.8060.t: "Không Còn Một Giọt"
  ep3_laamps.8060.desc: "Ta đắm mình dưới ánh nắng sa mạc, tận hưởng một khoảnh khắc yên bình hiếm hoi trong lối sống đầy hỗn loạn mà ta đã chọn. Nhưng rồi, tiếng gỗ gãy, một tiếng hét, và tiếng nước đổ khiến tim ta chùng xuống.\n\nTa thấy [idiot.Custom2('MyCharacterIntroduction', ROOT.Char)] đứng cạnh đống mảnh vỡ ướt sũng của thùng nước. Rõ ràng, [idiot.GetSheHe] đã làm rơi nó xuống những tảng đá sắc khi đang dỡ hàng, và giờ thì lượng nước dự trữ cuối cùng của chúng ta đang thấm sâu vào cát."
  ep3_laamps.8060.a: "Chúng ta phải tìm thêm nước ngay!"
  ep3_laamps.8060.a.win: "Ngài tìm thấy một mạch nước"
  ep3_laamps.8060.a.lose: "Ngài không tìm được gì"
  ep3_laamps.8060.b: "Vậy thì đã đến lúc chúng ta tái chế rồi..."
  ep3_laamps.8060.c: "\"[idiot.GetFirstNameNoTooltip|U]! Ngươi phải sửa chuyện này!\""
  ep3_laamps.8060.c.win: "[idiot.GetFirstNameNoTooltip|U] tìm được nước"
  ep3_laamps.8060.c.lose: "[idiot.GetFirstNameNoTooltip|U] thất bại"
  ep3_laamps.8060.d: "Đến lúc cướp bóc các đoàn thương nhân địa phương."
  ep3_laamps.8060.d.lose: "Ngài bị bắt quả tang!"
  ep3_laamps.8060.e: "Chúng ta sẽ phải sống sót mà không có nước."
  ep3_laamps.8070.t: "Trái Cây Xa Lạ"
  ep3_laamps.8070.desc: "Trong lúc lang thang ngoài trại, ta bắt gặp một khoảng trống trong rừng, nơi những bụi cây phủ đầy đủ loại quả mọng sặc sỡ. Chúng hoàn toàn xa lạ với ta, trông vô cùng hấp dẫn, và chỉ cần chưa đến một giờ, người của ta có thể hái sạch chúng.\n\nLiệu đây có phải là món quà kịp thời từ [ROOT.Char.GetFaith.CreatorName|U], hay là một trò thử thách của [ROOT.Char.GetFaith.TricksterGodName|U]?"
  ep3_laamps.8070.a: "Ta tự hỏi [forager.GetFirstNameNoTooltip] sẽ nghĩ gì về chuyện này."
  ep3_laamps.8070.b: "À! Ta nhận ra những loại quả này!"
  ep3_laamps.8070.c: "Cuộc sống là một cuộc phiêu lưu, kể cả với cái bụng."
  ep3_laamps.8070.c.win: "Những trái cây này thật ngon"
  ep3_laamps.8070.c.lose: "Ngài ăn phải chất độc"
  ep3_laamps.8070.d: "Chúng ta nên sống sót mà không cần chúng."
  ep3_laamps.8080.t: "Một Thủy Thủ Kỳ Lạ"
  ep3_laamps.8080.desc.intro_sea: "Neo thuyền qua đêm, ta ghé vào một quán rượu địa phương, nơi ta nhanh chóng trao đổi đủ thứ chuyện đời với một lão thủy thủ già kỳ quặc tên là [sailor.GetFirstNameNicknamed].\n\n"
  ep3_laamps.8080.desc.intro: "Ta dành cả buổi tối trong một quán rượu địa phương, trò chuyện rôm rả với một lão thủy thủ già lắm mồm tên là [sailor.GetFirstNameNicknamed].\n\n"
  ep3_laamps.8080.desc.outro: "\"Ngài đúng là kể chuyện như một [ROOT.Char.Custom('WomanManOpposite')], [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [sailor.GetSheHe] cười lớn, cắt ngang thêm một câu chuyện nữa của ta. \"Nhìn cái [sailor.Custom('GetInjuredBodyPart')] cũ của ta xem! Có lần tàu ta bị thủng, mà ta chẳng có gì để bịt ngoài cái này!\"\n\n\"Đó mới là những ngày vinh quang, [ROOT.Char.Custom('FormOfAddressForLiege')], ôi đúng vậy...\" [sailor.GetSheHe] thở dài. \"Và ta khao khát được sống lại những ngày ấy...\""
  ep3_laamps.8080.a: "\"Ha ha! Ngươi đúng là thiên tài!\""
  ep3_laamps.8080.b: "\"Trại của ta đang cần một lão thủy thủ như ngươi.\""
  ep3_laamps.8080.c: "\"Ngươi nghĩ #EMP cái đó#! là một câu chuyện hay sao?\""
  ep3_laamps.8080.c.win: "Những câu chuyện của Ngài gây ấn tượng"
  ep3_laamps.8080.c.lose: "Những câu chuyện của Ngài không gây được ấn tượng"
  ep3_laamps.8080.d: "\"Cút khỏi đây.\""
  ep3_laamps.8090.t: "Những Bờ Biển Xa Xôi"
  ep3_laamps.8090.desc.intro: "Ta dạo bước qua khu chợ của vùng đất xa lạ này. Những người bán hàng vẫy gọi bằng thứ ngôn ngữ xa lạ, ta lạc giữa biển mùi hương ngoại quốc, nhưng kỳ lạ thay, tất cả lại mang đến cảm giác thân quen.\n\n"
  ep3_laamps.8090.desc.world_europe: "Ở đâu khác ta có thể tận hưởng hương oải hương tươi mới, ngắm mặt trời lặn trên tàn tích của La Mã cổ đại, lắng nghe hợp xướng hân hoan của giáo đường, hay trú đông bên lò sưởi của một người xa lạ hiếu khách? Không nơi nào ngoài châu Âu."
  ep3_laamps.8090.desc.world_middle_east: "Ngắm bầu trời sa mạc rực rỡ sao đêm, băng qua cát cùng những đoàn lạc đà, chiêm ngưỡng sự hùng vĩ của những nền văn minh cổ xưa nhất nhân loại tại Cairo, Baghdad, Persepolis. Nếu không phải nơi đây, thì đâu xứng đáng được gọi là trái tim của nhân loại?"
  ep3_laamps.8090.desc.world_india: "Ở đâu khác ta có thể nếm trải sự cân bằng tinh tế của các loại gia vị thơm nồng, rồi xoa dịu tất cả bằng một ly mango lassi ngọt mát? Nghe những giai điệu du dương của cây sáo bansuri, hay ngắm hoa sen rực nở dọc bờ sông Hằng? Chỉ có thể là Ấn Độ."
  ep3_laamps.8090.desc.world_africa: "Ta nghe thấy những nhịp trống ngọt ngào vang vọng qua khu chợ, tiếng chó tru nơi hoang dã, và ta bắt đầu cảm thấy mình thuộc về nơi này. Đôi chân ta đặt trên cát lạ, chim muông xa lạ lượn trên bầu trời, và cuối cùng ta cảm thấy mãn nguyện."
  ep3_laamps.8090.desc.world_steppe: "Ở đâu một [ROOT.Char.GetWomanMan] có thể tự do nếu không phải trên thảo nguyên trải dài vô tận, chỉ với bầu trời xanh vĩ đại của [ROOT.Char.GetFaith.CreatorNamePossessive|U] trên đầu [ROOT.Char.GetHerHim]? Ta gần như có thể chạy và cưỡi ngựa suốt cả đời, cảm nhận gió táp vào mặt, cỏ dưới chân, và mãi mãi đuổi theo chân trời."
  ep3_laamps.8090.desc.world_tibet: "Từ xa, ta nghe thấy âm thanh hiếm hoi của những người hát bằng cổ họng, và lòng ta thôi thúc muốn hòa giọng cùng họ. Vẻ đẹp hùng vĩ bất tận của dãy Himalaya trải ra trước mắt, và ta bị cuốn hút phải khám phá mọi khe núi ẩn giấu và những miền utopia bí mật nơi đây."
  ep3_laamps.8090.desc.world_burma: "Cái nóng dâng cao phủ lên vạn vật một ánh óng ánh như lông công, con người tấp nập dưới những ngôi tháp chùa cao vút. Hương trà lan tỏa khắp các con phố, hòa quyện cùng mùi gỗ teak mới xẻ tạo nên một thứ hương nồng nàn. Mặt trời treo cao trên thung lũng do con sông Irrawaddy hùng vĩ khắc nên, và hàng trăm nền văn hóa nơi đây chào đón ta như một [ROOT.Char.Custom('SisterBrother')] thất lạc từ lâu."
  ep3_laamps.8090.desc.world_asia_china: "Những dãy núi cao vút che bóng cho ruộng lúa phía dưới. Không khí mát mẻ, ẩm ướt bám dính lên da mặt khi ta xua đi một con muỗi. Ta đã tìm thấy sự thịnh vượng đích thực trong những thung lũng núi này, và cảm giác như vừa tìm được thiên đường của riêng mình nơi trần thế."
  ep3_laamps.8090.desc.world_asia_japan: "Tiếng sóng vỗ vào bờ lấp đầy tai ta, và với một hơi thở sâu, không khí mặn mòi của biển tràn ngập phổi ta. Một sự tĩnh lặng lan tỏa khắp cơ thể, và ta tràn đầy khát vọng sống. Ta chỉ muốn ở lại mảnh đất này, dù chỉ trong chốc lát, để tận hưởng tất cả."
  ep3_laamps.8090.desc.world_asia_korea: "Như xương sống của thế giới, những dãy núi dài vươn đến tận chân trời, tuyết phủ trắng đỉnh cao. Con người nơi đây hiền hòa và hào phóng, họ hết lòng khiến ta cảm thấy được chào đón."
  ep3_laamps.8090.desc.world_asia_southeast: "Những tán lá dày che chắn ta khỏi cái nắng như thiêu đốt khi ta chiêm ngưỡng cảnh sắc tuyệt đẹp trước mắt. Ta thấy một con chuồn chuồn đậu lên hoa súng và không khỏi suy ngẫm về hành trình của chính mình. Ta chính là con chuồn chuồn đó, và nơi này thực sự độc đáo và huyền diệu — ta đã hoàn toàn yêu mảnh đất này."
  ep3_laamps.8090.desc.outro: "\n\nMột [ROOT.Char.GetWomanMan] bước đi qua [county.GetNameNoTierNoTooltip], nhưng liệu [ROOT.Char.GetSheHe] vẫn còn là [ROOT.Char.GetFirstNameNicknamed]?"
  ep3_laamps.8090.a: "Chẳng lẽ một [ROOT.Char.GetWomanMan] không thể vừa là người [ROOT.Char.GetCulture.GetNameNoTooltip] #EMP và#! [county.GetCountyData.GetCulture.GetNameNoTooltip] sao?"
  ep3_laamps.8090.b: "Dù ta sắp trở thành ai, [ROOT.Char.GetSheHe] cũng sẽ thật tuyệt vời!"
  ep3_laamps.8090.c: "Có lẽ tất cả người [ROOT.Char.GetCulture.GetNameNoTooltip] nên tìm một mái nhà tại đây."
  every_child_in_camp: "Tất cả [children|E] trong trại của Ngài"
  every_relative_in_camp_your_culture: "Mọi thành viên [close_family|E] trong trại cùng [culture|E] với Ngài"
