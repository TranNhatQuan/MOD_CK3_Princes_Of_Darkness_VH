 #Page 2 (Second)
  ep3_laamp_decision_event.1001.desc_intro_return_finished: "Khu vực này của [ROOT.Char.Custom('GetMainsquareCommons')] dường như trở nên se lạnh hơn, và mọi người hoặc đã quay về nơi ở của mình, hoặc chuyển sang những khu vực khác của [ROOT.Char.Custom('SettlementCity')|l]."
  ep3_laamp_decision_event.1001.desc_intro_returned_from_supplies: "Khi quay lại từ người bán nhu yếu phẩm, làn gió chiều lướt nhẹ dọc theo [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip] [ROOT.Char.Custom('GetMainsquareCommons')]."
  ep3_laamp_decision_event.1001.desc_intro_returned_from_assaulting_supplies: "Lũ lính canh đối xử với tôi khá thô bạo, may mắn là không gãy cái gì, khi chúng thả tôi quay lại [ROOT.Char.Custom('GetMainsquareCommons')]."
  ep3_laamp_decision_event.1001.desc_intro_returned_from_artifacts: "Khi quay lại từ chỗ bán cổ vật, dường như những người khác cũng đang trở về từ nhiều góc khác nhau của [ROOT.Char.Custom('SettlementCity')|l], khiến dòng người ra vào [ROOT.Char.Custom('GetMainsquareCommons')] trở nên nhộn nhịp."
  ep3_laamp_decision_event.1001.desc_intro_returned_from_contract: "Tản bộ quay về từ [ROOT.Char.Custom('GetTowncrierElder')], Ta ngước nhìn bầu trời một chút trước khi nhận ra mình đã trở lại [ROOT.Char.Custom('GetMainsquareCommons')]."
  ep3_laamp_decision_event.1001.desc_intro_returned_generic_01: "Trở lại khu vực này của [ROOT.Char.Custom('GetMainsquareCommons')], số người xung quanh đã ít hơn hẳn. Một nhóm trẻ con đang vuốt ve một con lừa, bình thản gặm cỏ nửa đường tới chỗ [ROOT.Char.Custom('GetTowncrierElder')]."
  ep3_laamp_decision_event.1001.desc_intro_returned_generic_02: "Quay lại nửa còn lại của [ROOT.Char.Custom('GetMainsquareCommons')], một cặp chó lai đang chạy loanh quanh, giành giật một khúc xương động vật khá là to."

  ep3_laamp_decision_event.1001.desc: "Rời xa lối vào [ROOT.Char.Custom('SettlementCity')|l], Ta đi dọc theo một con đường hẹp, băng qua vài [ROOT.Char.Custom('GetCrookedhousesDelapidatedtents')] để đến một khoảng không gian mở liền kề.\n\nPhía trước là con đường dẫn tới những người bán nhu yếu phẩm và những kẻ buôn cổ vật, và đằng xa Ta cũng thấy lờ mờ bóng dáng của một"
  ep3_laamp_decision_event.1001.desc_intro: "$ep3_laamp_decision_event.1001.desc$ người rao tin trong thị trấn."
  ep3_laamp_decision_event.1001.desc_intro_nomads: "$ep3_laamp_decision_event.1001.desc$ trưởng lão bộ tộc, đang đi lại ở đằng xa."

 #Regional Outros are lifted from ep3_laamp_decision_event.1000
  ep3_laamp_decision_event.1001.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
  ep3_laamp_decision_event.1001.desc_outro_return_finished: "\n\nTa nhìn quanh và nhận ra mình không còn việc gì cần giải quyết tại địa điểm này nữa."
  ep3_laamp_decision_event.1001.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] đi chậm phía sau, nhưng chẳng mấy chốc đã bắt kịp Ta khi Ta cân nhắc điểm đến tiếp theo."
