 #Storyteller
  ep3_laamp_decision_event.1031.return.tt: "Ngài quay lại lối vào [THIS.Char.Custom('GetTavernDwelling')]"
  ep3_laamp_decision_event.1031.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Người Kể Chuyện"
  ep3_laamp_decision_event.1031.desc_01: "#EMP \"...và khao khát thoát khỏi cơn đau đầu như búa bổ, đầu của Zeus bị bổ đôi, và Athena — nữ thần khôn ngoan nhất — bật ra.\"#!"
  ep3_laamp_decision_event.1031.desc_02: "#EMP \"...và rồi Horus cùng Set trở thành kẻ thù không đội trời chung, tranh giành chiếc ngai trống rỗng.\"#!"
  ep3_laamp_decision_event.1031.desc_03: "#EMP \"...và từ ngày đó, Ruha bị trục xuất khỏi Thế Giới Ánh Sáng, lưu đày vào Thế Giới Bóng Tối.\"#!"
  ep3_laamp_decision_event.1031.desc_04: "#EMP \"...và rồi con Leviathan vĩ đại hủy diệt thế giới lần thứ năm, chết trong chính quá trình đó. Nhưng từ thân xác nó, đất liền, cây cối và muôn loài được sinh ra.\"#!"
  ep3_laamp_decision_event.1031.desc_05: "#EMP \"...và rồi ông trở thành atua của rừng rậm; Tangaroa thừa hưởng biển cả, Rūaumoko là mặt đất rung chuyển, còn Tāwhirimatea là cơn gió thất thường.\"#!"
  ep3_laamp_decision_event.1031.desc_06: "#EMP \"...và rồi quả trứng rơi xuống; các phần của nó tạo nên vũ trụ — lòng đỏ trở thành mặt trời ấm áp, còn lòng trắng hóa thành vầng trăng xinh đẹp.\"#!"
  ep3_laamp_decision_event.1031.desc_07: "#EMP \"...và rồi Kuutar se sợi chỉ vàng thành một chiếc áo choàng tráng lệ; rộng như bầu trời đêm và dài như vĩnh cửu.\"#!"
  ep3_laamp_decision_event.1031.desc_08: "#EMP \"...và rồi, khi nhận ra kẻ đã quyến rũ mình chính là anh trai ruột Kullervo, nàng lao khỏi vách đá, bước vào cõi sống bên kia.\"#!"
  ep3_laamp_decision_event.1031.desc_09: "#EMP \"...và rồi Finn, trong cơn thịnh nộ, hóa đá. Giấc mộng hủy diệt của hắn không bao giờ thành hiện thực, và vì thế, nhà thờ lớn vẫn đứng vững cho đến ngày nay.\"#!"
  ep3_laamp_decision_event.1031.desc_10: "#EMP \"...và bất chấp lời cảnh báo của Kaang, loài người đã nhóm lửa trong bóng tối đang lan rộng, khiến muôn thú bỏ chạy lên đồi.\"#!"
  ep3_laamp_decision_event.1031.desc_11: "#EMP \"...và rồi khối đất sét được nhào nặn được phủ da, đổ đầy máu, và Tore đặt tên cho ông là Baatsi.\"#!"
  ep3_laamp_decision_event.1031.desc_12: "#EMP \"...và rồi trại của phụ nữ giành chiến thắng trước trại của đàn ông, cho phép họ một lần nữa #EMP giao hoan#! cùng nhau.\"#!"
  ep3_laamp_decision_event.1031.desc_13: "#EMP \"...và họ gọi nàng là Teryel, con sư tử đầu tiên.\"#!"
  ep3_laamp_decision_event.1031.desc_14: "#EMP \"...và Soma được ban cho các vị thần, nhưng bốn giọt đã rơi xuống trần gian, và từ những giọt đó mọc lên các thành phố linh thiêng.\"#!"
  ep3_laamp_decision_event.1031.desc_15: "#EMP \"...và chỉ với một ngụm lớn, Culebre đã nuốt chửng con bò của mình, cả móng guốc lẫn tất cả.\"#!"
  ep3_laamp_decision_event.1031.desc_16: "#EMP \"...và rồi Toranos nhận lễ hiến tế; máu chảy dọc thân mình ông, tiếp thêm sinh lực, từ đó tạo nên một mạch suối mới.\"#!"
  ep3_laamp_decision_event.1031.desc_17: "#EMP \"...và rồi Tjelvar đến hòn đảo, mang theo lửa, khiến hòn đảo không còn chìm xuống sóng biển mỗi đêm.\"#!"
  ep3_laamp_decision_event.1031.desc_18: "#EMP \"...và rồi mưa đổ xuống châu Phi, trong tiếng ca hát, nhảy múa và hân hoan.\"#!"
  ep3_laamp_decision_event.1031.desc_19: "#EMP \"...và khi trở lại bãi biển vào buổi sáng, nhà vua phát hiện những viên đá quý đã tự nguyện bao quanh Mẹ Kho Báu.\"#!"
  ep3_laamp_decision_event.1031.desc_outro: "\n\n\"Nhưng câu chuyện đó sẽ dành cho một dịp khác.\" Người kể chuyện mỉm cười đầy bí ẩn với Ta, ngả lưng vào chiếc ghế bên lò sưởi của [laamp_storyteller.GetHerHis], rồi nhấp thêm một ngụm [laamp_storyteller.Custom('RegionalDrink')]."
  ep3_laamp_decision_event.1031.a: "Câu chuyện đó cũng có vài điểm hay."
  ep3_laamp_decision_event.1031.a_zealous: "...Ta đoán là cũng có một hai điểm đáng chú ý."
  ep3_laamp_decision_event.1031.a_eccentric: "Thấy chưa, giờ thì mọi thứ hoàn toàn hợp lý!"
  ep3_laamp_decision_event.1031.a_success.t: "Kỹ Năng Qua Đạo Lý"
  ep3_laamp_decision_event.1031.a_success.desc: "Ngài học được điều gì đó từ bài học đạo đức của câu chuyện"
  ep3_laamp_decision_event.1031.a_semi_success.t: "Cơ Hội Phát Triển"
  ep3_laamp_decision_event.1031.a_semi_success.desc: "Một vài phần của câu chuyện có thể áp dụng cho hoàn cảnh của Ngài"
  ep3_laamp_decision_event.1031.a_failure.t: "Câu Chuyện Hay"
  ep3_laamp_decision_event.1031.a_failure.desc: "Ít nhất thì đó cũng là một câu chuyện hấp dẫn"
  ep3_laamp_decision_event.1031.a.cooldown.tt: "Ngài đã suy ngẫm về một câu chuyện gần đây — quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_storied_recently') )]"
  ep3_laamp_decision_event.1031.b: "\"[laamp_storyteller.GetFirstNameNoTooltip], làm sao Ngài kể chuyện hay đến vậy?\""
  ep3_laamp_decision_event.1031.b_reveler: "Ta biết câu này!"
  ep3_laamp_decision_event.1031.b.cooldown.tt: "Ngài đã say sưa với một câu chuyện gần đây — quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_reveled_recently') )]"
  ep3_laamp_decision_event.1031.c: "\"Câu chuyện hay lắm, Ngài hiền!\""
  ep3_laamp_decision_event.1031.c_zealous: "Hừ. Toàn là thứ nhảm nhí báng bổ."
  ep3_laamp_decision_event.1031.c.cooldown.tt: "Ngài đã thưởng thức một câu chuyện gần đây — quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_relaxed_recently') )]"
  ep3_laamp_decision_event.1031.d: "$ep3_laamp_decision_event.1021.d$"

 #Recruitment
  ep3_laamp_decision_event.1033.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Tuyển Mộ"
  ep3_laamp_decision_event.1033.desc_returned_01: "Khi Ta quay lại chỗ các ứng viên tiềm năng, [laamp_first_recruit.GetFirstName], [laamp_second_recruit.GetFirstName] và [laamp_third_recruit.GetFirstName] nhìn nhau đầy cảnh giác.$ep3_laamp_decision_event.1033.desc_returned_outro_01$"
  ep3_laamp_decision_event.1033.desc_returned_jane_01: "Khi Ta quay lại chỗ các ứng viên tiềm năng, [laamp_first_recruit.GetFirstName] và [laamp_second_recruit.GetFirstName] đang trò chuyện khe khẽ."
  ep3_laamp_decision_event.1033.desc_returned_outro_01: "\n\nKhi nhận ra Ta, cả bọn đồng loạt chấn chỉnh tư thế và nhìn Ta đầy mong đợi."
  ep3_laamp_decision_event.1033.desc_returned_02: "Quay lại chỗ các ứng viên, bộ ba gồm [laamp_first_recruit.GetFirstName], [laamp_second_recruit.GetFirstName] và [laamp_third_recruit.GetFirstName] dường như vừa giải quyết xong một cuộc cãi vã.$ep3_laamp_decision_event.1033.desc_returned_outro_02$"
  ep3_laamp_decision_event.1033.desc_returned_jane_02: "Quay lại chỗ các ứng viên, cặp đôi [laamp_first_recruit.GetFirstName] và [laamp_second_recruit.GetFirstName] vừa kết thúc một ván xúc xắc với kết quả gây tranh cãi."
  ep3_laamp_decision_event.1033.desc_returned_outro_02: "\n\nKhông khí căng thẳng khẽ đổi chiều khi Ta tiến đến, chuyển thành sự chờ đợi dè dặt."
  ep3_laamp_decision_event.1033.desc: "Tiến đến nhóm [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] đang thất nghiệp, Ta cất giọng và nói thẳng: \"Ta đang tìm những người có tay nghề, đáng tin cậy để gia nhập trại của ta! Ai trong các ngươi sẵn sàng đảm nhận nhiệm vụ đó?\""
  ep3_laamp_decision_event.1033.desc_mid_two: "\n\nNhững người quan tâm tự giới thiệu là [laamp_first_recruit.GetFirstName] kẻ [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')] và [laamp_second_recruit.GetFirstName] kẻ [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')]."
  ep3_laamp_decision_event.1033.desc_mid_three: "\n\nNhững người quan tâm tự giới thiệu là [laamp_first_recruit.GetFirstName] kẻ [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')|U], [laamp_second_recruit.GetFirstName] kẻ [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')|U] và [laamp_third_recruit.GetFirstName] kẻ [laamp_third_recruit.Custom('PersonalityGetNegativeTraitDesc')|U]."
  ep3_laamp_decision_event.1033.desc_outro: "\n\nTa quan sát các ứng viên từ đầu đến chân, cố gắng quyết định sẽ tuyển ai."
  ep3_laamp_decision_event.1033.desc_partner_outro: "\n\n[visiting_partner.GetFirstName] khẽ ngân nga và săm soi các ứng viên khi Ta cân nhắc lựa chọn."
  ep3_laamp_decision_event.1033.desc_jane_outro: "\n\nKhi Ta vừa kết thúc phần giới thiệu, một [laamp_generic_jane.GetWomanMan] cộc cằn lập tức bước đến: \"Tên Ta là [laamp_generic_jane.GetFirstName]. Vì những lý do riêng, Ta muốn gia nhập trại của ngài.\""
  ep3_laamp_decision_event.1033.desc_returned_jane_outro: "\n\n[laamp_generic_jane.GetFirstNameNoTooltip] vẫn đứng ở một góc, đáp lại ánh nhìn của Ta khi Ta đánh giá các ứng viên."

  ep3_laamp_decision_event.1033.a: "\"Hay là ngươi đến làm việc cho ta, [laamp_first_recruit.GetFirstNameNoTooltip]?\""
  ep3_laamp_decision_event.1033.b: "[laamp_second_recruit.GetFirstNameNoTooltip] trông là một ứng viên khá."
  ep3_laamp_decision_event.1033.c: "Ta chỉ thấy tiềm năng ở [laamp_third_recruit.GetFirstNameNoTooltip]."

  ep3_laamp_decision_event.1033.d: "\"...[laamp_generic_jane.GetFirstNameNoTooltip], đúng không? Gia nhập với ta.\""
  ep3_laamp_decision_event.1033.d.cooldown.tt: "Ngài đã tuyển một [follower|E] tự do gần đây — quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1033_generic_jane_cooldown') )]"

  ep3_laamp_decision_event.1033.e: "$ep3_laamp_decision_event.1021.d$"

 #Spouse Material
  ep3_laamp_decision_event.1035.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Đối Tượng Tiềm Năng"
  ep3_laamp_decision_event.1035.desc_returned_01: "Ta quay lại bàn của [laamp_spouse_material.GetFirstNamePossessive] và máu trong người ta lập tức sôi sục.\n\nPhải bình tĩnh. #EMP Bắt chuyện với ngài ấy thôi.#!\n\n[laamp_spouse_material.GetFirstNameNoTooltip] đang bận tán gẫu với một [laamp_spouse_material.Custom('WomanManOpposite')] gần đó khi ta tiến lại gần, và ánh mắt ngài nheo lại đầy mong đợi:"
  ep3_laamp_decision_event.1035.desc_returned_02: "Khi ta quay trở lại bàn, [laamp_spouse_material.GetFirstName] vừa nhận được một đĩa thức ăn bốc hơi nghi ngút, hương thơm khiến bụng ta réo lên vì đói.\n\nNgài vẫn dán mắt vào [visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFood')] trước mặt khi buông lời mỉa mai: \"Lần này ngài thực sự #EMP muốn#! gì đây?\"\n\nTa ngập ngừng trước lời chào đanh đá đó, rồi cẩn thận cân nhắc câu trả lời của mình:"
  ep3_laamp_decision_event.1035.desc_reused_spouse: "Ta thong thả bước tới chỗ [laamp_spouse_material.GetFirstName], người — rạng rỡ như thường lệ — ngước nhìn khi Ta đến gần.\n\n[laamp_spouse_material.GetSheHe|U] dường như thoáng chốc không nhớ ra Ta — rồi [laamp_spouse_material.GetHerHis] ánh mắt chợt hẹp lại khi nhận ra.\n\n#EMP Không có gì cá nhân#!, Ta tự nhủ, và mỉm cười nhạt khi phớt lờ cảm giác khó chịu trong lồng ngực:"
  ep3_laamp_decision_event.1035.desc: "Ta đang chăm chú quan sát [laamp_spouse_material.Custom('RaunchyComplimentNoun')] đang ngồi vào chiếc bàn gần đó. Chủ nhân của [ROOT.Char.Custom('GetTavernDwelling')] gọi người đó là [laamp_spouse_material.GetFirstName], chẳng phải sao?\n\nNgài trông có vẻ bối rối khi ta tiến lại gần, có lẽ vì sự xáo trộn trong lòng ta lộ rõ cả trên mặt. Tại sao việc này lại làm ta bận tâm cơ chứ? #EMP Ta là [ROOT.Char.GetNameNoTooltip], chết tiệt thật!#!\n\nTa tự nhắc nhở bản thân về những thành tựu gần đây để giữ bình tĩnh, nhưng dường như ta đang thất bại."
  ep3_laamp_decision_event.1035.a: "\"Hay để ta mời ngươi thêm một cốc [laamp_spouse_material.Custom('RegionalDrink')] nữa?\""
  ep3_laamp_decision_event.1035.b_first: "\"Ngoài việc #EMP đánh cắp trái tim#!, ngươi còn làm gì khác?\""
  ep3_laamp_decision_event.1035.b_second: "\"Ngươi có tên không? Hay ta có thể gọi ngươi là #EMP của ta#!?\""
  ep3_laamp_decision_event.1035.b_third: "\"Ngươi có bản đồ không? Ta vừa #EMP lạc lối#! trong đôi mắt ngươi.\""
  ep3_laamp_decision_event.1035.b_fourth: "\"Ngươi có câu cá không? Vì ngươi đã #EMP câu#! trúng ta rồi.\""
  ep3_laamp_decision_event.1035.b_fifth: "\"Nếu ngươi cho ta mượn một nụ hôn, ta #EMP hứa#! sẽ trả lại ngay.\""
  ep3_laamp_decision_event.1035.b_fallback: "\"Một [laamp_spouse_material.Custom('GirlBoy')] như ngươi làm gì ở nơi thế này?\""
  ep3_laamp_decision_event.1035.b.success: "[laamp_spouse_material.GetShortUIName] bị mê hoặc bởi lời tán tỉnh của Ngài"
  ep3_laamp_decision_event.1035.b.failure: "Ngài không quyến rũ được [laamp_spouse_material.GetShortUIName]"
  ep3_laamp_decision_event.1035.b.failure.tt: "[laamp_spouse_material.GetShortUIName] bắt đầu phớt lờ Ngài"
  ep3_laamp_decision_event.1035.b.cooldown.tt: "Ngài vừa thử quyến rũ một [spouse|E] tiềm năng — hãy thử lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_duelled_recently') )]"
  ep3_laamp_decision_event.1035.c: "\"...sao chúng ta không ra chỗ nào đó #EMP thoải mái hơn#!...\""
  ep3_laamp_decision_event.1035.c.cooldown.tt: "Ngài đã thư giãn tại một [ROOT.Char.Custom('GetTavernDwelling')] gần đây — quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_unwinded_recently') )]"
  ep3_laamp_decision_event.1035.d: "$ep3_laamp_decision_event.1021.d$"

 #Hooded Figure
  ep3_laamp_decision_event.1037.t_noble: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [laamp_hooded_figure.GetFirstNameNoTooltip] Gặp Rắc Rối!"
  ep3_laamp_decision_event.1037.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [laamp_hooded_figure.GetWomanMan|U] Bị Truy Nã"
  ep3_laamp_decision_event.1037.desc_noble_returned_01: "Ta quay lại chỗ [laamp_hooded_figure.GetFirstName], người vẫn đang căng thẳng đối đầu với tên du côn địa phương.\n\nÁnh mắt họ khóa chặt vào nhau, thế giằng co hoàn toàn bế tắc, chỉ bị phá vỡ khi tên du côn người [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] thỉnh thoảng liếc về phía cửa, như thể đang chờ đợi điều gì đó. Hoặc #EMP ai đó#!.\n\nTa cảm nhận được mồ hôi đang rịn dọc sống lưng."
  ep3_laamp_decision_event.1037.desc_noble_returned_02: "Trở lại bàn của [laamp_hooded_figure.GetFirstNamePossessive], bầu không khí căng thẳng vẫn không đổi, và tên du côn người [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] vẫn đang chờ [ROOT.Char.GetHerHis] tiền.\n\n[laamp_hooded_figure.GetTitleAsNameNoTooltip] #EMP từ chối#! trả, và những kẻ qua đường thỉnh thoảng chậm bước quan sát, chỉ để vội vàng rời đi khi nhận ra chuyện sắp xảy ra.\n\nÁnh nhìn của Ta bồn chồn chuyển qua lại giữa hai bên."

  ep3_laamp_decision_event.1037.desc_returned_01_intro: "Trở lại hầm rượu, [laamp_hooded_figure.GetFirstName] đang chăm chú xem một tấm bản đồ. Một tấm ván sàn kêu cót két"
  ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro: "Trong chiếc lều bên kia, [laamp_hooded_figure.GetFirstName] đang chăm chú xem bản đồ. Ta vô tình va phải một [laamp_hooded_figure.Custom('GetSmallHidingObject')]"
  ep3_laamp_decision_event.1037.desc_returned_01_outro: "và [laamp_hooded_figure.GetSheHe] quay phắt đầu lại nhìn ta.\n\n\"Ngài quay lại rồi,\" [laamp_hooded_figure.GetSheHe] nhận xét, khi ngài cẩn thận cuộn tấm bản đồ mô tả vùng đất lân cận của [1037_neighboring_holding.GetBaronyNameExplicitly]: \"Ngài muốn gì sao?\"\n\nNgài đứng dậy, khoanh tay và tựa người một cách ranh mãnh vào một bên chân."
  ep3_laamp_decision_event.1037.desc_returned_01: "$ep3_laamp_decision_event.1037.desc_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"
  ep3_laamp_decision_event.1037.desc_nomad_returned_01: "$ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"

  ep3_laamp_decision_event.1037.desc_returned_02: "Ta cúi nhìn xuống hầm trước khi lại bước xuống cầu thang. $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
  ep3_laamp_decision_event.1037.desc_nomad_returned_02: "Ta vén tấm rèm lều, liếc nhìn vào bên trong trước khi bước vào: $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
  ep3_laamp_decision_event.1037.desc_returned_02_outro: "Ta nhìn xuống hầm trước khi bước xuống bậc thang lần nữa. [laamp_hooded_figure.GetFirstName], tên khốn đó, ngồi ngả người trên ghế, ánh mắt dán chặt vào [ROOT.Char.Custom('GetCeilingCanopy')].\n\nNgài thong thả tung một đồng xu [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] lên không trung, xoay một vòng rồi bắt lấy bằng bàn tay vững chãi.\n\nTa hắng giọng và ngài nhắm mắt lại, cất đồng xu đi, rồi khoanh hai tay ra sau gáy mà càu nhàu: \"Gì?\""

  ep3_laamp_decision_event.1037.desc_returned_03: "Quay lại hầm, cánh cửa giờ đã đóng. Ta cẩn thận mở ra và bước xuống cầu thang.\n\nĐi sâu vào trong, [laamp_hooded_figure.GetFirstName] đang lau sàn một thứ gì đó trông giống như... #EMP máu#!? Chắc chắn là máu #EMP động vật#!...\n\nNgài bẻ khớp ngón tay khi cất chiếc xô đi và hướng sự chú ý về phía ta: \"Dai dẳng thật đấy, phải không?\""
  ep3_laamp_decision_event.1037.desc_nomad_returned_03: "Đứng ngoài lều của tên lưu manh [laamp_hooded_figure.GetFirstNamePossessive], Ta nghe thấy những âm thanh quằn quại phát ra từ bên trong. Rồi đột ngột im bặt.\n\nTa dè dặt thò đầu vào trong lều, bắt gặp [laamp_hooded_figure.GetHerHim] trong bóng tối, đang lau sạch con dao dính một chất sẫm màu. Máu...?\n\n[laamp_hooded_figure.GetSheHe|U] thờ ơ quay về phía Ta: \"Chỉ là #EMP chuột#! thôi. Nhưng #EMP ngươi#! thì đúng là dai dẳng thật đấy.\""

  ep3_laamp_decision_event.1037.desc_intro: "Nhân vật trùm mũ lặng lẽ lướt qua quán rượu rồi đi xuống cầu thang dẫn vào hầm. Ta thận trọng nhìn quanh khi bám theo [laamp_hooded_figure.GetHerHim] xuống dưới.\n\nDưới đáy, [laamp_hooded_figure.GetSheHe] ngồi xuống chiếc ghế trước bàn và để chiếc mũ trùm rơi xuống"
  ep3_laamp_decision_event.1037.desc_nomad_intro: "Nhân vật trùm mũ lặng lẽ lướt qua nơi trú ngụ và ra ngoài phía sau. Ta thận trọng nhìn quanh khi theo [laamp_hooded_figure.GetHerHim] ra ngoài và vào chiếc lều bên cạnh.\n\nBên trong, [laamp_hooded_figure.GetSheHe] ngồi xuống chiếc ghế trước bàn và để chiếc mũ trùm rơi xuống"
  ep3_laamp_decision_event.1037.desc_reused_thief_outro: "\n\nTa nhận ra [laamp_hooded_figure.GetFirstName] khi ngài đập nắm đấm xuống bàn đầy phấn khích: \"Chết tiệt thật! Ta không ngờ lại thấy #EMP ngài#! lần nữa — dù sao thì cũng không phải trong kiếp này. Ta có thể giúp gì cho ngài đây?\""
  ep3_laamp_decision_event.1037.desc_reused_thief: "$ep3_laamp_decision_event.1037.desc_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"
  ep3_laamp_decision_event.1037.desc_nomad_reused_thief: "$ep3_laamp_decision_event.1037.desc_nomad_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"

  ep3_laamp_decision_event.1037.desc_noble: \"...rồi còn thuế #EMP chỗ ngồi#! nữa,\" tên du côn người [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] nói với nụ cười mỉa, vừa ra hiệu về chiếc ghế của kẻ trùm mũ. \"Thêm một khoản vàng nữa đấy.\"\n\nKẻ trùm mũ lập tức đứng bật dậy, và khi mũ trùm rơi xuống, Ta nhận ra đó chính là [laamp_hooded_figure.GetName]: \"Thật quá đáng!\" [laamp_hooded_figure.GetTitleAsNameNoTooltip] kêu lên, rõ ràng đang rối trí.\n\n\"Đừng bắt ta phải hỏi ý kiến các #EMP đối tác làm ăn#! của ta!\" tên du côn đe dọa, và tình hình ngày càng căng thẳng."
  ep3_laamp_decision_event.1037.desc: "$ep3_laamp_decision_event.1037.desc_intro$$ep3_laamp_decision_event.1037.desc_outro$"
  ep3_laamp_decision_event.1037.desc_nomad: "$ep3_laamp_decision_event.1037.desc_nomad_intro$$ep3_laamp_decision_event.1037.desc_outro$"
  ep3_laamp_decision_event.1037.desc_outro: ": \"Ta cho rằng ngươi nhận ra ta qua danh tiếng chứ?\" #EMP Tên tội phạm [laamp_hooded_figure.Custom2('CriminalAdjective', ROOT.Char)] và [laamp_hooded_figure.Custom2('CriminalCrierInsult', ROOT.Char)] khét tiếng [laamp_hooded_figure.GetFirstNameNoTooltip]!#!\"\n\n\"...Ta đã từng #EMP dạy dỗ#! người khác vì những lời xúc phạm còn nhẹ hơn thế. Giờ ngươi muốn gì?\" Ánh mắt của [laamp_hooded_figure.GetFirstNamePossessive] ghim chặt vào Ta khi [laamp_hooded_figure.GetSheHe] nhướng mày dò hỏi."

  ep3_laamp_decision_event.1037.a: "\"Ta sẽ trả hóa đơn cho [laamp_hooded_figure.GetHerHis].\""
  ep3_laamp_decision_event.1037.a.flavor: "Chắc chắn chuyện này sẽ có ích."
  ep3_laamp_decision_event.1037.b_diplomacy: "\"Chẳng phải khách #EMP quay lại#! sẽ mang nhiều vàng hơn sao?\""
  ep3_laamp_decision_event.1037.b_stewardship: "\"E là đó không phải mức thuế chỗ ngồi #EMP hiện hành#!.\""
  ep3_laamp_decision_event.1037.b_intrigue: "\"Đội cận vệ của [laamp_hooded_figure.GetHerHis|U] đang ở #EMP ngay#! bên ngoài đấy...\""
  ep3_laamp_decision_event.1037.b_learning: "\"Chúng ta không nên hạ thấp mình đến mức này, phải không?\""
  ep3_laamp_decision_event.1037.b_martial: "\"Muốn giải quyết chuyện này với #EMP ta#! thay vì thế không?\""
  ep3_laamp_decision_event.1037.b.flavor: "Tệ nhất thì có thể xảy ra chuyện gì chứ?"
  ep3_laamp_decision_event.1037.b.success: "Ngài đã thuyết phục thành công tên du côn để hắn để yên [laamp_hooded_figure.GetShortUIName]"
  ep3_laamp_decision_event.1037.b.success.t: "[laamp_hooded_figure.GetWomanMan] Quý Tộc Được Cứu"
  ep3_laamp_decision_event.1037.b.failure: "Ngài không thuyết phục được tên du côn"
  ep3_laamp_decision_event.1037.b.failure.t: "Không Thuyết Phục"
  ep3_laamp_decision_event.1037.c: "\"Vị #EMP [laamp_hooded_figure.GetTitleAsNameNoTooltip]#! này đã có người bảo kê rồi, đồ [ROOT.Char.Custom2('InsultNoun', ROOT.Char)]!\""
  ep3_laamp_decision_event.1037.c.flavor: "Ta từng gặp chuyện tệ hơn thế này rồi."
  ep3_laamp_decision_event.1037.d: "\"Ta có thể cần một [laamp_hooded_figure.GetWomanMan] với kỹ năng của ngươi, [laamp_hooded_figure.GetFirstNameNoTooltip].\""
  ep3_laamp_decision_event.1037.d_thief_position: "\"Ngươi biết đấy, ta đang có một vị trí $master_thief_camp_officer$ trống, dành riêng cho ngươi.\""
  ep3_laamp_decision_event.1037.e: "\"Một chuyên gia tầm cỡ ngươi chắc chắn sẽ #EMP phát huy#! trong trại của ta.\""
  ep3_laamp_decision_event.1037.e.success: "[laamp_hooded_figure.GetShortUIName] tỏ ra hứng thú với ý tưởng này"
  ep3_laamp_decision_event.1037.e.failure: "Ngài không lôi kéo được [laamp_hooded_figure.GetShortUIName]"
  ep3_laamp_decision_event.1037.e.failure.tt: "[laamp_hooded_figure.GetShortUIName] bắt đầu phớt lờ Ngài"
  ep3_laamp_decision_event.1037.f: "\"Ngươi có thể dạy ta cái... nghề đó không?\""
  ep3_laamp_decision_event.1037.g: "\"Ngươi và ta mà hợp tác thì sẽ #EMP thống trị#! cả vùng này, [laamp_hooded_figure.GetFirstNameNoTooltip].\""
  ep3_laamp_decision_event.1037.h: "$ep3_laamp_decision_event.1021.d$"


 #Option: Visit the local church grounds
  ep3_laamp_decision_event.1040.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Khuôn Viên [visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
  ep3_laamp_decision_event.1040.desc_returned_01: "Quay lại khuôn viên [visiting_location.GetCounty.GetFaith.HouseOfWorship], mọi thứ vẫn y nguyên. Khi mặt trời chậm rãi di chuyển trên bầu trời, các tòa nhà quanh quảng trường luân phiên đổ bóng che mát khoảng không rộng mở."
  ep3_laamp_decision_event.1040.desc_returned_02: "Mùi hương trầm nồng nặc len lỏi vào mũi Ta khi Ta bước dưới ánh nắng dịu trở lại khuôn viên [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
  ep3_laamp_decision_event.1040.desc_returned_from_healer: "Ta nheo mắt khi bước ra khỏi ánh tối lờ mờ của túp lều thầy thuốc, tìm đường quay lại quảng trường [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
  ep3_laamp_decision_event.1040.desc_returned_from_church: "Bước qua cổng của [visiting_location.GetCounty.GetFaith.HouseOfWorship], một sự tĩnh lặng an nhiên vẫn còn đọng lại trong lòng khi ta thấy mình trở lại quảng trường [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
  ep3_laamp_decision_event.1040.desc_returned_from_garden: "Ta trở về từ khu vườn tĩnh lặng với tâm trạng nhẹ nhõm hơn, phóng mắt ra quảng trường [visiting_location.GetCounty.GetFaith.HouseOfWorship] nhộn nhịp."
  ep3_laamp_decision_event.1040.desc_returned_from_physician: "Ta men theo những con hẻm dần thưa thớt từ phòng làm việc của [laamp_physician_recruit.GetFirstNamePossessiveNoTooltip], rồi quay lại khuôn viên [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
  ep3_laamp_decision_event.1040.desc: "Có một sự an yên đặc biệt tại quảng trường [visiting_location.GetCounty.GetFaith.HouseOfWorship], dù xung quanh đầy hoạt động buôn bán, các [visiting_location.GetCounty.GetFaith.PriestNeuterPlural] và người phụ giúp.\n\nMột [visiting_location.GetCounty.GetFaith.HouseOfWorship] nguy nga tọa lạc giữa trung tâm, và về hai bên là những biển hiệu quảng bá chữa bệnh, cùng một khu vườn phụ dành cho việc chiêm nghiệm tĩnh lặng về [visiting_location.GetCounty.GetFaith.HighGodName]."
  ep3_laamp_decision_event.1040.desc_outro_physician_sickly_minor: "\n\nỞ rìa quảng trường, một tín đồ đang giảng về sức khỏe thân thể tốt hơn; và như đã thỏa thuận từ trước, người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] ốm yếu của Ta, [1040_sickly_minor.GetFirstName], đã được đưa tới và đang chờ Ta tại lều thầy thuốc."
  ep3_laamp_decision_event.1040.desc_outro_physician: "\n\nỞ rìa quảng trường, vị tín đồ giảng giải rằng sức khỏe thể chất tốt sẽ nâng cao sức khỏe tinh thần. [laamp_physician_recruit.GetSheHe|U] vẫn đứng vững trước những tiếng chế giễu lác đác từ đám nông dân."
  ep3_laamp_decision_event.1040.desc_outro_sickly_minor: "\n\nNhư đã thỏa thuận với một người trong trại, người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] ốm yếu của Ta, [1040_sickly_minor.GetFirstName], đã được đưa tới và đang chờ Ta tại lều thầy thuốc."
  ep3_laamp_decision_event.1040.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] gật đầu hài lòng, nhìn quanh quảng trường nhộn nhịp, đã bắt đầu để mắt tới những quầy hàng lạ lẫm và điểm đáng chú ý."
  ep3_laamp_decision_event.1040.desc_outro: "\n\nTa cảm thấy hài lòng, phóng mắt qua quảng trường và hít sâu vài hơi khi suy ngẫm về điểm đến tiếp theo."
  ep3_laamp_decision_event.1040.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName], trông đã hơi mệt, nói: \"Ta không hay than phiền, nhưng... chắc là chúng ta xong việc ở đây rồi chứ, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?\""
  ep3_laamp_decision_event.1040.desc_outro_return_finished: "\n\nSau khi dành khá nhiều thời gian ở quảng trường [visiting_location.GetCounty.GetFaith.HouseOfWorship], Ta hài lòng với những việc trong ngày và tìm lối nhanh nhất quay lại quảng trường chính."
  ep3_laamp_decision_event.1040.desc_outro_physician_return: "\n\nVị tín đồ vẫn tiếp tục giảng giải các giáo huấn về sức khỏe của [laamp_physician_recruit.GetHerHis], nhưng dường như bài giảng sắp kết thúc."
  ep3_laamp_decision_event.1040.desc_outro_sickly_minor_return: "\n\nVì lý do nào đó, quảng trường giờ đây dường như có rất nhiều trẻ em. Chúng đã ở đây từ đầu sao? Chúng chơi đùa, vật lộn, liên tục tìm cách mới để làm những trò cũ; thường xuyên khiến người trông nom vừa bất ngờ vừa phiền lòng.\n\nTâm trí Ta vẫn lo lắng về tình trạng sức khỏe của [1040_sickly_minor.GetFirstNamePossessive], khi Ta nhìn quanh quảng trường để chọn điểm đến tiếp theo."
  ep3_laamp_decision_event.1040.desc_outro_return_partner_01: "\n\nBên trái Ta, [visiting_partner.GetFirstName] tò mò quan sát một quầy bày những lọ nhỏ li ti — được cho là chứa nọc độc của một [ROOT.Char.Custom('VenomousCreature')].\n\nChỉ nghĩ đến thôi cũng khiến da Ta nổi gai, khi Ta cân nhắc sẽ đi đâu tiếp."
  ep3_laamp_decision_event.1040.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] huých nhẹ vai Ta, chỉ về phía lính canh đang áp giải một [ROOT.Char.GetWomanMan] rách rưới ra khỏi khu vực, la hét về ngày tận thế.\n\nTa vô thức nhướn mày, quan sát sự hỗn loạn khi suy nghĩ bước tiếp theo."
  ep3_laamp_decision_event.1040.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] đưa cho Ta một mẩu thức ăn khi chúng Ta băng qua quảng trường.\n\nTa nhai phần lương khô một cách trầm ngâm, cân nhắc nước đi tiếp theo."
  ep3_laamp_decision_event.1040.desc_outro_return_01: "\n\nỞ một góc râm mát của quảng trường, một tay buôn bịp đang cố thuyết phục một [ROOT.Char.GetWomanMan] quý tộc về công dụng chữa bệnh của cát đỏ.\n\nTa thản nhiên quan sát màn cãi vã khi suy nghĩ sẽ làm gì tiếp."
  ep3_laamp_decision_event.1040.desc_outro_return_02: "\n\nTại một sạp hàng bán gương obsidian gần đó, một [visiting_location.GetCounty.GetFaith.PriestNeuter] đang cố gắng giấu đi vẻ phấn khích khi cuối cùng ngài cũng có cơ hội tự chiêm ngưỡng chính mình.\n\nHơi buồn cười, ta cố quyết định xem mình nên đi đâu tiếp theo."
  ep3_laamp_decision_event.1040.desc_outro_return_03: "\n\nBên cạnh mái vòm nhỏ, một tay buôn bịp mang theo các bản chép của [ROOT.Char.Custom('RandomReligiousTextName')] đang đọc to cho một nhóm người nghe khiêm tốn.\n\nTa lơ đãng lắng nghe trong lúc quan sát quảng trường, suy nghĩ bước tiếp theo."
  ep3_laamp_decision_event.1040.a: "Các thầy thuốc hẳn sẽ giúp ích cho ta."
  ep3_laamp_decision_event.1040.a_sickly_minor: "Chúng ta nên đến lều thầy thuốc!"
  ep3_laamp_decision_event.1040.a_second: "Ta nên quay lại gặp thầy thuốc."
  ep3_laamp_decision_event.1040.a_second_sickly_minor: "[1040_sickly_minor.GetFirstNameNoTooltip] vẫn đang chờ ở lều thầy thuốc."
  ep3_laamp_decision_event.1040.a.tt: "Đến lều thầy thuốc"
  ep3_laamp_decision_event.1040.a.cooldown.tt: "Thầy thuốc đang bận việc suốt phần còn lại của chuyến ghé thăm"

  ep3_laamp_decision_event.1040.b: "[visiting_location.GetCounty.GetFaith.HouseOfWorship] kia trông khá thú vị."
  ep3_laamp_decision_event.1040.b_second: "Hãy quay lại [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
  ep3_laamp_decision_event.1040.b.tt: "Vào [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
  ep3_laamp_decision_event.1040.b.cooldown.tt: "[visiting_location.GetCounty.GetFaith.HouseOfWorship] đang bận cử hành nghi lễ trong suốt chuyến ghé thăm này"
  caught_stealing.tt: "Ngài gần đây đã bị bắt khi trộm cắp tại nơi linh thiêng — Ngài bị cấm quay lại cho đến [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1040_caught_stealing') )]"

  ep3_laamp_decision_event.1040.c: "Dạo vườn một chút chắc cũng không hại gì."
  ep3_laamp_decision_event.1040.c_second: "Ta cần quay lại khu vườn."
  ep3_laamp_decision_event.1040.c.tt: "Thăm khu vườn phụ"
  ep3_laamp_decision_event.1040.c.cooldown.tt: "Khu vườn đang quá đông người trong phần còn lại của chuyến ghé thăm"

  ep3_laamp_decision_event.1040.d: "Có lẽ vị giảng đạo cũng có lý?"
  ep3_laamp_decision_event.1040.d_second: "Nói chuyện thêm với [laamp_physician_recruit.GetFirstNameNoTooltip] chắc cũng không hại gì."
  ep3_laamp_decision_event.1040.d.tt: "Trò chuyện với thầy thuốc [laamp_physician_recruit.GetShortUIName]"
  ep3_laamp_decision_event.1040.e: "$ep3_laamp_decision_event.1010.e$"
  ep3_laamp_decision_event.1040.e_second: "Chúng ta xong việc ở đây rồi."

 #Healer
  ep3_laamp_decision_event.1041.return.tt: "Ngài quay lại khuôn viên [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
  ep3_laamp_decision_event.1041.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Thầy lang"
  ep3_laamp_decision_event.1041.desc_returned_sickly_minor: "[1040_sickly_minor.GetFirstName] đang nghỉ ngơi trên lớp đệm mềm bên cạnh bếp lò trong túp lều của thầy lang, chờ Ta quay lại. Theo phản xạ, Ta cúi xuống kiểm tra hơi thở của [1040_sickly_minor.GetHerHis], rồi vuốt nhẹ mái tóc của [1040_sickly_minor.GetHerHis].\n\n[laamp_healer_character.GetFirstName] đặt [laamp_healer_character.GetHerHis] [ROOT.Char.Custom('WritingInstrument')] xuống và nhìn Ta với vẻ nghiêm nghị: \"Chúng ta đã thống nhất thế nào rồi?\""
  ep3_laamp_decision_event.1041.desc_returned_physician_partner: "Khi chúng ta bước vào túp lều của thầy thuốc, [laamp_healer_character.GetFirstName] đang nghiền ngẫm vài loại thảo mộc, nhưng ngài ngước nhìn chúng ta khi chúng ta bước xuống bậc thang: \"À, thay đổi ý định rồi sao?\"\n\nBên trái ta, [visiting_partner.GetFirstNameNoTooltip] đang chuyển trọng lượng cơ thể từ chân này sang chân kia, vẫn khao khát được thử sức với thủ thuật mà chúng ta đã thấy ngài thực hiện lúc nãy."
  ep3_laamp_decision_event.1041.desc_returned_01: "[laamp_healer_character.GetFirstName] đang chăm sóc một bệnh nhân khác khi Ta bước xuống cầu thang và vào trong túp lều của thầy lang. [laamp_healer_character.GetSheHe|U] liếc nhìn Ta, rồi ra hiệu cho bệnh nhân của [laamp_healer_character.GetHerHis] ngồi xuống lớp đệm ở sâu bên trong căn phòng.\n\n[laamp_healer_character.GetSheHe|U] tiếp tục khép lại một tấm rèm tạm bợ làm từ tấm vải đã sờn, mang lại chút riêng tư cho cả bệnh nhân lẫn chúng Ta.\n\n\"Ta thấy ngươi đã quay lại,\" [laamp_healer_character.GetSheHe] nói một cách cẩn trọng: \"Ngươi cần ta giúp điều gì chăng?\""
  ep3_laamp_decision_event.1041.desc_returned_02: "Bước trở lại túp lều mờ tối của thầy lang, [laamp_healer_character.GetFirstName] đang ngồi sâu hơn bên trong, lật giở những trang của một cuốn nhật ký cũ kỹ nào đó. Khó mà nhìn rõ từ xa, nhưng dường như nó chứa các hình vẽ mô tả cơ thể con người.\n\n[laamp_healer_character.GetSheHe|U] cẩn thận gấp cuốn nhật ký lại, cất đi, rồi nhìn Ta và nói bằng giọng bình thản: \"À, vậy là ngươi quay lại rồi. Cuối cùng cũng tìm ra thứ gì khiến ngươi khó chịu sao?\""
  ep3_laamp_decision_event.1041.desc_sickly_minor: "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] của Ta, [1040_sickly_minor.GetFirstName], đang ốm, đi cùng Ta tới túp lều của thầy lang. [1040_sickly_minor.GetSheHe|U] ho khẽ một cách yếu ớt khi Ta bế [1040_sickly_minor.GetHerHim] xuống cầu thang.\n\nThầy lang, [laamp_healer_character.GetFirstName], đứng dậy khỏi chiếc ghế gỗ của [laamp_healer_character.GetHerHis] và nhìn Ta với vẻ trầm mặc: \"Ngươi cần đến dịch vụ của ta chứ?\""
  ep3_laamp_decision_event.1041.desc_physician_partner: "Khi chúng Ta bước vào túp lều của thầy lang, [laamp_healer_character.GetFirstName] đang giữa chừng thực hiện một nghi thức thanh tẩy cho một [ROOT.Char.GetWomanMan] lớn tuổi. [visiting_partner.GetFirstName] quan sát [laamp_healer_character.GetFirstNameNoTooltip] đầy háo hức, ánh lên sự phấn khích trong mắt [visiting_partner.GetHerHis]: \"Ta cũng muốn thử làm #EMP chuyện đó#!...\"\n\n[laamp_healer_character.GetFirstNameNoTooltip] ngẩng lên khi [laamp_healer_character.GetSheHe] nghe thấy giọng chúng Ta: \"Ta không thấy các ngươi ở đó! Có điều gì khiến các ngươi khó chịu sao?\""
  ep3_laamp_decision_event.1041_intro: "Ánh sáng trong túp lều của thầy lang mờ hơn và có một #EMP mùi#! rất rõ. Không #EMP khó chịu#!, nhưng lan tỏa khắp nơi.\n\n[laamp_healer_character.GetFirstName] đang đứng bên một chiếc bàn cao, bận rộn pha chế một hỗn hợp nào đó."
  ep3_laamp_decision_event.1041.desc_reused_healer: "$ep3_laamp_decision_event.1041_intro$ [laamp_healer_character.GetSheHe|U] ngước nhìn lên, hơi nhướng mày: \"Ta thấy ngài đã quay lại một cách nguyên vẹn! Lần này ta có thể giúp gì cho ngài?\""
  ep3_laamp_decision_event.1041.desc: "$ep3_laamp_decision_event.1041_intro$ [laamp_healer_character.GetSheHe|U] ngẩng lên khi Ta tiến lại gần: \"Chào mừng. Các thể dịch của ngươi thế nào rồi? Cần thanh tẩy một chút chăng?\""
  ep3_laamp_decision_event.1041.desc_outro_return_horn: "\n\nSâu hơn trong căn phòng, chiếc [1041_health_artifact.GetName] tráng lệ vẫn đang nằm cùng những món linh vật y dược khác."
  ep3_laamp_decision_event.1041.desc_outro_return_artifact: "\n\nSâu hơn trong căn phòng, [1041_health_artifact.GetName] vẫn đang thu hút sự chú ý của Ta."
  ep3_laamp_decision_event.1041.desc_outro_horn: "\n\nỞ khóe mắt, Ta bắt gặp vài linh vật y dược, trong đó có một chiếc tù và tráng lệ khiến Ta chú ý."
  ep3_laamp_decision_event.1041.desc_outro_artifact: "\n\nSâu hơn trong căn phòng, trên một kệ đầy những linh vật y dược, Ta trông thấy một [1041_health_artifact.GetName] kỳ lạ, như đang mời gọi sự quan tâm của Ta."
  ep3_laamp_decision_event.1041.a: "Có lẽ điều hòa các thể dịch sẽ có lợi cho ta."
  ep3_laamp_decision_event.1041.a_ill: "\"Ta... cần được điều trị, đúng vậy.\""
  ep3_laamp_decision_event.1041.b: "\"Ta quan tâm đến [1041_health_artifact.GetNameNoTooltip] đó.\""
  ep3_laamp_decision_event.1041.c: "\"Liệu #EMP ngươi#! có thể thực hiện thủ thuật không, [visiting_partner.GetFirstNameNoTooltip]?\""
  ep3_laamp_decision_event.1041.c.flavor: "Cùng lắm thì chuyện tệ nhất là gì chứ!"
  ep3_laamp_decision_event.1041.d: "\"[1040_sickly_minor.GetFirstNameNoTooltip], người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1040_sickly_minor'))] của ta, cần được điều trị!\""
  ep3_laamp_decision_event.1041.d.partner: "\"[visiting_partner.GetFirstNameNoTooltip], người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_partner'))] của ta, cần được điều trị!\""
  ep3_laamp_decision_event.1041.treatment_success.t: "Thành công"
  ep3_laamp_decision_event.1041.treatment_failure.t: "Thất bại"
  ep3_laamp_decision_event.1041.treatment_failure.desc: "Việc điều trị không thành công"
  ep3_laamp_decision_event.1041.e: "$ep3_laamp_decision_event.1021.d$"

  aged_medicine_jar: "Hũ thuốc lâu năm"
  potent_medicine_jar: "Hũ thuốc hiệu nghiệm"
  lapidary_tourmaline: "Đá Tourmaline chế tác"
  lapidary_tourmaline.desc: "Một viên tourmaline dạng cabochon cỡ khá, được cho là có đặc tính tăng cường sinh lực."
  lapidary_turquoise: "Đá Ngọc lam chế tác"
  lapidary_turquoise.desc: "Một viên ngọc lam dạng cabochon cỡ khá, được cho là có đặc tính tăng cường sinh lực."
  lapidary_tigerseye: "Đá Mắt Hổ chế tác"
  lapidary_tigerseye.desc: "Một viên đá mắt hổ dạng cabochon cỡ khá, được cho là có đặc tính tăng cường sinh lực."
  lapidary_jasper: "Đá Jasper chế tác"
  lapidary_jasper.desc: "Một viên jasper dạng cabochon lớn, được cho là có lợi cho sức khỏe."
  lapidary_garnet: "Đá Garnet chế tác"
  lapidary_garnet.desc: "Một viên garnet dạng cabochon lớn, được cho là có lợi cho sức khỏe."
  lapidary_sapphire: "Đá Sapphire chế tác"
  lapidary_sapphire.desc: "Một viên sapphire duy nhất, tráng lệ, được cho là có thể bảo hộ người đeo."
  lapidary_ruby: "Đá Ruby chế tác"
  lapidary_ruby.desc: "Một viên ruby duy nhất, tráng lệ, được cho là có thể bảo hộ người đeo."
  scented_herb_pouch: "Túi thảo mộc ướp hương"
  scented_herb_pouch.desc: "Một túi thảo mộc nhỏ chứa hỗn hợp các loại thảo dược thơm, được cho là có thể ngăn ngừa nhiễm trùng."
  pomander: "Quả hương"
  pomander.desc: "Một quả cầu nhỏ tỏa hương, được mang trong một chiếc túi trang trí. Mùi hương được cho là có thể ngăn ngừa nhiễm trùng."

 #Church
  ep3_laamp_decision_event.1043.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
  ep3_laamp_decision_event.1043.desc_returned_01: "Một buổi thuyết giảng vừa kết thúc khi chúng Ta quay lại [visiting_location.GetCounty.GetFaith.HouseOfWorship]. [laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] đang đi quanh với cây chổi trong tay, nhẹ nhàng dọn dẹp, làm cho thánh địa gọn gàng ngăn nắp để đón những người đến đây cầu nguyện và chiêm niệm.\n\n[laamp_clergy_character.GetSheHe|U] ngẩng lên khi Ta tiến lại gần, một nụ cười hiền khẽ hiện trên môi [laamp_clergy_character.GetHerHis]: \"Chào mừng con trở lại trong vòng tay ấm áp của [visiting_location.GetCounty.GetFaith.HighGodHerHis|U]. Sao con không ở lại một chút và ngắm nhìn khung cảnh xung quanh?\""
  ep3_laamp_decision_event.1043.desc_returned_02: "[laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] đang ngồi trên băng ghế đối diện bục giảng, dường như chìm đắm trong sự chiêm nghiệm khi ta bước vào lại [visiting_location.GetCounty.GetFaith.HouseOfWorship].\n\nNgài quay đầu về phía ta, nhìn qua vai khi ta đến gần: \"Bận rộn quá. Hãy để đôi chân mệt mỏi đó nghỉ ngơi một chút, con của ta. Ta có thể phục vụ gì cho ngài đây?\""
  ep3_laamp_decision_event.1043.desc_reused_clergy: "Khi Ta bước qua cánh cổng tráng lệ của [visiting_location.GetCounty.GetFaith.HouseOfWorship], những [GetTrait('devoted').GetNameNoTooltip( laamp_clergy_character )|l] chăm nom nơi này vừa kết thúc và phân chia xong công việc trong ngày.\n\nTa nhìn dọc theo lối đi chính và bất ngờ nhận ra [laamp_clergy_character.Custom('SisterBrother')] [laamp_clergy_character.GetFirstName], người cũng đáp lại Ta bằng một ánh nhìn khó đoán rồi bước tới: \"Đứa con lạc lối của ta. [visiting_location.GetCounty.GetFaith.HighGodName] đã đưa con bình an trở về trước ngưỡng cửa của chúng ta!\""
  ep3_laamp_decision_event.1043.desc: "Bước qua cánh cổng của [visiting_location.GetCounty.GetFaith.HouseOfWorship], Ta không khỏi ấn tượng trước công sức hẳn đã được bỏ ra để tạo nên những công trình tinh xảo và vật trang trí linh thiêng nơi đây.\n\nMột trong những [GetTrait('devoted').GetNameNoTooltip( laamp_clergy_character )|l] chăm nom nơi này chú ý đến Ta và điềm tĩnh bước tới: \"Chào con, đứa trẻ của ta. Ta là [laamp_clergy_character.Custom('SisterBrother')] [laamp_clergy_character.GetFirstName]. Ta có thể giúp gì cho con?\""
  ep3_laamp_decision_event.1043.desc_outro: "\n\nÁnh mắt Ta thoáng lướt qua chiếc giỏ đựng tiền cúng dường ở sâu hơn một chút trong lối đi."
  ep3_laamp_decision_event.1043.desc_outro_thief: "\n\nSau lưng Ta, [visiting_partner.GetFirstName] đang liếc nhìn đầy mờ ám về phía chiếc giỏ đầy tiền cúng dường ở sâu hơn trong lối đi."
  ep3_laamp_decision_event.1043.desc_return_outro_thief: "\n\n[visiting_partner.GetFirstName] vẫn nhìn đầy thèm muốn qua những hàng ghế về phía chiếc giỏ tiền cúng dường."
  ep3_laamp_decision_event.1043.desc_return_outro: "\n\nChiếc giỏ tiền cúng dường đã ngày càng đầy lên trông thấy."
  ep3_laamp_decision_event.1043.a: "\"Ta có chút cúng dường muốn dâng lên!\""
  ep3_laamp_decision_event.1043.a.flavor_unzealous: "Ta #EMP đoán là#! vậy..."
  ep3_laamp_decision_event.1043.b: "\"Có lẽ [visiting_location.GetCounty.GetFaith.HighGodName] sẽ ban phúc cho sự nghiệp của chúng ta?\""
  ep3_laamp_decision_event.1043.c: "Rõ ràng là #EMP ta#! đang rất cần số tiền cúng dường này."
  ep3_laamp_decision_event.1043.c_guarded: "Thêm một khoản cúng dường nữa, vào #EMP túi của ta#!."
  ep3_laamp_decision_event.1043.c_master_thief: "\"Suỵt, [visiting_partner.GetFirstNameNoTooltip], trông chừng giúp ta!\""
  ep3_laamp_decision_event.1043.c.flavor: "Gây chú ý, chôm ít tiền. Quá dễ."
  ep3_laamp_decision_event.1043.c.flavor_guarded: "Hừm. Không hiểu sao bọn lính canh lại đi tuần dày đặc hơn hẳn ở khu này..."
  ep3_laamp_decision_event.1043.c.thievery_success.t: "Trộm cắp thành công"
  ep3_laamp_decision_event.1043.c.thievery_success.desc: "Ngài đã trộm được tiền cúng dường"
  ep3_laamp_decision_event.1043.c.thievery_failure.t: "Bị trục xuất!"
  ep3_laamp_decision_event.1043.c.thievery_failure.desc: "Ngài bị trục xuất khỏi [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
  ep3_laamp_decision_event.1043.c.thievery_critical_failure.t: "Triệu gọi lính canh"
  ep3_laamp_decision_event.1043.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
  ep3_laamp_decision_event.1043.d: "$ep3_laamp_decision_event.1021.d$"
 #Post-Donation
  ep3_laamp_decision_event.1044.desc_epiphany: "Khi ta trao khoản quyên góp, mắt ngài mở to đầy kinh ngạc: \"Ngài... ngài trông giống hệt [visiting_location.GetCounty.GetFaith.HighGodHerHis|U]... [visiting_location.GetCounty.GetFaith.HighGodHerHis|U]... ta thề đấy...\" Ngài nhìn ta một lúc, mấp máy môi như một con cá mắc cạn.\n\nSau đó, nhận ra mình đang làm gì, ngài lấy lại bình tĩnh và hắng giọng: \"Ta sẽ rất vinh dự được hiến dâng #EMP cuộc đời mình#! cho sự nghiệp của ngài.\""
  ep3_laamp_decision_event.1044.desc: "Nụ cười của ngài mở rộng khi ngài cúi người, đặt một tay lên vai ta: \"Thật tử tế quá, con của ta. Ta hiểu tiền bạc không phải lúc nào cũng dễ kiếm đối với một nhà thám hiểm như ngài.\"\n\nNgài gật đầu trịnh trọng, bàn tay buông thõng xuống bên cạnh khi ngài đặt ánh mắt lên ta."
  ep3_laamp_decision_event.1044.a: "\"Có lẽ [visiting_location.GetCounty.GetFaith.HighGodName] sẽ ban phúc cho chuyến hành trình của chúng ta?\""
  ep3_laamp_decision_event.1044.a_epiphany: "\"Ta chỉ quan tâm đến ân sủng của [visiting_location.GetCounty.GetFaith.HighGodNamePossessive].\""
  ep3_laamp_decision_event.1044.b: "\"Chúng ta #EMP có thể#! cần thêm một người hữu dụng.\""
  ep3_laamp_decision_event.1044.c: "\"Nếu không phải vì đồng loại của mình, thì ta chẳng quan tâm điều gì khác.\""
  ep3_laamp_decision_event.1044.c_epiphany: "...hiện tại chúng ta không tuyển người."
 
 #Garden
  ep3_laamp_decision_event.1045.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Khu Vườn"
  ep3_laamp_decision_event.1045.desc_returned_01: "Khu vườn vẫn tĩnh lặng như trước, một số du khách trò chuyện khẽ khàng ở các khu ghế ngồi trong khi những người khác đắm mình trong sự trầm tư yên lặng, dõi theo thiên nhiên trôi qua.\n\nTa lắng nghe những tiếng xì xào và làn gió nhẹ; gió lùa qua những tán cây, khiến Ta bỗng cảm thấy nhẹ nhõm hơn."
  ep3_laamp_decision_event.1045.desc_returned_02: "Lần này, Ta bắt gặp một chú chim nhỏ trên một trong những cây [visiting_location.Custom('GetRandomRegionalWood')], đang chập chững thử đôi cánh lần đầu tiên.\n\nNó nhẹ nhàng trượt khỏi mép tổ, nhưng đôi cánh lại vướng víu kỳ lạ, khiến trong vài khoảnh khắc con chim rơi tự do giữa không trung cho đến khi... làn gió nhẹ nhàng đỡ lấy nó, đưa nó tới nơi an toàn. Một cảm giác nhẹ nhõm lan tỏa khắp lồng ngực Ta."
  ep3_laamp_decision_event.1045.desc: "Khu vườn được viền bởi những hàng rào cây, và cây cối rải rác trên các gò đất thoai thoải, nơi thỉnh thoảng có thể nhìn thấy chim chóc và sóc ẩn hiện sau tán lá.\n\nTa cảm nhận rất rõ một sự hiện diện nơi đây, bị cuốn vào toàn bộ vẻ đẹp này. Phải chăng, xuyên suốt mọi thử thách và gian truân của Ta, [visiting_location.GetCounty.GetFaith.HighGodName] đã luôn ở bên Ta...?"
  ep3_laamp_decision_event.1045.desc_outro_return_partner: "\n\nCách đó một đoạn, [visiting_partner.GetFirstName] đang ngắm nghía lại những loại cây ăn được trong khu vực."
  ep3_laamp_decision_event.1045.desc_outro_return_gardener: "\n\nXa hơn một chút, Ta còn phát hiện thêm nhiều món hoang dã nữa, đang vươn mình dưới ánh nắng chiều."
  ep3_laamp_decision_event.1045.desc_outro_partner: "\n\nTừ phía sau, Ta nghe thấy [visiting_partner.GetFirstName] lẩm bẩm mỗi khi chúng Ta lại bắt gặp thêm một loại cây ăn được kỳ lạ nào đó trong lúc dạo bước."
  ep3_laamp_decision_event.1045.desc_outro_gardener: "\n\nỞ khóe mắt, Ta nhận ra những loại quả rừng và thảo mộc trông thật ngon lành, góp phần làm tăng thêm sự trù phú của khu vườn."
  ep3_laamp_decision_event.1045.a: "Ta cảm thấy thật bình yên."
  ep3_laamp_decision_event.1045.a_convert: "Có lẽ [visiting_location.GetCounty.GetFaith.GetNameNoTooltip] cũng không tệ như ta từng nghĩ."
  ep3_laamp_decision_event.1045.a.cooldown.tt: "Ngài đã suy ngẫm về khu vườn này gần đây — có thể quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_contemplated_garden_recently') )]"

  ep3_laamp_decision_event.1045.b: "Thật uổng phí nếu bỏ qua những món này."
  ep3_laamp_decision_event.1045.b_partner: "\"[visiting_partner.GetFirstNameNoTooltip], hay là chúng ta đi hái lượm một chút?\""
  ep3_laamp_decision_event.1045.b_flavor: "Đến lúc thu hoạch rồi!"
  ep3_laamp_decision_event.1045.b.cooldown.tt: "Ngài đã thu hoạch khu vườn này gần đây — có thể quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_has_harvested_recently') )]"

  ep3_laamp_decision_event.1045.c: "\"...quá nhiều ngóc ngách kín đáo, #EMP [visiting_partner.GetFirstNameNoTooltip]#!...\""
  ep3_laamp_decision_event.1045.c.flavor: "Quả thực là thần thánh."
  ep3_laamp_decision_event.1045.c.cooldown.tt: "Ngài đã thư giãn trong khu vườn này gần đây — có thể quay lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_garden_unwinded_recently') )]"

  ep3_laamp_decision_event.1045.d: "$ep3_laamp_decision_event.1021.d$"

 #Physician
  ep3_laamp_decision_event.1047.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Thầy Thuốc"
  ep3_laamp_decision_event.1047.desc_returned_01: "Cánh cửa phòng làm việc của [laamp_physician_recruit.GetFirstNamePossessive] hé mở, và qua khe cửa Ta thấy [laamp_physician_recruit.GetFirstNameNoTooltip] đang cắt tóc cho một khách hàng ngồi im bất động, bằng một chiếc kéo mảnh và sắc đến đáng sợ.\n\nTa gõ cửa rồi bước vào, thu hút sự chú ý của vị thầy thuốc: \"Lén lút thật đấy. Ngươi muốn gì?\""
  ep3_laamp_decision_event.1047.desc_returned_02: "[laamp_physician_recruit.GetFirstName] đang đứng ngoài cửa, kiểm tra vai của một [ROOT.Char.GetWomanMan] trông có vẻ đang đau đớn.\n\nNgài kết thúc chuyến thăm, đưa ra chỉ dẫn về cách chữa trị khớp tốt nhất, rồi quay sang ta: \"Ngài quay lại rồi. Lần này ngài muốn gì?\""
  ep3_laamp_decision_event.1047.desc_returned_03: "Khi ta rón rén bước lên bậc thang đến phòng làm việc, ta nhìn qua cánh cửa mở.\n\nNgài có vẻ đang chìm vào một hình thức luyện tập thể chất và làm việc đến vã cả mồ hôi, liên tục ngồi xổm rồi lại đứng dậy bắt đầu từ đầu.\n\nSau một số lần lặp lại, ngài dừng lại, lau trán và uống một ngụm nước từ chai gần đó. Ánh mắt sắc bén của ngài tập trung vào ta: \"Khá là dai dẳng đấy, ngài nhỉ?\""
  ep3_laamp_decision_event.1047_desc_intro: "Ta theo [laamp_physician_recruit.GetFirstName] qua một con hẻm vắng dần, lên vài bậc thang rồi vào phòng làm việc của [laamp_physician_recruit.GetHerHis]. Căn phòng chật kín từ sàn tới trần, với các kệ sách chứa đầy kinh thư và bản in liên quan đến thể dịch, sức khỏe và tâm linh.\n\n[laamp_physician_recruit.GetSheHe|U] ngồi xuống chiếc ghế duy nhất sau bàn, vô thức vuốt ve một lá bùa nhỏ rồi cuối cùng cũng nhận ra sự hiện diện của Ta: "
  ep3_laamp_decision_event.1047.desc_reused_physician: "$ep3_laamp_decision_event.1047_desc_intro$\"Ồ. Ta hình như đã gặp ngươi ở đâu đó rồi thì phải? Ngươi muốn gì?\"\n\nTa cẩn thận cân nhắc lời nói, rồi đáp lại:"
  ep3_laamp_decision_event.1047.desc: "$ep3_laamp_decision_event.1047_desc_intro$\"Ồ. Là ngươi à. Ngươi muốn gì?\"\n\n\"Ta đã thấy buổi giảng của ngươi cho những kẻ khốn khó,\" Ta đáp, rồi do dự trước khi nói tiếp:"
  ep3_laamp_decision_event.1047.a: "\"Muốn đến làm việc cho ta không?\""
  ep3_laamp_decision_event.1047.b: "\"Hãy giúp ta củng cố tinh thần cho các tín đồ của ta!\""
  ep3_laamp_decision_event.1047.c: "\"Ngươi cần phải #EMP dùng#! kỹ năng của mình để luôn sắc bén. Gia nhập trại của ta.\""
  ep3_laamp_decision_event.1047.c.success: "[laamp_physician_recruit.GetShortUIName] đồng ý với đánh giá của Ngài"
  ep3_laamp_decision_event.1047.c.failure: "Ngài không thể thuyết phục được [laamp_physician_recruit.GetShortUIName]"
  ep3_laamp_decision_event.1047.c.failure.tt: "[laamp_physician_recruit.GetShortUIName] bắt đầu phớt lờ Ngài"
  ep3_laamp_decision_event.1047.d: "$ep3_laamp_decision_event.1021.d$"

 #Option: Visit the local castle grounds
  ep3_laamp_decision_event.1050.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Lâu Đài"
  ep3_laamp_decision_event.1050.desc_returned_01: "Ta bước lại qua cổng của [visiting_location.GetHolding.GetType.GetName|l], vừa đi vừa quan sát hoa văn và màu sắc của lá cờ mang huy hiệu gia tộc [visiting_location.GetTitle.GetHolder.GetHouse.GetName]."
  ep3_laamp_decision_event.1050.desc_returned_02: "Khi chúng Ta trở về từ quảng trường chính của [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip], một làn gió khiến lá cờ rực rỡ của gia tộc [visiting_location.GetTitle.GetHolder.GetHouse.GetNameNoTooltip] khẽ lay động trên tường thành."
  ep3_laamp_decision_event.1050.desc_returned_from_training: "Bước qua cổng [visiting_location.GetHolding.GetType.GetName|l] từ bãi huấn luyện trở về, lần này đám lính gác hầu như chẳng buồn liếc Ta thêm lần nào."
  ep3_laamp_decision_event.1050.desc_returned_from_garrison: "Rời khỏi khu doanh trại, Ta nheo mắt trước luồng ánh sáng bất ngờ và hít sâu bầu không khí trong lành."
  ep3_laamp_decision_event.1050.desc_returned_from_reinforcers: "Vẫn còn suy nghĩ về những binh lính chán nản, Ta thong thả quay lại sân trong của [visiting_location.GetHolding.GetType.GetName|l], nơi hầu như không có gì thay đổi."
  ep3_laamp_decision_event.1050.desc_returned_from_bodyguard: "Ta để [laamp_bodyguard_recruit.GetFirstName] tiếp tục trút cơn bực dọc của [laamp_bodyguard_recruit.GetHerHis] lên những xác động vật, rồi khéo léo len qua các con hẻm vắng để trở lại khuôn viên [visiting_location.GetHolding.GetType.GetName|l]."
  ep3_laamp_decision_event.1050.desc: "Khuôn viên [visiting_location.GetBaronyNameExplicitlyNoTooltip] của [visiting_location.GetHolding.GetType.GetName|l], đúng như dự đoán, được trang bị cho mục đích quân sự: thùng tên, những vũ khí cán dài vương vãi, một chuồng ngựa khang trang, và nhiều thứ khác."
  ep3_laamp_decision_event.1050.mid_maa: "\n\nBãi huấn luyện nằm ngay bên ngoài cổng, khu đồn trú có vài lính gác đang lề mề đứng quanh, và phía dưới con đường Ta thấy một nhóm chiến binh [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] nhếch nhác, mất tinh thần tụ tập."
  ep3_laamp_decision_event.1050.mid_no_maa: "\n\nBãi huấn luyện nằm ngay bên ngoài cổng, và một nhóm nhỏ lính gác đồn trú đang lề mề trước lối vào, hoặc là nửa tỉnh nửa mê, hoặc là đang lau chùi vũ khí."
  ep3_laamp_decision_event.1050.desc_outro_bodyguard: "\n\nỞ phía bên kia sân trong, một [laamp_bodyguard_recruit.GetWomanMan] đang gầm gào với vài [laamp_bodyguard_recruit.GetWomenMen] khác: \"...và đó KHÔNG PHẢI LỖI CỦA TA!\" Cuộc cãi vã ngày càng căng thẳng, và Ta theo dõi tình hình một cách thăm dò."
  ep3_laamp_decision_event.1050.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] nhìn quanh một cách trầm ngâm, rồi ngắm lá cờ vững chãi mang huy hiệu gia tộc [visiting_location.GetTitle.GetHolder.GetHouse.GetName], đang nhẹ nhàng bay trong gió."
  ep3_laamp_decision_event.1050.desc_outro: "\n\nTa mím môi, trầm tư nhìn quanh cảnh hỗn độn có tổ chức gồm [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')], lính gác, quân sĩ và binh lính."
  ep3_laamp_decision_event.1050.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
  ep3_laamp_decision_event.1050.desc_outro_return_finished: "\n\nSau khi đã xem xét kỹ lưỡng mọi ngóc ngách của [visiting_location.GetBaronyNameExplicitlyNoTooltip] [visiting_location.GetHolding.GetType.GetName|l], Ta đã xong việc ở đây và không còn lý do để ở lại.\n\nTa nhìn quanh để tìm con đường nhanh nhất quay lại quảng trường chính của [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip]."
  ep3_laamp_decision_event.1050.desc_outro_bodyguard_return: "\n\nĐám [laamp_bodyguard_recruit.GetWomenMen] tức giận vẫn đang cãi vã ở rìa sân trong, tình hình giờ đây được một nhóm lính gác gần đó theo dõi chặt chẽ để tránh leo thang đổ máu."
  ep3_laamp_decision_event.1050.desc_outro_return_partner_01: "\n\nTa cảm thấy một cái thúc nhẹ khi [visiting_partner.GetFirstName] huých Ta, thì thầm về những nét mặt xui xẻo mang dáng dấp [visiting_partner.Custom('GetGenderAlliteratingAnimal')] của một lính gác ở rìa quảng trường.\n\nTa cau mày không tán thành nhìn [visiting_partner.GetFirstNameNoTooltip] khi cân nhắc điểm đến tiếp theo."
  ep3_laamp_decision_event.1050.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] tò mò quan sát một người bán hàng rong đang khéo léo vung một lưỡi kiếm cong trong không trung để chứng minh sự ưu việt của đường cong.\n\nÁnh mắt Ta lang thang dọc quảng trường, cân nhắc xem nên đi đâu tiếp."
  ep3_laamp_decision_event.1050.desc_outro_return_partner_03: "\n\nTa quay sang bên trái khi [visiting_partner.GetFirstName] ngáp dài. Ta nhướn mày khi [visiting_partner.GetSheHe] làm vẻ mặt xin lỗi, rồi lại đưa mắt về sân trong, suy nghĩ xem nên làm gì tiếp."
  ep3_laamp_decision_event.1050.desc_outro_return_01: "\n\nỞ một góc quảng trường, một nhóm trẻ con cầm kiếm gỗ đang bắt chước thứ trông giống như một bài tập của [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')], với độ chính xác đến rợn người.\n\nTa quan sát chúng cẩn thận trong khi cân nhắc điểm đến tiếp theo."
  ep3_laamp_decision_event.1050.desc_outro_return_02: "\n\nMột đoàn rước cưỡi ngựa vừa đi qua cổng, trông có vẻ thuộc về một quý tộc địa phương[ROOT.Char.GetWomanMan], và Ta ngắm nhìn cảnh tượng đó khi suy nghĩ xem nên đi đâu tiếp."
  ep3_laamp_decision_event.1050.desc_outro_return_03: "\n\nTại các lối vào sân trong và [visiting_location.GetHolding.GetType.GetName|l], lính gác đang xuất hiện để thay ca, kịp thời thay thế những người cũ. Ta thản nhiên quan sát sự đổi ca khi suy tính bước tiếp theo."

  ep3_laamp_decision_event.1050.a: "Hãy đến thăm bãi huấn luyện địa phương."
  ep3_laamp_decision_event.1050.a_second: "Quay lại bãi huấn luyện thêm lần nữa cũng tốt."
  ep3_laamp_decision_event.1050.a.tt: "Đi tới bãi huấn luyện"
  ep3_laamp_decision_event.1050.a.cooldown.tt: "Bãi huấn luyện đang bận phục vụ một buổi luyện tập đã được lên lịch"
  recruited_maa.tt: "[laamp_disgruntled_moa.GetShortUIName] đang bận chuyển vào doanh trại của Ngài"

  ep3_laamp_decision_event.1050.b: "Chúng ta nên tìm vài nhân lực có năng lực trong doanh trại lính gác."
  ep3_laamp_decision_event.1050.b_second: "Doanh trại lính gác vẫn khá thú vị."
  ep3_laamp_decision_event.1050.b.tt: "Đi tới doanh trại lính gác"
  ep3_laamp_decision_event.1050.b.cooldown.tt: "Do có kẻ xâm nhập, cổng doanh trại bị đóng trong suốt phần còn lại của chuyến thăm này"

  ep3_laamp_decision_event.1050.c: "Biết đâu đám binh sĩ lôi thôi người [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] kia lại hữu dụng?"
  ep3_laamp_decision_event.1050.c_second: "Đám [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] mất tinh thần kia vẫn có thể dùng được."
  ep3_laamp_decision_event.1050.c.tt: "Tiếp cận các binh sĩ mất tinh thần"
  ep3_laamp_decision_event.1050.c.cooldown.tt: "Đơn vị [men_at_arms|E] [soldiers|E] mới của Ngài đang bận chuyển vào doanh trại"
  ep3_laamp_decision_event.1050.c.cooldown_province.tt: "Ngài đã tăng viện [men_at_arms|E] tại [visiting_location.GetBaronyNameExplicitly] trong 90 ngày qua"

  ep3_laamp_decision_event.1050.d: "Không biết họ đang cãi nhau vì chuyện gì?"
  ep3_laamp_decision_event.1050.d_second: "Hãy trò chuyện thêm lần nữa với cựu vệ sĩ."
  ep3_laamp_decision_event.1050.d.tt: "Tiếp cận nhóm [laamp_bodyguard_recruit.GetWomenMen] đang cãi vã"
  ep3_laamp_decision_event.1050.d.tt_second: "Nói chuyện với [laamp_bodyguard_recruit.GetShortUIName]"

  ep3_laamp_decision_event.1050.e: "$ep3_laamp_decision_event.1010.e$"
  ep3_laamp_decision_event.1050.e_second: "$ep3_laamp_decision_event.1040.e_second$"

 #Training
  ep3_laamp_decision_event.1051.return.tt: "Ngài quay lại khuôn viên [visiting_location.GetHolding.GetType.GetName|l]"
  ep3_laamp_decision_event.1051.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Bãi Huấn Luyện"
  ep3_laamp_decision_event.1051.desc_returned_01: "Quay lại bãi huấn luyện, viên quản binh, [laamp_disgruntled_moa.GetFirstName], lăng xăng xếp chồng trang bị và lầm bầm càu nhàu với chính [laamp_disgruntled_moa.GetHerselfHimself] về tình hình hiện tại.\n\nCố gắng không tỏ ra #EMP quá#! bất mãn, [laamp_disgruntled_moa.GetSheHe] liếc Ta bằng ánh mắt cau có khi Ta lại gần [laamp_disgruntled_moa.GetHerHim] một lần nữa."
  ep3_laamp_decision_event.1051.desc_returned_02: "Tại bãi huấn luyện, viên quản binh, [laamp_disgruntled_moa.GetFirstName], đang đứng nghiêm khi trang bị huấn luyện được một sĩ quan cấp trên kiểm tra.\n\nKhi người đó rời đi để quay về [visiting_location.GetHolding.GetType.GetName|l], [laamp_disgruntled_moa.GetFirstNameNoTooltip], giờ đã thôi đứng nghiêm, dường như thấp đi vài phân khi dáng đứng khom lưng quen thuộc quay trở lại. [laamp_disgruntled_moa.GetSheHe|U] ném cho Ta một ánh nhìn lạnh lẽo."
  ep3_laamp_decision_event.1051.desc: "\"...Ta nói cho mà biết, mọi thứ ở đây đã đi xuống #EMP từ lâu lắm rồi#!,\" viên quản binh địa phương, [laamp_disgruntled_moa.GetFirstName], khịt mũi rồi tiếp tục: \"Lúc nào cũng phải ngoái đầu nhìn trước sau, bị chất vấn về...\" [laamp_disgruntled_moa.GetSheHe] im bặt khi Ta tiến lại gần bãi tập.\n\nTheo bản năng, Ta quan sát vô số trang bị và chướng ngại huấn luyện, cố gắng phớt lờ ánh nhìn thách thức của [laamp_disgruntled_moa.GetFirstNamePossessiveNoTooltip]."
  ep3_laamp_decision_event.1051.desc_outro_martial_partner: "\n\nBên phải Ta, [visiting_partner.GetFirstName] nhấc lên một thanh kiếm tập và bắt đầu vung vẩy đầy kinh nghiệm, nhìn Ta với vẻ mong đợi."
  ep3_laamp_decision_event.1051.desc_outro_return_martial_partner: "\n\nGần giá treo những thanh kiếm cùn, [visiting_partner.GetFirstName] đứng khoanh tay. [visiting_partner.GetSheHe|U] nhìn vũ khí rồi quay sang Ta, nở một nụ cười tinh quái."
  ep3_laamp_decision_event.1051.a: "Hãy tập luyện một buổi nào!"
  ep3_laamp_decision_event.1051.a_athletic.desc: "Màn đấu tập của Ngài rất hiệu quả"
  ep3_laamp_decision_event.1051.a.desc: "Ngài tiến hành một buổi đấu tập"
  ep3_laamp_decision_event.1051.b: "\"Ngươi nên gia nhập doanh trại của chúng ta. Tự do vô cùng.\""
  ep3_laamp_decision_event.1051.c: "\"Đỡ này, [visiting_partner.GetFirstNameNoTooltip]!\""
  ep3_laamp_decision_event.1051.c_joshing.t: "Đùa Giỡn"
  ep3_laamp_decision_event.1051.c_joshing.desc: "Buổi đấu tập diễn ra không hiệu quả"
  ep3_laamp_decision_event.1051.c_wounded.t: "$playdate_training_injury_log_title$"
  ep3_laamp_decision_event.1051.c_wounded.desc: "$martial_authority.8000_injury$"
  ep3_laamp_decision_event.1051.d: "$ep3_laamp_decision_event.1021.d$"

 #Garrison
  ep3_laamp_decision_event.1053.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Doanh Trại"
  ep3_laamp_decision_event.1053.desc_returned_01: "Khi Ta quay lại doanh trại, [laamp_plain_guard.GetFirstName] đang dịu dàng xoa xoa bờ môi sưng của [laamp_plain_guard.GetHerHis].\n\nGần một chiếc bàn tạm bợ làm từ thùng gỗ, một ván bài vừa kết thúc và [laamp_talented_guard.GetFirstName] gật đầu grừ một tiếng khi thu về tiền thắng của [laamp_talented_guard.GetHerHis].\n\nCả hai đánh giá Ta khi Ta tiến lại gần nhóm lính gác."
  ep3_laamp_decision_event.1053.desc_returned_02: "Quay lại doanh trại râm mát, [laamp_plain_guard.GetFirstName] đang chợp mắt trong khi [laamp_talented_guard.GetFirstName] đếm tiền xu của [laamp_talented_guard.GetHerHis]. Khi viên lính gác kỳ cựu nhận ra Ta, [laamp_talented_guard.GetSheHe] huých nhẹ [laamp_plain_guard.GetFirstNameNoTooltip].\n\nViên lính ít kinh nghiệm giật mình tỉnh dậy, ngồi bật dậy và cố xoa đi cơn ngái ngủ khỏi đôi mắt của [laamp_plain_guard.GetHerHis].\n\nCả hai nhìn Ta với vẻ dò xét."
  ep3_laamp_decision_event.1053.desc: "Bên trong doanh trại ngột ngạt, lính gác đã dựng một võ đài để rèn luyện kỹ năng. Hai người trong số họ đang đấu với nhau, liên tục tung đòn trong khi được một nhóm nhỏ người xem cổ vũ.\n\nTa quan sát một lúc và rõ ràng [laamp_talented_guard.GetFirstName], người lính thứ nhất, dày dạn kinh nghiệm hơn hẳn so với [laamp_plain_guard.GetFirstName], người lính thứ hai.\n\nKhi họ kết thúc, Ta thận trọng tiến lại gần võ đài và họ chuyển sự chú ý sang Ta:"
  ep3_laamp_decision_event.1053.a: "\"[laamp_plain_guard.GetFirstNameNoTooltip], muốn đến làm việc cho ta không?\""
  ep3_laamp_decision_event.1053.b: "\"Chúng ta có thể dùng người có kỹ năng như ngươi, [laamp_talented_guard.GetFirstNameNoTooltip].\""
  ep3_laamp_decision_event.1053.c: "\"Có ai muốn chơi một ván xúc xắc không?\""
  ep3_laamp_decision_event.1053.c.plain_wins: "[laamp_plain_guard.GetShortUIName] thắng ván này"
  ep3_laamp_decision_event.1053.c.talented_wins: "[laamp_talented_guard.GetShortUIName] thắng ván này"
  ep3_laamp_decision_event.1053.c.you_win: "Ngài thắng ván này"
  ep3_laamp_decision_event.1053.d: "$ep3_laamp_decision_event.1021.d$"

#Reinforcers
  ep3_laamp_decision_event.1055.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Quân Tiếp Viện"
  ep3_laamp_decision_event.1055.desc_maxed_out_returned: "Khi Ta quay lại trại lều, các nhóm binh sĩ dõi mắt theo Ta rồi tách ra nhường đường.\n\nHọ thì thầm về việc Ta đã góp phần đánh bại một [ROOT.Char.Custom('RegionalMythicalCreatureLower')] huyền thoại, cùng nhiều câu chuyện kỳ ảo khác.\n\nKhóe môi Ta cong lên thành một nụ cười mỏng khi Ta quay lại trước mặt thủ lĩnh, [laamp_maa_reinforcer.GetHerHis] cúi nhẹ đầu và chủ động tránh ánh mắt Ta trong lúc [laamp_maa_reinforcer.GetSheHe] chờ Ta lên tiếng."
  ep3_laamp_decision_event.1055.desc_returned_01: "Quay lại trại lều, Ta bắt gặp một nhóm binh sĩ đang tưới nước cho ngựa. Áo choàng của họ cho thấy họ thuộc một trong những đơn vị kỵ binh tinh nhuệ và khó tiếp cận hơn.\n\nTa men theo lối mòn uốn lượn xuyên qua các lều để quay lại gặp [laamp_maa_reinforcer.GetWomanMan] đáng sợ khi nãy, kẻ thậm chí chẳng buồn che giấu sự bất mãn của [laamp_maa_reinforcer.GetHerHis].\n\n[laamp_maa_reinforcer.GetSheHe|U] nhìn Ta bằng đôi mắt mệt mỏi và chờ Ta lên tiếng."
  ep3_laamp_decision_event.1055.desc_returned_02: "Quay lại trại lều, binh sĩ hầu như không để ý đến Ta khi Ta đi ngang và tiến sâu hơn vào trong.\n\nCuối cùng, Ta tìm thấy [laamp_maa_reinforcer.GetWomanMan] khi nãy, và chỉ một cái giật nhẹ nơi lông mày của [laamp_maa_reinforcer.GetHerHis] mới cho thấy chút ngạc nhiên khi [laamp_maa_reinforcer.GetSheHe] thấy Ta quay lại sớm như vậy.\n\nĐôi mắt của [laamp_maa_reinforcer.GetHerHis|U] nhìn xa xăm khi [laamp_maa_reinforcer.GetSheHe] chờ Ta nói."
  ep3_laamp_decision_event.1055.desc_maxed_out: "Ta bước xuống trại lều ở rìa [visiting_location.GetBaronyNameExplicitlyNoTooltip], cảm nhận rõ những ánh mắt dõi theo.\n\nNhững binh sĩ bại trận và kiệt quệ thì thầm sau lưng Ta khi Ta tiến đến một trong những thủ lĩnh đám ô hợp.\n\n[laamp_maa_reinforcer.GetHerHis|U] hơi mở to mắt khi [laamp_maa_reinforcer.GetSheHe] chờ Ta lên tiếng."
  ep3_laamp_decision_event.1055.desc: "Trại lều ở rìa [visiting_location.GetBaronyNameExplicitlyNoTooltip] chật kín binh sĩ và chiến binh, lớn nhỏ đủ cả, thuộc nhiều nền văn hóa khác nhau nhưng chủ yếu là người [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip].\n\nHọ tụ tập thành từng nhóm, đa số cau có và nhìn quanh như thể đang tìm lối thoát khỏi cảnh khốn cùng.\n\nTa tiếp tục đi cho đến khi gặp một [laamp_maa_reinforcer.GetWomanMan] to lớn vừa quát mắng xong vài chiến binh đầy sẹo, và [laamp_maa_reinforcer.GetSheHe] nhìn Ta đầy nghi ngờ."
  ep3_laamp_decision_event.1055.a: "\"Hãy cùng ta xông pha — [ROOT.Char.GetTitledFirstNameNoTooltip] lừng danh!\""
  ep3_laamp_decision_event.1055.a.flavor: "Danh giá ư? Ta chỉ làm điều cần phải làm."
  ep3_laamp_decision_event.1055.a.cooldown.tt: "Ngài đã tận dụng [prestige_level|E] của mình gần đây — thêm nhiều binh sĩ háo danh sẽ tập hợp vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_prestige_recently') )]"

  ep3_laamp_decision_event.1055.prestige_level: "Nhờ [prestige_level|E] của Ngài:"
  ep3_laamp_decision_event.1055.prestige_full.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.full.tt$"
  ep3_laamp_decision_event.1055.prestige_partial_80.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 80#!%)#!"
  ep3_laamp_decision_event.1055.prestige_partial_60.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 60#!%)#!"
  ep3_laamp_decision_event.1055.prestige_partial_40.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 40#!%)#!"
  ep3_laamp_decision_event.1055.prestige_partial_20.tt: "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 20#!%)#!"

  ep3_laamp_decision_event.1055.b: "\"Hãy theo ta, phụng sự [ROOT.Char.GetFaith.GetNameNoTooltip]!\""
  ep3_laamp_decision_event.1055.b.flavor: "Chỉ có [ROOT.Char.GetFaith.HighGodName] mới phán xét được lòng mộ đạo của ta."
  ep3_laamp_decision_event.1055.b.cooldown.tt: "Ngài đã tận dụng [piety_level|E] của mình gần đây — thêm nhiều binh sĩ cuồng tín sẽ tập hợp vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_piety_recently') )]"

  ep3_laamp_decision_event.1055.piety_level: "Nhờ [piety_level|E] của Ngài:"
  ep3_laamp_decision_event.1055.piety_full.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.full.tt$"
  ep3_laamp_decision_event.1055.piety_partial_80.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 80#!%)#!"
  ep3_laamp_decision_event.1055.piety_partial_60.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 60#!%)#!"
  ep3_laamp_decision_event.1055.piety_partial_40.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 40#!%)#!"
  ep3_laamp_decision_event.1055.piety_partial_20.tt: "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 20#!%)#!"

  ep3_laamp_decision_event.1055.c: "\"Có lẽ chúng ta có thể trao đổi chút gì đó?\""
  ep3_laamp_decision_event.1055.c.tt: "Một [men_at_arms|E] [regiment|E] ngẫu nhiên:\n#P #EMP $BULLET_WITH_TAB$Được bổ sung quân đầy đủ!#!#!"
  ep3_laamp_decision_event.1055.d: "\"Đây là cơ hội để các ngươi chiến đấu vì #EMP chính nghĩa!#!\""
  ep3_laamp_decision_event.1055.d.flavor: "Cùng nhau, vì một thế giới tốt đẹp hơn."
  ep3_laamp_decision_event.1055.d.tt: "Nhờ [GetTrait('knight_errant').GetName( GetNullCharacter )] [trait_level_track_xp|E] của Ngài:$refill_maa_regiments_fully_reinforced_tt$"
  ep3_laamp_decision_event.1055.e: "$ep3_laamp_decision_event.1021.d$"

  ep3_laamp_decision_event.1055.all_regiments: "\n$BULLET_WITH_TAB$Tất cả [men_at_arms|E] [regiments|E] của Ngài (#V [num_damaged_maa_regiments]#!):"
  ep3_laamp_decision_event.1055.full.tt: "$ep3_laamp_decision_event.1055.all_regiments$$refill_maa_regiments_fully_reinforced_tt$"
  ep3_laamp_decision_event.1055.positive_partial.tt: "#P #EMP \n$BULLET_WITH_TAB$Các trung đoàn sẽ được bổ sung một phần!#!"
  ep3_laamp_decision_event.1055.alert_partial.tt: "#alert_trial \n$BULLET_WITH_TAB$Các trung đoàn sẽ được bổ sung một phần!#!"


 #Bodyguard
  ep3_laamp_decision_event.1057.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Người Vệ Sĩ"
  ep3_laamp_decision_event.1057.desc_returned_01: "Khi ta trở lại con hẻm nơi ta để lại cựu vệ sĩ, [laamp_bodyguard_recruit.GetFirstName], ngài đang thản nhiên tán gẫu với chủ nhân của mình, người bán thịt địa phương.\n\nTiến lại gần hơn, họ kết thúc cuộc trò chuyện thân tình và gã bán thịt vỗ vai ngài một cách thân thiện khi ngài bước vào trong.\n\n[laamp_bodyguard_recruit.GetFirstNameNoTooltip], giờ đây trong mắt ngài ánh lên một chút thân thiện, quay sang ta: \"Ồ. Ngài quay lại rồi à. Ngài muốn gì?\""
  ep3_laamp_decision_event.1057.desc_returned_02: "Cựu vệ sĩ [laamp_bodyguard_recruit.GetFirstName] ngước nhìn khi ta quay lại con hẻm nơi ngài thực hiện nghề nghiệp mới của mình.\n\nCon dao nhảy múa trong không trung khi ngài thái xác động vật thành những miếng phi lê gọn gàng, và ta vô tình lùi lại vì sự dữ dội đó.\n\nNgài nhìn ta chằm chằm và với giọng nói không chút cảm xúc, ngài đáp: \"...vâng?\""
  ep3_laamp_decision_event.1057.desc_returned_03: "Trở lại con hẻm, [laamp_bodyguard_recruit.GetFirstName] đang ngồi trên chiếc xe trống, chăm sóc vết thương ở khớp tay [laamp_bodyguard_recruit.GetHerHis], có lẽ do một cuộc ẩu đả với những kẻ bất bình trước tai tiếng của [laamp_bodyguard_recruit.GetHerHis].\n\nNhăn mặt, [laamp_bodyguard_recruit.GetSheHe] nhận ra sự hiện diện của ta và nói: \"À, toàn gặp ta lúc huy hoàng nhất nhỉ.\" [laamp_bodyguard_recruit.GetSheHe|U] ngả người ra sau và thở dài. \"Quên gì sao?\""
  ep3_laamp_decision_event.1057.desc_reused_bodyguard: "Ta lờ mờ nhận ra tiếng la hét của [laamp_bodyguard_recruit.GetWomanMan], và khi những [laamp_bodyguard_recruit.GetWomenMen] buộc tội kia rời đi, ta theo [laamp_bodyguard_recruit.GetFirstName] vào một con hẻm.$ep3_laamp_decision_event.1057.desc_mid$\n\nVệ sĩ thất sủng nheo mắt khi ta tiến lại: \"Khoan đã, ta hình như đã gặp ngài ở đâu rồi thì phải...?\" [laamp_bodyguard_recruit.GetSheHe|U] nhăn mặt. \"Thôi kệ. Ngài muốn gì?\""
  ep3_laamp_decision_event.1057.desc: "Từ những tiếng la hét, ta nghe được cái tên [laamp_bodyguard_recruit.GetFirstName], và khi những [laamp_bodyguard_recruit.GetWomenMen] buộc tội kia rời đi, ta theo [laamp_bodyguard_recruit.GetFirstNameNoTooltip] vào một con hẻm.$ep3_laamp_decision_event.1057.desc_mid$\n\nVệ sĩ thất sủng nhìn ta với ánh mắt héo hon khi ta tiến lại: \"Ngài muốn gì? Ta đến cả một cái #EMP cây#! còn chẳng giữ nổi sống...\""
  ep3_laamp_decision_event.1057.desc_mid: "\n\nNgài ngay lập tức bắt đầu dỡ xác động vật ra khỏi chiếc xe kéo tồi tàn, lầm bầm với bản thân: \"...#EMP một#! quý tộc mất mạng dưới sự bảo vệ của ngươi, và... làm sao #EMP ta#! có thể biết được thứ [laamp_bodyguard_recruit.Custom('RegionalDrink')] đó lại...\" Ngài đấm nắm đấm vào chiếc xe, đầy thất vọng."
  ep3_laamp_decision_event.1057.a: "$ep3_laamp_decision_event.1047.a$"
  ep3_laamp_decision_event.1057.b: "\"Thấy mấy cơ bắp này không? #EMP Ta#! về cơ bản là bảo vệ #EMP ngươi#! đấy.\""
  ep3_laamp_decision_event.1057.c: "\"Theo ta, và chúng ta sẽ khôi phục danh tiếng của ngươi!\""
  ep3_laamp_decision_event.1057.c.success: "[laamp_bodyguard_recruit.GetShortUIName] bị thuyết phục"
  ep3_laamp_decision_event.1057.c.failure: "Ngươi không thể lôi kéo [laamp_bodyguard_recruit.GetShortUIName]"
  ep3_laamp_decision_event.1057.c.failure.tt: "[laamp_bodyguard_recruit.GetShortUIName] bắt đầu phớt lờ ngươi"
  ep3_laamp_decision_event.1057.d: "\"Đây là cơ hội #EMP chuộc lỗi#! của ngươi.\""
  ep3_laamp_decision_event.1057.e: "$ep3_laamp_decision_event.1021.d$"

 #Option: Visit the local city craftsmen
  ep3_laamp_decision_event.1060.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Khu Thợ Thủ Công"
  ep3_laamp_decision_event.1060.desc_returned_01: "Mặt trời treo cao trên khu thợ thủ công khi ta quay lại, giữa vô vàn âm thanh, cảnh tượng và mùi hương."
  ep3_laamp_decision_event.1060.desc_returned_02: "Mây phủ làm dịu ánh sáng khắp khu thợ thủ công, và ta quay lại trong một mùi hăng nồng khi nhận ra mình đã đi quá gần xưởng thuộc da."
  ep3_laamp_decision_event.1060.desc_returned_from_weaponsmith: "Quay lại từ lò rèn vũ khí, các thợ thủ công cùng phụ tá của họ vẫn đang tất bật khuân vác hàng hóa qua lại."
  ep3_laamp_decision_event.1060.desc_returned_from_armorer: "Mồ hôi từ lò rèn chảy dọc sống lưng ta, và ta được ban cho một làn gió mát khi trở lại khu thợ thủ công."
  ep3_laamp_decision_event.1060.desc_returned_from_jeweler: "Ta nheo mắt trước ánh sáng chói lòa của quảng trường khi bước ra khỏi tiệm thợ kim hoàn và tiến vào quảng trường khu thợ thủ công."
  ep3_laamp_decision_event.1060.desc_returned_from_quartermaster: "Không khí ngoài khu thợ thủ công dễ chịu hơn hẳn khi ta bước ra khỏi quán rượu u ám nơi [laamp_quartermaster_recruit.GetFirstName] đang dìm [laamp_quartermaster_recruit.GetHerHis] nỗi sầu."
  ep3_laamp_decision_event.1060.desc: "Trong khu thợ thủ công của [visiting_location.GetBaronyNameExplicitly], mọi ngành nghề cần thiết đều hiện diện — thợ rèn vũ khí [laamp_weaponsmith_craftsman.GetFirstName] gần bãi tập, thợ giáp [laamp_armorer_craftsman.GetFirstName] trong lò rèn của [laamp_armorer_craftsman.GetHerHis], và [laamp_jeweler_craftsman.GetFirstName], thợ kim hoàn, ở phía trước."
  ep3_laamp_decision_event.1060.desc_outro_quartermaster: "\n\nNgoài ra còn có một [laamp_quartermaster_recruit.GetWomanMan] rách rưới, cam chịu đang lẩn thẩn quanh đây. [laamp_quartermaster_recruit.GetSheHe|U] nhìn ta và gầm lên đầy phẫn uất: \"Ta từng là #EMP một người có vị thế!#! Ta là [laamp_quartermaster_recruit.GetFirstName], #EMP quản kho của [visiting_location.GetTitle.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip|l]!#!\" rồi dịu xuống, dường như chìm vào suy tư."
  ep3_laamp_decision_event.1060.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] theo bước ta, thong thả dạo dọc con phố và bình luận về các món hàng trưng bày. [visiting_partner.GetSheHe|U] nhìn ta khi ta dừng lại, cố quyết định nên đi đâu tiếp."
  ep3_laamp_decision_event.1060.desc_outro: "\n\nTa dừng lại một lúc, ngắm nhìn bọn trẻ chơi đùa giữa những nguyên liệu thô. Cha mẹ chúng nhẹ nhàng xua chúng đi trong khi ta quyết định bước tiếp."
  ep3_laamp_decision_event.1060.desc_outro_return_partner_finished: "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
  ep3_laamp_decision_event.1060.desc_outro_return_finished: "\n\nChân mỏi và bụng réo, đó là một ngày hiệu quả tại khu thợ thủ công. Ta nhìn quanh tìm con đường nhanh nhất quay về quảng trường chính."
  ep3_laamp_decision_event.1060.desc_outro_quartermaster_return: "\n\nTrong lúc cân nhắc điểm đến tiếp theo, ta liếc nhìn cựu quản kho [laamp_quartermaster_recruit.GetFirstName] vẫn đang lang thang vô định trên quảng trường."
  ep3_laamp_decision_event.1060.desc_outro_return_partner_01: "\n\n[visiting_partner.GetFirstName] hít hít không khí, nhanh nhẹn băng qua quảng trường, lách người qua dòng người qua lại để giữ kịp nhịp bước với ta.\n\n[visiting_partner.GetSheHe|U] bắt kịp khi ta dừng lại trong chốc lát, cân nhắc việc tiếp theo."
  ep3_laamp_decision_event.1060.desc_outro_return_partner_02: "\n\nBên trái ta, [visiting_partner.GetFirstName] tò mò quan sát một quầy hàng phủ đầy da [ROOT.Char.Custom('RegionalFerociousAnimal')] với đủ kích cỡ, hình dạng và màu sắc.\n\nMột cái đầu thú được treo trưng bày nhe răng cười với ta khi ta nhìn dọc con phố, cố quyết định nên đi đâu tiếp."
  ep3_laamp_decision_event.1060.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] thong thả đi tới đi lui trên quảng trường, xem xét các quầy hàng. Lơ đãng quan sát [visiting_partner.GetHerHim], ta cân nhắc việc tiếp theo."
  ep3_laamp_decision_event.1060.desc_outro_return_01: "\n\nTa lơ đãng nhìn dọc ngang quảng trường, ánh mắt trống rỗng khi suy nghĩ xem nên đi đâu tiếp."
  ep3_laamp_decision_event.1060.desc_outro_return_02: "\n\nVài đứa trẻ đang chơi đùa với một con [ROOT.Char.Custom('get_region_dog_type')] to lớn, cho nó ăn vụn thức ăn và thay nhau cưỡi trên tấm lưng vạm vỡ của nó.\n\nTa thản nhiên quan sát trò chơi ấy trong khi cân nhắc bước tiếp theo."
  ep3_laamp_decision_event.1060.desc_outro_return_03: "\n\nMột nhóm trẻ con tìm được một khối quặng lớn và đang đá nó qua lại dọc con phố, theo những luật lệ mơ hồ do chính chúng đặt ra.\n\nTa chăm chú quan sát chúng với sự thích thú, đồng thời cân nhắc kỹ lưỡng công việc kế tiếp."
  ep3_laamp_decision_event.1060.a: "Vũ khí là thứ hữu dụng nhất lúc này."
  ep3_laamp_decision_event.1060.a_second: "Mấy món vũ khí trông khá hấp dẫn."
  ep3_laamp_decision_event.1060.a.tt: "Đến quầy thợ rèn vũ khí"
