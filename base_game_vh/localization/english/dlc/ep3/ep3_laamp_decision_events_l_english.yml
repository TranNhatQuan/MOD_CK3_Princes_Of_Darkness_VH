 #Option: Buy supplies
  ep3_laamp_decision_event.1010.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Nhu yếu phẩm!"
  ep3_laamp_decision_event.1010.desc_posh_stalls: "Những quầy hàng trong khu ẩm thực của [visiting_location.GetBaronyNameExplicitly] tràn ngập hàng hóa, khiến giá cả bị đẩy xuống thấp. Ta tìm thấy quầy của người bán nhu yếu phẩm [laamp_supply_merchant.GetFirstNamePossessive]; một sự cân bằng tuyệt vời giữa chất lượng tốt và giá cả phải chăng.\n\nNhận thấy sự chú ý của Ta,"
  ep3_laamp_decision_event.1010.desc: "Từ [ROOT.Char.Custom('RegionalRootVegetablePlural')] cho tới vải vóc; từ củi đốt cho đến chỉ khâu — người bán nhu yếu phẩm [laamp_supply_merchant.GetFirstName] có đủ mọi thứ. Quầy hàng chật kín những vật dụng mà người ta có thể cần cho một đêm nơi hoang dã.\n\nTa tiến lại gần hơn một chút để thu hút sự chú ý của [laamp_supply_merchant.GetHerHis], và"
  ep3_laamp_decision_event.1010.desc_returned: "Quầy hàng vẫn còn đầy ắp vật phẩm, người bán nhu yếu phẩm [laamp_supply_merchant.GetFirstName] cúi xuống nhặt một [ROOT.Char.Custom('RegionalRootVegetable')] bị rơi khỏi mép quầy.\n\nTa khẽ nhướng mày với [laamp_supply_merchant.GetHerHim] để báo hiệu mình đã quay lại, và"
  ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_01: "[laamp_supply_merchant.GetSheHe] quan sát Ta từ đầu đến chân, đầy vẻ ngạc nhiên thích thú:"
  ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_02: "[laamp_supply_merchant.GetSheHe] trông thực sự có phần sững sờ khi thấy Ta:"
  ep3_laamp_decision_event.1010.desc_reused_merchant_intro: "\"Một vị khách quay lại!\""
  ep3_laamp_decision_event.1010.desc_reused_merchant_01: "Đúng là gặp người quen trong lúc cần!"
  ep3_laamp_decision_event.1010.desc_reused_merchant_02: "Chưa thấy đủ sao!"
  ep3_laamp_decision_event.1010.desc_reused_merchant_03: "Không thể tin được!"
  ep3_laamp_decision_event.1010.desc_reused_merchant_outro_01: "Ngài muốn dùng món gì đây?\""
  ep3_laamp_decision_event.1010.desc_reused_merchant_outro_02: "Ngài cần thứ gì?\""
  ep3_laamp_decision_event.1010.desc_trait_gregarious_new: "[laamp_supply_merchant.GetSheHe] bừng tỉnh khi [laamp_supply_merchant.GetSheHe] nhìn tôi với một nụ cười thân thiện: "
  ep3_laamp_decision_event.1010.desc_trait_gregarious_return: "[laamp_supply_merchant.GetSheHe] lại nở một nụ cười thân thiện với Ta: "
  ep3_laamp_decision_event.1010.desc_trait_callous_new: "[laamp_supply_merchant.GetSheHe] hầu như không nhìn về hướng tôi khi [laamp_supply_merchant.GetSheHe] nói với tôi: "
  ep3_laamp_decision_event.1010.desc_trait_callous_return: "[laamp_supply_merchant.GetSheHe] vẫn hầu như chẳng thừa nhận sự hiện diện của Ta: "
  ep3_laamp_decision_event.1010.desc_trait_greedy_new: "Gương mặt [laamp_supply_merchant.GetHerHis] nở ra một nụ cười mãn nguyện khi thấy Ta: "
  ep3_laamp_decision_event.1010.desc_trait_greedy_return: "Trong mắt [laamp_supply_merchant.GetHerHis] lóe lên một tia tính toán khi [laamp_supply_merchant.GetSheHe] nhìn Ta từ đầu đến chân: "
  ep3_laamp_decision_event.1010.desc_trait_shy_new: "[laamp_supply_merchant.GetSheHe] nhìn Ta với ánh mắt chăm chú, trái ngược hẳn với giọng nói nhẹ nhàng của [laamp_supply_merchant.GetHerHis]: "
  ep3_laamp_decision_event.1010.desc_trait_shy_return: "[laamp_supply_merchant.GetSheHe] cân nhắc kỹ lưỡng sự trở lại của tôi trước khi [laamp_supply_merchant.GetSheHe] nói khẽ: "
  ep3_laamp_decision_event.1010.desc_trait_eccentric_new: "[laamp_supply_merchant.GetSheHe] nhìn Ta với ánh mắt trống rỗng, rõ ràng đang bận tâm chuyện khác: "
  ep3_laamp_decision_event.1010.desc_trait_eccentric_return: "[laamp_supply_merchant.GetSheHe] nhìn Ta, dường như không hề nhận ra rằng chúng Ta vừa mới gặp nhau cách đây không lâu: "
  ep3_laamp_decision_event.1010.desc_generic_new_01: "[laamp_supply_merchant.GetSheHe] khẽ gật đầu về phía Ta: "
  ep3_laamp_decision_event.1010.desc_generic_new_02: "[laamp_supply_merchant.GetSheHe] nhìn Ta bằng ánh mắt đầy ẩn ý: "
  ep3_laamp_decision_event.1010.desc_generic_returned_01: "[laamp_supply_merchant.GetSheHe] nhướng mày đầy thích thú: "
  ep3_laamp_decision_event.1010.desc_generic_returned_02: "[laamp_supply_merchant.GetSheHe] ngẩng lên và lên tiếng với Ta: "
  ep3_laamp_decision_event.1010.desc_outro_new_01: "\"Có thứ gì lọt vào mắt ngài không?\""
  ep3_laamp_decision_event.1010.desc_outro_new_02: "\"Ngài thấy món nào ưng ý chứ?\""
  ep3_laamp_decision_event.1010.desc_outro_new_03: "\"Ngài cần gì?\""
  ep3_laamp_decision_event.1010.desc_outro_special_new_04: "\"Thế giới ngoài kia khắc nghiệt lắm, phải không? Ta có thể giúp gì cho ngài?\""
  ep3_laamp_decision_event.1010.desc_outro_returned_01: "\"Rốt cuộc thì hàng hóa trông cũng ổn chứ?\""
  ep3_laamp_decision_event.1010.desc_outro_returned_02: "\"Ta đã linh cảm là ngài sẽ quay lại.\""
  ep3_laamp_decision_event.1010.desc_outro_returned_03: "\"Hàng tốt nhất toàn cõi [visiting_location.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
  ep3_laamp_decision_event.1010.desc_outro_sneaky_partner: "\n\n[visiting_partner.GetFirstName] bẻ tay [visiting_partner.GetHerHis] và nhìn tôi, khẽ gật đầu về phía nguồn cung cấp, lẩm bẩm: "Có muốn tạo một màn đánh lạc hướng không...?""
  ep3_laamp_decision_event.1010.desc_outro_sneaky_partner_returned: "\n\n[visiting_partner.GetFirstName] vẫn chăm chú quan sát đám hàng hóa bày ra, thỉnh thoảng liếc nhìn Ta như chờ một tín hiệu để kiếm nhu yếu phẩm '#EMP miễn phí#!'."
  ep3_laamp_decision_event.1010.a_diplomacy: "\"Ngài chẳng tình cờ có chút nhu yếu phẩm dư dả nào sao, bằng hữu...?\""
  ep3_laamp_decision_event.1010.a_diplomacy.success: "Ngài đã thành công mê hoặc [laamp_supply_merchant.GetShortUIName]"
  ep3_laamp_decision_event.1010.a_diplomacy.failure: "[laamp_supply_merchant.GetShortUIName] đánh hơi được sự túng quẫn của Ngài"
  ep3_laamp_decision_event.1010.a_diplomacy.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
  ep3_laamp_decision_event.1010.a_stewardship: "\"Ta có thể giúp ngài chuyển mấy thứ này, đổi lại một phần nhỏ.\""
  ep3_laamp_decision_event.1010.a_stewardship.success: "Ngài đã thuyết phục thành công [laamp_supply_merchant.GetShortUIName]"
  ep3_laamp_decision_event.1010.a_stewardship.failure: "[laamp_supply_merchant.GetShortUIName] không bị lý lẽ của Ngài đánh lừa"
  ep3_laamp_decision_event.1010.a_stewardship.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
  ep3_laamp_decision_event.1010.a_intrigue: "\"Chẳng phải kia là [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip] sao?!\""
  ep3_laamp_decision_event.1010.a_intrigue.success: "Ngài đã thành công trộm được một mớ nhu yếu phẩm"
  ep3_laamp_decision_event.1010.a_intrigue.failure: "Ngài lúng túng và khiến [laamp_supply_merchant.GetShortUINamePossessive] sinh nghi"
  ep3_laamp_decision_event.1010.a_intrigue.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
  ep3_laamp_decision_event.1010.a_learning: "\"Ta e rằng mấy món ăn này sắp hỏng rồi...\""
  ep3_laamp_decision_event.1010.a_learning.success: "[laamp_supply_merchant.GetShortUIName] đồng ý nhượng lại số nhu yếu phẩm đã quá hạn"
  ep3_laamp_decision_event.1010.a_learning.failure: "$ep3_laamp_decision_event.1010.a_stewardship.failure$"
  ep3_laamp_decision_event.1010.a_learning.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
  ep3_laamp_decision_event.1010.a_martial: "\"Ta có thể lấy nhu yếu phẩm. Hoặc lấy luôn cả quầy hàng. Tùy ngươi.\""
  ep3_laamp_decision_event.1010.a_martial.success: "Ngài đã thành công uy hiếp [laamp_supply_merchant.GetShortUIName]"
  ep3_laamp_decision_event.1010.a_martial.failure: "[laamp_supply_merchant.GetShortUIName] nhìn thấu những lời đe dọa rỗng tuếch của Ngài"
  ep3_laamp_decision_event.1010.a_martial.critical_failure: "Lính canh được triệu tập"
  ep3_laamp_decision_event.1010.a_prowess.success: "$ep3_laamp_decision_event.1010.a_martial.success$"
  ep3_laamp_decision_event.1010.a_prowess.failure: "$ep3_laamp_decision_event.1010.a_martial.failure$"
  ep3_laamp_decision_event.1010.a_prowess.critical_failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
  ep3_laamp_decision_event.1010.a.failure.tt: "Chi phí [provision|E] bị #N tăng#! trong #V [EmptyScope.ScriptValue('visit_settlement_minimum_cooldown_months')|0] tháng#!"
  ep3_laamp_decision_event.1010.a.cooldown.tt: "Ngài gần đây đã cố gắng kiếm [provisions|E] miễn phí — hãy thử lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1010_has_convinced_recently') )]"

  ep3_laamp_decision_event.1010.b: "\"Ta sẽ mua vài thứ này và vài thứ kia.\""
  ep3_laamp_decision_event.1010.c_callous: "\"Ta có thể đổi tên học việc trẻ này lấy nhu yếu phẩm.\""
  ep3_laamp_decision_event.1010.c: "\"...có lẽ ta có thể đổi một học việc trẻ?\""
  ep3_laamp_decision_event.1010.c.flavor: "Xin hãy tha thứ cho ta..."
  ep3_laamp_decision_event.1010.c.flavor_callous: "Ít ra cũng bớt đi một miệng ăn."
  ep3_laamp_decision_event.1010.d: "\"Ôi chà! Đúng là vụng về thật!\""
  ep3_laamp_decision_event.1010.d.flavor: "[visiting_partner.GetFirstNameNoTooltip], #EMP đi đi!#!"
  ep3_laamp_decision_event.1010.d.success: "[visiting_partner.GetShortUIName] đã thành công trộm được một mớ nhu yếu phẩm"
  ep3_laamp_decision_event.1010.d.failure: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
  ep3_laamp_decision_event.1010.d.cooldown.tt: "Ngài gần đây đã cố gắng trộm [provisions|E] — hãy thử lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1010_has_stolen_recently') )]"

  ep3_laamp_decision_event.1010.e: "Quay lại thôi."

 #Option: Sell an artifact to local peddlers
  ep3_laamp_decision_event.1020.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Không Hỏi Nguồn Gốc"
  ep3_laamp_decision_event.1020.desc_intro_reused_peddler: "Một giọng nói vang lên giữa sự ồn ào náo nhiệt của các quầy cổ vật: \"Ta lúc nào cũng trân trọng khách quen!\" [laamp_artifact_peddler.GetFirstName] thốt lên, khi [laamp_artifact_peddler.GetSheHe] tiến lại gần để xem qua đồ đạc của Ta."
  ep3_laamp_decision_event.1020.desc_intro_posh_stalls: "Khu thương mại của [visiting_location.GetBaronyNameExplicitly] chật kín những kẻ mua bán đủ loại cổ vật hiếm lạ và ngoại lai, và Ta chẳng gặp khó khăn gì trong việc tìm ra người buôn cổ vật danh tiếng [laamp_artifact_peddler.GetFirstName]."
  ep3_laamp_decision_event.1020.desc_intro_new_01: "Đang tìm người sẵn sàng giúp Ta giải quyết vài món đồ trong tay, thì người buôn cổ vật [laamp_artifact_peddler.GetFirstName] xuất hiện để xem qua kho hàng của Ta."
  ep3_laamp_decision_event.1020.desc_intro_new_02: "Con hẻm chật kín các quầy hàng, vai Ta vô tình va phải ai đó từ phía sau. Khi người buôn cổ vật [laamp_artifact_peddler.GetFirstName] quay lại đối mặt với Ta, [laamp_artifact_peddler.GetSheHe] nhận ra đồ đạc Ta mang theo và nghiêng người lại gần để xem kỹ hơn."
  ep3_laamp_decision_event.1020.desc_intro_returned_01: "Đi bộ trở lại chỗ người bán cổ vật, [laamp_artifact_peddler.GetFirstName] nhìn tôi tò mò khi tôi trở lại các gian hàng cổ vật: "Lời đề nghị của tôi vẫn còn hiệu lực."\n\nSau đó [laamp_artifact_peddler.GetSheHe] quay lại quầy của [laamp_artifact_peddler.GetHerHis] và bắt đầu sắp xếp lại hàng hóa."
  ep3_laamp_decision_event.1020.desc_intro_returned_02: "Trở lại khu buôn cổ vật, quầy của [laamp_artifact_peddler.GetFirstNamePossessive] vẫn nổi bật giữa đám đông nhờ sự phong phú và chất lượng cao của hàng hóa.\n\n[laamp_artifact_peddler.GetSheHe|U] nhận ra Ta, dừng lại một lát rồi nói: \"Vậy là chốt kèo rồi chứ?\""
  ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_01: "Vẫn đang cân nhắc các lựa chọn của mình, [laamp_artifact_peddler.GetFirstName] bắn cho tôi một cái nhìn lãnh đạm và tuôn ra: "Lời đề nghị của tôi vẫn còn hiệu lực," bằng giọng đơn điệu.\n\nSau đó [laamp_artifact_peddler.GetSheHe] thản nhiên quay sang quầy của [laamp_artifact_peddler.GetHerHis] và bắt đầu sắp xếp lại hàng hóa."
  ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_02: "Khi tôi hơi do dự, [laamp_artifact_peddler.GetFirstName] có vẻ hơi khó chịu vì sự thiếu quyết đoán của tôi.\n\n[laamp_artifact_peddler.GetSheHe|U] nhún vai [laamp_artifact_peddler.GetHerHis] với câu "Cứ lấy hết thời gian ngươi cần đi," và lết sang giúp một khách hàng khác."
  ep3_laamp_decision_event.1020.desc_one_artifact_new_01: "\n\nVới một cái chạm đầy kinh nghiệm, [laamp_artifact_peddler.GetSheHe] kiểm tra bề mặt của [1020_first_artifact_to_sell.GetName] của tôi, sau đó gật đầu và lẩm bẩm điều gì đó với [laamp_artifact_peddler.GetHerselfHimself]."
  ep3_laamp_decision_event.1020.desc_one_artifact_new_02: "\n\n[laamp_artifact_peddler.GetSheHe|U] nhẹ nhàng gõ vào bề mặt của [1020_first_artifact_to_sell.GetName], sau đó nghiêng đầu [laamp_artifact_peddler.GetHerHis], như thể đang lắng nghe điều gì đó. Sau đó [laamp_artifact_peddler.GetSheHe] gật đầu."
  ep3_laamp_decision_event.1020.desc_two_artifacts_new_01: "\n\n[laamp_artifact_peddler.GetSheHe|U] chạy những ngón tay [laamp_artifact_peddler.GetHerHis] dọc theo [1020_first_artifact_to_sell.GetName] và mắt của [laamp_artifact_peddler.GetHerHis] ánh lên vẻ tò mò khi nhận thấy [1020_second_artifact_to_sell.GetName]."
  ep3_laamp_decision_event.1020.desc_two_artifacts_new_02: "\n\n[laamp_artifact_peddler.GetSheHe|U] bắt đầu véo thử [1020_first_artifact_to_sell.GetName], cẩn thận cân nhắc loại hình [1020_first_artifact_to_sell.Custom('ArtifactType')], rồi [laamp_artifact_peddler.GetSheHe] nhẹ nhàng kiểm tra [1020_second_artifact_to_sell.GetName], dường như khá hài lòng."
  ep3_laamp_decision_event.1020.desc_three_artifacts_new_01: "\n\nXem xét, xoay trở đủ chiều; [laamp_artifact_peddler.GetSheHe] soi xét từng chi tiết — từ lớp hoàn thiện của [1020_first_artifact_to_sell.GetName], chất liệu của [1020_second_artifact_to_sell.GetName], cho tới hoa văn trang trí trên [1020_third_artifact_to_sell.GetName]."
  ep3_laamp_decision_event.1020.desc_three_artifacts_new_02: "\n\nChưa đầy một lúc, [laamp_artifact_peddler.GetSheHe|U] đã kiểm tra kỹ [1020_first_artifact_to_sell.GetName] và [1020_second_artifact_to_sell.GetName]. Đôi tay [laamp_artifact_peddler.GetHerHis|U] nhanh chóng lướt trên bề mặt [1020_third_artifact_to_sell.GetName], tìm kiếm khuyết điểm."
  ep3_laamp_decision_event.1020.desc_outraged_partner_new: "\n\nBất chợt, Ta nghe thấy giọng đầy phẫn nộ của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))] mình, [visiting_partner.GetFirstNamePossessive], sát bên tai: \"Họ đang lợi dụng ngài đấy! #EMP Ta#! có thể kiếm cho ngài một giá tốt hơn!\""
  ep3_laamp_decision_event.1020.desc_outraged_partner_returned: "\n\nTừ khóe mắt, Ta thấy [visiting_partner.GetFirstName] vẫn còn sôi sục trước những lời chào giá rẻ mạt của [laamp_artifact_peddler.GetFirstNamePossessiveNoTooltip]."
  ep3_laamp_decision_event.1020.a: "Ta sẵn sàng nhượng lại..."
  ep3_laamp_decision_event.1020.a.tt: "Ngài được chọn cổ vật để bán"
  ep3_laamp_decision_event.1020.a.first_artifact.tt: "Giá chào #V hiện tại#! của [1020_first_artifact_to_sell.GetName]: [gold_i] [1020_first_artifact_to_sell.MakeScope.Var('1020_artifact_sell_value').GetValue|0]"
  ep3_laamp_decision_event.1020.a.second_artifact.tt: "Giá chào #V hiện tại#! của [1020_second_artifact_to_sell.GetName]: [gold_i] [1020_second_artifact_to_sell.MakeScope.Var('1020_artifact_sell_value').GetValue|0]"
  ep3_laamp_decision_event.1020.a.third_artifact.tt: "Giá chào #V hiện tại#! của [1020_third_artifact_to_sell.GetName]: [gold_i] [1020_third_artifact_to_sell.MakeScope.Var('1020_artifact_sell_value').GetValue|0]"
  ep3_laamp_decision_event.1020.b: "\"[laamp_artifact_peddler.GetFirstNameNoTooltip], người buôn kia vừa trả cho ta giá cao hơn.\""
  ep3_laamp_decision_event.1020.b.success: "Ngài đã thuyết phục được [laamp_artifact_peddler.GetShortUIName]"
  ep3_laamp_decision_event.1020.b.success.first_artifact.tt: "Giá chào #P tăng#! của [1020_first_artifact_to_sell.GetName]: [gold_i] [1020_first_artifact_to_sell.MakeScope.Var('1020_artifact_sell_high_value').GetValue|0]"
  ep3_laamp_decision_event.1020.b.success.second_artifact.tt: "Giá chào #P tăng#! của [1020_second_artifact_to_sell.GetName]: [gold_i] [1020_second_artifact_to_sell.MakeScope.Var('1020_artifact_sell_high_value').GetValue|0]"
  ep3_laamp_decision_event.1020.b.success.third_artifact.tt: "Giá chào #P tăng#! của [1020_third_artifact_to_sell.GetName]: [gold_i] [1020_third_artifact_to_sell.MakeScope.Var('1020_artifact_sell_high_value').GetValue|0]"
  ep3_laamp_decision_event.1020.b.failure: "[laamp_artifact_peddler.GetShortUIName] lật bài ngửa và không mắc lừa"
  ep3_laamp_decision_event.1020.b.failure.first_artifact.tt: "Giá chào #N giảm#! của [1020_first_artifact_to_sell.GetName]: [gold_i] [1020_first_artifact_to_sell.MakeScope.Var('1020_artifact_sell_low_value').GetValue|0]"
  ep3_laamp_decision_event.1020.b.failure.second_artifact.tt: "Giá chào #N giảm#! của [1020_second_artifact_to_sell.GetName]: [gold_i] [1020_second_artifact_to_sell.MakeScope.Var('1020_artifact_sell_low_value').GetValue|0]"
  ep3_laamp_decision_event.1020.b.failure.third_artifact.tt: "Giá chào #N giảm#! của [1020_third_artifact_to_sell.GetName]: [gold_i] [1020_third_artifact_to_sell.MakeScope.Var('1020_artifact_sell_low_value').GetValue|0]"
  ep3_laamp_decision_event.1020.b.cooldown.tt: "Ngài gần đây đã thử mặc cả — hãy thử lại vào [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1020_has_haggled_recently') )]"
  ep3_laamp_decision_event.1020.c: "\"[visiting_partner.GetFirstNameNoTooltip], chuyện này giao cho ngươi.\""
  ep3_laamp_decision_event.1020.c.first_artifact: "[visiting_partner.GetFirstName] bán [1020_first_artifact_to_sell.GetName]"
  ep3_laamp_decision_event.1020.c.second_artifact: "[visiting_partner.GetFirstName] bán [1020_second_artifact_to_sell.GetName]"
  ep3_laamp_decision_event.1020.c.third_artifact: "[visiting_partner.GetFirstName] bán [1020_third_artifact_to_sell.GetName]"
  ep3_laamp_decision_event.1020.d: "$ep3_laamp_decision_event.1010.e$"
  ep3_laamp_decision_event.1020.eagle.tt: "Ngài bán chim ưng săn của mình thay cho một cổ vật"
  ep3_laamp_decision_event.1020.eagle.price_tt: "Giá chào #V hiện tại#! của chim ưng: [gold_i] [GetPlayer.MakeScope.ScriptValue('hunting_eagle_sell_value')|0]"

 #Actual sell screen
  ep3_laamp_decision_event.1021.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Giờ Chia Tay"
  ep3_laamp_decision_event.1021.t_success: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Của Ta!"
  ep3_laamp_decision_event.1021.t_failure: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Cái chết của một Người bán[ROOT.Char.GetWomanMan]"
  ep3_laamp_decision_event.1021.desc_moment_of_purchase_01: "[laamp_artifact_peddler.GetFirstName] nhìn Ta đầy mong đợi, dường như hài lòng với quyết định của Ta: \"Ngài muốn bán món nào?\""
  ep3_laamp_decision_event.1021.desc_moment_of_purchase_02: "[laamp_artifact_peddler.GetFirstName] gật đầu khích lệ: \"Ta có đủ tiền. Ngài định bán món hàng nào?\""
  ep3_laamp_decision_event.1021.desc_success: "[laamp_artifact_peddler.GetFirstName] nhìn Ta với ánh mắt trầm ngâm: \"…Thật sao? Được thôi. Với những món hàng giá trị thế này, có lẽ Ta có thể rút thêm được một hai đồng.\""
  ep3_laamp_decision_event.1021.desc_failure: "[laamp_artifact_peddler.GetFirstName] cười khẩy, khóe miệng [laamp_artifact_peddler.GetHerHis] nhếch lên đầy khinh thường: \"Đừng có vô lý. Giá của Ta vẫn không đổi.\""
  ep3_laamp_decision_event.1021.a: "\"[1020_first_artifact_to_sell.GetNameNoTooltip] chưa bao giờ mang lại lợi ích gì cho ta.\""
  ep3_laamp_decision_event.1021.b: "\"Ta có việc tốt hơn để dùng vàng. Lấy [1020_second_artifact_to_sell.GetNameNoTooltip] đi.\""
  ep3_laamp_decision_event.1021.c: "\"Ngươi có thể lấy [1020_third_artifact_to_sell.GetNameNoTooltip] của ta.\""
  ep3_laamp_decision_event.1021.d: "Nghĩ lại thì..."
  ep3_laamp_decision_event.1021.eagle: "Có lẽ ngươi sẽ hứng thú với [ROOT.Char.Custom('EagleStoryName')]?"

#Town Crier
  ep3_laamp_decision_event.1025.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: vị [ROOT.Char.Custom('GetTowncrierElderCapitalized')|U]"
  ep3_laamp_decision_event.1025.desc_returned_01: "Khi chúng Ta quay lại chỗ người rao tin, con mèo — giờ đã cuộn mình — đang ngủ trên chiếc bàn gần đó, hoàn toàn phớt lờ những lời lảm nhảm của người rao tin. \n\nTa để ý thấy ria mép của nó đôi lúc khẽ động khi đang mơ, rồi bước lại gần để xem xét các thông báo được đọc to:"
  ep3_laamp_decision_event.1025.desc_returned_02: "Khi Ta quay lại chỗ người rao tin, con mèo duỗi mình dưới gầm bàn, theo dõi Ta bằng một con mắt xanh khép hờ.\n\nTa lắng nghe tiếng nó rù rì khe khẽ, rồi lập tức quay lại chú ý vào các danh sách được người rao tin công bố:"
  ep3_laamp_decision_event.1025.desc_reused_crier: "Người rao tin nhìn Ta với vẻ nhận ra và trở nên hào hứng khi Ta tiến lại gần, không ngừng thao thao về các khế ước được niêm yết bởi các quý tộc địa phương.\n\n[laamp_town_crier.GetSheHe|U] vẫn đi cùng con mèo già thân thiện, lông trắng pha xám nâu, nó nhìn Ta bằng đôi mắt xanh khép hờ khi Ta chăm chú lắng nghe các thông báo được kể lại:"
  ep3_laamp_decision_event.1025.desc_tribal_returned_01: "Khi chúng Ta quay lại gặp vị trưởng lão, con bò mộng — một con vật oai vệ — đang nhẹ nhàng liếm tay [laamp_town_crier.GetFirstNamePossessive] trong lúc [laamp_town_crier.GetSheHe] tiếp tục cho nó ăn vặt.\n\nVới nụ cười mãn nguyện, [laamp_town_crier.GetSheHe] sẵn lòng nhắc lại những công việc hiện có nhằm giúp đỡ dân chúng địa phương:"
  ep3_laamp_decision_event.1025.desc_tribal_returned_02: "Khi Ta quay lại gặp vị trưởng lão, một [ROOT.Char.GetWomanMan] trông đầy vẻ quan trọng vừa rời khỏi nơi này.\n\nTa liếc nhìn họ với vẻ tò mò, rồi quay sang trưởng lão [laamp_town_crier.GetFirstName] để tự nhắc mình về những nhiệm vụ hiện có:"
  ep3_laamp_decision_event.1025.desc_tribal_reused_crier: "Vị trưởng lão — người Ta nhận ra là [laamp_town_crier.GetFirstName] — mỉm cười trân trọng khi Ta quay lại chỗ đứng của [laamp_town_crier.GetHerHis].\n\nSau vài câu chuyện phiếm thân thiện, [laamp_town_crier.GetSheHe] thông báo cho Ta về những diễn biến hiện tại và các công việc cần được xử lý:"
  ep3_laamp_decision_event.1025.desc: "Người rao tin trở nên hào hứng khi Ta tiến lại gần, liên tục thao thao về các khế ước được niêm yết bởi các quý tộc địa phương.\n\n[laamp_town_crier.GetSheHe|U] đi cùng một con mèo già thân thiện, lông trắng pha xám nâu, nó nhìn Ta bằng đôi mắt xanh trong veo khi Ta chăm chú lắng nghe các thông báo được đọc lên:"
  ep3_laamp_decision_event.1025.desc_tribal: "Vị trưởng lão, [laamp_town_crier.GetFirstName], nhìn Ta với ánh mắt thân thiện khi Ta tiến đến.\n\nVừa cẩn thận trông coi chiếc xe bò, [laamp_town_crier.GetSheHe] vừa thông báo cho Ta về những vấn đề địa phương và các công việc cần được giải quyết ngay trong khu vực lân cận:"
  ep3_laamp_decision_event.1025.desc_legendary_returned_01: "Quay lại chỗ người rao tin, [laamp_town_crier.GetSheHe] đã tụ tập được một đám đông nhỏ, thích hợp để \"ồ\" và \"à\" khi [laamp_town_crier.GetSheHe] kể lại hoàn cảnh kinh hoàng khiến một vị quý tộc ở phương xa phải cầu cứu.\n\nTa nhướn mày khi hồi tưởng lại những khế ước thông thường đã được nhắc tới trước đó:"
  ep3_laamp_decision_event.1025.desc_legendary_returned_02: "Khi Ta quay lại chỗ người rao tin, [laamp_town_crier.GetSheHe] đang lôi cuốn thêm một nhóm người qua đường, buông ra những chi tiết ngày càng phóng đại về vị quý tộc ở phương xa.\n\nTa khe khẽ ngân nga khi suy ngẫm về những khế ước đã được nhắc tới trước đó:"
  ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_01: "Quay lại gặp vị trưởng lão, người dân bộ lạc [laamp_town_crier.GetWomanMan] ban nãy đang lớn tiếng buôn chuyện với những người khác, phơi bày mọi chi tiết bất lợi về vị quý tộc ở phương xa và hoàn cảnh của họ.\n\nVị trưởng lão, [laamp_town_crier.GetFirstName], ném cho [laamp_town_crier.GetHerHim] một ánh nhìn không hài lòng từ bên lề, khi Ta bước tới hỏi về những công việc địa phương cần giải quyết:"
  ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_02: "Khi Ta quay lại gặp vị trưởng lão, [laamp_town_crier.GetSheHe] dường như đã khiển trách người dân bộ lạc [laamp_town_crier.GetWomanMan] kia, kẻ hiện đang ngồi ủ rũ trên một chiếc xe gần đó.\n\nNgười dân bộ lạc [laamp_town_crier.GetWomanMan] trở nên phấn chấn khi [laamp_town_crier.GetSheHe] trò chuyện với một [laamp_town_crier.GetWomanMan] khác, trong lúc Ta bước tới gặp trưởng lão [laamp_town_crier.GetFirstName], người tốt bụng nhắc lại cho Ta về những công việc hiện có:"
  ep3_laamp_decision_event.1025.desc_legendary_reused_crier: "Ta nhận ra người rao tin, [laamp_town_crier.GetFirstName], người đang $ep3_laamp_decision_event.1025.desc_legendary_body$"
  ep3_laamp_decision_event.1025.desc_legendary: "Người rao tin, [laamp_town_crier.GetFirstName], đang $ep3_laamp_decision_event.1025.desc_legendary_body$"
  ep3_laamp_decision_event.1025.desc_legendary_body: "Ta đang tán gẫu với một [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] khác khi bước đến chỗ của [laamp_town_crier.GetHerHis] — họ thì thầm về việc một vị quý tộc phương xa nào đó đang gặp khó khăn và treo thưởng #EMP vô cùng hậu hĩnh#!.\n\nTa đang suy ngẫm điều này thì [laamp_town_crier.GetSheHe] chợt nhớ ra nhiệm vụ của mình và phấn chấn hẳn lên, vội vã thông báo cho những người xung quanh về các hợp đồng hiện có:"
  ep3_laamp_decision_event.1025.desc_tribal_legendary_reused_crier: "Khi Ta tiến lại gần, vị trưởng lão [laamp_town_crier.GetFirstName], hiện đang trò chuyện với một người dân bộ lạc [laamp_town_crier.GetWomanMan], liếc Ta với ánh mắt nhận ra. $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
  ep3_laamp_decision_event.1025.desc_tribal_legendary: "Một trong những trưởng lão của làng, [laamp_town_crier.GetFirstName], đang bận bàn bạc với một người dân bộ lạc [laamp_town_crier.GetWomanMan] khi Ta tiến lại gần. $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
  ep3_laamp_decision_event.1025.desc_tribal_legendary_body: "\n\nKẻ khác bắt đầu ra hiệu và ta loáng thoáng nghe được tin #EMP một vị quý tộc phương xa đang khẩn thiết cần sự trợ giúp trong một vấn đề trọng đại#!, hứa hẹn danh vọng và giàu sang để đáp lại.\n\nHọ kết thúc câu chuyện, và ta quay sang [laamp_town_crier.GetFirstNameNoTooltip], kẻ đang thông báo cho ta những công việc địa phương cần được giải quyết:"
  ep3_laamp_decision_event.1025.desc_nothing: "Vị [ROOT.Char.Custom('GetTowncrierElder')] ngồi rũ xuống trên ghế của [laamp_town_crier.GetHerHis], nửa tỉnh nửa mê. Có vẻ hiện tại không có khế ước nào khả dụng trong khu vực."

