 #The bespoke Treasure Map contract
  laamp_treasure_map_contract: "Bản đồ Kho báu"
  laamp_treasure_map_contract_contract: "$laamp_treasure_map_contract$"
  laamp_treasure_map_contract_desc_title: "Kho báu Cả Đời"
  laamp_treasure_map_contract_desc: "Thợ săn kho báu đã nghỉ hưu [TaskContract.GetEmployer.GetName] cần giúp đỡ để tìm ra kho báu khó nắm bắt cuối cùng. Hợp đồng này sẽ còn hiệu lực chừng nào Ngài còn giữ bản đồ kho báu."
  laamp_treasure_map_contract_request: "[task_contract|E] này yêu cầu Ngài phải [travel|E] đến vị trí kho báu thông qua [decision|E] [GetDecisionWithKey('treasure_map_contract_decision').GetName]"
  overflowing_provisions_to_gold.tt: "#EMP Vì điều này sẽ khiến Ngài vượt quá sức chứa [provisions|E], số @provisions_icon![provisions_overflow_value|V0] dư thừa sẽ được bán tại chợ địa phương để đổi lấy @gold_icon![provisions_transformed_to_gold_value|V0]#!"
  treasure_map: "Bản đồ Kho báu"
  treasure_map_desc: "Một tấm bản đồ nhàu nát, được cho là dẫn tới kho báu cổ xưa tại [newly_created_map.MakeScope.Var('artifact_treasure_location').GetProvince.GetBaronyNameExplicitlyNoTooltip]. Thu được từ người rao tin ở [newly_created_map.MakeScope.Var('picked_up_in_location').GetProvince.GetBaronyNameExplicitlyNoTooltip]."
  artifact_is_related_to_contract_tt: "[artifact|E] này có liên quan tới một [task_contract|E] và không thể bị phá hủy"
  gallowsbait_thief_blocked_from_contract.tt: "Ngươi đã lún quá sâu vào [GetTrait('gallowsbait').GetName( GetNullCharacter )] – nhánh [GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'thief' ).GetName] của [trait|E] này để còn được tin tưởng giao cho [vassal_contract|E] này"


 #Option: Visit the local tavern
  ep3_laamp_decision_event.1030.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: quán [ROOT.Char.Custom('GetTavernDwelling')|U]"
  ep3_laamp_decision_event.1030.desc_returned_01: "Ta bước lại vào quán, nhận ra rằng chẳng có mấy thứ thay đổi — những lữ khách và kẻ lang bạt vẫn đang thư giãn, được phục vụ đầy đủ nhu cầu."
  ep3_laamp_decision_event.1030.desc_nomad_returned_01: "Ta quay lại nơi trú chân, một lần nữa bị cuốn hút bởi sự hiếu khách và bầu không khí thân thiện, khẽ thở phào đầy thư thái."
  ep3_laamp_decision_event.1030.desc_returned_02: "Trở lại [ROOT.Char.Custom('GetTavernDwelling')], một cặp bảo kê người [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] vừa kịp can thiệp để dập tắt một cuộc cãi vã biến thành ẩu đả."
  ep3_laamp_decision_event.1030.desc_returned_from_story: "Những chi tiết trong câu chuyện của [laamp_storyteller.GetFirstNamePossessive] vẫn còn văng vẳng trong đầu, Ta quay lại phòng chung vốn ồn ào hơn hẳn."
  ep3_laamp_decision_event.1030.desc_nomad_returned_from_story: "Những chi tiết trong câu chuyện của [laamp_storyteller.GetFirstNamePossessive] vẫn còn văng vẳng trong đầu, Ta bước trở lại bên trong nơi trú chân."
  ep3_laamp_decision_event.1030.desc_returned_from_recruit: "Trên đường quay lại từ chỗ tuyển mộ, Ta thoáng ngửi thấy mùi thơm quyến rũ của [visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFoodPlural')] đang được chế biến trong bếp."
  ep3_laamp_decision_event.1030.desc_nomad_returned_from_recruit: "Trên đường quay lại từ chỗ tuyển mộ, Ta suýt vấp phải một cặp người đang ăn mừng, hiện bận trêu chọc một người đàn ông thứ ba, kín tiếng hơn, vì trông anh ta giống một [ROOT.Char.Custom('RegionalMythicalCreatureLower')]."
  ep3_laamp_decision_event.1030.desc_returned_from_unwinding_spouse: "Ta rời khỏi bầu Ngài dễ mến của [laamp_spouse_material.GetFirstNamePossessive], chỉnh lại y phục và quay lại từ một căn phòng phía sau với bước chân đầy hứng khởi."
  ep3_laamp_decision_event.1030.desc_nomad_returned_from_unwinding_spouse: "Ta rời khỏi chiếc lều dễ mến của [laamp_spouse_material.GetFirstNamePossessive], chỉnh lại y phục và lén quay lại nơi trú chân với bước chân đầy hứng khởi."
  ep3_laamp_decision_event.1030.desc_returned_from_spouse: "Khi Ta rời khỏi bầu  Bạn của[laamp_spouse_material.GetHerHis], [laamp_spouse_material.GetFirstName] lại tiếp tục trò chuyện với vài [ROOT.Char.Custom('GetTaverngoersTribespeople')] thân thiện, còn Ta tiến về giữa [ROOT.Char.Custom('GetRoomTent')]."
  ep3_laamp_decision_event.1030.desc_returned_from_hood_noble_fail: "Không thể giải quyết ổn thỏa tình hình, đám bảo kê địa phương ném [laamp_hooded_figure.GetFirstName] cùng cuộc ẩu đả của [laamp_hooded_figure.GetHerHis] ra khỏi [ROOT.Char.Custom('GetTavernDwelling')]. Ta cẩn thận quay lại trung tâm [ROOT.Char.Custom('GetRoomTent')]."
  ep3_laamp_decision_event.1030.desc_returned_from_hood_noble: "Không khí vẫn căng thẳng khi Ta bỏ lại [laamp_hooded_figure.GetFirstName] trong hoàn cảnh của [laamp_hooded_figure.GetHerHis] và quay về trung tâm [ROOT.Char.Custom('GetRoomTent')]."
  ep3_laamp_decision_event.1030.desc_returned_from_hood: "Ta lần đường quay lại từ hầm rượu, đôi mắt dần thích nghi lại với ánh sáng mạnh hơn của phòng chung."
  ep3_laamp_decision_event.1030.desc_nomad_returned_from_hood: "Ta lần đường quay lại từ chiếc lều khác, đôi mắt dần thích nghi lại với ánh sáng nhập nhoạng của nơi trú chân."

  ep3_laamp_decision_event.1030.desc: "Quán rượu — nơi tụ hội của cả lữ khách lẫn người dân [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] địa phương — đang tràn ngập sức sống."
  ep3_laamp_decision_event.1030.desc_nomad: "Ta được mời vào một trong những chiếc lều. Đáng ngạc nhiên là có rất nhiều người bên trong — lữ khách và [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip], tất cả hòa quyện thành một #EMP làn sóng#! âm thanh con người."
 #Mid
  ep3_laamp_decision_event.1030.desc_mid_storyteller_intro: "\n\nMột người kể chuyện ngồi bên đống lửa ở phía trong. Phía trước, một nhóm Bạn Bè tả tơi đang quấy rầy người phục vụ đòi thêm [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')], và ở một góc quầy"
  ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro: "\n\nBên ngoài, một người kể chuyện ngồi cạnh đống lửa trại. Phía trước, một nhóm ồn ào các tribes[visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen] đang ôn lại chuyến đi gần nhất của họ, và ở một góc quầy"

  ep3_laamp_decision_event.1030.desc_mid_reused_spouse: "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ Ta bắt gặp [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] [laamp_spouse_material.GetFirstName] đang ngồi đó, rõ ràng là chán chường."
  ep3_laamp_decision_event.1030.desc_mid_spouse: "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] đang ngồi, trông có vẻ chán."
  ep3_laamp_decision_event.1030.desc_nomad_mid_spouse: "$ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro$ [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] đang ngồi, trông có vẻ chán."

  ep3_laamp_decision_event.1030.desc_mid_return_reused_spouse: "\n\nGần quầy, [laamp_spouse_material.GetFirstName] vẫn ngồi đó, đầu ngón tay thon thả lướt dọc miệng cốc của [laamp_spouse_material.GetHerHis]."
  ep3_laamp_decision_event.1030.desc_mid_return_spouse: "\n\nGần quầy, [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] khi nãy vẫn đang ngồi, thong thả nhâm nhi cốc rượu của [laamp_spouse_material.GetHerHis]."

  ep3_laamp_decision_event.1030.desc_mid: "\n\nMột người kể chuyện ngồi bên đống lửa phía trong, còn phía trước một nhóm Bạn Bè tả tơi đang quấy rầy người phục vụ đòi thêm [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')]."
  ep3_laamp_decision_event.1030.desc_nomad_mid: "\n\nBên ngoài, một người kể chuyện ngồi cạnh đống lửa trại. Phía trước, một nhóm ồn ào các tribes[visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen] đang ôn lại chuyến đi gần nhất."
 #Outro
  ep3_laamp_decision_event.1030.desc_outro_hooded: "\n\nGần lối vào, Ta bắt gặp một bóng người trùm mũ kín đáo. Rõ ràng là kẻ rất coi trọng sự riêng tư."
  ep3_laamp_decision_event.1030.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] đảo mắt nhìn đám người hỗn tạp với ánh nhìn đầy tò mò trong mắt [visiting_partner.GetHerHis]."
  ep3_laamp_decision_event.1030.desc_outro: "\n\nTa bước vài bước vào [ROOT.Char.Custom('GetRoomTent')] sáng sủa và ấm áp, cân nhắc xem nên làm gì trước."
  ep3_laamp_decision_event.1030.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName], trông đã có phần mệt mỏi, liếc về phía một chiếc bàn gần đó: "Nếu chúng ta còn ở đây lâu nữa, ít nhất cũng ăn chút gì được không, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?""
  ep3_laamp_decision_event.1030.desc_outro_return_finished: "\n\nNhìn quanh [ROOT.Char.Custom('GetRoomTent')], nơi này có vẻ trống trải hơn nhiều, và Ta nhận ra mình chẳng còn việc gì để làm."
  ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro: "\n\nBên cạnh lối vào, bóng người trùm mũ kín đáo vẫn còn ngồi đó,"
  ep3_laamp_decision_event.1030.desc_outro_hooded_noble_return: "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ đang tu thêm một cốc nữa."
  ep3_laamp_decision_event.1030.desc_outro_hooded_return: "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ nghịch nghợm một con dao găm nhỏ."
  ep3_laamp_decision_event.1030.desc_outro_return_partner_01: "\n\nỞ một góc [ROOT.Char.Custom('GetTavernDwelling')], [visiting_partner.GetFirstName] chăm chú quan sát đám dân địa phương ném vật sắc vào một thùng gỗ vỡ với vẻ say mê rờn rợn.\n\nTa liếc nhìn trò chơi của họ trong lúc cân nhắc bước tiếp theo."
  ep3_laamp_decision_event.1030.desc_outro_return_partner_02: "\n\nBên phải Ta, [visiting_partner.GetFirstName] cười khoái chí khi một nông dân kết thúc câu chuyện cười thô tục liên quan đến đủ loại chất dịch cơ thể. Ta ném cho [visiting_partner.GetHerHim] một ánh nhìn ngạc nhiên, trong khi cân nhắc nên làm gì tiếp."
  ep3_laamp_decision_event.1030.desc_outro_return_partner_03: "\n\nPhía trước, [visiting_partner.GetFirstName] nhún nhảy theo điệu nhỏ khi người hát rong của [ROOT.Char.Custom('GetTavernDwelling')] kết thúc một khúc dân ca địa phương. Ta thong thả quan sát điệu nhảy, suy nghĩ xem tiếp theo nên làm gì."
  ep3_laamp_decision_event.1030.desc_outro_return_01: "\n\nKhông khí đang rất cao, và vài người trong [ROOT.Char.Custom('GetTavernDwelling')] đã bắt đầu hô vang một khúc nhạc [visiting_location.GetCounty.GetCulture.GetNameNoTooltip]. Giữa âm thanh ồn ào ấy, Ta cân nhắc bước đi kế tiếp."
  ep3_laamp_decision_event.1030.desc_outro_return_02: "\n\nỞ phía sau [ROOT.Char.Custom('GetRoomTent')], một quý tộc[ROOT.Char.GetWomanMan] đang mải mê tán tỉnh một nông dân [ROOT.Char.Custom('GetRandomWomanMan')]. Ánh mắt Ta dừng lại trên huy hiệu áo choàng của quý tộc[ROOT.Char.Custom('WomanManPossessive')] khi cân nhắc nên làm gì tiếp."
  ep3_laamp_decision_event.1030.desc_outro_return_03: "\n\nTại một chiếc bàn gần lối vào, một cặp dân địa phương đang chơi một trò cờ bàn kỳ lạ bằng những quân đá đen trắng thô sơ. Vừa nhàn nhã quan sát nước đi của họ, Ta vừa cẩn trọng cân nhắc các lựa chọn."
