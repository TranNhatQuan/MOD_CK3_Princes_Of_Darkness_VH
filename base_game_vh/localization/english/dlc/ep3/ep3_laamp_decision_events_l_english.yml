l_english:

 #Visit Local Settlement
  ep3_laamp_decision_event.return.tt: "Ngài quay lại [THIS.Char.Custom('GetMainsquareCommons')]"

 #Enter the Title of ProvinceName. What do you want to do?
  ep3_laamp_decision_event.1000.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [ROOT.Char.Custom('GetMainsquareCommonsCapitalized')|U]"
  ep3_laamp_decision_event.1000.desc_intro_returned_home: "Khi chiều buông xuống, cư dân của [visiting_location.GetBaronyNameExplicitlyNoTooltip] đã lần lượt vào nhà.\n\nCác tiểu thương đã dọn quầy, và những địa điểm đáng chú ý cũng đóng cổng."

  ep3_laamp_decision_event.1000.desc_intro_returned_from_second: "Ta nhanh chóng tìm đường quay lại từ đầu kia của [ROOT.Char.Custom('GetMainsquareCommons')], lướt qua một người bán hàng rong mang theo hàng chục lọ thủy tinh nhỏ chứa những chất lỏng đủ màu sắc."
  ep3_laamp_decision_event.1000.desc_intro_returned_from_tavern: "Ta bước ra khỏi [ROOT.Char.Custom('GetTavernDwelling')], nheo mắt trước ánh sáng và hít sâu bầu không khí trong lành bên ngoài. Mùi hương từ một quầy hàng [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] gần đó bán [visiting_location.GetTitle.GetHolder.Custom('GetLocalStreetFoodPlural')] khiến bụng Ta réo lên."
  ep3_laamp_decision_event.1000.desc_intro_returned_from_church: "Trên đường quay lại từ khuôn viên [visiting_location.GetCounty.GetFaith.HouseOfWorship], một nhóm [visiting_location.GetCounty.GetFaith.AltPriestTermPlural] tiến chậm rãi qua quảng trường, vừa đi vừa ngân nga đầy thanh thản."
  ep3_laamp_decision_event.1000.desc_intro_returned_from_castle: "Quay lại từ cổng lâu đài, Ta để ý một đội tuần tra gồm những binh lính [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] trông khá nhếch nhác đang quan sát chu vi, để mắt kỹ đến những kẻ có vẻ khả nghi hay khác thường."
  ep3_laamp_decision_event.1000.desc_intro_returned_from_craftsmen: "Sau chuyến thăm các thợ thủ công, một nhóm nhỏ các nghệ sĩ tung hứng đang biểu diễn tại quảng trường chính, thu hút một lượng khán giả vừa phải."

  ep3_laamp_decision_event.1000.desc_intro_returned_generic_01: "Băng qua [ROOT.Char.Custom('GetMainsquareCommons')] của [visiting_location.GetTitle.GetNameNoTierNoTooltip] là một đoàn thương nhân ngoại quốc đầy tò mò, đang trên đường đến [neighboring_county.GetTitle.GetNameNoTierNoTooltip]."
  ep3_laamp_decision_event.1000.desc_intro_returned_generic_02: "Trở lại [ROOT.Char.Custom('GetMainsquareCommons')], một con [ROOT.Char.Custom('RegionalFerociousAnimal')] đã được thuần hóa lạch bạch chạy tới chào mừng đầy phấn khích một người qua đường vô tội, gây nên một phen náo loạn."
  ep3_laamp_decision_event.1000.desc_intro_returned_generic_03: "Trở lại [ROOT.Char.Custom('GetMainsquareCommons')], chúng tôi được chào đón bởi người bán thịt địa phương đang đổ chất thải của [dummy_gender.GetHerHis] ra sau nhà, để cho lũ chó canh gác của [dummy_gender.GetHerHis] ăn."
  ep3_laamp_decision_event.1000.desc_intro_returned_generic_04: "Trên đường về [ROOT.Char.Custom('GetMainsquareCommons')], Ta dừng lại chiêm ngưỡng tác phẩm của một thợ dệt thảm địa phương, đang tạo nên một tác phẩm nghệ thuật theo đơn đặt hàng của [visiting_location.GetCounty.GetTitle.GetHolder.GetTitledFirstNameNoTooltip]."

  ep3_laamp_decision_event.1000.desc_intro_returned_constantinople_01: "Từ điểm quan sát, Ta phóng tầm mắt bao quát [visiting_location.GetTitle.GetNameNoTierNoTooltip], cố gắng lĩnh hội viên ngọc quý của [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nCác nền văn hóa từ khắp nơi đều hiện diện tại đây, giữa những người [visiting_location.GetCulture.GetNameNoTooltip], thực sự là một nồi nấu chảy của truyền thống và phong tục.\n\nPhía gần Trường đua Hippodrome, dường như một cuộc tranh tài đã bắt đầu, judging from những tiếng reo hò vui mừng và phấn khích vọng lại."

  ep3_laamp_decision_event.1000.desc_intro_constantinople: "Khi đi qua những vòm cuốn và hàng cột, chúng Ta bước vào đại đô thị [visiting_location.GetBaronyNameExplicitlyNoTooltip]. Không có gì lạ khi nơi này là viên ngọc trên vương miện của [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName], và Ta phóng tầm mắt về phía xa, hướng thẳng đến trái tim của thành phố."

  ep3_laamp_decision_event.1000.desc_intro_tribal_holding_01: "Người [visiting_location.GetCounty.GetCulture.GetNameNoTooltip|U] địa phương thường xuyên tụ họp tại [ROOT.Char.Custom('LocalHoldingType')|l] của [visiting_location.GetBaronyNameExplicitlyNoTooltip] để trao đổi, tán gẫu và kể chuyện.\n\nKhi Ta bước vào cụm [ROOT.Char.Custom('GetBuildingDwelling')]s, một con [ROOT.Char.Custom('RegionalFarmAnimal')] lạc đàn chậm rãi băng qua lối đi ở trung tâm [ROOT.Char.Custom('SettlementCity')|l], và một con [ROOT.Char.Custom('SmallAnimal')] nhỏ bé buồn ngủ lẩn qua tán lá cách Ta vài bước bên phải."
  ep3_laamp_decision_event.1000.desc_intro_tribal_holding_02: "Chúng Ta đi qua nhiều lớp người bộ lạc với dáng vẻ hiếu chiến hơn trên đường tiến vào trung tâm [visiting_location.GetTitle.GetNameNoTier].\n\nGiáo mác, dao găm và cung tên; nhưng cũng có [ROOT.Char.Custom('GetTribalTradegoods')], tín ngưỡng bản địa — tất cả tạo nên bản sắc của một [visiting_location.GetHolding.GetType.GetName|l]. Phần lớn Ta nhận được những cái gật đầu thân thiện; xen lẫn vài ánh nhìn nghi ngờ."
  ep3_laamp_decision_event.1000.desc_intro_church_holding: "Một đô thị tráng lệ, những lời tụng ca và thánh ca phủ lên [visiting_location.GetTitle.GetNameNoTier] [ROOT.Char.Custom('LocalHoldingType')|l] như một tấm chăn êm ái, không nghi ngờ gì về mối liên hệ tôn giáo của nơi này.\n\nBước qua cổng chính, Ta thấy vô số đồ trang trí [visiting_location.GetCounty.GetFaith.GetAdjectiveNoTooltip], gắn trong tường cũng như trên các trụ và giàn giáo."
  ep3_laamp_decision_event.1000.desc_intro_castle_holding: "Ít nơi nào hùng vĩ như một [visiting_location.GetHolding.GetType.GetName|l], và [visiting_location.GetTitle.GetNameNoTier] cũng không ngoại lệ. Binh lính và cờ hiệu của người [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] hiện diện khắp thành.\n\nKhi đi qua cổng chính, Ta bắt gặp vài lính gác đang thò đầu ra từ các lỗ châu mai phía trên."
  ep3_laamp_decision_event.1000.desc_intro_city_holding: "Là một đầu mối thương mại quan trọng đối với người [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip], của cải tạo ra từ các khu chợ của [visiting_location.GetTitle.GetNameNoTier] thấm vào mọi ngóc ngách của thành phố.\n\nKhi chúng Ta bước qua cổng thành, tiếng rao và hình ảnh quảng bá của các thương nhân địa phương xuất hiện khắp nơi."

 #Northern Europe
  ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_summer_returned_01: "\n\nMặt trời, gần như không bao giờ lặn vào thời điểm này trong năm, vẫn treo cao, và thứ duy nhất cạnh tranh với ánh sáng ấy là làn da nhợt nhạt của cư dân [ROOT.Char.Custom('SettlementCity')|l]."
  ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_summer_returned_02: "\n\nMột cơn mưa ôn hòa, bất chợt tràn qua [ROOT.Char.Custom('SettlementCity')|l] [ROOT.Char.Custom('GetSquareCommons')], lất phất rơi xuống cả người lẫn gia súc."
  ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_01: "\n\nTuyết, phản chiếu ánh mặt trời, phủ nặng lên mái nhà và [ROOT.Char.Custom('GetTreesScaffolding')|l]; ánh chói lòa của nó chỉ bị so bì bởi làn da hồng hào vì giá lạnh của cư dân [visiting_location.GetTitle.GetNameNoTierPossessiveNoTooltip]."
  ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_02: "\n\nDù nhiệt độ đóng băng, trời vẫn lặng gió. [ROOT.Char.Custom('SettlementCity')|l] mang một vẻ sắc lạnh kỳ quái, khi mọi sinh vật trong [ROOT.Char.Custom('GetSquareCommons')] đều thở ra những làn hơi trắng mờ."
  ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_03: "\n\nSắp sửa chìm vào bóng tối một lần nữa, người [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] vội vã di chuyển trong ánh sáng mờ nhạt ban ngày, cố gắng hoàn tất mọi việc sẽ không thể làm sau khi mặt trời lặn."
 #Britannia
  ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_01: "\n\nTrên cao, mây tạm thời tan ra, cho phép những tia nắng nhảy múa trên mái nhà và cư dân của [ROOT.Char.Custom('GetSquareCommons')]."
  ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_02: "\n\nKhông chịu dứt, cơn mưa ảm đạm tiếp tục trút xuống, chậm rãi tạo nên những vũng nước trên mặt đất gồ ghề. Một con [ROOT.Char.Custom('RegionalFarmAnimal')] đứng yên than thở thảm hại vì bị bỏ mặc dưới mưa phùn."
  ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_03: "\n\nLàn sương ẩm ướt siết chặt [ROOT.Char.Custom('GetSquareCommons')], và bất kỳ ai bước ra ngoài cũng lập tức bị làm ướt trang phục bởi cơn mưa luôn hiện hữu."
 #Europe
  ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_01: "\n\nMột cơn mưa phùn nhẹ bắt đầu rơi, làm nổi bật màu xanh cây cỏ và khơi dậy mùi đất dịu nhẹ; mang lại cảm giác yên bình trước cơn bão."
  ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_02: "\n\nMột luồng gió lạnh thổi tới từ hồ gần đó, khiến gia súc kêu lên ngạc nhiên và các chủ quầy kéo chặt áo choàng quanh vai."
  ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_03: "\n\nBên trái Ta, nông dân địa phương đang trở về sau buổi lễ tại một nhà thờ đá gần đó. Vị giáo sĩ đứng ở lối vào mỉm cười đầy ẩn ý khi Ta đi ngang qua."
 #Iberia
  ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_01: "\n\nPhía xa kia, ánh sáng từ một đài phun nước trang trí hắt lên những phản chiếu huyền ảo trên một vòm móng ngựa gần đó."
  ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_02: "\n\nBên trái Ta, một [dummy_gender.GetWomanMan] già đang nhẹ nhàng phục dựng một bức khảm địa phương bằng một nắm mảnh ghép — phần lớn — là mới, cho kết quả vượt trội."
  ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_03: "\n\nTrên cao, một biểu tượng tôn giáo nhìn xuống sự huyên náo của con phố đông đúc với ánh nhìn trầm tư."
 #Middle East
  ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_01: "\n\nTrời vẫn nóng, mọi người dịch chuyển vị trí và tìm đến bất kỳ bóng râm nào có thể. Một con kền kền ominous đang lượn vòng ở rìa [ROOT.Char.Custom('SettlementCity')|l]."
  ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_02: "\n\nKhi một con bọ cạp vụt qua, những luồng khí xoáy tạo nên các cơn lốc cát phát sáng gần như siêu thực dưới ánh nắng sa mạc."
  ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_03: "\n\nBên phải Ta là tàn tích của một thánh đường Hồi giáo cổ, vật liệu của nó đang được người [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] địa phương tái sử dụng."
 #India
  ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_01: "\n\nTrên cao, một bầy khỉ macaque đang quậy phá trong tán cây, dường như khó chịu vì điều gì đó."
  ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_02: "\n\nGiữa sự thích thú của đám đông, một đàn vẹt đuôi dài xinh đẹp, kêu inh ỏi không ngừng, chiếm lĩnh mái của một tòa nhà gần đó, nhắc nhở chúng Ta rằng thiên nhiên ở rất gần."
  ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_03: "\n\nPhía xa kia, vô số vải vóc rực rỡ đủ màu được phơi khô tạo nên một phông nền đầy duyên dáng cho [ROOT.Char.Custom('LocalHoldingType')|l]."
  ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_04: "\n\nTrên phố, trẻ con đang chơi đùa trong những vũng nước còn sót lại sau cơn mưa lớn sáng nay."
  ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_05: "\n\nBên trái Ta, một quản tượng đang huấn luyện một con voi mới, thu hút một nhóm nhỏ người hiếu kỳ đứng quan sát."
 #Steppe
  ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_01: "\n\nPhía xa kia, một đàn bò và ngựa yên bình đang lang thang trên đồng cỏ, thỏa mãn cơn đói trước mắt."
  ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_02: "\n\nXa hơn phía trước, một con ngựa non được dắt sát bên một con ngựa cái đứng yên, khi người bộ lạc chuẩn bị việc vắt sữa."
  ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_03: "\n\nBên trái Ta, một nhóm nhỏ người bộ lạc đang tu sửa một lều du mục bị hư hại, cẩn thận phủ phấn trắng lên tấm vải mới."
 #North Africa
  ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_01: "\n\nMột làn gió tinh nghịch lướt nhanh dọc theo những ngôi nhà pisé hình tròn, mang lại chút dễ chịu giữa cái nóng oi bức."
  ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_02: "\n\nMột cặp [dummy_gender.GetWomenMen] trông sảng khoái bước ra khỏi một nhà tắm hammam, và Ta nhìn đầy thèm muốn về phía lối vào, bỗng khao khát được ngâm mình thư giãn."
  ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_03: "\n\nMột con lừa kêu be be khó chịu, dường như bị mắc kẹt trong một trong những con hẻm hẹp lát sỏi ngăn cách các nhà phố."
 #West Africa
  ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_01: "\n\nMột nhóm thương nhân lang thang ở khu phía đông của [ROOT.Char.Custom('GetSquareCommons')], trong đó có một người nổi bật là giàu có nhất, đang đắm mình trong vỏ sò cowrie."
  ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_02: "\n\nÁnh mắt Ta bị thu hút bởi những màu sắc rực rỡ của nông sản địa phương bày trên những tấm chiếu dày — dưa, bầu, dưa leo, cam. Thật là một cảnh tượng vui mắt."
  ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_03: "\n\nÁnh mặt trời phản chiếu trên một quả cân đồng tinh xảo vừa được một người mua hài lòng cất đi, trả đủ phần của [dummy_gender.GetHerHis] bằng bụi vàng."
  ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_04: "\n\nMột nhóm thợ xây đang dựng thêm tầng hai trên một trong những ngôi nhà phố cầu kỳ, vừa làm vừa giữ sức dưới cái nóng."
 #East Africa
  ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_01: "\n\nMột con thằn lằn nhỏ trườn lên những khối san hô của một căn nhà hẹp, tìm đường lên mái bằng để sưởi nắng."
  ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_02: "\n\nNhững viên gạch nung của bức tường cao ngang gối hấp thụ cái nóng mặt trời, tỏa nhiệt lên bất cứ thứ gì — hay bất cứ ai — dám trèo lên."
  ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_03: "\n\nTa bắt gặp một vỏ sò nhỏ, vĩnh viễn mắc kẹt trong bức tường đá vôi của một ngôi nhà gần đó."
  ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_04: "\n\nỞ bên trái tôi, một thương nhân đang điều chỉnh mái che bằng lá cho sạp hàng của [dummy_gender.GetHerHis] để tạo bóng mát cho những hạt kola của [dummy_gender.GetHerHis]."
 #Generic
  ep3_laamp_decision_event.1000.desc_outro_returned_generic_01: "\n\nTiếng ồn ào và mặc cả lớn tiếng từ các quầy nhu yếu phẩm gần đó vọng tới tận đây, khiến [ROOT.Char.Custom('GetMainsquareCommons')] mang cảm giác hỗn loạn."
  ep3_laamp_decision_event.1000.desc_outro_returned_generic_02: "\n\nMột tên buôn nô lệ đáng sợ đang thực hiện thứ giao dịch mờ ám của [dummy_gender.GetHerHis] ở đoạn xa hơn của [ROOT.Char.Custom('GetSquareCommons')], khiến một số người chứng kiến bất bình."
  ep3_laamp_decision_event.1000.desc_outro_returned_generic_03: "\n\nThời tiết ấm áp, dù chưa phải cái nóng đỉnh điểm thường thấy của vùng này. Công nhân và quý tộc tiếp tục sinh hoạt thường ngày, tận hưởng nhiệt độ dễ chịu."
  ep3_laamp_decision_event.1000.desc_outro_returned_generic_04: "\n\nMột đàn [ROOT.Char.Custom('RegionalFarmAnimalPlural')] chặn đứng lối đi của một thương nhân lữ hành, gây nên không ít tiếng la hét và khổ sở."
  ep3_laamp_decision_event.1000.desc_outro_returned_generic_05: "\n\nBên trái Ta, một con [ROOT.Char.Custom('SoundingRegionalFarmAnimal')] phàn nàn trước cuộc kiểm tra kỹ lưỡng của một người mua tiềm năng. Người bán[dummy_gender.GetWomanMan]] nhẹ nhàng vuốt đầu nó để trấn an."
  ep3_laamp_decision_event.1000.desc_outro_returned_generic_06: "\n\nBên phải Ta, một bồn hoa nhỏ với những [ROOT.Char.Custom('get_region_flower_type_plural')] rực rỡ tạo nên một mảng màu dễ chịu cho [ROOT.Char.Custom('GetSquareCommons')]."
  ep3_laamp_decision_event.1000.desc_outro_returned_generic_07: "\n\nMột con [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] đậu trên ngọn cây [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] gần đó; cúi nhìn những người [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] đang tất bật phía dưới bằng ánh mắt thông minh."
 #Partner
  ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_01: "\n\n[visiting_partner.GetFirstName] khẽ huých Ta rồi chỉ lên một [visiting_location.Custom('GetRandomRegionalWood')] gần đó — trên cành cao nhất, một con [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] vạm vỡ đang đậu, phơi mình dưới ánh nắng chiều."
  ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_02: "\n\n[visiting_partner.GetFirstName] reo lên đầy thích thú và chỉ về phía một con [ROOT.Char.Custom('get_region_dog_type')] không bị xích, đang nhảy nhót chơi trò ném bắt cùng chủ của nó."
  ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_03: "\n\n[visiting_partner.GetFirstName] lém lỉnh ngọ nguậy khi [visiting_partner.GetSheHe] ném cho Ta một con giun vừa moi lên từ đất. Vừa giật mình vì con giun, Ta lùi lại một bước và liếc [visiting_partner.GetHerHim] bằng ánh nhìn nửa đùa nửa nghiêm."
  ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_04: "\n\n[visiting_partner.GetFirstName] khe khẽ ngân nga tán thưởng khi [visiting_partner.GetSheHe] tỉ mỉ xem xét một quầy đầy những bức chạm khắc [visiting_location.Custom('GetRandomRegionalWood')] mang tính tôn giáo."
  ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_05: "\n\n[visiting_partner.GetFirstName] khuất khỏi tầm mắt, nhưng chẳng bao lâu sau quay lại, mời Ta nếm thử món [ROOT.Char.Custom('GetLocalStreetFood')] vừa được [visiting_partner.GetHerHis] mua về."
 #Unique Location
  ep3_laamp_decision_event.1000.desc_outro_revisit_constantinople: "\n\nDù đã từng đến đây trước đó, Ta vẫn thấy mình thật nhỏ bé khi ngắm nhìn Hagia Sophia và Trường đua Hippodrome trên đường chân trời."
  ep3_laamp_decision_event.1000.desc_outro_constantinople: "\n\nHagia Sophia và Trường đua Hippodrome sừng sững nơi đường chân trời, khiến Ta không khỏi thấy mình thật nhỏ bé trước sự hùng vĩ của những công trình này."
 #Home
  ep3_laamp_decision_event.1000.desc_outro_home: "\n\nMột ngày dài lo toan cuối cùng cũng bắt kịp Ta, và Ta thấy mình chỉ khao khát được ngả lưng trên chiếc giường nhỏ."
  ep3_laamp_decision_event.1000.desc_outro_partner_home: "\n\n[visiting_partner.GetFirstName] vươn vai [visiting_partner.GetHerHis] và thở dài mãn nguyện: "Giờ tôi không phiền nếu có một bữa ăn nóng hổi tại trại đâu," [visiting_partner.GetSheHe] nói đầy khao khát."
 #First time
  ep3_laamp_decision_event.1000.desc_outro_partner_01: "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))] của Ta, [visiting_partner.GetFirstName], đưa mắt nhìn quanh với vẻ hài lòng, dường như rất thích thú trước sự thay đổi khung cảnh."
  ep3_laamp_decision_event.1000.desc_outro_revisit: "\n\nTa trân trọng cảm giác nhẹ nhõm khi nhận ra rằng không có nhiều thứ thay đổi kể từ lần cuối Ta ghé thăm nơi này."
  ep3_laamp_decision_event.1000.desc_outro_new: "\n\nThu vào tầm mắt và khứu giác những cảnh sắc và mùi vị nơi đây, Ta nhanh chóng định hướng được mình trong vùng đất mới."
 
