  laamp_decision_exotic_story_stewardship_gain_modifier: "Quản Trị Dị Vực"
  laamp_decision_exotic_story_stewardship_gain_modifier_desc: "Nhân vật này rút ra những bài học quản trị từ một câu chuyện dị vực."
  laamp_decision_exotic_story_intrigue_gain_modifier: "Mưu Lược Dị Vực"
