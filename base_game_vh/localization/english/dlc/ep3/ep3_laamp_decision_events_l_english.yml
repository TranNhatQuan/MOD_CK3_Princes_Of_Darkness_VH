 #Weaponsmith
  ep3_laamp_decision_event.1061.return.tt: "Ngươi quay lại khu thợ thủ công"
  ep3_laamp_decision_event.1061.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Thợ Rèn Vũ Khí"
  ep3_laamp_decision_event.1061.desc_returned_01: "Trở lại bãi tập, thợ rèn vũ khí [laamp_weaponsmith_craftsman.GetFirstName] vẫn đang đứng quanh sạp hàng của mình, nhẹ nhàng đánh bóng một món vũ khí bằng mảnh vải mềm.\n\nNgài ngân nga một mình khi làm việc, nhưng dừng lại ngay khi ta đến. \"Cuối cùng cũng tìm được thứ để đâm à?\" Ngài nói, không hề có chút thân thiện nào."
  ep3_laamp_decision_event.1061.desc_returned_02: "Khi ta trở lại chỗ thợ rèn, [laamp_weaponsmith_craftsman.GetFirstName] đã lấy ra một mẩu bánh từ túi đeo thắt lưng và đang thưởng thức từng miếng nhỏ.\n\nĐể ý thấy ta, ngài cẩn thận phủi vụn bánh khỏi áo choàng, đứng dậy và nhìn ta với ánh mắt khó đoán: \"Đổi ý rồi à?\""
  ep3_laamp_decision_event.1061.desc_intro: "Thợ rèn vũ khí [laamp_weaponsmith_craftsman.GetFirstName], đang nhàn nhã trò chuyện với vài gia nhân gần đó, đứng cạnh một quầy hàng tạm bợ gần bãi tập."
  ep3_laamp_decision_event.1061.desc_reused_weaponsmith: "$ep3_laamp_decision_event.1061.desc_intro$\n\n[laamp_weaponsmith_craftsman.GetSheHe|U] nhìn ta với ánh mắt nhận ra, nhướng mày và bước vài bước về phía ta: \"Ồ, không phải ngày nào cũng gặp khách quen quay lại đâu!\"\n\n\"Xin cứ xem qua hàng hóa của ta,\" [laamp_weaponsmith_craftsman.GetSheHe] nói, cố nở một nụ cười."
  ep3_laamp_decision_event.1061.desc: "$ep3_laamp_decision_event.1061.desc_intro$\n\nNgài nhìn ta, nhanh chóng kết thúc cuộc trò chuyện, rồi quay sang nói với ta khi ngài chỉ vào những vũ khí đang trưng bày: \"Đây là những tác phẩm ta đang bán.\"\n\n\"Được tôi luyện trong ngọn lửa nóng nhất đấy,\" ngài nói thêm, giọng đầy tự hào."
  ep3_laamp_decision_event.1061.a: "\"Phải nói là [1061_first_weapon.GetNameNoTooltip] trông rất đáng chọn.\""
  ep3_laamp_decision_event.1061.b: "\"Ta cũng không phiền nếu lấy [1061_second_weapon.GetNameNoTooltip].\""
  ep3_laamp_decision_event.1061.c: "\"[1061_third_weapon.GetNameNoTooltip] đúng là loại vũ khí #EMP hợp#! với ta.\""
  ep3_laamp_decision_event.1061.d: "$ep3_laamp_decision_event.1021.d$"

 #Armorer
  ep3_laamp_decision_event.1063.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Thợ Rèn Áo Giáp"
  ep3_laamp_decision_event.1063.desc_returned_01: "[laamp_armorer_craftsman.GetFirstName] đang nghỉ tay khỏi nhịp búa đơn điệu. [laamp_armorer_craftsman.GetSheHe|U] đi vòng quanh xưởng, dường như đang tìm thứ gì đó: \"Kìm,\" [laamp_armorer_craftsman.GetSheHe] càu nhàu, \"chẳng bao giờ nằm đúng chỗ cả.\"\n\nRồi [laamp_armorer_craftsman.GetFirstNameNoTooltip] quay [laamp_armorer_craftsman.GetHerHis] sự chú ý về phía Ta và hất cằm về những bộ giáp đang trưng bày: \"Sao nào?\""
  ep3_laamp_decision_event.1063.desc_returned_02: "Lò rèn hôm nay bớt nóng hơn khi [laamp_armorer_craftsman.GetFirstName] đang sửa một mảnh kim loại khác, nhẹ nhàng ép thép khuất phục dưới tay mình.\n\nCẩn thận không làm gián đoạn công việc của [laamp_armorer_craftsman.GetHerHis], Ta bước tới tiếp tục ngắm nghía những bộ giáp bày trên bàn làm việc.\n\n\"Cuối cùng cũng cần bảo hộ rồi, phải không?\" [laamp_armorer_craftsman.GetFirstNameNoTooltip] nhận xét với giọng đầy thích thú."
  ep3_laamp_decision_event.1063.desc_reused_armorer: "Xưởng rèn của [laamp_armorer_craftsman.GetFirstNamePossessive] vẫn như ta nhớ. Ánh mắt ta ngay lập tức rơi vào chiếc bàn làm việc cuối phòng, nơi ngài để những bộ giáp đang bán.\n\nĐôi mắt ngài lộ vẻ thích thú khi ngài ngước lên từ bộ giáp đang gia công và nhận ra ta: \"Một khách hàng quay lại! Ngài tìm được thứ gì mình thích chưa?\""
  ep3_laamp_decision_event.1063.desc: "Lò nung cháy rực trong xưởng rèn của [laamp_armorer_craftsman.GetFirstNamePossessive], và không khí rất đặc quánh.\n\nNgài liếc nhìn ta một cái, giáng nhát búa cuối cùng lên chiếc mũ giáp trơn láng, rồi đi lại gần và lau tay.\n\n\"Ngài có thể xem những món ta đang bán trên kệ đằng kia,\" ngài nói, ra hiệu về phía chiếc bàn làm việc chắc chắn ở cuối phòng."
  ep3_laamp_decision_event.1063.a: "[1063_first_armor.GetNameNoTooltip] trông thật sáng bóng."
  ep3_laamp_decision_event.1063.b: "Tay nghề của [1063_second_armor.GetNameNoTooltip] quả thực tinh xảo."
  ep3_laamp_decision_event.1063.c: "Chỉ có [1063_third_armor.GetNameNoTooltip] mới là lựa chọn hợp lý."
  ep3_laamp_decision_event.1063.d: "\"Quả là tài năng! Ngươi nên gia nhập cùng chúng ta.\""
  ep3_laamp_decision_event.1063.e: "$ep3_laamp_decision_event.1021.d$"
 #Jeweler
  ep3_laamp_decision_event.1065.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Thợ Kim Hoàn"
  ep3_laamp_decision_event.1065.desc_returned_01: "Tại nơi ở của thợ kim hoàn, [laamp_jeweler_craftsman.GetFirstName] đang cúi người trên một chiếc trâm cài đính đá quý hình bông hoa [visiting_location.Custom('get_region_flower_type')] tinh xảo. Lắng nghe kỹ, ta có thể nghe thấy những lời thì thầm đầy đam mê của ngài: \"Bông hoa quý giá của ta, quả nhiên...\"\n\nTa vội bước tới để làm một tấm ván sàn kêu cọt kẹt, và ngài nhận ra sự hiện diện của ta.\n\nGiật mình, ngài nhanh chóng lấy lại bình tĩnh và tuyên bố: \"Lại là ngài! Ôi trời — ngài đổi ý rồi à?\""
  ep3_laamp_decision_event.1065.desc_returned_02: "Khi Ta quay lại, [laamp_jeweler_craftsman.GetFirstName], tay cầm một [ROOT.Char.Custom('WritingInstrument')], đang kiểm kê các kệ trang sức, ghi chép vội vào một cuốn sổ rách.\n\nLiếc Ta một cái ngắn gọn, [laamp_jeweler_craftsman.GetSheHe] nói: \"Quay lại nữa à? Vậy ngươi muốn món nào?\" rồi tiếp tục kiểm tra những kệ còn lại."
  ep3_laamp_decision_event.1065.desc_reused_jeweler: "Thợ kim hoàn [laamp_jeweler_craftsman.GetFirstName] đang mải mê gắn chi tiết trang trí bằng gỗ [visiting_location.Custom('GetRandomRegionalWood')] lên một bức tượng nhỏ khi Ta bước vào căn phòng tối.\n\n[laamp_jeweler_craftsman.GetSheHe|U] ngẩng lên, quan sát Ta kỹ lưỡng rồi khe khẽ ngân nga thích thú: \"Khách quen quay lại. Thật là #EMP quý hóa!#!\"\n\nVẫn cầm bức tượng nhỏ, [laamp_jeweler_craftsman.GetFirstNameNoTooltip] chỉ về những món đồ trưng bày: \"Lần này ngài quan tâm đến thứ gì?\""
  ep3_laamp_decision_event.1065.desc: "Trong ánh sáng lờ mờ của căn nhà thợ kim hoàn, [laamp_jeweler_craftsman.GetFirstName] đứng khom người bên quầy cao, nhẹ nhàng đặt những chi tiết trang trí nhỏ xíu lên [1065_first_accessory.GetName].\n\nBị mê hoặc, Ta dõi theo đôi tay khéo léo của [laamp_jeweler_craftsman.GetHerHis] một lúc trước khi khẽ hắng giọng.\n\n[laamp_jeweler_craftsman.GetSheHe|U] nhận ra Ta, đứng thẳng người và trầm ngâm nói: \"Đang tìm trâm cài? Nhẫn? Hay một sợi dây chuyền?\" trong khi [laamp_jeweler_craftsman.GetSheHe] cầm lên một món trang sức nhỏ."
  ep3_laamp_decision_event.1065.a: "\"Ta cũng không phiền món [1065_first_accessory.GetNameNoTooltip] kia.\""
  ep3_laamp_decision_event.1065.b: "\"[1065_second_accessory.GetNameNoTooltip] — #EMP chính nó#! mới hợp với ta.\""
  ep3_laamp_decision_event.1065.c: "\"Ta muốn mua [1065_third_accessory.GetNameNoTooltip].\""
  ep3_laamp_decision_event.1065.d: "$ep3_laamp_decision_event.1021.d$"

 #Quartermaster
  ep3_laamp_decision_event.1067.t: "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Quản Kho"
  ep3_laamp_decision_event.1067.desc_returned_01: "[laamp_quartermaster_recruit.GetFirstName] vẫn đang ngồi trong góc tối của quán rượu, nhấm nháp cốc [laamp_quartermaster_recruit.Custom('RegionalDrink')] của mình như thể đó là tấm vé dẫn đến sự cứu rỗi.\n\nNgài hầu như không ngước nhìn khi ta cẩn thận bước tới gần. \"Lại ngài à?\" ngài lẩm bẩm, rồi quay đi chỗ khác."
  ep3_laamp_decision_event.1067.desc_returned_02: "[laamp_quartermaster_recruit.GetFirstName] đang trong một cuộc tranh cãi ồn ào với một khách hàng khác — một kẻ [ROOT.Char.GetWomanMan] cao, tối tăm, dường như muốn ngài #EMP \"ngừng rên rỉ đi thôi!\"#!\n\nTrước khi mọi thứ trở nên nóng nảy, ngài nhận ra ta và tách khỏi tình huống với một cái khịt mũi.\n\n\"Ngài quay lại rồi,\" ngài tuyên bố với vẻ mặt tỉnh táo đến kinh ngạc. \"Lúc nãy ngài muốn gì nhỉ?\""
  ep3_laamp_decision_event.1067.desc_returned_03: "[laamp_quartermaster_recruit.GetFirstName] nhìn chằm chằm vào hư không khi ta quay lại. Phải mất một lúc, ngài mới chớp mắt và chậm rãi lắc đầu.\n\nMột người phục vụ quán đặt một cốc [laamp_quartermaster_recruit.Custom('RegionalDrink')] khác trước mặt ngài, và ngài ngả người ra sau với tiếng thở dài nặng nề, lấy bàn tay che mắt lại.\n\nTa cẩn thận bước tới chỗ cựu quản lý, hắng giọng khi làm vậy:"
  ep3_laamp_decision_event.1067.desc_reused_quartermaster: "Khi Ta cố nhớ xem đã từng gặp [laamp_quartermaster_recruit.GetFirstName] ở đâu, Ta không gặp khó khăn gì khi theo [laamp_quartermaster_recruit.GetHerHim] vào một quán rượu u ám gần đó.\n\nBên trong, [laamp_quartermaster_recruit.GetSheHe] bước tới quầy gọi đồ uống, rồi quay lại nhìn Ta bằng ánh mắt sắc bén đáng ngạc nhiên: \"Đừng giả vờ như chúng ta chưa từng gặp nhau.\"\n\nChỉ trong một động tác, [laamp_quartermaster_recruit.GetSheHe] uống cạn cốc [laamp_quartermaster_recruit.Custom('RegionalDrink')] rồi nhướng một bên mày đẫm mồ hôi: \"Ngươi cần gì?\""
  ep3_laamp_decision_event.1067.desc: "Ta theo [laamp_quartermaster_recruit.GetFirstName] vào một quán rượu gần đó. Ánh sáng mờ ảo và mùi chất lỏng chua nồng nặc bao trùm các giác quan của ta.\n\nNgài ngồi xuống quầy và ra hiệu gọi đồ uống. \"Ta từng là một ai đó...\" ngài lặp lại với bản thân như một câu thần chú, trong khi cạy móng tay vào cốc.\n\nTa bước tới chỗ cựu quản lý bị thất sủng và hít một hơi thật sâu trước khi bắt chuyện:"
  ep3_laamp_decision_event.1067.a: "$ep3_laamp_decision_event.1047.a$"
  ep3_laamp_decision_event.1067.b: "\"Ta có một đội ngũ đông đảo cần ngươi tổ chức!\""
  not_enough_followers.tt: "Ngươi có ít hơn #V [EmptyScope.ScriptValue('many_followers_value')|0]#! [followers|E]"
  ep3_laamp_decision_event.1067.c: "\"Ta cá rằng ngươi không trụ nổi #EMP một ngày#! trong doanh trại của ta.\""
  ep3_laamp_decision_event.1067.c.success: "[laamp_quartermaster_recruit.GetShortUIName] chấp nhận thử thách của ngươi"
  ep3_laamp_decision_event.1067.c.failure: "Ngươi không thể dụ dỗ [laamp_quartermaster_recruit.GetShortUIName]"
  ep3_laamp_decision_event.1067.c.failure.tt: "[laamp_quartermaster_recruit.GetShortUIName] bắt đầu phớt lờ ngươi"
  ep3_laamp_decision_event.1067.d: "$ep3_laamp_decision_event.1021.d$"

