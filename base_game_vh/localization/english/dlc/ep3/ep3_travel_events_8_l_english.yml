l_english: 

  ep3_travel_events.8000.t: "Thuộc Về Một Nơi Nào Đó"
  ep3_travel_events.8000.desc.intro: "Kể từ cuộc gặp gỡ tình cờ ở [location.GetName], đứa con yêu dấu của ta — [ROOT.Char.Custom2('RelationToMeShort', romantic_child)] [romantic_child.GetName] — và [prospective_prince.GetName] đã quấn quýt không rời. Đứa [prospective_prince.Custom('GetDaughterSon')] của [prince_parent.GetTitleAsNamePossessiveNoTooltip|U] say đắm trong cơn si tình. Một cuộc tán tỉnh thật đẹp để chứng kiến, nhưng chúng ta phải tiếp tục lên đường, và họ sắp bị chia cách.\n\n\"Ôi, [ROOT.Char.GetMotherFather],\""
  ep3_travel_events.8000.desc.mid2.bold_child: "\"Con đã quá mệt mỏi với những chuyến đi rồi. Con muốn ở lại đây với [prospective_prince.GetNameNoTooltip]!\""
  ep3_travel_events.8000.desc.mid2.timid_child: "\"Con sợ rằng con sẽ không bao giờ gặp được một [prospective_prince.GetWomanMan] nào như [prospective_prince.GetHerHim] nữa. Người nghĩ một ngày nào đó chúng con có thể an cư và tự cắm rễ cho riêng mình không?\""
  ep3_travel_events.8000.outro.dislikes_child: "\n\nĐây có lẽ là cơ hội duy nhất để ta vứt bỏ con đỉa này cho tốt."
  ep3_travel_events.8000.outro: "\n\nTa thấy nỗi thống khổ hằn rõ trên gương mặt [romantic_child.GetHerHis], và không khỏi tự hỏi liệu vị trí của [romantic_child.GetHerHis] có còn thực sự là ở bên ta nữa hay không."
  ep3_travel_events.8000.a: "\"Chỗ của con là bên [prospective_prince.GetFirstNameNoTooltip], chứ không phải với một kẻ già nua ngốc nghếch như ta — một [ROOT.Char.Custom2('InsultNoun', ROOT.Char)].\""
  ep3_travel_events.8000.b: "\"[prospective_prince.GetFirstNameNoTooltip|U] cứ việc đi cùng chúng ta!\""
  ep3_travel_events.8000.c: "\"Đi thôi nào, [romantic_child.GetFirstNameNoTooltip].\""
  ep3_travel_events.8001.t: "Tự Cắm Rễ Cho Mình"
  ep3_travel_events.8001.desc: "[prospective_prince.Custom2('MyCharacterIntroduction', ROOT.Char )|U] trở về nhà sau chuyến tản bộ với một [romantic_child.GetWomanMan] trẻ tuổi kỳ lạ đang khoác tay [prospective_prince.GetHerHis]. Sinh vật này rõ ràng là lôi thôi và mệt mỏi vì đường dài, bụi bẩn bám trên quần áo khiêm tốn của [romantic_child.GetHerHis].\n\n\"[ROOT.Char.GetMotherFather|U]! Đây là [romantic_child.GetFirstName], [romantic_child.Custom('GetDaughterSon')] của [laamp.GetName], nhà thám hiểm nổi tiếng. [romantic_child.GetSheHe|U] cũng là [romantic_child.GetWomanMan] mà con đã đem lòng yêu, và nếu ngài ban phước, chúng con sẽ kết hôn!\""
  ep3_travel_events.8001.a: "\"Con có phước lành của ta.\""
  ep3_travel_events.8001.b: "\"Tuyệt đối không!\""
  ep3_travel_events.8002.t: "Ở Một Thời Khác"
  ep3_travel_events.8002.desc: "Ngay khi những vật tư cuối cùng được đóng gói và chúng ta chuẩn bị lại bước lên con đường vô tận, ta bị chặn lại bởi tiếng khóc tuyệt vọng của đứa [romantic_child.Custom('GetDaughterSon')] của mình. Khi [romantic_child.GetSheHe] cuối cùng cũng đến được bên ta, ta bị ôm chặt trong một cái ôm nghẹn ngào. Có vẻ như [prince_parent.GetName] đã không ban phước cho mối lương duyên này, và [romantic_child.GetName] quay về để tiếp tục đồng hành cùng ta trên những chuyến du hành."
  ep3_travel_events.8002.a: "\"Ngoan nào, ngoan nào.\""
  ep3_travel_events.8010.t: "Chẳng Ai Nhớ Tới"
  ep3_travel_events.8010.desc: "Khi chúng ta tiếp tục đi qua [location.GetName], ánh mắt ta bắt gặp một ngôi mộ được trang trí cầu kỳ giữa một dãy mồ mả tầm thường. Ngôi mộ dường như đã bị nứt mở, và ngay trong miệng mộ ta thấy ánh lấp lánh của một kho báu vô danh.\n\nNgoài đoàn của ta ra thì chẳng có ai xung quanh, và hẳn người từng sở hữu những thứ trong mộ này cũng sẽ không phán xét ta vì lấy đi những gì nếu không thì cũng bị bỏ phí?"
  ep3_travel_events.8010.a: "Chắc chẳng ai để ý đâu."
  ep3_travel_events.8010.a.win: "Ngài lặng lẽ chôm được một ít đồ tùy táng"
  ep3_travel_events.8010.a.lose: "Đoàn của Ngài bị bắt quả tang"
  ep3_travel_events.8010.b: "Ta sẽ không báng bổ người chết!"
  soulmate_laamp_adventure: "[CHARACTER.GetShortUIName|U] đã có một cuộc gặp gỡ định mệnh với [TARGET_CHARACTER.GetShortUIName] trong một chuyến phiêu lưu và đã yêu say đắm."
  soulmate_laamp_adventure_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã có một cuộc gặp gỡ định mệnh với [CHARACTER.GetShortUIName] trong một chuyến phiêu lưu và đã yêu say đắm."
  friend_let_me_go: "[TARGET_CHARACTER.GetShortUIName|U] đã cho phép [CHARACTER.GetShortUIName] ra đi để tìm kiếm tình yêu."
  friend_let_me_go_corresponding: "[CHARACTER.GetShortUIName|U] đã cho phép [TARGET_CHARACTER.GetShortUIName] ra đi để tìm kiếm tình yêu."
  rival_laamp_stole_my_child: "[TARGET_CHARACTER.GetShortUIName|U] đã thuyết phục con của [CHARACTER.GetShortUINamePossessive] rời triều đình và trở thành một nhà thám hiểm."
  rival_laamp_stole_my_child_corresponding: "[CHARACTER.GetShortUIName|U] đã thuyết phục con của [TARGET_CHARACTER.GetShortUINamePossessive] rời triều đình và trở thành một nhà thám hiểm."
