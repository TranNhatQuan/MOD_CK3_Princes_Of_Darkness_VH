  double_moon_tome_desc_2: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Khúc Ca Tặng Vệ Sĩ'"
  double_moon_tome_desc_3: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Những Bài Học Về Tiêu Xài'"
  double_moon_tome_desc_4: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Lời Nói Dịu Êm'"
  double_moon_tome_desc_5: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Trái Tim Được Vá Lành'"
  double_moon_tome_desc_6: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Thư Gửi Một Cận Thần'"
  double_moon_tome_desc_7: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Những Dịp Trọng Đại'"
  double_moon_tome_desc_8: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Từ Gia Tộc, Từ Con Tim'"
  double_moon_tome_desc_9: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Điều Chia Cách Chúng Ta'"
  double_moon_tome_desc_10: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Sức Nặng Của Lời Nói'"
  double_moon_tome_desc_11: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Tiền Lên Tiếng, Người Ta Lắng Nghe'"
  double_moon_tome_desc_12: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Vần Thơ Về Vẻ Đẹp'"
  double_moon_tome_desc_13: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Các Lãnh Chúa và Phu Nhân'"
  double_moon_tome_desc_14: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Những Đứa Con của Allah'"

  ep3_story_cycle_violet_poet.0001.t: "Xứng Tầm Những Cương Vị Cao"
  ep3_story_cycle_violet_poet.0001.desc: "Suốt nhiều thập kỷ, ta đã bước theo dấu chân của giới trí thức và đối mặt với cơn thịnh nộ của thế gian. Thơ ca của ta ngày một vang danh, vậy mà...\n\nVẫn còn điều gì đó thiếu vắng. Khi những năm tháng hoàng hôn đã cận kề, có lẽ đã đến lúc ta rời khỏi [cordoba.GetName] để mở rộng tầm mắt trước thế giới bao la?\n\nThế nhưng, một phần không thể tách rời trong ta vẫn níu giữ con tim ở lại. Ta đã gây dựng một cuộc đời nơi đây, không chỉ cho bản thân, mà còn cho biết bao học trò đã được rèn giũa qua năm tháng.\n\nDù là nhờ những học giả bước đi trên đường phố, hay lớp patina quen thuộc phủ lên những bức tường cổ kính, #EMP một điều gì đó#! vẫn trói buộc ta với thành phố này — mái nhà của ta."
  ep3_story_cycle_violet_poet.0001.a: "Ta sẽ ở lại [cordoba.GetNameNoTooltip] thêm một thời gian."
  ep3_story_cycle_violet_poet.0001.a.tt: "Đây là nhà của ta. Có lẽ ở một kiếp khác, ta sẽ bước trên con đường khác."
  ep3_story_cycle_violet_poet.0001.b: "Đã đến lúc ra đi."
  ep3_story_cycle_violet_poet.0001.b.tt: "Hãy nghĩ đến những cơ hội còn đang chờ nở rộ!"
  ep3_story_cycle_violet_poet.0001.b.travel: "Bắt đầu chuyến hành trình đến [toledo.GetName]"
  artifact_double_moon_book: "Thư Tịch Trăng Đôi"
  artifact_double_moon_book_description: "Một cuốn sách dày dặn, được trang trí lộng lẫy, chứa đầy những vần thơ."
  artifact_double_moon_book_description_append: "$artifact_double_moon_book_description$ Các trang sách bao gồm:\n"

  ep3_story_cycle_violet_poet.0002.t: "Xây Dựng Di Sản"
  ep3_story_cycle_violet_poet.0002.desc: "Có một điều đã day dứt trong tâm trí ta suốt nhiều tuần qua. Ai sẽ là người tiếp nối di sản của ta? Ai sẽ tiếp tục bảo trợ nghệ thuật và dẫn dắt lớp trẻ theo con đường ấy?\n\nTa có nhiều thứ để truyền lại: [double_moon_book.GetName] dĩ nhiên là điều hiển nhiên, nhưng còn vô số điều khác nữa. Di sản cuối cùng của triều đại [ROOT.Char.GetHouse.GetName] còn nặng nề hơn cả cuốn thư tịch đồ sộ ấy.\n\nNhưng suy cho cùng, đó cũng chỉ là một di vật phai tàn. Điều quan trọng nhất chính là cách sống — sinh lực của bất kỳ thi nhân nào như ta. Thơ ca, tình yêu, sự trân trọng thế giới mà [ROOT.Char.GetFaith.HighGodName] đã tạo dựng quanh ta!\n\n#EMP Điều đó#! ta nhất định phải tìm ra. Một người thấu hiểu dòng chảy vô hình ấy của thế giới."
  ep3_story_cycle_violet_poet.0002.a: "Đáng tiếc thay, những người như vậy thật hiếm hoi."
  ep3_story_cycle_violet_poet.0002.a.tt: "Ngài trầm ngâm suy ngẫm..."
  ep3_story_cycle_violet_poet.0002.b: "Chưa cần phải lo lắng chuyện này vội."
  ep3_story_cycle_violet_poet.0002.b.flavor: "...dẫu vậy, ta nên bắt tay vào việc ấy #EMP sớm thôi#!."
  ep3_story_cycle_violet_poet.0002.b.tt: "@alert_icon! #alert_trial Nếu Ngài qua đời trước khi chỉ định người kế thừa, triều đại của Ngài có thể chấm dứt!#!"

  ep3_story_cycle_violet_poet.0003.t: "Khó Lòng Lựa Chọn"
  ep3_story_cycle_violet_poet.0003.opening: "Ta lắng nghe bằng một bên tai cuộc tranh luận thơ ca gay gắt vọng vào từ bên ngoài. Ta nên chọn ai đây?\n\n"
  ep3_story_cycle_violet_poet.0003.poet: "Ví dụ như [heir1.GetFirstName]. Khả năng nắm bắt nhịp điệu của [heir1.GetHerHis|U] thật bản năng và ấn tượng..."
  ep3_story_cycle_violet_poet.0003.diplomat: "Ví dụ như [heir1.GetFirstName]. Tình yêu của [heir1.GetHerHis|U] dành cho thơ ca thật rõ ràng và nồng cháy."
  ep3_story_cycle_violet_poet.0003.woman: "Hay là [heir2.GetFirstName]? Với tư cách là một [heir2.GetWomanMan], ít nhất [heir2.GetSheHe] sẽ thấu hiểu lời ta sâu sắc khi ta không còn."
  ep3_story_cycle_violet_poet.0003.young: "Hoặc có lẽ là [heir2.GetFirstName]? Một tâm hồn trẻ mang nhiều tiềm năng để uốn nắn."
  ep3_story_cycle_violet_poet.0003.heir3: "\n\nMột tràng ngôn từ vang lên, sắc sảo và dồn dập. Ta chú ý đến [heir3.GetFirstName], một gương mặt mới trong buổi tao đàn, vừa kết thúc một khổ thơ thanh nhã. [heir3.GetSheHe|U] còn trẻ,"
  ep3_story_cycle_violet_poet.0003.intelligent: "trí tuệ sắc bén và "
  ep3_story_cycle_violet_poet.0003.beautiful: "vẻ đẹp nổi bật và"
  ep3_story_cycle_violet_poet.0003.ending: "vô cùng tài hoa trong văn xuôi!\n\nNhìn vào đoàn người ngưỡng mộ mà [heir3.GetSheHe] thu hút quanh mình, có lẽ [heir3.GetHerselfHimself] cũng là một cá nhân khá #EMP tím#!..."
  ep3_story_cycle_violet_poet.0003.a: "[heir1.GetFirstNameNoTooltip] phải là lựa chọn của ta."
  ep3_story_cycle_violet_poet.0003.b: "[heir2.GetFirstNameNoTooltip] sẽ là người kế thừa của ta."
  ep3_story_cycle_violet_poet.0003.c: "Ngươi biết đấy, [heir3.GetFirstNameNoTooltip] có điều gì đó thật đặc biệt..."

  ep3_story_cycle_violet_poet.0004.t: "Được Tưởng Nhớ Trìu Mến"
  ep3_story_cycle_violet_poet.0004.desc: "Ôi [wallada.GetFirstName]! Người thầy, người bạn, nguồn cảm hứng của ta. Ngài đã sống một trăm cuộc đời trong cuộc đời của chính mình, và dù vậy, ta vẫn cảm thấy như chưa đủ.\n\nTa mở gói quà mà [wallada.GetSheHe] để lại cho ta, món quà cuối cùng trong chuỗi những món quà ngài đã trao. Lớp giấy gói rơi ra, để lộ [double_moon_book.GetName], cuốn tập thơ mà [wallada.GetHerHis] đã dày công vun đắp.\n\n[wallada.GetFirstNameNoTooltip|U] đã từng nói nhiều về việc kế thừa di sản, và giờ ta đã hiểu rằng di sản đó thuộc về ta để tiếp nối. Ta phải sống một cuộc đời trọn vẹn nhất, giống như cách ngài đã làm, và tận hưởng mọi niềm vui mà cuộc đời ban tặng. Ta cũng phải ghi chép lại những điều đó, bằng thơ, ngay trên chính những trang giấy này."
  ep3_story_cycle_violet_poet.0004.a: "Ta sẽ cố gắng hết sức mình."

  ep3_story_cycle_violet_poet.0010.title: "Bài Thơ Muwashshah Được Bán"
  ep3_story_cycle_violet_poet.0011.title: "Bài Thơ Muwashshah Được Giữ Lại"
  ep3_story_cycle_violet_poet.0011.message: "[double_moon_book.GetName] nhận một Modifier ngẫu nhiên"
  ep3_story_cycle_violet_poet.0012.title: "Bài Thơ Muwashshah Được Phân Phát"

 #Story cycle events

  ep3_story_cycle_violet_poet.1000.t: "Ân Huệ của Thiên Nhiên"
  ep3_story_cycle_violet_poet.1000.desc: "Có vẻ như việc dành thời gian hòa mình vào thiên nhiên quả là một lựa chọn đúng đắn. Cảnh sắc, âm thanh và mùi hương của không khí trong lành đều mang lại những điều kỳ diệu cho thể trạng của ta.\n\nTrong lúc tản bộ rời xa trại, ta tình cờ bắt gặp một mạch suối tuyệt đẹp giữa rừng sâu. Tiếng róc rách êm đềm của dòng nước và tán lá xào xạc vỗ về tâm trí ta, đến mức khi nhận ra thì đã trôi qua hàng giờ đồng hồ.\n\nBụng ta bắt đầu réo gọi, cơn đói dâng lên rõ rệt. Trên lối mòn phía sau có vài loài cây ăn được… nhưng có điều gì đó rất thi vị trong việc cô độc và đói khát..."
  ep3_story_cycle_violet_poet.1000.a: "Nghịch cảnh chính là nguồn cảm hứng tuyệt vời!"
  ep3_story_cycle_violet_poet.1000.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Một Cuộc Dạo Bước Giữa Rừng Cây'"
  ep3_story_cycle_violet_poet.1000.b: "Ta nên kiếm thức ăn thì hơn."

  ep3_story_cycle_violet_poet.1005.t: "Một Học Trò Xuất Chúng"
  ep3_story_cycle_violet_poet.1005.desc: "Dạo bước trên những con phố của [location.GetName], ta dừng chân trước cánh cửa của một cô nhi viện trong thành. Tai ta bỗng dựng lên vì tò mò khi nghe thấy những vần điệu quen thuộc được ngâm vang từ bên trong.\n\nChậm rãi, ta nép mình dựa vào tường lắng nghe. Một trong những đứa trẻ mồ côi đang giao chiến bằng ngôn từ với đứa khác, với sự tận tâm và kỹ năng đáng kinh ngạc so với tuổi đời non trẻ.\n\nĐứa trẻ ấy điều khiển lời nói như một lưỡi dao được mài sắc, chém tan những lời lắp bắp ngây ngô của đối thủ.\n\nTa thốt lên: Bravo, thật xuất sắc!"
  ep3_story_cycle_violet_poet.1005.a: "\"Này cô bé! Con có muốn một nơi để học hỏi không?\""
  ep3_story_cycle_violet_poet.1005.a.tt: "Ta #EMP nhất định#! phải dìu dắt tài năng này."
  ep3_story_cycle_violet_poet.1005.b: "Đây quả là một câu chuyện đáng kể!"
  ep3_story_cycle_violet_poet.1005.b.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Nhà Thơ Mồ Côi'"
  ep3_story_cycle_violet_poet.1005.c: "Có lẽ trại của ta không phù hợp cho trẻ nhỏ."
  ep3_story_cycle_violet_poet.1005.c.tt: "Nhưng tài năng của chúng quá sớm nở, ta ít nhất cũng phải tài trợ!"

  ep3_story_cycle_violet_poet.1010.t: "Khúc Tình Ca của Thơ"
  ep3_story_cycle_violet_poet.1010.desc: "Được chào đón vào triều đình của [ruler.GetTitledFirstNamePossessiveRegnal] là một vinh dự lớn lao. Được biểu diễn những bài thơ cũ của ta cho ngài ấy nghe, còn là một vinh dự lớn hơn nữa.\n\nTuy nhiên, thật khó để tập trung vào việc đọc những dòng thơ khi một vẻ đẹp rạng ngời như vậy đứng trước mặt ta. [ruler_spouse.GetFirstName], [ruler_spouse.GetWifeHusband] của [ruler.GetFirstNamePossessiveNoTooltip] đã lọt vào mắt ta; một sự thanh tao vượt bậc, một vẻ duyên dáng tuyệt vời! Ta đã đắm say người [ruler_spouse.GetWomanMan] này mất rồi.\n\nNiềm đam mê của ta trào dâng mãnh liệt. Ta muốn yêu! Ta muốn viết!"
  ep3_story_cycle_violet_poet.1010.a: "Có lẽ ta có thể dành cho [ruler_spouse.GetHerHim] một \"buổi học thơ riêng tư\"..."
  ep3_story_cycle_violet_poet.1010.a.success: "[ruler_spouse.GetSheHe|U] vô cùng thích thú với \"lối ngâm nhịp điệu\" của Ngài"
  ep3_story_cycle_violet_poet.1010.a.failure: "[ruler_spouse.GetSheHe|U] lịch sự từ chối"
  ep3_story_cycle_violet_poet.1010.b: "Vì sao số mệnh cứ trêu ngươi ta như vậy?"
  ep3_story_cycle_violet_poet.1010.b.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Trái Cấm'"
  ep3_story_cycle_violet_poet.1010.c: "Ta phải có được [ruler_spouse.GetHerHim]!"
  ep3_story_cycle_violet_poet.1010.c.tt: "Tăng [success_chance|E] cho [scheme|E] [GetScheme('courting').GetTypeName] của Ngài"

  ep3_story_cycle_violet_poet.1015.t: "Một Kẻ Theo Đuổi Say Mê"
  ep3_story_cycle_violet_poet.1015.desc: "Tiếng bước chân loạng choạng báo hiệu sự xuất hiện của một kẻ lạ mặt trong trại, mệt mỏi và kiệt sức. Khi [stranger.GetSheHe] nhấp ngụm nước chúng ta đưa và ngồi xuống bên đống lửa, [stranger.GetSheHe] ngước nhìn ta với nụ cười rạng rỡ.\n\n\"Ngài là [ROOT.Char.GetFirstNameNoTooltip], đúng không? Ta đã tìm kiếm ngài suốt nhiều ngày. Thơ của ngài đã thay đổi cuộc đời Ta theo những cách không lời nào diễn tả nổi! Những lời mà Ta nghĩ ngài hẳn sẽ #EMP chẳng#! gặp chút khó khăn nào khi viết ra!\"\n\nNghĩ rằng người này đã lần theo dấu ta nhiều ngày chỉ để nói lời khen? Có điều gì đó thật lãng mạn trong sự tận tâm ấy."
  ep3_story_cycle_violet_poet.1015.a: "\"Ta nên cảm ơn ngươi #EMP cho ra lẽ#!.\""
  ep3_story_cycle_violet_poet.1015.a.success: "[stranger.GetSheHe|U] hào hứng đồng ý"
  ep3_story_cycle_violet_poet.1015.a.failure: "[stranger.GetSheHe|U] bỏ đi trong phẫn nộ"
  ep3_story_cycle_violet_poet.1015.b: "Chúng ta cũng cần một lữ khách từng trải như vậy."
  ep3_story_cycle_violet_poet.1015.c: "Những lời thật đẹp!"

  ep3_story_cycle_violet_poet.1020.t: "Làn Sương Che Phủ Tất Cả"
  ep3_story_cycle_violet_poet.1020.desc: "Ta bị nguyền rủa rồi! Dẫu đã cố gắng hết sức, những ngày qua tâm trí ta chỉ bị bao phủ bởi một làn sương mù bất tận.\n\nKhông một lời nào chảy ra trang giấy, không tình ý lãng mạn, không câu chữ sắc bén. Dường như mạch cảm hứng của ta cuối cùng cũng đã cạn.\n\nTa nên làm gì đây? Làm sao để giải thoát bản thân khỏi cực hình trí tuệ này!"
  ep3_story_cycle_violet_poet.1020.a: "Ta cần ai đó khơi gợi ý tưởng."
  ep3_story_cycle_violet_poet.1020.a.tt: "Ngài không có [followers|E] nào với hơn #high 20#! [diplomacy|E]"
  ep3_story_cycle_violet_poet.1020.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Những Bàn Tay Trợ Giúp'"
  ep3_story_cycle_violet_poet.1020.b: "Ta sẽ cố vượt qua!"
  ep3_story_cycle_violet_poet.1020.b.success: "Nó hiệu quả"
  ep3_story_cycle_violet_poet.1020.b.failure: "Không có tác dụng"
  ep3_story_cycle_violet_poet.1020.c: "Có lẽ đã đến lúc nghỉ ngơi?"
  ep3_story_cycle_violet_poet.1020.c.success: "Ngài tìm được chốn an yên"
  ep3_story_cycle_violet_poet.1020.c.failure: "Tâm trí Ngài vẫn mù mịt"

  ep3_story_cycle_violet_poet.1025.t: "Thế Hệ Kế Tiếp"
  ep3_story_cycle_violet_poet.1025.desc: "Ta dành phần lớn thời gian ở salon của mình, nhưng cũng không ít lần lang thang trên những con phố của [location.GetName]. Và điều đó thường xuyên đưa ta đến các cô nhi viện — nơi cưu mang những đứa trẻ bất hạnh vì chiến tranh, đói kém hay đơn thuần là bị bỏ rơi.\n\nHôm nay, nhiều gương mặt mới xuất hiện trên sân chơi. Trái tim ta, như mọi khi, lại quặn thắt vì những số phận khốn khó ấy. Thật quá nhiều...\n\nMột giọng nói nhỏ, nghẹn ngào phá vỡ bầu không khí. Một [orphan.Custom('GirlBoy')] bé nhỏ ngồi trong góc, mấp máy đọc một bài thơ từ mảnh giấy nhàu nát. Quá trẻ, rõ ràng chưa được dạy dỗ — nhưng nơi những đứa trẻ này ẩn chứa tiềm năng thực sự..."
  ep3_story_cycle_violet_poet.1025.a: "Ta không thể để tiềm năng ấy bị lãng phí."
  ep3_story_cycle_violet_poet.1025.a.tt: "Ta phải nhận nuôi tất cả!"
  1025_every_orphan: "Mọi Trẻ Mồ Côi"
  ep3_story_cycle_violet_poet.1025.b: "Ta chỉ đủ sức lo cho một đứa..."
  ep3_story_cycle_violet_poet.1025.b.tt: "Vậy thì phải chọn cho đáng."
  ep3_story_cycle_violet_poet.1025.b.success: "Sự chăm sóc của Ngài đơm hoa kết trái"
  ep3_story_cycle_violet_poet.1025.c: "Lãnh chúa địa phương phải có trách nhiệm với chúng."
  ep3_story_cycle_violet_poet.1025.c.tt: "Có lẽ bêu xấu [holder.GetHerHim] sẽ hiệu quả..."
  ep3_story_cycle_violet_poet.1025.c.success: "[holder.GetTitledFirstNameNoTooltip] chấp nhận gánh nặng"
  ep3_story_cycle_violet_poet.1025.c.failure: "[holder.GetTitledFirstNameNoTooltip] từ chối chi trả"

  ep3_story_cycle_violet_poet.1030.t: "Bậc Cao Quý và Người Lương Thiện"
  ep3_story_cycle_violet_poet.1030.desc: "Một trát triệu từ triều đình quý tộc là điều không thể khước từ, và thế là ta có mặt trong một cung điện lộng lẫy của [location.GetName]. Đón tiếp ta là [noblewoman.GetFirstName], với vẻ phấn khích rõ rệt.\n\n\"Thật vinh dự được gặp ngài!\" [noblewoman.GetSheHe|U] buột miệng. \"Ta cần được chỉ dạy đôi chút, ngài thấy đấy...\"\n\nHóa ra [noblewoman.GetFirstNameNoTooltip] đã cố gắng học thơ ca, nhưng thành quả vô cùng hạn chế — hạn chế đến mức có thể cho ta chút #EMP đòn bẩy#!..."
  ep3_story_cycle_violet_poet.1030.a: "Ta sẽ dạy dỗ nàng."
  ep3_story_cycle_violet_poet.1030.b: "Đáng tiếc, ta không thể dành thời gian."
  ep3_story_cycle_violet_poet.1030.c: "Có lẽ ta có thể giới thiệu một người thầy khác?"
  ep3_story_cycle_violet_poet.1030.c.tt: "Một phần cho ta, một phần cho [courtier_poet.GetFirstNameNoTooltip] vì công lao của [courtier_poet.GetHerHis]..."

  ep3_story_cycle_violet_poet.2000.t: "Khi Bóng Tối Buông Xuống"
  ep3_story_cycle_violet_poet.2000.desc: "Khi những ngày tháng trôi qua, ta thấy mình hoài niệm về những mối quan hệ thời trẻ. Một cái tên đặc biệt hiện lên trong tâm trí ta; [zaydun.GetFirstName]. Ibn Zaydun, họ gọi ngài là [zaydun.GetHerHim] như vậy, với trí thông minh nhạy bén và tài hùng biện sắc sảo.\n\nÀ, những ngày tháng gửi thơ qua lại, rong ruổi khắp các vùng đất chỉ để dành một đêm bên nhau. Nó làm ta thấy bồi hồi. Mối quan hệ của chúng ta có thể không hoàn hảo, nhưng những kỷ niệm đó luôn nằm sâu trong trái tim ta.\n\nĐã nhiều, nhiều năm rồi ta không gặp lại [zaydun.GetHerHim]. Ngày chia tay, ta đã quá khắc nghiệt, quá cay nghiệt. Sự hối tiếc đè nặng lên tâm trí ta."
  ep3_story_cycle_violet_poet.2000.a: "Có lẽ ta nên viết cho [zaydun.GetHerHim] một bức thư..."
  ep3_story_cycle_violet_poet.2000.a.tt: "Viết thư cho mối tình xưa"
  ep3_story_cycle_violet_poet.2000.a.book: "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Xiềng Xích Của Nỗi Nhớ'"
  ep3_story_cycle_violet_poet.2000.b: "Một bài thơ tưởng niệm mối tình đã mất sẽ xoa dịu tâm hồn ta."
  ep3_story_cycle_violet_poet.2000.c: "Những ngày ấy đã qua. Ta phải bước tiếp."

  ep3_story_cycle_violet_poet.2001.t: "Gửi vầng trăng trong bầu trời đêm của ta,"
  ep3_story_cycle_violet_poet.2001.desc: "Đã quá lâu rồi ta chờ đợi dù chỉ một lần tên ta thoáng qua trên môi người.\n\nThân xác ta đã già nua, nhưng trái tim ta vẫn như khoảnh khắc người rời bỏ ta; đông cứng, tan vỡ, chờ đợi cái chạm của người để đập trở lại."
  ep3_story_cycle_violet_poet.2001.a: "Ôi, [zaydun.GetFirstNameNoTooltip] yêu dấu của ta..."
  ep3_story_cycle_violet_poet.2001.a.flavor: "Ta phải gặp lại [zaydun.GetHerHim]."
  ep3_story_cycle_violet_poet.2001.a.tt: "Mời [zaydun.GetFirstNameNoTooltip] đến thăm."
  ep3_story_cycle_violet_poet.2001.b: "Hơi… quá đà rồi."

  ep3_story_cycle_violet_poet.2005.t: "Tái Ngộ"
  ep3_story_cycle_violet_poet.2005.desc: "Ngài ấy kìa, [zaydun.GetSheHe] bất ngờ đứng đó nơi khung cửa. Thời gian đã thay đổi [zaydun.GetHerHim] nhiều quá, nhưng lại... chẳng thay đổi chút nào. Những nếp nhăn trên gương mặt ngài đã hằn sâu hơn, nhưng đó vẫn là khuôn mặt của [zaydun.GetHerHis]. Tư thế của [zaydun.GetHerHis|U] có chút còng xuống, nhưng đó vẫn là cơ thể đã ôm chặt lấy ta suốt thời gian ấy. Ngay cả cách ngài di chuyển...\n\nVà [zaydun.GetSheHe] tiến lại gần, băng qua khoảng cách giữa chúng ta chỉ trong chớp mắt, rồi ta lại nằm trong vòng tay của [zaydun.GetHerHis]. Một cảm giác thật xa xôi, thấm đẫm bụi mờ của năm tháng và phai mờ bởi ánh sáng của ký ức, nhưng lại vô cùng gần gũi và quen thuộc.\n\nKhi chúng ta miễn cưỡng tách rời, ta cảm thấy như một phần của chính mình mà ta thậm chí không biết là đã mất đi, bỗng chốc được trở về, những vết thương cũ được khâu kín."
  ep3_story_cycle_violet_poet.2005.a: "\"Ta không thể tin đó thực sự là người.\""
  ep3_story_cycle_violet_poet.2005.a.tt: "Ta không được để mình yêu thêm lần nữa..."
  ep3_story_cycle_violet_poet.2005.b: "Dù sao thì sự hiện diện của chàng cũng nâng tầm salon của ta..."

  ep3_story_cycle_violet_poet.2010.t: "Tác Phẩm Đồng Sáng Tác"
  ep3_story_cycle_violet_poet.2010.desc: "Chúng ta ngồi và cùng cười, giống như những ngày xưa cũ, thưởng trà trong bóng râm. Trí tuệ và sự sắc sảo của [zaydun.GetFirstNamePossessive] vẫn nhạy bén như dao cạo, và thời gian không làm phai mờ đi sự quyến rũ mà ngài đã từng dùng để chinh phục ta.\n\n"Ngài có gì ở đây vậy?" [zaydun.GetSheHe|U] hỏi, chỉ tay vào [double_moon_book.GetName] nằm trên bàn bên cạnh ta. Ta trao nó cho ngài.\n\n"Đây là một tác phẩm tuyệt đẹp. Tác phẩm của ngài vẫn thanh tao như ngày nào." Nụ cười rạng rỡ của [zaydun.GetHerHis|U] làm ta hơi run rẩy, như ngày nào. "Ta không nghĩ ngài sẵn lòng cùng ta hợp tác viết một bài trong vài ngày tới chứ? Tất nhiên là nếu kẻ [zaydun.GetWomanMan] già nua này vẫn còn có thể theo kịp ngài.""
  ep3_story_cycle_violet_poet.2010.a: "\"Chúng ta đều đã già rồi, [zaydun.GetFirstNameNoTooltip]. Nhưng tuổi tác mang đến trí tuệ.\""
  ep3_story_cycle_violet_poet.2010.b: "\"Ta làm việc một mình.\""

  ep3_story_cycle_violet_poet.2015.t: "Lại Một Lần Từ Biệt"
  ep3_story_cycle_violet_poet.2015.desc: "Vài ngày qua là những ngày hạnh phúc nhất trong cuộc đời ta, nhưng mọi thứ rồi cũng phải đến hồi kết. Một người hầu mang thêm đồ đạc của [zaydun.GetFirstNamePossessive] đi ngang qua khi chúng ta nói lời từ biệt. [zaydun.GetSheHe|U] nắm lấy đôi bàn tay ta trong [zaydun.GetHerHis].\n\n"Gặp lại ngài đã mang ánh sáng trở lại với cuộc đời ta." [zaydun.GetSheHe|U] bỏ lửng câu nói, người thợ viết chữ nổi tiếng nhất Iberia bỗng chốc không thốt nên lời. Thay vào đó, [zaydun.GetSheHe] thò tay vào túi và đặt một vật gì đó vào lòng bàn tay ta.\n\n"Xin hãy nhận lấy cái này. Nó chẳng là gì cả, chỉ là một món trang sức tầm thường, nhưng... nếu ngài đeo nó đôi lúc, trái tim ta sẽ vô cùng hạnh phúc. Bằng cách lấp đầy nó bằng ngón tay của ngài, nó cũng sẽ lấp đầy khoảng trống trong trái tim ta, nơi kỷ niệm về ngài đang trú ngụ.""
  ep3_story_cycle_violet_poet.2015.a: "\"…hãy ở lại với ta. Ở đây, tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Người #EMP phải#! ở lại.\""
  ep3_story_cycle_violet_poet.2015.artifact: "[newly_created_artifact.GetDesc]\n\nThiết kế đơn giản, ngoại trừ một chi tiết: dòng khắc nhỏ bên trong ghi rằng \"Gửi người ta yêu, giấc mộng cuối cùng của linh hồn ta.\""
  ep3_story_cycle_violet_poet.2015.a.success: "[zaydun.GetSheHe|U] đồng ý ở lại"
  ep3_story_cycle_violet_poet.2015.a.failure: "[zaydun.GetSheHe|U] từ chối và rời đi"
  ep3_story_cycle_violet_poet.2015.b: "Cho đến ngày ta gặp lại nhau, mối tình đã mất của ta."
  ep3_story_cycle_violet_poet.2015.b.tt: "...nếu ta còn có ngày gặp lại."
  ep3_story_cycle_violet_poet.2015.c: "Ta không thể tha thứ cho những sai lầm của quá khứ."
  ep3_story_cycle_violet_poet.2015.c.tt: "Cảm giác tội lỗi gặm nhấm Ngài"

  story_cycle_violet_poet: "Tử Hoa Nữ Sĩ"
  story_cycle_violet_poet_desc: "Vốn là vương nữ của Caliph vùng Cordoba và là một trong những hậu duệ cuối cùng của vương triều Umayyad, Ngài tự tại bước đi giữa thế gian khắc nghiệt mà chẳng cần mạng che mặt, dùng thi ca và tri thức để khai sáng tâm hồn cho phụ nữ thuộc mọi tầng lớp."
