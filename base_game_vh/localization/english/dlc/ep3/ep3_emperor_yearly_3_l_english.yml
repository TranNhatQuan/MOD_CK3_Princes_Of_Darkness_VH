l_english:


  ep3_emperor_yearly.3000.t: "Quyền Cướp Phá Cung Điện"
  ep3_emperor_yearly.3000.desc: "Những tên Varangian to lớn, rậm rạp lông lá lảo đảo khắp các đại sảnh hoàng cung mới của ta, tay ôm đầy vàng bạc và châu báu.\n\nSau cái chết của [dead_emperor.GetTitledFirstNamePossessive], những kẻ từng sẵn sàng bảo vệ ngài đến hơi thở cuối cùng đã tràn vào các kho tàng. Đó là quyền lợi truyền thống của họ, và chẳng ai dám ngăn cản những ngoại binh tinh nhuệ này chiếm lấy phần thưởng lấp lánh.\n\nĐó là cái giá phải trả để giữ cho đội [GetMaA('varangian_guards').GetName] của ta — những con chó săn thề nguyền — ngoan ngoãn trong tầm kiểm soát.\n\n"

  ep3_emperor_yearly.3000.desc_leader: "Và thế là, dưới sự chỉ huy của [varangian_leader.GetFullName], họ thò tay vào túi tiền của vị quân vương được [ROOT.Char.GetFaith.HighGodNamePossessive] tuyển chọn."
  ep3_emperor_yearly.3000.desc_no_leader: "Và thế là đám Bắc Âu thò tay vào túi tiền của vị quân vương được [ROOT.Char.GetFaith.HighGodNamePossessive] tuyển chọn."

  ep3_emperor_yearly.3000.a: "\"Chặn chúng lại, Akolouthos! Thu hồi vàng của ta!\""
  ep3_emperor_yearly.3000.a.flavor: "\"[varangian_leader.GetFirstNameNoTooltip]! Ngươi được chỉ định làm chỉ huy Cận Vệ để kiểm soát Cận Vệ. #EMP Hãy làm đi!#!\""
  ep3_emperor_yearly.3000.b: "Dù là tập tục hay không, ta cũng sẽ trừng trị bọn man rợ này!"
  ep3_emperor_yearly.3000.b.flavor: "Cứ để chúng nhận thù lao — nhưng hoàng cung phải giữ được thể diện. Phải làm gương!"
  ep3_emperor_yearly.3000.c: "Lòng trung thành luôn có giá của nó."
  ep3_emperor_yearly.3000.c.flavor: "Người Varangian từ bỏ lương bổng hậu hĩnh thường kỳ và rong ruổi đường xa chính vì khoản chiến lợi phẩm lớn này."

  akolouthos_aptitude_option_unlock: "Lựa chọn này khả dụng nhờ [GetCourtPositionType('akolouthos_court_position').GetName()] của Ngài có [aptitude|E] cao"

  disrespected_varangians_modifier: "Xúc Phạm Người Varangian"
  disrespected_varangians_modifier_desc: "Việc thách thức quyền nhận thưởng của Cận Vệ Varangian đã làm tổn hại nghiêm trọng đến lòng trung thành của họ, cũng như của các đội quân đánh thuê tương tự."
  major_gold_to_varangians_tooltip: "Ngài trả [gold_i]#negative_value 75#! do có #high 3#! [court_position|E] Varangian"
  medium_gold_to_varangians_tooltip: "Ngài trả [gold_i]#negative_value 50#! do có #high 2#! [court_position|E] Varangian"
  minor_gold_to_varangians_tooltip: "Ngài trả [gold_i]#negative_value 25#! cho một [court_position|E] Varangian"

  loyal_varangians_modifier: "Varangian Quả Cảm"
  loyal_varangians_modifier_desc: "Được hậu thuẫn bởi những Varangian trung thành không lay chuyển, các đội bộ binh nặng của nhân vật này đứng vững và tung đòn sấm sét."

  attentive_varangians_modifier: "Varangian Tận Tụy"
  attentive_varangians_modifier_desc: "Được thưởng hậu hĩnh cho sự phục vụ, Cận Vệ Varangian từ bỏ ẩu đả và chè chén để tập trung bảo vệ chu đáo."
  eager_varangian_army: "Đạo Quân Varangian"

  ep3_emperor_yearly.3011.t: "Ngọn Lửa Bí Mật Của Chúng Ta"
  ep3_emperor_yearly.3011.intro: "[invader.GetTitleAsName] của [invader.GetPrimaryTitle.GetNameNoTier] lẽ ra phải biết rõ hơn là"
  ep3_emperor_yearly.3011.liege_attacking: "dong thuyền"
  ep3_emperor_yearly.3011.commander_attacking: "phái hạm đội của [invading_commander.GetTitledFirstNamePossessive]"
  ep3_emperor_yearly.3011.desc: "tiến vào vùng nước yên bình của [army.GetLocation.GetNameNoTooltip], và càng không nên thách thức thành phố của [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nNhững chiếc [Glossary( 'dromons', 'DROMONS_GLOSS' )] trong hạm đội của ta, với các ống phun đồng miệng rồng lắp sẵn, rời khỏi bến cảng. Nếu mặt nước lặng sóng, nếu các thuyền trưởng phối hợp nhịp nhàng… kẻ thù của ta sẽ bị thiêu rụi.\n\nNếu [ROOT.Char.GetFaith.HighGodName] đòi hỏi cái giá cho tội lỗi của chúng ta, thì nhiều binh sĩ [ROOT.Char.GetCapitalLocation.GetCounty.GetCulture.GetName] cũng sẽ bị thiêu sống — hỏa lỏng chính là hiện thân của hỗn mang!"
  ep3_emperor_yearly.3011.kyrie_eleison: "[Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )]!"

  KYRIE_ELEISON_GLOSS: "#bold Kýrie, eléison#! — \"Lạy Chúa, xin thương xót con!\" — là một lời cầu nguyện Kitô giáo với nhiều mục đích sử dụng. Nó được hát trong các lễ đăng quang, lễ nhậm chức Giáo hoàng; và được quân Byzantine dùng làm tiếng hô xung trận."
  ep3_emperor_yearly.3011.a: "Hãy khiến chính #EMP mặt nước#! bốc cháy!"
  ep3_emperor_yearly.3011.a.success: "Cuộc tấn công thiêu rụi kẻ thù"
  ep3_emperor_yearly.3011.a.fail: "Gây ra thiệt hại đáng kể"
  ep3_emperor_yearly.3011.a.critical_fail: "Thuyền của Ngài tự hủy hoại chính mình"
  ep3_emperor_yearly.3011.b: "Ta không thể mạo hiểm hạm đội."
  unable_to_use_fire_ships_tooltip: "@alert_icon! #alert_trial Trong #high 30 ngày#!, các chiến thuyền Hỏa Hy Lạp của Ngài sẽ không thể sử dụng!"

  ravaged_by_greek_fire_modifier: "Tàn Phá Bởi Hỏa Hy Lạp"
  ravaged_by_greek_fire_modifier_desc: "Những binh sĩ sống sót của đạo quân này bị bỏng nặng và hoàn toàn suy sụp tinh thần."

  defenders_immolated_modifier: "Quân Phòng Thủ Bị Thiêu Sống"
  defenders_immolated_modifier_desc: "Hải cảng nơi đây không còn hạm đội, còn tường thành chỉ được giữ bởi những người sống sót băng bó kín mình, bỏng cháy khủng khiếp."

  assaulted_by_greek_fire_modifier: "Bị Tấn Công Bằng Hỏa Hy Lạp"
  assaulted_by_greek_fire_modifier_desc: "Lực lượng của nhân vật này đã mất tinh thần, tan tác, và nhiều người bị thiêu sống trong một cuộc tấn công hải quân bằng Hỏa Hy Lạp."

  ep3_emperor_yearly.3012.t: "Rồng Trên Eo Bosporus"
  ep3_emperor_yearly.3012.intro: "Những chiếc [Glossary( 'dromons', 'DROMONS_GLOSS' )] của ta áp sát, chèo mạnh để các vũ khí khủng bố của chúng liếm tới hạm đội [invader.GetPrimaryTitle.GetAdjective].\n\nNhững tiếng nổ như sấm vang rền trên vùng nước [army.GetLocation.GetNameNoTooltip]! Những cột lửa khổng lồ chiếu sáng chiến trường mịt mù khói lửa, át đi bằng những tiếng gào thét địa ngục.\n\n"
  ep3_emperor_yearly.3012.attack_success: "Như những giàn hỏa táng khổng lồ, chiến thuyền của [invader.GetTitledFirstNamePossessive] bốc cháy dữ dội. Những thân thể cháy xém tru tréo lao xuống biển, cầu xin [invader.GetFaith.HighGodNamePossessive] cứu rỗi — nhưng ngay cả dưới nước, kẻ thù của ta cũng chỉ tìm thấy ngọn lửa công chính!\n\nKhi mặt biển còn rực sáng, các dromon của ta khải hoàn trở về."
  ep3_emperor_yearly.3012.attack_fail: "Một số chiến thuyền [invader.GetPrimaryTitle.GetAdjectiveNoTooltip] bị đốt cháy, thủy thủ tuyệt vọng gào khóc trong đau đớn, nhưng những chiếc khác đã tản ra và tránh được đòn tấn công. Chẳng bao lâu sau, các dromon của ta quay về bến, nồng nặc mùi hắc ín và naphta.\n\nQuân địch, dù bị thiêu đốt và suy yếu, vẫn còn chút sức lực."
  ep3_emperor_yearly.3012.attack_crit_fail: "Nhưng than ôi — #EMP hạm đội của ta bốc cháy!#! Vì, khi những con sóng bất trị ném ngọn lửa từ các máy phun lửa của ta lên sàn boong tàu của chính các dromon của mình, các tàu của [invader.GetPrimaryTitle.GetAdjectiveNoTooltip] vẫn nằm ngoài tầm bắn của ta.\n\nChỉ một vài con tàu thân thiện sống sót để lết trở lại bến cảng lớn của Constantinople."
  ep3_emperor_yearly.3012.a_success: "Từng là kẻ xâm lăng — giờ chỉ còn #EMP tro tàn!#!"
  ep3_emperor_yearly.3012.a_fail: "Ngay cả ngọn lửa của [ROOT.Char.GetFaith.PositiveAfterLife] cũng có giới hạn."
  ep3_emperor_yearly.3012.a_crit_fail: "Một thảm họa!"

  two_knights_killed_tooltip: "@death_icon!#high 2#! [knights|E] bị giết"
  three_knights_killed_tooltip: "#high 3#! [knights|E] bị thương"
  two_knights_wounded_tooltip: "#high 2#! [knights|E] bị thương"
