 # Maintenance etc
  activity_camp_party: "Tiệc Hội Trại"
  activity_camp_party_desc: "Tổ chức một buổi ăn mừng nhỏ tại trại của Ngài, tiêu tốn [gold_i][gold|E] nhưng chịu ảnh hưởng bởi lượng [provisions_i][provisions|E] dự trữ. Khách mời sẽ bao gồm toàn bộ người trong trại, và có thể mời thêm các lãnh chúa địa phương.\n\nTiệc Hội Trại tạo cơ hội để kết thân với các [followers|E], nhận những [task_contracts|E] đặc biệt và quản lý [stress|E]."
  activity_camp_party_province_desc: "Chọn Nam tước địa"
  activity_camp_party_host_desc: "$BULLET_WITH_TAB$Có thể giảm [stress_i][stress|E]\n$BULLET_WITH_TAB$Có thể nhận [provisions_i][provisions|E]\n$BULLET_WITH_TAB$Có thể nhận điểm [skill|E]\n$BULLET_WITH_TAB$Có thể nhận [task_contracts|E]\n$BULLET_WITH_TAB$Có thể nhận [artifacts|E]\n$BULLET_WITH_TAB$Có thể chiêu mộ [followers|E] mới"
  activity_camp_party_success: "Mức Độ Hội Hè"
  activity_camp_party_success_desc: "\n\nMức độ hội hè hiện tại của [GetActivityType( 'activity_camp_party' ).GetName].\n\nHội hè càng tưng bừng, phần thưởng từ [activity|E] Ngài nhận được càng tốt."
  activity_camp_party_cooldown: "Ngài phải chờ ít nhất 3 tháng trước khi tổ chức một buổi hội hè khác!"
  activity_camp_party_selection_tooltip: "Tổ chức một [GetActivityType('activity_camp_party').GetName] cùng các [followers|E] của Ngài\n\nPhần thưởng dự kiến:\n$BULLET_WITH_TAB$Giảm [stress_i][stress|E]\n$BULLET_WITH_TAB$Nhận [provisions_i][provisions|E]\n$BULLET_WITH_TAB$[task_contracts|E] mới"
  activity_camp_party_destination_selection: "[GetActivityType('activity_camp_party').GetName] chỉ có thể được tổ chức trong Trại của Ngài"
  activity_camp_party_guest_desc: "$BULLET_WITH_TAB$ Người tham dự có thể giảm [stress|E]"
  activity_camp_party_conclusion_desc: "[GetActivityType( 'activity_camp_party' ).GetName] đã kết thúc"
  camp_party_completed_log_entry_effect_title: "$activity_camp_party$ Hoàn tất"
  camp_party_100_contracts_get: "Ngài nhận được #value 2#! [task_contracts|E] mới"
  camp_party_75_contracts_get: "Ngài nhận được một [task_contract|E] mới"
  activity_camp_party_guest_help_text: "Tất cả những người trong trại đều có thể được kỳ vọng sẽ tham dự một sự kiện ăn mừng và vui chơi như thế này.\n\nLãnh chúa địa phương có thể được mời làm Khách Danh Dự, nhưng hãy cẩn thận: những người thuộc một số [ranks|E] nhất định có thể cho rằng việc tham dự là không xứng với địa vị của họ."

  activity_invite_rule_followers: "Thuộc hạ"
  activity_invite_rule_local_lord: "Lãnh chúa địa phương"
  camp_party_honorary_guest_for_host: "Khách Danh Dự"
  camp_party_honorary_guest_desc_for_host: "Mời lãnh chúa địa phương tham dự với tư cách là vị khách danh giá của trại."

  camp_party_option_food: "Thức ăn"
  camp_party_food_none: "Thức ăn đạm bạc"
  camp_party_food_none_desc: "$EFFECT_LIST_BULLET$ Không có hiệu ứng bổ sung\n\n#weak Chúng ta không cần thêm thức ăn để có một buổi vui vẻ!#!"
  camp_party_food_simple: "Bữa ăn đơn giản"
  camp_party_food_simple_desc: "#indent_newline:4 $EFFECT_LIST_BULLET$ Tăng tiến độ Hội Hè#!\n#indent_newline:4 $EFFECT_LIST_BULLET$ Mở các sự kiện cho phép:\n#indent_newline:10 $EFFECT_LIST_BULLET$ Đổi [provisions_i][provisions|E] lấy lợi ích#!\n\n#weak Một chút đồ ăn cũng mang lại khác biệt lớn trong một buổi hội hè.#!"
  camp_party_food_lavish: "Yến tiệc thịnh soạn"
  camp_party_food_lavish_desc: "#indent_newline:4 $EFFECT_LIST_BULLET$ Tăng tiến độ Hội Hè#!\n#indent_newline:4 $EFFECT_LIST_BULLET$ Mở các sự kiện cho phép:\n#indent_newline:10 $EFFECT_LIST_BULLET$ Đổi [provisions_i][provisions|E] lấy lợi ích#!\n#indent_newline:10 $EFFECT_LIST_BULLET$ Có thể thu hút [wanderers|E] đến hội hè#!\n\n#weak Những chiếc bàn dài như rên rỉ dưới sức nặng của sự xa hoa này!#!"
  camp_party_food_options_invalid: "Ngài cần công trình [GetDomicileBuilding('supply_tent_01').GetName] [domicile_building|E]"

