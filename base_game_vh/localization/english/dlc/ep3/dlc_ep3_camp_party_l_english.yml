 #Start
  ep3_camp_party.0001.t: "Sẵn Sàng Xuất Phát"
  ep3_camp_party.0001.desc: "Cuối cùng mọi người cũng đã tụ họp đông đủ, vật tư sẵn sàng, đống lửa nổ lách tách vui tai giữa vòng trại.\n\nCuộc sống trên đường thiên lý vốn chẳng dễ dàng. Buổi hội hè này sẽ là dịp để tất cả chúng ta thư giãn và tạm quên đi cuộc mưu sinh khắc nghiệt.\n\nHãy để cuộc vui bắt đầu!"
  ep3_camp_party.0001.a: "Ta nóng lòng chờ đợi!"
 #Conclusion
  ep3_camp_party.0009.t: "Thời Gian Trôi Nhanh"
  ep3_camp_party.0009.desc: "Đống lửa dần lụi tàn, chỉ còn lại than hồng nơi trước kia từng bùng cháy dữ dội. Những người tham dự cũng lần lượt trở về chỗ nghỉ.\n\nMọi người đều đã có một khoảng thời gian tuyệt vời, nhưng giờ là lúc khép lại cuộc vui."
  ep3_camp_party.0009.a: "Đúng là một buổi hội hè đáng nhớ."

 #Events
  ep3_camp_party.1000.t: "Những Câu Chuyện Được Kể"
  ep3_camp_party.1000.desc: "\"Rồi thì! Rồi thì nữa!\" [storyteller.GetFirstName] vung tay múa chân khi [storyteller.GetSheHe] dệt nên một câu chuyện đã kéo dài từ lâu. \"Hắn ngã lăn ra như một bao gạch! Trúng ngay đầu luôn.\"\n\n[storyteller.GetFirstNameNoTooltip] đắm mình trong những tràng tán thưởng của đám đông với nụ cười mãn nguyện. Quả thực là một câu chuyện đầy gan dạ.\n\nNhững người xung quanh vẫn còn háo hức, cố gắng nài nỉ thêm một câu chuyện nữa từ đôi môi của [storyteller.GetFirstNamePossessiveNoTooltip]."
  ep3_camp_party.1000.a: "Rốt cuộc là ngươi ném hắn bằng thứ gì?"
  ep3_camp_party.1000.a.tt: "Có lẽ chúng ta có thể tái tạo nó, nếu có đủ gỗ vụn và kim loại..."
  ep3_camp_party.1000.b: "Ta cũng có một câu chuyện!"
  ep3_camp_party.1000.b.success: "Câu chuyện của Ngài còn hay hơn"
  ep3_camp_party.1000.b.failure: "Câu chuyện của Ngài không mấy hấp dẫn"
  ep3_camp_party.1000.b.tt: "[storyteller.GetFirstNameNoTooltip] cảm thấy bị xúc phạm vì Ngài cố lấn át"
  ep3_camp_party.1000.c: "Hay lắm! Kể thêm nữa đi!"
  ep3_camp_party.1000.c.success: "Câu chuyện tiếp theo còn hay hơn"
  ep3_camp_party.1000.c.failure: "Câu chuyện tiếp theo không được đón nhận như mong đợi"
  ep3_camp_party.1000.d: "Một câu chuyện hay."
  ep3_makeshift_mace: "Chùy Chế Tạm"
  ep3_makeshift_mace_description: "Một cây chùy nặng được chế tạo tạm thời theo mô tả trong câu chuyện. Hiệu quả của nó rõ ràng như sự thô ráp của hình dáng, và những bài học rút ra từ việc chế tạo chắc chắn sẽ giúp tiết kiệm hơn trong tương lai."

  ep3_camp_party.1005.t: "Lang Thang Mất Dạng"
  ep3_camp_party.1005.desc: ""Ồ... thưa [ROOT.Char.GetLadyLord]?" [attendee.GetFirstName] tiến lại gần, vò nát đôi bàn tay của [attendee.GetHerHis] vì lo lắng. "Ta không biết [wanderer.GetFirstName] đang ở đâu. Đã khá lâu rồi..."\n\nĐã #EMP khá#! lâu kể từ lần cuối ta thấy [wanderer.GetFirstNameNoTooltip]. Trong khi đó, bầu trời tối sầm lại đầy điềm gở khi hoàng hôn đang đến gần.\n\n[wanderer.GetSheHe] đã trôi dạt đi đâu rồi?"
  ep3_camp_party.1005.a: "Cho thêm củi vào lửa để dẫn [wanderer.GetHerHim] trở về."
  ep3_camp_party.1005.a.tt.positive: "#weak Cột khói còn thu hút sự chú ý ngoài cả [wanderer.GetFirstNameNoTooltip] đang lang thang...#!"
  ep3_camp_party.1005.b: "Cầm đuốc lên và đi tìm. Đừng đi quá xa."
  ep3_camp_party.1005.b.success: "Kỹ năng lần dấu của Ngài phát huy hiệu quả ngay lập tức"
  ep3_camp_party.1005.b.neutral: "[wanderer.GetFirstNameNoTooltip] quay lại, mang theo vài quả dại mà [wanderer.GetSheHe] tìm được"
  ep3_camp_party.1005.b.failure: "Ngài chạm trán thú hoang khi tìm thấy [wanderer.GetFirstNameNoTooltip]"
  ep3_camp_party.1005.c: "Chúng ta cứ ngồi chờ."
  ep3_camp_party.1005.c.success: "[wanderer.GetFirstNameNoTooltip] tìm thấy đường quay lại"
  ep3_camp_party.1005.c.failure: "[wanderer.GetFirstNameNoTooltip] xuất hiện trở lại, bị thương"
  ep3_camp_party.1005.c.critfailure: "[wanderer.GetFirstNameNoTooltip] thực sự đã bị lạc"

  ep3_camp_party.1006.t: "Những Vị Khách Bất Ngờ"
  ep3_camp_party.1006.desc: "Chúng Ta vừa cho [wanderer.GetFirstName] ngồi xuống thì một tiếng xào xạc trong bụi rậm báo hiệu sự hiện diện của kẻ khác. Ta bật dậy, nhưng khi ánh lửa soi rõ bóng dáng đang tiến lại, rõ ràng [newcomer.GetSheHe] không có ý xấu.\n\n\"Xin hãy,\" [newcomer.GetSheHe] mở lời, \"Ta không đến đây để gây rắc rối. Ta chỉ là một thầy thuốc lang bạt, kiếm sống bằng nghề chữa bệnh.\"\n\n\"Ta thấy cột khói từ xa. Nếu được ở lại một lát và tham gia hội hè cùng các vị, Ta sẽ vô cùng mang ơn; đây, xin nhận chút thức ăn để bù cho sự bất tiện.\""
  ep3_camp_party.1006.a: "\"Có lẽ ngươi muốn ở lại #EMP vĩnh viễn#! chăng?\""
  ep3_camp_party.1006.b: "\"Ngồi xuống đi! Dạy ta những kiến thức y thuật của ngươi!\""

  ep3_camp_party.1010.t: "Đấu Trí"
  ep3_camp_party.1010.desc: "Nụ cười ranh mãnh của [riddler.GetFirstNamePossessive] phía trên vành cốc của [riddler.GetHerHis] báo hiệu điều chẳng lành, Ta đoán vậy.\n\n\"Nào đi, [ROOT.Char.GetFirstNameNoTooltip]. Xem trí óc của ngươi còn sắc bén không sau từng ấy ngày rong ruổi!\" [riddler.GetSheHe|U] khua nhẹ chiếc cốc đầy kiểu cách. \"Một câu đố, chẳng hạn?\" Không chờ Ta đồng ý, [riddler.GetSheHe] đã bắt đầu."
  ep3_camp_party.1010.desc_riddle_01: "\n\n#EMP \"Bị xé khỏi dạ mẹ,\nBị đập và bị nung,\nTa trở thành kẻ sát nhân khát máu.\"#!"
  ep3_camp_party.1010.desc_riddle_02: "\n\n#EMP \"Lúc thì vàng, lúc thì trắng,\nMột nửa tối đen, nửa kia sáng ngời.\"#!"
  ep3_camp_party.1010.desc_riddle_03: "\n\n#EMP \"Ta có bốn chân,\nNhưng chẳng thể bước đi.\"#!"
  ep3_camp_party.1010.desc_riddle_04: "\n\n#EMP \"Ta có một mắt,\nNhưng chẳng thể nhìn.\"#!"
  ep3_camp_party.1010.desc_riddle_05: "\n\n#EMP \"Ta là một 'căn phòng',\nNhưng không có cửa hay cửa sổ.\"#!"
  ep3_camp_party.1010.desc_riddle_06: "\n\n#EMP \"Ta có thể bị mắc phải,\nNhưng không thể ném đi.\"#!"
  ep3_camp_party.1010.desc_riddle_07: "\n\n#EMP \"Người nghèo có ta,\nNgười giàu cần ta,\nNếu ăn ta, ngươi sẽ chết.\"#!"
  ep3_camp_party.1010.desc_riddle_08: "\n\n#EMP \"Rất dễ sa vào,\nNhưng cực khó thoát ra.\"#!"
  ep3_camp_party.1010.desc_outro: "\nĐó là gì?"#!"
  ep3_camp_party.1010.a: "\"Dễ thôi. Đáp án là '[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]' .\""
  ep3_camp_party.1010.b: "Có lẽ đáp án là..."
  ep3_camp_party.1010.b.success: "Ngài đoán đúng"
  ep3_camp_party.1010.b.success.title: "Đáp án đúng là '[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]' ."
  ep3_camp_party.1010.b.failure: "Ngài đoán sai"
  ep3_camp_party.1010.c: "\"Ôi [riddler.GetFirstNameNoTooltip], câu đố của ngươi quá thâm hiểm với ta rồi!\""
  ep3_camp_party.1010.c.tt: "Dù sự thật thế nào, giả vờ tin có lẽ vẫn tốt cho hòa khí hơn..."
  ep3_camp_party.1010.answer_riddle_01: "sắt"
  ep3_camp_party.1010.answer_riddle_02: "mặt trăng"
  ep3_camp_party.1010.answer_riddle_03: "cái bàn"
  ep3_camp_party.1010.answer_riddle_04: "cây kim"
  ep3_camp_party.1010.answer_riddle_05: "cây nấm"
  ep3_camp_party.1010.answer_riddle_06: "bệnh tật"
  ep3_camp_party.1010.answer_riddle_07: "không gì cả"
  ep3_camp_party.1010.answer_riddle_08: "rắc rối"

  ep3_camp_party.1015.t: "Lên Dây Cung"
  ep3_camp_party.1015.desc: "Ta vừa đứng dậy định lấy thêm đồ uống thì [archer.GetFirstName] cũng bật dậy theo.\n\n\"Ta nghĩ ai trong chúng ta cũng cần một chút #EMP thi đấu thân thiện#!!\" [archer.GetSheHe|U] nói, tay cầm cung. \"Một cuộc thi bắn cung nhẹ nhàng thì sao? Ta có sẵn một cây cung cho ngươi đây, [ROOT.Char.GetFirstNameNoTooltip]...\"\n\nCó lẽ đồ uống sẽ phải chờ."
  ep3_camp_party.1015.a: "\"Làm cho thú vị hơn chút đi. Lấy hai quả táo.\""
  ep3_camp_party.1015.a.tt: "[apple_holder.GetFirstNameNoTooltip] làm giá đỡ cho chúng thì quá hợp."
  ep3_camp_party.1015.a.success: "Mũi tên của Ngài trúng quả táo"
  ep3_camp_party.1015.a.failure: "Ngài bắn trượt, còn [archer.GetFirstNamePossessiveNoTooltip] thì trúng"
  ep3_camp_party.1015.a.critfailure: "[archer.GetFirstNameNoTooltip] bắn trượt, nhưng cú trượt của Ngài còn tệ hơn..."
  ep3_camp_party.1015.b: "\"Hay là đi săn? Ai hạ được con mồi trước thì thắng.\""
  ep3_camp_party.1015.b.success: "Ngài hạ được con mồi đầu tiên"
  ep3_camp_party.1015.b.failure: "[archer.GetFirstNameNoTooltip] hạ được con mồi đầu tiên"
  ep3_camp_party.1015.b.critfailure: "[archer.GetFirstNameNoTooltip] vô tình bắn trúng ngài bằng phát bắn của [archer.GetHerHis]"
  ep3_camp_party.1015.c: "\"Nào, ngươi chọn mục tiêu đi!\""
  ep3_camp_party.1015.c.success: "Ngài chiến thắng"
  ep3_camp_party.1015.c.failure: "Ngài thua cuộc"
  ep3_camp_party.1015.d: "\"Ta nào dám so tài với người tầm cỡ như ngươi!\""

  ep3_camp_party.1020.t: "Ai Đó?"
  ep3_camp_party.1020.opening: "Lễ hội của chúng ta đột ngột bị gián đoạn: một bóng người đang loạng choạng tiến về phía chúng ta từ ngoại vi trại. Rõ ràng là đói và mệt, [local.GetSheHe] cho biết [local.GetHerHis] tên là [local.GetFirstName].\n\n"
  ep3_camp_party.1020.witch: "[local.GetFirstNameNoTooltip] run rẩy và yếu ớt, nhưng trong mắt [local.GetHerHis] vẫn ánh lên một sự tỉnh táo mãnh liệt. Y phục tả tơi của [local.GetHerHis|U] treo đầy những bùa chú và biểu tượng lạ lẫm.\n\n"
  ep3_camp_party.1020.cannibal: "[local.GetSheHe|U] đeo một chiếc vòng cổ kỳ lạ làm từ xương. Rõ ràng là [local.GetSheHe] đang đói, nhưng đôi mắt của [local.GetHerHis] chỉ thực sự mở to vì phấn khích khi hỏi về việc... chúng ta có loại #EMP thịt#! nào sẵn có.\n\n"
  ep3_camp_party.1020.mangled: "Tâm hồn bất hạnh đó bị tổn thương về thể xác đến mức gần như không thể nhận ra. Một cái chân bị mất, một cánh tay bị mất, và những vết sẹo trên khuôn mặt và cơ thể còn lại của [local.GetHerHis]. Ta nhăn mặt khi nhìn thấy mức độ thiệt hại khủng khiếp.\n\n"
  ep3_camp_party.1020.mystic: "Có một trí tuệ sâu sắc ẩn chứa trong đôi mắt của [local.GetFirstNamePossessiveNoTooltip]. Những que hương nhỏ kêu lách cách trên thắt lưng của [local.GetHerHis] khi [local.GetSheHe] chắp đôi bàn tay của [local.GetHerHis] lại như một lời cầu khẩn.\n\n"
  ep3_camp_party.1020.siblings: "Ta vừa mở miệng đáp lời thì một bóng người thứ hai — khom lưng và rõ ràng đang đau đớn — xuất hiện. [local.GetFirstNameNoTooltip] lập tức đến bên [local_sibling.GetHerHis], dịu dàng mà chiếm hữu kéo [local_sibling.GetHerHim] lại gần.\n\n\"Xin hãy giúp.\" [local.GetFirstNameNoTooltip] nhìn Ta van nài. \"[local_sibling.GetFirstName|U] là [local_sibling.Custom('SisterBrother')] của Ta. [local_sibling.GetSheHe|U] cần được nghỉ ngơi và uống nước.\"\n\nMối quan hệ của họ rõ ràng rất khăng khít. #EMP Vô cùng#! khăng khít. Nhưng những vết màu đỏ sẫm kia trên quần áo họ là gì...?"
  ep3_camp_party.1020.ending: "\"Ta chỉ xin một đêm nghỉ ngơi an toàn và chút thức ăn thôi, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [local.GetSheHe|U] nói, \"và Ta sẽ mang ơn ngài vô cùng.\""
  ep3_camp_party.1020.a: "\"Sao không ở lại?\""
  ep3_camp_party.1020.b: "Chúng ta có thể chia cho chút thức ăn."
  ep3_camp_party.1020.c: "Số lương thực ít ỏi này phải để dành cho chúng ta."

  ep3_camp_party.1021.t: "Bị Từ Chối"
  ep3_camp_party.1021.witch: "Đôi mắt trong sáng của [local.GetFirstNamePossessiveNoTooltip] cứng lại tàn nhẫn, trong sự giận dữ và xấu hổ.\n\n"Ngươi sẽ sống để hối hận vì chuyện này." [local.GetSheHe|U] nhìn quanh tất cả chúng ta, một cái nhếch mép khinh bỉ trên đôi môi của [local.GetHerHis]. "Đã có một kẻ trong số chúng ta ở giữa các ngươi. Chúng sẽ đảm bảo rằng các ngươi phải chịu đau khổ."\n\nVới những lời cuối cùng đó, [local.GetSheHe] biến mất, tan vào bóng tối đang bao trùm."
  ep3_camp_party.1021.cannibal: "[local.GetFirstNameNoTooltip|U] cười khẩy trước câu trả lời của Ta.\n\n\"Đến cả giúp một [local.GetWomanMan] đang khốn cùng cũng không? Nghĩ mà xem, đã có một kẻ như ta trong số các ngươi rồi. Ừ, ta thấy được mà, ta biết các ngươi hiểu đống xương này có nghĩa gì.\"\n\nVới cái lắc đầu khinh miệt cuối cùng, [local.GetSheHe] lảo đảo bước vào bóng tối, không giải thích thêm."
  ep3_camp_party.1021.mangled: "[local.GetFirstNameNoTooltip] dường như không tức giận, mà chỉ buồn bã.\n\n\"Thêm một dấu khắc nữa trong cuộc đấu tranh dài dằng dặc của cuộc đời chống lại sự tồn tại của ta.\" [local.GetSheHe|U] mỉm cười u sầu rồi rời đi không nói thêm lời nào.\n\nTa có thể cảm nhận ánh mắt của các Ngài đồng hành khoan vào sau gáy khi nhìn [local.GetHerHim] tập tễnh khuất dần. Đây rõ ràng không phải là quyết định được ưa thích."
  ep3_camp_party.1021.mystic: "Sự trả thù của [local.GetFirstNamePossessiveNoTooltip] đến nhanh và không báo trước. Một cái nhếch môi, một lời nguyền rủa, rồi bỗng nhiên tầm nhìn của Ta mờ đi. [local.GetFirstName] rút lui nhanh như khi [local.GetSheHe] ném hỗn hợp sạn cát đó vào mặt Ta, bỏ chạy khi các thuộc hạ lao tới giúp đỡ.\n\nChưa thấy tác hại tức thì nào, nhưng... bụng Ta bắt đầu thấy hơi khó chịu..."
  ep3_camp_party.1021.siblings: "Khuôn mặt của [local.GetFirstNamePossessive] méo mó lại, như khoác lên một chiếc mặt nạ căm hận. Đó là điều cuối cùng Ta thấy trước khi hòn đá giấu trong tay [local.GetHerHis] đập thẳng vào hốc mắt Ta.\n\nTa gục xuống ôm mặt, lờ mờ nhận ra hai anh em họ đang vội vã trốn đi khi các thuộc hạ vây quanh trợ giúp."
  ep3_camp_party.1021.callous: "Khi Ta nói xong, khuôn mặt của [local.GetFirstNamePossessive] sầm lại, nhưng Ta đã quay đi. Ta ra hiệu cho những người khác tống khứ những kẻ xâm nhập khỏi trại.\n\nKhi họ bị lôi đi, tâm trạng Ta bỗng nhẹ nhõm hơn."
  ep3_camp_party.1021.normal: "Một sự pha trộn giữa nỗi buồn, sự tức giận và tuyệt vọng hiện lên trên khuôn mặt của [local.GetFirstNamePossessive]. [local.GetSheHe|U] không hề tỏ ra thù địch khi [local.GetSheHe] rời đi.\n\nTa cố dập tắt cảm giác tội lỗi đang dâng trào khi chúng ta quay trở lại với lễ hội."
  ep3_camp_party.1021.a.face: "#EMP ÁÁÁÁÁ!#!"
  ep3_camp_party.1021.a.ill: "Ta thực sự không #DIE1 thấy ổn chút nào...#!"
  ep3_camp_party.1021.a.sad: "Ừ thì... cũng đành vậy."
  ep3_camp_party.1021.b: "Tuyệt. Quay lại vui chơi thôi!"

  ep3_camp_party.1025.t: "Trao Đổi Chuyện Xưa"
  ep3_camp_party.1025.desc: "Cuộc vui vẫn tiếp diễn, nhưng [friend.GetFirstName] rõ ràng đang trầm ngâm.\n\n\"Chuyện này thật sự gợi ta nhớ về thời thơ ấu.\" [friend.GetSheHe|U] nhìn quanh đầy hoài niệm. \"Bao nhiêu trò quậy phá và ăn chơi. Ta có thể kể cả trăm đêm như thế ngay lúc này!\" [friend.GetSheHe|U] nhìn sang Ta.\n\n\"Còn ngươi thì sao? Có kỷ niệm nào khi còn là một [ROOT.Char.Custom('GetLassLad')] không?\""
  ep3_camp_party.1025.a: "Ta muốn nghe chuyện của ngươi hơn!"
  ep3_camp_party.1025.b: "Dĩ nhiên rồi!"
  ep3_camp_party.1025.b.success: "Những câu chuyện của Ngài được đón nhận nồng nhiệt"
  ep3_camp_party.1025.b.failure: "Ngài không chọn được một câu chuyện hay"
  ep3_camp_party.1025.c: "Ồ, nhắc mới nhớ. Ngươi có nghe chuyện này chưa..."
  ep3_camp_party.1025.c.tt: "Có lẽ nếu khéo léo, [friend.GetSheHe] sẽ không nhận ra mình đổi chủ đề..."

  ep3_camp_party.1030.t: "Khui Thùng Rượu"
  ep3_camp_party.1030.desc: "Giọt cuối cùng trong cốc của Ta cũng cạn. Ta quay đi tìm thêm, nhưng chỉ thấy vài người khác cũng lâm vào cảnh tương tự.\n\n\"Hết sạch rồi.\" [reveler.GetFirstName] lục lọi trong đống lương thực, chiếc đèn lồng soi sáng xung quanh. \"Chúng ta #EMP có thể#! khui thêm một thùng nữa, nhưng nếu không uống hết thì nó có thể hỏng mất...\""
  ep3_camp_party.1030.a: "Một thùng ư? Mở #EMP hai thùng!#!"
  ep3_camp_party.1030.b: "Sống thoáng chút đi, được chứ?"
  ep3_camp_party.1030.b.success: "Cuộc vui của Ngài được công nhận"
  ep3_camp_party.1030.c: "Không thể vì một đêm vui mà mất kiểm soát."

  ep3_camp_party.1035.t: "Thiếu Củi"
  ep3_camp_party.1035.desc: "Ta mải mê trò chuyện đến nỗi hầu như không nhận ra ánh sáng đang yếu dần. Chỉ khi ta gặp khó khăn trong việc nhận diện một người mới tham gia cuộc trò chuyện, ta mới nhìn về phía đống lửa.\n\nNhững tàn lửa của nó rực sáng một cách mờ nhạt, gần như đã tàn. [treefeller.GetFirstName] lắc cái đầu của [treefeller.GetHerHis] trước cái nhìn nhanh chóng của ta quanh trại.\n\n"Chúng ta đã dùng hết củi rồi. Cần phải kiếm thêm." [treefeller.GetSheHe|U] nhảy lên đôi chân của [treefeller.GetHerHis], chộp lấy một chiếc rìu gần đó và nhướng mày nhìn ta."
  ep3_camp_party.1035.a: "\"Khoan đã. Chúng ta còn mấy thùng và hòm cũ kia mà...\""
  ep3_camp_party.1035.a.success: "Ý tưởng của Ngài tỏ ra hiệu quả"
  ep3_camp_party.1035.b: "\"Được rồi, đưa đây cho ta.\""
  ep3_camp_party.1035.b.success: "Việc đốn cây diễn ra đúng kế hoạch"
  ep3_camp_party.1035.b.failure: "Ngài không tìm được cây phù hợp để đốn"
  ep3_camp_party.1035.b.critfailure: "Cây đổ theo một góc hết sức tai hại..."
  ep3_camp_party.1035.c: "\"Không kịp đốn cây đâu. Bứt mấy bụi kia lấy cành khô vậy.\""

  ep3_camp_party.1040.t: "Thương Nhân Lang Thang"
  ep3_camp_party.1040.desc: "Ồn ào nổi lên! Tai Ta dựng cả lên khi quay lại thấy vài thuộc hạ đang trò chuyện với một [merchant.GetWomanMan] đứng cạnh cỗ xe kéo bằng ngựa.\n\n\"Chỉ toàn hàng thượng hạng!\" [merchant.GetSheHe|U] rao lên với nụ cười ranh mãnh. \"Ta thấy và nghe cuộc vui của các vị từ xa, nên #EMP dĩ nhiên#! phải rẽ qua để cho các vị cơ hội sở hữu những món đồ tuyệt hảo này!\"\n\nTa tiến lại gần hơn, cố tập trung qua làn sương men say. Quả thật là… sáng loáng."
  ep3_camp_party.1040.a: "Ta muốn món lớn kia!"
  ep3_camp_party.1040.b: "Một món đồ lặt vặt cũng được."
  ep3_camp_party.1040.c: "Biến đi, đồ chớp thời cơ!"
  resplendent_armour_name: "Giáp Lộng Lẫy"
  resplendent_armour_desc: "Bộ giáp ấn tượng này lấp lánh khi ánh sáng chiếu vào, phản chiếu trên những hoa văn filigree tinh xảo được khảm khắp bề mặt. Chất liệu đã được Ta luyện mang lại khả năng bảo vệ tuyệt vời trước mọi kẻ tấn công."

  ep3_camp_party.2000.t: "Cuộc Trò Chuyện Trong Tầm Tay..."
  ep3_camp_party.2000.desc: "\"…và #EMP chính vì thế#! mà [ROOT.Char.Custom('GetFirstFollowerTraitMonologue')],\" [ROOT.Char.Custom2('RelationToMe', first_follower )] của Ta, [first_follower.GetFirstName], kết luận, khi [first_follower.GetSheHe] nhấp thêm một ngụm [first_follower.GetHerHis] từ cốc [ROOT.Char.Custom('RegionalDrink')].\n\nTa #EMP thực sự#! bị cuốn hút bởi chủ đề của [first_follower.GetFirstNamePossessiveNoTooltip], nhưng lại chần chừ khi vô tình nghe thấy [second_follower.GetFirstNamePossessive] thao thao về \"…việc [ROOT.Char.Custom('GetSecondFollowerTraitMonologue')].\"\n\nHơi căng thẳng, Ta cố quyết định nên tiếp lời cuộc trò chuyện nào:"
  ep3_camp_party.2000.a: "\"[first_follower.GetFirstNameNoTooltip], ngươi nghĩ sao về…\""
  ep3_camp_party.2000.b: "\"Một góc nhìn thú vị đấy, [second_follower.GetFirstNameNoTooltip]!\""
