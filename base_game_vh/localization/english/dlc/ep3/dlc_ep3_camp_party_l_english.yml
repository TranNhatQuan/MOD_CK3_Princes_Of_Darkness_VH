  camp_party_drinks_none_desc: "$EFFECT_LIST_BULLET$ Không có hiệu ứng bổ sung\n\n#weak Uống quá nhiều chỉ cản trở những cuộc trò chuyện thú vị!#!"
  camp_party_drinks_adequate: "Đồ uống vừa đủ"
  camp_party_drinks_adequate_desc: "#indent_newline:4 $EFFECT_LIST_BULLET$ Tất cả người tham dự tăng [opinion|E] về Ngài#!\n#indent_newline:4 $EFFECT_LIST_BULLET$ Nhận XP [trait|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]#!\n\n#weak Một chút đồ uống cũng đủ làm buổi hội hè thêm rộn ràng.#!"
  camp_party_drinks_adequate_invalid: "Ngài cần công trình [GetDomicileBuilding('mess_tent_01').GetName] [domicile_building|E]"

  camp_party_drinks_abundant: "Đồ uống dồi dào"
  camp_party_drinks_abundant_desc: "#indent_newline:4 $EFFECT_LIST_BULLET$ Tất cả người tham dự tăng [opinion|E] về Ngài#!\n#indent_newline:4 $EFFECT_LIST_BULLET$ Nhận XP [trait|E] [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]#!\n#indent_newline:4 $EFFECT_LIST_BULLET$ Nhận [GetModifier( 'ep3_master_of_ceremonies' ).GetNameWithTooltip|L] khi kết thúc $activity_camp_party$#!\n\n#weak Không một người đàn ông, phụ nữ hay đứa trẻ nào phải khát nước trong buổi hội hè này!#!"
