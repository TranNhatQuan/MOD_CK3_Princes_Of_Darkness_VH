  activity_camp_party_special_type_bar_segment_tt_0: "#t Sôi nổi#!\n#ts Điểm: [ActivityWindow.GetSpecialProgressValue|0V]/#V 25#!#!\n$EFFECT_LIST_BULLET$Tất cả những người tham dự giảm [stress|E]\n$EFFECT_LIST_BULLET$Giảm chi phí [provisions_i][provisions|E] từ [GetDecisionWithKey('visit_local_settlement_decision').GetName] trong #value 1#! năm"
  activity_camp_party_special_type_bar_segment_tt_1: "#t Vui vẻ#!\n#ts Điểm: [ActivityWindow.GetSpecialProgressValue|0V]/#V 50#!#!\n$EFFECT_LIST_BULLET$Tất cả những người tham dự giảm [stress|E]\n$EFFECT_LIST_BULLET$Ngài nhận được một lượng #positive_value nhỏ#! [provisions_i][provisions|E]\n$EFFECT_LIST_BULLET$Tuyển dụng tốt hơn từ [GetDecisionWithKey('visit_local_settlement_decision').GetName] trong #value 1#! năm\n$EFFECT_LIST_BULLET$Ngài nhận được [lifestyle_experience|E]"
  activity_camp_party_special_type_bar_segment_tt_2: "#t Hân hoan#!\n#ts Điểm: [ActivityWindow.GetSpecialProgressValue|0V]/#V 75#!#!\n$EFFECT_LIST_BULLET$Tất cả những người tham dự giảm [stress|E]\n$EFFECT_LIST_BULLET$Ngài nhận được một lượng #positive_value trung bình#! [provisions_i][provisions|E]\n$EFFECT_LIST_BULLET$Tuyển dụng tốt hơn từ [GetDecisionWithKey('visit_local_settlement_decision').GetName] trong #value 1#! năm\n$EFFECT_LIST_BULLET$Ngài nhận được [lifestyle_experience|E]\n$EFFECT_LIST_BULLET$Ngài nhận được một [task_contract|E] mới"
  activity_camp_party_special_type_bar_segment_tt_3: "#t Tưng bừng#!\n#ts Điểm: [ActivityWindow.GetSpecialProgressValue|0V]/#V 100#!#!\n$EFFECT_LIST_BULLET$Tất cả những người tham dự giảm [stress|E]\n$EFFECT_LIST_BULLET$Ngài nhận được một lượng #positive_value lớn#! [provisions_i][provisions|E]\n$EFFECT_LIST_BULLET$Tuyển dụng tốt hơn từ [GetDecisionWithKey('visit_local_settlement_decision').GetName] trong #value 1#! năm\n$EFFECT_LIST_BULLET$Ngài nhận được [lifestyle_experience|E]\n$EFFECT_LIST_BULLET$Ngài nhận được #value 2#! [task_contracts|E] mới\n$EFFECT_LIST_BULLET$$activity_camp_party_reward_upgrade_building$"
