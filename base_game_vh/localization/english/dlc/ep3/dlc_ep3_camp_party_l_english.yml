  ep3_fireside_chat_modifier_1: "Trò Chuyện Bên Đống Lửa: Suối Nguồn Trí Tuệ"
  ep3_fireside_chat_modifier_1_desc: "Nhân vật này đã học hỏi được rất nhiều từ những câu chuyện được chia sẻ quanh đống lửa trại rực cháy"
