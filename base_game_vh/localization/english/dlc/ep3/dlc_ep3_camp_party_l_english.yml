  ep3_camp_party.2000.callous: "con người ngày nay thật #EMP nhạy cảm#!"
  ep3_camp_party.2000.sadistic: "đau đớn thể xác #EMP có thể#! uốn nắn một đối tượng trở nên hữu dụng hơn"
  ep3_camp_party.2000.zealous: "kế hoạch thiêng liêng #EMP sẽ#! dẫn dắt con đường của chúng ta, nếu ta chịu khuất phục"
  ep3_camp_party.2000.craven: "thế giới gần đây trở nên #EMP nguy hiểm#! hơn nhiều"
  ep3_camp_party.2000.forgiving: "khái niệm quay má còn lại tồn tại trong #EMP hơn#! một tôn giáo"
  ep3_camp_party.2000.compassionate: "giúp đỡ kẻ khốn khó #EMP tự nó#! đã là phần thưởng"
  ep3_camp_party.2000.gregarious: "những cuộc vui #EMP thật#! thư giãn, và đơn giản tận hưởng sự đồng hành của người khác là điều #EMP có lợi#!"
  ep3_camp_party.2000.paranoid: "mọi thứ #EMP đều#! liên kết với nhau; như hạn hán năm ngoái liên quan đến việc hầu như chẳng con gà nào đẻ trứng mỗi ngày!"
  ep3_camp_party.2000.eccentric: "mặt trăng tối nay có cục ghèn trong mũi [dummy_gender.GetHerHis]"
  ep3_camp_party.2000.brave: "chinh phục nỗi sợ là điều #EMP quan trọng nhất#! trong đời"
  ep3_camp_party.2000.just: "chúng ta #EMP cần#! tuân theo luật lệ địa phương, không như lũ #EMP man rợ#!"
  ep3_camp_party.2000.lazy: "người ta #EMP chuẩn bị#! tốt hơn cho gian khổ nếu được nghỉ ngơi thật nhiều"
  ep3_camp_party.2000.arrogant: "người đời dạo này thật #EMP ngu muội#!"
  ep3_camp_party.2000.fickle: "thật khó để #EMP có lẽ đôi khi#! quyết định cho xong"
  ep3_camp_party.2000.diligent: "hoàn thành trọn vẹn mọi công việc thật #EMP thỏa mãn#!"
  ep3_camp_party.2000.lustful: "thỉnh thoảng buông mình theo #EMP cám dỗ#! đơn giản là điều lành mạnh"
  ep3_camp_party.2000.chaste: "chúng ta #EMP cao thượng#! hơn loài thú bẩn thỉu, đủ sức kìm hãm dục vọng theo ý muốn"
  ep3_camp_party.2000.greedy: "giá [ROOT.Char.Custom('RegionalRootVegetablePlural')] gần đây #EMP đắt đỏ#! khủng khiếp"
  ep3_camp_party.2000.generous: "thật dễ chịu khi #EMP chia sẻ#! dù chỉ chút tài sản ít ỏi với người khác"
  ep3_camp_party.2000.humble: "người ta #EMP không nên#! tự tô vẽ mình thành thứ không phải"
  ep3_camp_party.2000.temperate: "thật đáng giá khi #EMP không#! đi ngủ với cái bụng căng đầy"
  ep3_camp_party.2000.gluttonous: "chúng ta nên #EMP tận hưởng#! thức ăn ngon bất cứ khi nào có cơ hội"
  ep3_camp_party.2000.wrathful: "những kẻ #EMP nhất quyết không chịu hiểu#! đơn giản là #EMP lũ ngu#!"
  ep3_camp_party.2000.patient: "chỉ cần #EMP ngồi#! lại một chút, ngẫm nghĩ về xung quanh cũng thấy dễ chịu"
  ep3_camp_party.2000.impatient: "lấy được một ly uống ở đây #EMP mất mẹ nó quá lâu#!"
  ep3_camp_party.2000.calm: "vấn đề #EMP dễ#! giải quyết hơn khi giữ được sự điềm tĩnh"
  ep3_camp_party.2000.deceitful: "#EMP vài#! người cho rằng [other_follower.GetFirstName] khá là [other_follower.Custom('quirk_neg_adjective')], nhưng #EMP ta#! luôn thấy [other_follower.GetHerHim] chỉ là [other_follower.Custom('quirk_pos_adjective')] thôi"
  ep3_camp_party.2000.honest: "nỗ lực #EMP bỏ ra#! cho món đầu tiên thật đáng khen, nhưng nó không #EMP thực sự#! ngon"
  ep3_camp_party.2000.shy: "rụt rè chỉ là dấu hiệu của #EMP trí tuệ#!, #EMP không#! phải thấp kém"
  ep3_camp_party.2000.ambitious: "chỉ có lao động cật lực mới đưa ngươi #EMP đi tới#! trong đời"
  ep3_camp_party.2000.content: "cuộc vui đến giờ khá ổn, chẳng có gì đáng phàn nàn"
  ep3_camp_party.2000.arbitrary: "#EMP bốc đồng và linh cảm#! là bí quyết của cuộc sống an yên"
  ep3_camp_party.2000.trusting: "chúng ta cần tin rằng người khác sẽ #EMP quan tâm#! đến đồng loại"
  ep3_camp_party.2000.stubborn: "ngươi #EMP nhất quyết#! phải theo đuổi những gì xứng đáng"
  ep3_camp_party.2000.vengeful: "#EMP trả thù#! là món ăn ngon nhất khi được dọn lạnh"

