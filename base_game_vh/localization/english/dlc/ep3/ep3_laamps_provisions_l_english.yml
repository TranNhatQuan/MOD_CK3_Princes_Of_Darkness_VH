l_english:

  ep3_laamps_provisions.1000.t: "Cắt Khẩu Phần"
  ep3_laamps_provisions.1000.desc: "\"[concerned.Custom2('RelationToMeShort', ROOT.Char)|U],\" [concerned.GetFirstName] mở lời, \"Ta để ý thấy rằng chúng ta đã dùng gần hết một nửa lương thực rồi...\"\n\n\"Chẳng phải chúng ta nên bắt đầu giảm khẩu phần — hoặc tốt hơn nữa — lên kế hoạch dừng lại để tiếp tế sao? Chưa phải khẩn cấp, nhưng những tình huống kiểu này chỉ cần một chút chậm trễ là có thể trở nên tồi tệ rất nhanh. Chỉ cần chần chừ thôi, và chúng ta có thể bị buộc phải ăn cả đế ủng của mình!\""
  ep3_laamps_provisions.1000.a: "Thôi lo xa đi, mọi thứ sẽ ổn!"
  ep3_laamps_provisions.1000.b: "Cứ mua cho mình món gì ngon ở thị trấn kế tiếp!"
  ep3_laamps_provisions.1010.t: "Binh Sĩ Đào Ngũ Vì Đói"
  ep3_laamps_provisions.1010.desc: "Sáng nay, lại có thêm một nhóm binh sĩ biến mất.\n\nXu hướng này đã kéo dài nhiều ngày, và Ta buộc phải thừa nhận rằng họ không phải chỉ đi lạc khi tuần tra, hay bị thú dữ tấn công lúc canh gác. Họ đang đào ngũ.\n\nTa thừa nhận rằng tình hình rất tệ: thức ăn và nước uống đang cạn dần, và ngày phát lương có thể còn lâu mới tới. Nhưng dù vậy, Ta không thể dung thứ cho sự hèn nhát này!"
  ep3_laamps_provisions.1010.a: "Đồ hèn!"
  ep3_laamps_provisions.1020.t: "Kẻ Bỏ Cuộc"
  ep3_laamps_provisions.1020.desc: "\"#EMP Ta không chịu nổi nữa rồi!#!\"\n\nKhi Ta lờ đờ chui ra khỏi lều, Ta thấy một [leaver.GetTitledFirstName] giận dữ đang gào thét, lôi theo một túi đồ nhỏ với vài món hành lý ít ỏi của [leaver.GetHerHis] ra khỏi trại.\n\n\"Ta chẳng còn cảm giác ở chân nữa, lưng thì lúc nào cũng đau, và Ta không nhớ nổi lần cuối mình được ăn một bữa nóng là khi nào! Hay một bữa no! Hay thậm chí là một bữa ăn đúng nghĩa! #EMP Nguyền rủa ngươi, tên khốn [ROOT.Char.GetFirstNameNoTooltip]!#!\""
  ep3_laamps_provisions.1020.a: "Cút đi, đồ hèn!"
  ep3_laamps_provisions.1025.t: "Không Đáng Để Tiếp Tục"
  ep3_laamps_provisions.1025.desc: "\"Ta đã #EMP thực sự#! cố gắng ủng hộ ngài, [ROOT.Char.GetFirstNameNoTooltip], Ta đã cố hết sức, nhưng chuyện này đã đi quá xa rồi!\" [leaver.Custom2('MyCharacterIntroduction', ROOT.Char)] nói, nước mắt uất ức trào ra trong mắt [leaver.GetHerHis] và ánh nhìn đầy sát khí hiện rõ trên khuôn mặt [leaver.GetHerHis].\n\n\"Ngài sẽ dẫn tất cả chúng ta tới cái chết! Chỉ vì tham vọng ngớ ngẩn và sự keo kiệt lố bịch của ngài! Nhưng Ta sẽ không theo ngài xuống mồ sớm đâu! Ta đi đây. NGAY BÂY GIỜ!\""
  ep3_laamps_provisions.1025.a: "Tạm biệt."
  ep3_laamps_provisions.1030.t: "Binh Sĩ Chết Đói"
  ep3_laamps_provisions.1030.desc: "Một số binh sĩ của Ta vẫn tiếp tục đào ngũ; nhưng phần lớn thậm chí còn không đủ sức để rời đi.\n\nNgày qua ngày, số lượng người theo Ta cứ giảm dần, khi đói khát, khát nước và đủ thứ bệnh tật lần lượt quật ngã họ."
  ep3_laamps_provisions.1030.a: "Dẫu vậy, chúng ta vẫn tiếp tục hành quân."
  ep3_laamps_provisions.1040.t: "Thể Xác Suy Kiệt"
  ep3_laamps_provisions.1040.desc: "Một cơn ho dai dẳng làm rung chuyển cơ thể Ta. Một ít nước có thể giúp ích, nhưng nó đã cạn từ hôm qua. Tay Ta run rẩy, và có lẽ Ta đang sốt.\n\nTa cảm thấy yếu ớt và bệnh tật — một tình trạng mà Ta dường như đang chia sẻ với rất nhiều người theo mình.\n\nChúng ta cần tích trữ lương thực, và phải làm điều đó #EMP ngay bây giờ#!, trước khi quá muộn."
  ep3_laamps_provisions.1040.a: "Ta chỉ quá kiệt sức mà thôi..."
  ep3_laamps_provisions.1050.t: "Cái Chạm Của Tử Thần"
  ep3_laamps_provisions.1050.desc_pet_horse: "Tội nghiệp [ROOT.Char.Custom( 'WarhorseStoryName' )] của ta!\n\nNhững gian khổ của hành trình này đã quá sức chịu đựng, ngay cả với một chiến mã hùng mạnh như vậy..."
  ep3_laamps_provisions.1050.desc_pet_dog: "Tội nghiệp [ROOT.Char.Custom( 'DogStoryName' )] của ta!\n\nNhững gian khổ của hành trình này đã quá sức chịu đựng, ngay cả với một chú chó dũng cảm như vậy..."
  ep3_laamps_provisions.1050.desc_pet_cat: "Tội nghiệp [ROOT.Char.Custom( 'CatStoryName' )] của ta!\n\nNhững gian khổ của hành trình này đã quá sức chịu đựng đối với một chú mèo con bé nhỏ..."
  ep3_laamps_provisions.1050.desc_pet_no: "Thật là một bi kịch!"
  ep3_laamps_provisions.1050.desc_pet: "Ta sẽ mãi nhớ ánh mắt thông minh từng mỉm cười với ta trong những ngày tươi đẹp hơn; nhưng giờ đây, thứ duy nhất ta còn thấy là ánh nhìn đã mất đi thần sắc, mờ đục vì đau đớn và buồn bã, khi ngươi ngẩng đầu nhìn ta lần cuối.\n\nMong [ROOT.Char.GetFaith.HighGodName] tha thứ cho sự ngu xuẩn đã đưa chúng ta tới bước đường này. Ta thì không nghĩ mình có thể."
  ep3_laamps_provisions.1050.desc_follower: "\n\nGia súc của chúng ta chết rụng như ruồi, binh sĩ gục ngã ven đường, và giờ thì chuyện này; [ROOT.Char.GetFaith.DeathDeityName] đã ghé thăm trại của ta và mang [dead.Custom2('MyCharacterIntroduction', ROOT.Char)] đi! Cái giá phải trả cho mọi gian khổ của chuyến hành trình sai lầm này đã vượt quá sức chịu đựng của [dead.GetHerHim]...\n\nCái chết này đè nặng lên lương tâm ta."
  ep3_laamps_provisions.1050.a: "Tạm biệt, Ngài hiền."
  ep3_laamps_provisions.1050.a_tt: "Thú cưng của Ngài đã chết"
  ep3_laamps_provisions.1050.a_1: "[dead.GetSheHe|U] không đáng phải chịu điều này."
  ep3_laamps_provisions.1050.b: "Ít nhất thì ta cũng có thêm chút thịt tươi!"
  ep3_laamps_provisions.1050.c: "Rốt cuộc thì... tại sao không chứ...?"
  ep3_laamps_provisions.1050.d: "Ta xin lỗi... ta thực sự, thực sự #EMP xin lỗi#!..."
  ep3_laamps_provisions.1050.d.tt: "Ngài ăn xác thú cưng đáng thương của mình"
  ep3_laamps_provisions.1060.t: "Không Khí Ô Nhiễm"
  ep3_laamps_provisions.1060.desc: "Sự im lặng nặng nề bao trùm trại của ta hôm nay, chỉ bị phá vỡ bởi những tiếng rên rỉ yếu ớt của người bệnh.\n\nTrong đêm, nhiều người theo ta bắt đầu xuất hiện triệu chứng của một căn bệnh nào đó. Đến sáng, nó đã trông như một trận dịch thực sự. Mọi người, vốn đã suy yếu vì cuộc hành quân dài ngày và thiếu thốn thức ăn nước uống, giờ đây gần như không đủ sức để đứng vững, chứ đừng nói là đi lại.\n\nNếu ta muốn cứu được bất kỳ ai, chúng ta phải dừng lại ngay bây giờ."
  ep3_laamps_provisions.1060.a: "Ta phải làm gì đây?"
  ep3_laamps_provisions.1070.t: "Ta Có Thấy Ánh Sáng Không?"
  ep3_laamps_provisions.1070.desc: "Ta không nhớ nổi lần cuối mình ăn là khi nào.\n\nCổ họng ta khô khốc như giấy da.\n\nMọi thứ #EMP đều đau đớn#!.\n\nTa thậm chí không còn nhớ mình đang đi đâu, chỉ biết rằng ta phải tiếp tục bước đi.\n\nTa không muốn đi nữa, ta chỉ muốn tất cả chuyện này #EMP kết thúc...#!"
  ep3_laamps_provisions.1070.a: "Ta không thể... tiếp tục nữa..."
  ep3_laamps_provisions.1070.a1: "Ngài chết đói"
  ep3_laamps_provisions.1070.a2: "Dạ dày của Ngài bị tổn thương vĩnh viễn"
  ep3_laamps_provisions.1070.a3: "Sức lực rời bỏ Ngài"
  ep3_laamps_provisions.1070.a4: "Sự tuyệt vọng đẩy Ngài tới một bữa ăn ô uế"
  ep3_laamps_provisions.1070.a5: "Ngài lâm bệnh"
  ep3_laamps_provisions.1070.a6: "Một điều gì đó trong tâm trí Ngài vỡ vụn"
  ep3_laamps_provisions.1070.a7: "Ánh sáng trong mắt Ngài tắt lịm"
  ep3_laamps_provisions.1070.a8: "Cơ thể Ngài bị suy nhược vĩnh viễn"
  ep3_laamps_provisions.1070.tt: "Chết Đói"
  weak_stomach_modifier: "Dạ Dày Yếu"
  weak_stomach_modifier_desc: "Sau khi sống sót một thời gian dài với rất ít hoặc không có thức ăn, dạ dày của nhân vật này không còn chịu nổi những bữa ăn lớn hay cầu kỳ nữa, khiến họ rất dễ lâm bệnh."
  hunger_sickness_modifier: "Bệnh Suy Kiệt Vì Đói"
  hunger_sickness_modifier_desc: "Kể từ khi suýt chết đói, nhân vật này không còn như trước nữa: da dẻ đầy vết lở loét, còn thể xác và tinh thần thì suy yếu đi rõ rệt."
  every_follower_custom: "Mỗi [follower|E]"
  starving_opinion: "Cứ Để Ta Chết Đói"
  every_maa_regiment_custom: "Mỗi trung đoàn [men_at_arms|E]"
  ep3_laamps_provisions.1080.t: "Túi Trống Rỗng, Bụng Đói Meo"
  ep3_laamps_provisions.1080.desc_companion: "\"Ta hiểu sự nôn nóng của ngài — tin ta đi, #EMP ta thật sự hiểu#!! Nhưng ta cầu xin ngài hãy suy nghĩ lại.\" Đôi mắt [complainer.GetFirstNamePossessive] trũng sâu và buồn bã khi [complainer.GetSheHe] nhìn thẳng vào ta.\n\n\"Làm ơn, đừng cố chấp nữa. Chúng ta đã hoàn toàn cạn kiệt thức ăn và nước sạch; nếu không dừng lại ngay để nghỉ ngơi và tiếp tế lương thực, chúng ta sẽ chỉ hành quân thẳng tới cái chết!\""
  ep3_laamps_provisions.1080.desc_alone: "Ta thực sự đã nghĩ rằng mình có thể làm được. Đó là một canh bạc khá liều, nhưng ta không ngờ mọi thứ lại trở nên tồi tệ nhanh đến vậy.\n\nGiờ đây ta bị mắc kẹt, không có chút lương thực nào để tiếp tục cuộc hành quân, đói khát, khô cổ và yếu ớt đến cùng cực.\n\nMục tiêu mỗi lúc một gần hơn sau từng bước chân, nhưng lần đầu tiên ta cảm thấy nỗi nghi ngờ gặm nhấm rằng mình có thể sẽ không bao giờ đến đó được."
  ep3_laamps_provisions.1080.a: "Dù vậy, chúng ta vẫn phải tiến lên."
  ep3_laamps_provisions.1080.b: "Chúng ta cần nghỉ ngơi trước khi quá muộn."
  ep3_laamps_provisions.1080.sea: "Ngài đang ở trên biển, không có nơi nào để nghỉ ngơi ngoài chính con tàu của mình!"
  ep3_laamps_provisions.1080.c: "Đặt lộ trình vào đất liền, #EMP ngay bây giờ#!!"
  ep3_laamps_provisions.1080.c.tt: "[travel|E] của Ngài sẽ bị hủy và chuyển hướng tới [landfall.GetBaronyNameExplicitly] ([landfall.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetName])"

  critically_low_provisions_alert: "Lương Thực Cực Kỳ Cạn Kiệt"
  critically_low_provisions_alert_desc: "[provisions|E] của Ngài sắp cạn rồi!"
