l_english:

  ep3_frankokratia_events.0001.t: "Cuộc Tước đoạt Bất công"

  ep3_frankokratia_events.0001.crusader_intro: "Chúng ta, những người hành hương có vũ trang tới miền đất hải ngoại, đã ký hợp đồng với [financier.GetPrimaryTitle.GetNameNoTier] để đóng tàu cho mình... một công cuộc vô cùng tốn kém, và gắn liền với một sự nghiệp đầy bất định."
  ep3_frankokratia_events.0001.non_crusader_intro: "Tin tức về cuộc Thập tự chinh đã lan đến. Những người đã tuyên thệ tham gia đã ký hợp đồng với [financier.GetPrimaryTitle.GetNameNoTier] để đóng tàu cho họ... một công cuộc vô cùng tốn kém, và gắn liền với một sự nghiệp đầy bất định."
  ep3_frankokratia_events.0001.desc: "\n\n\"Một sự lãng phí khủng khiếp!\" [byz_claimant.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('byz_claimant'))] của ta, than thở. \"Những hiệp sĩ Latinh dũng cảm nhất bị làm cho khánh kiệt — bị bắt phải chịu khổ trước lũ ngoại đạo! Giá như người [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] chịu giúp đỡ họ...\"\n\nVới tư cách là một kẻ đòi ngôi [byz_emperor.GetPrimaryTitle.GetAdjective], [byz_claimant.GetFirstNameNoTooltip] cố ý nhấn mạnh tới #EMP Romaioi#!. Có lẽ... nếu các Thập tự quân của chúng ta tiến quân nhân danh [byz_claimant.GetHerHis], thì chính nghĩa của họ có thể được củng cố bằng binh sĩ Hy Lạp và những món quà đế vương xa hoa? Liệu một cuộc Thập tự chinh dị thường như vậy có thể phục vụ sứ mệnh của Đấng Christ tốt hơn... và các chiến binh Kitô giáo của Người chăng?"
  ep3_frankokratia_events.0001.a: "Một kế hoạch khôn ngoan! Giáo hoàng chắc chắn sẽ ban phúc."
  ep3_frankokratia_events.0001.a.flavor: "Những Kitô hữu này dám thách thức thẩm quyền của Đức Thánh Cha! Dùng chính những người hành hương của ta chống lại họ... liệu có sai trái gì không?"
  ep3_frankokratia_events.0001.b: "Ta sẽ khiến các Thập tự quân thề trung thành trực tiếp với chính nghĩa này."
  ep3_frankokratia_events.0001.b.flavor: "Những người lãnh đạo quân đội của Chúa có thể tự đưa ra quyết định. Chính họ — chứ không phải Giáo hoàng — sẽ là những kẻ đầu tiên đặt chân lên đất Byzantium."
  ep3_frankokratia_events.0001.c: "Một ý tưởng ngu xuẩn dẫn tới thảm họa."
  ep3_frankokratia_events.0001.c.flavor: "Khó có thể tưởng tượng nổi một sự phản bội nào vô đạo hơn thế!"
  abandon_crusade_tooltip: "@alert_icon! #alert_trial Khi [great_holy_war|E] bắt đầu, Ngài và các Kẻ Tấn công tự nguyện khác sẽ bị loại khỏi cuộc chiến#!"
  byz_claimant_crusade_tooltip: "@warning_icon! #X Ngài sẽ dẫn đầu một #high $CRUSADING_CLAIM_CB_NAME$#! chống lại [byz_emperor.GetShortUIName], nhân danh [byz_claimant.GetShortUIName]#!"
  may_form_latin_empire_tooltip: "Ngài có thể tạo ra #high [GetTitleByKey('e_latin_empire').GetName|U]#!"
  crusaders_may_be_paid_tooltip: "Ngài có thể được thưởng @gold_icon![gold|E], @piety_icon![piety|E] và [special_troops|E]"
  more_crusaders_will_join_tooltip: "#P Nhiều Kẻ Tấn công của [great_holy_war|E] hơn sẽ tham gia [war|E] của Ngài#!"
  fewer_crusaders_will_join_tooltip: "@warning_icon! #X Ít Kẻ Tấn công của [great_holy_war|E] hơn sẽ tham gia [war|E] của Ngài#!"

  ep3_frankokratia_events.0001.a.crit_success: "[ghw_sponsor.GetTitledFirstNameNoTooltip] ban phúc cho kế hoạch khôn ngoan của Ngài"
  ep3_frankokratia_events.0001.a.success: "[ghw_sponsor.GetTitledFirstNameNoTooltip] chấp thuận, nhằm hàn gắn Ly giáo"
  ep3_frankokratia_events.0001.a.failure: "[ghw_sponsor.GetTitledFirstNameNoTooltip] lên án âm mưu nguy hiểm của Ngài"
  set_byz_state_faith_to_catholic_tooltip: "[byz_claimant.GetShortUIName] sẽ đổi [faith|E] quốc giáo của [byz_emperor.GetPrimaryTitle.GetAdjective] sang [byz_claimant_champion.GetFaith.GetName]"

  eager_for_empire_modifier: "Khát vọng Đế chế"
  eager_for_empire_modifier_desc: "Kẻ tranh ngôi này được tiếp thêm khí thế bởi những giấc mơ về uy quyền hoàng đế Byzantine; được cường hóa bằng niềm tin mãnh liệt, và được các ân nhân bảo vệ chặt chẽ."

  prepared_for_daring_deeds_modifier: "Chuẩn bị cho Viễn chinh Táo bạo"
  prepared_for_daring_deeds_modifier_desc: "Nhân vật này đang dẫn dắt một sự nghiệp vĩ đại nhưng đầy rủi ro: hứa hẹn phần thưởng phong phú, song chỉ có thể thành công nhờ sự chuẩn bị cẩn trọng."

  ep3_frankokratia_events.0002.opening: "[ROOT.Char.Custom('GetDaughterSon')] táo bạo nhất của Chúa,"
  ep3_frankokratia_events.0002.desc_condemns: "Ngươi thực sự dám — rút thanh kiếm của Gabriel khỏi sự trông nom của Thánh Phêrô hay sao? Ngươi, kẻ thiếu vắng tình con thảo và lòng mộ đạo Kitô giáo, lại dám đâm lưỡi kiếm chí thánh ấy vào lồng ngực những người anh em Hy Lạp của mình ư?\n\nĐó là một điều ghê tởm mà ngươi đang cân nhắc. Không một Kitô hữu nào được phép bị tổn hại bởi tay những người hành hương."
  ep3_frankokratia_events.0002.desc_endorses: "Với lòng kiêu ngạo tội lỗi, các giáo sĩ Hy Lạp khinh miệt vị đại diện được Chúa chọn trên Trần thế. Vì thế, nhân danh thiêng liêng của Người, ta truyền cho ngươi tập hợp binh sĩ của Người dưới trướng ngươi, giành lấy chiến thắng, và lập nên một vị quân vương mới, công chính ở phương Đông.\n\nNếu Chúa muốn, nhờ nỗ lực của ngươi, các tín hữu rồi sẽ có ngày giành quyền trên toàn bộ những miền đất hải ngoại."
  ep3_frankokratia_events.0002.desc_wasnt_asked: "Chúa trừng phạt những kẻ, như Lucifer, dám mưu cầu các vương quốc và đế chế thuộc ánh sáng của Người — nhưng Người lại ban thưởng cho kẻ kiên định. Điều đã khởi sự giữa các Thập tự quân của Người, ta sẽ không đảo ngược.\n\nNhưng ngươi sẽ phải trông cậy vào sự xá giải thánh thiêng cho việc đổ máu Kitô hữu. Hãy tiến bước một cách khôn ngoan và cao thượng phụng sự Đấng Christ, và ngươi có thể nhận được điều đó; hãy cầu nguyện khi đứng trước người Hy Lạp."
  ep3_frankokratia_events.0002.a: "Vậy thì... ta sẽ tiến về Byzantium!"
  ep3_frankokratia_events.0002.b: "Con sám hối, thưa Đức Thánh Cha! #EMP Con hối hận vì sự điên rồ của mình!#!"
  continue_frankokratia_crusade_tooltip: "Ngài tiếp tục chuyển hướng các Thập tự quân về phía [byz_emperor.GetPrimaryTitle.GetNameNoTier]"
  end_frankokratia_crusade_war_tooltip: "@alert_icon! #alert_trial Ngài sẽ không tấn công [byz_emperor.GetPrimaryTitle.GetNameNoTier] hay chuyển hướng bất kỳ Thập tự quân nào#!"

  ep3_frankokratia_events.0003.opening: "Kẻ thù của [byz_emperor.GetTitleAsNameNoTooltip],"
  ep3_frankokratia_events.0003.desc: "Những kẻ mang thánh giá có trong tay nhiều chiến thuyền mới đóng của [financier.GetPrimaryTitle.GetAdjective] — nhưng họ không thể gánh nổi chi phí ấy. Ta đã thuyết phục Hội đồng tìm kiếm sự đền bù bằng những con đường khác.\n\nHãy cam kết bồi thường cho chúng ta từ quốc khố đế quốc hoặc bằng lãnh thổ hoàng gia. Nếu ngươi làm vậy, tàu thuyền của chúng ta sẽ chở các $knight_culture_player_plural_no_tooltip_lowercase$ của ngươi vượt biển. Những thủy binh dũng cảm của ta sẽ trèo lên tường thành của kẻ thù ngươi. Người Hy Lạp sớm muộn cũng sẽ hối hận vì sự khinh miệt dành cho chúng ta!"
  ep3_frankokratia_events.0003.a: "Lời thề của chúng ta đổi lấy lời thề của các ngươi, cứ thế mà làm."
  will_give_byz_lands_tooltip: "Nếu [byz_emperor.GetShortUIName] không đủ @gold_icon![gold|E], [financier.GetShortUIName] sẽ giành được một [title|E] từ [byz_emperor.GetPrimaryTitle.GetNameNoTier]"
  financier_will_join_claim_war_tooltip: "[financier.GetShortUIName] sẽ tham gia #high $CRUSADING_CLAIM_CB_NAME$#! của Ngài chống lại [byz_emperor.GetShortUIName]"
  every_ally_will_gain_modifier_tooltip: "Ngài và các Kẻ Tấn công khác trong [war|E] sẽ nhận được [GetModifier( 'grand_crusader_fleet_modifier' ).GetNameWithTooltip|L]"
  grand_crusader_fleet_modifier: "Hạm đội Thập tự Vĩ đại"
  grand_crusader_fleet_modifier_desc: "Một hạm đội khổng lồ gồm các tàu vận tải và chiến thuyền mới được đóng, đưa quân đội của nhân vật này tới những miền đất xa xôi."

  ep3_frankokratia_events.0004.t: "Sự Kiêu ngạo của Phương Tây"
  ep3_frankokratia_events.0004.desc: "Gián điệp của ta trong hàng ngũ người Latinh mang về những tin tức kỳ quái... nếu ta không quá rành rẽ mọi kiểu tham lam khác của [financier.GetPrimaryTitle.GetAdjective], hẳn ta đã nghĩ mình bị lừa!\n\nTrong khi [byz_claimant_champion.GetFaith.GetAdherentNamePlural] lại một lần nữa xuất quân chống lũ ngoại đạo, thì một khối đông đảo những người hành hương có vũ trang của họ lại thề sẽ kéo đến #EMP đây#!. Dưới sự dẫn dắt của [byz_claimant_champion.GetName] và [financier.GetTitledFirstName], họ tôn xưng [byz_claimant.GetName], kẻ ăn mày đáng thương ấy, là người cai trị chính thống của [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )]!\n\nChẳng bao lâu nữa, bọn cuồng tín ấy sẽ chết ngoài tường thành của ta vì chính nghĩa yếu ớt của [byz_claimant.GetHerHis]! Làm sao chúng có thể nghĩ tới việc tấn công chính những Kitô hữu đồng đạo của mình chứ?"
  ep3_frankokratia_events.0004.a: "Có lẽ... [byz_claimant.GetFirstNameNoTooltip] cần phải chết."
  ep3_frankokratia_events.0004.a.flavor: "Một vụ ám sát tàn bạo có thể khiến chúng tỉnh ngộ chăng? Ít nhất, nó sẽ khiến người Latinh không còn lý do gì để tấn công chúng ta."
  ep3_frankokratia_events.0004.b: "[ROOT.Char.GetFaith.HighGodName] đã chọn ta. [ROOT.Char.GetFaith.HighGodName] sẽ bảo vệ ta."
  ep3_frankokratia_events.0004.b.flavor: "Trong khi đó, các Giám mục ở Rome ngày càng say sưa với những điều dối trá của chính mình... và nghiêm trọng đánh lạc hướng bầy tín đồ man rợ của họ."

  abandon_crusade_emp_tooltip: "@alert_icon! #alert_trial Khi [GetFaithByKey('catholic').GetAdherentName|U] phát động [great_holy_war|E], các Kẻ Tấn công liên quan sẽ bị loại khỏi cuộc chiến#!"
  franko_emp_crusade_tooltip: "@warning_icon! #X [byz_claimant_champion.GetShortUIName] sẽ dẫn đầu một #high $CRUSADING_CLAIM_CB_NAME$#! chống lại [byz_emperor.GetShortUIName], nhân danh [byz_claimant.GetShortUIName]#!"
  byz_empire__destroyed_tooltip: "@warning_icon! #X [GetTitleByKey('e_byzantium').GetName|U] thậm chí có thể bị tiêu diệt!#!"

  ep3_frankokratia_events.0005.opening: "Đứa con bất tuân của ta,"
  ep3_frankokratia_events.0005.desc: "Ngươi không còn có thể hy vọng khoác lên mình kẻ tranh ngôi [claimant.GetName] sắc tím hoàng đế nữa.\n\nHãy thôi mơ về những xa hoa Hy Lạp. Hãy thôi sống trong phản nghịch, mà tìm kiếm sự sám hối. Chính nghĩa từng đẩy ngươi rời xa sứ mệnh thánh thiêng của Chúa nay đã kết thúc một cách thích đáng, dù chẳng long trọng."
  ep3_frankokratia_events.0005.a: "[ROOT.Char.GetFaith.HighGodName] hẳn phải yêu mến tên bạo chúa của người Hy Lạp..."
  frankokratia_story_ends_tooltip: "Cuộc tấn công của các Thập tự quân [GetFaithByKey('catholic').GetAdjective] nhằm vào [GetTitleByKey('e_byzantium').GetName|U] đã bị hủy bỏ"

  ep3_frankokratia_events.0020.t: "Chống lại Kẻ Lạc lối"
  ep3_frankokratia_events.0020.desc: "Bất hòa lan rộng trong hàng ngũ các chiến binh của Đấng Christ... bởi lũ ngoại đạo hùng mạnh, hành trình vượt Địa Trung Hải sẽ khiến chúng ta tổn thất nặng nề, và thợ đóng tàu [financier.GetName] là một chủ nợ tàn nhẫn và xảo quyệt.\n\n[redirecter.GetName] trình bày một sự nghiệp hoàn toàn khác: với lòng nhiệt thành hợp nhất của chúng ta, tại sao không lập kẻ tranh ngôi [byz_claimant.GetName] lên ngai vàng của [byz_emperor.GetPrimaryTitle.GetName]? Phần thưởng hậu hĩnh mà ta thu được chẳng phải sẽ củng cố đức tin hay sao?"
  ep3_frankokratia_events.0020.pope_condemns: "\n\n[pope.GetTitledFirstName] phản đối, cấm đoán sự mạo hiểm này và đe dọa sự đọa đày. Những kẻ tình nguyện vẫn không nao núng."
  ep3_frankokratia_events.0020.pope_endorses: "\n\nVà dù [pope.GetSheHe] vẫn đang cố gắng lãnh đạo một cuộc Thập tự chinh, [pope.GetTitledFirstName] đã ban cho sự nghiệp này phúc lành của Thánh Phêrô!"
  ep3_frankokratia_events.0020.pope_resents: "\n\n[pope.GetTitledFirstName] không lên án thẳng thừng sự nghiệp này, nhưng các giáo sĩ của [pope.GetHerHis] không tán thành sự chia rẽ như vậy trong cuộc Thập tự chinh..."

  ep3_frankokratia_events.0020.a: "Ta sẽ chỉ tham gia với tư cách là #EMP thủ lĩnh#! của sự nghiệp táo bạo này."
  ep3_frankokratia_events.0020.b: "Hãy tính cả ta vào hàng ngũ những kẻ tình nguyện!"
  ep3_frankokratia_events.0020.c: "Kế hoạch này... vô nghĩa."
  ep3_frankokratia_events.0020.c.flavor: "Đây là sự báng bổ trắng trợn! #EMP Và nó làm suy yếu cuộc Thập tự chinh thiêng liêng của chúng ta!#!"
  join_byz_claimant_crusade_tooltip: "@warning_icon! #X Ngài sẽ tham gia một #high $CRUSADING_CLAIM_CB_NAME$#! chống lại [byz_emperor.GetShortUIName], nhân danh [byz_claimant.GetShortUIName]#!"
  may_gain_land_latin_empire_tooltip: "Các [titles|E] trong #high [GetTitleByKey('e_latin_empire').GetName|U]#! có thể được phân chia"

  ep3_frankokratia_events.0030.t: "Những Người thừa kế của Constantine"
  ep3_frankokratia_events.0030.desc: "[ghw_sponsor.GetTitledFirstName] kêu gọi, nhưng chúng ta sẽ không đáp lại. Chưa phải lúc. Thay vào đó, dưới sự chỉ huy của [byz_claimant_champion.GetTitledFirstNamePossessive], chúng ta tiến quân về [byz_emperor.GetPrimaryTitle.GetNameNoTier].\n\nKhi những người hành hương của ta lên các con tàu [financier.GetPrimaryTitle.GetAdjective], vô số khiên hiệu được treo ở mũi và đuôi tàu, bọc da để chịu được sóng biển. Những chiến mã hùng dũng được dắt xuống khoang. Như hoa nở, những cánh buồm lớn bung ra đón ánh mặt trời! Ở nơi khác, các đoàn Thập tự quân xuất phát bằng đường bộ phía sau thánh giá, theo những con đường cổ xưa dẫn họ về phương Đông.\n\nHãy báo thù cho [Glossary( 'Trojans', 'TROJANS_FRANKOKRATIA_GLOSS')]! Hãy để người Hy Lạp run rẩy trong cung điện của họ! Hãy để họ quỳ phục trước [byz_claimant.GetFullName], vị chúa tể chính thống của mình, và trước chúng ta — những Thập tự quân, các vị cứu tinh của họ!"
  TROJANS_FRANKOKRATIA_GLOSS: "Thông qua truyền thuyết Aeneas chạy trốn khỏi thành Troy, người Latinh thời trung cổ cho rằng dòng dõi của họ bắt nguồn từ thành phố huyền thoại ấy; việc trả thù cho những tổ tiên được cho là như vậy được viện dẫn làm động cơ cho cuộc tấn công vào Byzantium của người Hy Lạp."
  ep3_frankokratia_events.0030.a: "#EMP Vinh danh Thiên Chúa trên các tầng trời cao nhất!#!"
  frankokratia_war_begins_tooltip: "[byz_claimant_champion.GetShortUIName|U] đã tuyên bố #high [frankokratia_war.GetName]#!"
  frankokratia_war_join_tooltip: "Ngài đã tham gia với tư cách là Kẻ Tấn công"

  abandoned_crusade_general_tooltip: "@alert_icon! #alert_trial [byz_claimant_champion.GetShortUIName] và các Kẻ Tấn công khác đã rời khỏi [great_holy_war|E] [GetFaithByKey('catholic').GetAdjective]#!"

  ep3_frankokratia_events.0031.t: "Cuộc Thập Tự Chinh Tan Vỡ"
  ep3_frankokratia_events.0031.desc_byz: "Bất chấp mọi tình yêu thông thường dành cho Chúa — và khinh miệt sự nghiệp của [pope.GetTitledFirstName], vị Giám mục thành Rome đáng kính của họ — một phe Thập tự quân Latin hiện đang thách thức Đế quốc của chúng ta!\n\nLiệu họ có #EMP không#! biết các quân đội đế quốc của chúng ta đã phục vụ bao lâu như là thành trì của Cơ đốc giáo không? Cầu mong sức mạnh của [Glossary( 'Herakleios', 'HERAKLEIOS_GLOSS')] bảo vệ chúng ta lúc này; cầu mong những cái đầu bị chặt của [byz_claimant_champion.GetTitledFirstName], [financier.GetTitledFirstName], và kẻ giả danh [byz_claimant.GetName] sớm nằm cạnh [Glossary( 'Throne of Solomon', 'THRONE_OF_SOLOMON_GLOSS')]!\n\n[ROOT.Char.GetFaith.WarGodName], hãy bảo vệ chúng ta thật tốt trước lòng tham của người Latin này... sự điên rồ đe dọa chính sự tồn tại của chúng ta."
  HERAKLEIOS_GLOSS: "Hoàng đế #bold Herakleios#! thế kỷ VII đã phải đối mặt với khủng hoảng quân sự trong phần lớn triều đại, chiến đấu chống cả Đế quốc Ba Tư Sassanid lẫn Khalip Rashidun. Ông tiến hành những cải cách then chốt giúp Đế quốc Byzantine tồn tại."
  THRONE_OF_SOLOMON_GLOSS: "Ngai vua được cho là của Vua Solomon, vị vua thông thái nhất Israel cổ đại, là một trong những bảo vật Solomonic được triều đình Byzantine lưu giữ."
  ep3_frankokratia_events.0031.desc_catholic: "#EMP Cuộc Thập Tự Chinh Công giáo đã bị phản bội!#!\n\nNhững kẻ hành hương lạc lối, vô tín đã tụ tập dưới trướng kẻ tiếm vị [byz_claimant.GetName] và — thật là ô nhục trong ô nhục — âm mưu tấn công [byz_emperor.GetPrimaryTitle.GetNameNoTier], một vương quốc Kitô giáo! Chúng từ chối tiến về [target_kingdom.GetNameNoTier]!\n\nNhững kẻ biện hộ cho tên kiêu ngạo [byz_claimant_champion.GetTitledFirstName], kẻ tham lam [financier.GetTitledFirstName], cùng bè lũ của chúng cho rằng họ sẽ tái hợp Giáo hội, đem sức mạnh Hy Lạp phục vụ chính nghĩa...\n\nNhưng chỉ có Chúa mới biết điều gì sẽ xảy ra."
  ep3_frankokratia_events.0031.desc_target: "Không có ánh sáng của [ROOT.Char.GetFaith.HighGodName] soi đường, đám [pope.GetFaith.GetAdherentNamePlural] chỉ vùng vẫy trong bóng tối!\n\nMột lực lượng lớn trong đám kẻ thù cuồng tín của chúng ta, thay vì tiến đánh [defender.GetName], lại thề sẽ chiếm lấy [byz_emperor.GetPrimaryTitle.GetName]! Sự chia rẽ của chúng là niềm nhẹ nhõm khó hiểu cho những người đang bảo vệ [target_kingdom.GetNameNoTier].\n\nĐầu óc quỷ quyệt của chúng dường như tin rằng chúng ta sẽ bị rửa tội bằng gươm giáo khi [byz_claimant.GetName] ngồi lên ngai hoàng đế... nhưng lực lượng của [pope.GetTitledFirstNamePossessive] hẳn sẽ bị đẩy lùi trước lúc đó."
  ep3_frankokratia_events.0031.a: "Chuyện này... thật sự đang xảy ra sao?"

  ep3_frankokratia_events.0041.t: "Mọi Của Cải Của Đế Quốc"
  ep3_frankokratia_events.0041.intro_constantinople: "Trong sự reo hò ầm ĩ, người mà chúng ta bảo hộ [claimant.GetFirstName] bước vào cánh cổng hùng vĩ của [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]. Bên dưới những mái vòm vĩ đại và [Glossary( 'seraphim', 'SERAPHIM_GLOSS')] thiên đàng của Hagia Sophia, [claimant.GetSheHe] cuối cùng đã được tấn phong làm [claimant.GetTitleAsNameNoTooltip]. Niềm vui của chúng ta rực rỡ biết bao, sự ngạc nhiên của chúng ta thật tuyệt đối!\n\nKhi ta bị dẫn vào [Glossary( 'Blachernae Palace', 'BLACHERNAE_PALACE_GLOSS')]"
  ep3_frankokratia_events.0041.intro_generic: "Trong tiếng hoan hô vang dội, người được chúng ta bảo trợ là [claimant.GetFirstName] tiến vào cổng lớn của [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]. Dưới những mái vòm vĩ đại và các [Glossary( 'seraphim', 'SERAPHIM_GLOSS')] thiên giới của nhà thờ hoàng gia, [claimant.GetSheHe] cuối cùng cũng được phong làm [claimant.GetTitleAsNameNoTooltip]. Niềm vui của chúng ta rực rỡ biết bao, sự kinh ngạc tuyệt đối biết bao!\n\nKhi ta bị lạnh lùng dẫn vào một cung điện hoàng gia"
  ep3_frankokratia_events.0041.desc: "và phải chịu đựng những nghi lễ bất tận, một cảm giác rất khác ập đến...\n\n\"Người tiền nhiệm của ta,\" [claimant.GetTitledFirstNameNoTooltip] giải thích, \"đã mang theo phần lớn ngân khố khi [defender.GetSheHe] bỏ chạy.\""
  ep3_frankokratia_events.0041.trying_to_pay: "Dẫu có cố gắng đến đâu, Đế quốc cũng chỉ có thể bồi thường cho các Thập Tự quân một phần #EMP không trọn vẹn#!.\""
  ep3_frankokratia_events.0041.not_trying_to_pay: "Các ngươi, những Thập Tự quân, không thể nhận đủ số đã hứa — mà đúng hơn... chúng ta chỉ có thể trả cho #EMP các ngươi#! ít hơn, #EMP rất nhiều#!.\""
  SERAPHIM_GLOSS: "Một đẳng cấp sinh linh thiên giới xuất hiện trong các tôn giáo Abraham; trong Kitô giáo, #bold seraphim#! có sáu cánh và thuộc hàng thiên thần cao nhất."
  BLACHERNAE_PALACE_GLOSS: "Được xây gần Tường thành Theodosius vào khoảng năm 500 SCN, quần thể cung điện bậc thềm này ngày càng được dùng làm nơi ở chính của hoàng đế trong thời Trung Cổ."
  ep3_frankokratia_events.0041.a: "Vậy thì chúng ta phải #EMP tự lấy#! những gì đáng được nhận."
  ep3_frankokratia_events.0041.a.flavor: "Việc cướp phá một thành phố hoàng gia như vậy... sẽ là vô song."
  ep3_frankokratia_events.0041.b: "Giải tán các hiệp sĩ của ta khi chưa được trả công sẽ không dễ dàng..."
  ep3_frankokratia_events.0041.b.flavor: "...nhưng nếu có #EMP động lực#! thích hợp, ta có thể cố gắng tiễn họ đi mà không đổ máu."
  ep3_frankokratia_events.0041.b_success: "Ngài thuyết phục được người Latinh rút lui"
  ep3_frankokratia_events.0041.b_failure: "Các Thập Tự quân cướp phá [claimant.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
  ep3_frankokratia.0041_effects_from_a_tooltip: "@warning_icon! #X Hiệu ứng của lựa chọn đầu tiên sẽ xảy ra#!"

  ep3_frankokratia_events.0041.c: "Chúng ta đã kỳ vọng nhiều hơn. Nhưng có thể chấp nhận."
  ep3_frankokratia_events.0041.c.flavor: "Thế giới Kitô giáo vẫn được củng cố nhờ nỗ lực này. Ít nhiều."

  byzantine_empire_destroyed_tooltip: "@warning_icon! #X [claimant.GetPrimaryTitle.GetNameNoTier] sẽ bị hủy diệt#!"
  byz_capital_building_destroyed_tooltip: "@warning_icon! #X #high 3#! [buildings|E] sẽ bị hạ cấp hoặc phá hủy#!"

  frankokratia_leaders_gain_despoiler_trait: "Tất cả Thập Tự quân liên quan và các [rulers|E] của [GetTitleByKey('e_latin_empire').GetAdjective] sẽ nhận đặc tính #high [GetTrait('despoiler_of_byzantium').GetName( GetNullCharacter )]#!"
  bent_before_crusaders_modifier: "Khuất Phục Trước Thập Tự Quân"
  bent_before_crusaders_modifier_desc: "Thay vì vỡ nợ vì những lời hứa bất khả thi, nhân vật này đã trả nợ bằng cách cướp phá chính lãnh thổ của mình."
  crippled_by_imperial_debt_modifier: "Tê Liệt Vì Nợ Nần Hoàng Gia"
  crippled_by_imperial_debt_modifier_desc: "Quân địa phương bị giải tán, bộ máy hành chính trống rỗng. Các quảng trường chợ trở nên im lìm."
  greek_opinion: "Thiện cảm của người Hy Lạp [opinion|E]"

  ep3_frankokratia_events.0042.t: "Rửa Tội Bằng Lửa"
  ep3_frankokratia_events.0042.desc: "Chúng ta tấn công [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]! Thủy binh của [financier.GetPrimaryTitle.GetAdjective] là những người đầu tiên cắm lá cờ thánh lên tường thành, trong khi các $knight_culture_player_plural_no_tooltip_lowercase$ của ta gào thét xuyên qua cổng thành và tàn sát mọi kẻ phòng thủ. Người Hy Lạp tự tay đốt nhà của họ — nhưng ngay cả bức tường lửa khổng lồ ấy cũng không thể ngăn cơn thịnh nộ của Chúa!\n\nTrong ba ngày, thành phố bị cướp bóc và cư dân bị giết không thương tiếc."
  ep3_frankokratia_events.0042.constantinople: "Những người mộ đạo kêu gọi kiềm chế, nhưng Hagia Sophia cùng các thánh địa cổ xưa vẫn bị tàn phá và cướp bóc."
  ep3_frankokratia_events.0042.desc_outro: "\n\nGiờ đây, các thủ lĩnh của chúng ta sẽ không còn tin bất kỳ người Hy Lạp nào có thể cai trị công bằng nơi này và phụng sự chính nghĩa của Đấng Christ: chúng ta phải chỉ định Hoàng đế của riêng mình. Lá phiếu của ta, lựa chọn của ta, sẽ thay đổi Thế giới Kitô giáo."
  ep3_frankokratia_events.0042.a: "Ta sẽ cai trị cả người Latinh lẫn Hy Lạp!"
  ep3_frankokratia_events.0042.b: "[player_1.GetTitledFirstNameNoTooltip] được các Thập Tự quân kính trọng."
  ep3_frankokratia_events.0042.c: "Hãy để [player_2.GetTitledFirstNameNoTooltip] nhận lấy vinh dự này."
  ep3_frankokratia_events.0042.d: "Nhiều ân nghĩa còn nợ [financier.GetTitledFirstNameNoTooltip]."
  ep3_frankokratia_events.0042.e: "[emp_beneficiary_3.GetNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_3'))] của ta, mang phong thái hoàng gia!"
  ep3_frankokratia_events.0042.f: "[emp_beneficiary_2.GetNameNoTooltip]. Hãy trị vì khôn ngoan, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_2'))]."
  ep3_frankokratia_events.0042.g: "[emp_beneficiary.GetNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary'))] của ta, xứng đáng với ngai vàng."
  old_titles_vassals_emp_beneficiary_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] sẽ được ban tất cả [titles|E] và [vassals|E] của Ngài nằm ngoài các Vương quốc thuộc [GetTitleByKey('e_latin_empire').GetNamePossessive]#!"
  old_titles_vassals_emp_beneficiary_2_kings_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] sẽ được ban tất cả [titles|E] và [vassals|E] của Ngài nằm ngoài [latin_kingdom_1.GetNameNoTier] và [latin_kingdom_2.GetNameNoTier]#!"
  old_titles_vassals_emp_beneficiary_1_king_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] sẽ được ban tất cả [titles|E] và [vassals|E] của Ngài nằm ngoài [latin_kingdom_1.GetNameNoTier]#!"
  old_titles_vassals_emp_beneficiary_no_king_tooltip: "@warning_icon! #X [emp_beneficiary.GetShortUIName] sẽ được ban toàn bộ [titles|E] và [vassals|E] hiện có của Ngài#!"
  old_titles_vassals_lord_beneficiary_tooltip: "@warning_icon! #X [beneficiary.GetShortUIName] sẽ được ban tất cả [titles|E] và [vassals|E] của Ngài nằm ngoài [latin_emperor.GetShortUINamePossessive] [de_jure|E] [realm|E]#!"

  ep3_frankokratia_events.0044.t: "Sắc Tía Thuộc Về Chúng Ta"
  ep3_frankokratia_events.0044.desc: "Sau khi chiến đấu nhân danh [claimant.GetHerHis], [claimant.GetName] nay từ chối những gì đáng lẽ phải trả cho chúng ta, #EMP và cho cả Chúa!#! Các Thập Tự quân không thể chấp nhận điều này!\n\nTrong cơn thịnh nộ chính nghĩa, chúng ta tấn công [latin_byz_capital_barony.GetNameNoTier]. Máu Hy Lạp nhấn chìm các con phố, khi nhà thờ và cung điện bị cướp phá. Chúng ta còn con đường nào khác ngoài sự hủy diệt này?\n\nNhững kẻ Hy Lạp xảo trá sẽ không còn cai trị nơi đây nữa, có lẽ là vĩnh viễn."
  ep3_frankokratia_events.0044.desc_past_tense: "Sau khi chiến đấu nhân danh [claimant.GetHerHis], chúng ta — các Thập Tự quân — đã phẫn nộ ra sao khi [claimant.GetName] từ chối những gì đáng lẽ phải trả cho chúng ta, #EMP và cho cả Chúa!#!\n\n[latin_byz_capital_barony.GetNameNoTier] cần phải bị tấn công. Máu Hy Lạp cần phải nhấn chìm các con phố; nhà thờ và cung điện của nó xứng đáng bị cướp phá. Chúng ta còn con đường nào khác ngoài sự hủy diệt này?\n\nNhững kẻ Hy Lạp xảo trá sẽ không còn cai trị nơi đây nữa, có lẽ là vĩnh viễn."
  ep3_frankokratia_events.0044.outro_emperor: "Một người Latinh sẽ đội vương miện thánh, và vinh dự chỉ định vị hoàng đế này thuộc về ta."
  ep3_frankokratia_events.0044.outro_lord: "[latin_emperor.GetName] đã được đội vương miện làm chủ cả người Latinh lẫn Hy Lạp, và chúng ta — những người hành hương còn lại — phải chia nhau đất đai của [latin_emperor.GetHerHis]."

  ep3_frankokratia_events.0044.a: "Ta sẽ ở lại đây và tận hưởng những xa hoa Hy Lạp!"
  ep3_frankokratia_events.0044.b: "[beneficiary_3.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_3'))] của ta: hãy bảo vệ lãnh thổ này."
  ep3_frankokratia_events.0044.c: "[beneficiary_2.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_2'))] của ta, say mê vùng đất này."
  ep3_frankokratia_events.0044.d: "[beneficiary.GetFirstNameNoTooltip]. Hãy cai trị đám ngoại bang này thật tốt, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary'))]."

  ep3_frankokratia_events.0045.t: "Vinh Quang Chưa Từng Thấy"
  ep3_frankokratia_events.0045.intro: "Khi chiến thắng đã đạt được và các điều khoản chia tay được thống nhất, chúng ta — những Thập Tự quân — lặng lẽ nhìn xuống [claimant.GetCapitalLocation.GetTitle.GetNameNoTier],"
  ep3_frankokratia_events.0045.intro_constantinople: "món trang sức của Bosporus. Dưới những công trình của thời đại đã qua, giữa những thánh tích thiêng liêng nhất, là những con phố bẩn thỉu và quảng trường hôi mùi gia súc."
  ep3_frankokratia_events.0045.intro_generic: "một sự thay thế đáng thương cho nữ hoàng của các thành phố. Cái bóng của kinh đô cũ, [GetTitleByKey('b_constantinople').GetNameNoTier], với các thánh đường linh thiêng và cung điện xa hoa."
  ep3_frankokratia_events.0045.desc: "\n\nCó lẽ người La Mã xưa đã có thể ban thưởng cho chúng ta hậu hĩnh. Hẳn họ hiểu sức mạnh để trừng phạt ngoại đạo. Những người Hy Lạp này thì kém ấn tượng hơn. [claimant.GetName] tiễn những người cứu giúp của [claimant.GetHerHis] ra đi"
  ep3_frankokratia_events.0045.unpaid: "tay trắng và không được hỗ trợ.\n\nDù càu nhàu, dù thèm khát châu báu và đồ trang sức, cuộc hành hương kỳ lạ của chúng ta cũng đã kết thúc."
  ep3_frankokratia_events.0045.paid_off: "chỉ được trả một nửa, dẫn theo những toán nhỏ bị kéo khỏi tường thành của [claimant.GetHerHis].\n\nNhư vậy, cuộc hành hương kỳ lạ này đã mang lại cho những tín đồ trung thành của chúng ta phần thưởng nào đó — nhiều hơn, ít nhất, so với những người Hy Lạp hoang mang và rối loạn..."
  ep3_frankokratia_events.0045.a: "Vẫn chưa quá muộn để giúp chính nghĩa Thập Tự!"
  ep3_frankokratia_events.0045.b: "Những miền đất quen thuộc đang vẫy gọi."

  ep3_frankokratia_crusader_joining: "Thập Tự Quân Cam Kết Phò Trợ Người Yêu Sách"
  frankokratia_crusader_joining_tooltip: "[joiner.GetName] sẽ chuyển hướng đoàn hành hương vũ trang của [joiner.GetHerHis] tới Byzantium khi thời điểm thích hợp.\n\n#high [num_frankokratia_leaders]#! [rulers|E] đang tham gia sự nghiệp của Ngài."

  2_byzantine_regiments_given_over_tooltip: "#high 2#! [regiments|E] [men_at_arms|E] của [claimant.GetPrimaryTitle.GetAdjective] bị giải thể"
  1_byzantine_regiment_given_over_tooltip: "#high 1#! [regiment|E] [men_at_arms|E] của [claimant.GetPrimaryTitle.GetAdjective] bị giải thể"
  frankokratia_leaders_lose_excommunicated: "Tất cả Thập Tự quân liên quan mất đặc tính [GetTrait('excommunicated').GetName( GetNullCharacter )]"
  frankokratia_leaders_gain_identical_force: "Tất cả Thập Tự quân liên quan nhận được một [army|E] tương đương"
  ep3_frankokratia_reward_army_name: "Quân Đội Byzantine Được Cho Mượn"

  every_crusader_gets_paid: "Trả công cho mọi Thập tự quân tham chiến @gold_icon!#P [payoff_per_crusader|P0]#!"
