  ep3_latin_emp_army_name: "Những kẻ săn tìm vinh quang Latinh"
  frankokratia_latin_emp_army_tooltip: "[holder|E] của [GetTitleByKey('e_latin_empire').GetName] nhận được một [army|e] nhỏ gồm quân đặc biệt"

  frankokratia_byz_slaughter.t: "Thảm sát tại [latin_capital_barony.GetNameNoTierNoTooltip]"
  frankokratia_byz_slaughter_tooltip: "Giữa cuộc tàn sát do người Latinh cuồng loạn gây ra, #N [slaughtered_byzantines]#! quý tộc đã bị giết."
  frankokratia_byz_slaughter_varangian_tooltip: "Giữa cuộc tàn sát do người Latinh cuồng loạn gây ra, #N [slaughtered_byzantines]#! quý tộc đã bị giết.\n\nĐội Varangian do [varangian_victim.GetShortUIName] chỉ huy đã bảo vệ hoàng tộc đến hơi thở cuối cùng."
  frankokratia_byz_slaughter_house_head_tooltip: "Giữa sự tàn sát do người Latin cuồng nộ gây ra, #N [slaughtered_byzantines]#! quý tộc đã bị tàn sát.\n\nNhững [house_head_victim.GetWomenMen] cao quý như [house_head_victim.GetShortUIName], người đứng đầu dòng họ của [house_head_victim.GetHerHis], đã bị thiêu sống trong nhà của họ."
  frankokratia_byz_slaughter_child_tooltip: "Giữa cuộc tàn sát do người Latinh cuồng loạn gây ra, #N [slaughtered_byzantines]#! quý tộc đã bị giết.\n\nNhững đứa trẻ như [child_victim.GetShortUIName] đã bị đánh chết."
  frankokratia_byz_slaughter_emp_tooltip: "Giữa cuộc tàn sát do người Latinh cuồng loạn gây ra, #N [slaughtered_byzantines]#! quý tộc đã bị giết.\n\n[defender.GetName], từng là người cai trị [GetTitleByKey('e_byzantium').GetNameNoTier], được tìm thấy giữa đống xác chết."
  frankokratia_byz_slaughter_victim.t: "Bị người Latinh sát hại"
  frankokratia_byz_slaughter_victim_tooltip: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] của Ngài là [victim.GetShortUIName] đã bị giết trong cuộc cướp phá [latin_capital_barony.GetNameNoTierPossessive]."

  ep3_frankokratia_events.0070.t: "Thanh gươm được tra vào vàng"
  ep3_frankokratia_events.0070.intro: "[financier.GetName] đã nán lại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], trông coi những công việc mới mẻ của vô số thương nhân địa phương [financier.GetPrimaryTitle.GetAdjective]. Giờ đây, chiến hạm đầu đàn chất đầy chiến lợi phẩm của [financier.GetHerHis], [financier.GetSheHe] lên đường từ biệt.\n\n"
  ep3_frankokratia_events.0070.rando_emp: "\"Thật là một cuộc phiêu lưu!\" [financier.GetFirstNameNoTooltip] reo lên. \"Ai có thể tự nhận dũng khí sánh bằng những kẻ đã chiếm lấy đế quốc vĩ đại này?\""
  ep3_frankokratia_events.0070.leader_emp: "\"Chúng ta đã tập hợp biết bao người dưới thánh giá,\" [financier.GetFirstNameNoTooltip] reo lên. \"Và hãy xem nó mang lại cho ngươi điều gì! Một đế quốc hùng mạnh!\""
  ep3_frankokratia_events.0070.desc: "Nhưng... #EMP giữ lấy#! nàng — liệu sức mạnh của một cánh tay cầm gươm có đủ chăng? Chẳng phải chúng ta, những người Latinh, bị ràng buộc bởi nhiệt huyết, nên liên minh với các cõi Hy Lạp mới này sao...?\n\n\"Ta chỉ xin rằng... các thương nhân [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] của ta, với những lợi ích địa phương #EMP sâu sắc#! của họ, được bảo đảm các đặc quyền riêng...\""
  negotiate_financier_alliance_effect_tooltip: "#high Ngài#! và [financier.GetShortUIName] thiết lập một [alliance|E] song phương"
  custom.every_realm_county: "Mọi [county|E] trong [realm|E] của Ngài"
  ep3_frankokratia_events.0070.a: "Chỉ khi cùng nhau, ta mới kiểm soát được lũ Hy Lạp đáng nguyền rủa này."
  ep3_frankokratia_events.0070.a.flavor: "Thanh gươm đặt lên cổ người Hy Lạp vẫn là của ta, dù đồng tiền [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] mới là thứ chi phối các khu chợ của họ."
  ep3_frankokratia_events.0070.b: "#EMP Tên tham lam khốn kiếp!#! Người Hy Lạp ghét ngươi là phải!"
  ep3_frankokratia_events.0070.b.flavor: "Có thể khước từ vị [financier.GetTitleAsNameNoTooltip], nhưng lòng khát khao lợi nhuận từ vương quốc mới của ta của [financier.GetHerHis] thì khó lòng suy giảm..."
  egregious_trading_rights_modifier: "Đặc quyền thương mại ngoại bang quá mức"
  egregious_trading_rights_modifier_desc: "Như những ký sinh trùng đói khát, các thương nhân được trao đặc quyền cho vay nặng lãi bóp nghẹt thị trường địa phương vì lợi ích của chính họ."
  greek_spoils_imports_modifier: "Chiến lợi phẩm Hy Lạp nhập khẩu"
  greek_spoils_imports_modifier_desc: "Vùng đất này ngập tràn châu báu ngoại lai. Thương mại chưa bao giờ thịnh vượng đến thế."
  ep3_harassed_at_sea_modifier: "Bị quấy rối trên biển"
  ep3_harassed_at_sea_modifier_desc: "Những thủy thủ lão luyện từ các cõi thù địch từ chối phục vụ quân đội của nhân vật này; hơn nữa, họ còn gây gổ giữa các thủy thủ và làm hư hại tàu bè trong cảng."

  custom.every_county_latin_kingdom: "Mọi [county|E] của [kingdom|E] này"
  ep3_frankokratia_events.0080.t: "Một vương quốc cho người Latinh"
  ep3_frankokratia_events.0080_non_greek: "Caesar, Constantine, nối tiếp là những người Hy Lạp với cái tên dài dòng, nặng nề... và giờ là [ROOT.Char.GetFirstName]."
  ep3_frankokratia_events.0080_greek: "Vùng đất của người Hy Lạp, từng hoàn toàn quy phục dưới [GetTitleByKey('e_byzantium').GetName], nay vẫn biến động. Trong số mọi quân chủ dưới [ROOT.Char.GetFaith.PositiveAfterLife], ai mới có chính danh với chúng?"
  ep3_frankokratia_events.0080.desc: "\n\nChủ quyền của người La Mã là đỉnh cao của vinh dự trần thế. Cùng với nó là sự kính trọng của muôn dân. Việc giành lấy điều này vượt xa những giấc mơ của các Thập tự quân Latinh — một trò đùa của số phận, được hiện thực hóa bằng máu me kinh hoàng — nhưng giờ đây, đế quyền của ta là hoàn toàn có thật. Hình ảnh huy hoàng của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] gần như không tì vết.\n\nXưa kia, ta là kẻ xâm lăng. Dân bản địa than khóc, tháo chạy trước ta. Giờ đây, tại [kingdom_1.GetNameNoTier], họ reo hò trên đường phố."
  ep3_frankokratia_events.0080.a: "Hãy để toàn thể [kingdom_1.GetNameNoTierNoTooltip] biết rõ quyền chính danh của ta!"
  ep3_frankokratia_events.0080.b: "Hãy để [kingdom_2.GetNameNoTierNoTooltip] cúi đầu!"
  ep3_frankokratia_events.0080.c: "Hãy để [kingdom_3.GetNameNoTierNoTooltip] mãi mãi thuộc về [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"
  ep3_frankokratia_events.0080.d: "Hãy để dân chúng [kingdom_4.GetNameNoTierNoTooltip] quỳ gối."
  ep3_frankokratia_events.0080.e: "Hãy để [kingdom_5.GetNameNoTierNoTooltip] là của chúng ta."
  cultural_acceptance_latins_legitimized: "[GetTitleByKey('e_latin_empire').GetName] đã thiết lập quyền thống trị chính danh"

  greek_anarchy_war_generic_army_name: "Quân đào ngũ [defender.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  greek_anarchy_war_generic_army_name_2: "Đạo quân đánh thuê"
  greek_anarchy_war_crusaders_army_name: "Quân cướp phá [army_culture.GetNameNoTooltip]"
  greek_anarchy_war_greek_army_name: "Tàn quân Tagmata [army_culture.GetNameNoTooltip]"
  greek_anarchy_war_neighbor_army_name: "Quân tự do [army_culture.GetNameNoTooltip]"
  greek_anarchy_war_nomad_army_name: "Đạo chiến binh [army_culture.GetNameNoTooltip]"
  greek_anarchy_troops_tt: "Một [army|E] gồm [special_troops|E] gia nhập phe chiến thắng!"
  greek_anarchy_development_loss_cb: "Mỗi [county|E] bị chiếm mất #N [EmptyScope.ScriptValue('greek_anarchy_development_value')]#! [development_growth|E]"

  ep3_frankokratia_events.0090.t: "Hãy Nhớ Rằng Ngươi Là Người [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]!"
  ep3_frankokratia_events.0090.desc: "Những xứ như [kingdom_1.GetNameNoTier] đã phải chịu đựng một thời đại mờ ám — bị tước đoạt sự cai trị hiền hòa của một vị quân vương [GetTitleByKey('e_byzantium').GetAdjective] — suốt quá lâu.\n\nNhưng giờ đây — người dân [kingdom_1.GetAdjectiveNoTooltip] có thể hân hoan! Họ không còn quỳ gối trước lũ côn đồ Frank! Những cánh đồng [kingdom_1.GetAdjectiveNoTooltip], được cày xới qua bao thế hệ, sẽ không còn héo tàn dưới vó ngựa chiến tranh."
  ep3_frankokratia_events.0090_emp: "Hãy đến, [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )]: giương cao thánh tượng của các ngươi trong niềm kiêu hãnh, và hoan ca trước sự trở lại của trật tự thần thánh của [ROOT.Char.GetFaith.HighGodNamePossessive]!\n\nNhững dân tộc này một lần nữa được tái hợp dưới quyền [ROOT.Char.GetTitleAsName]; khi của cải từ đất đai tuôn chảy về cung điện, họ cũng sẽ được ban cho mọi vinh dự và huy hoàng từng thuộc về tổ tiên mình."
  ep3_frankokratia_events.0090_non_emp: "Và những con người bình dân, như tại [kingdom_1.GetTierAsNameNoTooltip], nay có thể tự do mơ mộng... về ngày vị chúa tể chân chính của họ trở về.\n\nĐã đến lúc ách cai trị Latin phải chấm dứt."
  ep3_frankokratia_events.0090.a: "Tại [kingdom_1.GetNameNoTierNoTooltip], cầu mong những tháng ngày u ám bị lãng quên!"
  ep3_frankokratia_events.0090.b: "Hãy hướng về #EMP Autokrator#!, [kingdom_2.GetNameNoTierNoTooltip]!"
  ep3_frankokratia_events.0090.c: "[kingdom_3.GetNameNoTierNoTooltip] hiểu rõ sắc tía hoàng gia!"
  ep3_frankokratia_events.0090.d: "Trở về vòng tay đế quốc: [kingdom_4.GetNameNoTierNoTooltip]."
  ep3_frankokratia_events.0090.e: "[GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] [kingdom_5.GetNameNoTierNoTooltip], thêm một lần nữa!"

  msg_latin_de_jure_gain.t: "Người Latin Đòi Quyền De Jure"
  msg_latin_de_jure_gain.desc: "[title_gainer.GetName] đã xé [swapped_kingdom.GetName] khỏi tay [GetTitleByKey('e_byzantium').GetName], thiết lập quyền thống trị [de_jure|E] của [title_gainer.GetHerHis]"
  msg_byz_de_jure_gain.t: "Khôi Phục Quyền Lợi [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]"
  msg_byz_de_jure_gain.desc: "[title_gainer.GetName] đã thu hồi [swapped_kingdom.GetName] khỏi quyền chiếm hữu [de_jure|E] của người [GetTitleByKey('e_latin_empire').GetAdjective]"
  swap_latin_for_byz_titles_tt: "Toàn bộ [titles|E] [de_jure|E] [GetTitleByKey('e_latin_empire').GetAdjective] sẽ được hoàn trả cho [GetTitleByKey('e_byzantium').GetName]"

  ep3_frankokratia_events.0100.t: "Frankokratia Sụp Đổ"
  ep3_frankokratia_events.0100.desc: "Nhân danh Thánh Phêrô, Thánh Mác-cô, vì florin và ducat — [GetTitleByKey('e_byzantium').GetName] đã bị tàn phá.\n\nTừ đó, hết lần này đến lần khác, các lãnh chúa [GetTitleByKey('e_latin_empire').GetAdjective] đã xuất chinh cùng hiệp sĩ của họ. Thuở ban đầu, họ khoác vàng lộng lẫy và cháy bỏng lý tưởng, nhưng về sau... hy vọng của [latin_emp.GetTitledFirstNamePossessiveRegnal] chỉ còn là những mảnh vụn nhỏ nhoi. [latin_emp.GetHerHis|U] sự nghiệp chỉ còn biết đến sự cam chịu u ám.\n\n[GetTitleByKey('e_latin_empire').GetName], một dị dạng sinh ra trong lòng Kitô giáo, vốn chưa từng được định tồn tại."
  ep3_frankokratia_events.0100.byz_no_emp: "Với sự diệt vong của nó — sao bất kỳ [Glossary( 'Romaios', 'ROMAIOS_GLOSS' )] vĩ đại nào có thể ngồi yên? Một Basileus hùng mạnh, #EMP Basileus của chúng ta#!, ắt sẽ sớm khải hoàn tiến qua [Glossary( 'Golden Gate', 'GOLDEN_GATE_GLOSS' )].\n\nBởi lãnh thổ [GetTitleByKey('e_latin_empire').GetAdjective] không còn nữa!"
  ep3_frankokratia_events.0100.cath: "Phải chăng các Thập Tự quân của chúng ta đã bị lừa vào sự kiêu ngạo phản trắc? Phải chăng ánh hào quang Hy Lạp đã #EMP làm mù mắt chúng ta?#! Ngay cả Giáo hoàng cũng từng tôn vinh quốc gia Latin của ta giữa người Hy Lạp..."
  ep3_frankokratia_events.0100.emp: "Người thừa kế chân chính của Constantine chính là [byz_emp.GetTitledFirstNameRegnal]... [byz_emp.GetSheHe] — kẻ có thể hàn gắn thời đại tổn thương này, và một lần nữa dựng lên thành lũy hùng vĩ của Bosporus."
  ep3_frankokratia_events.0100.a_non_catholic: "Nó đến từ [ROOT.Char.GetFaith.NegativeAfterLife]. Nó trở về với [ROOT.Char.GetFaith.NegativeAfterLife]."
  ep3_frankokratia_events.0100.a_catholic: "Trong hư vọng, chúng ta đã mơ mang vinh quang của [ROOT.Char.GetFaith.HighGodName] xuống trần thế..."
  custom.greek_anarchy_rulers: "Mọi [ruler|E] sở hữu lãnh thổ [GetTitleByKey('e_latin_empire').GetAdjective] hoặc [GetTitleByKey('e_byzantium').GetAdjective]"
  gain_greek_anarchy_cb_tt: "Nhận được #high Chiếm Đoạt Công Quốc Đế Quốc#! [casus_belli|E]"
  greek_anarchy_cb: "Chiếm Đoạt Công Quốc Đế Quốc"
  greek_anarchy_cb_warning_tt: "#weak Một Casus Belli dùng để chinh phục các [duchies|E] [GetTitleByKey('e_latin_empire').GetAdjective] hoặc [GetTitleByKey('e_byzantium').GetAdjective], cung cấp một [army|E] gồm [special_troops|E] khi chiến thắng#!"
  gain_latin_dominion_decision_tt: "Nhận được #high $legitimize_latin_dominion_decision$#! [decision|E]"
  latin_dominion_decision_warning_tt: "#weak Có thể dùng để sáp nhập các [kingdoms|E] [de_jure|E] [GetTitleByKey('e_byzantium').GetAdjective]#!"
  custom.post_byz_greeks: "Mọi [vassal|E] từng là [GetTitleByKey('e_byzantium').GetAdjective]"
  restore_byz_empire_notification_tt: "Có thể dùng #high $recreate_byzantine_empire_decision$#! [decision|E], nếu sở hữu [GetTitleByKey('c_byzantion').GetName]"
  gain_expunge_latins_decision_tt: "Nhận được #high $expunge_latin_dominion_decision$#! [decision|E]"
  expunge_latins_decision_warning_tt: "#weak Có thể dùng để tái chiếm các [kingdoms|E] [de_jure|E] [GetTitleByKey('e_latin_empire').GetAdjective]#!"

  ep3_frankokratia_events.0110.t: "[GetTitleByKey('e_byzantium').GetNameNoTooltip] — Bị Chiếm Đoạt!"
  ep3_frankokratia_events.0110.desc: "Cuộc chiến chống lại người Frank đã thất bại.\n\nTừ kinh đô rò rỉ tin tức về một nền hòa bình thương lượng; về vị [emperor.GetTitledFirstNameRegnal] mới được dựng lên — một cơn điên loạn trong sắc Tía thiêng liêng — bị lũ Latin hôi hám bọc giáp xích lôi đi diễu hành. Ta còn nghe đến [financier.GetTitleAsName] của [financier.GetPrimaryTitle.GetNameNoTier]: một [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')] loài rắn, phun lời sỉ nhục vào các đại thần đế quốc, áp đặt thêm cống nạp.\n\nĐạo quân Thập Tự vẫn còn ngoài tường thành. Có điều gì khiến chúng rút đi không? Hay chỉ còn sự diệt vong hoàn toàn của chúng ta...?"
  ep3_frankokratia_events.0110.a: "Ta sẽ gìn giữ truyền thống đế quốc, dù điều gì xảy ra."
  ep3_frankokratia_events.0110.b: "Ta nên tìm kiếm sự bảo hộ của [daddy.GetTitledFirstNamePossessiveNoTooltip]."
  ep3_frankokratia_events.0110.c: "[daddy_2.GetTitledFirstNameNoTooltip] có đủ sức vượt qua cơn bão này..."
  ep3_frankokratia_events.0110.d: "Sớm thôi, có lẽ... ta sẽ đứng một mình, không ràng buộc."

  previous_emp_will_join_court_tt: "[previous_holder.GetShortUIName] sẽ sớm gia nhập [court|E] của Ngài (#high Ngài#! từng là [vassal|E] được [previous_holder.GetHerHis] sủng ái nhất)"
  frankokratia_former_emp_courtier.t: "Chúa Tể Bị Phế Truất Gia Nhập Triều Đình"
  byz_become_independent_tt: "Ngài sẽ trở thành một [ruler|E] độc lập"
  gain_byz_kingdom_tt: "Ngài sẽ nhận được [byz_kingdom.GetName]"
  byz_remain_admin_tt: "Ngài sẽ giữ lại [government|E] [administrative|E]"
  byz_vassals_may_join_tt: "Các [vassals|E] lân cận có thể chọn Ngài làm [liege|E]"
  if_byz_dissolves_tt: "@warning_icon! #X Nếu [GetTitleByKey('e_byzantium').GetName] tan rã:#!"
  become_daddys_vassal_tt: "Ngài sẽ trở thành [vassal|E] của #high [daddy.GetNamePossessive]#!"
  become_daddy_2_vassal_tt: "Ngài sẽ trở thành [vassal|E] của #high [daddy_2.GetNamePossessive]#!"
  byz_become_feudal_or_clan_tt: "Ngài sẽ chuyển sang [government|E] [feudal|E] hoặc [clan|E]"
  frankokratia_lose_domicile_tt: "@warning_icon! #X [domicile|E] của Ngài sẽ bị mất#!"
  remain_daddys_vassal_tt: "Ngài sẽ tiếp tục là [vassal|E] của [daddy.GetShortUINamePossessive]"
  remain_daddy_2_vassal_tt: "Ngài sẽ tiếp tục là [vassal|E] của [daddy_2.GetShortUINamePossessive]"
  greeks_more_likely_to_vassalize_tt: "Người Hy Lạp và các [cultures|E] hậu duệ của họ sẽ dễ chấp nhận [vassalization|E] hơn"
  latin_emp_simp_modifier: "Kẻ Bắt Chước Người Hy Lạp"
  latin_emp_simp_modifier_desc: "Các hiệp sĩ Latin của vị quân chủ này tỏ rõ sự khinh miệt; chư hầu của ông ta thì than thở về những quyền lợi và tự do bị tước đoạt bởi sự mô phỏng chế độ Hy Lạp tập quyền."

  ep3_frankokratia_events.0120.t: "Con Đường Của Hoàng Đế"
  ep3_frankokratia_events.0120.hippodrome: "Ta là chủ nhân của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], vừa mỹ lệ vừa hoang tàn. [Glossary( 'Blachernae Palace', 'BLACHERNAE_PALACE_GLOSS')], Hagia Sophia, Trường Đua cổ xưa..."
  ep3_frankokratia_events.0120.estate: "Ta là chủ nhân của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], và có thể tùy ý lựa chọn cung điện. Tiền sảnh đá cẩm thạch, tranh ghép vàng rực, những bức tường được thần ý che chở..."
  ep3_frankokratia_events.0120.desc: "khi ta phóng tầm mắt ra xa, ta được một sinh vật của bộ máy quan liêu Hy Lạp khai sáng. Nhưng [eunuch.GetTitledFirstName], hoạn quan khôn ngoan ấy, lại trở nên táo bạo.\n\n\"Suốt hàng thế kỷ, các Basileus vinh quang của chúng ta nắm giữ quyền lực như vậy! Ngài có thể tưởng tượng không, [ROOT.Char.GetLadyLord], khi toàn cõi vương quốc chờ đợi từng sắc lệnh của ngài? Ngay cả khi không có huyết thống hay chiến lợi phẩm để ban phát?\"\n\nQuyền lực thật sự! Nhưng liệu các chư hầu Latin của ta, bầy chó săn được thả lỏng, có chịu dừng việc cướp bóc các chức vị Hy Lạp không? Liệu chúng có chịu mang chiếc vòng cổ Hy Lạp chật chội ấy không...?"
  ep3_frankokratia_events.0120.a: "Có #EMP một#! hay #EMP hai#! thói quen Hy Lạp mà ta ngưỡng mộ..."
  ep3_frankokratia_events.0120.a.flavor: "#EMP ...những hình phạt ghê rợn của họ!#! Nỗi sợ trước quyền lực đế quốc! Hãy để lễ nghi Hy Lạp làm đầy kho bạc của ta!"
  ep3_frankokratia_events.0120.b: "Ta sẽ hạ mình tin tưởng người Hy Lạp, và con đường của họ..."
  ep3_frankokratia_events.0120.b.flavor: "Cầu mong nó khoác lên ta hào quang cổ xưa!"
  ep3_frankokratia_events.0120.c: "Chúng ta, người Latin, đã đến. Tất cả nơi này — là của chúng ta!"
  ep3_frankokratia_events.0120.c.flavor: "Chúng ta sẽ cai trị, thờ phụng và cướp bóc theo ý mình!"
  emulating_byz_punishment_tt: "Các Hoàng đế [GetTitleByKey('e_latin_empire').GetAdjective] và [vassals|E] của họ có thể Thiến hoặc Làm Mù [prisoners|E]"
  latin_emp_enables_byz_punishment_t: "[latin_emp.GetTitleAsNameNoTooltip] Tán Thành Tra Tấn Kiểu Hy Lạp"
  latin_emp_enables_byz_punishment_desc: "Muốn khuất phục lũ Hy Lạp hiểm độc, chúng ta phải tàn nhẫn hơn cả họ."

  ep3_frankokratia_events.0121.opening: "[ROOT.Char.GetTitledFirstNameRegnal], chư hầu mới của ta,"
  ep3_frankokratia_events.0121.intro: "Những kẻ từng là lữ khách cầm vũ khí như chúng ta giờ nhận ra rằng, tại các lãnh địa mới, chúng ta bị áp đảo về số lượng.\n\n"
  ep3_frankokratia_events.0121.desc_torture: "Nhưng liệu lũ Hy Lạp đâm sau lưng ấy có đủ dũng khí để sánh với chúng ta? Chúng có đủ quyết tâm để ngăn ta chiếm lấy toàn bộ [latin_emp.GetPrimaryTitle.GetTierAsName] không?\n\nChúng ta phải bẻ gãy chúng. Phải tàn nhẫn như chính chúng."
  ep3_frankokratia_events.0121.desc: "Nhưng nơi đây — là những kho báu khổng lồ chờ bị đoạt lấy! Đừng kìm nén trái tim rực lửa của ngươi: hãy làm mọi điều cần thiết để phồn thịnh trên mảnh đất này. Đừng để tên quan liêu Hy Lạp hèn hạ hay kẻ trụy lạc lắm tiền cản đường ngươi!"
  ep3_frankokratia_events.0121.a: "Ta đến đây để tìm phần thưởng! Ta sẽ không dễ bị lay chuyển!"
  ep3_frankokratia_events.0121.a.flavor: "Các [ROOT.Char.GetLiege.Custom('KnightCulturePluralNoTooltip')|l] của ta sẽ giáng xuống toàn bộ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
  ep3_frankokratia_events.0130.t: "Sự Phục Hưng [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]"
  ep3_frankokratia_events.0130.desc: "Một vương quốc cổ kính! Ngôi sao Bắc Đẩu dẫn lối mọi linh hồn Kitô giáo! Một khối vàng rực đứng sừng sững tại giao điểm của thế giới. Khi thì thế này, khi thì thế khác, và thường xuyên là ổ rắn độc: dù từng là gì, thì nay — một lần nữa — [GetTitleByKey('e_byzantium').GetName] đã trở lại.\n\nĐây là một thời đại tăm tối và nhục nhã đối với dân chúng [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] tan nát. Thế nhưng, khi tro tàn của cuộc chinh phục Latin đã nguội lạnh, ánh sáng và hy vọng lại trỗi dậy. Có lẽ chẳng bao lâu nữa, tất cả sẽ tụ hội dưới quyền cai trị của [byz_emperor.GetTitledFirstNameRegnal]!\n\n"
  ep3_frankokratia_events.0130.latin_emp: "Và thế nhưng... một kẻ tiếm quyền, [latin_emperor.GetPrimaryTitle.GetAdjective] [latin_emperor.GetTitleAsName], vẫn ngoan cố chống đối. Từ [latin_emperor.GetCapitalLocation.GetName], triều đình của [latin_emperor.GetHerHis] ném những lời nguyền rủa lên lễ đăng quang lịch sử này..."
  ep3_frankokratia_events.0130.unopposed: "Các đối thủ Latin cùng tham vọng của chúng đã bị ném vào bãi rác của lịch sử. Một kỷ nguyên [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] mới bắt đầu."
  ep3_frankokratia_events.0130.a: "Vĩnh biệt #EMP Frankokratia#!."

  msg_greek_anarchy_cb_loss.t: "Tình Trạng Hỗn Loạn Hy Lạp Chấm Dứt"
  msg_greek_anarchy_cb_loss.desc: "Sự bất ổn bạo lực khởi nguồn từ sự sụp đổ của [GetTitleByKey('e_byzantium').GetName] dần mất đi ý nghĩa."
  lose_greek_anarchy_cb_tt: "Casus Belli #high Chiếm Đoạt Công Quốc Đế Quốc#! không còn khả dụng"
