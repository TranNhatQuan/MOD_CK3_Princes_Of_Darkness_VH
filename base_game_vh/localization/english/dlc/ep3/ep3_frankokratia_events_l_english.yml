  imperial_capital_sacked_fervor_gain: "Một kinh đô Kitô giáo vĩ đại đã bị người Công giáo tàn phá dã man"

  ep3_frankokratia_events.0060.t_latin_empire: "Frankokratia"
  ep3_frankokratia_events.0060.t: "Đại bàng vẫn còn tung cánh"
  ep3_frankokratia_events.0060.desc_latin_empire: "[GetTitleByKey('e_byzantium').GetName|U] không còn nữa. Vị quân chủ toàn năng của nó, kẻ từng tự nhận là người thừa kế La Mã, đã bị phế truất. Những cung điện và thánh đường tráng lệ âm ỉ cháy. Xác chết thối rữa thành từng đống lớn. Hỗn loạn bao trùm một cõi bị nghiền nát.\n\nGiữa đống tro tàn ấy, [latin_emperor.GetPrimaryTitle.GetNameNoTier] được tôn xưng — nhân danh Chúa Kitô và [pope.GetTitledFirstName].\n\nMột thời đại hiểm nguy, chia rẽ bắt đầu trên vùng đất của người Hy Lạp."
  ep3_frankokratia_events.0060.desc_paid: "Một tân quân chủ ngự giữa những xa hoa độc nhất vô nhị của [claimant.GetCapitalLocation.GetTitle.GetNameNoTier], được dựng lên bằng vũ lực Latinh và — ít nhất là lúc này — bị thần dân của [claimant.GetHerHis] miễn cưỡng phục tùng: [claimant.GetName].\n\nNgập tràn trong của cải mà vị [claimant.GetTitleAsNameNoTooltip] mới này có thể gom góp, chỉ huy các đội quân [claimant.GetPrimaryTitle.GetAdjective], các Thập tự quân cuối cùng cũng quay ánh mắt sang nơi khác."
  ep3_frankokratia_events.0060.desc_leave_unpaid: "Một vị chủ quyền mới ngồi giữa những sự xa hoa không thể so sánh được của [claimant.GetCapitalLocation.GetTitle.GetNameNoTier], được đặt vào vị trí bởi vũ khí Latin và bị tuân theo một cách miễn cưỡng — vào lúc này — bởi các thần dân của [claimant.GetHerHis]: [claimant.GetName].\n\nVới niềm tin xứng đáng với những người tiền nhiệm của [claimant.GetHerHis], [claimant.GetTitleAsNameNoTooltip] mới này đã #EMP từ chối#! các yêu cầu của Thập tự quân. Những con chó săn đã chiến đấu và gầm gừ cho [claimant.GetHerHim] đã bị xua đi trong tình trạng đói khát.\n\nMột vị quân chủ mới trị vì, đúng vậy... nhưng người ta vẫn phải tự hỏi tại sao những Thập tự quân lầm lạc lại chọn con đường như vậy, tìm kiếm sự cứu rỗi...?"
  ep3_frankokratia_events.0060.desc_loss: "#EMP \"Hãy ca ngợi [defender.GetTitledFirstName], đấng mang lại chiến thắng! [defender.GetTitleAsNameNoTooltip]! [defender.GetTitleAsNameNoTooltip]!\"#!\n\nKhúc ca này vang khắp [defender.GetPrimaryTitle.GetNameNoTier] — quân chủ của họ đã đẩy lùi các Thập tự quân Latinh trở về biển cả. Với yêu sách của [claimant.GetNamePossessive] đối với Byzantium hùng mạnh, dường như ân sủng của Chúa đã tỏ ra khá hạn chế.\n\nMột nỗi nhục nhã nặng nề cho những kẻ phiêu lưu dám tự cho mình hiểu được ý chí của Đấng Toàn Năng..."
  ep3_frankokratia_events.0060.a: "Quả là một cuộc tái hợp của Kitô hữu phương Đông và phương Tây."
  latin_emp_title_gain_tooltip: "[latin_emperor.GetShortUIName|U] đã tạo lập [latin_emperor.GetPrimaryTitle.GetName]"
  latin_emp_lesser_gains_tooltip: "[latin_emperor.GetShortUIName|U] giành được [latin_kingdom_1.GetName] và các [titles|E] nhỏ hơn"
