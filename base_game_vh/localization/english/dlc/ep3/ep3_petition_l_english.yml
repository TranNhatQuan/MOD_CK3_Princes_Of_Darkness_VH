  petition_liege.9001.admin_request_court_position: "Bổ nhiệm thành viên gia tộc Ta vào một chức vụ triều đình."
  petition_liege.9001.petition_liege_governorship: "Giao một chức Tổng Trấn cho thành viên gia tộc Ta."
  petition_liege.9001.admin_request_council: "Ban ghế [council|E] cho thành viên [house|E]"
  petition_liege.0101.t.court_position: "$petition_liege_header$ Chức Vụ Triều Đình"
  petition_liege.0101.t.governorship: "$petition_liege_header$ Tổng Trấn"
  petition_liege.0101.t.house_governorship_rights: "$petition_liege_header$ Quyền Tổng Trấn Gia Tộc"
  petition_liege.0101.desc.council_seat_family: "xin [petition_liege.GetLadyLord] của ta, hãy để [petition_char.Custom2('RelationToMeShort', petition_char)] của ta ngồi vào hội đồng của ngài.\n\n\"[petition_char.GetHerHis|U] tài năng đang bị ngó lơ trong khi những kẻ [petition_char.GetWomenMen] kém cỏi hơn lại được lắng nghe ở những tầng lớp cao nhất; [petition_char.GetSheHe] sẽ chia sẻ những gánh nặng của vương quốc với tư cách là [petition_char.Custom('GetCouncilPositionRequest')] của ngài.\""
  petition_liege.0101.desc.court_position: "xin người, thưa [petition_liege.GetLadyLord], hãy chấp nhận sự phục vụ của Ta tại triều đình."\n\n"Tài năng của Ta đang bị lãng phí, thay vì được dùng để phục vụ lợi ích của người.""
  petition_liege.0101.desc.court_position_family: "xin [petition_liege.GetLadyLord] của ta, hãy chấp nhận [petition_char.GetName] vào triều đình của ngài.\n\n\"[petition_char.GetSheHe|U] là một tài năng lớn, nhưng [petition_char.GetSheHe] sẽ phục vụ tốt hơn trong triều đình của ngài thay vì của ta.\""
  petition_liege.0101.desc.governorship: "xin người, thưa [petition_liege.GetLadyLord], người có thể ban cho Ta một chức Tổng Trấn không?"\n\n"Ta vô cùng khao khát được phụng sự lãnh thổ, và thẳng thắn mà nói, tài năng của Ta đang bị lãng phí. Với một tỉnh trong tay, Ta có thể phục vụ lợi ích của người tốt hơn.""
  petition_liege.0101.desc.governorship_family: "xin [petition_liege.GetLadyLord] của ta, ngài có thể ban cho [petition_char.GetName] một chức tổng trấn không?\n\n\"[petition_char.GetSheHe|U] vô cùng khao khát được phục vụ vương quốc, và nói thật thì thật lãng phí khi để [petition_char.GetHerHim] phải đợi chờ ta. [petition_char.GetSheHe|U] xứng đáng có một tỉnh lỵ của riêng [petition_char.GetHerHis] để phục vụ lợi ích của ngài.\""
  petition_liege.0101.desc.house_governorship_rights: "xin người, thưa [petition_liege.GetLadyLord], người có thể ban cho Gia Tộc [petition_vassal.GetHouse.GetBaseName] quyền tiếp tục cai quản [petition_vassal.GetPrimaryTitle.GetAdjective] [petition_vassal.GetPrimaryTitle.GetTierAsNameNoTooltip] không?"\n\n"Gia đình Ta đã quản lý khu vực này rất tốt với tư cách là thần dân trung thành của người, và chỉ mong được tiếp tục như vậy.""
  petition_liege.0101.accept.council_seat_family: "Được thôi, [petition_char.GetFirstNameNoTooltip] sẽ có ghế trong hội đồng của ngươi."
  petition_liege.0101.accept.council_seat_family_occupied: "[petition_char.GetFirstNameNoTooltip] sẽ thay thế [second_party.GetTitledFirstNameNoTooltip] làm [second_party.GetCouncilTitle] của ta."
  petition_liege.0101.accept.court_position: "Được thôi, ngươi sẽ phục vụ ta."
  petition_liege.0101.accept.court_position_family: "Được thôi, [petition_char.GetSheHe] sẽ phục vụ ta."
  petition_liege.0101.accept.governorship: "Ngươi sẽ cai quản [duchy_governorship.GetNameNoTierNoTooltip]."
  petition_liege.0101.accept.governorship_family: "[petition_char.GetFirstNameNoTooltip|U] sẽ cai quản [duchy_governorship.GetNameNoTierNoTooltip]."
  petition_liege.0101.accept.house_governorship_rights: "Gia tộc [petition_vassal.GetHouse.GetBaseNameNoTooltip] sẽ được ưu tiên trước."
