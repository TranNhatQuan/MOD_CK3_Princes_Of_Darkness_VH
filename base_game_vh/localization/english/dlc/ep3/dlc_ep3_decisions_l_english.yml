  humiliate_the_stooge_decision_desc: "Dù là trứng thối, rau củ mục nát, hay những lời lăng mạ cay độc, dân chúng lúc nào cũng khát khao được chứng kiến một màn bêu riếu công khai."
  humiliate_the_stooge_decision_confirm: "Ha, #EMP ha!#!"
