  artifact_wall_court_icon_large_name: "Thánh Tượng Lớn"
  artifact_wall_court_icon_large_description: "Một thánh tượng uy nghiêm, được vẽ theo phong cách truyền thống của Giáo hội Chính Thống, mô tả một cảnh tôn giáo trang nghiêm: [owner.Custom('RandomIconTopic')]."
  artifact_wall_court_icon_small_name: "Thánh Tượng Nhỏ"
  artifact_wall_court_icon_small_description: "Một thánh tượng nhỏ nhưng đầy sức gợi, được vẽ theo phong cách truyền thống của Giáo hội Chính Thống, mô tả bằng màu sắc sống động một cảnh tôn giáo: [owner.Custom('RandomIconTopic')]"
  artifact_trinket_icon_name: "Thánh Tượng Cầm Tay"
  artifact_trinket_icon_description: "Một thánh tượng cầm tay, được vẽ theo phong cách quen thuộc của Giáo hội Chính Thống, mô tả một cảnh tôn giáo truyền thống: [owner.Custom('RandomIconTopic')]. Dù kích thước nhỏ, nét vẽ vẫn tinh tế, màu sắc rực rỡ và sắc thái trang nghiêm."
  commission_icon_decision_effect: "Một họa sĩ địa phương được triệu đến để tạo ra một Thánh Tượng [artifact|E]"
  ep3_decisions_event.5000.t: "Thánh Tượng Hoàn Thành"
  ep3_decisions_event.5000.desc: "[local_artisan.GetFirstName], họa sĩ mà ta đã giao phó việc vẽ thánh tượng, đã trở lại triều đình để dâng lên thành quả lao động của [local_artisan.GetHerHis].\n\n\"Được [ROOT.Char.GetFaith.HighGodName] chúc phúc, thưa [ROOT.Char.GetTitleAsNameNoTooltip], thần xin khiêm nhường dâng lên ngài thánh tượng thiêng liêng này, được vẽ theo truyền thống và bằng những kỹ năng mà [ROOT.Char.GetFaith.HighGodNameAlternate] đã ban cho thần. Mong rằng nó sẽ luôn soi đường cho ngài trên con đường mộ đạo và chính trực.\""
  ep3_decisions_event.5000.a: "Cảm ơn."
  theotokos: "Đức [Glossary( 'Theotokos', 'THEOTOKOS_GLOSS')]"
  ladder_heaven: "Chiếc Thang Lên Thiên Đàng"
  pantokrator: "Đức Kitô [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')]"
  annunciation: "Lễ Truyền Tin của Tổng Lãnh Thiên Thần Gabriel cho Đức Trinh Nữ Maria"
  saint_peter: "Thánh Phêrô, nghiêm nghị nhìn người đối diện"
  saint_paul: "Thánh Phaolô trong tư thế giảng dạy khắc khổ"
  saint_theodore: "Thánh Theodore trong bộ giáp đầy đủ"
  saint_basil: "Thánh Basil cùng những cuốn sách của mình"
  moses: "Môsê nhận các Bia Luật từ Bụi Gai Bốc Cháy"
  archangel_michael: "Tổng Lãnh Thiên Thần Michael đánh bại Lucifer"
  crucifixion: "Cuộc Đóng Đinh"
  commission_icon_decision: "Ủy Thác Vẽ Thánh Tượng"
  commission_icon_decision_desc: "Việc chiêm ngưỡng và tôn kính nghệ thuật đẹp đẽ giúp chúng ta đến gần Thiên Chúa hơn và củng cố đức tin. Vì vậy, ta nên bảo trợ cho một họa sĩ địa phương để sáng tác một thánh tượng thiêng liêng mới!"
  commission_icon_decision_tooltip: "Ủy thác vẽ một thánh tượng tôn giáo [artifact|E] từ họa sĩ địa phương"
  commission_icon_decision_confirm: "Triệu họa sĩ"
  THEOTOKOS_GLOSS: "“Mẹ Thiên Chúa”, Đức Maria. Trong nghệ thuật thánh tượng, thuật ngữ này chỉ một cảnh rất được nghệ thuật Byzantine ưa chuộng: Đức Maria cho Hài Nhi Giêsu bú hoặc bồng Hài Nhi trong tay."
  PANTOKRATOR_GLOSS: "“Đức Kitô Toàn Năng” hay “Đấng Cai Trị Muôn Loài”. Rất phổ biến trong nghệ thuật thánh tượng Byzantine, mô tả Chúa Giêsu cầm Tân Ước trong một tay và ban phép lành cho người chiêm ngưỡng bằng tay còn lại."
 
 # Hire Chief Eunuch
  hire_eunuch_decision: "Tìm Kiếm $chief_eunuch_court_position$"
  hire_eunuch_decision_desc: "[GetCourtPositionType('chief_eunuch_court_position').GetDescription|U]"
  hire_eunuch_decision_tooltip: "Gia nhân sẽ đề xuất một số ứng viên phù hợp cho vị trí [GetCourtPositionType('chief_eunuch_court_position').GetName()]"
  ep3_decisions_event.5010.t: "Một [GetCourtPositionType('chief_eunuch_court_position').GetNameNoTooltip|U] Xứng Đáng"
  ep3_decisions_event.5010.desc: "Gia nhân của ta đã tìm kiếm khắp nơi để tìm một $chief_eunuch_court_position$ xứng đáng gia nhập triều đình.\n\nĐặc biệt có hai ứng viên gây chú ý: [mediocre_eunuch.GetFirstName] có quyết tâm mãnh liệt để chứng tỏ bản thân, nhưng [good_eunuch.GetFirstName] dường như có kỹ năng vượt trội hơn."
