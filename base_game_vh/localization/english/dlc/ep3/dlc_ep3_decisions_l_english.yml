  ep3_decisions_event.2002.opening: "[confirmation_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
  ep3_decisions_event.2002.desc: "Ta e rằng hiện tại ta quá bận để tổ chức nghi lễ xác nhận. Nhiều trọng trách đang tranh giành thời gian của ta, hẳn ngươi có thể hiểu.\n\nChúc ngươi thượng lộ bình an trở về [confirmation_vassal.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
