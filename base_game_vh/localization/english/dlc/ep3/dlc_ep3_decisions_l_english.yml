  ep3_decisions_event.4060.t: "$major_decisions.0001.t$"
  ep3_decisions_event.4060.desc: "Tái tổ chức một lãnh thổ rộng lớn như [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] không phải là chuyện nhỏ. Thứ từng là mạng lưới trung thành cá nhân nay đã trở thành một quốc gia với các thống đốc và quan chức.\n\n"
  ep3_decisions_event.4060.resistance.desc: "Một số khu vực trong lãnh thổ vẫn chưa bị ảnh hưởng bởi cuộc cải cách này. [obstinate_vassal.GetName] không tin tưởng cả ta lẫn cải cách của ta. Điều này không thể dung thứ lâu dài.\n\n"
  ep3_decisions_event.4060.state_faith.desc: "Một số khu vực trong lãnh thổ vẫn chưa bị ảnh hưởng bởi cuộc cải cách này. [non_state_faith_vassal.GetName] không tin tưởng chính khái niệm quốc giáo và bác bỏ cải cách của ta. Điều này không thể dung thứ lâu dài.\n\n"
  ep3_decisions_event.4060.de_jure.desc: "Một số khu vực trong lãnh thổ vẫn chưa bị ảnh hưởng bởi cuộc cải cách này. [non_de_jure_vassal.GetPrimaryTitle.GetNameNoTooltip|U] nằm ngoài quốc gia mới mà ta đã xây dựng. Điều này không thể dung thứ lâu dài.\n\n"
  ep3_decisions_event.4060.outro.desc: "Khi chủ nghĩa pháp trị lan rộng khắp lãnh thổ, những khái niệm về gia tộc và chư hầu chắc chắn sẽ dần nhường chỗ cho tinh thần công dân và sự tập trung quyền lực."
  ep3_decisions_event.4060.a: "Luật pháp giờ đây cai trị những vùng đất này!"

  ep3_decisions_event.4065.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
  ep3_decisions_event.4065.desc: "Lãnh thổ đang được tái tổ chức, với năng lực làm kim chỉ nam. Không còn chỗ cho những kẻ nắm giữ đất đai theo huyết thống.\nTa mong mọi chư hầu sẽ tuân theo và gia nhập hàng ngũ Thống Đốc của ta."
  ep3_decisions_event.4065.a: "Vì [actor.GetPrimaryTitle.GetNameNoTierNoTooltip|l]!"
  ep3_decisions_event.4065.b: "Ta sẽ không từ bỏ quyền lợi của mình."
  ep3_decisions_event.4065.c: "Thú vị đấy."

  convert_to_feudalism_from_administrative_decision: "Áp Dụng Thể Chế [ROOT.Char.Custom('GetTribalReformGovernment')|U]"
  convert_to_feudalism_from_administrative_decision_desc: "Ít quan liêu hơn và nhiều #EMP hành động#! hơn — đó mới là điều vương quốc này cần. Nếu [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l] muốn hưng thịnh, chúng ta phải cắt đứt với những thứ đang kìm hãm mình."
  convert_to_feudalism_from_administrative_decision_confirm: "Áp dụng thể chế [ROOT.Char.Custom('GetTribalReformGovernment')|U]"
  convert_to_feudalism_from_administrative_decision_tooltip: "Thay đổi loại hình [government|E]"
  you_have_governorship_rights_tt: "Ngài đã được [liege|E] cấp #high Đặc quyền Gia tộc Tỉnh#! trong [GetPlayer.Custom('GetProvinceConcept')] mà ngài đang nắm giữ thông qua [decision|E] [GetDecisionWithKey('petition_liege_decision').GetName]"
  governorship_is_on_the_border_tt: "[GetPlayer.Custom('GetProvinceConcept')] của Ngài giáp với một [realm|E] khác"

  ep3_decisions_event.4070.t: "$major_decisions.0200.t$"
  ep3_decisions_event.4070.desc: "Đôi khi, quay lại với những giá trị đã được kiểm chứng là điều đúng đắn.\n\nTrong khi mô hình hành chính chỉ gây cản trở cho [actor.GetPrimaryTitle.GetNameNoTierNoTooltip|l], lối sống cũ mang lại những lợi ích không thể phủ nhận cùng một cấu trúc truyền thống giúp chúng ta vươn tới những tầm cao mới."
  ep3_decisions_event.4070.a: "Chúng ta phải thích nghi với hoàn cảnh thay đổi."

  ep3_decisions_event.4075.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
  ep3_decisions_event.4075.a: "$ep3_decisions_event.4065.a$"
 # Gather Provisions
  gather_provisions_decision: "Thu Gom Lương Thực"
  gather_provisions_decision_desc: "Giống như quân đội, doanh trại cũng hành quân bằng cái bụng của mình. Khi cần thiết, vùng hoang dã quanh [ROOT.Char.GetCurrentLocation.GetName] có thể được lục soát để tìm thức ăn."
  gather_provisions_decision_tooltip: "Lùng sục đất đai để tìm [provisions|E]"
  gather_provisions_decision_confirm: "Làm ơn đừng lại là súp tầm ma..."
  gather_provisions_decision_effect_tt: "Ngài, [GetCourtPositionType('chief_forager_camp_officer').GetName()], hoặc [GetCourtPositionType('huntperson_camp_officer').GetName()] của Ngài có thể tìm kiếm [provisions|E]"
  gather_provisions_decision_unlock_tt: "Yêu cầu có [domicile_building|E] [GetDomicileBuilding('mess_tent_01').GetName]"
  ep3_decisions_event.7000.t: "Nguồn Lộc của [forage_province.GetNameNoTooltip]"
  ep3_decisions_event.7000.desc: "Bước ra khỏi doanh trại, ta quan sát vùng [forage_province.Custom('TerrainTypeProvince')] xung quanh, tìm kiếm bất kỳ dấu hiệu nào của con mồi hay thức ăn.\n\n"
  ep3_decisions_event.7000.winter_forage: "[forage_province.GetName] có thể hào phóng hơn vào mùa thuận lợi, nhưng cái lạnh khắc nghiệt của mùa đông làm cứng mặt đất [forage_province.Custom('GetProvinceGroundDesc')], và bao phủ [forage_province.Custom('GetTerrainTypePlural')] trong sương giá. Chúng ta sẽ chẳng tìm được bao nhiêu ở đây..."
  ep3_decisions_event.7000.difficult_forage: "Lục soát [forage_province.Custom('GetProvinceGroundDesc')] và [forage_province.Custom('GetTerrainTypePlural')] của [forage_province.GetName] chẳng mang lại hy vọng gì: nơi này trống rỗng, không có thứ gì xứng đáng cho cái bụng của chúng ta. Hy vọng tốt nhất là đi săn."
  ep3_decisions_event.7000.difficult_hunt: "Dù quanh [forage_province.GetName] có không ít nấm, rễ cây và quả dại, đây không phải thiên đường của thợ săn. Không thấy nổi một con thỏ."
  ep3_decisions_event.7000.good: "Chúng ta thật may mắn: khí hậu của [forage_province.GetName] ôn hòa và trù phú. Quà tặng của thiên nhiên tràn ngập khắp [forage_province.Custom('GetTerrainTypePlural')]. Chúng ta sẽ sống tốt ở đây."
  ep3_decisions_event.7000.fallback: "[forage_province.GetName] sẽ đãi ngộ chúng ta tử tế. [forage_province.Custom('GetTerrainTypePlural')] tràn đầy sức sống, chỉ cần dành đủ thời gian và cẩn trọng là có thể tìm được thức ăn."
  ep3_decisions_event.7000.a: "Ta có thể kiếm được chút gì đó để ăn."
  ep3_decisions_event.7000.a_foraging: "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
  ep3_decisions_event.7000.a_flavor: "#medium Việc hái lượm bị ảnh hưởng bởi [terrain|E] và [winter|E]\n#flavor Rất hiệu quả tại:#!\n     $EFFECT_LIST_BULLET$Đất Canh Tác, Rừng, Đồi, Đồng Bằng, Ốc Đảo, Đồng Bằng Ngập Lụt\n#flavor Hiệu quả vừa phải tại:#!\n    $EFFECT_LIST_BULLET$Vùng Khô Hạn, Núi, Rừng Rậm, Đầm Lầy, Thảo Nguyên\n#flavor Không hiệu quả tại:#!\n    $EFFECT_LIST_BULLET$Sa Mạc, Núi Sa Mạc, Taiga#!"
  ep3_decisions_event.7000.a_flavor_golden_aplomb: "#medium Việc hái lượm bị ảnh hưởng bởi [terrain|E] và [winter|E]\n#flavor Rất hiệu quả tại:#!\n     $EFFECT_LIST_BULLET$Đất Canh Tác, Rừng, Đồi, Đồng Bằng, Ốc Đảo,\n     $EFFECT_LIST_BULLET$Đồng Bằng Ngập Lụt, Vùng Khô Hạn, Núi, Rừng Rậm, Đầm Lầy, Thảo Nguyên (nhờ [perk|e] [GetPerk('golden_aplomb_perk').GetName(GetPlayer)])\n#flavor Không hiệu quả tại:#!\n    $EFFECT_LIST_BULLET$Sa Mạc, Núi Sa Mạc, Taiga#!"
  ep3_decisions_event.7000.b_trapping: "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
  ep3_decisions_event.7000.b_flavor: "#medium Đặt bẫy bị ảnh hưởng bởi [terrain|E]\n#flavor Rất hiệu quả tại:#!\n     $EFFECT_LIST_BULLET$Rừng Rậm, Rừng, Đồi, Đồng Bằng, Ốc Đảo, Vùng Khô Hạn\n#flavor Hiệu quả vừa phải tại:#!\n    $EFFECT_LIST_BULLET$Sa Mạc, Núi Sa Mạc, Núi, Taiga, Thảo Nguyên\n#flavor Không hiệu quả tại:#!\n    $EFFECT_LIST_BULLET$Đất Canh Tác, Đồng Bằng Ngập Lụt, Đầm Lầy#!"
  ep3_decisions_event.7000.b_flavor_golden_aplomb: "#medium Đặt bẫy bị ảnh hưởng bởi [terrain|E]\n#flavor Rất hiệu quả tại:#!\n$EFFECT_LIST_BULLET$Rừng Rậm, Rừng, Đồi, Đồng Bằng, Ốc Đảo, Vùng Khô Hạn, Sa Mạc, Núi Sa Mạc, Núi, Taiga, Thảo Nguyên (nhờ [perk|e] [GetPerk('golden_aplomb_perk').GetName(GetPlayer)])\n#flavor Không hiệu quả tại:#!\n    $EFFECT_LIST_BULLET$Đất Canh Tác, Đồng Bằng Ngập Lụt, Đầm Lầy#!"
  ep3_decisions_event.7000.a.crit_success: "Ngài mang về rất nhiều thức ăn"
