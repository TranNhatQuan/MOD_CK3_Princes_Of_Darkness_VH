 # The Knight of the Swan
  knight_errant_decision: "$knight_culture_player_no_tooltip$ của [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|U]"
  knight_errant_decision_desc: "Người ta kể rằng có một $knight_culture_player_no_tooltip_lowercase$ bí ẩn, đến cứu giúp những kẻ lâm nguy trên một chiếc thuyền do [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')] kéo.\n\nMột con thuyền nhỏ ánh ngọc trai, và một $knight_culture_player_no_tooltip_lowercase$ oai nghiêm ngồi bên trong."
  knight_errant_decision_tooltip: "Trở thành một [GetTrait('knight_errant').GetName( GetNullCharacter )]"
  knight_errant_decision_confirm: "Người giỏi nhất trong số những người cùng cảnh ngộ của [ROOT.Char.GetHerHis]."
  knight_errant_decision_effect_tt: "$knight_errant_decision_tooltip$"
