  ep3_decisions_event.2001.opening: "Xin chào, [ROOT.Char.GetTitleAsNameNoTooltip] vinh hiển,"
  ep3_decisions_event.2001.desc: "Ta đã đến [confirmation_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] để xin ngài xác nhận việc Ta tiếp tục được bổ nhiệm làm [confirmation_vassal.GetTitleAsNameNoTooltip] của [confirmation_vassal.GetPrimaryTitle.GetName].\n\nTa xin chờ theo thời gian thuận tiện nhất của ngài."
  ep3_decisions_event.2001.a: "Lập tức sắp xếp nghi lễ."
  ep3_decisions_event.2001.a.tt.court: "Ngài tiếp [confirmation_vassal.GetTitledFirstName] tại [royal_court|E] của mình"
  ep3_decisions_event.2001.a.tt: "Ngài tiếp [confirmation_vassal.GetTitledFirstName]"
  ep3_decisions_event.2001.b: "Ta quá bận để gặp #EMP [confirmation_vassal.GetHerHim]#!."
