 # Liege Event
  ep3_decisions_event.2010.t: "$admin_confirmation_event_header$  Bề Tôi Của Đế Quốc"
  ep3_decisions_event.2010.desc: "Các quan chức trong cung điện chen chúc trong [ROOT.Char.Custom('GetThroneRoom')], nơi một hàng dài những người được bổ nhiệm bởi đế quyền đang chờ đợi.\n\nNổi bật nhất trong số đó là [confirmation_vassal.GetTitledFirstName] [confirmation_vassal.GetDynastyHouseName], người đã vượt đường xa từ [confirmation_vassal.GetCapitalLocation.GetNameNoTooltip] đến đây. [ROOT.Char.Custom2('RelationToMeShort', confirmation_vassal)] của ta đang cai quản [confirmation_vassal.GetPrimaryTitle.GetName]:"
  ep3_decisions_event.2010.desc_theme_civilian: "một trung tâm sản xuất và thương mại sầm uất,"
  ep3_decisions_event.2010.desc_theme_military: "một vùng đất bị chi phối bởi doanh trại ồn ào và binh sĩ luyện tập,"
  ep3_decisions_event.2010.desc_theme_frontier: "một khu biên cương gồ ghề và là một trong những thành lũy lớn của lãnh thổ,"
  ep3_decisions_event.2010.desc_theme_imperial: "một viên ngọc của lãnh thổ, được ban cho nhiều đặc quyền hiếm có,"
  ep3_decisions_event.2010.desc_theme_naval: "một vùng duyên hải với xưởng đóng tàu và bến cảng,"
  ep3_decisions_event.2010.desc_theme_small: "một lãnh địa nhỏ ít quan trọng,"
  ep3_decisions_event.2010.desc_theme_big: "một khu vực rộng lớn có tầm quan trọng đáng kể,"
  ep3_decisions_event.2010.desc_theme_balanced: "một vùng đất quy mô vừa, mang nhiều giá trị đa dạng cho lãnh thổ,"
  ep3_decisions_event.2010.desc_cool_foreigners: "nơi sinh sống của những người [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] đáng tin cậy, thuộc [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun]"
  ep3_decisions_event.2010.desc_weird_foreigners: "nơi sinh sống của những kẻ [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] kỳ lạ, thuộc [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun]"
  ep3_decisions_event.2010.desc_same_culture: "quê hương của những [ROOT.Char.GetCulture.GetCollectiveNoun] tỉnh lẻ"
  ep3_decisions_event.2010.desc_state_faith: "và tín đồ của [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetName] mang tính chất [ROOT.Char.GetPrimaryTitle.GetAdjective]"
  ep3_decisions_event.2010.desc_heretic_faith: "— lũ ngoại đạo [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective] đáng ghê tởm!"
  ep3_decisions_event.2010.desc_accepted_faith: "— cùng các [ROOT.Char.GetFaith.HouseOfWorshipPlural] của đức tin [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective] của họ."
  ep3_decisions_event.2010.desc_my_faith: "— cùng những [ROOT.Char.GetFaith.HouseOfWorshipPlural] tốt đẹp của đức tin chân chính [ROOT.Char.GetFaith.GetAdjective]."
  ep3_decisions_event.2010.desc_hate: "\n\nChỉ cần nhìn xuống phía sau đầu của [confirmation_vassal.GetTitledFirstNamePossessiveNoTooltip], ta cũng có thể cảm nhận được sự khinh miệt cháy bỏng của hắn. [confirmation_vassal.GetWomanMan] lầm bầm những lời thề nguyền [second.Custom('quirk_neg_adverb')]... trong khi mơ tưởng đến việc đánh chết ta bằng quyền trượng chức vụ của [confirmation_vassal.GetHerHis]."
  ep3_decisions_event.2010.desc_love: "\n\n[second.Custom('quirk_pos_adverb')|U], [confirmation_vassal.GetTitledFirstNameNoTooltip] tiến hành nghi lễ. Cầm lấy quyền trượng chức vụ của [confirmation_vassal.GetHerHis], và [second.Custom('quirk_pos_pp')], [second.GetSheHe] thề sẽ tận tâm phụng sự."
  ep3_decisions_event.2010.desc_decrepit: "\n\n[confirmation_vassal.GetHerHis|U] những năm tháng đè nặng như cối xay lên tấm lưng còng của [confirmation_vassal.GetHerHis], [confirmation_vassal.GetTitledFirstNameNoTooltip] gắng gượng đứng dậy từ tư thế cầu nguyện. Vị trưởng lão khôn ngoan này có rất nhiều kinh nghiệm để vận dụng... và, hy vọng là, một vài năm tốt đẹp để làm điều đó."
  ep3_decisions_event.2010.desc_young: "\n\nChỉ mới là một thanh niên trẻ trung, [confirmation_vassal.GetTitledFirstNameNoTooltip] ngâm các nghi lễ với vương trượng quyền lực của [confirmation_vassal.GetHerHis] siết chặt trong những bàn tay mềm mại. Với người này, còn rất nhiều điều cần phải chứng minh..."
  ep3_decisions_event.2010.desc_skilled: "\n\n[confirmation_vassal.GetWomanMan] cầu nguyện trước mặt ta cai trị với một cái chạm [confirmation_vassal.Custom('ComplimentAdjective')]. Dù [confirmation_vassal.GetSheHe] theo đuổi chính trị nào, dù điều gì nằm trong trái tim của [confirmation_vassal.GetHerHis]: [confirmation_vassal.GetTitledFirstNameNoTooltip] là một niềm vinh dự cho [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  ep3_decisions_event.2010.desc_incompetent: "\n\nTheo mọi báo cáo, ta đang xác nhận bổ nhiệm một kẻ quản trị kém cỏi, [second.Custom('quirk_neg_adverb')]. Nhưng việc khước từ [confirmation_vassal.GetTitledFirstNameNoTooltip], khi [confirmation_vassal.GetSheHe] thề hẹn một sự phụng sự hoàn hảo mà [confirmation_vassal.GetSheHe] không thể mang lại, cũng chẳng ích gì..."
  ep3_decisions_event.2010.desc_generic_outro: "\n\n[confirmation_vassal.GetTitledFirstNameNoTooltip] cúi mình thật sâu, cầm lấy quyền trượng biểu trưng cho quyền lực của [confirmation_vassal.GetHerHis], thề sẽ trung thành phụng sự [ROOT.Char.GetTitleAsNameNoTooltip] của [confirmation_vassal.GetHerHis]."
  ep3_decisions_event.2010.a: "\"Hãy cai trị cho tốt, [confirmation_vassal.GetTitleAsNameNoTooltip].\""

 # Vassal Event
  ep3_decisions_event.2011.desc: "Trong [confirmation_liege.Custom('GetThroneRoom')] của cung điện chính tại [confirmation_liege.GetCapitalLocation.GetTitle.GetNameNoTierPossessive], [confirmation_liege.GetTitledFirstNameRegnal] — nhiếp chính trần thế của [confirmation_liege.GetFaith.HighGodNamePossessive] — ngự trị trong vẻ huy hoàng.\n\n"
  ep3_decisions_event.2011.desc_child: "Chờ đợi giữa các đại thần khác, trong khi một đứa trẻ mặt đầy mụn càu nhàu và ngọ nguậy trên ngai của [confirmation_liege.GetHerHis] là điều... khá kỳ quặc."
  ep3_decisions_event.2011.desc_heretic: "Kẻ ngoại đạo cai trị [confirmation_liege.GetPrimaryTitle.GetTierAsName] của [confirmation_liege.GetCapitalLocation.GetCounty.GetFaith.GetAdherentNamePlural]. Ngay cả ở đây, giữa các giáo sĩ và chức sắc triều đình [confirmation_liege.GetFaith.PriestNeuterPlural], bầu không khí vẫn căng thẳng."
  ep3_decisions_event.2011.desc_war: "Khi chúng ta quỳ xuống và nghi lễ bắt đầu, các sĩ quan quân đội thở hắt đầy sốt ruột. Cuộc chiến của họ, dường như, chẳng mấy bận tâm đến vinh dự của chúng ta."
  ep3_decisions_event.2011.desc_poorly_run: "Và mọi thứ diễn ra trong hỗn loạn. Đám gia nhân trong cung điện cười khúc khích khi chúng ta bị thúc ép vào vị trí, và rất ít nghi thức được thực hiện."
  ep3_decisions_event.2011.desc_well_run: "Một hàng quan lại kéo dài vô tận đang chờ đợi; tất cả đều kính sợ, tất cả đều háo hức quỳ gối trước quân vương của chúng ta."
  ep3_decisions_event.2011.desc_gender: "Một [confirmation_liege.GetWomanMan] ngự trên ngai. Thật may mắn là chúng ta — những quan lại đến viếng — bị cấm nhìn thẳng vào quân vương!"
  ep3_decisions_event.2011.desc_typical_palace: "Ta được dẫn vào hàng ngũ các đại thần. Trong tiếng hô vang của đám đông, của nhạc công và sứ giả, đại lễ long trọng của chúng ta bắt đầu."

  ep3_decisions_event.2011.desc_hate: "[confirmation_liege.GetTitleAsNameNoTooltip] nói với ta một cách [second.Custom('quirk_neg_adverb')]; [confirmation_liege.GetSheHe] nhỏ từng giọt khinh miệt lên cái đầu đang cúi lạy của ta, trong khi bảo vật nghi lễ bị treo lơ lửng phía trên.\n\n"
  ep3_decisions_event.2011.desc_love: "Thế nhưng giọng nói của [confirmation_liege.GetTitleAsNamePossessiveNoTooltip] lại ấm áp và [second.Custom('quirk_pos_adjective')] khi [confirmation_liege.GetSheHe] cất lời với ta, và trao cho ta bảo vật nghi lễ.\n\n"
  ep3_decisions_event.2011.desc_meh: "[confirmation_liege.GetTitleAsNameNoTooltip] lần lượt tiếp từng người được bổ nhiệm, ban phát bảo vật và nhận lời thề, cho đến khi [confirmation_liege.GetSheHe] đến lượt ta.\n\n"

  ep3_decisions_event.2011.desc_theme_civilian: "\"Nền hòa bình của [confirmation_liege.GetFaith.PositiveAfterLife] vẫn có thể hiện hữu tại [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" [confirmation_liege.GetSheHe] nói, \"đó là một khu vườn, cần được chăm sóc bằng lòng nhân hậu.\""
  ep3_decisions_event.2011.desc_theme_military: "\"Ngươi phải mài sắc thanh gươm của [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" [confirmation_liege.GetSheHe] nói, \"và chỉ để nó được vung lên bởi những kẻ chính trực.\""
  ep3_decisions_event.2011.desc_theme_frontier: "\"Hãy ngủ ít thôi,\" [confirmation_liege.GetSheHe] ra lệnh, \"Giữ vững chiến tuyến. [confirmation_vassal.GetPrimaryTitle.GetNameNoTier] là nơi mọi thứ thuộc về [confirmation_liege.GetPrimaryTitle.GetAdjective] sống còn hay diệt vong.\""
  ep3_decisions_event.2011.desc_theme_imperial: "\"Tại [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" [confirmation_liege.GetSheHe] nói, \"ngươi phải là hiện thân của chính [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]. Chỉ rất ít người — trừ bọn gian ác — mới được hưởng những đặc quyền như vậy.\""
  ep3_decisions_event.2011.desc_theme_naval: "\"Trong vị mặn nơi bờ biển của [confirmation_vassal.GetPrimaryTitle.GetNameNoTierPossessive],\" [confirmation_liege.GetSheHe] nói, \"hãy ngửi mùi máu của [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]; hãy thấy nước mắt của những góa phụ của nàng.\""
  ep3_decisions_event.2011.desc_theme_small: "\"Một lãnh địa khiêm tốn, [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" [confirmation_liege.GetSheHe] nói, \"nhưng là một lãnh địa xứng đáng.\""
  ep3_decisions_event.2011.desc_theme_big: "\"Một cõi rộng lớn như [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" [confirmation_liege.GetSheHe] nói xen giữa các nghi thức, \"một mãnh thú hùng mạnh, chỉ có thể được thuần phục bởi đúng bậc chủ nhân...\""
  ep3_decisions_event.2011.desc_theme_balanced: "\"Chức vị của ngươi được ban bởi [confirmation_liege.GetFaith.HighGodName] và [confirmation_liege.GetTitleAsNameNoTooltip],\" [confirmation_liege.GetSheHe] nói, \"hãy ghi nhớ điều đó, và cai trị [confirmation_vassal.GetPrimaryTitle.GetNameNoTier] cho tốt.\""
  ep3_decisions_event.2011.desc_outro: "\n\nTa đáp lại đầy đủ mọi nghi thức cần thiết. Và sau khi cúi chào thật sâu trước chúa thượng của mình, cuối cùng ta tiếp nhận vương trượng của quyền lực tỉnh trị."
  ep3_decisions_event.2011.a: "Vạn tuế ngài, [confirmation_liege.GetTitleAsNameNoTooltip]."

