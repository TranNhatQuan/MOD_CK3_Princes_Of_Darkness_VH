  ep3_decisions_event.6001.t: "Người Bảo Vệ Dân Tộc [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]"
  ep3_decisions_event.6001.desc.intro: "Một cơn gió lạnh thổi qua trại. Những [county.Custom('TerrainTypeCountyScope')] trải dài đến vô tận. Đây là nơi ta thuộc về, nơi dân tộc ta thuộc về. Ta hít một hơi thật sâu.\n\n"
  ep3_decisions_event.6001.desc.spouse_common: "\"Tất cả có thể là của anh đấy,\" giọng nói dịu dàng của [spouse.GetFirstName] cắt ngang dòng suy nghĩ của ta."
  ep3_decisions_event.6001.desc.spouse_same_culture: "$ep3_decisions_event.6001.desc.spouse_common$ \"Họ ngưỡng mộ anh, họ sẽ theo anh đến cùng.\""
  ep3_decisions_event.6001.desc.spouse_diff_culture: "\"Dù chính em là người [spouse.GetCulture.GetName], em vẫn biết những người này ngưỡng mộ anh. Trong mắt họ, anh là anh hùng. Đừng làm họ thất vọng.\""
  ep3_decisions_event.6001.desc.no_spouse: "Một kẻ [liege.GetCulture.GetName]? Cai trị dân tộc [ROOT.Char.GetCulture.GetName]? Chỉ nghĩ đến thôi cũng khiến ta ghê tởm. Và ta biết mình không phải người duy nhất.\n\n"
  ep3_decisions_event.6001.desc.outro: "Dù nhìn về đâu, ta cũng biết rằng [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] sẽ không im lặng. Đã đến lúc giành lại những gì thuộc về chúng ta."
  ep3_decisions_event.6001.a: "Ra trận. #EMP Ngay bây giờ.#!"
  ep3_decisions_event.6001.b: "Chúng ta cần chuẩn bị thêm."
  ep3_decisions_event.6001.c: "[liege.GetShortUINameNoTooltip|U] không phải người xa lạ với ta. [liege.GetSheHe|U] sẽ lắng nghe."
  ep3_decisions_event.6001.d: "Ta cần suy nghĩ thêm."
  champion_culture_costs_refunded: "Hoàn lại Chi phí $separatist_uprising_decision$"
  separatist_uprising_decision_top_liege_capital_trigger: "Địa điểm không được là [capital|E] của [top_liege|E] [realm_possessive|E] ([THIS.Char.GetCurrentLocation.GetTitle.GetHolder.GetTopLiege.GetShortUIName])"

  ep3_decisions_event.6002.t: "Lãnh Tụ Được Dân Chúng Tôn Vinh"
  ep3_decisions_event.6002.desc: "\"Vì [ROOT.Char.GetCulture.GetCollectiveNoun]! Vì [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]! Vì #EMP [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], arghhh#!!\"\n\nTa dừng lại một nhịp để lấy hơi, lồng ngực rung lên vì xúc động, giọng nói vẫn còn run rẩy. [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]. Ta không được quên mình đang chiến đấu vì ai.\n\n\"[loser.GetTitledFirstName] đã gục ngã rồi, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" Tiếng hô vang lên từ một cậu bé phủ đầy bùn đất. \"Chúng ta thắng rồi!\""
  ep3_decisions_event.6002.a: "Chúng ta đã tự do."
 
