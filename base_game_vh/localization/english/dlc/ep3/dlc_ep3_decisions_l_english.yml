 # Go Fishing
  go_fishing_decision: "Đi Câu Cá"
  go_fishing_decision_desc: "Ai rồi cũng cần nghỉ ngơi đôi chút. Hãy dành một khoảnh khắc thả cần bên bờ nước tại [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], và để những lo toan của thế gian trôi theo dòng nước. Biết đâu, Ngài lại thu được thứ gì đó cho riêng mình."
  go_fishing_decision_tooltip: "Nghỉ ngơi để giảm một ít [stress_loss_i|E][stress|E]"
  go_fishing_decision_confirm: "Một ngày tuyệt vời để đi câu cá!"
  go_fishing_decision_effect_tt: "Mất [stress_loss_i|E][stress|E] và có cơ hội nhận được một ít [provisions|E]"
  go_fishing_decision_unlock_tt: "Yêu cầu trại của Ngài phải nằm tại một [barony|E] ven biển hoặc ven sông"
  ep3_decisions_event.9001.t: "Đi Câu Cá"
  ep3_decisions_event.9001.desc: "Khi Ta tiến về phía bờ nước, mùi mặn của muối và cá tràn ngập khứu giác. Một vài người vừa thu dọn xong, để lại toàn bộ bờ nước cho riêng Ta. Một ngày thế này không phải lúc nào cũng có, và Ta nên tận dụng nó thật tốt."
  ep3_decisions_event.9001.friend: "\n\nNgười [ROOT.Char.Custom2('RelationToMeShort', potential_friend)] của Ta, [potential_friend.GetName], đã quyết định tham gia cùng hôm nay. Một cơ hội để gắn kết mở ra, hoặc Ta có thể chọn đi câu một mình."
  ep3_decisions_event.9001.fishing: "\n\nMột ngày thư giãn đang chờ đợi!"
  ep3_decisions_event.9001.ice_fishing: "Mặt nước đóng băng mênh mông đang chờ đón chúng Ta, tất cả những gì Ta cần làm là tìm một chỗ thích hợp để đục một lỗ nhỏ."
  ep3_decisions_event.9001.a: "Làn nước đang gọi riêng mình ta."
  ep3_decisions_event.9001.a.tt: "#weak Ta sẽ dành chút thời gian một mình để suy ngẫm.#!"
  ep3_decisions_event.9001.b: "Một cơ hội để dành thời gian bên [potential_friend.GetNameNoTooltip]!"
  ep3_decisions_event.9001.b.tt: "#weak Một khoảnh khắc riêng tư với [potential_friend.GetNameNoTooltip] có thể làm mối quan hệ của chúng Ta thêm sâu sắc.#!"
  ep3_decisions_event.9001.c: "Gần đây có thuyền nào cho thuê không nhỉ?"
  ep3_decisions_event.9001.c.tt: "#weak Câu cá trên thuyền có nhiều khả năng bắt được cá lớn hơn so với đứng trên bờ.#!"

  ep3_decisions_event.9010.t: "Khoảnh Khắc Suy Ngẫm"
  ep3_decisions_event.9010.desc: "Ta hít sâu, rồi thở ra khi thả cần xuống nước. Lưỡi câu chạm mặt nước với một tiếng 'bõm' khẽ, và cả thế giới dường như lắng lại. \n\nÁnh mắt Ta dõi theo đường bờ, tận hưởng khoảnh khắc một mình để sắp xếp lại những suy nghĩ. Cuộc sống của một kẻ phiêu lưu không hẳn là tệ, nhưng chẳng có cuộc đời nào không có áp lực. Ta nhắm mắt nghỉ ngơi trong giây lát thì bất chợt bị giật mạnh khi có thứ gì đó kéo cần câu khỏi tay mình."
  ep3_decisions_event.9010.a: "Nắm chặt và kéo lên!"
  ep3_decisions_event.9010.b: "Để cần câu trượt qua các ngón tay."
  ep3_decisions_event.9010.b.trait: "Sự bình yên bao trùm tâm trí Ngài"
  ep3_decisions_event.9010.b.nothing: "Cần câu trôi xa khỏi Ngài"
 
  ep3_decisions_event.9020.t: "Mối Gắn Kết Qua Cần Câu"
  ep3_decisions_event.9020.desc: "Ta và [potential_friend.GetNameNoTooltip] dạo này dường như rất hợp nhau. Chúng Ta cười trước cùng một câu chuyện, lo lắng về những điều giống nhau, và mối liên kết giữa chúng Ta dường như đã vượt xa mối quan hệ giữa một [ROOT.Char.GetTitleAsNameNoTooltip|U] và người [ROOT.Char.Custom2('RelationToMeShort', potential_friend)].\n\nCả hai cùng thả cần xuống nước và kiên nhẫn chờ cá cắn câu, vừa trò chuyện vừa cười đùa. \n\nChuyến đi này đã chứng minh rằng chúng Ta phối hợp với nhau rất ăn ý, và Ta muốn dành nhiều thời gian hơn bên họ trong tương lai."
  ep3_decisions_event.9020.a: "Vui đến mức suýt quên mất mục đích ban đầu."
  ep3_decisions_event.9020.b: "Khoan đã, có cá cắn câu rồi!"

  ep3_decisions_event.9030.t: "Không Phải Không Có Rắc Rối"
  ep3_decisions_event.9030.desc: "Sau một lúc chèo thuyền, bờ của [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] dần khuất tầm mắt. Chỉ đến lúc này Ta mới nhận ra mình chỉ mang đủ mồi cho đúng một lần thả câu."
  ep3_decisions_event.9030.friend: "\n\nTa quay sang nhìn [potential_friend.GetNameNoTooltip] và thú nhận, nhưng họ dường như chẳng bận tâm.\n\n\"Có sao đâu!\" họ reo lên. \"Chúng ta đến đây để thư giãn mà. Cứ thả câu đi, xem dưới đó có gì!\""
  ep3_decisions_event.9030.a: "Phải làm cho lần này thật đáng giá!"
  ep3_decisions_event.9030.a.fish: "#weak Ngài bắt được một con [ROOT.Char.Custom('GetRegionalFish')]! #!"
  ep3_decisions_event.9030.a.fishfriend: "#weak [potential_friend.GetNameNoTooltip] bắt được một con [ROOT.Char.Custom('GetRegionalFish')]! #!"
  ep3_decisions_event.9030.a.nofish: "#weak Không có gì cắn câu... #!"
  ep3_decisions_event.9030.b: "Ta muốn Ngài thử, [potential_friend.GetNameNoTooltip]."

  butcher_animals_decision_name: "#warning Biện Pháp Tuyệt Vọng — Giết Mổ Động Vật#!"
  butcher_animals_decision_desc: "Chúng ta đói đến kiệt quệ... trong khi thịt thì lại đang theo sát phía sau, tiêu tốn những gì còn sót lại trong nguồn tiếp tế, trung thành lẽo đẽo theo chúng ta đến ngày tận số của nó. Trong những thời khắc tuyệt vọng như thế này, ta buộc phải cân nhắc #EMP mọi#! khả năng."
  butcher_animals_decision_tooltip: "Đổi [modifiers|E] động vật và [domicile_buildings|E] lấy [provisions|E]"
  BUTCHER_ANIMALS_DECISION_NEXT_STEP_BUTTON: "Thật ngon lành... #EMP thịt#!..."
  butcher_animals_decision_confirm: "Hãy để chúng hoàn thành nghĩa vụ cuối cùng này."
  butcher_animals_decision.tt.you_have_no_dogs: "[camp|E] của Ngài không có chó"
  butcher_animals_decision_option_dogs: "Chúng ta sẽ ăn thịt lũ chó."
  butcher_animals_decision.tt.you_have_no_cats: "[camp|E] của Ngài không có mèo"
  butcher_animals_decision_option_cats: "Bẻ cổ lũ mèo."
  butcher_animals_decision.tt.you_have_no_horses: "[camp|E] của Ngài không có ngựa #WEAK ([men_at_arms|E] không tính)#!"
  butcher_animals_decision_option_horses: "#EMP Ngựa#!, lũ ngựa phải hy sinh."
  butcher_animals_decision.tt.you_have_no_elephants: "[camp|E] của Ngài không có voi #WEAK ([men_at_arms|E] không tính)#!"
  butcher_animals_decision_option_elephants: "Voi có rất nhiều thịt..."
  butcher_animals_decision.tt.dogs: "Ăn thịt chó của Ngài"
  butcher_animals_decision.tt.provisions_gain.per_dog_mod: "Nhận [EmptyScope.ScriptValue('butcher_animals_decision_dog_provision_value')|0] [provisions_i][provisions|E] cho mỗi con chó của một [character|E] bị giết mổ"
  butcher_animals_decision.tt.provisions_gain.building.dog: "Nhận [EmptyScope.ScriptValue('butcher_animals_decision_dog_building_provision_value')|0] [provisions_i][provisions|E] khi giết mổ số lượng lớn chó trong [GetDomicileBuilding('baggage_train_kennel').GetName] của Ngài"
  butcher_animals_decision.tt.cooldown.dogs: "Ngài không thể ăn thịt chó lần nữa trong vòng [EmptyScope.ScriptValue('butcher_animals_decision_regular_cooldown_value')|0] năm"
  butcher_animals_decision.tt.cats: "Ăn thịt mèo của Ngài"
  butcher_animals_decision.tt.provisions_gain.per_cat_mod: "Nhận [EmptyScope.ScriptValue('butcher_animals_decision_cat_provision_value')|0] [provisions_i][provisions|E] cho mỗi con mèo của một [character|E] bị giết mổ"
  butcher_animals_decision.tt.cooldown.cats: "Ngài không thể ăn thịt mèo lần nữa trong vòng [EmptyScope.ScriptValue('butcher_animals_decision_regular_cooldown_value')|0] năm"
  butcher_animals_decision.tt.horses: "Ăn thịt ngựa của Ngài"
  butcher_animals_decision.tt.provisions_gain.your_horse_mod: "Nhận [EmptyScope.ScriptValue('butcher_animals_decision_horse_provision_value')|0] [provisions_i][provisions|E] khi giết mổ con ngựa của Ngài"
  butcher_animals_decision.tt.provisions_gain.building.horse: "Nhận [EmptyScope.ScriptValue('butcher_animals_decision_horse_building_provision_value')|0] [provisions_i][provisions|E] khi giết mổ số lượng lớn ngựa trong [GetDomicileBuilding('baggage_train_ample_steeds').GetName] của Ngài"
  butcher_animals_decision.tt.cooldown.horses: "Ngài không thể ăn thịt ngựa lần nữa trong vòng [EmptyScope.ScriptValue('butcher_animals_decision_regular_cooldown_value')|0] năm"
  butcher_animals_decision.tt.elephants: "Ăn thịt voi của Ngài"
  butcher_animals_decision.tt.provisions_gain.building.elephant: "Nhận [EmptyScope.ScriptValue('butcher_animals_decision_elephant_building_provision')|0] [provisions_i][provisions|E] khi giết mổ đàn voi trong [GetDomicileBuilding('proving_grounds_elephantry_reserve').GetName] của Ngài"
  butcher_animals_decision.tt.cooldown.elephants: "Ngài không thể ăn thịt voi lần nữa trong vòng [EmptyScope.ScriptValue('butcher_animals_decision_elephant_cooldown_value')|0] năm"
  butcher_animals_decision.tt.dog.you: "Ngài có một con chó"
  butcher_animals_decision.tt.dog.courtier: "Bất kỳ [followers|E] nào của Ngài có chó"
  butcher_animals_decision.tt.recently_ate_dogs: "Ngài gần đây đã ăn thịt chó"
  butcher_animals_decision.tt.cat.you: "Ngài có một con mèo"
  butcher_animals_decision.tt.cat.courtier: "Bất kỳ [followers|E] nào của Ngài có mèo"
  butcher_animals_decision.tt.recently_ate_cats: "Ngài gần đây đã ăn thịt mèo"
  butcher_animals_decision.tt.horse.you: "Ngài có một con ngựa riêng"
  butcher_animals_decision.tt.recently_ate_horses: "Ngài gần đây đã ăn thịt ngựa"
  butcher_animals_decision.tt.recently_ate_elephants: "Ngài gần đây đã ăn thịt voi"
  butcher_dogs_tooltip: "Chúng từng là những đứa bé ngoan, nhưng sẽ trở thành những bữa ăn tốt hơn"
  butcher_cats_tooltip: "Mèo chẳng có bao nhiêu thịt, nhưng chúng #EMP đúng là#! nấu súp rất ngon."
  butcher_horses_tooltip: "Không có tiếng kêu nào thảm thiết như tiếng ngựa."
  butcher_elephants_tooltip: "Có thể ăn được từ hai bên sườn hùng vĩ cho đến đôi mắt sắc sảo đầy trí tuệ của chúng."

  ep3_laamp_decision_event.1201.t: "Tiếng Sủa Cuối Cùng của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]"
  ep3_laamp_decision_event.1201.desc.intro: "Giết một con vật không được nuôi để làm thực phẩm là một việc ghê rợn. Đặc biệt là chó săn — người Ngài trung thành nhất mà bất kỳ [ROOT.Char.GetWomanMan] nào có thể từng biết.\n\n"
  ep3_laamp_decision_event.1201.desc.eaten.kennels.have_dog: "Lũ chó tru lên như quỷ dữ khi bị lôi đi giết mổ, ngửi thấy mùi máu, cái chết, và những xác đồng loại bị chất đống. Ta sẽ tự tay lo cho [ROOT.Char.Custom('DogStoryName')], ta nợ [ROOT.Char.Custom('DogStoryHerHim')] điều đó."
  ep3_laamp_decision_event.1201.desc.eaten.kennels.no_dog: "Lũ chó tru lên như quỷ dữ khi bị lôi đi giết mổ, ngửi thấy mùi máu, cái chết, và những xác đồng loại bị chất đống. Ta từng biết tên một vài con trong số chúng, dù ít nhất ta cũng không thể gọi mình là [ROOT.Char.Custom('MistressMaster')] của bất kỳ con nào."
  ep3_laamp_decision_event.1201.desc.eaten.one.have_dog: "Chỉ còn mỗi [ROOT.Char.Custom('DogStoryName')] yêu quý bên ta, nên chỉ có một cổ họng cần bị rạch. Dẫu vậy, [ROOT.Char.Custom('DogStorySheHe')] dường như cảm nhận được có điều gì đó không ổn, một điều gì đó #EMP sai lệch#! ở ta."
  ep3_laamp_decision_event.1201.desc.eaten.one.no_dog: "Chỉ có đúng một con chó trong trại, nên chẳng thể gọi là một cuộc tàn sát, nhưng con vật dường như vẫn hiểu số phận của mình đang đến gần."
  ep3_laamp_decision_event.1201.desc.eaten.some.have_dog: "Với số chó ít ỏi còn lại, không còn nghi ngờ gì rằng chính [ROOT.Char.Custom('DogStoryName')] của ta cũng phải gia nhập hàng ngũ bị giết mổ. Con đầu tiên bị làm thịt gọn gàng, nhưng những con còn lại nhanh chóng ngửi thấy mùi chết chóc và bắt đầu tru rên, rít lên thảm thiết."
  ep3_laamp_decision_event.1201.desc.eaten.some.no_dog: "Với số chó ít ỏi như vậy, hẳn là chúng ta đã tuyệt vọng lắm vì lương thực. Con đầu tiên bị làm thịt gọn gàng, nhưng những con còn lại nhanh chóng ngửi thấy mùi giết chóc và bắt đầu tru rên."
  ep3_laamp_decision_event.1201.desc.eaten.many.have_dog: "Chúng ta may mắn có khá nhiều chó, bao gồm cả [ROOT.Char.Custom('DogStoryName')] của ta, dù chúng tỏ ra bất an — như thể đã nghi ngờ điều gì đang chờ đợi mình. Sau khi con đầu tiên bị dẫn đi chịu chết, chúng bắt đầu tru lên."
  ep3_laamp_decision_event.1201.desc.eaten.many.no_dog: "Chúng ta may mắn có rất nhiều chó, rất nhiều nguồn thịt tiềm năng để duy trì sự sống, dù chúng tỏ ra bất an — như thể đã nghi ngờ điều gì đang chờ đợi mình. Sau khi con đầu tiên bị dẫn đi chịu chết, chúng bắt đầu tru lên."
  ep3_laamp_decision_event.1201.desc.outro: "\n\nNhiều người theo hầu nhìn ta với vẻ ghê tởm, nhưng cũng có kẻ dường như hiểu rằng đây là điều cần thiết.\n\nÍt nhất thì rồi cũng sẽ im lặng thôi."

  ep3_laamp_decision_event.1201.tt.dog_lost: "Con chó của [THIS.Char.GetTitledFirstNameNicknamedPossessive], [THIS.Char.Custom('DogStoryName')], đã bị giết mổ"
  ep3_laamp_decision_event.1201.tt.your_dog_lost: "Con chó của Ngài, [THIS.Char.Custom('DogStoryName')], đã bị giết mổ"
  ep3_laamp_decision_event.1201.tt.followers_with_dogs: "Mọi [follower|E] có chó"
  ep3_laamp_decision_event.1201.a.own_dog: "Tạm biệt nhé, những đứa bé ngoan."
  ep3_laamp_decision_event.1201.a: "Tiếng tru, tiếng tru #EMP ai oán#! đó..."
  ep3_laamp_decision_event.1201.b.own_dog: "Ờ thì, ta kiếm con khác là được."
  ep3_laamp_decision_event.1201.b: "Thịt thì vẫn là thịt."

  ep3_laamp_decision_event.1202.t: "Một Trại Không Còn Mèo"
  ep3_laamp_decision_event.1202.desc.intro: "Giết một con mèo không khó, cũng chẳng có chút gì gọi là công bằng hay thể thao.\n\n"
  ep3_laamp_decision_event.1202.desc.eaten.one.have_cat: "Ta... không hề muốn mọi chuyện với [ROOT.Char.Custom('CatStoryName')] kết thúc theo cách này, thực sự là vậy, nhưng chúng ta cần từng mảnh vụn, từng miếng thức ăn có thể kiếm được.\n\nKể cả khi đó là [ROOT.Char.Custom('CatStoryGirlBoy')] nhỏ bé, trung thành và tin tưởng của ta."
  ep3_laamp_decision_event.1202.desc.eaten.one.no_cat: "Nhất là khi trong cả trại chỉ có đúng một con mèo, nhưng chúng ta #EMP cần#! thức ăn, #EMP bất cứ#! thứ gì."
  ep3_laamp_decision_event.1202.desc.eaten.some.have_cat: "Chẳng có bao nhiêu con để bắt, và khi đã gom chúng lại, những sinh vật tội nghiệp ấy gần như hoàn toàn bất lực. Bị giam cầm, chúng chỉ có thể khè lên cáu kỉnh hoặc gừ gừ rối rít."
  ep3_laamp_decision_event.1202.desc.eaten.some.no_cat: "$ep3_laamp_decision_event.1202.desc.eaten.some.have_cat$\n\nKể cả [ROOT.Char.Custom('CatStoryName')]."
  ep3_laamp_decision_event.1202.desc.eaten.many.have_cat: "Ngài tưởng rằng phần lớn trong số chúng sẽ trốn thoát, nhưng không — khi lẽ ra bản năng sinh tồn phải thắng thế thì đa số mèo của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] lại tin tưởng chủ nhân của mình.\n\nKể cả [ROOT.Char.Custom('CatStoryName')]."
  ep3_laamp_decision_event.1202.desc.eaten.many.no_cat: "Ngài tưởng rằng phần lớn trong số chúng sẽ trốn thoát, nhưng không — khi lẽ ra bản năng sinh tồn phải thắng thế thì đa số mèo của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] lại tin tưởng chủ nhân của mình.\n\nMột sai lầm ngu ngốc."
  ep3_laamp_decision_event.1202.desc.outro: "\n\nMột khi đã bị bắt và nhốt lồng, chúng bị xử lý rất dễ dàng, dù chẳng có người theo hầu nào tỏ ra tự hào về hành động này — hay về ta — cả."
  ep3_laamp_decision_event.1202.tt.cat_lost: "Con mèo của [THIS.Char.GetTitledFirstNameNicknamedPossessive], [THIS.Char.Custom('CatStoryName')], đã bị giết mổ"
  ep3_laamp_decision_event.1202.tt.your_cat_lost: "Con mèo của Ngài, [THIS.Char.Custom('CatStoryName')], đã bị giết mổ"
  ep3_laamp_decision_event.1201.tt.followers_with_cats: "Mọi [follower|E] có mèo"
  ep3_laamp_decision_event.1202.a.own_cat: "Tình bạn cao quý của chúng ta chấm dứt rồi, [ROOT.Char.Custom('CatStoryName')]."
  ep3_laamp_decision_event.1202.a: "Chúng ta không còn lựa chọn nào khác."
  ep3_laamp_decision_event.1202.b.own_cat: "Ờ, cũng chỉ là mèo thôi mà."
  ep3_laamp_decision_event.1202.b: "Rồi rồi, chặt đi chặt đi. Hê."

  ep3_laamp_decision_event.1203.t: "Thịt Ngựa Cho Kẻ Đói"
  ep3_laamp_decision_event.1203.desc.intro: "Thịt ngựa nạc và dồi dào, chẳng xa lạ gì với nhiều chế độ ăn — #EMP nếu#! Ngài có thể chấp nhận việc tiêu thụ nó.\n\nTrong tình cảnh tuyệt vọng hiện tại, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] khó lòng không cắt giảm đàn ngựa,"
  ep3_laamp_decision_event.1203.desc.eaten.both: "giết mổ không chỉ những con dư thừa mà cả chính [ROOT.Char.Custom('WarhorseStoryName')] của ta."
  ep3_laamp_decision_event.1203.desc.eaten.own_horse: "kể cả khi con duy nhất có thể hy sinh là [ROOT.Char.Custom('WarhorseStoryName')] của ta."
  ep3_laamp_decision_event.1203.desc.eaten.reserve_steeds: "giết mổ hàng loạt những con ngựa dự trữ, bất chấp sự hoảng loạn và bối rối của chúng."
  ep3_laamp_decision_event.1203.desc.outro: "\n\nNguồn thực phẩm này phải trả giá bằng việc giảm tốc độ di chuyển, nhưng nó sẽ mua cho chúng ta thêm thời gian để tìm một nguồn sống bền vững hơn.\n\nÍt nhất là ta hy vọng vậy."
  ep3_laamp_decision_event.1203.a.many_steeds: "Ngay cả trong cái chết, chúng vẫn đưa ta tiến về phía trước."
  ep3_laamp_decision_event.1203.a.single_steed: "Ngay cả trong cái chết, [ROOT.Char.Custom('HorseStorySheHe')] vẫn đưa ta tiến về phía trước."
  ep3_laamp_decision_event.1203.b: "Thành thật mà nói, lẽ ra ta nên ăn chúng #EMP nhiều hơn#!, ngon thật."

  ep3_laamp_decision_event.1204.t: "Nghĩa Địa Voi"
  ep3_laamp_decision_event.1204.desc: "Sau vài con đầu tiên, cả đàn dường như nhận ra có điều gì đó không ổn.\n\nChỉ với rất nhiều công sức khống chế, chúng ta mới kiểm soát được chúng và thực sự bắt đầu cuộc tàn sát — dĩ nhiên tập trung vào những con già yếu, bệnh tật, suy kiệt, và cả con non.\n\nTừng con một, khu bảo tồn voi của ta bị đưa từ lưỡi kiếm sang dao phay của đồ tể.\n\nCông việc đẫm máu, kinh hoàng, càng trở nên nặng nề hơn bởi những tiếng gào thét hoảng loạn và tiếng rống kinh hãi vang vọng.\n\nNhưng hoặc là chúng, hoặc là chúng ta."
  ep3_laamp_decision_event.1204.a: "Cái chết của chúng là sự cứu rỗi của chúng ta."
  ep3_laamp_decision_event.1204.b: "Nhân danh [ROOT.Char.GetFaith.HealthGodName], mấy miếng #EMP bít tết#! đó to thật."

  ep3_laamp_decision_event.1205.t: "$ep3_laamp_decision_event.1204.t$: Hệ Quả"
  ep3_laamp_decision_event.1205.desc: "Đã một năm trôi qua kể từ khi sự tuyệt vọng của cuộc hành trình #EMP buộc#! chúng ta phải thực hiện... những biện pháp tàn khốc.\n\nDù thông minh đến đâu, voi vẫn là một khối thịt khổng lồ, và khi đặt mạng sống của chúng lên bàn cân với mạng sống của chúng ta, lựa chọn trở nên đủ đơn giản.\n\nChúng ta đã dùng dao phay và rìu chém vào đàn voi, xẻ thịt từ con già đến con non với quyết tâm lạnh lùng, biết rằng sự hy sinh của chúng là cần thiết.\n\nThế nhưng dường như số voi còn lại — những con đang phục vụ các chiến binh của ta — #EMP nhớ#! cuộc thảm sát đó. Chúng trở nên khó điều khiển, kháng lệnh, và hầu như chỉ làm những gì phục vụ cho việc sinh tồn hay ăn uống.\n\nChúng thậm chí còn #EMP bực bội#! thù địch với chính ta, như thể quy trách nhiệm cho ta — kẻ đứng đầu bầy người."
  ep3_laamp_decision_event.1205.a: "Chết tiệt lũ súc vật ngoan cố này!"
  ep3_laamp_decision_event.1205.a.tt: "Ngài sẽ không bao giờ có thể sử dụng voi chiến một cách hiệu quả nữa"
  ep3_laamp_decision_event_1205_modifier: "Voi Không Bao Giờ Quên"
  ep3_laamp_decision_event_1205_modifier_desc: "Và cũng chẳng bao giờ tha thứ."
 
  ascendant_byz_reclaimant_ortho_modifier: "Người Phục Hưng Byzantine Trỗi Dậy"
  ascendant_byz_reclaimant_ortho_modifier_desc: "Những lời cầu nguyện của tín đồ, cùng hy vọng của những ai mong thấy Byzantium được phục hồi, đều đặt nơi vị quân chủ quyết đoán này."
  ascendant_byz_reclaimant_modifier: "Người Phục Hưng Byzantine Trỗi Dậy"
  ascendant_byz_reclaimant_modifier_desc: "Hy vọng của những ai mong thấy Byzantium được phục hồi đều đặt nơi vị quân chủ quyết đoán này."
