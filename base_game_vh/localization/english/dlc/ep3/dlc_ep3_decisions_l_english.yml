l_english: 
 # Estate Decisions
  estate_hire_agents_decisions: "Thuê Đặc Vụ"
  estate_hire_agents_decisions_desc: "Khi địa vị và ảnh hưởng chính trị không đủ để mang lại cho ta thứ mình muốn, ta buộc phải tìm đến những #EMP lựa chọn#! khác. Tuy nhiên, ta cần có các đặc vụ để làm việc này hiệu quả hơn."
  estate_hire_agents_decisions_confirm: "Mang những đặc vụ đó đến cho ta!"
  estate_hire_agents_decisions_tooltip: "Tìm kiếm và chiêu mộ các đặc vụ tiềm năng để thúc đẩy các [schemes|E] của Ngài"
  estate_governor_patrols_decision: "Tiến Hành Tuần Tra Trong Tổng Trấn"
  estate_governor_patrols_decision_desc: "Để giữ cho dân chúng trong tổng trấn của ta được an toàn, ta có thể thiết lập các đội tuần tra thường xuyên nhằm ngăn chặn bọn cướp tiềm ẩn. Điều này cũng có thể mang lại lợi thế trong chiến tranh, vì quân đội sẽ luôn sẵn sàng nếu cần."
  estate_governor_patrols_decision_confirm: "Bắt đầu tuần tra ngay lập tức!"
  estate_governor_patrols_decision_tooltip: "Thiết lập các cuộc tuần tra trong [governorship|E] của Ngài"
  estate_bolster_security_decision: "Tăng Cường An Ninh Điền Trang"
  estate_bolster_security_decision_desc: "Ta không trở nên hoang tưởng đấy chứ? Cảm giác như ai cũng đang nhắm vào ta. Có kẻ muốn đâm sau lưng, kẻ khác lại muốn bôi nhọ danh tiếng của ta. Tăng cường lực lượng bảo vệ chắc chắn sẽ khiến ta yên tâm hơn. #EMP Đúng chứ?#!"
  estate_bolster_security_decision_confirm: "Hãy bổ nhiệm thêm lính gác."
  estate_bolster_security_decision_tooltip: "Cải thiện an ninh cá nhân của Ngài để chống lại các [schemes|E]"
  estate_granary_decision: "Thao Túng Thị Trường Ngũ Cốc"
  estate_granary_decision_desc: "Các kho lương riêng của ta đang chứa một lượng lớn ngũ cốc. Trong lúc khan hiếm, ta có thể từ từ bán ra từng bao một với mức giá tăng cao đáng kể. Ta sẽ cần giật vài sợi dây để thao túng thị trường theo hướng có lợi cho mình, nhưng lợi ích thu được sẽ rất lớn."
  estate_granary_decision_confirm: "Bắt đầu bán ngũ cốc. #EMP Từ từ#!."
  estate_granary_decision_tooltip: "Tăng [income|E] [gold_i|E][gold|E] hàng tháng của Ngài trong tương lai gần bằng cách bán ngũ cốc được lưu trữ trong kho lương"
  estate_unlock_granary_decision_factors_tt: "\nCác yếu tố góp phần làm tăng hiệu quả:"
  estate_unlock_granary_decision_no_factors_tt: "#weak Không có yếu tố bổ sung#!"
  estate_unlock_granary_decision_grain_building_tt: "#weak [estate|E] của Ngài có [domicile_building|E] [GetDomicileBuilding('grain_field_01').GetName] — Hiệu ứng tăng theo mỗi cấp độ#!"
  estate_unlock_granary_decision_rice_building_tt: "#weak [estate|E] của Ngài đã sở hữu [domicile_building|E] [GetDomicileBuilding('east_asian_estate_rice_field_01').GetName] — Sản lượng sẽ gia tăng theo từng cấp bậc tương ứng#!"
  estate_unlock_granary_decision_capital_tt: "#weak [estate|E] của Ngài nằm tại [capital|E]#!"
  estate_unlock_granary_decision_terrain_tt: "#weak [estate|E] của Ngài nằm trên địa hình [terrain|E] [domicile_owner.GetDomicile.GetLocation.GetTerrain.GetName]#!"
  estate_unlock_granary_decision_control_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] đang chịu mức [county_control|E] thấp#!"
  estate_unlock_granary_decision_development_1_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] có ít nhất [EmptyScope.ScriptValue('estate_granary_development_bonus_1_value')|V0] [development|E]#!"
  estate_unlock_granary_decision_development_2_tt: "#weak [domicile_owner.GetDomicile.GetLocation.GetCounty.GetName] có ít nhất [EmptyScope.ScriptValue('estate_granary_development_bonus_2_value')|V0] [development|E]#!"
  estate_unlock_granary_decision_epidemic_tt: "#weak Có một [epidemic|E] tại [domicile_owner.GetDomicile.GetLocation.GetName], khiến người dân địa phương sẵn sàng trả giá cao hơn cho ngũ cốc của Ngài#!"
 
 # Hold a Triumph Decision
  hold_triumph_decision: "Tổ Chức Khải Hoàn"
  hold_triumph_decision_desc: "Khải hoàn là một trong những truyền thống La Mã lâu đời và được kính trọng nhất. Thuở xưa, vị tướng chiến thắng sẽ trở về Rome giữa tiếng hò reo của đám đông và vinh dự tối cao — trong một ngày, ngang hàng với thần thánh, chỉ thiếu danh xưng. Ngày nay, dân chúng sẽ tôn vinh những thành công vĩ đại nhất của ta và sự thịnh vượng mà ta mang lại cho họ!$ep3_triumph_influence_cost_desc$"
  hold_triumph_decision_tooltip: "Tổ chức một cuộc diễu hành tráng lệ để tôn vinh chiến công và nâng cao hình ảnh trước công chúng"
  hold_triumph_decision_confirm: "Chuẩn bị ngựa cho ta!"
  ep3_triumph_influence_cost_desc: "\n\n@alert_icon! #alert_trial Chi phí tổ chức Khải Hoàn sẽ tăng nếu Ngài không giành chiến thắng trong một [war|E] suốt 5 năm qua!#!"
  hold_triumph_decision_effects: "Trong suốt lễ Khải Hoàn, Ngài sẽ được đưa ra nhiều lựa chọn nhằm tạo ấn tượng lâu dài với thần dân và nhận được [legitimacy|E], [influence|E], [prestige|E], [piety|E] cùng nhiều lợi ích khác."

  ep3_decisions_event_triumph: "Khải Hoàn:"
  ep3_decisions_event.0001.t: "$ep3_decisions_event_triumph$ Một Cuộc Diễu Hành Ấn Tượng"
  ep3_decisions_event.0001.intro: "Ta ngồi cao trên lưng ngựa, rực rỡ trong bộ lễ phục uy nghi nhất, dẫn đầu một đoàn diễu hành tráng lệ đi xuyên qua hai hàng người reo hò không dứt."
  ep3_decisions_event.0001.desc_const: "\n\nNhư những bậc tiền nhân lừng lẫy trước ta, ta tiến vào thánh đô [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] qua [Glossary( 'Golden Gate', 'GOLDEN_GATE_GLOSS' )], diễu hành qua trung tâm thành phố giữa những bức tượng và đài tưởng niệm cổ xưa của vinh quang đã qua, rồi dừng lại tại [Glossary( 'Milion', 'MILION_GLOSS' )], nơi mọi phép đo trong đế quốc bắt đầu."
  GOLDEN_GATE_GLOSS: "#bold Cổng Vàng#! là một phần của Tường thành Theodosius bao quanh Constantinople và đánh dấu điểm khởi đầu của đại lộ chính Mese của kinh đô."
  MILION_GLOSS: "#bold Milion#! đánh dấu trung tâm của [GetTitleByKey('e_byzantium').GetBaseName] và là điểm gốc để đo mọi khoảng cách tới các thành phố trong đế quốc."
  ep3_decisions_event.0001.desc_other: "\n\nSau khi tiến vào [t_location.GetNameNoTier] qua cổng chính, chúng ta theo con đường lớn dẫn thẳng tới trái tim đang đập của thành phố."
  ep3_decisions_event.0001.desc: "Quân lính của ta theo sát phía sau, tự hào chia sẻ vinh quang chiến thắng trước [triumph_enemy_defeated.GetTitledFirstName], trong khi dân chúng la ó tù binh và trầm trồ trước những chiến lợi phẩm."
  ep3_decisions_event.0001.desc_no_war: "Binh sĩ, gia nhân mang theo của cải và các quan chức cao cấp trong triều phục chính thức theo sau ta đầy kiêu hãnh, như minh chứng sống động cho quyền lực và uy nghi của triều đại ta."
  ep3_decisions_event.0001.desc_end: "\n\nNhưng cuộc diễu hành khải hoàn nên kết thúc ở đâu?"
  ep3_decisions_event.0001.a: "Trường đua Hippodrome là nơi thích hợp nhất."
  ep3_decisions_event.0001.b: "Tới [ROOT.Char.Custom('TriumphReligiousLocation')]!"
  ep3_decisions_event.0001.a.flavor: "Ta muốn thực sự tạo ấn tượng với thần dân!"
  ep3_decisions_event.0001.a.tt: "Cuộc khải hoàn sẽ tiến về Hippodrome"
  ep3_decisions_event.0001.b.flavor: "Tôn giáo là nền tảng quyền lực của ta."
  ep3_decisions_event.0001.b.tt: "Cuộc khải hoàn sẽ tiến về Hagia Sophia"
  ep3_decisions_event.0002.t: "$ep3_decisions_event_triumph$ Tại Trường Đua Hippodrome"
  ep3_decisions_event.0002.desc_enemy: "Khi ta tiến vào Hippodrome trong khải hoàn, nơi vốn là chốn tự nhiên để quyền lực đã được khẳng định giao tiếp với dân chúng, ta chỉ định truyền đạt duy nhất một điều: #EMP Chiến Thắng#!."
  ep3_decisions_event.0002.desc_no_war: "Hippodrome là nơi hiếm hoi mà dân chúng có thể trực tiếp nhìn thấy ta, vì vậy điều tối quan trọng là họ phải thấy chính xác những gì ta muốn họ thấy: quyền lực, của cải và sự kiểm soát."
  ep3_decisions_event.0002.desc_prisoner: "\n\nTheo sau là một đoàn tù binh bất tận, bị trói và khoác lên mình những bộ giẻ rách. Phần lớn chỉ là binh sĩ thường, nhưng ở đầu hàng là [valid_prisoner.GetTitledFirstName], cưỡi một con lừa, làm đám đông cười ồ thích thú."
  ep3_decisions_event.0002.desc_no_prisoner: "\n\nThực vậy, của cải, thánh vật, chiến lợi phẩm và các biểu tượng hoàng quyền được diễu hành phía sau — thừa đủ để khơi dậy những tràng reo hò thán phục từ đám đông."
  ep3_decisions_event.0002.desc_artifact: "Giữa những chiến lợi phẩm, tâm điểm là [sacked_artifact.GetName], bị cướp đoạt trong một cuộc vây hãm."
  ep3_decisions_event.0002.desc_hostage: "Trong khán đài hoàng gia, ta thoáng thấy [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] với vẻ mặt u ám."
  ep3_decisions_event.0002.desc_conclusion: "\n\nQuần chúng đang chờ đợi, không khí rung chuyển bởi sự phấn khích và một biển âm thanh hỗn độn. Ta sẽ ban cho dân chúng thứ mà họ khao khát."
  ep3_decisions_event.0002.a: "Trừng phạt công khai các tù binh!"
  ep3_decisions_event.0002.a.tt: "Ta sẽ phô bày cách ta xử lý chúng theo ý mình!"
  ep3_decisions_event.0002.b: "Phân phát chiến lợi phẩm cho dân chúng."
  ep3_decisions_event.0002.b.tt: "Ai cũng muốn cảm thấy mình là một phần của chiến thắng!"
  ep3_decisions_event.0002.c: "Phân phát lương thực và vàng bạc cho đám đông cuồng nhiệt!"
  ep3_decisions_event.0002.c.tt: "Ai mà chẳng thích đồ miễn phí?"
  ep3_decisions_event.0002.d: "Dĩ nhiên là bài diễn văn của ta!"
  ep3_decisions_event.0002.d.tt: "Ta phải cẩn trọng trong cách thể hiện bản thân trước thần dân."
  ep3_decisions_event.0002.d.custom_tooltip: "Ngài chọn chủ đề cho bài diễn văn"
  ep3_decisions_event.0002.e: "Thiêu hủy [sacked_artifact.GetNameNoTooltip] và phân phát chiến lợi phẩm."
  ep3_decisions_event.0002.e.tt: "Mọi người phải cảm nhận được chiến thắng — và sự sỉ nhục tột cùng của kẻ thù!"
  ep3_decisions_event.0003.t: "$ep3_decisions_event_triumph$ Tại [ROOT.Char.Custom('TriumphReligiousLocationCapitalized')]"
  ep3_decisions_event.0003.desc: ""Con người vốn mong manh, và ngay cả những chiến thắng vĩ đại nhất cũng trở nên nhỏ bé trước sự vĩ đại của [ROOT.Char.GetFaith.HighGodName]," ta trầm ngâm nghĩ khi bước qua cánh cửa. Ta lập tức bị choáng ngợp bởi vẻ uy nghi và tráng lệ của công trình.\n\nDân chúng hẳn sẽ trân trọng một cử chỉ khiêm nhường và mộ đạo như sự bổ trợ cho chiến thắng rực rỡ của ta trước [triumph_enemy_defeated.GetTitledFirstName]."
  ep3_decisions_event.0003.desc_no_war: "Kiêu ngạo là kẻ thù lớn nhất của những kẻ quyền lực.\n\nNhưng còn tệ hơn nữa là #EMP để thần dân cảm nhận được sự kiêu ngạo#!. Suy cho cùng, [ROOT.Char.GetTitleAsNameNoTooltip|U] chỉ là đại diện của [ROOT.Char.GetFaith.HighGodName] nơi trần thế. Quyền lực, của cải và uy nghi chỉ là sự phản chiếu của vinh quang Triều Đình Thần Thánh, và cần phải thể hiện sự tôn kính đúng mực với trật tự ấy."
  ep3_decisions_event.0003.desc_hostage: "Chính vì vậy mà ta đã tiện thể mời [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] cùng đến đây."
  ep3_decisions_event.0003.a: "Ta đón nhận phúc lành của [ROOT.Char.GetFaith.HighGodNameAlternate]."
  ep3_decisions_event.0003.b: "Ta sẽ hiến dâng chiến thắng này cho [ROOT.Char.GetFaith.HighGodName]."
  ep3_decisions_event.0003.c: "Bình an đến với ngươi và thần dân của ngươi, [enemy_hostage.GetFirstNameNoTooltip]."
  ep3_decisions_event.0003.d: "Ta sẽ hiến dâng chiến lợi phẩm cho [ROOT.Char.GetFaith.HighGodNameAlternate]."
  ep3_decisions_event.0003.c.tt: "Một cử chỉ hòa bình được tôn giáo chuẩn thuận chắc chắn sẽ giúp xoa dịu căng thẳng với dân chúng của [triumph_enemy_defeated.GetTitledFirstNamePossessiveNoTooltip]."
  ep3_decisions_event.0003.d.tt_artifact: "Ta sẽ dâng [sacked_artifact.GetName] lên bàn thờ."
  ep3_decisions_event.0004.t: "$ep3_decisions_event_triumph$ Cuộc Diễu Hành Tù Binh"
  ep3_decisions_event.0004.desc: "Hàng hàng lớp lớp tù binh tiến vào Hippodrome. Dơ bẩn, gầy guộc, đầu bị cạo trọc — người ta gần như có thể thương hại chúng, nếu chúng không phải là kẻ thù đáng ghét mà ta vừa làm nhục trên chiến trường.\n\n[valid_prisoner.GetTitledFirstName|U] dẫn đầu đoàn người trong nỗi ô nhục, như [valid_prisoner.GetSheHe] từng làm khi ra trận, nhưng việc cưỡi lừa quay ngược hướng, khoác áo rách khiến [valid_prisoner.GetHerHim] trông kém đáng sợ hơn rất nhiều."
  ep3_decisions_event.0004.desc_hostage: "Sắc mặt của [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] càng thêm u ám."
  ep3_decisions_event.0004.a: "Chúng sẽ bị làm mù."
  ep3_decisions_event.0004.b: "Xử tử công khai."
  ep3_decisions_event.0004.c: "Ân điển hoàng gia đã giáng xuống: thả chúng tự do."
  ep3_decisions_event.0005.t: "$ep3_decisions_event_triumph$ Diễn Văn Hoàng Gia"
  ep3_decisions_event.0005.desc_victory: "Khi bước lên khán đài hoàng gia tại Hippodrome, ta cân nhắc cách tốt nhất để tận dụng chiến thắng trước [triumph_enemy_defeated.GetTitledFirstName]."
  ep3_decisions_event.0005.desc_no_war: "Đám đông thì thất thường, và ta hiểu rõ rằng mình không có chiến thắng vĩ đại nào để biện minh cho khải hoàn này hay tạo dựng uy tín cho bài diễn văn. Dẫu vậy, ta vẫn phải gây ấn tượng bằng cách nào đó, bởi sự ổn định của triều đại ta phần lớn dựa vào sự ủng hộ của dân chúng."
  ep3_decisions_event.0005.desc_prisoner: "\n\nCó lẽ ta nên nhấn mạnh chiến lợi phẩm dồi dào thu được và sự an toàn mới nơi biên cương, dù hàng loạt tù binh bị bắt — như [valid_prisoner.GetTitledFirstName] — diễu hành trước mắt đám đông đã nói lên tất cả. Hay ta nên tập trung vào chính trị nội bộ?"
  ep3_decisions_event.0005.desc_politics: "\n\nChiến tranh bị thổi phồng quá mức, vậy nên có lẽ ta nên hướng sự chú ý của họ sang nơi khác — chẳng hạn như ổn định và thịnh vượng trong nước."
  ep3_decisions_event.0005.desc_hostage: "Từ khóe mắt, ta thoáng thấy [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] ngồi bất động, gương mặt lạnh như đá."
  ep3_decisions_event.0005.a: "Dưới sự dẫn dắt của [ROOT.Char.GetFaith.WarGodName], nhiều chiến thắng nữa sẽ đến!"
  ep3_decisions_event.0005.tt: "Dân chúng thủ đô sẽ ghi nhớ điều này và phán xét Ngài theo đó!"
  ep3_decisions_event.0005.b: "Nguyện [ROOT.Char.GetFaith.HealthGodName] luôn dẫn dắt Đế Chế đến bình an!"
  ep3_decisions_event.0005.c: "Dưới sự bảo hộ của [ROOT.Char.GetFaith.HighGodName], Đế Chế sẽ phồn thịnh!"
  ep3_decisions_event.0005.a.success: "Họ tin vào lời hứa của Ngài và sẽ kỳ vọng những chiến thắng quân sự"
  ep3_decisions_event.0005.a.failure: "Họ không bị thuyết phục bởi những lời đường mật"
  ep3_decisions_event.0005.b.success: "Họ tin vào lời hứa của Ngài và sẽ kỳ vọng hòa bình nội bộ"
  ep3_decisions_event.0005.c.success: "Họ tin vào lời hứa của Ngài và sẽ kỳ vọng sự thịnh vượng của đế chế"
  ep3_decisions_event.a.tt: "Bất ổn sẽ nhen nhóm tại Thủ Đô nếu không có chiến thắng"
  ep3_decisions_event.a.tt_no: "Ngài vẫn có thể gây ấn tượng bằng cách giành chiến thắng trong chiến tranh"
  ep3_decisions_event.b.tt: "Bất ổn sẽ nhen nhóm tại Thủ Đô nếu xảy ra nổi loạn"
  ep3_decisions_event.b.tt_no: "Ngài vẫn có thể gây ấn tượng nếu không có cuộc nổi loạn nào"
  ep3_decisions_event.c.tt: "Bất ổn sẽ nhen nhóm tại Thủ Đô nếu đế chế không vận hành hiệu quả"
  ep3_decisions_event.c.tt_no: "Ngài vẫn có thể gây ấn tượng nếu đế chế vận hành tốt"
  ep3_decisions_event.success: "Đám đông tin tưởng Ngài"
  ep3_decisions_event.failure: "Đám đông không bị thuyết phục"
  cultural_acceptance_triumph_offensive: "Khải Hoàn Khiêu Khích"
  cultural_acceptance_triumph_peace: "Nhành Ô Liu Hòa Ước"
  fervor_gain_triumph_of_god: "Khải Hoàn Tôn Giáo"
  ep3_decisions_event.0006.t: "$ep3_decisions_event_triumph$ Giữ Lời Hứa"
  ep3_decisions_event.0006.desc: "Cuộc khải hoàn gần nhất của ta đã diễn ra từ nhiều năm trước, và những lời hứa khi ấy giờ đây chẳng còn nằm trong tâm trí ta. Tuy nhiên, người dân [t_location.GetName] thì không quên, điều mà [talker.Custom2('MyCharacterIntroduction', ROOT.Char)] đã nhắc nhở ta.\n\n\"Thần dân đang xì xào bàn tán, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U].\""
  ep3_decisions_event.0006.desc_victory: "“Ngài còn nhớ đã hứa mang về những chiến thắng quân sự vĩ đại không?”"
  ep3_decisions_event.0006.desc_stability: "“Ngài còn nhớ đã hứa về một cõi thái bình và ổn định không?”"
  ep3_decisions_event.0006.desc_prosperity: "“Ngài còn nhớ đã hứa về một đế chế phồn vinh và thành công không?”"
  ep3_decisions_event.0006.desc_yes: "\n\nTa nhớ chứ. Và ta cho rằng mọi thứ đã diễn ra khá tốt!"
  ep3_decisions_event.0006.desc_no: "\n\nTa nhớ. Và ta biết mình đã thất bại. Nhưng ta chỉ cần thêm thời gian! Dù sao thì ta vẫn luôn giữ lời hứa."
  ep3_decisions_event.0006.a: "Ta luôn giữ lời hứa."
  ep3_decisions_event.0006.b: "Ngoại trừ khi ta không làm vậy."

  ep3_decisions_event.0007.t: "$ep3_decisions_event_triumph$ Kết Cục"
  ep3_decisions_event.0007.desc: "Và cứ thế, đám [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] lại một lần nữa được xoa dịu. Sức mạnh của ta và tính chính danh của quyền lực ta đã được tái khẳng định.\n\n"
  ep3_decisions_event.0007.hippodrome: "Khi ta rời khỏi Trường Đua, tiếng reo hò của dân chúng tràn ngập không khí, dội vang trên những phiến đá cổ kính đã chứng kiến vinh quang của các hoàng đế thuở trước. Ta cảm nhận sức nặng của lịch sử đè lên mình, ánh mắt của Constantinople đổ dồn về vị hoàng đế của họ.\n\nHôm nay, dưới ánh hoàng hôn rực rỡ, khải hoàn của ta không chỉ là một lễ mừng, mà còn là minh chứng cho tinh thần bền bỉ và sức mạnh trường tồn của đế quốc.\n\n\"[Glossary( 'Aien aristeuein', 'TRIUMPH_HIPPODROME_CONC_GLOSS')]\", ta thì thầm."
  ep3_decisions_event.0007.hagia_sophia: "Trong những bức tường linh thiêng của Hagia Sophia, ta được bao bọc bởi vẻ trang nghiêm trầm mặc. Những lời thánh ca của dân chúng hòa quyện, vang vọng khắp không gian thiêng liêng rộng lớn. Tại đây, trong vòng tay thần thánh của kiệt tác kiến trúc này, ta cảm thấy mình gắn kết với điều gì đó vượt lên trên chính bản thân.\n\nKhải hoàn của ta nơi thánh địa này vượt xa quyền lực trần thế — đó là sự hòa hợp giữa đức tin và quyền lãnh đạo, là biểu tượng cho phúc lành thiêng liêng đặt lên triều đại của ta.\n\nKhi đứng dưới mái vòm uy nghi, ta không chỉ là hoàng đế của Constantinople, mà còn là người gìn giữ trái tim tinh thần của nó.\n\n\"[Glossary( 'Hyper tes basileias soterias', 'TRIUMPH_HAGIA_SOPHIA_CONC_GLOSS')]\", ta thì thầm."
  TRIUMPH_HIPPODROME_CONC_GLOSS: "\"#bold Aien aristeuein#!\" là một cụm từ Hy Lạp cổ xuất phát từ #EMP Iliad#! của Homer, mang nghĩa \"Luôn vươn tới sự xuất sắc.\""
  TRIUMPH_HAGIA_SOPHIA_CONC_GLOSS: "\"#bold Hyper tes basileias soterias#!\" là một cách diễn đạt phổ biến trong tiếng Hy Lạp cổ, mang nghĩa \"Vì sự cứu rỗi của đế quốc.\""
  ep3_decisions_event.0007.a: "Vinh quang muôn năm cho [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]."
  ep3_decisions_event.0007.a.tt: "Khải hoàn của Ngài kết thúc"

 # Find a Charioteer
  ep3_decisions_event.1000.t: "[GetCourtPositionType('charioteer_court_position').GetNameNoTooltip|U] Của Ta"
  ep3_decisions_event.1000.desc: "Gia nhân của ta đã trình lên một danh sách ứng viên để tuyển làm Người Đánh Xe — kẻ sẽ là đại diện rực rỡ của ta tại Trường Đua.\n\n[mediocre_charioteer.GetFirstName] thiếu kinh nghiệm, nhưng vẫn có thể là một lựa chọn tích cực. Ngược lại, [good_charioteer.GetFirstName] là một đối thủ đã được chứng minh."
  ep3_decisions_event.1000.desc.stolen_charioteer: "\n\nTa #EMP có thể#! cũng đưa ra một lời đề nghị thuyết phục cho người đánh xe của [stolen_charioteer.GetEmployer.GetTitledFirstNamePossessive], [stolen_charioteer.GetFirstName]. Có lẽ [stolen_charioteer.GetSheHe] đang mong muốn một chủ nhân hào phóng hơn..."
  ep3_decisions_event.1000.a: "[mediocre_charioteer.GetFirstNameNoTooltip] xứng đáng với niềm tin của ta... và cả tiền bạc của ta."
  ep3_decisions_event.1000.a.aptitude: "[mediocre_charioteer.GetUINamePossessive] [aptitude|E] là [mediocre_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
  ep3_decisions_event.1000.b: "[good_charioteer.GetFirstNameNoTooltip] có kinh nghiệm mà ta đang tìm kiếm!"
  ep3_decisions_event.1000.b.aptitude: "[good_charioteer.GetUINamePossessive] [aptitude|E] là [good_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
  ep3_decisions_event.1000.c: "Ta đã để mắt tới [stolen_charioteer.GetFirstNameNoTooltip] từ lâu."
  ep3_decisions_event.1000.c.aptitude: "[stolen_charioteer.GetUINamePossessive] [aptitude|E] là [stolen_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
  ep3_decisions_event.1000.d: "Nghĩ lại thì..."

 # Find a Bookmaker
  ep3_decisions_event.1010.t: "[GetCourtPositionType('bookmaker_court_position').GetNameNoTooltip|U] Của Ta"
  ep3_decisions_event.1010.desc: "Gia nhân của ta đã trình lên một danh sách ứng viên để tuyển làm Nhà Cái — người quản lý việc cá cược và tài chính của các cuộc đua xe ngựa tại Trường Đua.\n\n[mediocre_bookmaker.GetFirstName] thiếu kinh nghiệm, nhưng vẫn có thể là một lựa chọn tích cực. Ngược lại, chọn [good_bookmaker.GetFirstName] sẽ là phương án khôn ngoan nhất."
  ep3_decisions_event.1010.a: "[mediocre_bookmaker.GetFirstNameNoTooltip] xứng đáng với niềm tin của ta... và cả tiền bạc của ta."
  ep3_decisions_event.1010.a.aptitude: "[mediocre_bookmaker.GetUINamePossessive] [aptitude|E] là [mediocre_bookmaker.GetCourtPositionAptitude( GetCourtPositionType( 'bookmaker_court_position' ) )]"
  ep3_decisions_event.1010.b: "[good_bookmaker.GetFirstNameNoTooltip] có kinh nghiệm mà ta đang tìm kiếm!"
  ep3_decisions_event.1010.b.aptitude: "[good_bookmaker.GetUINamePossessive] [aptitude|E] là [good_bookmaker.GetCourtPositionAptitude( GetCourtPositionType( 'bookmaker_court_position' ) )]"

