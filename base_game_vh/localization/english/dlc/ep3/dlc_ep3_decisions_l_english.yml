  expunge_latin_dominion_decision: "Thanh Trừng Quyền Thống Trị Latin"
  expunge_latin_dominion_decision_desc: "Những tên đồ tể của La Mã, lũ ác quỷ khoác thánh giá Latin, đã cướp lấy vương miện hoàng đế bằng lửa và máu. Giờ đây, chúng #EMP dám#! đòi hỏi quyền thống trị lâu dài trên vùng đất cổ xưa của chúng ta.\n\nVương quốc này đến vương quốc khác — tước đoạt quyền lực của lũ mạo danh thô lỗ đó! Quét chúng đi!"
