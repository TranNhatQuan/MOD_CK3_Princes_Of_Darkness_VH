  commission_artifact_decision_option_trinket_icon_desc: "[AddTextIf( Not( ROOT.Char.GetInventory.GetSlot( 'miscellaneous' ).IsEmpty ), Concatenate( 'Hiện đang trang bị:\n', ROOT.Char.GetInventory.GetEquippedArtifactsInSlotTypeString( 'miscellaneous', 'NEWLINE', 'NEWLINE', 'NEWLINE' ) ) )]"
