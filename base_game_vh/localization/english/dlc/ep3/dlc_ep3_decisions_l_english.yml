  gathered_support_for_faction_army: "Đã Tập Hợp Hậu Thuẫn Địa Phương"
  gathered_support_for_faction_get_army_tt: "Nếu [faction|E] này thúc đẩy [claim|E] của mình trong vòng 5 năm tới và dẫn đến chiến tranh, Ngài sẽ nhận thêm một đạo quân gồm dân binh địa phương và $light_footmen$"
  belong_to_claimant_liberty_faction_tt: "Ngài phải đã tham gia một [claimant_faction|E] hoặc [liberty_faction|E]"
 
 # Separatist Uprising
  separatist_uprising_decision: "Bảo Vệ Văn Hóa [ROOT.Char.GetCulture.GetNameNoTooltip]"
  separatist_uprising_decision_desc: "Đất đai thuộc về những người sinh sống trên đó. [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetDeJureLiege.GetDefinitiveNameNoTooltip|U] phải được cai trị bởi một người [ROOT.Char.GetCulture.GetNameNoTooltip] đích thực."
  separatist_uprising_decision_tooltip: "Giành quyền kiểm soát một [duchy|E] cho [culture|E] của Ngài"
  separatist_uprising_decision_war_tt: "Ngài bắt đầu một [war|E] với hiệu ứng [GetModifier('ep3_separatist_uprising').GetNameWithTooltip] trong #V 15#! năm, nhận thêm [levies|E] và một số [men_at_arms|E] #high được tuyển chọn trung thành với đức tin#! #high #EMP hoặc#!#! Ngài không khởi chiến ngay, nhưng vẫn giữ lại [claim|E]"
  separatist_uprising_decision_pacifist_option_common_tt: "Nếu ngài hoàn thành ít nhất #V 3#! điều kiện, ngài sẽ có được [duchy|E] đó một cách #V hòa bình#!:\n$EFFECT_LIST_BULLET$Một người [spouse|E] quý tộc [GetPlayer.GetCurrentLocation.GetCounty.GetCulture.GetName]\n$EFFECT_LIST_BULLET$[faith|E] [GetPlayer.GetCurrentLocation.GetCounty.GetFaith.GetAdjective]\n$EFFECT_LIST_BULLET$[weak_hook|E] @weak_hook_icon! đối với [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName]"
  separatist_uprising_decision_pacifist_option_friend_lover_tt: "$separatist_uprising_decision_pacifist_option_common_tt$\n$EFFECT_LIST_BULLET$Là [friend|E] hoặc [lover|E] của [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName]$separatist_uprising_decision_pacifist_option_ending_tt$"
  separatist_uprising_decision_pacifist_option_friend_tt: "$separatist_uprising_decision_pacifist_option_common_tt$\n$EFFECT_LIST_BULLET$Là [friend|E] của [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName]$separatist_uprising_decision_pacifist_option_ending_tt$"
  separatist_uprising_decision_pacifist_option_ending_tt: "\n$EFFECT_LIST_BULLET$Có [prestige_level|E] cao hơn 1 bậc so với [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName]"
  separatist_uprising_decision_confirm: "Ra trận, hỡi [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
  ep3_separatist_uprising: "Khởi Nghĩa Ly Khai"
  ep3_separatist_uprising_desc: "Nhân vật này đã dốc toàn lực để giành lại đất đai cho văn hóa của mình."
  separatist_uprising_culture_county_tt: "Ngài có cùng [culture|E] với [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetName] #weak ([GetPlayer.GetCurrentLocation.GetCounty.GetCulture.GetName])#!"
