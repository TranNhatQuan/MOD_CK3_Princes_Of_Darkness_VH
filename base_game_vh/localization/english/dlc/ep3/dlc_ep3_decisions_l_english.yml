  knight_errant_decision_armor_tt: "Ngài nhận được [artifact|E] áo giáp \"Áo Choàng Vàng của [GetPlayer.CustomFixedRandom('GetKnightErrantAnimal')|U]\""
  ep3_decisions_event.5001.t: "$knight_culture_player_no_tooltip$ của [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|U]"
  ep3_decisions_event.5001.desc.spouse: ""Người cao quý nhất trong số những kẻ cùng cảnh ngộ với [ROOT.Char.GetHerHis]," giọng nói của [adoring_fan.GetFirstNamePossessiveNoTooltip] thân yêu của ta vang lên, theo sau đó là một nụ hôn dịu dàng đặt lên vai ta. "Ta đã tìm ngài khắp nơi."\n\n"Họ đang kể những câu chuyện nhảm nhí về ngài trong trại," [adoring_fan.GetSheHe] cúi người xuống thì thầm,"
  ep3_decisions_event.5001.desc.intro: ""Người cao quý nhất trong số những kẻ cùng cảnh ngộ với [ROOT.Char.GetHerHis]," giọng nói của [adoring_fan.GetFirstNamePossessiveNoTooltip] làm ta giật mình. "Ta đã tìm ngài khắp nơi."\n\n"Họ đang kể những câu chuyện nhảm nhí về ngài trong trại," [adoring_fan.GetSheHe] bật cười,"
  ep3_decisions_event.5001.desc: "\"họ nói rằng ngài từng băng qua một cây cầu làm từ gươm giáo, tiến vào khu rừng bị yểm phép để cứu một [dummy_opposite_gender.GetWomanMan] xinh đẹp... rằng một [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')] kỳ diệu đã ban cho ngài áo choàng thần diệu của nó.\"\n\n[adoring_fan.GetSheHe|U] ra hiệu cho gia nhân mang tới một bộ áo giáp ánh ngọc.\n\n\"Món quà, từ tất cả những người ngài đã giúp đỡ.\""
  ep3_decisions_event.5001.a: "\"Và ta vẫn chưa giúp đủ.\""
  ep3_decisions_event.5001.b: "\"Ta có thể ban tặng #EMP vô số#! kiểu giúp đỡ.\""
  ep3_courteous_knight_modifier: "Hiệp Sĩ Nhã Nhặn"
  ep3_courteous_knight_modifier_desc: "Nhân vật này hiểu rằng tình yêu là niềm vui lớn nhất của đời người."
  ep3_valiant_knight_modifier: "Hiệp Sĩ Dũng Cảm"
  ep3_valiant_knight_modifier_desc: "Nhân vật này đặt việc bảo vệ kẻ vô tội lên hàng đầu."
  ep3_courteous_knight_var_tt: "[success_chance|E] của Ngài trong các [schemes|E] [GetScheme('courting').GetTypeName] sẽ tăng mạnh"
  SCHEME_COURTEOUS_KNIGHT: "Ngài là Hiệp Sĩ Nhã Nhặn: $VALUE|+0=$"
  artifact_knight_of_the_swan_tt: "Ngài sẽ trở thành chủ sở hữu của [newly_created_artifact.GetName]"
  artifact_knight_of_the_swan_name: "Áo Choàng Vàng của [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|U]"
  artifact_knight_of_the_swan: "Một bộ áo giáp được trang trí bằng họa tiết hoa lá. Người ta nói rằng người mang nó không bao giờ được tiết lộ tên mình."
  swan_knight_title: "$knight_errant_decision$"
  swan_knight_desc: "Rồi họ thấy một sinh vật trắng như tuyết kéo theo con thuyền ánh ngọc, trên đó là một $knight_culture_player_no_tooltip_lowercase$ oai nghiêm, dường như chính sinh vật ấy dẫn lối."
  legend_chapter_opening_swan_knight: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] lang thang khắp vùng đất cùng những người tùy tùng trung thành của [ROOT.Legend.GetProtagonist.GetHerHis], chiến đấu với bọn côn đồ và giải cứu những người gặp nạn."
  legend_chapter_motivation_swan_knight: "Một buổi sáng, khi bước vào khu rừng sương mù, [ROOT.Legend.GetProtagonist.GetSheHe] nghe thấy tiếng kêu cứu mà [ROOT.Legend.GetProtagonist.GetSheHe] không thể làm ngơ."
  legend_chapter_famous_deed_swan_knight: "Một thiếu nữ xinh đẹp bị đe dọa bởi một hiệp sĩ độc ác, nhưng [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] đã đánh bại hắn trong trận đấu đơn, và một [ROOT.Legend.GetProperty( 'friendly_animal' ).GetFlagName] trắng muốt sinh ra từ vũng máu."
  legend_chapter_conclusion_swan_knight: "[ROOT.Legend.GetProtagonist.GetSheHe|U] nói với nàng: 'đừng hỏi tên ta, vì đó không phải thứ ta có thể ban tặng.'"
 
  ep3_decisions_event.5002.t: "Nỗi Nhục của Gia Tộc"
  ep3_decisions_event.5002.desc: "\"Ta không ngờ ngươi lại cam chịu nỗi nhục nhã này.\" Một con ngựa dừng ngay bên trại. Ta nhận ra kỵ sĩ ấy là người #EMP thân yêu#! của ta, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_rival'))], [my_rival.GetTitledFirstName].\n\n\"Ngươi bị làm sao vậy? Đóng vai $knight_culture_player_plural_no_tooltip_lowercase$, sống như chuyện cổ tích trẻ con,\" [my_rival.GetSheHe] xuống ngựa, nhổ xuống đất.\n\n\"Bao giờ ngươi mới tỉnh ngộ? Hãy kiếm cho mình chút đất đai đi, trước khi ngươi tiếp tục bôi nhọ thanh danh của gia tộc ta.\""
  ep3_decisions_event.5002.a: "\"Có lẽ đã đến lúc ổn định...\""
  ep3_decisions_event.5002.b: "\"Ta không có thời gian cho những [my_rival.GetWomenMen] vô danh dự.\""
  rival_called_me_a_disgrace: "[TARGET_CHARACTER.GetShortUIName|U] buộc tội [CHARACTER.GetShortUIName] là nỗi nhục của gia tộc"
  rival_called_me_a_disgrace_corresponding: "[CHARACTER.GetShortUIName|U] buộc tội [TARGET_CHARACTER.GetShortUIName] là nỗi nhục của gia tộc"
  ep3_black_sheep: "Kẻ Lạc Loài"
  ep3_black_sheep_desc: "Nhân vật này đã phản đối một thành viên gia tộc khi bị gọi là nỗi nhục vì lối sống lang bạt."
  ep3_decisions_event_5002_a_tt: "#bold Mua đất#! sẽ rẻ hơn #high 50%#!"

