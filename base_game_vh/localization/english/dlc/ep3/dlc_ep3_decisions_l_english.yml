 # EP3 Split the Empire
  split_roman_empire_decision: "Chia Cắt Đế Chế"
  split_roman_empire_decision_desc: "Có nhiều lý do khiến một đế chế rộng lớn như vậy bị chia tách trong thời đại tổ tiên chúng ta — và những lý do đó cho đến nay vẫn còn nguyên giá trị. Quyền lực một lần nữa phải được phân chia."
  split_roman_empire_decision_selection_tooltip: "[GetPlayer.GetPrimaryTitle.GetName] sẽ bị chia làm hai, từ đó hình thành [eastern_roman_empire|E]"
  split_roman_empire_decision_confirm: "Cứ làm như vậy."
  form_eastern_roman_empire_tt: "#HIGH [new_holder.GetName]#!:\n$EFFECT_LIST_BULLET$Nhận được [eastern_roman_empire|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey( 'c_byzantion' ).GetBaseNameNoTier] trở thành [realm_capital|E] mới của họ"
  ending_of_restore_rome_trials_tt: "Các hiệu ứng từ việc khôi phục La Mã ban đầu sẽ bị đảo ngược:\n$EFFECT_LIST_BULLET$Tất cả [peasant_factions|E] trong [realm|E] của Ngài sẽ không còn nhắm vào Ngài\n$EFFECT_LIST_BULLET$Giảm số lượng [wars|E] từ các [titles|E] Vương quốc khác\n$EFFECT_LIST_BULLET$Giảm tần suất [epidemic|E]\n$EFFECT_LIST_BULLET$Dòng thời gian Xâm Lược Mông Cổ sẽ trở lại bình thường#!"

  seasoned_visitor_decision: "Những Chuyến Du Hành của [ROOT.Char.GetFullNameNoTooltip]"
  seasoned_visitor_decision_desc: "Ta đã chu du khắp nơi xa gần, đặt chân đến những vùng đất kỳ lạ và khác thường. Trí tuệ ta tích lũy được là vô song, một kho báu dành cho bất kỳ tâm hồn hiếu kỳ và uyên bác nào."
  seasoned_visitor_decision_tooltip: "Nhìn lại những chuyến du hành của Ngài"
  seasoned_visitor_decision_reward_desc: "Ngài sẽ mở khóa các [perks|E] [lifestyle|E] mới #EMP hoặc#! tạo ra một [artifact|E] Sách giúp tăng lượng [lifestyle_experience|E] nhận được cho những người sở hữu sau này\n#i Mỗi #V 12#! $game_concept_points_of_interest$ đã ghé thăm, tối đa #V 60#!, sẽ làm tăng phần thưởng#!"
  seasoned_visitor_decision_confirm: "Ta đã chứng kiến những điều kỳ diệu"
  seasoned_visitor_decision_not_enough_poi: "Ngài đã ghé thăm #color_white 26#! [points_of_interest|E] #weak (Hiện tại: [THIS.Var('poi_visited').GetValue|V0])#!"
  seasoned_visitor_decision_not_enough_poi_advanced: "Ngài đã ghé thăm #color_white 42#! [points_of_interest|E] #weak (Hiện tại: [THIS.Var('poi_visited').GetValue|V0])#!"
  NOT_ARTIFACT_CREATOR: "Không phải là người tạo ra Thánh Vật này"

  ep3_laamp_decision_event.1100.t: "$seasoned_visitor_decision$"
  ep3_laamp_decision_event.1100.desc: "Ánh mặt trời rực rỡ mọc lên trên những đỉnh núi tuyết, những con hẻm sôi động của các đô thị rộng lớn, những ngôi đền che chở cả những kẻ mộ đạo nhất lẫn những linh hồn khốn khổ nhất.\n\nNhững công trình của con người qua hàng thế kỷ, những kỳ quan của Tự Nhiên được tạo tác bởi bàn tay toàn năng của [ROOT.Char.GetFaith.HighGodName]. Ta đã thấy tất cả.\n\nTa đã trò chuyện với cả kẻ quyền quý lẫn thứ dân, đã chứng kiến con người sinh sống theo vô vàn cách khác nhau. Một kho tàng quan sát sắc bén, những hồi ức không tì vết ấy sẽ là báu vật được trân quý bởi bất kỳ ai có dù chỉ một tia tò mò... nếu ta quyết định ghi chép lại."
  ep3_laamp_decision_event.1100.a: "Những ký ức này chỉ thuộc về riêng ta."
  ep3_laamp_decision_event.1100.a.flavor: "Ta có thể nói mãi, nhưng người nghe chỉ giữ lại những lời họ mong đợi."
  ep3_laamp_decision_event.1100.a.desc: "Vì Ngài đã ghé thăm [THIS.Var('poi_visited').GetValue] $game_concept_points_of_interest$:"
  ep3_laamp_decision_event.1100.b: ""Ta chưa kể được một nửa những gì mình đã thấy...""
  ep3_laamp_decision_event.1100.b.flavor: "...bởi ta biết rằng sẽ chẳng ai tin."
  ep3_laamp_decision_event.1100.b.desc: "#weak Thánh vật này sẽ cung cấp [lifestyle_experience|E] cho #color_yellow những người sở hữu sau#!, chất lượng của nó tăng theo mỗi tá $game_concept_points_of_interest$ đã ghé thăm.#!"
  ep3_laamp_decision_event.1100.c: "Cây bút của ta sẽ tạm thời vẫn khô mực."
  ep3_laamp_decision_event.1100.c.desc: "Ngài trì hoãn quyết định ghi chép câu chuyện về những chuyến du hành của mình."
  ep3_laamp_decision_event.1100.c.flavor: "Không có đá, sẽ không có vòm."

  marco_polo_book_title: "$seasoned_visitor_decision$"
  marco_polo_book_desc: "[newly_created_artifact.Custom('ArtifactMarcoPoloIntro')]\n\n[newly_created_artifact.Custom('ArtifactMarcoPoloDesc')]\n\n[newly_created_artifact.Custom('ArtifactMarcoPoloEnd')]"

  zealous_missionary_prep_decision: "Con Đường của Người [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — Thăng Hoa"
  zealous_missionary_prep_decision_desc: "Sự tồn tại dai dẳng của lũ dị giáo đê tiện và những kẻ ngoại đạo lạc lối là một sự xúc phạm đối với bất kỳ người [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] chân chính nào, đối với chính [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U]!"
  zealous_missionary_prep_decision_tooltip: "Đã đến lúc của người truyền giáo"
  zealous_missionary_prep_decision_holy_site: "Vị trí hiện tại của Ngài phải là một [holy_site|E] [THIS.Char.GetFaith.GetAdjective], theo [THIS.Char.GetFaith.GetName], và được cai trị bởi một [top_liege|E] [THIS.Char.GetFaith.GetAdjective]."
  zealous_missionary_prep_decision_holy_sites_visited_req: "Ngài đã hoàn thành [pilgrimages|E] đến ít nhất hai [holy_sites|E] khác nhau"
  zealous_missionary_prep_decision_reward_desc: "Trong thập kỷ tới, Ngài sẽ bước đi trên con đường của một nhà truyền giáo [THIS.Char.GetFaith.GetAdjectiveNoTooltip] mộ đạo:\n#weak Ngài có thể cải đạo các quận hạt mình ghé qua sang [THIS.Char.GetFaith.GetName], bằng lẽ phải trong lời nói hoặc bằng sức mạnh của lưỡi gươm.\n#bold Hiểm họa khủng khiếp#! chờ đợi những kẻ thất bại dọc đường, bởi chỉ những người xứng đáng mới nhận được phần thưởng của [THIS.Char.GetFaith.HighGodHerHis|U] nơi [THIS.Char.GetFaith.PositiveAfterLife|U].\n\n$EFFECT_LIST_BULLET$ @alert_icon! $ep3_laamp_decision_event.1103.difficulty.desc$\n$EFFECT_LIST_BULLET$ [learning_i] $ep3_laamp_decision_event.1103.a.desc$\n$EFFECT_LIST_BULLET$ [martial_i] $ep3_laamp_decision_event.1103.b.desc$"
  zealous_missionary_prep_decision_confirm: "[ROOT.Char.GetFaith.HighGodName] vĩ đại thay!"

  ep3_laamp_decision_event.1101.t: "$zealous_missionary_prep_decision$"
  ep3_laamp_decision_event.1101.desc: "Hiếm có nơi nào trên trần thế mà quyền năng toàn năng của [ROOT.Char.GetFaith.HighGodName] lại có thể được chứng kiến rõ rệt như tại [holy_site_location.GetNameNoTooltip]. Phúc lành dành cho những tín đồ đã hành hương đến đây để cảm nhận sức mạnh của [ROOT.Char.GetFaith.HighGodHerHis|U].\n\nVới đa số người, vùng đất thiêng liêng này là điểm kết thúc của hành trình, là đỉnh cao nhất của đời họ. Nhưng với ta, đây chỉ mới là khởi đầu con đường của mình.\n\nVà đối với những kẻ mà ta sắp mang ánh sáng của [ROOT.Char.GetFaith.HighGodHerHis|U] đến, đây là cơ hội cứu rỗi duy nhất của họ."
  ep3_laamp_decision_event.1101.a: "Ta đắm mình trong vinh quang của [ROOT.Char.GetFaith.HighGodName|U]!"
  ep3_laamp_decision_event.1101.a.desc: "$zealous_missionary_prep_decision_reward_desc$\nĐể tiếp tục con đường mộ đạo của mình, Ngài cần di chuyển đến những vùng đất ngoại đạo."

  zealous_missionary_start_decision: "Con Đường của Người [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — Khúc Dạo Đầu"
  zealous_missionary_start_decision_desc: "Không thể mong đợi [ROOT.Char.GetFaith.HighGodName|U] tự mình làm tất cả. [ROOT.Char.GetFaith.HighGodNameSheHe|U] cần những tín đồ để dẫn dắt kẻ lạc lối... dù họ có muốn hay không."
  zealous_missionary_start_decision_other_faith_location: "Vị trí của Ngài phải theo một [faith|E] khác"
  zealous_missionary_start_decision_tooltip: "Ta phải trở thành một trong những người [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] chân chính"
  zealous_missionary_start_decision_reward_desc: "$zealous_missionary_prep_decision_reward_desc$"
  zealous_missionary_start_decision_confirm: "Hỡi linh hồn ta, hãy mau chóng đáp lại lời kêu gọi của [ROOT.Char.GetFaith.HighGodHerHis|U]!"
 
  ep3_laamp_decision_event.1102.t: "$zealous_missionary_start_decision$"
  ep3_laamp_decision_event.1102.desc: "Xa kia là những vùng đất thiêng liêng của [ROOT.Var('holy_site_ascension').Province.GetName]. Thế nhưng ta vẫn cảm nhận được sức mạnh của [ROOT.Char.GetFaith.HighGodName] trong tim mình, mạnh mẽ hơn bao giờ hết.\n\nĐịnh mệnh của ta — từ thuở ban đầu — là thực thi công việc của [ROOT.Char.GetFaith.HighGodHerHis|U], lấp đầy những vùng đất này và linh hồn của những con người nơi đây bằng ánh sáng của [ROOT.Char.GetFaith.HighGodHerHis|U]. Sự cứu rỗi đang chờ đợi họ, và ta chỉ là công cụ khiêm nhường của [ROOT.Char.GetFaith.HighGodHerHis|U]."
  ep3_laamp_decision_event.1102.a: "Và họ sẽ biết đến danh xưng của [ROOT.Char.GetFaith.HighGodName]!"
  ep3_laamp_decision_event.1102.a.desc: "$zealous_missionary_prep_decision_reward_desc$\n#weak Ngài sẽ có 10 năm để truyền bá [faith|E] của mình trong lúc du hành."
  ep3_laamp_decision_event.1102.b: "Ta vẫn cần thêm thời gian để chuẩn bị."
  ep3_laamp_decision_event.1102.b.desc: "Ngài trì hoãn quyết định này đến sau."

  ep3_laamp_decision_event.1103.t: "Con Đường của Người [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — Thành Tựu"
  ep3_laamp_decision_event.1103.desc: "Khoảnh khắc quan trọng nhất đối với [current_location.GetCounty.GetName] đã đến cùng sự xuất hiện của ta, bởi hôm nay ta mang theo ánh sáng của [ROOT.Char.GetFaith.HighGodName|U], và [ROOT.Char.GetFaith.HighGodNameSheHe|U] sẽ bước vào trái tim họ, ngự trị nơi đó qua nhiều thế hệ.\n\nGiới quyền quý địa phương, [current_location.GetCounty.GetTitle.GetHolder.GetName] cùng bè lũ méo mó của hắn, quá ngoan cố, quá vấy bẩn bởi những nghi thức giả dối của [current_location.GetCounty.GetFaith.GetName]. Nhưng linh hồn của những người [current_location.GetCounty.GetCulture.GetCollectiveNoun] nghèo khổ đang kêu gọi ta, khát khao ân sủng của [ROOT.Char.GetFaith.HighGodHerHis|U]. Và họ sẽ được ban cho!"
  ep3_laamp_decision_event.1103.desc.alternative: "Con đường của một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] sùng đạo không phải là một con đường dễ dàng, những gian khổ của [ROOT.Char.GetHerHis] kéo dài và không có phần thưởng trần thế. Chỉ có hy vọng mới giữ ta đứng vững. [ROOT.Char.GetSheHe|U] bước đi trong đức tin thuần khiết phó mặc bản thân vào bàn tay của [ROOT.Char.GetFaith.HighGodName|U], như một đứa trẻ trong vòng tay mẹ.\n\nTa hành trình về phía trước, vì công việc và vinh quang của [ROOT.Char.GetFaith.HighGodHerHis|U] vẫn chưa hoàn thành, vì trái tim của [current_location.GetCounty.GetFaith.GetAdherentNamePlural] ở đây vẫn đầy dối trá và mê tín dị đoan.\n\nNhưng không lâu đâu. Hôm nay, thử thách của ta tiếp tục và của họ bắt đầu. "
  ep3_laamp_decision_event.1103.difficulty.desc: "#weak Các quận hạt có mức phát triển cao sẽ khó cải đạo hơn."
  ep3_laamp_decision_event.1103.a.desc: "#weak Nói được ngôn ngữ địa phương sẽ tăng tỷ lệ thành công."
  ep3_laamp_decision_event.1103.a: "Hãy lắng nghe tiếng gọi của [ROOT.Char.GetFaith.HighGodName]!"
  ep3_laamp_decision_event.1103.a.alternative: "Hãy cùng cầu nguyện cho sự cứu rỗi của người [current_location.GetCounty.GetCulture.GetNameNoTooltip]."
  ep3_laamp_decision_event.1103.a.success: "Cải đạo thành công"
  ep3_laamp_decision_event.1103.a.failure: "Cải đạo thất bại"
  ep3_laamp_decision_event.1103.b: "Chỉ kẻ có đức tin mới được tồn tại!"
  ep3_laamp_decision_event.1103.b.alternative: "Hoặc [ROOT.Char.GetFaith.HighGodNameSheHe|U], hoặc lưỡi gươm của ta sẽ thấu tim các ngươi!"
  ep3_laamp_decision_event.1103.b.desc: "#weak Có nhiều binh lính và kỵ sĩ hơn quân đồn trú địa phương cũng sẽ tăng tỷ lệ thành công."
  ep3_laamp_decision_event.1103.b.flavor: "Biến con người thành xác chết thì dễ hơn là [ROOT.Char.GetFaith.GetAdherentNamePlural]"
  ep3_laamp_decision_event.1103.c: "Thật là một nơi ô uế."
  ep3_laamp_decision_event.1103.c.alternative: "Đừng lãng phí thời gian ở [current_location.GetCounty.GetName]"
  ep3_laamp_decision_event.1103.c.desc: "Ngài sẽ không cố gắng cải đạo dân cư địa phương."
  ep3_laamp_decision_event.1103.c.flavor: "Nếu [ROOT.Char.GetFaith.DevilName] thật sự đã tạo ra [current_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] như vài người nói, thì hẳn đây là nơi hắn nghỉ ngơi vào ngày thứ bảy."

  ep3_laamp_decision_event.1104.t: "Con Đường của Người [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — Kết Thúc"
  ep3_laamp_decision_event.1104.desc: "Ta được ban phước! Mười năm trước, tại [ROOT.Var('holy_site_ascension').Province.GetName], [ROOT.Char.GetFaith.HighGodName] đã đến với ta, bước vào trái tim ta và lấp đầy nó bằng niềm vui và vẻ đẹp vĩnh cửu. Và kể từ đó, ta lang thang trên cõi đời của [ROOT.Char.GetFaith.HighGodHerHis|U], rao giảng lời của [ROOT.Char.GetFaith.HighGodHerHis|U].\n\nBất cứ nơi nào ta đặt chân tới, quyền năng của [ROOT.Char.GetFaith.HighGodHerHis|U] đều ở bên ta, lan tỏa khắp các vùng đất và trái tim con người.\n\nVà hôm nay, con đường truyền giáo của ta kết thúc, trong vinh quang của [ROOT.Char.GetFaith.HighGodName], khi biết rằng ta đã hoàn thành phần việc của mình trong đại kế hoạch của [ROOT.Char.GetFaith.HighGodHerHis|U]."
  ep3_laamp_decision_event.1104.desc.failure: "Ta đã được ban phước! Mười năm trước, tại [ROOT.Var('holy_site_ascension').Province.GetName], [ROOT.Char.GetFaith.HighGodName] đã đến với ta, bước vào trái tim ta và lấp đầy nó bằng niềm vui và vẻ đẹp vĩnh cửu. Và điều duy nhất [ROOT.Char.GetFaith.HighGodNameSheHe|U] yêu cầu đổi lại là ta phải đi khắp nơi và sẻ chia điều đó cho đến hơi thở cuối cùng.\n\nThế nhưng ta, như một linh hồn khốn khổ chưa từng được [ROOT.Char.GetFaith.HighGodHerHis|U] chạm tới, lại giữ nó cho riêng mình. Ta đã cố gắng đủ hay chưa? Hay chính [ROOT.Char.GetFaith.DevilName] khốn kiếp đã khiến ta lạc lối? Vết nhơ trên linh hồn ta, vết nhơ của thất bại, của bất kính, sẽ còn mãi đến muôn đời."
  ep3_laamp_decision_event.1104.a: "Phần thưởng của [ROOT.Char.GetFaith.HighGodNamePossessive] đang chờ đợi ta nơi [ROOT.Char.GetFaith.PositiveAfterLife|U]."
  ep3_laamp_decision_event.1104.b: "[ROOT.Char.GetFaith.HighGodName] hãy tha thứ cho con, vì con đã thất bại."

  become_conqueror_decision: "Trở Thành Đại Chinh Phạt Giả"
  become_conqueror_decision_desc: "Đã quá lâu thanh kiếm của ta chỉ mang lại vinh hoa cho kẻ khác, giờ đây mặt đất sẽ bị nhấn chìm dưới đại dương máu vì vinh quang của #EMP ta#!. Một thời kỳ đại tai ương sẽ khởi đầu, chưa từng có kể từ buổi sơ khai!"
  become_conqueror_decision_tooltip: "#WEAK Ta cất lời ca về chiến tranh và con người nơi chiến trận#!"
  become_conqueror_decision_confirm: "Ta là hình phạt của [ROOT.Char.GetFaith.HighGodName]!"
  become_conqueror_decision_reward: "Khi trở thành người có lãnh thổ, Ngài sẽ nhận được [trait|E] #V [GetTrait('conqueror').GetName( GetNullCharacter )]#!"
  become_conqueror_decision_troops: "Ngài sẽ nhận được một đạo quân cựu binh thiện chiến, bao gồm [GetMaA('accolade_maa_lancers').GetName] và [GetMaA('accolade_maa_vanguards').GetName]"
  become_conqueror_decision_legend_seed: "Ngài sẽ nhận được [legend_seed|E] #EMP $legend_chronicle_conqueror_chronicle$#!"
  become_conqueror_decision_war_participation: "Ngài đã tham gia ít nhất 20 cuộc chiến"
  become_conqueror_decision_war_participation_kingdom: "Ngài đã tham gia ít nhất 5 cuộc chiến chống lại [kings|E] hoặc [emperors|E]"
  become_conqueror_decision_two_commander_traits: "Ngài có ít nhất 2 [commander_traits|E]"
  become_conqueror_decision_enough_troops: "Ngài có ít nhất 4000 [soldiers|E]"
  become_conqueror_decision_enough_battle_kills: "Ngài đã giết ít nhất 12 [characters|E]"
  become_conqueror_decision_enough_war_contracts: "Ngài đã hoàn thành ít nhất 20 $laamp_raid_contract_contract$ hoặc $laamp_join_war_contract_contract$ [task_contracts|E]"
  become_conqueror_decision_enough_high_level_knights: "Ngài có ít nhất 6 kỵ sĩ với [prowess|E] từ 18 trở lên"
  become_conqueror_decision_enough_mediocre_knights: "Ngài có ít nhất 12 kỵ sĩ với [prowess|E] từ 12 trở lên"
  become_conqueror_decision_war: "Ngài sẽ bắt đầu một cuộc chiến với [conq_war_target.GetName]"

  ep3_laamp_decision_event.1110.t: "$become_conqueror_decision$"
  ep3_laamp_decision_event.1110.desc.has_kill: "Ta vẫn còn nhớ cái chết của [first_kill.GetTitledFirstNamePossessive], kẻ đầu tiên mà ta nhớ rõ đã chết theo ý muốn của ta. Ngay từ khi đó, ta đã có hứng thú với chuyện này chăng? Hay cái... #EMP cơn khát#! bên trong ta, nhu cầu muốn nhiều hơn nữa, đã bùng lên ngay khoảnh khắc ấy — hay chỉ đơn giản là cháy đủ sáng để cuối cùng lộ diện?\n\nKể từ đó, đã có rất nhiều kẻ khác theo chân [first_kill.GetHerHim]."
  ep3_laamp_decision_event.1110.desc.hasnt_kill: "Thật là một ý nghĩ kỳ lạ. Ta không có ký ức rõ ràng nào về kẻ đầu tiên bị giết theo lệnh của ta, chứ đừng nói là bởi chính tay ta. Người ta tưởng điều đó sẽ ám ảnh một [ROOT.Char.GetWomanMan], nhưng ta chưa bao giờ thật sự bận tâm đến khuôn mặt hay tên tuổi của kẻ chết.\n\nTa không thể đếm nổi bao nhiêu kẻ ta đã tiễn xuống mồ — càng không nói chính xác là #EMP ai#!."
  ep3_laamp_decision_event.1110.desc.outro: "Với hầu hết mọi người, từng ấy thảm sát đã là quá đủ — nhưng với ta thì không.\n\nTa không thể không mỉm cười khi nhìn về phía chân trời. Không phải vì những kẻ đã chết. Ta mỉm cười vì những kẻ sẽ chết."
  ep3_laamp_decision_event.1110.desc: "Nhiều năm trước, ta đã giết [first_kill.GetName] trong trận chiến. Ký ức đó đã ở lại với ta kể từ đó. Ngực của [first_kill.GetHerHis|U] bị xé toạc bởi đòn đánh của ta, đôi mắt của [first_kill.GetHerHis] mở to trong sự hoài nghi, máu của [first_kill.GetHerHis] nhỏ xuống mặt đất, làm cho đất đai thêm màu mỡ.\n\nNhiều người khác đã gia nhập cùng [first_kill.GetHerHim] kể từ đó. Đối với hầu hết mọi người, cuộc tàn sát như vậy là quá đủ. Nhưng không phải đối với ta.\n\nTa không thể không mỉm cười khi nhìn về phía chân trời. Không phải cho những người đã chết. Ta mỉm cười cho những kẻ sẽ chết."
 #ep3_laamp_decision_event.1110.desc: "Years ago, I slew [first_kill.GetName] in battle. The memory has stayed with me since. [first_kill.GetHerHis|U] chest ripped apart by my blow, [first_kill.GetHerHis] eyes wide open in disbelief, [first_kill.GetHerHis] blood dripping to the ground, making the soil fertile.\n\nMany more have joined [first_kill.GetHerHim] since. For most, such slaughter would be enough. But not for me.\n\nI cannot help but smile as I look to the horizon. Not for those who died. I smile for those that will."
  ep3_laamp_decision_event.1110.a: "Chinh phục thế giới trên lưng ngựa thì dễ..."
  ep3_laamp_decision_event.1110.a.flavor: "...xuống ngựa và cai trị mới là điều khó."
  ep3_laamp_decision_event.1110.a.desc: "$become_conqueror_decision_reward$"

  bandit_king_decision: "Triệu tập những kẻ bị ruồng bỏ"
  bandit_king_decision_desc: "Ta sẽ trở thành kẻ thống lĩnh con trai và con gái của những con hẻm tối. Một đạo quân gồm những tên vô lại tồi tệ nhất, bị trói buộc vào mục đích và ý muốn của ta, để gieo rắc hỗn loạn lên cả kẻ yếu lẫn kẻ mạnh."
  bandit_king_decision_reward: "#Bold Mỗi#! lần Ngài hoàn thành một [criminal_task_contract|E], Ngài sẽ nhận được [men_at_arms|E] độc nhất.\n#weak Số lượng phụ thuộc vào tiến trình trong [GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track|E], từ 100 đến 1000 quân."
  bandit_king_decision_tooltip: "Hãy đếm những kẻ hèn nhát, đếm những kẻ tham lam, những kẻ đã chiến đấu chỉ để sinh tồn"
  bandit_king_decision_confirm: "Hãy tụ họp dưới trướng ta, hỡi những kẻ khốn cùng của trần gian!"

  ep3_gallowsbait_army: "Lũ cặn bã giá treo cổ"
  ep3_bandits_army: "Những kẻ khốn cùng & bị lãng quên"
  ep3_poachers_army: "Những kẻ vui tính"
  maa_bandits: "Bọn cướp"
  maa_bandits_flavor: "#F Cặn bã của trần gian, những Bạn ta đã từ bỏ luật pháp để sống cuộc đời tội phạm."
  maa_poachers: "Bọn săn trộm"
  maa_poachers_flavor: "$maa_bandits_flavor$"
  maa_thieves: "Bọn cướp bóc"
  maa_thieves_flavor: "$maa_bandits_flavor$"
  maa_marauders: "Bọn càn quét"
  maa_marauders_flavor: "$maa_bandits_flavor$"
  bandit_king_maa_spawn_effect_desc: "Ngài sẽ nhận được một đội quân nhỏ gồm $maa_marauders$ và $maa_poachers$, hoặc $maa_thieves$ và $maa_bandits$"

  bandit_king_modifier: "Ân nhân của bọn cướp"
  bandit_king_modifier_desc: "Nhân vật này chiêu mộ tay chân từ tầng lớp thấp kém nhất của xã hội, bất cứ khi nào có thể.\n\n#Bold Mỗi#! #weak lần nhân vật này hoàn thành một [intrigue|E] [task_contract|E], họ sẽ nhận được [men_at_arms|E] độc nhất.\nSố lượng phụ thuộc vào tiến trình trong [GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track|E].#!"

  ep3_laamp_decision_event.1120.t: "$bandit_king_decision$"
  ep3_laamp_decision_event.1120.desc: "Khi tim Ngài bị một con dao gỉ đâm xuyên, Ngài sẽ chẳng bận tâm đến dòng dõi của kẻ cầm dao. Những hiệp sĩ trong bộ giáp sáng loáng, với vũ khí quý giá nhập từ khắp Tạo Hóa? Chúng cũng chết giống hệt như kẻ nghèo khoác giẻ rách, cầm cành cây vót nhọn bẻ từ bụi rậm gần nhất.\n\nCác lãnh chúa và quý bà với danh hiệu hoa mỹ cứ giữ lấy đám lính đánh thuê đắt đỏ của họ — và sống trong nỗi sợ bị phản bội mỗi khi có kẻ mang túi tiền lớn hơn đi ngang qua.\n\nHãy nghe ta và tụ họp lại đây, hỡi những kẻ không được chọn con đường đời mình, bởi bạo lực và máu đã khắc dấu lên các ngươi ngay từ khi sinh ra!"
  ep3_laamp_decision_event.1120.a: "$bandit_king_decision_confirm$"
  ep3_laamp_decision_event.1120.a.flavor: "Chỉ cần cho chúng quần áo tử tế để khỏi chết cóng đêm nay. Và có lẽ thay mấy cây gậy bằng những cây trường thương đàng hoàng."

  start_city_construction_decision: "Thành lập lãnh địa"
  start_city_construction_decision_desc: "Trong những chuyến du hành của ta, ta đã tích lũy được một khối tài sản đáng kể. Những vùng đất màu mỡ, nguyên sơ này trông như một nơi lý tưởng để đầu tư và gặt hái lợi ích trong những năm sắp tới."
  start_city_construction_decision_tooltip: "Hãy bổ cuốc xuống đất!"
  start_city_construction_decision_confirm: "Cầm xẻng lên!"
  start_city_construction_decision_empty_holding: "Ngài cần ở trong một [barony|E] chưa có lãnh địa"
  start_city_construction_decision_more_rewards: "Hoàn thành thêm các yêu cầu tùy chọn sẽ mở ra nhiều lựa chọn hơn khi thành lập thành phố, bao gồm việc xây dựng các [buildings|E] độc nhất\n\n#weak Ngài sẽ có thể xây dựng thêm nhiều thành phố sau thành phố này.\nKhi công trình hoàn tất, Ngài sẽ có cơ hội cưỡng chiếm thành phố cho riêng mình.\n\nNếu không, mỗi năm thành phố sẽ trả cổ tức. Số tiền phụ thuộc vào tổng cấp độ [building|E] trong [barony|E] này và mức [development|E] của quận, từ [gold_i]25 đến [gold_i]200. Khoản tiền này sẽ dần giảm đi theo từng năm sau khi công trình hoàn tất.#!"

  ep3_laamp_decision_event.1130.t: "Thành phố [city_location.GetNameNoTooltip] — Khởi đầu"
  ep3_laamp_decision_event.1130.desc: "Mảnh đất dưới chân ta vẫn chưa từng bị bàn tay con người chạm tới. Chưa.\n\nNhưng ta đã có thể thấy nơi tòa thị chính sẽ tọa lạc. Nơi các thương nhân cân đo hàng hóa và nộp thuế dưới ánh mắt cảnh giới của lính canh. Ta có thể nghe thấy tiếng chuông vang lên từ ngọn tháp.\n\nVật tư đã được tập kết, những người theo ta đang nôn nóng. Tất cả những gì còn thiếu chỉ là lời của ta."
  ep3_laamp_decision_event.1130.a: "Hãy bắt đầu!"
  ep3_laamp_decision_event.1130.a.desc: "$start_city_construction_decision_more_rewards$"
  ep3_laamp_decision_event.1130.b: "Ta đổi ý rồi, xin lỗi."
  ep3_laamp_decision_event.1130.b.desc: "Ngài từ bỏ việc xây dựng. Một phần số vàng đã tiêu sẽ được hoàn lại."

  ep3_laamp_decision_event.1131.t: "Thành phố [city_location.GetNameNoTooltip] — Kết thúc"
  ep3_laamp_decision_event.1131.desc: "Nhiều năm trước ta từng đứng tại nơi này, khi nó chỉ là một điểm hoang vu giữa rừng sâu. Giờ đây, nó đã là một thành phố đáng tự hào. Thật kỳ diệu! Nhưng ta tự hỏi liệu [city_location.GetCounty.GetTitle.GetHolder.GetName] có phải là người phù hợp để đảm bảo tương lai cho khu định cư mới của ta hay không.\n\nNhiều thập kỷ sau, người ta sẽ kể lại câu chuyện về việc ta đến [city_location.GetNameNoTooltip], khai phá tiềm năng của nó và..."
  ep3_laamp_decision_event.1131.a: "...ta đã chinh phục!"
  ep3_laamp_decision_event.1131.b: "...ta rời đi để đạt được nhiều thứ hơn ở nơi khác."
  ep3_laamp_decision_event.1131.b.desc: "Mỗi năm, thành phố sẽ trả cổ tức. Số tiền phụ thuộc vào tổng cấp độ [building|E] tại [city_location.GetName] và mức [development|E] của [city_location.GetCounty.GetName]."

  ep3_laamp_decision_event.1133.t: "Thành phố [city_location.GetName] — Sức mạnh của nước"
  ep3_laamp_decision_event.1133.desc: "Gần đây có một con suối chảy lững lờ. Với chuyên môn phù hợp — như của ta — và với sức lao động đúng đắn — như của những người theo ta — ta có thể chuyển hướng nó lại gần thành phố hơn.\n\nSau đó, việc xây dựng một cối xay nước bên trên sẽ là chuyện nhỏ. Thậm chí có thể là một cối xay lớn hơn, nếu còn đủ tài nguyên."
  ep3_laamp_decision_event.1133.a: "Tuyệt vời!"
  ep3_laamp_decision_event.1133.b: "Ta sẽ đầu tư vào việc này."
  ep3_laamp_decision_event.1133.c: "Ta không đủ khả năng."

  ep3_laamp_decision_event.1134.t: "Thành phố [city_location.GetNameNoTooltip] — Dân định cư"
  ep3_laamp_decision_event.1134.desc: "Việc xây dựng đang tiến triển tốt đẹp, bộ khung của thành phố đã hiện rõ. Chúng ta có đủ thợ xây để tiếp tục dựng nhà, nhưng lại không đủ người để lấp đầy từng tòa nhà, từng ngành nghề cần thiết.\n\nMay mắn thay, ta có thể tận dụng uy quyền của mình để thu hút thêm dân định cư. Tất nhiên, kèm theo một khoản khuyến khích nhỏ bằng vàng và bạc."
  ep3_laamp_decision_event.1134.a: "Tuyệt vời!"
  ep3_laamp_decision_event.1134.b: "Để ta mở hầu bao."
  ep3_laamp_decision_event.1134.c: "Thôi vậy."

  ep3_laamp_decision_event.1135.t: "Thành phố [city_location.GetNameNoTooltip] — Phá rừng"
  ep3_laamp_decision_event.1135.desc: "Những người sẽ sống tại đây cần nguồn lương thực ổn định. Diện tích đất canh tác ban đầu có lẽ đủ cho giai đoạn khởi đầu, nhưng nhiều cánh đồng hơn sẽ đảm bảo sự thịnh vượng trong nhiều thập kỷ.\n\nCó một cơ hội — những khu rừng của [city_location.GetCounty.GetTitle.GetHolder.GetName] đang giáp ranh với ruộng đất của ta, chờ được chuyển thành đất canh tác. Ta đã khôn ngoan duy trì quan hệ tốt với [city_location.GetCounty.GetTitle.GetHolder.GetHerHim], nên việc mua vài mảnh mansi sẽ không thành vấn đề. Sau đó, cây cối sẽ bị đốt trụi và bật gốc, để lớp đất màu mỡ lộ ra."
  ep3_laamp_decision_event.1135.a: "Cầm đuốc lên!"
  ep3_laamp_decision_event.1135.b: "Tập hợp tất cả lại, không cây nào được sót!"
  ep3_laamp_decision_event.1135.c: "Nghĩ lại thì thôi."

  ep3_laamp_decision_event.1136.t: "Thành phố [city_location.GetNameNoTooltip] — Kết nối thương mại"
  ep3_laamp_decision_event.1136.desc: "Tiêu thụ những gì vùng quê cung cấp, thưởng thức tinh hoa của những miền đất xa xôi, sản xuất hàng hóa và dịch vụ độc đáo — đó là vòng tuần hoàn tự nhiên của bất kỳ thành phố thịnh vượng nào.\n\nChúng ta có thể chờ đợi và để các mối liên kết thương mại phát triển tự nhiên theo thời gian — hoặc hành động trước, đảm bảo rằng đoàn xe thương mại đầu tiên sẽ lăn bánh qua cổng thành ngay khi viên gạch cuối cùng được đặt vào tường thành.\n\nTa biết vài thương nhân có thể lo liệu việc này. Họ cần vàng ngay bây giờ — một khoản nhỏ bé so với khối tài sản sẽ sớm đổ về nơi đây!"
  ep3_laamp_decision_event.1136.a: "Thật tuyệt!"
  ep3_laamp_decision_event.1136.b: "Chúng ta thỏa thuận."
  ep3_laamp_decision_event.1136.c: "Chắc chắn là không."

  ep3_laamp_decision_event.1137.t: "Thành phố [city_location.GetName] — Kết nối sùng đạo"
  ep3_laamp_decision_event.1137.desc: "Một thành phố tồn tại qua nhiều thập kỷ, thậm chí hàng thế kỷ, cần những công dân vững vàng, có niềm tin vào thành phố và vào chính bản thân họ. Và cần những người chăn dắt để dẫn lối họ trong lúc yếu lòng. Thành phố này cần thêm nhiều [ROOT.Char.GetFaith.GetAdherentNamePlural] mộ đạo.\n\nTa được nhìn nhận là một [ROOT.Char.GetWomanMan] sùng đạo với tiềm lực tài chính đáng kể. Với lượng vàng phù hợp cùng những lời cầu nguyện từ các giáo sĩ dễ thuyết phục, ta sẽ có đàn chiên của mình tại đây, cùng với bộ máy tôn giáo để giữ họ vững vàng trong ân sủng của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  ep3_laamp_decision_event.1137.a: "[ROOT.Char.GetFaith.HighGodName] phù hộ!"
  ep3_laamp_decision_event.1137.b: "Ta sẽ quyên góp cho mục đích này."
  ep3_laamp_decision_event.1137.c: "Than ôi, không."

  ep3_laamp_decision_event.1140.toast: "[city_location.GetName] chi trả cổ tức"
 
 # Renounce Governorship
  renounce_governorship_decision: "Từ bỏ chức Tổng trấn"
  renounce_ministership_decision: "Từ bỏ chức vị Thượng thư"
  renounce_governorship_decision_desc: "Rút lui về [estate|E] của gia tộc, tích lũy của cải và ảnh hưởng, rời xa những trách nhiệm của [governorship|E].\n\nTa sẽ để các đối thủ nghĩ rằng ta đang mục ruỗng trong bóng tối — nhưng thực chất, ta sẽ trở lại như phượng hoàng rực cháy để đánh gục chúng!"
  renounce_governorship_decision_desc_japan: "Từ bỏ các nghĩa vụ của [governorship|E] để gia nhập triều đình hoàng gia và tìm kiếm những cơ hội mới.\n\nTa sẽ để các đối thủ nghĩ rằng ta đang mục ruỗng trong bóng tối — nhưng thực chất, ta sẽ trở lại như phượng hoàng rực cháy để đánh gục chúng!"
  renounce_governorship_decision_desc_merit: "Rút lui về [estate|E] của gia tộc để tích lũy tri thức và kỹ năng, chuẩn bị vượt qua thêm một cấp trong [examinations|E]."
  renounce_governorship_decision_tooltip: "Không còn là một [governor|E]"
  renounce_ministership_decision_tooltip: "Từ bỏ chức quan [minister|E] của Ngài"
  renounce_governorship_decision_confirm: "Đó là một vinh dự."
  renounce_governorship_decision_effect_tt: "Ngài không còn là một [governor|E]"
  renounce_ministership_decision_effect_tt: "Ngài sẽ từ bỏ chức vị [minister|E]"
  renounce_governorship_family_title_tt: "Ngài không có [estate|E] để lui về"
  ep3_renounced_governorship: "Trong Bóng Tối"
  ep3_renounced_governorship_desc: "Nhân vật này đã chọn từ bỏ chức tổng trấn và chờ đợi thời cơ thích hợp để ra tay."
  ep3_renounced_governorship_merit: "Trở Lại Trường Học"
  ep3_renounced_governorship_merit_desc: "Nhân vật này đã chọn từ bỏ chức tổng trấn để học tập cho kỳ [examination|E] tiếp theo."
  renounced_governorship_japan: "Hiện Diện Nơi Triều Đình"
  renounced_governorship_japan_desc: "Nhân vật này đã hoàn thành một khoảng thời gian làm tổng trấn nơi thôn dã và quay trở lại trung tâm chính trị hoàng gia."
  ep3_renounced_estate: "Mùa Đông Bình Yên"
  ep3_renounced_estate_desc: "Nhân vật này đã rút lui khỏi mọi trách nhiệm để sống phần đời còn lại xa rời chốn công chúng."
 
  ep3_decisions_event.4090.t: "Một Bước Lùi"
  ep3_decisions_event.4090.desc: "Bên ngoài những bức tường của điền trang, trẻ con la hét khi chơi đùa, xe ngựa kẽo kẹt lăn bánh, và thương nhân rao bán hàng hóa của mình.\n\nTa đã phục vụ [liege.GetTitledFirstName] đủ lâu rồi.\n\nNhững bức tường này sẽ không tự xây nên — và hơn hết, một ngôi nhà cần nền móng vững chắc."
  ep3_decisions_event.4090.a: "Ta sẽ tìm kiếm những cơ hội mới."
  ep3_decisions_event.4090.a_merit: "Ta sẽ tập trung học tập."
 
 # Change Imperial Aspirations
  change_imperial_aspirations_decision: "Thay đổi Tham Vọng [GetPlayer.GetTopLiege.Custom('GetRoyalCourtRank')|U]"
  change_imperial_aspirations_decision_desc: "Không phải ai cũng phù hợp, hay thậm chí mong muốn, leo cao đến mức ngồi lên ngai vàng. Vì sao phải mạo hiểm khi ta hoàn toàn hài lòng với vị trí hiện tại? Hãy để kẻ khác tranh giành trong ổ rắn độc này!"
  change_imperial_aspirations_decision_tooltip: "Bày tỏ lập trường về việc Ngài có khao khát ngai vàng hay không"
