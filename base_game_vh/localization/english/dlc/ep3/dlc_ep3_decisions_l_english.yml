  ep3_decisions_event.4080.t: "Salon Được Thành Lập"
  ep3_decisions_event.4080.desc.intro: "Mọi thứ gần như đã hoàn tất. Một nơi chốn lâu dài để các thi sĩ tụ họp, giao lưu và dìu dắt thế hệ kế tiếp đang dần hiện ra trước mắt ta.\n\n"
  ep3_decisions_event.4080.wallada: "Giấc mơ của ta,"
  ep3_decisions_event.4080.heir: "Giấc mơ của người thầy ta,"
  ep3_decisions_event.4080.desc.outro: "một trung tâm nghệ thuật phồn thịnh và nhộn nhịp tại [location.GetName], cuối cùng cũng trở thành hiện thực.\n\nKhi những tấm ván sàn cuối cùng được lắp đặt, mùi gạch vữa mới sơn lan tỏa khắp sân. Đám đông chứng kiến vỡ òa trong tiếng reo hò khi ta dẫn những đứa trẻ mồ côi địa phương vào để bắt đầu việc học.\n\nĐiều duy nhất ta mong ước là nơi này sẽ trường tồn qua nhiều thế hệ."
  ep3_decisions_event.4080.a: "Thành quả của ta, và của biết bao người khác."
 
  mass_arrests_decision: "Ra Lệnh Bắt Giữ Hàng Loạt"
  mass_arrests_decision_desc: "Khi một [powerful_family|E] trở nên #EMP quá#! quyền thế, đôi khi cần phải dùng đến những biện pháp cực đoan. Ngăn một gia tộc hùng mạnh chống lại ta là chuyện vô cùng khó khăn — và chỉ có một cách chắc chắn: #EMP tống hết bọn họ vào xiềng xích.#!"
  mass_arrests_decision_tooltip: "Ra lệnh bắt giữ đồng loạt toàn bộ thành viên của một [powerful_family|E]"
