 # Embrace Heresy
  embrace_heresy_decision: "Chấp Nhận Dị Giáo"
  embrace_heresy_decision_desc: "Bất chấp sự tồn tại của một đức tin chính thống được [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip] bảo trợ, các niềm tin dị giáo vẫn đang lan rộng trên lãnh thổ của chúng ta. Nếu ta công khai chấp nhận một trong số đó và tự đặt mình vào vị trí lãnh đạo, ta có thể khai thác tiềm năng thô sơ của một đức tin không bị kìm hãm để gia tăng quyền lực và theo đuổi nghị trình chính trị của mình."
  embrace_heresy_decision_tooltip: "Chấp nhận một dị giáo và trở thành người đứng đầu của nó"
  heresy_in_empire_or_bordering_tt: "Một [faith|E] được ít nhất 3 [counties|E] theo, thuộc cùng [religion|E] với [state_faith|E] của [realm|E] thuộc [top_liege|E] của Ngài nhưng bị coi là [faith_hostile|E], phải tồn tại ở ít nhất 1 quận trong [realm|E] của [top_liege|E] hoặc tại một quận biên giới thuộc lãnh thổ ngoại bang"
  ep3_decisions_event.5020.t: "Chấp Nhận Dị Giáo"
  ep3_decisions_event.5020.desc: "Cơ hội đã quá rõ ràng, và ta chỉ cần nắm lấy nó.\n\nĐức tin [heresy_1.GetAdjective|U] đang trỗi dậy tại [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip] và cần một người dẫn dắt mạnh mẽ, có ảnh hưởng để đại diện cho nó trên vũ đài chính trị. Dĩ nhiên, việc tự đặt mình vào vị thế bị xem là kẻ dị giáo mang nhiều rủi ro, nhưng tiềm năng chưa được khai thác của việc tập hợp một thiểu số bị đàn áp dưới cùng một ngọn cờ quả thực đầy cám dỗ."
  ep3_decisions_event.5020.desc_more: "\n\nBối cảnh tôn giáo của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] bị chia rẽ đến mức ta cũng không nhất thiết phải gắn bó với lựa chọn đầu tiên."
  ep3_decisions_event.5020.a: "[heresy_1.GetNameNoTooltip|U] mới là con đường đúng đắn."
  ep3_decisions_event.5020.b: "Có lẽ [heresy_2.GetNameNoTooltip] trông hứa hẹn hơn?"
  ep3_decisions_event.5020.c: "[heresy_3.GetNameNoTooltip|U] có tiềm năng lớn nhất."
  ep3_decisions_event.5020.d: "Có lẽ ta đang quá vội vàng..."
  embrace_heresy_tt: "Ngài sẽ chấp nhận [faith|E] dị giáo đã chọn"
  leverage_position_tt: "Ngài sẽ thu được lợi ích về [hooks|E] và [influence|E], tương ứng với số lượng [vassals|E] và [counties|E] trong [realm|E] của [top_liege|E] theo cùng [faith|E] dị giáo với Ngài"
  unlocks_demand_state_faith_decision: "Mở khóa [decision|E] [GetDecisionWithKey('push_heresy_as_state_faith').GetName]"
  has_embraced_heresy_tt: "Ngài đã chấp nhận một [faith|E] thông qua [decision|E] [GetDecisionWithKey('embrace_heresy_decision').GetName] và vẫn đang theo đức tin đó"
  push_heresy_as_state_faith: "Thúc Đẩy Thay Đổi Quốc Giáo"
  push_heresy_as_state_faith_desc: "Sự ủng hộ trong dân chúng đối với đức tin mà ta dẫn dắt đã lan rộng khắp [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip]. Đã đến lúc [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] phải thừa nhận sức mạnh của chúng ta và công nhận rằng [ROOT.Char.GetFaith.GetName] là lựa chọn duy nhất hợp lệ cho quốc giáo của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
  push_heresy_as_state_faith_tooltip: "Thử gây sức ép để chủ quân công nhận đức tin của Ngài là quốc giáo"
  try_to_push_faith_with_emperor_tt: "Chủ quân của Ngài sẽ đánh giá yêu cầu này. Vị thế chính trị và tôn giáo của Ngài càng mạnh, khả năng họ chấp nhận càng cao. Hãy gia tăng [influence|E] cũng như số lượng [vassals|E] và [counties|E] trong [realm|E] của [top_liege|E] theo cùng [faith|E] với Ngài để nâng cao tỷ lệ thành công."
