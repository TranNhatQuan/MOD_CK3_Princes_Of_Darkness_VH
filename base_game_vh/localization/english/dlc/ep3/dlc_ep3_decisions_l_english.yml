  humiliate_the_stooge_decision_rewards: "Ngài công khai làm nhục $stooge_camp_officer$:\n$EFFECT_LIST_BULLET$Ngài mất một ít [stress_i] [stress|E]\n$EFFECT_LIST_BULLET$Ngài nhận được một ít [dread_i] [dread|E]\n$EFFECT_LIST_BULLET$Ngài nhận được [modifier|E] [GetModifier( 'stooge_humiliated_modifier' ).GetNameWithTooltip] trong #high 2#! năm"
