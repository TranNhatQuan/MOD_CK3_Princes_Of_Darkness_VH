  ep3_knight_of_the_swan_house_modifier: "Khúc Ca Thiên Nga"
  ep3_knight_of_the_swan_house_modifier_desc: "Gia tộc này nổi danh với tinh thần hiệp sĩ và danh dự mạnh mẽ."
  knight_errant_decision_tt: "Ngài đã hoàn thành #V [contract_tally]/10#! [task_contracts|E] [martial|E] hoặc [prowess|E] không mang tính [criminal|E]"
