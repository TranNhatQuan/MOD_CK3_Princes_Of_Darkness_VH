  trait_populist_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã giành được quyền lực sau khi chiến đấu vì nền độc lập của dân tộc [ROOT.GetCharacter.GetHerHis]."
 
