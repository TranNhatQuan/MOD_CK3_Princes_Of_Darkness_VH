  restore_backwater_counties_decision: "Khôi phục [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  restore_backwater_counties_decision_desc: "Trải qua nhiều thế kỷ, [ROOT.Char.GetPrimaryTitle.GetNameNoTier] đã rơi vào cảnh suy tàn, trở thành một cái bóng đáng xấu hổ của quá khứ huy hoàng từng có.\n\nNhưng chúng ta đã không mệt mỏi phát triển vùng đất tổ tiên để đưa nó trở lại vị thế vốn có. Vinh quang của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ được khôi phục!"
  restore_backwater_counties_decision_tooltip: "Loại bỏ [county_modifier|E] [GetModifier('backwater_county_modifier').GetNameWithTooltip] khỏi mọi [counties|E] có #V 50#! hoặc hơn [development|E]"
  restore_backwater_counties_decision_confirm: "Xác nhận"
  greek_backwater_modifier_removal_tt: "Mọi [county|E] có [GetModifier('backwater_county_modifier').GetNameWithTooltip] và có hơn #HIGH 50#! [development|E] sẽ mất [county_modifier|E]"
  no_backwater_counties_meet_criteria_tt: "@alert_icon! #alert_trial Hiện không có hạt nào đáp ứng điều kiện này!#!"

  greek_backwater_modifier_region: "Hy Lạp"
  backwater_county_eligible_modifier_removal_tt: "[development|E] của ít nhất một [county|E] thuộc lãnh địa phụ có [county_modifier|E] [GetModifier('backwater_county_modifier').GetName] đạt #V 50#! trở lên"
  restored_greek_theme_modifier: "Chủ đề Đã Phục Hưng"
  restored_greek_theme_modifier_desc: "Nhân vật này đã khôi phục một Chủ đề vượt qua cả những thời kỳ hoàng kim xưa cũ.\n[governor_efficiency|E]: @governor_efficiency!#P +10%#!"

  ep3_theme_not_backwater.t: "[target_theme.GetNameNoTierNoTooltip] Được Phục Hưng"
  ep3_theme_not_backwater.desc: "Mọi [county|E] trong [target_theme.GetNameNoTierNoTooltip] đã mất [county_modifier|E] [GetModifier('backwater_county_modifier').GetName]"
 
  ep3_decisions_event.3001.opening: "[ROOT.Char.GetTopLiege.Custom2('AppropriateGreeting', ROOT.Char)]"
  ep3_decisions_event.3000.desc: "Thật là một thành tựu xuất sắc khi khôi phục vùng đất [ROOT.Char.GetPrimaryTitle.GetNameNoTier] về với vinh quang cổ xưa của nó! Ta thực sự rất ấn tượng.\n\nTừ nay, [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] sẽ không còn làm hoen ố danh tiếng của đế quốc nữa."
  ep3_decisions_event.3000.a: "Vinh quang cho [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
  restored_greek_theme_gov_efficiency_tt: "Hiệu quả Thống đốc của Ngài tăng #P 10%#!"

  ep3_decisions_event.3001.t: "Hy Lạp Được Phục Hưng"
  ep3_decisions_event.3001.desc: "Khi hội đồng của ta cùng một số chiến lược gia tinh tuyển báo cáo tình hình lãnh thổ, [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] của ta là [interlocutor.GetFirstName] đã lên tiếng.\n\n\"Thần sẽ thiếu sót nếu không báo với ngài, thưa [interlocutor.Custom2('RelationToMeShort', ROOT.Char)], rằng những nỗ lực của đế quốc nhằm khôi phục các vùng đất Hy Lạp về vị thế lịch sử của chúng như những thành trì của văn minh đã thành công.\"\n\n\"Các chiến lược gia đã làm việc không ngừng để phát triển vùng đất của họ, qua đó gia tăng vinh quang của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l]!\""
  ep3_decisions_event.3001.a: "Hãy để vinh quang của lãnh thổ chúng ta được muôn người biết đến!"
  every_county_in_greece_tt: "Mọi [county|E] tại Hy Lạp"

  adopt_a_kennel_dog: "Nhận Nuôi Chó Chuồng"
  adopt_a_kennel_dog_desc: "Chứng kiến người quản lý chuồng điều khiển những con vật tuyệt vời này bằng lời nói và cử chỉ khiến ta mường tượng bản thân đang đứng bên cạnh người Ngài đồng hành trung thành của mình."
  adopt_a_kennel_dog_tooltip: "Nhận nuôi một con chó cưng để giảm [stress|E]"
  adopt_a_kennel_dog_confirm: "Chuẩn y!"

  prepare_greek_fire_dromons_decision: "Chuẩn Bị Dromon Lửa Hy Lạp"
  prepare_greek_fire_dromons_decision_desc: "Việc thiêu đốt eo biển Bosphorus từng cứu [GetTitleByKey('b_constantinople').GetNameNoTier] khỏi diệt vong, và hoàn toàn có thể làm điều đó một lần nữa. Vùng nước kín này là một trong số ít nơi mà hỏa lỏng — thứ bí mật được bảo vệ nghiêm ngặt của chúng ta — có thể được triển khai một cách đáng tin cậy.\n\nHãy chế tạo những ống phun lửa khổng lồ và vũ trang cho hạm đội đồn trú."
  prepare_greek_fire_dromons_decision_tooltip: "Cho phép [GetTitleByKey('b_constantinople').GetNameNoTier] tàn phá các [armies|E] [embarked|E] lân cận bằng thứ vũ khí khó lường và được giữ bí mật nghiêm ngặt bậc nhất."
  prepare_greek_fire_dromons_decision_confirm: "Bắt tay vào việc, các nhà giả kim — nhưng phải hết sức cẩn trọng!"

  prepare_greek_fire_dromons_constantinople_tt: "[capital|E] là [GetTitleByKey('c_byzantion').GetName]"
  prepare_greek_fire_dromons_capital_unoccupied_tt: "[capital|E] không bị [occupied|E]"
  prepare_greek_fire_dromons_no_modifier_tt: "[capital|E] chưa có [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip]"
  defensive_fire_dromons_3_years_tooltip: "Nếu Ngài hoàn thành [scheme|E] [GetScheme('prepare_fire_dromons_scheme').GetTypeName], [GetTitleByKey('c_byzantion').GetNameNoTier] sẽ nhận [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] trong #high 30 năm#!"
  defensive_fire_dromons_success_tooltip: "Khi thành công, [GetTitleByKey('c_byzantion').GetNameNoTier] sẽ nhận [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] trong #high 30 năm#!"
  defensive_fire_dromons_custom_desc: "Trong thời gian [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] còn hiệu lực, các [armies|E] [embarked|E] của kẻ địch gần [GetTitleByKey('c_byzantion').GetNameNoTier] có thể bị gây sát thương"
  defensive_fire_dromons_buildings_desc: "#weak Việc xây dựng các chuỗi [building|E] [GetBuilding('common_tradeport_01').GetName] và [GetBuilding('curtain_walls_01').GetName] tại [GetTitleByKey('b_constantinople').GetNameNoTier] sẽ cải thiện hiệu ứng này#!"

  defensive_fire_dromons_modifier: "Dromon Lửa Phòng Thủ"
  defensive_fire_dromons_modifier_desc: "Một hạm đội tàu được trang bị các ống phun Lửa Hy Lạp khổng lồ được neo đậu và duy trì tại cảng này."
  defensive_fire_dromons_modifier_custom_desc: "@alert_icon! #alert_trial Các [armies|E] [embarked|E] của kẻ địch gần [GetTitleByKey('c_byzantion').GetNameNoTier] có thể bị gây sát thương.#!"

  ep3_decisions_event.3100.t: "Naptha, Vôi Sống... và Sự Táo Bạo"
  ep3_decisions_event.3100.desc: "Với tư cách là [ROOT.Char.GetTitleAsName], ta phải là chủ nhân không thể tranh cãi của vùng hải phận quê hương mình. Đây là quyền được ban bởi [ROOT.Char.GetFaith.HighGodName], và được bảo vệ qua bao cuộc vây hãm và tấn công nhờ việc chúng ta thuần hóa ngọn lửa đến từ [ROOT.Char.GetFaith.PositiveAfterLife], sự làm chủ của ta đối với hỏa lỏng.\n\nNếu Constantinople muốn được bảo vệ, bến cảng của chúng ta phải chứa đựng nhiều hơn những con tàu buôn bất lực!\n\nNhững chiếc [Glossary( 'dromons', 'DROMONS_GLOSS' )] nhanh nhẹn của ta đâu rồi? Những thợ thủ công tài hoa như [Glossary( 'Kallinikos of Heliopolis', 'KALLINIKOS_GLOSS' )] ở đâu, những người sẽ rèn nên các ống phun lửa khổng lồ để phóng tia lửa qua mũi tàu của ta?"
  DROMONS_GLOSS: "Các chiến thuyền Byzantine, chạy bằng mái chèo và buồm, đặc biệt phù hợp cho chiến tranh trên Địa Trung Hải."
  KALLINIKOS_GLOSS: "Kiến trúc sư thế kỷ 7 #bold Kallinikos#! được cho là người đã phát minh ra hình thức hoàn chỉnh của Lửa Hy Lạp."
  ep3_decisions_event.3100.a: "Ta sẽ huy động Constantinople vào công việc."
  ep3_decisions_event.3100.b: "Người Latinh sẽ vui vẻ đóng tàu cho chúng ta."
  ep3_decisions_event.3100.c: "Xây một hạm đội có thể tự thiêu rụi chính nó ư? Không."

 #Retake Eastern Provinces
  retake_eastern_provinces_decision: "Tái Lập Biên Giới Theodosius"
  retake_eastern_provinces_decision_desc: "Khi Hoàng đế [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] chia Đế quốc La Mã thành hai phần hành chính, phần phía Đông được trao cho người con trai cả của ông, [GetScriptedCharacterByHistoryID( '70519' ).GetFirstName]. Chúng ta là những người kế vị trực tiếp của ông. Tuy nhiên, biên giới của [Glossary( 'Pars', 'PARS_ORIENTIS_GLOSS' )] đã thu hẹp rất nhiều kể từ thời đó; việc một Basileus tái lập các ranh giới mà [GetScriptedCharacterByHistoryID( '70534' ).GetFirstNameNoTooltip] từng để lại sẽ là vinh quang lớn lao."
  retake_eastern_provinces_decision_tooltip: "Tái lập các biên giới nguyên thủy của Đông La Mã"
  retake_eastern_provinces_decision_confirm: "Chính thức hóa biên giới mới"
  eastern_kingdoms_held_or_vassals_tt: "Nếu các [kingdom|E] sau được thành lập, Ngài phải sở hữu chúng, hoặc người nắm giữ phải là [vassals|E] của Ngài:\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_bulgaria').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_epirus').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_hellas').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_thessalonika').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_krete').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_cyprus').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_nikaea').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_anatolia').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_pontus').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_syria').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_jerusalem').GetName]\n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_egypt').GetName]"
  every_county_in_theodosian_region: "[GetTitleByKey('e_byzantium').GetName] trở thành lãnh chúa [de_jure|E] của mọi [kingdom|E] trong [GetGeographicalRegion('custom_theodosian_ere').GetName]"
  ep3_decisions_event.4000.t: "Biên Giới Của Theodosius"
  ep3_decisions_event.4000.desc: "Trong nhiều thế kỷ, La Mã Thứ Hai — Byzantium huy hoàng của chúng ta — đã không ngừng thụt lùi, đánh mất tỉnh này đến tỉnh khác, nhưng không còn nữa!\n\nHôm nay là ngày để ăn mừng, bởi [Glossary( 'Pars Orientis', 'PARS_ORIENTIS_GLOSS' )] đã được khôi phục về vinh quang và quy mô trước đây. Giống như khi [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] Vĩ Đại trao nó cho người con trưởng, quyền lực của Constantinople nay trải dài từ Moesia đến Ai Cập, và từ Cyrenaica đến Syria.\n\nMột đế quốc thống nhất cho [ROOT.Char.GetTitleAsNameNoTooltip] chiến thắng!"
  ep3_decisions_event.4000.a: "Một ngày huy hoàng cho người La Mã khắp nơi!"
  PARS_ORIENTIS_GLOSS: "#bold Pars Orientis#! — \"Phần Phía Đông\" — là tên Latinh nguyên thủy của Đế quốc Đông La Mã. Cái tên này chỉ hàm ý sự phân chia hành chính, không phải một sự chia cắt chính trị hay pháp lý."
 #Pandidakterion
  refound_pandidakterion_decision: "Tái Lập Pandidakterion"
  refound_pandidakterion_decision_desc: "Hoàng đế [GetScriptedCharacterByHistoryID( '70533' ).GetFirstName] đã sáng lập [Glossary( 'Pandidakterion', 'PANDIDAKTERION_GLOSS' )] vào năm 425, một trong những trung tâm học thuật lớn nhất thế giới. Nhiều thế kỷ đã trôi qua, và thời thế đã đổi thay. Nếu muốn Pandidakterion tiếp tục đứng ở tuyến đầu của tri thức nhân loại, thể chế này cần được cải tổ và tổ chức lại."
  refound_pandidakterion_decision_tooltip: "Mở rộng và tái tổ chức Đại học Constantinople cổ đại"
  refound_pandidakterion_decision_confirm: "Bắt đầu"
  chancellor_domestic_affairs_opinion_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_opinion_pandidakterion_bonus')|2]#!"
  task_organize_levies_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P +[SCOPE.ScriptValue('marshal_organize_levies_pandidakterion_bonus')|1]%#!"
  task_organize_levies_maintenance_pandidakterion_bonus_desc: "\n$TAB$$pandidakterion_university_modifier$: #P -[SCOPE.ScriptValue('task_organize_levies_maintenance_pandidakterion_bonus')|1]%#!"
  PANDIDAKTERION_GLOSS: "#bold Pandidakterion#!, nghĩa là \"nơi hội tụ mọi ngành học\", được thành lập năm 425 bởi Theodosius II với 31 ghế giảng dạy, một nửa bằng tiếng Latinh và một nửa bằng tiếng Hy Lạp. Nó được tái lập bởi Constantinus IX năm 1046 và tồn tại cho đến khi Ottoman chinh phục năm 1453."
  pandidakterion_tt: "Ngài sở hữu [GetTitleByKey('c_byzantion').GetName]"
 #Crusades
  ask_western_help_decision: "Cầu Viện Phương Tây"
  ask_western_help_decision_desc: "Byzantium từ lâu đã là tiền đồn phía đông của Kitô giáo, nhưng cuộc chiến hiện tại chống lại kẻ thù của Đức Tin Chân Chính đang làm cạn kiệt sức lực và tài nguyên của chúng ta. Dù quan hệ với các nhánh Kitô giáo khác không hề dễ dàng, có lẽ đã đến lúc ta phải nuốt tự ái và cầu xin sự trợ giúp từ những người anh em trong đức tin."
  ask_western_help_decision_tooltip: "Liên hệ với các anh em Kitô hữu khác giáo phái để cầu xin sự trợ giúp"
  ask_western_help_decision_confirm: "Gửi thư"
  ep3_decisions_event.4010.t: "[caller.Custom2('AppropriateGreeting', called )]"
  ep3_decisions_event.4010.desc: "[called.Custom('SisterBrother')|U] trong Đức Kitô, vị thế của chúng Ta với tư cách là tiền đồn phía Đông của Kitô giáo đang bị đe dọa khi cuộc chiến hiện tại chống lại kẻ vô đạo đang làm cạn kiệt nguồn lực của chúng Ta.\n\nXin hãy giúp chúng Ta đẩy lùi kẻ thù chung."
  ep3_decisions_event.4010.a: "Chúng Ta sẽ giúp — với điều kiện thích hợp!"
  ep3_decisions_event.4010.b: "Chúng Ta phải chuyển việc này cho thẩm quyền của [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetNameNoTooltip]."
  ep3_decisions_event.4010.b.tt_2: "Chỉ [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] mới có thể quyết định Kitô giáo sẽ hỗ trợ những người anh em lạc lối như thế nào."
  ep3_decisions_event.4010.b.tt: "[ROOT.Char.GetTitledFirstNameNoTooltip] hỏi người đứng đầu tôn giáo của [ROOT.Char.GetHerHis]"
  ep3_decisions_event.4010.c: "Xin lỗi, chúng Ta không thể giúp."
  ep3_decisions_event.4010.c.tt: "[called.GetTitledFirstNameNoTooltip|U] từ chối trợ giúp"
  ep3_decisions_event.4011.b: "Nếu ngươi cam kết ủng hộ, Quân đội của Đức Kitô sẽ tiến quân cùng ngươi!"
  ep3_decisions_event.4011.c: "Chúng Ta không thể giúp những tín hữu lạc lối."
  ep3_decisions_event.4012.t: "[sponsor.Custom2('AppropriateGreeting', called )]"
  ep3_decisions_event.4012.desc: "Ta đã nhận được lời cầu viện từ [caller.GetTitledFirstName]. Dù lạc lối trong niềm tin, dân chúng của [caller.GetHerHis] vẫn là anh chị em của chúng ta trong Đức Kitô, và từ lâu đã đóng vai trò là tiền đồn phía Đông của Kitô giáo.\n\nLiệu có cách nào để chúng ta dang tay trợ giúp họ không?"
  ep3_decisions_event.4012.a: "Chúng ta sẽ giúp, nhưng không miễn phí."
  ep3_decisions_event.4012.a.tt: "[pope.GetTitledFirstNameNoTooltip] sẽ gửi viện trợ"
  ep3_decisions_event.4012.b: "Nếu họ cam kết ủng hộ, Quân đội của Đức Kitô sẽ tiến quân cùng họ!"
  ep3_decisions_event.4012.b.tt: "[pope.GetTitledFirstNameNoTooltip] có thể kêu gọi một [pope.GetFaith.GHWName]!"
  ep3_decisions_event.4013.t: "[called.Custom2('AppropriateGreeting', caller )]"
  ep3_decisions_event.4013.desc: "Ta đã nghe lời cầu xin của các anh chị em trong Chúa và mong muốn giúp đỡ. Nếu ngài cam kết hỗ trợ, quân đội của Cơ đốc giáo sẽ đoàn kết để bảo vệ ngài trong một [pope.GetFaith.GHWName] thánh!"
  ep3_decisions_event.4013.a: "Ta chấp nhận đề nghị của các ngươi."
  ep3_decisions_event.4013.a.tt: "Ngài cam kết gửi @gold_icon![caller.MakeScope.ScriptValue('massive_gold_value')|V0] vào quỹ chiến tranh [pope.GetFaith.GHWName]."
  ep3_decisions_event.4013.b: "Đây không phải điều ta yêu cầu!"
  ep3_decisions_event.4013.b.tt: "[caller.GetTitledFirstNameNoTooltip|U] rút lui"
  ep3_decisions_event.4014.desc: "Với tấm lòng biết ơn, chúng Ta chấp nhận sự trợ giúp của các ngài và mong chờ sự xuất hiện của các đạo quân viện trợ.\n\nXin hãy nhanh chóng."
  ep3_decisions_event.4014.a: "#EMP Deus Vult!#!"
  ep3_decisions_event.4014.a.tt: "[pope.GetTitledFirstNameNoTooltip] đã kêu gọi một [pope.GetFaith.GHWName]!"
  ep3_decisions_event.4015.desc: "Chúng Ta đã nghe lời cầu viện của các anh chị em trong Đức Kitô, và trái tim chúng Ta đau xót trước những đau khổ của các ngài. Tuy nhiên, sự trợ giúp không hề miễn phí.\n\nNếu các ngài có thể hỗ trợ chúng Ta bằng một khoản bồi thường tài chính, chúng Ta sẽ cam kết gửi quân đến trợ giúp."
  ep3_decisions_event.4015.a: "Được thôi."
  ep3_decisions_event.4015.b: "Ta không yêu cầu sự ràng buộc này."
  ep3_decisions_event.4015.a.tt: "[caller.GetTitledFirstNameNoTooltip|U] chấp nhận đề nghị của Ngài"
  called_for_help_fervor: "Anh Em Kitô Giáo Gặp Nạn"
  ep3_religious_volunteers_army: "Tình Nguyện Quân Tôn Giáo"
  valid_primary_war_enemy_for_crusade: "Kẻ địch [war_leader|E] không phải Kitô hữu và hoặc nắm giữ một [kingdom|E], hoặc là một phần của một [kingdom|E]"
  ask_western_help_decision_effect_desc: "Ngài sẽ gửi lời cầu viện quân sự tới một lãnh đạo Kitô giáo khác giáo phái. Họ có thể yêu cầu vàng để đổi lấy binh lính, hoặc từ chối. Nếu một [head_of_faith|E] can thiệp, vấn đề có thể leo thang thành một Đại Thánh Chiến!\n\nQuyết định này có thời gian hồi chiêu 20 năm."
  valid_realm_size_for_help: "[realm_size|E] của Bạn Nhỏ hơn #N 84#! hạt"
  recently_asked_for_help: "Ngài đã thực hiện quyết định này trong vòng 20 năm qua!"
  there_is_someone_to_ask_for_help: "Vẫn còn người mà Ngài có thể cầu viện"
 #Proselytize
  evangelize_the_slavs_decision: "Truyền Giáo Cho Dân Ngoại Đạo"
  evangelize_the_slavs_decision_desc: "Với tư cách là người gìn giữ Đức Tin Chân Chính duy nhất, việc truyền giáo cho những kẻ ngoại đạo và đón nhận họ vào vòng tay của Giáo hội như những anh chị em trẻ tuổi trong Đức Kitô là bổn phận của [GetTitleByKey('e_byzantium').GetNamePossessive]. Điều này lại càng quan trọng khi họ sinh sống ngay sát biên giới và đe dọa đến sự toàn vẹn cũng như an ninh của đế quốc."
  evangelize_the_slavs_decision_tooltip: "Cử một nhà truyền giáo đi cải đạo các láng giềng  ngoại đạo"
  evangelize_the_slavs_decision_confirm: "Cử Nhà Truyền Giáo"
  evangelize_the_slavs_decision_effect: "Ngài sẽ cử một nhà truyền giáo đi cố gắng cải đạo một vị quân chủ láng giềng  theo tín ngưỡng ngoại đạo.\n$EFFECT_LIST_BULLET$Nếu nhà truyền giáo thành công, họ sẽ cải sang [faith|E] của Ngài và trở thành [allies|E] của Ngài. Ngài sẽ nhận được một [legend_seed|E].\n$EFFECT_LIST_BULLET$Việc tham gia nỗ lực truyền giáo được xem là vô cùng danh giá, nên Ngài sẽ nhận được [influence|E] và [prestige|E] ngay cả khi nhà truyền giáo thất bại."
  ep3_decisions_event.4020.t: "Truyền Giáo Cho Dân [pagan.GetCulture.GetCollectiveNounNoTooltip]"
  ep3_decisions_event.4020.desc: "Nước Trời thuộc về những kẻ có đức tin, nhưng người láng giềng  của chúng ta, [pagan.GetTitledFirstName], lại hoàn toàn không hay biết điều đó, và vẫn tiếp tục tin vào những mê tín cùng các vị thần giả dối của [pagan.GetHerHis].\n\nCứu rỗi linh hồn của [pagan.GetHerHis] cùng thần dân của [pagan.GetHerHis] tự thân đã là một sự nghiệp cao cả, nhưng cũng tồn tại những lợi ích #EMP trần thế#! từ việc họ cải đạo — trước hết là giảm bớt sự thù địch với chúng ta và đưa họ vào phạm vi ảnh hưởng của ta.\n\nNhà truyền giáo được ta lựa chọn, [evangelizer.GetFirstName], đã sẵn sàng lên đường."
  ep3_decisions_event.4020.a: "Nguyện [ROOT.Char.GetFaith.HighGodName] dẫn lối cho ngươi!"
  ep3_decisions_event.4020.a.tt: "[evangelizer.GetFirstNameNoTooltip] lên đường đến kinh đô của [pagan.GetTitledFirstNamePossessiveNoTooltip]."
  ep3_decisions_event.4022.desc: "Các sứ giả từ những người hàng xóm của ta đến và đi thường xuyên đến nỗi tất cả họ đều lẫn lộn trong tâm trí ta. Tuy nhiên, sứ giả hôm nay từ [GetTitleByKey('e_byzantium').GetName] nổi bật hơn tất cả những người trước đó.\n\n[evangelizer.GetSheHe|U] có vẻ là một loại [evangelizer.GetWomanMan] thánh thiện, và thay vì đưa ra các yêu cầu chính trị, [evangelizer.GetFirstName] này rao giảng về một vị Chúa toàn năng, được tôn vinh trong những ngôi đền bằng vàng và bạc luôn thơm mùi hương trầm."
  ep3_decisions_event.4022.a: "Xin hãy nói thêm."
  ep3_decisions_event.4022.a.tt: "Ngài lập một [alliance|E] với lãnh chúa của [evangelizer.GetTitledFirstNamePossessiveNoTooltip], là [sender.GetTitledFirstName]"
  ep3_decisions_event.4022.b: "Chúng ta không cần thêm thần thánh mới."
  ep3_decisions_event.4022.c: "Thật là dị giáo nực cười!"
  ep3_decisions_event.4022.c.tt: "Điều này chắc chắn sẽ gửi đi một thông điệp: các giáo sĩ của các ngươi không được chào đón ở đây! Nhưng chúng ta nên sẵn sàng cho sự trả đũa..."
  ep3_decisions_event.4025.desc_new: "Người tiền nhiệm của ta, [sender.GetFirstName], đã đầu tư vào việc truyền giáo cho dân [pagan.GetCulture.GetCollectiveNounNoTooltip] nhưng thật không may cho [sender.GetHerHim], chính ta mới là người gặt hái thành quả từ nỗ lực của [sender.GetHerHis]. Nhà truyền giáo của [sender.GetHerHis|U], [evangelizer.GetFirstName], thực tế vừa mới trở về."
  ep3_decisions_event.4025.desc_old: "Vài tháng trước, ta đã cử người cận tín [evangelizer.GetFirstName] của mình đi truyền bá tri thức về Thiên Chúa cho dân [pagan.GetCulture.GetCollectiveNounNoTooltip]. Hôm nay, ta vui mừng chào đón [sender.GetHerHim] trở về, khi đã từ lâu nóng lòng chờ đợi bản báo cáo của [evangelizer.GetHerHis]."
  ep3_decisions_event.4025.desc_success: "\n\n\"Ta mang đến tin mừng lớn lao, thưa bệ hạ! [pagan.GetTitledFirstName|U] đã háo hức đón nhận Phúc Âm và cải sang [evangelizer.GetFaith.GetName], cùng với nhiều người trong dân chúng của [pagan.GetHerHis].\""
  ep3_decisions_event.4025.desc_failure: "\n\n\"Ta mang đến tin buồn, thưa bệ hạ. Thật không may, [pagan.GetTitledFirstName] hoàn toàn không tiếp nhận Lời Chúa, và đã đuổi ta đi tay trắng.\""
  ep3_decisions_event.4025.a: "Tuyệt vời!"
  ep3_decisions_event.4025.b: "Chỉ là một trở ngại tạm thời."
  ep3_decisions_event.4026.desc: "Tin dữ khủng khiếp!\n\nTin tức truyền về từ vùng đất của dân [pagan.GetCulture.GetCollectiveNounNoTooltip], và dường như nhà truyền giáo của ta, [evangelizer.GetFirstName], đã bị tên man rợ [pagan.GetTitledFirstName] sát hại — kẻ không chỉ bác bỏ mọi nỗ lực cải đạo mà còn đi đến hành vi xúc phạm tột cùng khi sát hại một [evangelizer.GetWomanMan] của Thiên Chúa!"
  ep3_decisions_event.4026.a: "Thật không thể dung thứ!"
  valid_neighboring_and_across_water_top_liege: "Bất kỳ lãnh chúa tối cao láng giềng  nào: $valid_for_conversion_tt$"
  valid_neighboring_and_across_water_realm_same_rank: "Bất kỳ quân chủ láng giềng  cùng cấp bậc: $valid_for_conversion_tt$"
  valid_for_conversion_tt: "\n$EFFECT_LIST_BULLET$Theo [faith|E] [GetReligionFamily('rf_pagan').GetName] với giáo lý [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName]\n$EFFECT_LIST_BULLET$Không đang ở trong tình trạng [war|E]\n$EFFECT_LIST_BULLET$Chưa từng bạo lực từ chối một nỗ lực cải đạo trước đó"
  negotiated_alliance_delay_tt: "Liên minh sẽ có hiệu lực ngay khi [evangelizer.GetNameNoTooltip] trở về với lãnh chúa của [evangelizer.GetHerHis]."
  ep3_decisions_event.4025.a.tt: "Ngài lập một [alliance|E] với [pagan.GetTitledFirstName] vừa mới cải đạo."
  ep3_decisions_event.4023.t: ""
  ep3_decisions_event.4023.desc: ""
  ep3_decisions_event.4023.a: ""
 #Recreate the ERE
  recreate_byzantine_empire_decision: "Khôi Phục Đế Quốc Byzantine"
  recreate_byzantine_empire_decision_desc: "Sự tan rã của [GetTitleByKey('e_byzantium').GetName] là một thảm kịch chưa từng có đối với dân tộc chúng ta, nhưng chúng ta vẫn kiên cường tồn tại. Sau cùng, chừng nào vẫn còn một [Glossary( 'Romaios', 'ROMAIOS_GLOSS' )] đứng vững, thì La Mã vẫn còn tồn tại.\n\nMột ngày nào đó, một vị quân chủ chính danh sẽ lại ngự trên ngai vàng Constantinople, và Đế quốc sẽ trỗi dậy lần nữa."
  recreate_byzantine_empire_decision_tooltip: "Tạo lập [GetTitleByKey('e_byzantium').GetName] và khôi phục các truyền thống cổ xưa"
  recreate_byzantine_empire_decision_confirm: "La Mã trỗi dậy!"
  ep3_decisions_event.4030.t: "Một Đế Quốc Tái Sinh"
  ep3_decisions_event.4030.desc: "Bằng máu của những tín đồ đã ngã xuống, bằng ngọn lửa của hùng biện, bằng chính ý chí của [ROOT.Char.GetFaith.HighGodName] — #EMP [GetTitleByKey('e_byzantium').GetName|U] đã sống lại!#!\n\nTa phóng tầm mắt bao quát Nữ Hoàng của Các Thành Phố, làn gió ấm từ Marmara khẽ lay động long bào của ta. Những khúc thánh ca mỹ lệ vang vọng từ đại giáo đường Thánh Trí Tuệ. Dân chúng nhảy múa trên đường phố, cất cao tiếng reo hò trong niềm tri ân và hân hoan.\n\nNhững ngày nhục nhã, khi cả thế giới khinh miệt các [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] sa ngã, hẳn đã đến hồi kết. Một [ROOT.Char.GetTitleAsNameNoTooltip] chính danh một lần nữa ngự trên ngai vàng của [GetScriptedCharacterByHistoryID( '70523' ).GetFirstName].\n\n#EMP Chính là ta.#!"
  ep3_decisions_event.4030.a: "Vinh quang của La Mã sẽ còn tiếp tục lớn mạnh!"
  ROMAIOS_GLOSS: "#bold Romaioi#! (số ít #bold Romaios#!) là cách phiên âm tiếng Hy Lạp của tên Latinh #bold Romani#!, cách người La Mã tự gọi mình. Suốt thời Trung Cổ, người Byzantine tự xem mình là người La Mã và gọi đế quốc của họ là #EMP Basileia ton Romaion#!, tức Đế quốc của Người La Mã."
 #Varangian Guard
  found_varangian_guard_decision: "Thành Lập Đội Cận Vệ Varangian"
  found_varangian_guard_decision_desc: "Trong nhiều năm qua, các chiến binh từ những vùng đất xa xôi nhất phương Bắc đã đổ về Constantinople, bị hấp dẫn bởi sự giàu có của chúng ta. Họ dâng hiến dịch vụ với tư cách lính đánh thuê — một nghệ thuật mà họ đặc biệt tinh thông — và không trung thành với bất kỳ ai ngoài đồng tiền và lòng kiêu hãnh của chính mình. Nếu chúng ta có thể tổ chức họ quanh Hoàng đế, ta sẽ có được một lực lượng quân sự bất khả chiến bại hoàn toàn phục vụ cá nhân!"
  found_varangian_guard_decision_tooltip: "$found_varangian_guard_decision$"
  found_varangian_guard_decision_confirm: "Bắt Đầu Tuyển Mộ"
  unlocked_varangian_guard_desc: "Mở khóa [court_position|E] $akolouthos_court_position$ và đơn vị [men_at_arms|E] [GetMaA('varangian_guards').GetName] cho [GetTitleByKey('e_byzantium').GetName]."
  unlocked_varangian_guard_desc_tt: "Đội Cận Vệ Varangian Được Thành Lập"
 #Grain Dole
  reinstitute_grain_dole_decision: "Khôi Phục Phát Lương Thực"
  reinstitute_grain_dole_decision_desc: "Trong nhiều thế kỷ, cư dân La Mã — và sau này là Constantinople — được hưởng đặc ân cao quý nhất khi sống tại Kinh Đô của Thế Giới: những đợt phân phát bánh mì miễn phí hoặc với giá được kiểm soát đều đặn. Truyền thống này đã mai một cùng với kho lương của La Mã — Ai Cập — nhưng bất kỳ Hoàng đế nào khôi phục nó đều sẽ ngay lập tức gia tăng mức độ yêu mến của quần chúng."
  reinstitute_grain_dole_decision_tooltip: "Triển khai việc phát bánh mì cho dân chúng thủ đô"
  reinstitute_grain_dole_decision_confirm: "Mở Kho Lương!"
  constantinople_is_capital: "[GetTitleByKey('c_byzantion').GetName|U] là [capital|E] của Ngài"
  enough_granaries_in_egypt: "Ít nhất 3 quận trong khu vực [GetGeographicalRegion('custom_roman_aegyptus').GetName] đã xây dựng [GetBuilding('cereal_fields_05').GetName] hoặc cao hơn"
  MODIFIER_DEFINITION_VALUE_PER_EGYPT_GRANARY: " \t#weak Tăng theo mỗi [GetBuilding('cereal_fields_05').GetName] được xây tại [GetGeographicalRegion('custom_roman_aegyptus').GetName]#!"
  MODIFIER_DEFINITION_MAIN_DESC_PER_EGYPT_GRANARY: "Hiệu ứng này tăng theo mỗi [GetBuilding('cereal_fields_05').GetName] được xây tại [GetGeographicalRegion('custom_roman_aegyptus').GetName] ($MULTIPLIER|+=0$), tối đa #V 10#!"
  grain_dole_already_active: "Chế độ Phát Lương Thực đã được áp dụng!"
  unlocked_grain_dole: "Việc gia hạn Phát Lương Thực rẻ hơn"
  ep3_decisions_event.4040.t: "Phát Lương Thực"
  ep3_decisions_event.4040.desc: "Dân chúng có mọi lý do để ăn mừng khi truyền thống cổ xưa và được yêu mến — Phát Lương Thực — trở lại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!\n\nMột lần nữa, nhờ nỗ lực của #EMP ta#!, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — Kinh Đô của Thế Giới — lại nhận được nguồn ngũ cốc giá rẻ dồi dào từ Ai Cập, giống như nhiều thế kỷ trước.\n\nVà như thi nhân cổ đại đã nói rất chí lý, tất cả những gì cần để giữ cho dân đen mãn nguyện chỉ là bánh mì và trò tiêu khiển!"
  ep3_decisions_event.4040.a: "Hãy để họ ăn bánh mì!"
  reconfirm_grain_dole_decision: "Tái Xác Nhận Phát Lương Thực"
  reconfirm_grain_dole_decision_desc: "Sau khi chính thức được khôi phục, cư dân của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] đã quen với những xa xỉ mà Phát Lương Thực mang lại — các đợt phân phát bánh mì miễn phí hoặc giá rẻ định kỳ. Đây là một công cụ đầy quyền lực trong tay bất kỳ Hoàng đế nào để đảm bảo năng suất của dân chúng và sự yêu mến dành cho chính mình."
  reconfirm_grain_dole_decision_tooltip: "Tái xác nhận việc phát bánh mì cho dân chúng thủ đô"
  reconfirm_grain_dole_decision_confirm: "$reinstitute_grain_dole_decision_confirm$"
  reconfirm_grain_dole_decision_tt: "Phát Lương Thực Được Tái Xác Nhận"
 
 # Consolidate Rule
  consolidate_rule_decision: "Củng Cố Quyền Lực"
  consolidate_rule_decision_desc: "Yêu cầu [head_of_faith|E] của Ngài tái khẳng định quyền kế vị ngai vàng. Suy cho cùng, Ngài là người bảo trợ lớn nhất của họ."
  consolidate_rule_decision_tooltip: "Thỉnh cầu [head_of_faith|E] gia tăng [legitimacy|E] cho Ngài"
  ep3_consolidated_rule_modifier: "Quyền Lực Được Củng Cố"
  consolidate_rule_decision_effect_tt: "Nhận [GetModifier( 'ep3_consolidated_rule_modifier' ).GetNameWithTooltip] trong #V 15#! năm hoặc #positive_value [legitimacy_i][EmptyScope.ScriptValue('major_legitimacy_gain')|0]#!"
  consolidate_rule_decision_confirm: "Triệu Tập Dân Chúng!"
  ep3_decisions_event.4050.t: "Quyền Lực: Được Củng Cố"
  ep3_decisions_event.4050.desc.intro: "Sự tĩnh lặng của [ROOT.Char.GetFaith.HouseOfWorship] bị phá vỡ bởi đám đông quan lại, tổng trấn và nông dân, tất cả đều tụ họp nơi đây để tôn vinh... #EMP ta!#!\n\n"
  ep3_decisions_event.4050.desc.hate: "[head_of_faith.GetTitledFirstName] nhìn ta với vẻ vô cùng bất mãn — thứ duy nhất ngăn những lời sỉ nhục gầm thét tuôn ra khỏi miệng [head_of_faith.GetHerHis] chỉ là phép lịch sự tối thiểu."
  ep3_decisions_event.4050.desc.other: "[head_of_faith.GetTitledFirstName] ra hiệu về phía ta, nụ cười chào đón hiện trên gương mặt [head_of_faith.GetHerHis], và ta tiến lại gần [head_of_faith.GetHerHim]. \"[ROOT.Char.GetTitleAsNameNoTooltip] đáng kính của ta,\" [head_of_faith.GetSheHe] chào."
  ep3_decisions_event.4050.desc.outro: "\n\n\"Hôm nay chúng ta cảm tạ [ROOT.Char.GetFaith.HighGodName] vì đã ban cho chúng ta một vị hộ quốc nhân từ,\" [head_of_faith.GetSheHe] tiếp tục, hướng về đám đông, \"nguyện triều đại của [ROOT.Char.GetHerHis] lâu dài và thịnh vượng!\""
  ep3_decisions_event.4050.a: "Ta muốn nó #EMP thật lâu#!."
  ep3_decisions_event.4050.b: "Ta là người cổ vũ nhiệt thành cho thịnh vượng."
  ep3_decisions_event.4050.c: "Hãy nhớ rõ #EMP ngươi#! phụng sự ai."

  change_state_faith: "Thay Đổi Quốc Giáo"
