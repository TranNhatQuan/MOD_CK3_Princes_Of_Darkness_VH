  legitimize_latin_dominion_decision: "Hợp Thức Hóa Quyền Thống Trị Latin"
  legitimize_latin_dominion_decision_desc: "Dù thần dân trong lãnh thổ ta vẫn nhớ đến Hoàng đế của người Hy Lạp, họ sẽ phải chấp nhận thực tại. Chính người Latin chúng ta đã đến, và chúng ta sẽ cai trị nơi này vĩnh viễn."
