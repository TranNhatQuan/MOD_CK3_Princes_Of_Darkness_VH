  ep3_decisions_event.3200.t: "Bắt Giữ Hàng Loạt"
  ep3_decisions_event.3200.desc: "Như bầy sói vờn con mồi, những gia tộc quyền thế trong vương quốc đang rình rập ta. Ta có thể cảm nhận được sợi dây thòng lọng đang dần siết chặt.\n\nGiam giữ một gia tộc sẽ nhắc nhở những kẻ còn lại về quyền uy của ta. Cần phải có một tấm gương..."
