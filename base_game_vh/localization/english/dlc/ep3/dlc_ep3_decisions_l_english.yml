  ep3_decisions_event.3201.t: "Bắt Giữ Hàng Loạt: Lời Cầu Xin"
  ep3_decisions_event.3201.desc: "[imprisoned_house_head.GetName] được đưa đến trước mặt ta trong xiềng xích. Người đứng đầu đầy ảnh hưởng của Gia tộc [imprisoned_house_head.GetHouse.GetName] quỳ xuống trước mặt ta, biểu cảm của [imprisoned_house_head.GetHerHis] phản ánh sự pha trộn giữa thách thức và tuyệt vọng.\n\n"Thưa Bệ hạ," [imprisoned_house_head.GetSheHe] bắt đầu, giọng nói run rẩy vì xấu hổ, "Tôi cầu xin ngài, hãy giải thoát tôi khỏi những xiềng xích này. Tham vọng làm mờ mắt, nhưng giờ tôi đã thấy vị trí thực sự của mình ở đâu."\n\n"Hãy ban cho tôi lòng thương xót, và tôi thề sẽ là thần dân trung thành nhất của ngài, rũ bỏ niềm tự hào trước đây của tôi.""
  ep3_decisions_event.3201.a: "Ta vốn không thiếu lòng khoan dung."
  ep3_decisions_event.3201.b: "Không."

