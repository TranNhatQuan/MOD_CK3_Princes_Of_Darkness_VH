  ep3_decisions_event.5021.desc: "" #This is an AI-only event
  ep3_decisions_event.5021.a: "" #This is an AI-only event
  ep3_decisions_event.5021.a.tt: "Quốc Giáo Đã Thay Đổi"
  ep3_decisions_event.5021.b: "" #This is an AI-only event
  ep3_decisions_event.5021.c: "" #This is an AI-only event
  ep3_decisions_event.5021.c.tt: "Quốc Giáo Không Thay Đổi"
  embrace_heresy_decision_confirm: "Chấp nhận dị giáo"
  push_heresy_as_state_faith_confirm: "Gây sức ép lên [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]"

 # Establish Silk Production
  establish_silk_production_decision: "Thiết Lập Sản Xuất Lụa"
  establish_silk_production_decision_desc.boilerplate: "Kể từ khi người cổ đại lén đưa những con tằm đầu tiên từ những vùng đất xa xôi nhất ở phương Đông về Constantinople, việc sản xuất và buôn bán lụa luôn là độc quyền của hoàng gia."
  establish_silk_production_decision_desc: "$establish_silk_production_decision_desc.boilerplate$\n\nĐây sẽ là một khoản đầu tư tốn kém, nhưng ta có thể mua một đặc ân hoàng gia để được phép thiết lập cơ sở sản xuất lụa riêng trong Điền Trang của gia tộc."
  establish_silk_production_decision_desc.emperor: "$establish_silk_production_decision_desc.boilerplate$\n\nLà người đứng đầu hoàng tộc, ta có thể tự ban cho mình và các hậu duệ đặc quyền sản xuất chỉ bằng một cái phẩy tay."
  establish_silk_production_decision_tooltip: "Mua giấy phép hoàng gia để mở khóa các công trình sản xuất lụa trong [estate|E] của Ngài"
  establish_silk_production_decision_confirm: "Gửi khoản thanh toán"
  unlocked_estate_silk_buildings: "Mở khóa [building|E] [estate|E] [GetDomicileBuilding('silk_01').GetName]"
  unlocked_estate_silk_buildings_t: "[GetDomicileBuilding('silk_01').GetName] Đã Mở Khóa"
  has_unlocked_estate_silk: "Ngài cần либо đã mở khóa [GetModifier('ep3_unlocked_silk').GetNameWithTooltip] thông qua [decision|E] [GetDecisionWithKey('establish_silk_production_decision').GetName], hoặc [culture|E] của Ngài phải có [innovation|E] #V $innovation_sericulture$#!"
  commission_silk_regalia_decision: "Đặt Làm Lễ Phục Lụa"
  commission_silk_regalia_decision_desc: "Gia tộc ta nằm trong số rất ít những nhà sản xuất và buôn bán lụa Byzantine thượng hạng được hoàng gia cho phép. Hoạt động này mang lại vàng và ảnh hưởng — cùng với một vài #EMP lợi thế#! khác — nhưng hiếm khi ta được trực tiếp hưởng thụ. Ta nghĩ đã đến lúc mình xứng đáng có một thứ gì đó #EMP thật đặc biệt#! cho bản thân!"
  commission_silk_regalia_decision_tooltip: "Đặt làm một [artifact|E] bằng lụa cho riêng Ngài"
  commission_silk_regalia_decision_confirm: "Triệu thợ thủ công"
  commission_silk_regalia_decision_effect: "Một thợ thủ công từ Điền Trang của Ngài sẽ chế tác cho Ngài một [artifact|E] Lễ Phục Lụa"
  ep3_decisions_event.5030.t: "Lễ Phục Lụa Hoàn Thành"
  ep3_decisions_event.5030.desc: "Với một cử chỉ đầy trang nhã, [local_artisan.GetFirstName], bậc thầy thủ công tại xưởng ươm tằm của gia tộc ta, dâng lên ta một bộ lễ phục lụa thượng hạng.\n\n\"Đơn đặt hàng của ngài đã hoàn tất, [ROOT.Char.Custom('FormOfAddressForLiege')]. Thần hy vọng nó đáp ứng được kỳ vọng của ngài.\"\n\nLụa chảy như nước giữa những ngón tay ta, trong khi đôi mắt ta gần như không thể thu nhận hết những chi tiết tinh xảo của hoa văn trang trí."
  ep3_decisions_event.5030.a: "Đẹp tuyệt trần!"
  silk_regalia_name: "Lễ Phục Lụa Thượng Hạng"
  silk_regalia_description: "Một bộ lễ phục lụa xứng đáng với hoàng đế, được chế tác bởi những nghệ nhân xuất sắc nhất theo phong cách Byzantine tại điền trang gia tộc của Nhà [owner.GetHouse.GetName].\n\nMàu sắc rực rỡ, cùng những sợi chỉ vàng được đan xen tinh tế, làm nổi bật các họa tiết phức tạp."

 # Foster Integration
  foster_integration_decision: "Thúc Đẩy Hội Nhập"
  foster_integration_decision_desc: "Điền trang của gia tộc ta nằm tại một khu vực khá bất ổn. Điều này không hẳn là bất lợi, bởi ta có thể giúp chủ quân đưa dân địa phương nằm vững chắc hơn dưới quyền thống trị của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip], đồng thời củng cố vị thế chính trị và tài chính của bản thân."
  foster_integration_decision_tooltip: "Thúc đẩy hội nhập de jure và văn hóa cho [county|E] nơi [estate|E] của Ngài tọa lạc"
  foster_integration_decision_confirm: "Bắt đầu thôi"
  improve_promote_culture_tt: "Chủ quân của Ngài sẽ nhận được thưởng khi thực hiện [councillor_task|E] [promote_culture|E] tại quận này."
  improve_de_jure_integration_tt: "Chủ quân của Ngài sẽ nhận được thưởng khi thực hiện [councillor_task|E] [integrate_title|E] tại quận này."
  improve_promote_culture_modifier_tt: "[ROOT.Char.GetTitledFirstName] đã bắt đầu thúc đẩy Hội Nhập Văn Hóa tại [target_county.GetName].\nThưởng cho [councillor_task|E] [promote_culture|E] nhắm vào quận này."
  improve_de_jure_integration_modifier_tt: "[ROOT.Char.GetTitledFirstName] đã bắt đầu thúc đẩy Hội Nhập De Jure của [target_county.GetName].\nThưởng cho [councillor_task|E] [integrate_title|E] nhắm vào quận này."

 # Gather Faction Support
  gather_faction_support_decision: "Tập Hợp Hậu Thuẫn Phe Phái"
  gather_faction_support_decision_desc: "Điền trang của gia tộc ta là trung tâm của trật tự và quyền lực, từ đó ảnh hưởng của Nhà [ROOT.Char.GetHouse.GetName] lan tỏa ra mọi hướng. Ta có thể tận dụng vị thế thuận lợi này để tập hợp những người ủng hộ địa phương cho phe phái của mình."
