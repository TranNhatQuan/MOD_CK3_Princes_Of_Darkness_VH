  restore_rome_devastated_county_opinion_modifier: "Cai Trị Sai Lầm"
  restore_rome_lowered_county_opinion_modifier: "Chính Quyền Gây Bực Bội"
  restore_rome_recuperated_county_opinion_modifier: "Được Hoàng Đế Ghi Nhận"
