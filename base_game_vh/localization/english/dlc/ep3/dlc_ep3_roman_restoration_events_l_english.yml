l_english:
 
  ep3_roman_restoration.0001.t: "Giấc Mộng của Justinian"
  ep3_roman_restoration.0001.desc: "Làn không khí ấm áp của Địa Trung Hải mang theo những lời thì thầm về một đế quốc đang đứng trước ngưỡng cửa vĩnh hằng.\n\nTại đây, trong những bức tường thấm đẫm lịch sử của [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], tham vọng của một thời đại đã lùi xa vọng về. Giấc mộng bất diệt của Justinian — khát vọng không ngừng nghỉ nhằm tái thống nhất những mảnh vỡ rải rác của La Mã — đang vẫy gọi ta.\n\nLiệu đó là gánh nặng, hay là đặc ân của ta, khi hồi sinh những giấc mơ ấy? Khi vá liền những lãnh thổ tan vỡ dưới một ngọn cờ duy nhất, như ông từng theo đuổi?"
  ep3_roman_restoration.0001.a: "#EMP Ecce Romani!#!"
  ep3_roman_restoration.0001.a.tt: [decision|E] [GetDecisionWithKey('restore_roman_empire_decision').GetName] nay đã khả dụng

  ep3_roman_restoration.0100.t: "Giấc Mộng của Justinian Thành Hiện Thực"
  ep3_roman_restoration.0100.desc: "Đây là một ngày cát tường, bởi hôm nay Đế quốc La Mã đã hiện thực hóa tiềm năng cổ xưa của mình.\n\nTừ mọi ngóc ngách của đế quốc vang lên những tiếng reo hò của niềm hân hoan và kiêu hãnh: #EMP Ecce Romani! Vạn tuế Caesar!#!\n\nNhưng giờ đây, chính ta phải lèo lái con thuyền của cơ nghiệp đồ sộ này. Ta sẽ tạo dựng một La Mã như thế nào? Giữa vô số tiền nhân và những hình thái quyền lực La Mã từng tồn tại, lựa chọn dần thu hẹp.\n\nChúng ta sẽ tiếp tục con đường hiện tại, trung thành với văn hóa gần đây? Hay sẽ hoàn toàn ôm lấy truyền thống của tổ tiên?"
  ep3_roman_restoration.0100.a: "Sẽ không có nửa vời."
  ep3_roman_restoration.0100.b: "Vạn sự nên giữ chừng mực."
  ep3_roman_restoration.0100.c: "Ta có thể thích nghi mà không lạc lối."
  ep3_roman_restoration.hard_mode: "@warning_icon! #XB;EMP Ngài sẽ đối mặt với những thử thách sau:#! #indent_newline:4 #X \n$EFFECT_LIST_BULLET$Mọi [peasant_factions|E] trong [realm|E] của Ngài sẽ nhắm vào Ngài\n$EFFECT_LIST_BULLET$Gia tăng [wars|E] từ các [titles|E] cấp Vương quốc khác\n$EFFECT_LIST_BULLET$Cuộc xâm lăng của Mông Cổ sẽ được đẩy nhanh#!#!"
  ep3_roman_restoration.end_hard_mode: "@alert_icon! #alert_bold Những thử thách này sẽ kết thúc khi Ngài chinh phục toàn bộ bản đồ hoặc khi ban hành [decision|E] [GetDecisionWithKey( 'split_roman_empire_decision' ).GetName]"
  ep3_roman_restoration.invasion_cb: "Ngài được mở khóa [pax_romana_invasion_casus_belli|E]"
  ep3_roman_restoration.household_gods_tenet: "[core_tenet|E] [GetFaithDoctrine('tenet_household_gods').GetBaseName] được mở khóa cho [GetFaithByKey( 'hellenic_pagan' ).GetName]"
  ep3_roman_restoration.easy_mode: "#P;BOLD;EMP Trò chơi sẽ diễn ra bình thường#!"
  uses_custom_caesar_flavourization_tt: "Từ nay Ngài sẽ được xưng danh là #HIGH $custom_imperator_caesar_augustus$#!"
  may_choose_to_convert_hellenic_desc: "Có thể lựa chọn cải sang [GetFaithByKey( 'hellenic_pagan' ).GetName]"

  ep3_roman_restoration.0101.intro: "Một bản tuyên cáo đã được ban hành từ kinh đô hoàng gia tại [scoped_emperor.GetCapitalLocation.GetBaronyNameExplicitly], dưới bút tích của [scoped_emperor.GetName]. Những vùng đất xa xôi từng thuộc về La Mã cổ đại nay lại được thống nhất dưới tay [scoped_emperor.GetCulture.GetCollectiveNoun], với tham vọng sánh ngang các Caesar thuở trước.\n\n"
  ep3_roman_restoration.0101.hellenic: "Không hề có sự nửa vời nào. Cùng với sự phục hưng của [scoped_emperor.GetFaith.GetName], các vị thần cổ xưa một lần nữa được thờ phụng trong những đền đài nguy nga, vang vọng lời tụng ca dành cho [scoped_emperor.GetFaith.HighGodName] và [scoped_emperor.GetFaith.KnowledgeGodName]. Sự hồi sinh của các nghi lễ ngoại giáo này tạo nên một đối lập gay gắt với sự thống trị của Kitô giáo tại châu Âu, đặt ra một thách thức táo bạo đối với trật tự tôn giáo hiện hữu.\n\n"
  ep3_roman_restoration.0101.orthodox: "Được nâng đỡ bởi sự ủng hộ sâu sắc của Giáo hội [scoped_emperor.GetFaith.GetName], lễ đăng quang là một sự khẳng định trang nghiêm về thiên mệnh, được ban phước bởi [scoped_emperor.GetFaith.GetReligiousHead.GetTitledFirstName] [scoped_emperor.GetFaith.GetReligiousHead.GetHerselfHimself]. Cội rễ tinh thần của đế quốc ăn sâu bền chặt, đan xen niềm tin tôn giáo với tham vọng đế quyền.\n\n"
  ep3_roman_restoration.0101.fallback: "Dù theo đuổi một tín ngưỡng dị biệt hay trung thành với đức tin tổ tiên, [scoped_emperor.GetTitleAsNameNoTooltip] đã đánh dấu sự đăng cơ của mình bằng những nghi thức độc đáo, phản ánh khuynh hướng tôn giáo riêng biệt và mở đường cho một bản sắc văn hóa đa dạng trong đế quốc.\n\n"
  ep3_roman_restoration.0101.outro: "Một thế lực đáng gờm giờ đây phủ bóng lên thế giới, hứa hẹn một tương lai nơi sức mạnh và bản lĩnh của các láng giềng  sẽ bị thử thách chưa từng có."
  ep3_roman_restoration.0101.a: "[ROOT.Char.GetFaith.HighGodName] phù hộ cho tất cả chúng ta..."

  ep3_roman_restoration.0300.t: "Cai Trị Lệch Lạc"
  ep3_roman_restoration.0300.desc: "\"Tâu Bệ hạ, những tin tức thần mang đến vô cùng nghiêm trọng. Thần đến đây để cầu xin sự thứ lỗi cho sai lầm trong phán đoán của mình. Một số chính sách thần ban hành đã gây bất ổn và hỗn loạn tại [inefficient_governor.GetPrimaryTitle.GetName],\" [inefficient_governor.GetTitledFirstName] thưa.\n\n\"Chợ búa vắng tanh, dân chúng rỉ tai nhau về nổi loạn, còn giới quý tộc địa phương thì phẫn nộ. Sự ổn định của chủ đề cai trị này đang treo trên sợi chỉ mong manh, khi dư luận trong toàn lãnh địa của thần lao dốc thảm hại.\"\n\n\"Niềm tin của dân chúng vào sự trị vì của Bệ hạ — thông qua hành động của một [inefficient_governor.GetTitleAsNameNoTooltip] lầm đường — đang đối mặt với phép thử khắc nghiệt nhất...\""
  ep3_roman_restoration.0300.a: "Ta sẽ tự tay giải quyết."
  ep3_roman_restoration.0300.a.success: "Ngài khôi phục được một phần Dư luận Nhân dân"
  ep3_roman_restoration.0300.a.failure: "Các quận hạt mất Dư luận Nhân dân"
  ep3_roman_restoration.0300.b: "Ngươi bị cách chức."
  ep3_roman_restoration.0300.c: "Sư tử chẳng bận tâm đến ý kiến của bầy cừu."
  ep3_roman_restoration.0300.efficiency: "Việc này xảy ra là do [governor_efficiency|E] yếu kém của [inefficient_governor.GetNamePossessive] #WEAK ([inefficient_governor.MakeScope.ScriptValue('governor_efficiency_presented')|0])#!"
  ep3_roman_restoration.0300.every_sub_realm_county: "Mọi [county|E] do [inefficient_governor.GetName] nắm giữ"
  ep3_story_cycle_restoring_rome_faction_discontent: "Phục Hưng La Mã: $VALUE|=+0$"
  ep3_restoring_rome_citizen_army_name: "Quân đội Công dân"

  ep3_roman_restoration.0500.t: "Đột Kích Biên Giới"
  ep3_roman_restoration.0500.desc: "\"[ROOT.Char.GetTitleAsNameNoTooltip], hôm nay thần đến diện kiến với tốc độ khẩn cấp,\" [marshal.GetCouncilTitle] của thần, [marshal.GetFirstName], mở lời. \"Các trinh sát báo cáo rằng quân đội mang cờ hiệu của [target_kingdom.GetName] đã vượt qua biên giới của ta trong đêm tối.\n\n\"Chúng lấy [target_county.GetName] làm mục tiêu chính, cướp phá lãnh thổ và đe dọa sự an toàn của dân chúng. Rõ ràng [target_kingdom.GetTitleAsNameNoTooltip] tin rằng một thế lực mênh mông và hùng mạnh như chúng ta sẽ không để tâm đến hành động xâm phạm này.\""
  ep3_roman_restoration.0500.a: "Cứ để [target_kingdom.GetHerHim] thử thách quyết tâm của ta, rồi xem [target_kingdom.GetSheHe] sẽ nhận lại điều gì."

