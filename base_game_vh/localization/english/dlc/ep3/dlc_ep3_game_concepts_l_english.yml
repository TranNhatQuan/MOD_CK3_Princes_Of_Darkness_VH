l_english: 
  game_concept_administrative_government: "Chính Thể Hành Chính"
  game_concept_administrative_governments: "Các Chính Thể Hành Chính"
  game_concept_administrative: "Hành Chính"
  game_concept_administrative_i: "@government_type_administrative!"
  game_concept_administrative_desc: "$game_concept_administrative$ là một [government_bureaucratic_type|E] [government_form|E], bổ nhiệm các [characters|E] làm [governors|E] để quản lý và cai trị các vùng đất, được gọi là [provinces|E], nhân danh [liege|E] của họ.\n\nCác Nhân vật theo $game_concept_administrative$ có quyền tiếp cận [influence|E], và một số còn sở hữu [family_estate|E] cá nhân.\n\nChỉ các [independent|E] [rulers|E] của một [realm|E] theo $game_concept_administrative$ mới có [legitimacy|E], còn [vassals|E] thì không.\n\n$admin_cannot_declare_internal_wars$"
  game_concept_imperial_bureaucracy: "Quan Liêu Đế Chế"
  game_concept_imperial_bureaucracy_desc: "$game_concept_imperial_bureaucracy$ thể hiện mức độ tập trung hóa của một [realm|E] theo [administrative|E], cũng như quyền lực tổng thể mà [ruler|E] nắm giữ đối với các [vassals|E] của mình.\n\nChỉ [top_liege|E] mới có thể thay đổi $game_concept_imperial_bureaucracy$. Các $game_concept_vassals$ hành chính sẽ sử dụng cùng cấp độ với $game_concept_liege$ của họ.\n\nCó bốn cấp độ $game_concept_imperial_bureaucracy$:\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_3$\n\nViệc tăng $game_concept_imperial_bureaucracy$ tiêu tốn một lượng [prestige|E] phụ thuộc vào [realm_size|E] và [learning_skill|E] của người cai trị."
  game_concept_governor: "Tổng Trấn"
  game_concept_governor_possessive: "Của Tổng Trấn"
  game_concept_governors: "Các Tổng Trấn"
  game_concept_governors_possessive: "Của Các Tổng Trấn"
  game_concept_governed: "Được Cai Trị"
  game_concept_strategos: "Strategos"
  game_concept_strategos_possessive: "Của Strategos"
  game_concept_strategoi: "Strategoi"
  game_concept_strategoi_possessive: "Của Strategoi"
  game_concept_governorship: "Chức Tổng Trấn"
  game_concept_governorships: "Các Chức Tổng Trấn"
  game_concept_governor_desc: "Một $game_concept_governor$ là chư hầu chủ chốt của một [liege|E] theo [administrative_government|E]. Họ được bổ nhiệm để cai quản các vùng đất trong [realm|E], dựa trên [governor_efficiency|E] của mình.\n\n[title|E] của một $game_concept_governor$, cùng với các [counties|E] trực thuộc, được gọi là một [province|E]. Các [governance_issues|E] có thể phát sinh trong một Province, và $game_concept_governor$ phải giải quyết chúng.\n\nCác $game_concept_governors$ có thể tích lũy [influence|E] và thao túng [succession|E] của các $game_concept_governorships$ khác."
  game_concept_candidate_score: "Điểm Ứng Viên"
  game_concept_candidate_scores: "Điểm Ứng Viên"
  game_concept_candidate_score_desc: "Các [characters|E] trong [line_of_succession|E] của một [title|E] theo [administrative_government|E] sẽ có $game_concept_candidate_score$.\n\nĐiểm số này quyết định ai sẽ nhận được các danh hiệu khi [succession|E], và có thể bị thay đổi thông qua nhiều cách khác nhau, từ [scheming|E] cho tới tiêu tốn [influence|E]."
  game_concept_influence: "Ảnh Hưởng"
  game_concept_influence_desc: "$game_concept_influence$ đại diện cho tầm ảnh hưởng chính trị và quyền lực của một [character_possessive|E] trong một [realm|E] theo [administrative_government|E].\n\n$game_concept_influence$ là một công cụ thiết yếu và có thể đạt được bằng nhiều cách, ví dụ như trở thành một [governor|E], nâng cấp một [estate|E], hoặc liên minh với [house_head|E] của một [noble_family|E].\n\nCách sử dụng chính của $game_concept_influence$ là để giành được một [governorship|E], nhưng nó cũng là nguồn lực quý giá để thao túng các Nhân vật khác làm theo ý Ngài.\n\nMỗi khi một Nhân vật nhận được $game_concept_influence$, họ cũng tiến gần hơn tới [influence_level|E] tiếp theo."
  game_concept_influence_i: "@influence_icon!"
  game_concept_influential: "Có Ảnh Hưởng"
  game_concept_influence_level: "Cấp Độ Ảnh Hưởng"
  game_concept_influence_level_desc: "Cấp Độ Ảnh Hưởng của một [character_possessive|E] đo lường tổng quyền lực và tầm ảnh hưởng chính trị của họ.\n\nMỗi khi một Nhân vật nhận được [influence|E], họ cũng tích lũy tiến trình để đạt tới $game_concept_influence_level$ tiếp theo.\n\nCác cấp độ bao gồm:\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_5' ).GetNameWithTooltip|L]"
  game_concept_influence_levels: "Các Cấp Độ Ảnh Hưởng"
  game_concept_influence_level_impact: "Tác Động Cấp Độ Ảnh Hưởng"
  game_concept_influence_level_impact_desc: "Tác Động Cấp Độ Ảnh Hưởng làm tăng hoặc giảm các [modifiers|E] nhận được từ [influence_level|E] hiện tại của Ngài."
  game_concept_title_men_at_arms: "Quân Thường Trực Theo Danh Hiệu"
  game_concept_title_men_at_arms_desc: "$game_concept_title_men_at_arms$ là các [men_at_arms|E] gắn liền với một [title|E] nhất định. Thay vì thuộc quyền sở hữu cá nhân của [ruler|E], các đơn vị này luôn đi theo $game_concept_title$ mà chúng thuộc về. Điều đó có nghĩa là ai nắm giữ $game_concept_title$ cũng sẽ sở hữu và điều khiển các đội quân tương ứng.\n\n$game_concept_title_men_at_arms$ được sử dụng bởi một số [government_forms|E], chẳng hạn như [administrative|E]."
  game_concept_domicile: "Cơ Sở Cư Trú"
  game_concept_domiciles: "Các Cơ Sở Cư Trú"
  game_concept_domicile_desc: "Một $game_concept_domicile$ là tài sản riêng của một số [characters|E] theo một [government_form|E] nhất định, như [administrative|E] và [adventurer|E].\n\n$game_concept_domicile$ đóng vai trò là căn cứ quyền lực chính của chủ sở hữu thay cho [holdings|E], và có thể được cải thiện bằng [domicile_buildings|E].\n\nMỗi $game_concept_domicile$ nằm trong một [barony|E] được chỉ định, và có thể được di chuyển sang địa điểm mới. Một số hạn chế có thể áp dụng tùy theo loại $game_concept_domicile$.\n\nMỗi $game_concept_domicile$ có một [title|E] không có đất đai riêng và tuân theo [succession|E] của nó."
  game_concept_domicile_building: "Công Trình Cơ Sở Cư Trú"
  game_concept_domicile_buildings: "Các Công Trình Cơ Sở Cư Trú"
  game_concept_domicile_building_desc: "Tất cả các [domiciles|E] đều có thể được nâng cấp bằng $game_concept_domicile_buildings$, mang lại thu nhập, tài nguyên như [prestige|E], và nhiều lợi ích khác cho chủ sở hữu.\n\nKhả năng xây dựng phụ thuộc vào loại $game_concept_domicile$, vì mỗi loại có một hệ thống công trình hoàn toàn khác nhau.\n\nMột số $game_concept_domicile_buildings$ có thể có [internal_upgrades|E]."
  game_concept_domicile_build_speed: "Thời Gian Xây Dựng [domicile_building|E]"
  game_concept_domicile_travel_speed: "Tốc Độ Di Chuyển [domicile|E]"
  game_concept_domicile_building_upgrade: "Nâng Cấp Nội Bộ"
  game_concept_domicile_building_upgrade_desc: "Một số $game_concept_domicile_buildings$ có thể được cải thiện bằng $game_concept_internal_upgrades$.\n\nMột Nâng Cấp, tuy tương tự các $game_concept_domicile_buildings$ khác, nhưng chỉ có thể được xây dựng bên trong một công trình cụ thể. Mỗi công trình có quyền truy cập Nâng Cấp sẽ có bộ Nâng Cấp riêng biệt của mình."
  game_concept_domicile_building_slot: "Ô $game_concept_domicile_building$"
  game_concept_domicile_building_slots: "Các Ô $game_concept_domicile_building$"
  game_concept_domicile_building_slot_slot: "Ô"
  game_concept_domicile_building_slot_slots: "Các Ô"
  game_concept_domicile_building_slot_desc: "Mỗi [domicile|E] chỉ có một số lượng giới hạn các $game_concept_domicile_building_slot_slots$ tiềm năng cho các công trình mới.\n\nCác $game_concept_domicile_building_slot_slots$ mới có thể được mở khóa bằng cách nâng cấp $game_concept_domicile_building$ trung tâm, ví dụ như [GetDomicileBuilding('estate_main_01').GetName] của một [estate|E] hoặc [GetDomicileBuilding('camp_main_01').GetName] của một [camp|E].\n\n#WEAK Các $game_concept_domicile_building_slot_slots$ bị khóa sẽ được hiển thị trong giao diện $game_concept_domicile$ — không có cách nào để mở thêm $game_concept_domicile_building_slot_slots$ ngoài những vị trí này.#!"
  game_concept_internal_upgrades: "Nâng Cấp Nội Bộ"
  game_concept_estate: "Điền Trang"
  game_concept_estates: "Các Điền Trang"
  game_concept_family_estate: "Điền Trang Gia Tộc"
  game_concept_family_estates: "Các Điền Trang Gia Tộc"
  game_concept_estate_desc: "Một $game_concept_estate$ là một dạng [domicile|E] do [house_head|E] của các [noble_families|E] danh giá trong các [administrative|E] [realms|E] nắm giữ. Chúng đại diện cho các điền sản tư nhân, không gắn liền với bất kỳ [landed|E] [title|E] cụ thể nào.\n\nTại đây có thể xây dựng các [estate_buildings|E] để mở rộng tài sản và [influence|E] của gia tộc, và $game_concept_estate$ sẽ được truyền lại cho các thế hệ sau."
  game_concept_estate_building: "Công Trình Điền Trang"
  game_concept_estate_buildings: "Các Công Trình Điền Trang"
  game_concept_estate_building_desc: "$game_concept_estate_buildings$ là các nâng cấp đặc thù và lâu dài dành cho [estate|E] của một [noble_family_possessive|E].\n\nCó rất nhiều loại công trình có thể xây dựng, cho phép chủ Điền Trang tạo ra thu nhập riêng, mở rộng [influence|E] của gia tộc, và mở khóa nhiều [decisions|E], [interactions|E], cùng các lợi ích khác."
  game_concept_camp: "Doanh Trại"
  game_concept_camps: "Các Doanh Trại"
  game_concept_adventurer_camp: "Doanh Trại Phiêu Lưu"
  game_concept_adventurer_camps: "Các Doanh Trại Phiêu Lưu"
  game_concept_camp_desc: "$game_concept_camps$ là một tập hợp cơ động gồm lều trại, súc vật thồ hàng và con người. Quy mô của chúng có thể chỉ là một vòng trại nhỏ, hoặc là những đạo quân lang thang khổng lồ.\n\nMỗi [GetGovernment( 'landless_adventurer_government' ).GetName] đều có một $game_concept_camp$ làm [domicile|E], và nó di chuyển khắp bản đồ cùng họ.\n\nTại đây có thể xây dựng các [camp_buildings|E], mang lại những lợi ích mạnh mẽ cho $game_concept_adventurer$, thay cho việc sở hữu [counties|E] của riêng mình. Các [followers|E], như [family|E] và [knights|E], sẽ cùng di chuyển với $game_concept_camp$, và có thể được bổ nhiệm làm [officers|E].\n\n#WEAK Giống như [courts|E], các $game_concept_camps$ cũng bao gồm một số [characters|E] vô danh, không đủ quan trọng để được khắc họa — dù số lượng ít hơn.\n\nNgay cả khi không [traveling|E] giữa các $game_concept_counties$, các $game_concept_camps$ thường không đứng yên tại một [location|E] cố định, mà sẽ di chuyển quanh đó sau mỗi vài đêm.#!"
  game_concept_camp_building: "Nâng Cấp Doanh Trại"
  game_concept_camp_buildings: "Các Nâng Cấp Doanh Trại"
  game_concept_camp_building_desc: "$game_concept_camp_buildings$ là các cải tiến đặc thù dành cho một [camp|E].\n\nVề mặt cơ chế, chúng là [domicile_buildings|E] — tuy nhiên nhiều cái đại diện cho tập tục xã hội hoặc các lĩnh vực trọng tâm của $game_concept_camp$, hơn là những công trình theo nghĩa đen.\n\nCác lợi ích chúng có thể mang lại bao gồm:\n$EFFECT_LIST_BULLET$ Mở khóa các [officers|E] mới\n$EFFECT_LIST_BULLET$ Buff [skill|E] mạnh mẽ cho [followers|E]\n$EFFECT_LIST_BULLET$ Tăng cường sức mạnh của [men_at_arms|E]\n$EFFECT_LIST_BULLET$ Mở khóa các hành động mà các [landed|E] [rulers|E] vốn coi là hiển nhiên.\n\n#WEAK Khi một [adventurer|E] trở thành [landed|E], các $game_concept_camp_buildings$ của họ sẽ bị thanh lý, và một phần chi phí sẽ được hoàn lại dưới dạng [gold|E].#!"
  game_concept_follower: "Người Theo"
  game_concept_followers: "Những Người Theo"
  game_concept_following: "Đi Theo"
  game_concept_follower_desc: "Một $game_concept_follower$ là một Nhân vật [unlanded|E] đi theo một [adventurer|E].\n\nVề mặt cơ chế, họ tương đương với [courtiers|E], nhưng ít bị ràng buộc bởi nghĩa vụ tôn kính hay phải ở lại nếu họ không ưa người lãnh đạo.\n\nTổng [opinion|E] của các $game_concept_followers$ sẽ quyết định [camp_temperament|E] của Doanh Trại.\n\nCác $game_concept_followers$ có thể:\n$BULLET_WITH_TAB$ Phục vụ như [officers|E]\n$BULLET_WITH_TAB$ Tham chiến trong [armies|E] với vai trò [commanders|E] hoặc [knights|E]\n$BULLET_WITH_TAB$ Cho phép [adventurer|E] của họ áp đặt [claims|E] trong [war|E]"
  game_concept_camp_temperament: "Khí Chất Doanh Trại"
  game_concept_camp_temperament_desc: "Không giống với hệ thống thứ bậc cứng nhắc của một [court|E], các $game_concept_camps$ phần lớn mang tính không chính thức, nơi mà sự bất mãn của các [characters|E] quan trọng #EMP khác#! ngoài [adventurer|E] đứng đầu có thể ảnh hưởng rất lớn.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! Các $game_concept_camps$ mang lại [character_modifiers|E] tích cực cho $game_concept_adventurer$ của họ. Điều này yêu cầu đa số [opinion|E] của tất cả [characters|E] được nêu tên phải đạt [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] trở lên.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! Các $game_concept_camps$ áp dụng các $game_concept_character_modifiers$ tiêu cực cho $game_concept_adventurer$. Điều này xảy ra khi đa số $game_concept_opinion$ của tất cả $game_concept_characters$ được nêu tên ở mức [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] trở xuống.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! Các $game_concept_camps$ là những trường hợp mà khoảng giá trị $game_concept_opinions$ nằm giữa hai cực đoan trên. Chúng không áp dụng $game_concept_modifiers$ nào.\n\n#WEAK Hiệu ứng của $game_concept_camp_temperament$ sẽ tăng giảm theo [prestige_level|E] của $game_concept_adventurer_possessive$. $game_concept_adventurer$ càng nổi tiếng, các lợi ích — và hệ quả tiêu cực — từ bầu không khí trong $game_concept_camp$ càng rõ rệt.#!"
  game_concept_adventurer: "Nhà Phiêu Lưu"
  game_concept_adventurers: "Các Nhà Phiêu Lưu"
  game_concept_adventurer_possessive: "Của Nhà Phiêu Lưu"
  game_concept_adventurers_possessive: "Của Các Nhà Phiêu Lưu"
  game_concept_adventurer_i: "@government_type_adventurer!"
  game_concept_adventurer_desc: "Một $game_concept_adventurer$ là một [unlanded|E] [character|E] lãnh đạo một [camp|E].\n\nHọ không có [vassals|E], cũng không tạo ra thu nhập thụ động theo cách thông thường — thay vào đó, họ phải nhận các [task_contracts|E] để kiếm tiền, hoặc kêu gọi ân huệ từ [contact_list|E] của mình.\n\nCác $game_concept_adventurers$ có thể tự do lang thang khắp bản đồ. Mối quan tâm hàng đầu của họ là đảm bảo có đủ [provisions|E] để sinh tồn trên đường đi.\n\nThay vì [crown_authority|E], hầu hết $game_concept_adventurers$ sẽ thiết lập một [camp_purpose|E], cho biết nhóm của họ thuộc loại nào và vì sao họ gắn bó với nhau.\n\n#WEAK Những người con trai thứ bảy không có quyền thừa kế, các du mục đầy tham vọng, kẻ bỏ trốn bốc đồng, học giả tò mò, lính đánh thuê tàn bạo hay các quý tộc bị phế truất — tất cả đều góp phần tạo nên đội ngũ đông đảo của những kẻ lang bạt không mệt mỏi này.\n\nĐiểm chung duy nhất của họ là khát vọng vươn tới điều gì đó hơn hẳn một cuộc sống tĩnh lặng trong quên lãng, và ý chí để biến điều đó thành hiện thực.#!"
  game_concept_officer: "Sĩ Quan"
  game_concept_officers: "Các Sĩ Quan"
  game_concept_officer_desc: "$game_concept_officers$ là các vai trò chuyên biệt mà [followers|E] có thể được bổ nhiệm để hỗ trợ [camp|E] của họ.\n\nVề mặt cơ chế, chúng hoạt động rất giống với [court_positions|E]. Cũng như vậy, lợi ích Ngài nhận được từ $game_concept_officers$ phụ thuộc vào [aptitude|E] của người đảm nhiệm vị trí đó.\n\nKhông giống $game_concept_court_positions$, việc bổ nhiệm $game_concept_officers$ là miễn phí và họ không nhận lương hàng tháng, tuy nhiên việc bãi nhiệm vẫn tiêu tốn [prestige|E].#!\n\n#WEAK Các $game_concept_officers$ được mở khóa thông qua nhiều [camp_buildings|E] khác nhau.#!"
  game_concept_imperial_family: "Gia Tộc Đế Chế"
  game_concept_imperial_families: "Các Gia Tộc Đế Chế"
  game_concept_imperial: "Đế Chế"
  game_concept_imperial_family_desc: "$game_concept_imperial_family$ là [house|E] đứng đầu trong một [realm|E] theo [administrative|E]."
  game_concept_noble_family: "Gia Tộc Quý Tộc"
  game_concept_noble_families: "Các Gia Tộc Quý Tộc"
  game_concept_noble_family_possessive: "Của Gia Tộc Quý Tộc"
  game_concept_noble_family_desc: "$game_concept_noble_families$ là các [houses|E] quyền thế trong một [realm|E] theo [administrative|E]. Họ sở hữu một [estate|E], do [house_head|E] kiểm soát và quản lý, và luôn là một phần không thể tách rời của Vương Quốc, khi họ liên tục tìm cách tích lũy [influence|E] và giành quyền kiểm soát các [provinces|E] cho riêng mình.\n\nMột $game_concept_noble_family$ có ảnh hưởng lớn có thể trở thành một [powerful_family|E] hoặc một [dominant_family|E]."
  game_concept_powerful_family: "Gia Tộc Quyền Thế"
  game_concept_powerful_families: "Các Gia Tộc Quyền Thế"
  game_concept_powerful: "Quyền Thế"
  game_concept_powerful_family_desc: "Một $game_concept_powerful_family$ đại diện cho một trong những [houses|E] và [noble_families|E] có ảnh hưởng lớn nhất trong một [realm|E] theo [administrative|E].\n\nMột thành viên của $game_concept_powerful_family$ giỏi hơn trong các [political_schemes|E] và có khả năng cao hơn để đạt được điều mình muốn khi [interacting|E] với các [characters|E] khác.\n\nChỉ có một số lượng giới hạn $game_concept_powerful_families$ tồn tại tại cùng một thời điểm, và các $game_concept_noble_families$ có xếp hạng cao nhất sẽ được coi là Quyền Thế dựa trên [powerful_family_rating_short|E] của họ. Gia Tộc của [top_liege|E] là một ngoại lệ, và luôn được xem là Quyền Thế.\n\nMột Gia Tộc kiểm soát phần lớn lãnh thổ của Vương Quốc có thể trở thành một [dominant_family|E]."
  game_concept_dominant_family: "Gia Tộc Thống Trị"
  game_concept_dominant_families: "Các Gia Tộc Thống Trị"
  game_concept_dominant: "Thống Trị"
  game_concept_dominant_family_desc: "Một $game_concept_dominant_family$ là một [powerful_family|E] đã mở rộng quyền kiểm soát của mình trên diện rộng. Họ được xem là [house|E] có ảnh hưởng lớn nhất trong một [realm|E].\n\nMột thành viên của $game_concept_dominant_family$ còn giỏi hơn nữa trong các [political_schemes|E], và càng dễ đạt được điều mình muốn khi [interacting|E] với các [characters|E] khác.\n\nMột $game_concept_house$ phải kiểm soát ít nhất [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] lãnh thổ của Vương Quốc để trở thành Thống Trị."

  game_concept_house_attribute: "Thuộc Tính Gia Tộc"
  game_concept_house_attribute_desc: "Trong một số [governments|E], các [houses|E] có thể sở hữu một $game_concept_house_attribute$, thứ sẽ ảnh hưởng đến các thành viên của Gia Tộc.\n\nCác Thuộc Tính Gia Tộc bao gồm:\n$EFFECT_LIST_BULLET$[powerful_family_attribute|E]\n$EFFECT_LIST_BULLET$[house_aspiration|E]\n$EFFECT_LIST_BULLET$[mandala_aspect|E]"

  game_concept_powerful_family_attribute: "Thuộc Tính Gia Tộc Quyền Thế"
  game_concept_family_attribute: "Thuộc Tính Gia Tộc"
  game_concept_powerful_family_attribute_desc: "Một $game_concept_powerful_family_attribute$ là một tập hợp các hiệu ứng thưởng gắn liền với một [house|E] trong một [realm|E] theo [administrative|E]. Thuộc Tính này mang lại lợi ích cho các thành viên của $game_concept_house$, cũng như cho cả [liege|E] của họ.\n\nCác Thuộc Tính chỉ có hiệu lực chừng nào $game_concept_house$ còn được xem là một [powerful_family|E], và $game_concept_family_attribute$ của một [dominant_family|E] sẽ không mang lại lợi ích cho [liege|E] của họ.\n\n[house_head|E] có thể tự do thay đổi Thuộc Tính này vào bất kỳ thời điểm nào."


  game_concept_powerful_family_rating: "Chỉ Số Gia Tộc Quyền Thế"
  game_concept_powerful_family_rating_short: "Chỉ Số"
  game_concept_powerful_family_rating_mid: "Chỉ Số Gia Tộc"
  game_concept_powerful_family_rating_desc: "$game_concept_powerful_family_rating$ là thước đo mức độ ảnh hưởng của một [powerful_family|E].\n\nMặc dù có nhiều cách để tăng $game_concept_powerful_family_rating_short$ của một Gia Tộc, yếu tố chính vẫn là số lượng [governorships|E] mà họ nắm giữ.\n\nMột [house|E] phải có $game_concept_powerful_family_rating_short$ ít nhất là [GetDefine('NHouse', 'POWERFUL_HOUSE_MINIMUM_POWER')|V0] để được xem là Quyền Thế."

  game_concept_admin_confirmation: "$admin_confirmation_decision$"
  game_concept_admin_confirmation_desc: "Các [governors|E] có thể được [liege|E] của mình chính thức và công khai xác nhận việc bổ nhiệm."

  game_concept_ep3_become_landless_adventurer_decision: "Quyết Định $become_landless_adventurer_decision$"
  game_concept_ep3_become_landless_adventurer_decision_desc: "Một [decision|E] được mở khóa bởi một số [traditions|E], cho phép một [ruler|E] cai trị một [realm|E] nhỏ tự nguyện rời bỏ quyền lực để trở thành một [adventurer|E]"
  game_concept_ep3_purchase_land_interaction: "$purchase_land_interaction$"
  game_concept_ep3_purchase_land_interaction_desc: "Một [interaction|E] cho phép một [adventurer|E] mua đất từ một [ruler|E] và định cư trong [realm|E] của họ"
  game_concept_ep3_negotiate_settlement_interaction: "$negotiate_settlement_interaction$"
  game_concept_ep3_negotiate_settlement_interaction_desc: "Một [interaction|E] cho phép một [ruler|E] sắp xếp việc định cư cho một [adventurer|E] khó kiểm soát trong [realm|E] của mình"
  game_concept_ep3_laamp_adventurer_invasion_war: "$EP3_LAAMP_INVASION_CB_NAME$"
  game_concept_ep3_laamp_adventurer_invasion_war_desc: "Một [casus_belli|E] cho phép một [adventurer|E] tuyên bố [war|E] nhằm tạo dựng một [realm|E] mới"

  game_concept_contractor: "Bên Thuê"
  game_concept_contractors: "Các Bên Thuê"
  game_concept_contractor_possessive: "Của Bên Thuê"
  game_concept_contractors_possessive: "Của Các Bên Thuê"
  game_concept_contractor_desc: "Một $game_concept_contractor$ là [character|E] đưa ra một $game_concept_task_contract$.\n\n$game_concept_task_contract$ thường chủ yếu ảnh hưởng đến chính họ, và họ thường là người trả thù lao cho [adventurer_possessive|E].\n\n#N [criminal_task_contracts|E] thường #BOL không#! do $game_concept_contractor$ đưa ra, mà thay vào đó tập trung vào việc bóc lột họ — ví dụ như lừa ai đó đưa Ngài [gold|E] vì họ đã thể hiện sự cả tin của mình.#!"

  game_concept_contract_scheme: "Mưu Kế Hợp Đồng"
  game_concept_contract_schemes: "Các Mưu Kế Hợp Đồng"
  game_concept_contract_scheme_possessive: "Của Mưu Kế Hợp Đồng"
  game_concept_contract_schemes_possessive: "Của Các Mưu Kế Hợp Đồng"
  game_concept_contract_scheme_contract: "Hợp Đồng"
  game_concept_contract_scheme_desc: "Nhiều $game_concept_task_contracts$ yêu cầu [adventurers|E] phải hoàn thành thành công một [scheme|E].\n\nChúng có thể mang tính gây hại (như ám sát [rival|E] của [contractor_possessive|E]), dễ chịu (như đơn giản là kể chuyện giải trí cho [court|E] của họ trong vài tháng), hoặc vô hại (như sao chép văn bản cho họ).\n\nNếu $game_concept_scheme$ thất bại hoặc bị hủy bỏ vì bất kỳ lý do nào, $game_concept_task_contract$ cũng sẽ thất bại."

  game_concept_contact_list: "Danh Sách Bảo Trợ"
  game_concept_contact_list_contacts: "Người Bảo Trợ"
  game_concept_contact_list_contact: "Người Bảo Trợ"
  game_concept_contact_list_desc: "[adventurers|E] không có [land|E], nhưng không hề thiếu #EMP mối quan hệ#!.\n\n$game_concept_contact_list$ là danh sách tất cả [character|E] mà họ đã hoàn thành một [task_contract|E] cho, cũng như những người có lý do để ủng hộ họ — [family|E] có [opinion|E] cao, [friends|E], [lovers|E], v.v.\n\n$game_concept_contact_list_contacts$ có thể được khai thác để nhận thêm sự hỗ trợ thông qua [character_interaction|E] $contact_list_request_interaction|V$."

  game_concept_camp_purpose: "Mục Đích Trại"
  game_concept_camp_purposes: "Các Mục Đích Trại"
  game_concept_camp_purpose_purpose: "Mục Đích"
  game_concept_camp_purpose_purposes: "Các Mục Đích"
  game_concept_camp_purpose_desc: "$game_concept_camp_purposes$ là thứ được xem như luật lệ trong tình trạng vô chính phủ phóng khoáng của các [camps|E].\n\nChúng đại diện cho lực gắn kết thúc đẩy $game_concept_camp$ duy trì sự tồn tại chung, dù đó là khuynh hướng học thuật, kỹ năng đánh thuê, hay khát vọng cháy bỏng đưa một vị vua chính thống trở lại ngai vàng.\n\nCác $game_concept_camp_purpose_purposes$ khác nhau sẽ mở khóa các [camp_buildings|E] khác nhau (và qua đó là các [officers|E] độc đáo), dẫn đến các sự kiện hoặc lựa chọn sự kiện khác nhau, đồng thời ảnh hưởng đến loại [task_contracts|E] được tạo ra.\n\n#WEAK $game_concept_camp_purpose$ cũng ảnh hưởng đến danh hiệu của $game_concept_adventurer_possessive$ và trang phục của các [followers|E] của họ.#!"

  game_concept_mercenary_task_contract: "Hợp Đồng Đánh Thuê"
  game_concept_mercenary_task_contracts: "Các Hợp Đồng Đánh Thuê"
  game_concept_mercenary_task_contract_possessive: "Của Hợp Đồng Đánh Thuê"
  game_concept_mercenary_task_contracts_possessive: "Của Các Hợp Đồng Đánh Thuê"
  game_concept_mercenary_task_contract_desc: "Một $game_concept_mercenary_task_contract$ liên quan đến việc hỗ trợ một [character|E] trong một [war|E] đang diễn ra, hoặc một cuộc chiến mà họ dự định khởi xướng với sự trợ giúp của Ngài. Thù lao được trao dựa trên [war_contribution|E] cũng như kết quả cuối cùng."

  game_concept_transport_task_contract: "Hợp Đồng Vận Chuyển"
  game_concept_transport_task_contracts: "Các Hợp Đồng Vận Chuyển"
  game_concept_transport_task_contract_possessive: "Của Hợp Đồng Vận Chuyển"
  game_concept_transport_task_contracts_possessive: "Của Các Hợp Đồng Vận Chuyển"
  game_concept_transport_task_contract_desc: "Một $game_concept_transport_task_contract$ thường liên quan đến việc vận chuyển hàng hóa, như [artifacts|E], hoặc hộ tống các nhân vật quan trọng như [wards|E] trên những quãng đường trung gian."

  game_concept_treasure_map_task_contract: "Hợp Đồng Bản Đồ Kho Báu"
  game_concept_treasure_map_task_contracts: "Các Hợp Đồng Bản Đồ Kho Báu"
  game_concept_treasure_map_task_contract_possessive: "Của Hợp Đồng Bản Đồ Kho Báu"
  game_concept_treasure_map_task_contracts_possessive: "Của Các Hợp Đồng Bản Đồ Kho Báu"
  game_concept_treasure_map_task_contract_desc: "Đưa một nhà phiêu lưu già nua, héo hon đi tìm kho báu cuối cùng của họ."

  game_concept_task_contracts_i: "@task_contract_icon!"
  game_concept_task_contract: "Hợp Đồng"
  game_concept_task_contracts: "Các Hợp Đồng"
  game_concept_task_contract_possessive: "Của Hợp Đồng"
  game_concept_task_contracts_possessive: "Của Các Hợp Đồng"
  game_concept_task_contract_desc: "$game_concept_task_contracts$ là cách chính để [adventurers|E] kiếm [gold|E] hoặc [prestige|E]. Chúng cũng có thể mang lại [provisions|E], [piety|E], và thậm chí cả [artifacts|E].\n\nMỗi hợp đồng là một nhiệm vụ do một [ruler|E] địa phương đưa ra — thường yêu cầu $game_concept_adventurer$ thực hiện một [scheme|E], hoàn thành một chuyến [travel|E], hoặc hỗ trợ họ trong [war|E] — và có thể được đảm nhận để nhận phần thưởng cũng như đưa [contractor|E] vào [contact_list|E].\n\nNhiều $game_concept_task_contracts$ hơn sẽ được tạo ra khi di chuyển trên những quãng đường dài hoặc đến các [kingdoms|E] mới.\n\nCấp bậc [title_tier|E] hoặc địa vị của $game_concept_ruler$ đưa ra $game_concept_task_contract$ càng cao, thì [task_contract_tier_tier|E] của $game_concept_task_contract_possessive$ càng lớn. Cấp bậc cao hơn sẽ trả công #EMP hậu hĩnh hơn nhiều#!.\n\n#alert_trial Hãy cẩn thận với [criminal_task_contracts|E]: phần thưởng của chúng thường rất hấp dẫn, nhưng thế giới này ít khoan dung hơn nhiều với những tội vặt của một kẻ lang thang vô gia cư so với một [liege|E] có [landed|E].#!"

  game_concept_task_contract_tier_i: "@task_contract_tier_icon!"
  game_concept_task_contract_tier: "Cấp Bậc $TASK_CONTRACT_CONTRACT$"
  game_concept_task_contract_tier_tier: "Cấp Bậc"
  game_concept_task_contract_tier_desc: "$game_concept_task_contract_tier$ phản ánh [title_tier|E] của [contractor|E].\n\n[barons|E] và [counts|E] có một sao, [dukes|E] có hai sao, còn [kings|E] và [emperors|E] có ba sao.\n\n$game_concept_contractors$ sẽ không đưa ra công việc cho [adventurers|E] nếu họ không có đủ [prestige_level|E] tương ứng với [rank|E] của mình. Nếu Ngài #EMP chỉ#! ở mức [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L], thì [kings|E] và [emperors|E] thậm chí sẽ không cân nhắc Ngài.\n\n$game_concept_task_contract_tier$ càng cao, thù lao càng được tăng theo — dù độ khó của nhiệm vụ nhìn chung cũng cao hơn.\n\n#WEAK [personality|E] cũng ảnh hưởng đến thù lao: các [characters|E] có đặc điểm [GetTrait('greedy').GetName( GetNullCharacter )] sẽ trả thấp hơn mức chung, còn các $game_concept_characters$ có đặc điểm [GetTrait('generous').GetName( GetNullCharacter )] hoặc [GetTrait('profligate').GetName( GetNullCharacter )] sẽ trả cao hơn rất nhiều.#!"

  game_concept_governance_issue_i: "@task_contract_icon!"
  game_concept_governance_issue: "$TASK_CONTRACT_ISSUE$"
  game_concept_governance_issues: "$TASK_CONTRACT_ISSUE_PLURAL$"
  game_concept_governance_issue_possessive: "$TASK_CONTRACT_ISSUE_POSSESSIVE$"
  game_concept_governance_issues_possessive: "$TASK_CONTRACT_ISSUE_POSSESSIVE_PLURAL$"
  game_concept_governance_issue_desc: "Một $game_concept_governance_issue$ là một nhiệm vụ dành cho một [governor|E] phải giải quyết.\n\nCác Vấn Đề xuất hiện trong một [province|E] sau mỗi vài năm và thường xoay quanh một vấn đề mà $game_concept_governor$ phải xử lý. Tuy nhiên, chúng cũng có thể mang lại những cơ hội.\n\nGiải quyết thành công Vấn Đề thường mang lại [gold|E], [influence|E], và kinh nghiệm cho [trait|E] [GetTrait('governor').GetName(GetNullCharacter)]. Tùy vào từng Vấn Đề cụ thể, các phần thưởng khác cũng có thể được trao.\n\nMỗi $game_concept_governance_issue$ có một [governance_issue_tier_tier|E] ảnh hưởng đến phần thưởng mà nó cung cấp."

  game_concept_governance_issue_tier_i: "@task_contract_tier_icon!"
  game_concept_governance_issue_tier: "Cấp Bậc $TASK_CONTRACT_ISSUE$"
  game_concept_governance_issue_tier_tier: "Cấp Bậc"
  game_concept_governance_issue_tier_desc: "Mỗi [governance_issue|E] đều có một $game_concept_governance_issue_tier$, phản ánh tổng giá trị phần thưởng của Vấn Đề khi được giải quyết thành công. Giải quyết một Vấn Đề có cấp bậc cao hơn thường sẽ mang lại nhiều [gold|E] hoặc [influence|E] hơn, cũng như lượng kinh nghiệm lớn hơn cho [trait|E] [GetTrait('governor').GetName(GetNullCharacter)]."

  game_concept_criminal_task_contract: "Hợp Đồng Phi Pháp"
  game_concept_criminal_task_contracts: "Các Hợp Đồng Phi Pháp"
  game_concept_criminal_task_contract_possessive: "Của Hợp Đồng Phi Pháp"
  game_concept_criminal_task_contracts_possessive: "Của Các Hợp Đồng Phi Pháp"
  game_concept_criminal_task_contract_desc: "Một $game_concept_criminal_task_contract$ thường liên quan đến các hợp đồng mờ ám, có thể rất sinh lợi nhưng sẽ khiến Ngài nhận được @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\nViệc tăng cấp [trait|E] $trait_gallowsbait$ sẽ khiến phần lớn thế giới ghét Ngài hơn và tôn trọng Ngài ít đi, đồng thời cuối cùng sẽ khiến các [followers|E] không tán thành hành vi thổ phỉ của Ngài rời bỏ Ngài một cách ồn ào.\n\n#WEAK $trait_gallowsbait$ là một $game_concept_trait$ cực kỳ tiêu cực, đồng nghĩa với việc nhân vật chỉ là một kẻ phạm tội vặt hạng thấp — chí ít thì một vụ giết người trong triều đình còn có chút #EMP đẳng cấp#!.\n\nNó có thể được xóa bỏ bằng [decision|E] [GetDecisionWithKey('wipe_slate_decision').GetName].#!"

