  game_concept_governor_efficiency: "Hiệu Suất Thống Đốc"
  game_concept_governor_efficiency_i: "@governor_efficiency!"
  game_concept_governor_efficiency_desc: "$game_concept_governor_efficiency$ là thước đo mức độ một [governor|E] hoàn thành tốt công việc của mình và quản lý hiệu quả các [holdings|E] được giao.\n\nHiệu Suất ảnh hưởng đến lượng [taxes|E] và [levies|E] mà một $game_concept_holding$ cung cấp, cũng như hiệu quả của [title_men_at_arms|E].\n\n$game_concept_governor_efficiency$ của một nhân vật chủ yếu được quyết định bởi các [skills|E] của họ và [trait|E] [GetTrait('governor').GetName( GetNullCharacter )]."
 
  game_concept_province_administration: "Hành Chính Tỉnh"
  game_concept_province_administration_desc: "Mỗi [province|E] của một [realm|E] theo [administrative|E] đều có một $game_concept_province_administration$, có thể được thiết lập bởi [liege|E] và [governor|E] để chuyên môn hóa Tỉnh đó.\n\nChỉ một $game_concept_province_administration$ có thể hoạt động cho mỗi Tỉnh."
