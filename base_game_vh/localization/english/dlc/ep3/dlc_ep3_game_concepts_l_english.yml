  game_concept_provincial_army: "Quân đội Tỉnh"
  game_concept_provincial_army_desc: "Quân đội Tỉnh là lực lượng do một [governor|E] tuyển mộ và duy trì trong một [realm|E] có [administrative|E] [government|E].\n\nChúng chỉ bao gồm [title_men_at_arms|E]. Hiệu quả của [men_at_arms|E] chịu ảnh hưởng bởi [governor_efficiency|E] của vị [governor].\n\n[liege|E] có thể tiêu [influence|E] để giành quyền kiểm soát các đạo quân.\n\nCác [governors] có thể mượn quân của nhau trong một số trường hợp, như khi là [allies|E] hoặc sử dụng [hook|E].\n\nMột đạo quân được mượn sẽ được trả lại nếu [character] mượn quân qua đời hoặc khi họ kết thúc toàn bộ các [wars|E] đang diễn ra. Quân đội cũng có thể được trả lại thủ công."
  game_concept_provincial_armies: "Các Quân đội Tỉnh"
  game_concept_thematic_army: "Quân đội Quân khu"
