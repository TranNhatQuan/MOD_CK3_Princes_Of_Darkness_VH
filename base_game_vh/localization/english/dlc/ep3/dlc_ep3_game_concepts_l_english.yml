  game_concept_reinforce_soldiers: "Tăng viện thủ công"
  game_concept_reinforcements: "Tăng viện"
  game_concept_reinforce_soldiers_desc: "[adventurers|E] và [nomads|E] có thể tuyển [men_at_arms|E], nhưng họ không tự động được bổ sung quân như các [landed|E] [rulerpossessive|E]. Thay vào đó, tân binh phải được chiêu mộ thông qua các tương tác."
  game_concept_adventurer_siege_replenishment: "Bổ sung khi Công thành"
  game_concept_adventurer_siege_replenishment_desc: "Khi một [adventurer|E] công thành thành công một [holding|E], một phần [men_at_arms|E] của họ sẽ được bổ sung.\n\nTất cả các [regiments|E] Men-at-Arms trong [army|E] sẽ được bổ sung với lượng bằng #V x2#! giá trị [loot|E] của Holding.\n\n#weak Mức tăng này bao gồm tân binh mới, việc ép tuyển dân địa phương, và trả tiền cho những kẻ đã bỏ đi trong lúc vây hãm.#!"

  game_concept_investment_cap: "Giới hạn Đầu tư"
  game_concept_investment_cap_desc: "Đây là mức tối đa mà một nhân vật có thể đầu tư vào [candidate_score|E] của chính mình hoặc của người khác cho một [governorship|E].\n\nTuổi tác, [powerful_family_rating_mid|E], [influence_level|E] và [estate_buildings|E] là các yếu tố chính quyết định giới hạn này. Trẻ em chịu một mức phạt nhỏ theo thang, trong khi giới hạn của người trưởng thành tăng dần theo tuổi."

  game_concept_appointment_succession_law: "Luật Kế vị Bổ nhiệm"
  game_concept_appointment_succession_laws: "Các Luật Kế vị Bổ nhiệm"
  game_concept_appointment: "Bổ nhiệm"
  game_concept_appointments: "Các Bổ nhiệm"
  game_concept_appointment_succession: "Kế vị Bổ nhiệm"
  game_concept_appointment_succession_law_desc: "Theo $game_concept_appointment_succession_law$, [title|E] và các [holdings|E] liên quan sẽ được truyền cho Ứng viên có [candidate_score|E] cao nhất.\n\nCác loại bao gồm:\n$EFFECT_LIST_BULLET$[GetLaw('appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('acclamation_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_ministry_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_grand_marshal_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('japanese_appointment_succession_law').GetName]"
 
  game_concept_appointment_level: "Cấp Bổ nhiệm"
  game_concept_appointment_levels: "Các Cấp Bổ nhiệm"
  game_concept_appointment_level_desc: "Một $game_concept_appointment_level$ được một số [appointment_succession_laws|E] sử dụng như điều kiện để [characters|E] đủ tư cách trở thành ứng viên.\n\nCác cấp được xác định dựa trên cấp độ của một loại tài nguyên cụ thể, và mỗi luật có thể dùng một loại tài nguyên khác nhau làm yêu cầu. [title|E] cấp cao hơn thường đòi hỏi cấp cao hơn.\n\n#weak Ví dụ: [GetLaw('celestial_appointment_succession_law').GetName] yêu cầu [merit|E] — một [duchy|E] cần [merit_level|E] đạt [GetModifier( 'merit_level_3' ).GetNameWithTooltip|L] trở lên, trong khi một [kingdom|E] cần [GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] trở lên.#!"

  game_concept_seize_peripheral_duchy: "Chiếm đóng Công quốc Biên thùy"
  game_concept_seize_peripheral_duchy_desc: "Một [casus_belli|E] dành cho các [rulers|E] có biên giới giáp với một [realm|E] được quản lý bởi [government_form|E] thuộc hệ thống [government_bureaucratic_type|E].\n\nNghi thức này cho phép kẻ tấn công đánh chiếm một [duchy|E] lân cận nằm ngoài hệ thống phân cấp [de_jure|E] của thủ đô bên phòng thủ."
