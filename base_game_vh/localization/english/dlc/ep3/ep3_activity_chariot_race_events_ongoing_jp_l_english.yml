l_english:
 # Befriend
  chariot_race_ongoing_jp.0100.t: "Cùng Chung Quang Cảnh"
  chariot_race_ongoing_jp.0100.desc.intro: "Khi đám đông gầm lên đầy sốt ruột, ánh mắt ta dán chặt vào [ROOT.Char.Custom2('RelationToMeShort', intent_target)] của mình, [intent_target.GetTitledFirstName],"
  chariot_race_ongoing_jp.0100.desc.courtier: "ngồi ở một khán đài tồi tàn trong khu dành cho triều đình."
  chariot_race_ongoing_jp.0100.desc.count: "ngồi ở một khán đài khiêm tốn, lố nhố các gia nhân của [intent_target.GetHerHis]."
  chariot_race_ongoing_jp.0100.desc.duke: "ngồi giữa đoàn tùy tùng của [intent_target.GetHerHis] ở một trong những khán đài khá hơn."
  chariot_race_ongoing_jp.0100.desc.king: "được bao quanh bởi đoàn tùy tùng của [intent_target.GetHerHis], trải dài qua vài khán đài tốt nhất."
  chariot_race_ongoing_jp.0100.desc.important: "thong thả ngồi trong khán phòng lớn của [ROOT.Char.GetTopLiege.GetTitleAsNamePossessive]."
  chariot_race_ongoing_jp.0100.desc.important_liege: "ngồi lệch sang một bên trong khán phòng lớn của ta."
  chariot_race_ongoing_jp.0100.desc.liege: "được các cận thần vây quanh trong khán phòng lớn của [intent_target.GetHerHis]."
  chariot_race_ongoing_jp.0100.desc.target_personality.fan: "[intent_target.GetWomanMan] đang ngồi chênh vênh trên mép ghế của mình, háo hức chờ đợi cuộc đua với sự chú ý tập trung cao độ."
  chariot_race_ongoing_jp.0100.desc.target_personality.wager: "Trước đó, ta vô tình nghe ai đó nói rằng [intent_target.GetSheHe] đã đặt một khoản cược lớn cho [intent_target.MakeScope.Var('wager_target').Char.GetFirstName] của đội [intent_target.Custom('GetChariotTeamColorPlural')] để [intent_target.Custom('GetWinPlaceShow')]."
  chariot_race_ongoing_jp.0100.desc.target_personality.bored: "[intent_target.GetWomanMan] uể oải phe phẩy quạt cho [intent_target.GetHerselfHimself], ánh mắt lơ đãng quét quanh Trường đua, chẳng mấy hứng thú với cuộc đua."
  chariot_race_ongoing_jp.0100.desc.target_personality.fallback: "[intent_target.GetWomanMan] đang trò chuyện cùng những khán giả gần đó khi họ bàn tán về triển vọng của tay đua [intent_target.GetHerHIs] yêu thích."
  chariot_race_ongoing_jp.0100.desc: "\n\nKhi các cỗ xe [Glossary( 'téthrippa', 'QUADRIGA_GLOSS')] diễu hành ngang qua khán đài, [intent_target.GetHerHis] quay đầu về phía ta để dõi theo chúng."
  chariot_race_ongoing_jp.0100.b.fan: ""Hãy tôn vinh những người bảo trợ của các ngươi! Hãy vẫy tay lên! Các ngươi đang làm trò gì #EMP thế#!?!""
  chariot_race_ongoing_jp.0100.b.wager: "\"Cố lên, #EMP [intent_target.MakeScope.Var('wager_target').Char.GetFirstNameNoTooltip]#! [intent_target.Custom('GetChariotTeamColorPlural')]! [intent_target.Custom('GetChariotTeamColorPlural')]!\""
  chariot_race_ongoing_jp.0100.b.bored: "Một cái ngáp đúng lúc, kèm theo một cái đảo mắt."
  chariot_race_ongoing_jp.0100.b: "Gửi cho [intent_target.GetHerHim] một mảnh giấy."
  chariot_race_ongoing_jp.0100.b.tt.success: "[intent_target.GetFirstNameNoTooltip] thích phong cách của Ngài"
  chariot_race_ongoing_jp.0100.b.tt.neutral: "[intent_target.GetFirstNameNoTooltip] phớt lờ Ngài"
  chariot_race_ongoing_jp.0100.b.tt.failure: "[intent_target.GetFirstNameNoTooltip] gạt Ngài sang một bên"
  chariot_race_ongoing_jp.0100.d.best.tt: "[intent_target.GetTitledFirstName] đã có một trong những chỗ ngồi tốt nhất"
  chariot_race_ongoing_jp.0100.d.better.tt: "[intent_target.GetTitledFirstName] đã có chỗ ngồi tốt hơn Ngài"
  chariot_race_ongoing_jp.0100.d: "Ta sẽ vẫy [intent_target.GetHerHim] lại đây, chỗ này tốt hơn!"
  chariot_race_ongoing_jp.0100.d.host_flavor: "Ai mà cưỡng lại được một chỗ ngồi ở Kathisma chứ?"
  chariot_race_ongoing_jp.0100.d.tt.success: "[intent_target.GetFirstNameNoTooltip] mừng rỡ khôn xiết"
  chariot_race_ongoing_jp.0100.d.tt.partial_success: "[intent_target.GetFirstNameNoTooltip] cảm thấy được tâng bốc"
  chariot_race_ongoing_jp.0100.d.tt.failure: "[intent_target.GetFirstNameNoTooltip] chỉ đơn thuần biết ơn"
  chariot_race_ongoing_jp.0100.d.tt.critical_failure: "[intent_target.GetFirstNameNoTooltip] phớt lờ Ngài"
  chariot_race_ongoing_jp.0100.e: "Một cái gật đầu thừa nhận là đủ rồi."
  chariot_race_ongoing_jp.0100.e.host: "Một cái gật đầu đúng lúc có thể đi rất xa."

  chariot_race_ongoing_jp.0200.t: "Hòa Trộn Đế Chế"
  chariot_race_ongoing_jp.0200.desc.intro: "Quanh các khán đài là vô số chư hầu, quan chức và kẻ ăn theo của đế chế, bề ngoài là đến thưởng thức cuộc đua. Nhưng trên thực tế, đây là một trong những nơi tốt nhất để giao dịch, mở rộng ảnh hưởng và có lẽ là leo lên nấc thang quyền lực trơn trượt.\n\n[ROOT.Char.Custom2('RelationToMeShort', other)] của ta, [other.GetFirstName],"
  chariot_race_ongoing_jp.0200.desc.same_rank_ruler: "một [other.GetTitleAsName] đồng cấp đang phục vụ dưới trướng [other.GetTopLiege.GetTitleAsNamePossessiveNoTooltip], $chariot_race_ongoing_jp.0200.desc.party_intro$ mở ra cơ hội bàn bạc những vấn đề #EMP cấp bách#! mà [ROOT.Char.GetPrimaryTitle.GetNameNoTier] và [other.GetPrimaryTitle.GetNameNoTier] đang đối mặt."
  chariot_race_ongoing_jp.0200.desc.same_rank_courtier: "một kẻ cùng chí hướng đang chờ đợi cơ hội của [other.GetHerHis], ngồi gần đó — có lẽ chúng ta có thể hữu dụng với nhau..."
  chariot_race_ongoing_jp.0200.desc.higher_rank: "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ và, mặc dù [other.GetSheHe] không phải là một [other.GetWomanMan] vĩ đại của vương quốc, [other.GetPrimaryTitle.GetNameNoTier] có thể mang lại #EMP điều gì đó#! hữu ích cho [ROOT.Char.GetPrimaryTitle.GetNameNoTier]..."
  chariot_race_ongoing_jp.0200.desc.lower_rank: "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ mang đến cơ hội hiếm hoi để tiếp cận quyền lực — [other.GetPrimaryTitle.GetNameNoTierPossessive] có #EMP ảnh hưởng#! lớn hơn nhiều trong đế chế so với [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
  chariot_race_ongoing_jp.0200.desc.lower_rank_courtier: "một kẻ chỉ biết leo trèo đang chờ đợi cơ hội của [other.GetHerHis], ngồi gần đó — dù cho những kẻ thấp kém nhất cũng đã từng được biết đến là có những công dụng riêng..."
  chariot_race_ongoing_jp.0200.desc.landed_intro: "một [other.GetTitleAsName] đang phục vụ dưới trướng [other.GetTopLiege.GetTitleAsNamePossessiveNoTooltip],"
  chariot_race_ongoing_jp.0200.desc.party_intro: "đã chiếm một khán đài gần đó cho đoàn tùy tùng của [other.GetHerHis],"
  chariot_race_ongoing_jp.0200.a: "Ta chắc rằng chúng ta có thể học hỏi nhiều điều từ nhau."
  chariot_race_ongoing_jp.0200.b: "Ta không thể mong có một láng giềng tốt hơn!"
  chariot_race_ongoing_jp.0200.b.success: "[other.GetFirstNameNoTooltip] bị cuốn hút"
  chariot_race_ongoing_jp.0200.b.partial_success: "[other.GetFirstNameNoTooltip] hài lòng"
  chariot_race_ongoing_jp.0200.b.failure: "[other.GetFirstNameNoTooltip] tỏ ra thờ ơ"
  chariot_race_ongoing_jp.0200.c: "Ta thật may mắn khi có một láng giềng duyên dáng như vậy."
  chariot_race_ongoing_jp.0200.c.success: "[other.GetFirstNameNoTooltip] bị cuốn hút"
  chariot_race_ongoing_jp.0200.c.partial_success: "[other.GetFirstNameNoTooltip] hài lòng"
  chariot_race_ongoing_jp.0200.c.failure: "[other.GetFirstNameNoTooltip] tỏ ra thờ ơ"
  chariot_race_ongoing_jp.0200.d: "Những hạn mức tín dụng luôn được hoan nghênh."
  chariot_race_ongoing_jp.0200.d.tt: "[rank|E] của Ngài phải khác với [other.GetTitledFirstNamePossessive]"
  chariot_race_ongoing_jp.0200.e: "Nợ nần mở ra nhiều cánh cửa, nếu được quản lý đúng cách."
  chariot_race_ongoing_jp.0200.f: "Một nơi lý tưởng để trao đổi bí mật."
  chariot_race_ongoing_jp.0200.f.available_tt: "Tùy chọn này khả dụng nhờ Ngài biết [secret|E] [given_secret.GetName] của [given_secret.GetOwner.GetTitledFirstNamePossessive]"
  chariot_race_ongoing_jp.0200.f.tt: "[other.GetTitledFirstName] có thể tiết lộ một [secret|E] cho Ngài để đổi lại"
  chariot_race_ongoing_jp.0200.f.success: "[other.GetTitledFirstName] trao đổi một bí mật"
  chariot_race_ongoing_jp.0200.f.failure: "[other.GetTitledFirstName] không tiết lộ gì"
  chariot_race_ongoing_jp.0200.g: "Sự phục vụ của ta có thể mở ra cánh cửa cho [other.GetHerHim]."
  chariot_race_ongoing_jp.0200.h: "Ta chỉ muốn xem cuộc đua mà thôi."

  chariot_race_ongoing_jp.0201.t: "Giới Thượng Lưu Chọn Lọc"
  chariot_race_ongoing_jp.0201.desc.intro: "Trong khi quần chúng chen chúc trên các khán đài, giới quý tộc len lỏi qua những khu vực đặc quyền của họ, thì tại [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] này, chúng ta may mắn được tận hưởng sự yên tĩnh. Gia nhân mang đủ mọi loại đồ giải khát chờ lệnh, còn các xa phu thì liều mạng mưu sinh bên dưới.\n\n"
  chariot_race_ongoing_jp.0201.desc.emperor: "Trong số những người tham gia cùng ta trong lô ghế hôm nay có [ROOT.Char.Custom2('RelationToMeShort', other)] của ta, [other.GetTitledFirstName], rõ ràng đang đắm mình trong sự tiếp cận đặc quyền của [other.GetHerHis] đối với ta, và điều đó truyền đạt ý nghĩa gì."
  chariot_race_ongoing_jp.0201.desc.other_emperor: "Ta thật may mắn khi có chỗ ngồi riêng trong khán phòng của [ROOT.Char.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] — một cơ hội quý giá để lấy lòng [ROOT.Char.Custom2('RelationToMeShort', other)] của mình."
  chariot_race_ongoing_jp.0201.desc.other: "Trong số những người khác được vinh dự tiếp cận có [ROOT.Char.Custom2('RelationToMeShort', other)] của ta, [other.GetTitledFirstName], ngồi gần đó và rõ ràng đang tận hưởng sự độc quyền này."
  chariot_race_ongoing_jp.0201.desc: "Có lẽ [other.GetSheHe] muốn trò chuyện chăng..."
  chariot_race_ongoing_jp.0201.a: "Đây đúng là hạng người tuyệt vời nhất."
  chariot_race_ongoing_jp.0201.b: "Lại đây [other.GetFirstNameNoTooltip], ngồi cạnh ta."
  chariot_race_ongoing_jp.0201.b.tt: "Tùy chọn này khả dụng vì Ngài là [THIS.Char.GetTitleAsNameNoTooltip|V]"
  chariot_race_ongoing_jp.0201.c: "Một nơi lý tưởng để trao đổi bí mật."
  chariot_race_ongoing_jp.0201.d: "Ta nghĩ chúng ta nên giữ khán phòng này cho riêng mình."
  chariot_race_ongoing_jp.0201.e: "Trò chuyện thay vì tận hưởng quang cảnh này quả là một sự lãng phí."
  chariot_race_ongoing_jp.0201.f: "Đây đúng là Ngài đồng hành tuyệt vời nhất!"
  chariot_race_ongoing_jp.0201.h: "Hôm nay trông ngươi thật rạng rỡ, [other.GetFirstNameNoTooltip]."

  chariot_race_ongoing_jp.0300.t: "Giành Quyền Tiếp Cận"
  chariot_race_ongoing_jp.0300.desc.intro: "Mặc dù chúng ta, giới quý tộc, có những vị trí tốt nhất tại Hippodrome, nhưng chúng chẳng là gì so với những chiếc ghế uy quyền của [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] và tất cả những gì nó đại diện.\n\nCùng với gia đình gần gũi của [host.GetHerHis], [host.GetTitleAsNameNoTooltip] vốn được biết đến là người ban đặc quyền cho những ai có được sự ưu ái của [host.GetHerHis], hoặc những kẻ có thể xoay chuyển cánh tay của [host.GetHerHis]..."
  chariot_race_ongoing_jp.0300.a: "Ta sẽ đơn giản là #EMP xin#! thôi."
  chariot_race_ongoing_jp.0300.a.tt: "[THIS.Char.GetShortUIName|U] sẽ bước vào Kathisma"
  chariot_race_ongoing_jp.0300.a.success: "[host.GetFirstNameNoTooltip] cho phép Ngài vào"
  chariot_race_ongoing_jp.0300.a.failure: "[host.GetFirstNameNoTooltip] từ chối"
  chariot_race_ongoing_jp.0300.b: "Một món quà có thể mở ra nhiều cánh cửa."
  chariot_race_ongoing_jp.0300.b.success: "[host.GetTitledFirstName] chấp nhận"
  chariot_race_ongoing_jp.0300.b.failure: "[host.GetTitledFirstName] khước từ"
  chariot_race_ongoing_jp.0300.c: "May mắn thay, [host.GetSheHe] #EMP đang nợ#! ta."
  chariot_race_ongoing_jp.0300.d: "Hừm, ta không việc gì phải cúi đầu."

  chariot_race_ongoing_jp.0301.t: "Xin Quyền Tiếp Cận"
  chariot_race_ongoing_jp.0301.desc.intro: "Dẫu giới quý tộc có những khán đài tốt nhất tại Trường đua, thì tất cả cũng chẳng là gì so với những chỗ ngồi đầy quyền uy trong [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] của ta, cùng ý nghĩa mà nó mang lại.\n\nAi ai cũng khao khát một chỗ ngồi trên này, và dường như không ai khao khát hơn [weasel.GetName],"
  chariot_race_ongoing_jp.0301.desc.ask: "kẻ đã lén đặt một mảnh giấy cầu khẩn vào tay lính canh hoàng cung..."
  chariot_race_ongoing_jp.0301.desc.gold: "\n\nTuy nhiên, ta nghe nói [weasel.GetSheHe] là một [weasel.GetWomanMan] khá giàu có."
  chariot_race_ongoing_jp.0301.desc.hook: "kẻ đang thô lỗ viện dẫn khoản nợ ta mắc với [weasel.GetHerHim]..."
  chariot_race_ongoing_jp.0301.a: "Được thôi, cho [weasel.GetHerHim] vào."
  chariot_race_ongoing_jp.0301.b: "Những đặc quyền như thế này luôn đi kèm cái giá..."
  chariot_race_ongoing_jp.0301.b.success: "[weasel.GetTitledFirstName] móc hầu bao"
  chariot_race_ongoing_jp.0301.b.failure: "[weasel.GetTitledFirstName] từ chối"
  chariot_race_ongoing_jp.0301.b.tt: "[weasel.GetTitledFirstName] không đủ khả năng tặng quà #weak (@gold_icon![THIS.Char.MakeScope.ScriptValue('minor_gold_value')|0])#!"
  chariot_race_ongoing_jp.0301.c: "Xem ra ta chẳng còn lựa chọn nào khác..."
  chariot_race_ongoing_jp.0301.d: "Không đời nào."
 
  chariot_race_ongoing_jp.0400.t: "Thêm Một Vòng"
  chariot_race_ongoing_jp.0400.intro: "Các thị vệ thả dấu mốc cá heo [ROOT.Char.Custom('GetChariotMiddlingLapCount')] khi [first_place_charioteer.GetFirstName] của đội [first_place_charioteer.Custom('GetChariotTeamColorPlural')]"
  chariot_race_ongoing_jp.0400.intro_flavor1: "lao vút qua những bức tượng lấp lánh của các tay đua xe ngựa thời xưa, giơ cánh tay cầm roi của [first_place_charioteer.GetHerHis] lên ăn mừng sớm."
  chariot_race_ongoing_jp.0400.intro_flavor2: "ôm cua sát rào chắn, suýt nữa thì mất thăng bằng, khiến tiếng gào thét điên cuồng của đám đông càng thêm dữ dội."
  chariot_race_ongoing_jp.0400.intro_flavor3: "điều khiển đội ngựa nghiến răng kèn kẹt của [first_place_charioteer.GetHerHis] không ngừng tiến về phía trước, chiếc roi vung lên như một công cụ của [ROOT.Char.GetFaith.HighGodName]."
  chariot_race_ongoing_jp.0400.intro_flavor4: "vút qua họ, lén nhìn lại qua vai của [first_place_charioteer.GetHerHis] với vẻ mặt vừa chế giễu vừa lo lắng."
  chariot_race_ongoing_jp.0400.intro_flavor5: "trượt qua khúc cua. Những phần không bị bụi mù che khuất do [first_place_charioteer.GetSheHe] hất lên bùng nổ trong sự phấn khích."
  chariot_race_ongoing_jp.0400.second1: "\n\n[second_place_charioteer.GetFirstName] bám sát gót [first_place_charioteer.GetHerHis],"
  chariot_race_ongoing_jp.0400.second2: "\n\nChỉ cách vài thước, đội ngựa của [second_place_charioteer.GetFirstNamePossessive] khuấy tung cùng lớp cát,"
  chariot_race_ongoing_jp.0400.second3: "\n\n[second_place_charioteer.GetFirstName] chỉ tụt lại đôi chút và vẫn có thể thu hẹp khoảng cách,"
  chariot_race_ongoing_jp.0400.second4: "\n\nGần như ngay sau lưng [first_place_charioteer.GetHerHim], đội ngựa háu đói của [second_place_charioteer.GetFirstNamePossessive] bám theo,"
  chariot_race_ongoing_jp.0400.second5: "\n\n[second_place_charioteer.GetFirstName] hơi tụt lại, nhưng hoàn toàn chưa đến mức tuyệt vọng,"
  chariot_race_ongoing_jp.0400.third1: "[second_place_charioteer.GetHerselfHimself] bị truy đuổi sát sao bởi [third_place_charioteer.GetFirstName] đầy quyết tâm."
  chariot_race_ongoing_jp.0400.third2: "trong khi [third_place_charioteer.GetFirstName] lao phía sau, dò tìm cơ hội."
  chariot_race_ongoing_jp.0400.third3: "trong khi [third_place_charioteer.GetFirstName] chỉ cách ngay phía sau, đội ngựa tưởng như đã trong tầm cắn."
  chariot_race_ongoing_jp.0400.third4: "trong khi [third_place_charioteer.GetFirstName] nôn nóng bám riết, ép tìm cơ hội vượt lên."
  chariot_race_ongoing_jp.0400.third5: "trong khi [third_place_charioteer.GetFirstName] từ từ sánh ngang, tuyệt vọng tìm cách vượt mặt."
  chariot_race_ongoing_jp.0400.winning_place: "\n\nÔi [ROOT.Char.GetFaith.FateGodName] vĩ đại! Nếu [wager_target.GetFirstNameNoTooltip] có thể giữ vững vị trí của [wager_target.GetHerHis]!"
  chariot_race_ongoing_jp.0400.losing_place: "\n\nÔi [ROOT.Char.GetFaith.FateGodName] vĩ đại! Ngươi đang làm gì ở vị trí #EMP [wager_target.Custom('GetChariotRacePlacement')]#! vậy hả [wager_target.GetFirstNameNoTooltip]?!"
  chariot_race_ongoing_jp.0400.out: "\n\nTa chỉ còn biết ủ rũ nghĩ về khoản cược đáng hối tiếc của mình cho [wager_target.GetFirstName]..."
  chariot_race_ongoing_jp.0400.a: "#EMP Cố lên [wager_target.GetFirstNameNoTooltip]#!!"
  chariot_race_ongoing_jp.0400.b: "Lần sau ta sẽ đặt cược khôn ngoan hơn..."
  chariot_race_ongoing_jp.0400.c: "Một cuộc đua quá đã!"
  chariot_race_ongoing_jp.0400.d: "#EMP Đi nào! ĐI ĐI [wager_target.GetWomanMan]!#!"

  chariot_race_ongoing_jp.0500.t: "Phô Diễn"
  chariot_race_ongoing_jp.0500.intro: "Mọi ánh mắt đều đổ dồn vào cỗ xe của [first_place_charioteer.GetFirstNamePossessive], và lợi thế vững chắc mà [first_place_charioteer.GetSheHe] tạo ra,"
  chariot_race_ongoing_jp.0500.first: "và rõ ràng [evil_knievel.GetWomanMan] này biết điều đó, khi [evil_knievel.GetSheHe]"
  chariot_race_ongoing_jp.0500.last: "khi [evil_knievel.GetFirstName], đang tụt xa ở vị trí cuối cùng,"
  chariot_race_ongoing_jp.0500.high: "khi [evil_knievel.GetFirstName], không kém quá xa,"
  chariot_race_ongoing_jp.0500.middle: "khi [evil_knievel.GetFirstName], lạc giữa đoàn,"
  chariot_race_ongoing_jp.0500.low: "khi [evil_knievel.GetFirstName], bám theo nhóm bét bảng,"
  chariot_race_ongoing_jp.0500.trick_flavor1: "bất ngờ nhảy lên phía trước cỗ xe của [evil_knievel.GetHerHis], vừa lái bằng một tay vừa vẫy chào khán giả!"
  chariot_race_ongoing_jp.0500.trick_flavor2: "nhảy nhót trên cỗ xe của [evil_knievel.GetHerHis], và quay lưng lại, tiếp tục lái xe trong khi thổi những nụ hôn về phía khán đài!"
  chariot_race_ongoing_jp.0500.trick_flavor3: "nhảy ra khỏi cỗ xe của [evil_knievel.GetHerHis] lên lưng con ngựa dẫn đầu của [evil_knievel.GetHerHis], tay giơ cao trong chiến thắng!"
  chariot_race_ongoing_jp.0500.trick_flavor4: "nhảy ra khỏi cỗ xe của [evil_knievel.GetHerHis] lên lưng con ngựa dẫn đầu của [evil_knievel.GetHerHis], vẫy tay chào khán giả!"
  chariot_race_ongoing_jp.0500.filler: "\n\nĐám đông gào thét sung sướng"
  chariot_race_ongoing_jp.0500.overtake: "nhưng [overtaking_charioteer.GetFirstName] tỏ ra không mấy ấn tượng: nhìn thấy cơ hội của [overtaking_charioteer.GetHerHis], [overtaking_charioteer.GetSheHe] nhanh chóng vượt lên giành lấy vị trí [overtaking_charioteer.Custom('GetChariotRacePlacement')]."
  chariot_race_ongoing_jp.0500.maintained: "khi [evil_knievel.GetFirstNameNoTooltip] bằng cách nào đó duy trì được vị trí của [evil_knievel.GetHerHis], ngăn cản các cú vượt, mặc cho mọi tình huống!"
  chariot_race_ongoing_jp.0500.maintained_last: "có vẻ như [evil_knievel.GetSheHe] muốn #EMP chút#! vinh quang, ngay cả khi [evil_knievel.GetSheHe] sắp về đích cuối cùng."
  chariot_race_ongoing_jp.0500.dead: "Tiếng reo hò đạt đến đỉnh điểm khi [evil_knievel.GetFirstName] đột ngột mất thăng bằng! Một mớ hỗn độn của gỗ vụn, thịt ngựa và bụi mù cuộn trên cát, rồi đâm sầm vào rào chắn..."
  chariot_race_ongoing_jp.0500.alive: "[evil_knievel.GetFirstName] nhẹ nhàng trở lại tư thế quen thuộc của một xa phu, nở nụ cười vương giả khiến cả Trường đua ngây ngất."
  chariot_race_ongoing_jp.0500.alive_overtaken: "[evil_knievel.GetFirstName] vội vã trở lại vị trí thích hợp của [evil_knievel.GetHerHis], giơ nắm đấm về phía kẻ vượt mặt [evil_knievel.GetHerHis]."
  chariot_race_ongoing_jp.0500.loss_dead: "\n\nTa vùi mặt vào hai tay... \"Đồ ngốc, [evil_knievel.GetFirstNameNoTooltip]...!\""
  chariot_race_ongoing_jp.0500.loss: "\n\nTa trố mắt không tin nổi. \"Đồ #EMP ngu xuẩn#!, [evil_knievel.GetFirstNameNoTooltip]!\""
  chariot_race_ongoing_jp.0500.gain: "\n\nHa! Cho [evil_knievel.GetHerHim] chừa cái thói làm trò hề."
  chariot_race_ongoing_jp.0500.a: "Thật là gan dạ!"
  chariot_race_ongoing_jp.0500.b: "Ôi #EMP [ROOT.Char.GetFaith.HighGodName]#!!"
  chariot_race_ongoing_jp.0500.c: "Ha! Tập trung vào chiến thắng đi [overtaking_charioteer.GetFirstNameNoTooltip]!"
  chariot_race_ongoing_jp.0500.d: "Đồ #EMP ngu xuẩn#! chết tiệt, [evil_knievel.GetFirstNameNoTooltip]!"

  chariot_race_ongoing_jp.0600.t: "Túi Rỗng"
  chariot_race_ongoing_jp.0600.intro: "Chưa kịp để ý thì tên nhà cái, [bookmaker.GetTitledFirstName], đã chuồn mất, chiếc túi tiền đeo bên hông [bookmaker.GetHerHis] leng keng vui vẻ với số vàng mồ hôi nước mắt của ta, thì ta nghe thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('castigator'))] của mình, [castigator.GetTitledFirstNamePossessive], hét lên đầy sửng sốt:\n\n\"#EMP Ôi...!#! Vì #EMP trời đất#! sake [castigator.Custom2('RelationToMeShort', ROOT.Char)]!\""
  chariot_race_ongoing_jp.0600.kathisma: "Cả [Glossary( 'kathisma', 'KATHISMA_GLOSS')] chìm vào im lặng khi ly chén rơi xuống và mọi ánh nhìn đổ dồn lại."
  chariot_race_ongoing_jp.0600.stands: "Sự im lặng bao trùm các khán đài xung quanh khi tất cả quay sang nhìn chằm chằm vụ bộc phát này."
  chariot_race_ongoing_jp.0600.desc: "\n\n\"Đừng nói với ta là ngươi đang #EMP đốt sạch#! tiền của mình đấy nhé?\" [castigator.GetSheHe] tiếp tục, [castigator.Custom('quirk_neg_adverb')]. \"Ngươi sẽ chẳng còn lại gì cả! Thế còn #EMP những lúc khẩn cấp thì sao?!#!\" Tên nhà cái vội vã lẩn khỏi tầm mắt, rút lui trước ánh nhìn sắc như dao của [castigator.GetFirstNamePossessiveNoTooltip]."
  chariot_race_ongoing_jp.0600.a: "Ôi thôi biến đi [castigator.GetFirstNameNoTooltip]! Ta đang xem đua mà!"
  chariot_race_ongoing_jp.0600.b: "Có lẽ ta nên giảm tiền cược lại..."
  halve_wager_effect_tt: "Tiền cược của Ngài bị #M giảm một nửa#!"
  chariot_race_ongoing_jp.0600.c: "Ngươi nói #EMP đúng!#! Mau lên! Gọi [bookmaker.GetFirstNameNoTooltip] quay lại!"
  cancel_wager_effect_tt: "Tiền cược của Ngài bị #N hủy bỏ#!"
