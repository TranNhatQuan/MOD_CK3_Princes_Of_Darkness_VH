l_english:

  ep3_travel_events.3000.t: "Dòng Nước Sông Jordan"
  ep3_travel_events.3000.desc: "Người đời chỉ nói về sự kỳ diệu của"

  ep3_travel_events.3000.israel: "[Glossary( ''Ereṣ Yisrā'ēl', 'ERES_YISRAEL_GLOSS' )], được tưới mát bởi dòng sông Jordan cao quý như khu vườn của [ROOT.Char.GetFaith.HighGodName].\n\nTại chốn đầy phép màu này, ta bước xuống làn nước, tắm mình nơi Elisha từng chữa lành người phung, nơi dân Israel của Joshua đã đi những bước cuối cùng trên con đường trở về quê hương..."
  ep3_travel_events.3000.greek_christian: "Palestine, nơi mỗi sa mạc đều là một [Glossary( 'eremos', 'EREMOS_GLOSS' )] linh thiêng bậc nhất, mỗi hòn đá đều thiêng liêng, mỗi dòng suối đều chảy về sông Jordan.\n\nBước xuống dòng sông ấy, ta tắm mình nơi Gioan Tẩy Giả từng cử hành nghi lễ, nơi chính Chúa Kitô đã được rửa tội..."
  ep3_travel_events.3000.christian: "Palestine, mảnh đất nơi lớp đất đã in dấu bước chân của Thượng Đế, nơi dòng sông Jordan từng chạm đến thân thể Người.\n\nBước xuống dòng sông ấy, ta tắm mình nơi Gioan Tẩy Giả từng cử hành nghi lễ, nơi chính Chúa Kitô đã được rửa tội..."
  ep3_travel_events.3000.muslim: "Palestine, vùng đất của những chiến thắng vĩ đại của Hồi giáo, được tưới mát bởi dòng sông Jordan cao quý.\n\nGiờ đây ta lội xuống dòng sông ấy, mong khởi đầu việc tẩy uế. Gần ngay trước mắt là nơi an nghỉ của các Ngài đồng hành của Nhà Tiên Tri — cầu bình an cho họ — nơi này thật lý tưởng để ta thực hành các [Glossary( 'hadiths', 'HADITHS_GLOSS' )]..."
  ep3_travel_events.3000.outro_rapture: "\n\nVà dù dưới chân là rong nhớt, bọt sữa trôi theo dòng nước đục — nơi này xứng đáng là một trong bốn dòng sông của Thiên Đàng! Chưa bao giờ ta cảm thấy thanh sạch đến thế."
  ep3_travel_events.3000.outro: "\n\nVà — trông thật bẩn thỉu! Làn da ta bị lớp bùn sữa ấm áp lười nhác vuốt ve; cặn cây sôi lên giữa các ngón chân. Không chút nghi lễ, ta vội trèo trở lại bờ bùn."
  ERES_YISRAEL_GLOSS: "#bold 'Ereṣ Yisrā'ēl#! là cách phiên âm tiếng Do Thái Tiberias của cụm từ \"Vùng Đất Israel\""
  EREMOS_GLOSS: "#bold Eremos#! là một thuật ngữ Hy Lạp dùng để chỉ những vùng hoang vắng, thích hợp cho đời sống chiêm niệm cô tịch."
  HADITHS_GLOSS: "#bold Hadiths#! là các tuyển tập lời nói và hành động được cho là của Nhà Tiên Tri Muhammad; một nguồn chỉ dẫn quan trọng đối với hầu hết các hệ phái Hồi giáo."
  ep3_travel_events.3000.a_christian: "Dòng nước chí thánh — cho những lễ rửa tội phúc lành!"
  ep3_travel_events.3000.a_jewish: "Dòng nước của phép màu, đáng được trân quý!"
  ep3_travel_events.3000.a_muslim: "Inshallah, vài giọt cho mỗi lần tẩy uế!"
  ep3_travel_events.3000.b: "Dẫu sao... ta đã được dòng nước thanh tẩy."
  ep3_travel_events.3000.b_zealot: "Ta đã được dòng nước thanh tẩy!"
  ep3_travel_events.3000.b.flavor: "Ừ, ta sẽ kể như vậy!"
  ep3_travel_events.3000.c: "Có ít nước vào miệng rồi! Ta phải — #EMP *oẹ!*#!"
  ep3_travel_events.3000.c_zealot: "Nhưng — #EMP *oẹ!*#! — vị của nó đúng là #EMP kỳ quặc#!..."
  ep3_travel_events.3000.c_flavor: "Ngài kín đáo “trút bỏ” mọi thứ."

  holy_water_mortal_stomach_modifier: "Nước Thánh, Dạ Dày Phàm Tục"
  holy_water_mortal_stomach_modifier_desc: "Kể từ khi quá #EMP say sưa#! trong sự hoan lạc của dòng sông Jordan, nhân vật này đã mắc phải một cơn bệnh."

  artifact_water_of_the_jordan: "Nước Sông Jordan"
  artifact_water_of_the_jordan_desc: "Những giọt nước linh thiêng từ nguồn nước ban phúc cho Thánh Địa — dòng sông Jordan. Hơi ngả màu nâu."

  ep3_travel_events.3001.t: "Cổng Núi Cilicia"
  ep3_travel_events.3001.intro: "Chúng ta vất vả băng qua những lối đèo canh giữ, các khe núi gồ ghề giữa Á Châu và Âu Châu. Trên cao, nơi gió quất dữ dội giữa đá núi, những ánh mắt [current_location.GetCulture.GetName] dõi theo chúng ta."
  ep3_travel_events.3001.greek: "\n\nNhững [Glossary( 'akritai', 'AKRITAI_GLOSS' )] này, những người canh giữ Cổng Cilicia trong các pháo đài trên cao, không còn phòng thủ trước những cuộc tàn phá của thời Herakleios — nhưng họ vẫn canh chừng kẻ thù sắp tới, bọn du mục cướp bóc và những tên trộm vặt rình rập các lối hẹp này."
  AKRITAI_GLOSS: "Thuật ngữ Hy Lạp #boldakritai#!, bắt nguồn từ từ #EMP akron#! hay \"biên giới\", chỉ những người lính biên phòng đôi khi được tôn vinh như những người bảo vệ chống lại cuộc xâm lược #EMP ghazi#!, và đôi khi bị lên án như những tên cướp."
  ep3_travel_events.3001.friend: "\n\nNgười ta nói rằng những người canh giữ Cổng Cilicia này, trong các pháo đài cao, từng bảo vệ chống lại làn sóng ngoại giáo tàn phá. Nay họ canh chừng du mục cướp bóc và bọn trộm vặt, dù có người cho rằng họ chẳng khá hơn thảo khấu là bao. Dẫu vậy..."
  ep3_travel_events.3001.islamic_arabic: "\n\nNhững kẻ khôn ngoan mà thô lỗ tụ tập tại Cổng Cilicia, vùng biên lịch sử này — [Glossary( 'al-thughūr', 'AL_THUGHUR_GLOSS')], canh phòng cho [lords_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] [lords_liege.GetTitleAsName]. Dưới thời Rashidun Caliphate hùng mạnh, quân biên phòng từng truy kích những người mang đạo Hồi tại đây — xuyên qua con đường tàn sát hiểm trở này."
  AL_THUGHUR_GLOSS: "#bold Al-thughūr#! là cách gọi mô tả bằng tiếng Ả Rập cho các miền biên Cilicia, ví những pháo đài và lối núi hẹp như những khe hở giữa các răng."
  ep3_travel_events.3001.foe: "\n\nNhững kẻ khôn ngoan mà thô lỗ tụ tập tại Cổng Cilicia, canh phòng cho [lords_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] [lords_liege.GetTitleAsName]. Từ các pháo đài trên cao, các cuộc phục kích giáng xuống cả thảo khấu lẫn dân lành — tất cả đều nhân danh bảo vệ trung tâm lãnh thổ."
  ep3_travel_events.3001.praise_outro: "\n\nTại đây, chỉ vài lính trưng binh bình thường trong những pháo đài tồi tàn đã bảo vệ cả một đế chế."
  ep3_travel_events.3001.distrust_outro: "\n\nKhi chúng ta tiếp tục tiến bước, những bóng hình lén lút bắt chước hành trình của ta trên sườn núi..."
  ep3_travel_events.3001.a_greek: "Hãy tôn vinh các #EMP akritai#!!"
  ep3_travel_events.3001.a_non_greek: "Một nơi chốn định mệnh."
  ep3_travel_events.3001.b: "Đầy điềm gở."

  haunted_by_hostile_troops_modifier: "Bị Ám Ảnh Bởi Quân Địch"
  haunted_by_hostile_troops_modifier_desc: "Nhân vật này bất an bởi ký ức về những ánh mắt rình rập trong các lối núi Cilicia."

  ep3_travel_events.3002.t: "Nơi [local_lord.GetCulture.GetCollectiveNounNoTooltip] Cai Trị"

  ep3_travel_events.3002.intro: "Một trung tâm quyền lực ở rất gần: [local_lord_capital.GetProvince.GetHolding.GetType.GetName|l] của [local_lord_capital.GetName], nơi [local_lord.GetTitledFirstName] trông coi cộng đồng [local_lord.GetCulture.GetCollectiveNoun].\n\n"
  ep3_travel_events.3002.admin: "Vị [local_lord.GetCulture.GetNameNoTooltip] [local_lord.GetTitleAsNameNoTooltip|l] này, thật may mắn, theo đuổi lối quản trị khai sáng kiểu [ROOT.Char.GetCulture.GetName]. Việc đi lại trong [local_lord.GetHerHis] [local_lord.GetPrimaryTitle.GetTierAsNameNoTooltip|l] trở nên quen thuộc và an toàn.\n\n"
  ep3_travel_events.3002.non_admin: "Dựa vào những mối quan hệ cá nhân kịch tính và vũ lực thô bạo để giữ chặt mảnh đất của [local_lord.GetHerHis], [local_lord.GetCulture.GetNameNoTooltip] [local_lord.GetTitleAsNameNoTooltip|l] này chẳng qua chỉ là một tên lãnh chúa [local_lord.GetGovernment.GetNameNoTooltip|l] nhỏ nhen.\n\n"
  ep3_travel_events.3002.armenian: "Khi các kỵ sĩ tiến đến, ta nghĩ về những người Armenia kiên cường đã bảo vệ đế chế trong những năm đen tối — cứng đầu không chịu hạ kiếm cũng như không mặn mà với giáo lý. Những đồng minh kỳ lạ... nhưng là Bạn Bè và người ngưỡng mộ La Mã."
  ep3_travel_events.3002.georgian: "Thật lạ khi viếng thăm [local_lord.GetCulture.GetCollectiveNounNoTooltip]. Giống như chúng ta, họ từ lâu đã ca tụng đức tin chân chính, xây dựng những nhà tắm lớn, giao thiệp với người Armenia... nhưng họ nhìn ra những thảo nguyên bất tận và đặt niềm tin vào các dãy núi cao."
  ep3_travel_events.3002.bulgarian: "Khi những [Glossary( 'Scythians', 'SCYTHIAN_GLOSS' )] nửa hoang dã lùa dê băng qua đường, ta nghĩ tới [Glossary( 'St. Cyril and St. Methodius', 'CYRIL_AND_METHODIUS_GLOSS' )]... và sự may mắn của họ khi có vinh quang đế chế hậu thuẫn: vinh quang mà nay chính ta đang mang."
  SCYTHIAN_GLOSS: "#bold Scythian#!: thành viên của một nền văn hóa du mục Iran đã biến mất. Thuật ngữ này tiếp tục được người Hy Lạp dùng một cách chung chung cho các du mục phương bắc và cả người Slav."
  CYRIL_AND_METHODIUS_GLOSS: "#bold Cyril và Methodius#!, được gọi là \"Các Tông Đồ của người Slav\": hai anh em được tôn kính như thánh vì đã Kitô hóa người Slav phương nam và tạo ra bảng chữ cái Glagolitic."
  ep3_travel_events.3002.serbian: "Một toán kỵ sĩ chào đón chúng ta. Những chiến binh cưỡi ngựa mặc giáp lưới dữ dằn này sẽ là những [Glossary( 'chonsarioi', 'CHONSARIOI_GLOSS' )] tuyệt vời... nhưng ta không mang quyền trượng chỉ huy. Ta chỉ là một người La Mã ghé thăm."
  CHONSARIOI_GLOSS: "#bold Chonsarioi#! là các đơn vị kỵ binh Byzantine tuyển mộ từ Balkan, được đánh giá cao về khả năng trinh sát và đột kích."
  ep3_travel_events.3002.latin: "Các thư lại của [local_lord.GetHerHis|U] tiến đến. Thuở xưa, những người Latin này từng mang phong thái La Mã, nói năng và hành xử tao nhã. Giờ đây, họ lắp bắp như man di và kêu gào vì của cải, vì [Glossary( 'special rights', 'SPECIAL_RIGHTS_GLOSS' )] tại các thành phố lớn của chúng ta..."
  SPECIAL_RIGHTS_GLOSS: "#bold Đặc quyền#! buôn bán không thuế và lập thêm cơ sở tại Constantinople là nguyên nhân cố hữu của các thương nhân Venezia."
  ep3_travel_events.3002.vlach: "Tâm trí ta hướng về thịt và phô mai cừu của người Vlach — sự hiếu khách nồng hậu của họ. Những người du mục dưới quyền [local_lord.GetTitleAsNamePossessiveNoTooltip] này từng là các [Glossary( 'Dacians', 'DACIANS_GLOSS' )] hung hãn, người ta nói vậy... cho đến khi một người La Mã gõ cửa nhà họ."
  DACIANS_GLOSS: "#bold Dacians#!: cư dân cổ đại của vùng đất gần dãy Carpath, phía tây Biển Đen. Sau cuộc chinh phục của Trajan, họ từng được sáp nhập vào đế chế với tên gọi Dacia La Mã trong một thời gian ngắn."
  ep3_travel_events.3002.generic: "Với các mối giao hảo giữa dân tộc chúng ta, việc ta xuất hiện trước những quyền quý như thế này là điều dễ hiểu, gây ấn tượng với họ bằng đức hạnh [ROOT.Char.GetCulture.GetNameNoTooltip]..."

  insulted_by_visiting_emperor: "Bị xúc phạm bởi Hoàng Đế vi hành"
  honored_by_visiting_emperor: "Mối quan hệ lịch sử được Hoàng Đế vi hành tôn vinh"

  ep3_travel_events.3002.a: "Hãy để họ chiêm ngưỡng một [ROOT.Char.Custom('GetDaughterSon')] của đế chế!"
  ep3_travel_events.3002.a_byzantine: "Ta đến đây với tư cách hậu duệ của La Mã hùng mạnh."
  ep3_travel_events.3002.a.flavor: "Một chuyến viếng thăm ấn tượng có thể củng cố danh tiếng của ta nơi đây... và cả ở quê nhà."
  ep3_travel_events.3002.b: "Ta sẽ ghé thăm các [local_lord.GetFaith.HouseOfWorshipPlural] địa phương."
  ep3_travel_events.3002.b.flavor: "Một cách hay để tránh các nghi thức hình thức... ta chỉ cần phớt lờ khác biệt tôn giáo."
  ep3_travel_events.3002.c: "Những người dân tỉnh lẻ này trân trọng sự ấm áp và khiêm nhường."
  ep3_travel_events.3002.c_foreign: "Những kẻ ngoại bang này trân trọng sự ấm áp và khiêm nhường."

  cultural_acceptance_loss_insulted_by_visiting_emperor: "Bị Hoàng Đế vi hành xúc phạm"
  cultural_acceptance_gain_honored_by_visiting_emperor: "Được Hoàng Đế vi hành kính trọng"

  impressive_visit_vassalization_acceptance_bonus: "[local_lord.GetShortUIName] tăng mức Chấp Nhận #V $offer_vassalization_interaction$#! trong #V 5 năm#!"

  ep3_travel_events.3002.a_success: "[local_lord.GetTitleAsNameNoTooltip] bị choáng ngợp"
  ep3_travel_events.3002.a_failure: "[local_lord.GetTitleAsNameNoTooltip] khinh thường sự phô trương của ta"

  ep3_travel_events.3010.t: "Sự Tĩnh Lặng Anatolia"
  ep3_travel_events.3010: "Tiếng gọi của chúng ta vang vọng trong những con ngõ làng hoang vắng, tha thiết tìm kiếm dù chỉ một tiếng đáp, một tiếng be be chào mừng. Chỉ có gió đáp lời.\n\n"
  ep3_travel_events.3010.fairy_towers: "\"Những khối đá đơn điệu xoắn vặn điên cuồng kia, các tháp tiên cổ của [current_location.GetName]: những lỗ hổng của chúng che giấu những cánh cửa bị chặn,\" các Ngài đồng hành lẩm bẩm."
  ep3_travel_events.3010.normal_holes: "\"Tụm lại trong một cái hốc, một đường hầm, một nơi ẩn náu trên đỉnh đồi,\" các Ngài đồng hành lẩm bẩm."
  ep3_travel_events.3010.native_knowledge: "\"Những con người này từ lâu đã học cách ẩn mình trong thời loạn, trước bọn [Glossary( 'ghazis', 'GHAZIS_GLOSS' )], du mục... và có lẽ họ đã nhầm chúng ta là thứ còn tệ hơn: bọn thu thuế đáng ghét.\""
  ep3_travel_events.3010.foreigners: "\"Những dân tộc này từ lâu đã học cách sống sót qua thời loạn bằng cách biến mất. Và có vẻ họ đã nhầm chúng ta là một toán cướp.\""

  GHAZIS_GLOSS: "#bold Ghazis#! là các chiến binh Hồi giáo tham gia những cuộc viễn chinh chống lại người không theo đạo. Trong thời Rashidun Caliphate, các cuộc đột kích #EMP ghazi#! vào Anatolia diễn ra với quy mô và tần suất hủy diệt."


  ep3_travel_events.3010.a: "Lục soát nhà cửa của chúng, không ai ngăn cản cả!"
  ep3_travel_events.3010.a.flavor: "Có khi còn sót lại vài món lặt vặt; có khi dắt đi được mấy con dê lạc! Dù sao thì cũng chẳng có ai ở đây để nhìn thấy."

  ep3_travel_events.3010.b: "Ta sẽ buộc họ phải ra mặt: chúng ta cần người am hiểu địa phương."
  ep3_travel_events.3010.b.flavor: "Có chút hiếu khách thì tốt; có một người dẫn đường bản xứ đưa ta băng qua vùng đất khắc nghiệt này thì càng hay."

  ep3_travel_events.3010.c: "Sự tĩnh lặng này... cũng khá dễ chịu."
  ep3_travel_events.3010.c_fairy_towers: "Kỳ lạ, bao la, tĩnh mịch... nhưng đẹp."
  ep3_travel_events.3010.c.flavor: "Không dân đen nhốn nháo, không gia súc ồn ào... giá mà cả thế gian đều như vậy."

  ep3_travel_events.3010.a_success: "Ngài vớ được vài món đồ giá trị bị bỏ quên"
  ep3_travel_events.3010.a_failure: "Ngài không tìm thấy thứ gì đáng lấy"
  ep3_travel_events.3010.b_success: "Ngài tìm được và đảm bảo sự trợ giúp của người địa phương"
