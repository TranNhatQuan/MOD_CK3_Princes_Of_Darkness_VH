  ep3_refreshed_and_relaxed_desc: "Nhân vật này hiểu được giá trị của việc thỉnh thoảng gạt bỏ muộn phiền và làm mới tinh thần của bản thân.\n\n#weak [modifier|E] này cho phép thực hiện [decision|E] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName].#!"

  ep3_pushed_too_hard: "Quá Sức"
  ep3_pushed_too_hard_desc: "Nhân vật này đã ép bản thân quá mức để đạt được mục tiêu, và vì thế đang ở trong trạng thái mong manh hơn."

  ep3_star_crossed_modifier: "Duyên Phận Nghiệt Ngã"
  ep3_star_crossed_modifier_desc: "Nhân vật này đau đáu vì một mối tình đã mất, vĩnh viễn không thể tìm lại."

  ep3_reunited_modifier: "Tái Ngộ"
  ep3_reunited_modifier_desc: "Nhân vật này đã được đoàn tụ với một mối tình xưa, trong niềm hân hoan."

  ep3_famous_connections_modifier: "Quan Hệ Danh Giá"
  ep3_famous_connections_modifier_desc: "Nhân vật này có những người Ngài nổi tiếng và khéo léo tận dụng danh tiếng của họ một cách thận trọng."

  ep3_quality_control_modifier: "Kiểm Soát Chất Lượng"
  ep3_quality_control_modifier_desc: "Nhân vật này duy trì sự kiểm soát nghiêm ngặt đối với các tác phẩm của mình.\n\n#weak [modifier|E] này tăng lượng [gold_i][gold|E] tối thiểu có thể nhận được từ [decision|E] [GetDecisionWithKey('write_muwashshah_poem_decision').GetName].#!\n\n"

  ep3_power_couple_modifier: "Mối Quan Hệ Cộng Sinh"
  ep3_power_couple_modifier_desc: "Nhân vật này có mối quan hệ khăng khít với một người khác, hỗ trợ công việc của nhau và gia tăng danh tiếng.\n\n#weak [modifier|E] này tăng cơ hội các Nhà Thơ cấp cao hơn xuất hiện từ [decision|E] [GetDecisionWithKey('invite_poets_decision').GetName], đồng thời giảm chi phí của [decision|E] [GetDecisionWithKey('found_salon_decision').GetName].#!\n\n"

  ep3_founded_salon_modifier: "Thành Lập Salon"
  ep3_founded_salon_modifier_desc: "Nhân vật này đã thành lập một salon thơ ca thường trực, tạo dựng một trung tâm nghệ thuật cho nhiều thế hệ sau."

  ep3_poets_salon_modifier: "Salon Thơ Ca"
  ep3_poets_salon_modifier_desc: "Tỉnh này là nơi đặt một salon thơ ca, một trung tâm nghệ thuật được biết đến rộng rãi."

  ep3_friend_to_orphans: "Bằng Hữu của Trẻ Mồ Côi"
  ep3_friend_to_orphans_desc: "Nhân vật này được biết đến rộng rãi và ca ngợi vì công việc bảo vệ và nuôi dưỡng những trẻ mồ côi dễ bị tổn thương."

  ep3_healthy_orphanages_modifier: "Trại Trẻ Mồ Côi Lành Mạnh"
  ep3_healthy_orphanages_modifier_desc: "Hạt này có các trại trẻ mồ côi được tài trợ đầy đủ, đảm bảo những người bị bỏ rơi được chăm sóc chu đáo."

  ep3_tutoring_noblewoman_modifier: "Dạy Kèm Nữ Quý Tộc"
  ep3_tutoring_noblewoman_modifier_desc: "Nhân vật này nhận tiền để dạy kèm một nữ quý tộc địa phương, điều này tất nhiên đã làm giảm quỹ thời gian cho các công việc khác."

  ep3_focused_on_studies_modifier: "Chuyên Tâm Học Tập"
  ep3_focused_on_studies_modifier_desc: "Nhân vật này đã tăng gấp đôi nỗ lực trong việc học tập.\n\n#weak [modifier|E] này tăng lượng [prestige_i][prestige|E] tối đa có thể nhận được từ [decision|E] [GetDecisionWithKey('write_muwashshah_poem_decision').GetName].#!\n\n"

  ep3_efforts_recognized_modifier: "Công Lao Được Ghi Nhận"
  ep3_efforts_recognized_modifier_desc: "Những nỗ lực trong việc cai trị hiệu quả của nhân vật này đã được chủ quân của họ công khai ghi nhận và ca ngợi."
  ep3_publicly_recognized_modifier: "Được Công Khai Công Nhận"
  ep3_publicly_recognized_modifier_desc: "Nhân vật này đã được công khai công nhận là một thành viên có giá trị trong bộ máy hành chính."

  ep3_supply_issues_modifier: "Vấn Đề Tiếp Tế"
  ep3_supply_issues_modifier_desc: "Do gặp khó khăn trong việc tìm kiếm lương thực, doanh trại của nhân vật này đang chịu cảnh bụng đói và sự bất mãn từ những người theo hầu."

  ep3_priest_friend_same_modifier: "Bằng Hữu của Người Sùng Đạo"
  ep3_priest_friend_same_modifier_desc: "Nhân vật này nổi tiếng là bằng hữu của những người mộ đạo."
  ep3_priest_friend_different_modifier: "Bằng Hữu của Mọi Người Sùng Đạo"
  ep3_priest_friend_different_modifier_desc: "Nhân vật này nổi tiếng là bằng hữu của những người mộ đạo, dù không phải lúc nào cũng cùng một đức tin..."
  ep3_inflexible_worshipper_modifier: "Tín Đồ Bảo Thủ"
  ep3_inflexible_worshipper_modifier_desc: "Nhân vật này kiên định tuyệt đối với niềm tin của mình và không dung thứ cho kẻ dị giáo."
  ep3_ungodly_hospitality_modifier: "Hiếu Khách Vô Thần"
  ep3_ungodly_hospitality_modifier_desc: "Nhân vật này đã quay lưng với những người sùng đạo, từ chối cho họ sự tiếp đón khi họ cần giúp đỡ."
  ep3_rested_and_refreshed_modifier: "Nghỉ Ngơi và Hồi Phục"
  ep3_rested_and_refreshed_modifier_desc: "Nhân vật này đã được hưởng lợi từ vài đêm nghỉ ngơi trong điều kiện tiện nghi hơn so với thường lệ."
  ep3_cricked_neck_modifier: "Cứng Cổ"
  ep3_cricked_neck_modifier_desc: "Nhân vật này đang bị đau nhói ở cổ."
  ep3_friend_to_old_soldiers_modifier: "Bằng Hữu của Cựu Binh"
  ep3_friend_to_old_soldiers_modifier_desc: "Nhân vật này được các cựu binh biết đến rộng rãi như một người cảm thông với sự nghiệp của họ.\n\n#weak [modifier|E] này bỏ qua các yêu cầu của tùy chọn Ép Tuyển Lính Đánh Thuê trong [interaction|E] $reinforce_soldiers_interaction$.#!"

  ep3_expanded_culinary_horizons_modifier: "Mở Rộng Khẩu Vị Ẩm Thực"
  ep3_expanded_culinary_horizons_modifier_desc: "Gần đây nhân vật này đã cải thiện cách nhìn về những món ăn xa lạ, dẫn đến một khẩu vị phong phú hơn nhiều."
  ep3_new_tastes_modifier: "Hương Vị Mới"
  ep3_new_tastes_modifier_desc: "Gần đây nhân vật này được hưởng lợi từ một chế độ ăn đa dạng hơn, xoa dịu cả tinh thần lẫn thể chất."
  ep3_new_tastes_cannibal_modifier: "Hương Vị 'Mới'"
  ep3_new_tastes_cannibal_modifier_desc: "Nhân vật này khăng khăng dọn lên bàn những món ăn đầy nghi vấn. Vậy thì #EMP đó là#! thịt gì...?"
  ep3_lust_for_land_modifier: "Khát Vọng Đất Đai"
  ep3_lust_for_land_modifier_desc: "Nhân vật này sẵn sàng làm mọi thứ để có được lãnh địa.\n\n#weak [modifier|E] này giảm một nửa chi phí của [casus_belli|E] $EP3_LAAMP_INVASION_CB_NAME$.\n#!"
  ep3_comfortable_bed_modifier: "Tiện Nghi Thoải Mái"
  ep3_comfortable_bed_modifier_desc: "Nhân vật này đã được hưởng lợi từ điều kiện sinh hoạt thoải mái hơn bình thường."
  ep3_well_guided_modifier: "Được Chỉ Dẫn Tốt"
  ep3_well_guided_modifier_desc: "Nhân vật này có khiếu lựa chọn những người dẫn đường địa phương giỏi để đưa họ băng qua địa hình hiểm trở."
  ep3_sketchy_guides_modifier: "Hướng Dẫn Mơ Hồ"
  ep3_sketchy_guides_modifier_desc: "Nhân vật này dường như liên tục chọn phải những người dẫn đường cung cấp thông tin sai lệch, dù là do vô tình hay đơn thuần là xui xẻo."
  ep3_master_of_ceremonies: "Chủ Trì Lễ Hội"
  ep3_master_of_ceremonies_desc: "Nhân vật này đã chứng tỏ mình là một tay vui chơi thực thụ tại một Buổi Vui Chơi Doanh Trại!"

  ep3_uneasy_modifier: "Bất An"
  ep3_uneasy_modifier_desc: "Nhân vật này cảm thấy một nỗi bất an mơ hồ và điềm báo chẳng lành."

  ep3_sensible_provisions: "Quản Lý Lương Thực Hợp Lý"
  ep3_sensible_provisions_desc: "Nhân vật này không để bản thân bị cuốn vào việc phung phí lương thực một cách vô ích."

  ep3_life_of_the_party: "Linh Hồn Bữa Tiệc"
  ep3_life_of_the_party_desc: "Nhân vật này là kẻ khuyến khích việc ăn chơi tiệc tùng!"

  ep3_warm_and_content: "Ấm Áp và Mãn Nguyện"
  ep3_warm_and_content_desc: "Nhân vật này đang đắm mình trong dư âm dễ chịu của khoảng thời gian bên Bạn Bè thân thiện và bếp lửa hồng."

  ep3_responsible_with_money: "Chi Tiêu Có Trách Nhiệm"
  ep3_responsible_with_money_desc: "Ngay cả khi tinh thần có phần không ổn định, nhân vật này vẫn giữ chặt hầu bao."

  ep3_foreign_affairs_modifier: "Quan Tâm Ngoại Vụ"
  ep3_foreign_affairs_modifier_desc: "Nhân vật này luôn theo dõi sát sao tình hình bên ngoài, doanh trại được chuẩn bị đầy đủ và sẵn sàng di chuyển bất cứ lúc nào."

  ep3_the_restful_modifier: "An Nhàn"
  ep3_the_restful_modifier_desc: "Nhân vật này đã quay lưng với định mệnh của mình, dẫn đến một cuộc đời yên bình nhưng không trọn vẹn."

  ep3_harried_modifier: "Bị Đàn Áp"
  ep3_harried_modifier_desc: "Điền trang này đã phải chịu ách thống trị của người Norman, cư dân bất ổn của nó phải gánh chịu một cuộc trấn áp tàn nhẫn từ các nhà cai trị."

  ep3_the_conqueror_modifier: "Kẻ Chinh Phục Tàn Bạo"
  ep3_the_conqueror_modifier_desc: "Những biện pháp trả đũa tàn khốc của nhân vật này đối với các cuộc nổi dậy trên khắp lãnh thổ đã gây ra sự kính nể, sợ hãi và căm ghét ngang nhau."
  anglo_saxon_opinion: "Thiện Cảm Anglo-Saxon"

  ep3_dangerous_fenland_modifier: "Đầm Lầy Nguy Hiểm"
  ep3_dangerous_fenland_modifier_desc: "Các đầm lầy của tỉnh này đang bị một bóng hình bí ẩn rình rập, gây nên sự lo lắng lan rộng."

  ep3_plundered_modifier: "Bị Cướp Phá"
  ep3_plundered_modifier_desc: "Tỉnh này đã chứng kiến một loạt vụ cướp bóc bạo lực, khiến của cải dần bị rút cạn."

  ep3_hereward_caution_modifier: "Tổ Chức Thận Trọng"
  ep3_hereward_caution_modifier_desc: "Nhân vật này luôn dành thời gian chuẩn bị, đảm bảo có được những gì tốt nhất trước khi hành động."

  ep3_gnr_guards_modifier: "Con Đường Được Bảo Vệ"
  ep3_gnr_guards_modifier_desc: "Hạt này có các đoạn của Đại Lộ Bắc, mới được tái thiết và được lính vũ trang tuần tra."

  ep3_gnr_modifier: "Con Đường Được Tái Thiết"
  ep3_gnr_modifier_desc: "Hạt này có các đoạn của Đại Lộ Bắc vừa được trùng tu."

  ep3_gnr_negative_modifier: "Con Đường Bị Phá Hủy"
  ep3_gnr_negative_modifier_desc: "Các đoạn Đại Lộ Bắc trong hạt này đã bị cố ý phá hủy nhằm cản trở hoạt động quân sự và gây phẫn nộ cho dân địa phương."

  ep3_honourable_jailor_modifier: "Ngục Cai Danh Dự"
  ep3_honourable_jailor_modifier_desc: "Cách tiếp cận của nhân vật này trong việc giam giữ tù nhân được ca ngợi là đúng quy chuẩn và đầy danh dự."

  all_crops_burned: "Lương Thực Bị Thiêu Hủy"
  all_crops_burned_desc: "Toàn bộ lương thực của hạt này đã bị thiêu hủy và mọi gia súc bị giết trước để trừng phạt."

  crops_burned: "Mùa Màng Bị Đốt"
  crops_burned_desc: "Phần lớn mùa màng của hạt này đã bị đốt trong một chiến dịch trừng phạt."

  crop_levy: "Thuế Lương Thực"
  crop_levy_desc: "Hạt này bị buộc phải nộp thêm thuế ngũ cốc, làm mất ổn định nguồn lương thực."

  ep3_resettled_village: "Khu Dân Cư Bị Tái Định Cư"
  ep3_resettled_village_desc: "Nhiều cư dân của điền trang này đã bị cưỡng bức di dời sang nơi khác, khiến nó trở nên hoang vắng."

  ep3_population_boost: "Gia Tăng Dân Số"
  ep3_population_boost_desc: "Điền trang này đã tiếp nhận một lượng người bị cưỡng bức di dời từ nơi lân cận, dù tâm trạng của họ chẳng mấy tích cực."

  ep3_smouldering_village: "Công Trình Âm Ỉ"
  ep3_smouldering_village_desc: "Các công trình trong điền trang này đã chịu thiệt hại do một trận hỏa hoạn quét qua, gây tổn hại cả hạ tầng lẫn tinh thần."

  ep3_church_bereft: "Nhà Thờ Bị Tước Đoạt"
  ep3_church_bereft_desc: "Điền trang này đã bị đánh cắp các thánh tích quý giá, gây tổn hại cho giáo hội và khiến dân địa phương phẫn nộ."

  ep3_man_of_god: "Người của Chúa"
  ep3_man_of_god_desc: "Nhân vật này là bằng hữu của các giáo sĩ, và sự thánh thiện của ông được ca tụng khắp vùng đất."

  ep3_missing_supplies: "Thất Lạc Quân Nhu"
  ep3_missing_supplies_desc: "Hạt này đã làm thất lạc một chuyến hàng lớn vũ khí và áo giáp, khiến chất lượng quân đội bị ảnh hưởng."

  ep3_redistributed_equipment: "Trang Bị Được Phân Phối Lại"
  ep3_redistributed_equipment_desc: "Nhân vật này hưởng lợi từ một lượng vũ khí và áo giáp chất lượng cao nhưng có nguồn gốc bất chính."

  ep3_stolen_equipment: "Trang Bị Đánh Cắp"
  ep3_stolen_equipment_desc: "Nhân vật này đã chiếm dụng các vũ khí và áo giáp bị đánh cắp và đang sử dụng chúng hiệu quả."

  ep3_sabotaged_roads: "Đường Sá Bị Phá Hoại"
  ep3_sabotaged_roads_desc: "Đường sá trong điền trang này đã bị phá hoại, khiến việc đi lại trở nên nguy hiểm hơn."

  ep3_delayed_supplies: "Quân Nhu Bị Trì Hoãn"
  ep3_delayed_supplies_desc: "Một chuyến hàng lớn vũ khí và áo giáp của hạt này đã bị trì hoãn, khiến chất lượng quân đội bị ảnh hưởng."

  ep3_defender_of_families: "Người Bảo Vệ Gia Đình"
  ep3_defender_of_families_desc: "Nhân vật này nổi tiếng vì nỗ lực giữ gìn các gia đình được toàn vẹn và hạnh phúc."

  ep3_paid_grains: "Nhập Khẩu Ngũ Cốc"
  ep3_paid_grains_desc: "Hạt này đã được hưởng lợi từ ngũ cốc nhập khẩu, làm dịu đi nạn đói đang manh nha."

  ep3_innovative_farming_techniques: "Kỹ Thuật Canh Tác Đổi Mới"
  ep3_innovative_farming_techniques_desc: ""Hạt này hưởng lợi từ các kỹ thuật canh tác tiên tiến vượt trội, nâng cao hiệu quả sản xuất lương thực."

  ep3_surplus_manpower: "Dư Thừa Nhân Lực"
  ep3_surplus_manpower_desc: "Hạt này có dư thừa nông dân khỏe mạnh trong độ tuổi chiến đấu."

  ep3_counties_restless_modifier: "Bất Ổn"
  ep3_counties_restless_modifier_desc: "Hạt này đã bị kích động đến trạng thái phẫn nộ và bất an trước các kẻ thống trị Norman mới."

  ep3_murderers_loose: "Hung Thủ Lộng Hành"
  ep3_murderers_loose_desc: "Hạt này đã xảy ra hàng loạt vụ giết người. Kỳ lạ thay, tất cả nạn nhân đều là người Norman..."

  ep3_unlocked_silk: "Quyền Sản Xuất Tơ Lụa"
  ep3_unlocked_silk_desc: "Gia tộc này đã nhận được sắc lệnh hoàng gia cho phép tự sản xuất tơ lụa."
  improve_de_jure_integration_modifier: "Thúc Đẩy Hội Nhập Pháp Lý"
  improve_de_jure_integration_modifier_desc: "Một lãnh chúa địa phương đang đầu tư nguồn lực lớn để hỗ trợ việc hội nhập danh hiệu này vào lãnh địa của chủ quân.\nThưởng cho [councillor_task|E] [integrate_title]."
  improve_promote_culture_modifier: "Thúc Đẩy Hội Nhập Văn Hóa"
  improve_promote_culture_modifier_desc: "Một lãnh chúa địa phương đang đầu tư nguồn lực lớn để hỗ trợ việc chuyển đổi văn hóa của hạt này sang văn hóa của chủ quân.\nThưởng cho [councillor_task|E] [promote_culture|E]."
  ep3_integration_promoter_modifier: "Người Thúc Đẩy Hội Nhập"
  ep3_integration_promoter_modifier_desc: "Nhân vật này rất tích cực trong việc thúc đẩy hội nhập khu vực xung quanh điền trang của mình.\nTăng [candidate_score|E] cho chức [governorship|E] tại nơi có [family_estate|E]."

  hostile_schemes_distracted_modifier: "Xao Nhãng Khỏi Âm Mưu Thù Địch"
  hostile_schemes_distracted_modifier_desc: "Gia chủ của nhân vật này đã yêu cầu họ hợp tác trong các âm mưu riêng của mình, qua đó chiếm trọn sự tập trung và kỹ năng của nhân vật.\nPhạt đến [hostile_scheme|E] [success_chance|E]."
  personal_schemes_distracted_modifier: "Xao Nhãng Khỏi Âm Mưu Cá Nhân"
  personal_schemes_distracted_modifier_desc: "Gia chủ của nhân vật này đã yêu cầu họ hợp tác trong các âm mưu riêng của mình, qua đó chiếm trọn sự tập trung và kỹ năng của nhân vật.\nPhạt đến [personal_scheme|E] [success_chance|E]."
