  estate_supporting_buildings_modifier_desc: "Nhân vật này đã nhận được sự hỗ trợ vật chất từ các thành viên khác trong gia tộc để phát triển điền trang gia đình."

  ep3_standing_alone_modifier: "Đứng Một Mình"
  ep3_standing_alone_modifier_desc: "Nhân vật này quyết tâm bảo vệ niềm tin của mình, ngay cả khi không có ai đứng về phía họ."

  ep3_disgruntled_vassals_modifier: "Chư Hầu Bất Mãn"
  ep3_disgruntled_vassals_modifier_desc: "Các chư hầu của nhân vật này liên tục càu nhàu và âm mưu, sự bất mãn của họ càng kích động lẫn nhau.\n\n#weak [modifier|E] này làm tăng khả năng chư hầu gia nhập [claimant_factions|E].\n#!"

  ep3_life_threatened_modifier: "Bị Đe Dọa Tính Mạng"
  ep3_life_threatened_modifier_desc: "Nhân vật này không chỉ nghĩ — họ #EMP biết#! rằng có kẻ đang muốn hại mình. Các chư hầu tỏ ra chẳng mấy ấn tượng với sự lo sợ này.\n\n#weak [modifier|E] này làm tăng khả năng chư hầu gia nhập [claimant_factions|E].\n#!"

  ep3_impassioned_populace_modifier: "Dân Chúng Sục Sôi"
