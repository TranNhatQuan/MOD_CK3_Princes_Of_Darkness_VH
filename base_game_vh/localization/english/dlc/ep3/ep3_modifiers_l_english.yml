l_english:

  ep3_restored_pentarchy_seat_county_modifier: "Khôi phục Tòa Thượng phụ Ngũ đại"
  ep3_restored_pentarchy_seat_county_modifier_desc: "Hạt này một lần nữa trở thành một Tòa Thượng phụ trong Ngũ đại Thượng phụ."
  ep3_restored_pentarchy_seat_modifier: "$ep3_restored_pentarchy_seat_county_modifier$"
  ep3_restored_pentarchy_seat_modifier_desc: "Nhân vật này đã tái chiếm một Tòa Thượng phụ Ngũ đại cho Đế quốc."
  ep3_maximum_border_county_modifier: "Khôi phục Biên cương Tận cùng"
  ep3_maximum_border_county_modifier_desc: "Biên giới xa nhất của Đế quốc La Mã đã được tái lập."
  ep3_maximum_border_modifier: "$ep3_maximum_border_county_modifier$"
  ep3_maximum_border_modifier_desc: "Nhân vật này đã khôi phục biên cương xa nhất của Đế quốc La Mã."
  ep3_new_justinian_county_modifier: "Khôi phục Tỉnh của Justinianus"
  ep3_new_justinian_county_modifier_desc: "Hạt này, từng bị quân đội của Justinianus chinh phục, nay đã một lần nữa trở về với Đế quốc La Mã."
  ep3_new_justinian_modifier: "$ep3_new_justinian_county_modifier$"
  ep3_new_justinian_modifier_desc: "Nhân vật này là một Justinianus Mới, tái chinh phục các tỉnh miền Tây."
  ep3_western_tetrarch_county_modifier: "Khôi phục Tòa Tứ đầu chế"
  ep3_western_tetrarch_county_modifier_desc: "Tòa trấn cổ xưa của một Tứ đầu chế La Mã đã được Đế quốc tái chiếm."
  ep3_western_tetrarch_modifier: "$ep3_western_tetrarch_county_modifier$"
  ep3_western_tetrarch_modifier_desc: "Nhân vật này đã tái thống nhất tòa trấn cổ của một Tứ đầu chế La Mã vào Đế quốc."
  ep3_long_lost_province_county_modifier: "Khôi phục Tỉnh thất lạc từ lâu"
  ep3_long_lost_province_county_modifier_desc: "Vùng đất này, đã thất lạc khỏi tay người La Mã từ rất lâu, nay đã được trả về cho Đế quốc."
  ep3_long_lost_province_modifier: "$ep3_long_lost_province_county_modifier$"
  ep3_long_lost_province_modifier_desc: "Nhân vật này đã tái chiếm một tỉnh La Mã bị thất lạc khỏi Đế quốc từ lâu."
  ep3_long_contested_province_county_modifier: "Khôi phục Tỉnh tranh chấp lâu dài"
  ep3_long_contested_province_county_modifier_desc: "Hạt này, nằm ngoài tầm kiểm soát của Đế quốc trong thời gian quá dài, nay đã được tái chiếm."
  ep3_long_contested_province_modifier: "$ep3_long_contested_province_county_modifier$"
  ep3_long_contested_province_modifier_desc: "Nhân vật này đã củng cố biên giới Đế quốc bằng cách tái chiếm một vùng đất tranh chấp lâu năm."
  ep3_medi_gem_county_modifier: "Khôi phục Viên ngọc Địa Trung Hải"
  ep3_medi_gem_county_modifier_desc: "Bàn đạp quý giá này tại Địa Trung Hải một lần nữa trở thành một phần của Đế quốc."
  ep3_medi_gem_modifier: "$ep3_medi_gem_county_modifier$"
  ep3_medi_gem_modifier_desc: "Nhân vật này đã bảo toàn một bàn đạp La Mã cổ tại Địa Trung Hải."
  ep3_politics_before_all_modifier: "Chính trị trên hết"
  ep3_politics_before_all_modifier_desc: "Nhân vật này có cách tiếp cận chính trị thực dụng, phớt lờ cảm xúc và định kiến văn hóa."
  ep3_everything_for_byz_modifier: "Hy sinh vì Dân tộc"
  ep3_everything_for_byz_modifier_desc: "Nhân vật này chấp nhận dung thứ cho #EMP man di#! như một sự hy sinh vì lợi ích của thần dân."
  ep3_triumph_of_god_modifier: "Chiến thắng dâng lên Thần linh"
  ep3_triumph_of_god_modifier_desc: "Nhân vật này đã dâng chiến thắng của mình lên Thần linh, cùng chia sẻ vinh quang với Đấng Thiêng liêng."
  ep3_blessed_in_triumph_modifier: "Chiến thắng được ban phước"
  ep3_triumph_traditional_punishments_modifier: "Duy trì Hình phạt Truyền thống"
  ep3_triumph_traditional_punishments_modifier_desc: "Làm mù kẻ thù bị bắt, quân nổi loạn và kẻ tranh ngôi là một truyền thống lâu đời của Byzantine — và nhân vật này hiểu rõ điều đó."
  ep3_blessed_in_triumph_modifier_desc: "Chiến thắng của nhân vật này đã được giáo quyền ban phước."
  ep3_triumph_public_executioner_modifier: "Hành hình Công khai"
  ep3_triumph_public_executioner_modifier_desc: "Nhân vật này biết cách duy trì trật tự công cộng: biến các cuộc xử tử hàng loạt thành một màn thị uy."
  ep3_triumph_promised_victories_modifier: "Hứa hẹn Chiến thắng"
  ep3_triumph_promised_victories_modifier_desc: "Nhân vật này đã khơi dậy trí tưởng tượng của thần dân bằng những lời hứa về chiến thắng quân sự."
  ep3_triumph_promised_stability_modifier: "Hứa hẹn Ổn định"
  ep3_triumph_promised_stability_modifier_desc: "Nhân vật này đã khơi dậy trí tưởng tượng của thần dân bằng những lời hứa về sự ổn định của Đế quốc."
  ep3_triumph_promised_prosperity_modifier: "Hứa hẹn Thịnh vượng"
  ep3_triumph_promised_prosperity_modifier_desc: "Nhân vật này đã khơi dậy trí tưởng tượng của thần dân bằng những lời hứa về sự thịnh vượng của Đế quốc."
  ep3_voluntary_laamp_character_modifier: "Nhà Phiêu lưu Tự nguyện"
  ep3_voluntary_laamp_character_modifier_desc: "Nhân vật này đã rời bỏ lãnh địa cũ để tự tay tạo dựng một chỗ đứng mới trên thế giới."
  ep3_emperor_proving_themselves_modifier: "Chứng minh Giá trị Bản thân"
  ep3_emperor_proving_themselves_modifier_desc: "Nhân vật này đã thề sẽ chứng minh bản thân xứng đáng là một quân chủ hợp pháp."
  ep3_blessed_union_modifier: "Hôn nhân được Ban phước"
  ep3_blessed_union_modifier_desc: "Giáo chủ của đức tin đã phê chuẩn cuộc hôn nhân gần nhất của nhân vật này."
  ep3_non_blessed_union_modifier: "Hôn nhân Bất hợp pháp"
  ep3_non_blessed_union_modifier_desc: "Giáo chủ của đức tin đã từ chối hợp pháp hóa cuộc hôn nhân gần nhất của nhân vật này."
  ep3_ennobled_adventurer_modifier_1: "Nhà Phiêu lưu được Phong tước"
  ep3_ennobled_adventurer_modifier_1_desc: "Nhân vật này đã được nâng lên hàng quý tộc từ xuất thân thấp kém, làm lung lay các trật tự cổ xưa."
  ep3_ennobled_adventurer_modifier_2: "$ep3_ennobled_adventurer_modifier_1$"
  ep3_ennobled_adventurer_modifier_2_desc: "$ep3_ennobled_adventurer_modifier_1_desc$"
  ep3_ennobled_adventurer_modifier_3: "$ep3_ennobled_adventurer_modifier_1$"
  ep3_ennobled_adventurer_modifier_3_desc: "$ep3_ennobled_adventurer_modifier_1_desc$"
  ep3_century_celebration_county_modifier: "Lễ kỷ niệm Trăm năm Lịch sử"
  ep3_century_celebration_county_modifier_desc: "Hạt này đang tổ chức lễ kỷ niệm tròn một thế kỷ kể từ ngày Constantinople được thành lập."
  ep3_foundation_celebration_county_modifier: "Lễ kỷ niệm Lịch sử"
  ep3_foundation_celebration_county_modifier_desc: "Hạt này đang tổ chức lễ kỷ niệm ngày thành lập Constantinople."
  ep3_exotic_giraffe_modifier: "Hươu cao cổ Ngoại lai"
  ep3_exotic_giraffe_modifier_desc: "Nhân vật này đã nhận được hàng hóa và động vật ngoại lai — bao gồm cả một con hươu cao cổ — từ một phái đoàn ngoại giao."
  ep3_estate_hired_agents_modifier: "Thuê Đặc vụ"
  ep3_estate_hired_agents_modifier_desc: "Nhân vật này đã thuê một số đặc vụ để hỗ trợ thực hiện các mục tiêu của mình."
  ep3_estate_bolster_security_modifier: "Tăng cường An ninh"
  ep3_estate_bolster_security_modifier_desc: "Nhân vật này đã bao quanh bản thân và điền trang bằng nhiều lính canh nhằm bảo vệ khỏi nguy hiểm."
  ep3_estate_governor_patrols_modifier: "Tuần tra Thường xuyên"
  ep3_estate_governor_patrols_modifier_desc: "Tổng đốc của hạt này đã tổ chức các cuộc tuần tra thường xuyên, sẵn sàng can thiệp bất cứ lúc nào."
  ep3_estate_granary_modifier: "Thao túng Thị trường Ngũ cốc"
  ep3_estate_granary_modifier_desc: "Nhân vật này đang sử dụng những biện pháp mờ ám để thao túng thị trường ngũ cốc, bán lương thực với giá #EMP cắt cổ#!."
  ep3_eparch_county_opinion_modifier: "Xoa dịu Dân chúng"
  ep3_eparch_county_opinion_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] đang nỗ lực xoa dịu người dân."
  ep3_eparch_troops_modifier: "Tổ chức Quân đội"
  ep3_eparch_troops_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] đích thân giám sát lực lượng đồn trú tại thủ đô."
  ep3_eparch_control_modifier: "Thiết lập Trật tự Công cộng"
  ep3_eparch_control_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] đã cho binh lính tuần hành khắp các đường phố thủ đô để đảm bảo trật tự."
  ep3_eparch_development_modifier: "Thúc đẩy Phát triển"
  ep3_eparch_development_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] huy động cả một đội ngũ quản lý và thư lại để cải thiện hạ tầng và phát triển thành phố."
  ep3_eparch_fortified_capital_modifier: "Công sự Ấn tượng"
  ep3_eparch_fortified_capital_modifier_desc: "Thành trì này được quản lý tốt và sở hữu hệ thống phòng thủ ấn tượng, đủ sức đẩy lùi bất kỳ kẻ tấn công nào."
  ep3_eparch_somewhat_fortified_capital_modifier: "Công sự Cải tiến"
  ep3_eparch_somewhat_fortified_capital_modifier_desc: "Người quản lý đã thực hiện một số cải tiến tổng quát đối với hệ thống phòng thủ."
  ep3_eparch_plague_protection_modifier: "Tổ chức Y sĩ"
  ep3_eparch_plague_protection_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] đã tổ chức toàn bộ y sĩ sẵn có thành một lực lượng hiệu quả."
  ep3_eparch_physician_at_work_modifier: "Ngự y Trưởng Chống Dịch"
  ep3_eparch_physician_at_work_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] và [GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()] riêng của họ đang chống dịch và cứu chữa bệnh nhân."
  ep3_eparch_university_influence_modifier: "Quan hệ tại Đại học"
  ep3_eparch_university_influence_modifier_desc: "Gia tộc này đã thiết lập những mối quan hệ có ảnh hưởng tại đại học của thủ đô.\n#high Gửi đi Học đại học#! Chi phí giáo dục: [gold_i]#P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#!"
  scheme_slandered_modifier: "Bôi nhọ"
  scheme_slandered_modifier_desc: "Danh tiếng công khai của nhân vật này — cũng như độ tín nhiệm khi giữ chức vụ — đã bị hủy hoại bởi làn sóng vu khống.\n$EFFECT_LIST_BULLET$ $scheme_slandered_candidacy_appointment_tt$\n$EFFECT_LIST_BULLET$ $scheme_slandered_candidacy_acclamation_tt$\n$EFFECT_LIST_BULLET$ [governor_efficiency|E]: [governor_efficiency_i]#N [EmptyScope.ScriptValue('efficiency_slandered_value')|0]%#!"
  scheme_promoted_modifier: "Được Quảng bá"
  scheme_promoted_modifier_desc: "Ứng cử của nhân vật này đã được thúc đẩy nhờ một chiến dịch quảng bá thành công.\n$EFFECT_LIST_BULLET$ $scheme_promoted_candidacy_appointment_tt$\n$EFFECT_LIST_BULLET$ $scheme_promoted_candidacy_acclamation_tt$"
  admin_emperor_scheme_modifier: "Hoàng đế Hành chính"
  admin_dominant_family_scheme_modifier: "$game_concept_dominant_family$"
  admin_powerful_family_scheme_modifier: "$game_concept_powerful_family$"
  admin_target_emperor_scheme_modifier: "Hoàng đế Hành chính"
  admin_target_dominant_family_scheme_modifier: "$game_concept_dominant_family$"
  admin_target_powerful_family_scheme_modifier: "$game_concept_powerful_family$"
  ep3_school_building_county_modifier: "Xây dựng Trường học"
  ep3_school_building_county_modifier_desc: "Người cai trị hạt này đã chuyển hướng một phần sản xuất để xây dựng trường học cho dân thường."
  ep3_grammar_school_county_modifier: "Trường học cho Dân chúng"
  ep3_grammar_school_county_modifier_desc: "Người cai trị hạt này đã đầu tư vào một trường học dành cho dân thường."
  defender_of_values_modifier: "Người Bảo vệ Giá trị Truyền thống"
  defender_of_values_modifier_desc: "Nhân vật này đã từ chối ảnh hưởng tha hóa của lối sống xa hoa từ những người Hy Lạp suy đồi."
  ep3_mercenaries_abroad_modifier: "Hứa điều Quân ở Nước ngoài"
  ep3_mercenaries_abroad_modifier_desc: "Nhân vật này đã hứa cho quân đội phục vụ một quân chủ khác để đổi lấy tự do."
  ep3_mercenaries_from_abroad_modifier: "Quân đội từ Nước ngoài"
  ep3_mercenaries_from_abroad_modifier_desc: "Nhân vật này đang nhận quân đội từ một quân chủ mà họ đã thả khỏi ngục."
  ep3_bought_the_purple_modifier: "Mua Quyền Mặc Tử bào"
  ep3_bought_the_purple_modifier_desc: "Nhân vật này đã mua quyền được mặc y phục màu tím — một đặc quyền vốn chỉ dành riêng cho hoàng đế."
  ep3_development_sacrifice_modifier: "Hy sinh vì Đế quốc"
  ep3_development_sacrifice_modifier_desc: "Hạt này đã bị buộc phải điều động nhân lực về thủ đô."
  ep3_development_waning_modifier: "Suy kiệt Đế quốc"
  ep3_development_waning_modifier_desc: "Thủ đô của Đế quốc đang oằn mình dưới gánh nặng của những bất hạnh."

  ep3_leviathan_success_character_modifier: "Đánh bại Quái vật"
  ep3_leviathan_success_character_modifier_desc: "Nhân vật này đã hạ gục con quái vật đang tàn phá eo biển Bosporos."
  ep3_leviathan_failure_character_modifier: "Bị Quái vật Đánh bại"
  ep3_leviathan_failure_character_modifier_desc: "Nỗ lực tiêu diệt con quái vật đang tàn phá eo biển Bosporos của nhân vật này đã thất bại thảm hại."
  ep3_leviathan_loose_county_modifier: "Tai họa Eo biển"
  ep3_leviathan_loose_county_modifier_desc: "Hoạt động thương mại của hạt này bị tê liệt bởi con quái vật đang tàn phá eo biển Bosporos."
  ep3_leviathan_mandate_county_modifier: "Bóng ma Eo biển"
  ep3_leviathan_mandate_county_modifier_desc: "Hoạt động thương mại của hạt này bị cản trở phần nào bởi con quái vật đang tàn phá eo biển Bosporos."
  ep3_leviathan_loose_province_modifier: "Tai họa Eo biển"
  ep3_leviathan_loose_province_modifier_desc: "Tuyến đường thủy này trở nên cực kỳ nguy hiểm do con quái vật đang tàn phá eo biển Bosporos."
  ep3_leviathan_mandate_province_modifier: "Bóng ma Eo biển"
  ep3_leviathan_mandate_province_modifier_desc: "Tuyến đường thủy này trở nên nguy hiểm phần nào do con quái vật đang tàn phá eo biển Bosporos."

  ep3_iconoclast_modifier: "Bài trừ Thánh tượng"
  ep3_iconoclast_modifier_desc: "Vị hoàng đế này đã chấp nhận học thuyết bài trừ thánh tượng trong hoàn cảnh vô cùng gian khó."

  ep3_raider_unchecked_modifier: "Hải tặc Không Kiểm soát"
  ep3_raider_unchecked_modifier_desc: "Hạt này bị các toán cướp phương Bắc quấy phá, tàn phá tàu thuyền và cướp bóc ven biển."

  ep3_grave_robber_modifier: "Kẻ Đào mộ"
  ep3_grave_robber_modifier_desc: "Nhân vật này mang tiếng xấu vì cướp phá mộ phần của các hoàng đế tiền nhiệm để trả nợ."
  ep3_imperial_tombs_violated_province_modifier: "Lăng mộ Hoàng đế bị Xâm phạm"
  ep3_imperial_tombs_violated_province_modifier_desc: "Những lăng mộ huy hoàng của các hoàng đế xưa đã bị một kẻ kế vị tham lam cướp phá để trả nợ."
  land_of_holy_county_modifier: "Vùng đất của Thánh nhân"
  land_of_holy_county_modifier_desc: "Một vị thánh chân chính đang sống giữa dân chúng nơi đây."
  no_crooks_county_modifier: "Không Dung thứ Kẻ Lừa đảo"
  no_crooks_county_modifier_desc: "Tổng đốc địa phương đã thực thi chính sách không khoan nhượng với những kẻ giả danh thánh nhân."
  ep3_persecuting_saints_county_modifier: "Thánh nhân Không được Công nhận"
  ep3_persecuting_saints_county_modifier_desc: "Tổng đốc địa phương đã không nhận ra dấu hiệu của một bậc thánh chân chính."
  ep3_conmen_among_us_county_modifier: "Kẻ Lừa đảo Giữa Chúng ta"
