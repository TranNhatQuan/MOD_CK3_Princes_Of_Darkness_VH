l_english:

  ep3_powerful_families.8000.t: "Chốn Quyền Cao"
  ep3_powerful_families.8000.desc: "Hôm nay Ta mở niêm phong một bức thư từ [influential_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)]. Bản chất thấp hèn và thói mưu mô của [influential_family_member.GetHerHis|U] lộ rõ khi [influential_family_member.GetSheHe] đề xuất rằng chúng ta nên lợi dụng vị trí của [influential_family_member.GetHerHis] để tiếp cận và chỉnh sửa các tài liệu thuộc quyền sở hữu của [liege.GetTitleAsNameNoTooltip].\n\nViệc [influential_family_member.GetNamePossessiveNoTooltip|U] được bổ nhiệm vào triều đình của [liege.GetNamePossessive] cho đến nay là một tài sản vô cùng quan trọng trong việc thúc đẩy lợi ích của gia tộc, và dù đề xuất của [influential_family_member.GetHerHis] có thể giúp chúng ta tiến xa hơn, nó cũng có thể khiến [influential_family_member.GetHerHis] mất vị trí này vĩnh viễn..."
  ep3_powerful_families.8000.a: "Một cơ hội thú vị!"
  ep3_powerful_families.8000.a.win: "[influential_family_member.GetFirstNameNoTooltip] thành công"
  ep3_powerful_families.8000.a.lose: "[influential_family_member.GetFirstNameNoTooltip] bị phát hiện"
  ep3_powerful_families.8000.b: "Lục soát kho lưu trữ để tìm bí mật!"
  ep3_powerful_families.8000.b.tt: "[influential_family_member.GetFirstNameNoTooltip] có thể phát hiện bí mật của [liege.GetNamePossessiveNoTooltip]"
  ep3_powerful_families.8000.b.win.secret: "[influential_family_member.GetFirstNameNoTooltip] phát hiện một bí mật"
  ep3_powerful_families.8000.b.win.no_secret: "[influential_family_member.GetFirstNameNoTooltip] không tìm thấy bí mật nào"
  ep3_powerful_families.8000.c: "Cứ làm một  Bề Tôi trung thành."
  ep3_powerful_families.8010.t: "[liege.GetTitleAsNameNoTooltip|U] Lâm Nguy"
  ep3_powerful_families.8010.desc: "Cuộc chiến [war.GetName|U] vẫn đang tiếp diễn, và sau hàng loạt trận đánh cùng các cuộc vây hãm thất bại, [liege.GetName] rõ ràng đã rơi vào thế bất lợi. Trên khắp [liege.GetPrimaryTitle.GetName], các gia tộc có thế lực và triều thần thì thầm, âm mưu thúc đẩy lợi ích riêng trong khoảnh khắc suy yếu của [liege.GetTitleAsNameNoTooltip|U], và có lẽ giờ đây cũng đến lượt chúng ta làm điều tương tự.\n\nNếu chúng ta trợ giúp [liege.GetTitleAsNameNoTooltip|U], ta có thể giành được ân sủng của [liege.GetHerHis] và quấn chặt ảnh hưởng của mình quanh ngai vàng như một dây leo hùng mạnh..."
  ep3_powerful_families.8010.a: "Một khoản hỗ trợ tài chính sẽ giành được lòng tin của [liege.GetHerHis]."
  ep3_powerful_families.8010.b: "Chúng ta nên trực tiếp điều quân tham chiến!"
  ep3_powerful_families.8010.c: "Ta phải lợi dụng khoảnh khắc yếu đuối này."
  ep3_powerful_families.8010.a.win: "Ảnh hưởng của Ngài gia tăng"
  ep3_powerful_families.8010.a.lose: "[liege.GetTitleAsNameNoTooltip|U] trở nên cảnh giác"
  ep3_powerful_families.8010.d: "Chưa phải lúc."
  ep3_powerful_families.8011.t: "[generous_family.Custom2('AppropriateGreetingPositive', liege )]"
  ep3_powerful_families.8011.desc: "Những nỗ lực chiến đấu anh dũng của ngài trong cuộc chiến [war.GetName] đã không thoát khỏi sự chú ý của gia tộc ta. Xin hãy nhận phần của cải này và mong rằng nó sẽ góp phần mang lại chiến thắng cho tất cả chúng ta!"
  ep3_powerful_families.8011.a: "Thật hào phóng."
  ep3_powerful_families.8012.t: "Gia Tộc Cùng Nhau Chinh Chiến"
  ep3_powerful_families.8012.desc: "Không có gì là bí mật khi [war.GetName] đã không diễn ra suôn sẻ như chúng ta mong đợi ban đầu, và các gia tộc đang tranh cãi đã bắt đầu âm mưu tìm cách lấp đầy khoảng trống quyền lực ngày càng lớn trong vương quốc. Tuy nhiên, [generous_family.GetName|U] lại tìm cách thực hiện điều đó theo hướng có lợi nhất cho ta.\n\nTrong bức thư của [generous_family.GetHerHis], [generous_family.GetSheHe] đề nghị cam kết quân đội của [generous_family.GetHerHis] cho cuộc chiến, chỉ để đổi lấy một số lượng đáng kể các tước hiệu danh dự và quyền lực."
  ep3_powerful_families.8012.a: "Được thôi."
  ep3_powerful_families.8012.a.toast: "[liege.GetFirstName] chấp nhận đề nghị của Ngài"
  ep3_powerful_families.8012.b: "Ta sẽ không bị lợi dụng!"
  ep3_powerful_families.8012.b.toast: "[liege.GetFirstName] từ chối đề nghị của Ngài"
  ep3_powerful_families.8020.t: "Chớm Nở"
  ep3_powerful_families.8020.desc: "Trên khắp vương quốc, quyền lực của một gia tộc mới dường như đang bén rễ. Như cỏ dại, họ đã lan tỏa ảnh hưởng tới mọi ngóc ngách của xã hội, và hiếm có ngày nào người ta không nghe đến cái tên \"[new_family.GetHouse.GetBaseName]\".\n\nKhông thể phủ nhận rằng gia tộc này đã vươn lên trở thành một trong những thế lực hùng mạnh nhất vương quốc, và gia tộc ta giờ đây trông cậy vào ta để định hướng cách tiếp cận quyền lực mới này."
  ep3_powerful_families.8020.a: "Chúng ta phải bóp nghẹt họ."
  ep3_powerful_families.8020.a.win: "Ngài tạm thời kìm hãm được ảnh hưởng của họ"
  ep3_powerful_families.8020.a.lose: "Mọi nỗ lực của Ngài đều vô ích"
  ep3_powerful_families.8020.b: "Phải cho họ biết ta là bằng hữu."
  ep3_powerful_families.8020.b.win: "[new_family.GetFirstName] ấn tượng"
  ep3_powerful_families.8020.b.lose: "[new_family.GetFirstName] không hề ấn tượng"
  ep3_powerful_families.8020.c: "Cứ tránh xa họ."
  ep3_powerful_families.8030.t: "Những Gia Tộc Cùng Âm Mưu..."
  ep3_powerful_families.8030.desc: "[faction.GetName|U] vẫn chỉ là một phong trào non trẻ, nhưng dĩ nhiên đã có sự hậu thuẫn của gia tộc hùng mạnh của ta. Tuy nhiên, một số gia tộc khác dường như vẫn chưa nhận ra tính chính nghĩa của mục tiêu này và cho đến nay vẫn phớt lờ cơ hội gia nhập.\n\nKhi Ta soạn thảo thư từ để phối hợp các bước tiếp theo của phe phái, Ta không khỏi tự hỏi vì sao [friendly_family.Custom2('MyCharacterIntroduction', ROOT.Char)] vẫn chưa lên tiếng ủng hộ."
  ep3_powerful_families.8030.a: "Ta phải liên hệ với [friendly_family.GetHerHim] ngay!"
  ep3_powerful_families.8030.a.win: "Ngài thuyết phục được [friendly_family.GetHerHim]"
  ep3_powerful_families.8030.a.lose: "Ngài không nhận được hồi âm"
  ep3_powerful_families.8030.b: "Bằng hữu không phải để làm chuyện này."
  ep3_powerful_families.8040.t: "Thân Tình"
  ep3_powerful_families.8040.desc: "Kể từ khi [location.GetName] rơi vào tay Gia tộc [other_family.GetHouse.GetName], Ta bắt đầu cảm thấy mình như một vị khách trên chính lãnh địa của mình. Dĩ nhiên, vùng đất trong nhà vẫn thuộc về Ta, nhưng mọi thứ bên ngoài cổng đều là của [other_family.GetName].\n\nKhi Ta đi dạo buổi sáng quanh khuôn viên, Ta không khỏi tự hỏi liệu việc có [other_family.GetFirstNameNoTooltip] đi bên cạnh có mang lại lợi thế chính trị nào không..."
  ep3_powerful_families.8040.a: "Phải mời [other_family.GetHerHim] ngay lập tức!"
  ep3_powerful_families.8040.a.win: "Chuyến thăm diễn ra tốt đẹp"
  ep3_powerful_families.8040.a.lose: "Chuyến thăm là một thảm họa"
  ep3_powerful_families.8040.b: "Chúng ta phải biến vùng đất này thành của mình."
  ep3_powerful_families.8040.b.win: "Ảnh hưởng của Ngài lan rộng"
  ep3_powerful_families.8040.b.lose: "Âm mưu của Ngài bị bại lộ"
  ep3_powerful_families.8040.c: "Ta chỉ có thể cúi đầu chịu đựng."
  ep3_powerful_families.8060.t: "Biệt Thự Đáng Ghét"
  ep3_powerful_families.8060.desc: "Ta thong thả dạo bước qua [location.GetNameNoTier] cùng đoàn tùy tùng thân tín và vệ binh, trầm trồ trước những công trình tráng lệ nơi đây. Ta say mê niềm hân hoan với vùng đất mình cai trị, nhưng tâm trạng nhanh chóng sa sút khi Ta nhìn thấy một điền trang gớm ghiếc của gia tộc [other_family.GetHouse.GetName].\n\nTài sản của họ rải rác như những mụn cóc trên vùng đất vốn hoàn hảo của Ta, và máu trong người Ta bắt đầu sôi lên khi nghĩ đến việc phải tiếp tục chịu đựng sự hiện diện của họ."
  ep3_powerful_families.8060.a: "Đánh vào tài chính của họ."
  ep3_powerful_families.8060.a.win: "Ngài vơ vét được của cải của họ"
  ep3_powerful_families.8060.a.lose: "Ngài bị phát hiện"
  ep3_powerful_families.8060.b: "Hối lộ gia nhân của họ."
  ep3_powerful_families.8060.c: "Tạm thời phải chịu đựng."
  ep3_powerful_families.8070.t: "Sai Lầm"
  ep3_powerful_families.8070.desc: "Đội cận vệ ném một [child.GetName] đang run rẩy xuống chân ta. Khuôn mặt [child.GetHerHis|U] hiện lên sự hổ thẹn, và ta không thể tưởng tượng nổi đứa trẻ này đã làm những gì.\n\n\"Chúng tôi tìm thấy [child.Custom2('InsultNoun', ROOT.Char)] này đang tỏ ra thân thiết tại điền trang [other_family.GetHouse.GetName]. Ngài không cần thắc mắc nơi đặt lòng trung thành thực sự của nó đâu.\"\n\nÝ nghĩ về việc người thân của chính ta lại thân mật với kẻ thù thật đáng ghê tởm, nhưng có lẽ sự kết nối của [child.GetHerHis] có thể được tận dụng."
  ep3_powerful_families.8070.a: "\"Cứ tiếp tục lui tới đó, và báo cáo cho ta mọi thứ.\""
  ep3_powerful_families.8070.a.win: "[child.GetFirstNameNoTooltip|U] trở thành chỉ điểm của Ngài"
  ep3_powerful_families.8070.a.lose: "[child.GetFirstNameNoTooltip|U] bị phát hiện"
  ep3_powerful_families.8070.b: "\"Hãy cố chấm dứt mối thù ngu ngốc này.\""
  ep3_powerful_families.8070.b.crit_win: "[child.GetFirstNameNoTooltip|U] chấm dứt mối thù"
  ep3_powerful_families.8070.b.win: "[child.GetFirstNameNoTooltip|U] đạt được tiến triển"
  ep3_powerful_families.8070.b.lose: "[child.GetFirstNameNoTooltip|U] thất bại"
  ep3_powerful_families.8070.c: "\"Cút khỏi mắt ta.\""
  ep3_powerful_families.8080.t: "Im Lặng Ngập Ngừng"
  ep3_powerful_families.8080.desc: "Tiếng cụng ly thu hút sự chú ý của mọi người về phía [other_family.GetName], người đang đứng lên để đọc diễn văn. [other_family.GetSheHe|U] bắt đầu khá suôn sẻ, nhưng một chút do dự sớm biến thành một khoảng lặng dài và khó xử.\n\n[other_family.GetSheHe|U] nhìn ta với vẻ sợ hãi và tuyệt vọng trên khuôn mặt [other_family.GetHerHis], lặng lẽ khẩn cầu ta đến cứu giúp [other_family.GetHerHis]."
  ep3_powerful_families.8080.a: "Cơ hội hoàn hảo để làm nhục gia tộc [other_family.GetHouse.GetNameNoTooltip]!"
  ep3_powerful_families.8080.b: "Ta sẽ giúp."
  ep3_powerful_families.8090.t: "Man Rợ Lịch Sự"
  ep3_powerful_families.8090.desc: "Tối nay ta bị kẹt giữa [liege.GetName] và kẻ [other_family.Custom2('InsultAdjective', ROOT.Char)] [other_family.GetName]. Ta buộc phải lắng nghe gã nịnh thần đó lải nhải mãi về lòng trung thành và tài năng được xưng tụng của gia tộc [other_family.GetHouse.GetName].\n\nĐiều duy nhất đáng ghê tởm hơn những lời lẽ phun ra từ miệng [other_family.GetHerHis] là những vụn thức ăn văng ra cùng với chúng. Ta nhất định phải tìm cách khiến [other_family.Custom2('InsultNoun', ROOT.Char)] này im miệng, dù chỉ để làm dịu cơn đau đầu của ta."
  ep3_powerful_families.8090.a: "\"Còn gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] thì sao, thưa bệ hạ?\""
  ep3_powerful_families.8090.a.win: "[liege.GetFirstNameNoTooltip|U] ấn tượng"
  ep3_powerful_families.8090.a.lose: "[liege.GetFirstNameNoTooltip|U] chán nản"
  ep3_powerful_families.8090.b: "Buổi tối rồi cũng sẽ kết thúc."
  ep3_powerful_families.8100.t: "Phục Vụ Triều Chính"
  ep3_powerful_families.8100.desc: "Tối nay ta thật may mắn khi bị cuốn vào cuộc trò chuyện với [liege.GetName]. [liege.GetSheHe|U] than thở vì đã trải qua nhiều đêm mà không được nghe những vần thơ ngọt ngào.\n\nTa nhớ ra [cp_fam.GetName|U] đã dành nhiều ngày tháng của [cp_fam.GetHerHis] lang thang trong vườn để luyện tập sự thông thạo ngôn ngữ [cp_fam.GetCulture.GetLanguage.GetNameNoTooltip]. Sở thích này của [cp_fam.GetHerHis] có thể được tận dụng để mở rộng tầm ảnh hưởng của chúng ta tại triều đình [liege.GetPrimaryTitle.GetAdjective]..."
  ep3_powerful_families.8100.a: "\"[cp_fam.GetFirstNameNoTooltip|U] là một thi sĩ xuất sắc, thưa bệ hạ!\""
  ep3_powerful_families.8100.a.win: "[cp_fam.GetFirstNameNoTooltip|U] được bổ nhiệm"
  ep3_powerful_families.8100.a.lose: "[cp_fam.GetFirstNameNoTooltip|U] bị từ chối"
  ep3_powerful_families.8100.b: "\"Thật mừng khi bệ hạ cũng trân trọng những thú vui tao nhã.\""
  friend_supported_at_feast: "[CHARACTER.GetShortUIName|U] đã ủng hộ [TARGET_CHARACTER.GetShortUIName] tại yến tiệc"
  friend_supported_at_feast_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã ủng hộ [CHARACTER.GetShortUIName] tại yến tiệc"
  friend_making_ammends: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] từng là kình địch, nhưng nay đã giảng hòa"
  rival_humiliated_at_feast: "[CHARACTER.GetShortUIName|U] đã làm nhục [TARGET_CHARACTER.GetShortUIName] tại yến tiệc"
  rival_humiliated_at_feast_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã làm nhục [CHARACTER.GetShortUIName] tại yến tiệc"
  rival_plotting_against_me: "[CHARACTER.GetShortUIName|U] đã âm mưu hủy hoại toàn bộ gia tộc của [TARGET_CHARACTER.GetShortUINamePossessive]"
  rival_plotting_against_me_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã âm mưu hủy hoại toàn bộ gia tộc của [CHARACTER.GetShortUINamePossessive]"
