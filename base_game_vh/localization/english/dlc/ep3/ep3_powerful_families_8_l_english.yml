  friend_aided_my_family_corresponding: "[CHARACTER.GetShortUIName|U] đã giúp gia tộc của [TARGET_CHARACTER.GetShortUINamePossessive] gia tăng ảnh hưởng trong vương quốc"
  rival_stifled_my_influence: "[TARGET_CHARACTER.GetShortUIName|U] đã đối địch với gia tộc của [CHARACTER.GetShortUINamePossessive] và tìm cách làm suy yếu ảnh hưởng của họ"
  rival_stifled_my_influence_corresponding: "[CHARACTER.GetShortUIName|U] đã đối địch với gia tộc của [TARGET_CHARACTER.GetShortUINamePossessive] và tìm cách làm suy yếu ảnh hưởng của họ"
  friend_loyal_servant: "[CHARACTER.GetShortUIName|U] đã ấn tượng trước sự phục vụ trung thành của [TARGET_CHARACTER.GetShortUINamePossessive] tại triều đình"
  friend_loyal_servant_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã ấn tượng trước sự phục vụ trung thành của [CHARACTER.GetShortUINamePossessive] tại triều đình"
