  ep3_governance_tax_relief: "Giảm Thuế"
  ep3_governance_tax_relief_desc: "Bá tước quốc này đã được thống đốc khu vực ban hành chính sách giảm thuế, khiến dân chúng địa phương vô cùng hài lòng."
  ep3_governance_stationed_troops: "Tăng Cường Đồn Trú"
  ep3_governance_stationed_troops_desc: "Theo lệnh của thống đốc, lãnh địa này được tăng cường quân đồn trú nhằm bảo đảm một môi trường ổn định và hiệu quả."
  ep3_governance_festivities: "Tổ Chức Lễ Hội"
  ep3_governance_festivities_desc: "Một viên chức địa phương đã được #EMP thuyết phục#! để tổ chức nhiều hội chợ và lễ hội."
  ep3_governance_infrastructure: "Cải Thiện Hạ Tầng"
  ep3_governance_infrastructure_desc: "Một viên chức địa phương đã chi ra rất nhiều ngân quỹ để cải thiện cơ sở hạ tầng của khu vực."
  ep3_governance_harvest: "Phân Phát Lương Thực"
  ep3_governance_harvest_desc: "Bá tước quốc này đang được hưởng lợi từ việc phân phát lương thực cho dân chúng theo chỉ thị của thống đốc địa phương."
  ep3_governance_great_harvest: "Phân Phát Lương Thực Quy Mô Lớn"
  ep3_governance_great_harvest_desc: "Bá tước quốc này đang được hưởng lợi từ một đợt phân phát lương thực quy mô lớn do thống đốc địa phương tổ chức."
  ep3_governance_mercenary_troops: "Quân Đánh Thuê"
  ep3_governance_mercenary_troops_desc: "Nhân vật này đã tuyển mộ một số cựu thảo khấu làm lính đánh thuê, bất chấp những ý kiến phản đối từ người khác."
  ep3_governance_workforce: "Lao Động Trưng Tập"
  ep3_governance_workforce_desc: "Bá tước quốc này có số lượng lớn dân chúng bị trưng tập vào lực lượng lao động phục vụ cộng đồng."
  ep3_governance_rampant_bandits: "Thổ Phỉ Hoành Hành"
  ep3_governance_rampant_bandits_desc: "Bá tước quốc này đang bị thổ phỉ tàn phá; các vụ tấn công bạo lực nhằm vào lữ khách và thương nhân diễn ra thường xuyên."
 
