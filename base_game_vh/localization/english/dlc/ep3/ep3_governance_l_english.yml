l_english:
  governor_tax_scheme: "Thu Thuế"
  governor_tax_scheme_desc_general: "Trong một [scheme|E] Thu Thuế, Ngài tìm cách thu thập thông tin về các khoản thuế bị thất lạc và buộc ngôi làng bị nghi ngờ phải nộp đủ."
  governor_tax_scheme_desc: "Thuế được thu thập cẩn thận và ghi chép cho từng khu vực và ngôi làng, nhờ đó có thể xác định khi nào thuế thực sự đã được nộp đúng hạn. Và quan trọng hơn, khi các khoản thanh toán đang #EMP thiếu#!."
  governor_tax_scheme_action: "Thu Thuế tại"
  governor_tax_scheme_invalidated_title: "Kế hoạch $governor_tax_scheme$ bị hủy"
  msg_governance_contract_appear.t: "Vấn đề Cai Trị Mới"
  msg_governance_contract_appear.desc: "Một [new_governance_issue.GetType.GetName|V] [governance_issue|E] mới đã xuất hiện tại [target_province.GetName], thuộc [target_province.GetCounty.GetTitle.GetName]"
  task_contract_governance_desc_title: "Phán quyết của ta với tư cách [GetPlayer.Custom('GetGovernorConceptNoTooltip')] là cần thiết!"
 
  overdue_taxes_contract: "Thuế Quá Hạn"
  overdue_taxes_desc: "Do âm mưu, thiếu thốn hay đơn thuần là tắc trách, một ngôi làng trong khu vực này đã không gửi phần sản vật phải nộp làm thuế."
  overdue_taxes_desc_title: "$task_contract_governance_desc_title$"
  hoarding_mayor_contract: "Thị Trưởng Tích Trữ"
  hoarding_mayor_desc: "Thị trưởng của lãnh địa này đang thu gom và tích trữ lượng vàng nhiều hơn mức bình thường. Có thể ông ta không chuyển đủ thuế lên cấp trên, hoặc không đầu tư đủ cho chính thành thị."
  hoarding_mayor_desc_title: "$task_contract_governance_desc_title$"
  bountiful_harvest_contract: "Vụ Mùa Bội Thu"
  bountiful_harvest_desc: "Những báo cáo về sự sung túc kỳ diệu, mùa màng cao tốt và ruộng đồng xanh mướt, đổ về từ khắp [GetPlayer.Custom('GetProvinceConceptNoTooltip')]. Một phúc lợi lớn như vậy cần được tận dụng hợp lý. Đừng để mùa màng hư hỏng!"
  bountiful_harvest_desc_title: "$task_contract_governance_desc_title$"
  rampant_bandits_contract: "Thổ Phỉ Hoành Hành"
  rampant_bandits_desc: "Những kẻ ngoài vòng pháp luật và các du mục hung hãn đang quấy nhiễu khu vực này của [GetPlayer.Custom('GetProvinceConceptNoTooltip')]. Để dân chúng được an toàn và thương nhân có thể đi lại tự do: chúng cần phải bị xử lý."
  rampant_bandits_desc_title: "$task_contract_governance_desc_title$"
 
  governor_contract_event.1000.t: "Thuế Quá Hạn"
  governor_contract_event.1000.desc: "Các thư lại của ta khẳng định rằng một ngôi làng tại [tax_destination.GetName] đang chậm trễ nghiêm trọng trong việc nộp thuế.\n\nBỏ qua vấn đề này sẽ là sự sao nhãng nghiêm trọng bổn phận của ta. Sổ sách ghi chép rất rõ: thuế #EMP đang#! bị thiếu. Các chuyến hàng chưa bao giờ được gửi đi.\n\nHiện tại, nguyên nhân của sự thiếu hụt này vẫn chưa rõ. Đây có thể là việc dành cho quan lại... hoặc cho binh lính."
  governor_contract_event.1000.a: "Hãy mở cuộc điều tra!"
  governor_contract_event.1001.desc: "Đoàn tùy tùng của ta vất vả băng qua con đường nông thôn xuống cấp, giữa những khóm [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] rải rác và thỉnh thoảng là một con [ROOT.Char.Custom('RegionalFarmAnimal')]... điểm đến của ta, ngôi làng nợ thuế, quả thực rất thô sơ và #EMP hết sức#! tầm thường — dù chỉ cách [tax_destination.GetName] chưa đầy một ngày đường.\n\nMột vài dân làng, khoác lên mình y phục truyền thống đặc trưng, đã tụ tập tại trung tâm làng. Ta được chào đón trong yên ổn, nhưng lạnh nhạt.\n\nTa phải cân nhắc cách tiếp cận cuộc điều tra này."
  governor_contract_event.1001.a: "Cách tiếp cận dò hỏi sẽ hiệu quả nhất."
  governor_contract_event.1001.b: "Hãy quan sát xung quanh và xem điều gì lộ ra."
  governor_contract_event.1001.a_tt: "Đến [tax_destination.GetName] và điều tra vấn đề"
  governor_contract_event.1001.success: "Cuộc điều tra thành công"
  governor_contract_event.1001.failure: "Cuộc điều tra thất bại"
  governor_contract_event.1001.a.success: "Ta thuyết phục được dân làng lên tiếng"
  governor_contract_event.1001.a.failure: "Ta không thể tìm hiểu được gì từ dân làng"
  governor_contract_event.1001.b.success: "Ta kiểm tra ngôi làng và biết được điều mình cần"
  governor_contract_event.1001.b.failure: "Ta không thể tìm ra điều mình cần từ ngôi làng"
  governor_contract_event.1003.t: "Thuế Quá Hạn: Thành Công"
  governor_contract_event.1003.desc_diplomacy: "Trò chuyện với dân làng hóa ra lại mang đến kết quả ngoài mong đợi!\n\nCác trưởng tộc háo hức liệt kê số thành viên gia đình mình và sẵn sàng ca ngợi năng suất ruộng đất. Một vài người thậm chí còn #EMP khoe khoang#! đàn gia súc của họ! Những nông dân dẫn ta đi quanh cánh đồng, giải thích họ có thể thu được bao nhiêu từ vụ mùa."
  governor_contract_event.1003.desc_stewardship: "Việc kiểm kê cẩn thận từng con [ROOT.Char.Custom('RegionalFarmAnimal')], từng thân lúa mạch, từng tấm chăn thô và nồi đất đã cho ta ước lượng chính xác số thuế mà đám nông nô này #EMP đáng#! phải nộp."
  governor_contract_event.1003.desc_outro: "\n\nMột sự sơ suất khó hiểu, vô tình hay cố ý, dường như là nguyên nhân khiến ngôi làng này không hoàn thành nghĩa vụ thuế. Nhưng vẫn còn một việc cuối cùng: quyết định cách khắc phục phù hợp nhất..."
  governor_contract_event.1003.a: "Thu gom những gì có thể và bán một nửa để phát triển khu vực."
  governor_contract_event.1003.b: "Chúng sẽ phải nộp đủ. Không thiếu dù chỉ #EMP một#! hạt thóc."
  governor_contract_event.1003.c: "Những người dân lương thiện này chỉ cần nộp một phần."
  governor_contract_event.1003.d: "Đóng quân đồn trú ở đây sẽ khuyến khích việc nộp thuế."
  governor_contract_event.1003.e: "Chỉ định một viên quản lý giám sát ngôi làng."
  governor_contract_event.1003.f: "Giảm thuế có thể giúp họ khấm khá hơn?"
  governor_contract_event.1004.t: "Thuế Quá Hạn: Thất Bại"
  governor_contract_event.1004.desc: "Dù ta lục soát hầm chứa và kho thóc, dù cưỡi ngựa khắp cánh đồng, dù dụ dỗ các bô lão trong làng... vẫn không có dấu hiệu nào của của cải bị giấu giếm trong thôn xóm này. Theo mọi biểu hiện, dân làng thực sự, hoàn toàn nghèo khổ và không đủ khả năng nộp những gì họ mắc nợ.\n\nKhông có bằng chứng cho thấy ta bị lừa dối, ta chẳng còn gì để làm ở đây. Sổ sách của ta đành phải gánh chịu khoản thất thu này."
  governor_contract_event.1004.a: "#EMP Khốn kiếp!#!"
 
  governor_contract_event.1010.t: "Thị Trưởng Tích Trữ"
  governor_contract_event.1010.desc: "Ta đã nhận được nhiều báo cáo rằng [hoarding_mayor.GetTitledFirstName], người đang quản lý [mayor_destination.GetName], đã giữ lại phần lớn thuế của thành phố cho [hoarding_mayor.GetHerselfHimself].\n\nMặc dù việc một thị trưởng giữ lại phần thuế dư là điều có thể chấp nhận, nhưng số tiền được báo cáo là #EMP quá mức#!. Nó dễ dàng chạm ngưỡng tham nhũng. Và để mọi chuyện tệ hơn nữa: hành động của [hoarding_mayor.GetHerHis] phản ánh cực kỳ xấu lên chính #EMP ta#!!"
  governor_contract_event.1010.a: "Ta sẽ phải tự mình giải quyết việc này."
  governor_contract_event.1010.a_tt: "Đến [mayor_destination.GetName] và nói chuyện với thị trưởng"
  governor_contract_event.1012.a_tt: "Ngài bắt đầu tiếp tục hành trình"
  governor_contract_event.1011.desc_intro: "Ta không lãng phí thời gian khi vừa đến [mayor_destination.GetName] và lập tức cưỡi ngựa thẳng tới dinh thự của thị trưởng. Ta xông vào, không báo trước, và ngay lập tức được chứng kiến một cảnh tượng đáng giá.\n\n"
  governor_contract_event.1011.desc_upset: "[hoarding_mayor.GetFirstName] nhìn chằm chằm vào ta, sững sờ trong giây lát, trước khi lấy lại bình tĩnh [hoarding_mayor.GetHerselfHimself]. Khi [hoarding_mayor.GetSheHe] lắng nghe những cáo buộc của ta, một vẻ cau có lan rộng trên khuôn mặt vị quan chức.\n\n\"Những lời buộc tội thật ghê tởm! Ta có thể...\" [hoarding_mayor.GetFirstNameNoTooltip] ngừng lại và hít sâu. \"Được rồi. Ngài muốn chúng ta tiến hành thế nào?\""
  governor_contract_event.1011.desc_fear: "Giật mình, [hoarding_mayor.GetFirstName] làm đổ đồ uống của [hoarding_mayor.GetHerHis] lên khắp [hoarding_mayor.GetHerselfHimself] — rõ ràng là bị sốc trước sự hiện diện của ta! Khuôn mặt của [hoarding_mayor.GetHerHis|U] ngày càng tái nhợt khi ta vạch trần những cáo buộc của mình.\n\n"Khoan đã! Làm ơn! Chắc chắn đây chỉ là một sự hiểu lầm. Chúng ta có thể sửa chữa mọi thứ, đúng không?""
  governor_contract_event.1011.desc_worried: "[hoarding_mayor.GetFirstName] quay lại nhìn ta chằm chằm, câm lặng. [hoarding_mayor.GetSheHe|U] chống tay lên bàn để giữ vững [hoarding_mayor.GetHerselfHimself] khi ta quở trách [hoarding_mayor.GetHerHim], ném ra hết cáo buộc này đến cáo buộc khác.\n\n\"Ta... ta tin rằng có sự hiểu lầm nào đó, nhưng ta tất nhiên sẽ giúp ngài giải quyết vấn đề! Bằng bất cứ cách nào ngài thấy phù hợp!\""
  governor_contract_event.1011.a: "Đầu tư vào thành phố. Ta sẽ xử lý số tiền còn lại."
  governor_contract_event.1011.b: "Ngươi sẽ giao #EMP toàn bộ#! số tiền dư cho ta."
  governor_contract_event.1011.c: "Hãy sử dụng cho đúng. Đầu tư vào cơ sở hạ tầng địa phương."
  governor_contract_event.1011.d: "Trả lại cho dân chúng bằng cách tổ chức lễ hội."
  governor_contract_event.1011.e: "E rằng chỉ có hình phạt nghiêm khắc mới đủ."
  governor_contract_event.1011.f: "Ta có thể bỏ qua chuyện này... nhưng đừng quên nó."
  governor_contract_event.1012.t: "Vấn đề Cai Trị: Hủy Hành Trình"
  governor_contract_event.1012.desc: "Ta sẽ không thể làm được nhiều điều với vấn đề hiện tại nếu không đến tận nơi. Người ta mong đợi ta trực tiếp xử lý những chuyện như thế này, nhưng có lẽ ta nên làm ngơ và tập trung vào những việc cấp bách hơn..."
  governor_contract_event.1012.a: "Nghĩ lại thì, đi thôi!"
  governor_contract_event.1012.b: "Ta còn những việc quan trọng hơn cần giải quyết."
 
  governor_contract_event.1020.t: "Vụ Mùa Bội Thu"
  governor_contract_event.1020.desc: "[ROOT.Char.GetFaith.FertilityGodName] đã ban phúc cho chúng ta! Tại nhiều ngôi làng thuộc [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive], những bó lúa tưởng chừng vô tận được thu hoạch từ các cánh đồng được tưới mát bởi những cơn mưa đều đặn. Và cả những [ROOT.Char.Custom('RegionalRootVegetablePlural')] nữa! Một sản lượng lớn hơn hẳn vụ trước đang được mong đợi trong niềm hân hoan.\n\nĐây tất nhiên là tin cực kỳ tốt. Ta phải tổ chức một lực lượng lao động đặc biệt và lo liệu khâu hậu cần càng sớm càng tốt.\n\nVậy thì, những cỗ xe của ta nên chở những đống nông sản [ROOT.Char.Custom('GetSeason')] khổng lồ này đi đâu...?"
  governor_contract_event.1020.a: "Phân phối đều khắp tỉnh."
  governor_contract_event.1020.b: "Phân phối cùng với ngũ cốc thường lệ."
  governor_contract_event.1020.c: "Thủ phủ tỉnh phải được hưởng lợi."
  governor_contract_event.1020.d: "Quyên góp cho từ thiện và những người cần giúp đỡ."
  governor_contract_event.1020.e: "Lấp đầy kho lương và bán phần dư."
  governor_contract_event.1020.f: "Chuyển #EMP toàn bộ#! về lãnh địa của ta."
  harvest_claim_it_yourself_estate_tt: "Số lượng được tăng thêm #P +[EmptyScope.ScriptValue('estate_granary_gold_bonus_value')|+0%]#! nhờ [GetDomicileBuilding('storage_granary_03').GetName] trong [estate|E] của Ngài"
 
  governor_contract_event.1030.t: "Thổ Phỉ Hoành Hành"
  governor_contract_event.1030.desc: "Ta đọc lại bản báo cáo. #EMP Thổ phỉ#!, với chúng, những người nộp thuế tuân thủ pháp luật của ta chẳng khác gì những con cừu béo để xén lông!\n\nVà quả thực, bọn cướp thô bạo này đã vung đao lên dân chúng của ta... làng mạc bị khủng bố, đoàn buôn bị tiêu diệt.\n\nMột nhóm côn đồ đặc biệt nguy hiểm đã thiết lập căn cứ vững chắc tại vùng [task_contract_location.GetProvince.GetTerrain.GetNameNoTooltip|l] gần [bandit_destination.GetName]. Chừng nào chúng chưa bị quét sạch, khu vực này sẽ vẫn không thể kiểm soát."
  governor_contract_event.1030.a: "Tập hợp một toán binh sĩ. Lên đường ngay!"
  governor_contract_event.1030.b: "Rồi chúng sẽ bị xử lý đúng lúc..."
  governor_contract_event.1031.desc: "Người dân ở [bandit_destination.GetName] vui vẻ dẫn chúng ta thẳng tới cửa hang của con [ROOT.Char.Custom('RegionalFerociousAnimal')]... trại của bọn thổ phỉ nằm ngay phía trước, bị che khuất bởi bụi rậm và địa hình gồ ghề.\n\nTheo những gì ta nghe được, ta nhận định kẻ địch là những chiến binh du mục: cứng cỏi, sống bên lề xã hội định cư, và giàu lên nhờ của cải từ lãnh thổ của ta đến mức chúng đã biến những cuộc cướp bóc thành một cuộc lưu trú dài ngày.\n\nKẻ địch vẫn chưa phát hiện sự hiện diện của toán tùy tùng ta. Ta có cơ hội ra đòn theo bất kỳ cách nào ta thấy phù hợp."
  governor_contract_event.1031.a: "Xông lên! Đánh úp chúng!"
  governor_contract_event.1031.b: "Hãy bày ra chiến thuật trước khi tấn công."
  governor_contract_event.1031.c: "Dụ chúng vào bẫy có thể tiết kiệm nhiều công sức."
  governor_contract_event.1031.success: "Ngài thành công và đánh bại bọn thổ phỉ"
  governor_contract_event.1031.failure: "Ngài thất bại và bọn thổ phỉ trốn thoát"
  governor_contract_event.1031.b.success: "Chiến thuật của Ngài là một thắng lợi vang dội"
  governor_contract_event.1031.b.failure: "Lựa chọn chiến thuật của Ngài để lại nhiều điều đáng thất vọng"
  governor_contract_event.1031.c.success: "Cái bẫy của Ngài hoàn hảo"
  governor_contract_event.1031.c.failure: "Cái bẫy của Ngài không lừa được ai"
  governor_contract_event.1032.desc_tactical: "Kẻ địch vô tổ chức của ta không thể nào đứng vững trước đội quân được huấn luyện bài bản! Những loạt đạn của chúng không còn nhắm vào thân xác nông dân vô tội, mà vô hại đập vào khiên của đội hình chiến tuyến. Bọn tội phạm quay đầu bỏ chạy, nhưng kỵ binh ở hai cánh đã chặn đứng mọi đường thoát.\n\nTa nhìn những xác chết. Ta suy ngẫm về những kẻ sống sót bị bắt."
  governor_contract_event.1032.desc_trap: "Đây là một cái bẫy vô cùng xảo quyệt.\n\nMột binh sĩ trẻ, nửa trần truồng, tay cầm bữa tối bị đánh cắp, chạy thục mạng về phía chúng ta; bọn thổ phỉ, những #EMP kẻ ngu#!, lập tức đuổi theo! Chúng ta nhảy ra từ chỗ ẩn nấp — hú hét, kẻ địch hoảng loạn nhận ra sai lầm — và lao vào chúng! Khi chỉ còn cách cái chết trong gang tấc, bọn du mục đầu hàng quân ta.\n\nNhóm tội phạm này đã hoàn toàn bị vô hiệu hóa, bất lực."
  governor_contract_event.1032.desc_charge: "Một cuộc xung phong long trời lở đất luôn là bất ngờ khó chịu với mọi kẻ địch, và những tiếng la hét hỗn loạn của lũ tội phạm cho thấy chúng #EMP thực sự#! không hề chuẩn bị!\n\nCuộc giao tranh giáp lá cà giữa binh sĩ trang bị nặng của ta và những chiến binh ăn mặc lôi thôi loạng choạng tìm ngựa chỉ kéo dài trong chốc lát. Những kẻ du mục sống sót sau đó bị xếp hàng ngay ngắn trước mặt ta."
  governor_contract_event.1032.desc_outro: "\n\nChúng nằm trong tay ta."
  governor_contract_event.1032.a: "Trả lại tài sản bị cướp; bắt bọn tội phạm lao động."
  governor_contract_event.1032.b: "Ân xá cho tội lỗi của chúng."
  governor_contract_event.1032.c: "Sao không kiếm tiền lương thiện để sống?"
  governor_contract_event.1032.d: "Chúng sẽ phải nộp tiền phạt."
  governor_contract_event.1032.e: "Treo cổ chúng."
  governor_contract_event.1032.f: "Tịch thu mọi thứ có giá trị và giam chúng lại."
  governor_contract_event.1033.desc: "[ROOT.Char.Custom('CulturalCurse')|U]!\n\nCuộc tấn công của binh sĩ ta bị lộ do chim chóc hoảng sợ; chúng ta lao tới nhanh nhất có thể, nhưng bọn du mục xảo quyệt đã kịp lên ngựa và phi đi gần như ngay lập tức!\n\nMột vài tên cướp tháo chạy bị bắt và đánh chết... nhưng quá ít để ngăn cản số còn lại tiếp tục cướp bóc và tàn phá.\n\nKiệt sức, chúng ta buộc phải quay về."
  governor_contract_event.1033.a: "Hãy quên chuyện này đi."
  governor_contract_event.1038.desc: "Bọn thổ phỉ này khó có khả năng rút đi trong yên ổn. Người dân ở [bandit_destination.GetName] có thể sẽ còn phải hứng chịu các cuộc tấn công của chúng trong một thời gian dài, trừ khi ta can thiệp.\n\nHơn nữa, với tư cách là một quan chức được bổ nhiệm, sự an toàn của họ là trách nhiệm của ta."
  governor_contract_event.1038.a: "Ta phải bảo vệ những người này!"
  governor_contract_event.1038.b: "Dân chúng sẽ phải tự xoay xở."
  governor_contract_event.1038.a_tt: "Đến [bandit_destination.GetName] và xử lý bọn thổ phỉ"

  discontent_soldiers: "Binh lính bất mãn"
  discontent_soldiers_contract: "$discontent_soldiers$"
  discontent_soldiers_desc: "Sự bất mãn lan rộng trong quân đội của Ngài. Lính gác lầm bầm tại các chốt. Các sĩ quan cấp thấp ngày càng lơ là kỷ luật."
  discontent_soldiers_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2000.t: "$discontent_soldiers$"
  governor_contract_event.2000.desc: "Những báo cáo từ các tiền đồn, từ lực lượng đồn trú dưới quyền ta, đều thống nhất một điều: sự bất mãn trong hàng ngũ binh lính đang gia tăng. Thời gian điều động quá dài, tiền lương quá thấp, gái điếm địa phương thì quá xấu, doanh trại thì quá khắc nghiệt...\n\nĐối với những người sống trong trại quân, lý do để than phiền lúc nào cũng vô số, nhưng chỉ cần một can thiệp nhỏ, ta có thể hy vọng cải thiện tinh thần của họ... điều đó chắc chắn sẽ giúp tăng đáng kể uy tín của ta, cũng như sự an toàn cho địa vị của mình."
  governor_contract_event.2000.a: "Ta sẽ cấp đất cho mọi sĩ quan cao cấp."
  governor_contract_event.2000.b: "Họ đâu có khổ như quân của [other_gov.GetTitledFirstNamePossessiveNoTooltip]!"
  governor_contract_event.2000.c: "Họ xứng đáng được nghỉ ngơi một thời gian."
  governor_contract_event.2000.d: "Chúng sẽ bị trừng phạt vì tội bất tuân!"
  governor_contract_event.2000.e: "Thêm tiền sẽ khiến họ vui vẻ."
  ep3_settled_troops_province_modifier: "Quân đội định cư"
  ep3_settled_troops_province_modifier_desc: "Các sĩ quan của lực lượng đồn trú tại tỉnh này đã được cấp đất địa phương để an cư."
  ep3_longer_breaks_province_modifier: "Quân đội nghỉ phép"
  ep3_longer_breaks_province_modifier_desc: "Quân đồn trú tại tỉnh này được cho nghỉ phép dài hơn nhằm nâng cao sĩ khí."
  ep3_better_paid_soldiers_modifier: "Quân đội được đãi ngộ"
  ep3_better_paid_soldiers_modifier_desc: "Nhân vật này nổi tiếng vì trả lương cho binh lính cao hơn mức cần thiết — mà binh lính vui vẻ thì chiến đấu hiệu quả hơn."

  inept_mayor: "Huyện lệnh bất tài"
  inept_mayor_contract: "$inept_mayor$"
  inept_mayor_desc: "Quan chức chủ chốt này đã chứng tỏ mình gần như hoàn toàn bất lực. Giới quý tộc địa phương, đám dân đen, và thậm chí cả các cận thần của Ngài ngày càng bất mãn."
  inept_mayor_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2010.t: "$inept_mayor$"
  governor_contract_event.2010.desc: "Ta nghiền ngẫm hàng loạt đơn khiếu nại gửi về từ [mayor_destination.GetName], ghi nhận những cáo buộc nhắm vào \"tên [inept_mayor.Custom2('InsultNoun', ROOT.Char)], [inept_mayor.GetFirstName]\" kia; rằng với \"sự phạm pháp [inept_mayor.Custom2('InsultAdjective', ROOT.Char)]\", [inept_mayor.GetSheHe] đã bị cho là đã rút cạn ngân khố của [inept_mayor.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nQuả thực, có điều gì đó hết sức #EMP sai trái#! trong hệ thống sổ sách của thành phố: tài sản biến mất khỏi bảng cân đối một cách khó hiểu, số lượng quan chức ăn lương nhà nước thay đổi từng ngày, và hồ sơ quyền sở hữu đất đai thì đầy rẫy những mâu thuẫn."
  governor_contract_event.2010.a: "Ta nên đích thân đến thăm [mayor_destination.GetNameNoTooltip]."
  governor_contract_event.2011.desc_intro: "Khi ta đến [mayor_destination.GetName], ta vội vã vào văn phòng của thị trưởng địa phương, [inept_mayor.GetFirstName]. Dường như bị bất ngờ, tên quan lại vội vã đuổi những người hầu của [inept_mayor.GetHerHis] đi. Những cuốn sổ cái đang bị nắm chặt trong tay họ.\n\n"Ta đến để xác minh kế toán của chính quyền các ngươi," ta tuyên bố, cau mày đầy trang nghiêm."
  governor_contract_event.2011.desc_fear: "\n\n\"Có phải là về, ờ, lô ngũ cốc đó không?\" thị trưởng lắp bắp. \"Hay chuyến hàng tơ lụa? Vâng, các mối quan hệ của ta có hơi... không chính thống, nhưng họ đã được ân xá vì tội lỗi rồi! À thì... #EMP hầu hết là vậy.#! Ta sẽ hủy bỏ các lệnh này, thưa [ROOT.Char.GetTitleAsName], tất cả; ngài không cần phải lo lắng đâu!\""
  governor_contract_event.2011.desc_upset: "\n\n\"Thưa [ROOT.Char.GetTitleAsName], chẳng lẽ ngài lại nghi ngờ sự tận tụy tuyệt đối của ta với chức vụ này sao? Năng lực đã được kiểm chứng của ta?!\" Thị trưởng phồng ngực [inept_mayor.GetHerselfHimself], nhìn ta đầy khiêu khích.\n\nNhưng ta là cấp trên của [inept_mayor.GetHerHis]."
  governor_contract_event.2011.desc_worried: "\n\n\"Tin tức đáng lo sao, thưa [ROOT.Char.GetTitleAsName]?\" [inept_mayor.GetFirstNameNoTooltip] cười gượng, \"Giới đại điền địa phương lắm mồm và giàu trí tưởng tượng; tốt nhất là cứ tránh xa những kẻ ồn ào nhất...\""
  governor_contract_event.2011.a: "Đưa sổ sách đây."
  governor_contract_event.2011.b: "Ngươi không xứng đáng với chức vụ này."
  governor_contract_event.2011.c: "Ta sẽ triệu các chuyên gia từ kinh đô."
  governor_contract_event.2011.d: "Ngươi sẽ tự bỏ tiền bù đắp mọi tổn thất!"
  ep3_mismanaged_administration_modifier: "Quản lý hành chính yếu kém"
  ep3_mismanaged_administration_modifier_desc: "Một trong những trung tâm chính của hạt này bị quản lý tồi tệ đến mức toàn khu vực đều chịu ảnh hưởng."

  prov_investment: "Đầu tư tỉnh lỵ"
  prov_investment_contract: "$prov_investment$"
  prov_investment_desc: "Một cơ hội đã xuất hiện để Ngài đầu tư vào thủ phủ của tổng trấn."
  prov_investment_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2020.t: "$prov_investment$"
  governor_contract_event.2020.desc: "Thật dễ chịu biết bao khi một nền tổng trấn cần mẫn mang lại kết quả mỹ mãn!\n\nNgân khố của [ongoing_destination.GetName] đang đầy ắp, và ta được chính quyền trung ương giao nhiệm vụ tái đầu tư khoản thặng dư này tại địa phương."
  governor_contract_event.2020.a: "Cơ sở hạ tầng là chìa khóa thành công."
  governor_contract_event.2020.b: "Phụng sự [ROOT.Char.GetFaith.HighGodName] nơi trần thế là một vinh dự."
  governor_contract_event.2020.c: "Hãy dựng một bức tượng hoành tráng mang tên [emperor.GetTitledFirstNamePossessiveNoTooltip]!"
  governor_contract_event.2020.c_tt: "Đáng tiếc là điều này đồng nghĩa với việc #EMP trưng thu lại#! vật liệu xây dựng từ khắp khu vực..."
  governor_contract_event.2020.d: "Giới thương nhân địa phương cần được hỗ trợ."
  governor_contract_event.2020.e: "Những binh sĩ dũng cảm của ta xứng đáng hơn thế!"
  governor_contract_event.2020.f: "Lương thực cho dân chúng mới là giải pháp!"
  governor_contract_event.2021.t: "$prov_investment$: Thành công"
  governor_contract_event.2021.desc_infrastructure: "Những tuyến đường nhộn nhịp nhất tại [task_contract_location.GetNameNoTier] là nơi được cải tạo đầu tiên. Đội lao công do ta thuê làm việc miệt mài và, với mức thù lao hậu hĩnh, tiến độ diễn ra nhanh chóng."
  governor_contract_event.2021.desc_church: "Bản thiết kế cho [ROOT.Char.GetFaith.HouseOfWorship] mới của [task_contract_location.GetNameNoTierPossessive] là một hình ảnh hoàn mỹ của cảm hứng thiêng liêng, dù rằng — so với những thánh địa vĩ đại trên thế gian — công trình của ta chỉ là một nơi khiêm tốn. Hãy để các tín đồ cùng nhau quy tụ!"
  governor_contract_event.2021.desc_monument: "Dung mạo của [emperor.GetFaith.WealthGodName], một trong những vị thần bảo trợ chính của [emperor.GetTitledFirstNamePossessive], được các nghệ nhân của ta tái hiện đầy trìu mến — và khá nịnh nọt. Tên của vị quân chủ vĩ đại được khắc bên dưới... cùng với tên ta."
  governor_contract_event.2021.desc_traders: "Hàng hóa đổ về như thác! Thương mại hưng thịnh chỉ nhờ vào việc ta tuyên bố giảm nhẹ một vài mức thuế quan trọng. Giờ thì, cần dọn đám gia súc bốc mùi khỏi góc bỏ hoang của quảng trường địa phương..."
  governor_contract_event.2021.desc_military: "Âm thanh chè chén ăn mừng vọng lên từ doanh trại; với của cải ta đã đổ vào họ, lòng trung thành và khả năng chiến đấu của binh sĩ ta được bảo đảm vững chắc! Các đội trưởng dẫn đầu đám còn lại hô vang tên ta."
  governor_contract_event.2021.desc_food: "Ngay cả kẻ ăn xin hèn mọn nhất tại [task_contract_location.GetNameNoTier] cũng được ngủ với chiếc bụng no trong đêm nay. Việc ta phân phát ngũ cốc khiến các gia đình rạng rỡ chất đầy bó lúa lên xà nhà; cả vùng ngập tràn mùi bánh mì mới nướng."
  governor_contract_event.2021.desc: "\n\nQuyết định đầu tư này đã chứng tỏ là sáng suốt. Mới chỉ có những kết quả ban đầu, ta đã được dân chúng dưới quyền ca ngợi và tôn vinh."
  governor_contract_event.2021.a: "Một công việc đáng tự hào."
  governor_contract_event.2022.t: "$prov_investment$: Thất bại"
  governor_contract_event.2022.desc_monument: "Ta đã thông báo cho chính quyền trung ương về công trình mới nhất của mình — bức tượng xa hoa đính đầy châu báu... nhưng không nhận được hồi đáp nào. [emperor.GetTitledFirstName] chẳng buồn vinh danh hành động trung thành của ta, nếu như [emperor.GetSheHe] thậm chí có biết đến nó."
  governor_contract_event.2022.desc_traders: "Với việc điều chỉnh thuế khóa và thuế quan, giới thương nhân hân hoan trước lợi nhuận mới... nhưng nguồn thu của ta thì không tăng. Tệ hơn nữa, thợ thủ công và lao động địa phương than phiền về chính quyền của ta: trước làn sóng hàng nhập khẩu giá rẻ, họ chật vật tiêu thụ sản phẩm."
  governor_contract_event.2022.desc_military: "Binh lính đã không mấy #EMP điềm tĩnh#! trước khoản thưởng lương đột ngột của mình... trong cơn phóng túng hoang dại, họ ném sạch tiền bạc vào những cuộc truy hoan trụy lạc.\n\nGiờ đây, những đội trưởng được yêu mến phải đối mặt với cáo buộc hình sự, binh sĩ mang thương tích vì ẩu đả với dân địa phương, và bằng cách nào đó, ta lại bị quy trách nhiệm cho tất cả."
  governor_contract_event.2022.desc: "\n\nĐáng buồn thay, mọi thứ đã không diễn ra như ta mong đợi. Khoản thặng dư của tỉnh đã tan biến."
  governor_contract_event.2022.a: "Thật đáng tiếc."
  governor_contract_event.2020.success: "Khoản đầu tư đã thành công"
  governor_contract_event.2020.failure: "Khoản đầu tư đã thất bại"
  ep3_contract_infrastructure_modifier: "Phát triển hạ tầng"
  ep3_contract_infrastructure_modifier_desc: "Đường sá, trạm chuyển tin, hệ thống cấp nước — mọi thứ một hạt cần để tăng trưởng."
  ep3_food_distribution_modifier: "Phân phối lương thực"
  ep3_food_distribution_modifier_desc: "Khoản tiền thặng dư của chính quyền địa phương được dùng để nhập khẩu lương thực giá rẻ cho đại bộ phận dân chúng."
  ep3_invested_military_modifier: "Quân đội được tăng cường"
  ep3_invested_military_modifier_desc: "Một lượng vàng đáng kể đã được đầu tư cho lực lượng đồn trú tại hạt này."

  raiding_peasants: "Nông dân cướp phá"
  raiding_peasants_contract: "$raiding_peasants$"
  raiding_peasants_desc: "Một nhóm nông dân tự phát đã tiến hành cướp phá lãnh thổ của ta từ bên kia biên giới."
  raiding_peasants_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2030.t: "$raiding_peasants$"
  governor_contract_event.2030.desc: "Những tin tức đáng lo đã đến từ [ongoing_destination.GetName].\n\nDường như một nhóm nông dân địa phương đã tự vũ trang và, trong những toán hỗn loạn, vượt biên giới tiến vào lãnh thổ của [neighbor.GetCulture.GetNameNoTooltip].\n\nBản thân hành vi này khó gây ra vấn đề ngoại giao, nhưng hành động quân sự — cũng như việc sở hữu vũ khí — là đặc quyền của quân đội. Vì vậy, mọi vi phạm pháp luật đều phải được điều tra."
  governor_contract_event.2030.a: "Ta cần tận mắt chứng kiến."
  governor_contract_event.2030.a.tt: "Ngài đến [ongoing_destination.GetNameNoTooltip]"
  governor_contract_event.2031.desc: "Khi đến [ongoing_destination.GetName], thông tin của ta được xác nhận là chính xác. Không mất nhiều thời gian để vệ binh của ta gom được một nhóm dân địa phương khá đông, tất cả đều mang theo vũ khí trái phép.\n\n\"Chúng Ta cần chúng để bảo vệ bản thân và gia đình!\" họ phản đối. \"Đám vô lại [neighbor.GetCulture.GetNameNoTooltip] kia không thể tin được! Chúng cần học cách tránh xa chúng Ta!\""
  governor_contract_event.2031.a: "Tất cả các ngươi sẽ làm việc cho ta — hợp pháp."
  governor_contract_event.2031.b: "Cướp bóc bị trừng phạt bằng cái chết."
  governor_contract_event.2031.c: "Các ngươi có cần chút giúp đỡ #EMP không chính thức#! không?"
  governor_contract_event.2031.d: "Các ngươi lẽ ra phải đang làm ruộng."
  governor_contract_event.2031.e: "Giao nộp toàn bộ số vàng đã cướp được rồi cút đi!"
  ep3_peasant_border_raids_modifier: "Nông dân tập kích biên giới"
  ep3_peasant_border_raids_modifier_desc: "Nông dân địa phương đã tự vũ trang và tích cực bảo vệ biên giới của mình."
  ep3_peasant_workers_modifier: "Trở lại đồng ruộng"
  ep3_peasant_workers_modifier_desc: "Dân binh địa phương đã bị giải tán và nông dân được đưa trở lại làm ruộng."

  wild_predators: "Mãnh thú hung dữ"
  wild_predators_contract: "$wild_predators$"
  wild_predators_desc: "Thú hoang tàn phá các loài vật trong khu săn bắn địa phương và quấy nhiễu dân cư. Các vụ chạm trán thường xuyên được báo cáo gần làng mạc; những sự cố đẫm máu trong chuồng trại."
  wild_predators_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2040.t: "$wild_predators$"
  governor_contract_event.2040.desc: "Tin tức từ [ongoing_destination.GetName] thật thảm khốc và được kể lại trong nỗi sợ hãi.\n\nĐộng vật hoang dã địa phương ngày càng hiếm hoi, số lượng sụt giảm nghiêm trọng do sự gia tăng của loài [ROOT.Char.Custom('RegionalFerociousAnimal')]. Những con quái vật này, ngày càng táo tợn nhờ số lượng đông đảo, không còn thỏa mãn với việc tàn sát nơi hoang dã mà nay đã lảng vảng quanh các khu định cư của dân ta.\n\nGia súc và trẻ em được trông chừng cẩn mật, nhưng dẫu vậy... vùng ven của [ongoing_destination.GetName] vẫn không còn an toàn."
  governor_contract_event.2040.a: "Ta phải làm gì đó."
  governor_contract_event.2041.desc: "Sự hiện diện của ta tại [ongoing_destination.GetName] bao trùm bởi bi kịch và lo âu. Dân địa phương thì thầm rằng — ngay trong khu chuồng an toàn — một con [ROOT.Char.Custom('RegionalFarmAnimal')] quý giá đã bị xé xác bởi một con [ROOT.Char.Custom('RegionalFerociousAnimal')] khổng lồ.\n\nMột vòng cưỡi ngựa nhanh quanh vùng cho thấy những lời này hoàn toàn đáng tin: thú rừng hiếm khi xuất hiện, và dấu vết tấn công của loài [ROOT.Char.Custom('RegionalFerociousAnimal')] có ở khắp nơi.\n\nNgười ta nói rằng một đứa trẻ sơ sinh đã mất tích. Người ta nói rằng những mảnh xương bé nhỏ, vỡ vụn đã được tìm thấy."
  governor_contract_event.2041.a: "Ta biết đúng những người chuyên nghiệp cần dùng."
  governor_contract_event.2041.a.tt: "Ngài cử các tay đầu độc lành nghề dùng mồi để có chọn lọc tiêu diệt những mãnh thú mất kiểm soát"
  governor_contract_event.2041.b: "Ta sẽ tự tay săn lũ quái vật!"
  governor_contract_event.2041.c: "Chúng ta cần thêm thợ săn."
  governor_contract_event.2041.d: "Nông dân địa phương có thể tự xử lý."
  governor_contract_event.2041.e: "Ta luôn muốn có một thú cưng ngoại lai..."
  governor_contract_event.2041.e.tt: "Cử vệ binh bắt giữ càng nhiều con thú càng tốt"
  governor_contract_event.2041.f: "Cứ nhập và thả thêm con mồi!"
  governor_contract_event.2041.b.success: "Cuộc đại săn diễn ra suôn sẻ"
  governor_contract_event.2041.b.fail: "Đội săn của Ngài rơi vào hỗn loạn"
  governor_contract_event.2041.c.success: "Nhiều tay bẫy kéo đến săn lũ quái thú"
  governor_contract_event.2041.c.fail: "Ít ai hứng thú truy đuổi một con [ROOT.Char.Custom('RegionalFerociousAnimal')]"
  governor_contract_event.2041.d.success: "Kinh nghiệm rừng núi địa phương phát huy tác dụng"
  governor_contract_event.2041.d.fail: "Nông dân chỉ là mồi sống"
  governor_contract_event.2041.e.success: "Mọi con [ROOT.Char.Custom('RegionalFerociousAnimal')] đều bị nhốt lồng"
  governor_contract_event.2041.e.fail: "Chuồng trại của Ngài vẫn trống rỗng"

  governor_contract_event.2042.desc: "Chiến thắng!\n\n[ongoing_destination.GetName] đã được giải phóng khỏi những nỗi kinh hoàng của chốn hoang dã, thanh trừng hoàn toàn vấn nạn [ROOT.Char.Custom('RegionalFerociousAnimal')] — sự can thiệp kiên quyết của ta đã giải cứu dân thường khỏi nỗi sợ hãi!\n\nTại vùng [ongoing_destination.GetTerrain.GetNameNoTooltip|l] nơi ta đang đứng, những sinh vật chăn thả vô tội của [ROOT.Char.GetFaith.HighGodNamePossessive], những loài ăn cỏ nhút nhát của Ngài, sẽ sớm lại được tự do rong ruổi."
  governor_contract_event.2042.a: "Ta nhận toàn bộ công lao cho chiến thắng này."
  governor_contract_event.2043.desc: "Tiếng răng nghiến ken két, móng vuốt sắc như mũi giáo, những cái hàm nhớp nháp khổng lồ ngay phía sau — mù quáng vì kinh hoàng, chúng ta bỏ chạy khỏi vùng [ongoing_destination.GetTerrain.GetNameNoTooltip|l] của [ongoing_destination.GetName], chỉ vừa kịp thoát chết!\n\nMối họa [ROOT.Char.Custom('RegionalFerociousAnimal')] tại đây quả thực không thể ngăn cản. Có lẽ, đó thậm chí là những Ta tớ hoang dã của [ROOT.Char.GetFaith.DevilName] đang ám lấy thôn xóm này chăng?\n\n[ROOT.Char.Custom('CulturalCurse')|U]! Ta đành phải rời đi, bỏ mặc dân địa phương tiếp tục sống trong nỗi kinh hoàng do lũ quái vật gây ra..."
  governor_contract_event.2043.a: "Ta chỉ có thể mong chúng bắt đầu #EMP ăn thịt lẫn nhau...#!"
  ep3_abundant_game_modifier: "Thú săn dồi dào"
  ep3_abundant_game_modifier_desc: "Thú săn phong phú trong khu vực này, khiến các cuộc Săn bắn đạt kết quả cao hơn."
  ep3_wild_predators_modifier: "$wild_predators$"
  ep3_wild_predators_modifier_desc: "Số lượng lớn thú săn mồi hoang dã rình rập vùng đất này, tàn sát cả nông dân lẫn thú săn."
  ep3_ferocious_pets_modifier: "Thú cưng hung dữ"
  ep3_ferocious_pets_modifier_desc: "Nhân vật này đã hình thành một thú vui xa xỉ với những loài thú cưng hung tợn."

  evil_presence: "Sự hiện diện tà ác"
  evil_presence_contract: "$evil_presence$"
  evil_presence_desc: "Những thường dân hoảng sợ cho rằng họ đang bị một thế lực tà ác bức hại. Không thể trấn an được đàn chiên khốn khổ này, giới giáo sĩ địa phương thỉnh cầu sự can thiệp của Ngài."
  evil_presence_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2050.t: "$evil_presence$"
  governor_contract_event.2050.desc: "Các [ongoing_destination.GetCounty.GetFaith.PriestNeuterPlural] địa phương tại [ongoing_destination.GetName] hốt hoảng viết thư cho ta, cố giành lấy sự chú ý của ta bằng những lời cảnh báo rùng rợn về bạo lực sắp xảy ra.\n\nDân chúng địa phương đang phát cuồng vì một chuỗi sự kiện đáng ngờ: những điềm gở như"
  governor_contract_event.2051.desc_a: "cá bị hỏng,"
  governor_contract_event.2051.desc_b: "những cơn sốt,"
  governor_contract_event.2051.desc_c: "vợ chồng xung đột,"
  governor_contract_event.2051.desc_d: "trẻ em thức giấc giữa đêm trong tiếng la hét,"
  governor_contract_event.2051.desc_e: "những cơn đau đầu hàng loạt,"
  governor_contract_event.2051.desc_f: "các cuộc săn thất bại,"
  governor_contract_event.2051.desc_g: "bò mắc bệnh,"
  governor_contract_event.2051.desc_h: "sản xuất đình trệ,"
  governor_contract_event.2051.desc_i: "ruộng đồng bị tàn phá,"
  governor_contract_event.2051.desc_l: "và những ảo ảnh kỳ quái về chó."
  governor_contract_event.2051.desc_m: "và những ảo ảnh kỳ quái về ngựa."
  governor_contract_event.2051.desc_n: "và những ảo ảnh kỳ quái về đại bàng."
  governor_contract_event.2051.desc_o: "và những ảo ảnh kỳ quái về mèo."
  governor_contract_event.2051.desc_p: "và những ảo ảnh kỳ quái về ếch."
  governor_contract_event.2051.desc_q: "và những ảo ảnh kỳ quái về rắn."
  governor_contract_event.2051.desc_end: "\n\nNgười dân khiếp sợ rằng một con quỷ — hay một thế lực tà ác không thể gọi tên — đã cư ngụ giữa họ."
  governor_contract_event.2050.a: "E rằng cần phải tiến hành điều tra."
  governor_contract_event.2051.desc: "Những người dân lương thiện của [ongoing_destination.GetName] đang phát điên vì sợ hãi.\n\nHoảng loạn và hoang tưởng lan tràn. Từ những khu nhà ổ chuột đến cả [ROOT.Char.Custom('ResidenceBuilding')] của viên quan địa phương, đoàn tùy tùng của ta đều gặp những cánh cửa đóng chặt, những lời buộc tội khủng khiếp nhằm vào Bạn Bè và người thân, và những công dân lương thiện nhìn thấy quái vật trong mọi bóng tối. Các hoạt động sản xuất gần như tê liệt hoàn toàn.\n\nBằng cách này hay cách khác, tình trạng này phải chấm dứt. Khi niềm tin vào sự bảo hộ của [ongoing_destination.GetCounty.GetFaith.HighGodNamePossessive] đã không còn... những sợi dây gắn kết xã hội này khó có thể chịu đựng thêm được nữa."
  governor_contract_event.2051.a: "Ta sẽ yêu cầu một nhà trừ tà chính thức từ kinh đô."
  governor_contract_event.2051.b: "Mời một [ROOT.Char.GetFaith.PriestNeuter] lừng danh đến làm lễ trừ tà."
  governor_contract_event.2051.c: "Ắt hẳn phải có một pháp sư tà ác!"
  governor_contract_event.2051.d: "Các bô lão của các ngươi đề xuất điều gì?"
  governor_contract_event.2051.e: "Các ngươi chỉ đang nhìn thấy ảo giác thôi. Vớ vẩn."
  ep3_church_investigation_modifier: "Điều tra của Giáo hội"
  ep3_church_investigation_modifier_desc: "Giáo hội đã can dự vào một cuộc điều tra nhằm truy tìm những kẻ có khả năng sử dụng ma thuật quỷ dữ."
  ep3_rationalist_gov_modifier: "Chủ nghĩa duy lý"
  ep3_rationalist_gov_modifier_desc: "Nhân vật này có danh tiếng là đề cao lý trí hơn tôn giáo — một quan điểm khá không được ưa chuộng."
  ep3_local_practices_modifier: "Bảo hộ tập tục truyền thống"
  ep3_local_practices_modifier_desc: "Vị tổng trấn địa phương đã công khai ủng hộ các tập tục truyền thống — thứ mà một số người gọi là mê tín — để đối phó với quỷ dữ."

  miraculous_healing: "Chữa lành kỳ diệu"
  miraculous_healing_contract: "$miraculous_healing$"
  miraculous_healing_desc: "Một kẻ tàn tật địa phương nhận được vô số khoản cúng dường gồm thánh tích và đồ quý giá, và mỗi lần đều tuyên bố mình được phục hồi sức khỏe nhờ ân sủng thiêng liêng. Những người bố thí ngày càng tỏ ra khó chịu."
  miraculous_healing_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2060.t: "$miraculous_healing$"
  governor_contract_event.2060.desc: "Một vụ việc thú vị, cùng một cá nhân hết sức khác thường, được đưa đến trước mặt ta để phân xử.\n\nTên [scammer.GetWomanMan] này, [scammer.GetName], bị cáo buộc là kẻ giả tàn phế: một tay lừa đảo sống bằng cách lừa gạt lòng tin của các tín đồ. [scammer.GetSheHe|U] [scammer.Custom('quirk_pos_present')] đầy duyên dáng, khi những thánh tích được hiến tặng được bày ra trước mặt ta.\n\nCác nhân chứng khẳng định đã thấy \"kẻ mù\" này ngồi trước bậc thềm của các [ROOT.Char.GetFaith.HouseOfWorshipPlural], kêu gọi lòng trắc ẩn của họ; [scammer.GetSheHe] làm ấm lòng các cộng đoàn bằng việc được chữa lành một cách kỳ diệu, lần này đến lần khác... nhưng chỉ sau khi nhận được tiền xu hoặc thánh vật."
  governor_contract_event.2060.a: "Tên lừa đảo này sẽ bị trừng phạt một cách nêu gương."
  governor_contract_event.2060.b: "Ta có thể cần một người có #EMP óc sáng tạo#! như ngươi."
  governor_contract_event.2060.c: "Trả lại thánh tích, và ta sẽ coi như chuyện này chưa từng xảy ra."
  governor_contract_event.2060.d: "Một khoản phạt nghiêm khắc là hình phạt thích đáng."
  governor_contract_event.2060.e: "Sám hối duy nhất có thể là ngục tù."
  governor_contract_event.2060.f: "[ROOT.Char.GetFaith.HighGodName] hành động theo những con đường huyền nhiệm."

  buried_treasure: "Kho báu chôn giấu"
  buried_treasure_contract: "$buried_treasure$"
  buried_treasure_desc: "Một nông dân địa phương đã phát hiện một kho vàng bị chôn vùi, và tranh chấp nảy sinh về việc nó thuộc về ai."
  buried_treasure_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2070.t: "$buried_treasure$"
  governor_contract_event.2070.desc: "Các bô lão của một cộng đồng nhỏ gần [ongoing_destination.GetName] đã liên hệ với ta để xin phán quyết về một sự việc hiếm gặp.\n\nMột gia đình nông dân đã đào được một kho tiền vàng đáng kể trong lúc cày ruộng! Hàng xóm của họ lập tức chia thành phe phái: một số tin rằng kho vàng nên thuộc về người phát hiện, trong khi số khác cho rằng món lợi bất ngờ này phải được chia cho cả làng.\n\nLời phán của một bậc thẩm quyền cao hơn có thể dập tắt lòng tham của những con người chất phác này, và ngăn họ rơi vào bạo lực vụn vặt."
  governor_contract_event.2070.a: "Quả là một sự việc hiếu kỳ!"
  governor_contract_event.2071.desc: "Khi đến [ongoing_destination.GetName], ta được giới thiệu với người nông dân tìm thấy kho báu — một [peasant.GetWomanMan] tên là [peasant.GetFirstName] — cùng với chính kho báu đó.\n\n"
  governor_contract_event.2071.desc.byz: "Đó là một chiếc rương trông có vẻ cổ xưa chứa đầy những đồng [Glossary( 'aurei', 'AUREUS_GLOSS')] vàng, tất cả đều được đúc dưới cùng một hoàng đế. Có thể đoán được rằng đây có thể là ngân khố của một quân đoàn cổ đại; có lẽ, thậm chí là lương trả cho một năm."
  governor_contract_event.2071.desc.fallback: "Đó là một chiếc rương trông khá bình thường, chứa đầy các loại tiền vàng được đúc trong nhiều thời kỳ khác nhau trên khắp vùng. Ta đoán rằng người nông dân này đã tình cờ phát hiện một kho chôn giấu của một băng cướp đã chết từ lâu."
  governor_contract_event.2071.desc.end: "\n\n[peasant.GetFirstNameNoTooltip] — và dường như mọi nông nô trong cộng đồng của [peasant.GetHerHis] — đều dõi theo đầy mong đợi, nín thở: \"Nên làm gì với kho báu này, thưa [ROOT.Char.GetTitleAsName] anh minh?\""
  governor_contract_event.2071.a: "Hãy tái đầu tư số vàng này vào chính cộng đồng của các ngươi."
  governor_contract_event.2071.b: "Mọi khoản thu nhập đặc biệt đều phải chịu thuế. #EMP Nặng.#!"
  governor_contract_event.2071.c: "Những gì tìm thấy trên đất công thuộc về lãnh thổ."
  governor_contract_event.2071.d: "Theo pháp luật, kho báu này là của các ngươi."
  governor_contract_event.2071.e: "Kho báu này thuộc về toàn bộ cộng đồng."
  AUREUS_GLOSS: "Aureus là một đồng tiền vàng được phát hành thường xuyên từ cuối thời Cộng hòa La Mã cho đến đầu thế kỷ IV sau Công nguyên, khi nó được thay thế bằng solidus. Ban đầu, một aureus trị giá 25 denarius bạc, nhưng do lạm phát phi mã của Hậu Đế quốc, đồng solidus mới có giá trị tương đương tới 275000 denarius!"
  ep3_treasure_invest_modifier: "Kho báu được đầu tư"
  ep3_treasure_invest_modifier_desc: "Một kho vàng đã được chuyển hóa thành các khoản đầu tư địa phương, mang lại lợi ích cho toàn bộ hạt."
  ep3_treasure_distributed_modifier: "Kho báu được phân phối"
  ep3_treasure_distributed_modifier_desc: "Dân chúng địa phương được hưởng một mức độ thịnh vượng từ việc tái phân phối kho báu vừa được phát hiện."

  public_land: "Đất Công"
  public_land_contract: "$public_land$"
  public_land_desc: "Phớt lờ trắng trợn các quyền truyền thống của dân thường, một đại địa chủ địa phương đang chiếm giữ đất đai một cách phi pháp."
  public_land_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2080.t: "$public_land$"
  governor_contract_event.2080.desc: "Theo các báo cáo từ [ongoing_destination.GetName], một đại địa chủ địa phương, [magnate.GetTitledFirstName], đã dùng đủ mọi thủ đoạn để mở rộng diện tích đất đai mà [magnate.GetSheHe] trực tiếp sở hữu.\n\nRõ ràng, không phải tất cả các phương thức đó đều hợp pháp, và một số thì hoàn toàn #EMP đáng khinh#!."
  governor_contract_event.2080.a: "Ta nên can thiệp."
  governor_contract_event.2081.desc: "Khi ta đến [ongoing_destination.GetName], ta lập tức được [magnate.GetTitledFirstName] tiếp đón tại dinh thự của [magnate.GetHerHis].\n\n\"Đừng nói chuyện vặt vãnh,\" ta mở lời một cách nghiêm khắc. \"Có rất nhiều sai phạm và giao dịch phi pháp lộ ra khi người ta xem xét kỹ hơn các thương vụ đất đai gần đây của ngài.\"\n\n[magnate.GetFirstNameNoTooltip] tỏ ra ngượng ngùng, nhưng không hề ăn năn. \"#EMP Bạn Tốt của Ta#!, ngài biết đấy mà... thủ tục hành chính thì rườm rà, còn đám nông dân thất học thì quá ngu dốt và chậm chạp trong việc hiểu luật pháp. Đôi khi người ta chỉ muốn nhanh chóng giải quyết công việc! Ngài có thể trách Ta được sao?\""
  governor_contract_event.2081.a: "Đất đai sẽ được chia cho các tiểu điền chủ."
  governor_contract_event.2081.b: "$ep3_land_confiscate_modifier_desc$"
  governor_contract_event.2081.c: "Ta có thể quên đi sự cố này với một khoản #EMP quyên góp#! thích đáng..."
  governor_contract_event.2081.d: "Hãy giả vờ như chuyện này chưa từng xảy ra, #EMP Ngài hiền#!!"
  governor_contract_event.2081.e: "Cứ giữ đất, nhưng để dân địa phương canh tác."
  ep3_lands_reinstated_modifier: "Tiểu Điền Chủ"
  ep3_lands_reinstated_modifier_desc: "Sự hiện diện của các tiểu điền chủ đã được khôi phục trong khu vực."
  ep3_land_confiscate_modifier: "Đất Bị Tịch Thu"
  ep3_land_confiscate_modifier_desc: "Đây là vị trí hoàn hảo để mở rộng điền trang của ta!"

  mad_prophet: "Nhà Tiên Tri Điên Loạn"
  mad_prophet_contract: "$mad_prophet$"
  mad_prophet_desc: "Một kẻ tự xưng là tiên tri đang gieo rắc nỗi kinh hoàng cho cả một quận với những lời tiên đoán ngày tận thế."
  mad_prophet_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2090.t: "$mad_prophet$"
  governor_contract_event.2090.desc: "Ta đã nhận được những tin tức đáng lo ngại từ [ongoing_destination.GetName].\n\nRõ ràng, toàn bộ [ongoing_destination.GetTitle.GetTierAsNameNoTooltip|l] đang rơi vào hỗn loạn vì một kẻ tự xưng là tiên tri đang lan truyền nỗi hoảng loạn với những lời tiên đoán lố bịch về sự cận kề của Ngày Tận Thế.\n\nNhiều khả năng đây chỉ là những lời mê sảng của một kẻ điên, nhưng khi những lời mê sảng ấy đe dọa trật tự và an ninh công cộng, thì đó là bổn phận của ta phải can thiệp."
  governor_contract_event.2090.a: "Ta cần điều tra tình hình."
  governor_contract_event.2091.desc: "\"#EMP NGÀY TẬN THẾ ĐÃ GẦN! HÃY SÁM HỐI! SÁM HỐI NGAY KẺO BỊ TRỪNG PHẠT!#!\"\n\nKhi ta đến [ongoing_destination.GetName], ta dễ dàng tìm thấy kẻ tiên tri. Xuyên qua đám nông nô vừa kính sợ vừa tò mò, ta lần theo tiếng gào thét đến tận nguồn cơn.\n\nMột [prophet.GetWomanMan] khoác áo rách rưới đang quát tháo đám đông hoang mang và sợ hãi bằng cơn thịnh nộ được cho là đến từ thần linh. Lời nói của [prophet.GetNamePossessive] hiện thực hóa những nỗi lo sợ mơ hồ của họ; [prophet.GetSheHe] đánh trúng nỗi sợ hỗn loạn, nỗi kinh hãi về [prophet.GetFaith.NegativeAfterLife], và niềm tin chung của chúng ta vào sự kết thúc của vạn vật."
  governor_contract_event.2091.a: "Mọi thứ đều trong tầm kiểm soát!"
  governor_contract_event.2091.a.tt: "Uy quyền, tài hùng biện và sự điềm tĩnh của Ngài giúp trấn an đám đông."
  governor_contract_event.2091.b: "Chúng ta phải bịt miệng [prophet.GetHerHim]."
  governor_contract_event.2091.c: "Lính đâu, bắt kẻ gây rối này lại."
  governor_contract_event.2091.d: "Ngươi sai rồi, [prophet.GetFirstNameNoTooltip], và ta sẽ chứng minh điều đó!"
  governor_contract_event.2091.e: "Chỉ có cầu nguyện mới cứu được chúng ta."
  governor_contract_event.2091.e.tt: "Ngài tổ chức một cuộc rước tôn giáo quy mô lớn."
  governor_contract_event.2091.f: "Giáo sĩ địa phương sẽ xử lý việc này."
  governor_contract_event.2092.desc_persecute: "Ta vui mừng nhận thấy rằng binh lính của ta đã thành công trong việc giải tán đám đông và chấm dứt toàn bộ sự nhảm nhí này.\n\nNgười dân [ongoing_destination.GetName] có thể yên tâm rằng họ đang sống trong một đế quốc văn minh, mộ đạo và hùng mạnh, miễn nhiễm với mê tín và an toàn trước hỗn loạn!"
  governor_contract_event.2092.desc_debate: "\"... Và điều này chứng minh một cách dứt khoát rằng ngày tận thế #EMP không#! hề cận kề, và cơn thịnh nộ của [ROOT.Char.GetFaith.HighGodNamePossessive] #EMP không#! giáng xuống chúng ta.\"\n\nKẻ tiên tri câm lặng trước bài diễn giải uyên bác của ta; đám đông vỗ tay tán thưởng một cuộc tranh luận tôn giáo hay ho, rồi lần lượt giải tán về nhà."
  governor_contract_event.2092.a: "Ta thích cảm giác hoàn thành tốt công việc!"
  governor_contract_event.2093.desc_persecute: "Đáng tiếc thay, việc cho binh lính xông vào không phải là lựa chọn đúng đắn.\n\nDân chúng hoảng loạn đã vây quanh kẻ tiên tri để bảo vệ [prophet.GetHerHim], và nhiều người — cả binh lính lẫn thường dân — bị thương trong cuộc ẩu đả sau đó.\n\nKẻ tiên tri gây rối đã lợi dụng sự hỗn loạn để trốn thoát, và biến mất không để lại dấu vết."
  governor_contract_event.2093.desc_debate: "\"Vậy thì, theo bản chất của [ROOT.Char.GetFaith.HighGodName]... Không — từ đúng là #EMP bản thể#!, phải không? Hay là năng lượng? Dù sao thì, cái gì tồn tại thì không thể không tồn tại. Hay đại loại thế...\"\n\nTa không cần nhìn thấy vẻ bối rối trên gương mặt những người trước mặt, cũng không cần nghe tiếng cười khúc khích của đối thủ để biết rằng ta đã tự biến mình thành trò cười.\n\nChắc dân địa phương sẽ tự xoay xở được vấn đề này. Ta rời đi."
  governor_contract_event.2093.a: "Thật là một màn trình diễn đáng xấu hổ."
  ep3_religiously_pacified_modifier: "Tôn Giáo Được Trấn An"
  ep3_religiously_pacified_modifier_desc: "Đức tin và lòng tin của dân địa phương vào các thể chế đã được củng cố nhờ sự can thiệp hiệu quả chống lại một giáo phái tận thế mới manh nha."
  ep3_doom_repressed_modifier: "Giáo Phái Tiên Tri Bị Đàn Áp"
  ep3_doom_repressed_modifier_desc: "Một giáo phái tận thế do một nhà tiên tri điên loạn lãnh đạo đã bị tiêu diệt bằng vũ lực."
  ep3_religious_debate_modifier: "Thắng Tranh Luận Tôn Giáo"
  ep3_religious_debate_modifier_desc: "Nhân vật này đã tỏa sáng trong một cuộc tranh luận tôn giáo với một nhà tiên tri điên loạn, cho dân chúng thấy sự sai lầm trong niềm tin của họ."

  titles_sale: "Mua Bán Chức Tước"
  titles_sale_contract: "$titles_sale$"
  titles_sale_desc: "Một giáo sĩ bị tố cáo đang bán các chức tước và chức vụ tôn giáo cho kẻ trả giá cao nhất. Một hành vi cực kỳ phi pháp."
  titles_sale_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2100.t: "$titles_sale$"
  governor_contract_event.2100.desc: "Vụ việc mà ta được yêu cầu phân xử hôm nay khá tế nhị: một [priest.GetFaith.PriestNeuter] địa phương đã bị bắt quả tang chào bán các chức tước và chức vụ tôn giáo cho những đứa con không đủ tư cách của các hào phú trong vùng.\n\n[priest.GetWomanMan] đó, [priest.GetName], đã làm đầy túi tiền của [priest.GetHerHis] bằng cái giá phải trả từ [priest.GetFaith.HighGodNamePossessive] và các bề trên của [priest.GetHerHis].\n\nHành vi này — hiển nhiên — là hoàn toàn phi pháp. Do tính chất tôn giáo của cả tội danh lẫn những người liên quan, vụ việc cũng vô cùng nhạy cảm. Có nguy cơ rất lớn rằng, với sự can thiệp cần thiết của ta vào công việc của họ, giới giáo sĩ sẽ tỏ ra bất mãn."
  governor_contract_event.2100.a: "Số vàng này nên được quyên góp cho các cơ sở tôn giáo."
  governor_contract_event.2100.b: "Số vàng thu được bất hợp pháp sẽ bị tịch thu."
  governor_contract_event.2100.c: "Hãy sám hối! Và hoàn trả tiền cho những kẻ đã mua chức."
  governor_contract_event.2100.d: "Ta có thể cần một ân huệ từ người như ngươi..."
  ep3_repayed_church_titles_modifier: "Vàng Được Tái Phân Bổ"
  ep3_repayed_church_titles_modifier_desc: "Số vàng tích lũy từ việc bán trái phép các chức vụ tôn giáo đã được sử dụng đúng mục đích bởi những chủ thể tôn giáo hợp pháp."

  hungry_times: "Thời Kỳ Đói Kém"
  hungry_times_contract: "$hungry_times$"
  hungry_times_desc: "Một trận ôn dịch gần đây đã gây ra nạn đói, đẩy một số người dân địa phương vào những hành động #EMP tuyệt vọng#! để sinh tồn."
  hungry_times_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2110.t: "$hungry_times$"
  governor_contract_event.2110.desc: "Tin tức từ [ongoing_destination.GetName] đặc biệt đáng lo ngại.\n\nCác biện pháp cứu trợ của chính quyền sau đợt ôn dịch gần đây dường như không đủ hiệu quả; nạn đói đã giáng xuống các khu dân cư trong vùng. Một số cư dân đã bị dồn đến những hành vi tuyệt vọng và ghê tởm để sống sót."
  governor_contract_event.2110.desc_murder: "\n\nTheo báo cáo này, một số nông dân đã bị bắt vì giết và xẻ thịt đồng loại để ăn!"
  governor_contract_event.2110.desc_cannibal: "\n\nTheo báo cáo này, một số nông dân đã bị bắt vì ăn thịt những người đồng loại chết đói!"
  governor_contract_event.2110.desc_animal: "\n\nTheo báo cáo này, một số nông dân đã bị bắt vì giết và ăn các loài động vật bị coi là ô uế về mặt tôn giáo, qua đó khiến giới giáo sĩ địa phương phẫn nộ."
  governor_contract_event.2110.a: "Ta cần nghe rõ hơn về chuyện này."
  governor_contract_event.2111.desc: "Khi ta đến [ongoing_destination.GetName], những kẻ bị cáo buộc đang chờ sẵn trong xiềng xích, mắt cúi gằm, quần áo rách nát và vấy máu.\n\nCác bị cáo, dẫn đầu bởi [cannibal.GetFirstName], bị xích lại và run rẩy, cúi đầu trước một đám đông gầy gò với gương mặt hốc hác đang gào thét. Những nắm tay xương xẩu vung lên; những giọng nói khàn đặc gào rú đòi một bản án làm gương.\n\nTa được cho xem tang vật... những xương đùi bị chẻ đôi và những chiếc đầu thối rữa, bị chặt lìa. Một điều gì đó kinh khủng đã xảy ra nơi đây; đó thực sự là một sự ô uế trước mặt [ROOT.Char.GetFaith.HighGodName]."
  governor_contract_event.2111.a: "Ta đã không bao giờ nên bỏ mặc cộng đồng này."
  governor_contract_event.2111.b: "Những tội ác tuyệt vọng nhất đòi hỏi sự khoan dung lớn lao nhất."
  governor_contract_event.2111.c: "Kẻ có tội phải trả giá. Luật pháp phán như vậy."
  governor_contract_event.2111.d: "Cả cộng đồng này đều bị vấy bẩn bởi sự ô uế này!"
  governor_contract_event.2111.e: "Những tội ác ghê tởm như vậy xứng đáng với sự quan tâm tuyệt đối của ta."
  ep3_rebuild_effort_modifier: "Nỗ Lực Tái Thiết Toàn Diện"
  ep3_rebuild_effort_modifier_desc: "Vị tổng trấn địa phương đang tập trung vào việc tái thiết khu vực này sau khi nó bị tàn phá nặng nề bởi ôn dịch."
  ep3_tight_control_modifier: "Kiểm Soát Gắt Gao"
  ep3_tight_control_modifier_desc: "Một số sự kiện #EMP đáng tiếc#! trong quận này đã buộc tổng trấn phải đặt toàn bộ khu vực dưới sự giám sát đặc biệt."

  wartime_measures: "Biện Pháp Thời Chiến"
  wartime_measures_contract: "$wartime_measures$"
  wartime_measures_desc: "Chủ quân của ta đang trong chiến tranh. Một mệnh lệnh chính thức vừa được gửi đến từ kinh đô: hãy cung cấp mọi sự hỗ trợ có thể cho các đơn vị quân đội đi ngang qua."
  wartime_measures_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_event.2120.t: "$wartime_measures$"
  governor_contract_event.2120.desc: "Một bức thư trông như công văn, mang ấn tín của [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] [ROOT.Char.GetLiege.GetHerselfHimself], đang đợi trong văn phòng của ta hôm nay:\n\n"Các đội quân bất khả chiến bại của [ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseNameNoTier] của chúng ta hành quân chống lại kẻ thù đáng trách. Và nếu quân đội thân thiện băng qua vùng đất được giao cho quyền cai quản của ngài, ngài được lệnh cung cấp mọi sự thoải mái và hỗ trợ thích hợp.\n\nTrong những thời điểm khó khăn này, [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] đánh giá cao nhất những sự hy sinh của các thần dân [ROOT.Char.GetLiege.GetCulture.GetName] của [ROOT.Char.GetLiege.GetHerHis].""
  governor_contract_event.2120.a: "Dĩ nhiên rồi, chúng ta sẽ dốc toàn lực hỗ trợ!"
  governor_contract_event.2120.b: "Nguồn tiếp tế của chúng ta sẵn sàng phục vụ [ROOT.Char.GetLiege.GetTitleAsNamePossessiveNoTooltip]."
  governor_contract_event.2120.c: "Chúng ta sẽ sắp xếp nơi ăn chốn ở cho binh sĩ."
  governor_contract_event.2120.d: "Chắc chắn một ít vàng sẽ giúp ích."
  governor_contract_event.2120.e: "Hệ thống canh gác của chúng ta sẽ hỗ trợ nỗ lực quân sự."
  governor_contract_event.2120.f: "Quan trọng hơn là hỗ trợ người dân của chúng ta vượt qua chiến tranh."
  ep3_war_support_modifier: "Hỗ Trợ Chiến Tranh"
  ep3_war_support_modifier_desc: "Không một nỗ lực nào bị tiết kiệm trong quận này nhằm hỗ trợ các cuộc chiến của chủ quân."
  ep3_war_supplies_modifier: "Tiếp Tế Chiến Tranh"
  ep3_war_supplies_modifier_desc: "Quận này đang dồn toàn bộ tài nguyên để hỗ trợ các đơn vị quân đi qua."
  ep3_war_lodgings_modifier: "Doanh Trại Thời Chiến"
  ep3_war_lodgings_modifier_desc: "Quận này đảm bảo các đơn vị quân đồng minh được chăm sóc chu đáo."
  ep3_war_lookout_modifier: "Trạm Canh Thời Chiến"
  ep3_war_lookout_modifier_desc: "Một hệ thống trạm canh có tổ chức bảo vệ quận này."
  ep3_war_compensations_modifier: "Bù Đắp Thời Chiến"
  ep3_war_compensations_modifier_desc: "Quận này đang nhận được các hỗ trợ đặc biệt để tiếp tục phát triển bất chấp chiến tranh đang diễn ra."
 
