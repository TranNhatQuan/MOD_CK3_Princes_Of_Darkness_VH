  ep3_admin_events.0001.t: "Chuyển Hướng Đại Cuộc"
  ep3_admin_events.0001.intro: "Thư tín của [liege.GetTitledFirstName] đã được gửi đến thông qua một trong những thuộc hạ của [liege.GetHerHis] — thời khắc cho sự thay đổi đã tới.\n\nViên [scribe.GetWomanMan] [scribe.Custom('quirk_pos_present')] trước khi tuyên đọc sắc lệnh:\n\n"
  ep3_admin_events.0001.tribal: ""Chúng ta phải nắm lấy lối sống bộ lạc. Uy tín là công cụ quan trọng nhất mà một nhà cai trị có được. Cướp bóc, chiến đấu, đấu tay đôi. [liege.GetTitleAsNameNoTooltip|U] kêu gọi tất cả thần dân của [liege.GetHerHis] hãy phấn đấu trở thành những người đàn ông và phụ nữ có danh dự đáng ngưỡng mộ.""
  ep3_admin_events.0001.feudal: ""Chính sự trung quân ái quốc giữa người với người mới giữ cho đế chế vững mạnh, chứ không phải dăm ba tờ văn bản rời rạc. [liege.GetTitleAsNameNoTooltip|U] cầu mong tình hữu nghị và lòng trung thành của Ngài, đổi lại [liege.GetSheHe] sẽ bảo hộ an nguy cho Ngài với tư cách là chư hầu của [liege.GetHerHis].""
  ep3_admin_events.0001.clan: ""Một lãnh thổ được cai trị bởi các gia tộc. Sức mạnh của chúng ta chỉ bằng mắt xích yếu nhất. Giang sơn này chính là hình bóng phản chiếu từ các gia tộc: một gia đình đoàn kết sẽ dẫn lối chúng ta đến vinh quang.""
  ep3_admin_events.0001.fallback: ""Cung cách quản trị cũ của chúng ta đã không còn nữa.""
  ep3_admin_events.0001.a: "Việc này ảnh hưởng thế nào đến #EMP ta#!?"
  ep3_admin_events.0001.b: "Ta cần phải chuẩn bị rất nhiều công văn đây."
  ep3_admin_events.0001.c: "Sẽ chẳng có gì thay đổi đâu."
  ep3_admin_change_love: "Đón Nhận Đổi Thay"
  ep3_admin_change_love_desc: "Nhân vật này hoàn toàn không bận tâm đến những hệ lụy từ việc thay đổi bộ máy chính quyền."
  ep3_admin_change_hate: "Kiểm Soát Đổi Thay"
  ep3_admin_change_hate_desc: "Nhân vật này cực kỳ quan ngại về những hệ lụy từ việc thay đổi bộ máy chính quyền."

  ep3_admin_events.0002.t: "[ROOT.Char.GetTitleAsNameNoTooltip] của [governor_title.GetNameNoTierNoTooltip]"
  ep3_admin_events.0002.liege: "[ROOT.Char.GetLiege.GetTitleAsName], với trí tuệ vô biên của [ROOT.Char.GetLiege.GetHerHis], đã quyết định rằng việc cai trị [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] nên thuộc về ta."
  ep3_admin_events.0002.house_dead: "Cùng với sự ra đi của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('previous_governor'))] ta là [previous_governor.GetTitledFirstName], người đã [previous_governor.GetDeathReasonHideKiller], có thông cáo rằng quyền cai quản [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] nay thuộc về ta."
  ep3_admin_events.0002.house_alive: "Với việc thuyên chuyển công tác của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('previous_governor'))] ta là [previous_governor.GetTitledFirstName], có thông cáo rằng quyền cai quản [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] nay thuộc về ta."
  ep3_admin_events.0002.dead: "Cùng với sự ra đi của [previous_governor.GetTitledFirstName], người đã [previous_governor.GetDeathReasonHideKiller], có thông cáo rằng quyền cai quản [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] nay thuộc về ta."
  ep3_admin_events.0002.alive: "Với việc thuyên chuyển công tác của [previous_governor.GetTitledFirstName], có thông cáo rằng quyền cai quản [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] nay thuộc về ta."
  ep3_admin_events.0002.new: "[ROOT.Char.GetLiege.GetTitledFirstName] tuyên bố rằng [ROOT.Char.GetLiege.GetSheHe] đã tin tưởng giao phó quyền cai quản [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] cho ta."
  ep3_admin_events.0002.house: "Giờ đây, trọng trách duy trì sự cai trị của Gia tộc [ROOT.Char.GetHouse.GetBaseName] tại tỉnh bang này nằm trong tay ta."
  ep3_admin_events.0002.appointment_succession: "Những đêm dài vận động hành lang và tìm kiếm hậu thuẫn cuối cùng cũng đã đơm hoa kết trái. Ta được hay biết rằng việc ta được chọn làm [ROOT.Char.GetTitleAsNameNoTooltip] mới gần như là một kết cục tất yếu."
  ep3_admin_events.0002.appointment: "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] đã đích thân ban sắc lệnh bổ nhiệm ta ngay lập tức. Không ai có thể thách thức tính chính thống của địa vị mới mà ta nắm giữ trong [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  ep3_admin_events.0002.conquest: "Binh lực của [previous_governor.GetTitledFirstNamePossessiveNoTooltip] không phải là đối thủ của đội quân tinh nhuệ dưới trướng ta, điều này chứng minh rằng ta có tư cách chính đáng hơn trong việc bảo vệ tỉnh bang này nhân danh [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  ep3_admin_events.0002.desc: "\n\nSau khi thụ lãnh phẩm phục và tuyên thệ nhậm chức, cuối cùng ta cũng có thể lên đường đến thủ phủ [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] để chính thức bắt đầu nhiệm kỳ của mình."
  ep3_admin_events.0002.prosperity: "Ta phải kiến thiết vùng đất mới này."
  ep3_admin_events.0002.inspection: "Ta cần đi kinh lý địa phương ngay lập tức."
  ep3_admin_events.0002.a: "Không có thời gian để lãng phí."
  ep3_admin_events.0002.tt: "Ngài hiện là [governor|E] của [governor_title.GetName]"
  tgp_diligent_governor_modifier: "Tổng Đốc Cần Mẫn"
  tgp_diligent_governor_modifier_desc: "Vị Tổng đốc này đang tận tụy kiến thiết và phát triển vùng đất của mình."
  building_buildings_give_merit_tt: "Xây dựng các [buildings|E] tại [holdings|E] trực thuộc là một cách tốt để [governor|E] gia tăng [merit_i][merit|E] của mình."
  ep3_admin_events.0002.tt_inspection: "[activity|E] [GetActivityType('activity_survey').GetName] tiếp theo của ngài sẽ được miễn phí"
  inspections_give_merit_tt: "Sử dụng [activity|E] [GetActivityType('activity_survey').GetName] là một cách tốt để một [governor|E] nâng cao [merit_i][merit|E] của họ."
 
  ep3_admin_events.0004.t: "Quan Trường Tan Thành Mây Khói"
  ep3_admin_events.0004.desc: "Trong một bước ngoặt nghiệt ngã và tàn khốc, ta bỗng chốc trở thành kẻ không chốn dung thân, không nghề nghiệp. #EMP Tất thảy#! những gì ta từng nỗ lực gây dựng đã tan biến chỉ trong nháy mắt.\n\nTa vơ vội những gì có thể mang theo, rồi nhìn lại [estate|E] của mình lần cuối."
  ep3_admin_events.0004.desc_spouse_upset: "\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('reacting_spouse'))] của ta, [reacting_spouse.GetFirstName], ném về phía ta một ánh nhìn đầy lo âu. "Thiếp đã thu dọn đồ đạc xong. Có lẽ chẳng ích gì khi cứ kéo dài nỗi đau này thêm nữa...""
  ep3_admin_events.0004.desc_spouse_very_upset: "\n\n"Tại sao... Tại sao mọi chuyện lại thành ra thế này?!" [reacting_spouse.GetShortUIName] nức nở sau lưng ta. "Chúng ta đã mất trắng tất cả... Thiếp phải làm gì đây...""
  ep3_admin_events.0004.a: "Đi thôi, [reacting_spouse.GetFirstName]. Mọi chuyện rồi sẽ ổn thôi."
  ep3_admin_events.0004.b: "Phải, chúng ta đi thôi."
  ep3_admin_events.0004.c: "Ngoảnh lại cũng chẳng ích gì..."
 
  ep3_admin_events.0005.t: "Giang Sơn Tự Chủ"
  ep3_admin_events.0005.intro: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('messenger'))] của ta, [messenger.GetShortUIName], mang tin dữ từ kinh đô tới.\n\n"
  ep3_admin_events.0005.desc_still_admin: "Đại quốc lẫy lừng một thời của chúng ta nay đã không còn, khi ta thấy mình nằm ngoài tầm ảnh hưởng của [gov_liege.GetFirstNamePossessive]. Điều này để lại cho ta quyền tự quyết tại [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Ngoài nền độc lập và quyền hành tự do, sẽ có ít thứ thay đổi. Bộ máy quan liêu đã ăn sâu vào lối sống của chúng ta và sẽ mãi như vậy."
  ep3_admin_events.0005.desc_lost_admin: "Thế sự xoay vần, đại quốc của chúng ta đã sụp đổ. Và cùng với đó, bộ máy hành chính từng điều hành lối sống của chúng ta nay đã hóa thành tro bụi. Ta không còn lựa chọn nào khác ngoài việc điều chỉnh chính quyền của mình để thích nghi với thực tại mới này."
  ep3_admin_events.0005.a: "Hãy gác lại quá khứ và hướng tới tương lai!"
 
  demand_admin_tribal: "[recipient.GetShortUIName|U] [CharAreIs(recipient)] [tribal|E] - Chỉ các [governments|E] đã ổn định mới có thể trở thành [administrative|E]"
