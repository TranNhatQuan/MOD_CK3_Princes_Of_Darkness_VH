  scheme_critical_moments.8066.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.8066.desc: ""Ta hài lòng với những hiểu biết mà ngươi thu thập được. Ngươi đã tìm thấy, bao nhiêu nhỉ? [secrets_found_value]? Không phải việc nhỏ đâu..." [hegemon.GetName] ngả người về phía trước trên ngai của [hegemon.GetHerHis].\n\n"Ta chẳng mong gì ít hơn từ [ROOT.Char.Custom('CouncilPosition')] của ta. Ta tin ngươi #EMP sẽ#! tiếp tục làm tốt công việc!" [hegemon.GetSheHe|U] gật đầu với các đầy tớ, khi họ mang ra khoản thù lao hậu hĩnh."
  scheme_critical_moments.8066.a: ""Ta ở đây để phục vụ, [hegemon.GetTitleAsNameNoTooltip].""
  scheme_critical_moments.8066.b: ""Ta sẽ chuyển lời tốt đẹp này tới các thuộc hạ của ta.""
  scheme_critical_moments.8067.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.8067.desc: ""Ta đã chờ đợi báo cáo của ngươi, nhưng chẳng thấy gì cả. Ta lo lắng... hay ngươi quên mất nhiệm vụ?" [hegemon.GetName] khinh bỉ nhìn ta.\n\n"Ta đã đặt điệp viên khắp mọi ngóc ngách tại [target.GetCapitalLocation.GetName], nhưng vô ích," ta giải thích. "Hoặc là quan viên [target.GetTitledFirstNamePossessive] trung thành, hoặc đơn giản chẳng có gì đáng đồn đại."\n\n"Một lời bào chữa trẻ con... Ta tưởng ngươi có thể làm tốt hơn. Ít nhất cũng phải có một lời nói dối khéo léo hơn. Xét đến vị trí của ngươi đang bị đe dọa!" Lắc đầu, [hegemon.GetHerHis] ra hiệu cho ta rút lui."
  scheme_critical_moments.8067.a: "Lần này ta thoát nhẹ."
