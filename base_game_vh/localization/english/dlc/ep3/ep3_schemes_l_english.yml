  prepare_fire_dromons_scheme: "Chuẩn bị Dromon Lửa Hy Lạp"
  prepare_fire_dromons_scheme_desc: "Ta tìm cách trang bị cho cảng Constantinople thứ vũ khí bí mật nhất: hỏa lỏng."
  prepare_fire_dromons_scheme_desc_general: "Những kho dự trữ hỏa lỏng khổng lồ phải được tích lũy; hạm đội hộ vệ Constantinople cần được trang bị ống phun, cùng những kỹ sư gan dạ vận hành!"
  prepare_fire_dromons_scheme_SUCCESS_DESC: "Ngài sẽ áp dụng [GetModifier('defensive_fire_dromons_modifier').GetNameWithTooltip] cho [GetTitleByKey('c_byzantion').GetNameNoTier] trong #high 30 năm#!."
