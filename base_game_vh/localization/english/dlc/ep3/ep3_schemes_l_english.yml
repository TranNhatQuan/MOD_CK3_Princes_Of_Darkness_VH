  found_despotate: "Nâng cấp Tổng trấn"
  found_despotate_action: "Nâng Tổng trấn thành"
  found_despotate_desc: "Toàn bộ [SCHEME.GetTargetTitle.GetNamePossessive] nên được cai trị dưới một chính quyền duy nhất — #EMP chính quyền của ta#!."
  found_despotate_desc_general: "$found_despotate$ là một [political_scheme|E] nhằm thiết lập một [governorships|E] cấp [kingdom|E]-[rank|E]. Nó dựa trên [diplomacy|E] và địa vị [house|E], và có thể chiêu mộ [agents|E].\n\nMột $found_despotate$ thành công sẽ dẫn đến việc tạo ra [scheme_target|E] và chuyển giao [vassals|E] [de_jure|E] của nó."
  FOUND_DESPOTATE_SUCCESS_DESC: "[TARGET_TITLE.GetName] được thành lập và các [vassals|E] [de_jure|E] của nó được chuyển giao"
