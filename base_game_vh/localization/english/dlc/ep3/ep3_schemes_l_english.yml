  raid_estate: "Đột kích Điền trang"
  raid_manor: "Đột kích Trang viên"
  raid_estate_action: "Đột kích"
  raid_estate_desc: "Gia tộc [SCHEME.GetTargetTitle.GetHolder.GetHouse.GetBaseName] đang trở nên quá tự tin — một cuộc đột kích sẽ đặt [SCHEME.GetTargetTitle.GetHolder.GetTitledFirstName] về đúng vị trí của [SCHEME.GetTargetTitle.GetHolder.GetHerHis]."
  raid_estate_desc_general: "$raid_estate$ là một [hostile_scheme|E] nhằm đột kích [domicile|E] của một [house|E] khác. Nó dựa trên [intrigue|E], [domicile|E], và địa vị [house|E], và có thể chiêu mộ [agents|E].\n\nMột $raid_estate$ thành công có thể dẫn đến việc trộm cắp [gold|E] của mục tiêu, hư hại [domicile|E] của họ, và thậm chí là cái chết của các thành viên [house|E] của họ."
  RAID_ESTATE_SUCCESS_DESC: "[TARGET_CHARACTER.GetDomicile.GetName] bị đột kích"
