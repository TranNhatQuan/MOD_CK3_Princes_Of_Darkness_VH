  scheme_critical_moments.8032.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.8032.desc: "Bình minh cuối cùng mang tin từ dinh thự [target.GetHouse.GetBaseName] tại [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip], xác nhận thành công của ngươi!\n\nNhững [target.Custom2('InsultNounPlural', ROOT.Char)] hoàn toàn bị bất ngờ"
  scheme_critical_moments.8032.kill: "và [target.GetFirstNamePossessiveNoTooltip] [target.Custom2('RelationToMeShort', flavor_victim)], [flavor_victim.GetTitledFirstName], đã chết — những kẻ còn sống sẽ phải chịu nỗi nhục này..."
  scheme_critical_moments.8032.maim: "và [target.Custom2('RelationToMeShort', flavor_victim)] của [target.GetFirstNamePossessiveNoTooltip], [flavor_victim.GetTitledFirstName], sẽ mang theo những vết sẹo của thất bại này trong suốt phần đời còn lại của [flavor_victim.GetHerHis]..."
  scheme_critical_moments.8032.imprison: "và không nghi ngờ gì, họ đang tìm [target.GetFirstNamePossessiveNoTooltip] [target.Custom2('RelationToMeShort', flavor_victim)], [flavor_victim.GetTitledFirstName], kẻ giờ đang chịu xiềng xích!"
  scheme_critical_moments.8032.fallback: "và đã bị hạ bệ, để tất cả [owner.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] chứng kiến!"
  scheme_critical_moments.8032.permission: "\n\nChúng ta có sự ủng hộ của [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], và những kẻ ngốc kia sẽ không có cách nào chống lại..."
  scheme_critical_moments.8032.emperor: "\n\nTa là [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], và họ không thể ngăn ta..."
  scheme_critical_moments.8032.crime: "\n\nĐáng tiếc, rõ ràng là sự tham gia của ta không qua mắt họ, và [target.GetTitledFirstName] sẽ đảm bảo tất cả [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] nghe về sự 'phản bội của [owner.GetHouse.GetBaseName]'."
  scheme_critical_moments.8032.secret: "\n\nThêm một ưu thế nữa, có vẻ họ không biết chúng ta là chủ mưu vụ tấn công, tiếc là ta chưa thể công khai khoe chiến thắng [owner.GetHouse.GetBaseName] này trước mặt [target.GetTitledFirstNamePossessive] — ít nhất bây giờ."
  scheme_critical_moments.8032.a: "Pah, để [target.GetHerHim] kêu la đi."
  scheme_critical_moments.8032.a.secret: "Hãy tổ chức ăn mừng!"
  scheme_critical_moments.8033.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.8033.desc: "Bình minh cuối cùng mang tin từ dinh thự [target.GetHouse.GetBaseName] tại [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip], nhưng không phải là điều chúng ta muốn nghe...\n\nNhững [target.Custom2('InsultNounPlural', ROOT.Char)] đã chuẩn bị sẵn sàng cho cuộc tấn công, và phá hoại các điệp viên của chúng ta trước khi họ kịp gây ra thiệt hại."
  scheme_critical_moments.8033.captured: "\n\nDường như [owner.Custom2('RelationToMeShort', SCOPE.sC('captured'))] của ta, [captured.GetTitledFirstName], đã bị bắt trong trận hỗn loạn, mọi hy vọng che giấu sự tham gia của [owner.GetHouse.GetBaseName] giờ đây tan biến..."
  scheme_critical_moments.8033.discovered: "\n\nTuy nhiên, dường như họ đã nhận ra [owner.GetHouse.GetBaseName] đứng sau vụ tấn công, và sẽ kêu gào đòi công lý..."
  scheme_critical_moments.8033.fallback: "\n\nÍt ra chúng ta có thể yên tâm, vì có vẻ họ không biết về sự tham gia của chúng ta trong mưu kế này..."
  scheme_critical_moments.8033.secret: "\n\nDù bị thất bại, ta vẫn có thể yên tâm rằng họ chưa nghi ngờ Nhà [owner.GetHouse.GetBaseName]."
  scheme_critical_moments.8033.a: "Tất cả công chuẩn bị... mà thành #EMP vô ích#!!"
  scheme_critical_moments.8034.t.known: "Dinh Thự Bị Đột Kích: Cuộc Tấn Công của [owner.GetHouse.GetBaseNameNoTooltip]"
  scheme_critical_moments.8034.t: "Dinh Thự Bị Đột Kích: Kẻ Tấn Công Không Rõ"
  scheme_critical_moments.8034.desc: "Bình minh, những tin đồn hoảng loạn về cuộc đột kích vào dinh thự gia đình tại [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] đến nhanh chóng,"
  scheme_critical_moments.8034.success: "và tim ta như ngừng đập khi nghe kể về sự tàn phá và những bất công xảy ra."
  scheme_critical_moments.8034.failure: "và ta thở phào nhẹ nhõm khi xác nhận cuộc tấn công đã bị chặn lại."
  scheme_critical_moments.8034.kill: "\n\nHọ nói với ta rằng [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))] của ta, [flavor_victim.GetTitledFirstName], đã chết, bị giết như súc vật bởi kẻ hung ác..."
  scheme_critical_moments.8034.maim: "\n\nHọ nói rằng [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))] của ta, [flavor_victim.GetTitledFirstName], đã bị thương tật kinh khủng và khó mà sống sót..."
  scheme_critical_moments.8034.imprison: "Họ nói rằng [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))] của ta, [flavor_victim.GetTitledFirstName], đã bị giam cầm, xích như một con chó..."
  scheme_critical_moments.8034.captured: "\n\nVệ sĩ của ta đã bắt giữ một trong những điệp viên xâm nhập, và sự hiện diện của [captured.GetTitledFirstName], [owner.Custom2('RelationToMeShort', captured)] của [owner.GetTitledFirstName], xác nhận Nhà [owner.GetHouse.GetBaseName] đứng sau vụ này."
  scheme_critical_moments.8034.discovered: "\n\nSau vụ việc, tất cả đều đồng ý rằng rõ ràng đây là việc làm của Nhà [owner.GetHouse.GetBaseName]..."
  scheme_critical_moments.8034.fallback: "\n\nXem xét hiện trường, các vệ sĩ không tìm thấy manh mối ai đứng sau việc này..."
  scheme_critical_moments.8034.permission: "\n\nPhản ứng của [owner.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] không mấy dễ chịu — nếu [owner.GetTopLiege.GetSheHe] dính tay vào chuyện này thì sao...?"
  scheme_critical_moments.8034.emperor: "\n\nSự phẫn nộ này, và bởi chính tay [owner.GetTopLiege.GetTitleAsNamePossessiveNoTooltip]... ta phải làm gì?!"
  scheme_critical_moments.8034.crime: "\n\nSự táo bạo này chỉ làm nổi bật sự suy đồi của bọn độc ác đó, và cần loại bỏ chúng khỏi [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]!"
  scheme_critical_moments.8034.a.discovered: "Bọn [owner.GetHouse.GetBaseNameNoTooltip] đó sẽ phải trả giá!"
  scheme_critical_moments.8034.a: "Làm sao chuyện này có thể xảy ra...?"
  scheme_critical_moments.8035.t: "[scheme.GetNameNoTooltip]: Chuẩn Bị Cuối Cùng"
  scheme_critical_moments.8035.desc: "Sau nhiều tuần lên kế hoạch tỉ mỉ, Nhà [owner.GetHouse.GetBaseName] đã sẵn sàng tiến hành cuộc tấn công. Người của chúng ta đã vào vị trí, dinh thự [target.GetTitledFirstNamePossessive] tại [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] đã được trinh sát, và chi tiết về cuộc đột kích đã thống nhất.\n\nChỉ còn một câu hỏi: sẽ xử lý thế nào với Nhà [target.GetHouse.GetBaseName] sau chiến thắng tất yếu của chúng ta?"
  scheme_critical_moments.8035.permission: "\n\nVới sự ủng hộ của [owner.GetTopLiege.GetTitleAsNamePossessive], không cần phải kiềm chế quá mức..."
  scheme_critical_moments.8035.crime: "\n\nNếu vai trò của ta bị phát hiện, [owner.GetTopLiege.GetTitleAsName] chắc chắn sẽ nghe về chuyện này..."
  scheme_critical_moments.8035.emperor: "\n\nĐã đến lúc cho [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] thấy hậu quả của kẻ chống đối ta..."
  scheme_critical_moments.8035.a: "Giết tất cả những kẻ thuộc Nhà [target.GetHouse.GetBaseNameNoTooltip] mà ngươi gặp."
  scheme_critical_moments.8035.a.tt: "Nếu [scheme|E] thành công, các thành viên gặp được của Nhà [target.GetHouse.GetBaseName] sẽ bị giết"
  scheme_critical_moments.8035.tt: "[scheme|E] sẽ kết thúc"
  scheme_critical_moments.8035.b: "Để họ sống — như một lời nhắc về chúng ta."
  scheme_critical_moments.8035.b.tt: "Nếu [scheme|E] thành công, các thành viên gặp được của Nhà [target.GetHouse.GetBaseName] sẽ nhận [GetTrait('blind').GetName( GetNullCharacter )], [GetTrait('disfigured').GetName( GetNullCharacter )] hoặc [GetTrait('eunuch_1').GetName( GetNullCharacter )] [trait|E]"
  scheme_critical_moments.8035.c: "Đưa bất kỳ tù nhân nào về ta."
  scheme_critical_moments.8035.c.tt: "Nếu [scheme|E] thành công, các thành viên gặp được của Nhà [target.GetHouse.GetBaseName] sẽ bị [imprisoned|E] bởi ngươi"
  scheme_critical_moments.8035.c.warning: "@warning_icon! #X Không còn cơ hội để vai trò của ngươi giữ bí mật [secret|E]#!"
  scheme_critical_moments.8035.d: "Tha cho họ, ta không muốn máu họ đổ."
