# Foster legitimacy
  foster_legitimacy_scheme: "Bồi Đắp Tính Chính Danh"
  foster_legitimacy_scheme_desc: "Ta sẽ cố gắng gia tăng [legitimacy|E] của [liege|E] và [opinion|E] của họ đối với ta"
  foster_legitimacy_scheme_desc_general: "Âm mưu $foster_legitimacy_scheme$ là một [personal_scheme|E], trong đó Ngài tìm cách gia tăng [legitimacy|E] của [liege|E] và [opinion|E] của họ đối với Ngài, với khả năng giành được một [hook|E] nếu [success_chance|E] vượt quá #high 75%#!.\nÂm mưu này chủ yếu dựa trên [diplomacy|E] của chính Ngài.\n\n[success_chance|E] chịu ảnh hưởng bởi nhiều yếu tố, nhưng chủ yếu là [diplomacy_skill|E] của Ngài, [diplomacy_skill|E] của chính [liege|E], và [county_opinion|E] của [capital|E] của [liege|E]."
  FOSTER_LEGITIMACY_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] sẽ tăng [legitimacy|E] và [opinion|E] của [TARGET_CHARACTER.GetHerHis] đối với Ngài"
  start_foster_legitimacy_interaction: "Bồi Đắp Tính Chính Danh #weak (Âm mưu)#!"
  scheme_interaction_tt_foster_legitimacy_approved: "Cố gắng gia tăng [legitimacy|E] và [opinion|E] của [recipient.GetShortUINamePossessiveNoTooltip] đối với Ngài"
