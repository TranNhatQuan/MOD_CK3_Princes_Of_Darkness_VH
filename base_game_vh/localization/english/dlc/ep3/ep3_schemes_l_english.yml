l_english:

 #Slander
  slander: "Bôi Nhọ"
  slander_action: "Bôi Nhọ"
  slander_desc: "Ta sẽ cố làm tổn hại [influence|E] và [candidate_score|E] của [SCHEME.GetTargetCharacter.GetShortUINamePossessive]"
  slander_desc_general: "Trong một [scheme|E] Bôi Nhọ, Ngài tìm cách làm suy giảm [influence|E] và [candidate_score|E] của một nhân vật khác."
  SLANDER_SUCCESS_DESC: "Ngài sẽ làm giảm [influence|E] và [candidate_score|E] của [SCHEME.GetTargetCharacter.GetShortUINamePossessive]."
  slander_invalidated_title: "@scheme_icon! Âm Mưu Bôi Nhọ Kết Thúc"
  scheme_target_not_admin: "[SCHEME.GetTargetCharacter.GetShortUIName|U] không có [government|E] [administrative|E]"
  scheme_owner_not_admin: "Ngài không có [government|E] [administrative|E]"
  start_slander_interaction: "Bôi Nhọ #weak (Âm mưu)#!"
  scheme_interaction_tt_slander_approved: "Cố gắng gây tổn hại [influence|E] của [recipient.GetShortUINamePossessiveNoTooltip] và giảm mạnh [candidate_score|E] của [recipient.GetHerHis] cho tất cả [titles|E]"
  start_slander_notification: "Bôi Nhọ"
  scheme_critical_moments.1132.t: "[scheme.GetNameNoTooltip]: Thành Công"
  scheme_critical_moments.1132.desc: "Dư luận tràn ngập thành quả từ những mưu tính tinh vi của ta. Chiến dịch gieo rắc tai tiếng bằng lời đồn, cáo buộc mờ ám và những câu chuyện tầm phào vô nghĩa của ta đã khiến cái nhìn của mọi người về [target.GetTitledFirstName] thay đổi sâu sắc. Danh tiếng của [target.GetHerHis|U] giờ đây tan nát!\n\nMột hình tượng cao quý quả thật dễ dàng bị tước sạch lớp hào nhoáng, dễ dàng bị bôi bẩn, chỉ bằng lời nói và trong suy nghĩ của kẻ khác..."
  scheme_critical_moments.1132.desc_discovered: "\n\n[target.GetFirstNameNoTooltip] biết ta có dính líu, nhưng điều đó chẳng còn quan trọng! Giờ thì đã quá muộn: tổn hại đến danh tiếng của [target.GetHerHis] đã là không thể cứu vãn!"
  scheme_critical_moments.1132.desc_secret: "\n\n[target.GetFirstNameNoTooltip] vẫn hoàn toàn bối rối trước sự suy sụp của [target.GetHerHis], không hề hay biết đến sự can dự của ta!"
  scheme_critical_moments.1132.a: "Thật là một đống bẩn thỉu khoái trá ta đã chất lên!"
  slander_nickname_given_tt: "Biệt Danh Bôi Nhọ Được Gán"
  receive_slanderous_nickname_tt: "Một [nickname|e] tiêu cực xuất hiện cho [target.GetShortUINameNoTooltip]"

  scheme_critical_moments.1133.t: "[scheme.GetNameNoTooltip]: Thất Bại"
  scheme_critical_moments.1133.desc: "Không có gì cả. Hàng tháng trời lên kế hoạch và âm mưu, tung tin đồn và chi tiền hối lộ, vậy mà danh tiếng của [target.GetTitledFirstNamePossessive] vẫn vững chắc như thành trì!"
  scheme_critical_moments.1133.desc_discovered: "\n\nTệ hơn nữa, ta không chỉ lãng phí thời gian và nguồn lực, mà [target.GetFirstNameNoTooltip] còn nhận ra những ý đồ xấu xa vụng về của ta!"
  scheme_critical_moments.1133.desc_secret: "\n\nÍt nhất thì [target.GetFirstNameNoTooltip] vẫn hoàn toàn không biết rằng đã từng có chuyện gì xảy ra..."
  scheme_critical_moments.1133.a: "Chỉ là một trở ngại nhỏ..."
  scheme_critical_moments.1134.t: "Bị Bôi Nhọ"
  scheme_critical_moments.1134.desc: "Khi ta nói chuyện với người khác, ta thấy trong mắt họ là sự nghi ngờ, lo lắng, thậm chí cả giễu cợt; những tiếng cười khúc khích và lời thì thầm theo ta khắp nơi.\n\nLời nói của ta không còn sức nặng như trước, và vị thế của ta giữa các đồng liêu trở nên mong manh đến đáng ngờ. Những lời đồn điên rồ và tai hại nhất đang xoay quanh chính #EMP ta#!... và dường như ai cũng tin cả."
  scheme_critical_moments.1134.desc_given_nickname: "\n\nTệ hơn nữa, ta còn nghe rằng những giọng nói cay độc đang gọi ta bằng một biệt danh mới. Chúng dám gọi ta là [ROOT.Char.GetNickname]!"
  scheme_critical_moments.1134.desc_discovered: "\n\nCác mật thám của ta chắc chắn rằng chính [owner.GetTitledFirstName] đã đạo diễn màn bôi nhọ danh tiếng này..."
  scheme_critical_moments.1134.a: "Thật là khôn ngoan..."
  scheme_critical_moments.1133.tt: "[scheme.GetName] Bị Phát Hiện"
  scheme_critical_moments.1133.tt.failed: "[scheme.GetOwner.GetShortUIName] đã cố [scheme.GetSchemeType.GetTypeName] Ngài, nhưng thất bại!"
  slander_modifier_tt: "Có thể nhận được [GetModifier('scheme_slandered_modifier').GetNameWithTooltip] trong #HIGH 10 năm#!"
  scheme_slandered_candidacy_appointment_tt: "[GetLaw('appointment_succession_law').GetName] [candidate_score|E]: [EmptyScope.ScriptValue('slander_appointment_score_value')|+=0]"
  scheme_slandered_candidacy_acclamation_tt: "[GetLaw('acclamation_succession_law').GetName] [candidate_score|E]: [EmptyScope.ScriptValue('slander_acclamation_score_value')|+=0]"
  scheme_slandered_candidacy_desc: ""
 #Promote
  promote: "Nâng Đỡ"
  promote_action: "Nâng Đỡ"
  promote_desc: "Ta sẽ cố gia tăng [candidate_score|E] của [SCHEME.GetTargetCharacter.GetShortUINamePossessive]"
  promote_desc_general: "Trong một [scheme|E] Nâng Đỡ, Ngài tìm cách gia tăng [candidate_score|E] của một nhân vật."
  PROMOTE_SUCCESS_DESC: "Ngài sẽ gia tăng [candidate_score|E] của [SCHEME.GetTargetCharacter.GetShortUINamePossessive]"
  promote_invalidated_title: "@scheme_icon! Âm Mưu Nâng Đỡ Kết Thúc"
  is_in_line_of_succession: "[recipient.GetShortUIName|U] [CharAreIs(recipient)] #bold không#! nằm trong hàng kế vị để trở thành [actor.GetTopLiege.GetTitleAsName] hoặc thừa kế bất kỳ [actor.Custom( 'GetProvincePluralConcept' )]"
  scheme_critical_moments.1142.t: "$scheme_critical_moments.1132.t$"
  scheme_critical_moments.1142.desc_self: "Mọi nỗ lực trong chiến dịch tự nâng đỡ của ta cuối cùng cũng được đền đáp.\n\nVị thế của ta trong mắt các đồng liêu được cải thiện, những người ủng hộ mới đổ về các ứng cử của ta, và mục tiêu của ta giờ đây gần hơn bao giờ hết!"
  scheme_critical_moments.1142.desc_other: "Quá nhiều thời gian và nguồn lực đổ vào việc thúc đẩy các ứng cử của [target.GetTitledFirstNamePossessive] đã gặt hái được thành quả.\n\nĐịa vị của [target.GetHerHis|U] giữa những người cùng trang lứa đã được cải thiện, những người ủng hộ mới giờ đây đã tin tưởng vào giá trị của [target.GetHerHis], và việc bổ nhiệm [target.GetHerHis] đã gần thêm một bước nữa!"
  scheme_critical_moments.1142.a: "Kết quả tuyệt vời."
  scheme_critical_moments.1142.tt: "Ứng Cử Được Nâng Đỡ!"
  promote_toast_scheme_desc: "[target.Custom2('RelationToMeShort', SCOPE.sC('owner'))] của Ngài, [owner.GetShortUINameNoTooltip|U], đã nâng đỡ ứng cử của Ngài"
  scheme_critical_moments.1143.t: "$scheme_critical_moments.1133.t$"
  scheme_critical_moments.1143.desc_self: "Mọi tâm sức và nguồn lực đổ vào chiến dịch tự nâng đỡ của ta vẫn không đủ. Không ai bị thuyết phục bởi giá trị của ta hay dao động trước những lời hứa — và hối lộ — của ta, nên vị thế của ta không thay đổi.\n\nTa sẽ phải nghĩ ra cách khác để thúc đẩy ứng cử của mình."
  scheme_critical_moments.1143.desc_other: "Bất chấp mọi nỗ lực, vẫn không có cách nào khiến [target.GetTitledFirstName] trở thành một ứng viên dễ chấp nhận hơn...\n\nCó lẽ ta sẽ phải nghĩ ra phương án khác để đảm bảo cho [target.GetHerHim] một vị trí tốt."
  scheme_critical_moments.1143.a: "Một dịp bị lãng phí."
  start_promote_interaction: "Nâng Đỡ #weak (Âm mưu)#!"
  scheme_interaction_tt_promote_approved: "Cố gắng nâng đỡ ứng cử của [recipient.GetShortUINamePossessiveNoTooltip] vào các vị trí [administrative|E]"
  start_promote_notification: "Nâng Đỡ"
  promote_scheme_success_tt: "Nếu thành công [recipient.GetShortUIName|U]:\n$EFFECT_LIST_BULLET$ Nhận [opinion|E] đối với [actor.GetShortUIName]\n$EFFECT_LIST_BULLET$ Nhận [GetModifier('scheme_promoted_modifier').GetNameWithTooltip], giúp tăng [candidate_score|E] cho tất cả [titles|E] có [GetLaw('appointment_succession_law').GetName] hoặc [GetLaw('acclamation_succession_law').GetName]"
  promote_scheme_success_self_tt: "Nếu thành công [recipient.GetShortUIName|U] nhận [GetModifier('scheme_promoted_modifier').GetNameWithTooltip], giúp tăng [candidate_score|E] cho tất cả [titles|E] có [GetLaw('appointment_succession_law').GetName] hoặc [GetLaw('acclamation_succession_law').GetName]"
  scheme_promoted_candidacy_appointment_tt: "[GetLaw('appointment_succession_law').GetName] [candidate_score|E]: @appointment_score![EmptyScope.ScriptValue('promote_appointment_score_value')|+=0]"
