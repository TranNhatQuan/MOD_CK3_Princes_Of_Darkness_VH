  scheme_critical_moments.4011.t: "$damage_legitimacy_scheme$: Thành Công!"
  scheme_critical_moments.4011.desc: "Ta nhìn lá thư mà một người hầu vừa đặt xuống. Tờ giấy da thật sang trọng, thậm chí còn có hương thơm. Không nghi ngờ gì nữa, một bức thư từ kinh đô.\n\n\"[target.GetTitleAsNameNoTooltip], [ROOT.Char.GetHerHis] chúa thượng, đang lâm vào một tình cảnh vô cùng khó chịu...\"\n\nMột nụ cười thoáng hiện trên gương mặt ta. Ta chẳng cần đọc thêm nữa. Tính chính danh của [target.GetHerHis] đã bị tổn hại — một cơ hội hoàn hảo để ra tay."
  scheme_critical_moments.4011.a: "Mang mực tới đây."
  scheme_critical_moments.4011.tt: "Tính Chính Danh Bị Tổn Hại!"
  damage_legitimacy_scheme_toast_desc: "[target.Custom2('RelationToMeShort', SCOPE.sC('owner'))] của Ngài, [owner.GetShortUINameNoTooltip|U], đã làm tổn hại [legitimacy|E] của Ngài"
 
  scheme_critical_moments.4012.t: "$damage_legitimacy_scheme$: Thất Bại"
  scheme_critical_moments.4012.desc.intro: "Có đôi lúc — không nhiều — ta mừng vì mọi chuyện diễn ra không như ý. Nhưng đây không phải là một trong số đó.\n\n[target.GetTitledFirstName] hẳn đang ngồi vênh váo trên ngai vàng của [target.GetHerHis] ngay lúc này, "
  scheme_critical_moments.4012.desc.byzantium: "có lẽ đang sai một kỹ nữ đến mua vui cho [target.GetHerHim]."
  scheme_critical_moments.4012.desc.other: "những người tung hứng nhảy múa xung quanh, có lẽ là một nhạc công ngoại quốc được mời riêng cho dịp này."
  scheme_critical_moments.4012.desc.outro: "\"Vạn tuế [target.GetTitleAsNameNoTooltip]!\" vang lên trên khắp các con phố.\n\n\"Kiên nhẫn, [ROOT.Char.GetTitleAsNameNoTooltip], kiên nhẫn,\" ta tự nhủ.\n\nCuộc săn ưu ái những kẻ biết chờ đợi."
  scheme_critical_moments.4012.a: "Kiên nhẫn."
 
 #Dispute Border
  dispute_border: "Tranh chấp biên giới"
  dispute_border_action: "Tranh chấp biên giới với"
  dispute_border_desc: "Một #EMP người ta có thể nói#! những vùng đất này thuộc về [SCHEME.GetOwner.GetPrimaryTitle.GetNameNoTier], và sẽ được quản lý tốt hơn dưới tay ta..."
  dispute_border_desc_general: "$dispute_border$ là một [hostile_scheme|E] nhằm chuyển giao đất giữa các [governorships|E]. Nó dựa trên [diplomacy|E] và uy tín [house|E], và có thể huy động [agents|E].\n\nMột $dispute_border$ thành công sẽ dẫn đến việc một [county|E] lân cận được chuyển từ tay [scheme_target|E]."
