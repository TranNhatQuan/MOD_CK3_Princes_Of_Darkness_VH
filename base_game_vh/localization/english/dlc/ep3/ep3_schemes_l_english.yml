 #Expand Power Base
  expand_power_base: "Mở Rộng Cơ Sở Quyền Lực"
  expand_power_base_action: "Mở Rộng Cơ Sở Quyền Lực của"
  expand_power_base_desc: "Ta sẽ cố gắng mở rộng phạm vi và mức độ ảnh hưởng của mình nhằm tăng [investment_cap|E]."
  expand_power_base_desc_general: "Trong một [scheme|E] $expand_power_base$, Ngài dành thời gian vun đắp các mối quan hệ có ảnh hưởng để gia tăng [investment_cap|E]."
  expand_power_base_invalidated_title: "@scheme_icon! Âm Mưu Mở Rộng Cơ Sở Quyền Lực Kết Thúc"
  scheme_critical_moments.1182.t: "$scheme_critical_moments.1132.t$"
  scheme_critical_moments.1182.desc: "Thành công! Danh tiếng của Gia tộc [ROOT.Char.GetHouse.GetName] giờ đây mang trọng lượng lớn hơn tại [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseName] — ít nhất là đối với ta.\n\nHối lộ, ân huệ, quyên góp, đặt đúng người vào đúng chỗ: không có công cụ nào bị bỏ qua. Nguồn dự trữ ảnh hưởng của ta ngày càng sâu rộng, cùng với năng lực chính trị."
  scheme_critical_moments.1182.a: "Đây mới chỉ là khởi đầu."
  scheme_critical_moments.1183.t: "$scheme_critical_moments.1133.t$"
  scheme_critical_moments.1183.desc: "Mọi người dường như chẳng đánh giá cao ta.\n\nHối lộ, ân huệ, quyên góp, đe dọa — #EMP không có gì#! giúp tăng ảnh hưởng của ta!\n\nCó lẽ ta phải hướng sự chú ý sang nơi khác..."
  scheme_critical_moments.1183.a: "Cánh cửa này khép lại..."
  start_expand_power_base_interaction: "Mở Rộng Cơ Sở Quyền Lực #weak (Âm mưu)#!"
  scheme_interaction_tt_expand_power_base_approved: "Cố gắng tăng [investment_cap|E] của Ngài"
  start_expand_power_base_notification: "Mở Rộng Cơ Sở Quyền Lực"
  expand_power_base_effect_tt: "Nếu thành công, tăng [investment_cap|E] dựa trên [stewardship_i][stewardship|E] và [intrigue_i][intrigue|E] [skills|E]"
  CONTRACTED_THIEF_DESC: "Nghi Phạm Khó Ngờ: $VALUE|+0=$"

 # Depose
  depose: "Phế Truất"
  depose_action: "Phế Truất"
  depose_desc_general: "Trong một âm mưu Phế Truất, Ngài cấu kết để lật đổ hoàng đế và thay thế họ bằng một ứng viên xứng đáng hơn: #EMP chính là Ngài.#!"
  depose_desc: "Ta sẽ dàn dựng một chuỗi mưu kế nhằm làm suy yếu quyền lực và tính chính danh của [SCHEME.GetTargetCharacter.GetShortUIName], với mục tiêu loại bỏ [SCHEME.GetTargetCharacter.GetHerHim] khỏi ngai vàng của đế quốc."
  DEPOSE_SUCCESS_DESC: "Với sự xảo quyệt vô song, Ngài đã lật đổ [SCHEME.GetTargetCharacter.GetShortUIName] khỏi ngai vàng, làm thay đổi dòng chảy lịch sử. Đế quốc đang đứng trước bình minh của một kỷ nguyên mới, háo hức chờ đợi vị quân vương tiếp theo."
  depose_invalidated_title: "@scheme_icon! Âm Mưu Phế Truất Kết Thúc"

  start_depose_interaction: "Phế Truất #weak (Âm mưu)#!"
