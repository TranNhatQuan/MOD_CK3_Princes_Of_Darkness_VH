  scheme_critical_moments.8002.t: "[scheme.GetNameNoTooltip]: Thành Công"
  scheme_critical_moments.8002.desc: "Sau vô số tranh cãi, tranh luận và áp lực, những hạt giống ta cẩn thận gieo trồng cuối cùng cũng đơm hoa kết trái. Điệu múa chậm chạp giữa các quan liêu [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip], vị [owner.GetTopLiege.GetTitleAsNameNoTooltip] thất thường, và đại diện của [target_title.GetNameNoTier] cuối cùng đã phán quyết rằng từ nay [target_title.GetTierAsNameNoTooltip] này sẽ nằm dưới quyền quản lý của [ROOT.Char.GetPrimaryTitle.GetAdjective].\n\nNhững nỗ lực thảm hại của [target.GetTitledFirstNamePossessive] nhằm níu giữ đất đai của ta và chống lại ảnh hưởng rộng khắp của ta tại triều đình hoàn toàn vô ích."
  scheme_critical_moments.8002.a: "[target_title.GetNameNoTierNoTooltip] là của #EMP ta#!."
  scheme_critical_moments.8003.t: "[scheme.GetNameNoTooltip]: Thất Bại"
  scheme_critical_moments.8003.desc: "Bất chấp mọi lời cầu xin, ân huệ và nịnh nọt được sắp đặt kỹ lưỡng, các phản đối của ta cuối cùng vẫn rơi vào im lặng...\n\nCác quan liêu [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] và vị [owner.GetTopLiege.GetTitleAsNameNoTooltip] thất thường chỉ xác nhận nguyên trạng biên giới giữa [owner.GetPrimaryTitle.GetAdjective] và [target.GetPrimaryTitle.GetAdjective] [target.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
  scheme_critical_moments.8003.a: "Hừ, chẳng quan trọng."
  scheme_critical_moments.8003.tt.failed: "[scheme.GetOwner.GetShortUIName] đã cố tranh chấp biên giới của Ngài, nhưng thất bại!"
  scheme_critical_moments.8004.t: "Biên Giới Bị Tranh Chấp: [target_title.GetNameNoTierNoTooltip]"
  scheme_critical_moments.8004.desc: "Ta đã theo dõi tin tức về những âm mưu hèn nhát của [owner.GetTitledFirstNamePossessive] tại triều đình hoàng gia, và nhìn với vẻ ghê tởm khi ảnh hưởng và những mối quan hệ của [owner.GetHerHis] tạo sự tin tưởng thái quá cho sự chiếm đoạt quyền lực của [owner.GetHerHis].\n\nPhán quyết hôm nay đã xác nhận điều tồi tệ nhất: [target_title.GetNameNoTier] từ nay được coi là một phần của [owner.GetPrimaryTitle.GetNameNoTier] [owner.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  scheme_critical_moments.8004.a: "Và [target.GetPrimaryTitle.GetNameNoTierNoTooltip], bị thu hẹp..."
