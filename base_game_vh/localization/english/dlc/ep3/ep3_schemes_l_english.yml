  FOUND_DESPOTATE_HELD_DUCHIES_IN_TARGET_DESC: "Các [duchies|E] [de_jure|E] được kiểm soát hoàn toàn: $VALUE|+0=$"
  FOUND_DESPOTATE_IMPERIAL_CAPITAL_DESC: "[kingdom|E] [capital|E] [de_jure|E] của [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]: $VALUE|+0=$"
  scheme_target_another_holder: "[target.GetName] đã tồn tại"
  scheme_target_no_counties_within: "Ngài không nắm giữ [county|E] nào trong [target.GetName]"
  scheme_critical_moments.8022.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.8022.desc: "Các cuộc tranh luận tại [owner.GetTopLiege.GetCapitalLocation.GetName] kéo dài và mệt mỏi, nhưng các quan lại cuối cùng cũng khuất phục trước sự sáng suốt trong đề xuất của ta. [destroyed_title.GetNameNoTier] bị giải thể, lãnh thổ cũ của nó trở thành một phần của [target_title.GetTierAsNameNoTooltip] mới là [target_title.GetNameNoTier], và #EMP ta#! trở thành [owner.GetTitleAsNameNoTooltip] của nó.\n\nMột sự thay đổi lớn đang đến — với chính quyền của ta; với [owner.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip]; và với địa vị của Gia tộc [owner.GetHouse.GetBaseName]!"
  scheme_critical_moments.8022.a: "[owner.GetTitleAsNameNoTooltip]... nghe thật hay."
  scheme_critical_moments.8023.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.8023.desc: "Những nỗ lực được dàn dựng kỹ lưỡng của ta tại [owner.GetTopLiege.GetCapitalLocation.GetNameNoTooltip] — hàng tháng trời lên kế hoạch và ngoại giao mềm mỏng — đều trở nên vô ích.\n\nCác quan lại đã từ chối công nhận sự sáng suốt trong đề xuất của ta. Việc đơn giản hóa bộ máy quản trị khu vực dưới một văn phòng [target_title.GetAdjective] quyền lực bị coi là \"không cần thiết\" và \"thiếu thực tế\"..."
  scheme_critical_moments.8023.a: "Lũ bút giấy chết tiệt."
  scheme_critical_moments.8023.tt.failed: "[scheme.GetOwner.GetShortUIName] đã cố thành lập Despotate nhưng thất bại!"
  scheme_critical_moments.8024.t: "Despotate được thành lập: [target_title.GetNameNoTierNoTooltip]"
  scheme_critical_moments.8024.desc: "Trong nhiều tuần, tin đồn về những cuộc tranh luận căng thẳng vang lên từ các phòng kín tại [owner.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], và cuối cùng một thông báo được đưa ra: [owner.GetFirstName] sẽ trở thành [owner.GetTitleAsNameNoTooltip], cai trị vùng lãnh thổ rộng lớn của [target_title.GetNameNoTier]."
  scheme_critical_moments.8024.liege: "\n\nLiệu các quan lại chấp thuận vì lý do hành chính chính đáng hay chỉ vì khuất phục trước áp lực thì ta không bao giờ biết — mọi thứ đã vượt ngoài tầm tay.\n\nChỉ có thể tin rằng sự thay đổi này mang lại lợi ích cho toàn bộ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip], chứ không chỉ cho [owner.GetTitledFirstNamePossessive]..."
  scheme_critical_moments.8024.vassalised: "\n\nDù vì lý do hành chính hay do áp lực chính trị, ta giờ đây đã trở thành thuộc hạ của [owner.GetHerHis]!"
  scheme_critical_moments.8024.other: "\n\nDù vì lý do hành chính hay do áp lực chính trị, chúng ta sẽ không bao giờ biết..."
  scheme_critical_moments.8024.fallback: "\n\nBước đi này của Gia tộc [ROOT.Char.GetHouse.GetBaseName] sẽ làm thay đổi đáng kể cán cân quyền lực trong [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
  scheme_critical_moments.8024.a: "Thật đáng suy ngẫm..."
  found_despotate_vassalized_opinion: "Bị sáp nhập dưới Despotate"
  found_despotate_existing_scheme_tt: "Một [vassal|E] khác đang [scheming|E] để tạo ra [actor.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier]"
