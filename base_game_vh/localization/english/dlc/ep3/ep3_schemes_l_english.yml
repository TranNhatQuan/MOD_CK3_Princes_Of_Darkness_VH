  subsume_province_neighboring_duchy_tt: "Họ phải giáp ranh với ngươi và nắm giữ một [de_jure|E] [duchy|E] lân cận cùng phần lớn [counties|E] của nó"
  subsume_province_must_neighbor_tt: "Chức danh phải [de_jure|E] giáp với một trong các [counties|E] thuộc [realm|E] của ngươi"
  subsume_province_existing_target_tt: "[target.GetHolder.GetShortUIName] đã đang cố gắng sáp nhập [governorship|E] của ngươi"
