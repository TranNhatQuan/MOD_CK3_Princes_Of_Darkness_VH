 #success event
  scheme_critical_moments.8061.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.8061.desc: "Sâu trong những căn hầm đầy bụi bặm, các kỹ sư của ta cất giữ những thùng lửa lỏng cuối cùng. Trong khi đó, [Glossary( 'Cung điện Boukoleon', 'BOUKOLEON_PALACE_GLOSS')] tổ chức một cuộc diễn tập đáng sợ: bên dưới bức tượng khổng lồ hình sư tử và bò tót đang giao chiến, một chiến hạm đầy kiêu hãnh phun ra những tia lửa lỏng.\n\nVà những ngọn lửa chết chóc đó nhảy múa thật lâu làm sao! Kẻ thù của ta nên khôn ngoan mà tránh xa những vùng nước tĩnh lặng giữa Europa và Anatolia..."
  scheme_critical_moments.8061.a: "Rồng canh giữ biển Marmara."
  BOUKOLEON_PALACE_GLOSS: "Nằm bên bờ #EMP Propontis#! (Biển Marmara), dinh thự Constantinople thế kỷ V này nổi bật với bến cảng riêng và những ngục tối rùng rợn."
 #fail event
  scheme_critical_moments.8062.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.8062.desc: "Hỏa ngục! Hỏa ngục!\n\nMột cơn địa ngục mất kiểm soát nuốt chửng thêm một con tàu được trang bị ống phun. Khi thủy thủ đoàn của nó gào thét và bị thiêu sống, ta buộc phải nghĩ về tất cả những hỗn hợp hỗn loạn, những ống phun rò rỉ, những thủy thủ đã chết liên quan đến kế hoạch này...\n\nLàm sao một chất tà ác như vậy #EMP từng#! được kiểm soát? Làm sao?!?!"
  scheme_critical_moments.8062.a: "Có lẽ ta sẽ chẳng bao giờ biết..."
