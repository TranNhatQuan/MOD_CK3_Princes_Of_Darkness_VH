  foster_legitimacy_positive_outcome_recipient_tt: "Nếu thành công, tăng [legitimacy_i][legitimacy|E] thêm #P [EmptyScope.ScriptValue('medium_legitimacy_gain')]#!"
  foster_legitimacy_negative_outcome_tt: "Nếu thất bại, tiêu tốn #N [EmptyScope.ScriptValue('minor_prestige_gain')]#! [prestige_i][prestige|E]"
 
  scheme_critical_moments.4001.t: "$foster_legitimacy_scheme$: Thành Công!"
  scheme_critical_moments.4001.desc.intro: "Ta đưa [ROOT.Char.Custom('RegionalAlcoholicDrink')] lên môi với vẻ mãn nguyện. Ta đã bảo vệ tính chính danh của [target.GetTitleAsNamePossessiveNoTooltip]... và cả cái nhìn của [target.GetHerHis] dành cho ta.\n\n"
  scheme_critical_moments.4001.desc.byzantium: "Những bức khảm lấp lánh dưới ánh sáng ban mai, và ta đứng dậy khỏi chỗ ngồi:"
  scheme_critical_moments.4001.desc.other: "Khi để ý đến [ROOT.Char.Custom('GetRandomInteriorDetail')], ta đứng dậy khỏi chỗ ngồi:"
  scheme_critical_moments.4001.desc.outro: "\n\n\"Vì [target.GetTitledFirstName]! Và vì quyền kế vị chính đáng của [target.GetHerHis] đối với ngai vàng!\""
  scheme_critical_moments.4001.a: "Luôn là niềm vinh hạnh, thưa [target.GetLadyLord]."
  scheme_critical_moments.4001.tt: "Tính Chính Danh Được Bồi Đắp!"
  foster_legitimacy_scheme_toast_desc: "[target.Custom2('RelationToMeShort', SCOPE.sC('owner'))] của Ngài, [owner.GetShortUINameNoTooltip|U], đã bồi đắp [legitimacy|E] của Ngài"
 
  scheme_critical_moments.4002.t: "$foster_legitimacy_scheme$: Thất Bại"
  scheme_critical_moments.4002.desc: "Thật đáng thất vọng. Ta thở dài khi vứt lá thư vừa được gửi từ kinh đô: \"[target.GetTitleAsNameNoTooltip] chân thành cảm ơn những nỗ lực của ngươi.\"\n\nMột lời cảm ơn cũng chẳng khác gì không có gì. Và một lời cảm ơn từ [target.GetTitleAsNameNoTooltip] thì chẳng khác nào một cú đá vào ống chân.\n\n\"Ngươi đã làm ta thất vọng,\" [target.GetSheHe] hoàn toàn có thể nói thẳng như vậy."
  scheme_critical_moments.4002.a: "Dù sao ta cũng đã thử."
 
  fostered_legitimacy_opinion: "Đã Bồi Đắp Tính Chính Danh Cho Ta"
  damaged_legitimacy_opinion: "Đã Làm Tổn Hại Tính Chính Danh Của Ta"
 
 # Damage legitimacy
  damage_legitimacy_scheme: "Làm Tổn Hại Tính Chính Danh"
  damage_legitimacy_scheme_desc: "Ta sẽ cố gắng làm suy giảm [legitimacy|E] của [liege|E]"
  damage_legitimacy_scheme_desc_general: "Âm mưu $damage_legitimacy_scheme$ là một [hostile_scheme|E], trong đó Ngài tìm cách làm suy giảm [legitimacy|E] của [liege|E], gia tăng sự bất ổn trong lãnh thổ.\nÂm mưu này chủ yếu dựa trên [intrigue|E] của chính Ngài.\n\n[success_chance|E] chịu ảnh hưởng bởi nhiều yếu tố, nhưng chủ yếu là [intrigue_skill|E] của Ngài, [intrigue_skill|E] của [liege|E], và [county_opinion|E] của [capital|E] của [liege|E]."
