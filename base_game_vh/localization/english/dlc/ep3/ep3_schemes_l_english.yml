  SUBSUME_PROVINCE_HELD_COUNTIES_IN_TARGET_DESC: "Các [de_jure|E] [counties|E] thuộc [governorship|E] của mục tiêu: $VALUE|+0=$"
  SUBSUME_GOVERNORSHIP_OWNER_HOUSE_GOVERNORSHIPS: "[top_realm|E] [counties|E] đã được [house|E] của ngươi kiểm soát: $VALUE|+0=$"
  scheme_critical_moments.8012.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.8012.desc: "Mất không ít công sức, nhưng tầm ảnh hưởng của ngươi tại triều đình đủ để hoàn thành nhiệm vụ.\n\nLập luận, hối lộ và ân huệ chưa nói ra, quá sức đối với quan lại và [owner.GetTopLiege.GetTitleAsNameNoTooltip]. [target.GetTitledFirstName] sẽ không hài lòng, nhưng giờ thì có quan trọng nữa đâu?\n\nMọi việc đã xong; ngươi sẽ cai quản [target_title.GetNameNoTier] cùng với [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], và các vùng lãnh thổ sẽ ngay lập tức chịu quyền hạn của ngươi."
  scheme_critical_moments.8012.a: "[target_title.GetNameNoTierNoTooltip] là #EMP của ngươi#!."
  scheme_critical_moments.8013.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.8013.desc: "Dù đã dùng mọi nỗ lực khéo léo, ân huệ và tâng bốc, các phản đối của ngươi vẫn rơi vào tai điếc...\n\nCác quan lại [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] và [owner.GetTopLiege.GetTitleAsNameNoTooltip] cứng đầu chỉ xác nhận sự tách biệt của các vùng lãnh thổ [owner.GetPrimaryTitle.GetAdjective] và [target.GetPrimaryTitle.GetAdjective]..."
  scheme_critical_moments.8013.a: "Đám thái giám khốn nạn."
  scheme_critical_moments.8013.tt.failed: "[scheme.GetOwner.GetShortUIName] đã cố gắng sáp nhập Thống lĩnh của ngươi, nhưng thất bại!"
  scheme_critical_moments.8014.t: "Thống lĩnh Sáp nhập: [target_title.GetNameNoTierNoTooltip]"
  scheme_critical_moments.8014.desc: "Đằng sau những cánh cửa tráng lệ của hoàng cung, những mối liên hệ của [owner.GetTitledFirstName] vẫn tiếp tục dệt lưới. Hôm nay, một văn thư ngắn mang dấu ấn đỏ của [owner.GetTopLiege.GetTitleAsNamePossessive] xác nhận điều tồi tệ nhất.\n\nCác lãnh thổ của [target_title.GetNameNoTier] sẽ ngay lập tức chịu quyền [owner.GetTitledFirstName], về cơ bản là phần mở rộng của [owner.GetPrimaryTitle.GetAdjective] [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] — ..."
  scheme_critical_moments.8014.a: "Vết thương này sẽ khó quên."
  scheme_critical_moments.8015.t: "Thống lĩnh Sáp nhập: [target_title.GetNameNoTierNoTooltip]"
  scheme_critical_moments.8015.desc: "Sau nhiều tuần áp lực chính trị và thao túng tại triều đình, [owner.GetTitledFirstName] đã thành công trong việc nhận trách nhiệm các vùng lãnh thổ của [target_title.GetNameNoTier], giờ trở thành phần mở rộng của [owner.GetHerHis] [owner.GetPrimaryTitle.GetAdjective] [owner.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  scheme_critical_moments.8015.liege: "\n\nNhững bánh răng của bộ máy quan liêu [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] luôn xoay chuyển, và động lực của chúng gần như không thể ngăn cản — ngay cả đối với một [owner.GetTopLiege.GetTitleAsNameNoTooltip].\n\nTa chỉ hy vọng [owner.GetTitledFirstName] dành năng lượng của [owner.GetHerHis] để phục vụ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], chứ không phải cho chính [owner.GetHerselfHimself]..."
  scheme_critical_moments.8015.vassal: "\n\nBánh xe quan lại [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] luôn quay, gần như không thể ngăn cản — ngay cả với [owner.GetTopLiege.GetTitleAsNameNoTooltip]."
  scheme_critical_moments.8015.same_house: "\n\nChúng ta chỉ có thể hy vọng động thái này cuối cùng mang lại lợi ích cho toàn bộ Nhà [ROOT.Char.GetHouse.GetName]..."
  scheme_critical_moments.8015.target_house: "\n\nSự xúc phạm này là đòn nặng vào uy tín Nhà [ROOT.Char.GetHouse.GetBaseName]..."
  scheme_critical_moments.8015.fallback: "\n\nCuộc #EMP đảo chính#! này chắc chắn sẽ đưa Nhà [ROOT.Char.GetHouse.GetBaseName] lên tầm cao mới..."
  scheme_critical_moments.8015.a: "Thật thú vị."
  attempted_subsume_province_opinion: "Cố gắng Sáp nhập Thống lĩnh của ta"
  subsume_province_opinion: "Đã Sáp nhập Thống lĩnh của ta"
