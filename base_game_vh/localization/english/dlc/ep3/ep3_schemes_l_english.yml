  subsume_province_more_than_half_tt: "Ngươi đã kiểm soát hơn một nửa [de_jure|E] [counties|E] của [target.GetNameNoTierPossessive]\n#weak (Hãy dùng $dispute_border$ [scheme|E] thay thế)"
  subsume_province_scheme_success_outcome_tt: "Nếu thành công, [actor.GetShortUIName] sẽ nhận [target.GetBaseName]"
