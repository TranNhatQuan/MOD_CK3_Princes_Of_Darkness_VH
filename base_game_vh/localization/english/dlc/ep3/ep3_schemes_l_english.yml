 #Subsume Province
  subsume_province: "Sáp nhập Thống lĩnh"
  subsume_province_action: "Sáp nhập Thống lĩnh từ"
  subsume_province_desc: "Đất đai của [SCHEME.GetTargetTitle.GetHolder.GetShortUINamePossessive] thuộc về [SCHEME.GetOwner.GetPrimaryTitle.GetNameNoTier], và sẽ được quản lý tốt hơn dưới tay ngươi..."
  subsume_province_desc_general: "$subsume_province$ là một [political_scheme|E] nhằm tích hợp một [governorship|E] vào [governorship|E] khác. Nó dựa trên uy tín [diplomacy|E] và [house|E], và có thể huy động [agents|E].\n\nMột $subsume_province$ thành công sẽ khiến tất cả các [counties|E] lân cận của một [de_jure|E] [governorship|E] được chuyển từ tay [scheme_target|E]."
  SUBSUME_PROVINCE_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [governorship|E] đã được chuyển giao"
