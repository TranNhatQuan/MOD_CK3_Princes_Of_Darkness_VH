  scheme_owner_owns_claim: "Ngài đã có yêu sách đối với danh hiệu mục tiêu"
  title_no_more_valid: "Danh hiệu mục tiêu không còn hợp lệ"
  start_generate_claim_interaction: "Tạo Yêu Sách #weak (Âm mưu)#!"
  start_generate_claim_interaction_valid_tt: "[recipient.GetShortUIName] phải nắm giữ một [title|E] mà Ngài có thể tạo [claim|E]"
  scheme_interaction_tt_generate_claim_approved: "Cố gắng tạo một [claim|E] đối với [SelectLocalization(GetPlayer.GetGovernment.IsType('administrative_government'), 'generate_claim_desc_general_governorship', 'generate_claim_desc_general_title')] của [recipient.GetShortUINamePossessiveNoTooltip]"
  start_generate_claim_notification: "Tạo Yêu Sách"
  scheme_critical_moments.1152.t: "$scheme_critical_moments.1132.t$"
  scheme_critical_moments.1152.desc: "Sau khi lục lọi vô số cổ thư; tâng bốc, hối lộ và dối trá với vô số quan lại; cùng việc ngụy tạo giấy tờ, cuối cùng ta cũng có thể trình ra một yêu sách thuyết phục đối với [target.GetName]."
  scheme_critical_moments.1152.desc_discovered: "\n\nTiếc rằng không thể giữ kín #EMP sự can dự#! của ta, nhưng bằng chứng — thật hay giả — giờ đã quá nhiều để có thể làm ngơ."
  scheme_critical_moments.1152.desc_secret: "\n\nDường như chẳng ai nghi ngờ sự xuất hiện đột ngột của yêu sách #EMP được ghi chép hoàn hảo#! này."
  scheme_critical_moments.1152.a: "Xuất sắc."
  scheme_critical_moments.1153.t: "$scheme_critical_moments.1133.t$"
  scheme_critical_moments.1153.desc: "Dù ta có hối lộ bao nhiêu người hay ngụy tạo bao nhiêu văn kiện đi nữa, yêu sách của ta đối với [target.GetName] vẫn nghe không mấy đáng tin trong mắt số đông."
  scheme_critical_moments.1153.desc_discovered: "\n\nHơn nữa, việc ta cố gắng quá mức cũng đã trở thành điều ai cũng biết."
  scheme_critical_moments.1153.desc_secret: "\n\nÍt nhất thì sẽ không ai biết đến thất bại của ta."
  scheme_critical_moments.1153.a: "Thật đáng thất vọng."
