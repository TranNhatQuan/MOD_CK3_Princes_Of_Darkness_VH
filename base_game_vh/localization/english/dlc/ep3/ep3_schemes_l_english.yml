  actor_secondary_start_generate_claim_interaction: "Người Nhận [claim|E]"
 #Challenge Status
  challenge_status: "Thách Thức Địa Vị"
  challenge_status_action: "Thách Thức"
  challenge_status_desc: "Ta sẽ tìm cách thách thức địa vị và ảnh hưởng của [SCHEME.GetTargetCharacter.GetShortUINamePossessive] tại triều đình bằng cách phơi bày những thiếu sót của [SCHEME.GetTargetCharacter.GetHerHis] và phô diễn những phẩm chất #EMP vượt trội hơn#! của ta."
  challenge_status_desc_general: "Trong một [scheme|E] Thách Thức Địa Vị, Ngài tìm cách chiếm đoạt [influence|E] của một nhân vật bằng cách công khai làm nhục họ và thể hiện sự vượt trội của bản thân. Họ cũng sẽ mất [powerful_family_rating|E]."
  CHALLENGE_STATUS_SUCCESS_DESC: "Ngài sẽ nhận được toàn bộ [influence|E] mà [SCHEME.GetTargetCharacter.GetShortUIName] bị mất"
  scheme_critical_moments.1172.t: "$scheme_critical_moments.1132.t$"
  scheme_critical_moments.1172.desc: "Trong những tháng qua, ta đã không bỏ lỡ bất kỳ dịp nào để biến [target.GetTitledFirstName] thành kẻ ngốc trước công chúng. Ta đã lừa [target.GetHerHim] vào những tình huống sai lầm tại triều đình, làm lu mờ [target.GetHerHim] trong kiến thức về các tác phẩm Cổ điển, và dẫn dắt [target.GetHerHim] ủng hộ những biện pháp tài chính không khả thi chỉ để ta nhảy vào sửa sai.\n\nSau một cuộc tranh luận tôn giáo thành công mỹ mãn, nơi ta khéo léo khiến cho mọi người tưởng rằng [target.GetFirstNameNoTooltip] đang truyền bá những niềm tin dị giáo, ta có thể tự hài lòng với kết quả đạt được."
  scheme_critical_moments.1172.a: "[target.GetFirstNameNoTooltip] đã học được vị trí của mình."
  scheme_critical_moments.1173.t: "$scheme_critical_moments.1133.t$"
  scheme_critical_moments.1173.desc: "Thất bại. Dù bao nhiêu lần ta cố gắng, [target.GetTitledFirstName] dường như luôn đi trước ta một bước.\n\nKiến thức văn học của [target.GetHerHis|U] thật tuyệt vời, sự hiểu biết về các vấn đề chính trị thì sâu sắc, và cách nắm bắt những khía cạnh tinh vi nhất của đức tin chúng ta cũng thật vững vàng. Hoặc ít nhất, chúng solid hơn nhiều so với ta."
  scheme_critical_moments.1173.a: "[target.GetFirstNameNoTooltip] quả là một đối thủ khó nhằn."
  challenge_status_invalidated_title: "@scheme_icon! Âm Mưu Thách Thức Địa Vị Kết Thúc"
  scheme_critical_moments.1174.t: "Địa Vị Bị Thách Thức"
  scheme_critical_moments.1174.desc: "Ta xấu hổ khi phải thừa nhận rằng trong những lần xuất hiện công khai gần đây, mọi cuộc đối đầu với [owner.GetTitledFirstName] đều kết thúc bằng việc ta bị lừa và bẽ mặt.\n\nTa không hiểu vì sao chuyện này cứ xảy ra, nhưng mỗi lần bị cuốn vào một cuộc tranh luận với [owner.GetHerHim], ta dường như quên sạch lễ nghi triều đình, các dẫn chứng thì rối tung lên, và [owner.GetSheHe] khiến ta trông như một kẻ ngu ngốc, tệ nhất là một kẻ cảm tình với dị giáo.\n\nTa cần lùi lại một bước và xem xét cẩn trọng mọi lời nói của mình trong một thời gian."
  scheme_critical_moments.1174.a: "Không thể tin được..."
  start_challenge_status_interaction: "Thách Thức Địa Vị #weak (Âm mưu)#!"
  scheme_interaction_tt_challenge_status_approved: "Cố gắng chiếm đoạt [influence|E] từ [recipient.GetShortUINameNoTooltip] bằng cách khiến [recipient.GetHerHim] trông như một kẻ ngốc nơi công chúng"
