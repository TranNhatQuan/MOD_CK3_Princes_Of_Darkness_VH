  raid_estate_vassal_crime: "Đột Kích Dinh Thự Chư Hầu"
  every_other_raid_estate_house_member_tt: "Mỗi thành viên khác của [house|E] [target.GetHouse.GetBaseName]"
  ep3_estate_raided_modifier: "Dinh Thự Bị Đột Kích"
  ep3_estate_raided_modifier_desc: "Dinh thự gia đình này đã bị một Nhà khác đột kích."
  ep3_manor_raided_modifier: "Điền Trang Bị Đột Kích"
  ep3_manor_raided_modifier_desc: "Điền trang gia đình này đã bị một Nhà khác đột kích."
  start_raid_estate_interaction_HIGHLIGHTED: "#EMP [actor.GetTopLiege.GetShortUIName] đã giao cho ngươi nhiệm vụ đột kích [estate|E] của [house|E] [recipient.GetHouse.GetBaseName]#!"
 # Ingratiate Family
  ingratiate_family: "Lấy lòng Gia tộc"
  ingratiate_family_action: "Lấy lòng"
  ingratiate_family_desc: "Ngay cả những Gia tộc hùng mạnh nhất cũng không thể đứng một mình — Gia tộc [SCHEME.GetTargetTitle.GetHolder.GetHouse.GetBaseName] có thể trở thành đồng minh hữu ích, hoặc những con cờ..."
  ingratiate_family_desc_general: "$ingratiate_family$ là một [personal_scheme|E] nhằm giành được thiện cảm của một [house|E]. Nó dựa trên [diplomacy|E] và vị thế [house|E].\n\nMột $ingratiate_family$ thành công sẽ mang lại [opinion|E], [friendship|E] và [influence|E]."
  ingratiate_family_invalidated_title: "@scheme_icon! Âm mưu $ingratiate_family$ kết thúc"
  ingratiate_family_invalidated_dead: "[target.GetShortUIName|U] đã qua đời."
  ingratiate_family_invalidated_war: "Ngài đang có chiến tranh với [target.GetShortUIName]"
  scheme_critical_moments.8052.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.8052.desc: "Suốt nhiều tuần, sứ giả của ta đã không ngừng lui tới điền trang của Gia tộc [target.GetHouse.GetBaseName], mang theo những bức thư tâng bốc ca ngợi đức hạnh và dòng dõi cao quý của họ.\n\nHôm nay, ta xé phong thư hồi đáp được chờ đợi bấy lâu — những lời nịnh nọt và kính trọng tràn ngập bên trong xác nhận rằng cuối cùng [target.GetTitledFirstName] cũng đã hiểu ý.\n\n#EMP \"Ta luôn xem Gia tộc [owner.GetHouse.GetBaseName] là một trong những gia tộc vĩ đại nhất của [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], và tự hào được gọi các ngươi là bằng hữu.\"#!"
  scheme_critical_moments.8052.a: "Chính là vậy."
  scheme_critical_moments.8053.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.8053.desc: "Suốt nhiều tuần, sứ giả của ta đã đều đặn mang những lời lẽ ngọt ngào tới điền trang của Gia tộc [target.GetHouse.GetBaseName], nhưng hồi âm mong đợi vẫn không hề xuất hiện.\n\nCuối cùng, một bức thư mang ấn tín của [target.GetTitledFirstNamePossessive] được đặt trước mặt ta — nhưng lại thiếu vắng những lời ta trông chờ.\n\n#EMP \"Thưa [owner.GetFirstNameNoTooltip], không ai phủ nhận quyền lực và vinh quang của Gia tộc [owner.GetHouse.GetBaseName], nhưng chúng Ta không phải chó cảnh của ngài.\"#!"
  scheme_critical_moments.8053.a: "Một lời đáp táo bạo."
  scheme_critical_moments.8054.t: "Gia tộc bị Lấy lòng"
  scheme_critical_moments.8054.desc: "Trong nhiều tuần, thư từ của [owner.GetTitledFirstName] đã chất đầy trên bàn làm việc của ta, mỗi bức đều tâng bốc Gia tộc [target.GetHouse.GetBaseName] và khéo léo kêu gọi tình hữu nghị với gia đình của [owner.GetHerHis].\n\n"
  scheme_critical_moments.8054.success: "Rõ ràng [owner.GetSheHe] đang tìm cách giành lấy sự ủng hộ của chúng ta, và thật khó để phủ nhận lợi ích của việc liên minh với một gia tộc hùng mạnh như Gia tộc [owner.GetHouse.GetBaseName]."
  scheme_critical_moments.8054.failure: "Những bức thư kỳ quặc và xúc phạm này chỉ khiến chúng ta nghi ngờ động cơ của [owner.GetHerHis], đồng thời tái khẳng định sự độc lập đáng tự hào của gia tộc mình."
  scheme_critical_moments.8054.a.success: "Chúng ta sẵn sàng bàn bạc..."
  scheme_critical_moments.8054.a: "Chúng ta không phải chó cảnh của Gia tộc [owner.GetHouse.GetBaseNameNoTooltip]!"
  start_ingratiate_family_interaction: "$ingratiate_family$ #weak (Scheme)#!"
  start_ingratiate_family_interaction_desc: "Cố gắng giành thiện cảm của [house|E] [recipient.GetHouse.GetBaseNameNoTooltip|V]"
  ingratiate_family_success_actor_tt: "Nếu thành công:\n$EFFECT_LIST_BULLET$ [house|E] [actor.GetHouse.GetName] nhận được [GetModifier('ep3_ingratiated_family_modifier').GetNameWithTooltip] trong #high 10 năm#!\n$EFFECT_LIST_BULLET$ Ngài có thể tiến gần hơn tới việc hình thành Tình bạn với [recipient.GetShortUIName]"
  ingratiate_family_success_recipient_tt: "Nếu thành công:\n $EFFECT_LIST_BULLET$ [recipient.GetShortUIName|U] nhận được [influence_i][EmptyScope.ScriptValue('medium_influence_gain')] [influence|E]\n $EFFECT_LIST_BULLET$ Sẽ tăng thêm [opinion|E] đối với [actor.GetShortUIName]"
  start_ingratiate_family_notification: "$ingratiate_family$"
  ep3_ingratiated_family_modifier: "Gia tộc được Lấy lòng"
  ep3_ingratiated_family_modifier_desc: "Gia tộc hùng mạnh này đã mở rộng tầm ảnh hưởng bằng cách giành được thiện cảm của một gia tộc yếu hơn."
  attempted_ingratiate_family_opinion: "Cố gắng Lấy lòng Gia tộc"
  ingratiate_family_opinion: "Gia tộc được Lấy lòng"
  ingratiating_family_opinion: "Đang Lấy lòng Gia tộc"
  ingratiate_family_living_quarters_building_tt: "Yêu cầu [domicile_building|E] [GetDomicileBuilding('living_quarters_01').GetName]"
  admin_emperor_scheme_modifier_tt: "[scheme|E] của Ngài nhận được [GetModifier('admin_emperor_scheme_modifier').GetNameWithTooltip] vì [actor.GetShortUINameNoTooltip] [CharAreIs(actor)] [actor.GetTitleAsNameNoTooltip]"
  admin_dominant_family_scheme_modifier_tt: "[scheme|E] của Ngài nhận được [GetModifier('admin_dominant_family_scheme_modifier').GetNameWithTooltip] vì [house|E] [actor.GetHouse.GetName] là một [dominant_family|E]"
  admin_powerful_family_scheme_modifier_tt: "[scheme|E] của Ngài nhận được [GetModifier('admin_powerful_family_scheme_modifier').GetNameWithTooltip] vì [house|E] [actor.GetHouse.GetName] là một [powerful_family|E]"
  admin_target_emperor_scheme_modifier_tt: "[scheme|E] của Ngài nhận được [GetModifier('admin_target_emperor_scheme_modifier').GetNameWithTooltip] vì [recipient.GetShortUINameNoTooltip] [CharAreIs(recipient)] [recipient.GetTitleAsNameNoTooltip]"
  admin_target_dominant_family_scheme_modifier_tt: "[scheme|E] của Ngài nhận được [GetModifier('admin_target_dominant_family_scheme_modifier').GetNameWithTooltip] vì [house|E] [recipient.GetHouse.GetName] là một [dominant_family|E]"
  admin_target_powerful_family_scheme_modifier_tt: "[scheme|E] của Ngài nhận được [GetModifier('admin_target_powerful_family_scheme_modifier').GetNameWithTooltip] vì [house|E] [recipient.GetHouse.GetName] là một [powerful_family|E]"
 # Teach Governor
  teach_governor: "Cố vấn Quản trị"
  teach_governor_action: "Cố vấn"
  teach_governor_desc: "Cố gắng cải thiện kỹ năng của một nhân vật khác với tư cách là một [governor|E]"
  teach_governor_desc_general: "$teach_governor$ là một [political_scheme|E] nhằm cải thiện [governor_efficiency|E] của một [governor|E] khác. Mưu đồ này dựa trên [stewardship|E], và có thể chiêu mộ [agents|E].\n\nMột $teach_governor$ thành công sẽ khiến [scheme_target|E] nhận được [trait_level_track_xp|E] của đặc tính [GetTrait('governor').GetName( GetNullCharacter )] và [opinion|E]."
  TEACH_GOVERNOR_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] nhận được [trait_level_track_xp|E] của đặc tính [GetTrait('governor').GetName( GetNullCharacter )] và [opinion|E], và Ngài nhận được một [hook|E] nếu họ không thuộc [house|E] của Ngài"
  teach_governor_invalidated_title: "@scheme_icon! Mưu đồ $teach_governor$ kết thúc"
  start_teach_governor_interaction: "$teach_governor$ #weak (Mưu đồ)#!"
  start_teach_governor_interaction_desc: "Cố gắng cải thiện kỹ năng làm [governor|E] của [recipient.GetShortUINamePossessiveNoTooltip]"
  start_teach_governor_notification: "$teach_governor$"
  scheme_critical_moments.8042.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.8042.desc: "[owner.Custom2('RelationToMeShort', target)] của ta, [target.GetTitledFirstName], dường như đã hoàn toàn trân trọng những lời khuyên của ta về các vấn đề hành chính.\n\nQuả thực, việc dành hàng giờ để bàn luận sổ sách và những tiểu tiết trong bộ máy quan liêu của [target.GetPrimaryTitle.GetAdjective] cùng [target.GetHerHim] gần như đã trở thành một niềm vui.\n\nTa dám nói rằng bản thân cũng đã học được đôi điều trên chặng đường này!"
  scheme_critical_moments.8042.a: "Kết quả thật mỹ mãn!"
  scheme_critical_moments.8043.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.8043.desc: "Dù [owner.Custom2('RelationToMeShort', target)] của ta, [target.GetTitledFirstName], ban đầu tỏ ra tiếp nhận lời đề nghị cố vấn, [target.GetSheHe] lại hoàn toàn thiếu thấu hiểu.\n\nHàng tuần thảo luận sát sao, rà soát hồ sơ hành chính của [target.GetPrimaryTitle.GetAdjective], và đưa ra lời khuyên hầu như chẳng để lại dấu ấn nào lên [target.GetWomanMan].\n\n[target.GetFirstNameNoTooltip] đã phớt lờ, hiểu sai, hoặc phản bác gần như mọi mẩu trí tuệ mà ta dâng lên cho [target.GetHerHim]..."
  scheme_critical_moments.8043.a: "Thật phí thời gian..."
  scheme_critical_moments.8043.tt.failed: "[scheme.GetOwner.GetShortUIName] đã cố tranh chấp biên giới của Ngài, nhưng thất bại!"
  scheme_critical_moments.8044.t: "Được cố vấn Quản trị"
  scheme_critical_moments.8044.desc: "Trong nhiều tuần, ta liên tục nhận được những chuyến thăm bất ngờ và thư từ không dứt từ [target.Custom2('RelationToMeShort', owner)] của ta, [owner.GetTitledFirstName]. [owner.GetSheHe|U] đã tuôn ra hàng loạt lời khuyên không được yêu cầu, tất cả đều xoay quanh việc quản trị đúng đắn một [target.GetPrimaryTitle.GetTierAsNameNoTooltip]...\n\n"
  scheme_critical_moments.8044.success: "Sự hoài nghi ban đầu của ta nhanh chóng nhường chỗ cho ngạc nhiên và kính trọng. Lời nói của [owner.GetHerHis|U] là một suối nguồn trí tuệ mà ta chưa từng cân nhắc, và giờ đây đã được chứng thực qua việc ta điều hành [target.GetPrimaryTitle.GetNameNoTier]!"
  scheme_critical_moments.8044.failure: "Sự hoài nghi của ta sớm được chứng minh, bởi thật đáng tiếc là chẳng có bao nhiêu trí tuệ có thể rút ra từ những giai thoại lan man và châm ngôn rối rắm của [owner.GetHerHis] — dù bề ngoài có vẻ sâu sắc..."
  scheme_critical_moments.8044.a.success: "Lời khuyên hay quả là của hiếm!"
  scheme_critical_moments.8044.a: "Một lời cảm ơn khéo léo, và sau cùng, hẳn sẽ khiến [owner.GetHerHim] im lặng."
  scheme_critical_moments.8045.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
  scheme_critical_moments.8045.desc: "Ta vô cùng biết ơn lời đề nghị cố vấn của ngài về việc quản trị [recipient.GetPrimaryTitle.GetNameNoTierPossessive]!"
  scheme_critical_moments.8045.fallback: "Ta vô cùng biết ơn lời đề nghị cố vấn của ngài về những phức tạp trong quản trị!"
  scheme_critical_moments.8045.rump: "\n\nTa rất mong được lắng nghe những suy nghĩ của ngài."
  scheme_critical_moments.8045.a: "Đó là vinh hạnh của ta."
  scheme_critical_moments.8046.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
  scheme_critical_moments.8046.desc: "Dù ta cảm thấy được nịnh nọt trước lời đề nghị cố vấn của ngài về việc quản trị [recipient.GetPrimaryTitle.GetNameNoTierPossessive],"
  scheme_critical_moments.8046.fallback: "Dù ta cảm thấy được nịnh nọt trước lời đề nghị cố vấn của ngài về những phức tạp trong quản trị,"
  scheme_critical_moments.8046.rump: "ta nghĩ rằng bản thân đã nắm khá vững vấn đề này rồi."
  scheme_critical_moments.8046.a: "Hừm."
