l_english:

  ep3_landless_admin.1000.t: "Trước Cửa"
  ep3_landless_admin.1000.desc: "Một tiếng gõ nhẹ vào cửa dinh thự làm ta ngạc nhiên trong lúc đi dạo.\n\n\"Vào đi.\"\n\nMột [proposed_councillor.GetWomanMan] ăn mặc chỉnh tề đứng ở cửa, tay ôm chặt túi của mình.\n\n\"Ta đến để cung cấp dịch vụ của mình cho gia tộc đức hạnh [ROOT.Char.GetHouse.GetBaseNameNoTooltip]. Ta có kỹ năng tuyệt vời và sẽ phục vụ ngài tận tình.\""
  ep3_landless_admin.1000.a: "\"Một [proposed_councillor.GetWomanMan] lành nghề luôn là điều cần thiết.\""
  ep3_landless_admin.1000.b: "\"Chắc hẳn được phụng sự ta sẽ là #EMP vinh dự#! của ngươi.\""
  ep3_landless_admin.1000.b.success: "[proposed_councillor.GetShortUIName] vô cùng ấn tượng"
  ep3_landless_admin.1000.b.mid: "[proposed_councillor.GetShortUIName] có vẻ đã bị thuyết phục"
  ep3_landless_admin.1000.b.failure: "[proposed_councillor.GetShortUIName] cảm thấy bị xúc phạm"
  ep3_landless_admin.1000.c: "\"Ta không cần kẻ lạ mặt.\""
  ep3_landless_admin.1010.t: "Dinh Thự Lẫy Lừng"
  ep3_landless_admin.1010.desc: "\"Thật là cảnh tượng khó tin! Người ta nói bên trong có tới hai trăm căn phòng, và mọi cánh cửa đều được làm bằng vàng ròng! Còn tầng hầm nữa — à! Kính chào, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nMột [local.GetWomanMan] giản dị đến tầm thường đứng giữa khu vườn của ta. Một đứa trẻ nhỏ đang núp sau vạt áo của [local.GetHerHis].\n\n\"Chúng Ta chỉ tham quan dinh thự thôi, vì dân địa phương ai cũng trầm trồ trước sự tráng lệ của nó!\""
  ep3_landless_admin.1010.a: "\"Các ngươi làm gì trong dinh thự của ta...? Gián điệp!\""
  ep3_landless_admin.1010.b: "\"Chúng ta nên yêu cầu một chút cống nạp...\""
  ep3_landless_admin.1010.c: "\"Hãy để #EMP mọi người#! đều biết.\""
  ep3_landless_admin.1010.d: "\"Có muốn ở lại không?\""
  MODIFIER_DEFINITION_VALUE_PER_ESTATE_BUILDING: " \t#weak Tăng theo mỗi cấp [building|E] của $estate_main_01_domicile_building$#!"
  ep3_good_estate_modifier: "Dinh Thự Danh Tiếng"
  ep3_good_estate_modifier_desc: "Dân địa phương bị ấn tượng bởi việc bảo trì $estate_main_01_domicile_building$ của nhân vật này."
  ep3_extra_security_modifier: "Tường Thành Kiên Cố Hơn!"
  ep3_extra_security_modifier_desc: "Nhân vật này đã gia cố an ninh dinh thự vì lo ngại gián điệp."
  ep3_landless_admin.1020.t: "Chỉ Với Một Ít Vàng..."
  ep3_landless_admin.1020.desc.intro: "Âm thanh của một túi tiền leng keng là thứ khó mà nhầm lẫn. [steward.GetTitledFirstName] mở cửa, [steward.Custom('quirk_pos_pp')].\n\n\"Thưa chủ công! Dinh thự thật tráng lệ! Bọn gia nhân đã trầm trồ suốt cả buổi sáng trước\""
  ep3_landless_admin.1020.desc.market: "khu chợ"
  ep3_landless_admin.1020.desc.garden: "khu vườn"
  ep3_landless_admin.1020.desc.guardhouse: "nhà lính gác"
  ep3_landless_admin.1020.desc.workshop: "xưởng thủ công"
  ep3_landless_admin.1020.desc.barracks: "doanh trại"
  ep3_landless_admin.1020.desc.vineyard: "vườn nho"
  ep3_landless_admin.1020.desc.olive: "vườn ô-liu"
  ep3_landless_admin.1020.desc.tea: "đồn điền trà"
  ep3_landless_admin.1020.desc.outro: "kể từ sáng sớm,\" [steward.GetFirstNameNoTooltip] chỉ tay mơ hồ về phía đó.\n\n\"Ta rất hân hạnh được giúp ngài khai thác tối đa giá trị của nơi này.\""
  ep3_landless_admin.1020.a: "\"Chợ búa là trái tim của mọi thành phố.\""
  ep3_landless_admin.1020.b: "\"Ta có thể tưởng tượng mình nghỉ ngơi trong khu vườn ấy...\""
  ep3_landless_admin.1020.c: "\"An ninh là điều quan trọng nhất.\""
  ep3_landless_admin.1020.d: "\"Thợ thủ công! Ta yêu họ!\""
  ep3_landless_admin.1020.e: "\"Quân lính của ta phải được huấn luyện tốt nhất.\""
  ep3_landless_admin.1020.f: "\"Ta nóng lòng được nếm rượu vang rồi!\""
  ep3_landless_admin.1020.g: "\"Dầu ăn là thứ thiết yếu nhất.\""
  ep3_landless_admin.1020.h: "\"Chúng ta cần #EMP từng#! đồng xu để giữ được như vậy.\""
  ep3_landless_admin.1020.h.flavor: "Số vàng đó an toàn hơn nhiều nếu nằm trong tay ta..."
  ep3_landless_admin.1020.j: "\"Trà ngon mới là dấu hiệu của sự tao nhã.\""
  ep3_landless_admin.1030.t: "Bí Mật Đổi Bí Mật"
  ep3_landless_admin.1030.desc: "Một vị khách đến thẳng từ triều đình của [liege.GetTitledFirstNamePossessive]! Một [courtier.GetWomanMan] đứng trước mặt ta, [courtier.Custom('quirk_pos_pp')].\n\n\"Xin nói nhỏ thôi, [ROOT.Char.Custom('FormOfAddressForLiege')]. Người ta đồn rằng ngài rất quan tâm đến vị quân chủ chung của chúng ta... Ta biết rõ [liege.GetHerHim]. Ở triều đình ai cũng biết [liege.GetHerHim]. Một bí mật chỉ mạnh bằng mắt xích yếu nhất,\" [courtier.GetSheHe] cười nhếch mép.\n\n\"Bí mật đổi bí mật, ngài thấy sao?\""
  ep3_landless_admin.1030.a: "\"Điều gì ngăn ngươi tiết lộ #EMP bí mật của ta#!?\""
  ep3_landless_admin.1030.b: "\"Một [courtier.GetWomanMan] không có danh dự thì không xứng đáng nhận phần thưởng.\""
  ep3_landless_admin.1030.c: "\"Một đề nghị thú vị đấy...\""
  ep3_landless_admin.1030.d: "\"Lòng biết ơn của ta là đủ rồi.\""
  ep3_landless_admin.1030.d.success: "Ngài thuyết phục được [courtier.GetShortUIName]"
  ep3_landless_admin.1030.d.failure: "[courtier.GetShortUIName] không hề ấn tượng"
  ep3_landless_admin.1030.e: "\"Đừng lôi ta vào chuyện này.\""
  ep3_no_secrets_modifier: "Không Bí Mật"
  ep3_no_secrets_modifier_desc: "Nhân vật này cực kỳ cẩn trọng với các bí mật của mình."
  ep3_landless_admin.1040.t: "Người Kế Vị Tiếp Theo"
  ep3_landless_admin.1040.desc.intro: "Không khí đượm mùi hương hoa, và ta bước đi bên cạnh [spymaster.GetTitledFirstName] băng qua con suối nhỏ, trong vắt và sáng ngời.\n\n\"Ngài đã cân nhắc về việc đó chưa, [ROOT.Char.Custom('FormOfAddressForLiege')]? [rival.GetTitledFirstName] kia đang ở vị trí nguy hiểm gần với [my_title.GetName]. Một số kẻ đồn đại rằng [rival.GetSheHe] đã bắt đầu toan tính các sắc lệnh của riêng [rival.GetHerHis]...\"\n\n\"Nhưng mọi chuyện không nhất thiết phải như vậy. Tin đồn thì rẻ mạt mà.\"\n\n\""
  ep3_landless_admin.1040.desc.child: "Chính con ta... ta có dám làm điều đó không?"
  ep3_landless_admin.1040.desc.spouse: "Chính phu thê của ta... ta đã thề sẽ luôn ở bên người."
  ep3_landless_admin.1040.desc.family: "Máu mủ ruột rà... lẽ nào ta không nên bảo vệ?"
  ep3_landless_admin.1040.a: "\"Tin đồn ư! Thứ đó ta làm giỏi nhất!\""
  ep3_landless_admin.1040.b: "\"Thật đáng tiếc. Ta sẽ về phòng.\""
  ep3_landless_admin.1040.c: "\"Đáng để thử.\""
  ep3_landless_admin.1040.d: "\"Nhưng chẳng phải người ta đồn rằng [rival.GetSheHe] #EMP bất tài#! sao?\""
  ep3_landless_admin.1040.d.success: "Ngài làm tổn hại tư cách ứng viên của [rival.GetShortUIName]"
  ep3_landless_admin.1040.d.failure: "Ảnh hưởng của Ngài suy giảm"
  ep3_landless_admin.1040.e: "\"Hãy để số phận quyết định.\""
  ep3_landless_admin.1040.tt: "Điểm ứng viên của [rival.GetShortUINamePossessive] cho [my_title.GetName] giảm đi #negative_value [EmptyScope.ScriptValue('appointment_score_medium_value')|0]#!"
  ep3_well_rested_modifier: "Nghỉ Ngơi Đầy Đủ"
  ep3_well_rested_modifier_desc: "Nhân vật này chọn nghỉ ngơi thay vì can dự chính trị."
  ep3_landless_admin.1050.t: "Ngay Bên Dưới"
  ep3_landless_admin.1050.desc.intro: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [servant.GetTitledFirstName] tìm đến ta, mồ hôi túa ra trên trán [servant.GetHerHis] khi chúng ta bước đi. \"Những người công nhân vừa tìm thấy một vài đường hầm bên dưới\""
  ep3_landless_admin.1050.desc.prison: "nhà giam."
  ep3_landless_admin.1050.desc.servants: "khu nhà gia nhân."
  ep3_landless_admin.1050.desc.wine: "hầm rượu."
  ep3_landless_admin.1050.desc.outro: "Chúng lan tỏa theo mọi hướng.\"\n\nNhững gì ta thấy thật kinh ngạc. Đây không thể là thứ do thợ xây của ta tạo ra.\n\nCó một sự hiện diện cổ xưa trong những bức tường này... đá đã mục nát vì thời gian."
  ep3_landless_admin.1050.a: "Ai... ai đã xây dựng thứ này!?"
  ep3_landless_admin.1050.b: "Sẽ thật đáng tiếc nếu ai đó bị lạc dưới đó..."
  ep3_landless_admin.1050.c: "Chúng ta không thể mạo hiểm để tù nhân trốn thoát."
  ep3_landless_admin.1050.c.success: "Ngài gia cố nhà giam"
  ep3_landless_admin.1050.c.failure: "Nỗ lực của Ngài không mang lại kết quả"
  ep3_landless_admin.1050.d: "Chắc chắn có kho báu dưới đó!"
  ep3_landless_admin.1050.d.success: "Ngài tìm thấy thứ gì đó"
  ep3_landless_admin.1050.e: "Chúng ta có thể dùng nó cho #EMP điệp viên#! của mình..."
  ep3_landless_admin.1050.e.success: "Ngài dọn sạch đống đổ nát trong đường hầm"
  ep3_landless_admin.1050.f: "Cứ để nguyên như vậy."
  SCHEME_SECRET_DOMICILE_TUNNEL: "Ngài có thể dùng các đường hầm bí mật: $VALUE|+0=$"
  ep3_secret_tunnels_abduct: "Âm mưu [GetScheme('abduct').GetTypeName] của Ngài có [success_chance|E] cao hơn"
  ep3_tunnel_investigation_modifier: "Điều Tra Đường Hầm"
  ep3_tunnel_investigation_modifier_desc: "Nhân vật này phát hiện các đường hầm bên dưới dinh thự và quyết định điều tra."
  ep3_tunnel_prison_modifier: "Không Ai Thoát Ra"
  ep3_tunnel_prison_modifier_desc: "Nhân vật này đã gia cố nhà giam."
  ep3_tunnel_servants_modifier: "Lối Tắt"
  ep3_tunnel_servants_modifier_desc: "Nhân vật này sử dụng các đường hầm dưới dinh thự làm lối đi tắt."
