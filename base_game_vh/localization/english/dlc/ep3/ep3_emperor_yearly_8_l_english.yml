l_english: 
  ep3_emperor_yearly.8000.t: "Chia Sẻ Gánh Nặng"
  ep3_emperor_yearly.8000.intro_byz: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], ánh sáng bất diệt của đế chế, đang oằn mình trong những thời khắc thử thách này."
  ep3_emperor_yearly.8000.intro: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], kinh đô vĩ đại của chúng ta, rên xiết dưới sức nặng của vô vàn yêu cầu mà [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] đặt lên thần dân."
  ep3_emperor_yearly.8000.desc: "\n\nNhững cuộc xung đột gần đây đã để lại tổn thất nặng nề: các đội tuyển quân ngày càng khó đạt chỉ tiêu, và tình trạng thiếu lao động đủ mọi ngành nghề lan rộng khắp thành phố.\n\n[ROOT.Char.Custom2('RelationToMeShort', suggestor)] của ta, [suggestor.GetTitledFirstName], đã tổng hợp một danh sách các tỉnh thịnh vượng, nơi của cải có thể tiếp sức cho kinh đô trong lúc khó khăn này."
  ep3_emperor_yearly.8000.a: "Đúng vậy, hãy đưa người từ [county_1.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] tới."
  ep3_emperor_yearly.8000.b: "Kinh đô quan trọng hơn [county_2.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip]."
  ep3_emperor_yearly.8000.c: "[county_3.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] phải hy sinh."
  ep3_emperor_yearly.8000.d: "Đơn giản là thời buổi khó khăn."

  ep3_emperor_yearly.8010.opening_byz: "Kính chào [ROOT.Char.GetTitleAsNameNoTooltip],"
  ep3_emperor_yearly.8010.opening: "Chào ngài [ROOT.Char.GetTitledFirstNameNoTooltip],"
  ep3_emperor_yearly.8010.desc: "Một [liar.GetWomanMan] tên là [liar.GetFirstName] đã tìm đến ta xin việc, tự xưng mang theo thư tiến cử của \"[ROOT.Char.GetTitleAsNameNoTooltip] đích thân [ROOT.Char.GetHerselfHimself].\"\n\nCon dấu được xác định là giả mạo, và hiện ta đang giam giữ kẻ mạo danh trơ trẽn này trong ngục."
  ep3_emperor_yearly.8010.a: "Sự cẩn trọng của ngươi sẽ được tưởng thưởng, [governor.GetFirstNameNoTooltip]."
  ep3_emperor_yearly.8010.b: "Con dấu đó #EMP đúng là#! của ta! Thả [liar.GetHerHim] ngay!"
  ep3_emperor_yearly.8010.c: "Rất tốt, hãy áp giải tên khốn đó đến gặp ta."
  ep3_emperor_yearly.8010.c.tt: "Tù nhân được chuyển giao"
  ep3_emperor_yearly.8010.d: "Giả mạo ấn tín hoàng gia phải bị trừng trị nghiêm khắc."

  ep3_emperor_yearly.8020.t: "Ân Sủng Màu Tím"
  ep3_emperor_yearly.8020.intro.really_bankrupt: "Những phòng khố trống rỗng không còn lấy một hạt vàng nhỏ nhất, và [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] rên xiết dưới gánh nặng của tình trạng cạn kiệt tài chính."
  ep3_emperor_yearly.8020.intro.bankrupt: "Kho bạc hoàng gia đã trống không, và những giấy nợ của quan giữ sổ là thứ duy nhất giúp quân đội và bộ máy quan liêu của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive|l] cầm cự qua ngày."
  ep3_emperor_yearly.8020.intro: "Dòng tiền đang xuống đáy, và việc tìm nguồn tài chính cho các kế hoạch của ta — chứ chưa nói đến việc vận hành trơn tru [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] — ngày càng khó khăn."
  ep3_emperor_yearly.8020.desc: "\n\nSau hàng loạt ám chỉ không mấy tinh tế về lợi ích của sự bảo trợ đúng chỗ và những nhu cầu khó nói, [ROOT.Char.Custom2('RelationToMeShort', suggestor)] của ta, [suggestor.GetTitledFirstName], cuối cùng cũng nói thẳng.\n\n\"Tâu [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại... tuy việc khoác lên mình [Glossary( 'porphúra', 'PORPHURA_GLOSS' )] là đặc quyền hoàng đế, nhưng cũng không phải chưa từng có tiền lệ cho việc cho... #EMP những#! thần dân tận tâm thuê lại quyền ấy.\""
  ep3_emperor_yearly.8020.a.friend: "Bằng hữu của ta, [purpler_1.GetFirstNameNoTooltip], là một ngoại lệ."
  ep3_emperor_yearly.8020.a.claimant: "Những yêu sách như của [purpler_1.GetFirstNamePossessiveNoTooltip] nên được công nhận."
  ep3_emperor_yearly.8020.a.vassal: "Ta nghĩ [purpler_1.GetFirstNameNoTooltip] sẽ khoác nó rất hợp."
  ep3_emperor_yearly.8020.b.friend: "[purpler_2.GetFirstNameNoTooltip] là bằng hữu xứng đáng của ta."
  ep3_emperor_yearly.8020.b.claimant: "[purpler_2.GetFirstNameNoTooltip] có một yêu sách chính đáng."
  ep3_emperor_yearly.8020.b.vassal: "[purpler_2.GetFirstNameNoTooltip] trông có vẻ xứng đáng."
  ep3_emperor_yearly.8020.c.friend: "Tình bằng hữu là trên hết: [purpler_3.GetFirstNameNoTooltip]."
  ep3_emperor_yearly.8020.c.claimant: "Người có yêu sách có quyền đặc biệt: [purpler_3.GetFirstNameNoTooltip]."
  ep3_emperor_yearly.8020.c.vassal: "Thì cũng có thể là [purpler_3.GetFirstNameNoTooltip]..."
  ep3_emperor_yearly.8020.d: "Màu tím không thể bị #EMP mua#!!"
  PORPHURA_GLOSS: "Từ thời kỳ cuối của Đế chế La Mã, chỉ hoàng đế mới được phép mặc y phục nhuộm màu tím Tyre vô giá, tạo ra từ dịch tiết của loài ốc biển murex Địa Trung Hải"

  ep3_emperor_yearly.8030.t: "Tai Họa Của Bosporos"
  ep3_emperor_yearly.8030.desc: "Một con cá voi hung dữ đang tàn phá tàu thuyền dọc theo eo biển, [ROOT.Char.Custom2('RelationToMeShort', complainer)] của ta, [complainer.GetTitledFirstName], than thở: \"Ngư dân, thương nhân — thậm chí cả thuyền trưởng hải quân! Tất cả đều sợ rời bến.\"\n\nNhững ghi chép cũ kỹ về cuộc chiến nhiều thập kỷ của [justinian.GetFirstNamePossessiveRegnal] với 'Porphyrios', tai họa của biển cả trước khi nó mắc cạn và bị chém thành từng mảnh, được đem ra nhắc lại — thậm chí có kẻ cho rằng mối đe dọa mới này là hậu duệ báo thù của nó...\n\nNhững kế sách đáng ngờ được đề xuất để đối phó với nỗi kinh hoàng của biển sâu, khi các bản tường thuật về những chiến tích của nó ngày một chồng chất."
  every_bosporos_sea_province_tt: "$sea_bosporus$, $sea_marmara$, và $sea_dardanelles$"
  every_bosporos_coast_county_tt: "[THIS.Char.GetCapitalLocation.GetName], và các [counties|E] ven eo biển khác"
  ep3_emperor_yearly.8030.a: "Phải chặn đứng nó, bằng mọi giá!"
  ep3_emperor_yearly.8030.a.success: "Con quái vật bị tiêu diệt"
  ep3_emperor_yearly.8030.a.failure: "Con quái vật không thể ngăn cản"
  ep3_emperor_yearly.8030.a.flavor: "Vũ trang thuyền chiến, mang xác nó về cho ta!"
  ep3_emperor_yearly.8030.c: "Ban hành quy định về vũ trang, hộ tống và tuyến đường an toàn."
  ep3_emperor_yearly.8030.d: "Thủy thủ phải cầu xin [ROOT.Char.GetFaith.WaterGodName]."
  ep3_emperor_yearly.8030.d.flavor: "Chúng ta chỉ còn biết cầu nguyện cho sự cứu rỗi..."

  ep3_emperor_yearly.8040.t: "Cơn Thịnh Nộ Của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"
  ep3_emperor_yearly.8040.intro: "Triều đại của ta liên tiếp gặp phải thất bại và bất hạnh"
  ep3_emperor_yearly.8040.truce_target: "— cay đắng nhất là đại bại dưới tay [truce_target.GetTitledFirstNamePossessive] —"
  ep3_emperor_yearly.8040.truce_holder: "— ngay cả chiến thắng vĩ đại trước [truce_holder.GetTitledFirstName] cũng phải trả giá —"
  ep3_emperor_yearly.8040.plague: "— tai họa [epidemic.GetName] hoành hành ngay cả tại [constantinople.GetNameNoTooltip], làm quá tải các bệnh viện —"
  ep3_emperor_yearly.8040.past_plague: "— dịch bệnh từng rình rập khắp đế chế, không tha cả [constantinople.GetNameNoTooltip] —"
  ep3_emperor_yearly.8040.debt: "— quốc khố trống rỗng, bộ máy nhà nước chỉ còn trông cậy vào tín dụng và thiện chí —"
  ep3_emperor_yearly.8040.desc: "và dân chúng ngày càng bất an...\n\nTa không khỏi tự hỏi: liệu phe Bài Trừ Thánh Tượng có đúng không? Phải chăng những tai ương của đế chế chỉ là sự trừng phạt của [ROOT.Char.GetFaith.HighGodNamePossessive] vì đã phớt lờ các điều răn của [ROOT.Char.GetFaith.HighGodHerHis]?\n\n"
  ep3_emperor_yearly.8040.family: "Chính [ROOT.Char.Custom2('RelationToMeShort', family)] của ta, [family.GetFirstName], cũng từng tin chắc vào những điều ấy. Có lẽ ta đã mù quáng..."
  ep3_emperor_yearly.8040.predecessor: "Ta nhìn lại triều đại của [predecessor.GetTitledFirstNameRegnal], và nghi ngờ nền tảng niềm tin của chính mình..."
  ep3_emperor_yearly.8040.leo: "Học thuyết của [leo.GetTitledFirstNameRegnal] và người Isauria từng mang đến chia rẽ lớn cho đế chế và toàn thể Kitô giáo — nhưng cũng chỉ trong một thời gian..."
  ep3_emperor_yearly.8040.a: "Đã đến lúc thực sự chấm dứt mọi hình thức sùng bái ngẫu tượng!"
  ep3_emperor_yearly.8040.b: "Ta sẽ không nhượng bộ dị giáo."

  ep3_emperor_yearly.8050.t: "Những Vị Khách Không Mời"
  ep3_emperor_yearly.8050.desc: "Thuyền bè từ khắp nơi trên thế giới neo đậu tại các hải cảng của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l], và [marshal.GetTitledFirstName] báo cáo rằng một hạm đội nhỏ gần đây đã thả neo ngoài khơi [raid_target.GetProvince.GetBaronyNameExplicitlyNoTooltip].\n\nThuyền trưởng của họ, một kẻ man rợ tên là [raider.GetFirstName], đòi cống nạp, đe dọa sẽ cướp bóc nếu yêu cầu của [raider.GetHerHis] không được đáp ứng.\n\nNhững kẻ cướp biển phương bắc xa xôi vốn khét tiếng, và có vẻ như nhóm này chỉ định kiếm lợi nhờ danh tiếng đó."
  ep3_emperor_yearly.8050.a: "Trả cho chúng cái giá rẻ mạt ấy."
  ep3_emperor_yearly.8050.b: "Ta có thể dùng một kẻ ngoài vòng lễ nghi táo tợn như vậy."
  ep3_emperor_yearly.8050.b.byz: "Ta có thể dùng một Varangian liều lĩnh như vậy."
  ep3_emperor_yearly.8050.c: "Phái thuyền chiến truy đuổi lũ chó săn này!"
  ep3_emperor_yearly.8050.c.success: "Thuyền dài bị đánh tan"
  ep3_emperor_yearly.8050.c.failure: "Bọn cướp quá khó truy bắt"

  ep3_emperor_yearly.8060.t: "Biên Cương Dậy Sóng"
  ep3_emperor_yearly.8060.intro: "Tin dữ đã đến từ [defector.GetPrimaryTitle.GetNameNoTier]: lời thì thầm rằng [ROOT.Char.Custom2('RelationToMeShort', defector)] của ta, [defector.GetTitledFirstName], đang cấu kết với [sponsor.GetName], thậm chí có thể đang toan tính đào ngũ!\n\nKhông thể có bất kỳ sự bào chữa hay khoan nhượng nào cho thứ phản nghịch xảo quyệt này đối với [ROOT.Char.GetTitleAsNameNoTooltip] của mình —"
  ep3_emperor_yearly.8060.spouse: "bổn phận hoàng gia phải đặt trên tình nghĩa với [defector.Custom2('RelationToMeShort', sponsor)]!"
  ep3_emperor_yearly.8060.family: "lòng trung thành với đế chế phải đặt trên nghĩa vụ với [defector.Custom2('RelationToMeShort', sponsor)]!"
  ep3_emperor_yearly.8060.house: "mối ràng buộc của Nhà [defector.GetDynastyHouseName]"
  ep3_emperor_yearly.8060.dynasty: "hãy nguyền rủa những mối liên hệ huyết thống cũ giữa Nhà [defector.GetDynastyHouseName] và Nhà [sponsor.GetDynastyHouseName]."
  ep3_emperor_yearly.8060.faith_and_culture: "bất chấp mọi khác biệt về truyền thống và tín ngưỡng!"
  ep3_emperor_yearly.8060.culture: "đế chế quan trọng hơn những phong tục và ngôn ngữ địa phương!"
  ep3_emperor_yearly.8060.faith: "đế chế quan trọng hơn tôn giáo, dù niềm tin ấy có lạc lối đến đâu!"
  ep3_emperor_yearly.8060.fallback: "đế chế quan trọng hơn mọi mối quan hệ cá nhân tầm thường!"
  ep3_emperor_yearly.8060.a: "\"Bắt con thú đó lại, ta ra lệnh!\""
  ep3_emperor_yearly.8060.b: "Nhắc nhở [defector.GetFirstNameNoTooltip] về những giá trị của lòng trung thành."
  ep3_emperor_yearly.8060.c: "Cứ để con chó đó làm theo ý [defector.GetSheHe]."

  ep3_emperor_yearly.8060.every_title: "Ngài nhận được [claims|E] trên toàn bộ [titles|E] của [defector.GetTitledFirstNamePossessive]"
  ep3_emperor_yearly.8060.defect: "[defector.GetTitledFirstName] đào ngũ"
  ep3_emperor_yearly.8060.no_defect: "[defector.GetTitledFirstName] vẫn trung thành"
  ep3_emperor_yearly.8060.success: "Ngài ra tay trước khi [defector.GetSheHe] kịp chuẩn bị"
  ep3_emperor_yearly.8060.failure: "[defector.GetTitledFirstNameNoTooltip] trốn thoát"
