l_english: 
 # Story Cycle
  admin_eunuch_header: "Hoạn quan Lừng danh:"
  admin_eunuch_upgrade_modifier_tt: "#weak [modifiers|E] được nâng cấp#!"
  admin_eunuch_downgrade_modifier_tt: "#weak [modifiers|E] bị hạ cấp#!"
  admin_eunuch_flavor_tt: "#weak Ảnh hưởng của [eunuch.GetFirstNamePossessiveNoTooltip] có thể mang lại lợi ích to lớn, nhưng cái giá là gì?#!"
  admin_eunuch_rivalry_tt: "[THIS.Char.GetShortUIName] ngày càng tiến gần đến việc hình thành mối thù địch với [eunuch.GetShortUIName]"
 # Events
  ep3_story_cycle_admin_eunuch.1001.t: "$admin_eunuch_header$ [eunuch.GetFullNameNoTooltip]"
  ep3_story_cycle_admin_eunuch.1001.intro_byz: "Trong nhiều thế kỷ, [Glossary( 'eunoukhoi', 'EUNOUKOS_GLOSS' )] đã phục vụ trong bộ máy quan liêu và các cung điện của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] với vai trò cố vấn và tâm phúc, giữ những vị trí quan trọng trong các cuộc đấu chính trị đương thời."
  ep3_story_cycle_admin_eunuch.1001.intro: "Lãnh thổ luôn cần những viên chức và gia nhân đáng tin cậy để đảm bảo chính quyền vận hành trôi chảy và an toàn cho cung điện, và hoạn quan là một trong những tầng lớp được coi trọng nhất trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  ep3_story_cycle_admin_eunuch.1001.desc: "\n\n[eunuch.GetFirstName] đã nhanh chóng thăng tiến trong hệ thống thứ bậc, và tài năng, sự liêm chính cùng kín đáo của [eunuch.GetHerHis] trong mọi việc được ca ngợi hiếm thấy khắp các hàng ngũ trong cung."
  ep3_story_cycle_admin_eunuch.1001.arrivals: "\n\nXuất thân từ một gia đình [origin.GetDeJureLiege.GetAdjective] khiêm tốn, thân quyến của [eunuch.GetHerHis] gần đây đã theo [eunuch.GetHerHim] đến [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
  ep3_story_cycle_admin_eunuch.1001.a: "Ta có đúng công việc dành cho [eunuch.GetHerHim]."
  ep3_story_cycle_admin_eunuch.1001.b: "Một người đáng để theo dõi..."
  EUNOUKOS_GLOSS: "Hoạn quan, theo nghĩa đen là \"người canh phòng phòng ngủ\" do vai trò phổ biến của họ với tư cách thị vệ buồng trong, là những nam nô bị thiến. Được tuyển chọn từ nhiều tầng lớp xã hội, thường có học vấn cao và được tin cậy vì không bị chi phối bởi dục vọng hay lợi ích gia đình, họ nhanh chóng trở thành những nhân tố quyền lực trong chính trường Byzantine."

  ep3_story_cycle_admin_eunuch.2010.t: "$admin_eunuch_header$ Đôi tay Đáng tin cậy"
  ep3_story_cycle_admin_eunuch.2010.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], tiến đến chỗ ta trong triều, nói khẽ khi đôi mắt [eunuch.GetHerHis] liếc quanh căn phòng.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [eunuch.GetSheHe] lải nhải, \"rõ ràng là các sắp xếp trong chính quyền có thể được xử lý trôi chảy hơn rất nhiều so với hiện tại.\"\n\n\"Đảm bảo một chương trình rõ ràng và trật tự sẽ là niềm an ủi lớn cho lãnh thổ — xin cứ để Ta lo.\""
  ep3_story_cycle_admin_eunuch.2010.a: "Phải, ngươi nên xử lý những việc ấy, [eunuch.GetFirstNameNoTooltip]."
  ep3_story_cycle_admin_eunuch.2010.b: "Cách sắp xếp hiện tại đã đủ."

  ep3_story_cycle_admin_eunuch.2015.t: "$admin_eunuch_header$ Chia sẻ Gánh nặng"
  ep3_story_cycle_admin_eunuch.2015.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], gần đây đã giúp đỡ rất nhiều, gánh vác không ít những trách nhiệm nặng nề của lãnh thổ.\n\nKhi chúng ta vật lộn giữa những chồng văn kiện, tiêu tốn không ít sáp niêm với từng lần đóng ấn hoàng gia, [eunuch.GetSheHe] nhẹ nhàng thưa, \"Thưa bệ hạ, "
  ep3_story_cycle_admin_eunuch.2015.war: "thời gian và sự chú tâm của người đang bị chiến tranh vắt kiệt,\""
  ep3_story_cycle_admin_eunuch.2015.hunter: "người không còn thời gian cho thú vui săn bắn yêu thích,\""
  ep3_story_cycle_admin_eunuch.2015.fallback: "người bị những việc lặt vặt của quốc sự bào mòn,\""
  ep3_story_cycle_admin_eunuch.2015.outro: "và với Ta thì chẳng phiền hà gì nếu được gánh bớt cho người những trách nhiệm mệt mỏi ấy...\""
  ep3_story_cycle_admin_eunuch.2015.a: "Ngươi giúp ta rất nhiều, [eunuch.GetFirstNameNoTooltip]."
  ep3_story_cycle_admin_eunuch.2015.b: "Ta tự xoay xở được."

  ep3_story_cycle_admin_eunuch.2021.t: "$admin_eunuch_header$ Chức vị Cao"
  ep3_story_cycle_admin_eunuch.2021.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], đã sắp xếp một cuộc họp riêng, và ta ngạc nhiên khi thấy [eunuch.GetHerHim] đi cùng với một người khác. \"À, [ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] líu lo, \"Ngài biết [eunuch.Custom2('RelationToMeShort', SCOPE.sC('governor'))] [governor.Custom('ComplimentAdjective')] của tôi, [governor.GetTitledFirstName] chứ?\"\n\nVới sự chuẩn bị kỹ lưỡng, [governor.GetWomanMan] này thể hiện hết mình vì lợi ích của ta.\n\n\"Thưa chúa công, [governor.GetFirstNameNoTooltip] sẽ là một ứng viên #EMP xuất sắc#! cho chức tổng trấn của [title.GetAdjective] [title.GetTierAsNameNoTooltip] — dù sao thì cũng tốt hơn nhiều so với phương án thay thế...\""
  ep3_story_cycle_admin_eunuch.2021.a.grant: "Được, [title.GetNameNoTierNoTooltip] thuộc về [governor.GetFirstNamePossessiveNoTooltip]."
  ep3_story_cycle_admin_eunuch.2021.a: "Được, [governor.GetFirstNameNoTooltip] sẽ được đưa vào danh sách rút gọn."
  ep3_story_cycle_admin_eunuch.2021.b: "[eunuch.Custom2('RelationToMeShort', SCOPE.sC('governor'))] của ngươi nên đi theo con đường chính thống..."

  ep3_story_cycle_admin_eunuch.2023.desc: "Quan sát từ cung điện, ta than thở trước sự lãng phí tài năng của ngươi, và sự thăng tiến của những [governor.GetWomenMen] tầm thường hơn trong vai trò tổng trấn của [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\nVì lợi ích của [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip], nếu không phải của chính [emperor.GetHerselfHimself], [emperor.GetTitleAsNameNoTooltip] phải nhận ra tài năng của ngươi. Với một ít kinh phí, ta có thể đảm bảo [governor.GetSheHe] cũng hiểu được điều đó..."
  ep3_story_cycle_admin_eunuch.2023.a: "Hãy làm đi, hoạn quan!"
  ep3_story_cycle_admin_eunuch.2023.a.tt: "[eunuch.GetFirstName] sẽ cố thuyết phục [emperor.GetTitledFirstName] ban cho Ngài một [governorship|E]"
  ep3_story_cycle_admin_eunuch.toast: "Hoạn quan Lừng danh"
  ep3_story_cycle_admin_eunuch.2023.b: "Ta không có thời gian cho chuyện này."
  ep3_story_cycle_admin_eunuch.2023.b.toast: "Đề xuất bị từ chối"

  ep3_story_cycle_admin_eunuch.2024.t: "$admin_eunuch_header$ Chức vụ Quý tộc"
  ep3_story_cycle_admin_eunuch.2024.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], trượt vào phòng, khép nép bước về phía ghế ngồi của ta.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] thốt lên vui mừng, \"Thật mừng khi được gặp ngài! Tôi vừa cân nhắc tình hình [title.GetBaseNameNoTier]: [title.GetTierAsNameNoTooltip] thực sự cần một sự lãnh đạo mạnh mẽ và đáng tin cậy.\"\n\n\"Tình cờ thay, tôi nghĩ mình biết chính xác [governor.GetWomanMan] cho công việc này. Theo ý kiến khiêm tốn của tôi, [governor.GetTitledFirstName], sẽ trở thành một tổng trấn #EMP đáng gờm#! — và trung thành, thưa bệ hạ.\""

  ep3_story_cycle_admin_eunuch.2031.t: "$admin_eunuch_header$ Thánh [new_patriarch.GetMotherFather|U]"
  ep3_story_cycle_admin_eunuch.2031.intro: "Ta tò mò khi hoạn quan của ta, [eunuch.GetTitledFirstName], xin được gặp tại"
  ep3_story_cycle_admin_eunuch.2031.intro_byz: "Thánh đường Hagia Sophia"
  ep3_story_cycle_admin_eunuch.2031.intro_fallback: "[ROOT.Char.GetFaith.HouseOfWorship]"
  ep3_story_cycle_admin_eunuch.2031.desc: "và càng hơn thế khi ta thấy [eunuch.GetHerHim] cùng với [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))] của [eunuch.GetHerHis], [new_patriarch.GetFirstName], kẻ dường như đang cố gắng mô phỏng một sự mộ đạo [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] kỳ lạ.\n\n[eunuch.GetFirstNameNoTooltip] ăn nói rất khéo — thực tế là khéo đến mức ta gần như không nhận ra sức nặng của những lập luận thuyết phục của [eunuch.GetHerHis].\n\n\"Thưa chúa công,\" [eunuch.GetSheHe] thầm thì, một vẻ ngoài kỳ lạ hiện trên những đường nét của [eunuch.GetHerHis], \"Chắc chắn đây phải là ý muốn của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] rằng [new_patriarch.GetFirstNameNoTooltip] trở thành [old_patriarch.GetTitleAsName] mới của [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!\""
  ep3_story_cycle_admin_eunuch.2031.a: "[eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))] của ngươi #EMP sẽ#! là [old_patriarch.GetTitleAsNameNoTooltip]!"
  ep3_story_cycle_admin_eunuch.2031.b: "Thôi nào, đây là một đề xuất #EMP quá liều lĩnh#!..."

  ep3_story_cycle_admin_eunuch.2040.t: "$admin_eunuch_header$ Chỗ ngồi trong Hội đồng"
  ep3_story_cycle_admin_eunuch.2040.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], chặn đường ta khi ta đang mải mê đọc các thông điệp, À, [ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] rít lên, nhẹ nhàng đóng cửa lại. \"Xin ngài chút thời gian?\"\n\n\"Thật đau lòng khi thấy công việc của hội đồng ngài bị cản trở bởi... những kẻ mai táng nó.\" Ta nhướng mày.\n\n[eunuch.GetSheHe|U] hắng giọng, \"Tôi sẽ rất vui nếu được gánh vác một số trách nhiệm, và chăm lo cho lợi ích của ngài, cũng như lợi ích của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], một cách sát sao hơn.\""
  ep3_story_cycle_admin_eunuch.2040.a: "Ý kiến tuyệt vời, [eunuch.GetFirstNameNoTooltip], bắt tay vào ngay."
  ep3_story_cycle_admin_eunuch.2040.b: "Ta không muốn ngươi sao nhãng các nhiệm vụ khác."
  ep3_story_cycle_admin_eunuch.2040.a.toast: "Bổ nhiệm Hội đồng"

  ep3_story_cycle_admin_eunuch.2041.t: "$admin_eunuch_header$ Một tiếng nói nữa"
  ep3_story_cycle_admin_eunuch.2041.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], thò đầu vào cửa phòng hội đồng, cười toe toét khi [eunuch.GetSheHe] thấy ta, và lạch bạch đi vào cùng một người họ hàng của [eunuch.GetHerHis].\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của tôi!\" [eunuch.GetSheHe] run rẩy, \"Suy ngẫm về... những tài năng có phần thiếu hụt của các cố vấn, tôi chợt nảy ra ý nghĩ! [eunuch.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của tôi, [councillor.GetFirstName], ở đây có thể là một tài sản lớn đối với [ROOT.Char.GetLadyLord]ship của ngài!\""
  ep3_story_cycle_admin_eunuch.2041.a: "Được thôi, như lời ngươi nói, [eunuch.GetFirstNameNoTooltip]."
  ep3_story_cycle_admin_eunuch.2041.b: "Ta sẽ cân nhắc..."

  ep3_story_cycle_admin_eunuch.2043.desc: "Với tư cách một hoạn quan trong cung, ta chứng kiến nhiều sự cai trị kém cỏi, và rõ ràng ngươi là một trong những thần dân giá trị nhất — nhưng bị bỏ quên — của [emperor.GetTitleAsNamePossessive].\n\nVới sự ủng hộ của ngươi, ta có thể lên tiếng mạnh mẽ hơn về giá trị của lời khuyên ấy — vì lợi ích của [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  ep3_story_cycle_admin_eunuch.2043.a: "Cứ làm đi, [eunuch.GetFirstNameNoTooltip]!"
  ep3_story_cycle_admin_eunuch.2043.a.tt: "[eunuch.GetFirstName] sẽ cố thuyết phục [emperor.GetTitledFirstName] bổ nhiệm Ngài làm [councillor|E]"
  ep3_story_cycle_admin_eunuch.2043.b: "Ta không hứng thú."
  ep3_story_cycle_admin_eunuch.2043.b.toast: "Đề xuất bị từ chối"

  ep3_story_cycle_admin_eunuch.2044.t: "$admin_eunuch_header$ Cố vấn Quyền lực"
  ep3_story_cycle_admin_eunuch.2044.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], hắng giọng cao giọng khi chúng ta chuẩn bị thảo luận một số việc quốc gia.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]\", [eunuch.GetSheHe] gợi ý, cân nhắc từng lời nói của [eunuch.GetHerHis], \"Trong khi chính phủ của ngài — #EMP dĩ nhiên#! — rất hiệu quả, người ta không khỏi tự hỏi về một vài... cơ hội bị bỏ lỡ.\"\n\n\"Có những [councillor.GetWomenMen] giỏi giang, #EMP đáng tin cậy#! mà lại bị bỏ qua cho các vị trí cao nhất. Những [councillor.GetWomenMen|U] như [councillor.GetTitledFirstName] chẳng hạn! [councillor.GetSheHe|U] sẽ là một tài sản lớn đối với [ROOT.Char.GetLadyLord]ship của ngài!\""

  ep3_story_cycle_admin_eunuch.2050.t: "$admin_eunuch_header$ Sáng kiến Dồi dào"
  ep3_story_cycle_admin_eunuch.2050.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], tiến đến với nụ cười tự mãn trên môi [eunuch.GetHerHis], ríu rít, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta có một đề xuất hấp dẫn nhất cho người!\"\n\n"
  ep3_story_cycle_admin_eunuch.2050.debase: "\"[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] luôn có thể cần thêm tiền, và Ta đã tính toán rồi. Chỉ cần điều chỉnh nhỏ trong chiến lược đúc tiền, ta có thể tiết kiệm được rất nhiều!\""
  ep3_story_cycle_admin_eunuch.2050.raise_taxes: "\"[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] luôn có thể cần thêm ngân quỹ, và theo hướng đó, Ta đã nghĩ ra một đề xuất tăng thuế #EMP khiêm tốn#!!\""
  ep3_story_cycle_admin_eunuch.2050.candidacy: "\"Nghe nhiều ý kiến khắp [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], Ta thấy có cơ hội lớn để hỗ trợ chiến dịch tranh cử của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('boon_target'))] của người, [boon_target.GetFirstNamePossessive], cho [boon_title.GetAdjective] [boon_title.GetTierAsNameNoTooltip]!\""
  ep3_story_cycle_admin_eunuch.2050.fabricate_hook: "\"Tin tức truyền đi nhanh chóng ở [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], và những lời đồn cũng vậy! Tôi vừa có được đòn bẩy mà ngài cần để đảm bảo [boon_victim.GetTitledFirstName] biết vị trí của [boon_victim.GetHerHis]!\""
  ep3_story_cycle_admin_eunuch.2050.imprison_rebel: "\"Ai cũng biết [boon_victim.GetTitledFirstName] đã gây bao rắc rối cho chính [boon_victim.GetHerselfHimself], và tình cờ Ta có đúng giải pháp!\""
  ep3_story_cycle_admin_eunuch.2050.influence: "\"Ta có nhiều nguồn tin, cũng như những cái miệng thay lời; họ chỉ cần một chút định hướng. Người ta không bao giờ có đủ người ủng hộ — đó luôn là điều Ta nói.\""
  ep3_story_cycle_admin_eunuch.2050.outro: "\n\n\"Vậy, Ta có nên ra lệnh chứ, [ROOT.Char.GetTitleAsNameNoTooltip] vinh quang?\""
  ep3_story_cycle_admin_eunuch.2050.a: "Tuyệt vời, một sáng kiến lớn!"
  ep3_story_cycle_admin_eunuch.2050.b: "Không cần thiết đâu, [eunuch.GetFirstNameNoTooltip]."

  ep3_story_cycle_admin_eunuch.2051.t: "$admin_eunuch_header$ Chim Nhỏ"
  ep3_story_cycle_admin_eunuch.2051.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], sắp xếp một cuộc gặp riêng giữa ta và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('secret_owner'))] của ta, [secret_owner.GetTitledFirstName]; nhìn nét mặt [secret_owner.GetHerHis] là biết không chắc nên nghĩ gì.\n\nTên hoạn quan cười khanh khách gieo nỗi sợ [ROOT.Char.GetFaith.HighGodName] vào lòng [secret_owner.GetWomanMan] tội nghiệp, lần theo [eunuch.GetHerHis] manh mối về một bí mật đen tối của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('secret_owner'))] mà [secret_owner.GetSheHe] đã phát hiện.\n\nCuối cùng, gã [eunuch.Custom2('InsultNoun', ROOT.Char)] tự mãn quay sang ta với nụ cười bệnh hoạn, \"Vậy, [ROOT.Char.Custom('FormOfAddressForLiege')], người có muốn biết #EMP ta#! biết gì không?\""
  ep3_story_cycle_admin_eunuch.2051.a: "Nói ta nghe hết đi, [eunuch.GetFirstNameNoTooltip]!"
  ep3_story_cycle_admin_eunuch.2051.a.tt: "Ngài học được một trong những [secrets|E] của [secret_owner.GetTitledFirstNamePossessive]"
  ep3_story_cycle_admin_eunuch.2051.b: "Ta nghĩ là ta không muốn biết..."

  ep3_story_cycle_admin_eunuch.2052.t: "$admin_eunuch_header$ Có điều mờ ám"
  ep3_story_cycle_admin_eunuch.2052.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], đã sắp xếp một cuộc gặp riêng tư giữa ta và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scheme_owner'))] của ta, [scheme_owner.GetFirstName]. Nhìn vẻ mặt của [scheme_owner.GetHerHis], có vẻ người này đang vô cùng lo lắng bởi những lời nói của [eunuch.GetFirstNamePossessiveNoTooltip].\n\nGã hoạn quan lắm lời đó đang gieo rắc nỗi sợ về [ROOT.Char.GetFaith.HighGodName] vào [scheme_owner.GetWomanMan] tội nghiệp, lén lút ám chỉ về một âm mưu đen tối nào đó mà [eunuch.GetSheHe] tuyên bố đã khám phá ra về [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scheme_owner'))] của ta.\n\nCuối cùng, gã [eunuch.Custom2('InsultNoun', ROOT.Char)] tự mãn đó quay sang ta với một nụ cười: \"Chà, [ROOT.Char.Custom('FormOfAddressForLiege')], ngài có muốn biết [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scheme_owner'))] của ngài đã làm những gì không?\""
  ep3_story_cycle_admin_eunuch.2052.a: "Nói ta nghe hết đi, [eunuch.GetFirstNameNoTooltip]!"
  ep3_story_cycle_admin_eunuch.2052.a.tt: "Ngài phơi bày một trong những [hostile_schemes|E] của [scheme_owner.GetTitledFirstNamePossessive]"
  ep3_story_cycle_admin_eunuch.2052.b: "Ta nghĩ là ta không muốn biết..."

  ep3_story_cycle_admin_eunuch.2060.t: "$admin_eunuch_header$ Trách Nhiệm Bổ Sung"
  ep3_story_cycle_admin_eunuch.2060.desc: "Thái giám của ta, [eunuch.GetTitledFirstName], rón rén lại gần với một tiếng ho khẽ khi ta đang chờ yết kiến, rồi mở lời: \"À, thưa [eunuch.Custom2('RelationToMeShort', ROOT.Char)] của Ta, có một chuyện Ta muốn thưa ngài.\"\n\n\"Dù vô cùng cảm kích vị trí hiện tại trong triều của ngài, Ta vẫn cho rằng mình có thể giúp ích thêm nữa. Thực ra, Ta đã có một vai trò trong đầu rồi...\""
  ep3_story_cycle_admin_eunuch.2060.a: "Được rồi, được rồi, việc đó là của ngươi, [eunuch.GetFirstNameNoTooltip]."
  ep3_story_cycle_admin_eunuch.2060.b: "Không, ta có ý khác..."

  ep3_story_cycle_admin_eunuch.2061.t: "$admin_eunuch_header$ Thăng Tiến Gia Tộc"
  ep3_story_cycle_admin_eunuch.2061.desc: "Hoạn quan của ta, [eunuch.GetTitledFirstName], tiếp cận ta, theo sau là một [positioner.GetWomanMan] trông không có gì nổi bật. \"Ngài đây rồi, [ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] cười rạng rỡ, \"Tôi mang đến cho ngài [eunuch.Custom2('RelationToMeShort', SCOPE.sC('positioner'))] tài năng của tôi, [positioner.GetTitledFirstName]!\"\n\nVới sự chuẩn bị kỹ lưỡng, [positioner.GetWomanMan] này thể hiện hết mình vì lợi ích của ta.\n\n\"Thưa chúa công, [positioner.GetFirstNameNoTooltip] sẽ là một ứng viên #EMP xuất sắc#! cho một vị trí trong triều đình của ngài — thực sự thì nếu [positioner.GetSheHe] ở nơi khác thì đúng là lãng phí tài năng...\""
  ep3_story_cycle_admin_eunuch.2061.a: "[positioner.GetFirstNameNoTooltip] là một đề xuất hay!"
  ep3_story_cycle_admin_eunuch.2061.b: "Ta vẫn chưa bị thuyết phục..."

  ep3_story_cycle_admin_eunuch.2070.t: "$admin_eunuch_header$ Thăng Tiến Xã Hội"
  ep3_story_cycle_admin_eunuch.2070.desc: "Thái giám của ta, [eunuch.GetTitledFirstName], xuất hiện trước mặt ta, dẫn theo một người trong gia tộc của [eunuch.GetHerHis]. \"[ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] cười lớn, \"Ta có một đề nghị vô cùng thú vị dành cho ngài!\n\n\"[eunuch.Custom2('RelationToMeShort', SCOPE.sC('eunuch_marry'))] của Ta, [eunuch_marry.GetTitledFirstName], ở đây sẽ là một người phối ngẫu #EMP vô cùng#! xứng đáng cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emperor_marry'))] của ngài, [emperor_marry.GetTitledFirstName], Ta tin là ngài cũng đồng ý!\"\n\nVới sự tự tin gần như quá mức đã được luyện sẵn, [eunuch_marry.GetWomanMan] tự hào trình diện [eunuch_marry.GetHerselfHimself] trước mặt ta."
  ep3_story_cycle_admin_eunuch.2070.a: "[eunuch_marry.GetFirstNameNoTooltip] là một mối lương duyên tốt cho [emperor_marry.GetFirstNameNoTooltip]!"
  ep3_story_cycle_admin_eunuch.2070.b: "Ta không nghĩ vậy..."

  ep3_story_cycle_admin_eunuch.3000.t: "$admin_eunuch_header$ Người Đệ Tử"
  ep3_story_cycle_admin_eunuch.3000.desc: "Dạo gần đây có không ít lời bàn tán về sự quan tâm đặc biệt mà thái giám của ta, [eunuch.GetTitledFirstName], dành cho [eunuch.Custom2('RelationToMeShort', SCOPE.sC('protege'))] của [eunuch.GetHerHis], [protege.GetFirstName].\n\nGã hoạn quan đối xử với [protege.GetHerHim] gần như thể [protege.Custom('GetDaughterSon')] mà [eunuch.GetSheHe] không bao giờ có thể có được..."
  ep3_story_cycle_admin_eunuch.3000.a: "Thật đáng tò mò."

  ep3_story_cycle_admin_eunuch.3001.t: "$admin_eunuch_header$ Người Học Trò"
  ep3_story_cycle_admin_eunuch.3001.desc: "Có vẻ như hoạn quan của ta, [eunuch.GetTitledFirstName], đã nhận thêm một kẻ thiến khác dưới trướng của [eunuch.GetHerHis], và đang hướng dẫn [student.GetHerHim] theo cách điều hành của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\nNgười ta thường thấy [student.GetFirstName] đi cùng [eunuch.GetHerHim], cả hai cùng nhau nghiền ngẫm những con số và bàn luận về nền kinh tế của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] — chúng ta chỉ có thể đoán mà thôi..."
  ep3_story_cycle_admin_eunuch.3001.a: "Lại thêm một thái giám hữu dụng, hẳn vậy."

  ep3_story_cycle_admin_eunuch.3010.t: "$admin_eunuch_header$ Kình Địch"
  ep3_story_cycle_admin_eunuch.3010.desc: "Cách vận hành của ban thư lại hoạn quan là điều bí ẩn đối với những phàm nhân như ta, nhưng rõ ràng sự thăng tiến chóng mặt và tầm ảnh hưởng rộng của [eunuch.GetFirstName] đã khiến [eunuch.GetHerHim] có kẻ thù ngay cả ở đó.\n\n[rival.GetFirstName], một hoạn quan khác, đã thể hiện rõ sự thù địch của [rival.GetHerHis], và cả hai dường như đang cố hết sức để cản trở lẫn nhau."
  ep3_story_cycle_admin_eunuch.3010.a: "Ta chắc họ sẽ tự giải quyết mâu thuẫn..."

  ep3_story_cycle_admin_eunuch.4000.t: "$admin_eunuch_header$ Lời Tố Cáo"
  ep3_story_cycle_admin_eunuch.4000.desc: "Trên đường về phòng ngủ, ta chạm mặt một [eunuch.GetFirstName] trông vô cùng bàng hoàng, thở hổn hển: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thật may mắn khi gặp được ngài! Ôi, đây đúng là tin dữ khủng khiếp!\"\n\n[eunuch.GetSheHe|U] ghé sát, thì thầm vào tai ta: \"Đó là [spouse.Custom('WifeHusband')] của ngài, thưa [eunuch.Custom2('RelationToMeShort', ROOT.Char)] của Ta! Dường như [spouse.GetSheHe] đã... ngoại tình! Ngoài hôn nhân! Lăn lộn xác thịt! Với một người trong triều!\"\n\nTa nhìn chằm chằm vào [eunuch.GetHerHim], tìm kiếm lời để nói."
  ep3_story_cycle_admin_eunuch.4000.a: "Giải thích ngay lập tức!"
  ep3_story_cycle_admin_eunuch.4000.success: "Ngươi tìm ra sự thật"
  ep3_story_cycle_admin_eunuch.4000.success.tt: "Một [secret|E] hoặc [scheme|E] có thể bị lộ"
  ep3_story_cycle_admin_eunuch.4000.failure: "Ngươi chỉ tìm thấy sự hoài nghi"
  ep3_story_cycle_admin_eunuch.4010.failure.tt: "Ngươi không tìm được gì"
  ep3_story_cycle_admin_eunuch.4000.b: "Ồ, ta đã biết rồi."
  ep3_story_cycle_admin_eunuch.4000.b.reason: "Tùy chọn này khả dụng vì ngươi đã biết [secret|E] đó"
  ep3_story_cycle_admin_eunuch.4000.c: "Đồ [spouse.Custom2('InsultNounSexual', ROOT.Char)] khốn kiếp! Tống giam [spouse.GetHerHim] ngay lập tức!"
  ep3_story_cycle_admin_eunuch.4000.innocent: "Không có bằng chứng về một mối gian tình"

  ep3_story_cycle_admin_eunuch.4010.t: "$admin_eunuch_header$ Sự Trăng Hoa"
  ep3_story_cycle_admin_eunuch.4010.desc: "Những lời đồn gần đây ngày càng lan rộng, và càng suy ngẫm, ta càng thấy chúng có lý...\n\n[spouse.Custom('WifeHusband')] của ta, và [seducer.GetFirstName]! Sao [spouse.GetTitledFirstName] có thể làm vậy với ta...? Ta đã nghiền ngẫm mọi chi tiết, nhưng vẫn không lần ra được sợi dây sự thật.\n\nTa nghi ngờ bàn tay của [eunuch.GetFirstName], [seducer.Custom2('RelationToMeShort', SCOPE.sC('eunuch'))] của tên khốn kia, nhưng làm sao ta biết chắc được?"
  ep3_story_cycle_admin_eunuch.4010.a: "Chúng ta sẽ xem âm mưu này sâu đến đâu..."
  ep3_story_cycle_admin_eunuch.4010.c: "Giam cả ba lại ngay!"
  ep3_story_cycle_admin_eunuch.4010.d: "Có lẽ cũng không #EMP tệ#! đến vậy?"

  ep3_story_cycle_admin_eunuch.5000.t: "$admin_eunuch_header$ Kết Thù"
  ep3_story_cycle_admin_eunuch.5000.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('whinger'))] của ta, [whinger.GetTitledFirstName], xông vào thư phòng đầy hằn học, đảo mắt quanh phòng. Cuối cùng [whinger.GetSheHe] tiến lại gần, thở dài: \"Tốt, cái sinh vật #EMP ghê tởm#! đó không có ở đây!\"\n\nTa ngẫm nghĩ xem [whinger.GetSheHe] ám chỉ ai, nhưng chẳng cần lâu. \"[whinger.Custom2('RelationToMeShort', ROOT.Char)|U]! Ngài #EMP phải#! làm gì đó với tên thái giám ấy, [eunuch.GetFirstName]! [eunuch.GetSheHe|U] nhúng tay vào mọi chuyện, nghe lén khắp nơi. Ta nói cho ngài biết, [eunuch.GetSheHe] không hề trong sạch đâu!\""
  ep3_story_cycle_admin_eunuch.5000.a: "Ôi, đừng ngớ ngẩn! [eunuch.GetSheHe|U] là một  Bề Tôi trung thành."
  ep3_story_cycle_admin_eunuch.5000.b: "Có lẽ ngươi nói đúng..."

  ep3_story_cycle_admin_eunuch.5010.t: "$admin_eunuch_header$ Phản Kháng"
  ep3_story_cycle_admin_eunuch.5010.desc: "\"Ngài không thấy gã nhện này đang giăng những cái lưới của [eunuch.GetHerHis] để chống lại ngài sao, [rival.Custom2('RelationToMeShort', ROOT.Char)]?\" [rival.GetFirstName] ngắt lời [eunuch.GetFirstName], người đang lộ rõ vẻ kinh ngạc và nhìn về phía ta.\n\nNhững bất đồng giữa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival'))] của ta và [eunuch.GetFirstNameNoTooltip] gần đây ngày càng tồi tệ, đe dọa trở thành một sự xao nhãng lớn tại triều đình.\n\n[eunuch.GetFirstNameNoTooltip] lấy lại bình tĩnh trước khi phản bác: \"Đó là một lời cáo buộc thái quá, [ROOT.Char.Custom('FormOfAddressForLiege')]! Ta chỉ quan tâm đến lợi ích tốt nhất cho [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!\""
  ep3_story_cycle_admin_eunuch.5010.a: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival'))|U], ta tin [eunuch.GetFirstNameNoTooltip], và ngươi cũng phải vậy."
  ep3_story_cycle_admin_eunuch.5010.b: "Đúng vậy, thái giám đã vượt quyền."

  ep3_story_cycle_admin_eunuch.5020.t: "$admin_eunuch_header$ Con Đường Ít Kháng Cự"
  ep3_story_cycle_admin_eunuch.5020.desc: "Ta được tin rằng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('puppet'))] của ta, [puppet.GetTitledFirstName], đã dành ngày càng nhiều thời gian trong ngày để bầu bạn với hoạn quan [eunuch.GetFirstName], và hai người này liên tục bị bắt gặp đi cùng nhau, trò chuyện riêng tư một cách chăm chú.\n\nTa thậm chí còn được biết [puppet.GetFirstNameNoTooltip] đang được dạy dỗ theo một cách nào đó, như thể [eunuch.GetFirstNameNoTooltip] đang đào tạo [puppet.GetHerHim] cho một vị trí trong ban thư ký hoạn quan vậy!"
  ep3_story_cycle_admin_eunuch.5020.a: "Một cặp đôi khó ngờ."

  ep3_story_cycle_admin_eunuch.6000.t: "$admin_eunuch_header$ Một Cuộc Đảo Chính Rất [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  ep3_story_cycle_admin_eunuch.6000.desc: "Khi ta bước đi trong đại điện, ta thấy [eunuch.GetFirstName] tiến đến với vẻ quyết đoán, theo sau là một nhóm hoạn quan. \"[ROOT.Char.GetTitleAsNameNoTooltip]!\" hắn kêu lên. \"Ta phải nói chuyện với ngài!\""
  ep3_story_cycle_admin_eunuch.6000.body: "\n\nThái giám thở dài nặng nề: \"Ta rất tiếc chuyện đã đến nước này, thưa bệ hạ. Thật sự là #EMP vô cùng#! đáng tiếc. Ta được lệnh thông báo rằng sự cai trị của ngài không còn có thể duy trì.\""
  ep3_story_cycle_admin_eunuch.6000.family: "\"Đã có quyết định: ngài sẽ chuyển giao quyền lực cho [ROOT.Char.Custom2('RelationToMeShort', coupist)] của ngài, [coupist.GetTitledFirstName], vì lợi ích của đế quốc!\""
  ep3_story_cycle_admin_eunuch.6000.co_caesar: "\"Đã có quyết định: ngài sẽ chuyển giao quyền lực cho [ROOT.Char.Custom2('RelationToMeShort', coupist)] của ngài, [coupist.GetTitledFirstName], vì lợi ích của đế quốc!\""
  ep3_story_cycle_admin_eunuch.6000.eunuch_family: "\"Đã có quyết định: ngài sẽ chuyển giao quyền lực cho [eunuch.Custom2('RelationToMeShort', coupist)] của Ta, [coupist.GetTitledFirstName], vì lợi ích của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\""
  ep3_story_cycle_admin_eunuch.6000.regent: "\"Đã quyết định: ngài sẽ chuyển giao quyền lực cho nhiếp chính của mình, [coupist.GetTitledFirstName], vì lợi ích của đế quốc!\""
  ep3_story_cycle_admin_eunuch.6000.fallback: "\"Đã có quyết định: ngài sẽ chuyển giao quyền lực cho [coupist.GetTitledFirstName], vì lợi ích của đế quốc!\""
  ep3_story_cycle_admin_eunuch.6000.a: "Đây là #EMP PHẢN NGHỊCH#!. Lính canh! Bắt chúng lại!"
  ep3_story_cycle_admin_eunuch.6000.a.success: "Cuộc đảo chính bị dập tắt"
  ep3_story_cycle_admin_eunuch.6000.a.failure: "Cuộc đảo chính thành công"
  ep3_story_cycle_admin_eunuch.6000.c: "Biến đi ngay, và ta có thể để các ngươi giữ lại cái đầu."
  ep3_story_cycle_admin_eunuch.6000.d: "Được thôi... ta sẽ làm theo."

  ep3_story_cycle_admin_eunuch.8000.t: "$admin_eunuch_header$ Bám Giữ Quyền Lực"
  ep3_story_cycle_admin_eunuch.8000.intro: "Thái giám, [eunuch.GetTitledFirstName], vẫn còn ảnh hưởng lớn trong"
  ep3_story_cycle_admin_eunuch.8000.intro_byz: "Vị [Glossary( 'eunoukhos', 'EUNOUKOS_GLOSS' )], [eunuch.GetTitledFirstName], vẫn còn ảnh hưởng lớn trong"
  ep3_story_cycle_admin_eunuch.8000.intro_family: "[ROOT.Char.Custom2('RelationToMeShort', previous_story_owner)],"
  ep3_story_cycle_admin_eunuch.8000.intro_enemy: "kẻ thù,"
  ep3_story_cycle_admin_eunuch.8000.intro_fallback: "người tiền nhiệm,"
  ep3_story_cycle_admin_eunuch.8000.desc: "[previous_story_owner.GetTitledFirstNamePossessive]... bộ máy cai trị của [eunuch.GetSheHe] dường như vẫn còn nắm giữ chút quyền lực trong cung điện...\n\n[eunuch.GetSheHe|U] đã không lãng phí thời gian để theo đuổi sự ưu ái của ta, liên tục tỏ vẻ cung kính ở triều đình. Có lẽ [eunuch.GetSheHe] sẽ tỏ ra hữu dụng đấy."
  ep3_story_cycle_admin_eunuch.8000.a: "[eunuch.GetFirstNameNoTooltip] phải ra đi."
  ep3_story_cycle_admin_eunuch.8000.b: "Đã đến lúc [student.GetFirstNameNoTooltip] tiếp quản."
  ep3_story_cycle_admin_eunuch.8000.c: "[rival.GetFirstNameNoTooltip] là lựa chọn vững vàng hơn."
  ep3_story_cycle_admin_eunuch.8000.d: "Ta sẽ không làm xáo trộn thế cân bằng quyền lực."

  ep3_story_cycle_admin_eunuch.8010.t: "$admin_eunuch_header$ Một Đời Phụng Sự"
  ep3_story_cycle_admin_eunuch.8010.desc: "Một  Bề Tôi quý giá của [admin_title.GetDefinitiveName] đã qua đời, [eunuch.GetFirstName], một trong những thái giám có ảnh hưởng nhất thời gian gần đây, đã [eunuch.GetDeathReasonHideKiller]...\n\nNguyện [ROOT.Char.GetFaith.HighGodName] sớm ban cho [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] một  Bề Tôi khác có tầm vóc và tài năng như [eunuch.GetHerHis]."
  ep3_story_cycle_admin_eunuch.8010.d: "Mọi thứ chắc chắn sẽ thay đổi..."

  ep3_story_cycle_admin_eunuch.8020.t: "$admin_eunuch_header$ Khóa Và Chìa"
  ep3_story_cycle_admin_eunuch.8020.desc: "Từng là một tôi tớ đắc lực của [admin_title.GetDefinitiveName], hoạn quan triều đình đầy quyền thế, [eunuch.GetFirstName], giờ đây đang khó chịu với những xiềng xích [background_dungeon_scope.GetPrimaryTitle.GetAdjectiveNoTooltip] của [eunuch.GetHerHis].\n\n[eunuch.GetSheHe|U] có lẽ có thể được trở lại phục vụ ta, nếu nỗ lực đó được coi là xứng đáng..."
  ep3_story_cycle_admin_eunuch.8020.d: "Một tổn thất cho [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip]."
  ep3_story_cycle_admin_eunuch.8020.a: "[eunuch.GetFirstNameNoTooltip] quá hữu dụng để nhốt lại..."

  ep3_story_cycle_admin_eunuch.8030.t: "$admin_eunuch_header$ Không Còn Phục Vụ"
  ep3_story_cycle_admin_eunuch.8030.desc: "Từng là một  Bề Tôi quý giá của [admin_title.GetDefinitiveName], vị thái giám đầy ảnh hưởng trong triều, [eunuch.GetFirstName], nay đang phục vụ [eunuch.GetLiege.GetName].\n\nCó lẽ [eunuch.GetSheHe|U] có thể bị dụ dỗ quay lại phục vụ ta, nếu việc đó đáng để cân nhắc..."
  ep3_story_cycle_admin_eunuch.8030.a: "Thái giám đó là #EMP của ta#!."
  ep3_story_cycle_admin_eunuch.8030.b: "[student.GetFirstNameNoTooltip] đã được [eunuch.GetHerHim] dạy dỗ, và có thể tiếp tục công việc của [eunuch.GetHerHis]."
  ep3_story_cycle_admin_eunuch.8030.c: "Đối thủ cũ [rival.GetFirstNameNoTooltip] của [eunuch.GetHerHis] có thể đứng ra thu xếp mọi chuyện."
  ep3_story_cycle_admin_eunuch.8030.d: "Than ôi, Bạn ta đã tuột mất..."

  ep3_story_cycle_admin_eunuch.8040.t: "$admin_eunuch_header$ Những Điều Lớn Lao Hơn"
  ep3_story_cycle_admin_eunuch.8040.desc: "Từng là một  Bề Tôi quý giá của triều đình [admin_title.GetAdjective], vị thái giám đầy ảnh hưởng, [eunuch.GetFirstName], nay đã bước sang những điều lớn lao hơn.\n\n"
  ep3_story_cycle_admin_eunuch.8040.ruler: "Xem ra mất mát của ta lại là lợi ích của [eunuch.GetPrimaryTitle.GetNamePossessive]..."
  ep3_story_cycle_admin_eunuch.8040.noble_family: "Xem ra mất mát của ta lại là lợi ích của gia tộc [eunuch.GetHouse.GetBaseName]..."
  ep3_story_cycle_admin_eunuch.8040.laamp: "Có vẻ như [eunuch.GetSheHe] đang tìm kiếm một cuộc sống phiêu lưu hơn..."
  ep3_story_cycle_admin_eunuch.8040.d: "Thật đáng tiếc."

