l_english:
 
  activity_chariot_race: "Đua Chiến Xa"
  activity_chariot_race_desc: "Với tư cách là [GetPlayer.GetTitleAsNameNoTooltip], chỉ riêng ta mới có quyền tổ chức những cuộc đua chiến xa hoành tráng để làm mãn nguyện đám [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] và thu hút các nhân vật tai to mặt lớn của [GetPlayer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] về kinh đô.\n\nThông qua những dịp công khai này, dân chúng sẽ biết đến ta như bậc chủ nhân của họ; trong tiếng gầm vang của đám đông, ta mong được nghe thấy sự tán dương."
  activity_chariot_race_destination_selection: "Ngài chỉ có thể tổ chức Đua Chiến Xa tại [capital|E] của mình."
  activity_chariot_race_host_desc: "$BULLET_WITH_TAB$ Có thể nhận @influence_icon![influence|E]\n$BULLET_WITH_TAB$ Có thể nhận [GetLocalPlayerLegitimacyTextIcon][legitimacy|E]\n$BULLET_WITH_TAB$ Có thể nhận @gold_icon![gold|E]\n$BULLET_WITH_TAB$ Có thể #N #EMP hoặc mất#!#! [county_opinion|E]"
  activity_chariot_race_guest_desc: "\n#weak Dù được xem là nghĩa vụ của mọi người trong lãnh thổ, việc tham dự các cuộc Đua Chiến Xa tại Trường Đua mang lại cơ hội giao thiệp với tầng lớp tinh hoa của đế quốc và gia tăng [influence|E].\n\nTất cả khách mời đều phải đóng một khoản phí vào cửa nhỏ là [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0]."
  activity_chariot_race_conclusion_desc: "[GetActivityType( 'activity_chariot_race' ).GetName] đã kết thúc."
  activity_chariot_race_selection_tooltip: "Tổ chức các cuộc đua chiến xa xa hoa để làm hài lòng dân chúng và củng cố địa vị của Ngài với tư cách là [GetPlayer.GetTitleAsNameNoTooltip]\n\nPhần thưởng dự kiến:\n$BULLET_WITH_TAB$@influence_icon![influence|E]\n$BULLET_WITH_TAB$@gold_icon![gold|E]"
  HOI_POLLOI_GLOSS: "Theo nghĩa đen là \"số đông\", thuật ngữ Hy Lạp cổ này dùng để chỉ các tầng lớp bình dân trong xã hội Byzantine"

  chariot_race_honorary_guest: "Khách Danh Dự"
  chariot_race_honorary_guest_traveling: "$chariot_race_honorary_guest$"
  activity_window_character_chariot_race_honorary_guest: "[honorary_guest|E]\n[Character.GetShortUINameNoTooltip|U]"
  activity_window_character_chariot_race_honorary_guest_traveling: "$activity_window_character_chariot_race_honorary_guest$"
  chariot_race_honorary_guest_concept: "[honorary_guest|E]"
  chariot_race_honorary_guest_for_host: "$chariot_race_honorary_guest$"
  chariot_race_honorary_guest_regular: "$honorary_guest$"
  chariot_race_honorary_guest_regular_for_host: "$honorary_guest$"
  chariot_race_honorary_guest_desc: "$chariot_race_honorary_guest_desc_for_host$"
  chariot_race_honorary_guest_desc_for_host: "Chủ trì có thể mời một nhân vật cùng ngồi với mình trong [Glossary( 'kathisma', 'KATHISMA_GLOSS')] nếu muốn. Điều này mở ra vô số cơ hội để tương tác với nhân vật đó — theo chiều hướng tốt hoặc xấu."
  chariot_race_honorary_guest_regular_desc: "$honorary_guest_desc$"
  chariot_race_honorary_guest_regular_desc_for_host: "$honorary_guest_desc$"
  activity_invite_rule_charioteers: "Xa Phu"
  activity_chariot_race_guest_help_text: "Dù được xem là nghĩa vụ của mọi người trong lãnh thổ, việc tham dự các cuộc Đua Chiến Xa tại Trường Đua mang lại cơ hội giao thiệp với tầng lớp tinh hoa của đế quốc và gia tăng [influence|E].\n\nTất cả khách mời đều phải đóng một khoản phí vào cửa nhỏ là [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0]."
  activity_chariot_race_predicted_cost: "Chi phí của [GetActivityType( 'activity_chariot_race' ).GetNameNoTooltip] chủ yếu phụ thuộc vào các [activity_options|E] Ngài lựa chọn."
  chariot_race_base_cost_desc: "Chi phí cơ bản của [GetActivityType( 'activity_chariot_race' ).GetName]"


  chariot_race_gambling: "Đặt Cược"
  chariot_race_gambling_desc: "Đánh cược cả túi tiền của mình, những người tham dự gửi gắm hy vọng và lời cầu nguyện vào đội đua mà họ yêu thích."
  chariot_race_phase: "Cuộc Đua"
  chariot_race_phase_desc: "Cát tung mù mịt, roi quất chan chát, và Trường Đua gầm vang!"
  chariot_race_phase_ceremony: "Nghi Lễ"
  chariot_race_phase_ceremony_desc: "Quân vương vinh quang của chúng ta tuyên dương kẻ chiến thắng của các cuộc đua."

  chariot_option_entertainment: "Trình Diễn"
  chariot_entertainment_bad: "Giải Trí Đạm Bạc"
  chariot_entertainment_bad_desc: "$EFFECT_LIST_BULLET$ Tăng nhẹ [legitimacy|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Điều chỉnh theo [county_opinion|E] tại [capital|E]#!\n\n#weak Suốt hàng trăm năm, các cuộc đua đã gắn kết mối quan hệ giữa người cai trị và dân chúng, chứng thực cho sự vĩ đại và hào phóng. Nếu các nghi lễ được thực hiện chu đáo, thì không cần gì thêm nữa.#!"
  chariot_entertainment_normal: "Nghi Lễ Truyền Thống"
  chariot_entertainment_normal_desc: "$EFFECT_LIST_BULLET$ Tăng vừa phải [legitimacy|E] và [county_opinion|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Điều chỉnh theo [county_opinion|E] tại [capital|E]#!\n\n#weak Giữa các lượt đua, dân chúng sẽ được vui chơi với hề kịch, nhào lộn và các tù nhân bị xiềng xích. Những vị khách danh giá sẽ được tiếp đón bằng các buổi lễ triều đình trang trọng.#!"

  chariot_entertainment_good: "Chiều Lòng Quần Chúng"
  chariot_entertainment_good_desc: "$EFFECT_LIST_BULLET$ Tăng mạnh [legitimacy|E] và [county_opinion|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Điều chỉnh theo [county_opinion|E] tại [capital|E]#!\n\n#weak Những vị khách được tôn kính nhất sẽ được chiêu đãi bằng chim công, lông chồn, hương liệu: các lễ vật đế quốc thượng hạng! Và các nghệ sĩ đủ mọi loại hình sẽ tràn ngập Trường Đua, trong khi bánh mì và tiền xu được ném xuống khán đài.#!"

  chariot_race_host_rewards_title: "Phần Thưởng Chủ Trì"
  chariot_race_reward_high_county_opinion_tt: "#weak Phần thưởng được cải thiện nếu [county_opinion|E] tại [capital|E] cao"
  chariot_race_reward_low_county_opinion_tt: "#weak Phần thưởng bị suy giảm nếu [county_opinion|E] tại [capital|E] thấp"

  CHARIOTEER_APTITUDE_GUI_TOOLTIP: "[Character.GetFirstNamePossessiveNoTooltip] có [aptitude|E] đối với việc đánh xe ở mức [Character.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
  YOUR_CHARIOTEER_TOOLTIP: "Ngài đang thuê [Character.GetShortUIName] làm [GetCourtPositionType( 'charioteer_court_position' ).GetName] của mình."
  YOUR_WAGER_TOOLTIP: "[GetPlayer.Custom('BuildChariotRaceWagerTooltip')]"

  every_losing_charioteer_xp_gain: "Tất cả các Xa Phu còn lại nhận #high 3#! [trait_level_track_xp|E]"

 ### INTENTS ###
  increase_influence_intent: "Gia Tăng Ảnh Hưởng"
  increase_influence_intent_desc: "Với toàn bộ [strategoi|E] và [noble_families|E] tụ họp tại Trường Đua, Ngài sẽ tập trung vào việc giao thiệp và gia tăng [influence|E]."
  sow_discord_intent: "Gieo Rắc Bất Hòa"
  sow_discord_intent_desc: "Không có cơ hội nào tốt hơn để phá hoại [county_control|E] và [county_opinion|E] của kinh đô, bôi nhọ quyền cai trị của [GetPlayer.GetTopLiege.GetTitleAsNamePossessiveNoTooltip] nhằm mang lại lợi thế cho những kẻ kế vị đang nuôi tham vọng của [GetPlayer.GetTopLiege.GetHerHis]... một chiến lược đặc biệt hiệu quả chống lại những quân vương không được lòng dân."
  appease_populace_intent: "Xoa Dịu Dân Chúng"
  appease_populace_intent_desc: "Ngài đặt mục tiêu gia tăng [legitimacy|E] và [county_opinion|E] tại [realm_capital|E] của mình, [GetPlayer.GetCapitalLocation.GetNameNoTooltip]. Điều này sẽ làm suy yếu những người tham dự sử dụng [intent|E] $sow_discord_intent$ do thái độ thù địch với Ngài."

 ### INTRO ###
  chariot_race.0001.t: "Thành Phố Chờ Đợi"
  chariot_race.0001.desc: "Bên dưới [Glossary( 'kathisma', 'KATHISMA_GLOSS')] cao ngất của ta, những bức tượng khổng lồ trong Trường Đua được đánh bóng, cát được quét dọn cẩn thận, và chỗ ngồi cho hàng ngàn khán giả được làm sạch.\n\nTrong khi đó, các con phố của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] sôi sục trong cơn háo hức. Các thế lực chính trị đủ mọi khuynh hướng gào thét thông điệp của mình khi lữ khách chen nhau tìm chỗ trọ... và ngay cả trong cung điện, mọi câu chuyện đều xoay quanh phe Prasinoi và Venetoi."
  chariot_race.0001.desc_spectator: "[host.GetCapitalLocation.GetTitle.GetNameNoTier] ngập tràn âm thanh và kỳ vọng: các cuộc đua sắp sửa bắt đầu! Từ những quán rượu ven đường, các cuộc bàn tán tràn ra về lần xuất hiện công khai của [host.GetTitleAsNamePossessive]. Liệu sẽ có những lời cam kết được đưa ra? Những mối bận tâm của đám [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] có được giải quyết? Và những lời đáp lại sẽ bị gào thét, hô vang ra sao?\n\nNgay lúc này, cảm xúc trên đường phố cuộn trào giữa những kẻ bị khuấy động bởi đặc vụ hoàng gia và những kẻ bởi các đam mê khác. Nhưng trên hết, có một cuộc tranh cãi lớn, nóng bỏng: tay đua nào sẽ giành chiến thắng tại Trường Đua!"
  chariot_race.0001.a: "Hãy khuấy động các phe phái!"

  KATHISMA_GLOSS: "Khán đài hoàng gia của Trường Đua. Một cầu thang xoắn nối khu vực quan sát này với cung điện, cho phép Basileus ra vào dễ dàng... và rút lui an toàn."
  DEMES_GLOSS: "Các tổ chức thể thao và chính trị xoay quanh đua chiến xa. Đã từng có thời #EMP các phe phái#! giữ vai trò lớn trong đời sống đô thị, nhưng nay đã suy tàn và bị đặt dưới sự kiểm soát của đế quốc."
  QUADRIGA_GLOSS: "Chiến xa bốn ngựa. Nhanh, nguy hiểm và tốn kém, #EMP téthrippa#!, hay #EMP quadrigae#!, đã là phương tiện ưa thích của các vị vua, hoàng đế và thần linh từ thời cổ đại."

 ### BETTING ###
  chariot_race.0100.t: "Mở Cược"
  chariot_race.0100.desc: "#EMP Keng! Keng! Keng!#!\n\nTiếng chuông của [GetCourtPositionType('bookmaker_court_position').GetName()] vang lên, báo hiệu rằng giờ đây có thể đặt cược vào các đội đua truyền thống của Trường Đua.\n\n"
  chariot_race.0100.desc.emperor: "Phù hợp với địa vị tối cao của ta, [GetCourtPositionType('bookmaker_court_position').GetNameNoTooltip] được dẫn đến trước mặt và phủ phục [bookmaker.GetHerselfHimself] khi ta cân nhắc khoản cược của mình. Quyết định này không hề nhỏ nhặt: việc ta ủng hộ một xa phu hay một đội đua sẽ mang hệ quả cả về tài chính lẫn chính trị."
  chariot_race.0100.desc.others: "Những khoản cược của các khán giả quyền quý hơn được tiếp nhận bởi vài viên chức tất tả. Rất nhiều tiền có thể được hoặc mất... và cả vị thế nữa, giữa Bạn Bè lẫn kình địch cùng chung đam mê."
  chariot_race.0100.a: "Ta đặt cược cho #charioteer_blue Venetoi#!#!."
  chariot_race.0100.b: "Ta đặt cược cho #difficulty_easy Prasinoi#!."
  chariot_race.0100.c: "Ta đặt cược cho #bold Leukoi#!."
  chariot_race.0100.d: "Ta đặt cược cho #difficulty_hard Rhousioi#!."
  chariot_race.0100.e: "Không đặt cược."
 
  chariot_race.0110.t: "Những Anh Hùng Đường Đua"
  chariot_race.0110.desc: "[root_scope.Custom('GetChariotTeamColorPluralGlossed')] tung ra một đội ngũ xa phu lão luyện, những cái tên được ca tụng nơi chợ búa, được trẻ con thì thầm đầy ngưỡng mộ. Ngay cả triều đình hoàng gia cũng xu nịnh và say mê họ!\n\nTa #EMP có thể#! đặt cược vào bất kỳ tay đua nổi tiếng nào trong số này, nhưng có lẽ không một cá nhân nào thực sự vượt trội hoàn toàn..."

