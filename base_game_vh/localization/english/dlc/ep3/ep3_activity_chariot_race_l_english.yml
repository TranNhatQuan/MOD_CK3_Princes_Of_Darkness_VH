  chariot_chance_to_show: "cơ hội #HIGH Lên Bục#!"
  chariot_payout: "Tiền thưởng:"
  chariot_win_desc: "Mục tiêu của cược phải về #HIGH nhất#!"
  chariot_place_desc: "Mục tiêu của cược phải về #HIGH nhất#! hoặc #HIGH nhì#!"
  chariot_show_desc: "Mục tiêu của cược phải về #HIGH nhất#!, #HIGH nhì#! hoặc #HIGH ba#!"

  GLOSS_WIN: "Một tay đua chỉ thắng nếu về nhất."
  GLOSS_PLACE: "Một tay đua được tính là vào top nếu về nhất hoặc nhì."
  GLOSS_SHOW: "Một tay đua được tính là lên bục nếu về nhất, nhì hoặc ba."

  chariot_race.influence_from_employed_charioteer: "Vì ta thuê [my_charioteer.GetFirstName] làm [GetCourtPositionType('charioteer_court_position').GetName] của mình, ta sẽ nhận thêm @influence_icon![influence|E] nếu thắng cược này"

  chariot_race.0110.a: "[faction_1.GetFirstNameNoTooltip] có điều gì đó rất đặc biệt."
