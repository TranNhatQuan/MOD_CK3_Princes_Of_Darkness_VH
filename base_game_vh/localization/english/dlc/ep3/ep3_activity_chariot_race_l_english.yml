  chariot_race.0120.t: "$chariot_race.0100.t$"
  chariot_race.0120.desc: ""Quả là một lựa chọn đầy hấp dẫn..." [GetCourtPositionType('bookmaker_court_position').GetName()] thì thầm, "vậy ngài muốn đặt kiểu cược nào cho tay đua nhanh nhẹn [ROOT.Var('wager_target').GetCharacter.GetFirstName]?""
  chariot_race.0120.desc.team: ""Thật sáng suốt, thật sáng suốt..." [GetCourtPositionType('bookmaker_court_position').GetName()] thì thầm, "vậy ngài muốn áp dụng loại cược nào cho các chiến xa khoác màu [ROOT.Char.Custom('GetChariotTeamColor')|l]?""
  chariot_race.0120.a: "Tất nhiên là ta mong một chiến thắng!"
  chariot_race.0120.a.info: "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_win').GetValue|1]%#! $chariot_chance_to_win$ #weak (tỷ lệ [root_scope.MakeScope.Var('wager_target').Var('odds_win_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_win_b').GetValue])#!\n$chariot_win_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('win_payout').GetValue|1]x#!"
  chariot_race.0120.b: "Nhất hoặc nhì: thế là đủ."
  chariot_race.0120.b.tt: "Mục tiêu đặt cược phải về nhất hoặc nhì"
  chariot_race.0120.b.info: "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_place').GetValue|1]%#! $chariot_chance_to_place$ #weak (tỷ lệ [root_scope.MakeScope.Var('wager_target').Var('odds_place_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_place_b').GetValue])#!\n$chariot_place_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('place_payout').GetValue|1]x#!"
  chariot_race.0120.c: "Chỉ cần lọt top là được."
  chariot_race.0120.c.tt: "Mục tiêu đặt cược phải về nhất, nhì hoặc ba"
  chariot_race.0120.c.info: "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_show').GetValue|1]%#! $chariot_chance_to_show$ #weak (tỷ lệ [root_scope.MakeScope.Var('wager_target').Var('odds_show_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_show_b').GetValue])#!\n$chariot_show_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('show_payout').GetValue|1]x#!"

  chariot_race.0130.t: "$chariot_race.0100.t$"
  chariot_race.0130.desc: "Những dự đoán của ta được ghi chép cẩn thận, minh chứng cho chất lượng phán đoán của bản thân... hy vọng cũng phản ánh sự am hiểu và trực giác của ta về môn thể thao này. Có lẽ mọi cuộc bàn luận gần đây đã giúp ta chuẩn bị kỹ càng.\n\n\"Cuối cùng, thưa ngài [ROOT.Char.GetTitleAsNameNoTooltip]: ngài muốn đặt bao nhiêu?\""
  chariot_race.0130.a: "@gold_icon!200"
  chariot_race.0130.b: "@gold_icon!150"
  chariot_race.0130.c: "@gold_icon!100"
  chariot_race.0130.d: "@gold_icon!50"
 

 ### RACE STARTS ###
  chariot_race.0200.t: "Người Ban Phát Hội Đua"
  chariot_race.0200.intro_guest: "Đã đến giờ. Dẫn theo gia quyến của ta — đồng thời lịch thiệp mời vị khách danh dự, [honorary_guest.GetTitledFirstName], cùng bước theo bằng một cái phất tay — ta tiến lên khán đài cẩm thạch [Glossary( 'kathisma', 'KATHISMA_GLOSS')], vị trí danh dự của chúng ta phía trên cơn hỗn loạn của Trường đua.\n\n"
  chariot_race.0200.intro_no_guest: "Đã đến giờ. Dẫn theo gia quyến, ta tiến lên khán đài cẩm thạch [Glossary( 'Kathisma', 'KATHISMA_GLOSS')], vị trí danh dự của chúng ta phía trên cơn hỗn loạn của Trường đua.\n\n"
  chariot_race.0200.desc: "Khi biển người phía dưới chờ đợi, ta cân nhắc nội dung bài diễn văn khai mạc. Dĩ nhiên, ta sẽ cất lên những nghi thức cổ xưa đầy uy nghi — nhưng đồng thời cũng..."
 # Sway Intent
  chariot_race.0200.a: "Hết lời ca ngợi vị khách danh dự của ta."
  chariot_race.0200.a.flavor: "Một bài tụng ca rực rỡ cho vị thế của [honorary_guest.GetFirstNamePossessiveNoTooltip] trong ân sủng đế quyền của ta: hãy để dân chúng hô vang tên [honorary_guest.GetHerHis]!"
 # Seduce Intent
  chariot_race.0200.b: "Một ẩn dụ cổ điển, đượm chất lãng mạn và say mê..."
  chariot_race.0200.b.flavor: "Một ẩn dụ gợi cảm dành cho [honorary_guest.GetFirstNameNoTooltip]: để tất cả đều biết tình cảm của ta dành cho [honorary_guest.GetHerHim]!"
 # Present Heir
  chariot_race.0200.c: "Ta sẽ giới thiệu người thừa kế đứng cạnh ta."
  chariot_race.0200.c.flavor: "Đám đông sẽ được chiêm ngưỡng [honorary_guest.GetTitledFirstNameNoTooltip] ở trên cao, nghe tuyên bố con đường đến với vương quyền của [honorary_guest.GetHerHis], và dần yêu mến [honorary_guest.GetHerHim]."
 # Appease Populace
  chariot_race.0200.d: "Hứa sẽ giải quyết những khốn khó của dân chúng."
  chariot_race.0200.d.flavor: "Ta sẽ thả tội phạm? Giảm thuế bị căm ghét? Tân trang thành phố? Đàn áp kẻ bị ghét bỏ? Đám đông phải được thỏa mãn..."
  combats_sow_discord_responses_tooltip: "@alert_icon! #alert_trial Ngăn người tham dự thù địch gây tổn hại [county_control|E]#!"
 # Increase Legitimacy (Intent)
  chariot_race.0200.e: "Ta sẽ nói về những thành tựu đế quyền của mình."
  chariot_race.0200.e.flavor: "Hãy để đám đông cất tiếng ca ngợi vị [ROOT.Char.GetTitleAsNameNoTooltip] của họ! Hãy để họ #EMP biết#! ta xứng đáng với vương quyền tối thượng!"
  chariot_race.0200.e.success: "Một bài diễn văn hùng hồn và xứng đáng"
  chariot_race.0200.e.failure: "Đám đông rít lên và la ó"
 # Spread Legend (Intent)
  chariot_race.0200.f: "Thuật lại truyền thuyết về [promoted_legend.GetName]."
  chariot_race.0200.f.flavor: "Ai có thể truyền tải sự xác tín tới hàng nghìn tâm trí tốt hơn chính [ROOT.Char.GetFaith.HighGodNamePossessive] kẻ được chọn — [ROOT.Char.GetHerselfHimself]?"
 # Discredit Claimant (Situational)
  chariot_race.0200.g: "Công khai bôi nhọ kẻ tranh ngôi."
  chariot_race.0200.g.flavor: "Chỉ cần một khoảnh khắc, sự phấn khích trong ngày có thể biến thành chế giễu, khi đến cả kẻ bần cùng nhất cũng khinh miệt [claimant.GetNameNoTooltip] như một người kế vị đế quyền!"
  chariot_race.0200.g.success: "Ngươi sỉ nhục [claimant.GetTitledFirstNameNoTooltip] một cách thảm hại"
  chariot_race.0200.g.failure: "Đám đông gầm vang tên [claimant.GetTitledFirstNamePossessiveNoTooltip]"
 # Drum up War Support (Situational)
  chariot_race.0200.h: "Khoe khoang cuộc chiến chính nghĩa của ta!"
  chariot_race.0200.h.flavor: "Nếu ta có thể ung dung mở hội vui chơi nơi đây, thì chiến thắng trước [foe.GetPrimaryTitle.GetNameNoTooltip] chẳng phải đã nắm chắc trong tay sao? Hãy cùng run rẩy vì vinh quang chiến thắng sắp tới!"
  chariot_race_war_support_attendees_tt: "[governor|E] và [house_head|E] tham dự sẽ hiến tặng cho ngài [gold_i][gold|E]"
 # Influence/Legitimacy Fallback
  chariot_race.0200.i: "Nói về ân huệ của ta... và lòng trung thành ta mong đợi đáp lại"
  chariot_race.0200.i.flavor: "Chẳng phải ngân khố đã đổ máu vì niềm vui của dân chúng sao? Để quan chức được thịnh vượng? Kẻ nào mong nhận thêm ân sủng thì nên học cách làm hài lòng vị [ROOT.Char.GetTitleAsNameNoTooltip] của mình..."

  imperial_candidate_support_tooltip: "Những người tham dự sẽ chuyển sang ủng hộ [candidate_score|E] của [imperial_house_candidate.GetShortUINamePossessive] cho [root_scope.GetPrimaryTitle.GetName]"
  honorary_guest_support_tooltip: "Những người tham dự sẽ ủng hộ [candidate_score|E] của [imperial_house_candidate.GetShortUINamePossessive] cho [root_scope.GetPrimaryTitle.GetName]"
  discredited_claimant_support_tooltip: "Những người tham dự sẽ tiếp tục gia tăng [candidate_score|E] của [claimant.GetShortUINamePossessive]"
  chariot_race.0201.t: "Bài Diễn Văn của [host.GetTitleAsNamePossessiveNoTooltip]"
  chariot_race.0201.kathisma: "Tiếng reo hò của hàng ngàn người ngày một vang dội. Ta bị cuốn theo cùng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))] của mình, [host.GetTitledFirstName], khi đoàn tùy tùng của [host.GetHerHis] tiến lên cầu thang xoắn dẫn tới [Glossary( 'kathisma', 'KATHISMA_GLOSS')] trên cao và nghi thức khai mạc cuộc đua bắt đầu.\n\n"
  chariot_race.0201.intro: "Xếp thành những hàng bất tận quanh Trường Đua đồ sộ, đám đông bồn chồn chờ đợi các xa phu của họ và [host.GetTitleAsName]. Cuối cùng, trong khán đài hoàng gia sừng sững, một bóng dáng nhỏ bé đội vương miện vàng xuất hiện. Nghi thức khai mạc bắt đầu.\n\n"

  chariot_race.0201.emperor_unfazed: "[host.GetTitleAsNameNoTooltip] đắm mình trong sự mong đợi cuồng nhiệt của dân chúng và bắt đầu cất lên bài diễn văn vang dội."
  chariot_race.0201.emperor_nervous: "[host.GetTitleAsNameNoTooltip], với lan can che khuất một trong những bàn tay run rẩy của [host.GetHerHis], cất lời trước dân chúng."
  chariot_race.0201.emperor_distant: "Giữa những lời thì thầm truyền đi thông điệp xa cách của [host.GetHerHis], [host.GetTitledFirstNameNoTooltip] trình bày bài diễn văn."

  chariot_race.0201.gain_influence: "[host.GetSheHe|U] kể về những hành động từ thiện của hoàng gia và sự xa hoa của các cuộc đua sắp tới. Phúc đức của [host.GetHerHis] lớn lao biết bao! Những ai đặt niềm tin vào [host.GetTitleAsNameNoTooltip], những kẻ phụng sự [host.GetHerHim] tận tụy, được ban thưởng hậu hĩnh biết chừng nào!"
  chariot_race.0201.sway: "Một bài tụng ca dành cho [honorary_guest.GetName] dần hình thành. Kết hợp với vị trí danh dự trong khán đài hoàng gia, những lời ca tụng này kéo [host.GetTitleAsNamePossessiveNoTooltip] [host.Custom2('RelationToMeShort', SCOPE.sC('honorary_guest'))] vào hào quang tráng lệ của hoàng cung."
  chariot_race.0201.sway_self: "[host.GetSheHe|U] dành lời khen cho đức hạnh của ta và ân huệ từ sự hiện diện của ta. Tại đây, trong khán đài hoàng gia, ta thấy mình đang bị cuốn vào hào quang tráng lệ của hoàng cung."
  chariot_race.0201.seduce: "Với những ẩn dụ hoa mỹ, tuôn trào cùng các điển tích cổ điển, [host.GetSheHe] dường như đang ca ngợi một người yêu dấu nào đó... hay một sự nhân cách hóa duyên dáng của [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]?"
  chariot_race.0201.seduce_self: "Với những ẩn dụ lãng mạn, hoa mỹ, tuôn trào cùng các điển tích cổ điển, [host.GetSheHe] dường như đang ca ngợi một sự nhân cách hóa duyên dáng của [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]... hay #EMP ta?#!"
  chariot_race.0201.present_heir: "Có vẻ như [host.GetSheHe] đang tận dụng dịp này để giới thiệu người thừa kế trước dân chúng. Giữa những tràng hoan hô tán thưởng, [host.GetTitleAsNameNoTooltip] tuyên bố [honorary_guest.GetName] xứng đáng với áo bào tím hoàng gia."
  chariot_race.0201.present_heir_self: "Có vẻ như [host.GetSheHe] đang tận dụng dịp này để giới thiệu người thừa kế trước dân chúng. Giữa những tràng hoan hô tán thưởng, [host.GetTitleAsNameNoTooltip] tuyên bố rằng #EMP ta#! là một ứng viên hoàn toàn xứng đáng với áo bào tím hoàng gia!"
  chariot_race.0201.appease_populace: "Những lời hứa tuôn ra không dứt: bãi bỏ thuế khóa, thả tự do cho kẻ kích động, và ném vàng tới bất cứ nơi nào quần chúng muốn. [host.GetTitleAsNameNoTooltip] đang cúi mình — hoàn toàn — trước ý chí của đám đông cuồn cuộn."
  chariot_race.0201.increase_legitimacy_success: "[host.GetHersHis|U] là một câu chuyện hùng tráng và xứng đáng: về một cuộc đời cao quý, về những thử thách đã chinh phục. [host.GetTitleAsNameNoTooltip] kêu gọi sự phán xét của đám đông: chẳng phải áo bào quân vương đã được định sẵn ngay từ thuở ban đầu sao?"
  chariot_race.0201.increase_legitimacy_fail: "[host.GetHersHis|U] là một câu chuyện nghèo nàn và rỗng tuếch: những lời khoe khoang của [host.GetTitleAsNamePossessiveNoTooltip] nghe thật giả tạo. [host.GetSheHe|U] kêu gọi sự phán xét của đám đông... trong khi trông chẳng khác nào một đứa trẻ hờn dỗi khoác lên mình áo bào quân vương."
  chariot_race.0201.spread_legend: "Khéo léo đan xen vào những câu chữ quen thuộc là các ám chỉ về [promote_legend.GetName]. Nghi lễ cổ xưa trở nên không thể phân biệt với câu chuyện hoàng gia."
  chariot_race.0201.discredit_claimant_self: "Và chẳng mấy chốc cái tên của ta đã ở trên môi mọi người! Vì [host.GetTitleAsNameNoTooltip], kẻ ngốc nghếch là [host.GetSheHe], công khai bôi nhọ triển vọng của ta và thề rằng ta sẽ không bao giờ nhận được sự ủng hộ của [host.GetHerHis] cho ngai vàng!"
  chariot_race.0201.discredit_claimant_success: "Trước mặt tất cả mọi người, [host.GetSheHe] lên án cái tên [claimant.GetName], nghiền nát triển vọng của [claimant.GetHerHis], và thề rằng [claimant.GetSheHe] sẽ không bao giờ ngồi lên ngai vàng!"
  chariot_race.0201.discredit_claimant_fail: "Trước mặt tất cả mọi người, [host.GetSheHe] bôi nhọ cái tên [claimant.GetName], than vãn về triển vọng của [claimant.GetHerHis], và đỏ mặt tía tai khi nghĩ tới viễn cảnh [claimant.GetHerHim] ngồi lên ngai vàng."
 
  chariot_race.0201.war_support: "Những lời kêu gọi của [host.GetHerHis|U] cho một cuộc chiến chính nghĩa chống lại [foe.GetName] trút xuống đám đông, cùng những lời hứa chiến thắng của [host.GetHerHis]. Chính những trò tiêu khiển thời chiến này, [host.GetSheHe] tuyên bố, là minh chứng rằng chúng ta không sợ bất kỳ kẻ thù nào!"
  chariot_race.0201.angry_crowd: "\n\nĐám đông hoàn toàn không hài lòng. Tiếng vỗ tay lẫn vào những tiếng gào thét đòi hỏi, sỉ nhục và hò hét thô tục."
  chariot_race.0201.happy_crowd: "\n\nQuần chúng gầm vang sự tán dương, say sưa trong bầu không khí của Trường Đua, cả thành phố hợp nhất trong lời ca ngợi."
 
  chariot_race.0201.aa.discredit: "Ngai vàng thuộc về Nhà [host.GetHouse.GetNameNoTooltip]!"
  chariot_race.0201.aa.honorary_guest: "[honorary_guest.GetTitledFirstNameNoTooltip] đang lên ngôi!"
  chariot_race.0201.ab: "[claimant.GetTitledFirstNameNoTooltip] sẽ trị vì!"
  chariot_race.0201.a: "Diễn văn đã xong — nâng cốc chúc mừng Vận Mệnh!"
  chariot_race.0201.a.flavor: "Những trò tiêu khiển này có ý nghĩa gì nếu thiếu rượu chè?"
  chariot_race.0201.b: "Thật là một bài diễn văn đáng xấu hổ..."
  chariot_race.0201.b.flavor: "Gieo một ý nghĩ vào đầu những nhân vật tai to mặt lớn xung quanh: một nhà hùng biện thực thụ hay bậc thầy chính trị đã có thể khiến tất cả phải kinh ngạc!"
  chariot_race.0201.c: "Cho người kích động một khẩu hiệu đối nghịch!"
  chariot_race.0201.c.flavor: "#EMP Nhấn chìm [host.GetTitleAsNameNoTooltip]! Hãy để quần chúng khuất phục kẻ ngạo mạn kia, và kêu gọi thay thế [host.GetHerHis]!#!"
  chariot_race.0201.d: "Ta sẽ góp sức cho chính nghĩa!"
  chariot_race.0201.d.flavor: "Và nhờ đó, giành phần công lao của ta trong chiến thắng hiện tại."
  chariot_race.0201.e: "Ta phải cảm tạ [host.GetTitleAsNameNoTooltip] một cách nồng nhiệt."
  chariot_race.0201.e.flavor: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))] cao quý của ta — còn ai khác có thể ban cho những ân huệ tương tự?"
  chariot_race.0201.f: "Hãy ca ngợi [host.GetTitleAsNameNoTooltip] của chúng ta!"

  counter_chanters_log_title: "Khẩu Hiệu Đối Kháng Chống Lại Bài Diễn Văn Khai Mạc"
  counter_chanters_log: "Bài diễn văn của [host.GetShortUINamePossessive] đã vấp phải sự phản đối chính trị có tổ chức và những tiếng gào thét chát chúa của quần chúng."
  chariot_race.0202.title: "Khẩu Hiệu Đối Kháng Chống Lại Diễn Văn"
  chariot_race.0202.desc: "Đám đông hỗn loạn tham dự cuộc Đua Chiến Xa của Ngài đã bị kích động chống lại Ngài."
  counter_chants_strong_modifier_tooltip: "[imperial_capital.GetName] nhận được [activity.MakeScope.Var( 'counter_chant_count' ).GetValue|N0] lần hiệu ứng [GetModifier( 'strong_sow_discord_modifier' ).GetNameWithTooltip]"
  counter_chants_normal_modifier_tooltip: "[imperial_capital.GetName] nhận được [activity.MakeScope.Var( 'counter_chant_count' ).GetValue|N0] lần hiệu ứng [GetModifier( 'normal_sow_discord_modifier' ).GetNameWithTooltip]"
  counter_chants_weak_modifier_tooltip: "[imperial_capital.GetName] nhận được [activity.MakeScope.Var( 'counter_chant_count' ).GetValue|N0] lần hiệu ứng [GetModifier( 'weak_sow_discord_modifier' ).GetNameWithTooltip]"

 # Notification that the race has begun
  chariot_race.0250.t: "Hãy Để Cuộc Đua Bắt Đầu"
  chariot_race.0250.desc: "Đắm mình trong sắc vàng của nắng trưa, những tiếng reo hò long trời của đám đông chào đón các xa phu. [activity.MakeScope.Var('first_place').Char.GetFirstName|U], [activity.MakeScope.Var('second_place').Char.GetFirstName], và [activity.MakeScope.Var('third_place').Char.GetFirstName] được đánh giá là những người có khả năng chiến thắng hôm nay. Họ đứng sẵn ở vạch xuất phát, dây cương căng chặt và ánh mắt bừng cháy quyết tâm.\n\nKhi những chiếc kèn hoàng gia vang lên, các cỗ xe lao vút về phía trước, bánh xe tung bụi mù trong cơn lốc tốc độ và kỹ năng. Mặt đất dưới chân ta rung chuyển bởi tiếng vó ngựa dồn dập, và cuộc đua mở màn với nguồn năng lượng sôi sục."
  chariot_race.0250.a: "Hãy để các cuộc tranh tài bắt đầu!"


 ### ONGOING EVENTS
  chariot_race.3000.t: "Tấm Khiên của phe [ROOT.Char.Custom('GetChariotTeamColorPlural')]"
  chariot_race.3000.intro: "Các cỗ xe ngựa dồn sát vào nhau — sát đến mức chỉ cần một chiếc cũng có thể phá vỡ toàn bộ đội hình. Phe của ta là những kẻ đầu tiên nắm lấy cơ hội này.\n\n"
  chariot_race.3000.backing_sacrifice: "Tay đua đang chạy cùng số tiền cược của ta trên đầu [charioteer_sacrifice.GetHerHis], [charioteer_sacrifice.GetName], bắt đầu lạng lách điên cuồng — trái, rồi phải, rồi lại trái. Nhân danh [ROOT.Char.GetFaith.HighGodName], thật chậm chạp đến phát bực! Nhưng cả đoàn đua chính đều bị mắc kẹt sau rào cản lạng lách của [charioteer_sacrifice.GetHerHis]!\n\nTrong khi đó, [charioteer_leading.GetName], một tay đua khác của [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')], lao vút lên phía trước không chút cản trở."
  chariot_race.3000.not_backing_but_employs_sacrifice: "Người đánh xe của ta, [charioteer_sacrifice.GetName], bắt đầu đánh lái loạng choạng — trái, rồi phải, rồi lại trái. Thật khôn ngoan, thật táo bạo! [charioteer_sacrifice.GetSheHe|U] đang giam chặt cả đoàn xe chính phía sau hàng rào zigzag do [charioteer_sacrifice.GetHerHis] tạo ra.\n\nTrong khi đó, một tay đua khác của phe [charioteer_leading.Custom('GetChariotTeamColorPluralGlossed')], [charioteer_leading.GetName], lao vút lên phía trước một cách thuận lợi!"
  chariot_race.3000.not_backing_sacrifice: "Một trong những người đánh xe của chúng ta, [charioteer_sacrifice.GetName], bắt đầu đánh lái loạng choạng — trái, rồi phải, rồi lại trái. Thật khôn ngoan, thật táo bạo! [charioteer_sacrifice.GetSheHe|U] đang giam chặt cả đoàn xe chính phía sau hàng rào zigzag do [charioteer_sacrifice.GetHerHis] tạo ra.\n\nTrong khi đó, tay đua ta lựa chọn, [charioteer_leading.GetName], lao vút lên phía trước một cách thuận lợi!"
  chariot_race.3000.a: "Cho lực lượng trấn áp tham gia vào cuộc ẩu đả sắp nổ ra."
  chariot_race.3000.a.flavor: "Các phe khác đang náo loạn, phẫn nộ trước trò chơi táo tợn này: đã đến lúc khiến phe [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] cũng trở nên hung hăng!"
  chariot_race.3000.b: "Một sự hy sinh vĩ đại vì phe [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]#EMP !#!"
  chariot_race.3000.b.flavor: "Tất cả những người thuộc phe [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] chúng ta nên phấn khích trước chiến thắng sắp đến!"
  chariot_race.3000.c: "Có kẻ được lợi... nhưng cũng có kẻ chịu thiệt."
  chariot_race.3000.c.flavor: "Những người ủng hộ nghèo khổ, bị lừa dối của [charioteer_sacrifice.GetFirstNameNoTooltip] cũng đáng được nghĩ đến!"
  chariot_race.3000.d: "\"Không! #EMP [charioteer_about_to_be_passed.GetFirstNameNoTooltip]!#!\""

  chariot_race.3010.t: "Hãy yên nghỉ, [first_place_charioteer.GetFirstNameNoTooltip]"
  chariot_race.3010.desc: "Trong một khoảnh khắc ngắn ngủi, [first_place_charioteer.GetFirstName] như có cánh. [first_place_charioteer.GetSheHe|U] bay vút lên dẫn đầu đoàn đua, giành vị trí thứ nhất và tạo ra khoảng cách mênh mông giữa [first_place_charioteer.GetHerselfHimself] và những tay đua còn lại.\n\nTrong một khoảnh khắc ngắn ngủi, cỗ xe vinh quang của [first_place_charioteer.GetHerHis] đã làm rạng danh Hippodrome... nhưng [first_place_charioteer.GetFirstNameNoTooltip] không phải là Helios. Bay quá gần sự vĩ đại, [Glossary( 'Phaethon', 'PHAETHON_GLOSS' )] của chính chúng ta đã ngã xuống. Cái xác vặn vẹo của [first_place_charioteer.GetHerHis|U] và một vệt máu dài giờ đây đã khuất phục bụi mờ trên đường đua — di chúc cuối cùng cho tham vọng của [first_place_charioteer.GetHerHis]."
  PHAETHON_GLOSS: "Trong thần thoại Hy Lạp cổ đại, Phaethon bị Zeus đánh chết bằng tia sét sau khi cố điều khiển cỗ xe mặt trời của cha mình là Helios."
  chariot_race.3010.a: "Phát biểu để xoa dịu đám đông."
  chariot_race.3010.a.success: "Đám đông được trấn an"
  chariot_race.3010.a.failure: "Đám đông vẫn tiếp tục hoảng loạn"
  chariot_race.3010.b: "Dựng tượng vinh danh [first_place_charioteer.GetHerHis]."
  chariot_race.3010.c: "\"[first_place_charioteer.GetFirstNameNoTooltip] sẽ có một tang lễ xứng đáng với thành tựu của [first_place_charioteer.GetHerHis].\""
  chariot_race.3010.a.success_title: "$chariot_race.3010.a.success$"
  chariot_race.3010.a.failure_title: "$chariot_race.3010.a.failure$"


  chariot_race.3020.t: "Triển Vọng Cược Của Ta"
  chariot_race.3020.intro: "Đã đặt cược [ROOT.Var('wager_value').GetValue] vàng cho [wager_target.GetFirstName] để [ROOT.Char.Custom('GetWinPlaceShow')], ta dõi theo sát sao phong độ của [wager_target.GetHerHis]. Hiện tại, [wager_target.GetSheHe|U] đang ở... #EMP;HIGH vị trí [wager_target.Custom('GetChariotRacePlacement')]!#!\n\n"
  chariot_race.3020.placement_first: "Ta mong chờ được hân hoan trước chiến thắng cận kề của [wager_target.GetFirstNamePossessiveNoTooltip]! Tiền thưởng đang tới!"
  chariot_race.3020.placement_good: "Lường trước những biến số, ta chăm chú quan sát khi [wager_target.GetFirstNameNoTooltip] luồn lách giữa các đối thủ từ vị trí thuận lợi."
  chariot_race.3020.placement_bad: "Tỷ lệ đang không đứng về phía chúng ta..."
  chariot_race.3020.placement_last: "#EMP ĐỘI SỔ?!#! Tim ta trĩu xuống khi [wager_target.GetFirstNameNoTooltip] chật vật trên đường đua, hiện đang bám chót, và ta chỉ biết cầu mong một bước ngoặt bất ngờ."
  chariot_race.3020.a: "Kích động người hâm mộ của [wager_target.GetFirstNamePossessiveNoTooltip] dùng bạo lực!"
  chariot_race.3020.a.flavor: "Bạo lực — #EMP nhân danh ta!#!"
  chariot_race.3020.b: "Một khoảnh khắc để phân phát lễ rượu..."
  ep3_chariot_race_strong_appeasement_modifier: "Hào Phóng Xa Hoa"
  ep3_chariot_race_strong_appeasement_modifier_desc: "Trong một cuộc đua xe ngựa long trọng, lễ rượu và các cử chỉ hào phóng đã được phân phát rộng rãi cho dân chúng."
  ep3_chariot_race_weak_appeasement_modifier: "Nỗ Lực Xoa Dịu"
  ep3_chariot_race_weak_appeasement_modifier_desc: "Đã có những cố gắng nhằm chiếm được cảm tình của đám đông tại trường đua."
  chariot_race.3020.c: "Ngài thích ai sẽ thắng, [special_guest.GetFirstNameNoTooltip]?"
  chariot_race.3020.d.placement_first: "Cố lên nào... chỉ còn chút nữa thôi!"
  chariot_race.3020.d.placement_good: "Tiếp tục đi, [wager_target.GetFirstNameNoTooltip]!"
  chariot_race.3020.d.placement_bad: "Vẫn còn thời gian. [wager_target.GetSheHe|U] vẫn còn cơ hội."
  chariot_race.3020.d.placement_last: "Đây là lần cuối ta cược cho phe [wager_target.Custom('GetChariotTeamColorPluralGlossed')]..."

  chariot_race.3030.t: "[trailing_charioteer.GetShortUINameNoTooltip] vượt qua [leading_charioteer.GetShortUINameNoTooltip]!"
  chariot_race.3030.desc: "Trong một cú lật kèo bất ngờ, [trailing_charioteer.GetFirstName] [trailing_charioteer.Custom('GetVictoriousChariotMovement')], vượt qua [leading_charioteer.GetFirstName] để vươn lên vị trí [trailing_charioteer.Custom('GetChariotRacePlacement')]!\n\nĐám đông phát cuồng!"
  chariot_race.3030.desc_teams: "Những người ủng hộ phe [trailing_charioteer.Custom('GetChariotTeamColorPluralGlossed')] phất cao màu cờ và hò reo vang dội... trong khi những người ủng hộ phe [leading_charioteer.Custom('GetChariotTeamColorPluralGlossed')] thì bực bội lắc đầu."
  chariot_race.3030.a: "Nâng cốc chúc mừng thành công của [trailing_charioteer.GetFirstNamePossessiveNoTooltip]."
  chariot_race.3030.b: "Nếu không thể đánh bại họ... thì hãy biến họ thành của ta."
  chariot_race.3030.c: "Vận xui thôi, [leading_charioteer.GetFirstNameNoTooltip]."

  chariot_race.3040.t: "Va Chạm Chết Chóc"
  chariot_race.3040.desc: "[charioteer_1.GetName|U] và [charioteer_2.GetName] tranh giành vị trí, cỗ xe của họ cọ xát và dội vào nhau dữ dội. Họ giật mạnh dây cương khi tiến vào khúc cua. Những cỗ xe không thể tách rời!\n\nBánh xe của [charioteer_1.GetFirstNamePossessive|U] vỡ tan thành từng mảnh. Cỗ xe của [charioteer_1.GetHerHis|U] loạng choạng rồi đâm sầm vào cỗ xe của [charioteer_2.GetFirstNamePossessive]. Tiếng gào thét của ngựa và mùi máu tanh bốc lên từ đống đổ nát. Không người đánh xe nào có dấu hiệu cử động."
  chariot_race.3040.a: "Những con người dũng cảm này sẽ được tổ chức tang lễ long trọng."
  chariot_race.3040.b: "Dừng vòng đua tiếp theo! Họ có thể vẫn còn sống!"
  chariot_race.3040.b.tt: "Những người sống sót sẽ được kéo ra khỏi đống đổ nát"
  chariot_race.3040.b.both_survive: "Cả hai người đánh xe đều sống sót"
  chariot_race.3040.b.chariot_two_survives: "[charioteer_2.GetFirstNameNoTooltip|U] sống sót"
  chariot_race.3040.b.chariot_one_survives: "[charioteer_1.GetFirstNameNoTooltip|U] sống sót"
  chariot_race.3040.b.no_survivors: "Không ai sống sót"
  chariot_race.3040.c: "Thật là một màn trình diễn! ĐÓ mới là đua xe ngựa!"
  chariot_race.3040.d: "Thật kinh hoàng... ta sẽ cầu nguyện cho họ."

  chariot_race.3050.t: "Chiến Thắng Không Tưởng"
  chariot_race.3050.desc: "Không khí đặc quánh sự căng thẳng.\n\n[last_place_charioteer.GetFirstName], một tay đua từng bị coi thường, bất ngờ thách thức mọi nghịch cảnh, [last_place_charioteer.Custom('GetChariotComebackMovement')] trong một màn [Glossary( 'aristeia', 'GLOSS_ARISTEIA')] đích thực.\n\nTiếng kinh ngạc vang vọng khắp khán đài khi màu sắc rực rỡ của [last_place_charioteer.Custom('GetChariotTeamColorPluralGlossed')] lao lên phía trước. Đám đông, từ chỗ im lặng trong sự hoài nghi, đã bùng nổ thành một tiếng gầm sấm sét!"
  chariot_race.3050.a: "#EMP Phe [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] thống trị!#!"
  chariot_race.3050.b: "[last_place_charioteer.GetSheHe|U] sẽ thuộc về ta."
  chariot_race.2050.c: "Làm tốt lắm, [last_place_charioteer.GetFirstNameNoTooltip]!"
  GLOSS_ARISTEIA: "Một #EMP aristeia#! mô tả khoảnh khắc được thần linh truyền cảm hứng, trong đó một anh hùng có thể thực hiện những chiến công phi thường và ấn tượng."
  chariot_race.2050.d: "[ROOT.Char.GetFaith.HighGodName|U] yêu thương một số đứa con của [ROOT.Char.GetFaith.HighGodHerHis] nhiều hơn những kẻ khác..."

 ### Events only for spectators
  chariot_race.4000.t: "Giao Lưu Kết Nối"
  chariot_race.4000.desc: "\"À, nhìn kìa! [activity.MakeScope.Var('first_place').Char.GetName] đang dẫn đầu!\" [target_governor.GetTitledFirstName|U] tiến lại gần ta. Nụ cười của [target_governor.GetHerHis|U] rộng chẳng kém những khúc cua mà [last_place.GetFirstNamePossessive] phải vượt qua.\n\n\"[target_governor.Custom('GetGovernorChitChat')] Ngài dạo này thế nào, thân mến [ROOT.Char.GetFirstNameNoTooltip]?\"\n\nMột cuộc trò chuyện lịch sự giữa các tổng trấn hoàn toàn có thể được chuyển sang những chủ đề hữu ích hơn..."
  chariot_race.4000.a: "Ta sẽ khéo léo đề cao những đức tính của mình với tư cách là một người cai trị."
  chariot_race.4000.a.critical_success: "[target_governor.GetFirstNameNoTooltip] trở thành người hâm mộ cuồng nhiệt của Ngài"
  chariot_race.4000.a.critical_success_title: "$chariot_race.4000.a.critical_success$"
  chariot_race.4000.a.success: "Ngài thuyết phục được [target_governor.GetFirstNameNoTooltip] về giá trị của mình"
  chariot_race.4000.a.success_title: "$chariot_race.4000.a.success$" 
  chariot_race.4000.a.failure: "Ngài không thể thuyết phục [target_governor.GetFirstNameNoTooltip] về giá trị của mình"
  chariot_race.4000.a.failure_title: "$chariot_race.4000.a.failure$"
  chariot_race.4000.a.critical_failure: "[target_governor.GetFirstNameNoTooltip] trở thành kình địch của Ngài"
  chariot_race.4000.a.critical_failure_title: "$chariot_race.4000.a.critical_failure$"
