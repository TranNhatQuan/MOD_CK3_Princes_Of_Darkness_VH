  change_appointment_investment_medium_loss: "[candidate_score|E] của Ngài cho [target_title.GetName] giảm [EmptyScope.ScriptValue('appointment_score_medium_value')|N0]"
  chariot_race.4000.b: "Ta tự hỏi [target_governor.GetFirstNameNoTooltip] có những tay chân nào ở đây..."
  ep3_united_agents_tooltip: "[political_schemes|E] chống lại [liege|E] của Ngài: #P +15%#! [success_chance|E] trong #high 10 năm#!"
  united_political_agents_modifier: "Mạng Lưới Đặc Vụ Hợp Nhất"
  united_political_agents_modifier_desc: "Những thế lực chính trị của nhân vật này trong triều đình cấp cao phối hợp cùng mạng lưới của một kẻ khác."
  united_political_agents_modifier_tt: "#weak [political_schemes|E] chống lại [liege|E]: #P +15%#! [success_chance|E]#!"
  chariot_race.4000.c: "Không biết [target_governor.GetFirstNameNoTooltip] đã nghe những câu chuyện người ta kể về ta chưa?"
  chariot_race.4000.c.success: "[target_governor.GetFirstNameNoTooltip] bắt đầu lan truyền huyền thoại về Ngài"
  chariot_race.4000.c.failure: "[target_governor.GetFirstNameNoTooltip] không mấy hứng thú với huyền thoại của Ngài"
  chariot_race.4000.d: "À, một cơ hội để mở rộng ảnh hưởng chính trị của ta!"
  chariot_race.4000.d.success: "Ngài thao túng thành công [target_governor.GetTitledFirstName]"
  chariot_race.4000.d.failure: "Ngài không thể thao túng [target_governor.GetTitledFirstName]"
  chariot_race.4000.f: "Đừng bao giờ đánh giá thấp giá trị của những người Ngài ở địa vị cao."
  chariot_race.4000.g: "Có lẽ đã đến lúc hạ thấp [target_governor.GetFirstNameNoTooltip] xuống một bậc..."
  chariot_race.4000.g.flavor: "Ngài tung ra một lời xúc phạm làm tan vỡ tham vọng của [target_governor.GetFirstNameNoTooltip]"
  target_governor_change_appointment_investment_medium_loss: "[candidate_score|E] của [target_governor.GetTitledFirstNamePossessive] cho [target_title.GetName] giảm [EmptyScope.ScriptValue('appointment_score_medium_value')|N0]"

  chariot_race.4010.t: "Lật Đổ [unpopular_official.GetTitledFirstNameNoTooltip]!"
  chariot_race.4010.desc: "Một tiếng gầm vang lên từ đám đông, rồi lan rộng, lặp lại, biến thành một khẩu hiệu. Ta nghiêng người về phía trước, căng tai lắng nghe. Đám [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] giậm chân, chỉ trỏ, hô vang một cái tên: #EMP \"Lật đổ [unpopular_official.GetTitledFirstName]! Lật đổ [unpopular_official.GetTitledFirstNameNoTooltip]!\"#!\n\nTa từng nghe rằng [unpopular_official.GetTitledFirstNameNoTooltip] đang mang tiếng xấu, nhưng không ngờ dân chúng lại phẫn nộ đến vậy!"
  chariot_race.4010.a: "[unpopular_official.GetTitledFirstNameNoTooltip|U] sẽ bị tước bỏ chức vụ của [unpopular_official.GetHerHis]."
  chariot_race.4010.b: "Xoa dịu đám đông. Sai gia nhân ném quà cho họ!"
  chariot_race.4010.b.tt.success: "Đám đông vui mừng"
  chariot_race.4010.b.tt.failure: "Tiếng hô càng lúc càng lớn"
  chariot_race.4010.c: "Không thể chấp nhận được. Ta vẫn cần tài năng của [unpopular_official.GetFirstNamePossessiveNoTooltip]."
  chariot_race.4010.d: "Hòa vào tiếng hô! Lật đổ [unpopular_official.GetTitledFirstNameNoTooltip]!"
  chariot_race.4010.e: "Khởi xướng khẩu hiệu mới! #EMP \"[ROOT.Char.GetFaith.HighGodName] bảo hộ [emperor_scope.GetTitledFirstNameNoTooltip]!\"#!"
  chariot_race.4010.f: "Ngồi im trong sự im lặng khó chịu."

  chariot_race.4020.t: "Sức Hấp Dẫn Của [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
  chariot_race.4020.desc: "\"Những [Glossary( 'thermae', 'THERMAE_GLOSS')] xa hoa, ngài nói sao?\" [notable.GetName] trầm ngâm, lời nói của [notable.GetHerHis] bị cuốn vào âm thanh hỗn loạn của đám đông, \"Ta chưa từng nghĩ [ROOT.Char.GetCapitalLocation.GetName] lại tinh tế đến thế...\"\n\nKhi ta nói về những kế hoạch cho [ROOT.Char.GetPrimaryTitle.GetNameNoTier], ánh mắt xa xăm mơ màng dần hiện lên trên gương mặt [notable.GetTitledFirstNamePossessiveNoTooltip].\n\n"
  THERMAE_GLOSS: "Một khu nhà tắm có nguồn gốc La Mã, không chỉ dùng để tẩy rửa cơ thể mà còn là nơi diễn ra nhiều tương tác xã hội."
  chariot_race.4020.desc_capital_estate: "\"Thực lòng mà nói,\" [notable.GetSheHe] nói, \"tiếng nói của gia tộc ta bị lấn át bởi sự ồn ào và tranh chấp của kinh đô, con cái chúng ta lại tiếp xúc với đủ mọi thói xấu... có lẽ một ngôi nhà [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] sẽ rất phù hợp với Gia tộc [notable.GetHouse.GetName].\""
  chariot_race.4020.desc_provincial_estate: "\"Thực lòng mà nói,\" [notable.GetSheHe] nói, \"gia đình ta quá thường xuyên phải dùng bữa cùng những kẻ quê mùa vô danh ở [current_estate.GetName]... và xem ra bộ máy của ngài có thể tận dụng rất tốt những quan chức mang họ [notable.GetHouse.GetName].\""
  chariot_race.4020.a: "Ngài sẽ luôn được chào đón tại cung điện của ta!"
  chariot_race.4020.a.flavor: "Và tại [ROOT.Char.GetCapitalLocation.GetNameNoTooltip], mong rằng toàn bộ thân tộc của chúng ta luôn gắn bó khăng khít!"
  chariot_race.4020.a.success: "[notable.GetFirstNameNoTooltip] trở thành một tâm phúc quý giá"
  chariot_race.4020.a.failure: "[notable.GetFirstNameNoTooltip] trân trọng sự coi trọng của Ngài"
  chariot_race.4020.b: "Nào, nào! Một chức vụ xứng đáng đang chờ đợi!"

  noble_administrators_modifier: "Quan Lại Quý Tộc"
  noble_administrators_modifier_desc: "Những quý tộc có ảnh hưởng đã đến kinh đô của nhân vật này và đảm nhiệm các vị trí trọng yếu trong bộ máy hành chính."
  5_percent_governor_efficiency_tooltip: "[governor_efficiency|E]: @governor_efficiency!#positive_value +5%#!"

  chariot_race.4020.c: "Ta sẽ chuẩn bị cho ngài một dinh thự miền quê khang trang."
  chariot_race.4020.c.flavor: "[notable.GetTitledFirstNameNoTooltip] không cần phải sống ở đó toàn thời gian... nhưng #EMP nhất định#! phải ghi nhớ ân huệ này."
  chariot_race.4020.d: "Nhưng chính các #EMP thương nhân#! của [current_estate.GetNameNoTooltip] mới là điều chúng ta cần."
  chariot_race.4020.d.flavor: "Và điền trang của [notable.GetTitledFirstNamePossessiveNoTooltip] giao thương rất nhiều với họ..."
  mercantile_contacts_modifier: "Mối Quan Hệ Thương Nhân"
  mercantile_contacts_modifier_desc: "Một gia tộc quyền thế ở xa đã hướng các thương nhân địa phương đến những cơ hội làm ăn dồi dào tại đây."

  chariot_race.4030.t: "Đồ Giải Khát Ở Hippodrome"
  chariot_race.4030.desc: "Cuối cùng ta cũng tiếp cận được [seduce_interest.GetName]. [seduce_interest.GetSheHe|U] dường như đang ở trong tâm trạng tò mò.\n\n\"Ngài có tin được không, thưa [ROOT.Char.GetFirstName],\" [seduce_interest.GetFirstNameNoTooltip] xinh đẹp thì thầm, \"gái điếm của kinh đô — như cái [prostitute.GetWomanMan] kia — lại dắt những [ROOT.Char.GetWomenMen] quyền quý xuống dưới khán đài... và rồi...\"\n\n[seduce_interest.GetSheHe|U] đỏ bừng mặt.\n\n\"Thật không thể tưởng tượng nổi! Dưới đó hẳn như một thế giới khác: những giao dịch thì thầm trong cái nóng ngột ngạt, nơi ai cũng tái sinh thành kẻ xa lạ trong bóng tối...\""
  chariot_race.4030.desc_no_seduction: "Cuộc đua xe ngựa không phải là trò giải trí duy nhất trong ngày — không chỉ có những thứ ở đây để làm bùng cháy niềm đam mê của [ROOT.Char.GetWomenMen]. Khi tinh thần trở nên hưng phấn, những kỹ nữ lẻn qua đám đông và thực hiện nghề của mình.\n\nMột khuôn mặt trang điểm — một khuôn mặt đặc biệt xinh đẹp — mỉm cười mời gọi ta. Thật táo bạo khi [prostitute.GetHerHim] dám đến gần những nơi danh giá này! Nhưng ngay cả ở đây... ta có thể dễ dàng nắm lấy bàn tay của [prostitute.GetHerHis] trong tay ta, và đi theo cơ thể thơm tho của [prostitute.GetHerHis] đến một nơi kín đáo..."
  chariot_race.4030.a: "#EMP Hoặc#! ta có thể dụ một kẻ tò mò khác..."
  chariot_race.4030.a.flavor: "...và một khi [john.GetTitledFirstNameNoTooltip] đã có được niềm vui bẩn thỉu của [john.GetHerHis], ta sẽ để lại ngài biết một bí mật bẩn thỉu!"
  chariot_race.4030.a.success: "Ngài dẫn [john.GetFirstNameNoTooltip] vào bóng tối"
  chariot_race.4030.a.failure: "[john.GetFirstNameNoTooltip] công khai khiển trách Ngài"
  chariot_race.4030.b: "Hay là chúng ta tự mình xem thử, thưa [seduce_interest.GetLadyLord]...?"
  chariot_race.4030.b.flavor: "Ta #EMP rất#! sẵn lòng dẫn [seduce_interest.GetWomanMan] mộng mơ này đến một nơi vừa cấm kỵ vừa vô danh!"
  chariot_race.4030.b.success: "[seduce_interest.GetFirstNameNoTooltip] hiến dâng bản thân cho ngài"
  chariot_race.4030.b.failure: "[seduce_interest.GetFirstNameNoTooltip] vô cùng phẫn nộ và sốc"
  chariot_race.4030.c: "Nghe cũng thật... hấp dẫn..."
  chariot_race.4030.c.flavor: "Người ta bảo gái điếm ở [host.GetCapitalLocation.GetNameNoTooltip] điêu luyện hơn bất kỳ [prostitute.GetWomenMen] nào khác..."
  chariot_race.4030.d: "Ta chỉ xem tiếp cuộc đua thôi."

  chariot_race.4031.t: "Về Đích Đầu Tiên"
  chariot_race.4031.desc: "Những lối đi quanh co kéo dài bất tận, càng lúc càng hạ thấp, dẫn chúng ta đến một chuồng chim bỏ hoang. Khi bồ câu gù gù báo hiệu hòa bình, [besexed.GetTitledFirstName] và ta quấn lấy nhau.\n\nMọi thớ cơ căng cứng, ánh mắt luôn liếc về phía cửa, ta ôm chặt [besexed.GetHerHim] cho đến khi, cuối cùng, khoái cảm tràn ngập. Xa xa, đám đông gào thét.\n\n"
  chariot_race.4031.desc_seduced: "\"Thật trụy lạc,\" [besexed.GetFirstNameNoTooltip] rù rì, tận hưởng tưởng tượng nhơ bẩn của chúng ta. \"Ta có dám mơ rằng điều này có nghĩa là giờ ta đang phục vụ ngài, [ROOT.Char.Custom('FormOfAddressForLiege')] không?\""
  chariot_race.4031.desc_prostitute: "\"Ngài quả là hiếm có, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [besexed.GetFirstNameNoTooltip] rù rì, vẽ những vòng siết trên làn da trần của ta. \"Ta có dám mơ ngài sẽ còn tìm đến ta lần nữa không?\"" 
  chariot_race.4031.a: "Ta chắc chắn sẽ không để ngươi trốn thoát."
  chariot_race.4031.a.flavor: "Nhưng lần sau, hãy ở dưới chăn nệm!"
  chariot_race.4031.b: "Đúng là một dịp đặc biệt — những cuộc đua!"
  chariot_race.4031.b.flavor: "...một dịp độc nhất vô nhị, không để lại hệ quả lâu dài nào, phải không."

  chariot_race.4040.t: "Phe [ROOT.Char.Custom('GetChariotTeamColorPlural')], Đoàn Kết!"
  chariot_race.4040.desc: "\"#EMP [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]!\"#! tiếng hô vang từ phía dưới, ngày càng lớn khi thường dân mồ hôi nhễ nhại [common_fan.GetName] quỵ một gối trước [noble_fan.GetTitledFirstName] và ta.\n\n\"Thưa các bậc quý tộc,\" [common_fan.GetSheHe] nói, \"ngài là những người ủng hộ trung thành và vĩ đại nhất của phe [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] yêu dấu! Ngài có muốn hòa mình cùng chúng Ta — nâng chén bia đen với những đồng chí trung kiên không? Ta thề sẽ giữ đám trai tráng không đánh nhau hay ném đá!\"\n\n[noble_fan.GetFirstNameNoTooltip] và các quý tộc khác có vẻ đang vui vẻ, nhưng dù vậy... ý nghĩ về đám đông vẫn khiến mọi người rùng mình."
  chariot_race.4040.a: "Hmm... đám côn đồ trung thành này có vẻ hữu dụng..."
  chariot_race.4040.a.flavor: "Âm thầm bảo đảm sự trợ giúp của kẻ nịnh bợ này cùng băng đảng bạo lực của [common_fan.GetHerHis]."
  chariot_race.4040.discord_tt: "#high $sow_discord_intent$#! [intent|E] được tăng hiệu quả"
  chariot_race.4040.thugs_tt: "[intent|E] #high $murder_attendee_intent$#! của Ngài có khả năng thành công cao hơn"

  chariot_race.4040.b: "[ROOT.Char.GetCapitalLocation.GetNameNoTooltip] mới là nơi thuộc về những [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] chân chính!"
  chariot_race.4040.b.flavor: "Khuyến khích các thành viên của deme di cư đến một pháo đài tương lai của phe [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]."
  chariot_race.4040.b.success: "Deme gào vang tên Ngài"
  chariot_race.4040.b.failure: "Ngài không kích động được ai"
  chariot_race.4040.c: "Ta sẽ dẫn dắt một cuộc tập hợp hùng mạnh của #EMP toàn bộ#! phe [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]!"
  chariot_race.4040.c.flavor: "Và từ đó trở thành trung tâm của tinh thần đoàn kết ấy."
  chariot_race.4040.d: "Tốt hơn là chỉ ăn mừng cùng những [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] quyền quý..."
  chariot_race.4040.team_popularity_tt: "@influence_icon![influence|E] này dựa trên mức độ phổ biến của phe Ngài"
  chariot_race.4040.team_popularity_rally_tt: "Kết quả này bị ảnh hưởng bởi mức độ phổ biến của phe Ngài"


  powerful_loyal_deme_modifier: "Phe Deme Trung Thành Hùng Mạnh"
  powerful_loyal_deme_modifier_desc: "Phe đua xe thống lĩnh tại địa phương hết lòng tận tụy với vị quân chủ của mình, một người hâm mộ được công khai thừa nhận."
  sizable_loyal_deme_modifier: "Phe Deme Trung Thành Đáng Kể"
  sizable_loyal_deme_modifier_desc: "Một phe đua xe lớn hết lòng tận tụy với vị quân chủ của mình, một người hâm mộ được công khai thừa nhận."

  flourishing_local_deme_modifier: "Phe Deme Phát Triển Tại Địa Phương"
  flourishing_local_deme_modifier_desc: "Những người ủng hộ cuồng nhiệt của một phe đua xe đang tụ hội tại hạt này, khôi phục những truyền thống cũ về sự tham gia đời sống công dân."

  chariot_race.4050.t: "Rơi Xuống..."
  chariot_race.4050.desc.non_abrahamic: "[victim.Custom2('InsultAdjective', ROOT.Char)|U] [victim.Custom2('InsultNoun', ROOT.Char)] như [victim.GetSheHe] vốn là, thì [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] của ta xứng đáng phải rơi xuống... rơi xuống, rơi mãi...."
  chariot_race.4050.desc: "Như một thiên thần phản loạn, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] của ta xứng đáng phải rơi xuống... rơi xuống,"
  chariot_race.4050.desc.kathisma: "rơi từ lô ghế hoàng gia trên cao, đánh mất mọi niềm kiêu hãnh khi cơ thể vỡ nát của [victim.GetHerHis] nằm sõng soài giữa những tiếng la hét của đám đông thường dân.\n\nKhông khí tại Hippodrome ngày càng trở nên vui vẻ hơn, ngày càng mê mẩn với cuộc thi của nó. Với lính gác hoàng gia ở khắp nơi, không thể có khoảnh khắc hoàn hảo nào để ra tay với [victim.GetName], nhưng #EMP đây#! dường như là lúc thích hợp nhất."
  chariot_race.4050.desc.track: "rơi xuống lớp cát rực lửa, nơi bánh xe chiến xa sẽ nghiền nát xương cốt [victim.GetHerHis], nơi vó ngựa bọc sắt sẽ phá hủy gương mặt đáng nguyền rủa đó.\n\nCuộc đua trở nên dữ dội hơn, [victim.GetTitledFirstName] tiến sát hàng ghế phía trước, gần như nghiêng hẳn qua lan can khi [victim.GetSheHe] say mê cảnh tượng bên dưới."
  chariot_race.4050.desc.outro: "\n\nKẻ ngu ngốc ấy đã gần đến sự hủy diệt ghê tởm biết bao..."
  chariot_race.4050.desc.lackey: "Ta chỉ cần truyền lời cho tên tay sai trung thành [lackey.GetFirstName]."
  chariot_race.4050.a: "Đã đến lúc mật thám của ta khiến [victim.GetHerHim] lăn xuống..."
  chariot_race.4050.a.flavor: "[victim.GetFirstNameNoTooltip] sẽ tô điểm cho buổi trình diễn hôm nay bằng vẻ hào nhoáng của cái chết."
  chariot_race.4050.a.success: "[victim.GetFirstNameNoTooltip] gặp một cú ngã đầy bí ẩn"
  chariot_race.4050.a.failure: "Sát thủ của Ngài bị chặn lại"

  chariot_race.4050.b: "#EMP Ta#! sẽ ném con lợn này vào sự DIỆT VONG của [victim.GetHerHis]!"
  chariot_race.4050.b.flavor: "Ngài tóm lấy [victim.GetFirstNameNoTooltip] và #EMP rất#! công khai cố gắng ném cơ thể đáng ghét của [victim.GetHerHis] qua lan can."
  chariot_race.4050.b.success: "Ngài khiến [victim.GetFirstNameNoTooltip] rơi thẳng xuống"
  chariot_race.4050.b.failure: "[victim.GetFirstNameNoTooltip] chống cự lại Ngài"

  chariot_race.4050.might_die: "@death_icon! Ngài có thể bị giết"
  chariot_race.4050.might_be_imprisoned: "[host.GetShortUIName] có thể [imprison|E] Ngài"

  chariot_race.4050.c: "Quá công khai."

  chariot_race.4051.t: "Rơi Xuống Vực Sâu Vô Tận"

  chariot_race.4051.kathisma_attempt: "Một gia nhân bị ta lôi kéo: bị đẩy tới cái chết chắc chắn bằng lời hứa thưởng hậu. Sát thủ tiến vào [Glossary( 'kathisma', 'KATHISMA_GLOSS')]#!, mang theo đồ giải khát, và áp sát [victim.GetTitledFirstName].\n\n"
  chariot_race.4051.stands_attempt: "Quan sát từ xa, ta chỉ vừa đủ nhận ra cái đầu thô kệch của tên sát thủ lực lưỡng khi hắn len lỏi qua khán đài đông đúc tiến về phía [victim.GetTitledFirstName].\n\n"
  chariot_race.4051.self_attempt: "Lòng căm thù kiên định chi phối ta. Lao vào tấn công, ta chộp lấy quần áo của [victim.GetTitledFirstNamePossessive], ta gạt phăng sự kháng cự bàng hoàng của [victim.GetHerHis], và ta ném [victim.GetHerHim] về phía vực thẳm đầy nắng.\n\n"

  chariot_race.4051.agents_success: "Một tiếng kêu la lớn vang lên — [victim.GetFirstNameNoTooltip] bị nhấc bổng qua lan can và, với những lớp áo choàng lụa là bay trong gió, [victim.GetSheHe] rơi cắm đầu xuống! Giống như một con chim lòe loẹt bị bắn trúng, cơ thể của [victim.GetHerHis] rơi xuống đất."
  chariot_race.4051.agents_fail_secret: "Than ôi — khi mật thám của ta lao tới mục tiêu, những người hộ tống của [victim.GetFirstNamePossessive] lập tức xông vào! Trong cuộc giằng co tiếp theo, khá may mắn cho ta, tên sát thủ bị đâm chết.\n\n[victim.GetNameNoTooltip] đã biết rằng [victim.GetSheHe] không còn an toàn tại các cuộc đua này... nhưng [victim.GetSheHe] không biết nên nghi ngờ ai."
  chariot_race.4051.agents_fail_snitch: "Than ôi — khi mật thám của ta lao tới mục tiêu, những người hộ tống của [victim.GetFirstNamePossessive] lập tức xông vào! Tên sát thủ nhanh chóng bị khống chế. Rồi, trong khi chịu đựng những cú đá, giẫm đạp và đòn đánh vào hạ bộ, kẻ bất tài ấy #EMP đã khai ra tên ta!#!\n\nTa bắt đầu cảm thấy mình không còn được chào đón tại Trường Đua này..."
  chariot_race.4051.self_failed_survive_kathisma: "Nhưng nạn nhân của ta không dễ dàng rơi xuống. [victim.GetFirstNameNoTooltip] túm chặt áo choàng của ta; [victim.GetSheHe] giật tóc ta, kéo ta vào một cuộc vật lộn xấu xí. Cận vệ hoàng gia nhanh chóng khống chế ta.\n\nCao trên đám đông mênh mông, ta bị tra xiềng."
  chariot_race.4051.self_failed_survive: "Nhưng nạn nhân của ta không dễ dàng rơi xuống. [victim.GetFirstNameNoTooltip] túm chặt áo choàng của ta; [victim.GetSheHe] giật tóc ta, kéo ta vào một cuộc vật lộn xấu xí. Những người xung quanh nhanh chóng giữ lấy ta và đẩy ta trở lại bên cạnh cận vệ của mình.\n\nMột khoảnh khắc đối đầu đầy khó chịu trôi qua, rồi ta giận dữ bỏ đi."
  chariot_race.4051.self_failed_death: "Nhưng nạn nhân của ta không dễ dàng rơi xuống. Và — nhân danh [ROOT.Char.GetFaith.HighGodName] — đôi chân ta không còn sức lực! Ta gục xuống ghế của [victim.GetFirstNamePossessiveNoTooltip]. Máu tuôn ra từ vết dao đâm trên ngực ta.\n\n[victim.GetNameNoTooltip] đứng trên ta, dao găm trong tay, gào thét điên cuồng. Nhưng [ROOT.Char.GetFaith.DeathDeityName] đã gọi ta đi..."

  chariot_race.4051.success_death_stands: "\n\nKhán giả chen chúc quanh nơi va chạm, tin tức lan nhanh: [victim.GetNameNoTooltip] đã chết!"
  chariot_race.4051.success_death_track: "\n\nThời điểm không thể hoàn hảo hơn. Các chiến xa chao đảo né tránh chướng ngại mới, nhưng một [Glossary( 'quadriga', 'QUADRIGA_GLOSS')] vẫn tàn nhẫn cán qua thân thể co quắp của [victim.GetFirstNamePossessiveNoTooltip]. Rõ ràng ngay lập tức: [victim.GetNameNoTooltip] đã chết!"
  chariot_race.4051.success_infirm_stands: "\n\nKhán giả chen chúc quanh nơi va chạm, tin tức lan nhanh: [victim.GetNameNoTooltip] vẫn sống, nhưng chỉ vừa đủ!"
  chariot_race.4051.success_infirm_track: "\n\nNhững người phụ trách lao tới thân thể co quắp của [victim.GetFirstNamePossessiveNoTooltip] nằm trên cát. Tin tức lan ra: [victim.GetNameNoTooltip] vẫn sống, nhưng chỉ vừa đủ!"

  chariot_race.4051.a_triumph: "Một chiến thắng xứng đáng cho Trường Đua!"
  chariot_race.4051.a: "Một canh bạc tồi..."

######

  chariot_race.0400.t: "Phần Thưởng Cho Người Chiến Thắng"
  chariot_race.0400.desc_emperor: "Với tư cách hoàng đế, ta vinh dự trao tặng chiếc lá cọ truyền thống cho [activity.MakeScope.Var('first_place').Char.GetName] để ghi dấu chiến thắng của [activity.MakeScope.Var('first_place').Char.GetHerHis]. [activity.MakeScope.Var('second_place').Char.GetName] và [activity.MakeScope.Var('third_place').Char.GetName] lần lượt nhận lời khen ngợi, mỗi phần thưởng là minh chứng cho tài năng xuất chúng của họ trên đấu trường."
  chariot_race.0400.desc_spectators: "Khi [activity.MakeScope.Var('first_place').Char.GetName] được trao tặng chiếc lá cọ để kỷ niệm chiến thắng của [activity.MakeScope.Var('first_place').Char.GetHerHis], đám đông bùng nổ trong tiếng vỗ tay. [activity.MakeScope.Var('second_place').Char.GetName] và [activity.MakeScope.Var('third_place').Char.GetName] lần lượt nhận lời khen ngợi, mỗi phần thưởng là minh chứng cho tài năng xuất chúng của họ trên đấu trường."
  chariot_race.0400.a: "Một chiến thắng xứng đáng."

  chariot_race.0500.t: "Hạ Màn Đại Hội"
  chariot_race.0500.desc: "Khi Trường Đua còn vang vọng những tiếng reo hò dần lắng của đám [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')], ta dành một khoảnh khắc để suy ngẫm về những màn phô diễn kỹ năng và cạnh tranh rực rỡ làm nên văn hóa của chúng ta.\n\nVới kẻ chiến thắng là khải hoàn và vinh quang; với đám đông là niềm đam mê rực lửa. Trái tim của đế quốc vẫn tiếp tục đập với nhiệt huyết vô song."
  chariot_race.0500.a: "Hẹn lần sau."

  chariot_race.0600.t: "Chiến Thắng Thuộc Về [activity.MakeScope.Var('first_place').Char.Custom('GetChariotTeamColorPlural')]!"
  chariot_race.0600.intro: "Ba chiến xa đầu tiên lao qua vạch đích! Tiếng reo hò vang dội dành cho [activity.MakeScope.Var('first_place').Char.GetName], [activity.MakeScope.Var('second_place').Char.GetName], và [activity.MakeScope.Var('third_place').Char.GetName]. Một màn trình diễn tốc độ và kỹ năng ngoạn mục khép lại cuộc đua. Đám đông gầm vang, bị cuốn vào sự kinh ngạc, góp thêm những tràng tung hô long trời cho quang cảnh này.\n\n"
  chariot_race.0600.desc.won_team: "Khoản cược của ta vào [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] quả là đúng đắn!"
  chariot_race.0600.desc.won_individual: "Khoản cược của ta vào [ROOT.Var('wager_target').Char.GetFirstNameNoTooltip] quả là đúng đắn!"
  chariot_race.0600.desc.lost_team: "Khoản cược của ta vào [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] thật sai lầm..."
  chariot_race.0600.desc.lost_individual: "Khoản cược của ta vào [ROOT.Var('wager_target').Char.GetFirstNameNoTooltip] thật sai lầm..."
  chariot_race.0600.desc.dead: "Đáng tiếc thay, [ROOT.Var('wager_target').Char.GetFirst] đã không sống sót để cán đích."
  chariot_race.0600.desc.bookmaker: "\n\n[GetCourtPositionType('bookmaker_court_position').GetName()] của ta, [bookmaker.GetFirstName], đã thu về một khoản kha khá từ việc cá cược. Đế quốc giàu có hơn [ROOT.Var('gold_gained_emperor').GetValue|V0] vàng. Tất nhiên, [bookmaker.GetFirstNameNoTooltip] đã lấy đi phần cắt mười phần trăm theo thông lệ của [bookmaker.GetHerHis]."
  chariot_race.0600.desc.bookmaker.no_money: "\n\n[GetCourtPositionType('bookmaker_court_position').GetName()] của ta, [bookmaker.GetFirstName], báo cáo rằng có số lượng cược thắng chưa từng có... và vì vậy, lợi nhuận dành cho đế quốc là rất ít ỏi."
  chariot_race.0600.a.individual: ""Lái xe xuất sắc lắm, [ROOT.Var('wager_target').Char.GetFirstNameNoTooltip]!""
  chariot_race.0600.a.team: ""Làm tốt lắm, [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]#EMP !#!""
  chariot_race.0600.a.lost: "Chúc may mắn lần sau..."
  chariot_race.0600.a.dead: "Một thảm kịch khủng khiếp..."

  chariot_race_betting_char_outcome_key_title: "Cược Thành Công"
  chariot_race_betting_char_outcome_key: "[CHARACTER.GetShortUIName|U] đã đặt cược thành công rằng [CHARACTER.MakeScope.Var('wager_target').GetCharacter.GetShortUIName|U] sẽ [CHARACTER.Custom('GetWinPlaceShow')]\n\n"

  chariot_race_betting_team_outcome_key_title: "$chariot_race_betting_char_outcome_key_title$"
  chariot_race_betting_team_outcome_key: "[CHARACTER.GetShortUIName|U] đã đặt cược thành công rằng ít nhất một người trong số [CHARACTER.Custom('GetChariotTeamColorPluralGlossed')] sẽ [CHARACTER.Custom('GetWinPlaceShow')]\n\n"

  chariot_race_lost_bet_tt: "Ngài đã mất @gold_icon! #N [THIS.Var('wager_value').GetValue]#!"

## ACTIVITY LOG
  discredit_claimant_speech_success_log_title: "Diễn văn Đế chế Lên án Kẻ Tranh ngôi"
  discredit_claimant_speech_success_log: "Giữa những tiếng la ó khinh miệt, [CHARACTER.GetShortUIName] mở màn cuộc đua bằng cách xé nát triển vọng trị vì của [TARGET_CHARACTER.GetShortUINamePossessive]."
  discredit_claimant_speech_fail_log_title: "Diễn văn Đế chế Bị Kẻ Tranh ngôi Lấn át"
  discredit_claimant_speech_fail_log: "Trong nỗ lực yếu ớt nhằm làm mất tính chính danh của [TARGET_CHARACTER.GetShortUIName], [CHARACTER.GetShortUIName] đã mở màn cuộc đua bằng một màn bẽ mặt thảm hại."

  sway_speech_log_title: "Diễn văn Đế chế Tôn vinh Khách quý"
  sway_speech_log: "[CHARACTER.GetShortUIName|U] mở màn cuộc đua bằng việc công khai ban tặng danh dự và lời ca ngợi lên [TARGET_CHARACTER.GetShortUIName]."

  seduce_speech_log_title: "Diễn văn Đế chế Thi vị"
