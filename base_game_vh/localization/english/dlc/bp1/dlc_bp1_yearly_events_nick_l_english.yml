l_english:

  bp1_yearly.5001.t:0 "Kinh Hoàng Trong Đêm"
  bp1_yearly.5001.desc:0 "Tại sao ta lại tỉnh giấc? Trong trạng thái mơ màng, bộ não còn ngái ngủ của ta lướt qua một danh sách kiểm tra trong đầu. Đêm nay lạnh nhưng không đến mức đóng băng, chiếc giường của ta vẫn ấm áp và dễ chịu, và-\n\nCó một bóng người đang đứng ở cuối giường ta. Khi nó tiến lại gần, hình dáng ấy dần hiện rõ thành [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] của ta, [sibling_murderer.GetFirstName]. Ta mở miệng định nói rằng phòng của [sibling_murderer.GetHerHis] thực ra nằm ngay kế bên phòng ta, thì ta chợt nhận ra chiếc gối trong tay [sibling_murderer.GetHerHis].\n\nChỉ nhờ vào ánh sáng nhợt nhạt của mặt trăng, ta mới có thể nhìn thấy tia nhìn điên loạn, mất trí và khát máu trong đôi mắt [sibling_murderer.GetHerHis]."
  bp1_yearly.5001.a:0 "Ta sẽ #bold giết #!ngươi vì tội phản nghịch này!"
  bp1_yearly.5001.b:0 "Không! Ta sẽ không để ngươi làm vậy!"
  bp1_yearly.5001.c:0 "CỨU VỚI!"
  bp1_yearly.5001.win.tt:0 "Cuộc đối đầu có kết cục tốt"
  bp1_yearly.5001.lose.tt:0 "Cuộc đối đầu diễn ra không suôn sẻ"
  bp1_yearly.5001.shout.tt:0 "Ngài kêu cứu, hy vọng sẽ có người nghe thấy"
  bp1_yearly.5001.kill.tt:0 "Ngài khống chế được [sibling_murderer.GetHerHim]"
  bp1_yearly.5001.die.tt:0 "Ngài thất bại trong cuộc giằng co"

  bp1_yearly.5002.t:0 "$bp1_yearly.5001.t$: Tham Vọng Bị Dập Tắt"
  bp1_yearly.5002.desc:0 "[sibling_murderer.GetFirstName] lao vào ta ngay khi [sibling_murderer.GetSheHe] thấy ta cử động, nhưng cơn adrenaline bất ngờ dâng trào đã tiếp thêm sức mạnh cho ta. [sibling_murderer.GetFirstNameNoTooltip] bị chặn lại giữa giường, khi nắm đấm của ta đấm thẳng vào hàm [sibling_murderer.GetHerHim].\n\n[sibling_murderer.GetSheHe|U] loạng choạng lùi lại một cách vô lực, và những cú đánh mất phương hướng liên tiếp sau đó cũng không thể ngăn ta vật [sibling_murderer.GetHerHim] xuống đất. Ngồi đè chắc chắn lên ngực [sibling_murderer.GetHerHis], một cú đánh dữ dội làm gãy mũi [sibling_murderer.GetFirstNamePossessiveNoTooltip] và khiến đầu [sibling_murderer.GetHerHis] va mạnh xuống nền đá, biến sự chống cự đầy giận dữ của [sibling_murderer.GetHerHis] thành những tiếng rên rỉ thảm hại.\n\nChính trong tư thế này, [guard.GetFirstName] — may mắn thay đã nhanh chóng nhận ra tình hình — tìm thấy ta. [sibling_murderer.GetFirstNameNoTooltip] nhìn chằm chằm xuống đất với vẻ ủ rũ khi ta giải thích chuyện đã xảy ra."
  bp1_yearly.5002.a:0 "Chính [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] của ta. Sao ngươi #EMP có thể #!làm vậy?"

  bp1_yearly.5003.t:0 "$bp1_yearly.5001.t$: Remus"
  bp1_yearly.5003.desc:0 "Ta đang nằm nghỉ, nửa thân trên để trần, cô độc và không hề phòng bị. [sibling_murderer.GetFirstNameNoTooltip] đã ở trên người ta trước khi ta kịp hoàn toàn nhận thức được sự kinh hoàng và phản bội này. Khống chế một cánh tay của ta bằng chân [sibling_murderer.GetHerHis], [sibling_murderer.GetSheHe] ép chiếc gối lên mặt ta bằng bàn tay còn lại, trong khi tay kia giữ lấy cổ tay đang vùng vẫy của ta.\n\nCơn đau dữ dội cùng sự hoảng loạn ập đến khiến ta gần như không thể phản kháng. Khi ta dần mất đi khả năng chống cự, [sibling_murderer.GetSheHe] chuyển sự chú ý đến ta một lần nữa.\n\n"Ngai vàng là #EMP của ta!#!" [sibling_murderer.GetSheHe] rít lên, trong khi tầm nhìn của ta dần mờ đi."
  bp1_yearly.5003.a:0 "[sibling_murderer.GetFirstNameNoTooltip]! #DIE1 K-không…#! #DIE2 [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)]...#!"

  bp1_yearly.5004.t:0 "$bp1_yearly.5001.t$: Cánh Tay Phải [guard.GetWomanMan|U]"
  bp1_yearly.5004.desc:0 "[sibling_murderer.GetFirstName] lao tới, thu hẹp khoảng cách giữa [sibling_murderer.GetHerHim] và đầu giường ta chỉ trong chớp mắt, nhưng đã quá muộn. Tiếng kêu cứu của ta đã bật ra khỏi cổ họng trước cả khi [sibling_murderer.GetSheHe] kịp cử động, và ngay cả khi chiếc gối dập tắt âm thanh đó thì tiếng bước chân dồn dập đang tiến đến đã vang lên rõ ràng."
  bp1_yearly.5004.guard.death:0 "\n\nCánh cửa bật mở và, thật may mắn, [guard.GetFirstName] đứng đó. [guard.GetSheHe|U] hít mạnh và vừa quay đi hét lên thì lập tức im bặt khi [sibling_murderer.Custom2('RelationToMeShort', ROOT.Char)] của ta rít lên tên [guard.GetHerHis]. Ta chỉ biết lắng nghe trong nỗi kinh hoàng dâng cao khi [sibling_murderer.GetFirstNameNoTooltip] nhanh chóng đổi chác sự im lặng và lòng trung thành của [guard.GetFirstNamePossessiveNoTooltip].\n\nNhững làn sóng hoảng loạn dâng trào trong lồng ngực ta khi tiếng bước chân lại vang lên, kết thúc bằng tiếng chốt cửa khép lại — tiếng #EMP click #!ghê rợn."
  bp1_yearly.5004.guard.save:0 "\n\nCánh cửa bật mở, và ở đó, thật may mắn thay, [guard.GetFirstName] đang đứng. [guard.GetSheHe|U] hốt hoảng thở dốc rồi hét gọi ra phía sau qua vai [guard.GetHerHis], xuyên qua cánh cửa đang mở. Chỉ vài khoảnh khắc sau, hai người lính canh xông vào, nhấc kẻ định sát hại ta khỏi [sibling_murderer.GetHersHis] chân và kéo hắn ra xa khỏi ta.\n\nVề phần [sibling_murderer.GetHersHis], [sibling_murderer.GetFirstNameNoTooltip] chỉ ủ rũ nhìn xuống sàn, không thể hoặc không muốn cố gắng phủ nhận hành động của [sibling_murderer.GetHerHis]."
  bp1_yearly.5004.parent.save:0 "\n\nCánh cửa bật mở, và đứng trong khung cửa là [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)] của ta, [sibling_parent.GetFirstName]. Chỉ mất một giây để [sibling_parent.GetHerHim] nhận ra chuyện gì đang xảy ra, và [sibling_parent.GetSheHe] gầm lên gọi người giúp đỡ trong khi dùng chính sức mình hất [sibling_murderer.GetFirstNameNoTooltip] khỏi người ta xuống đất.\n\nKhi [sibling_parent.GetSheHe] ôm lấy đầu ta trong vòng tay [sibling_parent.GetHerHis], nỗ lực chạy trốn về phía cửa của [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] ta bị chặn lại bởi sự xuất hiện của [guard.GetFirstName], người đã tóm lấy [sibling_murderer.GetHerHim] và ném [sibling_murderer.GetHerHim] trở lại căn phòng."
  bp1_yearly.5004.parent.death:0 "\n\nCánh cửa bật mở, và đứng trong khung cửa là [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)] của ta, [sibling_parent.GetFirstName]. Sự nhẹ nhõm ban đầu của ta dần biến thành nỗi kinh hoàng lạnh lẽo, đen tối khi ta nhìn thấy nụ cười cong lên trên môi của [ROOT.Char.Custom2('RelationToMePossessive', sibling_parent)] cùng đôi mắt nheo lại đầy ác ý, sự kết hợp đó khiến dạ dày ta quặn lại.\n\n[sibling_parent.GetSheHe|U] quay đi và chậm rãi bước ra hành lang như thể [sibling_parent.GetSheHe] chẳng hề quan tâm đến bất cứ điều gì, kéo chốt cửa lại phía sau [sibling_parent.GetHerHim].\n\n#EMP “Cạch.”#!"

  bp1_yearly.5005.t:0 "Nỗi Kinh Hoàng Ban Đêm: Khát Vọng Quyền Lực"

  bp1_yearly.5006.t:0 "$bp1_yearly.5001.t$: Một Tình Yêu [ROOT.Char.Custom2('RelationToMePossessive', sibling_parent)|U]"
  bp1_yearly.5006.a:0 "[ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U]! Người đã cứu ta!"

  bp1_yearly.5007.t:0 "$bp1_yearly.5001.t$: Khuynh Hướng Giết Con"
  bp1_yearly.5007.a:0 "#DIE1 [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U]!#! #DIE2 ...làm ơn!#!"

  bp1_yearly.5008.t:0 "$bp1_yearly.5001.t$: Romulus"
  bp1_yearly.5008.desc:0 "[sibling_murderer.GetFirstName] rất nhanh nhẹn, nhưng ngay lập tức ta nhận ra rằng [sibling_murderer.GetSheHe] đã đánh giá thấp ta một cách chí mạng. [sibling_murderer.GetSheHe|U] lao qua căn phòng, nhưng ta đã rời khỏi giường và đang di chuyển từ trước, còn đà lao tới của [sibling_murderer.GetFirstNamePossessiveNoTooltip] lại phản bội [sibling_murderer.GetHerHim] khi [sibling_murderer.GetSheHe] vấp phải một phiến đá lát sàn không bằng phẳng và ngã nhào xuống đất.\n\nTa bước tới, chân ta chặn lấy [sibling_murderer.GetHerHim] khi [sibling_murderer.GetSheHe] đang cố gắng chống người đứng dậy bằng đầu gối, khiến đầu [sibling_murderer.GetHerHis] đập mạnh vào tường với một tiếng động ghê rợn. Cú vung tay mù quáng tiếp theo của [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] ta vừa hoang dại vừa chệch hướng, và ta tận dụng cơ hội đó để với lấy chiếc bàn nhỏ bên cạnh.\n\n[sibling_murderer.GetFirstNameNoTooltip] quay phắt lại và phát hiện một con dao nhỏ nhưng sắc bén đến đáng sợ đang kề bên cổ [sibling_murderer.GetHerHis]. Lần đầu tiên, ta có thể nhìn thấy nỗi sợ hãi thực sự trong đôi mắt [sibling_murderer.GetHerHis]."
  bp1_yearly.5008.a:0 "Sẽ không ai tìm thấy thi thể của ngươi đâu, [sibling_murderer.GetFirstNameNoTooltip]."
  bp1_yearly.5008.b:0 "Đừng bao giờ vượt qua ranh giới của ta nữa. Hiểu chứ?"

  bp1_yearly.5601.t:0 "Cuộc Sống Rực Rỡ Sắc Màu"
  bp1_yearly.5601.start:1 "Thật là một ngày tuyệt vời! Gió thì mát lành, mặt trời thì ấm áp, côn trùng vui vẻ rả rích trong những bụi cây thấp. Mọi thứ dường như tươi sáng và sống động hơn hẳn, và tất cả là vì cái tên [bp1_yearly_5601_dead_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_5601_dead_nemesis.Custom2('InsultNoun', ROOT.Char)] [bp1_yearly_5601_dead_nemesis.GetFirstName] đó cuối cùng cũng đã, thật phước lành thay, chết rồi!\n\nTa không thể kìm được nụ cười khi một đoàn [bp1_yearly_5601_dead_nemesis.GetHerHis] Bạn Bè và gia đình lặng lẽ đi ngang qua ta, trên đường đến nói lời vĩnh biệt cuối cùng."
  bp1_yearly.5601.bodysnatcher:1 "Dù giờ đây [bp1_yearly_5601_dead_nemesis.GetSheHe] không thể thốt ra một lời nào để ngăn cản họ, ta vẫn cảm thấy bực bội khi nghĩ đến việc gia đình của [bp1_yearly_5601_dead_nemesis.GetFirstNamePossessiveNoTooltip] lại dám cả gan ngầm bảo vệ danh dự của [bp1_yearly_5601_dead_nemesis.GetHerHis].\n\nĐoàn người lặng lẽ đi ngang qua ta, hướng về nơi chôn cất thi thể."
  bp1_yearly.5601.notinsane:0 "Những ánh mắt cau có ta nhận lại từ những người chịu tang chỉ khiến nụ cười của ta càng rộng hơn. Ta quay đi rời khỏi đó, và đôi mắt của một cậu bé ăn xin mở to chẳng kém gì nụ cười nhếch mép của ta khi ta vui vẻ tung cho nó một đồng xu có giá trị đủ để cả gia đình nó ăn no trong nhiều tuần."
  bp1_yearly.5601.a:0 "Ta sẽ cho bọn chúng thấy!"
  bp1_yearly.5601.a.tt:0 "Ngươi chờ đến khi màn đêm buông xuống, rồi lên đường cùng một chiếc xẻng..."
  bp1_yearly.5601.b:0 "Đây là ngày tuyệt vời nhất đời ta!"
  bp1_yearly.5601.c:0 "Đã đến lúc bước tiếp."

  bp1_yearly.5602.t:0 "Vươn Lên Trong Cuộc Sống"
  bp1_yearly.5602.desc:0 "Không khí đêm tĩnh lặng và đứng im. Âm thanh duy nhất có thể nghe thấy là tiếng chiếc xẻng của ta cào vào đất, dễ dàng hất tung lớp đất mới đắp. Chậm rãi, đống đất bên cạnh ngôi mộ ngày càng lớn dần, và thi thể của [bp1_yearly_5601_dead_nemesis.GetFirstName] lại một lần nữa lộ ra trước làn không khí tươi mới mà nó mới chỉ rời xa không lâu.\n\nTa giật phăng tấm vải che khỏi khuôn mặt [bp1_yearly_5601_dead_nemesis.GetHerHis]. Đôi môi [bp1_yearly_5601_dead_nemesis.GetHerHis|U] hé mở trong một nụ cười co giật, và đất bùn cùng bụi bẩn vẫn còn bám ẩm ướt trên cổ [bp1_yearly_5601_dead_nemesis.GetHerHis] khi ta thờ ơ quan sát [bp1_yearly_5601_dead_nemesis.GetHerHim].\n\nNắm chặt chiếc xẻng một lần nữa, ta căn chỉnh nó ngay trên chính cái cổ đó. Lưỡi kim loại, được chính tay ta mài sắc từ sớm hôm nay, bén đến mức chết người. Một cú giậm, hai cú giậm, ba..."
  bp1_yearly.5602.a:0 "Cuối cùng thì ngươi cũng sẽ trở nên hữu dụng."
  bp1_yearly.5602.b:0 "[ROOT.Char.GetFaith.HighGodName] đã có linh hồn ngươi. Lũ lợn sẽ có cái đầu của ngươi!"

  bp1_yearly.5701.t:0 "Ra Ngoài Vui Chơi Chứ?"
  bp1_yearly.5701.desc:0 "Ta chắc rằng mối quan hệ giữa [married_friend.GetFirstNamePossessive] với người phối ngẫu của [married_friend.GetHerHis], [friend_spouse.GetFirstName], là một mối quan hệ rất hạnh phúc và hiệu quả, nhưng dạo gần đây [married_friend.GetSheHe] ngày càng có ít thời gian dành cho ta, một người Bạn Thân thiết, khi mối quan hệ của họ ngày càng sâu đậm. Mỗi lần ta cố rủ [married_friend.GetHerHim] ra ngoài dù chỉ là đi dạo đơn giản, [married_friend.GetSheHe] dường như luôn bị trói buộc bởi nghĩa vụ hôn nhân.\n\nTa nhớ những ngày xưa tốt đẹp khi chúng ta sẽ"
  bp1_yearly.5701.desc.ladsladslads:0 "la cà khắp nơi, uống loại [ROOT.Char.Custom('RegionalDrink')] hảo hạng nhất cho đến khi nôn thốc nôn tháo, rồi lại tiếp tục y như vậy vào đêm hôm sau!"
  bp1_yearly.5701.desc.nodrinky:0 "có một đêm tuyệt vời khi ngồi xem lũ say rượu địa phương ngã lên ngã xuống và tự làm mình bẽ mặt!"
  bp1_yearly.5701.desc.ending:0 "\n\nNhững khoảng thời gian tuyệt vời biết bao! Giá như cái tên đáng ghét kia, [friend_spouse.Custom2('InsultAdjective', ROOT.Char)] [friend_spouse.GetFirstNameNoTooltip], không ngăn cản chúng ta có lại điều đó..."
  bp1_yearly.5701.a:0 "[friend_spouse.GetSheHe|U] sẽ không thể chia cắt chúng ta lâu hơn nữa!"
  bp1_yearly.5701.b:0 "Có lẽ ta có thể khiến họ nhận ra sai lầm của mình..."
  bp1_yearly.5701.c:0 "Có lẽ cả hai chúng ta đều đã bước tiếp?"
  bp1_yearly.5701.tt.critical_success:0 "Mối quan hệ bị phá vỡ không thể hàn gắn"
  bp1_yearly.5701.tt.success:0 "Một rạn nứt được tạo ra giữa họ"
  bp1_yearly.5701.tt.failure:0 "Cả hai đều không hài lòng với ngươi"
  bp1_yearly.5701.tt.critical_failure:0 "Ngươi đã đi quá xa"

  bp1_yearly.5702.t:0 "Màn Trình Diễn Bậc Thầy"
  bp1_yearly.5702.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('skilful_friend'))] của ta, [skilful_friend.GetFirstName], thật sự vô cùng tài năng!\n\n"
  bp1_yearly.5702.diplomacy:0 "Khi [skilful_friend.GetSheHe] lên tiếng, mọi người đều chăm chú lắng nghe từng lời [skilful_friend.GetHerHis]. Cái lưỡi lanh lợi của [skilful_friend.GetHerHis|U] biến lời nói thành mật ngọt đến mức ngay cả những kẻ hoài nghi và cáu kỉnh nhất cũng không thể không bị quyến rũ. Ta thực sự tin rằng [skilful_friend.GetSheHe] có thể bán gỗ cho cả một khu rừng!"
  bp1_yearly.5702.martial:0 "Khả năng chiến thuật đồ sộ trong đầu óc [skilful_friend.GetHerHis] đủ để khiến những vị chỉ huy xuất sắc nhất thế giới phải xấu hổ. Với năng lực gần như bẩm sinh trong việc nhận diện và khai thác điểm yếu trên chiến trường, [skilful_friend.GetFirstNameNoTooltip] là một tài sản khổng lồ đối với bất kỳ [ROOT.Char.GetLadyLord] nào hiểu rõ tầm quan trọng của chiến tranh."
  bp1_yearly.5702.stewardship:0 "Nói rằng [skilful_friend.GetSheHe] có đầu óc về tiền bạc thôi thì vẫn còn quá nhẹ. Khi [skilful_friend.GetSheHe] phụ trách các vấn đề tài chính, không một đồng xu nào có thể thoát khỏi tầm mắt [skilful_friend.GetHerHis], tạo ra thứ phép màu thực sự trong việc cân đối sổ sách."
  bp1_yearly.5702.intrigue:0 "Trong số tất cả những người mà ta ghét phải coi là kẻ thù, [skilful_friend.GetFirstNameNoTooltip] chắc chắn nằm gần đầu danh sách. Một bậc thầy thao túng và mưu sĩ xuất chúng, kỹ năng của [skilful_friend.GetHerHis] vừa thuần thục trong việc trộm một món ngọt từ cô hầu bếp, vừa tinh vi trong việc đặt nền móng cho sự sụp đổ của cả các triều đại."
  bp1_yearly.5702.learning:0 "Trí tuệ học giả của [skilful_friend.GetHerHis|U] thực sự mênh mông, và hiếm ai sánh kịp trong [ROOT.Char.Custom('GetCourt')] của ta. Ngay cả lúc này, ta vẫn có thể nghe thấy [skilful_friend.GetHerHim] ở một [ROOT.Char.Custom('GetRoom')] khác, thao thao bất tuyệt về một chủ đề obscure với tất cả kỹ năng và sự dễ dàng của một bậc thầy thủ công [skilful_friend.GetWomanMan] có hàng chục năm kinh nghiệm."
  bp1_yearly.5702.prowess:0 "Nổi danh khắp vùng đất này như một chiến binh thực sự xuất chúng, tài năng kiếm thuật của [skilful_friend.GetHerHis] không ai có thể nghi ngờ. Chứng kiến cách [skilful_friend.GetSheHe] tấn công một hình nộm luyện tập trong sân với toàn bộ sức mạnh và sự uyển chuyển của một bậc thầy đích thực cũng đủ khiến ngay cả những đấu sĩ xảo quyệt nhất phải khiếp sợ."
  bp1_yearly.5702.fallback:0 "FALLBACK"
  bp1_yearly.5702.ending:0 "\n\nCó lẽ ta có thể nhờ [skilful_friend.GetHerHim] chỉ cho ta vài mẹo và bí quyết trong lĩnh vực đó?"
  bp1_yearly.5702.a:0 "Dạy ta đi, [skilful_friend.GetFirstNameNoTooltip]!"
  bp1_yearly.5702.a.tt.success:0 "[skilful_friend.GetFirstNameNoTooltip] dạy ngươi con đường của [skilful_friend.GetHerHis]"
  bp1_yearly.5702.a.tt.neutral:0 "Ngươi không học được gì hữu ích, nhưng vẫn cảm ơn [skilful_friend.GetFirstNameNoTooltip] vì nỗ lực đó"
  bp1_yearly.5702.a.tt.failure:0 "Ngươi vụng về đến mức [skilful_friend.GetFirstNameNoTooltip] bỏ cuộc trong thất vọng"
  bp1_yearly.5702.b:0 "Ta nghĩ ta giỏi chẳng kém họ!"
  bp1_yearly.5702.b.tt.success:0 "Ngươi thắng cuộc thi"
  bp1_yearly.5702.b.tt.failure:0 "Ngươi thua cuộc thi"
  bp1_yearly.5702.c:0 "Ta sẽ không bao giờ đạt đến trình độ của [skilful_friend.GetHerHis]!"

  bp1_yearly.5703.t:0 "Những Ngài Giường Kỳ Lạ"
  bp1_yearly.5703.desc:0 "Ta ngả lưng, thở dốc và đẫm mồ hôi. [rival_lover.GetFirstName], chiến lợi phẩm xác thịt của ta trong đêm nay, nằm dài lười biếng bên cạnh. Ai có thể ngờ rằng những kẻ thù cay đắng như vậy lại có thể trở thành những người tình… #EMP hòa hợp#! đến thế?\n\n“Nhắm mắt lại đi.” [rival_lover.GetFirstNameNoTooltip] tinh nghịch nói, một nụ cười chơi đùa nơi khóe môi [rival_lover.GetHerHis]. Ta chiều theo, hai tay đặt phía trên đầu khi đắm mình trong dư âm sau cuộc ái ân. Đột nhiên, cảm giác làn thép lạnh của còng tay siết quanh cổ tay khiến ta bật mở mắt, chỉ để thấy người tình của mình đang trèo về phía chiếc bàn đầu giường.\n\n“Ta đã chờ đợi khoảnh khắc này rất, rất lâu rồi.” [rival_lover.GetSheHe] rít lên. Ánh trăng lóe sáng trên lưỡi dao."
  bp1_yearly.5703.a:0 "KHÔNG! Làm ơn, để ta nói!"
  bp1_yearly.5703.a.tt.success:0 "Ngươi thuyết phục được [rival_lover.GetHerHim]"
  bp1_yearly.5703.a.tt.failure:0 "[rival_lover.GetFirstNameNoTooltip] làm ngươi bị thương"
  bp1_yearly.5703.a.tt.criticalfailure:0 "[rival_lover.GetSheHe|U] không hề nương tay"
  bp1_yearly.5703.b:0 "Đợi đã! Ngươi không muốn thêm nữa sao?"
  bp1_yearly.5703.b.tt.success:0 "Sức quyến rũ của ngươi cứu mạng ngươi"
  bp1_yearly.5703.b.tt.failure:0 "Ngươi không giỏi trên giường đến vậy"
  bp1_yearly.5703.c:0 "Để ta cho ngươi thấy vì sao đó là một ý tưởng tồi..."

  bp1_yearly.5704.t:0 "Dễ Thương Khi [seduced_rival.GetSheHe|U] Tức Giận"
  bp1_yearly.5704.desc:0 "[seduced_rival.GetFirstName] lại đang ở trong [ROOT.Char.GetChamber] của ta một lần nữa, liên tục lải nhải những điều vô nghĩa về việc ta đã làm tổn thương [seduced_rival.GetHerHim] như thế nào. Đôi mắt [seduced_rival.GetHerHis|U] bừng bừng giận dữ khi [seduced_rival.GetSheHe] một lần nữa nguyền rủa tên ta, và cơn nóng giận của [seduced_rival.GetHerHis] chỉ càng dâng cao hơn khi ta khinh thường gạt bỏ sự tức giận của [seduced_rival.GetHerHis] bằng một cái lắc đầu đầy chế giễu.\n\nKhi [seduced_rival.GetSheHe] tiếp tục trách móc ta, trong khi ta cũng đáp trả bằng những lời mỉa mai, ta bất chợt nhận ra mình lại đang nhìn vào đôi mắt của [seduced_rival.GetHerHis]. Ta vừa thoát khỏi khoảnh khắc mơ màng ngắn ngủi đó thì ánh mắt lại vô thức trượt xuống đường nét quai hàm của [seduced_rival.GetHerHis], nơi đang căng lên đầy ấn tượng vì cơn thịnh nộ. Trong lúc vô thức nhìn chằm chằm, ta nhận ra lồng ngực [seduced_rival.GetHerHis] phập phồng đầy cuốn hút khi [seduced_rival.GetSheHe] tiếp tục lời chỉ trích của mình, và-\n\nTa đã #EMP tự#! đẩy mình vào chuyện gì thế này?"
  bp1_yearly.5704.a:0 "Hy vọng chúng ta sẽ còn #EMP gặp nhau #!nhiều hơn nữa, [seduced_rival.GetFirstNameNoTooltip]."
  bp1_yearly.5704.b:0 "Thật là nực cười!"

  bp1_yearly.5705.t:0 "[lover_rival.GetSheHe|U] Không Đáng!"
  bp1_yearly.5705.desc:0 "Có lẽ dạo gần đây ta đã quá tự mãn chăng? Chắc chắn đó là điều đã khiến [concerned_friend.GetFirstName] bị đẩy đến hành động đầy bực bội.  Bạn củata đã chặn ta lại và đối chất về mối quan hệ… phức tạp của ta với [lover_rival.GetFirstName].\n\n\"Ngươi thật sự quá lố bịch rồi!\" [concerned_friend.GetSheHe] nói thẳng thừng. Rõ ràng khó chịu trước dáng vẻ mơ màng sau ân ái của ta, [concerned_friend.GetSheHe] đưa tay ra và chọc mạnh ngón tay duỗi thẳng vào ngực ta. \"Ngươi #EMP biết #!chẳng có điều gì tốt đẹp sẽ đến từ chuyện này cả! Ngươi đang tự đẩy mình vào một cú ngã đau đớn, và ngươi biết rõ điều đó!\""
  bp1_yearly.5705.a:0 "Nhưng mà… ngươi đã #EMP thấy #![lover_rival.GetHerHim] chưa?!"
  bp1_yearly.5705.a.tt:0 "Lựa chọn này khả dụng nhờ sức hấp dẫn nổi bật của [lover_rival.GetFirstNamePossessiveNoTooltip]."
  bp1_yearly.5705.b:0 "Ngươi đơn giản là không hiểu mối quan hệ của chúng ta!"
  bp1_yearly.5705.c:0 "Ta biết rồi, ta biết rồi. Ngươi nói đúng."

  bp1_yearly.5706.t:0 "Tội Lỗi Của [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]"
  bp1_yearly.5706.desc:0 "Khi ta đi dạo khắp [meeting_county.GetProvince.GetCounty.GetName], ta bắt gặp [rival_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] đang vội vã tiến về phía mình. Gần đây, chúng ta đã cay nghiệt đấu khẩu với nhau bất cứ khi nào có cơ hội. Vì vậy ta chờ đợi [rival_parent.GetHerHim] sẽ phun ra vài lời nhảm nhí thối tha, nhưng [rival_parent.GetFirstNameNoTooltip] lại lặng lẽ lướt qua.\n\nChỉ lúc đó ta mới nhận ra có người đi theo sau [rival_parent.GetFirstNamePossessiveNoTooltip]: [rival_parent.GetHerHis] [rival_child.Custom('GetDaughterSon')], [rival_child.GetFirstName]. [rival_child.GetSheHe|U] mỉm cười với ta cùng một cái nhướn mày lẳng lơ thoáng qua, trước khi vội vàng đuổi theo [rival_child.GetHerHis] [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))].\n\nTa nhìn hai người họ khuất dần. Chuyện đó là sao nhỉ...?"
  bp1_yearly.5706.a:0 "Sẽ là thô lỗ nếu không đáp lại tương xứng..."
  bp1_yearly.5706.a.tt:0 "Âm mưu Quyến Rũ sẽ có tỷ lệ thành công tăng cao"
  bp1_yearly.5706.b:0 "Ta sẽ không chạm vào huyết thống của thứ rác rưởi đó!"

  bp1_yearly.5707.t:0 "Tội Lỗi Của [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]: Bắt Quả Tang"
  bp1_yearly.5707.start:0 "Ta nghe rất rõ tiếng bước chân dồn dập ngay cả trong cơn đam mê, và gương mặt ta tự nhiên cong lên thành một nụ cười đắc thắng\n\n[rival_parent.GetFirstName|U] xông thẳng vào [ROOT.Char.Custom('GetRoom')], và vẻ kinh hoàng trên gương mặt [rival_parent.GetHerHis] thì thật sự tuyệt mỹ. [rival_child.GetFirstName],"
  bp1_yearly.5707.child_dislike:0 "khiến ta ngạc nhiên, [rival_child.GetSheHe] cũng nở một nụ cười rộng chẳng kém gì ta khi nhìn thấy [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_child'))] [rival_child.GetHerHis] là [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]. [rival_child.GetSheHe|U] thậm chí còn vòng tay ôm lấy ta, kéo ta lại gần hơn.\n\n"Có lẽ giờ ngươi sẽ coi ta nghiêm túc hơn rồi, #EMP [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]#!!""
  bp1_yearly.5707.child_deviant:0 "trái với mong đợi của ta, lại cười rộng chẳng kém gì ta khi [rival_child.GetSheHe] nhìn thấy [rival_child.GetHerHis] [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]. [rival_child.GetSheHe|U] khiến ta còn bất ngờ hơn nữa khi, với một động tác phô trương, [rival_child.GetSheHe] hất tung tấm chăn và phơi bày cả hai chúng ta!\n\n\"Ta có thể cám dỗ ngươi #EMP tham gia cùng bọn ta,#! [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]?\""
  bp1_yearly.5707.child_like:0 "kêu lên một tiếng, cuống cuồng kéo chăn che đi sự kín đáo của [rival_child.GetHerHis].\n\nNhững lời giải thích bị đòi hỏi, những cáo buộc bị ném ra, khi cha mẹ và con cái gào thét phía trên thân thể đã thỏa mãn và kiệt sức của ta."
  bp1_yearly.5707.a:0 "Ha! Ha! Bắt được ngươi rồi, đồ khốn!"
  bp1_yearly.5707.a.deviant:0 "Chuyện quái quỷ gì đang xảy ra thế này nhân danh [ROOT.Char.GetFaith.HighGodNamePossessive]?!"
  bp1_yearly.5707.a.doubledeviant:0 "...thế thì sao, [rival_parent.GetFirstNameNoTooltip]?"
  bp1_yearly.5707.b:0 "Làm ơn đi, [rival_child.GetFirstNameNoTooltip] và ta yêu nhau!"
  bp1_yearly.5707.c:0 "Ngươi đã nuôi dạy con cái rất tốt đấy, [rival_parent.GetFirstNameNoTooltip]!"

  bp1_yearly.5740.t:0 "Cuống Cuồng Tìm Câu Trả Lời"
  bp1_yearly.5740.desc:0 "Ta lơ mơ tỉnh dậy trong tiếng chim hót líu lo, ánh nắng ban mai lốm đốm tràn ngập [ROOT.Char.Custom('GetChamber')] của ta. Ta ngáp dài, vươn vai rồi nằm xuống lại, đắm mình trong hơi ấm. Chỉ sau vài khoảnh khắc trôi qua, ta mới nhận ra có điều gì đó không ổn.\n\nNằm ngay bên cạnh ta, yên vị trên chiếc gối chẳng khác gì ta trong chăn, là một vật thể thực sự bí ẩn.\n\nMột vật cỡ trung bình, màu trắng ngà, hoàn toàn tầm thường…\n\nMột quả trứng."
  bp1_yearly.5740.a:0 "Cái… cái #EMP ý nghĩa#! của chuyện này là gì?"
  bp1_yearly.5740.a.tt:0 "Ta phải tìm ra thủ phạm!"
  bp1_yearly.5740.b:0 "Thật kỳ lạ. Thôi kệ."
  bp1_yearly.5740.c:0 "Ai đã làm chuyện này? Chúng ở đâu?! #EMP VỆ BINH!#!"

  bp1_yearly.5741.t:0 "$bp1_yearly.5740.t$: Trứng Chần"
  bp1_yearly.5741.desc:0 "Điểm đến đầu tiên của ta là nhà bếp, nơi đám gia nhân tất bật quanh các bàn khi họ chuẩn bị thức ăn. Ta thậm chí còn bị xua đi khỏi vài đống thực phẩm, địa vị [ROOT.Char.GetLadyLord] của ta hoàn toàn chẳng gây được ấn tượng gì với các đầu bếp đang bận rộn.\n\nCuối cùng ta cũng tìm thấy thứ mình cần: một đống trứng gần như đã được sắp xếp xong! Mỗi quả đều được đặt khít trong một hõm rơm nhỏ bên trong một thùng gỗ lớn mở nắp, xếp thành từng hàng mười quả. Mười, nhân mười, nhân mười, nhân… tám.\n\n#EMP Hai#! quả trứng đã biến mất!"
  bp1_yearly.5741.a:0 "Lại thêm một quả nữa à?! Ta sẽ lột da thủ phạm #EMP sống sượng!#!"
  bp1_yearly.5741.a.tt:0 "Sẽ không bỏ sót bất kỳ manh mối nào!"
  bp1_yearly.5741.b:0 "Dù là ai thì cũng có quyền ra vào nhà bếp! Bí ẩn đã được giải đáp!"



  bp1_yearly.5742.t:0 "$bp1_yearly.5740.t$: Bị quấy phá!"
  bp1_yearly.5742.desc:0 "Vội vã lao xuống cầu thang dẫn tới hầm rượu, Ta cho phép bản thân hít một hơi bầu không khí ẩm thấp, mát lạnh nơi đây. Hết kệ này đến kệ khác chất đầy thức ăn và đồ uống, và trái ngược hoàn toàn với sự náo nhiệt của căn bếp phía trên, tầng hầm này hoàn toàn vắng bóng người. Tựa tay vào một chiếc kệ thấp, Ta cố gắng trấn tĩnh và sắp xếp lại suy nghĩ. Kẻ đã đặt quả trứng đó hẳn phải có quyền ra vào phòng riêng của ta, và cả nhà bếp, và…\n\nDòng suy nghĩ bỗng chững lại. Bàn tay Ta, vô thức thò vào túi áo, bỗng đông cứng. Những ngón tay run rẩy, không tin nổi, kéo vật thể mà chúng chạm phải ra khỏi quần áo.\n\nVật đó cứng. Âm ấm. #EMP Hình bầu dục.#!"
  bp1_yearly.5742.a:0 "Sao có thể?! SAO CƠ?!"
  bp1_yearly.5742.b:0 "Thật may mắn! #EMP Hai#! quả trứng miễn phí!"

  bp1_yearly.5743.t:0 "$bp1_yearly.5740.t$: Ấp ủ kế hoạch"
  bp1_yearly.5743.desc:0 "Như trong cơn mê, Ta phá cửa xông vào đại sảnh xét xử, đôi mắt hoang dại. Chư hầu và gia quyến của Ta đứng thành hàng trước mặt, đặc biệt là [egg_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] và [egg_friend.Custom2('MyCharacterIntroduction', ROOT.Char)], những người lộ rõ vẻ kinh hoàng.\n\n\"Trứng! HAI quả trứng!\" Ta gào lên, giơ cao vật thể bầu dục vô hại trước mặt họ. \"Là ai?! Ai đã làm chuyện này?! Ta sẽ ném kẻ đó xuống biển!\"\n\nMột vài tiếng cười khúc khích, căng thẳng và bối rối vang lên. Ta giơ tay thật cao và, với một tiếng gầm incoherent đầy phẫn nộ, ném thẳng vật đáng nguyền rủa đó xuống sàn. Những tiếng cười lập tức chết lặng."
  bp1_yearly.5743.a:0 "[egg_spouse.GetFirstNameNoTooltip]! Thú nhận ngay lập tức!"
  bp1_yearly.5743.a.tt.success:0 "Ngài đã chỉ đúng kẻ tình nghi"
  bp1_yearly.5743.a.tt.failure:0 "Phán đoán của Ngài là sai"
  bp1_yearly.5743.a.tt.outcome:0 "Tỷ lệ thành công"
  bp1_yearly.5743.b:0 "[egg_friend.GetFirstNameNoTooltip]! Đồ [egg_friend.Custom2('InsultNoun', ROOT.Char)]!"
  bp1_yearly.5743.c:0 "Không ai trong các ngươi là không đáng nghi! #EMP Không ai cả!#!"
  bp1_yearly.5743.c.tt.success:0 "Ngài đã chỉ đúng... tất cả"
  bp1_yearly.5743.c.tt:0 "Toàn bộ cận thần"

  bp1_yearly.5744.t:0 "$bp1_yearly.5740.t$: Gục ngã"
  bp1_yearly.5744.start:0 "Sự giận dữ trong lời buộc tội của Ta khiến cáo buộc mang sức nặng đáng kể, nhưng khi thời gian trôi qua, vẻ bối rối trên "
  bp1_yearly.5744.spouse:0 "gương mặt của [egg_spouse.GetFirstNamePossessive]"
  bp1_yearly.5744.friend:0 "gương mặt của [egg_friend.GetFirstNamePossessive]"
  bp1_yearly.5744.crowd:0 "mọi gương mặt trong đám đông"
  bp1_yearly.5744.end:0 "vẫn không hề dao động. Ta cố bước thêm một bước nữa, nhưng toàn thân chùn xuống và bắt đầu đổ gục.\n\nKhoảnh khắc tiếp theo, Ta đã nằm ngửa, một vòng những gương mặt lo lắng bao quanh tầm nhìn, một chiếc khăn thấm nước mát đang nhẹ nhàng chấm lên thái dương Ta.\n\n\"Không, không, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]! Người cần nghỉ ngơi. Chúng Ta cũng sẽ gọi người hầu tới giúp người lau sạch.\" Những lời nói rời rạc vang lên đúng lúc tay Ta chạm vào má, vô tình quệt phải lòng đỏ của quả trứng vỡ mà Ta đã ngã trúng."
  bp1_yearly.5744.a:0 "…đầu ta đau quá."
  bp1_yearly.5744.b:0 "Ta sẽ tìm ra thủ phạm! Chỉ là… không phải bây giờ."

  bp1_yearly.5745.t:0 "$bp1_yearly.5740.t$: Trò bẩn thỉu"
  bp1_yearly.5745.desc:0 "Một ngày làm việc vất vả xứng đáng được đền đáp bằng giấc nghỉ ngon lành! Chiếc giường của Ta, rộng lớn và êm ái, được soi sáng bởi ánh lửa bập bùng, những ngọn lửa tí tách tạo nên các bóng hình nhảy múa trên tường. Ta biết ơn trượt người vào vòng tay ấm áp ấy, kéo chăn phủ lên thân thể mệt mỏi và gối đầu xuống chiếc gối.\n\nVà rồi Ta nhìn thấy nó. Chỉ cách Ta chưa đến một sải tay, nằm hoàn hảo trên một chiếc gối của riêng nó, được chiếu sáng bởi ánh lửa lấp lánh từ lò sưởi.\n\nMột quả trứng."
  bp1_yearly.5745.a:0 "#DIE2 …không. …không,#! #DIE1 không, không, không,#! #EMP khôôôông!#!"
  bp1_yearly.5745.b:0 "Là do [egg_spouse.GetFirstNamePossessiveNoTooltip] làm, ta chắc chắn như vậy."
  bp1_yearly.5745.c:0 "Chắc chắn là do [egg_friend.GetFirstNamePossessiveNoTooltip] gây ra!"
  bp1_yearly.5745.d:0 "Ta từ chối tiếp tục dính líu đến mấy trò nhảm nhí này!"
