l_english:
  bp1_yearly.4000.t:0 "Một Khoảnh Khắc Gia Đình"
  bp1_yearly.4000.desc:0 "Ta nhớ ngày hôm ấy khi [family_memory.GetDescription], [family_memory_participant.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_memory_participant'))] của ta!\n\n"
  bp1_yearly.4000.desc.alive:0 "Những ký ức như thế này mang lại cho ta sự an ủi. Dù chuyện gì xảy ra, ta biết gia đình luôn ở bên ta, và Gia tộc [ROOT.Char.GetHouse.GetName] vẫn vững mạnh."
  bp1_yearly.4000.desc.dead:0 "Ước gì ngươi vẫn còn ở đây. Còn biết bao tiếng cười nữa, bao điều bất đồng cần hóa giải, bao ký ức cần được tạo nên... Gia tộc [ROOT.Char.GetHouse.GetName] kém đi vì thiếu vắng ngươi."
  bp1_yearly.4000.desc_end:0 "\n\n#EMP \"[ROOT.Char.GetHouse.GetMotto].\"#! ta thì thầm."
  bp1_yearly.4000.a:0 "Giá như ngươi ở đây để cùng ta nói điều đó..."
  bp1_yearly.4000.b:0 "Ta sẽ trân trọng ký ức này!"
  bp1_yearly.4000.c:0 "Ta sẽ tôn vinh ký ức của ngươi bằng một bài thơ!"
  bp1_yearly.4000.c.success:0 "Gia đình trân trọng cử chỉ này"
  bp1_yearly.4000.c.failure:0 "Ngươi gục ngã trong nỗi buồn"
  bp1_yearly.4000.d:0 "[family_memory_participant.GetFirstNameNoTooltip] xứng đáng nhận quà vì sự trung thành của [family_memory_participant.GetHerHis]!"
  bp1_yearly.4000.family_first:0 "Cầu cho Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] trường tồn mãi mãi!"
  bp1_yearly.4001.desc:0 "Khi những người thân cận tụ họp, ta bắt đầu ngâm:\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\n"
  bp1_yearly.4001.desc.success_poem:0 "Nước mắt lăn dài trên má những người có mặt. Ta nghĩ mình đã làm tròn việc tưởng nhớ ngươi, [family_memory_participant.GetFirstNameNoTooltip]."
  bp1_yearly.4001.desc.fail_poem:0 "...bài này không hay lắm, phải không?"
  bp1_yearly.4001.a:0 "Cầu mong ngươi yên nghỉ."
  bp1_yearly.4001.b:0 "Ta đã làm ô danh ký ức của ngươi!"
  bp1_yearly.4010.t:0 "Người Giám Hộ Tốt Hơn"
  bp1_yearly.4010.desc:0 "\"[ROOT.Char.GetWifeHusband] thân mến, ta lo lắng cho việc giáo dục của [child_to_change_guardian.Custom('GetDaughterSon')] [child_to_change_guardian.GetFirstNamePossessive] của chúng ta.\" [parent_that_want_guardian_change.GetWifeHusband] của ta, [parent_that_want_guardian_change.GetFirstName], nói với giọng đầy lo âu.\n\n"
  bp1_yearly.4010.desc.root:0 "\"Sự thật là... chàng/nàng đơn giản là #EMP quá bận#! để nuôi dạy [child_to_change_guardian.GetHerHim].\" "
  bp1_yearly.4010.desc.other:0 "\"Tên [current_guardian.Custom2('InsultNoun', SCOPE.sC('parent_that_want_guardian_change'))] [current_guardian.GetFirstName] đó không phải người giám hộ tốt. [current_guardian.GetSheHe|U] đơn giản là quá... #EMP [current_guardian.Custom2('InsultAdjective', SCOPE.sC('parent_that_want_guardian_change'))]!#!\" "
  bp1_yearly.4010.desc_end:0 "Con [child_to_change_guardian.Custom('GetDaughterSon')] của chúng ta cần một người giám hộ tận tâm, như [proposed_guardian.Custom('ComplimentAdjective')] [child_to_change_guardian.Custom2('RelationToMeShort', SCOPE.sC('proposed_guardian'))] [proposed_guardian.GetFirstName]!\" [parent_that_want_guardian_change.GetSheHe|U] nói tiếp.\n\n\"Ta sắp xếp nhé?\" [parent_that_want_guardian_change.GetSheHe|U] hỏi, nhìn ta đầy hy vọng."
  bp1_yearly.4010.a:0 "Tất nhiên rồi. [proposed_guardian.GetFirstNameNoTooltip] là lựa chọn tốt hơn."
  bp1_yearly.4010.a_effect:0 "[child_to_change_guardian.GetFirstNamePossessive] tiến triển [education|E]"
  bp1_yearly.4010.b:0 "Ta chọn [current_guardian.GetFirstNameNoTooltip] là có lý do, [parent_that_want_guardian_change.GetWomanMan]!"
  bp1_yearly.4010.b_alt:0 "Hừ! Ta vẫn đủ thời gian nuôi dạy [child_to_change_guardian.GetHerHim]!"
  bp1_yearly.4010.c:0 "Quyết định của ta là đúng, tin ta đi!"
  bp1_yearly.4010.c_effect:0 "[child_to_change_guardian.GetFirstNamePossessive] tiến triển [education|E] vượt bậc"
  bp1_yearly.4020.t:0 "Tình bạn Thi Ca"
  bp1_yearly.4020.desc:1 "\"[ROOT.Char.GetFirstNameNoTooltip], người bạn thân mến của ta, ta lại một lần nữa nhớ đến chiến thắng của ngài trước [war_memory_participant.GetTitledFirstName] — vì vậy ta quyết định viết một bài thơ về chiến công vĩ đại ấy!\" [poetry_friend.GetFirstName] nói, rồi hắng giọng:\n\n[poetry_artifact.GetName]\n[poetry_artifact.GetDesc]"
  bp1_yearly.4020.a:0 "Ta sẽ cho đọc trước [ROOT.Char.Custom('GetCourt')]!"
  bp1_yearly.4020.b:0 "Cảm ơn Ngài, ta sẽ giữ bài thơ này bên mình."
  bp1_yearly.4020.c:0 "Ha! Ta sẽ gửi bản sao cho tất cả những ai [war_memory_participant.GetFirstNameNoTooltip] quen biết!"
  bp1_yearly.4020.d:0 "Quá lời rồi, chỉ [ROOT.Char.GetFaith.HighGodName] mới xứng đáng được ca ngợi như thế."
  bp1_yearly.4020.poetry:0 "[poetry_friend.Custom('GeneratePoem_Intro_Rhyming')]\n[poetry_friend.Custom('GeneratePoem_Outro_Rhyming')]"
  bp1_yearly.4020.poetry_title:0 "[poetry_friend.Custom('GeneratePoem_Title')]"
  artifact_poetry_name:0 "$bp1_yearly.4020.poetry_title$"
  artifact_poetry_description:1 "Một tác phẩm thơ ca dành tặng chiến thắng của [ROOT.Char.GetTitledFirstNamePossessive] trước tên [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [war_memory_participant.GetTitledFirstName], do người Bạn Thân [poetry_friend.GetTitledFirstName] của [ROOT.Char.GetFirstNamePossessiveNoTooltip] sáng tác.\n\n$bp1_yearly.4020.poetry$"
  poetry_artifact_appended_desc:0 "Một tác phẩm thơ ca dành tặng chiến thắng của [ROOT.Char.GetTitledFirstNamePossessive] trước tên [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [war_memory_participant.GetTitledFirstName], do người Bạn Thân [poetry_friend.GetTitledFirstName] của [ROOT.Char.GetFirstNamePossessiveNoTooltip] sáng tác.\n\nNội dung:\n$artifact_poetry_description$"
  bp1_yearly.4020.a_effect:0 "[newly_created_artifact.GetName] trở thành [court_artifact|E] và nhận bổ trợ [grandeur|E]"
  bp1_yearly.4020.b_effect:0 "Ngươi nhận được [artifact|E] [newly_created_artifact.GetName]"
  bp1_yearly.4030.t:0 "Kẻ Đối Địch Quyến Rũ"
  bp1_yearly.4030.desc:0 "\"[ROOT.Char.Custom('CulturalCurse')|U]!\" Ta hét lên khi đọc lá thư.\n\nTên [marriage_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marriage_rival'))] của ta, [marriage_rival.GetFirstName] — ta khinh bỉ cái tên đó!"
  bp1_yearly.4030.desc_bond_broken:0 "\n\nKhông chỉ dùng mưu mẹo và sự quyến rũ để thuyết phục chư hầu của ta, [marriage_vassal.GetTitledFirstName], kết hôn với ngươi và phá vỡ mối ràng buộc giữa [marriage_vassal.GetHerHis] với [spurned_partner.GetFirstName] — không, chưa hết — ngươi còn khiến [marriage_vassal.GetTitledFirstNameNoTooltip] quay lưng chống lại ta!"
  bp1_yearly.4030.desc_no_broken_bonds:0 "\n\nKhông chỉ dùng mưu mô và quyến rũ để khiến chư hầu [marriage_vassal.GetTitledFirstName] cưới ngươi — không — ngươi còn khiến [marriage_vassal.GetTitledFirstNameNoTooltip] chống lại ta!"
  bp1_yearly.4030.desc_end:0 "\n\nCái lưỡi độc địa của ngươi đang gieo rắc dối trá về ta... Ngươi không yêu [marriage_vassal.GetFirstNameNoTooltip], ngươi chỉ muốn ta #EMP đau khổ!#!"
  bp1_yearly.4030.a:0 "Ta phải khiến [marriage_vassal.GetFirstNameNoTooltip] thấy rõ sự phản trắc của [marriage_rival.GetFirstNameNoTooltip]!"
  bp1_yearly.4030.b:0 "[marriage_vassal.GetSheHe|U] đã phá vỡ mối ràng buộc của [marriage_vassal.GetHerHis] ư? [ROOT.Char.GetFaith.PriestNeuterPlural] sẽ giáng lửa xuống [marriage_vassal.GetHerHim] vì chuyện đó!"
  bp1_yearly.4030.c:0 "Có lẽ [spurned_partner.GetFirstNameNoTooltip] sẽ hữu dụng..."
  bp1_yearly.4030.d:0 "Hừ! Tên [marriage_rival.Custom2('InsultNoun', ROOT.Char)] đó chẳng làm được gì!"
  distrustful:0 "Đa Nghi"
  bp1_yearly.4030.a.success:0 "[marriage_vassal.GetTitledFirstName] bị thuyết phục và hối lỗi"
  bp1_yearly.4030.a.failure:0 "[marriage_vassal.GetTitledFirstName] cho rằng ngươi đang nói dối"
  bp1_yearly.4030.b.success:0 "[marriage_vassal.GetTitledFirstName] nhận ra sai lầm trong hành động của [marriage_vassal.GetHerHis]."
  bp1_yearly.4030.b.failure:0 "[marriage_vassal.GetTitledFirstName] bác bỏ lập luận của các [ROOT.Char.GetFaith.PriestNeuterPlural]"
  bp1_yearly.4040.t:0 "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] Hiền Từ Của Ta"
  bp1_yearly.4040.desc.intro.1:0 "\"Ôi, [ROOT.Char.GetFirstNameNoTooltip] yêu dấu — ta thương con lắm!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] nói, bưng đĩa đầy món ngon. \"Ta làm cho con ít [ROOT.Char.Custom('FavoriteTreatDemand')], món con thích nhất mà!\"\n\nỒ, [kindly_grandmother.GetSheHe] hiểu ta quá rõ! Dù việc tự tay làm có phần không xứng tầm [kindly_grandmother.GetHerHis], nhưng... sao ta nỡ từ chối?"
  bp1_yearly.4040.desc.intro.2:0 "\"Thêm [ROOT.Char.Custom('FavoriteTreatDemand')] cho [ROOT.Char.Custom('GirlBoy')] to lớn của ta nào!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] gọi vọng từ bếp. \"Ăn đi, ăn đi!\"\n\nMmm, mùi thật tuyệt... thêm một miếng nữa chắc không sao?"
  bp1_yearly.4040.desc.feeding.1:0 "\"[ROOT.Char.GetFirstNameNoTooltip], việc ngài thưởng thức [ROOT.Char.Custom('FavoriteTreatDemand')] yêu thích của ta khiến ta trở thành [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] hạnh phúc nhất trên đời!\" [kindly_grandmother.GetFirstName] vui vẻ hét lên từ nhà bếp. \"Hôm nay ta đã làm một mẻ #EMP cực kỳ#! lớn! Ăn hết đi nào!\"\n\n#flatulence Uurr..!#! Ôi, chuyện này không bao giờ dừng lại... Nhưng ta đâu thể từ chối và làm tổn thương [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] đáng kính của ta, phải không?"
  bp1_yearly.4040.desc.feeding.2:0 "\"Ta nặn cái này giống [ROOT.Char.Custom('GetLivestockFowlIndef')]!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] hát lên, bưng thêm một đĩa [ROOT.Char.Custom('FavoriteTreatDemand')]. \"Nhìn kìa, nó bay thẳng vào miệng con đó!\"\n\nLạy [ROOT.Char.GetFaith.HighGodName], nhiều quá rồi! Nhưng... ta phải nghĩ cho cảm xúc của [kindly_grandmother.GetHerHis]..."
  bp1_yearly.4040.desc.feeding.3:0 "\"[ROOT.Char.GetFirstNameNoTooltip], ngài đâu rồi? Ta đã luộc mẻ [ROOT.Char.Custom('FavoriteTreatDemand')] này trong bơ rồi đấy!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] thì thầm, ánh mắt [kindly_grandmother.GetHerHis] lùng sục khắp căn bếp để tìm ta.\n\nChuyện này đang vượt quá tầm kiểm soát rồi... #EMP Ta phải làm gì đây!?#!"
  bp1_yearly.4040.desc.feeding.4:0 "\"Ai mà biết được [ROOT.Char.Custom('FavoriteTreatDemand')] lại hợp với [ROOT.Char.Custom('GetExpensiveMeal')] đến vậy chứ — tất nhiên là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] yêu quý của ngài biết rồi!\" [kindly_grandmother.GetFirstName] hét lên, mang theo một đĩa thức ăn kinh khủng nhất mà ta từng thấy trong đời. \"Bữa tối sẵn sàng rồi, [ROOT.Char.GetFirstNameNoTooltip]!\"\n\nDù ta có trốn kỹ đến đâu, [kindly_grandmother.GetSheHe] vẫn luôn tìm thấy ta! Ôi, cơ thể tội nghiệp, căng phồng của ta!"
  bp1_yearly.4040.a:0 "Con rất muốn ăn [ROOT.Char.Custom('FavoriteTreatDemand')] của người!"
  bp1_yearly.4040.b:0 "Thôi ạ, con ổn rồi."
  bp1_yearly.4040.c:0 "Thêm một miếng nữa chắc không sao..."
  bp1_yearly.4040.d:0 "Con ăn đủ rồi."
  bp1_yearly.4040.e:0 "Con không thể làm tổn thương #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U]#!..."
  bp1_yearly.4040.f:0 "Con #EMP không thể#! ăn thêm miếng nào nữa!"
  bp1_yearly.4040.desc.dead:0 "Ôi, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] yêu dấu, người đi rồi thì những đĩa [ROOT.Char.Custom('FavoriteTreatDemand')] vô tận cũng chấm dứt, nhưng cảm giác nhẹ nhõm lại đượm buồn — con thà có người bên cạnh còn hơn là mất người mãi mãi.\n\nVĩnh biệt, [kindly_grandmother.GetFirstName], cầu mong người yên nghỉ."
  bp1_yearly.4040.dead:0 "Có lẽ con sẽ ăn chút [ROOT.Char.Custom('FavoriteTreatDemand')] để tưởng nhớ người."
  bp1_yearly.4040.family_first:0 "Ôi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))], con chỉ muốn ngồi nói chuyện một chút thôi!"
 #XXX: "XXX"
 
