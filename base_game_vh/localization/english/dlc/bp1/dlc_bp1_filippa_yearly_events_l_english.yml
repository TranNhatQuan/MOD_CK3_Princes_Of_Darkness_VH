  bp1_yearly_2070_zealous_modifier:0 "Đức Tin Dẫn Lối Khác"
  bp1_yearly_2070_zealous_modifier_desc:0 "Đôi khi, một đấng tối cao có những an bài khác cho chúng ta và người Ngài tâm giao."
  bp1_yearly_2070_cynicism_modifier:0 "Vì Điều Tốt Đẹp Hơn"
