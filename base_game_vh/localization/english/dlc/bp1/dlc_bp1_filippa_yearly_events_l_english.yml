l_english:
 #A spouse/consort attempts to influence you into changing your heir
  bp1_yearly.2020.t:0 "Kỳ Vọng Lớn Lao"
  bp1_yearly.2020.desc:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] tiến đến chỗ ta với một nụ cười thân thiện. \"Tình yêu của ta! Ngài có thấy [bp1_yearly_2020_child_to_become_heir.GetFirstName] của chúng ta đang trở nên oai phong đến nhường nào không? [bp1_yearly_2020_child_to_become_heir.GetSheHe|U] gần như có thể cai trị đất nước này chỉ bằng một tay mà không gặp chút khó khăn nào; và ta thề trước [bp1_yearly_2020_influencing_partner.GetFaith.HighGodNameAlternate] rằng [bp1_yearly_2020_child_to_become_heir.GetSheHe] sẽ khiến ngài vô cùng tự hào.\"\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] liếc nhìn ta đầy ẩn ý. \"Dĩ nhiên, nếu có #EMP bất cứ điều gì#! ta có thể làm để khiến ý tưởng này trở nên hấp dẫn hơn... ta chắc chắn rằng ngài sẽ cho ta biết, và chúng ta có thể đi đến một thỏa thuận nào đó, người [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)] đáng kính của ta.\" Một nụ cười đầy mỉa mai vẫn còn vương trên đôi môi của [bp1_yearly_2020_influencing_partner.GetHerHis].\n\n#EMP Bất cứ điều gì#!, nàng nói vậy sao?"
  bp1_yearly.2020.a:0 "Mang cái đầu của tên [bp1_yearly_2020_target.Custom('InsultAdjectiveGeneric')] [bp1_yearly_2020_target.GetFirstNamePossessiveNoTooltip] đó đặt lên khay cho ta."
  bp1_yearly.2020.b:0 "Ta #EMP thực sự#! quan tâm đến những cận thần #EMP hữu dụng#! hơn."
  bp1_yearly.2020.b_tt:1 "[bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip] sẽ đề xuất cho Ngài một nhóm cận thần có kỹ năng."
  bp1_yearly.2020.c:0 "Ngân khố của ta #EMP đang#! trống rỗng."
  bp1_yearly.2020.c_tt_only_hook:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] đưa ra một mối ràng buộc đối với [bp1_yearly_2020_influencing_partner.GetHerHis] [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_only_hook') )] [bp1_yearly_2020_influencing_partners_parent_only_hook.GetTitledFirstName]."
  bp1_yearly.2020.c_tt_halfsies:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] được tài trợ một nửa và sẽ đưa ra một mối ràng buộc với [bp1_yearly_2020_influencing_partner.GetHerHis] [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_halfsies') )] [bp1_yearly_2020_influencing_partners_parent_halfsies.GetTitledFirstName]."
  bp1_yearly.2020.c_tt_pay_and_hook:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] được tài trợ hoàn toàn và sẽ đưa ra một mối ràng buộc với [bp1_yearly_2020_influencing_partner.GetHerHis] [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_pays') )] [bp1_yearly_2020_influencing_partners_parent_pays.GetTitledFirstName]."
  bp1_yearly.2020.d:0 "Chuyện này #EMP quá#! đáng ngờ. Lính đâu!"
  bp1_yearly.2020.d_tt:0 "Ai biết được [bp1_yearly_2020_influencing_partner.GetSheHe] còn đang âm mưu điều gì nữa!"
  bp1_yearly.2020.e:1 "Ta không cần gì từ ngươi cả, [bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip]."
 #Spouse brings up a bunch of skilled people for you to recruit
  bp1_yearly.2021.t:0 "Nhân Vật Được Trọng Dụng"
  bp1_yearly.2021.desc:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] lại tìm đến ta một lần nữa. \"[bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)|U]! Ta mang đến tin tốt đây!\" [bp1_yearly_2020_influencing_partner.GetSheHe|U] vội vàng tiến đến bên cạnh ta, đồng thời mở ra một tờ giấy mềm với những nét chữ nguệch ngoạc trên đó. \"Những người tài giỏi này sẽ vô cùng vui mừng được đến làm việc cho ngài, tại triều đình của chúng ta!\"\n\nTa liếc nhìn tờ giấy. Quả thật là một danh sách kỹ năng đáng nể, ta phải công nhận điều đó với [bp1_yearly_2020_influencing_partner.GetHerHim]!"
  bp1_yearly.2021.a:0 "Chiến binh này toát lên một loại #EMP uy quyền#! đặc biệt."
  bp1_yearly.2021.a_tt:0 "[bp1_yearly_2021_martial_person.GetShortUIName|U] gia nhập triều đình của Ngài"
  bp1_yearly.2021.b:0 "Một học giả chắc chắn sẽ mang lại lợi ích cho triều đình."
  bp1_yearly.2021.b_tt:0 "[bp1_yearly_2021_learning_person.GetShortUIName|U] gia nhập triều đình của Ngài"
  bp1_yearly.2021.c:0 "Kỹ năng tài chính của người này thật sự vượt trội!"
  bp1_yearly.2021.c_tt:0 "[bp1_yearly_2021_stewardship_person.GetShortUIName|U] gia nhập triều đình của Ngài"
  bp1_yearly.2021.d:0 "Ngoại giao có vẻ là lựa chọn khôn ngoan."
  bp1_yearly.2021.d_tt:0 "[bp1_yearly_2021_diplomacy_person.GetShortUIName|U] gia nhập triều đình của Ngài"
  bp1_yearly.2021.e:0 "Một ứng viên #EMP đầy#! thú vị!"
  bp1_yearly.2021.e_tt:0 "[bp1_yearly_2021_intrigue_person.GetShortUIName|U] gia nhập triều đình của Ngài"
  bp1_yearly.2021.f:0 "Ta đổi ý rồi."
 #Letter event - Spouse is captured or killed by your rival
  bp1_yearly.2022.t:0 "[bp1_yearly_2020_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
  bp1_yearly.2022.desc_intro:0 "[bp1_yearly_2020_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
  bp1_yearly.2022.desc_imprisoned:0 "\n\nTa đang giam giữ một kẻ khẳng định rằng ngươi không liên quan đến vụ #EMP ám sát#! nhằm vào ta của [bp1_yearly_2020_influencing_partner.GetHerHis]. Ta không hề tin tên [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))] phản bội này.\n\nHãy coi đây là lời cảnh cáo."
  bp1_yearly.2022.desc_dead:0 "\n\nNgươi sẽ không tin chuyện đã xảy ra với ta hôm nọ đâu. Một tên [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))] độc ác đã tìm cách sát hại ta, nhưng [bp1_yearly_2020_influencing_partner.GetFaith.HighGodName] đã bảo hộ và giữ ta an toàn. Còn cái đầu của [bp1_yearly_2020_influencing_partner.GetHerHis] thì ta giữ lại để trang trí phòng riêng.\n\nHãy coi đây là lời cảnh cáo."
  bp1_yearly.2022.a_imprisoned:0 "Tên #EMP [bp1_yearly_2020_target.Custom2('InsultNoun', ROOT.Char)]#!!"
  bp1_yearly.2022.b_dead:0 "Cái gì cơ? Không! Không thể nào! [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]..."
 #Concluding event
  bp1_yearly.2023.t:0 "Vạn Tuế [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]"
  bp1_yearly.2023.desc_triumphant:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] mỉm cười đầy đắc thắng về phía Ta khi Ta sải bước tiến đến chỗ [bp1_yearly_2020_influencing_partner.GetHerHim]."
  bp1_yearly.2023.desc_sad:0 "Ta nhìn quanh căn bếp trống trải. Sự im lặng vang vọng khắp nơi, khi [bp1_yearly_2020_influencing_partner.GetFirstName] không còn ở bên cạnh Ta."
  bp1_yearly.2023.desc_hesitant:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] ngẩng đầu lên khi ta bước vào bếp và hơi nghiêng đầu của [bp1_yearly_2020_influencing_partner.GetHerHis] sang một bên."
  bp1_yearly.2023.desc_killed_target:0 "[bp1_yearly_2020_influencing_partner.GetSheHe|U] dựa người ra sau quầy, để lộ ra một chiếc bao bố thấm đẫm vết bẩn. Chỉ trong một động tác gọn gàng, toàn bộ thứ bên trong được đổ lên mặt bàn phẳng.\n\nÁnh nhìn bất động từ cái đầu của [bp1_yearly_2020_target.GetTitledFirstNamePossessive] chào đón Ta, khiến bụng Ta khẽ rung lên.\nQuả là một ngày #EMP tuyệt vời#! ngoài mong đợi!"
  bp1_yearly.2023.desc_imprisoned:0 "Khi [bp1_yearly_2020_influencing_partner.GetHerHis] bị giam cầm bởi tay tên [bp1_yearly_2020_target.Custom('InsultAdjectiveGeneric')] [bp1_yearly_2020_target.GetFirstName] đó...\n\nTa nhắm mắt lại, cố không nghĩ đến những nỗi kinh hoàng mà [bp1_yearly_2020_influencing_partner.GetSheHe] có thể phải chịu đựng trong cảnh tù đày.\n\nTrong "
  bp1_yearly.2023.desc_died:0 "Khi [bp1_yearly_2020_influencing_partner.GetHerHim] đã chết dưới tay [bp1_yearly_2020_target.GetTitledFirstName], Ta... Ta... #EMP thở#!.\nTa đứng một mình, hít thở trong vài khoảnh khắc.\n\nTa #EMP sẽ#! trả thù cho [bp1_yearly_2020_influencing_partner.GetHerHim]. Ta thề trước [ROOT.Char.GetFaith.HighGodName], [bp1_yearly_2020_target.GetFirstName] sẽ bị ngăn chặn.\n\nTrong "
  bp1_yearly.2023.desc_picked_martial:0 "\"Ta tin rằng [bp1_yearly_2021_new_courtier.GetWomanMan] [bp1_yearly_2021_new_courtier.GetTitledFirstName] này hợp ý ngài chứ? Cơ bắp rắn như thép, ta nói thật đấy.\""
  bp1_yearly.2023.desc_picked_learning:0 "\"[bp1_yearly_2021_new_courtier.GetTitledFirstName] quả là một kỳ tài tri thức, phải không [bp1_yearly_2021_new_courtier.GetSheHe]! Ta luôn ghen tị với đầu óc của [bp1_yearly_2021_new_courtier.GetHerHis].\""
  bp1_yearly.2023.desc_picked_stewardship:0 "\"Ta tin [bp1_yearly_2021_new_courtier.GetTitledFirstName] đang làm đầy ngân khố của ngài! [bp1_yearly_2021_new_courtier.GetSheHe|U] vốn luôn là một viên ngọc quý.\""
  bp1_yearly.2023.desc_picked_diplomacy:0 "\"Không nghi ngờ gì nữa, [bp1_yearly_2021_new_courtier.GetTitledFirstName] đủ khả năng tự lên tiếng cho [bp1_yearly_2021_new_courtier.GetHerselfHimself] — ít nhất thì ta luôn phải cân nhắc kỹ trước khi đồng ý điều gì đó, để mọi chuyện không #EMP luôn#! kết thúc theo ý [bp1_yearly_2021_new_courtier.GetHerHis]!\""
  bp1_yearly.2023.desc_picked_intrigue:0 "\"[bp1_yearly_2021_new_courtier.GetTitledFirstName] đúng là giăng nên những mạng lưới tinh vi, phải không [bp1_yearly_2021_new_courtier.GetSheHe]? Ta luôn cố giữ quan hệ tốt với [bp1_yearly_2021_new_courtier.GetHerHis].\""
  bp1_yearly.2023.desc_picked_none:0 "\n\n\"Ta rất tiếc vì không ai trong số các ứng viên làm hài lòng ngài, [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)]. Dù vậy, mong rằng ngài vẫn trân trọng công sức ta đã bỏ ra để tập hợp những con người ưu tú nhất mà [ROOT.Char.GetCapitalLocation.GetName] và vùng phụ cận có thể mang lại.\"\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] nhìn Ta đầy chờ đợi."
  bp1_yearly.2023.desc_outro:0 "\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] nháy mắt. \"Giờ thì đến lượt ngài giữ lời hứa, thưa [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] của ta!\""
  bp1_yearly.2023.desc_outro_sad:0 "Để tưởng thưởng cho lòng dũng cảm của [bp1_yearly_2020_influencing_partner.GetHerHis], điều đúng đắn cần làm là chấp thuận yêu cầu của [bp1_yearly_2020_influencing_partner.GetHerHis]."
  bp1_yearly.2023.a:0 "Ngươi xứng đáng với điều này, [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]."
  bp1_yearly.2023.a_imprisoned_dead:0 "Đó là điều hợp với danh dự."
  bp1_yearly.2023.b:0 "Khả năng mưu mô của ngươi khiến ta phải lo ngại, người yêu dấu."
  bp1_yearly.2023.b_killer:0 "Ta không thể để ngươi tự do sau chuyện này."
  bp1_yearly.2023.c:0 "Nhìn xem, cả hai chúng ta đều biết chuyện này không đúng..."
  bp1_yearly.2023.c_imprisoned_dead:0 "#EMP Về mặt kỹ thuật#! thì [bp1_yearly_2020_influencing_partner.GetSheHe] chưa hoàn thành công việc..."
 #Mopey consort wants some guidance
  bp1_yearly.2030.t:0 "[bp1_yearly_2030_mopey_consort.Custom('GirlBoy')|U] Nên Làm Gì Đây"
  bp1_yearly.2030.desc:0 "Khi bước vào [ROOT.Char.Custom('GetRoom')], Ta nhận thấy [ROOT.Char.Custom2('RelationToMeShort', bp1_yearly_2030_mopey_consort )] của mình — [bp1_yearly_2030_mopey_consort.GetTitledFirstName] — trông xa cách và thờ ơ. Ta bước tới chỗ [bp1_yearly_2030_mopey_consort.GetHerHim] và đặt tay lên vai [bp1_yearly_2030_mopey_consort.GetHerHis]. \"Có chuyện gì vậy?\" Ta hỏi.\n\n[bp1_yearly_2030_mopey_consort.GetSheHe|U] nhìn Ta một lúc, rồi thở dài nặng nề. \"Nơi này ấy mà, nó просто quá... thiếu kích thích.\"\n\n[bp1_yearly_2030_mopey_consort.GetHerHis|U] nhún vai. \"Ta thật sự không biết nên làm gì với bản thân mình.\""
  bp1_yearly.2030.a:0 "Có lẽ ngươi nên giao thiệp với mọi người một chút?"
  bp1_yearly.2030.a_tt_paranoia:0 "Nhưng nếu họ quay sang bàn tán về #EMP ta...#! thì sao?"
  bp1_yearly.2030.a_tt_gregarious:0 "Ta tin chuyện này sẽ diễn ra suôn sẻ."
  bp1_yearly.2030.b:0 "Ta cá rằng [bp1_yearly_2030_target_consort.GetTitledFirstNameNoTooltip] có thể rất #EMP kích thích#!..."
  bp1_yearly.2030.b_tt:0 "Chỉ cần tình yêu là đủ?"
  bp1_yearly.2030.c:0 "Học một kỹ năng mới luôn làm tươi mới #EMP tâm trạng ta#!!"
  bp1_yearly.2030.d:0 "Thẳng thắn mà nói, ta còn những việc quan trọng hơn phải lo."
  bp1_yearly.2030.tt_success:0 "Mối quan hệ được cải thiện"
  bp1_yearly.2030.tt_failure:0 "Mối quan hệ xấu đi"
  bp1_yearly.2030.tt_potential_friend:0 "Họ tăng thiện cảm với nhau đôi chút"
  bp1_yearly.2030.tt_friend:0 "Họ hợp ý nhau"
  bp1_yearly.2030.tt_best_friend:0 "Mối quan hệ nở rộ"
  bp1_yearly.2030.tt_lover:0 "Họ #EMP thực sự#! rất hợp nhau"
  bp1_yearly.2030.tt_potential_rival:0 "Họ vấp phải trục trặc"
  bp1_yearly.2030.tt_rival:0 "Họ nảy sinh ác cảm sâu sắc với nhau"
  bp1_yearly.2030.tt_nemesis:0 "Họ trở thành kẻ thù không đội trời chung"
  bp1_yearly.2030.tt_nothing:0 "Mối quan hệ vẫn còn khá nhạt nhòa"
 #Consort is upset with other consort
  bp1_yearly.2040.t:0 "Tranh Cãi Trong Gia Thất"
  bp1_yearly.2040.desc:0 "[bp1_yearly_2040_upset_consort.GetTitledFirstName] xông thẳng vào [ROOT.Char.Custom('GetRoom')] của ta, giận dữ như một chiếc nồi đang sôi sùng sục. Sự nóng nảy toát ra từ [bp1_yearly_2040_upset_consort.GetHerHim] khiến ta có phần e dè.\n\n\"Chuyện này là #EMP KHÔNG THỂ CHẤP NHẬN ĐƯỢC#!, cách mà [bp1_yearly_2040_target_consort.GetSheHe], [bp1_yearly_2040_target_consort.GetSheHe]... khốn kiếp! [bp1_yearly_2040_target_consort.GetFirstName] đúng là một tên #EMP [bp1_yearly_2040_target_consort.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2040_upset_consort'))]#!\" [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip] giận dữ khoa tay múa chân. \"Ngài không thể làm #EMP điều gì đó#! sao?!\""
  bp1_yearly.2040.desc_paranoia:0 "\n\nVới trạng thái hiện tại của [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip], ta không thể chắc chắn rằng thực sự có chuyện gì #EMP đã#! xảy ra."
  bp1_yearly.2040.desc_default:0 "\n\nRõ ràng là đã có chuyện không hay xảy ra."
  bp1_yearly.2040.desc_outro:0 "Ta cần phải hành xử thật thận trọng."
  bp1_yearly.2040.a:0 "#EMP Ta#! chỉ từng nghe [bp1_yearly_2040_target_consort.GetHerHim] nói những điều tốt đẹp về ngươi thôi."
  bp1_yearly.2040.a_tt:0 "Xoa dịu tình hình."
  bp1_yearly.2040.b:0 "Ngươi biết đấy, [bp1_yearly_2040_target_consort.GetSheHe] #EMP đã#! nói gì đó về [bp1_yearly_2040_target_consort.Custom('RandomBodyFeatureNoun')] của ngươi..."
  bp1_yearly.2040.b_tt:0 "Khích [bp1_yearly_2040_upset_consort.GetHerHim] tiếp tục."
  bp1_yearly.2040.c:0 "[bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip], #EMP bình tĩnh lại#!. Hãy đi nói chuyện với [bp1_yearly_2040_target_consort.GetHerHim]."
  bp1_yearly.2040.c_tt:0 "Mọi chuyện đều có thể giải quyết bằng đối thoại."
  bp1_yearly.2040.d:0 "Ta #EMP thật sự#! không quan tâm. Tự giải quyết đi."
  bp1_yearly.2040.d_tt:0 "Thật là vớ vẩn!"
  bp1_yearly.2040.tt_success:0 "Tình hình được giải quyết"
  bp1_yearly.2040.tt_critical_success:0 "Họ bật cười vì hiểu lầm"
  bp1_yearly.2040.tt_severe_success:0 "[bp1_yearly_2040_upset_consort.GetFirstName] có lẽ đã hiểu mọi chuyện quá cứng nhắc"
  bp1_yearly.2040.tt_failure:0 "Tình hình #EMP không#! được giải quyết"
  bp1_yearly.2040.tt_critical_failure:0 "Mọi chuyện trở nên tệ hơn"
  bp1_yearly.2040.tt_severe_failure:0 "Sự việc chuyển biến theo hướng xấu"
 #Friendly consorts wants to start a study circle
  bp1_yearly.2050.t:0 "Một Nhóm Học Của Những [bp1_yearly_2050_first_consort.Custom('SisterhoodBrotherhood')|U]"
  bp1_yearly.2050.desc_intro:0 "Các phối ngẫu của ta tiến đến khi ta đang dạo bộ buổi chiều."
  bp1_yearly.2050.desc_intro_paranoid:0 "Các phối ngẫu của ta bất ngờ chặn đường ta khi đang dạo bộ buổi chiều."
  bp1_yearly.2050.desc:0 "\n\n\"Chúng Ta đã bàn bạc với nhau một thời gian rồi, thưa [ROOT.Char.GetTitledFirstName].\nChúng Ta muốn đóng góp điều gì đó cho cộng đồng, và dưới sự hướng dẫn của [highest_consort_skill_person.GetFirstName], chúng Ta mong muốn bản thân mình cùng những người khác tham gia vào "
  bp1_yearly.2050.desc_diplomacy:0 "các nghiên cứu về ngoại giao và nghệ thuật giấu gươm trong vỏ.\""
  bp1_yearly.2050.desc_martial:0 "các nghiên cứu về quân sự và nghệ thuật dùng sức mạnh trực diện.\""
  bp1_yearly.2050.desc_stewardship:0 "các nghiên cứu về quản trị và nghệ thuật điều hành lãnh địa.\""
  bp1_yearly.2050.desc_intrigue:0 "các nghiên cứu về âm mưu và nghệ thuật tinh tế của mưu kế cùng lừa lọc.\""
  bp1_yearly.2050.desc_learning:0 "các nghiên cứu về tri thức và nghệ thuật của con chữ.\""
  bp1_yearly.2050.desc_duo:0 "\n\nCả hai nhìn nhau rồi đồng loạt gật đầu."
  bp1_yearly.2050.desc_trio:0 "\n\nCả ba nhìn nhau rồi đồng loạt gật đầu."
  bp1_yearly.2050.desc_quartet:0 "\n\nCả bốn nhìn nhau rồi đồng loạt gật đầu."
  bp1_yearly.2050.desc_paranoid:0 "Ta quan sát họ một cách dè chừng. Tóc gáy ta dựng lên mỗi khi [bp1_yearly_2050_first_consort.GetSheHe] nhắc đến từ #EMP chúng ta#!."
  bp1_yearly.2050.a:0 "Rất đáng hoan nghênh, đây sẽ là một bổ sung tuyệt vời!"
  bp1_yearly.2050.a_tt:0 "Bất cứ điều gì giúp cải thiện lãnh địa!"
  bp1_yearly.2050.b:0 "Hm, có lẽ chúng ta có thể đạt được một #EMP thỏa hiệp#!."
  bp1_yearly.2050.b_tt_greedy:0 "Họ đã yêu cầu khá nhiều vàng."
  bp1_yearly.2050.c:0 "Ta không hề thích diễn biến này chút nào. #EMP Lính gác!#!"
  bp1_yearly.2050.c_tt_irritable:0 "Thật là trơ trẽn, đám [bp1_yearly_2050_first_consort.GetWomenMen] này!"
  bp1_yearly.2050.c_tt_paranoid:0 "Ai biết được họ còn đồng ý với nhau chuyện gì nữa..."
  bp1_yearly.2050.d:0 "Ta #EMP không#! tin rằng đây là một ý tưởng hiệu quả."
  bp1_yearly.2050.d_tt:0 "Tốt hơn là không nên khuyến khích chuyện này."
 #Friendly consorts want to tutor other consort's child
  bp1_yearly.2060.t:0 "Cần Cả Một Tập Thể"
  bp1_yearly.2060.desc_intro:0 "Gần đây ta để ý thấy [bp1_yearly_2060_first_consort.GetTitledFirstName] và [bp1_yearly_2060_second_consort.GetTitledFirstName] dành rất nhiều thời gian bên nhau. Sáng nay, cả hai tiếp cận ta với vẻ mặt đầy hào hứng.\n\n\"[ROOT.Char.GetTitledFirstName]! [bp1_yearly_2060_second_consort.GetFirstNameNoTooltip] và Ta đã gắn bó với nhau nhờ cùng chung niềm yêu thích về "
  bp1_yearly.2060.desc_diplomacy:1 "ngoại giao và việc giữ cho mọi người hòa thuận,\""
  bp1_yearly.2060.desc_martial:1 "võ nghệ và kiến thức chiến đấu,\""
  bp1_yearly.2060.desc_stewardship:0 "kinh tế và kỹ năng quản trị,\""
  bp1_yearly.2060.desc_intrigue:1 "âm mưu và những mánh khóe nơi triều đình,\""
  bp1_yearly.2060.desc_learning:1 "tri thức và tình yêu đối với kiến thức,\""
  bp1_yearly.2060.desc_outro:1 " [bp1_yearly_2060_first_consort.GetFirstNameNoTooltip] ríu rít nói.\n\n[bp1_yearly_2060_second_consort.GetFirstNameNoTooltip] chen vào: \"[bp1_yearly_2060_second_consort.Custom2('RelationToMeShort', bp1_yearly_2060_target_child)] của Ta — [bp1_yearly_2060_target_child.GetFirstNameNoTooltip] — thể hiện rất nhiều tiềm năng trong lĩnh vực này, và chúng Ta muốn trực tiếp chỉ dạy cho [bp1_yearly_2060_target_child.GetHerHim]!\""
  bp1_yearly.2060.a:0 "Nghe có vẻ là một ý tưởng tuyệt vời!"
  bp1_yearly.2060.a_paranoid:0 "Nếu các ngươi đã khăng khăng."
  bp1_yearly.2060.a_tt_paranoid:0 "Ai biết được họ còn đang nhồi nhét cho [bp1_yearly_2060_target_child.GetHerHim] những gì nữa..."
  bp1_yearly.2060.b:0 "[bp1_yearly_2060_target_child.GetSheHe|U] sẽ được lợi hơn nếu cải thiện [bp1_yearly_2060_target_child.GetHerHis] [bp1_yearly_2060_target_child.Custom('LowestSkillFlag')]."
  bp1_yearly.2060.c:0 "Không, ta không nghĩ đây là một ý tưởng hay."
  bp1_yearly.2060.tt_success:0 "Việc giảng dạy diễn ra thành công"
  bp1_yearly.2060.tt_critical_success:0 "[bp1_yearly_2060_target_child.GetFirstNameNoTooltip] tiếp thu kiến thức một cách xuất sắc"
  bp1_yearly.2060.tt_failure:0 "Việc giảng dạy không đạt kết quả"
 #Childless older spouse ponders your relationship
  bp1_yearly.2070.t:0 "Chặng Đường Đã Qua"
  bp1_yearly.2070.desc:0 "Gần đây ta nhận ra [bp1_yearly_2070_soulmate.GetFirstName] có vẻ buồn bã và xa cách. Trong chuyến tản bộ quen thuộc dọc theo khung cảnh bao quanh nơi ở của chúng ta, ta lấy hết can đảm để đối diện với [bp1_yearly_2070_soulmate.GetHerHim].\n\n\"Vậy là ngươi cũng nhận ra rồi sao.\" [bp1_yearly_2070_soulmate.GetSheHe|U] bước chậm lại, rồi dừng hẳn, lặng lẽ ngắm nhìn quang cảnh trước mắt. Ánh nắng lấp lánh trên làn da [bp1_yearly_2070_soulmate.GetHerHis].\n\n\"Ta yêu ngươi. Và ta yêu cuộc sống của chúng ta bên nhau.\" Đôi mắt [bp1_yearly_2070_soulmate.GetHerHis|U] dần ươn ướt. \"Điều hối tiếc duy nhất của ta là chưa bao giờ có thể ban cho ngươi — hay đúng hơn là cho chúng ta — một đứa trẻ để nối tiếp trên cõi đời này.\"\n\nNhững lời của [bp1_yearly_2070_soulmate.GetHerHis|U] vang vọng trong tai ta. Phải mang gánh nặng ấy một mình, người yêu dấu kiên cường của ta, [bp1_yearly_2070_soulmate.GetFirstName]!"
  bp1_yearly.2070.a:0 "Ngọt ngào thay, [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] — ta đã có thể dành trọn từng ấy thời gian bên #EMP ngươi#!."
  bp1_yearly.2070.a_tt:0 "Ngươi ôm lấy [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip]."
  bp1_yearly.2070.b:0 "Đó đơn giản là không phải ý chí của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  bp1_yearly.2070.b_tt:0 "[bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] tìm được chút an ủi từ điều này."
  bp1_yearly.2070.c:0 "Cả ta và ngươi đều biết rằng như vậy là tốt nhất."
  bp1_yearly.2070.c_tt:0 "Thế giới này vốn quá tàn khốc."

