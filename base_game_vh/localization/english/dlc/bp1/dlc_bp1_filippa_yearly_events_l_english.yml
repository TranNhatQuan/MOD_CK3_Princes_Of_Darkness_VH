  bp1_yearly_2050_compromise_development_modifier:0 "Phát Triển Được Cải Thiện"
  bp1_yearly_2050_compromise_development_modifier_desc:0 "Cho phép chia sẻ tri thức và hỗ trợ giáo dục giúp gia tăng mức phát triển của quận hạt này."
  bp1_yearly_2050_development_modifier:0 "Phát Triển Tăng Vọt"
