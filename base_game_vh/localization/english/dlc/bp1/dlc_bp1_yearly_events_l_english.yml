l_english:
 #Purchase a gift for your partner(s)
  bp1_yearly.2000.t:0 "Một món quà xứng đáng cho..."
  bp1_yearly.2000.desc.intro:0 "Không khí nhộn nhịp hiện rõ giữa các quầy hàng của những thương nhân rong ruổi. Những túp lều tạm được chất kín đến tận mái, bày bán đủ loại đồ lặt vặt."
  bp1_yearly.2000.desc.greed_flavor:0 "Những món này trông đắt tiền thật... nhưng có lẽ cũng đáng giá."
  bp1_yearly.2000.desc.not_greed_flavor:0 "Những món này rực rỡ một cách lạ thường và sẽ là một món quà tuyệt vời."
  bp1_yearly.2000.desc.single:1 "\n\nKhi ta cùng [bp1_yearly_2000_partner_a.GetTitledFirstName] đi ngang qua một người buôn bán trang sức, [bp1_yearly_2000_partner_a.GetSheHe] hơi chần chừ khi [bp1_yearly_2000_partner_a.GetSheHe] tiến lại gần để nhìn kỹ hơn.\n\nCó lẽ một trong số những món đồ này sẽ khiến [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2000_partner_a'))] [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('bp1_yearly_2000_partner_a'))] của ta vui lòng hơn chăng?"
  bp1_yearly.2000.desc.duo:1 "\n\nKhi Ta đi ngang qua một người bán trang sức, Ta chần chừ rồi nghiêng người lại gần để nhìn kỹ hơn.\n\nCó lẽ một trong số này sẽ làm bừng sáng ngày hôm nay của [bp1_yearly_2000_partner_a.GetTitledFirstName] thân yêu hoặc [bp1_yearly_2000_partner_b.GetTitledFirstName]?"
  bp1_yearly.2000.a_single:1 "Một món [ROOT.Char.Custom('RandomJewelry')], xứng đáng với [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]!"
  bp1_yearly.2000.a_duo:1 "Một món [ROOT.Char.Custom('RandomJewelry')], xứng đáng với [bp1_yearly_2000_partner_a.Custom('ComplimentAdjective')] [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip] của ta."
  bp1_yearly.2000.b:1 "Món [ROOT.Char.Custom('RandomJewelry')] này sẽ trông thật [ROOT.Char.Custom('RandomPositiveLookAdjective')] trên dáng vẻ [bp1_yearly_2000_partner_b.Custom('ComplimentAdjective')] của [bp1_yearly_2000_partner_b.GetFirstNamePossessiveNoTooltip]."
  bp1_yearly.2000.c:0 "Sao phải chọn một!"
  bp1_yearly.2000.c_flavor:0 "Chiều chuộng cả hai luôn!"
  bp1_yearly.2000.d:0 "Chỉ cần ta ở bên là đủ rạng rỡ rồi."
 #Follow-up event
  bp1_yearly.2001.t:0 "... Một vị quân chủ"
  bp1_yearly.2001.t.first_title_duo:0 "... Một vị quân chủ..."
  bp1_yearly.2001.t.second_title_duo:0 "... Và một [ROOT.Char.GetWomanMan|U] tuyệt vời"
  bp1_yearly.2001.desc.intro_high_opinion:0 ""Người yêu dấu của ta, [ROOT.Char.GetFirstNameNoTooltip], thật vui khi được gặp lại!\n\nTa dõi theo nàng/chàng tận tụy trị vì [ROOT.Char.Custom('GetRealmOrDomicile')] của chúng ta và mong có thể hỗ trợ bằng mọi cách.""
  bp1_yearly.2001.desc.intro:0 ""[bp1_yearly_2001_partner.Custom2('RelationToMeShort', ROOT.Char)|U], dạo này chúng ta hiếm khi gặp nhau quá!\n\nTa có thể đã phát hiện vài mẩu tin hữu ích cho việc trị vì của chúng ta.""
  bp1_yearly.2001.desc.segway_secret_hook:0 "\n\n[bp1_yearly_2001_partner.GetSheHe|U] ngoảnh đầu nhìn qua vai [bp1_yearly_2001_partner.GetHerHis] "
  bp1_yearly.2001.desc.secret:0 ""Ta nghe lỏm được một chuyện mà nàng/chàng sẽ không tin đâu, khi nghe bọn hầu bàn tán hôm trước.""
  bp1_yearly.2001.desc.hook:0 ""Ta có thể đã... thôi thì đừng bận tâm ta đã làm gì, chỉ biết rằng một người quen chung đang nợ ta một ân huệ.""
  bp1_yearly.2001.desc.segway_lover:0 "\n\nMột làn gió nhẹ lướt qua mái tóc của [bp1_yearly_2001_partner.GetHerHis] "
  bp1_yearly.2001.desc.lover:0 "và ta không thể không ngắm nhìn những đường nét [ROOT.Char.Custom('RandomPositiveLookAdjective')] của [bp1_yearly_2001_partner.GetHerHis], cố khắc sâu chúng vào tâm trí."
  bp1_yearly.2001.desc.segway_modifier:0 "\n\nRồi [bp1_yearly_2001_partner.GetSheHe] khẽ nhăn mặt, như vừa nhớ ra điều gì quan trọng. \"Ta có thể \""
  bp1_yearly.2001.desc.close_modifier:0 "để mắt tới bất kỳ hành vi nào... khó coi... đang nhắm về phía chúng ta.\""
  bp1_yearly.2001.desc.finance_modifier:0 "xem xét cung cấp cho nàng/chàng những lời khuyên tài chính tốt nhất từ nguồn tin của ta.\""
  bp1_yearly.2001.desc.close_finance_modifier:0 "\n\n\"Hoặc là cung cấp cho nàng/chàng những lời khuyên tài chính tốt nhất từ các nguồn của ta.\""
  bp1_yearly.2001.desc.fallback:0 "\n\n\"...hoặc không, có lẽ ta đã nhầm. Xin lỗi vì đã làm mất thời gian của nàng/chàng!\""
  bp1_yearly.2001.desc.outro:0 "\n\n[bp1_yearly_2001_partner.GetSheHe|U] nghiêng [bp1_yearly_2001_partner.GetHerHis] đầu và nhìn ta đầy mong đợi."
  bp1_yearly.2001.a:0 "Ôi, xin hãy kể hết ra đi, [ROOT.Char.Custom('PartnerOpinionHighDescription')] của ta!"
  bp1_yearly.2001.a.tt_secret:0 "Bí mật của [bp1_yearly_2001_secret_owner.GetTitledFirstNamePossessive]"
  bp1_yearly.2001.a_tt:0 "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] sẽ chia sẻ một bí mật với Ngài."
  bp1_yearly.2001.b:0 "Ta quan tâm đến #EMP chính nàng/chàng#! hơn, [ROOT.Char.Custom('LoverPetName')] của ta!"
  bp1_yearly.2001.c:0 "Sao nàng/chàng lại... thôi bỏ đi. Xin hãy khai sáng cho ta!"
  bp1_yearly.2001.c_tt:0 "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] mang đến cho Ngài một móc câu (hook) về một đối tượng."
  bp1_yearly.2001.d:0 "Ta tin nàng/chàng sẽ luôn hậu thuẫn cho ta, [ROOT.Char.Custom('PartnerOpinionHighDescription')] của ta."
  bp1_yearly.2001.e:0 "Ta #EMP rất#! mong có được tài chính khởi sắc hơn."
 #You catch your spouses/consorts being lovers
  bp1_yearly.2010.t:0 "Hai con thuyền trong đêm"
  bp1_yearly.2010.desc.intro:0 "Thoạt nhìn, hành lang có vẻ không một bóng người. Với bước chân vững vàng, ta tiến về công việc đầu tiên trong ngày.\n\nBất chợt, ta nghe thấy một tiếng khúc khích bị kìm nén và đứng sững lại. Ta nghiêng người về phía trước và chỉ kịp thoáng thấy [bp1_yearly_2010_first_partner.GetShortUIName] và [bp1_yearly_2010_second_partner.GetShortUIName],"
  bp1_yearly.2010.desc.default:0 "đắm chìm trong một vòng tay âu yếm dưới ánh sáng ban mai.\n\n\"[bp1_yearly_2010_second_partner.GetFirstNameNoTooltip], đừng trêu đùa với ta nữa, [ROOT.Char.Custom('LoverPetName')] của ta...\" [bp1_yearly_2010_first_partner.GetSheHe|U] vùi khuôn mặt [bp1_yearly_2010_first_partner.GetHerHis] vào hõm cổ của [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip].\n\n\"Chúng ta có thể ở bên nhau vào đêm mai, [ROOT.Char.Custom('LoverPetName')] của ta,\" [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip] đáp lại. \"Chỉ cần ban ngày được ở bên em, những thứ khác đều không còn quan trọng.\""
  bp1_yearly.2010.desc.lustful:0 "nồng nhiệt và cuồng nhiệt, đang làm... ôi #EMP trời ơi#!.\n\nGiữa ban ngày ban mặt sao? Và họ đang làm gì với cái #EMP [ROOT.Char.Custom('DeviantObjectNoun')]#! kia vậy?"
  bp1_yearly.2010.a:0 "Thật ngọt ngào. Và có lẽ cũng hữu ích."
  bp1_yearly.2010.a_lustful:0 "Ta nên bắt đầu ghi chép lại mới được!"
  bp1_yearly.2010.a_tt:0 "Còn #EMP những chuyện gì khác#! đang diễn ra dưới mái nhà của ta đây..."
  bp1_yearly.2010.a_tt_lustful:0 "Ta #EMP thích#! chuyện này rồi đấy!"
  bp1_yearly.2010.b:0 "Có lẽ họ cần thêm một #EMP người thứ ba#! giúp sức..."
  bp1_yearly.2010.tt:0 "Thật là hoàn cảnh trớ trêu!"
  bp1_yearly.2010.c:0 "Thật là một sự sỉ nhục!"
  bp1_yearly.2010.c_tt:0 "Trái tim ta tan vỡ rồi."

  bp1_yearly.5100.t:0 "Mũi tên của thần Ái Tình"
  bp1_yearly.5100.desc:0 "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] của ta là [unloved_courtier.GetName] đã ủ rũ suốt hơn một tuần nay, và đến tiếng thở dài nặng nề, chán chường lần thứ năm trong ngày khiến ta cuối cùng cũng phải nhẹ nhàng hỏi xem có chuyện gì.\n\n"Ta thật cô đơn. Tất cả những gì ta muốn là một người đặc biệt nào đó! Một người sẽ ở bên cạnh ta ban ngày và chia sẻ giường cùng ta vào ban đêm!" [unloved_courtier.GetSheHe|U] dừng lại, rồi buồn bã lắc đầu.\n\n"Ta đang nói gì vậy chứ? Ngài không hiểu hoàn cảnh của ta, phải không, [ROOT.Char.Custom('FormOfAddressForLiege')]? Hãy nhìn ngài kìa! Ngài thật sự..." 
  bp1_yearly.5100.desc.male:0 "đẹp trai đầy phong trần!"
  bp1_yearly.5100.desc.female:0 "xinh đẹp một cách tự nhiên!"
  bp1_yearly.5100.desc.swole:0 "quyến rũ, lại còn có thân hình như tượng tạc!"
  bp1_yearly.5100.desc.scarred:0 "đầy vẻ cao quý, với những vết sẹo ấy!"
  bp1_yearly.5100.desc.fallback:0 "hoàn hảo đến từng đường nét!"
  bp1_yearly.5100.desc.end:0 "Những chuyện này chắc chưa bao giờ là vấn đề với ngài, đúng không?\""
  bp1_yearly.5100.a:0 "Cứ là chính mình thôi, [unloved_courtier.GetNameNoTooltip]!"
  bp1_yearly.5100.b:0 "Ngươi nói đúng, đúng là chưa bao giờ!"
  bp1_yearly.5100.c:0 "Ta sẽ giúp ngươi!"
  bp1_yearly.5100.d:0 "Đừng từ bỏ hy vọng, [unloved_courtier.GetNameNoTooltip]."
  bp1_yearly.5100.toast:0 "Mọi chuyện đã không thành."

  bp1_yearly.5101.t:0 "Mũi tên của thần Ái Tình: Mục tiêu"
  bp1_yearly.5101.desc:0 "\"Ngài sẽ làm vậy thật sao, [ROOT.Char.Custom('FormOfAddressForLiege')]? Ngài thực sự sẽ giúp Ta ư?\"\n\nTa nhớ lại khuôn mặt [unloved_courtier.GetNamePossessive] bừng sáng khi ta miễn cưỡng đồng ý giúp [unloved_courtier.GetHerHim] tìm kiếm tình yêu. Ta không phải là người quá thành thạo chuyện se duyên, nên với nhiều hy vọng hơn là chắc chắn, ta bước vào đám đông nhộn nhịp tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] để tìm một đối tượng tiềm năng.\n\nTa quan sát quảng trường chợ, thấy vài ứng viên có vẻ phù hợp, nhưng vì lợi ích của [unloved_courtier.GetNamePossessiveNoTooltip], ta thực sự nên tìm một người hợp với [unloved_courtier.GetHerHim]. Một người..."
  bp1_yearly.5101.a:0 "...chu đáo và nhạy cảm."
  bp1_yearly.5101.b:0 "...công bằng và không thành kiến."
  bp1_yearly.5101.c:0 "...mộ đạo và nhiệt thành."
  bp1_yearly.5101.d:0 "...thôi thì cứ chọn người nổi bật nhất vậy."

  bp1_yearly.5102.t:0 "Mũi tên của thần Ái Tình: Trúng đích"
  bp1_yearly.5102.desc:0 "Khi ta tiếp tục tìm kiếm, một bóng hình thu hút ánh nhìn của ta. [potential_lover.GetSheHe|U]"
  bp1_yearly.5102.desc.compassionate:0 "đang đứng nép ở một góc quảng trường, dường như đang giúp một con mèo hoang trông rất khát nước. Khi [potential_lover.GetWomanMan] an ủi con vật tội nghiệp ấy, ta bắt đầu hình dung một vài [ROOT.Char.Custom('GetCourtierPlural')] đáng thương nào đó cũng nhận được sự vị tha tương tự..."
  bp1_yearly.5102.desc.just:0 "dường như đang giải quyết một cuộc tranh chấp giữa hai người nông dân. [potential_lover.GetSheHe|U] lắng nghe chăm chú câu chuyện của từng người, rồi đưa ra một phán quyết công bằng mà cả hai đều chấp nhận."
  bp1_yearly.5102.desc.zealous:0 "đang chăm chú lắng nghe một nhà thuyết giáo hạch hỏi đám đông. Với ta thì nghe như lời lảm nhảm của kẻ điên, nhưng đôi mắt người nghe lại cháy bỏng niềm tin và [potential_lover.GetSheHe] gật đầu đầy nhiệt huyết trước những lời rao giảng tôn giáo."
  bp1_yearly.5102.desc.peng:0 "rất khó để bỏ lỡ: được bao quanh bởi một nhóm người ngưỡng mộ, bộ quần áo hơi cũ kỹ của [potential_lover.GetHerHis] lại càng làm nổi bật vẻ ngoài cuốn hút."
  bp1_yearly.5102.desc.end:0 "\n\nChỉ cần một lời mời đến [ROOT.Char.Custom('GetCourt')] của ta cùng lời hứa về một người cầu hôn đã đủ để đưa [potential_lover.GetWomanMan] đầy vinh dự và phấn khích — [potential_lover.GetName], cái tên được tiết lộ của [potential_lover.GetHerHis] — đi cùng ta. Với vẻ đắc thắng, ta bước qua cánh cửa, và nhìn thấy [unloved_courtier.GetName] đang chìm trong sự ủ rũ vô vị quen thuộc của [unloved_courtier.GetHerHis] ở phía bên kia cung đình.\n\n[unloved_courtier.GetNameNoTooltip] quay sang nhìn ta đầy mong đợi, đôi mắt ánh lên tia hy vọng."
  bp1_yearly.5102.a:0 "[unloved_courtier.GetNameNoTooltip]! Lại đây!"
  bp1_yearly.5102.b:0 "Thật ra, có lẽ ngươi muốn bỏ qua buổi gặp này thì hơn?"
  bp1_yearly.5102.c:0 "\"Ngươi mà ghép với một [unloved_courtier.GetWomanMan] tầm cỡ như [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] của ta thì thật là phí phạm.\""
  bp1_yearly.5102.a.success:0 "Họ hợp ý nhau"
  bp1_yearly.5102.a.failure:0 "Không có tia lửa nào cả"

  # Your friend is concerned about your weight
  bp1_yearly.5301.t:0 "Một vấn đề nặng ký"
  bp1_yearly.5301.start:0 "Suốt cả buổi tối khi chúng ta dùng bữa, ta đã nhận ra ánh mắt của [concerned_friend.GetFirstNamePossessive] luôn dõi theo mình, "
  bp1_yearly.5301.thicc:0 "nhưng chỉ đến khi ta vui vẻ nhận phần thứ ba của món [ROOT.Char.Custom('GetExpensiveDessert')] thì nắm tay của [concerned_friend.GetHerHis] mới bất ngờ đập mạnh xuống bàn.\n\n\"Ta không thể để chuyện này tiếp diễn nữa!\" [concerned_friend.GetSheHe] hét lên với ta. \"Ta không thể ngồi đây nhìn ngài ăn cho đến chết được, [ROOT.Char.GetFirstName]!\"\n\nTa có phần bực bội, nhưng thật khó mà tỏ ra phẫn nộ khi miệng vẫn còn đầy thức ăn. Có lẽ ta #EMP đúng là#! rất thích ăn vặt đôi chút, nhưng điều hành một [ROOT.Char.GetPrimaryTitle.GetTierAsName] đúng là công việc đầy căng thẳng!"
  bp1_yearly.5301.thinn:0 "nhưng khi ta vẫn còn lơ đãng với món đầu tiên trong lúc các món tiếp theo lần lượt được dọn lên, thì nắm tay của [concerned_friend.GetHerHis] bất ngờ đập mạnh xuống bàn.\n\n\"Ta không thể để chuyện này tiếp diễn nữa!\" [concerned_friend.GetSheHe] hét lên với ta. \"Ta không thể ngồi đây nhìn ngài gầy mòn dần như thế được, [ROOT.Char.GetFirstName]!\"\n\nTa có phần bực bội, nhưng thật khó mà tỏ ra phẫn nộ sau đống đĩa chén ngày càng chồng chất. Có lẽ ta #EMP đúng là không#! có quá nhiều thời gian để ăn uống, nhưng điều hành một [ROOT.Char.GetPrimaryTitle.GetTierAsName] đúng là tốn rất nhiều thời gian!"
  bp1_yearly.5301.a:0 "Ngươi biết không, [concerned_friend.GetFirstNameNoTooltip]? Ngươi nói đúng."
  bp1_yearly.5301.a.tt:0 "Hai người cùng nhau tìm cách cải thiện thể lực"
  bp1_yearly.5301.b:0 "Ta đâu có béo đến thế!"
  bp1_yearly.5301.b.tt:0 "Ngài tìm cách chứng minh quan điểm của mình"
  bp1_yearly.5301.c:0 "Ta đâu có gầy quá mức!"
  bp1_yearly.5301.d:0 "Ngươi cũng có tư cách nói về ngoại hình sao!"
  bp1_yearly.5301.d.tt:0 "Hai người lao vào một trận ẩu đả khá là thảm hại"
  bp1_yearly.5301.d.tt.win:0 "Ngài thắng trận đánh"
  bp1_yearly.5301.d.tt.lose:0 "Ngài thua trận đánh"

  bp1_yearly.5302.t:0 "$bp1_yearly.5301.t$: Con đường gập ghềnh"
  bp1_yearly.5302.desc:0 "Đó là một ngày mới trong lành và đầy nắng, ta có thể thấy mồ hôi đang nhỏ xuống từ cằm của [concerned_friend.GetFirstNamePossessive] khi [concerned_friend.GetSheHe] tiếp tục khích lệ ta tiến về phía trước. Bao tải đá trên lưng ta rên lên dưới sức nặng của nó, và ta cũng vậy khi ném nó xuống phía bên kia vạch đất mà [concerned_friend.GetFirstNameNoTooltip] đã vẽ bằng một chiếc gậy. [concerned_friend.GetSheHe|U] vỗ hai tay vào nhau đầy thích thú.\n\n"Ngươi trông đã khỏe hơn rồi đấy! Ta nghĩ đã đến lúc chuyển sang thứ gì đó lớn hơn một chút."\n\n"Ta biết hiện tại họ đang tiến hành công việc thoát nước ở cánh đồng kế bên và có thể cần một chút giúp đỡ. Nếu không, nếu ngươi cảm thấy đủ can đảm, có một lùm cây ngay bên kia đỉnh đồi mà họ đang tiến hành khai thác gỗ. Ngươi nghĩ sao?""
  bp1_yearly.5302.a:0 "Mang cho ta một cái rìu!"
  bp1_yearly.5302.a.tt:0 "Ngài tiến về lùm cây"
  bp1_yearly.5302.b:0 "Tốt hơn là cứ tiếp tục làm việc thoát nước."
  bp1_yearly.5302.b.tt:0 "Ngài lên đường tới cánh đồng gần đó"

  bp1_yearly.5303.t:0 "$bp1_yearly.5301.t$: Vung rìu đốn gỗ"
  bp1_yearly.5303.desc:0 "Đốn cây là một công việc nguy hiểm đối với một người thiếu kinh nghiệm như ta. Dù luôn được [concerned_friend.GetFirstNamePossessive] giám sát cẩn thận, sự kết hợp giữa việc thiếu nhận thức của ta và sự gắng sức quá mức đã khiến ta vài lần suýt gặp tai nạn. Cắm chiếc rìu của mình vào thân một khúc gỗ gần đó, ta dừng lại để uống một ngụm nước từ bình đựng. [concerned_friend.GetFirstNameNoTooltip] tiến lại gần ta, chiếc rìu của chính [concerned_friend.GetHerHis] vắt trên vai.\n\n"Ta nghĩ ngươi đã sẵn sàng để thử sức với thứ gì đó lớn hơn một chút rồi!" [concerned_friend.GetSheHe] vui vẻ nói, đồng thời chỉ về phía trước bằng chiếc rìu của [concerned_friend.GetHerHis]. Cái cây được chỉ đến rất khổng lồ, một cây gỗ cứng cao vút, và ta thận trọng nhìn nó trong khi các cơ bắp đang đau nhức của ta căng lên vì hồi hộp chờ đợi."
  bp1_yearly.5303.a:0 "Chà, thì nó khó đến mức nào chứ?"
  bp1_yearly.5303.a.criticalsuccess:0 "Ngài đốn hạ cái cây một cách thành công!"
  bp1_yearly.5303.a.failure:0 "Ngài không thể đốn hạ cái cây nếu không có trợ giúp"
  bp1_yearly.5303.a.wounded:0 "Cái cây quật trúng Ngài khi đổ xuống"
  bp1_yearly.5303.a.criticalfailure:0 "Cái cây đổ thẳng lên người Ngài!"
  bp1_yearly.5303.b:0 "Ngươi có thể giúp ta một tay không, [concerned_friend.GetFirstNameNoTooltip]?"

  bp1_yearly.5304.t:0 "$bp1_yearly.5301.t$: Đầm lầy quen thuộc"
  bp1_yearly.5304.desc:0 "Vùng đất ngập nước, lầy lội mà ta tình nguyện giúp đỡ khiến công việc trở nên mệt nhoài. Ta làm việc cật lực bên cạnh những nông dân không hề hay biết thân phận của ta, dùng cuốc đào mương và chuyển từng bao bùn ướt ra khỏi khu vực.\n\n[concerned_friend.GetFirstName] và ta đang nghỉ ngơi, đứng trên dải đất hẹp giữa hai vũng lầy, thì [waterboy.GetFirstName], một trong những đứa trẻ có nhiệm vụ tiếp nước cho công nhân, tiến lại gần đưa cho ta một bình nước. Vừa mới uống một ngụm thì [waterboy.GetFirstNameNoTooltip], với tay lấy lại bình, mất thăng bằng và rơi thẳng xuống đầm lầy!"
  bp1_yearly.5304.a:0 "Bám lấy, nhóc con! Ta đây rồi!"
  bp1_yearly.5304.b:0 "...liệu có ai ngoài chúng ta nhận ra nếu [waterboy.GetSheHe] chết đuối không?"

  bp1_yearly.5305.t:0 "$bp1_yearly.5301.t$: Khỏe mạnh sung sức"
  bp1_yearly.5305.desc:0 "Hoàn thành công việc, ta tạm biệt những nông dân đã cùng làm việc với [concerned_friend.GetFirstName] — họ vui vẻ vẫy tay chào, hoàn toàn không biết thân phận quý tộc của ta — rồi trở về nơi ở quen thuộc. Dù cơ bắp đau nhức, ta lại cảm thấy tràn đầy sức mạnh và sinh lực.\n\nNhìn thấy một chậu nước lớn ở phía bên kia phòng, ta gượng đứng dậy và tiến đến. Cởi áo ra, dưới ánh nến chập chờn, ta nhìn ngắm hình ảnh phản chiếu của mình trong mặt nước."
  bp1_yearly.5305.a:0 "Ta trông thật tuyệt!"
  bp1_yearly.5305.b:0 "Ta nợ tất cả chuyện này ở ngươi, [concerned_friend.GetFirstNameNoTooltip]."

  bp1_yearly.5306.t:0 "$bp1_yearly.5301.t$: Thử thách sức mạnh"
  bp1_yearly.5306.start:0 "Giận dữ, ta sải bước khắp [ROOT.Char.Custom('GetCourt')], kéo theo [concerned_friend.GetFirstName].\n\n\"[ROOT.Char.GetFirstName]! Làm ơn, ngài không cần phải chứng minh điều gì cả! Chúng ta có thể quên hết những gì Ta đã nói!\" [concerned_friend.GetSheHe] bị cắt ngang bởi cái phẩy tay đầy khinh miệt của ta khi ta đảo mắt tìm một vật gì đó đủ to và nặng. Sao [concerned_friend.GetSheHe] dám xúc phạm danh dự của ta như vậy!\n\n"
  bp1_yearly.5306.artifact:0 "Ánh mắt ta dừng lại ở [bulky_artifact.GetName]. "
  bp1_yearly.5306.throne:0 "Ánh mắt ta dừng lại ở ngai vàng của mình."
  bp1_yearly.5306.table:0 "Ánh mắt ta dừng lại ở một chiếc bàn nặng trịch."
  bp1_yearly.5306.ending:0 "Trước sự kinh hãi của [concerned_friend.GetFirstNamePossessiveNoTooltip], ta giật phăng áo ra và lập tức vào tư thế nâng vật nặng khổng lồ ấy."
  bp1_yearly.5306.a:0 "Hãy nhìn đây, [concerned_friend.GetFirstNameNoTooltip]!"
  bp1_yearly.5306.a.success:0 "Ngài nhấc nó lên không trung!"
  bp1_yearly.5306.a.failure:0 "Ngài làm căng lưng quá mức"
  bp1_yearly.5306.a.criticalfailure:0 "Ngài làm rơi nó trúng chính mình!"
  bp1_yearly.5306.a.criticalsuccess:0 "Ngài nâng nó lên cao"
  bp1_yearly.5306.b:0 "...nghĩ lại thì, có lẽ ngươi nói đúng."

  bp1_yearly.5800.t:0 "Một mùi lạ"
  bp1_yearly.5800.desc:0 "Thức dậy vào buổi sáng bên cạnh [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('surprised_sniffer'))] của ta, [surprised_sniffer.GetFirstName], ta thở dài và uể oải vươn vai, chỉ để bắt gặp cảnh người ta yêu đang nhăn [surprised_sniffer.GetHerHis] mũi lại. Ta mở miệng định hỏi thêm, nhưng [surprised_sniffer.GetFirstNameNoTooltip] lại càng lùi ra xa hơn.\n\n"Nghe này, [ROOT.Char.GetFirstName], tình yêu của ta..." [surprised_sniffer.GetSheHe] vội vàng bắt đầu, như thể những lời đó vô tình tuôn ra khỏi miệng [surprised_sniffer.GetHerHis]. "Chuyện này thật khó để nói ra, nhưng... gần đây ngươi không còn có mùi thơm tho cho lắm."\n\nSững sờ, ta tò mò đưa nách mình lên và #flatulence sniff#!.\n\nChà, có lẽ [surprised_sniffer.GetSheHe] cũng có lý."
  bp1_yearly.5800.a:0 "Chúng ta cần tìm cách khắc phục chuyện này!"
  bp1_yearly.5800.a.tt:0 "Ngài tìm kiếm một phương thuốc cho vấn đề này"
  bp1_yearly.5800.b:0 "Có #EMP tệ#! đến thế đâu!"

  bp1_yearly.5801.t:0 "$bp1_yearly.5800.t$: Thượng hạng"
  bp1_yearly.5801.desc:0 "Ta ngáp một cách mệt mỏi khi [surprised_sniffer.GetFirstName] hào hứng dẫn ta vào một thị trấn gần đó. [surprised_sniffer.GetSheHe|U] đã nhất quyết muốn lên đường ngay khi có thể — điều mà khi nghĩ lại thì có phần xúc phạm — và chúng ta đi xuyên qua những đám đông nhỏ để đến nơi một người bán trái cây và thảo mộc đang rao bán hàng hóa của mình.\n\n"Được rồi!" [surprised_sniffer.GetFirstNameNoTooltip] nói đầy mong đợi. "Hãy chọn một trong những thứ này. Chúng sẽ khiến mùi hương ban đầu trở nên tươi mát và thơm mùi trái cây!" [surprised_sniffer.GetSheHe|U] đảo mắt trước vẻ mặt ngơ ngác của ta.\n\n"Tất nhiên là chúng ta đang làm một loại #EMP nước hoa#! rồi!""
  bp1_yearly.5801.a:0 "Đây là quả sung sao?"
  bp1_yearly.5801.b:0 "Có lẽ là bạc hà?"
  bp1_yearly.5801.c:0 "Ta thích mùi chanh!"
  bp1_yearly.5801.d:0 "Lựu chắc là đắt lắm..."
  bp1_yearly.5801.fig:0 "[perfume_bottle.GetDesc] Có hương sung"
  bp1_yearly.5801.mint:0 "[perfume_bottle.GetDesc] Có hương bạc hà"
  bp1_yearly.5801.lemon:0 "[perfume_bottle.GetDesc] Có hương chanh"
  bp1_yearly.5801.pomegranate:0 "[perfume_bottle.GetDesc] Có hương lựu"

  bp1_yearly.5802.t:0 "$bp1_yearly.5800.t$: Từ tận đáy lòng"
  bp1_yearly.5802.desc:0 "Sau lựa chọn của ta vào một tuần trước, ta gần như đã quên mất nhiệm vụ chế tạo một loại nước hoa cho ta của [surprised_sniffer.GetFirstNamePossessive]. Ta chỉ nhớ ra khi [surprised_sniffer.GetSheHe] đột nhiên dừng lại giữa đường rồi xoay gót, kéo ta đến chỗ một người buôn gia vị bên ven đường.\n\n"Những thứ này sẽ hoàn hảo!" [surprised_sniffer.GetSheHe] xuýt xoa. "Bất cứ thứ gì ở đây cũng sẽ rất phù hợp để làm phần hương chính của nước hoa!"\n\nTa nhìn qua những loại gia vị và hương liệu được bày ra trước mắt, rất nhiều trong số chúng xa lạ và kỳ lạ đối với ta."
  bp1_yearly.5802.a:0 "Đây là gì vậy... bạch đậu khấu à?"
  bp1_yearly.5802.b:0 "Ngươi bảo cái này gọi là nhục đậu khấu sao?"
  bp1_yearly.5802.c:0 "Quế này thơm thật!"
  bp1_yearly.5802.d:0 "Trầm hương chắc sẽ tạo ra mùi hương thiêng liêng!"
  bp1_yearly.5802.cardamom:0 "[perfume_bottle.GetDesc], bạch đậu khấu thơm nồng"
  bp1_yearly.5802.nutmeg:0 "[perfume_bottle.GetDesc], nhục đậu khấu cay gắt"
  bp1_yearly.5802.cinnamon:0 "[perfume_bottle.GetDesc], quế ấm áp"
  bp1_yearly.5802.frankincense:0 "[perfume_bottle.GetDesc], nhựa trầm cay nồng"

  bp1_yearly.5803.t:0 "$bp1_yearly.5800.t$: Nền hương vững chắc"
  bp1_yearly.5803.desc:0 "Đi ngang qua một người bán hàng ở rìa khu rừng chuyên bán các loại gỗ và sản phẩm liên quan, ta chỉ kịp cảm thấy một cơn lo lắng dâng lên trong giây lát trước khi đôi mắt của [surprised_sniffer.GetFirstNamePossessive] sáng rực và [surprised_sniffer.GetSheHe] kéo ta về phía họ.\n\n\"Giờ thì #EMP mấy thứ này#! chính xác là thứ chúng ta cần!\" [surprised_sniffer.GetSheHe|U] chỉ vào vài loại gỗ hiếm và nhựa cây xếp bên trái người bán. \"Chúng sẽ tạo ra một tầng hương nền mạnh mẽ và giữ mùi suốt cả ngày!\""
  bp1_yearly.5803.a:0 "Gỗ sồi là loại gỗ tuyệt hảo!"
  bp1_yearly.5803.b:0 "Ta thích mấy loại nhựa cây này."
  bp1_yearly.5803.c:0 "Gỗ đàn hương à? Thật lạ."
  bp1_yearly.5803.d:0 "Mấy mảnh này gọi là 'oud' sao? Mùi ngọt thật!"
  bp1_yearly.5803.oak:0 "[perfume_bottle.GetDesc], gỗ sồi mạnh mẽ"
  bp1_yearly.5803.resin:0 "[perfume_bottle.GetDesc], nhựa cây hổ phách"
  bp1_yearly.5803.sandalwood:0 "[perfume_bottle.GetDesc], đàn hương mịn màng"
  bp1_yearly.5803.oud:0 "[perfume_bottle.GetDesc], oud dính và đậm mùi"

  bp1_yearly.5804.t:0 "$bp1_yearly.5800.t$: Giọt cuối cùng"
  bp1_yearly.5804.desc:0 "Dù không ngờ tới, ta lại khá thích thú với hành trình tìm nguyên liệu làm nước hoa của mình. Vì thế, ta đầy mong đợi khi nghe nói ở một thị trấn gần đây có một người bán hàng sở hữu vài món cực kỳ hiếm và đáng thèm muốn.\n\nTa xem qua hàng hóa. Vài bó cỏ khô, một loại bột trắng và... thứ gì đó trông như những cục đá xám vụn vô giá trị?\n\nNgười bán nhìn ta đầy chờ đợi khi [surprised_sniffer.GetFirstName] quan sát đống hàng."
  bp1_yearly.5804.a:0 "Ít nhất thì cỏ khô này cũng thơm."
  bp1_yearly.5804.a.tt:0 "Ngài mua cỏ vetiver."
  bp1_yearly.5804.b:0 "Ta đoán loại bột trắng này sẽ cô đặc tốt."
  bp1_yearly.5804.b.tt:0 "Ngài mua long não."
  bp1_yearly.5804.c:0 "Ngươi nói đây là #EMP nôn của cá voi#! sao?!"
  bp1_yearly.5804.c.tt:0 "Ngài mua long diên hương."
  bp1_yearly.5804.d:0 "Mấy thứ này trông chẳng dùng được chút nào!"

  bp1_yearly.5805.t:0 "$bp1_yearly.5800.t$: Hương thơm quyến rũ"
  bp1_yearly.5805.desc:0 "Sau khi đưa toàn bộ nguyên liệu thu thập được cho một nghệ nhân địa phương vài ngày trước, ta vừa háo hức vừa hồi hộp khi mở lớp da bọc của lọ nước hoa thành phẩm.\n\nBên trong là một chiếc lọ nhỏ, đơn giản, chứa hỗn hợp màu sắc; ban đầu là [ROOT.Char.Custom('GetSimpleColor')], nhưng khi đưa ra ánh sáng thì lại chuyển thành [ROOT.Char.Custom('GetComplexColor')].\n\nTa mở nút chặn thô sơ và khứu giác lập tức được vuốt ve bởi mùi hương. Ta hào hứng gọi [surprised_sniffer.GetFirstName] lại, và cả hai cùng trầm trồ trước mùi hương lan tỏa khắp [ROOT.Char.Custom('GetRoom')]."
  bp1_yearly.5805.a:0 "Ta cảm thấy mình là [ROOT.Char.GetWomanMan] giàu có nhất thế giới!"
  bp1_yearly.5805.b:0 "Ta sẽ chiết một ít; lọ này để người thương giữ."
  bp1_yearly.5805.vetiver:0 "[perfume_bottle.GetDesc] cùng vetiver gỗ và da thuộc."
  bp1_yearly.5805.camphor:0 "[perfume_bottle.GetDesc] cùng long não thảo mộc cay nồng."
  bp1_yearly.5805.ambergris:0 "[perfume_bottle.GetDesc] cùng long diên hương ngọt và trầm."
  bp1_yearly.5805.blended:0 "[perfume_bottle.GetDesc] tỏa ra một mùi hương ngọt ngào."
 
  bp1_yearly.5708.t:0 "Người Ngài trung thành"
  bp1_yearly.5708.start:0 "Ta đang đi dạo trong một con hẻm đông đúc cùng người bạn [heathen_friend.GetFirstName] thì [heathen_friend.GetSheHe] đột nhiên biến mất. Ta quay lại và thấy [heathen_friend.GetHerHim] đang mải mê trò chuyện với một thương nhân, người có vẻ như chỉ bán những món đồ trang sức nhỏ kỳ lạ. [heathen_friend.GetFirstNameNoTooltip|U], sau khi hoàn tất giao dịch, thong thả quay trở lại chỗ ta, lơ đãng xoay xoay món đồ mới mua của [heathen_friend.GetHerHis] trong tay.\n\n"
  bp1_yearly.5708.normal:0 "\"Đây là một biểu tượng tôn giáo. Không thuộc đức tin [ROOT.Char.GetFaith.GetAdjective] của Ngài, [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)], mà là của Ta.\" [heathen_friend.GetSheHe] giải thích. Một nụ cười thoáng qua trên khuôn mặt [heathen_friend.GetHerHis] khi [heathen_friend.GetSheHe] nhìn thấy biểu tượng của ta treo trên sợi dây quanh cổ."
  bp1_yearly.5708.aniconist:0 "\"Đây là một que hương nhỏ, [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)]. Ta thấy nó giúp tập trung tinh thần khi thực hành đức tin của mình.\" [heathen_friend.GetSheHe] giải thích. Một nụ cười thoáng qua trên khuôn mặt [heathen_friend.GetHerHis] khi [heathen_friend.GetSheHe] nhìn ta."
  bp1_yearly.5708.end:0 "\"Ta luôn trân trọng việc Ngài đối xử tốt với Ta dù chúng ta khác biệt về thần học.\""
  bp1_yearly.5708.a:0 "Đúng là tà giáo nhảm nhí!"
  bp1_yearly.5708.b:0 "Ừ thì, nếu [heathen_friend.GetFirstNameNoTooltip] không đến nỗi tệ, thì..."
  bp1_yearly.5708.b.tt:0 "Tất cả chư hầu khác-[faith|E] có đặc điểm [GetTrait('zealous').GetName( GetNullCharacter )] mất #negative_value 10#! [opinion|E] về Ngài"
  bp1_yearly.5708.c:0 "Có lẽ ta có thể học được điều gì đó từ [heathen_friend.GetFirstNameNoTooltip]?"
  bp1_yearly.5708.c.tt.success:0 "Ngài hiểu thêm về lối sống của [heathen_friend.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.5708.c.tt.failure:0 "Ngài không thể hiểu được lối sống của [heathen_friend.GetFirstNamePossessiveNoTooltip]"
  
  bp1_yearly.5709.t:0 "Câu rồi, mắc câu..."
  bp1_yearly.5709.desc:0 "Một ngày thật tuyệt để đi câu cá! Ta cảm thấy chẳng điều gì có thể xóa nụ cười trên mặt mình, nếu không có giọng nói phía sau và Ngài câu của ta là [friend_backup.GetFirstName].\n\n\"Xem ai kìa!\" [rival_on_sight.GetFirstName], rõ ràng vừa trở về từ chuyến câu cá của riêng [rival_on_sight.GetHerHis], đứng cạnh [rival_friend.GetFirstName]. Người trước cúi xuống nhấc một con cá còn đang quẫy. \"Giống nhau đến #EMP kinh ngạc#!!\"\n\nTa định quay đi với một cái đảo mắt kịch tính, nhưng một tiếng #EMP bịch#! và cảm giác ướt lạnh chảy dọc sau gáy khiến ta đứng sững. Đôi mắt [friend_backup.GetFirstNamePossessiveNoTooltip] nheo lại khi [friend_backup.GetSheHe] nhìn con cá vừa bị ném vào chúng ta."
  bp1_yearly.5709.a:0 "Giải quyết bằng nắm đấm thôi!"
  bp1_yearly.5709.a.tt.success:0 "Ngài thắng cuộc ẩu đả"
  bp1_yearly.5709.a.tt.failure:0 "Ngài thua cuộc ẩu đả"
  bp1_yearly.5709.b:0 "[rival_on_sight.GetFirstNameNoTooltip], đồ [rival_on_sight.Custom2('InsultNoun', ROOT.Char)]! Đấu tay đôi với ta!"
  bp1_yearly.5709.b.tt:0 "Bắt đầu một $game_concept_single_combat_duel$ với [rival_on_sight.GetFirstNameNoTooltip]"
  bp1_yearly.5709.c:0 "Ta sẽ không sa vào trò ấu trĩ này."
  bp1_yearly.5709.c.tt:0 "Ngài bỏ mặc họ với hành vi trẻ con của mình."

  bp1_yearly.5711.t:0 "...Và Chìm Nghỉm"
  bp1_yearly.5711.desc:0 "[rival_on_sight.GetFirstName] loạng choạng đứng dậy sau trận đấu tay đôi với chúng ta, vẫn còn ngu ngốc tỏ vẻ thách thức. [rival_on_sight.GetSheHe|U] mở miệng định phàn nàn nhưng hầu như không thốt ra được lời nào trước khi ta nhét con cá vừa mới được dùng làm đạn phóng vào chính cái miệng đó. Choáng váng, [rival_on_sight.GetFirstNameNoTooltip] loạng choạng nguy hiểm về phía mép bến tàu.\n\nTa nhanh chóng bước tới và đặt thẳng một chân vào bụng [rival_on_sight.GetHerHis]. Trong khoảnh khắc tưởng như kéo dài vô tận, [rival_on_sight.GetSheHe] lơ lửng giữa không trung: hai tay quơ loạn xạ, đôi mắt trợn tròn, con cá vẫn dính chặt trên mặt, trước khi bất ngờ rơi thẳng xuống dưới.\n\nCú rơi tạo ra một tiếng nước bắn vang trời, tạo thành một cột nước lớn, và [rival_friend.GetFirstName] kinh hãi vội vàng chạy đến mép cầu cảng, chìa tay ra để cứu người bạn đang sặc nước của [rival_friend.GetHerHis]."
  bp1_yearly.5711.a:0 "Ngươi cũng xuống đó đi!"
  bp1_yearly.5711.b:0 "Ha ha! Đáng đời lắm!"

  bp1_yearly.5712.t:0 "Có Gì Đó… Rất Cá?"
  bp1_yearly.5712.desc:0 "Trong cơn giận dữ, ta chống người đứng dậy để đối mặt với những tiếng chế giễu nhạo báng của [rival_on_sight.GetFirstName] và kẻ tay sai [rival_friend.GetFirstName] của [rival_on_sight.GetHerHis]. Tuy nhiên, vì vẫn còn loạng choạng khi đứng trên đôi chân của mình, cú chọc ngón tay mà ta định đâm vào ngực [rival_on_sight.GetFirstNamePossessiveNoTooltip] lại khiến ta lao vụt qua người [rival_on_sight.GetHerHim]. Chỉ cần một cú quét chân của [rival_on_sight.GetHerHis] là đột nhiên tầm nhìn của ta một lần nữa bị che phủ bởi bụi đất.\n\n[rival_on_sight.GetFirstNameNoTooltip], nở nụ cười đầy thích thú, vỗ tay mỉa mai khi ta lăn ngửa ra sau. Cơn phẫn nộ trong ta lại dâng lên, nhưng ta còn chưa kịp ngồi dậy hoàn toàn thì con cá chết tiệt kia đã một lần nữa đập thẳng vào mặt ta bằng một tiếng #EMP bốp# vang dội!! [rival_on_sight.GetFirstNameNoTooltip] và [rival_friend.GetFirstNameNoTooltip] phá lên cười lớn khi bỏ đi, để lại [friend_backup.GetFirstName] đầy lo lắng cuối cùng phải kéo ta đứng dậy."
  bp1_yearly.5712.a:0 "Ta sẽ không quên chuyện này đâu, [rival_on_sight.GetFirstNameNoTooltip]!"
  bp1_yearly.5712.b:0 "Có lẽ tốt hơn là ta nên tránh xa [rival_on_sight.GetHerHis]..."

  bp1_yearly.5713.t:0 "Quan Hệ Liều Lĩnh"
  bp1_yearly.5713.desc:0 "Ta có thể nhận ra có điều gì đó không ổn với [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('destitute_spouse'))] của ta, [destitute_spouse.GetFirstName], ngay khi chúng ta nằm cạnh nhau trên giường. [destitute_spouse.GetSheHe|U] rõ ràng đang mất tập trung, và ta nhẹ nhàng nắm lấy tay [destitute_spouse.GetHerHis] khi hỏi xem có chuyện gì.\n\n"Đó là... chuyện tiền bạc." [destitute_spouse.GetSheHe] thở dài, đưa bàn tay còn lại vuốt qua đầu [destitute_spouse.GetHerHis]. "Ta có một vài người thân đang gặp vận rủi, và họ sắp mất nhà rồi. Khi còn nhỏ ta từng dành thời gian ở đó..."\n\n[destitute_spouse.GetSheHe|U] nhìn ta với vẻ van nài. "Có... có cách nào chúng ta có thể giúp họ không? Ta chắc chắn họ có thể trả lại tiền cho chúng ta, họ chỉ cần có cơ hội vực dậy thôi. Họ sẽ trả được, ta thề đấy!""
  bp1_yearly.5713.a:0 "Để ta lo. Giờ thì, để ta #EMP lo#! cho #EMP nàng…#!"
  bp1_yearly.5713.b:0 "Họ muốn bao nhiêu cũng được, thậm chí hơn thế."
  bp1_yearly.5713.c:0 "Cứ để ta xử lý."
  bp1_yearly.5713.d:0 "Sao ngươi dám tìm cách tống tiền ta?!"

  bp1_yearly.5714.t:0 "Nói Lời Vĩnh Biệt"
  bp1_yearly.5714.desc:0 "Trong tim ta là một khoảng trống sâu thẳm và vô tận.\n\n[deceased_pal.GetFirstName] từng là người Ngài đồng hành và tri kỷ không thể thiếu, và việc [deceased_pal.GetHerHim] bị cướp khỏi cuộc đời ta giống như một vết thương chí mạng mà ta sẽ không bao giờ hồi phục. Tay ta siết chặt bức thư [deceased_pal.GetSheHe] đã trao cho ta — bức thư #EMP cuối cùng#! mà [deceased_pal.GetSheHe] từng gửi, ta cay đắng nhận ra. Ta cố đọc nó, nhưng chỉ có thể đưa nó ra xa, để những dòng chữ quý giá ấy không bị nước mắt ta làm nhòe đi.\n\nDù quanh ta có rất nhiều người đến đưa tang, ta chưa bao giờ cảm thấy cô độc đến thế."
  bp1_yearly.5714.a:0 "Ta sẽ không bao giờ quên ngày hôm nay."
  bp1_yearly.5714.a.catharsis:0 "#weak Ngươi trải qua một mức độ giải tỏa nào đó#!"
  bp1_yearly.5714.a.sad:0 "#weak Nỗi đau của ngươi tuôn trào#!"
  bp1_yearly.5714.a.reallysad:0 "#weak Nỗi đau nhấn chìm ngươi#!"
  bp1_yearly.5714.a.depressed:0 "#weak Ngươi rơi vào trầm uất#!"
  bp1_yearly.5714.b:0 "Ta phải mạnh mẽ và bước tiếp."

  bp1_yearly.5715.t:0 "Kẻ Ngốc Lảm Nhảm"
  bp1_yearly.5715.desc:0 ""Không! Đó hoàn toàn không phải cách ngươi nói nó! Vị học giả đáng kính đã #EMP phát minh#! ra từ này đã nói rằng nó được phát âm theo cách ta đang nói đây-"\n\nTa và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('gibbet_friend'))] của ta, [gibbet_friend.GetFirstName], đang có một cuộc tranh luận nảy lửa không có dấu hiệu chấm dứt. Sau khi đi ngang qua một giá treo cổ gần đó, [gibbet_friend.GetSheHe] đã nhận xét về nó. Vì bản thân thông thạo ngôn ngữ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], ta nhẹ nhàng sửa cách phát âm của [gibbet_friend.GetHerHim] — rõ ràng nó bắt đầu bằng một âm cứng chứ không phải âm mềm — và [gibbet_friend.GetSheHe] lại cả gan phản đối, hơn nữa còn phản đối một cách vô cùng gay gắt!\n\n"Ta không thể tin được ngươi vẫn còn cố chấp giữ lấy quan điểm ngôn ngữ [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('gibbet_friend'))] này!" [gibbet_friend.GetSheHe] thốt lên đầy bực bội vì sự khăng khăng của ta.""
  bp1_yearly.5715.a:0 "Chúng ta đồng ý là bất đồng."
  bp1_yearly.5715.b:0 "Cứ như ta nói. Thế là hết!"
  bp1_yearly.5715.c:0 "Đó là 'gibbet', và ta sẽ chứng minh!"
  bp1_yearly.5715.c.tt.success:0 "Ngươi thắng cuộc tranh luận"
  bp1_yearly.5715.c.tt.failure:0 "Ngươi thua cuộc tranh luận"
  bp1_yearly.5716.t:0 "Cút Đi, [ROOT.Char.GetFaith.random_EvilGodNames]!"
  bp1_yearly.5716.desc:0 "Khi đang đi dạo trong [ROOT.Char.Custom('GetCourt')] của mình, ta nghe thấy một giọng nói cao vút, gần như giận dữ. Ta quay lại và bắt gặp một cảnh tượng bất thường. [book_burner.GetFirstName] đang đứng, sừng sững trước [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_child'))] [book_child.GetFirstName], quát mắng [book_child.GetHerHim] trong khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_burner'))] của ta ném thêm một cuốn sách vào ngọn lửa đang cháy rực.\n\n\"Ngươi sẽ không đọc thêm thứ #EMP rác rưởi ô uế#!! này nữa đâu!\" [book_burner.GetSheHe] gầm lên, kết án thêm một cuốn sách nữa vào lửa. \"Không đứa trẻ nào trong nhà này sẽ chịu ảnh hưởng của [ROOT.Char.GetFaith.DevilNamePossessive]!\""
  bp1_yearly.5716.nobook:0 "\n\nTa nhặt một cuốn sách từ đống mà [book_burner.GetFirstNameNoTooltip] đã đánh dấu để tiêu hủy, chỉ thấy nội dung vô hại về… việc xây những lâu đài tí hon bằng đất?"
  bp1_yearly.5716.yesbook:0 "\n\nTa nhặt [burned_book.GetName] từ đống mà [book_burner.GetFirstNameNoTooltip] đã đánh dấu để tiêu hủy đúng lúc [book_burner.GetSheHe] cũng chộp lấy nó."
  bp1_yearly.5716.a:0 "Tội lỗi này sẽ không được dung thứ!"
  bp1_yearly.5716.b:0 "Thôi được, miễn giữ hòa khí…"
  bp1_yearly.5716.c:0 "Dừng lại ngay! Đứa trẻ phải được học!"

  bp1_yearly.5717.t:0 "Ẩu Đả Say Xỉn"
  bp1_yearly.5717.desc:0 "Quán rượu ở [tavern_county.GetNameNoTier] thường là nơi hoàn hảo để quên đi những muộn phiền của thế giới, nhưng đêm nay lại là một ngoại lệ.\n\nThật không may, do vận rủi, chỉ cách một chiếc bàn từ chỗ [bff_defender.GetFirstName] và ta đang ngồi là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('5717_nemesis'))] của ta, [5717_nemesis.GetFirstName], và [5717_nemesis.GetSheHe] đã gây phiền toái kể từ khi chúng ta bước vào đây. Chỉ cần thêm một lần "vô tình" làm đổ [5717_nemesis.Custom('RegionalDrink')] của [5717_nemesis.GetHerHis] lên cánh tay ta, và đột nhiên [bff_defender.GetFirstNameNoTooltip] đã đứng bật dậy.\n\n[5717_nemesis.GetFirstNameNoTooltip] cũng đứng lên, và cả hai đang trong quá trình đối đầu với nhau một cách khá say xỉn thì ta cuối cùng cũng kịp tự mình đứng dậy."
  bp1_yearly.5717.a:0 "Đấm thẳng vào mặt [5717_nemesis.GetHerHim] đi, [bff_defender.GetFirstNameNoTooltip]!"
  bp1_yearly.5717.a.tt.win:0 "[bff_defender.GetNameNoTooltip] thắng trận"
  bp1_yearly.5717.a.tt.lose:0 "[bff_defender.GetNameNoTooltip] thua trận"
  bp1_yearly.5717.b:0 "[5717_nemesis.GetSheHe|U] không đáng đâu, Ngài hiền!"
  bp1_yearly.5717.c:0 "Tránh ra; [5717_nemesis.GetFirstNameNoTooltip] là của ta."
  bp1_yearly.5717.c.tt:0 "#weak Hai người các ngươi mang mâu thuẫn ra ngoài giải quyết…#!"
  bp1_yearly.5717.c.tt.duel:0 "Bắt đầu một [single_combat_duel|E] giữa ngươi và [5717_nemesis.GetFirstNameNoTooltip]"

  bp1_yearly.5718.t.win:0 "Ngươi thắng trận"
  bp1_yearly.5718.t.lose:0 "Ngươi thua trận"

  bp1_yearly.5719.t:0 "Tình Thế Thuế Má"
  bp1_yearly.5719.start:0 "Suốt nhiều ngày nay, tể tướng của ta là [chancellor.GetFirstName] đã nhận thấy có một phần thu nhập không được ghi nhận. Giờ đây, khi bằng chứng đã rõ ràng, ta gọi chư hầu [disloyal_vassal.GetFirstName] đến để làm rõ sự việc.\n\nBằng chứng của [chancellor.GetFirstNamePossessiveNoTooltip] là kết luận không thể chối cãi; [disloyal_vassal.GetFirstNameNoTooltip] đã biển thủ tiền thuế đáng lẽ thuộc về ta!"
  bp1_yearly.5719.normal:0 "[disloyal_vassal.GetTitleAsNameNoTooltip|l] tham nhũng không cố gắng bào chữa cho [disloyal_vassal.GetHerselfHimself], chỉ nở một nụ cười tự mãn.\n\n"Tất cả đều là sự thật, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta chỉ muốn có thêm chút của cải mà thôi."\n\nĐây là một lời thách thức công khai đối với quyền lực của ta."
  bp1_yearly.5719.terrified:0 "[disloyal_vassal.GetTitleAsNameNoTooltip|l] tham nhũng cố gắng bào chữa cho [disloyal_vassal.GetHerselfHimself], nhưng lại chật vật không thể tìm ra lời nào để nói, run sợ trước cơn thịnh nộ của ta.\n\nTa có thể nhìn thấy nỗi sợ trong mắt [disloyal_vassal.GetHerHis] khi ta đi tới đi lui trước mặt [disloyal_vassal.GetHerHim], cố ý thể hiện như đang cân nhắc quyết định của mình."
  bp1_yearly.5719.a:0 "Ngươi sẽ trả lại số tiền đó và nhớ lấy ngày hôm nay!"
  bp1_yearly.5719.a.tt.dread:0 "#medium Lựa chọn này khả dụng nhờ mức [dread|E] cao của ngươi #!"
  bp1_yearly.5719.b:0 "Trả lại tiền. Ngay."
  bp1_yearly.5719.b.tt.win:0 "[disloyal_vassal.GetFirstNameNoTooltip] miễn cưỡng trả lại tiền"
  bp1_yearly.5719.b.tt.lose:0 "[disloyal_vassal.GetFirstNameNoTooltip] công khai khinh thường yêu cầu của ngươi"
  bp1_yearly.5719.c:0 "Có lẽ chúng ta có thể thỏa hiệp?"
  bp1_yearly.5719.d:0 "Chỉ cần… đừng làm thế nữa!"

  bp1_yearly.5720.t:0 "Thử Thách Sức Mạnh"
  bp1_yearly.5720.desc:0 "Ta đã uống vài cốc [ROOT.Char.Custom('RegionalDrink')] trong bữa tiệc này, nhưng sự hiện diện đáng ghét của [rival_challenger.GetFirstName] phá hỏng cả buổi tối.\n\n\"Đồ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]! Đồ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]!\" [rival_challenger.GetSheHe] gào lên. \"Ngươi còn không thắng nổi một đứa trẻ trong thử thách sức mạnh! Ta có thể đè tay ngươi xuống bàn ngay bây giờ mà chẳng tốn chút sức nào!\""
  bp1_yearly.5720.a:0 "Dĩ nhiên rồi; bằng #EMP tay trái#! chứ?"
  bp1_yearly.5720.a.tt:0 "Chuyện này có thể khiến ta không được lòng trong [THIS.Char.Custom('GetCourt')], nhưng sẽ #EMP đã#! lắm…"
  bp1_yearly.5720.b:0 "Ha! Ha! Vậy thì tới đi!"
  bp1_yearly.5720.b.tt.win:0 "Ngươi đánh bại [rival_challenger.GetNameNoTooltip] một cách khinh thường"
  bp1_yearly.5720.b.tt.bigwin:0 "Ngươi làm gãy tay của [rival_challenger.GetNamePossessiveNoTooltip]"
  bp1_yearly.5720.c:0 "Chứng minh đi, đồ [rival_challenger.Custom2('InsultNoun', ROOT.Char)]!"
  bp1_yearly.5720.c.tt.win:0 "Ngươi thắng [rival_challenger.GetFirstNameNoTooltip]"
  bp1_yearly.5720.c.tt.lose:0 "[rival_challenger.GetFirstNameNoTooltip] đè tay ngươi xuống bàn"
  bp1_yearly.5720.d:0 "Ta sẽ không bị lôi vào những trò trẻ con này."

  bp1_yearly.5721.t:0 "Quanh Đống Lửa"
  bp1_yearly.5721.desc:0 "Một đêm thật đẹp! Đống lửa trại tí tách cháy, phả khói lên bầu trời đêm. Món ngọt xiên trên đầu que của ta từ từ caramen hóa, và ta chăm chú nhìn màu sắc của nó dần đổi thay.\n\nBên cạnh ta, [marshmallow_friend.GetFirstName] cũng đang làm điều tương tự, khi người lớn uống [ROOT.Char.Custom('RegionalDrink')] và kể cho nhau nghe những câu chuyện rất lâu về trước, từ nhiều năm trước khi cả hai chúng ta ra đời.\n\nTa và [marshmallow_friend.GetSheHe|U] chưa nói chuyện nhiều, nhưng thật tuyệt nếu lần này có thể trò chuyện với ai đó cùng trang lứa…"
  bp1_yearly.5721.a:0 "Cậu… cậu muốn làm Ngài với tớ không, [marshmallow_friend.GetFirstNameNoTooltip]?"
  bp1_yearly.5721.a.tt.yes:0 "Ngươi kết bạn"
  bp1_yearly.5721.a.tt.no:0 "[marshmallow_friend.GetFirstNameNoTooltip] không hứng thú"
  bp1_yearly.5721.b:0 "Vui thật đấy!"
  bp1_yearly.5721.c:0 "Ta muốn thêm một món ngọt nữa…"
  bp1_yearly.5721.c.tt:0 "Chỉ cần đánh lạc hướng một chút, có lẽ ngươi có thể chộp lấy món ngọt mà [marshmallow_friend.GetSheHe] đang nướng…"
 
  bp1_yearly.5722.t:0 "Máy Phóng Mèo"
  bp1_yearly.5722.desc:0 "\"Chúng ta lại gặp nhau rồi, [ROOT.Char.GetFirstName], đồ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_catapulter'))]!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_catapulter'))] của ta, [rival_catapulter.GetFirstName], cười khẩy khi [rival_catapulter.GetSheHe] chặn ta lúc ta đang kiểm tra vài trang bị quân sự mới. \"Cuối cùng thì hai kẻ danh dự cũng gặp nhau trên thế ngang bằng—ha! Bắt được rồi!\"\n\nTa mất một lúc mới nhận ra [rival_catapulter.GetFirstNameNoTooltip] vừa chộp lấy con mèo của ta, [ROOT.Char.Custom('CatStoryName')], và thêm một lúc nữa mới hiểu rằng [rival_catapulter.GetSheHe] đang bỏ chạy. Khi hết bàng hoàng, ta rầm rập đuổi theo [rival_catapulter.GetHerHim] chỉ để thấy [rival_catapulter.GetHerHim] đang nhét thú cưng yêu quý của ta vào một máy bắn đá gần đó!\n\nTa bước lên một bước, vươn tay ra, nhưng đã quá muộn.\n\n\"Mraaaao#DIE1 ooooo#!#DIE2 oooowwww—#!\""
  bp1_yearly.5722.a:0 "Không đời nào!"
  bp1_yearly.5722.a.tt:0 "Ngươi quật ngã [rival_catapulter.GetFirstNameNoTooltip] trước khi [rival_catapulter.GetSheHe] kịp trốn thoát"
  bp1_yearly.5722.b:0 "[ROOT.Char.Custom('CatStoryName')]! #EMP Khôngggg!#!"
  bp1_yearly.5722.c:0 "Ta sẽ bắt được ngươi, [rival_catapulter.GetFirstNameNoTooltip]! TA THỀ ĐẤY!"

  bp1_yearly.5723.t:0 "Cú Bắn Xa"
  bp1_yearly.5723.desc:0 "Đôi mắt của [rival_catapulter.GetFirstNamePossessive] mở to vì kinh ngạc và sợ hãi khi ta vật [rival_catapulter.GetHerHim] xuống đất.\n\n"Ngươi có thể đã làm ta bị thương." Ta nói với giọng trầm, đứng dậy một lần nữa và yêu cầu những lính canh đang có mặt đưa cho ta một sợi dây.\n\n"Ngươi thậm chí còn có thể đã làm tổn thương gia đình ta." Ta tiếp tục nói, trói chặt tay chân của kẻ xấu số đang bị bắt giữ.\n\n"Nhưng ngươi đã phạm phải sai lầm chí mạng khi làm tổn thương #EMP [ROOT.Char.Custom('CatStoryName')]#!." [rival_catapulter.GetFirstNameNoTooltip], với các chi bị trói đang run rẩy, mở miệng định van xin.\n\nTa đưa tay về phía cần gạt."
  bp1_yearly.5723.a:0 "#EMP Bwoing!#!"
  bp1_yearly.5723.b:0 "Ta sẽ tha cho ngươi. Vì [ROOT.Char.Custom('CatStoryName')]."

  bp1_yearly.5724.t:0 "[ROOT.Char.Custom('CatStoryName')]: Mèo Vẫn Ổn"
  bp1_yearly.5724.desc:0 "Ba ngày qua của ta trôi qua dưới một đám mây u ám. [ROOT.Char.Custom('CatStoryName')] bé bỏng, vô tội của ta… đôi lúc ta tưởng như vẫn nghe thấy tiếng meo meo.\n\nKhông, khoan… ta #EMP thật sự#! nghe thấy tiếng meo. Ta thề là có! Vụng về lao qua phòng trong niềm phấn khích, ta vấp phải một chiếc bàn thấp ngang ống chân. Nguyền rủa, ta gượng đứng dậy. Một tiếng meo khác vang lên, to hơn và ai oán. Cuối cùng ta tới cửa và giật mạnh mở ra, thấy [ROOT.Char.Custom('CatStoryName')] đang ngồi đó: an toàn, nguyên vẹn và cực kỳ khó chịu!\n\nTa lập tức bế con mèo yêu dấu vào lòng, vùi mặt vào bộ lông bẩn dính đầy cành lá.\n\n[ROOT.Char.Custom('CatStoryName')] giãy giụa giận dữ trong tay ta."
  bp1_yearly.5724.a:0 "[ROOT.Char.Custom('CatStoryName')]! Ngươi #EMP còn sống!#!"
  bp1_yearly.5724.b:0 "Ta sẽ không bao giờ buông ngươi ra nữa!"

  bp1_yearly.5725.t:0 "[khutulun.GetWomanMan|U] Hoang Dã"
  bp1_yearly.5725.desc:1 ""#EMP Làm sao#! mà ngài chưa từng nghe nói về [khutulun.GetHerHim] chứ, [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\nTa đảo mắt và khịt mũi đầy vẻ khinh thường. Nói rằng những câu chuyện viển vông của [matchmaker_courtier.GetFirstName] lúc này không xứng đáng để ta bận tâm còn là nói giảm đi.\n\n"Họ nói rằng [khutulun.GetSheHe] đang đưa ra lời thách đấu công khai với bất kỳ ai, thưa [ROOT.Char.GetLadyLord] của ta!" [matchmaker_courtier.GetFirstNameNoTooltip] lại cố gắng một lần nữa, lần này với vẻ kiên quyết hơn. Hạ thấp giọng một cách đầy bí mật, [matchmaker_courtier.GetSheHe] tiếp tục. "Nghe này, ta biết ngài đã chán ngấy những câu hỏi về chuyện hôn nhân rồi. [khutulun.GetWomanMan] này sẽ trao tay [khutulun.GetHerHis] cho bất kỳ ai có thể đánh bại [khutulun.GetHerHim] về khả năng thể chất."\n\nTa ngồi tựa lại và suy ngẫm về câu chuyện. Một [khutulun.GetWomanMan] có thiên hướng võ nghệ sao? Chắc chắn ta có thể giành chiến thắng và mang về một [khutulun.GetWifeHusband] mới bên cạnh, bất kể kỹ năng của [khutulun.GetHerHis] có ra sao đi nữa."
  bp1_yearly.5725.a:0 "Được thôi, [matchmaker_courtier.GetFirstNameNoTooltip], chúng ta sẽ lên đường điều tra."
  bp1_yearly.5725.b:0 "Đủ rồi với mấy chuyện hoang đường của ngươi!"

  bp1_yearly.5726.t:0 "Một [khutulun.Custom('GetBrideGroom')|U] đáng gờm"
  bp1_yearly.5726.desc:0 "Sau một ngày dài cưỡi ngựa vất vả, chúng ta đến địa điểm mà [matchmaker_courtier.GetFirstName] nghe nói đối tượng của chúng ta thường lui tới, và bắt gặp một cảnh tượng đầy bất ngờ. Một [khutulun.GetWomanMan] nhanh nhẹn hiện đang vật lộn với một [dummy_gender.GetWomanMan] to lớn hơn nhiều.\n\nThông thường, đây hẳn sẽ là một trận đấu hoàn toàn không cân sức, nhưng chỉ một lát sau, cuộc so tài đã bất ngờ kết thúc; nhân vật đầu tiên, nở một nụ cười rộng trên mặt, hào hiệp đỡ [khutulun.GetHerHis] đối thủ đứng dậy trước khi liếc mắt sang phía ta.\n\n"Ta chưa từng thấy ngươi quanh vùng này trước đây!" [khutulun.GetSheHe] nhếch mép cười khi [khutulun.GetSheHe] nói với ta, đồng thời cúi người chào một cách khoa trương đầy mỉa mai. "Tên ta là [khutulun.GetFirstName]. Ta biết lý do ngươi đến đây, nhưng để ta cảnh báo trước: bất kỳ ai lãng phí thời gian của ta đều phải trả cho ta một khoản tiền vì những phiền toái mà họ gây ra.""
  bp1_yearly.5726.a:0 "Hãy chào [ROOT.Char.GetWifeHusband] mới của ngươi đi, [khutulun.GetFirstNameNoTooltip]!"
  bp1_yearly.5726.a.tt.win:0 "Ngài đánh bại [khutulun.GetFirstNameNoTooltip]"
  bp1_yearly.5726.a.tt.lose:0 "[khutulun.GetSheHe|U] đánh bại Ngài"
  bp1_yearly.5726.b:0 "Có lẽ thận trọng vẫn hơn là liều lĩnh..."

  bp1_yearly.5727.t:0 "Chuông Cưới?"
  bp1_yearly.5727.desc:0 "[khutulun.GetFirstName] thở hắt ra đầy mệt mỏi khi chúng ta lại phá thế khóa của nhau. Ta cũng không khá hơn là bao; rõ ràng đây là lý do tại sao [khutulun.GetSheHe] vẫn chưa kết hôn. [khutulun.GetSheHe|U] mỉm cười, hài lòng với thử thách này.\n\n"Ngươi sẽ là một [ROOT.Char.GetWomanMan] rất tốt dành cho ta đấy!" [khutulun.GetSheHe] nhận xét, mắt vẫn không rời khỏi từng chuyển động của ta. "Thật đáng tiếc là ta sẽ phải khiến ngươi thất vọng!"\n\n[khutulun.GetFirstNameNoTooltip] lại lao về phía trước, nhưng lần này ta đã sẵn sàng. Một cú né sang bên đầy khéo léo khiến [khutulun.GetHerHim] mất thăng bằng, và một cú móc chân quét quanh [khutulun.GetHersHis] khiến [khutulun.GetHerHim] ngã xuống.\n\nKhuôn mặt của [khutulun.GetHerHis|U] là sự pha trộn giữa kinh ngạc, sửng sốt và phấn khích khi ta đưa tay ra giúp [khutulun.GetHerHim] đứng dậy."
  bp1_yearly.5727.a:0 "Giao kèo là giao kèo."
  bp1_yearly.5727.b:0 "Ta đã đạt được điều mình cần rồi."
  bp1_yearly.5727.c:0 "Chỉ điều tốt nhất mới xứng với [khutulun.GetFirstNameNoTooltip]!"

  bp1_yearly.5728.t:0 "Thù Hận Bùng Cháy"
  bp1_yearly.5728.desc:0 "Tia lửa từ đống lửa trại lững lờ bay lên bầu trời đêm, hòa cùng làn khói, nhưng Ta không sao tận hưởng được khung cảnh quen thuộc ấy.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_burner'))] của Ta, [rival_burner.GetFirstName], đứng hiên ngang trước ngọn lửa, thách thức Ta tiến lại gần. Trong tay [rival_burner.GetHerHis] là chính cổ vật của Ta: [burned_artifact.GetName], thứ đã bị tên rắn độc ấy đánh cắp.\n\n\"Đứng lại đó, [ROOT.Char.GetFirstName]!\" [rival_burner.GetSheHe] hét lớn. \"Chỉ cần ngươi nhúc nhích, bảo bối của ngươi sẽ hóa tro!\"\n\n\"[rival_burner.GetFirstNameNoTooltip]!\" Ta gào lên. \"Trả lại cho ta thứ thuộc về ta, và chúng ta sẽ chấm dứt thù hằn!\" Đáp lại chỉ là một nụ cười nham hiểm, khi [rival_burner.GetFirstNameNoTooltip] đưa món đồ của Ta sát hơn với ngọn lửa."
  bp1_yearly.5728.a:0 "Cứ đốt đi, đồ [rival_burner.Custom2('InsultNoun', ROOT.Char)]!"
  bp1_yearly.5728.b:0 "Ăn cắp ư? Hay ngươi sợ phải đối mặt với ta?"
  bp1_yearly.5728.b.tt.duel:0 "Bắt đầu một [single_combat_duel|E] giữa Ngài và [rival_burner.GetFirstNameNoTooltip]"

  bp1_yearly.5729.tt.lose:0 "[rival_burner.GetFirstNameNoTooltip] thiêu rụi món đồ"

  bp1_yearly.5730.t:0 "Nơi Có Khói..."
  bp1_yearly.5730.desc:0 "[rival_burner.GetFirstName] chật vật đứng dậy, thân thể đầy vết bầm và thương tích sau trận đấu tay đôi với ta. Đôi mắt [rival_burner.GetHerHis|U] cháy rực rỡ chẳng khác nào đống lửa trại mà [rival_burner.GetSheHe] đang đứng bên cạnh, khi [rival_burner.GetSheHe] nhìn thấy ta kẹp [burned_artifact.GetName] dưới cánh tay mình.\n\nKhi những người đồng hành của chúng ta quay trở lại từ vị trí trước đó cách đây một quãng, cuộc trò chuyện của họ dần im bặt khi nhận ra hai chúng ta đang đối mặt với nhau, một người chiến thắng, một kẻ thất bại.\n\nTa nhìn vào [burned_artifact.GetNameNoTooltip] của mình, rồi lại nhìn người [rival_burner.GetWomanMan] đã liều cả tính mạng và cơ thể để thiêu hủy nó."
  bp1_yearly.5730.a:0 "Hãy coi đây là bài học dành cho ngươi."
  bp1_yearly.5730.b:0 "Cầm lấy đi. Mong rằng nó sẽ mãi nhắc ngươi nhớ về đêm nay."
  bp1_yearly.5730.b.tt:0 "[burned_artifact.GetName] nhận các hiệu ứng #N tiêu cực#!"

 # Coveted Claim
  bp1_yearly.8000.t:0 "Yêu Sách Đáng Thèm Muốn"
  bp1_yearly.8000.desc:0 "[bp1_8000_informer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_informer'))] của ta, tỏ ra bồn chồn suốt cả ngày, rõ ràng là đang cố tìm lời thích hợp để nói.\n\nCuối cùng, khi chúng ta cùng đi dùng bữa, [bp1_8000_informer.GetSheHe] dè dặt mở lời, \"[bp1_8000_informer.Custom2('RelationToMeShort', ROOT.Char)] của Ta...\""
  bp1_yearly.8000.desc_vassal:0 "người ta nói rằng [bp1_8000_new_rival.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_new_rival'))] của ngài, ngày càng xem những yêu sách được cho là của [bp1_8000_new_rival.GetHerHis] đối với lãnh thổ của ngài một cách nghiêm túc hơn...\""
  bp1_yearly.8000.desc_foreign:1 "ta nghe những lời đồn rằng [bp1_8000_new_rival.GetFirstName], [bp1_8000_new_rival.GetTitleAsNameNoTooltip] của [bp1_8000_new_rival.GetPrimaryTitle.GetBaseNameNoTier], đã coi ngài là trọng tâm trong mối thù địch của [bp1_8000_new_rival.GetHerHis]...\""
  bp1_yearly.8000.desc_single:0 "\n\n\"[bp1_8000_new_rival.GetSheHe|U] công khai nói về '[ROOT.Char.GetTitleAsNameNoTooltip] bất hợp pháp của [bp1_8000_claimed_title.GetNameNoTier]', kẻ ngày ngày chiếm đoạt những vùng đất và nguồn thu hợp pháp của [bp1_8000_new_rival.GetHerHis].\""
  bp1_yearly.8000.desc_multi:0 "\n\n\"[bp1_8000_new_rival.GetSheHe|U] khăng khăng rằng [bp1_8000_new_rival.GetSheHe] đã bị xúc phạm nghiêm trọng bởi việc ngài tiếp tục cai trị lãnh địa hợp pháp của [bp1_8000_new_rival.GetHerHis], đặc biệt là [bp1_8000_claimed_title.GetNameNoTier].\""
  bp1_yearly.8000.a:0 "Ha! Đúng là một tên [bp1_8000_new_rival.Custom2('InsultNoun', ROOT.Char)] độc địa!"
  bp1_yearly.8000.b:0 "Ta sẽ lập tức viết thư cho [bp1_8000_new_rival.GetFirstNameNoTooltip]."
  bp1_yearly.8000.b.success:0 "Bức thư của Ngài làm [bp1_8000_new_rival.GetTitledFirstNameNoTooltip] dịu lại"
  bp1_yearly.8000.b.failure:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] phớt lờ thư của Ngài"
  bp1_yearly.8000.c:0 "Vậy thì đó là phản nghịch."
  bp1_yearly.8000.c.success:0 "Người của Ngài bắt giữ [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
  bp1_yearly.8000.c.failure:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] trốn thoát"
  bp1_yearly.8000.d:0 "Chỉ là những lời đồn nhảm nhí mà thôi."
  bp1_yearly.8000.d.rival:0 "Những lời đồn là sự thật"
  bp1_yearly.8000.d.bluff:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] chỉ đang hù dọa"
  bp1_yearly_8000_trusting_modifier:0 "Chủ Quân Tin Người"
  bp1_yearly_8000_trusting_modifier_desc:0 "Nhân vật này nổi tiếng là luôn cho thần dân của mình lợi thế của sự nghi ngờ."
 # Friends with Benefits
  bp1_yearly.8010.opening:0 "[bp1_8010_best_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp1_yearly.8010.desc:0 "Ta hằng ngày tạ ơn [bp1_8010_best_friend.GetFaith.HighGodName] vì có được một [ROOT.Char.Custom('GetFriendNoun')] tuyệt vời như ngươi — rất hiếm người mà ta có thể thực sự tin tưởng.\n\nChúng ta nên gắn kết lợi ích chặt chẽ hơn và chiến đấu kề vai sát cánh. Nào [ROOT.Char.GetFirstNameNoTooltip], kẻ thù của chúng ta sẽ thấy rằng không thể xem thường chúng ta!"
  bp1_yearly.8010.a:0 "Phải! Ngươi sẽ có [bp1_8010_best_friend.Custom('SignatureWeaponNameOrType')] của ta!"
  bp1_yearly.8010.b:0 "Ta không chắc lắm đâu, [bp1_8010_best_friend.GetFirstNameNoTooltip]..."
 # Rival of my Rival
  bp1_yearly.8020.opening:0 "[bp1_8020_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp1_yearly.8020.desc:0 "Ta đã nghe về những tranh chấp của ngươi với tên [bp1_8020_rival.Custom2('InsultAdjective', SCOPE.sC('bp1_8020_friend'))] [bp1_8020_rival.Custom2('InsultNoun', SCOPE.sC('bp1_8020_friend'))] kia, [bp1_8020_rival.GetFirstName] — một kẻ đáng khinh, khó mà gọi là một [bp1_8020_rival.GetWomanMan].\n\nVới lợi ích chung của chúng ta, ta tin rằng chúng ta sẽ sớm hòa hợp, bằng hữu."
  bp1_yearly.8020.a:0 "Ta rất mong có dịp bàn bạc kỹ hơn về việc này."
  bp1_yearly.8020.b:0 "Sứ giả dạo này thật chẳng đáng tin..."
  bp1_yearly.8020.b.flavor:0 "Chuyển tiếp bức thư cho [bp1_8020_rival.GetTitledFirstNameNoTooltip]"
  bp1_yearly.8020.b.joke:0 "[bp1_8020_rival.GetTitledFirstNameNoTooltip] đánh giá cao sự thẳng thắn của Ngài"
  bp1_yearly.8020.b.insult:0 "Thông điệp khiến [bp1_8020_rival.GetTitledFirstNameNoTooltip] nổi giận"
  bp1_yearly.8020.c:0 "Đây là một nước đi thấp hèn, của một kẻ thấp hèn."
  bp1_yearly.8020.d:0 "Ngươi không phải  Bạn củata, [bp1_8020_friend.GetFirstNameNoTooltip]."
 # Diametrically Opposed
  bp1_yearly.8040.t:0 "Đối Lập Gay Gắt"
  bp1_yearly.8040.desc.opening:0 "Người Bạn Thân của ta, [bp1_yearly_8040_friend.GetTitledFirstName], những ngày qua tỏ ra xa cách, mỗi đêm đều tránh lời mời dùng bữa của ta.\n\nHôm nay [bp1_yearly_8040_friend.GetSheHe] bắt gặp ta khi ta đang ở một mình trong [ROOT.Char.Custom('GetChamber')]. \"[ROOT.Char.GetFirstNameNoTooltip], ta xin lỗi, nhưng ta buộc phải nói điều này, với tư cách là  Bạn củangươi.\"\n\n\"Chính\""
  bp1_yearly.8040.desc.diligent:0 "sự bận rộn liên miên và những đòi hỏi kết quả"
  bp1_yearly.8040.desc.brave:0 "việc liều lĩnh và táo bạo không cần thiết"
  bp1_yearly.8040.desc.just:0 "những phán xét quá kỹ lưỡng và việc soi xét bằng chứng"
  bp1_yearly.8040.desc.compassionate:0 "sự mềm lòng trước nỗi đau và quá quan tâm đến người khác"
  bp1_yearly.8040.desc.fickle:0 "việc đổi ý liên tục và dễ bị thuyết phục"
  bp1_yearly.8040.desc.temperate:0 "sự xa lánh bàn tiệc"
  bp1_yearly.8040.desc.generous:0 "thói quen rộng tay với bất kỳ ai cầu xin giúp đỡ"
  bp1_yearly.8040.desc.humble:0 "sự tự hạ thấp bản thân quá mức"
  bp1_yearly.8040.desc.honest:0 "việc từ chối lừa dối ngay cả khi cần thiết"
  bp1_yearly.8040.desc.forgiving:0 "sự bỏ qua xúc phạm và dung thứ cho bất trung"
  bp1_yearly.8040.desc.wrathful:0 "tính nóng nảy và những cơn bộc phát liên hồi"
  bp1_yearly.8040.desc.calm:0 "sự điềm tĩnh trước những xúc phạm chính đáng"
  bp1_yearly.8040.desc.cynical:0 "sự hoài nghi đối với kế hoạch thiêng liêng của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  bp1_yearly.8040.desc.zealous:0 "sự sốt sắng tuân theo [ROOT.Char.GetFaith.AltPriestTermPlural]"
  bp1_yearly.8040.desc.paranoid:0 "sự nghi ngờ không dứt về động cơ của người khác"
  bp1_yearly.8040.desc.trusting:0 "niềm tin mù quáng vào động cơ của tất cả mọi người"
  bp1_yearly.8040.desc.shy:0 "sự né tránh giao tiếp với người khác"
  bp1_yearly.8040.desc.gregarious:0 "sự xao nhãng vì chuyện phiếm và yến tiệc"
  bp1_yearly.8040.desc.lustful:0 "sự nô lệ cho dục vọng và cám dỗ"
  bp1_yearly.8040.desc.chaste:0 "sự chối bỏ những khoái lạc xác thịt"
  bp1_yearly.8040.desc.impatient:0 "thói quen hấp tấp, lao vào mọi việc"
  bp1_yearly.8040.desc.patient:0 "sự thận trọng quá mức và phản ứng chậm chạp"
  bp1_yearly.8040.desc.content:0 "sự thiếu khát vọng vươn lên và vượt qua người khác"
  bp1_yearly.8040.desc.ambitious:0 "tham vọng tiến lên không ngừng, không có điểm dừng"
  bp1_yearly.8040.desc.closing:0 "— điều đó khiến ngươi trở nên bất lợi. Chẳng lẽ ngươi không thấy rằng một [ROOT.Char.GetTitleAsNameNoTooltip] không thể cư xử như vậy hay sao?\""
  bp1_yearly.8040.a:0 "Ngươi #EMP dám#! nói chuyện với ta như vậy sao? Cút đi!"
  bp1_yearly.8040.a.lazy:0 "Chúng ta nói chuyện này sau được không?"
  bp1_yearly.8040.a.diligent:0 "Để ta làm xong việc này rồi sẽ nói."
  bp1_yearly.8040.a.craven:0 "Liều lĩnh là hành động của kẻ ngu."
  bp1_yearly.8040.a.brave:0 "Nghe giống hèn nhát thì đúng hơn."
  bp1_yearly.8040.a.arbitrary:0 "Ta muốn cư xử thế nào cũng được."
  bp1_yearly.8040.a.just:0 "Không làm vậy thì mới là sai."
  bp1_yearly.8040.a.callous:0 "Im đi được không."
  bp1_yearly.8040.a.compassionate:0 "Ta sẽ không làm chai sạn trái tim mình."
  bp1_yearly.8040.a.stubborn:0 "Ngươi không thể thay đổi suy nghĩ của ta."
  bp1_yearly.8040.a.fickle:0 "Ừ, được rồi, tùy ngươi nói!"
  bp1_yearly.8040.a.gluttonous:0 "Ăn xong rồi hẵng nói."
  bp1_yearly.8040.a.temperate:0 "Mọi thứ đều cần chừng mực."
  bp1_yearly.8040.a.greedy:0 "Để kẻ khác lấy #EMP tiền#! của ta sao?"
  bp1_yearly.8040.a.generous:0 "Ai cũng có phần cả."
  bp1_yearly.8040.a.arrogant:0 "Ta là [ROOT.Char.GetTitleAsNameNoTooltip]!"
  bp1_yearly.8040.a.humble:0 "Ta chỉ là một [ROOT.Char.GetWomanMan] như bao người khác."
  bp1_yearly.8040.a.deceitful:0 "Sự thật không phải lúc nào cũng giải thoát được."
  bp1_yearly.8040.a.honest:0 "Sự thật là, ngươi là kẻ nói dối."
  bp1_yearly.8040.a.vengeful:0 "Ta sẽ nhớ chuyện này khi #EMP ngươi#! cần #EMP ta#!."
  bp1_yearly.8040.a.forgiving:0 "Đừng lo, ta đã quên sự thô lỗ của ngươi rồi."
  bp1_yearly.8040.a.wrathful:0 "Ngươi #EMP dám#! nói với ta như vậy sao?!"
  bp1_yearly.8040.a.calm:0 "Bình tĩnh lại, không cần phải nóng nảy."
  bp1_yearly.8040.a.cynical:0 "#EMP Chẳng phải#! đó là việc của [ROOT.Char.GetFaith.HighGodName] sao?"
  bp1_yearly.8040.a.zealous:0 "Đó là việc của [ROOT.Char.GetFaith.HighGodName]!"
  bp1_yearly.8040.a.paranoid:0 "Không... cả #EMP ngươi#! nữa sao!"
  bp1_yearly.8040.a.trusting:0 "Cảm ơn ngươi, lúc nào ngươi cũng đứng về phía ta."
  bp1_yearly.8040.a.shy:0 "Ngươi có thể để ta yên không?"
  bp1_yearly.8040.a.gregarious:0 "Tránh ra, mọi người đang chờ ta."
  bp1_yearly.8040.a.lustful:0 "Có lẽ ngươi ở một mình quá lâu rồi."
  bp1_yearly.8040.a.chaste:0 "Ta không dễ bị cám dỗ như vậy."
  bp1_yearly.8040.a.impatient:0 "Ta không có thời gian cho chuyện này."
  bp1_yearly.8040.a.patient:0 "Vội vàng chỉ chuốc lấy tai họa."
  bp1_yearly.8040.a.content:0 "Vậy bao giờ mới là đủ?"
  bp1_yearly.8040.a.ambitious:0 "Ta sẽ không bị bỏ lại phía sau."
  bp1_yearly.8040.b:0 "Chúng ta hãy đồng ý là bất đồng đi! Thoải mái lên nào."
  bp1_yearly.8040.b.success:0 "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] đã dịu lại"
  bp1_yearly.8040.b.failure:0 "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] vẫn lạnh lùng"
  bp1_yearly.8040.c:0 "Ngươi nói đúng, [bp1_yearly_8040_friend.GetFirstNameNoTooltip]."
  bp_yearly_8040_trying_to_be_mindful_modifier:0 "Suy Xét Khuyết Điểm"
  bp_yearly_8040_trying_to_be_mindful_modifier_desc:0 "Nhân vật này đã bị đối diện với những khuyết điểm trong tính cách của mình và đang cố gắng sống cẩn trọng hơn."
 # A Murdered X
  bp1_yearly.8050.t:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))|U] Bị Sát Hại"
  bp1_yearly.8050.desc:0 "Sự ra đi của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))] thân yêu của ta, [victim_scope.GetFirstName], đè nặng lên lòng ta; dòng người thương tiếc cùng những lời an ủi của họ chẳng thể nào lấp đầy khoảng trống trong tim ta.\n\nTa vẫn không thể tin rằng [victim_scope.GetSheHe] đã [victim_scope.GetDeathReasonHideKiller], hay rằng [murderer_scope.GetTitledFirstName], kẻ sát hại [victim_scope.GetHerHis], lại không bị trừng phạt.\n\n"
  bp1_yearly.8050.desc.prisoner:0 "Dù [murderer_scope.GetSheHe] đang mục rữa trong ngục tối của [murderer_scope.GetImprisonedBy.GetTitledFirstNameNoTooltip], điều đó vẫn không thể dập tắt cơn phẫn nộ trong tim ta."
  bp1_yearly.8050.desc.free:0 "Nắm tay ta siết chặt, máu dồn lên tai mỗi khi ta nghĩ đến con thú đó vẫn đang nhởn nhơ ngoài vòng pháp luật... một sự sỉ nhục đối với công lý, và với [ROOT.Char.GetFaith.HighGodName]."
  bp1_yearly.8050.a:0 "Một ngày nào đó, ta sẽ báo thù cho ngươi, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))]..."
  bp1_yearly.8050.b:0 "Dòng máu đã chấm dứt tại đây."
 # At My Mercy
  bp1_yearly.8060.t:0 "Trong Tay Ta"
  bp1_yearly.8060.opening:0 "Ta dành một khoảnh khắc quan sát [combat_location.GetTerrain.GetNameNoTooltip|l] ngổn ngang của [combat_location.GetNameNoTooltip], rải rác xác chết mang màu cờ của [primary_combat_winner.GetPrimaryTitle.GetAdjectiveNoTooltip] và [primary_combat_loser.GetPrimaryTitle.GetAdjectiveNoTooltip], rồi quay sang những tù binh bị xiềng xích.\n\n"
  bp1_yearly.8060.desc.nemesis:0 "[captured_rival.GetTitledFirstName], tên [captured_rival.Custom2('InsultNoun', ROOT.Char)] đáng nguyền rủa của [ROOT.Char.GetFaith.NegativeAfterLife], cuối cùng cũng rơi vào tay ta! Đã lâu ta mơ đến ngày hạ gục [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))] của mình..."
  bp1_yearly.8060.desc.war_leader:0 "Cuối cùng ta cũng nắm trong tay [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))] của mình, [captured_rival.GetTitledFirstName], và chiến thắng trong cuộc chiến này giờ đã gần như chắc chắn...\n\n\"Ta xin hàng,\" [captured_rival.GetSheHe|U] gầm gừ, \"Hãy thả ta ra và ngươi sẽ có thứ mình muốn.\""
  bp1_yearly.8060.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))] của ta, [captured_rival.GetTitledFirstName], lườm ta đầy u uất, khiến lòng ta hả hê."
  bp1_yearly.8060.closing.multi:0 "\n\nSau lưng [captured_rival.GetHerHim], tên ác nhân [captured_rival_2.GetTitledFirstName] quỳ xuống, mất kiên nhẫn chờ đợi."
  bp1_yearly.8060.closing.ransom:0 "\n\n[captured_rival.GetSheHe|U] lắp bắp, gần như van nài, \"Ta có quyền được chuộc thân!\""
  bp1_yearly.8060.a.war_leader:0 "Cuộc chiến này đã kết thúc, nhưng chỉ với ngươi."
  bp1_yearly.8060.a.ransom:0 "Chó thì không có quyền chuộc thân."
  bp1_yearly.8060.a:0 "Ngày tàn của ngươi đã đến, đồ cặn bã."
  bp1_yearly.8060.b:0 "Giết [captured_rival.GetHerHim]. Giết hết."
  bp1_yearly.8060.c:0 "Ta sẽ khiến ngươi không bao giờ quên ngày hôm nay, [captured_rival.GetFirstNameNoTooltip]."
  bp1_yearly.8060.d:0 "Hãy nhớ lấy lòng khoan dung của ta, đồ sâu bọ."
  bp1_yearly.8060.d.multi:0 "Hãy nhớ lấy lòng khoan dung của ta, lũ khốn."
 # At X's Mercy
  bp1_yearly.8061.t:0 "Trong Tay [combat_winner.GetTitledFirstNamePossessiveNoTooltip]"
  bp1_yearly.8061.desc:0 "Ta đứng đó, bị những tên lính canh của kẻ địch đánh dấu và giám sát, trên vùng đất [combat_location.GetTerrain.GetNameNoTooltip|l] hỗn loạn của [combat_location.GetNameNoTooltip], trong khi kẻ khốn kiếp đó, [battle_rival_winner.GetTitledFirstName], đang quan sát chiến thắng của [battle_rival_winner.GetHerHis].\n\nCuối cùng [battle_rival_winner.GetSheHe|U] cũng tiến lại gần, vui mừng rút [battle_rival_winner.Custom('SignatureWeaponNameOrType')] của [battle_rival_winner.GetHerHis] ra, với một tia sáng đáng sợ trong đôi mắt [battle_rival_winner.GetHerHis].\n\n"
  bp1_yearly.8061.killed:0 "Ta biết đây là kết thúc..."
  bp1_yearly.8061.a:0 "\"[battle_rival_winner.Custom2('InsultAdjective', ROOT.Char)] đồ—\""
  bp1_yearly.8061.b:0 "\"Không phải thế này!\""
  bp1_yearly.8061.c:0 "[ROOT.Char.GetFaith.HighGodName], xin hãy che chở cho con."
  bp1_yearly.8062.wounded:0 "\"Chuyện này sẽ rất đau đấy.\" [battle_rival_winner.GetSheHe] cười nham hiểm."
  bp1_yearly.8062.a:0 "\"[battle_rival_winner.Custom2('InsultNoun', ROOT.Char)]!\""
 # Feudal Favoritism
  bp1_yearly.8070.t:0 "Thiên Vị [ROOT.Char.GetGovernment.GetNameNoTooltip|U]"
  bp1_yearly.8070.opening:0 "[claim_vassal.GetTitledFirstName] âm ỉ tức giận suốt buổi tối, rồi cuối cùng bùng nổ khi ta với tay lấy [ROOT.Char.Custom('GetExpensiveMealAlt')].\n\n\"Ta thật sự không thể hiểu vì sao ngài lại ban [claim_title.GetName] cho [favorite_vassal.GetTitledFirstName].\""
  bp1_yearly.8070.strength_strong:0 "Quyền thừa kế hợp pháp của ta đối với vùng đất này được tất cả thừa nhận!\"\n\n"
  bp1_yearly.8070.strength_weak:0 "Vùng đất này theo lẽ phải là của ta!\"\n\n"
  bp1_yearly.8070.claim:0 "\"Vì sao ngài lại ưu ái [favorite_vassal.GetHerHim] hơn ta? Ta chẳng phải là một chư hầu trung thành sao?\""
  bp1_yearly.8070.lowborn:0 "\"Việc nâng đỡ một kẻ hạ đẳng lên trên ta là một sự sỉ nhục!\""
  bp1_yearly.8070.other:0 "\"Ta đã gây ra tội lỗi gì nghiêm trọng đến mức bị đối xử nhục nhã như vậy?\""
  bp1_yearly.8070.hostile:0 "\n\n\"Ban đất cho một tên [favorite_vassal.GetFaith.GetAdherentName] đáng nguyền rủa thay vì ta!\" [ROOT.Char.Custom2('RelationToMe', claim_vassal)] của ta phẫn nộ, \"Điều đó trái với lương tâm!\""
  bp1_yearly.8070.culture:0 "\n\n\"Ý ta là...\" [ROOT.Char.Custom2('RelationToMe', claim_vassal)] của ta càu nhàu, \"[favorite_vassal.GetSheHe|U] thậm chí còn không phải người [claim_vassal.GetCulture.GetName]!\""
  bp1_yearly.8070.faith:0 "\n\n\"Ý ta là...\" [ROOT.Char.Custom2('RelationToMe', claim_vassal)] của ta càu nhàu, \"[favorite_vassal.GetSheHe|U] thậm chí còn không phải là tín đồ [ROOT.Char.GetFaith.GetAdherentName]!\""
  bp1_yearly.8070.a:0 "[favorite_vassal.GetFirstNameNoTooltip] có những phẩm chất mà ngươi không có."
  bp1_yearly.8070.b:0 "Hãy tha lỗi cho ta, [claim_vassal.GetFirstNameNoTooltip], [claim_title.GetNameNoTierNoTooltip] là của ngươi."
  bp1_yearly.8070.c:0 "Ta sẽ ban cho ngươi một tước vị khác."
  bp1_yearly.8070.d:0 "Đừng bao giờ chất vấn quyết định của ta nữa."
  bp1_yearly.8070.d.success:0 "[claim_vassal.GetTitledFirstNameNoTooltip] nguôi giận"
  bp1_yearly.8070.d.failure:0 "[claim_vassal.GetTitledFirstNameNoTooltip] bị xúc phạm"
 # Unwelcome Favor
  bp1_yearly.8100.t:0 "Kẻ Được Ưu Ái Bị Ghét"
  bp1_yearly.8100.joke:1 "Ta vẫn còn mỉm cười vì câu đùa mà [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] của ta, [sycophant_scope.GetFirstName], đã nói trong buổi họp hội đồng sáng nay, thì [jealous_scope.GetTitledFirstName] nắm lấy tay ta."
  bp1_yearly.8100.thighs:0 "Ta đang mải suy nghĩ về cặp đùi đầy đặn của [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], thì nghe thấy [jealous_scope.GetTitledFirstName] ho khẽ ngay sau lưng."
  bp1_yearly.8100.desc:0 "\n\n\"[jealous_scope.Custom2('RelationToMe', ROOT.Char)|U], ta đã định nói chuyện với ngài từ lâu.\""
  bp1_yearly.8100.lover_known:0 "Sự... ưu ái của ngài dành cho [sycophant_scope.GetFirstNameNoTooltip] không qua được mắt người khác, và nó làm dấy lên... nhiều câu hỏi về động cơ của ngài.\"\n\n"
  bp1_yearly.8100.lover_secret:0 "Ta, và nhiều người trong triều, không thể hiểu vì sao ngài lại ban cho [sycophant_scope.GetHerHim] nhiều vinh dự và quyền lực đến vậy. Một quý tộc danh giá hẳn sẽ hữu ích hơn cho ngài.\"\n\n"
  bp1_yearly.8100.lover:0 "Ta biết ngài có... nhiều tình cảm với [sycophant_scope.GetHerHim], nhưng thật sự sao? Một ghế trong hội đồng?\"\n\n"
  bp1_yearly.8100.friend:0 "Ta hiểu hai người là bằng hữu thân thiết, nhưng có người cho rằng ngài đặt [sycophant_scope.GetHerHim] lên trên những hội viên xứng đáng hơn.\"\n\n"
  bp1_yearly.8100.faction:0 "\"Nói thẳng ra, nếu những sự sỉ nhục này không được giải quyết, chỉ có [jealous_scope.GetFaith.HighGodName] mới biết điều gì sẽ giáng xuống [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...\""
  bp1_yearly.8100.hostile:0 ""Ý ta là, ngươi không biết [sycophant_scope.GetWomanMan] đó là một kẻ [sycophant_scope.Custom2('InsultAdjective', SCOPE.sC('jealous_scope'))] [sycophant_scope.Custom2('InsultNoun', SCOPE.sC('jealous_scope'))] đến mức nào sao?""
  bp1_yearly.8100.lowborn:0 "\"Thật không thích hợp khi đặt ý kiến của một thường dân ngang bằng, hay thậm chí cao hơn, giới quý tộc cao nhất của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip].\""
  bp1_yearly.8100.rank:0 "\"Chắc chắn ý kiến của một [jealous_scope.GetTitleAsNameNoTooltip] phải được coi trọng hơn một [sycophant_scope.GetTitleAsNameNoTooltip] tầm thường!\""
  bp1_yearly.8100.faith:0 "\"Ngài thật sự cho rằng việc lắng nghe một [sycophant_scope.GetFaith.GetAdjective] [jealous_scope.Custom2('GetUnbelieverTerm', sycophant_scope)] là khôn ngoan sao?\""
  bp1_yearly.8100.culture:0 "\"Chẳng phải một tiếng nói [jealous_scope.GetCulture.GetName] khác sẽ hữu ích hơn tên ngoại lai [sycophant_scope.GetCulture.GetName]] này sao?\""
  bp1_yearly.8100.unskilled:0 ""Ngoài sự xúc phạm đó ra, [sycophant_scope.GetWomanMan] ấy rõ ràng không đủ năng lực để đảm nhiệm chức vụ [sycophant_scope.GetCouncilTitle].""
  bp1_yearly.8100.skilled:0 "\"Dù [sycophant_scope.GetSheHe] có giỏi đến đâu trong vai trò [sycophant_scope.GetCouncilTitle], sự sỉ nhục này vẫn quá rõ ràng.\""
  bp1_yearly.8100.jealous:0 "\"Hãy lấy ta làm ví dụ — một [jealous_scope.GetTitleAsNameNoTooltip] trung thành của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
  bp1_yearly.8100.fallback:0 ""
  bp1_yearly.8100.a:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip|l] có thể tự mình lựa chọn hội đồng của [ROOT.Char.GetHerHis]."
  bp1_yearly.8100.a.hostile:0 "Ngươi dám nói xấu [sycophant_scope.GetFirstNameNoTooltip] sao!"
  bp1_yearly.8100.a.flavor:0 "[jealous_scope.GetFirstNameNoTooltip] có thể sẽ ôm hận"
  bp1_yearly.8100.b:0 "Có vẻ như ngươi muốn cái ghế của [sycophant_scope.GetHerHis] đấy, [jealous_scope.GetFirstNameNoTooltip]."
  bp1_yearly.8100.b.flavor:0 "Ta mong [sycophant_scope.GetFirstNameNoTooltip] sẽ hiểu"
  bp1_yearly.8100.fired_tt:0 "[sycophant_scope.GetShortUIName|U] bị sa thải khỏi [council|E] trong 5 năm"
  bp1_yearly.8100.c:0 "Được thôi, ta sẽ bãi nhiệm [sycophant_scope.GetFirstNameNoTooltip]."
  bp1_yearly.8100.c.flavor:0 "Dù điều đó khiến ta đau lòng..."
  bp1_yearly.8100.d.flavor:0 "[sycophant_scope.GetSheHe|U] thực sự rất thú vị!"
  bp1_yearly.8100.d.success:0 "[sycophant_scope.GetTitledFirstNameNoTooltip] để lại ấn tượng tốt"
  bp1_yearly.8100.d.failure:0 "[jealous_vassal.GetTitledFirstNameNoTooltip] không thể chịu nổi [sycophant_scope.GetWomanMan] đó"
  bp1_yearly.8100.d.tt:0 "Tùy chọn này không khả dụng vì [jealous_scope.GetFirstNameNoTooltip] là [jealous_scope.Custom2('RelationToMe', sycophant_scope)|U] của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8100.reveal_tt:0 "[jealous_scope.GetTitledFirstName] có thể tiết lộ Bí mật [sycophant_secret.GetName] của Ngài và [sycophant_scope.GetFirstNamePossessive]"
  bp1_yearly.8100.support:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], là chỗ dựa tinh thần nơi hội đồng của ta, luôn sẵn sàng ủng hộ ta, dù [jealous_scope.GetTitledFirstName] rõ ràng không nghĩ vậy."
  bp1_yearly.8100.knowledgeable:0 "Ta nhận ra mình gật đầu đồng tình — [ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], quả thật rất uyên bác; ta mừng vì có một hội viên đáng tin cậy và tài giỏi như vậy. [jealous_scope.GetTitledFirstName] thì rõ ràng không nghĩ thế."
 # Sycophant's secret
  bp1_yearly.8110.t:0 "Bí mật của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8110.desc:0 "Khi Ta tản bộ yên tĩnh trước giấc ngủ thứ hai, tâm trí vẫn bị cuốn theo hình ảnh đôi mắt mê hoặc của [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], Ta chợt thấy bóng dáng quen thuộc của [revealer_scope.GetTitledFirstNamePossessive] đang tiến lại gần.\n\"À, [ROOT.Char.Custom('FormOfAddressForLiege')]... trước giờ Ta vẫn không thể giải thích nổi vì sao ngài lại dành cho [sycophant_scope.GetFirstNameNoTooltip] sự ưu ái lớn đến vậy – #EMP cho tới tận bây giờ#!.\""
  bp1_yearly.8110.known_secret_homosexual:0 "\"Hãy nhường chỗ cho một chư hầu xứng đáng hơn trong vòng thân cận của ngài, nếu không Ta sẽ buộc phải phơi bày mối quan hệ trái tự nhiên này.\""
  bp1_yearly.8110.known_secret_adulterer:0 "\"Hãy loại [sycophant_scope.GetHerHim] khỏi hội đồng, nếu không tội ngoại tình vô đạo của ngài sẽ bị mọi người biết đến.\""
  bp1_yearly.8110.known_secret_other:0 "\"Hãy gạt tên [sycophant_scope.Custom2('InsultAdjective', SCOPE.sC('revealer_scope'))] gây rối đó khỏi hội đồng, nếu không Ta sẽ buộc phải phơi bày mối quan hệ của hai người.\""
  bp1_yearly.8110.c:0 "Được thôi..."
  bp1_yearly.8110.c.flavor:0 "...cứ theo ý ngươi!"
  bp1_yearly.8110.d:0 "Ta không hề xấu hổ vì bất cứ điều gì."
  bp1_yearly.8110.e:0 "Ngươi chắc là [secondary_scope.GetFirstNameNoTooltip] sẽ muốn chuyện đó chứ?"
  every_powerful_vassal_tt:0 "Mọi [powerful_vassal|E]"
 # Sycophant's allure
  bp1_yearly.8120.t:0 "Sức quyến rũ của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8120.desc:0 "Trời đất, [sycophant_scope.GetTitledFirstNamePossessive] thật tuyệt vời... Ta chợt tỉnh khỏi dòng suy tưởng khi [matchmaker_scope.GetTitledFirstName] bước vào tầm mắt, đóng cánh cửa lại phía sau [matchmaker_scope.GetHerHim].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đến gặp ngài với một chuyện tế nhị và mong được giữ kín..." [matchmaker_scope.GetSheHe|U] ngập ngừng. "Ngài có nghĩ rằng... có lẽ ngài đang trao cho [sycophant_scope.GetFirstNameNoTooltip] những trọng trách và vinh dự chỉ vì ngài... #EMP yêu quý#! [sycophant_scope.GetHerHim] không?"\n\n[matchmaker_scope.GetFirstNameNoTooltip] lo lắng kéo cổ áo của [matchmaker_scope.GetHerHis].\n\n"Có lẽ mọi người sẽ tốt hơn nếu #EMP ngài#! tự mình lo liệu #EMP chuyện đó#!, còn những chức vụ thì để lại cho các quý tộc của ngài thì sao?""
  bp1_yearly.8120.a:0 "Cút ra ngoài."
  bp1_yearly.8120.a.flavor:0 "Ta nên cho ngươi nếm roi!"
  bp1_yearly.8120.b:0 "[sycophant_scope.GetFirstNameNoTooltip]? Ha, không đời nào!"
  bp1_yearly.8120.seduce:0 "[scheme|E] nhận thêm [success_chance|E]"
  bp1_yearly.8120.b.flavor:0 "Thật là một ý nghĩ nực cười!"
  bp1_yearly.8120.c:0 "Cái— #EMP Ồ...#! Có lẽ ngươi nói đúng..."
  bp1_yearly.8120.c.flavor:0 "Ngươi nghĩ [sycophant_scope.GetSheHe] cũng thích ta sao?"
  bp1_yearly.8120.d:0 "Ngươi #EMP quả là#! tinh ý, nhưng ta sẽ không nhượng bộ."
  bp1_yearly.8120.d.flavor:0 "Làm sao ngươi đoán ra được vậy?"
  bp1_yearly.8121.t:0 "Hương sắc của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8121.opening:0 "Những ý nghĩ nhục cảm cứ bám lấy Ta từ sau cuộc trò chuyện với [matchmaker_scope.GetTitledFirstName], những giấc mơ về [sycophant_scope.GetTitledFirstName] và Ta..."
  bp1_yearly.8121.homosexual:0 "Ta biết đây không phải điều mà [ROOT.Char.GetFaith.HighGodName] mong muốn giữa hai [ROOT.Char.GetWomanMan]... ôi [ROOT.Char.GetFaith.PositiveAfterLife]!"
  bp1_yearly.8121.adultery:0 "Phản bội [ROOT.Char.GetConsort.GetTitledFirstName] là điều không đúng, nhưng hẳn [ROOT.Char.GetFaith.HighGodNameAlternate] có lý do khi khiến Ta cảm thấy như thế này!"
  bp1_yearly.8121.other:0 "Nếu [sycophant_scope.GetSheHe] cũng có cùng cảm xúc thì sao? Hay Ta đang tự dày vò bản thân vô ích? [ROOT.Char.GetFaith.FertilityGodName] phù hộ cho Ta..."
  bp1_yearly.8121.desc:0 "Ta nên làm gì đây..."
  bp1_yearly.8121.a:0 "Ta phải nghe theo con tim mình."
  bp1_yearly.8121.a.flavor:0 "Không thể bỏ lỡ cơ hội này"
  bp1_yearly.8121.b:0 "Chuyện này chỉ có kết cục tồi tệ..."
  bp1_yearly.8121.b.friend:0 "[sycophant_scope.GetSheHe|U] chỉ là Ngài thôi! Một người #EMP Ngài#! mà thôi!"
  bp1_yearly.8121.b.flavor:0 "Quay lại với công việc..."
 # Sycophant's enemies
  bp1_yearly.8130.t:0 "Kẻ thù của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8130.desc:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)] của ta, [sycophant_scope.GetTitledFirstName], xông thẳng vào phòng ta, làm đổ một chiếc đèn và suýt khiến một chiếc đệm bốc cháy.\n\n"[ROOT.Char.GetFirstNameNoTooltip]! Ta chắc chắn rằng mình đang bị theo dõi!" [sycophant_scope.GetSheHe] kêu lên, vừa nói vừa chỉ tay ra phía sau [sycophant_scope.GetHerHim].\n\n"Có những kẻ lén lút rình rập bên ngoài phòng ta; đồ đạc của ta đã bị di chuyển!""
  bp1_yearly.8130.a:0 "Bình tĩnh nào, chuyện này không giống ngươi."
  bp1_yearly.8130.a.paranoid:0 "\"Thôi nào, có lẽ chỉ là người hầu thôi.\""
  bp1_yearly.8130.a.flavor:0 "Không có gì phải lo"
  bp1_yearly.8130.b:0 "Ta sẽ cho người bảo vệ ngươi ngày đêm."
  bp1_yearly.8130.c:0 "[spymaster_scope.GetFirstNameNoTooltip] sẽ điều tra đến cùng."
  bp1_yearly.8130.c.flavor:0 "Sự thật không thể thoát khỏi [spymaster_scope.GetHerHim]"
  bp1_yearly.8130.c.success:0 "[spymaster_scope.GetCouncilTitleFirstNameNoTooltip] tìm ra bằng chứng"
  bp1_yearly.8130.c.failure:0 "Không tìm thấy bằng chứng nào"
  bp1_yearly.8130.exposed:0 "[scheme|E] chống lại [sycophant_scope.GetShortUIName] sẽ bị bại lộ"
  bp1_yearly.8130.progress:0 "[scheme|E] chống lại [sycophant_scope.GetShortUIName] sẽ tiến triển"
  bp1_yearly.8130.d:0 "Ngươi nên điều tra chuyện này, Spymaster."
  bp1_yearly.8130.d.flavor:0 "Trong bao người lại phải lo cho chuyện này..."
  bp1_yearly.8130.d.success:0 "[spymaster_scope.GetFirstNameNoTooltip] tìm ra bằng chứng"
  bp1_yearly.8130.d.failure:0 "[spymaster_scope.GetFirstNameNoTooltip] biến mất"
  bp1_yearly.8130.e:0 "Không ai được phép đe dọa #EMP [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] của ta#!!"
  bp1_yearly.8130.e.flavor:0 ""
  bp1_yearly.8130.e.success:0 "Ngươi phanh phui được một âm mưu"
  bp1_yearly.8130.e.failure:0 "Không tìm thấy gì cả"
  bp1_yearly.8131.t.sycophant:0 "Mưu mẹo của [spymaster_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8131.t:0 "Minh oan cho [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8131.desc.sycophant:0 "Ta bất ngờ khi được gọi xuống ngục tối sâu dưới lòng đất của ta, và người triệu tập ta lại không ai khác ngoài [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstName].\n\nỞ đó, trong một phòng giam, ta tìm thấy [sycophant_scope.GetHerHim], đang thở phào nhẹ nhõm, bên cạnh một [murderous_scope.GetTitledFirstName] rõ ràng kém vui vẻ hơn nhiều, đang bị xiềng xích.\n\nTa thở hắt ra, "[sycophant_scope.GetFirstNameNoTooltip]! Chuyện gì đã xả-" trước khi [sycophant_scope.GetSheHe] ngắt lời, "Kẻ [murderous_scope.Custom2('InsultNoun', SCOPE.sC('sycophant_scope'))] này đã cố giết ta - ta có lời thú nhận của tên tay sai của [murderous_scope.GetHerHis] để chứng minh điều đó!""
  bp1_yearly.8131.desc.spymaster:0 "Khi ta đang thư giãn cùng [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] của ta, [sycophant_scope.GetTitledFirstName], chúng ta nhận được một bức thư từ Gián điệp trưởng của ta, [spymaster_scope.GetTitledFirstName], yêu cầu cả hai chúng ta đến ngục tối của ta.\n\nỞ đó, trong lòng đất ẩm thấp của [ROOT.GetCharacter.Custom('FortifiedBuilding')] của ta, chúng ta tìm thấy [spymaster_scope.GetHerHim], cùng với một [murderous_scope.GetTitledFirstName] khốn khổ đang bị xiềng xích bên cạnh [spymaster_scope.GetHerHis].\n\n"Đây chính là thủ phạm, [ROOT.Char.Custom('FormOfAddressForLiege')]," [spymaster_scope.GetSheHe] đắc ý nói, "Không còn nghi ngờ gì nữa.""
  bp1_yearly.8131.desc:0 "Ta căng thẳng chờ đợi khi những người lính canh của ta áp giải tên mật vụ bị bắt giữ xuống ngục tối của ta, hắn bị trói, bịt đầu và rên rỉ.\n\n"Đến đây, [sycophant_scope.GetFirstName], chúng ta sẽ xem kẻ nào đã cố thuê sát thủ để giết ngươi!"\n\nVới một động tác đầy kịch tính cùng tiếng thở hổn hển, cai ngục của ta tiết lộ kẻ đó không ai khác ngoài [murderous_scope.GetTitledFirstName]!\n\n[sycophant_scope.GetFirstNameNoTooltip] và ta cùng gầm lên: "#EMP Chính là ngươi!#!"" 
  bp1_yearly.8131.tt:0 "Sự dính líu của [murderous_scope.GetTitledFirstNamePossessive] trong một [scheme|E] nhằm [sycophant_scheme.GetSchemeType.GetTypeNameNoTooltip] [sycophant_scope.GetFirstName] bị phanh phui"
  bp1_yearly.8131.a:0 "Có vẻ ngươi cần phải giải thích vài điều đấy, [murderous_scope.GetFirstNameNoTooltip]."
  bp1_yearly.8131.a.flavor:0 "Qua song sắt #EMP phòng giam#!"
  bp1_yearly.8131.b:0 "[murderous_scope.GetSheHe|U] đã học được bài học của [murderous_scope.GetHerHis]."
  bp1_yearly.8131.b.flavor:0 "Dù sao thì cũng không phải #EMP phản quốc#!"
  bp1_yearly.8131.c:0 "Còn ai khác dính líu nữa?"
  bp1_yearly.8131.c.flavor:0 "Đưa cái búa đây!"
  bp1_yearly.8131.torture:0 "Ngươi sẽ [torture|E] [murderous_scope.GetShortUIName]"
  bp1_yearly.8131.agent:0 "Có thể phát hiện thêm một [agent|E] khác trong [scheme|E]"
  bp1_yearly.8131.attempted:0 "[agent_scope.GetTitledFirstNameNoTooltip] đã tham gia âm mưu!"
  released_attempted_murderer_opinion:0 "Đã thả kẻ mưu sát"
  bp1_yearly.8132.t:0 "Nỗi sợ của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8132.desc.sycophant:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)] của ta, [sycophant_scope.GetTitledFirstNamePossessive], quay trở lại gặp ta với vẻ bực bội hơn trước.\n\nDường như [sycophant_scope.GetSheHe] đã dùng hết mọi cách có thể mà [sycophant_scope.GetHerHim] có, nhưng vẫn không thể tiến gần hơn đến việc tìm ra bằng chứng về một âm mưu.\n\n"Ta phải làm gì đây, [ROOT.Char.GetFirstNameNoTooltip]," [sycophant_scope.GetSheHe] thở dài, "Ta đang nằm trong tay lòng thương xót của kẻ thù!""
  bp1_yearly.8132.desc.spymaster:1 "Spymaster của Ta, [spymaster_scope.GetTitledFirstNamePossessive], cuối cùng cũng thừa nhận rằng [spymaster_scope.GetSheHe] không thể tìm thấy bất kỳ bằng chứng nào về âm mưu chống lại [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] của Ta, [sycophant_scope.GetFirstName].\n[spymaster_scope.GetSheHe|U] thậm chí còn cho rằng toàn bộ sự việc chỉ là sản phẩm từ trí tưởng tượng của [sycophant_scope.GetFirstNamePossessiveNoTooltip]..."
  bp1_yearly.8132.desc:0 "Ta đã xem xét những lo lắng của [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], cho người canh gác phòng của [sycophant_scope.GetHerHis] và hỏi han đám gia nhân khắp [ROOT.GetCharacter.Custom('FortifiedBuilding')], nhưng vô ích.\n\"Có lẽ chỉ là người hầu dọn dẹp thôi?\" Ta nói yếu ớt.\n[sycophant_scope.GetSheHe|U] đi đi lại lại trong phòng, rõ ràng không bị thuyết phục."
  bp1_yearly.8132.a:0 "Ta sẽ cho người bảo vệ ngươi, đề phòng vẫn hơn."
  bp1_yearly.8132.a.flavor:0 "Cẩn tắc vô áy náy"
  bp1_yearly.8132.b:0 "Hay chỉ là một trò đùa vô hại?"
  bp1_yearly.8132.b.flavor:0 "Thật là tốn thời gian"
  bp1_yearly.8134.t:0 "Sự vắng mặt của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8134.desc:0 "Đã quá lâu rồi Ta không nhận được tin tức gì từ [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], và Ta bắt đầu lo sợ điều tồi tệ nhất.\nNếu quả thực có mối đe dọa nào đó nhắm vào tính mạng của [sycophant_scope.GetHerHis]... ôi [ROOT.Char.GetFaith.HighGodName]..."
  bp1_yearly.8134.a:0 "Ngươi đang ở đâu, [sycophant_scope.GetFirstNameNoTooltip]?"
  bp1_yearly.8134.a.flavor:0 "Ta đã làm gì thế này..."
 # Sycophant's revenge
  bp1_yearly.8140.t:0 "Sự trả thù của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8140.desc:0 "Trong lúc đang ngắm nghía bộ sưu tập [ROOT.Char.Custom('RegionalAlcoholicDrink')|U] thượng hạng của mình, ta nghe thấy giọng nói quen thuộc của [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName].\n\nẨn giữa những thùng rượu, [sycophant_scope.GetSheHe] đang tuôn ra đủ mọi lời nguyền rủa và chửi bới nhắm vào [jealous_scope.GetTitledFirstName] với một tên hầu nào đó.\n\nNgay khi ta sắp mất hứng thú thì nghe thấy câu nói khiến máu trong người lạnh đi: \"giết [jealous_scope.GetTitledFirstName]!\""
  bp1_yearly.8140.a:0 "[sycophant_scope.GetFirstNameNoTooltip]! Ta nghe thấy hết rồi!"
  bp1_yearly.8140.a.flavor:0 "Thật đáng xấu hổ!"
  bp1_yearly.8140.b:0 "Đúng vậy! [jealous_scope.GetFirstNameNoTooltip] sẽ #EMP chết#!!"
  bp1_yearly.8140.b.flavor:0 "Cuối cùng cũng có chút vui!"
  bp1_yearly.8140.c:0 "#EMP Ta lặng lẽ rón rén rời đi#!"
  bp1_yearly.8140.c.flavor:0 "Ta #EMP chẳng nghe thấy#! gì cả"
 # Sycophant's joke
  bp1_yearly.8160.t:0 "Sự duyên dáng của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8160.desc:0 "Ta và [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName], đang thong dong dạo bước trong khu vườn, cười phá lên trước một vần vè mà [sycophant_scope.GetSheHe] tình cờ nghe được từ một người hầu, thì [jealous_scope.GetTitledFirstName] chặn đường chúng ta.\n\n[jealous_scope.GetSheHe|U] nhìn chúng ta nghiêm nghị: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], có việc này ta muốn bàn, nếu người có chút thời gian?\""
  bp1_yearly.8160.a:0 "Được thôi, chuyện gì?"
  bp1_yearly.8160.a.flavor:0 "Mong là đáng công!"
  bp1_yearly.8160.b:0 "Nhập hội đi, ngươi phải nghe chuyện này!"
  bp1_yearly.8160.b.flavor:0 "Có thể #EMP xảy ra#! chuyện gì được chứ?"
  bp1_yearly.8160.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] khiến [jealous_scope.GetHerHim] xiêu lòng"
  bp1_yearly.8160.b.failure:0 "Đây là giọt nước tràn ly với [jealous_scope.GetFirstNameNoTooltip]"
  bp1_yearly.8160.d:0 "Không phải lúc này, [jealous_scope.GetFirstNameNoTooltip]!"
  bp1_yearly.8160.d.flavor:0 "Không thấy ta đang #EMP bận#! sao?"
  bp1_yearly.8161.t:0 "Phép màu của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8161.opening:1 "Khi những hiệu ứng âm thanh cuối cùng của [sycophant_scope.GetTitledFirstNamePossessive] tan dần vào tiếng chim hót, vẻ mặt của [jealous_scope.GetTitledFirstNamePossessive] vẫn nghiêm trọng như thường lệ.\n\n"
  bp1_yearly.8161.desc:0 "Từ từ, ở khóe miệng [jealous_scope.GetHerHis] xuất hiện một nụ cười mờ nhạt, rồi lan rộng thành nụ cười toe toét, cuối cùng bật ra thành tràng cười sảng khoái!\n\n\"Tr- #EMP *khục khặc*#! Trời ơi buồn cười- #EMP *khục khặc*#! Ôi! Ta đã hiểu sai ngươi rồi, [sycophant_scope.GetFirstNameNoTooltip]! Đi kiếm đồ ăn nào!\""
  bp1_yearly.8161.a:0 "#EMP *huých cùi chỏ*#! [ROOT.Char.Custom('GetLaughType')]"
  bp1_yearly.8161.a.flavor:0 "Suýt nữa là lừa được ta!"
  bp1_yearly.8162.t:0 "Cú sảy chân của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8162.desc:1 "Ta có một linh cảm tồi tệ rằng trò đùa này đã không được đón nhận.\n\nNỗi lo của ta được xác nhận ngay sau đó, khi [jealous_scope.GetFirstNameNoTooltip] thở dài đầy chán nản, đảo mắt và bỏ đi.\n\n[sycophant_scope.GetFirstName] nhún vai, "Thôi nào, đúng là một kẻ quá nghiêm túc...""
  bp1_yearly.8162.a:0 "Sao lại là #EMP trò đó#! chứ, [sycophant_scope.GetFirstNameNoTooltip]..."
  bp1_yearly.8162.a.flavor:0 "Cứ dùng chuyện của đám hầu đi thì hơn"
 # Sycophant's friend
  bp1_yearly.8170.t:0 "Bạn Bè của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8170.desc:0 "Ta ngày càng ít gặp [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName]. Có vẻ [sycophant_scope.GetSheHe] dành nhiều thời gian cho [ROOT.Char.Custom2('RelationToMe', friendly_scope)], [friendly_scope.GetTitledFirstName] của ta hơn...\n\nTa bắt gặp hai người họ; vỗ đùi cười trước một câu đùa nào đó; khúc khích cười khi liếc nhìn về phía ta.\n\nTa nên hiểu chuyện này thế nào đây..."
  bp1_yearly.8170.a:0 "Ta ở trên mấy chuyện này."
  bp1_yearly.8170.a.flavor:0 "Ta sẽ không lãng phí thêm thời gian cho [sycophant_scope.GetHerHim]"
  bp1_yearly.8170.b:0 "À, [sycophant_scope.GetFirstNameNoTooltip], nói chuyện chút?"
  bp1_yearly.8170.b.flavor:0 "Ta biết [sycophant_scope.GetSheHe] thích gì"
  bp1_yearly.8170.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] đi theo"
  bp1_yearly.8170.b.failure:0 "[sycophant_scope.GetFirstNameNoTooltip] ở lại với [friendly_scope.GetFirstNameNoTooltip]"
  bp1_yearly.8170.c:0 "Ta không còn cần ngươi nữa, [sycophant_scope.GetFirstNameNoTooltip]."
  bp1_yearly.8170.c.flavor:0 "Cứ cười #EMP cho đã#! đi"
 # Sycophant's ultimatum
  bp1_yearly.8180.t:0 "Tối hậu thư của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8180.desc:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName], yêu cầu được yết kiến riêng, một sự trang trọng hiếm thấy chỉ có thể báo hiệu điềm xấu.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip]... ta không chịu nổi nữa rồi! Người gạt ta ra, cúi đầu trước cái gọi là 'bổn phận', trong khi người biết rõ ta từng là một thành viên hội đồng xuất sắc!\"\n\n\"Nếu đây là cách ta bị đối xử, thì ta sẽ phải tìm con đường mới. Ta nghe nói [new_realm.GetHolder.GetName] biết cách ban thưởng cho những kẻ trung thành...\""
  bp1_yearly.8180.a:0 "Ngươi biết ta không thể mất ngươi, [sycophant_scope.GetFirstNameNoTooltip]."
  bp1_yearly.8180.a.flavor:0 "Ngươi hiểu rõ điều đó..."
  bp1_yearly.8180.b:0 "Thôi nào, ngươi biết mọi thứ phức tạp hơn thế!"
  bp1_yearly.8180.b.flavor:0 "Có rất nhiều yếu tố liên quan..."
  bp1_yearly.8180.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] ở lại"
  bp1_yearly.8180.b.failure:0 "[sycophant_scope.GetFirstNameNoTooltip] rời đi"
  bp1_yearly.8180.c:0 "Vậy thì cứ đi đi, nếu ngươi nghĩ thế!"
  bp1_yearly.8180.c.flavor:0 "Ra ngoài!"
  bp1_yearly.8180.d:0 "Ngươi đang đe dọa phản quốc!"
  bp1_yearly.8180.d.flavor:0 "Nếu ta không có được ngươi..."
 # Sycophant's talents
  bp1_yearly.8190.t:0 "Tài năng của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8190.opening:1 "Băng qua sân trong, ta hài lòng khi cuối cùng cũng nghe thấy ai đó đánh giá đúng [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName].\n\n\"Ôi đừng nghe mấy kẻ cay cú đó,\" [friendly_scope.GetTitledFirstName] ríu rít, \"ngươi là [sycophant_scope.GetCouncilTitle] giỏi nhất mà [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] có được suốt bao năm qua – ít nhất là theo #EMP ta#! biết!\"\n\n"
  bp1_yearly.8190.twitch:0 "Trong chốc lát, ta chắc chắn thấy [jealous_scope.GetTitledFirstName] trong chuồng ngựa tối phía đối diện, mắt giật giật, trước khi [jealous_scope.GetSheHe] tan vào bóng tối."
  bp1_yearly.8190.desc:0 "Ta biết điều ta thấy ở [sycophant_scope.GetHerHis] là thật!"
  bp1_yearly.8190.a:0 "Cuối cùng cũng có người biết thưởng thức nhân tài!"
  bp1_yearly.8190.a.flavor:0 "Hội những người yêu quý [sycophant_scope.GetFirstNameNoTooltip] ngày càng đông"
  bp1_yearly.8190.b:0 "Này, sao không ra ngoài chơi một tối, chỉ ba chúng ta?"
  bp1_yearly.8190.b.flavor:0 "Giữ Bạn Bè ở gần"
 # Sycophant's rewards
  bp1_yearly.8191.t:0 "Phần thưởng của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8191.opening:0 "Một buổi họp hội đồng dài lê thê tiếp diễn, cho đến khi tai ta bỗng chú ý bởi giọng nói duyên dáng của [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstNamePossessive].\n\n\"Việc khẩn cấp, [ROOT.Char.Custom('FormOfAddressForLiege')], \""
  bp1_yearly.8191.taken:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] đang rất cần một [sycophant_scope.Custom('GetTargetCourtPosition')] có năng lực; người có thể thực sự [sycophant_scope.Custom('GetTargetCourtPositionDesc')]... một nhiệm vụ mà [old_holder.GetTitledFirstName] đã #EMP hoàn toàn#! thất bại.\""
  bp1_yearly.8191.open:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] đang rất cần một [sycophant_scope.Custom('GetTargetCourtPosition')]; người có thể đảm trách [sycophant_scope.Custom('GetTargetCourtPositionDesc')]...\""
  bp1_yearly.8191.arrogant:0 "\n\n[sycophant_scope.GetSheHe|U] khoa trương chỉ vào [sycophant_scope.GetHerselfHimself]: \"Cứ để ta lo việc này cho người, bệ hạ, loại công việc này đòi hỏi một sự tinh tế nhất định.\""
  bp1_yearly.8191.other:0 "\n\n[sycophant_scope.GetSheHe|U] đặt tay lên trái tim [sycophant_scope.GetHerHis] của mình, "Tất nhiên rồi, #EMP ta#! sẵn lòng gánh vác trọng trách quan trọng này, thưa lãnh chúa của ta.""
  bp1_yearly.8191.desc:0 "\n\n[annoyed_scope.GetTitledFirstName] rõ ràng đang tức tối."
  bp1_yearly.8191.a:0 "Ý kiến tuyệt vời, [sycophant_scope.GetFirstNameNoTooltip]!"
  bp1_yearly.8191.a.flavor:0 "May mắn thay có [sycophant_scope.GetFirstNameNoTooltip]"
  bp1_yearly.8191.b:0 "Đúng, đã đến lúc [old_holder.GetFirstNameNoTooltip] nhường chỗ!"
  bp1_yearly.8191.b.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] sẽ cho [old_holder.GetHerHim] thấy thế nào là đúng cách!"
  bp1_yearly.8191.c:0 "Hay ngươi nhận một vị trí đang trống thì sao?"
  bp1_yearly.8191.c.flavor:0 "Tài năng của [sycophant_scope.GetFirstNameNoTooltip] là vô tận"
  bp1_yearly.8191.d:0 "Ta nghĩ công việc này hợp với [annoyed_scope.GetFirstNameNoTooltip] hơn."
  bp1_yearly.8191.d.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] không thể có #EMP mọi thứ#!"
  bp1_yearly.8191.e:0 "Chẳng phải còn việc #EMP quan trọng hơn#! sao?"
  bp1_yearly.8191.e.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] rồi cũng sẽ quen thôi"
 # Sycophant's mistakes
  bp1_yearly.8192.t:0 "Sai lầm của [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.8192.desc:0 "Khi ta ngả lưng trên ghế, suy nghĩ xem nên ban thưởng thế nào cho những cống hiến xuất sắc gần đây của [sycophant_scope.GetFirstNamePossessive], người [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] của ta, thì chốt cửa bỗng vang lên, để lộ ra [insulting_scope.GetTitledFirstName].\n\n\"Xin tha thứ cho thần vì đã nói thẳng, thưa [ROOT.Char.GetLadyLord], nhưng chuyện liên quan đến [sycophant_scope.GetFirstNameNoTooltip] đang ngày càng vượt tầm kiểm soát!\"\n\n\"Tên ngốc đó hoàn toàn không đủ năng lực để làm [sycophant_scope.GetCouncilTitle]; mỗi ngày [sycophant_scope.GetSheHe] còn nắm quyền, mọi thứ sẽ càng trượt dốc, dẫn tới sự suy vong của toàn bộ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\""
  bp1_yearly.8192.a:0 "Ta không hề biết mọi chuyện lại tệ đến thế..."
  bp1_yearly.8192.a.flavor:0 "Đã đến lúc [sycophant_scope.GetFirstNameNoTooltip] phải ra đi"
  bp1_yearly.8192.b:0 "Triều đình của ta không có chỗ cho sự ghen ghét nhỏ nhen."
  bp1_yearly.8192.b.flavor:0 "Kẻ ghét thì mãi sẽ ghét"
  bp1_yearly.8192.fired_tt:0 "[insulting_scope.GetShortUIName|U] bị cách chức khỏi [council|E] của Ngài trong 5 năm"
  bp1_yearly.8192.c:0 "#EMP *thở dài*#! Ngươi không thấy ta đang #EMP bận rộn#! sao, [insulting_scope.GetFirstNameNoTooltip]?"
  bp1_yearly.8192.c.flavor:0 "Tài năng của [sycophant_scope.GetFirstNameNoTooltip] là vô tận"

  disgruntled_vassals_modifier:0 "Chư hầu bất mãn"
  disgruntled_vassals_modifier_desc:0 "Nhân vật này đã khiến các quý tộc quyền lực trong lãnh thổ bất mãn vì quá thiên vị một kẻ được sủng ái."
  placated_vassals_modifier:0 "Chư hầu được xoa dịu"
  placated_vassals_modifier_desc:0 "Nhân vật này đã đặt các quý tộc quyền lực trong lãnh thổ lên trên một kẻ nịnh thần."
  personal_guard_modifier:0 "Cận vệ cá nhân"
  personal_guard_modifier_desc:0 "Nhân vật này được chỉ định một đội cận vệ riêng để bảo vệ."
  raconteur_modifier:0 "Bậc kể chuyện"
  raconteur_modifier_desc:0 "Khả năng kể chuyện của nhân vật này gần như vô song."
  toilet_humor_modifier:0 "Hài hước dung tục"
  toilet_humor_modifier_desc:0 "Nhân vật này có một danh tiếng nhất định về khiếu hài hước của mình."
  effective_agents_modifier:0 "Mật vụ hiệu quả"
  effective_agents_modifier_desc:0 "Nhân vật này bị e sợ vì tầm với và chất lượng của mạng lưới gián điệp."
  spyamateur_modifier:0 "Gián điệp nghiệp dư"
  spyamateur_modifier_desc:0 "Năng lực làm chủ quản mật thám của nhân vật này vẫn còn nhiều thiếu sót."
  sycophant_story_failed_scheme_detection_modifier:0 "Âm mưu chưa bị phát hiện"
