l_english:
  bp1_house_feud.0001.t:0 "Một Gia Tộc Đáng Nguyền Rủa"
  bp1_house_feud.0001.desc:0 "Ta đã nhẫn nhịn [house_feud_rival.GetTitledFirstName] cùng sự đê tiện của [house_feud_rival.GetHerHis] quá lâu rồi.\n\nĐôi khi ta mơ đến việc giày xéo Gia tộc [house_feud_rival.GetHouse.GetBaseName] xuống bùn đất, xóa sổ cái gia đình [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)] đó khỏi sử sách, cùng toàn bộ khổ đau chúng đã gây ra cho ta.\n\nTa trằn trọc, dằn vặt bởi chính lòng căm hận của mình, nhưng còn ai xứng đáng để hứng chịu nó hơn [house_feud_rival.GetFirstNameNoTooltip]?"
  bp1_house_feud.0001.target:0 "\n\nLiệu những lời đồn có đúng? Phải chăng tất cả bắt nguồn từ một [relation.Custom('GetFamilyFeudShort')] từ rất lâu trước đây?"
  bp1_house_feud.0001.a:0 "Ta sẽ biến điều này thành sứ mệnh cả đời."
  bp1_house_feud.0001.b:0 "Hẳn phải có cách tốt hơn để dùng nguồn năng lượng này..."
  bp1_house_feud.0002.t:0 "Đoàn Kết Gia Tộc"
  bp1_house_feud.0002.desc:1 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta, [house_feud_victim.GetTitledFirstName], không ngừng than vãn về sự đê tiện của kẻ thù [house_feud_victim.GetHerHis], [house_feud_attacker.GetTitledFirstName].\n\nMỗi lần ta gặp [house_feud_victim.GetHerHim], [house_feud_victim.GetSheHe] lại nhắc đến con [SCOPE.Custom('VenomousCreature')|U] của Nhà [house_feud_attacker.GetHouse.GetBaseName], thúc giục ta cho lời khuyên hoặc trợ giúp để hạ bệ [house_feud_attacker.GetHerHim]."
  bp1_house_feud.0002.a:0 "Nghe có vẻ là chuyện nội bộ gia đình."
  bp1_house_feud.0002.b:0 "Sao [house_feud_attacker.GetFirstNameNoTooltip] dám thách thức [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta?"
  bp1_house_feud.0002.c:0 "[house_feud_victim.GetSheHe|U] phải tự giải quyết những vấn đề của chính [house_feud_victim.GetHerHis]."
  bp1_house_feud.0003.t:0 "Mắt Đền Mắt"
  bp1_house_feud.0003.desc:0 "Ta đi đi lại lại bên ngoài [ROOT.Char.Custom('ResidenceBuilding')] của mình, không thể xua tan những ký ức về [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta, [house_feud_victim.GetTitledFirstName], người đã bị [house_feud_attacker.GetTitledFirstName] cướp đi mạng sống trước thời điểm định mệnh của [house_feud_victim.GetHerHis]... tên ác thú thuộc Nhà [house_feud_attacker.GetHouse.GetBaseName] đáng khinh kia!\n\nChỉ có một cách duy nhất để danh dự của ta được khôi phục, và để [house_feud_victim.GetFirstNameNoTooltip] được báo thù..."
  bp1_house_feud.0003.a:0 "Nguyền rủa Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]!"
  bp1_house_feud.0003.b:0 "Chính tay ta sẽ tiễn [house_feud_attacker.GetFirstNameNoTooltip] xuống [ROOT.Char.GetFaith.NegativeAfterLife]!"
  bp1_house_feud.0003.c:0 "Báo thù cũng không thể đưa [house_feud_victim.GetHerHim] trở lại."
  bp1_house_feud.0004.t:0 "Một Kẻ Thù Của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('old_house_head'))|U]"
  bp1_house_feud.0004.desc:0 "Khi [old_house_head.GetTitledFirstNamePossessiveRegnal] qua đời, trách nhiệm lãnh đạo Gia tộc [ROOT.Char.GetHouse.GetName] rơi vào tay ta, cùng với nghĩa vụ bảo vệ gia đình.\n\nMối thù giữa [house_feud_rival.GetTitledFirstName] và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] của ta vốn chẳng phải bí mật; lòng căm ghét của [old_house_head.GetFirstNamePossessiveNoTooltip] dành cho lũ [house_feud_rival.GetHouse.GetBaseName] đã thấm vào đời sống thường nhật của [old_house_head.GetPrimaryTitle.GetAdjectiveNoTooltip] [old_house_head.Custom('GetCourt')].\n\nTa giằng xé giữa việc quên đi những ân oán cũ, hay tôn trọng điều mà [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] quá cố hẳn mong muốn..."
  bp1_house_feud.0004.a:0 "Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] không bao giờ quên kẻ thù."
  bp1_house_feud.0004.b:0 "Lòng căm hận của [old_house_head.GetFirstNamePossessiveNoTooltip] đã chết cùng [old_house_head.GetHerHim]."
  bp1_house_feud.0005.t:0 "Sự Cám Dỗ Của Thù Hận"
  bp1_house_feud.0005.desc:0 "Khoảng trống mà cái chết của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetFirstNamePossessive], để lại trong tim ta vẫn còn đó, bị xé toạc mỗi khi ta nghĩ đến kẻ sát nhân bẩn thỉu của [house_feud_victim.GetHerHis], và công lý vẫn chưa được thực thi.\n\nNgày qua ngày, logic tàn nhẫn của sự báo thù chiếm trọn tâm trí ta, được nuôi dưỡng mỗi đêm trong những giấc mơ chập chờn, nơi ta thấy [house_feud_attacker.GetFirstName] và toàn bộ Nhà [house_feud_attacker.GetHouse.GetBaseName] gánh chịu nỗi đau như gia đình ta..."
  bp1_house_feud.0005.a:0 "'[ROOT.Char.GetHouse.GetMotto]!'"
  bp1_house_feud.0005.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] sẽ không thoát được đâu."
  bp1_house_feud.0005.c:0 "Không gì có thể mang [house_feud_victim.GetFirstNameNoTooltip] trở lại..."
  bp1_house_feud.0005.c.rival:0 "[ROOT.Char.GetFaith.HighGodName] sẽ trừng phạt cái ác."
  bp1_house_feud.0006.t:0 "[house_feud_claim.GetBaseNameNoTierPossessiveNoTooltip] – [house_feud_rival.GetTitleAsNameNoTooltip] Đích Thực"
  bp1_house_feud.0006.desc:0 "Gương mặt nhếch mép của [house_feud_rival.GetTitledFirstNamePossessive] lại xâm chiếm tâm trí ta một lần nữa. Ta bật dậy, viện cớ vụng về để rời khỏi đống lửa trại, rồi bước đi trong màn đêm.\n\nTa không sao xua nổi hình ảnh con [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] đó khỏi đầu; ý nghĩ về việc [house_feud_rival.GetHerHim] và thân tộc của [house_feud_rival.GetHerHis] vẫn ngang nhiên, không bị thách thức, hả hê tại [house_feud_rival.GetCapitalLocation.GetName]...\n\n"
  bp1_house_feud.0006.higher:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName], #EMP chính ta#! mới là người cai trị hợp pháp của [house_feud_claim.GetBaseNameNoTier]."
  bp1_house_feud.0006.same:0 "Chẳng lẽ ta sẽ không bao giờ được yên nghỉ cho đến khi [house_feud_claim.GetBaseNameNoTier] thuộc về ta?"
  bp1_house_feud.0006.multi:0 "[house_feud_claim.GetBaseNameNoTier], cùng những vùng đất khác mà [house_feud_rival.GetTitledFirstName] đang bám víu, đều phải thuộc về ta."
  bp1_house_feud.0006.previous:1 "Những vùng đất từng thuộc [house_feud_previous.GetTitledFirstNamePossessive] sẽ quay trở về với chúng ta."
  bp1_house_feud.0006.a:0 "Gia tộc [house_feud_rival.GetHouse.GetBaseNameNoTooltip] phải bị tiêu diệt."
  bp1_house_feud.0006.b:0 "[house_feud_rival.GetFirstNameNoTooltip] chính là vấn đề."
  bp1_house_feud.0006.c:0 "Uống chút [ROOT.Char.Custom('RegionalAlcoholicDrink')], và nghĩ sang chuyện khác vậy..."
  bp1_house_feud.0007.t:0 "Âm Ỉ Trong Cảnh Giam Cầm"
  bp1_house_feud.0007.house_arrest:0 "Bị giam lỏng trong phòng của [house_feud_attacker.GetTitledFirstNamePossessive], dù còn dễ chịu hơn ngục tối, vẫn chẳng phải cách sống.\n\nThức ăn thì tệ — giải trí còn tệ hơn — nhưng ta có thừa thời gian để nuôi dưỡng lòng căm hận với kẻ giam giữ mình."
  bp1_house_feud.0007.dungeon:0 "Bị nhốt trong ngục của [house_feud_attacker.GetTitledFirstNamePossessive], chỉ có âm thanh xa xôi của [house_feud_attacker.GetCapitalLocation.GetNameNoTooltip] và tiếng gầm gừ hiếm hoi của lính gác [house_feud_attacker.GetCulture.GetNameNoTooltip] làm khuây khỏa, ta có thừa thời gian để nuôi dưỡng lòng căm hận với kẻ giam giữ mình."
  bp1_house_feud.0007.camp: "Lăn lộn trong [house_feud_attacker.GetTitledFirstNamePossessive] [house_feud_attacker.Custom('GetCourt')], phó mặc cho thời tiết và những lời giễu cợt của lính canh, ta có thừa thời gian để nuôi dưỡng lòng căm hận với kẻ giam giữ mình."
  bp1_house_feud.0007.desc:0 "\n\n[house_feud_attacker.GetSheHe|U] đã giam giữ ta lâu hơn mức hợp lý rất nhiều, và ta chỉ có thể đoán ra động cơ nhỏ nhen hoặc thất thường trong sự chần chừ của [house_feud_attacker.GetHerHis]. Ta sắp phát điên rồi..."
  bp1_house_feud.0007.a:0 "Ta sẽ hủy diệt cái gia tộc khốn kiếp này."
  bp1_house_feud.0007.b:0 "Một ngày nào đó, ta sẽ trói [house_feud_attacker.GetFirstNameNoTooltip] bằng chính những xiềng xích như thế này."
  bp1_house_feud.0007.c:0 "Có lẽ [house_feud_attacker.GetSheHe] cũng có lý do chính đáng..."
  bp1_house_feud.0008.t:0 "Giam Cầm Bất Công"
  bp1_house_feud.0008.desc:0 "Mùi thảo mộc và món hầm béo ngậy từ căn bếp của [ROOT.Char.Custom('ResidenceBuilding')] lan tỏa, nhưng ta không sao xua khỏi đầu cảnh ngộ của [house_feud_victim.GetFirstName] thân yêu."
  bp1_house_feud.0008.house_arrest:0 "\n\nTa mong kẻ giam giữ [house_feud_victim.GetHerHis], là [house_feud_attacker.GetTitledFirstName], ít nhất cũng cho [house_feud_victim.GetHerHim] ăn uống đầy đủ khi bị quản thúc — nhưng không một ai thuộc Nhà [ROOT.Char.GetHouse.GetBaseName] đáng phải sống dưới sự canh giữ!"
  bp1_house_feud.0008.dungeon:0 "\n\nNghĩ đến cảnh [house_feud_victim.GetHerHis] bị khóa chặt trong ngục của [house_feud_attacker.GetPrimaryTitle.GetAdjectiveNoTooltip] như một sinh vật hạ đẳng nào đó... một người của Nhà [ROOT.Char.GetHouse.GetBaseName]!"
  bp1_house_feud.0008.camp: "\n\nNghĩ đến cảnh [house_feud_victim.GetHerHim] bị xích như loài thú hèn mọn trong [house_feud_attacker.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetCourt')]... một người của Nhà [ROOT.Char.GetHouse.GetBaseName]!"
  bp1_house_feud.0008.closing:0 "\n\nCơn giận trong ta bùng lên khi nghĩ đến những tháng ngày [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta phải chịu cảnh giam cầm; [house_feud_attacker.GetFirstNameNoTooltip] đã đi quá xa khi đối xử với [house_feud_victim.GetHerHim] như vậy, cho dù [house_feud_attacker.GetTitleAsNameNoTooltip] là gì đi nữa!"
  bp1_house_feud.0008.a:0 "Sự ngược đãi của Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] sẽ không bị lãng quên."
  bp1_house_feud.0008.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] sẽ phải trả giá."
  bp1_house_feud.0008.c:0 "Ta chỉ còn biết cầu nguyện cho [house_feud_victim.GetHerHis] được thả."
  bp1_house_feud.0009.t:0 "Một [old_house_head.Custom2('RelationToMeShort', ROOT.Char)|U] Đầy Thù Hận"
  bp1_house_feud.0009.adult:0 "[ROOT.Char.GetCapitalLocation.GetName] vẫn đang để tang cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] của ta. Bên ngoài [ROOT.Char.Custom('ResidenceBuilding')], ta có thể trốn khỏi đám người than khóc, khỏi những tiếng gọi '[old_house_head.GetTitledFirstName]' không dứt, và ở một mình với suy nghĩ của bản thân.\n\nNghĩ rằng [old_house_head.GetSheHe] đã [old_house_head.GetDeathReasonHideKiller] bởi tay [house_feud_rival.GetTitledFirstName], cái thứ [house_feud_rival.GetHouse.GetBaseName] [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] đó..."
  bp1_house_feud.0009.child:0 "Theo thời gian, ta được kể ngày càng nhiều về [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] của mình, bao gồm cả việc [old_house_head.GetSheHe] đã [old_house_head.GetDeathReasonHideKiller] bởi tay [house_feud_rival.GetTitledFirstName]..."
  bp1_house_feud.0009.reciprocate:0 "Ta sẽ dạy cho [house_feud_rival.GetHerHim] cái giá phải trả cho mối thù của [house_feud_rival.GetHerHis]!"
  bp1_house_feud.0009.new:0 "Số phận đúng là một ả đàn bà tàn nhẫn!"
  bp1_house_feud.0009.closing:0 "\n\nNếu trên đời này còn có công lý, và danh dự của Nhà [ROOT.Char.GetHouse.GetBaseName] có thể được khôi phục, thì có lẽ chính ta sẽ phải tự tay thực hiện điều đó."
  bp1_house_feud.0009.a:0 "'[house_feud_rival.GetHouse.GetBaseNameNoTooltip]' từ hôm nay sẽ trở thành lời nguyền."
  bp1_house_feud.0009.b:0 "Một ngày nào đó, ta sẽ kết liễu [house_feud_rival.GetFirstNameNoTooltip]."
  bp1_house_feud.0009.c:0 "Đã có quá nhiều máu của Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] đổ xuống rồi..."
  bp1_house_feud.0010.t:0 "Sự Ngược Đãi Không Thể Tha Thứ"
  bp1_house_feud.0010.torture:0 "Nỗi đau thật không thể chịu đựng nổi, kéo dài không dứt... Ta chưa từng nghĩ [house_feud_attacker.GetTitledFirstName] lại có thể tàn bạo đến vậy, huống chi còn dám đối xử như thế với một [ROOT.Char.GetTitleAsNameNoTooltip], một quý tộc!\n\n"
  bp1_house_feud.0010.blinding:0 "Ta vẫn chưa thể hoàn toàn chấp nhận việc mất đi thị lực của mình... có lẽ ta đã đánh giá thấp [house_feud_attacker.GetTitledFirstName]... Ta đã bật khóc vì sự bất lực tuyệt đối của bản thân, nếu như cơn đau cho phép.\n\n"
  bp1_house_feud.0010.castration:0 "Nỗi đau từ việc ta bị... ngược đãi... vẫn còn dai dẳng, mỗi lần cử động đều nhắc ta nhớ đến những gì mình đã mất. Lập kế hoạch trả thù [house_feud_attacker.GetTitledFirstName] là điều duy nhất giúp ta phân tâm.\n"
  bp1_house_feud.0010.house_arrest:0 "Dù có thể tự an ủi rằng ta không bị giam trong ngục của Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip], nhưng trong hoàn cảnh này, đó cũng chẳng phải là sự an ủi gì lớn lao."
  bp1_house_feud.0010.dungeon:0 "Ở nơi ẩm thấp hôi hám này, ta đã sa sút đến mức nào — tất cả là do bàn tay của tên khốn thuộc Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
  bp1_house_feud.0010.free:0 "Ta lại được tự do, nhưng sẽ không bao giờ còn nguyên vẹn nữa. Chỉ riêng [house_feud_attacker.GetFirstNameNoTooltip] mới biết cái giá mà [house_feud_attacker.GetSheHe] đã bắt ta phải trả."
  bp1_house_feud.0010.a:0 "Chúng sẽ ước rằng mình chưa từng được sinh ra."
  bp1_house_feud.0010.b:0 "Nhà [house_feud_existing.GetHouse.GetBaseNameNoTooltip] đã gặp đúng đối thủ."
  bp1_house_feud.0010.c:0 "[house_feud_attacker.GetFirstNameNoTooltip] sẽ phải trả giá cho chuyện này, bằng cách nào đó."
  bp1_house_feud.0010.d:0 "Ta nghĩ mình đã chán ngấy bạo lực rồi..."
  bp1_house_feud.0011.t:0 "Một [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))|U] Bị Ngược Đãi"
  bp1_house_feud.0011.torture:0 "Ta hầu như không thể chịu nổi khi nghe những lời kể về việc [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta, [house_feud_victim.GetFirstNamePossessive], bị tra tấn dưới tay [house_feud_attacker.GetTitledFirstName].\n\n"
  bp1_house_feud.0011.blinding:0 "Tin tức về việc [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetTitledFirstNamePossessive], bị [house_feud_attacker.GetTitledFirstName] #EMP làm mù#! vẫn chưa thể khiến ta hoàn toàn thấm thía.\n\n"
  bp1_house_feud.0011.castration:0 "Tin tức về việc... #EMP bị hoạn#! của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] ta, [house_feud_victim.GetFirstName], bao trùm khắp [ROOT.Char.Custom('GetCourt')].\n\n"
  bp1_house_feud.0011.house_arrest:0 "Niềm an ủi duy nhất là [house_feud_victim.GetSheHe] đã được tha khỏi [house_feud_attacker.Custom('GetDungeon')] của [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
  bp1_house_feud.0011.dungeon:0 "Tệ hơn nữa, [house_feud_victim.GetSheHe] còn phải chịu đựng [house_feud_attacker.Custom('GetDungeon')] của [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
  bp1_house_feud.0011.camp:0 "Tệ hơn nữa, [house_feud_victim.GetSheHe] còn phải lăn lộn trong một [house_feud_attacker.Custom('GetDungeon')] hôi thối..."
  bp1_house_feud.0011.free:0 "Dù giờ đây [house_feud_victim.GetSheHe] đã được tự do, sự ngược đãi này chắc chắn sẽ ám ảnh [house_feud_victim.GetHerHim] trong suốt phần đời còn lại."
  bp1_house_feud.0011.closing:0 "\n\nTa thực sự có thể để cho sự sỉ nhục của Nhà [house_feud_attacker.GetHouse.GetBaseName] này trôi qua sao?"
  bp1_house_feud.0011.a:0 "Toàn bộ Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] sẽ phải trả giá."
  bp1_house_feud.0011.b:0 "Ta sẽ khiến [house_feud_attacker.GetFirstNameNoTooltip] phải đau đớn."
  bp1_house_feud.0011.c:0 "Không còn gì có thể làm được nữa..."
  bp1_house_feud.0012.t:0 "Đội Cặp Sừng Của Kẻ Bị Cắm Sừng"
  bp1_house_feud.0012.t.female:0 "Nữ Hoàng Bị Cắm Sừng"
  bp1_house_feud.0012.desc:0 "Việc biết rằng [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('house_feud_spouse'))] của ta đã có quan hệ xác thịt với tên [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)], [house_feud_attacker.GetTitledFirstName], gặm nhấm tâm trí ta không ngừng.\n\nBị cười nhạo sau lưng, trong khi [house_feud_spouse.GetFirstName] vẫn ung dung hưởng thụ sự tiện nghi trong [ROOT.Char.Custom('ResidenceBuilding')] của ta..."
  bp1_house_feud.0012.good:1 "\n\nSao [house_feud_spouse.GetSheHe] lại có thể làm chuyện này với ta?"
  bp1_house_feud.0012.bad:0 "\n\nGiá như ta chưa từng cưới cái thứ [house_feud_spouse.Custom2('InsultNoun', ROOT.Char)] này..."
  bp1_house_feud.0012.a:0 "Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] phải bị xử lý."
  bp1_house_feud.0012.b:0 "Quên Nhà [house_feud_existing.GetHouse.GetBaseNameNoTooltip] đi, đây là một vụ bê bối!"
  bp1_house_feud.0012.c:0 "Ta sẽ giết [house_feud_attacker.GetHerHim]."
  bp1_house_feud.0012.d:0 "Chuyện này chẳng giúp ích gì cả..."
  bp1_house_feud.0013.t:0 "Danh Dự Của Một [house_feud_spouse.Custom2('RelationToMePossessive', ROOT.Char)|U]"
  bp1_house_feud.0013.desc:0 "Tin tức về sự ngoại tình của [house_feud_spouse.GetTitledFirstNamePossessive] lan truyền, và ta không thể không nhận ra sự khinh miệt giấu sau nụ cười của từng gia nhân và [ROOT.Char.Custom('GetCourtier')].\n\n[house_feud_attacker.GetTitledFirstName] đã biến ta và gia tộc của ta thành trò cười..."
  bp1_house_feud.0013.a:0 "Toàn bộ Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] sẽ phải trả giá."
  bp1_house_feud.0013.b:0 "[house_feud_attacker.GetSheHe|U] khiến Nhà [house_feud_existing.GetHouse.GetBaseNameNoTooltip] trông còn đạo đức hơn!"
  bp1_house_feud.0013.c:0 "Ta sẽ khiến [house_feud_attacker.GetFirstNameNoTooltip] phải đau đớn."
  bp1_house_feud.0013.d:0 "Mọi chuyện đã là quá khứ rồi..."
  bp1_house_feud.0014.t:0 "Niềm Tự Hào Của Một [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('house_feud_victim'))|U]"
  bp1_house_feud.0014.desc:0 "[house_feud_victim.GetTitledFirstName] đã không thể giữ cho gia tộc của [house_feud_victim.GetHerHis] được trật tự; [house_feud_victim.GetHerHis] [house_feud_victim.Custom2('RelationToMeShort', SCOPE.sC('house_feud_spouse'))], [house_feud_spouse.GetTitledFirstNamePossessive], lén lút qua lại với tên [house_feud_attacker.Custom2('InsultAdjective', ROOT.Char)] [house_feud_attacker.GetTitledFirstName], khiến gia đình ta mang tiếng nhục nhã và bị chế giễu...\n\nTrong giọng nói thì thầm, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta giải thích mọi chuyện giữa những vò rượu [ROOT.Char.Custom('RegionalAlcoholicDrink')] phủ bụi. \"Chúng ta phải làm gì đó với tên [house_feud_attacker.Custom2('InsultNoun', SCOPE.sC('house_feud_victim'))] đó, [house_feud_victim.Custom2('RelationToMeShort', ROOT.Char)], chuyện này không thể để yên được!\""
  bp1_house_feud.0014.a:0 "Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] đã vượt quá giới hạn."
  bp1_house_feud.0014.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] không thể thoát tội được."
  bp1_house_feud.0014.c:0 "Tốt hơn hết là nên tha thứ và quên đi..."
 ### Ongoing Events ###
  bp1_house_feud.0100.t:0 "$story_cycle_house_feud_title$: Oán Hận Lệch Cân"
  bp1_house_feud.0100.desc:0 "Điềm chẳng lành khi tên gian ác [house_feud_rival.GetFirstName] vẫn là một [house_feud_rival.GetTitleAsNameNoTooltip], còn ta chỉ là một [ROOT.Char.GetTitleAsNameNoTooltip] thấp kém... Việc bảo vệ gia tộc trước những kẻ địch hùng mạnh như vậy đòi hỏi quá nhiều tâm sức.\n\n[relation.Custom('GetFamilyFeudShortFlavor')|U] vốn đã bất công, có lẽ mối thù này rắc rối hơn những gì nó đáng phải có..."
  bp1_house_feud.0100.a:0 "Dù là [house_feud_rival.GetTitleAsNameNoTooltip], công lý vẫn phải được thực thi."
  bp1_house_feud.0100.b:0 "Chuyện này kéo dài đủ rồi..."
  bp1_house_feud.0110.t:0 "$story_cycle_house_feud_title$: Đối Thủ Không Cùng Đẳng Cấp"
  bp1_house_feud.0110.desc:0 "Sự đê tiện của [house_feud_rival.GetTitledFirstName] và toàn bộ Nhà [house_feud_rival.GetHouse.GetBaseName] là điều không cần bàn cãi, nhưng liệu gia tộc của một [ROOT.Char.GetTitleAsNameNoTooltip] có nên đôi co với gia tộc của một [house_feud_rival.GetTitleAsNameNoTooltip]?\n\n[relation.Custom('GetFamilyFeudShortFlavor')] là không thể tha thứ, nhưng liệu chúng ta có nên tự hạ thấp mình, lãng phí thời gian vào những kẻ #EMP nhỏ bé#! như vậy?"
  bp1_house_feud.0110.a:0 "Dù là [house_feud_rival.GetTitleAsNameNoTooltip] hay [ROOT.Char.GetTitleAsNameNoTooltip], công lý vẫn phải được thực thi."
  bp1_house_feud.0110.b:0 "Đúng vậy, [house_feud_rival.GetSheHe] không đáng để ta bận tâm..."
  bp1_house_feud.0200.t:0 "$story_cycle_house_feud_title$: Biện Pháp Tuyệt Vọng"
  bp1_house_feud.0200.desc:0 "Mối thù với Nhà [house_feud_rival.GetHouse.GetBaseName] đã trở thành một thảm họa; chúng ta chẳng tiến gần hơn đến sự báo thù, còn những hành vi xúc phạm của chúng thì vẫn tiếp diễn.\n\nNếu muốn chấm dứt mối thù này cho ra hồn, có lẽ đã đến lúc tung đòn kết liễu..."
  bp1_house_feud.0200.a:0 "Đã đến lúc của [house_feud_rival.GetTitledFirstNamePossessiveNoTooltip]."
  bp1_house_feud.0200.b:0 "Những ngày của [house_feud_target.GetTitledFirstNamePossessiveNoTooltip] đã được đếm."
  bp1_house_feud.0200.c:0 "Ta có kế hoạch khác cho chúng."
  bp1_house_feud.0200.d:0 "Không, đây là một sai lầm..."
  bp1_house_feud.0210.t:0 "$story_cycle_house_feud_title$: Cái Giá Quá Đắt"
  bp1_house_feud.0210.desc:0 "Sự trả thù đối với Nhà [house_feud_rival.GetHouse.GetBaseName] vẫn còn rất xa; kể từ khi mối thù bắt đầu, chỉ có thêm những hành vi xúc phạm từ [house_feud_rival.GetTitledFirstName] và bè lũ rắn độc của [house_feud_rival.GetHerHis].\n\nĐôi lúc ta tự hỏi liệu mình đã đánh giá thấp kẻ thù hay chưa, và có lẽ rút lui sớm vẫn hơn là để mọi thứ vượt quá tầm kiểm soát."
  bp1_house_feud.0210.recent:0 "Có lẽ [house_feud_recent_death.GetTitledFirstName] cũng đã nghĩ như vậy..."
  bp1_house_feud.0210.a:0 "Không, ta sẽ cho chúng thấy!"
  bp1_house_feud.0210.b:0 "Đủ rồi... đủ rồi!"
  bp1_house_feud.0220.t:0 "$story_cycle_house_feud_title$: Giới Hạn Của Sự Thù Hằn"
  bp1_house_feud.0220.desc:0 "Những hành động chính đáng của chúng ta nhằm vào Nhà [house_feud_rival.GetHouse.GetBaseName] không hề bị bỏ qua; gần như chắc chắn rằng giờ đây chúng đã hối hận vì [relation.Custom('GetFamilyFeudShort')].\n\nDù những sinh vật như vậy chẳng xứng đáng được thương hại hay khoan dung, nhưng tổn hại ban đầu nay đã được trả đủ; kéo dài xung đột này vô thời hạn có lẽ không còn là điều có lợi cho chúng ta."
  bp1_house_feud.0220.recent:0 "Có lẽ máu của [house_feud_recent_kill.GetTitledFirstNamePossessive] đã là đủ..."
  bp1_house_feud.0220.a:0 "Không, chúng ta mới chỉ bắt đầu."
  bp1_house_feud.0220.b:0 "Mọi chuyện kết thúc rồi."
  bp1_house_feud.0300.t:0 "$story_cycle_house_feud_title$: Một Cuộc Ẩu Đả Mệt Mỏi"
  bp1_house_feud.0300.desc:1 "Toàn bộ Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] đều đã nghe câu chuyện về nguồn gốc mối thù giữa chúng ta và Nhà [house_feud_rival.GetHouse.GetBaseNameNoTooltip]; rằng [relation.Custom('GetFamilyFeudLongFlavor')].\n\nCâu chuyện này đã trở nên quá cũ kỹ. Chẳng lẽ chúng ta thực sự sẽ tiếp tục mối thù này mãi mãi, chỉ vì một [relation.Custom('GetFamilyFeudShort')] xảy ra từ nhiều năm trước?"
  bp1_house_feud.0300.a:0 "Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip] không bao giờ quên kẻ thù."
  bp1_house_feud.0300.b:0 "Chuyện này kéo dài quá lâu rồi."
  bp1_house_feud.0410.t:0 "$story_cycle_house_feud_title$: Bủa Vây Bởi Hiểm Nguy"
  bp1_house_feud.0410.desc:1 "\"Làm ơn!\" [house_feud_victim.GetTitledFirstName] van nài, \"Mối thù điên rồ này phải chấm dứt thôi! Ta sợ đến mức không dám đi #EMP bất cứ đâu#!, và chỉ cần nghe nhắc đến Nhà [house_feud_rival.GetHouse.GetBaseName] là đã giật mình rồi!\"\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta rõ ràng đang hoảng loạn... Ta bị giằng xé giữa hiểm họa đe dọa gia đình mình và nhu cầu dạy cho [house_feud_rival.GetTitledFirstName] một bài học."
  bp1_house_feud.0410.a:0 "Ngươi nói đúng... đã đến lúc kết thúc chuyện này."
  bp1_house_feud.0410.b:0 "Không, chúng ta phải hoàn thành những gì đã bắt đầu."
  bp1_house_feud.0420.t:1 "$story_cycle_house_feud_title$: Lời Thỉnh Cầu Của [house_feud_liege.GetTitleAsNamePossessiveNoTooltip]"
  bp1_house_feud.0420.desc:0 "Ta đã hiểu rõ rằng chủ công của ta, [house_feud_liege.GetTitledFirstName], không hài lòng với mối bất hòa giữa gia tộc ta và [house_feud_rival.GetTitledFirstName] cùng Nhà [house_feud_rival.GetHouse.GetBaseName], đồng thời mong muốn những chia rẽ trong nội bộ [house_feud_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] này được hàn gắn.\n\n[house_feud_liege.GetSheHe] là ai mà dám yêu cầu công lý không được thực thi? Nhưng nghĩ lại, có lẽ sẽ không khôn ngoan nếu tiếp tục làm gia tăng căng thẳng, đặc biệt là với [house_feud_liege.GetTitleAsNameNoTooltip]..."
  bp1_house_feud.0420.a:0 "Ta sẽ không bao giờ tha thứ cho [house_feud_rival.GetTitledFirstNameNoTooltip]."
  bp1_house_feud.0420.b:0 "Được thôi..."
 ### Target Events ###
  bp1_house_feud.0500.t:0 "$story_cycle_house_feud_title$: Mục Tiêu Của Cơn Thịnh Nộ"
  bp1_house_feud.0500.desc:0 "Dù ban đầu ta còn nghi ngờ, nhưng giờ đây khi nghe những lời đồn đại trong [ROOT.Char.Custom('GetCourt')], ta dần tin rằng [house_feud_rival.GetTitledFirstName] muốn lấy mạng ta, tất cả chỉ vì một [relation.Custom('GetFamilyFeudShort')].\n\nToàn bộ Nhà [ROOT.Char.GetHouse.GetName] đều trở thành mục tiêu của [house_feud_rival.GetHerHim] chỉ vì mối liên hệ với ta, và lòng thù hận này đã lan truyền từ người đứng đầu xuống toàn bộ gia tộc [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)] của [house_feud_rival.GetHerHis]."
  bp1_house_feud.0500.a:0 "Nhà [house_feud_rival.GetFirstNameNoTooltip] sẽ phải hối hận vì chuyện này."
  bp1_house_feud.0500.b:0 "Ta còn những mối lo lớn hơn."
  bp1_house_feud.0501.t:1 "$story_cycle_house_feud_title$: Mối Kình Địch Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]"
  bp1_house_feud.0501.reciprocating:1 "[house_feud_attacker.GetFirstName] đáng khinh thuộc Nhà [house_feud_attacker.GetHouse.GetBaseName] đã đáp trả sự thù địch công khai của gia tộc ta bằng chính sự thù hằn của gia tộc [house_feud_attacker.GetHerHis], một phản ứng đáng thương và đầy vu khống trước những bất bình chính đáng của chúng ta."
  bp1_house_feud.0501.new:1 "Ta được biết [house_feud_attacker.GetTitledFirstName], kẻ [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)] đáng khinh, đã thề rằng Nhà [ROOT.Char.GetHouse.GetBaseName] sẽ trở thành kẻ thù truyền kiếp của gia tộc [house_feud_attacker.GetHerHis]."
  bp1_house_feud.0501.desc:0 "\n\nHa, thật không ngờ [relation.Custom('GetFamilyFeudShortFlavor')] lại thực sự khiến Nhà [house_feud_attacker.GetDynastyHouseName] dựng cả lông mày!"
  bp1_house_feud.0501.a:0 "Ồ, cảm giác đó là #EMP hai chiều#! đấy!!"
  bp1_house_feud.0501.b:0 "Xem ra ta có thêm một kẻ thù mới."
  bp1_house_feud.0501.c:0 "Thật trẻ con."
  bp1_house_feud.0501.c.busy:0 "Sự chú ý của ta phải tập trung vào Nhà [house_feud_existing.GetBaseNameNoTooltip]."
  bp1_house_feud.0501.c.existing:0 "Ngu xuẩn. Cực kỳ ngu xuẩn."
  bp1_house_feud.0502.t:0 "$story_cycle_house_feud_title$: Căng Thẳng Lắng Dịu"
  bp1_house_feud.0502.desc:1 "Việc giảm bớt căng thẳng giữa ta và [house_feud_attacker.GetTitledFirstName], nếu điều đó thực sự có thể xảy ra, dường như xác nhận rằng [house_feud_attacker.GetSheHe] đã từ bỏ mối thù của [house_feud_attacker.GetHerHis] đối với Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
  bp1_house_feud.0502.another:1 "\n\nTa được biết rằng giờ đây [house_feud_attacker.GetSheHe] đã bị cuốn vào lòng căm hận dành cho [house_feud_new.GetHeadOfHouse.GetTitledFirstName] và Nhà [house_feud_new.GetBaseName]."
  bp1_house_feud.0502.peace:1 "\n\nThật khó tin, nhưng ta sẽ rất vui nếu được giải thoát khỏi nỗi lo về mối đe dọa từ Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
  bp1_house_feud.0502.a:0 "Quá ít, quá muộn."
  bp1_house_feud.0502.b:0 "Có lẽ #EMP đúng là#! lúc nên khép lại chuyện này."
  bp1_house_feud.0502.c:0 "Vậy là chúng đã mất cảnh giác!"
  bp1_house_feud.0502.d:0 "Sao ta lại lãng phí thời gian vào mớ nhảm nhí này?"
 ### Notification Events ###
  bp1_house_feud.0600.t:0 "$story_cycle_house_feud_title$: Kẻ Thù Chung"
  bp1_house_feud.0600.desc:1 "Sáng nay, ta đã suy ngẫm rất nhiều về bức thư với những lời lẽ cứng rắn mà ta nhận được từ [ROOT.Char.Custom2('RelationToMeShort', house_head_scope)] của ta, [house_head_scope.GetTitledFirstName].\n\n[ROOT.Char.GetHouse.GetHeadOfHouse.GetSheHe|U] đã bày tỏ mong muốn kiên quyết rằng toàn bộ gia tộc ta phải công khai xem 'lũ chó Nhà [house_feud_rival.GetHouse.GetBaseName]' là kẻ thù.\n\nTa không thể biện minh cho [relation.Custom('GetFamilyFeudShortFlavor')] — nhưng những rủi ro mà chuyện này mang lại cho gia tộc chúng ta thì sao?"
  bp1_house_feud.0600.a:0 "Ta không thể từ chối [ROOT.Char.GetHouse.GetHeadOfHouse.GetFirstNameNoTooltip]."
  bp1_house_feud.0600.b:0 "Cũng đã đến lúc rồi!"
  bp1_house_feud.0600.c:0 "Việc này sẽ chẳng dẫn đến đâu cả..."
 ### Scheme Events ###
  bp1_house_feud.0700.t:0 "$story_cycle_house_feud_title$: Trái Cấm"
  bp1_house_feud.0700.desc:0 "Những nghi ngờ của ta đã được xác nhận; [owner.GetTitledFirstName], kẻ đáng ghét thuộc Nhà [owner.GetHouse.GetBaseName], đang tìm kiếm tình cảm của ta...\n\n"
  bp1_house_feud.0700.desc_positive:0 "Ta luôn được dạy phải cảnh giác với kẻ thù của gia tộc mình, nhưng ta không thể phủ nhận rằng có một cảm giác... #EMP kích thích#! nào đó."
  bp1_house_feud.0700.desc_neutral:0 "Có lẽ, nếu không vì những tranh chấp giữa hai gia tộc, ta đã cân nhắc lời tán tỉnh của [owner.GetTitledFirstNamePossessive]."
  bp1_house_feud.0700.desc_negative:0 "Thật là một [owner.GetWomanMan] lố bịch — [owner.GetSheHe] nghĩ ta, hay chúng ta, là lũ ngốc sao?"
  bp1_house_feud.0700.a:0 "Cút đi, tên [house_feud_rival.GetHouse.GetBaseNameNoTooltip] [house_feud_rival.Custom2('InsultNoun', ROOT.Char)]!"
  bp1_house_feud.0700.b:0 "Hoa hồng dù mang tên gì thì vẫn ngát hương."
  bp1_house_feud.0701.t:0 "Con Mồi Cảnh Giác"
  bp1_house_feud.0701.desc:0 "\"Những gì người ta nói về sự điên rồ của Nhà [owner.GetHouse.GetBaseName] hẳn là đúng, nếu ngươi nghĩ ta sẽ từng mơ đến việc tán tỉnh ngươi. Hãy đem trò lừa bịp lố bịch của ngươi đi chỗ khác.\"\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] khi [target.GetSheHe] trút sự khinh miệt cay độc lên ta."
  bp1_house_feud.0701.a:0 "Ta đã nghĩ rằng ngươi... thôi vậy..."
 # Maintenance Events
  bp1_house_feud.0810.t:0 "$story_cycle_house_feud_title$: Giữ Ngọn Lửa Hận Thù"
  bp1_house_feud.0810.child:0 "Ta đã nghe rất nhiều câu chuyện về [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] của mình, [old_house_head.GetTitledFirstName], và những mối thù của [old_house_head.GetHerHis] với Nhà [house_feud_rival.GetHouse.GetBaseName]."
  bp1_house_feud.0810.adult:0 "Sau khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] của ta, [old_house_head.GetTitledFirstName], qua đời, ta bắt đầu tự hỏi liệu cuộc tranh chấp của gia tộc ta với Nhà [house_feud_rival.GetHouse.GetBaseName] có còn ý nghĩa hay không."
  bp1_house_feud.0810.desc:0 "\n\n[relation.Custom('GetFamilyFeudShortFlavor')] có thể từng đòi hỏi một sự đáp trả, nhưng liệu việc này kéo dài có thực sự có lợi cho chúng ta?\n\nNhà [ROOT.Char.GetHouse.GetBaseName] trông cậy vào ta để lãnh đạo, để bảo đảm sự tồn vong và danh dự của gia tộc, nhưng có lẽ đã có quá nhiều máu đổ vì mối thù này..."
  bp1_house_feud.0810.a:0 "Không, đó chính là điều bọn cóc Nhà [house_feud_rival.GetHouse.GetBaseNameNoTooltip] mong muốn!"
  bp1_house_feud.0810.b:0 "Phải, ta còn những chuyện quan trọng hơn cần lo."
  bp1_house_feud.0810.b.rival:0 "[house_feud_rival.GetFirstNameNoTooltip] là một con chó hèn, nhưng sự điên rồ này phải chấm dứt."
  bp1_house_feud.0830.t:0 "$story_cycle_house_feud_title$: Cảm Giác Ngọt Ngào Nhất"
  bp1_house_feud.0830.opening_drink:0 "Cuối cùng ta cũng có thể nhâm nhi một chén [ROOT.Char.Custom('RegionalAlcoholicDrink')],"
  bp1_house_feud.0830.opening:0 "Cuối cùng ta cũng có thể yên tâm nghỉ ngơi,"
  bp1_house_feud.0830.desc:1 "với sự an tâm rằng Nhà [first_rival.GetHouse.GetBaseName] đáng nguyền rủa đã bị xóa sổ khỏi thế gian, khép lại vĩnh viễn mối thù mà chúng ngu xuẩn khơi mào bằng [relation.Custom('GetFamilyFeudShortFlavor')]."
  bp1_house_feud.0830.first_owner:0 "\n\nTa đã chiến thắng, và tên ngu ngốc [first_rival.GetTitledFirstName] cuối cùng cũng đã rơi xuống [ROOT.Char.GetFaith.NegativeAfterLife]!"
  bp1_house_feud.0830.fallback:0 "\n\nDù [first_owner.GetTitledFirstName] không còn sống để chứng kiến ngày này, ta hy vọng [first_owner.GetSheHe] giờ đây có thể an nghỉ nơi [ROOT.Char.GetFaith.PositiveAfterLife]."
  bp1_house_feud.0830.losing:0 "\n\nDù chúng đã gây cho gia tộc ta tổn thất nặng nề trong những năm qua, không có sự thỏa mãn nào lớn hơn việc biết rằng lá cờ của chúng sẽ không bao giờ còn tung bay."
  bp1_house_feud.0830.winning:0 "\n\nChúng ta đã tiêu diệt chúng đến tận gốc, đảm bảo rằng không ai dám động đến gia tộc ta nếu chưa sẵn sàng trả giá đắt."
  bp1_house_feud.0830.even:0 "\n\nMỗi lần chúng ta gây tổn thất đều phải nhận lại sự trả đũa, nhưng giờ đây trang cuối cùng của câu chuyện về Nhà [first_rival.GetHouse.GetBaseNameNoTooltip] đã được khép lại."
  bp1_house_feud.0830.a:0 "Đừng bao giờ đối đầu với Nhà [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
  bp1_house_feud.0840.t:0 "$story_cycle_house_feud_title$: Kẻ Thù Tiếp Theo"
  bp1_house_feud.0840.desc:1 "Nhà [house_feud_rival.GetHouse.GetName] đầy thù hận giờ đây đã nằm trong tay [house_feud_rival.GetFirstName], một [house_feud_rival.GetTitleAsNameNoTooltip] chắc chắn cũng độc ác không kém những kẻ tiền nhiệm của [house_feud_rival.GetHerHis]."
  bp1_house_feud.0840.child:0 "Tuy vậy, [house_feud_rival.GetSheHe] vẫn chỉ là một [house_feud_rival.Custom('GirlBoy')]..."
  bp1_house_feud.0840.closing:1 "\n\nAi cũng biết về \"[relation.Custom('GetFamilyFeudShortFlavor')]\", nhưng còn tương lai thì sao?"
  bp1_house_feud.0840.a:0 "#EMP Không có gì#! thay đổi cả! Bọn chó Nhà [house_feud_rival.GetHouse.GetBaseNameNoTooltip] đều như nhau!"
  bp1_house_feud.0840.b:0 "Chuyện này đã đi quá xa rồi."
  bp1_house_feud.0840.b.rival:0 "Khốn kiếp [house_feud_rival.GetFirstNameNoTooltip], nhưng thế là đủ."
 # Victory Events
  bp1_house_feud.7000.t:0 "$story_cycle_house_feud_title$: [ROOT.Char.GetTitleAsNameNoTooltip] Chính Danh"
  bp1_house_feud.7000.desc:1 "Sau bao gian truân, cuối cùng chúng ta đã giành lại [house_feud_title.GetNameNoTier] từ tay [previous_holder.GetTitledFirstName] và Nhà [house_feud_rival.GetHouse.GetBaseName]!\n\nKhi bất công này đã được sửa chữa, có lẽ đã đến lúc nên khép lại mối thù cũ, kẻo lý do ban đầu của nó bị nhấn chìm trong biển máu."
  bp1_house_feud.7000.a:0 "Nhà [house_feud_rival.GetHouse.GetBaseNameNoTooltip] vẫn còn nợ máu."
  bp1_house_feud.7000.b:0 "Mọi chuyện đã kết thúc, chúng ta thắng rồi."
  bp1_house_feud.7001.t:0 "$story_cycle_house_feud_title$: Máu Đổi Máu"
  bp1_house_feud.7001.desc:0 "[house_feud_attacker.GetTitledFirstName], kẻ sát nhân đê tiện đã giết [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta, [house_feud_victim.GetTitledFirstName], cuối cùng cũng đã bị trừng phạt bởi chính tay chúng ta, và danh dự của gia tộc ta được phục hồi.\n\nKhi mục tiêu của mối thù Nhà [ROOT.Char.GetHouse.GetBaseName] đã đạt được, có lẽ tốt hơn hết là nên gác lại cuộc #EMP xung đột#! này."
  bp1_house_feud.7001.a:0 "Ta vẫn chưa xong với Nhà [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
  bp1_house_feud.7001.b:0 "Đừng để cả thế giới chìm trong mù lòa."
  bp1_house_feud.7002.t:0 "$story_cycle_house_feud_title$: Chung Số Phận"
  bp1_house_feud.7002.opening:0 "[house_feud_attacker.GetTitledFirstName], kẻ tra tấn tàn nhẫn [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta, [house_feud_victim.GetTitledFirstName], đã phải chịu chung số phận dưới tay chúng ta!"
  bp1_house_feud.7002.opening_self:0 "[house_feud_attacker.GetTitledFirstName], kẻ tra tấn tàn nhẫn của ta, đã phải chịu chung số phận dưới tay ta!"
  bp1_house_feud.7002.desc:1 "\n\nGiờ đây khi sự xúc phạm ban đầu đối với Nhà [ROOT.Char.GetHouse.GetBaseName] đã được trả thù, câu hỏi đặt ra là chúng ta sẽ tiếp tục cuộc chiến với gia tộc [house_feud_attacker.GetHouse.GetBaseName] đến bao giờ..."
  bp1_house_feud.7002.a:0 "Vẫn còn rất nhiều việc phải làm."
  bp1_house_feud.7002.b:0 "Chúng ta đã chiến thắng."
  bp1_house_feud.7003.t:0 "$story_cycle_house_feud_title$: Trả Thù Nhục Dục"
  bp1_house_feud.7003.opening:0 "[house_feud_attacker.GetTitledFirstName], kẻ quyến rũ đê tiện đã lừa gạt [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] của ta, [house_feud_victim.GetTitledFirstNamePossessive] [house_feud_spouse.GetWifeHusband], [house_feud_spouse.GetTitledFirstName],"
  bp1_house_feud.7003.opening_self:0 "[house_feud_attacker.GetTitledFirstName], kẻ quyến rũ đê tiện đã lừa gạt [house_feud_spouse.GetWifeHusband] của ta, [house_feud_spouse.GetTitledFirstName],"
  bp1_house_feud.7003.desc:1 "cuối cùng cũng đã phải nhận lấy kết cục tương tự dưới tay chúng ta!\n\nVới vết nhơ này đã được rửa sạch, cuộc xung đột với Nhà [house_feud_rival.GetHouse.GetBaseNameNoTooltip] dường như đang tiến đến hồi kết tự nhiên."
  bp1_house_feud.7003.a:0 "Mới chỉ là khởi đầu!"
  bp1_house_feud.7003.b:0 "Một cái kết thỏa mãn..."
