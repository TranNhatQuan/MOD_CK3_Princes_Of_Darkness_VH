  house_feud_family_blinded_flavor:0 "$house_feud_head_blinded_flavor$, và [ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] hứa sẽ báo thù"
  house_feud_head_cuckolded_flavor:0 "[ROOT.Var('house_feud_attacker').Char.GetFirstName] đã làm nhục [ROOT.Var('house_feud_victim').Char.GetFirstName] với [ROOT.Var('house_feud_spouse').Char.GetFirstName]"
  house_feud_family_cuckolded_flavor:0 "$house_feud_head_cuckolded_flavor$, và [ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] hứa sẽ báo thù"
  house_feud_competing_claim_flavor:0 "[ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] theo đuổi yêu sách của [ROOT.Var('house_feud_house_1_first_head').Char.GetHerHis] đối với [ROOT.Var('house_feud_title').Title.GetBaseNameNoTier], hiện đang bị [ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] chiếm giữ một cách bất công"
  house_feud_inherited_rivalry_flavor:0 "[ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] tiếp tục mối kình địch của [ROOT.Var('house_feud_house_1_first_head').Char.Custom2('RelationToMeShort', ROOT.Var('house_feud_victim').Char)] [ROOT.Var('house_feud_victim').Char.GetFirstNamePossessive] với [ROOT.Var('house_feud_house_2_first_head').Char.GetFirstName]"
  house_feud_reciprocated_rivalry_flavor:4 "[ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] đã trả đũa mối thù truyền kiếp của [ROOT.Var('house_feud_house_1_first_head').Char.GetFirstNamePossessive]"
  house_feud_family_broken_grand_wedding_flavor:0 "[ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] phẫn nộ khi, dù đã được hứa hẹn một Hôn Lễ Trọng Đại, hôn ước giữa [ROOT.Var('house_feud_victim').Char.GetFirstName] và [ROOT.Var('house_feud_attacker').Char.GetFirstName] lại bị Gia tộc [ROOT.Var('house_feud_attacker').Char.GetHouse.GetBaseName] phá bỏ"
  house_feud_head_broken_grand_wedding_flavor:0 "[ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] phẫn nộ khi, dù đã được hứa hẹn một Hôn Lễ Trọng Đại, hôn ước của [ROOT.Var('house_feud_house_1_first_head').Char.GetHerHis] với [ROOT.Var('house_feud_attacker').Char.GetFirstName] lại bị Gia tộc [ROOT.Var('house_feud_attacker').Char.GetHouse.GetBaseName] phá bỏ"
  house_feud_murder_feast_flavor:0 "[ROOT.Var('house_feud_victim').Char.GetFirstName] [ROOT.Var('house_feud_victim').Char.GetDeathReasonHideKiller] tại một buổi yến tiệc do [ROOT.Var('house_feud_attacker').Char.GetFirstName] tổ chức, và [ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] tìm kiếm công lý"
  house_feud_bloody_wedding_flavor:0 "[ROOT.Var('house_feud_victim').Char.GetFirstName] [ROOT.Var('house_feud_victim').Char.GetDeathReasonHideKiller] tại một lễ cưới do [ROOT.Var('house_feud_attacker').Char.GetFirstName] tổ chức, và [ROOT.Var('house_feud_house_1_first_head').Char.GetFirstName] tìm kiếm công lý"
