  action_ongoing_house_feud_desc:2 "Gia tộc của ngài xem Nhà [recipient.GetHouse.GetBaseName] là kẻ thù, và sẽ nhận được phần thưởng khi đánh bại họ.\n\n#help Giết chóc, [torturing|E], cắm sừng, cướp bóc và giành chiến thắng trong các [wars|E] chống lại thành viên của gia tộc đó sẽ làm tăng điểm số của Nhà ngài, trong khi việc trở thành nạn nhân của những hành động này sẽ khiến điểm số giảm xuống.#!\n"
