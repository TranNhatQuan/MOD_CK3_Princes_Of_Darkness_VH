 # Game Concept
  game_concept_house_feud:0 "Thù địch"
  game_concept_house_feuds: "Các mối thù địch"
  game_concept_house_feuding:0 "Đang thù địch"
  game_concept_house_feud_desc:4 "Đôi khi, một mối kình địch có thể phát triển thành mối thù truyền kiếp với một [house|E] cụ thể.\n\n#help Giết chóc, [torturing|E], cắm sừng, cướp bóc và chiến thắng trong các [wars|E] chống lại thành viên của [house|E] mục tiêu sẽ làm tăng điểm của Nhà Ngài, trong khi trở thành nạn nhân của những hành động này sẽ làm giảm điểm.\n\nTrong thời gian Thù địch diễn ra, toàn bộ thành viên [house|E] sẽ nhận được бонус [hostile_schemes|E] khi nhắm vào thành viên của [house|E] mục tiêu, và sẽ có xu hướng nhắm vào họ nhiều hơn.\n\nKhi Thù địch kết thúc, [house|E] của Ngài sẽ nhận được phần thưởng dựa trên mức độ thiệt hại gây ra cho kẻ thù, từ [GetModifier('house_feud_terrible_modifier').GetNameWithTooltip] đến [GetModifier('house_feud_excellent_modifier').GetNameWithTooltip]."
