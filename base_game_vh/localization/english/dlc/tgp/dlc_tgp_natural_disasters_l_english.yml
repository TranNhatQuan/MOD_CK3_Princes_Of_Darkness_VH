  every_realm_disaster_county_great_project_custom: "Mỗi [realm|E] [county|E] trong [great_project.MakeScope.Var('situation').Situation.GetName]"

 ### EARTHQUAKES
  situation_type_natural_disaster_earthquake: "$natural_disaster_earthquake_situation$"
  situation_natural_disaster_earthquake: "$natural_disaster_earthquake_situation$"
  situation_type_natural_disaster_earthquake_desc: "Một [earthquake|E] là loại [natural_disaster|E] gây phá hủy nghiêm trọng và đột ngột ở một số ít [county|E].\n\n$game_concept_earthquakes$ chỉ có thể xảy ra ở những vùng dễ xảy ra địa chấn."
  situation_natural_disaster_earthquake_desc: "$situation_type_natural_disaster_earthquake_desc$"

  natural_disaster_earthquake_situation: "[Situation.MakeScope.Var('epicenter_county').Title.GetNameNoTierNoTooltip] Động đất"
  natural_disaster_earthquake_situation_desc: "$situation_type_natural_disaster_earthquake_desc$"

  natural_disaster_earthquake_warning_situation_phase: "Tiếng rung báo trước"
  natural_disaster_earthquake_warning_situation_phase_desc: "Trong giai đoạn Tiếng rung báo trước [situation_phase|E], những rung động nhỏ được cảm nhận khắp vùng đất. Mặc dù chỉ mạnh như một đàn ngựa chạy, nhưng rung động này có thể báo hiệu một lực lượng lớn và tàn phá đang di chuyển dưới đất."
  earthquake_warning: "$natural_disaster_earthquake_warning_situation_phase$"
  situation_natural_disaster_phase_earthquake_warning_effects: "$situation_natural_disaster_earthquake_phase_warning$"

  natural_disaster_earthquake_impact_situation_phase: "Tác động"
  natural_disaster_earthquake_impact_situation_phase_desc: "Sau những rung động nhẹ, mặt đất rung mạnh. Các tòa nhà có thể sập, người dân có thể bị thương hoặc tử vong do đổ nát. Một vết nứt có thể xuất hiện tại tâm chấn, chia cảnh quan làm hai. Chuyển động đột ngột có thể khiến bụi và đống đổ nát bay lên không, tăng nguy cơ tử vong cho những người gần đó."
  situation_natural_disaster_phase_earthquake_impact_effects: "$situation_natural_disaster_earthquake_phase_impact$"

  natural_disaster_earthquake_recovery_situation_phase: "Hồi phục"
  natural_disaster_earthquake_recovery_situation_phase_desc: "Sau tác động chính, toàn bộ hậu quả của thiên tai trở nên rõ ràng. Dân chúng có thể bất mãn khi tài sản và sinh kế bị hư hỏng hoặc phá hủy. Đống đổ nát cản trở nỗ lực xây dựng lại, và với số người mất đi, việc hồi phục chậm lại do giảm dân số và lực lượng lao động."
  earthquake_recovery: "$natural_disaster_earthquake_recovery_situation_phase$"
  earthquake_recovery_effects: "Hồi phục sau động đất"
  earthquake_recovery_effects_concept: "[natural_disaster|E]"

  natural_disaster_earthquake_affected_ruler: "Thiên tai: #weak Động đất#!"
  natural_disaster_earthquake_affected_vassal: "$natural_disaster_earthquake_affected_ruler$"
  natural_disaster_flood_affected_ruler: "Thiên tai: #weak Lũ lụt#!"
  natural_disaster_flood_affected_vassal: "$natural_disaster_flood_affected_ruler$"

  natural_disaster_earthquake_spawn_tooltip: "Một [earthquake|E] xuất hiện ở [situation.MakeScope.Var('epicenter_county').Title.GetNameNoTier]"

  natural_disaster_earthquake_sub_region_disaster_area: "Khu vực thiên tai"
  natural_disaster_earthquake_sub_region_disaster_area_desc: "Ảnh hưởng đến [SituationSubRegion.GetAffectedTitlesList]"
  natural_disaster_earthquake_sub_region_disaster_neighbours: "Khu vực lân cận thiên tai"
  natural_disaster_earthquake_participant_group_affected_ruler: "$game_concept_independent_rulers$"
  natural_disaster_earthquake_participant_group_affected_vassal: "$game_concept_vassals$"

