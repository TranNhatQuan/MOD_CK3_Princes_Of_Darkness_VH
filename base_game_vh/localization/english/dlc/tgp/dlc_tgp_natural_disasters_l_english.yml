  situation_type_natural_disaster_flood_desc: "$situation_natural_disaster_flood_desc$"
  situation_natural_disaster_flood_desc: "[flood|E] là một [natural_disaster|E] gây ra thiệt hại ngày càng tăng ở một số lượng lớn các [counties|E].\n\nLũ lụt chỉ có thể xảy ra dọc theo bờ của các con sông lớn."

