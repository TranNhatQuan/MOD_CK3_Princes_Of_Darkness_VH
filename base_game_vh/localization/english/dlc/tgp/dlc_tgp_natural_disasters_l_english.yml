  warning: "Cảnh báo"
  warning_desc: "Trước nhiều [natural_disaster|E], thường có những dấu hiệu báo trước. Dù rõ ràng hay tinh vi, những thay đổi này trong môi trường có thể cảnh báo. Một người cai trị cảnh giác và để ý có thể hành động kịp thời để giảm thiểu thiệt hại."
  impact: "Tác động"
  impact_desc: "Khi thảm họa ập đến, sự chuẩn bị của vị quân chủ sẽ bị đặt vào thử thách. Bất kể nỗ lực ra sao, thương vong là khó tránh khỏi, làm đình trệ tiến độ trong khu vực. Vùng này sẽ bước vào thời kỳ bất ổn do mất mát [development|E] và cơ sở hạ tầng hiện có bị hư hại."
  recovery: "Hồi phục"
  recovery_desc: "Sau tác động, việc tái thiết khu vực, đôi khi thông qua một [great_project|E], là điều cần thiết. Một người cai trị tinh tường cũng sẽ có biện pháp phòng ngừa để tránh một [natural_disaster|E] khác xảy ra."

  every_disaster_county_custom: "Mỗi [county|E] trong [situation.GetName] [situation_sub_region.GetName]"
