  natural_disaster_flood_situation_desc: "$situation_natural_disaster_flood_desc$"

  natural_disaster_flood_warning_situation_phase: "Cảnh báo"
  natural_disaster_flood_warning_situation_phase_desc: "Nước đọng và đất ẩm bắt đầu xuất hiện khắp vùng. Lượng mưa có thể tăng đáng kể, làm sông tràn bờ. Dù chưa mạnh, rõ ràng nước có thể ngấm vào nhà và làm đất nền bão hòa."

  natural_disaster_flood_impact_situation_phase: "Tác động"
  natural_disaster_flood_impact_situation_phase_desc: "Nước lũ tràn vào nhà, ngập đường, và làm chết những ai không chống được dòng nước. Ruộng đồng trước đây trù phú nay bị ngập úng và cằn cỗi, dự báo một vụ mùa tồi tệ sắp tới."
  flood_aftermath: "$natural_disaster_flood_impact_situation_phase$"
  situation_natural_disaster_phase_flood_aftermath_effects: "$situation_natural_disaster_flood_phase_impact$"
