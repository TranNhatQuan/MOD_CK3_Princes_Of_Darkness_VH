	game_concept_civilian_governors:  "Thống đốc Dân sự"
	game_concept_civilian_governor_short:  "Dân sự"
	game_concept_civilian_governor_desc:  "Thống đốc Dân sự là một [governor|E] với [vassal_obligations|E] dân sự. Không giống như [military_governors|E], họ không thể tuyển [title_men_at_arms|E] và chỉ tập trung vào các nhiệm vụ hành chính cũng như phát triển vùng đất họ cai quản.\n\nCác [characters|E] theo [civilian_career_path|E] có thể trở thành Thống đốc Dân sự."
	game_concept_military_governor:  "Thống đốc Quân sự"
	game_concept_military_governors:  "Thống đốc Quân sự"
	game_concept_military_governor_short:  "Quân sự"
	game_concept_military_governor_desc:  "Thống đốc Quân sự là một [governor|E] với [vassal_obligations|E] quân sự. Họ có thể tuyển [title_men_at_arms|E], không giống như [civilian_governors|E], và sẽ sử dụng lực lượng này để bảo vệ [realm|E] khỏi xâm lược bên ngoài cũng như hỗ trợ các Thống đốc khác khi cần viện trợ quân sự.\n\nCác [characters|E] theo [military_career_path|E] có thể trở thành Thống đốc Quân sự."

 # Great Projects
	game_concept_great_project:  "Dự án Vĩ đại"
	game_concept_great_projects:  "Dự án Vĩ đại"
	game_concept_great_project_i:  "@great_project_icon!"
	game_concept_great_project_possessive:  "Dự án Vĩ đại"
	game_concept_great_project_desc:  "Các Dự án Vĩ đại là những công trình quy mô lớn, huy động toàn bộ nguồn lực của [realm|E].\n\nMột số Dự án Vĩ đại liên quan đến việc xây dựng một [great_building|E], trong khi những dự án khác nhằm khắc phục hậu quả của [natural_disaster|E].\n\nTrong khi người [ruler|E] của Vương quốc giám sát tiến độ Dự án Vĩ đại, các [subjects|E] có thể đóng góp [great_project_contributions|E] để hỗ trợ quá trình phát triển."
	game_concept_great_project_contribution:  "Đóng góp"
	game_concept_great_project_contributions:  "Đóng góp"
	game_concept_great_project_contribute:  "Đóng góp"
	game_concept_great_project_contributed:  "Đóng góp"
	game_concept_great_project_contribution_desc:  "Các khoản đóng góp cho phép nhiều [rulers|E] cùng tham gia phát triển một [great_project|E], đổi lại nhận được nhiều lợi ích khác nhau.\n\nMột số khoản đóng góp là bắt buộc để tiến trình của Dự án Vĩ đại có thể bắt đầu, trong khi những khoản khác là tùy chọn. Các khoản đóng góp tùy chọn còn lại vẫn có thể được thực hiện trong khi tiến trình đã bắt đầu, nhưng chỉ trong một khoảng thời gian nhất định."
	game_concept_great_project_contributor:  "Người đóng góp"
	game_concept_great_project_contributors:  "Những người đóng góp"
	game_concept_great_project_contributor_possessive:  "Của người đóng góp"
	game_concept_great_project_contributors_possessive:  "Của những người đóng góp"
	game_concept_great_project_contributor_desc:  "Những người đóng góp là các [rulers|E] đã cam kết chi trả ít nhất một [great_project_contribution|E] cho một [great_project|E], và nhận được nhiều lợi ích khác nhau.\n\nĐối với hầu hết các [great_project_contributions|E], bất kỳ [subject|E] nào trong [realm|E] cũng có thể trở thành [great_project_contributor|E]."

 # Situation
	game_concept_dynastic_cycle:  "Chu kỳ Triều đại"
	game_concept_dynastic_cycle_possessive:  "Chu kỳ Triều đại"
	game_concept_dynastic_cycle_desc:  "$game_concept_dynastic_cycle$ mô tả tình trạng chính trị - xã hội của Đại Đế quốc Trung Hoa, vận hành theo các [situation_dynastic_cycle_phases|E] luân phiên giữa ổn định, bất ổn và hỗn loạn.\n\nTrọng tâm của $game_concept_dynastic_cycle$ là [mandate_of_heaven|E], một dạng [legitimacy|E] thuộc về Hoàng đế. Nếu nó bị đánh mất, Đại Đế quốc Trung Hoa sẽ #N sụp đổ#! - cho đến khi lại được thống nhất bởi một người xứng đáng làm Thiên tử.#!"

	game_concept_situation_dynastic_cycle_phase:  "Thời đại Chu kỳ Triều đại"
	game_concept_situation_dynastic_cycle_phases:  "Thời đại Chu kỳ Triều đại"
	game_concept_dynastic_cycle_era_short:  "Thời đại"
	game_concept_dynastic_cycle_eras_short:  "Thời đại"
	game_concept_situation_dynastic_cycle_phase_desc:  "Tình trạng chính trị - xã hội của [dynastic_cycle|E].\n\nCác thời đại:\n$BULLET$[dynastic_cycle_era_type_stable|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]\n$BULLET$[dynastic_cycle_era_type_unstable|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]\n$BULLET$[dynastic_cycle_era_type_chaotic|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
	game_concept_dynastic_cycle_era_type_stable:  "Thời đại Ổn định"
	game_concept_dynastic_cycle_era_type_stable_desc:  "[dynastic_cycle_era_types|E] ổn định thể hiện thời kỳ Đế chế thịnh vượng và thành công nhất, khi [mandate_of_heaven|E] mạnh mẽ.\n\nCác thời kỳ: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]"
	game_concept_dynastic_cycle_era_type_unstable:  "Thời đại Bất ổn"
	game_concept_dynastic_cycle_era_type_unstable_desc:  "[dynastic_cycle_era_types|E] bất ổn thể hiện thời kỳ đế chế rơi vào hỗn loạn do các tác động nội bộ hoặc bên ngoài, và [mandate_of_heaven|E] suy yếu.\n\nCác thời kỳ: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]"
	game_concept_dynastic_cycle_era_type_chaotic:  "Thời đại Hỗn loạn"
	game_concept_dynastic_cycle_era_type_chaotic_desc:  "[dynastic_cycle_era_types|E] hỗn loạn xuất hiện khi đế chế bị tan rã và [mandate_of_heaven|E] đã mất - nhưng có thể được khôi phục bởi những người xứng đáng.\n\nChỉ có một thời đại hỗn loạn: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
	game_concept_dynastic_cycle_era_type:  "Loại Thời đại Chu kỳ Triều đại"
	game_concept_dynastic_cycle_era_types:  "Loại Thời đại"
	game_concept_dynastic_cycle_era_type_desc:  "Có ba loại thời đại trong [dynastic_cycle|E], dùng để phân loại các [situation_dynastic_cycle_phases|E] theo chu kỳ ba giai đoạn của Chu kỳ Triều đại.\n\nCác loại thời đại: [dynastic_cycle_era_type_stable|E], [dynastic_cycle_era_type_unstable|E], [dynastic_cycle_era_type_chaotic|E]"

	game_concept_dynastic_cycle_catalyst:  "Xúc tác Chu kỳ Triều đại"
	game_concept_dynastic_cycle_catalysts:  "Xúc tác Chu kỳ Triều đại"
	game_concept_dynastic_cycle_catalyst_possessive:  "Xúc tác Chu kỳ Triều đại"
	game_concept_dynastic_cycle_catalysts_possessive:  "Xúc tác Chu kỳ Triều đại"
	game_concept_dynastic_cycle_catalyst_desc:  "$game_concept_situation_catalyst_desc$"

	game_concept_movement:  "Phe cánh"
	game_concept_movements:  "Phe cánh"
	game_concept_movement_possessive:  "Phe cánh"
	game_concept_movements_possessive:  "Phe cánh"
	game_concept_movement_desc:  "Một nhóm các [characters|E] có chung sở thích và tầm nhìn về [dynastic_cycle|E]. Mỗi thành viên trong Phe cánh có thể sử dụng các [interactions|E] và [decisions|E] khác nhau để thúc đẩy chu kỳ triều đại. Một [movement_leader|E] là người phát ngôn đại diện cho lợi ích của [movement_possessive|E] trước [son_of_heaven|E]."
	game_concept_movement_power:  "Sức mạnh Phe cánh"
	game_concept_movement_power_i:  "@movement_power_icon!"
	game_concept_movement_power_desc:  "Sức mạnh Phe cánh thể hiện ảnh hưởng chính trị của một nhóm tham gia vào [dynastic_cycle|E]. Đây là tổng [personal_movement_power|E] của tất cả các nhân vật trong nhóm.\n\n#V [movement_power_i|E][EmptyScope.ScriptValue('extremely_high_movement_power_value')]#! mở khóa $dismiss_strong_hook_interaction$, $request_raid_remit_interaction$ và [GetScheme('raid_estate').GetTypeName] [scheme|E]\n\n#help Sức mạnh được tạo từ:\n$BULLET_WITH_TAB$[merit_i][merit_level|E]\n$BULLET_WITH_TAB$[influence_i][influence_level|E]\n$BULLET_WITH_TAB$Tuổi tác\n$BULLET_WITH_TAB$[movement_power|E] của [disciples|E]\n$BULLET_WITH_TAB$Sức mạnh quân sự hiện tại #weak (ít quan trọng hơn trong [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName])#!\n$BULLET_WITH_TAB$XP cấp độ [GetTrait('confucian_education').GetName( GetNullCharacter )] #weak (ít quan trọng hơn trong [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!\n$BULLET_WITH_TAB$XP cấp độ [GetTrait('governor').GetName( GetNullCharacter )] #weak (ít quan trọng hơn trong [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!#!"
	game_concept_movement_power_short:  "Sức mạnh"
	game_concept_personal_movement_power:  "Sức mạnh Phe cánh Cá nhân"
	game_concept_personal_movement_power_desc:  "$game_concept_personal_movement_power$ là mức độ một nhân vật đóng góp vào tổng [movement_power_short|E] của [movement|E]."
	game_concept_personal_movement_power_short:  "Sức mạnh"
	game_concept_movement_leader:  "Lãnh đạo Phe cánh"
	game_concept_movement_leader_possessive:  "Lãnh đạo Phe cánh"
	game_concept_movement_leaders:  "Lãnh đạo Phe cánh"
	game_concept_movement_leaders_possessive:  "Lãnh đạo Phe cánh"
	game_concept_movement_leader_short:  "Lãnh đạo"
	game_concept_movement_leader_desc:  "Nhân vật lãnh đạo [movement|E], được chỉ định là người duy nhất có thể trực tiếp đối thoại với [son_of_heaven|E] để thúc đẩy chương trình nghị sự của [movements|E] thông qua [GetDecision('movement_petition_decision').GetName] [decision|E].\n\n#help Để trở thành lãnh đạo, bạn phải có [movement_power_i][movement_power|E] cao nhất khi lãnh đạo cũ chết hoặc đánh bại lãnh đạo hiện tại trong [GetActivityType('activity_debate').GetName] [activity|E].#!"
	game_concept_favored_era:  "Thời đại Ưu ái"
	game_concept_favored_era_possessive:  "Thời đại Ưu ái"
	game_concept_favored_era_desc: "$game_concept_favored_era$ là ý nguyện của Thiên đàng được thể hiện bởi [son_of_heaven|E] về lộ trình của [dynastic_cycle|E]. Nó xác định [dynastic_cycle_era_type_stable|E] nào sẽ được ban hành sau khi [dynastic_cycle_era_type_unstable|E] kết thúc."
	game_concept_favored_movement:  "Phe cánh Ưu ái"
	game_concept_favored_movement_desc: "$game_concept_favored_movement$ là [movement|E] đã đạt được sự ủng hộ của [son_of_heaven|E].\n$BULLET_WITH_TAB$ Các thành viên có [candidate_scores|E] cao hơn cho bất kỳ [titles|E] nào trong [SelectLocalization( GetPlayer.IsValid, 'game_concept_favored_movement_desc_ingame', 'h_china' )]\n$BULLET_WITH_TAB$ Các bản kiến nghị từ [decision|E] [GetDecision('movement_petition_decision').GetName] có nhiều khả năng được chấp nhận hơn\n$BULLET_WITH_TAB$ Các [situation_catalyst_catalysts|E] [dynastic_cycle_possessive|E] được kích hoạt dựa trên [movement|E] nào được ưu ái\n$BULLET_WITH_TAB$ Có quyền truy cập vào [decision|E] [GetDecision('favored_movement_consults_heaven_decision').GetName]\n\n#help Để trở thành một phong trào được ưu ái, ngài phải đánh bại thủ lĩnh phong trào hiện tại trong [activity|E] [GetActivityType('activity_debate').GetName].#!"
	game_concept_favored_movement_desc_ingame:  "[GetTitleByKey('h_china').GetDefinitiveName]"
	game_concept_favored_movement_possessive:  "Phe cánh Ưu ái"
	game_concept_favored_movement_short:  "Ưu ái"
	game_concept_disciple:  "Môn sinh"
	game_concept_disciples:  "Môn sinh"
	game_concept_disciple_possessive:  "Môn sinh"
	game_concept_disciples_possessive:  "Môn sinh"
	game_concept_disciple_desc: "$game_concept_disciples$ là các [characters|E] tôn trọng địa vị cao của một [elder|E] và tuân theo những lời dạy của họ, cho đến giới hạn [disciple_limit_short|E].\n\nHọ có thể truy cập [character_interaction|E] #high $request_mentoring_interaction$#! #weak (Scheme)#! để tăng [skills|E] của họ, và [character_interaction|E] #high $celestial_request_elders_support_interaction$#! để có được [gold|E], [courtiers|E] và nhiều thứ khác.\n\n$disciple_elder_benefits_tt$"
	disciple_elder_benefits_tt: "Một $game_concept_disciple$ và một [elder|E]:\n$BULLET_WITH_TAB$ Nhận được nhiều [merit|E] hơn\n$BULLET_WITH_TAB$ Ít có khả năng sử dụng [hostile_schemes|E] chống lại nhau\n$BULLET_WITH_TAB$ Có nhiều khả năng chấp nhận các [interactions|E] được gửi bởi bên kia\n$BULLET_WITH_TAB$ Có nhiều khả năng sử dụng các [interactions|E] thân thiện với bên kia #weak (ví dụ: $gift_interaction$, $invite_to_council_position_interaction$, v.v.)#!\n$BULLET_WITH_TAB$ Cả hai sẽ thuộc về [movement|E] [elder_possessive|E]"
	game_concept_disciple_limit:  "Giới hạn Môn sinh"
	game_concept_disciple_limit_short:  "Giới hạn"
	game_concept_disciple_limit_desc: "$game_concept_disciple_limit$ là năng lực về số lượng [disciples|E] mà một [elder|E] có thể có tại một thời điểm.\n\nTheo mặc định, giới hạn là [EmptyScope.ScriptValue('disciples_limit_base_value')|V0]. Nó có thể được tăng lên, ví dụ, bằng cách cải thiện [domicile|E] với một số [domicile_buildings|E] nhất định."
	game_concept_elder:  "Ân sư"
	game_concept_elders:  "Ân sư"
	game_concept_elder_possessive:  "Ân sư"
	game_concept_elders_possessive:  "Ân sư"
	game_concept_elder_desc: "$game_concept_elder$ là một [character|E] có một hoặc nhiều [disciples|E], những người tuân theo những lời dạy của $game_concept_elders_possessive$. \n\n$disciple_elder_benefits_tt$"

	game_concept_disaster:  "Thảm họa"
	game_concept_disasters:  "Thảm họa"
	game_concept_natural_disaster:  "Thảm họa Tự nhiên"
	game_concept_natural_disasters:  "Thảm họa Tự nhiên"
	game_concept_disaster_desc: "$game_concept_natural_disasters$ bao gồm [floods|E] và [earthquakes|E].\n\nMột $game_concept_natural_disaster$ sẽ dẫn đến [character_death_death|E] của nhiều [characters|e] tại các [counties|E] bị ảnh hưởng, và sẽ gây ra tác động tiêu cực đáng kể đến [development|E], [county_opinion|E], và [control|E] tùy theo mức độ nghiêm trọng của thảm họa.\n\nSự tàn phá do $game_concept_natural_disaster$ gây ra có thể được khắc phục và vùng đất có thể được hồi sinh khi hoàn thành một [great_project|E] Cứu trợ."

	game_concept_earthquake:  "Động đất"
	game_concept_earthquakes:  "Động đất"
	game_concept_earthquake_desc: "$game_concept_earthquake$ là một loại [natural_disaster|E] gây ra sự tàn phá khủng khiếp và đột ngột tại một số lượng nhỏ các [counties|E].\n$game_concept_earthquakes$ chỉ có thể xảy ra ở những vùng dễ xảy ra hoạt động địa chấn."

	game_concept_flood:  "Lũ lụt"
	game_concept_floods:  "Lũ lụt"
  game_concept_flooded: "Lũ lụt"
	game_concept_flood_desc: "$game_concept_flood$ là một [natural_disaster|E] gây ra thiệt hại ngày càng tăng tại một số lượng lớn các [counties|E].\n$game_concept_floods$ chỉ có thể xảy ra dọc theo bờ các con sông lớn."
 
	game_concept_government_bureaucratic_type:  "Quan liêu"
	game_concept_government_bureaucratic_type_desc: "Một số [governments|E] là $game_concept_government_bureaucratic_type$. Đây là những Chính phủ tập quyền cao độ, thường dựa vào [governors|E], [appointment|E], và các [noble_families|E] không đất đai để quản lý các [provinces|E] trong [realm|E].\n\nCác đặc điểm chung khác bao gồm [domiciles|E], [influence|E], và [title_men_at_arms|E].\n\nCó một số Chính phủ $game_concept_government_bureaucratic_type$:\n$BULLET_WITH_TAB$[GetGovernment('administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('celestial_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('meritocratic_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('japan_administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('steppe_admin_government').GetNameWithIcon]"
