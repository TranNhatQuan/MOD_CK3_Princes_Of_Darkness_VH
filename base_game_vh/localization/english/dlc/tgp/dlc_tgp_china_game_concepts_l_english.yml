l_english:


 # Celestial
	game_concept_celestial_government:  "Chính phủ Thiên triều"
	game_concept_celestial:  "Thiên triều"
	game_concept_celestials:  "Thiên triều"
	game_concept_celestial_i:  "@government_type_celestial!"
	game_concept_celestial_government_desc: "$game_concept_celestial$ là một dạng [government_bureaucratic_type|E] [government_form|E], trong đó [liege|E] bổ nhiệm các nhân vật làm [governors|E], gồm hai loại: [civilian_governor_short|E] và [military_governor_short|E].\n\nCác nhân vật có quyền truy cập vào [influence|E], [noble_families|E], [family_estates|E] và [treasury|E].\n\nCác [rulers|E] độc lập tập trung vào [legitimacy|E], trong khi [vassals|E] tập trung vào việc tích lũy [merit|E]."


 # Merit
	game_concept_merit: "Công Trạng"
	game_concept_meritorious: "Có Công"
	game_concept_merit_desc: "$game_concept_merit$ của một [character_possessive|E] sẽ tích lũy tiến trình cho đến [merit_level|E] tiếp theo. Tất cả nhân vật có [elder|E] hoặc [disciples|E] sẽ tự động tạo ra $game_concept_merit$ thụ động.\n\nCác [governors|E] có thể tăng $game_concept_merit$ của họ bằng cách xây dựng các [buildings|E] tại các [holdings|E] được giao phó, tham gia [activity|E] [inspection|E], tham gia [GetActivityType('activity_debate').GetName], và dự [examinations|E].\n\nCác quan lại thuộc hệ [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_standard' )] tăng mức tăng Công Trạng hàng tháng bằng cách nộp thêm [taxes|E] cho [liege|E] của họ, trong khi các quan lại thuộc hệ [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] tăng mức này bằng cách thành lập [men_at_arms|E].\n\nNhững người không phải $game_concept_governors$ vẫn có thể tăng chỉ số này bằng cách tham dự [examinations|E]."
	game_concept_merit_i: "@merit_icon!"
	game_concept_merit_level: "Xếp Hạng Công Trạng"
	game_concept_merit_level_desc: "$game_concept_merit_level$ của một [character_possessive|E] thể hiện mức độ phù hợp của họ khi làm [governor|E] trong các hệ thống [administrative_governments|E] Đông Á.\n\nNó phản ánh thành tựu được ghi nhận và đạo đức theo lý tưởng Nho gia, thông qua lượng [merit|E] mà họ tích lũy.\n\nMột quan lại có $game_concept_merit_level$ cao sẽ có [candidate_score|E] và [governor_salary|E] cao hơn.\n\nCác cấp bậc gồm:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"
	game_concept_merit_levels: "Xếp Hạng Công Trạng"
	game_concept_merit_level_impact: "Ảnh Hưởng Xếp Hạng Công Trạng"
	game_concept_merit_level_impact_desc: "Ảnh hưởng Xếp Hạng Công Trạng làm tăng hoặc giảm các [modifiers|E] nhận được từ [merit_level|E] hiện tại của Ngài."
 
 # Imperial Examinations
	game_concept_imperial_examination:  "Khoa cử Khảo thí"
	game_concept_imperial_examinations:  "Khoa cử Khảo thí"
	game_concept_examination:  "Khảo thí"
	game_concept_examinations:  "Khảo thí"
	game_concept_imperial_examination_desc:  "Các kỳ thi $game_concept_imperial_examinations$ đóng vai trò quan trọng trong các chức năng [administrative|E] của [governments|E] [GetGovernment('celestial_government').GetName|E] và [GetGovernment('meritocratic_government').GetName|E]. \n\nThông qua hệ thống thi cử, các quan chức được bổ nhiệm dựa trên [merit|E] thay vì dòng dõi, đảm bảo rằng những học giả xuất sắc nhất, bất kể nguồn gốc, có thể nhận được các vị trí [governorship|E]. \n\nCác cấp độ thi cử bao gồm: \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Thi Đồng#!: Cha mẹ có thể cho con cái đủ [EmptyScope.ScriptValue('child_exam_min_age')] tuổi tham gia kỳ thi thông qua [interaction|E] $send_child_to_examination_interaction$.#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Thi Hương#!: Các nhân vật không có [landed|E] có thể tham gia cấp độ Khảo thí thứ hai thông qua [activity|E] [GetActivityType('activity_local_examination').GetName].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Thi Hội#!: Được tổ chức bởi [government|E] [GetGovernment('celestial_government').GetName|E] thông qua [activity|E] [GetActivityType('activity_imperial_examination').GetName].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Thi Đình#!: Các thí sinh [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] cuối cùng tại $activity_imperial_examination$ sẽ được mời đến một bữa tiệc tại cung điện hoàng gia, để gặp gỡ và thể hiện tài năng của mình với [son_of_heaven|E].#!"
	game_concept_exam_cheat:  "Gian Lận Khoa cử"
	game_concept_exam_cheat_desc:  "$game_concept_exam_cheat$ mở khóa các tùy chọn có thể được sử dụng để gian lận trong kỳ thi khoa cử sắp tới. Tuy nhiên, hãy cẩn thận, việc bị phát hiện sẽ tốn kém."

	game_concept_childrens_examination_i:  "@child_exam_icon"
	game_concept_childrens_examination:  "Thi Đồng"
	game_concept_childrens_examination_desc:  "Cấp độ [imperial_examinations|E], được tổ chức từ độ tuổi [EmptyScope.ScriptValue('child_exam_min_age')]. Cha mẹ có thể cho con cái tham gia kỳ thi thông qua [interaction|E] $send_child_to_examination_interaction$."

	game_concept_provincial_examination_i:  "@provincial_exam_icon"
	game_concept_provincial_examination:  "Thi Hương"
	game_concept_provincial_examination_desc:  "Cấp độ [imperial_examinations|E] thứ hai, được tham gia thông qua [activity|E] [GetActivityType('activity_local_examination').GetName].\n\n#S Khi vượt qua:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithEffects]."

	game_concept_metropolitan_examination_i:  "@metropolitan_exam_icon"
	game_concept_metropolitan_examination:  "Thi Hội"
	game_concept_metropolitan_examination_desc:  "Cấp độ [imperial_examinations|E] thứ ba. Được tổ chức bởi [government|E] [GetGovernment('celestial_government').GetName|E] thông qua [activity|E] [GetActivityType('activity_imperial_examination').GetName].\n\n#S Khi vượt qua:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithEffects]."

	game_concept_palace_examination_i:  "@palace_exam_icon"
	game_concept_palace_examination:  "Thi Đình"
	game_concept_palace_examination_desc:  "Cấp độ [imperial_examinations|E] thứ tư và cuối cùng. Các thí sinh [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] cuối cùng tại [GetActivityType('activity_imperial_examination').GetName] sẽ được mời đến một bữa tiệc tại cung điện hoàng gia, để gặp gỡ và thể hiện tài năng của mình với [son_of_heaven|E].\n\n#S Khi vượt qua:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithEffects]."

	game_concept_exam_advantage:  "Lợi thế Khoa cử"
	game_concept_exam_advantage_desc:  "$game_concept_exam_advantage$ cải thiện cơ hội cho các hành động khác nhau trong một [imperial_examination|E], chẳng hạn như khi trả lời câu hỏi và thể hiện kỹ năng."
 
	game_concept_exam_score:  "Điểm thi"
	game_concept_exam_score_desc:  "$game_concept_exam_score$ xác định khả năng của một thí sinh để vượt qua một [imperial_examination|E]\n\nĐiểm ban đầu dựa trên [trait|E] [GetTrait('confucian_education').GetName( GetNullCharacter )] của thí sinh, cũng như các [skills|E] [learning|E], [stewardship|E] và [martial|E] của họ tùy thuộc vào trọng tâm của $game_concept_examination$.\n\nChỉ có mười thí sinh đầu bảng trong [activity|E] [GetActivityType('activity_imperial_examination').GetName] mới có thể tham gia @palace_exam_icon! #V Thi Đình#!."

	game_concept_merit_pool:  "Danh sách Ứng viên"
	game_concept_merit_pools:  "Danh sách Ứng viên"
	game_concept_merit_pool_possessive:  "Danh sách Ứng viên"
	game_concept_merit_pool_desc: "Một $game_concept_merit_pool$ bao gồm tất cả các [characters|E] tiềm năng đủ điều kiện được trao [titles|E] thông qua một số loại [appointment|E].\n\nCác ứng viên được sắp xếp dựa trên [candidate_score|E]. Một số [appointment_succession_laws|E] sử dụng [merit|E], khi đó ứng viên sẽ được xếp theo [merit_level|E] trước, và $game_concept_candidate_score$ sau.\n\nKhi [holder|E] của một Danh hiệu có $game_concept_appointment$ qua đời, Danh hiệu sẽ được chuyển cho nhân vật đứng cao nhất trong danh sách. Nếu nhân vật đó đã nắm giữ một Danh hiệu khác, Danh hiệu mới chỉ được trao nếu có mức [appointment_prominence|E] cao hơn; nếu không, nó sẽ được chuyển cho nhân vật tiếp theo."

	game_concept_appointment_prominence: "Danh Vọng"
	game_concept_appointment_prominence_desc: "$game_concept_appointment_prominence$ phản ánh mức độ được mong muốn của một [title|E] đối với các ứng viên đủ điều kiện.\n\nMột ứng viên đã nắm giữ một Danh hiệu chỉ được bổ nhiệm sang Danh hiệu mới cùng [title_tier|E] nếu Danh hiệu đó có $game_concept_appointment_prominence$ cao hơn.\n\n$game_concept_appointment_prominence$ thường dựa trên sự giàu có địa phương và mức độ gần với [realm_capital|E], nhưng tùy hoàn cảnh có thể có các yếu tố khác, chẳng hạn như quy mô [title_men_at_arms|E] đối với [military_governors|E]."

	game_concept_entrant: "Thí Sinh"
	game_concept_entrants: "Thí Sinh"
	game_concept_entrant_desc: "Một $game_concept_entrant$ là nhân vật đang thử thách bản thân trong [imperial_examination|E] [activity|E]."

	game_concept_subject_standing: "Địa Vị Thần Dân"
	game_concept_subject_standing_desc: "$game_concept_subject_standing$ thể hiện địa vị được ban cho một [tributary|E] hoặc [vassal|E] bởi [suzerain|E] hoặc [liege|E] của họ."

	game_concept_imperial_grace: "Hoàng Ân"
	game_concept_imperial_grace_desc: "$game_concept_imperial_grace$ đại diện cho địa vị được [son_of_heaven|E] ban cho một [tributary|E].\n\n$game_concept_imperial_grace$ cao có thể dẫn đến việc các đặc quyền đặc biệt được trao cho $game_concept_tributary$ trong [tribute_missions|E]. Ở các cấp độ $game_concept_imperial_grace$ thấp, $game_concept_son_of_heaven$ có thể #EMP ép buộc#! cống nạp từ ngài, và nếu nó chạm mức không, điều đó có thể đồng nghĩa với việc chấm dứt mối quan hệ."

	game_concept_seal_of_investiture: "Ấn Tín Phong Chức"
	game_concept_seal_of_investiture_desc: "Vừa là văn thư pháp lý vừa là biểu tượng được tôn kính từ hoàng ân của Thiên tử, $game_concept_seal_of_investiture$ biểu thị địa vị đặc biệt của người sở hữu như một [tributary|E] trung thành và được sủng ái bởi [SelectLocalization( GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_china' )].\n\n$game_concept_seal_of_investiture$ có thể được ban cho các $game_concept_tributaries$ có [imperial_grace|E] cao trong lễ kết thúc của một #bold Nhiệm Vụ Triều Cống#!."
	game_concept_seal_of_investiture_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
	HAS_SEAL_OF_INVESTITURE: "Ngài đang sở hữu một [seal_of_investiture|E]"
	NO_SEAL_OF_INVESTITURE: "Ngài không sở hữu [seal_of_investiture|E]"

	SUBJECT_STANDING_CONCEPT: "[subject_standing|E]"
	SUBJECT_STANDING_IMPERIAL_GRACE_CONCEPT: "[imperial_grace|E]"
	IMPERIAL_GRACE_ICON: "@imperial_grace!"

	IMPERIAL_GRACE_LOSS_STABILITY: "Vì [dynastic_cycle|E] hiện đang ở giai đoạn $situation_dynastic_cycle_phase_stability$, tất cả #EMP $tributaries_celestial$#! mất @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V1] [imperial_grace|E] mỗi năm."
	IMPERIAL_GRACE_LOSS_STABILITY_EXPANSION: "Vì [dynastic_cycle|E] hiện đang ở giai đoạn $situation_dynastic_cycle_phase_stability_expansion$, tất cả #EMP $tributaries_celestial$#! mất @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_expansion')|V1] [imperial_grace|E] mỗi năm."
	IMPERIAL_GRACE_LOSS_STABILITY_ADVANCEMENT: "Vì [dynastic_cycle|E] hiện đang ở giai đoạn $situation_dynastic_cycle_phase_stability_advancement$, tất cả #EMP $tributaries_celestial$#! mất @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_advancement')|V1] [imperial_grace|E] mỗi năm."
	IMPERIAL_GRACE_LOSS_INSTABILITY: "Vì [dynastic_cycle|E] hiện đang ở giai đoạn $situation_dynastic_cycle_phase_stability_advancement$, tất cả #EMP $tributaries_celestial$#! mất @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability')|V1] [imperial_grace|E] mỗi năm."
	IMPERIAL_GRACE_LOSS_INSTABILITY_CONQUEST: "Vì [dynastic_cycle|E] hiện đang ở giai đoạn $situation_dynastic_cycle_phase_instability_conquest$, tất cả #EMP $tributaries_celestial$#! mất @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability_conquest')|V1] [imperial_grace|E] mỗi năm."
	IMPERIAL_GRACE_LOSS_CHAOS: "Vì [dynastic_cycle|E] hiện đang ở giai đoạn $situation_dynastic_cycle_phase_chaos$, tất cả #EMP $tributaries_celestial$#! mất @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_chaos')|V1] [imperial_grace|E] mỗi năm."

 # Mandate
	game_concept_mandate_of_heaven: "Thiên Mệnh"
  game_concept_mandate_of_heaven_mandate: "Thiên Mệnh"
  game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ là một loại [legitimacy|E] (tính chính thống) đặc biệt chỉ dành cho [son_of_heaven|E]. Nó đại diện cho quyền cai trị của quân chủ, và người đó được coi là vị vua tối cao dưới gầm trời.\n\nThiên Mệnh có mối liên hệ chặt chẽ với [dynastic_cycle|E] (Chu kỳ Triều đại). Chu kỳ này ảnh hưởng đến cách quân chủ đang trị vì nhận được Tính chính thống và cũng có thể thay đổi [situation_dynastic_cycle_phase|E] dựa trên mức độ Thiên Mệnh của quân chủ."

  game_concept_son_of_heaven: "Thiên Tử"
  game_concept_son_of_heaven_possessive: "Thiên Tử"
  game_concept_son_of_heaven_desc: "$game_concept_son_of_heaven$ là [hegemon|E] (bá chủ) của Trung Hoa và là [top_liege|E] (chúa tể tối cao) của [celestial_government|E] (Triều đình Trung ương).\n\n$game_concept_son_of_heaven$ có một dạng [legitimacy|E] đặc biệt là [mandate_of_heaven|E], và một [situation_participant_group|E] độc đáo được gọi đơn giản là $game_concept_son_of_heaven$."

 # Treasury
	game_concept_treasury_i:  "@treasury_icon!"
	game_concept_treasury:  "Kho bạc"
	game_concept_treasury_desc: "Trong một số hệ thống [administrative_governments|E], Kho Bạc (Treasury) đại diện cho các tài sản chỉ được phép sử dụng cho mục đích nhà nước, khác với lượng [gold|E] cá nhân của ngài.\n\n$BULLET$#indent_newline:2 Với tư cách là một [vassal|E], ngài sẽ nhận Kho Bạc từ [liege|E] của mình, dựa trên đóng góp [tax|E] và các nghĩa vụ khác#!\n$BULLET$#indent_newline:2 Kho Bạc được tạo ra bởi [top_liege|e], người chuyển một phần thu nhập [taxation|E] thành Kho Bạc#!\n$BULLET$#indent_newline:2 Ngài có thể chuyển [gold|E] vào Kho Bạc bất kỳ lúc nào#!\n$BULLET$#indent_newline:2 Kho Bạc gắn với [title|E], và sẽ theo danh hiệu đó nếu đổi [holder|E]#!"
	game_concept_imperial_treasury_i:  "$game_concept_treasury_i$"
	game_concept_imperial_treasury:  "Kho bạc Đế quốc"
	game_concept_imperial_treasury_desc:  "$game_concept_treasury_desc$"

	game_concept_treasury_vassal_development: "Phát triển Chư hầu"
	game_concept_treasury_vassal_development_desc: "Kho Bạc được chuyển đến các [vassals|E] trực tiếp thông qua [liege|E] của họ, dựa trên đóng góp thuế và các [obligations|E] khác."
	game_concept_treasury_ministry_budget: "Ngân sách Triều thần"
	game_concept_treasury_ministry_budget_short: "Triều thần"
	game_concept_treasury_ministry_budget_desc: "Kho Bạc được chuyển đến [vassals|E] từ chính quyền trung ương nhằm tài trợ cho các [ministries|E]. Khoản này được tính dựa trên tỷ lệ phân bổ định kỳ từ thu nhập [treasury|E] của [top_liege|E]."
	game_concept_treasury_salary_budget: "Ngân sách Lương bổng"
	game_concept_treasury_salary_budget_short: "Lương bổng"
	game_concept_treasury_salary_budget_desc: "Kho Bạc được chuyển đến [vassals|E] từ chính quyền trung ương dưới dạng [gold|E] để sử dụng như tiền lương cá nhân. Khoản này được tính dựa trên tỷ lệ phân bổ định kỳ từ thu nhập [treasury|E] của [top_liege|E]."
	game_concept_treasury_military_budget: "Ngân sách Quân sự"
	game_concept_treasury_military_budget_short: "Quân sự"
	game_concept_treasury_military_budget_desc: "Kho Bạc được chuyển đến các [province|E] quân sự thuộc [vassals|E] từ chính quyền trung ương nhằm tài trợ cho các hoạt động quân sự bổ sung. Khoản này được tính dựa trên tỷ lệ phân bổ định kỳ từ thu nhập [treasury|E] của [top_liege|E]."

	game_concept_governor_salary: "Lương bổng Quan viên"
	game_concept_governor_salary_desc: "Trong các [administrative_governments|E] phân biệt giữa [gold|E] và [treasury|E], các [governors|E] nhận Lương bổng dưới dạng $game_concept_gold$."

	game_concept_treasury_budgeting: "Ngân sách Kho bạc"
	game_concept_treasury_budget: "Ngân sách Kho bạc"
	game_concept_treasury_budgeting_desc: "Một hệ thống chịu trách nhiệm phân bổ ngân sách trung ương đến các [vassals|E] cụ thể và các cấp dưới theo những tỷ lệ phân bổ xác định.\n\nKhi một ngân sách được ban hành, một [treasury_budget_base_rate|E] cơ bản cho mỗi [treasury_budget_category|E] sẽ được tính dựa trên [treasury_budget_capacity|E] hiện có.\n\n@alert_icon! Tỷ lệ cơ bản đã tính #bold sẽ không thay đổi#! cho đến khi một ngân sách mới được ban hành trong tương lai! Vì vậy nếu số lượng người nhận tăng, chi phí ngân sách sẽ tăng theo."

	game_concept_treasury_budget_capacity: "Năng lực Ngân sách"
	game_concept_treasury_budget_capacity_desc: "Lượng [treasury|E] hàng tháng có thể sử dụng cho [treasury_budgeting|E]. Bao gồm thu nhập Kho bạc trừ đi các chi phí định kỳ không thuộc hệ thống ngân sách, chẳng hạn như [treasury_vassal_development|E] và [court_amenities|E]."

	game_concept_treasury_budget_category: "Danh mục Ngân sách"
	game_concept_treasury_budget_category_desc: "Một phần riêng biệt trong [treasury_budgeting|E] có thể nhận phân bổ ngân sách. Mỗi danh mục có thể có các đối tượng nhận khác nhau, và có thể chi trả bằng [gold|E] thay vì [treasury|E]."

	game_concept_treasury_budget_base_rate: "Tỷ lệ Cơ sở Ngân sách"
	game_concept_treasury_budget_base_rate_short: "Tỷ lệ Cơ sở"
	game_concept_treasury_budget_base_rate_desc: "Lượng mà một người nhận tiêu chuẩn trong một [treasury_budget_category|E] nhận được. Người nhận có thể nhận nhiều hơn hoặc ít hơn mức cơ sở tùy theo [title_rank|E], [merit_level|E], hoặc các hiệu ứng điều chỉnh khác."

	game_concept_treasury_budget_category_trend: "Xu hướng Danh mục Ngân sách"
	game_concept_treasury_budget_category_trend_short: "Xu hướng"
	game_concept_treasury_budget_category_trend_desc: "Sự chênh lệch lượng [treasury|E] mà một [treasury_budget_category|E] sẽ nhận so với lần ban hành ngân sách trước đó."

	game_concept_treasury_budget_unallocated: "Ngân sách Kho bạc Chưa phân bổ"
	game_concept_treasury_budget_unallocated_short: "Chưa phân bổ"
	game_concept_treasury_budget_unallocated_desc: "Bất kỳ Kho bạc chưa được phân bổ nào sẽ được tính vào thu nhập [treasury|E] chung."

	game_concept_treasury_budget_deficit: "Thâm hụt Ngân sách Kho bạc"
	game_concept_treasury_budget_deficit_short: "Thâm hụt"
	game_concept_treasury_budget_deficit_desc: "Khi chi tiêu vượt quá [treasury_budget_capacity|E], một khoản sẽ bị trừ vào thu nhập [treasury|E] hàng tháng."

 # Celestial Bureaucracy
	game_concept_celestial_bureaucracy:  "Quan liêu Thiên triều"
	game_concept_celestial_bureaucracy_desc: "$game_concept_celestial_bureaucracy$ đại diện cho mức độ tập quyền của một [celestial|E] [realm_possessive|E] và quyền lực chung mà [ruler|E] nắm giữ đối với [vassals|E] của họ.\n\nChỉ [top_liege|E] mới có thể thay đổi $game_concept_celestial_bureaucracy$. Các [vassals|E] thuộc hệ thống Thiên triều sử dụng cùng cấp độ với [liege|E] của họ.\n\nCó bốn cấp độ $game_concept_celestial_bureaucracy$:\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_3$\n\nTăng $game_concept_celestial_bureaucracy$ tiêu tốn một lượng [prestige|E] phụ thuộc vào [realm_size|E] và [learning_skill|E] của người cai trị."
	game_concept_minister:  "Triều thần"
	game_concept_ministers:  "Triều thần"
	game_concept_minister_possessive:  "Triều thần"
	game_concept_ministers_possessive:  "Triều thần"
	game_concept_minister_desc:  "$game_concept_ministers$ là một loại [councillors|E] phục vụ trong [council|E], hoặc [ministry|E], của [son_of_heaven|E].\n\nMỗi triều thần có nhiều trách nhiệm, như tài trợ [great_projects|E] và hỗ trợ [governors|E] theo nhiều cách khác nhau."
	game_concept_ministry:  "Triều đường"
	game_concept_ministries:  "Triều đường"
	game_concept_ministry_possessive:  "Triều đường"
	game_concept_ministries_possessive:  "Triều đường"
	game_concept_ministry_desc:  "$game_concept_ministry$ là một loại [council|E] chỉ dành cho [son_of_heaven|E].\n\nCó chín [ministers|E], mỗi người đại diện cho cấp cao nhất của chính quyền và đứng đầu một bộ riêng. Chúng được sắp theo hệ thống thứ bậc, cho phép một Bộ trưởng cấp thấp được thăng lên vị trí cao hơn dựa trên [appointment_prominence|E] của [title|E].\n\nCác $game_concept_ministers$ gồm:\n$EFFECT_LIST_BULLET$[minister_grand_chancellor|E]\n$EFFECT_LIST_BULLET$[minister_censor|E]\n$EFFECT_LIST_BULLET$[minister_grand_marshal|E]\n$EFFECT_LIST_BULLET$[minister_of_personnel|E]\n$EFFECT_LIST_BULLET$[minister_of_war|E]\n$EFFECT_LIST_BULLET$[minister_of_revenue|E]\n$EFFECT_LIST_BULLET$[minister_of_justice|E]\n$EFFECT_LIST_BULLET$[minister_of_rites|E]\n$EFFECT_LIST_BULLET$[minister_of_works|E]"
	game_concept_minister_grand_chancellor:  "$councillor_chancellor_celestial_government_imperial$"
	game_concept_minister_grand_chancellor_desc:  "Bộ trưởng $game_concept_minister_grand_chancellor$ là [minister|E] có cấp bậc cao nhất và phụ trách công việc ngoại giao.\n\nThường được chỉ định làm [grand_secretariat_director|E].\n\nChức Chưởng quan có thể được chỉ định làm [grand_secretariat_director|E], tùy theo [law|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_chancellor_action_breakdown$"
	game_concept_minister_grand_chancellor_possessive:  "$councillor_chancellor_celestial_government_imperial_possessive$"
	minister_grand_chancellor_action_breakdown:  "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Dùng [GetDecision('favored_movement_consults_heaven_decision').GetName|V] [decision|E]\n$BULLET$Mời mọi loại [courtier|E] bằng [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E]\n$BULLET$Truy cập các tùy chọn #V $influence_meritorious_career_interaction$#! [interaction|E] đặc biệt với chi phí thấp hơn\n$BULLET$Bắt đầu [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V] [great_project|E]#!#!"
	game_concept_minister_censor:  "$councillor_spymaster_celestial_government_imperial$"
	game_concept_minister_censor_desc:  "Bộ trưởng $game_concept_minister_censor$ là [minister|E] phụ trách gián điệp và tình báo.\n\nHãy cẩn thận với một Quan Giám không trung thành, vì họ có thể che giấu và tham gia [schemes|E] chống lại bạn và [close_family|E] của bạn!\n\nQuan Giám có thể được chỉ định làm [grand_secretariat_director|E], tùy theo [GetLawGroup('grand_secretariat_laws').GetName|V] [law|E].\n\n$minister_censor_action_breakdown$"
	game_concept_minister_censor_possessive:  "$councillor_spymaster_celestial_government_imperial_possessive$"
	minister_censor_action_breakdown:  "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Dùng #V $censor_find_secrets_interaction$#! để tìm [secrets|E] tại các [vassal|E] [courts|E] hoặc lấy [hooks|E]\n$BULLET$[blackmail|E] sẽ kích hoạt #V '$catalyst_minister_blackmailed$'#! [dynastic_cycle_catalyst|E]\n$BULLET$Truy cập các tùy chọn #V $influence_meritorious_career_interaction$#! đặc biệt#!#!"
	game_concept_minister_grand_marshal:  "$minister_grand_marshal$"
	game_concept_minister_grand_marshal_desc:  "Bộ trưởng $game_concept_minister_grand_marshal$ là chỉ huy quân sự cấp cao nhất trong [realm|E] và chỉ huy một [army|E] gồm [title_men_at_arms|E].\n\nThống soái có thể được chỉ định làm [grand_secretariat_director|E], tùy thuộc vào [law|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_marshal_action_breakdown$"
	game_concept_minister_grand_marshal_possessive:  "$minister_grand_marshal_possessive$"
	minister_grand_marshal_action_breakdown:  "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Bắt đầu #V Grand Campaign#! [great_project|E]\n$BULLET$Bắt đầu [GetGreatProjectType('construct_great_barracks').GetName|V] [great_project|E]\n$BULLET$Dùng #V $CHINA_SEIZE_COUNTY_CB_NAME$#! và #V $CHINA_SEIZE_DUCHY_CB_NAME$#! [casus_bellis|E] trong các thời kỳ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] và [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName] [dynastic_cycle_eras_short|E]\n$BULLET$Truy cập các tùy chọn #V $influence_meritorious_career_interaction$#!#!"
	game_concept_minister_of_personnel:  "$minister_personnel$"
	game_concept_minister_of_personnel_desc:  "Bộ trưởng $game_concept_minister_of_personnel$ là [minister|E] phụ trách mọi vấn đề liên quan đến [appointments|E] và có thể ảnh hưởng lớn đến [candidate_score|E] của các [characters|E].\n\n$minister_of_personnel_action_breakdown$"
	game_concept_minister_of_personnel_possessive:  "$minister_personnel_possessive$"
	minister_of_personnel_action_breakdown:  "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Dùng #V $force_governor_removal_interaction$#! để sa thải [governors|E] bất chấp [GetLawGroup('celestial_retirement_law').GetName] [law|E]\n$BULLET$Mời mọi loại [courtier|E] bằng [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E]\n$BULLET$Ép chấp nhận #V $offer_courtier_interaction$#! và #V $demand_courtier_interaction$#! [interactions|E]\n$BULLET$Truy cập các tùy chọn #V $influence_meritorious_career_interaction$#!#!"
	game_concept_minister_of_revenue:  "$councillor_steward_celestial_government_imperial$"
	game_concept_minister_of_revenue_desc:  "Bộ trưởng $game_concept_minister_of_revenue$ là [minister|E] phụ trách thuế khóa và hỗ trợ [son_of_heaven|E] quản lý [treasury|E].\n\n$minister_of_revenue_action_breakdown$"
	game_concept_minister_of_revenue_possessive:  "$councillor_steward_celestial_government_imperial_possessive$"
	minister_of_revenue_action_breakdown: "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Hỗ trợ [vassals|E] những người có thể #V $celestial_request_treasury_interaction$#!\n$BULLET$Sử dụng [decision|E] [GetDecision('tgp_suggest_budget_change_decision').GetName|V]\n$BULLET$Bắt đầu [great_project|E] [GetGreatProjectType('minister_project_conduct_census').GetName|V]\n$BULLET$Sử dụng [interaction|E] #V $pay_treasury_debt_interaction$#! để thanh toán [treasury_debt|E] của [civilian_governors|E], kích hoạt [dynastic_cycle_catalyst|E] #V '$catalyst_cleared_treasury_debt$'#! \n$BULLET$Truy cập các tùy chọn [interaction|E] đặc biệt #V $influence_meritorious_career_interaction$#!#!#!"
	game_concept_minister_of_rites:  "$councillor_court_chaplain_celestial_government_imperial$"
	game_concept_minister_of_rites_desc:  "Bộ trưởng $game_concept_minister_of_rites$ phụ trách tôn giáo và nghi lễ, và hỗ trợ [governors|E] tổ chức [examinations|E].\n\n$minister_of_rites_action_breakdown$"
	game_concept_minister_of_rites_possessive:  "$councillor_court_chaplain_celestial_government_imperial_possessive$"
	minister_of_rites_action_breakdown:  "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Bắt đầu [GetGreatProjectType('minister_project_culture').GetName|V]\n$BULLET$Bắt đầu [GetGreatProjectType('minister_compel_religious_uniformity').GetName|V]\n$BULLET$Hỗ trợ tổ chức [examinations|E]\n$BULLET$Truy cập #V $influence_meritorious_career_interaction$#!#!\n$BULLET$Dùng #V $demand_conversion_minister_rites_interaction$#! với các [faith_hostile|E] hoặc [faith_evil|E]#!#!"
	game_concept_minister_of_war:  "$minister_war$"
	game_concept_minister_of_war_desc: "$game_concept_minister_of_war$ là [minister|E] phụ trách quản lý và điều hành quân đội. Khi các [governors|E] cần viện trợ quân sự, chính $game_concept_minister_of_war$ là người có thể cử các Thống đốc Quân sự đến giúp đỡ.\n\nBộ trưởng không phải là một [commander|E] chủ động và không trực tiếp dẫn quân. Đó là phạm vi quyền hạn của [minister_grand_marshal|E].\n\n$minister_of_war_action_breakdown$"
	game_concept_minister_of_war_possessive:  "$minister_war_possessive$"
	minister_of_war_action_breakdown: "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Gửi viện trợ cho các [vassals|E] đang trong tình trạng [war|E] những người có thể #V $celestial_request_military_aid_interaction$#!\n$BULLET$Ra lệnh cho các [military_governors|E] tham gia các cuộc [war|E] của các [governors|E] khác\n$BULLET$Bắt đầu [great_project|E] [GetGreatProjectType('minister_project_train_troops').GetName|V]\n$BULLET$Sử dụng [interaction|E] #V $pay_treasury_debt_interaction$#! để thanh toán [treasury_debt|E] của các [military_governors|E], kích hoạt [dynastic_cycle_catalyst|E] #V '$catalyst_cleared_treasury_debt$'#! \n$BULLET$Truy cập các tùy chọn [interaction|E] đặc biệt #V $influence_meritorious_career_interaction$#!#!#!"
	game_concept_minister_of_justice:  "$minister_justice$"
	game_concept_minister_of_justice_desc:  "Bộ trưởng $game_concept_minister_of_justice$ phụ trách pháp luật và duy trì trật tự cho [son_of_heaven|E].\n\n$minister_of_justice_action_breakdown$"
	game_concept_minister_of_justice_possessive:  "$minister_justice_possessive$"
	minister_of_justice_action_breakdown: "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Bắt đầu [great_project|E] [GetGreatProjectType('minister_project_establish_control').GetName|V]\n$BULLET$Sử dụng [interaction|E] #V $imprison_interaction$#! đối với [vassals|E] và [courtiers|E], những người không thể từ chối\n$BULLET$Sử dụng [interaction|E] #V $pardon_interaction$#! đối với các [characters|E] đã phạm [crimes|E]\n$BULLET$Sử dụng [interaction|E] $censor_find_secrets_interaction$ để tìm [secrets|E] trong [courts|E] của [vassal|E] và [imprison|E] hoặc ân xá cho các [criminals|E] đã biết\n$BULLET$Việc phơi bày [secrets|E] sẽ kích hoạt [dynastic_cycle_catalyst|E] $catalyst_minister_exposed_secret$\n$BULLET$Truy cập các tùy chọn [interaction|E] đặc biệt #V $influence_meritorious_career_interaction$#!#!#!"
	game_concept_minister_of_works:  "$minister_works$"
	game_concept_minister_of_works_desc:  "Bộ trưởng $game_concept_minister_of_works$ phụ trách xây dựng và phát triển trong toàn [realm|E].\n\n$minister_of_works_action_breakdown$"
	game_concept_minister_of_works_possessive:  "$minister_works_possessive$"
	minister_of_works_action_breakdown: "#indent_newline:4 #weak Bộ trưởng có thể, ví dụ:\n$BULLET$Bắt đầu [great_project|E] [GetGreatProjectType('minister_project_development').GetName|V]\n$BULLET$Bắt đầu [great_project|E] [GetGreatProjectType('grand_canals').GetName|V]\n$BULLET$Bắt đầu [great_project|E] [GetGreatProjectType('great_wall').GetName|V]\n$BULLET$Có thể xây dựng [buildings|E] và [holdings|E] bên trong [realm|E]\n$BULLET$Có thể xây dựng [buildings|E] và [holdings|E] bên trong [tributaries|E] của [son_of_heaven|E] trong [dynastic_cycle_era_short|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]\n$BULLET$Truy cập các tùy chọn [interaction|E] đặc biệt #V $influence_meritorious_career_interaction$#!#!#!"
	game_concept_grand_secretariat_director:  "Tể tướng"
	game_concept_grand_secretariat:  "Tể tướng"
	game_concept_grand_secretariat_possessive:  "Tể tướng"
	game_concept_grand_secretariat_director_desc: "Giám đốc Thư ký là một kiểu [diarch|E] cho [son_of_heaven|E], giúp vị thần quân quản lý [realm|E].\n\nAi là Giám đốc phụ thuộc vào [law|E] [GetLawGroup('grand_secretariat_laws').GetName|V] đang hoạt động. Chức vụ này có thể do [minister_grand_chancellor|E], [minister_grand_marshal|E], hoặc [minister_censor|E] nắm giữ.\n\nGiám đốc có thể bắt đầu hầu hết các [great_projects|E] dành cho một số [ministers|E] nhất định và Thiên tử."
	game_concept_ministry_obligation:  "Nghĩa vụ Triều thần"
	game_concept_ministry_obligations:  "Nghĩa vụ Triều thần"
	game_concept_ministry_obligations_desc:  "$game_concept_ministry_obligations$ là một loại [vassal_obligations|E] chỉ dành cho [ministers|E].\n\nTất cả bộ quan có một lựa chọn mặc định riêng, trong khi [minister_grand_marshal|E] có lựa chọn đặc biệt cho quân đội.\n\nCác nghĩa vụ này không thể thay đổi."

	game_concept_civilian_career_path:  "Con đường Văn quan"
	game_concept_civilian_career_path_i:  "@celestial_standard_administration!"
	game_concept_civilian_career_path_desc:  "Các [rulers|E] E] theo đuổi Con đường Sự nghiệp Văn quan tập trung vào kỹ năng hành chính hơn là mưu lược quân sự. Họ được bổ nhiệm vào các Quận trấn Dân sự và [merit|E] của họ sẽ tăng lên tùy theo thành công trong việc phát triển đất đai bằng các [buildings|E] và tăng [taxes|E] nộp cho [liege|E]."
	game_concept_civilian_career:  "Văn quan"
