	game_concept_military_career_path_i:  "@celestial_military_administration!"
	game_concept_military_career_path_desc:  "Các [rulers|E] theo đuổi Con đường Sự nghiệp Võ tướng tập trung vào kỹ năng quân sự hơn là công việc hành chính. Họ được bổ nhiệm vào các Lộ trấn Quân sự và [merit|E] của họ sẽ tăng lên dựa trên khả năng tuyển mộ và duy trì [title_men_at_arms|E]."
