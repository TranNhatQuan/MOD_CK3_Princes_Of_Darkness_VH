 #Tributary: Courtier slated for castration escapes
  tribute_mission.9760.t: "$tribute_mission_header$ Cuộc Trốn Thoát"
  tribute_mission.9760.desc.vengeful: "Sự hỗn loạn bên ngoài cuối cùng cũng kéo ta khỏi giấc ngủ sâu. Vừa mơ màng tỉnh giấc, ta miễn cưỡng lắng nghe và kịp nhận ra những tiếng hét đứt quãng #EMP \"... kẻ triều cống trốn thoát rồi! Hãy bắt [escapee_eunuch.GetHerHim] lại!\"#! khi một bóng đen xuất hiện ngay tại cửa phòng.\n\n\"#EMP Xin [escapee_eunuch.GetFaith.HighGodName] tha thứ cho tội lỗi của con!\"#! cống vật của chúng ta, [escapee_eunuch.GetTitledFirstName], gầm lên khi [escapee_eunuch.GetSheHe] lao vào ta.\n\nTa lăn ra khỏi giường, vừa né được đòn tấn công đầu tiên, và bất thình lình cả hai chúng ta đều đứng bật dậy, xoay quanh nhau."
  tribute_mission.9760.desc: "Ta không hiểu tại sao lại tỉnh giấc trong chốc lát. Trong cơn buồn ngủ, ta nhìn quanh lều, chỉ thấy một cái bóng lướt qua cửa lều. Rùng mình trước không khí lạnh lẽo của đêm, ta lăn khỏi giường và lồm cồm bò ra ngoài xem xét.\n\nĐến ngạc nhiên, ta được chào đón bởi chính cống vật của chúng ta, [escapee_eunuch.GetTitledFirstName], kẻ đã xoay xở trốn thoát khỏi những kẻ giám sát [escapee_eunuch.GetHerHis].\n\nĐôi mắt [escapee_eunuch.GetHerHis|U] mở to vì sợ hãi khi [escapee_eunuch.GetSheHe] nhận ra sự hiện diện của ta. \"Thưa [escapee_eunuch.Custom2('RelationToMe', ROOT.Char )], xin ngài... con không thể tiếp tục chuyện này được nữa. Xin ngài!\" [escapee_eunuch.GetSheHe] khẩn cầu, sẵn sàng bỏ chạy vào đêm tối."
  tribute_mission.9760.a: ""#EMP Ra tay đi!#!"""
  tribute_mission.9760.a.success: "[escapee_eunuch.GetShortUIName] bị khống chế"
  tribute_mission.9760.a.success.tt: "[escapee_eunuch.GetShortUIName] bị trấn áp, và [tribute_mission|E] tiếp tục"
  tribute_mission.9760.a.failure: "[escapee_eunuch.GetShortUIName] đã trốn thoát và cố gắng thực hiện âm mưu báo thù"
  tribute_mission.9760.b: ""#EMP Bảo vệ!#!"""
  tribute_mission.9760.b.success: "$tribute_mission.9760.a.success$"
  tribute_mission.9760.b.failure: "[escapee_eunuch.GetShortUIName] trốn thoát"
  tribute_mission.9760.b.critical_failure: "[escapee_eunuch.GetShortUIName] bị giết trong quá trình"
  tribute_mission.9760.c: ""Ngài được tự do. Chỉ cần #EMP đi đi!#!""
 #Somehow your Tribute Mission invalidated, refund and return home
  tribute_mission.9800.t: "$tribute_mission_header$ Thay Đổi Kế Hoạch"
  tribute_mission.9800.desc.suzerain_turned_liege: "Dường như nghĩa vụ cống phẩm của Ta đã thay đổi, khi Ta thực sự là chư hầu của [ROOT.Char.GetLiege.GetTitledFirstName].\n\nVì vậy, có nhiều việc khác cần xử lý ở quê nhà, trong đó việc cống phẩm không còn là ưu tiên. Một diễn biến bất ngờ!"
  tribute_mission.9800.desc.no_longer_tributary: "Diễn biến bất ngờ! Ta nhận tin chúng ta không còn dưới chế độ cống phẩm!\n\nCó quá nhiều việc cần giải quyết ở quê nhà — trong đó đối phó với sự độc lập mới là trọng tâm."
  tribute_mission.9800.desc.different_end_location: "Với sự thay đổi chủ quyền, có vẻ như [current_overlord.GetTitledFirstName] đã dời đô đến một địa điểm khác.\n\nHành trình và cống phẩm của chúng ta vốn đã được lên kế hoạch cho [old_overlord.GetTitledFirstName], vì vậy các cố vấn của ta khăng khăng rằng quyết định sáng suốt nhất là quay trở lại [ROOT.Char.GetCapitalLocation.GetName] và tập hợp lại."
  tribute_mission.9800.desc.unable_to_accept_tribute: "Tin đường đi cho biết chư hầu mới không quan tâm loại cống phẩm Ta sẽ dâng.\n\nTa không muốn làm chư hầu giận, nên quyết định khôn ngoan là quay lại [ROOT.Char.GetCapitalLocation.GetName] regroup."
  tribute_mission.9800.a: "Trong lúc này, chúng ta hãy quay về nhà."

