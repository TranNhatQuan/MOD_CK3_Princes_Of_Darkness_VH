  tribute_mission.1006.t: "$tribute_mission_header$ Con dấu Nhậm chức"
  tribute_mission.1006.desc: "[tributary_scope.GetTitledFirstName|U] vẫn quỳ lạy lâu đến mức khó chịu. Liệu [tributary_scope.GetSheHe] còn trông chờ gì từ Ta nữa chăng?\n\nTa nhìn thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scribe_character'))] [scribe_character.GetShortUIName], nghệ nhân làm con dấu chính thức, đang đứng yên lặng bên lề triều đình đông đúc.\n\nĐã đến lúc trao cho [tributary_scope.GetTitledFirstNameNoTooltip] sự công nhận chính thức từ Thiên Tử?"
  tribute_mission.1006.grant: "Chúng ta sẽ chính thức hóa thỏa thuận này cho muôn đời."
  tribute_mission.1006.grant.tt: "[scribe_character.GetShortUIName] sẽ chế tác một [seal_of_investiture|E] cho [tributary_scope.GetTitledFirstName]"
  tribute_mission.1006.decline.no_money: "Kho bạc triều đình không thể gánh chi phí này."
  tribute_mission.1006.decline.dont_wanna: "[tributary_scope.GetSheHe|U] không xứng đáng nhận vinh dự này."
  refused_seal_of_investiture_opinion: "Từ chối trao [seal_of_investiture|E]"

  tribute_mission.1007.t: "$tribute_mission_header$ Con dấu Nhậm chức"
  tribute_mission.1007.desc: "Sau một khoảng lặng đầy ý nghĩa, [receiving_character.GetTitledFirstName] đứng dậy trang nghiêm. Ngay lúc đó, thư ký triều đình [scribe_character.GetShortUIName] xuất hiện từ đám đông, mang theo $game_concept_seal_of_investiture$ tinh xảo — có tên Ta trên đó!\n\n[receiving_character.GetTitledFirstName] nhẹ nhàng nhận lấy và cầu Ta đứng dậy. Cả triều đình chú ý chăm chú.\n\nKhi Ta nhận phước lành từ Thiên Tử, một ý nghĩ lóe lên: hợp đồng quý giá này sẽ mở ra những cơ hội gì mới?"
  tribute_mission.1007.a: "Điều này thay đổi mọi thứ."

  tribute_mission.1008.t: "$tribute_mission_header$ Cống phẩm Đang Diễn ra"
  tribute_mission.1008.desc: "Khi lễ vật được trao đổi trong buổi lễ, ta cảm nhận được sự mong đợi lan tỏa khắp triều đình như thể có những lời lẽ nào đó chưa được nói ra. Dù chưa bao giờ khẳng định công khai, nhưng sự kỳ vọng dành cho ta dần trở nên rõ ràng.\n\n[receiving_character.GetTitledFirstNameNoTooltip] mong muốn ta thề nguyện giữ cho những lễ vật này được duy trì, để đổi lại sự khoan dung từ [receiving_character.GetLiege.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip].\n\nVẫn còn thời gian để từ chối lời đề nghị một cách danh giá mà vẫn giữ được sự độc lập của mình, cùng tất cả những hệ lụy có thể kéo theo."
  tribute_mission.1008.a: "\"...và dĩ nhiên, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ mang lễ vật đến [receiving_character.GetLiege.GetCapitalLocation.GetNameNoTooltip] một cách đều đặn.\""
  tribute_mission.1008.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ không quỳ gối."

