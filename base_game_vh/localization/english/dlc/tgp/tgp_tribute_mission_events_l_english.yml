 #Tributary: Your human tribute is now unavailable
  tribute_mission.9750.t: "$tribute_mission_header$ Cống phẩm Không Còn"
  tribute_mission.9750.desc: "Do một loạt sự kiện không may, cống phẩm của chúng ta không còn trong đoàn! [human_tribute.GetTitledFirstName|E], mất...\n\nTa cau mày. Chắc chúng ta nên quay lại regroup chứ?"
  tribute_mission.9750.a: "Không, chúng ta phải hoàn tất cống phẩm!"
  tribute_mission.adequate_reserved_gold: "Dự trữ @gold_icon!#V [THIS.Char.MakeScope.ScriptValue('adequate_gold_tribute_value')]#! cho [tribute|E]"
  tribute_mission.9750.b: "Tốt hơn là quay về nhà."
