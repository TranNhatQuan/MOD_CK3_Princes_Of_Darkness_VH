  tribute_mission_common_bunga_mas_desc: "Một [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )], dâng làm cống phẩm cho [overlord_scope.GetTitledFirstName] bởi [tributary_scope.GetTitledFirstName]."
  tribute_mission_masterwork_bunga_mas_desc: "Lần đầu được dâng làm cống phẩm cho [overlord_scope.GetTitledFirstName] bởi [tributary_scope.GetTitledFirstName], bộ [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] tinh xảo này phản chiếu ánh sáng một cách tuyệt đẹp."
  tribute_mission_famed_bunga_mas_desc: "Hai cây vàng và bạc tuyệt đẹp, những [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] này được dâng cho [overlord_scope.GetTitledFirstName] bởi [tributary_scope.GetTitledFirstName] làm cống phẩm. Kim loại và chạm khắc kể câu chuyện về nghệ thuật tinh xảo."
  tribute_mission_illustrious_bunga_mas_desc: "Được dâng làm cống phẩm cho [overlord_scope.GetTitledFirstName] bởi [tributary_scope.GetTitledFirstName], [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] bao gồm một bộ cây vàng và bạc tráng lệ, được rèn và chạm khắc tỉ mỉ từ kim loại tinh tuyển; hoa nở mãi như những bông hoa vĩnh cửu."
