l_english:

  tribute_mission_header: "Nhiệm vụ Cống nạp:"
 #Tributary: Fork over Tribute
  tribute_mission_suzerain_legitimacy_gain_title: "Nhận được Tính Hợp Pháp từ Cống phẩm"
  tribute_mission_tributary_subject_standing_gain_title: "Nhận được [ConcatIfNeitherEmpty(GetPlayer.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')]"
  tribute_mission_tributary_subject_standing_gain_tt_minor: "[tributary_scope.GetShortUIName|U] nhận một ít [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')]"
  tribute_mission_tributary_subject_standing_gain_tt_major: "[tributary_scope.GetShortUIName|U] nhận #EMP rất nhiều#! [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')]"
  tribute_mission.1000.t: "$tribute_mission_header$ Dâng Cống"
  tribute_mission.1000.intro: "Chúng ta bước vào đại sảnh của [overlord_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], nơi được tiếp đón bởi"
  tribute_mission.1000.intro.overlord: "[overlord_scope.GetTitledFirstName], ra hiệu uy nghi cho chúng ta tiến lại gần."
  tribute_mission.1000.intro.diarch: "[overlord_scope.GetTitledFirstNamePossessive] [receiving_character.GetDiarchTitle], [receiving_character.GetTitledFirstName], ra hiệu cho chúng ta tiến lại gần."
  tribute_mission.1000.intro.councillor: "[receiving_character.GetTitledFirstName], [receiving_character.Custom('CouncilPosition')] của [overlord_scope.GetTitledFirstNamePossessive], khẽ gật đầu và ra hiệu cho chúng ta tiến lại gần."
  tribute_mission.1000.intro.attendant: "Một trong các quan thị vệ cao cấp của [overlord_scope.GetTitledFirstNamePossessive], mỉm cười xin lỗi và ra hiệu cho chúng ta tiến lại gần."
  tribute_mission.1000.desc.segway: "\n\nKhông chần chừ, ta tuyên bố rằng:"
  tribute_mission.1000.desc.bunga_mas: " \"Ngưỡng mộ sự tráng lệ này; bộ cây bunga mas tinh xảo, chỉ được chế tác cho ngài [overlord_scope.GetTitledFirstNameNoTooltip] vĩ đại nhất!\" Đám đông mở to mắt, và nhiều tiếng xì xào vang lên khắp đại sảnh."
  tribute_mission.1000.desc.small_gold: " \"Xin được dâng cống một vật nhỏ, khiêm tốn về quy mô nhưng lớn về tinh thần!\" Ta cúi mình khi đầy tớ mang những hộp hàng nhỏ vào."
  tribute_mission.1000.desc.adequate_gold: " \"Chúng ta dâng cống một vật tuyệt vời, thể hiện lòng kính trọng của [overlord_scope.GetLadyLord]!\" Ta mỉm cười và gật đầu khi những giỏ và bình đầy dâng lên phòng."
  tribute_mission.1000.desc.excessive_gold: " \"Hãy chiêm ngưỡng sự tráng lệ này!\" Ta mỉm cười đầy tự hào khi cả điện đường phải #EMP trầm trồ #! và #EMP thán phục #! trước sự xa hoa của những lễ vật được dâng lên — nào là rương hòm, bình quách, giỏ lễ, và tượng vàng. #EMP Thật thịnh vượng thay!#!"
  tribute_mission.1000.desc.small_herd: " \"Chúng ta đem những sinh vật tốt nhất từ bầy của mình, sẵn sàng phục vụ ngài [overlord_scope.GetLadyLord]!\""
  tribute_mission.1000.desc.adequate_herd: " \"Chuồng trại đầy sinh vật, lớn nhỏ đủ cả. Tất cả để phục vụ ngài [overlord_scope.GetLadyLord]!\""
  tribute_mission.1000.desc.excessive_herd: " \"Một lượng lớn sinh vật, lớn nhỏ, khỏe mạnh, nhanh nhẹn, đã được dâng lên ngài [overlord_scope.GetLadyLord]! Chúng sẽ phục vụ triều đình [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] chu đáo!\""
  tribute_mission.1000.desc.concubine: " \"... Ta xin dâng mỹ nhân [human_tribute.GetTitledFirstName], một bông hoa nữa trong khu vườn của [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!\" Và [human_tribute.GetTitledFirstNameNoTooltip] bước lên, đỏ mặt khi [human_tribute.GetSheHe] thu hút sự chú ý của cả phòng."
  tribute_mission.1000.desc.eunuch: " \"... Kính chào thái giám [human_tribute.GetTitledFirstName], hân hạnh phục vụ triều đình [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!\" Và [human_tribute.GetTitledFirstNameNoTooltip] bước lên, khiến cả phòng vang dậy tiếng xì xào."
  tribute_mission.1000.desc.artifact: " \"Vật [artifact_to_tribute.Custom('ArtifactType')|l] này là một trong những vật quý báu nhất của ta — giờ thuộc về ngài [overlord_scope.GetTitleAsNameNoTooltip], như một cử chỉ trân trọng lẫn nhau.\""
  tribute_mission.1000.outro.attendant: "\n\nThị vệ suy nghĩ một lát, cho phép ta kịp thời xen lời:"
  tribute_mission.1000.outro: "\n\n[receiving_character.GetTitledFirstNameNoTooltip] suy nghĩ một lát, cho phép ta kịp thời xen lời:"
  tribute_mission.1000.treasury: "\"Nay, vải vóc của [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]... thật tráng lệ...\""
  tribute_mission.1000.success.t: "Thành công"
  tribute_mission.1000.success.desc: "Ngươi đã thuyết phục thành công [receiving_character.GetHerHim]"
  tribute_mission.1000.failure.t: "Thử nghiệm thất bại"
  tribute_mission.1000.failure.desc: "Nỗ lực của ngươi bị phớt lờ"
  tribute_mission.1000.failure.tt: "[receiving_character.GetShortUIName] quyết định về món quà"
  tribute_mission.1000.artifact: "\"Các tác phẩm của [overlord_scope.GetCulture.GetCollectiveNounNoTooltip|U], thật đáng nể...\""
  tribute_mission.1000.artifact.tt: "Ngươi nhận được một [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] [artifact|E]"
  tribute_mission.1000.innovation: "\"Chia sẻ tri thức — còn mục đích cao quý nào hơn...\""
  tribute_mission.1000.innovation.tt: "Ngươi khám phá ra một [innovation|E] mới để nghiên cứu hoặc nhận tiến độ [fascination|E]"
  tribute_mission.1000.development: "\"Về những thị trường chưa khai thác ở [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]...\""
  tribute_mission.1000.monk.tt: "[receiving_character.GetShortUIName] sẽ tặng ngươi một [overlord_scope.GetFaith.GetAdjective] [courtier|E] tu sĩ"
  tribute_mission.1000.abstain: "\"Nguyện [tributary_scope.GetFaith.HighGodName] ban phước cho chúng ta nhiều thịnh vượng.\""
  tribute_mission.1000.abstain.treasury.desc: "Hàng hóa quý giá được trao tặng"
  tribute_mission.1000.abstain.artifact.desc: "Một cổ vật tuyệt vời được tạo ra"
  tribute_mission.1000.abstain.innovation.desc: "Tiến bộ công nghệ được chia sẻ"
  tribute_mission.1000.abstain.development.desc: "Thương nhân [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] được gửi đến thủ đô của ngươi"
  tribute_mission.1000.abstain.monk.desc: "Một [overlord_scope.GetFaith.GetAdjective] tu sĩ được trao cho ngươi, để truyền bá trí tuệ"
  tribute_mission.1000.abstain.legitimacy.desc: "Ngươi được ban thêm những phước lành về tính hợp pháp"
 #Recipient: Decide on the human tribute
  tribute_mission.1002.t: "$tribute_mission_header$ Số Phận Phía Trước"
  tribute_mission.1002.segway: "[tributary_scope.GetTitledFirstName|U] tiến vào đại điện cùng tùy tùng, nóng lòng dâng lên cống phẩm của mình."
  tribute_mission.1002.desc.concubine: "Một phi tần xinh đẹp, được trình bày dưới tên [human_tribute.GetTitledFirstName], trông vậy."
  tribute_mission.1002.desc.new_eunuch: "Một thái giám rất khó xử, trông vậy.\n\n[human_tribute.GetWomanMan], được trình bày dưới tên [human_tribute.GetTitledFirstName], nhăn mặt khi [human_tribute.GetSheHe] bước lên gần để Ta xem xét."
  tribute_mission.1002.desc.eunuch: "Trông ngài ấy như một hoạn quan lão luyện.\n\n[human_tribute.GetWomanMan] được tiến cử là [human_tribute.GetTitledFirstName], toát lên vẻ điềm tĩnh vượt xa độ tuổi của mình, lặng lẽ quan sát ta khi ta đang kiểm tra nhân phẩm của ngài."
  tribute_mission.1002.beauty.concubine.good: "\n\n[human_tribute.GetHerHis|U] mái tóc bóng mượt, làn da trắng ngần, đôi mắt sáng và dáng người thanh tú... Ta say sưa ngắm nhìn vóc dáng của [human_tribute.GetHerHis], mà vẫn cảm thấy chưa đủ."
  tribute_mission.1002.beauty.concubine.bad: "\n\nTóc rối, da sần... góc hàm. Không nhiều điểm cộng về ngoại hình [human_tribute.GetHerHis]. Ta mím môi nhẹ."
  tribute_mission.1002.physique.concubine.good: "\n\nThân hình ấn tượng của [human_tribute.GetWomanMan] khiến Ta cảm thấy khỏe hơn chỉ bằng cách ngắm nhìn [human_tribute.GetHerHim]. Ta thực sự thích thú."
  tribute_mission.1002.physique.concubine.bad: "\n\nHắng họng liên tục, cánh tay gầy gò... có điều gì đó không ổn với thể trạng [human_tribute.GetHerHis], nhưng khó xác định. Nó làm Ta hơi khó chịu."
  tribute_mission.1002.exterior.plain: "\n\n[human_tribute.GetHerHis|U] dung mạo tuy không có gì nổi bật, nhưng ánh sáng trong đôi mắt của ngài vẫn khiến ta phải chú ý."
  tribute_mission.1002.personality.shy: "\n\n[human_tribute.GetSheHe|U] lùi bước khi thấy vài tên lính canh đi ngang qua, quá gần. Cố gắng thu mình hết mức có thể, [human_tribute.GetSheHe] hơi sụp vai, không gây ra bất kỳ tiếng động nào."
  tribute_mission.1002.personality.bold: "\n\nMột dáng vẻ đầy sức sống cho thấy [human_tribute.GetWomanMan] này có thể kiên định giữ vững lập trường, dù là theo chiều hướng nào đi chăng nữa."
  tribute_mission.1002.personality.cynical: "\n\nMột cái nháy mắt ở khóe mắt của [human_tribute.GetHerHis], khi cánh tay ngài ấy chuyển sang tư thế phòng thủ, cho thấy [human_tribute.GetWomanMan] này có cái nhìn rất riêng về thế gian."
  tribute_mission.1002.personality.angry: "\n\nVết nhăn sâu dần giữa hai lông mày [human_tribute.GetHerHis] kể câu chuyện về một [human_tribute.GetWomanMan] rất cứng rắn."
  tribute_mission.1002.personality.fallback: "\n\n[human_tribute.GetFirstNameNoTooltip] liếc ánh mắt về phía ta, rồi nhìn quanh phòng, rồi lại quay lại nhìn ta, như thể đang tìm kiếm manh mối để giải một câu đố."
  tribute_mission.1002.a: ""[human_tribute.GetSheHe|U] có thể sẽ hữu ích ở triều đình nào đó.""
  tribute_mission.1002.b: ""Chà, chúng ta nên bổ nhiệm ngươi #EMP ngay lập tức...#!"" 
  tribute_mission.1002.b.flavor: "Có phải đây là một #EMP mẫu vật tuyệt vời#!..."
  tribute_mission.1002.c: ""Ngươi sẽ làm việc trực tiếp cho ta.""
  tribute_mission.1002.d: ""Hmm, Ta nghĩ hiện tại đủ rồi.""
  tribute_mission.1002.d.tt: "[human_tribute.GetShortUIName] được dẫn trở lại [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier]"
 #Recipient: What do you get/give?
  tribute_mission.1005.t: "$tribute_mission_header$ Cống phẩm"
  tribute_mission.1005.t.ai.bunga_mas: "$tribute_mission_header$ [newly_created_bunga_mas.GetNameNoTooltip]"
  tribute_mission.1005.t.bunga_mas: "$tribute_mission_header$ [tributary_scope.GetTitledFirstNamePossessiveNoTooltip] Hoa Vàng"
  tribute_mission.1005.t.gold: "$tribute_mission_header$ Vàng của [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
  tribute_mission.1005.t.herd: "$tribute_mission_header$ Đàn Vật của [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
  tribute_mission.1005.t.concubine: "$tribute_mission_header$ Mỹ Nhan của [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
  tribute_mission.1005.t.eunuch: "$tribute_mission_header$ Thái Giám của [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
  tribute_mission.1005.t.artifact: "$tribute_mission_header$ Cổ Vật của [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
  tribute_mission.1005.intro.human_tribute: "[tributary_scope.GetTitledFirstName] bồn chồn đứng từ chân này sang chân kia khi [tributary_scope.GetSheHe] chờ đợi quyết định của ta, thỉnh thoảng lại liếc nhìn [human_tribute.GetTitledFirstName] với ánh mắt dò xét."
  tribute_mission.1005.intro: "[tributary_scope.GetTitledFirstName] sải bước vào đại điện, ung dung tiến lại gần ta và dâng lên lễ vật với nụ cười nịnh nọt:"
  tribute_mission.1005.desc.bunga_mas: "\n\nCây hoa vàng! Cổ vật tuyệt mỹ sừng sững trên đống cống phẩm nhỏ bé khác. Những chiếc lá nhỏ ánh lên, tỏa ra vầng sáng chỉ có thể sánh với chính ngươi.\n\nTa nhanh chóng lấy lại bình tĩnh, cố giấu cảm xúc, và suy tính ân huệ nào nên ban để đáp lại món quà tráng lệ này..."
  tribute_mission.1005.desc.small_gold: "\n\nTa khẽ nhướng mày khi các thuộc hạ kiểm tra số tiền lẻ và đồ trang sức ít ỏi cấu thành nên phần cống phẩm nhỏ bé này.\n\nNó sẽ chẳng thể lấp đầy ngân khố của chúng ta — nhưng ít nhất [tributary_scope.GetTitledFirstNameNoTooltip] đã hoàn thành nghĩa vụ triều cống. Giờ đây, ta nên ban phát ân huệ gì để đáp lễ..."
  tribute_mission.1005.desc.adequate_gold: "\n\nTa gật nhẹ trước cống phẩm đáng trân trọng; kim loại quý và vải vóc thi thoảng ánh lên, lấp lánh nhẹ nhàng.\n\nNay đến việc tiếp theo: ân huệ nào nên ban đáp lại..."
  tribute_mission.1005.desc.excessive_gold: "\n\nVàng, lụa, châu báu — một màn trình diễn rực rỡ nhưng #EMP vui mắt#! chào đón ta. Ta cẩn thận điều chỉnh nét mặt, không để lộ sự ấn tượng.\n\nĐây là vừa đủ. Nay, sẽ ban thưởng món cống phẩm xa hoa này thế nào..."
  tribute_mission.1005.desc.small_herd: "\n\nSố lượng gia súc ít ỏi kêu be be và nhìn quanh một cách lo âu khi các thuộc hạ kiểm tra chúng.\n\nKhông nhiều nhặn gì — nhưng ít nhất [tributary_scope.GetTitledFirstNameNoTooltip] đã hoàn thành nghĩa vụ triều cống. Giờ đây, ta nên ban phát ân huệ gì để đáp lễ..."
  tribute_mission.1005.desc.adequate_herd: "\n\nĐàn vật chất lượng vừa phải nhìn quanh tò mò khi được đầy tớ kiểm tra.\n\nChúng sẽ là bổ sung tốt. Nay, ân huệ nào nên ban đáp lại..."
  tribute_mission.1005.desc.excessive_herd: "\n\nNhững gia súc tinh túy nhất được trưng bày làm cống phẩm: lông óng, mắt sáng — và còn nhiều con chờ bên ngoài. Quả là cống phẩm đáng nể.\n\nNay, sẽ thưởng món cống phẩm xa hoa này thế nào..."
  tribute_mission.1005.desc.rejected_concubine: "\n\nMột mẫu vật đáng khinh, ta mím môi khi nhìn lại món cống phẩm này. Và [tributary_scope.GetTitledFirstNameNoTooltip] cho rằng [human_tribute.GetHerHim] xứng đáng được để mắt tới. #EMP Hmph.#!\n\nNay, nên ban gì cho [tributary_scope.GetTitledFirstNameNoTooltip]..."
  tribute_mission.1005.desc.appointed_concubine: "\n\nTa thoáng dừng mắt trên [human_tribute.GetHerHis] với vẻ tinh nghịch và #EMP hấp dẫn#!.\n\nMáu dồn lên gò má; ta tự nhủ phải tập trung — ân huệ nào nên ban cho [tributary_scope.GetTitledFirstNameNoTooltip] vì món cống phẩm #EMP tuyệt vời#! này?"
  tribute_mission.1005.desc.concubine: "\n\nSau khi thêm [human_tribute.GetHerHim] vào triều, ta chắc chắn [human_tribute.GetSheHe] sẽ hữu dụng ở đâu đó.\n\nVậy, nên ban ân huệ nào cho [tributary_scope.GetTitledFirstNameNoTooltip]..."
  tribute_mission.1005.desc.rejected_eunuch: "$tribute_mission.1005.desc.rejected_concubine$"
  tribute_mission.1005.desc.appointed_eunuch: "\n\nLà thái giám trưởng mới, [human_tribute.GetSheHe] sẽ phục vụ ta chu đáo.\n\nTa mỉm cười nhè nhẹ khi suy tính ân huệ nào nên ban cho [tributary_scope.GetTitledFirstNameNoTooltip]..."
  tribute_mission.1005.desc.eunuch: "$tribute_mission.1005.desc.concubine$"
  tribute_mission.1005.desc.artifact: "\n\n[artifact_to_tribute.GetName] là một cống phẩm tinh xảo, ta nhẹ nhàng vuốt dọc theo viền. Một tác phẩm vững chãi, không nghi ngờ gì.\n\nNay, nên đáp trả món cống phẩm này thế nào..."
  tribute_mission.1005.desc: "\n\nTa cân nhắc kỹ lưỡng cống phẩm được dâng.\n\nNay, nên đáp trả món cống phẩm này thế nào..."
  tribute_mission.1005.treasury: "\"Hãy thưởng cho món cống phẩm bằng những hàng hóa quý giá.\""
  tribute_mission.1005.artifact: "\"Ta sẽ ban cho ngươi các báu vật [overlord_scope.GetCulture.GetCollectiveNounNoTooltip].\""
  tribute_mission.1005.artifact.tt: "Ngươi trao [tributary_scope.GetShortUINameNoTooltip] một [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] [artifact|E]"
  tribute_mission.1005.innovation: "\"Có một vài tiến bộ kỹ thuật chúng ta có thể chia sẻ...\""
  tribute_mission.1005.innovation.tt: "Ngươi trao [tributary_scope.GetShortUINameNoTooltip] một số tiến bộ kỹ thuật"
  tribute_mission.1005.development: "\"Chúng ta sẽ thiết lập một trạm thương mại tuyệt hảo tại thủ đô của ngươi.\""
  tribute_mission.1005.monk: "\"Ngươi sẽ được dẫn dắt bởi một trong những tu sĩ uyên thâm nhất của ta.\""
  tribute_mission.1005.legitimacy: "\"Ta tái khẳng định ngươi là chính chủ cai trị [tributary_scope.GetCapitalLocation.GetCounty.GetName].\""
  fervor_gain_suzerain_missionaries: "Các Thừa Sai của Chư Hầu"
  fervor_loss_suzerain_missionaries: "Từ Chối Thừa Sai"

 #Tributary: Woah, some bling
  tribute_mission.1010.t: "$tribute_mission_header$ Lễ Xuất Phát"
  tribute_mission.1010.t.treasury: "$tribute_mission_header$ Hàng Thương Mại của [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]"
  tribute_mission.1010.t.artifact: "$tribute_mission_header$ Tuyệt Tác của [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
  tribute_mission.1010.t.innovation: "$tribute_mission_header$ Sự Thú Vị của [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]"
  tribute_mission.1010.t.development: "$tribute_mission_header$ Thương Nhân của [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
  tribute_mission.1010.t.monk: "$tribute_mission_header$ Trí Tuệ của [overlord_scope.GetFaith.GetNameNoTooltip]"
  tribute_mission.1010.t.legitimacy: "$tribute_mission_header$ Tính Hợp Pháp của [overlord_scope.GetFaith.GetNameNoTooltip]"
  tribute_mission.1010.intro.attendant: "Người hầu suy nghĩ thêm vài khoảnh khắc trước khi dường như đi đến quyết định."
  tribute_mission.1010.intro: "[receiving_character.GetTitledFirstName] xem xét cống phẩm của Ta từ đầu đến chân trước khi dường như quyết định."
  tribute_mission.1010.intro.postseal: "Khi nghi lễ $game_concept_seal_of_investiture$ trang nghiêm và pháp lý kết thúc, sự giàu có tráng lệ của [overlord_scope.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip] tuôn trào."
  tribute_mission.1010.segway: "\n\nRa dấu về phía sau phòng,"
  tribute_mission.1010.desc.treasury: "$tribute_mission.1010.segway$ vô số thùng chứa vải quý, thỏi vàng và gia vị có nguồn gốc từ [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] được trình bày lộng lẫy."
  tribute_mission.1010.desc.artifact: "$tribute_mission.1010.segway$ một hiện vật quý giá [overlord_scope.GetCulture.GetCollectiveNounNoTooltip], [tribute_reward_type_artifact.GetName], được dâng trên gối nhung, tăng thêm vẻ rực rỡ."
  tribute_mission.1010.desc.innovation: "$tribute_mission.1010.segway$ một nhóm tu sĩ tiến đến, trao Ta vài cuộn giấy chứa kiến thức và phát kiến mới."
  tribute_mission.1010.desc.development: "$tribute_mission.1010.segway$ một Bạn Bè học thức tiếp cận, đưa Ta hợp đồng.\nTrong hợp đồng, một thỏa thuận thương mại để lập các trạm giao dịch [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] tại [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip], góp phần phát triển và làm giàu vùng này."
  tribute_mission.1010.desc.monk: "$tribute_mission.1010.segway$ [new_monk.Custom('GetArticledAgeDescriptionGender')] bước ra và giới thiệu [new_monk.GetHerselfHimself] là [new_monk.GetTitledFirstName], một nhà sư thuộc đức tin [overlord_scope.GetFaith.GetAdjectiveNoTooltip]. Ngài vui vẻ thông báo với ta về ý định sẽ theo ta đến [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] để dâng hiến tài sức của mình."
  tribute_mission.1010.desc.legitimacy: "\n\n[overlord_scope.GetSheHe|U] ra dấu cho Ta đến gần, rồi với dáng đi uy nghiêm, bước xuống trước mặt Ta. Ta cúi đầu khi [overlord_scope.GetTitleAsNameNoTooltip] thực hiện nghi thức tay [overlord_scope.GetCulture.GetCollectiveNounNoTooltip].\n\nKhi xong, [overlord_scope.GetSheHe] tuyên bố với giọng uy nghiêm: \"Ta xác nhận lại ngươi là thống trị thực sự của [tributary_scope.GetCapitalLocation.GetCounty.GetName]. Hãy đi bình an.\""
  tribute_mission.1010.outro: "\n\n\"Hãy xem ngươi được ban phước bởi [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip], [tributary_scope.GetTitleAsNameNoTooltip] của ta. Chúc đi đường bình an.\""
  tribute_mission.1010.a: ""Chúc ngươi nhận được phước lành!""
 
