l_english:

 ###Disbelieve Mandala Scheme
 # Ongoing Events
  disbelieve_mandala_ongoing.0001.t: "$disbelieve_mandala$: Không Có Phép Màu"
  disbelieve_mandala_ongoing.0001.desc: "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] của Ta, [agent.GetName], tiếp cận Ta trong bóng tối của đêm với một kế hoạch xảo quyệt thì thầm.\n\n\"Qua các gian hàng chợ và sân đền. Một thương nhân ở đây, một Bạn Bè ở kia, mỗi người lặng lẽ nhắc lại cùng một câu chuyện về [target.GetTitledFirstName].\"\n\n\"Họ sẽ nói rằng phép màu của dòng sông chỉ là mánh khóe của dòng chảy và ánh đèn, rằng người ăn mày được chữa lành đã bị thấy lấy tiền từ một quan viên đi ngang.\""
  disbelieve_mandala_ongoing.0001.a: "\"Kế hoạch tuyệt vời, [agent.GetFirstNameNoTooltip]!\""
  disbelieve_mandala_ongoing.0001.a.crit_success: "Mọi người nghĩ những phép màu là của Ngài"
  disbelieve_mandala_ongoing.0001.a.success: "Có tin đồn rằng những phép màu là giả"
  disbelieve_mandala_ongoing.0001.a.failure: "Người tác giả của Ngài bị phát hiện"
  disbelieve_mandala_ongoing.0001.a.failure.breach: "#alert_trial @alert_icon! [my_scheme.GetName] nhận được #V 1#! [scheme_breach|E]#!"
  disbelieve_mandala_ongoing.0001.b: "Không đáng mạo hiểm."
  scheme_fake_miracles: "Phép Màu Giả"
  scheme_fake_miracles_desc: "Những hành động thần kỳ của mục tiêu của Ngài bị coi chỉ là sự trùng hợp ngẫu nhiên."
 
  disbelieve_mandala_ongoing.0010.t: "$disbelieve_mandala$: Gần Như Giả Mạo"
  disbelieve_mandala_ongoing.0010.desc: "\"Chúng ta có thể giấu một di vật,\" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spymaster'))] của Ta, [spymaster.GetName], đề nghị, sau khi khăng khăng gặp nhau tại phòng nghiên cứu.\n\n\"Một bản giả, được chế tác cẩn thận, trong đền thờ của [target.GetTitledFirstNamePossessive]. Hãy để nó được #EMP phát hiện#! và sau này được tiết lộ là giả: người dân sẽ nghi ngờ những kỳ diệu, giáo sĩ sẽ xì xào, và hào quang linh thiêng của [target.GetHerHis] sẽ sụp đổ.\""
  disbelieve_mandala_ongoing.0010.a: "Bản #EMP [fake_relic.GetNameNoTooltip]#! trông gần như thật."
  disbelieve_mandala_ongoing.0010.a.success: "Kế hoạch thành công"
  disbelieve_mandala_ongoing.0010.a.failure: "Người tác giả của Ngài bị phát hiện"
  disbelieve_mandala_ongoing.0010.b: "[target.GetTitledFirstNameNoTooltip] không phải kẻ ngốc."
  rival_planted_fake_artifact: "[CHARACTER.GetShortUIName] đã cố gắng giấu một di vật giả trong triều đình của [TARGET_CHARACTER.GetShortUINamePossessive]."
  rival_planted_fake_artifact_corresponding: "$rival_planted_fake_artifact$"

 #Outcome Events
  scheme_critical_moments.1212.t: "[scheme.GetNameNoTooltip]: Thành Công"
  scheme_critical_moments.1212.desc: "Chỉ cần một khe hở cũng đủ phá vỡ mọi thứ.\n\nNỗ lực lan truyền sự nghi ngờ về bản chất thần thánh của [target.GetTitledFirstNamePossessive] đã đem lại kết quả, và giờ tên của [target.GetHerHis] không thể được nhắc đến mà không có ít nhất một người trong cuộc trò chuyện hỏi xem những tin đồn có thật không. Những tin đồn về những việc quỷ quyệt của [target.GetHerHis]. Về những điều không nhất quán bất tài của [target.GetHerHis]."
  scheme_critical_moments.1212.desc_discovered: "\n\nNgay cả khi [target.GetFirstNameNoTooltip] biết về sự liên quan của Ta, cũng không quan trọng! Sớm thôi thế giới sẽ biết Devaraja duy nhất: Ta!"
  scheme_critical_moments.1212.desc_secret: "\n\n[target.GetFirstNameNoTooltip] vẫn bối rối trước sự ghét bỏ của [target.GetHerHis], hoàn toàn không biết Ta liên quan!"
  scheme_critical_moments.1212.a: "Đó là điều đúng đắn để làm."

  scheme_critical_moments.1213.t: "[scheme.GetNameNoTooltip]: Thất Bại"
  scheme_critical_moments.1213.desc: "Không có gì. Hàng tháng lập kế hoạch, lan truyền tin đồn và hối lộ, nhưng thần tính của [target.GetTitledFirstNamePossessive] vẫn bất khả xâm phạm!"
  scheme_critical_moments.1213.desc_discovered: "\n\nĐiều tồi tệ hơn, Ta không chỉ lãng phí thời gian và tài nguyên, mà [target.GetFirstNameNoTooltip] còn nhận ra những ý định xấu thiển cận của Ta!"
  scheme_critical_moments.1213.desc_secret: "\n\nÍt nhất, [target.GetFirstNameNoTooltip] vẫn hoàn toàn không biết gì về việc này..."
  scheme_critical_moments.1213.a: "Chỉ là một trở ngại nhỏ..."

  scheme_critical_moments.1214.t: "Mandala Bị Nghi Ngờ"
  scheme_critical_moments.1214.desc: "Bắt đầu bằng một cái nhìn. Cái nhìn lạ lùng của #EMP sự do dự#!? Khi Ta ra lệnh cho họ làm việc nhân danh thần thánh, họ chần chừ lâu hơn một chút so với bình thường. Các Bạn Bè thì thầm về những thiếu sót của Ta, những khuyết điểm chứng minh Ta thực sự là con người chứ không phải thần thánh.\n\nChúng dám sao. Ta sẽ chứng minh họ sai. Ta phải làm."
  scheme_critical_moments.1214.desc_discovered: "\n\nVà để thêm phần nhục nhã, các đại lý của Ta chắc chắn: chính [owner.GetTitledFirstName] đã điều khiển việc nghi ngờ thần tính của Ta..."
  scheme_critical_moments.1214.a: "Thật phiền lòng..."

  scheme_critical_moments.1215.t: "Mandala Bất Khả Xâm Phạm"
  scheme_critical_moments.1215.desc: "Tin đồn giả và lời xì xào ác ý cố gắng làm suy yếu quyền lực của Ta. Cố gắng làm cho #EMP Ta#! ít thần thánh hơn.\n\nNgười theo dõi Ta sẽ không chấp nhận điều đó, uy danh của Ta vẫn an toàn. Ít nhất là bây giờ."
  scheme_critical_moments.1215.desc_discovered: "Tuy nhiên, các đại lý của Ta chắc chắn: chính [owner.GetTitledFirstName] đã tổ chức sự nghi ngờ thần tính của Ta..."
  scheme_critical_moments.1215.a: "Chúng dám sao!"
  scheme_critical_moments.1215.a_discovered: "Kẻ [owner.Custom2('InsultNoun', ROOT.Char)] đó..."

 ###Coerce Tributary Events
  scheme_critical_moments.1222.t: "[scheme.GetNameNoTooltip]: Thành Công"
  scheme_critical_moments.1222.desc: "Những thử thách và gian nan của Ta đã thành công! Tất cả thời gian dành để kiệt sức [target.GetTitledFirstName|U], và giờ đây [target.GetSheHe] cuối cùng cũng đồng ý, sẵn sàng chịu thần phục dưới quyền Ta.\n\nTa sẽ trị vì với vinh quang và duyên dáng!"
  scheme_critical_moments.1222.a: "Thêm một chư hầu nữa đáp lời!"

  scheme_critical_moments.1223.t: "[scheme.GetNameNoTooltip]: Thất Bại"
  scheme_critical_moments.1223.intro: "Không thành công. Tất cả công sức của Ta, để làm gì?"
  scheme_critical_moments.1223.desc: "[target.GetTitledFirstName|U] đã từ chối sự tiến cử của ta, khăng khăng rằng [target.GetSheHe] tự thân vận động thì tốt hơn. Để xem điều đó sẽ đi đến đâu."
  scheme_critical_moments.1223.desc_suzerain: "[target.GetTitledFirstName|U] từ chối Ta, viện dẫn sự vượt trội của [target.GetSuzerain.GetTitledFirstName] như lãnh đạo duy nhất của [target.GetHerHis]. Thật là chuyện nhảm nhí."
  scheme_critical_moments.1223.a: "Phì. Ta sẽ tìm những thần dân xứng đáng hơn!"

  scheme_critical_moments.1224.t: "[scheme.GetNameNoTooltip]: Thành Công"
  scheme_critical_moments.1224.desc: "Đã đến lúc. Khoảnh khắc để [target.GetTitledFirstName] rời khỏi vòng tay của [target.GetSuzerain.GetTitledFirstNamePossessive] đã cận kề. Điều còn lại là [target.GetFirstNameNoTooltip] thông báo cho [target.GetSuzerain.GetTitledFirstNameNoTooltip] về tình hình, rồi Ta sẽ nhận được cống vật...\n\nHy vọng [target.GetSuzerain.GetTitledFirstNameNoTooltip|U] sẽ là một vị lãnh chúa danh dự và để [target.GetHerHim] rời đi một cách hòa nhã đến chư hầu #EMP thích hợp hơn#!."
  scheme_critical_moments.1224.a: "Ta nóng lòng quá!"

  scheme_critical_moments.1225.t: "Chư Hầu Bị Gián Đoạn"
  scheme_critical_moments.1225.desc: "Sứ giả chư hầu [target.GetTitledFirstNamePossessive] đến triều đình Ta, và thông điệp rõ ràng.\n\nRằng kẻ [owner.Custom2('InsultNoun', ROOT.Char)] [owner.GetTitledFirstName|U] đã xui khiến tâm trí [target.GetFirstNamePossessiveNoTooltip], khiến [target.GetHerHim] chống lại Ta, và giờ đây [target.GetSheHe] khao khát #EMP rời khỏi#! vòng tay Ta, rút cống vật và từ chối thần phục."
  scheme_critical_moments.1225.a: "Tốt hơn Ta nên đưa ra một #EMP động lực...#!"
  scheme_critical_moments.1225.b: "#EMP Chúng ta sẽ xem sao.#!"
  scheme_potential_suzerain_might_join_war_tt: "\n@alert_icon! #alert_trial [CHARACTER.GetShortUIName] có thể trở thành [TARGET_CHARACTER.GetShortUINamePossessive] [suzerain|E], tham gia chiến tranh với tư cách là bên phòng thủ!#!"
  scheme_critical_moments.1225.c: "Ổn cả."

  scheme_critical_moments.1226.t_incentivizing: "[scheme.GetNameNoTooltip]: Thắng Có, Thua Cũng Có"
  scheme_critical_moments.1226.t_warring: "[scheme.GetNameNoTooltip]: Liên Minh Chiến Tranh"
  scheme_critical_moments.1226.t: "[scheme.GetNameNoTooltip]: Buông Tay"
  scheme_critical_moments.1226.desc_incentivizing: "Bức thư từ [target.GetTitledFirstNamePossessive|U] là một tình trạng đáng buồn. [incentivizing_suzerain.GetTitledFirstName] đã #EMP tạo động lực#! cho kẻ [owner.Custom2('InsultNounClumsy', ROOT.Char)] cũ ở lại, ít nhất là thêm một #EMP thời gian#!...\n\n...và 'Devaraja' giả mạo [incentivizing_suzerain.GetFirstNameNoTooltip] phải trả một số khoản, do thiếu thần tính thực sự.\n\nBiết đâu lần tới [target.GetFirstNameNoTooltip] sẽ sáng mắt, và gia nhập vòng tay Ta."
  scheme_critical_moments.1226.desc_warring: "Đặc sứ của [target.GetTitledFirstNamePossessive|U] vội vã xông vào triều đình của ta: \"Chiến tranh!\" [dummy_envoy.GetSheHe] hét lên, \"Chiến tranh! [warring_suzerain.GetTitledFirstName|U] đã tự mình quyết định sửa chữa sai lầm nhất thời của [target.GetLadyLord] bằng #EMP vũ lực!#!\"\n\nVẫn còn hoảng loạn, [dummy_envoy.GetSheHe] quỳ dưới chân ta: \"Xin ngài, xin ngài #EMP cứu giúp chúng tôi!#!\"\n\nMột cơn ớn lạnh chạy dọc sống lưng ta. Chiến tranh sao?"
  scheme_critical_moments.1226.desc: "Chư Hầu Thần Phục"
  scheme_critical_moments.1226.a: "\"Cứu viện!\""
  scheme_critical_moments.1226.b: "Vậy thì..."
  scheme_critical_moments.1226.b_warring: "\"Ta không đăng ký cho #EMP chiến tranh#!.\""
  scheme_critical_moments.1226.b_incentivizing: "À, cũng được. Nhưng Ta đã làm tốt."
 
  coerce_and_leverage_contribution_ongoing.0001.t: "[my_scheme.GetNameNoTooltip]: Mỗi Người Một Phần"
  coerce_and_leverage_contribution_ongoing.0001.desc.intro: "Ta đến thăm [target_county.GetName] trong nỗ lực kêu gọi cư dân đóng góp cho dự án lớn [ROOT.Char.GetFaith.HouseOfWorship] của Ta.\n\n"
  coerce_and_leverage_contribution_ongoing.0001.desc.high_dev: "Các gian hàng bán [ROOT.Char.Custom('GetExpensiveMeal')] hấp dẫn Ta bằng mùi thơm quyến rũ."
  coerce_and_leverage_contribution_ongoing.0001.desc.low_dev: "Người dân tụ tập tại [ROOT.Char.Custom('GetSquareCommons')], bao quanh bởi [ROOT.Char.Custom('GetCrookedhousesDelapidatedtents')] và các thương nhân đang cố vứt bỏ những [ROOT.Char.Custom('get_region_root_vegetable_plural')] hỏng hơn."
  coerce_and_leverage_contribution_ongoing.0001.desc.regular_dev: "Các thương nhân bán [ROOT.Char.Custom('GetTradeGoods')] chèo kéo khách vãng lai không ngờ."
  coerce_and_leverage_contribution_ongoing.0001.desc.outro: "\n\n\"Nghe đây, nghe đây! Cho [peasant.Custom('dummy_peasant_profession')] và [peasant.Custom2('dummy_peasant_profession', peasant)]! Chỉ với #EMP một số vàng ít ỏi#! tất cả có thể là của Ngài!\""
  coerce_and_leverage_contribution_ongoing.0001.a: "Những người này có thể dành ra một đồng."
  coerce_and_leverage_contribution_ongoing.0001.b: "Họ còn nhiều lo toan hơn."
  coerced_contribution_county_modifier: "Đóng Góp 'Tự Nguyện'"
  coerced_contribution_county_modifier_desc: "Cư dân trong quận này bị ép buộc đóng góp cho dự án lớn."
  scheme_coerced_subjects_modifier: "$coerced_contribution_county_modifier$"
  scheme_coerced_subjects_modifier_desc: "$coerced_contribution_county_modifier_desc$"
  spared_contribution_county_modifier: "Được Miễn Đóng Góp"
  spared_contribution_county_modifier_desc: "Cư dân trong quận này được miễn nghĩa vụ đóng góp cho dự án lớn."
 
  coerce_and_leverage_contribution_ongoing.0010.t: "[my_scheme.GetNameNoTooltip]: Cứu Rỗi Bằng Vàng"
  coerce_and_leverage_contribution_ongoing.0010.desc: "Mùi [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] chào buổi sáng Ta, không khí tràn ngập cảm giác [ROOT.Char.Custom('GetSeasonAdj')] của [ROOT.Char.Custom('GetSeason')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], gánh nặng xây dựng [ROOT.Char.GetFaith.HouseOfWorship] thật nặng nề,\" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))], [court_chaplain.GetName], tiếp cận Ta, mỉm cười [court_chaplain.Custom('quirk_pos_adverb')]. \"Nhưng tín đồ có thể được lay động bởi lời hứa về ân sủng thiên thượng.\"\n\n\"Nếu chúng ta quyết định như vậy, những người đóng góp sẽ nhận được phước lành vượt ngoài số đông.\""
  coerce_and_leverage_contribution_ongoing.0010.aa: "\"#EMP Ta#! muốn nhận phước lành đó.\""
  coerce_and_leverage_contribution_ongoing.0010.a: "\"Thực hiện ngay.\""
  coerce_and_leverage_contribution_ongoing.0010.b: "Điều này không đáng để quan tâm."
 
  coerce_and_leverage_contribution_ongoing.0020.t: "[my_scheme.GetNameNoTooltip]: Giá Trị Một Lời Hứa"
  coerce_and_leverage_contribution_ongoing.0020.desc: "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('servant'))] của Ta, [servant.GetName], cúi thấp, [servant.Custom('GetWritingMaterialPlural')] trong tay.\n\n\"Kho bạc cho [ROOT.Char.GetFaith.HouseOfWorship] tăng chậm quá.\" [servant.GetSheHe|U] thông báo, [servant.Custom('quirk_pos_pp')].\n\n\"Nhưng lời nói có thể mua được những gì tiền không làm được. Có lẽ một bức thư gửi [target.GetTitledFirstName], kèm lời hứa hấp dẫn, có thể lay chuyển ý chí [target.GetHerHis] giúp đỡ...\""
  coerce_and_leverage_contribution_ongoing.0020.aa: "Một lời hứa không cần phải là thật..."
  coerce_and_leverage_contribution_ongoing.0020.a: "\"Nhanh chóng viết đi!\""
  coerce_and_leverage_contribution_ongoing.0020.b: "\"Chỉ cần nhắc rằng Ta đánh giá cao sự hào phóng của [target.GetHerHis].\""
  scheme_promised_hook_modifier: "Móc Hứa Hẹn"
  scheme_promised_hook_modifier_desc: "Người khởi xướng kế hoạch hứa hẹn cho mục tiêu một cái móc... có thật hay không chỉ chủ nhân biết."

 #OPINIONS
  coerced_my_tributary_opinion: "Ép Buộc Chư Hầu Của Ta"
  coerced_tributary_opinion: "Chư Hầu Bị Ép Buộc"

 #Coerce Contribution Outcomes
  scheme_critical_moments.1242.t: "[scheme.GetNameNoTooltip]: Thành Công"
  scheme_critical_moments.1242.desc: "Ta luôn biết Ta có thể trông cậy vào những người cần cù của [target_title.GetBaseNameNoTierNoTooltip] để giúp đỡ Ta. Vì một lý tưởng lớn hơn, và để tôn vinh lãnh chúa của họ, họ đã tượng trưng như cởi bỏ áo mình để tài trợ cho khu đền của Ta.\n\nThật là tuyệt vời."
  scheme_critical_moments.1242.a: "Tốt, tốt..."

  scheme_critical_moments.1243.t: "[scheme.GetNameNoTooltip]: Thất Bại"
  scheme_critical_moments.1243.desc: "Những [owner.Custom('InsultNoun')] của [target_title.GetBaseNameNoTierNoTooltip] không chịu hợp lý và tích cực từ chối các yêu cầu đóng góp cho dự án #EMP lớn#! của Ta.\n\nLấy #EMP thiếu tiền#! làm lý do. Thật vô lý! Có ý chí là có cách!"
  scheme_critical_moments.1243.a: "Thật hỗn láo!"

  insusceptible_to_coerce_contribution_modifier: "Không Dễ Bị Ép Buộc"
  insusceptible_to_coerce_contribution_modifier_desc: "Quận này không đồng ý bị ép buộc tài trợ cho Khu Đền Thánh Đế."


 #Coerce Contribution Outcomes
  scheme_critical_moments.1252.t: "[scheme.GetNameNoTooltip]: Thành Công"
  scheme_critical_moments.1252.desc: "Ta luôn biết Ta có thể trông cậy vào [target.GetTitledFirstName] để giúp đỡ! Sự thuyết phục, mềm mỏng và tranh luận của Ta đã đạt kết quả — [target.GetSheHe] đã rộng lượng đồng ý đầu tư vào dự án của Ta, nỗ lực hết mình để làm cho ngôi đền thêm huy hoàng.\n\nSự siêu việt đang đến gần..."
  scheme_critical_moments.1252.a: "Tuyệt vời!"

  scheme_critical_moments.1253.t: "[scheme.GetNameNoTooltip]: Thất Bại"
  scheme_critical_moments.1253.desc: "Ta xông vào phòng, nắm chặt tay đầy bực bội — kẻ [target.Custom('InsultNoun')] [target.GetTitledFirstName] đơn giản từ chối lý lẽ. Ta đã tranh luận, bàn cãi, #EMP tác động#! tới vòng tròn thân cận nhất của [target.GetHerHis]?!\n\nLấy lý do #EMP các khoản đầu tư cấp bách hơn#! là ưu tiên hiện tại của [target.GetHerHis], thay vì đóng góp cho dự án #EMP tráng lệ#! của Ta. Ta kỳ vọng nhiều hơn từ [target.GetHerHim]. Đây chưa phải là lần cuối [target.GetSheHe] nghe về việc này..."
  scheme_critical_moments.1253.a: "Tsk, tsk..."

  insusceptible_to_leverage_contribution_modifier: "Không Dễ Bị Tác Động"
  insusceptible_to_leverage_contribution_modifier_desc: "Nhân vật này không mở ví cũng không mở lòng để đóng góp."
 
  unlock_coerce_tributary_scheme_tt: "Yêu cầu cấp độ #V 2#! của [aspect_of_trickery|E]"
 
  coerce_tributary_ongoing.0001.t: "[my_scheme.GetNameNoTooltip]: Đường Đóng"
  coerce_tributary_ongoing.0001.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))] của Ta, [steward.GetName], đứng trước mặt Ta với nụ cười rộng nhất.\n\n\"Ta đã... #EMP tìm thấy#! một văn bản cũ cho phép chúng ta ép [target.GetTitledFirstName] trả mức thuế cao hơn nếu họ muốn sử dụng đường của chúng ta. Tuy nhiên, Ta sẽ cần một ít kinh phí để cử một phái đoàn nhỏ đến [capital.GetName].\""
  coerce_tributary_ongoing.0001.a: "[target.GetSheHe|U] sẽ học được giá phải trả khi chống lại chúng ta."
  coerce_tributary_ongoing.0001.a.success: "[target.GetShortUIName] chấp nhận trả"
  coerce_tributary_ongoing.0001.a.failure: "[target.GetShortUIName] không chịu nhượng bộ"
  coerce_tributary_ongoing.0001.b: "Thời gian sẽ làm nhiệm vụ cho chúng ta."
  scheme_extra_tariffs: "Thuế Phụ"
  scheme_extra_tariffs_desc: "Chủ sở hữu kế hoạch này đã thuyết phục mục tiêu rằng nếu họ không tự nguyện trở thành chư hầu, sẽ có #EMP nhiều hơn#! phiền toái."
 
  coerce_tributary_ongoing.0010.t: "[my_scheme.GetName]: Đàm Phán Mạnh Mẽ"
  coerce_tributary_ongoing.0010.desc: "[marshal.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] của ta, cúi đầu thật thấp, mồ hôi vẫn nhỏ giọt từ trán sau khi huấn luyện [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" ngài bắt đầu, \"đã tốn quá nhiều lời lẽ để thuyết phục [target.GetTitledFirstName]. Cống phẩm không phải là thứ để cầu xin — mà là thứ để tước đoạt.\"\n\nNgài nắm chặt tay.\n\n\"Hãy cho phép ta dẫn một vài chiến binh của mình đến ngay trước cổng [capital.GetName].\""
  coerce_tributary_ongoing.0010.a: "\"Thực hiện ngay!\""
  coerce_tributary_ongoing.0010.a.success: "[target.GetShortUIName] bị thuyết phục"
  coerce_tributary_ongoing.0010.a.failure: "[target.GetShortUIName] rất phẫn nộ"
  coerce_tributary_ongoing.0010.b: "Không cần làm [target.GetTitledFirstNameNoTooltip] nổi giận."
  rival_tried_to_intimidate: "[TARGET_CHARACTER.GetShortUIName|U] đã cố gắng đe dọa [CHARACTER.GetShortUIName] để trở thành chư hầu."
  rival_tried_to_intimidate_corresponding: "[CHARACTER.GetShortUIName|U] bị [TARGET_CHARACTER.GetShortUIName] đe dọa để cố gắng biến [CHARACTER.GetHerHim] thành chư hầu."
  scheme_tribute_intimidation: "Đàm Phán Mạnh Mẽ"
  scheme_tribute_intimidation_desc: "Chủ sở hữu kế hoạch này đã làm rõ với mục tiêu rằng nếu họ không nhượng bộ sẽ gặp hậu quả nghiêm trọng hơn."
 
