  coerce_tributary: "Ép Chư Hầu"
  coerce_tributary_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] sớm sẽ biết ai là lãnh đạo #EMP thực sự#! của [SCHEME.GetTargetCharacter.GetHerHis]..."
  coerce_tributary_desc_general: "Kế hoạch $coerce_tributary$ [scheme|E] là một [political_scheme|E] nhằm thuyết phục [scheme_target|E] trở thành [tributary|E] của [scheme_owner|E].\n\nNếu Mục Tiêu đã có một [suzerain|E], người đó sẽ có quyền lựa chọn cách phản ứng và sẽ gieo [rivalry|E] giữa Chủ Sở Hữu và Chư Hầu."
