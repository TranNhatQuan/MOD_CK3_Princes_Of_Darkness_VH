l_english:

 #Disbelieve Mandala Scheme
  disbelieve_mandala: "Phá Vỡ Mandala"
  disbelieve_mandala_desc: "Đã đến lúc hạ bậc [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] trong hệ thống [mandala|E]. Hoặc hai bậc."
  disbelieve_mandala_desc_general: "Kế hoạch $disbelieve_mandala$ [scheme|E] là một [hostile_scheme|E] nhằm làm tổn hại uy tín của [scheme_target|E] như một Mandala thần thánh.\n\nNó có thể tuyển dụng [agents|E], là một [secret_scheme|E] dựa trên [intrigue|E], và nếu bị phát hiện sẽ làm gia tăng sự đối đầu giữa người khởi xướng và Mục Tiêu."
  DISBELIEVE_MANDALA_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] có thể trở thành [GetModifier( 'disbelieved_mandala_modifier' ).GetNameWithTooltip|L]"
  disbelieve_mandala_invalidated_title: "@scheme_icon! Kế Hoạch Phá Vỡ Mandala Kết Thúc"

  scheme_target_not_mandala: "[SCHEME.GetTargetCharacter.GetShortUIName|U] không có chính quyền [mandala|E]"
  scheme_owner_not_mandala: "Ngài không có chính quyền [mandala|E]"
  scheme_owner_not_house_head: "Ngài không còn là [house_head|E]"
  scheme_target_not_independent: "[SCHEME.GetTargetCharacter.GetShortUIName|U] không [independent|E]"
