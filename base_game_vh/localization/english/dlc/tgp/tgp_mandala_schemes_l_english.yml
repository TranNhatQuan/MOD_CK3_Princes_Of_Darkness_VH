  start_disbelieve_mandala_interaction: "$disbelieve_mandala$ #weak (Scheme)#!"
  disbelieve_mandala_action: "Phá Vỡ"
  scheme_interaction_tt_disbelieve_mandala: "Cố gắng phá vỡ niềm tin của [recipient.GetShortUINameNoTooltip], có thể làm tổn hại [recipient.GetHerHis] [legitimacy|E], [piety|E] và gây rối loạn trong số [recipient.GetHerHis] [subjects|E]"
