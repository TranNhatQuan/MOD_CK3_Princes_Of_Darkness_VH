  muism_religion_adherent_plural: "Muist"
  muism_religion_desc: "Một tôn giáo dân gian Hàn Quốc nơi các thầy shaman thực hiện nghi lễ Gut để chữa bệnh, bói toán và thiết lập sự cân bằng; mang tính địa phương, truyền miệng, và không có hệ thống phân cấp."
