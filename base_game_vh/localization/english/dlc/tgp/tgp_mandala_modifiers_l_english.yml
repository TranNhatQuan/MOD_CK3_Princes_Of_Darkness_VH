 #Character/County Modifiers
  mandala_capital_sacked_modifier: "Kinh Thành Mandala Bị Cướp"
  mandala_capital_sacked_modifier_desc: "Kinh Thành [mandala|E] này gần đây đã bị phá hoại bởi một vị Vua Mandala khác."
  mandala_capital_restored_modifier: "Kinh Thành Mandala Được Phục Hồi"
  mandala_capital_restored_modifier_desc: "Kinh Thành [mandala|E] này gần đây đã được phục hồi lại vẻ uy nghiêm ban đầu theo cách đáng kinh ngạc."

  budding_divinity_modifier: "Thần Tính Nảy Nở"
  budding_divinity_modifier_desc: "Nhân vật này là một phần của [house|E] [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L] đang chớm nở."
  budding_deity_modifier: "Thần Tính Hướng Tới"
  budding_deity_modifier_desc: "Nhân vật này đang tích lũy một lượng huyền thoại khiêm tốn chứng thực rằng họ là [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L]."
  budding_godhood_modifier: "Tín Ngưỡng Cao Quý"
  budding_godhood_modifier_desc: "Có tin đồn rằng nhân vật này thực sự là [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]"

  disbelieved_mandala_modifier: "Mandala Bị Nghi Ngờ"
  disbelieved_mandala_modifier_desc: "Nhân vật này bị mất lòng tin, khiến thần dân và tín đồ nghi ngờ tính thần thánh của họ."

  betrayed_tributary_modifier: "Chư Hầu Phản Bội"
  betrayed_tributary_modifier_desc: "Nhân vật này đứng nhìn khi chư hầu dự kiến của họ bị tấn công bởi cựu chủ nhân của chư hầu đó."

  recently_tarnished_mandala_modifier: "Mandala Nhiễm Bụi"
  recently_tarnished_mandala_modifier_desc: "Nhân vật này gần đây đã thua trong một cuộc chiến áp bức, làm giảm uy danh của họ."

  mandala_broke_truce_modifier: "Mandala Phá Hiệp Ước"
  mandala_broke_truce_modifier_desc: "Nhân vật này gần đây đã phá hiệp ước với một chư hầu được trả tự do."

  tgp_sea_legacy_heir_modifier: "Hậu Duệ Được Ban Phước"
  tgp_sea_legacy_heir_modifier_desc: "Nhân vật này xuất thân từ dòng dõi các vị vua thần thánh và được tôn trọng hơn các vua thường."
  mandala_rise_from_the_ashes_modifier: "Hồi Sinh Từ Tro Tàn"
  mandala_rise_from_the_ashes_modifier_desc: "Vị vua này gần đây đã nâng cao uy danh bằng cách phục hồi Đền Thờ Kinh Thành đã bị phá hủy."

