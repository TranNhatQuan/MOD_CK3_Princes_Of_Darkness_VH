l_english:

# Flight of the Tai, Mass migration main event
  tgp_tai_migration_event.1000.t:  "Cuộc Thiên Di của người Tai"
  tgp_tai_migration_event.1000.desc: "Trong buổi họp triều đình hôm nay, ta được tin về cuộc di cư lớn của dân định cư người Thái. [migration_leader.GetName], vị trưởng lão đại diện cho cộng đồng của họ, đang đứng trước mặt ta, cung kính trình bày sự tình.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], chúng thần tìm kiếm sự dẫn dắt và một mái nhà mới sau khi rời bỏ vị thế thần dân cũ của [migration_origin_holder.GetName]. Thần đại diện cho hàng ngàn gia tộc đang mong mỏi một nơi nương tựa. Xin ngài hãy che chở và ban cho chúng thần mục đích, để chúng thần trở thành những bầy tôi hữu dụng, xứng đáng với sự khoan dung của ngài.\"\n\nSố phận của họ giờ đây nằm trong quyết định của ta."
  tgp_tai_migration_event.1000.a:  "Ta tiếp nhận các ngươi — không phải với tư cách khách lạ, mà là thần dân của ta."
  tgp_tai_migration_event.1000.b: "Chỉ những kẻ có tài năng trong số các ngươi mới được phép cư ngụ tại [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta."
  tgp_tai_migration_event.1000.c:  "Người đông tất sinh loạn; hãy tìm nơi khác mà cầu xin."
  tgp_tai_migration_event_1000.c_shooed_immigrants_tt:  "Những kẻ di cư có thể sẽ tìm đến một lãnh chúa lân cận khác để xin nương náu trong thời gian tới."
  tgp_tai_migration_skilled_development_county_modifier:  "Dòng Người Thợ Lành Nghề"
  tgp_tai_migration_migration_happened_county_modifier:  "Dân Di cư Tai"
  tgp_tai_migration_migration_happened_character_modifier:  "Tiếp Nhận Dân Di cư Đông Đảo"
  tgp_tai_migration_migration_rejected_character_modifier:  "Khước Từ Dân Di cư"

# Lone skilled Tai character offers services
  tgp_tai_migration_event.2000.t:  "Một Nhân Tài Người Tai"
  tgp_tai_migration_event.2000.desc: "Một [migrant_skilled_character.GetWomanMan] lành nghề, tự nhận là đến từ vùng đất [migrant_skilled_character.GetCulture.GetNameNoTooltip], đứng trước mặt ta như một người cầu việc đầy hiểu biết. Cách ứng xử của [migrant_skilled_character.GetHerHis|U] dường như phản chiếu những tin tức gần đây về cuộc tháo chạy của đồng bào ngài ấy.\n\n\""
  tgp_tai_migration_event.2000.wet_nurse.desc:  "“Muôn tâu bệ hạ, thần là [migrant_skilled_character.GetName], một người chăm sóc dày dạn kinh nghiệm, sẵn sàng phụng sự. Thân thể khỏe mạnh, am hiểu nhu cầu của trẻ nhỏ. Xin cho phép thần góp phần giúp huyết mạch của ngài hưng thịnh.”"
  tgp_tai_migration_event.2000.champion.desc:  "“Muôn tâu minh chủ, tại quê nhà thần được biết đến với danh [migrant_skilled_character.GetName], một chiến binh thề trung và từng thắng nhiều giải đấu. Tay kiếm của thần vững vàng, lòng trung không thể nghi ngờ. Xin cho thần được làm dũng sĩ của ngài.”"
  tgp_tai_migration_event.2000.travel_leader.desc:  "“Muôn tâu [ROOT.Char.GetTitleAsNameNoTooltip], thần là [migrant_skilled_character.GetName], từng vượt sa mạc, lấy sao trời làm bản đồ, lấy gió làm đồng minh. Dưới sự dẫn dắt của thần, không đoàn lữ hành nào lạc lối, không hành trình nào là gian nan.”"
  tgp_tai_migration_event.2000.master_of_hunt.desc:  "“Sinh ra để săn đuổi, tôi luyện nơi hoang dã, thần thấu rõ dấu vết của muông thú và sự tĩnh lặng của rừng sâu. Dấu chân thú dưới mắt thần không thể che giấu. Ý ngài thế nào, thưa [ROOT.Char.GetTitleAsNameNoTooltip]?”"
  tgp_tai_migration_event.2000.court_physician.desc: "\"Với những bài thuốc từ cổ thư và sự khéo léo khi hành nghề trong những tình huống cấp bách, thần chính là [migrant_skilled_character.GetWomanMan] duy nhất mà ngài cần để an dưỡng thánh thể, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Họ gọi thần là [migrant_skilled_character.GetName].\""
  tgp_tai_migration_event.2000.antiquarian.desc:  "“Đôi mắt này từng chứng kiến huyền thoại, đôi tay này từng chạm đến các đế quốc cổ xưa. Xin cho thần được phụng sự, để trí tuệ của tiền nhân được truyền đến triều đình của ngài.”"
  tgp_tai_migration_event.2000.court_tutor.desc:  "“Thần từng dìu dắt nhiều chiến binh và bậc trị quốc, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Hậu duệ của ngài cũng sẽ đạt tới vinh quang dưới sự chỉ dẫn của thần, nếu ngài cho phép.”"
  tgp_tai_migration_event.2000.end.desc: "\n\n[migrant_skilled_character.GetSheHe|U] có vẻ đang tuyệt vọng tìm chốn dung thân, có lẽ vì những lý do đã đưa ngài ấy đến đây, nhưng rõ ràng là ngài ấy rất am tường nghề nghiệp của mình. Liệu ta có nên tận dụng tài năng của [migrant_skilled_character.GetHerHis]?"
  tgp_tai_migration_event.2000.a:  "Có lẽ ta cần đến tài năng của ngươi."
  tgp_tai_migration_event.2000.b:  "Chưa cần thiết, nhưng ngươi có thể ở lại."
  tgp_tai_migration_event.2000.b.success:  "[migrant_skilled_character.GetNameNoTooltip] gia nhập triều đình của bạn"
  tgp_tai_migration_event.2000.b.failure:  "[migrant_skilled_character.GetNameNoTooltip] từ chối đề nghị"
  tgp_tai_migration_event.2000.c:  "Ta buộc phải từ chối."

# Noble Tai character and his family are asking for a spare county
  tgp_tai_migration_event.3000.t:  "Lời Thỉnh Cầu của Một Gia Trưởng"
  tgp_tai_migration_event.3000.desc:  "Một ngoại nhân đường hoàng bước vào đại điện của ta với vẻ tự tin đáng chú ý, mang theo một đề nghị về quản trị.\n\nSau lời chào hỏi chân thành hiếm thấy, khác hẳn vẻ quê mùa thường gặp, cùng câu chuyện chi tiết về hành trình khốn khó của gia quyến đến lãnh thổ của ta, hắn đi đến một kết luận táo bạo.\n\n“...lũ cướp bóc và giặc giã, thần xin thưa vậy, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Những gì thần còn lại sau khi bị cướp sạch là tài năng đã được chứng minh, con mắt sắc bén để cai quản, lòng trung thành, và một gia đình đang cần sự che chở của ngài. Thần cùng huyết mạch của mình nguyện làm tôi tớ của ngài cho đến khi bị xem là không xứng đáng.”"
  tgp_tai_migration_event.3000.a:  "Nguyện vọng của ngươi được chấp thuận, miễn là trung thành."
  tgp_tai_migration_event.3000.b:  "Trao đổi này không công bằng."

# A family of lowborn peasant characters offer services
  tgp_tai_migration_event.4000.t:  "Một Gia Đình Người Tai"
  tgp_tai_migration_event.4000.desc:  "Thị vệ dẫn vào đại điện một gia đình ngoại tộc nghèo khổ từ phương Bắc.\n\nSau hồi lâu van xin, gia trưởng nhìn thẳng vào ta và dâng hiến tất cả những gì hắn không có, chỉ để được quét dọn cung điện đổi lấy một mái che dưới đôi cánh quyền uy của ta. Theo lời hắn, dường như rất nhiều người cùng tộc đang đổ về lãnh thổ của ta, mong tìm kiếm một vị bảo hộ mới."
  tgp_tai_migration_event.4000.a:  "Ta sẽ che chở các ngươi trong thời loạn lạc này."
  tgp_tai_migration_event.4000.b:  "Triều đình ta không cần đến gia đình các ngươi."
