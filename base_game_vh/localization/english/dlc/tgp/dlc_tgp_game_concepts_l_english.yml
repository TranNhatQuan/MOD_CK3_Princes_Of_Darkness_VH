l_english: 
 # Meritocratic
  game_concept_meritocratic: "Chính Quyền Thông Thái"
  game_concept_meritocratic_desc: "$game_concept_meritocratic$ là [government_form|E] [government_bureaucratic_type|E] tương tự như [celestial|E], trong đó [liege|E] bổ nhiệm các nhân vật làm [governors|E], gồm hai loại: Dân sự và Quân sự.\n\nCác nhân vật có quyền truy cập [influence|E], [noble_families|E], và [family_estates|E].\n\nCác [rulers|E] độc lập có [legitimacy|E], trong khi các [vassals|E] tập trung vào việc đạt được [merit|E]."
  game_concept_meritocratic_i: "@government_type_meritocratic!"
 
 # Meritocratic Bureaucracy
  game_concept_meritocratic_bureaucracy: "Bộ Máy Thông Thái"
  game_concept_meritocratic_bureaucracy_desc: "$game_concept_meritocratic_bureaucracy$ thể hiện mức độ tập trung quyền lực [meritocratic|E] của [realm_possessive|E] và quyền lực chung mà [ruler|E] nắm trên các [vassals|E] của mình.\n\nChỉ [top_liege|E] mới có thể thay đổi $game_concept_meritocratic_bureaucracy$. Các $game_concept_vassals$ theo chế độ meritocratic sử dụng cùng mức với $game_concept_liege$ của họ.\n\nCó bốn mức độ của $game_concept_meritocratic_bureaucracy$:\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_0$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_1$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_2$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_3$\n\nTăng $game_concept_meritocratic_bureaucracy$ tốn một lượng [prestige|E] tùy thuộc vào [realm_size|E] và [learning_skill|E] của người cai trị."

 # Steppe Admin
  game_concept_steppe_admin: "Khanate Thông Thái"
  game_concept_steppe_admin_desc: "$game_concept_steppe_admin$ là [government_form|E] [government_bureaucratic_type|E] tương tự như [celestial|E] và [meritocratic|E], nhưng bắt nguồn từ [nomadic|E] $game_concept_government_form$. [liege|E] bổ nhiệm các nhân vật làm [governors|E], gồm hai loại: Dân sự và Quân sự. Họ vẫn duy trì các [tributaries|E], thực thi [obedience|E], và có mức [dread|E] tối đa cao hơn.\n\nCác nhân vật có quyền truy cập [influence|E], [noble_families|E], và [family_estates|E].\n\nCác [rulers|E] độc lập có [legitimacy|E], trong khi các [vassals|E] tập trung vào việc đạt được [merit|E]."
  game_concept_steppe_admin_i: "@government_type_steppe_admin!"

  game_concept_ceremonial_claimant_faction: "$ceremonial_claimant_faction$"
  game_concept_ceremonial_claimant_factions: "Các Phe Người Yêu Sách Nghi Lễ"
  game_concept_ceremonial_claimant_faction_desc: "$game_concept_claimant_faction$ tìm cách đưa một [claimant|E] cụ thể lên làm [ceremonial_liege|E]. Nếu thành công, [ceremonial_liege|E] hiện tại sẽ phải nhường [title|E] cho Người Yêu Sách. Tất cả thành viên [faction|E] sẽ nhận được một [hook|E] trên Người Yêu Sách."

  game_concept_imperial_policy_faction: "$imperial_policy_faction$"
  game_concept_faction_imperial_policy: "Chính Sách Hoàng Gia"
  game_concept_imperial_policy_factions: "Các Phe Chính Sách Hoàng Gia"
  game_concept_imperial_policy_faction_desc: "$game_concept_imperial_policy_faction$ tìm cách thay đổi [imperial_policy|E] của [realm|E], áp dụng một [law|E] mới do lãnh đạo phe chọn."
