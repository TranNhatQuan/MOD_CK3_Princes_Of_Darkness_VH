l_english:
 ##################################################
 # CHINA CAREER EVENTS
 ##################################################
  tgp_china_career.0001.t: "Phụng Sự Thiên Tử"
  tgp_china_career.0001.desc: "Bộ máy quan liêu của [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip] rộng lớn và phức tạp, nhưng vận hành trơn tru. Mỗi công dân có bổn phận phục vụ đất nước hết khả năng của mình.\n\n"
  tgp_china_career.0001.minister_desc: "Là [new_ruler.GetTitleAsNameNoTooltip], mọi ánh mắt đều dõi theo Ta. Chỉ một bước sai lầm cũng đủ khiến sự nghiệp của Ta sụp đổ.\n\nTa sẽ chứng tỏ với [emperor.GetTitleAsNameNoTooltip] rằng Ta xứng đáng với lòng tin của [emperor.GetHerHis]."
  tgp_china_career.0001.landed_desc: "Là [new_ruler.GetTitleAsNameNoTooltip|l] của [new_ruler.GetPrimaryTitle.GetNameNoTier], Ta có nhiều trách nhiệm phải thực hiện và nghĩa vụ phải hoàn thành. Danh tiếng [ruler_family.GetName] sẽ vang danh khắp đất nước.\n\nCó lẽ Ta cũng đủ khả năng một ngày nào đó ngồi vào chính quyền và trở thành một quan chức cấp cao?"
  tgp_china_career.0001.unlanded_desc: "Là một thành viên của gia tộc [ruler_family.GetName], Ta sẽ phải nỗ lực để tạo dựng tên tuổi. Trước hết, Ta phải vượt qua [examinations|E] và đạt được [merit|E]. Chỉ khi đó Ta mới có thể được bổ nhiệm làm quan."
  tgp_china_career.0001.a: "Định mệnh không chờ đợi. Hãy bắt tay vào làm ngay!"
  tgp_china_career.0001.b: "Mọi người sẽ biết #EMP ta#! là ai."
  tgp_merit_boost_modifier: "Tập Trung Vào Thành Tích"
  tgp_merit_boost_modifier_desc: "Nhân vật này tập trung vào thành tích và nghiên cứu Đạo."
  tgp_influence_boost_modifier: "Tập Trung Vào Ảnh Hưởng"
  tgp_influence_boost_modifier_desc: "Nhân vật này tập trung vào gây ảnh hưởng và thúc đẩy mục tiêu của mình."
 
  tgp_china_career.0010.t: "Con Đường Công Đức"
  tgp_china_career.0010.first_rank_desc: "Ta đã đạt đủ công đức để được phong hạng [merit_char.Custom('GetMeritRank')], đánh dấu bước đầu trên con đường sự nghiệp dài và hứa hẹn. Có lẽ cuối cùng Ta sẽ được bổ nhiệm làm quan — cai trị vùng đất và mang lại thịnh vượng cho quốc gia.\n\nMột cơ hội để quyết định nghề nghiệp mong muốn? Ta sẽ leo lên nấc thang chính trị của quan lại hay đảm nhận vai trò chỉ huy, dẫn dắt quân đội và mang lại hòa bình?"
  tgp_china_career.0010.higher_rank_desc: "Sự nỗ lực và cần mẫn của Ta đã được đền đáp. Ta được phong hạng công đức [merit_char.Custom('GetMeritRank')]."
  tgp_china_career.0010.higher_rank_unspecific: "\n\n[ROOT.Char.Custom('GetRandomAnnalsPassage')] đã trở nên quen thuộc như tên mẹ Ta. Nhưng vẫn còn rất nhiều việc phải làm."
  tgp_china_career.0010.highest_rank: "\n\nNhiều cuộn sách đã được nghiên cứu, nhiều đêm thao thức. Chặng đường này đã kết thúc, nhưng con đường vẫn còn dài."
  tgp_china_career.0010.duchy_desc: "\n\nTa có thể bắt đầu sự nghiệp nghiêm túc — rời bỏ những vị trí thấp và mở ra cánh cửa đến các chức vụ quan trọng hơn. Tất nhiên, khi cơ hội xuất hiện."
  tgp_china_career.0010.kingdom_desc: "\n\nTa giờ đã đủ công đức để được bổ nhiệm quản lý những tỉnh lớn hơn, quan trọng hơn."
  tgp_china_career.0010.empire_desc: "\n\nÍt trở ngại còn đứng trước Ta. Ta đủ công đức để trở thành một quan viên cấp cao. Với nỗ lực, có lẽ Ta có thể chiếm vị trí thượng thư tối cao?"
  tgp_higher_ambitions_modifier: "Tham Vọng Lớn Hơn"
  tgp_higher_ambitions_modifier_desc: "Nhân vật này quyết định tập trung mọi nỗ lực vào việc leo thang bậc công đức."
  tgp_china_career.0010.aa: "Ta biết Ta có thể làm tốt hơn."
  tgp_china_career.0010.a: "Một cột mốc quan trọng trong sự nghiệp."
  tgp_china_career.0010.b1: "Một vị trí dân sự sẽ phù hợp hơn với Ta."
  tgp_china_career.0010.b2: "Ta là quan viên dân sự, và Ta sẽ luôn là quan viên dân sự."
  tgp_china_career.0010.c1: "Ta sẽ tìm vinh quang trên chiến trường!"
  tgp_china_career.0010.c2: "Chỉ huy quân đội trong chiến trận là bản năng thứ hai với Ta."
  keep_civilian_career_desc: "Ngài tiếp tục theo đuổi sự nghiệp Dân sự — vẫn đủ điều kiện cho [GetPlayer.Custom('GetProvincePluralConcept')] Dân sự và [GetLaw('celestial_appointment_succession_law').GetName]"
  keep_military_career_desc: "Ngài tiếp tục theo đuổi sự nghiệp Quân sự — vẫn đủ điều kiện cho [GetPlayer.Custom('GetProvincePluralConcept')] Quân sự và [GetLaw('celestial_military_appointment_succession_law').GetName]"

  merit_rank_none_gloss: "không"
  merit_rank_9_gloss: "[Glossary('lower-lower','MERIT_LOWER_LOWER_GLOSS')]"
  merit_rank_8_gloss: "[Glossary('lower-middle','MERIT_LOWER_MIDDLE_GLOSS')]"
  merit_rank_7_gloss: "[Glossary('lower-upper','MERIT_LOWER_UPPER_GLOSS')]"
  merit_rank_6_gloss: "[Glossary('middle-lower','MERIT_MIDDLE_LOWER_GLOSS')]"
  merit_rank_5_gloss: "[Glossary('middle-middle','MERIT_MIDDLE_MIDDLE_GLOSS')]"
  merit_rank_4_gloss: "[Glossary('middle-upper','MERIT_MIDDLE_UPPER_GLOSS')]"
  merit_rank_3_gloss: "[Glossary('upper-lower','MERIT_UPPER_LOWER_GLOSS')]"
  merit_rank_2_gloss: "[Glossary('upper-middle','MERIT_UPPER_MIDDLE_GLOSS')]"
  merit_rank_1_gloss: "[Glossary('upper-upper','MERIT_UPPER_UPPER_GLOSS')]"

  tgp_china_career.0030.t: "Sự Ra Đi của Một Hiền Giả"
  tgp_china_career.0030.desc: "Bậc trưởng thượng của ta, [deceased_elder.GetFirstName], đã rời khỏi cõi đời này: Ta được biết [deceased_elder.GetSheHe] [deceased_elder.GetDeathReason]. Ngay lúc này, ta bắt đầu cảm nhận sự thiếu vắng [deceased_elder.GetHerHis]; một câu hỏi chực hiện trên đầu lưỡi đã bị dừng lại nửa hơi thở khi nhận ra không còn ai để trả lời.\n\nThế nhưng những cảm xúc thoáng qua ấy rồi cũng phải nhường chỗ cho gánh nặng đời thường và những mối bận tâm thiết thực hơn; việc an táng và nghi lễ tang ma, cũng như câu hỏi ai sẽ kế thừa tấm gương [deceased_elder.Custom('MistressMasterPossessive')|U] và tiếp tục sứ mệnh của [deceased_elder.GetHerHis]."
  tgp_china_career.0030.a: "Hành trình của [deceased_elder.GetFirstNamePossessiveNoTooltip] đã kết thúc, nhưng của ta phải tiếp tục."
  tgp_china_career.0030.a.tt: "Ngươi sẽ tìm kiếm một [elder|U] mới trong số những bậc vĩ nhân và có ảnh hưởng."
  tgp_china_career.0030.b: "Gửi lời chia buồn đến tộc quyến của [deceased_elder.GetHerHis], cùng một vật biểu trưng lòng kính trọng của ta."
  tgp_china_career.0030.c: "[superior_fellow_disciple.GetFirstNameNoTooltip] là người xứng đáng nhất trong chúng ta để tiếp tục công việc của [deceased_elder.Custom('MistressMasterPossessive')|U]."
  tgp_china_career.0030.d: "Ta sẽ kế thừa ý nguyện của [deceased_elder.GetHerHis] và tiếp tục con đường [deceased_elder.GetHerHis] đã theo đuổi."
