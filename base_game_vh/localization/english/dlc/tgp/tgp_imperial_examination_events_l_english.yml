  imperial_examination.5200.t: "Biểu Diễn Bắn Cung"
  imperial_examination.5200.desc: "[host.GetTitleAsNameNoTooltip] nhìn tôi với ánh mắt đánh giá. Với một cử chỉ bao quát về phía chúng tôi, những thí sinh, [host.GetSheHe] tuyên bố: \"Một tư thế không đúng đắn tố cáo sự thiếu liêm chính. Một kỹ thuật kém cỏi để lộ một ý chí dễ bị tha hóa.\"\n\n[host.GetSheHe|U] đan các ngón tay [host.GetHerHis] lại và nhìn ra khoảng sân. \"Từ đường bay của mũi tên, ta sẽ đánh giá khả năng chinh phục thành trì, bảo vệ biên cương của ngươi. Đây là cơ hội cuối cùng để ngươi gây ấn tượng với ta.\"\n\n[host.GetSheHe|U] quay người và ra hiệu cho tôi bước tới."
  imperial_examination.5200.a: "Ta sẽ dốc hết sức mình!"
  imperial_examination.5200.b: "Tốt hơn là không liều lĩnh."

  imperial_examination.5300.t: "Bài Luận Hoàng Gia"
  imperial_examination.5300.desc: "[host.GetTitleAsNameNoTooltip] nhìn tôi với ánh mắt đánh giá. Với một cử chỉ bao quát về phía chúng tôi, những thí sinh, [host.GetSheHe] tuyên bố: \"Học vấn kinh điển kém cỏi tố cáo sự thiếu hụt đạo đức. Một bài bình luận yếu kém bộc lộ một nghị lực dễ dàng từ bỏ.\"\n\n[host.GetSheHe|U] đan các ngón tay [host.GetHerHis] lại và nhìn ra khoảng sân. \"Từ những nét bút của ngươi, ta sẽ đánh giá khả năng cai trị dân chúng, duy trì truyền thống của ta. Đây là cơ hội cuối cùng để ngươi gây ấn tượng với ta.\"\n\n[host.GetSheHe|U] quay người và ra hiệu cho tôi bước tới."
  imperial_examination.5300.a: "Ta sẽ trình bày thấu đáo."
  imperial_examination.5300.b: "$imperial_examination.5200.b$"

  imperial_examination.5400.t: "$imperial_examination.5300.t$"
  imperial_examination.5400.desc: "$imperial_examination.5300.desc$"
  imperial_examination.5400.a: "$imperial_examination.5300.a$"
  imperial_examination.5400.b: "$imperial_examination.5200.b$"

  imperial_examination.5500.t.success: "Thành công!"
  imperial_examination.5500.t.great_success: "Thành công Tuyệt Vời!"
  imperial_examination.5500.t.critical_success: "Thành công Xuất Sắc!"
  imperial_examination.5500.t.failure: "Thất bại!"
  imperial_examination.5500.desc.success_martial: "Với một cú —#EMP THONK#!— mũi tên cắm chắc vào mục tiêu. Làn sóng tán thưởng vang lên từ người xem. Rõ ràng Ta đã gây ấn tượng."
  imperial_examination.5500.desc.success_learning: "Những điều học được từ thầy hiện rõ trong tâm trí, các đoạn văn bản dễ dàng nhớ lại."
  imperial_examination.5500.desc.safe_martial: "Mũi tên trúng mép mục tiêu. Vết trúng nông khiến đuôi mũi tên hơi rũ xuống."
  imperial_examination.5500.desc.safe_learning: "Ta nhắc lại những câu danh ngôn quen thuộc, nhưng không bàn sâu hay phân tích thêm."
  imperial_examination.5500.desc.failed_martial: "Ngay trước khi lông mũi tên chạm bảo vệ cánh tay, Ta biết nó sẽ trượt, và nhìn nó chạm góc mục tiêu rồi biến mất."
  imperial_examination.5500.desc.failed_classics: "Ta khó nhớ bài học từ thầy. Những đoạn văn quan trọng dường như bị xóa khỏi trí nhớ."
  imperial_examination.5500.desc.hegemon_positive: "\n\n[host.GetTitleAsNameNoTooltip] nhìn Ta, [host.Custom('quirk_pos_pp')]. "Rất tốt.""
  imperial_examination.5500.desc.hegemon_negative: "\n\n[host.GetTitleAsNameNoTooltip] nhìn Ta, [host.Custom('quirk_neg_pp')]. "Ngươi giải tán.""
  imperial_examination.5500.a: "Ta sẽ luôn ghi nhớ khoảnh khắc này."

 #Conclusion event
  imperial_examination.7000.t: "Công Bố Kết Quả"
  imperial_examination.7000.desc.emperor: "Trống học viện vang lên lần nữa khi công bố kết quả. Các thí sinh tập trung trước bảng, yên lặng trong sự chờ đợi và tôn kính, mong đã bước lên bậc thang quan cao.\n\nCác thí sinh Cung điện được đặt trước toàn thể đồng môn làm ví dụ và khen thưởng, trong khi học sinh thấp hơn cúi đầu theo lượt."
  imperial_examination.7000.desc.cheater: "Trống học viện khiến Ta giật mình, đứng ngoài sân thi. Ta nhìn đồng môn lao tới bảng kết quả, hy vọng vào điểm thi.\n\nBên kia, Ta thoáng thấy các thí sinh Cung điện, đứng trước sân cung điện hoàng gia. Trời quang, thiên hạ đang chứng kiến."
  imperial_examination.7000.desc.entrant: "Trống học viện báo hiệu kỳ thi đã kết thúc. Tôi vội vã đến chỗ niêm yết bảng vàng để thấy rằng mình nhận được điểm số [ROOT.Char.Custom('PlayerGetExamScoreAdjective')] là #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#!, xếp tôi ở vị trí [ROOT.Char.MakeScope.Var('your_exam_position').GetValue|O] trên bảng danh sách.\n\nTrong khi đó, các thí sinh có thứ hạng cao nhất từ kỳ thi Điện thí đang đứng ở phía trước sân hoàng cung. Tôi nhìn lên [first_place_entrant.GetFirstName], người đã đứng đầu trong số họ, trở thành người được [host.GetTitleAsNamePossessiveNoTooltip] yêu thích."
  imperial_examination.7000.desc.palace_entrant: "Trống học viện báo hiệu kết thúc kỳ thi. Ta đứng cùng đồng môn từ Cung điện, trước sân cung điện hoàng gia, nhìn xuống các thí sinh cấp dưới tập trung dưới bảng công bố.\n\nKhi thí sinh đô thị nhận ra chúng Ta, họ cúi đầu tôn kính. Ta cảm nhận vinh quang và quyền lực đang chờ phía trước."
  imperial_examination.7000.desc.fallback: "Nhờ vinh quang của [host.GetTitleAsNameNoTooltip] nhân từ, một kỳ [GetActivityType('activity_imperial_examination').GetName] nữa đã hoàn tất. Cùng với đó, nhiều học giả đã bước lên bậc thang quan cao."
  imperial_examination.7000.a: "Dưới thiên hạ, mọi việc đều ổn."
  imperial_examination.7000.a.cheater: "Nhìn mọi người ngoại trừ Ta."

  imperial_examination.7001.t: "$imperial_examination.7000.t$"
  imperial_examination.7001.desc: "Tiếng chuông ngân lên, báo hiệu rằng [GetActivityType('activity_local_examination').GetName] đã kết thúc và kết quả được công bố."
  imperial_examination.7001.desc.host: "\n\nNhư vậy, một lứa học giả mới đã bước bước đi đầu tiên, nhưng quan trọng nhất, trên bậc thang dẫn tới quan cao. Ta đã chuẩn bị sân khấu cho sự nghiệp của họ, phần còn lại là tùy thuộc vào họ."
  imperial_examination.7001.desc.cheater: "\n\nTa không có tên trong danh sách học giả, vì các giám khảo đã loại bỏ tên Ta khỏi cuộc thi."
  imperial_examination.7001.desc.entrant.first: "\n\nTên Ta đứng ở vị trí cao nhất trong danh sách, và đồng môn ngoảnh đầu nhìn Ta với ánh mắt ghen tị. Quyết định đã rõ: Ta là học giả xuất sắc nhất của huyện, và con đường tới [GetActivityType('activity_imperial_examination').GetName] đã mở ra cho Ta."
  imperial_examination.7001.desc.entrant: "\n\nDù [first_place_entrant.GetFirstName] đã chiếm vị trí cao nhất của Ta, Ta vẫn vượt qua Kỳ Thi Tỉnh với số điểm [ROOT.Char.Custom('PlayerGetExamScoreAdjective')] #V [ROOT.Char.MakeScope.Var('imperial_examination_score').GetValue|0]#!."
  imperial_examination.7001.desc.fallback: "\n\nNhư vậy, một lứa học giả mới đã bước bước đi đầu tiên, nhưng quan trọng nhất, trên bậc thang dẫn tới quan cao."
  imperial_examination.7001.a: "Đây là một ngày đáng nhớ."

  imperial_examination.7003.desc: "Tiếng chuông vang lên, báo hiệu kỳ [GetActivityType('activity_imperial_examination').GetName] đã kết thúc và kết quả đã được bảng treo danh tính."

 # CLOSE FAMILY NOTIFICATION EVENTS

 # Intro event
  imperial_examination.7100.t: "Gia đình Tham Dự Kỳ Thi"
  imperial_examination.7100.desc: "Nhờ vinh quang của [host.GetTitleAsNameNoTooltip] nhân từ, chúng ta có một lứa quan tương lai mới sau Kỳ Thi Trung Ương tại [location.GetName]."
  imperial_examination.7100.desc.intro_nr_of_relatives_singular: "Chỉ có [ROOT.Char.Custom2('RelationToMeShort', house_member)] [house_member.GetTitledFirstName] của tôi tham gia với tư cách thí sinh."
  imperial_examination.7100.desc.intro_nr_of_relatives: "\n\n[ROOT.Char.MakeScope.Var('num_exam_family_entrants').GetValue] thành viên của gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] tham dự kỳ thi."
  imperial_examination.7100.desc.all_failed: "[ROOT.Char.Custom('ActivityGetFaileesBothAll')] trong số họ trượt."
  imperial_examination.7100.desc.all_passed_provincial: "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')] trong số họ đã làm rạng danh gia tộc và vượt qua kỳ thi của họ."
  imperial_examination.7100.desc.all_passed_metropolitan: "[ROOT.Char.Custom('ActivityGetSuccessfulBothAll')] trong số họ đã làm rạng danh gia tộc và vượt qua kỳ thi Cấp tỉnh."
  imperial_examination.7100.desc.all_passed: "[ROOT.Char.Custom('ActivityGetFaileesBothAll')] trong số họ đã làm rạng danh gia tộc chúng ta."
  imperial_examination.7100.desc.one_passed: "Chỉ một người trong số họ giữ được danh tiếng tốt của gia tộc."
  imperial_examination.7100.desc.win_lose_ratio: "[ROOT.Char.MakeScope.Var('num_exam_family_entrants_passed').GetValue] đỗ, trong khi [ROOT.Char.MakeScope.Var('num_exam_family_entrants_failed').GetValue] trượt."
  imperial_examination.7100.desc.won_palace: "Trong số này, [ROOT.Char.MakeScope.Var('num_exam_family_passed_palace').GetValue] bước vào Kỳ Thi Cung điện."
  imperial_examination.7100.desc.palace_entrant: "\n\n[house_member.GetTitledFirstName] đã vượt qua kỳ thi Cấp kinh đô với điểm số [activity.Custom('ActivityGetExamScoreAdjective')], mang về cho [house_member.GetHerHim] lời mời đáng mơ ước được tham dự kỳ thi Điện thí trước mặt [host.GetTitleAsNameNoTooltip] [host.GetHerselfHimself]! Trong sự kiện này, [house_member.GetSheHe] cũng đã mang lại niềm tự hào cho gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]."
  imperial_examination.7100.desc.metropolitan_entrant: "\n\n[house_member.GetTitledFirstName] vượt qua Kỳ Thi Đô thị với số điểm [activity.Custom('ActivityGetExamScoreAdjective')], nhưng không giành được một trong những vị trí quý giá tại Kỳ Thi Cung điện."
  imperial_examination.7100.desc.failed_entrant: "\n\n[house_member.GetTitledFirstName] trượt Kỳ Thi Đô thị."
  imperial_examination.7100.desc.cheater: "Chưa hết, [house_member.GetSheHe] còn bị phát hiện gian lận trong sự kiện."
  imperial_examination.7100.desc.got_elder: "Ít nhất [house_member.GetSheHe] gây ấn tượng với [elder.GetTitledFirstName], một giám khảo hoàng gia, người đã nhận [house_member.GetHerHim] làm [disciple|E]."
  imperial_examination.7100.desc.failed_fallback: "Nhiều năm học tập #EMP tốn kém#! đã bị bỏ phí chỉ trong một khoảnh khắc."
  imperial_examination.7100.a.singular: "Xin chúc mừng!"
  imperial_examination.7100.a.tt_first: "#weak Ngài chúc mừng thí sinh Cung điện thành công#!"
  imperial_examination.7100.a.plural: "Ta phải chúc mừng các thí sinh Cung điện."
  imperial_examination.7100.b.singular: "Ta từ chối chấp nhận trung bình."
  imperial_examination.7100.b.tt_first: "#weak Ngài nhắn với thí sinh đô thị thành công#!"
  imperial_examination.7100.b.plural: "Ta muốn nhắn tới các thí sinh cấp thấp."
  imperial_examination.7100.c: "Thất bại không được dung thứ trong nhà này!"
  imperial_examination.7100.c.tt_first: "#weak Ngài nhắn với thí sinh trượt#!"
  imperial_examination.7100.d: "Ta không có thời gian cho chuyện này."
  influence_family_effect: "Ảnh hưởng tới các thành viên gia đình sau:"

 #Metropolitan event
  imperial_examination.7050.t: "Các Thí Sinh Đô Thị"
  imperial_examination.7050.desc: "Dù tốt khi có gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] tham dự truyền thống uy nghi và tôn kính nhất của chúng ta, người ta vẫn trông đợi... một nỗ lực tập trung hơn.\n\n"
  imperial_examination.7050.a.singular: "[house_member.GetSheHe|U] #EMP phải#! tham dự Kỳ Thi Cung điện!"
  imperial_examination.7050.a.plural: "Ta mong #EMP tất cả mọi người#! hoàn thành Kỳ Thi Cung điện."
  imperial_examination.7050.a.tt_singular: "[house_member.GetShortUINameNoTooltip|U] sẽ tham dự [GetActivityType('activity_imperial_examination').GetNameNoTooltip] lần tới"
  demand_retake_exam_effect: "#weak Nhân vật này sẽ cố gắng tham dự [GetActivityType('activity_imperial_examination').GetNameNoTooltip] lần tới#!"
  imperial_examination.7050.b: "Tất nhiên, công trạng thuộc về Ta."
  imperial_examination.7050.c.singular: "Ta tin rằng [house_member.GetSheHe] đã cố gắng hết sức mình."
  imperial_examination.7050.c.plural: "Ta chắc họ đã cố hết sức."
 
 #Palace event
  imperial_examination.7055.t: "Gia Đình Được Vinh Danh Tại Kỳ Thi Cung Điện"
  imperial_examination.7055.desc: "Thật là một phước lành khi gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] có đại diện tại kỳ thi Điện thí. Dòng tộc của ta đã đứng trước [host.Custom('GetDaughterSon')] của Thiên tử [host.GetHerselfHimself], và chứng tỏ bản thân xứng đáng với sự tán dương của [host.GetHerHis].\n\nĐây chắc chắn là một dấu hiệu của thời kỳ thịnh vượng sắp tới."
  imperial_examination.7055.b: "Quả đúng như mong đợi từ một thành viên gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]"

 #Failee event
  imperial_examination.7060.t: "Gia Đình Mất Uy Tại Kỳ Thi Đô Thị"
