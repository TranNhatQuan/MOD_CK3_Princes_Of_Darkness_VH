  other_entrant_impressive_success: "Một tiếng xì xào tán thưởng vang lên từ đám đông khi [other_entrant.GetSheHe] cắm mũi tên của [other_entrant.GetHerHis] vững chãi vào mục tiêu."
  other_entrant_spinning_safe: "Mũi tên bay theo cung thấp, xoay tròn trong gió, nhưng vẫn trúng mép dưới của mục tiêu."
  other_entrant_embarrased_cough: "Mũi tên bay lệch quá xa, Ta không nghe thấy nó trúng mục tiêu. Ở đâu đó, ai đó ho nhẹ."
  other_entrant_piercing_success: "Mũi tên cắm sâu vào mục tiêu đến mức nhô ra phía sau."
  other_entrant_drooping_safe: "Mũi tên trúng mép mục tiêu. Vết trúng nông khiến đuôi mũi tên buồn bã rũ xuống."
  other_entrant_vanishing_arrow: "Mũi tên chạm vào góc mục tiêu rồi biến mất phía sau."

  imperial_examination.5160.t: "Biểu Diễn Thương Trượng"
  imperial_examination.5160.desc: "Trọng lượng của đồng phục mang lại cảm giác quen thuộc khi Ta xếp hàng cùng các thí sinh khác. Các mục tiêu rơm được đặt khắp sân trước Cung điện [ROOT.Char.GetCurrentLocation.GetName].\n\nĐến lượt Ta, ngay sau [other_entrant.GetTitledFirstName], người..."
  imperial_examination.5160.a: "Ta vào tư thế."
  imperial_examination.5160.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], Ngài thay Ta.""
  imperial_examination.5160.c: ""Giám khảo [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], hãy xem Ta!""
  imperial_examination.5160.d: ""[ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], Ngài biết khả năng hôn nhân của phụ huynh Ta chứ!""
  imperial_examination.5160.e: ""[ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], điều này có làm Ngài nhớ đến #EMP tầm với dài#! của gia đình Ta không?"  

  other_entrant_cutting_success: "chém bay đầu mục tiêu rơm [other_entrant.GetHerHis] với một cú uyển chuyển khiến giám khảo mỉm cười."
  other_entrant_practiced_safe: "xoay, đỡ, và đẩy mục tiêu rơm [other_entrant.GetHerHis] đi một cách thành thạo, dù hơi dễ đoán."
  other_entrant_stuck_fail: "phi tới mục tiêu rơm [other_entrant.GetHerHis], nhưng lại mắc kẹt vũ khí trong thân rơm."
  other_entrant_practiced_success: "di chuyển với sự thành thạo, gần như tự nhiên, khiến đám đông ghen tỵ."
  other_entrant_stumbling_fail: "vấp ngã, vũ khí [other_entrant.GetHerHis] rơi xuống đất. Ta thở phào nhẹ nhõm."

