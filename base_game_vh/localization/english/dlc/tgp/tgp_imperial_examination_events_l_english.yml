  horse_exam_hunter_success_first: "Ngài có lựa chọn này nhờ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait|E]"

  other_entrant_thundering_success: "phi vào sân, móng ngựa vang dội khắp cánh đồng. Dù tốc độ ngựa nhanh, [other_entrant.GetSheHe] vẫn ngồi vững trên lưng. Một cảnh tượng ấn tượng và đôi phần đáng sợ."
  other_entrant_practiced_ride: "phi với sự thành thạo trên toàn trường bắn, nhưng thiếu can đảm để kéo cung [other_entrant.GetHerHis], khiến màn trình diễn kém thuyết phục."
  other_entrant_spooked_horse: "vung gót làm ngựa hoảng, khiến nó đá tung ra. Một cảnh tượng thương hại, nhưng phần nào an ủi."
  other_entrant_swift_success: "phi nhanh qua đồng, bắn loạt mũi tên liên tiếp, động tác [other_entrant.GetHerHis] trôi chảy như nước."
  other_entrant_shortstop_fail: "phi ngang sân, nghiêng người đúng trên yên, nhưng không mũi nào [other_entrant.GetHerHis] trúng đích."

  imperial_examination.duel.riding.critical_success.tt: "Kỹ thuật của Ngài hoàn hảo"
  imperial_examination.duel.riding.great_success.tt: "Kỹ thuật của Ngài ấn tượng"
