  imperial_examination.5170.t: "Đánh Giá Bắn Cung Trên Ngựa"
  imperial_examination.5170.desc: "Thức dậy trước gà gáy, Ta và các thí sinh khác được đánh thức và đưa tới trường bắn ngoài trời.\n\nMột dàn chiến mã tốt đang chờ ở đỉnh đồi sáng sủa. Thí sinh trước Ta chuẩn bị ngựa [other_entrant.GetHerHis], rồi bắt đầu..."
  imperial_examination.5170.a: "Ta nắm cương."
  imperial_examination.5170.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], Ngài thay Ta.""
  imperial_examination.5170.c: ""Giám khảo [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], chú ý!""
  imperial_examination.5170.d: "Phụ huynh Ta là cung thủ xuất sắc trên ngựa. Phải chứ, [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip]?"
  imperial_examination.5170.e: "Cung và Ta là một. Ta không thể thất bại!"  
