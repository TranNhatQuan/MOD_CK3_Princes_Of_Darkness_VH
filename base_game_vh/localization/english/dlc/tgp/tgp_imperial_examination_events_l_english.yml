l_english:

 ### ARRIVAL EVENTS ###
 #Entrant
  imperial_examination.1000.t: "Thí Sinh Tập Trung"
  imperial_examination.1000.desc: "Ta bước vào thành phố [ROOT.Char.GetCurrentLocation.GetName] và thấy các con phố được quét dọn sạch sẽ, trang trí lộng lẫy đón chào chúng Ta. Người dân cúi chào và thầm thì những lời cầu may mắn khi chúng Ta đi qua, trong khi các con bạc đặt cược tại các góc phố.\n\nMỗi nơi Ta nhìn, Ta thấy các thí sinh khác mặc những bộ áo lụa đẹp nhất, cùng các kỹ nữ rời đi tới các quán rượu địa phương. Hôm nay, Ta sẽ biết mình sẵn sàng đi bao xa."
  imperial_examination.1000.a: "Ta sẽ thành công, dù bằng cách nào!"
  imperial_examination.1000.a.tt: "Người sẽ có thêm cơ hội gian lận\n@alert_icon! #alert_trial Người có thể bị bắt quả tang!#! #weak (nếu vẫn không bị phát hiện người sẽ nhận được [secret|E] #V $secret_exam_cheater$#! )#!"
  imperial_examination.1000.b: "Ta muốn chứng minh bản thân theo cách chính trực."

 #Host
  imperial_examination.1001.t: "$imperial_examination.1000.t$"
  imperial_examination.1001.desc: "Các quan chức tương lai xếp hàng dọc các con phố của [ROOT.Char.GetCurrentLocation.GetName]. Thành phố trở nên sống động, được tô điểm bởi những bộ áo lụa tinh tế của các thí sinh và những kỹ nữ xinh đẹp đi kèm. \n\nĐể vượt qua Kỳ Thi Hoàng Gia là để chứng minh sự hiểu biết thấu đáo về năm đức hạnh, đỉnh cao của học thuyết Nho giáo. \n\nĐây không phải là việc thuộc lòng, mà là nuôi dưỡng niềm tin đức hạnh và hành vi đạo đức."
  imperial_examination.1001.a: "Hội đồng đang chờ."

 #Guest
  imperial_examination.1002.t: "$imperial_examination.1000.t$"
  imperial_examination.1002.desc: "Ta bước vào thành phố [ROOT.Char.GetCurrentLocation.GetName] cùng [ROOT.Char.Custom2('RelationToMe', candidate )] [candidate.GetTitledFirstName] bên cạnh. Các con phố được quét dọn sạch sẽ và trang trí lộng lẫy cho chuyến đến của chúng Ta.\n\nKhi [candidate.GetSheHe] bị cách ly trong nơi lưu trú của thí sinh, khả năng ảnh hưởng đến tiến trình của [candidate.GetHerHis] sẽ rất hạn chế. Có lẽ Ta nên đưa vài lời khuyên."
  imperial_examination.1002.a: ""Hãy thành công bằng bất cứ giá nào, [ROOT.Char.Custom2('RelationToMe', candidate )].""
  imperial_examination.1002.a.tt: "[candidate.GetFirstNameNoTooltip] sẽ có thêm cơ hội gian lận\n@alert_icon! #alert_trial [candidate.GetSheHe|U] có thể bị bắt quả tang!#! #weak (nếu [candidate.GetSheHe] không bị phát hiện [candidate.GetSheHe] sẽ nhận được [secret|E] #V $secret_exam_cheater$#! )#!"
  imperial_examination.1002.b: ""Đừng làm xấu mặt nhà [ROOT.Char.GetHouse.GetNameNoTooltip].""

  imperial_examination.1003.t: "$imperial_examination.1000.t$"
  imperial_examination.1003.desc: "Ta bước vào thành phố [ROOT.Char.GetCurrentLocation.GetName], tay chất đầy các cuộn học liệu và sách vở.\n\n"
  imperial_examination.1003.not_passed_exam: "Ta vẫn chưa trải qua kỳ thi. Tuy nhiên, có nhiều việc Ta có thể làm để hỗ trợ giám khảo tại sự kiện, nếu Ta muốn học trước khi dám đối mặt kỳ thi một ngày nào đó."
  imperial_examination.1003.passed_provincial_exam: "Hôm nay, Ta sẽ khám phá những gì diễn ra bên trong phòng học của giám khảo, cách pha mực và chuẩn bị các bộ câu hỏi. Sau khi hoàn thành kỳ thi, bây giờ là lúc để vun đắp [Glossary( 'guānxi', 'GUANXI_GLOSS' )]."
  imperial_examination.1003.passed_metropolitan_not_palace: "Ta nhớ việc phát bảng khi Ta vượt qua kỳ thi Địa Phủ, niềm vui Ta cảm nhận nhanh chóng phai nhạt khi không vào top mười. Có lẽ, nếu Ta nỗ lực đủ, một ngày nào đó Ta sẽ được tham dự Kỳ Thi Cung Điện."
  imperial_examination.1003.passed_all_exams: "Là người hoàn thành tất cả các cấp kỳ thi, các giám khảo giờ chào đón Ta như một trong số họ khi Ta bước vào các phòng học danh giá nhất của thành phố."
  imperial_examination.1003.a: "$imperial_examination.1001.a$"

 #Entrant: Meet a fellow entrant
  imperial_examination.1020.t: "Gương Mặt Mới"
  imperial_examination.1020.desc: "Tại nhà trọ, Ta để ý một thí sinh khác ngồi ở bàn, trông nghiêm nghị trong khi lo lắng cắn móng tay [new_entrant.GetHerHis].\n\nNhìn sang, chúng Ta chạm mắt nhau trong chốc lát và Ta mở lời: "Chào — Ta là [ROOT.Char.GetTitledFirstNameNoTooltip]. Ngài là ai?"\n\nÁnh mắt [new_entrant.GetHerHis|U] lang thang khắp phòng khi [new_entrant.GetSheHe] trả lời: "[new_entrant.GetTitledFirstName]. Sao cơ?""
  imperial_examination.1020.a: ""Ngài cũng lo lắng à?""
  imperial_examination.1020.a.success.tt: "Ngài kết nối được với [new_entrant.GetShortUIName]"
  imperial_examination.1020.a.failure.tt: "Cuộc trò chuyện nhỏ của Ngài không thành công"
  imperial_examination.1020.b: ""Ta chắc mọi chuyện sẽ ổn thôi!"" 

 #Taking in the Sights
  imperial_examination.1040.t: "Ngắm Nhìn Thành Phố"
  imperial_examination.1040.desc.again: "Một lần nữa, Ta bị mắc kẹt trên đường tới phòng thi, chen chúc sau những thí sinh háo hức mắt tròn mắt dẹt, vật lộn để tìm đường qua các con phố."
  imperial_examination.1040.desc: "Các con phố nhộn nhịp chuẩn bị cho kỳ thi sắp tới. Không khí tràn ngập sự mong đợi, và Ta không thể không cảm thấy hồi hộp theo."
  imperial_examination.1040.desc.outro: "\n\nCác quan tương lai xếp hàng tới hội trường để thông báo sự có mặt của mình. Với hàng dài như vậy, có vẻ Ta có thời gian lang thang khắp thành phố trước khi buổi họp bắt đầu."
  imperial_examination.1040.a: "Ta nên tìm kiếm một cuộn sách ở chợ."
  imperial_examination.1040.a.tt: "Ngài trở thành chủ nhân của một cuộn [learning|E] [artifact|E]"
  imperial_examination.1040.a.tt_equipped: "Đã mua [artifact_scroll.GetName]"

  imperial_examination.1040.b: "Ta nên mua một món quà cho chủ nhà."
  imperial_examination.1040.c: "Ta không có thời gian để phân tâm."
  imperial_examination.1040.d: "Ta nên xem mình có thể học gì từ dân địa phương."
  imperial_examination.1040.d.tt.success: "Ngài thu được những hiểu biết quý giá"
  imperial_examination.1040.d.tt.failure: "Ngài không học được gì giá trị"
  imperial_examination.1040.e: "Ta nên rèn luyện kỹ năng tại sân tập!"
  imperial_examination.1040.e.tt.success: "Ngài đánh bại các võ sĩ địa phương"
  imperial_examination.1040.e.tt.failure: "Ngài bị các võ sĩ địa phương đánh bại"
  artifact_scroll_name: "Bản Thảo Cũ"
  artifact_scroll_desc: "Một văn bản giáo dục được lật nhiều lần và chú thích kỹ, mang tên 'Diễn Giải Nhân Tính', bàn về một trong năm trụ cột của tư tưởng Nho giáo."
  examination_gifted_host_title: "Đã Tặng Quà Cho Chủ Nhà"
  examination_gifted_host: "[CHARACTER.GetTitledFirstName|U] tặng [TARGET_CHARACTER.GetTitledFirstName] [ROOT.Char.Custom('GetExpensiveDessert')]"
  imperial_examination.1050.t: "Ấn Tượng Đầu Tiên"
  imperial_examination.1050.desc: "Rất dễ tìm giám khảo [examiner.GetTitledFirstName], khi một nhóm thí sinh khác vây quanh [examiner.GetHerHim] như những con công, khoe các cuộn thư pháp và kéo [examiner.GetHerHim] vào các cuộc tranh luận học thuật. \n\nĐể nổi bật và tạo ấn tượng sâu sắc trong đám đông này không hề dễ, cạnh tranh với lũ xã hội giả mạo tinh ranh này."
  imperial_examination.1050.a: "Gây ấn tượng với một nhận định sắc bén về kinh điển."
  imperial_examination.1050.a.success.tt: "[examiner.GetTitledFirstName] ấn tượng"
  imperial_examination.1050.a.failure: "[examiner.GetTitledFirstName] không ấn tượng"
  imperial_examination.1050.a.failure.tt: "Nhận định của Ngài không sai, nhưng đã lỗi thời."
  imperial_examination.1050.b: "Nhận công lao của thí sinh khác."
  imperial_examination.1050.b.success.tt: "[examiner.GetTitledFirstName] ấn tượng"
  imperial_examination.1050.b.failure.tt: "Ngài bị bắt gian lận"
  imperial_examination.1050.c: "Ta sẽ chứng minh bản thân tại kỳ thi."
  examination_impressed_examiner_title: "Gây Ấn Tượng Tuyệt Vời Đầu Tiên"
  examination_impressed_examiner: "[CHARACTER.GetTitledFirstName|U] nhận được lợi thế trong kỳ thi nhờ chiếm được cảm tình của giám khảo [TARGET_CHARACTER.GetTitledFirstName]."

  imperial_examination.1060.t: "Một Món Quà Ngọt Ngào"
  imperial_examination.1060.desc: "Mùi bánh tươi dễ chịu xộc qua hỗn hợp mồ hôi của thí sinh và các cuộn sách bụi phủ khắp tòa nhà thi. \n\n'Ta mang đến cho Ngài món quà nhỏ từ quê hương Ta, [ROOT.Char.GetTitleAsNameNoTooltip],' nói [entrant_to_meet.GetTitledFirstName], một thí sinh triển vọng trong kỳ thi sắp tới. \n\n[entrant_to_meet.GetSheHe|U] cúi chào và trao một hộp chạm khắc gỗ hồng và xương: nguồn gốc của mùi thơm hấp dẫn, và rõ ràng là một nỗ lực chiếm cảm tình của Ta."
  imperial_examination.1060.b: "Vận may sẽ đến với những ai hào phóng như vậy."
  imperial_examination.1060.b.tt: "[entrant_to_meet.GetTitledFirstName] #BOL Tăng#! cơ hội #BOL thành công#! nhờ [exam_advantage|E]"
  imperial_examination.1060.c: "Chúng ta hãy cùng thưởng thức!"
  imperial_examination.1060.d: "Ta sẽ thưởng thức món này!"

  imperial_examination.1070.t: "Thí Sinh Triển Vọng Nhất"
  imperial_examination.1070.desc: "Ta không khỏi tự hỏi những thí sinh nào sẽ thử sức trong kỳ thi này. \n\n[Glossary( 'four ways', 'FOUR_WAYS_GLOSS' )] lựa chọn quan chức chắc chắn sẽ quyết định sự ưu ái của thí sinh với giám khảo. Là [ROOT.Char.GetTitleAsNameNoTooltip] của họ, Ta có quyền xác định điều gì là giá trị #EMP tốt#!."
  imperial_examination.1070.a: "Những người cùng sở thích với Ta chắc chắn triển vọng."
  every_shared_education_entrant.tt: "Mỗi [entrant|E] với [THIS.Char.Custom('GetEducationTraitConcept')] [education|E] nhận #BOL tăng#! cơ hội #BOL thành công#!"
  imperial_examination.1070.b: "Tất cả những ai tuân theo tín điều Nho giáo đều xứng đáng."
  imperial_examination.1070.b.tt: "Mỗi [entrant|E] có đặc điểm [GetTrait('compassionate').GetName(GetNullCharacter)], [GetTrait('just').GetName(GetNullCharacter)], [GetTrait('honest').GetName(GetNullCharacter)], hoặc [GetTrait('scholar').GetName(GetNullCharacter)] nhận #BOL tăng#! cơ hội #BOL thành công#!"
  imperial_examination.1070.d: "Những người là hậu duệ của Thiên Tử, tất nhiên."
  imperial_examination.1070.d.tt: "Mỗi [entrant|E] của [dynasty|E] của Ngài nhận #BOL tăng#! cơ hội #BOL thành công#!"
  imperial_examination.1070.c: "Ta sẽ tuân theo quyết định của giám khảo."

 ### EMPEROR EVENTS ###

 #Emperor sneaks out to meet entrant
  imperial_examination.2000.t: "[ROOT.Char.GetTitleAsNameNoTooltip], hay Không Ai"
  imperial_examination.2000.desc: "Con người hành xử đúng mực trước quyền lực. Vì vậy, với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], Ta cần lén lút quan sát thần dân để biết ai là người đàng hoàng, ai chỉ là kẻ nói dối giỏi. \n\nTa rời nơi lưu trú trong bộ áo đơn giản, ẩn mình trong đám đông để quan sát thí sinh chính xác hơn. \n\n[entrant_to_meet.GetTitledFirstName] nổi bật là một nhân vật triển vọng."
  imperial_examination.2000.desc.scoreboardee: "Ngay cả bây giờ, [entrant_to_meet.GetSheHe] dễ dàng đọc thuộc các đoạn kinh điển trước khán giả chăm chú. Ta cũng bị cuốn hút bởi những câu hỏi hấp dẫn mà [entrant_to_meet.GetSheHe] đặt ra."
  imperial_examination.2000.desc.fallback: "[entrant_to_meet.GetSheHe|U] ngồi giữa một nhóm thí sinh nhỏ, thảo luận về kinh điển với quan điểm lôi cuốn nhưng hơi nhạt nhẽo."
  imperial_examination.2000.a: "Ta sẽ cho giám khảo biết tên [entrant_to_meet.GetHerHis]."
  imperial_examination.2000.a.tt: "[entrant_to_meet.GetTitledFirstName] #BOL Tăng#! cơ hội #BOL thành công#! nhờ [exam_advantage|E]"
  imperial_examination.2000.b: "[entrant_to_meet.GetTitleByKey] có thể tiến xa, nếu được giúp đỡ."
  imperial_examination.2000.c: "Than ôi, tiêu chuẩn của Ta cao hơn thế này."
 
  imperial_examination.2010.t: "Chuẩn Bị Sân Khấu"
  imperial_examination.2010.desc.two: ""Thật tuyệt khi có nhiều thành viên triều đại của Ngài hiện diện trong kỳ thi," giám khảo [examiner.GetTitledFirstName] nói với Ta. "Mặc dù Ta không đặt nhiều hy vọng vào [entrant_to_meet_2.GetTitledFirstName]."\n\n"
  imperial_examination.2010.desc.one: ""Ta thấy [dynasty_member.GetTitledFirstName] đã đến kỳ thi," giám khảo [examiner.GetTitledFirstName] nói với Ta. "Ngài hẳn rất vui."\n\n"
  imperial_examination.2010.desc.outro: "Đôi mắt [examiner.GetFirstNamePossessiveNoTooltip] lướt qua danh sách thí sinh, và Ta có thể thấy chiếc túi tiền của [examiner.GetHerHis] phồng lên do đã nhận hối lộ từ các trưởng gia tộc lo lắng. \n\nChắc chắn Ta cũng có thể góp một chút để nâng đỡ một thành viên trong nhà mình."
  imperial_examination.2010.a: "[entrant_to_meet.GetShortUINameNoTooltip] xứng đáng được công nhận."
  imperial_examination.2010.a.tt: "[entrant_to_meet.GetTitledFirstName] #BOL Tăng#! cơ hội #BOL thành công#! nhờ [exam_advantage|E]"
  imperial_examination.2010.b: "Sự thất vọng của Ta về một [ROOT.Char.Custom2('RelationToMe', entrant_to_meet_2 )] cần bất cứ sự trợ giúp nào mà [entrant_to_meet_2.GetSheHe] có thể nhận được."
  imperial_examination.2010.b.tt: "[entrant_to_meet_2.GetTitledFirstName] #BOL Tăng#! cơ hội #BOL thành công#! nhờ [exam_advantage|E]"
  imperial_examination.2010.c: "Ta nghĩ là không."

  imperial_examination.2030.t: "Viên Ngọc Thô"
  imperial_examination.2030.desc.open: ""Như dự đoán với số lượng thí sinh đông đảo trong kỳ thi này, một số kẻ xuất thân thấp cố gắng nổi bật,""
  imperial_examination.2030.desc.restricted: ""Mặc dù hạn chế sự tham dự từ công chúng, nhưng vài kẻ xuất thân thấp vẫn lẻn vào được phòng thi một cách kỳ diệu.""
  imperial_examination.2030.desc.exclusive: ""Kính tôn [ROOT.Char.GetTitleAsNameNoTooltip], Ta phải xấu hổ mà thừa nhận rằng một kẻ vô danh xuất thân thấp somehow đã lọt vào phòng thi, hy vọng chứng tỏ [promising_lowborn.GetHerselfHimself].""
  imperial_examination.2030.desc.outro: "giám khảo [examiner.GetTitledFirstName] thông báo với tôi, nhìn ra sân qua cửa sổ. \n\n[examiner.GetTitledFirstName] chỉ tay vào một [promising_lowborn.GetWomanMan] trẻ tuổi, người có vẻ đang bị cuốn vào một cuộc tranh cãi nảy lửa với hai quý tộc. \n\n\"Tên của [promising_lowborn.GetHerHis] là [promising_lowborn.GetTitledFirstName]. Mặc dù phong thái có phần thô kệch, tôi phải thừa nhận rằng [promising_lowborn.GetSheHe] thể hiện triển vọng xuất sắc.\""
  imperial_examination.2030.a: "Không một kẻ thường dân nào vượt mặt được dòng tộc Ta!"
  imperial_examination.2030.a.tt: "[dynasty_member.GetTitledFirstName] #BOL Tăng#! cơ hội #BOL thành công#! nhờ [exam_advantage|E]"
  imperial_examination.2030.b: "Ta sẽ để mắt tới người này."
  imperial_examination.2030.c: "Thật ra, mọi người đều bình đẳng dưới thiên đình."

 #One of the examiners is taking bribes...?
  imperial_examination.2040.t: "Hối Lộ Trong Tay"
  imperial_examination.2040.desc: "Có tin đồn rằng giám khảo [rumored_examiner.GetTitledFirstName] đang #EMP nhận lợi ích#! để nâng đỡ các thí sinh cụ thể. \n\nQuả thực, túi của [rumored_examiner.GetHerHis] dường như nhét đầy tiền xu, và [rumored_examiner.GetSheHe] gần gũi với các thí sinh hơn mức phù hợp với chức vị của [rumored_examiner.GetHerHis]. \n\nKhông cần điều tra thêm. [rumored_examiner.GetWomanMan] này làm hoen ố kỳ thi của tôi!"
  imperial_examination.2040.a: "[rumored_examiner.GetFirstNameNoTooltip] sẽ bồi thường cho đế quốc."
  imperial_examination.2040.b: "Ta biết ai đó có thể cần chút #EMP trợ giúp#!."
  imperial_examination.2040.b.tt: "[dynasty_member.GetTitledFirstName] #BOL Tăng#! cơ hội #BOL thành công#! nhờ [exam_advantage|E]"
  imperial_examination.2040.d: "Trói kẻ hổ thẹn [rumored_examiner.GetWomanMan] này lại!"
  imperial_examination.2040.c: "Kỳ thi sẽ tiếp tục như bình thường."

 ### METROPOLITAN EXAM EVENTS ###
 #Emperor exam event
  imperial_examination.3000.t: "Tiếng Chuông Vang"
  imperial_examination.3000.desc: "Sau khi kiểm tra kỹ lưỡng để loại trừ gian lận, các thí sinh xếp hàng dự thi. Ta nhìn ra từ cung điện, chiêm ngưỡng khuôn mặt háo hức và tư thế nghiêm cẩn của họ. \n\nTiếng chuông vang lên từ tháp sân, theo sau là tiếng trống nặng — âm thanh vang dưới chân Ta và làm tim Ta dâng trào niềm hân hoan chính nghĩa."
  imperial_examination.3000.a: "Bắt đầu rồi."

  imperial_examination.3005.t: "$imperial_examination.3000.t$"
  imperial_examination.3005.desc: "Một sự im lặng bao trùm quán khi tiếng chuông vang khắp [ROOT.Char.GetCurrentLocation.GetName]. Cổng phòng thi đóng lại.\n\nXung quanh Ta, các bậc phụ huynh và trưởng lão thì thầm bàn luận, cố suy đoán kết quả kỳ thi sắp tới. Một nỗ lực vô ích."
  imperial_examination.3005.desc.outro.impatient: "Dù không muốn thừa nhận, tất cả chúng ta giờ chỉ có thể chờ đợi."
  imperial_examination.3005.desc.outro: "Tất cả chúng ta giờ chỉ có thể chờ đợi."
  imperial_examination.3005.a: "Đây là vị trí tốt để được chú ý."
  imperial_examination.3005.b: "Ta nên giao lưu..."

  imperial_examination.3006.t: "$imperial_examination.3000.t$"
  imperial_examination.3006.desc: "Sự mong đợi dày đặc trong không khí khi tiếng chuông vang khắp [ROOT.Char.GetCurrentLocation.GetName]. Cổng phòng thi đóng lại.\n\nTa theo sát giám khảo [examiner.GetTitledFirstName]."
  imperial_examination.3005.desc.martial: "Mồ hôi chảy trên lưng khi Ta mang mũi tên bổ sung vào ống, các vết cắt nhỏ trên tay do mài kiếm."
  imperial_examination.3005.desc.scholar: "Mồ hôi chảy trên lưng khi Ta mang cuộn giấy qua lại giữa các phòng thi, mực nhuộm đen đầu ngón tay do đổ mực."
  imperial_examination.3006.a: "Giờ, công việc thực sự bắt đầu."

  imperial_examination.3007.t: "$imperial_examination.3000.t$"
  imperial_examination.3007.desc: "Tiếng rền rĩ vang lên cùng một tiếng rầm nặng nề, cánh cổng trường thi đã đóng sập lại. Tiếng chuông trong sân viện vang vọng, thúc giục chúng ta tập hợp."
  imperial_examination.3007.a: "Đã đến lúc chứng minh thực lực của bản thân."
  imperial_examination.3007.a.success_tooltip_first: "#weak Để vượt qua Kỳ thi Hội, Ngài cần đạt số điểm là #V 50#!. Để được tham gia Kỳ thi Đình, Ngài cần nằm trong nhóm mười người có điểm số cao nhất.#!"
 # Entrant caught cheating
  imperial_examination.3010.t: "Cỏ Dại Giữa Hoa"
  imperial_examination.3010.desc: "Ta dừng lại ngoài phòng giám khảo, nghe lén cuộc trò chuyện nhỏ của họ. "Ta chưa từng thấy kẻ gian lận nào khéo léo đến vậy," giám khảo [examiner.GetTitledFirstName] nói."
  imperial_examination.3010.scholarship: ""Lý do duy nhất Ta nhận ra vớ [entrant.GetTitledFirstName] đầy đáp án thi là vì [entrant.GetSheHe] vô tình bị nước bắn lên chúng!"" 
  imperial_examination.3010.martial: "[entrant.GetTitledFirstName] phá hỏng cung của đối thủ bằng một vết cắt gần như không thấy ở cán, khiến vũ khí chỉ gãy khi uốn cong."
  imperial_examination.3010.outro: "\n\nGiám khảo [examiner_2.GetTitledFirstName] lắc đầu [examiner_2.GetHerHis] và lẩm bẩm: \"Giá như [entrant.GetSheHe] dùng kỹ năng đó để vượt qua bài kiểm tra bằng con đường trung thực. [entrant.GetSheHe|U] sẽ là một quan chức nhà nước đáng gờm.\""
  imperial_examination.3010.a: "Kẻ gian lận có thể chuộc lỗi [entrant.GetHerselfHimself] bằng cách phục vụ ta."
  imperial_examination.3010.b: "Giám khảo mới là người cần bị trừng phạt!"
  imperial_examination.3010.c: "Ta sẽ để các giám khảo giải quyết."

  imperial_examination.3020.t: "Vết Bẩn Trên Danh Tiếng Ta"
  imperial_examination.3020.desc: "Một giọng nói quen thuộc vang lên từ các buồng thi, kéo tôi ra khỏi nơi nghỉ ngơi. Tôi thấy [entrant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entrant'))] của tôi, đang bứt tóc và lẩm bẩm những lời vô nghĩa.\n\n"
  imperial_examination.3020.desc_martial: "[entrant.GetSheHe|U] đã bỏ mặc vũ khí cán dài của mình trên bãi cỏ, khiến đối thủ đấu tập của [entrant.GetHerHis] phải gãi đầu bên trong chiếc mũ giáp của [entrant.GetHerHis]."
  imperial_examination.3020.desc_scholarship: "[entrant.GetSheHe|U] đã rời khỏi buồng thi, nhưng vẫn siết chặt [entrant.GetHerHis] với biểu cảm nhợt nhạt và hoảng loạn trên gương mặt."
  imperial_examination.3020.desc.outro: "\n\nCác giám khảo há hốc trước cảnh tượng kịch tính trước khi can thiệp nhanh, nhưng hậu quả đã xảy ra. Mọi thí sinh chứng kiến thành viên triều đại Ta sụp đổ trước mắt họ."
  imperial_examination.3020.a: "[entrant.GetSheHe|U] sẽ bị nhắc nhở nghiêm khắc."
  imperial_examination.3020.b: "Đuổi [entrant.GetHerHim] về ngay lập tức!"
  imperial_examination.3020.c: "À, chỉ là say nắng thôi, không hơn gì."

  imperial_examination.3030.t: "Ngủ Trong Giờ Làm Việc"
  imperial_examination.3030.desc: "Tin đến tai Ta rằng giám khảo [examiner.GetFirstName] gật gù trước thí sinh. Bắt đầu từ khuỷu tay trượt trên bàn, rồi [examiner.GetWomanMan] đã ngáy ngủ! \n\n[examiner.GetSheHe|U] đã tỉnh, nhưng ai biết thí sinh làm gì khi [examiner.GetSheHe] ngủ gật?"
  imperial_examination.3030.a: "Điều này khiến mọi kết quả bị nghi vấn!"
  imperial_examination.3030.a.flavor: "Trừng phạt tập thể bao giờ cũng hiệu quả."
  imperial_examination.3030.b: "Ta sẽ ghi nhớ chuyện này."
  imperial_examination.3030.c: "Chắc chắn không ai để ý ngoài chúng ta."

 ### ENTRANT EVENTS ###
 #Hire a stand-in to take the exam for you
  imperial_examination.4000.t: "Với Một Chút Giúp Đỡ"
  imperial_examination.4000.desc: "Chữ, ký hiệu… Khi nhắm mắt Ta có thể hình dung các đoạn văn mà Ta đã học cả ngày. Mỗi nét cọ dường như lơ lửng trong bóng tối, nhưng ý nghĩa vẫn mơ hồ. Liệu Ta có đủ thời gian để nắm vững tất cả cách giải thích cần thiết?\n\nMột thí sinh khác tiến tới, áo choàng [exam_taker.GetHerHis] chạm vào Ta. "Cả đêm thức học chỉ khiến tâm trí mệt mỏi. Cả đời Ngài còn để học. Hãy để Ta thi thay Ngài, nghỉ ngơi đi.""
  imperial_examination.4000.a: "Ta #EMP thật sự#! cần mọi sự giúp đỡ có thể..."
  imperial_examination.4000.b: "Không, điều này sai."
  imperial_examination.4000.b.cheater: "Có lý..."
 #Bribe an examiner
  imperial_examination.4010.t: "Ưu Thế Trong Phòng Tối"
  imperial_examination.4010.desc: "Mỗi bước đi của giám khảo [examiner_to_bribe.GetFirstName] vang lên tiếng tiền kêu leng keng. Túi [examiner_to_bribe.GetHerHis|U] căng phồng. Nhiều lần Ta thấy [examiner_to_bribe.GetHerHim] trao đổi nhỏ với thí sinh, cố tránh ánh mắt tò mò nhưng thất bại.\n\nRõ ràng [examiner_to_bribe.GetWomanMan] đang làm việc với những thỏa thuận #EMP sinh lời#!..."
  imperial_examination.4010.a: "Ta nên tự giới thiệu."
  imperial_examination.4010.b: "Không đáng mạo hiểm."
 #Stay up studying
  imperial_examination.4020.t: "Khó Khăn Đêm Khuya"
  imperial_examination.4020.desc: "Ta ngồi, cúi người trên sách, lật từng trang để ghi nhớ tất cả chữ cái cho kỳ thi sắp tới.\n\nMột cơn nhức nhẹ ở trán khiến Ta nhận ra mình đang nheo mắt trong ánh sáng yếu. Ta đứng dậy thấm nước lên cổ để giảm căng thẳng tinh thần."
  imperial_examination.4020.a: "Chỉ thêm một chút nữa..."
  imperial_examination.4020.b: "Ta không thể tiếp tục được nữa."
 #Study with a friend
  imperial_examination.4030.t: "... Từ Bạn Bè"
  imperial_examination.4030.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]! Dạo này Ngài ra sao? Có muốn cùng Ta chuẩn bị thêm cho kỳ thi không?" [ROOT.Char.Custom2('RelationToMe', friendly_entrant )], [friendly_entrant.GetTitledFirstName], vẫy tay từ chỗ ngồi thoải mái của [friendly_entrant.GetHerHis] ở sâu hơn trong hội trường.\n\nTrước mặt [friendly_entrant.GetHerHim] là một bàn đầy những chiếc bút lông đang khô và hàng chục tập thơ dày."
  imperial_examination.4030.outro: "\n\nTa dừng lại một chút, suy nghĩ về đề nghị này. Học cùng nhau #EMP thật sự sẽ#! có những lợi thế..."
  imperial_examination.4030.outro.lover: "\n\nCó phải [friendly_entrant.GetSheHe] lúc nào trông cũng #EMP quyến rũ#! đến thế này không?"
  imperial_examination.4030.a: ""Bắt đầu từ đâu nhỉ?""
  imperial_examination.4030.b: ""À, Ta không phiền học cùng #EMP Ngài#!...""
  imperial_examination.4030.c: ""Ta còn việc phải đi.""

  imperial_examination.4050.t: "Túy Nguyệt Đêm Khuya"
  imperial_examination.4050.desc: ""Một vài người chúng Ta định chia sẻ một bình rượu Baijiu với nhau. Ngài sẽ tham gia chứ?" [ROOT.Char.Custom2('RelationToMe', friendly_entrant )], [friendly_entrant.GetTitledFirstName], gọi Ta từ bờ ao trong sân, ngắm ánh nắng chiếu trên vảy cá."
  imperial_examination.4050.a: "Ta biết trò uống rượu hoàn hảo!"
  imperial_examination.4050.b: "Ta muốn chia sẻ khoảnh khắc riêng với Ngài."
  imperial_examination.4050.c: "Ta còn việc khác phải đi."

  imperial_examination.4060.t: "Một Đối Thủ Tiềm Năng"
  imperial_examination.4060.desc_learning: "Tôi đang tranh luận với các đồng môn tại nhà trọ thì một giọng mũi chói tai ngắt lời: \"Đó là một ý tưởng tầm thường và là một chủ đề rất đáng tranh cãi!\"\n\nTôi quay lại nhìn kẻ lên tiếng, một gã mới nổi vô danh từ [ROOT.Char.GetCurrentLocation.GetName]. Đã hơn một giờ nay, [promising_lowborn.GetSheHe] cứ chế nhạo và đảo mắt [promising_lowborn.GetHerHis] trước từng lời tôi nói. \n\nCác học giả khác khúc khích cười nhạo tôi khi tôi càng kéo dài việc không làm gì trước những lời xúc phạm này."
  imperial_examination.4060.desc_martial: "Ta nhìn ra sân ngoài nhà trọ và thấy một cột khung [Glossary('cuju','CUJU_GLOSS')] được dựng lên, và đám đông xôn xao thích thú. \n\nTrên đường đến trò chơi, Ta va vào một thí sinh khác. [promising_lowborn.GetWomanMan], kẻ vô danh từ [ROOT.Char.GetCurrentLocation.GetName], cười khẩy và nói: "Ngài định đi đâu? Hy vọng không phải đến trò chơi với đôi chân còi cọc đó. Chắc chắn sẽ gãy như cành cây!" \n\nMọi người xung quanh cười trước sự hỗn xược của [promising_lowborn.GetHerHis]. Nếu Ta không phản ứng, đám đông sẽ sớm nhắm vào Ta."
  imperial_examination.4060.a: "Ta sẽ dạy [promising_lowborn.GetHerHim] một bài học!"
  imperial_examination.4060.a.success: "Ngài làm kẻ vô danh trở nên nực cười"
  imperial_examination.4060.a.failure: "Ngài tự làm mình thành trò cười"
  imperial_examination.4060.b: "Có lẽ [promising_lowborn.GetSheHe] có vài điểm đúng?"
  imperial_examination.4060.c: "Từ chối tham gia."
  imperial_examination.4060.d: "Con [promising_lowborn.Custom('GetDaughterSon')] của kẻ buôn hạ phẩm!"
  imperial_examination.4060.d.tt: "Ngài khiến [promising_lowborn.GetTitledFirstName] bị loại khỏi kỳ thi dựa trên nghi ngờ về nghề nghiệp thấp kém của gia đình [promising_lowborn.GetHerHis]."

  imperial_examination.4070.t: "Sự Hỗ Trợ Gia Đình Không Xin Hỏi"
  imperial_examination.4070.desc: "Ta nghe một giọng quen bên ngoài phòng thi và sững sờ khi thấy [parent.GetMotherFather] trò chuyện với [examiner.GetTitledFirstName]. \n\nTa kéo phụ huynh sang một bên và hỏi tại sao lại ở đây, họ vui vẻ đáp: "Chỉ muốn giúp Ngài thôi. Ta cũng có quan hệ mà! Để Ta đề cử tên Ngài và đảm bảo Ngài có cơ hội thành công." \n\nTa liếc xung quanh để chắc rằng không ai phát hiện. Hiện tại, Ta vẫn còn thời gian gửi [parent.GetTitledFirstName] về mà không làm hỏng danh tiếng."
  imperial_examination.4070.a: "Chỉ khi [parent.GetSheHe] biết khéo léo."
  imperial_examination.4070.a.success: "[parent.GetMotherFather] của ngài đã giấu kín ý định của [parent.GetHerHis] thành công"
  imperial_examination.4070.a.failure: "Kế hoạch của [parent.GetMotherFatherPossessive] bị bại lộ"
  imperial_examination.4070.b: "Ta có thể chịu nhục để thành công."
  imperial_examination.4070.c: "[parent.GetMotherFather|U], xin đi #EMP ra chỗ khác#!."

  imperial_examination.4080.t: "Con Đường Phân Lộ"
  imperial_examination.4080.desc: "Bất cứ nơi nào Ta đi, tiếng tranh luận học thuật luôn theo sau. \n\nHai giọng đặc biệt gay gắt nổi bật, Ta rẽ vào góc và thấy [examiner_1.GetTitledFirstName] và [examiner_2.GetTitledFirstName], hai đối thủ học thuật khét tiếng, lại tranh cãi nảy lửa. Ai viết nghiên cứu xuất sắc nhất về [examiner_1.Custom('EruditeTopic')]. \n\n[examiner_1.GetTitledFirstName] nhìn Ta và hỏi, "Vậy, Ngài #EMP thích#! văn bản nào?"""
  imperial_examination.4080.a: "Ta thích tác phẩm của [examiner_1.GetTitledFirstNameNoTooltip]."
  imperial_examination.4080.b: "[examiner_2.GetTitledFirstNameNoTooltip] là học giả đức hạnh nhất."
  imperial_examination.4080.c: "Ta thích cả hai như nhau."
  sided_with_examiner_log: "[CHARACTER.GetTitledFirstName|U] đứng về phía [TARGET_CHARACTER.GetFirstName] trong tranh luận học thuật"
  sided_with_examiner_log_title: "Đứng về phía Giám Khảo"

  imperial_examination.cheat.tt: "Nhận một [exam_cheat|E]"
  imperial_examination.advantage.tt: "Nhận [exam_advantage|E]"
  imperial_examination.has_advantage.tt: "#BOL Tăng#! cơ hội #BOL thành công#! nhờ [exam_advantage|E]\n"
  imperial_examination.has_increased_advantage.tt: "#BOL Rất nhiều#! tăng cơ hội #BOL thành công#! nhờ [exam_advantage|E]\n"
  imperial_examination.caught_cheating.tt: "#warning Giảm#! điểm công trạng của Ngài khi kết thúc kỳ thi."
  imperial_examination.cheat_spent.tt: "Ngài #BOL tiêu#! một [exam_cheat|E]\n"
  imperial_examination.cheat_wash.tt: "Sai lầm của Ngài được che đậy và gian lận bị lãng quên"

  imperial_examination.4090.t: "Những Người Đồng Điệu"
  imperial_examination.4090.desc: "Một cảm giác hồi hộp lan tỏa trong phòng trọ, chỉ được xua tan bởi nụ cười dễ chịu của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_entrant'))] [other_entrant.GetTitledFirstName]. \n\nVới [other_entrant.GetHerHim], Ta không cần giải thích, mọi lời Ta nói đều thấm sâu. Cuộc thảo luận của chúng Ta tự sinh động, và đầy bất ngờ! \n\nCuối cùng, [other_entrant.GetSheHe] nghiêng người và nói: "Ta biết vài người cùng chí hướng muốn gặp Ngài, Ngài có muốn Ta giới thiệu không?"""
  imperial_examination.4090.a: "Ta rất háo hức gặp họ!"
  imperial_examination.4090.b: "Ta còn nhiều sách quan trọng phải đọc."
  imperial_examination.4090.b.tt: "Sự chăm chỉ của Ngài mang lại [merit_i][merit|E]."

  imperial_examination.4100.t: "Một Mảnh Giấy"
  imperial_examination.4100.desc: "Ta đi cẩn thận giữa các phòng thi, hy vọng đặt một mảnh giấy nhỏ chuẩn bị với thông tin #EMP hữu ích#! trước kỳ thi sắp tới. \n\nNgay khi Ta tìm thấy một tấm ván lỏng trong tường một phòng, nghe thấy tiếng khịt mũi phía sau. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_entrant'))] [other_entrant.GetTitledFirstName] đã lẻn đến mà không gây tiếng động. \n\n[other_entrant.GetSheHe|U] hỏi, "Ngài đang làm gì ở đó?""
  imperial_examination.4100.a: "Chia sẻ đáp án để làm [other_entrant.GetTitledFirstNameNoTooltip] hài lòng."
  imperial_examination.4100.a.success: "[other_entrant.GetTitledFirstNameNoTooltip] đồng ý gian lận cùng Ngài"
  imperial_examination.4100.a.failure: "[other_entrant.GetTitledFirstNameNoTooltip] không bị thuyết phục"
  imperial_examination.4100.b: ""Ta đang nhập tâm vào tư duy học sinh.""
  imperial_examination.4100.b.success: "[other_entrant.GetTitledFirstNameNoTooltip] tin vào lời nói dối của Ngài"
  imperial_examination.4100.b.failure: "[other_entrant.GetTitledFirstNameNoTooltip] không bị lừa"
  imperial_examination.4100.c: "Ném mảnh giấy vào vũng nước gần đó."

  imperial_examination.8000.t: "Tại Cung Điện"
  imperial_examination.8000.desc: "Ta đứng giữa những học giả triển vọng nhất triều đình. Cả đời Ta chờ đợi khoảnh khắc này. Sớm thôi, Ta sẽ đi dạo trong vườn cung, ăn những món ngon nhất đế quốc, và đứng trước [host.GetTitleAsNameNoTooltip] [host.GetHerselfHimself]."
  imperial_examination.8000.a: "Đôi mắt thiên đình đang dõi theo Ta!"

  imperial_examination.8010.t: "Tại Quán Rượu"
  imperial_examination.8010.desc: "Ta không còn bị giam trong khuôn viên thi, nhưng vẫn dành vài phút trước khi gặp Bạn Bè và gia đình."
  imperial_examination.8010.desc_worried: "Tiếng ồn quán rượu không làm Ta bận tâm, Ta ngồi suy nghĩ xem có gì mình có thể làm khác đi."
  imperial_examination.8010.desc_fallback: "Kỳ thi cuối cùng cũng xong, Ta thở phào nhẹ nhõm."
  imperial_examination.8010.a: "Ta nên tập trung học."
  imperial_examination.8010.b: "Nhưng Ta vẫn hài lòng với kết quả."

  imperial_examination.9000.t: "Cuộc Hội Ngộ Đáng Kính"
  imperial_examination.9000.desc.intro: "Khi Kỳ Thi Đô Thị kết thúc, giám khảo [examiner.GetFirstName] giới thiệu Ta với thí sinh xếp hạng cao nhất, [first_char.GetTitledFirstName].\n\n"Người [first_char.GetWomanMan] này có năng khiếu về"
  imperial_examination.9000.desc.diplomacy: "ngoại giao"
  imperial_examination.9000.desc.martial: "chiến tranh"
  imperial_examination.9000.outro: "đã gây ấn tượng với tất cả chúng ta hôm nay,\" [examiner.GetFirstNameNoTooltip] nói. \"Các thí sinh xếp hạng cao khác đang được hộ tống đến hoàng cung ngay lúc này.\"\n\n[first_char.GetFirstNameNoTooltip] cúi đầu sâu và nói, giọng của [first_char.GetHerHis] trầm xuống đầy tôn kính, \"Con sống để phục vụ [ROOT.Char.GetTitleAsNameNoTooltip].\""
  imperial_examination.9000.a: "Ta đã trông đợi một [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')]."
  imperial_examination.9000.a.tt_martial: "Ngài có tùy chọn này nhờ $imperial_examination_focus_martial$ [activity_option|E]"
  imperial_examination.9000.a.tt_learning: "Ngài có tùy chọn này nhờ $imperial_examination_focus_learning$ [activity_option|E]"
  imperial_examination.9000.a.tt_stewardship: "Ngài có tùy chọn này nhờ $imperial_examination_focus_stewardship$ [activity_option|E]"
  imperial_examination.9000.b: "Ngài đã vinh danh đế quốc."
  exam_focus_martial: "học giả võ thuật"
  exam_focus_learning: "học giả học vấn"
  exam_focus_stewardship: "học giả quản lý"

  examination_first_place_entrant_noticed_title: "Thiên Tri"
  examination_first_place_entrant_noticed: "[host.GetTitleAsNameNoTooltip] chúc mừng [TARGET_CHARACTER.GetShortUIName] về thứ hạng cao của [TARGET_CHARACTER.GetHerHis]."

  imperial_examination.9001.t: "Dưới Ánh Nhìn Thiên Đình"
  imperial_examination.9001.desc: "Mồ hôi trên trán Ta còn chưa khô thì Ta đã được đưa đến trước [host.GetTitleAsNameNoTooltip]. Tay Ta đau nhức vì đã nắm chặt"
  imperial_examination.9001.desc_brush: "bút lông"
  imperial_examination.9001.desc_weapon: "vũ khí"
  imperial_examination.9001.desc_bridge: "cầm chắc suốt cả ngày. Ta được báo là điểm cao nhất trong số tất cả các [ROOT.Char.GetWomenMen] được chọn trong triều."
  imperial_examination.9001.desc_denied: "\n\nNgạc nhiên thay, [host.GetTitleAsNameNoTooltip] chỉ liếc nhìn Ta một cái khi Ta quỳ trước [host.GetHerHim], rồi nói, "Ta trông đợi một [ROOT.Char.GetInvolvedActivity.Custom('GetExamFocusSkill')]."\n\nMặt Ta nóng bừng khi một thí sinh khác được đưa vào để khen ngợi thay Ta, [favored_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)]."
  imperial_examination.9001.desc_merit: "\n\nTa quỳ lạy trước [host.Custom('GetDaughterSon')] của Thiên Đình [host.GetHerselfHimself], cúi thật sâu theo sức lưng mình.\n\n"Ngươi đã vinh danh đế quốc," [host.GetSheHe] nói. Có phải Ta vừa thấy một ánh tự hào trong mắt [host.GetHerHis]? Ánh sáng trong phòng xử án này chắc đang chơi khăm Ta."
  imperial_examination.9001.a: "Ta sống để phục vụ."
  imperial_examination.9001.b: "Ta sẽ không bao giờ quên điều này!"
  imperial_examination.9001.c: "Ta sẽ làm tốt hơn, bằng bất cứ giá nào."
  imperial_examination.9001.d: "Giữ bình tĩnh..."

  tgp_changed_ways_modifier: "Thay Đổi Đường Lối"
  tgp_changed_ways_modifier_desc: "Nhân vật này đã chọn một con đường mới, để phục vụ triều đình tốt hơn."

 ### EXAM EVENTS ###
 #The [Exam] Essay
  imperial_examination.5000.t: "Những Câu Hỏi Chung"
  imperial_examination.5000.desc.cheater: "Ta cảm thấy ánh mắt Ngài đồng môn thiêu đốt sau gáy khi bước vào phòng thi và tìm chỗ. Có bao nhiêu người biết Ta vi phạm? Hay Ta đang tưởng tượng? Ta cần gác những suy nghĩ này sang một bên và tập trung vào bài luận sắp tới."
  imperial_examination.5000.desc: "Giám khảo [examiner.GetTitledFirstName] nhìn Ta đầy hãi hùng khi Ta ngồi xuống, cố gắng thu thập tâm trí trước bài luận sắp tới."
  imperial_examination.5000.desc_bridge: "\n\nTa được yêu cầu giải quyết chủ đề sau:"
  governance_weaponry: ""Ai đó nói chỉ sở hữu giáo, nhưng bí mật sở hữu nỏ. Hình phạt nào nên áp dụng?"""
  governance_reinstatement: ""Một quan xứng đáng bị từ chối phục chức, trong khi quan không xứng được phục chức. Nên xử lý ra sao?"""
  governance_documents: "Nếu một quan mở tài liệu niêm phong mà không được phép, nên kỷ luật thế nào?"
  governance_filial: ""Nếu một tội nhân không có thân nhân nào đã được tuyên án tử hình được ân xá sau khi thi hành, có nên chỉnh sửa giấy tờ để phục hồi danh dự không?"""
  imperial_examination.5000.a: "Bút của Ta đâu!"
  imperial_examination.5000.a.cheater: "Ta sẽ cố hết sức..."
  imperial_examination.5000.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], tiến lên!""
  imperial_examination.5000.c: ""Giám khảo [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], xin xem #EMP câu trả lời của Ta#!...""
  imperial_examination.5000.d: ""Giám khảo [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], Ngài còn nhớ #EMP phụ huynh#! Ta chứ?""
  imperial_examination.5000.e: "#EMP liếc vào bài làm ẩn#!"
  imperial_examination.5000.f: "$imperial_examination.5000.d$"

  imperial_examination.duel.essay.critical_success.tt: "Ngài viết một bài luận được ca ngợi"
  imperial_examination.duel.essay.great_success.tt: "Ngài viết một bài luận tốt"
  imperial_examination.duel.essay.success.tt: "Bài luận của Ngài tạm ổn"
  imperial_examination.duel.essay.failure.tt: "Ngài thất bại trong việc viết bài luận đúng cách"

 #A [Exam] Classic
  imperial_examination.5050.t: "Nói Thay Các Hiền Giả"
  imperial_examination.5050.history: ""Để tuân theo quy định, theo Sử Ký, phải biết các bậc vua xưa."$imperial_examination.5050.desc$ Ta được yêu cầu thể hiện kiến thức về bài phát biểu [ROOT.Char.Custom('GetRandomHistoryPassage')]."
  imperial_examination.5050.changes: ""Để vượt khó vật chất, theo Kinh Dịch, phải tìm thấy bản thân như một phần của vũ trụ."$imperial_examination.5050.desc$ Ta được yêu cầu mô tả hiểu biết về các phương pháp bói toán trong văn bản, từ vạn hào đến Lục Thú."
  imperial_examination.5050.poetry: ""Để phản chiếu hành vi con người, theo Kinh Thi, phải đặt một tấm gương tự phản."$imperial_examination.5050.desc$ Ta được giao nhiệm vụ giải thích các bài thơ [ROOT.Char.Custom('GetRandomPoetryPassage')]."
  imperial_examination.5050.annals: ""Để phân tích bản chất hay chân tướng, theo Xuân Thu, phải học từ sai lầm của các triều đại xưa."$imperial_examination.5050.desc$ Ta phải trình bày [ROOT.Char.Custom('GetRandomAnnalsPassage')]."
  imperial_examination.5050.rites: ""Để hiểu trật tự thế giới, theo Lễ Ký, phải tôn trọng nghi lễ đúng đắn."$imperial_examination.5050.desc$ Ta cần liệt kê các phát biểu chính của [ROOT.Char.Custom('GetRandomRitesPassage')]."
  imperial_examination.5050.desc: "\n\nĐây là lời mở đầu trên bảng câu hỏi trước mặt Ta. Khoảng trống ở giữa [ROOT.Char.Custom('GetWritingMaterial')] trông vô cùng rộng.\n\nCho bài kiểm tra này,"
  imperial_examination.5050.a: "Như Thầy Khổng đã nói..."
  imperial_examination.5050.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], tiến lên!""
  imperial_examination.5050.c: ""Giám khảo [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], nếu Ngài thấy #EMP góc nhìn của Ta#!...""
  imperial_examination.5050.d: ""Giám khảo [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], #EMP gia đình Ta#! luôn trân trọng văn bản này.""
  imperial_examination.5050.e: "$imperial_examination.5000.e$"
  imperial_examination.5050.f: "$imperial_examination.5050.d$"
  imperial_examination.duel.classics.critical_success.tt: "Giải thích đoạn văn của Ngài thành công rực rỡ"
  imperial_examination.duel.classics.great_success.tt: "Ngài đưa ra những lập luận rất tốt về đoạn văn"
  imperial_examination.duel.classics.success.tt: "Giải thích của Ngài tạm ổn"
  imperial_examination.duel.classics.failure.tt: "Ngài làm hỏng đoạn văn"

 #[Exam] Poetry
  imperial_examination.5100.t: "Thơ [ROOT.Char.Custom('GetRegionalPoetryExam')]"
  imperial_examination.5100.desc: "Các thí sinh tập trung tại phòng thi, Ta chọn chỗ trong số họ. Dù đông, không gian yên tĩnh ngoài tiếng xào xạc của lá theo làn gió nhẹ. Hương đốt ở bàn thờ gần đó mang lại chút thanh thản.\n\nChúng Ta sẽ viết thơ bốn câu. Nếu Ta muốn thành công,"
  imperial_examination.5100.desc.river: "Ta phải để tâm tưởng trôi mượt như dòng sông."
  imperial_examination.5100.desc.straight: "Ta phải để tâm tưởng bén rễ sâu vào đất."
  imperial_examination.5100.desc.explosive: "Ta phải viết nồng nhiệt, không kiềm chế!"
  imperial_examination.5100.desc.lofty: "Ta phải để tâm tưởng bay đến tận chân trời."
  imperial_examination.5100.desc.fallback: "Ta phải lấy cảm hứng từ tất cả những bài thơ đã đọc."
  imperial_examination.5100.a: "Ta cầm lấy bút lông."
  imperial_examination.5100.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], tiến lên!""
  imperial_examination.5100.c: ""Giám khảo [ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], Ta tin Ngài biết tài năng Ta.""
  imperial_examination.5100.d: ""Giám khảo [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], #EMP phụ huynh Ta#! đã dạy Ta mọi thứ về thơ.""
  imperial_examination.5100.e: "$imperial_examination.5000.e$"
  imperial_examination.5100.f: "Ta biết viết gì..."
  imperial_examination.5100.g: "$imperial_examination.5000.e$"
  imperial_examination.duel.poetry.critical_success.tt: "Khi đọc thơ, thời gian dường như ngừng trôi"
  imperial_examination.duel.poetry.great_success.tt: "Bài thơ của Ngài tuyệt vời"
  imperial_examination.duel.poetry.success.tt: "Bài thơ của Ngài tạm ổn"
  imperial_examination.duel.poetry.failure.tt: "Ngài loạng choạng và thất bại khi viết thơ lôi cuốn"

  imperial_examination.5150.t: "Thi Bắn Cung"
  imperial_examination.5150.desc: "Các thí sinh tập trung tại trường bắn, Ta chọn chỗ trong số họ. \n\nDù đông, không gian yên tĩnh ngoại trừ tiếng va chạm nhẹ của áo giáp khi chúng Ta di chuyển. \n\nThí sinh trước Ta chuẩn bị [other_entrant.GetHerHis] cung."
  imperial_examination.5150.a: "Ta nắm cung chắc chắn."
  imperial_examination.5150.b: ""[ROOT.Char.MakeScope.Var('has_exam_taker').Char.GetFirstNameNoTooltip], Ngài bắn.""
  imperial_examination.5150.c: ""[ROOT.Char.MakeScope.Var('has_bribed_examiner').Char.GetFirstNameNoTooltip], xin kiểm tra #EMP mục tiêu của Ta#!...""
  imperial_examination.5150.d: ""Giám khảo [ROOT.Char.MakeScope.Var('has_blackmailed_examiner').Char.GetFirstNameNoTooltip], Ngài biết phụ huynh Ta, đúng không?""
  imperial_examination.5150.e: "$imperial_examination.5150.d$"

  imperial_examination.duel.archery.critical_success.tt: "Mũi tên của Ngài hoàn hảo"
  imperial_examination.duel.archery.great_success.tt: "Mũi tên của Ngài thành công tuyệt vời"
  imperial_examination.duel.archery.success.tt: "Mũi tên của Ngài tạm ổn"
