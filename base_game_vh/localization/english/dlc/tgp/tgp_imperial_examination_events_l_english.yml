 #Caught cheating!
  imperial_examination.6000.t: "Bị Bắt!"
  imperial_examination.6000.desc: "Mồ hôi tuôn ướt lưng khi giám khảo [examiner.GetFirstName] nghiêm khắc nhìn Ta từ đầu tới chân, tay đặt lên lưng [examiner.GetHerHis]. "Làm sao #EMP dám#! ngươi, đồ hỗn xược. Ta nên báo ngay với [activity.GetHost.GetTitleAsNameNoTooltip|U] để [activity.GetHost.GetHerHis] tôn quý biết về #EMP việc làm xằng bậy#! của ngươi. Nếu may mắn, ngươi sẽ #EMP chỉ#! bị chặt da trước khi chịu hình phạt."\n\nMồ hôi chảy dọc lưng, Ta vội đánh giá tình hình và khàn cổ hắng giọng:"
  imperial_examination.6000.a: ""Ta bị vu oan, có thấy không?!""
  imperial_examination.6000.b: ""Chắc chắn chúng ta có thể xoá chuyện này, bằng cách nào đó!""
  imperial_examination.6000.c: ""Ngươi biết đấy, [friend_to_sacrifice.GetTitledFirstNameNoTooltip] mới là #EMP thủ phạm thật#!...!""
  imperial_examination.6000.d: ""Sẽ #EMP không bao giờ#! xảy ra lần nữa, Ta thề!""

  imperial_examination.6000.misdirection.success.tt: "Ngài thuyết phục thành công [examiner.GetShortUIName]"
