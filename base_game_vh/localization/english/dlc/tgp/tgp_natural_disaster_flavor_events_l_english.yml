l_english:
  natural_disaster_flavor_events.0001.t: "Khi Kẻ Cướp Tập Họp"
  natural_disaster_flavor_events.0001.desc: "Giữa đống đổ nát, kẻ cướp tập trung để tận hưởng những linh hồn không may đã không nghe lời cảnh báo từ các lực lượng thiên nhiên. Những sợi gân bị rút ra khỏi xác chết, để lộ thịt thối rữa cho bất cứ ai đủ can đảm nhìn.\n\nKhông nhiều người dám mạo hiểm tìm kiếm ở vùng đất bị nguyền rủa này, nhưng nơi người khác thất bại, cơ hội mới lại xuất hiện."
  natural_disaster_flavor_events.0001.a: "Tìm kiếm vật quý trong đống đổ nát."
  natural_disaster_flavor_events.0001.a.gold.toast: "Ngài tìm thấy một ít vàng"
  natural_disaster_flavor_events.0001.a.provisions.toast: "Ngài tìm thấy một ít lương thực"
  natural_disaster_flavor_events.0001.a.artifact.toast: "Ngài tìm thấy một cổ vật"
  random_misc_artifact: "Chiếc Nhẫn Bỏ Quên"
  random_misc_artifact_desc: "Một chiếc nhẫn kỳ lạ được khai quật giữa đống đổ nát do chính thiên nhiên gây ra."
  natural_disaster_flavor_events.0001.b: "Hãy tìm kiếm những người sống sót."
  natural_disaster_flavor_events.0001.b.success.toast: "Tìm và cứu sống một người sống sót"
  natural_disaster_flavor_events.0001.b.failure.toast: "Việc tìm kiếm của Ngài vô ích"
  natural_disaster_flavor_events.0001.c: "Ở đây chẳng có gì cho chúng ta."

  natural_disaster_flavor_events.0005.t: "Ác Mộng Tỉnh Giấc"
  natural_disaster_flavor_events.0005.desc: "Ta bị đánh thức bởi tiếng hét của những người chạy khắp trại theo mọi hướng. Giữa sự hỗn loạn, Ta lơ mơ cố đứng vững để quan sát những gì đang xảy ra, nhưng bị rung chuyển khi một âm thanh lạ dần tiến gần từ xa.\n\nVới những gì sắp diễn ra, Ta phải hành động ngay trước khi quá muộn."
  natural_disaster_flavor_events.0005.a: "Mỗi người tự lo cho mình!"
  natural_disaster_flavor_events.0005.a.success.toast: "Ngài tìm được một nơi khá an toàn"
  natural_disaster_flavor_events.0005.a.failure.toast: "Ngài không kịp tìm nơi an toàn"
  natural_disaster_flavor_events.0005.b: "Ta phải ra khỏi đây, nhanh chóng."
  natural_disaster_flavor_events.0005.b.success.toast: "Ngài tìm được nơi trú ẩn đủ an toàn"
  natural_disaster_flavor_events.0005.b.failure.toast: "Kiến thức của Ngài về những lực lượng này còn thiếu"
  tgp_selfish_actions_character_modifier: "Suýt Nguy"
  tgp_selfish_actions_character_modifier_desc: "Sức bền của nhân vật này chứng tỏ giá trị trong cuộc gặp gỡ với thiên nhiên."
  tgp_finding_safe_spot_character_modifier: "Nơi An Toàn"
  tgp_finding_safe_spot_character_modifier_desc: "Khả năng quan sát xung quanh của nhân vật này đã đưa họ đến nơi an toàn."

  natural_disaster_flavor_events.0010.t: "Linh Hồn Tuyệt Vọng"
  natural_disaster_flavor_events.0010.desc: "Một đám đông những người tuyệt vọng và bị tước đoạt tụ tập trước ngưỡng thảm họa. Cảm xúc lan tỏa qua đám người rách nát – không khí đầy tiếng nức nở, rên rỉ và la hét.\n\nNhìn thấy đoàn tùy tùng của Ta, họ bước tới, gần như đồng loạt, nửa chết và mắt trũng sâu, tay giơ ra và quỳ xuống cầu khẩn.\n\nHọ nghĩ chúng Ta đến để giúp, nhưng Ta có thể làm được bao nhiêu cho quá nhiều người?"
  natural_disaster_flavor_events.0010.a: "Đảm bảo với họ rằng sự cứu giúp đang đến."
  natural_disaster_flavor_events.0010.a.success.toast: "Trấn an họ rằng cứu trợ đang đến"
  natural_disaster_flavor_events.0010.a.failure.toast: "Đám đông đã chờ quá lâu"
  natural_disaster_flavor_events.0010.b: "Nói một lời dối trá với những người tìm câu trả lời."
  natural_disaster_flavor_events.0010.b.success.toast: "Ngài nói dối đám đông"
  natural_disaster_flavor_events.0010.b.failure.toast: "Người dân nhìn thấu dối trá của Ngài"
  natural_disaster_flavor_events.0010.c: "Đừng để tay bẩn của họ chạm vào Ta!"
  natural_disaster_flavor_events.0010.c.tt: "Đoàn tùy tùng của Ngài dễ dàng đẩy đám đông yếu ớt sang một bên."
  tgp_deceitful_overconfidence_character_modifier: "Bỏ Rơi Kẻ Bất Hạnh"
  tgp_deceitful_overconfidence_character_modifier_desc: "Nhân vật này chọn bỏ rơi những người tìm hướng dẫn trong thời khắc khó khăn."
  tgp_abandoned_population_modifier: "Dân Bị Bỏ Rơi"
  tgp_abandoned_population_modifier_desc: "Tỉnh này có những kẻ nói dối và hèn nhát làm lãnh đạo."

  natural_disaster_flavor_events.0015.t: "Hành Động Vị Tha"
  natural_disaster_flavor_events.0015.desc: "Một cuộc đi dạo trong vườn cùng [spouse.GetFirstName], [heir.GetFirstName] và [courtier.GetFirstName] bỗng biến thành cơn ác mộng.\n\nMột tiếng thét piercing vang khắp thị trấn, khiến bất cứ ai trong phạm vi đều cảm thấy sợ hãi. Ta nhìn [spouse.GetFirstNameNoTooltip] để xác nhận, nhưng gương mặt [spouse.GetHerHis] đã nói lên tất cả.\n\nKhông cần suy nghĩ nhiều, Ta biết rằng chúng Ta cần tìm nơi an toàn hơn nơi đang đứng."
  natural_disaster_flavor_events.0015.a: "Giải cứu phối ngẫu của ngài, [spouse.GetFirstNameNoTooltip]."
  natural_disaster_flavor_events.0015.a.success: "Ngài thoát khỏi thảm họa không bị thương"
  natural_disaster_flavor_events.0015.a.failure: "Bị Thương"
  natural_disaster_flavor_events.0015.b: "Giúp người thừa kế [heir.GetFirstNameNoTooltip]."
  natural_disaster_flavor_events.0015.b.success: "$natural_disaster_flavor_events.0015.a.success$"
  natural_disaster_flavor_events.0015.b.failure: "$natural_disaster_flavor_events.0015.a.failure$"
  natural_disaster_flavor_events.0015.c: "Hỗ trợ quan lại [courtier.GetFirstNameNoTooltip]."
  natural_disaster_flavor_events.0015.c.success: "$natural_disaster_flavor_events.0015.a.success$"
  natural_disaster_flavor_events.0015.c.failure: "$natural_disaster_flavor_events.0015.a.failure$"
  natural_disaster_flavor_events.0015.d: "Cứu #EMP chính mình.#!"
