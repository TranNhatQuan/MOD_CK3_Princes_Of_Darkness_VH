  favor_dynastic_cycle_era: "Ưu Ái Một Thời Đại"
  favor_dynastic_cycle_era_hegemon_desc: "Gánh nặng quốc gia đè nặng lên vai ta. [mandate_of_heaven|E] là của ta để chịu và duy trì, và bánh xe [GetSituation('dynastic_cycle').GetName] quay không ngừng theo từng quyết định. Tương lai mọi người dưới trời nằm trong tay ta; liệu tương lai sẽ là hòa bình thịnh vượng, hay chiến thắng giành được và các chủ quyền ngoại bang phải khuất phục?"
  favor_dynastic_cycle_era_chaos_desc: "Nếu một ngày ta chấp nhận trách nhiệm thiêng liêng của [mandate_of_heaven|E], thì ta phải hành xử như một chủ quyền và cân nhắc đến số đông sẽ nhìn ta như chủ sở hữu tất cả đất đai dưới Trời. Nếu – thậm chí #EMP khi#! – thời điểm đó tới, liệu tương lai của họ sẽ là hòa bình thịnh vượng, hay chiến thắng giành được và các chủ quyền ngoại bang phải khuất phục?"
  favor_dynastic_cycle_era_decision_hegemon_tooltip: "[son_of_heaven|E] có thể đặt [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] hoặc [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] làm [favored_era|E]"
  favor_dynastic_cycle_era_decision_chaos_tooltip: "Mỗi [independent_ruler|E] trong [dynastic_cycle|E] có thể đặt [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] hoặc [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] làm [favored_era|E]"
