  claim_mandate_turn_independent_realms_celestial_desc: "Mỗi [independent_ruler|E] trong [dynastic_cycle|E] mà có [GetGovernment( 'celestial_government' ).GetNameWithIcon] [government|E] hoặc cùng [heritage|E] với #V ngươi#! sẽ trở thành [vassal|E] của ngươi và theo [GetGovernment( 'celestial_government' ).GetNameWithIcon] [government|E]"

