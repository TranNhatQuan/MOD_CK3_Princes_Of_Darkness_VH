 # Claim Mandate
  situation_dynastic_cycle_claim_mandate_decision: "Tuyên bố Thiên Mệnh"
  situation_dynastic_cycle_claim_mandate_decision_desc: "Giữa một [GetTitleByKey('h_china').GetNameNoTier] chia rẽ, Thiên Đường không bao giờ bỏ sót kẻ xứng đáng với ân sủng thần thánh, người kế thừa nắm giữ Thiên Mệnh tối cao nhất.\n\nChu kỳ Triều đại phải tiếp tục và, vì vậy... #EMP Ta#! đã được Thiên Đường chọn!"
  situation_dynastic_cycle_claim_mandate_decision_confirm: "Khẳng định Hegemony Hoàng đế"
  situation_dynastic_cycle_claim_mandate_decision_county_percentage_tt: "Ngươi kiểm soát ít nhất [SCOPE.ScriptValue('claim_mandate_china_county_percentage_value')|V%0] của [GetTitleByKey('h_china').GetDefinitiveNamePossessive] [de_jure|E] [counties|E]"
  situation_dynastic_cycle_claim_mandate_decision_phase_tt: "Ngươi chọn [situation.GetName] [situation_situations_possessive|E] cho [dynastic_cycle_era_type_stable|E] kế tiếp"

  situation_dynastic_cycle_claim_mandate_decision_tooltip: "Giành [GetTitleByKey('h_china').GetDefinitiveName|U] [title|E] và chuyển [GetSituation('dynastic_cycle').GetName] sang [dynastic_cycle_era_type_stable|E]"
  claim_mandate_decision_county_percentage_tt: "#V Ngươi#! phải kiểm soát ít nhất [SCOPE.ScriptValue('claim_mandate_china_county_percentage_value')|V%0] của [GetTitleByKey('h_china').GetDefinitiveNamePossessive] [de_jure|E] [counties|E] #weak (Hiện tại: [SCOPE.ScriptValue('claim_mandate_china_control_percent_value')|0]%)#!"
  claim_mandate_decision_phase_tt: "[THIS.Char.GetShortUIName|U] sẽ chọn [dynastic_cycle_era_type_stable|E] kế tiếp của [situation.GetName]"
  claim_mandate_turn_vassal_celestial_desc: "Mỗi [de_jure|E] [vassal|E] của [GetTitleByKey('h_china').GetDefinitiveName|U] trong [realm|E] của ngươi mà không phải [GetGovernment( 'republic_government' ).GetNameWithIcon] hay [GetGovernment( 'theocracy_government' ).GetNameWithIcon] sẽ theo [GetGovernment( 'celestial_government' ).GetNameWithIcon] [government|E]"
