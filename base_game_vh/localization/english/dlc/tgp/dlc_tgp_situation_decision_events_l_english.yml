l_english:
 ##################################################
 # STRUGGLE EVENTS 
 ##################################################
  tgp_dynastic_cycle.0051.t: "Chu kỳ triều đại $dynastic_cycle$ — [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
  tgp_dynastic_cycle.0051.desc.intro: "[GetSituation('dynastic_cycle').GetTopSubRegion.GetName] là một vùng đất rộng lớn và thịnh vượng. Được trời ban mệnh trị vì, chủ quyền của nó phải cai trị công bằng để duy trì ân sủng thần thánh, trong khi những hành vi bạo ngược sẽ khiến Trời giận dữ.\n\nTrong thời gian này"
  tgp_dynastic_cycle.0051.desc.advancement: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], mọi người trong vương quốc đều được kỳ vọng đạt tiến bộ lớn về công nghệ và tích lũy của cải."
  tgp_dynastic_cycle.0051.desc.expansion: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], mọi người trong vương quốc đều được kỳ vọng thực hiện các cuộc chinh phạt và chiến công vĩ đại."
  tgp_dynastic_cycle.0051.desc.conquest: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], số phận của mọi người trong vương quốc trở nên bất định."
  tgp_dynastic_cycle.0051.desc.corruption: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], [GetTitleByKey('h_china').GetHolder.GetSheHe] đã không thừa kế được đức hạnh của tổ tiên [GetTitleByKey('h_china').GetHolder.GetHerHis]. Nhà nước đã trở thành con mồi của sự suy đồi đạo đức và những vị quan tà ác với tư cách thấp kém."
  tgp_dynastic_cycle.0051.desc.consolidation: "$tgp_dynastic_cycle.0051.desc.intro$ [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetType.GetNameNoTooltip|l], [GetSituation('dynastic_cycle').GetTopSubRegion.GetNameNoTooltip] bị chia rẽ khi các lãnh chúa tranh giành Mệnh Trời. Việc theo đuổi tu dưỡng đức hạnh đã bị bỏ rơi trong thời loạn này."
  tgp_dynastic_cycle.0051.desc.emperor: "\n\nLà chủ quyền, trách nhiệm của ta là duy trì Mệnh Trời và cai trị công bằng, như Ngôi Sao Bắc Đẩu quanh đó tất cả các thiên thể quay."
  tgp_dynastic_cycle.0051.desc.advancement_movement: "Người ta nói nên làm quan thanh liêm trong thời bình, nhưng không thể phủ nhận rằng thời loạn thường thưởng cho kẻ mưu mô hơn người ngay thẳng..."
  tgp_dynastic_cycle.0051.desc.expansion_movement: "\n\nNhững người như ta, phục vụ như các đại tướng quyền lực, sẽ đảm bảo sự ổn định của vương quốc."
  tgp_dynastic_cycle.0051.desc.pro_hegemon_movement: "\n\nChỉ có chủ quyền mới thực hiện được lời hứa và ta sẽ ủng hộ [GetTitleByKey('h_china').GetHolder.GetHerHim] không ngừng!"
  tgp_dynastic_cycle.0051.desc.conservative_movement: "\n\nGia tộc ta sẽ luôn tuân theo sự chỉ dẫn của Trời."
  tgp_dynastic_cycle.0051.desc.unaligned_movement: "\n\nVai trò của ta trong chu kỳ bất tận này vẫn chưa xác định. Trời sẽ dẫn dắt khi ta sẵn sàng đưa ra lập trường."
  tgp_dynastic_cycle.0051.desc.interloper: "\n\nCó thể đây không phải là đất tổ tiên, nhưng nơi này giàu cơ hội khó cưỡng, miễn là chúng ta cẩn thận từng bước."
  tgp_dynastic_cycle.0051.a.emperor: "Nguyện triều đại của chúng ta kéo dài vạn thọ!"
  tgp_dynastic_cycle.0051.a.involved: "Của cải và danh dự phụ thuộc vào Trời!"
  tgp_dynastic_cycle.0051.a.interloper: "May mắn bất định như gió và mây."
  intro_event_joined_movement: "Tham gia [my_movement.GetName]"
  tgp_dynastic_cycle.0052.t: "Tham gia [ROOT.Char.Custom('GetMyMovementNoTooltip')]"
  tgp_dynastic_cycle.0052.desc.intro_common: "[GetTitleByKey('h_china').GetHolder.GetName] được Trời xức mệnh thực hiện lời hứa của một thời đại [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetName]. Trong khi đó, ta đã chọn con đường của [ROOT.Char.Custom('GetMyMovement')]."
  tgp_dynastic_cycle.0052.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nCó nhiều cám dỗ và những người có ảnh hưởng xung quanh. Hiện tại, ta nên giữ khoảng cách với mọi mưu mô chính trị và tập trung vào điền trang và văn phòng địa phương của mình.\n\n"
  tgp_dynastic_cycle.0052.desc.advancement: "Ta hy vọng vương quốc thịnh vượng và người dân được tu dưỡng cuộc sống. Có thể một ngày nào đó ta sẽ thấy việc tham gia [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('advancement_movement').GetName] hấp dẫn hơn."
  tgp_dynastic_cycle.0052.desc.expansion: "Ta sẽ theo dõi sát tin tức từ các mặt trận và cổ vũ mọi cuộc chinh phục. Có thể lúc đó ta sẽ cân nhắc gia nhập [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('expansion_movement').GetName]."
  tgp_dynastic_cycle.0052.desc.conquest: "Mặc dù ta sẽ quan sát sự trị vì của [ROOT.Char.GetTopLiege.GetDynastyName] và hành động phù hợp nếu họ mất hoặc được Trời ban phước."
  tgp_dynastic_cycle.0052.desc.instability: "Tuy nhiên, ta vẫn lo lắng về hướng đi của vương quốc và e ngại [ROOT.Char.GetTopLiege.GetDynastyName] mất đi [ROOT.Char.GetTopLiege.GetLegitimacyType.GetFlavorName(ROOT.Char.GetTopLiege.GetLegitimacyLevel.Self)]."
  tgp_dynastic_cycle.0052.a: "Ta sẽ giữ quan điểm trung lập."
  tgp_dynastic_cycle.0053.t: "$tgp_dynastic_cycle.0052.t$"
  tgp_dynastic_cycle.0053.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nSẽ có nhiều cơ hội học chiến thuật và chiến lược quân sự từ các thành viên. Trên đỉnh của thang là bàn làm việc của [ROOT.Char.GetTopLiege.GetCouncillor('councillor_marshal').GetCouncilTitle], đỉnh cao của sự nghiệp quân sự mà mọi người đều hướng tới."
  tgp_dynastic_cycle.0053.desc.advancement: "Mặc dù vậy, lập trường hiện tại của [ROOT.Char.GetTopLiege.GetName] chưa ủng hộ chúng ta toàn diện. Cần thực hiện các hành động để hướng [GetSituation('dynastic_cycle').GetName] tiến tới [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] nhằm khai thác tiềm năng."
  tgp_dynastic_cycle.0053.desc.expansion: "Ý trời là chinh phục và chúng ta đã sẵn sàng!"
  tgp_dynastic_cycle.0053.desc.conquest: "Ý trời là chinh phục và [ROOT.Char.GetTopLiege.GetDynastyName] dẫn đầu bằng gương mẫu."
  tgp_dynastic_cycle.0053.desc.instability: "Mặc dù thời cuộc bất định và tầm nhìn mờ mịt. Chỉ quân đội mới giữ trật tự, hy vọng [ROOT.Char.GetTopLiege.GetDynastyName] nhận ra điều đó sớm."
  tgp_dynastic_cycle.0053.a: "Chỉ kẻ mạnh nhất mới chiến thắng!"
  tgp_dynastic_cycle.0054.t: "$tgp_dynastic_cycle.0052.t$"
  tgp_dynastic_cycle.0054.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nMục tiêu của chúng ta là chia sẻ vẻ đẹp của nghệ thuật và tri thức. Tu dưỡng tâm hồn và tinh thần là cách chắc chắn được Trời ban ân."
  tgp_dynastic_cycle.0054.desc.advancement: "Triều đại [ROOT.Char.GetTopLiege.GetDynastyName] đang đi cùng con đường, mang lại thịnh vượng và khai sáng cho mọi người dưới trời! Hãy giữ như vậy."
  tgp_dynastic_cycle.0054.desc.expansion: "[ROOT.Char.GetTopLiege.GetDynastyName] đang đi trên con đường tàn phá. Quân đội tốn kém, tướng lĩnh hay thay đổi và nguy hiểm. Chúng ta phải chuyển quyền lực khỏi họ."
  tgp_dynastic_cycle.0054.desc.conquest: "[ROOT.Char.GetTopLiege.GetDynastyName] còn mới, do đó dễ nhận ra ý trời thông qua thi cử và quan liêm chính!"
  tgp_dynastic_cycle.0054.desc.instability: "[ROOT.Char.GetTopLiege.GetDynastyName] đã lạc đường. Tuy nhiên, chúng ta có thể giúp đưa họ về đúng lối bằng việc tổ chức thi cử thường xuyên và chọn quan có công."
  tgp_dynastic_cycle.0054.a: "Công đức vượt lên trên tất cả."
  tgp_dynastic_cycle.0055.t: "$tgp_dynastic_cycle.0052.t$"
  tgp_dynastic_cycle.0055.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nTa và các thành viên phong trào đã gửi gắm mạng sống cho [GetTitleByKey('h_china').GetHolder.GetHerHim]. Nhờ sự khôn ngoan và dẫn dắt của [GetTitleByKey('h_china').GetHolder.GetHerHis], chúng ta sẽ mang đến "
  tgp_dynastic_cycle.0055.desc.advancement: "thịnh vượng, của cải và tiến bộ công nghệ cho mọi người dưới trời."
  tgp_dynastic_cycle.0055.desc.expansion: "vùng đất mới và dân chúng công nhận [GetTitleByKey('h_china').GetHolder.GetHerHis] số mệnh trị vì công bằng."
  tgp_dynastic_cycle.0055.desc.conquest: "mọi người dưới trời công nhận [GetTitleByKey('h_china').GetHolder.GetDynastyName] xứng đáng với Mệnh Trời."
  tgp_dynastic_cycle.0055.desc.instability: "trả lại ánh sáng trong thời kỳ u ám này."
  tgp_dynastic_cycle.0055.a: "Ngợi khen Trời và [ROOT.Char.GetTopLiege.GetDynastyNameNoTooltip]!"
  tgp_dynastic_cycle.0056.t: "$tgp_dynastic_cycle.0052.t$"
  tgp_dynastic_cycle.0056.desc.intro: "$tgp_dynastic_cycle.0052.desc.intro_common$\n\nTruyền thống do các thế hệ trước xây dựng nên là nền tảng cho bộ máy quan lại của [ROOT.Char.GetTopLiege.GetDynastyName]."
  tgp_dynastic_cycle.0056.desc.advancement: "Tuy nhiên, [ROOT.Char.GetTopLiege.GetName] bị mù quáng bởi thi cử, cho nông dân tỉnh lẻ vào văn phòng. Sớm thôi, họ sẽ bôi nhọ lịch sử chúng ta."
  tgp_dynastic_cycle.0056.desc.expansion: "Tuy nhiên, [ROOT.Char.GetTopLiege.GetName] bận rỗi phí mạng anh em trong các cuộc chiến vô nghĩa. Trong khi các tướng lĩnh tự tung tự tác, chiếm quyền lực và chức vụ từ gia đình chúng ta."
  tgp_dynastic_cycle.0056.desc.conquest: "[ROOT.Char.GetTopLiege.GetName] phải nhận ra đây là cách duy nhất để giữ trật tự vương quốc. Mọi người dưới Trời sẽ công nhận sự cai trị của [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], nếu được các gia đình thân yêu hậu thuẫn."
  tgp_dynastic_cycle.0056.desc.instability: "[ROOT.Char.GetTopLiege.GetName] đã mất nhiều uy tín. Cách duy nhất để khôi phục ân sủng của [ROOT.Char.GetTopLiege.GetHerHis] là đảm bảo [ROOT.Char.GetTopLiege.GetSheHe] tuân theo gia tộc chúng ta."
  tgp_dynastic_cycle.0056.a: "Sức mạnh được tìm thấy trong liên kết gia tộc."

 ### ENTER STABILITY - NEW DYNASTY ### 0061 - 0070 ###

  tgp_dynastic_cycle.0061.t: "Được Trời Yêu Thương [GetTitleByKey('h_china').GetHolder.Custom('GetDaughterSon')|U]"
  tgp_dynastic_cycle.0061.desc: "Người ta nói rằng Trời công bằng và luôn đứng về phía kẻ chính trực. Cũng có câu rằng kẻ thắng làm vua, kẻ thua làm giặc. Ngai vàng của [GetTitleByKey('h_china').GetNameNoTierNoTooltip] giờ đây #EMP thuộc về ta#!, cùng với sự chấp thuận thiên thượng để cai trị toàn bộ [GetTitleByKey('h_china').GetNameNoTierNoTooltip].\n\nTa phải quyết định hướng đi cho các quan mới và đạo quân quan lại của họ để tập trung nỗ lực."
  tgp_dynastic_cycle.0061.a: "Nhiệm vụ của chúng ta là đề cao đức hạnh và diệt trừ tà ác."
  tgp_dynastic_cycle.0061.b: "Dưới bầu trời rộng lớn, #EMP tất cả#! đều là thần dân của [ROOT.Char.GetTitleAsNameNoTooltip]."
  tgp_dynastic_cycle.0061.c: "Đứng trên đỉnh thế giới, mọi thứ khác trở nên nhỏ bé."

 # Notification for relevant people

  tgp_dynastic_cycle.0062.desc.involved: "Ân sủng Trời ban luôn thịnh suy theo đức hạnh — hay thiếu đức hạnh — của các chủ quyền được chọn.\n\nGiờ đây, ngôi sao của [GetTitleByKey('h_china').GetHolder.GetDynastyName] đang lên, và [GetTitleByKey('h_china').GetHolder.GetTitledFirstName] rõ ràng sở hữu sự chấp thuận thần thánh của Trời."
  tgp_dynastic_cycle.0062.desc.interloper: "Khi vận may của một [GetTitleByKey('h_china').GetHolder.Custom('WomanManPossessive')] giảm, vận may của người khác tăng, vì ngay cả vua chúa cũng không miễn nhiễm trước vận mệnh.\n\n[GetTitleByKey('h_china').GetHolder.GetTitledFirstName] đã giành được Mệnh Trời, và tất cả đều phải sấp mình trước vị chủ quyền mới này."
  tgp_dynastic_cycle.0062.desc.uninvolved: "Đế quốc lên xuống, cũ nhường chỗ cho mới. Ngai vàng của [GetTitleByKey('h_china').GetNameNoTierNoTooltip] đã thuộc về [GetTitleByKey('h_china').GetHolder.GetTitledFirstName], và tất cả phải ghi nhận vị chủ quyền mới này, dù ở trong hay ngoài lãnh thổ của [GetTitleByKey('h_china').GetHolder.GetHerHis].\n\nNhững thay đổi theo gió của vận mệnh không thể xem nhẹ."
  tgp_dynastic_cycle.0062.a: "Chúng ta nên đánh giá khả năng của [GetTitleByKey('h_china').GetHolder.GetHerHis] một cách cẩn thận."
  tgp_dynastic_cycle.0062.b: "$tgp_dynastic_cycle.0072.b$"

 ### ENTER STABILITY - EXISTING DYNASTY ### 0071 - 0080 ###

  tgp_dynastic_cycle.0071.t: "Mưa Tạnh Trời Lại Sáng"
  tgp_dynastic_cycle.0071.desc: "Những đám mây bão còn sót lại đã tan, và bầu trời quang đãng lại bao phủ [GetTitleByKey('h_china').GetNameNoTierNoTooltip]. Ta đã vượt qua thử thách trước mặt, và giờ đây không ai có thể nghi ngờ rằng ta thật sự là [ROOT.Char.Custom('GetDaughterSon')] được Trời chọn.\n\nSau thời gian gian khổ, ta phải vạch ra hướng đi mới cho tương lai, để tất cả đoàn kết theo một mục tiêu duy nhất."
  tgp_dynastic_cycle.0071.a: "$tgp_dynastic_cycle.0061.a$"
  tgp_dynastic_cycle.0071.b: "$tgp_dynastic_cycle.0061.b$"
 
 # Notification for relevant people

  tgp_dynastic_cycle.0072.desc.advancement: "Sau một giai đoạn khó khăn và hỗn loạn, [GetTitleByKey('h_china').GetNameNoTierNoTooltip] lại yên bình. Những thử thách do Trời ban đã vượt qua, và mọi người có thể yên tâm rằng [GetTitleByKey('h_china').GetHolder.GetTitledFirstName] vẫn được Trời yêu thích."
  tgp_dynastic_cycle.0072.desc.expansion: "$tgp_dynastic_cycle.0051.desc.advancement$"
  tgp_dynastic_cycle.0072.desc.conquest: "$tgp_dynastic_cycle.0051.desc.advancement$"
  tgp_dynastic_cycle.0072.desc.involved: "Đối với một số người, điều này báo hiệu tham vọng của họ đã chết, nhưng với nhiều người lại là một hơi thở nhẹ nhõm."
  tgp_dynastic_cycle.0072.desc.interloper: "Thời bình hiếm khi cho các anh hùng can đảm cơ hội nổi bật, nhưng những con đường khác để thăng tiến giờ đây có thể xuất hiện."
  tgp_dynastic_cycle.0072.desc.uninvolved: "Dường như triều đại [GetTitleByKey('h_china').GetHolder.GetDynastyName] vẫn còn sức sống."
  tgp_dynastic_cycle.0072.a: "Gió xuân thổi, cỏ lại mọc xanh."
  tgp_dynastic_cycle.0072.b: "Cách duy nhất là thuận theo Thiên mệnh."
  tgp_china_consolidation.remain_independent: "Tiếp tục duy trì vị thế [independent_ruler|E]"

 ### ENTER CONSOLIDATION ###

  tgp_dynastic_cycle.0081.t: "Đế Quốc Thống Nhất Lâu Đã Phải Chia"
  tgp_dynastic_cycle.0081.desc: "Chớp mắt, Trời rung chuyển và thế giới đảo lộn.\n\nCác quan trung thành chạy đi tìm chủ mới, binh lính bỏ nhiệm vụ, và giờ đây ngay cả nông dân cũng bỏ làng ta vì sợ biến loạn sắp tới.\n\nMọi tai họa đều được gán cho #EMP triều đại tàn ác#! của ta, và khắp nơi rêu rao rằng ta đã mất Mệnh Trời!"
  tgp_dynastic_cycle.0081.a: "Cây ngã, khỉ tản."
 
 # Notification for relevant people

  tgp_dynastic_cycle.0082.desc.involved: "Ý chí dân và ý chí Trời là một, và trong trường hợp này, câu ngạn ngữ đã đúng - #EMP Mệnh Trời đã bị mất#!.\n\nQuốc gia tan vỡ. Rồng hổ tranh giành ngai vàng một cách tham lam.\n\nNhững thời kỳ hỗn loạn đang chờ phía trước."
  tgp_dynastic_cycle.0082.desc.interloper: "Nơi từng có một, giờ có nhiều.\n\nVới việc mất Mệnh Trời, không còn người cai trị hợp pháp để tuân theo, và mọi hình thức giả tạo đều bị vứt bỏ, mọi tham vọng che giấu lộ ra.\n\nKẻ táo bạo phải nắm lấy cơ hội khi nó đến."
  tgp_dynastic_cycle.0082.desc.uninvolved: "Một quốc gia hùng mạnh bốc cháy, và thần dân trang bị vũ khí để tranh giành tàn dư.\n\n[GetTitleByKey('h_china').GetNameNoTierNoTooltip] đã tan rã, hỗn loạn là điều duy nhất chắc chắn trong tương lai gần, và những ai tham gia vào biến loạn sắp tới bước vào hang hổ một cách tự nguyện."
  tgp_dynastic_cycle.0082.a: "Khủng hoảng là cơ hội."

 ### ENTER CORRUPTION ###

  tgp_dynastic_cycle.0091.t: "Điềm Gở Của Khốn Khổ"
  tgp_dynastic_cycle.0091.desc: "Dù ta nỗ lực cai trị công bằng, ngày càng nghe nhiều lời thì thầm bất mãn.\n\nTa phải đối diện với khả năng khó chịu rằng niềm tin vào sự yêu thích của Trời đối với triều đại của ta có thể dao động, vì những cảm xúc đó có thể làm rung chuyển nền móng vững chắc nhất của ngai vàng."
  tgp_dynastic_cycle.0091.a: "Nước giữ cho thuyền nổi cũng có thể lật nó."
 
 # Notification for relevant people

  tgp_dynastic_cycle.0092.desc.involved: "Thế giới đang chịu một căn bệnh. Một chứng bệnh của tinh thần.\n\nÁc tâm và hành vi sai trái lan tràn nơi các cột trụ đức hạnh từng đứng vững. Quan lại vô đạo làm giàu trên mồ hôi của dân, và binh sĩ cân nhắc việc cướp bóc còn hơn bảo vệ."
  tgp_dynastic_cycle.0092.desc.interloper: "Dường như không phải mọi thứ đều ổn tại [GetTitleByKey('h_china').GetNameNoTierNoTooltip].\n\nMỗi ngày trôi qua, đoàn lữ hành khác lại rời bỏ vùng đất để tìm bãi cỏ xanh hơn. Ngay cả những thương nhân tham lam nhất cũng ngày càng ưa thích đất ta hơn, dệt nên những câu chuyện tống tiền đáng thương bằng cả gươm lẫn bút."
  tgp_dynastic_cycle.0092.desc.uninvolved: "$tgp_dynastic_cycle.0092.desc.interloper$"
  tgp_dynastic_cycle.0092.a: "Tội ác là một căn bệnh không thuốc nào chữa được."

  tgp_dynastic_cycle.9001.t: "Nền Tảng Của Một Quốc Gia"
  tgp_dynastic_cycle.9001.desc: "Như mọi dòng sông chảy về đông, dân chúng dưới trời cũng nhìn ta như chủ quyền của họ.\n\nBước đầu để khai triều là tuyên bố tên lãnh thổ, để tất cả biết gọi nơi mình thuộc về.\n\nDanh xưng nào sẽ vang vọng qua lịch sử?"
  tgp_dynastic_cycle.9001.a: "Hãy để mọi người nghe và biết!" # 咸使聞知

  tgp_dynastic_cycle.9002.t: "Các Nguyên Tố Của Đức Hạnh"
  tgp_dynastic_cycle.9002.desc: "Trời có năm nguyên tố cần được điều hòa và chăm sóc hài hòa.\n\nMộc, Hỏa, Thổ, Kim và Thủy.\n\nTừ thời cổ đại, mỗi triều đại mới đều chọn một nguyên tố làm biểu tượng và nhuộm cờ theo đó, và giờ ta cũng phải chọn."
  tgp_dynastic_cycle.9002.yellow: "Ta chọn #color:{0.82,0.77,0.5};bold yellow#!; biểu tượng của đất, bất biến như nền tảng của ta."
  tgp_dynastic_cycle.9002.red: "Hãy để nó như #color:{0.80,0.3,0.3};bold red#! như lửa cháy rực trong tim ta."
  tgp_dynastic_cycle.9002.white: "Một #color:{1.0,1.0,1.0};bold white#! tinh khiết và không vết nhơ, như kim loại cứng cỏi."
  tgp_dynastic_cycle.9002.black: "Cờ của ta nên là #color:{0.4,0.39,0.37};bold black#! như nước mênh mông vô tận."
  tgp_dynastic_cycle.9002.green: "Nó nên là #color:{0.4,0.61,0.3};bold green#! của lá xuân và sự tươi tốt."

  tgp_dynastic_cycle_decision_event.0101.t: "$renounce_noble_family_title_decision$"
  tgp_dynastic_cycle_decision_event.0101.desc: "Ta vật lộn với núi tài liệu ngày càng cao. Khi nhắm mắt, chỉ nghe tiếng trẻ con chơi, người già trò chuyện, người lớn thưởng thức tiệc. Ôi mùi [ROOT.Char.Custom('RegionalEdibleMeat')] đang nướng!\n\nTa đã làm việc cực nhọc để tới đây và đã thưởng thức rất nhiều, nhưng giờ ta thấy mệt. Ta chắc chắn [new_player.Custom2('MyCharacterIntroduction', ROOT.Char)] háo hức nhận vị trí của ta.\n\nTa xứng đáng tận hưởng thời gian còn lại."
  tgp_dynastic_cycle_decision_event.0101.a: "Ta tin [new_player.GetFirstNameNoTooltip] sẽ xử lý mọi việc."

