l_english:
 ##################################################
 # KOREA DECISION EVENTS 
 ##################################################
 # unify_goryeo_decision
  tgp_korea_decision.9101.t: "Một Vương quốc Thống nhất"
  tgp_korea_decision.9101.intro: "Nhiều vương quốc và dân tộc trên bán đảo này đã vật lộn vô ích suốt nhiều thế kỷ, bị xâm lược và mù quáng trước sự vĩ đại và sức mạnh mà chúng ta có thể có nếu chúng ta chỉ biết đoàn kết."
  tgp_korea_decision.9101.desc: "\n\nHôm nay, giấc mơ đó đã trở thành hiện thực, và di sản của Ta được đảm bảo là [ROOT.Char.GetMotherFather] của [GetTitleByKey('e_goryeo').GetDefinitiveName] và hoàng tộc của [ROOT.Char.GetHouse.GetBaseName]!"
  tgp_korea_decision.9101.a: "Mong rằng [GetTitleByKey('e_goryeo').GetTierAsNameNoTooltip] tồn tại nghìn năm."
  tgp_korea_decision.9101.b: "Và nó sẽ được gọi là 'Goryeo', để ghi nhận di sản tự hào của chúng ta."
  tgp_korea_decision.9101.b.reason: "Lựa chọn này khả dụng nhờ [ROOT.Char.GetCulture.GetName] [culture|E] của Ngài"
  tgp_korea_decision.9101.b.tt: "[GetTitleByKey('e_goryeo').GetDefinitiveName] sẽ được đổi tên #V Goryeo#!"
  tgp_korea_decision.9102.t: "$tgp_korea_decision.9101.t$"
  tgp_korea_decision.9102.desc: "\n\nHôm nay, giấc mơ đó đã trở thành hiện thực, và di sản của [king_of_goryeo.GetTitledFirstNamePossessive] được đảm bảo là [ROOT.Char.GetMotherFather] của [GetTitleByKey('e_goryeo').GetDefinitiveName] và hoàng tộc của [ROOT.Char.GetHouse.GetBaseName]!"
  cultural_acceptance_gain_unify_goryeo: "Thống nhất Husamguk"
  unify_goryeo_decision_requirement_tt: "$heritage_korean_name$ [heritage|E] [administrative|E] [realms|E] phải hình thành [GetTitleByKey('e_goryeo').GetNameNoTier|V] thông qua [GetDecision('tgp_korea_unify_goryeo_decision').GetName] [decision|E]"
  unify_goryeo_decision_blocker_tt: "$heritage_korean_name$ [heritage|E] [administrative|E] [realms|E] không thể tạo [GetTitleByKey('k_goguryeo').GetNameNoTier|V], [GetTitleByKey('k_silla').GetNameNoTier|V], hoặc [GetTitleByKey('k_baekje').GetNameNoTier|V] khi đã thực hiện [GetDecision('tgp_korea_unify_goryeo_decision').GetName] [decision|E] đã được thực hiện"

  tgp_korea_decision.9201.t: "Một Bánh Lái Nhiều Tay"
  tgp_korea_decision.9201.desc: "Khi vinh quang của triều đại Ta tỏa sáng rực rỡ hơn, nhiều người tìm sự an ủi trong bóng Ta. Không [ROOT.Char.GetTitleAsNameNoTooltip] nào có thể cai trị một mình, và ranh giới nơi quyền lực thực sự nằm luôn thay đổi.\n\nTa phải cảnh giác nếu hậu duệ của Ta muốn tiếp tục cai trị [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] hơn là chỉ trên danh nghĩa..."
  tgp_korea_decision.9201.a: "Ta phải đi trước một bước."
  MERITOCRATIC_CEREMONIAL_LIEGE_TITLE: "Ngai [founder.GetPrimaryTitle.GetAdjectiveNoTooltip]"

  tgp_korea_decision.9202.desc: "Khi vinh quang của triều đại [founder.GetTitledFirstNamePossessive] tỏa sáng rực rỡ hơn, nhiều người tìm sự an ủi trong bóng [founder.GetHerHis]. Không [founder.GetTitleAsNameNoTooltip] nào có thể cai trị một mình, và ranh giới nơi quyền lực thực sự nằm luôn thay đổi.\n\n[founder.GetSheHe|U] phải cảnh giác nếu hậu duệ của [founder.GetHerHis] muốn tiếp tục cai trị [founder.GetPrimaryTitle.GetDefinitiveNameNoTooltip] hơn là chỉ trên danh nghĩa..."
  tgp_korea_decision.9202.a: "Quyền lực tồn tại dưới nhiều hình thức."
 
  tgp_create_meritocratic_ruling_regent_title_effect: "Vì là [ruler|E] của một [GetGovernment('meritocratic_government').GetName] [empire|E]:"
  tgp_create_meritocratic_ruling_regent_title_effect_title_tt: "Ngài nhận được một [kingdom|E] [title|E] danh nghĩa với [GetLaw('single_heir_succession_law').GetName] [law|E]"
  tgp_create_meritocratic_ruling_regent_title_effect_faction_tt: "[vassals|E] có thể tạo #V $replace_ceremonial_regent_faction$#! [factions|E]"
  tgp_create_meritocratic_ruling_regent_title_message_title: "[founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] bị thách thức chế độ quân chủ"
