l_english:
  debate_event.1000.t: "Chuẩn Bị Sân Khấu"
  debate_event.1000.desc_intro_host: "Các học giả từ khắp mọi miền của lãnh thổ đã tụ họp"
  debate_event.1000.desc_intro_fallback: "Ta đã đến nơi"
  debate_event.1000.desc_outro: "tại [ROOT.Char.GetCurrentLocation.GetName] để tham gia cuộc tranh luận.\n\nNgay lúc này, các diễn giả đang luyện bài phát biểu trong những nhóm chật chội, các gia tộc lớn tìm kiếm chỗ nghỉ tốt nhất, trong khi một đoàn xe chở rau củ và thịt ồn ào tiến về chợ.\n\nĐã đến lúc Ta cũng chuẩn bị."
  debate_event.1000.a: "Không được lãng phí phút giây nào!"
  debate_event.1000.a.success_desc: "Chuẩn Bị Xuất Sắc"
  debate_event.1000.b: "Ta nên đi tham quan thành phố."
  debate_event.1000.c: "Cơ hội hoàn hảo để thư giãn."

  debate_event.1010.t: "Cuộc Tranh Luận Bắt Đầu"
  debate_event.1010.desc: "Các học giả tràn vào hội trường tranh luận, các đệ tử đi theo phía sau các bậc trưởng lão, tay cầm những cuộn giấy nặng. Đối thủ của Ta [debate_opponent.GetTitledFirstName] đứng sẵn sàng ở phía đối diện, bao quanh bởi các thành viên [opponent_movement.GetName].\n\nKhông còn thời gian chuẩn bị nữa. Bước vào cuộc tranh luận này, Ta phải dựa vào trí tuệ của mình để thành công."
  debate_event.1010.a: "Đây sẽ là khoảnh khắc của Ta."

  debate_event.1015.t: "$debate_event.1010.t$"
  debate_event.1015.desc: "Ta len qua đám đông, hy vọng tìm được chỗ quan sát tốt cho cuộc tranh luận sắp tới. [my_movement.GetName] chiếm vị trí cuối hội trường. Sau một vài lần xáo trộn và lẩm bẩm, Ta thấy mình giữa các đồng môn.\n\n[debate_contender.GetTitledFirstName] và [debate_opponent.GetTitledFirstName] đứng đối diện nhau, sẵn sàng chứng tỏ bản thân là"
  debate_event.1015.desc_favor: "người yêu thích của [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]."
  debate_event.1015.desc_leadership: "lãnh đạo của [contender_movement.GetNameNoTooltip]."
  debate_event.1015.a: "Ta tự hỏi ai sẽ thắng."

  debate_event.1100.t: "Cuộc Tranh Luận Bị Hủy"
  debate_event.1100.desc_death: "Có vẻ như [debate_opponent.GetTitledFirstName] đã qua đời. Không còn ai để tranh luận, cuộc tranh luận bị hủy bỏ."
  debate_event.1100.desc_fallback: "Ta vừa nhận tin rằng cuộc tranh luận tạm hoãn. Lý do không rõ, ngoài việc hiện tại không thể tiếp tục."
  debate_event.1100.a: "Tin không may."

  debate_event.2000.t: "Sai Lầm Của Kiêu Hãnh"
  debate_event.2000.desc: "Tiếng nói lớn kéo Ta vào một phòng học, nơi Ta thấy [ROOT.Char.Custom2('RelationToMe', talent )] [talent.GetTitledFirstName] chỉ tay về phía đám đông tụ tập. \"Không ai trong các ngươi hôm nay đến để tranh luận thực sự, mà chỉ để khoe khoang và khẳng định mình hơn người!\"\n\n[talent.GetSheHe|U] nói với niềm tin mà Ta đã nghe từ [talent.GetHerHim] cả ngày. Khuôn mặt [talent.GetHerHis|U] run rẩy vì cảm xúc khó kìm nén. [talent.GetWomanMan] này hứa hẹn trí tuệ sắc bén, dù tính khí có thể là thách thức."
  debate_event.2000.a: "Tài năng của [talent.GetHerHis|U] sẽ phát triển dưới sự dẫn dắt của Ta."
  debate_event.2000.b: "Chúng ta nên khiêm nhường trước lời nói của [talent.GetHerHis]."

  debate_event.2010.t: "Ảnh Hưởng Của [elder_movement.GetNameNoTooltip]"
  debate_event.2010.desc: "\"Ta phải nói, cách Ngài giải thích [ROOT.Char.Custom('GetRandomHistoryPassage')] khiến Ta chú ý,\" [elder.GetTitledFirstName] nói với Ta vào cuối một ngày dài thảo luận thân thiện. \"Ta chắc chắn rằng, bỏ qua khác biệt, chúng ta có thể học hỏi nhiều từ nhau.\"\n\nBầu không khí thân thiện trong các cuộc trò chuyện khiến Ta quên rằng [elder.GetSheHe] thuộc [elder_movement.GetNameNoTooltip] — điều Ta nhớ lại khi một thành viên [my_movement.GetNameNoTooltip] liếc nhìn Ta."
  debate_event.2010.a: "\"Ta hoàn toàn đồng ý.\""
  debate_event.2010.b: "\"Một số khác biệt không thể bỏ qua.\""

  debate_event.2020.t: "Trao Đổi Thân Thiện"
  debate_event.2020.desc: "Một đồng môn [my_movement.GetName] [movement_member.GetTitledFirstName] tiến tới với một người lưng khòm đi theo, cúi đầu chào. \"Ta nghe Ngài tìm người tài năng cho đoàn của mình,\" [movement_member.GetFirstNameNoTooltip] nói. \"Ta nghĩ [disciple.GetTitledFirstName] có thể là ứng viên phù hợp.\"\n\n[disciple.GetFirstNameNoTooltip] [disciple.Custom('quirk_pos_present')] và nói: \"Sẽ là vinh dự nếu được phục vụ Ngài, [ROOT.Char.GetLadyLord].\""
  debate_event.2020.a: "\"Ta có nhiều điều để dạy [disciple.GetHerHim].\""
  debate_event.2020.b: "\"Tình  Bạn của bạn là tất cả những gì Ta mong.\""
  friend_given_disciple_reason: "[CHARACTER.GetShortUIName|U] được [TARGET_CHARACTER.GetShortUIName] giao cho một đệ tử tại cuộc tranh luận."
  friend_given_disciple_reason_corresponding: "$friend_given_disciple_reason$"

  debate_event.5000.t_imperial_debate: "Ân Huệ Hoàng Gia"
  debate_event.5000.t_movement_debate: "Lãnh Đạo [host.Custom('GetMyMovementNoTooltip')]"

  debate_event.5000.desc_imperial: "Các quan chức và khán giả xếp dọc tường hội trường tranh luận, quan sát Ta tiến tới đứng trước [debate_opponent.GetTitledFirstName]. Chúng Ta cúi chào đồng loạt, tay dang ra, lưng cong.\n\nTa nên nắm lấy cơ hội và là người đầu tiên trình bày luận điểm."
  debate_event.5000.desc: "Sân khấu đã được dựng và khán giả đã ngồi vào chỗ. [debate_opponent.GetTitledFirstName] đứng dậy khỏi ghế của [debate_opponent.GetHerHis] để phát biểu trước đám đông, những thành viên [host.Custom('GetMyMovement')] đồng đội của chúng ta.\n\n\"Chúng ta ở đây để thảo luận về các ưu tiên và phương hướng của [host.Custom('GetMyMovement')]. Kết quả của cuộc tranh luận này cũng sẽ quyết định người lãnh đạo của phong trào.\""

  debate_event.5000.a: "Ta sẽ cai trị theo mệnh lệnh của Khổng Tử."
  debate_event.5000.b: "Logic và lý trí sẽ chiến thắng."
  debate_event.5000.c: "Rất tốt. #EMP Bây giờ#! là thời điểm để..."
  debate_event.5000.d: "Thiếu lãnh đạo sẽ dẫn đến diệt vong!"
  debate_event.5000.a.flavor: "Tận dụng kinh nghiệm của Ngài trong [GetTrait('confucian_education').GetName( GetNullCharacter )] [trait|E] - Kinh nghiệm cao hơn đồng nghĩa thành công cao hơn"
  debate_event.5000.c.flavor: "Theo hướng dẫn, các [disciples|E] của Ngài sẽ cố gắng kích thích khán giả vào những lúc thích hợp - Hy vọng, các đệ tử của [debate_opponent.GetShortUINamePossessive] sẽ không can thiệp..."
  debate_event.5000.d.success_desc: "Ngài đã thuyết phục thành công"
  debate_event.5000.d.failure_desc: "Ngài thất bại trong việc lập luận thuyết phục"

  debate_event.5010.insult_desc: "[debate_opponent.GetTitledFirstName] không lãng phí thời gian và ngay lập tức liệt kê đủ loại buộc tội và lời lẽ sỉ nhục, tuyên bố rằng #EMP Ta#! somehow không đủ khả năng lãnh đạo.\n\nThật là vô lý! Chỉ là mưu mẹo nhằm làm suy yếu quyền lực của Ta mà thôi."
  debate_event.5010.confucian_desc: "[debate_opponent.GetTitledFirstName] bình tĩnh nói về Khổng giáo và cách mà giáo lý của ông ấy nên dẫn đường cho chúng ta tiến lên."
  debate_event.5010.desc: "[debate_opponent.GetTitledFirstName] nói về logic và lý trí, và cách chúng ta nên dùng kiến thức trước đây để xây dựng một tương lai mới cho lãnh thổ."
  debate_event.crowd_approval_desc: "\n\nKhán giả gật đầu tán thành."
  debate_event.crowd_disapproval_desc: "\n\nKhán giả lắc đầu phản đối."
  debate_event.5010.a: "Tiếp tục theo cách hiện tại của Ta."
  debate_event.5010.b: "Có lẽ lời Khổng Tử sẽ thuyết phục họ?"
  debate_event.5010.c: "Một cách tiếp cận #EMP hợp lý#! hơn nên sẽ khai sáng họ."
  debate_event.5010.d: "Đưa các đệ tử của Ta vào công việc."
  debate_event.5010.e: "Khi tất cả thất bại, sỉ nhục chắc chắn sẽ hiệu quả."

  debate_event.5100.t_winner: "- Chiến Thắng!"
  debate_event.5100.t_loser: "- Thua Cuộc!"
  debate_event.5100.desc_winner: "Sau sự chuẩn bị kỹ lưỡng và thực hiện điêu luyện, Ta được tuyên bố là người thắng cuộc trong cuộc tranh luận!\n\n[debate_loser.GetTitledFirstName] cúi chào nhanh, trang nghiêm trước khi nói với Ta: \"Ta đoán phải gửi lời chúc mừng. Những người khác sẽ sớm nhìn vào Ngài để dẫn dắt họ. Ta chỉ mong Ngài làm điều đó với trách nhiệm tối đa.\""
  debate_event.5100.desc_loser: "Bất chấp những nỗ lực tốt nhất của tôi, [debate_winner.GetTitledFirstName] đã được tuyên bố là người chiến thắng trong cuộc tranh luận. Do đó, [debate_winner.GetSheHe] cũng sẽ tiếp tục là lãnh đạo trên thực tế của [my_movement.GetNameNoTooltip].\n\nSau khi nhận được những lời chúc mừng, [debate_winner.GetSheHe] cuối cùng cũng chuyển sự chú ý của [debate_winner.GetHerHis] sang tôi.\n\n\"Không phải ai cũng được định sẵn để dẫn đầu. Nhưng đừng lo lắng, thời của người rồi cũng sẽ đến.\""
  debate_event.5100.desc_unexpected_winner: "Trong một tình tiết hoàn toàn bất ngờ, #EMP TÔI#! đã được tuyên bố là người chiến thắng. [debate_loser.GetTitledFirstName] nhìn tôi, và tôi nhìn [debate_loser.GetHerHim], cả hai đều sửng sốt như nhau. Có phải chúng ta đã nghe nhầm không? Không, chúng ta đã nghe đúng.\n\nSau một lúc, [debate_loser.GetFirstNameNoTooltip] lấy lại bình tĩnh và nói với tôi: \"Ta cho rằng mình cần phải chúc mừng người. Mặc dù vậy, ta không thể hiểu tại sao bất cứ ai lại tuyên bố người là người chiến thắng...\""
  debate_event.5100.desc_unexpected_loser: "Trong một bước ngoặt hoàn toàn bất ngờ, [debate_winner.GetTitledFirstName] được tuyên bố là #EMP người chiến thắng#!. [debate_winner.GetFirstNameNoTooltip] nhìn Ta, và Ta nhìn [debate_winner.GetHerHim], cả hai đều sửng sốt. Chúng Ta có nghe đúng không? Vâng, đúng vậy.\n\nSau khi nhận lời chúc mừng, vẫn còn sự ngạc nhiên trên khuôn mặt [debate_winner.GetHerHis], [debate_loser.GetFirstNameNoTooltip] nói với Ta: \"Ta thấy Ngài đã biểu hiện xuất sắc. Dù Ngài, bằng cách nào đó, không thể thắng hôm nay.\""
  debate_event.5100.a: "Hiện tại, Ta sẽ tận hưởng khoảnh khắc này."
  debate_event.5100.b: "Ta sẽ phải thử lại thôi..."

  debate_event.5110.t: "- Chọn Người Thắng"
  debate_event.5110.desc: "Các lập luận được đưa qua lại giữa hai đối thủ trong một thời gian dài. Họ dùng logic, bàn về tương lai lãnh thổ, và, không thiếu những lời sỉ nhục, xem xét phẩm chất của một lãnh đạo.\n\nKhi cuộc tranh luận kết thúc, [debate_winner.GetTitledFirstName] dường như có lý lẽ thuyết phục hơn và là người thắng tự nhiên.\n\nNhưng là [ROOT.Char.GetTitleAsNameNoTooltip], Ta có quyền tuyên bố người chiến thắng theo ý mình."
  debate_event.5110.a: "[debate_winner.GetNameNoTooltip] thực sự là người thắng."
  debate_event.5110.a.tt: "[winning_movement.GetNameNoTooltip] trở thành [favored_movement|E]"
  debate_event.5110.b: "#EMP Thực ra#!, Ta nghĩ [debate_loser.GetNameNoTooltip] thắng."
 
  debate_event.5120.desc_winner: "Sau một khoảng nghỉ ngắn, người thông báo tóm tắt cuộc tranh luận và, dù không nói rõ, làm rõ rằng Ta là người thắng. Tuy nhiên, đây không phải quyết định của người thông báo."
  debate_event.5120.desc_loser: "Sau một khoảng nghỉ ngắn, người thông báo tóm tắt cuộc tranh luận và, dù không nói rõ, làm rõ rằng [debate_winner.GetTitledFirstName] là người thắng."
  debate_event.5120.bridge_hegemon_available: "Mọi ánh mắt đều hướng về [ROOT.Char.GetTopLiege.GetName]."
  debate_event.5120.bridge_fallback: "\n\nMột sứ giả nhanh chóng rời đi để gửi tin đến [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], và quay về với tin rằng"
  debate_event.5120.desc_liege_confirm: "\n\n\"Ta đồng ý. [debate_winner.GetFirstNameNoTooltip] là người thắng xứng đáng, đã điều khiển cuộc tranh luận với kỹ năng và mưu lược tuyệt đối.\""
  debate_event.5120.desc_liege_confirm_fallback: "triều đình hoàng gia công nhận [winning_movement.GetNameNoTooltip] xứng đáng nhận sự ưu ái của đế quốc."
  debate_event.5120.desc_liege_intervene: "\n\n\"Ta tuyên bố [declared_winner.GetTitledFirstName] là người chiến thắng của cuộc tranh luận hôm nay.\""
  debate_event.5120.a: "Ta rất vui vì ngài nghĩ vậy, [ROOT.Char.GetTopLiege.GetLadyLord] của Ta!"
  debate_event.5120.b: "Gì cơ? Ý Ta là, tất nhiên rồi. Cảm ơn ngài, [ROOT.Char.GetTopLiege.GetLadyLord] của Ta!"
  debate_event.5120.c: "Thật… Thất vọng."
 
  tgp_dynastic_cycle_decision_event.0082.a: "Vị thế của chúng ta vẫn an toàn. Ít nhất là hiện tại."
  tgp_dynastic_cycle_decision_event.0082.b: "Hú hồn. Ta tưởng chúng ta xong đời rồi."
  tgp_dynastic_cycle_decision_event.0082.c: "Làm sao [ROOT.Char.GetTopLiege.GetSheHe] có thể đưa ra quyết định như vậy?!"

  debate_events.5100.opponent_tt: "Giảm [movement_power_i][movement_power|E] của [opponent_movement.GetName] đi #N [EmptyScope.ScriptValue('event_decrease_movement_power_major_value')|0]#!"
  debate_increased_movement_power_major_effect_tooltip: "Tăng [GetPlayer.Custom('GetMyMovement')]'s [movement_power_i][movement_power|E] lên [EmptyScope.ScriptValue('event_increase_movement_power_major_value')|+0]"

  debate_event.5130.desc_favor: "$debate_become_movement_leader_reward$"
  debate_event.5130.desc_leadership_won: "$debate_become_movement_leader_reward$"
  debate_event.5130.desc_leadership_defended: "$debate_remain_movement_leader_reward$"
