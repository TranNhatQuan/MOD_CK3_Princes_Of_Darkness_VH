l_english: 
  tgp_movement_events.0001.t: "Mài Lưỡi Gươm"
  tgp_movement_events.0001.desc: "\"[ROOT.Char.GetTitledFirstName]!\" [marshal.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] của ta, sải bước tới, [marshal.Custom('quirk_pos_pp')].\n\n\"Chúng ta không thể ngồi yên như những con cừu, chờ sói đến bắt. Đây có thể là thời kỳ của [my_situation.GetTopCurrentPhase.GetName|l], nhưng chẳng bao lâu chúng ta phải hành quân. Đông, Tây, Bắc, Nam. Ta mong ngươi chuẩn bị sẵn sàng, [ROOT.Char.GetTitleAsNameNoTooltip|l] của ta.\""
  tgp_movement_events.0001.aa: "\"Ngươi nói đúng. Hãy dạy ta cách.\""
  tgp_movement_events.0001.a: "[my_movement.GetNameNoTooltip] sẽ nghe theo."
  tgp_movement_events.0001.b: "Ta phải tập hợp đồng minh."
  tgp_movement_events.0001.c: "Ta sẽ học hỏi từ các tướng xưa."
  tgp_movement_events.0001.c.tt: "Ngươi nhận được một [commander_trait|E]"
  event_increase_movement_power_major_effect_tooltip: "Tăng [movement_power_i][movement_power|E] của [GetPlayer.Custom('GetMyMovement')] lên [EmptyScope.ScriptValue('event_increase_movement_power_major_value')|+0]"
  event_increase_movement_power_medium_effect_tooltip: "Tăng [movement_power_i][movement_power|E] của [GetPlayer.Custom('GetMyMovement')] lên [EmptyScope.ScriptValue('event_increase_movement_power_medium_value')|+0]"
  event_increase_movement_power_minor_effect_tooltip: "Tăng [movement_power_i][movement_power|E] của [GetPlayer.Custom('GetMyMovement')] lên [EmptyScope.ScriptValue('event_increase_movement_power_minor_value')|+0]"
 
  tgp_movement_events.0010.t: "Khách Quý Ghé Thăm"
  tgp_movement_events.0010.desc: "Khi ta tản bộ trong sân đình, một [courtier.GetWomanMan] ăn vận chỉn chu chào ta bằng một cái cúi đầu đầy cung kính.\n\n\"Thần là [courtier.GetName], [other_ruler.Custom2('RelationToMe', SCOPE.sC('courtier'))] của [other_ruler.GetTitledFirstNamePossessive].\" [courtier.GetSheHe|U] khiêm tốn tự giới thiệu. \"[other_ruler.GetTitledFirstNameNoTooltip] phái thần đến để thỉnh giáo trí tuệ của ngài, [ROOT.Char.GetTitleAsNameNoTooltip|l]. Ngài ấy mong muốn được lắng nghe thêm những lời khuyên giải trước khi đưa ra quyết định cuối cùng.\""
  tgp_movement_events.0010.a: "[my_movement.GetNameNoTooltip] phải dẫn đầu."
  tgp_movement_events.0010.a.success: "Ngươi thuyết phục được [other_ruler.GetShortUIName]"
  tgp_movement_events.0010.a.failure: "[other_ruler.GetShortUIName] phớt lờ lời khuyên của ngươi"
  tgp_movement_events.0010.b: "Càng nhiều người nên tìm đến ta để hỏi ý kiến!"
  tgp_movement_events.0010.c: "\"Ta không thể quyết thay [other_ruler.GetHerHim], nhưng có thể giúp [other_ruler.GetHerHim].\""
  event_increased_personal_movement_power_tt: "Ngươi tăng [movement_power_i][personal_movement_power|E] lên [EmptyScope.ScriptValue('event_increased_personal_movement_power_value')|+0] trong #V 15 năm#!"
  tgp_movement_events_0010_add_to_movement_effect_tt: "[other_ruler.GetShortUIName|U] sẽ tham gia [GetPlayer.Custom('GetMyMovement')]"
 
  tgp_movement_events.0020.t: "Tiến Lên! Tiến Lên!"
  tgp_movement_events.0020.desc: "\"Hầu hết [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip|l],\" một [courtier.GetCulture.GetNameNoTooltip] [courtier.GetWomanMan] cúi chào sâu khi [courtier.GetSheHe] bước vào đại sảnh. \"Ta đến mang con dấu của đại [other_ruler.GetTitledFirstName]. [other_ruler.GetLadyLord] của ta nhắn ta tỏ lòng kính trọng một thành viên khác của [my_movement.GetName] danh giá.\"\n\n[courtier.GetSheHe|U] [courtier.Custom('quirk_pos_present')] trước khi tiếp tục: \"[other_ruler.GetTitledFirstNameNoTooltip] cho rằng quốc gia phải tập trung vào đổi mới. Tìm kiếm quyền lực cá nhân là ích kỷ và vô ích. Tất cả chúng ta phải #EMP tiến lên#!.\""
  tgp_movement_events.0020.aa: "Đây là con đường duy nhất."
  tgp_movement_events.0020.a: "Và ta sẽ tiến lên."
  tgp_movement_events.0020.b: "Không thể tiến lên nếu thiếu [my_movement.GetNameNoTooltip]!"
  tgp_movement_events.0020.c: "Lộ trình phải được định từ bên trong con tàu."
  event_decrease_movement_power_medium_effect_tooltip: "Giảm [movement_power_i][movement_power|E] của [GetPlayer.Custom('GetMyMovement')] đi #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
  event_decrease_movement_power_minor_effect_tooltip: "Giảm [movement_power_i][movement_power|E] của [GetPlayer.Custom('GetMyMovement')] đi #N [EmptyScope.ScriptValue('event_decrease_movement_power_minor_value')|0]#!"
  tgp_advancement_innovations_modifier: "Đại Tiến Bộ"
  tgp_advancement_innovations_modifier_desc: "Nhân vật này sử dụng kiến thức kiến trúc của mình để tập trung vào đổi mới và thúc đẩy quốc gia hướng tới tương lai rực rỡ hơn."
 
  tgp_movement_events.0030.opening: "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  tgp_movement_events.0030.desc: "Là thành viên cùng [my_movement.GetName], ta viết thư cho ngươi để chúng ta cùng bảo vệ lợi ích chung.\n\nTa sẽ ca ngợi ngươi nếu ngươi cũng làm như vậy cho ta."
  tgp_movement_events.0030.a: "Điều đó chúng ta có thể đồng ý."
  tgp_movement_events.0030.b: "Cảm ơn, nhưng ta không cần giúp đỡ."
  friend_same_movement_reason: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã đồng ý cùng giữ lợi ích cho nhau như thành viên cùng phong trào."
  friend_same_movement_reason_corresponding: "$friend_same_movement_reason$"
 
  tgp_movement_events.0040.t: "Ân Huệ Trời Ban"
  tgp_movement_events.0040.desc: "\"Nỗ lực của ngươi không bị bỏ qua, [ROOT.Char.GetTitledFirstNameNoTooltip].\" Một giọng nói vững vàng gọi tên ta. [courtier.GetWomanMan] cúi chào trước mặt Ta mang con dấu của [hegemon.GetTitledFirstNameNoTooltip].\n\n\"[hegemon.GetTitledFirstName] biết ơn sự hỗ trợ của ngươi và muốn thưởng cho ngươi. [my_movement.GetName] sẽ được tôn vinh trong các hành lang cung điện, và tên của ngươi sẽ được nhớ đến.\""
  tgp_movement_events.0040.a: "\"Ta cũng biết ơn như vậy.\""
  tgp_movement_events.0040.b: "\"Ta sẽ mãi trung thành với [hegemon.GetTitleAsNameNoTooltip].\""
  tgp_movement_events.0040.c: "\"Hãy để những bức tường kể chuyện!\""
  tgp_loyal_subject_modifier: "Trung Thành Với Thiên"
  tgp_loyal_subject_modifier_desc: "Nhân vật này thể hiện lòng trung thành với lãnh tụ bằng cách tham gia phong trào ủng hộ Hegemon."
  dynastic_cycle_cannot_leave_movement_tt: "@warning_icon! #X Ngươi sẽ không thể rời [my_movement.GetName] trong #V 15 năm#!#!"
 
  situation_dynastic_cycle_choose_movement_decision_cannot_leave_var: "Ngươi đã hứa với [GetTitleByKey('h_china').GetHolder.GetTitleAsName] rằng sẽ không bỏ rơi [GetTitleByKey('h_china').GetHolder.GetHerHim]"
 
  tgp_movement_events.0050.t: "Một Lộ Trình Mới"
  tgp_movement_events.0050.desc.intro: "\"Chào, [ROOT.Char.GetTitledFirstNameNoTooltip].\" Một [new_elder.GetWomanMan] điềm tĩnh bước vào phòng làm việc, đi
  tgp_movement_events.0050.desc.diplomacy: "ngoại giao"
  tgp_movement_events.0050.desc.stewardship: "quản trị"
  tgp_movement_events.0050.desc.intrigue: "âm mưu"
  tgp_movement_events.0050.desc.learning: "học tập"
  tgp_movement_events.0050.desc.martial: "võ nghệ"
  tgp_movement_events.0050.desc.outro: "kỷ luật phản ánh đức hạnh. Ta muốn dâng trí tuệ khiêm tốn của mình, để chính quyền của ngươi được rèn luyện, và thanh gươm của ngươi được mài sắc."
  tgp_movement_events.0050.a: "[new_elder.GetTitledFirstNameNoTooltip] sẽ là một người thầy tuyệt vời."
  tgp_movement_events.0050.b: "Ta sẽ mãi trung thành với [old_elder.GetTitledFirstNameNoTooltip]!"
  tgp_movement_events.0050.c: "Tập trung học hành là con đường duy nhất."
 
  tgp_movement_events.0060.t: "Mực Độc"
  tgp_movement_events.0060.desc: "[ROOT.Char.Custom('GetWritingMaterial')] nằm mát trên bàn. Một nét mực có thể làm ô danh [rival.GetTitledFirstName] và [rival.GetHerHis] [rival_movement.GetName] suốt nhiều thế hệ. Nhưng ta chần chừ, đi quanh phòng học [ROOT.GetCharacter.Custom('quirk_pos_adverb')].\n\nSuy nghĩ ấy linger như khói từ ngọn lửa không được chăm sóc."
  tpg_movement_events.0060.aa: "Chưa từng có lời nào sắc bén hơn."
  tgp_movement_events.0060.a: "[rival_movement.GetNameNoTooltip] sẽ phải chịu khổ."
  tgp_movement_events.0060.b: "Ta nên tập trung tôn vinh đức hạnh của [my_movement.GetNameNoTooltip]."
  tgp_movement_events.0060.c: "[ROOT.Char.GetFaith.HighGodName] dạy chúng ta phải có lòng từ bi."
  tgp_movement_events.0060.a.tt: "$prelude_events.0040.c.tt$"
  tgp_movement_events.0060.a.rival_tt: "Giảm [movement_power_i][movement_power|E] của [rival_movement.GetName] đi #N [EmptyScope.ScriptValue('event_decrease_movement_power_medium_value')|0]#!"
 
  tgp_movement_events.0070.t: "Cuộn Sách Chung"
  tgp_movement_events.0070.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [councillor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))], bước vào phòng làm việc, [councillor.Custom('quirk_pos_pp')]. \"Ta đã nghe về sở thích chung của ngươi trong [councillor.Custom('MatchingConversationSubject_alone')].\"\n\n\"Ta đề nghị chúng ta cùng nghiên cứu kinh điển? Trong suy ngẫm chung, ngay cả vua và quan cũng có thể nâng cao trí tuệ, như hai tấm gương được mài cạnh nhau.\""
  tgp_movement_events.0070.a: "\"Ha! Chúng ta chắc chắn có thể nói về [councillor.Custom('MatchingConversationSubject_alone')].\""
  tgp_movement_events.0070.b.councillor: "\"Ngươi nên tập trung làm [councillor.GetCouncilTitle].\""
  tgp_movement_events.0070.b.spouse: "\"Ta quan tâm hơn đến việc học của ngươi.\""
  tgp_movement_events.0070.c: "Ta phải không bao giờ ngừng học."
  friend_studied_together: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã cùng nhau học tập một buổi chiều về chủ đề yêu thích của họ."
  friend_studied_together_corresponding: "$friend_studied_together$"
 
  tgp_movement_events.0080.t: "Vì Gia Tộc Chúng Ta"
  tgp_movement_events.0080.desc: "[family_member.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))] của ta, [family_member.Custom('quirk_pos_present')] khi bước vào phòng. \"Thân mến [family_member.Custom2('RelationToMe', SCOPE.sC('root_scope'))],\" [family_member.GetSheHe] cúi chào ta, áo choàng sạch sẽ, ánh mắt cúi xuống trong sự tôn trọng.\n\n\"Ta đã lâu suy ngẫm về vinh quang của gia tộc. Dù không nhiều, nhưng ta vẫn muốn dâng tặng ngươi, để [ROOT.Char.GetDomicile.GetName] tỏa sáng rực rỡ, cho mọi người thấy.\""
  tgp_movement_events.0080.aa: "\"Tên [ROOT.Char.GetHouse.GetNameNoTooltip] sẽ được biết đến!\""
  tgp_movement_events.0080.a: "\"Ta cảm ơn ngươi vì món quà này.\""
  tpg_movement_events.0080.b: "\"Chúng ta phải dùng vàng để tài trợ cho [my_movement.GetNameNoTooltip].\""
  tgp_movement_events.0080.c: "\"Đừng lãng phí vàng cho ta.\""
  tgp_subsidised_estate_buildings_modifier: "Đất Vườn Được Hỗ Trợ"
  tgp_subsidised_estate_buildings_modifier_desc: "Gia tộc nhân vật này đã giúp xây dựng và phát triển điền trang.\n\n"
  MODIFIER_DEFINITION_SUBSIDISED_ESTATE: "#emp Dùng khi xây dựng tòa nhà mới trong điền trang#!\n[domicile_building|E] Tài nguyên còn lại: #bold $MULTIPLIER|0$/3#!"
  friend_rejected_funds: "[CHARACTER.GetShortUIName|U] khuyên [TARGET_CHARACTER.GetShortUIName] đừng lãng phí vàng của [TARGET_CHARACTER.GetHerHis] cho [CHARACTER.GetShortUINamePossessive]."
  friend_rejected_funds_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] được [CHARACTER.GetShortUIName] khuyên đừng lãng phí vàng của [CHARACTER.GetHerHis] cho [TARGET_CHARACTER.GetShortUINamePossessive]."
 
  tgp_movement_events.0090.t: "Vết Thương Cũ"
  tgp_movement_events.0090.desc: "\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" một [courtier.GetWomanMan] mang con dấu của gia tộc [other_ruler.GetHouse.GetName] cúi chào ta. \"[other_ruler.GetLadyLord] [other_ruler.GetTitledFirstName] ra lệnh cho ta đọc thông điệp này.\"\n\n\"Dù những mùa trước chúng ta đi ngược nhau, con đường ta bước giờ là thành viên [my_movement.GetName] dẫn chúng ta tới cùng mục tiêu. Chúng ta phải quên đi những vết thương quá khứ.\""
  tgp_movement_events.0090.aa: "\"Từ chối.\""
  tgp_movement_events.0090.a: "\"Xin lỗi để #EMP mọi người#! nghe.\""
  tgp_movement_events.0090.b: "Chỉ vì lợi ích của [my_movement.GetNameNoTooltip]."
  tgp_movement_events.0090.c: "\"Gửi lời tốt nhất của ta đến [other_ruler.GetTitleAsNameNoTooltip].\""
 
  tgp_movement_events.0100.t: "Lời Khuyên"
  tgp_movement_events.0100.desc: "\"Ngài [ROOT.Char.GetTitleAsNameNoTooltip] cao quý.\" [spymaster.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spymaster'))] của Ta gọi Ta trong bóng tối. Gỗ kêu kẽo kẹt dưới bước chân nhanh nhẹn của [spymaster.GetHerHis].\n\n\"Chúng ta nghe nói rằng [rival.GetTitledFirstName], lãnh đạo của [rival_movement.GetName], có thể dễ bị... gợi ý hơn chúng ta nghĩ.\""
  tgp_movement_events.0100.aa: "[rival.GetSheHe|U] nên biết điều gì tốt nhất cho [rival.GetHerHim]."
  tgp_movement_events.0100.a: "\"Hãy làm đi.\""
  tgp_movement_events.0100.a.success: "[rival.GetShortUIName] rời khỏi [rival_movement.GetName]"
  tgp_movement_events.0100.a.failure: "Ngài bị lộ là thiếu danh dự"
  tgp_movement_events.0100.b: "Không gì tốt hơn vàng."
  tgp_movement_events.0100.c: "Không cần chặt đầu. Hãy làm hại cơ thể."
  tgp_movement_events_0100_remove_from_movement_effect_tt: "[rival.GetShortUIName] sẽ gia nhập [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'undecided_movement' ).GetName]"
 
  tgp_movement_events.0110.opening: "[other_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  tgp_movement_events.0110.desc: "Là những thành viên cùng [my_movement.GetName], nghĩa vụ của chúng ta không chỉ là giữ lưỡi kiếm sắc, mà còn giữ tâm trí sáng suốt.\n\nXin nhận cuốn sách này và học tập cẩn thận."
  tgp_movement_events.0110.a: "Ta sẽ làm theo lời khuyên của ngươi."
  tgp_movement_events.0110.b: "Cuốn sách này sẽ thật tuyệt trong thư viện của ta."
  friend_sent_books_reason: "[TARGET_CHARACTER.GetShortUIName|U] gửi một số sách thú vị cho [CHARACTER.GetShortUIName] vì họ cùng tham gia phong trào."
  friend_sent_books_reason_corresponding: "[CHARACTER.GetShortUIName|U] gửi một số sách thú vị cho [TARGET_CHARACTER.GetShortUIName] vì họ cùng tham gia phong trào."
  artifact_movement_gift_desc: "[newly_created_artifact.GetDesc]\n\nMột món quà từ [other_ruler.GetShortUIName] cho [root_scope.GetShortUIName] với tư cách là những thành viên cùng [my_movement.GetName]."
 
  tgp_movement_events.0120.t: "Nâng Ly Vì Đức Hạnh"
  tgp_movement_events.0120.desc: "Khi chén rượu đầy [host.Custom('GetExpensiveDrink')] và đĩa [host.Custom('GetExpensiveMeal')] biến mất, [other_ruler.GetTitledFirstName] nghiêng gần hơn.\n\n\"Chúng ta không thể làm thất vọng [my_movement.GetName],\" [other_ruler.GetSheHe] nói, [other_ruler.Custom('quirk_pos_pp')]. \"Ngươi đã nghiên cứu [other_ruler.Custom('GetRandomHistoryPassage')], [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
  tgp_movement_events.0120.a: "\"Xin hãy dạy ta.\""
  tgp_movement_events.0120.b: "Chúng ta phải dựa vào sức mạnh thôi."
  tgp_movement_events.0120.c: "\"Tiệc tùng không phải nơi học hành!\""
 
  tgp_movement_events.0130.t: "Ngôn Ngữ của [capital_culture.GetCollectiveNounNoTooltip]"
  tgp_movement_events.0130.desc: "Một [courtier.GetWomanMan] mặc [other_ruler.Custom('RegionalFabric')] đẹp cúi trước ta:\n\n\"[other_ruler.GetLadyLord] [other_ruler.GetTitledFirstName] ra lệnh ta nói thay [other_ruler.GetHerHis], [ROOT.Char.Custom('FormOfAddressForLiege')|l]. [other_ruler.GetSheHe|U] lo rằng tiếng nói của [my_movement.GetName] sẽ yếu đi ở thủ đô nếu ngôn ngữ của họ không được sử dụng.\"\n\n[courtier.GetSheHe|U] [courtier.Custom('quirk_pos_present')] tiếp tục: \"Ta rất vinh dự được hướng dẫn ngươi trong hành trình này.\""
  tgp_movement_events.0130.a: "Ta phải học ngôn ngữ của họ!"
  tgp_movement_events.0130.b: "Sao không biến thành [capital_culture.GetNameNoTooltip] luôn?"
  tgp_movement_events.0130.c: "Chúng ta sẽ sống hòa hợp."
  tgp_cultural_harmony_modifier: "Hòa Hợp Văn Hóa"
  tgp_cultural_harmony_modifier_desc: "Nhân vật này quyết định tập trung nỗ lực để sống hòa hợp với văn hóa của thủ đô."
 
  tgp_movement_events.0140.t: "Món Quà Của Đệ Tử"
  tgp_movement_events.0140.desc: "\"Thầy ơi!\" Ta nghe giọng [disciple.GetTitledFirstNamePossessive] của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('disciple'))] trước khi nhìn thấy [disciple.GetHerHim].\n\n\"Ngài đã dạy ta nhiều về [ROOT.Char.Custom('GetRandomAnnalsPassage')] và [ROOT.Char.Custom('GetRandomHistoryPassage')], và nuôi dưỡng trí tuệ ta rất chu đáo. Như một lời tri ân, ta muốn tặng ngài món quà này.\" \n\n[disciple.GetSheHe|U] [disciple.Custom('quirk_pos_present')] trao cho ta một gói [ROOT.Char.Custom('GetSimpleColor')]."
  tgp_movement_events.0140.a: "\"Ta vui lòng nhận nó.\""
  tgp_movement_events.0140.b: "\"Hãy nhớ chúng ta làm điều này vì [my_movement.GetNameNoTooltip].\""
  tgp_movement_events.0140.c: "\"Còn về [ROOT.Char.Custom('GetRandomPoetryPassage')] thì sao?\""
  disciple_gift_desc: "[newly_created_artifact.GetDesc]\n\nMột món quà từ [disciple.GetShortUIName] cho [root_scope.GetShortUIName] vì đã là một bậc trưởng lão xuất sắc."
 
  tgp_movement_events.0150.t: "[monk.GetFaith.GetNameNoTooltip] [monk.GetFaith.DevoteeNeuter|U]"
  tgp_movement_events.0150.desc.intro: "Khoác trên mình tấm áo màu [monk.Custom('GetComplexColor')], một tín đồ [monk.GetFaith.DevoteeNeuter] bước vào điện đường. Một lá bùa gỗ nhỏ treo bên thắt lưng, và một hương trầm thoang thoảng theo sau mỗi bước chân của ngài.\n\n\""
  tgp_movement_events.0150.desc.other_ruler: "\"Ta đến mang ý nguyện của [other_ruler.GetLadyLord], [other_ruler.GetTitledFirstName],\" [monk.GetSheHe] nói, [monk.Custom('quirk_pos_pp')]. \"Nhiệm vụ ta là truyền bá lời của [monk.GetFaith.HighGodName].\""
  tgp_movement_events.0150.desc.alone: "\"Ta đến mang ý nguyện của [monk.GetFaith.HighGodName], vì ta đã dành đời mình nghiên cứu đức tin [monk.GetFaith.GetName].\""
  tgp_movement_events.0150.desc.outro: "\"Xin hãy cho ta vào triều đình để chúng ta học hỏi lẫn nhau.\""
  tgp_movement_events.0150.aa: "\"Hãy nói với [other_ruler.GetLadyLord] rằng ta ngưỡng mộ ngoại giao của [other_ruler.GetHerHis].\""
  tgp_movement_events.0150.aa.alliance: "Ngươi lập [alliance|E] với [other_ruler.GetShortUIName]"
  tgp_movement_events.0150.a: "\"Hãy kể cho ta về [monk.GetFaith.GetAdherentNamePluralNoTooltip].\""
  tgp_movement_events.0150.b: "\"#EMP Đây#! là đất của [ROOT.Char.GetFaith.HighGodName].\""
  tgp_movement_events.0150.b.success: "[monk.GetShortUIName] cải đạo"
  tgp_movement_events.0150.b.failure: "[monk.GetShortUIName] giữ đức tin của [monk.GetHerHis]"
  tgp_movement_events.0150.c: "\"Ngươi có thể ở lại.\""
  cheaper_to_convert_to_monk_faith_tt: "Ngươi nhận #P 50%#! giảm giá khi cải đạo sang [monk.GetFaith.GetName]"
 
  tgp_movement_events.0160.t: "Gươm Nghỉ Ngơi"
  tgp_movement_events.0160.desc: "Ngọn nến bập bùng khi ta nhìn vào [ROOT.Char.Custom('GetWritingMaterial')] trống trước mặt. [rival.GetTitledFirstName] dẫn [rival_movement.GetName] một cách chắc chắn, và sẽ hữu ích nếu không chạm trán với [rival.GetHerHim].\n\nNhưng một lá thư như vậy... lời hứa không thù hận... liệu có thể bị coi là dấu hiệu yếu đuối?"
  tgp_movement_events.0160.a: "Lời nói chân thật là đủ."
  tgp_movement_events.0160.b: "Vàng có thể truyền đạt mọi điều."
  tgp_movement_events.0160.c: "Ta không muốn mất lựa chọn."
  tgp_movement_events_0160_scheme_blocking_effect_tt: "@alert_icon! #alert_trial Ngươi và [rival.GetShortUIName] sẽ không thể bắt đầu [hostile_schemes|E] chống lại nhau trong #V 15 năm#!#!"
  no_scheming_allowed_var_tt: "Ngài và [recipient.GetShortUIName] đã hứa sẽ không khởi xướng [hostile_schemes|E] chống lại nhau cho đến [GetCurrentDateWithDiff( GetVarTimeRemaining( actor.MakeScope, 'no_scheming_allowed_var') )]"
  personal_movement_power: "$game_concept_personal_movement_power$"
