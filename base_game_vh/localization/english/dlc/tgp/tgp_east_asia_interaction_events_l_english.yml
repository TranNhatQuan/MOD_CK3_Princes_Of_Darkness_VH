l_english:
  tgp_east_asia_interaction_events.0010.opening: "[leaving_tributary.Custom2('AppropriateGreeting', ROOT.Char)]"
  tgp_east_asia_interaction_events.0010.desc: "Ta giờ phục vụ một Devaraja khác. Một vị sẽ chỉ cho chúng ta con đường chân chính.\n\nHỡi mọi người, chào mừng [leaving_tributary.GetSuzerain.GetName]!"
  tgp_east_asia_interaction_events.0010.a: "Sao có thể thế này!"
  tgp_east_asia_interaction_events.0010.tt: "[leaving_tributary.GetShortUIName|U] không còn là [tributary|E] của Ngài nữa"


  tgp_east_asia_interaction_events.0020.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
  tgp_east_asia_interaction_events.0020.desc: "Devaraja của Ta đã đưa ra lý lẽ thuyết phục.\n\nHãy để chúng Ta phục vụ, dù chỉ thêm một thời gian nữa."
  tgp_east_asia_interaction_events.0020.a: "Đúng như Ta nghĩ."

  tgp_east_asia_interaction_events.0025.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
  tgp_east_asia_interaction_events.0025.desc: "Ta nhìn thấu những lời dối trá tầm thường của ngươi và sẽ không bị ép buộc dễ dàng!\n\nTa mong chờ nhiều hơn từ một Devaraja thực thụ!"
  tgp_east_asia_interaction_events.0025.a: "Vậy thì…"

  tgp_east_asia_interaction_events.0030.t: "Tiếp Nhận: Một Kẻ Thách Thức Đến"
  tgp_east_asia_interaction_events.0030.desc: "Dường như [actor.Custom2('InsultNoun', ROOT.Char)] [actor.GetTitledFirstName] đang cố dẫn dắt tributary của ta, [recipient.GetTitledFirstName], đi lạc.\n\nNgươi đã cố thuyết phục [recipient.GetFirstNameNoTooltip] về sự thần thánh phi lý của [actor.GetFirstNamePossessiveNoTooltip], làm lu mờ thần thánh của ta."
  tgp_east_asia_interaction_events.0030.a: "Ta sẽ gột rửa trí óc [recipient.GetHerHis] khỏi điều vớ vẩn này."
  tgp_east_asia_interaction_events.0030.b: "Ta sẽ giải quyết chuyện này bằng vũ lực!"
  tgp_east_asia_interaction_events.0030.c: "Ta còn việc quan trọng hơn phải lo."

  tgp_east_asia_interaction_events.0035.opening: "[sending_character.Custom2('AppropriateGreeting', ROOT.Char)]"
  tgp_east_asia_interaction_events.0035.desc.warring: "Ta lấy làm tiếc phải thông báo, [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('sending_character'))] phản bội, rằng ta đã chọn củng cố tributary của [recipient.GetTitledFirstNamePossessive] bằng vũ lực.\n\nHãy coi đây là cảnh báo."
  tgp_east_asia_interaction_events.0035.desc: "Ta lấy làm tiếc phải thông báo rằng đức tin của ta vẫn thuộc về Devaraja thực thụ của ta, [recipient.GetSuzerain.GetTitledFirstName].\n\nĐừng quấy rầy ta nữa."
  tgp_east_asia_interaction_events.0035.a: "Ta hiểu."

  embraced_my_tributary_opinion: "Đã Tiếp Nhận Tributary Của Ta"
  attempted_to_embrace_my_tributary_opinion: "Cố Gắng Tiếp Nhận Tributary Của Ta"

  tgp_east_asia_interaction_events.2000.t: "Gốc, Thân, và Cành"
  tgp_east_asia_interaction_events.2000.desc: "Trách nhiệm thiên liêng của tôi là thúc đẩy điều thiện và loại bỏ điều ác; và về điều ác, có rất ít nguồn gốc tội lỗi trong tầm tay tôi lớn hơn [recipient.GetTitledFirstName]! Tội ác của [recipient.GetHerHis|U] #EMP nhơ nhuốc#! cả dòng dõi hắn, và đối với kẻ có tội không thể có sự khoan hồng; việc tiêu diệt cái ác này phải ăn sâu vào tận gốc rễ.\n\nNhững kẻ chống lại ý chí của chúng ta sẽ run rẩy trước sự hủy diệt của [recipient.GetHerHis]; hãy để đầu của [recipient.GetHerHis] bị chặt lìa khỏi cơ thể [recipient.GetHerHis] và để mặc cho thối rữa ngoài chợ, xương cốt của [recipient.GetHerHis] không được chôn cất và linh hồn của [recipient.GetHerHis] không được yên nghỉ, và bất kỳ ai chia sẻ dòng máu độc hại của [recipient.GetHerHis] sẽ bị tử hình hoặc bị trục xuất đến bốn phương trời."
  tgp_east_asia_interaction_events.2000.a: "Bằng ý ta và quyền ta, #EMP ta sẽ #bold tận diệt#! [recipient.GetHerHis] danh!"
  tgp_east_asia_interaction_events.2000.a.title: "Trừng Phạt Tập Thể"
  tgp_east_asia_interaction_events.2000.a.tt: "[recipient.GetShortUIName] và gia đình của [recipient.GetHerHis] đã bị thanh trừng bởi [purger.GetShortUIName]"
  auto_accept_interaction_huangdi: "Quyền lực của triều đình là tuyệt đối"
  celestial_extinguish_noble_family_interaction_death_explanation: "Bất kỳ phụ thân mẫu thân và con trưởng thành – còn trẻ hơn [retirement_age|E] và cùng giới tính chiếm ưu thế theo [faithpossessive|E] – sẽ bị xử trảm"
  celestial_extinguish_noble_family_interaction_banish_explanation: "Bất kỳ [spouses|E] hay [concubines|E], cùng [close_family|E] và [extended_family|E] của cùng [house|E], sẽ bị [banished|E] khỏi [realm|E]"
  celestial_extinguish_noble_family_interaction_exemption_explanation: "Bất kỳ [spouse|E] hay [concubines|E], [close_family|E], hoặc [extended_family|E] [married|E] với hoặc là con của thành viên dòng [house|E] cầm quyền của [actor.GetHouse.GetName] sẽ được miễn"
  is_currently_being_purged_tt: "[recipient.GetShortUIName] đang bị thanh trừng"
  purged_banishment_opinion: "Tội Nhân Lưu Đày"
  purged_execution_opinion: "Tội Nhân Chém Đầu"
