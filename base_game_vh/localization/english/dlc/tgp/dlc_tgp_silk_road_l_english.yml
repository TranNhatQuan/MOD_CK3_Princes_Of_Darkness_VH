  INNOVATION_IN_SUB_REGION: "#T [silk_road_innovation|E]#! tại [SituationSubRegion.GetName] [region|E]"
  game_concept_silk_road_innovation: "Đổi mới $game_concept_silk_road_situation$"
  game_concept_silk_road_innovations: "Các đổi mới $game_concept_silk_road_situation$"
  game_concept_silk_road_innovation_desc: "$game_concept_silk_road_innovations$ là những [innovations|E] lan rộng về phía tây dọc theo [silk_road_situation|E].\n\nCứ mỗi [GetDefine('NSilkRoad', 'INNOVATION_TRAVEL_DURATION')|0V] năm, một $game_concept_silk_road_innovation$ do [culture|E] Hán khám phá sẽ được chỉ định ngẫu nhiên cho [situation_sub_region|E] Trung Hoa, với tất cả các $game_concept_silk_road_innovations$ khác di chuyển về phía tây dọc theo $game_concept_silk_road$.\n\n$game_concept_cultures$ có [tradition|E] [GetCultureTradition('tradition_sinophilic').GetName] có quyền tiếp cận tất cả $game_concept_silk_road_innovations$ do [culture|E] Hán khám phá.\n\n[rulers|E] bên ngoài $game_concept_silk_road$ có thể cố gắng mang kiến thức trở lại [culture|E] của họ thông qua [decision|E] [GetDecisionWithKey('visit_silk_road_market_decision').GetName|V]. Nếu thành công, $game_concept_silk_road_innovation$ có thể được khám phá như bất kỳ $game_concept_innovation$ nào khác sau khi họ trở về."
  game_concept_silk_road_innovation_short: "$game_concept_silk_road_situation$"
  game_concept_silk_road_innovation_i: "@silk_road_icon!"
  game_concept_silk_road_innovation_short_i: "@silk_road_icon! [silk_road_innovation_short|E]"

  visit_silk_road_market_decision: "Tham Quan Chợ Con Đường Tơ Lụa"
  visit_silk_road_market_decision_desc: "Sự giàu có trên Con Đường Tơ Lụa không chỉ nằm trong vàng bạc. Đôi khi có những... #italic ý tưởng mới#! được truyền từ chợ này sang chợ khác trên lưng lạc đà. Tham quan đúng chợ, nói chuyện với đúng người, và khám phá những bí mật chưa ai biết đến."
  visit_silk_road_market_decision_tooltip: "Đi đến một chợ trên Con Đường Tơ Lụa để mở khóa các [innovations|E] độc đáo"
