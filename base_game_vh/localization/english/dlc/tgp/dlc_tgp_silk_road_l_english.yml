  tgp_silk_road_events.0010.desc: "Đi giữa những gian hàng nhộn nhịp của [ROOT.Char.GetCurrentLocation.GetName], hướng dẫn viên của Ta nhắc về những mảnh hội thoại nghe lỏm được, “[innovation_temp.GetName]” được nhắc đi nhắc lại. Thị trấn náo nhiệt về nó, nhưng giọng nói họ nhỏ đi khi thấy những người lạ như Ta đi qua.\n\nTa nhận thấy một nhóm thương nhân tụ tập dưới một gian hàng, dường như ít cảnh giác hơn những người khác, và vẫn tiếp tục nói chuyện khi Ta và hướng dẫn tiếp cận. Đây có phải là cơ hội để học hỏi?"
