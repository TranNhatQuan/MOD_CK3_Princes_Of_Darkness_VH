l_english: 
 # the Silk Road
  silk_road_situation: "Con Đường Tơ Lụa"
  silk_road_situation_desc: "$game_concept_silk_road_situation_desc$"
  situation_silk_road_situation_desc: "$silk_road_situation_desc$"

  game_concept_silk_road_situation: "Con Đường Tơ Lụa"
  game_concept_silk_road: "$game_concept_silk_road_situation$"
  game_concept_silk_road_situation_desc: "$game_concept_silk_road_situation$ không phải chỉ là một con đường, mà là cả một mạng lưới các tuyến đường nối những góc xa nhất của nền văn minh để trao đổi vàng, hàng hóa và ý tưởng. Có quyền truy cập vào Con Đường Tơ Lụa là có quyền tiếp cận tất cả sự giàu có của thế giới.\n\nCác mức độ truy cập khác nhau vào Con Đường Tơ Lụa đem lại các khoản vàng khác nhau, và có thể mở ra những cơ hội độc đáo để khám phá các [innovations|E] kỳ lạ. Lượng vàng và tri thức di chuyển trên Con Đường Tơ Lụa sẽ thay đổi tùy theo sự thịnh vượng của nó, chịu ảnh hưởng bởi nhiều yếu tố, bao gồm chiến tranh, sự kiện, và [dynastic_cycle|E] của Trung Quốc."
  game_concept_situation_silk_road_phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
  game_concept_situation_silk_road_phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
  game_concept_situation_silk_road_phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
  game_concept_situation_silk_road_phase_steady_trading_desc: "$situation_silk_road_phase_steady_trading_desc$"
  game_concept_situation_silk_road_phase_hardship: "$situation_silk_road_phase_hardship$"
  game_concept_situation_silk_road_phase_hardship_desc: "$situation_silk_road_phase_hardship_desc$"

  situation_silk_road_phase_exceptional_bounty: "Kho Báu Phi Thường"
  situation_silk_road_phase_exceptional_bounty_desc: "Những kho báu tuyệt vời có thể thu được, lợi nhuận cao nhất được tạo ra, và ý tưởng cùng sáng kiến lan rộng nhất khi thời kỳ trên Con Đường Tơ Lụa thuận lợi."
  situation_silk_road_phase_steady_trading: "Giao Dịch Ổn Định"
  situation_silk_road_phase_steady_trading_desc: "Lợi nhuận được tạo ra, thương lượng diễn ra, và kinh doanh tiếp tục như thường lệ. Có thể có các cơ hội sinh lợi hơn ở nơi khác, nhưng Con Đường Tơ Lụa đáng tin cậy hơn."
  situation_silk_road_phase_hardship: "Khó Khăn"
  situation_silk_road_phase_hardship_desc: "Do chiến tranh, tai ương, và những bước ngoặt không thể đoán trước của số phận, Con Đường Tơ Lụa hoàn toàn đình trệ. Không có vàng hay ý tưởng nào di chuyển, và thứ duy nhất đạt được từ việc theo các tuyến đường của Con Đường Tơ Lụa là đau khổ và nghèo đói."
  phase_exceptional_bounty: "$situation_silk_road_phase_exceptional_bounty$"
  phase_exceptional_bounty_desc: "$situation_silk_road_phase_exceptional_bounty_desc$"
  phase_steady_trading: "$situation_silk_road_phase_steady_trading$"
  phase_steady_trading_desc: "$situation_silk_road_phase_steady_trading_desc$"
  phase_hardship: "$situation_silk_road_phase_hardship$"
  phase_hardship_desc: "$situation_silk_road_phase_hardship_desc$"

  situation_silk_road_situation: "Tình Trạng $game_concept_silk_road_situation$"

  silk_road_phase_effects_concept: "[silk_road|E]"

  silk_road_situation_participant_group_china_realm: "Thiên Hạ"
  silk_road_situation_participant_group_china_realm_desc: "Nhân vật này là một [ruler|E] không [nomadic|E] trong [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]."
  silk_road_situation_participant_group_silk_road_domain: "Lãnh Thổ Con Đường Tơ Lụa"
  silk_road_situation_participant_group_silk_road_domain_desc: "Nhân vật này là một [independent_ruler|E] không [nomadic|E] ngoài [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName] có [domain|E] nằm trên [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
  silk_road_situation_participant_group_silk_road_realm: "Các Vương Quốc Con Đường Tơ Lụa"
  silk_road_situation_participant_group_silk_road_realm_desc: "Nhân vật này là một [independent_ruler|E] không [nomadic|E] ngoài [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName] có [realm|E] nằm trên [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
  silk_road_situation_participant_group_silk_road_periphery: "Các Vương Quốc Ngoại Vi"
  silk_road_situation_participant_group_silk_road_periphery_desc: "Nhân vật này là một [independent_ruler|E] không [nomadic|E] ngoài [GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName] có [realm|E] nằm trong [GetGeographicalRegion('tgp_silk_road_region').GetName]."
  silk_road_situation_participant_group_silk_road_nomad: "Người Du Mục Thảo Nguyên"
  silk_road_situation_participant_group_silk_road_nomad_desc: "Nhân vật này là một [nomadic|E] [independent_ruler|E] đã lập trại trong [silk_road_situation|E]."
  silk_road_situation_all: "Hiện Tại [silk_road|E] [situation_phase|E]"

  silk_road_situation_sub_region_region_silk_road_proper_china: "Trung Quốc"
  silk_road_situation_sub_region_region_silk_road_proper_china_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Từ phương đông, lụa và trà được thương nhân mua và bắt đầu hành trình chậm ra ngoài. Cùng với những hàng hóa đó, thương nhân mang theo một thứ nữa: những #italic ý tưởng mới#!.#!"
  silk_road_situation_sub_region_region_silk_road_proper_tibet: "Tây Tạng"
  silk_road_situation_sub_region_region_silk_road_proper_tibet_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Cao nguyên Tây Tạng là một cảnh quan hiểm trở, nhưng các tuyến thương mại có thể được tìm thấy giữa các thung lũng và đèo rải rác trong vùng.#!"
  silk_road_situation_sub_region_region_silk_road_proper_india: "Ấn Độ"
  silk_road_situation_sub_region_region_silk_road_proper_india_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Thương mại chảy qua vùng này như dòng nước của sông Hằng và sông Ấn, lúc tràn lúc rút nhưng luôn hiện hữu.#!"
  silk_road_situation_sub_region_region_silk_road_proper_central_asia: "Trung Á"
  silk_road_situation_sub_region_region_silk_road_proper_central_asia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Con mắt tinh anh có thể quan sát thảo nguyên và nhận ra vô số con đường mở phía trước. Cơ hội luôn hiện hữu, cho cả thương nhân lẫn kẻ cướp.#!"
  silk_road_situation_sub_region_region_silk_road_proper_transcaspia: "Transcaspia"
  silk_road_situation_sub_region_region_silk_road_proper_transcaspia_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Biển Caspi và Biển Đen mang lại cơ hội độc đáo cho thương mại và đi lại. Các con sông nối các vùng nước này đến các vùng phía Bắc, với mạng lưới thương mại riêng và cơ hội làm giàu riêng.#!"
  silk_road_situation_sub_region_region_silk_road_proper_occident: "Phương Tây"
  silk_road_situation_sub_region_region_silk_road_proper_occident_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Đây là nơi các đoàn lữ hành lớn đến điểm cuối cùng, và tài sản được tạo ra hoặc mất đi.#!"

  silk_road_situation_phase_exceptional_bounty_situation_phase: "$situation_silk_road_phase_exceptional_bounty$"
  silk_road_situation_phase_steady_trading_situation_phase: "$situation_silk_road_phase_steady_trading$"
