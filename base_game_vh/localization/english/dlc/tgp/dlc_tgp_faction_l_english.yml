  tgp_decision_events.0102.t: "$tgp_decision_events.0100.t$"
  tgp_decision_events.0102.desc: "[petition_recipient.GetName] nhìn Ta với vẻ ngạc nhiên.\n\n\"Ta không ngờ hôm nay nghe được một yêu cầu táo bạo như vậy. Ta thấy thú vị! Tuy nhiên, Ta e rằng phải từ chối.\" [petition_recipient.GetSheHe|U] vẫy tay xua Ta đi. \"Mời người kiến nghị tiếp theo.\" \n\nTa sững sờ một khoảnh khắc. Chắc vẫn còn cách nào đó!"
  tgp_decision_events.0102.a: "Ta sẽ tận dụng ảnh hưởng của mình!"
  tgp_decision_events.0102.b: "Đế chế cần một quân đội."
  tgp_decision_events.0102.c: "Vẫn còn các cách thuyết phục khác..."
  tgp_decision_events.0102.d: "Ta sẽ tự mình đề nghị."
  tgp_decision_events.0102.forfeit: "Ta sẽ không phản đối ý trời."
  tgp_decision_events.0102.petition_refused: "Đơn kiến nghị bị #X từ chối#!"
  tgp_decision_events.0102.petition_accepted: "Đơn kiến nghị được #P chấp thuận#!"
  tgp_decision_events.0101.a_title: "Đơn Kiến Nghị Được Chấp Thuận"
  tgp_decision_events.0103.t: "$tgp_decision_events.0100.t$"
  tgp_decision_events.0103.desc: "Sự từ chối của Ta làm [petitioner.GetName] buồn bã, nhưng [petitioner.GetSheHe] nhanh chóng lấy lại bình tĩnh và hỏi:\n\n\"Xin lỗi vì sự hỗn xược, nhưng Ta sẽ không dễ dàng bị từ chối như vậy. Vấn đề này quan trọng với tất cả thành viên của [actors_movement.GetName]. Xin hãy xem xét lại.\" [petitioner.GetSheHe|U] đưa tay ra."
  tgp_decision_events.0103.desc_give_influence: "\"Ta được người dân tôn trọng và họ tin tưởng Ta là tiếng nói của họ. Chúng Ta chỉ quan tâm đến sự thịnh vượng của [GetTitleByKey('h_china').GetName].\""
  tgp_decision_events.0103.desc_give_maa: "\"Đế chế sẽ có ích khi dùng những trung đoàn tinh nhuệ của Ta. Đồng ý với chúng Ta và chúng sẽ nằm dưới quyền chỉ huy của Ngài.\""
  tgp_decision_events.0103.desc_use_hook: "\"Chúng ta đã quen biết nhau lâu rồi. Ta nghĩ Ngài nợ Ta một ân huệ và Ta muốn Ngài đồng ý với chúng Ta.\""
  tgp_decision_events.0103.desc_give_hook: "\"Ta tự nguyện làm một người hầu trung thành. Ngài có thể dùng sức mạnh và ảnh hưởng của Ta khi thời kỳ khó khăn đến, vì Ta đang yêu cầu quyền lực của Ngài bây giờ.\""
  tgp_decision_events.0103.a: "\"Rất tốt, Ta sẽ chấp thuận điều Ngài muốn.\""
  tgp_decision_events.0103.b: "\"Biến khỏi mắt Ta — #emp ngay!#!\""
  tgp_decision_events.0103.a_title: "$tgp_decision_events.0101.a_title$"
  tgp_decision_events.0103.b_title: "Đơn Kiến Nghị Bị Từ Chối"
  tgp_decision_events.0100.desc_increase_budget: "tăng lương cho tất cả"
  tgp_decision_events.0100.desc_increase_budget_salary: "$tgp_decision_events.0100.desc_increase_budget$ quan trưởng.\n\nHọ cần nhiều ngân khố hơn để giữ cho lãnh thổ thịnh vượng. Đầu tư vào các hoạt động văn hóa và công trình."
  tgp_decision_events.0100.desc_increase_budget_ministry: "$tgp_decision_events.0100.desc_increase_budget$ các bộ trưởng.\n\nHọ khởi xướng nhiều dự án quan trọng và cần kinh phí để duy trì."
  tgp_decision_events.0100.desc_increase_budget_military: "$tgp_decision_events.0100.desc_increase_budget$ chỉ huy.\n\nHọ phải duy trì quân đội và có phương tiện huy động chúng. Kẻ thù phải sợ chúng ta!"
  tgp_decision_events.0100.desc_increase_budget_outro: "\n\nTuy nhiên, kho bạc của [hegemon.GetTitleAsNamePossessive] là hữu hạn. Để đơn kiến nghị này được tài trợ, một ngân sách khác phải bị cắt giảm."
  tgp_decision_events.0100.f: "Tướng lĩnh lãng phí quỹ nhân danh quốc phòng."
  tgp_decision_events.0100.g: "Các quan trưởng chi tiêu quá xa hoa."
  tgp_decision_events.0100.h: "Bộ trưởng khai thác ngân khố cho các dự án vô ích."
  tgp_decision_events.0101.desc_increase_budget_salary: "$tgp_decision_events.0100.desc_increase_budget_salary$"
