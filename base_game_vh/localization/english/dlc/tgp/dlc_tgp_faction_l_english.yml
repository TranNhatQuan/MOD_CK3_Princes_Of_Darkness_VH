  replace_ceremonial_regent_faction_desc_kampaku: "Lãnh đạo Phe thay thế [ceremonial_regent|E] hiện tại và chiếm tất cả [landed|E] [titles|E] của họ"
  replace_ceremonial_regent_faction_short_effect_desc_emperor: "Muốn được bổ nhiệm làm [cloistered_emperor|E]"
  replace_ceremonial_regent_faction_short_effect_desc_regent: "Muốn được bổ nhiệm làm [ceremonial_regent|E]"
  FACTION_JAPANESE_REPLACE_REGENT_NAME_DYNAMIC: "Bổ nhiệm [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U] làm $game_concept_ceremonial_regent$"
  FACTION_JAPANESE_REPLACE_REGENT: "Yêu cầu $replace_ceremonial_regent_faction_name$"
  FACTION_JAPANESE_REPLACE_REGENT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nCác quý tộc trung thành của [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] không còn tin tưởng vào sự nhiếp chính không thể chịu nổi của ngài! Hãy nhường quyền lực cho ta, nếu không sẽ phải đối mặt với thanh gươm của chúng ta trên chiến trường!"
  FACTION_JAPANESE_REPLACE_RULER_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nCác quý tộc trung thành của [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] không còn tin tưởng vào chế độ chuyên quyền vô hướng dẫn của ngài! Hãy giao quyền lực cho ta, nếu không sẽ phải đối mặt với thanh gươm của chúng ta trên chiến trường!"
  FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED: "Yêu cầu $replace_ceremonial_regent_faction_name$ được chấp nhận"
  FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNỗ lực chiếm quyền trơ trẽn và vô liêm sỉ của ngài chỉ làm yếu [faction_target.GetPrimaryTitle.GetNameNoTier]. Tuy nhiên, để tránh đổ máu không cần thiết, ta sẽ chấp nhận yêu cầu của ngài..."
  FACTION_JAPANESE_REPLACE_REGENT_REFUSED: "Yêu cầu $replace_ceremonial_regent_faction_name$ bị từ chối"
  FACTION_JAPANESE_REPLACE_REGENT_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nCố gắng hăm dọa vô lý của ngài sẽ không bao giờ thành công. Ta là [faction_target.GetTitleAsNameNoTooltip] hợp pháp của [faction_target.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Tất cả kẻ phản bội sẽ gặp công lý — trên chiến trường nếu cần!"
  FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION: "Nhiếp chính phải ngã!"
  FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION_DESC: "Thời điểm đã đến! Các lãnh chúa của [faction.GetName] đồng ý rằng [faction_target.GetName] là kẻ chuyên quyền phải nhường [faction_target.GetHerHis] quyền lực — bằng gươm, nếu cần!"
  cannot_create_claimant_faction_against_kampaku_tooltip: "[claimant|E] [factions|E] không thể được tạo chống lại [ceremonial_regent|E]"
  FACTIONS_WINDOW_JAPANESE_REGENT: "Kẻ thách thức"
  replace_ceremonial_regent_faction_kampaku_trigger: "Chỉ [kampaku|E] hoặc [joko|E] mới có thể bị thay thế"
  not_house_head_allied_to_faction_target_trigger: "Ngươi không thể là thành viên của nhà [faction|E] mục tiêu"
  not_house_member_of_faction_target_trigger: "[house_head|E] của ngươi không thể có [alliance|E] với [faction|E] mục tiêu"
  must_be_leading_house_of_bloc_trigger: "Trong [governments|E] có [house_blocs|E], chỉ [house_heads|E] của $game_concept_bloc_possessive$ [leading_house|E] mới có thể tạo [factions|E] chống lại [top_liege|E]"
