  restore_ceremonial_liege_faction_name: "Phục Hưng $game_concept_ceremonial_liege$"
  restore_ceremonial_liege_faction: "Phe $restore_ceremonial_liege_faction_name$"
  restore_ceremonial_liege_faction_desc: "Các thành viên của [faction|E] $restore_ceremonial_liege_faction_name$ tìm cách lật đổ [ceremonial_regent|E] và tái thiết lập sự cai trị trực tiếp của [ceremonial_liege|E].\n\n#S Tối hậu thư#!\n[ceremonial_liege|E] thay thế [ceremonial_regent|E], chiếm tất cả các [titles|E] [landed|E] của họ, và áp dụng [succession|E] $single_heir_succession_law$"
  restore_ceremonial_liege_faction_short_effect_desc: "Muốn khôi phục quyền lực cho [ceremonial_liege|E]"
  FACTION_JAPANESE_RESTORE_EMPEROR_NAME_DYNAMIC: "Phục Hưng [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U]"
  FACTION_JAPANESE_RESTORE_EMPEROR: "Yêu Cầu $restore_ceremonial_liege_faction_name$"
  FACTION_JAPANESE_RESTORE_EMPEROR_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSự chuyên chế của ngài đối với triều đình [ROOT.Char.Custom('GetTitleTierAdjective')], hoàng gia, và toàn bộ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], phải chấm dứt.\n\nHãy nhường chỗ cho vị vua thực sự của chúng ta, [faction.GetSpecialCharacter.GetTitledFirstName]!"
  tgp_faction_events.0201.b: "Ngươi sẽ trả giá vì đã làm ô danh dự của [faction.GetSpecialCharacter.GetTitleAsNamePossessiveNoTooltip]!"
  tgp_faction_events.0201.b.cm: "Ngươi dám xé nát [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] sao?!"
  FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED: "Yêu Cầu $restore_ceremonial_liege_faction_name$ Được Chấp Nhận"
  FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTa chỉ có ý định tốt nhất cho triều đình [ROOT.Char.Custom('GetTitleTierAdjective')], hoàng gia, và toàn bộ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\n\nMặc dù ta nghi ngờ động cơ của các ngươi, ta sẽ không đứng cản đường [faction.GetSpecialCharacter.GetTitledFirstName]."
  FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED: "Yêu Cầu $restore_ceremonial_liege_faction_name$ Bị Từ Chối"
  FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nThật xấc xược! Ta chỉ có ý định tốt nhất cho triều đình [ROOT.Char.Custom('GetTitleTierAdjective')], hoàng gia, và toàn bộ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\n\nNgươi và lũ phản tặc sẽ phải trả giá vì đã làm hoen ố danh dự của [faction.GetSpecialCharacter.GetTitleAsNamePossessiveNoTooltip]!"
  FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION: "$restore_ceremonial_liege_faction_name$ "
  FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\nSự chuyên chế của [faction_target.GetTitledFirstNamePossessive] đối với triều đình [ROOT.Char.Custom('GetTitleTierAdjective')], hoàng gia, và toàn bộ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], phải chấm dứt.\n\nChúng ta phải sẵn sàng chiến đấu để khôi phục vị vua thực sự, [faction.GetSpecialCharacter.GetTitledFirstName]!"
  FACTIONS_WINDOW_JAPANESE_RESTORE_EMPEROR: "[ceremonial_liege|E]"
  tgp_faction_events.0206.t: "Phục Vụ [claimant.GetTitleAsNameNoTooltip]"
  tgp_faction_events.0206.desc: "Cuối cùng, cuộc chiến chính nghĩa của những người trung thành đã chiến thắng, trừ bỏ sự gian ác của [defender.GetTitledFirstName] và giải phóng [claimant.GetTitleAsName] khỏi ảnh hưởng đen tối của [defender.GetHerHis].\n\nDù triều đình đã được khôi phục, chiến tranh đã gây chấn động quận hạt, và tất cả [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] nhìn ta như người mang lại hòa bình và bảo hộ hoàng gia..."
  tgp_faction_events.0206.a: "Muôn năm cho [claimant.GetTitleAsNameNoTooltip]!"
  tgp_faction_events.0206.b: "Con đường gian nan, chủ nhân của chúng ta phải được dẫn dắt..."
  faction_member_custom: "Tất cả thành viên [phe|E]"

