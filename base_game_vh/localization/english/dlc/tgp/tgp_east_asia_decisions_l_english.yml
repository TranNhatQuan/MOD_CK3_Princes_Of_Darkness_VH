  visit_local_shrine_decision: "Thực Hiện Lễ Hiến Tế"
  visit_local_shrine_decision_desc: "Chúng ta không cần đi xa để thể hiện sự thành tâm. Một chuyến đi ngắn đến đền thờ gần đó và dâng lễ; chúng ta có thể giữ được sự phù hộ của thần thánh trong tương lai gần."
