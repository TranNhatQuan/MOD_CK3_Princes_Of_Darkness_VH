  assimilate_to_mandala_decision: "Hòa Nhập Dưới Quyền Mandala"
  assimilate_to_mandala_decision_government_desc: "Một thực thể thần thánh đi trên trần thế, việc tổ chức chính quyền này chỉ có lợi cho sự tồn tại của chúng ta. Hãy xem chúng ta học được gì khi hòa nhập với cách cai trị này."
  assimilate_to_mandala_decision_faith_desc: "Chúng ta nên học theo và hòa nhập. Là tín đồ chân chính của sự tồn tại Devaraja, chắc chắn chúng ta sẽ sống trọn vẹn hơn — và biết đâu, chúng ta còn có cơ hội gia nhập nhóm được ưu ái..."
  assimilate_to_mandala_decision_desc: "Chúng ta chỉ là con người, được dẫn dắt bởi một thực thể vĩ đại hơn chính mình. Chúng ta nên thích nghi và thực sự biến đổi thành tín đồ của sự tồn tại thần thánh Devaraja — tất nhiên là vì lợi ích của thần dân."
  assimilate_to_mandala_decision_tooltip: "[AddLocalizationIf( And( Not( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ) ), Not( ObjectsEqual( GetPlayer.GetFaith, GetPlayer.GetOverlord.GetFaith ) ) ), 'assimilate_to_mandala_decision_tooltip_both' )][AddLocalizationIf( And( Not( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ) ), ObjectsEqual( GetPlayer.GetFaith, GetPlayer.GetOverlord.GetFaith ) ), 'assimilate_to_mandala_decision_tooltip_government' )][AddLocalizationIf( And(  GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), Not( ObjectsEqual( GetPlayer.GetFaith, GetPlayer.GetOverlord.GetFaith ) ) ), 'assimilate_to_mandala_decision_tooltip_faith' )]" #It is not cursed if it works :colbert:
  assimilate_to_mandala_decision_tooltip_both: "Bỏ [government|E] hiện tại cũng như [faith|E] để chuyển sang Chính quyền và Tín ngưỡng của [overlord|E]"
