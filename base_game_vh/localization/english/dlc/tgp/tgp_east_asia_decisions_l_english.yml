  assimilation_payout_tt_requirements: "Nếu [THIS.Char.GetSuzerain.GetShortUIName] vẫn còn sống, có chính quyền [mandala|E] và #BOLD chưa#! mất bất kỳ [piety_levels|E] nào trong #V [EmptyScope.ScriptValue('assimilation_payout_years')]#! năm, [THIS.Char.GetShortUIName] nhận được:"
