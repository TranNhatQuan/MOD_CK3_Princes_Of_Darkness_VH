  sacrifice_to_heaven: "Thực hiện hành trình tôn giáo tới đền thờ vùng để dâng [gold_i][gold|E] hoặc [prestige_i][prestige|E] để nhận lại [piety|E]"

  local_rites.1.t: "Chuyến Hành Hương Thần Thánh"
  local_rites.1.desc: "Dù có thể dâng lễ tại bất kỳ ngôi đền nào, ngay cả đền địa phương ở [capital_location.GetNameNoTooltip], rõ ràng không phải nơi linh thiêng nào cũng ngang nhau.\n\nMột chuyến thăm tới cộng đồng đền thờ chuyên biệt có thể mất nhiều thời gian, nhưng sẽ ấn tượng hơn."
  local_rites.1.home: "Đền của chúng ta là đủ"
  local_rites.1.home.tt: "Một lễ vật tại đền địa phương ở [tooltip_loc.GetNameNoTooltip] sẽ tiết kiệm chuyến đi.\nLễ vật này sẽ tốn [gold_i][THIS.ScriptValue('miniscule_gold_value')|-0] để nhận [piety_i][THIS.ScriptValue('minor_piety_gain')|+0]"
  local_rites.1.mount_tai: "Ta phải đến núi Thái để thực hiện lễ hiến"
  local_rites.1.fengshan.tt: "Lễ một lần mỗi triều đại với ảnh hưởng sâu sắc\nLễ này sẽ tốn [treasury_i][THIS.ScriptValue('major_treasury_value')|-0] và [prestige_i][THIS.ScriptValue('massive_prestige_value')|-0] để nhận [piety_i][THIS.ScriptValue('major_piety_gain')|+0] và [legitimacy_i][THIS.ScriptValue('massive_legitimacy_gain')|+0]"
  local_rites.1.major_shrine: "Các đền thờ tại [point_of_interest_location.GetNameNoTooltip]"
  local_rites.1.major_shrine.tt: "Lễ vật tại đây sẽ tốn [gold_i][THIS.ScriptValue('medium_gold_value')|-0] hoặc [prestige_i][THIS.ScriptValue('medium_prestige_value')|-0] để nhận [piety_i][THIS.ScriptValue('major_piety_gain')|+0]"
  local_rites.1.normal.tt: "Lễ vật tại đây sẽ tốn [gold_i][THIS.ScriptValue('minor_gold_value')|-0] hoặc [prestige_i][THIS.ScriptValue('minor_prestige_value')|-0] để nhận [piety_i][THIS.ScriptValue('medium_piety_gain')|+0]"
  local_rites.1.hills: "Đền thờ trên những ngọn đồi nhấp nhô ở [hills_location.GetNameNoTooltip]"
  local_rites.1.forest: "Đền rừng ở [forest_location.GetNameNoTooltip]"
  local_rites.1.mountains: "Đền núi ở [mountains_location.GetNameNoTooltip]"
  local_rites.1.temple_holding: "Ngôi đền của [temple_holding_location.GetNameNoTooltip]"
  local_rites.2.toast: "Ngài đã đến Đền Thờ"


  local_rites.3.t: "Hiến Tế Trời"
  local_rites.3.t.fengshan: "Phong và Sơn"
  local_rites.3.fallback.t: "Hiến Tế Các Vị Thần"
  local_rites.3.desc_mt_tai_huangdi: "Ít người từng chứng kiến Lễ Fengshan ở núi Thái, nhưng hầu như ai cũng hiểu ý nghĩa. Một bàn thờ mới đã được dựng từ đất trên đỉnh núi Thái, và đất phía dưới được làm sạch để tôn vinh đất trời.\n\nHầu hết tiền nhân của Ta chưa từng cố gắng hòa giải giữa Trời và Đất, cơ hội này để bảo vệ tương lai triều đại [GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip] là hiếm có."
  local_rites.3.desc_important_shrine: "Các đền thờ tại [shrine_location.GetName] vừa cổ kính vừa ấn tượng, và những người chăm sóc dường như quen với khách quan trọng. Quan sát nơi linh thiêng nơi vô số tín đồ đã tôn kính trước Ta, Ta cảm thấy một niềm tôn kính.\n\n\"Bảo trợ là quan trọng trong duy trì các địa điểm linh thiêng như thế này. Khách thường dâng cúng để hỗ trợ cộng đồng tu viện.\" [companion.GetName] nhìn Ta lịch sự nhưng hơi tò mò."
  local_rites.3.desc_at_home: "Một lễ vật tại đền gia đình [shrine_location.GetName] có thể không ấn tượng như ở một ngôi đền lớn, nhưng vẫn quan trọng như một hành động thành tâm.\n\nKhi thực hiện lễ, Ta cảm thấy bình yên nội tâm mà lâu rồi chưa từng trải qua."
  local_rites.3.desc_mountain_shrine: "Leo nhiều bậc thang đến đền trên núi ở [shrine_location.GetName] mệt nhưng cũng giúp suy ngẫm. Hành trình hành hương này sẽ còn in sâu trong tâm trí sau khi kết thúc lễ.\n\nKhi tới đỉnh, [companion.GetName] quay sang Ta: \"Duy trì nơi này là đáng ngưỡng mộ. Có lẽ chúng ta có thể hỗ trợ các tu sĩ ở đây? Đây là phong tục.\""
  local_rites.3.desc_hills_shrine: "Cảnh quan nhấp nhô của [shrine_location.GetName] đẹp và khi tới đền để dâng lễ Ta đã cảm thấy bình yên nội tâm.\n\nSau bậc cuối cùng, [companion.GetNameNo] nhìn Ta: \"Ở đây có một cộng đồng nhỏ hỗ trợ đền. Chúng ta có thể giúp họ?\""
  local_rites.3.desc_forest_shrine: "Đạt tới đền nhỏ ở [shrine_location.GetName] sau khi đi qua tán cây. Không gian yên tĩnh và thư giãn, Ta biết sẽ nhớ khoảnh khắc này lâu sau khi hành hương kết thúc.\n\n\"Chúng ta nên xem xét giúp cộng đồng nơi đây và đảm bảo sự thịnh vượng của đền.\" Ta quay lại thấy [companion.GetName] nhìn Ta tò mò."
  local_rites.3.desc_holding_shrine: "Đến đền ở [shrine_location.GetName], Ta suy ngẫm về vai trò và ý nghĩa của nó. Có nhiều đền quan trọng hơn nhưng không có nghĩa nơi này không là cộng đồng tu viện gương mẫu. Nhìn thấy lòng tôn kính của những người sống nơi đây thật cảm hứng.\nKhi chuẩn bị rời đi, [companion.GetName] quay sang Ta: \"Đây là nơi linh thiêng, và suy nghĩ của Ta phải hướng về thần thánh, nhưng những người chăm sóc nơi đây cũng xứng đáng được tôn kính.\""
  local_rites.3.desc_cynical: "\n\nTa khó chịu nhưng có lẽ phải làm điều được mong đợi."
  fengshan_option: "Theo Mệnh Trời"
  local_rites.3.pay_gold: "Hãy dâng cúng"
  local_rites.3.pay_prestige: "Chỉ có sự thành tâm để dâng"
  local_rites.3.pay_at_home: "\"Được thôi\""
  local_shrine.optout: "Công việc trần tục cần được quan tâm"
  local_shrine.optout.flavor: "Chuyến thăm đền có thể sắp xếp sau"
  visit_local_shrine_modifier: "Thực hiện Lễ Tại Đền Địa Phương"
  visit_local_shrine_modifier_desc: "Nhân vật này hiện đang cống hiến bản thân cho một lễ vật tại đền."

  seize_mandala_capital_decision: "Chiếm Lấy Khu Đền Mandala"
  seize_mandala_capital_decision_desc: "Một khu đền xứng đáng Devaraja ở ngay trước cửa? Chúng ta nên dời đến và mở rộng quyền lực từ đó. Điều này là vì lợi ích của tất cả thần dân trung thành."
  seize_mandala_capital_decision_tooltip: "Chiếm #V $building_type_mandala_capital_01$#! trong [de_jure_capital|E] từ [subject|E]"
  seize_mandala_capital_decision_confirm: "Mọi thứ đúng như lẽ phải."
 
  create_bunga_mas_decision: "Chế Tác Bunga Mas"
  create_bunga_mas_decision_tooltip: "Thuê một nghệ nhân địa phương chế tác [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] [artifact|E] cho ngươi"
  create_bunga_mas_decision_desc: "Những cây chế tác từ vàng bạc tinh xảo — báu vật tối thượng để dâng làm cống phẩm. Ta sẽ mang đến triều đình Chúa Công và hưởng vinh quang của nó!"
  create_bunga_mas_decision_confirm: "Yêu Cầu Bunga Mas"
  create_bunga_mas_decision_effect: "Chế Tác [Glossary( 'Bunga Mas', 'BUNGA_MAS_GLOSS' )] [artifact|E]\n$BULLET_WITH_TAB$Khi dâng lên Chúa Công:\n$TAB$$BULLET_WITH_TAB$Nhận tầng [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip] #WEAK (tối đa 3)#!"
  create_bunga_mas_decision_effect_message: ""
  BUNGA_MAS_GLOSS: "Bunga Mas, hay Hoa Vàng Bạc, là một hình thức cống phẩm sử dụng tại bán đảo Mã Lai. Nó gồm hai cây nhỏ chế tác từ vàng và bạc tinh chất lượng cao nhất."
