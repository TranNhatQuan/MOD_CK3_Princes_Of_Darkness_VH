  restore_mandala_capital_decision_desc: "Đống đổ nát, tàn tích… Chúng ta sẽ từ tro tàn vươn lên để xây dựng và phục hồi những gì đã mất. Vẻ rực rỡ của chúng ta sẽ lại tỏa sáng, phủ bóng lên những kẻ tìm cách hủy hoại."
