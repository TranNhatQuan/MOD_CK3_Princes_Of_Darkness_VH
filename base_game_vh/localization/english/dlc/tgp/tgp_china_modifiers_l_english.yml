l_english:
  tgp_forced_labor_modifier: "Lao Dịch Ép Buộc"
  tgp_forced_labor_modifier_desc: "Dân chúng huyện này bị ép phải lao động dưới mối đe dọa bạo lực, lòng oán thán quyền uy ngày một tăng."
  tgp_recruited_charlatan_modifier: "Thu Nhân Mạo Nghệ"
  tgp_recruited_charlatan_modifier_desc: "Nhân vật này thu được kinh nghiệm mưu mô nhờ giao thiệp với kẻ mạo danh thi sĩ."
  tgp_unpressed_taxes_modifier: "Thuế Không Gò Ép"
  tgp_unpressed_taxes_modifier_desc: "Huyện này thịnh vượng dưới triều quản lý khoan dung của quan lại."
  tgp_lowborn_chastiser_modifier: "Kẻ Kỷ Luật Hạ Dân"
  tgp_lowborn_chastiser_modifier_desc: "Nhân vật này giúp dân xóa bỏ nhục nhã vì nghèo khó bằng cách uy hiếp và trừng trị thân xác."
  tgp_lowborn_tenderizer_modifier: "Kẻ Giáo Hóa Hạ Dân"
  tgp_lowborn_tenderizer_modifier_desc: "Nhân vật này giúp dân xóa bỏ nhục nhã vì nghèo khó, mà các biện pháp kỷ luật chỉ để lại ít tàn dư."
  tgp_aided_farmers_modifier: "Giúp Đỡ Nông Dân"
  tgp_aided_farmers_modifier_desc: "Huyện này được phép thu hồi con trẻ khỏi nghĩa vụ chiến tranh của chúa công."
  tgp_disciplined_farmers_modifier: "Nông Dân Kỷ Luật"
  tgp_disciplined_farmers_modifier_desc: "Nông dân huyện này làm việc hăng hái sau khi chứng kiến một vụ xử tử công khai."
  tgp_sworn_service_modifier: "Thề Phụng Sự"
  tgp_sworn_service_modifier_desc: "Nhân vật này đang trả nợ cha mẹ bằng cách phục vụ triều đình. Không thể rời đi cho đến khi nợ đã trả xong."
  tgp_courtly_influence_modifier: "Ảnh Hưởng Triều Đình"
  tgp_courtly_influence_modifier_desc: "Nông dân huyện này hưởng lợi từ những hiểu biết mà một người trong số họ lĩnh hội tại triều đình."
  tgp_sanctioned_deity_modifier: "Thần Thừa Nhận"
  tgp_sanctioned_deity_modifier_desc: "Huyện này thờ phụng một thần mới được công nhận, và dòng khách viếng đền đều đặn đem lại lợi ích cho dân cư."
  tgp_debunked_deity_modifier: "Thần Bị Phá Sập"
  tgp_debunked_deity_modifier_desc: "Nhân vật này đã thành công phá hủy một thần khi thần còn non trẻ, bằng nghệ thuật hùng biện tài tình."
  tgp_resisted_alcohol_modifier: "Tránh Rượu"
  tgp_resisted_alcohol_modifier_desc: "Nhân vật này kiêng không tham dự yến tiệc rượu Bạch Tửu."
  tgp_stationed_troops_modifier: "Vùng Phòng Thủ"
  tgp_trained_monks_modifier: "Tăng Sinh Tập Dượt"
  tgp_trained_monks_modifier_desc: "Các tăng sĩ nơi đây được giám sát võ nghệ bởi chúa công, sẵn sàng bảo vệ vị trí trước kẻ xâm lược."
  tgp_adequately_trained_monks_modifier: "Tăng Sinh Tập Dượt Đầy Đủ"
  tgp_adequately_trained_monks_modifier_desc: "Các tăng sĩ nơi đây được giám sát võ nghệ bởi tướng quân của chúa công, ít ra cũng phần nào sẵn sàng bảo vệ vị trí."
  tgp_fattened_vanguard_modifier: "Tiền Phương Hưng Thịnh"
  tgp_fattened_vanguard_modifier_desc: "Huyện này cống nạp toàn bộ nam nhân có thể cho quân đội chúa công."
  tgp_diligent_workers_modifier: "Lao Công Siêng Năng"
  tgp_diligent_workers_modifier_desc: "Nông dân vùng này làm việc cật lực để hài lòng chúa công, nhằm bảo vệ con trẻ khỏi bị chiêu mộ."
  tgp_well_equipped_soldiers_modifier: "Binh Lực Trang Bị Tốt"
  tgp_well_equipped_soldiers_modifier_desc: "Binh sĩ đóng giữ nơi này được trang bị tốt hơn hầu hết."
  tgp_greatly_equipped_soldiers_modifier: "Binh Lực Trang Bị Hào Nhoáng"
  tgp_greatly_equipped_soldiers_modifier_desc: "Trang bị tốt nhất trong vùng, binh sĩ nơi đây chắc chắn sẽ thể hiện xuất sắc trong chiến trận."
  tgp_outmatched_local_warriors_modifier: "Binh Khí Luyện Thái"
  tgp_outmatched_local_warriors_modifier_desc: "Nhân vật này tìm thử thách nơi đất mới, và thấy mình vượt trội hơn hết thảy."
  tgp_strengthen_capital_character_modifier: "Xây Dựng Kinh Thành"
  tgp_strengthen_capital_character_modifier_desc: "Kinh thành Thiên Tử mới được trùng tu, nâng tầm uy nghi. Vùng kinh thành nay trở thành trung tâm không tranh cãi của thiên hạ."
  tgp_strengthen_capital_modifier: "Kinh Thành Thiên Tử"
  tgp_strengthen_capital_modifier_desc: "$tgp_strengthen_capital_character_modifier_desc$\n\n[dynastic_cycle|E]: #EMP Không#! Sự chênh lệch hàng năm từ [favored_movement|E] sẽ diễn ra trong bất kỳ [dynastic_cycle_era_type_stable|E] khi đây là [realm_capital|E][AddLocalizationIf( HasDlcFeature( 'wards_and_wardens' ), 'tgp_strengthen_capital_modifier_education_bonus')]"
  tgp_strengthen_capital_architects_modifier: "Kiến Trúc Vô Song"
  tgp_strengthen_capital_architects_modifier_desc: "Kinh thành Thiên Tử được trùng tu dưới sự giám sát của các kiến trúc sư tài ba, nâng cao khả năng phát triển dân số và thương mại."
  tgp_strengthen_capital_engineers_modifier: "Kỹ Thuật Tài Tình"
  tgp_strengthen_capital_engineers_modifier_desc: "Kinh thành Thiên Tử được trùng tu dưới sự giám sát của kỹ sư tài năng, nâng cao cơ sở hạ tầng và liên kết các khu định cư lân cận."
  tgp_strengthen_capital_sculptors_modifier: "Tượng Khắc Vinh Quang"
  tgp_strengthen_capital_sculptors_modifier_desc: "Trong lúc trùng tu kinh thành Thiên Tử, các nghệ nhân điêu khắc tinh túy nhất được mời tỉ mỉ trang trí từng chi tiết kiến trúc."
  tgp_strengthen_capital_modifier_education_bonus: "\nTăng thành công cho [GetActivityType('activity_adult_education').GetTextIcon][GetActivityType('activity_adult_education').GetName] [activity|E] tại [location|E]"
  tgp_minister_project_development_modifier: "Khu Vực Phát Triển"
  tgp_minister_project_development_modifier_desc: "Một [great_project|E] gần đây bỏ công sức phát triển khu vực này, nâng cấp thành phố, làng xóm và các tuyến đường kết nối."
  tgp_grand_canal_modifier: "Đại Cương Lộ"
  tgp_grand_canal_modifier_desc: "Khu vực này hưởng lợi từ kênh, hệ thống thủy lộ và cống rãnh, giúp vận chuyển hàng hóa và thương nhân thuận tiện."
  tgp_minister_project_establish_control_modifier: "Hành Chính Hòa Hợp"
  tgp_minister_project_establish_control_modifier_desc: "Huyện này vừa cải thiện bộ máy hành chính, tăng cường quyền kiểm soát của triều đình."
  tgp_minister_project_train_troops_modifier: "$great_project_type_minister_project_train_troops_contribution_train_troops$"
  tgp_minister_project_train_troops_modifier_desc: "Lính của huyện này hoàn thành khóa huấn luyện nghiêm ngặt do Bộ Binh giám sát."
  tgp_minister_project_train_troops_levy_bootcamp_modifier: "$great_project_type_minister_project_train_troops_contribution_levy_bootcamp$"
  tgp_minister_project_train_troops_levy_bootcamp_modifier_desc: "Lính nghĩa vụ của huyện này được huấn luyện bởi các tướng từ Bộ Binh trung ương."
  tgp_minister_project_train_troops_siege_exercise_modifier: "$great_project_type_minister_project_train_troops_contribution_siege_exercise$"
  tgp_minister_project_train_troops_siege_exercise_modifier_desc: "Huyện này được huấn luyện tiến hành bao vây, đồng thời chịu được các cuộc bao vây mạnh gấp đôi."
  tgp_minister_project_train_troops_natural_disaster_test_modifier: "$great_project_type_minister_project_train_troops_contribution_natural_disaster_test$"
  tgp_minister_project_train_troops_natural_disaster_test_modifier_desc: "Huyện này sẵn sàng sơ tán, giảm thiệt hại và tái thiết nhanh khi thiên tai nhờ các bài tập bắt buộc từ Bộ Binh."
  tgp_minister_project_conduct_census_modifier: "Khảo Cư Tuân Thủ"
  tgp_minister_project_conduct_census_modifier_desc: "Huyện này đã được [minister_of_revenue|E] tiến hành điều tra dân số."
  tgp_minister_project_conduct_census_purge_treasury_debt_modifier: "Chế Tài Chống Nợ"
  tgp_minister_project_conduct_census_purge_treasury_debt_modifier_desc: "Nhân vật này hưởng lợi từ chương trình phòng chống [treasury_debt|E] của Bộ Tài Chính, ban hành trong [GetGreatProjectType('minister_project_conduct_census').GetName]."
  tgp_minister_project_conduct_census_fertility_effort_modifier: "$great_project_type_minister_project_conduct_census_contribution_fertility_effort$"
  tgp_minister_project_conduct_census_fertility_effort_modifier_desc: "Huyện [holder|E] được hưởng lợi từ chương trình khuyến khích sinh đẻ của Bộ Tài Chính trong [GetGreatProjectType('minister_project_conduct_census').GetName]. Bộ sẽ chi [treasury|E] cho trẻ sinh mới."
  tgp_minister_project_conduct_census_natural_disaster_insurance_modifier: "$great_project_type_minister_project_conduct_census_contribution_natural_disaster_insurance$"
  tgp_minister_project_conduct_census_natural_disaster_insurance_modifier_desc: "Huyện [holder|E] được hưởng bảo hiểm thiên tai từ Bộ Tài Chính trong [GetGreatProjectType('minister_project_conduct_census').GetName]. Bộ sẽ chi [treasury|E] khi thiên tai xảy ra."
  tgp_child_exam_cooldown_modifier: "Trượt Thi Trẻ"
  tgp_child_exam_cooldown_modifier_desc: "Dự kỳ thi Hoàng triều là sự kiện định hình cho kẻ nhìn lên trời, nhưng nhân vật này gặp khó khăn dưới áp lực."
  tgp_local_exam_initial_success: "Khởi Đầu Vững Chắc"
  tgp_local_exam_initial_success_desc: "Khởi đầu thành công để lại ấn tượng lâu dài."
  tgp_local_exam_impressed_examiner: "Kỳ Môn Ấn Tượng"
  tgp_local_exam_strong_finish: "Kết Thúc Vững Chắc"
  tgp_local_exam_strong_finish_desc: "Vào chiều muộn của kỳ thi dài và khó khăn, những học trò sáng giá nổi bật giữa đám đông."
  tgp_child_focused_studies_modifier: "Tập Trung Học Tập"
  tgp_forced_to_retake_exam_modifier: "Chờ Dự Thi Cung"
  tgp_forced_to_retake_exam_modifier_desc: "Nhân vật này đang hồi hộp chờ kỳ [GetActivityType('activity_imperial_examination').GetName], bị gia đình thúc ép phải thi ở trình cao nhất."
 
  tgp_joined_grand_campaign_modifier: "Tham Gia Chiến Dịch Lớn"
  tgp_joined_grand_campaign_modifier_desc: "Nhân vật này tham gia chiến tranh do nhà nước chỉ định. Kỳ vọng lớn đi kèm sự ủng hộ của chính phủ."
  tgp_wiles_is_the_way_modifier: "Khéo Léo Là Con Đường"
  tgp_wiles_is_the_way_modifier_desc: "Tại sao phải đi theo Đường khi Ngài có thể cắt ngang?"
  tgp_honor_is_the_way_modifier: "Danh Dự Là Con Đường"
  tgp_honor_is_the_way_modifier_desc: "Nhân vật này được truyền cảm hứng từ ảnh hưởng dẫn dắt của thầy cô và gia đình."
  tgp_passed_provincial_exam_modifier: "Đậu Kỳ Thi Tỉnh"
  tgp_bypassed_provincial_exam_modifier: "Bỏ Qua Kỳ Thi"
  tgp_bypassed_provincial_exam_modifier_desc: "Nhân vật này hoàn thành thành công kỳ thi cấp cao mà chưa trải qua kỳ thi địa phương."
  tgp_passed_metropolitan_exam_modifier: "Đậu Kỳ Thi Thủ Đô"
  tgp_passed_palace_exam_modifier: "Đậu Kỳ Thi Hoàng Cung"
 
  tea_ceremony_health_benefit: "Một Chén Trà Bổ Dưỡng"
  tea_ceremony_health_benefit_desc: "Nhân vật này uống một chén trà và cảm thấy tốt hơn."
  tea_ceremony_perfect_tea: "Trà Hoàn Hảo"
  tea_ceremony_perfect_tea_desc: "Nhân vật này pha một ấm trà hoàn hảo — ít nhất theo những người tham dự"
  tea_ceremony_peace_of_mind: "Trà An Tâm"
  tea_ceremony_peace_of_mind_desc: "Nhân vật này uống một chén trà tốt cho trí tuệ"
  tea_ceremony_spirit: "Trà Cho Tinh Thần"
  tea_ceremony_spirit_desc: "Nhân vật này uống trà trong khi suy ngẫm về thế giới tâm linh"
  tea_ceremony_family: "Trà Gia Đình"
  tea_ceremony_family_desc: "Nhân vật này tập hợp gia đình quanh một ấm trà"
 
  tgp_aspiration_great_salary_modifier: "Lương Tăng Đáng Kể"
  tgp_aspiration_great_salary_modifier_desc: "Nhân vật này hoàn thành xuất sắc nhiệm vụ và nhận được khoản lương thưởng đáng kể."
  tgp_aspiration_modest_salary_modifier: "Lương Cải Thiện"
  tgp_aspiration_modest_salary_modifier_desc: "Nhân vật này làm tốt nhiệm vụ và nhận được một khoản lương thưởng."
 
  claim_mandate_decision_modifier: "$game_concept_son_of_heaven$"
  minister_scheme_slots_modifier: "Chưởng Bộ"
  minister_scheme_slots_modifier_desc: "Nhân vật này đứng đầu một trong những bộ quan trọng bậc nhất trong triều Thiên Tử. Việc có toàn bộ bộ máy dưới quyền khiến mọi mưu kế tiềm năng đều có tầm ảnh hưởng rộng lớn."

  hegemony_of_china_desc: "$game_concept_de_jure$ [GetTitleByKey('h_china').GetName]: $VALUE|+0=$"
  is_already_administrative: "Đã là $game_concept_administrative_government$: $VALUE|+0=$"

  impugned_my_sovereignty: "Xúc phạm Chủ Quyền Của Ta" # Biến số Tình Cảm
  tgp_known_exam_cheater_modifier: "Kẻ Gian Lận Kỳ Thi"
  tgp_known_exam_cheater_modifier_desc: "Nhân vật này bị bại lộ là kẻ gian lận trong kỳ thi."
