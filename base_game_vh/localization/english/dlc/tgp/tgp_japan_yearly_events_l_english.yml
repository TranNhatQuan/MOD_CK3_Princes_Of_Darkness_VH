l_english: 

 #Wordplay of the word "shiki" in Japanese meaning "spread"
  tgp_japan_yearly_events.0001.t: "Lan Tỏa Niềm Vui"
  tgp_japan_yearly_events.0001.desc: "Dẫu ta rất gần gũi với [ROOT.Char.Custom2('RelationToMe', gift_receiver)] [gift_receiver.GetFirstName], ta không thể không để ý thấy [gift_receiver.GetSheHe] cười ít hơn thường lệ. Ta không muốn tin rằng đó là vì ta!\n\nNhìn những món đồ thú vị ở khu chợ, ta bắt gặp một người bán hàng đang chào mời đủ loại [Glossary( 'uchiwa', 'UCHIWA_GLOSS' )] thanh nhã. Hắn khăng khăng:\n\n\"Hãy gói món này trong [Glossary( 'furoshiki', 'FUROSHIKI_GLOSS' )] của ngài, kẻ nhận được sẽ hiểu tâm ý muốn lan tỏa niềm vui của ngài!\""
  tgp_japan_yearly_events.0001.a: "Đây là cử chỉ hoàn hảo để khích lệ [gift_receiver.GetFirstNameNoTooltip] thân yêu của ta."
  tgp_japan_yearly_events.0001.tt.gift_appreciation: "trân trọng món quà"
  tgp_japan_yearly_events.0001.a_spouse_toast: "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
  tgp_japan_yearly_events.0001.friend_toast: "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
  tgp_japan_yearly_events.0001.lover_toast: "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
  tgp_japan_yearly_events.0001.b: "Không, đây là món quà quá quý giá đối với [gift_receiver.GetHerHim]..."
  tgp_japan_yearly_events.0001.b.flavor: "...nhưng lại là món quà hoàn hảo dành cho ta!"
  tgp_japan_yearly_events.0001.c: "Mấy gã con buôn tham lam này thật phiền nhiễu."
  UCHIWA_GLOSS: "Quạt giấy kiểu Trung Hoa, phổ biến trong giới quý tộc Nhật Bản, thường được trang trí bằng các họa tiết đẹp mắt."
  FUROSHIKI_GLOSS: "Một tấm vải vừa trang trí vừa tiện dụng. Nghĩa đen là 'trải bồn tắm', từ furo nghĩa là 'bồn tắm' và shiki nghĩa là 'trải'. Thuật ngữ này xuất phát từ các quý tộc khi đến nhà tắm, dùng tấm vải trang trí bằng huy hiệu gia tộc để gói đồ dùng của mình."

 #Artifact
  uchiwa: "Uchiwa"
  uchiwa_desc: "Chiếc quạt thủ công này được trang trí bằng các hoa văn tinh xảo, làm từ tre và giấy."

  tgp_japan_yearly_events.0006.t: "Kho Báu Biển Cả"
  tgp_japan_yearly_events.0006.desc: "Khi ta dạo bước dọc theo bờ biển tại [pearl_diver.GetCurrentLocation.GetBaronyNameExplicitly], ta tình cờ bắt gặp một nhóm thợ lặn [Glossary( 'Ama', 'AMA_DIVERS_GLOSS' )] đang kiểm kê chiến lợi phẩm.\n\nNgười đứng đầu che thân [pearl_diver.GetHerselfHimself] và tiến lại gần: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], xin ngài hãy chiêm ngưỡng những sản vật mà biển cả ban tặng!\"\n\nĐống ngọc trai và bào ngư ngon tuyệt đúng là rất ấn tượng."
  tgp_japan_yearly_events.0006.a: "Chia sẻ phần bắt được với người dân địa phương."
  tgp_japan_yearly_events.0006.tt.success: "Thiết lập giao dịch thành công"
  tgp_japan_yearly_events.0006.tt.failure: "[pearl_diver.GetTitledFirstNameNoTooltip] không bị thuyết phục"
  tgp_japan_yearly_events.0006.b: "Một số kho báu ẩn dưới sóng."
  tgp_japan_yearly_events.0006.c: "Ngôi đền hẳn sẽ rất vinh dự khi tiếp nhận những gì [ROOT.Char.GetFaith.WaterGodName] ban tặng."
  tgp_japan_yearly_events.0006.d: "Không có thời gian để mặc cả."
  AMA_DIVERS_GLOSS: "#bold Ama#! — nghĩa là 'phụ nữ biển' — là các thợ lặn nổi tiếng thu lượm ngọc trai và vật quý từ đáy biển. Thường là nữ, họ nổi tiếng với khả năng nín thở lâu."

  tgp_japan_yearly_events.0012.t: "Tinh Nghịch Khỉ"
  tgp_japan_yearly_events.0012.desc: "Trong lúc leo lên [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] tại [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], một làn sương ấm áp bao phủ lấy ta.\n\nThật may mắn thay! Ta phát hiện ra một [Glossary( 'onsen', 'ONSEN_GLOSS' )] đang bốc khói, nhưng xem ra ta không phải là vị khách đầu tiên trong ngày.\n\nMột con khỉ tuyết tinh quái đã vào tắm trước rồi! Dẫu cơ bắp của ta đang mỏi nhừ và thân thể bắt đầu có mùi, ta tự hỏi liệu việc tắm cùng một con vật hoang dã có an toàn?"
  tgp_japan_yearly_events.0012.a: "#EMP Vẫy tay loạn xạ, hét lên."
  tgp_japan_yearly_events.0012.a.monkey.martial.tt.success: "Chú khỉ chạy đi vì sợ"
  tgp_japan_yearly_events.0012.a.monkey.martial.tt.failure: "Chú khỉ phớt lờ nỗ lực đáng thương của Ta"
  tgp_japan_yearly_events.0012.b: "Giả vờ không đe dọa."
  tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.success: "Chú khỉ tỏ vẻ tò mò, nhưng bỏ đi"
  tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.failure: "Chú khỉ lao vào, dọa Ta lùi lại"
  tgp_japan_yearly_events.0012.c: "Đừng đùa với khỉ."

  tgp_japan_yearly_events.0013.t: "Thanh Lọc Tâm Hồn"
  tgp_japan_yearly_events.0013.desc: "Một tiếng tụng kinh khẽ gọi ta đi lên con đường núi. Tiến lại gần nơi phát ra âm thanh, ta được chào đón bởi một lớp sương ấm dày đặc, che khuất bóng dáng của một [mystic.GetWomanMan].\n\n[mystic.GetSheHe] chỉ nhìn về phía ta và ra hiệu cho ta cùng tham gia với [mystic.GetHerHim] trong [Glossary( 'onsen', 'ONSEN_GLOSS' )]. Có vẻ như một nghi lễ sắp được cử hành."
  tgp_japan_yearly_events.0013.a: "Tham gia vào nghi lễ."
  tgp_japan_yearly_mystic_positive.tt: "Ta tìm kiếm bên trong để tìm sự thật"
  tgp_japan_yearly_mystic_neutral.tt: "Ta cố hiểu ý nghĩa đằng sau lời nói"
  tgp_japan_yearly_mystic_negative.tt: "Ta không hiểu điều được yêu cầu"
  tgp_japan_yearly_events.0013.b: "Hỏi người thần bí chỉ dẫn."
  tgp_japan_yearly_events.0013.b.mystic.learning.tt.success: "Ta hiểu ý nghĩa đằng sau trí tuệ ấy"
  tgp_japan_yearly_events.0013.b.mystic.learning.tt.failure: "Ta không biết họ nói gì"
  tgp_japan_yearly_events.0013.c: "Hãy để [mystic.GetHerHim] được yên tĩnh."

  tgp_japan_yearly_events.0014.t: "Thư Thái Nhẹ Nhàng"
  tgp_japan_yearly_events.0014.desc: "Thở hổn hển, lòng nặng trĩu, Ta dùng sức lực cuối cùng ngẩng đầu, nhìn về đỉnh núi trong khi nheo mắt để tránh gió lạnh.\n\nNgạc nhiên thay, Ta thấy một làn hơi mờ nhạt phía xa, tan biến sau khi lên tới độ cao nhất định, rồi lại lặp lại — như mời Ta đến gần.\n\nKhi tới đỉnh, Ta cuối cùng có thể nghỉ ngơi và thưởng thức [Glossary( 'onsen', 'ONSEN_GLOSS' )] mời gọi trước mặt."
  tgp_japan_yearly_events.0014.a: "Vào suối nước nóng."
  tgp_japan_yearly_events.0014.b: "Ở lại thêm một lúc."
  tgp_japan_yearly_events.0014.c: "Không còn thời gian."

  ONSEN_GLOSS: "#bold Onsen#! — Suối nước nóng Nhật Bản — nguồn nước tự nhiên nổi tiếng với khả năng trị liệu."

  tgp_japan_yearly_events.0021.t: "Giữa Hoa Anh Đào"
  tgp_japan_yearly_events.0021.desc: "[Glossary( 'Hanami', 'HANAMI_GLOSS' )] đã đến! Những cây anh đào trĩu nặng những đóa hoa lộng lẫy khiến lòng người hân hoan. Dân chúng tại [ROOT.Char.GetCurrentLocation.GetName] dự đoán thời điểm gieo mạ và cầu nguyện cho một mùa màng bội thu.\n\n[hanami_enjoyer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', hanami_enjoyer)] của ta, tuyên bố: \"Đời người tựa như vẻ đẹp thoáng qua của một đóa hoa.\" Lời nói của [hanami_enjoyer.GetHerHis|U] nhắc nhở ta rằng đã đến lúc dâng lễ vật."
  tgp_japan_yearly_events.0021.a: "Ta dâng một ít rượu sake."
  tgp_japan_yearly_events.0021.a_pleased_deities.tt: "Các vị thần #EMP dường như#! đã thấy hành động của Ta"
  tgp_japan_yearly_events.0021.a_char_modifier.tt: "Ta cảm thấy nhẹ nhõm"
  tgp_japan_yearly_events.0021.a_county_modifier.tt: "Người dân chứng kiến hành động của Ta"
  tgp_japan_yearly_events.0021.a_nothing_happens.tt: "Hành động của Ta rơi vào vô vọng"
  tgp_japan_yearly_events.0021.b: "Dành chút thời gian ngắm cây cối."
  HANAMI_GLOSS: "#bold Hanami#! — truyền thống ngắm hoa của người Nhật, thường là hoa anh đào."

  tgp_japan_yearly_events.0026.t: "Truyện Tengu"
  tgp_japan_yearly_events.0026.desc: "Giọng nói quen thuộc của [rumormonger.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', rumormonger)] của ta, vang lên từ một tửu quán, theo sau là những tiếng cười sảng khoái đẫm mùi rượu sake của [gossiper.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', gossiper)] của ta.\n\n\"Trên khắp những vùng đất hoang dã bất khuất của chúng ta, loài [Glossary( 'Tengu', 'TENGU_GLOSS' )] đang lẩn khuất! Một con quái vật bao phủ trong lông vũ, có tính khí hung dữ như tài kiếm thuật của chúng vậy. Linh hồn độc ác này lên án tất cả những gì thánh thiện!\"\n\nNhấp thêm một ngụm rượu sake [rumormonger.GetHerHis], \"Mặc dù cũng phải nói rằng, kẻ nào chứng tỏ được mình xứng đáng trong mắt con quái thú này sẽ được ban thưởng sự thông thạo về mưu lược võ đạo. Nhưng, nhìn quanh biển người hèn nhát này, ta chắc rằng đó là một hy vọng mong manh!\""
  tgp_japan_yearly_events.0026.a: "Ta tự hỏi điều đó có thật không."
  tgp_japan_yearly_events.0026.a.tt: "Trong lần đi tiếp theo qua núi hay rừng, Ta có thể gặp sinh vật bí ẩn này."
  tgp_japan_yearly_events.0026.b: "Chỉ là huyền thoại…"
  TENGU_GLOSS: "#bold Tengu#! — nghĩa là \"Thiên Cẩu\" — là một dạng [Glossary( 'Yokai', 'YOKAI_GLOSS' )], thường được mô tả là sinh vật giống chim. Chúng là những linh hồn bảo hộ nhưng cũng đầy nguy hiểm cư ngụ nơi núi cao rừng thẳm. Phiên bản phổ biến nhất của Tengu trong thời hiện đại thường được biết đến với khuôn mặt đỏ cùng chiếc mũi dài."

  tgp_japan_yearly_events.0027.t: "Chứng Minh Giá Trị"
  tgp_japan_yearly_events.0027.desc: "Khi ta trekking qua vùng hoang dã của [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], ta không thể rũ bỏ những lời đồn thổi mà ta đã nghe về loài [Glossary( 'Tengu', 'TENGU_GLOSS' )].\n\nKhông một bóng người, tất cả những gì ta nghe thấy là tiếng tim mình đập thình thịch. Khi ta cố gắng điều hòa hơi thở hoảng loạn, một nỗi sợ hãi len lỏi bò dọc sống lưng ta... Ta đang bị theo dõi.\n\nÁnh mắt ta hướng về phía âm thanh của những bước chân. Cố gắng tìm kiếm xung quanh một cách tuyệt vọng, ta nhìn thấy hình ảnh phản chiếu của một lưỡi kiếm lóe lên qua làn sương mù dày đặc."
  tgp_japan_yearly_events.0027.a: "Ta phải chiến đấu."
  tgp_japan_yearly_events.0027.a.tt.success: "Ta sống để chiến đấu ngày khác"
  tgp_japan_yearly_events.0027.a.tt.success_explanation: "Ngài có thể nhận thêm #P trait tích cực#! [traits|E]."
  tgp_japan_yearly_events.0027.a.tt.failure: "Ta thua trận, nhưng không tệ hại"
  tgp_japan_yearly_events.0027.b: "Nghe Ta nói!"
  tgp_japan_yearly_events.0027.b.tt.success: "[tengu_warrior.GetSheHe] dường như đã bị thuyết phục bởi lời nói của ta"
  tgp_japan_yearly_events.0027.b.tt.failure: "[tengu_warrior.GetSheHe] chẳng bận tâm đến những gì ta nói"
  tgp_japan_yearly_events.0027.c: "Trốn khi còn có thể."

  tgp_japan_yearly_events.0028.t: "Tin Đồn Sai"
  tgp_japan_yearly_events.0028.desc: "Khi dạo bước trong [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] tại [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], ta không khỏi dán mắt tìm kiếm loài [Glossary( 'Tengu', 'TENGU_GLOSS' )].\n\nChưa bao giờ ta có một chuyến dạo chơi tẻ nhạt đến thế qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]. Lẽ ra ta không nên tin vào những lời ba hoa của một gã say rượu."
  tgp_japan_yearly_events.0028.a: "Ta sẽ không bị lừa lần nữa."
  tgp_japan_yearly_events.0028.b: "Hét lên."

  tgp_japan_yearly_events.0029.t: "Tập Luyện Thành Thạo"
  tgp_japan_yearly_events.0029.desc: "Dẫu [tengu_warrior.GetTitledFirstName] có thể không phải là một [Glossary( 'Tengu', 'TENGU_GLOSS' )], [tengu_warrior.GetSheHe] quả là bậc thầy kiếm thuật!\n\nBiết bao giờ phút khổ luyện dưới ánh mắt nghiêm khắc của [tengu_warrior.GetHerHis] cuối cùng cũng đã đơm hoa kết trái.\n\nThanh kiếm trong tay ta giờ đây không còn giống như chiếc rìu tiều phu đốn củi, mà đã trở thành phần cơ thể nối dài của ta, sẵn sàng vươn tới trừng trị những kẻ làm điều bất nghĩa với ta.\n\nSư phụ nhắc nhở ta: \"Đây mới chỉ là khởi đầu, con vẫn còn nhiều điều phải học hỏi.\""
  tgp_japan_yearly_events.0029.a: "Cần kỹ năng lãnh đạo."
  tgp_japan_yearly_events.0029.b: "Cần chút tinh tế hơn."

  tgp_japan_yearly_events.0036.t: "Ngón Tay Xanh"
  tgp_japan_yearly_events.0036.desc: "[gardener.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', gardener)] của ta, đang hoàn thiện những nét cuối cùng cho phần mở rộng của hồ nước trong vườn.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], khu vườn của ngài chính là hình ảnh phản chiếu hoàn hảo của chốn bồng lai tiên cảnh [ROOT.Char.GetFaith.GetName]! Ngài có muốn ta bổ sung thêm nét hoàn thiện nào nữa không?\""
  tgp_japan_yearly_events.0036.a: "Ta nên giúp tay."
  tgp_japan_yearly_events.0036.a.random_chance: "Kỹ năng [prowess|E] cao, cơ hội thành công tốt hơn:"
  tgp_japan_yearly_events.0036.b: "Chỉ... hít thở thôi."
  tgp_japan_yearly_events.0036.b.flavor: "Nhiều chuyện chính trường có thể được giải quyết khi một nhân vật chuyên tâm vào việc câu cá."

  ONIBI_GLOSS: "#bold Onibi#! hay 'lửa quỷ' là dạng [Glossary( 'Yokai', 'YOKAI_GLOSS' )] hiện ra dưới dạng quả cầu sáng hoặc lửa, sinh ra từ linh hồn người chết. Thường ác, dẫn lối lạc vào nguy hiểm."
  YOKAI_GLOSS: "#bold Yōkai#! hay 'hiện tượng kỳ lạ' là sinh vật siêu nhiên trong thần thoại Nhật Bản, từ ma, quỷ, quái vật, biến hình đến tinh nghịch. Thường có đặc điểm giống động vật."
  SORIBASHI_GLOSS: "#bold Soribashi#! hay 'Cầu Mặt Trăng' từ Trung Quốc, là cầu đi bộ cong vòm cao. Dùng trang trí vườn hoặc cho người qua lại, thuyền dưới cầu."

  tgp_japan_yearly_events.1000.t: "Ngọn Lửa Nhảy Múa"
  tgp_japan_yearly_events.1000.desc: "Những cơn mưa phùn nhẹ đi cùng ta khi ta băng qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nKhi mưa dần nặng hạt, ta nhận thấy những đốm sáng nhảy múa, chập chờn nơi đằng xa.\n\n[chaplain.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', chaplain)] của ta, khuyên ta nên cẩn trọng, ngài cho rằng đó có thể là [Glossary( 'Onibi', 'ONIBI_GLOSS' )] đang chờ đợi để dẫn dụ chúng ta vào chốn hiểm nguy."
  tgp_japan_yearly_events.1000.a: "Nguy hiểm gì chứ, hãy xem những ánh sáng đó là gì!"
  tgp_japan_yearly_events.1000.a.tt.success: "Theo đuổi Onibi, Ngài tìm thấy kho báu ẩn giấu"
  tgp_japan_yearly_events.1000.a.tt.failure: "Theo đuổi Onibi, Ngài trượt trên địa hình ướt, bị thương"
  tgp_japan_yearly_events.1000.b: "Hãy tránh mưa và Ngài có thể kể cho Ta nghe thêm"
  tgp_japan_yearly_events.1000.b.tt.success: "[chaplain.GetFirstNameNoTooltip] đưa ra những hiểu biết về Onibi giúp Ngài hiểu các nghiên cứu khác Ngài đã làm"
  tgp_japan_yearly_events.1000.b.tt.failure: "Những mâu thuẫn trong lời giải thích của [chaplain.GetFirstNamePossessiveNoTooltip] khiến Ngài đau đầu"
  tgp_japan_yearly_events.1000.c: "Vâng, tốt nhất không nên nán lại."

  tgp_japan_yearly_events.1010.t: "Xung Đột Giáo Phái"
  tgp_japan_yearly_events.1010.desc: "\"Căng thẳng giữa [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')] [buddhist_councillor_1.GetFaith.GetAdherentNamePlural] và [buddhist_councillor_2.Custom('DescriptorNegativeStandalone')] [buddhist_councillor_2.GetFaith.GetAdherentNamePlural] ngày càng gia tăng, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\n[ROOT.Char.Custom2('RelationToMeShort', buddhist_councillor_1)], [buddhist_councillor_1.GetFirstName] thốt lên.\n\n\"Các nhà sư [buddhist_councillor_2.Custom('DescriptorNegativeStandalone')] [buddhist_councillor_2.GetFaith.GetAdherentNameNoTooltip] đang cầu nguyện cho sự sụp đổ của chúng ta. Xin, vì [ROOT.Char.GetFaith.HighGodName], hãy cho thấy Ngài đứng về phía [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')] [buddhist_councillor_1.GetFaith.GetAdherentNamePluralNoTooltip] và rõ ràng chúng ta sẽ được ưu ái!\""
  tgp_japan_yearly_events.1010.a: "Ta sẽ đứng về phía các nhà sư [buddhist_councillor_1.GetFaith.GetAdjectiveNoTooltip]."
  tgp_japan_yearly_events.1010.b: "Các [buddhist_councillor_2.GetFaith.GetAdherentNamePluralNoTooltip] mới đúng."
  tgp_japan_yearly_events.1010.c: "Tại sao Ta phải quan tâm cách [ROOT.Char.GetFaith.HighGodName] được tôn thờ?"
  faith_conversion_cost_tgp_japan_1010_event: "Từ Sự Kiện"
  tgp_japan_yearly_events.1010.a_discount: "Ngài nhận #p giảm 50%#! khi chuyển sang [buddhist_councillor_1.GetFaith.GetName]"
  tgp_japan_yearly_events.1010.b_discount: "Ngài nhận #p giảm 50%#! khi chuyển sang [buddhist_councillor_2.GetFaith.GetName]"
  every_buddhist_sect_1_vassal: "Mọi [buddhist_councillor_1.GetFaith.GetName] [vassal|E]"
  every_buddhist_sect_2_vassal: "Mọi [buddhist_councillor_2.GetFaith.GetName] [vassal|E]"
  tgp_japan_yearly_events.1010.c.tt: "Cuộc chiến gây bất ổn toàn quốc"

  tgp_japan_yearly_events.1020.t_siren: "Giai Điệu Của Oni"
  tgp_japan_yearly_events.1020.t_garden: "Đỉnh Hoa Nở"
  tgp_japan_yearly_events.1020.t_shadow: "Sâu Trong Bóng Tối Của Ta"
  tgp_japan_yearly_events.1020.desc_siren: "Một giai điệu ma mị gọi Ta khỏi giấc ngủ. Một người phụ nữ, nhợt nhạt và tao nhã, lơ lửng trên Ta, hát về nỗi đau tình yêu.\n\nKhi vươn tay, hình ảnh của cô tan biến. Khi tỉnh lại, nỗi đau của người phụ nữ trong mơ và tình yêu chưa trọn vẫn ám ảnh Ta."
  tgp_japan_yearly_events.1020.a_siren: "Tình yêu cô hát về, Ta phải có nó!"
  tgp_japan_yearly_events.1020.b_siren: "Vẻ đẹp này nên được chia sẻ, lan truyền lời cô ấy khắp lãnh thổ."
  tgp_japan_yearly_events.1020.desc_garden: "Khi đi trong vườn, Ta nhận thấy một bông hoa kỳ lạ.\n\nHít mùi hương, một làn gió như thì thầm bao quanh Ta, nhìn lên thì ánh nắng chói mắt. Khi quay lại nhìn bông hoa, một khuôn mặt quái dị đang cau mày nhìn Ta. Nháy mắt lần nữa, khuôn mặt biến mất."
  tgp_japan_yearly_events.1020.a_garden: "Đất này hẳn có gì đặc biệt, tiếp tục trồng trọt."
  tgp_japan_yearly_events.1020.b_garden: "Ta phải xây trên vườn này để phong ấn nó đi."
  tgp_japan_yearly_events.1020.desc_shadow: "Bóng Ta trở nên... kỳ lạ. Nó dường như lưu lại một lúc sau khi Ta bắt đầu đi. Khi Ta nhìn đi, bóng như nhảy múa với các bóng khác, nhưng khi quay lại nó trở về bên cạnh Ta.\n\nDù chưa gây hại, một cái bóng có thể rời khỏi chủ nhân hẳn nguy hiểm."
  tgp_japan_yearly_events.1020.a_shadow: "Chỉ kẻ thù mới phải sợ bóng Ta!"
  tgp_japan_yearly_events.1020.b_shadow: "Ta phải giữ đuốc luôn cháy, không để gì lọt qua."
  tgp_japan_yearly_events.1020.desc_end: "\n\nĐây là áp lực của việc làm [ROOT.Char.GetTitleAsNameNoTooltip], hay là công việc của một [Glossary( 'Yokai', 'YOKAI_GLOSS' )]?"
  tgp_japan_yearly_events.1020.c: "Chà! Chắc là [ROOT.Char.GetFaith.TricksterGodName] đang chơi khăm Ta."

  tgp_japan_yearly_events.1030.t: "Suy Ngẫm Cho Tương Lai"
  tgp_japan_yearly_events.1030.desc: "Ta bị thu hút đến [ROOT.Char.GetFaith.HouseOfWorship] gần đó bởi những tràng vỗ tay yếu ớt của tín đồ cầu xin [ROOT.Char.GetFaith.HighGodName] ban phước.\n\nĐã lâu Ta chưa có cơ hội cầu nguyện và suy ngẫm. Ta nên tập trung vào điều gì trong những năm tới?"
  tgp_japan_yearly_events.1030.a: "Sức khỏe của Ta, trên hết."
  tgp_japan_yearly_events.1030.b: "Tương lai của Gia tộc [ROOT.Char.GetDynasty.GetNameNoTooltip] phải được bảo đảm."
  tgp_japan_yearly_events.1030.c: "Sự thịnh vượng cho gia đình là điều quan trọng nhất."
  tgp_japan_yearly_events.1030.d: "Tất cả Ta cần là sự ưu ái từ [ROOT.Char.GetFaith.HighGodName]!"
  tgp_japan_yearly_events.1030.e: "Ta sẽ không để cầu nguyện làm phiền sự yên tĩnh của mình."

  tgp_japan_yearly_events.1040.t: "Cầu Trăng"
  tgp_japan_yearly_events.1040.desc: "Khi tìm cách qua một con kênh, Ta thấy một cây cầu cong đẹp được trang trí màu đỏ thẫm. Ta dừng lại, trầm trồ trước vẻ tao nhã của [Glossary( 'Soribashi', 'SORIBASHI_GLOSS' )]\n\nĐôi khi một hành động nhỏ như băng qua một dòng suối cũng có thể mang ý nghĩa."
  tgp_japan_yearly_events.1040.a: "Đây là cây cầu linh thiêng, chúng Ta sẽ qua cẩn thận."
  tgp_japan_yearly_events.1040.b: "Với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip], không ai được đi trước Ta."
  tgp_japan_yearly_events.1040.c: "Ta không dám đi trên cái này, nếu nó sập thì sao?"
  faith_conversion_cost_tgp_japan_1040_event: "Từ Việc Băng Qua Cầu Đỏ"
  tgp_japan_yearly_events.1040.discount: "Ngài nhận #p giảm 50%#! khi chuyển sang [GetReligionByKey('shintoism_religion').GetName]"

  tgp_japan_yearly_events.1050.opening: "[messenger.Custom2('AppropriateGreeting', ROOT.Char)]"
  tgp_japan_yearly_events.1050.desc: "Ta rất tiếc phải thông báo rằng Ngài đang vi phạm một quy tắc quan trọng:"
  tgp_japan_yearly_events.1050.desc.a: "#EMP Vườn của Ngài có quá nhiều hoa màu vàng.#!"
  tgp_japan_yearly_events.1050.desc.b: "#EMP Vũ khí trong doanh trại của Ngài quá ít khi được mài bén.#!"
  tgp_japan_yearly_events.1050.desc.c: "#EMP Ngài vẫn cầm [Glossary( 'Sensu', 'SENSU_GLOSS' )] không đúng cách.#!"
  tgp_japan_yearly_events.1050.desc.outro: "\n\nVì vi phạm này, Ngài được lệnh quyên góp một khoản đáng kể vào kho bạc của [ROOT.Char.Custom2('RelationToMeShort', ROOT.Char.GetLiege)], [ROOT.Char.GetLiege.GetTitledFirstNamePossessive]."
  tgp_japan_yearly_events.1050.a: "Theo ý [ROOT.Char.GetLiege.GetSheHe]."
  tgp_japan_yearly_events.1050.b: "Quy định đó không còn hiệu lực."
  tgp_japan_yearly_events.1050.b.tt: "Ngài cố thuyết phục [messenger.GetFirstNameNoTooltip] rằng quy định mơ hồ này không còn hiệu lực"
  tgp_japan_yearly_events.1050.c: "[ROOT.Char.GetLiege.GetSheHe|U] sẽ không để [ROOT.Char.GetLiege.GetHerHis] phải chịu thiệt thòi!"
  tgp_japan_yearly_events.1050.tt.success: "Mức phạt được hủy"
  tgp_japan_yearly_events.1050.tt.failure: "[messenger.GetSheHe|U] ra lệnh Ngài phải nộp"

  tgp_japan_yearly_events.1060.t: "Bằng Lòng Thương Xót hay Công Lý"
  tgp_japan_yearly_events.1060.desc: "Với vẻ ngoài nhếch nhác và bất mãn, [prisoner.Custom2('InsultAdjective', ROOT.Char)] [prisoner.GetFirstName] cứ quấy rầy lính canh, khẩn cầu họ lắng nghe lời van xin của [prisoner.GetHerHis]. Hiếu kỳ, ta đến gặp [prisoner.GetHerHim] trong [prisoner.Custom('PrisonTypeCell')] của ngài, chờ đợi xem [prisoner.GetSheHe] có điều gì mà phải tuyệt vọng đến thế.\n\n[prisoner.GetSheHe|U] nhìn ta rồi gào lên:"
  tgp_japan_yearly_events.1060.desc_old: "\"Xương Ta giòn và cứng, thời gian Ta sống đã quá nhiều."
  tgp_japan_yearly_events.1060.desc_young: "\"Ta chưa thấy nhiều trong đời, nhưng Ta không thể hài lòng với ký ức về nhà tù này."
  tgp_japan_yearly_events.1060.desc_long: "\"Ta đã bị giam quá lâu, và Ta quyết định không muốn quay lại."
  tgp_japan_yearly_events.1060.desc_injured: "\"Sức khỏe Ta suy yếu, các vảy thương không còn lành. Cơn đau càng dữ dội không có hồi kết."
  tgp_japan_yearly_events.1060.desc_generic: "\"Ta không muốn sống trong ô cửa giam này nữa."
  tgp_japan_yearly_events.1060.desc_outro: "Nếu Ngài có lòng thương xót, hãy kết thúc mạng sống Ta nhanh chóng!\""
  tgp_japan_yearly_events.1060.a: "Rất tốt, Ta sẽ ban nguyện vọng cho Ngài."
  tgp_japan_yearly_events.1060.b: "Có lẽ Ta có thể cải thiện điều kiện giam giữ cho Ngài."
  tgp_japan_yearly_events.1060.c: "Đau khổ của Ngài sẽ không được xoa dịu!"
  tgp_japan_yearly_events.1060.d: "Không, điều kiện của Ngài sẽ không thay đổi."

  tgp_japan_yearly_events.1070.t: "Tro Linh Thiêng"
  tgp_japan_yearly_events.1070.desc: "\"Một tòa nhà trên [province.GetName] [ROOT.Char.Custom('GetFaithTemple')] đã cháy rụi!\" [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetName] khóc.\n\n\"Các nhà sư và học giả vội tìm nơi mới cho công việc của họ\" [messenger.GetNameNoTooltip] tiếp tục, \"Nếu Ngài giúp phục hồi [ROOT.Char.Custom('GetFaithTemple')], chắc chắn [ROOT.Char.GetFaith.HighGodName] sẽ ban phước.\""
  tgp_japan_yearly_events.1070.a: "Hãy xây dựng lại tốt hơn trước."
  tgp_japan_yearly_events.1070.b: "Có lẽ [ROOT.Char.GetFaith.HighGodName] đang dọn chỗ cho điều gì đó mới."
  tgp_japan_yearly_events.1070.c: "Ta phải xem cách [ROOT.Char.Custom('GetFaithTemple')] bị cháy..."
  tgp_japan_yearly_events.1070.c_tt: "Ngài bắt đầu điều tra nguyên nhân vụ cháy"

  tgp_japan_yearly_events.1071.desc: "[ROOT.Char.Custom2('RelationToMeShort', messenger)|U] mang tin về vụ [ROOT.Char.Custom('GetFaithTemple')] vừa bị thiêu rụi, đảm bảo với Ta rằng nỗ lực điều tra của [messenger.GetHerHis] đã thành công.\n\n"
  tgp_japan_yearly_events.1071.desc_yokai: "\"Nhiều người trong vùng đã báo cáo thấy một [Glossary( 'Yokai', 'YOKAI_GLOSS' )] lạ lùng vài ngày trước vụ hỏa hoạn. Có lẽ đó chính là kẻ phải chịu trách nhiệm cho bi kịch này?\" [messenger.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', messenger)] của ta, thốt lên."
  tgp_japan_yearly_events.1071.desc_heretics: ""Người dân địa phương cho rằng một nhóm dị giáo đã gây ra vụ này. Chúng ta phải gửi thông điệp đến những kẻ dị giáo đó!" [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName] nhấn mạnh."
  tgp_japan_yearly_events.1071.desc_rival: ""[rival.GetName] dường như đã theo dõi thị trấn trước sự việc, tìm cách gây rối dưới quyền của ngài. [rival.GetSheHe|U] không thể thoát tội!" [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName] nhấn mạnh."
  tgp_japan_yearly_events.1071.desc_weather: ""Vụ cháy là do hiện tượng tự nhiên. Không khí khô, nắng chói chang, nên việc cháy là điều dễ hiểu. Tốt nhất chúng ta nên củng cố nơi trú ẩn trước thời tiết." [messenger.GetFirstName] nhận xét."
  tgp_japan_yearly_events.1071.a: "Sẽ không để chuyện này xảy ra lần nữa!"
  tgp_japan_yearly_events.1071.b: "À, thôi chuyện cũ rồi…"
  1071_rival_tt: "Trong #V 2#! năm, bất kỳ [scheme|E] thù địch nào Ngài bắt đầu chống lại [rival.GetNameNoTooltip] sẽ có [success_chance|E] cao hơn"
  scheme.target.japan_1071.value_desc: "Trả thù [target.GetFirstName]: $VALUE|+=0$"

  SENSU_GLOSS: "Một #bold Sensu#! là quạt tay gấp, thường dùng vào mùa hè."
  TSURIDONO_GLOSS: "#bold Tsuridono#! — nghĩa là 'gian câu cá', là kiến trúc xây trên ao, dùng để ngắm vườn và tổ chức các trò giải trí nhỏ."
  tgp_japan_yearly_events.1080.t: "Ngư Dân Lạc Đường"
  tgp_japan_yearly_events.1080.desc: "Chòi câu [Glossary( 'Tsuridono', 'TSURIDONO_GLOSS' )] trong vườn là nơi ta nghỉ ngơi và suy ngẫm, phong cảnh thanh tịnh nơi đây là kết thúc hoàn hảo cho một buổi dạo chơi đêm. Làn nước bao quanh chòi thường tĩnh lặng, chỉ bị phá vỡ bởi mấy con cá chép thỉnh thoảng đớp mồi trên mặt nước. Thế nhưng, hôm nay bầu không khí yên bình ấy lại bị phá tan bởi những tiếng nước bắn tung tóe dữ dội!\n\n[fisherman.GetName], [ROOT.Char.Custom2('RelationToMeShort', fisherman)] của ta, đang đứng bên mép nước, thả cần câu vào hồ nước vốn dĩ tĩnh lặng. [fisherman.GetSheHe] dám tìm kiếm bữa ăn tiếp theo của ngài ngay trong hồ nước của ta sao?!"
  tgp_japan_yearly_events.1080.a: "Ta khoan dung bỏ qua hành vi này."
  tgp_japan_yearly_events.1080.b: "Còn gì nữa mà [fisherman.GetSheHe] thấy trong vườn Ta?"
  tgp_japan_yearly_events.1080.b.tt: "Ngài thẩm vấn [fisherman.GetNameNoTooltip] để lấy thông tin về triều đình"
  tgp_japan_yearly_events.1080.tt.success: "[fisherman.GetSheHe|U] cung cấp thông tin quý giá"
  tgp_japan_yearly_events.1080.tt.failure: "[fisherman.GetSheHe|U] không nói gì nhiều"
  tgp_japan_yearly_events.1080.tt_secret: "[fisherman.GetSheHe|U] tiết lộ một [secret|E] ngẫu nhiên từ một trong các [courtiers|E] của Ngài"
  tgp_japan_yearly_events.1080.tt_family: "Mỗi [courtier|E] là thành viên gia đình:\n$BULLET$Nhận [GetModifier('tgp_scheme_wary_modifier').GetNameWithTooltip] trong #V 3 năm#!"
  tgp_japan_yearly_events.1080.c: "Liệu [fisherman.GetSheHe] không thể làm việc này ở nơi khác sao?!"

  tgp_japan_yearly_events.1090.t: "Di Sản Vô Tử"
  tgp_japan_yearly_events.1090.desc_intro_dead: "Ta đã sống lâu hơn tất cả con cháu, và mọi hậu duệ đều yên nghỉ dưới đất."
  tgp_japan_yearly_events.1090.desc_intro_none: "Dù sống lâu, Ta vẫn chưa mang được một đứa con nào ra đời."
  tgp_japan_yearly_events.1090.desc_intro: ""[ROOT.Char.Custom('FormOfAddressForLiege')], ngài sẽ không mãi ở đây để cai trị," [informer.GetTitledFirstName] khóc. "Thật đáng tiếc nếu di sản của ngài bị lãng quên! Phải có ai đó tiếp quản [target_title.GetName] thay ngài."\n\n"
  tgp_japan_yearly_events.1090.desc: "Tuổi Ta [ROOT.Char.GetAge] trôi qua như đời ngắn ngủi của một con chuồn chuồn. Tóc Ta bạc, xương Ta kêu răng rắc. Những đứa trẻ Ta thấy bú mẹ, giờ đã trưởng thành và tìm được mục đích. Trước khi kết thúc, có lẽ Ta nên đáp ứng lời cầu khẩn của [informer.GetNamePossessiveNoTooltip]?"
  tgp_japan_yearly_events.1090.a: "Ta sẽ nỗ lực gấp đôi."
  tgp_japan_yearly_events.1090.a_tt: "Ngài nhận được một [concubine|E] mới"
  tgp_japan_yearly_events.1090.b: "Người thừa kế sẽ do Ta chọn!"
  tgp_japan_yearly_events.1090.b_tt: "Cho đến khi chết Ngài có quyền truy cập #V $adopt_interaction$#! [interaction|E]"
  tgp_japan_yearly_events.1090.c_uncaring: "Tại sao Ta phải quan tâm chuyện gì xảy ra khi Ta đi?"
  tgp_japan_yearly_events.1090.c: "Ta sẽ cai trị hết sức mình."
  tgp_japan_yearly_events.1100.t: "Sốt Ăn Năn"
  tgp_japan_yearly_events.1100.desc: "Ta càng trở nên bối rối sau cái chết của [victim.GetName], nhưng không liệu pháp nào đem lại sự an tâm. Trong mọi gương, Ta thấy khuôn mặt [victim.GetHerHis], như bóng ma phía sau. Những khoảnh khắc cuối cùng của [victim.GetHerHis|U] cứ lặp đi lặp lại, mỗi lần càng kinh khủng hơn."
  tgp_japan_yearly_events.1100.desc_2: "\n\nCùng với đó, giọng nói của [victim_2.GetNamePossessive] thì thầm trong đêm, đánh thức Ta khỏi giấc ngủ sâu. [victim_2.GetSheHe|U] có thể yên nghỉ, điều mà Ta gần đây không thể."
  tgp_japan_yearly_events.1100.desc_3: "Nhắc đến tên [victim_3.GetName] khiến Ta rùng mình, tra tấn như những người khác đã chết theo lệnh Ta."
  tgp_japan_yearly_events.1100.desc_outro: "\n\nTa đang ở trong một ngục tù tự tạo. Việc cướp đi mạng sống đã lấy mất bình yên của Ta."
  tgp_japan_yearly_events.1100.a_tt: "Ngài phơi bày tất cả [secrets|E] về vụ Giết Người"
  tgp_japan_yearly_events.1100.a: "Đây là dấu hiệu, Ta phải chuộc lỗi!"
  tgp_japan_yearly_events.1100.b: "Những lỗi lầm của Ta sẽ mãi chôn trong Ta."
  tgp_japan_yearly_events.1100.b_tt: "#warning Không thể bắt đầu [scheme|E] Giết Người trong #V 5#! năm #!"
  guilt_fever_tt: "Ngài mắc phải Sốt Ăn Năn"

  tgp_japan_yearly_events.1110.t: "Hươu của [ROOT.Char.GetFaith.FateGodNamePossessive|U]"
  tgp_japan_yearly_events.1110.desc: "Đền thờ [ROOT.Char.GetFaith.FateGodName|U] đón nhiều khách từ mọi tầng lớp. Hôm nay cũng không ngoại lệ, với một con hươu tuyệt đẹp thưởng thức sự thanh bình.\n\nTuy nhiên, con vật này dường như chú ý tới Ta, nhìn chằm chằm mà không chớp mắt. Một số người nói rằng động vật là trung gian, và có lẽ con hươu này chính là [ROOT.Char.GetFaith.FateGodName|U] gửi thông điệp."
  tgp_japan_yearly_events.1110.a: "[ROOT.Char.GetFaith.FateGodSheHe|U] muốn thấy Ta phản chiếu."
  tgp_japan_yearly_events.1110.b: "Dấu hiệu may mắn sắp đến!"
  tgp_japan_yearly_events.1110.b.tt: "Con hươu dẫn Ngài đến kho báu"
  tgp_japan_yearly_events.1110.c: "Nó sẽ tuyệt trong các đại sảnh của Ta."
  tgp_japan_yearly_events.1110.c.tt: "Ngài cố gắng đánh hươu ngay tại chỗ đứng"
  tgp_japan_yearly_events.1110.tt.success: "Con hươu ngã trước sức mạnh của Ngài"
  tgp_japan_yearly_events.1110.tt.failure: "Con hươu chạy mất"
  tgp_reflection_modifier_desc_tt: "[GetModifier('tgp_reflection_modifier').GetNameWithTooltip]"

  tgp_japan_yearly_events.1120.t: "Thử Thách Cuối Cùng"
  tgp_japan_yearly_events.1120.desc_intro: "Một nhân vật đơn độc, rút [warrior_monk.Custom('GetRegionalSword')], chặn đường chúng Ta."
  tgp_japan_yearly_events.1120.desc_intro_river: "Khi chúng Ta định băng qua cầu, một nhân vật đơn độc với [warrior_monk.Custom('GetRegionalSword')], chặn đường."
  tgp_japan_yearly_events.1120.desc: "\n\n'Chỉ những chiến binh thực thụ mới được đi trên con đường này. Ta đã dâng cả đời cho giáo lý [warrior_monk.GetFaith.WarGodName|U], và vẫn chưa tìm thấy kẻ thách đấu xứng với thanh kiếm của Ta.'\n\nNhìn thấy Ta là [ROOT.Char.GetTitleAsName], [warrior_monk.GetSheHe] nheo mắt và mỉm cười, 'Đánh bại ta trong chiến đấu, ta sẽ theo ngươi đến khi đầu ta rời khỏi thân hoặc sâu ăn hết.'"
  tgp_japan_yearly_events.1120.a: "Ta chấp nhận thử thách của ngươi!"
  tgp_japan_yearly_events.1120.a_warrior: "Đánh bại ngươi sẽ là vinh dự của Ta. Hãy chuẩn bị!"
  tgp_japan_yearly_events.1120.b: "Triều đình là chiến trường của Ta. Trí tuệ và kiếm của Ta."
  tgp_japan_yearly_events.1120.b.tt: "Ngài cố gắng thuyết phục Tăng binh theo Ngài mà không cần chiến đấu"
  tgp_japan_yearly_events.1120.tt.success: "Tăng binh gia nhập đội ngũ của Ngài"
  tgp_japan_yearly_events.1120.tt.failure: "Ngài không thuyết phục được nhà sư"
  tgp_japan_yearly_events.1120.c: "Bảo vệ, dẹp [warrior_monk.GetHerHim] ra khỏi đường Ta!"
  tgp_japan_yearly_events.1120.c_tt: "Bảo vệ của Ngài chiến đấu với nhà sư, cho phép nhóm đi qua mà không chậm trễ."
  tgp_japan_yearly_events.1120.d: "Đi đường tản bộ ngắm cảnh."

  SHOJI_GLOSS: "Vách ngăn phòng bằng khung lưới, thường là các tấm giấy mờ, cho phép ánh sáng và bóng đi qua."
  tgp_japan_yearly_events.1130.t: "Thơ của [poet_daughter.GetFirstNamePossessiveNoTooltip]"
  tgp_japan_yearly_events.1130.desc: "Mỗi đêm, [poet_daughter.GetName], [ROOT.Char.Custom2('RelationToMeShort', poet_daughter)] của ta, đều đắm mình nhìn ánh trăng. Vết mực vương vãi trên đôi bàn tay ngọc ngà của [poet_daughter.GetHerHis], dù ta chẳng bao giờ nghe [poet_daughter.GetHerHim] viết thư từ gì cả. Những thói lập dị này có thể dung thứ, nhưng [poet_daughter.GetSheHe] giờ đây đã bắt đầu bỏ bê sức khỏe, điều này có thể gây ảnh hưởng xấu đến danh dự của ta.\n\nTheo chân [poet_daughter.GetHerHim] vào tẩm phòng, ta nhìn qua [Glossary( 'shoji screen', 'SHOJI_GLOSS' )] và thấy được nguyên nhân khiến [poet_daughter.GetHerHis] có hành vi kỳ quặc như vậy.\n\n\"[poet_daughter.Custom2('RelationToMeShort', ROOT.Char)|U]! Dường như con không thể giấu ngài những gì mình đang viết.\" Nàng nói, đưa cho ta một [ROOT.Char.Custom('GetWritingMaterial')] đầy ắp những dòng thơ."
  tgp_japan_yearly_events.1130.a: ""Những lời con thật tuyệt, [poet_daughter.GetFirstNameNoTooltip].""
  tgp_japan_yearly_events.1130.a.tt: "Ngài khuyến khích cô ấy trở thành nhà thơ"
  tgp_japan_yearly_events.1130.poet_critical: "Cô ấy trở thành nhà thơ khỏe mạnh"
  tgp_japan_yearly_events.1130.poet: "Cô ấy trở thành nhà thơ"
  tgp_japan_yearly_events.1130.nice_try: "Cô ấy tiến bộ trong viết lách"
  tgp_japan_yearly_events.1130.b: "Vớ vẩn! Hãy cư xử như một [ROOT.Char.Custom2('RelationToMeShort', poet_daughter)] của [ROOT.Char.GetTitleAsNameNoTooltip]!"
  tgp_learning_poetry_modifier: "Học Thơ"
  tgp_learning_poetry_modifier_desc: "Nhân vật này đang luyện thơ"

  tgp_japan_yearly_events.1140.t: "Chặn đường Clan"
  tgp_japan_yearly_events.1140.desc: "Khi băng qua lãnh thổ [local_county.GetNameNoTier], chúng Ta bị một nhóm người có vũ trang chặn.\n\n'Thay mặt [local_ruler.GetName], ta phải thu một khoản phí nhỏ.' [toll_warrior.GetSheHe] nói. Nhận thấy Ta bối rối, [toll_warrior.GetSheHe] thêm: 'Đây không còn là đường Hoàng gia nữa. Chỉ ý chí của [local_ruler.GetTitleAsName] được thực thi tại đây.'"
  tgp_japan_yearly_events.1140.a: "Để [toll_warrior.GetHerHim] thu phí, nhưng Ta sẽ nhớ chuyện này."
  tgp_japan_yearly_events.1140.b: "Ngươi biết ta là ai không?!"
  tgp_japan_yearly_events.1140.b.tt: "Ngài cố gắng kêu gọi sự tôn trọng địa vị từ [toll_warrior.GetNamePossessiveNoTooltip]"
  tgp_japan_yearly_events.1140.tt.success: "Ngài thuyết phục được các chiến binh"
  tgp_japan_yearly_events.1140.tt.failure: "Ngài buộc phải tìm đường khác"
  tgp_japan_yearly_events.1140.c: "Ta sẽ không trả một đồng cho '[local_ruler.GetTitleAsNameNoTooltip]' của ngươi!"

  tgp_japan_yearly_events.1150.t: "Nhìn thấy Hoàng Thượng"
  tgp_japan_yearly_events.1150.desc: "Các triều thần báo với Ta rằng [emperor.GetTitleAsNameNoTooltip], [emperor.GetFirstName], đang đi qua lãnh thổ Ta.\n\n'[emperor.GetTitleAsNameNoTooltip] ở [emperor_location.GetNameNoTooltip]? Thật may! Hiếm khi có cơ hội gần gũi với [emperor.Custom('FormOfAddressForLiege')] [emperor.GetHerselfHimself].'\n\nĐây là cơ hội tuyệt vời để gửi thông điệp đến [emperor.GetHerHim]..."
  tgp_japan_yearly_events.1150.a: "Một lễ vật khiêm tốn là phù hợp."
  tgp_japan_yearly_events.1150.b: "Mở rộng sự hiếu khách của [local_ruler.GetHouse.GetNameNoTooltip] tới [emperor.GetTitleAsNameNoTooltip]."
  tgp_japan_yearly_events.1150.b.flavor: "Chia cơm và uống cùng, chắc chắn làm tốt uy tín gia đình Ngài."
  tgp_japan_yearly_events.1150.c: "Ta sẽ tặng [emperor.GetHerHim] một bài thơ!"
  tgp_japan_yearly_events.1150.c_tt: "Ngài viết thơ để tăng thiện cảm của [emperor.GetHerHis], dựa trên [learning_i][learning_skill|E]."
  tgp_japan_yearly_events.1150.d: "[emperor.GetTitleAsNameNoTooltip] nên chia sẻ của cải của [emperor.GetHerHis]..."
  tgp_japan_yearly_events.1150.d.flavor: "Ngài gửi chiến binh để thu vàng"
  tgp_japan_yearly_events.1150.f: "Sự hiện diện của [emperor.GetHerHis|U] nhắc Ta ghét [emperor.GetHerHim] biết bao!"
  tgp_japan_yearly_events.1150.f.flavor: "Để truất phế kẻ xấu sẽ mất thời gian, trước hết Ngài phải lộ mặt xấu xa của hắn cho mọi người"
  tgp_japan_yearly_events.1150.f.tt: "$tgp_japan_yearly_events.1200.b.tt$"

  tgp_japan_yearly_events.1151.t: "Tin từ [local_ruler.GetTitleAsNameNoTooltip]"
  tgp_japan_yearly_events.1151.desc: "Khi chúng ta tiến vào [emperor_location.GetName], một quan viên của [local_ruler.GetTitleAsNameNoTooltip], [local_ruler.GetFirstName], tiếp cận chúng ta.\n\n"
  tgp_japan_yearly_events.1151.desc_bandits: ""[local_ruler.GetTitledFirstNameNoTooltip] yêu cầu cống nạp để đi qua đất của [local_ruler.GetHerHis]. Không cần thiết phải dùng đến bạo lực."\n\nGiọng điệu của [messenger.GetNamePossessive] có lý, nhưng nhóm chiến binh vũ trang đi kèm [messenger.GetHerHim] lại nói lên điều ngược lại."
  tgp_japan_yearly_events.1151.desc_hospitality: ""[local_ruler.GetTitledFirstNameNoTooltip] chào đón ngài đến [local_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip]." [messenger.GetName] nói, cúi chào một cách trang nhã. "Sẽ là vinh dự của [local_ruler.GetHerHis] nếu ngài dừng lại và thưởng thức lòng hiếu khách của chúng Ta.""
  tgp_japan_yearly_events.1151.desc_poem: ""Một vài câu thơ của [local_ruler.GetNameNoTooltip]." [messenger.GetName] nói, đưa cho Ta một [emperor.Custom('GetWritingMaterial')] mạ vàng đầy chữ. "Hy vọng ngài sẽ thích tác phẩm của [local_ruler.GetHerHis].""
  tgp_japan_yearly_events.1151.desc_gift: ""Một món quà, do [local_ruler.GetNameNoTooltip] gửi tặng." [messenger.GetName] nói, đưa cho Ta một túi vàng. "Chúng Ta chúc ngài mọi điều tốt lành trong chuyến hành trình, [emperor.GetTitleAsNameNoTooltip].""
  tgp_japan_yearly_events.1151.a: "Ngài đã làm Ta cảm kích, [local_ruler.GetNameNoTooltip]!"
  tgp_japan_yearly_events.1151.b: "Một cố gắng đáng khâm phục, Ta đoán vậy..."
  tgp_japan_yearly_events.1151.c: "Ta sẽ không bị đe dọa!"
  tgp_japan_yearly_events.1151.c_bandits: "Bảo vệ, đẩy lùi bọn chúng!"
  tgp_japan_yearly_events.1151.d: "Vậy chúng ta phải đi vòng quanh thôi."
  tgp_japan_yearly_events.1151.d_bandits: "Cho chúng một ít vàng. Không đáng để chiến đấu."
  japan_yearly_1151_bandits: "Ngài cố gắng chống lại bọn cướp của [local_ruler.GetNamePossessiveNoTooltip]"
  japan_yearly_1151_bandits_win: "Bọn cướp chiếm được một rương vàng hậu hĩnh"
  japan_yearly_1151_bandits_lose: "Bọn cướp thất bại và trở về tay trắng"
  japan_yearly_1151_success: "Kế hoạch của ngài thành công"
  japan_yearly_1151_fails: "Kế hoạch của ngài thất bại"
  tgp_japan_yearly_events.1151.tt_good.success: "Người cai trị đánh giá cao cử chỉ của ngài"
  tgp_japan_yearly_events.1151.tt_good.failure: "Cử chỉ của ngài không gây ấn tượng với người cai trị"

  friend_nice_gesture: "[TARGET_CHARACTER.GetShortUIName|U] đã gửi một cử chỉ thân thiện tới [CHARACTER.GetShortUINameNoTooltip] trong chuyến đi của họ."
  friend_nice_gesture_corresponding: "[CHARACTER.GetShortUIName|U] đã gửi một cử chỉ thân thiện tới [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] trong chuyến đi của họ."

  tgp_japan_yearly_events.1160.t: "Món Quà từ [feuding_house.GetNameNoTooltip]"
  tgp_japan_yearly_events.cannibal.1160.t: "Một Món Quà Thịt của [feuding_house.GetNameNoTooltip]"
  tgp_japan_yearly_events.1160.desc: "Sự thù ghét sâu sắc giữa đại gia tộc [ROOT.Char.GetHouse.GetName] của ta và bọn [feuding_house.GetName] vô giá trị ai cũng biết. Cho đến nay, bọn heo này chưa hề gửi tín hiệu hòa bình!\n\nTa càng tò mò hơn khi một [new_concubine.GetWomanMan] trẻ đẹp, [new_concubine.GetName], được họ dâng làm lễ vật. Dù Ta bị mê hoặc bởi sự [new_concubine.Custom('ComplimentAdjective')] của [new_concubine.GetSheHe], Ta không khỏi nghĩ đây là một mưu kế khác của [feuding_house.GetNameNoTooltip]..."
  tgp_japan_yearly_events.1160.a: "...Nhưng [new_concubine.GetSheHe] là một lời đề nghị quá hấp dẫn để bỏ qua."
  tgp_japan_yearly_events.1160.b: "Đây là trò đùa sao? Gửi [new_concubine.GetHerHim] trở lại."
  tgp_japan_yearly_events.1160.c: "Làm sao Ta có thể tin họ? Giết [new_concubine.GetHerHim]!"
  tgp_japan_yearly_events.1160.d: "[new_concubine.GetSheHe|U] sẽ là một bữa ăn ngon."

  tgp_japan_yearly_events.1200.t: "Tắc nghẽn ở Kinh đô"
  tgp_japan_yearly_events.1200.desc: "Đã qua một buổi sáng họp hành dài đằng đẵng tại [kampaku.GetCurrentLocation.GetBaronyNameExplicitly], công việc của một [kampaku.GetTitleAsName] chưa bao giờ là hết! Đoàn tùy tùng của ta khởi hành đến [GetBuilding('heian_palace_01').GetName] để dự một buổi lễ có sự tham dự của [emperor.GetTitleAsName].\n\nVới nhiều người, sự hối hả của kinh thành là một thử thách khó nhằn, nhưng với cương vị là [kampaku.GetTitleAsNameNoTooltip], dân chúng tự động dạt ra như cá mòi khi thấy cá mập xuất hiện.\n\nĐột nhiên đoàn tùy tùng của ta dừng lại. Các cận thần báo tin rằng kẻ mới nổi [upstart.GetName] đã chặn đường phía trước và nhất quyết không chịu di chuyển ngựa để nhường đường. Đúng là gã lợn cứng đầu!"
  tgp_japan_yearly_events.1200.a: "Kéo hắn khỏi ngựa!"
  tgp_japan_yearly_events.1200.b: "Để hắn nghĩ rằng có thể thoát tội."
  tgp_japan_yearly_events.1200.b.tt: "Kế hoạch [GetScheme('slander').GetTypeName] [scheme|E] của ngài nhận được hiệu ứng [GetModifier('bided_my_time').GetNameWithTooltip]"
  tgp_japan_yearly_events.1200.c: "Chiến thắng vĩ đại nhất là Tình bạn."
  tgp_japan_yearly_events.1200.c.tt: "Kế hoạch [GetScheme('befriend').GetTypeName] [scheme|E] của ngài nhận được hiệu ứng [GetModifier('settled_differences_modifier').GetNameWithTooltip]"


  tgp_japan_yearly_events.1210.t: "Đủ Năng Lực Lãnh Đạo?"
  tgp_japan_yearly_events.1210.desc.intro: "Sự thăng tiến của ta làm người đứng đầu Gia tộc [ROOT.Char.GetHouse.GetName] đã bị phá hỏng. [ROOT.Char.Custom2('RelationToMeShort', contester)] của Ta, con nhện đó, [contester.GetName], đã dệt một mạng lưới dối trá tinh vi, đầu độc tai những ai nghe.\n\n"[ROOT.Char.GetTitledFirstName] không đủ năng lực lãnh đạo Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]!"\n\n[contester.GetSheHe|U] tuyên bố trên hết,"
  tgp_japan_yearly_events.1210.desc.reason_weak_prowess: "năng lực yếu kém của Ta"
  tgp_japan_yearly_events.1210.desc.reason_bad_health: "sức khỏe sa sút của Ta"
  tgp_japan_yearly_events.1210.desc.reason_drunkard: "thói nghiện rượu vô tận của Ta"
  tgp_japan_yearly_events.1210.desc.bad_genetic: "những khiếm khuyết đáng tiếc từ lúc sinh ra"
  tgp_japan_yearly_events.1210.desc.sinful: "hành vi tội lỗi của Ta"
  tgp_japan_yearly_events.1210.desc.low_legitimacy: "tính hợp pháp đáng nghi của Ta"
  tgp_japan_yearly_events.1210.desc.older_sibling: "sự tồn tại của anh/chị lớn hơn Ta"
  tgp_japan_yearly_events.1210.desc.illegitimized: "sự bất hợp pháp của Ta"
  tgp_japan_yearly_events.1210.desc.concubine_child: "vị thế là con của một thiếp"
  tgp_japan_yearly_events.1210.desc.reason_non_dominant_gender: "giới tính không lý tưởng của Ta"
  tgp_japan_yearly_events.1210.desc.reason_fallback: "giấc mơ đầu năm của [contester.GetHerHis] không may mắn và"
  tgp_japan_yearly_events.1210.desc.outro: "phải ngăn Ta lãnh đạo gia tộc và đòi chiếm ghế của Ta. Nếu để mầm mống này phát triển, nó sẽ ăn mòn thân xác. Vì lợi ích Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip], Ta phải hành động."
  tgp_japan_yearly_events.1210.a: ""Biết vị trí của mình hoặc cút đi!""
  tgp_japan_yearly_events.1210.b: "Cây lúa trưởng thành cúi đầu."
  tgp_japan_yearly_events.1210.b.flavor: "Lãnh đạo bền lâu dựa trên sự nhượng bộ. Ngài cho [contester.GetName] quyền lập [house|E] mới"
  tgp_japan_yearly_events.1210.b.tt: "[contester.GetName] sẽ lập một [house|E] mới. Họ sẽ nghĩ tốt về ngài và gia tộc của ngài."
  house_relation_friendly_reason_cadet_branch_permission_desc: "Nơi lúa có thể ngã, một cây nhiều cành có thể được nâng đỡ khỏi ngã."
  tgp_japan_yearly_events.1210.c: "Ta sẽ thay đổi quan điểm của [contester.GetHerHis]."
  tgp_japan_yearly_events.1210.c.good: "Vết thương dễ chữa nhất là vết chưa từng tồn tại"
  tgp_japan_yearly_events.1210.c.good.tt: "$custom.every_house_member$"
  tgp_japan_yearly_events.1210.c.bad: "Ta phải bôi trơn bánh xe..."
  tgp_japan_yearly_events.1210.c.ugly: "Hình như Ta vừa tạo ra một kẻ thù"
  tgp_japan_yearly_events.1210.d: "Tại sao phải công nhận một bất bình tưởng tượng?"
  tgp_japan_yearly_events.1210.d.flavor: "Phớt lờ [contester.GetHerHim]"
  tgp_japan_yearly_events.1210.d.tt: "[contester.GetName] sẽ lập một [house|E] mới. Họ sẽ nghĩ xấu về ngài và gia tộc của ngài."
  house_relation_quarrel_reason_cadet_branch_permission_desc: "Ngài phớt lờ những lo ngại của [contester.GetTitledFirstNamePossessive]"

  tgp_japan_yearly_events.1225.t: "Cuộc Sống Thi Ca"
  tgp_japan_yearly_events.1225.desc.intro.influencer: "[poet_influencer.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('poet_influencer'))] của ta, sáng nay trong ánh mắt ngời lên tia sáng lạ. Luôn quan tâm đến sự tiến bộ của ta, [poet_influencer.GetSheHe] bắt đầu một bài ngâm thơ đầy say sưa:\n\n\""
  tgp_japan_yearly_events.1225.desc.intro: "Khi Ta xem xét các văn bản để rèn luyện bản thân, Ta bắt gặp một đoạn thu hút sự chú ý."
  tgp_japan_yearly_events.1225.desc: "#EMP "Hạt giống thơ ca [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] nằm trong trái tim tất cả mọi người. Nếu được nuôi dưỡng, nó sẽ phát triển thành những chiếc lá vạn từ.\n\nNhững lời này có thể biến những điều nhỏ nhặt chúng ta thấy và nghe thành sức mạnh lay chuyển trời đất, khơi gợi cảm xúc của các thần linh vô hình, gắn kết quan hệ nam nữ, và làm dịu lòng những chiến binh dữ dội!"#!\n\n"Trở thành nhà thơ là sống, và bằng cách sống, Ngài có thể trở thành một nhà thơ giỏi hơn.""
  tgp_japan_yearly_events.1225.a: "Vậy Ta sẽ bắt đầu sống!"
  tgp_japan_yearly_events.1225.a.flavor: "Theo thời gian, Ta sẽ là một nhà thơ không chỉ trên danh nghĩa"
  tgp_japan_yearly_events.1225.b: "Hôm nay Ta sẽ học thơ, nhưng Ta tìm kiếm một cuộc sống bớt phù phiếm hơn."

  tgp_japan_yearly_events.1260.t: "$tgp_japan_yearly_events.1225.t$: Tình Yêu và Cái Chết"
  tgp_japan_yearly_events.1260.desc: "Buổi sáng bắt đầu với không khí trong trẻo, những chú chim bay lượn tìm Ngài đời.\n\n"Chúng sẽ sớm chết, nhưng sống trọn vẹn, sáng tác những lời yêu thương suốt cả buổi sáng."\n\nTa quan sát thêm khi côn trùng bị xé ra khỏi không khí, phân tách và bị những cặp đôi cánh giày ăn ngấu nghiến.\n\nVới tư cách một nhà thơ, nhiệm vụ của Ta là chắt lọc mọi vẻ đẹp và kinh hoàng vào một vài từ cho người khác chiêm nghiệm. Mọi bài thơ đều nói về tình yêu hoặc cái chết. Cái chết ở quanh ta, nhưng tình yêu, tình yêu thì phải tìm kiếm."
  tgp_japan_yearly_events.1260.a: "Nhiệm vụ của Ta là theo đuổi những cuộc tình!"
  tgp_japan_yearly_events.1260.a.flavor: "Làm sao Ta có thể hy vọng nâng cao nghệ thuật của mình nếu không?"
  tgp_japan_yearly_events.1260.b: "Tình yêu vượt quá tầm với, thơ ca cũng vậy, Ta e."

  tgp_japan_yearly_events.1261.t: "$tgp_japan_yearly_events.1225.t$: Trường Sinh Hoàng Gia"
  tgp_japan_yearly_events.1261.desc: "Những kỳ tài thi ca của ta đã thu hút sự chú ý của [top_cuckold.GetTitledFirstNamePossessive], [top_cuckold.Custom2('RelationToMeShort', SCOPE.sC('top_cuckold'))] và [top_liege_spouse.GetTitledFirstName], [top_liege_spouse.Custom2('RelationToMeShort', SCOPE.sC('top_liege_spouse'))] của ta:\n\n\"Lời văn của ngài đã giành lấy sự bất tử trong tâm trí bách tính [inspired_poet.GetTopLiege.GetCulture.GetNameNoTooltip], nhưng liệu ngài có thể đảm bảo sự bất tử cho thân xác này không?\"\n\nNhững lời tán tụng đầy tinh tế của [top_liege_spouse.GetHerHis|U] kết thúc ngay tại ngưỡng cửa tẩm phòng của ngài. Có vẻ như [top_liege_spouse.GetSheHe] muốn nhiều hơn là chỉ xác nhận những lời đồn đại về kỹ năng của ta trên giường gối. Liệu nàng đang hy vọng rằng cuộc hoan lạc của chúng ta sẽ mang lại một người thừa kế mới cho [top_cuckold.GetTitleAsNameNoTooltip]?!"
  tgp_japan_yearly_events.1261.chop.desc: "\n\n[top_liege_spouse.GetSheHe] không được biết rằng Ta thiếu bộ phận sinh sản..."
  tgp_japan_yearly_events.1261.a: "Dòng máu của Ta sẽ củng cố [top_cuckold.GetPrimaryTitle.GetNameNoTooltip]!"
  tgp_japan_yearly_events.1261.a.flavor: "Hơn bất cứ lời nói nào, dòng máu của Ta sẽ vang vọng qua lịch sử."
  tgp_japan_yearly_events.1261.b: "Tốt hơn là chúng ta trao đổi thơ, chứ không phải..."
  tgp_japan_yearly_events.1261.c: "Ta sẽ không tiết lộ khả năng yêu kém cỏi của [top_cuckold.GetTitleAsNamePossessiveNoTooltip]."
  tgp_japan_yearly_events.1261.d: "Dù sao thì cũng hãy vui vẻ!"

  tgp_japan_yearly_events.1262.t: "$tgp_japan_yearly_events.1225.t$: Trao Đổi Câu Thơ"
  tgp_japan_yearly_events.1262.desc.intro: "Nhiều câu thơ mạnh mẽ được khám phá khi hít thở không khí đêm. Khi Ta suy tư về "
  tgp_japan_yearly_events.1262.inspo: "một sức mạnh vượt ngoài bản thân,"
  tgp_japan_yearly_events.1262.japan.inspo: "[Glossary('mono no aware', 'MONONOAWARE_GLOSS')],"
  tgp_japan_yearly_events.1262.desc: "Ta bỗng gặp nhà thơ quyến rũ [local_poet.GetName] đọc một câu thơ:\n\n#EMP "Bên [local_poet_spot.Custom('GetTerrainType')] yên tĩnh,\n\nTa chờ nghe bước chân ngươi,\n\nvào buổi tối [local_poet_spot.Custom('RoamingLegendaryBeastProvinceWeather')]."#!\n\nCảm nhận được tâm hồn thơ của Ta, [local_poet.GetSheHe] ra hiệu để Ta tham gia vào bóng tối với [local_poet.GetHerHim]. Liệu đây có phải lời mời để tham gia "
  tgp_japan_yearly_events.1262.japan.outro: "[Glossary('renga', 'RENGA_GLOSS')]"
  tgp_japan_yearly_events.1262.outro: "vào một cuộc trao đổi thơ"
  tgp_japan_yearly_events.1262.japan.outro.outro: "hay ánh mắt tựa loài [local_poet.Custom('VenomousCreature')] của [local_poet.GetHerHis] đang báo hiệu một điều gì đó còn phóng túng hơn?"

  tgp_japan_yearly_events.1262.a: "Ta đã có câu thơ phù hợp!"
  tgp_japan_yearly_events.1262.a.flavor: "#EMP "Gió mang tiếng nói của ngươi,\n\nnhẹ nhàng như tiếng thở của lá rơi,\n\ndưới bầu trời mùa thu."#!"
  tgp_japan_yearly_events.1262.b: "Hãy trao đổi nhiều hơn cả lời nói..."
  tgp_japan_yearly_events.1262.b.flavor: "Tiếng nói của chúng ta sẽ vang dội muôn vàn 'câu thơ' vào đêm."
  tgp_japan_yearly_events.1262.c: "Hay là [local_poet.GetSheHe] là sát thủ?!"
  MONONOAWARE_GLOSS: "Một trạng thái tâm lý khi sáng tác thơ trong thời Heian Nhật Bản. Người viết tương tác với cảm xúc mãnh liệt nhưng điềm tĩnh, tập trung vào vẻ đẹp thoáng qua và thấu cảm sự tàn nhẫn của thời gian."
  RENGA_GLOSS: "Thơ 'liên kết' Nhật Bản là hình thức nhiều nhà thơ đóng góp các khổ thơ xen kẽ."

  tgp_japan_yearly_events.1263.t: "$tgp_japan_yearly_events.1225.t$: Một [SCOPE.Custom('ArtifactFlowerSpecies')|U] Phù Du"
  tgp_japan_yearly_events.1263.desc: "Sự thật của thế giới được tiết lộ qua thiên nhiên! Khi đi dạo ngắn bên [rural_beauty_location.Custom('GetTerrainType')] xa hoa gần [inspired_poet.GetCurrentLocation.GetBaronyNameExplicitly], Ta gặp cơn mưa rào bất chợt.\n\nTrong khi tìm chỗ trú, Ta tình cờ gặp một [rural_beauty.GetWomanMan] nhảy múa trên thảm [SCOPE.Custom('ArtifactFlowerSpeciesPlural')].\n\nMưa đập xuống dưới chân [rural_beauty.GetHerHis], phá hủy những cánh hoa mỏng manh. Vẻ đẹp thoáng qua này càng nổi bật trong sự tàn phá có vẻ vô tình. Nhìn thấy Ta ướt sũng, [rural_beauty.GetSheHe] ra hiệu mời Ta lại gần bằng một cái gật cằm khiêu khích."
  tgp_japan_yearly_events.1263.a: "Hãy cùng ăn mừng cuộc sống thoáng qua của chúng ta..."
  tgp_japan_yearly_events.1263.a.flavor: "Mưa thì mặc mưa, nhảy múa giữa [SCOPE.Custom('ArtifactFlowerSpeciesPlural')]. Kỷ niệm này chắc chắn sẽ truyền cảm hứng cho thơ ca của Ngài!"
  tgp_japan_yearly_events.1263.b: "Ta phải bảo tồn ít nhất một [SCOPE.Custom('ArtifactFlowerSpecies')]!"
  tgp_japan_yearly_events.1263.b.flavor: "Một cuộc nổi loạn nhỏ chống lại sự tàn nhẫn của thời gian."
  tgp_japan_yearly_events.1263.c: "Liệu những cánh hoa bị nghiền có chứa một mục đích khác?"
  tgp_japan_yearly_events.1263.c.poisonous: "#EMP Món quà từ [rural_beauty.GetFaith.DeathDeityName]...#!"
  tgp_japan_yearly_events.1263.c.medicinal: "#EMP Món quà từ [rural_beauty.GetFaith.HealthGodName]...#!"

  tgp_japan_yearly_events.1270.t: "$tgp_japan_yearly_events.1225.t$: Ngàn Lá Bất Tử"
  tgp_japan_yearly_events.1270.desc: "Trong khi ai cũng sinh ra với hạt giống thơ ca trong tim, hạt giống của Ta đã được nuôi dưỡng bởi mặt trời tình ái mà Ta tìm cách tắm mình dưới ánh sáng, cùng với dòng nước ngọt của cái chết bao quanh chúng ta.\n\nĐiều này đã dẫn đến việc tạo ra #EMP $poetic_life_artifact_name$#!, chắc chắn sẽ là trụ cột văn hóa [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] trong tương lai.\n\nTất cả sẽ nhớ khi,"
  tgp_japan_yearly_events.1270.desc.love_memory_1: "#EMP [love_memory_1.GetDescription]#!,"
  tgp_japan_yearly_events.1270.desc.love_memory_2: "#EMP [love_memory_2.GetDescription]#!,"
  tgp_japan_yearly_events.1270.desc.love_memory_3: "#EMP [love_memory_3.GetDescription]#!,"
  tgp_japan_yearly_events.1270.desc.death_memory_1: "#EMP [death_memory_1.GetDescription]#!,"
  tgp_japan_yearly_events.1270.desc.death_memory_2: "#EMP [death_memory_2.GetDescription]#!,"
  tgp_japan_yearly_events.1270.desc.death_memory_3: "#EMP [death_memory_3.GetDescription].#!"
  tgp_japan_yearly_events.1270.a: "Hội đồng [ROOT.Char.Custom('GetCourt')] phải được lợi từ trí tuệ tình ái của Ta!"
  tgp_japan_yearly_events.1270.b: "Dù thân xác Ta tàn úa và thối rữa, sinh lực của Ta vẫn trường tồn."
  poetic_life_artifact_name: "$tgp_japan_yearly_events.1270.t$"
  poetic_life_artifact_description: "Một tác phẩm thơ ca kinh điển bất tử hóa niềm vui thoáng qua khi,"
  poetic_life_artifact_description.love_memory_1: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.love_memory_1$"
  poetic_life_artifact_description.love_memory_2: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.love_memory_2$"
  poetic_life_artifact_description.love_memory_3: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.love_memory_3$"
  poetic_life_artifact_description.death_memory_1: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.death_memory_1$"
  poetic_life_artifact_description.death_memory_2: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.death_memory_2$"
  poetic_life_artifact_description.death_memory_3: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.death_memory_3$"
  poetic_life_artifact_description.end: "[newly_created_artifact.GetDesc]\n\nĐược viết bởi [ROOT.Char.GetFirstNameNoTooltip]."

  tgp_japan_yearly_events.1270.a_effect: "[newly_created_artifact.GetName] được tạo thành [court_artifact|E] và sẽ nhận được hiệu ứng [grandeur|E]"
  tgp_japan_yearly_events.1270.b_effect: "Ngài nhận được [newly_created_artifact.GetName] [artifact|E]"

  tgp_japan_yearly_events.1170.t: "Những Nét Vẽ Quyến Rũ"
  tgp_japan_yearly_events.1170.desc: "Mặc dù Ta không nói được ngôn ngữ [foreign_ruler.GetCulture.GetLanguage.GetName], thơ ca của [foreign_ruler.GetPrimaryTitle.GetName] nổi tiếng với chiều sâu và sự tinh tế.\n\nThật thú vị khi nhận ra các ký tự quen thuộc nhưng Ta vẫn khó mà hiểu hết ẩn dụ và tinh tế ẩn chứa."
  tgp_japan_yearly_events.1170.a: "Có lẽ đã đến lúc học ngôn ngữ chị em."
  tgp_japan_yearly_events.1170.b: "Ha! Nói với [foreign_ruler.GetFirstNameNoTooltip] rằng [foreign_ruler.GetHerHis] những nhà thơ thật tệ!"
  tgp_japan_yearly_events.1170.c: "Sự mơ hồ chính là vẻ đẹp!"
  tgp_japan_yearly_events.1170.c.flavor: "Sự giải trí nhất thời này củng cố trí tưởng tượng của ngài"
  BONSAI_GLOSS: "#bold Bonsai#! là nghệ thuật trồng và tạo hình cây nhỏ trong chậu. Một số học giả nói rằng cây phản ánh chủ nhân của chúng."
  tgp_japan_yearly_events.1180.t: "Tạo Hình Tăng Trưởng"
  tgp_japan_yearly_events.1180.desc: "Một món đồ mới trong vườn của ta đã trở thành chủ đề bàn tán trong triều. Dù không ra trái và quá nhỏ để che mát, cái cây [Glossary( 'Bonsai', 'BONSAI_GLOSS' )] này là minh chứng cho sự kiên nhẫn qua nhiều năm tháng.\n\n[GetCourtPositionType('court_gardener_court_position').GetName] [gardener.GetFirstName] thấy ta đang chăm chú nhìn nó,\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], một cái cây mặc kệ cho tự nhiên phát triển chỉ là thứ thô kệch. Chỉ khi được uốn nắn bằng sự chăm sóc tận tâm, hình dáng và phong thái của nó mới có khả năng khơi gợi cảm hứng. Nó có đang đánh thức điều gì trong ngài không?\"\n\n\""
  court_position_from_event: "Từ Sự Kiện"
  tgp_japan_yearly_events.1180.a: "Ta sẽ được dẫn dắt bởi sự ổn định của nó."
  tgp_japan_yearly_events.1180.b: "[ROOT.Char.GetFaith.FertilityGodName] được tôn kính bởi cây này, hãy chăm sóc tốt."
  tgp_japan_yearly_events.1180.c: "Ta muốn tự tay tạo hình nó."

  tgp_japan_yearly_events.1190.t: "Vật Lộn Với Nhiệm Vụ"
  tgp_japan_yearly_events.1190.desc_annoyed: "Những lời líu lo của triều đình và lời than phiền của các lãnh chúa làm Ta khó chịu, và điều cuối cùng Ta nghĩ tới là những cuộc cãi vã của thường dân."
  tgp_japan_yearly_events.1020.desc_drunk: "Ta uống say với một li rượu [ROOT.Char.Custom('RegionalAlcoholicDrink')] đầy hấp dẫn, nhưng chẳng được an ủi bao nhiêu. Đáng tiếc, việc hoàn thành nhiệm vụ trong trạng thái say đã trở thành bản năng."
  tgp_japan_yearly_events.1020.desc_dumb: "Một lần nữa Ta thất bại trong việc hiểu những toan tính hằng ngày của triều đình. Buồn thay, không ai nhầm Ta là học giả hay quan lại có năng lực."
  tgp_japan_yearly_events.1190.desc: "\n\nTa nhìn đống [ROOT.Char.Custom('GetWritingMaterialPlural')] quên mất tại sao chúng quan trọng. Đọc lại nội dung cũng chẳng rõ ràng, nhưng yêu cầu của nhà nước buộc Ta phải ra quyết định, dù thông tin thiếu thốn."
  tgp_japan_yearly_events.1190.a: "Ta phải giải quyết thất bại này!"
  tgp_japan_yearly_events.1190.b: "Hội đồng của Ta phải quyết thay Ta."
  tgp_japan_yearly_events.1190.c: "Một quyết định tồi vẫn hơn là không có..."
  tgp_japan_yearly_events.1190.c_tt: "Một [county|E] ngẫu nhiên trong lãnh thổ của ngài sẽ mất một ít [control|E]"

  tgp_japan_yearly_events.1220.t: "Phép Màu Trong Áo Choàng"
  tgp_japan_yearly_events.1220.desc: "Người [ROOT.Char.Custom2('RelationToMeShort', miracle_recipient)], [miracle_recipient.GetName], mang đến cho Ta tin tức về nhà sư hành hương, [monk.GetName], đã thực hiện một phép màu.\n\n"
  tgp_japan_yearly_events.1220.desc_health: ""Bệnh tật không còn quấy rầy Ta nữa, [miracle_recipient.Custom2('RelationToMeShort', ROOT.Char)]! Thực sự, sức mạnh từ lời cầu nguyện của [monk.GetHerHis] đã làm Ta mạnh mẽ hơn trước khi bệnh.""
  tgp_japan_yearly_events.1220.desc_wealth: ""Ta đã tặng nhà sư một túi vàng, và vài tháng sau, [monk.GetSheHe] trả lại một túi có giá trị gấp mười lần, báo đáp Ta!"" 
  tgp_japan_yearly_events.1220.desc_knowledge: ""Trước khi gặp nhà sư này, nhiều người có thể nghĩ Ta đần độn. Nhưng sau khi nhận được giáo huấn của [monk.GetHerHis], tâm trí Ta tràn đầy kiến thức và sự nhạy bén!"" 
  tgp_japan_yearly_events.1220.a: "Thật tuyệt vời! Ta phải tìm gặp nhà sư này."
  tgp_japan_yearly_events.1220.b: "Chắc hẳn có một lời giải thích hợp lý... ở đâu đó."
  tgp_japan_yearly_events.1220.c: "Ta nên học theo cách của [monk.GetHerHis]..."
  tgp_japan_yearly_events.1220.tt: "Nhà sư thực hiện phép màu cho Ngài"
  tgp_japan_yearly_events.1220.c.tt: "Ngài nghiên cứu phép màu"
  tgp_japan_yearly_events.1220.tt_win: "Ngài học được cách của nhà sư"
  tgp_japan_yearly_events.1220.tt_lose: "Ngài không hiểu cách của nhà sư"
  tgp_japan_yearly_events.1220.tt_wealth: "Ngài tự đầu tư vào đền, và dường như mang lại lợi nhuận đáng tin cậy."

  tgp_japan_yearly_events.1230.t: "Bị Quấy Rầy Bởi Sự Bỏ Quên"
  tgp_japan_yearly_events.1230.desc: "[cursed_artifact.GetName] không còn là [cursed_artifact.GetSlotType|l] như thuở ban đầu. Với [cursed_artifact.Custom('GetArtifactDecayDesc')] cùng tuổi đời [cursed_artifact.GetAge] năm, tạo tác này đã đến lúc cần phải tu bổ.\n\nTruyền thuyết kể rằng đồ vật cũng có ký ức và cảm xúc như chúng ta, và nếu bị bỏ bê, chúng có thể bị một [Glossary( 'Yokai', 'YOKAI_GLOSS' )] chiếm giữ..."
  tgp_japan_yearly_events.1230.a: "Sửa chữa nó trước khi nó sống dậy!"
  tgp_japan_yearly_events.1230.b: "Ta sẽ không để một vật thể ám hại mình..."
  tgp_japan_yearly_events.1230.c: "Hy vọng sẽ không có chuyện gì xảy ra..."
  tgp_japan_yearly_events.1230.c_cynical: "À, Ta không tin vào những câu chuyện như vậy."

  artifact_decay_scratched: "bề mặt bị trầy xước và thủng"
  artifact_decay_dull: "đầu nhọn bị mòn"
  artifact_decay_torn: "dây buộc và vải bị rách"
  artifact_decay_cracked: "bề mặt đầy vết nứt"
  artifact_decay_fracture: "bề mặt đầy vết gãy"
  artifact_decay_worn: "bị hao mòn nhiều"

  tgp_japan_yearly_events.1240.t: "Lạc Trong Những Dòng Chữ"
  tgp_japan_yearly_events.1240.desc: "[traveler.GetName], một nhà thơ văn hóa [traveler.GetCulture.GetName] đang du hành qua lãnh địa của ta, tiếp cận ta với một văn bản viết bằng ngôn ngữ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip].\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], ta đã nghe danh truyền thống thi ca phong phú của ngài, nhưng ta không thể giải mã được những dòng chữ của dân tộc ngài.\"\n\n[traveler.GetSheHe|U] bắt đầu đọc cuộn giấy với giọng địa phương đặc sệt, và vấn đề trở nên rõ ràng. [traveler.GetSheHe|U] đọc từ trái sang phải, trong khi văn tự truyền thống [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] lại viết theo hàng dọc.\n\nCác cung nhân nhìn và khúc khích cười, trong khi [traveler.GetSheHe] vẫn tiếp tục đọc những lời thơ đầy dồn dập."
  tgp_japan_yearly_events.1240.a: "Hãy mang cho [traveler.GetHerHim] một gia sư, làm ơn!"
  tgp_japan_yearly_events.1240.b: "Ha! Thật là một trận cười sảng khoái."
  tgp_japan_yearly_events.1240.c: "Hãy xem Ta có thể giải thích bằng ngôn ngữ của ngài không..."

  artifact_fertility_gain_2_modifier: "Khả năng sinh sản"
  artifact_powerful_vassal_opinion_5_modifier: "$artifact_powerful_vassal_opinion_1_modifier$"
  artifact_monthly_prestige_add_3_modifier: "$artifact_monthly_prestige_add_1_modifier$"
  artifact_kakejiku_scroll_name: "Cuộn Kakejiku"
  KAKEJIKU_GLOSS: "Một #bold Cuộn Kakejiku#! — hay #bold Kakemono#! là cuộn giấy trưng bày thư pháp hoặc tranh vẽ, thường kể một câu chuyện."
  artifact_kakejiku_scroll_desc: "Một cuộn [Glossary( 'Kakejiku Scroll', 'KAKEJIKU_GLOSS' )] kể lại câu chuyện về"
  artifact_kakejiku_scroll_crane_desc: "$artifact_kakejiku_scroll_desc$ một con sếu đơn độc, chăm sóc một cây.\n\n#weak Lông của sếu bay trong gió, quan sát cây con. Sếu kết đôi trọn đời, nhưng cây này cần hàng thế kỷ để lớn...#!"
  artifact_kakejiku_scroll_friends_desc: "$artifact_kakejiku_scroll_desc$ hai người gắn kết bởi định mệnh, trưởng thành qua thử thách và hình thành Tình bạn sâu sắc.\n\n#weak Hai hình bóng gặp nhau dưới bầu trời đầy sao, kết nối bởi một cầu thiên thể...#!"
  artifact_kakejiku_scroll_sword_desc: "$artifact_kakejiku_scroll_desc$ một thanh kiếm thần, chỉ những chiến binh danh dự nhất mới có thể sử dụng.\n\n#weak Một cây anh đào nở bên hồ yên tĩnh, bên dưới là thanh kiếm được bao vỏ...#!"

  tgp_japan_yearly_events.1250.t: "Một Câu Chuyện Vượt Thời Gian"
  tgp_japan_yearly_events.1250.desc: "[scroll_gifter.GetName] bước tới, mang theo một vật dài được gói cẩn thận. \"[ROOT.Char.Custom2('RelationToMeShort', scroll_gifter)], ta có một món quà cho liên minh của ngài,\" [scroll_gifter.GetNameNoTooltip] nói, trình ra một cuộn giấy. \"Một cuộn [Glossary( 'Kakejiku Scroll', 'KAKEJIKU_GLOSS' )] với những áng văn từ nhà thơ xuất chúng nhất, mong ngài sẽ nhớ đến ý nghĩa của nó những lúc gian nan.\""
  tgp_japan_yearly_events.1250.a: "Treo nó trên giường cưới."
  tgp_japan_yearly_events.1250.b: "Đặt nó trong triều, nơi mọi người đều có thể nhìn thấy."
  tgp_japan_yearly_events.1250.c: "Giữ an toàn, để con cháu chúng ta có thể đọc."
