l_english: 
 # END
  natural_disaster.4001.t: "[situation.GetNameNoTooltip]: Hồi Phục Hoàn Tất"
  natural_disaster.4001.desc: "Thảm họa gần đây đã tàn phá vùng đất của chúng ta để lại những tổn thương cần nhiều thế hệ mới có thể khắc phục. Một vết thương cảm nhận khắp vùng, gây đau cho cả quý tộc và thường dân.\n\nChúng ta cùng nhau tưởng niệm những người đã mất và khôi phục các thành phố, thị trấn. Nếu thảm họa xảy ra lần nữa, chúng ta sẽ chuẩn bị sẵn sàng."
  natural_disaster.4001.a: "Chiến thắng trước thiên nhiên, thực sự."
  natural_disaster.4002.a: "Công sức của chúng ta không uổng phí!"

 # IMPACT
  natural_disaster.5001.t: "[situation.GetNameNoTooltip]: Tiến Trình Bị Hủy Hoại"
  natural_disaster.5001.desc: "Nhiều năm đầu tư và thành quả lao động cực nhọc trong khu vực bị phá hủy trong chớp mắt. Các gia đình bỏ lại nhà tổ tiên khi chỉ còn lại đống đổ nát. Các nhà sử học thương tiếc mất mát những kho báu quý giá, cùng với kho dự trữ quan trọng của quân đội.\n\n"
  natural_disaster.5001.desc.flood: "Các tầng hầm và công trình ngầm hoàn toàn bị mất, lối ra ngập trong nước lũ. Việc di chuyển trở nên gần như không thể, người và thú cõng đều chìm vào đất ướt sũng."
  natural_disaster.5001.desc.earthquake: "Những người vô tội chạy khi đống đổ nát rơi từ trên trời, chỉ để bị nuốt chửng bởi những cột khói đen ngột ngạt. Những tòa nhà đã đứng vững qua thời gian giờ đổ nát, tàn tích tan tác không nhận ra được."
  natural_disaster.5001.a: "Sẽ có quá nhiều thứ phải xây dựng lại."
  natural_disaster_5001_flood_tt: "Mỗi [realm|E] [county|E] trong [situation.GetName] [situation_sub_region.GetName] đã mất #N 1/[SCOPE.ScriptValue('natural_disaster_flood_development_loss_fraction_value')|0]#! phát triển #weak (Tối đa -5)#!"
  natural_disaster.5011.t: "[situation.GetNameNoTooltip]: Yếu ớt và Mong Manh"
  natural_disaster.5011.desc.earthquake: "Những bức tường cao chọc trời và u ám của [epicenter_county.GetNameNoTier] đã sụp đổ,"
  natural_disaster.5011.desc.flood: "Những bức tường cao chọc trời bao quanh các thị trấn ven [river_region.GetName] đã tan rã,"
  natural_disaster.5011.desc: "không thể bố trí bất kỳ trung đoàn nào ở đó. Các chiến binh được chuyển đến vùng an toàn hơn, nhưng điều này tạo ra sự dễ tổn thương cho khu vực.\n\nVào thời điểm yếu nhất, vùng đất nằm trong đổ nát — không được bảo vệ và dễ bị tấn công."
  natural_disaster.5011.a: "Tình hình ngày càng u ám."
  natural_disaster.5021.t: "[situation.GetNameNoTooltip]: Di Cư"
  natural_disaster.5021.desc: "Những nạn nhân của [situation.GetName] vội vã tìm nơi an toàn, bỏ lại cuộc sống cũ. Khi ít người còn lại để đảm bảo an toàn và trật tự khu vực, những kẻ xấu tung hoành. Không thể cai trị khu vực này nữa."
  natural_disaster.5021.a: "Khu vực đã bị bỏ hoang."
  natural_disaster.5022.desc: "Người tị nạn từ [situation.GetName] đổ về các vùng lân cận, cố gắng thoát khỏi hỗn loạn. Tội phạm lan tràn, kẻ ác lợi dụng hỗn loạn. Khu vực bị ảnh hưởng trở thành gánh nặng, không thể sản xuất lợi nhuận hay tiến bộ do mất đi dân cư."
  natural_disaster.5022.a: "Những người sống sót an toàn ở đây."
  natural_disaster.5031.t: "[situation.GetNameNoTooltip]: Đồng Cỏ Hoang Tàn"
  natural_disaster.5031.desc: "Nhiều đàn gia súc suy giảm khi đất dành cho chúng ăn cỏ ngày càng ít. Sự thịnh nộ của thiên nhiên tàn phá vùng đất, khiến việc duy trì đàn gia súc trở nên bất khả thi."
  natural_disaster.5031.a: "Những vùng đất này không còn màu mỡ."
  natural_disaster.5101.t: "[situation.GetNameNoTooltip]: Giây Phút Cuối"
  natural_disaster.5101.desc.flood: "Nước bẩn dâng tới ngực, đặc quánh với bùn. Quần áo ướt kéo chân Ta khi dòng chảy mạnh lên."
  natural_disaster.5101.desc.earthquake: "Sàn nhà rung lên, bụi bay từ trần. Thanh chống nặng vỡ và tường kêu răng rắc. Chỉ trong chốc lát, mọi thứ sẽ sụp đổ."
  natural_disaster.5101.travel: "\n\nCó lẽ trú ẩn trong [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] này là không khôn ngoan."
  natural_disaster.5101.army: "\n\nCó lẽ trú ẩn trong [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] này là không khôn ngoan. Xung quanh Ta, binh sĩ bị cuốn theo dòng nước."
  natural_disaster.5101.activity: "\n\nĐây sẽ là [involved_activity.GetActivityType.GetNameNoTooltip] cuối cùng Ta chứng kiến."
  natural_disaster.5101.tent: "\n\nCó lẽ trú ẩn trong [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] này là không khôn ngoan."
  natural_disaster.5101.estate: "\n\nTa chạy qua các hành lang trong dinh thự chỉ để thấy lối ra duy nhất bị kẹt nửa chừng."
  natural_disaster.5101.court: "\n\nTa chen qua đám quan lại hoảng loạn, chỉ để thấy lối ra duy nhất bị chặn chặt."
  natural_disaster.5101.desc.flood_end: "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))] của Ta [at_risk_character.GetTitledFirstNameNoTooltip] đi sau một bước, đưa tay với Ta. Chỉ có chỗ cho một người lọt ra ngoài không khí."
  natural_disaster.5101.desc.earthquake_end: "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))] của Ta [at_risk_character.GetTitledFirstNameNoTooltip] đi sau một bước, mắt mở to. Chỉ có chỗ cho một người lọt qua cửa trước khi thanh chống sập xuống."
  natural_disaster.5101.a: "Ta kéo [at_risk_character.GetTitledFirstNameNoTooltip] và lao tới cửa."
  natural_disaster.5101.a.tt.success: "Ngài và [at_risk_character.GetFirstNameNoTooltip] đều sống sót"
  natural_disaster.5101.a.tt.failure: "Thảm họa ập tới Ngài"
  natural_disaster.5101.a.tt.failure_root: "Ngài chết"
  natural_disaster.5101.a.tt.failure_secondary: "[at_risk_character.GetFirstNameNoTooltip] chết"
  natural_disaster.5101.b: "Ai nấy tự lo!"
  natural_disaster.5101.b.tt.success: "Ngài sống sót, vừa đủ"
  natural_disaster.5101.b.tt.failure: "Ngài chết"
  natural_disaster.5101.b.tt.at_risk_character_duel: "[at_risk_character.GetFirstNameNoTooltip] có thể chết"
  natural_disaster.5101.c: "Ta ép [at_risk_character.GetHerHim] qua, biết mình sẽ chịu đòn."
  natural_disaster.5101.d: "Ta đẩy [at_risk_character.GetTitledFirstNameNoTooltip] sang một bên và trốn thoát."
  natural_disaster.5102.t.affected: "[situation.GetNameNoTooltip]: Người Sống Sót"
  natural_disaster.5102.t.not_affected: "[situation.GetNameNoTooltip]: Tử Vong"
  natural_disaster.5102.t.second_round: " — Tác Động Thứ Hai"
  natural_disaster.5102.t.third_round: " — Tác Động Thứ Ba"
  natural_disaster.5102.travel: "Đoàn tùy tùng của Ta"
  natural_disaster.5102.army: "Quân đội của Ta"
  natural_disaster.5102.activity: "Người tham dự bên phải Ta"
  natural_disaster.5102.tent: "Lều của Ta"
  natural_disaster.5102.estate: "Dinh thự của Ta"
  natural_disaster.5102.court: "Tòa án của Ta"
  natural_disaster.5102.desc.flood: "bị nước lũ cuốn trôi, vật tư và tài sản bị ngâm trong dòng nước.\n\nTa chật vật vượt dòng, tìm đến vùng đất cao hơn. Nhìn xuống, Ta chứng kiến kết quả và mùi tử khí tràn ngập không khí."
  natural_disaster.5102.desc.earthquake: "bị nghiền nát bởi tòa nhà sập.\n\nTa may mắn né được đống đổ nát và di chuyển tới nơi an toàn hơn. Nhìn xác người xung quanh, nỗi đau kìm lòng Ta."
  natural_disaster.5102.a: "Ta may mắn còn sống."
  natural_disaster.5102.desc_remote.flood: "Vùng đất xôn xao với tin đồn kinh hoàng về [situation.GetNameNoTooltip]. Nước lũ cuốn trôi nhiều người trên khắp vùng bị ảnh hưởng, cả quý tộc và quan lại. Dù Ta không phải chịu thiệt hại nặng nhất, quy mô mất mát vẫn đáng sợ."
  natural_disaster.5102.desc_remote.earthquake: "Vùng đất xôn xao với tin đồn kinh hoàng về [situation.GetNameNoTooltip]. Các sảnh và tháp đổ sập, chôn vùi quý tộc và gia đình họ. Số người chết lớn, kể cả trong giới quý tộc."
  natural_disaster.5111.t: "[situation.GetNameNoTooltip]: Trại Bị Tấn Công"
  natural_disaster.5111.desc.flood: "Không chịu nổi dòng nước dâng, ngựa bắt đầu trượt, kéo theo người cưỡi xuống. Sợ hãi lan tràn khi nhiều thú bị cuốn đi. Chiến binh Ta cũng gặp số phận tương tự, áo giáp nặng từng bảo vệ họ giờ kéo xuống chết đuối.\n\n\"Thương x—!\" [knight.GetName] kêu trước khi miệng bị nước ngạt nhấn xuống."
  natural_disaster.5111.desc.earthquake: "Đất nứt làm nhiều chiến binh vấp ngã xuống vực mới sinh. Người khác bị mắc kẹt hoặc bị đống đổ nát nghiền.\n\nNgựa tội nghiệp của [knight.GetNamePossessive] trúng viên đá rơi vào đầu, chết ngay lập tức. Trong khi [knight.GetNamePossessiveNoTooltip] được may mắn sống sót, đồng đội của [knight.GetHerHis] thì không."
  natural_disaster.5111.a: "Gánh nặng chiến tranh ngày càng nặng nề."
  natural_disaster_army_damaged_title: "[situation.GetType.GetName] Tấn Công Quân Đội"
  natural_disaster_allied_army_damaged_title: "[situation.GetType.GetName] Tấn Công Liên Quân"
  natural_disaster_enemy_army_damaged_title: "[situation.GetType.GetName] Tấn Công Quân Địch"

  natural_disaster.5901.t.earthquake: "[situation.GetNameNoTooltip]: Thịnh Nộ Của Địa Cầu"
  natural_disaster.5901.t.flood: "[situation.GetNameNoTooltip]: Dòng Nước Dâng"
  natural_disaster.5901.desc.earthquake: "Những rung chấn ở [epicenter_county.GetNameNoTier] đạt cực điểm, tàn phá vùng đất. Nhà cửa và công trình lật ngược hàng loạt, nhiều người cố chạy bị đè bởi đống đổ nát.\n\nSự phá hủy tạo chuỗi sự kiện thảm khốc, với cháy nổ và bất ổn dân sự bùng phát. Những người dũng cảm cứu người dưới đống đổ nát, chỉ để mất mạng vì khói và lửa khắp [epicenter_county.GetTierAsNameNoTooltip]."
  natural_disaster.5901.desc.flood: "Nước chảy xiết qua phố và ngõ của các thị trấn ven [river_region.GetNameNoTooltip], cuốn theo xác người vô tội. Một số cố gắng lội qua, chỉ để bị nuốt chửng.\n\nNước lũ thấm xuống sàn nhà, làm gỗ ướt, gây mục nát sau này. Cây trồng bị nghiền nát bởi dòng nước xiết."
  natural_disaster.5901.a.earthquake: "[epicenter_county.GetNameNoTierNoTooltip] sẽ bị tàn phá."
  natural_disaster.5901.a.flood: "Sự san bằng từ [river_region.GetNameNoTooltip] là không tránh khỏi."
  natural_disaster.5902.desc: "Tin tức từ thảm họa gần đây thật u ám, dân chúng rối loạn. Các lãnh đạo vùng lân cận theo dõi tỉ mỉ, đánh giá mức độ tàn phá.\n\nPhải nỗ lực kiểm soát khủng hoảng và cứu lấy những gì có thể. Ngồi yên không phải là lựa chọn khôn ngoan."

 # RECOVERY
  natural_disaster.6901.t: "[situation.GetNameNoTooltip]: Hậu Quả"
  natural_disaster.6901.desc.flood: "Cuối cùng, mực nước của [river_region.GetNameNoTooltip] đã trở lại bình thường. Những vũng nước sâu vẫn còn rải rác trên đất, nhưng mặt trời đã chiếu sáng rực rỡ, sớm thôi lượng nước thừa sẽ rút hết khỏi mặt đất."
  natural_disaster.6901.desc.earthquake: "Mặt đất trở nên yên lặng, và đất tại [epicenter_county.GetNameNoTier] không còn rung chuyển. Nơi từng là một [epicenter_county.GetTierAsNameNoTooltip] phồn thịnh giờ chỉ còn là đống đổ nát, chỉ còn vài tòa nhà đứng vững."
  natural_disaster.6901.desc: "\n\nCảm giác nhẹ nhõm hiện hữu, nhưng không thể phủ nhận vùng đất này giờ chỉ còn là cái bóng của chính nó. Sự tàn phá này sẽ được nhắc lại nhiều năm, ám ảnh linh hồn những người sống sót."
  natural_disaster.6901.a: "Con đường để khôi phục trật tự còn dài."
  natural_disaster.6902.desc: "Quý tộc và dân thường đều vui mừng khi [situation.GetNameNoTooltip] kết thúc. Niềm vui ngắn ngủi, vì tác động của thảm họa sắp lộ diện. Những nỗ lực đang được triển khai để khôi phục những gì đã mất và an ủi những nạn nhân của sự hỗn loạn."
  natural_disaster.6902.a: "Hy vọng các nỗ lực này đủ hiệu quả."
  natural_disaster.6911.t: "[situation.GetNameNoTooltip]: Bộ Trưởng Gửi Hỗ Trợ"
  natural_disaster.6911.desc: "[minister_helper.GetName], trợ lý của [minister.GetTitledFirstName], khảo sát hiện trường của [situation.GetNameNoTooltip]\n\n""Xin chia buồn, [ROOT.Char.GetNameNoTooltip]. Tôi được [minister.GetTitledFirstNameNoTooltip] phái đến đây để giúp bạn giải quyết tình hình. Bộ sẽ làm mọi thứ cần thiết, vì [minister.GetTopLiege.GetTitledFirstName] mong muốn một sự hồi phục nhanh chóng."""
  natural_disaster.6911.minister_chancellor: ""Tôi vinh dự nhận ân huệ từ [minister.GetHerHis]."""
  natural_disaster.6911.minister_censor: ""Chống tham nhũng là nhiệm vụ của tôi."""
  natural_disaster.6911.minister_grand_marshal: ""Tôi cần duy trì trật tự."""
  natural_disaster.6911.minister_of_personnel: ""Tôi sẽ là cánh tay mở rộng quyền lực của [minister.GetTitledFirstNamePossessiveNoTooltip]."""
  natural_disaster.6911.minister_of_revenue: ""Cần giảm thuế.""
  natural_disaster.6911.minister_of_rites: ""Những lời cầu nguyện sẽ giúp nhiều.""
  natural_disaster.6911.minister_of_war: ""Tăng cường phòng thủ sẽ ngăn thảm họa tiếp theo.""
  natural_disaster.6911.minister_of_justice: "$natural_disaster.6911.a.minister_censor$"
  natural_disaster.6911.minister_of_works: ""Di dời nạn nhân là ưu tiên hàng đầu.""
  natural_disaster.6911.a: ""Chi phí cao, tôi cần kho bạc.""
  natural_disaster_recovery_minister_of_revenue_tt: "Ngăn chặn mọi [modifiers|E] tiêu cực về [tax|E] từ [great_project_contributions|E] tại [great_project.GetName]"
  natural_disaster_recovery_minister_of_works_tt: "Ngăn tất cả [modifiers|E] [domain|E] tiêu cực từ [contributions|E] trong [great_project.GetName]"
  minister_has_aidee_to_send_tt: "Sử dụng [GetCourtPositionType( 'minister_bureaucrat_court_position' ).GetName]"

 # WARNING
  natural_disaster.7001.t: "[epicenter_county.GetNameNoTierNoTooltip]: Rung Chấn Hư Thánh"
  natural_disaster.7001.desc: "[epicenter_county.GetProvince.GetCounty.GetFaith.HouseOfWorshipPlural|U] và các đền thờ ở [epicenter_county.GetNameNoTier] bắt đầu sụp đổ do động đất, gieo sợ hãi ngay cả những tín đồ trung thành nhất. Rõ ràng rung chấn sẽ không dừng lại và càng lúc càng dữ dội."
  natural_disaster.7001.a: "Thảm họa này đòi hỏi Ta #EMP toàn tâm#! chú ý!"
  natural_disaster.7001.a.tt: "Ngài sẽ bước vào chế độ nhiếp chính cho đến khi thảm họa đạt tới giai đoạn Hồi Phục $game_concept_situation_phase$."
  natural_disaster.7001.a.tt.already_in_diarchy: "Ngài đã [power_sharing|E] và không cần thay đổi gì để đáp ứng gánh nặng thêm này."
  natural_disaster.7001.a.tt.discount: "Đóng góp vào các dự án phục hồi [disaster|E] sẽ giảm #v 10%#! khi Ngài đang [power_sharing|E]"
  natural_disaster.7001.b: "Chúng ta phải lo cho chính mình!"
  natural_disaster.7001.b.tt: "Ngài có thể $isolate_family_decision$"
  natural_disaster.7001.c: "Cầu xin [ROOT.Char.GetFaith.HighGodName] giúp chúng ta!"
  natural_disaster.7011.t: "[epicenter_county.GetNameNoTierNoTooltip]: Động Vật Trốn Chạy"
  natural_disaster.7011.desc: "Động vật ở [epicenter_county.GetNameNoTier] bắt đầu di cư ồ ạt, khi rung chấn dưới môi trường sống đe dọa sự sinh tồn của chúng. Chim bắt đầu di cư sớm, đàn chim che mất ánh sáng trên bầu trời.\n\nMột số người đi theo đường đi của động vật để tìm nơi an toàn, nhưng nhiều cư dân vẫn ở nhà, hy vọng rung chấn sẽ qua."
  natural_disaster.7011.d: "Thiên nhiên tuân theo dấu hiệu, còn chúng ta thì thờ ơ."
  natural_disaster.7021.t: "[river_region.GetNameNoTooltip]: Bờ Sông Dâng Cao"
  natural_disaster.7021.desc: "Gió đẩy nước từ nơi khác vào [river_region.GetNameNoTooltip] gần đó, làm bờ sông vượt quá giới hạn. Một số người lấy nước dư thừa cho nhu cầu riêng, nhưng nước vẫn tiếp tục tràn.\n\nVùng nông thôn xung quanh biến thành đầm lầy, bùn bám trên các tòa nhà quanh thị trấn."
  natural_disaster.7021.a: "Những dòng nước này không thể kiểm soát."
  natural_disaster.7031.t: "[river_region.GetNameNoTooltip]: Mưa Xối Xả"
  natural_disaster.7031.desc: "Một trận mưa cần thiết rơi xuống vùng đất gần [river_region.GetNameNoTooltip], đảm bảo mùa màng sẽ tiếp tục như dự kiến.\n\nMặc dù đất đã đủ nước, mưa càng lúc càng lớn và không có dấu hiệu dừng lại. Mặt trời biến mất, và sông bắt đầu tràn ra vùng nội địa."
  natural_disaster.7031.a: "Nguyện trời thương xót."

 # JOIN
  natural_disaster.8001.t.earthquake: "[epicenter_county.GetNameNoTierNoTooltip]: Rung Động Từ Sâu"
  natural_disaster.8001.t.flood: "[river_region.GetNameNoTooltip]: Mực Nước Cao"
  natural_disaster.8001.desc.earthquake: "Tin tức đến Ta về một sự biến động lớn ở [epicenter_county.GetName]. Mặt đất dưới vùng này rung chuyển, xuất hiện nứt trên bề mặt. Những công trình nhỏ bắt đầu đổ sập.\n\nDân cư [epicenter_county.GetTierAsNameNoTooltip] trở nên bất an, cản trở nỗ lực tổ chức. Dù họ hoảng loạn, Ta phải cố gắng giảm thiểu thiệt hại và chuẩn bị cho sự tàn phá sắp tới."
  natural_disaster.8001.desc.flood: "Nước từ [river_region.GetName] dâng cao, làm ướt đất xung quanh. Mặc dù có thể giúp tăng vụ mùa, nước vẫn tiếp tục dâng không ngừng.\n\nKhôn ngoan hơn là tạm ngưng mọi công trình ở khu vực cho đến khi lũ rút, và đảm bảo càng nhiều người càng tốt được an toàn."
  natural_disaster.8001.a: "Điều này chỉ có thể có một nghĩa..."
  natural_disaster.8001.a.tt.earthquake: "Một [earthquake|E] sẽ sớm xảy ra ở [epicenter_county.GetNameNoTier]"
  natural_disaster.8001.a.tt.flood: "Sông [river_region.GetName] sẽ sớm [flood|E]"
  natural_disaster.8002.t: "[situation.GetNameNoTooltip]: Tác Động Liên Tục"
  natural_disaster.8002.desc.earthquake: "[epicenter_county.GetName] đang bị tàn phá bởi một trận động đất dữ dội. Có khả năng [epicenter_county.GetTierAsNameNoTooltip] sẽ bị phá hủy và dân cư phải di dời.\n\n"
  natural_disaster.8002.desc: "Nguồn lực hỗ trợ nạn nhân và khôi phục vùng đất đang được tích trữ, nhưng chưa thấy toàn bộ kết quả của thảm họa."
  natural_disaster.8002.desc.flood: "Sông [river_region.GetName] đã tràn, nước ngấm vào các khu định cư lân cận. Nhiều tòa nhà bị bỏ hoang, và nhiều khả năng mùa màng sẽ thất bại."
  natural_disaster.8002.a: "Tình huống nghiêm trọng."
  natural_disaster.8002.a.tt: "Có [flood|E] đang diễn ra từ [river_region.GetName]."
  natural_disaster.8002.a.tt.earthquake: "Có [earthquake|E] đang xảy ra ở [epicenter_county.GetNameNoTier]."
  natural_disaster.8003.t: "[situation.GetNameNoTooltip]: Hậu Quả"
  natural_disaster.8003.desc.earthquake: "Công dân chạy trốn bị tòa nhà đổ sập nghiền nát, đống đổ nát chặn lối thoát, cháy nổ và bọn cướp...\n\nChỉ là một phần nhỏ trong những thảm cảnh mà cư dân [epicenter_county.GetNameNoTier] chứng kiến trước trận động đất gần đây."
  natural_disaster.8003.desc.flood: "Gia đình bị dòng nước cuốn, mùa màng mất trắng, nhà cửa ngập nước đục...\n\nĐó là số phận của vùng xung quanh [river_region.GetName] sau trận lũ."
  natural_disaster.8003.desc_outro: "\n\nCác nỗ lực cứu trợ đang tiến hành, nhưng thiệt hại có thể còn kéo dài trong khu vực."
  natural_disaster.8003.a: "Chúng ta phải tái thiết."
  natural_disaster.8003.a.tt: "Đã xảy ra [flood|E] từ [river_region.GetName]."
  natural_disaster.8003.a.tt.earthquake: "Đã xảy ra [earthquake|E] ở [epicenter_county.GetNameNoTier]."

