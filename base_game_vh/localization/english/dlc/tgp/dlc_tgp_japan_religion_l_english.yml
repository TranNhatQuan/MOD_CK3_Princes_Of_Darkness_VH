l_english:
 ### TENETS
  tenet_pure_land_name: "Luân Hồi Chính Đạo"
  tenet_pure_land_desc: "Ở đây, trong #EMP paścima-kāla#! — Thời Đại Sa Đọa của Pháp — giàu sang, học vấn, hay dòng dõi cao quý đều không mang lại an ủi. Chỉ những người thật sự sùng kính giới luật của Phật mới có thể tái sinh vào Cõi Tịnh Độ."
  tenet_sohei_name: "Sōhei"
  tenet_no_mind_name: "Tâm Vô Tâm"
  tenet_no_mind_desc: "Tâm mà không có tâm chính là tâm đã đạt được sự chánh niệm chân thật. Một trạng thái được các nghệ nhân, thợ thủ công và võ sĩ rèn luyện, nơi cơ thể phản ứng với mọi thử thách mà không cần suy nghĩ."
  doctrine_parameter_better_artifacts: "[inspirations|E] được tài trợ tạo ra các [artifacts|E] có chất lượng cao hơn"
  doctrine_parameter_less_likely_to_become_infirm: "Các nhân vật ít có khả năng nhận được [trait|E] [GetTrait('infirm').GetName( GetNullCharacter )]"
  tenet_mountain_worship_name: "Sùng Thần Núi"
  tenet_mountain_worship_desc: "Nơi xa làng mạc và nông trại, núi chạm tới tận mây trời. Chính tại những đỉnh và vách đá này, điều thiêng liêng mới thực sự được tìm thấy."
  doctrine_parameter_piety_from_hills_and_mountains_pilgrimages: "Các nhân vật nhận thêm [piety|E] từ các [pilgrimages|E] đến [GetTerrain( 'hills' ).GetName], [GetTerrain( 'mountains' ).GetName] và [GetTerrain( 'desert_mountains' ).GetName]"
  piety_from_hills_and_mountains_pilgrimages_tt: "Từ [core_tenet|E] [GetFaithDoctrine('tenet_mountain_worship').GetBaseName]: [piety_i]#P [THIS.ScriptValue('medium_piety_gain')]#!"
 ### DOCTRINE PARAMETERS
  doctrine_parameter_peasant_and_populist_factions_more_common: "Các [factions|E] Nông dân và Dân túy phổ biến hơn và mạnh mẽ hơn"
  doctrine_parameter_children_less_likely_to_be_burdened: "[children|E] ít có khả năng nhận [trait|E] [GetTrait('burdened').GetName( GetNullCharacter )]"
