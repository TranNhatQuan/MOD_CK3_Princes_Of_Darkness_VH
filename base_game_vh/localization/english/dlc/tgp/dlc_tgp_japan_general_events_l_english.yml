l_english: 
  tgp_japan_general.8800.t: "[ROOT.Char.GetConfederation.GetName] Mở Rộng"
  tgp_japan_general.8800.desc: "Lực lượng của ta có thể tự hào, đã phục vụ ta và [attacker.GetConfederation.GetName] tốt trong cuộc chiến với [war_loser.GetTitledFirstName]. [target_title.GetName] bị tước bỏ, và thuộc quyền phân phát của ta.\n\nThận trọng là cần thiết để đảm bảo những vùng đất này thuộc về một thủ hạ đáng tin cậy và trung thành, người sẽ nghe theo lời ta, và có thể được triệu tập trong tương lai."
  tgp_japan_general.8800.a: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_1') )] của ta, [family_1.GetFirstNameNoTooltip], sẽ cai trị tốt."
  tgp_japan_general.8800.b: "Nó sẽ thuộc về [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_2') )] của ta, [family_2.GetFirstNamePossessiveNoTooltip]."
  tgp_japan_general.8800.c: "Hãy để nó rơi vào tay [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_3') )], [family_3.GetFirstNameNoTooltip]."
  tgp_japan_general.8800.e: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_1') )] của ta, [fallback_1.GetFirstNameNoTooltip], sẽ chứng minh bản thân [fallback_1.GetHerselfHimself]."
  tgp_japan_general.8800.f: "Ta tin tưởng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_2') )] của ta, [fallback_2.GetFirstNameNoTooltip]."
  tgp_japan_general.8800.g: "Người xứng đáng là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallback_3') )] của ta, [fallback_3.GetFirstNameNoTooltip]."
  tgp_japan_general.8800.h: "Ta vẫn chưa quyết định..."
  tgp_japan_general_8800_custom: "Tất cả ứng viên khác"
  tgp_japan_general.8800.cadet_tt: "Sẽ lập ra một [house|E] mới"
  new_ceremonial_liege_message_title: "[ceremonial_liege.GetTitleAsNameNoTooltip] Lên Ngai"
  new_ceremonial_liege_message_effect: "[ceremonial_liege.GetTitledFirstName] đã đăng quang [ceremonial_title.GetDefinitiveName|l]"
  tgp_japan_general.9100.t: "Một [ROOT.Char.GetTitleAsNameNoTooltip] Mới"
  tgp_japan_general.9100.shoulders: "trách nhiệm lãnh đạo [title.GetTierAsNameNoTooltip] giờ đặt trên vai ta."
  tgp_japan_general.9100.desc_murdered:0 "Sau cái chết bi thảm và #EMP đáng tiếc#! của [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
  tgp_japan_general.9100.desc_dead:0 "Với sự ra đi của [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
  tgp_japan_general.9100.desc_joko: "Với việc thoái vị của [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] $tgp_japan_general.9100.shoulders$"
  tgp_japan_general.9100.desc_alive:0 "Bây giờ là trách nhiệm của ta để dẫn dắt [title.GetTierAsNameNoTooltip] rộng lớn mà [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] để lại."
  tgp_japan_general.9100.desc: "I stand before my vassals, adjust my new crown, and [ROOT.Char.Custom('quirk_pos_personal_present')]. Oh, the things that I will accomplish!"
  tgp_japan_general.9100.a: "Vạn tuế [ROOT.Char.GetTitleAsNameNoTooltip]!"
  tgp_japan_general.9120.t: "Đằng Sau Ngai Vàng"
  tgp_japan_general.9120.desc: "Với sự ra đi của [previous_holder.GetTitledFirstNamePossessive] và ảnh hưởng ngày càng tăng của ta, các công việc của nhà nước cuối cùng đã phần lớn nằm dưới quyền kiểm soát của hoàng gia một lần nữa.\n\nTheo phong tục, nhiều người mong đợi ta cạo đầu và trao lại ngai vàng cho người kế vị, [emperor_player_heir.GetFirstName], vì dòng dõi đã an toàn, gạt bỏ những trách nhiệm nghi lễ của một [ROOT.Char.GetTitleAsNameNoTooltip] để ta có thể tập trung vào các chính trị cấp bách hơn trong ngày."
  tgp_japan_general.9120.a: "Đã đến lúc vào ẩn cư..."
  tgp_japan_general.9120.b: "#EMP Ta#! là [ROOT.Char.GetTitleAsNameNoTooltip], và #EMP Ta#! sẽ cai trị!"
  tgp_japan_general.9300.t: "$game_concept_imperial_policy$:"
  tgp_japan_general.9300.t.defense_mobilization_law: "$tgp_japan_general.9300.t$ $defense_mobilization_law$"
  tgp_japan_general.9300.t.disarmament_law: "$tgp_japan_general.9300.t$ $disarmament_law$"
  tgp_japan_general.9300.t.isolation_law: "$tgp_japan_general.9300.t$ $isolation_law$"
  tgp_japan_general.9300.t.fortification_initative_law: "$tgp_japan_general.9300.t$ $fortification_initative_law$"
  tgp_japan_general.9300.t.imperial_expansion_law: "$tgp_japan_general.9300.t$ $imperial_expansion_law$"
  tgp_japan_general.9300.t.manor_reform_law: "$tgp_japan_general.9300.t$ $manor_reform_law$"
  tgp_japan_general.9300.t.bandit_crackdown_law: "$tgp_japan_general.9300.t$ $bandit_crackdown_law$"
  tgp_japan_general.9300.t.religious_reform_law: "$tgp_japan_general.9300.t$ $religious_reform_law$"
  tgp_japan_general.9300.restored_emperor: "Bên cạnh các quan viên và cung tần, ta nghiêm nghị giám sát các ghi chép và con dấu, khi họ hoàn thiện chính sách mới cho tất cả [liege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  tgp_japan_general.9300.liege: "Dưới ánh nhìn trang nghiêm của [ceremonial_liege.GetTitledFirstName], ta ghi và đóng dấu những chi tiết cuối cùng của sắc lệnh, một chính sách mới cho tất cả [liege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  tgp_japan_general.9300.ceremonial_liege: "Bên cạnh các quan viên và cung tần, ta nghiêm nghị giám sát [liege.GetTitledFirstName] khi [liege.GetSheHe] ghi và đóng dấu, hoàn thiện chính sách mới cho tất cả [liege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  tgp_japan_general.9300.vassal_ceremonial: "Tất cả đều chờ thông báo từ cung điện hoàng gia tại [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], nơi hôm nay [liege.GetTitledFirstName] sẽ công bố chính sách mới nhân danh [ceremonial_liege.GetTitledFirstName]."
  tgp_japan_general.9300.vassal: "Tất cả đều chờ thông báo từ cung điện hoàng gia tại [liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], nơi hôm nay [liege.GetTitledFirstName] sẽ công bố chính sách mới cho tất cả [liege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
  tgp_japan_general.9300.defense_mobilization_law: "#EMP "[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] đang bị các mối đe dọa mới tấn công, nếu đất nước muốn mạnh mẽ và tự do, người dân phải chuẩn bị cho chiến tranh!"#!"
  tgp_japan_general.9300.disarmament_law: "#EMP "[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] bị bao quanh bởi xung đột và bất công, bạo lực phải bị kiềm chế, và vũ khí bị tịch thu từ những người không có lý do!"#!"
  tgp_japan_general.9300.isolation_law: "#EMP "[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] chịu ảnh hưởng xấu từ người ngoài, những ý tưởng và lợi ích gây chia rẽ, họ phải bị trục xuất!"#!"
  tgp_japan_general.9300.fortification_initative_law: "#EMP "Nguy cơ chiến tranh bao trùm [liege.GetPrimaryTitle.GetNameNoTierNoTooltip], vì lợi ích chung chúng ta phải xây dựng phòng thủ vững chắc để chuẩn bị cho điều tồi tệ nhất."#!"
  tgp_japan_general.9300.imperial_expansion_law: "#EMP "Trong lúc cần, [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] đã công bằng mở rộng biên cương đất nước — một lần nữa chúng ta phải tiến lên!"#!"
  tgp_japan_general.9300.manor_reform_law: "#EMP "Sự thịnh vượng lớn của các lãnh chúa điền trang gây tổn hại cho [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] và dân chúng, tài sản của họ phải bị hạn chế!"#!"
  tgp_japan_general.9300.bandit_crackdown_law: "#EMP "Sự tự mãn đã dẫn đến cướp bóc và đạo đức suy đồi, và dân chúng phải chịu khổ vì điều đó. Trật tự phải được khôi phục vì lợi ích của [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!"#!"
  tgp_japan_general.9300.religious_reform_law: "#EMP "Cuộc sống của các linh mục và dân chúng đang xung đột. Những giáo lý cũ phải được xem xét nếu chúng ta muốn đổi mới linh hồn [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!"#!"
  tgp_japan_general.9300.outro: "Sứ giả sẽ sớm được phái đi đến mọi ngóc ngách của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip], loan báo sắc lệnh của [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip]."
  tgp_japan_general.9300.a: "Đúng vậy."
  tgp_japan_general.9300.a.disarmament_soryo: "$epidemic_events.1061.a$"

#Eradicate CB lose
  tgp_japan_soryo_eradicate_cb_heir_move_manor_to_savior_tt: "[loser_heir.GetShortUIName] sẽ chuyển [manor|E] của [loser_heir.GetHouse.GetName] tới [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
  tgp_japan_soryo_eradicate_cb_heir_move_to_savior_tt: "Ngài sẽ chuyển [manor|E] của [loser.GetHouse.GetName] tới [savior.GetCapitalLocation.GetBaronyNameExplicitly]"
  tgp_japan_soryo_eradicate_cb_heir_move_to_cap_tt: "Ngài sẽ chuyển [manor|E] của [loser.GetHouse.GetName] tới [loser_heir.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitly]"
  eradicated_my_house_opinion: "Tiêu diệt Gia tộc của Ta"
  every_house_member_mad: "Mọi thành viên [house|E] còn sống"
  tgp_japan_general.9550.t: "Bị Dồn Vào Chỗ Thịt"
  tgp_japan_general.9550.desc.intro.a: "Cuộc chiến này, do ta khơi mào, lợi ích, sự diệt vong của gia tộc ta."
  tgp_japan_general.9550.desc.intro.b: "Ai biết mối thù của chúng ta với [winner.GetHouse.GetNameNoTooltip] lại dẫn đến thế này?"
  tgp_japan_general.9550.desc: "Tiếng hét của chiến binh và quan thần của ta càng lúc càng gần. Tiếng kêu tuyệt vọng hứa hẹn số phận sắp ập xuống tất cả [ROOT.Char.GetHouse.GetName]."
  tgp_japan_general.9550.desc.alone: "\n\nTa co rúm, một mình."
  tgp_japan_general.9550.desc.fam: "\n\nGia tộc và ta quây quần bên nhau."
  tgp_japan_general.9550.desc.end: "Mỗi giây trôi qua, những con cáo lại gần những con gà bị nhốt mà chúng ta đã trở thành.\n\nLàm sao chúng ta [ROOT.Char.GetHouse.GetNameNoTooltip] đối mặt khoảnh khắc cuối cùng?"
  every_close_family_house_member_in_court: "Ngài và mọi thành viên [spouse|E] và [close_family|E] [house|E] trong [loser.GetShortUINamePossessive] [court|E]"
  every_house_member_in_court: "[loser.GetShortUINamePossessive] các [spouses|E] và mọi thành viên [house|E] trong [loser.GetHerHis] [court|E]"
  is_killed_by_you_and_you_kill_self: "@death_icon! sẽ tự sát để tránh ô nhục dưới tay [winner.GetShortUIName]"
  tgp_japan_general.9550.a.alone: "Ta sẽ không chết một cách nhục nhã!"
  tgp_japan_general.9550.a.alone.flavor: "Ta chết bởi chính tay ta"
  tgp_japan_general.9550.a.fam: "Chúng ta sẽ không chết nhục nhã!"
  tgp_japan_general.9550.a.fam.flavor: "Chúng ta sẽ chết bởi chính tay ta! Người thừa kế [loser_heir.GetShortUIName] sẽ chạy đến vùng đất của [savior.GetName] đồng cảm"
  tgp_japan_general.9550.b: "Hãy dùng đôi cánh để thoát khỏi chuồng này!"
  tgp_japan_general.9550.b.success: "Ngài thoát khỏi sự tiêu diệt thành công."
  tgp_japan_general.9550.b.failure: "Ngài thất bại trong việc thoát khỏi sự tiêu diệt."
  tgp_japan_general.9550.b.flavor: "Chúng ta sẽ tái tập hợp và một ngày nào đó trả thù [winner.GetHouse.GetNameNoTooltip]"
  tgp_japan_general.9550.c: "Chúng ta phải đánh cược vào lòng thương xót của con cáo."
 #Eradicate CB win
  tgp_japan_general.9551.t: "Tiêu diệt [loser.GetHouse.GetNameNoTooltip]"
  tgp_japan_general.9551.desc.intro: "\"Mặc dù là phạm thượng, ta ước được tái sinh thành chính mình, để ta có thể giết ngươi ở kiếp sau, [winner.GetFirstNameNoTooltip]—\"\n\n[loser.GetTitledFirstName] lẩm bẩm, trước khi đầu của [loser.GetHerHis] lăn xuống chiến trường, miệng [loser.GetHerHis] vẫn thầm nguyền rủa ta. Một cái chết suy đồi về mặt tâm linh cũng như không vinh dự. Cái xác không đầu [loser.GetHerHis|U] nằm buông thõng như một con gà chờ được vặt lông. Cái đống thịt vụn nát này không còn là mối đe dọa, không còn là con người.\n\n[loser_region.GetBaseNameNoTierNoTooltip] sạch sẽ hơn khi vắng bóng [loser.GetHouse.GetName]..."
  tgp_japan_general.9551.desc.alt.intro: "Ôi [loser.GetHouse.GetName] gian xảo! Trước khi ta bắt được [loser.GetName], [loser.GetSheHe]"
  tgp_japan_general.9551.desc.alt.suicide: "tự sát cùng những người gần gũi nhất."
  tgp_japan_general.9551.desc.alt.escape: "trốn sang vùng đất của [savior.GetName]."
  tgp_japan_general.9551.desc.alt.outro: "\n\nMay mắn thay vẫn còn [loser.GetHouse.GetNameNoTooltip] khác để tiêu diệt."
  tgp_japan_general.9551.a: "Đầu họ sẽ trở thành tín hiệu báo sự tiêu diệt!"
  tgp_japan_general.9551.a.flavor: "Gương mặt xấu xa của họ sẽ trang trí trên cọc ngoài điền trang cũ của họ"
  rival_eradicated_modifier: "Gia tộc Đối thủ Bị Tiêu Diệt"
  rival_eradicated_modifier_desc: "Gia tộc [house|E] của Ngài thấy hợp lý để ra chiến tranh và xóa bỏ dòng họ [rival|E] [house|E]. Trong khi người khác phán xét, nỗi sợ khiến họ im lặng."
  house_eradicated_modifier: "Gia tộc Bị Tiêu Diệt"
  house_eradicated_modifier_desc: "Gia tộc [house|E] của Ngài gần như bị xóa sạch bởi [rival|E] [house|E]. Không ai sợ Ngài. Sự xấu hổ và thù hận này là nhiên liệu hứa hẹn cho báo thù."
  house_eradicated_suicide_modifier: "Gia tộc Bị Tiêu Diệt"
  house_eradicated_suicide_modifier_desc: "Trước khi gia tộc [house|E] của Ngài gần như bị xóa sạch bởi [rival|E] [house|E], họ đã tự sát để tránh ô nhục. Thù hận còn lại là nhiên liệu hứa hẹn cho báo thù."

  tgp_house_blocs.1001.t: "[bloc_leader.GetConfederation.GetName]: Triệu tập Chiến Binh"
  tgp_house_blocs.1001.desc: "Lãnh đạo của Gia tộc [bloc_leader.GetHouse.GetBaseName] kiên cường và táo bạo như thường lệ, và [bloc_leader.GetTitledFirstName] giờ tìm cách tập hợp lực lượng chống lại [defender.GetName].\n\nKhông ai đứng sau hoặc chống lại [bloc_leader.GetConfederation.GetName] có thể phớt lờ sức mạnh của chúng ta, và sức mạnh đó đến từ sự đoàn kết. Không ngạc nhiên khi thấy các chiến binh [ROOT.Char.GetHouse.GetBaseNameNoTooltip] nằm trong hàng ngũ của [bloc_leader.GetHouse.GetBaseNameNoTooltip]."
  tgp_house_blocs.1001.a: "Chúng ta đứng cùng nhau!"
  tgp_house_blocs.1001.b: "Đây không phải là chiến tranh của ta."
 
