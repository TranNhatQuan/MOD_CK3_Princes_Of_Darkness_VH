l_english:
  tgp_ceremonial_liege_events.0001.t: "Ấn Tín Nhầm Lẫn"
  tgp_ceremonial_liege_events.0001.desc: "[councillor.GetName] đã lỡ gửi đi những chỉ thị mang cả ấn tín của ta lẫn của [opposing_power.GetNamePossessive]. \"Đó chỉ là một sai sót thành thật,\" [councillor.GetSheHe] van nài. \"Nhưng ngài cũng biết đấy, tin đồn và lời dối trá lan khắp triều đình nhanh đến mức nào...\"\n\nThu hồi các chỉ thị ấy có thể sẽ rất tốn kém, nhưng nếu công khai tuyên bố đó là sai lầm thì lại vô cùng mất mặt."
  tgp_ceremonial_liege_events.0001.a_liege: "Nhắc họ nhớ ai mới là người thực sự cai trị."
  tgp_ceremonial_liege_events.0001.a_regent: "Phải sửa chuyện này trước khi [opposing_power.GetFirstNameNoTooltip] nhìn thấy."
  tgp_ceremonial_liege_events.0001.b: "Cứ để vậy đi. Bề ngoài thì có hại gì?"
  tgp_ceremonial_liege_events.0001.b_a: "Những chỉ thị này khẳng định quyền uy của Ngài"
  tgp_ceremonial_liege_events.0001.b_b: "Sự việc dần bị lãng quên"
  tgp_ceremonial_liege_events.0001.b_c: "[opposing_power.GetNameNoTooltip] giành thêm quyền lực"

  tgp_ceremonial_liege_events.0010.t: "Gánh Nặng Thực Sự"
  tgp_ceremonial_liege_events.0010.desc: "\"Phu quân/phu nhân của ta!\" [spouse.GetName] kêu lên khi bước vào phòng ngủ. \"Sắc mặt của ngài trông tái quá, ta thật lo lắng.\"\n\nSự lo lắng của [spouse.GetFirstNamePossessiveNoTooltip] quả thật không sai. Những giờ trong ngày dường như dài hơn, và gánh nặng của vương miện đè nặng lên ta hơn bao giờ hết.\n\n\"Nếu ngài quá mệt mỏi, có lẽ [opposing_power.GetName] có thể thay ngài cai trị một thời gian.\" [spouse.GetFirstNameNoTooltip] đề nghị."
  tgp_ceremonial_liege_events.0010.a: "Ngươi nói đúng, ta không thể làm tất cả một mình."
  tgp_ceremonial_liege_events.0010.b: "Không, không, ta chỉ cần xuất hiện ít hơn ở triều đình."
  tgp_ceremonial_liege_events.0010.b_a: "Sự tách biệt giúp ích rất nhiều"
  tgp_ceremonial_liege_events.0010.b_b: "Tách biệt cũng chẳng giúp được bao nhiêu"
  tgp_ceremonial_liege_events.0010.c: "Tuyệt đối không! Ta là chủ nhân của vương quốc này."
  tgp_ceremonial_liege_events.0010.d: "[opposing_power.GetSheHe|U] đã bảo ngài nói điều đó, đúng không?"
  tgp_ceremonial_liege_events.0010.d_desc: "Ngài buộc tội [spouse.GetFirstNameNoTooltip] cấu kết với [opposing_power.GetFirstNameNoTooltip]"
  tgp_ceremonial_liege_events.0010.tt.success: "Ngài tìm thấy bằng chứng thực sự về sự phản bội của [spouse.GetHerHis]"
  tgp_ceremonial_liege_events.0010.tt.failure: "Lời buộc tội của Ngài hóa ra là sai"

  tgp_ceremonial_liege_events.0020.t: "Một Buổi [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip] Nghi Lễ"
  tgp_ceremonial_liege_events.0020.desc: "[opposing_power.GetName] đang bận rộn với một buổi [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l], mà nghe nói ta thậm chí còn không được mời! Trong khi [opposing_power.GetSheHe]"
  tgp_ceremonial_liege_events.0020.desc_feast: "uống rượu thâu đêm, chia sẻ câu chuyện với gia đình và bằng hữu,"
  tgp_ceremonial_liege_events.0020.desc_hunt: "tận hưởng cảm giác hồi hộp của cuộc săn,"
  tgp_ceremonial_liege_events.0020.desc_pilgrimage: "trở nên gần gũi hơn với [opposing_power.GetFaith.HighGodName] trong các chuyến đi của [opposing_power.GetHerHis] ,"
  tgp_ceremonial_liege_events.0020.desc_festival: "thể hiện thẩm quyền của [opposing_power.GetHerHis] với một lễ hội,"
  tgp_ceremonial_liege_events.0020.desc_end: "ta vẫn bị trói buộc bởi trách nhiệm.\n\nDù tình hình chưa phải quá tệ, nhưng một cơ hội đang mở ra..."
  tgp_ceremonial_liege_events.0020.a: "Có lẽ đã đến lúc ta tổ chức một buổi [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l] của riêng mình."
  tgp_ceremonial_liege_events.0020.a_desc: "Ngài cố gắng vượt mặt [opposing_power.GetFirstNameNoTooltip] bằng [activity|E] của riêng mình:\n$BULLET$Ngài sẽ nhận #P giảm 15%#! chi phí tổ chức [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l]\n$BULLET$Nếu buổi [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l] tiếp theo của Ngài thành công, Ngài sẽ nhận [prestige|E] và [opposing_power.GetFirstNameNoTooltip] sẽ mất một phần"
  tgp_ceremonial_liege_events_0020_discount_desc: "Tổ Chức Để Đáp Trả"
  tgp_ceremonial_liege_events.0020.b: "Ta chắc rằng [opposing_power.GetFirstNameNoTooltip] sẽ không phiền nếu ta thay đổi một vài thứ..."
  tgp_ceremonial_liege_events.0020.b.tt.desc: "Ngài cố gắng làm suy yếu quyền lực của [opposing_power.GetFirstNamePossessiveNoTooltip]"
  tgp_ceremonial_liege_events.0020.b.tt.success: "Ngài thành công trong việc giành thêm quyền lực trước [opposing_power.GetFirstNameNoTooltip]"
  tgp_ceremonial_liege_events.0020.b.tt.failure: "Sự can thiệp của Ngài chỉ khiến xung đột gia tăng"
  tgp_power_undermined_modifier_tt: "[GetModifier('tgp_power_undermined_modifier').GetNameWithTooltip]: #P +25#!"
  tgp_ceremonial_liege_events.0020.c: "Gửi tới [opposing_power.GetHerHim] lời chúc tốt đẹp nhất của ta."

  tgp_ceremonial_liege_events.0030.t: "Tấu Chương Của Một Học Giả"
  tgp_ceremonial_liege_events.0030.desc: "[scholar.GetName] trình bày một bản kiến nghị được viết tốt về lịch sử của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName].\n\nTrong bản kiến nghị,"
  tgp_ceremonial_liege_events.0030.regent: "[opposing_power.GetFirstName] được nhắc đến thường xuyên và chi tiết, với [scholar.GetFirstNameNoTooltip] cẩn thận ghi rõ về gia tộc của [opposing_power.GetFirstNamePossessiveNoTooltip], [opposing_power.GetHouse.GetName].\n\nVấn đề trở nên rõ ràng khi ta bị mô tả là [ROOT.Char.Custom('InsultAdjective')], còn [opposing_power.GetFirstNameNoTooltip] lại được ca ngợi là rất [ROOT.Char.Custom('ComplimentAdjective')]..."
  tgp_ceremonial_liege_events.0030.liege: "Ta được nhắc đến thường xuyên và chi tiết, với [scholar.GetFirstNameNoTooltip] cẩn thận ghi rõ về gia tộc của ta, [ROOT.Char.GetHouse.GetName].\n\nĐiều thực sự khiến ta chú ý là khi ta được mô tả là [ROOT.Char.Custom('ComplimentAdjective')], còn [opposing_power.GetFirstNameNoTooltip] lại bị gọi là khá [opposing_power.Custom('InsultAdjective')]..."
  tgp_ceremonial_liege_events.0030.a: "Xuất sắc lắm!"
  tgp_ceremonial_liege_events.0030.b: "Hãy sửa lại lời văn của ngươi, [scholar.GetFirstNameNoTooltip]."
  tgp_ceremonial_liege_events.0030.b_desc: "Ngài cố gắng chỉ dẫn [scholar.GetFirstNameNoTooltip] cách viết một bản tấu tốt hơn"
  tgp_ceremonial_liege_events.0030.tt.success: "[scholar.GetFirstNameNoTooltip] sửa lại những sai lầm của [scholar.GetHerHis]"
  tgp_ceremonial_liege_events.0030.tt.failure: "Ngài khiến mọi chuyện tệ hơn"
  tgp_ceremonial_liege_events.0030.c_regent: "Đừng bôi nhọ ta, đồ ngu!"
  tgp_ceremonial_liege_events.0030.c_liege: "Cẩn thận lời nói của ngươi..."
  tgp_ceremonial_liege_events.0030.c_tt: "Ngài khiển trách tác phẩm của [scholar.GetFirstNamePossessiveNoTooltip]"
 
  tgp_ceremonial_liege_events.0040.t: "Vỏ Bọc... Tạm Thời"
  tgp_ceremonial_liege_events.0040.desc: "\"Xin thứ lỗi, [inquirer.Custom2('RelationToMeShort', ROOT.Char)] của ta.\" [inquirer.GetName] thì thầm khi tiến lại gần.\n\n\"Ta đã suy nghĩ về điều này khá lâu, và xin tha lỗi nếu câu hỏi này không thích hợp,\" [inquirer.GetSheHe|U] nói. \"Nhưng tại sao ngài không trừ khử [opposing_power.GetFirstName]? Thật khó coi khi một [ROOT.Char.GetTitleAsNameNoTooltip] lại phải làm con rối cho một [opposing_power.GetTitleAsNameNoTooltip] tầm thường!\""
  tgp_ceremonial_liege_events.0040.a: "Tất cả chỉ là để giữ thể diện thôi, [ROOT.Char.Custom2('RelationToMeShort', inquirer)]..."
  tgp_ceremonial_liege_events.0040.a_desc: "Ngài cố thuyết phục [inquirer.GetHerHim] rằng đây chỉ là vỏ bọc"
  tgp_ceremonial_liege_events.0040.tt.success: "Ngài thuyết phục được [inquirer.GetHerHim]"
  tgp_ceremonial_liege_events.0040.tt.failure: "[inquirer.GetSheHe|U] biết Ngài đang nói dối"
  tgp_ceremonial_liege_events.0040.b: "Mọi chuyện đều có lý do của nó."
  tgp_ceremonial_liege_events.0040.b_desc: "Ngài giải thích cho [inquirer.GetFirstNameNoTooltip] về mục đích của vai trò mà [opposing_power.GetFirstNamePossessiveNoTooltip] đang giữ."
 
