l_english:
  tgp_go_board:0 "Bàn cờ Go May Mắn"
  tgp_go_board_desc:0 "Vật tiêu khiển này từng góp phần vào một ván cờ đại thắng trước [bg_loser.GetTitledFirstName], và cũng chính từ đó đã mang vận may đặc biệt của nó đến với [bg_victor.GetTitledFirstName].\n\nCó kẻ cho rằng trò cờ vây vốn chẳng dính dáng gì đến may rủi, song bàn cờ này từ sau sự kiện ấy vẫn luôn được gìn giữ cẩn thận như một vật mang điềm lành."
  artifact_pedestal_baekje_incense_burner_name:0 "Lư Hương Đồng Mạ Vàng"
  artifact_pedestal_baekje_incense_burner_description:0 "Chiếc lư hương này thể hiện tay nghề tinh xảo phi thường, dù theo mọi ghi chép thì đây là cổ vật có niên đại rất lâu đời của triều đại Bách Tế. Phần nắp được trang trí với núm hình phượng hoàng, xung quanh là 74 ngọn núi đúc thành nhiều tầng lớp, cùng vô số hình tượng nhân vật và cảnh sắc phong phú."
  artifact_armillary_sphere_china_name:  "Thiên Cầu Hoàng Gia"
  artifact_armillary_sphere_china_desc:  "Thiên cầu này được chế tác bởi các thợ thủ công và học giả bậc thầy của Trung Hoa, dùng để tính toán các hiện tượng thiên văn. Là công cụ khảo sát lịch pháp thiên tượng, nó đồng thời cũng là biểu tượng cho thiên mệnh của Thiên Tử."
  artifact_eight_fold_chest_name:  "Bát Trùng Bảo Hạp"
  artifact_eight_fold_chest_description:  "Đây là một bộ gồm tám chiếc hộp nhỏ lồng vào nhau, trong đó thánh tích Xá Lợi Xương Ngón Tay của Đức Phật được đặt ở chiếc hộp trung tâm. Thánh tích này từng được sử dụng trong các nghi lễ nghinh đón dưới nhiều đời hoàng đế nhà Đường, trước khi bộ bảo hạp này được chế tác theo lệnh của Đường Ý Tông.\n\nMỗi chiếc hộp đều được chế tác tinh xảo từ gỗ đàn hương, bạc, vàng và ngọc. Chiếc hộp ngoài cùng là một bảo tháp bốn cửa bằng vàng ròng, bảo hộ xá lợi bên trong. Đỉnh tháp là một đóa sen nâng đỡ viên minh châu bằng vàng."
  artifact_military_classics_name:  "Vũ Kinh Tổng Yếu"
  artifact_military_classics_description:  "\"Vũ Kinh Tổng Yếu\" là bộ tổng hợp binh học kèm minh họa, do Tăng Công Lượng cùng các học giả biên soạn theo lệnh của Tống Nhân Tông. Tác phẩm bao quát nhiều phương diện kỹ thuật quân sự, nhằm tóm lược tinh yếu của binh thư để phổ truyền rộng rãi.\n\nNội dung bao gồm máy công thành, chiến tranh thủy chiến, cùng các công thức chế tạo hỏa dược."
