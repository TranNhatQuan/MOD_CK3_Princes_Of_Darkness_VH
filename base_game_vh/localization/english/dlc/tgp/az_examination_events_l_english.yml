l_english:

  az_examination.0001.t: "Chấm Bút"
  az_examination.0001.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entrant'))] của ta, [entrant.GetTitledHouseNameOrFirstName], khẽ cúi đầu và trình lên một cuộn thư được gấp cẩn thận.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip],\" [entrant.GetSheHe] nói. \"Ta khiêm tốn dâng lên những bài viết của mình để mong được ngài chỉ giáo. Ta đã dốc sức cho từng dòng chữ — có đoạn tràn đầy sự chắc chắn, còn có đoạn... phản ánh hành trình tìm kiếm sự cân bằng của ta. Ta rất mong được nghe ý kiến của ngài.\""
  az_examination.0001.intrigue: "\"Miễn là ngươi nhớ rằng chính ta đang giúp ngươi.\""
  az_examination.0001.a: "Đưa ra lời góp ý nhẹ nhàng và mang tính xây dựng."
  az_examination.0001.b: "Chế nhạo những nỗ lực đáng thương của [entrant.GetHerHis]."
  az_examination.0001.c: "So sánh tác phẩm của [entrant.GetHerHis] với cổ nhân và viết một bài bình luận."

  az_examination.0002.t: "Thách Đấu Công Khai"
  az_examination.0002.desc.exam: "[debater.Custom2('MyCharacterIntroduction', ROOT.Char)|U] $az_examination.0002.desc$"
  az_examination.0002.desc.debate: "[debater.GetFirstName], một đại diện của [debater_movement.GetName], $az_examination.0002.desc$"
  az_examination.0002.desc: "chặn ta lại trên đường rời khỏi thư phòng. Nụ cười đắc ý trên gương mặt [debater.GetHerHis] cho thấy [debater.GetSheHe] đã chờ đợi cơ hội để công kích một học giả không đề phòng.\n\n\"Không ai hiểu rõ Xuân Thu hơn ta! Lời của [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )] đâu chỉ là ghi chép sự kiện đơn thuần. Cách dùng từ tinh tế của ông tôn vinh người đức hạnh và lên án kẻ gian ác. Ngươi không nghĩ vậy sao?\""
  az_examination.0002.a: "\"Rõ ràng một [debater.Custom2('InsultNoun', ROOT.Char)] như ngươi thì làm sao đọc hiểu cho đúng được!\""
  az_examination.0002.b: "\"Ở đây không có chỗ cho những tưởng tượng viển vông.\""
  az_examination.0002.c: "\"Mỗi con đường dẫn đến trí tuệ đều khác nhau.\""
  az_examination.0002.d: "Rời khỏi cuộc tranh luận vô ích này."
 
  az_examination.0003.t: "Dâng Trà Thất Lễ"
  az_examination.0003.desc: "[tea_offender.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến trước các giám khảo với khay trà. [tea_offender.GetSheHe|U] rót trà bằng tay sai, tay áo quét xuống sàn, và dâng chén mà không cúi đầu hay chúc lễ.\n\n[host_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nhìn với vẻ khinh miệt lạnh lùng. \"Ngươi đã bỏ qua lễ nghi đúng mực, làm tổn hại đến phẩm hạnh của mình, [tea_offender.GetFirstNameNoTooltip],\" [host_examiner.GetSheHe] tuyên bố đủ lớn để mọi người đều nghe thấy. Tay của [tea_offender.GetFirstNamePossessiveNoTooltip] run rẩy khi [tea_offender.GetSheHe] cúi đầu cứng nhắc."
  az_examination.0003.a: "\"Xin để ta làm mẫu, [host_examiner.GetTitledFirstNameNoTooltip].\""
  az_examination.0003.b: "\"Tại sao cái [tea_offender.Custom2('InsultNoun', ROOT.Char)] này lại được phục vụ chúng ta?\""
  az_examination.0003.c: "Giữ im lặng."

  az_examination.0004.t: "Đáp Án Bị Cấm"
  az_examination.0004.desc: "Ta bắt gặp [caught_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)] đang lo lắng lật xem một bản thảo cũ kỹ, đôi mắt mở to với sự háo hức khó che giấu.\n\n[caught_entrant.GetSheHe|U] lắp bắp: \"Chỉ… chỉ để tham khảo thôi! Ta sẽ không dùng nó trong kỳ thi — thật đấy!\" Người thương nhân, [merchant.GetTitledHouseNameOrFirstName], nở một nụ cười đầy ẩn ý. \"Một tài liệu học tập quý giá, thưa đại nhân. Chỉ vài đồng thôi. Có lẽ một [ROOT.Char.GetWomanMan] đáng kính như ngài sẽ muốn mua cả bộ chăng?\""
  az_examination.0004.b: "Báo cáo sự ô nhục này và tịch thu cuộn thư."
  az_examination.0004.c: "Mua một cuộn thư thú vị từ người thương nhân."
  az_examination.0004.c.tt: "Ngài trở thành chủ sở hữu của một [artifact|E] cuộn thư [learning|E] và [GetTrait('confucian_education').GetName(GetNullCharacter)]"
  az_examination.0004.c.tt_equipped: "Đã mua [artifact_scroll.GetName]"
  az_examination.0004.d: "\"Ta chẳng thấy gì cả.\""
 
  az_examination.0005.china.t: "Suy Ngẫm Về Mạnh Tử"
  az_examination.0005.china.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đứng trước một tấm bia đá khắc một câu thơ từ Mạnh Tử, các ngón tay đan phía sau lưng [fellow_examiner.GetHerHis] để suy ngẫm.\n\n\"Ta đã đọc dòng này vô số lần,\" [fellow_examiner.GetSheHe] thì thầm khi ngài tiến lại gần, \"nhưng bản chất của nó vẫn còn khó nắm bắt. Mạnh Tử nói: 'Người vĩ đại là người giữ được trái tim thơ trẻ.' Ngài nghĩ sao về điều đó, [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
  az_examination.0005.korea.t: "Suy Ngẫm Về Choe Chiwon"
  az_examination.0005.korea.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] đang nhìn lên một tác phẩm chạm khắc đá, nét chữ không thể nhầm lẫn là của Thôi Trí Viễn, được khắc thành những đường nét uyển chuyển. Đôi bàn tay [fellow_examiner.GetHerHis|U] đặt sau lưng [fellow_examiner.GetHerHis], ánh mắt xa xăm suy tư.\n\n\"Thôi Trí Viễn đã viết những lời này khi trở về từ triều đình nhà Đường,\" [fellow_examiner.GetSheHe] nói khẽ khi ngài gia nhập cùng [fellow_examiner.GetHerHim]. \"Ông viết: 'Người quân tử phải quản lý trái tim mình trước khi cai trị người khác.' Ta đã suy ngẫm về chúng từ khi còn là học trò, và chúng vẫn làm ta bối rối.\""
  az_examination.0005.t: "Suy Ngẫm Về Một Câu Cổ Văn"
  az_examination.0005.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] bắt gặp ánh mắt của Ngài — đang chăm chú nhìn tấm bia khắc văn cổ.\n\n\"Đoạn này đã khiến ta bối rối từ lâu,\" [fellow_examiner.GetSheHe] nói nhẹ nhàng. \"Ngài nghĩ sao, [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
  az_examination.0005.china.a: "\"Đó là lời kêu gọi gìn giữ điều mà cổ nhân gọi là [Glossary( 'de', 'CONFUCIAN_DE')].\""
  CONFUCIAN_DE: "Nó chỉ sức mạnh đạo đức hay đức hạnh — một sức mạnh giúp một người ảnh hưởng tích cực đến người khác và duy trì sự hài hòa xã hội."
  az_examination.0005.a: "\"Đó là lời kêu gọi giữ vững sự minh triết đạo đức của bản thân.\""
  az_examination.0005.b: "\"Trật tự chính đáng phải đặt lên trên hết.\""
  az_examination.0005.c: "\"Thật là... nhạy cảm.\""
  az_examination.0005.d: "\"Ý nghĩa phải do mỗi người tự mình đạt được.\""

  az_examination.0006.t: "Hiếu Nghĩa Gia Tộc"
  az_examination.0006.desc: "Ta nhìn thấy [favored_entrant.GetFirstName], đứng quá gần [local_ruler.GetTitledHouseNameOrFirstName]. Ánh mắt họ gặp nhau quá một nhịp tim. \"Ta sẽ không làm ngài thất vọng, [favored_entrant.Custom2('RelationToMe', SCOPE.sC('local_ruler'))].\" [favored_entrant.GetFirstNameNoTooltip] thì thầm trong hơi thở của [favored_entrant.GetHerHis].\n\nKhi [local_ruler.GetTitleAsNameNoTooltip] nhìn thấy ta, [local_ruler.GetSheHe] nhanh chóng tiến lại phía ta. \"[favored_entrant.GetSheHe|U] đã giành được vị trí của [favored_entrant.GetHerHis], ta đảm bảo với ngài,\" [local_ruler.GetTitledFirstNameNoTooltip] lẩm bẩm, một nụ cười lịch sự trên đôi môi [local_ruler.GetHerHis] ."
  az_examination.0006.a: "\"Ta sẽ tự mình xác minh điều đó.\""
  az_examination.0006.b: "\"Chúng ta đều vươn lên nhờ bàn tay đã giúp đỡ mình.\""
  az_examination.0006.c: "\"Hãy để năng lực của [favored_entrant.GetHerHis] tự nói lên tất cả.\""

  az_examination.0007.t: "Sức Nặng Của Mực"
  az_examination.0007.desc: "[aged_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chuẩn bị món thứ hai trong [Glossary( 'Tứ Bảo', 'FOUR_TREASURES')] trước khi thi. Mài muội thông vào nghiên mực đồng với những nét vẽ chậm rãi, có chủ đích, [aged_examiner.GetSheHe] pha mực chất lượng tốt một cách thành thạo. Với cái nhìn sắc bén, [aged_examiner.GetSheHe] đưa cho ta chày mài mực.\n\n\"Đến lượt ngươi rồi. Loại mực này phải chảy như ánh trăng trên mặt nước, và trường tồn lâu hơn cả các đế chế. Công thức phù hợp nằm trong [Glossary( 'Kinh Lễ', 'BOOK_OF_RITES')].\""
  BOOK_OF_RITES: "Một kinh điển về trật tự và hòa hợp, quy định cách ứng xử đúng mực cho học giả, con cái và quân vương. Tuân theo lời dạy của nó là tôn vinh nền tảng của văn minh."
  FOUR_TREASURES: "Tứ Bảo — bút, mực, giấy và nghiên — là những công cụ thiết yếu của học giả. Việc sử dụng cẩn trọng thể hiện kỷ luật, sự sáng suốt và lòng tôn kính truyền thống."
  az_examination.0007.a: "\"Kinh điển không bao giờ sai.\""
  az_examination.0007.b: "\"Thêm vài giọt nhựa nhân sâm...\""
  tgp_ginseng_resin_modifier: "Pha Mực Thử Nghiệm"
  tgp_ginseng_resin_modifier_desc: "Những nghi thức tĩnh lặng của thư phòng giờ đây thể hiện trong từng cử chỉ của Ngài, mang lại một khí chất tinh tế."
  az_examination.0007.c: "\"Hãy để người hầu pha mực.\""

  az_examination.0008.t: "Một Thử Thách Đúng Lúc"
  az_examination.0008.desc: "Những cuộn bài thi cũ được trải ra giữa ta và [examiner.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Chúng thuộc về một thời đại trước,\" [examiner.GetSheHe] nói, nhẹ nhàng phủi bụi trên tấm giấy da. \"Tại sao ngài không thử trả lời một câu — và để ta chấm bài của ngài?\"\n\n[ROOT.GetCharacter.Custom('quirk_pos_adverb')|U], ta nhướng mày. Những cuộn thư này khiến ta nhớ lại thời khi [memory.GetDescription]."
  az_examination.0008.a: "\"Hãy chấm bài của nhau.\""
  az_examination.0008.a.success.tt: "Ngài vượt trội hơn [examiner.GetTitledHouseNameOrFirstName]"
  az_examination.0008.a.failure.tt: "Trí tuệ của [examiner.GetTitledFirstNamePossessive] vượt qua Ngài"
  az_examination.0008.b: "\"À, những ngày tháng ấy... Hãy cùng hồi tưởng.\""
  az_examination.0008.c: "\"Không phải hôm nay.\""

  az_examination.0009.t: "Mực Đổ Tán Loạn"
  az_examination.0009.desc: "Cái thùng đập xuống đất với một tiếng bắn tung tóe ghê người. [clumsy_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)] nhìn xuống trong kinh hoàng, cọ vẫn trong tay, mực bắn tung tóe lên chân [clumsy_entrant.GetHerHis], khi [angry_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] xông đến với sự giận dữ trong mắt [angry_examiner.GetHerHis].\n\n\"Ngươi đã hủy hoại sự chuẩn bị của cả một ngày!\" [angry_examiner.GetSheHe] gầm lên."
  az_examination.0009.a: "\"Là lỗi của ta. Ta đáng lẽ phải buộc chặt chiếc thùng.\""
  az_examination.0009.b: "\"Sự vụng về như thế này là không thể chấp nhận!\""
  az_examination.0009.c: "\"Dọn sạch đi. Chúng ta còn việc phải làm.\""

  az_examination.0010.t: "Một Ân Huệ Niêm Phong"
  az_examination.0010.desc: "[requesting_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bước tới với những bước chân khẽ khàng, ánh mắt liếc nhanh qua vai [requesting_entrant.GetHerHis], rồi đưa cho ta một cuộn thư.\n\n\"Ngài có thể chuyển giúp cái này cho [target_examiner.GetTitledHouseNameOrFirstName] không?\" [requesting_entrant.GetSheHe] thì thầm. \"Đây là... chuyện riêng tư.\""
  az_examination.0010.a: "Lặng lẽ chuyển bức thư."
  az_examination.0010.b: "Vạch trần ý đồ thao túng kỳ thi của [requesting_entrant.GetFirstNamePossessiveNoTooltip]."
  az_examination.0010.c: "Lập tức phá niêm phong và đọc nó."
  az_examination.0010.c.tt: "Ngài phát hiện một [secret|E] của [requesting_entrant.GetFirstName]"
  az_examination.0010.c.toast: "Một bí mật tai tiếng!"

  az_examination.0011.t: "Thì Thầm Đổi Chỗ"
  az_examination.0011.desc: "[sneaky_entrant_1.GetTitledHouseNameOrFirstName] nghiêng người về phía [sneaky_entrant_2.GetTitledHouseNameOrFirstName]. Giọng họ rất nhỏ, nhưng ta vẫn nghe lỏm được cuộc trò chuyện:\n\n\"Nếu chúng ta đổi chỗ,\" [sneaky_entrant_2.GetTitledFirstNameNoTooltip] thì thầm, \"vị giám khảo có ánh mắt hiền hậu kia sẽ là người chấm bài của ta.\""
  az_examination.0011.a: "Vạch trần âm mưu của họ trước cả đại sảnh."
  az_examination.0011.b: "Đề nghị giúp đỡ — và giữ im lặng."
  az_examination.0011.b.success: "Các sĩ tử bám lấy từng lời của Ngài"
  az_examination.0011.b.failure: "Các sĩ tử tỏ ra nghi ngờ Ngài"
  az_examination.0011.c: "Nhẹ nhàng khuyên họ suy nghĩ lại."

  az_examination.0012.t: "Một Lời Mời Riêng"
  az_examination.0012.desc: "[senior_examiner.GetTitledHouseNameOrFirstName], một vị giám khảo đáng kính, vẫy ta lại với nụ cười hiền dưới bóng mái đình trong vườn. \"Thật vui khi được trò chuyện với những người trân trọng tri thức. Lại đây, cùng ta uống trà,\" [senior_examiner.GetSheHe] ân cần nói. Ta nhận thấy [jealous_rival.Custom2('InsultAdjective', ROOT.Char)] [jealous_rival.Custom2('InsultNoun', ROOT.Char)] [jealous_rival.GetTitledHouseNameOrFirstName] ở phía bên kia đình, ánh mắt cháy lên vì ghen tị khi [jealous_rival.GetSheHe] tiến tới với khay trà, rõ ràng đang cố lấy lòng vị giám khảo."
  az_examination.0012.a: "\"Đó sẽ là vinh hạnh của ta.\""
  az_examination.0012.b: "\"Hay chúng ta nhường chỗ cho thêm một người?\""
  az_examination.0012.c: "\"Xin thứ lỗi — hôm nay ta còn phải lo cho những cuộn thư của mình.\""

  az_examination.0013.t: "Những Bài Luận Biến Mất"
  az_examination.0013.desc: "\"Chúng biến mất rồi!\" [fellow_assistant.GetTitledHouseNameOrFirstName], một trợ lý đồng sự, kêu lên, kéo tung hết ngăn kéo này đến ngăn kéo khác. \"Những bài luận để phân loại — ta đã tìm khắp nơi!\"\n\nỞ phía bên kia phòng, [calm_examiner.GetTitledHouseNameOrFirstName], một trong các giám khảo, thản nhiên lật sách và lẩm bẩm: \"Hoảng loạn cũng không làm chúng quay lại.\" Ta chắc chắn cái [calm_examiner.Custom2('InsultNoun', ROOT.Char)] này có liên quan đến chuyện này."
  az_examination.0013.a: "\"Chúng ta cùng tìm — chắc chắn sẽ thấy thôi!\""
  az_examination.0013.a.success: "Ngài tìm lại được những cuộn thư thất lạc"
  az_examination.0013.a.failure: "Những cuộn thư vẫn mất tích"
  az_examination.0013.b: "\"Ngài bình tĩnh quá đấy, [calm_examiner.GetFirstNameNoTooltip]. Ngài đang che giấu điều gì?\""
  az_examination.0013.b.success: "[calm_examiner.GetFirstNameNoTooltip] \"chợt nhớ\" rằng mình đã di chuyển các bài luận"
  az_examination.0013.b.failure: "Lời buộc tội của Ngài bị đáp lại bằng sự khinh miệt lạnh lùng"
  az_examination.0013.c: "\"Ta sẽ tự viết lại chúng.\""
  az_examination.0013.d: "\"Chuyện này không liên quan đến ta.\""

  az_examination.0014.t: "Áp Lực Nặng Nề"
  az_examination.0014.desc: "Ta giật mình tỉnh giấc. Có phải ta vừa ngủ thiếp đi tại bàn? Chạm vào má, ta cảm thấy một vết hằn trên da từ cuốn sách mà ta đã gối đầu lên.\n\nTa quay lại đối diện với Giám khảo [praising_examiner.GetTitledHouseNameOrFirstName], người có bước chân đánh thức ta khỏi giấc ngủ. Một nụ cười mờ nhạt hiện trên đôi môi [praising_examiner.GetHerHis] . \"Đừng lo lắng, [ROOT.Char.GetWomanMan] trẻ tuổi. Những nỗ lực siêng năng của ngươi không hề bị bỏ quên và, theo thời gian, sự học hỏi của ngươi chắc chắn sẽ được đền đáp.\"\n\nNghĩ đến những đêm muộn và những giờ dài đọc sách của mình đã được ghi nhận. Thật mãn nguyện."
  az_examination.0014.a: "\"Ta sẽ không phụ kỳ vọng của ngài.\""
  az_examination.0014.c: "\"Liệu ta có xứng làm học trò của ngài không?\""
  az_examination.0014.d:0 "\"Lời quan tâm của ngài khiến ta ấm lòng.\""
  tgp_examiner_promise_modifier: "Kỳ Vọng Cao"
  tgp_examiner_promise_modifier_desc: "Nhân vật này đã hứa sẽ xứng đáng với lời khen của bậc trưởng bối và mọi kỳ vọng đi kèm."

  az_examination.0015.t: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('proud_family_member'))|U] Tự Hào"
  az_examination.0015.desc: "[proud_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đứng gần rìa buổi tụ họp, ánh mắt sáng lên vì tự hào.\n\n\"Kìa! Đó là [ROOT.Char.Custom('ComplimentAdjective')] [proud_family_member.Custom2('RelationToMeShort', ROOT.Char)] của ta!\" Giọng [proud_family_member.GetHerHis] vang lên, khiến các sĩ tử xung quanh giật mình và thu hút những ánh nhìn khó chịu."
  az_examination.0015.a: "Ta cúi đầu trước [proud_family_member.GetHerHim] với sự biết ơn."
  az_examination.0015.b: "Ta sẽ nói chuyện riêng với [proud_family_member.GetHerHim] về sự kín đáo."
  az_examination.0015.c: "Ta cúi đầu và lẩn vào đám đông."
  az_examination.0015.d: "\"Con sẽ khiến [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('proud_family_member'))] tự hào!\""

  az_examination.0016.t: "Vài Lời Động Viên"
  az_examination.0016.desc: "[kind_examiner.GetTitledFirstName], một vị giám khảo đáng kính, lặng lẽ bước đến, tránh xa sự ồn ào của những sĩ tử thành công hơn.\n\n\"Ngươi có thể chưa vượt qua, nhưng đừng nghĩ rằng công sức của mình là vô ích. Con đường đến quan trường rất dài — và đôi khi quanh co.\""
  az_examination.0016.a: "\"Ta vô cùng biết ơn ngài.\""
  az_examination.0016.b: "\"Ngài có thể nhận ta làm học trò không?\""
  az_examination.0016.c: "\"Những lời này sẽ giúp ta tiếp tục tiến bước.\""
  tgp_examiner_encouragement_modifier: "Lời Động Viên"
  tgp_examiner_encouragement_modifier_desc: "Nhân vật này mang theo sự chúc phúc của một vị giám khảo đáng kính."

  az_examination.0017.t: "Bức Thư Bí Mật"
  az_examination.0017.desc: "Khi chỉnh lại áo choàng, ta cảm thấy một mảnh giấy cứng được giấu sâu trong tay áo. Hẳn ai đó đã lén đặt cho ta một bức thư trước kỳ thi.\n\nTrong đó viết: \"Khi nghi ngờ vây quanh như ruồi, hãy nhớ: ngươi đã học tập, đã đấu tranh, và chưa bao giờ khuất phục.\"\n\nBên kia sân, ta thấy [letter_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đang mang theo một bó cuộn thư. Ánh mắt chúng ta chạm nhau thoáng qua. Có lẽ ta có thể tâm sự với [letter_examiner.GetHerHim] về ý nghĩa của bức thư này."
  az_examination.0017.b: "\"Những lời này chỉ dành cho riêng ta.\""
  az_examination.0017.c: "Cho [letter_examiner.GetFirstNameNoTooltip] xem bức thư."
  tgp_letter_self_reflection_modifier: "Tự Suy Ngẫm"
  tgp_letter_self_reflection_modifier_desc: "Nhân vật này mang trong mình sức mạnh tĩnh lặng từ những lời khích lệ và niềm tin của gia đình."

  az_examination.0018.t: "Người Lớn Tuổi Trong Sĩ Tử"
  az_examination.0018.desc: "Ta thấy một người ngồi một mình dưới chiếc lọng — [old_exam_taker.Custom2('MyCharacterIntroduction', ROOT.Char)]. Dáng [old_exam_taker.GetHerHis|U] hơi còng, ánh mắt vừa sắc bén vừa mệt mỏi.\n\n\"Không bao giờ là quá muộn,\" [old_exam_taker.GetSheHe] nói khi nhận ra ánh nhìn của ta. \"Nhưng ở tuổi này thì con đường quả thật rất dài.\""
  az_examination.0018.b: "\"Để ta chia sẻ những gì ta đã học.\""
  az_examination.0018.c: "\"Ta hy vọng mình sẽ không bao giờ rơi vào cảnh đó.\""
  tgp_not_getting_any_younger_modifier: "Không Phải Tương Lai Của Ta"
  tgp_not_getting_any_younger_modifier_desc: "Nhân vật này đã nhìn thấy một sĩ tử lớn tuổi trong kỳ thi. Họ quyết tâm sẽ không để điều đó xảy ra với mình."
  az_examination.0018.d: "\"Ta rất khâm phục ngài, [old_exam_taker.Custom('ComplimentAdjective')] bậc tiền bối.\""

  az_examination.0019.t: "Gánh Nặng Kỳ Vọng"
  az_examination.0019.desc.intro: "Khi ta bước ra khỏi phòng thi, một giọng nói quen thuộc gọi tên ta.\n\n[disappointed_relative.GetFirstName] bắt gặp ánh mắt ta giữa đám đông và gọi:"
  az_examination.0019.desc.wrathful: "\"Ngươi đã làm ô danh chúng ta,\" [disappointed_relative.GetSheHe] rít lên, cơn giận lạnh lẽo cháy lên trong ánh mắt [disappointed_relative.GetHerHis]."
  az_examination.0019.desc.callous: "\"Ngươi đã thất bại,\" [disappointed_relative.GetSheHe] nói khô khốc, nụ cau mày hời hợt hiện rõ trên gương mặt [disappointed_relative.GetHerHis]."
  az_examination.0019.desc.shy: "\"Ta... ta đến để gặp ngươi,\" [disappointed_relative.GetSheHe] lúng túng nói, mặt [disappointed_relative.GetHerHis] đỏ lên. \"Xin lỗi nếu — nếu điều này khiến ngươi khó xử.\""
  az_examination.0019.desc.compassionate: "\"Ôi, [entrant.Custom2('RelationToMe', ROOT.Char)] của ta,\" [disappointed_relative.GetSheHe] nói, đôi mắt ánh lên lệ. \"Con đã cố gắng hết sức — ta chỉ mong vậy thôi.\""
  az_examination.0019.desc.fallback: "\"Ngươi đã rất gần rồi,\" [disappointed_relative.GetSheHe] nói khẽ, sự thất vọng hiện rõ trên gương mặt [disappointed_relative.GetHerHis]."
  az_examination.0019.a: "\"Lần sau ta sẽ thành công. Ta thề.\""
  az_examination.0019.b: "\"Ngài có thể... giúp ta không?\""
  az_examination.0019.c: "Ta chưa thể đối mặt với [disappointed_relative.GetHerHim] lúc này..."
  tgp_brooding_reflection_modifier: "Suy Tư U Uất"
  tgp_brooding_reflection_modifier_desc: "Nhân vật này đã thu mình lại, suy ngẫm sâu sắc — hoặc chìm trong nỗi thất bại."

  az_examination.0020.t: "Một Đồng Môn Thăng Tiến"
  az_examination.0020.desc: "Sân trường xôn xao tiếng nói, vang vọng niềm tự hào và thất vọng tương đương nhau. Giữa vòng xoáy của những chiếc áo choàng và cuộn giấy, ta phát hiện đồng môn [successful_peer.GetFirstName]. Một cái nhìn vào tay áo [successful_peer.GetHerHis] , được thêu dấu ấn của Kỳ thi Cung đình, nói với ta tất cả những gì ta cần biết.\n\n[successful_peer.GetSheHe|U] mỉm cười khi [successful_peer.GetSheHe] tiến lại gần. Có lẽ vì thói quen, hoặc thương hại, hay niềm vui chân thành."
  az_examination.0020.a: "\"Ngươi xứng đáng với điều này. Thật sự.\""
  az_examination.0020.b: "Khịt mũi rồi lao vào học tập chăm chỉ hơn."
  az_examination.0020.c: "Dù sao ta cũng bận tâm đến chuyện khác."
  tgp_envy_fueled_study_modifier: "Kỷ Luật Từ Sự Ghen Tị"
  tgp_envy_fueled_study_modifier_desc: "Nhân vật này tràn đầy sự ghen tị và quyết tâm, học tập với cường độ mới để vượt qua thất bại và đuổi kịp những người đã vượt lên trước."
