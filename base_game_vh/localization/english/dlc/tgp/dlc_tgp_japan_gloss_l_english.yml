l_english: 
  FUJIWARA_GLOSS: "#bold $dynn_Fujiwara$#! là [Glossary( 'Honsei', 'HONSEI_GLOSS' )] được Hoàng đế $Tenji$ ban cho quan trọng $dynn_Nakatomi$ $Kamatari$.\n\nCác nhánh hậu duệ của ông sẽ thống trị chính trị Nhật Bản hàng thế kỷ, đồng thời giữ vai trò [Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] cho dòng họ hoàng gia [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nCùng với [Glossary( 'Seiwa Minamoto', 'MINAMOTO_GLOSS' )] và [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], $dynn_Fujiwara$ là một trong những gia tộc quyền lực nhất Nhật Bản trung cổ sớm.\n\n[Glossary( 'Mon', 'MON_GLOSS' )] truyền thống của họ là #EMP Sagarifuji#! — hoa tử đằng treo."
  MINAMOTO_GLOSS: "#bold $dynn_Minamoto$#! — hay #EMP Genji#! — là [Glossary( 'Honsei', 'HONSEI_GLOSS' )] được ban cho hậu duệ bị tước quyền của dòng họ hoàng gia [Glossary( 'Yamato', 'YAMATO_GLOSS' )]. Gia tộc $dynn_Minamoto$ quan trọng nhất xuất phát từ Hoàng đế $Seiwa$.\n\nCùng với [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] và [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], $Seiwa$ $dynn_Minamoto$ là một trong những gia tộc quyền lực nhất Nhật Bản trung cổ sớm.\n\n[Glossary( 'Mon', 'MON_GLOSS' )] truyền thống của họ là ba #EMP Rindō#! — hoa gentian — mọc từ năm lá tre."
  TAIRA_GLOSS: "#bold $dynn_Taira$#! — hay #EMP Heike#! — là một [Glossary( 'Honsei', 'HONSEI_GLOSS' )] được ban cho các hậu duệ bị tước quyền thừa kế của gia đình hoàng gia [Glossary( 'Yamato', 'YAMATO_GLOSS' )]. Gia đình $dynn_Taira$ quan trọng nhất là hậu duệ của Thiên hoàng $Kanmu$.\n\nCùng với #EMP [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )]#! và #EMP [Glossary( 'Seiwa Minamoto', 'MINAMOTO_GLOSS' )]#!, $Kanmu$ $dynn_Taira$ là một trong những gia tộc quyền lực nhất của Nhật Bản thời trung cổ sơ kỳ.\n\n[Glossary( 'Mon', 'MON_GLOSS' )] truyền thống của họ là #EMP Agehachō#! — con bướm đuôi én."
  TACHIBANA_GLOSS: "#bold $dynn_Tachibana$#! là [Glossary( 'Honsei', 'HONSEI_GLOSS' )] được ban cho hậu duệ bị tước quyền của dòng họ hoàng gia [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nGia tộc $dynn_Tachibana$ quan trọng nhất xuất phát từ Hoàng đế $Bidatsu$.\n\n[Glossary( 'Mon', 'MON_GLOSS' )] truyền thống của họ là #EMP Tachibana#! — hoa cây cam."
  TAKASHINA_GLOSS: "#bold $dynn_Takashina$#! là [Glossary( 'Honsei', 'HONSEI_GLOSS' )] được ban cho hậu duệ bị tước quyền của dòng họ hoàng gia [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nGia tộc $dynn_Takashina$ quan trọng nhất xuất phát từ Hoàng đế $Tenmu$."
  YAMATO_GLOSS: "#bold $dynn_Yamato$#! là hoàng gia Nhật Bản, được cho là xuất phát từ nữ thần mặt trời Amaterasu. Dù từng là những Hoàng đế quyền lực, các gia tộc ảnh hưởng như [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] dần nắm quyền kiểm soát thực sự của triều đình, cai trị như nhiếp chính của hoàng tộc.\n\nNhiều gia tộc có ảnh hưởng nhất Nhật Bản xuất phát trực tiếp từ các Hoàng đế Yamato, bao gồm [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] và [Glossary( 'Taira', 'TAIRA_GLOSS' )].\n\n[Glossary( 'Mon', 'MON_GLOSS' )] truyền thống của họ là #EMP Kikka#! — hoa cúc."
  KAMPAKU_GLOSS: "#bold Kampaku#! là tước hiệu dành cho nhiếp chính của Hoàng đế trưởng thành Nhật Bản. Bắt đầu như một vị trí tôn quý gần [Glossary( 'Emperor', 'TENNO_GLOSS' )], gia tộc Fujiwara dần nắm quyền kiểm soát, đến mức Kampaku trở thành người cai trị thực sự, trong khi Hoàng đế chỉ là hình thức."
  TENNO_GLOSS: "#bold Ten'nō#! là tước hiệu dành cho Hoàng đế Nhật Bản. Theo thời gian, các nhiếp chính Fujiwara dần nắm quyền từ hoàng gia, khiến [Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] trở thành người cai trị thực sự, Hoàng đế chỉ còn là bù nhìn."
  JOKO_GLOSS: "#bold Jōkō#! là thuật ngữ chung cho Hoàng đế [Glossary( 'Emperor', 'TENNO_GLOSS' )] đã thoái vị. Khi quyền lực bị giành từ hoàng gia, việc Hoàng đế thoái vị trở nên phổ biến khi người thừa kế được đảm bảo khỏe mạnh, cho phép ông tham gia chính trị từ sau ngai, không chịu trách nhiệm lễ nghi."
  SHOEN_GLOSS: "#bold Shōen#! là các điền trang của các gia tộc quý tộc Nhật Bản, cùng với đất canh tác gắn liền mà họ ngày càng chiếm từ kiểm soát trung ương khi hệ thống tập trung [ritsuryo|E] suy giảm."
  HONSEI_GLOSS: "#bold Honsei#! — #EMP họ gốc#! — như #EMP [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )]#!, #EMP [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'Taira', 'MINAMOTO_GLOSS' )]#!, #EMP [Glossary( 'Tachibana', 'TACHIBANA_GLOSS' )]#! và #EMP [Glossary( 'Takashina', 'TAKASHINA_GLOSS' )]#!, là những họ lâu đời và uy tín nhất Nhật Bản, được hoàng gia ban cho quan lại.\n\nNhững tên này sau này được làm rõ hoặc thay thế bằng #EMP Kamei#! và #EMP Uji#!, khi nhu cầu phân biệt nhánh gia đình tăng và triều đình suy yếu."
  HEIJI_REBELLION_GLOSS: "Cuộc #bold Heiji Rebellion#! là xung đột giữa gia tộc [Glossary( 'Kawachi Minamoto', 'MINAMOTO_GLOSS' )] và [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], gia tộc sau được ủng hộ bởi các gia tộc Minamoto khác, về quyền kiểm soát Hoàng đế Nhật Bản.\n\nCho rằng triều đình ủng hộ đối thủ, Minamoto nổi dậy để ngăn chặn. Cuối cùng, họ bị đánh bại, nhiều thành viên bị lưu đày hoặc xử tử."
  RONIN_GLOSS: "#bold Rōnin#! — nghĩa đen #EMP người-sóng#! — xuất hiện từ cuối thời Nara, chỉ nông nô bỏ trốn khỏi đất chủ. Sau đó chỉ samurai không có chủ, do chủ chết hoặc mất quyền lực. Không có việc làm, ít kỹ năng ngoài chiến đấu, nhiều Rōnin phạm tội để tồn tại."
  MON_GLOSS: "#bold Mon#! - #EMP huy hiệu#! - là biểu tượng dùng để nhận dạng và liên kết với các gia tộc quý tộc Nhật Bản và các nhánh của họ."
  CHRYSANTHEMUM_THRONE_GLOSS: "Ngai #bold Chrysanthemum Throne#! chỉ ngai Takamikura hay ngai hoàng gia Nhật Bản, cả nghĩa đen và nghĩa tượng trưng cho [Glossary( 'Emperor', 'TENNO_GLOSS' )] và quyền lực pháp lý của chính quyền. Con dấu hoàng gia với hoa cúc 16 cánh lần đầu được Hoàng đế Go-Toba (1180-1239) dùng làm biểu tượng cá nhân, sau đó được [Glossary( 'imperial house', 'YAMATO_GLOSS' )] áp dụng. Hoa cúc tượng trưng cho trường thọ và đổi mới, phù hợp với dòng hoàng gia Nhật Bản liên tục không gián đoạn."
 
