l_english:
  tgp_china_yearly.0001.t: "Khi Đạo Không Thắng"
  tgp_china_yearly.0001.desc: "Trên đường trở về chỗ ở, Ta không khỏi để ý đám đông tụ tập trước cổng [poor_county.GetProvince.GetName] [poor_county.GetProvince.GetHolding.GetType.GetName]. \n\nCác bà mẹ, ông bố và trẻ con xếp hàng trên phố, cúi đầu xấu hổ khi tay chạm vào những mảnh thức ăn từ người đi đường."
  tgp_china_yearly.0001.a: "Phát thực phẩm và quần áo cho người nghèo."
  tgp_china_yearly.0001.a.flavor: "... và thừa nhận mình đã thất bại trong việc cai trị dân."
  tgp_china_yearly.0001.b: "\"Đánh họ trở lại làm việc!\""
  tgp_china_yearly.0001.b.success: "Dân thường Bị Khiếp Sợ Thành Công"
  tgp_china_yearly.0001.b.critical: "Thành Công Phi Thường!"
  tgp_china_yearly.0001.c: "\"Ta nên trở lại học tập.\""
  tgp_china_yearly.0001.c.flavor: "Ta chưa sẵn sàng đối phó với những câu hỏi khó như vậy."
  tgp_china_yearly.0001.d: "Những việc trần thế này không đáng để Ta bận tâm."
  tgp_china_yearly.0005.t: "Một [grieving_child.Custom('GetDaughterSon')|U] Thực Sự"
  tgp_china_yearly.0005.eunuch: "[messenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chào tôi cùng một đứa trẻ nông dân đang lếch thếch theo sau bước chân của [messenger.GetHerHis]. \n\n\"[ROOT.Char.GetTitleAsName] của ta, ta đã tìm thấy [grieving_child.Custom('GirlBoy')] này bên ngoài cổng, đang xin được yết kiến người. [grieving_child.GetSheHe|U] vừa mất đi người thân duy nhất còn sống và không có khả năng lo liệu một đám tang tử tế. Chắc chắn phải có điều gì đó chúng ta có thể làm cho [grieving_child.GetHerHim]!\""
  tgp_china_yearly.0005.knight: "Tôi nghe thấy một tiếng khóc lớn và tiếng bước chân chạy vội từ phía cổng sân trong. Lần theo âm thanh, tôi thấy [messenger.GetTitledFirstName] đang giữ chặt một đứa trẻ nông dân. \n\n\"Cứu con với, [ROOT.Char.GetTitleAsNameNoTooltip] của con!\" đứa trẻ kêu lên. \"[parent.GetMotherFather] của con đã chết và để lại con trơ trọi một mình. Con không có vải liệm cho thi thể [parent.GetHerHis], không có đinh cho quan tài.\" Từ đôi mắt đỏ hoe và nước mũi dính trên mũi của [grieving_child.GetHerHis], tôi có thể thấy rõ sự đau khổ của [grieving_child.GetHerHis] là thật lòng."
  tgp_china_yearly.0005.outro: "\n\nNếu tôi không làm gì cả, có khả năng đứa trẻ này sẽ không thể tự mình sống sót."
  tgp_china_yearly.0005.a: "\"Ta sẽ tìm một người giám hộ thích hợp cho đứa trẻ.\""
  tgp_china_yearly.0005.b: "\"Nó không thể làm tròn hiếu nghĩa với [parent.GetMotherFather] của mình nếu chúng ta thu nhận nó.\""
  tgp_china_yearly.0005.c: "Ta chưa sẵn sàng quyết định về việc này."
  tgp_china_yearly.0005.c.flavor: "Ngài được nhắc nhở học thêm."
  tgp_china_yearly.0005.d: "Chúng ta không thể làm chủ sinh tử."
  tgp_china_yearly.0010.t: "Những May Mắn Bất Ngờ"
  tgp_china_yearly.0010.desc: "Đi qua chợ địa phương, Ta nghe một người bán hàng hô: \"Bán thơ! Lời may mắn mang tài lộc đến gia đình Ngài!\" \n\nTa xếp đám đông để quan sát quầy. Những bài thơ được viết bằng chữ mảnh, dòng viết vội, gần như hòa vào nhau ở một vài chỗ. \n\nTa ít tin vào tài năng người bán, và còn ít tin hơn vào lời của [starving_lowborn.GetHerHis], nhưng nhiều người vẫn xếp hàng mua tác phẩm của [starving_lowborn.GetHerHis]."
  tgp_china_yearly.0010.a: "Người viết này không hơn gì kẻ trộm!"
  tgp_china_yearly.0010.a.tt: "Ngài trục xuất người viết"
  tgp_china_yearly.0010.b: "[starving_lowborn.GetSheHe|U] có thể hữu ích."
  tgp_china_yearly.0010.c: "Ta tự hỏi sách nói gì về điều này."
  tgp_china_yearly.0010.d: "Ta còn những việc quan trọng hơn phải làm."
  tgp_china_yearly.0015.t: "Vấn Đề Thương Mại"
  tgp_china_yearly.0015.desc: "Chuyến thăm quán trà địa phương bị gián đoạn bởi sự ồn ào ngoài đường. Ta nhìn ra thấy [market_vendor.GetTitledFirstName], một họa sĩ địa phương, đang tranh cãi với một người lạ. \n\n\"Khách hàng của Ta trông đợi Ta có mặt ở đây. Ta có nhiều đơn hàng phải giao!\" [market_vendor.GetTitledFirstNameNoTooltip] phản biện, nhưng người thương nhân đã dựng quầy và xếp hàng hóa. \n\nQuầy có [ROOT.Char.Custom('GetClothingArticle')] món đồ, tượng [ROOT.Char.Custom('RegionalFerociousAnimal')] khắc, và nhiều trâm cài tóc tinh xảo. Rõ ràng thương nhân này sống dựa vào lao động của các thợ khác."
  tgp_china_yearly.0015.a: "Đuổi thương nhân ra."
  tgp_china_yearly.0015.b: "Cho thương nhân ở lại, với chi phí."
  tgp_china_yearly.0015.c: "Ta giữ im lặng để tập trung học tập."
  tgp_china_yearly.0015.d: "Một vụ cãi vã nhỏ nhặt."
  tgp_china_yearly.0020.t: "Vấn Đề Dịch Vụ Công"
  tgp_china_yearly.0020.desc: "[tax_official.GetTitledFirstName] tiến tới Ta trong vườn với tay lo lắng và nụ cười sói. Ta vừa kịp buông [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] trong tay và đối mặt với [tax_official.GetHerHim] trước khi [tax_official.GetSheHe] nói. \n\n\"Chúa của Ngài gửi Ta với một thông điệp,\" [tax_official.GetSheHe] nói. \"[tax_liege.GetTitledFirstName] muốn thông báo rằng kho bạc hoàng gia đang thiếu quỹ, và [taxless_county.GetProvince.GetName] có một số thuế nợ mà [tax_liege.GetSheHe] muốn Ngài thu.\" \n\nTất nhiên danh tiếng của Ta sẽ bị ảnh hưởng nếu không tuân lệnh, nhưng [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )] dạy chúng ta ghét lòng tham dưới mọi hình thức."
  tgp_china_yearly.0020.a: "Gửi các quan thu thuế đi."
  tgp_china_yearly.0020.b: "Từ chối."
  tgp_china_yearly_no_education_first: "#weak Ngài nhận hiệu ứng này vì chưa có đặc điểm Giáo Dục Khổng Tử.#!"
  tgp_china_yearly.0030.t: "Lời Hay Lan Tỏa Xa"
  tgp_china_yearly.0030.desc_minister_of_personel: "[title_offerer.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\nNhiệm vụ của Ta là tìm những người tài năng như Ngài và đưa họ vào văn phòng."
  tgp_china_yearly.0030.desc_elder: "Là [elder|E] của Ngài, Ta phải thừa nhận rằng Ta ấn tượng với danh tiếng mà Ngài tạo ra như một [confucian|E] thực sự."
  tgp_china_yearly.0030.desc_fellow_confucian: "Là đồng môn Khổng Tử, Ta vui khi nghe về sự tận tâm của Ngài với Đạo, và mong cơ hội tranh luận hữu nghị nhiều lần trong tương lai."
  tgp_china_yearly.0030.desc_intro_outro: "\n\nĐể ghi nhận sự đúng mực của Ngài, Ta xin đề xuất nâng cao cơ hội ứng cử vào chức thống đốc [free_title.GetName]."
  tgp_china_yearly.0030.a: "Ta nhận lời trân trọng."
  tgp_china_yearly.0030.b: "Tiếc thay, Ta chưa hoàn tất giáo dục của mình."
