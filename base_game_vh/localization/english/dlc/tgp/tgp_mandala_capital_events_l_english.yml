  contributed_to_capital_opinion: "Đã đóng góp cho Kinh đô"

 ### MODIFIERS ###
  mandala_strong_workers_modifier: "Công nhân mạnh mẽ"
  mandala_strong_workers_modifier_desc: "Nhân vật này có những công nhân mới đây đã trở nên mạnh mẽ nhờ làm việc trên $building_type_mandala_capital_01$."
  mandala_sanctified_domes_dynasty_modifier: "$great_project_type_mandala_capital_01_contribution_sanctified_domes$"
  mandala_sanctified_domes_dynasty_modifier_desc: "Dòng họ khéo léo đủ để đóng góp những mái vòm thánh thiện tráng lệ này cũng nhận được phước lành và lòng sùng kính."
  mandala_ornate_reliefs_tax_province_modifier: "Phù điêu trang trí"
  mandala_ornate_reliefs_tax_province_modifier_desc: "Những phù điêu này, được chạm khắc cẩn thận kể câu chuyện của thần linh, thu hút du khách từ gần xa."
  mandala_ornate_reliefs_tax_modifier: "Thuế Du lịch"
  mandala_ornate_reliefs_tax_modifier_desc: "Nhân vật này đang thu lợi từ những phù điêu trang trí từng được đóng góp cho một $building_mandala_capital_01$."

  mandala_decorated_domes_dynasty_modifier: "$great_project_type_mandala_capital_02_contribution_decorated_domes$"
  mandala_decorated_domes_dynasty_modifier_desc: "Một sự kết hợp tuyệt vời giữa hình dạng và chi tiết, những mái vòm trang trí của dòng họ này cộng hưởng với người nhìn ở một cấp độ tinh thần."
  mandala_shallow_pools_defense_modifier: "$great_project_type_mandala_capital_02_contribution_shallow_pools$"
  mandala_shallow_pools_defense_modifier_desc: "Những hồ nông của $building_type_mandala_capital_01$ địa phương sẽ làm đầy tâm hồn Ngài cũng như ngăn chặn kẻ thù."

  mandala_divine_statues_province_modifier: "$great_project_type_mandala_capital_03_contribution_divine_statues$"
  mandala_divine_statues_province_modifier_desc: "Những bức tượng thần trong khuôn viên đền địa phương thu hút nhiều tín đồ."
  mandala_creation_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_creation_aspect$"
  mandala_creation_aspect_statues_modifier_desc: "Đầu tượng thần của Khía cạnh Sáng tạo, truyền cảm hứng cho công dân làm việc chăm chỉ và hiệu quả hơn."
  mandala_serenity_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_serenity_aspect$"
  mandala_serenity_aspect_statues_modifier_desc: "Đầu tượng của Khía cạnh Thanh thản, truyền cảm hứng cho công dân biết chấp nhận và thúc đẩy giải pháp hòa bình."
  mandala_destruction_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_destruction_aspect$"
  mandala_destruction_aspect_statues_modifier_desc: "Đầu tượng dữ dội của Khía cạnh Hủy diệt, gieo sợ hãi vào kẻ thù và quyết tâm vào đồng minh."
  mandala_trickery_aspect_statues_modifier: "$great_project_type_mandala_capital_03_contribution_trickery_aspect$"
  mandala_trickery_aspect_statues_modifier_desc: "Đầu tượng cười của Khía cạnh Xảo quyệt, khơi gợi sự hoài nghi và tò mò về bản chất thực sự."
  mandala_gilded_domes_dynasty_modifier: "$great_project_type_mandala_capital_03_contribution_gilded_domes$"
  mandala_gilded_domes_dynasty_modifier_desc: "Những mái vòm dát vàng đóng góp cho $building_type_mandala_capital_01$ là một trong những thành tựu nổi bật của dòng họ."
 
  mandala_gilded_shrines_province_modifier: "$great_project_type_mandala_capital_04_contribution_gilded_shrines$"
  mandala_gilded_shrines_province_modifier_desc: "Những đền thờ dát vàng địa phương vừa sang trọng vừa cộng hưởng tinh thần."
  mandala_contributor_gilded_shrines_reward_province_effect_tt: "Lãnh thổ [province.GetName] nhận [GetModifier('mandala_gilded_shrines_province_modifier').GetNameWithTooltip]"
  mandala_contributor_gilded_shrines_reward_effect_tt: "Lãnh thổ [owner.GetCapitalLocation.GetName] nhận [GetModifier('mandala_gilded_shrines_province_modifier').GetNameWithTooltip]"
  mandala_bell_stupas_modifier: "$great_project_type_mandala_capital_04_contribution_bell_stupas$"
  mandala_bell_stupas_modifier_desc: "Những tháp chuông Phật giáo này là một bổ sung tuyệt vời cho khuôn viên đền địa phương."
  mandala_bejeweled_domes_dynasty_modifier: "$great_project_type_mandala_capital_04_contribution_bejeweled_domes$"
  mandala_bejeweled_domes_dynasty_modifier_desc: "Những viên đá quý lấp lánh dưới ánh trăng chiếu sáng bầu trời như những vì sao — một thành tựu khác của dòng họ."

  mandala_divine_barays_defense_modifier: "$great_project_type_mandala_capital_05_contribution_divine_barays$"
  mandala_divine_barays_defense_modifier_desc: "Những hồ thần này, ngoài việc giúp tinh thần, còn giúp ngăn chặn kẻ ngoài và các mối đe dọa."
  mandala_forest_of_bunga_mas_modifier: "$great_project_type_mandala_capital_05_contribution_bunga_mas_forest$"
  mandala_forest_of_bunga_mas_modifier_desc: "Một khu rừng vàng ấn tượng, kể câu chuyện về một dòng họ Mandala lừng danh."

  mandala_capital_05_unconfirmed_talisman: "Bùa của [newly_created_talisman.MakeScope.Var('mandala_temple_location').GetProvince.GetBaronyNameExplicitlyNoTooltip]"
  mandala_capital_05_unconfirmed_talisman_desc: "Một mảnh từ nền móng của $building_mandala_capital_05$ ở [newly_created_talisman.MakeScope.Var('mandala_temple_location').GetProvince.GetName]."
  mandala_capital_05_talisman_base: "Một mảnh thiếu từ phù điêu đính đá quý của $building_mandala_capital_05$ tại [target_talisman.MakeScope.Var('mandala_temple_location').GetProvince.GetName]."
  mandala_capital_05_creation_talisman_desc: "$mandala_capital_05_talisman_base$ Những viên đá quý nổi bật mô tả thần linh với hoa mọc tự nhiên dưới chân họ khi họ xây dựng vương quốc cũng như cư dân từ nền móng lên."
  mandala_capital_05_serenity_talisman_desc: "$mandala_capital_05_talisman_base$ Những viên đá quý mát mẻ phát sáng với vẻ bình yên, kể câu chuyện về thanh thản, chấp nhận và hòa bình lâu dài."
  mandala_capital_05_destruction_talisman_desc: "$mandala_capital_05_talisman_base$ Những ánh sáng đỏ từ đá quý tạo cảm giác sợ hãi và kính trọng khi chứng kiến thần Hủy diệt thực hiện các nhiệm vụ đáng sợ nhưng cần thiết."
  mandala_capital_05_trickery_talisman_desc: "$mandala_capital_05_talisman_base$ Những viên đá quý tinh tế kể câu chuyện về kẻ xảo quyệt, tham gia vào nhiều trò nghịch ngợm để thử thách con người."
  artifact_is_related_to_great_project_construction_tt: "[artifact|E] này liên quan đến một [great_project|E] đang xây dựng và không thể bị phá hủy"
