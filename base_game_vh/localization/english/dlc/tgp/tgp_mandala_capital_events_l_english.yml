l_english:
  tgp_east_asia_mandala_capital_events.1000.t.base: "Kinh đô"
  tgp_east_asia_mandala_capital_events.1000.t: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_01$"
  tgp_east_asia_mandala_capital_events.1000.t.second: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_02$"
  tgp_east_asia_mandala_capital_events.1000.t.third:  "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_03$"
  tgp_east_asia_mandala_capital_events.1000.t.fourth: "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_04$"
  tgp_east_asia_mandala_capital_events.1000.t.final:  "$tgp_east_asia_mandala_capital_events.1000.t.base$: $building_mandala_capital_05$"
  tgp_east_asia_mandala_capital_events.1000.desc: "Khi Ta nhìn ra ngôi đền, những người thợ, giờ đã được tự do khỏi nghĩa vụ, tản đi. Họ để lại một công trình đá kiên cố, vươn lên từ mặt đất — hiện thân của lòng nhiệt thành của chúng Ta. \n\nTa hơi ngửa đầu để theo dõi các tòa tháp vươn cao lên bầu trời.\n\nĐúng rồi, đúng rồi, thế này là đủ. Ta sẽ trở thành devaraja vinh quang, cai trị ngôi đền này và chứng minh giá trị của mình."
  tgp_east_asia_mandala_capital_events.1000.desc.second: "Ngôi đền đã mở rộng, nay bao gồm nhiều đền thờ và đồ trang trí hơn — tất cả được xây dựng cẩn thận, tất cả đều phản ánh lòng tôn kính đối với #EMP Ta#!. \n\nNhững người hầu quanh Ta như những bóng đen khi Ta đi quanh ngôi đền, quan sát mọi ngóc ngách, gặp gỡ các tín đồ của Ta. Ta cảm nhận quyền lực của mình tăng lên với mỗi cái cúi đầu và ánh mắt tránh nhìn đầy tôn kính.\n\nĐây là thời gian #EMP của Ta#!."
  tgp_east_asia_mandala_capital_events.1000.desc.third: "Ngôi đền, nay mở rộng thành một khuôn viên lớn hơn, nhộn nhịp với sự náo nhiệt chung. Giờ đây có chỗ cho hàng chục khách hành hương xa xôi cũng như tăng lữ địa phương. Lễ bái hàng ngày không ngừng.\n\nKhách hành hương — đến để gặp Ta. Tăng lữ — đến để thờ phượng Ta.\n\nĐám đông chăm chỉ nhường đường cho Ta, và Ta dừng lại đôi chút để chạm vào vài đầu cúi chào dọc đường đi. Dân chúng của Ta. Tín đồ của Ta. Thần tính của Ta."
  tgp_east_asia_mandala_capital_events.1000.desc.fourth: "Khi mặt trời mọc trên khuôn viên đền, các hồ phản chiếu ánh sáng rực rỡ thần thánh.\n\nTa thưởng ngoạn ngôi đền, nay đã hoàn thiện với các hồ nước rộng và một hòm thánh tích nhỏ, thu thập những di vật tinh túy nhất.\n\nChậm rãi, Ta gật đầu — đúng, đây là nơi Ta thuộc về. Đây là điều Ta được định để làm. Tín đồ của Ta cần Ta; Ta ở đây để dẫn dắt con đường của họ, và đổi lại họ đã xây dựng cho Ta ngôi đền tráng lệ này. Chúng Ta sẽ làm nên những điều vĩ đại, #EMP cùng nhau.#!"
  tgp_east_asia_mandala_capital_events.1000.desc.final: "Viên đá cuối cùng đã được đặt tại khuôn viên của Ta ở [project_location.GetNameNoTooltip].\n\nCung điện đền chờ đợi. Ta cho phép bản thân một khoảnh khắc hân hoan và kinh ngạc khi nhìn ra những tòa tháp, mái vòm và [Glossary( 'barays', 'BARAY_GLOSS' )]. Ngôi đền tràn ngập vẻ huy hoàng khác thường.\n\nXung quanh Ta, mọi người hò reo và nhảy múa, ăn mừng một trong những thành tựu lớn nhất của Ta — một thành tựu sẽ được ghi nhớ qua nhiều thế hệ."
  tgp_east_asia_mandala_capital_events.1000.a: "Một thần thánh đang hình thành."
  tgp_east_asia_mandala_capital_events.1000.a.second: "Sự siêu việt đang chờ đón!"
  tgp_east_asia_mandala_capital_events.1000.a.third:  "Giờ chúng ta đang tiến gần..."
  tgp_east_asia_mandala_capital_events.1000.a.fourth: "Đây là #EMP mục đích thực sự của Ta#!."
  tgp_east_asia_mandala_capital_events.1000.a.final:  "Hãy kiểm tra những dấu hiệu của một #EMP vị thần#!."

  tgp_east_asia_mandala_capital_events.1010.t: "Phần Thưởng Kinh Đô"
  tgp_east_asia_mandala_capital_events.1010.desc: "Sứ giả của [ROOT.Char.Custom2('RelationToMe', overlord_scope)], [overlord_scope.GetTitledFirstName], đến gặp Ta vào buổi sáng sớm: "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ngôi đền kinh đô vĩ đại ở [project_location.GetNameNoTooltip] cuối cùng đã hoàn tất!"\n\n \"[overlord_scope.GetTitleAsNameNoTooltip] nhân từ của chúng ta đã gửi Ta đến để bày tỏ sự biết ơn của [overlord_scope.GetHerHis] vì những đóng góp rộng lượng của ngài!\" Đôi mắt của [envoy.GetWomanMan] tỏa sáng với niềm nhiệt huyết khi [envoy.GetSheHe] thuật lại tầm nhìn về các tòa tháp, mái vòm và [Glossary( 'barays', 'BARAY_GLOSS' )] mang đến vẻ huy hoàng siêu việt cho ngôi đền.\n\nTa gật đầu, hài lòng với đóng góp của mình cho công trình..."
  tgp_east_asia_mandala_capital_events.1010.a: "Gửi lời chào của Ta."

