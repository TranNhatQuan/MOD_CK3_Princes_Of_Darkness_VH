l_english:
  tgp_admin_contract_natural_disaster_tt_rewards: "Ngươi có thể chọn giữa nhiều phần thưởng, bao gồm:#indent_newline:3 \n$EFFECT_LIST_BULLET$$admin_contract_success_tt_xp$\n$EFFECT_LIST_BULLET$[experience|E] trong [lifestyles|E]\n$EFFECT_LIST_BULLET$[influence_i|E][influence|E]\n$EFFECT_LIST_BULLET$[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$[county_opinion|E]\n$EFFECT_LIST_BULLET$Cải thiện [counties|E] của ngươi#!"
  tgp_admin_contract_natural_disaster_failure_tt: "Ngươi có thể chịu hình phạt, chẳng hạn mất [prestige_i|E][prestige|E] hoặc [influence_i|E][influence|E]"
  tgp_natural_disaster_travel_to_contract_destination: "Đi đến [natural_disaster_contract_destination.GetName] và điều tra vấn đề"
 
 #Food
 #CONTRACT
  tgp_food_shortage: "Thiếu Lương Thực"
  tgp_food_shortage_contract: "$tgp_food_shortage$"
  tgp_food_shortage_desc_title: "$task_contract_governance_desc_title$"
  tgp_food_shortage_request: "$admin_request_choose_opportunity$"
  tgp_food_shortage_desc: "Một tai họa đã xảy ra tại hạt này, khiến lương thực trở nên khan hiếm cho dân chúng."
 #FIRST EVENT OPT IN OR OUT
  tgp_natural_disaster_contract_event.0001.t: "$tgp_food_shortage$"
  tgp_natural_disaster_contract_event.0001.desc: "Lương thực trở nên khan hiếm tại [natural_disaster_contract_destination.GetName], buộc dân chúng phải tìm kiếm các nguồn thực phẩm thay thế – đôi khi #EMP phi truyền thống#! – Những người có khả năng đang cố gắng giúp đỡ, và chúng ta được yêu cầu can thiệp."
  tgp_natural_disaster_contract_event.0001.a: "Dân chúng đang kêu đói, không thể bỏ mặc."
  tgp_natural_disaster_contract_event.0001.b: "Dự trữ của ta quý giá và không có gì để chia sẻ."
 #EVENT
  tgp_natural_disaster_contract_event.0002.t: "$tgp_food_shortage$"
  tgp_natural_disaster_contract_event.0002.desc: "Tiếng khóc đáng thương của những người đói vang khắp đường phố khi đoàn tùy tùng của ta bị những kẻ đói rách rưới bao quanh ngay lúc tới nơi, đôi mắt trống rỗng như bụng của họ. Số lương thực mang theo đủ cho vài người, nhưng không đủ cho tất cả – và thiếu thốn nhanh chóng trở thành tuyệt vọng nguy hiểm."
  tgp_natural_disaster_contract_event.0002.a: "Hãy giúp tất cả thần dân!"
  tgp_natural_disaster_contract_event.0002.b: "Đáp ứng nhu cầu của họ, bất kể chi phí: ta sẽ trả."
  tgp_natural_disaster_contract_event.0002.c: "Ta sẽ thuyết phục thương nhân mở kho của họ."
  tgp_natural_disaster_contract_event.0002.c.tt.success: "Các thương nhân đồng ý giúp cứu trợ"
  tgp_natural_disaster_contract_event.0002.c.tt.failure: "Các thương nhân vô tâm chọn lợi nhuận thay vì từ thiện"
  tgp_natural_disaster_contract_event.0002.d: "Ép những người quyền quý đóng góp cho cứu trợ."
 #MODIFIERS
  tgp_distribution_of_food_character_modifier: "Cứu Trợ Người Nghèo"
  tgp_distribution_of_food_character_modifier_desc: "Nhân vật này thuyết phục thần dân phân phát lương thực cho người nghèo trong khu vực."
  tgp_distribution_of_food_modifier: "Phân Phát Lương Thực"
  tgp_distribution_of_food_modifier_desc: "Hạt này nhận thêm lương thực."
  tgp_pay_from_own_pocket_character_modifier: "Trả Từ Túi Riêng"
  tgp_pay_from_own_pocket_character_modifier_desc: "Nhân vật này tự nguyện dùng tiền riêng để cứu đói."
  tgp_pay_from_own_pocket_modifier: "Tiền Riêng"
  tgp_pay_from_own_pocket_modifier_desc: "Hạt này nhận cứu trợ trực tiếp từ túi của quan cai trị."
  tgp_haggle_with_merchants_modifier: "Thương Nhân Hảo Tâm"
  tgp_haggle_with_merchants_modifier_desc: "Hạt này nhận thêm cứu trợ từ thương nhân đi đường."
  tgp_demand_food_from_nobles_modifier: "Yêu Cầu Lương Thực Từ Quý Tộc"
  tgp_demand_food_from_nobles_modifier_desc: "Dự trữ lương thực của hạt được tăng nhờ ép các quý tộc địa phương hỗ trợ."
 #CONTRACT REWARD
  task_contract_reward_effect_distribution_of_food_desc: "$label_success_standard$"
  task_contract_reward_effect_pay_from_own_pocket_desc: "$label_success_standard$"
  task_contract_reward_effect_haggle_with_merchants_desc: "$label_success_standard$"
  task_contract_reward_effect_demand_food_from_nobles_desc: "$label_success_standard$"
  task_contract_reward_effect_haggle_with_merchants_failure_desc: "$label_failure_standard$"

 #Reconstruction
 #CONTRACT
  tgp_ravaged_buildings: "Thiệt Hại Do Thiên Nhiên"
  tgp_ravaged_buildings_contract: "$tgp_ravaged_buildings$"
  tgp_ravaged_buildings_desc_title: "$task_contract_governance_desc_title$"
  tgp_ravaged_buildings_request: "$admin_request_choose_opportunity$"
  tgp_ravaged_buildings_desc: "Vùng đất này bị thiên tai tàn phá, cơ sở hạ tầng đổ nát và cần được sửa chữa gấp."
 #FIRST EVENT OPT IN OR OUT
  tgp_natural_disaster_contract_event.0005.t: "$tgp_ravaged_buildings$"
  tgp_natural_disaster_contract_event.0005.desc: "Sau một thiên tai gần đây, dân chúng [natural_disaster_contract_destination.GetName] tràn ngập văn phòng của ta với các đơn kiến nghị và yêu cầu trợ giúp xây dựng lại nhà cửa."
  tgp_natural_disaster_contract_event.0005.a: "Ta sẽ trực tiếp giám sát cứu trợ."
  tgp_natural_disaster_contract_event.0005.b: "Khốn khổ thật, nhưng họ chỉ là một trong nhiều nạn nhân."
 #EVENT
  tgp_natural_disaster_contract_event.0006.t: "$tgp_ravaged_buildings$"
  tgp_natural_disaster_contract_event.0006.desc: "Đống đổ nát trước mắt là minh chứng cho mức độ nghiêm trọng của thiên tai tại [natural_disaster_contract_destination.GetName].\n\nNhững người mất nhà và bị thương nhìn về ta để tìm chỗ trú, trong khi tiếng kêu yếu ớt từ đống đổ nát vang lên. Khi mây bão tụ trên đường chân trời, nhu cầu của họ càng cấp bách."
  tgp_natural_disaster_contract_event.0006.a: "Đưa càng nhiều người đến nơi an toàn càng tốt, chúng ta sẽ ở lại cứu những người còn lại."
  tgp_natural_disaster_contract_event.0006.b: "Những người bị chôn vùi không thể cứu, chúng ta phải che chở những người sống sót."
  tgp_natural_disaster_contract_event.0006.c: "Ưu tiên đầu tiên là giải cứu những người mắc kẹt dưới đống đổ nát."
  tgp_natural_disaster_contract_event.0006.c.tt.desc.success: "Những nạn nhân bị mắc kẹt đã được giải cứu thành công"
  tgp_natural_disaster_contract_event.0006.c.tt.success: "Những nạn nhân bị mắc kẹt đã được giải cứu thành công"
  tgp_natural_disaster_contract_event.0006.c.tt.desc.failure: "Đống đổ nát sụp trước khi ngươi kịp cứu những người mắc kẹt"
  tgp_natural_disaster_contract_event.0006.c.tt.failure: "Đống đổ nát sụp trong bão, chôn vùi những người mắc kẹt"
  tgp_natural_disaster_contract_event.0006.d: "Một nơi ở đổi lấy sức lao động của họ có vẻ là hợp lý."
 #MODIFIERS
  tgp_rebuild_settlement_character_modifier: "Bậc Thầy Phục Hồi"
  tgp_rebuild_settlement_character_modifier_desc: "Nhân vật này quen xử lý hậu quả thiên tai và thành thạo công tác tái thiết."
  tgp_rebuild_settlement_modifier: "Tái Xây Dựng Thị Trấn"
  tgp_rebuild_settlement_modifier_desc: "Các biện pháp mở rộng đã được thực hiện để khôi phục những gì hạt này mất sau thiên tai."
  tgp_temporary_shelters_modifier: "Nơi Ở Tạm Thời"
  tgp_temporary_shelters_modifier_desc: "Dù mất nhà sau thiên tai, dân chúng nơi đây đã được cung cấp chỗ ở tạm thời."
  tgp_remove_debris_modifier: "Dọn Bụi Đống"
  tgp_remove_debris_modifier_desc: "Trong quá trình giải cứu những người mắc kẹt, các đống đổ nát cũng được dọn sạch để xây dựng lại."
  tgp_labor_exchange_character_modifier: "Lực Lượng Nhập Khẩu"
  tgp_labor_exchange_character_modifier_desc: "Đổi chỗ ở tránh bão, nhân vật này đạt được thỏa thuận về nguồn lao động bổ sung trong địa bàn."
 #CONTRACT REWARD
  task_contract_reward_effect_rebuild_settlement_desc: "$label_success_standard$"
  task_contract_reward_effect_temporary_shelters_desc: "$label_success_standard$"
  task_contract_reward_effect_remove_debris_desc: "$label_success_standard$"
  task_contract_reward_effect_labor_exchange_desc: "$label_success_standard$"
  task_contract_reward_effect_remove_debris_failure_desc: "$label_failure_standard$"

 #Health Care
 #CONTRACT
tgp_medieval_medicine: "Chữa Trị Cho Người Khốn Khổ"
tgp_medieval_medicine_contract: "$tgp_medieval_medicine$"
tgp_medieval_medicine_desc_title: "$task_contract_governance_desc_title$"
tgp_medieval_medicine_request: "$admin_request_choose_opportunity$"
tgp_medieval_medicine_desc: "Thiên tai đã xảy ra tại hạt này! Số người chết đáng kể, chỉ xếp sau số người mất nhà và bị thương đang cần cứu trợ."
 #FIRST EVENT OPT IN OR OUT
tgp_natural_disaster_contract_event.0010.t: "$tgp_medieval_medicine$"
tgp_natural_disaster_contract_event.0010.desc: "Một kỵ sĩ đã tới mang tin khẩn về thảm họa tại [natural_disaster_contract_destination.GetName] — số người chết không thể đếm, những người sống sót bị thương nặng và đang cần cứu chữa khẩn cấp."
tgp_natural_disaster_contract_event.0010.a: "Phái một kỵ sĩ khác thông báo rằng Ta đang tới."
tgp_natural_disaster_contract_event.0010.b: "Người chết đã không còn cứu được; nhiệm vụ của Ta là với những người vẫn còn nguy hiểm."
 #EVENT
tgp_natural_disaster_contract_event.0011.t: "$tgp_medieval_medicine$"
tgp_natural_disaster_contract_event.0011.desc: "Thông điệp của kỵ sĩ cũng không thể hiện hết mức nghiêm trọng, người chết nhiều hơn người sống, mùi tử khí và phân hủy lan tỏa khắp nơi.\n\nNhững người sống sót cũng hầu hết bị thương tật, hầu như không ai thoát khỏi thảm họa nguyên vẹn.\n\nĐối diện với nỗi đau và khổ cực này, Ta thực sự không biết bắt đầu từ đâu."
tgp_natural_disaster_contract_event.0011.a: "Để các y sĩ chăm sóc những người bị thương trước."
tgp_natural_disaster_contract_event.0011.b: "Đưa trẻ em và người già cho Ta, Ta sẽ chăm sóc họ."
 #rephrase this
tgp_natural_disaster_contract_event.0011.b.tt.success: "Hỗ trợ thành công những người cần giúp"
 #rephrase this
tgp_natural_disaster_contract_event.0011.b.tt.failure: "Cố gắng hỗ trợ người cần giúp không thành công"
tgp_natural_disaster_contract_event.0011.c: "Tôn trọng người chết và đảm bảo họ được chôn cất đúng cách."
tgp_natural_disaster_contract_event.0011.d: "Chăm sóc chỉ dành cho những ai có khả năng chi trả."
 #MODIFIERS
tgp_assisting_physician_modifier: "Hỗ Trợ Y Tế"
tgp_assisting_physician_modifier_desc: "Một đội ngũ y sĩ đã tới hạt này để giảm bớt đau khổ cho những người bị thương."
tgp_medical_assistance_character_modifier: "Xắn Tay Áo"
tgp_medical_assistance_character_modifier_desc: "Nhân vật này trực tiếp tham gia cứu chữa những người bị thương nặng."
tgp_medical_assistance_modifier: "Y Tế Hụt Hẫng"
tgp_medical_assistance_modifier_desc: "Ý định tốt không phải lúc nào cũng dẫn tới kết quả tốt. Dân chúng hạt này đã chứng kiến trực tiếp những nỗ lực thiện chí nhưng thiếu kinh nghiệm của quan cai trị."
tgp_prayers_to_the_people_character_modifier: "Kính Trọng Người Chết"
tgp_prayers_to_the_people_character_modifier_desc: "Nhân vật này thể hiện rõ sự tôn trọng với người đã khuất."
 #CONTRACT REWARD
task_contract_reward_effect_assisting_physician_desc: "$label_success_standard$"
task_contract_reward_effect_medical_assistance_desc: "$label_success_standard$"
task_contract_reward_effect_prayers_to_the_people_desc: "$label_success_standard$"
task_contract_reward_effect_better_pay_up_desc: "$label_success_standard$"
task_contract_reward_effect_medical_assistance_failure_desc: "$label_failure_standard$"

 #Relocation
 #CONTRACT
tgp_disaster_displacement: "Kẻ Hái Hủy Diệt"
tgp_disaster_displacement_contract: "$tgp_disaster_displacement$"
tgp_disaster_displacement_desc_title: "$task_contract_governance_desc_title$"
tgp_disaster_displacement_request: "$admin_request_choose_opportunity$"
tgp_disaster_displacement_desc: "Những kẻ cướp và thợ săn đồ lén đã tràn vào hạt này sau thảm họa gần đây."
 #FIRST EVENT OPT IN OR OUT
tgp_natural_disaster_contract_event.0015.t: "$tgp_disaster_displacement$"
tgp_natural_disaster_contract_event.0015.desc: "Thảm họa tồi tệ nhất tại [natural_disaster_contract_destination.GetName] có thể đã qua, nhưng những kẻ tham lam đã lợi dụng cơ hội để làm giàu trên xương máu của những người mất nhà."
tgp_natural_disaster_contract_event.0015.a: "Cần bàn tay cứng rắn để lập lại trật tự."
tgp_natural_disaster_contract_event.0015.b: "Những điều xấu mà con người làm vượt quá khả năng sửa chữa."
 #EVENT
tgp_natural_disaster_contract_event.0016.t: "$tgp_disaster_displacement$"
tgp_natural_disaster_contract_event.0016.desc: "Bản chất thấp hèn của con người hiện rõ ở [natural_disaster_contract_destination.GetName], dân nơi đây dường như quan tâm đến việc cướp của hàng xóm hơn là giúp đỡ họ.\n\nPhải lập lại trật tự trước khi có thể tái thiết."
tgp_natural_disaster_contract_event.0016.a: "Triển khai quân và bắt những kẻ cướp."
tgp_natural_disaster_contract_event.0016.a.tt.desc.success: "Quân của Ngài bắt giữ được những kẻ cướp"
tgp_natural_disaster_contract_event.0016.a.tt.success: "Quân của Ngài bắt giữ thành công những kẻ cướp"
tgp_natural_disaster_contract_event.0016.a.tt.desc.failure: "Những kẻ cướp trốn thoát khỏi nỗ lực bắt giữ"
tgp_natural_disaster_contract_event.0016.a.tt.failure: "Quân của Ngài không thể bắt những kẻ cướp"
tgp_natural_disaster_contract_event.0016.b: "Chặt một số kẻ cướp để làm gương."
tgp_natural_disaster_contract_event.0016.c: "Tịch thu những gì đã lấy để #EMP kiểm tra cá nhân#!"
tgp_natural_disaster_contract_event.0016.d: "Trả tiền cho kẻ cướp để chúng rời đi vĩnh viễn."
 #MODIFIERS
tgp_deployed_troops_character_modifier: "Người Duy Trì Trật Tự"
tgp_deployed_troops_character_modifier_desc: "Nhân vật này ủng hộ việc thực thi luật pháp mạnh mẽ, bằng vũ lực nếu cần."
tgp_setting_an_example_character_modifier: "Trật Tự Bằng Kiếm"
tgp_setting_an_example_character_modifier_desc: "Nhân vật này sẵn sàng lập lại trật tự nhanh chóng, hiệu quả và không do dự."
tgp_deployed_troops_modifier: "Cướp Bóc Tràn Lan"
tgp_deployed_troops_modifier_desc: "Ngay cả quân của ta cũng không thể ngăn tham lam vô độ của những kẻ cướp tại hạt này."
tgp_paying_off_the_looters_modifier: "Thợ Săn Hối Lộ"
tgp_paying_off_the_looters_modifier_desc: "Đổi một số vàng, nạn cướp bóc tràn lan biến mất, để lại không gian cho việc phục hồi."
 #CONTRACT REWARD
task_contract_reward_effect_deployed_troops_desc: "$label_success_standard$"
task_contract_reward_effect_setting_an_example_desc: "$label_success_standard$"
task_contract_reward_effect_confiscate_for_personal_inspection_desc: "$label_success_standard$"
task_contract_reward_effect_paying_off_the_looters_desc: "$label_success_standard$"
task_contract_reward_effect_deployed_troops_failure_desc: "$label_failure_standard$"
