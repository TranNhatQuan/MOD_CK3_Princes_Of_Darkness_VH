l_english:
  unsanctioned_deity: "Thần Bị Cấm"
  unsanctioned_deity_contract: "$unsanctioned_deity$"
  unsanctioned_deity_desc: "Thần dân trong hạt này thờ một vị thần trái phép, và tin đồn về phước lành may mắn của vị thần lan rộng khắp vương quốc."
  unsanctioned_deity_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_events_tova.0050.t: "$unsanctioned_deity$"
  governor_contract_events_tova.0050.desc: "Một số lượng người bất thường xếp hàng trên các con phố của [deity_destination.GetName] để cúi lạy và đốt nhang trước điện thờ của vị thần trái phép. Cả nông dân lẫn dân thành thị đều từ khắp nơi trong vương quốc kéo đến để dâng những lễ vật ít ỏi mà họ có.\n\nNếu Ta không xử lý tình hình, những mê tín hoang dã này sẽ tiếp tục lan tràn khắp quận."
  governor_contract_events_tova.0050.a: "Vấn đề này đòi hỏi sự chú ý toàn bộ của Ta."
  governor_contract_events_tova.0050.a.tt: "Đi đến [deity_destination.GetName] và điều tra sự việc"
  governor_contract_events_tova.0050.b: "Ta có những vấn đề cấp bách hơn..."
  governor_contract_events_tova.0051.desc: "Ta theo mùi hương nhang nồng nặc ở [deity_destination.GetName], mở đường qua những con phố tấp nập và đến điện thờ gây phiền toái.\n\n[ROOT.Char.Custom('RandomPeasantGrievance')] Nhìn vào vết bẩn văng lên ống quần của [worshipper.GetHerHis], có thể thấy [worshipper.GetSheHe] đã đi một quãng đường khá xa để đến đây.\n\nKhi được hỏi về vị thần, [worshipper.GetSheHe] nói rằng thần xuất hiện dưới hình dạng [ROOT.Char.Custom('RandomVerySmallCreature')], và sống bên trong [ROOT.Char.Custom('RandomVerySmallCreatureDwelling')] ven đường."
  governor_contract_events_tova.0051.a: "Công khai phê chuẩn vị thần."
  governor_contract_events_tova.0051.b: "Giải tán tín đồ và thiêu điện thờ."
  governor_contract_events_tova.0051.c: "Tịch thu lễ vật tín ngưỡng."
  governor_contract_events_tova.0051.d: "Lý giải với tín đồ."
  governor_contract_events_tova.0051.e: "Ta sẽ để các tu sĩ xử lý việc này."
  governor_contract_events_tova.0052.desc_burn: "Vệ binh của Ta nhanh chóng phá đường qua đám đông, đánh vào những ai còn chậm chạp. Một ngọn đuốc rơi lên điện thờ, và ngọn lửa nhanh chóng bùng lên trời, sức nóng làm lùi lại những tín đồ còn lại.\n\nTa có thể nói chắc chắn rằng trật tự đã được khôi phục tại hạt [deity_destination.GetName], loại bỏ mê tín để lý trí có thể phát triển."
  governor_contract_events_tova.0052.desc_debunk: "\"...Và đó là lý do sinh vật này #EMP không phải#!, thực chất là một vị thần. Mỗi chúng ta tạo ra vận mệnh của riêng mình thông qua nhân tính và đạo đức tốt.\" \n\nĐám đông im lặng, kinh ngạc trước khả năng hùng biện vượt trội của Ta. Ta rõ ràng thấy khoảnh khắc mọi người nhận ra lỗi lầm của mình và bắt đầu tan rã."
  governor_contract_events_tova.0052.a: "Đúng như lẽ ra phải vậy."
  governor_contract_events_tova.0053.desc_burn: "Vệ binh của Ta cố gắng phá đường qua đám đông, và Ta ngạc nhiên khi thấy các tín đồ tức giận chống lại! Ngọn đuốc định thiêu điện thờ rơi xuống đất, và hỗn loạn xảy ra.\n\nTa và đoàn tùy tùng vừa kịp thoát ra trước khi ngọn lửa lan tới."
  governor_contract_events_tova.0053.desc_debunk: "\"...Điều đó có nghĩa cách duy nhất để bảo đảm vận mệnh của chúng ta là làm điều tốt cho chính mình. Nhưng tất nhiên không nên hành động quá nhiều chỉ để phục vụ lợi ích bản thân. Bây giờ, Ta đang nói gì nhỉ?\"\n\nMột làn sóng phản đối nhẹ lan qua đám đông. Một số che những nụ cười chế giễu phía sau tay áo.\n\nMặt nóng bừng, Ta quay đi trước khi làm bản thân trở nên ngớ ngẩn hơn."
  governor_contract_events_tova.0053.a: "Không như kế hoạch!"
  task_contract_reward_effect_sanction_deity_desc: "Vị thần trở thành được chính quyền công nhận."
  task_contract_reward_effect_claim_offerings_desc: "Những giá trị vật chất tại điện thờ bị tịch thu bởi Ngài."
  task_contract_reward_effect_deity_monks_desc: "Ngài giao phó vấn đề, như một vị thống đốc thực thụ."
  escaped_justice: "Kẻ Trốn Tội"
  escaped_justice_contract: "$escaped_justice$"
  escaped_justice_desc: "Một tội phạm trốn khỏi công lý và chạy đến hạt này thay vì chấp hành trát hầu tòa."
  escaped_justice_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_events_tova.0055.t: "$escaped_justice$"
  governor_contract_events_tova.0055.desc: "Tôi nhận được tin rằng [escapee.GetTitledFirstName] bỏ bê nhiệm vụ của [escapee.GetHerHis], thậm chí còn đi xa đến mức biển thủ công quỹ từ ngân khố hoàng gia. \n\nKhi được triệu tập đến đối mặt với công lý tại triều đình của tôi, [escapee.GetSheHe] đã tập hợp người của [escapee.GetHerHis] và bỏ trốn vào vùng hoang dã, nơi họ hiện đang chiếm giữ nhà của một người nông dân nghèo! \n\nNhững tên lính canh đã được vũ trang và sẵn sàng bảo vệ vị trí của chủ nhân [escapee.Custom('MistressMaster')] của họ. Rõ ràng là [escapee.GetTitledFirstName] sẽ không chịu khuất phục nếu không có sự can thiệp của tôi."
  governor_contract_events_tova.0055.a: "Ta phải đến đó ngay lập tức!"
  governor_contract_events_tova.0055.a.tt: "Đi đến [escapee_destination.GetName] và điều tra sự việc"
  governor_contract_events_tova.0055.b: "Con chuột hèn hạ đó sẽ lộ mặt sớm thôi..."
  governor_contract_events_tova.0056.desc: "\"Đừng tiến gần nữa!\" một cung thủ hét vào mặt Ta, nhắm vào chúng Ta từ sau một [ROOT.Char.Custom('OutdoorsHidingPlace')]. Vượt qua dáng vẻ đe dọa của [thug.GetHerHis], Ta nhìn thoáng thấy tòa nhà nơi tội phạm đang ẩn náu.\n\nNhìn vào tiếng cành cây gãy trong bụi rậm cao, một vài vệ binh khác đã sẵn sàng chống lại sự xuất hiện của Ta."
  governor_contract_events_tova.0056.a: "Thuyết phục kẻ trốn tội ra hầu công lý."
  governor_contract_events_tova.0056.b: "Đánh bại kẻ hèn nhát và quân lính của [escapee.GetHerHis]."
  governor_contract_events_tova.0056.c: "Ta sẵn sàng đưa ra sự khoan hồng."
  governor_contract_events_tova.0056.d: "Trục xuất [escapee.GetHerHim]."
  governor_contract_events_tova.0057.desc_persuade: "\"Hãy tự nhìn lại mình đi! Đây là hành động của một [escapee.GetWomanMan] điên rồ. Đó có phải là cách mà ngươi muốn triều đại của [escapee.GetDynastyName] được nhớ đến không? Hãy tha cho người thân của ngươi khỏi sự nhục nhã, và đi theo ta.\" \n\nCó lẽ là do lời nói của tôi, hoặc cách truyền đạt của tôi, nhưng [escapee.GetTitledFirstName] vẫn bước ra khỏi nơi ẩn nấp. [escapee.GetSheHe|U] giơ tay lên theo cử chỉ xoa dịu và đầu hàng."
  governor_contract_events_tova.0057.desc_slay: "Sự hòa bình mong manh vỡ vụn thành những tiếng kêu xung trận và tiếng thép va chạm ầm ĩ, khi người của tôi lao vào lính canh của [escapee.GetTitledFirstName]. \n\nMọi sự phản kháng đều gục xuống đất, giáp trụ của họ bị phá vỡ và sự sống chảy tràn xuống mặt đất. Sau đó, [escapee.GetTitledFirstName] bị kéo đến trước mặt tôi để tôi lấy đầu của [escapee.GetHerHis], điều mà tôi thực hiện chỉ bằng một cú đánh dứt khoát."
  governor_contract_events_tova.0057.a: "Công việc ở đây của Ta xong!"
  governor_contract_events_tova.0058.desc_persuade: "Ta mở miệng nói, nhưng khó tìm lý do để thuyết phục phải bị giam giữ. Ta nghe mình nói: \"Bị giam bắt ép buộc là tốt để rèn luyện nhân cách!\" Và Ta biết đã mất cơ hội thuyết phục [escapee.GetTitledFirstName] hòa bình.\n\n[escapee.GetSheHe|U] sẽ thấy việc ẩn náu cũng thú vị không kém."
  governor_contract_events_tova.0058.desc_slay: "Hòa bình mong manh vỡ ra thành tiếng la chiến đấu và va chạm thép.\n\nQuân Ta lao mình dũng cảm chống lại đối thủ, gươm sẵn sàng, nhưng đòn đánh chỉ trúng không khí, và họ không chặn được phản đòn.\n\nTa chứng kiến quân Ta bị đẩy lui và nhận ra chỉ còn cách rút lui."
  governor_contract_events_tova.0058.a: "Thật xấu hổ..."
  forced_conscription: "Bắt Lính Ép Buộc"
  forced_conscription_contract: "$forced_conscription$"
  forced_conscription_desc: "Triệu tập dân quân để chuẩn bị cho chiến tranh."
  forced_conscription_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_events_tova.0060.t: "$forced_conscription$"
  governor_contract_events_tova.0060.desc: "\"Trong thời kỳ mở rộng, bổn phận của chúng ta là huy động quân để chuẩn bị cho chiến tranh tiềm năng,\" bức thông điệp từ chúa Ta viết.\n\n\"Họ không cần phải huấn luyện. Họ không cần phải trang bị. Một đội tiên phong hùng mạnh sẽ phá tan mọi đối thủ.\"\n\nCác gia đình nông dân dưới quyền Ta đã dâng nộp những người chịu trách nhiệm quản lý gia đình, chỉ còn lại con trai họ để tuyển mộ."
  governor_contract_events_tova.0060.a: "Bằng sức mạnh thuần túy, chúng ta sẽ áp đảo kẻ thù!"
  governor_contract_events_tova.0060.a.tt: "Ngài điều tra sự việc thêm."
  governor_contract_events_tova.0060.b: "Ta sẽ không hy sinh dân của mình cho mục đích đó."
  governor_contract_events_tova.0061.desc: "Nhìn xuống thành phố bên dưới, Ta thấy những ánh sáng nhấp nháy ở cửa sổ và lối đi của các tòa nhà.\n\nCác gia đình chia sẻ bữa ăn trong an toàn của nhà mình. Vận mệnh của họ, cũng như mọi thần dân, thuộc về Ta quyết định."
  governor_contract_events_tova.0061.a: "Đền bù cho các gia đình."
  governor_contract_events_tova.0061.b: "Kéo con trai họ ra khỏi nhà!"
  governor_contract_events_tova.0061.c: "Dùng hiếu thuận để thuyết phục con trai họ nhập ngũ."
  governor_contract_events_tova.0061.d: "Có lẽ Ta có thể tha nếu họ đồng ý trao đổi."
  combat_train_monks: "Huấn Luyện Tu Sĩ Chiến Đấu"
  combat_train_monks_contract: "$combat_train_monks$"
  combat_train_monks_desc: "Một tu viện trong hạt này có một số tu sĩ có thể được sử dụng để tăng cường phòng thủ vương quốc nếu được huấn luyện đúng cách."
  combat_train_monks_desc_title: "$task_contract_governance_desc_title$"
  governor_contract_events_tova.0065.t: "$combat_train_monks$"
  governor_contract_events_tova.0065.desc: "Ta nhận được tin rằng có những tu sĩ trong tu viện [monks_destination.GetName] xuất sắc trong chiến đấu tay không. Họ luyện võ như một hình thức thiền, nhưng có thể những kỹ năng này sẽ hữu ích hơn cho vương quốc và bảo vệ biên cương.\n\nNhưng trước tiên, Ta phải thử thách bản lĩnh của các tu sĩ."
  governor_contract_events_tova.0065.a: "Ta sẽ xem các tu sĩ này có bản lĩnh ra sao."
  governor_contract_events_tova.0065.a.tt: "Đi đến [monks_destination.GetName] và giám sát luyện tập của họ"
  governor_contract_events_tova.0065.b: "Không, Ta để họ làm tu sĩ."
  governor_contract_events_tova.0066.desc: "Ta bước vào tu viện, đang có một buổi tập sparring.\n\nTiếng hét vang, một cú vỗ mạnh, và một tu sĩ ngã xuống đất, tung bụi lên. Mọi người reo hò, Ta cũng vậy.\n\nNgười chiến thắng nổi bật là một trong những chiến binh giỏi nhất trong chùa. Khi nói chuyện với hắn, hắn khoe rằng chính hắn chịu trách nhiệm dạy phần còn lại."
  governor_contract_events_tova.0066.a: "Chứng minh khả năng tay không của Ngài."
  governor_contract_events_tova.0066.b: "Khoe thành tích võ thuật của Ngài."
  governor_contract_events_tova.0066.c: "Giải thích #EMP chính xác#! hiệu quả của vũ khí."
  governor_contract_events_tova.0066.d: "Tướng lĩnh của Ta có thể xử lý việc này."
  governor_contract_events_tova.0066.tt_success_desc: "Các tu sĩ ấn tượng"
  governor_contract_events_tova.0066.tt_success: "Điều này mở ra kết quả tích cực"
  governor_contract_events_tova.0066.tt_failure_desc: "Các tu sĩ #bold không#! ấn tượng"
  governor_contract_events_tova.0067.desc: ""
  governor_contract_events_tova.0067.desc_martial: "Một vòng khán giả nhanh chóng hình thành xung quanh Ta và đối thủ.\n\nKhi chúng Ta cúi chào, Ta chuẩn bị đánh và không ngần ngại trước khi hạ ngã tu sĩ. Đây là khác biệt giữa học trò và bậc thầy!\n\nVới vậy, trận đấu kết thúc ngay khi bắt đầu. Khán giả chờ đợi những gì Ta sẽ nói tiếp theo."
  governor_contract_events_tova.0067.desc_diplomacy: "\"...Và khi Ta không còn kiếm, Ta vật lộn với kẻ xấu hôi Ta phải đối đầu, và đưa đầu hắn vào nắm đấm Ta một cách mạnh mẽ!\"\n\nNhìn biểu cảm chăm chú trên mặt khán giả, Ta biết các tu sĩ đã tin vào khả năng và uy quyền của Ta."
  governor_contract_events_tova.0067.desc_learning: "\"Lực thôi đã đủ để gãy xương, ngay cả khi vũ khí không xuyên qua giáp! Đây là nơi chiều rộng và chất liệu lưỡi kiếm quan trọng...\"\n\nTa rắc đủ các khái niệm thông thường vào bài nói để người dân hiểu, kể cả người giản dị nhất. Khi xong, không còn nghi ngờ gì rằng các tu sĩ hoàn toàn tin vào lập luận của Ta.\n\nHọ lắng nghe chăm chú."
  governor_contract_events_tova.0067.a: "Họ nên phục vụ trong quân đội Ta!"
  governor_contract_events_tova.0067.b: "Tu sĩ này có thể là một hiệp sĩ hữu ích."
  governor_contract_events_tova.0067.c: "Ta sẽ biến các tu sĩ này thành chiến binh."
  governor_contract_events_tova.0067.d: "Ta sẽ đóng quân ở đây để củng cố vùng này."
  governor_contract_events_tova.0068.desc: ""
  governor_contract_events_tova.0068.desc_martial: "Ta bước tới, ngẩng cao đầu, ngực ưỡn, sẵn sàng trình diễn cho các tu sĩ.\n\nChúng Ta cúi chào, và trước khi Ta kịp thẳng lưng, đối thủ lao tới với tiếng hét vang! Ta chỉ thấy bàn tay [warrior_monk.GetHerHis] bắn ra và đập vào ngực Ta, cướp hơi thở và đẩy Ta ngã xuống đất.\n\nTa nằm đó, thở dốc, tự hỏi loại nước suối núi nào mà các tu sĩ này dùng để trở nên mạnh mẽ như vậy."
  governor_contract_events_tova.0068.desc_diplomacy: "\"Vậy tất cả bắt đầu khi Ta còn trẻ...\"\n\nTa chưa kể được bao lâu thì nhận ra hầu hết mọi người đã mất tập trung. Đám đông thưa thớt.\n\nCố gắng cứu vãn tình hình chỉ làm tệ hơn, và một trong các lão tu sĩ còn ngủ gật!"
  governor_contract_events_tova.0068.desc_learning: "\"...Nhưng để thật sự hiểu cách vũ khí hoạt động, Ngài phải biết lịch sử rèn đúc kiếm trước.\" \n\nTa bắt đầu, nhưng nhanh chóng nhận ra chẳng ai hiểu Ta nói gì, hoặc tại sao nó liên quan!"
  governor_contract_events_tova.0068.a: "Thật thất vọng..."

  unsanctioned_deity_request: "Giải quyết tình huống có khả năng sử dụng [martial|E] hoặc [learning|E] của ngài"
  escaped_justice_request: "Giải quyết tình huống có khả năng sử dụng [martial|E] hoặc [diplomacy|E] của ngài"
  forced_conscription_request: "Tình huống này cho phép Ngài chọn một kết quả"
  combat_train_monks_request: "Giải quyết tình huống có khả năng sử dụng [martial|E], [diplomacy|E] hoặc [learning|E] của ngài"

