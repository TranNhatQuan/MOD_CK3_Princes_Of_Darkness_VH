l_english:
  tgp_travel_danger_events.0001.t: "Cuộc sống Giữa Những Tàn Tích"
  tgp_travel_danger_events.0001.intro: "Khi đi ngang qua [ROOT.Char.GetCurrentLocation.GetName], tôi thấy hậu quả của [disaster_situation.GetType.GetNameNoTooltip|l] hiện rõ ở khắp mọi nơi."
  tgp_travel_danger_events.0001.flood: "Mảnh vụn rác rưởi nằm rải rác bên bờ sông, những ngôi nhà trôi dạt theo dòng nước như lá rụng giữa dòng. Cả một ngôi làng đã bị dòng nước xiết nuốt chửng."
  tgp_travel_danger_events.0001.earthquake: "Vùng đất từng màu mỡ và ngôi làng sầm uất nay nằm im lìm trong cảnh hỗn độn và đổ nát, như bị chính đất mẹ nuốt chửng."
  tgp_travel_danger_events.0001.desc: "\n\nKhi tiến đến rìa của một thị trấn đổ nát, tôi quan sát thấy một đứa trẻ cô độc giữa đống đổ nát. [peasant_character_child.GetSheHe|U] không nhận ra tôi, vì [peasant_character_child.GetSheHe] đang tuyệt vọng cố gắng xây dựng lại thứ gì đó trông giống như một trang trại cũ."
  tgp_travel_danger_events.0001.a: "Người của ta sẽ dọn dẹp đống đổ nát này."
  tgp_travel_danger_events.0001.b: "Ta sẽ che chở và bảo bọc [peasant_character_child.GetHerHim]."
  tgp_travel_danger_events.0001.c: "Ta không có thời gian cho việc này!"
  impressed_by_kindness: "Ấn tượng bởi Lòng tốt"
