  dam_in_disrepair_request: "Tình huống này cho phép Ngài chọn một kết quả"
  dam_in_disrepair_desc: "Một đập xuống cấp khiến cư dân và quan chức quận lo lắng."
  dam_in_disrepair_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0009.t: "Đập Hư Hỏng"
  tgp_governor_contract_event.0009.desc: "Đập quan trọng tại [dam_in_disrepair_destination.GetName] đang trong tình trạng hư hỏng nghiêm trọng, hậu quả có thể thảm khốc nếu không giải quyết kịp thời.\n\nĐây không phải việc nhỏ, và phần lớn ngân sách đã được phân bổ cho nơi khác. Để giải pháp lâu dài, cần tìm cách giảm chi phí."
  tgp_governor_contract_event.0009.a: "Huy động dân địa phương, miễn trừ người nghèo và ốm yếu." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0009.b: "Đặt những người sẽ chịu ảnh hưởng nặng nề nhất vào lao động."
  tgp_governor_contract_event.0009.c: "Cư dân giàu có đóng góp theo khả năng."
  tgp_governor_contract_event.0009.d: "Tiền bạc không bằng mạng sống - Ta sẽ trả."
  tgp_governor_contract_event.0009.e: "Chúng ta sẽ lấy nguồn lực cần thiết từ thương nhân địa phương."

