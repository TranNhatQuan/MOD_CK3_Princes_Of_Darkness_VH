  seditious_storytelling: "Kể Chuyện Gây Loạn"
  seditious_storytelling_contract: "$seditious_storytelling$"
  seditious_storytelling_request: "Tình huống này cho phép Ngài chọn kết quả"
  seditious_storytelling_desc: "Một người kể chuyện nổi tiếng bắt đầu kể những câu chuyện mang màu sắc bất mãn và phản kháng."
  seditious_storytelling_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0028.t: "Kể Chuyện Gây Loạn"
  tgp_governor_contract_event.0028.desc: "Người thỉnh cầu cuối cùng trong ngày rời khỏi chỗ ta với lòng biết ơn, nhưng âm thanh mờ nhạt của sự rút lui có chừng mực của họ nhanh chóng bị thay thế bởi những bước chân vội vã mang theo tin xấu.\n\nĐó là [concerned_councillor.GetFirstName], gương mặt [concerned_councillor.GetHerHis] nghiêm trọng. \"Ta vừa nhận được một báo cáo #EMP gây phẫn nộ#! nhất, [ROOT.Char.Custom('FormOfAddressForLiege')]! Một trong những kẻ kể chuyện lang thang đó đã khơi dậy sự phẫn nộ của người dân ở [seditious_storytelling_destination.GetName] bằng những câu chuyện về các quan chức tham nhũng và hành vi sai trái của chính phủ!\""
  tgp_governor_contract_event.0028.a: "Để Ta tự tai nghe những lời này."
  tgp_governor_contract_event.0028.a_tt: "Đi đến [seditious_storytelling_destination.GetName] và nghe câu chuyện của họ."
  tgp_governor_contract_event.0028.b: "Giờ Ta phải quan tâm đến những #EMP kẻ biểu diễn#! sao?"

  tgp_governor_contract_event.0029.t: "Kể Chuyện Gây Loạn"
  tgp_governor_contract_event.0029.desc: "Ngồi ở cuối khán giả không ai để ý, Ta phải thừa nhận báo cáo trước đó có vẻ còn nhẹ nhàng.\n\nChỉ những kẻ ngu nhất mới không hiểu câu chuyện về những anh hùng lang thang áp bức chống lại quan tòa tham nhũng và lính côn đồ, nhân vật phản diện chính nghe #EMP quen thuộc#!.\n\nĐiều đáng lo hơn là sự hăng hái ngày càng tăng của đám đông đối với những câu chuyện đó."
  tgp_governor_contract_event.0029.a: "Ban hành tuyên bố công khai kiểm duyệt [seditious_storyteller.GetHerHim] vì gây rối trật tự." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0029.b: "Bắt kẻ láo này ngay lập tức!"
  tgp_governor_contract_event.0029.c: "Chúng ta thuê người kể chuyện riêng để tạo ra câu chuyện của mình."
  tgp_governor_contract_event.0029.d: "Đặt lính canh tại mọi sự kiện của [seditious_storyteller.GetHerHis] để nhắc nhở khán giả về trật tự."
  tgp_governor_contract_event.0029.e: "Sắp xếp một cuộc gặp kín, có lẽ Ta có thể thuyết phục [seditious_storyteller.GetHerHim]."

