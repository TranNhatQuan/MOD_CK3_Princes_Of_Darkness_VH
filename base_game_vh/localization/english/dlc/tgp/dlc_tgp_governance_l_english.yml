  contested_inheritance: "Kế Thừa Tranh Chấp"
  contested_inheritance_contract: "$contested_inheritance$"
  contested_inheritance_request: "Tình huống này cho phép Ngài chọn kết quả"
  contested_inheritance_desc: "Một nhân vật địa phương đáng chú ý qua đời, các người thừa kế đang tranh chấp gay gắt và đã yêu cầu chính quyền làm trung gian."
  contested_inheritance_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0034.t: "Kế Thừa Tranh Chấp"
  tgp_governor_contract_event.0034.desc: "Là một [ROOT.Char.GetTitleTierName] nghĩa là Ta không chỉ là một quan chức hành chính mà còn được nhiều người coi là nhân vật công bằng trong các vụ việc tranh cãi.\n\nVới tư cách này, một gia tộc nổi bật ở [contested_inheritance_destination.GetName] đã yêu cầu Ta đến để giải quyết một vụ tranh chấp thừa kế gay gắt khiến gia đình chia rẽ sâu sắc."
  tgp_governor_contract_event.0034.a: "Sự bất hòa trong một gia đình danh tiếng như vậy phản ánh xấu lên xã hội của chúng ta."
  tgp_governor_contract_event.0034.a_tt: "Đi đến [contested_inheritance_destination.GetName] và chấm dứt tranh chấp."
  tgp_governor_contract_event.0034.b: "Đây là chuyện gia đình, không phải việc của nhà nước."

  tgp_governor_contract_event.0035.t: "Kế Thừa Tranh Chấp"
  tgp_governor_contract_event.0035.desc: "Bầu không khí căng thẳng khi chúng Ta xem xét lại các yêu cầu tranh chấp, mỗi vòng tranh luận chỉ làm vấn đề rối hơn.\n\nDù họ cố tỏ ra lịch sự trước mặt Ta, Ta nghi ngờ rằng nếu có thể đóng chai sự căm ghét kín đáo của những người thừa kế này, nó sẽ độc hại như bất kỳ loại thuốc độc nào."
  tgp_governor_contract_event.0035.a: "Toàn bộ gia tộc sẽ chịu trách nhiệm về tài sản." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0035.b: "Để thành viên lớn tuổi nhất còn sống quản lý tài sản."
  tgp_governor_contract_event.0035.c: "Với một khoản tiền tượng trưng, Ta có thể để mình #EMP bị thuyết phục#!..."
  tgp_governor_contract_event.0035.d: "Chúng ta phải tôn trọng ý muốn của người đã khuất."
  tgp_governor_contract_event.0035.e: "Ta nên thuyết phục họ giải quyết chuyện này một cách lịch sự và đoan trang."

