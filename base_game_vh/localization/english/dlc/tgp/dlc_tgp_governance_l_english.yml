  burdensome_taxes: "Thuế Nặng Nề"
  burdensome_taxes_contract: "$burdensome_taxes$"
  burdensome_taxes_request: "Tình huống này cho phép Ngài chọn một kết quả"
  burdensome_taxes_desc: "Một người dân từ làng xa đến, cầu xin giảm thuế vì dân làng không thể chi trả."
  burdensome_taxes_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0007.t: "Thuế Nặng Nề"
  tgp_governor_contract_event.0007.desc: "Sau một ngày dài mệt mỏi nghe những lời khẩn cầu và than phiền - thường xuyên từ cùng một cái lưỡi - người thỉnh cầu cuối cùng bước tới, một [village_elder.GetWomanMan] lớn tuổi ăn mặc đơn giản và giản dị, phong thái của [village_elder.GetHerHis] khiêm tốn nhưng không phục dịch. Một thư lại đưa cho ta một mảnh giấy, chỉ ra rằng vị [village_elder.GetWomanMan] này là trưởng làng của [village_elder.GetHerHis] làng.\n\n\"Thưa [ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [village_elder.GetSheHe] bắt đầu, \"làng của chúng tôi nhỏ bé, và chúng tôi biết rất ít về sự giàu có và thịnh vượng. Các vụ mùa thất bát, thuế chúng tôi được yêu cầu đóng góp vượt quá khả năng ít ỏi của mình. Tôi cầu xin ngài, ngài phải giảm bớt gánh nặng của chúng tôi, nếu không chúng tôi có thể chết đói.\""
  tgp_governor_contract_event.0007.a: "Chuyển phần lớn gánh nặng sang khu vực giàu hơn." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0007.b: "Đánh giá lại với mức giảm: Ta chịu trách nhiệm hoàn toàn."
  tgp_governor_contract_event.0007.c: "Ta sẽ trả phần còn thiếu, nhưng năm sau tùy các ngài."
  tgp_governor_contract_event.0007.d: "Người dân không phải trả, nhưng khoản thuế vẫn tồn cho đến khi họ có thể hoàn thành."
  tgp_governor_contract_event.0007.e: "Ai không trả sẽ bị giam và tịch thu tài sản."

