  tgp_governor_contract_event.0031.a.toast_success: "Người dân được trấn an nhờ bài diễn thuyết điềm tĩnh của Ngài"
  tgp_governor_contract_event.0031.a.toast_failure: "Vì sợ Thần thù ghét, không ai tới dự họp"

  tgp_governor_contract_event.0031.d.success: "Nỗ lực điềm tĩnh và uy quyền của Ngài giúp dân yên tâm"
  tgp_governor_contract_event.0031.d.failure: "Người dân càng sợ hãi khi thấy thiệt hại"

