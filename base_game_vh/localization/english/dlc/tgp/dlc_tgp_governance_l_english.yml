l_english:

  jail_inspection: "Kiểm Tra Nhà Tù"
  jail_inspection_contract: "$jail_inspection$"
  jail_inspection_request: "Tình huống này cho phép Ngài chọn một kết quả"
  jail_inspection_desc: "Các báo cáo nghiêm trọng từ nhà tù quận: điều kiện tồi tệ và tù nhân đang trên bờ vực nổi loạn."
  jail_inspection_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0010.t: "Kiểm Tra Nhà Tù"
  tgp_governor_contract_event.0010.desc: "Dường như các tù nhân trong nhà tù quận xuống cấp tại [jail_inspection_destination.GetName] đã trở nên bực bội, phản đối điều kiện của họ và cản trở nỗ lực của cai ngục. Các báo cáo cảnh báo cần phải tìm giải pháp sớm, nếu không các tù nhân có thể vượt qua cai ngục."
  tgp_governor_contract_event.0010.a: "Ta nên tự mình giải quyết vấn đề này."
  tgp_governor_contract_event.0010.a_tt: "Đi tới [jail_inspection_destination.GetName] và kiểm tra nhà tù trực tiếp."
  tgp_governor_contract_event.0010.b: "Những lời cầu khẩn của tử tù không khiến Ta quan tâm."

  tgp_governor_contract_event.0001.t: "Kiểm Tra Nhà Tù"
  tgp_governor_contract_event.0001.desc: "Ta vừa bước vào nhà tù thì các giác quan đã bị bao vây bởi mùi hôi thối của những kẻ không tắm rửa và tiếng rên rỉ thê lương của các tù nhân. Một thứ gì đó nhỏ bé khẽ chạm vào chân ta trước khi lao nhanh vào bóng tối quá nhanh để nhận diện.\n\nTa hướng mắt về phía buồng giam gần nhất và bắt gặp ánh mắt của người tù bên trong, ánh nhìn của [sick_prisoner.GetHerHis] như một hòn than nóng của sự giận dữ giữa nỗi khốn khổ trên gương mặt [sick_prisoner.GetHerHis]."
  tgp_governor_contract_event.0001.a: "Cải tạo nhà tù, nhưng tù nhân sẽ làm công lao động." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0001.b: "Chúng ta phải cải thiện điều kiện của họ ngay lập tức!"
  tgp_governor_contract_event.0001.c: "Tha cho những người ít tội nhất trong họ."
  tgp_governor_contract_event.0001.d: "Đánh những kẻ phàn nàn ồn ào để họ im lặng."
  tgp_governor_contract_event.0001.e: "Chúng ta sẽ thả họ - để làm lao động cho nông trại và công trình của chúng ta."

  task_contract_reward_effect_renovate_jail_desc: "$label_success_standard$"
  task_contract_reward_effect_improve_their_conditions_desc: "$label_success_standard$"
  task_contract_reward_effect_pardon_some_of_them_desc: "$label_success_standard$"
  task_contract_reward_effect_beat_the_complainers_desc: "$label_success_standard$"
  task_contract_reward_effect_convict_labor_desc: "$label_success_standard$"

  potent_physick: "Thuốc Trị Mạnh"
  potent_physick_contract: "$potent_physick$"
  potent_physick_request: "Tình huống này cho phép Ngài chọn một kết quả"
  potent_physick_desc: "Một loại thuốc chữa mới mạnh mẽ đang được bán trên chợ, và đám đông người mua đông đảo đang đe dọa trật tự công cộng."
  potent_physick_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0011.t: "Thuốc Trị Mạnh"
  tgp_governor_contract_event.0011.desc: "Hiếm khi một người bán hàng ở chợ gây sự quan tâm từ chính quyền, nhưng dường như một cá nhân tại [potent_physick_destination.GetName] đang quảng bá một loại thuốc quá hiệu quả đến mức đám đông ồn ào mà nó thu hút đang gây rối trật tự công cộng."
  tgp_governor_contract_event.0011.a: "Bất cứ thuốc chữa nào thu hút nhu cầu như vậy đều đáng điều tra."
  tgp_governor_contract_event.0011.a_tt: "Đi tới [potent_physick_destination.GetName] và lập lại trật tự chợ."
  tgp_governor_contract_event.0011.b: "Ta không quan tâm đến chuyện chợ búa."

  tgp_governor_contract_event.0002.t: "Thuốc Trị Mạnh"
  tgp_governor_contract_event.0002.desc: "Sau khi đám đông hỗn loạn bị giải tán, Ta đứng trước người bán thuốc và những pha chế của [snake_oil_peddler.GetHerHis]. Con mắt tinh ranh của người bán lướt qua bộ trang phục của Ta, nhìn vào cơ hội sinh lời này.\n\n'Một lọ thôi, [ROOT.Char.Custom('FormOfAddressForLiege')],' [snake_oil_peddler.GetSheHe] giơ ngón tay, minh họa sinh động. 'Đảm bảo bổ sung tinh lực và chữa những điều sai!' \n\n'[ROOT.Char.GetLadyLord] có muốn lấy một, hay vài lọ không?' Người bán nở nụ cười khúm núm nhưng tham lam."
  tgp_governor_contract_event.0002.a: "Chúng ta sẽ thu giữ các lọ thuốc này làm nguồn cung cấp khẩn cấp." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0002.b: "Ngài có #EMP giấy phép#! cho gian hàng này không?"
  tgp_governor_contract_event.0002.c: "Thu dọn đồ đạc và mang thứ giả dược này đi chỗ khác."
  tgp_governor_contract_event.0002.d: "Tình cờ Ta cần một bác sĩ..."
  tgp_governor_contract_event.0002.e: "Ta nghĩ Ta sẽ thử: uống thử ngay!"

  task_contract_reward_effect_emergency_appropriation_desc: "$label_success_standard$"
  task_contract_reward_effect_licensing_issue_desc: "$label_success_standard$"
  task_contract_reward_effect_begone_quack_desc: "$label_success_standard$"
  task_contract_reward_effect_hire_the_quack_desc: "$label_success_standard$"
  task_contract_reward_effect_down_the_hatch_desc: "$label_success_standard$"

  irregular_accounting: "Kê Khai Không Thường Xuyên"
  irregular_accounting_contract: "$irregular_accounting$"
  irregular_accounting_request: "Tình huống này cho phép Ngài chọn một kết quả"
  irregular_accounting_desc: "Thuế từ khu vực này đến trễ hơn theo mỗi đợt, và chi phí vận chuyển tăng theo mỗi lần giao hàng."
  irregular_accounting_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0012.t: "Kê Khai Không Thường Xuyên"
  tgp_governor_contract_event.0012.desc: "Một số biến động trong thời gian vận chuyển thuế là điều bình thường, do đường sá, thời tiết hoặc các yếu tố khó dự đoán.\n\nTuy nhiên, thu thuế từ [irregular_accounting_destination.GetName] đến muộn bất thường, và chi phí vận chuyển gửi đến văn phòng của Ta ngày càng cao."
  tgp_governor_contract_event.0012.a: "Điều này cần được xem xét kỹ lưỡng."
  tgp_governor_contract_event.0012.a_tt: "Đi tới [irregular_accounting_destination.GetName] và tìm hiểu nguyên nhân."
  tgp_governor_contract_event.0012.b: "Ta chắc rằng mọi việc sẽ tự ổn theo thời gian."

  tgp_governor_contract_event.0003.t: "Kê Khai Không Thường Xuyên"
  tgp_governor_contract_event.0003.desc: "Ta gần như ngưỡng mộ nỗ lực công phu của kẻ tham ô, nếu không phải vì chính số tiền của ta mà [dubious_tax_agent.GetSheHe] đã tuồn vào túi của [dubious_tax_agent.GetHerHis].\n\nCác thư lại vẫn đang làm sáng tỏ mức độ sai phạm, nhưng những gì họ tìm thấy cho đến nay là quá đủ để kết tội [dubious_tax_agent.GetHerHim], nếu như các sổ sách không bị đốt cháy khi chúng ta đến.\n\nKẻ phạm tội đứng cạnh ta chờ đợi sự phán xét, ánh mắt cúi xuống, thái độ của [dubious_tax_agent.GetHerHis] ảm đạm như triển vọng tương lai của [dubious_tax_agent.GetHerHis]."
  tgp_governor_contract_event.0003.a: "Tịch thu lợi bất hợp pháp và suy ngẫm tội lỗi trong tù." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0003.b: "Tống giam sẽ lãng phí tư duy #EMP mưu lược#! của hắn."
  tgp_governor_contract_event.0003.c: "Điều này có thể phản ánh xấu về Ta - không cần công khai sự thật."
  tgp_governor_contract_event.0003.d: "Hoàn trả và sẽ được tha. Lần này thôi."
  tgp_governor_contract_event.0003.e: "Ta nghĩ Ngài #EMP thực sự#! cần một cộng sự..."

  task_contract_reward_effect_confiscation_and_incarceration_desc: "$label_success_standard$"
  task_contract_reward_effect_recruit_embezzler_desc: "$label_success_standard$"
  task_contract_reward_effect_cover_up_desc: "$label_success_standard$"
  task_contract_reward_effect_into_your_pocket_desc: "$label_success_standard$"
  task_contract_reward_effect_continue_the_charade_desc: "$label_success_standard$"

  salt_smugglers: "Buôn Lậu Muối"
  salt_smugglers_contract: "$salt_smugglers$"
  salt_smugglers_request: "Tình huống này cho phép Ngài chọn một kết quả"
  salt_smugglers_desc: "Thủ lĩnh một băng buôn lậu muối địa phương đã bị bắt và cung cấp vị trí của các thành viên còn lại để đổi lấy tự do."
  salt_smugglers_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0013.t: "Buôn Lậu Muối"
  tgp_governor_contract_event.0013.desc: "Buôn lậu muối là tội nghiêm trọng chống lại chính quyền, và thủ lĩnh băng nhóm này vừa bị bắt tại [salt_smugglers_destination.GetName]. Hắn yêu cầu gặp trực tiếp Ta, hứa tiết lộ vị trí băng nhóm để đổi lấy tự do của mình."
  tgp_governor_contract_event.0013.a: "Ta nên nghe đề nghị này."
  tgp_governor_contract_event.0013.a_tt: "Đi tới [salt_smugglers_destination.GetName] và xử lý kẻ phạm pháp."
  tgp_governor_contract_event.0013.b: "Trả lời kẻ phạm pháp là dưới phẩm giá của Ta."

  tgp_governor_contract_event.0004.t: "Buôn Lậu Muối"
  tgp_governor_contract_event.0004.desc: "Cùm tay có thể trói chặt đôi bàn tay của [salt_smuggler.GetNamePossessive], nhưng chúng chẳng làm gì được để trấn áp bản tính dối trá của kẻ buôn lậu. Thái độ của [salt_smuggler.GetHerHis] thật trơ trẽn không sợ hãi, như thể chúng ta là hai thương nhân đang mặc cả ngoài chợ chứ không phải quan tòa và tội phạm với mạng sống của kẻ sau đang treo lơ lửng.\n\n\"Phải, ta sẽ nói cho ngài biết phần còn lại của đồng bọn ta ở đâu, ngay khi ngài nới lỏng những thứ này,\" [salt_smuggler.GetSheHe] giơ đôi cổ tay bị trói của [salt_smuggler.GetHerHis] lên với một cái nhướng mày đầy ẩn ý về phía chúng, \"và đảm bảo cho ta con đường an toàn đến nơi mà chúng ta không bao giờ phải gặp lại nhau.\""
  tgp_governor_contract_event.0004.a: "Hành quyết [salt_smuggler.GetHerHim] - để #EMP hắn#! gửi thông điệp cho băng nhóm." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0004.b: "Được, nhưng đừng để Ta gặp lại."
  tgp_governor_contract_event.0004.c: "Ta sẽ thẩm vấn [salt_smuggler.GetHerHim]: chúng ta sẽ tóm được đồng bọn của [salt_smuggler.GetHerHis] theo điều kiện của ta."
  tgp_governor_contract_event.0004.d: "Vị trí của lợi lộc phi pháp có thể đổi lấy khoan hồng..."
  tgp_governor_contract_event.0004.e: "Ta có thể cần một [salt_smuggler.GetWomanMan] với kỹ năng của Ngài."

  task_contract_reward_effect_execute_smuggler_desc: "$label_success_standard$"
  task_contract_reward_effect_cut_a_deal_desc: "$label_success_standard$"
  task_contract_reward_effect_interrogate_smuggler_desc: "$label_success_standard$"
  task_contract_reward_effect_a_cut_of_the_take_desc: "$label_success_standard$"
  task_contract_reward_effect_recruit_smuggler_desc: "$label_success_standard$"

  hoarding_grain: "Tích Trữ Lương Thực"
  hoarding_grain_contract: "$hoarding_grain$"
  hoarding_grain_request: "Tình huống này cho phép Ngài chọn một kết quả"
  hoarding_grain_desc: "Một gia đình địa phương uy tín đã tích trữ lương thực và từ chối bán, đẩy giá lên cao, trong khi quan chức bị hăm dọa phải nhún nhường."
  hoarding_grain_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0014.t: "Tích Trữ Lương Thực"
  tgp_governor_contract_event.0014.desc: "Việc các gia đình giàu mua lương thực vượt nhu cầu không phải hiếm, nhưng Ta nhận tin một gia đình tại [hoarding_grain_destination.GetName] đã vượt mức thông thường.\n\nHọ tích trữ quá nhiều khiến giá lương thực tăng đến mức dân thường khó mua nổi."
  tgp_governor_contract_event.0014.a: "Sự hiện diện của Ta sẽ cần để giải quyết vấn đề."
  tgp_governor_contract_event.0014.a_tt: "Đi tới [hoarding_grain_destination.GetName] và giải quyết khan hiếm lương thực."
  tgp_governor_contract_event.0014.b: "Những việc quan trọng hơn nhiều mới cần sự chú ý của Ta."

  tgp_governor_contract_event.0005.t: "Tích Trữ Lương Thực"
  tgp_governor_contract_event.0005.desc: "Sự trang trí sang trọng của dinh thự [grain_hoarding_local_notable.GetNamePossessive] đối lập hoàn toàn với những túp lều tồi tàn mà chúng ta đã đi qua trên đường đến đây. Chủ nhà không hề giả vờ che giấu hay xem nhẹ các khoản thu gom của [grain_hoarding_local_notable.GetHerHis], thực tế là gần như tận hưởng chúng.\n\n\"Xin thứ lỗi cho sự thiếu hiểu biết của ta về các công việc nhà nước, nhưng ta không hiểu sự quan tâm của [ROOT.Char.GetLadyLord] về vấn đề này,\" [grain_hoarding_local_notable.GetSheHe] nói một cách xấc xược. \"Đây chỉ đơn giản là vấn đề giao dịch kinh doanh hợp pháp, và chắc chắn [ROOT.Char.GetLadyLord] của ta có những vấn đề cấp bách hơn để quan tâm...?\" Lời nói cuối cùng của [grain_hoarding_local_notable.GetHerHis] là một khẳng định hơn là một câu hỏi."
  tgp_governor_contract_event.0005.a: "Thả dự trữ lương thực chính phủ và tràn ngập thị trường." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0005.b: "Tham lam nhỏ nhen này có phải dưới phẩm giá của [grain_hoarding_local_notable.GetWomanMan] không?"
  tgp_governor_contract_event.0005.c: "Điều này hợp pháp, nhưng chắc #EMP có thể#! tìm ra điều bất hợp pháp."
  tgp_governor_contract_event.0005.d: "Nếu Ta đề nghị mua số lương thực này thì sao?"
  tgp_governor_contract_event.0005.e: "Ta có thể có vị trí cho Ngài, nếu Ngài hợp tác hơn."

  task_contract_reward_effect_release_the_grain_desc: "$label_success_standard$"
  task_contract_reward_effect_shame_them_desc: "$label_success_standard$"
  task_contract_reward_effect_intimidate_them_desc: "$label_success_standard$"
  task_contract_reward_effect_purchase_grain_yourself_desc: "$label_success_standard$"
  task_contract_reward_effect_bribe_with_offices_desc: "$label_success_standard$"

  doddering_magistrate: "Quan Lão Luyệt"
  doddering_magistrate_contract: "$doddering_magistrate$"
  doddering_magistrate_request: "Tình huống này cho phép Ngài chọn một kết quả"
  doddering_magistrate_desc: "Các thư ký trong quận này gửi thư cầu cứu rằng cấp trên già yếu của họ không còn đủ khả năng thực hiện nhiệm vụ."
  doddering_magistrate_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0015.t: "Quan Lão Luyệt"
  tgp_governor_contract_event.0015.desc: "Nguyên lý rằng tuổi già đem lại sự khôn ngoan dường như không đúng với các thư ký ở [doddering_magistrate_destination.GetName], những người đã nhiều lần gửi thư cầu cứu văn phòng Ta, mong rằng cấp trên của họ - đã ở tuổi cao - được tái bổ nhiệm hoặc loại bỏ."
  tgp_governor_contract_event.0015.a: "Đây là vấn đề tế nhị, Ta nên tự mình xử lý."
  tgp_governor_contract_event.0015.a_tt: "Đi tới [doddering_magistrate_destination.GetName] và đánh giá hiệu quả làm việc của viên chức."
  tgp_governor_contract_event.0015.b: "Không phải quyền của họ để nghi vấn cấp trên."

  tgp_governor_contract_event.0006.t: "Quan Lão Luyệt"
  tgp_governor_contract_event.0006.desc: "Cảm giác như ta có thể sống thêm một cuộc đời thứ hai trong thời gian mà viên chức già nua đứng dậy khỏi ghế ngồi [elderly_magistrate.GetHerHis] và thực hiện các lời chào hỏi theo phong tục.\n\nCái cúi chào chậm chạp [elderly_magistrate.GetHerHis|U] dường như gây cho [elderly_magistrate.GetHerHim] khó khăn ghê gớm, và [elderly_magistrate.GetSheHe] giữ tư thế đó lâu đến mức ta phải suy nghĩ liệu đó có phải là kết thúc của [elderly_magistrate.GetHerHim] ở đây và bây giờ không, trước khi hai thư lại vội vã tiến lên và giúp [elderly_magistrate.GetHerHim] đứng thẳng dậy.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U] đã ban cho ta quá nhiều vinh dự,\" [elderly_magistrate.GetSheHe] khàn giọng nói, giọng nói của [elderly_magistrate.GetHerHis] kêu cọt kẹt như một bánh xe ngựa cũ kỹ và mòn vẹt. \"Thần có thể phục vụ thế nào, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
  tgp_governor_contract_event.0006.a: "Giao nhiệm vụ cho người khác, nhưng vẫn giữ [elderly_magistrate.GetHerHim] tại vị trí." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0006.b: "Tuổi tác của [elderly_magistrate.GetHerHis|U] đã làm giảm khả năng của [elderly_magistrate.GetHerHis]: ép [elderly_magistrate.GetHerHim] rời khỏi chức vụ."
  tgp_governor_contract_event.0006.c: "Vị [elderly_magistrate.GetWomanMan] này đã quá hạn thăng tiến! Ở một nơi nào đó #EMP không ai để ý#!..."
  tgp_governor_contract_event.0006.d: "Hãy để [elderly_magistrate.GetHerHim] tiếp tục. Nhà nước sẽ sống lâu hơn [elderly_magistrate.GetHerHim]."
  tgp_governor_contract_event.0006.e: "[elderly_magistrate.GetSheHe|U] có thể tiếp tục làm việc, nhưng với vai trò thư ký khiêm tốn."

