  quaking_in_panic: "Hoảng Loạn Sau Động Đất"
  quaking_in_panic_contract: "$quaking_in_panic$"
  quaking_in_panic_request: "Tình huống này cho phép Ngài chọn kết quả"
  quaking_in_panic_desc: "Một số làng bị động đất và sự hoảng loạn đang đe dọa trật tự công cộng."
  quaking_in_panic_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0030.t: "Hoảng Loạn Sau Động Đất"
  tgp_governor_contract_event.0030.desc: "Ta đang trò chuyện với [my_councillor.GetFirstName] khi [alarmed_councillor.GetFirstName] lao vào phòng với vẻ hốt hoảng, run rẩy.\n\n\"Một sứ giả từ [quaking_in_panic_destination.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]! Động đất vừa xảy ra và nông dân coi đó là điềm xấu, nói rằng đây là dấu hiệu của sự không hài lòng thần thánh!\""
  tgp_governor_contract_event.0030.a: "Hoảng loạn như cháy rừng, khó dập tắt nếu để lan rộng."
  tgp_governor_contract_event.0030.a_tt: "Đi đến [quaking_in_panic_destination.GetName] và xoa dịu mối lo của họ."
  tgp_governor_contract_event.0030.b: "Ta ít quan tâm đến sự ồn ào của nông dân."

  tgp_governor_contract_event.0031.t: "Hoảng Loạn Sau Động Đất"
  tgp_governor_contract_event.0031.desc: "Làng trong tình trạng rõ ràng bất ổn khi Ta đến, nông dân tụ tập quanh đoàn hộ tống cầu xin chúng Ta xoa dịu cơn thịnh nộ của Trời trước khi thảm họa khác xảy ra.\n\nNhìn quanh làng, những bức tường nứt nẻ và cửa nhà xiêu vẹo minh chứng cho nguồn gốc nỗi sợ của họ."
  tgp_governor_contract_event.0031.a: "Tổ chức cuộc họp công khai để trấn an dân chúng." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0031.b: "Triển khai một đội quân nhỏ để dập tắt bất ổn."
  tgp_governor_contract_event.0031.c: "Để trưởng làng thể hiện sự tin tưởng rằng nguy hiểm đã qua."
  tgp_governor_contract_event.0031.d: "Kiểm tra kỹ lưỡng thiệt hại và hứa hỗ trợ thêm."
  tgp_governor_contract_event.0031.e: "Di dời những người chịu ảnh hưởng nặng nhất và tập hợp dân cư khu vực."

