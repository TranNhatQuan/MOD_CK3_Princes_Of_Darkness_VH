  monopoly_in_the_marketplace: "Độc Quyền Thị Trường"
  monopoly_in_the_marketplace_contract: "$monopoly_in_the_marketplace$"
  monopoly_in_the_marketplace_request: "Tình huống này cho phép Ngài chọn kết quả"
  monopoly_in_the_marketplace_desc: "Một thương nhân quyền lực đang thống trị thị trường và hội thương nhân địa phương yêu cầu nhà nước can thiệp."
  monopoly_in_the_marketplace_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0032.t: "Độc Quyền Thị Trường"
  tgp_governor_contract_event.0032.desc: "\"...và nếu chuyện này tiếp tục, hậu quả sẽ #EMP tàn khốc#! đối với sinh kế của chúng ta,\" trưởng đoàn kết luận.\n\nTheo lập luận họ trình bày, một đối thủ ở [monopoly_in_the_marketplace_destination.GetName] đã âm thầm chiếm quyền kiểm soát thị trường chính và ngăn cản bất kỳ thành viên nào của hiệp hội họ tiếp cận, đẩy họ vào những vị trí kém phổ biến và vô cùng thua lỗ."
  tgp_governor_contract_event.0032.a: "Ta sẽ trực tiếp giải quyết chuyện này."
  tgp_governor_contract_event.0032.a_tt: "Đi đến [monopoly_in_the_marketplace_destination.GetName] và sắp xếp lại thị trường theo ý Ngài."
  tgp_governor_contract_event.0032.b: "Ta không thấy gì khác thường ngoài một thương nhân thành công."

  tgp_governor_contract_event.0033.t: "Độc Quyền Thị Trường"
  tgp_governor_contract_event.0033.desc: "Mặc dù hiếm khi là những tấm gương trung thực, lời của các thương nhân dường như đúng trong trường hợp này.\n\nKhi chúng ta đi dạo kín đáo từ gian hàng này sang gian hàng khác, tất cả cho đến nay đều được đóng dấu nổi bật cùng một nhãn hiệu, xác định chúng là tài sản chung của một chủ sở hữu duy nhất.\n\nGian hàng cuối cùng chúng ta tiếp cận là gian hàng lớn nhất và công phu nhất trong số đó, và vị [merchant_magnate.GetWomanMan] uy nghi chủ trì nó mỉm cười tự hào. Đây, rõ ràng, là đối thủ mà họ đã nói đến."
  tgp_governor_contract_event.0033.a: "Không để bất kỳ thương nhân nào sở hữu hơn một gian hàng." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0033.b: "Mở rộng chợ và đấu giá gian hàng mới chỉ cho thành viên hiệp hội."
  tgp_governor_contract_event.0033.c: "[merchant_magnate.GetSheHe|U] có thể tiếp tục, nếu [merchant_magnate.GetSheHe] sẵn sàng #EMP trả#! cho đặc quyền này."
  tgp_governor_contract_event.0033.d: "Chúng Ta sẽ ủng hộ đối thủ của [merchant_magnate.GetHerHis] và để tự nhiên xử lý."
  tgp_governor_contract_event.0033.e: "Người giàu thế này hẳn phải phạm #EMP điều gì đó#!. Tịch thu hàng hóa của [merchant_magnate.GetHerHis]!"

