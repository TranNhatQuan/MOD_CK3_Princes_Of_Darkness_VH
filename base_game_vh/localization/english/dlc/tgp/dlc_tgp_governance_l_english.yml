  tgp_governor_contract_event.2000.t: "$missing_equipment$"
  tgp_governor_contract_event.2000.desc: "Đã #EMP vài tuần#! kể từ khi lô trang bị mới dự kiến đến. Tin tức về nơi lô hàng có thể đang ở vẫn chưa tới tay Ta.\n\nPhần lớn gươm, nỏ, mũi tên và giáp đều được sản xuất tại các xưởng ở [capital_location.GetNameNoTooltip], nơi sử dụng hàng nghìn nhân công. Chỉ họ mới có thể cung cấp đủ số lượng chúng ta cần.\n\nNếu thiếu những lô hàng này, chúng ta không thể trang bị cho tân binh hay thay thế vũ khí và giáp hao mòn."
  tgp_governor_contract_event.2000.a: "Hãy đến thăm các xưởng sản xuất."
  tgp_governor_contract_event.2000.a_tt: "Đi đến xưởng và giải quyết vấn đề trực tiếp"
  tgp_governor_contract_event.2000.b: "Ta luôn có thể tự mua trang bị."
  tgp_governor_contract_event.2000.c: "Gửi thư đến [capital_location.GetNameNoTooltip]. Vấn đề sẽ được giải quyết sớm thôi."
 
  tgp_governor_contract_event.2001.t: "$missing_equipment$: Xưởng Sản Xuất"
  tgp_governor_contract_event.2001.desc: "Người quản đốc xưởng #EMP cuối cùng#! đã đến, cúi chào Ta với một cái cúi sâu và trang nghiêm.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thật bất ngờ khi được viếng thăm. Ta đã xem lại sổ sách như yêu cầu, và có vẻ một lỗi văn thư là nguyên nhân khiến lô hàng chưa tới [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Một sai sót không may. Chúng Ta sẽ, tất nhiên, chuyển lô hàng tiếp theo đến cho ngài.\""
  tgp_governor_contract_event.2001.a: "Một #EMP lỗi văn thư#!? [court_relation.GetFirstNameNoTooltip] sẽ phải biết chuyện này..."
  tgp_governor_contract_event.2001.a.tt: "Ngài thuyết phục thành công quản đốc bằng cách đe dọa đưa vụ việc lên [court_relation.GetShortUIName] tại triều đình"
  tgp_governor_contract_event.2001.b: "Chắc chắn nên có một khoản bồi thường thêm?"
  tgp_governor_contract_event.2001.c: "Sẽ thật không may nếu chuyện này bị công khai, đúng không?"
  tgp_governor_contract_event.2001.d: "Được rồi. Hãy đảm bảo điều đó xảy ra."
  tgp_governor_contract_event.2001.tt_success_desc: "Quản đốc đã bị thuyết phục"
  tgp_governor_contract_event.2001.tt_success: "Ngài thành công thuyết phục quản đốc cung cấp nhiều hơn"
  tgp_governor_contract_event.2001.tt_failure_desc: "Quản đốc #bold không#! bị thuyết phục"
  tgp_governor_contract_event.2001.tt_failure: "Ngài thất bại trong việc thuyết phục quản đốc làm nhiều hơn những gì đã hứa"
 
  tgp_governor_contract_event.2002.t: "$missing_equipment$: Thành công"
  tgp_governor_contract_event.2002.desc: "Những lời đe dọa không tinh tế của Ta nhanh chóng được đáp lại bằng một cái cúi sâu hơn. Quản đốc, mồ hôi lấm tấm, đứng lên chậm rãi.\n\n\"Tất nhiên rồi, [ROOT.Char.GetLadyLord]. Ngài hoàn toàn đúng. Ta chắc chúng ta có thể đạt được thỏa thuận. Có lẽ ngài đã có đề xuất?\""
  tgp_governor_contract_event.2002.a: "Hãy đảm bảo các lô hàng trong tương lai."
  tgp_governor_contract_event.2002.b: "Cung cấp cho Ta #EMP hai#! lô hàng tiếp theo."
  tgp_governor_contract_event.2002.c: "Cần có bồi thường tiền bạc."
  tgp_governor_contract_event.2002.d: "Gửi cho Ta trang bị tốt nhất hiện có."
 
  tgp_governor_contract_event.2003.t: "$missing_equipment$: Thất bại"
  tgp_governor_contract_event.2003.desc: "Quản đốc ngừng lại một lúc và cau mày.\n\n\"#EMP Ngài#! không phải là chỉ huy duy nhất cần trang bị. Ta đã làm quá đủ bằng việc cung cấp lô hàng tiếp theo cho ngài. Một lô hàng dự kiến nơi khác, xin nhớ. Đừng thử vận may, #EMP my [ROOT.Char.GetLadyLord]#!\"\n\n[foreman.GetWomanMan] quay đi và bỏ đi."
  tgp_governor_contract_event.2003.a: "#EMP Được thôi.#!"

  lines_in_the_soil: "Ranh Giới Đất"
  lines_in_the_soil_contract: "$lines_in_the_soil$"
  lines_in_the_soil_request: "Tình huống này cho phép Ngài chọn kết quả"
  lines_in_the_soil_desc: "Một cặp địa chủ nổi bật liên tục gửi khiếu nại đến tòa án về một tranh chấp đất đai."
  lines_in_the_soil_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0020.t: "Ranh Giới Đất"
  tgp_governor_contract_event.0020.desc: "Cuộc sống hàng ngày của một [ROOT.Char.GetTitleTierName] đòi hỏi rất nhiều giấy tờ, nhưng rõ ràng có gì đó không ổn khi hầu hết thư từ hôm nay đều xuất phát từ [lines_in_the_soil_destination.GetName].\n\nXem xét các báo cáo, có vẻ hai địa chủ địa phương đã 'khóa sừng' về một mảnh đất kẹp giữa họ, biến văn phòng tòa án địa phương thành một chiến trường pháp lý."
  tgp_governor_contract_event.0020.a: "Ta #EMP có thể#! cần nghỉ ngơi khỏi văn phòng."
  tgp_governor_contract_event.0020.a_tt: "Đi đến [lines_in_the_soil_destination.GetName] và hòa giải tranh chấp."
  tgp_governor_contract_event.0020.b: "Để thư khiếu nại của họ phủ bụi, họ sẽ nhanh chóng chán thôi."

  tgp_governor_contract_event.0021.t: "Ranh Giới Đất"
  tgp_governor_contract_event.0021.desc: "Sau hàng giờ tranh luận, cãi vã, và những lời công kích mỏng tang, Ta chỉ có thể kết luận rằng những cá nhân trong trung tâm tranh chấp này là những #EMP kẻ cứng đầu, lẩm cẩm#!.\n\nRõ ràng đây chỉ là chương mới nhất trong lịch sử dài các khiếu nại, và không ai chịu nhường mảnh đất cho đối phương.\n\nNếu Ta muốn chấm dứt cuộc tranh cãi không ngừng này, Ta không còn cách nào khác ngoài việc giải quyết nó như thẩm phán, chứ không phải trọng tài."
  tgp_governor_contract_event.0021.a: "Cho đo lại đất và kết quả sẽ là cuối cùng." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0021.b: "Tra cứu hồ sơ để tìm ai có quyền lợi tốt hơn."
  tgp_governor_contract_event.0021.c: "Chia đất đều và coi như xong."
  tgp_governor_contract_event.0021.d: "Nếu Ta đề nghị mua lại đất thì sao?"
  tgp_governor_contract_event.0021.e: "Nếu không đạt được thỏa thuận, đất sẽ trở thành tài sản nhà nước."

