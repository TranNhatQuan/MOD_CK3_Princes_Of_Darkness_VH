  unsafe_highways_request: "Tình huống này cho phép Ngài chọn một kết quả"
  unsafe_highways_desc: "Thương nhân phàn nàn, cho rằng đường đi nguy hiểm, đe dọa tìm thị trường mới nếu không giải quyết."
  unsafe_highways_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0008.t: "Giao Thương Nguy Hiểm"
  tgp_governor_contract_event.0008.desc: "Đoàn thương nhân do [fearful_merchant.GetName] dẫn đầu chen chúc phòng Ta, giọng họ đầy lo lắng, yêu cầu bảo vệ đoàn sau khi một đoàn khác bị cướp. 'Tình hình này không thể chấp nhận, [ROOT.Char.Custom('FormOfAddressForLiege')],' lãnh đạo tuyên bố.\n\n'Nếu không bảo vệ hàng hóa và mạng sống khỏi bọn cướp, chúng Ta sẽ bỏ [unsafe_highways_destination.GetName] và đem thương mại - cùng các khoản phí - đi nơi khác.' [fearful_merchant.GetSheHe|U] đứng chờ, tuyên bố rõ ràng."
  tgp_governor_contract_event.0008.a: "Chúng Ta sẽ cung cấp hộ tống, nhưng các ngài trả phí." # (Tùy chọn đặc biệt của quan)
  tgp_governor_contract_event.0008.b: "Ta hiểu. Chúng Ta sẽ cử tuần tra bảo vệ đường."
  tgp_governor_contract_event.0008.c: "Thương mại của các ngài nguy hiểm: chẳng phải các ngài đã có bảo vệ sao?"
  tgp_governor_contract_event.0008.d: "Sẽ thật #EMP không may#! nếu thuế của các ngài cần xem xét..."
  tgp_governor_contract_event.0008.e: "Nguy hiểm đi kèm phần thưởng - hãy ở lại, Ta sẽ bù đắp xứng đáng."

