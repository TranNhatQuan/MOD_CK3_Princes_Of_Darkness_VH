  tgp_governor_contract_event.0035.c.success: "Các người thừa kế đấu giá, đúng nghĩa, để lấy lòng Ngài"
  tgp_governor_contract_event.0035.c.failure: "Không ai chịu lợi dụng lòng tham của Ngài"

  tgp_governor_contract_event.0035.c.toast_success: "Các đấu giá diễn ra nhanh chóng và rõ ràng có lợi cho Ngài"
  tgp_governor_contract_event.0035.c.toast_failure: "Không ai trong các người thừa kế nghe theo gợi ý của Ngài"

