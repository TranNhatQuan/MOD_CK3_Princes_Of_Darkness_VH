  fraud_in_broad_daylight: "Gian Lận Ban Ngày"
  fraud_in_broad_daylight_contract: "$fraud_in_broad_daylight$"
  fraud_in_broad_daylight_request: "Tình huống này cho phép Ngài chọn kết quả"
  fraud_in_broad_daylight_desc: "Chợ nơi đây đầy hàng giả và người mua bị lừa phẫn nộ."
  fraud_in_broad_daylight_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0022.t: "Gian Lận Ban Ngày"
  tgp_governor_contract_event.0022.desc: "Tiếng thùng rơi xuống sàn làm Ta giật mình, dừng công việc. [reporting_councillor.GetTitledFirstName] đứng bên cạnh.\n\n\"Bằng chứng mới đã đến, [ROOT.Char.GetLadyLord]. Lần này là lọ nước hoa, bên trong chứa đất.\" \n\nCác chợ ở [fraud_in_broad_daylight_destination.GetName] gần đây đầy hàng giả."
  tgp_governor_contract_event.0022.a: "Việc này cần được điều tra."
  tgp_governor_contract_event.0022.a_tt: "Đi đến [fraud_in_broad_daylight_destination.GetName] và khôi phục trật tự thị trường."
  tgp_governor_contract_event.0022.b: "Những khách hàng này chỉ là kẻ ngốc."

  tgp_governor_contract_event.0023.t: "Gian Lận Ban Ngày"
  tgp_governor_contract_event.0023.desc: "Dù đã cố gắng hết sức, việc nhận diện kẻ làm giả khó hơn dự tính.\n\nCác thương nhân chính thống, khi hết hàng, cho thuê chỗ cho người khác trong phần còn lại của ngày, cho phép kẻ gian bán hàng giả và biến mất mà không dấu vết."
  tgp_governor_contract_event.0023.a: "Kiểm tra mọi người trong chợ và giữ những kẻ khả nghi." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0023.b: "Treo thưởng cho thông tin."
  tgp_governor_contract_event.0023.c: "Cử quan viên cải trang làm người mua."
  tgp_governor_contract_event.0023.d: "Để thương nhân tự xử lý."
  tgp_governor_contract_event.0023.e: "Quét chợ vào buổi trưa!"
 
  task_contract_reward_effect_goods_inspection_desc: "$label_success_standard$"
  task_contract_reward_effect_reward_for_information_desc: "$label_success_standard$"
