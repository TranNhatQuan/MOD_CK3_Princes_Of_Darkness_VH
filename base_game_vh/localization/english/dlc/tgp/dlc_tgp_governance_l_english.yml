  crumbling_bridge: "Cầu Đổ Nát"
  crumbling_bridge_contract: "$crumbling_bridge$"
  crumbling_bridge_request: "Tình huống này cho phép Ngài chọn kết quả"
  crumbling_bridge_desc: "Một cây cầu quan trọng đã sập, làm giao thông địa phương bị tắc nghẽn nghiêm trọng."
  crumbling_bridge_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0024.t: "Cầu Đổ Nát"
  tgp_governor_contract_event.0024.desc: "Một trong những trách nhiệm quan trọng của [ROOT.Char.GetTitleTierNamePossessive] là bảo trì cơ sở hạ tầng thiết yếu, vì vậy tin tức về cây cầu sập ở [crumbling_bridge_destination.GetName] càng đáng lo ngại.\n\nĐiều này không chỉ ảnh hưởng đến thương mại và giao thông, mà còn có thể làm suy giảm niềm tin vào chính quyền của Ta."
  tgp_governor_contract_event.0024.a: "Bảo họ chuẩn bị cho sự có mặt của Ta. Ta đến ngay."
  tgp_governor_contract_event.0024.a_tt: "Đi đến [crumbling_bridge_destination.GetName] và xử lý hậu quả."
  tgp_governor_contract_event.0024.b: "Luôn có cây cầu khác: họ chỉ cần đi xa hơn."

  tgp_governor_contract_event.0025.t: "Cầu Đổ Nát"
  tgp_governor_contract_event.0025.desc: "Nhìn xuống tàn tích cầu đổ, tình hình thật nghiêm trọng. Trong khi công nhân cố gắng dọn đống đổ nát, đám thương nhân và khách đi đường tiếp tục đổ về do chưa biết sự cố.\n\nKhi hàng hóa hư hỏng và cơn giận nổi lên giữa những người bị kẹt, hậu quả của sự cố có thể rất lớn nếu không xử lý khéo."
  tgp_governor_contract_event.0025.a: "Đường là động mạch quốc gia: cho quân giúp xây lại." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0025.b: "Dùng mọi nguồn lực để xây cầu mới nhanh nhất có thể."
  tgp_governor_contract_event.0025.c: "Thiết lập phà tạm cho đến khi cầu được xây lại."
  tgp_governor_contract_event.0025.d: "Vội vàng chỉ dẫn đến tai nạn khác. Xây cầu thay thế vững chắc."
  tgp_governor_contract_event.0025.e: "Tận dụng cơ hội thuyết phục thương nhân bị kẹt mở cửa hàng."

  task_contract_reward_effect_army_assistance_desc: "$label_success_standard$"
  task_contract_reward_effect_temporary_substitute_desc: "$label_success_standard$"
  task_contract_reward_effect_ferry_crossing_desc: "$label_success_standard$"
  task_contract_reward_effect_slower_replacement_desc: "$label_success_standard$"
  task_contract_reward_effect_settle_caravans_desc: "$label_success_standard$"

  task_contract_reward_effect_failure_settle_caravans_desc: "$label_failure_standard$"

  confusion_of_tongues: "Lúng Túng Ngôn Ngữ"
  confusion_of_tongues_contract: "$confusion_of_tongues$"
  confusion_of_tongues_request: "Tình huống này cho phép Ngài chọn kết quả"
  confusion_of_tongues_desc: "Một tàu thương thuyền nước ngoài đã đắm trên bờ của chúng ta và không ai trong số những người sống sót hiểu tiếng của chúng ta."
  confusion_of_tongues_desc_title: "$task_contract_governance_desc_title$"

  tgp_governor_contract_event.0026.t: "Lúng Túng Ngôn Ngữ"
  tgp_governor_contract_event.0026.desc: "Các thương nhân từ xứ xa, tất nhiên, bị thu hút bởi sự thịnh vượng của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] vĩ đại của chúng ta, vượt qua khoảng cách xa xôi và vô số hiểm nguy để tìm kiếm của cải.\n\nNhưng hiểm nguy quá lớn với một số người không may, như vừa xảy ra ở [confusion_of_tongues_destination.GetName]. Ta được biết một tàu nước ngoài đã vỡ trên bờ, và người phiên dịch của thủy thủ đoàn không còn sống sót.\n\nTòa án địa phương hoàn toàn bối rối không biết xử lý những người nước ngoài lạc lõng và hoang mang này thế nào."
  tgp_governor_contract_event.0026.a: "Công việc của [ROOT.Char.GetTitleTierNamePossessive] chưa bao giờ kết thúc."
  tgp_governor_contract_event.0026.a_tt: "Đi đến [confusion_of_tongues_destination.GetName] và gặp các thương nhân nước ngoài."
  tgp_governor_contract_event.0026.b: "Nghe có vẻ phiền phức: cứ để họ ở nguyên đó."

  tgp_governor_contract_event.0027.t: "Lúng Túng Ngôn Ngữ"
  tgp_governor_contract_event.0027.desc: "Khi Ta tới, quan tòa rõ ràng đã kiệt sức và bối rối. \"Không một ai trong số họ hiểu một lời nào Ta nói!\" ông than thở. \"Và mỗi lần chúng Ta cố di chuyển họ, họ phản ứng như thể chúng Ta là cướp!\"\n\nGần đó, Ta thấy các thương nhân bị đắm tàu tụ tập phòng thủ quanh những gì còn lại của hàng hóa, lính canh của họ nắm chặt cán vũ khí."
  tgp_governor_contract_event.0027.a: "Dựng lều tạm và báo cho kinh đô: họ sẽ tìm phiên dịch." # (Tùy chọn đặc biệt của thống đốc)
  tgp_governor_contract_event.0027.b: "Quay lại xem có ai ở chợ hiểu họ không."
  tgp_governor_contract_event.0027.c: "Tàu của họ bị đắm trên #EMP bờ chúng ta#!, tức là hàng hóa của họ sẽ bị tịch thu."
  tgp_governor_contract_event.0027.d: "Lời nói có thể thất bại, nhưng Ta có thể cố gắng giao tiếp bằng cử chỉ."
  tgp_governor_contract_event.0027.e: "Chỉ cần đưa họ đi nơi khác, dùng vũ lực nếu cần."
  tgp_governor_contract_event.0027.f: "$epidemic_events.5902.a$"

