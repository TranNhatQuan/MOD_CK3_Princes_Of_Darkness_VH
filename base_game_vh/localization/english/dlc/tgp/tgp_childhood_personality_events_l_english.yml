l_english:
  tgp_child_personality.0002.t: "Hoàn cảnh Khốn khó"
  tgp_child_personality.0002.guardian: "Trở về nhà sau một chuyến ra ngoài với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName], Ta thấy một người đàn ông hoảng loạn, bộ áo choàng tả tơi đến mức gần như chỉ còn là rách rưới.\n\nĐôi mắt đầy mệt mỏi, gương mặt hốc hác vì thiếu thốn, người đàn ông tuyệt vọng van xin người qua đường cho nước. Khi thấy chúng Ta, anh ta lảo đảo tiến về phía Ta, tay giơ ra cầu xin giúp đỡ."
  tgp_child_personality.0002.no_guardian: "Trở về nhà sau một chuyến ra ngoài, Ta thấy một người đàn ông hoảng loạn, bộ áo choàng tả tơi đến mức gần như chỉ còn là rách rưới.\n\nĐôi mắt đầy mệt mỏi, gương mặt hốc hác vì thiếu thốn, người đàn ông tuyệt vọng van xin người qua đường cho nước. Khi thấy chúng Ta, anh ta lảo đảo tiến về phía Ta, tay giơ ra cầu xin giúp đỡ."
  tgp_child_personality.0002.a: "Sao dám nhìn chúng Ta chứ!"
  tgp_child_personality.0002.b: "Chúng ta có thể cho người đàn ông tội nghiệp ít nước không?"
  tgp_child_personality.0002.c: "Nước? Cho hắn nắm bùn này đi!"

 # deceitful, honest or humble
  tgp_child_personality.0003.t: "Vinh dự Không xứng"
  tgp_child_personality.0003.desc: "[guardian.GetFullName] tự hào ca ngợi tiến bộ của Ta trong việc hiểu [ROOT.Char.GetFaith.ReligiousText] với vài người hầu của [guardian.GetHerHis], đọc thuộc từng chương - bao gồm cả những chương mà Ta chắc chắn chưa học!\n\nTa cảm thấy mặt mình nóng bừng dưới ánh nhìn tán thưởng, cảm giác tội lỗi và vui sướng giằng co trong lương tâm Ta."
  tgp_child_personality.0003.a: "Nếu Ta sửa [guardian.GetHerHim], họ sẽ không vui nữa." # deceitful
  tgp_child_personality.0003.b: "Thật thà quan trọng hơn là được khen." # honest
  tgp_child_personality.0003.c: "Ta nên sửa [guardian.GetHerHim] riêng để giữ thể diện cho [guardian.GetHerHim]." # humble

 # generous, diligent or patient
  tgp_child_personality.0004.t: "Thiếu Dạy dỗ"
  tgp_child_personality.0004.desc: "Giờ học hàng ngày của Ta đã trôi qua, rồi giờ kế tiếp cũng vậy, nhưng [guardian.GetFullName] vẫn chưa xuất hiện.\n\nNhìn ra cửa sổ, Ta thấy các Bạn Bè bận rộn hăng hái, trong khi chờ đợi ở đây thật buồn chán."
  tgp_child_personality.0004.a: "Có lẽ Ta nên giúp họ thay!" # generous
  tgp_child_personality.0004.b: "Ta có thể học đến khi [guardian.GetSheHe] tới!" # diligent
  tgp_child_personality.0004.c: "[guardian.GetSheHe|U] sẽ tới thôi; Ta nên kiên nhẫn." # patient

 # just, cynical or temperate
  tgp_child_personality.0007.t: "Phân phần Không công bằng"
  tgp_child_personality.0007.desc: "Lén lút vào phòng Bạn Bè để xem họ làm gì, Ta không khỏi nhận thấy rằng phần thức ăn cho những Bạn Bè cao cấp luôn lớn hơn nhiều so với những người cấp dưới.\n\nSự bất công là rõ ràng, nhưng các Bạn Bè dường như đều chấp nhận mà không than phiền."
  tgp_child_personality.0007.a: "Điều này thật công nhiên bất công!" # just
  tgp_child_personality.0007.b: "Cuộc sống hiếm khi công bằng với kẻ thấp kém." # cynical
  tgp_child_personality.0007.c: "Có lẽ chúng ta nên tiết chế bữa ăn của mình." # temperate

 # brave, calm or zealous
  tgp_child_personality.0009.t: "Tiếng ồn Ban đêm"
  tgp_child_personality.0009.desc: "Ta giật mình tỉnh giấc vào giờ hổ, nghe thấy tiếng động lớn và xào xạc từ bóng tối ngay ngoài cửa sổ phòng ngủ.\n\nCó gì đó ngoài kia, và nó đang di chuyển!\n\nTa suy nghĩ mọi khả năng, mỗi khả năng đáng sợ hơn khả năng trước."
  tgp_child_personality.0009.a: "Nếu là quái vật, Ta sẽ giết nó!" # Brave
  tgp_child_personality.0009.b: "Chắc chỉ là một trong các Bạn Bè." # Calm
  tgp_child_personality.0009.c: "[ROOT.Char.GetFaith.ReligiousText] nói gì về nỗi sợ nhỉ?" # Zealous

 # ambitious, sadistic or paranoid
  tgp_child_personality.0010.t: "Gánh nặng Kỳ vọng"
  tgp_child_personality.0010.desc: "Đó là cùng một điệp khúc trong mỗi bài học, mỗi lần - luôn là \"[guardian.GetTitledFirstName] đã học được điều này chỉ trong một nửa thời gian khi [guardian.GetHerHis] còn trẻ!\" hoặc \"Con nên hy vọng sẽ giỏi bằng [guardian.GetTitledFirstName] khi con lớn lên.\"\n\nMọi việc con làm, dù tốt đến đâu, đều liên tục bị đem ra so sánh với thành tựu của người khác."
  tgp_child_personality.0010.a: "Ta #EMP sẽ#! vượt qua [guardian.GetHerHim]!" # Ambitious
  tgp_child_personality.0010.b: "Một ngày nào đó, Ta sẽ khiến người khác thấy nhỏ bé." # Sadistic
  tgp_child_personality.0010.c: "Liệu họ có thật sự #EMP muốn#! Ta thành công?" # Paranoid

 # diligent, gregarious, temperate
  tgp_child_personality.7000.t: "Lịch Trình Mở"
  tgp_child_personality.7000.desc: "Ta đang chờ bắt đầu bài học thư pháp khi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] bước vào phòng với bước đi chậm rãi và nét mặt bí ẩn.\n\n\"Có việc bất ngờ, hôm nay chúng ta phải hủy bài học,\" [guardian.GetSheHe] nói chắc chắn. \"Ngài muốn làm gì thay thế?\"\n\nÁnh mắt trông đợi trên gương mặt [guardian.GetHerHis] khiến Ta biết đây là một câu hỏi khó có đáp án đúng."
  tgp_child_personality.7000.a: "Ta sẽ tận dụng cơ hội này để học nhiều hơn!" # Diligent
  tgp_child_personality.7000.b: "Ta có thể đi gặp Bạn Bè không?" # Gregarious
  tgp_child_personality.7000.c: "Ta nên nghỉ ngơi và dành cả ngày trong yên tĩnh." # Temperate
 
 # eccentric, compassionate, callous
  tgp_child_personality.7300.t: "Cánh Chim Gãy"
  tgp_child_personality.7300.desc: "Đi qua sân, Ta nghe thấy tiếng xào xạc dưới một bụi cây; dùng một cành cây gãy quét lá sang một bên, Ta thấy một chú chim nhỏ nhảy tới nhảy lui, một cánh bị lệch một cách rõ ràng."
  tgp_child_personality.7300.a: "Nếu Ta giữ nó, Ta có thể học nói chuyện với chim!" # Eccentric
  tgp_child_personality.7300.b: "Ta nên nhờ các Bạn Bè chăm sóc nó." # Compassionate
  tgp_child_personality.7300.c: "Ai thèm quan tâm mấy con chim ngu ngốc kia?" # Callous

 # zealous, ambitious, sadistic
  tgp_child_personality.7010.t: "Lời Nói Xuyên Tạc"
  tgp_child_personality.7010.desc: "Ta chuẩn bị bước vào đại sảnh để dâng lễ hàng ngày thì nghe thấy tiếng nói bên trong.\n\nTay Ta lơ lửng không quyết định trước cửa, nghe một giọng đọc trích dẫn từ [ROOT.Char.GetFaith.ReligiousText] - vốn từng khiến Ta được khen về sự tinh tế trong hiểu biết - nhưng giờ nghe bị dùng sai hoàn toàn đến mức Ta khó tin vào tai mình."
  tgp_child_personality.7010.a: "Sao họ có thể làm #EMP sai# [ROOT.Char.GetFaith.ReligiousText] như thế chứ!!?" # Zealous
  tgp_child_personality.7010.b: "Nếu người lớn ngu dốt vậy, Ta sẽ tiến xa trong đời." # Ambitious
  tgp_child_personality.7010.c: "Ta nóng lòng muốn thấy sự ngu dốt này bị phơi bày!" # Sadistic
 
 #shy, paranoid, craven
  tgp_child_personality.7020.t: "Ý Định Bí Ẩn"
  tgp_child_personality.7020.desc: "Đi qua gần cổng nhà, Ta nghe thấy những giọng nói lạ, liếc qua góc nhìn thấy những gương mặt lạ bên ngoài.\n\nMột người trong số họ quay lại và mắt chúng Ta gặp nhau, anh ta bước về phía Ta; tim đập nhanh, Ta vội núp lại khỏi tầm nhìn."
  tgp_child_personality.7020.a: "Ta không thích người lạ: phải đi thôi!" # Shy
  tgp_child_personality.7020.b: "Nhìn vào mắt họ; không thể tin được." # Paranoid
  tgp_child_personality.7020.c: "Nếu họ có vũ khí thì sao? Họ có thể làm hại chúng ta!" # Craven

 # just, greedy, callous
  tgp_child_personality.7050.t: "Mất Và Tìm"
  tgp_child_personality.7050.desc: "Ta đang tìm một cuốn sách khi ánh sáng phản chiếu từ một vật kim loại nhỏ hấp dẫn dưới bàn thu hút ánh mắt Ta.\n\nTrông giống một chiếc hộp gỗ sơn nhỏ, Ta nghĩ mình đã thấy một chiếc tương tự trong phòng nghiên cứu của chủ nhân. Ai đó chắc chắn sẽ nổi giận nếu biết Bạn Bè làm mất!"
  tgp_child_personality.7050.a: "Ta sẽ trả lại để họ không gặp rắc rối!" # Just
  tgp_child_personality.7050.b: "Nếu Ta giấu, nó sẽ là kho báu bí mật của riêng Ta!" # Greedy
  tgp_child_personality.7050.c: "Họ sẽ phải chịu vì điều này, và xứng đáng." # Callous

 # brave, stubborn, wrathful
  tgp_child_personality.7200.t: "Quyết Tâm Kiên Cường"
  tgp_child_personality.7200.desc: "Một Bạn Bè hay quên, một cánh cửa để hờ, và Ta ở ngoài! Ta vừa kịp tận hưởng tự do mới thì tiếng gầm thấp làm Ta giật mình.\n\nQuay chậm sang phải, Ta nhìn thẳng vào mắt một con chó to gần bằng Ta, không thấy nó thuộc bất kỳ thành viên nào trong nhà.\n\nĐằng sau Ta, Ta nghe một Bạn Bè hét: \"Chạy đi, trẻ con! Vào nhà ngay, nhanh lên!\""
  tgp_child_personality.7200.a: "Ta sẽ không chạy - Ta không phải hèn nhát!" # Brave
  tgp_child_personality.7200.b: "Nếu nó không nhường, Ta cũng sẽ không!" # Stubborn
  tgp_child_personality.7200.c: "Một con chó dại dám há răng với #EMP Ta#!?" # Wrathful

 # vengeful, deceitful, calm
  tgp_child_personality.7070.t: "Lời Nói Cay Đắng"
  tgp_child_personality.7070.desc: "\"Vô dụng!\"\n\nNhững lời thét vang của [guardian.GetNamePossessive] lan khắp nhà.\n\n\"Đần độn vô dụng!\" Mở hé cửa phòng [guardian.GetHerHis], Ta thấy một Bạn Bè quỳ gục trước mặt [guardian.GetHerHim], run rẩy trước cơn giận đỏ mặt của [guardian.GetHerHis].\n\nTa không biết chuyện gì đã xảy ra, nhưng liệu có xứng đáng bị trách mắng như vậy?"
  tgp_child_personality.7070.a: "Nếu đó là Ta, Ta sẽ không nghỉ cho đến khi trả thù được sự nhục nhã này!" # Vengeful
  tgp_child_personality.7070.b: "Nếu [servant.GetSheHe] chỉ nói dối, [servant.GetSheHe] sẽ không gặp rắc rối." # Deceitful
  tgp_child_personality.7070.c: "Người lớn thật xấu xí khi tức giận." # Calm

 # lustful, chaste
  tgp_child_personality.7040.t: "Khám Phá Bất Ngờ"
  tgp_child_personality.7040.desc: "Tìm trên giá một cuốn sách được yêu cầu mang về, Ta quét nhẹ, một cuốn rơi xuống sàn, các trang mở ra.\n\nTa quỳ xuống nhặt, không khỏi bị cuốn hút bởi những hình minh họa sống động - đàn ông và phụ nữ? - ôm nhau, quấn quýt theo nhiều tư thế khác nhau.\n\nTrông thật khó chịu, nhưng cũng... thú vị?"
  tgp_child_personality.7040.a: "Nó đã mở rồi, xem qua cũng chẳng sao." # Lustful
  tgp_child_personality.7040.b: "Ta cảm giác mình không nên nhìn thấy điều này." # Chaste

 # generous, fickle, arrogant
  tgp_child_personality.7080.t: "Thừa Thãi Ngon Lành"
  tgp_child_personality.7080.desc: "Dạo gần đây, đi đâu Ta cũng được mọi người tặng đồ ăn vặt. Tay áo gần như tràn ngập đồ ăn ngon, nhiều đến mức Ta gần như thấy tội lỗi vì sự phong phú đó.\n\nKhi nhét thêm một món nữa vào miệng, Ta thấy một trong những [greedy_child.Custom('GirlBoy')] Bạn Bè liếc nhìn kho báu ăn uống của Ta đầy ghen tị."
  tgp_child_personality.7080.a: "Đến đây mà ăn một chút đi!"
  tgp_child_personality.7080.b: "Có lẽ Ta không thấy tội lỗi đâu."
  tgp_child_personality.7080.c: "Chúng là của Ta vì Ta xứng đáng. [greedy_child.GetSheHe|U] tự tìm của [greedy_child.GetHerHis] đi."

 # lazy, gluttonous, compassionate
  tgp_child_personality.7030.t: "Quá Tải"
  tgp_child_personality.7030.desc: "Một chuỗi những tiếng càu nhàu ngắt quãng đầy căng thẳng dẫn ta xuống hành lang, chứng kiến một trong những [clumsy_servant.GetWomenMen] phục vụ của chúng ta đang loạng choạng bước đi dưới sức nặng của vài đĩa thức ăn được xếp chông chênh, đôi tay run rẩy rõ rệt dưới gánh nặng của [clumsy_servant.GetHerHis].\n\nCó vẻ như chỉ còn là vấn đề thời gian, và không còn nhiều thời gian nữa, trước khi một thảm họa lộn xộn xảy ra."
  tgp_child_personality.7030.a: "Chỉ nhìn [clumsy_servant.GetHerHim] thôi cũng thấy mệt." # Lazy
  tgp_child_personality.7030.b: "Ta sẽ giúp một tay - đổi lại được nếm thử!" # Gluttonous
  tgp_child_personality.7030.c: "Ta nên giúp [clumsy_servant.GetHerHim] trước khi [clumsy_servant.GetSheHe] làm rơi đồ." # Compassionate

 # forgiving, trusting, patient
  tgp_child_personality.7090.t: "Một Sai Lầm Thành Thật"
  tgp_child_personality.7090.desc: "Ta tìm trong phòng cuộn sách minh họa yêu thích khi thấy một Bạn Bè bước vào cầm nó.\n\n\"Có đây rồi!\" Ta reo, vươn tay lấy, nhưng bị Bạn Bè đột ngột quỳ trước mặt Ta và cúi lạy [sorry_servant.GetHerselfHimself].\n\n\"Đó là tai nạn, trẻ [ROOT.Char.Custom('MistressMaster')], Ta thề!\"\n\nKiểm tra kỹ, Ta thấy cuộn sách bị rách nát, gần như hai nửa!"
  tgp_child_personality.7090.a: "Đó là tai nạn. Ta không giận đâu." # Forgiving
  tgp_child_personality.7090.b: "Ta biết Ngài không cố ý: Ta tin Ngài." # Trusting
  tgp_child_personality.7090.c: "Chúng ta có thể gửi đặt bản mới: chuyện đó có thể chờ." # Patient

 # humble, cynical, content
  tgp_child_personality.7060.t: "Lời Khen Hào Phóng"
  tgp_child_personality.7060.desc: "Một trong những Bạn Bè dường như muốn khen ngợi mọi việc Ta làm gần đây với bất cứ ai chịu nghe, dù đó là việc nhỏ.\n\nĐược khen thật vui, nhưng Ta bắt đầu tự hỏi liệu những việc này có đáng được [sycophantic_servant.GetSheHe] làm rùm beng đến vậy không..."
  tgp_child_personality.7060.a: "Ta vẫn còn rất nhiều điều phải học." # Humble
  tgp_child_personality.7060.b: "[sycophantic_servant.GetSheHe] chỉ làm vậy để Ta thích [sycophantic_servant.GetHerHim] thôi sao?" # Cynical
  tgp_child_personality.7060.c: "Ta chỉ nên vui vì mình được khen." # Content

 # honest, arbitrary, impatient
  tgp_child_personality.7100.t: "Luôn Thắc Mắc"
  tgp_child_personality.7100.desc: "Ta cảm thấy mỗi ngày như một bài kiểm tra không lối thoát - [guardian.GetName] liên tục hỏi Ta đủ thứ, từ kỳ quặc đến bình thường.\n\nTa ước [guardian.GetSheHe] để Ta yên một lúc, nhưng nếu Ta than phiền, có thể sẽ bị phạt..."
  tgp_child_personality.7100.a: "Ta mệt với mấy câu hỏi này quá. Chúng ta có thể dừng lại không?" # Honest
  tgp_child_personality.7100.b: "Nếu Ta trả lời bừa, có lẽ [guardian.GetSheHe] sẽ để Ta yên." # Arbitrary
  tgp_child_personality.7100.c: "Thật lãng phí thời gian; Ta có thể làm nhiều việc khác hơn." # Impatient

  tgp_child_personality.1021.t: "Hoàn Cảnh Giảm Bớt"
  tgp_child_personality.102.desc: "Trở về nhà sau một chuyến đi cùng [child.GetTitledFirstName], chúng Ta gặp một người đàn ông nghèo khát nước từ bất cứ ai sẵn lòng giúp."
  tgp_child_personality.102.arrogant: "\n\n\"Sao dám nhìn chúng ta như vậy!\" [child.GetFirstNameNoTooltip] nổ ra đầy giận dữ, kinh ngạc trước sự táo bạo tuyệt vọng của người đàn ông."
  tgp_child_personality.102.compassionate: "\n\nCảm động trước nỗi khổ của ông ta, [child.GetFirstNameNoTooltip] kéo tay Ta và nhìn lên với ánh mắt tròn xoe đầy lòng trắc ẩn. \"Chúng ta có thể cho ông ta ít nước không?\" [child.GetSheHe] hỏi."
  tgp_child_personality.102.callous: "\n\nĐáp lại lời cầu xin, [child.GetFirstNameNoTooltip] hốt một nắm bùn ném vào mặt ông ta, cười khi ông ta lùi lại trong ngạc nhiên và xấu hổ."
  tgp_child_personality.102.confirm_arrogant: "Tốt. Hạng người như vậy không đáng được Ngài lưu tâm."
  tgp_child_personality.102.confirm_compassionate: "Tất nhiên rồi; Ta tự hào về lòng đồng cảm của con."
  tgp_child_personality.102.confirm_callous: "Nỗi khổ của người khác không phải là vấn đề của chúng ta."
  tgp_child_personality.102.arrogant_change: "Bỏ qua những kẻ như vậy, họ không xứng đáng được quan tâm."
  tgp_child_personality.102.compassionate_change: "Hãy tưởng tượng nếu con ở vào hoàn cảnh của họ."
  tgp_child_personality.102.callous_change: "Nỗi khổ của người khác không phải là vấn đề của chúng ta."

  tgp_child_personality.1031.t: "Danh Dự Không Xứng"
  tgp_child_personality.103.desc: "Trong khi thảo luận về sự tiến bộ của [child.GetFirstNamePossessive] trong việc nghiên cứu [child.GetFaith.ReligiousText], ta đã tự hào khen ngợi sự thông thạo của [child.GetHerHis] đối với một vài chương ngày càng khó hơn.\n\nChỉ sau đó, khi xem lại kết quả các nghiên cứu mới nhất của [child.GetHerHis], ta mới nhận ra rằng trong lúc nhiệt tình, ta có thể đã nói quá lên về sự hiểu biết của [child.GetHerHis] đối với chúng."
  tgp_child_personality.103.deceitful: "\n\nTuy nhiên, dù chắc chắn biết rõ sự không đúng thực tế trong lời nói của ta, [child.GetFirstNameNoTooltip] vẫn tiếp tục đắm mình trong những lời khen ngợi cho những thành tựu chưa xứng đáng của [child.GetHerHis]."
  tgp_child_personality.103.honest: "\n\nTrước khi Ta kịp nói gì, [child.GetFirstNameNoTooltip] nhìn thẳng vào mắt Ta. \"Ngài nói với người khác rằng Ta nắm vững những chương này, nhưng Ta mới chỉ bắt đầu học chúng.\""
  tgp_child_personality.103.humble: "\n\nNhìn thấy Ta nhận ra điều đó, [child.GetFirstNameNoTooltip] nhẹ nhàng nói: \"Con biết, xin lỗi - con không muốn làm ngài xấu hổ.\""
  tgp_child_personality.103.confirm_deceitful: "Đừng bao giờ cản trở thứ gì mang lại lợi ích cho con."
  tgp_child_personality.103.confirm_honest: "Thật thà là đáng ngưỡng mộ, càng hơn khi tự chịu tổn thất."
  tgp_child_personality.103.confirm_humble: "Ta vui vì ý nghĩ đầu tiên của con là về danh tiếng của Ta."
  tgp_child_personality.103.deceitful_change: "$tgp_child_personality.103.confirm_deceitful$"
  tgp_child_personality.103.honest_change: "Con không nên để lời nói dối trôi qua mà không được sửa chữa."
  tgp_child_personality.103.humble_change: "Đừng khao khát vượt quá những gì con đã xứng đáng."
 
  tgp_child_personality.1041.t: "Thiếu Chỉ Dạy"
  tgp_child_personality.104.desc: "Những việc người đứng đầu gia đình phải lo liệu là vô tận, và hôm nay trách nhiệm của Ta khiến Ta không thể giám sát bài học hàng ngày của [child.GetFirstNamePossessive]."
  tgp_child_personality.104.generous: "\n\nTrong lúc Ta vắng mặt, Ta nhận thấy thay vì nhàn rỗi, [child.GetFirstNameNoTooltip] bận rộn giúp Bạn Bè làm việc hằng ngày; một sự hào phóng tất nhiên bị từ chối đúng mực."
  tgp_child_personality.104.diligent: "\n\nTrở về muộn vào buổi tối, ta thấy [child.GetFirstNameNoTooltip] đang ngồi tại bàn làm việc, đắm chìm trong việc học tập chăm chỉ. Giật mình vì tiếng bước chân của ta, [child.GetSheHe] ngước lên và rạng rỡ đầy tự hào với ta. \"Người đến rồi! Hãy nhìn xem con đã làm được bao nhiêu việc này!\""
  tgp_child_personality.104.patient: "\n\nTrở về muộn hơn dự kiến đáng kể, ta thấy [child.GetFirstNameNoTooltip] đang ngồi một cách điềm tĩnh. Đứng dậy khỏi chỗ ngồi của [child.GetHerHis], [child.GetSheHe] chào ta nồng hậu. \"Con đã rất yên lặng và đợi người cả ngày! Con làm vậy có tốt không ạ?\""
  tgp_child_personality.104.confirm_generous: "Sự quan tâm đến người khác của con thật đáng ngưỡng mộ."
  tgp_child_personality.104.confirm_diligent: "Sự chủ động con thể hiện sẽ giúp con nhiều."
  tgp_child_personality.104.confirm_patient: "Ta vui vì sự kiên nhẫn con đã thể hiện."
  tgp_child_personality.104.generous_change: "Có những người khác có thể cần đôi tay nhàn rỗi của con."
  tgp_child_personality.104.diligent_change: "Nếu còn thời gian, hãy dành cho việc học."
  tgp_child_personality.104.patient_change: "Con đã làm tốt, nhưng tốt hơn nếu chờ Ta."

  tgp_child_personality.1071.t: "Phân Chia Không Công Bằng"
  tgp_child_personality.107.desc: "Sau khi trả lời một loạt câu hỏi rối rắm từ [child.GetFirstName], Ta đã tìm ra vấn đề; [child.GetSheHe] nhận thấy rằng một số Bạn Bè ăn tốt hơn người khác."
  tgp_child_personality.107.just: "\n\n[child.GetFirstNameNoTooltip|U] dường như rất băn khoăn về điều này, và đòi biết lý do của sự bất công rõ ràng này."
  tgp_child_personality.107.cynical: "\n\nBất chấp những thắc mắc của [child.GetFirstNamePossessiveNoTooltip|U], [child.GetSheHe] có vẻ không bận tâm đến tình hình chung, gần như thể [child.GetSheHe] chỉ quan tâm đến việc xác nhận một kết luận nào đó mà mình đã đạt được trong thâm tâm."
  tgp_child_personality.107.temperate: "\n\nSau một hồi cân nhắc, [child.GetFirstNameNoTooltip|U] đi đến kết luận rằng tốt nhất là tất cả chúng ta tiết chế khẩu vị."
  tgp_child_personality.107.confirm_just: "Con đúng, chúng ta nên sửa tình trạng này."
  tgp_child_personality.107.confirm_cynical: "Thế giới vốn bất công, con không nên mong khác đi."
  tgp_child_personality.107.confirm_temperate: "Có sự khôn ngoan trong việc điều độ, đúng vậy."
  tgp_child_personality.107.just_change: "Con không nên chấp nhận bất công chỉ vì người khác làm vậy."
  tgp_child_personality.107.cynical_change: "$tgp_child_personality.107.confirm_cynical$"
  tgp_child_personality.107.temperate_change: "$tgp_child_personality.107.confirm_temperate$"

  tgp_child_personality.1091.t: "Âm Thanh Ban Đêm"
  tgp_child_personality.109.desc: "Ta bị đánh thức lúc sáng sớm bởi một Bạn Bè với câu chuyện để kể.\n\nHóa ra một người khác trong số họ đã uống quá nhiều hôm trước, và khi tìm đường về phòng, anh ta đã làm bừa bộn ngay ngoài phòng [child.GetFirstNamePossessive]."
  tgp_child_personality.109.brave: "\n\nCâu chuyện trở nên hài hước khi họ kể rằng [child.GetFirstName], bị đánh thức, đã dùng kiếm gỗ tấn công Bạn Bè say và khiến 'quái vật' này chạy biến vào bóng tối."
  tgp_child_personality.109.calm: "\n\nDù bị làm phiền ban đêm, [child.GetFirstName] vẫn không bị ảnh hưởng, không động lòng trước sự bất thường ngoài cửa sổ [child.GetHerHis]."
  tgp_child_personality.109.zealous: "\n\nKhi đến kiểm tra [child.GetFirstName] sau đó, những người hầu tìm thấy [child.GetHerHim] đang đọc các đoạn thơ từ [child.GetFaith.ReligiousText] để giữ vững sự điềm tĩnh của [child.GetHerHis]."
  tgp_child_personality.109.confirm_brave: "Trong giờ tối tăm nhất, chúng ta tìm thấy bản thân."
  tgp_child_personality.109.confirm_calm: "Tinh thần sáng suốt không bị khuấy động bởi âm thanh đêm."
  tgp_child_personality.109.confirm_zealous: "Một người nên tuân theo [child.GetFaith.ReligiousText] cả ban ngày."
  tgp_child_personality.109.brave_change: "Chỉ hành động mới cứu [child.GetHerHim], nếu mối đe dọa thật sự."
  tgp_child_personality.109.calm_change: "$tgp_child_personality.109.confirm_calm$"
  tgp_child_personality.109.zealous_change: "$tgp_child_personality.109.confirm_zealous$"

  tgp_child_personality.1101.t: "Gánh Nặng Kỳ Vọng"
  tgp_child_personality.110.desc: "Trẻ con học tốt nhất bằng cách noi gương những người lớn xung quanh, một nguyên tắc mà các gia sư và người hầu của [child.GetFirstNamePossessive] đã hoàn toàn chấp nhận, lấy ta làm tấm gương để thúc đẩy và hướng dẫn sự phát triển của [child.GetHerHis]."
  tgp_child_personality.110.ambitious: "\n\nKết quả tự nó đã chứng minh; [child.GetSheHe] đã tăng gấp đôi nỗ lực của [child.GetHerHis], tuyên bố ý định vượt qua những thành tựu của ta, và ta có thể thấy quyết tâm này được phản ánh rõ ràng trong các nghiên cứu của [child.GetHerHis]."
  tgp_child_personality.110.sadistic: "\n\nTuy nhiên, thay vì được truyền cảm hứng, ta thấy [child.GetHerHim] bắt đầu trút sự thất vọng của [child.GetHerHis] lên những người hầu. Ta nghi ngờ rằng thay vào đó, chúng ta đã khiến [child.GetHerHim] nhận thức quá rõ về những khiếm khuyết của chính mình."
  tgp_child_personality.110.paranoid: "\n\nHơi đáng lo ngại, điều này có thể đã truyền đạt sai thông điệp cho [child.GetFirstNameNoTooltip], vì giờ đây ta thường thấy một bóng đen nghi ngờ thoáng qua trên khuôn mặt trẻ thơ của [child.GetHerHis]."
  tgp_child_personality.110.confirm_ambitious: "Đừng để điều gì cản trở mục tiêu của con."
  tgp_child_personality.110.confirm_sadistic: "Đôi khi sự tàn nhẫn hữu ích hơn đức hạnh."
  tgp_child_personality.110.confirm_paranoid: "Hãy đặt câu hỏi mọi thứ, đặc biệt từ những người con tin tưởng."
  tgp_child_personality.110.ambitious_change: "Con không nên để điều gì cản trở mục tiêu."
  tgp_child_personality.110.sadistic_change: "$tgp_child_personality.110.confirm_sadistic$"
  tgp_child_personality.110.paranoid_change: "$tgp_child_personality.110.confirm_paranoid$"

  tgp_child_personality.7001.t: "Lịch Trình Mở"
  tgp_child_personality.7001.desc: "Sự phát triển trí óc trẻ có thể phức tạp và khó đo lường, và chỉ thông qua việc dò hỏi cẩn thận mới có thể hướng dẫn đúng con đường.\n\nKhi thông báo bài học hôm nay bị hủy đột ngột, Ta đặt [child.GetFirstName] vào thử thách để xem [child.GetSheHe] sẽ chọn dành ngày như thế nào khi không có hướng dẫn."
  tgp_child_personality.diligent.desc: "\n\nTuy nhiên, bất chấp đề nghị của ta, [child.GetFirstName] vẫn chọn cách tự mình tiếp tục các nghiên cứu của [child.GetHerHis], cho thấy một cam kết ấn tượng đối với việc tiếp tục học tập của mình."
  tgp_child_personality.gregarious.desc: "\n\nCó lẽ không ngạc nhiên khi [child.GetFirstName] xin phép dành cả ngày với những người bạn đồng hành của [child.GetHerHis], bỏ bê việc học để đổi lấy sự đồng hành của người khác."
  tgp_child_personality.temperate.desc: "\n\nThật bất ngờ, [child.GetFirstName] đã chọn tận dụng cơ hội để nghỉ ngơi và bảo toàn năng lượng cho những nỗ lực vào ngày mai."
  tgp_child_personality.7001.diligent: "Lựa chọn xuất sắc; kỷ luật bản thân sẽ giúp con nhiều."
  tgp_child_personality.7001.gregarious: "Những mối quan hệ con tạo bây giờ sẽ mang lợi ích cả đời."
  tgp_child_personality.7001.temperate: "Hiểu rõ giới hạn bản thân, con làm chủ chính mình."
  tgp_child_personality.7001.change.diligent: "Kỷ luật bản thân sẽ giúp con hơn. Hãy luyện tập."
  tgp_child_personality.7001.change.gregarious: "Đừng bỏ bê mối quan hệ với người khác chỉ vì học tập."
  tgp_child_personality.7001.change.temperate: "Hãy nghỉ ngơi khi có thể; không biết ngày mai sẽ ra sao."

  tgp_child_personality.7011.t: "Lời Nói Xuyên Tạc"
  tgp_child_personality.7011.desc: "Khi tiếp khách, chúng Ta tình cờ nói về [child.GetFaith.ReligiousText], và một cuộc tranh luận nảy lửa diễn ra, chủ yếu là sự đam mê hơn là hiểu biết."
  tgp_child_personality.zealous.desc: "\n\nSau khi nhóm giải tán, [child.GetFirstNameNoTooltip] tiếp cận ta, tỏ vẻ đau khổ rõ rệt sau khi vô tình nghe được một phần cuộc tranh luận. \"Làm thế nào họ có thể hiểu [ROOT.Char.GetFaith.ReligiousText] #EMP sai#! đến thế cơ chứ!?\" [child.GetSheHe] hỏi với vẻ hoài nghi rõ ràng."
  tgp_child_personality.ambitious.desc: "\n\n[child.GetFirstNameNoTooltip] đã nghe lỏm được một phần cuộc tranh luận và dường như đã được tiếp thêm sức mạnh bởi nó, coi kiến thức và sự hiểu biết của [child.GetHerHis] là vượt trội hơn so với người lớn."
  tgp_child_personality.sadistic.desc: "\n\nSau khi khách khứa giải tán, [child.GetFirstNameNoTooltip] lao đến phía ta với sự háo hức đầy khoái chí viết trên khắp khuôn mặt [child.GetHerHis]. \"Người có nói với mọi người rằng họ đã sai như thế nào không ạ?\" [child.GetSheHe] hỏi đầy háo hức. \"Có phải mọi người đã cười vì họ nghe thật ngốc nghếch không ạ?\""
  tgp_child_personality.7011.zealous: "Sự tận tâm với nghi lễ thật đáng khen."
  tgp_child_personality.7011.ambitious: "Hãy coi thất bại của người khác là cơ hội cho bản thân."
  tgp_child_personality.7011.sadistic: "Khi vạch trần sự thiếu hiểu biết của người khác, con làm yếu vị thế của họ."
  tgp_child_personality.7011.change.zealous: "Hiểu biết của con về nghi lễ mới là quan trọng nhất."
  tgp_child_personality.7011.change.ambitious: "$tgp_child_personality.7011.ambitious$"
  tgp_child_personality.7011.change.sadistic: "$tgp_child_personality.7011.sadistic$"

  tgp_child_personality.7021.t: "Ý Định Bí Ẩn"
  tgp_child_personality.7021.desc: "Hôm nay, [child.GetFirstName] bắt gặp một nhóm du khách lạ mặt tại lối vào nhà của chúng ta. Giật mình vì sự hiện diện của họ, [child.GetSheHe] nhanh chóng bỏ chạy và không xuất hiện từ nơi [child.GetSheHe] đã trốn cho đến tận bây giờ."
  tgp_child_personality.shy.desc: "\n\nRõ ràng bị xáo động, [child.GetFirstNameNoTooltip] tiến đến Ta, mắt cúi xuống, bồn chồn. \"Họ sẽ không quay lại chứ?\" [child.GetSheHe] hỏi. \"Đừng để họ quay lại. Con không muốn gặp họ nữa.\""
  tgp_child_personality.paranoid.desc: "\n\nCảnh giác sau lần gặp, [child.GetFirstNameNoTooltip] tiến đến Ta thận trọng. \"Những người đó là ai?\" [child.GetSheHe] hỏi. \"Con không tin họ.\""
  tgp_child_personality.craven.desc: "\n\nVẫn lo lắng sau khi họ đến, [child.GetFirstNameNoTooltip] nắm tay Ta. \"Tại sao họ ở đây? Trông họ nguy hiểm!\" [child.GetSheHe] la lên. \"Đừng để họ quay lại.\""
  tgp_child_personality.7021.shy: "Con không cần gặp ai nếu không muốn."
  tgp_child_personality.7021.paranoid: "Niềm tin quý giá nhất khi dành cho ít người."
  tgp_child_personality.7021.craven: "Tin vào bản năng; cảm nhận nguy hiểm là biết trước rủi ro."
  tgp_child_personality.7021.change.shy: "Hãy chỉ ở bên những người con gần gũi nhất."
  tgp_child_personality.7021.change.paranoid: "$tgp_child_personality.7021.paranoid$"
  tgp_child_personality.7021.change.craven: "$tgp_child_personality.7021.craven$"

  tgp_child_personality.7031.t: "Quá Tải"
  tgp_child_personality.7031.desc: "Khi đi về phòng, Ta thấy một Bạn Bè loạng choạng dưới gánh nặng, đi về bếp. Gần đó, Ta thấy [child.GetFirstName] và dừng lại để xem phản ứng của [child.GetSheHe]."
  tgp_child_personality.lazy.desc: "\n\nKhông lay chuyển trước cảnh tượng đó, [child.GetFirstNameNoTooltip] chỉ đứng đó và thản nhiên quan sát sự vật lộn của người hầu. Bắt gặp ánh mắt ta, [child.GetSheHe] nhún vai thờ ơ, như thể vấn đề đó không đáng để [child.GetHerHim] bận tâm."
  tgp_child_personality.gluttonous.desc: "\n\nKhông chút do dự, [child.GetFirstNameNoTooltip] lao tới để giúp nhẹ bớt gánh nặng của người hầu, và họ cùng nhau biến mất vào bếp. Vài phút sau, đứa trẻ xuất hiện trở lại và mỉm cười với ta, những ngón tay dính đầy phần thưởng ngọt và mặn, và trông hoàn toàn hài lòng với [child.GetHerselfHimself]."
  tgp_child_personality.compassionate.desc: "\n\nNhận thấy sự vất vả của người hầu, [child.GetFirstNameNoTooltip] bước tới và chia sẻ một phần gánh nặng, làm tròn trách nhiệm khi theo người hầu vào bếp. Khi [child.GetSheHe] quay lại, đó là với niềm tự hào thầm lặng của một người tự thỏa mãn."
  tgp_child_personality.7031.lazy: "Giữ sức cho việc thực sự quan trọng; để người khác chịu gánh nặng."
  tgp_child_personality.7031.gluttonous: "Con xứng đáng được thưởng vì đã giúp đỡ."
  tgp_child_personality.7031.compassionate: "Nhìn người khác vất vả mà không giúp không phải là đức hạnh."
  tgp_child_personality.7031.change.lazy: "$tgp_child_personality.7031.lazy$"
  tgp_child_personality.7031.change.gluttonous: "Việc lao động là của Bạn Bè; việc hưởng thành quả là của con."
  tgp_child_personality.7031.change.compassionate: "Giúp người cần giúp, không trông mong phần thưởng."

  tgp_child_personality.7041.t: "Khám Phá Bất Ngờ"
  tgp_child_personality.7041.desc: "Xem thư viện gia đình, Ta nhận thấy một cuốn sách nhô ra khỏi kệ, như được nhét vội. Một cuốn sách đầy tranh minh họa kỳ quái đã rơi vào tay Ta, nếu nhớ đúng."
  tgp_child_personality.lustful.desc: "\n\nĐột nhiên, ký ức bật ra. [child.GetFirstName] gần đây hành xử lạ, dành quá nhiều thời gian trong thư viện. Ta tự hỏi..."
  tgp_child_personality.chaste.desc: "\n\nĐột nhiên, ký ức bật ra. [child.GetFirstName] gần đây ít dành thời gian trong thư viện, như xấu hổ khi vào phòng. Ta tự hỏi..."
  tgp_child_personality.7041.lustful: "Tò mò về những việc này là hoàn toàn tự nhiên."
  tgp_child_personality.7041.chaste: "Người xứng đáng giữ sự kiềm chế trước cám dỗ."
  tgp_child_personality.7041.change.lustful: "Ta sẽ chuyển cuốn sách vào phòng [child.GetHerHis]."
  tgp_child_personality.7041.change.chaste: "$tgp_child_personality.7041.chaste$"

  tgp_child_personality.7051.t: "Mất và Tìm Thấy"
  tgp_child_personality.7051.desc: "Ta dặn Bạn Bè chuyển một hộp sơn mài cùng nhiều đồ quý vào phòng khác khi dọn dẹp vài ngày trước, nhưng sự chậm trễ rõ rệt cho thấy hộp đã bị mất."
  tgp_child_personality.just.desc: "\n\nNgay khi Ta chuẩn bị điều tra, bất ngờ gặp hộp bị thất lạc được [child.GetFirstName] trả lại đúng chỗ."
  tgp_child_personality.greedy.desc: "\n\nTìm khắp nhà, nhanh chóng phát hiện hộp trong phòng [child.GetFirstNamePossessiveNoTooltip]. \"Con tìm thấy rồi, giờ là của con!\" [child.GetSheHe] cằn nhằn."
  tgp_child_personality.callous.desc: "\n\nTrong khi [child.GetFirstName] và Ta tìm kiếm, Ta giải thích mục đích. \"Con thấy rồi,\" trẻ trả lời thờ ơ. \"Nhưng Bạn Bè làm mất sẽ ra sao?\" [child.GetSheHe|U] hỏi, tỏ ra quan tâm hơn."
  tgp_child_personality.7051.just: "Luôn hành xử như khoảnh khắc này."
  tgp_child_personality.7051.greedy: "Mất mát của người khác có thể là lợi ích của con."
  tgp_child_personality.7051.callous: "Hãy để kẻ ngu chịu hậu quả vì sự bất tài của họ."
  tgp_child_personality.7051.change.just: "Hãy hành xử ngay thẳng và không bao giờ phải hối hận."
  tgp_child_personality.7051.change.greedy: "Hãy nhìn vào lợi ích bản thân trước; lấy bất cứ thứ gì có thể."
  tgp_child_personality.7051.change.callous: "Hãy để kẻ ngu chịu hậu quả vì sự bất tài của họ."

  tgp_child_personality.7061.t: "Khen Ngợi Hào Phóng"
  tgp_child_personality.7061.desc: "Bạn Bè biết cách lấy lòng chủ, cả hiện tại và tương lai, và những lời khen cho [child.GetFirstName] gần đây cực kỳ nhiệt tình, có lẽ còn quá đà."
  tgp_child_personality.humble.desc: "\n\nDù vậy, [child.GetFirstNameNoTooltip] vẫn khiêm tốn, luôn nói rằng [child.GetSheHe] còn nhiều điều phải học."
  tgp_child_personality.cynical.desc: "\n\nRiêng tư, [child.GetFirstNameNoTooltip] đã bày tỏ những nghi ngờ của [child.GetHerHis] với ta, tự hỏi liệu những người hầu có đang cố lấy lòng [child.GetHerHim] hay không."
  tgp_child_personality.content.desc: "\n\nNhững lời khen ngợi này dường như trôi tuột khỏi [child.GetFirstNamePossessiveNoTooltip], và [child.GetSheHe] dường như phần lớn không lay chuyển trước những lời tán dương thái quá của họ."
  tgp_child_personality.7061.humble: "Tốt khi con kiềm chế niềm tự hào."
  tgp_child_personality.7061.cynical: "Khôn ngoan khi nghi ngờ động cơ người khác."
  tgp_child_personality.7061.content: "Danh dự và vinh quang rỗng tuếch; đừng theo đuổi chúng."
  tgp_child_personality.7061.change.humble: "Kiềm chế niềm tự hào và nhớ vị trí của mình."
  tgp_child_personality.7061.change.cynical: "Sẽ khôn ngoan khi nghi ngờ động cơ người khác, kể cả của Ta."
  tgp_child_personality.7061.change.content: "$tgp_child_personality.7061.content$"

  tgp_child_personality.7071.t: "Lời Nói Khắc Nghiệt"
  tgp_child_personality.7071.desc: "Bạn Bè cần được nhắc nhở về vị trí của họ, càng hỗn hay bất tài càng cần nhắc nhở mạnh mẽ. Trẻ em chưa học được bài học này, và [child.GetFirstName] trông bối rối sau khi nghe một nhắc nhở như vậy."
  tgp_child_personality.vengeful.desc: "\n\n[child.GetSheHe|U] bối rối nhất trước sự chịu đựng của Bạn Bè với khiển trách của Ta, muốn biết tại sao Ta không trông đợi Bạn Bè trả đũa sau này."
  tgp_child_personality.deceitful.desc: "\n\nMối quan tâm chính của [child.GetFirstNamePossessiveNoTooltip] là thừa nhận lỗi; nếu Bạn Bè nói dối, họ sẽ ít bị phạt hơn."
  tgp_child_personality.calm.desc: "\n\nĐiều này ít liên quan đến cảnh ngộ của Bạn Bè, [child.GetFirstNameNoTooltip] chỉ tỏ ra không thích tranh cãi và lời lẽ của người lớn."
  tgp_child_personality.7071.vengeful: "Chỉ kẻ yếu mới để bị coi thường như vậy."
  tgp_child_personality.7071.deceitful: "Thật thà là đức hạnh, nhưng đôi khi cũng ngu ngốc."
  tgp_child_personality.7071.calm: "Người không dao động luôn chiếm ưu thế."
  tgp_child_personality.7071.change.vengeful: "$tgp_child_personality.7071.vengeful$"
  tgp_child_personality.7071.change.deceitful: "$tgp_child_personality.7071.deceitful$"
  tgp_child_personality.7071.change.calm: "Giữ bình tĩnh và con sẽ luôn có lợi thế."

  tgp_child_personality.7081.t: "Thừa Thãi Ngon Lành"
  tgp_child_personality.7081.desc: "Gần đây Ta nhận thấy rất nhiều Bạn Bè chiều chuộng [child.GetFirstName] với đồ ăn vặt, gần như mỗi giờ lại mang đến."
  tgp_child_personality.generous.desc: "\n\nHoàn toàn không tham lam, [child.GetFirstNameNoTooltip] vui vẻ chia sẻ với các trẻ khác mà không chút do dự."
  tgp_child_personality.fickle.desc: "\n\n[child.GetFirstNameNoTooltip] đôi khi sẵn lòng chia sẻ đồ ăn nhẹ của [child.GetHerHis] với người khác, nhưng chỉ vài phút sau lại hoàn toàn không muốn, tâm trạng của [child.GetHerHis] thay đổi rất thất thường."
  tgp_child_personality.arrogant.desc: "\n\n[child.GetFirstNameNoTooltip] khư khư giữ lấy đồ ăn nhẹ của mình, từ chối chia sẻ với bất kỳ ai khác và coi đó là quyền lợi chính đáng của [child.GetHerHis]."
  tgp_child_personality.7081.generous: "Sự dư dả nên luôn chia sẻ với kẻ thiếu thốn."
  tgp_child_personality.7081.fickle: "Tính linh hoạt trong tâm trí có thể làm đối thủ bối rối."
  tgp_child_personality.7081.arrogant: "Hãy hành xử xứng với địa vị của mình và người khác sẽ noi theo."
  tgp_child_personality.7081.change.generous: "$tgp_child_personality.7081.generous$"
  tgp_child_personality.7081.change.fickle: "Tính bất ngờ có thể là lợi thế trong nhiều tình huống."
  tgp_child_personality.7081.change.arrogant: "$tgp_child_personality.7081.arrogant$"

  tgp_child_personality.7091.t: "Sai Lầm Chân Thật"
  tgp_child_personality.7091.desc: "Trong một sự cố đáng tiếc, cuộn tranh minh họa yêu thích của [child.GetFirstNamePossessive] bị Bạn Bè làm rách nhầm, tưởng là rác. Ta tò mò về phản ứng của trẻ nên ngồi bên [child.Custom('GirlBoy')]."
  tgp_child_personality.forgiving.desc: "\n\n\"Con thật độ lượng,\" Ta nhận xét. [child.GetFirstNameNoTooltip] nhún vai nhẹ, như không có gì quan trọng. \"Chỉ là tai nạn. Con không muốn [child.GetHerHim] buồn.\""
  tgp_child_personality.trusting.desc: "\n\n\"Con chấp nhận giải thích rất dễ dàng,\" Ta nói. [child.GetFirstNameNoTooltip] gật đầu thành thật. \"Con tin [child.GetHerHim],\" [child.GetSheHe] trả lời đơn giản."
  tgp_child_personality.patient.desc: "\n\n\"Con thật điềm tĩnh,\" Ta quan sát. [child.GetFirstNameNoTooltip] mỉm cười bình thản, hoàn toàn không bận tâm. \"Không sao, con không ngại đợi cái mới.\""
  tgp_child_personality.7091.forgiving: "Hãy khoan dung với lỗi lầm của người khác; không ai giống ta hoàn toàn."
  tgp_child_personality.7091.trusting: "Đặt niềm tin vào người biết tin tưởng con."
  tgp_child_personality.7091.patient: "Nhiều tổn thương có thể hàn gắn theo thời gian; con chỉ cần chờ."
  tgp_child_personality.7091.change.forgiving: "$tgp_child_personality.7091.forgiving$"
  tgp_child_personality.7091.change.trusting: "$tgp_child_personality.7091.trusting$"
  tgp_child_personality.7091.change.patient: "$tgp_child_personality.7091.patient$"

  tgp_child_personality.7101.t: "Tò Mò Không Ngừng"
  tgp_child_personality.7101.desc: "Theo đuổi và tiếp thu kiến thức là đặc điểm của [child.GetWomanMan] xứng đáng, nhưng những nỗ lực dạy dỗ [child.GetFirstName] của Ta có lẽ hơi quá."
  tgp_child_personality.honest.desc: "\n\n\"Chúng ta có thể dừng lại bây giờ được không ạ?\" [child.GetSheHe] cầu khẩn, giọng nói pha chút căng thẳng, thành thật bày tỏ sự thất vọng rõ rệt của [child.GetHerHis]."
  tgp_child_personality.arbitrary.desc: "\n\n\"Là hoàng đế thứ tư. Hay thứ chín,\" [child.GetFirstNameNoTooltip] trả lời thờ ơ, tỏ ra vô cảm với sự thật."
  tgp_child_personality.impatient.desc: "\n\n\"Chúng ta đã xong chưa ạ?\" [child.GetFirstNameNoTooltip] thở dài với sự bực bội không che giấu, cử động bồn chồn và rõ ràng ước rằng [child.GetSheHe] có thể làm bất cứ điều gì khác."
  tgp_child_personality.7101.honest: "Dám nói thật, kẻo thế gian sẽ rơi vào bất công."
  tgp_child_personality.7101.arbitrary: "Nếu con nghĩ mình biết hơn, hãy đi theo con đường của mình."
  tgp_child_personality.7101.impatient: "Trả lời càng nhanh, chúng ta sẽ xong sớm hơn."
  tgp_child_personality.7101.change.honest: "$tgp_child_personality.7101.honest$"
  tgp_child_personality.7101.change.arbitrary: "$tgp_child_personality.7101.arbitrary$"
  tgp_child_personality.7101.change.impatient: "$tgp_child_personality.7101.impatient$"

  tgp_child_personality.7201.t: "Quyết Tâm Kiên Định"
  tgp_child_personality.7201.desc: "Một khoảnh khắc bất cẩn có thể dẫn đến những hậu quả khủng khiếp. Một người hầu quên khóa cổng và đột nhiên [child.GetFirstName] ở ngoài đó, mặt đối mặt với một con chó hoang. Mối nguy hiểm đã qua và đứa trẻ đã trở lại phòng của [child.GetHerHis] mà không bị thương tích gì, nhưng hậu quả sau đó vẫn đòi hỏi sự chú ý của ta."
  tgp_child_personality.brave.desc: "\n\n\"Con không sợ chút nào!\" [child.GetFirstNameNoTooltip] tự hào. \"Con có thể đánh cả bầy sói!\""
  tgp_child_personality.stubborn.desc: "\n\n\"Con đã đứng vững tại chỗ!\" [child.GetFirstNameNoTooltip] quả quyết đầy thách thức. \"Con không bỏ chạy, chính những người hầu đã khiêng con vào trong!\" Có vẻ như đứa trẻ khó chịu về cuộc giải cứu [child.GetHerHis] hơn là mối nguy hiểm mà [child.GetSheHe] phải đối mặt."
  tgp_child_personality.wrathful.desc: "\n\n\"Con ghét con chó đó!\" [child.GetFirstNameNoTooltip] hét lên. \"Chúng phải giết nó, không chỉ xua đi!\""
  tgp_child_personality.7201.brave: "Tinh thần dũng cảm kiên cường; Ta tán thành!"
  tgp_child_personality.7201.stubborn: "Hãy vững vàng, không nhường ai, người hay thú."
  tgp_child_personality.7201.wrathful: "Cơn giận đúng cách sẽ khuếch đại tham vọng."
  tgp_child_personality.7201.change.brave: "Đối mặt đối thủ dũng cảm và chiến thắng sẽ đến."
  tgp_child_personality.7201.change.stubborn: "Hãy vững vàng, không nhường ai, người hay thú."
  tgp_child_personality.7201.change.wrathful: "Con có không giận trước sự hung hãn của loài vật hèn này sao?"

  tgp_child_personality.7301.t: "Cánh Chim Gãy"
  tgp_child_personality.7301.desc: "Khi Ta vừa hoàn tất kiểm tra sổ sách gia đình, Bạn Bè mang đến việc mới; một chú chim nhỏ lạ mắt với cánh gãy mà [child.GetFirstName] phát hiện trong sân."
  tgp_child_personality.7301.eccentric.desc: "\n\nNgay lập tức, [child.GetFirstNameNoTooltip] đã bị mê hoặc bởi con chim, hoặc chính xác hơn là #EMP ý tưởng#! về một con chim. [child.GetSheHe|U] không thể ngừng nói về việc [child.GetSheHe] muốn bay như nó như thế nào."
  tgp_child_personality.7301.compassionate.desc: "\n\nThấy nó đau khổ, [child.GetFirstNameNoTooltip] muốn mang chú chim về nhà chăm sóc như người trong gia đình."
  tgp_child_personality.7301.callous.desc: "\n\nThể hiện sự thờ ơ rõ ràng đối với nỗi đau của nó, [child.GetFirstNameNoTooltip] để mặc con chim bị thương ở nơi [child.GetSheHe] tìm thấy, phó mặc nó cho những người hầu của chúng ta - và có vẻ như, cho chủ nhân của họ - để giải quyết."
  tgp_child_personality.7301.eccentric: "Tâm trí trẻ em thật kỳ lạ và tuyệt vời."
  tgp_child_personality.7301.compassionate: "Chăm sóc thần dân như chăm chú chim này."
  tgp_child_personality.7301.callous: "Hãy để kẻ yếu tự lo liệu, dù là chim hay [child.GetWomanMan]."
  tgp_child_personality.7301.change.eccentric: "Hãy để tâm trí con bay cao, và tưởng tượng thế giới như một chú chim."
  tgp_child_personality.7301.change.compassionate: "Trước hết, hãy chăm sóc kẻ yếu hơn mình."
  tgp_child_personality.7301.change.callous: "$tgp_child_personality.7301.callous$"
