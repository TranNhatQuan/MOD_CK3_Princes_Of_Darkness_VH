l_english: 
  tgp_dynastic_cycle_events.0001.t: "Con Đường Tiến Lên"
  tgp_dynastic_cycle_events.0001.desc: "Khu vườn tĩnh lặng, chỉ trừ tiếng xào xạc của lá trong gió. Trong sự yên tĩnh, tâm trí Ta hướng về lãnh thổ trong những thời kỳ [my_situation.GetTopCurrentPhase.GetName|l].\n\nChỉ chịu đựng có đủ không? Liệu lãnh thổ có thể bền vững khi nó tĩnh lặng như khu vườn này?\n\nTách trà trên khay của người hầu đã nguội lạnh từ lâu."
  tgp_dynastic_cycle_events.0001.aa: "[my_movement.GetNameNoTooltip] sẽ mang lại ánh sáng tri thức!"
  tgp_dynastic_cycle_events.0001.a: "Tốt hơn là nên có Bạn Bè khi thời khắc đến..."
  tgp_dynastic_cycle_events.0001.a.potential_friend: "#EMP Ta nên gửi một bức thư cho người đáng tin cậy [potential_friend.GetTitledFirstNameNoTooltip]#!\n"
  tgp_dynastic_cycle_events.0001.a.friend: "#EMP Ta nên gửi một bức thư cho người Bạn Thân [friend.GetTitledFirstNameNoTooltip]#!\n"
  tgp_dynastic_cycle_events.0001.b: "Thời điểm để tiến lên là #EMP ngay bây giờ#!."
  tgp_dynastic_cycle_events.0001.c: "Chúng ta không thể sống trong tương lai."
  friend_together_in_preparation: "[CHARACTER.GetShortUIName] gửi thư cho [TARGET_CHARACTER.GetShortUIName] hứa sẽ ở bên nhau khi lãnh thổ ổn định trở lại."
  friend_together_in_preparation_corresponding: "[TARGET_CHARACTER.GetShortUIName] nhận thư từ [CHARACTER.GetShortUIName] hứa sẽ ở bên nhau khi thời điểm tiến lên đến."
  tgp_advancement_focus_modifier: "Tập Trung Vào Tiến Bộ"
  tgp_advancement_focus_modifier_desc: "Nhân vật này đã quyết định tập trung vào việc nâng cao lãnh thổ, bỏ qua những vùng rộng lớn khác."
 
  tgp_dynastic_cycle_events.0010.t: "Dưới Áp Lực"
  tgp_dynastic_cycle_events.0010.desc: "Đệ tử của Ta [disciple.GetTitledFirstName] đến thăm, nhưng lý do [disciple.GetHerHis] không phải là tin vui.\n\n\"Thầy ơi… lãnh thổ trôi dạt như con thuyền trong bão. Mỗi ngày mang đến xung đột mới, và kẻ thù mới. [my_situation.GetTopCurrentPhase.GetName] đang gia tăng. Ta không biết ngày mai sẽ ra sao, sẽ như thế nào.\"\n\nTa không thể không nhận thấy đôi tay [disciple.GetHerHis] run rẩy."
  tgp_dynastic_cycle_events.0010.a: "\"Ta sẽ không để ai nói đệ tử của [ROOT.Char.GetFirstNamePossessiveNoTooltip] là kẻ yếu đuối!\""
  tgp_dynastic_cycle_events.0010.b: "Đứa trẻ tội nghiệp. Ta phải an ủi [disciple.GetHerHim]."
  tgp_dynastic_cycle_events.0010.c: "\"Chỉ qua gian khó mới học được.\""
 
  tgp_dynastic_cycle_events.0020.t: "Bàn Tay Táo Bạo Của Đói Khát"
  tgp_dynastic_cycle_events.0020.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tin xấu đây.\" [marshal.GetName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] của Ta, tiến đến gần, [marshal.Custom('quirk_pos_pp')].\n\n\"Trong đêm khuya, nông dân ở [peasant_county.GetName] đã phá kho lương thực. Nếu Ta thuê thêm lính canh, chúng ta có thể tìm lại họ.\"\n\nNgay cả lãnh thổ chúng ta cũng không an toàn trước [my_situation.GetTopCurrentPhase.GetName]."
  tgp_dynastic_cycle_events.0020.a: "\"Các đặc vụ của ta sẽ tìm ra họ. Và #EMP xử lý#! họ.\""
  tgp_dynastic_cycle_events.0020.b: "\"Thuê ngay những lính canh đó!\""
  tgp_dynastic_cycle_events.0020.c: "Những người tuyệt vọng làm những điều tuyệt vọng."
  tgp_executed_peasants_county_modifier: "Nông Dân Bị Xử Tử"
  tgp_executed_peasants_county_modifier_desc: "Quận này không quên cách nông dân đói khát bị đối xử."
 
  tgp_dynastic_cycle_events.0030.t: "Thay Đổi Con Đường"
  tgp_dynastic_cycle_events.0030.desc: "\"Thời của [my_situation.GetTopCurrentPhase.GetName] là #EMP ngay bây giờ#!\"\n\nBước đi dõng dạc của [marshal.GetNamePossessive], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] của Ta, báo hiệu sự hiện diện của [marshal.GetHerHis] còn rõ hơn lời nói.\n\n\"Ta ngưỡng mộ sự tận tụy của ngươi với con đường dân sự, nhưng [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] đòi hỏi sự táo bạo! Nhớ câu chuyện về [ROOT.Char.Custom('GetRandomAnnalsPassage')] và dẫn đường cho quân đội của chúng ta!\""
  tgp_dynastic_cycle_events.0030.a: "Đã đến lúc dám táo bạo!"
  tgp_dynastic_cycle_events.0030.b: "\"Ta háo hức học hỏi, nhưng không muốn thay đổi.\""
  tgp_dynastic_cycle_events.0030.c: "Không có vinh dự nào cao hơn quản trị dân sự."
 
  tgp_dynastic_cycle_events.0040.t: "Con Đường Của Cơ Hội"
  tgp_dynastic_cycle_events.0040.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))] [steward.GetTitledFirstName] của tôi bước vào thư phòng với nụ cười trên gương mặt và những đồng tiền trong tay [steward.GetHerHis].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], các đoàn buôn từ phía tây ngày càng thường xuyên hơn, theo chân [silk_road_situation.GetName]. Với sự đầu tư khiêm tốn để kết nối tốt hơn với con đường đó, chúng ta có thể thu hút sự giàu có của nhiều vương quốc về với chính mình.\""
  tgp_dynastic_cycle_events.0040.a: "\"Thời kỳ của [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] là dịp hoàn hảo!\""
  tgp_dynastic_cycle_events.0040.b: "\"Đừng lãng phí thời gian!\""
  tgp_dynastic_cycle_events.0040.c: "Con đường Tơ Lụa sẽ tiếp tục. Có chúng ta hay không."
  tgp_silk_road_advancement_modifier: "Đầu Tư Vào Con Đường Tơ Lụa"
  tgp_silk_road_advancement_modifier_desc: "Nhân vật này đã đầu tư vào Con Đường Tơ Lụa #EMP đúng lúc#!."
 
  tgp_dynastic_cycle_events.0050.t: "Thay Đổi Ân Sủng"
  tgp_dynastic_cycle_events.0050.desc: "Sự chi phối của [favored_movement.GetName] trên ngai vàng ngày càng chặt chẽ, lời khuyên của họ định hình chính sách theo ý họ.\n\nNếu lý do của chính Ta muốn vươn lên, Ta phải làm suy yếu uy tín của họ. Một cuộc tranh luận công khai có thể ảnh hưởng đến phán quyết của triều đình, và có thể cả [top_liege.GetTitleAsNamePossessiveNoTooltip].\n\nNhưng thách thức họ là liều lĩnh, nếu lời nói của Ta thất bại sẽ phải chịu nhục nhã."
  tgp_dynastic_cycle_events.0050.a: "Ta không thể nghi ngờ."
  tgp_dynastic_cycle_events.0050.b: "[my_movement.GetNameNoTooltip] sẽ có giá trị riêng."
  tgp_dynastic_cycle_events.0050.c: "Tại sao phải liều mình cho phong trào?"
  tgp_debate_discount_var_tt: "Ngài có thể tổ chức một [GetActivityType('activity_debate').GetName] trong #V 5 năm tới#! với giảm giá #P 25%#!"
  tgp_debate_discount_var_desc: "Từ sự kiện"
