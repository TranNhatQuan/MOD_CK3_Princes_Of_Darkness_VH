l_english: 

 #County Modifiers
  tgp_japan_fresh_fish_county_modifier: "Cá Tươi"
  tgp_japan_fresh_fish_county_modifier_desc: "Người dân hạt này được cung cấp cá vừa đánh bắt tươi ngon."
  tgp_japan_pearl_county_modifier: "Ngọc Trai Quý"
  tgp_japan_pearl_county_modifier_desc: "Những thợ lặn ở hạt này đôi khi tìm được ngọc trai để bán."
  tgp_japan_abalone_temple_offerings_county_modifier: "Cúng Vật Đền Thờ"
  tgp_japan_abalone_temple_offerings_county_modifier_desc: "Những thợ lặn ở hạt này bán bào ngư, được tin rằng mang lại tuổi thọ lâu dài."

  tgp_japan_taxed_entertainment_county_modifier: "Giải Trí Đóng Thuế"
  tgp_japan_taxed_entertainment_county_modifier_desc: "Ở hạt này, không bỏ lỡ cơ hội tăng thu cho nhà nước, kể cả trong việc giải trí của dân."

  tgp_japan_prized_generosity_county_modifier: "Hào Phóng Được Trân Trọng"
  tgp_japan_prized_generosity_county_modifier_desc: "Ít điều gì khuyến khích sự cạnh tranh lành mạnh giữa các làng bằng việc hứa phần thưởng khi họ thi đua, và dân hạt này thực sự được thúc đẩy mạnh mẽ."

  tgp_japan_fire_drilled_county_modifier: "Hộ Gia Đình Được Huấn Luyện Chống Cháy"
  tgp_japan_fire_drilled_county_modifier_desc: "Các hộ gia đình ở hạt này đã được ghi nhớ sâu sắc nguy cơ cháy nổ, mỗi nhà đều phải chuẩn bị xô nước phòng hỏa hoạn."

  tgp_japan_instructive_plays_county_modifier: "Kịch Tính Giáo Dục"
  tgp_japan_instructive_plays_county_modifier_desc: "Người dân hạt này được nhắc nhở về vị trí của họ ngay cả khi họ cố quên bằng vài giờ xem kịch."

 #Character Modifiers
  tpg_japan_hot_spring_relaxation_modifier: "Chăm Sóc Bản Thân"
  tpg_japan_hot_spring_relaxation_modifier_desc: "Nhân vật này đã ngâm mình phục hồi thể trạng trong một [Glossary( 'onsen', 'ONSEN_GLOSS' )]."

  tgp_japan_hot_spring_mystic_positive_modifier: "Tinh Thần Trẻ Lại"
  tgp_japan_hot_spring_mystic_positive_modifier_desc: "Nhân vật này biết cách hòa hợp với bản thân tâm linh."
  tgp_japan_hot_spring_mystic_neutral_modifier: "Tinh Thần Nghi Ngờ"
  tgp_japan_hot_spring_mystic_neutral_modifier_desc: "Nhân vật này cảm nhận được #EMP điều gì đó#! nhưng không rõ đó là gì."
  tgp_japan_hot_spring_mystic_negative_modifier: "Tinh Thần Rời Rạc"
  tgp_japan_hot_spring_mystic_negative_modifier_desc: "Nhân vật này không thể kết nối với bản thân tâm linh."

  tgp_japan_sake_offering_county_modifier: "Cúng Rượu Sake"
  tgp_japan_sake_offering_county_modifier_desc: "Người cai trị hạt này thể hiện sự tôn kính các thần linh trong lễ hội hoa anh đào."

 #Character Modifiers
  tgp_japan_sake_offering_character_modifier: "Món Quà Rượu Sake"
  tgp_japan_sake_offering_character_modifier_desc: "Nhân vật này thể hiện sự tôn kính các thần linh trong lễ hội hoa anh đào."

  tgp_japan_tengu_rumors_character_modifier: "Tin Đồn Tengu"
  tgp_japan_tengu_rumors_character_modifier_desc: "Nhân vật này vẫn đang truy tìm một [Glossary( 'Tengu', 'TENGU_GLOSS' )] sau khi nghe phong thanh tin đồn.\n\nNgười đời truyền tai rằng kẻ nào gặp được và khiến chúng nể phục sẽ được ban thưởng hậu hĩnh."

  tgp_japan_cautious_curiosity_character_modifier: "Tò Mò Thận Trọng"
  tgp_japan_cautious_curiosity_character_modifier_desc: "Nhân vật này mới bị lừa bởi chỉ một tin đồn."

  tpg_japan_add_fish_to_pond_modifier: "Hồ Cá Nhộn Nhịp"
  tpg_japan_add_fish_to_pond_modifier_desc: "Người làm vườn của nhân vật này đã thả thêm rất nhiều cá vào hồ, biến nơi đây thành một địa điểm yêu thích thu hút các triều thần ghé thăm."

  tgp_japan_train_with_troops_modifier: "Quân Lực Được Truyền Cảm Hứng"
  tgp_japan_train_with_troops_modifier_desc: "Nhân vật này đã có bài diễn thuyết, truyền cảm hứng cho quân lính trước mọi trận chiến sắp tới."

  tgp_learned_from_onibi_modifier: "Học Hỏi Từ Onibi"
  tgp_learned_from_onibi_modifier_desc: "Nhân vật này đã đúc kết được hiểu biết từ cuộc thảo luận của họ về [Glossary( 'Onibi', 'ONIBI_GLOSS' )]"

  tgp_buddhist_fighting_modifier: "Mâu Thuẫn Tôn Giáo"
  tgp_buddhist_fighting_modifier_desc: "Nhân vật này ngồi yên khi các giáo phái Phật giáo tranh giành quyền lực trong lãnh thổ của mình."

  tgp_siren_yokai_love_modifier: "Theo Đuổi Tình Yêu"
  tgp_siren_yokai_love_modifier_desc: "Nhân vật này đã được một [Glossary( 'Yokai', 'YOKAI_GLOSS' )] truyền cảm hứng để đi tìm tình yêu."

  tgp_siren_yokai_prose_modifier: "Nhà Kể Chuyện Triển Vọng"
  tgp_siren_yokai_prose_modifier_desc: "Nhân vật này được truyền cảm hứng bởi những bài ca mà họ mơ thấy một [Glossary( 'Yokai', 'YOKAI_GLOSS' )] đang cất tiếng hát cho mình. Giờ đây, họ sẽ tự tay viết nên những thiên truyện của riêng mình."

  tgp_garden_yokai_bloom_modifier: "Vườn Hoa Nở Rộ"
  tgp_garden_yokai_bloom_modifier_desc: "Nhân vật này tin rằng họ đã thấy một [Glossary( 'Yokai', 'YOKAI_GLOSS' )] truyền cảm hứng để họ đầu tư vào khu vườn của mình."

  tgp_garden_yokai_building_modifier: "Kiến Trúc Sư Triển Vọng"
  tgp_garden_yokai_building_modifier_desc: "Nhân vật này tin rằng họ đã thấy một [Glossary( 'Yokai', 'YOKAI_GLOSS' )] truyền cảm hứng để họ xây dựng công trình trong lãnh địa của mình."

  tgp_shadow_yokai_imitation_modifier: "Hiện Diện Đáng Sợ"
  tgp_shadow_yokai_imitation_modifier_desc: "Nhân vật này mang dáng vẻ đầy uy áp, tin rằng họ đang có một đồng minh [Glossary( 'Yokai', 'YOKAI_GLOSS' )]."

  tgp_shadow_yokai_torch_modifier: "Tuần Tra Thêm"
  tgp_shadow_yokai_torch_modifier_desc: "Nhân vật này tin rằng một [Glossary( 'Yokai', 'YOKAI_GLOSS' )] đã chiếm lấy cái bóng của mình và đang tăng cường phòng thủ trong lãnh địa của họ."

  tgp_shrine_heir_modifier: "Được Gia Tộc Ưu Ái"
  tgp_shrine_heir_modifier_desc: "Nhân vật này đã cầu nguyện tại đền thờ và suy nghĩ rằng họ nên đầu tư để bảo đảm tương lai gia tộc."

  tgp_shrine_piety_modifier: "Người Hầu Trung Thành"
  tgp_shrine_piety_modifier_desc: "Nhân vật này củng cố đức tin của mình thông qua việc cầu nguyện tại đền thờ."

  tgp_shrine_wealth_modifier: "Thịnh Vượng Kinh Tế"
  tgp_shrine_wealth_modifier_desc: "Nhân vật này cầu nguyện tại đền thờ và suy nghĩ nên đầu tư để gia tăng tài sản."

  tgp_shrine_health_modifier: "Thân Thể Khỏe Mạnh"
  tgp_shrine_health_modifier_desc: "Nhân vật này cầu nguyện tại đền thờ và suy nghĩ nên đầu tư vào sức khỏe của mình."

  tgp_traveling_safe_modifier: "Lữ Khách Thận Trọng"
  tgp_traveling_safe_modifier_desc: "Nhân vật này đi lại cẩn thận, tránh mọi nguy hiểm tiềm tàng mà không làm chậm tiến độ."

  tgp_rule_follower_modifier: "Thần Dân Vâng Lời"
  tgp_rule_follower_modifier_desc: "Người cai trị này tuân theo luật của chúa tể, và thần dân của họ cũng sẽ tuân theo."

  tgp_attentive_care_modifier: "Chăm Sóc Tận Tình"
  tgp_attentive_care_modifier_desc: "Nhân vật này được quan tâm và chăm sóc đầy đủ."

  tgp_neglected_modifier: "Bị Bỏ Bê"
  tgp_neglected_modifier_desc: "Sức khỏe của nhân vật này bị xem nhẹ."

  tgp_law_defender: "Thi Hành Pháp Luật"
  tgp_law_defender_desc: "Nhân vật này đảm bảo tất cả tội phạm đều chịu án."

  tgp_temple_builder_modifier: "Người Xây Đền"
  tgp_temple_builder_modifier_desc: "Nhân vật này vừa xây dựng lại một đền thờ bị cháy."

  tgp_rebuilder_modifier: "Kiến Trúc Sư Triển Vọng"
  tgp_rebuilder_modifier_desc: "Nhân vật này cố gắng xây dựng các công trình phi tôn giáo.\n\n#warning Không thể xây [temples|E]!#!"

  tgp_burned_yokai_modifier: "Thợ Săn Yokai"
  tgp_burned_yokai_modifier_desc: "Nhân vật này dạo gần đây đã trở nên cảnh giác hơn với [Glossary( 'Yokai', 'YOKAI_GLOSS' )]."

  tgp_burned_weather_modifier: "Công Trình Kiên Cố"
  tgp_burned_weather_modifier_desc: "Nhân vật này đã củng cố công trình để chống lại thiên tai.\nMất [development|E] do [natural_disasters|E]: #P -20%#!"

  tgp_faith_defender_modifier: "Người Chống Dị Giáo"
  tgp_faith_defender_modifier_desc: "Nhân vật này không chịu được những kẻ không tin theo tôn giáo."

  tgp_people_mingler_modifier: "Chính Quyền Hào Phóng"
  tgp_people_mingler_modifier_desc: "Nhân vật này đã thể hiện sự hào phóng tại triều đình."

  tgp_scheme_wary_modifier: "Điều Tra Viên Riêng"
  tgp_scheme_wary_modifier_desc: "Nhân vật này nắm được những bí mật cá nhân trong triều."

  tgp_fertility_boost_modifier: "Sinh Lực Dồi Dào"
  tgp_fertility_boost_modifier_desc: "Nhân vật này tập trung đặc biệt vào việc sinh con nối dõi."

  tgp_longer_life_modifier: "Vị Vua Trường Thọ"
  tgp_longer_life_modifier_desc: "Dù tuổi cao, người cai trị này vẫn cố gắng sống lâu."

  tgp_guilt_fever_modifier: "Cơn Sốt Tội Lỗi"
  tgp_guilt_fever_modifier_desc: "Nhân vật này bị gánh nặng bởi hậu quả của hành động mình."

  tgp_reflection_modifier: "Con Đường Định Mệnh"
  tgp_reflection_modifier_desc: "Nhân vật này gần đây suy ngẫm nhiều và cởi mở hơn với việc khám phá đức tin.\nChi phí [pilgrimage|E]: #P -20%#!"

  tgp_japan_drafted_villagers_modifier: "Làng Sinh Viên Nghĩa Vụ"
  tgp_japan_drafted_villagers_modifier_desc: "Nhân vật này tinh ý trong việc nhận ra tài năng, và luôn tìm ra công dụng cho những dân làng khỏe mạnh."

  tgp_japan_precise_insight_modifer: "Nhìn Xa Trông Rộng"
  tgp_japan_precise_insight_modifer_desc: "Nhân vật này có thể rút ra chiến lược từ những nơi bình thường nhất và áp dụng trong các tình huống quân sự."

  tgp_japan_banisher_of_demons_modifer: "Người Trừ Ma"
  tgp_japan_banisher_of_demons_modifer_desc: "Dù là hóa trang hay không, việc xua đuổi những 'quỷ' mang đuốc ban đêm đã nâng cao danh tiếng của nhân vật này."

  tgp_japan_lucky_fan_fragments_modifier: "Mảnh Quạt May Mắn"
  tgp_japan_lucky_fan_fragments_modifier_desc: "Nhân vật này có thể không thắng giải bắn cung, nhưng họ giữ được một mảnh bia, được cho là mang lại may mắn."

  tgp_japan_a_poetic_life_modifier: "Cuộc Sống Thi Ca"
  tgp_japan_a_poetic_life_modifier_desc: "Nhân vật này ưu tiên sống theo phong cách thi ca. Họ cởi mở với trải nghiệm mới và người khác tìm kiếm trải nghiệm cùng họ."
  tgp_japan_made_high_liege_cuckold_modifier: "Cuộc Sống Thi Ca: Bất Tử Hoàng Gia"
  tgp_japan_made_high_liege_cuckold_modifier_desc: "Nhân vật này làm mình bất tử bằng cách qua lại với vợ của chúa tể họ. Trải nghiệm này sẽ truyền cảm hứng cho tác phẩm thi ca của họ."

  tgp_japan_exchanged_verses_modifier: "Cuộc Sống Thi Ca: Trao Thơ"
  tgp_japan_exchanged_verses_modifier_desc: "Nhân vật này mở rộng kho tàng, thông qua sự giao lưu thơ ca."

  tgp_japan_poetic_to_the_powerful_modifier: "Nhà Thơ Của Quyền Lực"
  tgp_japan_poetic_to_the_powerful_modifier_desc: "Nhân vật này cải thiện mối quan hệ với nhân vật quan trọng bằng một câu thơ khéo léo."

  tgp_japan_poet_poisonous_flowers_modifier: "Hoa Độc"
  tgp_japan_poet_poisonous_flowers_modifier_desc: "Nhân vật này thu thập một số hoa độc, mục đích ra sao thì ai mà biết..."
  tgp_japan_poet_medicinal_flowers_modifier: "Hoa Thuốc"
  tgp_japan_poet_medicinal_flowers_modifier_desc: "Nhân vật này thu thập một số hoa thuốc để cải thiện sức khỏe."

  tgp_japan_made_poetic_life_artifact_modifier: "Cuộc Sống Thi Ca: Ngàn Lá Bất Tử"
  tgp_japan_made_poetic_life_artifact_modifier_desc: "Nhân vật này tạo nên một trụ cột [culture|E] qua tác phẩm thi ca của mình."

  tgp_sharing_power_modifier: "Chia Sẻ Quyền Lực"
  tgp_sharing_power_modifier_desc: "Nhân vật này chia sẻ quyền lực để giảm căng thẳng."

  tgp_power_undermined_modifier: "Quyền Lực Bị Xói Mòn"
  tgp_power_undermined_modifier_desc: "Nhân vật này bị quyền lực bên ngoài làm suy yếu.\n@declare_regent_icon! Chấp Nhận Làm Nhiếp Chính: #P +25#!"

  tgp_spreading_scholarly_work_modifier: "Lan Tỏa Tri Thức"
  tgp_spreading_scholarly_work_modifier_desc: "Nhân vật này khuyến khích học giả viết tiểu luận và cáo trình khắp lãnh thổ."

  tgp_regent_minted_coin_modifier: "Đúc Tiền"
  tgp_regent_minted_coin_modifier_desc: "Nhân vật này đã đúc tiền với hình ảnh của mình."

  tgp_regent_history_modifier: "Khuyến Khích Học Giả"
  tgp_regent_history_modifier_desc: "Nhân vật này khuyến khích học giả và nhà thơ viết về sự vĩ đại của mình."

  tgp_regent_guarded_modifier: "Nâng Cao Tinh Thần"
  tgp_regent_guarded_modifier_desc: "Nhân vật này biết cách ảnh hưởng đến chỉ huy quân đội và hiệp sĩ."

  tgp_stability_tree_modifier: "Rễ Vững Chắc"
  tgp_stability_tree_modifier_desc: "Như rễ của một cây [Glossary( 'Bonsai', 'BONSAI_GLOSS' )], lãnh địa và triều đình của nhân vật này vô cùng vững chãi."

  tgp_health_resistance_modifier: "Sức Khỏe Kiên Cường"
  tgp_health_resistance_modifier_desc: "Nhân vật này ăn thực phẩm đền chùa khi cầu nguyện với tăng nhân, cải thiện sức khỏe nhờ chế độ ăn này."

  tgp_cultural_appreciation_modifier: "Trân Trọng Ngôn Ngữ"
  tgp_cultural_appreciation_modifier_desc: "Nhân vật này nhận thức được sự khác biệt giữa các ngôn ngữ."
 
  tgp_japan_ushiwakamaru: "Ushiwakamaru"
  tgp_japan_ushiwakamaru_desc: "Mạnh mẽ như bò, nhân vật này sẽ tiếp tục tìm kiếm đối thủ mạnh hơn để đấu.\n$stay_duelist_adventurer$"

  tgp_japan_ushiwakamaru_2: "$tgp_japan_ushiwakamaru$"
  tgp_japan_ushiwakamaru_2_desc: "Mạnh mẽ như bò, nhân vật này sẽ tiếp tục tìm kiếm đối thủ mạnh hơn để đấu.\n$stay_duelist_adventurer$"

  tgp_japan_ushiwakamaru_3: "$tgp_japan_ushiwakamaru$"
  tgp_japan_ushiwakamaru_3_desc: "Mạnh mẽ như bò, nhân vật này sẽ tiếp tục tìm kiếm đối thủ mạnh hơn để đấu.\n$stay_duelist_adventurer$"

  tgp_japan_ushiwakamaru_4: "$tgp_japan_ushiwakamaru$"
  tgp_japan_ushiwakamaru_4_desc: "Mạnh mẽ như bò, nhân vật này sẽ tiếp tục tìm kiếm đối thủ mạnh hơn để đấu.\n#help Tiềm năng tối đa của nhân vật này đã đạt được#!"

  tgp_japan_control_over_emperor: "Người Điều Khiển Hoàng Đế"
  tgp_japan_control_over_emperor_desc: "Nhân vật này đã đưa một Hoàng Đế ngoan ngoãn lên ngai vàng."

  tgp_japan_fujiwara_hidehira_back_in_town: "Bằng Gươm"
  tgp_japan_fujiwara_hidehira_back_in_town_desc: "Nhân vật này muốn khôi phục quyền lực của gia tộc Fujiwara bằng vũ lực."

  tgp_moved_shogun_court_modifier: "Kinh Đô Mạc Nhật"
  tgp_moved_shogun_court_modifier_desc: "Hạt này đang được thiết lập làm kinh đô mới của Mạc Nhật, cách xa kinh đô hoàng gia."


