l_english:

  emperor_imperial_examination.100.t: "Kính phục"
  emperor_imperial_examination.100.desc: ""Ngài [ROOT.Char.GetTitleAsNameNoTooltip] tối cao và uyên bác, thật là vinh dự lớn nhất được đứng trước mặt Ngài." [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], nói đầy kính nể. "Nguyện kỳ thi này chứng minh Ta là thần dân trung thành của Ngài."\n\n"Nguyện uy lực và huy hoàng của [ROOT.Char.GetPrimaryTitle.GetNameNoTier], và [ROOT.Char.Custom('GetDaughterSon')|U] của Thiên Đế, trường tồn muôn thuở!""
  emperor_imperial_examination.100.a: "Trung thành; đức hạnh trên hết."
  emperor_imperial_examination.100.b: "Lời khen chóng qua, hành động mới tạo công lao."
  imperial_examination.advantage.other.tt: "Nhận một [exam_advantage|E]"
  imperial_examination.advantage.dynasty_legacy.tt: "Vì Ngài đã mở khóa [GetDynastyPerk( 'tgp_chinese_legacy_1' ).GetName] Di Sản Triều Đại, Ngài sẽ bắt đầu hoạt động với một [exam_advantage|E]"

  emperor_imperial_examination.200.t: "Mỹ Nữ Lựa Chọn"
  emperor_imperial_examination.200.desc: ""Thánh thượng uy nghi," [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], nói với lòng tôn kính. "Trong chuyến đi tới [concubine_origin.GetNameNoTier], Ta gặp một gia đình danh giá, [examination_character_1.GetHouse.GetName], và trò chuyện với các trưởng lão [examination_character_1.GetCulture.GetName]."\n\n"Họ đề nghị Ta chọn một [examination_character_1.GetLadyLord] để phục vụ Ngài trong cung — Ta chọn [examination_character_1.GetFirstName], một [examination_character_1.GetWomanMan] hiếm có đức hạnh. Nguyện [examination_character_1.GetSheHe] làm Ngài vừa lòng, ôi [ROOT.Char.Custom('GetDaughterSon')|U] của Thiên Đế.""
  emperor_imperial_examination.200.a: "[examination_character_1.GetSheHe|U] có thể gia nhập hậu cung."
  emperor_imperial_examination.200.b: "Hãy kể cho ta về chuyến đi của ngươi."
  emperor_imperial_examination.200.c: "Cung điện của ta trông như nhà thổ sao?"

  emperor_imperial_examination.300.t: "Dâng Vật Gia Truyền"
  emperor_imperial_examination.300.desc: "\"Đại [ROOT.Char.GetTitleAsNameNoTooltip], ân đức thánh hiền của người thật bao la.\" [examination_character_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)] của tôi, prostrates [examination_character_2.GetHerselfHimself] trước mặt tôi. \"Con xin dâng một lễ vật khiêm nhường, một món cổ vật để trưng bày trong cung điện.\"\n\n\"[newly_created_artifact.GetName] này là một báu vật gia truyền của gia tộc [examination_character_2.GetHouse.GetName]. Chúng con không xin gì hơn là mong bệ hạ nhận diện chúng con như những bề tôi trung thành.\""
  emperor_imperial_examination.300.a: "Vật phẩm xứng đáng."
  emperor_imperial_examination.300.b: "Chế tác kém, hãy bỏ đi."
  emperor_imperial_examination.300.c: "Nhà [examination_character_2.GetHouse.GetNameNoTooltip] cần tập trung cho kỳ thi."

  emperor_imperial_examination.400.t: "Đọc Biên Niên Sử"
  emperor_imperial_examination.400.desc: "Các giám khảo và thí sinh đứng tụ tập, đọc và thì thầm với nhau trong sự hồi hộp. Thật đúng khi ta, [ROOT.Char.Custom('GetDaughterSon')|U] của Thiên Đế, truyền đạt chút trí tuệ vĩnh cửu. Khi ta ra hiệu, căn phòng im bặt, tất cả ngước nhìn.\n\nTa ra hiệu về kệ sách, và các hầu cận mang đến..."
  emperor_imperial_examination.400.a: "...Biên Niên Sử của [ROOT.Char.Custom('GetRandomAnnalsPassage')]."
  emperor_imperial_examination.400.b: "...[ROOT.Char.Custom('GetRandomPoetryPassage')]."
  emperor_imperial_examination.400.c: "...[ROOT.Char.Custom('GetRandomRitesPassage')]."
  every_palace_entrant: "Mọi Thí Sinh Cung Điện"
  custom_every_examiner: "Mọi Giám Khảo"

  emperor_imperial_examination.500.t: "Thi Ca của [examination_character_2.GetFirstNameNoTooltip]"
  emperor_imperial_examination.500.desc: ""Thiên thượng uy nghi, Ta đã sáng tác một bài thơ tôn vinh ân đức vô tận của Ngài." [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], mở sách và đọc:\n\n#EMP "The [examination_character_2.Custom('GetAdventureNameBand')|l] of [examination_character_2.Custom('GeneratePoem_Title_Fragment_Season')], the [examination_character_2.Custom('GetAdventureNameBand')|l] of [examination_character_2.Custom('GetAdventureNameSuffix')|l] and [examination_character_2.Custom('GetAdventureNameSuffix')|l] — [examination_character_2.Custom('GetAdventureNamePrefixes')|l] in the [poetry_province.Custom('GetTerrainTypePlural')], the [examination_character_2.Custom('GetRandomSmallPreciousItem')] in their hands. From [poetry_county.GetNameNoTier], in [poetry_province.Custom('ProvinceCompliment')] [examination_character_2.Custom('GeneratePoem_Title_Fragment_Noun')|l], within the [examination_character_2.Custom('FormalComplimentAdjective')|l] [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."#!\n\n[examination_character_2.GetSheHe|U] chờ đợi kết luận của Ta."
  emperor_imperial_examination.500.a: "Câu từ gọn gàng, giàu ý nghĩa."
  emperor_imperial_examination.500.b: "Lời lẽ rỗng tuếch như đức hạnh ngươi."

  emperor_imperial_examination.600.t: "Tinh Thần Vui Vẻ"
  emperor_imperial_examination.600.desc: "Khi tôi giám sát đám đông, một trong những thí sinh, [examination_character_2.GetTitledFirstName], trở nên say mê kể chuyện cười đến mức [examination_character_2.GetSheHe] hầu như không nhận thấy mình đang đi đâu. Chậm rãi bước giật lùi, [examination_character_2.GetSheHe] vô tình tiếp cận tôi, thốt lên: \"...và đó là cách [examination_character_2.Custom('GetAdventureNameBand')|l] đánh mất [examination_character_2.Custom('GetAdventureNameSuffix')|l]!\"\n\nTôi khẽ ho.\n\nĐám đông phía trước [examination_character_2.GetHerHim] im bặt. [examination_character_2.GetFirstNameNoTooltip] đứng hình vì sợ hãi."
  emperor_imperial_examination.600.a: "Rất vui nhộn."
  emperor_imperial_examination.600.b: "Đủ rồi, tập trung vào kỳ thi."
  emperor_imperial_examination.600.c: "Là một sự xúc phạm; rời đi ngay."

  emperor_imperial_examination.700.t: "Quà Bạc"
  emperor_imperial_examination.700.desc: ""Ngài [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại," [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], quỳ sâu. "Gia tộc Ta, [examination_character_2.GetHouse.GetName], có quan hệ với thương nhân trên [GetSituationType('silk_road_situation').GetName|l] và $sea_yellow_sea$ — Ta đã tận dụng để dâng một món quà khiêm tốn."\n\n"Đây là rương bạc từ [silver_county.GetNameNoTier], mang dấu hiệu của [silver_county_top_liege.GetTitleAsNameNoTooltip] của [silver_county_top_liege.GetPrimaryTitle.GetDefinitiveName|l].""
  emperor_imperial_examination.700.a: "Ta hoan hỷ nhận."
  emperor_imperial_examination.700.b: "Kể cho ta về [silver_county_top_liege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
  emperor_imperial_examination.700.c: "Chia ra cho các ngươi; dùng cho việc học hành."
  situation_type_silk_road_situation: "Con Đường Tơ Lụa"
  situation_type_silk_road_situation_desc: "$game_concept_silk_road_situation_desc$"

  emperor_imperial_examination.800.t: "Thái Giám Dâng Lễ"
  emperor_imperial_examination.800.desc: ""Đức [ROOT.Char.GetTitleAsNameNoTooltip] khoan dung, thần dân này xin lỗi vì sự gián đoạn," [ROOT.Char.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetTitledFirstName], cúi đầu chào. "Đây là [examination_character_1.GetFirstName] — một [GetTrait('eunuch_1').GetName( GetNullCharacter )] tài năng, trung thành lâu năm với gia tộc [examination_character_2.GetHouse.GetName]."\n\n"Chúng Ta dâng Ngài phục vụ của hắn, để [ROOT.Char.GetPrimaryTitle.GetNameNoTier] thịnh vượng dưới ân đức của Ngài.""
  emperor_imperial_examination.800.a: "Chúng ta sẽ tìm vị trí cho hắn."
  emperor_imperial_examination.800.b: "Hắn có thể làm giám khảo."
  emperor_imperial_examination.800.c: "Giữ lấy thần dân của ngươi."
  becomes_imperial_examiner.tt: "Trở thành Giám Khảo"

  emperor_imperial_examination.900.t: "Một Thần Dân [examination_character_2.Custom('ComplimentAdjective')|U]"
  emperor_imperial_examination.900.desc: "\"Thiên [ROOT.Char.GetTitleAsNameNoTooltip], chúng con cảm ơn người vì bữa tiệc này,\" [examination_character_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', examination_character_1)] của tôi, nói, cúi đầu thấp với một người hầu bên cạnh [examination_character_1.GetHerHis]. \"Đây là [examination_character_1.Custom2('RelationToMeShort', examination_character_2)], [examination_character_2.GetFirstName] — người mang đến một món quà khiêm nhường: [examination_character_1.Custom('GetExpensiveDrink')] từ quê hương con, [origin_county.GetNameNoTier].\"\n\n\"Nhưng hơn cả đồ uống, con xin dâng hiến sự phục vụ của [examination_character_2.GetHerHis]. Kiến thức của [examination_character_2.GetHerHis|U] về [examination_character_2.Custom('highest_skill_noun')] sẽ giúp ích cho hoàng cung.\""
  emperor_imperial_examination.900.a: "Kỹ năng của [examination_character_2.GetHerHis|U] được hoan nghênh."
  emperor_imperial_examination.900.b: "[examination_character_2.GetSheHe|U] sẽ phục vụ Ngài tốt hơn."

  emperor_imperial_examination.1000.t: "Tài Năng Ngoại Quốc"
  emperor_imperial_examination.1000.desc: ""Uyên bác [ROOT.Char.GetTitleAsNameNoTooltip], Ta đến trước Ngài với lòng biết ơn," thí sinh cung điện, [examination_character_2.GetTitledFirstName], nói bằng [chinese.GetLanguage.GetName] hoàn hảo. "Dù Ta sinh ra là [examination_character_2.GetCulture.GetName], nhờ ân đức Ngài mà đến được đây — Ta chỉ mong được phục vụ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."\n\n"Vì vậy Ta học ngôn ngữ thiên thượng — [chinese.GetLanguage.GetName] — như một biểu hiện của sự khiêm nhường [examination_character_2.GetCulture.GetName].""
  emperor_imperial_examination.1000.a: "Nỗ lực của ngươi sẽ được công nhận."
  emperor_imperial_examination.1000.b: "Việc bắt chước [examination_character_2.GetCulture.GetNameNoTooltip] không có chỗ ở đây."
