l_english: 
  tgp_china_ministry.0001.t: "$great_project_type_grand_campaign_project$: Tiến lên"
  tgp_china_ministry.0001.desc: "[great_project.GetName] đang được tiến hành. Niềm tự hào và tham vọng của [owner.GetNamePossessive] đang bị đặt cược.\n\n\"Thật là vinh dự khi được góp mặt trong lịch sử đang được tạo ra.\" [contributor.GetName] tự hào tuyên bố. \"Chiến thắng trước [defender.GetName] sẽ nhanh chóng và trở thành đề tài của những bài thơ mai sau. Chẳng bao lâu, toàn bộ [target_title.GetName] sẽ nằm dưới Thiên Tử!\""
  tgp_china_ministry.0001.a: "Hãy để [GetTitleByKey('h_china').GetNameNoTooltip] phát triển!"
  tgp_china_ministry.0002.t: "$great_project_type_grand_campaign_project$: Thành công"
  tgp_china_ministry.0002.desc: "[great_project.GetName] giành chiến thắng từ tay [defender.GetName].\n\n\"Chẳng bao lâu nữa chúng ta sẽ đưa toàn bộ [target_title.GetName] về dưới Thiên Tử!\" [attacker.GetName] tự tin tuyên bố."
  tgp_china_ministry.0002.a: "Tiến lên!"
  tgp_china_ministry.0003.t: "$great_project_type_grand_campaign_project$: Thất bại"
  tgp_china_ministry.0003.desc: "[great_project.GetName] chịu thất bại từ tay [defender.GetName].\n\n\"Chỉ là một chướng ngại nhỏ trên con đường dẫn tới chiến thắng thôi!\" [attacker.GetName] trấn an."
  tgp_china_ministry.0003.a: "Kiên nhẫn của ta đang cạn."
  tgp_china_ministry.0004.t: "$great_project_type_grand_campaign_project$: Tiến Xa Hơn"
  tgp_china_ministry.0004.desc: "[great_project.GetName] đã được khởi động. [contributor.GetName] tuyên bố sẵn sàng tham gia nỗ lực chiến tranh.\n\n\"Kẻ yếu đuối [title_holder.GetName] không phải là đối thủ của [GetTitleByKey('h_china').GetName]. Ta đã có kế hoạch chiếm lấy [target_title.GetName].\""
  tgp_china_ministry.0004.a: "Hãy coi [target_title.GetNameNoTierNoTooltip] nằm dưới quyền Thiên tử."
  grand_campaign_added_war_target_tt: "[target_title.GetName] đã được thêm vào như một [title|E] đang tranh chấp và là mục tiêu chiến tranh của #V [grand_campaign_war.GetName]#! [war|E]"
  tgp_china_ministry.0005.t: "$great_project_type_grand_campaign_project$: Hoàng hôn"
  tgp_china_ministry.0005.desc_won: "[great_project.GetName] là một thành công vang dội. Lãnh thổ [target_kingdom.GetName] giờ trở thành phần không thể thiếu của [GetTitleByKey('h_china').GetName]\n\n\"Kết quả như mong đợi, nhưng vẫn là lý do để ăn mừng.\" Hoàng đế vui mừng: \"Hãy cho dân biết rằng [ROOT.Char.GetPrimaryTitle.GetName] là vĩ đại nhất dưới Thiên Tử!\""
  tgp_china_ministry.0005.desc_lost: "[great_project.GetName] là một thảm họa khủng khiếp. Vùng đất [target_kingdom.GetName] đã chống lại sức mạnh của [GetTitleByKey('h_china').GetName]\n\n\"Kết quả ngoài dự kiến.\" Vị [owner.GetTitleAsName] nén cơn giận, \"Hãy cho bách tính biết rằng [ROOT.Char.GetPrimaryTitle.GetName] đã mang lại nỗi nhục nhã lớn lao cho Thiên thượng!\""
  tgp_china_ministry.0005.a_win: "Nỗ lực tuyệt vời!"
  tgp_china_ministry.0005.a_lost: "Toàn bộ [GetTitleByKey('h_china').GetNameNoTooltip] nên xấu hổ."
  tgp_china_ministry.0006.opening: "[founder.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  tgp_china_ministry.0006.desc: "Ta rất tiếc phải thông báo rằng [great_project.GetName] phải bị hủy bỏ."
  tgp_china_ministry.0006.a: "Thật đáng tiếc."
  tgp_china_ministry.0007.t: "$tgp_china_ministry.0001.t$"
  tgp_china_ministry.0007.desc: "$tgp_china_ministry.0001.desc$"
  tgp_china_ministry.0007.a: "$tgp_china_ministry.0001.a$"
 
  tgp_china_ministry.0100.t: "Kho bạc [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  tgp_china_ministry.0100.intro: "Đã đến lúc xem xét lại ngân sách [ROOT.Char.Custom('GetRealmRank')]."
  tgp_china_ministry.0100.steward_desc: "[steward.GetShortUIName] đứng trước mặt Ta, trán cau lại, sổ sách trong tay. Một đội quân nhỏ trợ lý theo sau [steward.GetHerHim], vác đầy giấy tờ, sách vở và ghi chép tài chính.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]. Chúng ta #EMP phải#! xem xét chi tiêu và chuẩn bị ngân sách mới cho kho bạc. Ta e rằng không thể trì hoãn việc này.\""
  tgp_china_ministry.0100.solo_desc: "Ta thấy mình bị bao quanh bởi một đội ngũ nhỏ các viên chức, chất đầy giấy tờ, sách vở và ghi chép tài chính. Tất cả đang chờ Ta hoàn thành việc xem xét.\n\n"
  tgp_china_ministry.0100.income_desc: "Thu nhập hiện tại của chúng ta vượt xa chi tiêu."
  tgp_china_ministry.0100.deficit_desc: "Chi tiêu của chúng ta quá lớn, và kho bạc sẽ sụp đổ nếu không hành động."
  tgp_china_ministry.0100.fallback_desc: "Đã nhiều năm kể từ khi ngân sách lần cuối được áp dụng."
  tgp_china_ministry.0100.a: "Rất tốt. Hãy thiết lập ngân sách mới."
  tgp_china_ministry.0100.b: "Giữ nguyên các phân bổ."
  tgp_china_ministry.0100.c: "Ta tin tưởng vào quyết định của ngươi trong vấn đề này."
  tgp_china_ministry.0100.a_tooltip: "Ngươi sẽ chọn một [treasury_budget|E] từ nhiều tùy chọn"
  single_quotation_desc: """
 
  tgp_china_ministry.0101.desc: "Nhiều tài liệu với các đề xuất nằm trước mặt Ta, mỗi tài liệu vạch ra một hướng đi khác nhau cho kho bạc — chi tiêu ở đâu, siết chặt ở đâu.\n\nTa sẽ chọn cái nào?"
  tgp_china_ministry.0101.a: "Tiền lương nên là ưu tiên hàng đầu."
  tgp_china_ministry.0101.b: "Hãy đảm bảo các quan bộ đều nhận được phần đáng kể."
  tgp_china_ministry.0101.c: "Một quân đội mạnh là một vương quốc mạnh."
  tgp_china_ministry.0101.d: "Dành một phần lớn hơn chỉ cho sử dụng hoàng gia."
  tgp_china_ministry.0101.e: "Một nền kinh tế cân bằng sẽ phục vụ chúng ta tốt nhất."
 
  tgp_treasury_enact_salary_budget_info_desc: "[treasury_budget_category|E] Trọng tâm: @gold_icon![treasury_salary_budget_short|E]\nMột [treasury_budget|E] thường được [governors|E] ưa thích — họ có thể tăng thiện cảm nếu phân bổ mới cải thiện lương của họ"
 
  tgp_treasury_enact_ministry_budget_info_desc: "[treasury_budget_category|E] Trọng tâm: @government_type_celestial![treasury_ministry_budget_short|E]\nMột [treasury_budget|E] thường được [ministers|E] ưa thích — người được thêm ngân sách có thể sử dụng cho trách nhiệm riêng của họ, như bắt đầu [great_projects|E]"
 
  tgp_treasury_enact_military_budget_info_desc: "[treasury_budget_category|E] Trọng tâm: @celestial_military_administration![treasury_military_budget_short|E]\nMột [treasury_budget|E] thường được các [governors|E] quân sự ưa thích — họ nhận thêm tiền để tuyển và duy trì [title_men_at_arms|E]"
 
  tgp_treasury_enact_hegemon_budget_info_desc: "[treasury_budget_category|E] Trọng tâm: @legitimacy_icon_mandate![son_of_heaven|E]\nMột [treasury_budget|E] để lại phần lớn kho bạc chưa phân bổ, cho phép [liege|E] sử dụng theo ý muốn"
 
  tgp_treasury_enact_balanced_budget_info_desc: "[treasury_budget_category|E] Trọng tâm: @law_icon!Cân bằng\nMột [treasury_budget|E] nỗ lực phân bổ kho bạc đều cho tất cả các hạng mục"
 
  tgp_treasury_enact_salary_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] được ấn định ở mức [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
  tgp_treasury_enact_ministry_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] được ấn định ở mức [GetLaw('budget_allocation_ministry_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
  tgp_treasury_enact_military_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] được ấn định ở mức [GetLaw('budget_allocation_ministry_20').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_40').GetShortName|V]#!"
  tgp_treasury_enact_hegemon_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] được ấn định ở mức [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
  tgp_treasury_enact_balanced_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] được ấn định ở mức [GetLaw('budget_allocation_ministry_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
 
  tgp_treasury_enact_meritocratic_salary_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_55').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_35').GetShortName|V]#!"
  tgp_treasury_enact_meritocratic_military_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_55').GetShortName|V]#!"
  tgp_treasury_enact_meritocratic_balanced_budget_desc: "Ban hành [treasury_budget|E] với các nội dung sau:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] được ấn định ở mức [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] được ấn định ở mức [GetLaw('budget_allocation_military_45').GetShortName|V]#!"
 
  tgp_china_ministry.0200.t: "Ngân sách của một Bộ trưởng"
  tgp_china_ministry.0200.desc: "Một lần nữa, [minister_of_revenue.GetCouncilTitle] của Ta, [minister_of_revenue.GetFirstName], đứng trước mặt Ta, sổ sách trong tay.\n\n\"Ta đảm bảo với ngươi, [ROOT.Char.Custom('FormOfAddressForLiege')] — kho bạc sẽ phát triển nếu chúng ta tiến hành theo đề xuất của ta!\""
  tgp_china_ministry.0200.a: "Tuyệt vời. Hãy thực hiện ngay lập tức!"
  tgp_china_ministry.0200.b: "Ta e rằng ta có kế hoạch khác cho kho bạc."
  tgp_china_ministry.0200.toast_t_success: "Ngân sách được chấp thuận"
  tgp_china_ministry.0200.toast_desc_success: "[treasury_ruler.GetShortUIName|U] đã chấp thuận đề xuất của ngươi"
  tgp_china_ministry.0200.toast_t_failure: "Ngân sách bị từ chối"
  tgp_china_ministry.0200.toast_desc_failure: "[treasury_ruler.GetShortUIName|U] đã từ chối đề xuất của ngươi"
