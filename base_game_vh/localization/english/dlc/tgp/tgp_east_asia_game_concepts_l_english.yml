l_english:
 #Mandala
  game_concept_mandala: "Mandala"
  game_concept_mandala_desc: "Dưới [government_form|E] $game_concept_mandala$, [domain_limit|E] và số lượng [direct_vassals|E] bị hạn chế. Thay vào đó, [liege|E] và [suzerain|E] phụ thuộc vào các [tributaries|E] để mở rộng lãnh thổ của mình. \n\nMột [ruler|E] Mandala có thể khao khát được nhìn nhận như một Vua Thần, hay Devaraja, và sau đó dựa vào [mandala_radiance|E] để thu phục và giữ vững các $game_concept_tributaries$.\n\nMột $game_concept_ruler$ phải duy trì [opinion|E] và phát triển mối quan hệ với các $game_concept_tributaries$ của họ để giữ họ lâu dài. Khi kế vị, các $game_concept_tributaries$ có thể phân tán trừ khi $game_concept_ruler$ đó là một [mandala_succesor|E] xứng đáng."
  game_concept_mandalas: "Các Mandala"
  game_concept_mandala_government: "Chính Quyền Mandala"
  game_concept_mandala_i: "@government_type_mandala!"
  game_concept_mandala_government_desc: "$game_concept_mandala_desc$"

  game_concept_mandala_succession: "Kế Vị Mandala"
  game_concept_mandala_succession_succession: "Kế Vị"
  game_concept_mandala_trials: "Thử Thách Mandala"
  game_concept_mandala_succesor: "Người Kế Vị Devaraja"
  game_concept_mandala_succession_desc: "Khi một [mandala|E] [ruler|E] qua đời và đã chọn một [mandala_aspect|E], [heir|E] của họ phải trải qua $game_concept_mandala_succession$ Thử Thách. Trong những Thử Thách này, Người Kế Vị phải đối mặt với các Thách Thức [skill|E] kiểm tra năng lực trong Kỹ Năng Aspect liên quan cũng như hai Kỹ Năng Aspect khác.\n\nVượt qua thử thách có nghĩa là Người Kế Vị đã thuyết phục được những người theo dõi rằng họ xứng đáng và [realm|E] vẫn ổn định.\n\n#EMP Nếu Thất Bại#! sẽ phải chịu các hình phạt tăng dần:\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 1#! Thách Thức Thất Bại: Mất một [piety_level|E] và một lượng nhỏ [tributaries|E] tách ra.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 2#! Thách Thức Thất Bại: Mất hai [piety_levels|E] và tất cả Tributaries tách ra.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold Tất Cả#! Thách Thức Thất Bại: Mất ba [piety_levels|E] và [realm|E] bị tan rã.#!"

  game_concept_mandala_radiance: "Hào Quang Mandala"
  game_concept_radiance: "Hào Quang"
  game_concept_radiant: "Rực Rỡ"
  game_concept_mandala_radiance_desc: "Sức hút để thu hút và giữ [subjects|E] cho một [mandala|E] [ruler|E] được gọi là Hào Quang Mandala. Nó là sự kết hợp của [piety_level|E], #V [GetBuilding('mandala_capital_01').GetTypeName]#! [great_building|E] và cấp độ [mandala_aspect|E].\n\nPhần thưởng cao hơn, nhiều Subjects hơn và quyền lực hơn chờ đợi những ai kết hợp cả ba để trở nên Rực Rỡ hơn."

  game_concept_mandala_decree: "Sắc Lệnh Mandala"
  game_concept_mandala_decrees: "Các Sắc Lệnh Mandala"
  game_concept_mandala_decree_desc: "$game_concept_mandala_decrees$ là ba Sắc Lệnh do [mandala|E] [ruler|E] ban hành — bao gồm [prosperity_decree|E], [expansion_decree|E] và [reverence_decree|E].\n\nThông thường, vương quốc Mandala có quyền lực tập trung cao, nơi quyền kiểm soát [subjects|E] và [laws|E] nằm trong tay Ruler và có thể thay đổi theo nhu cầu mà ít gặp phản đối từ thần dân."
  game_concept_decree: "Sắc Lệnh"
  game_concept_decrees: "Các Sắc Lệnh"
  game_concept_mandala_decree_prosperity: "Sắc Lệnh Thịnh Vượng"
  game_concept_mandala_decree_prosperity_desc: "Với [GetLaw('mandala_decree_prosperity').GetName], [mandala|E] [ruler|E] tập trung kích thích và truyền cảm hứng cho tất cả [subjects|E] để thực hiện những thay đổi tích cực.\n\nNỗ lực được hướng tới phát triển [development|E], [buildings|E], tích lũy tài sản cũng như củng cố cộng đồng qua quan hệ cá nhân."
  game_concept_prosperity_decree: "Thịnh Vượng"
  game_concept_mandala_decree_expansion: "Sắc Lệnh Mở Rộng"
  game_concept_mandala_decree_expansion_desc: "[GetLaw('mandala_decree_expansion').GetName] quy định rằng tất cả [subjects|E] tập trung vào việc mở rộng [realm|E].\n\nTăng số lượng quân, cơ sở quân sự và hỗ trợ bất kỳ [wars|E] nào được [mandala|E] [ruler|E] chỉ đạo là điều tối quan trọng."
  game_concept_expansion_decree: "Mở Rộng"
  game_concept_mandala_decree_reverence: "Sắc Lệnh Tôn Kính"
  game_concept_mandala_decree_reverence_desc: "[GetLaw('mandala_decree_reverence').GetName] yêu cầu [mandala|E] [subjects|E] tập trung vào việc tăng cường tâm linh và thờ phượng.\n\n[pilgrimages|E], nghi lễ và [piety|E] là nền tảng của Sắc Lệnh Mandala này."
  game_concept_reverence_decree: "Tôn Kính"

  game_concept_mandala_aspect: "Khía Cạnh Mandala"
  game_concept_mandala_aspects: "Các Khía Cạnh Mandala"
  game_concept_aspect: "Khía Cạnh"
  game_concept_aspects: "Các Khía Cạnh"
  game_concept_mandala_aspect_desc: "Để một [mandala|E] [ruler|E] đạt được sự tôn kính và thần thánh vĩnh cửu, họ cần liên kết với một trong các Khía Cạnh nhận diện họ là thần.\n\nCác Khía Cạnh có sẵn gồm: \n$EFFECT_LIST_BULLET$[aspect_of_creation|E]\n$EFFECT_LIST_BULLET$[aspect_of_serenity|E]\n$EFFECT_LIST_BULLET$[aspect_of_destruction|E]\n$EFFECT_LIST_BULLET$[aspect_of_trickery|E]\n\nCác Khía Cạnh này sẽ ảnh hưởng đến kỳ vọng và hành động của Ruler."
  game_concept_aspect_of_creation: "Khía Cạnh Sáng Tạo"
  game_concept_aspect_of_creation_desc: "Với lời hứa thúc đẩy sản xuất và mang lại thịnh vượng cho thần dân, Khía Cạnh Sáng Tạo mang lại lợi ích cho các hoạt động kinh tế và tổ chức.\n$EFFECT_LIST_BULLET$Tập trung vào [stewardship|E]\n$EFFECT_LIST_BULLET$Các giải thưởng xây dựng liên tiếp nhận [GetModifier( 'mandala_creator_modifier' ).GetNameWithTooltip|L] tích lũy\n$EFFECT_LIST_BULLET$Xây dựng thông thường nhận [piety|E]\n$EFFECT_LIST_BULLET$Nuôi [legitimate|E] [children|E] nhận [piety|E]\n$EFFECT_LIST_BULLET$Có quyền sử dụng #high [GetScheme('coerce_contribution').GetTypeName]#! [scheme|E]\n$EFFECT_LIST_BULLET$Chỉ có thể chết bởi [death_natural_cause|E] hoặc [death_religious|E] [character_death_deaths|E]"
  game_concept_aspect_of_serenity: "Khía Cạnh Bình An"
  game_concept_aspect_of_serenity_desc: "Một vương quốc yên bình là một vương quốc thịnh vượng — Khía Cạnh Bình An coi trọng hòa bình và ngoại giao, thưởng cho những ai đi theo con đường này.\n$EFFECT_LIST_BULLET$Tập trung vào [diplomacy|E]\n$EFFECT_LIST_BULLET$Tránh [wars|E] tấn công được tăng hiệu quả bởi [GetModifier( 'mandala_increments_of_peace_modifier' ).GetNameWithTooltip|L] tích lũy\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] và [GetScheme('befriend').GetTypeName] [schemes|E] thành công hơn\n$EFFECT_LIST_BULLET$Có thể #high $request_great_project_contribution_interaction$s#! từ [allies|E]\n$EFFECT_LIST_BULLET$Chỉ có thể chết bởi [death_natural_cause|E] hoặc [death_religious|E] [character_death_deaths|E]"
  game_concept_aspect_of_destruction: "Khía Cạnh Hủy Diệt"
  game_concept_aspect_of_destruction_desc: "Sợ hãi và kinh hoàng là cách để cai trị. Quyền lực thật sự nằm ở khả năng tước đoạt sự sống. Khía Cạnh Hủy Diệt mang lại lợi ích cho những ai chia rẽ và chinh phục.\n$EFFECT_LIST_BULLET$Tập trung vào [martial|E]\n$EFFECT_LIST_BULLET$Có lợi thế về modifiers quân sự\n$EFFECT_LIST_BULLET$Có quyền sử dụng #high [GetCasusBelliType('mandala_plunder_cb').GetName]#! [casus_belli|E]\n$EFFECT_LIST_BULLET$Chỉ có thể chết bởi [death_natural_cause|E], [death_religious|E] hoặc [death_combat|E] [character_death_deaths|E]"
  game_concept_aspect_of_trickery: "Khía Cạnh Xảo Quyệt"
  game_concept_aspect_of_trickery_desc: "Thiện hay ác; Khía Cạnh Xảo Quyệt thưởng cho khả năng kiểm soát người khác mà họ không hay biết. Thần quyền để làm gì nếu không để định hình thế giới theo hình ảnh của Ngài?\n$EFFECT_LIST_BULLET$Tập trung vào [intrigue|E]\n$EFFECT_LIST_BULLET$Có thể dùng [piety|E] hối lộ [agents|E] trong [schemes|E]\n$EFFECT_LIST_BULLET$Có quyền sử dụng #high [GetScheme('leverage_contribution').GetTypeName]#! [scheme|E]\n$EFFECT_LIST_BULLET$Chỉ có thể chết bởi [death_natural_cause|E], [death_religious|E] hoặc [death_murder|E] [character_death_deaths|E]"

  game_concept_mandala_ritual: "Nghi Lễ Mandala"
  game_concept_mandala_rituals: "Các Nghi Lễ Mandala"
  game_concept_ritual: "Nghi Lễ"
  game_concept_rituals: "Các Nghi Lễ"
  game_concept_mandala_ritual_desc: "Nghi Lễ Mandala là các nhiệm vụ thỉnh thoảng xuất hiện cho [mandala|E] [rulers|E] — dấu hiệu rằng một phần của [realm|E] cần sự hướng dẫn và nâng đỡ thần thánh của Ngài.\n\nKỹ năng cao hơn trong [mandala_aspect|E] sẽ tăng lợi ích khi xuất hiện trước [subjects|E]."
  game_concept_mandala_ritual_tier: "Cấp Nghi Lễ Mandala"
  game_concept_ritual_tier: "Cấp Nghi Lễ"
  game_concept_mandala_ritual_tier_desc: "[ritual_tier|E] của một [mandala_ritual|E] cho biết mức độ nơi đó được hưởng lợi từ sự hướng dẫn của Ngài cũng như phần thưởng dành cho Ngài."

 #Tribute Mission
  game_concept_tribute_mission: "Nhiệm Vụ Triều cống"
  game_concept_tribute_missions: "Các Nhiệm Vụ Triều cống"
  game_concept_tribute_mission_desc: "Là một [tributary|E], sự tôn trọng cũng như Cống cần được trả cho [suzerain|E] định kỳ.\n\nKhông thực hiện có thể dẫn đến nhiều hậu quả, trong đó hậu quả nhẹ nhất là mất [legitimacy|E]."
  game_concept_tribute: "Cống"
  game_concept_tributes: "Các Cống"
