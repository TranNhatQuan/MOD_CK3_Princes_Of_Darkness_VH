l_english: 
  genpei_intro: "Chiến tranh Genpei:"

  tgp_genpei_character.1000.t: "$genpei_intro$ Gentian Bị Quấy Rối"
  tgp_genpei_character.1000.desc: "Tôi bị ám ảnh bởi thất bại của cha tôi và vụ sát hại các anh em của tôi trong [Glossary( 'Heiji Rebellion', 'HEIJI_REBELLION_GLOSS' )]. Nỗi nhục nhã này thúc đẩy sự trả thù của tôi đối với [Glossary( 'Taira', 'TAIRA_GLOSS' )] đáng ghê tởm! Mặc dù [kiyomori_taira.GetFirstName] có thể nghĩ [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] đã được đảm bảo bởi cuộc hôn nhân của con gái [kiyomori_taira.GetHerHis] với [norihito_tenno.GetTitledFirstName], [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] vẫn nắm quyền kiểm soát tại các tỉnh phía đông, và hoàng gia đang cảm thấy khó chịu dưới sự cai trị của [kiyomori_taira.GetHerHis].\n\nMặc dù người đứng đầu bù nhìn của Minamoto, [yorimasa_minamoto.GetFirstName], đã hỗ trợ [kiyomori_taira.GetFirstNameNoTooltip] chống lại cha tôi, gián điệp của tôi báo tin rằng đã có sự rạn nứt giữa hai người đó. Ở nơi khác, anh họ của tôi, [yoshinaka_minamoto.GetFirstName], vẫn chưa tha thứ cho cái chết của cha [yoshinaka_minamoto.GetHerHis] dưới tay anh cùng cha khác mẹ của tôi, nhưng hắn sẽ trở thành một đồng minh hữu ích..."
  tgp_genpei_character.1000.a: "#bold Ta#! sẽ một mình kết thúc [kiyomori_taira.GetDynasty.GetNameNoTooltip]!"
  tgp_genpei_character.1000.a.flavor: "[ruler.GetShortUIName|U] sẽ cố gắng tập hợp lực lượng của riêng Ngài để giải phóng [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] khỏi bạo quyền [kiyomori_taira.GetDynastyName]"
  tgp_genpei_character.1000.b: "Chúng ta [ruler.GetDynasty.GetNameNoTooltip] phải đoàn kết chống lại."
  tgp_genpei_character.1000.b.flavor: "Ngài phải hòa giải khác biệt nếu muốn lật đổ [kiyomori_taira.GetDynastyName] gần như bất khả chiến bại"
  tgp_genpei_character.1010.t: "$genpei_intro$ Gentian Không Bị Ràng Buộc"
  tgp_genpei_character.1010.desc.intro: "[kiyomori_taira.GetFirstName]! Lòng tham quyền lực của hắn là một dòng sông chảy không kiểm soát, tàn phá cả truyền thống cao quý lẫn phép tắc. Ngay cả việc tự xưng là [kiyomori_taira.GetHerselfHimself] [kiyomori_taira.GetTitleAsName], chủ nhân của toàn Nhật Bản, cũng không thể thỏa mãn cơn khát vô độ của hắn. Say sưa trong sự hưng phấn của quyền thống trị [Glossary( 'Taira', 'TAIRA_GLOSS' )] không ai thách thức, [kiyomori_taira.GetSheHe] đã thấy phù hợp để loại bỏ [Glossary( 'Emperor', 'TENNO_GLOSS' )] [old_emperor.GetTitledFirstName] và đưa cháu trai của [kiyomori_taira.GetHerHis], [new_emperor.GetFirstName], lên [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]."
  tgp_genpei_character.1010.desc.blocboss: "Là mũi nhọn của [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], Ta phải chịu trách nhiệm. Chúng ta phải là hàng rào chống lại tham vọng [kiyomori_taira.GetDynasty.GetNameNoTooltip], nếu không sẽ trở thành những kẻ khiêng kiệu cho nó!"
  tgp_genpei_character.1010.desc.notblocboss: "\n\nTrong quá khứ, gia tộc Ta từng là hàng rào chống lại tham vọng [kiyomori_taira.GetDynasty.GetNameNoTooltip]. Nay, lãnh đạo [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] bất tài muốn biến chúng ta thành những kẻ khiêng kiệu. [minamoto_ruler.GetFirstName] quá yếu. Nếu cha Ta còn sống, việc này sẽ không bao giờ xảy ra."
  tgp_genpei_character.1010.a: "Ta phải tập hợp [ruler.GetDynasty.GetNameNoTooltip]."
  tgp_genpei_character.1010.a.flavor: "[bloc|E] sẽ tập hợp theo lời kêu gọi của Ngài và chắc chắn sẽ làm [ruler.GetHouse.GetName] trở thành [house|E] lãnh đạo nếu Ngài dùng #V $assume_house_bloc_leadership_interaction$#! [interaction|E]."
  tgp_genpei_character.1010.a.tt: "Mỗi [house|E] trong [bloc|E] sẽ cải thiện cấp độ [house_relation|E] với [ruler.GetHouse.GetName]"
  tgp_genpei_character.1010.b: "Có lẽ [kiyomori_taira.GetDynasty.GetNameNoTooltip] mới là người cai trị chính đáng?"
  tgp_genpei_character.1010.b.flavor: "Nếu Ngài lấy lòng bọn họ bây giờ, có thể đảm bảo vị trí làm cận thần nổi bật."

  tgp_genpei_character.1090.t: "$genpei_intro$ Gentian Báo Thù"
  tgp_genpei_character.1090.desc: "Quyền kế vị của tôi để lãnh đạo [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] đã bị đánh cắp! Người cha cao quý của tôi đã bị sát hại bởi sự huynh đệ tương tàn nhỏ nhen! Cuộc thảm sát người thân trong [Glossary( 'Heiji Rebellion', 'HEIJI_REBELLION_GLOSS' )] không làm gì khác ngoài việc mở đường cho [Glossary( 'Taira', 'TAIRA_GLOSS' )] độc ác thống trị [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]. [kiyomori_taira.GetFirstName], say sưa trong quyền lực đã tự xưng là [Glossary( 'Daijō-daijin', 'DAIJO_DAIJIN_GLOSS' )]!\n\nGiờ đây anh họ [yoritomo_minamoto.GetFirstName] của tôi tìm cách đoàn kết [yoritomo_minamoto.GetDynasty.GetNameNoTooltip] chống lại tên bạo chúa này, nhưng đã không chịu sám hối cho tội ác của cha [yoritomo_minamoto.GetHerHis]. Gia tộc mới của tôi, [ruler.GetHouse.GetName], đứng lên thách thức như chính cái tên của nó; những ngọn núi đã che chở tôi khỏi người chú sát nhân!\n\nLiệu sức mạnh của riêng tôi có đủ để chấm dứt thời đại bạo chúa này?"
  tgp_genpei_character.1090.a: "$tgp_genpei_character.1000.a$"
  tgp_genpei_character.1090.a.flavor: "$tgp_genpei_character.1000.a.flavor$"
  tgp_genpei_character.1090.b: "$tgp_genpei_character.1000.b$"

  tgp_genpei_character.1095.t: "$genpei_intro$ Gentian Chính Đáng"
  tgp_genpei_character.1095.desc: "Trái tim tôi rỉ máu vì nước Nhật của cha tôi. [kiyomori_taira.GetFirstName] đã phá hủy tất cả những gì chúng ta từng biết! Dấu tích cuối cùng của sự chính nghĩa, [old_emperor.GetFirstName] là [Glossary( 'Emperor', 'TENNO_GLOSS' )] [current_emperor.GetHerselfHimself], đã bị loại bỏ khỏi [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] và [kiyomori_taira.GetFirstNamePossessiveNoTooltip] đứa cháu trai còn ẵm ngửa, [current_emperor.GetFirstName], đã bị đưa vào vị trí của [old_emperor.GetHerHis].\n\nVới việc anh họ [yoritomo_minamoto.GetFirstName] của tôi sẵn sàng lãnh đạo [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] chống lại sự bạo ngược của [kiyomori_taira.GetFirstNamePossessiveNoTooltip], liệu tôi có nên tham gia sự nghiệp của [yoritomo_minamoto.GetHerHis] khi tôi là chiến binh giỏi hơn và vị trí chính đáng của tôi là ở vị trí lãnh đạo? Hay tôi có dám mạo hiểm chia rẽ quyền lực của chúng ta và tự mình gọi gia đình về dưới lá cờ của tôi?"
  tgp_genpei_character.1095.a: "Không có tương lai với [yoritomo_minamoto.GetFirstNameNoTooltip]. [ruler.GetDynasty.GetNameNoTooltip] là của Ta!"
  tgp_genpei_character.1095.a.flavor: "$tgp_genpei_character.1000.a.flavor$"
  join_house_bloc_yoshinaka_tt: "[house|E] [THIS.House.GetBaseName] sẽ gia nhập [bloc|E] của Ngài"
  tgp_genpei_character.1095.b: "Ta sẽ nhẫn nhịn thuốc đắng này... tạm thời."
  tgp_genpei_character.1095.b.flavor: "Nguy cơ thống trị của [kiyomori_taira.GetDynasty.GetNameNoTooltip] quá lớn. [ruler.GetDynasty.GetNameNoTooltip] phải đoàn kết để đánh bại chúng."

  tgp_genpei_character.1100.t: "$genpei_intro$ Gentian Dữ Dội"
  tgp_genpei_character.1100.desc: "Cha Ta bị [Glossary( 'Taira', 'TAIRA_GLOSS' )] [kiyomori_taira.GetFirstName] đánh bại trong [Glossary( 'Heiji Rebellion', 'HEIJI_REBELLION_GLOSS' )], Ta phải trở thành [Glossary( 'Rōnin', 'RONIN_GLOSS' )] ở núi phía bắc. Tại đây, [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS') ] mạnh mẽ [hidehira_fujiwara.GetFirstName] cho Ta nơi nương náu.\n\nThống trị triều đình của [kiyomori_taira.GetFirstNamePossessiveNoTooltip] báo hiệu thời kỳ thống trị toàn diện của [kiyomori_taira.GetDynasty.GetNameNoTooltip]. Đối mặt với điều này, đầu lĩnh [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], [yorimasa_minamoto.GetFirstName], làm nhục chúng Ta bằng sự hèn nhát. May mắn, em trai Ta [yoritomo_minamoto.GetFirstName] nắm thanh kiếm các gia tộc samurai phía đông và chuẩn bị lật đổ bạo chúa.\n\nTrên hết, Ta hy vọng cơn bão sắp tới sẽ mang những kẻ xứng đáng với lưỡi kiếm của Ta!"
  tgp_genpei_character.1100.a: "Tạm thời Ta sẽ phục vụ [hidehira_fujiwara.GetFirstNameNoTooltip]."
  tgp_genpei_character.1100.b: "Gia đình Ta cần sự hỗ trợ của Ta."
  tgp_genpei_character.1100.c: "Định mệnh đã trao Ta con đường của thanh kiếm."
  stay_duelist_adventurer: "#help Chiến thắng càng nhiều đấu tay đôi, hiệu ứng trên càng mạnh#!"

  tgp_genpei_character.2000.t: "$genpei_intro$ Bướm Bay"
  tgp_genpei_character.2000.desc: "[GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U] là hiện thân của ý chí, mưu lược và quyền lực [Glossary( 'Taira', 'TAIRA_GLOSS' )] của Ta! Không gì thoát khỏi tầm tay Ta ngoài [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l].\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noriko_taira'))], [noriko_taira.GetFirstName], sẽ sớm lấy được hạt giống từ [norihito_tenno.GetTitledFirstName] trẻ tuổi của chúng ta. [noriko_taira.GetHerHis|U] tử cung mạnh mẽ sẽ sinh ra một người kế thừa với dòng máu [ROOT.Char.GetHouse.GetBaseName] chảy trong huyết quản. Một người kế thừa, sẵn sàng nghiền nát bất cứ ai dám thách thức quyền uy của chúng ta, đảm bảo sự thăng tiến của chúng ta vĩnh viễn!"
  tgp_genpei_character.2000.a: "Hiện tại, hãy làm dịu những con cừu."
  tgp_genpei_character.2000.b: "Đầu độc giếng nước..."
  tgp_genpei_character.2000.b.flavor: "Ngài bôi nhọ [norihito_tenno.GetTitleAsName] với hy vọng việc thoái vị cưỡng bức trong tương lai sẽ thuận lợi hơn."
  every_non_taira_vassal: "Mọi [dynasty|E] [vassal|E] không thuộc [GetDynastyByID('japanese_taira_kanmu').GetName] của [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U]"
  tgp_genpei_character.2000.c: "Bồi bổ cậu bé bằng sữa mạnh!"
  tgp_genpei_character.2000.c.flavor: "Người kế thừa mới phải khỏe mạnh nếu muốn ngồi lên ngai từ lúc sinh ra."

  tgp_genpei_character.2010.t: "$genpei_intro$ Ngã Ba Quyền Lực"
  tgp_genpei_character.2010.desc: "Một người kế thừa dòng máu Ta! [new_emperor.GetTitledFirstName] đã ra đời, sẵn sàng lên ngôi [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]. Việc loại bỏ [current_emperor.GetTitledFirstName] có vẻ đơn giản. Tuy chính đáng, nhưng hành động này có thể kích động nổi loạn...\n\nĐất nước này đầy những kẻ phản loạn! Những [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] ngoan cố của [minamoto_ruler.GetFirstNamePossessive] vẫn còn hằn học về thất bại trong [Glossary( 'Heiji Rebellion', 'HEIJI_REBELLION_GLOSS' )]. [motofusa_fujiwara.GetFirstName], dù quyền lực đã giảm, vẫn khao khát những ngày mà [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS') ] làm chủ [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U]. Gần gũi với Ta nhất, cha của hoàng đế, lão [Glossary( 'Jōkō', 'JOKO_GLOSS') ] [go_shirakawa.GetFirstName], từng là đồng minh, giờ nghi ngờ động cơ của Ta. Ta sẽ đi theo con đường nào?"
  tgp_genpei_character.2010.a: "Hậu quả mặc kệ, sự thịnh vượng của Taira bắt đầu hôm nay!"
  tgp_genpei_character.2010.b: "Tiêu diệt [minamoto_ruler.GetDynasty.GetNameNoTooltip] là ưu tiên."
  tgp_genpei_character.2010.b.flavor: "Ngài sẽ tìm được đồng minh ở [fujiwara_ruler.GetDynasty.GetName] và dẹp bỏ tàn dư cuối cùng của [minamoto_ruler.GetDynasty.GetName] phản bội."
  tgp_genpei_character.2010.c: "Quyền tối cao của Samurai sẽ giải quyết mọi vấn đề."
  tgp_genpei_character.2010.c.flavor: "Ngài sẽ liên minh với [minamoto_ruler.GetDynasty.GetName], không còn hy vọng nào cho các quan như [fujiwara_ruler.GetDynasty.GetName] giành lại quyền kiểm soát."
  tgp_genpei_character.2010.d: "Hồi sinh liên minh mạnh nhất của Ta."
  tgp_genpei_character.2010.d.flavor: "Qua bao khó khăn, [go_shirakawa.GetName] và Ta đã vượt qua mọi trở ngại. Lần này cũng vậy!"
  minamoto_clan_will_respond_to_our_actions: "#warning @warning_icon! [GetDynastyByID('japanese_minamoto_seiwa').GetName] sẽ chắc chắn phản ứng#!"

  tgp_genpei_character.3000.t: "$genpei_intro$ Wisteria Tan Tán"
  tgp_genpei_character.3000.desc: "Bị hạ xuống từ [GetTitleByKey('b_kyo').GetBaseNameNoTier] đến vùng hẻo lánh [GetTitleByKey('c_oki').GetBaseNameNoTierNoTooltip]. Thật bất công! [Glossary( 'Taira', 'TAIRA_GLOSS' )] [kiyomori_taira.GetFirstName] đầy mưu mô và xảo trá là nguồn cơn của đau khổ Ta và sự hạ thấp [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS') ]!\n\nSau khi chúng ta giúp đánh bại [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] trong [Glossary( 'Heiji Rebellion', 'HEIJI_REBELLION_GLOSS' )], [kiyomori_taira.GetSheHe] lợi dụng bệnh tình của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('motozane_fujiwara'))], [motozane_fujiwara.GetFirstNamePossessive] để chia cắt tài sản và củng cố quyền lực. Không hài lòng với chức [Glossary( 'Daijō-daijin', 'DAIJO_DAIJIN_GLOSS' )], [kiyomori_taira.GetHerHis] gả con gái cho [norihito_tenno.GetTitledFirstName], trong mưu đồ trần trụi để kiểm soát ngai vàng.\n\nHy vọng duy nhất của Ta để lật đổ tên bạo chúa này là lão [Glossary( 'Jōkō', 'JOKO_GLOSS') ] [go_shirakawa.GetFirstName], cha của [norihito_tenno.GetTitleAsNamePossessiveNoTooltip] và đồng minh cũ... hoặc [hidehira_fujiwara.GetFirstName] cùng [hidehira_fujiwara.GetHerHis] dòng [hidehira_fujiwara.GetDynasty.GetName] mạnh mẽ ở phương bắc."
  DAIJO_DAIJIN_GLOSS: "#bold Daijō-daijin#! — #EMP Thủ tướng Đế quốc#! — đứng đầu #EMP Daijō-kan#! — #EMP Hội đồng Quốc gia#! — một chức vị cao quý trong thời kỳ Nara (710-794).\n\nChức vị này được [Glossary( 'Taira', 'TAIRA_GLOSS' )] Kiyomori tái lập như vị trí cao nhất ngoài hoàng gia, và là người đứng đầu thực tế của chính quyền hoàng gia."
  tgp_genpei_character.3000.a: "Mọi người sẽ biết đến tội lỗi của [kiyomori_taira.GetFirstNamePossessiveNoTooltip]!"
  tgp_genpei_character.3000.a.flavor: "Vẫn còn [motofusa_fujiwara.GetTitleAsNameNoTooltip] tôn trọng truyền thống và quyền lợi quý tộc [GetTitleByKey('b_kyo').GetBaseNameNoTier]"
  tgp_genpei_character.3000.b: "[go_shirakawa.GetFirstNameNoTooltip] vẫn có thể khôi phục lý trí."
  tgp_genpei_character.3000.b.flavor: "Lão hoàng đế đã chèo lái đất nước từ trước khi Ngài sinh ra"
  send_letter_to_go_shirakawa: "Ngài gửi thư cho [go_shirakawa.GetName]"
  tgp_genpei_character.3000.c: "Mọi [motofusa_fujiwara.GetDynasty.GetNameNoTooltip], dù thấp hèn, cũng phải khao khát công lý."
  tgp_genpei_character.3000.c.flavor: "Hãy để Wisteria mọc tự do, từ bờ biển này sang bờ biển kia, bao quanh ngai vàng như vốn dĩ của nó!"
  tgp_genpei_character.3010.opening: "Gửi Hoàng đế của quá khứ, [go_shirakawa.GetNameNoTooltip],"
  tgp_genpei_character.3010.desc: "Vương quốc mà ngài từng cai trị đang dần tan rã. Cả hai gia tộc samurai hùng mạnh đã bắt đầu tập hợp tất cả lực lượng có thể. Ta biết ngài vẫn còn cay đắng vì sự chuyên quyền của [GetDynastyByID('japanese_taira_kanmu').GetName]. Gia tộc [ROOT.Char.GetDynasty.GetName] cần ngài. Cùng nhau, chúng ta có thể khôi phục quyền lực hoàng gia và chấm dứt sự hỗn loạn của lớp samurai."
  tgp_genpei_character.3010.a: "Ta sẽ không thể giúp chống lại [GetDynastyByID('japanese_taira_kanmu').GetNameNoTooltip]."
  tgp_genpei_character.3010.b: "Ngài nói đúng... hãy đứng cùng nhau chống lại họ."

  tgp_genpei_character.3100.t: "$genpei_intro$ Wisteria Lạc Lối"
  tgp_genpei_character.3100.desc: "Những [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] kiêu ngạo ở kinh đô từng chế nhạo chúng Ta, #EMP 'Ai lại bỏ xa hoa và cung điện của [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] để đến các tỉnh phía bắc hoang vắng?'#! Thật ngớ ngẩn cho những quan chức đó...\n\n[motofusa_fujiwara.GetFirstName] giờ chỉ còn danh nghĩa [Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] — quá yếu để thách thức [kiyomori_taira.GetFirstName] mưu mô, tự xưng [Glossary( 'Daijō-daijin', 'DAIJO_DAIJIN_GLOSS' )] và là kẻ thao túng thực sự ngai vàng [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]. Sớm thôi, [Glossary( 'Taira', 'TAIRA_GLOSS' )] sẽ không thể bị ngăn cản, và ai biết khi nào lãnh địa của Ta sẽ bị thách thức? Phải chăng Ta sẽ cứu hoàng gia khỏi nanh vuốt Taira và thiết lập trật tự Fujiwara mới?\n\nCó lẽ [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] lạc lối [yoshitsune_minamoto.GetTitledFirstName] sẽ là đồng minh hữu ích chống lại kẻ thù chung này..."
  tgp_genpei_character.3100.a: "Ta nên chấp nhận vị trí hiện tại của mình."
  tgp_genpei_character.3100.b: "Bảo vệ tự do không phải là việc ích kỷ!"

  tgp_genpei_character.4000.t: "$genpei_intro$ Hoa Cúc Héo"
  tgp_genpei_character.4000.desc: "Dưới sự giám sát của Ta, [kiyomori_taira.GetFirstName] đã trở thành người cai trị không tranh cãi của Nhật Bản. Ta thật ngớ ngẩn, để [kiyomori_taira.GetHerHim] bóp méo tham vọng của Ta, gạt bỏ các nhiếp chính [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )], chỉ để nắm quyền cho riêng [kiyomori_taira.GetHerselfHimself].\n\nCon trai Ta, [norihito_tenno.GetTitledFirstName], vẫn ngồi trên [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l], nhưng còn được bao lâu? [noriko_taira.GetFirstName], [norihito_tenno.GetHerHis] [noriko_taira.Custom('WifeHusband')], và con gái của [kiyomori_taira.GetFirstNamePossessiveNoTooltip], chắc chắn sớm sinh ra người kế thừa dễ kiểm soát hơn.\n\nẢnh hưởng một thời vô hạn của Ta với vai trò [Glossary( 'Jōkō', 'JOKO_GLOSS' )] đang ở mức thấp. Với [motofusa_fujiwara.GetFirstName] bị lưu đày và [Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] chỉ còn danh nghĩa, và [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] bị nghiền nát bởi [Glossary( 'Taira', 'TAIRA_GLOSS' )] trong [Glossary( 'Heiji Rebellion', 'HEIJI_REBELLION_GLOSS' )], thật khó tưởng tượng ai có thể chống lại Taira hùng mạnh..."
  tgp_genpei_character.4000.a: "Ta sẽ không chịu đựng điều này thêm nữa."
  tgp_genpei_character.4000.b: "Hiện tại tốt nhất là chờ đợi."
