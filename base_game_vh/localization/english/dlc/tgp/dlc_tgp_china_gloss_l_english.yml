l_english:
 

  FOUR_WAYS_GLOSS: "Có nhiều phương pháp nghiêm ngặt để đánh giá năng lực của một người. Bốn phương pháp nổi bật dựa trên ngoại hình, hùng biện, thư pháp và khả năng xét đoán."
  CUJU_GLOSS: "Cuju là một môn thể thao cạnh tranh có nguồn gốc từ thời nhà Hán. Môn này đã được thực hành cho mục đích giải trí và rèn luyện thể chất từ đó, với các đội lên đến 20 người trong các buổi tiệc tại triều đình Hoàng gia. Trò chơi chủ yếu liên quan đến việc đá một quả bóng qua cột gôn cao, đồng thời tránh để bóng chạm đất."
  CONFUCIUS_GLOSS: "Khổng Tử, hay Thầy Khổng, là một nhà triết học đã sáng lập hệ thống niềm tin dựa trên nhân nghĩa và hành vi đạo đức. 'Đạo', như ông mô tả trong Luận Ngữ, trở thành nền tảng về cách cai trị quốc gia và nhân dân."
  BIAN_QUE_GLOSS: "Biển Thước là danh xưng của nhiều vị thần y huyền thoại trong lịch sử Trung Hoa: bao gồm một y sĩ lừng danh sống vào thời Chiến Quốc (475 – 221 TCN), và một vị cùng tên từ thời đại Hoàng Đế xa xưa."
  MERIT_LOWER_LOWER_GLOSS: "[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L] [merit_level|E] trong bộ máy quan lại của [GetTitleByKey('h_china').GetDefinitiveName], còn được gọi là Hạ Hạ (下下)"
