l_english:
 ##################################################
 # JAPAN CAREER EVENTS
 ##################################################
  tgp_japan_career.0001.t: "Câu Chuyện Về Gia Tộc [new_ruler.GetDynastyNameNoTooltip]"
  tgp_japan_career.0001.desc: "[kampaku.GetPrimaryTitle.GetDefinitiveName|U] đang sôi động với các [blocs|E], tất cả tranh giành quyền lực và ảnh hưởng."
  tgp_japan_career.0001.soryo_desc: "Là người cai trị [new_ruler.GetGovernment.GetName], gia tộc Ta đã chinh phục các tỉnh và dẹp loạn! Chúng Ta xứng đáng có mức độ tự chủ và quyền lực cá nhân mà những [ritsuryo|E] yếu ớt chỉ biết đẩy giấy tờ ở kinh đô [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U] không có.\n\nTa phải xây dựng quân đội, bảo vệ đất đai và mở rộng lãnh thổ. Trách nhiệm của Ta là khôi phục trật tự ở [kampaku.GetPrimaryTitle.GetNameNoTier] và mang vinh quang cho [house|E] — [new_ruler.GetHouse.GetName]!"
  tgp_japan_career.0001.ritsuryo_desc: "Là người cai trị [new_ruler.GetGovernment.GetName], nhiệm vụ của Ta với tư cách quan chức nằm ở kinh đô [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U]. Trung tâm quyền lực và văn hóa này là mảnh đất màu mỡ để tăng ảnh hưởng cho gia tộc, thông qua những việc làm mẫu mực hoặc chính sách khôn khéo.\n\nNhững truyền thống thanh lịch này đang bị đe dọa bởi những chiến binh [soryo|E] mới nổi từ các tỉnh, tìm cách củng cố quyền lực và mở rộng đất đai cá nhân."
  tgp_japan_career.0001.kampaku_desc: "Là [new_ruler.GetTitleAsNameNoTooltip|U], Ta chịu trách nhiệm tối cao cho đế quốc trong vai trò [ceremonial_regent|E]. Từ kinh đô [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U], Ta lãnh đạo thần dân [japanese_emperor_possessive|E] và nỗ lực duy trì hòa bình mong manh.\n\nTa phải cân bằng chính trị quyền lực trong triều đầy những quan chức [ritsuryo|E] mưu mô cũng như lo ngại ngày càng tăng từ các chiến binh [soryo|E] lập đất đai riêng ở các tỉnh."
  tgp_japan_career.0001.tenno_desc: "Là [japanese_emperor|E], nhiệm vụ của Ta liên quan đến thần thánh và nghi lễ. [kampaku.GetTitleAsName|U] xử lý mọi việc trần thế, nhưng có nên vậy không? Triều đình đang căng thẳng khi các [soryo|E] [rulers|E] lập đất đai cá nhân ở các tỉnh, thách thức các quan chức [ritsuryo|E] truyền thống tại kinh đô [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U].\n\nLiệu những nhân tố thay đổi này có giúp chúng ta trở lại thời kỳ cai trị đế quốc thực thụ, với [new_ruler.GetTitleAsName|U] giám sát cả việc thiên thượng lẫn trần gian?"
  tgp_japan_career.0001.desc_2: "\n\nMỗi người chúng ta đều có vai trò, và chúng ta sẽ thực hiện nó!"
  tgp_japan_career.0001.a: "Dù có chuyện gì xảy ra, chúng ta sẽ vững vàng."
  tgp_japan_career.0001.b: "Hòa bình mong manh, chúng ta phải sẵn sàng!"
  tgp_japan_peace_modifier: "Nỗ Lực Vì Ổn Định"
  tgp_japan_peace_modifier_desc: "Nhân vật này tập trung đối mặt với mọi thử thách bằng tâm trí minh mẫn và bình tĩnh."
  tgp_japan_war_modifier: "Chuẩn Bị Cho Xung Đột"
  tgp_japan_war_modifier_desc: "Nhân vật này tin rằng chiến tranh sắp tới và họ sẽ sẵn sàng cho điều đó." 
 
