l_english:
  tgp_east_asia_decision_events.0010.t: "Chân Trời Mới"
  tgp_east_asia_decision_events.0010.desc: "Đôi khi giác ngộ đến từ những nguồn ít ngờ tới nhất.\n\nCon đường Mandala trong cai trị một lãnh thổ cộng hưởng với Ta ở một… tầng cao hơn. Chắc chắn sự tồn tại của Ta phục vụ một mục đích vĩ đại hơn, để thống nhất lãnh thổ dưới quyền cai trị thần thánh và nhân từ của Ta.\n\n#EMP 'Vạn tuế Devaraja [ROOT.Char.GetFirstNameNoTooltip]'#! nghe thật oai phong..."
  tgp_east_asia_decision_events.0010.a: "Hãy #EMP điều này#! là sắc lệnh đầu tiên của ta."
  tgp_east_asia_decision_events.0010.b: "Quận [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] chưa xứng đáng có một ngôi đền, #EMP chưa#!..."
 tgp_east_asia_decision_events.0010.b_temple_citadel: "My temple stands mighty fine in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] already!"
  all_tribal_holdings_will_change_to_citadels: "Tất cả [tribal_holdings|E] trong lãnh thổ sẽ trở thành [temple_citadel_holdings|E]"
  realm_capital_will_change_to_citadel: "[realm_capital|E] [holding|E] sẽ trở thành [temple_citadel_holding|E]"

  tgp_east_asia_decision_events.0015.opening: "[overlord.Custom2('AppropriateGreeting', ROOT.Char)]"
  tgp_east_asia_decision_events.0015.desc: "Ta nhận ra rằng sự tồn tại của Ta phục vụ một mục đích cao cả hơn.\n\nHãy gia nhập cùng Ta, và chúc mừng Devaraja mới của các ngươi!"
  tgp_east_asia_decision_events.0015.a: "Điều này có thể mang lại điều gì…"

  tgp_east_asia_decision_events.0020.t: "Devaraja Của Ta"
  tgp_east_asia_decision_events.0020.desc: "Ta đã thấy các dấu hiệu. Ta biết điều gì là đúng. Không có thực tại nào mà Ta không thể ủng hộ [overlord.GetTitledFirstName] và quyền cai trị nhân từ của [overlord.GetHerHis] trên cõi tồn tại này.\n\nChúng ta sẽ thích nghi, và theo chân người chăn thần thánh vào một tương lai rực rỡ.\n\n#EMP Vạn tuế Devaraja [overlord.GetFirstNameNoTooltip].#!"
  tgp_east_asia_decision_events.0020.close_family_pre_tt: "[close_family|E] sẽ chuyển sang #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
  tgp_east_asia_decision_events.0020.close_family_post_tt: "[close_family|E] đã chuyển sang #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
  tgp_east_asia_decision_events.0020.a: "Vạn tuế!"
  tgp_east_asia_decision_events.0020.b: "$tgp_east_asia_decision_events.0010.b$"

  tgp_east_asia_decision_events.0025.opening: "[liege.Custom2('AppropriateGreeting', ROOT.Char)]"
  tgp_east_asia_decision_events.0025.desc: "Không có thực tại nào mà Ta không thể ủng hộ [overlord.GetTitledFirstName] và quyền cai trị nhân từ của [overlord.GetHerHis] trên cõi tồn tại này.\n\nVạn tuế [overlord.GetTitledFirstName|U]!"
  tgp_east_asia_decision_events.0025.a: "$tgp_east_asia_decision_events.0015.a$"


  tgp_east_asia_decision_events.0030.t: "Chấp Nhận Đường Lối Gia Tộc"
  tgp_east_asia_decision_events.0030.desc: "Một bức thư đã đến từ bàn làm việc của [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetLiege)], [liege.GetTitledFirstName]. Nó thông báo về một thay đổi gần đây trong chính quyền và thúc giục chúng ta hòa nhập và ủng hộ lãnh chúa.\n\nLà chư hầu hợp pháp của [liege.GetTitleAsNameNoTooltip], bổn phận của Ta là tuân theo."
  tgp_east_asia_decision_events.0030.a: "Hãy biến điều này thành lợi ích cho chúng ta."
 
  realm_capital_will_change_to_castle: "[realm_capital|E] [holding|E] sẽ trở thành [castle_holding|E]"

  tgp_east_asia_decision_events.0100.t: "Phần Lợi Của Người Thành Tín"
  tgp_east_asia_decision_events.0100.desc: "Tình yêu của chúng ta đối với Devaraja thần thánh [overlord.GetFirstNameNoTooltip] vô bờ bến.\n\n[overlord.GetLadyLord] #EMP siêu việt#! và biết hết mọi điều, dù trong triều đình hay trên chiến trường.\n\nNghi ngờ, do dự của chúng ta… tất cả được tha thứ, tất cả được hóa giải — một thực thể thiên thượng thực sự giữa chúng ta.\n\nTa đã biết điều đó từ lâu."
  tgp_east_asia_decision_events.0100.a: "Nguyện những cánh hoa của chúng ta không bao giờ héo rụng."

  failed_assimilation_payout_msg: "Thất Bại Trong Thần Tính Mandala"
  failed_assimilation_payout_msg_desc: "Ngài hoặc Devaraja hứa hẹn [saved_devaraja.GetShortUIName] không sống xứng với thần tính Mandala"

  invite_a_court_brahmin_decision: "Tìm kiếm $court_brahmin_court_position$"
  invite_a_court_brahmin_decision_desc: "Một brahmin trong triều là đồng minh quyền lực. Họ sẽ quản lý các mối quan hệ triều cống và làm la bàn đạo đức trong những thời khắc khó khăn."
  invite_a_court_brahmin_decision_tooltip: "Người hầu của Ngài sẽ gợi ý một số ứng viên phù hợp cho vị trí [GetCourtPositionType('court_brahmin_court_position').GetName()]"
  tgp_east_asia_decision_events.0200.t: "Một Brahmin Trong Triều"
  tgp_east_asia_decision_events.0200.desc: "Lời nói của Ta đã lan xa, và cuối cùng hai lãnh đạo tinh thần được đưa vào triều đình.\n\n[great_brahmin_option.GetTitledFirstName|U] tỏa ra sự bình thản và dành thời gian suy ngẫm yên tĩnh, trong khi [good_brahmin_option.GetTitledFirstName] hơi ít kinh nghiệm hơn nhưng nhiệt tình quan sát xung quanh, rõ ràng háo hức tiếp nhận trách nhiệm."
  tgp_east_asia_decision_events.0200.a: "[great_brahmin_option.GetTitledFirstNameNoTooltip|U] sẽ là một bổ sung tuyệt vời."
  tgp_east_asia_decision_events.0200.a.aptitude: "[aptitude|E] của [great_brahmin_option.GetFirstNamePossessiveNoTooltip] là [great_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
  tgp_east_asia_decision_events.0200.b: "Ta tin [good_brahmin_option.GetTitledFirstNameNoTooltip] có tiềm năng."
  tgp_east_asia_decision_events.0200.b.aptitude: "[aptitude|E] của [good_brahmin_option.GetFirstNamePossessiveNoTooltip] là [good_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
  tgp_east_asia_decision_events.0200.c: "Cả hai đều có vẻ không hấp dẫn."

  invite_a_khlon_glan_decision: "Tìm kiếm $khlon_glan_court_position$"
  invite_a_khlon_glan_decision_desc: "Đã đến lúc tìm một khlon glan phù hợp để hỗ trợ phát triển kinh đô, quản lý lãnh thổ và tổ chức triều đình."
  invite_a_khlon_glan_decision_tooltip: "Người hầu của Ngài sẽ gợi ý một số ứng viên phù hợp cho vị trí [GetCourtPositionType('khlon_glan_court_position').GetName()]"
  tgp_east_asia_decision_events.0210.t: "Khlon Glan"
  tgp_east_asia_decision_events.0210.desc: "Cuộc tìm kiếm một khlon glan trung thành của tôi đã khiến [great_khlon_glan_option.GetTitledFirstName] và [good_khlon_glan_option.GetTitledFirstName] xuất hiện trước cửa nhà tôi.\n\nChúng ta tập hợp tại kho vũ khí, nơi phần lớn công việc của họ sẽ được thực hiện.\n\n[great_khlon_glan_option.GetTitledFirstNameNoTooltip] khéo léo đánh giá kho hàng chỉ bằng một hoặc hai cái nhìn thoáng qua, trong khi [good_khlon_glan_option.GetTitledFirstNameNoTooltip] dành vài giây nhìn quanh để định vị phương hướng của [good_khlon_glan_option.GetHerHis]."
  tgp_east_asia_decision_events.0210.a: "[great_khlon_glan_option.GetTitledFirstNameNoTooltip] có vẻ là lựa chọn sáng suốt hơn."
  tgp_east_asia_decision_events.0210.a.aptitude: "[aptitude|E] của [great_khlon_glan_option.GetFirstNamePossessiveNoTooltip] là [great_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
  tgp_east_asia_decision_events.0210.b: "[good_khlon_glan_option.GetTitledFirstNameNoTooltip] có thể hữu ích."
  tgp_east_asia_decision_events.0210.b.aptitude: "[aptitude|E] của [good_khlon_glan_option.GetFirstNamePossessiveNoTooltip] là [good_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
  tgp_east_asia_decision_events.0210.c: "$tgp_east_asia_decision_events.0200.c$"

  tgp_east_asia_decision_events.0300.t: "Hoa Tại [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
  tgp_east_asia_decision_events.0300.desc: "Người nghệ nhân, [local_artisan.GetTitledFirstName], tiếp cận tôi với sự hào hứng trong từng bước chân của [local_artisan.GetHerHis]: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Bunga mas đã sẵn sàng!\" [local_artisan.GetSheHe] háo hức ra hiệu cho tôi đi cùng [local_artisan.GetHerHim] đến xưởng của [local_artisan.GetHerHis].\n\nTrên quầy, một tác phẩm ấn tượng gồm hai cái cây đang nở rộ. Kim loại vàng và bạc lấp lánh, được đánh bóng đến mức hoàn hảo, và có một mức độ chi tiết bắt mắt ở những chiếc lá và cành cây tinh xảo."
  tgp_east_asia_decision_events.0300.outro: "\n\nTa gật đầu nhã nhặn: 'Rất tuyệt, [local_artisan.GetTitledFirstNameNoTooltip].'"
  tgp_east_asia_decision_events.0300.outro.masterwork: "\n\nTa nghiêng người quan sát từng chi tiết vỏ cây, gật đầu tán thưởng: 'Xuất sắc, [local_artisan.GetTitledFirstNameNoTooltip].'"
  tgp_east_asia_decision_events.0300.outro.famed: "\n\nTa dừng đôi chút để chiêm ngưỡng những chạm trổ quý giá và hoa tinh xảo: 'Kỳ diệu, [local_artisan.GetTitledFirstNameNoTooltip]!'"
  tgp_east_asia_decision_events.0300.outro.illustrious: "\n\nTa nín thở đôi giây, trân trọng trước vẻ uy nghi của tác phẩm: 'Phi thường, [local_artisan.GetTitledFirstNameNoTooltip]!'"
  tgp_east_asia_decision_events.0300.a: "Điều này thật vừa ý."
  common_bunga_mas_desc.tt: "Khi dâng lên Chúa Công:\n$BULLET_WITH_TAB$Nhận (#V 1#!) tầng [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
  masterwork_bunga_mas_desc.tt: "Khi dâng lên Chúa Công:\n$BULLET_WITH_TAB$Nhận đến (#V 2#!) tầng [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
  famed_bunga_mas_desc.tt: "Khi dâng lên Chúa Công:\n$BULLET_WITH_TAB$Nhận (#V 2#!) tầng [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
  illustrious_bunga_mas_desc.tt: "Khi dâng lên Chúa Công:\n$BULLET_WITH_TAB$Nhận (#V 3#!) tầng [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
  bunga_mas: "Hoa Vàng Tại [ROOT.Char.GetLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
  common_bunga_mas_desc: "Một [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] thường, chế tác từ vàng và bạc. Hoa luôn nở rộ, ánh sáng phản chiếu lộng lẫy."
  masterwork_bunga_mas_desc: "Một [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] tinh xảo bằng vàng bạc. Chi tiết nhỏ nhất và tinh vi len lỏi vào từng chiếc lá mỏng manh, gần như trong suốt."
  famed_bunga_mas_desc: "Hoa chế tác bậc thầy; chạm trổ tinh tế trên cành. Cây [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] vàng bạc khiến ai cũng trầm trồ."
  illustrious_bunga_mas_desc: "Những cây [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] vàng bạc tuyệt mỹ này thật đáng ngắm. Từng chi tiết chạm trổ tinh xảo; lá mềm mại. Tựa như cây sống được nhúng trong kim loại quý."
