  steppe_admin_icon_concept: "@government_type_steppe_admin!"
  steppe_admin_government_vassals_label: "[obligations|E] của $steppe_admin_government$ dựa trên [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
  steppe_admin_government_desc: "\n$game_concept_steppe_admin_desc$\n\n#F Hệ thống $steppe_admin_government$ kết hợp lối sống du mục với quan chế Nho giáo của chính quyền hành chính tập trung Trung Hoa.#!"
  steppe_admin_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
