l_english:
  imperial_examination_jay.0010.t: "Tâm Ý Đồng Nhất"
  imperial_examination_jay.0010.desc: ""Ngươi phải xem [friends_child.GetTitledFirstName] kìa!", cười [friend.GetTitledFirstName] — một phụ huynh đồng hành những ngày qua, mang lại niềm vui — "Con [friends_child.Custom('GetDaughterSon')] của ta năn nỉ suốt mấy ngày để có một thú cưng [ROOT.Char.Custom('SmallAnimal')]. Thế mà ta tìm thấy nó đang kêu chit chit dưới gối [friends_child.GetHerHis]!"\n\nCả hai chúng Ta bật cười trước cảnh đó. Thật tiếc là chúng ta sắp phải chia tay!"
  imperial_examination_jay.0010.a: "Nhưng tình  Bạn củachúng ta sẽ còn tiếp tục!"
  imperial_examination_jay.0010.b: "Chúng ta phải giới thiệu bọn trẻ với nhau!"
  imperial_examination_jay.0010.c: "Thật tiếc, ta không ở đây để vui chơi."

  imperial_examination_jay.0040.t: "Những Con Cáo Trong Vườn"
  imperial_examination_jay.0040.desc: "Chim sẻ ríu rít dưới nắng, cá Koi tung tăng trong hồ, cho tới khi hai bóng người lững thững đi xuống lối vườn, xua hết chim cá đi. Người thứ nhất là [parent.GetWomanMan] ta nhận ra là một giám khảo. Người kia là [parent.GetTitledFirstName], [cheater_child.Custom2('RelationToMe', parent )] của [cheater_child.GetTitledFirstName].\n\n[parent.GetFirstNameNoTooltip] lén để một túi lục lạc vào áo giám khảo [examiner.GetFirstNamePossessive], người này lộ ra tờ đáp án và nói về việc #EMP 'học hành giỏi'#! [cheater_child.GetTitledFirstNameNoTooltip] chắc chắn rất xuất sắc."
  imperial_examination_jay.0040.a: "Ta sẽ để mắt tới mưu kế này."
  imperial_examination_jay.0040.b: "Thông tin này có thể hữu ích."
  imperial_examination_jay.0040.c: "Ta chỉ muốn một chút yên bình."

  imperial_examination_jay.0080.t: "Sự Ngã"
  imperial_examination_jay.0080.desc: "Giám khảo [examiner.GetTitledFirstName] lẽ ra nên thận trọng hơn khi chạy với quá nhiều thứ! Một lát [examiner.GetSheHe] chạy dọc hành lang với chồng giấy và bút cọ chênh vênh, rồi với một tiếng la chói tai [examiner.GetSheHe] ngã xuống, giấy tờ tung tóe khắp nơi.\n\nMột trang giấy rơi vào mắt Ta: một bài thi mang tên [child.Custom2('MyCharacterIntroduction', ROOT.Char)], những lỗi sai rõ ràng ngay cái nhìn đầu tiên..."
  imperial_examination_jay.0080.a: ""Ôi không! Ngươi làm đổ mực lên giấy này!""
  imperial_examination_jay.0080.a.success: "[examiner.GetSheHe|U] nhận trách nhiệm"
  imperial_examination_jay.0080.a.failure: "[examiner.GetSheHe|U] nhận ra việc ngươi làm"
  imperial_examination_jay.0080.b: ""[examiner.GetFirstNameNoTooltip]! Ngươi ổn chứ!?""
  imperial_examination_jay.0080.c: ""Hahaha, ngươi thật vụng về!""

  imperial_examination_jay.0110.t: "Giám Khảo Đeo Trang Sức"
  imperial_examination_jay.0110.desc: "Giám khảo [examiner.GetFirstName] nói chuyện với Ta bên ly [ROOT.Char.Custom('RegionalDrink')], mùi nước hoa [examiner.GetHerHis] nồng hơn hẳn mùi đồ uống. Một món trang sức quanh cổ [examiner.GetHerHis] kêu lách cách mỗi khi [examiner.GetSheHe] nhấp một ngụm.\n\n""Món này," [examiner.GetSheHe] cười, "là #EMP 'quà tặng'#! từ một học trò cũ.""
  imperial_examination_jay.0110.a: "Ta #EMP cũng#! có quà từ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstNameNoTooltip] của ta."
  imperial_examination_jay.0110.b: "Vật này vô dụng. Hãy để ta #EMP vứt bỏ#! nó."
  imperial_examination_jay.0110.b.tt: "Ngươi trở thành chủ nhân của một vòng cổ [prestige|E] [artifact|E]"
  imperial_examination_jay.0110.b.equipped_tt: "Đã nhận [bribed_necklace.GetName] từ [examiner.GetTitledFirstName]."
  imperial_examination_jay.0110.c: "Ta không hứng thú với loại [examiner.GetWomenMen] này."
  bribed_necklace_name: "Vòng Cổ Tinh Xảo"
  bribed_necklace_desc: "Vòng cổ này là món trang sức đơn giản nhưng thanh lịch."

  imperial_examination_jay.0120.t: "Thiên Tài"
  imperial_examination_jay.0120.desc: "Giám khảo [examiner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', examiner )] của Ta, cúi sâu khi [examiner.GetSheHe] tiến lại. ""[child.GetTitledFirstName] là [child.Custom('GetDaughterSon')] của Ngài, phải không?""\n\n[examiner.GetHerHis|U] cúi sâu hơn khi Ta trả lời. ""[child.GetFirstNamePossessiveNoTooltip] biểu hiện đến nay làm ta rất ấn tượng. [child.GetSheHe|U] là niềm tự hào của gia tộc [ROOT.Char.GetHouse.GetName]. Rõ ràng Ngài đã dạy dỗ [child.GetHerHim] tốt!""
  imperial_examination_jay.0120.a: "Học vấn của [ROOT.Char.GetHouse.GetNameNoTooltip] ai cũng biết!"
  imperial_examination_jay.0120.b: "Sao không giúp rèn giũa tài năng [child.GetHerHis]?"
  imperial_examination_jay.0120.c: "Hãy nói với [child.GetHerHim] rằng ta tự hào, giám khảo."
  imperial_examination_jay.0120.d: "Tài năng [child.GetTitledFirstNamePossessiveNoTooltip] sẽ được mọi người biết!"

  imperial_examination_jay.0170.t: "Lời Khen Ngọt Ngào"
  imperial_examination_jay.0170.desc: "\"Gia tộc [ROOT.Char.GetHouse.GetName] thực sự là cái nôi của niềm tin đức hạnh,\" giám khảo [examiner.GetFirstName] nói, tiến lại gần tôi với đôi bàn tay bồn chồn và ánh mắt liếc nhìn xung quanh. \"Tôi chắc chắn rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child'))] của người sẽ vượt qua bài kiểm tra của [child.GetHerHis] với một chút hướng dẫn. Tôi có thể là người hướng dẫn đó, nếu người chịu làm điều gì đó cho tôi để đổi lại?\"\n\nBất chấp sự thận trọng của [examiner.GetFirstNamePossessiveNoTooltip], các bậc cha mẹ và trưởng bối khác đã bắt đầu nhìn chúng tôi với vẻ tò mò."
  imperial_examination_jay.0170.a: "Cần có một lời nhắc nhở công khai."
  imperial_examination_jay.0170.b: "[child.GetFirstNameNoTooltip] không cần giúp vẫn đỗ!"
  imperial_examination_jay.0170.b.tt: "Tùy kết quả [child.GetHerHis] trong kỳ thi, [child.GetShortUIName] sẽ nhận hoặc mất thêm [prestige|E] và [merit|E]."
  imperial_examination_jay.0170.c: "[child.GetFirstNameNoTooltip] sẽ hưởng lợi, để họ bàn tán."

  imperial_examination.advantage.child.tt: "[child.GetShortUIName] nhận [exam_advantage|E]"
  imperial_examination.advantage.no_character.tt: "Nhận [exam_advantage|E]"
  imperial_examination.cheat.child.tt: "[child.GetTitledFirstName] nhận một [exam_cheat|E]"
  imperial_examination.cheat.cheater_child.tt: "[cheater_child.GetTitledFirstName] nhận một [exam_cheat|E]"
  imperial_examination.lose_advantage.child.tt: "[child.GetShortUIName] mất [exam_advantage|E]"
  imperial_examination.lose_advantage.no_character.tt: "Mất [exam_advantage|E]"
  all_non_arbitrary_participants: "Tất cả tham dự không [GetTrait('arbitrary').GetName( GetNullCharacter )]"
  every_attending_chaperone: "Mọi phụ huynh đi cùng thí sinh"
  every_examiner: "Mọi giám khảo"

### OPINIONS ###
  nosy_opinion: "Hay Tọc Mạch"

  tgp_slapback_modifier: "Bảo Vệ Danh Dự"
  tgp_slapback_modifier_desc: "Nhân vật này sẵn sàng tranh cãi để bảo vệ danh dự gia tộc."

  tgp_studious_house_modifier: "Gia Tộc Chăm Học"
  tgp_studious_house_modifier_desc: "Các thành viên của gia tộc này được kính trọng vì học thức uyên thâm.\n[characters|E] sẽ nhận miễn phí một [exam_advantage|E] khi bắt đầu [imperial_examination|E]."

  tgp_known_prodigy_modifier: "Thiên Tài Nổi Tiếng"
