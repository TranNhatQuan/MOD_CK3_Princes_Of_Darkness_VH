  japanese_regency_succession_law_effects:  "Theo $japanese_regency_succession_law$, [title|E] cùng các [holdings|E] liên quan sẽ thuộc về ứng viên có điểm cao nhất. Danh sách ứng viên bao gồm các [noble_families|E], [governors|E] cùng thân tộc của họ trong [realm|E].\n\nNếu [japanese_emperor|E] được chọn làm [ceremonial_regent|E] kế nhiệm, người đó phải lựa chọn: hoặc thoái vị khỏi ngôi [tenno|E], hoặc nỗ lực khôi phục quyền cai trị trực tiếp!"

