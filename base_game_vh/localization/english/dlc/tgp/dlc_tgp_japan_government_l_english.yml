  japan_administrative_government:  "Ritsuryō"
  japan_administrative_government_adjective:  "$japan_administrative_government$"
  japan_administrative_government_with_icon:  "@government_type_ritsuryo! $japan_administrative_government$"
  japan_administrative_government_vassals_label:  "$japan_administrative_government$ có [obligations|E] dựa trên [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
  japan_administrative_government_desc:  "\n$japan_administrative_government$ là một chế độ [administrative|E] [government|E] đặc thù của Nhật Bản.\n\nĐây là một [government_bureaucratic_type|E] [government_form|E] mang tính tập quyền, nơi các [characters|E] được bổ nhiệm làm [governors|E] nhân danh [liege|E], có quyền sử dụng [influence|E], và các [house_head_heads|E] của [noble_family|E] sở hữu [family_manor|E] cùng [house_aspiration|E].\n\nMột [kampaku|E] thay mặt [japanese_emperor|E] cai quản [realm|E], có thể tuyển chọn từ các [house_head_heads|E] của [noble_family|E], hoặc bị áp đặt bởi yêu sách của [faction|E].\n\nCác [vassals|E] của $japan_administrative_government$ thường chỉ cai trị một [county|E], song cũng có thể khước từ hệ thống tập quyền để trở thành lãnh chúa địa phương [soryo|E], tự dựng thế lực riêng — dù hành vi này thường bị xem là [criminal|E].\n\nCác $game_concept_house_heads$ của $japan_administrative_government$ có thể lập và tham gia [house_blocs|E] trong [realm|E], nhằm ủng hộ [leading_house|E] trở thành $game_concept_kampaku$.\n\n$japan_government_domain_limit_help$\n\n#F Hệ thống $japan_administrative_government$ ám chỉ nền hành chính tập quyền của Nhật Bản, chịu ảnh hưởng từ quan chế Nho gia Trung Hoa.#!"
  japan_feudal_government:  "Sōryō"
  japan_feudal_government_adjective:  "$japan_feudal_government$"
  japan_feudal_government_with_icon:  "@government_type_soryo! $japan_feudal_government$"
  japan_feudal_government_vassals_label:  "$japan_feudal_government$ có [obligations|E] dựa trên [vassal_contract|E] của từng [vassal|E]"
  japan_feudal_government_desc:  "\n$japan_feudal_government$ là một chế độ [feudal|E] [government|E] đặc thù của Nhật Bản.\n\n$japan_feudal_government$ đại diện cho các lãnh chúa địa phương đã gạt bỏ hoặc thay thế quyền lực của chính quyền trung ương [ritsuryo|E], và cai trị lãnh địa như thái ấp riêng.\n\nCác [characters|E] thuộc $japan_feudal_government$ không sử dụng [influence|E], nhưng các [house_head_heads|E] của [noble_family|E] vẫn giữ [family_manor|E] và [house_aspiration|E].\n\nDẫu không thể được bầu làm [ceremonial_regent|E], các [rulers|E] của $japan_feudal_government$ vẫn có thể đoạt quyền thông qua [faction|E] #V $replace_ceremonial_regent_faction_name$#!, và ban hành [decision|E] #V Formalize Shōgunate#!.\n\nCác $game_concept_ceremonial_regents$ của $japan_feudal_government$ thay mặt [japanese_emperor|E] cai quản [realm|E], kế thừa theo [succession|E] $single_heir_succession_law$, và có thể bị lật đổ bởi yêu sách của [faction|E].\n\nCác $game_concept_house_heads$ của $japan_feudal_government$ có thể lập và tham gia [house_blocs|E] trong [realm|E].\n\n$japan_government_domain_limit_help$\n\n#F $japan_feudal_government$ ám chỉ giai đoạn đầu của quá trình phong kiến hóa Nhật Bản, khởi từ thời Heian và dần định hình dưới Mạc phủ đầu tiên thời Kamakura.#!"
  japan_government_domain_limit_help:  "@alert_icon! #HELP Các $game_concept_governments$ Nhật Bản có [domain_limit|E] thấp hơn thông thường, nhưng có thể gia tăng bằng cách nâng cấp $game_concept_family_manor$.#!"
  tgp_is_japanese_governor_trigger:  "Ngài giữ chức [governor|E] thuộc [GetGovernment('japan_administrative_government').GetName]"

 # Appointment Succession Law
  japanese_appointment_succession_law:  "Luật Kế vị Bổ nhiệm $japan_administrative_government$"
  japanese_appointment_succession_law_subname:  "Ứng viên có Điểm số cao nhất sẽ kế vị"
  japanese_appointment_succession_law_effects:  "\nĐây là một dạng [appointment_succession_law|E]. Theo $japanese_appointment_succession_law$, [title|E] cùng các [holdings|E] liên quan sẽ thuộc về ứng viên có điểm cao nhất. Mọi [adult|E] trong [realm|E] đều có thể mưu cầu chức [governorship|E] bằng nhiều thủ đoạn, từ [scheming|E] đến tiêu hao [influence|E]."
  japanese_military_appointment_succession_law:  "Kế vị Quân sự $japan_administrative_government$"
  japanese_military_appointment_succession_law_subname:  "Ứng viên có Điểm số cao nhất sẽ kế vị"
  japanese_military_appointment_succession_law_effects:  "\nĐây là một dạng [appointment_succession_law|E]. Theo $japanese_military_appointment_succession_law$, [title|E] cùng các [holdings|E] liên quan sẽ thuộc về ứng viên có [candidate_score|E] cao nhất. Mọi [adult|E] trong [realm|E] có thể tranh đoạt chức [governorship|E] quân sự bằng cách nâng cao [martial_skill|E], tích lũy [commander_traits|E], hoặc tiêu hao [influence|E].#!"
