  game_concept_house_bloc_desc:  "$game_concept_house_bloc$ là một liên minh phòng thủ giữa các [houses|E] trong cùng một [realm|E]. Bất kỳ [member_house|E] nào bị tấn công sẽ được toàn bộ $game_concept_member_houses$ khác bảo vệ.\n\nCác [house_heads|E] quyết định việc tham gia [bloc_member_houses|E], và toàn bộ thành viên cai trị trong gia tộc của họ trong lãnh thổ sẽ theo quyết định ấy.\n\nMỗi Khối luôn có một [leading_house|E], mà $game_concept_house_head$ của nó có thể trục xuất thành viên khác, là [ceremonial_regent|E] được toàn bộ ủng hộ, và [house_aspiration|E] của nó quyết định các lợi ích nhận được khi [cohesion|E] tăng.\n\nChỉ $game_concept_leading_house_possessive$ $game_concept_house_head$ mới có thể lập [factions|E] chống lại [top_liege|E], và toàn bộ $game_concept_bloc_member_houses$ sẽ tham gia các [factions|E] đó."

  game_concept_bloc_cohesion:  "Độ Gắn kết Khối"
  game_concept_cohesion:  "Gắn kết"
  game_concept_bloc_cohesion_desc: "$game_concept_cohesion$ đo lường sự đoàn kết của một [house_bloc|E], với các cấp độ cao hơn mang lại lợi ích ngày càng tăng cho các thành viên của [bloc_member_houses|E], dựa trên [house_aspiration|E] của [leading_house_possessive|E].\n\nNguồn chính là [house_relations|E] giữa các $game_concept_bloc_member_houses$, có thể ảnh hưởng tích cực hoặc tiêu cực đến $game_concept_cohesion$. Ngoài ra, quy mô tổng thể của khối hoặc sự không khớp $game_concept_house_aspirations$ hoặc [government|E] của các thành viên có thể làm giảm $game_concept_cohesion$.\n\nDuy trì một cấp độ $game_concept_bloc_cohesion$ sẽ ban tặng nhiều phần thưởng khác nhau cho [member_houses|E], dựa trên Nguyện vọng của $game_concept_leading_house$.\n\nKhi đạt đến #V 0#! $game_concept_cohesion$, một $game_concept_house_bloc$ sẽ tự động tan rã."
  game_concept_bloc_cohesion_tt:  "#T @bloc_cohesion! $game_concept_bloc_cohesion$#!\n\n$game_concept_bloc_cohesion_desc$"

