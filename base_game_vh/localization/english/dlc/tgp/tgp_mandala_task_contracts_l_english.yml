  holy_compliment_venerable: "đáng kính"
  holy_compliment_reverent: "tôn kính"
 
  mandala_realm_contract_0002_contract: "Bò Không Sinh Sản"
  mandala_realm_contract_0002_desc: "Những con bò ở [TaskContract.GetLocation.GetNameNoTooltip] không sinh sản, ít bê con được sinh ra. Người dân địa phương yêu cầu một nghi lễ sinh sản, kẻo sinh kế của họ sẽ biến mất."
  mandala_realm_contract_0002_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0002_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1100.t: "$mandala_ritual_prefix$ Bò Không Sinh Sản"
  tgp_east_asia_mandala_task_contract_events.1100.desc: "\"Ôi, [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại và thiêng liêng, hãy lắng nghe lời cầu xin của làng con,\" người đứng đầu làng nói, đặt tay lên một con bò cái gầy gò bên cạnh. \"Hãy làm cho bò của chúng con lại có thể đẻ bê!\"\n\nNgài ra hiệu cho dân làng, những người mang đến những vòng hoa lớn kết từ [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] rực rỡ cho nghi lễ."
  tgp_east_asia_mandala_task_contract_events.1100.a: "Nghi lễ sẽ kéo dài một tháng!"
  tgp_east_asia_mandala_task_contract_events.1100.b: "Một tuần là đủ cho nghi lễ."
  tgp_east_asia_mandala_task_contract_events.1100.c: "Ta sẽ ở lại một ngày."
 
  mandala_realm_contract_0003_contract: "Hạt Giống Đầu Tiên"
  mandala_realm_contract_0003_desc: "Người dân [TaskContract.GetLocation.GetNameNoTooltip] dự định dựng một [GetBuilding('temple_citadel_01').GetName] nhân danh Ngài. Họ từ chối bắt đầu trừ khi Ngài 'gieo hạt giống đầu tiên' tại địa điểm."
  mandala_realm_contract_0003_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0003_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1200.t: "$mandala_ritual_prefix$ Hạt Giống Đầu Tiên"
  tgp_east_asia_mandala_task_contract_events.1200.desc: "\"Đại nhân [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại, chúng con — những tôi tớ khiêm nhường của ngài — ước nguyện dựng lên một [GetBuilding('temple_citadel_01').GetName] dưới tên thánh danh của ngài,\" người đứng đầu làng nói, hướng mắt về [ritual_location.Custom('TerrainTypeProvince')] trước mặt. \"Nhưng mảnh đất này vẫn chưa được thánh hóa. Chúng con cần ngài gieo hạt giống đầu tiên — để lấp đầy mảnh đất bằng sự kiến tạo của ngài.\"\n\nMột người bước tới, quạt cho mình đầy e thẹn. \"Ôi bậc thiêng liêng, con xin tự nguyện hiến dâng bản thân để giúp ngài hoàn thành nghi lễ — cho tất cả người dân [ritual_location.GetName] cùng chiêm ngưỡng!\""
  tgp_east_asia_mandala_task_contract_events.1200.a: "[ritual_location.Custom('TerrainTypeProvince')] sẽ có một tháng hòa hợp của chúng ta!"
  tgp_east_asia_mandala_task_contract_events.1200.b: "Hãy đặt nơi viên đá đầu tiên sẽ được đặt."
  tgp_east_asia_mandala_task_contract_events.1200.c: "Ta có thể... tự xử lý một mình."
 
  mandala_realm_contract_0004_contract: "Bò Thiêng"
  mandala_realm_contract_0004_desc: "Một con bò thiêng từ chối quỳ ở [TaskContract.GetLocation.GetNameNoTooltip], điềm báo vô sinh. Họ kêu gọi Ngài khôi phục cân bằng."
  mandala_realm_contract_0004_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0004_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1300.t: "$mandala_ritual_prefix$ Bò Thiêng"
  tgp_east_asia_mandala_task_contract_events.1300.desc: ""Thật là thảm họa," trưởng làng than thở. "Con bò thiêng của chúng Ta từ chối nằm xuống — chắc chắn điềm báo vô sinh và suy tàn!"\n\n"Xin hãy, chúng Ta cần #EMP Ngài#! ban phước cho chúng Ta thay nó. Leo lên bệ đá này và hiển lộ ánh sáng thiêng liêng của Ngài cho tất cả thấy — để các cánh đồng [ritual_location.GetName] được phì nhiêu!" Trưởng làng nhìn Ta.\n\nTa được yêu cầu đứng trên bệ đá trần, trong một tuần, không ăn..."
  tgp_east_asia_mandala_task_contract_events.1300.a: "Thần tính của Ta vô biên — hãy nhìn cơ thể Ta!"
  tgp_east_asia_mandala_task_contract_events.1300.b: "Thức ăn và quần áo là một phần của nghi lễ."
  tgp_east_asia_mandala_task_contract_events.1300.c: "Một tượng trưng của Ta cũng đủ..."
 
  mandala_realm_contract_0005_contract: "Nhân Chứng Thiêng Liêng"
  mandala_realm_contract_0005_desc: "Một cặp quý tộc ở [TaskContract.GetLocation.GetNameNoTooltip] chưa có con. Họ cần Ngài ban phước cho cuộc hôn nhân của họ."
  mandala_realm_contract_0005_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0005_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1400.t: "$mandala_ritual_prefix$ Nhân Chứng Thiêng Liêng"
  tgp_east_asia_mandala_task_contract_events.1400.desc: "\"[ROOT.Char.GetTitleAsNameNoTooltip] rạng rỡ nhất, [local_character_2.GetWifeHusband] của con và con vẫn chưa được ban phước lành có con cái,\" vị quý tộc [local_character.GetTitledFirstName] nói, giọng nhuốm màu buồn bã. \"Con đã cho dựng một tòa đình trong [ritual_location.Custom('TerrainTypeProvince')] để cử hành nghi lễ.\"\n\nNgười [local_character_2.GetWifeHusband] nói tiếp, \"Chúng con cần ngài ngủ giữa hai chúng con, như một nhân chứng thiêng liêng. Chỉ khi ấy, chúng con mới được ban phước một đứa con! Dĩ nhiên... có thể sẽ mất vài đêm...\""
  tgp_east_asia_mandala_task_contract_events.1400.a: "Ôi, Ta sẽ làm nhiều hơn việc 'làm chứng'..."
  tgp_east_asia_mandala_task_contract_events.1400.b: "Ta sẽ quan sát cuộc hôn nhân của Ngài."
  tgp_east_asia_mandala_task_contract_events.1400.c: "Chỉ cần Ta để quần áo giữa hai người cũng đủ."
 
  mandala_realm_contract_0006_contract: "Giấc Mơ Của Bà Đỡ"
  mandala_realm_contract_0006_desc: "Các bà đỡ ở [TaskContract.GetLocation.GetNameNoTooltip] đều mơ thấy cùng một giấc mơ — thần tính của ngài, hợp nhất thiêng liêng với một người phụ nữ được đánh dấu điềm lành."
  mandala_realm_contract_0006_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0006_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của ngài"
  tgp_east_asia_mandala_task_contract_events.1500.t: "$mandala_ritual_prefix$ Giấc Mơ Của Bà Đỡ"
  tgp_east_asia_mandala_task_contract_events.1500.desc: "Khi ta tiến đến ngôi làng bên ngoài [ritual_location.GetName], một nhóm bà đỡ chào đón ta. “Chúng tôi đều có cùng một giấc mơ, đại [ROOT.Char.GetTitleAsNameNoTooltip],” họ đồng thanh nói. “Đây là [local_character_2.GetFirstName] — sinh ra trong một đêm điềm báo.”\n\n“Một đứa trẻ sẽ cứu [ritual_location.GetName] nếu ngài hòa hợp với [local_character_2.GetHerHim].” Các bà đỡ im lặng khi [local_character_2.GetWomanMan] tiến lên, mỉm cười e lệ với ta."
  tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in: "\n\nTa liếc nhìn [ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character)], [1500_stand_in_character.GetFirstName]. Ta chắc chắn [1500_stand_in_character.GetSheHe] có thể #EMP gánh vác#! trách nhiệm..."
  tgp_east_asia_mandala_task_contract_events.1500.desc.stand_in.acolyte: "\n\nTa nhìn một trong các tín đồ của mình, [1500_stand_in_character.GetFirstName]. Ta #EMP đã muốn#! thử điều gì đó mới..."
  tgp_east_asia_mandala_task_contract_events.1500.a: "Hãy đến [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [local_character_2.GetFirstNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.1500.a.stand_in: "[ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )] của ta sẽ chăm sóc [local_character_2.GetFirstNameNoTooltip], tại [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.no_relation: "[ROOT.Char.Custom2('RelationToMe', 1500_stand_in_character )] và ta sẽ chăm sóc [local_character_2.GetFirstNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.1500.a.stand_in.acolyte: "Người hầu của ta và ta sẽ chăm sóc [local_character_2.GetFirstNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.1500.b: "Chúng ta sẽ hòa hợp ngay trong đêm nay."
  tgp_east_asia_mandala_task_contract_events.1500.b.stand_in: "[1500_stand_in_character.GetTitledFirstNameNoTooltip], gieo rắc hạt giống của triều đại ta."
  tgp_east_asia_mandala_task_contract_events.1500.b.stand_in.acolyte: "Tín đồ [1500_stand_in_character.GetTitledFirstNameNoTooltip], gieo rắc hạt giống của triều đại ta."
  tgp_east_asia_mandala_task_contract_events.1500.c: "Đêm nay, #EMP linh hồn#! ta sẽ ở bên ngươi..."
 
  mandala_realm_contract_0007_contract: "Tượng Khóc"
  mandala_realm_contract_0007_desc: "Một bức tượng bị bỏ quên ở [TaskContract.GetLocation.GetNameNoTooltip] được cho là chảy sữa. Dân làng yêu cầu Ngài xức dầu cho trẻ sơ sinh trên đó."
  mandala_realm_contract_0007_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0007_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1600.t: "$mandala_ritual_prefix$ Tượng Khóc"
  tgp_east_asia_mandala_task_contract_events.1600.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip], ôi thần linh [ROOT.Char.GetTitleAsNameNoTooltip]," người nông dân khóc lóc, quỳ xuống [local_character.GetHerselfHimself]. "Một bức tượng cổ trong cánh đồng của Ta đã bắt đầu chảy sữa!" Ta liếc nhìn — một đầu tượng đá lớn phủ vải và hoa, mặt nó lấm tấm trắng.\n\n"Thần linh đang đi qua nó! Xin hãy xức dầu cho trẻ sơ sinh trên đó để giành được thiện cảm!" [local_character.GetSheHe] cầu khẩn."
  tgp_east_asia_mandala_task_contract_events.1600.a: "Nơi này không chỉ là một cánh đồng — nó là một đền thờ!"
  tgp_east_asia_mandala_task_contract_events.1600.b: "Hãy để Ta thêm nhiều lễ vật cho thần linh."
  tgp_east_asia_mandala_task_contract_events.1600.c: "Ta sẽ xức dầu cho đứa trẻ, như mong đợi."
  stone_head_shrine_modifier: "Đền Tượng Đầu Đá Khổng Lồ"
  stone_head_shrine_modifier_desc: "Bức tượng cổ của một vị vua quên lãng đã được biến thành đền thờ Devaraja địa phương ở đây."
 
  mandala_realm_contract_0008_contract: "Hoa Nảy Mầm"
  mandala_realm_contract_0008_desc: "Một bông hoa kỳ lạ đã làm chết mầm cây ở [TaskContract.GetLocation.GetNameNoTooltip]. Dân làng tin rằng đây là việc của Ngài và yêu cầu Ngài khôi phục cân bằng."
  mandala_realm_contract_0008_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0008_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1700.t: "$mandala_ritual_prefix$ Hoa Nảy Mầm"
  tgp_east_asia_mandala_task_contract_events.1700.desc: "\"Ôi, tại sao ngài lại ruồng bỏ chúng con, [ROOT.Char.GetTitleAsNameNoTooltip]?\" người đứng đầu làng nói, giọng nặng nề trong tuyệt vọng. \"Mầm non của chúng con đang bị bóp nghẹt bởi [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] — không một cánh đồng nào được tha cả!\"\n\n\"Nếu không có ngũ cốc, chúng con sẽ chết đói... ngài phải đi chân trần trên những cánh đồng, để nói cho đất biết những gì nên sinh trưởng trong lòng nó.\""
  tgp_east_asia_mandala_task_contract_events.1700.a: "Ngài cần nhiều hơn thế… Gửi gạo từ kinh thành."
  tgp_east_asia_mandala_task_contract_events.1700.b: "Ta sẽ đi chân trần cùng đất, mưa hay bão."
  tgp_east_asia_mandala_task_contract_events.1700.c: "Ta sẽ hôn đất, nhưng không hơn nữa."
  fertile_ground_modifier: "Đất Phì Nhiêu"
  fertile_ground_modifier_desc: "Sự nhập khẩu hạt giống và công cụ từ kinh thành đã làm cho vùng đất này trù phú."
 
  mandala_realm_contract_0009_contract: "Nghi Lễ Sông Nước"
  mandala_realm_contract_0009_desc: "Một con sông ở [TaskContract.GetLocation.GetNameNoTooltip] là nguồn sống của người dân địa phương. Những ngư dân yêu cầu Ngài thực hiện nghi lễ sinh sản để giữ cho sông đầy cá."
  mandala_realm_contract_0009_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0009_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1800.t: "$mandala_ritual_prefix$ Nghi Lễ Sông Nước"
  tgp_east_asia_mandala_task_contract_events.1800.desc: "Một nhóm ngư dân đứng bên bờ sông, giỏ đầy ắp chiến lợi phẩm trong ngày. \"Đại nhân [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại! Sông ngòi đầy ắp [ROOT.Char.Custom('GetRegionalFish')], nhưng các bậc trưởng lão nói rằng đến năm sau nó sẽ trở nên cằn cỗi!\" một trong số họ nói.\n\n\"Đêm nay sẽ có trăng tròn hiếm gặp. Chúng con cần ngài ban phước cho dòng nước sự màu mỡ thiêng liêng — [local_character_2.GetFirstName] đã tình nguyện dâng hiến bản thân để cùng ngài thực hiện nghi lễ.\""
  tgp_east_asia_mandala_task_contract_events.1800.a: "Hãy cùng Ta ở dòng sông, [local_character_2.GetFirstNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.1800.b: "Ta chỉ cần rắc gạo xuống nước."
  tgp_east_asia_mandala_task_contract_events.1800.c: "Tất cả những con cá này… các ngươi chưa dâng đủ cống nạp."
  upset_peasants_modifier: "Nông Dân Phẫn Nộ"
  upset_peasants_modifier_desc: "Vì lý do nào đó, nông dân trong hạt này không tuân thủ."
 
  mandala_realm_contract_0010_contract: "Cánh Đồng Bị Nguyền"
  mandala_realm_contract_0010_desc: "Cày liên tục bị gãy ở các cánh đồng [TaskContract.GetLocation.GetNameNoTooltip]. Dân làng nghi ngờ có một linh hồn ác độc và yêu cầu ngài giúp phá lời nguyền."
  mandala_realm_contract_0010_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0010_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.1900.t: "$mandala_ritual_prefix$ Cánh Đồng Bị Nguyền"
  tgp_east_asia_mandala_task_contract_events.1900.desc: ""Đây là cái cày thứ bảy bị gãy trong tuần này, [ROOT.Char.GetTitleAsNameNoTooltip]," trưởng làng[local_character.GetWomanMan] nói, giận dữ chỉ vào cánh đồng. "Chắc chắn một linh hồn ghen tị đang phá chúng!"\n\n"Để phá lời nguyền, ngài — với thần tính rực rỡ — phải kéo cày qua từng cánh đồng và gieo rãnh cày đầu tiên!""
  tgp_east_asia_mandala_task_contract_events.1900.a: "Ta sẽ làm — buộc Ta vào!"
  tgp_east_asia_mandala_task_contract_events.1900.b: "Ta gieo; [entourage_character.GetFirstNameNoTooltip] kéo cày..."
  tgp_east_asia_mandala_task_contract_events.1900.c: "Ta chỉ gieo một hạt."
 
  mandala_realm_contract_0011_contract: "Rừng Cằn Cỗi"
  mandala_realm_contract_0011_desc: "Một tia sét đã đánh trúng cây thiêng, thiêu rụi khu rừng xung quanh tại [TaskContract.GetLocation.GetNameNoTooltip]. Dân làng sợ hãi, và họ nhờ ngài thực hiện một nghi lễ sinh sản dưới gốc cây."
  mandala_realm_contract_0011_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0011_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của ngài"
  tgp_east_asia_mandala_task_contract_events.2000.t: "$mandala_ritual_prefix$ Rừng Cằn Cỗi"
  tgp_east_asia_mandala_task_contract_events.2000.desc: "“Thần thánh [ROOT.Char.GetTitleAsNameNoTooltip], tia sét đã đánh vào cây thiêng của chúng tôi, thiêu rụi cả khu rừng…” [local_character.GetWomanMan] nói, chỉ vào những tàn tích cháy đen. “Chúng tôi sợ nó sẽ không mọc lại — [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] và [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] đã biến mất.”\n\n“Dưới gốc cây cháy là nơi chúng tôi phải hòa hợp. Nếu sự hợp nhất của chúng tôi sinh ra kết quả, khu rừng cũng sẽ xanh trở lại. Hãy để than củi xức lên chúng tôi, đến mức chúng tôi không thể phân biệt với bầu trời đêm!”"
  tgp_east_asia_mandala_task_contract_events.2000.a: "Ngươi sẽ có hạt giống từ kinh thành — và từ ta nữa!"
  tgp_east_asia_mandala_task_contract_events.2000.a.female: "Ta sẽ giúp ngươi gieo hạt giống từ kinh thành..."
  tgp_east_asia_mandala_task_contract_events.2000.b: "Vậy hãy hòa hợp cùng nhau."
  tgp_east_asia_mandala_task_contract_events.2000.c: "Xức than củi lên ngươi cũng đủ."
  lush_grove_modifier: "Rừng Xanh Tươi"
  lush_grove_modifier_desc: "Nhờ sự đóng góp hạt giống từ kinh thành của một Devaraja, các khu rừng trong hạt này đang phát triển tươi tốt."
 
  mandala_realm_contract_0012_contract: "Thề Giết Lợn"
  mandala_realm_contract_0012_desc: "Dân làng [TaskContract.GetLocation.GetNameNoTooltip] yêu cầu ngài niêm ấn một giao ước trả thù bằng cách giết một con lợn đen."
  mandala_realm_contract_0012_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0012_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2100.t: "$mandala_ritual_prefix$ Thề Giết Lợn"
  tgp_east_asia_mandala_task_contract_events.2100.desc: ""Vĩ đại và hùng mạnh [ROOT.Char.GetTitleAsNameNoTooltip], chúng Ta cần sự ban phước của ngài." [local_character.GetWomanMan] ra hiệu về phía chuồng. "Chúng Ta sẽ tấn công kẻ thù ở [vengeance_target.GetNameNoTier] — nhưng không trước khi ngài làm một hi sinh."\n\n"Đưa con lợn đen này vào [ritual_location.Custom('TerrainTypeProvince')] và đổ máu nó lên đá thề. Chỉ khi đó lời thề trả thù của chúng Ta mới được niêm ấn!""
  tgp_east_asia_mandala_task_contract_events.2100.a: "Một con lợn? Không, Ta sẽ cung cấp năm mươi!"
  tgp_east_asia_mandala_task_contract_events.2100.b: "Con lợn sẽ được hi sinh, và lời thề được niêm ấn."
  tgp_east_asia_mandala_task_contract_events.2100.c: "Ngài sẽ có lời thề khoan dung thay vào đó."
 
  mandala_realm_contract_0013_contract: "Thịnh Nộ Nghi Lễ"
  mandala_realm_contract_0013_desc: "Một năm mất mùa khiến dân làng [TaskContract.GetLocation.GetNameNoTooltip] cầu xin sự trừng phạt — tình nguyện viên xin bị đánh để làm vừa lòng thần linh."
  mandala_realm_contract_0013_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0013_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2200.t: "$mandala_ritual_prefix$ Thịnh Nộ Nghi Lễ"
  tgp_east_asia_mandala_task_contract_events.2200.desc: "Khi chúng Ta đến [ritual_location.GetName], một nhóm mười nông dân tiến tới. "Mạnh mẽ [ROOT.Char.GetTitleAsNameNoTooltip]," thủ lĩnh họ nói, giọng cứng rắn. "Cánh đồng chúng Ta nằm trơ — bị nguyền bởi linh hồn đất, đòi hi sinh."\n\n[local_character.GetSheHe|U] quỳ xuống đất và ra hiệu về thanh gươm của Ta. "Trừng phạt chúng Ta. Đổ máu chúng Ta lên đất. Linh hồn sẽ được no — và gia đình chúng Ta cũng vậy.""
  tgp_east_asia_mandala_task_contract_events.2200.a: "Máu của chính Ta sẽ làm hài lòng linh hồn."
  tgp_east_asia_mandala_task_contract_events.2200.b: "Hi sinh của các ngươi sẽ cứu mảnh đất."
  tgp_east_asia_mandala_task_contract_events.2200.c: "Một con lợn cũng đủ."
 
  mandala_realm_contract_0014_contract: "Trừng Phạt Tập Thể"
  mandala_realm_contract_0014_desc: "Một kẻ trộm ở [TaskContract.GetLocation.GetNameNoTooltip] đã lấy trộm gạo thiêng và bỏ trốn. Dân làng muốn gia đình hắn bị trừng phạt thay hắn."
  mandala_realm_contract_0014_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0014_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2300.t: "$mandala_ritual_prefix$ Trừng Phạt Tập Thể"
  tgp_east_asia_mandala_task_contract_events.2300.desc: "Một đám đông dân làng vây quanh một người cùng đứa con khi chúng ta đến gần [ritual_location.GetName]. \"Đại nhân [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại,\" người đứng đầu làng hét lên. \"[local_character_3.GetFirstName] — một tên trộm trong làng này — đã đánh cắp gạo thánh của chúng con và trốn vào [ritual_location.Custom('TerrainTypeProvince')]!\"\n\nNgài chĩa ngón tay về phía người đó. \"Nếu [local_character_3.GetSheHe] không chịu đối mặt với hình phạt, thì gia tộc của [local_character_3.GetHerHis] phải chịu. Hãy trừng phạt họ bằng sự công lý thiêng liêng!\""
  tgp_east_asia_mandala_task_contract_events.2300.a: "Chúng ta sẽ truy bắt [local_character_3.GetFirstNameNoTooltip] thay vào đó."
  tgp_east_asia_mandala_task_contract_events.2300.b: "[local_character_3.GetHerHis|U] tội, gia đình họ chịu. Như vậy đi."
  tgp_east_asia_mandala_task_contract_events.2300.c: "Hãy để Ta ban phước lại cho gạo."
  tgp_east_asia_mandala_task_contract_events.2300.a.success: "[local_character_3.GetFirstName] bị bắt và giết"
  tgp_east_asia_mandala_task_contract_events.2300.a.failure: "[local_character_3.GetFirstName] trốn thoát"
  collective_punishments_modifier: "Trừng Phạt Tập Thể"
  collective_punishments_modifier_desc: "Gia đình của kẻ trộm trong hạt này bị trừng phạt cho tội mà họ không gây ra."
 
  mandala_realm_contract_0015_contract: "Linh Hồn Bệnh Tật"
  mandala_realm_contract_0015_desc: "Một pháp sư ở [TaskContract.GetLocation.GetNameNoTooltip] bị buộc tội nuôi dưỡng những linh hồn mang bệnh tật. Dân làng muốn đốt nhà của họ — kể cả nếu họ còn bên trong."
  mandala_realm_contract_0015_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0015_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2400.t: "$mandala_ritual_prefix$ Linh Hồn Bệnh Tật"
  tgp_east_asia_mandala_task_contract_events.2400.desc: ""Tha lỗi cho tình trạng của chúng Ta, vĩ đại [ROOT.Char.GetTitleAsNameNoTooltip]," [local_character.GetWomanMan] ốm yếu nói, ho vào tay [local_character.GetHerHis]. "Chúng Ta đều bệnh — ngoại trừ [local_character_2.GetWomanMan] #EMP giả vờ#! chữa cho chúng Ta."\n\n"[local_character_2.GetSheHe|U] chắc chắn đang nuôi linh hồn xấu!" [local_character.GetSheHe] phun ra. "Đốt nhà của kẻ mang linh hồn — sẽ xua chúng đi!""
  tgp_east_asia_mandala_task_contract_events.2400.a: "Chúng Ta sẽ săn lùng kẻ giả chữa khắp [ritual_location.GetNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.2400.b: "Ta sẽ đốt nhà, với kẻ mang linh hồn bên trong."
  tgp_east_asia_mandala_task_contract_events.2400.c: "Kẻ mang linh hồn sẽ đi cùng Ta."
  no_healers_modifier: "Không Có Thầy Thuốc"
  no_healers_modifier_desc: "Devaraja đã giết các thầy thuốc và pháp sư trong tỉnh này."
 
  mandala_realm_contract_0016_contract: "Ngọn Giáo Mòn"
  mandala_realm_contract_0016_desc: "Những chiến binh địa phương ở [TaskContract.GetLocation.GetNameNoTooltip] lười biếng và thiếu tinh thần. Trưởng làng cầu xin ngài trừng phạt họ."
  mandala_realm_contract_0016_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0016_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2500.t: "$mandala_ritual_prefix$ Ngọn Giáo Mòn"
  tgp_east_asia_mandala_task_contract_events.2500.desc: ""Họ nghi ngờ thần tính của ngài, [ROOT.Char.GetTitleAsNameNoTooltip]," trưởng làng nói, giọng nặng nề. "Các chiến binh suốt ngày uống rượu — đường sá không an toàn và cướp bóc lan tràn..." [local_character.GetSheHe|U] chỉ vào quán rượu gần đó.\n\n"Ngài phải kỷ luật họ. Dùng uy quyền thần thánh — và gươm thần thánh của ngài — để khiến họ phục tùng!""
  tgp_east_asia_mandala_task_contract_events.2500.a: "Họ sẽ học cách phục vụ — bằng máu."
  tgp_east_asia_mandala_task_contract_events.2500.b: "Mỗi người sẽ nhận lời Ta — hoặc roi của Ta."
  tgp_east_asia_mandala_task_contract_events.2500.c: "Một bài diễn thuyết đơn giản cũng đủ."
  motivated_men_at_arms_modifier: "Chiến Binh Có Động Lực"
  motivated_men_at_arms_modifier_desc: "Những chiến binh bảo vệ tỉnh này rất có động lực sau khi được Devaraja thị uy. Hoặc, những gì còn lại của họ."
  safer_roads_modifier: "Đường An Toàn Hơn"
  safer_roads_modifier_desc: "Đường sá an toàn hơn sau khi Devaraja ghé thăm."
 
  mandala_realm_contract_0017_contract: "Làng Chống Đối"
  mandala_realm_contract_0017_desc: "Một làng ở [TaskContract.GetLocation.GetNameNoTooltip] từ chối nộp cống, chế nhạo thần tính của ngài. Thầy tu địa phương cầu xin ngài tự hành quân đến đó."
  mandala_realm_contract_0017_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0017_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2600.t: "$mandala_ritual_prefix$ Làng Chống Đối"
  tgp_east_asia_mandala_task_contract_events.2600.desc: "Khi chúng Ta đến gần [ritual_location.GetName], chúng Ta bị chế giễu: một hình nộm của Ta bị treo ngược, phủ tro và phân. Dân làng nhảy quanh, hát những bài ca về điểm yếu của Ta, hú hét như chó hoang.\n\nHọ không sợ Ta.\nHọ cầu xin sự thịnh nộ."
  tgp_east_asia_mandala_task_contract_events.2600.a: "Ta sẽ không để ai sống sót. Máu sẽ thấm đất."
  tgp_east_asia_mandala_task_contract_events.2600.b: "Ta sẽ đốt kho lương của họ."
  tgp_east_asia_mandala_task_contract_events.2600.c: "Họ chỉ cần được trấn an."
  slaughtered_village_modifier: "Làng Bị Tàn Sát"
  slaughtered_village_modifier_desc: "Một Devaraja đã tàn sát dân cư của một làng chống đối trong hạt này."
 
  mandala_realm_contract_0018_contract: "Thuế Máu"
  mandala_realm_contract_0018_desc: "Một cuộc gọi nhập ngũ ở [TaskContract.GetLocation.GetNameNoTooltip] đã không được đáp lại. Quan chức địa phương yêu cầu ngài đòi #EMP đồng máu#! — những người không thể phục vụ phải đưa người thay thế."
  mandala_realm_contract_0018_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0018_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2700.t: "$mandala_ritual_prefix$ Thuế Máu"
  tgp_east_asia_mandala_task_contract_events.2700.desc: "Khi chúng Ta đến [ritual_location.GetName], một quan chức ra đón. "[ROOT.Char.GetTitleAsNameNoTooltip], làng này từ chối trả thuế," [local_character.GetSheHe] nói, liếc vào cuộn giấy. "Hình phạt của họ là nộp đồng máu — và ngài phải đòi nó."\n\n"Họ sẽ không nghe Ta, nhưng sẽ nghe lời thần thánh của ngài. Hãy bắt họ trả những gì đáng trả." [local_character.GetSheHe|U] cúi chào."
  tgp_east_asia_mandala_task_contract_events.2700.a: "Ta sẽ thu máu, không phải tiền. Cuộc gọi nhập ngũ sẽ được tuân theo."
  tgp_east_asia_mandala_task_contract_events.2700.b: "Đồng máu sẽ được thu."
  tgp_east_asia_mandala_task_contract_events.2700.c: "Chỉ cần sự hiện diện của ta cũng đủ."
  enforced_levy_modifier: "Thuế Bắt Buộc"
  enforced_levy_modifier_desc: "Devaraja đã dùng bạo lực để đảm bảo hạt này tuân theo thuế."
 
  mandala_realm_contract_0019_contract: "Nổi Loạn Tre"
  mandala_realm_contract_0019_desc: "Nông dân ở [TaskContract.GetLocation.GetNameNoTooltip] đang mài giáo tre, nói rằng họ có thể #EMP 'tự bảo vệ bây giờ.'#! Uy quyền võ thuật của Ngài được yêu cầu — trước khi nổi loạn xảy ra."
  mandala_realm_contract_0019_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0019_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2800.t: "$mandala_ritual_prefix$ Nổi Loạn Tre"
  tgp_east_asia_mandala_task_contract_events.2800.desc: "Khi chúng ta tiến vào [ritual_location.GetName], những ngọn giáo tre sắc nhọn xếp hàng như một kho vũ khí tạm bợ. \"Ôi, [ROOT.Char.GetTitleAsNameNoTooltip], chúng con chỉ đang mài những cây sào này để tự vệ trước... [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')], đúng là vậy,\" một trong số họ nói, giọng không mấy thuyết phục.\n\n\"Chúng con sẽ không bao giờ dùng chúng vào việc gì khác — không — không phải là chúng con nghi ngờ #EMP sự thần thánh#! của ngài hay gì cả...\""
  tgp_east_asia_mandala_task_contract_events.2800.a: "Ta sẽ lấy máu làm gương cho làng ngươi."
  tgp_east_asia_mandala_task_contract_events.2800.b: "Hãy giao giáo cho [ROOT.Char.GetTitleAsNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.2800.c: "Một hành động đáng khen."
  well_armed_peasants_modifier: "Nông Dân Vũ Khí Đầy Đủ"
  well_armed_peasants_modifier_desc: "Nông dân trong hạt này được phép giữ nhiều giáo."
 
  mandala_realm_contract_0020_contract: "Hiến Sinh Trên Đường"
  mandala_realm_contract_0020_desc: "Một con đường ở [TaskContract.GetLocation.GetNameNoTooltip] liên tục bị cướp tấn công. Người dân tin rằng nó phải được #EMP 'nuôi'#! để chấm dứt bạo lực."
  mandala_realm_contract_0020_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0020_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.2900.t: "$mandala_ritual_prefix$ Hiến Sinh Trên Đường"
  tgp_east_asia_mandala_task_contract_events.2900.desc: ""Vĩ đại [ROOT.Char.GetTitleAsNameNoTooltip], đường ở [ritual_location.GetName] không an toàn," trưởng làng[local_character.GetWomanMan] nói. "Người đi đường bị tấn công, đoàn lữ hành bị chiếm — chuyện này không bao giờ dừng."\n\n"Linh hồn của đường đang giận dữ." [local_character.GetSheHe|U] giơ dao găm. "Chúng cần được nuôi bằng máu, cho đến khi bạo lực chấm dứt.""
  tgp_east_asia_mandala_task_contract_events.2900.a: "Máu thần của ta sẽ làm nó no."
  tgp_east_asia_mandala_task_contract_events.2900.b: "Năm con ngựa của ta sẽ đủ."
  tgp_east_asia_mandala_task_contract_events.2900.c: "Mang một con lợn từ làng tới."
 
  mandala_realm_contract_0021_contract: "Lễ Hội Thần Chiến"
  mandala_realm_contract_0021_desc: "Một đền thờ ở [TaskContract.GetLocation.GetNameNoTooltip] đang tổ chức lễ tôn vinh thần chiến [TaskContract.GetLocation.GetCounty.GetFaith.WarGodName] — nhưng không tôn vinh ngài. Ngài được mong đợi sẽ gián đoạn nghi lễ và khẳng định thần tính của mình."
  mandala_realm_contract_0021_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0021_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3000.t: "$mandala_ritual_prefix$ Lễ Hội Thần Chiến"
  tgp_east_asia_mandala_task_contract_events.3000.desc: "Ở [ritual_location.GetName], dân làng nhảy múa quanh một hình nộm lớn — nhưng không phải của ta. #EMP '[ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]!'#! Họ la hét. Tên ta không bao giờ được nhắc.\n\nMột nông dân bước tới, mỉm cười. 'Hãy đến ăn mừng [ritual_location.GetCounty.GetFaith.WarGodName]!' [local_character.GetSheHe] nói.\n\n#bold Nhưng ta là [ritual_location.GetCounty.GetFaith.WarGodName].\nVà ta được mong đợi sẽ trừng phạt họ.#!"
  tgp_east_asia_mandala_task_contract_events.3000.a: "Qua máu và lửa, họ sẽ thờ #EMP ta.#!"
  tgp_east_asia_mandala_task_contract_events.3000.b: "Những nông dân này sẽ là gương cho ta."
  tgp_east_asia_mandala_task_contract_events.3000.c: "Rất tốt. Hãy cùng tham gia lễ hội."
  fearful_population_modifier: "Dân Sợ Hãi"
  fearful_population_modifier_desc: "Devaraja đã đảm bảo rằng chỉ có họ mới được thờ phụng nơi đây."
 
  mandala_realm_contract_0022_contract: "Các Tu Sĩ Cãi Nhau"
  mandala_realm_contract_0022_desc: "Một tranh chấp đất đai đã nổ ra ở [TaskContract.GetLocation.GetNameNoTooltip] giữa hai tu viện địa phương. Ngài được gọi để khôi phục hòa bình."
  mandala_realm_contract_0022_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0022_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3100.t: "$mandala_ritual_prefix$ Các Tu Sĩ Cãi Nhau"
  tgp_east_asia_mandala_task_contract_events.3100.desc: "\"[ritual_location.GetName] là của chúng ta, đồ [local_character_2.Custom2('InsultNoun', local_character)] bất kính!\" một [GetTrait('devoted').GetName( local_character )|l] hét lên, giọng sắc sảo như tiếng chuông. \"Cầu cho [local_character_2.GetFaith.WarGodName] đánh đuổi ngài và tu viện của ngài ra khỏi trái đất này!\" Kẻ kia đáp trả, không hề nao núng.\n\nKhông khí đầy rẫy sự giận dữ — nhưng sự hiện diện của ta đã làm nó lắng xuống. Giờ đây, họ đang chờ đợi phán quyết của ta."
  tgp_east_asia_mandala_task_contract_events.3100.a: "Ta sẽ đưa ra phán quyết thần thánh."
  tgp_east_asia_mandala_task_contract_events.3100.b: "Các đền thờ mới sẽ mọc cho cả hai bên."
  tgp_east_asia_mandala_task_contract_events.3100.c: "Ngươi sẽ phải chia đất."
  new_shrines_modifier: "Đền Thờ Mới"
  new_shrines_modifier_desc: "Devaraja đã dựng đền mới để giải quyết tranh cãi giữa các tu viện trong tỉnh."
  upset_monks_modifier: "Các Tu Sĩ Bực Bội"
  upset_monks_modifier_desc: "Các tu viện trong hạt này đang cãi vã và bất hòa."
  tgp_east_asia_mandala_task_contract_events.3100.a.success: "Ngươi đã tìm ra sự thỏa hiệp thành công"
  tgp_east_asia_mandala_task_contract_events.3100.a.failure: "Tình hình leo thang"
 
  mandala_realm_contract_0023_contract: "Thanh Tẩy Chiến Trường"
  mandala_realm_contract_0023_desc: "Một cánh đồng ở [TaskContract.GetLocation.GetNameNoTooltip], từng nhuốm máu trận, giờ ám ảnh dân làng với những cơn ác mộng — họ yêu cầu ngài thanh tẩy."
  mandala_realm_contract_0023_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0023_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3200.t: "$mandala_ritual_prefix$ Thanh Tẩy Chiến Trường"
  tgp_east_asia_mandala_task_contract_events.3200.desc: ""Hòa bình nhất [ROOT.Char.GetTitleAsNameNoTooltip], một trong những cánh đồng của chúng Ta từng là chiến trường," trưởng làng nói, [local_character.GetHerHis] vẻ mặt lo lắng. "Linh hồn bị xáo trộn bởi đổ máu — giờ chúng ám ảnh giấc mơ của chúng Ta."\n\n"Ngài phải thanh tẩy cánh đồng bằng một đoàn diễu hành chân đất — và đặt vũ khí xuống, dù chỉ một thời gian. Hãy để đất quên đi gánh nặng thép, linh hồn sẽ ngủ lại.""
  tgp_east_asia_mandala_task_contract_events.3200.a: "Ta thề rằng sẽ có hòa bình."
  tgp_east_asia_mandala_task_contract_events.3200.b: "Đoàn diễu hành sẽ được dẫn."
  tgp_east_asia_mandala_task_contract_events.3200.c: "Hát cho linh hồn cũng đủ."
  plagued_by_nightmares_modifier: "Chiến Trường Chưa Thanh Tẩy"
  plagued_by_nightmares_modifier_desc: "Sau khi Devaraja không thanh tẩy chiến trường, dân làng bị 'ám ảnh bởi ác mộng', làm giảm năng suất."
 
  mandala_realm_contract_0024_contract: "Ban Phước Cho Thợ Dệt"
  mandala_realm_contract_0024_desc: "Những người thợ dệt ở [TaskContract.GetLocation.GetNameNoTooltip] yêu cầu ngài ban phước cho khung cửi của họ để thành công."
  mandala_realm_contract_0024_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0024_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3300.t: "$mandala_ritual_prefix$ Ban Phước Cho Thợ Dệt"
  tgp_east_asia_mandala_task_contract_events.3300.desc: "Khi chúng Ta đến [ritual_location.GetName], một trong nhiều thợ dệt cúi chào Ta. "Khung cửi của chúng Ta mô tả thần thánh — [ROOT.Char.GetFaith.WealthGodName], [ROOT.Char.GetFaith.HealthGodName], và giờ là ngài, [ROOT.Char.GetTitleAsNameNoTooltip]." [local_character.GetSheHe|U] nói, mở ra một bộ thảm tươi sáng.\n\n"Ban phước cho nghề dệt của chúng Ta với sự thịnh vượng, và cho làng chúng Ta với hòa bình. Hãy dệt một thứ bằng tay ngài — một biểu tượng để chúng Ta tôn thờ.""
  tgp_east_asia_mandala_task_contract_events.3300.a: "Ta sẽ dệt một hình vàng và lụa của [ROOT.Char.GetFaith.WealthGodName]."
  tgp_east_asia_mandala_task_contract_events.3300.b: "Một hình bạc viền của [ROOT.Char.GetFaith.HealthGodName] là thích hợp."
  tgp_east_asia_mandala_task_contract_events.3300.c: "Một tấm dệt đơn giản mô tả [ROOT.Char.GetFaith.DivineRealm] cũng đủ."
  healthgod_symbol_modifier: "Hội Thợ Dệt Bình An"
  healthgod_symbol_modifier_desc: "Những thợ dệt trong tỉnh tạo ra hình ảnh đẹp về các vị thần đại diện cho sức khỏe và trường thọ."
  wealthgod_symbol_modifier: "Hội Thợ Dệt Thịnh Vượng"
  wealthgod_symbol_modifier_desc: "Những thợ dệt trong tỉnh tạo ra hình ảnh đẹp về các vị thần đại diện cho sự giàu có và thịnh vượng."
 
  mandala_realm_contract_0025_contract: "Phá Giáo"
  mandala_realm_contract_0025_desc: "Các trưởng lão của [TaskContract.GetLocation.GetNameNoTooltip] yêu cầu ngài bẻ gãy các giáo nghi lễ, biểu tượng cho việc chấm dứt mối thù máu giữa các dòng họ."
  mandala_realm_contract_0025_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0025_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3400.t: "$mandala_ritual_prefix$ Phá Giáo"
  tgp_east_asia_mandala_task_contract_events.3400.desc: ""Nhân từ [ROOT.Char.GetTitleAsNameNoTooltip], hôm nay là một ngày vui!" trưởng làng[local_character.GetWomanMan] nói, rạng rỡ. "Mối thù từ lâu đã kết thúc — con trai chúng Ta sẽ không còn chết vô nghĩa!"\n\n"Bây giờ chúng Ta chỉ cầu hòa bình. Hãy lấy giáo của chúng Ta và bẻ gãy trên lửa, để linh hồn có thể tin vào ý định của chúng Ta.""
  tgp_east_asia_mandala_task_contract_events.3400.a: "Ta sẽ bẻ cả giáo của chính mình — hòa bình sẽ ngự trị."
  tgp_east_asia_mandala_task_contract_events.3400.b: "Các giáo sẽ được bẻ gãy."
  tgp_east_asia_mandala_task_contract_events.3400.c: "Chỉ cần bẻ một giáo cũng đủ."
  sworn_peace_tt: "Ngươi đã thề không tuyên chiến!"
  unable_to_declare_war_tt: "@alert_icon! #alert_trial Ngươi thề không tuyên chiến trong 5 năm!#!"
  feudless_village_modifier: "Làng Không Thù Hận"
  feudless_village_modifier_desc: "Một ngôi làng trong tỉnh này đã bẻ gãy tất cả giáo của họ để ăn mừng hòa bình."
 
  mandala_realm_contract_0026_contract: "Hòa Bình của Guru"
  mandala_realm_contract_0026_desc: "Một guru địa phương vận động hòa bình, để con cái ở [TaskContract.GetLocation.GetNameNoTooltip] có thể lớn lên cày ruộng thay vì chết trong mối thù."
  mandala_realm_contract_0026_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0026_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3500.t: "$mandala_ritual_prefix$ Hòa Bình của Guru"
  tgp_east_asia_mandala_task_contract_events.3500.desc: "\"Đại nhân [ROOT.Char.GetTitleAsNameNoTooltip] rạng rỡ, con là đạo sư [local_character.GetFirstName] — con dẫn dắt dân chúng [ritual_location.GetName],\" vị [GetTrait('devoted').GetName( local_character )|l] nói, giọng vững chãi đầy thuyết phục. \"Con triệu ngài đến đây vì những vùng đất này cần đôi bàn tay để cày cấy, chứ không phải để cầm giáo.\"\n\n\"Hãy để con cái nông dân cày cấy trên cánh đồng của cha ông chúng — hãy để một thế hệ lớn lên trong sự thanh bình thực sự.\""
  tgp_east_asia_mandala_task_contract_events.3500.a: "Họ sẽ biết sự thanh thản — và ngươi sẽ đi bên ta."
  tgp_east_asia_mandala_task_contract_events.3500.b: "Ta còn nhiều điều phải học, ngươi sẽ cùng ta không?"
  tgp_east_asia_mandala_task_contract_events.3500.c: "Giáo của họ phục vụ thần tính của ta."
  generation_of_peace_modifier: "Thế Hệ Hòa Bình"
  generation_of_peace_modifier_desc: "Một thế hệ nông dân được lớn lên trong hòa bình, không chịu bất kỳ thuế dịch nào."
 
  mandala_realm_contract_0027_contract: "Chiếu Hòa Giải"
  mandala_realm_contract_0027_desc: "Trưởng lão [TaskContract.GetLocation.GetNameNoTooltip] yêu cầu ngài cấm tuần tra vũ trang và ban hành chiếu tất cả tranh chấp phải được giải quyết bằng hòa giải."
  mandala_realm_contract_0027_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0027_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3600.t: "$mandala_ritual_prefix$ Chiếu Hòa Giải"
  tgp_east_asia_mandala_task_contract_events.3600.desc: ""Vĩ đại [ROOT.Char.GetTitleAsNameNoTooltip], ở [ritual_location.GetName], tranh chấp được giải quyết bằng giáo và lửa — chứ không phải lời nói," trưởng làng nói, đặt một phiến đá lớn cùng dụng cụ khắc. "Lời ngươi là luật thần thánh. Khắc hòa bình vào đá, chấm dứt bạo lực."\n\nTa cầm lấy dụng cụ. Ta sẽ khắc..."
  tgp_east_asia_mandala_task_contract_events.3600.a: "...rằng vũ khí bị cấm."
  tgp_east_asia_mandala_task_contract_events.3600.b: "...rằng tranh chấp phải được giải quyết bằng lời nói."
  tgp_east_asia_mandala_task_contract_events.3600.c: "...rằng ta là thiện và vĩ đại."
  weapon_ban_modifier: "Khắc Lệnh Cấm Vũ Khí"
  weapon_ban_modifier_desc: "Không vũ khí nào được phép theo chiếu của Devaraja."
  arbitration_edict_modifier: "Khắc Lệnh Hòa Giải"
  arbitration_edict_modifier_desc: "Tranh chấp phải được giải quyết bằng lời nói, theo chiếu của Devaraja."
 
  mandala_realm_contract_0028_contract: "Bát Chánh Đạo"
  mandala_realm_contract_0028_desc: "Một lãnh đạo địa phương yêu cầu ngài đi im lặng qua tám làng — mỗi làng tương ứng một góc của [TaskContract.GetLocation.GetNameNoTooltip]."
  mandala_realm_contract_0028_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0028_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3700.t: "$mandala_ritual_prefix$ Bát Chánh Đạo"
  tgp_east_asia_mandala_task_contract_events.3700.desc: ""[ritual_location.GetName] đầy làng — và đầy mệt mỏi, ganh đua, và thói xấu," trưởng làng nói, quay chậm khi [local_character.GetSheHe] chỉ vòng tròn rộng. "Tám làng bao quanh [ritual_location.Custom('GetRandomRegionalDangerSingular')], mỗi làng một hướng."\n\n"Để dạy họ [Glossary('Eightfold Path', 'EIGHTFOLD_PATH_GLOSS')], ngươi phải đi qua chính mình — tám làng, tám gánh nặng — không nghỉ ngơi. Chỉ khi đó họ mới thấy nỗ lực chính đáng thực sự là gì.""
  tgp_east_asia_mandala_task_contract_events.3700.a: "Ta sẽ chịu đựng như một Bồ Tát."
  tgp_east_asia_mandala_task_contract_events.3700.b: "Ta sẽ đi theo đạo, dù thậm chí ta cũng phải nghỉ."
  tgp_east_asia_mandala_task_contract_events.3700.c: "Đi ngựa sẽ nhanh hơn..."
  EIGHTFOLD_PATH_GLOSS: "Một giáo lý trung tâm trong Phật giáo, nêu tám nguyên tắc sống đúng đắn — Chánh Kiến, Chánh Tư Duy, Chánh Ngữ, Chánh Nghiệp, Chánh Mạng, Chánh Tinh Tấn, Chánh Niệm và Chánh Định.\n\nCác lý tưởng tương tự được tôn trọng trong các truyền thống Hindu, tín ngưỡng bản địa, và tín ngưỡng tổng hợp ở Nam và Đông Nam Á như hướng dẫn cho hòa hợp cá nhân và xã hội."
  eightfold_path_modifier: "Bát Chánh Đạo"
  eightfold_path_modifier_desc: "Devaraja đã chứng minh đức hạnh của [Glossary('Eightfold Path', 'EIGHTFOLD_PATH_GLOSS')] ở đây."
  walked_the_eightfold_path_modifier: "Đã Đi Bát Chánh Đạo"
  walked_the_eightfold_path_modifier_desc: "Devaraja này đã chứng minh đức hạnh của [Glossary('Eightfold Path', 'EIGHTFOLD_PATH_GLOSS')] bằng cách đi qua tám làng mà không nghỉ."
 
  mandala_realm_contract_0029_contract: "Rừng Linh Bị Đe Dọa"
  mandala_realm_contract_0029_desc: "Một rừng linh thiêng ở [TaskContract.GetLocation.GetNameNoTooltip] bị săn bắn và khai thác đe dọa. Dân làng van xin ngài để lại binh lính canh giữ."
  mandala_realm_contract_0029_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0029_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3800.t: "$mandala_ritual_prefix$ Rừng Linh Bị Đe Dọa"
  tgp_east_asia_mandala_task_contract_events.3800.desc: ""Rừng [ritual_location.Custom('GetRandomRegionalWood')] linh thiêng của chúng Ta đã bị ô uế, [ROOT.Char.GetTitleAsNameNoTooltip]," dân rừng[local_character.GetWomenMen] nói, chỉ vào một khoảng trống. "Chúng trở thành nơi cho thợ săn, kẻ trộm và người khai thác. Xin hãy — cử binh lính của ngài để sửa sai và làm cho đất đai thịnh vượng trở lại.""
  tgp_east_asia_mandala_task_contract_events.3800.a: "Binh lính ta sẽ canh giữ rừng."
  tgp_east_asia_mandala_task_contract_events.3800.b: "Đồn quân [county_scope.GetNameNoTooltip] sẽ bảo vệ vùng đất."
  tgp_east_asia_mandala_task_contract_events.3800.c: "Một phép ban phước sẽ xua đi ô uế."
  well_protected_groves_modifier: "Rừng Được Bảo Vệ Tốt"
  well_protected_groves_modifier_desc: "Rừng trong hạt này được bảo vệ tốt."
  garrisoned_groves_modifier: "Rừng Có Đồn Bảo Vệ"
  garrisoned_groves_modifier_desc: "Rừng trong hạt được bảo vệ bởi đồn chính, khiến quân mỏng ra."
 
  mandala_realm_contract_0030_contract: "Thề Im Lặng"
  mandala_realm_contract_0030_desc: "[TaskContract.GetLocation.GetNameNoTooltip] yêu cầu ngài thực hiện lời thề công khai về phi bạo lực — ngồi im trong nhiều ngày, để dạy họ sự thanh thản."
  mandala_realm_contract_0030_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0030_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.3900.t: "$mandala_ritual_prefix$ Thề Im Lặng"
  tgp_east_asia_mandala_task_contract_events.3900.desc: "Trước khi nhìn thấy [ritual_location.GetName], chúng ta nghe thấy: la hét, cãi cọ, tiếng ồn liên tục. Đây không phải là nơi thanh tịnh.\n\n"Vĩ đại [ROOT.Char.GetTitleAsNameNoTooltip], nếu ngươi im lặng, họ cũng sẽ im lặng — nếu ngươi bình an, họ cũng vậy," trưởng làng[local_character.GetWomanMan] cầu xin. "Hãy chứng minh thần tính của ngươi, và giải thoát chúng Ta khỏi hỗn loạn này.""
  tgp_east_asia_mandala_task_contract_events.3900.a: "Hãy để ba trăng trôi qua trong im lặng, và sự thanh thản sẽ đến."
  tgp_east_asia_mandala_task_contract_events.3900.b: "Một tuần im lặng sẽ làm dịu sự bất ổn."
  tgp_east_asia_mandala_task_contract_events.3900.c: "Một cuộc đi bộ qua thị trấn sẽ làm mọi người bình tĩnh."
  discordant_town_modifier: "Thị Trấn Hỗn Loạn"
  discordant_town_modifier_desc: "Tỉnh này bị quấy nhiễu bởi hỗn loạn và cãi cọ."
 
  mandala_realm_contract_0031_contract: "Đặt Đá"
  mandala_realm_contract_0031_desc: "Dân làng [TaskContract.GetLocation.GetNameNoTooltip] muốn dựng một công trình để vinh danh ngài. Họ yêu cầu nghi lễ đặt vũ khí xuống trước khi xây dựng bắt đầu."
  mandala_realm_contract_0031_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0031_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4000.t: "$mandala_ritual_prefix$ Đặt Đá"
  tgp_east_asia_mandala_task_contract_events.4000.desc: ""Bình an [ROOT.Char.GetTitleAsNameNoTooltip], chúng Ta là [Glossary('Śilpakāras', 'SILPAKARAS_GLOSS')] của [ritual_location.GetName]," dân làng[local_character.GetWomenMen] nói, cúi chào khi nâng búa xây dựng. "Chúng Ta muốn dựng một công trình trong tinh thần hòa bình và thịnh vượng."\n\n"Nhưng trước khi bắt đầu, chúng Ta yêu cầu ngài chôn [Glossary('pedangs', 'PEDANG_GLOSS')] dưới nền móng — để xua đuổi linh hồn bạo lực và thánh hóa đất.""
  tgp_east_asia_mandala_task_contract_events.4000.a: "Ta sẽ ra lệnh cho quân đội đặt vũ khí xuống."
  tgp_east_asia_mandala_task_contract_events.4000.b: "Lữ đoàn [sacrificial_regiment.GetNameNoTooltip] của ta sẽ giao nộp vũ khí."
  tgp_east_asia_mandala_task_contract_events.4000.c: "Ta sẽ chôn một thanh gươm dưới đất."
  SILPAKARAS_GLOSS: "Trong tiếng Phạn, Śilpakāra chỉ một nghệ nhân kiến trúc hoặc điêu khắc. Trong các triều đình Hindu-Phật giáo Nam và Đông Nam Á, họ thành lập các hội đoàn. Ở các quốc gia mandala Khmer, Java và Ấn Độ, Śilpakāras thường làm việc dưới sự bảo trợ thần thánh hoặc hoàng gia."
  pious_silpakaras_modifier: "Śilpakāras Sùng Đạo"
  pious_silpakaras_modifier_desc: "Một nhóm [Glossary('Śilpakāras', 'SILPAKARAS_GLOSS')] sùng đạo làm việc tại tỉnh này."
  ritually_disarmed_modifier: "Cởi Vũ Khí Nghi Lễ"
  ritually_disarmed_modifier_desc: "Nhân vật này đã chôn vũ khí của mình như một phần của nghi lễ mandala."
 
  mandala_realm_contract_0032_contract: "Ẩn Sĩ Cười"
  mandala_realm_contract_0032_desc: "Một ẩn sĩ tinh nghịch đang gieo rắc hỗn loạn tại [TaskContract.GetLocation.GetNameNoTooltip]. Dân làng kêu gọi ngài dùng mưu trí để đánh bại kẻ quấy rối này."
  mandala_realm_contract_0032_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0032_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4100.t: "$mandala_ritual_prefix$ Ẩn Sĩ Cười"
  tgp_east_asia_mandala_task_contract_events.4100.desc: "Tiếng cười lớn chào đón chúng ta khi đặt chân đến [ritual_location.GetName]. Đám đông tụ tập quanh một vị [GetTrait('devoted').GetName( local_character )|l] béo tốt, gương mặt họ rạng rỡ sự mong chờ. \"...và giờ đây, hãy chiêm ngưỡng tên [GetTrait('arrogant').GetName( local_character_2 )|l] [local_character_2.Custom('dummy_peasant_profession')] rời khỏi nhà mình,\" vị ẩn sĩ nói, giọng trầm và đầy tinh nghịch.\n\nĐúng lúc đó, một thùng nước từ cửa đổ ụp xuống — làm ướt sũng người đó trong một tiếng bắn nước chấn động. \"Cái tôi của [local_character_2.GetHerHis|U] đã được gột rửa hoàn toàn!\" vị [GetTrait('devoted').GetName( local_character )|l] gầm lên, ôm bụng cười ngặt nghẽo. Dân làng bật cười — ngay cả nạn nhân ướt sũng cũng cười theo."
  tgp_east_asia_mandala_task_contract_events.4100.a: "Ngươi nghĩ có thể đánh lừa [ROOT.Char.GetTitleAsNameNoTooltip]? Không bao giờ!"
  tgp_east_asia_mandala_task_contract_events.4100.b: "[local_character.GetSheHe|U] phải dạy ta!"
  tgp_east_asia_mandala_task_contract_events.4100.c: "[local_character.GetSheHe|U] là hiện thân của ý chí ta."
 
  mandala_realm_contract_0033_contract: "Mồi Linh"
  mandala_realm_contract_0033_desc: "Dân làng tại [TaskContract.GetLocation.GetNameNoTooltip] yêu cầu ngài dựng một tượng mồi — để đánh lừa những linh hồn ác đang quấy phá vùng đất của họ."
  mandala_realm_contract_0033_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0033_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4200.t: "$mandala_ritual_prefix$ Mồi Linh"
  tgp_east_asia_mandala_task_contract_events.4200.desc: ""[ROOT.Char.GetTitleAsNameNoTooltip], các linh hồn đang nguyền rủa [local_character.Custom('RegionalRootVegetablePlural')] của chúng Ta, chỉ còn lại ruỗng," trưởng làng[local_character.GetWomanMan] nói, chỉ vào đống gỗ và [ritual_location.Custom('GetRandomImprovisedBridgeMaterial')]. "Ngài phải dựng một tượng để lừa các linh hồn — làm dịu chúng hoặc dẫn chúng đi chỗ khác.""
  tgp_east_asia_mandala_task_contract_events.4200.a: "Ta sẽ dựng một tượng [local_character.Custom('RegionalRootVegetable')] lớn để hăm dọa chúng."
  tgp_east_asia_mandala_task_contract_events.4200.b: "Một tượng nhiều mặt của ta sẽ xua đuổi chúng."
  tgp_east_asia_mandala_task_contract_events.4200.c: "Một bức tượng [ROOT.Char.GetFaith.HealthGodName] sẽ làm dịu chúng."
  mocked_idol_modifier: "Tượng Bị Chế Giễu"
  mocked_idol_modifier_desc: "Một bức tượng do Devaraja dựng được dân trong hạt này chế giễu rộng rãi."
  vegetable_idol_modifier: "Tượng Linh Củ Quả"
  vegetable_idol_modifier_desc: "Một bức tượng do Devaraja dựng được tin sẽ đem mùa màng thịnh vượng."
  ruler_idol_modifier: "Tượng Linh Devaraja"
  ruler_idol_modifier_desc: "Một bức tượng do Devaraja dựng được tin sẽ xua đuổi linh hồn ác."
 
  mandala_realm_contract_0034_contract: "Trò Chơi Trí Tuệ"
  mandala_realm_contract_0034_desc: "Một quý tộc ở [TaskContract.GetLocation.GetNameNoTooltip] thách thức ngài trong một trò chơi trí tuệ — để chứng minh thần tính trước triều đình."
  mandala_realm_contract_0034_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0034_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4300.t: "$mandala_ritual_prefix$ Trò Chơi Trí Tuệ"
  tgp_east_asia_mandala_task_contract_events.4300.desc: "Khi tiếp cận [ritual_location.GetHolding.GetType.GetName] tại [ritual_location.GetName], ta được chào đón bởi [local_character.GetTitledFirstNameNicknamed]. 'Vĩ đại và tinh khôn [ROOT.Char.GetTitleAsNameNoTooltip], ta thách ngươi một trò chơi [local_character.Custom('BG_GameType_Generic')],' [local_character.GetSheHe] nói, nâng mảnh khắc. 'Thắng, ngươi sẽ có sự tôn trọng của ta. Thắng nhờ #EMP mưu mẹo#! — và ngươi sẽ có lòng trung thành vĩnh viễn của ta.'\n\nNgười hầu dọn [local_character.Custom('GetExpensiveMeal')] và [local_character.Custom('GetExpensiveDrink_Singular')]. 'Nhưng nếu thua... thì hãy xem.'"
  tgp_east_asia_mandala_task_contract_events.4300.a: "Ta sẽ di chuyển quân cờ bằng tay [ROOT.Char.GetFaith.TricksterGodNamePossessive]."
  tgp_east_asia_mandala_task_contract_events.4300.b: "Kỹ năng của ta sẽ giúp ta vượt qua."
  tgp_east_asia_mandala_task_contract_events.4300.c: "Một trò chơi thân thiện, không hơn."
 
  mandala_realm_contract_0035_contract: "Kẻ Trộm Thần Thánh"
  mandala_realm_contract_0035_desc: "Một kẻ phạm pháp ở [TaskContract.GetLocation.GetNameNoTooltip] mang hình ảnh của ngài và thực hiện hành vi trộm cắp trong khi tự xưng là ngài."
  mandala_realm_contract_0035_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0035_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4400.t: "$mandala_ritual_prefix$ Kẻ Trộm Thần Thánh"
  tgp_east_asia_mandala_task_contract_events.4400.desc: "'Ta đòi dây chuyền của ngươi — nó quan trọng cho nghi lễ của ta,' một [local_character.GetWomanMan] nhìn #EMP rùng rợn#! giống ta, đứng trước một dân làng kinh ngạc. 'Nhanh lên, đừng để [ROOT.Char.GetTitleAsNameNoTooltip] chờ!' \n\n[local_character.GetSheHe|U] quay lại — và đứng sững khi thấy ta. 'Ôi vĩ đại [ROOT.Char.GetTitleAsNameNoTooltip]..! Ta chỉ... thu thuế thay ngài thôi!' [local_character.GetSheHe] thốt ra."
  tgp_east_asia_mandala_task_contract_events.4400.a: "Ngừng trộm cắp — ngươi sẽ nói bằng giọng ta tại [ritual_location.GetNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.4400.b: "Ngươi hữu dụng. Ngươi sẽ trở về với ta."
  tgp_east_asia_mandala_task_contract_events.4400.c: "Trả lại tất cả những gì ngươi đã lấy."
  omnipresent_authority_modifier: "Quyền Lực Toàn Diện"
  omnipresent_authority_modifier_desc: "Gần như Devaraja sống trong hạt này với mức độ xuất hiện nhiều... nhưng họ không sống ở kinh đô sao?"
 
  mandala_realm_contract_0036_contract: "Thử Thách Linh Hồn"
  mandala_realm_contract_0036_desc: "Người dân [TaskContract.GetLocation.GetNameNoTooltip] tin rằng họ bị lừa bởi một [TaskContract.GetLocation.Custom('GetProvinceTricksterSpirit')]."
  mandala_realm_contract_0036_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0036_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4500.t: "$mandala_ritual_prefix$ Thử Thách Linh Hồn"
  tgp_east_asia_mandala_task_contract_events.4500.desc: "\"Đại nhân [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại, chúng con đang bị lừa bởi một [ritual_location.Custom('GetProvinceTricksterSpirit')],\" vị trưởng lão rên rỉ, xoa trán. \"Giếng đầy ếch nhái, bánh gạo bị thiu chỉ sau một đêm, một đàn [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] làm lũ trẻ sợ hãi — và con thức dậy với một con #EMP [local_character.Custom('RegionalPoxAnimal')]#! đang ngủ bên cạnh mình!\"\n\nNgài nghiêng người, đôi mắt đảo liên hồi. \"Ngài phải đánh bại kẻ giở trò... hãy thực hiện một lễ tế giả để làm nó bối rối!\""
  tgp_east_asia_mandala_task_contract_events.4500.a: "Tập hợp dân làng — ta sẽ 'hiến tế' một đứa trẻ!"
  tgp_east_asia_mandala_task_contract_events.4500.b: "Ta sẽ dùng con dê được huấn luyện giả chết."
  tgp_east_asia_mandala_task_contract_events.4500.c: "Ta sẽ dâng trái cây... rồi ăn nó cho bữa tối."
 
  mandala_realm_contract_0037_contract: "Lễ Hội Đảo Ngược"
  mandala_realm_contract_0037_desc: "Một làng tại [TaskContract.GetLocation.GetNameNoTooltip] tổ chức lễ hội nơi mọi quy tắc đều đảo ngược."
  mandala_realm_contract_0037_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0037_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4600.t: "$mandala_ritual_prefix$ Lễ Hội Đảo Ngược"
  tgp_east_asia_mandala_task_contract_events.4600.desc: "Khi đến [ritual_location.GetName], một đứa trẻ đội vương miện tạm thời chạy ngang qua. 'Ta là [ROOT.Char.GetTitleAsNameNoTooltip]! Hãy chiêm ngưỡng thần tính ta!' [local_character_2.GetSheHe] hét lên. Làng tràn ngập lễ hội đảo ngược: người nghèo mặc như quý tộc, Ta tớ đóng vai chúa, chủ mang khay.\n\nNếu ta tham gia hóa trang, không bị chú ý, họ sẽ chứng kiến thần tính thực sự."
  tgp_east_asia_mandala_task_contract_events.4600.a: "Ta sẽ đi như một kẻ ăn xin."
  tgp_east_asia_mandala_task_contract_events.4600.b: "Ta sẽ đi như một lính."
  tgp_east_asia_mandala_task_contract_events.4600.c: "Ta sẽ đi như... chính mình."
 
  mandala_realm_contract_0038_contract: "Tiên Tri Dê"
  mandala_realm_contract_0038_desc: "Một con dê biết nói được ca ngợi là sứ giả thần thánh của ngài tại [TaskContract.GetLocation.GetNameNoTooltip]."
  mandala_realm_contract_0038_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0038_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4700.t: "$mandala_ritual_prefix$ Tiên Tri Dê"
  tgp_east_asia_mandala_task_contract_events.4700.desc: "'Hãy đến, chứng kiến con dê thần thánh qua đó [ROOT.Char.GetTitledFirstNameNoTooltip] nói!' [local_character.GetWomanMan] cúi chào kịch, và con dê cào đất bằng móng. '...sáu, bảy, tám! Tám vết cào! Đây là dấu hiệu — tất cả phải mua [local_character_2.GetFirstNamePossessive] [local_character_2.Custom('GetExpensiveDrink_Singular')]!' \n\n[local_character.GetSheHe|U] ngước lên và đứng sững. 'Ôi... vĩ đại [ROOT.Char.GetTitleAsNameNoTooltip]..! Ta — ta không thấy ngài ở đó...'\n\nMột kẻ lừa đảo khéo léo. Với một con dê được huấn luyện. Hữu ích."
  tgp_east_asia_mandala_task_contract_events.4700.a: "Miễn là 'sứ giả' của ta đóng thuế..."
  tgp_east_asia_mandala_task_contract_events.4700.b: "Ngươi và con dê sẽ theo ta."
  tgp_east_asia_mandala_task_contract_events.4700.c: "...bốn, năm! Năm vết cào — hối lỗi công khai."
  punished_charlatan_modifier: "Kẻ Lừa Bị Trừng Phạt"
  punished_charlatan_modifier_desc: "Một kẻ lừa đảo mới bị lộ và trừng phạt tại đây."
  goat_oracle_modifier: "Tiên Tri Dê"
  goat_oracle_modifier_desc: "Một tiên tri dê được diễu hành khắp hạt này, được tin là nói thay cho Devaraja."
 
 
  mandala_realm_contract_0039_contract: "Quái Vật Trong Bóng Tối"
  mandala_realm_contract_0039_desc: "Dân cư [TaskContract.GetLocation.GetNameNoTooltip] đang bị quái vật rình rập tại [TaskContract.GetLocation.Custom('TerrainTypeProvince')]. Họ yêu cầu ngài bẫy chúng — hoặc dùng mưu trí đánh lừa chúng."
  mandala_realm_contract_0039_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0039_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4800.t: "$mandala_ritual_prefix$ Quái Vật Trong [ritual_location.Custom('TerrainTypeProvince')|U]"
  tgp_east_asia_mandala_task_contract_events.4800.desc: "Khi đi qua [ritual_location.GetName], ta cảm thấy những ánh mắt vô hình theo dõi từ [ritual_location.Custom('TerrainTypeProvince')]. 'Khôn ngoan [ROOT.Char.GetTitleAsNameNoTooltip], hãy yên lặng,' một dân làng thì thầm. '[ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')|U] — và những quái vật khác — xuất hiện khắp nơi. Hãy dẫn chúng đi, bẫy chúng — chúng Ta cầu ngài, làm gì đó đi.'"
  tgp_east_asia_mandala_task_contract_events.4800.a: "Chúng ta sẽ bẫy chúng; da của chúng sẽ trang trí ngai vàng ta."
  tgp_east_asia_mandala_task_contract_events.4800.b: "Hãy đuổi chúng đi, [ritual_location.Custom('TerrainTypeProvince')] sẽ là lá chắn của chúng ta."
  tgp_east_asia_mandala_task_contract_events.4800.c: "Không, chúng là sứ giả của ta."
  beast_free_modifier: "Miền Sạch Quái Vật"
  beast_free_modifier_desc: "Tỉnh này đã được giải phóng khỏi quái vật nguy hiểm nhờ một Devaraja hùng mạnh."
  brimming_with_beasts_modifier: "Đầy Quái Vật"
  brimming_with_beasts_modifier_desc: "Tỉnh này đầy những quái vật dữ tợn thích ăn khách qua đường."
  gain_hunt_artifact_tt: "Ngài nhận được một [artifact|E] liên quan săn bắn"
 
  mandala_realm_contract_0040_contract: "Nāga Sông"
  mandala_realm_contract_0040_desc: "Dân làng tin rằng một [Glossary('nāga', 'NAGA_GLOSS')] cư ngụ trong các con sông của [TaskContract.GetLocation.GetNameNoTooltip]. Họ yêu cầu ngài dẫn nó đi nơi khác."
  mandala_realm_contract_0040_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0040_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.4900.t: "$mandala_ritual_prefix$ Nāga Sông"
  tgp_east_asia_mandala_task_contract_events.4900.desc: "'Khôn ngoan [ROOT.Char.GetTitleAsNameNoTooltip], một [Glossary('nāga', 'NAGA_GLOSS')] căm thù đang rình rập trong sông [ritual_location.GetName],' một [local_character.GetWomanMan] run rẩy cầu xin. 'Mười dân làng đã mất — bị kéo xuống nước. Ngài phải dẫn nó đi trước khi còn nhiều người mất nữa!' \n\nChúng Ta cưỡi dọc bờ sông, không khí dày đặc sương mù và sợ hãi. Rồi — chuyển động trong lau sậy. Không phải nāga, mà là một con cá sấu khổng lồ, cổ xưa, như một thần sông trong đền của nó."
  tgp_east_asia_mandala_task_contract_events.4900.a: "[entourage_character.GetFirstNameNoTooltip], lấy thịt này — chúng ta phải bắt nó!"
  tgp_east_asia_mandala_task_contract_events.4900.b: "Bắn nó bằng mũi tên, không được để nó sống."
  tgp_east_asia_mandala_task_contract_events.4900.c: "Nó phục vụ ta, tránh xa sông."
  river_crocodile_god_modifier: "Thần Cá Sấu"
  river_crocodile_god_modifier_desc: "Một con cá sấu khổng lồ, thường bị nhầm với [Glossary('nāga', 'NAGA_GLOSS')], rình rập trong vùng nước của tỉnh này — ăn quân địch và làm dân làng khiếp sợ."
 
  mandala_realm_contract_0041_contract: "Đất Hứa"
  mandala_realm_contract_0041_desc: "Một đoàn hành hương lớn đang tìm 'đất hứa' của họ ở đâu đó trong [TaskContract.GetLocation.GetNameNoTooltip]."
  mandala_realm_contract_0041_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0041_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và đưa ra lựa chọn dựa trên [mandala_aspect|E] của Ngài"
  tgp_east_asia_mandala_task_contract_events.5000.t: "$mandala_ritual_prefix$ Đất Hứa"
  tgp_east_asia_mandala_task_contract_events.5000.desc: "Sau khi đi qua [ritual_location.Custom('TerrainTypeProvince')] của [ritual_location.GetName], cuối cùng chúng Ta nhìn thấy đoàn hành hương — yếu, kiệt sức, hàng trăm người.\n\nNgười lãnh đạo đứng dậy, giọng run rẩy vì mệt mỏi: 'Chúng Ta là những hành hương [local_character.GetFaith.GetAdjective], đang tìm đất hứa. Ngài đến để dẫn chúng Ta đến chăng? Ngài là [ROOT.Char.GetTitleAsNameNoTooltip] — hay có lẽ là một vị thần?'"
  tgp_east_asia_mandala_task_contract_events.5000.a: "Ta là [local_character.GetFaith.TricksterGodName], nhà của các ngươi ở [ruler_capital_county.GetNameNoTooltip]."
  tgp_east_asia_mandala_task_contract_events.5000.b: "Ta là một Devaraja, và [ritual_location.GetNameNoTooltip] là đất hứa của các ngươi."
  tgp_east_asia_mandala_task_contract_events.5000.c: "Ta là [ROOT.Char.GetTitleAsNameNoTooltip], chúc các ngươi may mắn trong cuộc tìm kiếm."
