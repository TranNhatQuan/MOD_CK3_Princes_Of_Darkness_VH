  mandala_realm_contract_0001_contract: "Nghi Lễ Tỉnh [GetPlayer.Custom('GetAspectNoun')|U]"
  mandala_realm_contract_0001_desc: "[TaskContract.MakeScope.Var('loc_desc').GetFlagName|U]"
  mandala_realm_contract_0001_desc_title: "[TaskContract.MakeScope.Var('loc_compliment').GetFlagName|U] [GetPlayer.GetTitleAsNameNoTooltip],"
  mandala_realm_contract_0001_request: "Xuất hiện tại [TaskContract.GetLocation.GetName] và nhận phần thưởng dựa trên [mandala_aspect|E] [skill|E] của Ngài"
 
  mandala_provincial_ritual_desc_01: "Đức tin của chúng Ta nằm trong tay [GetPlayer.Custom('MistressMaster')|U]; chúng Ta rất mong đợi sự hiện diện của [GetPlayer.GetHerHis|U] để nhận phước lành từ [GetPlayer.GetHerHis|U]."
  mandala_provincial_ritual_desc_02: "Những cánh hoa đang tàn và sự yên bình của chúng Ta cùng với nó; chúng Ta đang háo hức mong chờ linh hồn và trí óc được phục hồi nhờ sự hiện diện của [GetPlayer.GetHerHis|U]."
 
  mandala_followers_doubting: "Thần Dân Yêu Cầu [mandala_rituals|E]"


  tgp_east_asia_mandala_task_contract_events.0990.t: "$mandala_ritual_prefix$ Lưỡng Lự"
  tgp_east_asia_mandala_task_contract_events.0990.desc: "Do dự, Ta xem xét lại kế hoạch đến [ongoing_destination.GetTitle.GetName] để thực hiện nghi lễ.\n\nLiệu đây có thực sự là thời điểm thích hợp để đi lại? Thời gian của Ta có nên dành cho nơi khác không? Những cân nhắc quan trọng đối với một biểu tượng tôn giáo."
  tgp_east_asia_mandala_task_contract_events.0990.a: "Người dân [ongoing_destination.GetNameNoTooltip] đang mong đợi Ta!"
  tgp_east_asia_mandala_task_contract_events.0990.a_tt: "$governor_contract_event.1012.a_tt$"
  tgp_east_asia_mandala_task_contract_events.0990.b: "$governor_contract_event.1012.b$"
  tgp_east_asia_mandala_task_contract_events.0990.b_tt: "[ongoing_contract.GetType.GetName] tại [ongoing_destination.GetName] đã bị bỏ dở"

  tgp_east_asia_mandala_task_contract_events.1000.t.creation: "$mandala_ritual_prefix$ Ôm Lấy Sáng Tạo"
  tgp_east_asia_mandala_task_contract_events.1000.t.serenity: "$mandala_ritual_prefix$ Ôm Lấy Bình An"
  tgp_east_asia_mandala_task_contract_events.1000.t.destruction: "$mandala_ritual_prefix$ Ôm Lấy Hủy Diệt"
  tgp_east_asia_mandala_task_contract_events.1000.t.trickery: "$mandala_ritual_prefix$ Ôm Lấy Xảo Quyệt"
  tgp_east_asia_mandala_task_contract_events.1000.desc.creation: "#EMP Kiến tạo.#! Sự sống vốn mỏng manh, và nghĩa vụ của chúng ta là chăm sóc nó theo cách tốt nhất có thể. Nếu ta chăm lo cho sự sống, động vật, thiên nhiên, chúng sẽ củng cố và ban cho ta sức mạnh gấp mười lần. Ta nhìn quanh khi chúng ta chăm sóc hệ thực vật bản địa.\n\nTrẻ em, người lớn, người già — tất cả cùng chung tay để tôn vinh sự sống. Những đứa trẻ vui vẻ đào bới đất bằng những công cụ thô sơ, gieo trồng hạt giống.\n\nMột trong những cận thần nhiệt thành nhất, [local_character.GetTitledFirstName], mồ hôi chảy dài trên trán, mỉm cười nhìn ta đầy mong đợi khi ngài chờ đợi những chỉ thị mới."
  tgp_east_asia_mandala_task_contract_events.1000.desc.serenity: "Tiếng xào xạc nhẹ trong tán lá. Ta nhìn qua vai để thấy phụ nữ, đàn ông, người già, trẻ nhỏ, và cả một vài đứa trẻ tham gia nghi lễ, lặng lẽ làm theo các động tác của Ta.\n\n#EMP Cúi. Kéo giãn. Hít thở. Duỗi ra. Hít thở.#!\n\nMột cư dân đặc biệt nhiệt tình, [local_character.GetTitledFirstName], chạy lại sau đó, hỏi xem bước tiếp theo nên làm gì."
  tgp_east_asia_mandala_task_contract_events.1000.desc.destruction: "Đống lửa đang cháy. Những vật hiến tế đã được thực hiện. Ta chiêm ngưỡng cảnh tượng, một màn trình diễn sức mạnh được dẫn dắt bởi lãnh đạo địa phương, [local_character.GetTitledFirstName], và những cá nhân mạnh mẽ nhất của [local_character.GetHerHis], do Ta chỉ huy.\n\nTất cả họ, háo hức phục vụ, sẵn sàng ngăn chặn cái ác trước khi nó nuốt chửng Sáng Tạo. Sáng Tạo của chúng ta.\n\nHọ đồng loạt nhìn Ta, một câu hỏi rõ ràng trên khuôn mặt: Ta muốn họ làm gì tiếp theo?"
  tgp_east_asia_mandala_task_contract_events.1000.desc.trickery: "Ảo ảnh, trò tinh nghịch và chơi trò tâm lý lẫn nhau. Tất cả đều thiện chí. Tất cả #EMP vô hại#!. Cho đến khi không còn.\n\nNgười dân [ritual_location.GetName], mà không hay biết, tiết lộ những bí mật sâu thẳm nhất của họ khi tham gia nghi lễ của Ta, và những người nhận ra điều này, chính là những người sẽ dẫn dắt đàn chiên và phục vụ danh Ta, duy nhất...\n\nMột trong những người khôn khéo, [local_character.GetTitledFirstName], liếc nhìn Ta đầy lừa dối, chờ lệnh tiếp theo của Ta cho đám đông."
  tgp_east_asia_mandala_task_contract_events.1000.a: "Họ nên tập trung tôn kính Ta."
  tgp_east_asia_mandala_task_contract_events.1000.b: "Hãy để họ đắm mình trong vinh quang của Ta!"
 
 

 #CUSTOM LOC
