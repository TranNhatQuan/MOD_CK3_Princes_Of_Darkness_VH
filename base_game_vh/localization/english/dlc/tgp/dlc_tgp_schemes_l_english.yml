  coup_ceremonial_liege_desc_general: "[scheme|E] thù địch cho phép [ceremonial_regent|E] chiếm ngôi từ [ceremonial_liege|E] của mình."
  coup_ceremonial_liege_warning: "@alert_icon! #M Nếu thành công, [vassals|E] của Realm có thể trở nên [independent|E] dựa trên mối quan hệ với [ruler|E] cũ, khác biệt về [culture|E], [faith|E], [opinion|E] với Kẻ Phiêu Lưu, kích thước Sub-Realm, sức mạnh quân sự, khoảng cách từ [capital|E], và các yếu tố khác#!"
