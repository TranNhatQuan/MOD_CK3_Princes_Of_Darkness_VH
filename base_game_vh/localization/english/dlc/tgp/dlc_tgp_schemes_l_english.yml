  scheme_critical_moments.1232.desc: "Năng lực của [target.GetName] nay được hoàng cung công nhận. [target.GetHerHis|U] sự nghiệp sẽ đạt đến tầm cao mới. Tất cả nhờ vào ảnh hưởng của ta."
  scheme_critical_moments.1232.desc.myself: "Năng lực của ta nay được hoàng cung công nhận. Ta đã tận dụng ảnh hưởng tốt và sự nghiệp sẽ sớm đạt tầm cao mới."
  scheme_critical_moments.1232.a: "Thành tựu của một người nói lên cho cả nhóm!"
  scheme_critical_moments.1232.b: "[target.GetFirstNameNoTooltip] giờ sẽ được tôn trọng hơn."
  scheme_critical_moments.1232.b.myself: "Ta giờ sẽ được tôn trọng hơn."
  scheme_critical_moments.1233.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.1233.desc: "Các cận thần của ta ca ngợi [target.GetName] nhưng không ai nghe trong hoàng cung. Không ai công nhận kiến thức [target.GetHerHis] về [target.Custom('education_focus')]."
  scheme_critical_moments.1233.desc.myself: "Các cận thần ca ngợi ta nhưng hoàng cung không quan tâm. Không ai công nhận kiến thức của ta về [target.Custom('education_focus')]."
  scheme_critical_moments.1233.a: "Ít nhất ta biết giá trị của nó!"
  scheme_critical_moments.1235.t: "[scheme.GetNameNoTooltip]: Thành công"
  scheme_critical_moments.1235.desc: "Các cận thần của ta thành công. Toàn bộ hoàng cung bàn tán về sai sót và kém cỏi của [target.GetName]. Sự nghiệp của [target.Custom2('InsultNoun', ROOT.Char)] sẽ đi xuống, tất cả nhờ vào mưu kế của ta!"
  scheme_critical_moments.1235.a: "Khuyết điểm của một người nói lên cho cả nhóm!"
  scheme_critical_moments.1235.b: "Bộ mặt thật của [target.GetFirstNameNoTooltip] đã lộ."
  scheme_critical_moments.1236.t: "[scheme.GetNameNoTooltip]: Thất bại"
  scheme_critical_moments.1236.desc: "Các cận thần báo cáo không có gì. Hoàng cung không chịu tin bất kỳ tin đồn nào chúng ta lan truyền. Rõ ràng danh tiếng [target.GetName] hoàn hảo và [target.GetSheHe] đã vững vàng trong hoàng cung. [target.Custom2('InsultAdjective', ROOT.Char)] đi trước một bước so với ta."
  scheme_critical_moments.1236.a: "[target.GetFirstNameNoTooltip] lần này thoát khỏi tầm tay ta."
  movement_power_scheme.tt.increased_movement: "Tăng [movement_power|E] của [targets_movement.GetName] nhờ [owner.GetShortUINamePossessive] [merit_level|E]: #P [movement_power_scheme_effect_value|0=+]#! #weak ([EmptyScope.ScriptValue('movement_power_increased_scheme_decay_value')|0=+]/năm)#!"
  movement_power_scheme.tt.increased_character: "Tăng [movement_power|E] của [target.GetName] nhờ [owner.GetShortUINamePossessive] [merit_level|E]: #P [movement_power_scheme_effect_value|0=+]#! #weak ([EmptyScope.ScriptValue('movement_power_increased_scheme_decay_value')|0=+]/năm)#!"
  movement_power_scheme.tt.decreased_movement: "Giảm [movement_power|E] của [targets_movement.GetName] nhờ [owner.GetShortUINamePossessive] [merit_level|E]: #N [movement_power_scheme_effect_value|0=+]#! #weak ([EmptyScope.ScriptValue('movement_power_decreased_scheme_decay_value')|0=+]/năm)#!"
  movement_power_scheme.tt.decreased_character: "Giảm [movement_power|E] của [target.GetName] nhờ [owner.GetShortUINamePossessive] [merit_level|E]: #N [movement_power_scheme_effect_value|0=+]#! #weak ([EmptyScope.ScriptValue('movement_power_decreased_scheme_decay_value')|0=+]/năm)#!"

