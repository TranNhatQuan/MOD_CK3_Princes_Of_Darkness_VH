  scheme_critical_moments.2922.t: "$coup_ceremonial_liege$: [ROOT.Char.GetTitleAsNameNoTooltip] mới"
  scheme_critical_moments.2922.desc: "Kế hoạch được kiểm tra và chuẩn bị kỹ càng, từng khả năng được lường trước, mỗi kẻ âm mưu đều sẵn sàng. Xông vào [target.Custom('ResidenceBuilding')|l] dễ dàng dưới vỏ bọc công việc...\n\nHỗn loạn xảy ra khi báo động vang lên, nhưng qua xô đẩy, đâm chém, cuối cùng chúng Ta đã ra ngoài, mệt lử nhưng chiến thắng!\n\nKẻ [target.Custom2('InsultAdjective', ROOT.Char)] giả-[ROOT.Char.GetTitleAsNameNoTooltip], [target.GetFirstName], vẫn kịp thoát — là mối đe dọa với vị trí của Ta miễn [target.GetSheHe] còn tự do."
  scheme_critical_moments.2922.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] là #EMP của Ta#!!"
 
  scheme_critical_moments.2923.t: "$coup_ceremonial_liege$: Hy vọng tan vỡ"

  scheme_critical_moments.2924.t: "$coup_ceremonial_liege$: Vương miện bị đánh cắp"
  scheme_critical_moments.2924.desc: "Một ngày bình thường ở [target.GetCapitalLocation.GetBaronyNameExplicitly] bỗng biến thành cơn ác mộng. [target.Custom('ResidenceBuilding')|l] vang lên tiếng la hét của lính gác và đầy rẫy tiếng hô hoán của người hầu chạy khắp hành lang.\n\nCuối cùng, một trung sĩ thở hổn hển giải thích rằng một nhóm côn đồ đã lọt vào dưới vỏ bọc giả, và đang chiến đấu tiến đến phòng ngai!\n\n"
  scheme_critical_moments.2924.imprison: "Đột nhiên lính xông vào cửa, Ta bị kéo ra trước mặt lãnh đạo, [owner.GetFirstName], kẻ khoe khoang giơ vương miện của Ta."
  scheme_critical_moments.2924.death: "Khi tìm cách chạy trốn, Ta bị cuốn vào hỗn loạn, lưỡi kiếm vung tới!"
  scheme_critical_moments.2924.outro: "Ta lẻn qua khu vực của người hầu, cải trang thành dân thường, và hòa vào đám đông chạy trốn khỏi [target.Custom('ResidenceBuilding')|l]..."
  scheme_critical_moments.2924.a: "Ta sẽ quay lại!"
  scheme_critical_moments.2924.b: "Mày, con cóc xấu xa!"
  scheme_critical_moments.2924.c: "Chết tiệt!"

  scheme_critical_moments.2925.t: "$coup_ceremonial_liege$: Vương miện khao khát"
  scheme_critical_moments.2925.desc: "Một ngày bình thường ở [target.GetCapitalLocation.GetBaronyNameExplicitly] bỗng biến thành cơn ác mộng. [target.Custom('ResidenceBuilding')|l] vang lên tiếng la hét của lính gác và đầy rẫy tiếng hô hoán của người hầu chạy khắp hành lang.\n\nCuối cùng, lính của Ta kiểm soát tình hình, và tiếng chiến đấu dần lắng xuống."
  scheme_critical_moments.2925.imprison: "[owner.GetFirstName], một kẻ vô danh không có đất đai, bị kéo ra trước mặt Ta, kế hoạch chiếm đoạt vương miện của [owner.GetHerHis] bại lộ."
  scheme_critical_moments.2925.death: "Xác của [owner.GetFirstName], một kẻ vô danh tiểu tốt không đất dung thân, bị kéo đến trước mặt ta, kế hoạch chiếm đoạt vương miện của ta bằng vũ lực đã hoàn toàn thất bại."
  scheme_critical_moments.2925.outro: "Ta được biết [owner.GetFirstName], kẻ vô danh không có đất đai, dẫn đầu cuộc tấn công, tìm cách chiếm vương miện bằng vũ lực. Kẻ hèn đã biến mất từ lâu."
  scheme_critical_moments.2925.a: "Mày sẽ #EMP trả giá#!"
  scheme_critical_moments.2925.b: "[owner.GetSheHe|U] biết điều gì xảy ra với kẻ chiếm đoạt!"
  scheme_critical_moments.2925.c: "Chết tiệt con [owner.Custom2('InsultNoun', ROOT.Char)]!"
 
  OWNER_IS_MY_MOVEMENT_MEMBER: "Thuộc cùng [movement|E] với [owner.GetShortUIName]: $VALUE|+0=$"
