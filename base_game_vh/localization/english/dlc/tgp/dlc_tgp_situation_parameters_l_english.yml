  dynastic_cycle.tt.forbid_title_destruction:  "[title|E] này không thể bị phá hủy trong [GetSituation('dynastic_cycle').GetName]"
  dynastic_cycle.tt.forbid_title_creation:  "[title|E] này không thể được tạo lập trong [GetSituation('dynastic_cycle').GetName]"
  dynastic_cycle_current_phase_desc:  "[situation_dynastic_cycle_phase|E] là [GetSituation('dynastic_cycle').GetTopCurrentPhase.GetName]"
