l_english: 
  dynastic_cycle: "$game_concept_dynastic_cycle$"
  dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
  situation_dynastic_cycle: "Hệ thống $game_concept_dynastic_cycle$"
  situation_dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
  situation_dynastic_cycle_phase_stability_expansion: "Khuếch trương"
  situation_dynastic_cycle_phase_stability_expansion_icon: "@tgp_dynastic_cycle_expansion_icon! $situation_dynastic_cycle_phase_stability_expansion$"
  situation_dynastic_cycle_phase_stability_expansion_desc_short: "Trong [dynastic_cycle_era_short|E] này, Đế quốc tập trung gia tăng sức mạnh bằng cách hướng ngoại: bình định biên cương, mở rộng tầm ảnh hưởng thông qua vũ lực quân sự, các [tributaries|E], và [silk_road|E]."
  situation_dynastic_cycle_phase_stability_expansion_desc: "$situation_dynastic_cycle_phase_stability_expansion_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Do đó, để cải cách Trung Hoa sang $game_concept_dynastic_cycle_era_short$ này từ $game_concept_dynastic_cycle_era_short$ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName], trước tiên quốc gia phải tiến vào $game_concept_dynastic_cycle_era_short$ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]."
  situation_dynastic_cycle_phase_stability_advancement: "Phát triển"
  situation_dynastic_cycle_phase_stability_advancement_icon: "@tgp_dynastic_cycle_advancement_icon! $situation_dynastic_cycle_phase_stability_advancement$"
  situation_dynastic_cycle_phase_stability_advancement_desc_short: "Trong [dynastic_cycle_era_short|E] này, Đế quốc tập trung tự hoàn thiện bằng cách hướng nội: thông qua các [innovations|E], tinh hoa văn hóa, sự thịnh vượng của nhân dân, và nền quản trị [meritorious|E] theo đường lối [GetReligionByKey('confucianism_religion').GetAdjective]."
  situation_dynastic_cycle_phase_stability_advancement_desc: "$situation_dynastic_cycle_phase_stability_advancement_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Do đó, để cải cách Trung Hoa sang $game_concept_dynastic_cycle_era_short$ này từ $game_concept_dynastic_cycle_era_short$ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName], trước tiên quốc gia phải tiến vào $game_concept_dynastic_cycle_era_short$ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]."

  SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA: "Trung Quốc bước vào $game_concept_dynastic_cycle_era_short$ này từ [dynastic_cycle_era_type_unstable|E] nếu đủ [situation_catalyst_catalysts|E] kích hoạt."

  situation_dynastic_cycle_phase_instability_conquest:  "Chinh phục"
  situation_dynastic_cycle_phase_instability_conquest_icon:  "@tgp_dynastic_cycle_conquest_icon! $situation_dynastic_cycle_phase_instability_conquest$"
  situation_dynastic_cycle_phase_instability_conquest_desc_short:  "An [dynastic_cycle_era_short|E] of consolidation after a foreign power has conquered China."
  situation_dynastic_cycle_phase_instability_conquest_desc:  "$situation_dynastic_cycle_phase_instability_conquest_desc_short$\n\nIn order to enter this $game_concept_dynastic_cycle_era_short$, the [hegemony|E] of China has to fall into the hands of a [ruler|E] that does #bold not#! have a [GetGovernment('celestial_government').GetName|E] [government|E] or a [culture|E] [heritage|E] that is #bold not#! $heritage_chinese_name$."
  situation_dynastic_cycle_phase_instability:  "Căng thẳng"
  situation_dynastic_cycle_phase_instability_icon: "@tgp_dynastic_cycle_instability_icon! $situation_dynastic_cycle_phase_instability$"
  situation_dynastic_cycle_phase_instability_desc: "$situation_dynastic_cycle_phase_instability_desc_short$ Nếu tránh được [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName], Trung Hoa có thể tiến tới $game_concept_dynastic_cycle_era_short$ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] hoặc [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName].\n\nTrung Hoa bước vào $game_concept_dynastic_cycle_era_short$ này từ [dynastic_cycle_era_type_stable|E] nếu có đủ [situation_catalyst_catalysts|E] được kích hoạt."
  situation_dynastic_cycle_phase_instability_desc_short: "Đây là một [dynastic_cycle_era_short|E] của sự bất ổn, nhưng cũng đầy rẫy cơ hội. Dù tham nhũng, bạo loạn và ngoại xâm là mối đe dọa, một sự cai trị sáng suốt vẫn có thể cải cách Trung Hoa."
  situation_dynastic_cycle_phase_chaos:  "Quần hùng Cát cứ"
  situation_dynastic_cycle_phase_chaos_icon:  "@tgp_dynastic_cycle_chaos_icon! $situation_dynastic_cycle_phase_chaos$"
  situation_dynastic_cycle_phase_chaos_desc_short:  "An [dynastic_cycle_era_short|E] of warlords, where only a strong [ruler|E] can unite China."
  situation_dynastic_cycle_phase_chaos_desc:  "$situation_dynastic_cycle_phase_chaos_desc_short$\n\nThis $game_concept_dynastic_cycle_era_short$ begins either if:\n$EFFECT_LIST_BULLET$In either [dynastic_cycle_era_type_unstable|E], enough [situation_catalyst_catalysts|E] trigger\n$EFFECT_LIST_BULLET$The current [son_of_heaven|E] loses the [mandate_of_heaven|E]\n\n#S When this $game_concept_dynastic_cycle_era_short$ starts#!\n$BULLET$#indent_newline:2 The [hegemony|E] of China [title|E] is destroyed and the former [son_of_heaven|E] is [deposed|E]#!\n$BULLET$#indent_newline:2 [empire|E] and [kingdom|E] [title_tier|E] [titles|E] in the [de_jure|E] hierarchy are also destroyed, if their [holders|E] have [movement_power_i][movement_power_short|E] lower than [EmptyScope.ScriptValue('high_movement_power_value')] and [EmptyScope.ScriptValue('medium_movement_power_value')] respectively#!\n$BULLET$#indent_newline:2 Independent [rulers|E] will swear fealty or pay tribute to their [elders|E] or [movement_leaders|E]\n$BULLET$Every independent [ruler|E] will join the #V $dynastic_cycle_participant_group_other_rulers$#! [situation_participant_group|E]#!\n$BULLET$Every other [situation_participant_group|E] will be disbanded"
  situation_dynastic_cycle_phase_stability:  "Ổn định"
  situation_dynastic_cycle_phase_stability_desc:  "#D Giai đoạn này không nên được hiển thị#!"
  dynastic_cycle_sub_region_core:  "Trung Hoa"
  dynastic_cycle_sub_region_core_desc:  "Tất cả các [counties|E] được hợp nhất vào hệ thống phân cấp [de_jure|E] của [GetTitleByKey('h_china').GetDefinitiveName]"
  dynastic_cycle_sub_region_peripheries:  "Biên cương Trung Hoa"
  dynastic_cycle_sub_region_peripheries_desc:  "Tất cả các [counties|E] không phải là một phần của [GetSituation('dynastic_cycle').GetSubRegionByKey( 'core' ).GetName], nhưng vẫn thuộc sở hữu của [son_of_heaven|E]"
  custom_dynastic_cycle:  "Thiên Hạ"
  dynastic_cycle_participant_group_hegemon_ruler:  "Thiên Tử"
  dynastic_cycle_participant_group_hegemon_ruler_desc:  "[son_of_heaven|E], [holder|E] of [GetTitleByKey('h_china').GetDefinitiveName]"
  dynastic_cycle_participant_group_other_rulers:  "Nhà cai trị Khác"
  dynastic_cycle_participant_group_other_rulers_desc:  "Tất cả các [rulers|E] ở [GetSituation('dynastic_cycle').GetTopSubRegion.GetName] không phải là [vassals|E] của [GetTitleByKey('h_china').GetDefinitiveName]"
  dynastic_cycle_participant_group_advancement_movement: "$game_concept_movement$ Tiến bộ"
  dynastic_cycle_participant_group_advancement_movement_desc: "Tất cả [vassals|E] của [GetTitleByKey('h_china').GetDefinitiveName] mong muốn thúc đẩy [dynastic_cycle|E] tiến tới [situation_dynastic_cycle_phase|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName].\n\nHọ cống hiến hết mình cho sự phồn vinh của các tỉnh cốt lõi Trung Hoa bằng cách: gia tăng [development|E], hoàn thành các [great_projects|E], khám phá các [innovations|E], và tích lũy [merit|E] thông qua các kỳ [examinations|E].\n$unlockables_advancement$"
  dynastic_cycle_participant_group_expansion_movement: "$game_concept_movement$ Bành trướng"
  dynastic_cycle_participant_group_expansion_movement_desc: "Tất cả [vassals|E] của [GetTitleByKey('h_china').GetDefinitiveName] nhằm mục đích thúc đẩy [dynastic_cycle|E] tiến tới [situation_dynastic_cycle_phase|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName].\n\nĐể tạo điều kiện chinh phục các vùng lãnh thổ bên ngoài Trung Hoa, họ tập trung vào việc trao quyền cho các [governors|E] [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )], tăng cường [prowess|E], giáo dục [martial_lifestyle|E], và học hỏi các [commander_traits|E].\n$unlockables_expansion$"
  dynastic_cycle_participant_group_pro_hegemon_movement: "Pro-[SelectLocalization( GetPlayer.IsValid, 'pro_hegemon_movement_in_game_name', 'Triều đại' ) ] $game_concept_movement$"
  pro_hegemon_movement_in_game_name: "[GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip]"
  dynastic_cycle_participant_group_pro_hegemon_movement_desc: "Tất cả [vassals|E] của [GetTitleByKey('h_china').GetDefinitiveName] tuân theo ý nguyện của [son_of_heaven|E].\n\nHọ đặt mục tiêu trở thành những [governors|E] và [ministers|E] có tầm ảnh hưởng, những người ủng hộ nhiệt thành cho [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('hegemon_ruler').GetNameNoTooltip]. Họ nhận được $situation_parameter_pro_hegemon_interaction_boost$."
  dynastic_cycle_participant_group_conservative_movement: "$game_concept_movement$ Bảo thủ"
  dynastic_cycle_participant_group_conservative_movement_desc: "Tất cả [vassals|E] của [GetTitleByKey('h_china').GetDefinitiveName] tìm cách tăng cường quyền lực cho giới quý tộc.\n\nHọ tập trung vào các cải cách và thay đổi có lợi cho các [powerful_families|E] và những [dynasties|E] lẫy lừng, đồng thời coi trọng truyền thống hơn là [merit|E].\n$unlockables_conservative$"
  unlockables_advancement: "$BULLET_WITH_TAB$Cho phép thực hiện [interaction|E] #V $boost_efficiency_interaction$#! \n$BULLET_WITH_TAB$$scholarly_inspiration_frequency_desc$\n$BULLET_WITH_TAB$Tăng [aptitude|E] của [court_position|E] [GetCourtPositionType('court_poet_court_position').GetName]\n$BULLET_WITH_TAB$Cho phép thực hiện [decision|E] [GetDecisionWithKey('tgp_japan_become_a_poet_decision').GetName]\n$BULLET_WITH_TAB$Cho phép thực hiện [decision|E] [GetDecisionWithKey('diligent_development_focus_decision').GetName]"
  unlockables_expansion: "$BULLET_WITH_TAB$Cho phép thực hiện [interaction|E] #V $damage_efficiency_interaction$#! \n$BULLET_WITH_TAB$Cho phép thực hiện [interaction|E] #V $fp3_request_turkic_invasion_interaction$#! \n$BULLET_WITH_TAB$Cho phép thực hiện [interaction|E] #V $spar_with_knight_interaction$#! "
  unlockables_conservative: "$BULLET_WITH_TAB$Cho phép thực hiện [interaction|E] #V $damage_efficiency_interaction$#! \n$BULLET_WITH_TAB$Có thể yêu cầu thay đổi [law|E] [GetLawGroup('candidate_score_laws').GetName] thông qua [decision|E] [GetDecisionWithKey('movement_petition_decision').GetName]\n$BULLET_WITH_TAB$Có thể xây dựng [domicile_building_upgrade|E] [GetDomicileBuilding('east_asian_estate_reception_hall_01').GetName]"
  dynastic_cycle_participant_group_undecided_movement:  "Trung lập"
  dynastic_cycle_participant_group_undecided_movement_desc: "Tất cả [vassals|E] của [GetTitleByKey('h_china').GetDefinitiveName] vẫn chưa chọn phe trong trạng thái [dynastic_cycle|E] hiện tại.\n\nHọ có thể bị thuyết phục để tham gia vào bất kỳ [movement|E] nào khác."
  dynastic_cycle_situation_dynastic_cycle_phase_stability_expansion_situation_phase:  "[SITUATION_PHASE_TYPE.GetName]"
  dynastic_cycle_situation_dynastic_cycle_phase_stability_advancement_situation_phase:  "[SITUATION_PHASE_TYPE.GetName]"
