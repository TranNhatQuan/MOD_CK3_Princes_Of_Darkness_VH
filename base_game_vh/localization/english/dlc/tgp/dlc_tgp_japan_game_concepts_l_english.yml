l_english: 
 # Japanese Manors
  game_concept_japanese_manor: "Địa trang Nhật Bản"
  game_concept_japanese_manors: "Các địa trang Nhật Bản"
  game_concept_manor: "Địa trang"
  game_concept_manors: "Các địa trang"
  game_concept_shoen: "Shōen" # 荘園/庄園
  game_concept_family_manor: "Địa trang gia tộc"
  game_concept_family_manors: "Các địa trang gia tộc"
  game_concept_japanese_manor_desc: "Một $game_concept_manor$ - hoặc [Glossary( 'Shōen', 'SHOEN_GLOSS')] - là một loại [domicile|E] do [house_head|E] của các [noble_families|E] nổi bật nắm giữ trong [GetGovernment('japan_administrative_government').GetName] và [GetGovernment('japan_feudal_government').GetName] [realms|E]. Chúng đại diện cho các đất tư nhân không ràng buộc với bất kỳ [landed|E] [title|E] cụ thể nào.\n\n[japanese_manor_building|E] có thể được xây dựng tại đây để mở rộng sự giàu có và [influence|E] của gia tộc, và $game_concept_manor$ sẽ được thừa kế cho các thế hệ sau."
  game_concept_japanese_manor_building: "Công trình địa trang Nhật Bản"
  game_concept_japanese_manor_buildings: "Các công trình địa trang Nhật Bản"
  game_concept_manor_building: "Công trình địa trang"
  game_concept_manor_buildings: "Các công trình địa trang"
  game_concept_japanese_manor_building_desc: "$game_concept_japanese_manor_buildings$ là các cải thiện độc đáo và bền vững cho một [japanese_manor|E].\n\nCó nhiều loại công trình khác nhau có thể xây dựng, và chủ sở hữu địa trang có thể xây để tạo thu nhập tư nhân, mở rộng [influence|E] của gia tộc, và mở khóa nhiều [decisions|E], [interactions|E], và hơn thế nữa."

 # Government
  game_concept_ritsuryo: "$japan_administrative_government$"
  game_concept_ritsuryo_government: "Chính phủ $japan_administrative_government$"
  game_concept_ritsuryo_i: "@government_type_ritsuryo!"
  game_concept_japan_administrative: "$japan_administrative_government$"
  game_concept_ritsuryo_government_desc: "$japan_administrative_government_desc$"
  game_concept_soryo: "$japan_feudal_government$"
  game_concept_soryo_government: "Chính phủ $japan_feudal_government$"
  game_concept_soryo_i: "@government_type_soryo!"
  game_concept_japan_feudal: "$japan_feudal_government$"
  game_concept_soryo_government_desc: "$japan_feudal_government_desc$"
 
 # Japanese Bureaucracy
  game_concept_japanese_bureaucracy: "Bộ máy quan liêu Nhật Bản"
  game_concept_japanese_bureaucracy_desc: "$game_concept_japanese_bureaucracy$ đại diện cho mức độ tập trung quyền lực của [ritsuryo_government|E] [realm_possessive|E] và quyền lực tổng thể mà [ruler|E] nắm giữ đối với các [vassals|E].\n\nChỉ [top_liege|E] mới có thể thay đổi $game_concept_japanese_bureaucracy$. $game_concept_vassals$ Nhật Bản sử dụng cùng cấp độ với $game_concept_liege$ của họ.\n\nCó bốn cấp độ của $game_concept_japanese_bureaucracy$:\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_0$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_1$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_2$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_3$\n\nTăng $game_concept_japanese_bureaucracy$ tốn một lượng [prestige|E] tùy thuộc vào [realm_size|E] và [learning_skill|E] của người cai trị."

  game_concept_ceremonial_liege: "Quân chủ nghi lễ"
  game_concept_ceremonial_liege_possessive: "Quân chủ nghi lễ"
  game_concept_ceremonial_liege_desc: "Ở một số [realms|E] (như Nhật Bản), một quan chức quyền lực hoặc tướng lĩnh có thể nắm quyền thực sự với tư cách [ceremonial_regent|E], để lại $game_concept_ceremonial_liege$ danh nghĩa chỉ là người đại diện và [vassal|E] trên thực tế. Tất cả thành viên của [house|E] $game_concept_ceremonial_liege_possessive$ được coi là một phần của [ceremonial_house|E].\n\nMặc dù không trực tiếp cai trị, $game_concept_ceremonial_house$ là dòng dõi được tôn trọng nhất trong một realm, và các [houses|E] khác sẽ nhận được nhiều [prestige|E] hơn khi kết hôn với họ, với các kết nối này ảnh hưởng mạnh mẽ đến quyền kế vị của $game_concept_ceremonial_regent$.\n\n$game_concept_ceremonial_liege$ có thể lấy lại quyền lực thực sự nếu họ giành lại [primary_title|E] của realm, ví dụ qua [faction|E] hoặc cạnh tranh cho [title|E] $game_concept_ceremonial_regent$ sử dụng [influence|E]."
  ceremonial_liege_concept: "[ceremonial_liege|E]"
  game_concept_ceremonial_house: "Nhà nghi lễ"
  game_concept_ceremonial_house_desc: "$game_concept_ceremonial_house$ chỉ dòng [house|E] của [ceremonial_liege|E] trong một [realm|E]."

 # Regent
  game_concept_ceremonial_regent: "Nhiếp chính"
  game_concept_ceremonial_regency: "Nhiếp chính"
  game_concept_ceremonial_regents: "Các nhiếp chính"
  game_concept_ceremonial_regent_possessive: "Nhiếp chính"
  game_concept_ceremonial_regent_desc: "$game_concept_ceremonial_regent$ là thuật ngữ chung cho bất kỳ [top_liege|E] nào cai trị thực tế thay mặt [ceremonial_liege|E], như #italic $game_concept_tenno$# Nhật Bản.\n\nTên vị trí $game_concept_ceremonial_regent_possessive$ có thể thay đổi tùy theo tình hình chính trị; ở Nhật Bản có thể gọi là [kampaku|E] hoặc [shogun|E]."
  ceremonial_regent_concept: "[ceremonial_regent|E]"
  game_concept_kampaku: "Kampaku"
  game_concept_kampaku_possessive: "Kampaku"
  game_concept_kampaku_desc: "[Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] về thực chất là vị trí cao nhất trong bộ máy [ritsuryo|E], kiểm soát đáng kể các cơ quan nhà nước thay mặt [tenno_possessive|E].\n\nDù thường do dòng họ [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] thống trị, với đủ [influence|E] và [prestige|E], bất kỳ gia tộc nào cũng có thể nắm giữ vị trí này."
  game_concept_shogun: "Shōgun"
  game_concept_shogun_possessive: "Shōgun"
  game_concept_shogun_desc: "Một $game_concept_shogun$, hay Độc tài, là người cai trị thực tế [soryo_government|E] toàn Nhật Bản, củng cố quyền lực đến mức kế vị trở thành di truyền, và cai trị thay mặt [tenno_possessive|E]."
  game_concept_cloistered_emperor: "Thiên hoàng ẩn cư"
  game_concept_cloistered_emperor_possessive: "Thiên hoàng ẩn cư"
  game_concept_joko: "Jōkō" # 上皇
  game_concept_joko_possessive: "Jōkō"
  game_concept_cloistered_emperor_desc: "Một $game_concept_cloistered_emperor$ là [tenno|E] đã thoái vị nhưng vẫn cai trị thực tế như [ceremonial_regent|E] cho Thiên hoàng đương nhiệm.\n\nĐể trở thành $game_concept_cloistered_emperor$, Thiên hoàng phải thoái vị #V Chrysanthemum Throne#! và trở thành Tu sĩ."
  game_concept_restored_emperor: "Thiên hoàng phục vị"
  game_concept_restored_emperor_possessive: "Thiên hoàng phục vị"
  game_concept_restored_emperor_desc: "Một $game_concept_restored_emperor$ là [tenno|E] cai trị độc lập với [ceremonial_regent|E].\n\nĐể trở thành $game_concept_restored_emperor$, [tenno|E] có thể được [faction|E] $restore_ceremonial_liege_faction_name$ đặt lên, hoặc sử dụng [GetDecisionWithKey('tgp_japan_emperor_restoration_decision').GetName] [decision|E] sau khi trở thành [ceremonial_regent|E]."
 # EMPEROR
  game_concept_japanese_emperor: "Thiên hoàng Nhật Bản"
  game_concept_japanese_emperor_possessive: "Thiên hoàng Nhật Bản"
  game_concept_tenno: "Ten'nō"
  game_concept_tenno_possessive: "Ten'nō"
  game_concept_japanese_emperor_desc: "$game_concept_tenno$ là Thiên hoàng chính thức của toàn $e_japan$, mặc dù quyền lực thực sự thường nằm trong tay [ceremonial_regent|E], người quản lý nhà nước thay mặt."
 # House Aspirations
  game_concept_house_aspiration: "Khát vọng gia tộc"
  game_concept_house_aspirations: "Khát vọng gia tộc"
  game_concept_aspiration: "Khát vọng"
  game_concept_aspirations: "Khát vọng"
  game_concept_house_aspiration_desc: "Một $game_concept_house_aspiration$ đại diện cho mục tiêu và phương thức của một [house|E] Nhật Bản, mỗi khát vọng mang lại các lợi ích và cơ hội khác nhau.\n\n[house_head|E] có thể chọn khát vọng theo đuổi, và tiêu [prestige|E] để cam kết sâu hơn, nhận được các ưu đãi mạnh hơn."
 # Imperial Policies
  game_concept_imperial_policy: "Chính sách Hoàng gia"
  game_concept_imperial_policies: "Chính sách Hoàng gia"
  game_concept_imperial_policy_desc: "$game_concept_imperial_policy$ là [law|E] do [top_liege|E] Nhật Bản đặt ra áp dụng cho tất cả [vassals|E]. Chính sách khác nhau có thể hạn chế hoặc cho phép hành động, hoặc đem lại hiệu ứng [realm|E]-toàn cục."
 # House Relations
  game_concept_house_relation: "Quan hệ gia tộc"
  game_concept_house_relations: "Quan hệ gia tộc"
  game_concept_house_relation_desc: "Khi hai [houses|E] tương tác, chúng có thể phát triển mối quan hệ $game_concept_house_relation$ tích cực hoặc tiêu cực, kéo dài qua nhiều thế hệ.\n\nNgoài việc ảnh hưởng đến [opinion|E] của tất cả các thành viên $game_concept_house$, mỗi cấp độ $game_concept_house_relation$ có thể có các hiệu ứng bổ sung, chẳng hạn như làm cho các [alliances|E] và [wars|E] trở nên dễ dàng hoặc khó khăn hơn.\n\nMối quan hệ $game_concept_house_relation$ duy trì ở cùng một cấp độ cho đến khi tổng các hành động đạt đến #P +100%#! hoặc #N -100%#!. Sau đó, mối quan hệ $game_concept_house_relation$ sẽ chuyển sang cấp độ tiếp theo, dù tích cực hay tiêu cực."
