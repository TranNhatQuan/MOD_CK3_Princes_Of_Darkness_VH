l_english:
  az_debate.0001.t: "Một Đệ Tử Đáng Chiến Thắng"
  az_debate.0001.desc: "Khắp đại sảnh, [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] nghiêng người về phía [disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)]. 'Dưới sự hướng dẫn của ta, kỷ luật và lòng trung thành là nền tảng của sự thấu triệt thật sự,' [rival_elder.GetTitledFirstNameNoTooltip] tuyên bố, giọng tràn đầy tự hào.\n\n'Đương nhiên, trưởng lão,' [disciple_candidate.GetTitledFirstNameNoTooltip] đáp, dù đôi mắt [disciple_candidate.GetHerHis] liếc về phía Ta. 'Nhưng... còn những ý tưởng mới, được thử nghiệm trong cuộc tranh luận công khai thì sao?' Ta bắt gặp nụ cười thoáng qua trên môi [disciple_candidate.GetHerHis]. Sắc bén trong giọng [disciple_candidate.GetHerHis] là một tia bồn chồn, và có lẽ là một cơ hội."
  az_debate.0001.a: "Thách thức [rival_elder.GetHerHim] công khai."
  az_debate.0001.a.success: "Trí tuệ vượt trội [rival_elder.GetFirstNamePossessiveNoTooltip]"
  az_debate.0001.a.failure: "Ta đi quá xa trong phản biện"
  az_debate.0001.b: "Đề nghị dẫn dắt riêng tư."
  az_debate.0001.b.success: "[disciple_candidate.GetFirstNameNoTooltip] chấp nhận lời mời của Ta"
  az_debate.0001.b.failure: "Lời đề nghị của Ta không được đáp lại"
  az_debate.0001.d: "Tốt hơn là bỏ qua người này."

  az_debate.0002.t: "Khoảnh Khắc Với Trưởng Lão"
  az_debate.0002.desc: "Tin nhanh chóng lan khắp đại sảnh: [elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)] đã tới.\n\n'Ta sẽ không ở lại lâu,' Trưởng Lão nói, giọng điềm tĩnh nhưng vang xa.\n\n[audience_rep.GetFirstNameNoTooltip] nghiêng về phía Ta, nói khẽ nhưng gấp gáp, 'Nếu Ngài có điều gì muốn nói, hãy nói ngay bây giờ, trước khi người khác chen [elder_candidate.GetHerHim] ra ngoài.'"
  az_debate.0002.a: "Gây ấn tượng bằng một lập luận hoàn hảo."
  az_debate.0002.a.success: "Lý lẽ của Ta đánh trúng mục tiêu"
  az_debate.0002.a.failure: "Ta lúng túng"
  az_debate.0002.c: "Tiếp cận họ trước khi ai khác nhận ra."
  az_debate.0002.c.success: "Ta di chuyển qua đám đông như một bóng đen"
  az_debate.0002.c.failure: "Ta đến [elder_candidate.GetHerHim] quá muộn"
  az_debate.0002.d: "Để khoảnh khắc trôi qua."
 
  az_debate.0003.t: "Tình Thế Khó Xử"
  az_debate.0003.desc: "[disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bước tới, ánh mắt rực lên thách thức. 'Nếu một vị vua phải chọn giữa giữ lời hứa mà sẽ gây hại cho vương quốc, hoặc phá lời để cứu dân, con đường công bằng là gì?'\n\nĐây không phải lời suy tưởng hời hợt, mà là một thử thách, để đo giá trị của Ta."
  az_debate.0003.a: "'Hãy theo Ta và Ta sẽ chỉ cho Ngài.'"
  az_debate.0003.b: "'Nghe kỹ: chân lý nằm trong dụ ngôn và châm ngôn.'"
  az_debate.0003.b.success: "Bài học vang rõ"
  az_debate.0003.b.failure: "Ý nghĩa vụt qua"
  az_debate.0003.c: "'Hãy để quyền lực của [my_movement.GetNameNoTooltip] chứng tỏ giá trị của Ta.'"
  az_debate.0003.d: "'Chúng ta sẽ tìm câu trả lời qua [ROOT.Char.GetFaith.ReligiousText|U].'"

  az_debate.0004.t: "Tiếng Nghi Ngờ"
  az_debate.0004.desc: "Ta nhìn thấy một nhóm nhỏ tụ tập thành vòng tròn, tiếng cười sắc bén và khinh miệt. Một người trong số họ, [freethinker_friend.Custom2('MyCharacterIntroduction', ROOT.Char)], nghiêng về phía Ta với nụ cười ranh mãnh.\n\n'Vậy hãy nói đi, [ROOT.Char.GetFirstNameNoTooltip], tại sao chúng Ta phải tôn sùng phong trào của Ngài? Chúng Ta không thích cờ xí và không kiên nhẫn với bậc thầy.'"
  az_debate.0004.a: "'Chính lý trí sẽ chứng minh sức mạnh của những gì Ta đại diện.'"
  az_debate.0004.b: "'Trí tuệ của Ngài lãng phí bên ngoài. Hãy đi cùng Ta thay vì vậy.'"
  az_debate.0004.c: "'Hãy bàn chuyện này qua [ROOT.Char.Custom('GetExpensiveDrink')].'"
  az_debate.0004.c.success: "[freethinker_friend.GetFirstNameNoTooltip] ấm lòng với sự đồng hành của Ngài"
  az_debate.0004.c.failure: "Cách tiếp cận tinh tế thất bại"
  az_debate.0004.d: "'Vậy hãy nói tự do, và đi theo con đường riêng của mình.'"

  az_debate.0005.t: "Lựa Chọn Cuối Cùng Của Trưởng Lão"
  az_debate.0005.desc: "[elder_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vuốt cằm [elder_candidate.GetHerHis] đầy suy tư, mắt liếc qua lại giữa ta và [rival_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"Đây có thể là môn đệ cuối cùng ta thu nhận,\" [elder_candidate.GetSheHe] nói một cách nghiêm nghị. \"Có ai trong hai ngươi thuyết phục được ta rằng ngươi xứng đáng không?\"\n\n[rival_candidate.GetFirstNameNoTooltip] khoanh tay [rival_candidate.GetHerHis], nhếch mép cười. \"Ta sẽ không bỏ lỡ cơ hội này.\""
  az_debate.0005.a: "'Ta sẵn sàng chứng minh bản thân.'"
  az_debate.0005.a.success: "Ngài gây ấn tượng với [elder_candidate.GetFirstNameNoTooltip]"
  az_debate.0005.a.failure: "Ngài không gây được ấn tượng với [elder_candidate.GetFirstNameNoTooltip]"
  az_debate.0005.b: "'Hãy để Ta xem bản luận cuối cùng của Ngài.'"
  az_debate.0005.b.tt: "Học vấn [learning|E] của Ngài chưa đủ cao và Ngài không [GetTrait('confucian_education').GetName(ROOT.Char)]"
  az_debate.0005.c: "'Ta sẽ không cản đường.'"

  az_debate.0006.t: "Bài Học Cuối Cùng"
  az_debate.0006.desc: "Với cái nhìn đo lường, [current_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] nói nhẹ nhàng:\n\n\"Ngươi đã học được tất cả những gì ta có thể truyền đạt, [ROOT.Char.GetFirstNameNoTooltip]. Những lời dạy của ta đã cạn kiệt, ngọn đèn trí tuệ của ta gần như đã tắt. Tuy nhiên, đừng nghĩ rằng ngươi bị bỏ rơi. Có một người mà sự hiểu biết của họ còn tỏa sáng rực rỡ hơn — [new_elder.Custom2('MyCharacterIntroduction', ROOT.Char)].\"\n\nVị trưởng lão nghiêng đầu [current_elder.GetHerHis] về phía vị cao nhân, sự hiện diện của [new_elder.GetHerHis] thật trang nghiêm và đầy mong đợi. \"Nếu ngươi muốn, ta sẽ giao ngươi cho [new_elder.GetHerHis] chăm sóc. Hay có lẽ con đường của ngươi nằm trên một hướng khác?\"\n\nNgười ta nói rằng theo sau chuỗi truyền thừa chính là tôn trọng những gì người xưa gọi là [Glossary( 'đạo', 'CONFUCIAN_DAO')]."
  az_debate.0006.a: "'Ta sẽ chấp nhận sự dẫn dắt của [new_elder.GetFirstNamePossessiveNoTooltip].'"
  az_debate.0006.b: "'Những lời dạy của ngài là đủ.'"
  az_debate.0006.c: "'Tại sao trí tuệ phải giới hạn trong một tiếng nói?'"
  az_debate.0006.c.success: "Cả hai trưởng lão gật đầu, ấn tượng"
  az_debate.0006.c.failure: "[new_elder.GetFirstNameNoTooltip] cứng người, cảm thấy bị xúc phạm"
  CONFUCIAN_DAO: "Nó ám chỉ Đạo — trật tự đạo đức và con đường vũ trụ do các hiền giả dạy. Nó vừa là hướng dẫn hành xử đúng đắn vừa là nền tảng của sự hài hòa giữa Thiên, Địa và con người."

  az_debate.0007.t: "Một Lời Khiển Trước Mọi Người"
  az_debate.0007.desc: "\"Ngươi có nghe thấy mình nói gì không vậy?\" [rival_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] gắt lên, giọng nói cắt ngang hội trường. \"Một đứa trẻ cũng có thể đọc thuộc lòng kinh điển với nhiều ý nghĩa hơn!\"\n\nNhững lời này giáng xuống như những cú đấm vào [disciple_candidate.Custom2('MyCharacterIntroduction', ROOT.Char)], môn đệ của [rival_elder.GetHerHis]. Những thư lại ngập ngừng giữa nét vẽ, mực đọng trên cọ của họ. [disciple_candidate.GetSheHe|U] hạ thấp cái nhìn [disciple_candidate.GetHerHis], má đỏ bừng, vai cứng đờ như thể đang đứng trước cơn mưa."
  az_debate.0007.a: "'Đừng để tính khí của người khác định đoạt Ngài.'"
  az_debate.0007.b: "'Hãy kể cho ta biết [rival_elder.GetSheHe] đã làm gì.'"
  az_debate.0007.b.success: "Đệ tử nồng nhiệt chấp nhận"
  az_debate.0007.b.failure: "Lời Ta vấp váp"
  az_debate.0007.c: "'Xin hãy, chúng ta hãy nói về hòa hợp.'"

  az_debate.0008.t: "Ngã Rẽ Học Thuật"
  az_debate.0008.desc: "Ở góc râm của đại sảnh, Ta quan sát [neutral_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] trao đổi lịch sự với [rival_leader.Custom2('MyCharacterIntroduction', ROOT.Char)], một thành viên của [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'undecided_movement' ).GetName].\n\n'[rival_movement.GetName] bồi dưỡng đức hạnh thông qua kỷ luật,' [rival_leader.GetTitledHouseNameOrFirstName] nhấn mạnh, hai tay mở ra đầy tự tin. 'Và tuy nhiên,' [neutral_scholar.GetTitledHouseNameOrFirstName] xen lời nhẹ nhàng, 'liệu kỷ luật một mình có nuôi dưỡng hòa hợp nếu thiếu lòng trắc ẩn?' Lông mày nhà vận động [rival_movement.GetNameNoTooltip] nhíu lại."
  az_debate.0008.a: "'Hãy xem xét sự hòa hợp mà [my_movement.GetNameNoTooltip] mang lại.'"
  az_debate.0008.b: "'Hãy cân nhắc chính các Kinh điển.'"
  az_debate.0008.b.success: "Ta để họ câm nín"
  az_debate.0008.b.failure: "Họ gật đầu, không ấn tượng"
  az_debate.0008.c: "'Hãy đến đây, [neutral_scholar.GetTitledHouseNameOrFirstName], và Ta sẽ chỉ cho Ngài đức hạnh thật sự.'"
  az_debate.0008.d: "'Ta e không muốn can thiệp...'"
  az_debate.0008.d.flavor: "... và tận hưởng bóng mát ở đây."

  az_debate.0009.t: "Một Sai Lầm Trong Đại Sảnh"
  az_debate.0009.desc: "Đứng lên đầy tự tin, [errant_disciple.Custom2('MyCharacterIntroduction', ROOT.Char)] hắng giọng. \"[Glossary( 'Bậc Thầy', 'CONFUCIUS_GLOSS' )] đã nói: 'Nếu một người cai trị bằng [Glossary('lễ nghi', 'CONFUCIAN_LI')], thì cũng giống như Sao Bắc Đẩu, và tất cả các vì sao sẽ cúi đầu trước nó!'\"\n\nMột tràng cười lan tỏa khắp hội trường. [stickler_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] nghiêng đầu [stickler_scholar.GetHerHis], giọng mượt như lụa: \"Thú vị... nhưng các sách Luận Ngữ không nói về lễ nghi, mà nói về [Glossary( 'đức độ', 'CONFUCIAN_DE')]. Chính đức độ mới giữ các vì sao ở đúng vị trí, chứ không phải nghi lễ.\""
  CONFUCIAN_LI: "Nó ám chỉ lễ nghi chuẩn mực và việc tuân thủ hình thức đúng, giúp duy trì hòa hợp trong xã hội và phản ánh đức hạnh nội tâm."
  az_debate.0009.a: "'Điều quan trọng không phải lời nói, mà là ý định.'"
  az_debate.0009.b: "Chuyển hướng đại sảnh bằng một giai thoại lịch sự."
  az_debate.0009.d: "'Nào, [errant_disciple.GetFirstNameNoTooltip], hãy đi chỗ khác.'"

  az_debate.0010.t: "Bài Thơ Có Gai"
  az_debate.0010.desc: "Ta nhìn [poet.Custom2('MyCharacterIntroduction', ROOT.Char)] đọc câu cuối cùng của bài thơ [poet.GetHerHis]: 'Một thân cây cong vươn lên trời, rễ ăn sâu, cành nặng bóng tối.'\n\nMột làn thì thầm tán thưởng vang lên từ đám đông.\n\n[critic.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nghiêng sát lại, thì thầm vào tai Ta: 'Bài thơ của [poet.GetFirstNamePossessiveNoTooltip] không chỉ là hình ảnh đơn giản. Nó ám chỉ [ROOT.Char.GetTopLiege.GetTitleAsName] đã lệch khỏi Mệnh Trời, sự suy tàn âm thầm phát triển…'"
  az_debate.0010.a: "'Rõ ràng là sự chế nhạo [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] của chúng ta!'"
  az_debate.0010.b: "Ta sẽ tìm lời khuyên của [poet.GetHerHis] riêng tư."
  az_debate.0010.c: "'Nào, đó chỉ là nghệ thuật!'"
  tgp_subtle_counsel_modifier: "Lời Khuyên Tinh Tế"
  tgp_subtle_counsel_modifier_desc: "Nhân vật này đang tìm lời khuyên từ một chuyên gia về sự tinh tế"

  az_debate.0011.t: "Quan Sát Trưởng Lão"
  az_debate.0011.desc: "Cuộc tranh luận diễn ra với nhịp điệu đoan trang, mỗi lời của [observed_elder.Custom2('MyCharacterIntroduction', ROOT.Char)] như tiếng chuông chùa vang đều.\n\n'Lễ nghi là xương sống của vương quốc; thiếu chúng, đức hạnh sụp đổ. Bỏ qua kinh điển là mời gọi hỗn loạn, gieo cỏ dại nơi lúa nên mọc.'"
  az_debate.0011.a: "Có lẽ [observed_elder.GetSheHe] có thể dạy Ta nhiều hơn?"
  az_debate.0011.b: "'Một bài học quan trọng.'"
  az_debate.0011.c: "'Một sự ủng hộ rõ ràng cho [GetPlayer.Custom('GetMyMovementShort')]'!"
