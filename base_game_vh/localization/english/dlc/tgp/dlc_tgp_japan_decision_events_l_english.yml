 ##################################################
 # JAPAN DECISION EVENTS 
 ##################################################
 # tgp_japan_establish_house_fief_decision
  tgp_japan_decision.9001.t.fief:  "Lãnh địa của gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
  tgp_japan_decision.9001.t.cadet:  "$create_cadet_branch_decision$"
  tgp_japan_decision.9001.desc.fief_split_house:  "Ta là hậu duệ đáng tự hào của gia tộc [old_house.GetBaseNameNoTooltip], nhưng đã đến lúc mở ra con đường mới, lập nên lãnh địa riêng tại [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier], bất chấp suy nghĩ của gia chủ [old_head.GetTitledFirstName]."
  tgp_japan_decision.9001.desc.fief_name:  "\n\nGiờ đây, điều còn lại chỉ là định danh cho gia tộc mới của ta..."
  tgp_japan_decision.9001.desc.cadet:  "Ta là hậu duệ đáng tự hào của gia tộc [old_house.GetBaseNameNoTooltip], nhưng đã đến lúc khai mở con đường mới, lập nên gia tộc riêng, bất chấp suy nghĩ của gia chủ [old_head.GetTitledFirstName]."
  tgp_japan_decision.9001.desc.permission:  "\n\nVới sự chúc phúc của [regent.GetTitledFirstNamePossessive], ta không còn phải e ngại lời trách cứ từ kinh thành!"
  tgp_japan_decision.9001.desc.crime: "\n\n[regent.GetTitledFirstName] chắc chắn sẽ nổi giận khi [regent.GetSheHe] nghe về điều này, nhưng đó không phải là vấn đề đáng lo ngại!"
  tgp_japan_decision.9001.desc.feudal:  "\n\nGia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] cuối cùng cũng gia nhập hàng ngũ quý tộc mới, dưới sự dẫn dắt của [regent.GetTitledFirstName]."
  tgp_japan_decision.9001.a.fief:  "Một mặt trời mới đã mọc."
  tgp_japan_decision.9001.a.cadet:  "$tgp_japan_decision.9001.a.fief$"
  tgp_japan_decision.9002.t:  "$tgp_japan_decision.9001.t.fief$"
  tgp_japan_decision.9002.t.landless:  "$tgp_japan_decision.9001.t.fief$"
  tgp_japan_decision.9002.desc:  "Chúng ta đã cố gắng hết sức trong khuôn khổ của bộ máy quan liêu, nhưng nay đã đến giới hạn."
  tgp_japan_decision.9002.desc.landed:  "Đã đến lúc mở ra con đường mới, và xác lập [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier] làm lãnh địa vĩnh viễn của gia tộc [ROOT.Char.GetHouse.GetBaseName]."
  tgp_japan_decision.9002.desc.landless:  "Đã đến lúc mở ra con đường mới, và từ bỏ xiềng xích của đám quan lại."
  tgp_japan_decision.9002.a:  "Một mặt trời mới rạng chiếu gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
  japanese_noble_family_name:  "[new_house.GetNameNoTooltip] $c_nf_japan_suffix$"
  japanese_house_first_name:  "[new_head.GetUIFirstNameOnlyNotMeNoTooltipNoFormat]-ryū"
  japanese_house_random_barony:  "[random_barony.GetNameNoTierNoTooltip]"
  japanese_house_domicile_barony:  "[domicile_barony.GetNameNoTierNoTooltip]"
  japanese_house_primary_county:  "[primary_county.GetNameNoTierNoTooltip]"
  japanese_house_domicile_county:  "[domicile_county.GetNameNoTierNoTooltip]"
  japanese_house_name_custom:  "[new_head.GetLocalizedText( 'new_japanese_house_name' )]"
  japanese_house_name_flag:  "[new_head.MakeScope.Var( 'new_japanese_house_name' ).GetFlagName]"
  japanese_house_name_fallback:  "[old_head.GetHouse.GetName]"
  japanese_house_name:  "[new_head.GetHouse.GetNameNoTooltip]"
  japanese_dynasty_name:  "[new_head.GetDynasty.GetNameNoTooltip]"
  tgp_japan_decision.9005.t:  "$tgp_japan_establish_house_fief_decision$: Gia tộc phân liệt"
  tgp_japan_decision.9005.t.landless:  "$tgp_japan_establish_soryo_manor_decision$: Gia tộc phân liệt"
  tgp_japan_decision.9005.desc: "[ROOT.Char.Custom2('RelationToMeShort', new_head)] của ta, [new_head.GetTitledFirstName], đã mạnh dạn tuyên bố bắt đầu một gia tộc mới, [new_head.GetHouse.GetBaseName], với [new_head.GetHerselfHimself] là người đứng đầu.\n\nTa không thể giả vờ chào đón hành động coi thường trắng trợn quyền lực của ta đối với Gia tộc [ROOT.Char.GetHouse.GetBaseName] này — hãy xem [new_head.GetSheHe] xoay xở thế nào khi không có sự bảo hộ của ta..."
  tgp_japan_decision.9005.a:  "Mặt trời vẫn rực cháy, dù không còn bóng râm của gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 # tgp_japan_become_shogun_decision
  tgp_japan_decision.9101.t:  "Mạc phủ [shogun.GetHouse.GetBaseNameNoTooltip]"
  tgp_japan_decision.9101.desc:  "Một kỷ nguyên mới đã khai mở trên [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip], khi quyền lực chuyển từ bút sang kiếm. Dưới sự lãnh đạo của gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip], trật tự cuối cùng sẽ được khôi phục, và những tàn dư cuối cùng của nền quan liêu cũ sẽ bị đẩy vào dĩ vãng.\n\nNhưng đừng ai nhầm lẫn — quyền uy của ta vẫn bắt nguồn từ [ceremonial_liege.GetTitleAsNameNoTooltip] thiêng liêng..."
  tgp_japan_decision.9101.a:  "Một biện pháp cần thiết để bảo toàn thái bình..."

  tgp_japan_decision.9102.t:  "$tgp_japan_decision.9101.t$"
  tgp_japan_decision.9102.desc:  "Mạc phủ đã trỗi dậy dưới quyền cai trị của [shogun.GetName], chấm dứt những cuộc nghị luận triều đình triền miên. Thay vào đó, kiếm và võ sĩ nay nắm giữ thực quyền, mang lại an ninh và trật tự trực tiếp cho muôn dân.\n\n"
  tgp_japan_decision.9102.admin:  "Quyền lực của ta đã bị tước đoạt, lãnh địa bị giao cho Mạc tướng. Thay vào đó là những kẻ hiếu chiến cai trị bằng sức mạnh thay vì lời nói..."
  tgp_japan_decision.9102.feudal:  "Lãnh địa của chúng ta vẫn vững bền, và quyền lực một lần nữa trở lại trong tay chúng ta. Trong kỷ nguyên mới này, sức mạnh quyết định tất cả."
  tgp_japan_decision.9102.fallback:  "Hy vọng rằng theo thời gian, quyết định này sẽ mang lại kết quả tốt đẹp."
  tgp_japan_decision.9102.a.admin:  "Đây là một trật tự mới khắc nghiệt."
  become_shogun_ritsuryo_vassals_tooltip:  "#N [ritsuryo_count|0V] [governor|E] [vassals|E] sẽ chống lại ngài#!"
  become_shogun_soryo_vassals_tooltip:  "#P [soryo_count|0V] [feudal|E] [vassals|E] sẽ gia nhập phe ngài#!"
  become_shogun_allied_vassals_tooltip:  "#P [allied_count|0V] [allied|E] hoặc [vassals|E] cùng [house|E] sẽ gia nhập phe ngài#!"

 # tgp_japan_imperial_branch_decision
  tgp_japan_decision.9201.t:  "$tgp_japan_imperial_branch_decision$"
  tgp_japan_decision.9201.desc:  "Tuy trẫm mang dòng máu hoàng gia, là hậu duệ chân chính của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nearest_emperor'))], [nearest_emperor.GetTitledFirstName], nhưng thiên mệnh của trẫm cùng con cháu lại không nằm trong những bức tường của hoàng cung.\n\nTrẫm sẽ từ bỏ mọi quyền thừa kế đối với [ROOT.Char.GetTopLiege.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetDefinitiveName|l], và nhận lấy một trong những họ [Glossary( 'Honsei', 'HONSEI_GLOSS' )] theo lệ ban cho hoàng tộc bị tước quyền: [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] hoặc [Glossary( 'Taira', 'TAIRA_GLOSS' )].\n\n"
  tgp_japan_decision.9201.both:  "Cả hai danh xưng này trước đây đều từng được ban cho hậu duệ của [nearest_emperor.GetTitledFirstNamePossessiveNoTooltip], với các gia tộc do [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))], [minamoto_head.GetTitledFirstName], và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))], [taira_head.GetTitledFirstName], đứng đầu."
  tgp_japan_decision.9201.minamoto:  "Dòng [nearest_emperor.GetFirstNameNoTooltip] $dynn_Minamoto$ đã khai chi tán diệp, do [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))], [minamoto_head.GetTitledFirstName], lãnh đạo."
  tgp_japan_decision.9201.taira:  "Dòng [nearest_emperor.GetFirstNameNoTooltip] $dynn_Taira$ đã khai chi tán diệp, do [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))], [taira_head.GetTitledFirstName], lãnh đạo."
  tgp_japan_decision.9201.a:  "Trẫm nguyện gia nhập dòng [minamoto_house.GetNameNoTooltip] $dynn_Minamoto$"
  tgp_japan_decision.9201.b:  "Chốn thuộc về của trẫm là dòng [taira_house.GetNameNoTooltip] $dynn_Taira$."
  tgp_japan_decision.9201.c:  "Trẫm nguyện mang họ $dynn_Minamoto$."
  tgp_japan_decision.9201.c.tt:  "Ngươi khai sáng triều #V [nearest_emperor.GetFirstNameNoTooltip] Minamoto#! [dynasty|E]"
  tgp_japan_decision.9201.d:  "'$dynn_Taira$ [ROOT.Char.GetFirstNameNoTooltip]' quả có uy danh hiển hách."
  tgp_japan_decision.9201.d.tt:  "Ngươi khai sáng triều #V [nearest_emperor.GetFirstNameNoTooltip] Taira#! [dynasty|E]"
  tgp_japan_decision.9201.message_title:  "Chi Phái Hoàng Tộc"
  new_honsei_house_name:  "[nearest_emperor.GetFirstNameNoTooltip]"
  may_found_noble_family_tt:  "Ngươi có thể trở thành gia chủ của một [noble_family|E] mới"
  will_found_noble_family_tt:  "Ngươi sẽ trở thành gia chủ của một [noble_family|E] mới"

 # tgp_japan_emperor_restoration_decision
  tgp_japan_decision.9301.t:  "Lồng Giam Đã Mở"
  tgp_japan_decision.9301.desc:  "Thân là Thiên Hoàng, trẫm đã đoạt lại vị trí chính đáng của mình, trở thành chủ nhân chân chính của thiên hạ này.\n\nQuyền lực của trẫm không còn bị kẻ khác thao túng để phục vụ dã tâm riêng, vạn sự nay đã quy về Ngai Hoa Cúc."
  tgp_japan_decision.9301.a:  "Mặt trời soi sáng sơn hà."
  tgp_japan_decision.9302.t:  "[tenno.GetTitleAsNameNoTooltip] Toàn Thắng"
  tgp_japan_decision.9302.desc: "Lời đồn lan nhanh như lửa về sự trở lại của $game_concept_tenno_possessive$. [tenno.GetName] đã khôi phục sự hiện diện của hoàng gia, nhân danh việc thu hồi quyền lực từ những bàn tay nhàn rỗi và xấu xa.\n\n[tenno.GetSheHe|U] hiện dự định cai trị trực tiếp hơn đối với người dân vùng đất này từ Ngai vàng Hoa cúc, và triều đại của [tenno.GetHerHis] sẽ không còn bị coi là chỉ mang tính nghi lễ nữa."
  tgp_japan_decision.9302.a:  "Thiên hạ trở lại trật tự."

 # tgp_japan_become_a_poet_decision
  tgp_japan_decision.9401.t:  "Ẩn Dụ và Vần Điệu"
  tgp_japan_decision.9401.desc:  "Ngày dài vô tận, đêm trắng triền miên trôi qua trong hành trình lĩnh hội thi ca của trẫm. Giấy tờ bay tán loạn, chỉ còn lại những nét bút nguệch ngoạc cùng dấu mực vương vãi trong quá trình truy cầu tri thức.\n\nĐã đến lúc trẫm phải chọn con đường phía trước. Liệu có nên tiếp tục theo đuổi, hay dừng bước nơi đây?"
  tgp_japan_decision.9401.a:  "Dốc toàn tâm lực, trẫm #EMP nhất định#! sẽ lĩnh ngộ."
  tgp_japan_decision.9401.a.toast.success:  "Ngươi đã nắm được tinh túy của thi ca"
  tgp_japan_decision.9401.a.toast.failure:  "Ngươi vẫn chưa thể lĩnh hội trọn vẹn"
  tgp_japan_decision.9401.b:  "Trẫm đổi ý rồi."
 
 # tgp_japan_become_a_monk_decision
  tgp_japan_decision.9500.t:  "Một Con Đường Mới"
  tgp_japan_decision.9500.desc:  "Trong vòng tay ấm áp, trẫm đón nhận sự giác ngộ mới tìm thấy, hướng đến vòng luân hồi — như thể trẫm được tái sinh một lần nữa.\n\nTrẫm sẽ hiến dâng cuộc đời cho [ROOT.Char.GetFaith.GetName], dành những năm tháng cuối đời để tu hành và truyền giảng những điều lĩnh hội được.\n\nTrẫm sẽ phụng sự [ROOT.Char.GetLiege.GetTitleAsName], tìm kiếm sự hài hòa giữa di sản văn hóa và thuận theo thiên nhiên khi nó dẫn lối cho bài học mới."
  tgp_japan_decision.9500.a:  "Xin hướng về Tịnh Độ thiêng liêng."

 # tgp_japan_establish_soryo_administration_decision
 
  tgp_japan_decision.9603.t:  "Thiết Lập Chính Quyền Sōryō: Hiệu Triệu"
  tgp_japan_decision.9603.desc:  "Dã tâm tham vọng của [daijo_daijin.GetTitledFirstName] quả không có giới hạn: [daijo_daijin.GetSheHe] nay công khai thúc đẩy cải cách nhằm củng cố quyền lực cho gia tộc [daijo_daijin.GetHerHis] cùng các đồng minh.\n\nDẫu chúng ta có đồng thuận hay bất đồng về việc trị quốc Nhật Bản, việc gia tộc [daijo_daijin.GetHouse.GetBaseNameNoTooltip] tiến tới vị thế thống trị như vậy cũng đủ khiến toàn cục phải dè chừng."
  tgp_japan_decision.9603.leader: "\n\n[leader.GetTitledFirstName] đã nổi lên như một thủ lĩnh của phe kháng chiến, và đang tập hợp quân đội của [leader.GetHerHis] ngay lúc này."
  tgp_japan_decision.9603.a:  "Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] quyết không dung thứ việc này."
  tgp_japan_decision.9603.a.bloc:  "[ROOT.Char.GetConfederation.GetName] quyết không dung thứ việc này."
  tgp_japan_decision.9603.b:  "Đây không phải cuộc chiến của ta."
  tgp_japan_decision.9603.a.tt:  "Toàn bộ thành viên của [THIS.Char.GetConfederation.GetName|V] sẽ tham chiến [war|E]"
  tgp_japan_decision.9605.t:  "Thiết Lập Chính Quyền Sōryō: Hiệu Triệu Binh Đao"
  tgp_japan_decision.9605.desc: "Khi ta thúc đẩy cải cách và ý định trở nên rõ ràng, những kẻ phản bội tập hợp lại. [leader.GetTitledFirstName] của [leader.GetHouse.GetBaseNameNoTooltip] đã nổi lên như một thủ lĩnh của sự phản bội này, và đang tập hợp một đội quân ngay lúc này.\n\nĐiều đó không quan trọng, chúng ta, Gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip], sẽ gặp họ trên chiến trường, và chúng ta sẽ chiến thắng."
  tgp_japan_decision.9605.peace:  "Khi ta thúc đẩy cải cách và ý định dần lộ rõ, chỉ có im lặng đáp lại — phản ứng dữ dội như dự đoán hoàn toàn không xuất hiện. Có lẽ ta đã đánh giá thấp lòng tin của thiên hạ vào gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nKhông còn phản nghịch cần xử lý, Nhật Bản cuối cùng có thể hưng thịnh dưới kỷ nguyên trị vì nhân đức của gia tộc [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
  tgp_japan_decision.9605.a:  "Lũ phản loạn này sẽ bị nghiền nát."
  tgp_japan_decision.9605.b:  "Thiên hạ đã lĩnh ngộ."
  tgp_japan_decision.9606.t:  "Thiết Lập Chính Quyền Sōryō: Bá Quyền [daijo_daijin.GetHouse.GetBaseNameNoTooltip]"
  tgp_japan_decision.9606.desc:  "Cuối cùng, quân phản loạn ngu muội đã bị đánh bại. Thủ lĩnh của chúng, [leader.GetTitledFirstName], nay bị giải đến trước mặt ta trong xiềng xích, không ai còn nghi ngờ rằng hòa bình đã nằm trong tầm tay.\n\nMọi kẻ chống đối đã bị dập tắt, Nhật Bản rốt cuộc có thể hưng thịnh dưới kỷ nguyên trị vì nhân đức của gia tộc [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
  tgp_japan_decision.9606.a:  "Điều tất yếu, và cũng là điều cần thiết."
  tgp_japan_decision.9607.desc:  "Kinh động kinh thành, [daijo_daijin.GetTitledFirstName] đã đại thắng trước những kẻ chống đối cải cách của [daijo_daijin.GetHerHis], nay bị gọi là phản loạn, đưa thiên hạ bước vào kỷ nguyên mới dưới quyền thống trị của gia tộc [daijo_daijin.GetHouse.GetBaseNameNoTooltip].\n\n"
  tgp_japan_decision.9607.desc.other:  "Hy vọng gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] có thể tìm được vị thế xứng đáng trong trật tự mới này."
  tgp_japan_decision.9607.desc.winner:  "Sự tận trung của chúng ta đối với gia tộc [daijo_daijin.GetHouse.GetBaseNameNoTooltip] trong đại nghĩa này ắt sẽ được ban thưởng."
  tgp_japan_decision.9607.desc.loser:  "Đây là ngày u ám cho [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] và gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip]..."
  tgp_japan_decision.9607.a:  "Còn nhiều điều cần suy ngẫm."

 # tgp_japan_restore_japanese_monarchy_decision
  tgp_japan_decision.9901.t:  "Thiên Hoàng Yamato Phục Hưng"
  tgp_japan_decision.9901.desc:  "Thiên Hoàng hiển uy, Ngai Hoa Cúc trở về với người thừa kế chính thống. Quyền uy này không chỉ là danh vị, mà còn là biểu tượng của mối liên kết cổ xưa giữa dòng Yamato và mảnh đất này."
  tgp_japan_decision.9901.a:  "Thần hạ vinh hạnh được phò tá [scion.GetHerHim]."
  tgp_japan_decision.9901.a.scion:  "Cuối cùng cũng đến ngày này."
  tgp_japan_decision.9902.desc:  "Huyết mạch thiêng liêng Yamato một lần nữa hiển hiện nơi Hoàng cung. Hậu duệ của Amaterasu, [scion.GetName], nay đứng lên kế thừa, như thuở xa xưa.\n\nVới sự trở lại này, thiên hạ có thể một lần nữa hưng thịnh dưới ánh sáng rực rỡ của Ngai Hoa Cúc."
  tgp_japan_decision.9902.a:  "Thiên Hoàng vạn tuế!"
 # tgp_restore_japanese_government_decision
  tgp_japan_decision.9911.t:  "Phục Hưng Quan Chế Ritsuryō"
  tgp_japan_decision.9911.desc:  "Đã đến lúc thiết lập một trật tự mới — không phải bằng bạo lực thô bỉ, mà bằng bút mực.\n\nChỉ có chính quyền quy củ mới có thể thi hành công lý, trong khi võ nhân thường bẻ cong luật pháp theo ý mình. Dưới quyền ta, pháp luật sẽ minh bạch, công bằng và kiên định — như tổ tiên đã định."
  tgp_japan_decision.9911.rebel: "\n\nĐối lập với con đường của những người tiền nhiệm, [rebel.GetName] chống lại quyết định của ta. Với quân đội của [rebel.GetHerHis] đã được huy động, khao khát quan liêu của ta đang bị thách thức."
  tgp_japan_decision.9911.a:  "Cổ pháp vẫn là tối thượng."
  tgp_japan_decision.9912.desc:  "[kampaku.GetName] đã quay về con đường tổ tiên, đề xuất thiết lập quan chế thay cho quyền lực võ sĩ. [kampaku.GetSheHe|U] mong muốn khôi phục trật tự, đưa quyền lực trở lại triều đình và hoàng thất thay vì các gia tộc địa phương."
  tgp_japan_decision.9912.rebel: "\n\nTuy nhiên, những thay đổi lớn như vậy không đến mà không có xung đột. [rebel.GetName] đã nổi dậy chống lại [kampaku.GetFirstNameNoTooltip] để phản đối, với một số người đi theo tư tưởng của [rebel.GetHerHis]..."
  tgp_japan_decision.9912.b:  "Ta sẽ không từ bỏ quyền lực!"
  tgp_japan_decision.9913.desc: "[actor.GetTitledFirstName] là một kẻ ngốc đặt tham vọng của [actor.GetHerHis] lên trên lợi ích của đế chế. Ta sẽ không đứng nhìn trong khi lãnh chúa của chúng ta lạm dụng các chư hầu trung thành của [actor.GetHerHis]. Ta khuyên ngài hãy tham gia cùng ta trong cuộc chiến để hạ bệ tên bạo chúa này."
  tgp_japan_decision.9913.a:  "Ngài sẽ không đơn độc!"
  tgp_japan_decision.9913.b:  "Ngươi là kẻ phản nghịch!"

#tgp_japan_assert_regional_dominion_government_decision
  tgp_japan_decision.9960.t:  "Khẳng định Quyền Thống Trị Vùng"
  tgp_japan_decision.9960.intro:  "Ta sẽ thống nhất [title_scope.GetNameNoTier] dưới cờ hiệu của ta. Vùng đất này sẽ trở thành pháo đài của ổn định, và là tấm gương cho đế quốc đang chìm trong hỗn loạn."
  tgp_japan_decision.9960.agree:  "\n\nCác lãnh chúa địa phương đã thể hiện trí tuệ sáng suốt..."
  tgp_japan_decision.9960.partial_war:  "\n\nDẫu phần lớn lãnh chúa đã thuận theo, vẫn có một số kẻ ngu muội tụ về dưới cờ của [main_defender.GetName], thay vì cúi mình trước quyền thống trị của ta."
  tgp_japan_decision.9960.full_war:  "\n\nCác lãnh chúa địa phương khao khát chia rẽ! Dẫu ngu xuẩn, chúng vẫn tụ về dưới cờ của [main_defender.GetName] thay vì quy phục ta."
  tgp_japan_decision.9960.a:  "...Có lẽ chúng sẽ lĩnh hội được đạo lý ở kiếp sau."
  tgp_japan_decision.9960.b:  "...và tất cả đều cúi mình dưới quyền thống trị của ta."
  tgp_bloc_members_join_war_effect_tt:  "Nếu ngài lãnh đạo một [bloc|E], các thành viên của nó sẽ tham chiến cùng ngài"
  tgp_japan_assert_regional_dominion_kampaku_crime_effect:  "@warning_icon! #X [ceremonial_regent|E] theo [ritsuryo|E] sẽ coi hành động này là một [crime_i|E][crime|E]#!"

  tgp_japan_decision.9961.t:  "[title_scope.GetNameNoTierNoTooltip] Dưới Một Lá Cờ"
  tgp_japan_decision.9961.desc:  "Một ngày rực rỡ cho [title_scope.GetNameNoTier]! Có kẻ chậm hiểu đạo lý trong sự cai trị của ta, nhưng mưa tên và biển lửa chính là bậc thầy nghiêm khắc nhất.\n\nChẳng bao lâu nữa, tranh chấp này sẽ bị lãng quên. Máu của kẻ ngã xuống sẽ nuôi dưỡng lúa cho con cháu mai sau. Mong rằng sự thống nhất này sẽ vẽ nên con đường cho toàn đế quốc."
  tgp_japan_decision.9961.a:  "Lá cờ của ta sẽ tung bay nơi nào tiếp theo?"

  tgp_japan_decision.9962.t:  "Cờ Hiệu Của Ta Tan Vỡ"
  tgp_japan_decision.9962.desc:  "Chính nghĩa thuộc về ta. Lẽ ra không nên có chiến trận, nhưng chiến trận vẫn nổ ra. Trong thất bại, đạo lý của ta bị phớt lờ. Hỗn loạn ngự trị. [title_scope.GetName] — tấm gương phản chiếu của đế quốc.\n\nNhững kẻ khao khát hòa hợp phải chịu khổ, còn kẻ tâm trí lệch lạc lại được hưởng thành công."
  tgp_japan_decision.9962.a:  "Giờ phải làm sao?"

  tgp_japan_decision.9963.opening:  "[ROOT.Char.GetName], cờ hiệu của ta đang triệu gọi,"
  tgp_japan_decision.9963.desc:  "Ngài đã chứng kiến những xung đột đang tàn phá đế quốc. Ta, [super_soryo.GetName], sẽ thống nhất [title_scope.GetName] và dựng nên một pháo đài của hòa bình và ổn định. Hãy quy phục dưới cờ ta, hoặc cùng lũ thiển cận chìm trong sự ngu muội của chúng."
  tgp_japan_decision.9963.a:  "Ta quy phục"
  tgp_japan_decision.9963.b:  "Chiến tranh!"
  tgp_japan_decision.9963.a.tt:  "Nếu [super_soryo.GetShortUIName] chiến thắng trong [super_soryo_war.GetName], [super_soryo.GetSheHe] sẽ nắm giữ [title_scope.GetName] và ngài sẽ trở thành [vassal|E] của [super_soryo.GetHerHis]"
  super_soryo_war_no_holder_custom_tooltip:  "Khởi động [domination_war|E] chống lại [main_defender.GetShortUIName] để tranh đoạt [title_scope.GetName]\n\t$BULLET$Mọi [de_jure|E] [county|E] [holder|E] thuộc [title_scope.GetName] sẽ tham gia phe phòng thủ cùng [main_defender.GetShortUIName] #weak (@soldier_icon![super_soryo_war_current_enemy_strength|N0])#!"
  super_soryo_potential_peaceful:  "@alert_icon!Để khiến toàn bộ [de_jure|E] [county|E] [holder|E] của [title_scope.GetName] trở thành [vassal|E] của ngài mà không cần chiến đấu:\n$EFFECT_LIST_BULLET$[prestige_level|E] của ngài đạt [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[legitimacy_level|E] của ngài ≥ #V 3#!\n$EFFECT_LIST_BULLET$Sở hữu [dread_i][dread|E] cao\n$EFFECT_LIST_BULLET$Sức mạnh quân sự @soldier_icon! áp đảo#!"
  super_soryo_reward_peaceful:  "Mọi [de_jure|E] [county|E] [holder|E] của [title_scope.GetName] sẽ trở thành [vassal|E] của ngài"
