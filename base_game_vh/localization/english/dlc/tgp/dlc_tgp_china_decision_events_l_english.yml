l_english:
 ##################################################
 # CHINA CHILD EXAMINATION DECISION EVENTS 
 ##################################################
 # SUCCESS CHANCE VALUES
  exam_success_chance.tgp_local_exam_initial_success: "Khởi đầu mạnh mẽ tại kỳ thi"
  exam_success_chance.tgp_local_exam_impressed_examiner: "Gây ấn tượng với giám khảo"
  exam_success_chance.tgp_local_exam_strong_finish: "Kết thúc mạnh mẽ tại kỳ thi"

  examiner_takes_bribes_tt: "Ngài có lựa chọn này do các đặc điểm của giám khảo"

  tgp_china_decision.1000.t: "Kỳ thi Đồng tử: Bắt Đầu"
  tgp_china_decision.1000.desc_new: "Ta đã đến kỳ thi đầu tiên trong đời. Danh tiếng của gia đình ta phụ thuộc vào thành tích của ta hôm nay. Trong những đại sảnh này, nơi tràn đầy tri thức chân chính, ta cảm thấy như thể tổ tiên đang dõi theo, chờ xem ta sẽ trở thành người như thế nào."
  tgp_china_decision.1000.desc_returning: "Ta một lần nữa có mặt tại phòng học địa phương, chờ đợi phán xét của những học giả uyên bác của triều đình. Trong học đường uy nghi này, sức nặng của từng cuộn sách và từng mảnh tri thức chứa trong đó đều đè nặng lên vai ta."
  tgp_china_decision.1000.desc_outro: "\n\nGiám khảo [examiner.GetTitledFirstName] sẽ yêu cầu ta đọc thuộc các đoạn từ kinh điển. Ta đã luyện tập những văn bản này đến mức có thể nhìn thấy từng ký tự ngay cả khi nhắm mắt.\n\nCuối cùng, cũng đến lượt ta bước lên bục."
  tgp_china_decision.1000.a: "Ta sẽ dốc toàn lực!"
  tgp_china_decision.1000.b: "Chỉ làm vừa đủ."

  tgp_china_decision.1001.t_success: "Kỳ thi Đồng tử: Thành Công!"
  tgp_china_decision.1001.t_fail: "Kỳ thi Đồng tử: Thất Bại!"
  tgp_china_decision.1001.desc_success: "Một sự bình tĩnh lan tỏa trong ta khi ta đọc thuộc từng lời, phát âm chúng với sự rõ ràng hoàn hảo. Mọi thứ dường như thật dễ dàng."
  tgp_china_decision.1001.desc_safe: "Ta nhìn xuống chân mình, không dám liếc nhìn giám khảo dù chỉ một lần vì sợ làm phật ý [examiner.GetHerHim]. Bài đọc của ta rất ngắn, vì ta vội vàng hoàn thành nó để che giấu bất kỳ sai sót nào."
  tgp_china_decision.1001.desc_fail: "Mặt ta nóng bừng khi nhận ra mình đã mất dấu đoạn văn. Ta nhìn lên giám khảo và ánh nhìn khắc nghiệt của [examiner.GetHerHis] khiến ta nghẹn lời."
  tgp_china_decision.1001.desc_outro: "\n\nGiám khảo lập tức đưa ra một đoạn khác để ta tiếp tục, không cho ta thời gian lấy lại bình tĩnh."
  tgp_china_decision.1001.a: "Ta cần làm điều này cho #EMP đúng#!."
  tgp_china_decision.1001.b: "Ta sẽ không gắng sức."

  tgp_china_decision.1002.t_success: "Kỳ thi Đồng tử: Thành Công!"
  tgp_china_decision.1002.t_fail: "Kỳ thi Đồng tử: Thất Bại!"
  tgp_china_decision.1002.desc_success: "Những lời nói tuôn ra tự nhiên từ môi ta, và trong khoảnh khắc ta tưởng như thấy khóe miệng của giám khảo khẽ động. [examiner.GetSheHe] vừa mỉm cười sao? Không thể nào!"
  tgp_china_decision.1002.desc_safe: "Ta đọc càng ít càng tốt để tránh mắc lỗi không cần thiết. Khi liếc nhìn giám khảo, ta nhận ra [examiner.GetSheHe] dường như đang chán nản với màn thể hiện cứng nhắc của ta."
  tgp_china_decision.1002.desc_fail: "Lòng bàn tay ta ướt đẫm mồ hôi khi bắt đầu vấp váp trong lời nói. Ta không thể nhớ nổi dù chỉ một câu! Giá như mặt đất có thể nuốt chửng ta."
  tgp_china_decision.1002.desc_outro: "\n\nMột lần nữa, ta không được nghỉ ngơi. Giám khảo nhìn chằm chằm vào ta bằng ánh mắt của [examiner.GetHerHis] và yêu cầu phần tiếp theo."
  tgp_china_decision.1002.a: "Mọi thứ đều phụ thuộc vào lần này!"
  tgp_china_decision.1002.b: "Giữ bình tĩnh..."

  tgp_china_decision.1005.t: "Công Bố Bảng Danh"
  tgp_china_decision.1005.desc: "Ta kết thúc kỳ thi với "
  tgp_china_decision.1005.desc.success: "tinh thần phấn chấn."
  tgp_china_decision.1005.desc.safe: "một tiếng thở phào nhẹ nhõm."
  tgp_china_decision.1005.desc.failure: "tâm trạng nặng nề."
  tgp_china_decision.1005.desc.segway: "\n\nKhi ta bước trở lại hàng thí sinh, ta nhận ra những đứa trẻ xung quanh đều là người lạ. Sẽ thật tốt nếu có ít nhất một gương mặt quen thuộc trong lúc chờ kết quả, để việc chờ đợi bớt khó chịu.\n\nMãi sau đó, bảng danh sách được công bố và ta vội vàng chạy tới bảng thông báo để thấy rằng ta"
  tgp_china_decision.1005.desc.high_score: "đạt điểm cực cao trong kỳ thi! Gia đình ta chắc chắn sẽ tự hào."
  tgp_china_decision.1005.desc.good_score: "đạt điểm tốt trong kỳ thi!"
  tgp_china_decision.1005.desc.passing_score: "đã vượt qua kỳ thi."
  tgp_china_decision.1005.desc.failing: "đã trượt kỳ thi."
  tgp_china_decision.1005.a_success: "Ta sẽ nỗ lực hơn nữa vào lần sau."
  tgp_china_decision.1005.a: "Ta chỉ mong làm rạng danh cha mẹ."
  tgp_china_decision.1005.b: "Những người thầy giỏi của ta xứng đáng nhận mọi công lao!"
  tgp_china_decision.1005.a_failure: "Ta sẽ quay lại."
  tgp_china_decision.1005.b_passing: "Ta hài lòng với kết quả này."
  tgp_china_decision.1005.b_failed: "Thật nhục nhã."

  provincial_exam_close_family_passed: "[GetPlayer.Custom2('RelationToMeShort', ROOT.Char)|U] Đã Vượt Qua Kỳ Thi Hương"
  msg_provincial_exam_close_family_passed_desc: "[ROOT.Char.GetShortUIName|U] đã hoàn thành thành công kỳ thi cấp thấp tại [ROOT.Char.GetCurrentLocation.GetName]"
  provincial_exam_close_family_failed: "[GetPlayer.Custom2('RelationToMeShort', ROOT.Char)|U] Trượt Kỳ Thi Hương"
  msg_provincial_exam_close_family_failed_desc: "[ROOT.Char.GetShortUIName|U] đã cố gắng và thất bại trong việc chứng minh bản thân tại kỳ thi cấp thấp hơn ở [ROOT.Char.GetCurrentLocation.GetName]"
