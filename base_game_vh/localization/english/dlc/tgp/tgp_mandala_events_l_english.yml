l_english:
  aspect_upgrade_event_header: "Khía Cạnh [ROOT.Char.Custom('GetAspectNoun')|U]:"
  tgp_east_asia_mandala_events.1000.t: "$aspect_upgrade_event_header$ Thăng Cấp"
  tgp_east_asia_mandala_events.1000.t.final: "$aspect_upgrade_event_header$ Siêu Thăng"
  tgp_east_asia_mandala_events.1000.desc.02: "Với niềm vui tràn đầy, các điệu múa và nghi lễ của [ROOT.Char.Custom('GetAspectNoun')], ta đã mang lại niềm tự hào cho gia tộc [ROOT.Char.GetHouse.GetBaseName] bằng việc thăng lên bước kế tiếp của khía cạnh [ROOT.Char.Custom('GetAspectNoun')].\n\nNhững rung động từ quyền năng #EMP của chúng ta#! và những hành động thần thánh thu hút thêm nhiều người theo dõi từng ngày.\n\nTa cho phép mình thưởng thức khoảnh khắc này, quan sát màn trình diễn của những người dự lễ trước mắt."
  tgp_east_asia_mandala_events.1000.desc.03.outro: "Ta ngả người ra và theo dõi các lễ vật tượng trưng cùng những nghệ sĩ múa vinh danh ta. #EMP Quyền lực của chúng ta tăng lên.#!"
  tgp_east_asia_mandala_events.1000.desc.creation_03: "Một bữa tiệc để tôn vinh khía cạnh sáng tạo — một cảnh tượng đầy màu sắc, âm nhạc và điệu múa — được tổ chức nhân dịp gia tộc [ROOT.Char.GetHouse.GetBaseName] thăng lên bước trung cấp của khía cạnh sáng tạo.\n\nChúng ta chứng minh bản thân thần thánh, từng hành động một, thu hút vô số tín đồ.\n\nChính xác — #EMP ta#! đang thu hút vô số tín đồ. Và họ tin vào #EMP ta#!."
  tgp_east_asia_mandala_events.1000.desc.creation_04: "Một bữa tiệc náo nhiệt — còn cách nào khác để mừng một khía cạnh sáng tạo gần như hoàn hảo? Những vũ công, các nghi lễ, những khoảnh khắc lộ da thịt, tất cả ca ngợi sự sáng tạo và bước thăng tiến thêm của gia tộc [ROOT.Char.GetHouse.GetBaseName].\n\nSố lượng tín đồ đông đảo củng cố vị thế không thể lay chuyển của chúng ta, khẳng định chỗ đứng trên thế giới.\n\nTa lấy một ít [ROOT.Char.Custom('GetAspectNoun')] ngon lành từ bàn gần đó và thưởng thức trong khi quan sát buổi lễ."
  tgp_east_asia_mandala_events.1000.desc.05.intro: "Cuối cùng, hành trình của gia tộc [ROOT.Char.GetHouse.GetBaseName] và các hậu duệ thần thánh của họ đã đến hồi hoàn tất."
  tgp_east_asia_mandala_events.1000.desc.creation_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nGiờ đây không còn nghi ngờ gì nữa rằng các chị em và anh em của [ROOT.Char.GetHouse.GetBaseNameNoTooltip] mang dấu ấn và phẩm chất của khía cạnh sáng tạo, thể hiện công việc của Người Tạo Hóa trên trần gian.\n\nVới #EMP ta#! là tổng thể [ROOT.Char.GetHerHis|U], tất nhiên.\n\nTa uống thêm một chén [ROOT.Char.Custom('RegionalDrink')], đánh dấu khởi đầu của nhiều tuần lễ ăn mừng."
  tgp_east_asia_mandala_events.1000.desc.serenity_03: "Một lễ kỷ niệm được tổ chức cẩn thận; gia tộc [ROOT.Char.GetHouse.GetBaseName] thăng lên bước trung cấp của khía cạnh tĩnh lặng không tiếc chi phí.\n\nNhững người theo con đường hòa bình của chúng ta ngày càng nhiều, khi mọi người nhận thấy lợi ích từ phương pháp của chúng ta.\n\nTa trân trọng cơ hội biến thế giới này thành nơi tốt đẹp hơn. Nơi bình yên hơn."
  tgp_east_asia_mandala_events.1000.desc.serenity_04: "Một lễ hội tráng lệ bắt đầu bằng thiền tập cộng đồng — hàng ngàn đầu cúi trong thanh tĩnh thực sự làm tim ta vui sướng. Còn gì tốt hơn để vinh danh gia tộc [ROOT.Char.GetHouse.GetBaseName] đang gần đạt khía cạnh tĩnh lặng hoàn hảo?\n\nSố lượng tín đồ đông đảo xác nhận vị thế của chúng ta trong thế giới này. Khát khao hòa bình và yên tĩnh. Để được chấp nhận và đồng thuận.\n\nTa lại cúi đầu trong yên lặng, chiêm nghiệm về điều này."
  tgp_east_asia_mandala_events.1000.desc.serenity_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nKẻ thù trở thành bạn. Hòa bình và thịnh vượng lan tỏa khắp vương quốc. Trí tuệ và sự tĩnh lặng mà chị em và anh em gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] truyền đạt đã để lại dấu ấn lâu dài trên [ROOT.Char.GetPrimaryTitle.GetBaseName].\n\nMột lễ kỷ niệm thật sự yên bình, xứng với tổng thể khía cạnh tĩnh lặng.\n\nTa ân cần cúi đầu đáp lại những lời cầu nguyện và chúc phúc duyên dáng của họ."
  tgp_east_asia_mandala_events.1000.desc.destruction_03: "Tiếng động chói tai khi quân lính gõ vũ khí vào khiên, thu hút sự chú ý về việc gia tộc [ROOT.Char.GetHouse.GetBaseName] thăng lên bước trung cấp của khía cạnh hủy diệt.\n\nTin tức về di sản của chúng ta lan truyền nhanh chóng và số tín đồ tăng mạnh.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
  tgp_east_asia_mandala_events.1000.desc.destruction_04: "#EMP DẬP, DẬP.#! Không âm thanh nào vang lên ngoài những bước dậm vang dội của binh lính [ROOT.Char.GetPrimaryTitle.GetBaseName] trong nghi lễ mừng, mô phỏng điệu múa hủy diệt khi gia tộc [ROOT.Char.GetHouse.GetBaseName] gần đạt siêu thăng hoàn hảo.\n\nTín đồ háo hức tham gia và phục vụ dưới khía cạnh hủy diệt thật sự.\n\nTa nhếch môi và nhẹ nhàng vuốt lưỡi kiếm bằng đá mài trong khi quan sát buổi lễ.\n\n#EMP DẬP, DẬP.#!"
  tgp_east_asia_mandala_events.1000.desc.destruction_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nTrái đất như rung chuyển khi quân lính thề trung thành của [ROOT.Char.GetPrimaryTitle.GetBaseName] thực hiện những bước dậm, những lời tụng và nghi lễ đáng sợ, phục vụ chị em và anh em gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nHọ quỳ trước ta, thần của họ, trước khi tiếp tục nghi lễ.\n\nTa vô tư vuốt một chiếc sọ, tặng vật nhận được trong một nghi lễ, khi tựa lưng trên ngai."
  tgp_east_asia_mandala_events.1000.desc.trickery_03: "Ta đã thành công mở rộng di sản của gia tộc [ROOT.Char.GetHouse.GetBaseName] về các vị thần láu lỉnh, và các nghi lễ mừng cũng tràn đầy niềm vui.\n\nTừng kẻ thù của gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip] một cách bí ẩn bị loại ra hoặc gia nhập chúng ta làm tín đồ.\n\n$tgp_east_asia_mandala_events.1000.desc.03.outro$"
  tgp_east_asia_mandala_events.1000.desc.trickery_04: "Lễ vật, quá nhiều lễ vật để làm vừa lòng gia tộc [ROOT.Char.GetHouse.GetBaseName], giờ đang trên bờ của khía cạnh láu lỉnh hoàn hảo.\n\nVàng, lông thú, gia vị. Vỏ sò, động vật kỳ lạ. Tín đồ của chúng ta biết cách làm vừa lòng. Hay họ không?\n\nQuyết định thuộc về #EMP ta#!, gieo mạng lưới bóng tối lên bất cứ ai chống đối.\n\nTa cười khúc khích một cách thầm lặng."
  tgp_east_asia_mandala_events.1000.desc.trickery_05: "$tgp_east_asia_mandala_events.1000.desc.05.intro$\n\nMọi thứ bề ngoài đều vui vẻ và bình thường, nhưng tất cả biết rằng chỉ một sai lầm nhỏ hay một lỗi đạo đức sẽ dẫn đến cuộc viếng thăm từ một trong các vị thần bất thường của [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nHọ đều tuyệt vọng giữ lấy ân sủng thần thánh và tuân theo #EMP dòng của ta#!.\n\nTa quan sát đám đông, lén suy tính ai sẽ xứng đáng được chú ý tiếp theo."
  tgp_east_asia_mandala_events.1000.a: "Mọi thứ đều như nó nên có."

  mandala_descendant_from_aspect_of_creation.tt: "Tất cả [children|E] của ngài"
  mandala_descendant_from_aspect_of_creation_modifier: "Hậu Duệ Sáng Tạo"
  mandala_descendant_from_aspect_of_creation_modifier_desc: "Nhân vật này là con của một Khía Cạnh Sáng Tạo đã thăng cấp."

  mandala_aspect_of_serenity_devotion.tt: "Nhận #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! [piety_experience|E] mỗi năm không có [war|E] #WEAK (Hiện tại #P [THIS.Char.MakeScope.ScriptValue('num_years_of_peace_devotion_payout')]#! [piety_experience|E])#!"

  mandala_forged_from_aspect_of_destruction.tt: "Tất cả [THIS.Char.Custom('KnightCulturePlural')] của ngài"
  mandala_forged_from_aspect_of_destruction_modifier: "Rèn từ Hủy Diệt"
  mandala_forged_from_aspect_of_destruction_modifier_desc: "Nhân vật này từng phục vụ như một hiệp sĩ dưới Khía Cạnh Hủy Diệt đã thăng cấp."

  mandala_aspect_of_trickery_devotion.tt: "Nhận #P [EmptyScope.ScriptValue('num_years_of_peace_devotion')]#! [piety_experience|E] cho mỗi [scheme|E] thành công cho tới thời điểm này #WEAK (Hiện tại #P [THIS.Char.MakeScope.ScriptValue('num_successful_schemes_devotion_payout')]#! [piety_experience|E])#!"
  mandala_ascended_in_aspect_of_trickery_modifier: "Kẻ Lên Khía Cạnh Láu Lỉnh"
  mandala_ascended_in_aspect_of_trickery_modifier_desc: "Nhân vật này đã thăng cấp như một Khía Cạnh Láu Lỉnh."


  busy_in_mandala_succession: "Ngài đang bận rộn trong một [mandala|E] kế thừa"
  mandala_succession_header: "Kế Thừa Mandala:"

  tgp_east_asia_mandala_events.8497.t.lose_by_default: "Thử Thách Kế Thừa Mandala Không Tiến Hành Được"
  tgp_east_asia_mandala_events.8497.tt.lose_by_default: "$tgp_east_asia_mandala_events.8499.a.tt.imprisoned$"

  tgp_east_asia_mandala_events.8499.t: "$mandala_succession_header$ các Thử Thách"
  tgp_east_asia_mandala_events.8499.intro.imprisoned: "Tin tức đến với Ta, sâu trong ngục của [ROOT.Char.GetImprisonedBy.GetTitledFirstName]. [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] của Ta, [deceased_mandala_ruler.GetFirstName], đã rời bỏ cõi đời này, để lại Ta lãnh đạo vương quốc."
  tgp_east_asia_mandala_events.8499.intro.recent_adult.imprisoned: "Cuối cùng Ta cũng đến tuổi trưởng thành; thời khắc của Ta để tham gia thử thách và chứng minh cho vương quốc thấy Ta xứng đáng kế vị [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName]."
  tgp_east_asia_mandala_events.8499.desc.imprisoned: "\n\nNhưng làm sao Ta có thể làm được khi Ta đang ngồi đây, trong ngục tối, gần như #EMP thần thánh#!? Bao phủ trong bụi bẩn, bị đối xử như loài thú.\n\nTa thề sẽ trả thù khi ra khỏi đây. Ta sẽ #EMP để cơn thịnh nộ của mình giáng xuống kẻ thù#!."
  tgp_east_asia_mandala_events.8499.desc.recent_adult: "Thời khắc đã đến! Cuối cùng là lúc Ta kế vị [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], bằng cách tham gia các thử thách.\n\nThể hiện sự xuất sắc trong mọi lĩnh vực, màn trình diễn và sự đón nhận sẽ quyết định niềm tin mà thần dân dành cho Ta với tư cách là hiện thân của [ROOT.Char.Custom('GetAspectNoun')], tiến về phía trước.\n\nTa #EMP sẽ#! kế vị [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )]!"
  tgp_east_asia_mandala_events.8499.desc.was_traveling: "Chưa kịp bụi đất lắng xuống thì Ta đã được đưa vào các phòng, bồn tắm đã chuẩn bị, trang phục thay bằng của một [ROOT.Char.GetTitleAsNameNoTooltip] đúng mực.\n\nRùng mình vì sự đối xử thô bạo và không khí lạnh đột ngột, Ta chuẩn bị tinh thần cho các thử thách đang chờ đợi.\n\nCơ hội để chứng minh Ta là người kế vị xứng đáng của [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], hiện thân của khía cạnh [ROOT.Char.Custom('GetAspectNoun')]. Đã đến lúc."
  tgp_east_asia_mandala_events.8499.desc: "[ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName], không còn nữa. [deceased_mandala_ruler.GetSheHe|U] đã rời khỏi cõi đời này, để Ta bước lên, hiện thân khía cạnh [ROOT.Char.Custom('GetAspectNoun')] và lãnh đạo vương quốc, ghi danh vào sử sách.\n\nTa sẽ tham gia các thử thách, chứng minh mình thần thánh và toàn năng bằng cách xuất sắc trong nhiều khía cạnh.\n\n... một luồng lạnh chạy dọc sống lưng khi Ta thoáng nghĩ đến phương án khác."
  tgp_east_asia_mandala_events.8499.a: "Ta đã sẵn sàng."
  tgp_east_asia_mandala_events.8499.a.imprisoned: "Điều này Ta thề."
  tgp_east_asia_mandala_events.8499.a.flavor.imprisoned: "Không phải chuyện này đã được sắp xếp..."
  tgp_east_asia_mandala_events.8499.a.tt.imprisoned: "Ngài thất bại trong Thử Thách [mandala_succession_succession|E] vì không xuất hiện"
  tgp_east_asia_mandala_events.8499.a.tt.trials: "Thử Thách [mandala_succession_succession|E] đầu tiên bắt đầu"

  mandala_divine_retribution_modifier: "Trừng Phạt Thần Thánh"
  mandala_divine_retribution_modifier_desc: "Nhân vật này đang dâng đời mình để đánh bại kẻ thù."

  tgp_east_asia_mandala_events.8500.t: "$mandala_succession_header$ Mất Đầu"
  tgp_east_asia_mandala_events.8500.desc: "Chúng ta đang ở giữa các nghi lễ kiến tạo, ăn mừng sự đăng cơ của ta. Ta hòa mình vào đám đông, mỉm cười nhân từ với các tín đồ khi họ bước tới dâng lễ vật.\n\nMột đứa trẻ nhỏ từ trong đám đông chạy ra, vòng tay ôm lấy eo ta. Đứa trẻ nhìn lên và hỏi: \"[ROOT.Char.GetTitleAsNameNoTooltip|U]... chuyện gì #EMP đã#! xảy ra với cái đầu thứ năm của ngài vậy?\"\n\nNgười chăm sóc đứa trẻ trông có vẻ kinh hãi trước sự xấc xược ấy, nhưng ta nhận thấy tất cả mọi người trong phòng đều chấn động, háo hức chờ đợi câu trả lời của ta."
  tgp_east_asia_mandala_events.8500.dynasty.override: ""Các thầy của ngươi sẽ trả lời được mà.""
  tgp_east_asia_mandala_events.8500.a: ""Tội lỗi của ta và ghen tị của người khác, con ạ.""
  tgp_east_asia_mandala_events.8500.a.final_aspect: "Ngài chưa đạt cấp cuối cùng của [aspect_of_creation|E]"
  tgp_east_asia_mandala_events.8500.success.tt: "Ngài vượt qua Thử Thách [stewardship|E] [mandala_succession_succession|E]"
  tgp_east_asia_mandala_events.8500.b: ""À, để ta kể cho con nghe..."""
  tgp_east_asia_mandala_events.8500.b.flavor: "Ta #EMP khá#! chắc là chuyện đã xảy ra như thế này?"
  tgp_east_asia_mandala_events.8500.b.t.success: "Rất Thuyết Phục"
  tgp_east_asia_mandala_events.8500.b.tt.success: "Ngài thuyết phục được họ"
  tgp_east_asia_mandala_events.8500.b.t.failure: "Không ấn tượng"
  tgp_east_asia_mandala_events.8500.b.tt.failure: "Đám đông phát ra tiếng xì xào không tin"

  tgp_east_asia_mandala_events.8510.t: "$mandala_succession_header$ Yên Bình Như Hồ"
  tgp_east_asia_mandala_events.8510.desc: "Các quan viên quỳ thành hàng ngay ngắn, và tiếng tụng thấp được nghe khắp phòng trong nghi lễ đăng quang. Ta đi nhẹ xung quanh, chạm nhẹ lên trán vài người, cố gắng truyền sự bình yên.\n\nTrong lúc này, hai [dummy_gender.GetWomenMen] cãi nhau ầm ĩ bên ngoài về một mảnh đất.\n\nTiếng ồn khiến mọi người dần chú ý đến Ta, háo hức xem Ta giải quyết sự náo loạn này như thế nào."
  tgp_east_asia_mandala_events.8510.dynasty.override: ""Đây là nơi thiêng liêng, hãy kiềm chế.""
  tgp_east_asia_mandala_events.8510.a: ""Các ngươi chia đất #EMP và#! các ngươi chia sản lượng.""
  tgp_east_asia_mandala_events.8510.a.final_aspect: "Ngài chưa đạt cấp cuối cùng của [aspect_of_serenity|E]"
  tgp_east_asia_mandala_events.8510.success.tt: "Ngài vượt qua Thử Thách [diplomacy|E] [mandala_succession_succession|E]"
  tgp_east_asia_mandala_events.8510.b: ""Sao nếu chúng ta giải quyết #EMP theo cách này#!..."""
  tgp_east_asia_mandala_events.8510.b.flavor: "Sao con người nhỏ nhen thế..."
  tgp_east_asia_mandala_events.8510.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
  tgp_east_asia_mandala_events.8510.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
  tgp_east_asia_mandala_events.8510.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
  tgp_east_asia_mandala_events.8510.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$"

  tgp_east_asia_mandala_events.8520.t: "$mandala_succession_header$ Điệu Nhảy Hủy Diệt"
  tgp_east_asia_mandala_events.8520.desc: "Ngọn giáo của Ta bắt ánh sáng lập loè của đuốc, và đám đông im lặng chăm chú quan sát khuôn mặt phủ tro của Ta. Một biển hoa bao quanh Ta khi những chiếc vỏ ốc phát ra tiếng rung thấp.\n\nTa được mong đợi thực hiện điệu nhảy vũ trụ; điệu nhảy hủy diệt, biểu tượng cho tính nhị nguyên thần thánh. Hủy diệt cái cũ, tạo không gian cho cái mới nảy nở và phát triển.\n\nKhối đá hình trụ ở trung tâm khoảng trống tỏa ra làn khí mát dịu khi Ta tiến gần."
  tgp_east_asia_mandala_events.8520.dynasty.override: ""Sinh ra để làm điều này, đó là quyền của Ta.""
  tgp_east_asia_mandala_events.8520.a: "Ta có thể làm điều này ngay cả trong #EMP giấc ngủ#!"
  tgp_east_asia_mandala_events.8520.a.final_aspect: "Ngài chưa đạt cấp cuối cùng của [aspect_of_destruction|E]"
  tgp_east_asia_mandala_events.8520.success.tt: "Ngài vượt qua Thử Thách [martial|E] [mandala_succession_succession|E]"
  tgp_east_asia_mandala_events.8520.b: "Được rồi, thử xem sao..."
  tgp_east_asia_mandala_events.8520.b.flavor: "Một, hai, ờ... theo chiều ngang?"
  tgp_east_asia_mandala_events.8520.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
  tgp_east_asia_mandala_events.8520.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
  tgp_east_asia_mandala_events.8520.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
  tgp_east_asia_mandala_events.8520.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$"

  tgp_east_asia_mandala_events.8530.t: "$mandala_succession_header$ Ảo Ảnh Chân Thật"
  tgp_east_asia_mandala_events.8530.desc: "Đám đông tập trung ở đây để nhìn Ta. Để bị mê hoặc bởi #EMP Ta#!. Các nhóm thì thầm với nhau, và một chiếc chuông vang lên đâu đó, báo hiệu đã đến lúc.\n\nTa bước vào vòng tròn, cạnh khối đá hình trụ và đặt lòng bàn tay lên bề mặt mịn, mát lạnh.\n\nVô số gương mặt, già có, trẻ có, im lặng và quay về phía Ta khi Ta hắng giọng, chuẩn bị bài phát biểu:"
  tgp_east_asia_mandala_events.8530.dynasty.override: ""Hãy để Ta kể về những người đi trước Ta.""
  tgp_east_asia_mandala_events.8530.a.final_aspect: "Ngài chưa đạt cấp cuối cùng của [aspect_of_trickery|E]"
  tgp_east_asia_mandala_events.8530.success.tt: "Ngài vượt qua Thử Thách [intrigue|E] [mandala_succession_succession|E]"
  tgp_east_asia_mandala_events.8530.a: ""Hãy để Ta kể về ảo ảnh của tính nhị nguyên.""
  tgp_east_asia_mandala_events.8530.b: ""... nếu Ta nói với Ngài rằng lừa dối không #EMP thật#!"" 
  tgp_east_asia_mandala_events.8530.b.flavor: "Ít nhất đó là những gì Ta #EMP muốn#! họ nghĩ."
  tgp_east_asia_mandala_events.8530.b.t.success: "$tgp_east_asia_mandala_events.8500.b.t.success$"
  tgp_east_asia_mandala_events.8530.b.tt.success: "$tgp_east_asia_mandala_events.8500.b.tt.success$"
  tgp_east_asia_mandala_events.8530.b.t.failure: "$tgp_east_asia_mandala_events.8500.b.t.failure$"
  tgp_east_asia_mandala_events.8530.b.tt.failure: "$tgp_east_asia_mandala_events.8500.b.tt.failure$"

  tgp_east_asia_mandala_events.8550.t: "$mandala_succession_header$ Con Đường Phía Trước"
  tgp_east_asia_mandala_events.8550.t.failed: "$mandala_succession_header$ Không Có Con Đường Nào"
  tgp_east_asia_mandala_events.8550.desc.critical_success: "Tiếng reo hò vang khắp nơi. Đám đông phấn khích, và sự an tâm khi vị thần mới sống xứng đáng với [ROOT.Char.GetHerHis] người tiền nhiệm [deceased_mandala_ruler.GetFirstNamePossessive] thật rõ ràng.\n\nHoa được ném về phía Ta, mọi người hát, người khác vỗ tay hoặc giậm sàn trong sự hân hoan. Một bữa tiệc nhỏ tự phát được tổ chức và thần dân tiếp tục hô tên Ta và nâng cốc, kéo dài suốt đêm.\n\nTa đã làm tốt, và con đường phía trước rực rỡ. Ta mỉm cười kín đáo."
  tgp_east_asia_mandala_events.8550.desc.success: "Một tiếng thì thầm lặng lẽ lan khắp phòng, rồi một vài tiếng xì xào trung gian và sau đó vài tiếng reo hò nồng nhiệt khi Ta chứng minh mình là một vị thần mới.\n\nMặc dù Ta chưa hoàn toàn đạt đến mức độ thần thánh của [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )] [deceased_mandala_ruler.GetFirstNamePossessive], Ta đã chứng minh với thần dân rằng Ta có khả năng cứu chúng ta khỏi những tình huống khó khăn ngoài tầm kiểm soát.\n\nCó tiềm năng phát triển rõ ràng, và Ta mong được chứng minh bản thân."
  tgp_east_asia_mandala_events.8550.desc: "Phòng bùng nổ với những tiếng xì xào giữa các nhóm Bạn Bè; những quan viên mà Ta luôn coi là Ngài và thần dân trung thành. Mắt họ liếc nhìn Ta, nghi ngờ, khi Ta được chứng minh #EMP không#! thần thánh như [ROOT.Char.Custom2('RelationToMe', deceased_mandala_ruler )], [deceased_mandala_ruler.GetFirstName].\n\nTa hơi cúi đầu, thoáng lo lắng về điều sắp tới. Rồi Ta nhận ra cách điều đó có thể bị nhìn nhận và Ta thẳng lưng, đối mặt kiêu hãnh với mọi ánh mắt xì xào trong phòng.\n\nCần khôi phục rất nhiều tự tin ở đây, và con đường phía trước sẽ #EMP gập ghềnh#!."
  tgp_east_asia_mandala_events.8550.desc.failed: "Đầu gối Ta run rẩy và đầu quay nhẹ khi Ta nhận ra điều sắp xảy ra. Ta đã thất bại [deceased_mandala_ruler.GetFirstName] và thất bại trước vương quốc.\n\nTa không xứng làm người kế vị [ROOT.Char.GetPrimaryTitle.GetName]. Không có gì để xây dựng.\n\nTrong khoảnh khắc tỉnh táo, Ta nhìn quanh và nhận thấy mọi người hoặc đã đi, hoặc đang ra đi — quay lưng, chỉ còn những tiếng xì xào và rên rỉ thất vọng. Ta quỳ xuống, để gánh nặng của thế giới tạm thời đè lên mình."
  tgp_east_asia_mandala_events.8550.a: "Ta đã sẵn sàng."
  tgp_east_asia_mandala_events.8550.a.failed: "Không phải chuyện này đã được sắp xếp!"
  tgp_east_asia_mandala_events.8550.a.failed.tt: "Sự kém cỏi của Ngài khiến [realm|E] tan rã"

  tgp_east_asia_mandala_events.lose_3_tributaries.tt: "#alert_trial Tối đa #V 3#! [tributaries|E] bỏ rơi Ngài#!"
  tgp_east_asia_mandala_events.lose_all_tributaries.tt: "@alert_icon! #alert_trial Tất cả [tributaries|E] của Ngài đã bỏ rơi Ngài#!"

  mandala_liege_primary_title_succession_dissolution: "$liege_primary_title_dissolution$"
  mandala_liege_primary_title_succession_dissolution_desc: "Quân chủ của Ngài mất [primary_title|E] khi thất bại trong Thử Thách [mandala_succession|E]"

  tgp_east_asia_mandala_events.9000.t: "Sự Can Thiệp Thần Thánh"
  tgp_east_asia_mandala_events.9000.desc.lightning_strike: "#EMP SHKRRASCHHH#! — tia sét xuất hiện bất ngờ. Ta thấy mình nằm trên mặt đất, choáng nhưng hầu như không hề hấn.\n\nXung quanh, một đám đông bắt đầu tụ tập thành bán nguyệt, một [ROOT.Char.GetWomanMan] tuyên bố rằng Ta đã được thần thánh thử thách. Người khác khẳng định rằng Ta giờ đây #EMP được truyền#! bản chất của [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]."
  tgp_east_asia_mandala_events.9000.outro.diff_faith.lightning_strike: "\n\nMột [bystander.GetWomanMan] lặng lẽ bên cạnh nhìn Ta bình tĩnh và nói: 'Vậy là [bystander.GetFaith.HighGodName] đã hiện diện trong đời chúng ta...'"
  tgp_east_asia_mandala_events.9000.outro.lightning_strike: "\n\nMột [bystander.GetWomanMan] bình tĩnh bên cạnh nhìn Ta và nói: 'Vậy là [ROOT.Char.GetFaith.HighGodName] đã hiện diện trong đời chúng ta...'"
  tgp_east_asia_mandala_events.9000.desc.scar: ""[ROOT.Char.GetFirstNameNoTooltip]!", [ROOT.Char.Custom2('RelationToMe', bystander)] [bystander.GetTitledFirstName] kêu lên, mặt đỏ bừng. "Vết sẹo đó! Trên vai Ngài! Nó... lúc nào cũng thế sao..." [bystander.GetSheHe] ngập ngừng, "Nó giống khuôn mặt của [bystander.GetFaith.HighGodName]!"\n\nTa chớp mắt vài lần khi [bystander.GetSheHe] suy nghĩ, rồi [bystander.GetSheHe] thốt lên đầy bất ngờ: "Rõ ràng Ngài được ban phước, [bystander.Custom2('RelationToMe', ROOT.Char )]! Ngài được đánh dấu để vượt lên thế giới này!"\n\nGiờ cả Bạn Bè lẫn thường dân gần đó đều để ý, nhìn Ta từ đầu đến chân và xì xào đồng tình "#EMP Nhìn kìa...#!"
  tgp_east_asia_mandala_events.9000.a: ""Ta #EMP luôn#! cảm thấy hơi khác biệt..."
  tgp_east_asia_mandala_events.9000.a.diff_faith: ""[bystander.GetFaith.HighGodName]? Điều này có nghĩa gì?""
  divine_happenstance_tt: "\n#weak Nếu Ngài vẫn có [GetModifier('divine_happenstance_modifier').GetNameWithTooltip] khi [mandala|E] [government|E] được áp dụng:#!"
  because_of_your_divine_happenstance_tt: "#weak Bởi vì [GetModifier('divine_happenstance_modifier').GetNameWithTooltip] của Ngài:#!"
  divine_happenstance_fulfilled: "Định Mệnh Thần Thánh Hoàn Thành"
  divine_happenstance_fulfilled_desc: "Ngài đã hoàn thành nhiệm vụ và trở thành [mandala|E] [ruler|E]"
  tgp_east_asia_mandala_events.9000.b: ""Thần tính sẽ phải đợi.""
  cheaper_mandala_government_conversion_tt: "Chi phí chuyển sang [mandala|E] [government|E] rẻ hơn trong #V [EmptyScope.ScriptValue('cheaper_mandala_government_conversion_years')] năm tới#!"

