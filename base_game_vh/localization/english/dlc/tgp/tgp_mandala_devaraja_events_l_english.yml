l_english:
  devaraja.0001.title: "Lòng Từ Bi Khỏe Mạnh"
  devaraja.0001.desc: "[diseased_county_scope.GetName] đang kêu cứu khỏi căn bệnh dịch đang tàn phá bách tính nơi đây. Nếu có nơi nào trong lãnh địa xứng đáng nhận được sự bố thí lúc này, thì chính là nơi đây. Nhưng trong khi đang thị sát vùng đất để tìm nơi chữa bệnh, một gã nông dân trông thảm hại nhất tiến lại gần ta. Trong một hành vi vi phạm lễ nghi nghiêm trọng, [diseased_peasant.GetSheHe] quỳ rạp dưới đất, khẩn cầu sự cứu giúp.\n\nVới tư cách là #italic Devaraja#!, ta được mong đợi là sẽ nâng đỡ tất cả thần dân của mình, nhưng liệu... #italic hắn#! này có thực sự xứng đáng để ta cứu rỗi?"
  devaraja.0001.a: "Ta phải giúp trong thời khắc khó khăn này, dù dân chúng có bần hàn đến đâu."
  devaraja.0001.b: "Ta để công việc này cho [steward.GetCouncilTitle], [steward.GetFirstNameNoTooltip], để giám sát nỗ lực này."
  devaraja.0001.c: "Ugh! Nơi bẩn thỉu này không xứng nhận phúc từ thần linh."
  healed_by_the_devaraja: "Được Devaraja chữa lành"

  devaraja.0002.title: "Cầu Nguyện Cho Vị Vua Thần"
  devaraja.0002.desc.brahmin: "Khi [GetCourtPositionType('court_brahmin_court_position').GetName], [brahmin_or_chaplain.GetName], hoàn tất công việc chính thức trong ngày, [brahmin_or_chaplain.GetSheHe] bắt đầu ban phúc cho triều đình với các câu kinh của #italic Anumodana#!, lời tụng tiêu chuẩn để kết thúc ngày.\n\n#italic Giống như sông đầy nước tràn ra biển,#!\n#italic Cũng vậy những gì dâng ở đây giúp đỡ người chết đói...#!\n\nMột câu hỏi bỗng cháy lên trong đầu Ta. Liệu Ta có dám phá vỡ nghi thức?"
  devaraja.0002.desc.chaplain: "Khi [brahmin_or_chaplain.GetName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của ta, kết thúc công việc chính thức trong ngày, ngài bắt đầu ban phước cho triều đình bằng những vần thơ #italic Anumodana#!, bài tụng ca tiêu chuẩn để khép lại một ngày.\n\n#italic Như sông đầy nước lấp đầy đại dương,#! \n#italic Cũng như những gì bố thí nơi đây lợi lạc cho vong hồn đói khát...#! \n\nMột câu hỏi đột nhiên nảy ra trong đầu ta. Liệu ta có dám phá vỡ lễ nghi?"
  devaraja.0002.a: "\"Tại sao người chết lại xứng đáng với công đức này?\""
  devaraja.0002.a.tt.success: "Câu cuối được thay khéo léo để khen ngợi Ngài"
  devaraja.0002.a.tt.failure: "Sự gián đoạn của Ngài khiến toàn bộ nghi lễ trở nên vụng về"
  devaraja.0002.b.tt: "[brahmin_or_chaplain.GetFirstNameNoTooltip] thở phào vì nghi lễ diễn ra đúng kế hoạch"
  devaraja.0002.b: "Đừng để những suy nghĩ xâm nhập chiến thắng!"
  devaraja.0002.c: "Ngắt lời với một câu cuối hay hơn."
  devaraja.0002.c.tt.success: "Sự thông minh và hiểu biết của Ngài tạo ra câu cuối hay hơn ngay tại chỗ"
  devaraja.0002.c.quote.success: "\"Cũng vậy, mọi thứ dâng ở đây giúp ích cho #italic vua#!\""
  devaraja.0002.b.tt.failure: "Ngài lí nhí những câu yếu ớt sau khi ngắt lời [brahmin_or_chaplain.GetFirstNameNoTooltip]."

  devaraja.0003.title: "Một Bài Thuyết Pháp Đặc Biệt"
  devaraja.0003.desc.guru: "Thỉnh thoảng, [GetCourtPositionType('court_guru_court_position').GetName] được mong đợi sẽ có một bài diễn thuyết về khái niệm #italic Dharma#! trong hoàng cung. Đây thường là một sự kiện kéo dài, có cấu trúc và đầy rẫy những bài tụng niệm cùng nghi thức trang trọng, đi kèm với lễ vật xa hoa dâng lên người thuyết giảng để ghi nhận công lao của [guru_or_chaplain.GetHerHis]. Tuy nhiên, hôm nay [guru_or_chaplain.GetName] có vẻ hơi mệt mỏi.\n\nĐứng trước hoàng gia, ngài chỉ đơn giản tuyên bố: \"[ROOT.Char.GetTitleTierName] vốn đã biết tất cả những gì cần biết.\" Với câu nói đó, ngài tụng những đoạn văn thông thường để kết thúc bài thuyết giảng rồi trở về chỗ ngồi của mình."
  devaraja.0003.desc.chaplain: "Thỉnh thoảng, [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của ta được mong đợi sẽ có một bài diễn thuyết về khái niệm #italic Dharma#! trong hoàng cung. Đây thường là một sự kiện kéo dài, có cấu trúc và đầy rẫy những bài tụng niệm cùng nghi thức trang trọng, đi kèm với lễ vật xa hoa dâng lên người thuyết giảng để ghi nhận công lao của [guru_or_chaplain.GetHerHis]. Tuy nhiên, hôm nay [guru_or_chaplain.GetName] có vẻ hơi mệt mỏi.\n\nĐứng trước hoàng gia, ngài chỉ đơn giản tuyên bố: \"[ROOT.Char.GetTitleTierName] vốn đã biết tất cả những gì cần biết.\" Với câu nói đó, ngài tụng những đoạn văn thông thường để kết thúc bài thuyết giảng rồi trở về chỗ ngồi của mình."
  devaraja.0003.a: "Hah, làm tốt lắm! Hãy dâng cho ngài ấy phần lễ vật."
  devaraja.0003.b: "Khéo léo! Nhưng Ta chỉ thưởng công sức."
  devaraja.0003.c: "Ta không thưởng cho lười biếng! Vệ binh, bắt [guru_or_chaplain.GetHerHim]!"
  devaraja.0003.d: "Triệu tập [guru_or_chaplain.GetFirstNameNoTooltip] lên một lần nữa — Ta sẽ hỏi #italic [guru_or_chaplain.GetHerHim]#! về #italic Dharma#!."
  devaraja.0003.d.tt.success: "Ngài gây ấn tượng với [guru_or_chaplain.GetFirstNameNoTooltip] và triều thần bằng kiến thức về #italic Dharma#!"
  devaraja.0003.d.tt.failure: "Ngài tự làm xấu hổ trước [guru_or_chaplain.GetFirstNameNoTooltip] và triều thần, không thể hiện được sự hiểu biết về #italic Dharma#!"

  devaraja.0004.title: "Ta Yêu Một Cuộc Diễu Hành"
  devaraja.0004.desc: "[capital_county.GetName] đã chịu nhiều vết sẹo của quá khứ, bị tàn phá bởi gươm giáo và bão tố qua nhiều năm. Bên cạnh những cải thiện vật chất, chúng ta nên làm điều gì đó để nâng cao tinh thần dân chúng.\n\nKhông phải sẽ tuyệt vời khi có một cuộc diễu hành thuyền ở kinh đô vào cuối mùa mưa sao? Bảy mươi sáu người thổi kèn trên thuyền dẫn đầu, với một trăm mười trống đi theo gần đó. Và, để làm đầy đoàn diễu hành, chúng ta có thể yêu cầu mọi tu viện trang trí một chiếc thuyền!"
  devaraja.0004.a: "Dân chúng sẽ cảm thấy phấn khích khi thuyền đi qua!"
  devaraja.0004.b: "Yêu cầu vàng từ các tu viện vào thời điểm này là không tốt."
  devaraja.0004.b.tt: "Rút lại ý tưởng bây giờ sẽ bị để ý"
  devaraja.0004.c: "Đoàn diễu hành sẽ tiếp tục — không cần tu viện tham gia."
  devaraja_hosts_parade: "Đại Diễu Hành Của Devaraja"

  devaraja.0005.title: "Bức Tường Hai Mặt"
  devaraja.0005.desc: "Các ngôi đền mới cần trang trí, nghệ thuật phản ánh thần linh và quyền lực. Để phản ánh khía cạnh [ROOT.Char.Custom('GetAspectNoun')|U] thần thánh của ngôi nhà chính đáng của chúng ta, chúng ta có thể đảm bảo tranh tường và tượng điêu khắc tại công trình mới thể hiện các hình ảnh của các vị thần [ROOT.Char.Custom('GetAspectNoun')|U] — hoặc miêu tả Nhà [ROOT.Char.GetHouse.GetName] và nâng cao uy tín của bản thân Ta."
  devaraja.0005.a: "Nơi này sẽ được tôn thánh cho các vị thần."
  devaraja.0005.b: "Nơi này sẽ được tôn thánh cho vinh quang của Ta."

  devaraja.0006.title: "Trí Tuệ Của Chiếc Chèo"
  devaraja.0006.desc.guru: "[GetCourtPositionType('court_guru_court_position').GetName], [guru_or_chaplain.GetName], bị bắt gặp đang chèo một chiếc thuyền nhỏ quanh hồ trong cung điện. Vui chơi cùng triều thần, Ta triệu tập guru chèo thuyền từ phía bên kia nước. \"Ngươi là [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip] của ta! Ngươi không tôn trọng chức vị cao quý sao? Sao lại tự chèo thuyền như một người đánh cá thấp hèn?\"\n\nSau một khoảnh khắc, [guru_or_chaplain.GetFirstNameNoTooltip] đáp: \"Khi [ROOT.Char.GetTitleTierName] của công chúng sa đọa, [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip]s có thể tự chèo thuyền của mình.\""
  devaraja.0006.desc.chaplain: "[guru_or_chaplain.GetName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của ta, bị bắt gặp đang chèo một chiếc thuyền nhỏ trong hồ quanh cung điện. Đang vui vẻ với các cận thần, ta gọi vị đạo sư chèo thuyền ấy từ bên kia hồ. \"Ngài là [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của ta! Ngài không có chút tôn trọng nào đối với chức vị cao quý mình đang nắm giữ sao? Sao ngài lại có thể tự chèo thuyền như một gã ngư dân thấp kém vậy?\"\n\nSau một lúc ngập ngừng, [guru_or_chaplain.GetFirstNameNoTooltip] trả lời: \"Khi [ROOT.Char.GetTitleTierName] của đất nước đắm mình trong trụy lạc, thì [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] cũng có thể tự chèo thuyền cho mình.\""
  devaraja.0006.a: "Có lẽ Ta nên khiêm tốn hơn trước công chúng."
  devaraja.0006.b: "Vô lý! Tiệc tùng sẽ tiếp tục bao lâu Ta muốn."
  devaraja.0006.c: "Đây là một sự xúc phạm! Hãy tước bỏ các tước hiệu của [guru_or_chaplain.GetFirstNameNoTooltip]."
  devaraja.0006.d: "Có lẽ Ta nên từ bỏ rượu hoàn toàn."

  devaraja.0007.title: "Mơ Hồ Rõ Ràng"
  devaraja.0007.desc: "#italic Devaraja#! là một khái niệm tinh tế; tất nhiên Ta là [ROOT.Char.GetTitleTierName], nhưng Ta cũng liên kết với thần tính của [ROOT.Char.Custom('GetAspectNoun')|U]. Ta có phải là thần không? Ah, đó là câu hỏi tinh tế, cần sự mơ hồ để Ta vừa là thần với một số, vừa là vua với người khác.\n\nHoặc sẽ là câu hỏi tinh tế nếu một nhà ca tụng dài dòng chưa vừa gọi Ta là thần của [ROOT.Char.Custom('GetAspectNoun')|U]. Triều thần đã tranh luận nhau, không còn lựa chọn nào ngoài việc Ta phải phát biểu."
  devaraja.0007.a: "Đúng vậy, các thần dân — ta là chúa tể của [ROOT.Char.Custom('GetAspectNoun')|U]."
  devaraja.0007.b: "Dân chúng! Ta chỉ phục vụ [ROOT.Char.Custom('GetAspectNoun')|U], ta không phải là chủ nhân của nó."
  devaraja.0007.c: "Nhân tính và thần tính hòa nhập trong ta thành một thực thể huyền bí."
  devaraja.0007.c.tt.success: "Ngài đưa ra khái niệm thỏa hiệp làm vừa lòng đủ người"
  devaraja.0007.c.tt.failure: "Việc lấn sâu vào thần học chỉ khiến tình hình tệ hơn"
  devaraja_as_god: "Devaraja Thần Thánh"
  devaraja_as_king: "Devaraja Vương Giả"
  devaraja_as_hypostatic_union: "Devaraja Hai Bản Tính"

  devaraja.0008.title: "Tin Đồn Chuyển Đạo Trên Giường Bệnh"
  devaraja.0008.desc: "[suzerains_missionary.GetNameNoTooltip], nhà truyền giáo của [suzerain.GetTitleTierName] [suzerain.GetFirstNamePossessiveNoTooltip], gần như vấp ngã khi tiến lại gần.\n\n\"Ta có tin vui!\" ngài thốt lên. \"Ta đã nghiền ngẫm lịch sử gia tộc của ngài và hỏi những tôi tớ lớn tuổi nhất về những gì họ còn nhớ, có vẻ như tổ tiên của ngài, [deathbed_conversion_ancestor.GetName], thực sự đã cải sang [suzerain.GetFaith.GetName] ngay trước khi lâm chung!\"\n\n[suzerains_missionary.GetName] nhìn ta với vẻ phấn khích khó giấu. \"Ngài gần với [suzerain.GetFaith.HighGodName] hơn ngài tưởng đấy!\""
  devaraja.0008.a: "[deathbed_conversion_ancestor.GetName] đã theo [suzerain.GetFaith.GetAdjective]? Ta có thể tin điều đó."
  devaraja.0008.a.tt.conversion: "[ROOT.Char.GetName] hiện khẳng định rằng tổ tiên [deathbed_conversion_ancestor.GetName] của ngài đã cải sang [suzerain.GetFaith.GetName]"
  devaraja.0008.b: "[deathbed_conversion_ancestor.GetRelationToString( ROOT.Char )] đã mất như một [deathbed_conversion_ancestor.GetFaith.GetAdherentName] và sẽ luôn được ghi nhớ như thế!"

  devaraja.0009.title: "Nhà Truyền Giáo Lỡ Nhiệm Vụ"
  devaraja.0009.desc: "Sự trung thành của ta với [suzerain.GetFaith.GetName] đã khiến [suzerains_missionary.GetName] không còn triều đình nào để truyền đạo. Dù ngài vô cùng vui mừng trước sự thay đổi đức tin của ta, ngài vẫn đầy lo âu về tương lai của mình."
  devaraja.0009.a: "[suzerains_missionary.GetName]! Hãy cùng ta trở thành [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] mới!"
  devaraja.0009.a.tt.missionary_now_chaplain: "[ROOT.Char.GetName] đã bổ nhiệm nhà truyền giáo [suzerains_missionary.GetName] của ngài làm [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] mới"
  devaraja.0009.b: "[suzerains_missionary.GetName], công việc của ngươi đã xong — giờ hãy #italic rời đi#!."

  devaraja.0010.title: "Đức Tin Cô Đơn Nhất"
  devaraja.0010.desc: "[suzerains_missionary.GetName], một [suzerains_missionary.GetFaith.GetAdherentName] tốt, đã chán nản vì đức tin [suzerains_missionary.GetHerHis] chúa theo [suzerain.GetFaith.GetAdjective]. [suzerains_missionary.GetSheHe|U] đứng trước ngã rẽ; đức tin [suzerains_missionary.GetHerHis] dao động khi [suzerains_missionary.GetSheHe] chờ một dấu hiệu. Dấu hiệu đó có đến từ Ngài hay từ [suzerains_missionary.GetFaith.DivineRealm] là quyền quyết định của Ngài."
  devaraja.0010.a: "[suzerains_missionary.GetName] sẽ tự đưa ra quyết định của riêng mình vào thời điểm thích hợp."
  devaraja.0010.a.tt.unconverted: "[suzerains_missionary.GetName] vẫn là một [suzerains_missionary.GetFaith.GetAdherentName] buồn bã"
  devaraja.0010.a.tt.converts: "[suzerains_missionary.GetName] chấp nhận đức tin [suzerain.GetFaith.GetAdjective] của [suzerain.GetNamePossessive]"
  devaraja.0010.b: "Có lẽ [suzerains_missionary.GetName] sẽ tìm thấy mục đích mới trong [ROOT.Char.GetFaith.GetName]?"
  devaraja.0010.b.tt.success: "[suzerains_missionary.GetName] theo [ROOT.Char.GetFaith.GetName]"
  devaraja.0010.b.tt.failure: "[suzerains_missionary.GetName] vẫn là một [suzerains_missionary.GetFaith.GetAdherentName] kiên định"

  fervor_gain_deathbed_conversion_discovered: "Khám Phá Chuyển Đạo Trên Giường Bệnh"
  fervor_gain_faith_reaffirmed: "Đức Tin Tổ Tiên Được Khẳng Định Lại"
