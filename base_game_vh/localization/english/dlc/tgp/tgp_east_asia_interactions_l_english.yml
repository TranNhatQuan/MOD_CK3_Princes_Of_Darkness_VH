  tgp_east_asia_interaction_events.1000.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
  tgp_east_asia_interaction_events.1000.desc: "Ta cảm thấy vinh dự khi ngươi muốn định hình lại [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] realm theo hình ảnh của Ngài."
  tgp_east_asia_interaction_events.1000.favor: "\n\nTuy nhiên, Ta nghĩ sẽ gặp khó khăn trong việc thuyết phục những người khác..."
  tgp_east_asia_interaction_events.1000.a: "Một vị thần sẽ nợ ngươi."
  tgp_east_asia_interaction_events.1000.b: "Ta đã quyết, ngươi sẽ cản trở mệnh lệnh của ta sao?"
  tgp_east_asia_interaction_events.1001.gold: "\n\nCó lẽ nếu Ta có thể đưa ra một biểu tượng thiện chí, người khác sẽ ấn tượng..."
  tgp_east_asia_interaction_events.1002.a: "Là nô lệ của ta, ngươi sẽ được thưởng"
  tgp_east_asia_interaction_events.1003.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
  tgp_east_asia_interaction_events.1003.desc: "Đã đến lúc [recipient.GetPrimaryTitle.GetBaseNameNoTier] thực sự trở thành một phần của Mandala [actor.GetPrimaryTitle.GetAdjectiveNoTooltip]. Ta mời ngươi cai trị như [actor.GetPrimaryTitle.GetTierAsNameNoTooltip], được toàn quyền hỗ trợ bởi giới tu sĩ của ta."
  tgp_east_asia_interaction_events.1003.end: "\n\nNgươi sẽ cai trị theo ý ta, như một đại diện trên Trái Đất của ta."
  tgp_east_asia_interaction_events.1003.a: "Hãy để tất cả biết!"
  tgp_east_asia_interaction_events.1003.b: "Như một ân huệ với ngươi, điều này sẽ được thực hiện."
  tgp_east_asia_interaction_events.1003.c: "Ta sẽ cần tài nguyên để thực hiện điều này."
  tgp_east_asia_interaction_events.1003.d: "Một vị vua của [recipient.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] sẽ không cúi đầu!"
  tgp_east_asia_interaction_events.1000.accept_toast: "Yêu Cầu Được Chấp Nhận"
  tgp_east_asia_interaction_events.1000.refuse_toast: "Yêu Cầu Bị Từ Chối"
  tgp_east_asia_interaction_events.1000.force_toast: "Cai Trị Bị Ép Buộc"
  demand_mandala_interaction_vassal_refuses: "[recipient.GetShortUIName|U] sẽ không trở thành [mandala|E]"

