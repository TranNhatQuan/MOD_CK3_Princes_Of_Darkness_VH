  LEGEND_COUNTY_MODIFIERS_SUBTEXT: "#S $COUNTY_MODIFIERS$#!\n[Legend.GetImpactModifiers( 'county' )]"
  OWNER_MODIFIERS_SUBTEXT: "#S $OWNER_MODIFIERS$#!\n[Legend.GetImpactModifiers( 'owner' )]"
  LEGEND_PROMOTER_MODIFIERS_SUBTEXT: "#S $LEGEND_PROMOTER_MODIFIERS$#!\n[Legend.GetImpactModifiers( 'promoter' )]"

  LEGEND_OWNER_DESCRIPTION: "Chủ sở hữu: [Legend.GetOwner.GetShortUIName|U]"
  LEGEND_PROMOTING_LEGEND: "Ngài đang [promoting_legend|E] [legend|E] này"
  LEGEND_OWNING_LEGEND: "Ngài là chủ sở hữu của [legend|E] này"
  LEGEND_UNOWNED_GRACE_PERIOD: "Ngài chưa thể tiếp quản [legend|E] này cho tới $DATE$"

  game_concept_legend: "Huyền Thoại"
  game_concept_legend_i: "@legend_icon!"
  game_concept_legend_desc: "Một $game_concept_legend$ đại diện cho những chiến công quan trọng mà một Nhân vật đã đạt được trong cuộc đời, và được tạo ra từ [legend_seeds|E].\n\nHuyền Thoại là một cách mạnh mẽ để đạt được [legitimacy|E], cùng các phần thưởng khác như tăng [skill|E], thưởng [opinion|E], [dynasty_prestige|E], [prestige|E] hoặc [piety|E]. Các [baronies|E] nơi một $game_concept_legend$ đã lan truyền cũng có thể nhận được hiệu ứng bổ sung nếu thuộc quyền sở hữu của chủ nhân $game_concept_legend$ hoặc một [legend_promoter|E].\n\n$game_concept_legends$ có một [legend_type|E] quyết định các phần thưởng đó: chúng có thể là Hợp Pháp Hóa, Thánh hoặc Anh Hùng. Mỗi $game_concept_legend$ cũng có một cấp độ [legend_quality|E], ảnh hưởng đến sức mạnh của phần thưởng cũng như phạm vi lan truyền."
  game_concept_owned_legend: "Huyền Thoại Đã Sở Hữu"
  game_concept_owning_legend: "Đang Sở Hữu Huyền Thoại"
  game_concept_owned_legend_desc: "Một $game_concept_owned_legend$ là một [legend|E] do một [ruler|E] sở hữu, người là bên hưởng lợi chính từ các hiệu ứng của nó.\n\nChủ sở hữu của một $game_concept_legend$ có thể đồng thời là [legend_protagonist|E], nhưng điều này không bắt buộc.\n\nMột $game_concept_legend$ cũng có thể được hỗ trợ bởi [legend_promoters|E], những người trả một khoản đóng góp hàng tháng để nhận một phần tiền thưởng của nó."
  game_concept_owning_legend_desc: "$game_concept_owned_legend_desc$"
  game_concept_promoted_legend: "Huyền Thoại Được Quảng Bá"
  game_concept_promoted_legend_desc: "Một $game_concept_promoted_legend$ là một [legend|E] do một [ruler|E] khác sở hữu và đang được hỗ trợ bởi các [legend_promoters|E], những người trả một khoản đóng góp hàng tháng để nhận một phần tiền thưởng."
  game_concept_promoting_legend: "Quảng Bá"
  game_concept_promoting_legend_desc: "$game_concept_promoting_legend$"
  game_concept_legend_promoter: "Người Quảng Bá Huyền Thoại"
  game_concept_legend_promoter_desc: "Một $game_concept_legend_promoter$ là một [ruler|E] hỗ trợ [legend|E] của một người cai trị khác.\n\nMột $game_concept_legend_promoter$ nhận được các phần thưởng bổ sung tùy theo [legend_type|E] và [legend_quality|E] của $game_concept_legend$, đổi lại là khoản đóng góp [gold|E] hàng tháng."
  game_concept_legend_promoters: "Những Người Quảng Bá Huyền Thoại"
  game_concept_legend_promoters_desc: "$game_concept_legend_promoter_desc$"
  game_concept_legends: "Huyền Thoại"
  game_concept_legends_desc: "$game_concept_legend_desc$"
  game_concept_legend_seed: "Mầm Huyền Thoại"
  game_concept_legend_seed_desc: "Một [legend|E] đang hình thành. $game_concept_legend_seeds$ là nền tảng của một $game_concept_legend$ và bằng cách sáng lập chúng, một [ruler|E] có thể bắt đầu một $game_concept_legend$.\n\n$game_concept_legend_seeds$ có thể đạt được bằng cách đáp ứng một số điều kiện như là người thừa kế của Charlemagne hoặc thực hiện những chiến công huyền thoại: các [decisions|E] lớn, chiến thắng một [great_holy_war|E], trở thành [king|E] hoặc [emperor|E], tổ chức một [activity|E] lớn, săn một con thú huyền thoại, v.v.\n\nCác $game_concept_legend_seeds$ chưa hoạt động không có chi phí nhưng cũng không mang lại hiệu ứng. Việc sáng lập một $game_concept_legend_seed$ lần đầu tiên sẽ tốn [gold|E]."
  game_concept_legend_seeds: "Mầm Huyền Thoại"
  game_concept_legend_seeds_desc: "$game_concept_legend_seed_desc$"
  game_concept_legend_quality: "Chất Lượng Huyền Thoại"
  game_concept_legend_quality_desc: "Chất Lượng của một [legend|E] đánh dấu cả sức mạnh của các hiệu ứng lẫn phạm vi lan truyền, đồng thời ảnh hưởng đến phần thưởng cuối cùng. $game_concept_legends$ có thể là Nổi Danh, Lẫy Lừng hoặc Huyền Thoại — vì không tồn tại một $game_concept_legend$ tầm thường.\n\nChất Lượng có thể được nâng cao bằng cách lan truyền Huyền Thoại tới nhiều [baronies|E] hơn và trả chi phí nâng cấp.\n\nKhi chủ sở hữu của một $game_concept_legend$ qua đời, gia tộc của họ có thể tiếp tục nó mà không làm giảm Chất Lượng."
  game_concept_legend_famed: "Nổi Danh"
  game_concept_legend_famed_desc: "$game_concept_legend_quality_desc$"
  game_concept_legend_illustrious: "Lẫy Lừng"
  game_concept_legend_illustrious_desc: "$game_concept_legend_quality_desc$"
  game_concept_legend_mythical: "Huyền Thoại"
  game_concept_legend_mythical_desc: "$game_concept_legend_quality_desc$"
  game_concept_legend_protagonist: "Nhân Vật Chính của Huyền Thoại"
  game_concept_legend_protagonist_desc: "$game_concept_legend_protagonist$ là nhân vật trung tâm của một [legend|E], người mà các chiến công của họ được mô tả trong đó. Chủ sở hữu của một $game_concept_legend$ cũng có thể là $game_concept_legend_protagonist$, nhưng bất kỳ thành viên nào trong gia đình họ — còn sống hoặc đã chết — đều có thể đảm nhận vai trò này, miễn là đủ 16 tuổi.\n\n$game_concept_legend_protagonists$ không nhận thêm phần thưởng trực tiếp nào, nhưng nội dung của $game_concept_legend$ sẽ tập trung vào họ. Tuy nhiên, họ sẽ mang lại #color_white thêm#! [legitimacy|E] cho Chủ sở hữu Huyền Thoại, dựa trên số lượng [traits|E] [virtuous|E] mà họ sở hữu.\n\n$game_concept_legend_protagonist$ phải là người trưởng thành, vì việc nói rằng một đứa trẻ sơ sinh đã giết rồng có thể gây tranh cãi."
  game_concept_legend_protagonists: "Nhân Vật Chính của Huyền Thoại"
  game_concept_legend_protagonists_desc: "$game_concept_legend_protagonist_desc$"
  game_concept_legend_type: "Loại Huyền Thoại"
  game_concept_legend_types: "Các Loại Huyền Thoại"
  game_concept_legend_types_desc: "$game_concept_legend_type_desc$"
  game_concept_legend_type_desc: "Một [legend|E] có một Loại ảnh hưởng đến danh mục hiệu ứng mà nó mang lại, cũng như chủ đề nội dung của nó.\n\nCác $game_concept_legend_types$ bao gồm Hợp Pháp Hóa, Anh Hùng và Thánh, lần lượt mang lại [legitimacy|E], [prestige|E] và [piety|E]."
  game_concept_legend_heroic: "Huyền Thoại Anh Hùng"
  game_concept_legend_heroic_desc: "$game_concept_legend_type_desc$"
  game_concept_legend_holy: "Huyền Thoại Thánh"
  game_concept_legend_holy_desc: "$game_concept_legend_type_desc$"
  game_concept_legend_legitimizing: "Huyền Thoại Hợp Pháp Hóa"
  game_concept_legend_legitimizing_desc: "$game_concept_legend_type_desc$"
  game_concept_legend_library: "Thư Viện Huyền Thoại"
  game_concept_legend_library_i: "@legend_icon!"
  game_concept_legend_library_desc: "[legend_library|E] lưu giữ các [legends|E] đã hoàn thành và đã lan truyền tới [domain|E] của Ngài, do Ngài tạo ra hoặc từng tích cực quảng bá.\nNgài cũng có thể chủ động thêm các [legends|E] đã hoàn thành nếu đang di chuyển trong khu vực lan truyền của Huyền Thoại.\n\nNgài có thể xóa [legends|E] khỏi thư viện của mình bất cứ lúc nào."

  game_concept_ancestral_claim: "Yêu Sách Tổ Tiên"
  game_concept_ancestral_claim_desc: [casus_belli|E] Yêu Sách Tổ Tiên cho phép Ngài sáp nhập toàn bộ lãnh thổ trong một tước vị mà Ngài có yêu sách thông qua một [legend|E] Hợp Pháp Hóa."

  legend_heroic: "Huyền Thoại Anh Hùng"
  legend_heroic_name: "Huyền Thoại về [ROOT.Legend.GetOwner.GetNameNoTooltip]"
  legend_heroic_desc: "[ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] nổi danh với những chiến công anh hùng của [ROOT.Legend.GetOwner.GetHerHis]."
  legend_legitimizing: "Huyền Thoại Hợp Pháp Hóa"
  legend_legitimizing_name: "Gia Phả của [ROOT.Legend.GetOwner.GetNameNoTooltip]"
  legend_legitimizing_desc: "Dòng dõi của triều đại [ROOT.Legend.GetOwner.GetDynasty.GetBaseNameNoTooltip] đã cai trị những vùng đất này suốt nhiều thế kỷ."
  legend_holy: "Huyền Thoại Thánh"
  legend_holy_name: "Những Phép Màu của [ROOT.Legend.GetOwner.GetNameNoTooltip]"
  legend_holy_desc: "Sự thánh thiện mà [ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] thể hiện được mọi tín đồ của [ROOT.Char.GetFaith.HighGodName] ngưỡng mộ."

  legend_king_arthur: "Di Sản của Arthur Pendragon"
  legend_king_arthur_desc: "Vị vua đã qua và sẽ trở lại vẫn sống mãi trong huyết thống của triều đại này."
  legend_carolingian: "Những Người Thừa Kế của Charlemagne"
  legend_carolingian_desc: "Vị đại vương Charlemagne từng cai trị vùng đất này trước triều đại này, những người tuyên bố là hậu duệ trực tiếp của dòng máu đế quốc của ông."
  legend_holy_warrior: "Nắm Đấm Thánh"
  legend_holy_warrior_desc: "Một chiến binh thánh vĩ đại, vị anh hùng này đã chiến đấu anh dũng vì đức tin của mình."
  legend_chapter_opening_holy_warrior: "Là một chiến binh vĩ đại của [religion.GetNameNoTooltip], truyền thuyết về [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] bắt đầu với một sự ra đời đầy điềm lành. Ngay từ khi còn rất nhỏ, [ROOT.Legend.GetProtagonist.GetSheHe] đã cảm nhận được tiếng gọi của [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]."
  legend_el_cid: "Khúc Ca về El Cid"
  legend_el_cid_desc: "Rodrigo Díaz de Vivar từng là một quý tộc nhỏ bị thất sủng, sau này trở thành một vị vua theo đúng nghĩa của mình."
  legend_alfred_of_wessex: "Vị Vua Thánh"
  legend_alfred_of_wessex_desc: "[ancestor.GetNameNoTooltip|U] đã vượt qua các cuộc xâm lược của người Bắc Âu tại Anh, đứng vững như một thành lũy và là người truyền bá Kitô giáo."
  legend_sons_of_david: "Hậu Duệ của David"
  legend_sons_of_david_desc: "David, Vua của Israel, được Thiên Chúa phong nhiệm và dòng máu của ông chảy trong huyết quản của mọi thành viên nhà [GetDynastyHouseByID('house_bagrationi').GetNameNoTooltip]."
  legend_peasant_emperor: "Từ Nông Dân đến Basileus"
  legend_peasant_emperor_desc: "Basil sinh ra trong một gia đình nông dân, bước vào phục vụ Hoàng đế, cưới con gái của ông và cuối cùng tự mình thăng lên địa vị Basileus."
  legend_the_wheelwright: "Hầm Rượu Dồi Dào"
  legend_the_wheelwright_desc: "Vào sinh nhật lần thứ bảy của con trai mình, Piast Người Thợ Làm Bánh Xe được hai người lạ ghé thăm. Để cảm ơn lòng hiếu khách, họ đã ban một phép thuật khiến hầm rượu của Piast luôn đầy ắp vĩnh viễn."
  legend_vercingetorix: "Hậu Duệ của Vercingetorix"
  legend_vercingetorix_desc: "Vercingetorix từng thống nhất các bộ tộc Gaul trong cuộc nổi dậy chống lại cuộc xâm lược của La Mã. Dù thất bại dưới tay Caesar, tinh thần Celt của ông vẫn sống mãi trong dòng máu chúng ta."
  legend_saman_khudah: "Hậu Duệ của Bahram Chobin"
  legend_saman_khudah_desc: "Tướng lĩnh, kẻ chinh phục và kẻ tiếm ngôi, Bahram Chobin từng đoạt lấy ngai vàng Sassanid cho riêng mình, và dòng máu anh hùng của ông chảy trong huyết quản chúng ta."
  legend_bahram_gur: "Dòng Dõi Gur"
  legend_bahram_gur_desc: "Bahram Gur là một vị vua chiến binh vĩ đại, từng chiến đấu và chống trả vô số kẻ xâm lược. Dòng máu của ông chảy trong huyết quản chúng ta, biến chúng ta thành những anh hùng Ba Tư."
  bahram_gur: "Bahram Gur"
  legend_cadell: "Dòng Máu của Cadell"
  legend_cadell_desc: "Cadell khởi đầu cuộc đời là một cậu bé nô lệ, nhưng với phúc lành từ một vị Thánh, ông đã giành lấy vương quốc Powys từ tay Vortigern."
  legend_descendants_of_brahman: "Dòng Máu của Brahman"
  legend_descendants_of_brahman_desc: "Chúng ta là con trai và con gái của các vị Thần. Brahman, Vishnu — dòng máu của chúng ta có thể truy nguyên về tận khởi nguyên của thời gian."
  legend_gothic_kings: "Những Vị Vua Goth"
  legend_gothic_kings_desc: "Người Goth đã gây ra sự sụp đổ của La Mã và sáng lập vương quốc của chúng ta. Chúng ta là hậu duệ của họ — những Vua và Nữ Vương của người Goth."
  legend_sons_of_rurik: "Những Người Con của Rurik"
  legend_sons_of_rurik_desc: "Hoàng tử Varangian Rurik đã dẫn đoàn chiến binh phiêu lưu tiến về phương Đông và thành lập vương quốc Novgorod hùng mạnh. Chính dòng máu huyền thoại của ông đang chảy trong huyết quản chúng ta."
  legend_william_gellones: "La Prise d'Orange"
  legend_william_gellones_desc: "Người đánh bại các đạo quân Hồi giáo tại Orange, Guillaume Gellones là một chiến binh của Kitô giáo và là người sáng lập tu viện Gellone, nơi ông sau này từ bỏ quyền lực để sống đời tu sĩ."
  legend_edward_the_martyr: "Edward Tử Đạo"
  legend_edward_the_martyr_desc: "Bị sát hại và chôn cất không danh phận, thi thể của Edward Tử Đạo được phát hiện không hề phân hủy sau một năm. Người ta nói rằng ông đã đón nhận cái chết của mình vì tình yêu sâu sắc dành cho Chúa Kitô."
  legend_yazdagird_iii: "Dòng Máu của [ancestor.GetFirstNameNoTooltip] III"
  legend_yazdagird_iii_desc: "The blood of the last Sassanid shah runs through our veins. Though [ancestor.GetSheHe] was besieged by Turks, Khazars, and Arabian invaders from all sides, [ancestor.GetSheHe] remained loyal to Persia to [ancestor.GetHerHis] final breath."
  legend_afrasiyab: "Vị Vua của Turan: Afrasiyab"
  legend_afrasiyab_desc: "Vị vua huy hoàng của Turan và anh hùng của người Thổ, Afrasiyab là kẻ thù truyền kiếp của Đế quốc Ba Tư và là vị vua vĩ đại nhất trong các vị vua Turan. Dòng máu kỳ diệu của ông chảy trong huyết quản chúng ta, ban cho chúng ta quyền thiêng liêng để một lần nữa thống trị Turan."
  legend_sceafa: "Sceafa, Cháu của Noah"
  legend_sceafa_desc: "Vị vua Lombard cổ đại Sceafa từng bò lên từ biển khi còn là một đứa trẻ và sau đó trở thành người cai trị nước Anh. Chúng ta biết rằng ông là cháu của Noah, và từ ông mà chúng ta thừa hưởng dòng máu thiêng liêng."
  legend_new_troy_london: "Tân Troy"
  legend_new_troy_london_desc: "Brutus, bị lưu đày khỏi Troy, được nữ thần Diana dẫn đường đến Albion. Sau khi đánh bại những người khổng lồ chiếm giữ vùng đất này, ông đã thành lập Troia Nova — thị trấn mà ngày nay chúng ta gọi là London."
  legend_corineus: "Khúc Ballad về Corineus"
  legend_corineus_desc: "Corineus, chiến binh Trojan cổ đại, là người sáng lập đầu tiên của Cornwall. Ông đến Britannia, tiêu diệt những người khổng lồ chiếm đóng nơi đây và đặt tên vùng đất là Cornwall theo tên mình."
  legend_scota: "Những Người Con của Scota"
  legend_scota_desc: "Từ Scota, con gái của một Pharaoh Ai Cập vĩ đại, mà chúng ta gọi vùng đất của mình là \"Scotland\". Bà là mẹ của toàn thể người Scots, và dòng máu của các Pharaoh cổ đại chảy trong huyết quản chúng ta."
  legend_pyusawhti: "Hậu Duệ của Nữ Thần Rồng"
  legend_pyusawhti_desc: "Sinh ra từ dạ con của một nữ thần rồng và là hậu duệ của Mahasammata, chúng ta mang trong mình dòng máu thiêng liêng và hùng mạnh bậc nhất."
  legend_tosny: "Hiệp Sĩ Thiên Nga"
  legend_tosny_desc: "Roger de Tosny hùng mạnh là hậu duệ của Hiệp Sĩ Thiên Nga, và chúng ta mang Huy Hiệu Thiên Nga cho đến ngày nay để tôn vinh truyền thuyết của ông."
  legend_menelik_i: "Những Người Con của David"
  legend_menelik_i_desc: "Người sáng lập triều đại của chúng ta, Menelik I, là kết quả của mối tình giữa Solomon của Israel và Nữ hoàng Sheba."
  legend_kings_of_semien: "Các Vị Vua của Semien"
  legend_kings_of_semien_desc: "Beta Israel là vương quốc Do Thái huyền thoại vẫn kiên cường chống lại sự Kitô hóa. Chúng ta là hậu duệ của Chi tộc Dan, những người đã rời khỏi Israel trong cuộc nội chiến giữa phe Rehoboam và Jeroboam."
  legend_roman_heritage: "Di Sản La Mã"
  legend_roman_heritage_desc: "Gia tộc chúng ta không chỉ cai trị một Đế quốc La Mã hiện đại, mà còn từng là những cận thần có ảnh hưởng tại Rome từ thời Cộng hòa."
  legend_hunnic_heritage: "Di Sản Hung Nô"
  legend_hunnic_heritage_desc: "Dân tộc chúng ta có thể truy nguyên dòng dõi về các gia đình của người Hung, và người sáng lập triều đại của chúng ta thực chất chính là Attila hung bạo, kẻ đã khiến La Mã khuất phục."
  legend_premysl: "Přemysl Người Cày Ruộng"
  legend_premysl_desc: "Tổ tiên của chúng ta khởi đầu cuộc đời chỉ là một nông dân ở làng Stadice, nhưng chẳng bao lâu ông đã lọt vào mắt xanh của Libuše và kết hôn với bà để trở thành Thân vương của người Séc."
  legend_borjigin: "Vị Khách Phát Sáng"
  legend_borjigin_desc: "Alan Gua, mẹ của toàn thể [GetDynastyByID('11100').GetNameNoTooltip], đã được một hình bóng kỳ lạ phát sáng ghé thăm cả ngày lẫn đêm. Giống như một con chó vàng khổng lồ, hắn bò vào lều của bà qua ánh trăng ban đêm và ánh mặt trời ban ngày, ban cho bà ba người con trai. Bà đã cảnh báo những người con được thụ thai thiêng liêng của mình rằng họ phải gắn kết với nhau như một bó năm mũi tên, nếu không sẽ bị bẻ gãy như năm mũi tên rời rạc."
  legend_naga_descent: "Dòng Máu của Naga"
  legend_naga_descent_desc: "Naga là những sinh vật linh thiêng nửa người nửa rắn cư trú tại Patala, và đôi khi có thể bước sang thế giới của chúng ta dưới hình dạng con người hoàn chỉnh. Gia tộc chúng ta có thể truy nguyên dòng dõi về một Naga từng đến Kashmir và chung chạ với một con người."
  legend_hieros_gamos_skirnismal: "Hieros Gamos"
  legend_hieros_gamos_skirnismal_desc: "Fjolnir, người sáng lập triều đại Yngling, được sinh ra từ sự kết hợp của Gerðr trong tình yêu với Freyr. Ngoài con cháu của Fjolnir ra, ai khác có thể sở hữu dòng máu thần thánh cần thiết để cai trị Na Uy?"
  legend_shibi_chakravarti: "Shibi Chakravarti"
  legend_shibi_chakravarti_desc: "Là hiện thân của sự khiêm nhường và mộ đạo, vị vua anh hùng Shibi được giao nhiệm vụ bảo vệ hiền giả Agni, người đã bị biến thành một con chim. Khi một con diều hâu đòi ông phải hiến tế chính thịt mình để cứu chim bồ câu, Shibi đã sẵn sàng hiến dâng toàn bộ bản thân, nhưng được tha mạng và ban thưởng bằng người con trai Kapotaroma. Chính dòng máu của vị vua vị tha này chảy trong huyết quản của mọi thành viên nhà [GetDynastyByID('1043008').GetNameNoTooltip]."
  legend_magi: "Những Người Con của Ba Nhà Thông Thái"
  legend_magi_desc: "Sau khi Chúa Giê-su ra đời, Người đã được các Nhà Thông Thái trong Kinh Thánh viếng thăm, mang theo lễ vật là vàng, nhũ hương và mộc dược. Phúc Âm theo Thánh Mát-thêu cho biết Ba Nhà Thông Thái đến từ phương Đông.\nMột lữ khách phương Tây lầm lạc có thể cho rằng Ngôi Sao Bethlehem được nhìn thấy tại thành phố Ba Tư Saba.\nNhưng mặt trời đang mọc xa hơn nữa về phương Đông. Của cải đến từ các thành thị, nhưng đức tin bền bỉ lại xuất phát từ thảo nguyên khắc nghiệt.\nKinh Thánh kể rằng Melchior, Caspar và Balthazar đã trở về quê hương sau khi bái lạy vị Vua Do Thái sơ sinh. Huyết thống của họ, những tín đồ Nestorian mộ đạo nhất, vẫn đang thờ phụng vị Thiên Chúa duy nhất và Người Con của Ngài."
  legend_the_red_hand: "Bàn Tay Đỏ của Ulster"
  legend_the_red_hand_desc: "Người ta kể rằng vào buổi sơ khai của Ireland, đã có một lời hứa rằng người đầu tiên đặt tay lên Ulster sẽ có quyền tuyên bố chủ quyền nơi đó và được phong làm Đại Vương Ireland. Chính tổ tiên của chúng ta đã đủ mưu trí để tự chặt bàn tay mình và ném nó vào Ulster, nhuộm đỏ thảm cỏ ngọc lục bảo bằng máu của mình."
  legend_ragnarr: "Những Người Con của $nick_lodbrok$"
  legend_ragnarr_desc: "Vua của người Đan Mạch và là kẻ sát long khủng khiếp, [ancestor.GetFirstNameNoTooltip] là nỗi kinh hoàng đối với các tín đồ Kitô giáo và là một nhà phiêu lưu huyền thoại. Những chiến công vĩ đại của [ancestor.GetHerHis|U] trong đời nhiều đến mức không thể kể hết, và với dòng máu của [ancestor.GetHerHis] đang chảy trong Ta, việc Ta kế thừa di sản của [ancestor.GetHerHis] và xây dựng một truyền thuyết vĩ đại của riêng mình là điều hoàn toàn xứng đáng!"
  legend_holy_site: "$legend_saintly_location_name$"
  legend_holy_site_desc: "$legend_saintly_location_desc$"
  legend_saintly_location_name: "[ROOT.Char.CustomFixedRandom('GetCustodianSynonym')|U] của Thánh Địa [protagonist.GetFaith.GetAdjectiveNoTooltip]"
  legend_saintly_location_desc: "Việc nắm giữ một thánh địa của [faith.GetNameNoTooltip] tự thân đã là dấu hiệu của sự thánh thiện."
  legend_chapter_opening_saintly_location: "Vùng đất [location.GetNameNoTooltip] mang giá trị mộ đạo tối thượng, và người ta nói rằng từ lòng đất nơi đây tuôn ra dòng nước kỳ diệu, có thể chữa khỏi mọi bệnh tật."
  legend_chapter_motivation_religious: "When [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] heard of this, [ROOT.Legend.GetProtagonist.GetSheHe] felt a great warmth in [ROOT.Legend.GetProtagonist.GetHerHis] heart, for [ROOT.Legend.GetProtagonist.GetHerHis] devotion was so great that the mere thought of a holy place made [ROOT.Legend.GetProtagonist.GetHerHim] tear up."
  legend_saintly_life_name: "Cuộc Đời [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] Nhất của [protagonist.GetTitledFirstNameNoTooltip]"
  legend_saintly_life_desc: "Cuộc sống tận tụy mà [protagonist.GetTitledFirstNameNoTooltip] đã sống đã ban cho [protagonist.GetHerHim] một địa vị gần như thánh nhân."
  legend_chapter_opening_saintly_life: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] was born with the most deep love for [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], and dedicated all [ROOT.Legend.GetProtagonist.GetHerHis] life to honor [ROOT.Legend.GetProtagonist.GetHerHis] faith."
  holy_seed_toast: "Nhận được [legend_seed|E] Thánh"
  holy_seed_toast_traits: "Bản chất [ROOT.Char.CustomFixedRandom('GetSaintlyTrait')] của Ngài được công nhận"
  legend_saintly_building_name: "Người Xây Dựng [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] của [location.GetNameNoTooltip]"
  legend_saintly_building_desc: "Việc xây dựng [ROOT.Char.GetFaith.HouseOfWorshipPlural] là một hành động vị tha — minh chứng lớn lao cho một tâm hồn mộ đạo."
  legend_ancient_people_name: "[culture.GetNameNoTooltip] [ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U]"
  legend_ancient_people_desc: "Trong huyết quản của toàn thể dân tộc chúng ta chảy cùng một dòng máu đã từng chảy trong [culture.GetCollectiveNoun]."
  legend_saintly_deed_name: "Những Hành Vi [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] của [ancestor.GetNameNoTooltip|U]"
  legend_saintly_deed_desc: "Những hành động mộ đạo của [ancestor.GetShortUINamePossessive|U] nhân danh [religion.GetName] chắc chắn xứng đáng được tôn kính."
  legend_saintly_descent_name: "[ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U] của [Localize( ancestor_flag )|U]"
  legend_saintly_descent_desc: "Dòng máu thiêng liêng của [Localize( ancestor_flag )] chảy trong huyết quản chúng ta, và cùng với nó chúng ta sẽ thực hiện những phép màu."
  legend_mythical_descent_name: "Dòng Máu [Localize( creature )|U]"
  legend_mythical_descent_desc: "Một trong những tổ tiên của ta là một [Localize( creature )] hùng mạnh."
  legend_godly_descent_name: "Dòng Máu của [Localize( god )|U]"
  legend_godly_descent_desc: "[Localize( god )|U] là tổ tiên của ta, và với dòng máu ấy trong huyết quản, ta sẽ thực hiện những kỳ tích."
  legend_chronicle_ancestral_glory_desc: "[ancestor.GetName] thực sự là một [ancestor.GetWomanMan] vĩ đại, được mọi người tôn kính."
  legend_chronicle_ancestral_glory_nohistory_desc: "Tổ tiên của chúng ta thực sự là một trong những vĩ nhân, được toàn thể tôn kính."
  legend_crusader: "[GetTrait('faith_warrior').GetNameNoTooltip( protagonist )] [ancestor.GetTitleAsNameNoTooltip|U]"
  legend_crusader_desc: "[protagonist.GetName] đã lập nên nhiều chiến công vĩ đại và mộ đạo trong việc chinh phục Thánh Địa."
  legend_chronicle_raised_by_animals: "Đứa Trẻ của [Localize( beast )|U]"
  legend_chronicle_raised_by_animals_desc: "[protagonist.GetNameNoTooltip|U] được nuôi dưỡng bởi một [Localize( beast )|U], và trải nghiệm khắc nghiệt giữa thiên nhiên do [protagonist.GetFaith.CreatorNamePossessive|U] tạo dựng đã khiến [protagonist.GetHerHim] được trời phú để cai trị."
  legend_auspicious_birth: "Sự Ra Đời Cát Tường"
  legend_auspicious_birth_desc: "[protagonist.GetNameNoTooltip|U] ra đời khi bầu trời đêm tràn ngập những vì sao điềm lành, một dấu hiệu rõ ràng cho những đại nghiệp mà [protagonist.GetSheHe] được định sẵn."
  legend_virgin_birth: "Sự Thụ Thai Vô Nhiễm"
  legend_virgin_birth_desc: "[protagonist.GetMother.GetNameNoTooltip|U] somehow came to carry a child without consummating with [protagonist.GetMother.GetHerHis] husband. Truly, this is a sign that [protagonist.GetFaith.HighGodName|U] [protagonist.GetFaith.HighGodHerselfHimself] gifted [protagonist.GetMother.GetHerHim] with a child."
  legend_sacred_birth_name: "Sự Ra Đời [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] của [protagonist.GetFirstNamePossessiveNoTooltip|U]"
  legend_sacred_birth_desc: "Hoàn cảnh ra đời của [protagonist.GetNamePossessiveNoTooltip] được bao phủ bởi màu sắc huyền bí, một dấu hiệu chắc chắn rằng [protagonist.GetSheHe] đã được [protagonist.GetFaith.HighGodName|U] ban phúc ngay từ thuở ban đầu."
  legend_divine_intervention_name: "Được [Localize( god )|U] Ban Phúc"
  legend_divine_intervention_desc: "[protagonist.GetNameNoTooltip|U] spoke with [Localize( god )] in [protagonist.GetHerHis] sleep, thrusting a divine mission upon [protagonist.GetHerHim]."
  legend_fought_devil_name: "Trận Chiến với [protagonist.GetFaith.DevilName|U]"
  legend_fought_devil_desc: "Trong một giấc mơ, [protagonist.GetNameNoTooltip] đã chiến đấu với [protagonist.GetFaith.DevilName] [protagonist.GetFaith.DevilHerselfHimself], một điềm lành cho thấy [protagonist.GetSheHe] được định mệnh giao phó việc tiêu diệt cái ác."
  legend_exotic_backstory_name: "Chuyến Phiêu Lưu của [protagonist.GetNamePossessiveNoTooltip|U]"
  legend_exotic_backstory_desc: "[protagonist.GetName] từng du hành rất xa, đến tận [Localize( location.GetString )] rồi quay trở lại."
  pilgrim_legend_name: "Người Hành Hương của Thế Gian"
  pilgrim_legend_desc: "[ancestor.GetNamePossessive|U] đã hiến dâng cuộc đời [ancestor.GetHerHis] cho hành trình gian nan không hồi kết đến [ancestor.GetFaith.PositiveAfterLife]. Chỉ có [ancestor.GetFaith.HighGodName|U] mới thực sự biết hết mọi việc đã xảy ra trên con đường cứu rỗi thiêng liêng của [ancestor.GetFirstNamePossessiveNoTooltip]."
  consecrated_blood_legend: "Dòng Máu Thánh"
  consecrated_blood_legend_desc: "[founder.GetNamePossessive|U] chảy trong huyết quản của mọi thành viên gia tộc [dynasty.GetName]. Lòng sùng kính của chúng ta đối với [founder.GetFaith.HighGodName|U] là tuyệt đối, và mọi hành động của chúng ta đều chỉ nhân danh [founder.GetFaith.HighGodHerHis|U]."
  dyn_many_crown_legend: "Chủ Quyền của Nhà [dynasty.GetNameNoTooltip|U]"
  dyn_many_crown_legend_desc: "Dù do số phận hay do sắp đặt, quyền lực vẫn rơi vào tay nhà [dynasty.GetName]. Lãnh thổ của chúng ta rộng lớn, chiến công của chúng ta lẫy lừng, và quyền thống trị các ngai vàng trên thế giới đã được định sẵn."
  legend_of_rome_name: "Một Caesar Mới"
  legend_of_israel_name: "[founder.GetTitleAsNameNoTooltip|U] Mới của Israel"
  legend_of_slavia_name: "Đế Quốc của Người Slav"
  legend_of_n_sea_name: "Bá Quyền Biển Cả"
  legend_of_mann_name: "Hải Tặc [founder.GetTitleAsNameNoTooltip|U]"
  legend_of_genghis_name: "Đại Hãn Vĩ Đại Nhất"
  new_title_name: "Một [founder.GetTitleAsNameNoTooltip|U] Mới"
  jewish_priesthood_name: "Lời Tiên Tri Ứng Nghiệm"
  zoroast_priesthood_name: "Thắp Lại Ngọn Lửa"
  priesthood_restoration_name: "Một Tăng Lữ Đoàn Mới"
  iberian_ender_name: "Số Phận của [GetTitleByKey('e_spain').GetNameNoTierNoTooltip|U]"
  persian_ender_name: "Số Phận của [GetTitleByKey('e_persia').GetNameNoTierNoTooltip|U]"
  struggle_conclusion_name: "Hồi Kết của [Localize(struggle.GetString)|U]"
  legendary_battle_name: "Trận Chiến tại [location.GetName|U]"
  reformed_faith: "Sự Củng Cố của [religion.GetNameNoTooltip|U]"
  new_faith_legend_name: "[faith.GetNameNoTooltip|U] Khải Hoàn"
  khan_beater_name: "Kẻ Trừng Phạt Các Đại Hãn"
  legend_of_rome_desc: "La Mã, từng suy tàn chỉ còn là ký ức xa xôi, nay trỗi dậy một lần nữa với một Caesar mới, sẵn sàng mang nền văn minh trở lại và mở ra một kỷ nguyên mới."
  legend_of_israel_desc: "Israel, một vương quốc dành cho dân tộc được Chúa chọn, từng bị khuất phục bởi người Assyria, Babylon và La Mã. Cuộc lưu đày khỏi Đất Hứa đã đưa dân tộc chúng ta đi khắp thế giới, nhưng nay một Vương quốc Israel mới trỗi dậy và dân Chúa lại một lần nữa cư ngụ trên vùng đất của mình!"
  legend_of_slavia_desc: "Các dân tộc Slav đã lan rộng khắp châu Âu, nhưng giờ đây [founder.GetFirstName] đứng lên như vị [founder.GetTitleAsNameNoTooltip|U] đầu tiên của toàn thể người Slav!"
  legend_of_n_sea_desc: "Biển Bắc từng là lãnh địa của người Đan Mạch, và nay dưới sự cai trị của [founder.GetName], một đế quốc vươn lên trên những con sóng."
  legend_of_mann_desc: "Trên những con sóng quanh Britannia, các thủy thủ kể lại những câu chuyện về một tên cướp biển vĩ đại và đáng sợ mang tước vị [founder.GetTitleAsNameNoTooltip], kẻ khủng khiếp mang tên [founder.GetName]. Ngay cả những chiến binh dũng mãnh nhất cũng tái mặt khi thấy những con thuyền ấy xuất hiện trên bờ biển. Đầu hàng hẳn sẽ là lựa chọn duy nhất, nếu như [founder.GetTitleAsNameNoTooltip|U] chịu chấp nhận điều đó."
  legend_of_genghis_desc: "All that is under the sky belongs to the greatest of all Khans. With the Mongol people united behind one [founder.GetTitleAsNameNoTooltip|U], wolves howl and eagles cry as Genghis Khan burns [founder.GetHerHis] name across the world."
  new_title_desc: "Một [founder.GetTitleAsNameNoTooltip|U] mới trỗi dậy từ tro tàn, mang lại phồn vinh dưới sự cai trị nhân từ của [founder.GetHerHis]."
  jewish_priesthood_desc: "Cuộc lưu vong từng được cho là vĩnh viễn, nhưng dưới sự lãnh đạo của [founder.GetName], một Thượng Tế Đoàn mới đã xuất hiện để dẫn dắt dân tộc [faith.GetName] bước vào một kỷ nguyên mới tươi sáng hơn."
  zoroast_priesthood_desc: "Đức tin Hỏa giáo từng được dẫn dắt bởi các Magi vĩ đại trong quá khứ, nhưng giáo đoàn ấy đã bị giải thể. Nhờ ân sủng của Ahuramazda, Anahita và Mithra, [protagonist.GetName] đã khôi phục lại các Magi."
  priesthood_restoration_desc: "Đức tin [faith.GetName] đã bị thời gian tàn khốc thiêu rụi thành tro bụi. Nay, nhờ ân điển của [faith.HighGodName|U], [founder.GetName] tái thiết lại hàng giáo sĩ."
  iberian_ender_desc: "Những tranh chấp không hồi kết của giới quý tộc Iberia đã chấm dứt, và [struggle_ender.GetFirstName] xuất hiện như vị cứu tinh của họ. [struggle_ender.GetTitleAsNameNoTooltip|U] chiến thắng."
  struggle_conclusion_desc: "Cuộc [Localize(struggle.GetString)|U] cuối cùng đã kết thúc, và [struggle_ender.GetFirstName] nổi lên như người anh hùng, mở ra một kỷ nguyên mới cho khu vực."
  khan_beater_desc: "Nhân vật huyền thoại 'Thành Cát Tư Hãn' được định mệnh là sẽ thống nhất mọi thứ dưới bầu trời vào đế quốc của [loser.GetHerHis], nhưng vị [winner.GetTitleAsNameNoTooltip|U] hùng mạnh đã bị cản bước bởi người anh hùng [winner.GetName]!"
  legendary_battle_desc: "[loser.GetName|U] tìm cách tiêu diệt [winner.GetName], và [loser.GetSheHe] quả thực là một đối thủ xứng tầm. Khi [winner.GetFirstNameNoTooltip] giành chiến thắng, sẽ không có hồi kết cho những chiến công liều lĩnh của [winner.GetHerHis]!"
  reformed_faith_desc: "Tôn giáo có tổ chức từng đe dọa hủy diệt những tín ngưỡng cổ xưa, nhưng dưới sự dẫn dắt khôn ngoan và mộ đạo của [reformer.GetName], đức tin [faith.GetName] đã bước vào một kỷ nguyên mới. Những truyền thuyết nay được hệ thống hóa trong thánh điển và một tầng lớp giáo sĩ có tổ chức được thiết lập, ý chỉ của [faith.HighGodNamePossessive] sẽ được thực thi!"
  new_faith_legend_desc: "Giáo hội suy đồi và mục ruỗng đã lạc xa khỏi ý chỉ của [faith.HighGodNamePossessive] dành cho nhân loại. Dưới sự dẫn dắt thiêng liêng của [reformer.GetName], đức tin chân chính duy nhất là [faith.GetName] đã ra đời."

