  legend_chronicle_war_won_chronicle: "Cuộc Chinh Phạt [title.GetNameNoTooltip]"
  legend_chronicle_war_won_chronicle_desc: "[winner.GetTitledFirstName] đã chính danh chinh phục [title.GetName] từ kẻ không xứng đáng là [loser.GetFirstName]."

  legend_chronicle_new_title: "Sự Khai Sinh của [title.GetNameTooltip]"
  legend_chronicle_new_title_desc: "Bằng ý chí, sức mạnh và mưu lược của [founder.GetName], [title.GetName] đã được khai sinh và sẽ không bao giờ suy tàn!"

  legend_chronicle_great_deed_faith: "Chiến Thắng Tinh Thần của [new_faith.GetNameNoTooltip]"
  legend_chronicle_great_deed_faith_desc: "Được dẫn dắt bởi đức tin của [founder.GetHerHis] vào [new_faith.HighGodName], [founder.GetName] đã đưa các tín đồ [new_faith.GetAdherentNamePlural] đến chiến thắng trước những kẻ theo [old_faith.GetAdherentName], dưới sự lãnh đạo của tên độc ác [antagonist.GetName]"

  legend_chronicle_great_deed_title: "Đại Công Trạng cho [title.GetNameNoTooltip]"
  legend_chronicle_great_deed_title_desc: "Trong suốt lịch sử của [title.GetName], chưa từng có vị quân chủ nào đạt được nhiều thành tựu như vậy, và sẽ không ai được nhắc đến trước vĩ nhân [founder.GetName]."

  legend_chronicle_great_deed_region: "Anh Hùng Đích Thực của [legend_region.GetNamePossessiveNoTooltip]"
  legend_chronicle_great_deed_region_desc: "There is nay a soul in [legend_region.GetName] that does not know the name of [founder.GetName] and [founder.GetHerHis] accomplishments."

  legend_chronicle_great_deed_dynasty: "Chiến Công Vĩ Đại cho Gia Tộc [dynasty.GetNameNoTooltip]"
  legend_chronicle_great_deed_dynasty_desc: "Ít ai mang họ [dynasty.GetName] đã làm được nhiều điều cho gia tộc của mình như [founder.GetName]."

  legend_chronicle_valiant_defense: "Cuộc Phòng Thủ Anh Dũng"
  legend_chronicle_valiant_defense_desc: "Trước mọi nghịch cảnh, [defender.GetName] đã đẩy lùi đoàn quân của [attacker.GetName]."

  legend_chronicle_tournament_won: "Ba Chiến Thắng của [winner.GetFirstNameNoTooltip]"
  legend_chronicle_tournament_won_desc: "Tại đấu trường của [location.GetName], đấu sĩ tối thượng [winner.GetName] đã lần thứ ba giành chiến thắng trong giải đấu. Không một sinh linh nào trên thế gian có thể sánh kịp [winner.GetHerHim]."

  legend_chronicle_accolade_chronicle: "Hiệp Sĩ Dũng Mãnh Nhất của [founder.Custom( 'KnightCulturePluralNoTooltip' )]"
  legend_chronicle_accolade_chronicle_desc: "[founder.GetName|U] sở hữu nhiều [founder.Custom( 'KnightCulturePluralNoTooltipLowercase' )] vĩ đại, nhưng không ai vượt qua được [first_accolade_knight.GetName] của [first_accolade.GetName]."
 
  legend_conqueror_chronicle: "$legend_chronicle_conqueror_chronicle$"
  legend_conqueror_chronicle_desc: "$legend_chronicle_conqueror_chronicle_desc$"
  legend_chronicle_conqueror_chronicle: "Kẻ Chinh Phục Vĩ Đại Nhất"
  legend_chronicle_conqueror_chronicle_desc: "Không còn là kẻ lang thang. Một Kẻ Chinh Phục đã được sinh ra từ một linh hồn bất khuất."
  legend_chapter_opening_conqueror: "Từ tro tàn, sẽ không có gì được tái sinh. [ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip] thề sẽ trở thành tai họa của [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], đứng trên mảnh đất nhuộm đỏ máu. Và từ nay về sau, đất đai sẽ chỉ còn một màu đỏ thẫm."
  legend_chapter_famous_deed_conqueror: "Hết trận này đến trận khác, tiếng hô vang ngày càng lớn. Hết trận này đến trận khác, chiến lợi phẩm ngày càng nhiều. Hết trận này đến trận khác, huyền thoại của [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] ngày càng rực rỡ."

