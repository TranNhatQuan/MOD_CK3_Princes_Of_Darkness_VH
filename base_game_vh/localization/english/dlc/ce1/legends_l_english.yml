  legend_events.1000.t: "Gửi tới [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('legend_owner'))] [ROOT.Char.GetTitledFirstNameNoTooltip],"
  legend_events.1000.desc: "Thật đáng xấu hổ! Thật dối trá! Ta đã đưa vàng cho ngươi để quảng bá huyền thoại của ta, vậy mà ngươi lại đáp trả bằng cách vứt bỏ nó như một con chó bệnh."
  legend_events.1000.a: "#EMP Gah!#! Cứ cầm lấy."
  legend_events.1000.b: "Ta chắc chắn là nó #EMP rẻ hơn nhiều#!."
 
