  legend_events.0001.t: "Sử Quan: Phát Hiện Một Huyền Thoại"
  legend_events.0001.desc.intro: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vội vã, đầy phấn khích chạy đến chào đón ta khi ta bước vào triều đình.\n\n"
  legend_events.0001.desc.mid.slew_dragon: ""Ta mang đến tin tuyệt vời, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U]! Ta đã tìm kiếm các thư tịch và truyền thuyết về [legend_character.GetName], và ta có cơ sở để tin rằng [legend_character.GetSheHe] đã chiến đấu và giết chết một con rồng!"
  legend_events.0001.desc.mid.ancestral_saint: ""[ROOT.Char.GetFaith.HighGodName|U] đang mỉm cười với gia tộc của ngài hôm nay, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U]. Ta đã tìm hiểu về vị tổ tiên cát tường của ngài là [legend_character.GetName], và ta đã tìm được những thông tin có thể khiến [legend_character.GetHerHim] xứng đáng được tôn phong làm một [GetTrait('saint').GetNameNoTooltip( ROOT.Char )]!"
  legend_events.0001.desc.mid.godly_descent: "[chronicler.GetSheHe|U] falls to [chronicler.GetHerHis] knees and kisses my feet. "Oh, holiest [ROOT.Char.GetTitleAsNameNoTooltip|U]. I have a strong reason to suspect that you are a blood descendant of [ROOT.Char.GetFaith.HighGodName|U] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
  legend_events.0001.desc.mid.old_godly_descent: ""Chào ngài, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], hay ta nên gọi ngài là '[ROOT.Char.Custom('GetDaughterSon')|U] của [legend_character.GetFaith.HighGodName|U]'? Thật vậy, ta đã tra cứu các ghi chép và tin rằng 'vị thần' của tổ tiên ngài thực chất là một phàm nhân anh hùng, người đã lập nên vô số chiến công vĩ đại."
  legend_events.0001.desc.mid.raised_by_animals: ""Chào ngài, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U]. Ngài còn nhớ bao nhiêu về thời thơ ấu của mình? Một số thư tịch trong kho lưu trữ cho thấy rằng ngài thực sự đã được nuôi lớn trong hoang dã bởi [ROOT.Char.Custom('GetAnimalPlural')]."
  legend_events.0001.desc.mid.auspicious_stars: ""[ROOT.Char.GetFaith.HighGodName|U] đang mỉm cười với chúng ta hôm nay, thưa [ROOT.Char.GetTitleAsNameNoTooltip], cũng như [ROOT.Char.GetFaith.HighGodNameSheHe] đã làm vào ngày ngài chào đời. Thật vậy, ngài sinh ra dưới những vì sao cát tường — điềm báo cho những đại nghiệp mà ngài sẽ hoàn thành trong cuộc đời."
  legend_events.0001.desc.mid.virgin_birth: ""[ROOT.Char.GetFaith.HighGodName|U] đang mỉm cười với chúng ta hôm nay, thưa [ROOT.Char.GetTitleAsNameNoTooltip], cũng như [ROOT.Char.GetFaith.HighGodNameSheHe] đã mỉm cười với mẫu thân của ngài khi ngài được thụ thai. Thật vậy, ngài không phải là con hoang — mẹ ngài đã được ban phúc với một sự thụ thai tinh khiết!"
  legend_events.0001.desc.mid.spoke_to_angels: ""Ta nhớ nhiều đêm trước đây khi ngài kể rằng mình được các thiên thần viếng thăm. Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], ta có lý do để tin rằng đó không phải là giấc mơ, mà là một khải tượng đến từ [ROOT.Char.GetFaith.PositiveAfterLife]."
  legend_events.0001.desc.mid.fought_the_devil: ""Ta biết rằng gần đây ngài thường xuyên bị dày vò bởi những cơn ác mộng. Ta có lý do để tin rằng những thị kiến ấy là ký ức vụn vỡ về trận chiến của ngài với [ROOT.Char.GetFaith.DevilName] tại [ROOT.Char.GetFaith.NegativeAfterLife]."
  legend_events.0001.desc.mid.exotic_backstory: ""Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], ngài chưa bao giờ thực sự cảm thấy mình là một [ROOT.Char.GetCulture.GetName] [ROOT.Char.GetWomanMan] trọn vẹn, đúng không? Ta tin rằng nhiều năm về trước, ngài đã đến từ một vùng đất huyền bí xa xôi."
  legend_events.0001.desc.mid.ancient_people: ""Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], ta đã tra cứu các ghi chép và tìm thấy những thông tin cho thấy dòng dõi của ngài có thể truy ngược về tận các triều đại vĩ đại của [ancient_culture.GetName]!"
  legend_events.0001.desc.outro: "Có người sẽ cho rằng những điều này hơi viển vông và cần không ít công sức để chứng minh là sự thật, nhưng nền tảng đã đủ vững chắc để biến ngài thành một huyền thoại sống!""
  legend_events.0001.a: "Làm rất tốt!"
  legend_events.0001.b: "Ngay cả ta cũng thấy điều này khó tin."
  legend_events.0010.t: "$chronicler_court_position$: Huyền Thoại Lan Truyền"
  legend_events.0010.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] greets me at court this morning, eager with news on the tip of [chronicler.GetHerHis] tongue.\n\n"My [ROOT.Char.GetTitleAsNameNoTooltip|U], I believe that [potential_promoter.Custom2('YourCharacterIntroduction', ROOT.Char)] is almost convinced of the veracity of [ROOT.Char.GetPromotedLegend.GetName]! [potential_promoter.GetSheHe|U] is aware of the tale and seems entirely enraptured by it, but is unconvinced of the truth behind it.""
  legend_events.0010.a: "Có lẽ [potential_promoter.GetSheHe] có thể bị thuyết phục thêm."
  legend_events.0010.a.success: "[potential_promoter.GetName] đã bị thuyết phục"
  legend_events.0010.a.failure: "[potential_promoter.GetName] không bị thuyết phục"
  legend_events.0010.b: "Có lẽ bẻ cong sự thật sẽ khiến [potential_promoter.GetHerHim] tin tưởng."
  legend_events.0010.c: "[potential_promoter.GetSheHe|U] may think whatever [potential_promoter.GetSheHe] likes."

  legend_events.0020.t: "Chiếm Dụng Huyền Thoại"
  legend_events.0020.desc: "Một vị khách ngoại bang tiến đến ngai vàng của ta và lớn tiếng tuyên bố:\n\n""Đã một thời gian kể từ khi ta đến triều đình của ngài. Ta đã cẩn thận quan sát cách ngài cai trị và xử lý mọi việc trong lãnh thổ, từ nhỏ nhặt đến trọng đại. Và ta không gì khác ngoài sự khâm phục sâu sắc.\n\nTrong số người [seed_presenter.GetCulture.GetCollectiveNoun], có một câu chuyện cổ về một vị quân vương huyền thoại thuộc một dòng dõi danh giá. Đó là câu chuyện mà mẹ ta đã kể cho ta nghe khi bà còn trẻ, và bà đã nghe nó từ mẹ mình từ rất lâu về trước.\n\nVà giờ đây, ta vô cùng vinh hạnh được nói với ngài rằng ta tin ngài chính là vị [ROOT.Char.GetTitleAsNameNoTooltip|U] huyền thoại trong những truyền thuyết của [seed_presenter.GetCulture.GetPrefix]. Và ta tin rằng bất kỳ người con chân chính nào của [seed_presenter.GetCulture.GetName] cũng sẽ đồng ý với ta!"" 
  legend_events.0020.a: "Đúng vậy! Các bậc trưởng lão của ngươi đã nói về [ROOT.Char.GetDynasty.GetNameNoTooltip]!"
  legend_events.0020.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] chính là chủ đề của những truyền thuyết [seed_presenter.GetCulture.GetPrefixNoTooltip]."
  legend_events.0020.c: "Một vị quân vương [ROOT.Char.GetCulture.GetPrefixNoTooltip] không quan tâm đến những lời lảm nhảm của đám nông dân [seed_presenter.GetCulture.GetCollectiveNounNoTooltip]."

