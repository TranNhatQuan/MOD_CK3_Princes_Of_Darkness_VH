 #Legend Chapters
  legend_chapter_opening_generic: "Huyền thoại về [ROOT.Legend.GetProtagonist.GetNameNoTooltip] vĩ đại và rộng lớn như chính thế giới, bởi những chiến công của [ROOT.Legend.GetProtagonist.GetHerHis] là vô song."
  legend_chapter_extra_deed_memory: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip], tuy nhiên, chưa dừng lại ở đó, bởi [ROOT.Legend.GetProtagonist.GetSheHe] còn tiếp tục và với lòng dũng cảm to lớn đã [ROOT.Legend.MakeScope.Var('extra_deed_memory').CharacterMemory.GetThirdPerspectiveDescription]."
  legend_chapter_motivation_generic: "Khi nghe những tin đồn mơ hồ đang gieo tai họa khắp vùng đất, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] đã đặt trọn tâm huyết của [ROOT.Legend.GetProtagonist.GetHerHis] vào việc hoàn thành thử thách khó khăn ấy."
  legend_chapter_motivation_evil: "Không phải những lời van xin của dân chúng hay sự tuyệt vọng bao trùm vùng đất khiến [ROOT.Legend.GetProtagonist.GetHerHim] tìm kiếm phiêu lưu, mà là khát khao xuất phát từ chính trái tim đen tối của [ROOT.Legend.GetProtagonist.GetHerHis]."
  legend_chapter_motivation_peasant: "Khi một người nông dân nghèo khổ, tuyệt vọng và rơi lệ xin được diện kiến [ROOT.Legend.GetProtagonist.GetHerHim], người mộ đạo [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] không thể bỏ mặc lời cầu khẩn ấy và nhanh chóng lên đường phiêu lưu."
  legend_chapter_motivation_spouse: "Khi người phối ngẫu của [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] đến gặp [ROOT.Legend.GetProtagonist.GetHerHim] vào một buổi sáng với những tin đồn đáng lo ngại, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] lập tức hành động và hứa sẽ tôn vinh tình yêu vĩnh cửu của họ."
  legend_chapter_motivation_honor_lady: "When [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] eyes met [ROOT.Legend.GetProtagonist.GetHerHis] lover's it was all decided. Listening to the pleas of help and wanting to prove how great [ROOT.Legend.GetProtagonist.GetHerHis] bravery was, [ROOT.Legend.GetProtagonist.GetSheHe] set out on an adventure."
  legend_chapter_discovery_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] do thám [Localize( location )] cùng đoàn tùy tùng của [ROOT.Legend.GetProtagonist.GetHerHis], và không mất nhiều thời gian để [ROOT.Legend.GetProtagonist.GetHerHim] tìm ra chính xác địa điểm đó."
  legend_chapter_hunt_generic: "[Localize( beast )] đã ở đó sẵn, đang uống nước từ một con suối. Nó ngẩng đầu lên và nhanh chóng lao về phía [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]. Đói khát. Nhưng [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] nhanh hơn, và với một nhát đánh gọn gàng, [ROOT.Legend.GetProtagonist.GetSheHe] đã hạ sát con quái thú."
  legend_chapter_battle_generic: "The battle was fierce. [ROOT.Legend.GetProtagonist.GetNameNoTooltip] met [loser.GetNameNoTooltip] in the middle of the field, [ROOT.Legend.GetProtagonist.GetHerHis] eyes filled with valor. [ROOT.Legend.GetProtagonist.GetSheHe|U] raised [ROOT.Legend.GetProtagonist.GetHerHis] weapon, and struck a blow on [ROOT.Legend.GetProtagonist.GetHerHis] enemy's chest. Blood flowed. Victory."
  legend_chapter_conclusion_generic: "Hành trình trở về quê hương không hề dễ dàng, nhưng [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] tiến vào thành phố giữa những tiếng hò reo khải hoàn. Và giờ đây, hãy cùng nhau vui mừng và yến tiệc, bởi huyền thoại của [ROOT.Legend.GetProtagonist.GetHerHis] đáng được tôn vinh!"
  legend_chapter_famous_deed_generic: "Huyền thoại của [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] đạt đến đỉnh cao trong một cuộc phiêu lưu kỳ diệu: những chiến công võ dũng của [ROOT.Legend.GetProtagonist.GetHerHis] vĩ đại đến mức mọi vị vua đều kinh ngạc, và vô số quý tộc lẫn thường dân tìm đến diện kiến [ROOT.Legend.GetProtagonist.GetHerHis], bởi họ khao khát được tận mắt chứng kiến huyền thoại."
  legend_chapter_extra_deed_generic: "However, that was not the end of the tale, for when [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] made [ROOT.Legend.GetProtagonist.GetHerHis] way home, [ROOT.Legend.GetProtagonist.GetSheHe] helped those in danger and avenged their affronts. Bandits, beasts and evildoers could not hide from the fury of [ROOT.Legend.GetProtagonist.GetHerHis] blade."
  legend_chapter_opening_debug: "#D Chương mở đầu#!"
  legend_chapter_motivation_debug: "#D Chương động cơ#!"
  legend_chapter_discovery_debug: "#D Chương khám phá#!"
  legend_chapter_hunt_debug: "#D Chương săn bắn#!"
  legend_chapter_battle_debug: "#D Chương chiến đấu#!"
  legend_chapter_famous_deed_debug: "#D Chương chiến công lừng danh#!"
  legend_chapter_extra_deed_debug: "#D Chương chiến công bổ sung#!"
  legend_chapter_conclusion_debug: "#D Chương kết luận#!"

  legend_chapter_motivation_delicious_meats: "[Localize( beast )] vốn nổi tiếng hung dữ và nguy hiểm, nhưng mục đích của [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] thì không thể lay chuyển. [ROOT.Legend.GetProtagonist.GetSheHe|U] nhất quyết muốn nếm thử thịt của nó, và thúc ép [ROOT.Legend.GetProtagonist.GetHerselfHimself] tiến lên để hoàn thành giấc mơ ấy."
  legend_chapter_motivation_dead_parent: "[Localize( beast )] quả thực là một sinh vật cực kỳ nguy hiểm, nhưng trái tim của [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] thì vô cùng kiên định. [ROOT.Legend.GetProtagonist.GetSheHe|U] mang mối thù cá nhân với con vật này, bởi người ta đồn rằng chính nó đã giết chết cha/mẹ của [ROOT.Legend.GetProtagonist.GetHerHis]."
  legend_chapter_motivation_great_venator: "Vào thời điểm này, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đã lừng danh khắp vùng đất như thợ săn vĩ đại nhất, nhưng với [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U] dũng cảm, sự thật ấy vẫn cần được chứng minh thêm lần nữa."
  legend_chapter_motivation_accomplished_hunter: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] was determined to prove [ROOT.Legend.GetProtagonist.GetHerHis] worth as a hunter. [ROOT.Legend.GetProtagonist.GetSheHe|U] finally got the chance to show off [ROOT.Legend.GetProtagonist.GetHerHis] skill, as the mighty [Localize( beast )] drew closer."
  legend_chapter_discovery_befriended_cyclops: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] tỏ ra thân thiện với mọi giống loài kỳ lạ và khác thường gặp trên đường, thậm chí còn kết bạn với một tên cyclops to lớn và cáu kỉnh!"
  legend_chapter_discovery_cyclops: "As [ROOT.Legend.GetProtagonist.GetSheHe] journeyed, [ROOT.Legend.GetProtagonist.GetSheHe] met the most exotic and unusual of people, culminating in discovering the existence of a mighty cyclops!"
  legend_chapter_discovery_renowned_herbalist: "Vốn đã nổi tiếng với tư cách một thảo dược gia, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] lại càng thêm lẫy lừng khi [ROOT.Legend.GetProtagonist.GetSheHe] phát hiện ra một lùm cây chết chóc và len lỏi qua những dây leo độc hại của nó."
  legend_chapter_discovery_evil_plants: "Những chuyến du hành của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] ngay từ đầu đã đầy rẫy hiểm nguy. [ROOT.Legend.GetProtagonist.GetSheHe|U] thậm chí còn bị tấn công bởi một lùm cây độc, phấn hoa của chúng khiến bất kỳ ai đến gần cũng choáng váng và mê muội."
  legend_chapter_discovery_legendary_archer: "Những chuyến đi của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] đưa [ROOT.Legend.GetProtagonist.GetHerHim] tới một vùng đất có một cung thủ khoác lác, kẻ đã thách thức [ROOT.Legend.GetProtagonist.GetLadyLord] vào một cuộc thi bắn cung. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] lập tức chẻ đôi mũi tên của đối thủ bằng chính mũi tên của [ROOT.Legend.GetProtagonist.GetHerHis]!"
  legend_chapter_discovery_archery_contest_won: "Những chuyến đi của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] đưa [ROOT.Legend.GetProtagonist.GetHerHim] tới một vùng đất có một cung thủ khoác lác, kẻ đã thách thức [ROOT.Legend.GetProtagonist.GetLadyLord] vào một cuộc thi bắn cung. Cuộc tranh tài vô cùng gay cấn, nhưng cuối cùng [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] đã chứng tỏ những phát bắn của mình chính xác hơn."
  legend_chapter_discovery_bog_stronk: "Con đường của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] đưa [ROOT.Legend.GetProtagonist.GetHerHim] băng qua địa hình hiểm trở, nơi mà chính mặt đất cũng cố nuốt chửng [ROOT.Legend.GetProtagonist.GetHerHim]. Chỉ nhờ sức mạnh phi thường của [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] mà [ROOT.Legend.GetProtagonist.GetHerHim] mới có thể thoát ra."
  legend_chapter_discovery_bog_struggle: "Con đường của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] đưa [ROOT.Legend.GetProtagonist.GetHerHim] băng qua địa hình hiểm trở, nơi mà chính mặt đất cũng cố nuốt chửng [ROOT.Legend.GetProtagonist.GetHerHim]. Vật lộn dữ dội, cuối cùng [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] cũng tự giải thoát [ROOT.Legend.GetProtagonist.GetHerselfHimself] khỏi mảnh đất phản trắc."
  legend_chapter_discovery_wildflower_expert: "Những chuyến du hành của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] đưa [ROOT.Legend.GetProtagonist.GetHerHim] tới những vùng đất mới lạ và kỳ dị, nơi ngay cả thực vật cũng xa lạ và khác thường. Thật vậy, [ROOT.Legend.GetProtagonist.GetSheHe] thậm chí còn bắt gặp một loài cây chưa từng được thấy trước đây hay kể từ đó, ẩn mình trong những bụi rậm rợp lá."
  legend_chapter_discovery_cannibal_scarred: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] traveled far and wide, and was even set upon by ravenous cannibals! [ROOT.Legend.GetProtagonist.GetSheHe|U] vanquished scores of them, the scars on [ROOT.Legend.GetProtagonist.GetHerHis] face testament to the struggle for the rest of [ROOT.Legend.GetProtagonist.GetHerHis] days."
  legend_chapter_discovery_cannibal_fight: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] chu du khắp nơi, và thậm chí còn bị những kẻ ăn thịt người đói khát tấn công! Cuộc giao tranh kéo dài cho tới khi mặt trời lặn, để lại vị anh hùng của chúng ta kiệt sức khi những kẻ còn sống sót bỏ chạy."
  legend_chapter_battle_enemy_commander: "Giữa vòng hỗn chiến, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đối mặt trực diện với chính tên chỉ huy địch khốn kiếp! Sau một trận đấu tay đôi long trời lở đất, kẻ đê tiện ấy đã bị [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đánh gục, máu chảy dọc theo lưỡi kiếm của [ROOT.Legend.GetProtagonist.GetHerHis] khi trận chiến vẫn cuộn xoáy xung quanh."
  legend_chapter_battle_faked_retreat: "Tài thao lược của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] được thử thách trong lửa đạn chiến trường, nhưng [ROOT.Legend.GetProtagonist.GetSheHe] đã chứng minh [ROOT.Legend.GetProtagonist.GetHerselfHimself] hoàn toàn xứng đáng. Một cuộc rút lui giả xảo quyệt dụ quân địch vào thế dễ tổn thương, chỉ để vị anh hùng dũng cảm của chúng ta tiến lên lần nữa và chém ngã chúng."
  legend_chapter_battle_flanking_success: "Lối điều binh hung hãn và xuất sắc của [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] một lần nữa được thể hiện trên chiến trường, khi [ROOT.Legend.GetProtagonist.GetSheHe] đích thân dẫn đầu một đòn đánh bọc sườn như sấm sét. Quân địch hèn nhát dao động rồi tháo chạy, chỉ một đòn quyết định đã định đoạt cục diện."
  legend_chapter_battle_ravished_maiden: "Không bao giờ bỏ mặc kẻ vô tội, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] còn tìm được thời gian giữa trận chiến để không chỉ cứu giúp mà thậm chí còn #EMP chiếm đoạt#! một thường dân xinh đẹp vô tình lạc vào vòng nguy hiểm!"
  legend_chapter_battle_maiden_kiss: "Khi bắt gặp một thường dân yếu đuối — nhưng thực sự nổi bật — giữa vòng hỗn chiến, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đã lao tới và đưa họ ra khỏi nguy hiểm. Vị anh hùng của chúng ta lập tức được đền đáp bằng một nụ hôn, điều hoàn toàn xứng đáng với một [ROOT.Legend.GetProtagonist.GetWomanMan] hào hiệp như vậy!"
  legend_chapter_battle_wounded: "Trận chiến vô cùng khốc liệt và giao tranh tàn bạo. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] phải chịu nhiều thương tích kéo dài; một cái giá nhỏ phải trả cho một [ROOT.Legend.GetProtagonist.GetWomanMan] có niềm tin và danh dự lớn lao như vậy!"
  legend_chapter_battle_reinforcement_arrival: "When the battle reached its crescendo, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [ROOT.Legend.GetProtagonist.GetHerselfHimself] arrived at the head of a host of reinforcements. The battle thusly turned in favor of our brave hero, who led the charge deep into enemy ranks."
  legend_chapter_opening_new_faith: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] được sinh ra khi tôn giáo [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] đã lạc xa ý chí của [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive]. Các nhà thuyết giáo và [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural] rao giảng tà thuyết nhân danh [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodHerHis|U], trong khi các [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorshipPlural] thì mục nát và bị bỏ hoang. Dân chúng quay sang những tôn giáo khác, mở đường cho các đối thủ của [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive] chinh phục trái tim loài người."
  legend_chapter_motivation_new_faith: "Nhìn thấy sự suy yếu và băng hoại của đức tin, [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] đã lên đường với một viễn kiến mới cho tôn giáo [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] — một cách nhìn mới về đức tin, không cho phép bất kỳ sự lệch lạc nào khỏi ý chí của [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]; một đức tin mạnh mẽ và thống nhất, lan tỏa tới mọi ngóc ngách của thế giới!"
  legend_chapter_famous_deed_new_faith: "Tìm kiếm sự cô độc để tránh xa những lời lảm nhảm vô nghĩa của bọn dị giáo, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] đã trèo lên ngọn núi cao nhất trong toàn cõi, chỉ dựa vào lòng thương xót của [ROOT.Legend.GetProperty( 'faith' ).Faith.HealthGodName] để giữ an toàn. Tại đỉnh núi, mây trời tách ra và [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm] hiện thân trước [ROOT.Legend.GetProtagonist.GetHerHim], truyền xuống cho [ROOT.Legend.GetProtagonist.GetHerHim] một thị kiến. Thân thể gầy guộc của một [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter] già nua nằm trên giường hấp hối, cố chấp níu giữ sự sống, trong khi một [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter] mới mẻ và trẻ trung hơn đặt người tiền nhiệm của mình về cõi nghỉ ngơi. Thị kiến ấy không nghi ngờ gì nữa chính là điềm báo cho việc [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm] ban phúc cho đức tin [ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip] mới."
  legend_chapter_extra_deed_new_faith: "Nhân loại đã tạo ra quá nhiều kẻ đối địch với [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm], và [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] đã phá bỏ tất cả, qua đó tập hợp về cho [ROOT.Legend.GetProtagonist.GetHerselfHimself] một đàn tín đồ rộng lớn để dẫn dắt."
  legend_chapter_conclusion_new_faith: "Khi các [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural] được tập hợp và [ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousText|U] được viết lại từ đầu, tôn giáo [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip|U] cuối cùng đã được khôi phục theo viễn kiến của [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]!"
  legend_chapter_battle_legendary_battle: "$legendary_battle_desc$"
  legend_chapter_opening_struggle: "Sinh ra giữa cơn bão hỗn loạn tại trung tâm của [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName], [ROOT.Legend.GetProtagonist.GetNameNoTooltip] không hề hay biết rằng [ROOT.Legend.GetProtagonist.GetSheHe] sẽ là người mang lại hòa bình và trật tự cho vùng đất này."
  legend_chapter_motivation_struggle: "Seeing brother turned against brother — [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip] against [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip] — [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] uttered only "no more" to the bickering fools who would seek to shatter the region. It became clear to [ROOT.Legend.GetProtagonist.GetHerHim] that the struggles of [ROOT.Legend.GetProtagonist.GetHerHis] people must come to an end, and a new future must be carved from the remains of the [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]."
  legend_chapter_extra_deed_struggle: "In spite of all the greatness [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had achieved, there were still those who doubted [ROOT.Legend.GetProtagonist.GetHerHis] vision to solve the [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]. [ROOT.Legend.GetProtagonist.GetHerHis|U] enemies were soon defeated on the battlefields of both debate and war, until all were grovelling at [ROOT.Legend.GetProtagonist.GetHerHis] feet and begging [ROOT.Legend.GetProtagonist.GetHerHis] mercy."
  legend_chapter_conclusion_ended_struggle: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] nhận ra rằng luật lệ của thế giới vốn sai lầm, nhưng nhờ nỗ lực của [ROOT.Legend.GetProtagonist.GetHerHis], cái gọi là [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] đã chấm dứt, và vùng đất này sẽ không bao giờ còn như trước nữa. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] vươn lên như [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U], kẻ chiến thắng trước tất cả."
  legend_chapter_opening_priesthood_restoration: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] entered this world as the [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] faithful were shattered across the world in a hopeless diaspora. With visions of an almighty [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorship] towering over creation in [ROOT.Legend.GetProtagonist.GetHerHis] mind, [ROOT.Legend.GetProtagonist.GetSheHe] knew that [ROOT.Legend.GetProtagonist.GetSheHe] was charged with a holy mission from [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] to unite all [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip]."
  legend_chapter_famous_deed_religious: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] devoted [ROOT.Legend.GetProtagonist.GetHerselfHimself] to [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] and acted entirely for [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodHerHis|U] will. Every [ROOT.Legend.GetProperty( 'faith' ).Faith.GetReligion.GetAdherentNameNoTooltip|U] wandered the land with the name "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]" on their lips, telling tales of countless holy happenings in [ROOT.Legend.GetProtagonist.GetHerHis] name."
  legend_chapter_extra_deed_religious: "Tuy nhiên, câu chuyện vẫn chưa kết thúc, bởi các tín đồ vẫn bị bọn cướp và kẻ ác quấy nhiễu, thậm chí còn bị dị giáo nô dịch! [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đã giúp những người sống dưới ách bạo tàn vươn mình vào vòng tay của [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName|U], chiến thắng [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] và lũ tay sai của [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilHerHis]."
  legend_chapter_conclusion_priesthood_restored: "Các giáo sĩ được quy tụ và cuộc lưu lạc chấm dứt. Sẽ không bao giờ nữa các [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip] bị gió cuốn đi mà thiếu vắng sự dẫn dắt, khi [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] mở ra một [ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousHeadName] mới."
  legend_chronicle_opening_exotic_backstory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] traveled from the distant mystical land of [ROOT.Legend.GetProperty( 'location' ).GetFlagName] on a mission. [ROOT.Legend.GetProtagonist.GetSheHe|U] was a hero among [ROOT.Legend.GetProtagonist.GetHerHis] own people, but now [ROOT.Legend.GetProtagonist.GetSheHe] offers to bestow [ROOT.Legend.GetProtagonist.GetHerHis] benevolence unto our small corner of the vast and endless world."
  legend_chronicle_motivation_exotic_backstory: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ngắm nhìn quê hương mới của [ROOT.Legend.GetProtagonist.GetHerHis] rồi rơi lệ, bởi công nghệ và văn hóa nơi đây quá đỗi nguyên sơ so với những kỳ quan mà [ROOT.Legend.GetProtagonist.GetSheHe] đã quen thuộc tại [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. Công việc đã rõ ràng: [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] phải truyền bá ánh sáng khai minh từ quê hương của [ROOT.Legend.GetProtagonist.GetHerHis] tới góc trời này của tạo hóa."
  legend_chronicle_conclusion_exotic_backstory: "Much had changed since [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had arrived. Where once peasants rolled around in squalor and barbarians bled the land dry, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had spread the light of civilization. Though there were many rocks in [ROOT.Legend.GetProtagonist.GetHerHis] path, he collected them all as means to build a new [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. All across the realm, babes are named for [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] and the masses sing out in grateful chorus for the stranger from [ROOT.Legend.GetProperty( 'location' ).GetFlagName] who built their great city."

  legend_chronicle_divine_intervention_motivation: "[Localize( god )|U] đã nói chuyện với [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] trong cõi mộng và giao phó cho [ROOT.Legend.GetProtagonist.GetHerHim] một sứ mệnh thiêng liêng. Kể từ đó, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] không ngừng cầu nguyện và chu du khắp các vùng đất để tìm kiếm dấu hiệu về bản chất thực sự của sứ mệnh này từ [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]."
  legend_chapter_famous_deed_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đã hiến dâng [ROOT.Legend.GetProtagonist.GetHerselfHimself] cho [Localize( god )] và hành động hoàn toàn theo ý chí của [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]. Sau nhiều ngày và nhiều đêm ẩn mình trong lời cầu nguyện, cuối cùng bản chất thật sự của sứ mệnh của [ROOT.Legend.GetProtagonist.GetHerHis] đã được mặc khải cho [ROOT.Legend.GetProtagonist.GetHerHim]!"
  legend_chapter_extra_deed_divine_intervention: "Các vùng đất đầy rẫy bọn cướp vô nhân tính sẵn sàng làm hại những người có đức tin, nhưng với [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] và nhóm tín đồ của [ROOT.Legend.GetProtagonist.GetHerHis], những kẻ hầu cận của [ROOT.Legend.GetProtagonist.GetFaith.DevilName|U] đã bị xua đuổi trở về [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife|U], nơi chúng thuộc về, và dân chúng được giải phóng. [Localize( god )|U] đã mỉm cười với [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] vì những điều thiện lành mà [ROOT.Legend.GetProtagonist.GetSheHe] đã làm, và sứ mệnh thiêng liêng của [ROOT.Legend.GetProtagonist.GetHerHis] gần chạm đến cao trào."
  legend_chapter_conclusion_divine_intervention: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ruled fairly and piously, with [Localize( god )] as [ROOT.Legend.GetProtagonist.GetHerHis] guide. The divine plan fulfilled, [ROOT.Legend.GetProtagonist.GetSheHe] lived a life of great honor and piety."
  legend_chapter_opening_ancestral_glory: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] được sinh ra từ chính huyết thống và máu thịt của [ROOT.Legend.Custom('GetAncestorNamePossessiveNoTooltip')]. Với sức mạnh tự nhiên của dòng dõi vĩ đại này, liệu có từng nghi ngờ rằng [ROOT.Legend.GetProtagonist.GetSheHe] sẽ đạt được những điều lớn lao?"
  legend_chapter_motivation_ancestral_glory: "Trong tâm trí [ROOT.Legend.GetProtagonist.GetHerHis] không hề tồn tại sự hoài nghi; [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] sinh ra để thống nhất toàn bộ [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] dưới quyền cai trị của [ROOT.Legend.GetProtagonist.GetHerHis]. Nhân danh [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')], những tranh cãi của các lãnh chúa nhỏ bé sắp đi đến hồi kết, và tất cả sẽ gọi [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] là chủ quân của mình."
  legend_chapter_famous_deed_ancestral_glory: "Những kẻ ngu muội tụ tập để thách thức [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], nhưng chúng chỉ như gió trước núi. Những người theo [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] ngày một đông thêm với mỗi hành động phi thường mà [ROOT.Legend.GetProtagonist.GetSheHe] thực hiện nhân danh [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm], và [ROOT.Legend.GetProtagonist.GetSheHe] trở thành hiện thân của chính [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')]."
  legend_chapter_extra_deed_ancestral_glory: "Vùng quê tươi đẹp của [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] đã rơi vào tay bọn cướp kể từ thời của [ROOT.Legend.Custom('GetAncestorFirstNamePossessiveNoTooltip')], nhưng [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] nhanh chóng bắt tay vào việc lập lại trật tự và bảo vệ những người mà [ROOT.Legend.GetProtagonist.GetSheHe] có quyền cai trị chính đáng."
  legend_chapter_conclusion_ancestral_glory: "Hành trình đầy hiểm nguy, nhưng với tất cả những gì [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] đã làm cho [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] và dân chúng của nàng, liệu còn nghi ngờ nào rằng [ROOT.Legend.GetProtagonist.GetSheHe] được [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm|U] lựa chọn để trị vì? Từ thành thị cho đến những nông trại nghèo nhất, tất cả đều hô vang tên \"[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]\" trong niềm hân hoan tột độ!"
  legend_chapter_opening_ancient_people: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] được sinh ra trong một dòng dõi [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] vĩ đại để cai trị [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] như tổ tiên của [ROOT.Legend.GetProtagonist.GetHerHis] từng làm."
  legend_chapter_conclusion_ancient_people: "Với lao động phi thường, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] đã không ngừng nỗ lực biến [ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTooltip] thành hình mẫu hoàn hảo của [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]. Chỉ nhờ những chiến công huyền thoại của [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], dân chúng [ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTooltip] mới tự hào hô vang cội nguồn [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] của mình!"
  legend_chapter_motivation_saintly_deed: "Sứ mệnh từ [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] của [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] vô cùng rõ ràng: [ROOT.Legend.GetProtagonist.GetSheHe] sinh ra để làm nên những kỳ tích! Tất cả tín đồ của [ROOT.Legend.GetProperty('religion').Religion.GetAdherentNamePluralNoTooltip] đều giữ [ROOT.Legend.Custom('GetAncestorNameNoTooltip')] trong tim, nhưng chưa ai biết đến những phép màu mà [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] sắp sửa thực hiện!"
  legend_chapter_extra_deed_saintly_deed: "The roads of the faithful were accosted by the godless, and with a blade blessed by the almighty, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] did chase them all away. But yet wild beasts and serpents would still wander onto the path and do injury unto the faithful, so [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] did pull out [ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')] and charm [ROOT.Legend.GetProtagonist.GetFaith.CreatorNamePossessive] creations out of the lands."
  legend_chapter_conclusion_saintly_deed: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đã không ngừng cống hiến cho toàn thể [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] và chiến đấu với tay sai của [ROOT.Legend.GetProtagonist.GetFaith.DevilName] nơi trần thế, nhưng cuối cùng những gian nan của [ROOT.Legend.GetProtagonist.GetHerHis] cũng chấm dứt. Kế hoạch thiêng liêng được hoàn thành, [ROOT.Legend.GetProtagonist.GetSheHe] sống một cuộc đời đầy danh dự và mộ đạo."
  legend_chapter_opening_mythical_descent: "Like all members of the [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] family before [ROOT.Legend.GetProtagonist.GetHerHim], [ROOT.Legend.GetProtagonist.GetNameNoTooltip] was born with the blood of a [ROOT.Legend.GetProperty( 'beast' ).GetFlagName]. [ROOT.Legend.GetProtagonist.GetHerHis|U] extraordinary origins place [ROOT.Legend.GetProtagonist.GetHerHim] above all others, destined for greatness."
  legend_chapter_famous_deed_mythical_descent: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] bị thương trong một trận chiến lớn với kẻ phản diện nghi ngờ dòng dõi của [ROOT.Legend.GetProtagonist.GetHerHis], và máu thiêng của [ROOT.Legend.GetProtagonist.GetHerHis] đã thấm đẫm chiến trường. Dòng máu ấy lấp lánh như những viên ngọc mới cắt, và chỉ sau vài ngày, mảnh đất cằn cỗi đã nở rộ những đóa hoa rực rỡ."
  legend_chapter_extra_deed_mythical_descent: "This was not the end of the tale, however, as many still would doubt the divinity present in [ROOT.Legend.GetProtagonist.GetHerHis] blood. Using [ROOT.Legend.GetProtagonist.GetHerHis] great powers, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] beset [ROOT.Legend.GetProtagonist.GetHerHis] doubters with a great plague of beasts, their palaces and homes filled with ravenous barks and screams."
  legend_chapter_opening_godly_descent: "[ROOT.Legend.GetProperty( 'god' ).GetFlagName|U] fertilized [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] ancestor and brought forth the first [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] from the womb of the world. From birth, all members of the [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] family are charged with a mission from the divine, to bring prosperity and the [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] faith to all corners of [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]."
  legend_chapter_famous_deed_war_won: "Những trận chiến diễn ra không ngừng, và chiến tranh nhuộm đỏ vùng đất bằng máu của cả chính nghĩa lẫn tà ác. [ROOT.Legend.GetProperty( 'winner' ).Char.GetNameNoTooltip|U] vẫn vững vàng khi thế lực hắc ám tìm cách phá vỡ chiến lược quân sự bậc thầy của [ROOT.Legend.GetProperty( 'winner' ).Char.GetHerHis]. Cuối cùng, mọi nỗ lực của chúng đều trở nên vô ích."
  legend_chapter_conclusion_war_won: "[ROOT.Legend.GetProperty( 'loser' ).Char.GetNameNoTooltip|U] and [ROOT.Legend.GetProperty( 'loser' ).Char.GetHerHis] underlings hung their heads low beneath their broken banner and begged for [ROOT.Legend.GetProperty( 'winner' ).Char.GetFirstNamePossessiveNoTooltip] mercy. In the darker days of the war, [ROOT.Legend.GetProperty( 'winner' ).Char.GetSheHe] could only imagine [ROOT.Legend.GetProperty( 'winner' ).Char.GetHerselfHimself] as a survivor of war, but [ROOT.Legend.GetProperty( 'winner' ).Char.GetSheHe] emerges as the winner. The only winner."
  legend_chapter_motivation_new_title: "Long before the [ROOT.Legend.GetProperty( 'founder' ).Char.GetDynastyNameNoTooltip] family came to be stewards of [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip], [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] was gifted with a vision from [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.PantheonTerm]. From that moment, [ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe] knew that [ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe] was born to rule."
  legend_chapter_famous_deed_new_title: "The lands which would come to comprise [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] were pressed under the thumb of the terrible servants of [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.DevilName]. But with [ROOT.Legend.GetProperty( 'founder' ).Char.GetHerHis] great armies, [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] freed village after village after city. The people took up arms and overthrew their evil rulers in service of [ROOT.Legend.GetProperty( 'founder' ).Char.GetFirstNameNoTooltip], prepared to die for their rightful ruler. [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName] denied them their sacrifice for [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodNameSheHe|U] granted them [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodHerHis|U] divine protection. No blade could touch the growing armies of [ROOT.Legend.GetProperty( 'founder' ).Char.GetFirstNameNoTooltip] as [ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe] freed the people of [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]."
  legend_chapter_conclusion_new_title: "Những tranh cãi của các công tước và lãnh chúa vô danh cuối cùng cũng kết thúc khi [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] buộc tất cả phải quỳ gối, thề trung thành vĩnh viễn với [ROOT.Legend.GetProperty( 'founder' ).Char.GetHerHim]. Khi [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] được tái sinh, hình dạng của thế giới đã vĩnh viễn đổi thay."
  legend_chronicle_sacred_birth_opening: "Ngay từ ngày [ROOT.Legend.GetProtagonist.GetSheHe] chào đời, người ta đã biết rằng [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] dành cho [ROOT.Legend.GetProtagonist.GetNameNoTooltip] một định mệnh cao cả hơn. [ROOT.Legend.Custom('GetBirthCircumstancesLegend')|U], sự vĩ đại của [ROOT.Legend.GetProtagonist.GetHerHis] đã được định sẵn."
  born_to_a_virgin_mother: "sinh ra từ một người mẹ đồng trinh"
  born_under_auspicious_stars: "sinh ra dưới những vì sao cát tường"
  legend_chapter_motivation_sacred_birth: "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] đã trải qua nhiều đêm mất ngủ, bị dày vò bởi những thị kiến về chính sự ra đời của mình, cho đến một đêm định mệnh khi [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] hiện ra trước [ROOT.Legend.GetProtagonist.GetHerHim]. [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] tuyên bố rằng [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] được đặt xuống trần thế vì một mục đích thiêng liêng, vượt xa lời kêu gọi thông thường của một [ROOT.Legend.GetProtagonist.GetWomanMan]. Từ đó, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] hiểu rằng sự ra đời của [ROOT.Legend.GetProtagonist.GetHerHis] không phải lời đồn hay sự trùng hợp, mà là sự can thiệp trực tiếp từ [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]!"
  legend_chapter_conclusion_sacred_birth: "Với tất cả những chiến công hiển hách mà [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] đã làm nhân danh [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm], [ROOT.Legend.GetProtagonist.GetSheHe] lại một lần nữa được viếng thăm — lần này không còn là giấc mơ hay thị kiến. [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] hiện thân vật chất và trao cho [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] một chén nước thiêng, ban cho [ROOT.Legend.GetProtagonist.GetHerHim] một phần thần tính. Quần chúng reo hò tên [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U], chỉ mong được chạm vào đôi tay thiêng liêng có khả năng chữa lành của [ROOT.Legend.GetProtagonist.GetHerHis]."
  legend_chronicle_unsuspecting_opening: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] sinh ra như bao [ROOT.Legend.GetProtagonist.GetWomanMan] khác, không hề hay biết về sự vĩ đại mà [ROOT.Legend.GetProtagonist.GetSheHe] sẽ đạt được nhân danh [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]."
  legend_chapter_motivation_fought_devil: "Ravaged by nightmares, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] was haunted by visions of [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName], hissing and tormenting [ROOT.Legend.GetProtagonist.GetHerHim]. Each day [ROOT.Legend.GetProtagonist.GetSheHe] awoke from [ROOT.Legend.GetProtagonist.GetHerHis] slumber with newfound purpose and a sense that [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] had a plan for [ROOT.Legend.GetProtagonist.GetHerHim]."
  legend_chapter_famous_deed_fought_devil: "Một đêm nọ, [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] đã hiện thân trước [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], xung quanh là đủ loại roi vọt và những công cụ tra tấn tàn bạo rải rác trên các bức tường nhuốm máu. Trần truồng nhưng không hề nao núng, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] vật lộn với [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] bằng sức mạnh và niềm tin của [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName|U] đang cuộn chảy trong con người [ROOT.Legend.GetProtagonist.GetHerHis]. Khi [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] bị ghim chặt bất lực dưới thân [ROOT.Legend.GetProtagonist.GetHerHim] — con quái vật gớm ghiếc rít lên và gầm gừ, cái ác bị khuất phục bởi một kẻ phàm trần [ROOT.Legend.GetProtagonist.GetWomanMan]!"
  legend_chapter_extra_deed_fought_devil: "Không cam lòng và tràn đầy căm hận với mọi điều thiện lành và chính trực, [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] thách đấu [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] trong một cuộc so tài bằng [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')]. Giai điệu mà [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] tấu lên khiến [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] tan chảy và biến mất vào [ROOT.Legend.GetProperty( 'faith' ).Faith.NegativeAfterLife|U]. Khúc nhạc ấy tan khỏi tâm trí [ROOT.Legend.GetProtagonist.GetHerHis] như khói, hẳn là quá đỗi thiêng liêng đối với cõi phàm nhân."
  legend_chapter_conclusion_fought_devil: "With [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] defeated, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] devoted [ROOT.Legend.GetProtagonist.GetHerselfHimself] to vanquishing the forces of evil in the realm of mortals. [ROOT.Legend.GetProtagonist.GetSheHe|U] carried a holy glow with [ROOT.Legend.GetProtagonist.GetHerHim] all [ROOT.Legend.GetProtagonist.GetHerHis] days and left peace and civilization in [ROOT.Legend.GetProtagonist.GetHerHis] wake."
  legend_chapter_famous_deed_tournament_won: "Trí tuệ và tiếng hò reo va chạm dữ dội chẳng kém gì lưỡi kiếm trong một màn phô diễn võ nghệ vĩ đại, nhưng không có bộ óc nào sắc sảo hơn, cũng chẳng có thanh kiếm nào bén hơn của [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip]! Hết người này đến người khác bước lên chỉ để bật khóc trước sự bất khả xâm phạm của [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]."
  legend_chapter_extra_deed_tournament_won: "Không ai có thể quên được vinh quang từ giải đấu đầu tiên của [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip], nhưng một chiến thắng vẫn chưa đủ với [ROOT.Legend.GetProtagonist.GetHerHim]. Các đối thủ khác bao vây [ROOT.Legend.GetProtagonist.GetHerHim] trong cơn bão lưỡi kiếm, nhưng [ROOT.Legend.GetProtagonist.GetSheHe] vẫn không hề nao núng. [ROOT.Legend.GetProtagonist.GetSheHe|U] giành chiến thắng trước đám đông đang gào thét tên [ROOT.Legend.GetProtagonist.GetHerHis]!"
  legend_chronicle_opening_raised_by_animals: "Không thức ăn, không hy vọng được cứu sống, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] bị bỏ rơi khi còn là một hài nhi bên bờ sông cho đến khi một con mẹ [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] hùng mạnh tìm thấy [ROOT.Legend.GetProtagonist.GetHerHim]. Nó cho [ROOT.Legend.GetProtagonist.GetHerHim] bú, khiến đứa trẻ lớn lên thành một [ROOT.Legend.GetProtagonist.GetWomanMan] lực lưỡng với toàn bộ sức mạnh và lòng can đảm của loài [ROOT.Legend.GetProperty( 'beast' ).GetFlagName]."
  legend_chapter_motivation_raised_by_animals: "Khi trở lại với loài người, [ROOT.Legend.GetProtagonist.GetFirstName] nhận ra sự hỗn loạn đã bao trùm vùng đất. Hàng xóm quay sang tàn sát lẫn nhau như [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] vồ mồi, và [ROOT.Legend.GetProtagonist.GetFirstName] hiểu rằng dân chúng của [ROOT.Legend.GetProtagonist.GetHerHis] cần một thủ lĩnh mạnh mẽ để đoàn kết cả bầy đàn dưới một mục tiêu chung."
  legend_chapter_conclusion_raised_by_animals: "[ROOT.Legend.GetProtagonist.GetFirstName|U] ruled just as the [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] would, strong and proud. Though [ROOT.Legend.GetProtagonist.GetSheHe] never did see [ROOT.Legend.GetProtagonist.GetHerHis] [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] mother again, [ROOT.Legend.GetProtagonist.GetSheHe] had no doubts that this messenger from [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] would look upon [ROOT.Legend.GetProtagonist.GetHerHis] reign with great pride. The lands remained quiet and peaceful, with none of [ROOT.Legend.GetProtagonist.GetHerHis] enemies daring to step out of line, lest they face the fury of the [ROOT.Legend.GetProperty( 'beast' ).GetFlagName]."
  legend_chapter_extra_deed_recent_battle: "On [ROOT.Legend.GetProtagonist.GetHerHis] return home, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] valiantly fought [ROOT.Legend.GetProtagonist.GetHerHis] enemies, leading with unmatched courage and strategic brilliance. With [ROOT.Legend.GetProtagonist.GetHerHis] sword held high and his unwavering determination, he inspired victory against [ROOT.Legend.GetProtagonist.GetHerHis] foes."
  legend_chapter_extra_deed_recent_siege: "On [ROOT.Legend.GetProtagonist.GetHerHis] return home, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] spearheaded the siege of an enemy stronghold with unyielding determination, shattering the city like the finest glass. With [ROOT.Legend.GetProtagonist.GetHerHis] forces marshaled and banners unfurled, [ROOT.Legend.GetProtagonist.GetSheHe] launched a relentless charge, breaching the defenses and claiming victory."
  legend_chapter_extra_deed_recent_imprisonment: "In the depths of the darkest dungeon, deprived of food and water, shackled and surrounded by shadows, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] found the determination necessary to escape. With gritted teeth and a heart ablaze with defiance, [ROOT.Legend.GetProtagonist.GetSheHe] plotted [ROOT.Legend.GetProtagonist.GetHerHis] getaway, night after night. Through cunning manipulation and sheer force of will, [ROOT.Legend.GetProtagonist.GetSheHe] followed secret passages out into the morning light."
  legend_chapter_extra_deed_recent_tournament: "On [ROOT.Legend.GetProtagonist.GetHerHis] return home, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] was captivated by the splendor of glorious tournament grounds. With sword in hand and armor gleaming under the sun's gaze, [ROOT.Legend.GetProtagonist.GetSheHe] faced formidable opponents with unwavering resolve. The audience clamored, fair ladies and impressionable pages threw themselves at [ROOT.Legend.GetProtagonist.GetHerHis] feet! The winner! The best knight!"
  legend_chapter_famous_deed_saintly_deed: "Amidst the whispers of doubt and the shadows of disbelief among the populace, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] stood unwavering in [ROOT.Legend.GetProtagonist.GetHerHis] faith. It all seemed lost, blood painted the battlefield. Spears were planted on the ground, abandoned by their wielders. But [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] fell to [ROOT.Legend.GetProtagonist.GetHerHis] knees, mouth filled with prayers. Flowers blossomed from the lances, the enemies dropped to the ground, having witnessed a miracle."
  legend_chapter_famous_deed_holy_warrior: "Always a firm defensor of the faith, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] showed [ROOT.Legend.GetProtagonist.GetHerselfHimself] as a true hero in the holy war against the enemies of [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]. [ROOT.Legend.GetProtagonist.GetSheHe|U] traveled to foreign lands, determined to restore the peace and prosperity that the false gods had taken away from their clueless people. [ROOT.Legend.GetProtagonist.GetSheHe|U] carved the symbol of [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] into [ROOT.Legend.GetProtagonist.GetHerHis] forearm, blood spilling over the corpses of the infidels."
  legend_chapter_opening_legendary_battle: "Trong biên niên sử của thời gian, rực cháy một thiên anh hùng ca về một trận chiến huy hoàng vang vọng đến vĩnh hằng, nơi [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] sừng sững như một cự nhân giữa cơn bão chiến tranh."
  legend_chapter_famous_deed_raised_by_animals: "Ngày qua ngày, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] lớn lên cả về sức mạnh lẫn trí tuệ, không bị vấy bẩn bởi sự man rợ của văn minh. Như những người khai quốc La Mã, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ôm trọn thế giới đã ban cho [ROOT.Legend.GetProtagonist.GetHerHim] sự sống và dạy cho cư dân nhà cửa nghệ thuật săn bắn, hạ gục một con [ROOT.Legend.GetProtagonist.Custom('RegionalFerociousAnimal')] trắng."
  legend_chapter_conclusion_dead_loved_spouse: "When [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] returned home, [ROOT.Legend.GetProtagonist.GetHerHis] heart felt like a little dove, about to leave [ROOT.Legend.GetProtagonist.GetHerHis] chest. Filled with emotion, [ROOT.Legend.GetProtagonist.GetSheHe] could not wait to be reunited with [ROOT.Legend.GetProtagonist.GetHerHis] true love. A terrible shriek, sorrow filled the castle's halls for the pale lips of [ROOT.Legend.GetProtagonist.GetHerHis] spouse were lacking of all life. In the silence of [ROOT.Legend.GetProtagonist.GetHerHis] solitude, the memories of a love that inflamed [ROOT.Legend.GetProtagonist.GetHerHis] heart filled [ROOT.Legend.GetProtagonist.GetHerHim] with a terrible pain. What worth had [ROOT.Legend.GetProtagonist.GetHerHis] legend, if [ROOT.Legend.GetProtagonist.GetSheHe] had no one to share it with?"
  legend_chapter_conclusion_point_of_interest: "Trong hành trình rộng lớn của [ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip], [ROOT.Legend.GetProtagonist.GetSheHe] đã tình cờ bắt gặp một kỳ quan ngoạn mục vượt khỏi mọi giới hạn trần thế — nơi vẻ đẹp thiên nhiên hòa quyện hoàn hảo với trí tuệ con người. Những tháp cao được chế tác tinh xảo vươn mình lên trời cao, dáng vẻ thanh tao tắm trong ánh bình minh dịu nhẹ. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] hít sâu một hơi, bởi [ROOT.Legend.GetProtagonist.GetSheHe] không thể mong ước một kết thúc nào tốt đẹp hơn."
  legend_chapter_motivation_child_mother: "In the tranquil corridors of the castle, where shadows dance upon the stone walls and whispers of ancient tales linger in the air, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] cradled [ROOT.Legend.GetProtagonist.GetHerHis] newborn child in tender embrace. As [ROOT.Legend.GetProtagonist.GetSheHe] gazed into the innocent eyes of the infant, [ROOT.Legend.GetProtagonist.GetHerHis] heart was ignited with determination. What legacy would [ROOT.Legend.GetProtagonist.GetSheHe] be leaving behind? Would [ROOT.Legend.GetProtagonist.GetSheHe] want to be remembered as a coward, taking refuge among silk and flowers?"
  legend_chapter_motivation_child_father: "In the solemn chambers of [ROOT.Legend.GetProtagonist.GetHerHis] ancestral home, where the flicker of candlelight casted shadows upon the ancient tapestries, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] beheld with awe the miracle of life bestowed upon [ROOT.Legend.GetProtagonist.GetHerHim]. A determination to safeguard [ROOT.Legend.GetProtagonist.GetHerHis] legacy was born with that child."
  legend_chapter_opening_witch: "[ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip] interest in the hidden arts had always arisen suspicions. Accusations of witchcraft and sorcery swirled around [ROOT.Legend.GetProtagonist.GetHerHim], casting a dark shadow upon [ROOT.Legend.GetProtagonist.GetHerHis] once illustrious name. As [ROOT.Legend.GetProtagonist.GetHerHis] loyal subjects turned to follow [ROOT.Legend.GetProtagonist.GetHerHis] every move, [ROOT.Legend.GetProtagonist.GetSheHe] felt the weight of mistrust pressing down upon [ROOT.Legend.GetProtagonist.GetHerHim]."
  legend_chapter_motivation_celibacy: "Once adorned in regal attire, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] stood clad in the humble robes of a [ROOT.Legend.GetProtagonist.GetFaith.PriestNeuter], stripped naked from [ROOT.Legend.GetProtagonist.GetHerHis] crown. But [ROOT.Legend.GetProtagonist.GetSheHe] never forgot [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], for [ROOT.Legend.GetProtagonist.GetHerHis] devotion burned even brighter, everlasting. Fueled by the divine inspiration pulsing within [ROOT.Legend.GetProtagonist.GetHerHim], [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] resolved to forge a path that would forever immortalize [ROOT.Legend.GetProtagonist.GetHerHis] name."
  legend_chapter_opening_new_culture: "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] was born when the traditions of old became obsolete. With a vision in [ROOT.Legend.GetProtagonist.GetHerHis] mind, [ROOT.Legend.GetProtagonist.GetSheHe] decided to forge [ROOT.Legend.GetProtagonist.GetHerHis] own traditions — thus creating the [ROOT.Legend.GetProtagonist.GetCulture.GetNameNoTooltip] culture."
  legend_chapter_opening_new_faith_generic: "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] ra đời khi tôn giáo đã xa rời ý chỉ của [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip]. Các giáo sĩ rao giảng tà thuyết nhân danh [ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive], khi đức tin mục ruỗng và bị bỏ hoang. Dân chúng quay sang những tôn giáo khác, mở đường cho các đối thủ của [ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive] chinh phục trái tim con người."
