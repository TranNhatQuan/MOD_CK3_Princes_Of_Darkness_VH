  legend_no_legend: "Ngài không đang quảng bá bất kỳ [legends|E] nào"
  CHARACTER_CANNOT_REACH_LEGEND: "@warning_icon! #X Huyền thoại không nằm trong [realm|E] của Ngài, cũng như Ngài không hiện diện trong khu vực lan truyền của huyền thoại#!"
 
  LEGEND_PROMOTER_MODIFIERS: "Hiệu ứng [legend_promoter|E]"

