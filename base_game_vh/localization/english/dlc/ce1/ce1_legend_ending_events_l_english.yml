l_english:

  story_event_legends.0001.t: "Hồi Kết Của Huyền Thoại"
  story_event_legends.0001.desc.intro: "Đây là hồi kết của cuốn sách về [legend_protagonist.GetTitledFirstName] và những chiến công cao quý của [legend_protagonist.GetHerHis], những điều vô song trên khắp cõi đất này. Và đây cũng là hồi kết của [promoted_legend.GetName].\n\n"
  story_event_legends.0001.desc.famous_deed: "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
  story_event_legends.0001.desc.battle: "#EMP [promoted_legend.GetChapterDescriptionByName('battle')]#!"
  story_event_legends.0001.desc.hunt: "#EMP [promoted_legend.GetChapterDescriptionByName('hunt')]#!"
  story_event_legends.0001.desc.fallback: "#EMP Huyền thoại của [legend_protagonist.GetTitledFirstNamePossessiveNoTooltip|U] đạt đến đỉnh cao trong một cuộc phiêu lưu kỳ diệu: những chiến công vũ dũng của [legend_protagonist.GetHerHis] vĩ đại đến mức mọi vị vua đều kinh ngạc, và nhiều quý tộc lẫn thường dân đã tìm đến để yết kiến [legend_protagonist.GetHerHis], bởi họ mong được tận mắt chứng kiến huyền thoại bằng xương bằng thịt.#!"
  story_event_legends.0001.desc.outro: "\n\nVà nơi đây đã được ghi chép lại, tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], vào ngày [GetCurrentDate.GetStringLong]."
  story_event_legends.0001.a: "Hãy để câu chuyện được truyền tụng."

  story_event_legends.0002.t: "Cuốn Sử Của Gia Tộc [legend_protagonist.GetHouse.GetBaseNameNoTooltip]"
  story_event_legends.0002.desc.intro: "Đây là hồi kết của cuốn sách về [legend_protagonist.GetTitledFirstName] và gia tộc cao quý của [legend_protagonist.GetHerHis], nhà [legend_protagonist.GetHouse.GetBaseName], danh tiếng và tính chính danh của họ được biết đến khắp toàn cõi đất này. Và đây cũng là hồi kết của [promoted_legend.GetName].\n\n"
  story_event_legends.0002.desc.famous_deed: "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
  story_event_legends.0002.desc.battle: "#EMP [promoted_legend.GetChapterDescriptionByName('battle')]#!"
  story_event_legends.0002.desc.fallback: "$story_event_legends.0001.desc.fallback$"
  story_event_legends.0002.desc.outro: "\n\nVà nơi đây đã được ghi chép lại, tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], vào ngày [GetCurrentDate.GetStringLong]."
  story_event_legends.0002.a: "#EMP [legend_protagonist.GetHouse.GetMotto].#!"

  story_event_legends.0003.t: "Những Phép Màu Của [legend_protagonist.GetTitledFirstNameNoTooltip]"
  story_event_legends.0003.desc.intro: "Đây là hồi kết của cuốn sách về [legend_protagonist.GetTitledFirstName] và những phép màu của [legend_protagonist.GetHerHis], vốn lừng danh trong toàn thể các tín đồ [legend_protagonist.GetFaith.GetAdherentNamePluralNoTooltip]. Ôi Đấng Toàn Năng [legend_protagonist.GetFaith.HighGodName], xin cho phép con cầu nguyện phúc lành của Người ban xuống cuốn sách này, [promoted_legend.GetName].\n\n"
  story_event_legends.0003.desc.famous_deed: "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
  story_event_legends.0003.desc.fallback: "#EMP Huyền thoại của [legend_protagonist.GetTitledFirstNamePossessiveNoTooltip|U] là một trong vô vàn điều kỳ diệu. [legend_protagonist.GetSheHe|U] đã thực hiện vô số phép màu, không sao kể xiết, và tỏa rạng trong nhiều đức hạnh. Kẻ bệnh tật được chữa lành khi ở trước mặt [legend_protagonist.GetHerHis], và cây cối mọc lên từ mảnh đất khô cằn.#!"
  story_event_legends.0003.desc.outro: "\n\nVà nơi đây đã được ghi chép lại, tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], vào ngày [GetCurrentDate.GetStringLong]."
  story_event_legends.0003.a: "Nguyện được như vậy."
  can_select_legendary_culture_pillars_tt: "Ngài có thể chọn [heritage|E] và [language|E] từ nền văn hóa huyền thoại của mình khi Ngài [diverge|E] [culture|E]"
  legend_title_does_not_exist_sub_realm_claims_given_tt: "Ngài sẽ nhận được một [claim|E] đối với mọi [title|E] de jure hiện có bên trong [title_claim.GetName]"
