  game_concept_epidemic: "Dịch Bệnh"
  game_concept_epidemic_desc: "Một $game_concept_epidemic$ là sự bùng phát của một căn bệnh lan rộng trên bản đồ, gây ra cả tác động cục bộ lẫn lây nhiễm các nhân vật trong khu vực của nó. Các [baronies|E] bị ảnh hưởng có một [infection_rate|E] quyết định mức độ nghiêm trọng và có thể được khắc chế bằng cách cải thiện [epidemic_resistance|E].\n\nMột Dịch Bệnh có thể có các [plague_intensities|E] khác nhau, ảnh hưởng đến phạm vi tác động, thời gian tồn tại và số lượng [fatalities|E]."
  game_concept_epidemic_i: "@epidemic_icon!"
  game_concept_epidemics: "Các Dịch Bệnh"
  game_concept_epidemics_desc: "$game_concept_epidemic_desc$"
  game_concept_infection_rate: "Tỷ Lệ Lây Nhiễm"
  game_concept_infection_rate_desc: "Các [baronies|E] bị ảnh hưởng bởi [epidemics|E] có một $game_concept_infection_rate$ quyết định mức độ nghiêm trọng và cường độ tác động của chúng.\n\n$game_concept_infection_rate$ sẽ luôn tiến dần tới giá trị tối đa nếu không có biện pháp chống lại. Các [epidemics|E] Nhẹ, Lớn và Tận Thế sẽ tiến triển với tốc độ khác nhau, được đánh dấu bởi cường độ của chúng.\n\nĐể giảm thiểu tác động của sự lây nhiễm, các [rulers|E] có thể cải thiện [epidemic_resistance|E] của [realm|E] mình."
  game_concept_infection_rates: "Tỷ Lệ Lây Nhiễm"
  game_concept_infection_rates_desc: "$game_concept_infection_rate_desc$"
  game_concept_epidemic_resistance: "Kháng Dịch"
  game_concept_epidemic_resistance_desc: "$game_concept_epidemic_resistance$ làm giảm [infection_rate|E] của một [barony|E] hoặc [county|E], qua đó giảm nhẹ tác động của một [epidemic|E].\n\n$game_concept_epidemic_resistance$ có thể được tăng thông qua các [buildings|E] như $building_type_hospices_01$ hoặc $building_type_burial_site_01$ #weak ([duchy_building|E])#!, các [court_position_tasks|E] do $court_physician_court_position$ thực hiện, [decisions|E] hoặc sự kiện."
  game_concept_epidemic_res: "Kháng Dịch"
  game_concept_epidemic_res_desc: "$game_concept_epidemic_resistance_desc$"
  game_concept_infection_chance: "Khả Năng Lây Nhiễm"
  game_concept_chance_of_infection: "Khả Năng Lây Nhiễm"
  game_concept_infection_chance_desc: "$game_concept_infection_chance$ của Ngài quyết định khả năng Ngài mắc [diseases|E] từ một [epidemic|E] đang diễn ra."
  game_concept_plague_intensity: "Cường Độ Dịch Bệnh"
  game_concept_plague_intensity_desc: "Một [epidemic|E] có thể ở mức Tận Thế, Lớn hoặc Nhẹ, ảnh hưởng đến phạm vi lây lan, thời gian tồn tại và các [characters|E] bị nhiễm, gây ra [fatalities|E]."
