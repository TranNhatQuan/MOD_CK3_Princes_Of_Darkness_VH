l_english:

  legend_debug.0001.desc: "#D Đây là một sự kiện debug#!"

  legend_spread_events.0001.t: "Những Giọng Nói Ngây Thơ"
  legend_spread_events.0001.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] của ta, [chronicler.GetFirstName], đón tiếp ta với nụ cười hào phóng trong thư viện của [chronicler.GetHerHis].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trong nỗ lực ghi chép huyền thoại của ngài, chúng Ta đã nghĩ đến việc cho vài đứa trẻ đi khắp các khu chợ để ca ngợi những chiến công của [ancestor.GetName].\""
  legend_spread_events.0001.a: "\"Hãy cho chúng đi ngay lập tức!\""
  legend_spread_events.0001.b: "\"Chúng ta không có cách nào chứng minh. Hãy kín đáo.\""
  legend_spread_events.0001.c: "\"Thật ra thì... [my_child.GetShortUIName] cũng có thể tham gia cùng chúng.\""
  legend_spread_events.0001.d: "\"#EMP Ta#! chính là huyền thoại của mình.\""
  legend_spread_events.0001.a.tt.success: "Lời nói của Ngài có vẻ thuyết phục"
  legend_spread_events.0001.a.tt.failure: "Không ai tin bọn trẻ"
  legend_my_own_ancestor_modifier: "Huyền Thoại Của Chính Ta"
  legend_my_own_ancestor_modifier_desc: "Nhân vật này được định sẵn sẽ trở thành tổ tiên huyền thoại của chính mình"

  legend_spread_events.0010.t: "Một Thợ Săn Đích Thực"
  legend_spread_events.0010.desc: "A melodic voice draws my attention the moment I open the [ROOT.Char.Custom('GetDoor')] of the hall. Some of my [ROOT.Char.Custom('GetFollowerOrVassalPlural')] have surrounded my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bard'))] [bard.GetFirstName], who plays [bard.GetHerHis] [bard.Custom('GetMusicalInstrument')], almost climbing up the table with emotion.\n\n"And here [ROOT.Char.GetSheHe] is!" [bard.GetSheHe] cries out, "Our very own [ROOT.Char.GetTitleAsNameNoTooltip], whose legend I so keenly sing, for [ROOT.Char.GetSheHe] with [ROOT.Char.GetHerHis] own hands slayed a...""
  legend_spread_events.0010.a: "...con rồng!"
  legend_spread_events.0010.a.tt.success: "Cả đại sảnh hò reo!"
  legend_spread_events.0010.a.tt.failure: "Lời dối trá của Ngài quá lộ liễu"
  legend_spread_events.0010.b: "...một con quái thú #EMP khổng lồ#!!"
  legend_spread_events.0010.b.tt.success: "Các cận thần hòa giọng cùng Ngài"
  legend_spread_events.0010.c: "...chỉ là một con gấu to xác."
  legends_dragon_slayer: "Kẻ Săn Rồng"
  legends_dragon_slayer_desc: "Nhân vật này tuyên bố rằng mình đã săn được một con rồng."

  legend_spread_events.0020.t: "Gieo Tin Đồn"
  legend_spread_events.0020.desc.intro: "As I promenade down the stairs and across the courtyard I reach one of the corridors from where the servants usually watch the children.\n\nBut it's not them that I find. [courtier.GetTitledFirstNamePossessive] voice reaches me, loud and clear, and I conceal myself among the stone pillars:\n\n"What has [protagonist.GetTitledFirstName] done anyway? Was there any of us there to see [ROOT.Char.GetHerHis] so called #EMP legend#! that"
  legend_spread_events.0020.desc.you_protag: "[ROOT.Char.GetSheHe]"
  legend_spread_events.0020.desc.other_protag: "[ROOT.Char.GetTitledFirstName]"
  legend_spread_events.0020.desc.outro: "so proudly makes us sing now?""
  legend_spread_events.0020.a: "[courtier.GetSheHe|U] can talk all [courtier.GetSheHe] wants. In the dungeons."
  legend_spread_events.0020.b: "\"Ngươi kia!\""
  legend_spread_events.0020.b.tt.success: "[courtier.GetShortUINameNoTooltip] xin lỗi"
  legend_spread_events.0020.b.tt.failure: "[courtier.GetShortUINameNoTooltip] cảm thấy bị xúc phạm"
  legend_spread_events.0020.c: "Tốt hơn là giả vờ như ta chẳng nghe thấy gì..."
  legend_put_out_rumors_modifier: "Huyền Thoại Được Dẹp Yên"
  legend_put_out_rumors_modifier_desc: "Nhân vật này đã dập tắt những tin đồn nghi ngờ huyền thoại của mình."
  legend_sus_rumors_modifier: "Huyền Thoại Bị Nghi Ngờ"
  legend_sus_rumors_modifier_desc: "Huyền thoại mà nhân vật này tuyên bố đã bị các cận thần nghi ngờ."

  legend_spread_events.0030.t: "Ngươi Còn Nhớ Chứ?"
  legend_spread_events.0030.desc.intro: ""So tell me, [ROOT.Char.Custom('FormOfAddressForLiege')]..." my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstNamePossessive] voice snaps me out of my thoughts and I find [chronicler.GetHerHim] waving [chronicler.GetHerHis] hand, the quill spilling ink over the floor.\n\n"
  legend_spread_events.0030.desc.you_protag: "\"Còn lần đó thì sao, khi [legend_memory.GetSecondPerspectiveDescription]? Chuyện đó hẳn rất đáng để thêm vào huyền thoại của ngài...\""
  legend_spread_events.0030.desc.other_protag: "\"Còn lần đó thì sao, khi [legend_memory.GetThirdPerspectiveDescription]? Chuyện đó hẳn rất đáng để thêm vào huyền thoại của [protagonist.GetHerHis]...\""
  legend_spread_events.0030.a: "\"Ngươi không nghe ta nói lần trước sao?\""
  legend_spread_events.0030.a.flavor: "#EMP Ngáp...#! Ta còn việc hay hơn để làm."
  legend_spread_events.0030.b: "À, đó đúng là một dịp #EMP tuyệt vời#!..."
  legend_spread_events.0030.b.tt.success: "Mọi người đều nhớ đến chiến công vĩ đại của Ngài"
  legend_spread_events.0030.b.tt.failure: "Mọi người dường như không mấy tin tưởng"
  legend_spread_events.0030.c: "Ta không thấy cần phải nhắc lại chuyện đó."
  humble_content_courtiers_and_guests: "Toàn bộ [courtiers|E] và [guests|E] có đặc tính [GetTrait('humble').GetName( GetNullCharacter )] hoặc [GetTrait('content').GetName( GetNullCharacter )]"
  legend_lazy_modifier: "Không Phải Việc Của Ta"
  legend_lazy_modifier_desc: "Nhân vật này để việc ghi chép các chi tiết tinh tế của huyền thoại cho người khác."
  legend_memory_deed_modifier: "Ký Ức Gần Đây"
  legend_memory_deed_modifier_desc: "Những chiến công phi thường của nhân vật này vẫn còn in đậm trong ký ức của dân chúng."

  legend_spread_events.0040.t: "Lời Thỉnh Cầu Đẫm Nước Mắt"
  legend_spread_events.0040.desc.intro: "\"À, ánh sáng buổi sáng nay chiếu thật dễ chịu trong [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')], [ROOT.Char.Custom('FormOfAddressForLiege')] à,\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName] nói, vừa đi quanh [ROOT.Char.Custom('GetRoom')].\n\n\"Nó khiến ta nhớ đến cái ngày mà số phận quyết định bắt đầu"
  legend_spread_events.0040.desc.you_protag: "huyền thoại của ngài... ngài còn nhớ mình đã nhân từ đến thế nào không,\""
  legend_spread_events.0040.desc.other_protag: "huyền thoại của [protagonist.GetTitledFirstNamePossessive]... ngài còn nhớ [ROOT.Legend.GetProtagonist.GetSheHe] đã nhân từ đến mức nào không,\""
  legend_spread_events.0040.desc.outro: "khi lắng nghe lời van nài tuyệt vọng của người nông dân ấy?\" [chronicler.GetSheHe] nói, kèm theo một cái nháy mắt đầy ẩn ý."
  legend_spread_events.0040.a: "\"#EMP Ta#! mà lại nghe lời một tên nông dân ư?\""
  legend_spread_events.0040.b: "\"À, ta đúng là một tâm hồn mộ đạo!\""
  legend_spread_events.0040.b.tt.success: "Lòng mộ đạo của Ngài thật ấn tượng"
  legend_spread_events.0040.b.tt.failure: "Lòng mộ đạo của Ngài rõ ràng là giả dối"
  legend_spread_events.0040.c: "\"Điều đó thì thêm được gì?\""

  legend_spread_events.0050.t: "Phục Vụ Một [honored_lady.GetLadyLord|U]"
  legend_spread_events.0050.desc: "\"#EMP Và [ROOT.Legend.GetProtagonist.GetSheHe] thì hào hiệp\ncòn [honored_lady.GetSheHe] thì xinh đẹp\nVà [ROOT.Legend.GetProtagonist.GetSheHe] là một anh hùng\ncòn [honored_lady.GetSheHe] thì xinh đẹeeeeep!#!\"\n\nChẳng mất nhiều thời gian để ta phát hiện ra âm nhạc phát ra từ đâu, khi sớm bắt gặp [bard.GetTitledFirstName] đang tinh nghịch chỉnh dây nhạc cụ của [bard.GetHerHis], tựa người vào một băng ghế đá.\n\n\"À, [ROOT.Char.Custom('FormOfAddressForLiege')],\" đôi mắt của [bard.GetHerHis] lập tức sáng lên, \"chẳng phải lý do cho huyền thoại của ngài là để gây ấn tượng với [honored_lady.GetTitledFirstName] hay sao?\""
  legend_spread_events.0050.a: "\"Ngươi dám nói vậy sao!? Ta #EMP đã có gia đình#! rồi!\""
  legend_spread_events.0050.b: "\"[honored_lady.GetSheHe|U] quả thực rất xinh đẹp...\""
  legend_spread_events.0050.b.tt.success: "Cử chỉ của Ngài gây ấn tượng với [honored_lady.GetFirstNameNoTooltip]"
  legend_spread_events.0050.b.tt.failure: "Cử chỉ của Ngài khiến [honored_lady.GetFirstNameNoTooltip] ghê tởm"
  legend_spread_events.0050.c: "\"Ta làm điều đó vì chính mình.\""

  legend_spread_events.0060.t: "Huyền Thoại Hay Chỉ Là Thần Thoại"
  legend_spread_events.0060.desc.intro: "\"Xin một lời, thưa [ROOT.Char.GetLadyLord|U],\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName] tiến đến, vẻ mặt lo lắng hiện rõ trên gương mặt của [courtier.GetHerHis]. \"Là về"
  legend_spread_events.0060.desc.you_protag: "huyền thoại của ngài"
  legend_spread_events.0060.desc.other_protag: "huyền thoại của [ROOT.Legend.GetProtagonist.GetShortUINamePossessive]"
  legend_spread_events.0060.desc.outro: "... [bad_vassal.GetTitledFirstName] đã bị nghe thấy là đang nghi ngờ nó, và lời đồn trong triều đã bắt đầu vọng theo [bad_vassal.GetHerHim].\"\n\n\"Nếu ngài không kịp thời ngăn chặn, e rằng mọi nông dân trong cõi đất này sẽ tin rằng đó chỉ là lời dối trá.\""
  legend_spread_events.0060.a: "\"Cái tên [bad_vassal.Custom2('InsultNoun', ROOT.Char)] phiền phức đó...\""
  legend_spread_events.0060.b: "Lời của ta mạnh hơn lời của [bad_vassal.GetHersHis]."
  legend_spread_events.0060.b.tt.success: "Mọi người tin Ngài"
  legend_spread_events.0060.b.tt.failure: "[bad_vassal.GetShortUIName] được tin tưởng"
  legend_spread_events.0060.c: "[bad_vassal.GetHerHim] gan thật, dám thử trò này với ta..."
  legend_spread_events.0060.d: "Cứ để họ nói."
  legend_no_mocking_modifier: "Huyền Thoại Được Tôn Trọng"
  legend_no_mocking_modifier_desc: "Nhân vật này đã lập tức chấm dứt việc chế nhạo huyền thoại của mình."
  legend_extra_mocking_modifier: "Huyền Thoại Bị Chế Nhạo"
  legend_extra_mocking_modifier_desc: "Huyền thoại của nhân vật này đã bị nhiều người đem ra chế giễu."
  not_believable_modifier: "Lộ Liễu Phản Trắc"
  not_believable_modifier_desc: "Những lời dối trá của nhân vật này nhằm chống lại chúa thượng đã bị phát hiện và phản tác dụng."

  legend_spread_events.5000.t: "Nền Móng Vững Chắc"
  legend_spread_events.5000.desc: "Ánh mặt trời chiếu rực rỡ xuống [capital.GetName] khi [chronicler.GetFirstName] và ta dạo bước qua những con phố nhộn nhịp. Đây là một khu định cư đẹp.\n\nMột khu định cư #EMP thật sự#! đẹp, ta nghĩ thầm, nhìn quanh những khối xây tinh xảo trên vòm cổng mà ta đi qua. [chronicler.GetFirstNameNoTooltip] bắt gặp ánh nhìn của ta.\n\n\"Đây là công lao của tổ tiên những con người nơi này.\" [chronicler.GetSheHe|U] bắt đầu. \"Công lao lớn đến mức đôi khi người ta tự hỏi liệu chính họ có thực sự xây dựng nên nó không...\""
  legend_spread_events.5000.a: "\"Kiến trúc này #EMP rõ ràng#! không có nguồn gốc từ [culture.GetNameNoTooltip]!\""
  legend_spread_events.5000.b: "Chắc hẳn điều này #EMP hẳn phải#! do những kẻ không phải người [culture.GetCollectiveNounNoTooltip] xây dựng?"
  legend_spread_events.5000.b.tt.success: "Mọi người dường như bị thuyết phục"
  legend_spread_events.5000.b.tt.failure: "Dân thường đầy tự hào phẫn nộ bác bỏ tuyên bố của Ngài"
  legend_spread_events.5000.c: "Chẳng phải loại kiến trúc này có thể được sử dụng vào việc tốt hơn sao?"
  legend_spread_events.5000.d: "Những tổ tiên ấy quả thực là những con người cần cù."

  legend_spread_events.5005.t: "Phước Lành Từ [parent.Custom('MotherFatherPossessive')|U]"
  legend_spread_events.5005.desc: "Ngày nay, việc tình cờ gặp lại [parent.GetMotherFather] của ta là [parent.GetFirstName] là một niềm vui hiếm hoi, vậy mà chúng ta lại gặp nhau tại nơi thờ phụng này. [chronicler.GetFirstName] giữ khoảng cách kính cẩn ở một bên khi chúng ta chào hỏi nhau.\n\n\"[ROOT.Char.GetFirstName]! Thật bất ngờ!\" [parent.GetSheHe|U] kêu lên, ôm chầm lấy ta. [parent.GetSheHe|U] mỉm cười hoài niệm, nhìn quanh những bức tường. \"Nơi này thật sự khiến ta cảm thấy trẻ lại. Con luôn là một đứa trẻ mộ đạo. Con có biết rằng khi con còn là một đứa bé, con từng từ chối bú sữa vào những ngày thánh không?\"\n\nTa... không hề biết chuyện đó, không."
  legend_spread_events.5005.regular: "Ở khóe mắt, ta có thể thấy [chronicler.GetFirstNameNoTooltip] bắt đầu với tay về phía [chronicler.GetHerHis] [ROOT.Char.Custom('GetWritingMaterial')]."
  legend_spread_events.5005.parent_chronicler: "Có lẽ, với tư cách là biên niên sử gia của ta, người [parent.Custom('MotherFather')] thân mến có thể được thuyết phục để ghi điều đó lại chăng?"
  legend_spread_events.5005.a: "\"[parent.Custom('MotherFather')|U], xin người đấy, người làm con xấu hổ quá!\""
  legend_spread_events.5005.b: "\"Xin người nhắc lại cho con nghe?\""
  legend_spread_events.5005.b.tt: "Ừm, chuyện này có thể giúp ích cho ta..."
  legend_spread_events.5005.c: "Thôi nói về con đủ rồi. #EMP Người#! thế nào, [parent.Custom('MotherFather')]?"

  legend_spread_events.5010.t: "Đặt Tay Chữa Lành"
  legend_spread_events.5010.desc: "Biên niên sử gia của ta, [chronicler.GetFirstName], bị xô mạnh sang một bên khi một bóng người lạ lảo đảo tiến về phía ta trên phố. Vệ binh của ta lập tức bước lên, chĩa vũ khí, nhưng rõ ràng kẻ khốn khổ này không hề có ý làm hại ta.\n\n\"Làm ơn!\" [sick.GetHerHis|U] thều thào khi [sick.GetSheHe] lên tiếng. \"Ta bệnh nặng lắm. Phải cố gắng lắm Ta mới ra được đây khi thấy ngài đi ngang qua, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\n\"Ta... nghe người ta đồn rằng ngài có thể làm phép màu. Chỉ cần một cái chạm thôi là đủ!\" [sick.GetSheHe|U] loạng choạng tiến lại gần hơn, hai tay vươn ra cầu khẩn."
  legend_spread_events.5010.a: "\"Ngươi nên quyên góp cho những kẻ cần giúp đỡ hơn.\""
  legend_spread_events.5010.a.tt: "Ít nhất thì việc khuyến khích bố thí cho người nghèo cũng khiến #EMP ta#! trông có vẻ tốt đẹp..."
  legend_spread_events.5010.b: "Ừm, nếu chuyện này có tác dụng thì..."
  legend_spread_events.5010.b.criticalsuccess: "Người đó được chữa lành"
  legend_spread_events.5010.b.success: "Họ nói rằng mình đã cảm thấy khá hơn đôi chút"
  legend_spread_events.5010.b.failure: "Dường như không có bất kỳ thay đổi nào"
  legend_spread_events.5010.c: "\"Xin hãy tìm đến sự chữa trị thích hợp, tại một nhà tế bần địa phương.\""

  legend_spread_events.5015.t: "Gia Bảo Đẫm Máu"
  legend_spread_events.5015.desc: "I test the blade of a sword as my chronicler [chronicler.GetFirstName] and I peruse the armory in [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'my camp', 'location.GetName')]. It is sharp and well-honed. [chronicler.GetFirstNameNoTooltip], however, is more interested in another weapon hanging from the wall.\n\n"I've heard so much tell about this mighty weapon, [ROOT.Char.Custom('FormOfAddressForLiege')]." [chronicler.GetSheHe|U] breathes, admiring it. "I've heard it has killed a half-dozen by your hand alone!\n\n[artifact.GetName] hangs there placidly. It is true that it has been a trusty and lethal weapon over its lifetime, its flanks repeatedly slaked in the blood of enemies. A good blade. A red blade."
  legend_spread_events.5015.a: "\"Và nó sẽ còn lấy đi mạng sống của nhiều kẻ nữa.\""
  legend_spread_events.5015.b: "\"À, đó chỉ là những kẻ ta còn nhớ thôi...\""
  legend_spread_events.5015.b.success: "Câu chuyện về vũ khí ngày càng lan rộng"
  legend_spread_events.5015.b.failure: "Một số người nhìn những câu chuyện ấy với ánh mắt hoài nghi"
  legend_spread_events.5015.c: "\"Không nhiều hơn thế đâu, [chronicler.GetFirstNameNoTooltip].\""
  legend_spread_events.5015.c.tt: "[artifact.GetName] nhận một bổ trợ tích cực ngẫu nhiên"

  legend_spread_events.5020.t: "Bôi Nhọ"
  legend_spread_events.5020.desc: "Our joint passage down [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'the camp', 'a corridor')] in the gloom of dusk is interrupted by [chronicler.GetFirstName], [chronicler.GetHerHis] finger outstretched at my lantern-carrying hand.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [chronicler.GetSheHe|U] starts, a tremor in [chronicler.GetHerHis] voice. "That mark, on your hand! Is that... a Sacred Wound?"\n\nI glance down at my hand. A large blotch covers the back of it. In truth, I had barely even noticed it there. [chronicler.GetFirstNameNoTooltip], however, was already on quite a flight of fancy.\n\n"We must record this! The people must know! You bear the holy wounds of Christ himself!""
  legend_spread_events.5020.a: "\"Ngươi có biết ta còn có một vết nữa ở bên sườn không?\""
  legend_spread_events.5020.a.tt: "Một vết sẹo cũ. Có lẽ nó mang ý nghĩa nào đó?"
  legend_spread_events.5020.b: "Quả thật #EMP khá#! thú vị..."
  legend_spread_events.5020.c: "\"Chỉ là một dấu vết cũ thôi, [chronicler.GetFirstNameNoTooltip].\""

  legend_spread_events.5025.t: "Những Pho Sách Bụi Bặm"
  legend_spread_events.5025.desc: "The peace and quiet of my [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'tent', 'study')] is thoroughly cracked as [chronicler.GetFirstName] bursts in, arms encircling what looks like an aged [ROOT.Char.Custom('GetWritingMaterial')].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [chronicler.GetSheHe|U] cries. "Look, look! We have found an old manuscript!" Dumping it on my desk, [chronicler.GetSheHe] jabs at it with an excited finger.\n\n"It's in an ancient language that we simply cannot decipher. But you..." [chronicler.GetSheHe] looks at me reverently, "you might be able to! It must be a work of your ancestors!""
  legend_spread_events.5025.a: "\"Ngươi nói đúng, [chronicler.GetFirstNameNoTooltip]! Thứ này dịch rất dễ!\""
  legend_spread_events.5025.b: "Để xem ta làm được đến đâu..."
  legend_spread_events.5025.b.success: "Ngài dịch được bản thảo"
  legend_spread_events.5025.b.failure: "Ngôn ngữ này hoàn toàn vượt quá khả năng của Ngài"
  legend_spread_events.5025.c: "\"E rằng đây không phải là ngôn ngữ của tổ tiên ta.\""

  legend_spread_events.5030.t: "Bằng Hữu Ở Chốn Cao"
  legend_spread_events.5030.desc: "Though the demands of running the realm don't often have our paths cross, one such opportunity has brought [vassal.GetFirstName] and I together. [vassal.GetSheHe|U] warmly greets me with a knowing twinkle in [vassal.GetHerHis] eye.\n\n"[ROOT.Char.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]! A pleasure to see you!" [vassal.GetFirstNameNoTooltip] clasps my shoulder. "Do you know, I hear some #EMP fascinating#! tales about you as of late?" [vassal.GetSheHe|U] smiles broadly at my slight discomfort.\n\n"I rather enjoyed them, as it happens. Perhaps you could fill me in on some of the details?""
  legend_spread_events.5030.a: "\"Ta sẽ vô cùng biết ơn nếu ngài giúp lan truyền tin tức này!\""
  legend_spread_events.5030.b: "\"Tất nhiên rồi. Có lần này ta đã—\""
  legend_spread_events.5030.c: "\"Thật tốt khi được gặp ngài, [vassal.GetFirstNameNoTooltip].\""

  legend_spread_events.5035.t: "Chuyện Gia Tộc"
  legend_spread_events.5035.desc: "\"Thật kỳ lạ, thưa chúa thượng, vô cùng kỳ lạ. Ta không biết phải hiểu thế nào nữa. Ngài có thể lý giải được không?\"\n\n[chronicler.GetFirstName] đưa cho ta [ROOT.Char.Custom('GetWritingMaterial')], được đào lên từ một góc bụi bặm nào đó trong tư dinh tổ tiên. Ta nhìn nó đầy nghi hoặc. Ta không chắc [chronicler.GetSheHe] muốn nói gì, đặc biệt là—\n\n\"Nhìn này. Dòng dõi của ngài không hề xuất hiện ở bất kỳ đâu trong danh sách này.\" [chronicler.GetFirstNameNoTooltip] giải thích với vẻ duyên dáng mà chắc chắn [chronicler.GetSheHe] #EMP nghĩ#! là hữu ích. Trên thực tế, nó chỉ khiến tâm trạng ta càng thêm u ám.\n\nĐiều này có thể là tin cực kỳ tồi tệ cho những nỗ lực hợp pháp hóa của ta."
  legend_spread_events.5035.a: "\"Hãy phá hủy thứ này. Và [chronicler.GetFirstNameNoTooltip]...?\""
  legend_spread_events.5035.a.tt: "\"Nếu chỉ một lời về chuyện này rời khỏi căn phòng này, ta sẽ #EMP biết#! chính là ngươi.\""
  legend_spread_events.5035.b: "\"Vớ vẩn! Nhìn xem, tên cha ta ở ngay kia mà!\""
  legend_spread_events.5035.b.success: "[chronicler.GetFirstNameNoTooltip] vui vẻ chấp nhận sự chỉnh sửa"
  legend_spread_events.5035.b.failure: "[chronicler.GetFirstNameNoTooltip] không bị thuyết phục"
  legend_spread_events.5035.c: "Chúng ta phải giữ chuyện này kín đáo. #EMP Rất#! kín đáo."
  legend_spread_events.5035.c.success: "Bí mật vẫn được chôn vùi"
  legend_spread_events.5035.c.failure: "Bí mật bị lộ"
  legend_spread_events.5035.d: "Chúng ta sẽ phải tìm một tài liệu khác."

  legend_spread_events.5040.t: "Hệ Thực Vật Gia Tộc"
  legend_spread_events.5040.desc: ""Just some final questions, [ROOT.Char.Custom('FormOfAddressForLiege')], and then I can let you go!" [chronicler.GetFirstNamePossessive] false cheeriness does nothing to temper the weariness I feel as the time we spend poring over [ROOT.Char.Custom('GetWritingMaterial')] to assess my family tree drags ever onwards. [chronicler.GetSheHe|U] taps one section earnestly.\n\n"I'm just not sure exactly who should inhabit #EMP these#! particular parts." [chronicler.GetFirstNameNoTooltip] furrows [chronicler.GetHerHis] brow in consternation. "Do you happen to know, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
  legend_spread_events.5040.a: "Dĩ nhiên là #EMP có#! rồi!"
  legend_spread_events.5040.a.tt: "Không, ta không biết, nhưng một lời nói dối hay sẽ khiến kiến thức trở nên thừa thãi..."
  legend_spread_events.5040.b: "Chắc [parent.GetMotherFather] sẽ biết!"
  legend_spread_events.5040.c.tt: "Ta hoàn toàn không biết, nhưng có lẽ nếu ta đủ thuyết phục..."
  legend_spread_events.5040.c.success: "Những lời bịa đặt của Ngài khá thuyết phục"
  legend_spread_events.5040.c.failure: "Lời nói dối của Ngài quá lộ liễu"
  legend_spread_events.5040.d: "Cứ ghi một [ROOT.Char.Custom('RegionalMythicalCreature')] vào đó cũng được!"
  legend_spread_events.5040.d.success: "Một số kẻ nhẹ dạ cả tin lại tin điều đó"
  legend_spread_events.5040.d.failure: "Sự cẩu thả khiến gia phả của Ngài bị nghi ngờ"

  legend_spread_events.5045.t: "Vài Lời Được Chứ?"
  legend_spread_events.5045.desc: "[chronicler.GetFirstName] và ta đang cân nhắc các con đường để lan truyền tin tức về lòng mộ đạo của ta đi xa hơn thì [chronicler.GetSheHe] nắm lấy tay ta và nghiêng đầu ra hiệu. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('imam'))] của ta, [imam.GetFirstName], đã bước vào giáo đường, rõ ràng đang bắt đầu chuẩn bị cho buổi hành lễ sau đó.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [chronicler.GetFirstNameNoTooltip] thì thầm gấp gáp. \"Đây là #EMP hoàn hảo#!! [imam.GetSheHe|U] đang chuẩn bị #EMP khutbah#! cho hôm nay!! Mau lên, hãy thuyết phục [imam.GetHerHim] đưa tên ngài vào đó!\"\n\nMột ý tưởng tuyệt vời! Chỉ là ta tự hỏi sẽ cần những gì để biến nó thành hiện thực..."
  legend_spread_events.5045.a: "[imam.GetSheHe|U] sẽ không bỏ qua một ân huệ đâu."
  legend_spread_events.5045.b: "Hối lộ có thể mạo hiểm nhưng đáng giá..."
  legend_spread_events.5045.b.success: "[imam.GetSheHe|U] chấp nhận đề nghị của Ngài"
  legend_spread_events.5045.b.failure: "[imam.GetSheHe|U] phẫn nộ trước đề nghị của Ngài"
  legend_spread_events.5045.c: "Ta sẽ trực tiếp thuyết phục [imam.GetHerHim]."
  legend_spread_events.5045.c.success: "[imam.GetFirstNameNoTooltip] đồng ý"
  legend_spread_events.5045.c.failure: "[imam.GetFirstNameNoTooltip] thờ ơ trước lời khẩn cầu của Ngài"
  legend_spread_events.5045.d: "\"Đừng ngớ ngẩn thế, [chronicler.GetFirstNameNoTooltip].\""

  legend_spread_events.5050.t: "Tạo Ấn Tượng"
  legend_spread_events.5050.desc: "Lẽ ra ta phải đoán trước rắc rối sẽ đến khi [chronicler.GetFirstName] bước vào [ROOT.Char.Custom('GetRoom')], theo sau là một gương mặt xa lạ.\n\n\"Xin giới thiệu [jeweller.GetFirstName], thưa [ROOT.Char.Custom('FormOfAddressForLiege')].\" Người lạ cúi chào thật sâu. \"[jeweller.GetSheHe|U] là một thợ kim hoàn và thợ luyện kim. Ta nghĩ rằng có lẽ ngài muốn xem qua một vài tác phẩm của [jeweller.GetHerHis].\"\n\n\"Ta đã mạo muội chuẩn bị vài món đặc biệt phù hợp với ngài và... những điều mà ngài đang quan tâm dạo này.\" [jeweller.GetFirstNameNoTooltip] nói, đặt một chiếc khay lên bàn.\n\n#EMP 'Những điều ta đang quan tâm?'#! Rõ ràng là [chronicler.GetFirstNameNoTooltip] đã rất bận rộn."
  legend_spread_events.5050.a: "Chiếc vương miện này quả thật đáng chú ý."
  legend_spread_events.5050.b: "Sợi dây chuyền này tỏa ra một khí chất đặc biệt."
  legend_spread_events.5050.c: "Ta không định tiêu #EMP nhiều đến thế#!..."
  legend_spread_events.5050.d: "\"Ngươi đã vượt quá giới hạn rồi, [chronicler.GetFirstNameNoTooltip].\""

  legend_spread_events.5055.t: "Lựa Chọn Văn Hóa"
  legend_spread_events.5055.desc: "Khi ta cân nhắc nên mặc gì trong ngày, lời khuyên đầy hứng khởi của [chronicler.GetFirstNamePossessive] vang lên: \"Có lẽ là thứ gì đó truyền cảm hứng cho các chư hầu của ngài, thưa [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]? Một thứ gì đó mang tính truyền thống?\"\n\nNếu ta muốn lấy lòng thần dân, quả thực ta nên xuất hiện như hình dung của họ về một người cai trị. Nhưng lãnh địa của ta lại có rất nhiều nền văn hóa khác nhau.\n\nBộ trang phục uy nghi của ta có thể làm hài lòng một người đồng văn hóa [vassal1.GetCulture.GetName] như [vassal1.GetTitledFirstName], nhưng những kẻ ngoài nền tảng chung ấy — như [vassal2.GetTitledFirstName] chẳng hạn — chỉ cảm nhận rõ hơn sự khác biệt giữa chúng ta."
  legend_spread_events.5055.a: "Cả hai nhóm đều có thể được xoa dịu."
  legend_spread_events.5055.a.tt: "Việc mang theo biểu trưng của cả hai nền văn hóa [vassal1.GetCulture.GetNameNoTooltip] và [vassal2.GetCulture.GetNameNoTooltip] sẽ khiến ta được nhìn nhận là một vị quân vương khoan dung và tôn trọng."
  legend_spread_events.5055.b: "Ta sẽ đại diện cho dân tộc của mình."
  legend_spread_events.5055.c: "Thần dân [vassal2.GetCulture.GetNameNoTooltip] cần một người để noi theo."
  legend_spread_events.5055.d: "Ta nên tránh tạo ra kẻ thù."
  legend_spread_events.5055.d.tt: "Tránh xung đột luôn dễ hơn việc đưa ra những tuyên bố."
  5055_vassal1_culture: "Mọi chư hầu thuộc [culture|E] [vassal1.GetCulture.GetName]"
  5055_vassal2_culture: "Mọi chư hầu thuộc [culture|E] [vassal2.GetCulture.GetName]"
  5055_every_culture_vassal: "Mọi chư hầu thuộc [culture|E] [vassal1.GetCulture.GetName] và [vassal2.GetCulture.GetName]"

  legend_spread_events.5060.t: "Thị Kiến Thiêng Liêng"
  legend_spread_events.5060.opening: ""Ngài biết đấy, thưa [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]," [chronicler.GetFirstName] bắt đầu một cách do dự khi chúng Ta bước chậm qua [ROOT.Char.Custom('GetCourtyard')], "Ta ngại nhắc đến, nhưng những người mộ đạo sẽ muốn biết vì sao ngài lại mất"
  legend_spread_events.5060.one_eyed: "một mắt.""
  legend_spread_events.5060.blind: "đôi mắt.""
  legend_spread_events.5060.ending: "\n\nTa dừng lại. Sự run rẩy trong giọng nói của [chronicler.GetFirstNamePossessiveNoTooltip] cho thấy vấn đề này nặng nề hơn mức cần thiết. Tuy vậy, Ta trầm ngâm khi nghe tiếng tụng niệm xa xa của [ROOT.Char.GetFaith.PriestNeuterPlural] theo gió vọng lại...\n\nCó lẽ cuối cùng đã đến lúc biến căn bệnh bị nguyền rủa này thành thứ gì đó thực sự có lợi cho ta?"
  legend_spread_events.5060.a: ""[ROOT.Char.GetFaith.HighGodName] đã hiện đến với ta, và thị kiến ấy khiến ta mù lòa!""
  legend_spread_events.5060.b: ""[ROOT.Char.GetFaith.HighGodName] đã lấy đi nó để ta có thể chứng minh lòng sùng tín của mình!""
  legend_spread_events.5060.c: ""Dù nguyên nhân là gì, điều đó đã khiến ta khiêm nhường trước [ROOT.Char.GetFaith.HighGodName].""
  legend_spread_events.5060.d: ""Chỉ là một vết thương cũ thôi, [chronicler.GetFirstNameNoTooltip].""
  legend_spread_events.5060.d.tt: "Không có lý do gì để nói dối về vấn đề cũ này."

  legend_spread_events.5065.t: "Bánh Mì Thánh"
  legend_spread_events.5065.desc: "Ta đang thưởng thức phần thứ hai của [ROOT.Char.Custom('GetExpensiveDessert')] thì bắt gặp [chronicler.GetFirstName] nhìn Ta với vẻ trách móc nhẹ.\n\n"Ngài biết đấy, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]," [chronicler.GetSheHe] nhẹ nhàng nói, "xét rằng ngài đang cố gắng, ờm, thể hiện sự thánh thiện của mình, có lẽ ngài nên tiết chế lại một chút?"\n\nTa nhìn xuống thức ăn. Rất ngon, nhưng có lẽ [chronicler.GetFirstNameNoTooltip] cũng có lý?"
  legend_spread_events.5065.a: "Bah, ta thấy hạnh phúc hơn thế này!"
  legend_spread_events.5065.b: ""Ngươi nói đúng. Ta sẽ cố gắng hơn.""
  legend_spread_events.5065.c: "Chỉ một chút thôi thì chắc không hại gì chứ?"

  legend_spread_events.5070.t: "Một Màn Ra Mắt Hoành Tráng"
  legend_spread_events.5070.desc: "I stand and wait clothes as [chronicler.GetFirstName] fusses around me, adjusting my clothes. Satisfied with [chronicler.GetHerHis] work, [chronicler.GetSheHe] muses a little.\n\n"I have been wondering," [chronicler.GetSheHe] starts, "whether you might consider a different style?" I return [chronicler.GetHerHis] gaze with suspicion.\n\n"Well, you have been trying to play up your ties to your forebears. Perhaps it is worth thinking about presenting yourself in their image?""
  legend_spread_events.5070.a: "Ta sẽ ăn mặc như những [culture.GetCollectiveNounNoTooltip] đầu tiên!"
  legend_spread_events.5070.a.success: "Ngài được ca ngợi vì trang phục của mình"
  legend_spread_events.5070.a.failure: "Không ai bị thuyết phục"
  legend_spread_events.5070.b: "Có lẽ vài nét gợi ý phong cách cũng không tệ..."
  legend_spread_events.5070.c: "Ta được truyền cảm hứng từ quá khứ, nhưng không lệ thuộc vào nó."
  every_culture_vassal: "Mọi chư hầu thuộc [culture.GetNameNoTooltip] của ngài"

  legend_spread_events.5075.t: "Sự Sùng Đạo Kiên Định"
  legend_spread_events.5075.desc: "[imam.GetFirstName] bustles past me with barely an acknowledgement, but it stops me in my tracks. My companion [chronicler.GetFirstName], noticing my consternation, begins to explain.\n\n"It is a prayer callus." [chronicler.GetSheHe|U] watches the receding [imam.GetFaith.PriestNeuter] with me for a moment, craning [chronicler.GetHerHis] neck to see [imam.GetHerHis] forehead. "Those who claim themselves holy prove their devotion through prostrating themselves with enough force to develop a bump on their head.""
  legend_spread_events.5075.a: "Chắc hẳn phải có cách giả mạo chuyện này..."
  legend_spread_events.5075.a.success: "Mọi người dễ dàng bị lừa"
  legend_spread_events.5075.a.failure: "Trò bịp bợm của ngài thất bại"
  legend_spread_events.5075.b: "Ta phải cầu nguyện #EMP mãnh liệt hơn!#!"
  legend_spread_events.5075.b.success: "Nó có tác dụng"
  legend_spread_events.5075.b.failure: "Đau quá"
  legend_spread_events.5075.c: "Thật là nhảm nhí."

  legend_spread_events.5200.t: "Mục Đích Kỳ Lạ"
  legend_spread_events.5200.desc: "[chronicler.GetFirstName] puts [chronicler.GetHerHis] hands to work once more, jotting down details of my legend.\n\n"One thing perplexes me," [chronicler.GetSheHe] muses. "Why did you choose to hunt this beast? Why, of all animals, did you choose to hunt this particular [legend.GetProperty( 'beast' ).GetFlagName]?""
  legend_spread_events.5200.a: "Ta muốn nếm thử #EMP thịt ngoại lai#! của nó."
  legend_spread_events.5200.b: "Nó... đã giết [dead_parent.GetMotherFather] của ta, [dead_parent.GetFirstNameNoTooltip]!"
  legend_spread_events.5200.b.success: "Câu chuyện của ngài nghe rất đáng tin"
  legend_spread_events.5200.b.failure: "Ai cũng biết đó không phải là cách họ chết"
  legend_spread_events.5200.c: "Vì vinh quang, tất nhiên rồi."

  legend_spread_events.5205.t: "Kẻ Xuất Chúng Nhất"
  legend_spread_events.5205.desc: "[chronicler.GetFirstName] vươn vai một chút, với tay lấy thêm [ROOT.Char.Custom('GetWritingMaterial')] để bổ sung cho chồng giấy ngày càng cao.\n\n"Vậy thì, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]," [chronicler.GetSheHe] lại cất lời đều đều, "hãy giải thích cho Ta vì sao ngài lại quyết tâm săn một đối thủ hung dữ như [legend.GetProperty( 'beast' ).GetFlagName]? Chắc hẳn đó là một kẻ thù vô cùng nguy hiểm?""
  legend_spread_events.5205.a: "Còn việc gì khác mà thợ săn vĩ đại nhất vùng này sẽ làm?"
  legend_spread_events.5205.b: "Đó chỉ là bước đệm cho con mồi còn nguy hiểm hơn..."
  legend_spread_events.5205.b.tt: "...và giờ ta đã biết cách tìm ra nó."
  legend_spread_events.5205.c: "Ta cần rèn luyện kỹ năng truy dấu."
  legend_spread_events.5205.d: "Để chứng minh tài săn bắn của ta."

  legend_spread_events.5210.t: "Tên Cướp Một Mắt"
  legend_spread_events.5210.desc: ""Có thật không?" [chronicler.GetFirstName] lục lọi tìm thêm [ROOT.Char.Custom('GetWritingMaterial')] để ghi chép, vừa hỏi Ta để xác nhận những câu chuyện. "Người ta đồn rằng đã có một cuộc chạm trán với một sinh vật vô cùng ghê tởm."\n\n"Ta nghe tin đồn về nó, một sinh vật khổng lồ nặng nề chỉ có một con mắt. Một tên cyclops hùng mạnh!""
  legend_spread_events.5210.a: "Và nó còn tưởng ta là đồng loại cyclops của nó nữa!"
  legend_spread_events.5210.b: ""Quả thực là một con quái vật hung tợn!""
  legend_spread_events.5210.c: "Ta nghĩ đó chỉ là người địa phương thôi."

  legend_spread_events.5215.t: "Không-Thể-Tin-Nổi"
  legend_spread_events.5215.desc: "Ta ngồi đó cùng [chronicler.GetFirstName] khi [chronicler.GetSheHe] tiếp tục ghi chép thêm truyền thuyết của Ta.\n\n"Phần nói về cây cối đó có thật không, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]?" Lông mày Ta nhướn lên khiến [chronicler.GetHerHim] tiếp lời. "Ý Ta là những loài cây thù địch ấy! Thực vật lá khổng lồ có thể làm ngài mê man từ xa bằng phấn hoa!""
  legend_spread_events.5215.a: "Ta có thể xác nhận điều đó với thẩm quyền nhất định."
  legend_spread_events.5215.b: "Một tình thế khủng khiếp, nhưng vẫn kiểm soát được."
  legend_spread_events.5215.c: "Không, nhưng ta đã biết rằng những loài cây như vậy có tồn tại!"

  legend_spread_events.5216.t: "Môn Thể Thao Địa Phương"
  legend_spread_events.5216.desc: "Ta nghịch một mũi tên lạc ra từ bó tên tựa vào tường khi [chronicler.GetFirstName] tiếp tục ghi chép thêm về truyền thuyết của Ta.\n\n"Nhắc mới nhớ, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]," [chronicler.GetFirstNameNoTooltip] nói, nhìn mũi tên. "Có đúng là đã có một thử thách không? Một [ROOT.Char.Custom('GetLassLad')] địa phương, bắn cung rất giỏi, thách đấu tất cả mọi người? Ai là kẻ chiến thắng?""
  legend_spread_events.5216.a: ""Ta thắng bằng cách chẻ đôi mũi tên của họ bằng mũi tên của chính mình!""
  legend_spread_events.5216.b: "'Twas một chiến thắng dễ dàng!"
  legend_spread_events.5216.b.success: "Nghe có vẻ đáng tin"
  legend_spread_events.5216.b.failure: "Không ai tin cả"
  legend_spread_events.5216.c: "Thật ra chỉ là luyện tập thôi."

  legend_spread_events.5220.t: "Cạm Bẫy Thiên Nhiên"
  legend_spread_events.5220.desc.start: "[chronicler.GetFirstName] nhìn Ta với vẻ suy tư.\n\n"Ta nghe kể rằng trong những chuyến hành trình của ngài, ngài đã gặp không ít thử thách." Cái gật đầu dè dặt của Ta dường như khuyến khích [chronicler.GetHerHim]. "Ta nghe nói rằng ngài suýt trở thành nạn nhân của"
  legend_spread_events.5220.desc.wet: "một đầm lầy hôi thối, hút chặt. "
  legend_spread_events.5220.desc.dry: "một vùng cát lún hút chặt. "
  legend_spread_events.5220.desc.ending: "Người ta nói ngài đã phải vật lộn để thoát ra, rằng nếu sức lực của ngài cạn kiệt thì ngài đã bỏ mạng!" [chronicler.GetSheHe|U] nhìn Ta đầy mong đợi."
  legend_spread_events.5220.a: ""À, chuyện đó chẳng là gì với một [ROOT.Char.GetWomanMan] tầm cỡ như ta!""
  legend_spread_events.5220.b: "Quả vậy! Nhưng cuối cùng ta vẫn thoát ra được."
  legend_spread_events.5220.c: "Chỉ là địa hình ngập nước thôi."

  legend_spread_events.5225.t: "Sức Mạnh Của Hoa"
  legend_spread_events.5225.desc: "Bó hoa nhỏ trên bàn Ta dường như thu hút sự chú ý của [chronicler.GetFirstNamePossessive].\n\n"Điều này làm ta nhớ lại, thưa [ROOT.Char.GetLadyLord]," [chronicler.GetSheHe] bắt đầu, "một câu chuyện ta từng nghe về ngài. Ta nghe rằng ngài đã tìm thấy một loài cây hoàn toàn độc nhất trong chuyến hành trình của mình?" [chronicler.GetSheHe|U] nhanh chóng nhìn lên Ta.\n\n"Ngài có mang theo một mẫu vật không?""
  legend_spread_events.5225.a: ""Tất nhiên là có!""
  legend_spread_events.5225.a.tt: "Đây hoàn toàn không phải là một loài hoa độc nhất, nhưng đủ lạ để đánh lừa người không rành."
  legend_spread_events.5225.b: "Ta có một mẫu ngay đây!"
  legend_spread_events.5225.b.tt: "Ừm, đây không phải là loài hoa #EMP phổ biến nhất#!..."
  legend_spread_events.5225.b.success: "[chronicler.GetNameNoTooltip] chưa từng thấy loài hoa như thế này"
  legend_spread_events.5225.b.failure: "[chronicler.GetNameNoTooltip] đã thấy rất nhiều ví dụ tương tự trước đó"
  legend_spread_events.5225.c: "#EMP Hoa ư?!#! Chẳng phải ta nên bàn về những điều vĩ đại hơn sao?"
  legend_spread_events.5225.d: ""E rằng là không.""

  legend_spread_events.5230.t: "Khát Máu"
  legend_spread_events.5230.desc: "[chronicler.GetFirstName] xông vào [ROOT.Char.Custom('GetRoom')] của Ta thường là điềm báo cho những câu hỏi kỳ quặc sắp tới, và lần này cũng không ngoại lệ.\n\n"Thưa [ROOT.Char.GetLadyLord]! Ta vừa nghe một câu chuyện vô cùng chấn động!" [chronicler.GetSheHe] kêu lên, vừa lục tìm thêm [ROOT.Char.Custom('GetWritingMaterial')]. "Người ta nói rằng ngài đã bị #EMP bọn ăn thịt người#! tấn công trên đường đi! Những kẻ ăn thịt người, ngài tin nổi không?!""
  legend_spread_events.5230.a: ""Thấy vết sẹo này không? Đó là do một tên trong bọn chúng gây ra.""
  legend_spread_events.5230.b: "...thật lòng mà nói, bọn chúng nấu thịt khá ngon."
  legend_spread_events.5230.c: "Và ta vẫn sống để kể lại câu chuyện!"
  legend_spread_events.5230.d: "Ta nghĩ họ chỉ là bọn cướp thôi."

  legend_spread_events.5235.t: "Một Chọi Một"
  legend_spread_events.5235.desc: "Ta đang thuật lại những chiến công trong trận chiến của mình cho [chronicler.GetFirstName] thì [chronicler.GetSheHe] đột ngột ngắt lời.\n\n\"Vậy thì có thật không? Ngài đã hạ sát tên chỉ huy địch hèn hạ đó trong một trận đơn đấu sao?\" Ánh mắt [chronicler.GetHerHis|U] lấp lánh với vô vàn khả năng. Rõ ràng đây là một dạng giai thoại phóng đại được truyền miệng.\n\nTa quả thực có mặt trong trận chiến đó, nhưng sự hỗn loạn của cận chiến khiến gần như mọi khả năng đều có thể xảy ra..."
  legend_spread_events.5235.a: "Chúng đã chết gọn dưới lưỡi kiếm của ta."
  legend_spread_events.5235.b: "Việc chúng chết dưới tay ai không hề quan trọng."

  legend_spread_events.5240.t: "Thận Trọng hay Dũng Cảm?"
  legend_spread_events.5240.desc: "Với những nét vẽ vội vàng trong một chiếc cốc hạt bị lật úp, [chronicler.GetFirstName] phác họa lại diễn biến của một trận chiến trong quá khứ. [chronicler.GetSheHe|U] nhanh chóng đổi giọng khi thấy ta đang quan sát.\n\n\"Chính đoạn này làm Ta tò mò nhất.\" [chronicler.GetSheHe|U] nói, chỉ vào một đường quét giữa đống hạt. \"Ta nghe kể rằng ngài đã giả vờ rút lui tại đây. Tuy nhiên, Ta cũng nghe được vài lời buộc tội khá là #EMP không mấy hay ho#!...\"\n\nTrái tim hèn nhát của ta run lên hoảng loạn dù chỉ là một cuộc tra hỏi lịch sự."
  legend_spread_events.5240.a: "Đó là một cuộc rút lui chiến thuật hoàn hảo."
  legend_spread_events.5240.b: "Dĩ… dĩ nhiên là một cuộc #EMP rút lui chiến thuật#! rồi!"
  legend_spread_events.5240.b.success: "Lời giải thích của Ngài nghe có vẻ đáng tin"
  legend_spread_events.5240.b.failure: "Sự phản đối của Ngài chỉ càng xác nhận tội trạng"
  legend_spread_events.5240.c: "...chúng ta đừng nhắc đến chuyện đó nữa."

  legend_spread_events.5245.t: "Đòn Quyết Định"
  legend_spread_events.5245.desc: "Càng dành nhiều thời gian với [chronicler.GetFirstName], ta càng mệt mỏi khi phải lặp lại một trận chiến cũ để huyền thoại của mình được ghi chép lại. [chronicler.GetSheHe|U] nhận ra sự hờ hững của ta và thử một cách khác.\n\n\"Khi cánh trái của địch sụp đổ và chúng ta tràn ra phía sau chúng,\" [chronicler.GetSheHe|U] bắt đầu, \"có đúng là chính ngài đã dẫn đầu đòn đánh vu hồi đó không? Một nước cờ thiên tài!\""
  legend_spread_events.5245.a: "\"Ta đã làm vậy. Nhiều kẻ đã chết dưới lưỡi kiếm của chúng ta.\""
  legend_spread_events.5245.b: "\"Thực ra, ta dẫn đòn quyết định từ chính diện.\""
  legend_spread_events.5245.c: "Ta chỉ đơn thuần chỉ huy trận chiến."

  legend_spread_events.5250.t: "Cứu Người Vô Tội"
  legend_spread_events.5250.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ôi [ROOT.Char.GetLadyLord] của Ta!\" Lời khẩn cầu đầy cảm xúc của [chronicler.GetFirstNamePossessive] khiến ta phải dừng lại. \"Ta vừa nghe kể về mối tình lãng mạn của ngài trên chiến trường! Một thường dân xinh đẹp, lạc lõng và hoang mang giữa trận mạc, và chính #EMP ngài#! đã cứu [ROOT.Char.Custom('GetHerHimOpposite')]!\"\n\nRõ ràng là [chronicler.GetFirstNameNoTooltip] sẽ không chịu từ bỏ hướng điều tra này."
  legend_spread_events.5250.a: "\"Ồ, ta đã cứu [ROOT.Char.Custom('GetHerHimOpposite')]. Ngay vào trong #EMP lều#! của ta!\""
  legend_spread_events.5250.b: "\"Ta còn được ban cho một nụ hôn làm phần thưởng nữa.\""
  legend_spread_events.5250.c: "\"Ngươi hẳn đã nhầm ta với người khác.\""

  legend_spread_events.5255.t: "Chuyện Kể Chiến Tranh"
  legend_spread_events.5255.desc: "\"Nghe kể về những trận chiến của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [chronicler.GetFirstName] nói, giọng hơi run lên một cách đầy kịch tính, \"thật là một kỳ tích khi ngài còn sống sót! Cái chết và sự tàn sát bủa vây tứ phía, vậy mà ngài vẫn toàn mạng trở ra.\"\n\nAi mà chẳng thích một câu chuyện chiến tranh hay ho. Có lẽ thêm thắt đôi chút sẽ giúp nó lan truyền tốt hơn?"
  legend_spread_events.5255.a: "\"Không hẳn là toàn mạng đâu, [chronicler.GetFirstNameNoTooltip].\""
  legend_spread_events.5255.b: "\"Ngươi nghĩ những vết sẹo này từ đâu ra?\""
  legend_spread_events.5255.c: "\"Tất cả là nhờ [ROOT.Char.GetFaith.HighGodName].\""
  legend_spread_events.5255.d: "\"Ta đã tiến lên anh dũng hết mức có thể!\""

  legend_spread_events.5260.t: "Đúng Lúc"
  legend_spread_events.5260.desc: "\"Quân ta bị dồn ép và truy kích dữ dội,\" [chronicler.GetFirstName] cắt ngang dòng hồi tưởng của ta khi chúng ta bàn về một trận chiến cũ, \"vậy mà cuối cùng vẫn giành chiến thắng! Ta nghe kể rằng chính #EMP ngài#! đã xuất hiện vào khoảnh khắc then chốt với quân tiếp viện! Một sự xuất hiện kịp thời để đảm bảo thắng lợi!\"\n\nDanh tiếng của [promoted_legend.GetName] cần được lan truyền rộng rãi, và những lời ca tụng chiến công anh hùng của ta sẽ giúp ích cho điều đó — nếu ta chọn nhận công lao này, dĩ nhiên..."
  legend_spread_events.5260.a: "\"Ta đã đến vừa kịp lúc.\""
  legend_spread_events.5260.b: "\"Mọi thứ đã được lên kế hoạch từ trước.\""

  legend_spread_events.5305.t: "láng giềng  Hòa Hảo"
  legend_spread_events.5305.desc: "[chronicler.GetFirstName] hối hả ghi chép lời ta đọc. Ta phải cẩn trọng trong từng lựa chọn: [potential_promoter.GetFirstName], vị quân chủ láng giềng  của ta, hoàn toàn có thể bị thuyết phục để ủng hộ việc lan truyền [promoted_legend.GetName], nhưng cách diễn đạt sai lầm có thể khiến ta trông như… tự cao.\n\nTa dừng lại. [chronicler.GetFirstNameNoTooltip] cũng vậy, kiên nhẫn chờ đợi. [potential_promoter.GetSheHe] #EMP muốn#! nghe điều gì đây?"
  legend_spread_events.5305.a: "Chắc hẳn [potential_promoter.GetSheHe] rất muốn thấy một người [root_culture.GetName] thành công!"
  legend_spread_events.5305.a.success: "[potential_promoter.GetFirstNameNoTooltip] đồng ý"
  legend_spread_events.5305.a.failure: "[potential_promoter.GetFirstNameNoTooltip] không mấy ấn tượng"
  legend_spread_events.5305.b: "Có lẽ… một lời đe dọa tinh tế."
  legend_spread_events.5305.b.success: "[potential_promoter.GetFirstNameNoTooltip] tỏ ra e dè"
  legend_spread_events.5305.b.failure: "[potential_promoter.GetFirstNameNoTooltip] phớt lờ lời đe dọa của Ngài"
  legend_spread_events.5305.c: "Chắc một lời kêu gọi tình láng giềng  hữu hảo sẽ hiệu quả?"
  legend_spread_events.5305.c.success: "[potential_promoter.GetFirstNameNoTooltip] chấp thuận"
  legend_spread_events.5305.c.failure: "[potential_promoter.GetFirstNameNoTooltip] không mấy quan tâm"
  legend_spread_events.5305.d: "Thôi, cứ gửi nguyên văn vậy."
  legend_spread_events.5305.d.success: "[potential_promoter.GetFirstNameNoTooltip] tỏ ra ấn tượng"

  legend_spread_events.5310.t: "Sứ Giả Của Huyền Thoại"
  legend_spread_events.5310.desc: "I can't help but pace restlessly as [herald.GetFirstName] readies provisions for [herald.GetHerHis] visit to the court of [potential_promoter.GetFirstName], my neighboring ruler. [herald.GetFirstNameNoTooltip|U] is expressly tasked with spreading word of [promoted_legend.GetName], preferably being able to corner the [potential_promoter.GetTitleAsNameNoTooltip] and persuade [potential_promoter.GetHerHim] to join the cause.\n\nPoise and grace will be needed for this task, and perhaps some other make-weights..."
  legend_spread_events.5310.a: "\"Hãy dùng trí khôn của ngươi!\""
  legend_spread_events.5310.a.success: "[potential_promoter.GetFirstNameNoTooltip] bị quyến rũ"
  legend_spread_events.5310.a.failure: "[herald.GetFirstNameNoTooltip] tỏ ra quá khúm núm"
  legend_spread_events.5310.b: "Món quà vàng này có thể thuyết phục [potential_promoter.GetHerHim]."
  legend_spread_events.5310.b.success: "Sức hấp dẫn của vàng tỏ ra rất lớn"
  legend_spread_events.5310.b.failure: "[potential_promoter.GetFirstNameNoTooltip] không bị lay chuyển bởi món quà"
  legend_spread_events.5310.c: "Cứ… đến đó và đừng làm hỏng việc."
  legend_spread_events.5310.c.success: "[herald.GetFirstNameNoTooltip] chứng tỏ rất hiệu quả"

  legend_spread_events.5315.t: "Lan Truyền Danh Tiếng"
  legend_spread_events.5315.desc: "Ta dừng lại, viết, rồi lại dừng, rồi lại viết...\n\nNhững lời trong bức thư này phải được chọn lựa cẩn thận. Bất kỳ cách diễn đạt sơ suất nào trong thông điệp gửi đến [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] của ta, [vassal.GetFirstName], đều sẽ không được đón nhận, nhưng nếu giành được sự ủng hộ của [vassal.GetHerHis] cho [promoted_legend.GetName] thì quả là một lợi thế lớn.\n\nGiờ thì, để xem nào. Điều gì #EMP chính là#! thứ mà [vassal.GetFirstNameNoTooltip] sẽ tán thành?"
  legend_spread_events.5315.a: "[vassal.GetSheHe|U] là một người đầy tham vọng!"
  legend_spread_events.5315.a.success: "[vassal.GetFirstNameNoTooltip] hài lòng"
  legend_spread_events.5315.a.failure: "Ngài đã đoán sai"
  legend_spread_events.5315.b: "[promoted_legend.GetNameNoTooltip] cũng có thể là một câu chuyện về #EMP sự trả thù#!..."
  legend_spread_events.5315.c: "Có lẽ ta nên thành thật nhất có thể?"
  legend_spread_events.5315.d: "Ta có thể diễn đạt sao cho làm vừa lòng [vassal.GetHerHim]..."

  legend_spread_events.5320.t: "Bôi Trơn Lời Nói"
  legend_spread_events.5320.desc: "Thường thì chư hầu sẽ tìm mọi cách để thu hút sự chú ý của lãnh chúa, nhưng lần này thì ngược lại. Có được [vassal.GetFirstName] làm người ủng hộ cho [promoted_legend.GetName] sẽ là một lợi thế lớn. Ta phải làm mọi cách để kéo [vassal.GetHerHim] về phe mình.\n\nTa phải suy nghĩ cẩn thận xem điều gì sẽ thu hút ánh mắt của [vassal.GetHerHis]. Có lẽ là một lời hứa đầu tư vào lãnh địa của [vassal.GetHerHis]? Hay chỉ đơn giản là một lời hứa ban ân huệ?"
  legend_spread_events.5320.artifact: "\n\nÁnh mắt ta dừng lại ở [artifact.GetName], phía bên kia căn phòng. Liệu [vassal.GetSheHe] có bị thuyết phục bởi một món quà như thế không?"
  legend_spread_events.5320.a: "Chắc chắn [vassal.GetSheHe] sẽ không từ chối đâu?"
  legend_spread_events.5320.a.success: "[vassal.GetFirstNameNoTooltip] vui vẻ nhận lấy"
  legend_spread_events.5320.a.failure: "[vassal.GetFirstNameNoTooltip] từ chối"
  legend_spread_events.5320.a.artifact: "[artifact.GetName] của Ngài nhận một hiệu ứng [prestige|E] #negative_value tiêu cực#!"
  legend_spread_events.5320.b: "Đầu tư vào [capital_county.GetNameNoTierNoTooltip] có thể rất thuyết phục."
  legend_spread_events.5320.b.success: "[vassal.GetFirstNameNoTooltip] rất hào hứng với đề nghị"
  legend_spread_events.5320.b.failure: "[vassal.GetFirstNameNoTooltip] không mấy ấn tượng"
  legend_spread_events.5320.c: "[vassal.GetHerHis|U] liege's favor should suffice."
  legend_spread_events.5320.d: "[vassal.GetSheHe|U] phải theo sự dẫn dắt của ta chứ!"
  legend_spread_events.5320.d.success: "[vassal.GetFirstNameNoTooltip] làm theo sự dẫn dắt của Ngài"

  legend_spread_events.5325.t: "Chim Nhỏ Truyền Tin"
  legend_spread_events.5325.desc: "Lại #EMP thêm một#! bức thư nữa — lần này là từ [legend_person.GetFirstName] — được sứ giả mang đến cho ta, và ta đã biết ngay nội dung của nó. Những câu chuyện về [promoted_legend.GetName] đang lan truyền khắp nơi, và ngày càng có nhiều miệng lưỡi đưa nó đi xa hơn nữa.\n\nQuả thực là một câu chuyện đáng chú ý. Có lẽ việc tham gia cùng những người như [legend_person.GetFirstNameNoTooltip] cũng mang lại vài lợi ích?"
  legend_spread_events.5325.protag: "\n\nHoặc, có lẽ là lợi ích vật chất? Nhân vật trung tâm của huyền thoại, [promoted_legend_owner.GetFirstName], có lợi ích trực tiếp trong việc lan truyền nó. [promoted_legend_owner.GetSheHe|U] cũng sở hữu một lượng tài sản đáng kể. Có lẽ một bức thư hồi đáp sẽ sinh lợi?"
  legend_spread_events.5325.a: "Uy tín từ lời nói của ta sẽ rất có giá trị."
  legend_spread_events.5325.b: "Ta sẽ gia nhập hàng ngũ những người tin tưởng công khai."
  legend_spread_events.5325.c: "Ta sẽ ủng hộ — nhưng đổi lại là một khoản..."
  legend_spread_events.5325.c.success: "[promoted_legend_owner.GetFirstNameNoTooltip] rất hào hứng với đề nghị"
  legend_spread_events.5325.c.failure: "[promoted_legend_owner.GetFirstNameNoTooltip] không mấy ấn tượng"
  legend_spread_events.5325.c.success.tt: "Bức thư của Ngài được đón nhận tích cực"
  legend_spread_events.5325.c.failure.tt: "Bức thư của Ngài bị đón nhận tiêu cực"
  legend_spread_events.5325.d: "Toàn là chuyện nhảm nhí!"
  legend_spread_events.5325.stop_promoting_warning: "@alert_icon! #alert_trial Điều này yêu cầu Ngài phải từ bỏ [legend|E] hiện tại!#!"
  legend_spread_events.5325.stop_promoting: "Ta dừng việc quảng bá [legend|E] hiện tại"

  legend_spread_events.5326.opening: "[ROOT.Char.Custom2('AppropriateGreetingPositive', promoted_legend_owner)]"
  legend_spread_events.5326.desc: "Đề xuất của Ngài rất đáng giá! Xin hãy nhận món quà này để đáp lại những nỗ lực của Ngài trong việc lan truyền danh tiếng tốt đẹp của [promoted_legend.GetName]."
  legend_spread_events.5326.a: "Tuyệt vời!"
  legend_spread_events.5326.b: "Ta sẽ không từ bỏ câu chuyện hiện tại của mình."

  legend_spread_events.5327.opening: "[ROOT.Char.Custom2('AppropriateGreetingNegative', promoted_legend_owner)]"
  legend_spread_events.5327.desc: "Nỗ lực hối lộ của ngươi thật ngu xuẩn và xúc phạm! Những chiến công lẫy lừng của ta không cần đến cái lưỡi độc địa của ngươi để lan truyền!"
  legend_spread_events.5327.a: "Chết tiệt!"

  legend_spread_events.5330.t: "Lời Thì Thầm Không Đứng Đắn"
  legend_spread_events.5330.desc: "Một câu chuyện hay thì hẳn nên được lan truyền bởi một con người tốt đẹp, phải không? Thế nhưng, những tin đồn về lối sống tội lỗi, [promoted_legend_owner.Custom('SinfulTrait')|l] của [promoted_legend_owner.GetFirstName] — [promoted_legend_owner.GetWomanMan] không ngừng rao giảng [promoted_legend.GetName] — vẫn liên tục đến tai ta.\n\nTa có thể tránh xa một nhân vật tai tiếng như vậy, nhưng việc gắn mình với một câu chuyện nổi tiếng như thế cũng mang lại cho ta không ít lợi ích..."
  legend_spread_events.5330.a: "Sao [promoted_legend_owner.GetSheHe] dám như vậy! Ta là một tín đồ mộ đạo của [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]!"
  legend_spread_events.5330.b: "Ta không thể dính líu đến [promoted_legend_owner.GetHerHim]."
  legend_spread_events.5330.c: "Ta sẽ nhắm mắt làm ngơ lần này..."
  legend_spread_events.5330.c.success: "Danh tiếng của Ngài làm tăng uy tín cho [promoted_legend_owner.GetFirstNamePossessiveNoTooltip]"

  legend_spread_events.5335.t: "Một Chủ Đề Xứng Đáng"
  legend_spread_events.5335.desc: "Rõ ràng là ta được mong đợi sẽ nói về câu chuyện hay đẹp của [promoted_legend.GetName], nhưng cũng phải thừa nhận rằng việc này trở nên dễ dàng hơn rất nhiều nhờ phong thái xuất sắc và đạo đức ngay thẳng của [promoted_legend_owner.GetFirstName].\n\nTừ quý tộc đến thường dân, ai nấy đều bàn tán về nhân cách đức hạnh của [promoted_legend_owner.GetHerHis], và điều đó dĩ nhiên cũng đã đến tai ta."
  legend_spread_events.5335.a: "Thật là một phúc lành khi được nuôi dưỡng huyền thoại của [promoted_legend_owner.GetHerHis]!"
  legend_spread_events.5335.b: "Có lẽ ta có thể tận dụng điều này để thúc đẩy cả hai mục tiêu..."
  legend_spread_events.5335.c: "Liệu ta có thể học được điều gì từ [promoted_legend_owner.GetHerHim] không?"
  legend_spread_events.5335.c.success: "Ngài học được một vài hiểu biết từ [promoted_legend_owner.GetFirstNameNoTooltip]"

  legend_spread_events.8000.t: "Cuốn Sách Bí Ẩn"
  legend_spread_events.8000.desc: "Bất chấp mọi nỗ lực, vẫn có những kẻ phủ nhận rằng người [promoted_legend.GetProtagonist.GetCulture.GetName] là những người thừa kế chân chính của dân tộc [promoted_legend.GetProperty('culture').Culture.GetName]. Hôm nay [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] đã đến gặp ta với một số thông tin có thể xua tan mọi nghi ngờ về tính chính danh của yêu sách của ta!\n\n[chronicler.GetSheHe|U] kể cho ta nghe về một cuốn sách cổ, mà [chronicler.GetSheHe] tin rằng tồn tại ở đâu đó trong [promoted_legend.GetProperty('original_region').GeographicalRegion.GetName], cụ thể là tại [province_to_visit.GetName]. Các nguồn tin có thể không đáng tin, nhưng nếu ta thử tìm kiếm cuốn sách này, ta vẫn có thể chứng minh tính chính danh của [promoted_legend.GetName]."
  legend_spread_events.8000.a: "Ta sẽ lên đường phiêu lưu!"
  legend_spread_events.8000.b: "Ta sẽ ở nhà!"
  travel_to_tome_tt: "Ngài sẽ [travel|E] tới [province_to_visit.GetName] nơi Ngài có thể tìm thấy cuốn sách cổ"
  legend_spread_events.8001.t: "Cuốn Sách [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Thất Lạc Theo Thời Gian"
  legend_spread_events.8001.desc: "Đáng tiếc thay, hoàn cảnh đã buộc ta phải từ bỏ kế hoạch du hành và manh mối bằng chứng mà ta theo đuổi đã nguội lạnh. Giờ đây ta không còn cách nào truy tìm cuốn sách nữa, và ta lo sợ rằng nó đã bị thời gian vùi lấp."
  legend_spread_events.8001.a: "Khốn kiếp!"
  legend_spread_events.8002.t: "Cuốn Sách [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Đặt Chân Tới"
  legend_spread_events.8002.desc: "Cuối cùng ta cũng đã đến [province_to_visit.GetName] và sau khi được người dân địa phương chỉ dẫn qua loa, ta đã tìm thấy tàn tích nơi ngôi mộ được cho là tồn tại. Công trình đổ nát này của nền văn minh [promoted_legend.GetProperty('culture').Culture.GetName] từng huy hoàng khiến ta nhớ rất nhiều đến [promoted_legend.GetProperty('title').Title.GetNameNoTier], ta chắc chắn rằng bằng chứng về mối liên hệ nằm đâu đó tại đây!\n\nTàn tích đang ở trong tình trạng mong manh, ta nghe thấy các trụ chống rệu rã dưới sức nặng của năm tháng, và ta phải bước đi cẩn trọng nếu không muốn mạo hiểm phá hủy hoàn toàn công trình này."
  legend_spread_events.8002.a: "Cần phải nghiên cứu thật cẩn thận."
  legend_spread_events.8002.b: "Mặc kệ tàn tích, ta phải tìm cho ra cuốn sách!"
  legend_spread_events.8002.c: "Ở đây có quá nhiều thứ để học hỏi, mặc kệ cuốn sách!"
  legend_spread_events.8002.d: "Ta từng đọc về nơi này! Ta biết phải tìm ở đâu."
  legend_spread_events.8003.t: "Cuốn Sách [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Được Khai Quật"
  legend_spread_events.8003.desc: "Ta đã cùng đoàn tùy tùng lục soát tàn tích suốt nhiều ngày, nhưng vẫn chưa tìm thấy bất cứ thứ gì cho thấy mối liên hệ giữa người [promoted_legend.GetProtagonist.GetCulture.GetCollectiveNoun] và người [promoted_legend.GetProperty('culture').Culture.GetCollectiveNoun]. Rồi đột nhiên, đoàn của ta mang đến một chiếc hộp bị thời gian tàn phá gần như vỡ nát, bên trong là một cuốn sách dày phủ đầy bụi bẩn và vết cáu.\n\nChỉ vài cú gõ và lắc nhẹ, ta phát hiện trong sách tràn ngập những sinh vật trong thần thoại [promoted_legend.GetProperty('culture').Culture.GetName], được khắc họa theo một phong cách rất [promoted_legend.GetProtagonist.GetCulture.GetNameNoTooltip]! Dù chữ viết đã phai mờ và thất lạc theo năm tháng, ta vẫn không thể không tin rằng cuốn sách kỳ diệu này chứng minh mối liên hệ rõ ràng giữa hai nền văn hóa!"
  legend_spread_events.8003.a: "Một phát hiện không thể tin nổi!"
  legend_spread_events.8004.t: "Cuốn Sách [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Thất Lạc"
  legend_spread_events.8004.desc: "Ta và đoàn tùy tùng đã tìm kiếm tàn tích này kỹ lưỡng hết mức có thể, vậy mà vẫn không thấy dấu vết nào của cuốn sách được đồn đại. Tuy nhiên, giữa đống đổ nát vẫn còn nhiều vật phẩm vô cùng hấp dẫn, một số trong đó chắc chắn được chế tác bởi bàn tay người [promoted_legend.GetProperty('culture').Culture.GetName].\n\nTa bỏ túi một bức chạm khắc động vật bằng đá nhỏ và chuẩn bị lên đường trở về."
  legend_spread_events.8004.a: "Ít ra cũng không hoàn toàn uổng công."
  legend_spread_events.8010.t: "Một Nhân Vật Kỳ Lạ"
  legend_spread_events.8010.desc: "We stop for a break on the road. My entourage surrounds a clearing, hurrying around watching for bandits and gathering supplies, leaving me to myself for just a moment. The wind blows out my crackling campfire like a match would to my breath. I feel something behind me, and I turn to see a stranger has found [challenger.GetHerHis] way into my camp. [challenger.GetSheHe|U] grins nonchalantly as if [challenger.GetSheHe] had always been there.\n\n"What a lucky day it is to happen upon the 'legend' [ROOT.Char.GetHerselfHimself], [ROOT.Char.GetNameNoTooltip]." [challenger.GetSheHe|U] reveals [challenger.GetHerHis] weapon to me. "Prove yourself a legend, [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('challenger'))].""
  legend_spread_events.8010.a: "\"Trận chiến của chúng ta sẽ trở thành huyền thoại.\""
  legend_spread_events.8010.b: "\"Lính gác!\""
  legend_spread_events.8012.t: "Huyền Thoại Rồi Cũng Sẽ Chết"
  legend_spread_events.8012.desc: "Đoàn tùy tùng của ta trở lại vừa kịp lúc để thấy ta gục ngã dưới chân [challenger.GetHerHis]. Ngay khi ta đứng dậy để đối mặt với đối thủ hùng mạnh và kỳ lạ của mình, [challenger.GetSheHe] dường như đã biến mất vào nơi hoang dã, như thể [challenger.GetSheHe] chưa từng tồn tại."
  legend_spread_events.8012.a: "Mọi người đều thấy [challenger.GetHerHim], đúng không?"
  legend_spread_events.8012.b: "Không ai thấy bất cứ điều gì cả."
  legend_spread_events.8013.t: "Chiến Thắng Huyền Thoại"
  legend_spread_events.8013.desc: "Đoàn tùy tùng của ta trở lại đúng lúc ta giành chiến thắng trước đối thủ bí ẩn của mình. Vũ khí của [challenger.GetHerHis|U] rơi xuống đất, và [challenger.GetSheHe] ngước nhìn ta, sững sờ.\n\nTa gọi đoàn tùy tùng, nhưng khi cúi nhìn xuống chân mình, [challenger.GetSheHe] đã biến mất, như thể [challenger.GetSheHe] chưa từng tồn tại."
  legend_spread_events.8013.a: "Ta thắng rồi... hình như vậy."
  legend_spread_events.8020.t: "Tà Giáo!"
  legend_spread_events.8020.desc: "I am interrupted at [ROOT.Char.Custom('GetCourt')] today as [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)] hurls [challenger.GetHerselfHimself] towards me, pointing and screaming "Heretic!" on [challenger.GetHerHis] way.\n\n"[legend.GetName|U] makes claim that [legend.GetProtagonist.GetNameNoTooltip] has powers beyond even [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! Heresy, of the highest degree!"\n\n[challenger.GetSheHe|U] sounds like a lunatic to me, but mutterings around the [ROOT.Char.Custom('GetRoom')] would indicate some already agree with [challenger.GetHerHim]."
  legend_spread_events.8020.a: "Ta có thể thuyết phục họ."
  legend_spread_events.8020.a.win: "Ngài thắng cuộc tranh luận"
  legend_spread_events.8020.a.lose: "Ngài thua cuộc tranh luận"
  legend_spread_events.8020.b: "Tống cổ tên [challenger.Custom2('InsultNoun', ROOT.Char)] này ra khỏi [ROOT.Char.Custom('GetCourt')] của ta."
  legend_spread_events.8020.c: "Không, sức mạnh thiêng liêng ấy có nguồn gốc #EMP từ#! [ROOT.Char.GetFaith.HighGodName]."
  legend_spread_events.8030.t: "Giống Như Ta"
  legend_spread_events.8030.desc: "In the distance, I hear [child.Custom2('MyCharacterIntroduction', ROOT.Char)] laughing at play with [child.GetHerHis] fellows.\n\n"I am [legend.GetProtagonist.GetNameNoTooltip], I'm the hero!" [child.GetSheHe|U] is reenacting [legend.GetName] for [child.GetHerHis] adoring peers.\n\nThe children all look upon [child.GetFirstNameNoTooltip] with wonder and adoration, captivated by the tale. My heart soars to hear those legendary names and places passing the lips of the next generation with such vigor and enthusiasm. Though one day all of us will turn to dust, the legend will never die."
  legend_spread_events.8030.a: "Cứ để [child.GetHerHim] tiếp tục."
  legend_spread_events.8030.b: "Ta nên tự mình kể lại câu chuyện!"
  legend_spread_events.8040.t: "Một Tổ Tiên Tội Lỗi"
  legend_spread_events.8040.desc: ""You would claim descent from the vile sinner [ancestor.GetName]?" [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] greets me this morning with an outstretched finger and a rabid look in [challenger.GetHerHis] eyes. "Blasphemy! [ancestor.GetSheHe|U] was a wicked [ancestor.GetWomanMan] of unholy vices. [ancestor.GetSheHe|U] was not [virtue_trait.GetName(ancestor)] as we've all been lead to believe, [ancestor.GetSheHe] was [sin_trait.GetName(ancestor)], a sinner if ever there was one!"\n\nAlong with the conviction in [challenger.GetHerHis] voice, [challenger.GetSheHe] has brought numerous records and written anecdotes of [ancestor.GetNamePossessiveNoTooltip] impious behavior which does not make my claims to [ancestor.GetHerHis] lineage look good..."
  legend_spread_events.8040.a: "Toàn là bịa đặt, chắc chắn vậy."
  legend_spread_events.8040.a.win: "Ngài thuyết phục được [challenger.GetHerHim]"
  legend_spread_events.8040.a.lose: "Danh tiếng của Ngài bị hoen ố"
  legend_spread_events.8040.b: "Báng bổ! Cút khỏi [ROOT.Char.Custom('GetCourt')] của ta!"
  legend_spread_events.8050.t: "Một Tổ Tiên Đức Hạnh"
  legend_spread_events.8050.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vội vã đến gặp ta sáng nay, tay ôm chồng [chronicler.Custom('GetWritingMaterialPlural')] cũ kỹ, gương mặt [chronicler.GetHerHis] rạng rỡ đầy phấn khích.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], Ta có tin tuyệt vời. Ta đã tìm kiếm thông tin về [ancestor.GetName], và phát hiện bằng chứng cho thấy bản chất [sin_trait.GetName(ancestor)] của [ancestor.GetHerHis] đã bị phóng đại quá mức, và thực chất [ancestor.GetSheHe] khá là [virtue_trait.GetName(ancestor)]!\"\n\nSẽ rất khó khăn, nhưng nếu ta có thể chứng minh điều này là đúng, di sản của [ancestor.GetNameNoTooltip] sẽ càng trở nên danh giá hơn nữa!"
  legend_spread_events.8050.a: "Chắc chắn là sự thật!"
  legend_spread_events.8050.a.win: "Ngài thuyết phục được tất cả mọi người"
  legend_spread_events.8050.a.lose: "Ngài không thuyết phục được ai"
  legend_spread_events.8050.b: "Hãy tập trung vào những gì có thể chứng minh."
  legend_spread_events.8050.c: "Nhưng còn... #EMP ta#! thì sao?"
  legend_spread_events.8060.t: "Lời Thú Tội Trên Giường Chết"
  legend_spread_events.8060.desc: "Ta được [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] chào đón, người tuyên bố có thông tin mới về [legend.GetName].\n\n[chronicler.GetSheHe|U] nói rằng trên giường hấp hối của [ancestor.GetNamePossessive], [ROOT.Char.GetFaith.HighGodName] đã bước vào trái tim [ancestor.GetHerHis] và khai sáng cho [ancestor.GetHerHim] về những đức hạnh của [ROOT.Char.GetFaith.GetName].\n\nTrong hành động cuối cùng này, [ancestor.GetSheHe] đã được chuộc tội và được đưa tới [ROOT.Char.GetFaith.PositiveAfterLife]."
  legend_spread_events.8060.a: "Dĩ nhiên, [ancestor.GetSheHe] là một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]!"
  legend_spread_events.8060.a.win: "Ngài thuyết phục được tất cả mọi người"
  legend_spread_events.8060.a.lose: "Lời khẳng định của Ngài vẫn không thuyết phục"
  legend_spread_events.8060.b: "Ít nhất thì #EMP giá trị#! của [ancestor.GetHerHis|U] cũng mang tính [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]."
  legend_spread_events.8070.t: "Một Sự Kiện Thiêng Liêng"
  legend_spread_events.8070.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đến gặp ta hôm nay với một đề xuất thú vị. [chronicler.GetSheHe|U] cho rằng [chronicler.GetSheHe] có thể bóp méo sự thật đôi chút và viết lại [legend.GetName] sao cho diễn ra tại vùng đất thánh của [holy_site.GetName] thay vì vùng trần tục [location.GetName].\n\nTất nhiên đây sẽ là một sự giả mạo, nhưng nó sẽ mang lại thêm sự mộ đạo cho câu chuyện."
  legend_spread_events.8070.a: "Cứ làm đi."
  legend_spread_events.8070.a.win: "Mọi người đều tin"
  legend_spread_events.8070.a.lose: "Không ai tin cả"
  legend_spread_events.8070.b: "Không, [location.GetNameNoTooltip] cũng #EMP giống như#! [holy_site.GetNameNoTooltip]."
  legend_spread_events.8080.t: "Nắm Đấm Huyền Thoại"
  legend_spread_events.8080.desc: "Ta đang trò chuyện rôm rả cùng [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] và một nhóm cận thần thì bị [chronicler.GetNameNoTooltip] cắt ngang khi đang kể lại câu chuyện [legend.GetName].\n\n\"Xin nhắc lại cho Ta, thưa [ROOT.Char.GetTitleAsNameNoTooltip], con [legend.GetProperty('beast').GetFlagName] đã bị hạ gục chính xác như thế nào? Chẳng phải nó đã bị đánh chết trong cận chiến hay sao?\""
  legend_spread_events.8080.a: "Đúng vậy. Chính xác là như thế."
  legend_spread_events.8080.a.crit_win: "Mọi người đều tin Ngài"
  legend_spread_events.8080.a.win: "Mọi người có vẻ tin Ngài"
  legend_spread_events.8080.a.lose: "Mọi người dường như không tin Ngài"
  legend_spread_events.8080.a.crit_lose: "Không ai tin Ngài cả"
  legend_spread_events.8080.b: "Nó bị giết như bất kỳ thợ săn nào cũng làm."
  legend_spread_events.8090.t: "[person_of_the_lake.GetLadyLord|U] của [watery_place.GetProvince.GetTerrain.GetNameNoTooltip|U]"
  legend_spread_events.8090.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] is transcribing [legend.GetName] to [chronicler.Custom('GetWritingMaterial')] as I dictate it to [chronicler.GetHerHim] once more, but as I recount the very beginning of the tale, [chronicler.GetSheHe] ceases committing my words to [chronicler.Custom('GetWritingMaterial')].\n\n"I cannot help but notice something missing here, my [ROOT.Char.GetTitleAsNameNoTooltip|U]. Did [legend.GetProtagonist.GetShortUIName] not meet with a mystical [person_of_the_lake.GetWomanMan] in [watery_place.GetName]? Did said [person_of_the_lake.GetWomanMan] not rise from the waters and give [legend.GetProtagonist.GetShortUIName] a divine mission?""
  legend_spread_events.8090.a: "À phải rồi, sao chúng ta lại quên nhỉ."
  legend_spread_events.8090.b: "Nhảm nhí: ta tự tay rèn nó!"
  legend_spread_events.8100.t: "Bị Ám Nặng Nề"
  legend_spread_events.8100.desc: "Ta bị giật khỏi giấc ngủ bởi một tiếng sấm sét và cánh [ROOT.Char.Custom('GetDoor')] bật tung, [superstitious_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] đứng dưới chân giường ta.\n\n\"Xin lỗi đã đánh thức ngài, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], nhưng nhiều người trong chúng Ta không thể ngủ được. Ta tin chắc rằng có một linh hồn tà ác đang hoạt động ở đây, và nó muốn đoạt lấy tất cả chúng ta.\"\n\nDù ta vô cùng bực bội vì bị đánh thức quá muộn, ta cũng biết đôi chút về một nghi thức có thể giam cầm linh hồn tà ác vào đồ vật..."
  legend_spread_events.8100.a: "Ta sẽ truyền nó vào cổ vật của mình!"
  legend_spread_events.8100.a.win: "Ngài truyền linh hồn thành công"
  legend_spread_events.8100.a.lose: "Ngài thất bại trong câu chú"
  legend_spread_events.8100.a.crit_lose: "Ngài lên cơn co giật"
  legend_spread_events.8100.b: "Ngươi điên rồi sao? Cút đi!"
  legend_spread_events.8100.c: "Ta biết chính xác phải làm gì."
  legend_spread_events.8100.d: "Ta sẽ hấp thụ linh hồn đó vào chính mình!"
  artifact_dread_gain_mult_3_modifier: "Kinh Hoàng"
  legend_spread_events.8110.t: "Dòng Máu của [loser.GetFaith.GetAdherentNamePluralNoTooltip|U]"
  legend_spread_events.8110.desc: ""Oh come off it, there's not a chance that happened."\n\n"No, it's true! [infidel_weapon.GetName|U] is crimson with the blood of one thousand [loser.GetFaith.GetAdherentNamePluralNoTooltip]! [ROOT.Char.GetNameNoTooltip|U] slew them all [ROOT.Char.GetHerselfHimself] in the [memory.GetName]!"\n\n[courtier_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] and [courtier_2.Custom2('MyCharacterIntroduction', ROOT.Char)] are engaged deeply in an argument, but fall silent when they realize I'm listening."
  legend_spread_events.8110.a: "Đúng vậy, ta đã tự tay giết hết bọn chúng."
  legend_spread_events.8110.a.win: "Ngài thuyết phục được cả hai"
  legend_spread_events.8110.a.lose: "Ngài không thuyết phục được họ"
  legend_spread_events.8110.b: "Không, chuyện này không đúng."
  legend_spread_events.8110.c: "Trận chiến ấy vĩ đại và nên được ghi nhớ."
  travel_to_distant_land_tt: "Ngài sẽ [travel|E] tới [distant_location.GetName]"
  legend_spread_events.8120.t: "Vùng Đất Huyền Bí [distant_title.GetBaseNameNoTooltip|U]"
  legend_spread_events.8120.desc: "I am given courteous greetings by [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] who seems to be abuzz with excitement.\n\n[chronicler.GetSheHe|U] tells me of a mystical land known simply as "[distant_title.GetBaseNameNoTooltip|U]", and [chronicler.GetSheHe] unfurls a map to this wonderful land in front of me. [chronicler.GetSheHe|U] tells me that the rivers run with milk and honey, and even the peasantry are fat with the abundance of the land. Though usually I would never venture so far, tales of my heroic journey would certainly have an effect on [legend.GetName]!"
  legend_spread_events.8120.a: "Ta phải đến đó!"
  legend_spread_events.8120.b: "[distant_title.GetBaseNameNoTooltip|U]? Không thể có nơi nào như vậy."
  legend_spread_events.8121.t: "Vùng Đất Xa Xôi: Bị Bỏ Dở"
  legend_spread_events.8121.desc: "Tấm bản đồ kỳ diệu dẫn tới [distant_title.GetBaseNameNoTooltip|U] của ta đã bị thất lạc, và ta e rằng mình sẽ không bao giờ đặt chân tới vùng đất ấy trong đời."
  legend_spread_events.8121.a: "Than ôi."
  legend_spread_events.8122.t: "Vùng Đất Xa Xôi: Đặt Chân Tới"
  legend_spread_events.8122.desc.intro: "Cuối cùng, ta đã đặt chân tới vùng đất xa xôi [distant_location.GetName] và"
  legend_spread_events.8122.desc.disappointing.sweden: "nỗi thất vọng của ta là không thể diễn tả. Bầu trời ban ngày đen kịt, thức ăn chẳng có gì ngoài cá muối và bánh mì cứng, dân địa phương từ chối nói chuyện với nhau, và cái lạnh thì không thể chịu nổi."
  legend_spread_events.8122.desc.disappointing.tribal: "Ta không thể thất vọng hơn được nữa. Ta được hứa hẹn một đô thị sừng sững, nhưng thứ ta thấy chỉ là vài túp lều và chòi rách."
  legend_spread_events.8122.desc.disappointing.wet: "Ta buồn bã trước những gì mình thấy. Sau khi lội qua những vùng nước, ta chỉ thấy vài căn nhà xiêu vẹo rải rác quanh bùn lầy."
  legend_spread_events.8122.desc.disappointing.dry: "Ta choáng váng trước tình trạng của nơi này. Vài bụi cây khô héo rải rác trên một vùng đất hoang tàn đầy những công trình đổ nát, hầu như không còn sinh khí."
  legend_spread_events.8122.desc.disappointing.fallback: "điều này hoàn toàn không giống những gì ta được hứa hẹn. Vùng đất kỳ diệu vĩ đại mang tên \"[distant_title.GetBaseNameNoTooltip|U]\" từng kích thích trí tưởng tượng của ta hóa ra chỉ là hư cấu. [distant_title.GetBaseNameNoTooltip] ngoài đời thực thì buồn bã và khiêm tốn."
  legend_spread_events.8122.desc.not_disappointing: "[distant_title.GetBaseNameNoTooltip] đúng như những gì ta hằng mong đợi! Vùng đất kỳ lạ này tràn đầy con người và nền văn minh rộng lớn. Các sạp chợ đầy ắp lương thực và thành phố vang lên tiếng trò chuyện rộn ràng."
  legend_spread_events.8122.desc.slightly_disappointing: "[distant_title.GetBaseNameNoTooltip] không hoàn toàn giống những gì ta được hứa hẹn. Dù là một khu định cư ấn tượng, nhưng sông ngòi không chảy sữa mật ong, và sự giàu có của tầng lớp quý tộc địa phương cũng không đến mức khó tin."
  legend_spread_events.8122.desc.somewhat_disappointing: "Ta không khỏi cảm thấy hụt hẫng. Dù là một khu định cư đủ tốt, nhưng nếu đây là điều tốt nhất mà [distant_title.GetBaseNameNoTooltip] có thể mang lại, thì sự huy hoàng của nó rõ ràng đã bị phóng đại."
  legend_spread_events.8122.desc.bridge: "\n\nTa tiến đến nơi mà ta cho là nhà của một gia đình quý tộc và được chào đón bởi"
  legend_spread_events.8122.desc.outro.same_culture: "một [distant_courtier.GetWomanMan] quen thuộc một cách kỳ lạ. [distant_courtier.GetName|U] tự giới thiệu [distant_courtier.GetHerselfHimself] bằng [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] hoàn hảo và yêu cầu biết ta muốn gì từ triều đình của chủ nhân họ, [distant_liege.GetName]."
  legend_spread_events.8122.desc.outro.same_religion: "a good [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip] [distant_courtier.GetWomanMan]! It seems even here, [ROOT.Char.GetFaith.HighGodName|U] is given proper worship. [distant_courtier.GetSheHe|U] demands to know who I am and what brings me this far."
  legend_spread_events.8122.desc.outro.fallback: "a strange noble [distant_courtier.GetWomanMan]. My noble bearing clearly precedes me, as [distant_courtier.GetSheHe] seems immediately eager to know who I am and what brings me here."
  legend_spread_events.8122.a: "Ta muốn xem người nơi đây chiến đấu như thế nào."
  legend_spread_events.8122.b: "Hãy để ta kể cho chủ nhân ngươi về [legend.GetName]."
  legend_spread_events.8122.b.success: "Huyền thoại của ngươi thật cuốn hút"
  legend_spread_events.8122.b.failure: "[distant_liege.GetFirstName] tỏ ra chán chường"
  legend_spread_events.8122.c: "Ngươi có món quà nào dành cho ta không?"
  legend_spread_events.8124.t: "Vùng Đất Xa Xôi: Thất Bại"
  legend_spread_events.8124.desc: "Dù ta đã chiến đấu dũng cảm, nhưng có vẻ ta không phải đối thủ của phong cách chiến đấu của một chiến binh [distant_title.GetAdjective]. Dù bại trận, việc ta từng giao tranh vũ khí với một kẻ ngoại quốc ở vùng đất huyền bí này vẫn sẽ củng cố danh tiếng huyền thoại của ta."
  legend_spread_events.8124.a: "Than ôi."
  legend_spread_events.8125.t: "Vùng Đất Xa Xôi: Chiến Thắng"
  legend_spread_events.8125.desc: "Đối thủ của ta chiến đấu theo những cách ta chưa từng thấy, và dù ban đầu khiến ta bối rối, ta vẫn giành được chiến thắng. Huyền thoại về chiến thắng của ta trước một chiến binh [distant_title.GetAdjective] chắc chắn sẽ lan truyền rộng khắp."
  legend_spread_events.8125.a: "Tuyệt vời."
  legend_spread_events.8125.b: "Gia nhập cùng ta!"
  legend_spread_events.8130.t: "Lễ Khai Tâm Thiêng Liêng"
  legend_spread_events.8130.desc: "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] comes to me with news regarding [legend.GetName]. [chronicler.GetSheHe|U] tells me that [chronicler.GetSheHe] has located multiple records that attest that [founder.GetName] was more than a mere [founder.GetTitleAsNameNoTooltip]. [founder.GetHerHis|U] right as ruler of [legend_title.GetName] was given to [founder.GetHerHim] by an angel.\n\nThis messenger from [ROOT.Char.GetFaith.PositiveAfterLife] promised that the house of [ROOT.Char.GetHouse.GetNameNoTooltip] would forever rule [legend_title.GetName] and enact [ROOT.Char.GetFaith.HighGodNamePossessive] will on earth. Though an incredible claim, if I could get enough people to believe it, none would question my rule."
  legend_spread_events.8130.a: "Điều này là sự thật."
  legend_spread_events.8130.a.win: "Lời khẳng định của ngươi có sức thuyết phục"
  legend_spread_events.8130.a.lose: "Lời khẳng định của ngươi bị xem là dị giáo"
  legend_spread_events.8130.b: "Không, đây là dị giáo."
  legend_spread_events.8141.t: "Chiến Thắng Huyền Thoại"
  legend_spread_events.8141.desc: "Khi quân đội của [enemy_commander.GetNamePossessive] bị đánh tan, ta đứng đó tận hưởng vinh quang của chính mình. Xung quanh ta là cờ xí rách nát và xác chết đang phân hủy của những kẻ dám đối đầu. Một binh sĩ nằm cạnh ta, khóc trong đau đớn, đôi tay nhuốm máu từ chính ruột gan của họ. Ta hít một hơi thật sâu bầu không khí tử khí nồng nặc ấy — mùi của chiến thắng.\n\nQuả thực, trận chiến này được quyết định bởi tài năng hiệp sĩ và chiến lược chỉ huy của chính ta. Đây là một trận chiến chắc chắn sẽ khiến tên tuổi ta vang danh."
  legend_spread_events.8141.a: "Một huyền thoại đáng để kể."
  legend_spread_events.8141.b: "Đây là điềm báo cho những điều sắp tới."
  legend_spread_events.8150.t: "Dấu Ấn Vĩnh Viễn"
  legend_spread_events.8150.desc: "As I feast, I sense that [intrigued_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] has been staring intently at my [ROOT.Char.Custom('GetInjuredBodyPart')], no doubt intrigued by my [ROOT.Char.Custom('PermanentInjuryAdjective')].\n\nAs soon as I make [intrigued_guest.GetHerHim] aware that I have noticed, [intrigued_guest.GetSheHe] quickly looks away, doubtless embarrassed to have been caught gawking at my deformity. Though I do feel somewhat insulted by [intrigued_guest.GetHerHis] fascination, this does give me an opportunity to tell the tale of just how this injury came to be."
  legend_spread_events.8150.a: "\"Ta bị thương khi chiến đấu với một con quái thú hùng mạnh!\""
  legend_spread_events.8150.b: "\"Ta bị dị giáo đồ tấn công khi đang chiến đấu vì [ROOT.Char.GetFaith.HighGodName|U].\""
  legend_spread_events.8150.c: "\"Đó là câu chuyện ta sẽ mang theo xuống mồ.\""
  legend_spread_events.8150.d: "\"Ngươi không có phép tắc sao? Đừng nhìn chằm chằm!\""
  legend_spread_events.8160.t: "Mối Tình Huyền Thoại"
  legend_spread_events.8160.desc: "My heart flutters to think of [soulmate.GetHerHim], and even as I sit alone in my [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'tent', 'study')], I just wish to sing of our love to all who will listen. My [ROOT.Char.Custom('WritingInstrument')] on the page, my feelings flow through the ink faster than I can write.\n\nAs I fill the page with [soulmate.GetHerHis] praises, I can't help but think of how I could immortalize our love through [legend.GetName]! Though the tale is focused on me, winning the heart of my fair [soulmate.Custom('PetName')] would make for an excellent addition to the tale."
  legend_spread_events.8160.a: "Chúng ta sẽ cùng nhau trở thành huyền thoại."
  legend_spread_events.8160.b: "Không, câu chuyện chỉ dành cho riêng ta."
  legend_spread_events.8170.t: "Chuông Ngân Cho Ai"
  legend_spread_events.8170.desc.intro: "I retreat to my chambers one evening, exhausted and weary from yet another day of tedium and monotony. As I lay on the edge of sleep, I am suddenly stirred awake by the shrill screeching of metal on stone.\n\nI shoot awake and see a shadowy figure at the edge of my bed, [ROOT.Char.GetFaith.DeathDeityHerHis] toothy grin the only illuminated part of [ROOT.Char.GetFaith.DeathDeityHerHim] I can see clearly. I cannot move, I can only stare as [ROOT.Char.GetFaith.DeathDeitySheHe] steps towards me, dagger in hand.\n\nThen, suddenly I wake once more."
  legend_spread_events.8170.desc.mid.taoist: "Đây là dấu hiệu rõ ràng rằng năng lượng của ta chưa được hài hòa hướng về [ROOT.Char.GetFaith.HighGodName|U]."
  legend_spread_events.8170.desc.mid.reincarnation: "Dù linh hồn ta một ngày nào đó sẽ tiếp tục vòng luân hồi, nhưng ta vẫn chưa sẵn sàng."
  legend_spread_events.8170.desc.mid.fallback: "[ROOT.Char.GetFaith.DeathDeitySheHe|U] đã đánh dấu ta bằng lần viếng thăm này."
  legend_spread_events.8170.desc.outro: "Ta lo sợ rằng mình sẽ sớm bị [ROOT.Char.GetFaith.DeathDeityName|U] thu nhận, một số phận mà ta phải thay đổi!"
  legend_spread_events.8170.a: "Ta phải trở nên bất tử."
  legend_spread_events.8170.b.chess: "[ROOT.Char.GetFaith.DeathDeitySheHe|U] có lẽ chỉ muốn chơi một ván cờ."
  legend_spread_events.8170.b.fallback: "Đó chỉ là một giấc mơ. Chỉ thế thôi, không hơn."
  legend_spread_events.8171.t: "Âm Vang Tương Lai"
  legend_spread_events.8171.desc: "Khi bế đứa con sơ sinh trong vòng tay, ta không khỏi thấy gương mặt mình phản chiếu trong [child.GetHerHis]. Ai cũng nói [child.GetSheHe] giống hệt ta, và họ nói đúng.\n\nCó lẽ đây chính là dạng bất tử mà ta tìm kiếm — một người sẽ mang di sản của ta tiến về phía trước và tiếp tục câu chuyện của ta khi ta đã ra đi."
  legend_spread_events.8171.a: "Câu chuyện không bao giờ kết thúc."
  legend_spread_events.8172.t: "Mục Đích Của Ta Là Gì?"
  legend_spread_events.8172.desc: "Xung quanh ta là bóng tối. Phía trước, một ánh sáng đơn độc hiện lên trong khoảng không xa xăm. Theo bản năng, ta bước qua hư vô hướng đến điểm sáng ấy, cho đến khi được chào đón bởi một hình bóng mặc toàn trắng, trông giống phiên bản lớn tuổi hơn của chính ta.\n\n[ROOT.Char.GetSheHe|U] mỉm cười với sự ấm áp mà chỉ một [ROOT.Char.GetMotherFather] mới có và mời ta ngồi cạnh [ROOT.Char.GetHerHim]. Đắm mình trong hơi ấm từ sự hiện diện của [ROOT.Char.GetHerHis], ta cảm thấy một niềm hân hoan và bình yên không thể giải thích.\n\n\"Con có biết vì sao ta khiến phàm nhân phải chết không, [ROOT.Char.GetFirstNameNoTooltip]? Đó là điều phân biệt con với ta. Con biết sinh mệnh quý giá đến nhường nào. Sự vĩnh hằng của con trong [ROOT.Char.GetFaith.PositiveAfterLife] sẽ đến, nhưng hiện tại, vẫn còn những con người bên dưới đang chờ đợi con.\""
  legend_spread_events.8172.a: "\"Con hiểu rồi. Cuối cùng con cũng hiểu.\""
  legend_spread_events.8172.b: "\"Không! Ta #EMP sẽ#! sống mãi mãi!\""
  legend_spread_events.8172.c: "\"Ta nghĩ mình đã sẵn sàng.\""
  legend_spread_events.8172.a.flavor: "Ngài tỉnh dậy, trở thành một [ROOT.Char.GetWomanMan] khác hẳn!"
  legend_spread_events.8172.b.flavor: "Ngài tỉnh dậy với sinh lực mới."
  legend_spread_events.8172.c.flavor: "Ngài quyết định ra đi trong lặng lẽ."
  legend_spread_events.8180.t: "Sự Báo Thù Chính Nghĩa"
  legend_spread_events.8180.desc: "Lately I've been wracked with sleepless nights, remembering how [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] [dead_parent.GetDeathReason]. How can one believe in justice when [killer.GetSheHe] lives and [dead_parent.GetFirstNameNoTooltip] should die?\n\nJust thinking about [killer.GetHerHim] still strutting around with air in [killer.GetHerHis] lungs brings my blood to boil and I just want to bring it to an end."
  legend_spread_events.8180.a: "[killer.GetNameNoTooltip] là kẻ thù của ta."
  legend_spread_events.8180.b: "Ta phải học cách tha thứ."
  8180_bonus_if_you_kill_tt: "Chất lượng huyền thoại của Ngài sẽ tăng mạnh nếu Ngài giết [killer.GetName]"
  legend_spread_events.8181.t: "Tên [killer.Custom2('InsultNoun'), ROOT.Char|U] Bị Chôn Vùi"
  legend_spread_events.8181.desc.intro: "Cuối cùng, [killer.GetName] đã không còn thở nữa và ta có thể nhẹ nhõm thở ra khi [killer.GetSheHe] không còn làm vẩn đục thế giới bằng sự hiện diện của [killer.GetHerHis]."
  legend_spread_events.8181.desc.mid.murder: "Tự tay đưa [killer.GetHerHim] xuống [ROOT.Char.GetFaith.NegativeAfterLife] là một vinh dự lớn."
  legend_spread_events.8181.desc.mid.fallback: "Ta từng mong chính tay mình giết chết [killer.Custom2('InsultNoun', ROOT.Char)], nhưng có vẻ [ROOT.Char.GetFaith.HighGodName] đã có kế hoạch riêng của [ROOT.Char.GetFaith.HighGodHerHis] cho [killer.Custom2('InsultNoun', ROOT.Char)]."
  legend_spread_events.8181.desc.outro: "\n\nTa cảm thấy [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] giờ đây cuối cùng cũng có thể yên nghỉ, và thế giới đã trở lại đúng trật tự."
  legend_spread_events.8181.a: "Cuối cùng cũng có công lý."
  legend_spread_events.8190.t: "Đứa Trẻ [ROOT.Char.MakeScope.Var('animal_type').GetFlagName|U]"
  legend_spread_events.8190.desc: "Ta ngồi thoải mái trong thư phòng vào một buổi tối muộn, kể lại [legend.GetName] cho [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)], khi một suy nghĩ chợt lóe lên. Ta thường bị đồng liêu gọi là 'kỳ quặc'. Dường như có điều gì đó ở ta khiến người khác khó lòng kết nối.\n\nTa cố gắng nhớ lại thời thơ ấu của mình nhưng không được bao nhiêu, song ta luôn cảm thấy một mối gắn bó mạnh mẽ với loài [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] cao quý, gần như tình cảm dành cho cha mẹ. Ta bật dậy, và [chronicler.GetNameNoTooltip] làm rơi [chronicler.GetHerHis] [chronicler.Custom('WritingInstrument')]. Ta có dám đưa ra một khẳng định như vậy không? Ta có dám nói rằng mình được một [ROOT.Char.MakeScope.Var('animal_type').GetFlagName] nuôi lớn không?"
  legend_spread_events.8190.a: "Ta dám!"
  legend_spread_events.8190.a.win: "Ngài thuyết phục được [chronicler.GetFirstNameNoTooltip]"
  legend_spread_events.8190.a.lose: "Có điều gì đó đã bị sai lệch khi truyền đạt"
  legend_spread_events.8190.a.crit_lose: "[chronicler.GetFirstNameNoTooltip] dường như đang chế giễu Ngài"
  legend_spread_events.8190.b: "Ta không dám."

