  legend_spread_events.0070.t: "Xứng Đáng?"
  legend_spread_events.0070.desc: "Những người hát rong chiếm lấy bục gỗ, lấp đầy đêm tối bằng âm nhạc. Khi nhấp một ngụm [ROOT.Char.Custom('RegionalAlcoholicDrink')], ta nhắm mắt lại và cho phép bản thân nghỉ ngơi một khoảnh khắc.\n\n\"Và giờ đây! Tất cả hãy lắng nghe! Tất cả hãy lắng nghe! #EMP [ROOT.Char.GetPromotedLegend.GetName]#!!\"\n\nSự náo nhiệt của [ROOT.Char.Custom('GetCourtierPlural')] vang khắp gian phòng — tiếng dao nĩa gõ vào bàn và những tràng cười ồn ào. Một ý nghĩ nghi ngờ ám ảnh ta, xen giữa sự ngưỡng mộ của [ROOT.Char.Custom('GetCourt')].\n\nTa có... xứng đáng không?"
  legend_spread_events.0070.a: "#EMP Dĩ nhiên#! Ta xứng đáng!"
  legend_spread_events.0070.b: "Ta... ta không còn chắc nữa."
  legend_spread_events.0070.c: "Không! Không! Ta #EMP không#! xứng!"
  legend_spread_events.0070.d: "Ta nghĩ là mình xứng đáng."
  legend_spread_events.0070.a.tt: "Ngài sẽ suy ngẫm về điều này"
 
  legend_spread_events.0071.t: "Một Anh Hùng Thật Sự"
  legend_spread_events.0071.desc.intro: "Nước trào lên từ lòng suối, những bong bóng nhỏ vỡ trên mặt nước. Ta cúi xuống nhìn vào màu xanh thẳm và thấy chính hình ảnh phản chiếu của mình.\n\n"
  legend_spread_events.0071.desc.mid.arrogant: "Mạnh mẽ. Tuấn tú. #EMP Xứng đáng.#!"
  legend_spread_events.0071.desc.mid: "Một bóng dáng nghi ngờ ẩn sau đôi mắt. Ta cố xua đuổi nó."
  legend_spread_events.0071.desc.promoter: "\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]...?\" Ta quay lại và thấy [promoter.GetTitledFirstName] đứng ngay bên cạnh. \"Xin hãy kể cho Ta nghe về huyền thoại của ngài. Ta đã đi nhiều ngày đêm để được nghe nó.\""
  legend_spread_events.0071.desc.fallback: "\n\nNhững [ROOT.Char.Custom('GetFollowerOrVassalPlural')] của ta... họ nhìn thấy gì ở ta? Ta đưa tay chạm vào mặt nước. Họ thấy gì? Một... anh hùng ư? Ta hy vọng là vậy."
  legend_spread_events.0071.a: "\"Một tâm hồn đồng điệu. Hãy tham gia cùng ta.\""
  legend_spread_events.0071.b: "[other_promoter.GetFirstNameNoTooltip] có thể bị thuyết phục... một kẻ hoàn toàn đối lập."
  legend_spread_events.0071.c: "Ta sẽ thuyết phục thần dân của mình."
  legend_spread_events.0071.d: "Ta phải là anh hùng cho chính bản thân mình."
  legend_chain_arrogant_modifier: "Anh Hùng Đích Thực"
  legend_chain_arrogant_modifier_desc: "Nhân vật này tràn đầy sự tự tin vào bản chất anh hùng của mình."
  legend_chain_kinda_arrogant_modifier: "Anh Hùng Tự Tin"
  legend_chain_kinda_arrogant_modifier_desc: "Nhân vật này quyết tâm chứng minh bản chất anh hùng của mình với mọi người."
 
  legend_spread_events.0072.t: "Tìm Kiếm Câu Trả Lời"
  legend_spread_events.0072.desc.intro: "Ta bước vào [ROOT.Char.Custom('GetFaithTemple')] và ánh sáng nhuộm lên các bức tường những gam màu dịu nhẹ của hoàng hôn.\n\n"
  legend_spread_events.0072.desc.mid.depressed: "Ta hít sâu một hơi. [ROOT.Char.GetFaith.HighGodName], con đã phụ lòng Ngài. Chỉ là một phàm nhân, không xứng đáng, vô dụng, #EMP thảm hại.#!\n\n"
  legend_spread_events.0072.desc.mid.fallback: "[ROOT.Char.GetFaith.HighGodName], Ngài có thấy con không? Có gì để thấy chứ? Một phàm nhân, có lẽ không xứng đáng, có lẽ lạc lối. Không còn ai dẫn đường cho con nữa.\n\n"
  legend_spread_events.0072.desc.vassal: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]...?\" Ta không nhận ra sự hiện diện khác trong đền thờ. [praying_vassal.GetTitledFirstName] đứng bên cạnh ta, hai tay [praying_vassal.GetHerHis] chắp lại cầu nguyện. \"Ta đã đi nhiều ngày đêm để nghe về huyền thoại của ngài. Ta biết rằng [ROOT.Char.GetFaith.HighGodName] cũng mong được nghe nó.\""
  legend_spread_events.0072.desc.fallback: "Ta đi qua đi lại trong gian phòng. Trong lòng mang những nỗi lo không thể thốt thành lời. Đức tin của ta lung lay. Thế nào là thánh thiện? Nếu ta không thể trở thành, thì ít nhất ta cũng sẽ cố gắng."
  legend_spread_events.0072.a: "Chỉ ý kiến của [ROOT.Char.GetFaith.HighGodNamePossessive] mới quan trọng."
  legend_spread_events.0072.b: "\"[praying_vassal.GetFirstNameNoTooltip]... ngươi nói đúng.\""
  legend_spread_events.0072.c: "Thần dân của ta phải biết về lòng mộ đạo của ta."
  legend_spread_events.0072.d: "Ta sẽ tìm sự an ủi nơi [bishop.GetTitledFirstNameNoTooltip]."
  legend_chain_zealous_modifier: "Huyền Thoại Nhiệt Thành"
  legend_chain_zealous_modifier_desc: "Nhân vật này đã tìm được câu trả lời nơi một đấng tối cao."
 
  legend_spread_events.0073.t: "Cô Đơn?"
  legend_spread_events.0073.desc.intro: "Không khí tĩnh lặng. Bất động. Những chiếc lá im lìm đến mức ta không biết liệu tất cả cây cối đã chết qua đêm hay chưa.\n\n"
  legend_spread_events.0073.desc.mid.depressed: "Ta cũng cảm thấy như vậy.\n\n"
  legend_spread_events.0073.desc.mid.fallback: "Ta ước gì có thể ở lại đây mãi. Ở đây, nơi tiếng kèn không thể chạm tới ta. Ở đây, nơi những lời của huyền thoại chỉ còn là tiếng thì thầm mờ nhạt.\n\n"
  legend_spread_events.0073.desc.vassal: ""[ROOT.Char.GetTitledFirstNameNoTooltip]?" I turn around to find [fighting_vassal.GetTitledFirstName] staring right at me, [fighting_vassal.GetHerHis] hand on the sword, sweat running down [fighting_vassal.GetHerHis] forehead. "I have traveled many days and nights to find you. The echoes of your legend have inspired me to become a better warrior. Please, do tell me of your deeds.""
  legend_spread_events.0073.desc.fallback: "Ta nhắm mắt lại. Ánh sáng sắc bén của lưỡi kiếm hiện lên trong tâm trí. Tia nắng phản chiếu trên thép. Một đôi mắt khác nữa. Một con thú, có lẽ. Hoặc một kẻ thù. Ta siết chặt nắm tay — ta đã từng làm điều đó trước đây. Và ta #EMP phải#! tiếp tục làm như vậy."
  legend_spread_events.0073.a: "Những trận chiến đang chờ đợi chúng ta."
  legend_spread_events.0073.b: "\"Dĩ nhiên, hãy đến đây, lắng nghe.\""
  legend_spread_events.0073.c: "Ta phải truyền cảm hứng cho thần dân của mình."
  legend_spread_events.0073.d: "[marshal.GetTitledFirstNameNoTooltip] luôn sát cánh cùng ta."
  legend_chain_army_modifier: "Sinh Ra Từ Chiến Trận"
  legend_chain_army_modifier_desc: "Nhân vật này tìm lại động lực mới trong những trận chiến sắp tới."
  legend_chain_marshal_modifier: "Huyền Thoại Quân Sự"
  legend_chain_marshal_modifier_desc: "Nhân vật này tập trung trở thành chiến binh xuất sắc nhất có thể."
 
  legend_spread_events.0074.t: "Trong Những Hang Động Của Tâm Trí"
  legend_spread_events.0074.desc.intro: "Bóng tối và giá lạnh ngự trị trong những hầm mộ này."
  legend_spread_events.0074.desc.mid.depressed: "Sự cám dỗ muốn ở lại đây ập đến với ta. Chỉ cần trốn đi, và quên hết mọi thứ khác. Một thôi thúc.\n\n"
  legend_spread_events.0074.desc.mid.fallback: "Nếu ta cứ ở lại đây thì sao? Trong im lặng. Chỉ có đá và ta. Thỉnh thoảng là một con gặm nhấm ghé qua. Trong đó có sự bình yên.\n\n"
  legend_spread_events.0074.desc.vassal: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]?\" Bóng dáng của [wise_vassal.GetTitledFirstNamePossessive] xuất hiện ở góc quanh. \"Ngài đang làm gì ở dưới này? Thật là một cuộc gặp định mệnh. Ta đã đi nhiều ngày đêm để tìm ngài. Huyền thoại của ngài... Ta phải thú nhận rằng nó đã chạm đến Ta.\"\n\n"
  legend_spread_events.0074.desc.spouse: "\"Người yêu dấu của em...\" [spouse.GetFirstName] thân yêu của ta đứng cạnh [wise_vassal.GetHerHim]. \"Em đã rất lo cho ngài.\""
  legend_spread_events.0074.desc.fallback: "Ta lang thang vô định theo những hành lang, không biết đích đến của mình. Bất cẩn. Bóng tối chồng lên bóng tối chồng lên bóng tối. Nếu ta thực sự xứng đáng với huyền thoại này... hẳn ta sẽ cảm nhận được, phải không? Có lẽ. Có lẽ."
  legend_spread_events.0074.a: "\"Tình yêu của ta... ta sẽ không làm nàng thất vọng.\""
  legend_spread_events.0074.b: "\"[wise_vassal.GetFirstNameNoTooltip], chính #EMP ngươi#! đã khiến ta xúc động.\""
  legend_spread_events.0074.c: "Ta không thể làm thần dân của mình thất vọng."
  legend_spread_events.0074.d: "[chancellor.GetTitledFirstNameNoTooltip] có thể giúp ta với những chi tiết ngoại giao."
  legend_chain_spouse_modifier: "Sự Hỗ Trợ Vô Giá"
  legend_chain_spouse_modifier_desc: "Nhân vật này đã được lay động bởi sự ủng hộ vô giá của người phối ngẫu dành cho huyền thoại của mình."
  legend_chain_chancellor_modifier: "Huyền Thoại Khéo Léo"
  legend_chain_chancellor_modifier_desc: "Nhân vật này dựa vào sự giúp đỡ của tể tướng để lấy lại sự tự tin vào huyền thoại của mình."
 
  legend_protagonist_legitimacy_miniscule_tt: "Ngài nhận thêm #positive_value [SCOPE.ScriptValue('miniscule_legitimacy_gain')|0]#! [legitimacy|E] từ [legend_protagonist|E] của mình"
  legend_protagonist_legitimacy_minor_tt: "Ngài nhận thêm #positive_value [SCOPE.ScriptValue('minor_legitimacy_gain')|0]#! [legitimacy|E] từ [legend_protagonist|E] của mình"
  legend_protagonist_legitimacy_medium_tt: "Ngài nhận thêm #positive_value [SCOPE.ScriptValue('medium_legitimacy_gain')|0]#! [legitimacy|E] từ [legend_protagonist|E] của mình"
  legend_protagonist_legitimacy_major_tt: "Ngài nhận thêm #positive_value [SCOPE.ScriptValue('major_legitimacy_gain')|0]#! [legitimacy|E] từ [legend_protagonist|E] của mình"

  legend_spread_events.5400.t: "Những Điểm Tô Vẽ Cần Thiết"
  legend_spread_events.5400.desc: "\"Nếu Ta có thể làm phiền ngài một lát, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [chronicler.GetFirstName] bắt đầu, giọng nịnh nọt hơi quá mức ta thích, \"thì sẽ là một ân huệ lớn nếu chúng ta có thể thêm vài chi tiết nữa vào [promoted_legend.GetName]. Càng... #EMP hoành tráng#! thì càng tốt!\" [chronicler.GetSheHe|U] nhìn ta đầy mong đợi.\n\nVài mầm mống âm mưu bắt đầu nảy sinh trong đầu ta. Việc kể lại câu chuyện hiện có theo cách hoa mỹ hơn chắc chẳng hại gì, nhưng thay thế một phần câu chuyện bằng một phiên bản hoàn toàn khác cũng có cái hay riêng..."
  legend_spread_events.5400.a: "\"Dĩ nhiên là ta sẽ kể lại một lần nữa!\""
  legend_spread_events.5400.a.majorsuccess: "Những chi tiết tô vẽ của Ngài khiến câu chuyện thêm phần rực rỡ"
  legend_spread_events.5400.a.minorsuccess: "Những chi tiết tô vẽ của Ngài khá chừng mực"
  legend_spread_events.5400.b: "\"À thì, ngươi biết đấy, chuyện đó thường bị trích dẫn sai...\""
  legend_spread_events.5400.b.success: "Cách Ngài xoay chuyển câu chuyện nghe rất thuyết phục"
  legend_spread_events.5400.b.failure: "Những điều chỉnh nghe hơi đáng thương"
  legend_spread_events.5400.c: "Có lẽ nên để câu chuyện phát triển một cách tự nhiên thì hơn?"

  legend_chapter_silver_tongued: "[ROOT.Legend.GetProtagonist.GetName|U] đã nhiều lần bị kẻ gian phục kích và quấy nhiễu, những kẻ muốn ngăn cản [ROOT.Legend.GetProtagonist.GetHerHim] trong hành trình chính nghĩa của [ROOT.Legend.GetProtagonist.GetHerHis]. Tuy nhiên, hết lần này đến lần khác, [ROOT.Legend.GetProtagonist.GetFirstName|U] lanh lợi đã đánh lừa chúng và thoát khỏi nanh vuốt của chúng."
  legend_chapter_easily_captured: "[ROOT.Legend.GetProtagonist.GetName|U] was ambushed and harassed, time and again, by evildoers that sought to prevent [ROOT.Legend.GetProtagonist.GetHerHim] in [ROOT.Legend.GetProtagonist.GetHerHis] righteous quest. Many times [ROOT.Legend.GetProtagonist.GetFirstName|U] was ambushed and languished in captivity, delayed from pursuing [ROOT.Legend.GetProtagonist.GetHerHis] noble goal."

  legend_spread_events.5405.t: "Những Tin Đồn Từ Hoang Dã"
  legend_spread_events.5405.desc: "\"Nào nào, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [chronicler.GetFirstName] khăng khăng khi chúng ta bàn thêm chi tiết về [promoted_legend.GetName].\n\n\"Ta phải biết — #EMP mọi người#! phải biết,\" [chronicler.GetSheHe] khoa tay một cách hoành tráng nhưng vô định, \"thực hư những tin đồn đó ra sao?\" Ta còn chưa kịp mở miệng hỏi thì [chronicler.GetSheHe] đã tiếp lời.\n\n\"Rằng ngài đã chạm trán một [ROOT.Char.Custom('RegionalMythicalCreature')] hùng mạnh trong chuyến hành trình của mình, không hơn không kém!\""
  legend_spread_events.5405.a: "\"Quả thật là có!\""
  legend_spread_events.5405.a.success: "Câu chuyện của Ngài vô cùng lôi cuốn"
  legend_spread_events.5405.a.failure: "Câu chuyện của Ngài thiếu sức thuyết phục"
  legend_spread_events.5405.b: "\"Nhảm nhí. Nhưng ta #EMP có#! thấy một thứ khác...\""
  legend_spread_events.5405.b.success: "Ngài đã thành công bịa ra một sinh vật mới ngay tại chỗ"
  legend_spread_events.5405.b.failure: "[chronicler.GetFirstNameNoTooltip] không tin Ngài"
  legend_spread_events.5405.c: "\"Ai mà biết được? Ta đã thấy biết bao điều kỳ diệu...\""

  legend_chapter_discovery_mythical_beast: "During [ROOT.Legend.GetProtagonist.GetHerHis] journey, [ROOT.Legend.GetProtagonist.GetFirstName] made a discovery that shook [ROOT.Legend.GetProtagonist.GetHerHim] to [ROOT.Legend.GetProtagonist.GetHerHis] core. Age-old myths about wild and wonderful creatures were proven true beyond a shadow of a doubt, and all hailed [ROOT.Legend.GetProtagonist.GetFirstName] for [ROOT.Legend.GetProtagonist.GetHerHis] bravery and inquisitive mind."
  legend_chapter_discovery_new_myth: "As [ROOT.Legend.GetProtagonist.GetFirstName] wandered, [ROOT.Legend.GetProtagonist.GetSheHe] found even more than [ROOT.Legend.GetProtagonist.GetSheHe] had ever dreamed when departing on [ROOT.Legend.GetProtagonist.GetHerHis] journey. A rare and extraordinary creature, twice the size of a man, with six legs and an arm growing out of its torso! Such a beast had never been heard of before, and thusly did [ROOT.Legend.GetProtagonist.GetFirstName] add to the growing tale of [ROOT.Legend.GetName]."

  legend_spread_events.5410.t: "Phía Bên Kia Có Gì?"
  legend_spread_events.5410.desc: "Ngày càng nhiều [ROOT.Char.Custom('GetWritingMaterialPlural')] được lấp đầy khi [chronicler.GetFirstName] ghi chép câu chuyện của ta. Băng qua đồi cao và thung lũng sâu, vượt qua những con sông hùng vĩ và thậm chí là...\n\n\"Ngài đã đi xa đến vậy sao, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" Đôi mắt [chronicler.GetFirstNamePossessiveNoTooltip] tràn đầy kinh ngạc. \"Xa đến mức tiến vào đại dương hoang dã đó ư?\"\n\nKhông ai biết điều gì nằm ngoài những vùng biển an toàn, quen thuộc của chúng ta. Có lẽ có vài giả thuyết được chấp nhận rộng rãi, nhưng liệu đây có phải là cơ hội để ta dệt nên câu chuyện của riêng mình?"
  legend_spread_events.5410.a: "\"Có một lục địa vĩ đại khác, nơi những quả nho rượu mọc lên...\""
  legend_spread_events.5410.a.flavor: "Sau cùng thì những tin đồn như vậy đã lưu truyền suốt nhiều năm..."
  legend_spread_events.5410.a.success: "Tin tức về phát hiện của Ngài lan truyền như cháy rừng"
  legend_spread_events.5410.a.failure: "[chronicler.GetFirstNameNoTooltip] trông có vẻ nghi ngờ trước tiết lộ này"
  legend_spread_events.5410.b: "Những quái vật hung tợn ngự trị trong những vực sâu thất thường ấy!"
  legend_spread_events.5410.c: "Cuộc thám hiểm của chúng ta bị chặn đứng bởi những trận chiến với cướp biển hung hãn."
  legend_spread_events.5410.d: "\"Ngoài kia ư? Chỉ có đại dương và cái chết.\""

  sea_monsters_modifier: "Quái Vật Biển"
  sea_monsters_modifier_desc: "Nhân vật này đã nhìn thấy và đánh lui những gã khổng lồ của vực sâu."

  legend_chapter_discovery_vinland: "Khi [ROOT.Legend.GetProtagonist.GetFirstName] lang thang, [ROOT.Legend.GetProtagonist.GetSheHe] đã phát hiện ra thứ trước đây chỉ được đồn đại và nói đến trong tưởng tượng. Vinland huyền thoại, một vùng đất rộng lớn ở phương bắc giá lạnh, không chỉ tồn tại mà còn có thể sinh sống! Quả thật, những câu chuyện vĩ đại lại có thêm một cái tên được khắc ghi — lần này là [ROOT.Legend.GetProtagonist.GetFirstName]."
  legend_chapter_sea_monsters: "Những chuyến hải trình của [ROOT.Legend.GetProtagonist.GetFirstName] đã đưa [ROOT.Legend.GetProtagonist.GetHerHim] băng qua biển cả, và [ROOT.Legend.GetProtagonist.GetSheHe] đã chứng kiến những cảnh tượng thực sự kinh hoàng. Những quái vật biển khổng lồ, quằn quại vây quanh họ tứ phía, và chỉ nhờ tài đi biển xuất sắc của [ROOT.Legend.GetProtagonist.GetFirstName] mà họ mới trở về an toàn."

  legend_spread_events.5415.t: "Dân Thường?"
  legend_spread_events.5415.desc: "Câu chuyện kỳ diệu về [ROOT.Char.GetPromotedLegend.GetName] tiếp tục lan truyền, ngày càng nhiều người từ mọi tầng lớp xã hội bắt đầu dệt nên góc nhìn riêng của họ vào tấm thảm phong phú ấy — ít nhất là theo lời [chronicler.GetFirstName].\n\n\"Cả lãnh chúa lẫn phu nhân đều tin rằng câu chuyện này khẳng định quyền cai trị không thể chối cãi của họ,\" [chronicler.GetSheHe] trầm ngâm, \"nhưng nếu ngài bước vào một quán rượu địa phương, sẽ đầy rẫy những người nói rằng nó được dành cho dân thường bé nhỏ của vùng đất này và lối sống lương thiện, cần cù của họ.\""
  legend_spread_events.5415.a: "Rõ ràng #EMP chính là#! câu chuyện của giới quý tộc."
  legend_spread_events.5415.b: "Tất nhiên là nói về dân thường rồi!"
  legend_spread_events.5415.c: "Rõ ràng đây là câu chuyện về [protagonist.GetFirstNameNoTooltip], không ai khác!"
  legend_spread_events.5415.c.protag: "...chẳng lẽ ngươi chưa ghi đủ #EMP tên ta#! sao?"

  legend_nobles_noted: "Quý Tộc Được Ghi Nhận"
  legend_nobles_noted_desc: "Câu chuyện này tập trung vào chiến công của giới quý tộc, củng cố quyền cai trị của họ."

  legend_commoners_celebrated: "Dân Thường Được Tôn Vinh"
  legend_commoners_celebrated_desc: "Câu chuyện này tập trung vào những người nông dân cần cù, khích lệ tinh thần của họ."

  legend_spread_events.5420.t: "Một Chén Rượu Huyền Thoại"
  legend_spread_events.5420.desc: "[chronicler.GetFirstName] continues to jot down more and more tales from [ROOT.Char.GetPromotedLegend.GetName], until suddenly [chronicler.GetSheHe] pauses, a sly smile on [chronicler.GetHerHis] lips.\n\n"Now, I did hear #EMP one#! rather interesting story," [chronicler.GetSheHe] begins slowly, "of a certain drinking contest with an ogre, of all things! How mightily our [ROOT.Char.Custom('GetHeroineHero')] did, to be able to drink such a creature under the table! Perhaps a demonstration would let me truly appreciate such a feat?"\n\nI don't know where this tall tale came from, but a certain amount of pride begins to prickle..."
  legend_spread_events.5420.a: "Mang cho ta một thùng rượu, ta sẽ chứng minh!"
  legend_spread_events.5420.a.success: "Ngài uống cạn cả thùng rượu"
  legend_spread_events.5420.a.failure: "Ngài bất tỉnh sau vài chén"
  legend_spread_events.5420.b: "Chuyện đó đã xảy ra. Tin đi là vừa!"
  legend_spread_events.5420.b.success: "[chronicler.GetFirstNameNoTooltip] đã bị thuyết phục"
  legend_spread_events.5420.b.failure: "[chronicler.GetFirstNameNoTooltip] vẫn không tin"
  legend_spread_events.5420.c: "Ta... ta thì... ta đang bị #EMP cảm lạnh nặng#!..."
  legend_spread_events.5420.c.tt: "Ngài tạo dựng một danh tiếng"

  legend_hangover_modifier: "Say Rượu"
  legend_hangover_modifier_desc: "Nhân vật này đã quá chén, gây hại cho bản thân."

  legend_shy_drinker: "Kẻ Uống Rượu Nhút Nhát"
  legend_shy_drinker_desc: "Nhân vật này đã tạo dựng danh tiếng là người không uống rượu giỏi."
