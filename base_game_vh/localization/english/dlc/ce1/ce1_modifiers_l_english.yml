l_english:
  ce1_lasting_line: "Dòng Dõi Trường Tồn"
  plague_cult_persecuted: "Bức Hại Giáo Phái Dịch Bệnh"
  plague_cult_persecuted_desc: "Một giáo sĩ được nhiều người yêu mến và có sức lôi cuốn gần đây đã bị xử tử vì truyền bá tà giáo."
  plague_cult_embraced: "Chấp Nhận Giáo Phái Dịch Bệnh"
  plague_cult_embraced_desc: "Một giáo sĩ được nhiều người yêu mến và có sức lôi cuốn đã giảng dạy những tín ngưỡng tà giáo tại tỉnh này, tuyên bố rằng chúng sẽ mang lại sự giải thoát khỏi dịch bệnh."
  beset_by_revenants: "Bị Ám Bởi Xác Quỷ"
  beset_by_revenants_desc: "Người dân tại tỉnh này tin rằng những xác quỷ đang trỗi dậy từ mồ mả và mang theo ôn dịch cùng bệnh tật"
  revenant_expelled: "Xác Quỷ Bị Trục Xuất"
  revenant_expelled_desc: "Quan tài của một quý tộc gần đây đã bị đóng chặt, xoa dịu nỗi lo của dân địa phương về khả năng xác quỷ trỗi dậy từ ngôi mộ."
  revenants_expelled: "Xác Quỷ Bị Trục Xuất Hết"
  revenants_expelled_desc: "Mọi quan tài trong hạt này đều đã được đóng chặt trước khi chôn cất, xoa dịu nỗi lo của dân địa phương về khả năng xác quỷ trỗi dậy từ mồ mả."
  flowers_planted: "Hệ Thực Vật Phong Phú"
  flowers_planted_desc: "Một cánh đồng hoa rộng lớn đã được trồng tại đây nhằm chống lại không khí ô uế của dịch bệnh."
  miasma_ignored: "Uế Khí Lan Tràn"
  miasma_ignored_desc: "Không khí ô uế bao trùm tỉnh này, và tầng lớp thống trị đã từ chối trồng các loài cây hương liệu để đối phó."
  medicating_with_leeches_good: "Điều Trị Bằng Đỉa Thành Công"
  medicating_with_leeches_good_desc: "Nhân vật này đã tự điều trị bằng đỉa, cải thiện khả năng kháng bệnh tổng thể của mình."
  medicating_with_leeches_bad: "Điều Trị Bằng Đỉa Thất Bại"
  medicating_with_leeches_bad_desc: "Nhân vật này đã tự điều trị bằng đỉa, khiến họ trở nên uể oải và lờ đờ mà không có dấu hiệu cải thiện rõ rệt."
  persecuted_flagellants: "Bức Hại Những Kẻ Tự Đánh Đập"
  persecuted_flagellants_desc: "Việc tự hành xác đã trở nên vô cùng phổ biến tại hạt này, và các lãnh chúa địa phương đã tàn bạo truy tố hành vi đó nhưng hầu như không hiệu quả."
  rampant_flagellants: "Hành Xác Lan Tràn"
  rampant_flagellants_desc: "Một giáo phái cực đoan tôn giáo đã thực hành việc tự hành xác tại hạt này, bất chấp việc các nhà chức trách tôn giáo lên án."
  apocalyptic_inquisition: "Tòa Án Dị Giáo Tận Thế"
  apocalyptic_inquisition_desc: "Một bộ phận dân chúng tại hạt này tin rằng dịch bệnh gần đây là dấu hiệu của ngày tận thế. Toàn bộ dân cư nay đã bị đặt dưới sự điều tra của tòa án dị giáo, dù họ có tin vào giáo phái đó hay không."
  plague_cult: "Giáo Phái Tận Thế"
  plague_cult_desc: "Vô số nam nữ trên khắp hạt này tin rằng dịch bệnh gần đây là dấu hiệu của ngày tận thế, gieo rắc nỗi sợ hãi và cuồng loạn."
  rampant_witch_trials: "Phiên Tòa Dịch Bệnh"
  rampant_witch_trials_desc: "Người dân trong hạt này đã tổ chức các phiên tòa xét xử những nhóm mà họ đổ lỗi cho dịch bệnh gần đây."
  witch_trials_slowed: "Trừng Phạt Các Phiên Tòa Dịch Bệnh"
  witch_trials_slowed_desc: "$rampant_witch_trials_desc$ Hành vi này đã bị tầng lớp quý tộc lên án rộng rãi."
  protected_jews: "Người Bảo Hộ Người Do Thái"
  protected_jews_desc: "Nhân vật này đã bảo vệ sự an toàn của các lữ khách Do Thái trong lãnh thổ của mình, mang lại cho họ danh tiếng rộng khắp trong các cộng đồng Do Thái."
  divine_guidance: "Chỉ Dẫn Thiêng Liêng"
  divine_guidance_desc: "Dân chúng địa phương trong hạt này gần đây đã được thuyết phục về mặt thần học để giảm mạnh việc bức hại các nhóm thiểu số."
  plague_animals_loose: "Thú Vật Mang Dịch"
  plague_animals_loose_desc: "Hạt này tràn ngập những loài động vật mà dân địa phương tin rằng là vật trung gian lan truyền dịch bệnh."
  royal_cats: "Động Vật Hoàng Gia: Mèo"
  royal_cats_desc: "Nhân vật này đã tuyên bố mèo là động vật hoàng gia của vương quốc, và việc làm hại chúng được coi là tội ác chống lại ngai vàng."
  royal_dogs: "Động Vật Hoàng Gia: Chó"
  royal_dogs_desc: "Nhân vật này đã tuyên bố chó là động vật hoàng gia của vương quốc, và việc làm hại chúng được coi là tội ác chống lại ngai vàng."
  lacking_cats_and_dogs_good: "Động Vật Mang Dịch Suy Giảm"
  lacking_cats_and_dogs_good_desc: "Một đợt tiêu diệt gần đây đã khiến số lượng động vật hoang giảm mạnh tại hạt này, làm chậm sự lây lan của dịch bệnh."
  lacking_cats_and_dogs: "Động Vật Suy Giảm"
  lacking_cats_and_dogs_desc: "Một đợt tiêu diệt gần đây đã khiến số lượng động vật hoang giảm mạnh tại hạt này, nhưng bằng cách nào đó lại dẫn đến sự gia tăng khả năng lây nhiễm bệnh."
  full_of_rabid_animals: "Đầy Rẫy Thú Dại"
  full_of_rabid_animals_desc: "Vô số động vật hoang đã bị đưa đến hạt này và đang lây lan bệnh tật khắp dân chúng."
  refused_to_repent: "Từ Chối Sám Hối"
  refused_to_repent_desc: "Dân địa phương tại hạt này gần đây đã yêu cầu một quý tộc bị bêu riếu công khai vì tội lỗi của họ, nhưng yêu cầu đó đã bị từ chối."
  witch_trials_obstructed: "Cản Trở Phiên Tòa Phù Thủy"
  witch_trials_obstructed_desc: "$witch_trials_slowed_desc$"
  persecuted_minorities_expelled: "Trục Xuất Các Nhóm Thiểu Số"
  persecuted_minorities_expelled_desc: "Các nhóm thiểu số đã bị trục xuất khỏi hạt này, làm suy giảm nghiêm trọng hoạt động thương mại."
  persecuted_minorities_protected: "Bảo Vệ Các Nhóm Thiểu Số Bị Bức Hại"
  persecuted_minorities_protected_desc: "Những nhóm thiểu số vốn sẽ bị bức hại tại quê nhà đã được trao nơi trú ẩn tại đây."
  plague_minorities_sanctuary: "Nơi Trú Ẩn Cho Nhóm Thiểu Số"
  plague_minorities_sanctuary_desc: "Những nhóm thiểu số mới bị trục xuất khỏi quê hương đã được cho phép định cư tại đây. Đáng tiếc là họ bị trục xuất trong thời kỳ dịch bệnh và thường mang theo mầm bệnh từ nơi cũ."
  plague_minorities_sanctuary_boosted: "Nơi Trú Ẩn Lớn Cho Nhóm Thiểu Số"
  plague_minorities_sanctuary_boosted_desc: "$plague_minorities_sanctuary_desc$"
  persecuted_minorities_financial_sanctuary: "Nơi Trú Ẩn Tài Chính"
  persecuted_minorities_financial_sanctuary_desc: "Các thương nhân ngoại quốc và thuộc nhóm thiểu số đã được cung cấp nơi trú ẩn khỏi sự bức hại tại hạt này."
  minority_persecution_forbidden: "Cấm Bức Hại Nhóm Thiểu Số"
  minority_persecution_forbidden_desc: "Dân địa phương tại đây gần đây đã cố gắng cưỡng bức trục xuất các nhóm thiểu số, nhưng hành vi này đã bị tầng lớp quý tộc địa phương cấm đoán."
  rats_eradicated: "Diệt Chuột"
  rats_eradicated_desc: "Việc tiêu diệt cẩn trọng mọi con chuột bị phát hiện đã khiến tỉnh này trở nên thịnh vượng hơn."
  pets_eradicated: "Tiêu Diệt Thú Nuôi"
  pets_eradicated_desc: "Việc tiêu diệt tàn nhẫn các thú nuôi địa phương đã khiến nhiều người phẫn nộ."
  vectors_reduced: "Giảm Vật Trung Gian Gây Bệnh"
  vectors_reduced_desc: "Việc tiêu diệt phần lớn đàn cừu địa phương đã làm chậm sự lây lan của dịch bệnh."
  disastrous_cull: "Cuộc Tiêu Diệt Thảm Họa"
  disastrous_cull_desc: "Việc tiêu diệt phần lớn đàn cừu địa phương đã gây tổn hại nghiêm trọng đến nền kinh tế địa phương."
  pleas_ignored: "Lời Cầu Xin Bị Phớt Lờ"
  pleas_ignored_desc: "Nhân vật này đã phớt lờ lời cầu xin của giới giáo sĩ, và kết quả là đã biến họ thành kẻ thù."
  draconian_lockdown: "Phong Tỏa Hà Khắc"
  draconian_lockdown_desc: "Một loạt quy định trừng phạt nghiêm khắc đã gây ra thiệt hại trên diện rộng cho nền kinh tế địa phương."
  trusted_ruler: "Lãnh Chúa Được Tin Tưởng"
  trusted_ruler_desc: "Các lãnh chúa địa phương tại đây nhận được sự tin tưởng tuyệt đối từ chủ quân của họ."
  supplies_sent: "Đã Gửi Tiếp Tế"
  supplies_sent_desc: "Tiếp tế đã được gửi đến đây để đối phó với mối đe dọa từ dịch bệnh địa phương."
  plight_ignored: "Khốn Cảnh Bị Bỏ Mặc"
  plight_ignored_desc: "Dịch bệnh mới manh nha tại tỉnh này đã hoàn toàn bị người cai trị phớt lờ."
  dead_boats: "Thuyền Chở Xác"
  dead_boats_desc: "Những con thuyền đầy xác chết đã trôi dạt vào bờ biển nơi đây, lan truyền dịch bệnh và tàn phá."
  clear_beaches: "Bãi Biển Sạch Sẽ"
  clear_beaches_desc: "Bờ biển của tỉnh này không còn người bệnh hay người hấp hối."
  contaminated_beaches: "Bãi Biển Ô Nhiễm"
  contaminated_beaches_desc: "Bãi biển của tỉnh này thỉnh thoảng trở thành nơi dạt vào của những con thuyền đầy xác chết."
  pestilent_beaches: "Bãi Biển Dịch Bệnh"
  pestilent_beaches_desc: "Bãi biển của tỉnh này rải rác những thi thể nhiễm bệnh, một cảnh tượng thực sự kinh hoàng."
  respected_dead: "Người Chết Được Tôn Trọng"
  respected_dead_desc: "Tỉnh này dành sự tôn kính trọn vẹn cho người đã khuất, ngay cả giữa lúc dịch bệnh hoành hành."
  health_first: "Sức Khỏe Là Trên Hết"
  health_first_desc: "Nhân vật này cố gắng đặt sức khỏe của bản thân lên trên người khác."
  dismissed_peasantry: "Người Chết Được Tôn Trọng"
  dismissed_peasantry_desc: "Dân thường của tỉnh này cảm thấy bị người cai trị phớt lờ và gạt ra bên lề."
  miracle_worker: "Người Làm Phép Màu"
  miracle_worker_desc: "Nhân vật này được cho là đã chữa lành người bệnh chỉ bằng một cái chạm!"
  man_of_the_people: "Quý Tộc Gần Dân"
  man_of_the_people_desc: "Nhân vật này ban phát sự cảm thông cho tầng lớp thấp kém hơn ngay cả giữa lúc dịch bệnh."
  out_of_touch: "Xa Rời Thực Tế"
  out_of_touch_desc: "“Cái chạm hoàng gia” của nhân vật này không những không chữa lành người bệnh mà dường như còn khiến họ chết nhanh hơn!"
  commoners_welcomed_in: "Dân Thường Được Đón Tiếp"
  commoners_welcomed_in_desc: "Dân thường của tỉnh này đã được chủ quân đón tiếp, và tất cả đều biết ơn lòng hiếu khách đó."
  commoners_turned_away: "Dân Thường Bị Từ Chối"
  commoners_turned_away_desc: "Dân thường của tỉnh này đã bị chủ quân từ chối trong lúc khó khăn, và nhiều người vô cùng bất mãn."
  fears_allayed: "Nỗi Sợ Được Xoa Dịu"
  fears_allayed_desc: "Dân thường của tỉnh này cảm thấy nỗi sợ của họ đã được trấn an và vui vẻ làm theo chỉ dẫn."
  fears_ignored: "Nỗi Sợ Bị Phớt Lờ"
  fears_ignored_desc: "Dân thường của tỉnh này cảm thấy nỗi sợ của họ bị gạt bỏ và tiếp tục than phiền."
  strict_coastal_quarantine: "Cách Ly Ven Biển Nghiêm Ngặt"
  strict_coastal_quarantine_desc: "Các thương nhân vào tỉnh này bằng đường biển phải tự cách ly trong nhiều ngày trước khi được phép buôn bán."
  coastal_quarantine: "Cách Ly Ven Biển"
  coastal_quarantine_desc: "Các thương nhân vào tỉnh này bằng đường biển phải tự cách ly một thời gian trước khi được phép buôn bán."
  cackling_loon: "Kẻ Cười Điên Dại"
  cackling_loon_desc: "Xu hướng cười xòa trước mọi rắc rối của nhân vật này quả thật có #EMP vài#! tác hại..."
  herbalist_suspicions: "Nghi Ngờ Thầy Thuốc"
  herbalist_suspicions_desc: "Kỹ năng dùng cao dán và thảo dược của nhân vật này đã khiến họ trở thành đối tượng bị nghi ngờ trong thời kỳ dịch bệnh."
  absent_ruler: "Lãnh Chúa Vắng Mặt"
  absent_ruler_desc: "Nhân vật này đã phản ứng trước mối đe dọa của dịch bệnh sắp tới bằng cách gần như không rời khỏi phòng riêng."
  present_ruler: "Lãnh Chúa Hiện Diện"
  present_ruler_desc: "Nhân vật này là một người cai trị năng động và dễ thấy, ngay cả trong thời kỳ dịch bệnh và suy tàn."
  hiding_from_epidemic: "Trốn Tránh Dịch Bệnh"
  hiding_from_epidemic_desc: "Nhân vật này dành thời gian ẩn mình khi dịch bệnh hoành hành trong lãnh thổ của họ.\n\n[infection_chance|E]: #P -75%#!"
  sachet_protection: "Túi Hương Bảo Hộ"
  sachet_protection_desc: "Túi thảo mộc thơm mà nhân vật này mang theo có thể không thực sự bảo vệ họ khỏi bệnh tật, nhưng chắc chắn khiến họ và những người xung quanh #EMP cảm thấy#! an toàn hơn."
  overly_fragrant: "Quá Nồng Mùi"
  overly_fragrant_desc: "Việc sử dụng quá nhiều túi thảo mộc của nhân vật này có thể không thực sự bảo vệ họ khỏi bệnh tật, nhưng chắc chắn khiến #EMP họ#! cảm thấy dễ chịu hơn — dù phải đánh đổi bằng đôi mắt cay xè của những người xung quanh."
  ce1_legendary_feaster: "Yến Tiệc Huyền Thoại"
  ce1_legendary_feaster_desc: "Nhân vật này đã rong ruổi khắp thế giới, lan truyền huyền thoại của mình tại các sự kiện và lễ hội cho bất kỳ ai chịu lắng nghe."
  ce1_legendary_performance: "Màn Trình Diễn Huyền Thoại"
  ce1_legendary_performance_desc: "Nhân vật này gần đây đã trình diễn một màn kịch tính về huyền thoại của mình. Dù không tiếp cận được đúng đối tượng mong muốn, nhưng dân thường lại tỏ ra vô cùng ấn tượng."
  ce1_legendary_taverns: "Huyền Thoại Địa Phương"
  ce1_legendary_taverns_desc: "Huyền thoại của nhân vật này đã được dân thường trong lãnh thổ đón nhận nhiệt tình, giúp tăng mạnh tốc độ lan truyền. Mọi người đi từ quán rượu này sang quán khác để kể lại huyền thoại."
  ce1_legend_mocked: "Huyền Thoại Bị Chế Giễu"
  ce1_legend_mocked_desc: "Huyền thoại của nhân vật này gần đây đã bị chế giễu tại một lễ hội văn hóa, khiến người khác ngại ngần không dám lan truyền nó."
  studying_ancient_cultures: "Nghiên Cứu Các Nền Văn Hóa Cổ Đại"
  studying_ancient_cultures_desc: "Nhân vật này gần đây đã khám phá một phế tích cổ xưa từng thuộc về một dân tộc cổ đại và được khai sáng bởi những gì tìm thấy tại đó."
  kids_legend_modifier: "Huyền Thoại Trẻ Em"
  kids_legend_modifier_desc: "Trẻ em đang diễn lại huyền thoại của nhân vật này, làm tăng tốc độ lan truyền."
  legendary_holy_site: "Thánh Địa Huyền Thoại"
  legendary_holy_site_desc: "Dù không có ý nghĩa gì đối với đức tin, các tín đồ hành hương vẫn đổ về hạt này do một huyền thoại đã ví nơi đây như thánh địa."
  legend_county_culture_builders: "Văn Hóa Thủ Phủ"
  legend_county_culture_builders_desc: "Người dân nơi đây tự hào rằng tổ tiên của họ chính là những người đã xây dựng nơi này."
  legend_character_culture_builders: "Ân Huệ Người Kiến Tạo"
  legend_character_culture_builders_desc: "Nhân vật này vui vẻ trấn an cư dân thủ phủ rằng tổ tiên chung của họ đã xây dựng nên khu định cư hùng vĩ này, và không ai khác."
  legend_humble_king: "Lãnh Chúa Khiêm Nhường"
  legend_humble_king_desc: "Việc khiêm tốn hạ thấp các hành động thánh thiện của mình mang lại cho nhân vật này thêm uy tín trong mắt tín đồ."
  legend_mothers_boy: "Kính Trọng"
  legend_mothers_boy_desc: "Sự kính trọng của nhân vật này đối với cha mẹ đã đặt ra một chuẩn mực cho mọi người noi theo."
  legend_charitable_donations: "Quyên Góp Từ Thiện"
  legend_charitable_donations_desc: "Tỉnh này đang được hưởng lợi từ nhiều tấm gương quyên góp từ thiện."
  legend_sick_hospitals: "Nhà Tế Bần Được Sử Dụng Nhiều"
  legend_sick_hospitals_desc: "Người dân trong tỉnh này biết rằng nơi đầu tiên họ nên đến khi ốm đau chính là nhà tế bần."
  legend_bloodthirsty_warrior: "Chiến Binh Khát Máu"
  legend_bloodthirsty_warrior_desc: "Nhân vật này tự hào về những chiến công quân sự của mình."
  legend_stigmatic: "Dấu Thánh"
  legend_stigmatic_desc: "Nhân vật này có nhiều vết thương cũ tại những vị trí trùng khớp với các vết thương của Chúa Giê-su."
  legend_culturally_sensitive: "Nhạy Cảm Văn Hóa"
  legend_culturally_sensitive_desc: "Nhân vật này hiểu rõ khả năng nảy sinh căng thẳng giữa các nền văn hóa khác nhau và có biện pháp để đảm bảo những căng thẳng đó hiếm khi bùng phát."
  legend_visions_of_god: "Thị Kiến Thần Thánh"
  legend_visions_of_god_desc: "Nhân vật này tuyên bố rằng việc mất thị lực của họ là do một thị kiến thiêng liêng khiến họ bị mù."
  legend_holy_sacrifice: "Hy Sinh Thánh Thiêng"
  legend_holy_sacrifice_desc: "Nhân vật này tuyên bố rằng họ đã hiến dâng một con mắt cho đấng thiêng liêng."
  legend_gods_humble_servant: " Bề Tôi Khiêm Nhường"
  legend_gods_humble_servant_desc: "Nhân vật này tuyên bố rằng khiếm khuyết thị lực đã khiến họ trở nên khiêm nhường và mộ đạo hơn."
  legend_sneaks_food: "Lén Ăn"
  legend_sneaks_food_desc: "Nhân vật này sợ bị xem là thiếu mộ đạo vì hưởng thụ quá mức, nhưng vẫn không cưỡng lại được việc lén ăn vặt."
  legend_fat_and_happy: "Mập Và Hạnh Phúc"
  legend_fat_and_happy_desc: "Nhân vật này có thân hình hơi quá khổ, nhưng hoàn toàn hài lòng với điều đó."
  legend_historical_bedecking: "Trang Phục Cổ Xưa"
  legend_historical_bedecking_desc: "Nhân vật này mặc trang phục của dân tộc mình từ thời xa xưa, có chủ ý gợi nhớ đến ký ức ấy."
  legend_modern_ruler: "Lãnh Chúa Hiện Đại"
  legend_modern_ruler_desc: "Nhân vật này từ chối tuân theo các quy tắc của quá khứ, tự mở ra con đường riêng."
  legend_prayer_callus: "Vết Chai Cầu Nguyện"
  legend_prayer_callus_desc: "Nhân vật này có một vết 'zabiba' hay 'chai cầu nguyện', một dấu ấn trên trán chứng minh lòng mộ đạo khi phủ phục cầu nguyện."
  legend_bruised_head: "Trán Bầm Dập"
  legend_bruised_head_desc: "Nhân vật này đã tự gây ra một chấn thương nhẹ, khiến thỉnh thoảng bị đau đầu."
  legend_claimed_stigmatic: "Tự Nhận Là Người Mang Dấu Thánh"
  legend_claimed_stigmatic_desc: "Nhân vật này mang một dấu vết mà họ cho là tương tự những gì Chúa Giê-su đã chịu đựng. Điều này đã gây ra nhiều tranh cãi dữ dội."
  mysterious_sword_giver_great: "Vùng Nước Huyền Thoại"
  mysterious_sword_giver_great_desc: "Người ta nói rằng có một thực thể huyền bí vĩ đại ngự trong vùng nước của hạt này, ban phát những số mệnh thần bí cho bất kỳ ai tìm được họ."
  mysterious_sword_giver: "Vùng Nước Lẫy Lừng"
  mysterious_sword_giver_desc: "$mysterious_sword_giver_great_desc$"
  ce1_evil_spirit: "Ác Linh"
  ce1_evil_spirit_desc: "Nhân vật này tin rằng họ đã bị một ác linh nhập vào, và vì vậy trở nên cực kỳ cáu kỉnh và thất thường."
  angelic_founder: "Khởi Nguyên Thiên Thần"
  angelic_founder_desc: "Các thành viên của gia tộc này đều đồng thuận rằng sự khai sinh của họ được khởi động bởi một thiên thần."
  legendary_item: "Đất Ngoại Bang"
  legendary_item_desc: "Người cai trị địa phương đã mang về một ít đất từ một vùng đất huyền bí xa xôi, khiến nhiều người tin rằng thứ đất này có đặc tính ma thuật."
  legendary_item_personal: "Hành Trình Huyền Thoại"
  legendary_item_personal_desc: "Nhân vật này đã du hành đến một vùng đất cực kỳ xa xôi, truyền bá những câu chuyện về huyền thoại của họ trên suốt chặng đường."
  ce1_heartthrob: "Người Gây Thổn Thức"
  ce1_heartthrob_desc: "Nhân vật này đang trên một cuộc hành trình lãng mạn mang tính huyền thoại và đã từ chối gọi ngay cả người tình thân cận nhất của mình là tình yêu đích thực."
  ce1_legendary_battle: "Trận Chiến Huyền Thoại"
  ce1_legendary_battle_desc: "Nhân vật này gần đây đã tham gia vào một trận chiến có thể được gọi là huyền thoại, báo hiệu cho những chiến công vĩ đại hơn sắp tới."
  legend_renowned_herbalist: "Thầy Thuốc Thảo Dược Lừng Danh"
  legend_renowned_herbalist_desc: "Người ta cho rằng nhân vật này đã gặp được những loài cây hiếm và học hỏi được rất nhiều từ chúng."
  legend_eagle_eyed: "Mắt Đại Bàng"
  legend_eagle_eyed_desc: "Theo lời đồn, nhân vật này đã chứng minh kỹ năng bắn cung của mình trước bất kỳ ai dám thách thức."
  legend_cannibal_scarred: "Kẻ Thù Của Bọn Ăn Thịt Người"
  legend_cannibal_scarred_desc: "Người ta truyền tai rằng nhân vật này đã đẩy lùi một cuộc tấn công của bọn ăn thịt người, để lại cho họ nhiều vết sẹo."
  legend_nick_of_time: "Đúng Lúc Nguy Cấp"
  legend_nick_of_time_desc: "Người ta cho rằng nhân vật này đã đến kịp thời cùng quân tiếp viện trong một trận chiến mang tính quyết định."
  legend_well_organised: "Tổ Chức Chu Đáo"
  legend_well_organised_desc: "Khả năng tổ chức quân sự có tầm nhìn xa của nhân vật này hiếm khi khiến họ bị động khi chiến sự nổ ra."
  legend_bravely_ran_away: "Dũng Cảm Bỏ Chạy"
  legend_bravely_ran_away_desc: "Nhân vật này được cho là đã quay đầu bỏ chạy khi trận chiến cận kề. Việc điều đó cuối cùng lại mang lợi thế cho họ khiến người khác khó có thể hoàn toàn chế giễu."
  ce1_immortal: "Hành Trình Tìm Kiếm Sự Bất Tử"
  ce1_immortal_desc: "Nhân vật này đang trên hành trình tìm cách trở nên bất tử."
  ce1_level_headed: "Lý Trí Tỉnh Táo"
  ce1_level_headed_desc: "Nhân vật này hiểu rằng những giấc mơ cũng chỉ là giấc mơ, không hơn."
  ce1_accepted_mortality: "An Nhiên"
  ce1_accepted_mortality_desc: "Nhân vật này gần đây đã đối diện với cái chết của chính mình và tìm thấy sự an ủi trong bản chất phù du của cuộc sống."
  ce1_will_to_live: "Khủng Hoảng Hiện Sinh"
  ce1_will_to_live_desc: "Nhân vật này vô cùng sợ hãi cái chết."
  ce1_forgiveness: "Tha Thứ Nội Tâm"
  ce1_forgiveness_desc: "Nhân vật này gần đây đã chọn tha thứ cho một người từng gây tổn hại nghiêm trọng đến họ."
  plague_tales: "Những Câu Chuyện Dịch Bệnh"
  plague_tales_desc: "Sự hoang mang của nhân vật này trước một trận dịch ở xa ít nhất cũng đã được chuyển hóa thành những nỗ lực tích cực nhằm bảo vệ lãnh địa của họ."
  plague_insights_gained: "Hiểu Biết Về Dịch Bệnh"
  plague_insights_gained_desc: "Việc giải phẫu kịp thời một thi thể đã mang lại cho nhân vật này những hiểu biết quý giá về tác động của Dịch Hạch."
  brutal_crackdown: "Đàn Áp Tàn Bạo"
  brutal_crackdown_desc: "Một cuộc trấn áp tàn nhẫn đối với người tị nạn tại biên giới đã củng cố quyền lực nhưng gây ra nhiều phẫn nộ trong lãnh địa này."
  shanty_towns: "Khu Ổ Chuột"
  shanty_towns_desc: "Việc xây dựng nhiều khu ổ chuột tại biên giới của lãnh địa này đã cho phép người tị nạn được cư trú theo cách bán lâu dài."
  border_defended: "Biên Giới Được Bảo Vệ"
  border_defended_desc: "Việc từ chối người tị nạn tại biên giới của lãnh địa này làm hài lòng một số người, nhưng sự suy giảm nhập cư cũng mang lại cái giá riêng."
  refugees_coddled: "Nuông Chiều Người Tị Nạn"
  refugees_coddled_desc: "Những người tị nạn chạy trốn vào lãnh địa này đã được cho phép vào mà không gặp cản trở."
  dangerous_rides: "Những Chuyến Cưỡi Ngựa Nguy Hiểm"
  dangerous_rides_desc: "Những chuyến cưỡi ngựa vào vùng hoang dã của nhân vật này gây nguy hiểm cho cả họ và gia đình, nhưng lại cải thiện đáng kể tâm trạng."
  cautious_rider: "Kỵ Sĩ Thận Trọng"
  cautious_rider_desc: "Nhân vật này từ chối mạo hiểm bản thân với những chuyến cưỡi ngựa vào vùng nông thôn có khả năng nhiễm dịch."
  overly_protective: "Quá Mức Phòng Bị"
  overly_protective_desc: "Sự hoang tưởng của nhân vật này khiến họ chuẩn bị cực kỳ kỹ lưỡng cho một trận dịch sắp tới."
  mass_panic: "Hoảng Loạn Hàng Loạt"
  mass_panic_desc: "Lãnh địa này đã rơi vào tình trạng hoảng loạn diện rộng trước tin tức về một đại dịch đang tiến đến."
  allayed_fears: "Xoa Dịu Nỗi Sợ"
  allayed_fears_desc: "Người dân trong lãnh địa này đã được trấn an trước nỗi lo về một trận dịch sắp tới."
  angry_crowds: "Đám Đông Phẫn Nộ"
  angry_crowds_desc: "Người dân trong lãnh địa này vừa sợ hãi vừa tức giận trước làn sóng bắt giữ các nhà giảng thuyết tận thế."
  rumours_stifled: "Tin Đồn Bị Dập Tắt"
  rumours_stifled_desc: "Những nỗ lực tự tin trong việc dập tắt tin đồn về một trận dịch xa xôi đã khiến lãnh địa này trở nên bình tĩnh hơn."
  rumours_proliferated: "Tin Đồn Lan Rộng"
  rumours_proliferated_desc: "Những nỗ lực dập tắt tin đồn trong lãnh địa này đã thất bại, và giờ đây nhiều người hoảng sợ trước viễn cảnh dịch bệnh lan tới vùng đất của họ."
  uncaring_ruler: "Lãnh Chúa Vô Tâm"
  uncaring_ruler_desc: "Cư dân của lãnh địa này cảm thấy bị người cai trị bỏ rơi."
  flagellants_acquiesce: "Những Kẻ Tự Hành Xác Được Xoa Dịu"
  flagellants_acquiesce_desc: "Nhân vật này đã xoa dịu những kẻ tự hành xác lang thang khắp các thị trấn và làng mạc."
  pacified_flagellants: "Những Kẻ Tự Hành Xác Bị Trấn An"
  pacified_flagellants_desc: "Người dân trong lãnh địa này không còn bị quấy rối bởi các kẻ rao giảng tận thế, khi những nhóm tự hành xác đã bị trấn an."
  eager_populace: "Dân Chúng Nhiệt Thành"
  eager_populace_desc: "Người dân của lãnh địa này đã nghe theo lời các nhà giảng thuyết tận thế địa phương và sẵn sàng làm mọi thứ để chuẩn bị."
  unrestrained_flagellants: "Những Kẻ Tự Hành Xác Không Kiểm Soát"
  unrestrained_flagellants_desc: "Những nỗ lực thất bại trong việc xoa dịu các nhóm tự hành xác tại lãnh địa này đã khiến số lượng của họ gia tăng."
  regular_checkups: "Khám Sức Khỏe Định Kỳ"
  regular_checkups_desc: "Việc sử dụng thường xuyên các loại thuốc đắt tiền do thầy thuốc của nhân vật này kê đơn giúp họ duy trì sức khỏe ở mức tốt nhất có thể."
  under_the_weather: "Không Khỏe"
  under_the_weather_desc: "Nhân vật này cảm thấy trong người hơi mệt mỏi."
  gravediggers_threatened: "Người Đào Mộ Bị Đe Dọa"
  gravediggers_threatened_desc: "Những người đào mộ trong lãnh địa này đã bị đe dọa và tống tiền, khiến họ nghèo hơn và ít sẵn sàng làm việc hơn."
  gravediggers_compensated: "Người Đào Mộ Được Bồi Thường"
  gravediggers_compensated_desc: "Những người đào mộ trong lãnh địa này được trả thêm tiền công, nâng cao tinh thần làm việc."
  gravediggers_replaced: "Người Đào Mộ Bị Thay Thế"
  ce1_commoners_in_graves: "Nghĩa Trang Dân Thường"
  ce1_commoners_in_graves_desc: "Nhân vật này gần đây đã mở một khu dành cho dân thường trong nghĩa trang hoàng gia, làm hài lòng dân chúng nhưng làm tổn hại danh tiếng trong mắt một số quý tộc."
  ce1_common_graves: "Mộ Dân Thường"
  ce1_common_graves_desc: "Dân thường đang được đưa đi chôn cất tại nghĩa trang của hạt này."
  ce1_bodies_in_the_street: "Thi Thể Trên Đường"
  ce1_bodies_in_the_street_desc: "Khi nghĩa trang đã quá tải và số người chết ngày càng tăng, các thi thể bị bỏ mặc phân hủy trên đường phố."
  ce1_siege_corpse: "Thi Thể Nhiễm Bệnh"
  ce1_siege_corpse_desc: "Một đạo quân thù địch gần đây đã ném những thi thể nhiễm bệnh vào một khu sở hữu trong hạt này."
  ce1_quarantined_corpse: "Thi Thể Bị Cách Ly"
  ce1_quarantined_corpse_desc: "Một đạo quân thù địch gần đây đã ném những thi thể nhiễm bệnh vào một khu sở hữu trong hạt này, nhưng các thi thể đã được cách ly thành công khỏi phần lớn dân cư."
  ce1_heavily_ill: "Bệnh Nặng"
  ce1_heavily_ill_desc: "Việc tiếp xúc gần với các thi thể nhiễm bệnh đã gây tổn hại nghiêm trọng đến sức khỏe của nhân vật này."
  ce1_non_heretical_solution: "Thi Thể Được Phân Tách"
  ce1_non_heretical_solution_desc: "Những thi thể nhiễm dịch đang được tách biệt khỏi người khỏe mạnh trong lãnh địa của nhân vật này."
  ce1_unorthodox_epidemic_treatment: "Phương Pháp Điều Trị Dị Giáo"
  ce1_unorthodox_epidemic_treatment_desc: "Thông qua những thực hành huyền bí và mang tính dị giáo cao, nhân vật này đã giảm thành công tốc độ lây lan của dịch bệnh."
  ce1_unorthodox_epidemic_treatment_bad: "Điều Trị Dị Giáo Thất Bại"
  ce1_unorthodox_epidemic_treatment_bad_desc: "Thông qua những thực hành huyền bí và mang tính dị giáo cao, nhân vật này đã không thể giảm tốc độ lây lan của dịch bệnh."
  ce1_major_quarantine: "Phong Tỏa Toàn Lãnh Thổ"
  ce1_major_quarantine_desc: "Nhân vật này đã buộc người dân phải ở trong nhà nhằm ngăn chặn sự lây lan của dịch bệnh."
  ce1_major_quarantine_county: "Phong Tỏa"
  ce1_major_quarantine_county_desc: "Không ai được phép ra vào hạt này, làm giảm sự lây lan của dịch bệnh."
  war_doctor: "Thầy Thuốc Thời Chiến"
  war_doctor_desc: "Một thầy thuốc danh tiếng cùng các môn đồ của họ đã lang thang khắp các chiến trường, cung cấp dịch vụ chăm sóc chất lượng cao cho những binh sĩ ốm yếu và bị thương."
  ce1_banishment_resistance: "Thanh Trừ Dịch Bệnh"
  ce1_banishment_resistance_desc: "Những cận thần mắc bệnh trầm trọng đã bị trục xuất khỏi triều đình của nhân vật này, làm giảm đáng kể mức độ phơi nhiễm dịch bệnh."
  minor_epidemic_treatment: "Phòng Ngừa Dịch Bệnh Nhẹ"
  minor_epidemic_treatment_desc: "Ngự y của nhân vật này gần đây đã đề xuất các biện pháp vừa phải để ngăn chặn sự lây lan của dịch bệnh đang đến gần."
  major_epidemic_treatment: "Phòng Ngừa Dịch Bệnh Nghiêm Trọng"
  major_epidemic_treatment_desc: "Ngự y của nhân vật này gần đây đã áp dụng những biện pháp cực đoan để ngăn chặn sự lây lan của dịch bệnh đang đến gần."
  critical_epidemic_treatment: "Phòng Ngừa Dịch Bệnh Huyền Bí"
  critical_epidemic_treatment_desc: "Một thầy thuốc huyền bí đã khuyên dùng những phương pháp điều trị cấp tiến và kỳ lạ cho dịch bệnh đang lan tới, và dù khiến giới chức tôn giáo phật ý, chúng dường như lại cực kỳ hiệu quả."
  minor_epidemic_treatment_failed: "Phòng Ngừa Dịch Bệnh Nhẹ Thất Bại"
  minor_epidemic_treatment_failed_desc: "Dù mang tính ôn hòa, những nỗ lực của nhân vật này nhằm làm chậm sự lan rộng của dịch bệnh lại gây ra tác động tiêu cực."
  major_epidemic_treatment_failed: "Phòng Ngừa Dịch Bệnh Nghiêm Trọng Thất Bại"
  major_epidemic_treatment_failed_desc: "Những biện pháp cấp tiến đã được áp dụng nhằm ngăn chặn dịch bệnh đang lan tới, nhưng không chỉ khiến kinh tế trì trệ mà còn hoàn toàn không hiệu quả trong việc ngăn chặn sự lây lan."
  critical_epidemic_treatment_failed: "Phòng Ngừa Dịch Bệnh Huyền Bí Thất Bại"
  critical_epidemic_treatment_failed_desc: "Các biện pháp mà nhân vật này áp dụng để điều trị những người mắc dịch không những không hiệu quả, mà bản chất dị giáo của chúng còn khiến giới chức tôn giáo vô cùng phẫn nộ."
  ce1_royal_touch: "Cái Chạm Hoàng Gia"
  ce1_royal_touch_desc: "Những người ốm yếu và hấp hối trong hạt này gần đây đã được chúa thượng của họ viếng thăm, ban phước bằng cái chạm hoàng gia thông qua những đồng tiền được làm phép."
  funeral_unrelenting_devotion: "Tận Tâm Không Lay Chuyển"
  funeral_unrelenting_devotion_desc: "Nhân vật này đã thề trước phần mộ của người thân yêu sẽ trở thành một vị quân chủ tốt hơn."
  funeral_comfort: "Được An Ủi"
  funeral_comfort_desc: "Nhân vật này gần đây đã đối diện với sự hữu hạn của chính mình và tìm thấy sự an ủi trong ý nghĩa của một kiếp sống mong manh."
  funeral_existential_dread: "Nỗi Sợ Hiện Sinh"
  funeral_existential_dread_desc: "Nhân vật này gần đây nhận ra rằng một ngày nào đó họ sẽ chết. Và họ không hề thích điều đó."
  ce1_modest_leader: "Nhà Lãnh Đạo Khiêm Tốn"
  ce1_modest_leader_desc: "Danh tiếng chiến trận của nhân vật này ngày càng lan rộng song hành với phong thái trầm lặng của chính họ."
  ce1_black_thumb: "Tay Đen"
  ce1_black_thumb_desc: "Nhân vật này hoàn toàn không có hứng thú gì với thiên nhiên."
  legend_chaste_faithful: "Trinh Khiết, Chung Thủy"
  legend_chaste_faithful_desc: "Những người theo truyền thuyết này nổi tiếng vì sự chung thủy."
  legend_lecherous_lewd: "Dâm Dật, Trụy Lạc"
  legend_lecherous_lewd_desc: "Những người theo truyền thuyết này khét tiếng bởi lối sống buông thả và quyến rũ."
  ce1_forward_thinking: "Tư Duy Tiến Bộ"
  ce1_forward_thinking_desc: "Nhân vật này không bận tâm tới những nền văn hóa cổ xưa, mà thích sống trọn vẹn trong hiện tại."
  ce1_avenging_child: "Đứa Trẻ Báo Thù"
  ce1_avenging_child_desc: "Nhân vật này quyết tâm trả thù cho cái chết của cha hoặc mẹ mình dưới nanh vuốt của một loài thú hoang."
  legend_palatial_palatable: "Xa Hoa, Mỹ Vị"
  legend_palatial_palatable_desc: "Quả thật, không gì vĩ đại hơn một bàn tiệc đầy ắp những món thịt kỳ lạ nhất!"
  ce1_consequentialist: "Hệ Quả Luận"
  ce1_consequentialist_desc: "Nhân vật này thích nhắc nhở mọi người rằng đích đến mới là điều quan trọng, không phải hành trình."
  legend_edifices_enduring: "Công Trình, Trường Tồn"
  legend_edifices_enduring_desc: "Học hỏi từ các thợ xây cổ xưa không phải là điều xấu: thực tế, việc các công trình của họ vẫn sừng sững đến ngày nay chính là minh chứng cho tay nghề của họ."
  legend_monophthalmic_mythical: "Độc Nhãn, Huyền Thoại"
  legend_monophthalmic_mythical_desc: "Những người khổng lồ độc nhãn đang bước đi giữa chúng ta! Nếu để ý kỹ, có lẽ chính Ngài cũng sẽ bắt gặp một thoáng hình bóng..."
  legendary_adventurer: "Tinh Thần Phiêu Lưu"
  legendary_adventurer_desc: "Nhân vật này sẵn sàng từ bỏ lãnh thổ của mình để mang truyền thuyết đi khắp bốn phương."
  epidemic_increased_maintance: "Chi Phí Gia Tăng"
  epidemic_increased_maintance_desc: "Nhân vật này đang phải trả lương cao hơn để bù đắp cho những binh sĩ đã thiệt mạng vì dịch bệnh."
  epidemic_pressed_levies: "Ép Buộc Dân Đinh"
  epidemic_pressed_levies_desc: "Tỉnh này đang cưỡng ép nông dân gia nhập các trung đoàn Quân Thường Trực."
  epidemic_closed_barracks: "Đóng Cửa Doanh Trại"
  epidemic_closed_barracks_desc: "Để tránh những tổn thất không cần thiết, binh sĩ sẽ bị cách ly và mọi hoạt động huấn luyện đều bị đình chỉ."
  ce1_gone_dancing: "Gia Nhập Điệu Nhảy Bất Tận"
  ce1_gone_dancing_desc: "Nhân vật này đã gia nhập cùng dân chúng trong điệu nhảy không hồi kết của họ."
  fealty_demanded: "Yêu Cầu Trung Thành"
  fealty_demanded_desc: "Nhân vật này yêu cầu thuộc hạ của mình phải tuyên thệ trung thành."
  legend_investments: "Đầu Tư Tài Chính"
  legend_investments_desc: "Hạt này đã nhận được làn sóng đầu tư từ các mối giao dịch của chúa thượng, giúp thúc đẩy nền kinh tế."
  legend_loose_lips: "Miệng Lưỡi Lỏng Lẻo"
  legend_loose_lips_desc: "Nhân vật này sẵn sàng để ân huệ của mình bị mua chuộc, cho phép người khác có thể uốn nắn ý chí của họ."
  legend_esteemed_expanding: "Được Tôn Kính, Lan Rộng"
  legend_esteemed_expanding_desc: "Trong số những người ủng hộ truyền thuyết đáng kính này có không ít những nhân vật kiệt xuất."
  legend_irreverent_immoral: "Báng Bổ, Đồi Bại"
  legend_irreverent_immoral_desc: "Việc truyền thuyết này được hậu thuẫn bởi những kẻ không thể chê trách đã khiến nó bị hoen ố nghiêm trọng."
  legend_wicked_ways: "Con Đường Tà Ác"
  legend_wicked_ways_desc: "Những lối sống bị cho là tội lỗi của nhân vật này đã gây khó khăn trong việc lan truyền những lời tốt đẹp về các chiến công của họ."
  legend_errors_exonerated: "Được Xóa Tội"
  legend_errors_exonerated_desc: "Những hành vi tội lỗi của nhân vật này đã được chôn vùi sâu nhờ sự ủng hộ từ các đồng liêu."
  legend_principled_pious: "Nguyên Tắc, Sùng Đạo"
  legend_principled_pious_desc: "Tất cả những ai quảng bá truyền thuyết này đều được hưởng lợi từ sự chính trực của nó trong mắt thường dân."
  legend_saintly_sinless: "Thánh Thiện, Vô Tội"
  legend_saintly_sinless_desc: "Những người truyền bá truyền thuyết này được tôn vinh đến mức chính truyền thuyết cũng trở nên rực rỡ hơn."
  healthy_court: "Triều Đình Khỏe Mạnh"
  healthy_court_desc: "Hành động của nhân vật này đã tạo nên một triều đình khỏe mạnh và hạnh phúc."
  strange_levity: "Tâm Trạng U Ám"
  strange_levity_desc: "Tâm trạng của nhân vật này trở nên u ám kể từ khi dịch bệnh quét qua vùng đất."
  free_boats: "Thuyền Miễn Phí"
  free_boats_desc: "Nhân vật này đã hưởng lợi từ việc nhiều con thuyền bị bỏ hoang dạt vào bờ, giúp họ có thêm lựa chọn khi di chuyển."
  corpse_piles: "Đống Xác Chết"
  corpse_piles_desc: "Giáo khu này đang phải chịu cảnh những đống xác nhiễm bệnh bị bỏ mặc phân hủy trên bờ biển."
  shattered_by_plague: "Dễ Bùng Phát Dịch"
  shattered_by_plague_desc: "Hạt đông đúc và sầm uất này chỉ cần một cơn ho nhỏ cũng có thể châm ngòi cho một đại dịch."
  ravaged_by_plague: "Nhạy Cảm Với Dịch Bệnh"
  ravaged_by_plague_desc: "Những con phố nhộn nhịp trong hạt này khiến nó trở thành mảnh đất màu mỡ cho dịch bệnh lây lan."
  blighted_by_plague: "Dễ Tổn Thương Vì Dịch"
  blighted_by_plague_desc: "Mật độ dân số cao hơn mức trung bình khiến hạt này dễ bị dịch bệnh lan rộng."
  struck_by_plague: "Có Nguy Cơ Dịch Bệnh"
  struck_by_plague_desc: "Hạt này có các khu định cư đủ lớn để dịch bệnh lây lan dễ dàng hơn."
  legend_secure_safe: "An Toàn, Vững Chắc"
  legend_secure_safe_desc: "Truyền thuyết này nổi tiếng vì gắn kết con người, biến kẻ thù thành Bạn Bè ngay cả ở những vùng đất xa lạ."
  plague_new_capital: "Thủ Đô Mới"
  plague_new_capital_desc: "Một trận dịch gần đây đã tàn phá vùng đất và khiến hạt này trở thành ứng viên lý tưởng cho vị trí thủ đô mới của lãnh địa."
  plague_alms_donations: "Bố Thí"
  plague_alms_donations_desc: "Người nghèo và túng thiếu trong giáo khu này đã được hưởng lợi từ các khoản bố thí, nâng cao tinh thần và có nơi trú ngụ."
  plague_determined_recover: "Quyết Tâm Phục Hồi"
  plague_determined_recover_desc: "Dù thủ đô của nhân vật này đã bị tàn phá bởi dịch bệnh, họ vẫn quyết tâm khôi phục nó."
  plague_the_long_road: "Con Đường Dài"
  plague_the_long_road_desc: "Thủ đô của nhân vật này đã bị tàn phá bởi dịch bệnh, và họ cam kết phục hồi nó dù con đường đầy gian nan."
  plague_crippling_sorrow: "Nỗi Đau Tê Liệt"
  plague_crippling_sorrow_desc: "Thủ đô của nhân vật này đã bị tàn phá bởi dịch bệnh, và cái chết cùng sự hủy diệt mà nó gây ra đã đẩy họ vào vực sâu tuyệt vọng."
  legend_tolerant_trusting: "Khoan Dung, Tin Tưởng"
  legend_tolerant_trusting_desc: "Truyền thuyết này được phép phát triển tự do, chủ nhân của nó khuyến khích sự thêu dệt của các nghệ sĩ hát rong."
