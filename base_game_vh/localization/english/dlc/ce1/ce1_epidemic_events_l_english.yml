  epidemic_events.2001.t: "Đại Dịch Chiến Tranh"
  epidemic_events.2001.desc: "[pleading_vassal.GetName|U] falls to [pleading_vassal.GetHerHis] knees, trembling.\n\n"My liege, I am beset by two plagues. [epidemic_scope.GetName|U] devours my people. And now [attacking_vassal.GetName] comes for my lands. I cannot fight them both."\n\n[pleading_vassal.GetSheHe|U] lays down a small coffer of gold — all [pleading_vassal.GetSheHe] could bring.\n\n"I beg you. Help me end this war before neither realm survives.""
  epidemic_events.2001.a: "Ta sẵn lòng trả tiền để chấm dứt sự ngu xuẩn này."
  epidemic_events.2001.b: "Ngươi dám mang [epidemic_scope.GetNameNoTooltip] đến ngay trước cửa #EMP của ta#! sao!"
  epidemic_events.2001.b.desc: "Lính canh! #EMP Cẩn thận#! bắt giữ [pleading_vassal.GetFirstNameNoTooltip], rồi #EMP còn cẩn thận hơn nữa#! rửa sạch mọi thứ mà [pleading_vassal.GetSheHe] đã chạm vào!"
  epidemic_events.2001.c: "[attacking_vassal.GetTitledFirstNameNoTooltip] có thể được thuyết phục."
  epidemic_events.2001.c.success: "[attacking_vassal.GetFirstNameNoTooltip] đã bị thuyết phục chấm dứt [vassal_war.GetName]"
  epidemic_events.2001.c.failure: "[vassal_war.GetName] vẫn tiếp diễn"
  epidemic_events.2001.epidemic_spread.t: "[pleading_vassal.GetFirstNameNoTooltip] đã làm lây lan [epidemic_scope.GetName]!"
  epidemic_events.2001.danger: "#color_red Nếu cuộc chiến không được giải quyết nhanh chóng, sẽ có cái giá phải trả...#!"

  epidemic_events.2002.t: "Đại Dịch Chiến Tranh: Hệ Quả"
  epidemic_events.2002.desc: "Khi [vassal_war.GetName|U] kéo dài, con người chết vì đất đai, và đất đai trả lại họ thành từng đống xác.\n\nGiờ đây [epidemic_scope.GetName] lan nhanh hơn — được nuôi dưỡng bởi xác thối, làng mạc hoang tàn, và sự điên loạn của các cuộc vây hãm. Không phe nào chiến thắng. Tất cả đều đang chết."
  epidemic_events.2002.a: "Thật khủng khiếp."

  epidemic_events.2003.t: "Kẻ Thù Vô Hình"
  epidemic_events.2003.desc: "\"Binh lính của ta ngã xuống mà chưa kịp giao chiến. [epidemic_scope.GetName|U] đã cướp đi nhiều sinh mạng hơn bất kỳ lưỡi gươm nào.\"\n\n[marshal.GetName] nói thẳng thừng, nhưng ông ta đúng. Từ [first_epidemic_province.GetName] đến [second_epidemic_province.GetName], doanh trại trống rỗng. Không còn chiến binh — chỉ còn nông dân và dịch bệnh."
  epidemic_events.2003.a: "Không thể làm gì được — cứ để họ chết."
  epidemic_events.2003.a.flavor: "Binh lính giỏi luôn tìm được vàng, nhưng vàng hiếm khi tìm được binh lính giỏi."
  epidemic_events.2003.b: "Lôi nông dân khỏi ruộng nếu cần."
  epidemic_events.2003.b.flavor: "Đám đông chưa tắm rửa đôi khi vẫn có thể thay thế chiến binh lành nghề — nếu không nhìn quá kỹ."
  epidemic_events.2003.c: "Phong tỏa doanh trại. Thà nhàn rỗi còn hơn chết."
  epidemic_events.2003.c.flavor: "Không còn luyện tập hằng ngày, quân đội sẽ kém hiệu quả hơn, nhưng ít nhất họ còn sống."

  epidemic_events.2005.t: "Bình Thuốc"
  epidemic_events.2005.desc: "Mỗi ngày ta đều đi ngang qua phòng nghiên cứu của [physician.GetNamePossessive], nỗi sợ về [epidemic_scope.GetName] chưa bao giờ rời xa. Những dụng cụ kỳ lạ của [physician.GetHerHis|U] thường chẳng mang lại sự an tâm — nhưng hôm nay, một chiếc bình được trang trí bắt mắt đã thu hút ánh nhìn của ta.\n\n\"Nó bảo vệ ta,\" [physician.GetSheHe] nói, nâng niu chiếc bình. \"Một kiệt tác thủ công, và là lá chắn chống lại bệnh tật.\""
  epidemic_events.2005.a: "Chẳng phải ta mới là người cần được bảo vệ sao?"
  epidemic_events.2005.a.success: "[physician.GetFirstName] đồng ý giao chiếc bình."
  epidemic_events.2005.a.failure: "[physician.GetFirstName] vẫn không bị thuyết phục."
  epidemic_events.2005.b: "Nó cứu được mạng người ư? Vậy ta sẽ lấy nó."
  epidemic_events.2005.b.success: "Ngài giật lấy [medicine_jar.GetName] từ tay [physician.GetFirstName]"
  epidemic_events.2005.b.failure: "Chiếc bình vỡ tan!"
  epidemic_events.2005.c: "Nếu nó khiến ngươi an tâm, cứ giữ lấy."

  epidemic_events.2006.t: "Cơn Cuồng Vũ"
  epidemic_events.2006.desc: "A peasant writhes in my courtyard, feet pounding the earth in a ceaseless, maddening rhythm.\n\n"Forgive [dance_victim.GetHerHim], my liege," says an onlooker. "[dance_victim.GetFirstName] has danced for days without rest — others have even joined [dance_victim.GetHerHim]! [dance_victim.GetSheHe|U] won't stop."\n\nThe woman moans, [dance_victim.GetHerHim] face contorting with pain and joy. Madness, or something worse, grips [dance_victim.GetHerHim]."
  epidemic_events.2006.a: "Nhảy không ngừng nghỉ ư? #EMP Tuyệt vời!#!"
  epidemic_events.2006.b: "Mọi điệu nhảy rồi cũng sẽ kết thúc. #EMP Phải không?#!"
  epidemic_events.2006.c: "Lấy dây thừng trói chặt [dance_victim.GetHerHim] lại!"
  epidemic_events.2006.d: "Nhân danh [ROOT.Char.GetFaith.HighGodName], ta sẽ trục xuất ngươi, hỡi ác quỷ!"
 
  epidemic_events.3000.t: "$travel_danger_prefix$ Máu Trên Cánh Cửa"
  epidemic_events.3000.desc: "Màu đỏ là sắc màu duy nhất hiện diện tại [epidemic_location.GetName]. Ho khan là âm thanh duy nhất. Chúng ta thúc ngựa tiếp tục đi, nhưng ta thấy [companion.GetTitledFirstName] tái nhợt, đôi môi [companion.GetHerHis] mím chặt đến mức không còn giọt máu.\n\n\"Cứu với...\" một trong những thân xác mà ta tưởng là xác chết chợt cử động chậm chạp, đau đớn, cơ thể [sick_peasant.GetHerHis] [sick_peasant.Custom('disease_desc_short')]."
  epidemic_events.3000.a: "\"Ta không thể làm ngơ được.\""
  epidemic_events.3000.b: "\"[companion.GetFirstNameNoTooltip], ngươi có thể giúp họ.\""
  epidemic_events.3000.c: "\"Chúng ta không có thời gian cho việc này.\""
  epidemic_events.3000.b.sick: "[companion.GetShortUIName] ngã bệnh"
 
  epidemic_events.3010.t: "$travel_danger_prefix$ Xác Thối"
  epidemic_events.3010.desc: "Nguồn nước của chúng ta sắp cạn khi tiến vào [epidemic_location.GetName]. Ngôi làng trông có vẻ bỏ hoang này lại có một cái giếng đẹp ngay giữa làng, và chúng ta thúc ngựa tiến về phía đó.\n\nKhông lâu sau, lý do vì sao nơi này bị bỏ hoang trở nên rõ ràng.\n\nNhững thi thể nằm la liệt trên mặt đất, [sick_peasant.Custom('disease_desc_short')], và chim ăn xác thối bay vòng trên những cái đầu tái nhợt. Một cảnh tượng rùng rợn."
  epidemic_events.3010.a: "Ta từng đọc gì đó về nước bị ô nhiễm..."
  epidemic_events.3010.b: "Nước! #EMP Cuối cùng cũng có!#!"
  epidemic_events.3010.b.sick: "Ngài ngã bệnh"
  epidemic_events.3010.c: "Chúng ta phải tiếp tục lên đường."
  humour_knowledge_modifier: "Giả Thuyết Về Thể Dịch"
  humour_knowledge_modifier_desc: "Nhân vật này nhận ra rằng dân làng bị bệnh sau khi uống nước từ một cái giếng bị nhiễm dịch."
  no_water_modifier: "Nguồn Nước Khan Hiếm"
  no_water_modifier_desc: "Nhân vật này đã không dừng lại để uống nước từ giếng."

  ce1_flung_corpse: "ném xác chết"
  ce1_flung_corpse_desc: "Ta đã ném một xác chết qua tường thành vào lãnh địa của [flingee.GetNamePossessive]"
  ce1_flung_corpse_desc_second_perspective: "Ngài đã ném một xác chết qua tường thành vào lãnh địa của [flingee.GetNamePossessive]"
  ce1_flung_corpse_desc_third_perspective: "[owner.GetName] đã ném một xác chết qua tường thành vào lãnh địa của [flingee.GetNamePossessive]"
  ce1_corpse_flung_at_me: "bị ném xác chết vào"
  ce1_corpse_flung_at_me_desc: "[flingee.GetName] đã chất một xác chết lên máy bắn đá và ném vào lãnh địa của ta"
  ce1_corpse_flung_at_me_desc_second_perspective: "[flingee.GetName] đã chất một xác chết lên máy bắn đá và ném vào lãnh địa của Ngài"
  ce1_corpse_flung_at_me_desc_third_perspective: "[flingee.GetName] đã chất một xác chết lên máy bắn đá và ném vào lãnh địa của [owner.GetNamePossessive]"
  ce1_meat_shower: "mưa thịt"
  ce1_meat_shower_desc: "[flinger.GetName] đã ném một xác chết vào lãnh địa của ta, khiến nó vỡ nát thành một cơn mưa máu và thịt"
  ce1_meat_shower_desc_second_perspective: "[flinger.GetName] đã ném một xác chết vào lãnh địa của Ngài, khiến nó vỡ nát thành một cơn mưa máu và thịt"
  ce1_meat_shower_desc_third_perspective: "[flinger.GetName] đã ném một xác chết vào lãnh địa của [owner.GetNamePossessive], khiến nó vỡ nát thành một cơn mưa máu và thịt"

  epidemic_events.5000.t: "Làm Gì Đi!"
  epidemic_events.5000.desc: "Một báo cáo u ám khác từ [infected_county.GetName].\n\n[church_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trao nó cho Ta. \"Dân chúng đòi hành động!\" [church_person.GetSheHe|U] khoa tay múa chân dữ dội. \"Thanh trừng lũ súc vật — chúng phát tán [epidemic.GetName]! [ROOT.Char.GetFaith.HighGodName] muốn thế!\"\n\nTa liếc nhìn tờ giấy da. Ánh mắt [church_person.GetHerHis|U] sáng rực quyết tâm. Còn mắt Ta... đầy hoài nghi."
  epidemic_events.5000.a: "Nghe này, bọn chuột trông bẩn thỉu đủ rồi đấy..."
  epidemic_events.5000.b: "Mèo thì đi #EMP khắp nơi.#! Chắc chắn chúng là thủ phạm."
  epidemic_events.5000.c: "Chó lúc nào cũng dính đầy dơ bẩn. Tống khứ chúng đi!"
  epidemic_events.5000.d: "Chúng ta phải tiêu hủy đàn cừu."
  epidemic_events.5000.e: "Không cần thiết."

  epidemic_events.5001.t: "Đóng Chặt Cửa!"
  epidemic_events.5001.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lao vào, mắt hoảng loạn, tay ôm đầy [ROOT.Char.Custom('GetWritingMaterial')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')] của Ta — [epidemic_county.GetNameNoTier] đang ngập trong xác chết! Đường phố nghẹt thở vì tử khí!\" [courtier.GetSheHe|U] đập mạnh đống thư xuống. Ta lục qua mớ hỗn độn tuyệt vọng.\n\nLần cuối Ta nghe thì [epidemic_scope.GetName] đã được kiểm soát..."
  epidemic_events.5001.a: "\"Đóng lại! Đóng #EMP tất cả!#!\""
  epidemic_events.5001.b: "Ta tin tưởng những người phụ trách [epidemic_county.GetName]."
  epidemic_events.5001.c: "\"Ngươi nghĩ ta chưa đủ việc phải lo sao, [courtier.Custom2('InsultNoun', ROOT.Char)]?!\""
  epidemic_events.5001.d: "Tốt nhất nên gửi viện trợ khi vấn đề còn manh nha."
  epidemic_events.5001.e: "Họ sẽ phải tự xoay xở."

  epidemic_events.5002.t: "Sự Im Lặng Ven Bờ"
  epidemic_events.5002.desc: "Khi chúng Ta cùng bước đi, [steward.GetFirstName] kể cho Ta nghe một bài diễn văn ảm đạm về dịch bệnh lan khắp [coastal_province.GetName]. Ở phía xa, xác người chất đống dọc bờ biển, bên cạnh là một con thuyền bị bỏ lại. Khi Ta quay sang [steward.GetFirstNameNoTooltip], một vẻ tò mò dần hiện lên trên gương mặt [steward.GetHerHis].\n\n\"Nếu như, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [steward.GetSheHe] bắt đầu, \"nếu ta đơn giản khiến mấy cái xác đó không còn là vấn đề thì sao?\"\n\nThoáng bối rối, Ta chậm rãi hiểu ra kế hoạch. Dù sao thì con thuyền cũng bị bỏ hoang, và đám xác kia sớm muộn cũng phải được xử lý..."
  epidemic_events.5002.a: "Dòng nước này chảy về hướng nào nhỉ?"
  epidemic_events.5002.a.tt: "Có lẽ ta có thể biến con thuyền này thành vấn đề của #EMP kẻ khác#!..."
  epidemic_events.5002.b: "\"Chất hết lên và thả trôi đi.\""
  epidemic_events.5002.b.success: "Con thuyền không bao giờ được thấy lại"
  epidemic_events.5002.b.failure: "Con thuyền trôi dạt vào bờ vài ngày sau"
  epidemic_events.5002.b.criticalfailure: "Con thuyền chìm, và các thi thể trôi ngược lại vào bờ"
  epidemic_events.5002.c: "Họ xứng đáng được an táng tử tế."
  epidemic_events.5002.d: "Ít nhất thì con thuyền trông vẫn còn đi biển được..."

  epidemic_events.5003.t: "Bàn Tay Chữa Lành"
  epidemic_events.5003.desc: "Bùn đất và khốn khổ bám đầy các con phố [location.GetName] — cũng như người nông dân lao [peasant.GetHerselfHimself] xuống trước ngựa của Ta, ôm chặt một đứa trẻ yếu ớt.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')] của Ta, xin người,\" [peasant.GetSheHe] van nài. \"[child.GetSheHe|U] bệnh nặng lắm. Nhưng cái chạm của hoàng gia có thể chữa lành cho [child.GetHerHim]...\"\n\nMưa trút xuống rào rào. Đứa trẻ lảo đảo."
  epidemic_events.5003.a: "\"Lính đâu, kéo #EMP thứ đó#! ra xa ta!\""
  epidemic_events.5003.b: "Ta nghi ngờ chuyện này có tác dụng, nhưng..."
  epidemic_events.5003.b.tt: "Niềm tin rằng cái chạm của hoàng gia có thể chữa bệnh mang cả lợi lẫn hại..."
  epidemic_events.5003.b.criticalsuccess: "Đứa trẻ được chữa lành một cách kỳ diệu"
  epidemic_events.5003.b.success: "Bệnh vẫn còn, nhưng họ có vẻ vui hơn"
  epidemic_events.5003.b.failure: "Đứa trẻ trở nặng hơn"
  epidemic_events.5003.c: "Cứ tiếp tục đi."

  epidemic_events.5004.t: "Làn Sóng Nhân Dân"
  epidemic_events.5004.desc: "Một tiếng gầm, một cú va chạm — cửa phòng ngai vàng bật tung, và một biển nông dân tràn vào. Già, trẻ, bệnh tật, hoảng sợ — mọi ánh mắt đều đổ dồn về Ta.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" một người trong số họ van nài, \"hãy bảo vệ chúng Ta khỏi [epidemic_scope.GetName]. Người phải làm gì đó.\"\n\nVệ binh đứng sẵn, chờ lệnh của Ta."
  epidemic_events.5004.a: "\"Vào hết đi, mọi người!\""
  epidemic_events.5004.a.new_courtiers: "Tất cả cận thần mới nhận #positive_value 40#! thiện cảm với #color_white Ngài#!"
  epidemic_events.5004.a.old_courtiers: "Tất cả cận thần cũ mất #negative_value 10#! thiện cảm với #color_white Ngài#!"
  epidemic_events.5004.b: "Hộ tống họ ra ngoài."
  epidemic_events.5004.b.success: "Họ hiểu sự cần thiết của việc cách ly"
  epidemic_events.5004.b.failure: "Họ buộc phải bị cưỡng chế rời đi"
  epidemic_events.5004.c: "Vệ binh! Lôi họ ra ngoài."

  epidemic_events.5005.t: "Mạng Người Hay Vàng Bạc?"
  epidemic_events.5005.desc: "Vàng chảy về từ bờ biển — và [epidemic_scope.GetName] cũng vậy.\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] có một kế hoạch: thương nhân phải cách ly trước khi dỡ hàng. \"Nó sẽ giữ an toàn cho chúng ta,\" [steward.GetSheHe] khẳng định.\n\nÁp dụng cách ly đồng nghĩa với thuế giảm. An toàn có đáng giá như vậy không?"
  epidemic_events.5005.a: "Bốn mươi ngày."
  epidemic_events.5005.a.coastal_quarantine: "Mọi tỉnh ven biển trong [realm|E]"
  epidemic_events.5005.a.landholders: "Tất cả $barons_and_minor_landholders_vassals$"
  epidemic_events.5005.b: "Hai mươi ngày cách ly. Không hơn, không kém."
  epidemic_events.5005.b.success: "Họ hiểu sự cần thiết của việc cách ly"
  epidemic_events.5005.b.failure: "Họ buộc phải bị cưỡng chế rời đi"
  epidemic_events.5005.c: "Thương mại là trên hết. Ta không thể chậm trễ."

  epidemic_events.5006.t: "Không Phải Chuyện Đùa"
  epidemic_events.5006.desc: "Tiếng cười vang khắp hành lang — thật lạ, khi [epidemic_scope.GetName] vẫn hoành hành ngoài kia.\n\nTa túm lấy [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Có gì mà buồn cười?\"\n\n[councillor.GetSheHe|U] cười toe. \"Thầy thuốc nói bệnh tật sinh ra từ tâm trạng xấu... nên chúng Ta cười cho nó biến mất!\""
  epidemic_events.5006.a: "Ngươi nói đúng lắm! Ha ha ha! Hee hee!"
  epidemic_events.5006.b: "Cầu khẩn [ROOT.Char.GetFaith.HighGodName] là con đường cứu rỗi duy nhất."
  epidemic_events.5006.c: "Ừm, có khi cũng có lý..."
  epidemic_events.5006.c.success: "Ngài thực sự cảm thấy khá hơn một chút"
  epidemic_events.5006.c.failure: "Ngài trông không mấy thuyết phục"
  epidemic_events.5006.d: "Vớ vẩn."

  epidemic_events.5007.t: "Cáo Buộc Phù Thủy"
  epidemic_events.5007.desc: "Một cơn náo động — [accuser.Custom2('MyCharacterIntroduction', ROOT.Char)] dẫn đầu đám đông phẫn nộ, dồn [herbalist.Custom2('MyCharacterIntroduction', ROOT.Char)] vào góc.\n\n\"Phù thủy hái thảo dược!\" [accuser.GetSheHe] gào lên. \"Ngay khi [herbalist.GetFirstNameNoTooltip] bước ra ngoài, [epidemic_scope.GetName] liền theo sau!\"\n\n[herbalist.GetFirstNameNoTooltip] đứng vững, khua tay khinh khỉnh khi tiếng la ó dâng cao."
  epidemic_events.5007.a: "\"Đủ rồi! Thảo dược học là một nghệ thuật cao quý.\""
  epidemic_events.5007.b: "Bỏ tù mụ phù thủy!"
  epidemic_events.5007.c: "Vớ vẩn."
  epidemic_events.5007.c.success: "Ngài thuyết phục được đám đông"
  epidemic_events.5007.c.failure: "Đám đông phớt lờ lập luận của Ngài"
  epidemic_events.5007.d: "\"Đủ rồi! Chấm dứt những cáo buộc vô căn cứ này, [accuser.GetFirstNameNoTooltip].\""
  epidemic_events.5007.e: "Có lẽ nếu [herbalist.GetFirstNameNoTooltip] hứa từ bỏ nghề này...?"

  epidemic_events.5008.t: "An Toàn Và Yên Ổn"
  epidemic_events.5008.desc: "Không phải là #EMP điều tốt#! gì, cái [epidemic_scope.GetName] này — nhưng Ta phải thừa nhận, Ta đang tận hưởng sự cô lập. Không khách khứa, hầu như không người hầu. Yên tĩnh. Bình yên.\n\nCó lẽ sự cách ly này giúp Ta tránh được bệnh tật... hoặc có lẽ Ta chỉ thích trốn tránh.\n\nDù sao thì, Ta có nên lộ diện trở lại không? Chỉ một chút thôi?"
  epidemic_events.5008.a: "Không ai được phép gặp ta nếu chưa có sự cho phép!"
  epidemic_events.5008.b: "Ta phải để thần dân thấy mặt."
  epidemic_events.5008.c: "[epidemic_scope.GetNameNoTooltip] đúng là cái cớ tuyệt vời!"

  epidemic_events.5009.t: "Mùi Hương Phòng Bệnh"
  epidemic_events.5009.desc: "Chợ bốc mùi — nhưng một quầy hàng lại tỏa hương dễ chịu lạ thường.\n\n\"Túi hương tươi mới! Thảo dược hảo hạng!\" người bán hàng rao lên, nhét một túi vào tay Ta. \"Xua đuổi [epidemic_scope.GetName]!\"\n\nMùi hương quả thật dễ chịu… dù giá thì không rẻ."
  epidemic_events.5009.a: "\"Ngươi có bao nhiêu cái để bán?\""
  epidemic_events.5009.b: "Ta sẽ mua túi hương [newly_created_artifact.GetNameNoTooltip] tốt nhất của ngươi."
  epidemic_events.5009.b.success: "[merchant.GetSheHe|U] miễn cưỡng đồng ý"
  epidemic_events.5009.b.failure: "[merchant.GetSheHe|U] từ chối nhượng bộ"
  epidemic_events.5009.b.criticalfailure: "[merchant.GetSheHe|U] tức giận từ chối bán"
  epidemic_events.5009.c: "Một cái thì cũng chẳng hại gì."
  epidemic_events.5009.d: "Mấy thứ này chẳng cứu nổi ai."

  epidemic_events.5010.t: "Những Con Phố Nghẹt Thở của [capital.GetBaseNameNoTierPossessiveNoTooltip]"
  epidemic_events.5010.opening: "Cuối cùng thì nó cũng đã tới. Tai ương đáng sợ rình rập trên các con phố của [capital.GetBaseNameNoTier], lưỡi hái tàn bạo của nó quật ngã tất cả trên đường đi.\n\n"
  epidemic_events.5010.santiago: "Giờ đây chỉ còn rất ít bước chân còn đặt trên Con Đường Thánh James. Chỉ những kẻ cứng cỏi và sùng đạo nhất mới tiếp tục bước về phía thành phố đang chìm trong dịch bệnh, tìm kiếm sự cứu rỗi từ đấng toàn năng ngay cả khi chính họ cũng đang khuất phục trước căn bệnh ghê tởm.\n\nNhững quảng trường xinh đẹp, nơi từng tràn ngập niềm vui và những cuộc trao đổi thiện chí, nay trở thành nơi trú ngụ của những kẻ bị nguyền rủa. Người chết và kẻ hấp hối trút hơi thở cuối cùng tại đây, cô độc đến đáng thương."
  epidemic_events.5010.london: "Những con sóng hiền hòa của sông Thames giờ đây mang theo nhiều hơn cả phù sa và thương nhân. Những xác chết trương phình, bạc màu dưới nắng bị cuốn xuống hạ lưu, gương mặt đau đớn đông cứng trong nụ cười co giật câm lặng, những khối u sưng tấy nổi bật trên làn da tái nhợt.\n\nNhững bức tường La Mã cổ kính, từng bao lần bảo vệ thành phố khỏi sự xâm nhập của người sống, nay được gia cố bằng xác chết. Những con phố ngoằn ngoèo, chật hẹp biến thành mê cung của những thi thể xếp chồng, lũ chuột dùng chúng vừa làm nơi trú ẩn vừa làm nguồn sống."
  epidemic_events.5010.rome: "Rome! Rome huy hoàng. Thủ đô của Thế giới.\n\nVô số linh hồn đã từng bước đi trên những con đường cổ kính này, nhưng hàng ngũ người chết ngày càng phình to từng ngày. Tai họa quét sạch các con phố, hủy hoại mọi quảng trường xinh đẹp và khải hoàn môn lộng lẫy. Những phiến đá cẩm thạch cổ xưa đứng lặng, bất lực trước nỗi tra tấn của người sống. Người hấp hối trút hơi thở cuối cùng, trên môi là những lời mà trong thời khắc tốt đẹp hơn họ chưa từng dám nghĩ tới:\n\n\"Thành Phố Vĩnh Hằng… rốt cuộc vĩnh hằng đến mức nào?\""
  epidemic_events.5010.paris: "Những dòng nước uốn lượn của sông Seine vẫn vỗ nhẹ vào bờ Île de la Cité, che giấu thảm họa đang diễn ra trên đất liền.\n\nNgười bệnh lê bước vô vọng giữa những căn nhà tạm bợ. Nơi các thợ bánh từng rao bán hàng hóa nay chất đầy xác chết, khi người sống không còn theo kịp làn sóng bệnh tật đang siết chặt thành phố.\n\nKhung cảnh gần như yên bình, nếu không có những tiếng rên rỉ và ho khù khụ của người hấp hối."
  epidemic_events.5010.constantinople: "Thành Phố Khát Vọng của Thế Giới. Nữ Hoàng của các Thành Phố. Cánh Cửa Dẫn Tới Hạnh Phúc. Ngã Tư của Thế Giới.\n\nNhững danh xưng tráng lệ ấy được ban cho đại đô thị hùng vĩ này từ thuở xa xưa. Giờ đây, chúng trở nên cay đắng đến tàn nhẫn, khi những kẻ bệnh tật lê lết con đường khốn khổ của mình qua xác chết của những người đã gục ngã.\n\nLiệu họ có tìm được chút an ủi nào từ vinh quang quá khứ khi cận kề cái chết?"
  epidemic_events.5010.prague: "Những khu chợ và quảng trường buôn bán của thành phố, vốn thường ngày nhộn nhịp, nay rơi vào im lặng chết chóc. Những cây cầu kiêu hãnh bắc qua sông Vltava bị nghẽn bởi người bệnh, xác chết gây tắc nghẽn bên dưới các nhịp cầu.\n\nVyšehrad buồn bã nhìn xuống thảm cảnh, những bức tường nghiêm nghị do Công tước Krok dựng nên từ bao thế hệ trước không thể ngăn chặn một Xóa Bạn người thầm lặng và chết chóc như dịch bệnh.\n\nThành phố Trăm Ngọn Tháp chết dần chết mòn, những ngọn tháp kiêu hãnh ấy bất lực trước bầu trời đang sụp đổ."
  epidemic_events.5010.toledo: "Thành phố nào nổi tiếng về thép hơn Toledo? Dòng nước sông Tagus từng được dùng để Ta luyện lưỡi kiếm của hàng triệu thanh gươm, nhưng có những mối đe dọa mà không một tay nghề tinh xảo nào có thể chống lại.\n\nThật trớ trêu khi một nơi đa dạng đến vậy lại đột ngột đoàn kết trước nghịch cảnh. Dịch bệnh giết chóc không phân biệt, quật ngã mọi tầng lớp trong xã hội.\n\nNhững lò rèn cổ xưa im lìm. Những người từng làm việc nơi đó giờ chắp tay cầu nguyện thay vì lao động, hy vọng thần linh sẽ cứu họ nơi mà vũ khí không thể."
  epidemic_events.5010.cairo: "Cổ xưa vượt ngoài đếm đo, Cairo đã chứng kiến các thành phố chị em như Memphis và Heliopolis trỗi dậy rồi lụi tàn, nhưng bản thân nó vẫn đứng vững. Nó đã chịu đựng rất nhiều, và giờ đây sẽ còn phải chịu đựng hơn nữa.\n\nSông Nile, Dòng Sông của Sự Sống, hôm nay lại mang theo cái chết. Những xác chết ô uế bị dòng nước cuốn đi, mục rữa trong những vùng châu thổ bùn lầy nơi nó gặp biển cả, nhưng rồi lại có thêm, và thêm nữa, thay thế. Những thước đo mực nước sông nghẹt thở vì xác người, bị ném vội vào đó để tiết kiệm thời gian, tiết kiệm không gian, cứu lấy người sống.\n\nThành phố cổ dần héo úa."
  epidemic_events.5010.kanyakubja: "Không ai biết chính xác bao nhiêu thế hệ đã sống và chết nơi đây, nhưng tất cả đều đồng ý rằng bản thân thành phố này cổ xưa đến mức khó tin. Nó sẽ cần đến toàn bộ kinh nghiệm và trí tuệ của mình để sống sót qua mối đe dọa này.\n\nNhững xưởng chưng cất nước hoa trứ danh vẫn tiếp tục sản xuất attar, những chai da lạc đà được đổ đầy và đeo quanh cổ những người khỏe mạnh để xua đuổi mùi hôi tà ác.\n\nNhưng ở những nơi khác, âm thanh duy nhất vọng lại từ những bức tường là tiếng rên rỉ của người chết và kẻ hấp hối, thân xác họ bị chất cao đến mức không tưởng trong những con hẻm chật hẹp."
  epidemic_events.5010.varanasi: "Nơi này thường được gọi là Thành Phố Ánh Sáng, nhưng Varanasi cũng là Thành Phố của Người Chết suốt chừng ấy thời gian. Vì vậy, thật phù hợp khi nó trở thành nơi dung chứa tai ương chết chóc bậc nhất này.\n\nTrong những ngày tươi đẹp hơn, sông Hằng tràn đầy sự sống; giờ đây, nó chỉ mang theo xác chết. Những thi thể trương phình mắc kẹt bên bờ sông, bị vài người sống sót còn dám ra ngoài đá văng đi.\n\nÂm thanh của tiếng khóc than và ho sặc sụa dội lại từ những phiến đá cổ xưa của thành phố tiền sử này."
  epidemic_events.5010.fallback: "Những con phố uốn lượn và những khu nhà chen chúc, vốn thường ngày đông đúc người qua lại, nay nằm im lìm. Chỉ còn tiếng than khóc thảm thương của kẻ mất người thân và những cơn ho ướt nặng nề của những kẻ sắp gia nhập hàng ngũ người chết đang tăng dần phá vỡ sự tĩnh lặng."
  epidemic_events.5010.a: "Bố thí ít nhiều có lẽ sẽ giúp người hấp hối ra đi nhẹ nhõm hơn."
  epidemic_events.5010.b: "#DIE1 Thành phố này...#! #DIE2 thành phố yêu dấu của ta...#!"
  epidemic_events.5010.b.win: "Ngài quyết tâm tái thiết"
  epidemic_events.5010.b.neutral: "Ngài lo lắng về những thách thức phía trước"
  epidemic_events.5010.b.lose: "Ngài chìm trong cảm giác kinh hoàng"

  epidemic_events.5900.t: "Cái Chết Đen"
  epidemic_events.5900.desc: "Tai ương rình rập khắp vùng đất.\n\nNhững khối u ghê rợn, sôi sục mọc lên trên cơ thể nạn nhân; những lời kêu cứu thảm thương của họ dần bị bóp nghẹt khi họ khò khè và chết đuối trong chính những cuống họng đầy mủ của mình.\n\nTừ đứa trẻ ăn xin thấp hèn nhất cho tới vị hoàng đế được tôn vinh nhất, tất cả đều khiếp sợ lưỡi hái vô phân biệt của dịch bệnh tàn nhẫn. Những kẻ sống sót chỉ còn biết bất lực nhìn mọi người xung quanh lần lượt ngã xuống.\n\nKẻ mộ đạo tìm đến thần linh để cầu cứu, kẻ quyền thế bấu víu vào của cải, nhưng không ai thực sự an toàn. Những xúc tu kinh hoàng lan rộng khắp vùng đất, siết chặt nó cho đến khi không còn hơi thở.\n\nCái Chết Đen đã giáng xuống. [ROOT.Char.GetFaith.HighGodName], xin hãy cứu rỗi tất cả chúng con."
  epidemic_events.5900.desc_asia: "Tai ương bước đi giữa chúng ta.\n\nNhững kẻ mắc bệnh trương phình vì lở loét, tiếng kêu của họ tắt dần thành những âm thanh sủi bọt khi hơi thở cạn kiệt. Trong cái chết, ngay cả những kẻ ồn ào nhất cũng trở nên im lặng.\n\nKhông ai được tha. Từ người lao động chân trần cho đến vị vương tử ẩn mình trong tu viện, bánh xe khổ đau quay nghiền tất cả. Người sống chỉ còn biết quét tro khỏi ngưỡng cửa và đếm những tấm chiếu trống.\n\nCó kẻ tụng kinh, kẻ khác bám víu vào nghi lễ và địa vị — nhưng không sắc lệnh nào ngăn được mục rữa, không công đức nào bù đắp được cái giá phải trả. Như sương mù trong thung lũng, dịch bệnh lan ra vô hình nhưng hiện hữu trong mọi buổi sớm tĩnh lặng.\n\nCái Chết Đen đã ở đây. Trời cao xin ngoảnh mặt."
  epidemic_events.5900.christian: "\"Lạy Cha chúng con ở trên trời, danh Cha cả sáng...\""
  epidemic_events.5900.fallback: "Cầu mong chúng ta kiên cường vượt qua những tháng ngày tăm tối này."

  epidemic_events.5901.t: "Ngập Tới Khuỷu Tay"
  epidemic_events.5901.desc: "The cadaver lies on the table, surrounded by various macabre equipment, as well as both my physician [physician.GetFirstName] and myself.\n\n"I'm not sure, [ROOT.Char.Custom('FormOfAddressForLiege')]," [physician.GetFirstNameNoTooltip] began nervously, [physician.GetHerHis] gaze affixed firmly at [physician.GetHerHis] feet. "I don't know what we can garner from this corpse..."\n\n[physician.GetSheHe|U] knows quite well what we #EMP could#! do, [physician.GetSheHe] simply doesn't want me to ask it of [physician.GetHerHim]. Dissecting the cadaver of a plaguebearer could glean us some precious hints as to how to combat it. The only question is whether there's any risk of catching the terrible affliction..."
  epidemic_events.5901.a: "\"Sao chúng ta không làm cùng nhau?\""
  epidemic_events.5901.a.tt: "Thu được hiểu biết"
  epidemic_events.5901.a.tt.plague: "Nhiễm dịch"
  epidemic_events.5901.b: "Ta ra lệnh tiến hành giải phẫu."
  epidemic_events.5901.c: "Được rồi, ta sẽ bỏ qua."

  epidemic_events.5902.t: "Qua Biên Giới"
  epidemic_events.5902.desc: "Dismounting hurriedly, I push my way through the throngs of soldiers in [border_province.GetName], within the border county of [border_county.GetNameNoTier]. The missive from my marshal [marshal.GetFirstName] had requested my judgement and presence, and as I spy [marshal.GetHerHim] I can see why.\n\nA ragged mass of people, tired and hungry, stand uncertainly before us. They are clearly refugees from the brutal plague that continues to wrack far-off lands, but there is no guarantee they have escaped unscathed.\n\nEven now, I can see a man in the pack hack and cough. [marshal.GetFirstNameNoTooltip] covers [marshal.GetHerHis] mouth uncertainly."
  epidemic_events.5902.a: "Không thể mạo hiểm. Giết hết."
  epidemic_events.5902.b: "Có lẽ ta có thể lập vài trại tạm."
  epidemic_events.5902.c: "Đuổi họ đi."
  epidemic_events.5902.d: "Cho họ qua."

  epidemic_events.5903.t: "Niềm Vui Nhỏ Bị Bỏ Lại"
  epidemic_events.5903.desc: ""[ROOT.Char.GetFirstName]! No!" The voice of [family.GetFirstName] rings out over the sound of my horse as it walks along the path. [family.GetSheHe|U] runs up beside me, glaring up reproachfully.\n\n"You've heard what's on the way. All that death and disease..." [family.GetSheHe] wrings [family.GetHerHis] hands unhappily. "You must stay here, safe and sound within the [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'walls')]. Please."\n\nI can only sigh. If I'd just been a little quicker out of the gate I'd be riding in the countryside now, happily taking in nature."
  epidemic_events.5903.a: "[family.GetSheHe|U] có lẽ nói đúng."
  epidemic_events.5903.b: "\"Bah, ta sẽ ổn thôi!\""

  epidemic_events.5904.t: "Những Kẻ Rao Giảng Ngày Tận Thế"
  epidemic_events.5904.desc: "Khu chợ thường ngày vốn khá nhộn nhịp, nhưng hôm nay là một mớ âm thanh hỗn loạn vang vọng khắp nơi. Ta nhìn thấy thủ phạm: một bóng người đang gào thét hết sức lực của [doomsday_preacher.GetHerHis].\n\n\"Ngày Tận Thế đã tới!\" [doomsday_preacher.GetSheHe] tru tréo, quấy nhiễu những người qua đường. \"Tất cả chúng ta sẽ diệt vong! Điều đó đã được viết sẵn!\"\n\nNhững giọt nước bọt bắn ra từ miệng kẻ rao giảng khiến đa số ghê tởm, nhưng một vài người trong đám đông đang bắt đầu lớn tiếng tán đồng."
  epidemic_events.5904.a: "[doomsday_preacher.GetSheHe|U] nói đúng! Chúng ta phải chuẩn bị!"
  epidemic_events.5904.b: "Lính gác? Bắt tên [doomsday_preacher.GetWomanMan] đó."
  epidemic_events.5904.c: "\"Chỉ cho ta xem nó được viết ở đâu. Chứng minh lời ngươi.\""
  epidemic_events.5904.c.tt.success: "Ngài bác bỏ được lập luận của hắn"
  epidemic_events.5904.c.tt.failure: "Ngài thua cuộc tranh luận"
  epidemic_events.5904.d: "\"Đừng nghe lời [doomsday_preacher.GetHerHim]!\""
  epidemic_events.5904.d.tt: "Tất cả các nam tước địa xung quanh [doomsday_province.GetName] có #color_white 15%#! khả năng nhận cùng hiệu ứng"

  epidemic_events.5905.t: "Nỗi Lo Lan Rộng"
  epidemic_events.5905.desc: "Sau khi cú sốc ban đầu về sự xuất hiện của ta qua đi, quán rượu này hóa ra lại là nơi khá thư giãn. Tuy vậy, người chủ quán trông vẫn có phần bất an.\n\n\"Ngài biết đấy, [ROOT.Char.Custom('FormOfAddressForLiege')], về trận dịch lớn kia? Ngài có nghe nó đang làm gì với con người không? Nó khiến họ #EMP [ROOT.GetCharacter.Custom('GetPlagueEffect')]!#!\" [peasant.GetSheHe] khoa tay múa chân cuống cuồng. \"Người ta nói thế đấy! Chúng ta sống sót kiểu gì đây?!\"\n\nNhững kẻ bận rộn mang tên #EMP 'người ta'#! lại một lần nữa làm rất tốt công việc của mình..."
  epidemic_events.5905.a: "\"Không cần hoảng loạn. Tin ta đi, ta là thầy thuốc.\""
  epidemic_events.5905.a.tt: "Tất cả các nam tước địa xung quanh [province.GetName] có #color_white 50%#! khả năng nhận cùng hiệu ứng"
  epidemic_events.5905.b: "\"Nghe có vẻ hợp lý đến thế sao?\""
  epidemic_events.5905.b.tt.success: "Ngài thuyết phục được họ"
  epidemic_events.5905.b.tt.failure: "Họ tỏ ra không bị thuyết phục"
  epidemic_events.5905.c: "Tranh luận với [peasant.GetHerHim] cũng chẳng khiến [peasant.GetHerHim] tin ta hơn."

  epidemic_events.5906.t: "Lang Thang, Gào Thét"
  epidemic_events.5906.desc: "The guards are usually not quite so forthright when it comes to disturbing me in my council chambers, but today they burst in readily, my marshal [marshal.GetFirstName] at their head. Behind them, being dragged along unceremoniously, is a pitiful figure with wide eyes and what appears to be a whip clasped tightly in [flagellant.GetHerHis] hands.\n\n"We found [flagellant.GetHerHim] in [doomsday_province.GetName], wandering the streets, beating [flagellant.GetHerselfHimself] bloody with that thing." [marshal.GetFirstNameNoTooltip|U] indicates the whip. "[flagellant.GetSheHe|U] is giving the locals the frights of their lives, ranting about how the mighty pestilence is on its way to us and we must all repent.""
  epidemic_events.5906.a: "\"Ngươi và lũ như ngươi đang phá hoại đức tin [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!\""
  epidemic_events.5906.a.tt.success: "Ngài lập luận thành công"
  epidemic_events.5906.a.tt.failure: "Kẻ hành xác vẫn không lay chuyển"
  epidemic_events.5906.b: "Có lẽ [flagellant.GetSheHe] nói cũng có lý..."
  epidemic_events.5906.c: "\"Tống giam [flagellant.GetHerHim], [marshal.GetFirstNameNoTooltip].\""
  epidemic_events.5906.d: "Thả [flagellant.GetHerHim] đi. Họ không gây hại gì."
  epidemic_events.5906.d.tt: "Tất cả các nam tước địa xung quanh [doomsday_province.GetName] có #color_white 25%#! khả năng nhận cùng hiệu ứng"
  fervor_loss_flagellants: "Những kẻ hành xác lang thang tự do"

  epidemic_events.5907.t: "Cơn Nhột Nhẹ"
  epidemic_events.5907.desc: "Mi mắt ta hé mở khi ánh nắng sớm chiếu xuống. Ta ngồi dậy, vươn vai, ngáp và... #EMP ho#!.\n\nCổ họng hơi rát. Mắt ta cũng mờ hơn thường lệ. Thậm chí còn có chút sụt sịt.\n\nÔi không. Xin đừng là ta. Xin hãy giải thoát ta khỏi số phận này. Nói cho ta biết đi, hỡi [ROOT.Char.GetFaith.HighGodName], rằng tai ương kinh hoàng ấy chưa lan tới vùng đất này và biến ta thành nạn nhân của nó..."
  epidemic_events.5907.a: "Ngự y của ta sẽ cho ta những phương pháp điều trị tốt nhất!"
  epidemic_events.5907.b: "Không sao đâu. Chắc chắn là không sao."
  epidemic_events.5907.b.success: "Quả thật chẳng có gì"
  epidemic_events.5907.b.failure: "Chỉ là hắt hơi sổ mũi thôi"
  epidemic_events.5907.b.criticalfailure: "Ngài thực sự ngã bệnh"

  epidemic_events.5908.t: "Xếp Xác Cứng Đờ"
  epidemic_events.5908.desc: "Người thỉnh cầu đầu tiên trong ngày bước tới trước mặt ta, và rõ ràng đây chẳng phải ai có địa vị cao. Đất bẩn bám dưới móng tay [gravedigger.GetHerHis] đã nói lên điều đó, dù [gravedigger.GetSheHe] rõ ràng đã cố gắng tỏ ra chỉnh tề.\n\n\"Thần đại diện cho những người đào mộ của [province.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')],\" [gravedigger.GetSheHe] bắt đầu, \"và chúng thần có một thỉnh cầu. Trận dịch đáng sợ đang tiến gần khi chúng ta còn đang nói chuyện: nghề nghiệp cao quý của chúng thần sắp tới sẽ vô cùng cần thiết.\"\n\n\"Chúng thần sẽ là những người xử lý thi thể, là những người đối mặt với rủi ro lớn nhất.\" [gravedigger.GetSheHe|U] tiếp tục. \"Đổi lại, chúng thần chỉ xin tăng một chút tiền công. Bệ hạ có thể ban cho chúng thần số tiền đó không?\""
  epidemic_events.5908.a: "\"Hỏi thêm lần nữa là tự đào mồ cho mình đấy.\""
  epidemic_events.5908.b: "Đảm bảo họ được trả công xứng đáng."
  epidemic_events.5908.c: "\"Bah! Thiếu gì người như các ngươi.\""

  epidemic_events.5999.t: "Chân Trời U Ám"
  epidemic_events.5999.desc: "Thư từ và báo cáo trải khắp bàn làm việc của ta. Tất cả đều xoay quanh một chủ đề duy nhất. Nỗi hoảng loạn thấm ra từ từng con chữ, dần hình thành một vũng sợ hãi đang lớn nhanh trong bụng ta.\n\nCăn bệnh khởi phát bằng những cơn rét run và sốt cao, trước khi những khối u hoại tử hình thành dưới nách của kẻ bất hạnh. Hơi thở họ trở nên đứt quãng thảm hại giữa những lần khạc ra máu, môi và ngón chân chuyển sang màu đen bầm. Rồi nó giết chết, không phân biệt; giàu hay nghèo, trẻ hay già, công tước hay kẻ cùng đinh.\n\nNhững báo cáo hiện vẫn đến từ các vùng đất xa xôi, nhưng đôi tay run rẩy của ta lần theo những mốc thời gian.\n\nNó đang tới gần."
  epidemic_events.5999.a: "Ha! Cứ để chúng chết."
  epidemic_events.5999.a.tt: "Nó còn ở rất xa! Ta có thể vui mừng trước bất hạnh của họ."
  epidemic_events.5999.b: "Chúng ta phải làm gì đó!"
  epidemic_events.5999.b.tt: "Phong tỏa nhà cửa! Đóng kín lối vào! Trồng những luống hoa hồng!"
  epidemic_events.5999.c.christian: "#EMP \"Ta nhìn xem, và kìa, một con ngựa xanh...\"#!"
  epidemic_events.5999.c.notchristian: "Một điềm gở cho những thời khắc sắp tới..."

  epidemic_events.0110.t: "Từ Tro Bụi"
  epidemic_events.0110.desc: "Cuối cùng, dịch bệnh cũng đã rời khỏi lãnh thổ, và chúng ta phải coi đây là cơ hội để trỗi dậy từ đống hỗn loạn mà nó để lại.\n\nChúng ta bước ra khỏi tàn tích của thế giới cũ, và đã đến lúc suy ngẫm về một thế giới mới."
  epidemic_events.0110.desc.new_capital: "\n\nNhững đoàn người sống sót đã bắt đầu đổ về [new_preferred_capital.GetName] như một nơi trú ẩn mới, và điều này có thể trở thành một cơ hội đầy hứa hẹn cho một kinh đô mới."
  epidemic_events.0110.a: "[new_preferred_capital.GetNameNoTierNoTooltip|U] sẽ là một kinh đô mới tuyệt vời."
  epidemic_events.0110.b: "Chúng ta sẽ không tiếc chi phí để tái thiết."
  epidemic_events.0110.c: "Ta không thể làm gì hơn."
  every_county_infected_10_years: "Mọi [county|E] từng bị nhiễm dịch trong 10 năm qua"

  epidemic_events.alert_title: "Bùng Phát Dịch Bệnh: [infected_county.GetNameNoTierNoTooltip]"
  epidemic_events.alert_description: "Một [epidemic|E] mang tên [epidemic.GetName] đã tấn công [infected_county.GetName]"
  msg_epidemic_infection: "[epidemic.GetNameNoTooltip] Lan Rộng"
  msg_epidemic_infection_desc_1: "Một [epidemic|E] mang tên [epidemic.GetName] đã lan tới [LEFT_TITLE.GetProvince.GetBaronyNameExplicitly]"
  msg_epidemic_infection_desc_2: "Một [epidemic|E] mang tên [epidemic.GetName] đã lan tới [LEFT_TITLE.GetProvince.GetBaronyNameExplicitly] và [RIGHT_TITLE.GetProvince.GetBaronyNameExplicitly]"
  msg_epidemic_infection_desc: "Một [epidemic|E] mang tên [epidemic.GetName] đã lan tới [LEFT_TITLE.GetProvince.GetBaronyNameExplicitly], [RIGHT_TITLE.GetProvince.GetBaronyNameExplicitly ], và $message_consolidation_others$"
 
  EVENT_WINDOW_OPTION_AVAILABLE_PHYSICIAN: "Khả dụng vì Ngài có [GetCourtPositionType('court_physician_court_position').GetName]"
