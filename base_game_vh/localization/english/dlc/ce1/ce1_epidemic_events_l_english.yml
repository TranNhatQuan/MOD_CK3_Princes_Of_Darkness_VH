l_english:

  health.1015.t: "[SCOPE.Custom('EventTitleDisease')]: Nỗi Khổ Nhỏ Nhoi"
  health.1015.desc: "#EMP Ngứa.#! Ta tỉnh giấc giữa đêm và thấy chân mình đang chảy máu. Cả móng tay cũng vậy. Cơn ngứa dữ dội đến mức Ta không thể ngăn bản thân cào sâu hơn.\n\nTa úp mặt vào làn nước lạnh với hy vọng nó sẽ biến mất. Hình ảnh phản chiếu — đôi mắt đỏ ngầu."
  health.1015.court_physician.desc: "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], đó là chứng bệnh được gọi là sởi.\""
  health.1015.a: "Ta không chịu nổi nữa!"
  health.1016.t: "[SCOPE.Custom('EventTitleDisease')]: Đài Phun Đỏ Thẫm"
  health.1016.desc: "#EMP Agh.#! Ta ôm chặt bụng trong đau đớn. Ta đã không còn biết mình ở trong nhà xí này bao lâu rồi. Hàng giờ, hay hàng ngày? #EMP Hàng tuần?#! Aghhhhhh. Chất thải đẫm máu khiến mỗi lần càng đau hơn. Mùi hôi thối cũng chẳng khá hơn.\n\nTa cảm thấy như sắp ngất đi..."
  health.1016.court_physician.desc: "\n\n\"Ta e rằng đó có thể là bệnh kiết lỵ, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
  health.1016.a: "Xin hãy cho ta... nước."
  health.1017.t: "[SCOPE.Custom('EventTitleDisease')]: Ngọn Lửa Thiêu Đốt"
  health.1017.desc: "Ta không thể ngăn cơ thể mình chuyển động. Dừng lại! Dừng lại! Cánh tay ta cứ tự run rẩy, và ta thấy các ngón tay mình dần chuyển sang màu đen. Những cơn co giật lan khắp cơ thể — như thể ta đang nhảy múa.\n\nMọi thứ đều là lửa. Dừng lại! #EMP DỪNG LẠI!#!"
  health.1017.court_physician.desc: "\n\n\"Có vẻ như ngài đang bị ảnh hưởng bởi ngọn lửa của [ROOT.Char.GetFaith.HouseholdGodName], [ROOT.Char.Custom('FormOfAddressForLiege')].\""
  health.1017.a: "Hãy làm cho nó dừng lại!"
  health.1112.t: "[SCOPE.Custom('EventTitleDisease')]: Một Cơ Hội Để Thở"
  health.1112.desc: "Ta ngồi xuống giường và nhìn vào đôi tay mình, ngửa lòng bàn tay lên. Cuối cùng, những vết phát ban đã biến mất và làn da trở lại màu sắc bình thường.\n\nThật gần như kỳ lạ khi có thể hít thở trở lại mà không còn cơn ngứa dữ dội ấy."
  health.1112.a: "Đến lúc quay lại rồi."
  health.1112.a.tt: "Giờ ta đã miễn nhiễm với [GetTrait('measles').GetName( GetNullCharacter )]"
  health.1113.t: "[SCOPE.Custom('EventTitleDisease')]: Một Khoảng Nghỉ"
  health.1113.desc: "Lần đầu tiên ta có thể suy nghĩ rõ ràng trở lại, ta suýt nữa không nhận ra. Làn sương mù bao phủ tâm trí dường như đã tan biến mà không hề báo trước.\n\nThức ăn và nước cuối cùng cũng có thể giữ lại trong cơ thể, và ta cảm thấy một cơn thèm khát mãnh liệt đối với [ROOT.Char.Custom('FavoriteTreatDemand')]."
  health.1113.a: "Đến lúc kiếm gì đó ăn."
  health.1114.t: "[SCOPE.Custom('EventTitleDisease')]: Trở Lại Bình Thường"
  health.1114.desc: "Ta bước xuống giường và cảnh tượng những ngón tay khỏe mạnh, hồng hào hiếm như một con hươu trắng. Cơ thể cuối cùng cũng ban cho Ta chút yên bình. Những cơn co giật đã biến mất — không còn nhảy múa nữa.\n\nTa thở phào nhẹ nhõm. Bình yên. Ta đã nhớ nó biết bao."
  health.1114.a: "Từ giờ ta chỉ nhảy múa trong yến tiệc mà thôi."
  epidemic_events.0001.t: "Nó Đang Lan Rộng"
  epidemic_events.0001.desc: "Đêm buông xuống. Ta bám chặt vào bàn chiến bằng gỗ, nhắm mắt lại. Mồ hôi nhỏ giọt xuống bề mặt. Bị suy kiệt bởi [disease_scope.GetNameNoTooltip( GetPlayer )|l], [ROOT.Char.Custom('disease_desc_short')]. #EMP Ta đã trở thành thế này sao?#!\n\nTa nghe thấy những tiếng ho khe khẽ vọng từ bên ngoài lều. Với ta thì đã quá muộn — ta chỉ có thể hy vọng nó sẽ không lan đến những [dummy_gender.GetWomenMen] của mình."
  epidemic_events.0001.a: "#EMP Khốn kiếp.#!"
  epidemic_events.0001.a.toast: "Sự lây nhiễm đang gia tăng"
  epidemic_events.0001.a.christian: "#EMP [ROOT.Char.Custom('christian_curse')|U].#!"
  epidemic_infected_knights_modifier: "Hiệp Sĩ Bị Nhiễm Bệnh"
  epidemic_infected_army_modifier: "Quân Đội Bị Nhiễm Bệnh"
  christian_curse_bones: "bởi xương cốt của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  christian_curse_nails: "bởi móng đinh của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  christian_curse_nails2: "bởi những chiếc đinh của $chistianity_good_god_christ$"
  christian_curse_arms: "bởi cánh tay của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  christian_curse_blood: "bởi máu của $chistianity_good_god_christ$"
  christian_curse_death: "bởi cái chết của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  christian_curse_wounds: "bởi vết thương của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  christian_curse_body: "bởi thân thể của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  disease_desc_short_plague: "bị hành hạ bởi những bướu đen"
  disease_desc_short_measles: "bị bao vây bởi những đốm đỏ"
  disease_desc_short_dysentery: "bị giày vò bởi chất thải đẫm máu"
  disease_desc_short_ergotism: "bị trừng phạt bởi những cử động thất thường"
  disease_desc_short_typhus: "bị dày vò bởi sốt doanh trại"
  disease_desc_short_consumption: "bị tàn phá bởi những cơn ho ra máu"
  disease_desc_short_smallpox: "đầy rẫy sẹo và phát ban"
  disease_desc_short_cancer: "bị bào mòn bởi ung thư"
  disease_desc_short_gout: "bị hành hạ bởi các khớp sưng tấy"
  disease_desc_short_pneumonic: "bị giày vò bởi những cơn ho"
  disease_desc_short_great_pox: "bị hành hạ bởi các vết loét hoa liễu"
  disease_desc_short_lovers_pox: "bị đánh dấu bởi các mụn nước hoa liễu"
  disease_desc_short_leper: "nặng nề vì làn da bong tróc"
  disease_desc_short_incapable: "bị dày vò bởi sự bất lực"
  disease_desc_short_infirm: "thân thể suy nhược"
  disease_desc_short_ill: "mắc phải một căn bệnh"

  epidemic_events.1000.t: "Giáo Phái [cult_epidemic.GetNameNoTooltip]"
  epidemic_events.1000.desc: "Một vị tu sĩ mắt cuồng loạn tên là [charismatic_priest.GetFirstName] rao giảng rằng [cult_epidemic.GetName] là sự trừng phạt thiêng liêng — và chỉ có việc thờ phụng [charismatic_priest.GetFaith.HighGodName|U] mới có thể cứu rỗi chúng ta. Đám đông đổ xô đến với [charismatic_priest.GetHerHim], bị lay động bởi lửa và nỗi sợ hãi.\n\nNếu không bị ngăn chặn, giáo phái dịch bệnh này có thể lật đổ quyền cai trị của [ROOT.Char.GetFaith.GetAdjective] tại [infected_county.GetName] và xa hơn nữa."
  epidemic_events.1000.a: "Thiêu sống tên điên này!"
  epidemic_events.1000.b: "Ta chắc chuyện này vô hại thôi."
  epidemic_events.1000.c: "Cuối cùng, ta đã tìm thấy [charismatic_priest.GetFaith.HighGodName|U]!"
  epidemic_events.1010.t: "Oan Hồn Lãng Mạn"
  epidemic_events.1010.desc: "[epidemic_scope.GetName|U] đang rình rập lãnh thổ của ta — và giờ thì [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('superstitious_courtier'))] của ta, [superstitious_courtier.GetFirstName], thì thầm về những điều còn tệ hơn.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip|U] của Ta,\" [superstitious_courtier.GetSheHe] van nài, \"tình yêu của ngài dành cho [dead_lover.GetFirstName] ai cũng biết. Nhưng dịch bệnh cưỡi cùng người chết. Chúng ta phải niêm phong quan tài của [dead_lover.GetHerHis] — đóng đinh lại — trước khi [dead_lover.GetSheHe] trỗi dậy và gieo rắc lời nguyền.\""
  epidemic_events.1010.a: "\"Ngươi dám sao!\""
  epidemic_events.1010.b: "Có lẽ [superstitious_courtier.GetSheHe] nói đúng..."
  epidemic_events.1010.c: "Đóng đinh mọi quan tài trong lãnh thổ!"
  all_realm_county_epidemic_scope: "Mọi [county|E] trong [realm|E] có [epidemic_scope.GetName]"
  epidemic_events.1020.t: "Không Khí Độc Trên [epidemic_county.GetNameNoTierNoTooltip|U]"
  epidemic_events.1020.desc: "Thương mại tại [epidemic_county.GetNameNoTier] đã lụi tàn. [miasma_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đổ lỗi cho tử khí chết chóc — và đề xuất một phương thuốc kỳ quặc.\n\n\"Nếu chúng ta trồng một cánh đồng đầy [epidemic_province.Custom('get_region_flower_type_plural')] ngọt ngào, làn hương thơm có thể xua đuổi dịch bệnh.\"\n\nKỳ lạ. Nhưng có lẽ cũng chẳng kỳ lạ hơn chính dịch bệnh."
  epidemic_events.1020.a: "Đáng để thử."
  epidemic_events.1020.b: "Thật lãng phí vàng."
  epidemic_events.1030.t: "Đỉa!"
  epidemic_events.1030.desc: "[leeched_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xông vào, mắt trợn trừng, tay ôm chặt một bao đỉa.\n\n\"Đỉa là cách duy nhất để chặn đứng [epidemic_scope.GetName]!\" [leeched_courtier.GetSheHe] hét lên.\n\nTruyền thống nói rằng chúng chỉ nên được dùng dưới sự chăm sóc của chuyên gia — nhưng đây là thời khắc tuyệt vọng. Chúng ta thực sự có thể chờ đợi sao?"
  epidemic_events.1030.a: "Phát đỉa cho tất cả mọi người!"
  epidemic_events.1030.a.success: "Đỉa tỏ ra có hiệu quả"
  epidemic_events.1030.a.failure: "Đỉa gây hại"
  epidemic_events.1030.b: "Hãy làm theo những giáo huấn đã được thiết lập."
  epidemic_events.1040.t: "Giáo Phái Tự Đánh Roi"
  epidemic_events.1040.desc.intro: "Khi [epidemic_scope.GetName|U] lan rộng, những kẻ cuồng tín xuất hiện — tự quất roi vào thân thể giữa đường phố, tuyên bố rằng điều đó mang lại ân sủng thiêng liêng.\n\n"
  epidemic_events.1040.desc.mid.approves: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))] của ta, [chaplain.GetFirstName], tiến đến với ánh mắt rực lửa. \"Thưa bệ hạ — đây là sự sám hối thiêng liêng hiện thân. Chúng ta phải ban phước cho chính nghĩa của họ!\""
  epidemic_events.1040.desc.mid: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nổi giận đùng đùng. \"Đó là tà giáo — đồi bại và nguy hiểm! Ngài phải lên án nó.\"\n\nĐám đông hô vang ngày càng lớn."
  epidemic_events.1040.a: "Chúng ta phải chấm dứt sự băng hoại này!"
  epidemic_events.1040.b: "Họ chỉ đang tự làm đau bản thân thôi."
  epidemic_events.1040.c: "Nếu họ nói thật, thì ta cũng sẽ tự đánh roi!"
  epidemic_events.1050.t: "Ngày Tận Thế"
  epidemic_events.1050.desc: "Ta bắt gặp [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))|U] [chaplain.GetFirstName] đang đi đi lại lại bên ngoài, mặt tái mét, hoảng loạn. \"[ROOT.Char.GetTitleAsNameNoTooltip|U] của Ta — bọn dị giáo rêu rao rằng [epidemic_scope.GetName] là cơn thịnh nộ của [ROOT.Char.GetFaith.HighGodNamePossessive], rằng hồi kết đã đến với chúng ta!\"\n\nBạo lực. Hoảng loạn. Những kẻ cuồng tín rao giảng diệt vong trên đường phố.\n\n\"Chúng ta phải hành động. Nếu không, sự điên loạn của chúng sẽ nuốt chửng chút trật tự còn sót lại.\""
  epidemic_events.1050.a: "Nhổ tận gốc chúng!"
  epidemic_events.1050.b: "Cử các nhà thần học đến tranh luận với họ!"
  epidemic_events.1050.b.tt.success: "Nỗi sợ tận thế bị xoa dịu"
  epidemic_events.1050.b.tt.failure: "Dân chúng không bị thuyết phục"
  epidemic_events.1050.c: "Có lẽ họ nói đúng..."
  story_plague_trials_title: "Xét Xử Dịch Bệnh:"
  epidemic_events.1060.t: "$story_plague_trials_title$ Kẻ Mang Tai Ương"
  epidemic_events.1060.desc.intro: "Khi [epidemic_scope.GetName] lan rộng, nỗi sợ sinh ra điên loạn.\n\n"
  epidemic_events.1060.desc.mid.cats: "Những lời thì thầm lan truyền rằng mèo mang theo dịch bệnh — những linh thú bị nguyền rủa trong lớp lông bóng mượt. Dân làng dìm chúng xuống giếng hoặc thiêu sống trong giỏ. Nơi từng là thợ săn loài gặm nhấm, giờ chúng trở thành con mồi."
  epidemic_events.1060.desc.mid.dogs: "Giờ đây nông dân tuyên bố rằng chó mang dịch bệnh — rằng đôi mắt chúng ánh lên thứ ánh sáng bị nguyền rủa. Cả đàn bị săn lùng và đem ra xét xử giả, thậm chí bị thiêu sống."
  epidemic_events.1060.desc.mid.faith: "Những tín đồ của [faith_to_blame.GetAdherentNamePlural] — vốn được dung thứ từ lâu — nay bị xem là tai họa. \"Họ đã chọc giận thiên giới,\" dân làng nói, \"và giờ chúng ta phải chịu khổ vì điều đó.\" Đền thờ của họ bị báng bổ. Lời cầu nguyện quay ngược chống lại họ."
  epidemic_events.1060.desc.mid.trait: "Bất kỳ ai bộc lộ ham muốn cấm kỵ, phong tục kỳ lạ, hay thói xấu bị xa lánh đều bị bắt giữ. Một cổ tay mềm yếu, một câu đùa dâm tục, một lời buộc tội mơ hồ — thế là đủ để kết tội."
  epidemic_events.1060.desc.mid2.witches: "Họ nói rằng phù thủy đã nguyền rủa vùng đất — những phụ nữ thông thái, bà đỡ, kẻ bị ruồng bỏ. Bị hàng xóm tố cáo, lôi khỏi nhà, kết án mà không cần xét xử, chỉ bằng tiếng thét."
  epidemic_events.1060.desc.mid2.sin: "Họ tin rằng chúng ta đã trở nên quá [sinful_trait.GetName(ROOT.Char)] và chỉ thông qua sự sám hối tập thể cùng những hình phạt nghiêm khắc, chúng ta mới có thể trở lại lối sống mà [ROOT.Char.GetFaith.HighGodName] mong muốn."
  epidemic_events.1060.desc.outro: "\n\n[ROOT.Char.GetFaith.PriestNeuterPlural|U] lên án những hành vi này. Nhưng các cuộc giết chóc vẫn tiếp diễn."
  epidemic_events.1060.a: "Ta không thể làm gì được."
  epidemic_events.1060.b: "Chấm dứt việc này ngay lập tức!"
  epidemic_events.1060.c: "Có lẽ câu trả lời nằm trong [ROOT.Char.GetFaith.ReligiousText|U]."
  witch_trial_story_tt: "#EMP Điều tồi tệ nhất có lẽ vẫn còn ở phía trước...#!"
  epidemic_events.1061.t: "$story_plague_trials_title$ Giàn Thiêu Thú Cưng"
  epidemic_events.1061.desc.intro: "Ta tỉnh giấc khi bầu trời nhuộm cam và khói nghẹt thở tràn ngập không khí. Dân làng đã đốt cháy thị trấn sao?\n\n"
  epidemic_events.1061.desc.mid.cats: "Không — là mèo. [chaplain.GetTitledFirstName] báo cho ta rằng chúng đang bị thiêu sống để xua đuổi [epidemic_scope.GetName]."
  epidemic_events.1061.desc.mid.dogs: "Không — là chó. [chaplain.GetTitledFirstName] báo cho ta rằng chúng đang bị thiêu sống để xua đuổi [epidemic_scope.GetName]."
  epidemic_events.1061.desc.outro: "\n\n\"Một cảnh tượng ghê rợn,\" [chaplain.GetSheHe] lẩm bẩm. \"Nhưng lại rất được ưa chuộng.\""
  epidemic_events.1061.a: "Ta đoán là chẳng thể làm gì."
  epidemic_events.1061.a.success: "Việc thiêu động vật không có tác dụng"
  epidemic_events.1061.a.failure: "Việc thiêu động vật bằng cách nào đó lại làm tăng lây nhiễm"
  epidemic_events.1061.b: "Phải chấm dứt chuyện này!"
  epidemic_events.1061.c: "Làm hại những con vật này phải trở thành tội ác."
  epidemic_events.1062.t: "$story_plague_trials_title$ Thợ Săn"
  epidemic_events.1062.desc.intro: "Một toán thợ săn trộm xông vào [ROOT.Char.Custom('GetCourt')] của ta, nồng nặc mùi mồ hôi và khói.\n\n"
  epidemic_events.1062.desc.mid.cats: "\"Thưa bệ hạ, là bọn mèo. Những con quái vật trơn trượt — quá nhiều mắt, không bao giờ ngủ. Dân gian nói chúng mang theo dịch bệnh trong tiếng rù rì.\""
  epidemic_events.1062.desc.mid.dogs: "\"[ROOT.Char.GetTitleAsNameNoTooltip|U] của Ta, lũ chó bị nguyền rủa. Ai cũng biết điều đó. Hãy để chúng Ta hoàn tất cuộc thanh trừng — mọi con thú, mọi con chó hoang, cho đến khi dịch bệnh chấm dứt.\""
  epidemic_events.1062.desc.outro: "\n\nChúng đứng chờ, nhe răng cười, đợi sự ban phép của ngài — máu đã dính trên ủng."
  epidemic_events.1062.a: "Giết hết bọn chúng."
  epidemic_events.1062.a.no_effect: "Việc giết động vật không có tác dụng"
  epidemic_events.1062.a.success: "Dịch bệnh thuyên giảm"
  epidemic_events.1062.a.failure: "Dịch bệnh trở nên tồi tệ hơn"
  epidemic_events.1062.b: "Bắt sống và đưa về kinh đô."
  epidemic_events.1062.b.no_effect: "Việc này không có tác dụng"
  epidemic_events.1062.b.failure: "Kinh đô tràn ngập động vật hung dữ"
  epidemic_events.1063.t: "$story_plague_trials_title$ Hãy Sám Hối!"
  epidemic_events.1063.desc.intro: "Một đám đông tụ tập gần trung tâm [ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U], nỗi hoảng loạn dày đặc trong không khí. Giữa âm thanh hỗn loạn, giọng một nhà giảng đạo đơn độc vang lên — thô ráp, dai dẳng, và bằng cách nào đó còn lớn hơn tất cả.\n\n\"Hãy sám hối! Hãy sám hối!\""
  epidemic_events.1063.desc.mid.faith: "Dịch bệnh này không phải do [faith_blamed.GetAdjective] gây ra!"
  epidemic_events.1063.desc.mid.sin: "Dịch bệnh này là sự trừng phạt của [ROOT.Char.GetFaith.HighGodName|U] cho sự yếu đuối và khuynh hướng trở nên [trait_blamed.GetName(ROOT.Char)] của chúng ta."
  epidemic_events.1063.desc.mid.witch: "Không phải phù thủy mới là thứ ta nên đổ lỗi, mà chính là bản thân chúng ta!"
  epidemic_events.1063.desc.mid.cats: "Đổ lỗi cho đại dịch này lên một sinh vật khốn khổ và đáng thương như mèo thì thật nực cười!"
  epidemic_events.1063.desc.mid.dogs: "Đổ lỗi cho đại dịch này lên những con chó đầu óc đơn giản là điều vô nghĩa!"
  epidemic_events.1063.desc.outro: "Chỉ bằng cách nỗ lực trở thành [virtuous_trait.GetName(ROOT.Char)] thì chúng ta mới có thể hy vọng đại dịch chấm dứt."\n\nDân chúng rì rầm tán đồng. Thật ra, một phần trong Ta tự hỏi liệu họ có đúng không. Tội lỗi của Ta ăn sâu, sâu hơn cả những gì Ta dám thừa nhận thành lời. Và nếu đại dịch này là sự phán xét... thì có lẽ nó bắt đầu từ chính Ta."
  epidemic_events.1063.a: "Ta sám hối!"
  epidemic_events.1063.b: "Nhảm nhí và vớ vẩn."
  epidemic_events.1063.c: "Chắc chắn ta có thể tranh luận với một tên giảng đạo đường phố tầm thường."
  epidemic_events.1063.c.success: "Ngài khiến tên giảng đạo chùn bước"
  epidemic_events.1063.c.failure: "Ngài tự làm mình bẽ mặt"
  epidemic_events.1064.t: "$story_plague_trials_title$ Giàn hỏa thanh tẩy"
  epidemic_events.1064.desc.intro: "Bất chấp nỗ lực của ta nhằm dập tắt mê tín, các cuộc xét xử phù thủy vẫn bùng phát khắp vương quốc, và không nơi nào dữ dội hơn tại [witch_trial_county.GetNameNoTier]. Ở đó, [epidemic_scope.GetName] đã biến nỗi sợ thành cơn cuồng nộ.\n\n"
  epidemic_events.1064.desc.mid.sin: "Họ dìm chết người vô tội, thiêu sống kẻ bệnh tật — tất cả nhân danh việc nhổ tận gốc [trait_blamed.GetName(ROOT.Char)] trong xã hội. Mỗi giàn hỏa thiêu khiến lãnh địa của ta nghèo hơn và kinh hãi hơn."
  epidemic_events.1064.desc.mid.witch: "Họ dìm chết người vô tội, thiêu sống kẻ bệnh tật — tất cả nhân danh sự thanh khiết. Mỗi giàn hỏa thiêu khiến lãnh địa của ta nghèo hơn và kinh hãi hơn."
  epidemic_events.1064.desc.outro: "\n\nNếu đây là công lý, thì nó chẳng phục vụ [ROOT.Char.GetFaith.HighGodName|U] cũng không phục vụ vương miện."
  epidemic_events.1064.a: "Phái nha lại tới [witch_trial_county.GetNameNoTierNoTooltip]. Chuyện này kết thúc tại đó."
  epidemic_events.1064.b: "Các cuộc xét xử phải chấm dứt!"
  epidemic_events.1064.c: "Chúng ta phải giảng đạo chống lại tập tục này."
  epidemic_events.1064.c.success: "Thông điệp của Ngài rất thuyết phục"
  epidemic_events.1064.c.failure: "Các cuộc xét xử vẫn tiếp diễn"
  epidemic_events.1065.t: "$story_plague_trials_title$ Ô nhục"
  epidemic_events.1065.desc.intro: "Cơn dịch của nỗi sợ giờ đây đã chạm tới chính gia đình ta.\n\nCác nhà giảng đạo đã kích động đám đông chống lại [shamed_buddy.Custom2('MyCharacterIntroduction', ROOT.Char)]. Họ buộc tội [shamed_buddy.GetHerHim] "
  epidemic_events.1065.desc.mid.sin: "là kẻ [trait_blamed.GetName(shamed_buddy)],"
  epidemic_events.1065.desc.mid.witch: "hành tà thuật,"
  epidemic_events.1065.desc.outro: "of consorting with [ROOT.Char.GetFaith.EvilGodNames], of sin in silk. Now they demand [shamed_buddy.GetHerHis] public punishment — dragged from [shamed_buddy.GetHerHis] halls and made to repent.\n\nTo refuse them risks revolt. To yield shames the crown."
  epidemic_events.1065.a: "Cho họ thứ họ muốn."
  epidemic_events.1065.b: "Ta từ chối!"
  epidemic_events.1065.c: "Ta sẽ thay [shamed_buddy.GetHerHis] chịu tội."
  epidemic_events.1066.t: "$story_plague_trials_title$ Trục xuất"
  epidemic_events.1066.desc: "Không lời lẽ nào lay chuyển được nông dân — họ đổ lỗi cho [faith_blamed.GetAdherentNamePlural] vì [epidemic_scope.GetName]. Thương nhân của họ bị quấy rối, nhà cửa bị bôi bẩn. Nhiều người đã bỏ trốn, và thương mại thì suy kiệt.\n\nTệ hơn nữa, tại một số ngôi làng, họ đang bị săn đuổi.\n\nNếu sự đàn áp này tiếp diễn, vương quốc của ta có thể tự rút cạn máu mình — không phải vì dịch bệnh, mà vì nỗi sợ."
  epidemic_events.1066.a: "Hành vi này phải bị trừng phạt."
  epidemic_events.1066.b: "Điều này nằm ngoài tầm kiểm soát của ta."
  epidemic_events.1066.c: "Ta có thể ban nơi trú ẩn tại kinh đô."
  epidemic_events.1067.t: "Làn sóng dịch bệnh của người [faith_blamed.GetAdjectiveNoTooltip|U]"
  epidemic_events.1067.desc: "Khi [epidemic_scope.GetName] tàn phá lãnh thổ của [bigoted_ruler_that_everyone_hates.GetNamePossessive], nông dân ở đó liên tục đổ lỗi cho [faith_blamed.GetAdherentNamePlural]. Vấn đề này lan rộng đến mức nhiều người đã bắt đầu bỏ trốn khỏi [bigoted_ruler_that_everyone_hates.GetPrimaryTitle.GetNameNoTierNoTooltip|U] và tìm đến lãnh thổ của ta."
  epidemic_events.1067.a: "Họ được chào đón tại đây."
  epidemic_events.1067.b: "Chúng ta không thể mở cổng cho dịch bệnh."
  epidemic_events.1067.c: "Ban nơi trú ẩn tại kinh đô."
  every_bordering_county: "Mọi quận giáp ranh với [bigoted_ruler_that_everyone_hates.GetName]"
  epidemic_events.1068.t: "$story_plague_trials_title$ Cô quạnh"
  epidemic_events.1068.desc: "Những cuộc săn phù thủy đổ lỗi cho [faith_blamed.GetAdherentNamePlural] vì [epidemic_scope.GetName] đã bóp nghẹt thương mại trên toàn vương quốc.\n\n[loneless_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lảo đảo bước vào triều đình, trông chẳng khác gì kẻ ăn mày. \"Sự đàn áp đã xua đuổi các chủ nợ, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U]. Nỗi sợ lây nhiễm — và đám đông — đã khiến mọi đồng tiền câm lặng. Cho vay nặng lãi đã biến mất. Kho bạc của Ta đã cạn. Của ngài rồi cũng sẽ theo sau.\""
  epidemic_events.1068.a: "[loneless_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip|U] sẽ là nơi an toàn cho tất cả."
  epidemic_events.1068.b: "Ta có thể cho ngươi vay."
  epidemic_events.1068.c: "Thật đáng tiếc."
  all_of_vassals_holding: "Toàn bộ lãnh địa của [loneless_vassal.GetNamePossessive]"
  epidemic_events.1100.t: "Bóng đen bao phủ [infected_county.GetNameNoTierNoTooltip|U]"
  epidemic_events.1100.desc.intro.apocalyptic: "Những con phố của [infected_county.GetNameNoTier] đã chìm vào im lặng. [ROOT.Char.GetFaith.DeathDeityName|U] đã giáng tai dịch của [ROOT.Char.GetFaith.DeathDeityHerHis] xuống"
  epidemic_events.1100.desc.intro.major: "Bước đi qua [infected_county.GetNameNoTier] chẳng khác nào được chứng kiến một bản giao hưởng kinh hoàng của nỗi thống khổ con người. Dịch bệnh đã ập đến"
  epidemic_events.1100.desc.intro.fallback: "Một chuyến dạo bước qua [infected_county.GetNameNoTier] hé lộ điều gì đó vô cùng khó chịu. Một trận dịch đã xuất hiện tại"
  epidemic_events.1100.desc.intro2.holy_site: "nơi linh thiêng bậc nhất này.\n\n"
  epidemic_events.1100.desc.intro2.cool_place: "đô thị từng phồn thịnh này.\n\n"
  epidemic_events.1100.desc.intro2.backwater: "ngôi làng hẻo lánh này.\n\n"
  epidemic_events.1100.desc.mid.typhus: "Những người nhiễm bệnh bị phát ban từ đầu đến chân, nóng rát khi chạm vào.\n\n"
  epidemic_events.1100.desc.mid.bubonic_plague: "Những khối bướu đen mưng mủ phủ kín da thịt người bệnh, chứa đầy chất lỏng hôi thối phát ra khí độc khi vỡ ra.\n\n"
  epidemic_events.1100.desc.mid.smallpox: "Da của người nhiễm bệnh đỏ sậm và phủ đầy u cục. Vô số vết sẹo mới chằng chịt vì gãi ngứa không ngừng, và đôi mắt tuyệt vọng của họ đỏ ngầu.\n\n"
  epidemic_events.1100.desc.mid.measles: "Làn da lồi lõm của người bệnh đỏ tươi và đau rát khi chạm vào. Họ toát mồ hôi ngay cả trong giá lạnh, và ánh mắt mang dáng vẻ của kẻ phong cùi.\n\n"
  epidemic_events.1100.desc.mid.dysentery: "Khi nhìn vào mắt người nhiễm bệnh, ánh nhìn của họ trống rỗng và vô hồn, như thể linh hồn đã rời đi nơi khác. Quần áo họ nhuốm đỏ sẫm phía sau, và họ ôm chặt bụng như thể ngăn ruột gan rơi ra.\n\n"
  epidemic_events.1100.desc.mid.ergotism: "Những người nhiễm bệnh thường co giật trong những điệu nhảy dị giáo vào những thời điểm ngẫu nhiên, xen kẽ là tiếng rên rỉ vô thức và việc phóng uế trên đường phố.\n\n"
  epidemic_events.1100.desc.mid.consumption: "Dù đi đến đâu, người ta cũng không thể thoát khỏi tiếng ho khạc và sặc sụa không dứt của người bệnh, máu đông nhuộm quần áo họ thành màu đỏ thẫm.\n\n"
  epidemic_events.1100.desc.mid.fallback: "Dân chúng bị giày vò bởi đủ loại ác dịch trong thể dịch, tạo ra những triệu chứng nhiều đến mức không thể kể tên.\n\n"
  epidemic_events.1100.desc.mid2.apocalyptic: "Không còn một linh hồn nào trong thị trấn chưa từng bị căn bệnh khủng khiếp này quật ngã, và nó vẫn đang nhanh chóng lan tới tầng lớp quý tộc."
  epidemic_events.1100.desc.mid2.major: "Ít nhất một nửa dân số nông dân đã bị nhiễm bệnh, và chỉ còn là vấn đề thời gian trước khi nó lan tới giới quý tộc."
  epidemic_events.1100.desc.mid2.fallback: "Dù số ca hiện vẫn còn thấp, nhưng chỉ là vấn đề thời gian trước khi nó lan rộng hơn."
  epidemic_events.1100.desc.outro.capital: "Ngay lúc này, người ta đã gọi tai họa này là \"[epidemic.GetName]\", và nó đang xảy ra ngay trước ngưỡng cửa của ta."
  epidemic_events.1100.desc.outro: "Ngay lúc này, người ta đã gọi tai họa này là \"[epidemic.GetName]\"."
  epidemic_events.1100.a.already_has_it: "Ta e là đã quá muộn..."
  epidemic_events.1100.a.compassionate: "Những nông dân bệnh tật đáng thương..."
  epidemic_events.1100.a.callous: "Chẳng có gì ta có thể làm."
  epidemic_events.1100.a.diligent: "Ta sẽ theo dõi sát sao."
  epidemic_events.1100.a.paranoid: "Ta sẽ #EMP không bao giờ#! rời khỏi phòng!"
  epidemic_events.1100.a.brave: "Ta đã sống sót qua những thứ tệ hơn."
  epidemic_events.1100.a.cannibal: "Thật lãng phí thịt ngon."
  epidemic_events.1100.a.eccentric: "Ta không thể chỉ chờ hết dịch trên một con thuyền sao?"
  epidemic_events.1100.a.zealous: "[ROOT.Char.GetFaith.HealthGodName|U] phù hộ chúng ta."
  epidemic_events.1100.a: "Ai đó nên làm gì đó."
  epidemic_events.1100.b: "Triệu tập ngự y!"
  epidemic_events.1100.c: "Triệu tập một ngự y!"
  look_for_physician_epidemic_tt: "Ngài sẽ tìm kiếm một [GetCourtPositionType('court_physician_court_position').GetName()] để giúp giảm nhẹ [epidemic|E]"
  physician_will_help_epidemic_tt: "[GetCourtPositionType('court_physician_court_position').GetName()] của Ngài sẽ cung cấp nhiều lựa chọn để đối phó với [epidemic|E]"
  epidemic_events.1110.t: "Xác chết trên đường"
  epidemic_events.1110.desc: "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đến nơi với gương mặt tái mét.\n\n\"Thưa [ROOT.Char.GetLadyLord], xác chết đang thối rữa ngoài đường. Chúng ta không thể chôn cất kịp — khí độc dày đặc. Chúng ta phải mở [GetBuilding('burial_site_01').GetName] tại [graveyard_county.GetName].\"\n\n[chaplain.GetSheHe|U] không xin phép. [chaplain.GetSheHe|U] van nài."
  epidemic_events.1110.a: "Được thôi."
  epidemic_events.1110.b: "Nơi đó chỉ dành cho ta và người của ta."
  epidemic_events.1120.t: "Món quà kinh tởm"
  epidemic_events.1120.desc: "As we enter [flung_corpse_location.GetName], a devilish idea crosses my mind. A few troops lie on the brink of death with [epidemic_scope.GetName] and soon will depart from this world. It is possible, however, for them to serve me in this war even in death.\n\nThe miasma from the corpses will surely cause more of my soldiers to fall ill, unless we were to dispose of the bodies somehow. Perhaps we may bring [corpse_flingee.GetName] to [corpse_flingee.GetHerHis] knees by sending [corpse_flingee.GetHerHim] a gift via catapult..."
  epidemic_events.1120.a: "Chất xác lên!"
  epidemic_events.1120.b: "Thật ghê tởm!"
  epidemic_events.1121.t: "Món quà từ trên trời"
  epidemic_events.1121.desc: "Quân đội của [corpse_flinger.GetNamePossessive] đã tiến vào lãnh thổ của ta và dừng lại bên ngoài lãnh địa, có lẽ đây là khởi đầu của một cuộc vây hãm.\n\nKhông lâu sau khi họ đến, ta nghe thấy một tiếng nổ lớn kèm theo âm thanh bết ướt ghê rợn từ bên ngoài. Ta vội chạy ra xem thứ gì đã gây nên âm thanh quái dị ấy, và cảnh tượng trước mắt khiến máu ta đông lại.\n\nPhần thi thể bị nghiền nát nằm trong vũng thịt và xương, như một màn trưng bày bệnh hoạn của lò mổ. Rõ ràng xác chết này mang mầm bệnh lạ, và nếu không làm gì, chắc chắn sẽ bùng phát dịch."
  epidemic_events.1121.a: "Bắn trả lại!"
  plague_averted_tt: "Dịch bệnh được ngăn chặn"
  plague_still_infects_tt: "Xác chết đã quá nát để di chuyển"
  epidemic_events.1121.b: "Cách ly thi thể và dọn dẹp nơi này!"
  epidemic_events.1121.b.success: "Việc cách ly thành công"
  epidemic_events.1121.b.failure: "Việc cách ly thất bại"
  epidemic_events.1121.c: "Chỉ cần tránh xa ta ra!"
  epidemic_events.1122.t: "Món quà bị trả lại"
  epidemic_events.1122.desc: "Một tiếng rít nhẹ xé gió vang lên khi một vật thể xuất hiện bên ngoài tường thành [flung_corpse_location.GetName]. Âm thanh ngày càng lớn cho đến khi vật đó rơi xuống giữa doanh trại với một tiếng bẹp.\n\nMáu, xương và răng vung vãi trong một hố lõm, chỉ còn dính lỏng lẻo với khối thịt không thể nhận dạng từng là con người. Có vẻ như 'món quà' của chúng ta đã quay trở lại."
  epidemic_events.1122.a: "Giờ thì quá nát để di chuyển rồi."
  epidemic_events.1122.b: "Xúc chúng lên và thử lại!"
  epidemic_events.1122.b.success: "Ngài bắn 'xác chết' trở lại"
  epidemic_events.1122.b.failure: "$plague_still_infects_tt$"
  epidemic_events.1123.t: "Mưa thịt"
  epidemic_events.1123.desc: "Ta nghe thấy tiếng mưa lách tách nhẹ nhàng trên bệ cửa sổ. Ta hơi giật mình vì lần cuối nhìn ra bầu trời vẫn quang đãng, nên liền nhìn ra ngoài và thấy bầu trời vẫn xanh trong.\n\nTa đưa tay ra ngoài cửa sổ, và bàng hoàng khi thấy máu nâu sẫm thấm ướt các ngón tay. Khắp bên ngoài, lãnh địa của ta đang bị dội xuống thứ chất ghê tởm ấy với những tiếng bẹp nặng nề của từng mảng thịt. Rõ ràng các thi thể lại bị ném đi lần nữa, nhưng giờ đây chúng đã bị hành hạ đến mức chỉ còn là một đống nhão máu và thịt."
  epidemic_events.1123.a: "Kinh hoàng tột độ."

