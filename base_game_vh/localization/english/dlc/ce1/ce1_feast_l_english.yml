l_english:

  feast_type_legendary: "Yến Tiệc Huyền Thoại"
  feast_type_legendary_desc: "$EFFECT_LIST_BULLET$ Giai đoạn $feast_phase_toast$ tập trung vào [legend|E] của Ngài\n$EFFECT_LIST_BULLET$ Các sự kiện sẽ tạo cơ hội tăng [opinion|E]\n$EFFECT_LIST_BULLET$ Một số lựa chọn sẽ cho phép giảm [stress|E]\n\n#weak Một câu chuyện lưu truyền muôn đời.#!"
  legendary_feast_valid_tt: "Ngài #bold không#! có một [promoted_legend|E]"
  feast.7204.t: "Một Câu Chuyện Được Kể"
  feast.7204.desc: "Âm thanh của những [ROOT.GetCharacter.Custom('GetMusicalInstrumentPlural')] vang vọng khắp đại sảnh của [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] trong khi các vị khách nhâm nhi những giọt cuối cùng của [ROOT.Char.Custom('RegionalAlcoholicDrink')]. Phía trên họ, giọng hát của [bard.GetTitledFirstName] vút lên đầy hòa âm.\n\n\"Hãy lắng nghe! Hãy lắng nghe! Vì ta sẽ kể cho các ngươi nghe câu chuyện về [ROOT.Char.GetPromotedLegend.GetName].\""
  feast.7204.a: "Mọi người sẽ bàn tán về chuyện này!"
  feast.7204.b: "Hah! Đừng quên đó là #EMP huyền thoại của ta#!!"
  feast.7204.c: "Các vị khách của ta sẽ không bao giờ quên một màn trình diễn như thế này."
  feast.7204.d: "Vì còn nhiều lần nữa!"
  feast.7205.t: "Một Câu Chuyện Được Nghe"
  feast.7205.desc: "$feast.7204.desc$\n\nBên cạnh [bard.GetHerHim], [host.GetTitledFirstName] mỉm cười đầy tự hào."
  feast.7205.a: "Một khúc ca tuyệt vời!"
  feast.7205.b: "#EMP Ôi!#! Ở đây thậm chí còn có [host.Custom('GetExpensiveDessert')]!"
  legendary_feast_legend_modifier: "Chủ Tiệc Huyền Thoại"
  legendary_feast_legend_modifier_desc: "Nhân vật này đã có huyền thoại của mình được ca tụng trong một yến tiệc trọng đại — và vẫn đang đắm mình trong vinh quang đó."
  legendary_feast_legend_boost_modifier: "Yến Tiệc Huyền Thoại"
  legendary_feast_legend_boost_modifier_desc: "Nhân vật này đã có huyền thoại của mình được ca tụng trong một yến tiệc trọng đại."
