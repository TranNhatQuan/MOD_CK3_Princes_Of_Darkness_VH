  building_legendary_statue: "$building_type_legendary_statue$"
  building_legendary_watchtower: "$building_type_legendary_watchtower$"
  building_legendary_hunting_lodge: "$building_type_legendary_hunting_lodge$"
  building_legendary_shrine_desc: "Nơi thờ phụng này không chỉ là một kỳ tích kỹ thuật vĩ đại, mà còn là chốn trú ẩn an toàn cho các tín đồ và người hành hương, đồng thời là minh chứng cho lòng mộ đạo của người cho xây dựng. Dù không được coi là thánh địa, sự tráng lệ của công trình đã khiến hạt này trở thành một trung tâm tôn giáo lớn trong khu vực."
  building_legendary_palace_desc: "Một cung điện rộng lớn và nguy nga với các khu vườn cùng bãi săn bao quanh. Nơi ở xa hoa này không chỉ mang lại sự thoải mái và giải trí cho bất kỳ vị quân chủ nào lưu trú, mà còn là biểu tượng địa vị của sự giàu có và quyền lực."
  building_legendary_statue_desc: "Hình tượng của một vị quân chủ huyền thoại nay đã được bất tử hóa trong đá. Tượng đài này không chỉ tôn vinh những chiến công vĩ đại của người cho dựng nên, mà bất kỳ ai sở hữu nó trong lãnh địa của mình cũng đều tuyên bố quyền giám hộ đối với chính huyền thoại ấy."
  building_legendary_watchtower_desc: "Công trình đồ sộ vươn cao này không chỉ gây choáng ngợp bởi sự hiện diện của nó, mà còn là một pháo đài cực kỳ kiên cố, được sử dụng để bảo vệ vương quốc trước những kẻ xâm lược tiềm tàng."
  building_legendary_hunting_lodge_desc: "Địa điểm này đã trở nên nổi tiếng nhờ hệ động vật hoang dã kỳ lạ và mang tính huyền thoại, vì vậy một nhà nghỉ săn bắn đồ sộ đã được xây dựng tại đây để mang lại sự tiện nghi cho các thợ săn mong muốn lưu danh thiên cổ."
  building_type_legendary_shrine: "Đền Thờ Huyền Thoại"
  building_type_legendary_palace: "Cung Điện Huyền Thoại"
  building_type_legendary_statue: "Tượng Đài Huyền Thoại"
  building_type_legendary_watchtower: "Tháp Canh Huyền Thoại"
  building_type_legendary_hunting_lodge: "Nhà Nghỉ Săn Bắn Huyền Thoại"
