l_english:
  CE1_ADVENTURER_WAR: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Cuộc Phiêu Lưu Huyền Thoại cho [TITLE.GetBaseName]"
  CE1_ADVENTURER_WAR_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
  CE1_ADVENTURER_CB_NAME: "Cuộc Phiêu Lưu Huyền Thoại"
  CE1_ADVENTURER_TRUCE: "$FP1_VARANGIAN_ADVENTURER_INDEPENDENCE_TRUCE_NAME$"
  DEMAND_FEALTY_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Yêu Cầu Thần Phục của [DEFENDER.GetName]"
  DEMAND_FEALTY_NAME_BASE: "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
  DEMAND_FEALTY_CB_NAME: "Yêu Cầu Thần Phục"
  ADVENTURER_KINGDOM_NAME: "Cuộc Phiêu Lưu [target_kingdom.GetNameNoTierNoTooltip]"
  adventuring_host: "Người Dẫn Đoàn Phiêu Lưu"
  legendary_adventure.troops_raised.tt: "Các Nhà Phiêu Lưu Đến"
  legendary_adventure_cb_tt: "Mở khóa qua quyết định"
  launch_a_legendary_adventure_tt: "Nhận quyền truy cập một lần vào Cuộc Phiêu Lưu Huyền Thoại [casus_belli|E], cho phép ngươi rời bỏ vương quốc hiện tại và tìm kiếm vận may ở một [kingdom|E] xa xôi."
  bonus_holy_war_tt: "Nhận quyền truy cập thêm một [kingdom|E]-cấp Cuộc Thánh Chiến [casus_belli|E]"
  any_drifting_empire_tt: "Hoặc:\n$BULLET_WITH_TAB$Phải có một [empire|E] với bất kỳ tiến trình [de_jure_drift|E] nào hướng về [primary_title|E] của ngươi\n$BULLET_WITH_TAB$Ngươi nắm giữ thêm một [empire|E] [title|E]"
  any_drifting_kingdom_tt: "Hoặc:\n$BULLET_WITH_TAB$Phải có một [kingdom|E] với bất kỳ tiến trình [de_jure_drift|E] nào hướng về [primary_title|E] của ngươi\n$BULLET_WITH_TAB$Ngươi nắm giữ thêm một [kingdom|E] [title|E]"
  any_drifting_duchy_tt: "Hoặc:\n$BULLET_WITH_TAB$Phải có một [duchy|E] với bất kỳ tiến trình [de_jure_drift|E] nào hướng về [primary_title|E] của ngươi\n$BULLET_WITH_TAB$Ngươi nắm giữ thêm một [duchy|E] [title|E]"
  not_already_de_jure_your_title_tt: "Danh hiệu này chưa phải là một phần [de_jure|E] của [primary_title|E] của ngươi"
  legendary_conversion_tt: "Chuyển đổi ngay lập tức một phần lớn [realm|E] của ngươi sang [faith|E] của ngươi"
  leg_demand_fealty_v_attacker: "[defender.GetName] trở thành [vassal|E] của ngươi"
  leg_demand_fealty_v_neutral: "[defender.GetName] trở thành [vassal|E] của [attacker.GetNamePossessive]"
  legend_demand_fealty: "Yêu Cầu Thần Phục Địa Phương"
  legend_demand_fealty_desc: "Những câu chuyện huyền thoại về chiến công quanh ta. Ngươi giờ không còn là phàm nhân nữa, ngươi là huyền thoại sống và tất cả phải cúi mình trước ngươi."
  legend_demand_fealty_tooltip: "$fifteen_year_vassalization_tt$"
  legend_demand_fealty_confirm: "Tất cả sẽ cúi mình trước ta."
  launch_a_legendary_adventure: "Khởi Xướng Cuộc Phiêu Lưu Huyền Thoại"
  launch_a_legendary_adventure_desc: "Dường như huyền thoại của ta tại đây đã kết thúc, nhưng ta vẫn khao khát những chiến công vĩ đại trước khi rời khỏi thế gian này. Chắc chắn còn nhiều nơi ngoài kia, và ta sẽ mang huyền thoại của mình tới những vùng đất xa xôi và thần thoại!"
  launch_a_legendary_adventure_tooltip: "$launch_a_legendary_adventure_tt$"
  launch_a_legendary_adventure_confirm: "Huyền thoại không bao giờ kết thúc!"
  legendary_integration_e: "Tôn Vinh Vương Quốc"
  legendary_integration_e_desc: "Huyền thoại được kể khắp vương quốc, củng cố quyền lực cai trị của ta. Lời ta là tuyệt đối, và nếu ta tuyên bố hai đế quốc là một, thì sẽ là như vậy."
  legendary_integration_e_tooltip: "$select_empire_to_drift_tt$"
  legendary_integration_e_confirm: "Ý ta sẽ được thực hiện."
  control_the_entirety_of_title_empire_tt: "Ngươi phải kiểm soát toàn bộ [empire|E]"
  legendary_integration_k: "Hợp Nhất Vương Quốc"
  legendary_integration_k_desc: "Huyền thoại được kể khắp vương quốc, củng cố quyền lực cai trị của ta. Lời ta là tuyệt đối, và nếu ta tuyên bố hai vương quốc là một, thì sẽ là như vậy."
  legendary_integration_k_tooltip: "$select_kingdom_to_drift_tt$"
  legendary_integration_k_confirm: "Ý ta sẽ được thực hiện."
  control_the_entirity_of_title_tt: "Ngươi phải kiểm soát toàn bộ [kingdom|E]"
  legendary_integration_d: "Mở Rộng Vương Quốc"
  legendary_integration_d_desc: "Huyền thoại được kể khắp vương quốc, củng cố quyền lực cai trị của ta. Uy tín mới này có thể được tận dụng để mở rộng lãnh thổ cốt lõi và yêu cầu sự thần phục vĩnh viễn từ một công tước vốn thuộc nước khác."
  legendary_integration_d_tooltip: "$select_duchy_to_drift_tt$"
  legendary_integration_d_confirm: "Ý ta sẽ được thực hiện."
  legendary_holy_war: "Khôi Phục Sứ Mệnh Thánh"
  legendary_holy_war_desc: "Huyền thoại về sự sùng đạo của ta đã kết thúc, mặc dù được tín đồ ca ngợi, nhưng ít thay đổi trái tim của kẻ không tin. Ta phải tiếp tục lan truyền cách sống hòa bình bằng cách duy nhất mà ta biết: bằng thanh kiếm."
  legendary_holy_war_tooltip: "$bonus_holy_war_tt$"
  legendary_holy_war_confirm: "Ngọn cờ chính nghĩa được giương lên!"
  legendary_pacifism_spread: "Truyền Bá Chủ Nghĩa Hòa Bình"
  legendary_pacifism_spread_desc: "Những câu chuyện đạo đức đã lan rộng vượt biên giới của ta, lay động trái tim kẻ ngoại đạo. Câu chuyện hòa bình của ta đe dọa những lãnh chúa tranh chấp gần biên giới, và chỉ với một đẩy nhẹ, họ sẽ nhận ra giá trị của cuộc sống phi bạo lực."
  legendary_pacifism_spread_tooltip: "$legendary_pacifism_spread_tt$"
  legendary_pacifism_spread_confirm: "Hòa bình sẽ chiến thắng!"
  legendary_conversion: "Truyền Giáo Cho Vương Quốc"
  legendary_conversion_desc: "Một câu chuyện huyền thoại về sự sùng đạo và tận tâm đã chinh phục trái tim mọi người trong vương quốc. Chỉ cần một chút khuyến khích, những kẻ không tin có thể được thuyết phục tôn thờ như ta."
  legendary_conversion_tooltip: "$legendary_conversion_tt$"
  legendary_conversion_confirm: "Đức tin chân chính sẽ chiến thắng."
  ce1_decision_events.1020.conversion: "[liege_convert.GetFirstName] Chuyển Đổi!"
  ce1_decision_events.1000.t: "Hợp Nhất Huyền Thoại"
  ce1_decision_events.1000.desc: "Là một [ROOT.Char.GetTitleAsNameNoTooltip|U] vĩ đại và nổi danh, ngươi nắm giữ nhiều danh hiệu trong vương quốc. Dù không phải tất cả đều là một phần [ROOT.Char.GetPrimaryTitle.GetName], nhưng việc quản lý chúng chắc chắn đã để lại dấu ấn.\n\nVới danh tiếng huyền thoại, lời ngươi có sức nặng lớn và ít ai dám phản bác. Nếu ngươi nói ngày là đêm, thì nó sẽ được viết như vậy. Cũng vậy, nếu ngươi nói [kingdom_01.GetName] là một phần chính đáng của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], nó cũng sẽ được ghi như vậy."
  ce1_decision_events.1000.a.empire: "[kingdom_01.GetNameNoTooltip] nay là [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
  ce1_decision_events.1000.a.kingdom: "[kingdom_01.GetNameNoTooltip] không còn tồn tại."
  ce1_decision_events.1000.b.empire: "[kingdom_02.GetNameNoTooltip] là bổ sung tuyệt vời cho đế quốc."
  ce1_decision_events.1000.b.kingdom: "[kingdom_02.GetNameNoTooltip] không còn là vương quốc thực sự."
  ce1_decision_events.1000.c.empire: "[kingdom_03.GetNameNoTooltip] là lựa chọn tốt hơn."
  ce1_decision_events.1000.c.kingdom: "[kingdom_03.GetNameNoTooltip] sẽ mãi là [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]."
  ce1_decision_events.1000.d: "Ta chọn [kingdom_04.GetNameNoTooltip]."
  ce1_decision_events.1000.e: "Ta không thể nghĩ ra bổ sung nào tốt hơn [kingdom_05.GetNameNoTooltip]."
  ce1_decision_events.1000.f: "[kingdom_06.GetNameNoTooltip] là lựa chọn."
  ce1_decision_events.1010.t: "$ce1_decision_events.1000.t$"
  ce1_decision_events.1010.desc: "Là một [ROOT.Char.GetTitleAsNameNoTooltip|U] nổi danh huyền thoại, tên tuổi ta được ca tụng khắp vương quốc và xa hơn nữa.\n\nMột số vùng đất như [duchy_01.GetName] có tương lai chưa chắc chắn, hoặc bên trong hoặc ngoài [ROOT.Char.GetPrimaryTitle.GetName], nhưng với uy tín đang ở đỉnh cao và trạng thái của các danh hiệu này còn chưa rõ, ta có thể dùng danh tiếng huyền thoại để quyết định một lần cho tất cả."
  ce1_decision_events.1010.a: "[duchy_01.GetNameNoTooltip] nay là [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
  ce1_decision_events.1010.b: "[duchy_02.GetNameNoTooltip] là bổ sung tuyệt vời cho vương quốc ta."
  ce1_decision_events.1010.c: "[duchy_03.GetNameNoTooltip] là lựa chọn tốt hơn."
  ce1_decision_events.1010.d: "Ta chọn [duchy_04.GetNameNoTooltip]."
  ce1_decision_events.1010.e: "Ta không thể nghĩ ra bổ sung nào tốt hơn [duchy_05.GetNameNoTooltip]."
  ce1_decision_events.1010.f: "[duchy_06.GetNameNoTooltip] là lựa chọn."
  ce1_decision_events.1015.t: "$ce1_decision_events.1000.t$"
  ce1_decision_events.1015.desc: "Là một [ROOT.Char.GetTitleAsNameNoTooltip|U] vĩ đại và nổi danh, ta nắm giữ nhiều danh hiệu trong vương quốc. Dù không phải tất cả đều là một phần [ROOT.Char.GetPrimaryTitle.GetName], nhưng quyền quản lý của ta chắc chắn đã để lại dấu ấn.\n\nVới danh tiếng huyền thoại, lời ta có trọng lượng lớn và ít ai dám phản bác. Nếu ta nói ngày là đêm, nó sẽ được ghi như vậy. Tương tự, nếu ta nói rằng [empire_01.GetDefinitiveName] là phần hợp pháp của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], thì nó sẽ được ghi như vậy."
  ce1_decision_events.1015.a: "[empire_01.GetNameNoTooltip] nay là [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
  ce1_decision_events.1015.b: "[empire_02.GetNameNoTooltip] là bổ sung tuyệt vời cho đế quốc."
  ce1_decision_events.1015.c: "[empire_03.GetNameNoTooltip] là lựa chọn tốt hơn."
  ce1_decision_events.1015.d: "Ta chọn [empire_04.GetNameNoTooltip]."
  ce1_decision_events.1015.e: "Ta không thể nghĩ ra bổ sung nào tốt hơn [empire_05.GetNameNoTooltip]."
  ce1_decision_events.1015.f: "[empire_06.GetNameNoTooltip] là lựa chọn."
  ce1_decision_events.1020.t: "Hòa Bình Thời Đại"
  ce1_decision_events.1020.desc: "Những câu chuyện về một chiến binh giải quyết xung đột không bằng kiếm, mà bằng lời nói và lý trí của [legendary_character.GetHerHis] đã trở nên phổ biến khắp vương quốc. Dù ta vẫn cầu nguyện với [ROOT.Char.GetFaith.HighGodName|U] theo cách truyền thống [ROOT.Char.GetFaith.GetName], nhưng không thể không cảm động phần nào bởi câu chuyện [legendary_character.GetFaith.GetName] này.\n\nHiện vương quốc ta đầy rẫy tin đồn về nhân vật huyền thoại này và sức mạnh hòa bình mà đức tin của [legendary_character.GetHerHis] đã mang lại cho [legendary_character.GetHerHim]. Một giáo sĩ [legendary_character.GetFaith.GetName] từ [legendary_character.GetPrimaryTitle.GetName] đến gặp ta tại triều đình, và đây có thể là cơ hội để ta chuyển sang con đường hòa bình hơn."
  ce1_decision_events.1020.a: "Ta đặt kiếm xuống."
  ce1_decision_events.1020.b: "Đuổi kẻ dị giáo này khỏi triều đình ta."
  ce1_decision_events.1021.t: "Chuyển Đổi Huyền Thoại"
  ce1_decision_events.1021.desc: "Những câu chuyện về chiến binh giải quyết xung đột không bằng kiếm, mà bằng lời nói và lý trí của [legendary_character.GetHerHis] đã trở nên nổi tiếng khắp vương quốc. [legendary_character.GetName|U] đã chạm đến trái tim nhiều người, kể cả [liege_convert.Custom2('MyCharacterIntroduction', ROOT.Char)]. [liege_convert.GetSheHe|U] đã chấp nhận đức tin [legendary_character.GetFaith.GetName], từ bỏ mọi ý nghĩ bạo lực và yêu cầu tất cả thần dân của [legendary_character.GetHerHis] cũng làm theo."
  ce1_decision_events.1021.a: "Hòa bình là lựa chọn duy nhất."
  ce1_decision_events.1021.b: "Hòa bình chưa bao giờ là lựa chọn."
  fifteen_year_vassalization_tt: "Ngươi sẽ có mười lăm năm quyền sử dụng Yêu Cầu Thần Phục [casus_belli|E]"
  select_empire_to_drift_tt: "Ngươi có thể chọn một [empire|E] để vĩnh viễn [de_jure_drift|E] vào vương quốc của ngươi. Đế quốc phải do ngươi nắm giữ hoặc đã có tiến trình drift vào một trong các danh hiệu ngươi đang giữ."
  select_kingdom_to_drift_tt: "Ngươi có thể chọn một [kingdom|E] để vĩnh viễn [de_jure_drift|E] vào vương quốc của ngươi. Vương quốc phải do ngươi nắm giữ hoặc đã có tiến trình drift vào một trong các danh hiệu ngươi đang giữ."
  select_duchy_to_drift_tt: "Ngươi có thể chọn một [duchy|E] để vĩnh viễn [de_jure_drift|E] vào vương quốc của ngươi. Công quốc phải do ngươi nắm giữ hoặc đã có tiến trình drift vào một trong các danh hiệu ngươi đang giữ."
  legendary_pacifism_spread_tt: "Tất cả các vương quốc láng giềng sẽ có cơ hội chuyển sang đức tin của ngươi."
  unlock_legendary_adventure_tt: "Nhận quyền truy cập #EMP $launch_a_legendary_adventure$#! [decision|E], cho phép ngươi rời bỏ vương quốc và bắt đầu cuộc sống mới ở [kingdom|E] xa xôi."
  unlock_legendary_fealty_tt: "Nhận quyền truy cập #EMP $legend_demand_fealty$#! [decision|E], cho phép ngươi khuất phục bất kỳ vương quốc gần đó."
  unlock_legendary_integration_d_tt: "Nhận quyền truy cập #EMP $legendary_integration_d$#! [decision|E], cho phép ngươi ngay lập tức [de_jure_drift|E] một danh hiệu [duchy|E] vào vương quốc của ngươi."
  unlock_legendary_integration_k_tt: "Nhận quyền truy cập #EMP $legendary_integration_k$#! [decision|E], cho phép ngươi ngay lập tức [de_jure_drift|E] một [kingdom|E] vào vương quốc của ngươi."
  unlock_legendary_integration_e_tt: "Nhận quyền truy cập #EMP $legendary_integration_e$#! [decision|E], cho phép ngươi ngay lập tức [de_jure_drift|E] một [empire|E] vào vương quốc của ngươi."
  unlock_legendary_conversion_tt: "Nhận quyền truy cập #EMP $legendary_conversion$#! [decision|E], ngay lập tức chuyển đổi một phần lớn [realm|E] sang [faith|E] của ngươi."
  unlock_legendary_pacifism_spread_tt: "Nhận quyền truy cập #EMP $legendary_pacifism_spread$#! [decision|E], cho phép ngươi truyền bá [faith|E] của mình sang các vương quốc láng giềng."
  unlock_legendary_holy_war_tt: "Nhận quyền truy cập #EMP $legendary_holy_war$#! [decision|E], cho phép sử dụng thêm một lần $major_religious_war$ [casus_belli|E]."
  non_true_faith_neighbour: "Ngươi phải có ít nhất một lãnh chúa láng giềng không theo [faith|E] của ngươi."
  leg_conv_valid_county: "Phải có ít nhất một [county|E] trong [realm|E] của ngươi chưa theo [faith|E] của ngươi."
  every_same_faith_vassal: "Tất cả [vassal|E] của [faith|E] ngươi"
  every_same_faith_county_in_realm: "Tất cả [county|E] trong [realm|E] của ngươi theo [faith|E]"
