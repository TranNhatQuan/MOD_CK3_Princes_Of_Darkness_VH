l_english:
  physician_epidemic_events.1000.t: "Phương Pháp Điều Trị Dị Thường"
  physician_epidemic_events.1000.desc: "[physician.Custom2('MyCharacterIntroduction', ROOT.Char)] của ta và [zealous_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] đang cãi vã gay gắt về cách xử lý [epidemic_scope.GetName] đang lan rộng.\n\n\"Ta là thầy thuốc!\" Talāra khăng khăng. \"Hãy để ta thanh trừ dịch bệnh này!\"\n\n\"Dị giáo!\" Mahakala gầm gừ. \"Chúng ta phải xức dầu cho người chết và ban cho họ các nghi lễ [zealous_courtier.GetFaith.GetAdjective] đúng đắn.\""
  physician_epidemic_events.1000.a: "Có lẽ ta chỉ nên giữ các thi thể tránh xa người sống."
  physician_epidemic_events.1000.b: "Chúng ta phải làm mọi thứ có thể để chấm dứt dịch bệnh này."
  physician_epidemic_events.1000.b.success: "Phương pháp điều trị có hiệu quả"
  physician_epidemic_events.1000.b.failure: "Phương pháp điều trị thất bại"
  physician_epidemic_events.1000.c: "Chúng ta sẽ không làm ô uế những thi thể này."
  physician_epidemic_events.1010.t: "Cách Ly"
  physician_epidemic_events.1010.desc: "Khi [epidemic_scope.GetName] lan rộng, [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] của ta đề xuất một biện pháp quyết liệt: phong tỏa người bệnh. \"Khí độc bám vào thi thể,\" [physician.GetSheHe] cảnh báo, \"và không khí ô nhiễm nuôi dưỡng dịch bệnh.\"\n\n[physician.GetSheHe|U] muốn cách ly — không ai được ra vào các vùng đất bị nhiễm bệnh.\n\n\"Trong thời khắc tuyệt vọng, thưa Hoàng đế, chúng ta phải làm điều cần làm.\""
  physician_epidemic_events.1010.a: "Phong tỏa đường sá. Cách ly người bệnh."
  physician_epidemic_events.1010.b: "Việc này quá cực đoan."
  physician_epidemic_events.1020.t: "[epidemic.GetNameNoTooltip|U]: Phòng Ngừa Sớm"
  physician_epidemic_events.1020.start.desc: "Ánh sáng mờ nhạt, chập chờn trong phòng y xá của [physician.GetFirstNamePossessive] soi rõ khung cảnh khi vị thầy thuốc trình bày kế hoạch hành động.\n\n\"Những người mắc [epidemic.GetName] đang\""
  missing_epidemic: "quằn quại trong đau đớn"
  physician_epidemic_events.1020.start.desc2: "theo cách mà ta chưa từng thấy trước đây."
  physician_epidemic_events.1020.safe_recommendation.desc: "Với tư cách một chuyên gia, ta khuyến nghị áp dụng biện pháp nhẹ nhàng để ngăn chặn sự lây lan. Dù sao đi nữa, chúng ta cũng không muốn làm tổn hại nền kinh tế.\""
  physician_epidemic_events.1020.risky_recommendation.desc: "Dịch bệnh này có nguy cơ làm mất ổn định toàn bộ lãnh thổ; dân chúng và mùa màng sẽ bị tàn phá nếu chúng ta không hành động quyết liệt.\""
  physician_epidemic_events.1020.mystic_recommendation.desc: "Dịch bệnh này do [physician.GetFaith.DevilName] giáng xuống, và chỉ bằng cách vượt ra ngoài khuôn khổ y học truyền thống thì chúng ta mới có hy vọng hóa giải lời nguyền này!\""
  physician_epidemic_events.1020.end.desc: "\n\nCuối cùng, chiến lược chính xác để ngăn chặn sự lây lan của dịch bệnh này là do ta quyết định."
  physician_epidemic_events.1020.a: "Tiếp cận nhẹ nhàng là tốt nhất."
  physician_epidemic_events.1020.b: "Cần những biện pháp tuyệt vọng."
  physician_epidemic_events.1020.c: "Bất kể cần đến những thực hành huyền bí nào, chúng ta cũng sẽ làm."
  physician_epidemic_events.1020.d: "Hành động tốt nhất là không hành động."
  physician_epidemic_events.1021.t: "Phòng Ngừa Sớm: Thành Công"
  physician_epidemic_events.1021.desc: "Có vẻ như cách tiếp cận ôn hòa đã chứng tỏ hiệu quả, khi sự lan rộng của các triệu chứng bệnh trong dân thường chậm lại. Dù tác động khá hạn chế, ít nhất nó cũng giúp chúng ta có thêm thời gian để tìm ra một giải pháp lâu dài hơn."
  physician_epidemic_events.1021.a: "Tuyệt vời!"
  physician_epidemic_events.1022.t: "Phòng Ngừa Sớm: Thất Bại"
  physician_epidemic_events.1022.desc: "Không những các biện pháp phòng ngừa của [physician.GetNamePossessive] thất bại, chúng dường như còn kích thích các thể dịch, khiến sự mục rữa vừa lây lan nhanh hơn vừa nghiêm trọng hơn."
  physician_epidemic_events.1023.t: "$physician_epidemic_events.1021.t$"
  physician_epidemic_events.1023.desc: "Dịch bệnh vốn được dự đoán sẽ lan khắp lãnh thổ ta nhanh như lửa gặp giấy nay đã chậm lại rõ rệt. Các biện pháp cấp tiến do [physician.GetFirstName] đề xuất đã gây tổn hại kinh tế trong ngắn hạn, nhưng [epidemic.GetName] có lẽ không còn là mối đe dọa khủng khiếp như chúng ta từng lo sợ."
  physician_epidemic_events.1023.a: "$physician_epidemic_events.1021.a$"
  physician_epidemic_events.1024.t: "$physician_epidemic_events.1022.t$"
  physician_epidemic_events.1024.desc: "Ngoài việc gây tổn thất nghiêm trọng cho nền kinh tế, các phương pháp điều trị của [physician.GetNamePossessive] còn khiến vô số sinh mạng bị cướp đi. Những người nông dân, vốn đã suy yếu vì bệnh tật, không thể chịu nổi việc trích máu và đỉa hút. Cái chết này dường như còn làm dịch bệnh lan rộng hơn, khi khí độc bám vào thi thể và xâm nhập vào phổi của người khỏe mạnh."
  physician_epidemic_events.1025.t: "$physician_epidemic_events.1021.t$"
  physician_epidemic_events.1025.desc: "Bị nhiều người lên án là dị giáo, các phương pháp điều trị của [physician.GetNamePossessive] dường như lại hoạt động khá hiệu quả trong việc làm chậm sự lây lan của dịch bệnh. Các bài tập để toát mồ hôi đẩy lùi sự mục rữa, trích máu để giải phóng thể dịch xấu, và thanh tẩy kỹ lưỡng để ngăn khí độc tích tụ có vẻ chính là điều cần thiết để ngăn chặn [epidemic.GetName]!"
  physician_epidemic_events.1025.a: "$physician_epidemic_events.1021.a$"
  physician_epidemic_events.1026.t: "$physician_epidemic_events.1022.t$"
  physician_epidemic_events.1026.desc: "Ta đã mạo hiểm khi chấp thuận các phương pháp điều trị dị giáo do [physician.GetName] đề xuất, một hành động dường như đã khiến [ROOT.Char.GetFaith.HighGodName] vô cùng phẫn nộ. Giờ đây ta đang bị trừng phạt bằng máu của chính thần dân mình, khi các phương pháp của [physician.GetNamePossessiveNoTooltip] khiến người bệnh kiệt quệ và không còn giọt máu nào trên đường phố. Những 'phương thuốc' xa lạ và chưa được kiểm chứng bị ép xuống cổ họng họ trước khi máu bị rút cạn và cơ thể bị vắt kiệt. Một cảnh tượng kinh hoàng đối với bất kỳ ai chứng kiến, và là một cách đối xử thực sự ghê tởm với người sắp chết."
  physician_epidemic_events.1030.t: "Tập Sách Dược Phẩm"
  physician_epidemic_events.1030.desc: "Ngự y của ta tiến đến, tay cầm sách và đôi mắt sáng lên đầy quyết tâm.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], ta đã nghiên cứu nhiều phương thuốc được cho là chữa được [epidemic_scope.GetName]. Với sự bảo trợ của ngài, ta có thể biên soạn một cuốn sách ghi lại những phát hiện của mình — một món quà cho các thế hệ tương lai.\""
  physician_epidemic_events.1030.a: "Được thôi."
  physician_epidemic_events.1030.a.failure: "Cuốn sách hoàn toàn là nhảm nhí"
  physician_epidemic_events.1030.a.success: "Một cuốn sách dược học vĩ đại được biên soạn"
  physician_epidemic_events.1030.b: "Nghe như một sự lãng phí tiền bạc."
  physician_epidemic_events.1040.t: "Bố Thí"
  physician_epidemic_events.1040.desc: "Ngự y của ta cúi mình thật thấp trước khi lên tiếng.\n\n\"Thưa Công tước, việc chăm sóc người bệnh đã làm cạn kiệt nguồn lực của chúng ta — và dân chúng thì rỉ tai nhau rằng vương quyền không còn quan tâm. Nếu ngài tự tay ban phúc cho tiền xu và phân phát chúng, điều đó có thể xoa dịu sự phẫn nộ của họ. Người ta nói, cái chạm của bậc quân vương mang lại sự chữa lành.\""
  physician_epidemic_events.1040.a: "Hãy để họ cảm nhận sự chạm tay của hoàng gia."
  physician_epidemic_events.1040.b: "Để các giáo sĩ lo cho người nghèo."
  physician_epidemic_events.1050.t: "Quán Trọ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|U]"
  physician_epidemic_events.1050.desc: "Vệ binh kéo [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] đến trước mặt ta trong xiềng xích. [physician.GetSheHe] đã chữa trị cho binh lính bị thương — cả Ngài lẫn thù — sau mỗi trận chiến.\n\nHọ gọi nơi trú ẩn của [physician.GetHerHis] là \"Quán Trọ [ROOT.Char.GetPrimaryTitle.GetAdjective|U]\", và các chỉ huy của ta yêu cầu đóng cửa nó. Nhưng Edaraja chỉ nói: \"Họ chảy máu và đau đớn như người của chúng ta. Ta là ai mà từ chối họ?\""
  physician_epidemic_events.1050.a: "[physician.GetSheHe|U] được phép tiếp tục."
  physician_epidemic_events.1050.b: "Ngươi chỉ phục vụ #EMP ta!#!"
  physician_epidemic_events.1060.t: "Lưu Đày Trong Tuyệt Vọng"
  physician_epidemic_events.1060.desc: "[gross_sick_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nằm tái nhợt và thở khò khè. Dịch bệnh đã xâm nhập ngay cả vào đại sảnh của ta.\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] thúc giục hành động quyết liệt: \"Những kẻ đã mắc bệnh phải bị đưa đi, thưa bệ hạ — nếu không, chúng ta sẽ mất tất cả.\"\n\nĐó là một ý nghĩ tàn nhẫn. Nhưng chờ đợi thì có tàn nhẫn hơn không?"
  physician_epidemic_events.1060.a: "Tống tất cả bọn họ ra ngoài ngay lập tức!"
  physician_epidemic_events.1060.b: "Thật là một đề xuất thô bạo."

  every_infected_courtier_or_guest: "Mọi cận thần hoặc khách bị nhiễm bệnh"
  every_uninfected_courtier_or_guest: "Mọi cận thần hoặc khách khỏe mạnh"

  may_get_cool_book_tt: "Ngài có thể nhận được một [artifact|E]"
  book_is_gibberish: "Cuốn sách hoàn toàn vô nghĩa"
  minor_epidemic_treatment.tt: "Ngài chọn phương pháp điều trị an toàn"
  moderate_epidemic_treatment.tt: "Ngài chọn phương pháp điều trị rủi ro hơn"
  mystic_epidemic_treatment.tt: "Ngài chọn phương pháp điều trị huyền bí"

  rival_prevented_from_protecting_sick: "[TARGET_CHARACTER.GetShortUIName|U] đã ngăn [CHARACTER.GetShortUIName] cung cấp điều trị y tế cho các chiến binh đối địch"
  rival_prevented_from_protecting_sick_corresponding: "[CHARACTER.GetShortUIName|U] đã ngăn [TARGET_CHARACTER.GetShortUIName] cung cấp điều trị y tế cho các chiến binh đối địch"
  rival_heretical_physician: "[CHARACTER.GetShortUIName|U] nổi giận với [TARGET_CHARACTER.GetShortUIName] khi một phương pháp điều trị dịch bệnh dị giáo được cho phép tiến hành"
  rival_heretical_physician_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] nổi giận với [CHARACTER.GetShortUIName] khi một phương pháp điều trị dịch bệnh dị giáo được cho phép tiến hành"

  pharmaceuticals: "Dược Phẩm Theo [physician.GetFirstName]"
  pharmaceuticals_desc: "Một tuyển tập các phương thuốc thảo dược và những biện pháp điều trị bệnh tật cấp tiến cho nhiều tình trạng khác nhau, với trọng tâm đặc biệt là tác động của [epidemic_scope.GetName]."
