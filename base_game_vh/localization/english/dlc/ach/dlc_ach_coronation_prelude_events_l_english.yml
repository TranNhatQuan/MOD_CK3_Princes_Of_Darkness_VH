  prelude_events.0190.t: "Những Lời Động Viên"
  prelude_events.0190.desc.intro: "Ngọn lửa trong lò sưởi nhảy múa như một [ROOT.Char.Custom('GetMedievalDance')]. Cánh cửa phòng Ta bất ngờ mở ra và Ta nghe thấy một giọng nói quen thuộc gọi tên mình.\n\n"
  prelude_events.0190.desc.spouse: "\"[ROOT.Char.Custom('WifeHusband')] thân yêu,\" giọng của [councillor.GetFirstNamePossessive] nhẹ nhàng và trầm tĩnh."
  prelude_events.0190.desc.other: "\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] của Ta — [councillor.GetFirstName] — bắt đầu."
  prelude_events.0190.desc.outro: ""Ta biết ngày đó đang đến gần, ngày mà ngài sẽ nhìn vào hình ảnh phản chiếu của mình trên lớp kim loại lạnh lẽo và tự hỏi liệu mình có đang làm điều đúng đắn hay không. Hãy để mọi người biết, hãy để tiếng nói này vang lên từ mọi góc của thành trì này, ta sẽ luôn đứng bên cạnh ngài."\n\n[councillor.GetSheHe|U] lấy ra một món quà nhỏ từ túi của [councillor.GetHerHis]. "Ta đã cho chế tác món này dành tặng ngài.""
  prelude_events.0190.a: "\"Đây là nhiều hơn những gì ta có thể mong đợi.\""
  prelude_events.0190.b: "\"[councillor.GetFirstNameNoTooltip]... cảm ơn.\""
  prelude_events.0190.c: "Ta cảm thấy bình tâm hơn."
  artifact_coronation_gift_desc: "[newly_created_artifact.GetDesc]\n\nMột món quà từ [councillor.GetShortUIName] vào đêm trước lễ đăng quang của [root_scope.GetShortUINamePossessive]."
  lover_bestie_coronation_vespers: "[TARGET_CHARACTER.GetShortUIName|U] đã chân thành an ủi [CHARACTER.GetShortUIName] vào đêm trước lễ đăng quang của [CHARACTER.GetShortUINamePossessiveNoTooltip]."
