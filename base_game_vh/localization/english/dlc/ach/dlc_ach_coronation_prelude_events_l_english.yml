l_english: 
  prelude_events.0001.t: "Một Bàn Tay Giúp Đỡ"
  prelude_events.0001.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] [ROOT.Char.GetTitledFirstName], Ta đã nghe từ chính miệng vị nhiếp chính đáng kính [regent.GetTitledFirstName], nhiếp chính trung thành của ngài, rằng ngài là người đầy triển vọng." [guest.GetShortUIName] nói, [guest.Custom('quirk_pos_pp')]. "[guest.Custom2('DescriptorPositive', ROOT.Char)|U] và [guest.Custom2('DescriptorPositive', ROOT.Char)], [ROOT.Char.GetTitleAsNameNoTooltip] tuyệt vời nhất mà chúng ta từng có thể hy vọng!""
  prelude_events.0001.a: ""Thật tuyệt vời! [regent.GetSheHe|U] đang làm hết mọi việc thay ta!""
  prelude_events.0001.b: ""Ta vui vẻ chấp nhận món quà của ngài.""
  prelude_events.0001.b.tt.supporter: "[guest.GetShortUIName] trở thành #high Người Ủng Hộ#! của Ngài"
  prelude_events.0001.c.tt.every_supporter: "Ngài nhận được [prestige_i]#P 20#! cho mỗi $every_supporter$"
  prelude_events.0001.c: ""Hãy lan truyền tin này!""
  prelude_events.0001.c.opinion: "$every_detractor$ nhận #P 10#! [opinion|E] với Ngài #weak (-1.20/năm) (Tôn Trọng)#!"
  every_supporter: "Mỗi [coronation_supporter|E] ([THIS.ScriptValue('number_of_supporters_activity')|V0])"
  every_supporter_activity: "Mỗi [coronation_supporter|E] ([THIS.ScriptValue('number_of_supporters_activity')|V0])"
  every_detractor: "Mỗi [coronation_detractor|E] ([THIS.ScriptValue('number_of_detractors_activity')|V0])"
  every_detractor_activity: "Mỗi [coronation_detractor|E] ([THIS.ScriptValue('number_of_detractors_activity')|V0])"
  silent_coronation_modifier: "Lễ Đăng Quang Thầm Lặng"
  silent_coronation_modifier_desc: "Nhân vật này để hành động của mình tự lên tiếng."
 
  prelude_events.0010.t: "Tin Tức Từ Quê Nhà"
  prelude_events.0010.desc: ""Ngươi đã nghe tin tức về [ROOT.Char.GetTitledFirstName] đáng kính của chúng ta chưa?" [guest.GetTitledFirstName] gần như không thể che giấu niềm vui của [guest.GetHerHis] khi nói chuyện với [guest_2.GetTitledFirstName].\n\n"Người ta nói rằng chính Nhiếp chính [regent.GetTitledFirstName] của [ROOT.Char.GetHerHis] đã tiết lộ rằng [ROOT.Char.GetSheHe] gần như không thể tỉnh táo trong các buổi họp hội đồng. Vậy làm sao [ROOT.Char.GetSheHe] có thể cai trị vương quốc này khi ngay cả bản thân [ROOT.Char.GetHerselfHimself] còn không thể tự quản lý được?""
  prelude_events.0010.a: "Ta #EMP đã biết#! [regent.GetTitledFirstNameNoTooltip] đang âm mưu chống lại ta!"
  prelude_events.0010.b: "Ta sẽ cho người thâm nhập triều đình của [guest.GetFirstNamePossessiveNoTooltip]."
  prelude_events.0010.c: "Chúng ta phải đánh bại [guest.GetHerHim] từ bên trong."
  prelude_events.0010.c.tt.success: "Điệp viên của Ngài thâm nhập triều đình"
  prelude_events.0010.c.tt.failure: "Điệp viên của Ngài không thể xâm nhập"
  prelude_events.0010.d: ""Chúng ta đều đồng ý rằng ngươi không nghe thấy gì...""
  prelude_events.0010.d.supporter.tt: "[guest.GetShortUIName] không còn là #high Kẻ Chống Đối#! và trở thành #high Người Ủng Hộ#!"
  prelude_events.0010.e: "[regent.GetFirstNameNoTooltip] có thể nói bất cứ điều gì [regent.GetSheHe] muốn."

  prelude_events.0020.t: "Những Kẻ Âm Mưu Trong Triều"
  prelude_events.0020.desc.intro: ""...khi quyền cai trị của [ROOT.Char.GetHerHis] suy yếu, cái đầu chưa được đội vương miện của [ROOT.Char.GetHerHis] sẽ mãi mãi như vậy." [faction_member.GetTitledFirstName] ghé sát lại gần [faction_member_2.GetTitledFirstName]. "Lễ đăng quang này là nơi hoàn hảo để tìm kiếm những quý tộc xứng đáng có cùng suy nghĩ với chúng ta."\n\nDĩ nhiên ta hoàn toàn nhận thức được ý đồ của những..."
  prelude_events.0020.desc.faction_member: "[faction.GetName], do [faction_member.GetTitledFirstNameNoTooltip] [faction_member.GetHerselfHimself] lãnh đạo."
  prelude_events.0020.desc.faction_member_2: "[faction.GetName], do [faction_member_2.GetTitledFirstNameNoTooltip] [faction_member_2.GetHerselfHimself] lãnh đạo."
  prelude_events.0020.desc.no_leader: "[faction.GetName]."
  prelude_events.0020.desc.outro: "Nếu chúng muốn thấy ta không được đội vương miện, thì chúng sẽ phải #EMP chém đầu#! ta."
  prelude_events.0020.a: ""Ngươi đang nói đến phản nghịch sao?""
  prelude_events.0020.b: ""Ta có tai mắt ở khắp mọi nơi, [faction_member.GetTitledFirstNameNoTooltip].""
  prelude_events.0020.b.tt.success: "[faction_member.GetShortUIName] bị uy hiếp"
  prelude_events.0020.b.tt.failure: "[faction_member.GetShortUIName] vẫn thờ ơ"
  prelude_events.0020.c: ""Lòng trung thành của ngươi là #EMP vô giá#! đối với ta.""
  prelude_events.0020.d: "Cứ để chúng nói."
 
  coronation_events.3001.opening: "Gửi đến [ROOT.Char.GetTitledFirstNameNoTooltip] hay quên,"
  coronation_events.3001.desc: "Một số chư hầu trung thành của ngài nhận thấy rằng các sứ giả mang thư mời đến lễ đăng quang của ngài đã bị thất lạc trên đường tới triều đình chúng Ta.\n\nChúng Ta không muốn bỏ lỡ dịp trọng đại này."
  coronation_events.3001.a: "Cảm ơn đã nhắc nhở."
  coronation_events.3001.b: "Không hề có sai sót nào."
  not_invited_coronation_opinion: "Không Được Mời Dự Lễ Đăng Quang"
 
  prelude_events.0030.t: "Thật Vui Khi Gặp Ngài"
  prelude_events.0030.desc.intro: "Sân trong của [activity.GetCurrentPhase.GetLocation.GetName] tỏa sáng trong ánh vàng rực rỡ. Một làn gió khẽ lay động tán lá khi các vị khách tản bộ phía dưới.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]!\" Ta quay lại và thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của mình, [guest.GetFirstName], đang gọi tên Ta."
  prelude_events.0030.desc.lover: "Vẫn xinh đẹp như ngày nào, [guest.GetSheHe] tiến về phía ta. \"Ta đã hy vọng ngài sẽ ở đây,\" [guest.GetSheHe] mỉm cười đầy quyến rũ."
  prelude_events.0030.desc.friend: "Với nụ cười rạng rỡ, [guest.GetSheHe] gần như chạy về phía Ta. \"Ngài ơi!\" [guest.GetSheHe|U] gọi lớn, \"Thật vui khi gặp lại ngươi!\""
  prelude_events.0030.a: ""Ta nghe nói chuồng ngựa là nơi vô cùng lãng mạn.""
  prelude_events.0030.b: ""[guest.GetFirstNameNoTooltip], nếu ta có thể nhờ ngươi một việc...""
  prelude_events.0030.c: "$prelude_events.0030.b$"
  prelude_events.0030.d: ""Ta thấy ở đây có vài loại [ROOT.Char.Custom('GetExpensiveDrink_Singular')] khá ngon.""
  prelude_events.0030.e: "Luôn thật vui khi gặp lại một gương mặt quen thuộc."
  lover_coronation_prelude_sneak_out: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã lén ra chuồng ngựa trước lễ đăng quang"
  lover_coronation_prelude_sneak_out_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] đã lén ra chuồng ngựa trước lễ đăng quang"
  every_party_character: "Mỗi vị khách có đặc điểm [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )], [GetTrait('gregarious').GetName( GetNullCharacter )] hoặc [GetTrait('drunkard').GetName( GetNullCharacter )]"
 
  prelude_events.0040.t: "Không Phải Ngươi"
  prelude_events.0040.desc: "Ngày hôm đó vốn dĩ quá đỗi dễ chịu, vậy mà lại bị phá hỏng bởi hình ảnh của [guest.Custom2('InsultAdjective', ROOT.Char)] [guest.GetTitledFirstName], kẻ thù đáng ghét của ta.\n\n\"Ồ, [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip],\" [guest.GetSheHe] giả vờ không thấy ta cho đến khi Ta đứng sát bên [guest.GetHerHim]. \"Ngài định mua vui cho chúng ta trong bữa tối chứ? Hay đó là bộ đồ mà một [ROOT.Char.GetTitleAsNameNoTooltip] mang đến lễ đăng quang?\""
  prelude_events.0040.a: "[guest.GetSheHe|U] sẽ không còn nói nhiều như vậy khi ta xong việc."
  prelude_events.0040.b: ""Ta lấy cảm hứng từ mẹ của ngươi.""
  prelude_events.0040.c: "Ta sẽ lắng nghe từng lời mà [guest.GetFirstNameNoTooltip] nói tại đây."
  prelude_events.0040.c.tt: "[scheme|E] sẽ có #P tăng#! [success_chance|E]"
  prelude_events.0040.d: ""Đây không phải nơi để cãi vã.""
  every_callous_vengeful_wrathful_guest: "Mỗi vị khách có đặc điểm [GetTrait('callous').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] hoặc [GetTrait('wrathful').GetName( GetNullCharacter )]"
 
  prelude_events.0050.t: "Gương Mặt Quen Thuộc"
  prelude_events.0050.desc.intro: "Sân trong ngập tràn hoa cỏ, khách khứa cười nói nôn nóng, [ROOT.Char.Custom('GetIncidentalDetail')].\n\n\"[guest.Custom2('RelationToMe', SCOPE.sC('root_scope'))|U]!\""
  prelude_events.0050.desc.callous: "khó ưa"
  prelude_events.0050.desc.normal: "thân mến"
  prelude_events.0050.desc.outro: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetFirstName] gọi Ta. \"Ai ở đây cũng đang âm mưu hoặc say xỉn,\" [guest.GetSheHe] thì thầm, \"Ta nhớ ngươi.\""
  prelude_events.0050.a: ""Ta không thể đáp lại tình cảm đó.""
  prelude_events.0050.b: ""Hãy để nhà [ROOT.Char.GetHouse.GetNameNoTooltip] của chúng ta sát cánh bên nhau.""
  prelude_events.0050.c: ""Vậy ngươi nghĩ gì về chủ nhân buổi tiệc, [host.GetLadyLord] [host.GetFirstNameNoTooltip]?""
  prelude_events.0050.d: ""Nhìn ngươi kìa! Kết hôn với chính [host.GetHerselfHimself] được đội vương miện!""
 
  prelude_events.0060.t: "[province.GetNameNoTooltip] Tuyệt Mỹ"
  prelude_events.0060.desc: ""Ta phải nói rằng những gì ngươi đạt được chỉ với chút [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')] thật đáng ấn tượng, [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]." [host.GetTitledFirstName] [host.Custom('quirk_pos_present')].\n\n"Ta nghe rằng [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] phồn thịnh dưới bàn tay dẫn dắt của ngươi, [ROOT.Char.GetCapitalLocation.GetHolding.GetType.GetName|l] được quản lý ngăn nắp và chu đáo. Nhưng ta thấy nét u sầu trên gương mặt ngươi, [ROOT.Char.GetTitleAsNameNoTooltip|l], điều gì đang khiến ngươi lo lắng?""
  prelude_events.0060.a: ""Đó là niềm vui! Tất cả là nhờ sự giúp đỡ hào hiệp của ngài.""
  prelude_events.0060.b: ""Nếu ngài có thể cho ta mượn vài thợ thủ công từ kinh đô...""
  prelude_events.0060.c: ""Chính vàng bạc đang kìm hãm sự phát triển của chúng ta.""
  prelude_events.0060.c.tt.success: "[host.GetShortUIName] đồng ý với các yêu cầu"
  prelude_events.0060.c.tt.failure: "[host.GetShortUIName] cho rằng các yêu cầu là quá đáng"
  prelude_events.0060.d: ""Hôm nay không phải ngày của ta, [host.GetTitleAsNameNoTooltip].""
  bp4_advocate_domain_construction_county_modifier: "Thợ Xây Hoàng Gia"
  friend_coronation_support: "[CHARACTER.GetShortUIName|U] đã dành sự ủng hộ của [CHARACTER.GetHerHis] cho [TARGET_CHARACTER.GetShortUIName] trong lễ đăng quang của [TARGET_CHARACTER.GetHerHis] và không đòi hỏi gì đáp lại."
  friend_coronation_support_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã dành sự ủng hộ của [TARGET_CHARACTER.GetHerHis] cho [CHARACTER.GetShortUIName] trong lễ đăng quang của [CHARACTER.GetHerHis] và không đòi hỏi gì đáp lại."
  friend_coronation_ambitious: "[CHARACTER.GetShortUIName|U] đã dành vô số lời khen cho [TARGET_CHARACTER.GetShortUIName] trong lễ đăng quang của [TARGET_CHARACTER.GetHerHis]."
  friend_coronation_ambitious_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã dành vô số lời khen cho [CHARACTER.GetShortUIName] trong lễ đăng quang của [CHARACTER.GetHerHis]."
  supporter_hook: "Người Ủng Hộ"
  bp4_advocate_domain_construction_county_modifier_desc: "Chủ sở hữu quận này đã hy sinh một phần danh dự để đổi lấy sự hỗ trợ xây dựng từ một vị quân vương mới đăng quang."
 
  prelude_events.0070.t: "Một Lời Đề Nghị Nơi Triều Đình"
  prelude_events.0070.desc.intro: "Một con [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] nhỏ lẩn giữa chân các vị khách khiến vài người bật cười, bao gồm cả quân chủ của ta và lý do cho buổi tụ họp này, [host.GetTitledFirstName].\n\n\"[ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip],\" [host.GetSheHe] gọi tên Ta, vẫn nở nụ cười."
  prelude_events.0070.desc.friend: ""Ngươi biết tình bằng hữu của chúng ta quý giá với ta thế nào, và ta không mong gì hơn ngoài việc được nghe lời khuyên của ngươi. Ta khẩn cầu ngươi, hãy ngồi cạnh ta.""
  prelude_events.0070.desc.diplomacy: ""Ta nghe rằng kỹ năng ngoại giao của ngươi là vô song.""
  prelude_events.0070.desc.stewardship: ""Ta nhận thấy ngươi cai trị lãnh thổ của mình với hiệu quả đáng kinh ngạc, bàn tay không thể nhầm lẫn của một quan quản trị.""
  prelude_events.0070.desc.intrigue: ""Người ta nói rằng không người tình nào an toàn, không kẻ tội lỗi nào được tự do, không bí mật nào thực sự được che giấu khi ngươi còn hiện diện.""
  prelude_events.0070.desc.learning: ""Các cận thần của ta nói rằng không có văn bản cổ nào ngươi không thể đọc, không tác giả lừng danh nào ngươi không thể giải nghĩa.""
  prelude_events.0070.desc.martial: ""Ta được kể rằng những mưu lược xuất chúng của ngươi luôn mang lại chiến thắng, kể cả trong thời khắc hiểm nghèo nhất.""
  prelude_events.0070.desc.outro: "Ta không cần gì hơn một [ROOT.Char.GetWomanMan] tài năng trong hội đồng của mình.""
  prelude_events.0070.a: ""Ta phải tập trung vào... lãnh thổ của mình.""
  prelude_events.0070.a.flavor: "Hay là bản thân ta thì đúng hơn."
  prelude_events.0070.b: ""Ta rất vinh dự được sát cánh cùng ngài.""
  prelude_events.0070.c: ""Ta không có thời gian cho việc này.""
  bp4_lazy_realm_focus_modifier: "An Nhàn Nơi Quê Nhà"
  bp4_lazy_realm_focus_modifier_desc: "Nhân vật này đã từ chối lời mời gia nhập hội đồng để tập trung vào lãnh thổ của mình... ít nhất là theo lời họ nói."
 
  prelude_events.0080.t: "Hãy Nhận Lấy Điều Tốt Nhất"
  prelude_events.0080.desc.intro: ""Kính chào [ROOT.Char.GetTitleAsNameNoTooltip]," Ta quay lại và thấy [guest.GetTitledFirstName] đứng cạnh một [courtier.GetWomanMan] có vẻ căng thẳng. "Ngài biết ta trân quý ngài đến mức nào, và sẽ là niềm vui lớn nếu ta có thể giúp đỡ ngài."\n\n"Vì vậy, ta xin dâng lên ngài người đầu tiên và xuất sắc nhất trong số [courtier.GetWomenMen] của ta, [courtier.GetFirstName], [guest.Custom2('RelationToMe', SCOPE.sC('courtier'))] tài năng của ta. Mong rằng điều này sẽ là"
  prelude_events.0080.desc.same_house: "một dấu hiệu của tình bằng hữu trong cùng gia tộc chúng ta.""
  prelude_events.0080.desc.fallback: "khởi đầu cho tình bằng hữu giữa hai gia tộc.""
  prelude_events.0080.desc.friend: "một dấu hiệu cho tình bằng hữu của chúng ta.""
  prelude_events.0080.aa: ""Ngươi nghĩ ta không nhận ra gián điệp sao?""
  prelude_events.0080.a: ""Ta biết chính xác [courtier.GetSheHe] nên làm gì.""
  prelude_events.0080.b: ""[courtier.GetFirstNameNoTooltip] được chào đón tại triều đình của ta.""
  prelude_events.0080.c: ""Ít ai hào phóng như ngài, [guest.GetTitleAsNameNoTooltip].""
  friend_coronation_offered_courtier: "[TARGET_CHARACTER.GetShortUIName|U] đã hào hiệp dâng tặng một cận thần tài năng cho [CHARACTER.GetShortUIName] trong lễ đăng quang."
  friend_coronation_offered_courtier_corresponding: "[CHARACTER.GetShortUIName|U] đã hào hiệp dâng tặng một cận thần tài năng cho [TARGET_CHARACTER.GetShortUIName] trong lễ đăng quang."
  rival_rejected_courtier_paranoid: "[CHARACTER.GetShortUIName|U] đã từ chối sủng thần của [TARGET_CHARACTER.GetShortUINamePossessive] và buộc tội người đó là gián điệp."
  rival_rejected_courtier_paranoid_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã từ chối sủng thần của [CHARACTER.GetShortUINamePossessive] và buộc tội người đó là gián điệp."
  bp4_paranoid_measures_modifier: "Biện Pháp Đa Nghi"
  bp4_paranoid_measures_modifier_desc: "Nhân vật này đã tăng cường cảnh giác sau khi được đề nghị tiếp nhận một cận thần khả nghi"
 
  prelude_events.0090.t: "Xứng Tầm Một [ROOT.Char.GetTitleAsNameNoTooltip]"
  prelude_events.0090.desc.intro: ""Từ từ thôi!" Ta nghe thấy giọng của một [guest.GetWomanMan] và quay lại, bắt gặp [guest.GetTitledFirstName] đang nhẹ nhàng vỗ vào hông con ngựa của [guest.GetHerHis].\n\n"
  prelude_events.0090.desc.blood_brother: "Một người bạn không ai sánh bằng mà ta từng có, ta gần như không thể kìm được nụ cười khi [guest.GetSheHe] dang rộng vòng tay chào đón ta."
  prelude_events.0090.desc.bad_opinion: "Tên [guest.Custom('InsultAdjective')] [guest.Custom('InsultNoun')] này bằng cách nào đó lại xuất hiện tại lễ đăng quang của ta. Ta gần như không thể che giấu vẻ nhăn nhó khi [guest.GetSheHe] tiến về phía ta."
  prelude_events.0090.desc.fallback: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta, [guest.GetTitledFirstName], tiến về phía ta với nụ cười rạng rỡ."
  prelude_events.0090.desc.outro: "\n\n"Ngài thấy sao?" [guest.GetSheHe] ra hiệu về phía một đàn cừu ngay sau lưng [guest.GetHerHim]. "Một món quà đủ xứng đáng chứ?""
  prelude_events.0090.aa: ""[guest.Custom('SisterBrother')] của ta! Hãy cùng nhau ăn mừng!""
  prelude_events.0090.a: ""Ngươi có thể mang chúng về [guest.GetCapitalLocation.GetNameNoTooltip].""
  prelude_events.0090.b: ""Một món quà #EMP tuyệt vời#!.""
  prelude_events.0090.c: ""Xin hãy giữ lấy! Sự hiện diện của ngươi đã là món quà rồi.""
  friend_nomadic_guest_coronation_herd: "[TARGET_CHARACTER.GetShortUIName|U] đã dâng tặng [CHARACTER.GetShortUIName] một phần đàn gia súc trong lễ đăng quang của [CHARACTER.GetHerHis]."
  friend_nomadic_guest_coronation_herd_corresponding: "[CHARACTER.GetShortUIName|U] đã dâng tặng [TARGET_CHARACTER.GetShortUIName] một phần đàn gia súc trong lễ đăng quang của [TARGET_CHARACTER.GetHerHis]."
 
  prelude_events.0100.t: "Những Công Trình Đầy Hứa Hẹn"
  prelude_events.0100.desc: ""Một [ROOT.Char.GetTitleAsNameNoTooltip] như thế nào lại để lãnh địa của chư hầu héo mòn và mục rữa chứ? Người ta bàn tán đấy, thưa [ROOT.Char.GetLadyLord]," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] của ta, [vassal.GetTitledFirstName], nghiêm túc cảnh báo, [vassal.Custom('quirk_pos_pp')].\n\n"Ta khẩn cầu ngài hãy nhìn lại nội tại, và nhớ rằng danh tiếng của một vương quốc chính là danh tiếng của lãnh địa.""
  prelude_events.0100.a: ""Ta hứa sẽ không quên điều này.""
  prelude_events.0100.b: ""Hãy khiến lãnh địa của ngươi phồn thịnh, [vassal.GetTitledFirstNameNoTooltip].""
  prelude_events.0100.c: ""Có lẽ ta nên tập trung nghiên cứu các kỹ thuật ấy...""
  coronation_vassal_building_tt: "Nhờ vào [GetModifier('coronation_vassal_building_modifier').GetName] của Ngài"
  coronation_vassal_building_modifier: "Lời Hứa Xây Dựng"
  coronation_vassal_building_modifier_desc: "Nhân vật này sẽ nhận được [prestige_i][prestige|E] mỗi khi họ xây dựng công trình trong lãnh địa của chư hầu."
  friend_coronation_paid_for_building: "[CHARACTER.GetShortUIName] đã đóng góp một phần vàng cho công cuộc xây dựng của [TARGET_CHARACTER.GetShortUINamePossessive]."
  friend_coronation_paid_for_building_corresponding: "[TARGET_CHARACTER.GetShortUIName] đã đóng góp một phần vàng cho công cuộc xây dựng của [CHARACTER.GetShortUINamePossessive]."

  prelude_events.0110.t: "Chưa Từng Được Lắng Nghe"
  prelude_events.0110.desc: "Ta nhận thấy [guest.GetTitledFirstName] lén nhìn về phía mình. [guest.GetSheHe|U] [guest.Custom('quirk_pos_present')], rồi cuối cùng tiến đến. Với một cái cúi chào cung kính, [guest.GetSheHe] mở lời:\n\n"Đấng kính yêu [ROOT.Char.GetTitleAsNameNoTooltip], chúng Ta — những người [guest_culture.GetCollectiveNounNoTooltip] — mong muốn được ủng hộ ngài hôm nay và trong những ngày sắp tới. Vương miện sẽ sớm an vị trên đầu ngài, nhưng liệu phong tục của chúng Ta có an vị trong tim ngài?""
  prelude_events.0110.a: ""Ta sẽ nói bằng ngôn ngữ của trái tim các ngươi.""
  prelude_events.0110.b: "Mọi người đều phải biết tình yêu của ta dành cho người [guest_culture.GetCollectiveNounNoTooltip]."
  prelude_events.0110.c: "Lễ đăng quang cần một trọng tâm khác."
  cultural_acceptance_gain_coronation_impress_attendees: "Việc phát biểu trong lễ đăng quang đã làm thay đổi mức độ chấp nhận văn hóa"
  friend_coronation_learn_language: "[CHARACTER.GetShortUIName|U] bày tỏ mong muốn học ngôn ngữ của [TARGET_CHARACTER.GetShortUINamePossessive] trong lễ đăng quang của [CHARACTER.GetHerHis]."
  friend_coronation_learn_language_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] bày tỏ mong muốn học ngôn ngữ của [CHARACTER.GetShortUINamePossessive] trong lễ đăng quang của [TARGET_CHARACTER.GetHerHis]."

  prelude_events.0120.t: "Hãy Nhớ Đến Những Người Ngài"
  prelude_events.0120.desc: ""Hẳn là không dễ dàng," [guest.GetTitledFirstName] nói, [guest.Custom('quirk_pos_pp')]. "Ta chỉ có thể tưởng tượng được sức nặng mà vương miện sắp đặt lên đầu ngài."\n\n"Nhưng xin đừng lo. Những chư hầu trung thành của ngài sẽ luôn sát cánh bên ngài, hôm nay và mãi mãi. Nào, hãy nhận lấy thứ này." [guest.GetSheHe|U] ra hiệu cho một người hầu của [guest.GetHerHis], kẻ cúi đầu dâng lên một món quà được gói cẩn thận. "[guest_artifact.GetName]," [guest.GetFirstNameNoTooltip] giải thích. "Nó đã phục vụ ta rất tốt.""
  prelude_events.0120.aa: ""Ta sẽ đáp lại cử chỉ này.""
  prelude_events.0120.a: ""Tình cảm của ta chỉ đáng giá đến thế sao?""
  prelude_events.0120.b: ""Cảm ơn sự hào phóng của ngài, [guest.GetTitleAsNameNoTooltip].""
  prelude_events.0120.c: "Hãy để mọi người thấy ánh hào quang của nó!"
  coronation_gift_artifact_desc: "[guest_artifact.GetDesc]\n\nMột món quà đầy tâm ý từ [guest.GetShortUINamePossessive] dành cho lễ đăng quang."
  coronation_gift_artifact_host_desc: "[my_artifact.GetDesc]\n\nĐược trao như một phần của việc trao đổi quà tặng trong lễ đăng quang."
  friend_coronation_gift_exchange: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã tham gia trao đổi quà tặng trong lễ đăng quang của [CHARACTER.GetShortUINamePossessive]."
  friend_coronation_gift_exchange_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] đã tham gia trao đổi quà tặng trong lễ đăng quang của [TARGET_CHARACTER.GetShortUINamePossessive]."
 
  prelude_events.0130.t: "Ân Phúc Lên Tài Sản Của Ngài"
  prelude_events.0130.desc: ""Nguyện cầu [coronator.GetFaith.HighGodName] ban phước lành cho ngài trong ngày may mắn này, [ROOT.Char.GetTitledFirstNameNoTooltip]." [coronator.GetTitledFirstName] cúi đầu [coronator.GetHerHis], [coronator.Custom('quirk_pos_pp')].\n\n"Ta mong muốn kỷ niệm dịp này bằng một lời ban phước dành cho [my_artifact.GetName] yêu quý nhất của ngài.""
  prelude_events.0130.a: "Nguyện [coronator.GetFaith.HighGodName] bảo hộ cho nó."
  prelude_events.0130.a.tt: "[my_artifact.GetName]:\n$BULLET_WITH_TAB$Nhận được [piety_i|E]#positive_value +10%#! [piety|E] hàng tháng\n$BULLET_WITH_TAB$Nhận được #positive_value +10#! [clergy|E] [opinion|E]"
  prelude_events.0130.b: "Nguyện nó trở thành lời nhắc về lễ đăng quang."
  prelude_events.0130.b.tt: "[my_artifact.GetName]:\n$BULLET_WITH_TAB$Nhận được [prestige_i|E]#positive_value +8%#! [prestige|E] hàng tháng"
  prelude_events.0130.c: ""Các vị khách của ta hẳn sẽ rất muốn chiêm ngưỡng nó.""
  prelude_events_0130_cynical_tt: "Do đặc điểm #high [GetTrait('cynical').GetName( GetNullCharacter )] [trait|E]#! của Ngài, [coronation_magnificence|E] của [GetActivityType('activity_coronation').GetName] #P tăng mạnh #!"
  coronation_blessed_artifact_desc: "[my_artifact.GetDesc]\n\nNó dường như tỏa ra một thứ ánh sáng run rẩy. Một lời nhắc về phước lành được ban trong lễ đăng quang của [artifact_owner.GetTitledFirstNamePossessive]."
 
  prelude_events.0140.t: "Dưới Ánh Hào Quang Của Người"
  prelude_events.0140.desc: "[host.GetTitledFirstName] dành một chút thời gian quan sát đám đông, [host.Custom('quirk_pos_pp')]. Tiếng nói của các cận thần đã trở nên đều đều như tiếng chim hót, và Ta không nghi ngờ gì việc [guest.GetTitledFirstName] cũng định góp giọng.\n\n\"Chào ngài [ROOT.Char.GetTitleAsNameNoTooltip]!\" [guest.GetSheHe|U] nói, tiến lại gần Ta. \"Ta có thể mạo muội hỏi suy nghĩ của ngài về buổi lễ này không? Ta tin chắc rằng triều đại của [host.GetTitledFirstNamePossessiveNoTooltip] sẽ là một triều đại của tình yêu và công lý.\""
  prelude_events.0140.a: "#EMP Im lặng.#!"
  prelude_events.0140.b: "\"Họ sẽ gọi chúng ta là những người may mắn vì đã có mặt tại đây!\""
  prelude_events.0140.b.offer_support_tt: "Vì #high $coronation_offer_support$#! [intent|E] của Ngài, [coronation_magnificence|E] của [GetActivityType('activity_coronation').GetName] #P tăng đáng kể#!"
  prelude_events.0140.c: "\"Chúc [host.GetSheHe] trị vì lâu dài!\""
 
  prelude_events.0150.t: "Ngài Có Biết [guest.GetHerHim|U] Không?"
  prelude_events.0150.desc: "\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" [host.GetTitledFirstName] gọi Ta với nụ cười rạng rỡ. Bên cạnh [host.GetHerHim] là một vị khách khác, một [guest.GetTitleAsNameNoTooltip|l] mà Ta chưa từng quen biết.\n\n\"Đây là [guest.GetTitledFirstName],\" [host.GetTitledFirstNameNoTooltip] giới thiệu [guest.GetHerHim]. \"Ta tin rằng hai người sẽ có nhiều điểm chung. [guest.Custom('MatchingConversationSubject_alone')|U], có lẽ vậy.\""
  prelude_events.0150.aa: "\"Ta rất hân hạnh được hộ tống [guest.GetHerHim] dạo quanh khuôn viên.\""
  prelude_events.0150.a: "[guest.GetSheHe|U] trông rất lịch thiệp."
  prelude_events.0150.b: "Ta hứng thú nói chuyện với [host.GetTitledFirstNameNoTooltip] hơn."
  prelude_events.0150.c: "\"Ta là bằng hữu của #EMP tất cả#!, [host.GetTitledFirstNameNoTooltip].\""
  lover_coronation_introduction: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] cảm nhận một mối liên kết không thể chối cãi sau khi được giới thiệu tại lễ đăng quang."
  lover_coronation_introduction_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] cảm nhận một mối liên kết không thể chối cãi sau khi được giới thiệu tại lễ đăng quang."
  friend_coronation_introduction: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] trở nên thân thiết sau khi được giới thiệu tại lễ đăng quang."
  friend_coronation_introduction_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] trở nên thân thiết sau khi được giới thiệu tại lễ đăng quang."
 
  prelude_events.0160.t: "Gia Tộc [ROOT.Char.GetDynasty.GetNameNoTooltip] Giữa Đám Đông"
  prelude_events.0160.desc: "\"[guest.GetHouse.GetMotto],\" một giọng nói quen thuộc vang lên. Ta quay lại và thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của mình — [guest.GetTitledFirstName] — đang gọi Ta.\n\n\"[ROOT.Char.GetFirstNameNoTooltip],\" [guest.GetSheHe] chào Ta, [guest.Custom('quirk_pos_pp')]. \"Thật là một niềm vinh dự khi được gặp một người nhà [ROOT.Char.GetDynasty.GetName] trong dịp như thế này. Cảm giác như đã trôi qua cả một đời kể từ lần gặp trước.\""
  prelude_events.0160.aa: "\"Gia tộc [ROOT.Char.GetDynasty.GetNameNoTooltip] sẽ trường tồn!\""
  prelude_events.0160.a: "\"Niềm vui này không được đáp lại.\""
  prelude_events.0160.b: "\"Hãy để cả thế giới biết chúng ta có mặt ở đây!\""
  prelude_events.0160.c: "Chúng ta phải giữ sự khiêm nhường."
  rival_coronation_dynasty_insult: "[CHARACTER.GetShortUIName|U] xúc phạm [TARGET_CHARACTER.GetShortUIName] tại lễ đăng quang khi gọi [TARGET_CHARACTER.GetHerHim] là nỗi ô nhục của gia tộc."
  rival_coronation_dynasty_insult_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] xúc phạm [CHARACTER.GetShortUIName] tại lễ đăng quang khi gọi [CHARACTER.GetHerHim] là nỗi ô nhục của gia tộc."
  coronation_famed_dynasty_modifier: "Gia Tộc Lẫy Lừng"
  coronation_famed_dynasty_modifier_desc: "Danh tiếng lẫy lừng của một thành viên trong gia tộc này đã được toàn thể khách mời tại lễ đăng quang công nhận."
 
  prelude_events.0170.t: "Tiếng Nói Của [guest.GetFaith.GetNameNoTooltip]"
  prelude_events.0170.desc: "Khi ánh sáng ban ngày dần tàn, ta thấy [guest.GetTitledFirstName] đang nhìn về phía ta. Với một cái gật đầu đầy thừa nhận, [guest.GetSheHe] mỉm cười và bước lại gần.\n\n\"Quả là một ngày tuyệt đẹp, ngài có đồng ý không, [ROOT.Char.GetFirstNameNoTooltip]? Chúng ta nhất định phải cảm tạ [guest.GetFaith.HighGodName] vì những phước lành này. Chúng ta, những tín đồ của [guest.GetFaith.GetName], luôn tôn kính những lời răn dạy của [guest.GetFaith.HighGodHerHis].\" [guest.GetSheHe|U] tự hào tuyên bố, hít một hơi thật sâu trước khi tiếp tục bài diễn thuyết thần học của [guest.GetHerHis]."
  prelude_events.0170.aa: "\"Lảm nhảm! Hãy lắng nghe vinh quang của [ROOT.Char.GetFaith.HighGodName]!\""
  prelude_events.0170.aa.success: "[guest.GetShortUIName] hiểu được vinh quang của [ROOT.Char.GetFaith.HighGodName]"
  prelude_events.0170.aa.failure: "[guest.GetShortUIName] cảm thấy bị xúc phạm"
  prelude_events.0170.a: "Một cuộc tranh luận thần học cũng không tệ."
  prelude_events.0170.a.crit_success: "[host.GetShortUIName] ấn tượng"
  prelude_events.0170.a.success: "Công chúng ấn tượng"
  prelude_events.0170.a.failure: "Ngài tự làm mình bẽ mặt"
  prelude_events.0170.b: "\"Hãy nói thêm đi.\""
  prelude_events.0170.c: "Lễ đăng quang không phải nơi để bàn luận những chuyện này."
  prelude_events.0170.c.bad: "Gửi kẻ lải nhải đó đi làm phiền một người ủng hộ dốt nát."
  prelude_events.0170.c.bad_flavor: "Những lời rant của [guest.GetFirstNamePossessiveNoTooltip] sẽ chọc giận tên ngu dốt [supporter.GetName]!"
  cheaper_to_convert_to_guest_faith_tt: "Ngài nhận được #P giảm giá 50%#! khi cải đạo sang [guest.GetFaith.GetName]"
  prelude_events.0170.c.disrupt_loyalists_tt: "Vì #high $coronation_disrupt_loyalists$#! [intent|E] của Ngài, [coronation_magnificence|E] của [GetActivityType('activity_coronation').GetName] bị #N giảm#!"
 
  prelude_events.0180.t: "Khoảnh Khắc Tĩnh Lặng"
  prelude_events.0180.desc.host: "Ta rời bỏ các vị khách và bước vào [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], tìm kiếm một khoảnh khắc yên tĩnh trước khi sức nặng của vương miện thực sự đè lên Ta.\n\n"
  prelude_events.0180.desc.outro: "Bàn thờ của [ROOT.Char.GetFaith.HighGodName] tỏa sáng mờ ảo, được soi sáng bởi hàng chục ngọn nến. Một sự tĩnh lặng ngát hương bao trùm những bức tường lạnh lẽo. Bên phải Ta, bức họa [ROOT.Char.GetFaith.WealthGodName] nhìn Ta với ánh mắt nghiêm nghị. Bên trái, màu sắc từng là [ROOT.Char.GetFaith.HealthGodName] đang dần phai nhạt, nụ cười của [ROOT.Char.GetFaith.HealthGodHerHis] gần như không thể nhận ra."
  prelude_events.0180.desc.guest: "Cuối cùng Ta cũng rời được các vị khách khác và bước vào [ROOT.Province.GetCounty.GetFaith.HouseOfWorship], tìm kiếm một khoảnh khắc yên tĩnh.\n\n"
  prelude_events.0180.a: "[ROOT.Char.GetFaith.HighGodName], xin đừng ruồng bỏ [host.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  prelude_events.0180.b: "[ROOT.Char.GetFaith.WarGodName], hãy giáng họa xuống [host.GetTitledFirstNameNoTooltip]!"
  prelude_events.0180.c: "Ta phó thác bản thân cho [ROOT.Char.GetFaith.HealthGodName]."
  prelude_events.0180.d: "[ROOT.Char.GetFaith.WealthGodName] sẽ dẫn lối cho ta."
  prelude_events.0180.a.impress_attendees_tt: "Vì #high $coronation_impress_attendees$#! [intent|E] của Ngài, [coronation_magnificence|E] của [GetActivityType('activity_coronation').GetName] #P tăng mạnh#!"
  coronation_good_health_modifier: "Lời Cầu Nguyện Cho Sức Khỏe"
  coronation_good_health_modifier_desc: "Nhân vật này đã dành một khoảnh khắc trong lễ đăng quang để cầu nguyện cho sức khỏe."
