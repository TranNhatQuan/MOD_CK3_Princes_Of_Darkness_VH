  coronation_events.6140.t: "Phối Ngẫu của [host.GetTitleAsNamePossessiveNoTooltip]"
# Spouse is root
  coronation_events.6140_desc_intro_spouse: "Khi các nghi thức đăng quang của [host.GetTitleAsNamePossessive] đã hoàn tất, vị phối ngẫu [host.Custom('GetTitleTierAdjective')] giờ đây phải được chính thức thiết lập.\n\n"
  coronation_events.6140_desc_polygamous_spouse: "Khi các nghi thức đăng quang của [host.GetTitleAsNamePossessive] đã hoàn tất, vị phối ngẫu cấp cao nhất trong số các phối ngẫu [host.Custom('GetTitleTierAdjective')] giờ đây phải được chính thức thiết lập.\n\n"
  coronation_events.6140_desc_spouse: "Trong khi [spouse.Custom2('RelationToMe', SCOPE.sC('host'))] của ta dõi theo, ta được dẫn qua các nghi thức [host.GetPrimaryTitle.GetAdjective]."
  coronation_events.6140_desc_foreign_wife_no_court_spouse: "Nền giáo dưỡng theo văn hóa [spouse.GetCulture.GetName] khiến ta gần như không được chuẩn bị cho các nghi lễ [host.GetCulture.GetName] xa lạ giữa những lời cầu nguyện [host.GetFaith.GetAdjective]... Ta không nói được [host.GetCulture.GetLanguage.GetName], và buộc phải đọc lời thề chỉ bằng ký ức về âm thanh của chúng."
  coronation_events.6140_desc_foreign_wife_spouse: "Nền giáo dưỡng theo văn hóa [spouse.GetCulture.GetName] khiến ta gần như không được chuẩn bị cho các nghi lễ [host.GetCulture.GetName] xa lạ giữa những lời cầu nguyện [host.GetFaith.GetAdjective]... Ta không nói được [host.GetCourtLanguage.GetName], và buộc phải đọc lời thề chỉ bằng ký ức về âm thanh của chúng."
  coronation_events.6140_desc_lowly_wife_spouse: "Những thành viên khiêm nhường của gia tộc [spouse.GetHouse.GetName] như ta hiếm khi được chứng kiến các nghi thức vương giả như vậy. Những lời thề trung thành mơ hồ dành cho [host.GetFaith.random_GoodGodNames] quả thực là một thử thách..."
  coronation_events.6140_desc_regal_wife_spouse: "Ta xuất thân từ dòng dõi huy hoàng: chúng ta — những [spouse.Custom('GetDaughterSon')] của gia tộc [spouse.GetHouse.GetName] — đều là bậc thầy nghi lễ, và ta hành xử với sự trang nghiêm và điềm tĩnh."
  coronation_events.6140_desc_mid_wife_spouse: "Ta đọc lên những lời lẽ quen thuộc, ca ngợi [host.GetFirstNameNoTooltip], [host.GetFaith.HighGodName], và bổn phận của ta đối với vương quốc của [spouse.Custom2('RelationToMePossessive', SCOPE.sC('host'))]."
  coronation_events.6140_desc_crown_spouse: "\n\nChẳng bao lâu sau — và với đại lễ long trọng — một vương miện xứng đáng với vị trí [host.Custom('GetTitleTierAdjective')] [spouse.Custom('WifeHusband')] của [host.GetFirstNamePossessiveNoTooltip] được đặt lên đầu ta. [host.GetPrimaryTitle.GetName|U] tung hô khi chúng ta cùng ngồi trên ngai vàng."
  coronation_events.6140_desc_neutral_spouse: "\n\nChẳng bao lâu sau — và với đại lễ long trọng — ta được dẫn đến vị trí danh dự bên cạnh [host.GetFirstNamePossessiveNoTooltip], và bước lên ngai vàng với tư cách là [host.Custom('GetTitleTierAdjective')] [spouse.Custom('WifeHusband')] của [host.GetHerHis]."
# For everyone else
  coronation_events.6140_desc: "Khi các nghi thức đăng quang của [host.GetTitleAsNamePossessive] đã hoàn tất, vị phối ngẫu [host.Custom('GetTitleTierAdjective')] nay được chính thức thiết lập với tước hiệu [spouse.GetTitleAsName].\n\n"
  coronation_events.6140_desc_polygamous: "Khi các nghi thức đăng quang của [host.GetTitleAsNamePossessive] đã hoàn tất, vị phối ngẫu cấp cao nhất trong số các phối ngẫu [host.Custom('GetTitleTierAdjective')] nay được chính thức thiết lập với tước hiệu [spouse.GetTitleAsName].\n\n"
  coronation_events.6140_desc_guest: "[spouse.Custom('WifeHusband')] của [host.GetTitledFirstNamePossessiveRegnal] tiến hành các nghi thức với nét [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)] đặc trưng."
  coronation_events.6140_desc_host: "[host.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta tiến hành các nghi thức với phong thái [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)] quen thuộc của [spouse.GetHerHis]."
  coronation_events.6140_desc_foreign_wife_no_court: "Nền giáo dưỡng theo văn hóa [spouse.GetCulture.GetName] của [spouse.GetHerHis|U] hầu như không chuẩn bị cho [spouse.GetHerHim] các nghi lễ [host.GetCulture.GetName] giữa những lời cầu nguyện [host.GetFaith.GetAdjective]: [spouse.GetSheHe] đọc lời thề bằng [host.GetCulture.GetLanguage.GetName] chỉ dựa vào ký ức về âm thanh của chúng."
  coronation_events.6140_desc_foreign_wife: "Nền giáo dưỡng theo văn hóa [spouse.GetCulture.GetName] của [spouse.GetHerHis|U] hầu như không chuẩn bị cho [spouse.GetHerHim] các nghi lễ [host.GetCulture.GetName] giữa những lời cầu nguyện [host.GetFaith.GetAdjective]: [spouse.GetSheHe] đọc lời thề bằng [host.GetCourtLanguage.GetName] chỉ dựa vào ký ức về âm thanh của chúng."
  coronation_events.6140_desc_lowly_wife: "Xuất thân thấp kém của [spouse.GetHerHis|U] phần nào bị bộc lộ khi [spouse.GetFirstName] lúng túng với những lời thề trung thành mơ hồ hơn dành cho [host.GetFaith.random_GoodGodNames]..."
  coronation_events.6140_desc_regal_wife: "Là minh chứng cho dòng dõi huy hoàng của [spouse.GetHerHis], [spouse.GetFirstName] đứng lên đọc lời thề của [spouse.GetHerHis] với vẻ trang nghiêm và điềm tĩnh."
  coronation_events.6140_desc_mid_wife: "Là một [spouse.Custom('DaughterSon')] của gia tộc [spouse.GetHouse.GetName], những lời nói được cất lên với [host.Custom2('QuirkAdverbPosOrNeg', spouse.MakeScope.Char)] của [spouse.GetFirstNamePossessive] mang đậm dấu ấn từ xuất thân quý tộc [spouse.GetCulture.GetName] của [spouse.GetHerHis]."
  coronation_events.6140_desc_crown: "\n\nChẳng bao lâu sau — trong một nghi lễ vô cùng long trọng — chiếc vương miện của [spouse.GetFirstNamePossessiveNoTooltip] lần đầu tiên được đặt lên đầu [spouse.GetHerHis]. [host.GetPrimaryTitle.GetDefinitiveName|U] long trọng công nhận [spouse.GetTitleAsNameNoTooltip] của họ."
  coronation_events.6140_desc_neutral: "\n\nChẳng bao lâu sau — trong một nghi lễ vô cùng long trọng — [spouse.GetFirstNameNoTooltip] được dẫn đến vị trí danh dự bên cạnh ta, và [spouse.GetSheHe] ngồi lên ngai vàng với tư cách [spouse.GetTitleAsNameNoTooltip] của [host.GetPrimaryTitle.GetNameNoTier]."
  coronation_events.6140.a_like: "Đáng buồn thay, ta phải loại bỏ kẻ [spouse.Custom('ComplimentAdjective')] [spouse.GetWomanMan] này..."
  coronation_events.6140.a_dislike: "Ta #EMP nhất định phải#! loại bỏ kẻ [spouse.Custom('InsultAdjective')] [spouse.GetWomanMan] này..."
  coronation_events.6140.a: "Ta phải loại bỏ [spouse.GetWomanMan] này..."
  coronation_magnificence_spouse_effects_tt: "#EMP #low Các hiệu ứng này được điều chỉnh theo mức [coronation_magnificence|E] của [coronation|E]#!#!"
  coronation_events.6140.b_like: "[spouse.GetTitleAsNameNoTooltip] của ta, tình yêu ngọt ngào của ta — [spouse.GetFirstNameNoTooltip]!"
  coronation_events.6140.b_dislike: "[spouse.GetTitleAsNameNoTooltip] của ta... #EMP [spouse.GetHerHim]#!."
  coronation_events.6140.b: "[spouse.GetWifeHusband] của ta, [spouse.GetTitleAsNameNoTooltip] của ta — [spouse.GetFirstNameNoTooltip]."
  coronation_events.6140.c: "Phần việc của ta trong lễ đăng quang của [host.Custom('WifeHusbandPossessive')] đã kết thúc."
  coronation_events.6140.c_flavor: "Những công việc [ROOT.Char.GetPrimaryTitle.GetAdjective] chắc chắn sẽ chiếm phần lớn thời gian của ta. Nhưng trở thành vị phối ngẫu [host.Custom('GetTitleTierAdjective')] của [host.GetPrimaryTitle.GetNameNoTier]... điều đó thật đáng kể."
  coronation_spouse_hostile_scheme_bonus_tt: "Ngài sẽ có #P +15#! [success_chance|E] trong các [hostile_schemes|E] nhắm vào [spouse.GetShortUIName]"
  coronation_events.6140.d_likes_spouse: "Một ngày vinh quang cho [spouse.GetFirstNameNoTooltip]!"
  coronation_events.6140.d_dislikes_spouse: "[spouse.GetShe|U] vẫn chỉ là một [spouse.GetWomanMan] khốn khổ..."
  coronation_events.6140.d_dislikes_host: "[ROOT.Char.GetFaith.HighGodName] phù hộ cho ngươi, [spouse.GetFirstNameNoTooltip]..."
  coronation_events.6140.d_likes_host: "Hãy chăm sóc tốt [host.Custom('WifeHusband')] của ngươi, [spouse.GetFirstNameNoTooltip]."
  coronation_events.6140.d: "[host.GetTitleAsNameNoTooltip] đã có [spouse.GetTitleAsNameNoTooltip] của [host.GetHerHis]."

  coronation_events.6140.aa: "Vậy là... [spouse.GetSheHe] giờ đã là một [host.GetFaith.GetAdherentNameNoTooltip], đúng chứ?"
  coronation_events.6140.aa_success: "[spouse.GetSheHe|U] đã được cải đạo sang đức tin"
  coronation_events.6140.aa_fail: "[spouse.GetSheHe|U] đã chịu các nghi lễ dị giáo vì Ngài"
  coronation_events.6140.aa.flavor: "Chẳng lẽ [spouse.GetFirstNameNoTooltip] không thấy rằng, với chính bàn tay thánh thiện của [anointer.GetTitledFirstNamePossessiveNoTooltipRegnal], nghi lễ này trên thực tế đã công nhận [spouse.GetHerHim] là một tín đồ của đức tin [host.GetFaith.GetAdjectiveNoTooltip]? [spouse.GetWifeHusband] của ta nên đón nhận sự cải đạo của [spouse.GetHerHis]!"
  anointment_available_because_magnificence_tt: "#EMP #low Tùy chọn này khả dụng nhờ mức [coronation_magnificence|E] của lễ [anointment|E]#!"

  ach_yearly_crown_name: "Vương miện trị vì của [owner.GetFirstNamePossessiveNoTooltipRegnal]"
  ach_yearly_crown_desc: "Được [owner.GetName] gấp rút đặt chế tác để sử dụng trong lễ đăng quang [owner.Custom('GetTitleTierAdjective')] của [owner.GetHerHis], chiếc vương miện nghi lễ này mang các biểu tượng đặc trưng của văn hóa [owner.GetCulture.GetName] — tiêu biểu cho các nghệ nhân tại [owner.GetCapitalLocation.GetName] — giữa những viên ngọc trang sức khiêm tốn."
  ach_yearly_regalia_name: "Lễ phục đăng quang của [owner.GetFirstNamePossessiveNoTooltipRegnal]"
  ach_yearly_regalia_desc: "Được gia thất [owner.Custom('GetTitleTierAdjective')] chuẩn bị ngay trước lễ đăng quang của [owner.GetNamePossessive], bộ lễ phục này thể hiện lòng mộ đạo [owner.GetFaith.GetAdjective] đối với [owner.GetFaith.random_GoodGodNames] và quyền uy vương giả đối với thần dân [owner.GetCulture.GetName] một cách cân bằng."

  coronation_events.6150.t: "Người Trung Gian của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  coronation_events.6150.desc: "\"Ôi [ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetTitleAsName], gương mặt của ngài đáng được chiêm ngưỡng, tiếng nói của ngài vang lên trong các nghi lễ thiêng liêng này!\" ca ngợi [advisor.GetTitledFirstName], [advisor.GetCouncilTitle] của ta. \"Các bậc minh quân và nhiều [ROOT.Char.Custom('GetLowOfficialPlural')] đã tới để xem xét triều đại của ngài… và vị thế họ sẽ đứng trước [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive] [ROOT.Char.GetTitleAsNameNoTooltip] mới của ngài.\"\n\n\"Khi ngài bận rộn với những lời trang trọng, với các việc chính thức… #EMP Ta#! tự do làm việc trong những góc yên tĩnh, và thể hiện ý chí của ngài lên những kẻ như… [neighbor.GetName], có thể chăng?\""
  coronation_events.6150.a: "\"Xin cầu xin lòng trung thành của [disobedient_vassal.GetFirstNamePossessiveNoTooltip] thay cho ta.\""
  coronation_events.6150.a.flavor: "Lời ta sẽ lan truyền, về sự ấm áp và dịu dàng hứa hẹn từ tổ ấm của ta… nhưng, theo [ROOT.Char.GetFaith.HighGodName], ta sẽ có được sự phục tùng của [disobedient_vassal.GetFirstNamePossessiveNoTooltip]!"
  coronation_events.6150.b: "\"Hãy dẫn các vị khách ưu tú tham quan không chính thức!\""
  coronation_events.6150.b.flavor: "Sự hiện diện của các nhân vật quyền uy sẽ làm náo động [location.GetNameNoTooltip]! Dẫn họ trước các báu vật [ROOT.Char.Custom('GetTitleTierAdjective')] của ta, và hãy để ký ức về lòng tôn kính cao cả của họ không bao giờ bị quên lãng!"
  coronation_tour_of_notables_modifier: "Được các Chúa Tể ban ân"
  coronation_tour_of_notables_modifier_desc: "Ký ức về các bậc vĩ nhân đi qua giữa dân chúng địa phương, và quỳ gối trước các báu vật địa phương vẫn còn tươi mới."
  coronation_events.6150.c: "\"[confederation.GetName] làm ta bực bội…\""
  coronation_events.6150.c.flavor: "...may mắn thay, các thành viên đã đến đây, và ánh mắt lấp lánh của họ cho thấy họ có thể từ bỏ trung thành vì vàng!"
  coronation_events.6150.c.success_crit: "Ba thành viên liên minh nhận hối lộ của ngài"
  coronation_events.6150.c.success: "Hai thành viên liên minh nhận hối lộ của ngài"
  coronation_events.6150.c.fail: "Một thành viên liên minh dự kiến bị hối lộ"
  coronation_events.6150.supp: "\"Biến sự kính trọng của [neighbor.GetFirstNamePossessiveNoTooltip] thành phục tùng!\""
  coronation_events.6150.supp.success: "[neighbor.GetTitledFirstNameNoTooltip] bị thuyết phục phục tùng"
  coronation_events.6150.supp.fail: "[neighbor.GetTitledFirstNameNoTooltip] từ chối ngoại giao không chính thức"
  coronation_events.6150.d: "\"Thuyết phục [neighbor.GetTitledFirstNameNoTooltip] dâng cống phẩm.\""
  coronation_events.6150.d.success: "[neighbor.GetTitledFirstNameNoTooltip] chào đón quyền bá chủ của ngài"
  coronation_events.6150.d.fail: "[neighbor.GetTitledFirstNameNoTooltip] bị xúc phạm"
