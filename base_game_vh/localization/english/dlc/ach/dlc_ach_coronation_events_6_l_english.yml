# Intro
  coronation_events.6130.desc.intro: "Khoảnh khắc thiêng liêng cuối cùng đang đến gần."
  coronation_events.6130.papal_intro_host: "Nhưng trước hết là nghi thức xức dầu thánh — dấu ấn cho sự chấp thuận của [anointer.GetTitledFirstNamePossessiveRegnal]: không chỉ công nhận ta là người cai trị [ROOT.Char.GetPrimaryTitle.GetNameNoTier], mà còn là một trong những thành viên cao quý của những Kẻ Được Chúa Kitô Tuyển Chọn."
  coronation_events.6130.papal_intro_guest: "Nhưng trước hết là nghi lễ xức dầu: dấu ấn cho thấy quyền cai trị của [host.GetTitledFirstNamePossessiveRegnal] đến từ Thiên Chúa. [anointer.GetTitledFirstNameRegnal] tự mình mang theo dầu thánh, đảm nhận vai trò của Tiên tri Samuel trong lễ đăng quang của vị Vua David [host.GetPrimaryTitle.GetAdjective] này."
  coronation_events.6130.abrahamic_intro_host: "Trước hết, ta phải được xức dầu thánh, được giao phó vai trò lãnh đạo các tín hữu của [host.GetFaith.HighGodNamePossessive], đứng trên bầy chiên phàm tục."
  coronation_events.6130.abrahamic_intro_guest: "Trước hết, [host.GetTitledFirstNameRegnal] phải được phong chức bằng dầu thánh, được đặt lên vị trí cao hơn những tín hữu còn lại của [host.GetFaith.HighGodNamePossessive], và nhận trọng trách chăm sóc linh hồn của thần dân trong vương quốc của [host.GetHerHis]."
  coronation_events.6130.dharmic_intro_host: "Lễ vật đã được dâng lên, [Glossary( 'Rajasuya', 'RAJASUYA_GLOSS' )] đã bắt đầu: giờ đây là nghi thức [Glossary( 'Abhisheka', 'ABHISHEKA_GLOSS' )] linh thiêng. Ta đọc các thần chú Vệ-đà, và những người mang mười bảy dòng nước thánh tụ hội."
  coronation_events.6130.dharmic_intro_guest: "Lễ vật đã được dâng lên, [Glossary( 'Rajasuya', 'RAJASUYA_GLOSS' )] đã bắt đầu: giờ đây là nghi thức [Glossary( 'Abhisheka', 'ABHISHEKA_GLOSS' )] linh thiêng. [host.GetTitledFirstNameRegnal] đọc các thần chú Vệ-đà, và những người mang mười bảy dòng nước thánh tụ hội quanh [host.GetHerHim]."
  RAJASUYA_GLOSS: "Một chuỗi nghi lễ phổ biến dùng để khai vị các quân vương theo tín ngưỡng Dharmic. #G Rajasuya#! bao gồm các yếu tố như rảy nước thánh, nhận một cây cung với ba mũi tên, bước lên da hổ, và một ván xúc xắc."
  ABHISHEKA_GLOSS: "Một nghi lễ Dharmic cổ xưa, trong đó các vị vua hoặc trưởng lão được rảy nước lấy từ những dòng sông thiêng và bốn vùng duyên hải của Ấn Độ. Nghi thức này gắn liền với lễ đăng cơ hoàng gia."
  coronation_events.6130.generic_intro_host: "Nhưng trước hết là nghi thức xức dầu thánh — dấu ấn cho sự chấp thuận của [anointer.GetTitledFirstNamePossessiveRegnal]: không chỉ công nhận ta là người cai trị [ROOT.Char.GetPrimaryTitle.GetNameNoTier], mà còn là kẻ được ưu ái trong hàng ngũ tín hữu của [host.GetFaith.HighGodNamePossessive]."
  coronation_events.6130.generic_intro_guest: "Nhưng trước hết là nghi lễ xức dầu: dấu ấn cho thấy quyền cai trị của [host.GetTitledFirstNamePossessiveRegnal] đến từ [host.GetFaith.HighGodName]. Chính [anointer.GetTitledFirstNameRegnal] mang theo dầu thánh."

# Bit about priest
  coronation_events.6130.faith_head_disapproves: "\n\n[anointer.GetTitledFirstName], với vẻ chán ghét kín đáo,"
  coronation_events.6130.faith_head_likes: "\n\n[anointer.GetTitledFirstName], với niềm tự hào [host.Custom('GetMotherlyFatherly')],"
  coronation_events.6130.faith_head: "\n\n[anointer.GetTitledFirstName], đấng trung gian của các [host.GetFaith.GetAdherentNamePlural],"
  coronation_events.6130.christian_non_hof_non_cc: "\n\n[anointer.GetTitledFirstName], vị mục tử của [anointer.GetPrimaryTitle.GetNameNoTier],"
  coronation_events.6130.christian_non_hof: "\n\n[anointer.GetTitledFirstName], vị mục tử của [host.GetPrimaryTitle.GetNameNoTier],"
  coronation_events.6130.anointer_fallback: "\n\n[anointer.GetTitledFirstName], nghiêm cẩn và minh triết,"

# actual anointing happens
  coronation_events.6130.anointing_abrahamic_host_disrespectful: "đánh dấu ta bằng thứ dầu vàng nồng nặc. Trên đôi tay dang rộng, trên đầu, ngực, vai, và các khớp tay của ta... lễ xức dầu vốn dành cho các ngôn sứ, [host.GetFaith.PriestNeuterPlural] và quân vương.\n\n"
  coronation_events.6130.anointing_abrahamic_host: "đánh dấu ta bằng thứ dầu vàng thiêng liêng, tỏa hương ngọt ngào. Trên đôi tay run rẩy, trên đầu, ngực, vai, và các khớp tay của ta... lễ xức dầu được chia sẻ bởi các ngôn sứ, [host.GetFaith.PriestNeuterPlural] và quân vương.\n\n"
  coronation_events.6130.anointing_abrahamic_guest: "đánh dấu [host.GetFirstNameNoTooltip] bằng thứ dầu vàng thiêng liêng. Trên đôi tay, đầu, ngực, vai và những khớp gập nơi cánh tay của [host.GetHerHis]... một lời chúc phúc dành cho các nhà tiên tri, [host.GetFaith.PriestNeuterPlural] và các bậc quân vương.\n\n"
  coronation_events.6130.anointing_dharmic_host: "dẫn dắt những người cử hành lễ. Từ những bình vàng tuôn ra dòng nước ban sự sống. Trong những cơn mưa rực rỡ, chúng được rảy khắp thân thể ta, mang theo ký ức ngọt lành của Saraswati, sông Hằng, và biển cả.\n\n"
  coronation_events.6130.anointing_dharmic_guest: "dẫn dắt những người cử hành lễ. Từ những bình vàng tuôn ra dòng nước ban sự sống. Trong những cơn mưa rực rỡ, chúng được rảy lên [host.GetFirstNameNoTooltip].\n\n"

# Ending
  coronation_events.6130.ending_abrahamic_host_zealous: "Làn da ta rạng ngời với chính sự chuẩn thuận của [host.GetFaith.HighGodName]."
  coronation_events.6130.ending_abrahamic_host_cynical: "Ta có được sự chuẩn thuận của [host.GetFaith.HighGodNamePossessive]. Và ta cảm thấy cực kỳ nhờn."
  coronation_events.6130.ending_abrahamic_guest_zealous: "Làn da của [host.GetTitleAsNamePossessiveNoTooltip] rạng ngời với chính sự chuẩn thuận của [host.GetFaith.HighGodName]."
  coronation_events.6130.ending_abrahamic_guest_cynical: "Làn da nhờn nhoẹt của [host.GetTitleAsNamePossessiveNoTooltip] là một sự chứng thực tuyệt vời từ giới tín đồ."
  coronation_events.6130.ending_dharmic_host: "Nhân danh các nữ thần sông và các vị thần biển, nhân danh [ROOT.Char.GetFaith.WaterGodName], nhân danh [host.GetFaith.FertilityGodName], ta được tôn vinh là [host.GetTitleAsName]."
