  coronation_artifact_improved: "[artifact_target.GetName] sẽ được ban phúc với một [modifier|E] mới"
  crowning_artifact_desc: "[chosen_artifact.GetDesc]\n\nVào năm [year], vật phẩm này được ban phúc như một bảo vật trị vì của [host.GetPrimaryTitle.GetNameNoTier] cho lễ đăng quang của [host.GetTitledFirstNameRegnal]."
  old_title_artifact_remains_tt: "[old_title_artifact.GetName] sẽ được sử dụng cho [coronation|E] của Ngài"
  coronation_title_artifact_log_title: "Bảo vật được hiến dâng cho [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  coronation_title_artifact_log: "[chosen_artifact.GetName] giờ đây sẽ được thừa kế cùng với [host.GetPrimaryTitle.GetName]"
