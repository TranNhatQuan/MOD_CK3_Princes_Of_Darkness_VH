  confederation_elective_extra_vote_2: "Ngài nhận #P 2#! [vote_strength|E] theo luật [GetLaw('confederation_elective_succession_law').GetName] trong #high 10 năm#!"
  improved_because_intent_tt: "#EMP #low Lựa chọn này được cải thiện nhờ Ý định [THIS.Char.GetInvolvedActivityIntent.GetName] của Ngài#!#!"
  harm_confederation_candidate_vote_tt: "[candidate_score|E] của [confederation_heir.GetShortUINamePossessive] theo luật [GetLaw('confederation_elective_succession_law').GetName] giảm #N 20#! trong #high 10 năm#!"
