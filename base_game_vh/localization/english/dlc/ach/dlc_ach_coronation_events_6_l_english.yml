  coronation_titling_artifact_5_tt: "[crowning_artifact_5.GetName] sẽ được thừa kế cùng với [host.GetPrimaryTitle.GetName]"
  coronation_titling_artifact_will_be_lost_tt: "@alert_icon! #alert_trial [crowning_artifact.GetName] sẽ không được thừa kế bởi [host.GetPlayerHeir.GetShortUIName]#!"
