  house_confederation_vote_bonus_tt: "Các thành viên [house|E] của Ngài nhận #P 20#! [candidate_score|E] theo luật [GetLaw('confederation_elective_succession_law').GetName] trong #high 10 năm#!"
  custom.house_members_beneath_host: "Mọi thành viên [house|E] của Ngài trong [host.GetPrimaryTitle.GetName]"

  coronation_events.6001.t: "Tiếng Nói Của Chúng Ta Và Thời Đại"
  coronation_events.6001.desc: "#EMP "Đứng đầu trong số các tù trưởng! [ROOT.Char.GetTitleAsName] được ban cho bởi lời thề thiêng liêng và sự tán thành của các bộ tộc!"#!\n\n[loyal_vassal.GetTitledFirstName] vung thanh kiếm của [loyal_vassal.GetHerHis] về phía ta, một tay đặt lên ngực. [loyal_vassal.GetSheHe|U] ngừng hô vang, rồi cất lời thề trang nghiêm.\n\n"Chúng ta không biết đến [old_de_jure.GetBaseName] trong [loyal_vassal.GetPrimaryTitle.GetBaseNameNoTier]: chúng ta yêu quý [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], và người dân của ta thề sẽ tôn kính nó mãi mãi! #EMP Mãi mãi!#!"" 
  coronation_events.6001.a: ""Hãy lắng nghe ta. Ta sẽ xây dựng cho chúng ta một tương lai.""
  coronation_events.6001.b: ""Tình đồng minh này phải sống mãi!""
  coronation_events.6001.c: "Và giúp cái 'Liên Bang' ngớ ngẩn này tồn tại sao...? Không."
  coronation_events.6001.c.flavor: "Không phải khi ta có thể trở thành một [ROOT.Char.GetTitleAsNameNoTooltip] đích thực, như những bậc xưa kia..."

  coronation_events.6010.t: "[host.GetSheHe|U] Bảo Vệ"
  coronation_events.6010.desc: "Một khu định cư ở vùng ngoại vi [location.GetTitle.GetBaseNameNoTier] đang bốc cháy.\n\n\"Bọn cướp,\" một [host.GetPrimaryTitle.GetAdjective] [host.Custom('KnightCultureNoTooltipLowercase')] giải thích. \"Những kẻ bị ruồng bỏ khỏi các bộ tộc. [assailer.GetTitleAsName] của [assailer.GetPrimaryTitle.GetNameNoTier] sai chúng cưỡi ngựa đến đây. Trả tiền cho lũ cặn bã để sỉ nhục [host.GetTitleAsName] của Liên Bang chúng ta.\"\n\n\"[host.GetTitledFirstNameNoTooltip] ngồi lên ngai vàng #EMP một mình#!,\" một tù trưởng lẩm bẩm. \"Ta e rằng chúng ta sẽ còn nhớ mãi những ngày dân tộc ta cùng nhau đối mặt với cái ác...\""
  coronation_events.6010.a: "#EMP \"Các chiến binh của ta vẫn chiến đấu vì tất cả chúng ta!\"#!"
  coronation_events.6010.b: ""Ngai vàng của chúng ta không phải thứ gì thiêng liêng...""
  coronation_events.6010.b.flavor: "...và chiếm lấy nó cũng chẳng phải đại bất công."
  coronation_events.6010.c: ""Nếu #EMP ta#! được lắng nghe, những nỗi nhục nhã này đã chấm dứt!""
  coronation_events.6010.d: "Tất cả chúng ta nên thề lời canh giữ của thuở xưa."

  confederation_claim_throne: "Ngài mở khóa [scheme|E] [GetScheme('claim_throne').GetTypeName]"
  confederation_warrior_modifier_stacking_tt: "[modifier|E] này sẽ cộng dồn nếu được ban bởi các [vassals|E] đồng liêu khác trong [coronation|E]"
  confederation_warrior_modifier: "Chiến Binh Liên Bang"
  confederation_warrior_modifier_desc: "Đội quân của nhân vật này tràn ngập những kẻ bảo vệ lãnh thổ đang sục sôi."
  confederation_elective_claim_throne: "[GetLaw('confederation_elective_succession_law').GetName] [succession|E]: $VALUE|+=0$"
  coronation_vote_log_title: "Đảm Bảo Phiếu Bầu Liên Bang"
  coronation_vote_log: "[root_scope.GetShortUINamePossessive] vận động chính trị giúp [root_scope.GetHerHim] nhận #P 1#! [vote_strength|E] theo luật [GetLaw('confederation_elective_succession_law').GetName] trong #high 10 năm#!"
  coronation_vote_log_2_title: "Giành Được Hai Phiếu Liên Bang"
  coronation_vote_log_2: "[root_scope.GetShortUINamePossessive] vận động chính trị giúp [root_scope.GetHerHim] nhận #P 2#! [vote_strength|E] theo luật [GetLaw('confederation_elective_succession_law').GetName] trong #high 10 năm#!"
  coronation_house_candidates_log_title: "Ứng Viên Gia Tộc Theo Đuổi Kế Vị"
  coronation_house_candidates_log: "[house|E] [root_scope.GetHouse.GetName] gây ấn tượng với tất cả, và hậu duệ của họ hưởng #P 20#! [candidate_score|E] theo luật [GetLaw('confederation_elective_succession_law').GetName] trong #high 10 năm#!"
  admires_regal_kingdoms: "Ngưỡng Mộ Các Vương Quốc Vương Giả"
  admires_regal_kingdoms_desc: "Người cai trị này tỏ vẻ chán ngán trước các lý tưởng của Liên Bang. Chính đôi mắt ấy lại mơ màng khi nhắc đến nghi lễ và sự huy hoàng."
  confederation_king_accepts_promise_tt: "[host.GetTitledFirstName] chấp nhận lời thề của Ngài"
  confederation_king_rejects_promise_tt: "[host.GetTitledFirstName] từ chối lời thề của Ngài"
  coronation_confederation_de_jure_log_title: "De Jure Cho Liên Bang"
  coronation_confederation_de_jure_log: "[host.GetShortUIName] và [loyal_vassal.GetShortUIName] đã thúc đẩy sự công nhận [de_jure|E] của [host.GetPrimaryTitle.GetDefinitiveName] tại vùng đất của họ."
  coronation_confederation_defender_log_title: "Người Bảo Vệ Thề Trung Thành Với Liên Bang"
  coronation_confederation_defender_log: "[loyal_vassal.GetShortUIName] đã cam kết với [host.GetShortUIName] sẽ hỗ trợ bảo vệ [host.GetPrimaryTitle.GetDefinitiveName]."
  confederate_king_youth_warrior_tt: "[host.GetShortUIName|U] và [warrior_youth.GetShortUIName] trở thành [allies|E]"
  adventurer_name_free_warriors: "Các Chiến Binh Tự Do [host.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  adventurer_name_youths: "Thanh Niên Nhà [host.GetHouse.GetNameNoTooltip]"

  coronation_events.6011.t: "Mục Tiêu Chung"
  coronation_events.6011.desc: ""[assailer.GetName] mang đến lửa cháy! Để khinh miệt lễ đăng quang của ngài, kẻ láng giềng xấu xa của chúng ta đã phái những tên cướp bóc đi xa đến đây!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))] của ta, [loyal_vassal.GetName], kêu lên sau khi đưa ta đến nơi chứng kiến sự xúc phạm của [assailer.GetTitledFirstNamePossessiveNoTooltip].\n\nChỉ một cụm nhỏ những túp lều xơ xác bên ngoài [location.GetName] là đang bốc cháy, vậy mà [loyal_vassal.GetTitledFirstNameNoTooltip] vẫn run lên vì giận dữ.\n\n"[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] vẫn #EMP mang ý nghĩa của nó,#!" [loyal_vassal.GetSheHe] thề rằng, "và ta vẫn sẵn sàng bảo vệ nó! Hãy chấp nhận lời thề của một chiến binh! Lũ cặn bã [assailer.GetPrimaryTitle.GetAdjective] — và tất cả những kẻ khác — sẽ phải đối mặt với những đạo quân của ta khi chúng đặt chân xâm phạm vùng đất của chúng ta!""
  coronation_events.6011.a: ""Hạ vũ khí xuống. Hãy tin vào hòa bình của [ROOT.Char.GetFaith.HighGodNamePossessive].""
  coronation_events.6011.a.flavor: "Liên bang của chúng ta đã tích trữ đầy đủ cho chiến tranh... thay vào đó, ta có thể dâng lễ vật cho [ROOT.Char.GetFaith.HouseOfWorshipPlural]."
  coronation_events.6011.b: ""Trẻ hay già: đừng để một chiến binh nào nhàn rỗi.""
  coronation_events.6011.b.flavor: "Trong nhà của chúng ta, chẳng phải những thanh niên bồn chồn vẫn mơ về chiến tranh và phiêu lưu sao? Hãy tập hợp họ lại, để một ngày nào đó ta có thể triệu tập họ ra trận!"
  coronation_events.6011.c: ""Hãy chiến đấu cùng ta, những người dũng cảm nhất của [loyal_vassal.GetCulture.GetCollectiveNounNoTooltip]!""
  coronation_events.6011.d_house: ""[ROOT.Char.GetHouse.GetName|U] bảo vệ vương quốc này.""
  coronation_events.6011.d: ""Nghỉ ngơi đi. Canh giữ là nghĩa vụ của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip].""

  mass_mob_dev_tt: "Mỗi [county|E] trong [domain|E] của [supporter.GetShortUINamePossessive] bị giảm [development|E] #N [supporter.MakeScope.Var('mass_mobilitization_development_value').GetValue|0]#!"
  mass_mob_fertility_tt: "Mỗi [county|E] trong [domain|E] của [supporter.GetShortUINamePossessive] bị giảm [county_fertility|E] #N [supporter.MakeScope.Var('mass_mobilitization_fertility_value').GetValue|0]#!"
  mass_mob_dev_progress_tt: "Mỗi [county|E] trong [domain|E] của [supporter.GetShortUINamePossessive] bị giảm [development_growth|E] #N [supporter.MakeScope.Var('mass_mobilitization_development_progress_value').GetValue|0]#!"
  coronation_mobilized_army_name: "Đại Tập Kết của [host.GetTitleAsNamePossessiveNoTooltip]"
  coronation_supporter_declare_war_tt: "[supporter.GetShortUIName] tuyên chiến với [foe.GetShortUIName] để giành [title_claim_1.GetName]"
  coronation_supporter_declare_war_no_title_tt: "[supporter.GetShortUIName] tuyên chiến với [foe.GetShortUIName]"
  coronation_supporter_declare_war_2_tt: "[supporter.GetShortUIName] tuyên chiến với [foe_2.GetShortUIName] để giành [title_claim_2.GetName]"
  coronation_supporter_declare_war_no_title_2_tt: "[supporter.GetShortUIName] tuyên chiến với [foe_2.GetShortUIName]"

  coronation_events.6020.t: "Chiến Khuyển Dành Cho [ROOT.Char.GetTitleAsNameNoTooltip]"
  coronation_events.6020.desc: "\"Sao ta lại phải mỉm cười chứ?\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('supporter'))] của ta, [supporter.GetName], gầm gừ. \"Nhấp [ROOT.Char.Custom('RegionalDrink')], ca ngợi hòa bình, hy vọng vào tương lai của vương quốc...\"\n\n[supporter.GetSheHe|U] trừng mắt nhìn vào ổ rắn đáng ngờ của bọn quý tộc [foe.GetPrimaryTitle.GetAdjective].\n\n\"...trong khi #EMP lũ sâu bọ#! liếc nhìn chúng ta đầy ác ý và âm mưu lật đổ ngài, thưa [ROOT.Char.GetTitleAsName]!\" [supporter.GetSheHe] khạc nhổ. \"Hãy cho ta phép thổi tù và chiến tranh! Ta sẽ nghiền nát [foe.GetName], không còn nghi ngờ gì nữa!\""
  coronation_events.6020.a: ""Dốc cạn lãnh thổ của ngươi vào quân đội, và tấn công!""
  coronation_events.6020.b: ""Bẻ gãy toàn bộ [supporter.GetPrimaryTitle.GetNameNoTierNoTooltip] trước thất bại của [foe_2.GetTitledFirstNamePossessiveNoTooltip]!""
  coronation_events.6020.c: ""Nghiền nát [foe.GetTitledFirstNameNoTooltip], với sự cho phép của ta.""
  coronation_events.6020.d: ""[foe_2.GetTitledFirstNameNoTooltip] là kẻ thù của ngươi!""
  coronation_events.6020.e: ""Thôi nào, thôi nào. Nhiệt huyết ấy nên thuộc về bàn tiệc của ta.""

  coronation_supporter_declares_war_log_title: "Người Ủng Hộ Bị Thả Vào Chiến Tranh"
  coronation_supporter_declares_war_log: "Được vương miện trao quyền và tiếp thêm dũng khí, [supporter.GetShortUIName] đã thách thức [supporter_war_target.GetShortUIName] bước vào chiến tranh."
  coronation_events.6030.t: "Bằng Hữu của [host.GetTitleAsNameNoTooltip] Mới"
  coronation_events.6030.t_feast: "Bằng Hữu của [host.GetTitleAsNameNoTooltip]"
  coronation_events.6030.desc: ""Ồ phải rồi, [ROOT.Char.GetFirstName]," [host.GetTitledFirstName] lẩm bẩm đầy xảo quyệt, "làm [host.GetTitleAsNameNoTooltip] đúng là #EMP tuyệt#!..."\n\nTrước mắt chúng ta là một gian phòng tràn ngập da thịt trần truồng. Các kỹ nữ đỏ mặt mời gọi, khi [host.GetFirstNameNoTooltip] quay sang Ta với nụ cười dâm đãng. "Một [host.GetTitleAsNameNoTooltip] thì phải rộng rãi. Bất kỳ ai trong số những [fearsome_courtesan.GetWomenMen] này, những kẻ đang ăn mừng kia... đều có thể là của ngươi. Của ngươi trong đêm nay, và nhiều đêm nữa... những [fearsome_courtesan.Custom('GirlBoyPlural')] này đang háo hức được chia sẻ #EMP tài năng#! của họ với ngươi.""
  coronation_events.6030.a: "[fearsome_courtesan.GetWomanMan] đáng sợ kia: [fearsome_courtesan.GetSheHe] có thể #EMP nghiền nát ta!#!"
  coronation_events.6030.a_flavor: "Ôi, được chết ngạt trong tay [fearsome_courtesan.GetHerHis]!"
  coronation_events.6030.a_thighs: "Ôi, được chết ngạt giữa đùi [fearsome_courtesan.GetHerHis]!"
  coronation_events.6030.b: "Tên này là một thằng nhóc #EMP bẩn thỉu#!..."
  coronation_events.6030.b_minx: "Còn con này thì là một tiểu yêu tinh #EMP lanh lợi#!..."
  coronation_events.6030.b_flavor: "Cái miệng cười nhếch mép của [cunning_courtesan.GetHerHis|U] hẳn đang ấp ủ những lời dối trá ngọt ngào đến thế..."
  coronation_events.6030.c: "Một người đàn ông lớn tuổi thông minh, đôi tay chai sạn như da thuộc..."
  coronation_events.6030.c_dame: "Một quý bà lớn tuổi khôn ngoan, tinh tế và nghiêm khắc..."
  coronation_events.6030.c_flavor: "Một người có thể bảo #EMP ta#! phải làm gì, đổi gió một chút... một [experienced_courtesan.GetWomanMan] từng trải, dẫn dắt ta bằng những cái chạm đầy hiểu biết."
  coronation_events.6030.d: "Hai anh em quyến rũ ư? Ta sẽ lấy cả hai!"
  coronation_events.6030.d_sisters: "Hai chị em quyến rũ ư? Ta sẽ lấy cả hai!"
  coronation_events.6030.d_flavor: "Bởi vì... chẳng phải [host.GetTitleAsNameNoTooltip] rất rộng rãi sao?"
  coronation_events.6030.e_expose: "Thật đồi bại! Tất cả mọi người sẽ phải biết chuyện này!"
  coronation_events.6030.e: "Có lẽ... chúng ta chỉ nên bàn về thơ ca thôi..."
  coronation_host_orgy_exposed_log_title: "[host.GetTitledFirstNamePossessive] Bị Bắt Quả Tang Với Các Kỹ Nữ."
  coronation_host_orgy_exposed_log: "Những cuộc truy hoan ăn mừng của [host.GetTitledFirstNamePossessive] đã bị [exposer.GetTitledFirstName] phanh phui và lên án."
  host_has_courtesan_hooks_tt: "#weak [host.GetShortUIName] có [hooks|E] đối với tất cả các kỹ nữ này#!"


  coronation_events.6100.t: "Lễ Đội Vương Miện của [host.GetFirstNameNoTooltipRegnal]"
# Host loc
  coronation_events.6100.desc_intro: "Những biểu trưng [host.Custom('GetTitleTierAdjective')] lần lượt được mang ra."
  coronation_events.6100.desc_byzantine: "Chiếc [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] màu tím — rực rỡ dưới ánh sáng của hàng ngàn ngọn nến — được khoác lên vai ta. #EMP \"Vinh danh Thiên Chúa trên trời cao nhất!\"#! đám đông tụ họp hô vang. #EMP \"Và bình an dưới thế!#\"! Vị giáo sĩ xướng lên: \"Nhân danh Chúa Cha, Đức Kitô [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], và Chúa Thánh Thần, ta truyền cho ngươi, [host.GetFirstNameRegnal], hãy cai trị với tư cách là [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')] của người [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )], và là người chăn dắt các tín hữu của Thiên Chúa.\""
  coronation_events.6100.desc_byzantine_femme: "Chiếc [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] màu tím — rực rỡ dưới ánh sáng của hàng ngàn ngọn nến — được khoác lên vai ta. #EMP \"Vinh danh Thiên Chúa trên trời cao nhất!\"#! đám đông tụ họp hô vang. #EMP \"Và bình an dưới thế!#\"! Vị giáo sĩ xướng lên: \"Nhân danh Chúa Cha, Đức Kitô [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], và Chúa Thánh Thần, ta truyền cho ngươi, [host.GetFirstNameRegnal], hãy cai trị với tư cách là [Glossary( 'Augousta', 'AUGOUSTOS_GLOSS')] của người [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )], và là người chăn dắt các tín hữu của Thiên Chúa.\""
  CHLAMYS_GLOSS: "Một loại áo choàng lụa rộng lớn do các quan chức Byzantine mặc, biểu trưng cho quyền lực thế tục đối với nhà nước đế quốc. Được cố định bằng một chiếc trâm fibula, chiếc #G chlamys#! mang những mảng trang trí lớn khảm đá quý gọi là #EMP tablia#!, vốn chỉ dành riêng cho hoàng đế khi được chế tác bằng vàng."
  coronation_events.6100.desc_christian: "Thanh [host.Custom('GetRegionalSword')] lấp lánh được đeo bên hông ta. Quyền trượng của quyền lực tối thượng — được đặt vào tay ta. Các ngón tay ta khép chặt lấy [Glossary( 'globus cruciger', 'GLOBUS_CRUCIGER_GLOSS')]; trên thân thể ta là [Glossary( 'armills', 'ARMILLS_GLOSS')] và [Glossary( 'pallium', 'PALLIUM_GLOSS')]. Những lời cầu nguyện vẫn tiếp tục vang lên."
  coronation_events.6100.desc_high: "Thanh [host.Custom('GetRegionalSword')] sáng ngời được đeo bên hông ta. Những bảo thạch mỹ lệ, những áo choàng huy hoàng được đặt lên người ta. Đồng loạt, những nhân vật ưu tú nhất của [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — các [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] và [host.Custom('KnightCulturePluralNoTooltipLowercase')] của vùng đất — cất lên những lời cầu nguyện cuối cùng, và lời sau chót: \"#EMP [host.GetFaith.HighGodName], xin hãy chứng giám cho [host.GetTitleAsNameNoTooltip|l] yêu dấu của chúng con!#!\""
  coronation_events.6100.desc_low: "Thanh [host.Custom('GetRegionalSword')] cũ kỹ được đeo bên hông ta. Những bảo thạch lòe loẹt, những áo choàng sờn cũ được đặt lên người ta. Ngay cả đám đông cau có của [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — các [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] và [host.Custom('KnightCulturePluralNoTooltipLowercase')] của vùng đất khốn khổ này, ngay cả họ — cũng bị lay động để lẩm nhẩm những lời cầu nguyện cuối cùng, và thốt lên lời sau chót: \"#EMP [host.GetFaith.HighGodName], xin hãy chứng giám cho [host.GetTitleAsNameNoTooltip|l] của chúng con!#!\""
  coronation_events.6100.desc_generic: "Thanh [host.Custom('GetRegionalSword')] sáng ngời được đeo bên hông ta. Những bảo thạch tinh xảo, những áo choàng nặng nề được đặt lên thân thể ta. Đồng loạt, tầng lớp quý tộc của [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — các [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] và [host.Custom('KnightCulturePluralNoTooltipLowercase')] của vùng đất — đọc lên những lời cầu nguyện cuối cùng, và lời sau chót: \"#EMP [host.GetFaith.HighGodName], xin hãy chứng giám cho [host.GetTitleAsNameNoTooltip|l] của chúng con!#!\""
  coronation_events.6100.desc_ending_byzantine_cynical: "\n\nĐược ân ban những bảo vật [host.Custom('GetTitleTierAdjective')], ta quỳ gối trước [crowner.GetTitledFirstNameRegnal]. [crowner.GetSheHe|U] khẳng định rằng chính nhờ ân sủng của Đức Kitô mà ta cai trị, rằng chỉ có lòng thương xót của Thiên Chúa mới bảo vệ được [ROOT.Char.GetPrimaryTitle.GetTierAsName]... nhưng ta mới là người chăn dắt dân chúng của nó. Ta là [ROOT.Char.GetTitleAsNameNoTooltip]. Vận mệnh của người [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] thuộc về ta, chỉ riêng ta mà thôi..."
  coronation_events.6100.desc_ending_byzantine: "\n\nĐược ân ban những bảo vật cổ xưa, [host.Custom('GetTitleTierAdjective')], ta quỳ gối trước [crowner.GetTitledFirstNameRegnal], và trước Đức Kitô — bởi chính nhờ ân sủng thiêng liêng mà ta cai trị, và nhờ lòng thương xót của Ngài mà [ROOT.Char.GetPrimaryTitle.GetTierAsName] vẫn còn tồn tại. Và rồi, cuối cùng..."
  coronation_events.6100.desc_ending_non_abrahamic_vassal: "\n\nĐược ân ban những bảo vật [host.Custom('GetTitleTierAdjective')], ta quỳ gối. Bởi chiếc vương miện của [host.GetPrimaryTitle.GetTierAsName] của ta, biểu trưng của [host.GetPrimaryTitle.GetNameNoTierNoTooltip], từ khoảnh khắc này sẽ mãi mãi... ở ngay trên đầu ta."
  coronation_events.6100.desc_ending_non_abrahamic: "\n\nĐược ân ban những bảo vật [host.Custom('GetTitleTierAdjective')], ta quỳ gối... chỉ một lần cuối cùng này thôi. Vì danh xưng [host.GetTitleAsName] của [host.GetPrimaryTitle.GetNameNoTier], [host.GetTitleAsNameNoTooltip|l] mà ta sắp thực sự trở thành: [host.GetSheHe] không cúi đầu trước bất kỳ ai."
  coronation_events.6100.desc_ending_vassal: "\n\nĐược ân ban những bảo vật [host.Custom('GetTitleTierAdjective')], ta quỳ gối. Vì danh xưng [host.GetTitleAsName] của [host.GetPrimaryTitle.GetNameNoTier], [host.GetTitleAsNameNoTooltip|l] mà ta sắp thực sự trở thành: [host.GetSheHe] cúi đầu trước [host.GetLiege.GetPrimaryTitle.GetAdjective] [host.GetLiege.GetTitleAsName], và trước [host.GetFaith.HighGodName]."
  coronation_events.6100.desc_ending: "\n\nĐược ân ban những bảo vật [host.Custom('GetTitleTierAdjective')], ta quỳ gối... chỉ một lần cuối cùng này thôi. Vì danh xưng [host.GetTitleAsName] của [host.GetPrimaryTitle.GetNameNoTier], [host.GetTitleAsNameNoTooltip|l] mà ta sắp thực sự trở thành: [host.GetSheHe] chỉ cúi đầu trước [host.GetFaith.HighGodName]."

# Guest loc
  coronation_events.6100.desc_byzantine_guest: "Chiếc [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] màu tím — rực rỡ dưới ánh sáng của hàng ngàn ngọn nến — được khoác lên vai [host.GetFirstNamePossessiveRegnal]. #EMP "Vinh quang thuộc về Thiên Chúa trên các tầng trời cao!"#! đám đông tụ họp hô vang. #EMP "Và bình an dưới thế!#" Thầy tu xướng lên: "Nhân danh Chúa Cha, Đức Kitô [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], và Chúa Thánh Thần, ta trao cho ngươi, [host.GetFirstNameRegnal], trọng trách cai trị với tư cách [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')] của [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )], và là người chăn dắt các tín hữu của Chúa.""
  coronation_events.6100.desc_byzantine_femme_guest: "Chiếc [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] màu tím — rực rỡ dưới ánh sáng của hàng ngàn ngọn nến — được khoác lên vai [host.GetFirstNamePossessiveRegnal]. #EMP "Vinh quang thuộc về Thiên Chúa trên các tầng trời cao!"#! đám đông tụ họp hô vang. #EMP "Và bình an dưới thế!#" Thầy tu xướng lên: "Nhân danh Chúa Cha, Đức Kitô [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], và Chúa Thánh Thần, ta trao cho ngươi, [host.GetFirstNameRegnal], trọng trách cai trị với tư cách [Glossary( 'Augousta', 'AUGOUSTOS_GLOSS')] của [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )], và là người chăn dắt các tín hữu của Chúa.""
  coronation_events.6100.desc_christian_guest: "Thanh [host.Custom('GetRegionalSword')] lấp lánh được đeo bên hông [host.GetFirstNamePossessive]. Vương trượng của quyền uy tối thượng — được đặt vào tay [host.GetHerHis]. Các ngón tay [host.GetHerHis|U] siết chặt [Glossary( 'globus cruciger', 'GLOBUS_CRUCIGER_GLOSS')]; trên thân thể [host.GetHerHis] là [Glossary( 'armills', 'ARMILLS_GLOSS')] và [Glossary( 'pallium', 'PALLIUM_GLOSS')]. Những lời cầu nguyện tiếp tục vang vọng."
  coronation_events.6100.desc_high_guest: "Thanh [host.Custom('GetRegionalSword')] sáng loáng được đeo vào hông của [host.GetFirstNamePossessive]. Những viên ngọc quý tuyệt đẹp, những chiếc áo choàng huy hoàng được khoác lên người [host.GetHerHim]. Đồng loạt, tầng lớp tinh hoa trong [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — gồm các [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] và [host.Custom('KnightCulturePluralNoTooltipLowercase')] của vùng đất ấy — cất lên những lời cầu nguyện cuối cùng, và lời cuối cùng vang lên: "#EMP [host.GetFaith.HighGodName], xin hãy chứng giám vị [host.GetTitleAsNameNoTooltip|l] đáng kính của chúng con!#!"
  coronation_events.6100.desc_low_guest: "Thanh [host.Custom('GetRegionalSword')] cũ kỹ được đeo bên hông [host.GetFirstNamePossessive]. Những món trang sức sặc sỡ, những áo choàng sờn cũ được đặt lên [host.GetHerHim]. Ngay cả đám đông cộc cằn của [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — các [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] và [host.Custom('KnightCulturePluralNoTooltipLowercase')] của vùng đất khốn khổ ấy, ngay cả họ — cũng phải lẩm bẩm những lời cầu nguyện cuối cùng, và thốt lên lời sau chót: "#EMP [host.GetFaith.HighGodName], xin hãy chứng giám [host.GetTitleAsNameNoTooltip|l] của chúng con!#!""
  coronation_events.6100.desc_generic_guest: "Thanh [host.Custom('GetRegionalSword')] sáng loáng được đeo bên hông [host.GetFirstNamePossessive]. Những món trang sức tinh xảo, những áo choàng nặng nề được khoác lên thân thể [host.GetHerHis]. Đồng thanh, giới quý tộc của [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — các [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] và [host.Custom('KnightCulturePluralNoTooltipLowercase')] của vùng đất ấy — đọc lên những lời cầu nguyện cuối cùng, và lời sau chót: "#EMP [host.GetFaith.HighGodName], xin hãy chứng giám [host.GetTitleAsNameNoTooltip|l] của chúng con!#!""
  coronation_events.6100.desc_ending_byzantine_guest: "\n\nĐược ban phúc bởi những bảo vật cổ xưa mang tầm vóc [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] quỳ gối trước [crowner.GetTitledFirstNameRegnal], và trước Đức Kitô — bởi chính ân sủng thiêng liêng mà [host.GetSheHe] cai trị, và nhờ lòng thương xót của Thiên Chúa mà [ROOT.Char.GetPrimaryTitle.GetTierAsName] vẫn còn tồn tại. Và rồi, cuối cùng..."
  coronation_events.6100.desc_ending_non_abrahamic_vassal_guest: "\n\nĐược ban phúc bởi những bảo vật mang tầm vóc [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] quỳ gối. Bởi vương miện của [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsName], biểu tượng của [host.GetPrimaryTitle.GetNameNoTierNoTooltip], từ giây phút này sẽ mãi mãi ở ngay phía trên [host.GetHerHim]."
  coronation_events.6100.desc_ending_non_abrahamic_guest: "\n\nĐược ban phúc bởi những bảo vật mang tầm vóc [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] quỳ gối... chỉ thêm một lần cuối cùng này. Bởi danh hiệu [host.GetTitleAsName] của [host.GetPrimaryTitle.GetNameNoTier], [host.GetTitleAsNameNoTooltip|l] mà [host.GetSheHe] sắp thực sự trở thành: [host.GetSheHe] không cúi đầu trước bất kỳ ai."
  coronation_events.6100.desc_ending_vassal_guest: "\n\nĐược ban phúc bởi những bảo vật mang tầm vóc [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] quỳ gối. Bởi danh hiệu [host.GetTitleAsName] của [host.GetPrimaryTitle.GetNameNoTier], [host.GetTitleAsNameNoTooltip|l] mà [host.GetSheHe] sắp thực sự trở thành: [host.GetSheHe] cúi đầu trước [host.GetLiege.GetPrimaryTitle.GetAdjective] [host.GetLiege.GetTitleAsName], và trước [host.GetFaith.HighGodName]."
  coronation_events.6100.desc_ending_guest: "\n\nĐược ban phúc bởi những bảo vật mang tầm vóc [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] quỳ gối... chỉ thêm một lần cuối cùng này. Bởi danh hiệu [host.GetTitleAsName] của [host.GetPrimaryTitle.GetNameNoTier], [host.GetTitleAsNameNoTooltip|l] mà [host.GetSheHe] sắp thực sự trở thành: [host.GetSheHe] chỉ cúi đầu trước [host.GetFaith.HighGodName]."

  GLOBUS_CRUCIGER_GLOSS: "Một \"quả cầu mang thánh giá\", thường được làm từ kim loại quý. Đây là một phần của bảo vật vương quyền, được cầm trên tay như biểu tượng cho quyền thống trị của Đấng Cứu Thế đối với toàn thế giới."
  ARMILLS_GLOSS: "Một cặp giáp tay nghi lễ được chế tác tinh xảo, dùng cho các giáo sĩ cấp cao hoặc quân vương. #G Armills#! thường được trang trí bằng những cảnh như Sự Phục Sinh và Sự Đóng Đinh của Chúa Kitô."
  PALLIUM_GLOSS: "Chiếc áo choàng uy nghi của một quân vương, có quan hệ gần gũi với #G loros#! của đế chế Hy Lạp và #G pallia#! do các chức sắc giáo hội sử dụng."

  coronation_events.6100.a: "Vương miện được đặt lên trán ta."
  coronation_events.6100.a_guest: "Vương miện được đặt lên trán của [host.GetHerHis]."
  coronation_events.6100.a_guest_low: "Vương miện được đặt lên... nhưng sẽ được bao lâu?"
  coronation_events.6100.a_flavor_decent: "Và như vậy, [Glossary( 'coronation crown', 'CORONATION_CROWN_GLOSS')] [host.GetPrimaryTitle.GetAdjectiveNoTooltip] được đặt xuống yên vị."
  coronation_events.6100.a_flavor_low_guest: "Trên đầu [host.GetFirstNameNoTooltipRegnal], [Glossary( 'coronation crown', 'CORONATION_CROWN_GLOSS')] [host.GetPrimaryTitle.GetAdjectiveNoTooltip] trông có phần kỳ lạ..."
  coronation_events.6100.a_flavor_low: "Giữa buổi lễ đáng khinh này, ta khó lòng cảm nhận trọn vẹn sự trang trọng khi chạm vào [Glossary( 'coronation crown', 'CORONATION_CROWN_GLOSS')] [host.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
  coronation_events.6100.a_flavor_giant: "Nhờ [host.GetFaith.HighGodName] chứng giám — [crowner.GetTitledFirstNameNoTooltip] gần như không thể đội vừa chiếc [Glossary( 'coronation crown', 'CORONATION_CROWN_GLOSS')] nhỏ bé này!"
  coronation_events.6100.a_flavor_adolescent: "Hãy nhìn đây: [Glossary( 'coronation crown', 'CORONATION_CROWN_GLOSS')] của ta! Và — #EMP ôi#! — nó gần như sắp rơi xuống che mất mắt ta rồi..."
  CORONATION_CROWN_GLOSS: "Những chiếc vương miện được sử dụng trong nghi lễ đăng quang, trong một số trường hợp, cũng chính là vương miện được sử dụng hằng ngày. #G Vương miện đăng quang#! đôi khi chỉ là những thánh vật phủ bụi, được mang ra duy nhất cho dịp trọng đại này."

  coronation_events.6101.desc_crowning_intro: "Một số người có thể cho rằng đó là sự kiêu ngạo không biết xấu hổ khi một [host.GetTitleAsName] tự tay nâng cao vương miện và đặt nó lên đầu mình, qua đó tuyên bố #EMP chính bản thân [host.GetHerselfHimself]#! là một trong những vị quân chủ được [host.GetFaith.HighGodNamePossessive] lựa chọn trên trần thế.\n\n"
  coronation_events.6101.desc_no_being_crowned_intro: "Một [host.GetTitleAsName|l], khi [host.GetSheHe] khoác lên mình lễ phục trang nghiêm và nhận được sự chấp thuận của thần dân... có thể tự đội vương miện cho chính [host.GetHerselfHimself]. Đó là truyền thống của chúng ta, dù một số [host.GetFaith.BishopNeuterPlural] ghen tị với quyền [host.Custom('GetTitleTierAdjective')] này.\n\n"
# Host loc
  coronation_events.6101.desc_crowning_priests_iberian: "#EMP Hah!#! Chúng ta — những người #EMP Íberos#! — không đồng ý. Chúng ta dâng lời khiêm nhường lên Thiên Chúa và #EMP Đức Trinh Nữ Maria Chí Thánh#!, rồi sau đó làm theo ý mình!"
  coronation_events.6101.desc_crowning_priests_high: "Tuy vậy, số ít [host.GetFaith.PriestNeuterPlural] còn hoài nghi kia lại cất tiếng hát the thé, ánh mắt tràn đầy kinh ngạc khi ta bắt đầu nghi lễ."
  coronation_events.6101.desc_crowning_priests_low: "Quả thật, dưới màn che của đám đông thì thầm, các [host.GetFaith.PriestNeuterPlural] buông ra những lời kết tội u ám."
  coronation_events.6101.desc_crowning_priests_mid: "Mặc kệ [host.GetFaith.NegativeAfterLife] với những kẻ gièm pha ta! Ta chẳng cần đến [host.GetFaith.PriestNeuter] nào cả."
  coronation_events.6101.desc_words_christian: "Nắm chặt chiếc vương miện mang thánh giá trong tay — đọc lên lời rằng \"#EMP Lạy Chúa Trời, Ngài ở trên mọi quân vương; mọi cõi trời đất đều thuộc về quyền thống trị của Ngài#!\" cùng những lời tương tự — ta tự đội vương miện và xưng mình là chủ nhân của [host.GetPrimaryTitle.GetNameNoTier].\n\n"
  coronation_events.6101.desc_words_generic: "Nắm chặt vòng kim loại đính châu báu trong tay, ta cất lời trước toàn thể các [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Ta hứa sự tỉnh thức, công lý và sức mạnh của mình — và ta tự xưng là chủ nhân của [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
  coronation_events.6101.desc_ending_humble: "Với những bước chân chậm rãi và nặng nề, ta tiến về ngai vàng đang chờ đợi. Trở thành một [host.GetTitleAsNameNoTooltip|l] chưa bao giờ là điều nhỏ bé."
  coronation_events.6101.desc_ending: "Cuối cùng, ta tiến đến ngai vàng tối thượng với tư cách là [host.GetTitleAsNameNoTooltip|l] mà ta vốn dĩ được định sẵn trở thành."
# Guest loc
  coronation_events.6101.desc_crowning_priests_high_guest: "Tuy vậy, số ít [host.GetFaith.PriestNeuterPlural] còn hoài nghi kia lại cất tiếng hát the thé, ánh mắt tràn đầy kinh ngạc khi [host.Custom('FormalComplimentAdjective')] [host.GetFirstName] bắt đầu nghi lễ."
  coronation_events.6101.desc_crowning_priests_low_guest: "Quả thật, dưới màn che của đám đông thì thầm, ta nghe thấy các [host.GetFaith.PriestNeuterPlural] buông ra những lời kết tội u ám."
  coronation_events.6101.desc_crowning_priests_mid_guest: "Dẫu vậy, các [host.GetFaith.PriestNeuterPlural] dường như sẵn sàng chấp nhận nghi lễ này. Có lẽ, một quân vương nào đó trong [host.GetFaith.ReligiousText] từng làm điều tương tự."
  coronation_events.6101.desc_words_christian_guest: "Nắm lấy chiếc vương miện hình thánh giá trong tay [host.GetHerHis] — vừa đọc lời cầu nguyện "#EMP Lạy Chúa, Ngài ở trên tất cả các vị vua; quyền cai trị của Ngài thuộc về mọi vương quốc trên trời và dưới đất#!" cùng những lời tương tự — [host.GetFirstNameRegnal] tự đội vương miện, tuyên bố bản thân là chủ nhân của [host.GetPrimaryTitle.GetNameNoTier].\n\n"
  coronation_events.6101.desc_words_generic_guest: "Nắm lấy vòng kim loại được trang điểm bằng châu báu trong tay [host.GetHerHis], [host.GetFirstNameRegnal] cất lời tuyên thệ trước toàn thể [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. [host.GetSheHe|U] cam kết sự tận tâm, công lý và sức mạnh của [host.GetHerHis] — rồi [host.GetSheHe] tự đội vương miện, tuyên bố bản thân là chủ nhân của [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
  coronation_events.6101.desc_ending_humble_guest: "Với những bước chân chậm rãi và nặng nề, [host.GetTitleAsNameNoTooltip] tiến về ngai vàng đang chờ đợi của [host.GetHerHis]. Sự to lớn của việc [host.GetSheHe] vừa làm, của điều mà [host.GetSheHe] đã trở thành, phủ bóng lên gương mặt [host.GetHerHis]."
  coronation_events.6101.desc_ending_guest: "[host.GetTitleAsNameNoTooltip] kiêu hãnh tiến về ngai vàng tối thượng của [host.GetHerHis]."
# Option loc
  coronation_events.6101.a_guest_neg: "Và vì vậy, chúng ta đã chứng kiến tình yêu trái ngang của [host.GetWomanMan] với [host.GetHerselfHimself]."
  coronation_events.6101.a_guest_pos: "Một [host.GetTitleAsNameNoTooltip] chính đáng. Hoan hô!"
  coronation_events.6101.a_guest: "[host.GetSheHe|U] đặt nó. Và [host.GetSheHe] sẽ đội nó."
  coronation_events.6101.a: "Nguyện cho ta được ngồi tại đây nhiều năm sắp tới."
  coronation_events.6101.a_oh_noes: "Chắc là đã quá muộn để quay đầu…"

  coronation_events.6102.t: "Lễ đăng cơ của [host.GetFirstNameNoTooltipRegnal]"
  coronation_events.6102_middle: "\n\nTa bước ra một mình cho nghi lễ tối thượng này, khoác lên mình y phục đăng cơ."
  coronation_events.6102.desc_high_east_asian: "Tiếng chuông ngân vang báo hiệu bước đi lịch sử của ta. Các quan đại thần uy nghiêm, các sứ thần nước ngoài — những kẻ được ban đặc ân chứng kiến khoảnh khắc này — đều quỳ lạy thấp xuống. Vị [host.GetTitleAsName] vĩ đại chiếm ngôi của [host.GetHerHis] quyền lực.\n\n"
  coronation_events.6102.desc_low_east_asian: "Có phải ánh sáng tắt đi khi ta đi qua? Đại sảnh đăng cơ trở nên tối tăm, gần như đen kịt. Chỉ còn những khuôn mặt cúi thấp lấp lánh, trắng bệch, áp sát mặt sàn, như thể dân chúng [host.GetPrimaryTitle.GetNameNoTier] đã chết từ trước.\n\n"
  coronation_events.6102.desc_mid_east_asian: "Mọi việc diễn ra theo trật tự hài hòa của nghi lễ cổ xưa, tất cả quan lại và đại thần quỳ lạy trước mặt ta; ta ngồi vào ngai quyền lực của mình.\n\n"
  coronation_events.6102.desc_high_east_asian_ending_japan: "Theo nguyên tắc ba lần hòa hợp, các chiếu chỉ uy quyền vang lên, những lời phục tùng nhiệt thành được dâng lên, và [Glossary( 'Three Sacred Treasures', 'THREE_SACRED_TREASURES_GLOSS' )] được trình diện trước mặt ta. Ngọc ấn [host.Custom('GetTitleTierAdjective')|U] thuộc về ta, và mọi sự đều tốt đẹp tại [host.GetPrimaryTitle.GetNameNoTier]."
  coronation_events.6102.desc_high_east_asian_ending: "Theo nguyên tắc ba lần hòa hợp, các chiếu chỉ uy quyền vang lên, những lời phục tùng nhiệt thành được dâng, và các báu vật cổ xưa, linh thiêng được trình trước mặt ta. Ngai ấn [host.Custom('GetTitleTierAdjective')|U] thuộc về ta, và mọi việc ở [host.GetPrimaryTitle.GetNameNoTier] đều ổn thỏa."
  coronation_events.6102.desc_low_east_asian_ending_japan: "Các chiếu chỉ vang lên đều đều, [Glossary( 'Three Sacred Treasures', 'THREE_SACRED_TREASURES_GLOSS' )] được trình diện, nhưng khi ta ngồi trên ngai [host.Custom('GetTitleTierAdjective')]... tâm trí ta trở nên xa xăm và u tối..."
  coronation_events.6102.desc_low_east_asian_ending: "Các chiếu chỉ vang ra đều đều, những cổ vật phủ bụi được trình, nhưng khi ta ngồi trên ngai [host.Custom('GetTitleTierAdjective')]... tâm trí ta trôi xa và u ám..."
  coronation_events.6102.desc_mid_east_asian_ending_japan: "Các chiếu chỉ được tuyên bố, các đại thần thề trung thành với chức vụ, và [Glossary( 'Three Sacred Treasures', 'THREE_SACRED_TREASURES_GLOSS' )] được khai mở, như chúng vẫn luôn phải thế. Và cuối cùng, ngọc ấn vĩ đại [host.Custom('GetTitleTierAdjective')|U] thuộc về ta."
  coronation_events.6102.desc_mid_east_asian_ending: "Chiếu chỉ được tuyên bố, các đại thần thề trung thành với chức vụ, và các báu vật cổ xưa được lộ ra, như lẽ phải vốn phải vậy. Và cuối cùng, ngai ấn vĩ đại [host.Custom('GetTitleTierAdjective')|U] thuộc về ta."
  THREE_SACRED_TREASURES_GLOSS: "Báu vật hoàng gia Nhật Bản, được cho là do vị chinh phục huyền thoại, tổ tiên thần thánh của các hoàng đế, mang xuống trần gian. Ba báu vật tượng trưng cho ba đức hạnh chính: #EMP Ame-no-Murakumo-no-Tsurugi#! — 'Kiếm Thiên Trời Họp Mây' — biểu trưng cho dũng khí, chiếc gương đồng #EMP Yata no Kagami#! phản chiếu trí tuệ, và viên ngọc giọt lệ #EMP Yasakani no Magatama#! lý tưởng hóa lòng nhân từ."
  coronation_events.6102.desc_high: "Nhưng… ta không đơn độc. Từ những cống rãnh thấp nhất đến những tòa tháp cao nhất, những tiếng hoan hô vang dội làm rung chuyển bầu không khí trống rỗng — như tiếng gào thét của hàng nghìn người xé tan [host.Custom('ResidenceBuilding')], #EMP khiến nó rung chuyển tận nền đất!#!\n\nTa chiếm lấy ngai vàng không phải với tư cách một [host.GetWomanMan], mà là một [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Không phải một phàm nhân, mà — như thần dân đang hô vang và ca hát — là món quà từ [host.GetFaith.HighGodName] dành cho dân tộc [host.GetPrimaryTitle.GetAdjective], một lời cầu xin hướng đến [host.GetFaith.PositiveAfterLife]!"
  coronation_events.6102.desc_low: "Con đường này thật dài... và yên lặng. Mỗi bước chân vang vọng như giọt nước rơi xuống vực sâu vô tận. [anointer.GetName], với những giọt lệ trong đôi mắt của một giáo sĩ, bắt đầu cất lên một khúc ai ca cổ xưa:\n\n\"#EMP [host.GetFaith.random_GoodGodNames], xin cứu rỗi chúng con! Khỏi vực thẳm, khỏi tuyệt vọng: xin cứu lấy những đứa con của [host.GetPrimaryTitle.GetNameNoTier]! Xin tha cho chúng con, ôi [host.GetFaith.HighGodName], khỏi sự hoang tàn của [host.GetFaith.NegativeAfterLife]! Hãy để [host.GetTitleAsNameNoTooltip|l] của chúng ta chống lại những điều ác của nhân thế!#!\"\n\nTrước buổi triều hội đầy bất an này, ta ngồi lên ngai vàng."
  coronation_events.6102.desc_mid: "Những lời cầu nguyện từ đôi môi ta hòa cùng tiếng tụng ca hùng tráng. Cùng nhau, thần dân và ta cầu nguyện: \"#EMP [host.GetFaith.random_GoodGodNames], xin bảo hộ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] dưới [host.GetFaith.PositiveAfterLife] mãi mãi, từ nay cho đến muôn đời! Vĩnh hằng! Xin [host.GetFaith.random_GoodGodNames] ban sức mạnh cho [host.GetTitleAsNameNoTooltip]!#!\"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] quỳ xuống. Ta chiếm lấy vị trí thiêng liêng, nơi quyền lực của ta ngự trị. #EMP \"Hoan hô [host.GetFirstNameNoTooltipRegnal]!\"#! tất cả cùng hô vang. \"#EMP Theo ý chí của [host.GetFaith.HighGodName], [host.GetTitleAsNameNoTooltip|l] của chúng ta!#!\""
# Guest loc 
  coronation_events.6102_middle_guest: "\n\n[host.GetFirstName] tiến lên, khoác y phục đăng cơ của [host.GetHerHis]."
  coronation_events.6102.desc_high_east_asian_guest: "Những tiếng chuông vang vọng đánh dấu bước chuyển mình lịch sử của [host.GetTitleAsNamePossessiveNoTooltip]. Các đại thần cung kính của [host.GetHerHis|U], những sứ giả ngoại quốc — số ít chúng ta được vinh dự chứng kiến khoảnh khắc này — đều phủ phục xuống thấp. Vị [host.GetTitleAsNameNoTooltip] vĩ đại tiến đến ngai vị cai trị của [host.GetHerHis].\n\n"
  coronation_events.6102.desc_low_east_asian_guest: "Liệu ánh sáng có tắt theo bước chân của [host.GetTitleAsNamePossessiveNoTooltip] chăng? Đại sảnh đăng cơ trở nên tối tăm, gần như chìm vào bóng đêm. Chỉ còn những khuôn mặt cúi thấp mà chiếc áo lễ bẩn thỉu của [host.GetHerHis] đi qua lấp lánh, trắng bệch, áp sát mặt sàn, như thể thần dân của [host.GetPrimaryTitle.GetNameNoTier] đã chết từ trước.\n\n"
  coronation_events.6102.desc_mid_east_asian_guest: "Mọi việc diễn ra theo trật tự hài hòa của nghi lễ cổ xưa, tất cả đều quỳ lạy trước [host.GetTitleAsNameNoTooltip]; và [host.GetSheHe] ngồi lên ngai quyền lực thuộc về [host.GetHerHis].\n\n"
  coronation_events.6102.desc_high_east_asian_ending_japan_guest: "Theo nguyên tắc ba lần hòa hợp, các chiếu chỉ uy quyền vang lên, những lời phục tùng nhiệt thành được dâng, và [Glossary( 'Three Sacred Treasures', 'THREE_SACRED_TREASURES_GLOSS' )] được trình diện. Ngai ấn [host.Custom('GetTitleTierAdjective')|U] được tiếp nhận, và mọi việc ở [host.GetPrimaryTitle.GetNameNoTier] đều ổn thỏa."
  coronation_events.6102.desc_high_east_asian_ending_guest: "Theo nguyên tắc ba lần hòa hợp, các chiếu chỉ uy quyền vang lên, những lời phục tùng nhiệt thành được dâng, và các báu vật cổ xưa, linh thiêng được trình diện. Ngai ấn [host.Custom('GetTitleTierAdjective')|U] được tiếp nhận, và mọi việc ở [host.GetPrimaryTitle.GetNameNoTier] đều ổn thỏa."
  coronation_events.6102.desc_low_east_asian_ending_japan_guest: "Các chiếu chỉ vang lên đều đều, [Glossary( 'Three Sacred Treasures', 'THREE_SACRED_TREASURES_GLOSS' )] được trình diện, nhưng khi vị [host.Custom2('InsultAdjective', SCOPE.sC('host'))] [host.GetTitleAsNameNoTooltip] ngồi ủ rũ trên ngai [host.Custom('GetTitleTierAdjective')]... tâm trí ta trở nên xa xăm và u tối..."
  coronation_events.6102.desc_low_east_asian_ending_guest: "Các chiếu chỉ vang ra đều đều, những cổ vật phủ bụi được trình, nhưng khi [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('host'))] [host.GetTitleAsNameNoTooltip] ngồi ủ rũ trên ngai [host.Custom('GetTitleTierAdjective')]... tâm trí ta trôi xa và u ám..."
  coronation_events.6102.desc_mid_east_asian_ending_japan_guest: "Các chiếu chỉ được tuyên bố, các đại thần thề trung thành với chức vụ, và [Glossary( 'Three Sacred Treasures', 'THREE_SACRED_TREASURES_GLOSS' )] được khai mở, như chúng vẫn luôn phải thế. Và cuối cùng, ngọc ấn vĩ đại [host.Custom('GetTitleTierAdjective')|U] được tiếp nhận."
  coronation_events.6102.desc_mid_east_asian_ending_guest: "Chiếu chỉ được tuyên bố, các đại thần thề trung thành với chức vụ, và các báu vật cổ xưa được lộ ra, như lẽ phải vốn phải vậy. Và cuối cùng, ngai ấn vĩ đại [host.Custom('GetTitleTierAdjective')|U] được tiếp nhận."
  coronation_events.6102.desc_high_guest: "Nhưng… [host.GetSheHe] đâu chỉ thực hiện nghi lễ một mình! Từ những cống rãnh thấp nhất đến những tòa tháp cao nhất, những tiếng hoan hô vang dội làm rung chuyển bầu không khí trống rỗng — như thể tiếng hô của hàng nghìn người có thể khiến [host.Custom('ResidenceBuilding')] rung chuyển!\n\n[host.GetFirstNameNoTooltipRegnal] ngồi lên ngai không phải với tư cách một [host.GetWomanMan], mà là một [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Không phải phàm nhân, mà — như thần dân của [host.GetHerHis] đang hô vang và ca hát — là món quà từ [host.GetFaith.HighGodName] dành cho dân tộc [host.GetPrimaryTitle.GetAdjective]."
  coronation_events.6102.desc_low_guest: "Con đường thật dài... và yên lặng. Mỗi bước chân vang vọng như giọt nước rơi xuống vực sâu vô tận. [anointer.GetName], với những giọt lệ trong đôi mắt của một giáo sĩ, bắt đầu cất lên một khúc ai ca:\n\n"#EMP [host.GetFaith.random_GoodGodNames], xin cứu rỗi chúng con! Khỏi vực thẳm, khỏi tuyệt vọng: xin cứu lấy những đứa con của [host.GetPrimaryTitle.GetNameNoTier]! Xin tha cho chúng con, ôi [host.GetFaith.HighGodName], khỏi sự hoang tàn của [host.GetFaith.NegativeAfterLife]! Hãy để [host.GetTitleAsNameNoTooltip|l] của chúng ta chống lại những điều ác của nhân thế!#!\"\n\nKhi người dân [host.GetPrimaryTitle.GetAdjectiveNoTooltip] lo sợ và than khóc, [host.GetTitledFirstNameNoTooltipRegnal] tiến lên ngai vàng."
  coronation_events.6102.desc_mid_guest: "Những lời cầu nguyện từ đôi môi [host.GetHerHis] hòa cùng tiếng tụng ca dâng cao. Cùng nhau, [host.GetSheHe] và thần dân của [host.GetHerHis] cầu nguyện: "#EMP [host.GetFaith.random_GoodGodNames], xin bảo hộ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] dưới [host.GetFaith.PositiveAfterLife] mãi mãi, từ nay cho đến muôn đời! Vĩnh hằng! Xin [host.GetFaith.random_GoodGodNames] ban sức mạnh cho [host.GetTitleAsName]!#!\"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] cúi thấp người. [host.GetNameNoTooltipRegnal] ngồi vào vị trí thiêng liêng của [host.GetHerHis], nơi quyền lực của [host.GetHerHis] ngự trị. #EMP \"Hoan hô [host.GetFirstNameNoTooltipRegnal]!\"#! tất cả cùng hô vang. \"#EMP Theo ý chí của [host.GetFaith.HighGodName], [host.GetTitleAsNameNoTooltip|l] của chúng ta!#!\""
  coronation_events.6102.a_guest_neg: "[host.GetSheHe|U] là vết nhơ trên ngai cao của [host.GetHerHis]."
  coronation_events.6102.a_guest_pos: "Vinh quang cho ngai [host.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
  coronation_events.6102.a_guest: "Nghi lễ đã hoàn tất. Một [host.GetTitleAsNameNoTooltip] được lập."
  coronation_events.6102.a_host_neg: "#EMP Đây#! là cách triều đại của ta bắt đầu...?"

  coronation_events.6110.t_nomad: "Châu Báu của [ROOT.Char.GetTitleAsNameNoTooltip]"
  coronation_events.6110.t: "Châu Báu của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  coronation_events.6110.desc: "Được long trọng rước đi, những biểu tượng của quyền lực [ROOT.Char.GetPrimaryTitle.GetAdjective] — và"
  coronation_events.6110.desc_crown: "vương miện"
  coronation_events.6110.desc_crowns: "những chiếc vương miện"
  coronation_events.6110.desc_regalia: "bảo vật vương quyền"
  coronation_events.6110.desc_2: "— mà ta sẽ mang — đều thấm đẫm những lời chúc phúc thiêng liêng. Các [ROOT.Char.GetFaith.PriestNeuterPlural] chuẩn bị lễ phục của ta bằng những động tác nghi thức và lời khấn cầu gửi đến"
  coronation_events.6110.desc_st_peter: "Thánh Phêrô, người giữ chìa khóa vương quốc thiên đàng."
  coronation_events.6110.desc_samuel: "Ngôn sứ Samuel."
  coronation_events.6110.desc_generic: "[ROOT.Char.GetFaith.KnowledgeGodName]."
  coronation_events.6110.desc_old_artifact: "\n\nLiệu báu vật xinh đẹp và quý giá [crowning_artifact.GetName] này có được hiến định vĩnh viễn cho [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Khi mà chúng ta đã có một bảo vật vương quyền: [old_title_artifact.GetName]?"
  coronation_events.6110.desc_no_old_artifact: "\n\nVới nghi lễ này, liệu báu vật yêu quý [crowning_artifact.GetName] của ta có được hiến định vĩnh viễn cho [ROOT.Char.GetPrimaryTitle.GetNameNoTier]?"
  coronation_events.6110.desc_no_old_artifact_plural: "\n\nLiệu những báu vật yêu quý [crowning_artifact.GetName] của ta có được hiến định vĩnh viễn cho [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Hay thay vào đó, có lẽ là [crowning_artifact_2.GetName]...?"
  coronation_events.6110.a: "#EMP Ôi, [crowning_artifact.GetNameNoTooltip] — ôi, vinh quang của mọi vinh quang!#!"
  coronation_events.6110.b: "Hiến định báu vật thực sự mang phẩm chất [ROOT.Char.Custom('GetTitleTierAdjective')] là [crowning_artifact_2.GetNameNoTooltip]."
  coronation_events.6110.c: "Hiến định báu vật cao quý [crowning_artifact_3.GetNameNoTooltip]."
  coronation_events.6110.d: "[crowning_artifact_4.GetNameNoTooltip] của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]."
  coronation_events.6110.e: "Dành cho lãnh thổ: [crowning_artifact_5.GetNameNoTooltip]."
  coronation_events.6110.f: "[crowning_artifact.GetNameNoTooltip] thuộc về Gia tộc của ta."
  coronation_events.6110.f_plural: "Những báu vật này thuộc về gia tộc của ta."
  coronation_artifact_unaltered_succession_tt: "[crowning_artifact.GetName] sẽ không bị thay đổi quyền thừa kế"

  coronation_events.6110.f_replacing: "[old_title_artifact.GetNameNoTooltip] vẫn tiếp tục được sử dụng."
