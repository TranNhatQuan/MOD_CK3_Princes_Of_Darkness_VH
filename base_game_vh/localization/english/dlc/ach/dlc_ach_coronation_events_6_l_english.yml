l_english: 
 
  coronation_events.6000.t: "Liên Bang Tụ Họp"
  coronation_events.6000.desc: "Những giọt lệ long lanh trong mắt những vị tù trưởng đồng hành cùng ta — những giọt nước mắt của niềm vui và tiếng cười!\n\nGiữa chúng ta, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))] của ta là [host.GetFirstName] đứng đó: khiêm nhường, không đứng cao hơn tất cả như một vị hoàng đế ngoại bang lạnh lùng nào đó. [host.GetTitleAsName] của chúng ta nghịch với con ngựa của [other_vassal.GetFirstNamePossessiveNoTooltip] cho đến khi con vật cắn vào ngón tay [host.GetHerHim], khiến chúng ta, những quý tộc, bật cười một cách tự nhiên!\n\nCó thể chúng ta không còn đứng thành một hàng ngũ chiến đấu của những người thực sự bình đẳng nữa, nhưng... chúng ta vẫn là [host.GetPrimaryTitle.GetDefinitiveName], và ngày hôm nay thuộc về chúng ta."
  coronation_events.6000.a: ""Ta thề điều này — #EMP Liên Bang, mãi mãi!#!"" 
  coronation_events.6000.a.flavor: "Đừng để đây là những năm tháng tàn lụi của [host.GetPrimaryTitle.GetNameNoTooltip]! Mà là sự tái sinh đích thực của nó!"
  coronation_events.6000.b: ""Đến đây, gia đình: hãy để những người thân đã thề ước biết đến các ngươi!"" 
  coronation_events.6000.b.flavor: "Với tiếng cười của các chiến binh và nụ cười của phụ nữ, gia đình ta sẽ thắp sáng yến tiệc Đăng Quang này."
  coronation_events.6000.c: "Thời thế có thể kỳ lạ, nhưng tất cả chúng ta vẫn là một."
  confederation_remove_destroy_chance_tt: "@alert_icon! #alert_trial [host.GetPrimaryTitle.GetName] sẽ không còn bị phá hủy khi [holder|E] của nó giành được một [kingdom|E] khác#!"
  if_host_accepts_oath_tt: "#high Nếu [liege|E] của Ngài chấp nhận lời hứa này:#!"
  confederation_join_war_offer_tt: "[loyal_vassal.GetShortUIName|U] sẽ tự động tham gia các [wars|E] phòng thủ của [host.GetShortUINamePossessive], miễn là [host.GetPrimaryTitle.GetNameNoTier] vẫn là [primary_title|E] của [host.GetShortUINamePossessive]"
  confederation_alliance: "[loyal_vassal.GetShortUIName|U] và [host.GetShortUIName] trở thành [allies|E]"
  best_commander_gains_defender_tt: "[commander|E] xuất sắc nhất của Ngài nhận #P 3#! [martial_i][martial|E] và đặc tính [GetTrait('unyielding_defender').GetName( GetNullCharacter )]"
  custom.every_fellow_vassal: "Mỗi [vassal|E] đồng liêu"
  confederation_camraderie: "Tinh thần gắn kết giữa các [confederates|E]"
  custom.every_other_culture_confederation: "Mỗi [liege|E] hoặc [vassal|E] đồng liêu theo [culture|E]"
