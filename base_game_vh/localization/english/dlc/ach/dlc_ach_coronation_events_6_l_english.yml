  coronation_events.6120.t: "Lời Thề Trước [host.GetFaith.BishopNeuterPlural|U]"
  coronation_events.6120.desc_cathedral: "Hương trầm lan tỏa trong không khí, khi đoàn rước [ROOT.Char.Custom('GetTitleTierAdjective')] của ta tiến vào nhà thờ chính tòa."
  coronation_events.6120.desc_holy_site: "Hương thánh thiêng vương vấn trong không khí, khi đoàn rước [ROOT.Char.Custom('GetTitleTierAdjective')] của ta tiến vào [ROOT.Char.GetFaith.HouseOfWorship]."
  coronation_events.6120.desc_generic_intro: "Vượt qua cổng [host.Custom('ResidenceBuilding')], đoàn rước [ROOT.Char.Custom('GetTitleTierAdjective')] của ta tiến về một bàn thờ thiêng, nơi các giáo sĩ đang chờ đợi."
  coronation_events.6120.desc_low_magnificence: "Giới quý tộc và các [host.GetFaith.AltPriestTermPlural] chen lấn, đâm thọc nhau để vào vị trí. Vài giọng yếu ớt cất lên những lời cầu nguyện thiêng liêng."
  coronation_events.6120.desc_high_magnificence: "Giới quý tộc, các [host.GetFaith.AltPriestTermPlural], và ta long trọng đứng vào vị trí giữa nhịp điệu trầm bổng lay động tâm hồn của những lời cầu nguyện."
  coronation_events.6120.desc_generic_mid: "Giới quý tộc tách sang hai bên để các [host.GetFaith.AltPriestTermPlural] bước ra, tiếng họ hòa làm một trong lời cầu nguyện thiêng liêng."
  coronation_events.6120.desc_anointment: "\n\nGiờ đây là nghi thức thỉnh cầu của các [host.GetFaith.BishopNeuterPlural], trong khi [hof.GetTitledFirstNameRegnal] chăm chú dõi theo."
  coronation_events.6120.desc: "\n\nGiờ đây là nghi thức thỉnh cầu của các [host.GetFaith.BishopNeuterPlural]."
  coronation_events.6120.desc_low_clergy: "Ta bị những bạo chúa nhỏ nhen này khinh miệt; họ đưa ra yêu cầu thiêng liêng của mình như một sự sỉ nhục.\n\n\"Hỡi kẻ phụng sự [ROOT.Char.GetFaith.HighGodName], ngươi có ăn năn vô số tội lỗi của mình không? Ngươi có thề hiến dâng ý chí phàm tục của mình để bảo vệ các [host.GetFaith.AltPriestTermPlural] yêu dấu của [ROOT.Char.GetFaith.HighGodNamePossessive] không?\""
  coronation_events.6120.desc_high_clergy: "Ta được các vị trung gian của thần linh tôn kính, và với sự cung kính thành tâm, họ khẩn cầu:\n\n\"Hỡi [host.GetTitleAsName] vĩ đại, ngài có bảo vệ các tín đồ và gìn giữ quyền lợi của các [host.GetFaith.AltPriestTermPlural] thuộc về [ROOT.Char.GetFaith.HighGodNamePossessive] không?\""
  coronation_events.6120.desc_mid_clergy: "Ta là một nhân vật khiến các giáo sĩ này còn do dự, và họ đưa ra yêu cầu quen thuộc với sự quan tâm chân thành.\n\n\"Ngài có bảo vệ các tín đồ với tư cách [ROOT.Char.GetTitleAsName] của họ không? Ngài có gìn giữ quyền lợi và đặc quyền của các [host.GetFaith.AltPriestTermPlural] thuộc về [ROOT.Char.GetFaith.HighGodNamePossessive] không?\""
  coronation_events.6120.a: "#EMP \"Ta sẽ là chiếc búa giáng xuống lũ ngoại đạo!\"#!"
  coronation_events.6120.a.flavor: "Thề nguyền, với lòng căm hận tột độ, sẽ tiêu diệt dị giáo và kẻ vô tín sẽ làm hài lòng các [host.GetFaith.AltPriestTermPlural]... và mở đầu triều đại của ta bằng con đường chính nghĩa!"
  coronation_events.6120.b: "Bẻ cong câu trả lời truyền thống theo lợi ích của ta."
  coronation_events.6120.b.flavor: "Ranh giới thật mong manh giữa việc hứa hẹn trung thành với các [ROOT.Char.GetFaith.PriestNeuterPlural] này... và đặt thiên mệnh của ta từ [ROOT.Char.GetFaith.HighGodName] lên trên họ..."
  coronation_denying_clergy_modifier: "Lợi dụng Giáo sĩ"
  coronation_denying_clergy_modifier_desc: "Thay vì hành xử như một người phụng sự đức tin, vị quân chủ này áp đặt quyền lực lên tầng lớp giáo sĩ và nguồn thu của họ."
  coronation_events.6120.c_begrudging: "Ta sẽ nói những lời ấy. Vì ta buộc phải thế."
  coronation_events.6120.c_christian: "\"Ta sẽ bảo vệ thánh hội của Đấng Christ.\""
  coronation_events.6120.c: "\"Ta sẽ bảo vệ các tín đồ của [ROOT.Char.GetFaith.HighGodNamePossessive].\""
  coronation_swore_persecution_modifier: "Lời Thề Đàn Áp"
  coronation_swore_persecution_modifier_desc: "Một phần then chốt trong lễ đăng quang của vị quân chủ này là lời thề hung bạo, không thể nào quên, nhằm truy bức những kẻ vô tín."

  coronation_events.6121.t_kurultai: "Kurultai"
  coronation_events.6121.t: "Sự Khẩn Cầu của Giới Quý Tộc"
  cultural_acceptance_favored_during_oath: "Biểu hiện tôn trọng lẫn nhau trong lời thề đăng quang"
  coronation_events.6121.desc_kurultai: "Không một giọng nói đơn độc nào là người đầu tiên xướng lên tước hiệu của [ROOT.Char.GetTitleAsNamePossessive] trước Bầu Trời Xanh Vĩnh Hằng! Không một bàn tay #EMP duy nhất#! nào giương cao lá cờ đuôi ngựa! Tất cả những thủ lĩnh của các bộ tộc, được tập hợp tại [Glossary( 'kurultai', 'KURULTAI_GLOSS' )] này, phải cùng chấp thuận người sẽ dẫn dắt chiến mã của họ ra trận."
  KURULTAI_GLOSS: "Một hội đồng các lãnh chúa thảo nguyên, tụ họp để bầu chọn người cai trị mới giữa yến tiệc, đấu vật và thi bắn cung. Những chiến dịch quân sự lớn thường được hoạch định trong các dịp này."
  coronation_events.6121.desc_byzantine: "Giới quý tộc tiến lên để cúi mình trước [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')] của họ. Nếu ở chiến trường, và họ là binh sĩ, ta đã được nâng lên trên một chiếc khiên sáng loáng. Ở đây, họ trườn tới để hôn lên đầu gối ta."
  coronation_events.6121.desc_generic_intro: "Chư hầu của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] tiến lên để tuyên thệ trung thành. Từng người một giơ bàn tay mở rộng, từng người một cúi mình trao nụ hôn phong kiến."
  coronation_events.6121.desc_low_approval: "\n\nNhưng... các chư hầu của ta lơ là những cử chỉ kính trọng. Ai đó rít lên \"#EMP [ROOT.Char.GetFirstNameNicknamed]? [vassal_2.Custom('CulturalCurse')|U]!\"#! làm gián đoạn lời lẽ trang nghiêm. [vassal_1.GetTitledFirstNameNicknamed] nhìn ta với ánh mắt đầy độc địa trong lúc tuyên thệ. [vassal_2.GetTitledFirstNameNicknamed] dám mang vũ khí trước mặt ta, và chỉ thì thầm cho có."
  coronation_events.6121.desc_high_approval: "\n\nTa thậm chí còn chưa chính thức trở thành [ROOT.Char.GetTitleAsNameNoTooltip], nhưng sự tận tụy trong những lời khẩn cầu này đủ làm lay động mọi trái tim. Những giọng nói hùng mạnh của vương quốc run rẩy vì xúc cảm, và gương mặt họ rạng ngời hy vọng!"
  coronation_events.6121.desc_mid_approval: "\n\nKhi họ tiến lên, ta trầm ngâm... trong những hơi thở mang danh xưng \"[ROOT.Char.GetTitleAsName]\", ta không cảm nhận được sức nặng của tình yêu, cũng chẳng thấy ánh lên lòng trung thành..."
  coronation_events.6121.a: "\"Những kẻ bất đồng này chỉ là con rối của thế lực ngoại bang!\""
  coronation_events.6121.a.flavor: "Bài diễn văn gieo rắc nỗi sợ của Ngài sẽ khiến những kẻ chỉ trích không còn lựa chọn nào khác ngoài việc từ bỏ các đồng minh ngoại quốc."
  coronation_events.6121.b: "Ta phải ca ngợi những người mới với các tập tục này."
  coronation_events.6121.b_flavor: "Ta đứng dậy, và vinh danh các lãnh chúa thiểu số trong vương quốc!"
  coronation_events.6121.c: "Những người ủng hộ ta vẫn ở bên ta!"
  coronation_events.6121.d: "\"Hãy nhìn xem, bọn phản bội! #EMP Quyền lực của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] đây!#!\""
  coronation_events.6121.d_flavor: "[vassal_2.GetTitledFirstNameNoTooltip] tuốt lưỡi kiếm của [vassal_2.GetHerHis] trước mặt ta — #EMP ta sẽ khiến [vassal_2.GetHerHim] phải dùng nó!#!"
  coronation_events.6121.e_low: "Chúng ghét ta. Nhưng chúng không thể ngăn cản ta."
  coronation_events.6121.e_high: "Sự khuất phục tuyệt đối. Một cảnh tượng mỹ lệ."
  coronation_events.6121.e_mid: "Đây là các chư hầu của ta, trụ cột cho quyền lực của ta."
  coronation_events.6121_duel_tt: "#V Đấu tay đôi#! với [vassal_2.GetShortUIName]\n@death_icon! #X Trận đấu này sẽ đến chết!#!\n[prowess|E] của Ngài: [prowess_i]#V [host.GetProwess]#!\n[prowess|E] của [vassal_2.GetFirstNamePossessive]: [prowess_i]#V [vassal_2.GetProwess]#!"

  coronation_events.6122.t: "Lời Kêu Gọi Quần Chúng"
  coronation_events.6122.desc_intro_foreign: "Những nhân vật cao niên trong hàng ngũ [host.Custom('GetLocalCommonerTermPlural')] của [location.GetTitle.GetNameNoTierPossessive] là những người tiếp theo bước lên, đại diện cho thần dân [host.GetPrimaryTitle.GetAdjective] bình dân của ta đang vắng mặt. Vị [host.GetFaith.BishopNeuter] cảnh báo những bô lão lưng còng ấy về quyền lực và uy quyền to lớn của ta, rồi hỏi sự chấp thuận mang tính biểu trưng cho việc ta trở thành [ROOT.Char.GetTitleAsName] chính danh.\n\n"
  coronation_events.6122.desc_intro: "Những nhân vật cao niên trong hàng ngũ [host.Custom('GetLocalCommonerTermPlural')] của [location.GetTitle.GetNameNoTierPossessive] là những người tiếp theo bước lên, những người ban sự chấp thuận của dân chúng. Vị [host.GetFaith.BishopNeuter] cảnh báo họ về quyền lực và uy quyền to lớn của ta, rồi hỏi liệu họ có chấp nhận ta là [ROOT.Char.GetTitleAsName] chính danh hay không.\n\n"
  coronation_events.6122.desc_high_approval_christian: "Khi họ cất lên những lời quen thuộc, một âm thanh khác vọng đến tai ta. Bên ngoài [ROOT.Char.GetFaith.HouseOfWorship], đám đông đang chờ đợi hát vang [Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )] vì ta. Trong một giọng hợp xướng cuộn trào, hàng trăm linh hồn dâng lời cầu nguyện cho ta!"
  coronation_events.6122.desc_high_approval: "Khi họ cất lời, một âm thanh khác vọng đến tai ta. Bên ngoài [ROOT.Char.GetFaith.HouseOfWorship], đám đông chờ đợi hò reo trong niềm hân hoan. Hàng trăm người gọi tên ta hết lần này đến lần khác:\n\n\"#EMP [ROOT.Char.GetFirstName]! [ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!#!\""
  coronation_events.6122.desc_low_approval: "Họ cất lời, run rẩy, dưới một làn sóng gầm rú ngày càng lớn. Bên ngoài [ROOT.Char.GetFaith.HouseOfWorship], toàn bộ đám dân nghèo của [location.GetTitle.GetNameNoTier] gào thét inh ỏi! Một mớ hỗn loạn khủng khiếp! Có thứ gì đó đã khuấy động họ — một vụ ẩu đả vô nghĩa, một mối thù địa phương... hoặc có lẽ là một [ROOT.Char.GetTitleAsNameNoTooltip] mới mà tất cả đều căm ghét."
  coronation_events.6122.desc_mid_approval: "Họ cất lời đủ đúng nghi thức, và đổi lại ta hứa sẽ bảo hộ họ — vì thiên mệnh của ta không chỉ bao trùm các [ROOT.Char.GetFaith.PriestNeuterPlural] và quý tộc cao sang. Và quê hương của ta, giữa [capital_p.GetTitle.GetNameNoTierPossessive] [capital_p.Custom('TerrainTypeProvince')], được chia sẻ cùng biết bao [capital_p.GetCulture.GetName] hạ dân."
  coronation_events.6122.a: "Nguyện cho những người có mặt nơi đây không bao giờ quên ngày hôm nay!"
  coronation_events.6122.a.flavor: "Những con người trung thành này xứng đáng được diện kiến trực tiếp! Và bánh mì từ chính [ROOT.Char.GetTitleAsNameNoTooltip] của họ!"
  coronation_events.6122.b: "Đủ rồi. Tất cả những kẻ lên tiếng phản đối phải bị đánh đập."
  coronation_events.6122.b.flavor: "Hãy để đám đông ồn ào này, và mọi kẻ trong vương quốc, nếm mùi chiếc ủng của [host.Custom('GetFighterTermPossessive')]!"
  coronation_events.6122.c_low: "Nhưng ta trị vì trên tất cả bọn họ."
  coronation_events.6122.c_high: "Xem chúng #EMP cầu xin#! triều đại của ta kìa!"
  coronation_events.6122.c_mid: "Ta lấy làm vinh dự."
  coronation_events.6122.c_v_low_humble: "Cảnh ngộ của dân đen khiến ta xúc động."
  coronation_events.6122.c_v_low: "Lũ hạ dân bẩn thỉu."

  coronation_events.6123.t: "Ba Lần Chuẩn Thuận"
  coronation_events.6123.desc_intro: "Chỉ khi các [host.GetFaith.BishopNeuterPlural], giới quý tộc [host.GetPrimaryTitle.GetAdjective], và dân chúng đều hoàn thành vai trò theo nghi thức của mình, thì [host.GetFirstName] mới thực sự là một [host.GetTitleAsNameNoTooltip|l]. Quyền cai trị của [host.GetHerHis|U] sẽ không thể chính danh nếu thiếu sự chấp thuận của họ.\n\nTrước hết, là các [ROOT.Char.GetFaith.PriestNeuterPlural]."

  coronation_events.6123.desc_low_clergy: "Với những chiếc cằm ngẩng cao đầy vẻ tự mãn, họ buộc [host.GetTitleAsNameNoTooltip|l] không chỉ phải thề bảo vệ các tín đồ [host.GetFaith.GetAdherentName], mà còn phải sám hối những tội lỗi của [host.GetHerHis]."
  coronation_events.6123.desc_high_clergy: "Với sự tôn sùng, họ ca ngợi tình yêu to lớn và lòng mộ đạo của [host.GetTitleAsNamePossessiveNoTooltip|l] dành cho việc bảo hộ các [host.GetFaith.GetAdherentNamePlural], và cầu xin [host.GetSheHe] trở thành vị quán quân vĩ đại của họ."
  coronation_events.6123.desc_mid_clergy: "Họ kêu gọi [host.GetTitleAsNameNoTooltip|l] tôn trọng những quyền thiêng liêng của mình, và bảo vệ các tín đồ. [host.GetFirstNameNoTooltip] chấp thuận."

  coronation_events.6123.desc_then: "Sau đó"
  coronation_events.6123.desc_pop_foreign: "những [host.Custom('GetLocalCommonerTermPlural')] địa phương đại diện cho dân thường [host.GetPrimaryTitle.GetAdjective]. Và"
  coronation_events.6123.desc_low_populace: "các bô lão của [location.GetTitle.GetBaseNameNoTier] bước ra, run rẩy vì sợ hãi, khi một cuộc bạo loạn đang hoành hành bên ngoài [ROOT.Char.GetFaith.HouseOfWorship]. Đám dân ô hợp nơi đây chẳng hề có chút yêu mến nào dành cho [host.GetTitleAsNameNoTooltip|l].\n\n"
  coronation_events.6123.desc_high_populace: "các bô lão của [location.GetTitle.GetBaseNameNoTier] nhìn [host.GetTitleAsNameNoTooltip|l] với ánh mắt kinh ngạc, trong khi đám đông bên ngoài tôn vinh danh xưng [host.Custom('GetTitleTierAdjective')] của [host.GetHerHis].\n\n"
  coronation_events.6123.desc_mid_populace: "các bô lão của [location.GetTitle.GetBaseNameNoTier] khàn giọng cất lời công nhận mang tính biểu trưng, và [host.GetTitleAsNameNoTooltip|l] hứa ban phát tình thương của một bậc [host.Custom('GetMaternalPaternal')] cho tầng lớp hạ dân.\n\n"

  coronation_events.6123.desc_low_vassals: "Các chư hầu của [host.GetFirstNamePossessiveNoTooltip] tiến lên với vẻ u ám. Phần lớn bọn họ gần như chẳng buồn nói lời trung thành giữa những cử chỉ đầy thù địch."
  coronation_events.6123.desc_high_vassals: "Các chư hầu của [host.GetFirstNamePossessiveNoTooltip] bước ra để cúi mình khẩn cầu: đa số ánh lên niềm hy vọng, và thành tâm thề trung thành cùng lòng yêu mến."
  coronation_events.6123.desc_mid_vassals: "Các chư hầu của [host.GetFirstNamePossessiveNoTooltip] bước lên để hôn và thề trung thành. Có kẻ xem hành động này là vinh dự tối cao; kẻ khác lẩm bẩm u uất và không rời mắt khỏi bụi đất."

  coronation_events.6123.desc_end_vassal: "Cuối cùng thì... đến lượt ta."
  coronation_events.6123.desc_end_spectator: "Buổi nghi lễ vẫn tiếp diễn, hết lần này đến lần khác."
  coronation_events.6123.a: "Ta cất cao lời thề, #EMP với lòng tận hiến tuyệt đối!#!"
  coronation_events.6123.a_flavor: "Hãy nâng cao tiếng nói, các bằng hữu của ta! Hô vang danh xưng huy hoàng của [host.GetTitleAsNamePossessiveNoTooltip|l] mới!"
  coronation_events.6123.b: "Ta biến sự khinh miệt của mình thành một vụ bê bối."
  coronation_events.6123.b_flavor: "Nghi lễ nhỏ nhoi của [host.GetFirstNamePossessiveNoTooltip] mà đòi hỏi sự khuất phục của ta ư? Ta thà làm cho những kẻ ủng hộ khốn khổ của hắn choáng váng, rồi nhổ vào mặt [host.GetHerHis]!"
  coronation_events.6123.c_vassal_resents: "Ta lẩm bẩm những lời theo lệ thường."
  coronation_events.6123.c_vassal_pleased: "Ta quỳ gối trước [host.GetFirstNameNoTooltipRegnal], [host.GetTitleAsNameNoTooltip] chân chính."
  coronation_events.6123.c_vassal_neutral: "Ta quỳ gối trước [host.GetTitleAsNameNoTooltip] của mình."
  coronation_events.6123.c_likes_disrespect: "Các chư hầu của [host.GetFirstNamePossessiveNoTooltip] nhìn thấu trò hề này..."
  coronation_events.6123.c_dislikes_disrespect: "[host.GetTitleAsNameNoTooltip] của họ xứng đáng được đối xử tốt hơn!"
  coronation_events.6123.c_dislikes_loyalty: "Lũ sâu bọ [host.GetPrimaryTitle.GetAdjectiveNoTooltip] này chỉ xứng nằm rạp dưới đất..."
  coronation_events.6123.c_likes_loyalty: "Bằng chứng cho danh dự của họ, và đức hạnh của [host.GetFirstNamePossessiveNoTooltip]."
  coronation_events.6123.c_dislikes_host: "Tưởng tượng mà xem, phải thề trung thành với tên [host.Custom('InsultNoun')] ghê tởm đó..."
  coronation_events.6123.c: "[host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] tự trình diện trước [host.GetFirstNameNoTooltipRegnal]."

  coronation_supporter_pledge_leader_log_title: "Người Ủng Hộ Dẫn Đầu Lời Thề Trung Thành"
  coronation_detractor_pledge_insult_log_title: "Kẻ Phản Đối Khinh Miệt Lời Thề Với Lãnh Chúa Mới"

