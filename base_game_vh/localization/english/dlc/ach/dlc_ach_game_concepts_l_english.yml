l_english: 
  game_concept_coronation: "Lễ Đăng Quang"
  game_concept_coronations: "Các Lễ Đăng Quang"
  game_concept_coronation_desc: "Lễ Đăng Quang là một [activity|E] trong đó một [ruler|E] mời các [vassals|E], những người đồng cấp và các [guests|E] từ khắp nơi đến chứng kiến việc họ bước lên ngai vàng.\n\nLễ Đăng Quang có hai hình thức: Đăng Quang thường và [anointment|E], trong đó hình thức sau mang lại phần thưởng tốt hơn nhưng cũng đi kèm chi phí lớn hơn.\n\nPhần thưởng dự kiến:\n$activity_coronation_host_desc$"
  game_concept_coronation_i: "@activity_coronation!"

  game_concept_oath: "Lời Thề"
  game_concept_oaths: "Các Lời Thề"
  game_concept_oath_desc: "Lời Thề được tuyên thệ trong [activity|E] [coronation|E] bởi [host|E], và đóng vai trò quan trọng trong việc bảo đảm [legitimacy|E] của một [ruler|E] mới khi họ bước lên ngai vàng.\n\nCác Lời Thề sẽ mở khóa những [decisions|E] đặc biệt có giới hạn thời gian, mà người cai trị phải hoàn thành để chứng minh mình xứng đáng với [title|E] của mình. Phần thưởng nhận được sẽ bị ảnh hưởng bởi mức [coronation_magnificence|E] của lễ đăng quang."

  game_concept_coronation_magnificence: "Sự Lộng Lẫy"
  game_concept_coronation_magnificence_desc: "Sự Lộng Lẫy của một [coronation|E] quyết định kết quả của [activity|E]; mức Lộng Lẫy càng cao thì kết quả dành cho [host|E] càng tốt.\n\nSự Lộng Lẫy có thể đạt được thông qua các [intents|E], [activity_options|E] và các sự kiện trong hoạt động. Các [coronation_supporters|E] và [coronation_detractors|E] cũng có thể ảnh hưởng đến giá trị này."

  game_concept_coronation_supporter: "Người Ủng Hộ"
  game_concept_coronation_supporters: "Những Người Ủng Hộ"
  game_concept_coronation_supporter_desc: "Người Ủng Hộ là các [activity_guests_short|E] tại [activity|E] [coronation|E], ủng hộ [host|E] trong việc bước lên ngai vàng. Họ sẽ có những cơ hội đặc biệt để giúp [ruler|E] củng cố [legitimacy|E] của mình.\n\nHọ đối lập trực tiếp với các [coronation_detractors|E], những vị khách đang tìm cách phá hoại chủ lễ."

  game_concept_coronation_detractor: "Kẻ Phản Đối"
  game_concept_coronation_detractors: "Những Kẻ Phản Đối"
  game_concept_coronation_detractor_desc: "Kẻ Phản Đối là các [activity_guests_short|E] tại [activity|E] [coronation|E], chống lại [host|E] trong việc bước lên ngai vàng. Họ sẽ tìm cách cản trở [ruler|E] và làm tổn hại đến [legitimacy|E] của người đó.\n\nHọ đối lập trực tiếp với các [coronation_supporters|E], những vị khách đang cố gắng giúp đỡ chủ lễ."

  game_concept_coronation_anointment: "Xức Dầu Thánh"
  game_concept_anointment: "$game_concept_coronation_anointment$"
  game_concept_anointments: "Các Lễ Xức Dầu Thánh"
  game_concept_coronation_anointment_desc: "Xức Dầu Thánh là một hình thức của [coronation|E], trong đó [ruler|E] sẽ tìm đến [head_of_faith|E] để ban phúc cho việc bước lên ngai vàng của mình. Trong một số tín ngưỡng, điều này là cần thiết để thực sự được xem là một người cai trị [legitimate|E] trên vùng đất của họ.\n\nĐể bảo đảm sự ủng hộ của Giáo Chủ, [host|E] có thể sử dụng [interaction|E] [anointment_request|E]."

  game_concept_anointment_request: "Yêu Cầu Xức Dầu Thánh"
  game_concept_request_anointment: "$game_concept_anointment_request$"
  game_concept_anointment_request_desc: "Yêu Cầu Xức Dầu Thánh là một [character_interaction|E] đặc biệt, cho phép một [ruler|E] sử dụng với [head_of_faith|E] của mình để giành được sự ủng hộ trong một lễ [anointment|E]."
