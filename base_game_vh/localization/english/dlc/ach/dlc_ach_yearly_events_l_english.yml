l_english:

  ach_yearly_events.1001.t: "Vấn Đề Tài Chính"
  ach_yearly_events.1001.desc: "Với cương vị là [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] của chủ thượng, [liege.GetTitledFirstName], bổn phận của ta là cố vấn cho [liege.GetHerHim] trong việc quản lý ngân khố. Một phần không nhỏ của nhiệm vụ ấy là giải thích lợi ích và bất lợi của các thói quen chi tiêu khác nhau.\n\n\"Vậy hãy nói lại cho ta nghe,\" [liege.GetSheHe] hỏi, \"đâu là những #EMP mặt trái#! thực sự của việc tích trữ ngân khố? Chẳng phải dành dụm cho lúc khó khăn là điều đúng đắn sao?\"\n\nỪ thì… [liege.GetSheHe|U] không sai, nhưng cách nhìn ấy có phần quá đơn giản..."
  ach_yearly_events.1001.a: "\"Nếu ngài còn do dự, #EMP chính thần#! có thể quản lý thay cho ngài...\""
  ach_yearly_events.1001.a.success: "[liege.GetFirstNameNoTooltip] vui vẻ giao lại tiền bạc"
  ach_yearly_events.1001.a.failure: "[liege.GetFirstNameNoTooltip] nghi ngờ kế hoạch của Ngài"
  ach_yearly_events.1001.b: "Thận trọng là con đường đúng đắn."
  ach_yearly_events.1001.c: "Một [liege.GetTitleAsNameNoTooltip] xứng đáng được sống sung túc!"
  ach_yearly_events.1001.d: "Có lẽ một cách tiếp cận cân bằng là tốt nhất?"
  ach_yearly_events.1001.d.success: "[liege.GetFirstNameNoTooltip] tán thưởng sự sáng suốt của Ngài"
  ach_yearly_events.1001.d.failure: "[liege.GetFirstNameNoTooltip] chế giễu sự trung dung của Ngài"

  ach_fence_sitter_modifier: "Kẻ Đứng Giữa"
  ach_fence_sitter_modifier_desc: "Sự do dự của nhân vật này đã quá nổi tiếng, và họ bị tai tiếng vì luôn né tránh việc đưa ra lập trường rõ ràng."
  ach_spending_advice_modifier: "Cố Vấn Chi Tiêu"
  ach_spending_advice_modifier_desc: "Nhân vật này chuyên đưa ra những lời khuyên tài chính hợp lý."
  ach_cautious_spender_modifier: "Chi Tiêu Thận Trọng"
  ach_cautious_spender_modifier_desc: "Nhân vật này giữ chặt hầu bao."
  ach_extravagant_spender_modifier: "Chi Tiêu Xa Hoa"
  ach_extravagant_spender_modifier_desc: "Nhân vật này chi tiêu hào phóng khi cần thiết."
  ach_budgeting_mentor_modifier: "Thầy Dạy Quản Lý Ngân Khố"
  ach_budgeting_mentor_modifier_desc: "Nhân vật này là một chuyên gia tài chính có tiếng, có thể chỉ dạy người khác cách chi tiêu tiền bạc khôn ngoan nhất."
  ach_balanced_budget_modifier: "Ngân Sách Cân Bằng"
  ach_balanced_budget_modifier_desc: "Nhân vật này hưởng lợi từ việc quản lý tài chính cực kỳ hiệu quả."

  ach_yearly_events.1002.t: "Ổ Chuột"
  ach_yearly_events.1002.desc: "Với cương vị [Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] của [liege.GetPrimaryTitle.GetNameNoTier], ta thề sẽ túm lấy đuôi những chư hầu lạc lối, ngăn lũ chuột bọ xâm nhập vào [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] tụ họp thành một bầy đàn khổng lồ...\n\nKhi [faction.GetName] đang dần tích tụ thế lực, những kẻ bất mãn như [faction_member.GetName] rong ruổi khắp nơi, thì thầm vào những đôi tai mong manh.\n\n\"[unjoined_vassal.GetPrimaryTitle.GetNameNoTier] rất mạnh, và cũng đang đói khát,\" kẻ phản bội xúi giục [unjoined_vassal.GetTitleAsNameNoTooltip], [unjoined_vassal.GetFirstName]. \"Hãy tin vào sức mạnh ấy, cơn đói ấy... và vào chúng ta.\""
  ach_yearly_events.1002.a: "Âm mưu của lũ chuột phải bị cô lập."
  ach_yearly_events.1002.b: "$ach_yearly_events.1002.a$"
  ach_yearly_events.1002.b.success: "Ngài đầu độc tư tưởng phản loạn"
  ach_yearly_events.1002.b.failure: "Sự khinh miệt mỉa mai của Ngài không có tác dụng"
  ach_yearly_events.1002.c: "Ta lại phải cúi đầu phục tùng sao? Tiếng nói của ta phải được lắng nghe!"
  ach_yearly_events.1002.c.flavor: "Ta là tiếng nói hàng đầu trong vương quốc. Và cũng là tiếng nói #EMP bất đồng#! hàng đầu!"
  ach_yearly_events.1002.d: "Chuột sẽ bị xử lý... từng con một."
  ach_yearly_events.1002.d.flavor: "Với cương vị [Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )], ta đủ ảnh hưởng để khiến tên phản loạn [faction_member.GetTitleAsNameNoTooltip] này phải im tiếng."
 
  ach_chancellor_isolating_factions_modifier: "Tể Tướng Cô Lập Phe Phái"
  ach_chancellor_isolating_factions_modifier_desc: "Người ủng hộ vị quân chủ này khéo léo biến các kẻ phản loạn và chống đối thành những kẻ bị ruồng bỏ.\n#weak [vassals|E] ít có khả năng gia nhập [factions|E]#!"
 
  chancellor_isolates_factions_title: "[Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] Làm Suy Yếu Sự Ủng Hộ Phe Phái"
  chancellor_isolates_factions_desc: "[ROOT.Char.GetTitledFirstName] xoay chuyển dư luận giữa các chư hầu theo hướng có lợi cho Ngài."
  chancellor_removes_faction_member_title: "[Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] Xoa Dịu Thành Viên Phe Phái"
  chancellor_removes_faction_member_desc: "[ROOT.Char.GetTitledFirstName] chứng tỏ là đối thủ quyết liệt của các chư hầu bất mãn."
 
  ach_yearly_events.1003.t: "Chủ Soái Trận Mạc"
  ach_yearly_events.1003.desc: "Cuộc xung đột của chủ công ta với [foe.GetPrimaryTitle.GetNameNoTier] vẫn kéo dài chưa dứt. Với tư cách là [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )] của [liege.GetHerHis], ta phải vạch ra kế hoạch hậu cần, huy động [liege.Custom('GetLocalCommonerTermPlural')] vào phục vụ, dẹp yên những cuộc bất ổn trong dân chúng... nhưng giờ đây những kỵ sĩ mang đến những tin dữ.\n\nTại [battle_province.GetName], [liege.Custom('KnightCulturePluralNoTooltip')|l] của [liege.GetPrimaryTitle.GetNameNoTier] đã thất bại. Tuyến chiến trận của [commander.GetNamePossessive] đã bị phá vỡ, và toàn bộ quân đội của chúng ta bị đẩy vào một cuộc tháo chạy tuyệt vọng. Giờ đây, khi các [liege.Custom('GetFighterTermPlural')] của chúng ta đang bỏ chạy, đạo quân của [foe.GetNamePossessive] đang tiến thẳng về phía [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\n\nCác cố vấn của ta thúc giục ta phải chứng minh bản thân xứng đáng với chức vụ; phải nắm lấy dây cương của thảm họa này bằng một bàn tay bọc giáp."
  ach_yearly_events.1003.a: "Giờ là lúc cần đến sức mạnh của một [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )]!"
  ach_yearly_events.1003.b: "[ROOT.Char.Custom('KnightCulturePluralNoTooltip')]! #EMP Hãy lên ngựa cứu lấy [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!#!"
  ach_yearly_events.1003.c: "Ta sẽ tập hợp tàn quân."
  ach_yearly_events.1003.c.success: "Những người sống sót tụ họp dưới cờ của [liege.GetTitledFirstNamePossessiveNoTooltip]"
  ach_yearly_events.1003.c.failure: "Ít kẻ hưởng ứng lời triệu tập của Ngài"
  ach_yearly_events.1003.d: "Đánh roi những kẻ sống sót vì sự thất bại của chúng."
  ach_yearly_events.1003.d.flavor: "...và cả tên [liege.GetTitleAsNameNoTooltip] ngu ngốc đó nữa, nếu [liege.GetSheHe] dám lải nhải rằng đây là #EMP lỗi của ta#!!"
 
  marshal_joins_war_title: "Nguyên Soái Tham Chiến"
  marshal_joins_war_desc: "Thất bại thảm khốc của Ngài đã thúc đẩy [marshal.GetTitledFirstName] xông pha trận mạc!"
  marshal_joins_war_title_foe: "Nguyên Soái Địch Tham Chiến"
  marshal_joins_war_desc_foe: "Thất bại thảm khốc của [liege.GetShortUINamePossessive] đã khiến [marshal.GetShortUIName], vị [marshal|E] của [liege.GetHerHis], quyết định tham gia vào [combat_war.GetName]."

  marshal_aids_troop_recovery_title: "[Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )] Tập Hợp Quân Bại Trận"
  marshal_aids_troop_recovery_desc: "[ROOT.Char.GetTitledFirstName] phản ứng quyết liệt trước thất bại của quân đội Ngài."
  ach_marshal_reconstituting_army_modifier: "Nguyên Soái Tái Tổ Chức Quân Đội"
  ach_marshal_reconstituting_army_modifier_desc: "Sau một thất bại thảm khốc, Nguyên soái của nhân vật này nỗ lực khôi phục quân đội trở lại trạng thái sẵn sàng chiến đấu."
 
  custom.every_liege_domain_county: "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$Mọi [county|E] thuộc [domain|E]"
  custom.every_liege_lending_vassal: "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$Mọi [powerful_vassal|E] có đủ [gold|E]"
 
  ach_yearly_events.1004.t: "Chiếc Túi Tiền To Lớn Nhưng Xẹp Lé"
  ach_yearly_events.1004.desc: "Lãnh chúa khốn khó của ta, [liege.GetTitledFirstName], và ta — với tư cách là [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] của [liege.GetHerHis] — có dịp trò chuyện. Dẫu vậy... cuộc đối thoại diễn ra giữa tiếng la ó của đám đông về sự trống rỗng của kho bạc [liege.Custom('GetTitleTierAdjective')].\n\n\"Họ gào thét vì khao khát những vinh quang mới!\" [liege.GetTitledFirstNameNoTooltip] rộng lượng diễn giải.\n\n\"Nhưng chúng ta sẽ giành vinh quang bằng thứ gì?\" ta hỏi. \"Những ngọn giáo bọc vàng? Mũi tên nạm đá quý? Tài sản của vương quốc đã cạn kiệt, chỉ còn lại #EMP vinh quang#!...\"\n\n"
  ach_yearly_events.1004.desc_end: "\"Chỉ là mơ tưởng viển vông!\" [liege.GetSheHe] đáp. \"Ta hiểu quá rõ tình trạng kho bạc...\""
  ach_yearly_events.1004.desc_harsh: "\"Ngươi là [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] của ta,\" [liege.GetSheHe] đáp. \"Hãy tìm vàng. Tìm đá quý.\""
  ach_yearly_events.1004.a: "\"Ta có thể lấy từ các chư hầu của ngài và gánh chịu mọi oán trách.\""
  ach_yearly_events.1004.a.flavor: "Khi kho bạc suy kiệt, có lẽ một [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] phải trở nên cứng rắn... và bị căm ghét."
  ach_yearly_events.1004.b: "Từ cần mẫn và thời gian, của cải có thể sinh sôi."
  ach_yearly_events.1004.b.success: "Ngài cải tổ hiệu quả nền hành chính địa phương"
  ach_yearly_events.1004.b.failure: "Bản năng của Ngài tỏ ra đáng kinh ngạc là vô dụng"
  ach_yearly_events.1004.c: "Từ cần mẫn và thời gian, của cải sẽ nảy nở."
  ach_yearly_events.1004.d: "\"Khi dân chúng của ngài bắt đầu chết đói, hãy gửi họ đến chỗ ta.\""
  ach_yearly_events.1004.d.flavor: "Không bổn phận nào có thể buộc ta vá víu chiếc túi tiền rách nát của con nợ này..."
 
  ach_stewardship_bankruptcy_modifier: "Nền Hành Chính Hướng Tới Thịnh Vượng"
  ach_stewardship_bankruptcy_modifier_desc: "Khi nguy cơ phá sản đe dọa vương quốc, luật lệ địa phương được siết chặt và lực lượng được điều sang nhiệm vụ dân sự."
 
  ach_welcoming_lieges_creditors_modifier: "Đón Nhận Những Kẻ Khốn Cùng"
  ach_welcoming_lieges_creditors_modifier_desc: "Dân số địa phương gia tăng: sự quản lý tài chính yếu kém ở nơi khác khiến nhiều gia đình phải di cư tới đây."
 
  steward_aids_financial_recovery_title: "[Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] Tìm Lối Thoát Tài Chính"
  steward_aids_financial_recovery_desc: "[ROOT.Char.GetTitledFirstName] cải tổ [domain|E] của Ngài để ứng phó với khó khăn tài chính."
  steward_gathers_emergency_tithe_title: "[Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] Thu Thuế Khẩn Cấp Từ Chư Hầu"
  steward_gathers_emergency_tithe_desc: "Để giải quyết khó khăn kho bạc, [ROOT.Char.GetTitledFirstName] đã áp đặt khoản thu bất thường này và gánh chịu mọi chỉ trích."
 
  custom.every_scope_faction_member: "Mọi thành viên của #high [faction.GetName]#!"

  ach_yearly_events.1005.t: "[ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
  ach_yearly_events.1005.desc: "\"Nhiều năm đã trôi qua kể từ khi ngài bước lên ngai vàng của [ROOT.Char.GetPrimaryTitle.GetName]. Ngài là chủ nhân thực sự của vùng đất này, là người bảo hộ cho thần dân đang sinh sống trong lãnh địa của ta.\"\n\nLời nói của [messenger.GetNamePossessive] tràn đầy niềm tin. Mối quan tâm của [messenger.GetHerHis|U] dành cho vương quốc ta là chân thành.\n\n\"Thế nhưng trán ngài vẫn trống trơn, chưa được điểm xuyết bởi vương miện được xức thánh. Tay ngài trống rỗng, thiếu vắng bảo vật linh thiêng. Dù không ai dám thách thức quyền lực của ngài, ngài #EMP phải#! tổ chức một lễ đăng quang xứng đáng. Bằng không, ta e ngại cho tương lai của [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\""
  ach_yearly_events.1005.a: "Gọi thợ rèn đến cho ta."
  ach_yearly_events.1005.b: "Hãy bắt đầu chuẩn bị."
  ach_yearly_events.1005.c: "Ta sẽ tổ chức sau."

  ach_yearly_events.1010.t: "Sự Công Nhận [ROOT.Char.Custom('GetTitleTierAdjective')|U]"
  ach_yearly_events.1010.desc: "Ta đã trở thành [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive] [ROOT.Char.GetTitleAsName]: một nhân vật vĩ đại và đáng sợ giữa trật tự loài người, ý chí của ta định đoạt vận mệnh của hàng nghìn sinh linh mỗi khi được thi hành.\n\nVới tư cách là chủ nhân của [title.GetNameNoTier], ta đã giành được quyền cai trị của mình."
  ach_yearly_events.1010.desc_vassals: "Nhưng giờ đây, dân chúng [title.GetAdjectiveNoTooltip], cùng tất cả những ai quy phục dưới lá cờ hùng mạnh của [ROOT.Char.GetPrimaryTitle.GetName] — những [vassal_title_1.GetAdjective] [ROOT.Char.Custom('GetLocalCommonerTermPlural')], giới quý tộc [vassal_title_2.GetAdjective] — tất cả thần dân [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] này phải công nhận địa vị [ROOT.Char.Custom('GetTitleTierAdjective')] của ta."
  ach_yearly_events.1010.desc_no_vassals: "Nhưng giờ đây, giới quý tộc [title.GetAdjectiveNoTooltip], cùng toàn thể thần dân thuộc dưới lá cờ hùng mạnh của [ROOT.Char.GetPrimaryTitle.GetName]... những thần dân [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] này phải công nhận địa vị [ROOT.Char.Custom('GetTitleTierAdjective')] của ta."
  ach_yearly_events.1010.desc_outro_regalia: "\n\nTa phải thực hiện những nghi lễ đăng quang mới, huy hoàng hơn, và chứng minh sự cao quý của bảo vật hoàng gia."
  ach_yearly_events.1010.desc_outro_crown: "\n\nTa phải thực hiện những nghi lễ đăng quang mới, huy hoàng hơn, và chứng minh sự cao quý của vương miện."
  ach_coronation_suggestion_tt: "Ngài nên cân nhắc tổ chức một [coronation|E]"
  ach_yearly_events.1010.a: "Một lễ đăng quang khác — vĩ đại hơn — là điều cần thiết."
