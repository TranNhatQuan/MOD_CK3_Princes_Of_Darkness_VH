  guest_intent_coronation_events.0100.b.bad: "\"Im lặng, kẻ hèn! #EMP Im lặng hoặc chết!#!\""
  guest_intent_coronation_events.0100.b: "\"Ta sẽ không nghe nịnh thần.\""
