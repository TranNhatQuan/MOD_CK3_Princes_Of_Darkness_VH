l_english:
  guest_intent_coronation_events.0001.t: "Với Tư Cách Nhân Chứng"
  guest_intent_coronation_events.0001.desc.collective: ""Kia rồi, [host.GetSheHe] đó." [guest.GetTitledFirstName] chỉ tay về phía chủ lễ của chúng ta, [host.GetTitledFirstName], đang đứng một mình. Cuối cùng cũng đến lúc.\n\n"Đây là cơ hội của chúng ta," [guest.GetFirstNameNoTooltip] quả quyết. "Chúng ta đến đây để chứng kiến và ủng hộ lễ đăng quang của [host.GetHerHis]. Việc chúng ta nhận lại được một thứ gì đó cũng là điều hoàn toàn hợp lý.""
  guest_intent_coronation_events.0001.desc.alone: "Ta thấy chủ lễ của chúng ta, [host.GetTitledFirstName], đang đứng một mình trong sân. Cuối cùng Ta cũng có cơ hội bày tỏ ý định của mình.\n\nVới tư cách là nhân chứng cho lễ đăng quang của [host.GetHerHis], thật công bằng khi Ta nhận lại một điều gì đó."
  guest_intent_coronation_events.0001.a: "Hãy để chúng ta trở thành tấm gương hòa bình cho thần dân."
  guest_intent_coronation_events.0001.b: "Và chúng ta làm điều đó trước sự chứng giám của [ROOT.Char.GetFaith.HighGodName]."
  guest_intent_coronation_events.0001.c: "Mọi người sẽ thấy chúng ta đứng rất gần với [host.GetTitleAsNameNoTooltip]."
  cultural_acceptance_coronation_bear_witness: "Việc làm nhân chứng cho lễ đăng quang và thể hiện sự ủng hộ đã làm tăng mức độ chấp nhận văn hóa."
 
  guest_intent_coronation_events.0010.t: "Đề Nghị Ủng Hộ"
  guest_intent_coronation_events.0010.desc.collective: "\"Cuối cùng thì [host.Custom('ComplimentAdjective')] [host.GetTitledFirstName] cũng được ở một mình,\" [guest.GetTitledFirstName] — người [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('guest'))] của Ta — nhận xét, [guest.Custom('quirk_pos_pp')]. \"Đây là cơ hội để những người ủng hộ chúng ta thể hiện lòng trung thành.\"\n\n\"Đi đi, [ROOT.Char.GetFirstNameNoTooltip], chúng ta không thể bỏ lỡ cơ hội này.\""
  guest_intent_coronation_events.0010.desc.alone: "Cuối cùng thì [host.Custom('ComplimentAdjective')] [host.GetTitledFirstName] cũng được ở một mình. Ta mỉm cười và chậm rãi tiến về phía [host.GetHerHim].\n\nTa không thể bỏ lỡ cơ hội thể hiện lòng trung thành."
  guest_intent_coronation_events.0010.a: "[host.GetTitledFirstNameNoTooltip] sẽ không quên những người ủng hộ [host.GetHerHis]."
  guest_intent_coronation_events.0010.b: "Hoặc Ta có thể vun đắp mối quan hệ với [host.GetTitleAsNameNoTooltip]..."
  guest_intent_coronation_events.0010.c: "Một liên minh sẽ là lựa chọn có lợi nhất."
  friend_coronation_offer_support: "[CHARACTER.GetShortUIName|U] đã ủng hộ [TARGET_CHARACTER.GetShortUIName] trong lễ đăng quang của [TARGET_CHARACTER.GetHerHis]."
  friend_coronation_offer_support_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã ủng hộ [CHARACTER.GetShortUIName] trong lễ đăng quang."
  create_alliance_host_tt: "Ngài và [petition_sender.GetShortUIName] hình thành một [alliance|E]"
  create_alliance_guest_tt: "Ngài và [host.GetShortUIName] hình thành một [alliance|E]"
 
  guest_intent_coronation_events.0020.t: "Vận Động Lãnh Địa"
  guest_intent_coronation_events.0020.desc.collective: "Ta thấy mình bị cuốn vào một cuộc trò chuyện về [guest.Custom('MatchingConversationSubject_alone')] mà [guest.GetTitledFirstName] nhất quyết không chịu kết thúc.\n\n"Nhưng khoan đã!" [guest.GetSheHe] đột nhiên dừng lại. "Có vẻ như [host.GetLadyLord] [host.GetTitleAsNameNoTooltip] của chúng ta cũng đang tiến về phòng nghỉ của [host.GetHerHis]. Đây là cơ hội của chúng ta, [ROOT.Char.GetFirstName]. Hãy để chúng ta khiến [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] và [guest.GetPrimaryTitle.GetNameNoTier] trở nên thịnh vượng.""
  guest_intent_coronation_events.0020.desc.alone: "Ta không thể ngừng suy nghĩ về [ROOT.Char.Custom('MatchingConversationSubject_alone')] khi trở về phòng nghỉ. Nhưng rồi Ta nhận ra mình không hề đơn độc trong hành lang này.\n\n[host.GetTitledFirstName] dường như đang đi cùng hướng. Đây có thể là cơ hội để đảm bảo rằng [ROOT.Char.GetPrimaryTitle.GetNameNoTier] nhận được sự hỗ trợ xứng đáng."
  guest_intent_coronation_events.0020.a: "Chúng ta phải tập trung phát triển các thành phố."
  guest_intent_coronation_events.0020.b: "Không có trật tự nếu thiếu sự kiểm soát."
  guest_intent_coronation_events.0020.c: "Niềm tin của người dân là điều quan trọng nhất."
  guest_intent_coronation_events_advocate_domain_development_tt: "Mỗi [character|E] khác tham dự với #high Vận Động Lãnh Địa#! [intent|E] sẽ tăng [development_growth|E] tại các [counties|E] họ sở hữu thêm #P [EmptyScope.ScriptValue('major_development_progress_gain')|0]#!"
  guest_intent_coronation_events_advocate_domain_control_tt: "Mỗi [character|E] khác tham dự với #high Vận Động Lãnh Địa#! [intent|E] sẽ tăng [control|E] tại các [counties|E] họ sở hữu thêm #P +[EmptyScope.ScriptValue('major_county_control_gain')|0]#!"
  guest_intent_coronation_events_advocate_domain_county_opinion_tt: "Mỗi [character|E] khác tham dự với #high Vận Động Lãnh Địa#! [intent|E] nhận được [GetModifier('coronation_advocate_domain_county_opinion_modifier').GetNameWithTooltip] tại các [counties|E] họ sở hữu trong #V 10#! năm"
  coronation_advocate_domain_county_opinion_modifier: "Vận Động Lãnh Địa"
  coronation_advocate_domain_county_opinion_modifier_desc: "Nhân vật này đã vận động vì lãnh địa và phúc lợi của người dân trong lễ đăng quang."
 
  guest_intent_coronation_events.0030.t: "Đó Là Quyền Của Ta"
  guest_intent_coronation_events.0030.desc.collective: ""...hãy xem liệu ngài có thể thoát khỏi tình thế này không." [guest.GetTitledFirstName] tự hào tuyên bố, di chuyển một quân cờ của [guest.GetHerHis] về phía quân của ta. Ta chuẩn bị đưa ra nước đi đáp trả, nhưng cánh cửa căn phòng đột ngột mở tung.\n\nNgay trước ngưỡng cửa, [host.GetTitledFirstName] trông cũng kinh ngạc chẳng khác gì chúng ta. Chúng ta lập tức đứng dậy, nhưng [host.GetSheHe] ra hiệu cho chúng ta ngồi xuống lần nữa. "Xin thứ lỗi," [host.GetSheHe] lẩm bẩm. "Có rất nhiều điều cần phải suy nghĩ."\n\n[guest.GetTitledFirstNameNoTooltip] nhướng mày. Đây có thể là cơ hội để chúng ta thưa chuyện với lãnh chúa của mình.""
  guest_intent_coronation_events.0030.desc.alone: "Ta đang mải suy nghĩ thì cánh cửa bất ngờ mở ra.\n\n[host.GetTitledFirstName] đứng ở ngưỡng cửa, trông cũng bất ngờ như Ta. Ta lập tức đứng dậy, nhưng [host.GetSheHe] ra hiệu cho Ta ngồi xuống. \"Xin lỗi,\" [host.GetSheHe] nói. \"Có quá nhiều điều phải suy nghĩ.\"\n\nĐây có thể là cơ hội duy nhất để Ta trực tiếp bày tỏ với chúa thượng."
  guest_intent_coronation_events.0030.a: "Đưa ra lời khuyên đúng đắn có thể mang lại ân huệ."
  guest_intent_coronation_events.0030.b: "Chúng ta phải tranh luận để giảm quân dịch."
  guest_intent_coronation_events.0030.c: "[host.GetSheHe|U] phải biết rằng mức thuế chúng ta đang trả là quá bóc lột."
 
  guest_intent_coronation_events.0040.t: "Chớp Lấy Thời Cơ"
  guest_intent_coronation_events.0040.desc.intro: "Mọi vị khách đều bị cuốn vào màn trình diễn của các nghệ sĩ tung hứng, đồ ăn, rượu và sự hiện diện của những vị khách khác. Cuối cùng, [host.GetTitledFirstName] dường như có thể tận hưởng một khoảnh khắc yên tĩnh.\n\n"
  guest_intent_coronation_events.0040.desc.collective: ""Chúng ta cần nói chuyện với [host.GetHerHim] ngay bây giờ," [guest.GetTitledFirstName] lẩm bẩm sau chiếc cốc của [guest.GetHerHis]. "Chúng ta đến đây là vì [host.GetHerHim]. Việc chúng ta nhận được một thứ gì đó từ chuyện này cũng là điều công bằng.""
  guest_intent_coronation_events.0040.desc.alone: "Ta cần phải nói chuyện với [host.GetHerHim] ngay lập tức. Dù sao Ta cũng đến đây vì [host.GetHerHim], nên thật công bằng khi Ta nhận lại điều gì đó."
  guest_intent_coronation_events.0040.a: "Vàng mới là đồng tiền giá trị nhất."
  guest_intent_coronation_events.0040.b: "Uy danh luôn mang lại lợi ích."
  guest_intent_coronation_events.0040.c: "Chúng ta phải thuyết phục [host.GetHerHim] nới lỏng biên giới."
  guest_intent_coronation_events.0040.c.flavor: "Người ta nói hãy yêu mảnh đất của láng giềng ..."
 
  guest_intent_coronation_events.0050.t: "Gây Rối"
  guest_intent_coronation_events.0050.desc.collective: "\"Bóng tối của đêm nay phản chiếu bóng tối triều đại [host.GetHerHis].\" [guest.GetTitledFirstName] lầm bầm, khi [host.GetTitledFirstName] đi qua.\n\n\"Giờ đây, [ROOT.Char.GetFirstNameNoTooltip], giờ là lúc chúng ta chiếu rọi ánh sáng lên cõi hư hại này.\""
  guest_intent_coronation_events.0050.desc.alone: "Bóng tối của đêm nay phản chiếu sự u ám trong triều đại của [host.GetTitledFirstNamePossessive]. Ta thấy [host.GetHerHim] ở phía xa, đang trở về phòng nghỉ của [host.GetHerHis].\n\nĐây là cơ hội của ta. Cuối cùng ta cũng có thể mang chút ánh sáng đến cho vương quốc tăm tối này."
  guest_intent_coronation_events.0050.aa: "Nay là lễ đăng quang của [claimant_scope.GetTitledFirstNamePossessiveNoTooltip]."
  guest_intent_coronation_events.0050.a: "[host.GetSheHe|U] phải thấy được sức mạnh của chúng ta."
  guest_intent_coronation_events.0050.b: "Ta nên tập trung thuyết phục các khách mời khác."
  guest_intent_coronation_events.0050.c: "Đã đến lúc làm nhục chủ nhà của ta."
  guest_intent_coronation_events.0050.d: "Ta sẽ không công khai chống lại [host.GetFirstNameNoTooltip]."
  guest_intent_coronation_events.0050.d_tt: "Một [ruler|E] khác với [THIS.Char.GetInvolvedActivityIntent.GetName] [intent|E] sẽ đe dọa [host.GetShortUIName] với #N giảm#! [coronation_magnificence|E]"
  guest_intent_coronation_events.0050.d_tt_acceptance: "#alert_trial @alert_icon! [host.GetShortUIName] sẽ khó nhượng bộ hơn#!"
  guest_intent_coronation_events.0050.e: "$guest_intent_coronation_events.0050.d$"
  guest_intent_coronation_events.0050.e_tt: "#alert_trial @alert_icon! Ngươi sẽ không có cơ hội khác để gây rối [host.GetShortUIName]#!"
  guest_intent_coronation_events.0100.t: "Những Kẻ Xin Xỏ"
  guest_intent_coronation_events.0100.desc.intro: "\"Một lát, nếu ngài vui lòng…\" [petition_sender.GetTitledFirstName] chào ta, cúi rạp mình một cách cung kính."
  guest_intent_coronation_events.0100.desc.intro_2: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" [petition_sender.GetTitledFirstName] tiến đến, dang rộng tay."
  guest_intent_coronation_events.0100.desc.intro_3: "\"Cuối cùng cũng gặp được ngài, [ROOT.Char.GetTitledFirstName].\" [petition_sender.GetTitledFirstName] cúi rạp mình một cách phô trương."
  guest_intent_coronation_events.0100.desc.intro_4: "\"Kính quý [ROOT.Char.GetTitleAsNameNoTooltip].\" [petition_sender.GetTitledFirstName] chào ta với cái cúi rạp và nụ cười hấp dẫn."
  guest_intent_coronation_events.0100.desc.intro_5: "\"Ngài đây rồi, [ROOT.Char.GetTitledFirstNameNoTooltip]!\" [petition_sender.GetTitledFirstName] tiến về phía ta, nở nụ cười tươi trước khi thực hiện một cúi rạp tập dượt tệ hại."
  guest_intent_coronation_events.0100.desc.intro_6: ""Xin thứ lỗi cho sự táo bạo của ta," [petition_sender.GetTitledFirstName] cúi chào thấp đến mức tưởng như [petition_sender.GetSheHe] sắp gãy làm đôi."
  guest_intent_coronation_events.0100.desc.intro_7: ""Kính chào [ROOT.Char.GetTitleAsNameNoTooltip] đáng kính," [petition_sender.GetTitledFirstName] cúi chào trước mặt ta, y phục của [petition_sender.GetHerHis] được chỉnh tề ngay ngắn."
  guest_intent_coronation_events.0100.desc.intro_8: ""Kính chào [ROOT.Char.GetTitleAsNameNoTooltip]!" [petition_sender.GetTitledFirstName] gần như hét vang tước hiệu của ta khi [petition_sender.GetSheHe] cúi chào trước mặt ta."
  guest_intent_coronation_events.0100.desc.intro_9: "\"Cuối cùng, ta cũng có khoảnh khắc riêng với ngài, [ROOT.Char.GetTitledFirstNameNoTooltip],\" [petition_sender.GetTitledFirstName] chào ta bằng một cú cúi người chuẩn mực."
  guest_intent_coronation_events.0100.desc.disrupt_loyalists: "Một nụ cười khẽ đầy ẩn ý trên khuôn mặt của [petition_sender.GetHerHis] khiến ta nghi ngờ về ý định chân thành của [petition_sender.GetHerHis]."
  guest_intent_coronation_events.0100.desc.same_house: "\"Ta cảm thấy vui mừng khi chứng kiến vinh dự to lớn ngài đem lại cho nhà [ROOT.Char.GetHouse.GetName].\""
  guest_intent_coronation_events.0100.desc.friendship: "\"Không phải ngày nào cũng thấy người bạn quý đăng quang.\""
  guest_intent_coronation_events.0100.desc.winter: "Cái lạnh của ngày khiến thân thể [petition_sender.GetHerHis] run lên."
  guest_intent_coronation_events.0100.desc.summer: "Ánh sáng chói của ngày làm những giọt mồ hôi rơi trên trán [petition_sender.GetHerHis]."
  guest_intent_coronation_events.0100.desc.neutral_1: "[ROOT.Char.Custom('GetRandomExteriorDetail')]."
  guest_intent_coronation_events.0100.desc.neutral_2: "[petition_sender.Custom('quirk_pos_standalone')], và nhấp một ngụm [ROOT.Char.Custom('RegionalDrink')] trước khi tiếp tục:"
  guest_intent_coronation_events.0100.desc.neutral_3: "[petition_sender.GetSheHe|U] [petition_sender.Custom('quirk_pos_present')] khi một con [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] bất ngờ ngắt lời [petition_sender.GetHerHim] bằng cách nhảy múa giữa hai chân của [petition_sender.GetHerHis]."
  guest_intent_coronation_events.0100.desc.cultural_acceptance: "\n\n\"Chúng tôi xin sự thấu hiểu giữa hai dân tộc. Mong sự ủng hộ của chúng tôi với ngài từ đầu triều đại được ghi nhớ.\""
  guest_intent_coronation_events.0100.desc.piety: "\n\n\"Xin cho phép chúng tôi cầu nguyện để [petition_sender.GetFaith.HighGodName] ban phước cho triều đại ngài, dài lâu và thịnh vượng.\""
  guest_intent_coronation_events.0100.desc.legitimacy: "\n\n\"Chúng tôi đứng đây hôm nay chứng kiến sự huy hoàng của ngài, và sẽ là vinh dự to lớn nếu ngài có vài lời nói thay cho chúng tôi.\""
  guest_intent_coronation_events.0100.desc.opinion: "\n\n\"Những người ủng hộ trung thành nhất và các chư hầu tận tụy của ngài: chúng tôi đứng đây vì ngài, để giúp ngài. Dù có chuyện gì xảy ra.\""
  guest_intent_coronation_events.0100.desc.friend: "\n\n\"Ta đứng đây ủng hộ ngài, kính quý [ROOT.Char.GetTitleAsNameNoTooltip]. Xin cho phép ta ở bên ngài, bất luận chuyện gì xảy ra.\""
  guest_intent_coronation_events.0100.desc.alliance: "\n\n\"Ta nguyện trung thành và ủng hộ ngài tuyệt đối. Một liên minh giữa chúng ta sẽ là vinh dự lớn lao nhất.\""
  guest_intent_coronation_events.0100.desc.development: "\n\n\"Ta xin ngài, [ROOT.Char.GetLadyLord], hãy chú ý đến các thành phố của [petition_sender.GetPrimaryTitle.GetNameNoTier]. Là chư hầu trung thành nhất, lòng ta đau khi thấy đất đai bỏ hoang.\""
  guest_intent_coronation_events.0100.desc.control: "\n\n\"Ta muốn nhờ ngài giúp thi hành luật pháp tại các vùng của [petition_sender.GetPrimaryTitle.GetNameNoTier].\""
  guest_intent_coronation_events.0100.desc.popular_opinion: "\n\n\"Ta mong ngài quan tâm tới dân chúng của [petition_sender.GetPrimaryTitle.GetNameNoTier], vì phúc lợi của họ quan trọng nhất đối với ta.\""
  guest_intent_coronation_events.0100.desc.hook: "\n\n\"Ta sẽ ủng hộ ngài trong triều đại này và truyền bá tin tốt về [ROOT.Char.GetTitleAsNameNoTooltip]. Đổi lại, ta chỉ mong ngài ghi nhớ ân huệ này.\""
  guest_intent_coronation_events.0100.desc.vassal_levies: "\n\n\"Dân chúng ta vẫn chết. Ruộng bỏ hoang, nhà cháy. Xin cho phép giảm quân dịch.\""
  guest_intent_coronation_events.0100.desc.vassal_taxes: "\n\n\"Thuế quá nặng, [ROOT.Char.GetLadyLord] của ta. Ngay cả thương nhân giàu nhất cũng không đủ nuôi con.\""
  guest_intent_coronation_events.0100.desc.gold: "\n\n\"Vương miện sẽ thật sự thể hiện lòng hào phóng nếu được thấy thưởng cho thần dân vì sự ủng hộ.\""
  guest_intent_coronation_events.0100.desc.prestige: "\n\n\"Chúng tôi sẽ vô cùng hân hoan nếu được hưởng một phần uy danh từ việc làm chư hầu của ngài.\""
  guest_intent_coronation_events.0100.desc.claim: "\n\n\"Biên cương quá cứng nhắc, tĩnh lặng. Tốt hơn hết là để người cứng rắn nhất trị vì.\""
  guest_intent_coronation_events.0100.desc.faction_discontent: "\n\n\"Ngài biết [petition_sender_faction.GetName], phải không? Chúng ta chính nghĩa! Chúng ta hoạt động tại nơi này… thì thầm với khách ngài, khuấy động kẻ thù! Một [ROOT.Char.GetTitleAsName|l] hùng mạnh, lễ đăng quang tráng lệ… ngài không có gì phải sợ chúng ta.\""
  guest_intent_coronation_events.0100.desc.faction_members: "\n\n\"Khách ngài háo hức nghe về [petition_sender_faction.GetName]… nhưng sợ trả thù. Xin cho chúng tôi quyền được nói — để tự do trình bày bức xúc!\""
  guest_intent_coronation_events.0100.desc.magnificence_loss: "\n\n"Thật là một trò hề!" [petition_sender.GetSheHe|U] chế nhạo ta, tự tin vì đang ở nơi kín đáo này. "Ai cũng biết điều đó! Một [host.GetTitleAsNameNoTooltip|l] bị bao vây bởi kẻ thù ư? Một [host.GetTitleAsNameNoTooltip|l] bị chính khách mời của mình khinh miệt ư? Ta nhổ vào sự cai trị của ngài, ta khinh miệt những kẻ cúi đầu — ta khinh miệt cả lễ đăng quang này!""
  guest_intent_coronation_events.0100.desc.magnificence_loss_subtle: "\n\n"Chỉ một mình, đứng trên tất cả những kẻ còn lại," [petition_sender.GetSheHe] nói bằng giọng u ám, "vị [ROOT.Char.GetTitleAsName] trong sự cô độc hoàn hảo của mình được miễn khỏi những lời lẽ bẩn thỉu của sự bất hòa. Nhưng ta cảm thấy mình phải đảm bảo với vị [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại rằng..."\n\n"...rằng buổi tụ họp này #EMP tràn ngập#! những lời nói bất trung như vậy.""
  guest_intent_coronation_events.0100.desc.critical_fail: "\n\n\"Hết rồi, [host.GetTitledFirstNameNoTooltip]. Đây là lễ đăng quang của [claimant_scope.GetTitledFirstNamePossessive] rồi.\""
  guest_intent_coronation_events.0100.a: "\"Ta vui lòng đồng ý.\""
