l_english: 
  coronation_events_klank.1001.t: "Một Đám Đông Đáng Ngờ Đầy Văn Hóa"
  coronation_events_klank.1001.desc: "Bọn vô lại, lang thang, quỷ dữ — tất cả chúng... lượn vòng như kền kền, chờ thời khắc để xé lấy phần thịt của mình. Nhưng chúng không thể thoát khỏi ánh mắt canh chừng của ta.\n\nChúng kia rồi. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))] gian trá của ta, [first_culture_char.GetFullName], khoác lên mình những bộ y phục [first_culture_char.GetCulture.GetName] tinh xảo nhất, và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))] xảo quyệt của ta, [second_culture_char.GetFullName], trong trang phục [second_culture_char.GetCulture.GetName] cũng lộng lẫy không kém. Một sự cải đạo hời hợt hay một âm mưu đang nhen nhóm?\n\nÍt nhất thì dáng vẻ sặc sỡ của họ cũng khiến ngày hôm nay thêm phần sinh động, như một bầy chim tinh quái."
  coronation_events_klank.1001.a: "\"Hai người các ngươi! Quỳ xuống trước [ROOT.Char.GetTitleAsNameNoTooltip] của mình.\""
  coronation_events_klank.1001.b: "Những kẻ ngoại bang ấy không đáng để ta bận tâm."

  coronation_events_klank.1002.t: "Một Đám Đông Tuyệt Vời Đầy Văn Hóa"
  coronation_events_klank.1002.desc: "[ROOT.Char.GetPrimaryTitle.GetName] rộng lớn và tràn ngập những thần dân trung thành thuộc mọi tầng lớp. Tất nhiên không phải ai cũng trung thành, nhưng đủ để bảo đảm sự ổn định trong nhiều năm tới.\n\nHọ kia rồi, đang say sưa trò chuyện — hẳn là đang nói về sự nhân từ trong triều đại của ta, về sự phồn thịnh của lãnh thổ ta. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))] trung thành của ta, [first_culture_char.GetFullName], khoác lên mình những bộ y phục [first_culture_char.GetCulture.GetName] tinh xảo nhất, và [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))] đáng tin cậy của ta, [second_culture_char.GetFullName], trong trang phục [second_culture_char.GetCulture.GetName] cũng lộng lẫy không kém.\n\nVẻ ngoài đầy màu sắc của họ khiến ngày hôm nay thêm rực rỡ, như một đàn chim xinh đẹp."
  coronation_events_klank.1002.a: "Gật đầu đáp lại họ."
  coronation_events_klank.1002.b: "Nồng nhiệt chào đón các vị khách danh giá."

  coronation_events_klank.1003.t: "Bình Minh Mới, Ngục Tối Cũ"
  coronation_events_klank.1003.desc: "À, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_of_executee'))] của ta, [child_of_executee.GetName]... đây không phải lần đầu tiên một người thuộc Gia tộc [child_of_executee.GetHouse.GetName] đứng trước một người thuộc Gia tộc [ROOT.Char.GetHouse.GetName], thấp thỏm không biết số phận của [child_of_executee.GetHerHis] sẽ ra sao.\n\nVị [child_of_executee.GetTitleAsNameNoTooltip] tiền nhiệm của [child_of_executee.GetPrimaryTitle.GetNameNoTier], [executed_previous_holder.GetFirstName], [executed_previous_holder.GetDeathReason]. Lý do chính xác dẫn đến cuộc hành quyết đã bị chôn vùi cùng ngôi mộ của [executed_previous_holder.GetHerHis] kể từ sau cái chết của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('executor_ancestor'))] của ta. Trong nhiều năm, thay vì phương châm của họ, #weak [child_of_executee.GetHouse.GetMotto]#!, Gia tộc [child_of_executee.GetHouse.GetNameNoTooltip] đã viết lên những lá cờ của mình nỗi nhục nhã và cơn giận dữ bằng máu.\n\nSự hiện diện của [child_of_executee.GetFirstNamePossessiveNoTooltip] tại đây hôm nay có thể được xem là một hành động khuất phục khiêm nhường, hoặc một bước đi thách thức."
  coronation_events_klank.1003.a: "\"Như một tín đồ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] chân chính, ta tha thứ cho ngươi.\""
  coronation_events_klank.1003.b: "Nỗi sợ đã ăn sâu vào huyết mạch của chúng ta."
  coronation_events_klank.1003.c: "\"Đây sẽ là khởi đầu cho một truyền thống huy hoàng. Vệ binh!\""

  coronation_events_klank.1004.t: "Một Đám Đông Đội Vương Miện"
  coronation_events_klank.1004.desc.intro: "Thật là một niềm vinh hạnh phi thường khi được thấy những quân vương đồng liêu của ta:"
  coronation_events_klank.1004.desc.intro_many_kings: "Lễ đăng quang của ta quả thực là sự kiện của năm, của cả thập kỷ! Thật là một niềm vinh hạnh phi thường khi được thấy vô số quân vương đồng liêu của ta, trong đó có:"
  coronation_events_klank.1004.desc.second_king: "[first_king.GetName] và [second_king.GetName]."
  coronation_events_klank.1004.desc.third_king: "[first_king.GetName], [second_king.GetName], và [third_king.GetName]."
  coronation_events_klank.1004.desc.fourth_king: "[first_king.GetName], [second_king.GetName], [third_king.GetName], và [fourth_king.GetName]."
  coronation_events_klank.1004.desc.fifth_king: "[first_king.GetTitledFirstNameRegnal], [second_king.GetTitledFirstNameRegnal], [third_king.GetTitledFirstNameRegnal], [fourth_king.GetTitledFirstNameRegnal], và [fifth_king.GetTitledFirstNameRegnal]."
  coronation_events_klank.1004.desc.extoll_reign_intent: "\n\nHọ sẽ trông thật lộng lẫy trong lễ đăng quang của ta, đứng phía sau, làm chứng cho #EMP sự thăng vị#! của ta. Bởi trên mặt đất tốt lành của [ROOT.Char.GetFaith.HighGodNamePossessive] có vô số vương miện nạm ngọc, nhưng chỉ có duy nhất một [ROOT.Char.GetTitleAsNameNoTooltip] đích thực."
  coronation_events_klank.1004.desc.empower_loyalists_intent: "\n\nThật sự, ta không thể mong có những nhân chứng tốt đẹp hơn cho lễ đăng quang của mình. Ta nhất định phải trò chuyện với những người có tấm lòng ấm áp dành cho ta, và thiết lập những mối quan hệ bền chặt giữa các triều đình."
  coronation_events_klank.1004.desc.other_intent: "\n\nThật sự, ta không thể mong có những nhân chứng tốt đẹp hơn cho lễ đăng quang của mình. Tổng hòa của cải, quyền lực và huy hoàng chung của chúng ta là vô song."
  coronation_events_klank.1004.desc.outro: "\n\nSự hiện diện của các quân vương này vừa là phúc lành, vừa là cơ hội. Giá trị vương giả của ta sẽ được phô bày từ ngày đầu trị vì cho đến ngày cuối cùng."
  coronation_events_klank.1004.a: "Tất cả bọn họ đều sẽ ở dưới ta."
  coronation_events_klank.1004.a_tt: "#weak Lượng [prestige|E] và [legitimacy|E] nhận được tăng theo số lượng [independent|E] [kings|E] và [emperors|E] có mặt tại lễ [coronation|E] của Ngài#!"
  coronation_events_klank.1004.b: "\"Ta rất vui vì tất cả các ngươi đều có mặt.\""
  coronation_events_klank.1004.c: "Ta sẽ vượt trội hơn họ."
  coronation_events_klank.1004.d: "\"Chào mừng, những người đồng liêu của ta!\""

  forced_to_kneel_opinion: "Bị Ép Quỳ Gối"

  coronation_events_klank.1005.t: "Những Câu Chuyện Về Các Cuộc Chiến Đã Mất"
  coronation_events_klank.1005.desc: "[friendly_king.GetName] đã liên tục lớn tiếng vào tai [npc_guest.GetNamePossessive] suốt một lúc lâu.\n\n\"Và ta nói cho ngươi biết, không kẻ nào đê tiện hơn [unfriendly_king.GetName]! [war_memory.GetDescription], tất cả chỉ vì [unfriendly_king.GetSheHe] đã bán những người con trai của [unfriendly_king.GetHerHis] cùng tương lai của [unfriendly_king.GetPrimaryTitle.GetName] cho [friendly_king.GetFaith.DevilName]! Nhưng ta đã có kế hoạch! Ta chỉ cần một thanh kiếm xứng đáng, cùng một hoặc hai, hoặc ba đồng minh, và ta sẽ mang sự báo thù đến cho [unfriendly_king.GetHerHim]!\"\n\nĐây chắc chắn không phải lần đầu [friendly_king.GetFirstNamePossessiveNoTooltip] nói về những bất công mà [friendly_king.GetHerHim] phải chịu. Nhưng hôm nay... có thể sẽ là lần cuối cùng."
  coronation_events_klank.1005.a: "Lắng nghe những câu chuyện khốn khổ của [friendly_king.GetHerHis]."
  coronation_events_klank.1005.b: "\"Công lý không phải thứ ngươi có quyền đòi hỏi.\""
  coronation_events_klank.1005.flavor: "Cất kiếm đi, [friendly_king.GetTitledFirstNameNoTooltip], nó sẽ chẳng mang lại lợi ích gì cho ngươi. Bởi trái tim ngươi nặng trĩu, và tâm trí ngươi mờ mịt."
  coronation_events_klank.1005.c: "\"Cùng nhau, chúng ta sẽ dạy cho [unfriendly_king.GetHerHim] một bài học không thể nào quên.\""
  coronation_events_klank.1005.c.tooltip: "#high Ngài#! và [friendly_king.GetShortUIName] có thể gọi nhau tham chiến trong bất kỳ [war|E] nào chống lại [unfriendly_king.GetShortUIName] trong vòng #high 6 năm#!"
  coronation_events_klank.1005.c.vengeful: "\"Không ai có thể hiểu ngươi hơn. Sự báo thù sẽ thuộc về chúng ta!\""
  coronation_events_klank.1005.other_player_informed_tt: "[unfriendly_king.GetTitledFirstName] sẽ được thông báo về kết quả này"
  coronation_events_klank.1005.d: "\"Ta rất vui vì ngươi đã có được tai nghe của [npc_guest.GetFirstNamePossessiveNoTooltip]. #EMP Cả. Tuần. Trời.#!\""

  coronation_events_klank.1006.t: "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
  coronation_events_klank.1006.desc: "Ta vui mừng thông báo rằng trong lễ đăng quang của [coronation_host.GetHerHis], vị [coronation_host.GetName] lừng lẫy đã thuyết phục được [friendly_king.GetName] từ bỏ hành trình báo thù sai lầm của [friendly_king.GetHerHis], sau chiến thắng chính nghĩa của ngươi trong [war_memory.GetName]."
  coronation_events_klank.1006.a: "Thú vị."

  coronation_events_klank.1007.t: "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
  coronation_events_klank.1007.desc: "Ta lấy làm tiếc phải thông báo rằng trong [coronation_activity.GetName] của [coronation_host.GetName], [coronation_host.GetSheHe] và [friendly_king.GetName] đã lập giao ước hợp lực chống lại ngươi, nhằm phục vụ cho hành trình báo thù sai lầm của [friendly_king.GetTitledFirstNamePossessiveNoTooltip] sau chiến thắng chính nghĩa của ngươi trong [war_memory.GetName]."
  coronation_events_klank.1007.a: "Đáng lo ngại."

  coronation_events_klank.1008.t: "Một [dynasty_king.GetTitleAsNameNoTooltip] thuộc [ROOT.Char.GetDynasty.GetNameNoTooltip]"
  coronation_events_klank.1008.desc.friendly: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] vĩ đại của ta, [dynasty_king.GetTitledFirstName], đã rời khỏi nơi an nhàn của [dynasty_king.GetHerHis] tại [dynasty_king.GetPrimaryTitle.GetName] để đến chúc mừng lễ đăng quang của ta. Sự hiện diện của [dynasty_king.GetHerHis|U] tại đây là dấu hiệu của sự ủng hộ, lòng tin tưởng và mối liên kết máu mủ giữa chúng ta."
  coronation_events_klank.1008.desc.hostile: "[ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] của ta, [dynasty_king.GetTitledFirstName], đã bò ra khỏi hang ổ đáng ghê tởm của [dynasty_king.GetHerHis] tại [dynasty_king.GetPrimaryTitle.GetName], chắc chắn là để phá hỏng lễ đăng quang của ta. Sự hiện diện của [dynasty_king.GetHerHis|U] tại đây thật là một cảnh tượng đáng ghê tởm. Bởi không có con người nào cách biệt với sự uy nghi của ta hơn [dynasty_king.GetHerHis]. Ngoài dòng máu chung, chẳng có điều gì gắn kết chúng ta với nhau."
  coronation_events_klank.1008.desc.neutral: "Vị [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] của ta, [dynasty_king.GetTitledFirstName], đã từ [dynasty_king.GetPrimaryTitle.GetName] đến để chứng kiến lễ đăng quang của ta."
  coronation_events_klank.1008.desc.outro: "\n\n#EMP \"[ROOT.Char.GetHouse.GetMotto]\"#! — những lời này đã dẫn lối cho gia tộc [ROOT.Char.GetDynasty.GetName] qua bao thế hệ. Tổ tiên của chúng ta đã mang theo nó qua mọi thăng trầm. Dù cùng nhau hay riêng rẽ, việc đưa những lời ấy đi xa hơn giờ đây nằm trong tay ta và [dynasty_king.GetTitledFirstName]."
  coronation_events_klank.1008.a: "Ta rất vui khi thấy ngươi ở đây."
  coronation_events_klank.1008.b: "$coronation_events_klank.1008.a$"
  coronation_events_klank.1008.c: "Chào mừng, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] của ta."
  coronation_events_klank.1008.d: "$coronation_events_klank.1008.c$"
  coronation_events_klank.1008.e: "Ngươi sẽ chứng kiến sự thăng vị của một [ROOT.Char.GetDynasty.GetNameNoTooltip] chân chính."
  coronation_events_klank.1008.f: "Quỳ xuống! Nếu không, sẽ có ít hơn một [ROOT.Char.GetDynasty.GetNameNoTooltip] [dynasty_king.GetTitleAsNameNoTooltip]."
  coronation_events_klank.1008.g: "Ta mới là [ROOT.Char.GetDynasty.GetNameNoTooltip] chân chính."
  happened_because_intent_tt: "#EMP #low Ý định [THIS.Char.GetInvolvedActivityIntent.GetName] của Ngài đã gây ra sự kiện này#!#!"


  coronation_events_klank.1009.t: "Trong Thời Kỳ Khó Khăn"
  coronation_events_klank.1009.desc: "[left_struggle.GetName] và [right_struggle.GetName] đã tranh luận gay gắt suốt nhiều ngày qua. Thời thế thật khắc nghiệt: toàn bộ vương quốc, cả khu vực đều bị cuốn vào một cuộc xung đột kéo dài hàng thập kỷ.\n\n\"Những người theo [first_struggle_faith.GetAdherentNamePlural] chỉ đang chờ cơ hội để ra tay với [right_struggle.GetFaith.GetAdherentNamePlural], trong khi các [first_struggle_culture.GetCollectiveNoun] thì đứng nhìn một cách thờ ơ! [host.GetTitledFirstName] không thể nào vượt qua thử thách này!\"\n\n[right_struggle.GetTitledFirstName] dừng lại để lấy hơi trong khi [left_struggle.GetTitledFirstName] gom góp suy nghĩ cho lời phản bác. Đây là thời điểm hoàn hảo để ta xen vào."
  coronation_events_klank.1009.a: "[char_struggle.GetNameNoTooltip] có thể đợi. Tối nay, hãy tận hưởng lễ đăng quang của ta."
  coronation_events_klank.1009.b: "Im lặng đi, kẻ chỉ trích."
  coronation_events_klank.1009.c: "Trong thời kỳ [char_struggle.GetCurrentPhase.GetNameNoTooltip], chúng ta ủng hộ [host.GetTitledFirstNameNoTooltip]."
  coronation_events_klank.1009.d: "[host.GetTitledFirstNameNoTooltip] quá yếu cho thời kỳ [char_struggle.GetCurrentPhase.GetNameNoTooltip]."
  coronation_events_klank.1009.e: "Cả hai người đều sai."

  coronation_guest_struggle_support_log_title: "Ủng Hộ Trong Thời Kỳ Khó Khăn"
  coronation_guest_struggle_support_log: "[CHARACTER.GetTitledFirstName|U] công khai bày tỏ sự tin tưởng của [CHARACTER.GetHerHis] đối với [TARGET_CHARACTER.GetTitledFirstName] trong những thời khắc khó khăn này"
  coronation_guest_struggle_undermine_log_title: "Bất Hòa Trong Thời Kỳ Khó Khăn"
  coronation_guest_struggle_undermine_log: "[CHARACTER.GetTitledFirstName|U] công khai bày tỏ sự thiếu tin tưởng của [CHARACTER.GetHerHis] đối với [TARGET_CHARACTER.GetTitledFirstName] trong những thời khắc khó khăn này"

  ach_enlightened_centrist: "Luôn Có Con Đường Thứ Ba"
  ach_enlightened_centrist_desc: "Nhân vật này luôn cố gắng tìm ra điểm dung hòa, ngay cả khi điều đó khiến những người xung quanh không hài lòng."

  coronation_events_klank.1010.t: "Số Phận Của Ba Tư"
  coronation_events_klank.1010.desc.intro_detractor: "Quả là một ngày tuyệt đẹp tại vùng đất huy hoàng [location.GetName], cách xa khỏi [caliph.Custom('InsultAdjective')] [caliph.GetName]. [ROOT.Char.GetPrimaryTitle.GetNameNoTier|U] hoàn toàn có thể phát triển rực rỡ nếu không có tên [caliph.Custom('InsultAdjective')] [caliph.Custom('InsultNoun')] đó.\n\n"
  coronation_events_klank.1010.desc.intro_supporter: "Thật là một ngày đẹp trời tại [location.GetName] huy hoàng, được [ROOT.Char.GetFaith.HighGodName] ban phúc, được ban phúc bởi [ROOT.Char.Custom('ComplimentAdjective')] [caliph.GetName]. [ROOT.Char.GetPrimaryTitle.GetNameNoTier] lẽ ra đã có thể hưng thịnh nếu mọi [ROOT.Char.GetFaith.GetAdherentName] đều nhận ra sự khôn ngoan và lòng mộ đạo của [caliph.GetTitleAsNameNoTooltip], như ta đã làm.\n\n"
  coronation_events_klank.1010.desc.intro_caliph: "Thật là một ngày đẹp trời tại [location.GetName] huy hoàng, khi lễ đăng quang của [caliph.GetNamePossessive] [ROOT.Char.Custom('ComplimentAdjective')] đã cận kề. [ROOT.Char.GetPrimaryTitle.GetName|U] lẽ ra đã có thể hưng thịnh nếu mọi [ROOT.Char.GetFaith.GetAdherentName] đều nhận ra sự khôn ngoan và lòng mộ đạo của [caliph.GetTitleAsNameNoTooltip], như ta đã làm.\n\n"
  coronation_events_klank.1010.desc.mid_supporter: "\"Một trong những kẻ chống đối của [caliph.GetHerHis] đã lẻn vào lễ đăng quang này và nói năng lảm nhảm về sự phản bội của [struggle_participant.GetFaith.DevilName], tương lai của Ba Tư, sự khôn ngoan của [struggle_participant.GetFaith.HighGodName], và mùi hương quyến rũ từ đôi chân của [caliph.GetTitleAsNamePossessiveNoTooltip]. \""
  coronation_events_klank.1010.desc.mid_detractor: "Một trong những kẻ ủng hộ của [caliph.GetHerHis] đã lẻn vào lễ đăng quang này và nói năng lảm nhảm về sự phản bội của [struggle_participant.GetFaith.DevilName], tương lai của Ba Tư, sự khôn ngoan của [struggle_participant.GetFaith.HighGodName], và mùi hôi từ đôi chân của [caliph.GetTitleAsNamePossessiveNoTooltip]. "
  coronation_events_klank.1010.outro: "Được rồi, đã đến lúc ta phải chỉnh đốn lại [struggle_participant.GetHerHim].\n\n\"Bình an đến với ngươi, [struggle_participant.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l]. Nhìn thấy gương mặt ngươi khiến ta đau đớn, [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l]. Ngươi phải...\""
  coronation_events_klank.1010.a: "\"Hãy vứt bỏ những niềm tin sai lầm của ngươi.\""
  coronation_events_klank.1010.b: "\"Hãy biết rằng [persian_struggle.GetCurrentPhase.GetName] đối nghịch với Nhà [ROOT.Char.GetHouse.GetName].\""
  coronation_events_klank.1010.c: "\"Hãy thừa nhận Nhượng Bộ là con đường khả thi duy nhất.\""
  coronation_events_klank.1010.d: "\"Quỳ xuống trước vị Caliph chân chính!\""
  coronation_events_klank.1010.e: "\"Cút đi và than vãn ở bên ngoài!\""
  coronation_events_klank.1010.b.catalyst_unrest: "Ngài sẽ kích hoạt một [struggle_catalyst|E] hướng tới [struggle_persia_phase_unrest|E]"
  coronation_events_klank.1010.b.catalyst_concession: "Ngài sẽ kích hoạt một [struggle_catalyst|E] hướng tới [struggle_persia_phase_concession|E]"
  coronation_events_klank.1010.b.catalyst_stabilization: "Ngài sẽ kích hoạt một [struggle_catalyst|E] hướng tới [struggle_persia_phase_stabilisation|E]"

  coronation_events_klank.1011.t: "Sự bao la của [ROOT.Char.GetPrimaryTitle.GetName]"
  coronation_events_klank.1011.desc: "Lãnh thổ dưới quyền ta gần như vô tận, và tham vọng của ta cũng vậy. Những chư hầu quyền lực nhất của ta đều có mặt tại đây: [first_char.GetTitledFirstName], [second_char.GetTitledFirstName], và [third_char.GetTitledFirstName], tất cả sẵn sàng quỳ gối trước ta, tất cả đều chờ đợi tầm nhìn của ta cho tương lai chung. Triều đại của ta sẽ định hình toàn bộ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] trong nhiều thập kỷ, thậm chí nhiều thế hệ. Đây chính là khoảnh khắc hoàn hảo để công bố một tham vọng vương quyền vĩ đại.\n\nDù không được lòng người, việc tập trung quyền lực có thể đặt một thanh kiếm hùng mạnh vào tay ta, và vàng vào túi ta. Nhưng nếu được trao quyền tự trị và tài nguyên, các chư hầu của ta cũng có thể trở thành một tấm khiên vững chắc, bảo vệ ta khỏi mọi mối đe dọa..."
  coronation_events_klank.1011.a: "Ta chính là [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
  coronation_events_klank.1011.a.custom_tooltip: "@alert_icon! Ngài sẽ khởi động quá trình tập trung quyền lực. Sau #V 10#! năm, Ngài sẽ gặt hái được thành quả:\n$EFFECT_LIST_BULLET$Tăng [development_i][development|E] trong [domain|E] của Ngài\n$EFFECT_LIST_BULLET$Giảm [development_i][development|E] trong [domain|E] của [vassal|E].\n$EFFECT_LIST_BULLET$Mức thay đổi phụ thuộc vào [stewardship_i][stewardship|E] và [learning_i][learning|E] [skills|E] của Ngài."
  custom.ten_most_powerful_vassals: "Mười chư hầu quyền lực nhất của Ngài có mặt tại lễ đăng quang"
  coronation_events_klank.1011.a.county_modifier: "Mỗi [county|E] trong lãnh địa của họ nhận [GetModifier('ach_realm_centralization_county_lvl_1').GetNameWithTooltip] [modifier|E] trong 10 năm."
  custom.coronation_events_klank.1011.a.disrespect: "Các [vassals|E] #V Phản đối#! bị ảnh hưởng bởi kế hoạch của Ngài"
  custom.coronation_events_klank.1011.a.respect: "Các [vassals|E] khác bị ảnh hưởng bởi kế hoạch của Ngài"
  coronation_events_klank.1011.b: "Không có các chư hầu mạnh mẽ, ta chẳng là gì cả."
  coronation_events_klank.1011.b.custom_tooltip: "@alert_icon! Ngài sẽ khởi động quá trình phân quyền và gia tăng quyền tự trị. Sau #V 10#! năm, Ngài sẽ có thể gặt hái thành quả:\n$EFFECT_LIST_BULLET$Tăng [development_i][development|E] trong các [domains|E] của chư hầu.\n$EFFECT_LIST_BULLET$Mức thay đổi phụ thuộc vào [stewardship_i][stewardship|E] và [diplomacy_i][diplomacy|E] [skills|E] của Ngài."
  coronation_events_klank.1011.b.county_modifier: "Mỗi [county|E] trong lãnh địa của họ nhận [GetModifier('ach_realm_autonomy_county_lvl_1').GetNameWithTooltip] [modifier|E] trong 10 năm."
  custom.coronation_events_klank.1011.b.disrespect: "$custom.coronation_events_klank.1011.a.disrespect$"
  custom.coronation_events_klank.1011.b.respect: "$custom.coronation_events_klank.1011.a.respect$"
  coronation_events_klank.1011.c: "Lãnh thổ của ta hiện tại đã rất ổn."

  coronation_events_klank.1012.t: "Kế Hoạch Tập Trung Quyền Lực Vĩ Đại Của [host.GetTitledFirstNamePossessive]"
  coronation_events_klank.1012.desc: "Trong lễ đăng quang của [host.GetHerHis], [host.GetName] đã công bố một kế hoạch vĩ đại và đầy tham vọng nhằm củng cố vương quốc bằng cách tập trung vào trung tâm của [host.GetPrimaryTitle.GetName], nơi tình cờ lại chính là lãnh địa cá nhân của [host.GetTitledFirstNamePossessive]. Những nguồn lực cần thiết phải được lấy từ đâu đó, bởi trên thế gian này chẳng có gì thực sự dồi dào ngoài ân sủng của [ROOT.Char.GetFaith.HighGodName]. Vì vậy, điều này phải trả giá bằng các vùng ngoại vi, như chính lãnh địa của ta!\n\nSống trong một vương quốc hùng mạnh, dưới quyền một [host.GetTitleAsNameNoTooltip] đầy quyền lực, quả thực có những lợi ích riêng — nhưng nếu sức mạnh này bị lạm dụng trong tương lai thì sao, nếu nó bị dùng để chống lại ta? Một [ROOT.Char.GetPrimaryTitle.GetNameNoTier] hùng mạnh là điều đáng để tự hào... và có lẽ cũng là điều đáng lo ngại."
  coronation_events_klank.1012.a: "Ta là  Bề Tôi khiêm nhường nhất của [host.GetTitledFirstNamePossessive]."
  coronation_events_klank.1012.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] vẫn có thể tồn tại mà không cần những ý tưởng của [host.GetTitleAsNamePossessiveNoTooltip]."
  coronation_events_klank.1012.b.desc: "Trong vòng 10 năm, [domain|E] của Ngài sẽ không bị giảm [development|E]."
  coronation_events_klank.1012.ten_year_plan: "Sau 10 năm, [development|E] của Ngài và các [domains|E] của những [vassals|E] khác sẽ bị giảm, trong khi [liege|E] của Ngài được hưởng lợi. Mức thay đổi thực tế phụ thuộc vào [stewardship|E] và [learning|E] của [liege|E]."

  coronation_events_klank.1013.t: "Kế Hoạch Phân Quyền Quy Mô Lớn Của [host.GetTitledFirstNamePossessive]"
  coronation_events_klank.1013.desc: "Trong lễ đăng quang của [host.GetHerHis], [host.GetName] đã công bố một kế hoạch vĩ đại và đầy tham vọng nhằm củng cố vương quốc bằng cách tập trung vào các vùng ngoại vi của [host.GetPrimaryTitle.GetNamePossessive], nơi bao gồm cả lãnh địa của ta. Những nguồn lực cần thiết phải được lấy từ đâu đó, bởi trên thế gian này chẳng có gì thực sự dồi dào ngoài ân sủng của [ROOT.Char.GetFaith.HighGodName]. [host.GetTitleAsNameNoTooltip] đã hào phóng đề nghị chia sẻ sự giàu có từ lãnh địa của [host.GetHerHis] với toàn thể vương quốc."
  coronation_events_klank.1013.a: "$coronation_events_klank.1012.a$"
  coronation_events_klank.1013.b: "$coronation_events_klank.1012.b$"
  coronation_events_klank.1013.b.desc: "Trong vòng 10 năm, [domain|E] của Ngài sẽ không được tăng [development|E]."
  coronation_events_klank.1013.ten_year_plan: "Sau 10 năm, [development|E] của Ngài và các [domains|E] của những [vassals|E] khác sẽ được gia tăng. Mức thay đổi thực tế phụ thuộc vào [stewardship|E] và [diplomacy|E] của [liege|E]."

  coronation_events_klank.1014.t: "[ROOT.Char.GetPrimaryTitle.GetName] Tập Trung Quyền Lực: Kết Cục"
  coronation_events_klank.1014.desc: "Mười năm trước, trong lễ đăng quang của ta, ta đã vạch ra con đường cho [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Trải qua đau đớn và gian khổ, của cải đã trực tiếp chảy về lãnh địa của ta, trong khi các chư hầu phải chịu tổn thất. Nhưng điều đó là xứng đáng.\n\nGiờ đây đã đến lúc gặt hái thành quả từ tài quản trị của ta, và từ sự nhạy bén đã giúp ta hoàn thành tầm nhìn vĩ đại ấy."
  coronation_events_klank.1014.county_effect: "Mỗi [county|E] trong [domain|E] của họ sẽ bị giảm [development|E] 20%"
  coronation_events_klank.1014.a: "Tuyệt vời!"
  coronation_events_klank.1014.b: "Chuyện này vẫn chưa kết thúc."
  coronation_events_klank.1014.development_gain: "Cải cách của ngài đã khiến các [domains|E] của [vassal|E] mất đi tổng cộng #P [ROOT.Char.MakeScope.Var('development_lost').GetValue]#! điểm [development|E]. Các [skills|E] [stewardship|E] và [learning|E] của ngài cho phép ngài phân bổ lại #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#! trong số đó vào [domain|E] của ngài."
  custom.ten_most_powerful_vassals.1014: "Các chư hầu đã trở thành đối tượng của cuộc cải cách:"
  coronation_events_klank.1014.b.county_effect: "Mỗi [county|E] trong lãnh địa của họ nhận [GetModifier('ach_realm_centralization_county_lvl_2').GetNameWithTooltip] [modifier|E] trong 10 năm."

  coronation_events_klank.1015.t: "[ROOT.Char.GetPrimaryTitle.GetName] Phân Quyền: Kết Cục"
  coronation_events_klank.1015.desc: "Mười năm trước, trong lễ đăng quang của ta, ta đã vạch ra con đường cho [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Các chư hầu của ta thịnh vượng nhờ những chính sách sáng suốt, trong khi lãnh địa của chính ta bị bỏ mặc không phát triển. Nhưng điều đó là xứng đáng.\n\nGiờ đây đã đến lúc gặt hái thành quả từ tài quản trị, sự nhạy bén và ngoại giao khéo léo đã giúp ta hoàn thành tầm nhìn vĩ đại ấy."
  coronation_events_klank.1015.county_effect: "Mỗi [county|E] trong [domain|E] của họ sẽ được tăng [development|E] thêm #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#! nhờ vào các [skills|E] [stewardship|E] và [diplomacy|E] của ngài."
  coronation_events_klank.1015.a: "$coronation_events_klank.1014.a$"
  coronation_events_klank.1015.b: "$coronation_events_klank.1014.b$"
  custom.ten_most_powerful_vassals.1015: "$custom.ten_most_powerful_vassals.1014$"
  coronation_events_klank.1015.b.county_effect: "Mỗi [county|E] trong [domain|E] của họ nhận [GetModifier('ach_realm_autonomy_county_lvl_2').GetNameWithTooltip] [modifier|E] trong 10 năm."

  ach_realm_centralization_vassal_lvl_1: "Cải Cách Tập Trung: Gánh Chịu Hệ Quả"
  ach_realm_centralization_vassal_lvl_1_desc: "Chư hầu này là đối tượng trong cuộc cải cách tập trung quyền lực của chúa thượng tối cao."
  ach_realm_centralization_vassal_lvl_2: "$ach_realm_autonomy_vassal_lvl_1$"
  ach_realm_centralization_vassal_lvl_2_desc: "$ach_realm_autonomy_vassal_lvl_1_desc$"
  ach_realm_centralization_county_lvl_1: "Cải Cách Tập Trung: Nguồn Cung Ứng Tài Nguyên"
  ach_realm_centralization_county_lvl_1_desc: "Quận này đang gánh chịu gánh nặng từ cuộc cải cách tập trung quyền lực của chúa thượng tối cao. Tài nguyên vốn dùng cho phát triển địa phương nay được chuyển về kinh đô."
  ach_realm_centralization_county_lvl_2: "$ach_realm_autonomy_county_lvl_1$"
  ach_realm_centralization_county_lvl_2_desc: "$ach_realm_autonomy_county_lvl_1_desc$"
  ach_realm_centralization_liege_lvl_1: "Cải Cách Tập Trung: Đại Kiến Trúc Sư"
  ach_realm_centralization_liege_lvl_1_desc: "Nhân vật này mang trong mình tầm nhìn vĩ đại cho tương lai của vương quốc, bất chấp cái giá phải trả hay suy nghĩ của các chư hầu đang gánh chịu hệ quả. [stewardship|E] và [learning|E] sẽ quyết định kết cục của cuộc cải cách."
  ach_realm_centralization_liege_lvl_2: "$ach_realm_autonomy_liege_lvl_1$"
  ach_realm_centralization_liege_lvl_2_desc: "$ach_realm_autonomy_liege_lvl_1_desc$"
  ach_realm_autonomy_vassal_lvl_1: "Cải Cách Phân Quyền: Người Hưởng Lợi"
  ach_realm_autonomy_vassal_lvl_1_desc: "Chư hầu này là đối tượng trong cuộc cải cách phân quyền của chúa thượng tối cao."
  ach_realm_autonomy_vassal_lvl_2: "$ach_realm_autonomy_vassal_lvl_1$"
  ach_realm_autonomy_vassal_lvl_2_desc: "$ach_realm_autonomy_vassal_lvl_1_desc$"
  ach_realm_autonomy_county_lvl_1: "Cải Cách Phân Quyền: Mục Tiêu"
  ach_realm_autonomy_county_lvl_1_desc: "Quận này là mục tiêu của cuộc cải cách phân quyền từ chúa thượng tối cao. Tài nguyên vốn chảy về kinh đô nay được chia sẻ cho các chư hầu."
  ach_realm_autonomy_county_lvl_2: "$ach_realm_autonomy_county_lvl_1$"
  ach_realm_autonomy_county_lvl_2_desc: "$ach_realm_autonomy_county_lvl_1_desc$"
  ach_realm_autonomy_liege_lvl_1: "Cải Cách Phân Quyền: Đại Kiến Trúc Sư"
  ach_realm_autonomy_liege_lvl_1_desc: "Nhân vật này mang trong mình tầm nhìn vĩ đại về một vương quốc nơi mọi ngóc ngách đều huy hoàng như kinh đô. [stewardship|E] và [diplomacy|E] sẽ quyết định kết cục của cuộc cải cách."
  ach_realm_autonomy_liege_lvl_2: "$ach_realm_autonomy_liege_lvl_1$"
  ach_realm_autonomy_liege_lvl_2_desc: "$ach_realm_autonomy_liege_lvl_1_desc$"
  ach_no_reforms_modifier: "Một Vương Quốc Vĩ Đại"
  ach_no_reforms_modifier_desc: "Vương quốc rộng lớn của nhân vật này được xem là hoàn hảo như hiện tại, không cần bất kỳ cải cách nào. Người cai trị chỉ việc thư giãn và tận hưởng sự huy hoàng của nó."

  coronation_events_klank.1016.t: "[host.Custom('GirlBoy')|U] Trở Thành [host.GetTitleAsNameNoTooltip]"
  coronation_events_klank.1016.desc: "[teller.GetName] kết thúc câu chuyện kỳ quặc của [teller.GetHerHis] về một [supporter.Custom('GetRandomRegionalBird')] đang chơi đùa với một [supporter.Custom('RandomWeirdObject')] trên xác một [supporter.Custom('RegionalFarmAnimal')]. [listener.GetName] trông có vẻ hơi bị cuốn hút.\n\nĐến lượt ta kể một câu chuyện. Và ta có một điều hoàn hảo. Ta sẽ kể cho họ nghe về lúc [memory.GetDescription], khi vị chủ nhà hào phóng của chúng ta vẫn chỉ là một đứa trẻ."
  coronation_events_klank.1016.desc.supporter: "Bởi lẽ quá rõ ràng rằng [host.GetTitledFirstName] luôn được định mệnh an bài cho sự vĩ đại, và rằng một ngày nào đó chúng ta sẽ chứng kiến [host.GetHerHis] bước lên ngai vàng."
  coronation_events_klank.1016.desc.detractor: "Bởi lẽ quá rõ ràng rằng [host.GetTitledFirstName] được định mệnh an bài cho mọi thứ, trừ ngai vàng. Khốn khổ cho tất cả những thần dân tương lai của [host.GetHerHis]."
  coronation_events_klank.1016.a: ""Ngay từ thuở ấu thơ, một [host.GetTitleAsNameNoTooltip] không xứng đáng.""
