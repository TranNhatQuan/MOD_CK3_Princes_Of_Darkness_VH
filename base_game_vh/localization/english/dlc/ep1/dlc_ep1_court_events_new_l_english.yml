l_english:
  court_new.0001.t: "Thanh Gươm Damocles"
  court_new.0001.desc.intro: "Ta nghe thấy một tiếng răng rắc đột ngột khi một phần giàn giáo gãy ra và rơi xuống đất, suýt nữa thì trúng một người hầu nếu không nhờ phản xạ nhanh nhạy của [bodyguard_candidate.GetFirstName]."
  court_new.0001.desc.murdered: "I am sharply reminded of the grisly murder of [murdered_person.GetName], taken before [murdered_person.GetHerHis] time."
  court_new.0001.desc.murderer: "Ta chợt nhớ đến những âm mưu giết chóc của [murder_dude.GetName], một kẻ vô lại thuộc hạng tệ hại nhất."
  court_new.0001.desc.paranoid: "Gần đây ta thường thấy những cái bóng lảng vảng nơi khóe mắt — những bóng ma quỷ quyệt, hiển nhiên mang ý định sát hại. Sự cố lần này chỉ càng củng cố cảm giác nguy hiểm đang cận kề."
  court_new.0001.desc.outro: "\n\nLiệu đây có phải là một âm mưu bẩn thỉu khác? Cuộc đời của một [ROOT.Char.GetTitleAsNameNoTooltip] có thể đầy rẫy những hiểm họa kinh hoàng nhất, như thể một thanh gươm được treo cẩu thả luôn lơ lửng trên đầu ta, chỉ chờ rơi xuống bất cứ lúc nào.\n\nGiá như ta có ai đó để trông chừng mình — một người bảo hộ cho thân xác phàm trần này. Gã kia, [bodyguard_candidate.GetFirstName]; nếu từng có ai đó chăm chỉ và vững vàng thì chính là người ấy. Có lẽ ta nên bổ nhiệm [bodyguard_candidate.GetHerHim] vào vị trí này."
  court_new.0001.a: "[bodyguard_candidate.GetFirstNameNoTooltip] sẽ là một cận vệ xuất sắc."
  court_new.0001.a.murderer: "Ta không phải Xóa Bạn người duy nhất ở nơi này..."
  court_new.0001.b: "Ta chắc mình vẫn ổn mà không cần đến [bodyguard_candidate.GetHerHim]."
