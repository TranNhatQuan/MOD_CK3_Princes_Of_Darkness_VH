l_english:
  ep1_decision.0101.t:0 "Tiễn Cái Cũ Đi"
  ep1_decision.0101.desc:0 "Bọn lười biếng! Bọn ăn không ngồi rồi!\n\nTriều đình của ta đang #EMP bị vây hãm#! bởi lũ ký sinh như rệp trong vườn, chiếm cứ mọi căn phòng có thể, ngáy ngủ ngày đêm và để bô vệ sinh vương vãi khắp các hành lang chật hẹp.\n\nChuyện này không thể tiếp diễn được. Chúng ta đơn giản là không còn #EMP chỗ#! cho đám khách vãng lai này."
  ep1_decision.0101.a:0 "[capital.GetNameNoTierNoTooltip] không phải là quán trọ. Cút đi, lũ hút máu!"
  ep1_decision.0101.b:0 "Tất cả những kẻ không có việc làm hoặc không cùng huyết thống với ta, #EMP ra ngoài#!!"
  ep1_decision.0101.c:0 "Có lẽ chúng ta có thể kê thêm vài cái giường trong chuồng ngựa..."

  ep1_decision.0111.t:0 "Trang Trí Phô Trương"
  ep1_decision.0111.desc:0 "Một số ứng cử viên trang trí lại đầy triển vọng hiện ra trước mắt ta, những người gần gũi và đáng chú ý nhất: các lãnh địa của [option_1.GetTitledFirstName], [option_2.GetTitledFirstName], và [option_3.GetTitledFirstName].\n\nChọn một phong cách được coi là danh tiếng hơn triều đình của ta sẽ khiến ta phải hạ mình, nhưng lại mang đến cho ta phần nào khí chất tráng lệ của vương quốc ngoại bang.\n\nNgược lại, mô phỏng một lãnh địa kém hơn sẽ thể hiện sự rộng lượng và xây dựng danh tiếng của ta ở nước ngoài, đổi lại là mất đi một phần uy tín trong nước."
  ep1_decision.0111.toast.t:0 "[ROOT.Char.GetTitledFirstName] đã mô phỏng một trong những đại sảnh của ta"
  ep1_decision.0111.a.greater_cgv:0 "Triều đình [option_1.GetPrimaryTitle.GetAdjectiveNoTooltip|U] thật sự, thật sự tráng lệ."
  ep1_decision.0111.a.lesser_cgv:0 "Người dân của [option_1.GetPrimaryTitle.GetNamePossessiveNoTooltip|U] #EMP có thể#! cần đến lòng hảo tâm của ta."
  ep1_decision.0111.b.greater_cgv:0 "Ta thấy kiến trúc [option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] thật mê hoặc!"
  ep1_decision.0111.b.lesser_cgv:0 "Kiến trúc [option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] thô sơ nhưng đầy cảm hứng!"
  ep1_decision.0111.c.greater_cgv:0 "Có lẽ một đại sảnh yến tiệc theo phong cách [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
  ep1_decision.0111.c.lesser_cgv:0 "Một đại sảnh yến tiệc [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip] mộc mạc có lẽ sẽ là một điều mới lạ?"
  ep1_decision.0111.d:0 "Tất cả những thứ này trông đều #EMP đáng báo động#! là xa lạ..."
  ep1_decision.0111.d.tt:0 "[gold|E] của Ngài được hoàn lại"
 
  promote_other_culture_development_decision_name:0 "Tôn Vinh Các Nền Văn Hóa Khác"
  promote_other_culture_development_decision_desc: "Hãy ban thưởng cho những người đã phục vụ chúng ta một cách trung thành, để họ có thể trưởng thành và phát triển song hành cùng triều đại mà họ tận tụy phụng sự!"
  promote_other_culture_development_decision_tooltip:0 "Cải thiện mức phát triển của các [counties|E] thuộc những [cultures|E] khác với [cultural_acceptance|E] cao"
  promote_other_culture_development_decision_not_acceptance_tt:0 "Không có [culture|E] nào có [cultural_acceptance|E] cao hơn #V 75%#! trong [realm|E] của Ngài"
  promote_other_culture_development_decision_confirm:0 "Phân Phát Tiền Bạc"
  promote_other_culture_development_decision_effect_summary:0 "Mỗi [county|E] thuộc [current_culture.GetName] trong [realm|E] nhận được [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L] trong 10 năm"
  promote_other_culture_development_decision_no_effect:0 "Mỗi [county|E] trong [realm|E] thuộc một [culture|E] có [cultural_acceptance|E] cao hơn #V 75%#! sẽ nhận được [GetModifier('promote_culture_modifier' ).GetNameWithTooltip|L] trong 10 năm"
  promote_culture_leader_modifier:0 "Tôn Vinh Sự Đa Dạng Văn Hóa"

  ep1_decision.0201.t:0 "Các Nhà Ngôn Ngữ Học Trong Triều"
  ep1_decision.0201.desc:1 "Cuối cùng, cuộc tìm kiếm một nhà ngôn ngữ học tiếng [target_court_language.GetCourtLanguage.GetName] đã mang lại kết quả. Các ứng viên được trình diện trước mặt ta, mỗi người đều mang theo chuyên môn riêng về các ngôn ngữ ngoại quốc."
  ep1_decision.0201.tt.aptitude:0 "[selected_linguist.GetUINamePossessive] có [aptitude|E] là [selected_linguist.GetCourtPositionAptitude( GetCourtPositionType( 'court_tutor_court_position' ) )]"
  ep1_decision.0201.a:2 "[good_linguist.GetNameNoTooltip] là một nhà ngôn ngữ học tiếng [target_court_language.GetCourtLanguage.GetNameNoTooltip] lừng danh."
  ep1_decision.0201.b:0 "[medium_linguist.GetNameNoTooltip] sẽ làm tròn nhiệm vụ."
  ep1_decision.0201.c:1 "[scholarly_linguist.GetNameNoTooltip] là một chuyên gia tiếng [target_court_language.GetCourtLanguage.GetNameNoTooltip] nổi tiếng!"
  ep1_decision.0201.d:0 "Ta biết [cheap_linguist.GetNameNoTooltip] gần như sẽ làm việc miễn phí!"
  ep1_decision.0201.e:0 "Nghĩ lại thì..."
  learn_court_language_toast_title:1 "Đã Thuê Giáo Viên [target_court_language.GetCourtLanguage.GetName]"
