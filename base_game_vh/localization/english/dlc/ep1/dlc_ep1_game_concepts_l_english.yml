l_english:
  game_concept_royal_court:0 "Triều đình Hoàng gia"
  game_concept_royal_courts:0 "Các Triều đình Hoàng gia"
  game_concept_royal_court_desc:2 "Những [rulers|E] danh tiếng có đủ uy danh để duy trì một Triều đình Hoàng gia, mang lại quyền tiếp cận đến nhiều loại thưởng và cơ hội.\n\nKhi một [ruler|E] theo chính thể [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] hoặc [GetGovernment( 'tribal_government' ).GetName] trở thành [king|E] hoặc [emperor|E], họ sẽ được quyền tiếp cận Triều đình Hoàng gia của mình.\n\nMỗi Triều đình Hoàng gia đều có một [court_grandeur_level|E], mang lại lợi ích dựa trên mức độ danh tiếng của Triều đình Hoàng gia và loại [court_type|E] mà Triều đình đó thuộc về.\n\nNhững người thỉnh cầu, [vassals|E] và [courtiers|E] có thể xuất hiện tại Triều đình Hoàng gia của Ngài, hoặc Ngài có thể [hold_court|E] để mời bất kỳ ai trong [realm|E] đến trình bày khiếu nại của họ.\n\nTriều đình Hoàng gia cũng cho phép Người cai trị trưng bày [court_artifacts|E], và các [guests|E] được [inspired|E] có thể xuất hiện tại Triều đình Hoàng gia, đề nghị tạo ra các [artifacts|E] mới.\n\nKhi Ngài qua đời, [player_heir|E] của Ngài sẽ thừa kế Triều đình Hoàng gia."
  game_concept_court_grandeur_level:0 "Cấp độ Uy thế Triều đình"
  game_concept_court_grandeur_levels:0 "Các Cấp độ Uy thế Triều đình"
  game_concept_grandeur_level:0 "Cấp độ Uy thế"
  game_concept_grandeur_levels:0 "Các Cấp độ Uy thế"
  game_concept_court_grandeur_level_desc:2 "Cấp độ Uy thế của một [royal_court|E] mang lại các lợi ích cho chủ sở hữu của nó, và được mở khóa khi [court_grandeur_value|E] của Triều đình tăng lên.\n\nNgoài các hiệu ứng của từng cấp độ, các [realms|E] lớn được kỳ vọng sẽ đạt đến những Cấp độ Uy thế cao hơn. Điều này được gọi là [court_grandeur_expectations|E]."
  game_concept_court_grandeur:0 "Uy thế Triều đình"
  game_concept_grandeur:0 "Uy thế"
  game_concept_court_grandeur_value:0 "Giá trị Uy thế Triều đình"
  game_concept_court_grandeur_desc:2 "Giá trị $game_concept_court_grandeur_value$ của một [royal_court|E] thể hiện mức độ danh tiếng của Triều đình, và mở khóa các [court_grandeur_levels|E] mới khi nó tăng lên.\n\nGiá trị này nằm trong khoảng từ 0 đến 100, và theo thời gian sẽ ổn định ở mức Giá trị Cơ sở. Giá trị Cơ sở bị ảnh hưởng bởi các yếu tố như [dynasty_perks|E], mức chi tiêu cho [court_amenities|E], và việc Ngài có sở hữu những [court_artifacts|E] lộng lẫy hay không.\n\nMột phần Uy thế sẽ bị mất đi khi xảy ra [succession|E]."
  game_concept_court_amenities:0 "Tiện nghi Triều đình"
  game_concept_court_amenity:0 "Tiện nghi Triều đình"
  game_concept_amenities:0 "Tiện nghi"
  game_concept_court_amenities_desc:1 "$game_concept_court_amenities$ là các tiêu chuẩn sinh hoạt được thiết lập trong [royal_court|E].\n\nChúng được quyết định bởi [ruler|E] của [royal_court|E], với mỗi hạng mục (thời trang, ẩm thực, chỗ ở và gia nhân) có nhiều cấp độ khác nhau. Chi tiêu nhiều hơn cho Tiện nghi thường mang lại nhiều [court_grandeur_value|E] hơn.\n\nNhững Người cai trị theo chính thể [GetGovernment( 'tribal_government' ).GetName] bị cấm lựa chọn các Tiện nghi ở cấp cao."
  game_concept_court_grandeur_expectations:0 "Kỳ vọng Uy thế Triều đình"
  game_concept_court_grandeur_expectation:0 "Kỳ vọng Uy thế Triều đình"
  game_concept_grandeur_expectations:0 "Các Kỳ vọng Uy thế"
  game_concept_court_grandeur_expectations_desc:2 "Ngài được kỳ vọng phải có một [court_grandeur_level|E] đủ cao so với [realm_size|E] của mình.\n\nKhi [realm|E] của Ngài mở rộng, thần dân và cả thế giới bên ngoài sẽ kỳ vọng [royal_court|E] của Ngài cũng phải tráng lệ tương xứng.\n\nNếu Ngài không đáp ứng được kỳ vọng, nhiều hình phạt khác nhau sẽ được áp dụng. Ngược lại, nếu Ngài vượt qua kỳ vọng, Ngài sẽ nhận được nhiều phần thưởng.\n\nKỳ vọng của các Người cai trị theo chính thể [GetGovernment( 'tribal_government' ).GetName] luôn luôn bằng với mức Uy thế hiện tại của họ."
  game_concept_hold_court:0 "$activity_hold_court$"
  game_concept_holding_court:0 "Thiết triều"
  game_concept_hold_court_desc:0 "Một [activity|E] nơi [vassals|E] và [courtiers|E] trong một [realm|E] tụ họp tại [royal_court|E] để trình bày kiến nghị với [liege|E] của họ và bày tỏ các bất bình.\n\nNhững tình huống mà Lãnh chúa phải đưa ra phán quyết có thể dao động từ những tranh chấp nhỏ nhặt và hiểu lầm cho đến các thảm họa trên toàn cõi. Hầu hết các vấn đề đều có một giải pháp mang lại lợi ích — nếu không phải cho các bên liên quan thì ít nhất cũng cho lãnh chúa."
  game_concept_court_type:0 "Loại Triều đình"
  game_concept_court_types:0 "Các Loại Triều đình"
  game_concept_court_type_desc:3 "Là một phần của [royal_court|E], các [rulers|E] có thể chỉ định một $game_concept_court_type$.\n\nMỗi $game_concept_court_type$ cung cấp cho Người cai trị và [court|E] một tập hợp các lợi ích riêng, phụ thuộc vào [court_grandeur_level|E].\n\n[ethos|E] của [culture|E] mà Người cai trị thuộc về quyết định những Loại Triều đình nào họ có thể có.\n\nCác Loại Triều đình bao gồm:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 
  game_concept_court_type_trait:0 "Đặc điểm Loại Triều đình"
  game_concept_court_type_trait_desc:2 "Sau khi phục vụ [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [royal_court|E], một [courtier|E] sẽ nhận được một [trait|E] phản ánh [court_type|E] của Triều đình đó.\n\nChất lượng của Đặc điểm này được quyết định bởi thời gian mà [character|E] đã phục vụ với tư cách là Cận thần trong Triều đình."
 
  game_concept_court_language:0 "Ngôn ngữ Triều đình"
  game_concept_court_languages:0 "Các Ngôn ngữ Triều đình"
  game_concept_court_language_desc:1 "Ngôn ngữ Triều đình là [language|E] chính thức của một [royal_court|E], được tầng lớp quý tộc sử dụng và bộ máy hành chính dùng làm ngôn ngữ làm việc.\n\nGiá trị Cơ sở của [court_grandeur|E] sẽ tăng lên với mỗi [realm|E] [county|E] chia sẻ cùng Ngôn ngữ, với mỗi Triều đình Hoàng gia sử dụng cùng một Ngôn ngữ Triều đình, và nếu đó là Ngôn ngữ bản địa của [ruler|E]."

  game_concept_inspiration:0 "Cảm hứng"
  game_concept_inspirations:0 "Các Cảm hứng"
  game_concept_inspired:0 "Được Truyền cảm hứng"
  game_concept_inspiration_desc:2 "Những [characters|E] được Truyền cảm hứng là các nghệ nhân lành nghề, sở hữu một [project|E] có thể trở thành hiện thực nếu Ngài trở thành [sponsor|E] của họ.\n\nNgài có thể sử dụng [decision|E] Đặt làm Hiện vật để thuê một Nhân vật như vậy nhằm tạo ra một [artifact|E].[SelectLocalization( HasDlcFeature( 'royal_court' ), 'game_concept_inspiration_desc_DLC', '' )]\n\nKhi Dự án của họ hoàn thành, Người bảo trợ sẽ được giữ lại thành quả, thường là một Hiện vật."
  game_concept_inspiration_desc_DLC:0 "\n\nNgoài ra, các Nhân vật được Truyền cảm hứng sẽ định kỳ xuất hiện tại các [royal_courts|E], đặc biệt là những Triều đình có [court_grandeur_level|E] cao."
  game_concept_sponsor:0 "Người bảo trợ"
  game_concept_sponsored: "Được bảo trợ"
  game_concept_sponsor_desc:2 "Một $game_concept_sponsor$ là một [ruler|E] tài trợ cho [project|E] của một [character|E] [inspired|E]."

  game_concept_artifact:0 "Hiện vật"
  game_concept_artifacts:0 "Các Hiện vật"
  game_concept_artifact_i: "@artifact_icon!"
  game_concept_artifact_desc:5 "Hiện vật là một vật phẩm đáng chú ý, mang lại các lợi ích cho [character|E] sử dụng nó.\n\n[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_artifact_desc_DLC', 'game_concept_artifact_desc_NO_DLC' )]\n\nMột số Hiện vật đặc biệt hơn những cái khác và có [rarity|E] cao hơn.\n\nTương tự như với [titles|E], các Nhân vật có thể có [artifact_claims|E] đối với một Hiện vật và tìm cách chiếm lấy Hiện vật đó cho riêng mình.\n\nCác Hiện vật cũng có [durability|E]: khi giá trị này về 0, Hiện vật sẽ bị phá hủy.\n\nHiện vật luôn được thừa kế bởi [player_heir|E] của chủ sở hữu. Nếu một Hiện vật được thừa kế bởi người không phải là [close_family_member|E], nó sẽ mất [durability|E] hoặc thậm chí bị phá hủy hoàn toàn."
  game_concept_artifact_desc_NO_DLC:0 "Vì Hiện vật được đeo hoặc mang theo bên mình, chúng cũng được gọi là [inventory_artifacts|E]."
  game_concept_artifact_desc_DLC:0 "Các Hiện vật được chia thành hai loại:\n$BULLET_WITH_TAB$[inventory_artifacts|E] được đeo hoặc mang theo bởi một Nhân vật\n$BULLET_WITH_TAB$[court_artifacts|E] được trưng bày trong [royal_court|E] của một [ruler|E]"
  game_concept_court_artifact:0 "Hiện vật Triều đình"
  game_concept_court_artifacts:0 "Các Hiện vật Triều đình"
  game_concept_court_artifact_desc:3 "Hiện vật Triều đình là một [artifact|E] được trưng bày trong [royal_court|E] của một [ruler|E], chẳng hạn như thảm treo tường hoặc những cuốn sách minh họa tinh xảo.\n\nCác Hiện vật Triều đình là một trong những yếu tố quyết định [court_grandeur|E] của một Triều đình Hoàng gia.\n\nKhông có giới hạn về số lượng Hiện vật mà một Nhân vật có thể sở hữu, nhưng chỉ những Hiện vật được trưng bày trong đúng ô loại của chúng mới có tác dụng.\n\nNgài có thể tạo các Hiện vật Triều đình mới từ các [characters|E] [inspired|E], từ Quyết định Đặt làm Hiện vật, hoặc bằng cách chọn [reforge|E] một [inventory_artifact|E]."
  game_concept_inventory_artifact:0 "Hiện vật Trang bị"
  game_concept_inventory_artifacts:0 "Các Hiện vật Trang bị"
  game_concept_inventory_artifact_desc:4 "Hiện vật Trang bị là các [artifacts|E] mà một [character|E] đeo hoặc mang theo bên mình, chẳng hạn như vũ khí hoặc vương miện.\n\nKhông có giới hạn về số lượng Hiện vật mà một Nhân vật có thể có, nhưng chỉ những Hiện vật được trang bị trong đúng ô loại của chúng mới có tác dụng.\n\nNgài có thể tạo các Hiện vật Trang bị mới từ các [characters|E] [inspired|E], hoặc từ Quyết định Đặt làm Hiện vật."
  game_concept_project:0 "Dự án"
  game_concept_project_desc:2 "Một Dự án là thứ mà một [character|E] [inspired|E] thực hiện với sự trợ giúp của một [sponsor|E] nhằm hiện thực hóa tầm nhìn của họ, thường là dưới hình thức tạo ra một [artifact|E]."
  game_concept_artifact_durability:0 "Độ bền Hiện vật"
  game_concept_durability:0 "Độ bền"
  game_concept_artifact_durability_desc:2 "Mỗi [artifact|E] đều có một Độ bền. Khi toàn bộ Độ bền bị mất, Hiện vật sẽ bị phá hủy.\n\nĐộ bền sẽ suy giảm theo thời gian, nhưng cũng có thể bị mất trong một số sự kiện nhất định, chẳng hạn như [sieges|E] và khi xảy ra [succession|E].\n\nĐộ bền có thể được khôi phục bằng cách chọn [reforge|E] hoặc [repair|E] Hiện vật."
  game_concept_artifact_claim:0 "Yêu sách Hiện vật"
  game_concept_artifact_claims:0 "Các Yêu sách Hiện vật"
  game_concept_artifact_claim_desc:3 "Một $game_concept_artifact_claim$ đại diện cho quyền pháp lý của ai đó đối với một [artifact|E].\n\nViệc có Yêu sách đối với một [artifact|E] có nghĩa là Ngài có thể thực hiện nhiều hành động khác nhau liên quan đến Hiện vật đó và chủ sở hữu của nó nếu hiện tại Ngài không sở hữu nó (ví dụ như sử dụng [scheme|E] [GetScheme('steal_back_artifact').GetTypeName]).\n\nCó [personal_artifact_claims|E] dành cho [character|E], và [house_artifact_claims|E] dành cho các [houses|E].\n\nYêu sách Hiện vật đơn giản hơn so với [title_claims|E]; chúng hoặc tồn tại, hoặc không. Chúng cũng không được thừa kế qua quá một thế hệ."
  game_concept_personal_artifact_claim:0 "Yêu sách Hiện vật Cá nhân"
  game_concept_personal_artifact_claims:0 "Các Yêu sách Hiện vật Cá nhân"
  game_concept_personal_artifact_claim_desc:2 "Một $game_concept_personal_artifact_claim$ là một [artifact_claim|E] mang tính cá nhân đối với Ngài, trái ngược với một [house_artifact_claim|E].\n\nKhi Ngài qua đời, con cái của Ngài sẽ nhận được Yêu sách đối với tất cả các Hiện vật của Ngài.\n\nNgài cũng nhận được Yêu sách đối với một Hiện vật nếu nó bị đánh cắp trong một [siege|E] hoặc [raid|E].\n\nYêu sách Hiện vật không bao giờ được thừa kế."
  game_concept_house_artifact_claim:0 "Yêu sách Hiện vật Gia tộc"
  game_concept_house_artifact_claims:0 "Các Yêu sách Hiện vật Gia tộc"
  game_concept_house_artifact_claim_desc:1 "Nếu Ngài giữ một [artifact|E] đủ lâu, toàn bộ [house|E] của Ngài sẽ có một [artifact_claim|E] đối với nó — một $game_concept_house_artifact_claim$.\n\nNgài chỉ có thể hành động dựa trên một $game_concept_house_artifact_claim$ nếu Hiện vật đó không được giữ bởi một thành viên trong gia tộc của Ngài.\n\nKhi một [cadet_branch|E] được thành lập, mọi Yêu sách Gia tộc hiện có đối với các Hiện vật do các thành viên của Gia tộc mới nắm giữ sẽ được chuyển sang Gia tộc mới."
 
  game_concept_court_position:0 "Chức vụ Triều đình"
  game_concept_court_position_i: "@court_position_icon!"
  game_concept_court_positions:0 "Các Chức vụ Triều đình"
  game_concept_court_position_desc:2 "$game_concept_court_positions$ là các vai trò chuyên biệt có thể được ban cho [courtiers|E] và [vassals|E] nhằm hỗ trợ [liege|E] của họ.\n\nLợi ích Ngài nhận được từ các $game_concept_court_positions$ được quyết định bởi [aptitude|E] của người nắm giữ đối với chức vụ đó.\n\nViệc bổ nhiệm $game_concept_court_positions$ là miễn phí, nhưng Ngài phải trả lương hàng tháng bằng [gold|E], và việc thu hồi chúng sẽ tốn [prestige|E]."

  game_concept_aptitude:0 "Năng lực"
  game_concept_aptitude_desc: "Năng lực ($game_concept_aptitude$) của một [character|E] quyết định mức độ hiệu quả của họ khi đảm nhiệm các vai trò khác nhau tại [court|E]. Những vai trò này bao gồm [court_positions|E], [diarchs|E] và [tax_collectors|E].\n\n$game_concept_aptitude$ được đo bằng 5 cấp độ, từ Tệ hại đến Xuất sắc. Cấp độ $game_concept_aptitude$ của một Nhân vật sẽ quyết định các lợi ích mà [liege|E] nhận được khi sử dụng họ trong một vai trò tại [court|E].\n\nVí dụ, một Nhân vật có đặc điểm [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] sẽ tự nhiên phù hợp hơn để phục vụ với tư cách là $court_physician_court_position$."
  game_concept_aptitude_i: "#P @aptitude:5:inherit_color!#!"

  game_concept_court_event:0 "Sự kiện Triều đình"
  game_concept_court_events:0 "Các Sự kiện Triều đình"
  game_concept_court_event_desc:0 "Một $game_concept_court_event$ là một sự kiện liên quan đến các thành viên trong [court|E] của Ngài, và có thể được xem trong [royal_court|E]."
  game_concept_petition_liege:0 "Thỉnh cầu"
  game_concept_petition_liege_desc:1 "Một cơ hội để [vassals|E] yêu cầu sự trợ giúp từ [liege|E] của họ.\n\nNhiều vấn đề khác nhau có thể được nêu ra, và việc chấp thuận hay không là do [liege|E] quyết định."
  game_concept_pay_homage:0 "Bày tỏ Trung thành"
  game_concept_pay_homage_desc:0 "Một [activity|E] trong đó [vassals|E] có thể chính thức thể hiện sự trung thành của mình với [liege|E].\n\nViệc bày tỏ trung thành có thể được thực hiện theo nhiều cách khác nhau, và có thể mang lại [opinion|E], [prestige|E] và [dynasty_prestige|E] cho cả hai bên."

  repair_or_reforge_and_repair:0 "[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'repair_and_reforge', 'just_repair' )]"
  repair_and_reforge:0 "[reforge|E] hoặc [repair|E]"
  just_repair:0 "[repair|E]"
  game_concept_reforge_artifact:0 "Tái rèn Hiện vật"
  game_concept_reforge:0 "Tái rèn"
  game_concept_reforge_artifact_desc:0 "Một số [inventory_artifacts|E] có thể được Tái rèn, biến chúng thành [court_artifacts|E].\n\nNgài cần có một [GetCourtPositionType('antiquarian_court_position').GetName()] và trả [gold|E] để Tái rèn một [artifact|E], tuy nhiên các Hiện vật cũ sẽ rẻ hơn để Tái rèn.\n\nTương tự như khi Ngài [repair|E] một [artifact|E], [durability|E] của nó sẽ được khôi phục.\n\nChỉ Vũ khí, Giáp, Vương miện và Pháp bảo mới có thể được Tái rèn, và chúng luôn trở thành Vật phẩm Bệ trưng bày."
  game_concept_repair_artifact:0 "Sửa chữa Hiện vật"
  game_concept_repair:0 "Sửa chữa"
  game_concept_repair_artifact_desc: "Khi một [artifact|E] có [durability|E] thấp, Ngài có thể chọn Sửa chữa nó.\n\nNgài cần trả [gold|E] để Sửa chữa một Hiện vật.[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_repair_artifact_desc_DLC', '' )]"
  game_concept_repair_artifact_desc_DLC:0 "\n\nNgoài ra, Ngài cũng có thể chọn [reforge|E] Hiện vật đó."
