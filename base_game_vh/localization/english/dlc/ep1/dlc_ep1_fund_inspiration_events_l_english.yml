 # Banner
  fund_inspiration.1042.desc:0 ""Ngay bên này thôi, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ra hiệu cho hai người hầu vừa bước ra từ xưởng dệt của [inspiration_owner.GetHerHis], tay cầm một cuộn vải. \n\n[inspiration_owner.GetSheHe|U] gật đầu. Lá cờ được mở ra, treo cao trên thanh gỗ. Ta không khỏi trầm trồ trước những đường nét tinh xảo và hoàn hảo.\n\n"
  fund_inspiration.0043.desc:0 ""Vâng thưa [ROOT.Char.GetLadyLord] của Ta, một lá cờ hùng vĩ Ta sẽ dệt cho ngài!" [inspiration_owner.GetTitledFirstName] thực sự hào hứng khi được làm việc cho Ta. "Giới quý tộc của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] đã rất quen thuộc với tác phẩm của Ta, nhưng đây là một vinh dự mới!"\n\n"Hãy tin Ta, đây sẽ không phải chỉ là một lá cờ vải tầm thường, mà sẽ là tấm rèm vương giả nhất! Ta chỉ cần biết, ngài muốn Ta thêu huy hiệu nào?""
  fund_inspiration.0043.option_title:0 "Huy hiệu của [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|U]."
  fund_inspiration.0043.option_house:0 "Biểu trưng của Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]."
  fund_inspiration.0043.option_dynasty:0 "Biểu tượng của Triều đại [ROOT.Char.GetDynasty.GetNameNoTooltip]."
  fund_inspiration.0043.option_dynasty_tt:0 "Chất lượng cờ triều đại phụ thuộc vào [dynasty_prestige_level|E]"
 # Wall Hanging
  fund_inspiration.0044.t:0 "$commission_artifact_decision$: Vật treo tường"
  fund_inspiration.0044.desc:0 "My antiquarian, [antiquarian.GetTitledFirstName], duly arrives to collect the funds for my commission. "It's about time you got some new coverings for your walls!" [antiquarian.GetSheHe|U] looks at me sheepishly. \n\n"Ahem, I shall find a skilled weaver my [ROOT.Char.GetLadyLord]... what was it you wanted made?" [antiquarian.GetSheHe|U] rolls the purse around in [antiquarian.GetHerHis] hands absentmindedly, awaiting my decision."
  fund_inspiration.0044.option_tapestry:0 "Một tấm thảm dệt tinh xảo cho đại sảnh."
  fund_inspiration.0044.option_banner:0 "Ta cần một lá cờ mới."
  fund_inspiration.you_decide_tapestry_option_tt:0 "[antiquarian.GetTitledFirstName] sẽ tìm một thợ dệt để chế tác cổ vật cho Ngài"

  fashion_industry_county_modifier: "Ngành thời trang đang phát triển"
  fashion_industry_county_modifier_desc: "Lãnh chúa của vùng đất này đã đầu tư vào sản xuất và buôn bán trang phục thời trang."
