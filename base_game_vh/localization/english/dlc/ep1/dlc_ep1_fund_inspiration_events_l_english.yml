# Armor
  fund_inspiration.0021.desc:0 "\"Ngài sẽ không hối hận khi ủng hộ Ta đâu, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đảm bảo với Ta rằng [inspiration_owner.GetSheHe] sẽ tạo ra một kiệt tác, đồng thời cũng khẳng định rằng ý kiến của Ta rất được coi trọng. \"Xin hãy cho Ta biết, ngài mong muốn loại giáp nào?\""
  fund_inspiration.0021.mail:0 "Ta muốn áo giáp xích linh hoạt."
  fund_inspiration.0021.mail.tt:0 "Không quá hào nhoáng, nhưng đáng tin cậy"
  fund_inspiration.0021.plate:0 "Một bộ giáp toàn thân sẽ giữ ta an toàn!"
  fund_inspiration.0021.plate.tt:0 "Bảo vệ và phong cách tuyệt vời, nhưng rất cồng kềnh và đắt đỏ"
  fund_inspiration.0021.scale:0 "Giáp vảy đáng tin cậy là thứ ta cần."
  fund_inspiration.0021.scale.tt:0 "Cung cấp khả năng bảo vệ tốt nhưng kém linh hoạt hơn một số lựa chọn khác"
  fund_inspiration.0021.lamellar:0 "Ngươi sẽ chế tạo giáp phiến vững chắc."
  fund_inspiration.0021.lamellar.tt:0 "Giáp linh hoạt mang lại khả năng bảo vệ cao với mức giá hợp lý"
  fund_inspiration.0021.laminar:0 "Chế tạo giáp lá."
  fund_inspiration.0021.laminar.tt:0 "Bộ giáp chắc chắn và đáng tin cậy"
  fund_inspiration.0021.brigandine:1 "Ta muốn giáp phân mảnh."
  fund_inspiration.0021.brigandine.tt:0 "Bộ giáp rất linh hoạt và thời trang"

  fund_inspiration.0022.t:0 "Cảm Hứng Chế Tạo Giáp Được Tài Trợ"

# Book
  fund_inspiration.0031.desc:0 "\"Cảm ơn vì đã tin tưởng Ta, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mỉm cười [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', inspiration_owner)] trước khi nghiêng đầu [inspiration_owner.GetHerHis].\n\n\"Tuy nhiên, Ta không chắc nên viết về điều gì. Gần đây Ta hứng thú với các chủ đề liên quan đến [SCOPE.Custom('ArtifactBookSubject')], ngài nghĩ đó có phải là trọng tâm tốt cho cuốn sách không?\""
  fund_inspiration.0031.education:0 "Cuốn sách sẽ nói về [ROOT.Char.Custom('education_focus')]."
  fund_inspiration.0031.lifestyle_reveler:0 "Hãy viết về niềm vui, về #EMP cuộc sống#!, về những bữa tiệc!"
  fund_inspiration.0031.lifestyle_blademaster:0 "Không chủ đề nào sắc bén bằng chủ đề về lưỡi kiếm!"
  fund_inspiration.0031.lifestyle_hunter:0 "Hãy để nó nói về những chi tiết của săn bắn và con mồi!"
  fund_inspiration.0031.lifestyle_mystic:0 "Cuốn sách sẽ khám phá cách tiếp cận cuộc sống khác thường của ta!"
  fund_inspiration.0031.lifestyle_herbalist:0 "Cuốn sách sẽ trình bày chi tiết về thảo mộc và cây cỏ!"
  fund_inspiration.0031.lifestyle_physician:0 "Cơ thể con người là một chủ đề đáng để đào sâu!"
  fund_inspiration.0031.lifestyle_cannibal:0 "Không gì khơi dậy #EMP cơn đói#! khám phá của ta như cơ thể con người."
  fund_inspiration.0031.lifestyle_torturer:0 "Hãy ghi chép lại vô vàn cách phá vỡ tâm trí và thân xác con người."
  fund_inspiration.0031.lifestyle_witch:0 "Ta sẽ dành tác phẩm này cho [ROOT.Char.GetFaith.WitchGodName]."
  fund_inspiration.0031.lifestyle_deviant:0 "Cuốn sách nên đào sâu vào #EMP khoái lạc#!!"
  fund_inspiration.0031.lifestyle_lunatic:0 "Cuốn sách sẽ giải thích thực tại. Một trong số đó."
  fund_inspiration.0031.focus:0 "Nó sẽ phản ánh trọng tâm cuộc sống của ta – hãy viết về [ROOT.Char.Custom('LifestyleFocus')]!"
  fund_inspiration.0031.skill_option:0 "Hãy viết về điều ta có năng khiếu – "
  fund_inspiration.0031.skill_option_martial:0 "$fund_inspiration.0031.skill_option$chiến tranh."
  fund_inspiration.0031.skill_option_diplomacy:0 "$fund_inspiration.0031.skill_option$ngoại giao."
  fund_inspiration.0031.skill_option_stewardship:0 "$fund_inspiration.0031.skill_option$quản trị."
  fund_inspiration.0031.skill_option_learning:0 "$fund_inspiration.0031.skill_option$học thuật."
  fund_inspiration.0031.skill_option_intrigue:0 "$fund_inspiration.0031.skill_option$mưu kế."
  fund_inspiration.0031.relationship_soulmate:0 "Tình yêu của ta dành cho [relationship_scope.GetTitledFirstName] là huyền thoại!"
  fund_inspiration.0031.relationship_nemesis:0 "Lòng thù hận của ta dành cho [relationship_scope.GetTitledFirstName] đủ để lấp đầy nhiều tập sách!"
  fund_inspiration.0031.dynasty:0 "Ngươi sẽ viết về Triều đại [ROOT.Char.GetDynasty.GetName] vinh quang."
  fund_inspiration.0031.mystical_animal:0 "Ta sẽ kể lại cuộc săn lùng [ROOT.Char.Custom('GetAnimalType')] trắng của mình."
  fund_inspiration.0031.pet_option_cat:0 "Xin hãy viết về con mèo yêu quý của ta, [ROOT.Char.Custom('CatStoryName')]!"
  fund_inspiration.0031.pet_option_dog:0 "Xin hãy viết về con chó yêu quý của ta, [ROOT.Char.Custom('DogStoryName')]!"
  fund_inspiration.0031.c:0 "Hãy mô tả chi tiết nỗ lực thống nhất [united_title.GetNameNoTierNoTooltip] của ta!"
  fund_inspiration.0031.d:0 "Ta đã thành lập [created_title.GetNameNoTierNoTooltip], đó là một chủ đề xứng đáng!"
  fund_inspiration.0031.e:0 "Thành công của ta trong việc khôi phục [restored_title.GetNameNoTierNoTooltip] nên được ghi chép lại!"
  fund_inspiration.0031.f:0 "Ta tin vào phán đoán của ngươi."

  fund_inspiration.0032.t:0 "Cảm Hứng Sáng Tác Sách Được Tài Trợ"

# Tapestry
  fund_inspiration.0041.desc:0 "\"Cảm ơn vì đã đặt niềm tin vào Ta, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.GetTitledFirstName] mỉm cười rồi tiếp tục \"Sự tin tưởng của ngài không hề sai lầm, bởi Ta đã dành nhiều năm rèn luyện kỹ thuật và dệt nên những tấm thảm cùng rèm treo thực sự tuyệt vời.\"\n\n\"Nhưng với ngài, Ta nghĩ một tấm thảm thêu sẽ là lựa chọn tốt nhất — một tác phẩm được dệt tinh xảo có thể ngay lập tức thu hút sự chú ý của cả căn phòng và nói lên điều gì đó về chủ nhân của nó. Câu hỏi duy nhất là, tấm thảm nên thể hiện điều gì?\""
  fund_inspiration.0041.option_battle:0 "Một sự tri ân cho chiến thắng của ta tại Trận chiến [ROOT.Var('epic_battle_location').Province.GetNameNoTooltip]."
  fund_inspiration.0041.option_abstract:0 "Một tác phẩm mang vẻ đẹp nghệ thuật trừu tượng."
  fund_inspiration.0041.option_nature:0 "Thứ gì đó phô bày vẻ đẹp hoang dã của thiên nhiên."
  fund_inspiration.0041.option_history:0 "Thứ gì đó minh họa lịch sử của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
  fund_inspiration.0041.option_life:0 "Một sự thể hiện về cuộc sống trong lãnh thổ của ta."

 #fund_inspiration.0042.desc: ""Thank you for putting your trust in me, [ROOT.Char.Custom('FormOfAddressForLiege')]! [inspiration_owner.GetTitledFirstName] smiles and continues "The idea I have for [inspiration_owner.Custom('InspirationTypeDescription')] is glorious indeed, and is sure to impress all of your courtiers and foreign guests!"\n\n"As soon as I am done, I shall send word to you so that you may be the first to gaze upon my work."

  fund_inspiration.0042.t:0 "Cảm Hứng Dệt Thảm Được Tài Trợ"

# Adventurer
  fund_inspiration.0051.desc:0 "Worry not, my great [ROOT.Char.GetTitleTierName]," [inspiration_owner.GetTitledFirstName] bows with a dramatic flair and [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))].\n\n"I shall venture out and explore the world in your stead while you continue ruling over your realm. What I bring back will be of such caliber that you will feel my accomplishments #EMP permeate#! through the memento of my adventure!"\n\nThere's a slight pause before [inspiration_owner.GetSheHe] continues. "On that note, is there an area of the world that you're interested in, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
  fund_inspiration.0051.africa:0 "Hãy đến Châu Phi!"
  fund_inspiration.0051.africa_west:0 "Ta muốn ngươi khám phá Tây Phi!"
  fund_inspiration.0051.africa_north:0 "Hãy khám phá Bắc Phi!"
  fund_inspiration.0051.africa_east:0 "Hãy khám phá Đông Phi nhân danh ta!"
  fund_inspiration.0051.europe:0 "Đi tới Châu Âu!"
  fund_inspiration.0051.europe_north:0 "Hãy tới Bắc Âu!"
  fund_inspiration.0051.europe_south:0 "Khám phá miền Nam Châu Âu!"
  fund_inspiration.0051.europe_west:0 "Hành trình tới Tây Âu!"
  fund_inspiration.0051.europe_east:0 "Khám phá Đông Âu!"
  fund_inspiration.0051.middle_east:0 "Hành trình tới Trung Đông!"
  fund_inspiration.0051.middle_east_jerusalem:0 "Ta muốn ngươi tới Jerusalem!"
  fund_inspiration.0051.middle_east_arabia:0 "Hãy đi tới Đông Ả Rập!"
  fund_inspiration.0051.middle_east_persia:0 "Ba Tư là một điểm đến xứng đáng!"
  fund_inspiration.0051.india:0 "Ấn Độ luôn khiến ta say mê!"
  fund_inspiration.0051.india_deccan:0 "Ngươi nên tới cao nguyên Deccan ở Ấn Độ!"
  fund_inspiration.0051.india_bengal:0 "Hãy khám phá Bengal!"
  fund_inspiration.0051.india_rajastan:0 "Hãy tới Rajasthan và trải nghiệm kỳ quan nơi đó!"
  fund_inspiration.0051.steppe:0 "Ngươi sẽ khám phá những thảo nguyên vĩ đại!"
  fund_inspiration.0051.steppe_west:0 "Hãy tới Thảo nguyên phương Tây!"
  fund_inspiration.0051.steppe_east:0 "Hành trình tới Thảo nguyên phương Đông!"
  fund_inspiration.0051.steppe_tarim:0 "Ngươi nên khám phá lưu vực Tarim!"
  fund_inspiration.0051.asia_minor:0 "Hành trình tới bán đảo Tiểu Á!"
  fund_inspiration.0051.burma:0 "Đến những khu rừng rậm của Miến Điện!"
  fund_inspiration.0051.tibet:0 "Đi tới Tây Tạng, nóc nhà của thế giới!"
  fund_inspiration.0051.east_asia: "Ngươi phải khám phá Đông Á"
  fund_inspiration.0051.china: "Trung Quốc huyền thoại đang gọi!"
  fund_inspiration.0051.korea: "Bán đảo Triều Tiên"
  fund_inspiration.0051.japan: "Đi tới Xứ sở Mặt Trời Mọc"
  fund_inspiration.0051.southeast_asia: "Đông Dương hứa hẹn giàu có"
  fund_inspiration.0051.d:0 "Thế giới là của ngươi, bạn ta!"

  fund_inspiration.0052.t:0 "Cảm Hứng Phiêu Lưu Được Tài Trợ"

  activity_adventure:0 "Phiêu Lưu"

# Artisan
  fund_inspiration.0061.desc:0 ""Thank you for funding this endeavor of mine, [ROOT.Char.Custom('FormOfAddressForLiege')]." [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tries to keep [inspiration_owner.GetHerHis] composure, but I can see the excitement in [inspiration_owner.GetHerHis] eyes.\n\n"Boxes, sculptures, #EMP thrones#!... There's so much I can make! Perhaps you have any wishes?""
  fund_inspiration.0061.chest:0 "Một chiếc rương tráng lệ để cất giữ đồ đạc."
  fund_inspiration.0061.box:0 "Một chiếc hộp thanh lịch để cất giữ trang sức hoặc châu báu."
  fund_inspiration.0061.sculpture:0 "Ta muốn một bức tượng lộng lẫy!"
  fund_inspiration.0061.cabinet:0 "Hãy làm một chiếc tủ, đẹp nhưng thực tế."
  fund_inspiration.0061.diwan:0 "Một chiếc đi-văng đẹp và thoải mái."
  fund_inspiration.0061.table:0 "Ta muốn một chiếc bàn vừa sang trọng vừa chắc chắn!"
  fund_inspiration.0061.throne:0 "Tạo ra một ngai vàng uy nghi, xứng đáng với đại sảnh của ta!"
  fund_inspiration.0061.scientific_apparatus:0 "Có lẽ là một dụng cụ của học vấn và tri thức?"
  fund_inspiration.0061.urn:0 "Một chiếc bình trang trí sẽ hoàn thiện đại sảnh của ta."
  fund_inspiration.0061.icon: "Một biểu tượng huy hoàng sẽ tô điểm cho bức tường của ta."

  fund_inspiration.0062.t:0 "Cảm Hứng Nghệ Nhân Được Tài Trợ"

# (Metal)Smith
  fund_inspiration.0071.desc:0 ""Thank you for funding this endeavor of mine, [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tries to keep [inspiration_owner.GetHerHis] composure, but I can see the excitement in [inspiration_owner.GetHerHis] eyes as [inspiration_owner.GetSheHe] continues. "I can work the metal into #EMP wonders#!. Perhaps you have any wishes?""
  fund_inspiration.0071.brooch:0 "Ta muốn một chiếc ghim cài xinh đẹp!"
  fund_inspiration.0071.regalia:0 "Hãy chế tác bộ nghi trượng xứng với địa vị của ta."
  fund_inspiration.0071.crown:0 "Một chiếc vương miện vương giả, xứng đáng đặt lên đầu ta!"
  fund_inspiration.0071.goblet:0 "Một chiếc chén tuyệt mỹ."
  fund_inspiration.0071.aquamanile:0 "Một bình rửa tay trang trí cầu kỳ, dùng cho nghi lễ tẩy rửa."
  fund_inspiration.0071.incense_burner_sculpture:0 "Một lư hương tinh xảo."

  fund_inspiration.0072.t:0 "Cảm Hứng Thợ Kim Loại Được Tài Trợ"

# Alchemist
  fund_inspiration.0081.desc:0 "\"Ngài sẽ không hối hận khi ủng hộ Ta đâu, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cúi chào trước mặt Ta trước khi [inspiration_owner.Custom('quirk_pos_pp')].\n\n\"Giờ thì, Ta có thể xin vài ống nghiệm và lưu huỳnh không? Ta còn rất nhiều thứ cần nghiên cứu. Có lĩnh vực cụ thể nào mà ngài muốn Ta bắt đầu điều tra không?\""
  fund_inspiration.0081.elixirs:0 "Ta đã nghe những lời đồn về kỳ diệu của các linh dược!"
  fund_inspiration.0081.metals:0 "Kim loại luôn khiến ta say mê."
  fund_inspiration.0081.panacea:0 "Một phương thuốc chữa bách bệnh, một panacea!"
  fund_inspiration.0081.immortality:0 "Ta muốn sống mãi mãi."
  fund_inspiration.0081.you_decide_option_tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] sẽ nghiên cứu và tạo ra một [artifact|E] dựa trên chỉ dẫn của Ngài"
  fund_inspiration.0081.they_decide_option_tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] sẽ nghiên cứu và tạo ra một [artifact|E] theo quyết định của riêng [inspiration_owner.GetHerHis]"

  fund_inspiration.0082.t:0 "Cảm Hứng Giả Kim Thuật Được Tài Trợ"


# Bow
  fund_inspiration.0091.desc: "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] before bowing deeply. "Of course I can string you a bow my [ROOT.Char.GetLadyLord]," [inspiration_owner.GetHerHis] enthusiasm shines through [inspiration_owner.GetHerHis] anxious efforts to maintain formality.\n\n"But what's your preferred style to shoot? I wish to carve something that would suit you the best.""
  fund_inspiration.0091.a: "Một cây cung cổ điển tốt, không cần gì hơn."
  fund_inspiration.0091.b: "Hãy chạm khắc cho ta một cây trường cung hùng mạnh."
  fund_inspiration.0091.c: "Keo dán và gân thú cho lực xuyên mạnh nhất."
  fund_inspiration.0091.d: "Ngươi phải mang đến cho ta một cơ cấu tinh xảo."
  fund_inspiration.0091.tooltip_bow: "$fund_inspiration.0011.tooltip_action$ một cây cung"
  fund_inspiration.0091.tooltip_bow.tt: "Ngài nhận được một cây cung khi [inspiration|E] kết thúc"
