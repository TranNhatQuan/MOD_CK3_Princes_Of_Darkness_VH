##########################
#	INSPIRATION COMPLETED
  fund_inspiration.1001.t:0 "Cảm Hứng Thành Hình"
  fund_inspiration.1001.desc:1 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến với nụ cười rạng rỡ. \"Ta đã miệt mài ngày đêm, và cuối cùng tác phẩm của Ta cũng hoàn thành!\"\n\n[inspiration_owner.GetSheHe|U] trao cho Ta một vật được bọc trong vải, và khi Ta mở ra thứ ẩn giấu bên trong, đôi mắt Ta mở to.\n\n"
  fund_inspiration.1001.a:0 "Thật tuyệt vời!"
  fund_inspiration.1001.b: "Hãy bắt đầu công tác chuẩn bị."
  fund_inspiration.1001.b.coronation_ready: "Giờ Ngài có thể tổ chức một [coronation|E]"

  fund_inspiration.1071.coronation: "\n\nVương miện của ta đã hoàn thành, giờ ta có thể tổ chức lễ đăng quang và củng cố quyền lực tối cao của mình."

  fund_inspiration.1011.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến với nụ cười rạng rỡ, mồ hôi chảy dài trên trán [inspiration_owner.GetHerHis], và muội than phủ đầy khuôn mặt [inspiration_owner.GetHerHis]. \"Ta đã miệt mài bên lò rèn ngày đêm, nhưng cuối cùng tác phẩm của Ta cũng hoàn thành!\"\n\n[inspiration_owner.GetSheHe|U] trao cho Ta một vật được bọc trong vải, và khi Ta mở ra thứ ẩn giấu bên trong, đôi mắt Ta mở to.\n\n"

  fund_inspiration.1021.desc_opening_1:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vẫy Ta lại với nụ cười rạng rỡ, ra hiệu về phía một giá đỡ áo giáp được phủ kín. \"Ta đã miệt mài bên lò rèn ngày đêm, nhưng cuối cùng tác phẩm của Ta cũng hoàn thành!\""
  fund_inspiration.1021.desc_opening_2:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] waves me over to a covered armor stand. [inspiration_owner.GetSheHe|U] is trying hard to keep a professional demeanor, but I can see the fire in [inspiration_owner.GetHerHis] eyes as [inspiration_owner.GetSheHe] tells me [inspiration_owner.GetHerHis] work is done."
  fund_inspiration.1021.desc:0 "\n\nVới một động tác đầy kịch tính, [inspiration_owner.GetSheHe] giật phăng lớp vải phủ và đôi mắt Ta mở to.\n\n"
  fund_inspiration.1021.a:0 "Thật tráng lệ!"
 
  fund_inspiration.1031.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mỉm cười và ra hiệu cho Ta lại gần với đôi tay lấm đầy mực."
  fund_inspiration.1031.desc_crime:0 "\"Chủ đề của cuốn sách có phần gây tranh cãi, nhưng nó là một kiệt tác. Nhìn xem!\"\n\n"
  fund_inspiration.1031.desc_soulmate_died:0 "\"Người yêu dấu [soulmate.GetTitledFirstName] của ngài có thể đã qua đời, nhưng cuốn sách này là minh chứng cho tình yêu mà hai người từng chia sẻ.\"\n\n"
  fund_inspiration.1031.desc_nemesis_died:0 "\"[nemesis.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)|U] có thể đã qua đời, nhưng cuốn sách này là minh chứng cho lòng thù hận mà ngài dành cho [nemesis.GetHerHim].\"\n\n"
  fund_inspiration.1031.desc_cat_died:0 "\"Con mèo yêu quý của ngài có thể đã qua đời, nhưng cuốn sách này sẽ đảm bảo rằng không ai từng quên con mèo mang tên [inspiration_owner.Custom('CatStoryName')]!\"\n\n"
  fund_inspiration.1031.desc_dog_died:0 "\"Con chó yêu quý của ngài có thể đã qua đời, nhưng cuốn sách này sẽ đảm bảo rằng không ai từng quên con chó mang tên [inspiration_owner.Custom('DogStoryName')]!\"\n\n"
  fund_inspiration.1031.desc_low_content_quality:0 "\"Cuốn sách đã hoàn thành. Ta hy vọng tác phẩm hoàn chỉnh này sẽ che lấp sự thiếu hiểu biết của Ta về chủ đề. Xin mời, hãy xem qua!\"\n\n"
  fund_inspiration.1031.desc:0 "\"Cuốn sách của Ta – #EMP kiệt tác#! của Ta – đã hoàn thành! Hãy chiêm ngưỡng.\"\n\n"
  fund_inspiration.1031.a:0 "Ta rất ấn tượng!"

  fund_inspiration.1032.t:0 "Cảm Xúc Thành Văn"
  fund_inspiration.1032.desc:0 "\"Người yêu [ROOT.Char.Custom('LoverPetName')] của ta, ta có một bất ngờ cho nàng/chàng!\"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trao cho Ta một cuốn sách tuyệt đẹp, và khi Ta lật từng trang, Ta gần như không tin vào mắt mình. [inspiration_sponsor.GetSheHe|U] đã cho đặt viết một cuốn sách về #EMP chúng ta#!!\n\n\"Những đường đóng gáy lu mờ trước vẻ đẹp của nàng/chàng, và nội dung chẳng thể sánh với sự hiện diện của nàng/chàng, nhưng những trang sách này chứa đựng tinh hoa tình yêu ta dành cho nàng/chàng.\""
  fund_inspiration.1032.a:0 "Ôi, [inspiration_sponsor.Custom('LoverPetName')] của ta!"

  fund_inspiration.1033.desc:0 "\"Ta có một bất ngờ cho ngươi!\"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trao cho Ta một cuốn sách tuyệt đẹp, nhưng khi Ta lật từng trang, Ta gần như không tin vào mắt mình. [inspiration_sponsor.GetSheHe|U] đã cho đặt viết một cuốn sách với mục đích duy nhất là phỉ báng #EMP ta#!!\n\n\"Dù không lời nào trên cõi đời này có thể diễn tả sự khinh miệt ta dành cho ngươi, và không hình ảnh nào có thể khắc họa chính xác tai họa là khuôn mặt ngươi, ta vẫn đã cố gắng. Cả thế giới sẽ đọc nó và biết ngươi đê tiện đến mức nào.\""
  fund_inspiration.1033.a:0 "Đồ [inspiration_sponsor.Custom2('InsultNoun', ROOT.Char)] đó!"
  fund_inspiration.1033.a_proud:0 "Nhưng rồi họ #EMP sẽ#! biết đến ta!"

  fund_inspiration.1041.desc:0 "\"Vào đây nào, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ra hiệu về phía cánh cửa xưởng dệt của [inspiration_owner.GetHerHis], nơi [inspiration_owner.GetSheHe] đã miệt mài nhiều tháng trời cho đơn đặt hàng của ta. Bước qua ngưỡng cửa, ta thở hắt ra khi nhìn thấy tác phẩm treo trước mắt.\n\n"

  fund_inspiration.1051.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly holds up a package securely wrapped in cloth.\n\n"I return from [inspiration_owner.Custom('InspirationAdventureDestination')] with an artifact from my journey!"\n\nI take the bulky bundle into my hands and loosen the cords before peeling layer after layer of fabric. Inside"
  fund_inspiration.1051_throne.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly leads a great procession up to your throne. Behind [inspiration_owner.GetHerHim] a cart is being rolled into your audience hall.\n\n"I return from [inspiration_owner.Custom('InspirationAdventureDestination')] with a great symbol of royal virtue!"\n\nAs the cart comes nearer I realize that it carries a throne."
  fund_inspiration.1051_ark_covenant.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly leads a great procession up to your throne. Behind [inspiration_owner.GetHerHim] a number of helpers are carrying what looks to be an enormous box.\n\n"I return from [inspiration_owner.Custom('InspirationAdventureDestination')] with a prize from my journey!"\n\nI walk up to the giant box, as one of the helpers break away the boards that hide its' treasure. Inside"
  fund_inspiration.1051_cupboard.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] announces [inspiration_owner.GetHerHis] arrival in a surprisingly loud voice. [inspiration_owner.GetSheHe|U] proudly points to a piece of furniture being carried by two helpers.\n\n"I return with an artifact from my journey!"\n\nI walk up to the artifact, inspecting what my [inspiration_owner.GetWomanMan] has brought me from [inspiration_owner.Custom('InspirationAdventureDestination')]."
  fund_inspiration.1051.desc.skull:1 "là hộp sọ của [newly_created_artifact.GetFeatureText( 'animal_skull_type' )]. Ta hỏi [inspiration_owner.GetFirstNameNoTooltip] để biết chi tiết, và [inspiration_owner.GetSheHe] kể lại câu chuyện về việc [inspiration_owner.GetSheHe] đã hạ gục con quái thú khổng lồ ấy như thế nào."
  fund_inspiration.1051.desc.goblet:0 "is a goblet. I ask [inspiration_owner.GetFirstNameNoTooltip] where [inspiration_owner.GetSheHe] got this, and [inspiration_owner.GetSheHe] tells me of a hair-raising dare [inspiration_owner.GetSheHe] had with a stranger that ended with the opponent losing after drinking poison."
  fund_inspiration.1051.desc.box:0 "là một chiếc hộp. Một nghệ nhân địa phương đã trao nó cho [inspiration_owner.GetFirstNameNoTooltip] sau khi [inspiration_owner.GetSheHe] cứu [dummy_gender.GetHerHim] khỏi một bầy thú hoang. [inspiration_owner.GetSheHe|U] kể cho Ta nghe cách [inspiration_owner.GetSheHe] đã dụ dỗ và đánh lừa lũ thú dữ để chúng lao xuống chỗ chết."
  fund_inspiration.1051.desc.hide:1 "là tấm da của [newly_created_artifact.GetFeatureText( 'animal_hide_type' )]. [inspiration_owner.GetFirstNameNoTooltip] kể cho Ta nghe cách [inspiration_owner.GetSheHe] đã hạ gục con thú hung dữ ấy trong khi Ta tiếp tục chiêm ngưỡng tấm da của sinh vật hẳn từng rất uy nghi."
 #fund_inspiration.1051.desc.pillow: "is a soft pedestal pillow. [inspiration_owner.GetFirstNameNoTooltip] tells me of how [inspiration_owner.GetSheHe] helped a master weaver gather all the required materials to make this pillow and all the dangers [inspiration_owner.GetSheHe] faced while doing so."
  fund_inspiration.1051.desc.tapestry:0 "is a tapestry. [inspiration_owner.GetFirstNameNoTooltip] puffs [inspiration_owner.GetHerHis] chest as [inspiration_owner.GetSheHe] weaves me a tale of about [inspiration_owner.GetHerHis] traveling companion who was a master tailor. Their shared adventure inspired the chosen motifs on this tapestry."
 #Epic Artifacts
  fund_inspiration.1051.desc.epic:0 "là một hiện vật không giống bất cứ thứ gì Ta từng thấy trước đây.\n\n[inspiration_owner.GetFirstNameNoTooltip] mỉm cười đầy tự hào: \"[epic.GetDesc]\""
  fund_inspiration.1051.desc.epic.ark:0 "là một chiếc rương đá lớn, bên trong là nhiều phiến đá\n\n[inspiration_owner.GetFirstNameNoTooltip] tự hào khoe khoang: \"Đây là Hòm Giao Ước! Chứa những phiến đá được Moses trao cho người Israel.\"\n\n[inspiration_owner.GetFirstNameNoTooltip] sau đó tiếp tục kể cho triều đình nghe câu chuyện về những cuộc phiêu lưu của [inspiration_owner.GetHerHis] tại [inspiration_owner.Custom('InspirationAdventureDestination')]. Một câu chuyện có sự góp mặt của những kẻ thù bị chi phối bởi các hệ tư tưởng đen tối và những chuyến viếng thăm nhiều địa danh tuyệt đẹp."
  fund_inspiration.1051.desc.epic.throne:0 "\n\n[inspiration_owner.GetFirstNameNoTooltip] tự hào tuyên bố: \"[epic.GetDesc]\""
  fund_inspiration.1051.desc.epic.cupboard:0 "\n\nVới nụ cười thật lớn, [inspiration_owner.GetFirstNameNoTooltip] công bố: \"[epic.GetDesc]\""
  fund_inspiration.1051.desc.regalia:0 "là bộ nghi trượng xứng tầm một triều đình hoàng gia.\n\n[inspiration_owner.GetFirstNameNoTooltip] mỉm cười đầy tự hào và giải thích cách [inspiration_owner.GetSheHe] giành được sự biết ơn của một vị thống trị địa phương tại [inspiration_owner.GetCurrentLocation.GetNameNoTooltip] trong một câu chuyện dài kết thúc bằng việc vị thống trị này dâng tặng [newly_created_artifact.GetName] cho chủ nhân của [inspiration_owner.GetFirstNamePossessiveNoTooltip]."
  fund_inspiration.1051.desc.regalia_2:0 "là bộ nghi trượng xứng tầm một triều đình hoàng gia.\n\n[inspiration_owner.GetFirstNameNoTooltip] mỉm cười đầy tự hào và giải thích rằng đây là món quà từ một vị thống trị xa xôi đã nghe về sự huy hoàng của triều đình Ngài và mong muốn gây ấn tượng với Ngài."
  fund_inspiration.1051.desc.armor:0 "lies a set of armor.\n\n[inspiration_owner.GetFirstNameNoTooltip] regales the court with a tale of how [inspiration_owner.GetSheHe] came to possess this unusual set which [inspiration_owner.GetSheHe] is now offering to you."
  fund_inspiration.1051.desc.weapon:0 "là một [newly_created_artifact.GetName].\n\n[inspiration_owner.GetFirstNameNoTooltip] tiếp tục thuật lại câu chuyện về cách vũ khí này rơi vào tay [inspiration_owner.GetHerHis]. Một câu chuyện với nhiều khúc quanh và bất ngờ, có cái thì kém hợp lý hơn cái khác."
  fund_inspiration.1051.desc.necklace:0 "là một chiếc vòng cổ.\n\n[inspiration_owner.GetFirstNameNoTooltip] tỏ ra khá vui mừng khi có thể trao phần thưởng này cho Ngài nhưng lại không muốn nói rõ nó đã được thu nhận bằng cách nào."
  fund_inspiration.1051.a:0 "Thật tráng lệ!"
  fund_inspiration.1051.b:0 "Nó cần được trông coi bởi 'những người giỏi nhất'"

  fund_inspiration.1061.desc_floor_bound_artifact:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ra hiệu cho Ta lại gần một vật được phủ vải với nụ cười rạng rỡ trên khuôn mặt [inspiration_owner.GetHerHis]. \"Ta đã miệt mài ngày đêm, và cuối cùng tác phẩm của Ta cũng hoàn thành!\"\n\n[inspiration_owner.GetSheHe|U] giật lớp phủ ra và đôi mắt Ta mở to khi thấy thứ ẩn giấu bên dưới.\n\n"
  fund_inspiration.1061.desc:0 "\"Lại đây nào, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vẫy Ta lại với nụ cười rạng rỡ. \"Ta đã miệt mài ngày đêm, và cuối cùng tác phẩm của Ta cũng hoàn thành!\"\n\n[inspiration_owner.GetSheHe|U] trao cho Ta một vật được bọc trong vải, và khi Ta nhấc lớp vải lên, đôi mắt Ta mở to.\n\n"

  fund_inspiration.1081.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ra hiệu cho Ta lại gần chiếc bàn làm việc bừa bộn của [inspiration_owner.GetHerHis] với nụ cười thật lớn trên khuôn mặt [inspiration_owner.GetHerHis]."
  fund_inspiration.1081.immortality_fail_desc_opening:0 "\"Ta biết mình đã nói có thể tìm ra cách kéo dài sự sống vô hạn, nhưng đáng tiếc điều đó đã không thành."
  fund_inspiration.1081.immortality_fail_desc_young:0 "Tuy nhiên, ta đã tạo ra được một linh dược có thể ngăn ngươi lão hóa! Ở một mức độ nào đó. Xin hãy nếm thử, hoặc ít nhất là xem qua thành quả lao động của ta.\"\n\n"
  fund_inspiration.1081.immortality_fail_desc_old:0 "Tuy nhiên, ta đã tạo ra được một linh dược có thể khôi phục phần nào sinh lực đã mất của ngươi! Xin hãy nếm thử, hoặc ít nhất là xem qua thành quả lao động của ta.\"\n\n"
  fund_inspiration.1081.elixir_desc_desc_young:0 "\"Thí nghiệm của ta đã kết trái. Hãy xem đây, một linh dược có thể ngăn lão hóa! Ở một mức độ nào đó. Xin hãy xem qua, và có lẽ là nếm thử.\"\n\n"
  fund_inspiration.1081.elixir_desc_desc_old:0 "\"Thí nghiệm của ta đã kết trái. Hãy xem đây, một linh dược có thể khôi phục phần nào sinh lực đã mất của ngươi! Xin hãy xem qua, và có lẽ là nếm thử.\"\n\n"
  fund_inspiration.1081.panacea_desc:0 "\"Đây là một panacea dựa trên truyền thống đã được xác lập của theriac, chứa mộc dược, nghệ tây, thuốc phiện, thịt rắn lục, cùng nhiều thành phần khác. Nó đã chứng minh hiệu quả trong nhiều thế kỷ, và ta còn hoàn thiện nó hơn nữa! Hãy xem qua.\"\n\n"
  fund_inspiration.1081.metals_philosophers_stone_desc:0 "\"Ta đã làm được! Ta đã tạo ra Hòn đá Triết gia! Đây là Magnum Opus của ta, di sản vàng son của ta. Xin hãy chiêm ngưỡng!\"\n\n"
  fund_inspiration.1081.metals_mercury_desc:0 "\"Ta đã đun nóng hỗn hợp thủy ngân với lưu huỳnh trong một bình, khiến nó bay hơi rồi ngưng tụ lại ở phần trên của bình. Khi ta phá vỡ chiếc bình và nghiền hợp chất thu được, ta đã tạo ra chu sa, đỏ rực và sống động! Đây, ta đã ghi chép lại các phát hiện của mình.\"\n\n"
  fund_inspiration.1081.metals_arsenic_desc:0 "\"Ta đã đun nóng một số quặng asen, tạo ra một loại bột trắng có thể hòa tan trong nước. Ta chắc chắn rằng nó gây chết người khi uống vào, nhưng sẽ không để lại dấu vết về mùi vị hay mùi hương! Đây, ta đã ghi chép lại các phát hiện của mình.\"\n\n"
  fund_inspiration.1081.metals_gold_desc:0 "\"Ta đã tạo ra vàng! Như các bậc trí giả trước ta từng giả thuyết, chì thiếu nhiệt và độ ẩm.\"\n\nKhi Ta yêu cầu được quan sát quá trình, [inspiration_owner.GetSheHe] khăng khăng rằng mẩu vàng nhỏ trên bàn đã tự nói lên tất cả. \"Nhưng dĩ nhiên ta đã ghi chép lại các phát hiện của mình, hãy xem qua.\"\n\n"
  fund_inspiration.1081.metals_silver_desc:0 "\"Ta đã tạo ra bạc! Như các bậc trí giả trước ta từng giả thuyết, bạc được sinh ra từ việc nung nóng đồng và các kim loại cơ bản khác cho đến khi chúng chuyển sang màu trắng.\"\n\nKhi Ta yêu cầu được quan sát quá trình, [inspiration_owner.GetSheHe] khăng khăng rằng mẩu bạc nhỏ trên bàn đã tự nói lên tất cả. \"Nhưng dĩ nhiên ta đã ghi chép lại các phát hiện của mình, hãy xem qua.\"\n\n"
  fund_inspiration.1081.metals_fallback_desc:0 "\"Ta đã tập hợp mọi hiểu biết của mình về kim loại cơ bản và kiến thức về chuyển hóa vào tập sách này. Đây, hãy xem qua.\"\n\n"
  fund_inspiration.1081.a_elixirs:0 "Ta sẽ thử ngay một ngụm!"
  fund_inspiration.1081.a:0 "Thật hấp dẫn!"

  fund_inspiration.1091.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến với nụ cười mãn nguyện trên khuôn mặt [inspiration_owner.GetHerHis]. \"Ta đã miệt mài bên bàn chế tác ngày đêm, nhưng cuối cùng tác phẩm của Ta cũng hoàn thành!\"\n\n[inspiration_owner.GetSheHe|U] trao cho Ta một vật được bọc trong vải, và khi Ta mở ra thứ ẩn giấu bên trong, đôi mắt Ta mở to.\n\n"
  fund_inspiration.1091.a: "Tác phẩm tuyệt vời! Rất tuyệt vời!"
