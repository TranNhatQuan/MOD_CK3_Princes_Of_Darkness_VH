  fund_inspiration.7003.t:0 "$fund_inspiration.title$ Một Người Cần Gây Ấn Tượng"
  fund_inspiration.7003.desc:0 "Dạo gần đây, mọi nỗ lực gây ấn tượng của ta đều thất bại..."
  fund_inspiration.7003.desc_e:0 "Tình  Bạn củata với [dedication_e.GetTitledFirstName] vẫn đang lung lay."
  fund_inspiration.7003.desc_f:0 "[dedication_f.GetTitledFirstName|U] vẫn từ chối ta."
  fund_inspiration.7003.desc_end:0 "Mọi thứ thật rối tung.\n\nTuy nhiên, ta có một ý tưởng xuất sắc. Ta sẽ để [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] thêm một lời đề tặng vào kiệt tác mà [inspiration_owner.GetSheHe] đang thực hiện! Người được đề tặng, được tâng bốc, sẽ vô cùng cảm động trước sự hào phóng của ta và chắc chắn sẽ quý mến ta hơn!"
  fund_inspiration.7003.a:0 "Dành cho [dedication_e.GetFirstNameNoTooltip]!"
  fund_inspiration.7003.b:0 "Dành cho [dedication_f.GetFirstNameNoTooltip]!"
  fund_inspiration.7003.c:0 "Ta sẽ tìm cách khác để gây ấn tượng với bất kỳ ai ta muốn."
  artifact_dedication_inscribed_e:0 "[newly_created_artifact.GetDesc]\n\nMột dòng khắc nhỏ nhưng thanh nhã chạy dọc bên hông, đề tặng \"Gửi Người Ngài Kiên Trung, [dedication_e.GetFirstName]\"."
  artifact_dedication_written_e:0 "[newly_created_artifact.GetDesc]\n\nMột dòng chữ nhỏ nhưng thanh nhã ở trang đầu đề tặng \"Gửi Người Ngài Kiên Trung, [dedication_e.GetFirstName]\"."
