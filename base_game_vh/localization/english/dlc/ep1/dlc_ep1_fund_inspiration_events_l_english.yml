# Weapon 
  fund_inspiration.0011.desc:0 "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] trước khi cúi đầu thật sâu. \"Vừa là vinh dự, vừa là đặc ân khi được rèn vũ khí cho ngài,\" [inspiration_owner.GetSheHe] nói với giọng đầy trang nghiêm, nhưng ánh lên trong đôi mắt [inspiration_owner.GetHerHis] là sự phấn khích phản bội vẻ nghiêm túc bên ngoài của [inspiration_owner.GetHerHis].\n\n\"Hãy cho Ta biết, phong cách chiến đấu với vũ khí mà ngài ưa thích là gì? Ta muốn rèn nên thứ phù hợp nhất với ngài.\""
  fund_inspiration.0011.a:1 "Thứ gì đó có thể vừa chém vừa đâm xuyên da thịt."
  fund_inspiration.0011.b:0 "Ta muốn một vũ khí tận dụng tối đa sức mạnh của mình!"
  fund_inspiration.0011.c:0 "Ta thích giữ kẻ thù ở khoảng cách xa."
  fund_inspiration.0011.d: "Quên lò rèn đi, ta muốn bắn."
  fund_inspiration.0011.d.tt: "[inspiration_owner.GetTitledFirstName] sẽ chế tạo một cây cung thay thế"

