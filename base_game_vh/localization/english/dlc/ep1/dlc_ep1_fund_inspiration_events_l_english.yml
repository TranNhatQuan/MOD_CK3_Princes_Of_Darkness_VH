  fund_inspiration.7120.a:0 "Củng cố tính chính danh cho triều đại của ta."

  fund_inspiration.7120.a.tt:0 "Bảo vật của Ngài có thể nhận được một chỉ số về triều đại mới ngắn hạn"

 # Alchemy
  fund_inspiration.8001.t:0 "$fund_inspiration.title$ Sự Say Mê Kim Loại"
  fund_inspiration.8001.desc:0 "Ta thấy [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] cúi mình trên một cốc chứa bột màu vàng kỳ lạ, xung quanh là giấy viết và các mẫu quặng.\n\n[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Xin ngài xem, thấy không, lưu huỳnh này đổi màu sao? Đó là dấu hiệu của sự biến hóa. Nó có thể tạo ra bạc, hoặc thậm chí vàng! Hay đây, xem nó phản ứng với thủy ngân thế nào? Thật kỳ diệu… Còn quặng này, về bản chất là asen, ehum, ta xin lỗi, thưa ngài. Có quá nhiều điều phải nghiên cứu! Có lẽ quá nhiều."
  fund_inspiration.8001.a:0 "Ngươi nói gì về vàng?"
  fund_inspiration.8001.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] studies on creating gold"
  fund_inspiration.8001.b:0 "Ngươi nói bạc sao?"
  fund_inspiration.8001.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] studies on creating silver"
  fund_inspiration.8001.c:0 "Thủy ngân thật đáng kinh ngạc."
  fund_inspiration.8001.c.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] studies on quicksilver"
  fund_inspiration.8001.d:0 "Ngươi nói Asen sao?"
  fund_inspiration.8001.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] studies on arsenic"
 
  fund_inspiration.8011.t:0 "$fund_inspiration.title$ Giấc Mơ Vàng"
  fund_inspiration.8011.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has called me to [inspiration_owner.GetHerHis] lab, raving about a breakthrough in [inspiration_owner.GetHerHis] research.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], you're here! Excellent. Please, drink this." [inspiration_owner.GetFirstNameNoTooltip] ushers me into the room and towards a table cluttered with parchment and beakers. It is one of these beakers, containing some golden concoction, that [inspiration_owner.GetSheHe] has me downing. "Now, this is still a work in progress, of course, but it #EMP should#! have a truly remarkable effect!"\n\nAfter hours of waiting all I feel is a pounding headache, nausea, and dizziness."
  fund_inspiration.8011.a:0 "Trò hề này tốt hơn hết nên dạy cho ngươi điều gì đó hữu ích."
  fund_inspiration.8011.b:0 "Tống tên lang băm này vào ngục!"
  fund_inspiration.8011.c:0 "Ngươi dám đầu độc ta sao?! Ngươi sẽ phải treo cổ vì chuyện này!"

  fund_inspiration.8012.t:0 "$fund_inspiration.title$ Giáo Hội Và Những Kẻ Lang Băm"
  fund_inspiration.8012.desc:0 "I am leaning over a table, listening to my alchemist [inspiration_owner.GetTitledFirstName] explain [inspiration_owner.GetHerHis] latest experiment, when [court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] burst into the room.\n\n"So it's true, you #EMP do#! spend your time with this... this #EMP heathen#!!" [court_chaplain.GetFirstNameNoTooltip] eyes the bowls and illustrations spread out before us and [court_chaplain.GetHerHis] eyes grow even colder.\n\n"This has to stop, [ROOT.Char.Custom('FormOfAddressForLiege')]. This charlatan is leading you astray!""
  fund_inspiration.8012.a:0 "Ngươi nói gì cơ? Sao ngươi dám?! Cút khỏi lãnh địa của ta."
  fund_inspiration.8012.b:0 "[inspiration_owner.GetSheHe|U] đang dẫn ta tới sự khai sáng!"
  fund_inspiration.8012.b.success:0 "Ngài thuyết phục được [court_chaplain.GetFirstNameNoTooltip]"
  fund_inspiration.8012.b.failure:0 "[court_chaplain.GetFirstNameNoTooltip] không bị thuyết phục"
  fund_inspiration.8012.c:0 "[inspiration_owner.GetSheHe|U] chắc chắn là không."

  fund_inspiration.8013.t:0 "$fund_inspiration.title$ Một Bảo Vật Giả Kim"
  fund_inspiration.8013.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" nhà giả kim [inspiration_owner.GetTitledFirstName] của ta gần như chạy tới, phấn khích như một đứa trẻ.\n\n\"Ta tìm thấy cuốn sách này khi ghé qua khu chợ ở [barony_market.GetName]. Nó được cho là của nhà giả kim huyền thoại Jabir ibn Hayyan – chính bậc thầy! Ít nhất là theo lời người bán… Dẫu vậy, hãy tưởng tượng lượng tri thức khổng lồ chứa bên trong nó!\""
  fund_inspiration.8013.a:0 "Cảm ơn, ta sẽ tự nghiên cứu nó."
  fund_inspiration.8013.a_tt:0 "Ngài giữ lại cuốn sách"
  fund_inspiration.8013.b:0 "Ta tin ngươi sẽ biết cách sử dụng cuốn sách này."
  fund_inspiration.8013.b_tt:0 "Ngài đưa cuốn sách cho [inspiration_owner.GetShortUINameNoTooltip]"
  fund_inspiration.8013.c:0 "Quả là một món hời! Chắc chắn sẽ bán được giá cao."

  fund_inspiration.8014.t:0 "$fund_inspiration.title$ Kẻ Trầm Tư [inspiration_owner.GetWomanMan|U]"
  fund_inspiration.8014.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] dường như chẳng bao giờ tiến hành thí nghiệm hay tạo ra điều gì đáng chú ý. [inspiration_owner.GetSheHe|U] chỉ ngồi bên cửa sổ, nhìn ra xa, ngày này qua ngày khác.\n\nKhi ta đòi biết rốt cuộc mình đang tài trợ cho cái gì, [inspiration_owner.GetSheHe] chỉ nhún vai và chỉ tay ra ngoài cửa sổ. \"Ta đang suy ngẫm về bản chất của thế giới, [ROOT.Char.Custom('FormOfAddressForLiege')]. Thế giới rộng lớn, nên có rất nhiều điều để suy xét!\""
  fund_inspiration.8014.a:0 "Ta không trả tiền cho ngươi chỉ để ngồi không!"
  fund_inspiration.8014.b:0 "Cứ từ từ."
  fund_inspiration.8014.c:0 "Ta sẽ không lãng phí vàng bạc cho chuyện nhảm nhí này!"
  fund_inspiration.8014.c.tt:0 "Ngài bán toàn bộ dụng cụ giả kim đã mua"

  fund_inspiration.8015.t:0 "$fund_inspiration.title$ Tang Tóc"
  fund_inspiration.8015.desc:0 ""Alchemist have power over all matter, they can create wonders, so how is life any different? How is [loved_one.GetFirstName] any different?!"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] just shakes [inspiration_owner.GetHerHis] head, headless of my sorrow. What good is science if it cannot grant me this one wish?\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], I cannot work that kind of a miracle. However, I have found that an open ear can be its own kind of magic when sadness looms. Please, sit down.""
  fund_inspiration.8015.a:0 "Nhưng– ta– Ngươi nói đúng… cảm ơn."
  fund_inspiration.8015.b:0 "Không. Ngươi sẽ mang [loved_one.GetHerHim] trở lại với ta!"
  fund_inspiration.8015.b.tt:0 "[inspiration_owner.GetShortUINameNoTooltip] sẽ thử điều không thể"

  fund_inspiration.8016.desc:0 "Bước chân ta nhẹ bẫng khi tiến về phòng thí nghiệm của nhà giả kim [inspiration_owner.GetTitledFirstNamePossessive]. Ôi [loved_one.GetFirstName], cuối cùng ta cũng sẽ gặp lại ngươi! Thế nhưng, khi [inspiration_owner.GetTitledFirstNameNoTooltip] mở cửa, tim ta chùng xuống trước vẻ mặt của [inspiration_owner.GetHerHis]. Và tại sao [inspiration_owner.GetSheHe] lại không cho ta nhìn vào bên trong?\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta đã làm ngài thất vọng. Xin đừng–\"\n\nTa đẩy [inspiration_owner.GetHerHim] sang một bên, lao vào phòng thí nghiệm, và thứ ta nhìn thấy… ta không thể nào hiểu nổi. Những mảnh thịt, bột, thảo dược vương vãi thành một vòng tròn trên sàn. Trên cùng là một lọn tóc duy nhất, có màu sắc giống hệt mái tóc từng thuộc về [loved_one.GetFirstNamePossessiveNoTooltip]."
  fund_inspiration.8016.a:0 "Ta… ta nghĩ mình sắp nôn mất."
  fund_inspiration.8016.b:0 "Ngươi dám chế giễu nỗi đau của ta sao? Lính đâu! Bắt lấy [inspiration_owner.GetHerHim]!"

  fund_inspiration.8017.t:0 "$fund_inspiration.title$ Nhóm Nghiên Cứu"
  fund_inspiration.8017.desc:0 "Ta bắt gặp [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] và [court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] đang cúi sát bên bàn, so sánh thứ trông như đá được nghiền nhỏ.\n\n\"Ngài thấy đó,\" [inspiration_owner.GetFirstNameNoTooltip] nói. \"Khi nung nóng loại bột này, nó sẽ chuyển sang màu đen trước, nhưng #EMP rồi thì#!– À, chào ngài, thưa [ROOT.Char.GetLadyLord].\"\n\n[court_tutor.GetFirstNameNoTooltip] ngẩng lên khi được chào hỏi và tỏ ra hơi xấu hổ; [court_tutor.GetSheHe] lẽ ra nên chuẩn bị bài giảng cho ngày mai."
  fund_inspiration.8017.a:0 "Chia sẻ tri thức là điều tốt."
  fund_inspiration.8017.b:0 "Thật đáng xấu hổ cho cả hai người, quay lại làm việc!"

  fund_inspiration.9000.t:0 "$fund_inspiration.title$ Bọn Cướp Trên Đường"
  fund_inspiration.9000.desc:0 "\"Thưa bệ hạ, nhà thám hiểm [adventurer.GetFirstName] gửi tin!\" người hầu kêu lên, đưa cho ta một bức thư.\n\n\"Trong mười ngày mười đêm qua, ta và đồng đội phải ẩn náu. Tên cướp [bandit.GetLadyLord] [bandit.GetFirstName] đã phong tỏa con đường chúng ta buộc phải đi — ngài khuyên chúng ta nên làm gì? Thận trọng chờ đợi? Hay chiến đấu, tin tưởng [adventurer.GetFaith.HighGodName] sẽ bảo hộ chúng ta? Ký tên, [adventurer.GetFirstName].\" nội dung bức thư viết.\n\nXem ra [adventurer.GetSheHe] đang lâm vào thế khó."
  fund_inspiration.9000.a:0 "Cứ tiếp tục ẩn náu, rồi chúng sẽ sớm rút đi."
  fund_inspiration.9000.b:0 "Không liều thì không có vinh quang! Bắt chúng phải trả giá vì đã lãng phí thời gian của ta."
  fund_inspiration.9000.c:0 "Chỗ vàng này hẳn đủ để hối lộ cho ngươi đi qua."
  artifact_bandit_skull:0 "Hộp sọ của tên cướp [killed.GetLadyLord|U] [killed.GetTitledFirstName], kẻ bị nhà thám hiểm [creator.GetTitledFirstName] giết tại [background_wilderness_scope.GetName] và sau đó được tặng cho [owner.GetTitledFirstName]. Nó mang nụ cười đáng sợ với hốc mắt trống rỗng."
  fund_inspiration.9000.b.critical_success:0 "[adventurer.GetFirstNameNoTooltip] dũng cảm giết chết [bandit.GetFirstNameNoTooltip]"
  fund_inspiration.9000.b.boil_skull:0 "[adventurer.GetFirstNameNoTooltip] luộc và làm sạch hộp sọ của [bandit.GetFirstNamePossessiveNoTooltip], rồi gửi cho Ngài dùng làm [court_artifact|E]"
  fund_inspiration.9000.b.success:0 "[adventurer.GetFirstNameNoTooltip] thành công đánh đuổi bọn cướp"
  fund_inspiration.9000.b.failure:0 "[adventurer.GetFirstNameNoTooltip] bị [bandit.GetFirstNameNoTooltip] làm bị thương"
  fund_inspiration.9000.b.critical_failure:0 "[adventurer.GetFirstNameNoTooltip] bị [bandit.GetFirstNameNoTooltip] giết chết"
  fund_inspiration.9000.a.critical_success:0 "[adventurer.GetFirstNameNoTooltip] lén rút đi trong đêm… và lấy trộm vàng của [bandit.GetFirstNamePossessiveNoTooltip]"
  fund_inspiration.9000.a.success:0 "[adventurer.GetFirstNameNoTooltip] lén rút đi trong đêm"
  fund_inspiration.9000.a.failure:0 "[adventurer.GetFirstNameNoTooltip] bị phát hiện khi cố lẻn qua trại"
 
  fund_inspiration.9100.t:0 "$fund_inspiration.title$ [adventurer.Custom('GetAnimalAdjective')|U] [adventurer.Custom('GetAnimalPlural')|U] ở [background_wilderness_scope.Custom('TerrainTypeProvince')|U]"
  fund_inspiration.9100.desc:0 "\"Thưa [ROOT.Char.GetLadyLord|U], có tin nhắn từ nhà thám hiểm của ngài, [adventurer.GetFirstName].\" người hầu nói, đưa cho ta một cuộn giấy.\n\n\"Cuộc tìm kiếm đã đưa ta tới vùng [background_wilderness_scope.Custom('TerrainTypeProvince')] của [background_wilderness_scope.GetName]. Nơi này nổi tiếng là đầy rẫy [adventurer.Custom('GetAnimalType')], nhưng ta có lý do chính đáng để tin rằng mục tiêu của ta đã ở rất gần! Mong sớm ngày trở về. Ký tên, [adventurer.GetFirstNameNoTooltip].\" nội dung cuộn giấy viết.\n\nQuả là [adventurer.GetSheHe|U] quá tham vọng khi chọn con đường nguy hiểm như vậy…"
  fund_inspiration.9100.a:0 "Kiến thức của [adventurer.GetFirstNamePossessiveNoTooltip] hẳn đủ để giữ an toàn cho [adventurer.GetHerHim]…"
  fund_inspiration.9100.b:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName], mong là [adventurer.GetSheHe] không phải đối đầu với thứ đó!"
  fund_inspiration.9100.c:0 "[adventurer.GetFirstNameNoTooltip] rất thận trọng, họ sẽ đi đường vòng an toàn hơn."
  fund_inspiration.9100.a.success:0 "[adventurer.GetFirstNameNoTooltip] thành công tránh được mọi [adventurer.Custom('GetAnimalPlural')]"
  fund_inspiration.9100.a.failure:0 "[adventurer.GetFirstNameNoTooltip] bị một [adventurer.Custom('GetAnimalType')] tấn công!"
  fund_inspiration.9100.b.success:0 "[adventurer.GetFirstNameNoTooltip] giết chết một con [adventurer.Custom('GetAnimalType')] hoang dã đang lao tới"
  fund_inspiration.9100.b.failure:0 "[adventurer.GetFirstNameNoTooltip] bị con [adventurer.Custom('GetAnimalType')] hoang dã đang lao tới đánh bại"
  fund_inspiration.9100.b.maimed:0 "[adventurer.GetFirstName] bị tàn phế bởi con [adventurer.Custom('GetAnimalType')]"
