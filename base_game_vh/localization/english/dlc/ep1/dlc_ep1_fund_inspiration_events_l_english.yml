 # INSPIRATION INVALIDATED
 fund_inspiration.9001.t:0 "Cảm Hứng Kết Thúc"
 fund_inspiration.9001.desc:1 "Thảm họa! [inspiration_owner.GetTitledFirstName], người được ta bảo trợ, đã qua đời. [inspiration_owner.GetSheHe|U] [inspiration_owner.GetDeathReason] trước khi [inspiration_owner.GetSheHe] có thể hoàn thành [inspiration_owner.GetHerHis]– hoàn thành #EMP giấc mơ của ta#!\n\n"
 fund_inspiration.9001.desc_weapon:0 "Giờ thì ta sẽ không bao giờ biết được kiệt tác mà [inspiration_owner.GetSheHe] có thể đã rèn ra là gì..."
 fund_inspiration.9001.desc_armor:0 "Giờ thì ta sẽ không bao giờ biết được kiệt tác mà [inspiration_owner.GetSheHe] có thể đã tạo ra là gì..."
 fund_inspiration.9001.desc_book:0 "Giờ thì ta sẽ không bao giờ biết được kiệt tác mà [inspiration_owner.GetSheHe] có thể đã viết là gì..."
 fund_inspiration.9001.desc_weaver:0 "Giờ thì ta sẽ không bao giờ biết được kiệt tác mà [inspiration_owner.GetSheHe] có thể đã dệt nên là gì..."
 fund_inspiration.9001.desc_adventurer:0 "Giờ thì ta sẽ không bao giờ biết được những cuộc phiêu lưu của [inspiration_owner.GetHerHis] có thể đã mang lại cho ta điều gì..."
 fund_inspiration.9001.desc_artisan:0 "Giờ thì ta sẽ không bao giờ biết được kiệt tác mà [inspiration_owner.GetSheHe] có thể đã tạo ra là gì..."
 fund_inspiration.9001.desc_smith:0 "Giờ thì ta sẽ không bao giờ biết được kiệt tác mà [inspiration_owner.GetSheHe] có thể đã rèn nên là gì..."
 fund_inspiration.9001.desc_alchemy:0 "Giờ thì ta sẽ không bao giờ biết được kỳ quan nào mà [inspiration_owner.GetSheHe] có thể đã tạo ra hoặc khám phá..."
 fund_inspiration.9001.desc_research: "Giờ thì ta sẽ không bao giờ biết được những khám phá mà [inspiration_owner.GetSheHe] có thể đã đạt tới..."
 fund_inspiration.9001.a:0 "Thật là một bi kịch!"
 fund_inspiration.9001.a_tt:0 "Ngài ngừng tài trợ cho cảm hứng của [inspiration_owner.GetTitledFirstNamePossessive]"

 fund_inspiration.9002.desc:1 "Thảm họa! [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị bắt làm tù binh và không còn có thể tiếp tục theo đuổi việc hoàn thành giấc mơ của [inspiration_owner.GetHerHis] là"
 fund_inspiration.9002.desc_weapon:0 "rèn một vũ khí."
 fund_inspiration.9002.desc_armor:0 "chế tạo áo giáp."
 fund_inspiration.9002.desc_book:0 "viết một cuốn sách."
 fund_inspiration.9002.desc_weaver:0 "dệt nên một kiệt tác."
 fund_inspiration.9002.desc_adventurer:0 "bước vào một cuộc phiêu lưu."
 fund_inspiration.9002.desc_artisan:0 "tạo ra thứ gì đó tráng lệ."
 fund_inspiration.9002.desc_smith:0 "rèn nên một kiệt tác."
 fund_inspiration.9002.desc_alchemy:0 "vén màn những bí ẩn của thế giới này"
 fund_inspiration.9002.desc_research: "tiếp tục đổi mới khoa học."

 fund_inspiration.9003.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] không còn là cận thần của ta nữa, vì vậy ta không thể tiếp tục ủng hộ giấc mơ của [inspiration_owner.GetHerHis] là"
 
 fund_inspiration.9004.desc:0 "[inspiration_owner.GetTitledFirstName] trở về triều đình của ta, không quá lâu kể từ khi [inspiration_owner.GetTitledFirstName|U] rời đi."
 fund_inspiration.9004.desc_adventurer_tired_of_europe:0 "\n\nKhi [inspiration_owner.GetSheHe] bước vào triều đình của ta, [inspiration_owner.GetSheHe] cúi xuống hôn mặt đất, rồi đến giày của ta. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta sẽ mãi mãi mang ơn ngài vì đã cho phép Ta trở về với nền văn minh... tránh xa vùng đất ẩm thấp và đầy thịt kia gọi là châu Âu.\""
 fund_inspiration.9004.desc_adventurer_stuck_in_swamp:0 "Một đống lổn nhổn của đất, lá và bùn lết vào phòng triều của ta. Ta cảm thấy thời khắc của mình đã đến. Có lẽ ta đã không cầu nguyện đủ. Nhưng khi người hầu của ta dội một xô nước lên nó, lớp bẩn bị rửa trôi để lộ ra [inspiration_owner.GetTitledFirstName], trở về từ đầm lầy. [inspiration_owner.GetSheHe|U] lập tức lao tới hôn chân ta. \"Ta không thể chịu đựng thêm được nữa, và thật mừng làm sao khi được trở lại thế giới văn minh.\"\n\nDo đó"
 fund_inspiration.9004.a:0 "Chấn chỉnh lại bản thân đi."

 change_artifact_quality_effect_gain:1 "[artifact|E] được tạo ra thông qua [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] sẽ có #P chất lượng cao hơn#!"
 change_artifact_quality_effect_slight_gain:0 "[artifact|E] được tạo ra thông qua [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] có thể có #P chất lượng cao hơn một chút#!"
 change_artifact_quality_effect_loss:2 "[artifact|E] được tạo ra thông qua [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] sẽ có #N chất lượng thấp hơn#!"
 change_artifact_quality_effect_slight_loss:0 "[artifact|E] được tạo ra thông qua [artifact_quality_scope.GetShortUINamePossessive|U] [inspiration.GetName] có thể có #N chất lượng thấp hơn một chút#!"
 change_artifact_book_content_quality_effect_gain:1 "Nội dung của Sách [artifact|E] có khả năng sẽ có #P chất lượng cao hơn#!"
 change_artifact_book_content_quality_effect_loss:1 "Nội dung của Sách [artifact|E] có khả năng sẽ có #N chất lượng thấp hơn#!"

 fund_inspiration.9005.t:0 "Việc Còn Dang Dở"
 fund_inspiration.9005.desc_intro:0 "[inherited_insp_owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inherited_insp_owner'))] của ta, xin nói vài lời giữa cơn hỗn loạn của việc kế vị. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], trước khi [old_ruler.GetHerHis] qua đời, [old_ruler.GetTitledFirstNameRegnal] đã đặt hàng công việc của Ta; Ta đang giữa chừng [inherited_insp_owner.Custom('InspirationTypeDescription')] cho [old_ruler.GetHerHim].\" \n\n"
 fund_inspiration.9005.desc_multiple:0 "\"Những nghệ nhân khác cũng đang làm việc, và chúng Ta muốn biết liệu ngài có tiếp tục tài trợ cho nỗ lực của chúng Ta hay không.\""
 fund_inspiration.9005.desc_single:0 "\"Công việc đã bắt đầu rồi, và sẽ thật đáng tiếc nếu không hoàn thành nó...\""
 fund_inspiration.9005.a:0 "Công việc sẽ tiếp tục!"
 fund_inspiration.9005.b:0 "Những sự xao nhãng phù phiếm này sẽ chấm dứt."
 inherited_inspiration_continue_tt:0 "Ngài sẽ tài trợ cho các đơn đặt hàng của [old_ruler.GetTitledFirstNamePossessiveRegnal]"
 inherited_inspiration_end_tt:0 "#X Mọi số vàng đã đầu tư sẽ bị mất#!"

 ###########################
 # INSPIRATION ONGOING 
 fund_inspiration.title:1 "Cảm Hứng:"
 fund_inspiration.2001.t:1 "$fund_inspiration.title$ Yêu Cầu Kinh Phí"
 fund_inspiration.2001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] khăng khăng cho rằng số tiền ta đã cấp cho [inspiration_owner.GetHerHim] là chưa đủ để tạo ra một hiện vật xứng tầm địa vị của ta.\n\n\"Chỉ cần thêm một ít vàng nữa thôi, Ta có thể tạo ra thứ gì đó #EMP thực sự#! tráng lệ!\""
 fund_inspiration.2001.a:0 "Ngươi cần gì cũng được!"
 fund_inspiration.2001.b:0 "Hãy xoay xở với những gì ngươi có."

 fund_inspiration.2002.t:0 "$fund_inspiration.title$ Yêu Cầu… Vật Liệu"
 fund_inspiration.2002.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has the nerve of summon me to [inspiration_owner.GetHerHis] wretched, and foul-smelling room.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], progress is coming along, but if I had some more parts... some #EMP human#! materials, I could create something #EMP truly mind-blowing#!. I need the person alive, at least at first."\n\nAs [inspiration_owner.GetFirstName] finishes [inspiration_owner.GetHerHis] request, "
 fund_inspiration.2002.desc.fingernails:0 "ánh mắt ta dừng lại ở những dụng cụ vấy máu và những móng tay bị giật rời vương vãi trên bàn của [inspiration_owner.GetHerHis]."
 fund_inspiration.2002.desc.potions:1 "ánh mắt ta vô thức lướt qua bàn và các kệ đầy những bộ phận động vật bí ẩn, chất lỏng sặc sỡ và các loài cây trông đầy nguy hiểm."
 fund_inspiration.2002.desc.blind:0 "ta nghe thấy những tiếng rên rỉ yếu ớt và tiếng nức nở từ một người khác trong phòng. Sau vài cơn nấc là một tiếng ọe đau đớn, kèm theo mùi axit nồng nặc của chất nôn."
 fund_inspiration.2002.a:0 "\"Cứ dùng những kẻ trong ngục của ta theo cách ngươi thấy phù hợp.\""
 fund_inspiration.2002.b:1 "\"Đây, ít tiền để bắt cóc vài nông dân.\""
 fund_inspiration.2002.c:0 "\"Biên giới không xa. Đi bắt cóc vài nông dân ngoại bang.\""
 fund_inspiration.2002.toast_outcome.negative:0 "Bằng chứng dẫn đến việc Ngài là nguyên nhân của những nông dân mất tích"
 fund_inspiration.2002.toast_outcome.positive:0 "Ngài thoát tội trong vụ bắt cóc nông dân"
 fund_inspiration.2002.d:0 "Từ chối yêu cầu của [inspiration_owner.GetTitledFirstNamePossessiveNoTooltip]."

 fund_inspiration.2003.t:0 "$fund_inspiration.title$ Gián Đoạn"
 fund_inspiration.2003.desc:0 ""By #EMP [inspiration_owner.GetFaith.HighGodName]#!, [previous_inspired.GetWomanMan]! Leave me alone!"\n\nThe peaceful atmosphere is shattered by [inspiration_owner.GetFirstName] yelling as [inspiration_owner.GetSheHe] storms into the courtyard. [previous_inspired.GetFirstName] quickly follows, but stops when [previous_inspired.GetSheHe] sees me.\n\n"[ROOT.Char.Custom2('RelationToMeAddress', previous_inspired)|U], please talk some sense into [inspiration_owner.GetFirstNameNoTooltip]! I'm trying to help [inspiration_owner.GetHerHim] since I have some experience that may improve [inspiration_owner.GetHerHis] work!""
 fund_inspiration.2003.a:0 "Thuyết phục [inspiration_owner.GetFirstNameNoTooltip] lắng nghe [previous_inspired.GetFirstNameNoTooltip]."
 fund_inspiration.2003.b:1 "\"Thôi nào, ít nhất hãy nghe [previous_inspired.GetHerHim] nói.\""
 fund_inspiration.2003.c:0 "Ra lệnh cho [previous_inspired.GetFirstNameNoTooltip] để yên [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2003.toast_outcome.positive:0 "[inspiration_owner.GetFirstNameNoTooltip] lắng nghe [previous_inspired.GetFirstNameNoTooltip]"
 fund_inspiration.2003.toast_outcome.refusal:0 "[inspiration_owner.GetFirstNameNoTooltip] từ chối lắng nghe"
 fund_inspiration.2003.toast_outcome.negative:0 "[previous_inspired.GetFirstNameNoTooltip] đưa ra lời khuyên tệ hại"

 fund_inspiration.2004.t:0 "$fund_inspiration.title$ Chất Lượng Đỉnh Cao"
 fund_inspiration.2004.desc_metal:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn thứ kim loại kia! Ta chưa từng thấy chất lượng nào tinh hảo đến thế.\""
 fund_inspiration.2004.desc_fabric:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn tấm vải kia! Sợi dệt, độ sâu màu sắc… Ta chưa từng thấy chất lượng nào tinh hảo đến thế.\""
 fund_inspiration.2004.desc_thread:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn sợi chỉ kia! Ta chưa từng thấy chất lượng nào tinh hảo đến thế.\""
 fund_inspriation.2004.desc_paint: " \"Thưa [ROOT.Char.GetLadyLord], hãy nhìn sắc tố kia! Ta chưa từng thấy chất lượng nào tinh hảo đến thế.\""
 fund_inspiration.2004.desc_wood:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn khúc gỗ kia! Thớ gỗ, mật độ… Ta chưa từng thấy chất lượng nào tinh hảo đến thế!\""
 fund_inspiration.2004.desc_paper:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn giấy kia! Ta chưa từng thấy chất lượng nào tinh hảo đến thế.\""
 fund_inspiration.2004.desc_ink:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn mực kia! Màu sắc, độ bão hòa… Ta chưa từng thấy chất lượng nào tinh hảo đến thế!\""
 fund_inspiration.2004.desc_alchemy_metal:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn cái này! Ta chưa từng thấy quặng tinh khiết đến thế.\""
 fund_inspiration.2004.desc_elixirs:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn những ống nghiệm kia! Ta chưa từng thấy thủy tinh trong vắt đến thế.\""
 fund_inspiration.2004.desc_fallback:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy nhìn cái này! Ta chưa từng thấy vật liệu nào tinh hảo đến thế.\""
 fund_inspiration.2004.desc:0 "\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tách khỏi đoàn rước ngoài chợ để chặn lại người thương nhân bán món hàng được thèm muốn; phấn khích tột độ trước phát hiện của [inspiration_owner.GetHerHis].\n\n\"Với thứ này, dự án của Ta sẽ đạt tầm cao mới. Ta có thể tạo ra thứ gì đó #EMP thực sự kỳ diệu#!! Xin hãy, thưa [ROOT.Char.GetTitleAsNameNoTooltip], ban tặng món quà này cho Ta.\""
 fund_inspiration.2004.a:0 "Dự án của ngươi xứng đáng được đầu tư!"
 fund_inspiration.2004.b:0 "Tất nhiên, nhưng hẳn ta có thể mua với giá hợp lý hơn chứ?"
 fund_inspiration.2004.b.success:0 "Thương nhân bị thuyết phục hạ giá"
 fund_inspiration.2004.b.failure:0 "Thương nhân không bị thuyết phục"
 fund_inspiration.2004.c:0 "Dĩ nhiên. Lính canh, tịch thu thứ mà [inspiration_owner.GetFirstNameNoTooltip] cần."
 fund_inspiration.2004.d:0 "Ngươi nghĩ ta làm bằng tiền sao?"
 
 fund_inspiration.2005.t:1 "$fund_inspiration.title$ Lò Rèn Mới"
 fund_inspiration.2005.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến với vẻ cau có, lông mày cháy xém và vài mảnh kim loại cong queo.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta không có ý vô lễ, nhưng cái lò rèn này của ngài…\""
 fund_inspiration.2005.desc_weapon:0 "Nói thẳng ra là nếu ngài muốn [inspiration_owner.Custom('ArtifactWeaponType')] có thể dùng được"
 fund_inspiration.2005.desc_armor:1 "Nói thẳng ra là nếu ngài muốn [inspiration_owner.Custom('ArtifactArmorTypeLowercase')] có thể dùng được"
 fund_inspiration.2005.desc_smith:0 "Nói thẳng ra là nếu ngài muốn [inspiration_owner.Custom('InspirationSmithType')] trông thanh nhã"
 fund_inspiration.2005.desc_ending:0 "thì ngài sẽ phải đầu tư một cái mới.\""
 fund_inspiration.2005.a:0 "Dĩ nhiên, cần gì cứ nói."
 fund_inspiration.2005.b:0 "Đó là một lò rèn hoàn toàn ổn!"

 fund_inspiration.2006.t:0 "$fund_inspiration.title$ Học Giả Lang Thang"
 fund_inspiration.2006.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')] của ta, [inspiration_owner.GetTitledFirstName], dẫn một [scholar_character.GetWomanMan] đến trước mặt ta, nở nụ cười rạng rỡ và không ngớt lời ca ngợi.\n\n\"Đây là [scholar_character.GetTitledFirstName], một học giả đáng kính trong giới của Ta.\"\n\n[scholar_character.GetWomanMan] cúi chào, vừa tỏ ra hài lòng vừa bẽn lẽn. \"Xin đừng khách sáo. Ta đến đây để phục vụ ngài, [ROOT.Char.Custom('FormOfAddressForLiege')], nếu ngài cho phép.\""
 fund_inspiration.2006.a:0 "Được. Hãy hỗ trợ [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2006.b:0 "Tất nhiên. Ngươi sẽ là gia sư riêng của ta."
 fund_inspiration.2006.c:0 "Ngươi sẽ không tìm thấy chốn dung thân ở đây."

 fund_inspiration.2021.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] khẳng định rằng để chế tạo áo giáp phù hợp với một [ROOT.Char.GetTitleAsNameNoTooltip] vinh quang như ta, [inspiration_owner.GetSheHe] sẽ cần thêm kinh phí.\n\n\"[inspiration_owner.Custom('ArtifactArmorTypeLowercase')|U] không hề rẻ để làm, riêng vật liệu thôi đã… Đây không phải lúc keo kiệt đâu, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
 fund_inspiration.2021.a:0 "Ngươi sẽ có tiền."
 fund_inspiration.2021.b:0 "Ta sẽ không đưa thêm vàng nữa."

 fund_inspiration.2030.t:0 "$fund_inspiration.title$ Lời Nói Thân Tình"
 fund_inspiration.2030.desc:0 "Bạn ta, [friend.GetTitledFirstName], chặn ta lại trong hành lang với nụ cười rạng rỡ.\n\n\"À, #EMP kia rồi#! [ROOT.Char.GetFirstNameNoTooltip]! Ta vừa nói chuyện với [inspiration_owner.GetTitledFirstName]! Ta nghe rằng [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] cho ngươi — ta không thể cưỡng lại việc ghé thăm [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeRoom')]!\"\n\n\"Ta đã trao đổi với [inspiration_owner.GetHerHim] về cách đáp ứng kỳ vọng của ngươi; ta nghĩ ngươi sẽ thích kết quả đó!\""
 fund_inspiration.2030.a:0 "\"Ồ! Cảm ơn nhé, [friend.GetFirstNameNoTooltip]!\""

 fund_inspiration.2040.t:0 "$fund_inspiration.title$ Phá Hoại"
 fund_inspiration.2040.desc:0 "Tiếng kêu bực bội của [inspiration_owner.GetTitledFirstNamePossessive] phá tan khoảnh khắc yên tĩnh: \"Ta làm sao mà [inspiration_owner.Custom('InspirationTypeDescription')] được khi [inspiration_owner.Custom('GetInspirationTypeTool')] của ta cứ biến mất?!\"\n\n[inspiration_owner.GetSheHe|U] lao tới chỗ ta. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], cứ mỗi lần Ta tiến triển được chút nào là lại có chuyện hỏng bét! Ta chắc chắn có kẻ trong triều đang phá hoại công việc của Ta!\"\n\n[inspiration_owner.Custom('GetInspirationOwnerType')] hậm hực, rồi quay gót trở về [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeRoom')]."
 fund_inspiration.2040.a:0 "Đúng là nghiệp dư."
 fund_inspiration.2040.b:0 "Ta trả tiền cho chất lượng, không phải kịch tính!"
 fund_inspiration.2040.c:0 "Chẳng lẽ là… không… #EMP [rival.GetFirstNameNoTooltip]?#!"
 fund_inspiration.2040.c.tt:0 "Kẻ phá hoại bị bắt"
 fund_inspiration.2040.c.flavor:0 "Đến lúc giăng bẫy!"
 fund_inspiration.2040.c.success:0 "Ngài bắt được kẻ phá hoại"
 fund_inspiration.2040.c.failure:0 "Kẻ phá hoại trốn thoát"
 ep1_fund_inspiration_2040_scheme_modifier:0 "Hành Vi Lén Lút"
 ep1_fund_inspiration_2040_scheme_modifier_desc:0 "Nhân vật này rất thành thạo các hành vi lén lút."

 fund_inspiration.2041.desc:0 "Sau bữa tối, ta phục kích gần phòng của [inspiration_owner.GetTitledFirstNamePossessive] cùng một nhóm lính canh, dõi theo lối đi khi [ROOT.Char.Custom('FortifiedBuilding')] dần chìm vào bóng tối.\n\nNgay khi ta định bỏ cuộc, một ánh sáng run rẩy nhảy múa dọc hành lang, theo sau là một bóng người khoác áo choàng.\n\nBóng đen đẩy cửa bước vào [inspiration_owner.Custom('GetInspirationTypeRoom')] và lén lút kiểm tra hành lang lần nữa, gương mặt [rival.GetHerHis] được soi sáng bởi ngọn đèn dầu lập lòe: [rival.GetTitledFirstName]!"
 fund_inspiration.2041.a:0 "\"A-ha! Tống vào ngục!\""
 fund_inspiration.2041.b:0 "\"Quẳng [rival.GetHerHim] ra khỏi [ROOT.Char.Custom('FortifiedBuilding')]!\""
 fund_inspiration.2041.c:0 "Ta sẽ tự xử theo cách của mình…"

  fund_inspiration.2050.t:0 "$fund_inspiration.title$ Ý Kiến Đã Cân Nhắc"
  fund_inspiration.2050.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')], [inspiration_owner.GetTitledFirstName], cập nhật cho ta về tiến độ công việc của [inspiration_owner.GetHerHis], thao thao bất tuyệt về những giới hạn của [inspiration_owner.Custom('GetInspirationTypeTool')] và [inspiration_owner.Custom('GetInspirationTypeStation')] trong khi tâm trí ta quay cuồng với những ý tưởng táo bạo cho [inspiration_owner.Custom('GetInspirationTypeObject')] của mình... \n\n[inspiration_owner.Custom('GetInspirationTypeVerb')|U] có thể không phải là sở trường cá nhân của #EMP ta#!, nhưng điều đó không có nghĩa là ta không có quyền lên tiếng về việc tiền của ta được dùng ra sao!"
  fund_inspiration.2050.a:0 "Ta có vài gợi ý..."
  fund_inspiration.2050.b:0 "Xuất thân của ta mang lại cho ta vài góc nhìn độc đáo."
  fund_inspiration.2050.c:0 "Ngươi đã cân nhắc góc độ #EMP này#! chưa?"
  fund_inspiration.2050.d:0 "Để ta xem qua các bản phác thảo của ngươi..."
  fund_inspiration.2050.e:0 "Không, [inspiration_owner.GetFirstNameNoTooltip] biết [inspiration_owner.GetSheHe] đang làm gì."
  fund_inspiration.2050.success:0 "Ý tưởng của Ngài phát huy hiệu quả"
  fund_inspiration.2050.nothing:0 "Ngài bị phớt lờ"
  fund_inspiration.2050.failure:0 "Ý tưởng của Ngài tệ hại"
  fund_inspiration_half_refund_tt:0 "Một nửa khoản đầu tư của Ngài sẽ được hoàn lại:"
  fund_inspiration_quarter_refund_tt:0 "Một phần tư khoản đầu tư của Ngài sẽ được hoàn lại:"

  fund_inspiration.2060.t:0 "$fund_inspiration.title$ Kho Báu Của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  fund_inspiration.2060.desc.religious:0 "Lòng mộ đạo của ta được dùng làm tấm gương cho tất cả, từ quốc vương hùng mạnh đến kẻ ăn xin thấp hèn, và cùng với đó là những tín đồ tìm đến."
  fund_inspiration.2060.desc.fame:0 "Chiến công của ta được nhắc đến với sự kính nể và ganh tị khắp thế gian, từ các triều đình xa xôi đến những quán rượu thôn làng, và cùng với đó là những người ủng hộ tìm đến."
  fund_inspiration.2060.desc.court:0 "Triều đình xa hoa của ta vừa bị oán trách vừa được tán dương khắp thế gian, ai cũng mong có thể sánh bằng và tận hưởng sự lộng lẫy ấy, và cùng với đó là những kẻ ngưỡng mộ tìm đến."
  fund_inspiration.2060.desc:0 "\n\nHôm nay [donator.GetTitledFirstName] được dẫn vào yết kiến, và được giới thiệu là đại diện cho "
 
  fund_inspiration.2060.desc.brotherhood:0 "một hội [donator.Custom('SisterBrother')] nhỏ theo đức tin [donator.GetFaith.GetAdjectiveNoTooltip] đến từ [barony_scope.GetNameNoTierNoTooltip], thuộc [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
  fund_inspiration.2060.desc.abbey:0 "a small [barony_scope.GetAdjectiveNoTooltip] [donator.GetFaith.GetAdjectiveNoTooltip] [donator.GetFaith.HouseOfWorship] in [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
  fund_inspiration.2060.desc.mercenary:1 "một toán lính đánh thuê [donator.GetCulture.GetNameNoTooltip] nhỏ đến từ [barony_scope.GetNameNoTierNoTooltip], thuộc [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
  fund_inspiration.2060.desc.guild:0 "một nghiệp đoàn [donator.Custom('dummy_peasant_profession')] nhỏ đến từ [barony_scope.GetNameNoTierNoTooltip], thuộc [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
  fund_inspiration.2060.piety:0 ""Đấng thánh thiện tối cao [ROOT.Char.GetTitleAsNameNoTooltip]!""
  fund_inspiration.2060.saoshyant:0 ""Saoshyant thiên giới!""
  fund_inspiration.2060.savior:0 ""Vị cứu tinh thánh thiện!""
  fund_inspiration.2060.saint:0 ""Vị thánh đáng kính!""
  fund_inspiration.2060.prestige:0 ""Ôi, [ROOT.Char.GetTitleAsNameNoTooltip] lẫy lừng!""
  fund_inspiration.2060.grandeur:1 ""Ôi, [ROOT.Char.GetTitleAsNameNoTooltip] vô song!""
  fund_inspiration.2060.desc_outro:0 "Bằng hữu của chúng ta nghe nói có những [inspiration_owner.Custom('GetInspirationTypeObject')] kỳ diệu đang được chế tác cho ngài, và mong được đóng góp cho [inspiration_owner.Custom('GetInspirationOwnerType')] của ngài! Điều đó sẽ là vinh dự lớn lao cho chúng ta, thưa bệ hạ — chúng ta đã dành dụm suốt nhiều tháng!""
  fund_inspiration.2060.a:0 ""Chính #EMP ta#! mới là người được vinh danh.""
  fund_inspiration.2060.b.religious:0 ""Không, xin hãy giữ lấy, [donator.Custom('NunMonk')] nhân hậu.""
  fund_inspiration.2060.b.prestige:0 ""Không, ta từ chối! Hãy giữ lấy, bằng hữu!""
  fund_inspiration.2060.c:0 ""Chỉ có thế thôi sao?""

  ep1_fund_inspiration_2070_accept_modifier:0 "Chấp Nhận Tặng Phẩm"
  ep1_fund_inspiration_2070_accept_modifier_desc:0 "Bá quận này vui mừng vì đã góp phần tạo nên những bảo vật trân quý của vị quân chủ."
  ep1_fund_inspiration_2070_refuse_modifier:0 "Từ Chối Tặng Phẩm"
  ep1_fund_inspiration_2070_refuse_modifier_desc:0 "Bá quận này bất mãn vì quà tặng bị từ chối, nhưng giờ đây lại dư dả tiền bạc."
  ep1_fund_inspiration_2070_mock_modifier:0 "Chế Giễu Tặng Phẩm"
  ep1_fund_inspiration_2070_mock_modifier_desc:0 "Bá quận này phẫn nộ vì quà tặng của mình bị quân chủ chế giễu."

  fund_inspiration.2070.t:0 "$fund_inspiration.title$ Viên Ngọc Khiếm Khuyết"
  fund_inspiration.2070.desc:0 "Bị xao nhãng bởi các việc nơi triều đình, ta để tin tức từ [inspiration_owner.Custom('GetInspirationOwnerType')] của mình, [inspiration_owner.GetTitledFirstName], bị trì hoãn ngày càng lâu."
  fund_inspiration.2070.desc.stalled:0 "Giờ thì công việc trên [inspiration_owner.Custom('GetInspirationTypeObject')] của ta đã hoàn toàn đình trệ, và dường như ta không hoàn toàn là người phải chịu trách nhiệm... \n\n"
  fund_inspiration.2070.desc.wasted:0 "Giờ thì hàng tuần lễ lao động trên [inspiration_owner.Custom('GetInspirationTypeObject')] của ta đã bị lãng phí, và dường như ta không hoàn toàn là người phải chịu trách nhiệm... \n\n"
  fund_inspiration.2070.desc.lunatic:0 "I am told of [inspiration_owner.GetFirstNamePossessiveNoTooltip] delusions and erratic behavior, constantly changing [inspiration_owner.GetHerHis] mind and starting from scratch, and [inspiration_owner.GetHerHis] strange [inspiration_owner.Custom('GetInspirationTypeTool')] technique."
  fund_inspiration.2070.desc.possessed:0 "Ta được kể về những cơn thay đổi tâm trạng liên miên của [inspiration_owner.GetFirstNamePossessiveNoTooltip], tồi tệ nhất trong số đó đã phá hỏng toàn bộ công sức lao động của [inspiration_owner.GetHerHis] trong cơn điên loạn của sự nghi ngờ bản thân và tức giận."
  fund_inspiration.2070.desc.depressed:0 "I am told [inspiration_owner.GetFirstNameNoTooltip] spends [inspiration_owner.GetHerHis] days in bed, consumed by a pervasive melancholy, unable to meet the day."
  fund_inspiration.2070.desc.drunkard:0 "Ta được kể rằng [inspiration_owner.GetFirstNamePossessiveNoTooltip] tiêu khoản tài trợ của [inspiration_owner.GetHerHis] để uống [ROOT.Char.Custom('RegionalAlcoholicDrink')] và làm trò hề trong các quán rượu của [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
  fund_inspiration.2070.desc.hashishiyah:0 "Ta được kể về lượng lớn hashish mà [inspiration_owner.GetFirstNameNoTooltip] đã tiêu tiền tài trợ của [inspiration_owner.GetHerHis] vào đó, trước khi tự nhốt [inspiration_owner.GetHerselfHimself] trong bóng tối."
  fund_inspiration.2070.desc.rakish:0 "Ta được kể về việc [inspiration_owner.GetFirstNamePossessiveNoTooltip] liên tục vắng mặt khỏi [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeRoom')], và theo mọi lời kể thì [inspiration_owner.GetHerHis] đã tiêu thời gian lẫn tiền bạc của ta trong các nhà thổ ở [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
  fund_inspiration.2070.desc.profligate:0 "Ta được kể về thói tiêu xài cưỡng ép của [inspiration_owner.GetFirstNamePossessiveNoTooltip] tại chợ, nơi [inspiration_owner.GetSheHe] đã lãng phí sự bảo trợ của [inspiration_owner.GetHerHis] vào những ý tưởng phù phiếm chẳng đi đến đâu."
  fund_inspiration.2070.desc.improvident:0 "Ta được kể về những khoản quyên góp cưỡng ép của [inspiration_owner.GetFirstNamePossessiveNoTooltip], cùng các mục đích khác nhau mà [inspiration_owner.GetSheHe] đã tiêu sự bảo trợ của ta vào đó thay vì công việc của [inspiration_owner.GetHerHis]."
  fund_inspiration.2070.desc.irritable:0 "Ta được kể về tính khí thô bạo của [inspiration_owner.GetFirstNamePossessiveNoTooltip] — điều mà nếu không có ta can thiệp, đã xua đuổi tất cả những ai có thể sửa chữa các sai lầm và hiểu lầm của [inspiration_owner.GetHerHis]."
  fund_inspiration.2070.desc.comfort_eater:0 "Ta được kể về cơn thèm ăn vô độ của [inspiration_owner.GetFirstNamePossessiveNoTooltip], cùng việc [inspiration_owner.GetHerHis] tiêu khoản tài trợ của ta cho bánh ngọt và kẹo từ các khu chợ."
  fund_inspiration.2070.desc.reclusive:0 "Ta được kể rằng [inspiration_owner.GetFirstNameNoTooltip] hầu như không xuất hiện kể từ buổi gặp cuối cùng của chúng ta, bị giam mình trong [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeRoom')] nơi mà, thiếu đi sự chỉ dẫn, [inspiration_owner.GetSheHe] đã hoàn toàn đi chệch khỏi kế hoạch đã thống nhất."
  fund_inspiration.2070.desc.wounded:0 "Ta được kể về những vết thương hở của [inspiration_owner.GetFirstNamePossessiveNoTooltip], khiến [inspiration_owner.GetHerHim] phải nằm liệt giường, quằn quại trong đau đớn, và ta không khỏi hy vọng [ROOT.Char.GetFaith.DeathDeityName] sẽ kiên nhẫn với [inspiration_owner.GetHerHim]..."
  fund_inspiration.2070.desc.pregnant:0 "Ta được kể về việc [inspiration_owner.GetFirstNamePossessiveNoTooltip] mang thai, với những cơn đau nhức và sự bất động khiến [inspiration_owner.GetHerHim] không thể làm việc..."
  fund_inspiration.2070.desc.sick:0 "Ta được kể về căn bệnh suy nhược của [inspiration_owner.GetFirstNamePossessiveNoTooltip], khiến [inspiration_owner.GetHerHim] thường xuyên phải nằm liệt giường và chẳng còn tâm trạng nào để làm việc."
  fund_inspiration.2070.desc_outro:0 "\n\nCuối cùng ta yêu cầu [inspiration_owner.GetSheHe] phải được dẫn đến trước mặt ta."
  fund_inspiration.2070.a:0 ""Hãy đảm bảo mọi thứ quay lại đúng quỹ đạo.""
  fund_inspiration.2070.b:0 ""Ta biết ngươi đã cố gắng hết sức rồi, [inspiration_owner.GetFirstNameNoTooltip].""
  fund_inspiration.2070.c:0 ""Tốt hơn hết nó phải là một kiệt tác, và là sớm!""
  fund_inspiration.2070.d:0 ""Rời khỏi [ROOT.Char.Custom('FortifiedBuilding')] này ngay lập tức, đồ ăn bám.""

  fund_inspiration.2080.t:0 "$fund_inspiration.title$ Tự Do Sáng Tạo"
  fund_inspiration.2080.antiquarian:0 ""Thật nực cười!"" [rival.GetTitledFirstName] phản đối, ""Với tư cách là người trông coi bộ sưu tập cá nhân của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip], ta có trách nhiệm đảm bảo chất lượng tác phẩm của ngươi!""
  fund_inspiration.2080.artificer:0 "This is ridiculous!" [rival.GetTitledFirstName] protests, "I am a trusted crafts[rival.GetWomanMan] of the [ROOT.Char.GetTitleAsNameNoTooltip]! I might be able to help if you only let me see your work!""
  fund_inspiration.2080.desc:0 "\n\n""Ngươi sẽ thấy khi nó hoàn thành!"" [inspiration_owner.GetTitledFirstName] đáp trả. ""Ngươi nên để một [inspiration_owner.GetWomanMan] được làm việc theo cách của [inspiration_owner.GetHerHis] khi [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] xứng đáng với hoàng gia!""
  fund_inspiration.2080.a:0 ""[rival.GetFirstNameNoTooltip] #EMP will#! ensure its quality, [inspiration_owner.GetFirstNameNoTooltip].""
  fund_inspiration.2080.b:0 ""Stick to your own duties, [rival.GetFirstNameNoTooltip].""
  fund_inspiration.2080.success:0 "[rival.GetFirstNameNoTooltip] improves [inspiration_owner.GetFirstNamePossessiveNoTooltip] work"
  fund_inspiration.2080.failure:0 "[rival.GetFirstNameNoTooltip] stifles [inspiration_owner.GetFirstNameNoTooltip]"
  fund_inspiration.2080.c:0 "Đã đến lúc hít thở không khí trong lành."

  fund_inspiration.2090.t:0 "$fund_inspiration.title$ Dấu Ấn Của Một [event_spouse.GetWifeHusband|U]"
  fund_inspiration.2090.desc:0 "I spot my [event_spouse.GetWifeHusband], [event_spouse.GetFirstName], chattering excitedly to [inspiration_owner.GetTitledFirstName], listing ideas and suggestions for [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeObject')]. My [inspiration_owner.Custom('GetInspirationOwnerType')] is barely concealing [inspiration_owner.GetHerHis] contempt, clearly annoyed at my spouse's interference. \n\n"...and as you are [inspiration_owner.Custom('InspirationTypeDescription')]," [event_spouse.GetSheHe] goes on, "it may as well match my grand[event_spouse.GetMotherFather]'s old [inspiration_owner.Custom('GetInspirationTypeObject')]!" \n\nPart of [inspiration_owner.GetFirstNamePossessiveNoTooltip] soul seems to be dying."
  fund_inspiration.2090.a:0 ""Hãy lắng nghe đi, [inspiration_owner.GetFirstNameNoTooltip] — [event_spouse.GetWifeHusband] của ta phải được lắng nghe!""
  fund_inspiration.2090.b:0 ""Nào cưng, hãy để việc này cho chuyên gia.""
  fund_inspiration.2090.success:0 "[event_spouse.GetFirstNameNoTooltip] cải thiện tác phẩm của [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
  fund_inspiration.2090.failure:0 "[event_spouse.GetFirstNameNoTooltip] kìm hãm [inspiration_owner.GetFirstNameNoTooltip]"

  fund_inspiration.2100.t:0 "$fund_inspiration.title$ Nghệ Nhân Đố Kỵ"
  fund_inspiration.2100.desc:0 "[inspiration_owner.GetTitledFirstName], [inspiration_owner.Custom('GetInspirationOwnerType')] của ta, ngồi trừng mắt qua bữa ăn của [inspiration_owner.GetHerHis] tại [other_inspiration_owner.GetTitledFirstName], một đối thủ đồng tranh cho sự bảo trợ của ta. \n\nDù thường ngày vẫn âm thầm ẩn mình, suy ngẫm bên [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeStation')], [inspiration_owner.GetFirstNameNoTooltip] nhanh chóng phá hỏng bầu không khí mỗi khi đến giờ ăn. \n\nĐêm nay [inspiration_owner.GetSheHe] cuối cùng cũng bùng nổ:"
  fund_inspiration.2100.desc.funds:0 ""Tại sao [other_inspiration_owner.GetFirstNameNoTooltip] lại nhận được nhiều tiền hơn ta? '[other_inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|U]'! Thì sao chứ?""
  fund_inspiration.2100.desc.rival:0 ""Ta không thể tin là ngài lại đổ đầy ngân khố cho cái [other_inspiration_owner.Custom2('InsultNoun', SCOPE.sC('inspiration_owner'))] đó, [other_inspiration_owner.GetFirstNameNoTooltip] — ngài còn thu được kết quả tốt hơn từ bọn hốt phân!""
  fund_inspiration.2100.desc.fallback:0 ""You should drop this dead weight, my liege; [other_inspiration_owner.GetFirstNameNoTooltip] doesn't know the right end of a [other_inspiration_owner.Custom('GetInspirationTypeTool')], let alone [other_inspiration_owner.GetHerHis] way around a [other_inspiration_owner.Custom('GetInspirationTypeRoom')].""
  fund_inspiration.2100.a:0 ""Tác phẩm của ngươi có giá trị với ta, [inspiration_owner.GetFirstNameNoTooltip].""
  fund_inspiration.2100.b:0 ""Ta sẽ tăng mức tài trợ cho ngươi, hài lòng chưa?""
  fund_inspiration.2100.c:0 ""Nào, có chuyện gì vậy?""
  fund_inspiration.2100.d:0 ""Dừng lại sự ngu xuẩn này đi.""
  fund_inspiration.2100.c.leave:0 "[inspiration_owner.GetFirstNameNoTooltip] từ bỏ công việc của [inspiration_owner.GetHerHis]"
  fund_inspiration.2100.c.worse:0 "[inspiration_owner.GetFirstNameNoTooltip] mất đi động lực"
  fund_inspiration.2100.success:0 "Ngươi xoa dịu được mọi chuyện"
  fund_inspiration.2100.failure:0 "Ngươi khiến mối hiềm khích trở nên tệ hơn"

  fund_inspiration.2110.t:0 "$fund_inspiration.title$ Người Sành Sỏi Đồng Điệu"
  fund_inspiration.2110.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_vassal'))] của ta, [generous_vassal.GetTitledFirstName], chặn ta lại: ""Hân hạnh gặp ngài, [generous_vassal.Custom2('RelationToMeShort', ROOT.Char)]! Ta nghe nói về sự bảo trợ của ngài dành cho [inspiration_owner.GetFirstName] — vị [inspiration_owner.Custom('GetInspirationOwnerType')]. Người ta bảo rằng [inspiration_owner.GetSheHe] là [inspiration_owner.Custom('InspirationTypeDescription')] xứng đáng với một [ROOT.Char.GetTitleAsNameNoTooltip]."" \n\n""Xin hãy nhận lấy thứ này và trao nó cho [inspiration_owner.GetHerHim]. ""
  fund_inspiration.2110.desc.part.2: "Ta không muốn bỏ lỡ cơ hội góp phần vào sự ra đời của một kiệt tác!" \n\n"
  fund_inspiration.2110.desc.part.2.research: "Ta không muốn bỏ lỡ cơ hội được tham gia vào một khám phá khoa học mới!\n\n"
  fund_inspiration.2110.desc.generous:0 "[generous_vassal.GetFirstNameNoTooltip] nổi tiếng là hào phóng, và có vẻ như [generous_vassal.GetSheHe] đã tìm được một lối thoát mới cho thói tiêu tiền của [generous_vassal.GetHerHis]..."
  fund_inspiration.2110.desc.dweeb:0 "[generous_vassal.GetFirstNameNoTooltip] có hứng thú với rất nhiều thứ, trong đó có các cổ vật quý giá và những bộ óc tạo ra chúng..."
  fund_inspiration.2110.desc.dweeb.research: "[generous_vassal.GetFirstNameNoTooltip] có hứng thú với rất nhiều thứ, trong đó có công nghệ và những bộ óc đầu tiên nghĩ ra chúng..."
  fund_inspiration.2110.desc.friend:0 "[generous_vassal.GetFirstNameNoTooltip] mỉm cười ấm áp, một túi tiền xu đong đưa trên tay [generous_vassal.GetHerHis]."
  fund_inspiration.2110.desc.rich:0 "Tội nghiệp [generous_vassal.GetFirstNameNoTooltip] hẳn là có quá nhiều tiền đến mức [generous_vassal.GetSheHe] chẳng biết tiêu vào đâu..."
  fund_inspiration.2110.a:0 ""Thật hào phóng!""
  fund_inspiration.2110.b:0 ""Ồ, ta sẽ #EMP đảm bảo#! [inspiration_owner.GetSheHe] nhận được nó!""
  fund_inspiration.2110.b.flavor:0 "Thứ này hẳn sẽ rất hữu ích..."
  fund_inspiration.2110.c:0 ""Không, xin ngươi cứ giữ lấy!""
 # ( ͡° ͜ʖ ͡°)
  fund_inspiration.2120.t:0 "$fund_inspiration.title$ Thức Khuya"
  fund_inspiration.2120.desc:0 "Thời gian như tan biến trong [inspiration_owner.GetFirstNamePossessive] [inspiration_owner.Custom('GetInspirationTypeRoom')], uống [ROOT.Char.Custom('RegionalAlcoholicDrink')] khi chúng ta hào hứng thảo luận về [inspiration_owner.Custom('GetInspirationTypeObject')] mà [inspiration_owner.GetSheHe] đang [inspiration_owner.Custom('GetInspirationTypeVerb')] cho ta. Là ta đang tưởng tượng, hay có một thứ gì đó… căng thẳng không thể diễn tả? \n\n"
  fund_inspiration.2120.desc.me:0 "Tâm trí ta lang thang, hấp thụ những nét tinh tế trên cơ thể [inspiration_owner.GetHerHis], đôi môi đang cười của [inspiration_owner.GetHerHis]… Ta đặt tay lên [inspiration_owner.GetHersHis]. Chiếc [inspiration_owner.Custom('GetInspirationTypeTool')] rơi khỏi những ngón tay run rẩy của [inspiration_owner.GetHerHis] khi ta đắm đuối nhìn vào đôi mắt xinh đẹp ấy. \n\n"
  fund_inspiration.2120.desc.them:0 "Giờ đã khuya khi [inspiration_owner.Custom('GetInspirationOwnerType')] của ta đặt xuống [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeTool')], uống một ngụm lớn từ chiếc cốc của [inspiration_owner.GetHerHis], rồi mỉm cười đầy ẩn ý với ta. Có phải… [inspiration_owner.GetSheHe]…? \n\n"
  fund_inspiration.2120.desc.them_into_alot:0 "[inspiration_owner.GetSheHe|U] lao vào vòng tay ta như một con thú, hất tung [inspiration_owner.Custom('GetInspirationTypeStation')] văng khắp căn phòng."
  fund_inspiration.2120.desc.them_into:1 "Trong [inspiration_owner.GetHerHim], ta tìm thấy cùng một niềm đam mê tuyệt vọng: [inspiration_owner.GetSheHe] ngã vào vòng tay ấm áp của ta…"
  fund_inspiration.2120.desc.me_zealous_homosexuality:0 "Điều này là sai trái, nhân danh [ROOT.Char.GetFaith.HighGodName], ta không thể khuất phục trước những cám dỗ tội lỗi này…"
  fund_inspiration.2120.desc.me_zealous_adultery:0 "Không, [ROOT.Char.GetFaith.ReligiousText] đã nói rất rõ! Ngoại tình là tội lỗi! Đây là sự cám dỗ của [ROOT.Char.GetFaith.DevilName]!"
  fund_inspiration.2120.desc.me_unattracted:0 "Đột nhiên, [inspiration_owner.GetFirstNameNoTooltip] bước tới, ôm chầm lấy ta! Tay ta lập tức ngăn [inspiration_owner.GetHerHim] lại, có lẽ quá mạnh… hơi ấm của [inspiration_owner.GetHerHis|U] ngay lập tức lạnh đi, cứng lại thành sự hoang mang và sợ hãi."
  fund_inspiration.2120.desc.me_chaste:0 "[inspiration_owner.GetSheHe|U] bước tới, kéo ta vào vòng tay ấm áp của [inspiration_owner.GetHerHis]. Cơ thể ta nói có, nhưng trái tim ta gào thét không…"
  fund_inspiration.2120.desc.me_into:0 "Ta không thể phủ nhận có điều gì đó khuấy động trong ta, tim ta đập nhanh và ta thấy mình đang ôm [inspiration_owner.GetHerHim] trong tay khi [inspiration_owner.GetSheHe] cũng ôm lấy ta đáp lại… chuyện #EMP gì#! đang xảy ra vậy?"
  fund_inspiration.2120.desc.me_into_alot:0 "Không còn nghi ngờ gì về ý định của [inspiration_owner.GetHerHis]! Ta gần như không thể kiềm chế bản thân khi hất sang một bên [inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationTypeStation')]."
  fund_inspiration.2120.a:0 ""Lại đây nào, người đẹp.""
  fund_inspiration.2120.e:0 ""Ồ… [inspiration_owner.GetFirstNameNoTooltip]…""
  fund_inspiration.2120.f.chaste:0 ""Điều này không dành cho ta…""
  fund_inspiration.2120.f:0 ""Ta… phải đi!""
  fund_inspiration.2120.h:0 ""Nhanh lên, cửa kìa!""
  fund_inspiration.2120.i:0 ""Ồ! Ta không…""
  fund_inspiration.2120.j:0 ""Không! [ROOT.Char.GetFaith.ReligiousText] cấm đoán mối kết hợp này…""
  fund_inspiration.2120.k.me:0 ""Không! Ta không thể… ngoại tình là tội lỗi!""
  fund_inspiration.2120.k.them:0 ""Không, ta không thể dụ dỗ [inspiration_owner.GetHerHim] vào tội ngoại tình…""
  fund_inspiration.2120.l:0 ""Khoan đã… ngươi #EMP dám#! sao?!""
  fund_inspiration.2120.m:0 ""Buông ta ra, kẻ sa đọa tội lỗi!""
  fund_inspiration.2120.leave_flavor:0 "Ngươi vội vã rời đi"

  fund_inspiration.2130.t:0 "$fund_inspiration.title$ Cảm Hứng Thất Thường"
  fund_inspiration.2130.desc:1 "Ta tình cờ chạm mặt một [inspiration_owner.GetTitledFirstName] trông vô cùng nghiêm trọng, [inspiration_owner.Custom('GetInspirationOwnerType')] của ta, hy vọng rằng [inspiration_owner.GetSheHe] không mang đến tin xấu về [inspiration_owner.Custom('GetInspirationTypeObject')] lộng lẫy mà [inspiration_owner.GetSheHe] đáng lẽ sắp hoàn thành cho ta. \n\n\"Ồ, ngài đây rồi thưa chủ nhân… ta đã đụng phải bức tường trong công việc — không có gì nghiêm trọng đâu! Ý tưởng của ta cứ lẩn trốn khi áp lực ngày càng tăng!\" [inspiration_owner.GetSheHe|U] cười gượng. \n\n\"Ta chỉ cần một chút… cảm hứng! Vĩ đại thay [ROOT.Char.GetTitleAsNameNoTooltip], ngài có thể cho ta xem vài… ví dụ có sẵn để nghiên cứu không?\""
  fund_inspiration.2130.a.library:0 ""Đến thư viện!""
  fund_inspiration.2130.a.armory:0 ""Đến kho vũ khí!""
  fund_inspiration.2130.a.hall:0 ""Đến đại sảnh!""
  fund_inspiration.2130.a.tt:0 "Chất lượng hoặc tiến độ [inspiration|E] của [inspiration_owner.GetFirstNamePossessiveNoTooltip] có thể được cải thiện"
  fund_inspiration.2130.a.flavor:0 "Chúng ta chắc chắn sẽ tìm được thứ gì đó giúp ích!"
  fund_inspiration.2130.b:0 ""Ta biết ngươi cần gì rồi!""
  fund_inspiration.2130.b.great:0 "Nàng thơ của [inspiration_owner.GetFirstNamePossessiveNoTooltip] lớn mạnh"
  fund_inspiration.2130.b.good:1 "Nàng thơ của [inspiration_owner.GetFirstNamePossessiveNoTooltip] trở lại"
  fund_inspiration.2130.b.nothing:0 "Nàng thơ của [inspiration_owner.GetFirstNamePossessiveNoTooltip] ngủ yên"
  fund_inspiration.2130.b.bad:0 "Nàng thơ của [inspiration_owner.GetFirstNamePossessiveNoTooltip] bỏ chạy"
  fund_inspiration.2130.b.terrible:0 "Nàng thơ của [inspiration_owner.GetFirstNamePossessiveNoTooltip] chết đi"
  fund_inspiration.2130.b.flavor:0 "Chúng ta sẽ có một phen vui vẻ đây!"
  fund_inspiration.2130.c:0 ""À, ta có đúng thứ thuốc bổ.""
  fund_inspiration.2130.c.dead:1 "[inspiration_owner.GetFirstNamePossessiveNoTooltip] gục chết"
  fund_inspiration.2130.c.flavor:0 "Chai màu đỏ đó ở đâu nhỉ…"
  fund_inspiration.2130.d:0 ""Cảm hứng thực sự đến từ bên trong.""
 
  fund_inspiration.2131.t:0 "$fund_inspiration.title$ Bỏ Cái Cũ"
  fund_inspiration.2131.desc_library_unused:0 "Với một cú đẩy cuối cùng, [inspiration_owner.GetTitledFirstName] và ta xông vào thư viện phủ đầy bụi — một căn phòng ta hiếm khi có lý do để bước vào.\n\n"
  fund_inspiration.2131.desc_library:0 "Ta dẫn [inspiration_owner.GetTitledFirstName] vào thư viện được chăm sóc cẩn thận của mình, chỉ ra vài tập sách và dược phẩm đáng chú ý đang trưng bày.\n\n"
  fund_inspiration.2131.desc_armory_unused:0 "Một binh sĩ giật mình dẫn [inspiration_owner.GetTitledFirstName] và ta vào sự bừa bộn của kho vũ khí — ta chưa bao giờ xuống đây!\n\n"
  fund_inspiration.2131.desc_armory:0 "[inspiration_owner.GetTitledFirstName] và ta được dẫn vào kho vũ khí rộng lớn của mình, nơi ta chỉ ra vài món ưa thích, gợi ý về câu chuyện của chúng.\n\n"
  fund_inspiration.2131.desc_great_hall_low:0 "Khi ta nhanh chóng dẫn [inspiration_owner.GetTitledFirstName] tham quan những món kỳ vật, ta chợt nhận ra đại sảnh của mình vẫn chưa thật sự vĩ đại như lẽ ra có thể.\n\n"
  fund_inspiration.2131.desc_great_hall:0 "Ta dẫn [inspiration_owner.GetTitledFirstName] tham quan đại sảnh của mình, vô cùng tự hào về sự xa hoa và những của cải đa dạng được trưng bày."
  fund_inspiration.2131.desc_antiquarian:0 "[second.GetTitledFirstName] khăng khăng đòi đi cùng và quan sát từ xa, nhăn mặt mỗi khi một món đồ bị xử lý sai cách hoặc nhận diện nhầm.\n\n"
  fund_inspiration.2131.artificer:0 "[second.GetTitledFirstName] tags along happily, always interested in the creative processes of [second.GetHerHis] peers.\n\n"
  fund_inspiration.2131.desc_equipped:0 "[inspiration_owner.Custom('GetInspirationOwnerType')] dừng lại, như thể bị choáng ngợp, chăm chú xem xét [artifact_1.GetName] của ta. \"À, thật tuyệt vời thưa chủ nhân… Ta… ta có thể dùng [inspiration_owner.Custom('GetInspirationMaterialType')] của nó không?\""
  fund_inspiration.2131.desc_unequipped:0 "Chính trong kho chứa mà [inspiration_owner.Custom('GetInspirationOwnerType')] bất chợt khựng lại, chăm chú quan sát [artifact_1.GetName] của ta. \"Phải… [inspiration_owner.Custom('GetInspirationMaterialType')] này hẳn sẽ làm được… Ngài… vẫn muốn giữ nó chứ? Thưa chủ nhân?\""
  fund_inspiration.2131.desc_fallback:1 "[inspiration_owner.GetSheHe|U] đi vòng quanh căn phòng vài lượt rồi quay lại với ta, vẻ thất vọng. \"Thưa chủ nhân, ở đây chẳng có gì thật sự nổi bật với ta… còn thứ gì khác không?\""
  fund_inspiration.2131.a:0 ""[artifact_1.GetNameNoTooltip]? Được thôi…""
  fund_inspiration.2131.b:0 ""Thế còn [artifact_2.GetNameNoTooltip] của ta thì sao?""
  fund_inspiration.2131.c:0 ""Chắc hẳn có ít đồ bỏ đi quanh đây…""
  fund_inspiration.2131.c.good:0 "Ngươi tìm được [inspiration_owner.Custom('GetInspirationMaterialType')] chất lượng"
  fund_inspiration.2131.c.nothing:0 "Ngươi không tìm được gì"
  fund_inspiration.2131.c.bad:0 "Ngươi tìm được [inspiration_owner.Custom('GetInspirationMaterialType')] tệ hại"
  fund_inspiration.2131.d:0 ""Ngươi chỉ xem qua thôi.""
  fund_inspiration.2131.d.great:1 "[inspiration_owner.GetNameNoTooltip] vớ được vàng"
  fund_inspiration.2131.d.good:1 "[inspiration_owner.GetNameNoTooltip] tìm được [inspiration_owner.Custom('GetInspirationMaterialType')]"
  fund_inspiration.2131.d.nothing:1 "[inspiration_owner.GetNameNoTooltip] không tìm được gì"
  fund_inspiration.2131.d.bad:1 "[inspiration_owner.GetNameNoTooltip] tìm được [inspiration_owner.Custom('GetInspirationMaterialType')] kém"
  fund_inspiration.2131.d.terrible:1 "[inspiration_owner.GetNameNoTooltip] tìm được [inspiration_owner.Custom('GetInspirationMaterialType')] thảm hại"
  fund_inspiration.2131.e:0 ""[second.GetFirstNameNoTooltip]! Có gợi ý gì không?""
  fund_inspiration.2131.f:0 ""Thật là phí thời gian!""

  fund_inspiration.3001.t:0 "$fund_inspiration.title$ Trước Tác Bất Kính"
  fund_inspiration.3001.desc_opening:0 "[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xông vào phòng, ôm chặt một xấp giấy, theo sau là [inspiration_owner.GetTitledFirstName] đang bối rối cố giật lại bản thảo khỏi tay [court_chaplain.GetHerHis].\n\n"
  fund_inspiration.3001.desc_witch:0 ""[inspiration_owner.GetWomanMan] này đang viết về [ROOT.Char.GetFaith.WitchGodName]. #EMP [ROOT.Char.GetFaith.WitchGodName]#!!""
  fund_inspiration.3001.desc_cannibal:0 ""[inspiration_owner.GetWomanMan] này đang viết về #EMP việc ăn thịt người#!!""
  fund_inspiration.3001.desc_torturer:0 ""[inspiration_owner.GetWomanMan] này đang viết về những hành vi không thể nói thành lời, đầy dã man!"
  fund_inspiration.3001.desc_lustful:0 ""[inspiration_owner.GetWomanMan] này đang viết về những hành vi không thể nói thành lời, đầy đồi bại!"
  fund_inspiration.3001.desc_other:0 ""[inspiration_owner.GetWomanMan] này đang viết về những điều bất kính!"
  fund_inspiration.3001.desc_ending:0 "Lại còn có cả minh họa nữa! Ta chỉ có thể cho rằng ngài không hề biết chuyện này, [ROOT.Char.Custom('FormOfAddressForLiege')]."\n\n[inspiration_owner.GetTitledFirstNameNoTooltip] hừ mũi khinh thường và lại lao tới giành giấy, nhưng [court_chaplain.Custom('CouncilPosition')] của ta né được.\n\n"Nhưng giờ khi kẻ viết lách ghê tởm này đã bị phơi bày, chắc hẳn ngài sẽ hiến dâng cuốn sách này cho [ROOT.Char.GetFaith.HighGodName], như lẽ phải đạo.""
  fund_inspiration.3001.a:0 "Dĩ nhiên; ta không hề biết [inspiration_owner.GetSheHe] đang viết về những thứ như vậy."
  fund_inspiration.3001.a_tt:0 "[inspiration_owner.GetShortUIName] sẽ viết về đức tin thay vì [inspiration_owner.Custom('ArtifactBookSubject')]"
  fund_inspiration.3001.b:0 "Ngươi biết điều gì mới là đúng mực không? Rời xa [inspiration_owner.GetHerHim] ngay đi!"
  fund_inspiration.3001.c:0 "Mấy bức minh họa trông nhạt nhẽo quá… Cầm số vàng này mua mực mới đi."

  fund_inspiration.3011.t:0 "$fund_inspiration.title$ Chủ Đề Quân Sự"
  fund_inspiration.3011.desc_opening_1:0 "Ta bắt gặp [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] bị vây quanh bởi các cuộn giấy và bản thảo, điên cuồng lật giở từng trang.\n\n"
  fund_inspiration.3011.desc_opening_2:0 "Ta bắt gặp [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] bị vây quanh bởi các cuộn giấy và bản thảo, đầu vùi trong [inspiration_owner.GetHerHis] đôi tay.\n\n"
  fund_inspiration.3011.desc_opening_3:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me with [inspiration_owner.GetHerHis] arms full of scrolls and manuscripts.\n\n"
  fund_inspiration.3011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Có quá nhiều lĩnh vực chiến tranh xứng đáng được quan tâm. Chiến lược, đội hình quân, bản thân trận chiến... Ta thậm chí không biết nên bắt đầu từ đâu!""
  fund_inspiration.3011.a:0 "Ta muốn cuốn sách mang tính giáo dục hoặc hữu ích cho quân đội."
  fund_inspiration.3011.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as strategy and troop compositions"
  fund_inspiration.3011.b:0 "Có lẽ là thứ gì đó gợi đến những khía cạnh cao quý hơn của chủ đề."
  fund_inspiration.3011.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as chivalry and prowess"
  fund_inspiration.3011.d:0 "Nàng thơ của ngươi khao khát chủ đề nào?"
  fund_inspiration.3011.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] sẽ tự do quyết định chủ đề của cuốn sách"

  fund_inspiration.3012.t:0 "$fund_inspiration.title$ Chủ Đề Ngoại Giao"
  fund_inspiration.3012.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Có quá nhiều lĩnh vực ngoại giao xứng đáng được quan tâm. Ứng xử nơi triều đình, các mối quan hệ, #EMP thơ ca#!... Ta thậm chí không biết nên bắt đầu từ đâu!""
  fund_inspiration.3012.a:0 "Có lẽ là thứ gì đó liên quan đến cuộc sống nơi triều đình."
  fund_inspiration.3012.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as alliances and eloquence"
  fund_inspiration.3012.b:0 "Ta muốn cuốn sách mang tính giải trí!"
  fund_inspiration.3012.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as adventure and entertainment"

  fund_inspiration.3013.t:0 "$fund_inspiration.title$ Chủ Đề Học Thuật"
  fund_inspiration.3013.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Có quá nhiều lĩnh vực xứng đáng được quan tâm. Tôn giáo, giáo dục... Chưa kể đến nghệ thuật viết lách!""
  fund_inspiration.3013.a:0 "Công trình này nên phụng sự [ROOT.Char.GetFaith.HighGodName]!"
  fund_inspiration.3013.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as theology and prayers"
  fund_inspiration.3013.b:0 "Ta muốn cuốn sách mang tính giáo dục, hoặc ít nhất là giải trí!"
  fund_inspiration.3013.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as history and poetry"

  fund_inspiration.3014.t:0 "$fund_inspiration.title$ Chủ Đề Quản Trị"
  fund_inspiration.3014.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Có quá nhiều lĩnh vực quản trị xứng đáng được quan tâm. Luật pháp, thương mại, #EMP tiền bạc#!... Ta thậm chí không biết nên bắt đầu từ đâu!""
  fund_inspiration.3014.a:0 "Hãy tập trung vào những vấn đề liên quan đến việc cai trị lãnh thổ."
  fund_inspiration.3014.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as law and administration"
  fund_inspiration.3014.b:0 "Ta quan tâm đến phát triển!"
  fund_inspiration.3014.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as buildings and taxation"

  fund_inspiration.3015.t:0 "$fund_inspiration.title$ Chủ Đề Mưu Lược"
  fund_inspiration.3015.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Có quá nhiều lĩnh vực mưu lược xứng đáng được quan tâm. Âm mưu, quyến rũ, thao túng... Ta thậm chí không biết nên bắt đầu từ đâu!""
  fund_inspiration.3015.a:0 "Ta muốn đi trước #EMP tất cả mọi người#!!"
  fund_inspiration.3015.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as scheming and manipulation"
  fund_inspiration.3015.b_men:0 "Ta muốn đàn ông quỳ rạp dưới chân ta!"
  fund_inspiration.3015.b_women:0 "Ta muốn phụ nữ quỳ rạp dưới chân ta!"
  fund_inspiration.3015.b_both:0 "Ta muốn tất cả mọi người đều khao khát ta!"
  fund_inspiration.3015.b_none:0 "Ta muốn làm chủ nghệ thuật quyến rũ."
  fund_inspiration.3015.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] will focus [inspiration_owner.GetHerHis] writing on topics such as lust and the art of seduction"

  fund_inspiration.3030.t:0 "$fund_inspiration.title$ Làm nguội hận thù"
  fund_inspiration.3030.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã mời Ta đến bàn luận về chủ đề cuốn sách mà [inspiration_owner.GetSheHe] đang viết cho Ta.\n\n"
  fund_inspiration.3030.desc:0 ""Ta không thể không nhận ra sự thù địch giữa ngươi và [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] đang dần nguội lạnh. Ngươi vẫn muốn dành cuốn sách này cho mối hận thù mà ngươi dành cho [prev_nemesis.GetHerHim] chứ?""
  fund_inspiration.3030.desc_dead:0 ""Giờ đây khi [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] đã qua đời, ngươi vẫn muốn dành cuốn sách này cho mối hận thù mà ngươi từng dành cho [prev_nemesis.GetHerHim] chứ?""
  fund_inspiration.3030.a:0 "Mối hận thù ta cảm thấy vẫn chưa nguội đến thế."
  fund_inspiration.3030.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] tiếp tục viết về mối hận thù của ngươi đối với [prev_nemesis.GetTitledFirstName]"
  fund_inspiration.3030.b:0 "[prev_nemesis.GetSheHe|U] không đáng để tốn công sức."

  fund_inspiration.3031.t:0 "$fund_inspiration.title$ Tình yêu phai tàn"
  fund_inspiration.3031.desc:0 ""Ta không thể không nhận ra rằng [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)] không còn nằm trong #EMP ân sủng cao nhất#! của ngươi nữa, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ngươi vẫn muốn dành cuốn sách này cho tình yêu mà ngươi dành cho [prev_soulmate.GetHerHim] chứ?""
  fund_inspiration.3031.desc_dead:0 ""Nỗi đau mất đi [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)] hẳn vẫn còn rất mới mẻ... Ngươi vẫn muốn dành cuốn sách này cho tình yêu mà ngươi từng dành cho [prev_soulmate.GetHerHim] chứ?""
  fund_inspiration.3031.a:0 "Tình yêu là gì nếu thiếu đi khát khao và mất mát?"
  fund_inspiration.3031.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] tiếp tục viết về tình yêu mà ngươi đã chia sẻ cùng [prev_soulmate.GetTitledFirstName]"
  fund_inspiration.3031.b:0 "[prev_soulmate.GetSheHe|U] không đáng để tốn công sức."

  fund_inspiration.4001.t:0 "$fund_inspiration.title$ Sợi dọc và sợi ngang"
  fund_inspiration.4001.desc:0 ""[inspiration_owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] #EMP ruined#! my new garb!"\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] storms into the room, followed by the weaver. The piece of clothing [courtier.GetSheHe] holds in [courtier.GetHerHis] hands is so badly cut up that I cannot tell what it once was.\n\n"You're overreacting! I was simply studying the weave of the fabric, it's important for my project.""
  fund_inspiration.4001.a:0 "Ngươi đi quá xa rồi đấy, nếu cần thì hãy nghiên cứu quần áo của chính mình!"
  fund_inspiration.4001.b:0 "Nếu [inspiration_owner.GetSheHe] nói là cần thiết thì tức là cần thiết."

 # Weaver is being too much of a modernist 
  fund_inspiration.4010.t:1 "$fund_inspiration.title$ Bố cục trong sắc Đỏ, Lam và [ROOT.Char.GetTitleAsNameNoTooltip|U]"
  fund_inspiration.4010.desc:0 "Ta ghé qua xưởng của người thợ dệt để xem tấm thảm của mình tiến triển đến đâu. Bên trong có vài cận thần. Tất cả họ đều đang quan sát các bức tường, tay chắp sau lưng. Những tấm thảm được trưng bày là những mảng màu kỳ quặc. Một tấm có những vệt loang lổ vụng về. Một tấm thì trắng toát với vài hình vuông. Một tấm khác là những đường xoắn rối rắm. Đây rốt cuộc là thứ nghệ thuật gì?\n\n[artistic_courtier_1.GetTitledFirstNameNoTooltip] chỉ vào một phần trông như vết bẩn. "Chẳng phải màu nâu bẩn thỉu này trên nền trắng thực sự gợi lên bạo lực bẩm sinh của con người sao?"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] gật đầu. "Ta nghĩ nó thể hiện [inspiration_owner.GetTitledFirstNameNoTooltip] đang phẫn nộ với tuổi thơ của [inspiration_owner.GetHerHis] — trông nó giống hình dạng mẹ của [inspiration_owner.GetHerHis].""
  fund_inspiration.4010.a:0 "Gật đầu thấu hiểu và khen ngợi nghệ sĩ"
  fund_inspiration.4010.b:0 ""Kinh tởm! Ta phải đi xem chút nghệ thuật truyền thống mới được.""
  fund_inspiration.4010.b.tt:0 "Khoản đầu tư của ngươi được hoàn lại và tác phẩm bị hủy"
  fund_inspiration.4010.c:0 ""[child.GetTitledFirstNameNoTooltip] cũng làm được thế này!""

  fund_inspiration.5011.desc:0 ""The time has come for me to depart upon my adventure, my [ROOT.Char.GetTitleTierName]." [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bows as well as [inspiration_owner.GetSheHe] can while weighted down by heavy bags.\n\n"Before I leave, please tell me, is there anything specific you want me to keep an eye peeled for during my journey?""
  fund_inspiration.5011.a:0 "Mang về cho ta thứ gì đó từ một loài thú ngoại lai, như hộp sọ hay da thú."
  fund_inspiration.5011.b:0 "Ta muốn một món đồ nhỏ được làm từ vật liệu mà ở đây không có."
  fund_inspiration.5011.c:0 "Một tấm thảm, hoặc tác phẩm nghệ thuật khiến ta ước gì mình đã ở đó."
  fund_inspiration.5011.d:0 "Ta tin vào bản năng của ngươi, hãy mang về cho ta thứ gì đó vĩ đại."
  fund_inspiration.5011.e:0 "Ta muốn sở hữu một thứ thực sự độc nhất vô nhị!"

  fund_inspiration.5021.t:0 "$fund_inspiration.title$ Thay đổi hướng đi"
  fund_inspiration.5021.desc:1 "Một lữ khách tự nhận là làm việc dưới trướng [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] được đưa đến trước mặt ta, mang theo một thông điệp từ nhà thám hiểm.\n\n"Xin đừng lo lắng, thưa [ROOT.Char.GetLadyLord] vĩ đại của Ta, [inspiration_owner.GetTitledFirstNameNoTooltip] vẫn khỏe mạnh. Ta mang đến cho ngài tin tức về khả năng tài trợ cho một chuyến phiêu lưu còn vĩ đại hơn nữa! Ngài thấy đấy, [inspiration_owner.GetTitledFirstNameNoTooltip] đã rẽ nhầm đâu đó và hiện đang ở gần [adventuring_location.GetNameNoTier]."\n\nNgài đồng hành của [inspiration_owner.GetFirstNamePossessiveNoTooltip] trải ra một tấm bản đồ bẩn thỉu để chỉ cho ta nơi họ đã đến. "[inspiration_owner.GetSheHe|U] có đủ ngân quỹ để đến [inspiration_owner.Custom('InspirationAdventureDestination')], như đã dự định, nhưng đề xuất rằng với một khoản tài trợ bổ sung, [inspiration_owner.GetSheHe] có thể theo đuổi một tin đồn địa phương và mang về một cổ vật vĩ đại!""
  fund_inspiration.5021.a:0 "Thật nực cười! Ta sẽ không tài trợ cho chuyến đi #EMP tự thỏa mãn# này đâu!!"
  fund_inspiration.5021.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] returns to what [inspiration_owner.GetSheHe] set out to do."
  fund_inspiration.5021.b:0 "Cuộc sống là một cuộc phiêu lưu, hãy khám phá khu vực đó để tìm cổ vật!"
  fund_inspiration.5021.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] khám phá [adventuring_location.GetNameNoTierNoTooltip]."

## Postcards from your Adventurer by Isabella Welch

#Steppe

  fund_inspiration.6001.t:0 "Thảo nguyên và nhịp phi nước đại xuyên qua tim ta,"
  fund_inspiration.6001.desc:1 "Ta đã rong ruổi cưỡi ngựa suốt nhiều tháng liền. Cái mông của ta chắc chẳng bao giờ hồi phục nổi! Ta đã quen dần với sữa ngựa cái lên men và những đêm dưới bầu trời rộng mở.\n\nTheo người đưa tin này, ta gửi đến ngài một đầu chạm khắc của Morin Khuur — phần đầu ngựa trang trí đặt trên đỉnh nhạc cụ. Có lẽ ngài sẽ dùng đến nó."
  fund_inspiration.6001.a:0 "Ta sẽ giữ lại thứ này!"
  fund_inspiration.6001.b:0 "Gửi nó cho Nhạc công Triều đình."

#India

  fund_inspiration.6002.t:0 "Chuyến dạo chơi của ta qua Ấn Độ vẫn đang tiếp diễn!"
  fund_inspiration.6002.desc:0 "Ta gần như bị làm mù bởi vô số đá quý mà các triều đình ta ghé thăm khoe ra. Ta bỗng thấy khao khát cái nhơ nhớp của con đường rộng mở.\n\nTa đã cử một người đưa tin mang theo một món quà đặc biệt phản cảm mà ta được tặng — một chiếc nhẫn gắn đầu hổ làm đồ trang trí, với đôi mắt là đá quý. Ngài đã từng thấy thứ gì lòe loẹt đến thế chưa?"
  fund_inspiration.6002.a:0 "Ta khá thích nó, đó là mất mát của hắn."
  fund_inspiration.6002.b:0 "Kinh khủng! Tháo ra và bán đá quý đi."

#Africa

  fund_inspiration.6003.t:0 "Ta mơ về sa mạc,"
  fund_inspiration.6003.desc:0 "Chủ thượng của ta, hành trình đến châu Phi của ta đã bắt đầu, và ta đã gia nhập một đoàn lạc đà băng qua chiều rộng của vùng đất.\n\nTa gửi đến ngài một món trang sức mà một Ngài đồng hành trên đường đã tặng ta — một chiếc vòng cổ tinh xảo phủ đầy hạt vỏ trứng đà điểu. Ta đoán ngài chưa từng thấy đà điểu bao giờ."
  fund_inspiration.6003.a:0 "Một phát hiện tuyệt vời! Ta sẽ tự mình đeo nó."
  fund_inspiration.6003.b:1 "Ta sẽ tặng nó cho [event_spouse.GetTitledFirstNameNoTooltip]."

#Middle East

  fund_inspiration.6004.t:0 "À, được làm kẻ hành hương,"
  fund_inspiration.6004.desc:0 "Hành trình của ta qua Trung Đông chủ yếu là phải chống chọi với những đám người bán hàng rong trên các con đường hành hương.\n\nThường thì để không làm chậm trễ quá lâu hành trình của mình, ta đành nhượng bộ và mua một trong những món đồ lặt vặt của họ. Ta đã gửi một người đưa tin mang đống đồ vặt ấy đến cho ngài. Có lẽ nó sẽ mang lại chút giải trí."
  fund_inspiration.6004.a:0 "Một kẻ phiêu lưu đi theo lối mòn thì có ích gì?"
  fund_inspiration.6004.b:0 "Những món trang sức này cũng khá xinh..."

#Europe

  fund_inspiration.6005.t:0 "Những cuộc phiêu lưu của ta thật ẩm ướt,"
  fund_inspiration.6005.desc:0 "[ROOT.Char.Custom('FormOfAddressForLiege')|U], cho đến giờ ta đã tìm được vài di vật tầm thường trong các chuyến phiêu lưu và đã gửi theo người đưa tin này, nhưng ta không chắc tiếp theo mình sẽ phát hiện ra điều gì.\n\nNgười châu Âu là những sinh vật hôi hám nhất ta từng gặp. Khi còn nhỏ, ta từng mơ về những đồng cỏ xanh mướt và êm đềm, nhưng giờ ta tin rằng một nửa thế giới này được làm từ bùn đất. Nếu ngài là một chủ thượng nhân từ, xin hãy gửi lời gọi ta trở về."
  fund_inspiration.6005.a:0 "Đây đâu phải kỳ nghỉ! Tiếp tục nhiệm vụ!"
  fund_inspiration.6005.b:0 "Tội nghiệp thay, ta đoán những phần thưởng này cũng đủ rồi."
  fund_inspiration.6005.b.tt:0 "Ngươi cho phép [inspiration_owner.GetTitledFirstName] trở về nhà"

#Asia minor

  fund_inspiration.6006.t:0 "Lời chào từ Anatolia,"
  fund_inspiration.6006.desc:0 "Những chuyến du hành khắp Tiểu Á đã khiến ta đặc biệt yêu thích thịt cừu, sữa chua và cà tím, và ta đã gửi kèm vài công thức nấu ăn theo người đưa tin này.\n\nTa còn được một chủ nhà tặng cho một chiếc ghim cài vàng trang trí hình cá ngựa, và cũng gửi nó đến cho ngài. Ta chắc chắn rằng những chuyến đi của mình sẽ còn mang đến nhiều điều kỳ diệu nữa theo thời gian."
  fund_inspiration.6006.a:0 "Ra lệnh cho đầu bếp của chúng ta chuẩn bị những món này ngay lập tức!"
  fund_inspiration.6006.b:0 "[inspiration_owner.GetSheHe|U] dường như đang quá vui vẻ trong nhiệm vụ này..."

# Miniature furniture events by Isabella Welch

#Artisan gives you a tiny chest and loses the tiny key
  fund_inspiration.6100.t:1 "$fund_inspiration.title$ Một vị quân chủ thu nhỏ"
  fund_inspiration.6100.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gleefully grabs my attention. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], I've completed a miniature prototype of the chest you commissioned, complete with a working lock."\n\n[inspiration_owner.GetSheHe|U] holds out [inspiration_owner.GetHerHis] palm, and atop it is a tiny chest, complete with gold leaf and a key as small as a piece of grain.\n\n"There is a gemstone inside, try it for yourself." As [inspiration_owner.GetSheHe] hands it over, the key slips between [inspiration_owner.GetHerHis] fingers and goes flying. Scrabble though [inspiration_owner.GetSheHe] does, there is no sign of it."
  fund_inspiration.6100.a:0 "Kết thúc trò hề này đi, đập vỡ cái rương và trả lại viên đá của ta!"
  fund_inspiration.6100.b:0 "Dù sao thì nó vẫn rất duyên dáng, ta nghĩ ta sẽ giữ lại."

 # The tiny box

  fund_inspiration.6101.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chìa ra một chiếc hộp tí hon, với những hoa văn chạm khắc mảnh như sợi tóc tinh xảo nhất. \"Nguyên mẫu cho đơn đặt hàng mới nhất của ngài. Ta không muốn nó bị lãng phí. Chúng ta có thể tìm một công dụng cho vật đáng yêu này.\"\n\n[antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sáng bừng lên. \"Chúng ta có thể đặt một di vật của thời đại mình vào trong đó rồi chôn ở đâu đó — tạo ra một kỷ vật cho con cháu tương lai khai quật!\""
  fund_inspiration.6101.a:0 "Ta sẽ cất một bức chân dung thu nhỏ của chính mình vào trong."
  fund_inspiration.6101.b:0 "Ta sẽ viết một bài thơ tí hon và niêm phong nó bên trong."
  fund_inspiration.6101.c:0 "Ta thà tự mình giữ lấy nó."

# Stepping on the tiny sculpture

  fund_inspiration.6102.desc:0 "Ta đang chuẩn bị lên giường nghỉ ngơi cho đêm thì một cơn đau buốt chạy dọc bàn chân.\n\nKhi kiểm tra, ta phát hiện một bức tượng thu nhỏ cắm sâu vào da lòng bàn chân, với chính đôi chân của nó thò ra ngoài.\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lấm lét nhìn ta từ khung cửa gần nhất. \"Ta xin lỗi, đó là nguyên mẫu cho đơn đặt hàng mới nhất của ngài. Hẳn là ta đã làm rơi nó.\""
  fund_inspiration.6102.a:0 "\"Kéo nó ra và tống khỏi tầm mắt ta ngay!\""
  fund_inspiration.6102.b:0 "\"Gọi thầy thuốc đến xử lý việc này.\""
  fund_inspiration.6102.c:0 "Tự kéo nó ra và bỏ túi."
  fund_inspiration.6102.cure_toast:0 "Tượng thu nhỏ được lấy ra an toàn"
  fund_inspiration.6102.failure_toast:0 "Bức tượng cứng đầu"
  fund_inspiration.6102.failure_toast_desc:0 "Một mảnh cánh tay bị mắc kẹt sâu trong bàn chân của ngươi"

# Being shown the tiny cabinet


  fund_inspiration.6103.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cúi chào. \"Ta rất mong được nghe lời phê bình về chiếc tủ mà ta đang chế tác cho ngài, [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\n[inspiration_owner.GetSheHe|U] dẫn ta đến nơi làm việc của [inspiration_owner.GetHerHis], nơi đáng lo ngại là chỉ có một chiếc tủ cũ kỹ, bụi bặm và sứt mẻ.\n\n\"Ồ, đó không phải là tác phẩm.\" [inspiration_owner.GetSheHe|U] mở chiếc tủ rách nát ra, và bên trong không có gì ngoài một mô hình tủ tí hon — tinh xảo, gắn đá và mạ vàng nhưng chỉ cao chừng một ngón tay ta. \"Ngài thấy sao?\""
  fund_inspiration.6103.a:0 "Vì lợi ích của ngươi, tốt hơn hết đây chỉ nên là nguyên mẫu."
  fund_inspiration.6103.b:0 "Ồ, hoàn hảo quá! Ta yêu nó!"

# Artisan gives you the tiny throne

  fund_inspiration.6104.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mang đến cho ta một chiếc hộp nhỏ, và trình nó trước mặt ta với một nụ cười.\n\nKhi mở món quà, ta mong đợi một viên ngọc, chiếc nhẫn hay tác phẩm chạm khắc nào đó, nhưng thật bất ngờ, bên trong lại là một ngai vàng thu nhỏ, bé đến mức chỉ một con chuột mới có thể ngồi lên.\n\n\"Nguyên mẫu cho ngai vàng mới của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta nghĩ nó sẽ khiến ngài thích thú.\""
  fund_inspiration.6104.a:0 "Thật duyên dáng! Ta sẽ giữ lại thứ này!"
  fund_inspiration.6104.b:0 "Tốt thôi, nhưng hãy tiếp tục dự án đi."
  fund_inspiration.6104.c:0 "Ta #EMP quá#! trưởng thành để chơi đồ chơi."

 # Artisan and ROOT play with their miniatures
 
  fund_inspiration.6105.desc:1 "Ta đang tự hào mang theo chiếc hộp đồ nội thất thu nhỏ của mình qua [ROOT.Char.Custom('FortifiedBuilding')], tự hỏi nên trưng bày chúng ở đâu cho hợp, thì va phải [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nKhi [inspiration_owner.GetSheHe] nhìn vào bên trong chiếc hộp, [inspiration_owner.GetSheHe] lau đi một giọt nước mắt nơi khóe mắt [inspiration_owner.GetHerHis]. \"Một [ROOT.Char.GetWomanMan] có gu thẩm mỹ, hãy đi cùng ta.\"\n\n[inspiration_owner.GetSheHe|U] dẫn ta đến xưởng của [inspiration_owner.GetHerHis] và lôi ra một chiếc rương bí mật. Bên trong là hàng chục mảnh cảnh vật, nhân vật và địa hình thu nhỏ. \"Ta đã phát minh ra một trò chơi — một trận vây hãm tưởng tượng. Ngài có muốn tham gia cùng ta không?\""
  fund_inspiration.6105.a:0 "Ta cứ tưởng ngươi sẽ không bao giờ hỏi!"
  fund_inspiration.6105.b:0 "Ờ, có lẽ để dịp khác."

# Weaver is being too much of a modernist 
  fund_inspiration.6200.t:1 "$fund_inspiration.title$ Bố cục trong sắc Đỏ, Lam và [ROOT.Char.GetTitleAsNameNoTooltip|U]"
  fund_inspiration.6200.desc:2 "Ta ghé qua xưởng của người thợ dệt để xem tấm thảm của mình tiến triển đến đâu. Bên trong có vài cận thần. Tất cả họ đều đang quan sát các bức tường, tay chắp sau lưng. Những tấm thảm được trưng bày là những mảng màu kỳ quặc. Một tấm có những vệt loang lổ vụng về. Một tấm thì trắng với vài hình vuông. Một tấm khác là những đường xoắn rối rắm. Đây rốt cuộc là thứ nghệ thuật gì?\n\n[artistic_courtier_1.GetTitledFirstName] chỉ vào một phần trông như vết bẩn. \"Chẳng phải màu nâu bẩn thỉu này trên nền trắng thực sự gợi lên bạo lực bẩm sinh của con người sao?\"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] gật đầu. \"Ta nghĩ nó cho thấy [ROOT.Char.GetTitledFirstNameNoTooltip] đang phẫn nộ với tuổi thơ của [ROOT.Char.GetHerHis] — trông nó giống hình dạng mẹ của [ROOT.Char.GetHerHis].\""
  fund_inspiration.6200.a:0 "Gật đầu thấu hiểu và khen ngợi nghệ sĩ"
  fund_inspiration.6200.b:0 "\"Kinh tởm! Ta phải đi xem chút nghệ thuật truyền thống mới được.\""
  fund_inspiration.6200.b.tt:0 "Khoản đầu tư của ngươi được hoàn lại và tác phẩm bị hủy"
  fund_inspiration.6200.c:0 "\"[child.GetTitledFirstNameNoTooltip] cũng làm được thế này!\""


#Poet is uninspired, does not feel they understand love at the moment by Isabella Welch

  fund_inspiration.6300.t:0 "$fund_inspiration.title$ Khổ thơ bất hạnh"
  fund_inspiration.6300.intro:0 "I happen upon [inspiration_owner.GetTitledFirstName] at [inspiration_owner.GetHerHis] desk, staring out the window with many blotted-out drafts before [inspiration_owner.GetHerHim].\n\n"
  fund_inspiration.6300.no_relationship_desc:0 ""Ý nghĩ rằng có ai đó yêu ta là điều không thể. Chưa một lần nào ta thì thầm những lời cảm xúc với ai và được đáp lại."\n\n"Vì vậy ta đã không viết cho ngài — ta chỉ đếm những buổi tối kể từ lần cuối ta nằm bên ai đó và tuyệt vọng.""
  fund_inspiration.6300.no_love_desc:0 ""Dù thông thường chẳng có gì khiến ta hứng khởi hơn chữ nghĩa, nhưng thật đáng kinh ngạc là hiện tại ta hoàn toàn không có chút cảm xúc nồng nhiệt nào."\n\n"Thứ lỗi cho ta, [ROOT.Char.Custom('FormOfAddressForLiege')], ta không thể viết về tình yêu, nàng thơ đã bỏ rơi ta.""
  fund_inspiration.6300.homosexual_desc:0 ""À, [ROOT.Char.Custom('FormOfAddressForLiege')]. Dù ta đã dành rất nhiều giờ cố gắng sáng tác một tác phẩm lãng mạn xứng đáng với sự bảo trợ của ngài, ta nhận ra mình chẳng làm gì ngoài việc khóc trên trang giấy."\n\n"Ngài yêu cầu ta làm điều bất khả thi. Tình yêu của ta là một dạng không thể được viết ra.""
  fund_inspiration.6300.a:0 "Tốt! Hãy dẫn dòng cơn phẫn u uất ấy!"
  fund_inspiration.6300.a.failure:0 "Ngươi khiến [inspiration_owner.GetShortUIName] căm ghét tình yêu."
  fund_inspiration.6300.a.success:0 "Ngươi thuyết phục [inspiration_owner.GetShortUIName] viết về tình yêu."
  fund_inspiration.6300.b:0 "Ừ thì, ta còn nửa giờ rảnh."
  fund_inspiration.6300.c:0 "Không thể nào! Sao thế gian lại không thấy được sức quyến rũ trong tài hùng biện của ngươi?"
  fund_inspiration.6300.d:0 "Nhưng đó là một tình yêu để sống trọn."
  fund_inspiration.6300.e:0 "Hãy viết sự thật của ngươi, ta chúc phúc cho mọi nàng thơ."
  fund_inspiration.6300.f:0 "Bịa ra đi! Tất cả những kẻ viết về tình yêu đều là đồ lừa đảo."

#Poet sends you a book on same sex love if you requested it, as a side project by Isabella Welch

#fund_inspiration.6301.lover_t: "My [ROOT.Custom('LoverPetName')],"
#fund_inspiration.6301.friend_t: "My dearest ally,"
  fund_inspiration.6301.t:0 "$fund_inspiration.title$ Người Ngài đồng hành thân mến của ta,"
  fund_inspiration.6301.lover_desc:0 "Đêm ngài bảo ta viết từ trái tim mình, ta nhận ra ta chỉ có thể viết về ngài. Hãy để ta đóng vai kẻ phản diện, nếu đức tin gọi kiểu tình yêu của chúng ta là tội lỗi."
  fund_inspiration.6301.friend_desc:0 "Ta chưa bao giờ cảm thấy ngôn từ tuôn chảy như sau khi ngài bảo ta viết một câu chuyện tình yêu đúng như cách ta trải nghiệm nó."
  fund_inspiration.6301.female_desc:0 "\n\nĐây là một bài thơ về một phù thủy đem lòng yêu một nữ vương, người rồi bị lạc trong lùm cây gần căn nhà của nàng."
  fund_inspiration.6301.male_desc:0 "\n\nĐây là một khúc ballad về một hoàng tử mỗi đêm ngắm sao cùng người thủ thư yêu dấu trên đỉnh tháp thư viện, mơ về việc yêu nhau nơi thiên giới."
  fund_inspiration.6301.crime_desc:0 "Một tội lỗi đẹp đẽ làm sao."
  fund_inspiration.6301.a:0 "Ta sẽ trân trọng nó, nhưng giữ kín."
  fund_inspiration.6301.b:0 "Mặc kệ thế gian, ta sẽ sắp xếp một buổi đọc!"
# Adventurer hasn't actually gone on the adventure!
  fund_inspiration.6400.t:1 "$fund_inspiration.title$ Cuộc nhậu xuyên quán"
  fund_inspiration.6400.desc:0 "On a visit to the tavern in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], I spy one of the patrons at the heart of all attention.\n\n[inspiration_owner.GetSheHe|U] is more grizzled than the rest of the patrons, and smells as if [inspiration_owner.GetSheHe] has been there for an age. To my horror, I recognize my adventurer, [inspiration_owner.GetTitledFirstName], who appears not to have made it out of the homeland after months of funding!\n\n"And for my next journey, I shall cross the Red Sea in a single gulp!" [inspiration_owner.GetSheHe] promptly scoffs an entire glass of red wine and cheering rings through the drinking-hall."
  fund_inspiration.6400.a:0 "Cút khỏi đây và lên đường ngay!"
  fund_inspiration.6400.b:0 "Tên lừa đảo! Ta sẽ không trả thêm đồng nào cho rượu của ngươi!"
  fund_inspiration.6400.a.success:0 "You convince the adventurer to pull [inspiration_owner.GetHerselfHimself] together"
  fund_inspiration.6400.a.success_continue:0 "Cuộc phiêu lưu tiếp diễn!"
  fund_inspiration.6400.a.failure:0 "Nhà phiêu lưu ôm vàng bỏ trốn!"

  fund_inspiration.6500.t:0 "$fund_inspiration.title$ Mang âm nhạc vào rừng rậm"
  fund_inspiration.6500.introduction:0 "Ta nhận được một bức thư từ nhà phiêu lưu của mình, với những lời lẽ trau chuốt đến mức ta có thể thấy [inspiration_owner.GetHerHim] hiện lên trong tâm trí như một sân khấu."
  fund_inspiration.6500.desc:0 "\n\n'Ta đã lội bộ trong rừng rậm. Tiếng chim gọi dội thẳng vào đầu ta, và ta thấy đó quả là một khúc ai ca đáng sợ. Vài cư dân nơi đây nói rằng họ thấy đó là thứ âm nhạc dễ chịu nhất. Rõ ràng họ chưa từng nghe tác phẩm của [court_musician.GetTitledFirstNameNoTooltip].\n\n'Ta thử chơi một giai điệu của [court_musician.GetHerHis] trên một cây sáo sậy của họ, và dân địa phương liền đuổi ta khỏi làng rồi rạch ta bằng một lưỡi dao tẩm độc. Dù sống sót, ta nghĩ rằng \"nếu ta chết vì mang nhạc thính phòng vào rừng rậm, thì cũng đành!\""
  fund_inspiration.6500.action:0 "\n\n'Ngài hẳn có thể tưởng tượng ta đã làm gì tiếp theo...'"
  fund_inspiration.6500.a:0 "Ngươi bắt đầu hát, và chinh phục họ!"
  fund_inspiration.6500.b:0 "Ngươi chạy trốn đến những vùng đất văn minh hơn."
  fund_inspiration.6500.c:0 "Một con mãnh thú lao ra chắn giữa ngươi và kẻ tấn công!"
  fund_inspiration.6500.a.success:0 "Nhà phiêu lưu quyến rũ cư dân rừng rậm"
  fund_inspiration.6500.a.failure:0 "Nhà phiêu lưu chọc tức cư dân rừng rậm"
  fund_inspiration.6500.b.success:0 "Nhà phiêu lưu thoát thân"
  fund_inspiration.6500.b.failure:0 "Nhà phiêu lưu không chạy đủ nhanh"
  fund_inspiration.6500.c.tt:0 "Nhà phiêu lưu giúp đánh đuổi con báo"
  fund_inspiration.6500.c.tt_failure:0 "Nhà phiêu lưu bị thương khi cố chạy trốn"

  fund_inspiration.6501.t:0 "$fund_inspiration.title$ Hành trình trên đất liền"
  fund_inspiration.6501.desc:1 "\n\n'Chúng ta đã chèo thuyền ngược sông giữa những ngọn đồi uốn lượn. Sau một đợt hạn hán, người dân địa phương nói rằng con sông chúng ta đi theo đã cạn nước phía trước mũi thuyền.\n\n'Thay vì bỏ cuộc hay quay đầu, chúng ta thử làm điều không tưởng. Ta ra lệnh cho thủy thủ đoàn xây dựng một hệ thống đường ray và ròng rọc, rồi bắt đầu kéo con thuyền băng qua đất liền về phía con sông kế tiếp. Nó như đang lướt trên một biển cỏ và cúc."
  fund_inspiration.6501.a:0 "Ta hy vọng ngươi đã quay lại và cắt lỗ."
  fund_inspiration.6501.b:0 "Con thuyền vừa đủ sống sót qua chuyến đi."
  fund_inspiration.6501.b.success:0 "Nhà phiêu lưu kéo thuyền vượt vách đá"
  fund_inspiration.6501.b.failure:0 "Nhà phiêu lưu mắc kẹt sửa thuyền hỏng"
  fund_inspiration.6501.c:0 "Người dân địa phương động lòng, và bán cho ngươi một con thuyền mới với giá ưu đãi."

  fund_inspiration.6502.t:0 "$fund_inspiration.title$ Cơn khát thiêu đốt"
  fund_inspiration.6502.desc:0 "\n\n'Ta không ở sa mạc, ta ở xứ sở của những giấc mơ. Ranh giới giữa thức và ngủ đã biến mất. Người dẫn đường nói rằng ta đang ảo giác về thứ ta khao khát nhất. Một thiên đường, một vũng nước lấp lánh như kim cương, bờ rải đầy châu báu.\n\n'Thế nhưng, [ROOT.Char.Custom('FormOfAddressForLiege')], tất cả những gì ta thấy chỉ là ngài ở đây cùng ta. Mãi mãi ở phía trước một doi cát. Vẫy gọi ta tiếp tục. Và điều đó khiến ta tan nát khi biết rằng mỗi bước ta tiến về ảo ảnh ấy, ta lại rời xa con người thật của ngài thêm một bước.'"
  fund_inspiration.6502.a:0 "Ồ, ta cũng thấy khát, dù không ở sa mạc."
  fund_inspiration.6502.b:0 "Ta có thể cân nhắc sự chú ý của ngươi, nếu ngươi mang về một giải thưởng vĩ đại."
  fund_inspiration.6502.c:0 "Ta đổ lỗi cho cái nóng, và đốt những dòng chữ này."

  fund_inspiration.6503.t:0 "$fund_inspiration.title$ Lời thì thầm Pontic"
  fund_inspiration.6503.desc:0 "\n\n'Ta đã thám hiểm một Kurgan, gò chôn cất cổ từ thời Scythia. Hàng trăm con ngựa đã chết từ lâu, được nhồi, bảo quản và đóng cọc dựng đứng sát tường, mỗi con có một gian riêng. Đó là một chuồng ngựa cho kẻ bị nguyền rủa, lạc mất trong thời gian.\n\n'Nhớ đến bổn phận tìm kiếm tri thức cho vương quốc, ta đã cân nhắc việc đánh cắp một thánh vật từ ngôi mộ khi người dẫn đường không để ý, để mang về cho ngài."
  fund_inspiration.6503.a:0 "Ngươi bỏ túi một món đồ trang trí."
  fund_inspiration.6503.b:0 "Ngươi mang về một chiếc yên ngựa để nghiên cứu."
  fund_inspiration.6503.c:0 "Ngươi không dám quấy nhiễu người chết."

  fund_inspiration.6504.t:0 "$fund_inspiration.title$ Người tình của [inspiration_owner.GetLadyLord|U] [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
  fund_inspiration.6504.desc:0 "\n\n'Ờ thì, [ROOT.Char.Custom('FormOfAddressForLiege')], trong chuyến đi, ta đã ở lại một trang trại do [adventurer_lover.GetTitledFirstName] trông coi.'"
  fund_inspiration.6504.pregnant:0 "\n\n'I have forged a fine artifact while at the farm! Namely, a child! While this may be an imposition, I cannot take [adventurer_lover.GetTitledFirstName] on my travels in [adventurer_lover.GetHerHis] state. [adventurer_lover.GetSheHe|U] has little wealth, and it is my hope we could look after [adventurer_lover.GetHerHim] at court.'"
  fund_inspiration.6504.female_lover:0 "\n\n'Sau bao đêm dài đơn độc trên đường, [adventurer_lover.GetSheHe] khuấy động trái tim ta như một sinh vật huyền ảo. Ta không thể không nghĩ rằng đây chính là nơi hành trình của ta được định sẵn.'"
  fund_inspiration.6504.male_lover_homosexual:0 "\n\n'Tự do khỏi ánh mắt triều đình, ta đã có thể nằm trong vòng tay một người đàn ông suốt nhiều đêm liền.'"
  fund_inspiration.6504.male_lover:0 "\n\n'Ta đang yêu, và ta thà dành cả tuần nhìn [adventurer_lover.GetHerHim] xúc phân ngựa còn hơn bất kỳ yến tiệc nào ở triều đình.'"
  fund_inspiration.6504.lover_ultimatum:0 "Ta không thể rời bỏ trang trại này, khi biết rằng có lẽ ta sẽ không bao giờ hôn [adventurer_lover.GetHerHim] lần nữa. Hoặc [adventurer_lover.GetSheHe] đến với ngài và gia nhập triều đình, hoặc hành trình của ta kết thúc tại đây.'"
  fund_inspiration.6504.a:0 "Cút đi, nếu ngươi coi thường sự bảo trợ của ta."
  fund_inspiration.6504.a.tt:0 "[inspiration_owner.GetTitledFirstName] sẽ ở lại trang trại."
  fund_inspiration.6504.b:0 "Ta cho phép, nhưng đừng trách ta vì tai tiếng."
  fund_inspiration.6504.c:0 "Đứa trẻ không đáng phải sống trong nghèo khó."
  fund_inspiration.6504.d:0 "NÔNG DÂN? Trong TRIỀU ĐÌNH của TA? KHÔNG ĐỜI NÀO."

  fund_inspiration.6505.t:0 "$fund_inspiration.title$ Chương bãi biển"
  fund_inspiration.6505.desc:0 "\n\n'Giữa lúc thở dốc trong cái nóng sa mạc, ta phát hiện những làn nước tinh khiết đến mức chỉ cần nhìn thôi cũng khiến ta cởi bỏ toàn bộ quần áo. Thay vì xem đó là xúc phạm, người dẫn đường khẽ cười thông cảm và bắt đầu phác họa dáng hình ta lên trang giấy. Những Ngài đồng hành vẫy lá cọ làm mát cho ta, như một màn phục vụ người hâm mộ.\n\n'Chúng ta đã có những giờ phút vui vẻ té nước. Ở ngôi làng kế tiếp, ta thuê một thợ dệt ghi lại khoảnh khắc thiên đường ấy, và gửi cho ngài một ký ức theo người đưa tin.'"
  fund_inspiration.6505.a:0 "Mắt ta! Mắt ta!"
  fund_inspiration.6505.a_blind:0 "Ta đã móc mắt mình ra rồi, nếu ta chưa mù sẵn."
  fund_inspiration.6505.a_one_eyed:0 "Mắt ta! Mắt ta!"
  fund_inspiration.6505.b:0 "Ta sẽ treo nó trong phòng ngủ!"
  fund_inspiration.6505.c:0 "Cả triều đình phải biết thú vui kỳ lạ này!"
  fund_inspiration.6505.d:0 "À, một hình ảnh thiêng liêng cho dân chúng ta!"


# Adventurer unhappy about being in the swamp
  fund_inspiration.6506.t:0 "$fund_inspiration.title$ Nhơ nhớp chẳng hề quá đáng"
  fund_inspiration.6506.introduction:0 "Một bức thư đến từ nhà phiêu lưu của ta. Nó bám đầy bùn đến mức ta phải dùng dao rạch ra.\n\n"
  fund_inspiration.6506.desc:1 "'Thưa [ROOT.Char.GetLadyLord], ta đang ở một vùng đầm lầy ẩm ướt, và từng ấy năm được dạy dỗ chẳng hề chuẩn bị cho ta điều này. Ta lội qua bùn nhão suốt ngày đêm. Đêm qua ta mơ về vòng tay người yêu, và tỉnh dậy thấy một con kỳ giông chạm môi ta thay vì một chiếc lưỡi.\n\n'Ta tự hỏi liệu có một cơ hội nho nhỏ nào để ta đến một nơi #EMP văn minh#! hơn không. Để minh họa cho mức độ ghê tởm của nơi này, ta đã gửi theo bức thư một con nòng nọc mà ếch đẻ trong đôi ủng ướt sũng của ta, đặt trong lọ.'"
  fund_inspiration.6506.a:0 "Nó rèn giũa tính cách!"
  fund_inspiration.6506.b:0 "Nếu ngươi muốn đến vùng đất hiền hòa hơn, cứ đi."

#Adventurer gets bee'd in a meadow
  fund_inspiration.6507.t:0 "$fund_inspiration.title$ Không phải bầy ong!"
  fund_inspiration.6507.introduction:1 "Ta nhận được một bức thư từ nhà phiêu lưu — những dòng chữ trộn lẫn với vệt máu."
  fund_inspiration.6507.desc:0 "\n\n'Những đồng bằng và thảo nguyên ta lang thang rực rỡ sinh vật hoang dã. Khi ta rời yên ngựa, cúi xuống ngửi một bông hoa, một cái bóng phủ lên ta bởi [grumpy_liege.GetTitledFirstName], lãnh chúa của vùng đất này, một [grumpy_liege.GetWomanMan] chẳng mấy coi trọng ngài.\n\n'\"Những ấu trùng của [ROOT.Char.GetTitledFirstNameNoTooltip] sẽ không được bú mớm trên đồng cỏ của ta.\" [grumpy_liege.GetSheHe|U] xuống ngựa và ra lệnh cho lính bắt giữ ta. Chúng mang ra một chiếc hộp chứa tổ ong, rồi úp thẳng lên đầu ta! Ta đã bị #EMP ong tấn công#!! Vẫn còn một ngòi chích mắc trong mắt ta!'"
  fund_inspiration.6507.a:0 "Ta sẽ gửi [grumpy_liege.GetHerHim] những lời lên án!"
  fund_inspiration.6507.b:0 "Ta sẽ lấy đầu [grumpy_liege.GetHerHis] cho chuyện này!"
  fund_inspiration.6507.c:0 "Những vết sẹo trông cũng khá quyến rũ!"

#Adventurer studying beavers in the Taiga
  fund_inspiration.6508.t:0 "$fund_inspiration.title$ Những Kiến Trúc Sư Của Tự Nhiên"
  fund_inspiration.6508.introduction:0 "Ta nhận được một bức thư từ nhà thám hiểm của mình, người đã ở trong những vùng đất se lạnh của rừng taiga.\n\n"
  fund_inspiration.6508.desc:0 "'I have spent some while surrounded by the finest company a journey[inspiration_owner.GetWomanMan] could ask for — a colony of beavers! With this courier I send to you a book of sketches of the structures they use to catch fish in the waters! O, to be a semi-aquatic rodent!'\n\n"
  fund_inspiration.6508.architect_desc:0 "'Ta chắc chắn ít nhất [court_architect.GetTitledFirstName] cũng có thể học hỏi được đôi điều từ một loài vật thông minh hơn [court_architect.GetHerHim].'"
  fund_inspiration.6508.a:0 "Ta sẽ nghiền ngẫm kỹ lưỡng cuốn này."
  fund_inspiration.6508.b:0 "Quả thật, [court_architect.GetTitledFirstNameNoTooltip] cần một bài học."
  fund_inspiration.6508.b.tt:0 "Năng lực kiến trúc của [court_architect.GetTitledFirstNamePossessive] tăng nhẹ"
  fund_inspiration.6508.c:1 "Thật là những sinh vật #EMP đáng yêu#! [child.GetFirstNameNoTooltip] nên có cuốn sách này!"
  fund_inspiration.6508.d:0 "Làm tốt lắm, ta sẽ gửi thêm kinh phí để kéo dài chuyến đi của ngươi."

#Adventurer massively exaggerating what an alligator looks like-floodplains 
  fund_inspiration.6509.t:0 "$fund_inspiration.title$ Lời Thì Thầm Về Quái Thú"
  fund_inspiration.6509.intro_desc:0 "Ta nhận được một bức thư từ nhà thám hiểm của mình, người đã trôi dạt qua vùng đồng bằng ngập lũ trên một chiếc bè."
  fund_inspiration.6509.desc:0 "\n\n'Hỡi [ROOT.Char.GetLadyLord], trên hành trình, chúng ta đã bị săn đuổi bởi một sinh vật đáng sợ đến mức ta gần như không dám viết ra.\n\n'Cá sấu có thể dài đến năm mươi bước chân, là một con quái vật đã nuốt trọn một con la của chúng ta. Nó có thân hình thon dài như mũi tên, với cái mỏ ở phía trước và chiếc đuôi kêu lách cách phía sau. Những gai và u cục bao phủ cơ thể nó đều độc khi chạm vào.'"
  fund_inspiration.6509.a:0 "Chúng ta sẽ gây ấn tượng với khách khứa bằng một tấm thảm dệt về con quái vật này!"
  fund_inspiration.6509.b:0 "Ôi, điều đó quá kinh khủng để có thể là sự thật!"
  fund_inspiration.6509.c:0 "Ta biết cá sấu trông ra sao, đồ ngốc!"

#Adventurer meeting a vigilante band who hide in the forest

  fund_inspiration.6510.t:0 "$fund_inspiration.title$ Những Kẻ Mặc Quần Bó"
  fund_inspiration.6510.intro_desc:0 "Ta nhận được một bức thư từ nhà thám hiểm của mình, người đang lẩn khuất trong lớp mùn rừng."
  fund_inspiration.6510.desc:1 "\n\n'Xin thứ lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng trong khu rừng này ta đã gặp một băng nhóm tự vệ chuyên cướp bóc những kẻ như ngài. Đối đầu với nắm đấm độc đoán của [enemy_liege.GetTitledFirstName], kẻ cai trị vùng đất này, họ cướp càng nhiều càng tốt bằng cách chặn đường giới quý tộc. Trái tim ta đã nghiêng về phía nhóm ô hợp này, và ta nghĩ mình sẽ không trở về triều đình nữa.\n\n'Quần bó của họ trông cũng đẹp hơn nhiều so với thời trang ở triều đình ngài, và khá hợp với ta.'"
  fund_inspiration.6510.a:0 "Có lẽ ngươi có thể giúp ta làm nhiều hơn cho người nghèo?"
  fund_inspiration.6510.b:0 "Nếu ngươi không quay về, ta sẽ phái sát thủ đến tìm ngươi!"
  fund_inspiration.6510.b.toast_outcome.positive:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] bị đe dọa"
  fund_inspiration.6510.b.toast_outcome.positive.continue:0 "Cuộc phiêu lưu tiếp tục"
  fund_inspiration.6510.b.toast_outcome.positive.flee:0 "[inspiration_owner.GetSheHe|U] bỏ trốn khỏi triều đình của ngươi."
  fund_inspiration.6510.b.toast_outcome.refusal:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] không mấy ấn tượng"
  fund_inspiration.6510.c:0 "Hãy tận hưởng cuộc sống bẩn thỉu của ngươi đi!"

  fund_inspiration.6511.t:0 "$fund_inspiration.title$ Lữ Khách Trong Biển Tuyết"
  fund_inspiration.6511.intro_desc:0 "Ta nhận được một bức thư từ nhà thám hiểm của mình, và chỉ sau vài dòng đầu tiên, ta biết đây sẽ là bức cuối cùng."
  fund_inspiration.6511.old_age:0 "\n\n'Tuổi già đã mang đến cho ta nhiều kỳ quan trong đời. Khi ta đặt chân lên đỉnh núi phủ tuyết mà ta đang viết những dòng này, là sinh vật sống duy nhất phía trên biển sương mù, ta biết mình sẽ không bao giờ được thấy vẻ đẹp như thế này nữa trong quãng đời còn lại.\n\n'Ta chưa bao giờ mong muốn quay trở về từ ngọn núi này, và giờ đây ngài có thể cho rằng ta đã hòa làm một với băng giá. Xin đừng khóc than, vì ta không thể làm khác được. Cuộc hành trình của ta đến [inspiration_owner.GetFaith.PositiveAfterLife] vững chãi như một dòng băng hà.'"
  fund_inspiration.6511.poor_health:0 "\n\n'Ta giờ chỉ còn là một sinh vật khốn khổ, méo mó khi sức khỏe và thân xác phản bội ta. Nhưng trong trạng thái ấy, ta chưa từng nghĩ mình có thể chứng kiến một cảnh tượng như vương quốc mây và sương tuyết từ đỉnh núi cao. Một bông hoa héo úa như ta không xứng đáng với vẻ đẹp này.\n\n'Biết rằng thời khắc của ta có thể đến bất cứ lúc nào, ta đã quyết định phó mặc bản thân cho băng giá. Có lẽ cái lạnh sẽ bảo tồn ta với chút dáng vẻ cũ.'"
  fund_inspiration.6511.winter:0 "\n\n'Ta ở trên đỉnh núi vào thời khắc tàn khốc nhất. Mỗi bông tuyết rơi lên gò má tê buốt của ta đều là tiếng cười của mùa đông — kẻ phản diện. Ta đã thấy chiến trận, nhưng không bạo lực nào tinh tế bằng cuộc đấu này với chính dòng máu trong cơ thể ta. Tay thuận của ta vẫn đủ để viết những dòng này, nhưng tay còn lại thì không.\n\n'Hãy biết rằng ta thực sự vui mừng khi được thấy thế giới như ta đã thấy, và ta cảm nhận những kẻ còn sống khác trở nên nghèo nàn hơn.'"
  fund_inspiration.6511.a:0 "Chưa từng có kẻ lãng mạn của hiểm nguy nào chân thực hơn!"


  fund_inspiration.6512.t:0 "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip|U] Của Ngọn Núi"
  fund_inspiration.6512.intro_desc:0 "I receive a missive from my adventurer, and it is covered in ruddy dust, from [inspiration_owner.GetHerHis] journey through the desert mountains."
  fund_inspiration.6512.desc:1 "\n\n'Ta đã chinh phục thêm một con quái thú nữa, và trên hàng ngàn cao nguyên bằng phẳng này, ta không thấy dấu vết nào cho thấy từng có [inspiration_owner.GetWomanMan] nào đặt chân lên tảng đá này. Hôm nay, ta đã vượt qua đỉnh cao nhất mà ta từng leo.\n\n'Ta nghĩ tảng đá này đang kêu gọi một cái tên xứng đáng, để ghi dấu chiến tích này dưới sự chứng kiến của [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại nhất trong vũ trụ.'"
  fund_inspiration.6512.a:0 "Ta chắc rằng dân địa phương đã đặt tên cho ngọn núi rồi."
  fund_inspiration.6512.b:0 "'Đá Đá' — một cái tên ngớ ngẩn!"
  fund_inspiration.6512.c:0 "'Lưỡi Gươm Của [ROOT.Char.GetFaith.WarGodNamePossessive]'"
  fund_inspiration.6512.d:0 "'Găng Tay Của [ROOT.Char.GetFaith.FateGodNamePossessive]'"
  fund_inspiration.6512.e:0 "Theo tên người yêu của ta, [lover.GetFirstNameNoTooltip]."
  fund_inspiration.6512.f:0 "Răng Của [ROOT.Char.GetFirstNamePossessiveNoTooltip]!"
  fund_inspiration.6512.g:0 "Gậy Của [ROOT.Char.GetFirstNamePossessiveNoTooltip]!"
  fund_inspiration.6512.h:0 "Tai Họa Của [rival.GetFirstNamePossessiveNoTooltip]!"
  fund_inspiration.6512.i:0 "Thôi bỏ đi — mang cho ta vài hòn đá là được!"



 # Artifact modifications: dedication
  fund_inspiration.7001.t:0 "$fund_inspiration.title$ Một Cái Tên Đáng Ghi Nhớ"
  fund_inspiration.7001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] approaches me with a thoughtful expression. "Is there anyone special to you, [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\n[inspiration_owner.GetSheHe|U] must read my irritation at such a personal question from my face, because [inspiration_owner.GetSheHe] continues: "I mean, is there anyone you wish to dedicate your commissioned artifact to? It is turning out well, but a meaningful inscription would make it feel even more personal!""
  fund_inspiration.7001.a:1 "Dành cho người yêu dấu của ta, [dedication_a.GetFirstNameNoTooltip]!"
  fund_inspiration.7001.b:1 "Tưởng niệm [dedication_b.GetFirstNameNoTooltip]..."
  fund_inspiration.7001.c:0 "Chỉ có [ROOT.Char.GetFaith.HighGodNameAlternate] dẫn lối cho ta!"
  fund_inspiration.7001.d:0 "Không cần đề tặng."
  artifact_dedication_inscribed_a:0 "[newly_created_artifact.GetDesc]\n\nMột dòng khắc nhỏ nhưng thanh nhã chạy dọc bên hông, đề tặng \"Gửi Người Yêu Dấu Của Ta, [dedication_a.GetFirstName]\"."
  artifact_dedication_written_a:0 "[newly_created_artifact.GetDesc]\n\nMột dòng chữ nhỏ nhưng thanh nhã ở trang đầu đề tặng \"Gửi Người Yêu Dấu Của Ta, [dedication_a.GetFirstName]\"."
  artifact_dedication_woven_a:0 "[newly_created_artifact.GetDesc]\n\nMột dòng chữ nhỏ nhưng thanh nhã được dệt bên dưới cảnh chính, đề tặng \"Gửi Người Yêu Dấu Của Ta, [dedication_a.GetFirstName]\"."
  artifact_dedication_inscribed_b:0 "[newly_created_artifact.GetDesc]\n\nMột dòng khắc nhỏ nhưng thanh nhã chạy dọc bên hông, đề tặng \"Tưởng Niệm Đầy Yêu Thương [dedication_b.GetFirstName]\"."
  artifact_dedication_written_b:0 "[newly_created_artifact.GetDesc]\n\nMột dòng chữ nhỏ nhưng thanh nhã ở trang đầu đề tặng \"Tưởng Niệm Đầy Yêu Thương [dedication_b.GetFirstName]\"."
