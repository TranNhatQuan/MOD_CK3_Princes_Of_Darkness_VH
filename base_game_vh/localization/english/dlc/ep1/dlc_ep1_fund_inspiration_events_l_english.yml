  artifact_dedication_woven_f:0 "[newly_created_artifact.GetDesc]\n\nMột dòng chữ nhỏ nhưng thanh nhã được dệt bên dưới cảnh chính, đề tặng \"Gửi Người Yêu Dấu Của Ta, [dedication_f.GetFirstName]\"."
  fund_inspiration.7004.t:0 "$fund_inspiration.title$ Một Chư Hầu Đáng Ghi Nhớ?"
  fund_inspiration.7004.desc:0 "[dedication_g1.GetTitledFirstName|U] và [dedication_g2.GetTitledFirstName] là những chư hầu quyền lực bậc nhất trong lãnh địa của ta. Ta chưa bao giờ biết cách giữ họ hài lòng để họ không đi gây rối. Có lẽ nịnh nọt là con đường đúng?\n\nAi mà chẳng vui khi có thứ gì đó được làm mang tên mình, phải không? Và ta đang có đúng món đồ như thế trong quá trình hoàn thiện! Ta nên cho [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] biết rằng ta sẽ đề tặng kiệt tác của [inspiration_owner.GetHerHis] cho những chư hầu và cố vấn #EMP đáng tin cậy#! của ta.\n\nNhưng nghĩ lại, đó là bảo vật của #EMP ta#!, vậy có lẽ ta chỉ nên...?"
  fund_inspiration.7004.a:0 "Không! Dành cho [dedication_g1.GetFirstNameNoTooltip] và [dedication_g2.GetFirstNameNoTooltip]!"
  fund_inspiration.7004.b:0 "Sao lại không chứ? DÀNH CHO CHÍNH TA!"
  fund_inspiration.7004.c:0 "Đề tặng cũng bị thổi phồng quá mức."
  artifact_dedication_inscribed_g:0 "[newly_created_artifact.GetDesc]\n\nA tiny but elegant inscription runs on its side, stating that "[owner.GetTitledFirstNameNoTooltip|U] dedicated this to [owner.GetHerHis] trusted advisors, [dedication_g1.GetTitledFirstName] and [dedication_g2.GetTitledFirstName]"."
  artifact_dedication_written_g:0 "[newly_created_artifact.GetDesc]\n\nA tiny but elegant inscription on the first page states that "[owner.GetTitledFirstName|U] dedicated this to [owner.GetHerHis] trusted advisors, [dedication_g1.GetTitledFirstName] and [dedication_g2.GetTitledFirstName]"."
  artifact_dedication_woven_g:0 "[newly_created_artifact.GetDesc]\n\nA tiny but elegant inscription woven beneath the main scene states that "[owner.GetTitledFirstNameNoTooltip|U] dedicated this to [owner.GetHerHis] trusted advisors, [dedication_g1.GetTitledFirstName] and [dedication_g2.GetTitledFirstName]"."
  artifact_dedication_inscribed_h:0 "[newly_created_artifact.GetDesc]\n\nMột dòng khắc nhỏ nhưng thanh nhã chạy dọc bên hông, đề tặng món đồ \"Vì Vinh Quang Bất Diệt Của [owner.GetTitledFirstNamePossessive|U]\"."
  artifact_dedication_written_h:0 "[newly_created_artifact.GetDesc]\n\nMột dòng chữ nhỏ nhưng thanh nhã ở trang đầu đề tặng món đồ \"Vì Vinh Quang Bất Diệt Của [owner.GetTitledFirstNamePossessive|U]\"."
  artifact_dedication_woven_h:0 "[newly_created_artifact.GetDesc]\n\nMột dòng chữ nhỏ nhưng thanh nhã được dệt bên dưới cảnh chính đề tặng món đồ \"Vì Vinh Quang Bất Diệt Của [owner.GetTitledFirstNamePossessive|U]\"."
 # Artifact modifications: motto
  fund_inspiration.7010.t:0 "$fund_inspiration.title$ Khẩu Hiệu Cho Muôn Đời"
  fund_inspiration.7010.desc:0 "I can hear [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] muttering to [inspiration_owner.GetHerselfHimself] from across the hall. "I need something great, something #EMP epic#! to make my creation stand out from the uninspired masses, but what, just WHAT?"\n\nWhen [inspiration_owner.GetHerHis] spirited eyes meet mine, [inspiration_owner.GetSheHe] breaks out into a huge smile and waves to me. "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! What an amazing idea! Just #EMP perfect#!! What do you think of adding your family's motto to your commission?""
  fund_inspiration.7010.a:0 "Được chứ, nghe thật tuyệt!"
  fund_inspiration.7010.b:0 "Thật ngu ngốc và không cần thiết."
  artifact_motto_inscribed:0 "[newly_created_artifact.GetDesc]\n\nKhẩu hiệu của gia tộc [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, được khắc tinh xảo ở một bên."
  artifact_motto_written:0 "[newly_created_artifact.GetDesc]\n\nKhẩu hiệu của gia tộc [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, được viết theo phong cách trang trí cầu kỳ ở trang đầu."
  artifact_motto_woven:0 "[newly_created_artifact.GetDesc]\n\nKhẩu hiệu của gia tộc [owner.GetHouse.GetName], #EMP '[owner.GetHouse.GetMotto]'#!, được dệt tinh xảo phía trên cảnh chính."
 # Artifact modification: choose modifiers - weapons and armors
  fund_inspiration.7100.t:0 "$fund_inspiration.title$ Định Hướng Sáng Tạo"
  fund_inspiration.7100.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Công việc trên bảo vật quý giá của ngài đang tiến triển rất tốt!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hôm nay trông có vẻ vô cùng phấn chấn.\n\n"Ta không dám hứa trước điều gì nhưng... nếu ta có thể tạo ra một kiệt tác thực sự, thì ngài muốn ý tưởng nào dẫn dắt bàn tay ta?""
  fund_inspiration.7100.a:0 "Gây ra nhiều thương vong hơn cho #EMP chúng#!, và ít hơn cho #EMP ta#!."
  fund_inspiration.7100.a.tt:0 "Bảo vật [artifact|E] của Ngài có thể nhận được [modifier|E] về [casualties|E]"
  fund_inspiration.7100.b:0 "Gieo rắc nỗi sợ hãi cho những kẻ ta cướp bóc."
  fund_inspiration.7100.b.tt:0 "Bảo vật [artifact|E] của Ngài có thể nhận được [modifier|E] về [raiding|E]"
  fund_inspiration.7100.c:0 "Khích lệ các $knight_culture_player_plural_no_tooltip_lowercase$ của ta vươn tới vĩ đại."
  fund_inspiration.7100.c.tt:0 "Bảo vật [artifact|E] của Ngài có thể nhận được [modifier|E] liên quan đến [knight|E]"
  fund_inspiration.7100.d:0 "Khai thác lợi thế địa hình hiệu quả hơn."
  fund_inspiration.7100.d.tt:0 "Bảo vật [artifact|E] của Ngài có thể nhận được [modifier|E] liên quan đến [terrain|E]"
