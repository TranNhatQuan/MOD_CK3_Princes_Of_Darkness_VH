l_english:
 # Murder save: food taster
  court_position.9001.t:0 "$murder_save_header$ $food_taster_court_position$"
  court_position.9001.desc:0 "Âm mưu đoạt mạng [target.GetTitledFirstNamePossessive] của ta đã bị phá hỏng!\n\nThuộc hạ của ta đã không tính đến người nếm thức ăn của [target.GetTitledFirstNamePossessive], và chất độc thậm chí còn chưa bao giờ chạm tới đĩa ăn của [target.GetHerHis]."
  court_position.9001.food_taster_dies:0 "\n\nÍt nhất thì kẻ nếm thức ăn cũng đã gục ngã vì chất độc. [food_taster.GetTitledFirstName] sẽ không còn cản đường ta nữa."

  court_position.9002.desc:0 "An assassin has made an attempt on my life! Thankfully my trusted food taster, [food_taster.GetFirstName], was doing [food_taster.GetHerHis] job and the poison never even made it to my plate."
  court_position.9002.food_taster_dies:0 "Thật bi thảm, [food_taster.GetFirstNameNoTooltip] đã hấp thụ quá nhiều chất độc và không thể cứu được."
  court_position.9002.owner_discovered:0 "\n\nKhông còn nghi ngờ gì nữa, tất cả đều là do [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] gây ra!"

 # Murder save: cupbearer
  court_position.9011.t:0 "$murder_save_header$ $cupbearer_court_position$"
  court_position.9011.desc:0 "Âm mưu đoạt mạng [target.GetTitledFirstNamePossessive] của ta đã bị phá hỏng!\n\nThuộc hạ của ta đã không tính đến người rót rượu của [target.GetHerHis], và dù chất độc đã được cho vào ly rượu của [target.GetTitledFirstNamePossessive], nó cũng không vượt qua nổi đôi môi của [cupbearer.GetTitledFirstNamePossessive]."
  court_position.9011.cupbearer_dies:0 "\n\nÍt nhất thì người rót rượu cũng đã gục ngã vì chất độc. [cupbearer.GetSheHe|U] sẽ không còn cản đường ta nữa."

  court_position.9012.desc:0 "An assassin has made an attempt on my life! Thankfully my cup-bearer, [cupbearer.GetFirstName], had taken the liberty of helping [cupbearer.GetHerselfHimself] to a sip of my [ROOT.Char.Custom('RegionalDrink')] before serving me today."
  court_position.9012.cupbearer_dies:0 "Thật bi thảm, [cupbearer.GetFirstNameNoTooltip] đã uống phải quá nhiều chất độc và không thể cứu được. Hẳn ở đây có một bài học nào đó về việc quá tự tiện..."

 # Murder save: bodyguard
  court_position.9021.t:0 "$murder_save_header$ $bodyguard_court_position$"
  court_position.9021.desc:0 "Âm mưu đoạt mạng [target.GetTitledFirstNamePossessive] của ta đã bị phá hỏng!\n\nTên cận vệ [bodyguard.Custom2('InsultAdjective', ROOT.Char)] của [target.GetHerHis|U] đã hạ gục sát thủ ta phái đến, và [target.GetFirstNameNoTooltip] thậm chí còn không bị trầy xước!"
  court_position.9021.bodyguard_dies:0 "\n\nAt least the bodyguard died from [bodyguard.GetHerHis] injuries and won't get in my way again."

  court_position.9022.desc:0 "Một sát thủ đã tìm cách lấy mạng ta!\n\nKhi ta đang đi qua những hành lang vắng vẻ vào đêm khuya, một sát thủ bất ngờ lao ra từ bóng tối. Ta không dám nghĩ đến chuyện gì sẽ xảy ra nếu cận vệ trung thành của ta là [bodyguard.GetTitledFirstName] không đi cùng."
  court_position.9022.bodyguard_dies:0 "\n\nThật bi thảm, [bodyguard.GetSheHe] đã chịu những vết thương chí mạng trong cuộc giao tranh sau đó và không thể cứu được."
