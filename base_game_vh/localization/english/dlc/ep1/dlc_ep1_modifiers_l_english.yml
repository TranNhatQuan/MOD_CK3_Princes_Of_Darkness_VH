l_english:
 
  inspiration_invested_in_new_forge_modifier:0 "Lò Rèn Mới"
  inspiration_invested_in_new_forge_modifier_desc:0 "Nhân vật này có một lò rèn hoàn toàn mới và có hiệu suất rất cao."
 
  inspiration_alchemy_condoned_by_church_modifier:0 "Giáo Hội Chấp Thuận Giả Kim"
  inspiration_alchemy_condoned_by_church_modifier_desc:0 "Giáo hội địa phương đã quyết định chấp thuận sự say mê của nhân vật này đối với các thí nghiệm giả kim."

  raised_in_secrecy_modifier:0 "Được Nuôi Dưỡng Trong Bí Mật"
  raised_in_secrecy_modifier_desc:0 "Nhân vật này đã được nuôi dưỡng trong sự bí mật hoàn toàn và gần như cách ly tuyệt đối kể từ khi sinh ra."

  legendary_party_aftermath_modifier:0 "Hậu Quả Bữa Tiệc Huyền Thoại"
  legendary_party_aftermath_modifier_desc:0 "Triều đình của nhân vật này vẫn còn mang những vết tích tàn phá nặng nề sau một bữa tiệc vừa đáng xấu hổ vừa xuất sắc, dù mang tính hủy diệt."
  mythic_party_aftermath_modifier:0 "Hậu Quả Bữa Tiệc Thần Thoại"
  mythic_party_aftermath_modifier_desc:0 "Triều đình của nhân vật này vẫn còn mang những vết tích tàn phá nặng nề sau một bữa tiệc hủy diệt đến mức huy hoàng, đến nay vẫn còn được ghi nhớ tại địa phương."
  world_shattering_party_aftermath_modifier:0 "Hậu Quả Bữa Tiệc Chấn Động Thế Gian"
  world_shattering_party_aftermath_modifier_desc:0 "Triều đình của nhân vật này vẫn còn mang những vết tích tàn phá nặng nề sau một bữa tiệc hỗn loạn đến mức gây ra nhiều thiệt hại hơn hầu hết các cuộc vây hãm nhỏ."
  lacking_diplomatic_munity_modifier:0 "Thiếu Quyền Miễn Trừ Ngoại Giao"
  lacking_diplomatic_munity_modifier_desc:0 "Ai cũng biết rằng một nhà ngoại giao đến thăm triều đình này sẽ kém an toàn hơn so với những gì thông lệ quy định."
  humbling_hall_modifier:0 "Sảnh Hạ Nhục"
  humbling_hall_modifier_desc:0 "Một căn phòng trong triều đình này nổi tiếng vì một sự cố đã làm bẽ mặt hai nhà ngoại giao quý tộc, một câu chuyện về công lý làm hả dạ được dân thường dùng như một ngụ ngôn răn dạy."
  inscrutable_host_modifier:0 "Chủ Nhân Khó Lường"
  inscrutable_host_modifier_desc:0 "Nhân vật này được nhiều người cho rằng tin rằng trả thù là món ăn ngon nhất khi được dọn lạnh. Có lẽ vậy."

  above_petty_differences_modifier:0 "Vượt Trên Những Khác Biệt Nhỏ Nhặt"
  above_petty_differences_modifier_desc:0 "Nhân vật này chẳng bận tâm đến những điều vụn vặt, tập trung vào điểm chung giữa các dân tộc hơn là những tranh chấp nhỏ nhen."

  what_did_i_just_drink_modifier:0 "Ta Vừa Uống Thứ Gì Vậy?"
  what_did_i_just_drink_modifier_desc:0 "Cái đó là... ta... đầu ta... Ái."
  known_killjoy_modifier:0 "Kẻ Phá Hỏng Cuộc Vui Khét Tiếng"
  known_killjoy_modifier_desc:0 "Cấm mọi hình thức vui vẻ, theo sắc lệnh của giới quý tộc."
