l_english:
  order_mass_eviction_decision:0 "Ra Lệnh Trục Xuất Hàng Loạt"
  order_mass_eviction_decision_desc:0 "Không phải bí mật gì việc triều đình ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] của chúng ta đang thiếu trầm trọng phòng trống, cũng như việc có không ít những \"vị khách\" ăn bám đang lợi dụng lòng hiếu khách của ta— à không, #EMP của chúng ta#!.\n\nThông thường, việc yêu cầu những kẻ lười nhác như vậy rời đi sẽ bị coi là thô lỗ, nhưng nếu ta tuyên bố rằng đơn giản là chúng ta không thể tiếp tục chứa chấp họ..."
  order_mass_eviction_decision.tt.courtier_option:0 "Do tình trạng thiếu chỗ ở nghiêm trọng, Ngài cũng có thể chọn trục xuất các cận thần không quan trọng"
  order_mass_eviction_decision_tooltip:0 "Tống cổ các [guests|E] của Ngài"
  order_mass_eviction_decision_confirm:0 "Không gian là thứ xa xỉ!"
  AT_LEAST_ONE_GUEST_TRIGGER:0 "Ngài có ít nhất 1 [guest|E]"
  AT_LEAST_ONE_UNIMPORTANT_COURTIER_TRIGGER:0 "Ngài có ít nhất 1 [courtier|E] không quan trọng"

  exoticise_a_grand_hall_decision:1 "Ngoại Lai Hóa Đại Sảnh"
  exoticise_a_grand_hall_decision_desc:0 "Triều đình của ta có vô số phòng nối tiếp nhau, nhiều đến mức ngay cả một số đại sảnh ấn tượng nhất cũng bị bỏ không trong phần lớn thời gian trong năm.\n\nVới từng ấy kiến trúc để tạo hình và trang trí, hẳn chúng ta có thể mạnh tay đầu tư vào thứ gì đó được mô phỏng theo một phong cách hoàn toàn khác biệt?"
  exoticise_a_grand_hall_decision_tooltip:0 "Trang trí lại một phần cung điện của Ngài theo phong cách của một [royal_court|E] khác"
  exoticise_a_grand_hall_decision.tt.you_ponder:0 "Ngài trầm ngâm suy nghĩ về các [kingdoms|E] và [empires|E] khác..."
  exoticise_a_grand_hall_decision_confirm:0 "Gọi thợ xây đến!"
  exoticise_a_grand_hall_decision.tt.any_valid_empire:0 "Bất kỳ [empire|E] nào có [royal_court|E] đều nằm trong [diplomatic_range|E]"
  exoticise_a_grand_hall_decision.tt.any_valid_kingdom:0 "Bất kỳ [kingdom|E] nào có [royal_court|E] đều nằm trong [diplomatic_range|E]"

  invite_a_linguist_self:1 "Tìm Nhà Ngôn Ngữ Học Tiếng [ROOT.Char.GetCourtLanguage.GetNameNoTooltip]"
  invite_a_linguist_liege:1 "Tìm Giáo Viên Tiếng [ROOT.Char.GetLiege.GetCourtLanguage.GetNameNoTooltip]"
  invite_a_linguist_desc:0 "Việc con cái ta và chính ta nói được ngôn ngữ của giới quý tộc là điều tối quan trọng. Ta có thể mời về một gia sư ngôn ngữ lành nghề để đảm bảo điều này."
  invite_a_linguist_for_children_desc:0 "Đã đến lúc con cái ta học nói ngôn ngữ của giới quý tộc. Ta có thể mời về một gia sư ngôn ngữ lành nghề để dạy dỗ chúng."
  invite_a_linguist_self_tooltip:0 "Tuyển một người để dạy [court_language|E] của Ngài"
  invite_a_linguist_liege_tooltip:0 "Tuyển một người để dạy [court_language|E] của [liege|E] của Ngài"
  invite_a_linguist_self_confirm:0 "Bắt đầu tìm kiếm"
  invite_a_linguist_liege_confirm:0 "$invite_a_linguist_self_confirm$"
  invite_a_linguist_tt_self:1 "Ngài sẽ tìm một người để dạy [target_court_language.GetCourtLanguage.GetName], tức [court_language|E] của Ngài"
  invite_a_linguist_tt_liege:2 "Ngài sẽ tìm một người để dạy [target_court_language.GetCourtLanguage.GetName], tức [court_language|E] của [liege|E] của Ngài, [target_court_language.GetTitledFirstNameRegnal]"
  learn_language_will_cancel_ongoing_schemes_tt:0 "@warning_icon! #X Một [personal_scheme|E] đang diễn ra sẽ bị hủy nếu Ngài không có ô trống#!"
  linguist_already_present:0 "Ngài đã có sẵn một nhà ngôn ngữ học trong triều"
  scheming_already:0 "Ngài đang học một ngôn ngữ rồi"
