l_english:
  tradition_header:0 "Truyền Thống:"
  ep1_flavor.1000.t:0 "$tradition_header$ Một Hoạn Quan Ghé Thăm"
  ep1_flavor.1000.desc:0 "Một hoạn quan lang bạt hôm nay đã tự giới thiệu [eunuch_target.GetHerselfHimself] tại triều đình của ta.\n\n\"Xin chào, hỡi [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleTierName] vĩ đại nhất.\" [eunuch_target.GetSheHe] nói, đầy cung kính.\n\n\"Ta tên là [eunuch_target.GetFirstName], một kẻ du hành có tiếng — ta từng đem kiến thức phục vụ các vị Vua–Học giả cao quý, và chăm nom hậu cung của những Đại Sultan — nay ta có mặt ở đây, dâng hiến dịch vụ của mình cho ngài. Với một khoản thù lao khiêm tốn.\"\n\nMột nhân vật thật đáng chú ý… có lẽ ta nên thuê [eunuch_target.GetHerHim]?"
  ep1_flavor.1000.a:0 "Một đề nghị công bằng, ta chấp nhận."
  ep1_flavor.1000.b:0 "[eunuch_target.GetFirstNameNoTooltip], người Ngài [eunuch_target.Custom('ComplimentAdjective')] của ta, ngươi có muốn ở lại thêm một thời gian không?"
  ep1_flavor.1000.c:0 "Ta không cần đến dịch vụ của ngươi."
  eunuch_moves_tt:0 "[eunuch_target.GetFirstNameNoTooltip] rời đi đến triều đình [new_court.GetBaseName]"
  ep1_flavor.1000.c.success:0 "Ngài thuyết phục được [eunuch_target.GetFirstNameNoTooltip] ở lại"
  ep1_flavor.1000.c.failure:0 "[eunuch_target.GetFirstNameNoTooltip] gọi Ngài là kẻ keo kiệt rồi bỏ đi"
 
  ep1_flavor.1200.t:0 "$tradition_header$ Bí Kíp Nghề Nghiệp"
  ep1_flavor.1200.desc:0 "Hoạn quan [eunuch_target.GetFirstName] bước vào tầm mắt của ta, [eunuch_target.Custom('quirk_pos_pp')].\n\n\"Ngài biết rất nhiều điều, hỡi [ROOT.Char.GetTitleTierName] vĩ đại. Nhưng vẫn có những thứ ngay cả trí tuệ khôn lường của ngài cũng không chạm tới — những bí mật và tri thức mà ta sẵn lòng chia sẻ.\" [eunuch_target.GetSheHe] thì thầm.\n\n\"Với một cái giá.\"\n\nDĩ nhiên rồi. Dù vậy, ta vẫn thấy tò mò."
  ep1_flavor.1200.a:0 "Ta nghe nói ngươi biết bí mật của ngôn ngữ?"
  ep1_flavor.1200.b:0 "Ta có nhiều kẻ thù. Làm sao để tiêu diệt chúng?"
  ep1_flavor.1200.c:0 "Lãnh địa của ta phải thịnh vượng, làm sao để đạt được điều đó?"
  ep1_flavor.1200.d:0 "Đồ bịp bợm! Những bí mật của ngươi chỉ là trò bịa đặt."
  secrets_of_language_modifier:0 "Bí Mật Ngôn Ngữ"
  secrets_of_language_modifier_desc:0 "Nhân vật này đã được tiếp cận những bí mật liên quan đến việc học ngôn ngữ."
  secrets_of_murder_modifier:0 "Bí Mật Báo Thù"
  secrets_of_murder_modifier_desc:0 "Nhân vật này đã được tiếp cận những bí mật liên quan đến việc tiêu diệt kẻ thù."
  secrets_of_the_realm_modifier:0 "Bí Mật Lãnh Thổ"
  secrets_of_the_realm_modifier_desc:0 "Nhân vật này đã được tiếp cận những bí mật liên quan đến việc quản lý thủ phủ."

 ### Court Type Flavor Events

 # The Secret DaughterSon
  ep1_flavor.0001.t:0 "The Secret [scion_actual.Custom('GetDaughterSon')|U]"
  ep1_flavor.0001.desc:0 "A petty business affair in town brings my retinue and I, thirsty and hungry, to the little smoke-filled tavern.\n\nOf all people, I least expected to find [scion_parent.GetTitledFirstName] sat at the back, poorly disguised with cloak and hood. Next to [scion_parent.GetHerHim] sits a young [scion_actual.GetWomanMan] who... it can't be!\n\nFrom [scion_actual.GetHerHis] face, the way [scion_actual.GetSheHe] glances around the room in wonder, and [scion_actual.GetHerHis] mimicking of the distinctive mannerisms of [scion_parent.GetFirstNameNoTooltip], I am #EMP convinced#! [scion_actual.GetSheHe] must be some secret bastard of the [scion_parent.GetTitleAsNameNoTooltip], perhaps seeing the world outside for the first time."
  ep1_flavor.0001.a:0 "[scion_parent.GetFirstNameNoTooltip]! Ngươi mang đến cho ta một [scion_actual.Custom('GetBrideGroom')] sao?"
  ep1_flavor.0001.a.tt.success:0 "Ngài cưỡng ép thương lượng một [marriage|E] [alliance|E]"
  ep1_flavor.0001.a.tt.failure:0 "[scion_parent.GetFirstNameNoTooltip] trốn thoát cùng [scion_parent.GetHerHis] [scion_actual.Custom('GetDaughterSon')]"
  ep1_flavor.0001.b:0 "[scion_parent.GetFirstNameNoTooltip]! Ngươi mang cho [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('prospective_spouse'))] của ta một [scion_actual.Custom('GetBrideGroom')] ư?"
  ep1_flavor.0001.c:0 "Gọi người rao tin, #EMP ngay lập tức#!!"
  ep1_flavor.0001.c.tt.success:0 "Ngài tìm đủ bằng chứng để chứng minh sự tồn tại của đứa con hoang"
  ep1_flavor.0001.c.tt.failure:0 "[scion_parent.GetFirstNameNoTooltip] covers [scion_parent.GetHerHis] tracks too well"
  ep1_flavor.0001.d:0 "Đừng lo, hỡi [scion_parent.GetTitleAsNameNoTooltip] của ta, ngươi có thể tin ta sẽ quên rằng đã từng thấy ngươi..."
  ep1_flavor.0001.tt.scion_escapes:0 "[scion_actual.GetFirstName] bị bí mật đưa đi và không bao giờ được nghe tới nữa"
  ep1_flavor.0001.e.no_bastards:0 "Một đứa trẻ #EMP bí mật#! ư? Thật kỳ lạ. Ta sẽ ăn ở chỗ khác."
  ep1_flavor.0001.e.fallback:0 "Chuyện này không liên quan đến chúng ta. Ta sẽ ăn ở chỗ khác."

  ep1_flavor.0011.t:0 "Một Mớ Hỗn Độn Tuyệt Đối"
  ep1_flavor.0011.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], không phải như ngài nghĩ đâu!\" [diplomat_1.GetTitledFirstName] kêu lên khi ta bước vào đại sảnh ăn uống yêu thích của mình.\n\nNhững gì nó #EMP trông#! giống là việc [diplomat_1.GetSheHe] đã phá tan căn phòng. Thức ăn bám đầy tường, bàn ghế gần như vỡ nát, ai đó xếp mọi chiếc ghế thành một kim tự tháp, và thân hình bất tỉnh của [diplomat_2.GetTitledFirstName] (hoàn toàn khỏa thân) nằm ngửa, đẫm súp, trên một trong những chiếc giường #EMP của ta#!.\n\nHai nhà ngoại giao này mới chỉ đến ngày hôm qua. Ta cho phép họ dùng bữa tử tế và chút giải trí nhẹ nhàng, chứ không phải một bữa tiệc đủ sức khiến cả [ROOT.Char.GetFaith.NegativeAfterLife|U] cũng phải trỗi dậy."
  ep1_flavor.0011.a:0 "Các ngươi sẽ phải trả giá cho đống thiệt hại này, lũ nịnh thần bẩn thỉu!"
  ep1_flavor.0011.b:0 "Được rồi, đã phá thì phải dọn. GIA NHÂN! Mang cây lau tới!"
  ep1_flavor.0011.c:0 "Ôi không, bữa tiệc này chưa kết thúc đâu: ai đó rót đầy ly cho ta!"
  ep1_flavor.0011.d:0 "Một đêm thôi à? Thật thảm hại! Nhường chỗ cho Bữa Tiệc của [ROOT.Char.GetTitleAsNameNoTooltip]!"
  ep1_flavor.0011.e:0 "Lặng lẽ rời khỏi đại sảnh."
  ep1_flavor.0011.e.tt:0 "Ngài bỏ mặc họ chìm trong nỗi sợ hãi của chính mình"

  ep1_flavor.0021.t:0 "Hai Lãnh Thổ, Ngăn Cách Bởi Ngôn Ngữ Triều Đình"
  ep1_flavor.0021.desc:0 "Tiếng cười khúc khích đập vào tai ta khi bước vào gian phòng: một nhóm cận thần, dẫn đầu bởi [nitpicker.GetTitledFirstName], đang tụ tập quanh một bức thư mới nhận từ [rival_monarch.GetTitledFirstName].\n\n[nitpicker.GetFirstNameNoTooltip] vẫy ta lại trong tiếng cười lớn.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài #EMP nhất định#! phải đọc cái này! Nó có con dấu chính thức của [rival_realm.GetNameNoTier], nhưng cứ hai chữ lại viết sai một lần, như thể do một tên nông dân mù chữ viết ra. Đám lười biếng đầu óc rỗng tuếch ấy thậm chí không dùng đúng phụ âm, chứ đừng nói đến việc nói chuẩn tiếng [ROOT.Char.GetCourtLanguage.GetName], thật là #EMP buồn cười#!.\""
  ep1_flavor.0021.a:0 "Bức thư này thiếu mất nửa số nguyên âm! Kinh tởm!"
  ep1_flavor.0021.a.tt:0 "Cả hai [courts|E] mất [SCOPE.ScriptValue('ep1_flavour_0021_courts_lose_opinion_value')|N0] [opinion|E] với nhau"
  ep1_flavor.0021.a.tt.success:0 "Chính tả [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] là chuẩn nhất!"
  ep1_flavor.0021.a.tt.failure:0 "Chính tả [rival_monarch.GetPrimaryTitle.GetAdjectiveNoTooltip] là chuẩn nhất!"
  ep1_flavor.0021.b:0 "Chẳng phải họ là họ hàng ngôn ngữ của chúng ta sao?"
  ep1_flavor.0021.b.tt:0 "Cả hai [courts|E] tăng [SCOPE.ScriptValue('ep1_flavour_0021_courts_gain_opinion_value')|P0] [opinion|E] với nhau"
  ep1_flavor.0021.c:0 "Hai triều đình cao quý mà chẳng có nổi một bộ não ra hồn..."
  ep1_flavor.0021.c.tt:0 "$ep1_flavor.0021.a.tt$"
  cultural_acceptance_courtly_spelling_differences:0 "Quý tộc tranh cãi về chính tả"
  cultural_acceptance_courtly_cousins:0 "Quý tộc gắn kết nhờ ngôn ngữ triều đình chung"

  ep1_flavor.0031.t:0 "Gương Mặt Mới Tại Triều"
  ep1_flavor.0031.desc:0 "T'is well-said that great minds require great traditions, and there are no greater scholastic initiation traditions than those of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\n\nThis week marks the induction of several new, talented scholars to the court, drawn from all around the realm, every one of whom is currently being subjected to various #EMP academic#! tests at a local inn.\n\nMy gaze falls on [scholar_1.GetFirstName], as [scholar_1.GetSheHe] suspiciously eyes the mysterious, frothing, fizzing beverage sat in front of [scholar_1.GetHerHim]. Behind the wary scholar, [scholar_2.GetFirstName] is topping up an entire #EMP jug#! with something thick and oozy, to many cheers and jeers from [scholar_2.GetHerHis] fellow academicians."
  ep1_flavor.0031.a:0 "Uống đi, [scholar_1.GetFirstNameNoTooltip]!"
  ep1_flavor.0031.b:0 "Chúng ta thích uống với [scholar_2.GetFirstNameNoTooltip], vì [scholar_2.GetFirstNameNoTooltip] là chiến hữu của chúng ta!"
  ep1_flavor.0031.c:0 "Có những kỹ thuật mà chỉ kinh nghiệm mới dạy được..."
  ep1_flavor.0031.c.tt:0 "Ngài chỉ cho các học giả mới cách làm"
  ep1_flavor.0031.d:0 "Những nghi lễ này #EMP không xứng#! với giới học thuật."
  ep1_flavor.0031.inspire.scholar_1.tt:0 "[scholar_1.GetFirstNameNoTooltip] trở nên [inspired|E]"
  ep1_flavor.0031.inspire.scholar_2.tt:0 "[scholar_2.GetFirstNameNoTooltip] trở nên [inspired|E]"

 # Martial Exercise
  ep1_flavor.2000.t:0 "Luyện Tập Quân Sự"
  ep1_flavor.2000.desc_intro:0 "Khi Ta thị sát một doanh trại quân đội địa phương, rõ ràng [marshal_scope.GetTitledFirstName] và [knight_scope.GetTitledFirstName] đang cố dồn Ta vào thế phải quyết định. \n\n\"Thưa chúa thượng, binh lính sẽ trở nên nhàn rỗi khi hòa bình kéo dài; vài hoạt động sẽ giúp họ luôn sẵn sàng...\" vị [marshal_scope.GetCouncilTitle] của Ta gợi ý."
  ep1_flavor.2000.desc_archers:0 "\"Các [ROOT.Char.Custom('GetRegionalArcherMAA')|l] là không thể thiếu, chúng ta phải đảm bảo mũi tên của họ luôn trúng đích.\""
  ep1_flavor.2000.desc_infantry:0 "\"Quân [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] của ta là then chốt cho chiến thắng, không thể để họ trở nên mềm yếu.\""
  ep1_flavor.2000.desc_cavalry:0 "\"Các [ROOT.Char.Custom('GetRegionalCavalryMAA')|l] là tài sản quý giá nhất của ngài, đừng để họ trở nên cẩu thả.\""
  ep1_flavor.2000.desc_archer_cavalry:0 "\"Kỵ xạ là xương sống của quân đội; các cuộc thi bắn cung trên lưng ngựa sẽ giữ họ luôn đáng gờm.\""
  ep1_flavor.2000.desc_skirmishers:0 "\"Những [ROOT.Char.Custom('GetRegionalSkirmisherMAA')|l] tài năng của ta phải tranh tài, để họ luôn trúng đích.\""
  ep1_flavor.2000.desc_elephant_cavalry:0 "\"Những con voi đáng sợ mang lại chiến thắng cho ta; chúng phải luôn sẵn sàng.\""
  ep1_flavor.2000.desc_camel_cavalry:0 "\"Kỵ binh lạc đà là lực lượng nòng cốt, ngài phải tập trung vào họ.\""
  ep1_flavor.2000.desc_levies:0 "\"Đám dân đen cần hoạt động để khi được triệu tập thì đủ khỏe và hữu dụng.\""
  ep1_flavor.2000.desc_bridge:0 "\n\n\"Không, nỗ lực cần dành cho nơi khác.\" [knight_scope.GetFirstNameNoTooltip] xen vào,"
  ep1_flavor.2000.desc_outro:0 "\n\nTa cho rằng luyện tập #EMP quả thật#! tạo nên sự hoàn hảo..."
  ep1_flavor.2000.c:0 "\"Thể thao là dành cho giới quý tộc, và nó được gọi là săn bắn.\""
  ep1_flavor.2000.culture_tt:0 "Mọi cận thần và chư hầu thuộc [THIS.Char.GetCulture.GetName]"
  ep1_flavor.2000.knight_tt:0 "Mọi [THIS.Char.Custom('MountedWarriorTerm')|U]"
  ep1_flavor.2000.d:0 "\"Ta đã chi quá nhiều cho binh lính rồi.\""
  ep1_flavor.2000.archers:0 "\"Huấn luyện cho đến khi tất cả đều bắn trúng hồng tâm.\""
  ep1_flavor.2000.archers_longbow:0 "\"Từ trai trẻ đến người lớn đều phải luyện cung dài tại bãi tập.\""
  ep1_flavor.2000.infantry:0 "\"Quân [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] rất thích những trận ẩu đả.\""
  ep1_flavor.2000.cavalry:0 "\"Chuẩn bị cọc lều! Các [ROOT.Char.Custom('GetRegionalCavalryMAA')|l] sẽ lên ngựa!\""
  ep1_flavor.2000.cavalry_joust:0 "\"Đấu thương đòi hỏi kỹ thuật tốt.\""
  ep1_flavor.2000.cavalry_tzykanion:2 "\"Kỵ sĩ sẽ chơi tyzkanion!\""
  ep1_flavor.2000.cavalry_chovgan:0 "\"Hãy để họ chơi chovgan!\""
  ep1_flavor.2000.archer_cavalry:0 "\"Những kỵ sĩ thảo nguyên sẽ luyện tập bằng cách đuổi thỏ chạy.\""
  ep1_flavor.2000.skirmishers:0 "\"Quân [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] của ta chưa bao giờ bắn trượt.\""
  ep1_flavor.2000.elephant_cavalry:0 "\"Những quản tượng sẽ tranh tài vì vinh quang!\""
  ep1_flavor.2000.camel_cavalry:0 "Đua lạc đà sẽ rèn luyện kỹ năng cho kỵ sĩ lạc đà."
  ep1_flavor.2000.levies_caid:0 "\"Mọi [ROOT.Char.GetWomanMan] đều sẽ đá caid!\""
  ep1_flavor.2000.levies:0 "\"Khuyến khích dân thường giữ sự nhanh nhẹn.\""
