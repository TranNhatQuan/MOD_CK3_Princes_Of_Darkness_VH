 # Court of Vipers
  ep1_flavor.2010.t:0 "Triều Đình Rắn Độc"
  ep1_flavor.2010.desc:0 "Mỗi đêm, khi nến đã tắt và [ROOT.Char.Custom('FortifiedBuilding')] chìm vào im lặng, những lời thì thầm về một âm mưu nhằm [real_plot.GetSchemeType.GetTypeNameNoTooltip|l] ta lại ám ảnh khắp các gian phòng."
 # SPYMASTER
  ep1_flavor.2010.desc_spy_real:0 "[spymaster.GetCouncilTitleFirstName] tỏ ra chắc chắn rằng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))] của ta, [real_plotter.GetTitledFirstName], chính là kẻ đứng sau... \n\n"
  ep1_flavor.2010.desc_spy_1:0 "[spymaster.GetCouncilTitleFirstName] nói rằng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))] của ta, [scapegoat_1.GetTitledFirstName], có lẽ, #EMP có thể#! là kẻ chủ mưu... \n\n"
  ep1_flavor.2010.desc_spy_2:0 "[spymaster.GetCouncilTitleFirstName] gần như chỉ nửa tin nửa ngờ rằng [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))] của ta, [scapegoat_2.GetTitledFirstName], là kẻ đứng sau... \n\n"
 # COUNCILLOR 1
  ep1_flavor.2010.desc_1_real:0 "[councillor_1.GetCouncilTitleFirstName] riêng tư phản đối, cho rằng [real_plotter.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))] của ta, mới là kẻ đáng trách, trong khi"
  ep1_flavor.2010.desc_1_1:0 "[councillor_1.GetCouncilTitleFirstName] riêng tư phản đối, cho rằng mùi thối tha của [scapegoat_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))] của ta, đáng để điều tra, trong khi"
  ep1_flavor.2010.desc_1_2:0 "[councillor_1.GetCouncilTitleFirstName] riêng tư phản đối, cho rằng [scapegoat_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))] của ta, có dáng vẻ lén lút, trong khi"
 # COUNCILLOR 2
  ep1_flavor.2010.desc_2_real:0 "[councillor_2.GetCouncilTitleFirstName] thúc giục ta tống giam [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))] của ta, [real_plotter.GetTitledFirstName], \"kẻ phản bội hiển nhiên\", trước khi quá muộn.\n\n"
  ep1_flavor.2010.desc_2_1:0 "[councillor_2.GetCouncilTitleFirstName] thúc giục ta tống giam [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))] của ta, [scapegoat_1.GetTitledFirstName], \"bóng ma của [scapegoat_1.GetCurrentLocation.GetNameNoTooltip]\", trước khi quá muộn.\n\n"
  ep1_flavor.2010.desc_2_2:0 "[councillor_2.GetCouncilTitleFirstName] thúc giục ta tống giam [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))] của ta, [scapegoat_2.GetTitledFirstName], \"ác quỷ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]\", trước khi quá muộn.\n\n"
