  promoter_of_courtly_love_modifier: "Người Cổ Vũ Tình Yêu Cung Đình"
  promoter_of_courtly_love_modifier_desc: "Nhân vật này say sưa ca tụng Tình Yêu Thuần Khiết và Thi Ca Nhã Nhặn."
  scheme_promoter_of_courtly_love: "Triều Đình Tình Yêu: $VALUE|0=-+$"
  scheme_detractor_of_courtly_love: "Triều Đình Chối Bỏ Tình Yêu Cung Đình: $VALUE|0=-+$"
  court_9000.c.tt: "[GetScheme('seduce').GetTypeName] [schemes|E] tại triều đình của Ngài thành công hơn trong #P 20 năm#!"
  court_9000.b.tt: "[GetScheme('seduce').GetTypeName] [schemes|E] tại triều đình của Ngài kém thành công hơn trong #P 20 năm#!"
  knight_of_love_modifier: "Hiệp Sĩ Tình Yêu"
  knight_of_love_modifier_desc: "Nhân vật này đã chiến đấu vì tình yêu, và chiến thắng."
  fought_for_courtly_love_modifier: "Chiến Đấu Vì Tình Yêu Cung Đình"
  fought_for_courtly_love_modifier_desc: "Nhân vật này đã chiến đấu vì tình yêu, và thất bại. Dẫu vậy, họ đã thể hiện một tinh thần quả cảm đáng khâm phục!"
  promise_of_feasts_modifier: "Lời Hứa Về Những Yến Tiệc Sắp Tới"
  promise_of_feasts_modifier_desc: "Nhân vật này muốn chiều chuộng các cận thần bằng những bữa tiệc, và được yêu mến vì điều đó. Yến tiệc trở nên rẻ hơn đối với họ."
  more_work_less_fun_modifier: "Nhiều Việc Hơn, Ít Vui Hơn"
