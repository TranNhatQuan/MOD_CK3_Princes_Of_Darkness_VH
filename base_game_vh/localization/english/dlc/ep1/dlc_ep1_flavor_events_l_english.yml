 # Exotic Arms
  ep1_flavor.2040.t:0 "Vũ Khí Ngoại Lai"
  ep1_flavor.2040.desc:1 "Cùng với những món hàng kỳ lạ, các thương nhân còn mang theo những câu chuyện hoang đường từ những vùng đất xa xôi; không thể kiểm chứng; đầy điều kỳ diệu. \n\nMột nhóm lái buôn người [foreign_merchant.GetCulture.GetNameNoTooltip] khoe khoang rằng họ đã mang đến những vật phẩm '#EMP [exotic_blade_holder.GetCulture.GetNameNoTooltip]#!', được cho là xuất phát từ triều đình xa xôi của một vị đại quân vĩ đại: chính là '#EMP [exotic_blade_holder.GetFullNameNoTooltipRegnal]#!'. \n\n[foreign_merchant.GetTitledFirstName], kẻ dẫn đầu đoàn thương nhân, nở một nụ cười hiểm hóc,"
  ep1_flavor.2040.desc.artifact:0 "\"Ta đã thấy [my_artifact.GetName] của ngài, hãy giao nó cho Ta và Ta sẽ đổi cho ngài món [exotic_blade.Custom('ArtifactType')|l] độc nhất vô nhị này...\""
  ep1_flavor.2040.desc.gold:0 "\"Món [exotic_blade.Custom('ArtifactType')|l] độc đáo này có thể là của ngài — tất nhiên là với một mức giá đặc biệt — thưa [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại...\"\n\nQuả là một câu chuyện khó tin!"
  ep1_flavor.2040.desc.outro:0 "Giá như ta có cách nào đó để kiểm chứng câu chuyện của tên bán dạo này..."
  ep1_flavor.2040.desc.outro_antiquarian:1 "Ta quay sang [antiquarian.GetTitledFirstName] để xin lời khuyên:"
  ep1_flavor.2040.desc.outro_good_praise:1 "\"Quả thật đây không phải hàng giả, thưa bệ hạ, tác phẩm này đúng là của [exotic_blade_holder.GetPrimaryTitle.GetAdjectiveNoTooltip], và có chất lượng rất cao.\""
  ep1_flavor.2040.desc.outro_good_unsure:0 "\"Ta không quen thuộc với tay nghề của [exotic_blade_holder.GetPrimaryTitle.GetAdjectiveNoTooltip], nhưng món này có vẻ được chế tác tinh xảo.\""
  ep1_flavor.2040.desc.outro_good_warning:0 "\"Ta không thể khuyên bệ hạ mua món này, những... vết lõm do búa đập thì... đáng ngờ.\" [exotic_blade_holder.GetSheHe|U] gật đầu với ta một cách ngớ ngẩn."
  ep1_flavor.2040.desc.outro_bad_warning:0 "\"Dù có là của [exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip] đi nữa, đây vẫn là một món hàng kém chất lượng, thưa bệ hạ, ta rất nghi ngờ về nguồn gốc mà họ tuyên bố.\""
  ep1_flavor.2040.desc.outro_bad_unsure:0 "\"Ta không dám khẳng định chắc chắn, nhưng ta không tin món đồ này đúng như lời họ nói.\""
  ep1_flavor.2040.desc.outro_bad_praise:0 "\"Thật là một tác phẩm tuyệt vời của tay nghề [exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip]! Nhìn xem nó sáng bóng thế nào!\""
  ep1_flavor.2040.a:0 "\"Có lẽ ta có thể chia tay với nó...\""
  ep1_flavor.2040.tt_my:0 "Ngài sẽ mất [my_artifact.GetName] của mình"
  ep1_flavor.2040.tt_exotic:1 "Ngài sẽ trở thành chủ sở hữu của [exotic_blade.GetNameNoTooltip]"
  ep1_flavor.2040.toast:0 "Món [exotic_blade.Custom('ArtifactType')|l] thật lộng lẫy"
  ep1_flavor.2040.toast_poor:0 "Món [exotic_blade.Custom('ArtifactType')|l] khá tầm thường"
  ep1_flavor.2040.b:0 "\"Mang ví tiền của ta lại đây!\""
  ep1_flavor.2040.c:0 "\"Ha! '#EMP [exotic_blade_holder.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]#!'... toàn lời nhảm nhí! Cút đi!\""

 # The Greater Good
  ep1_flavor.2060.t:0 "Lợi Ích Chung"
  ep1_flavor.2060.desc:0 "[detective_scope.GetFirstName], một thuộc hạ địa phương của [sandford_scope.GetTitle.GetHolder.GetTitleAsNamePossessiveNoTooltip], xin được diện kiến riêng, khẳng định rằng anh ta biết kẻ đứng sau những vụ mất tích gần đây của [victim_scope.GetTitledFirstName] và nhiều lữ khách khác đến triều đình của ta. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Thần đã phát hiện ra một hội kín mờ ám do [grocer_scope.GetTitledFirstName], một thương nhân, cầm đầu. Chúng tự xưng là Đội Canh Gác [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], và những kẻ mà chúng cho là làm hoen ố sự huy hoàng của [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] thường sớm biến mất!\" \n\nKhi ta cho gọi tên lái buôn kia, [grocer_scope.GetSheHe] phủ nhận tất cả, cho rằng [detective_scope.GetWomanMan] đã phát điên vì quá nhiều năm lăn lộn trên những con phố khắc nghiệt của [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]..."
  ep1_flavor.2060.a:0 "\"Ta chắc chắn là có một lời giải thích hợp lý nào đó.\""
  ep1_flavor.2060.a.tt:0 "[detective_scope.GetFirstName] và [grocer_scope.GetFirstName] rời đi"
  ep1_flavor.2060.b:0 "\"Bắt giữ [grocer_scope.GetFirstNameNoTooltip], rồi đến làm việc cho ta!\""
  ep1_flavor.2060.b.title:0 "Kẻ nhiều chuyện đẫm máu"
  ep1_flavor.2060.c:0 "\"Thật đáng tiếc khi ngươi dính vào chuyện này, [detective_scope.GetFirstNameNoTooltip]...\""
  ep1_flavor.2060.c.title:0 "Chẳng bắt được tên sát nhân nào"
  ep1_flavor.2060.death_tt:0 "[victim_scope.GetName] đã biến mất một cách bí ẩn"

 # When Minds Collide
  ep1_flavor.2070.t:0 "Khi Những Tư Tưởng Va Chạm"
  ep1_flavor.2070.desc.intro:0 "Khi ta đi ngang qua thư viện, những lời càu nhàu bất mãn của [symposium_courtier.GetTitledFirstNamePossessive] khiến ta chú ý. [symposium_courtier.GetSheHe|U] đang tranh luận với [symposium_scholar.GetTitledFirstName], một [symposium_scholar.Custom('GetScholarType')|l] người [symposium_scholar.GetCulture.GetNameNoTooltip] đang ghé thăm, có chút danh tiếng. \n\n"
  ep1_flavor.2070.desc.theo_same_faith:0 ""You are making the same mistakes as [symposium_courtier.GetFaith.GetAdjectiveNoTooltip] initiates," [symposium_courtier.GetFirstNameNoTooltip] turns [symposium_courtier.GetHerHis] nose up, "truly, this is the way to heresy." \n\n"Come now," the [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] entreats, "surely [symposium_scholar.GetFaith.HighGodName] did not intend [symposium_scholar.GetHerHis] teachings be so immovable, especially when merely left to us to interpret.""
  ep1_flavor.2070.desc.theo_same_faith_diff_cult:0 ""I had no inkling of just how far [symposium_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip] [symposium_courtier.GetFaith.GetNameNoTooltip] had diverged from [symposium_scholar.GetFaith.HighGodNamePossessive] teachings!" [symposium_courtier.GetFirstNameNoTooltip] scoffs.\n\n"Nonsense," the [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] wags [symposium_scholar.GetHerHis] finger, "it is the [symposium_courtier.GetCulture.GetNameNoTooltip] [symposium_courtier.GetFaith.GetAdherentNamePluralNoTooltip] who have lost their way, backsliding into pagan practices.""
  ep1_flavor.2070.desc.theo_same_relig:0 "\"Sự khác biệt giữa [symposium_courtier.GetFaith.GetNameNoTooltip] và [symposium_scholar.GetFaith.GetNameNoTooltip] không chỉ là vấn đề kỹ thuật,\" [symposium_courtier.GetFirstNameNoTooltip] lên giọng giảng giải, \"dị giáo của ngươi đã rời xa [symposium_courtier.GetFaith.HighGodName].\"\n\n\"Bản chất chân thật của [symposium_courtier.GetFaith.GetReligion.GetNameNoTooltip] được bao hàm trong cả hai đức tin,\" [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] nói một cách nghiêm trang, \"chỉ có kẻ ngu dốt mới biến những lạch nước nhỏ thành vực sâu.\""
  ep1_flavor.2070.desc.theo_diff_relig:0 "\"Ta chưa bao giờ hiểu nổi giáo lý [symposium_scholar.GetFaith.GetReligion.GetAdjectiveNoTooltip],\" [symposium_courtier.GetFirstNameNoTooltip] trầm ngâm, \"[symposium_scholar.GetFaith.HighGodName] quả là một hình tượng kém thuyết phục so với [symposium_courtier.GetFaith.HighGodName].\"\n\n[symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] mỉm cười mỉa mai: \"Quả là sự thấu hiểu sâu sắc! Nếu ngươi là một [symposium_scholar.GetFaith.BishopNeuter], hẳn ngươi đã đạt tới [symposium_scholar.GetFaith.PositiveAfterLife]!\""
  ep1_flavor.2070.desc.mystic:0 "\"Những thực hành huyền bí này không có chỗ đứng trong lãnh thổ của [symposium_courtier.GetFaith.HighGodNamePossessive],\" [symposium_courtier.GetFirstNameNoTooltip] nghiêm khắc khiển trách, \"chỉ là trò khói và gương, ẩn mình sau màn bí hiểm.\" \n\n[symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] cười khinh miệt, \"ngươi chỉ sợ thứ mà ngươi không hiểu, và thiếu cả dũng khí lẫn trí tuệ để học hỏi.\""
  ep1_flavor.2070.desc.medicine:0 "\"Y thuật có ích của nó, nhưng chính [symposium_courtier.GetFaith.HighGodName] mới là kẻ có tiếng nói cuối cùng về sinh tử,\" [symposium_courtier.GetFirstNameNoTooltip] than thở, \"không loại thuốc đắp nào có thể chữa lành linh hồn.\" \n\n\"Ta thấy ngươi thiếu hiểu biết về y học,\" [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] thở dài, \"biết bao sinh mạng có thể được cứu nếu không có sự ngu muội ấy.\""
  ep1_flavor.2070.desc.ling_same_cult:1 "\"Chữ viết của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] phát triển vượt xa bất cứ thứ gì có thể tìm thấy ở [symposium_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip],\" [symposium_courtier.GetFirstNameNoTooltip] ngáp dài, \"khi rời đi, ngươi nên mang theo vài cuốn sách.\" \n\n\"Thật đáng kinh ngạc khi một người có thể sai lầm đến thế,\" [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] khịt mũi, \"lại còn nói với vẻ chắc nịch như vậy...\""
  ep1_flavor.2070.desc.ling_diff_cult:1 "\"Nhân danh [symposium_courtier.GetFaith.HighGodName], nghe chính ngươi nói kìa!\" [symposium_courtier.GetFirstNameNoTooltip] rùng mình, \"thứ phương ngữ [symposium_scholar.GetCulture.GetNameNoTooltip] này đang tàn phá ngôn ngữ tuyệt mỹ của [symposium_courtier.GetCulture.GetLanguage.GetNameNoTooltip], ngươi nói chuyện chẳng khác gì đang dùng [ling_cul_1_bonus.GetLanguage.GetNameNoTooltip]!\" \n\n[symposium_scholar.GetFirstNameNoTooltip] chỉnh lại [symposium_scholar.GetHerselfHimself], \"triều đình và ngôn ngữ của [symposium_ruler.GetTitledFirstNamePossessive] thuần khiết hơn gấp bội so với cái cớ tầm thường này cho một [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
  ep1_flavor.2070.desc.ling_diff_lang:2 ""Your foreign tongue lacks the nuances to discuss these ideas," [symposium_courtier.GetFirstNameNoTooltip] says scornfully, "this is of course why you learned #EMP [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]#!." \n\nThe [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] rolls [symposium_scholar.GetHerHis] eyes and disdainfully mutters some [symposium_scholar.GetCulture.GetLanguage.GetNameNoTooltip] oaths under [symposium_scholar.GetHerHis] breath."
  ep1_flavor.2070.desc.fall_alchemy:0 ""This ratio would never work," [symposium_courtier.GetFirstNameNoTooltip] shakes [symposium_courtier.GetHerHis] head, pouring over scratches in a piece of bark. "This has all been tried before." \n\nThe [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] replies "Everyone makes mistakes — even alchemists — they may have missed something.""
  ep1_flavor.2070.desc.fall_stars:0 "\"Không không không! Những học thuyết này đã bị bác bỏ từ hàng thế kỷ trước,\" [symposium_courtier.GetFirstNameNoTooltip] cau mày đầy khó tin, \"chẳng lẽ ngươi chưa từng đọc các kinh điển thiên văn học sao?\" \n\n\"Ngươi đọc mà không suy nghĩ,\" [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] phản bác, \"chúng ta vẫn còn rất nhiều điều phải học.\""
  ep1_flavor.2070.desc.fall_books:0 ""You have #EMP clearly#! been reading the wrong books," [symposium_courtier.GetFirstNameNoTooltip] says dismissively, "I'll give you a list of [symposium_courtier.GetCulture.GetNameNoTooltip] recommendations..." \n\n"That's quite alright," the [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] replies evenly, "there is #EMP clearly#! not much in them.""
  ep1_flavor.2070.a:0 "\"Này, ngươi có muốn ở lại thêm một thời gian không, [symposium_scholar.GetFirstNameNoTooltip]?\""
  ep1_flavor.2070.c:0 "\"Ngươi sai rồi: và đây là lý do.\""
  ep1_flavor.2070.c.lang:0 "\"Ngươi vừa nói điều mà ta nghĩ mình nghe thấy sao?\""
  ep1_flavor.2070.c.success:0 "Ngài chứng minh [symposium_scholar.GetFirstNameNoTooltip] sai"
  ep1_flavor.2070.c.failure:0 "[symposium_scholar.GetFirstNameNoTooltip] khiến Ngài bẽ mặt"
  ep1_flavor.2070.c.tt:0 "[symposium_scholar.GetFirstNameNoTooltip] có thể gia nhập triều đình của Ngài"
  ep1_flavor.2070.d:0 "\"Ta nghĩ đã đến lúc ngươi nên rời đi rồi, [symposium_scholar.Custom('GetScholarType')|l].\""
  ep1_flavor.2070.e:0 "Cút đi, kẻ báng bổ!"
  scholar_type_monk:0 "[ROOT.Char.Custom('NunMonk')]"
  scholar_type_fallback:0 "học trò"

