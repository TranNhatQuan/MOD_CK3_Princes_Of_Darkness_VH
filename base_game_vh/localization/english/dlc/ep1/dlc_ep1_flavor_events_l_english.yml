# Interservice Rivalry
  ep1_flavor.2020.t:0 "Cạnh Tranh Giữa Các Quân Chủng"
  ep1_flavor.2020.desc:0 "Một chút cạnh tranh lành mạnh giữa binh sĩ là điều tự nhiên, nhưng sự chia rẽ giữa [SCOPE.Custom('GetMAAType1')] và [SCOPE.Custom('GetMAAType2')] của ta thì quá rõ rệt. \n\nSự phát triển ấy thể hiện qua mối thù địch ngày càng tăng giữa các sĩ quan của họ, các [ROOT.Char.Custom('MountedWarriorTermPlural')] [knight_1.GetTitledFirstName] và [knight_2.GetTitledFirstName], những kẻ lại một lần nữa cãi cọ trước mặt ta. \n\n"
  ep1_flavor.2020.desc_knight_1_archers:0 ""...mong là các ngươi đừng hết tên; nếu vậy thì các ngươi sẽ phải #EMP thực sự#! chiến đấu!""
  ep1_flavor.2020.desc_knight_1_light_cavalry:0 ""...đánh rồi rút à? Với ta thì giống #EMP giật mình rồi chạy trốn#! hơn!""
  ep1_flavor.2020.desc_knight_1_heavy_infantry:0 ""...thật #EMP dũng cảm#! làm sao, khi được bọc giáp từ đầu đến chân!""
  ep1_flavor.2020.desc_knight_1_pikemen:0 ""...sao nào, sợ kẻ địch đến quá #EMP gần#! với ngươi à?""
  ep1_flavor.2020.desc_knight_1_heavy_cavalry:0 ""...ta hiểu rồi: tại sao phải #EMP chiến đấu#! với kẻ địch khi ngươi có thể giẫm nát chúng?""
  ep1_flavor.2020.desc_knight_1_archer_cavalry:0 ""...ngươi đã từng #EMP thấy#! kẻ địch bao giờ chưa, khi di chuyển nhanh như vậy và ở xa đến thế?""
  ep1_flavor.2020.desc_knight_1_skirmishers:0 ""...lại luyện tập để làm mềm đối phương cho những chiến binh #EMP thực sự#! à?""
  ep1_flavor.2020.desc_knight_1_elephant_cavalry:0 ""...gì cơ, chỉ cưỡi voi thôi à? Ngươi không muốn cưỡi thứ gì #EMP to hơn#! sao?""
  ep1_flavor.2020.desc_knight_1_camel_cavalry:0 ""Ngựa sa mạc ư? Theo ta thì giống #EMP bò#! hơn.""
  ep1_flavor.2020.desc_bridge:0 "[knight_2.GetFirstNameNoTooltip] nhếch mép cười, trước khi [knight_1.GetFirstNameNoTooltip] cay độc đáp trả:"
  ep1_flavor.2020.desc_knight_2_archers:0 ""Ôi làm ơn đi, ta không nhận bài học chiến đấu từ một thợ săn được tô vẽ đâu.""
  ep1_flavor.2020.desc_knight_2_light_cavalry:0 ""Ừ, lời đó thật có trọng lượng khi thốt ra từ một #EMP trinh sát#! được thổi phồng.""
  ep1_flavor.2020.desc_knight_2_heavy_infantry:0 ""Dễ nói lắm, khi khoác trên người thứ áo giáp #EMP dày#! như thế.""
  ep1_flavor.2020.desc_knight_2_pikemen:0 ""Ồ, đi mà trốn sau bức tường kim nhọn của ngươi đi, đồ ngốc.""
  ep1_flavor.2020.desc_knight_2_heavy_cavalry:0 ""Hừ, ngươi đã mất hết góc nhìn thực tế rồi, ngồi tít trên con chiến mã khổng lồ kia.""
  ep1_flavor.2020.desc_knight_2_archer_cavalry:0 ""Ta sẽ không nghe giảng đạo từ một #EMP kẻ thuần ngựa#! ảo tưởng cầm cung đâu.""
  ep1_flavor.2020.desc_knight_2_skirmishers:0 ""Hãy quay lại nói chuyện với ta khi ngươi thực sự rút kiếm, chứ đừng nói là dùng nó.""
  ep1_flavor.2020.desc_knight_2_elephant_cavalry:0 ""Nói bởi [knight_2.GetWomanMan] cưỡi trên lưng một con quái vật khổng lồ có ngà.""
  ep1_flavor.2020.desc_knight_2_camel_cavalry:0 ""Úi chà, tránh xa ta ra, mùi lạc đà nồng nặc quá.""
  ep1_flavor.2020.a:0 ""[SCOPE.Custom('GetMAAType1')] là xương sống của chúng ta!""
  ep1_flavor.2020.b:0 ""Không có [SCOPE.Custom('GetMAAType2')] thì chúng ta chẳng là gì cả!""
  ep1_flavor.2020.c:0 ""Một bên thì có ích gì nếu thiếu bên kia?""
  ep1_flavor.2020.c.success:0 "Lập luận của Ngài đầy thuyết phục"
  ep1_flavor.2020.c.failure:0 "Lập luận của Ngài không thuyết phục"
  ep1_flavor.2020.d:0 ""Hai người thôi đi.""
  ep1_flavor_2020_both_modifier:0 "Công Nhận Quân Sự"
  ep1_flavor_2020_both_modifier_desc:0 "Các hiệp sĩ của nhân vật này được thúc đẩy bởi sự thừa nhận của chủ quân về tầm quan trọng của binh lực họ."
  ep1_flavor_2020_archers_modifier:0 "$ep1_flavor_2020_generic_modifier$"
  ep1_flavor_2020_archers_modifier_desc:0 "$ep1_flavor_2020_generic_modifier_desc$"
