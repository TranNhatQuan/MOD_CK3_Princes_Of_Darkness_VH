  ep1_flavor_2030_boon_8_modifier:0 "Phán Quyết Trật Tự"
  ep1_flavor_2030_boon_8_modifier_desc:0 "$ep1_flavor_2030_boon_generic_modifier_desc$"
  ep1_flavor_2030_boon_9_modifier:0 "Phán Quyết Khoan Dung"
  ep1_flavor_2030_boon_9_modifier_desc:0 "$ep1_flavor_2030_boon_generic_modifier_desc$"
  ep1_flavor_2030_boon_10_modifier:0 "Phán Quyết Xây Dựng"
  ep1_flavor_2030_boon_10_modifier_desc:0 "$ep1_flavor_2030_boon_generic_modifier_desc$"
  ep1_flavor_2030_boon_generic_modifier_desc:0 "Di sản của một phán quyết pháp lý nhỏ nhưng mang tính tiền lệ của nhân vật này đã định hình vận mệnh của toàn cõi lãnh thổ."
