  ep1_flavor_2020_elephant_cavalry_modifier_desc:0 "$ep1_flavor_2020_generic_modifier_desc$"
  ep1_flavor_2020_camel_cavalry_modifier:0 "$ep1_flavor_2020_generic_modifier$"
  ep1_flavor_2020_camel_cavalry_modifier_desc:0 "$ep1_flavor_2020_generic_modifier_desc$"
  ep1_flavor_2020_generic_modifier:0 "Thiên Vị Quân Sự"
  ep1_flavor_2020_generic_modifier_desc:0 "Nhân vật này công khai thiên vị một bộ phận trong quân đội, khiến họ nỗ lực sống xứng đáng với danh tiếng đó."

 # Taking Sides
  ep1_flavor.2030.t:0 "Chọn Phe"
  ep1_flavor.2030.desc_intro:0 "Bộ máy quan liêu của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] thường cứ thế mà vận hành theo quán tính của nó, nhưng thỉnh thoảng hiếm hoi lại xuất hiện một vấn đề không có lời giải rõ ràng, trồi lên đầy khó chịu.\n\nHôm nay, đó là"
  ep1_flavor.2030.desc_1_monk:0 "[local_dispute_1.GetFirstName], một [local_dispute_1.Custom('NunMonk')] theo [local_dispute_1.GetFaith.GetAdjective] nổi tiếng tại [local_county_1.GetNameNoTier],"
  ep1_flavor.2030.desc_1_bishop:0 "[local_dispute_1.GetFirstName], [local_dispute_1.GetTitleAsNameNoTooltip] theo [local_dispute_1.GetFaith.GetAdjective] của [local_dispute_1.GetPrimaryTitle.GetNameNoTier],"
  ep1_flavor.2030.desc_1_baron:0 "[local_dispute_1.GetFirstName], [local_dispute_1.GetTitleAsNameNoTooltip] của [local_dispute_1.GetPrimaryTitle.GetNameNoTier],"
  ep1_flavor.2030.desc_1_scholar:0 "[local_dispute_1.GetFirstName], an eminent learned [local_dispute_1.GetWomanMan] in [local_county_1.GetNameNoTier],"
  ep1_flavor.2030.desc_1_culture:0 "[local_dispute_1.GetFirstName], một thủ lĩnh của cộng đồng thiểu số [local_dispute_1.GetCulture.GetName] tại [local_county_1.GetNameNoTierPossessive],"
  ep1_flavor.2030.desc_1_faith:0 "[local_dispute_1.GetFirstName], một nhân vật đại diện cho cộng đồng theo [local_dispute_1.GetFaith.GetAdjective] tại [local_county_1.GetNameNoTierPossessive],"
  ep1_flavor.2030.desc_1_judge:0 "[local_dispute_1.GetFirstName], một trọng tài địa phương danh tiếng của [local_county_1.GetNameNoTier],"
  ep1_flavor.2030.desc_1_captain:0 "[local_dispute_1.GetFirstName], một chỉ huy của đội đồn trú địa phương tại [local_county_1.GetNameNoTierPossessive],"
  ep1_flavor.2030.desc_1_merchant:0 "[local_dispute_1.GetFirstName], một thương nhân hàng đầu của [local_county_1.GetNameNoTier],"
  ep1_flavor.2030.desc_bridge:0 "và"
  ep1_flavor.2030.desc_2_monk:0 "[local_dispute_2.GetFirstName], một [local_dispute_2.Custom('NunMonk')] theo [local_dispute_2.GetFaith.GetAdjectiveNoTooltip] được kính trọng đến từ [local_county_2.GetNameNoTier],"
  ep1_flavor.2030.desc_2_bishop:0 "[local_dispute_2.GetFirstName], [local_dispute_2.GetTitleAsNameNoTooltip] theo [local_dispute_2.GetFaith.GetAdjective] của [local_dispute_2.GetPrimaryTitle.GetNameNoTier],"
  ep1_flavor.2030.desc_2_baron:0 "[local_dispute_2.GetFirstName], [local_dispute_2.GetTitleAsNameNoTooltip] của [local_dispute_2.GetPrimaryTitle.GetNameNoTier],"
  ep1_flavor.2030.desc_2_scholar:0 "[local_dispute_2.GetFirstName], a noted [local_dispute_2.GetWomanMan] of letters in [local_county_1.GetNameNoTier],"
  ep1_flavor.2030.desc_2_culture:0 "[local_dispute_2.GetFirstName], người phát ngôn cho cộng đồng thiểu số [local_dispute_1.GetCulture.GetName] tại [local_county_1.GetNameNoTierPossessive],"
  ep1_flavor.2030.desc_2_faith:0 "[local_dispute_2.GetFirstName], đại diện cho cộng đồng thiểu số theo [local_dispute_2.GetFaith.GetAdjective] tại [local_county_2.GetNameNoTierPossessive],"
  ep1_flavor.2030.desc_2_judge:0 "[local_dispute_2.GetFirstName], một thẩm phán [local_county_2.GetTierAsNameNoTooltip|l] lỗi lạc của [local_county_2.GetNameNoTier],"
  ep1_flavor.2030.desc_2_captain:0 "[local_dispute_2.GetFirstName], một viên quan tư pháp địa phương nổi tiếng của [local_county_2.GetNameNoTier],"
  ep1_flavor.2030.desc_2_merchant:0 "[local_dispute_2.GetFirstName], một thương nhân danh tiếng đặt cơ sở tại [local_county_2.GetNameNoTier],"
  ep1_flavor.2030.desc_outro:0 "những người đã liên tục đối đầu với nhau.\n\nĐầu óc ta quay cuồng bởi những chi tiết vụn vặt, và chẳng mấy chốc rõ ràng rằng không bên nào hoàn toàn đúng — và chỉ một người sẽ rời khỏi đây với sự hài lòng..."
  ep1_flavor.2030.a:0 "\"Ta phán quyết có lợi cho [local_dispute_1.GetTitledFirstNameNoTooltip].\""
  ep1_flavor.2030.b:0 "\"[local_dispute_2.GetTitledFirstNameNoTooltip] mới là người đúng.\""
  ep1_flavor.2030.c:0 ""[local_dispute_1.Custom('GetLocalRole')|U], I could use a [local_dispute_1.GetWomanMan] like you.""
  ep1_flavor.2030.c.tt:0 "[local_dispute_1.GetFirstNameNoTooltip] gia nhập triều đình của Ngài"
  ep1_flavor.2030.d:0 "\"Hãy đến làm việc cho ta, [local_dispute_2.Custom('GetLocalRole')|l].\""
  ep1_flavor.2030.d.tt:0 "[local_dispute_2.GetFirstNameNoTooltip] gia nhập triều đình của Ngài"
  ep1_flavor_2030_positive_modifier:0 "Đột Phá Địa Phương"
  ep1_flavor_2030_positive_modifier_desc:0 "Bá hạt này đã được xử thắng trong một tranh chấp địa phương với một nơi khác trong lãnh thổ."
  ep1_flavor_2030_negative_modifier:0 "Thất Bại Địa Phương"
  ep1_flavor_2030_negative_modifier_desc:0 "Bá hạt này đã bị xử thua trong một tranh chấp địa phương với một nơi khác trong lãnh thổ."
  ep1_flavor_2030_boon_1_modifier:0 "Phán Quyết Thuế Khóa"
  ep1_flavor_2030_boon_1_modifier_desc:0 "$ep1_flavor_2030_boon_generic_modifier_desc$"
  ep1_flavor_2030_boon_2_modifier:0 "Phán Quyết Tư Pháp"
