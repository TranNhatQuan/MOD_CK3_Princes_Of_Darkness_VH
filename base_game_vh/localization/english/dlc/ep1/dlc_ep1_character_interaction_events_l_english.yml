l_english:
 
 # Indebt Guest Loc
  ep1_character_interaction.0001.t:0 "Một Sự Đền Bù Hợp Lý"
  ep1_character_interaction.0001.desc.intro:0 "[recipient.GetFirstName] trông #EMP hoảng sợ tột độ#! khi hết người hầu này đến người hầu khác bị dẫn ra để buộc tội [recipient.GetHerHim], mỗi người đều khẳng định rằng [recipient.GetSheHe]"
  ep1_character_interaction.0001.desc.lustful:0 "đã làm ô uế không thể cứu vãn phần lớn số chăn nệm đắt tiền của triều đình,"
  ep1_character_interaction.0001.desc.chaste:0 "liên tục di chuyển hoặc che khuất những tác phẩm nghệ thuật mà [recipient.GetSheHe] cho là phản cảm, buộc họ phải mất hàng giờ mỗi ngày để sắp xếp lại mọi thứ và"
  ep1_character_interaction.0001.desc.gluttonous:0 "has eaten more by [recipient.GetHerselfHimself] than the rest of the court combined,"
  ep1_character_interaction.0001.desc.temperate:0 "has driven off three of our best cooks by turning [recipient.GetHerHis] nose up at dinner after dinner,"
  ep1_character_interaction.0001.desc.greedy:0 "bị trông thấy đang cắt xẻ những mảng kim loại quý khỏi các món đồ trang trí đắt giá nhất,"
  ep1_character_interaction.0001.desc.generous:0 "liên tục đem tài sản của triều đình cho đi như thể đó là của riêng [recipient.GetHerHis],"
  ep1_character_interaction.0001.desc.lazy:0 "chiếm dụng thời gian của họ cho những việc vặt vãnh nhiều hơn cả những công việc quan trọng,"
  ep1_character_interaction.0001.desc.diligent:0 "ép họ lặp đi lặp lại công việc đến mức hoàn hảo mà không quan tâm đến khối lượng nhiệm vụ,"
  ep1_character_interaction.0001.desc.wrathful:0 "ném phần lớn số ghế ngồi cá nhân của triều đình từ ban công của [recipient.GetHerHis],"
  ep1_character_interaction.0001.desc.calm:0 "hết tuần này sang tuần khác làm chậm bữa tối chỉ để trầm ngâm suy ngẫm xem [recipient.GetSheHe] thích món nào,"
  ep1_character_interaction.0001.desc.patient:0 "liên tục giao những nhiệm vụ phải mất hàng tuần, thậm chí hàng tháng mới xong,"
  ep1_character_interaction.0001.desc.impatient:0 "giao cho họ hàng trăm việc mỗi ngày, hiếm khi chờ một việc bắt đầu đã vội thêm việc khác và"
  ep1_character_interaction.0001.desc.arrogant:0 "từ chối để gia nhân thường làm việc cho [recipient.GetHerHim], nhất quyết chiếm dụng thời gian của đội ngũ chủ chốt và"
  ep1_character_interaction.0001.desc.humble:0 "only pretends to be humble, and actually spends [recipient.GetHerHis] time haughtily misdirecting the staff. The chaos is"
  ep1_character_interaction.0001.desc.deceitful:0 "dường như rất thích lan truyền thông tin sai lệch vô cớ, gieo rắc hỗn loạn khắp triều đình và"
  ep1_character_interaction.0001.desc.honest:0 "hằng ngày sỉ nhục họ bằng những nhận xét thẳng thừng về ngoại hình, thái độ và đạo đức làm việc. Riêng số nhân sự bị mất đã là"
  ep1_character_interaction.0001.desc.craven:0 "buộc họ phải rửa sạch từng món ăn [recipient.GetSheHe] dùng bằng xà phòng vì sợ bị đầu độc,"
  ep1_character_interaction.0001.desc.brave:0 "chưa bao giờ từ chối dù chỉ là cơ hội nhỏ nhất để đánh nhau, khiến phần lớn việc dọn dẹp phải do chính [recipient.GetHerselfHimself] gây ra và"
  ep1_character_interaction.0001.desc.shy:0 "liên tục hoảng loạn mỗi khi gia nhân bất ngờ xuất hiện trước mặt [recipient.GetHerHis], gây chậm trễ ở bất cứ nơi nào [recipient.GetSheHe] đi qua và"
  ep1_character_interaction.0001.desc.gregarious:0 "liên tục tổ chức những buổi tiệc riêng xa hoa bằng lương thực dự trữ của triều đình,"
  ep1_character_interaction.0001.desc.ambitious:0 "luôn ép họ phải đứng hàng giờ giữa đám đông để vỗ tay cho các bài diễn thuyết của [recipient.GetHerHis],"
  ep1_character_interaction.0001.desc.content:0 "không ngừng khuyến khích họ bỏ dở công việc hoặc không làm cho xong, khiến sau này còn phát sinh nhiều việc hơn và"
  ep1_character_interaction.0001.desc.arbitrary:0 "thường xuyên sai họ thực hiện những tội vặt vãnh thay cho [recipient.GetHerHis], dẫn đến các khoản tiền phạt"
  ep1_character_interaction.0001.desc.just:0 "đã báo cáo quá nhiều lỗi nhỏ nhặt trong số gia nhân đến mức họ dành nhiều thời gian cãi cọ về tội trạng hơn là làm việc,"
  ep1_character_interaction.0001.desc.cynical:0 "đã làm một việc không thể nhắc tên đối với cánh cửa của nơi thờ phụng riêng trong triều đình của [actor.GetFaith.HouseOfWorship],"
  ep1_character_interaction.0001.desc.zealous:0 "mỗi ngày đều chiếm hàng giờ của họ bằng những bài giảng và sự cuồng tín của [recipient.GetHerHis],"
  ep1_character_interaction.0001.desc.paranoid:0 "khăng khăng tự mình giám sát từng công việc vì sợ bị lừa gạt,"
  ep1_character_interaction.0001.desc.trusting:0 "liên tục đưa bọn lang băm và lừa đảo vào đại sảnh để chúng giở trò lừa gạt và cướp bóc,"
  ep1_character_interaction.0001.desc.compassionate:0 "đã đem gần như toàn bộ kho lương thực phân phát cho những kẻ ăn mày vô gia cư,"
  ep1_character_interaction.0001.desc.callous:0 "đã ngược đãi gia nhân không chút hối hận, khiến nhiều người bỏ đi và"
  ep1_character_interaction.0001.desc.sadistic:0 "tấn công một con dê đoạt giải bằng dao phay,"
  ep1_character_interaction.0001.desc.stubborn:0 "khiêu khích tranh cãi với đoàn tùy tùng của một quý tộc viếng thăm, khiến sự phá hoại"
  ep1_character_interaction.0001.desc.fickle:0 "lôi kéo hàng loạt người trong số họ bằng những yêu cầu thay đổi liên tục,"
  ep1_character_interaction.0001.desc.vengeful:0 "liên tục phá hủy đồ dùng bàn ăn đắt tiền chỉ vì thù vặt,"
  ep1_character_interaction.0001.desc.forgiving:0 "chỉ giả vờ là khoan dung, và thực chất $ep1_character_interaction.0001.desc.vengeful$"
  ep1_character_interaction.0001.desc.fallback_1:0 "đã cố gắng nuôi cả một đàn gà trong phòng riêng của [recipient.GetHerHis], gây thiệt hại"
  ep1_character_interaction.0001.desc.fallback_2:0 "đã phá nát hoàn toàn nhà vệ sinh riêng của ta, gây thiệt hại"
  ep1_character_interaction.0001.desc.fallback_3:0 "đã đổi một con ngựa giống đoạt giải của ta lấy một con dê “ma thuật”"
  ep1_character_interaction.0001.desc.fallback_4:0 "là kẻ duy nhất chịu trách nhiệm cho vụ hỏa hoạn thiêu rụi cánh tây,"
  ep1_character_interaction.0001.desc.fallback_5:0 "đã bôi bẩn ngai vàng của ta bằng những hình vẽ bậy mô tả tài sản của [recipient.GetHerHis],"
  ep1_character_interaction.0001.desc.outro:0 "(allegedly) costing me a small personal fortune.\n\nThe [recipient.GetWomanMan] has barely started stammering about [recipient.GetHerHis] innocence and a conspiracy when I hold up a hand.\n\n"Clearly you have transgressed, [recipient.GetFirstNameNoTooltip]. I #EMP could#! overlook your misdoings, if you were willing to make a #EMP small#! promise to me...""
  ep1_character_interaction.0001.a:0 "*Cười khằng khặc* Ồ đúng rồi, [actor_nemesis.GetFirstNameNoTooltip] sẽ không bao giờ ngờ tới đâu!"
  ep1_character_interaction.0001.b:0 "Tuyệt lắm! Giờ thì ngươi sẽ tự mình đến triều đình của [actor_rival.GetFirstNamePossessiveNoTooltip]..."
  ep1_character_interaction.0001.c:0 "Cút đi, cho đến khi ta cần đến ngươi!"
  ep1_character_interaction.0001.d:0 "Tất nhiên, ngươi sẽ ở lại nơi ta có thể để mắt tới."
