  weapon_inspiration:0 "Cảm hứng Vũ khí"
  weapon_inspiration_desc:1 "Một nhân vật có Cảm hứng Vũ khí được [inspired|E] để rèn một [artifact|E] vũ khí. Điều này có thể bao gồm từ kiếm đến giáo và sẽ được cầm trên tay."
  armor_inspiration:0 "Cảm hứng Giáp"
  armor_inspiration_desc:3 "Một nhân vật có Cảm hứng Giáp được [inspired|E] để rèn một [artifact|E] giáp hoặc khiên. Điều này có thể bao gồm từ áo xích đến giáp phiến."
  book_inspiration:0 "Cảm hứng Sách"
  book_inspiration_desc:1 "Một nhân vật có Cảm hứng Sách được [inspired|E] để viết và sản xuất một [artifact|E] sách. Chủ đề có thể rất đa dạng – cũng như chất lượng – nhưng kết quả sẽ là một quyển sách xứng tầm hoàng gia."
  weaver_inspiration:0 "Cảm hứng Dệt"
  weaver_inspiration_desc:1 "Một nhân vật có Cảm hứng Dệt được [inspired|E] để dệt một [artifact|E] thảm treo tường. Hình ảnh và cảnh vật được khắc họa có thể rất đa dạng – cũng như chất lượng – nhưng kết quả sẽ là một tấm thảm phù hợp để trang trí các bức tường trong [royal_court|E] của Ngài."
  adventure_inspiration:0 "Cảm hứng Phiêu lưu"
  adventure_inspiration_desc:0 "Một nhân vật có Cảm hứng Phiêu lưu được [inspired|E] để tham gia một cuộc phiêu lưu vĩ đại và mang về cho Ngài một [artifact|E]. Các hiện vật thu được có thể rất đa dạng, từ hộp sọ của quái thú hùng mạnh đến một bảo vật gia truyền bị đánh cắp."
  artisan_inspiration:0 "Cảm hứng Thợ thủ công"
  artisan_inspiration_desc:1 "Một nhân vật có Cảm hứng Thợ thủ công được [inspired|E] để áp dụng kiến thức chuyên môn của một kỹ năng cụ thể nhằm tạo ra một [artifact|E] có tay nghề bậc thầy. Thợ mộc và thợ may là những ví dụ về các chuyên môn của thợ thủ công."
  smith_inspiration:0 "Cảm hứng Thợ kim loại"
  smith_inspiration_desc:0 "Một nhân vật có Cảm hứng Thợ kim loại được [inspired|E] để rèn những vật xa hoa và nhỏ hơn so với kiếm hay giáp. Đây là những nghệ nhân tạo ra vương miện và chén thánh, lấp lánh và nạm đá quý."
  alchemy_inspiration:0 "Cảm hứng Giả kim"
  alchemy_inspiration_desc:0 "Một nhân vật có Cảm hứng Giả kim được [inspired|E] để khám phá, tinh luyện và tạo ra các chất và kim loại, chế tạo dược phẩm, và cuối cùng hoàn thiện thân xác và linh hồn con người."
  research_inspiration:0 "Cảm hứng Nghiên cứu"
  research_inspiration_desc:0 "Một nhân vật có Cảm hứng Nghiên cứu được [inspired|E] để khám phá tri thức mới vì lợi ích của [sponsor|E] của họ. Nếu thành công, họ sẽ cải thiện học vấn trong [dynasty|E] của người tài trợ hoặc thậm chí khám phá một [innovation|E] mới cho nền văn hóa của họ."
  bow_inspiration:0 "Cảm hứng Cung"
  bow_inspiration_desc:0 "Một nhân vật có Cảm hứng Cung được [inspired|E] để lắp dây cho một [artifact|E] cung. Điều này có thể bao gồm từ cung phức hợp đến nỏ và sẽ được cầm trên tay."

