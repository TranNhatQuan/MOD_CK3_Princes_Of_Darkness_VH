l_english:
 #Goguryeo Tomb
  building_type_goguryeo_tomb_01: "$building_goguryeo_tomb_01$"
  building_type_goguryeo_tomb_01_desc: "$building_goguryeo_tomb_01_desc$"
  building_goguryeo_tomb_01: "Lăng Mộ Vua Goguryeo"
  building_goguryeo_tomb_01_desc: "Ngôi lăng hình chữ nhật khổng lồ, xây bằng đá chạm tỉ mỉ, được cho là thuộc về một vị vua cổ Goguryeo, dù tên Ngài nay đã thất truyền. Những hành lang dẫn vào lăng được trang trí bằng bích họa nhiều màu, và trên đỉnh kim tự tháp vươn lên một gian lầu gỗ nhỏ để tôn vinh kẻ được chôn cất."
 #Great Buddha of Kamakura
  building_type_buddha_kamakura_01: "$building_buddha_kamakura_01$"
  building_type_buddha_kamakura_01_desc: "$building_buddha_kamakura_01_desc$"
  building_buddha_kamakura_01: "Đại Phật Kamakura"
  building_buddha_kamakura_01_desc: "Đức #italic Daibutsu#! Kamakura là pho tượng đồng trân quý của Phật A Di Đà, nặng nhiều tấn, chạm trổ trang trí mạ vàng. Ngài được đặt trong một đại điện lấy cảm hứng từ chùa Tây Nam, xung quanh có ba mươi hai cánh sen bao bọc."
 #Lingapura Pyramid
  building_type_pyramid_lingapura_01: "$building_pyramid_lingapura_01$"
  building_type_pyramid_lingapura_01_desc: "$building_pyramid_lingapura_01_desc$"
  building_pyramid_lingapura_01: "Kim Tự Tháp Lingapura"
  building_pyramid_lingapura_01_desc: "Kim tự tháp bậc thang khổng lồ này vươn lên từ rừng rậm như núi linh thiêng, bảy bậc mỗi tầng chứa những đền thờ và bàn thờ tinh xảo hơn. Thánh đường trên đỉnh tôn nghiêm bảo vệ #italic lingam#! của thần Shiva, trung tâm của bố cục trục phức tạp theo thiết kế tôn giáo."
 #Maijishan Grottoes
  building_type_maijishan_grottoes_01: "$building_maijishan_grottoes_01$"
  building_type_maijishan_grottoes_01_desc: "$building_maijishan_grottoes_01_desc$"
  building_maijishan_grottoes_01: "Hang Maijishan"
  building_maijishan_grottoes_01_desc: "Núi Maijishan từ lâu đã là nơi sùng bái, dọc vách phía Nam – nơi được xem là phong thủy tốt – hàng trăm điện thờ được khắc vào đá đỏ, đặt tượng Phật và bích họa nhiều màu. Nhiều công trình do các gia tộc thành thị gần đó tài trợ, nơi này cũng trở thành điểm hành hương và thiền định."
 #Three Pagodas of Dali
  building_type_three_pagodas_dali_01: "$building_three_pagodas_dali_01$"
  building_type_three_pagodas_dali_01_desc: "$building_three_pagodas_dali_01_desc$"
  building_three_pagodas_dali_01: "Tam Tháp Đại Lý"
  building_three_pagodas_dali_01_desc: "Từ quần thể chùa rộng lớn của gia tộc trị vì, ba ngọn tháp cao với tường gạch và đế đá vươn lên. Chúng tạo thành các đỉnh của một tam giác cân, đánh dấu hình học linh thiêng của khu vực, bao quát núi non và hồ nước xung quanh."
 #Iron Lion of Cangzhou
  building_type_iron_lion_cangzhou_01: "$building_iron_lion_cangzhou_01$"
  building_type_iron_lion_cangzhou_01_desc: "$building_iron_lion_cangzhou_01_desc$"
  building_iron_lion_cangzhou_01: "Sư Tử Sắt Cangzhou"
  building_iron_lion_cangzhou_01_desc: "Bức tượng sư tử đúc sắt đồ sộ, lớn nhất Trung Hoa, trên lưng uy nghiêng có Bồ Tát ngồi trên đài sen, chạm trổ mạ vàng tinh xảo. Nằm gần đồng bằng hay ngập lụt, bức tượng trở thành chỗ nương tựa chống lại triều cường cho dân địa phương."
 #Gaocheng Observatory
  building_type_dengfeng_observatory_01: "$building_dengfeng_observatory_01$"
  building_type_dengfeng_observatory_01_desc: "$building_dengfeng_observatory_01_desc$"
  building_dengfeng_observatory_01: "Đài Thiên Văn Gaocheng"
  building_dengfeng_observatory_01_desc: "Địa điểm này đã được ưu ái cho việc quan sát thiên văn nhiều thế kỷ, nhờ phong thủy và vị trí trung tâm tượng trưng trong Trung Hoa. Kiến trúc hiện tại hình thang, dùng như đồng hồ mặt trời rộng lớn, thước trung tâm cao vươn bóng vào rãnh chia sân, đo thời gian mặt trời đi qua."
 #Candi of Muara Takus
  building_type_muara_takus_01: "$building_muara_takus_01$"
  building_type_muara_takus_01_desc: "$building_muara_takus_01_desc$"
  building_muara_takus_01: "Candi Muara Takus"
  building_muara_takus_01_desc: "Quần thể đền thờ gồm nhiều công trình, toàn bộ xây gạch, trang trí chi tiết bằng sa thạch. Ở trung tâm vươn lên các tháp lớn #italic Mahligai#! và #italic Tuo#!, tháp trước cao gầy, tháp sau đồ sộ như núi, vượt lên các điện nhỏ và bậc thang quanh đó."
 #Stone Pagoda of Mireuksa
  building_type_stone_pagoda_01: "$building_stone_pagoda_01$"
  building_type_stone_pagoda_01_desc: "$building_stone_pagoda_01_desc$"
  building_stone_pagoda_01: "Tháp Đá Mireuksa"
  building_stone_pagoda_01_desc: "Tháp chín tầng, đứng trên đế đá rộng, tường gạch sáng dưới nắng. Đây là tháp đá đầu tiên của Hàn Quốc, hình dáng cân đối đã trở thành khuôn mẫu cho các kiến trúc chùa khắp bán đảo."
 #Thuriang Kilns
  building_type_thuriang_kilns_01: "$building_thuriang_kilns_01$"
  building_type_thuriang_kilns_01_desc: "$building_thuriang_kilns_01_desc$"
  building_thuriang_kilns_01: "Lò Gốm Thuriang"
  building_thuriang_kilns_01_desc: "Hơn hai trăm lò lớn phủ khắp khu vực, trung tâm sản xuất celadon lớn nhất vùng. Gốm nung tại đây nổi tiếng thô, cứng, men vàng xanh đặc trưng, giao thương khắp Đông Nam Á."
 #Yuelu Academy
  building_type_yuelu_academy_01: "$building_yuelu_academy_01$"
  building_type_yuelu_academy_01_desc: "$building_yuelu_academy_01_desc$"
  building_yuelu_academy_01: "Học Viện Yuelu"
  building_yuelu_academy_01_desc: "Một trong những học viện danh giá bậc nhất Trung Hoa, Yuelu lâu nay là trung tâm học tập và khảo hạch. Bố cục xoay quanh sân chính, từ đó nối ra các đại sảnh và lầu, nơi các thế hệ học giả chuẩn bị cho thi cử quan lại, tạo cân xứng hài hòa."
 #Chocolate Hills #NOTE: today are called "Chocolate" Hills, but of course chocolate didn't exist in the Philippines back then. This is a random name I thought out, but it is not based on native names (none of which seem to have survived from then)
  building_type_chocolate_hills_01: "$building_chocolate_hills_01$"
  building_type_chocolate_hills_01_desc: "$building_chocolate_hills_01_desc$"
  building_chocolate_hills_01: "Đồi Nâu Đỏ"
  building_chocolate_hills_01_desc: "Dạng địa chất gồm nhiều đồi hình nón tròn, trải dài đồng đều. Lớp cỏ phủ bên ngoài, mùa khô chuyển sang nâu và cam rực rỡ, khiến địa hình như nhuốm sắc thu lạ thường."
 #Fanfang of Guangzhou
  building_type_fanfang_guangzhou_01: "$building_fanfang_guangzhou_01$"
  building_type_fanfang_guangzhou_01_desc: "$building_fanfang_guangzhou_01_desc$"
  building_fanfang_guangzhou_01: "Fanfang Quảng Châu"
  building_fanfang_guangzhou_01_desc: "#italic Fanfang#! là cộng đồng thương nhân ngoại quốc quan trọng – chủ yếu là người Hồi Ả Rập và Ba Tư đến qua thương lộ biển – được cấp quận riêng phía tây thành phố, với quan chức và hải quan riêng. Trung tâm có đền thờ đỏ tường, tháp cao chỉ dẫn tàu thuyền và linh hồn về cảng an toàn."
 #Wilwatikta Palace
  building_type_wilwatikta_palace_01: "$building_wilwatikta_palace_01$"
  building_type_wilwatikta_palace_01_desc: "$building_wilwatikta_palace_01_desc$"
  building_wilwatikta_palace_01: "Cung Điện Wilwatikta"
  building_wilwatikta_palace_01_desc: "Quần thể cung điện rộng lớn gồm lầu, điện, đền và sân, Wilwatikta đồ sộ tựa một thành phố riêng. Tường gạch chữ nhật bao quanh, cổng đại lộ nghi lễ đánh dấu bằng các cổng #italic Paduraksa#! cao vút."
 #Ha Long Bay
  building_type_ha_long_bay_01: "$building_ha_long_bay_01$"
  building_type_ha_long_bay_01_desc: "$building_ha_long_bay_01_desc$"
  building_ha_long_bay_01: "Vịnh Hạ Long"
  building_ha_long_bay_01_desc: "Cảnh quan tuyệt mỹ với đảo đá vôi vươn lên từ nước xanh ngọc, nơi ngư dân địa phương dập dềnh tìm cá dưới bóng cột đá."
 #My Son Sanctuary
  building_type_my_son_sanctuary_01: "$building_my_son_sanctuary_01$"
  building_type_my_son_sanctuary_01_desc: "$building_my_son_sanctuary_01_desc$"
  building_my_son_sanctuary_01: "Thánh Địa Mỹ Sơn"
  building_my_son_sanctuary_01_desc: "Quần thể đền Cham lớn nhất và tinh xảo, gồm nhiều khu rải rác trong rừng, mỗi nơi có cổng, điện, và tháp. Công trình xây gạch đỏ, theo hình học, trang trí trụ sa thạch."
 #Gunung Api
  building_type_gunung_api_01: "$building_gunung_api_01$"
  building_type_gunung_api_01_desc: "$building_gunung_api_01_desc$"
  building_gunung_api_01: "Gunung Api"
  building_gunung_api_01_desc: "Ngọn núi vươn lên từ rừng rậm, linh thiêng với dân địa phương. Giữa sương mù ẩm ướt, sườn núi đầy mỏm đá vôi và hang sâu được nước bào mòn qua nhiều thời đại."
 #Sulawesi Megaliths
  building_type_suwalesi_megaliths_01: "$building_suwalesi_megaliths_01$"
  building_type_suwalesi_megaliths_01_desc: "$building_suwalesi_megaliths_01_desc$"
  building_suwalesi_megaliths_01: "Megalith Sulawesi"
  building_suwalesi_megaliths_01_desc: "Rải rác khắp thung lũng Trung Sulawesi, nhiều tượng khổng lồ được dân địa phương dựng cho nghi lễ và tôn linh. Các pho tượng, gọi là #italic arcas#!, khắc tinh giản, hình dáng uốn lượn thanh lịch."
 #Izumo Taisha
  building_type_izumo_taisha_01: "$building_izumo_taisha_01$"
  building_type_izumo_taisha_01_desc: "$building_izumo_taisha_01_desc$"
  building_izumo_taisha_01: "Izumo Taisha"
  building_izumo_taisha_01_desc: "Đền Shinto lớn – #italic taisha#! – xây gần bờ biển, hướng ra biển. Trên trụ gỗ khổng lồ, nâng điện cao trên mặt đất, nơi phàm nhân đi lại, và vươn lên trời, nơi thần linh cư ngụ."
 #Temple of Confucius
  building_type_confucius_temple_01: "$building_confucius_temple_01$"
  building_type_confucius_temple_01_desc: "$building_confucius_temple_01_desc$"
  building_confucius_temple_01: "Đền Khổng Tử"
  building_confucius_temple_01_desc: "Ngôi đền Khổng Tử cổ xưa và có ảnh hưởng nhất, quần thể đại sảnh và sân rộng lớn, là hình mẫu cho kiến trúc đền khắp Trung Hoa và xa hơn, với bố cục hình học hài hòa và chi tiết tinh xảo. Gần đó là rừng yên tĩnh, nơi mộ Khổng Tử và hậu duệ, trở thành điểm hành hương quan trọng."
 #Imperial Citadel of Lin'an
  building_type_citadel_linan_01: "$building_citadel_linan_01$"
  building_type_citadel_linan_01_desc: "$building_citadel_linan_01_desc$"
  building_citadel_linan_01: "Kinh Thành Lin'an"
  building_citadel_linan_01_desc: "Xây ven sườn Bắc đồi Phượng Hoàng, kinh thành là chỗ ngự của triều đình và quan lại, chứa học giả và quan viên trong các đại sảnh và hành lang rộng lớn. Dù không rộng bằng các cung điện Bắc Kinh, sự tinh tế của vườn bậc thang và lầu các cũng sánh ngang."
 #The Temples of Angkor
  building_type_temples_angkor_01: "$building_temples_angkor_01$"
  building_type_temples_angkor_01_desc: "$building_temples_angkor_01_desc$"
  building_temples_angkor_01: "Đền Angkor"
  building_temples_angkor_01_desc: "Tại thành Indra thịnh vượng, mái vàng và chóp đền vô số, mỗi đền trang trí công phu với điêu khắc và tượng thần và devarajas."
  building_temples_angkor_02: "Angkor Wat"
  building_temples_angkor_02_desc: "Angkor Wat là quần thể đền thờ khổng lồ dâng lên thần Vishnu, mô phỏng núi Meru – chốn ở của thần trong thần thoại Hindu. Quần thể bao quanh bởi hào rộng, nhiều điện rải khắp, ngập tràn nghệ thuật, tượng và phù điêu tôn giáo."
