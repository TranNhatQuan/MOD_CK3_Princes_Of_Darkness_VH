l_english:
 # dlc_fp2_flavor_events_oltner
	rice_fields_modifier:0 "Ruộng Lúa"
	rice_fields_modifier_desc:1 "Nông dân ở Bá tước lĩnh này đang trồng loại lúa bổ dưỡng, giúp họ no đủ và truyền cảm hứng cho những món ăn mới."
	fp2_flavor.0001.t:0 "Một Vụ Mùa Ý Tưởng Mới"
	fp2_flavor.0001.desc:0 "Thủ đô của [rice_propagator.GetTitledFirstNamePossessive] thực sự rất thịnh vượng. Nông dân ở [rice_propagator_capital.GetNameNoTier] béo tốt và vui vẻ – và #EMP năng suất!#!\n\nNgười Hồi giáo đã mang đến một loại cây trồng mới cho vùng đất của họ: lúa gạo. Nó dễ trồng và nuôi sống dân chúng rất tốt. Phải chăng đây là một phần bí quyết thành công của họ? Ta cũng không phiền nếu nông dân của mình trở nên năng suất hơn...\n\nCó lẽ ta nên lập ruộng lúa tại chính thủ đô của mình? Nhưng nên bắt đầu thế nào?"
	fp2_flavor.0001.a:0 "Vàng sẽ làm [rice_propagator.GetFirstNamePossessiveNoTooltip] mở miệng."
	fp2_flavor.0001.b:0 "Chắc hẳn [rice_propagator.GetSheHe] sẽ vui vẻ chia sẻ với một người Ngài?"
	fp2_flavor.0001.c:0 "Bí mật đó sẽ thuộc về ta... cử một mật vụ."
	fp2_flavor.0001.d:0 "Quên đi, ta sẽ không giao thiệp với người Hồi giáo."
	fp2_flavor.0001.b.success:0 "Ngài thuyết phục thành công [rice_propagator.GetHerHim]"
	fp2_flavor.0001.b.failure:0 "[rice_propagator.GetFirstNameNoTooltip] bị xúc phạm"
	fp2_flavor.0001.c.success:0 "Mật vụ của Ngài đánh cắp được bí mật"
	fp2_flavor.0001.c.failure:0 "[rice_propagator.GetFirstNameNoTooltip] vô cùng tức giận"

