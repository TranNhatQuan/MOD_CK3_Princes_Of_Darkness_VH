	##### Intro #####
	fp2_struggle.0501.t:1 "$iberian_struggle$"
	fp2_struggle.0501.desc:1 "Bán đảo Iberia đang chìm trong hỗn loạn, một cuộc xung đột sinh ra từ quá khứ đầy biến động của nó. Những kẻ ngoại bang thèm khát vùng đất này và các thế lực Hồi giáo cùng Kitô giáo hùng mạnh tìm cách lôi kéo người dân nơi đây. Nhưng những người sống và chết trên mảnh đất này cuối cùng sẽ quyết định số phận của nó.\n\n"
	fp2_struggle.0501.desc.involved:0 "Ta sẽ không để tầm nhìn về quê hương của mình tuột khỏi tay. Nhân danh [ROOT.Char.GetFaith.HighGodName], Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip] sẽ vượt qua cơn bão và ý chí của ta sẽ được thực hiện.\n\n"
	fp2_struggle.0501.desc.interloper:0 "Đã đến lúc ta nắm lấy tình thế và số phận của mình. Ta thấy mọi quân cờ đã được bày trên bàn. Ta biết con đường phía trước, và sẽ không gì có thể ngăn cản Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip].\n\n"
	fp2_struggle.0501.desc.mottocall:0 "[ROOT.Char.GetHouse.GetMotto]!"
	fp2_struggle.0501.a:0 "Nắm lấy số phận!"

	##### Hostility #####
	# Struggle Ender
	fp2_struggle.0900.t:0 "$struggle_iberia_ending_hostility_decision$"
	fp2_struggle.0900.opening.basque:0 "Chúng ta, người [ROOT.Char.GetCulture.GetNameNoTooltip], đã chịu đựng hàng thế kỷ bị xâm lấn: Visigoth, Gaul, Moor... nhưng theo thời gian, sức mạnh của từng kẻ đều suy tàn. Hôm nay, số phận của Iberia một lần nữa nằm trong tay #EMP chúng ta#!."
	fp2_struggle.0900.opening.andalusian:0 "Lịch sử của dân tộc chúng ta phức tạp như sự đa dạng của chính chúng ta, và đầy thử thách như sức mạnh của chúng ta. Tương lai của Iberia một lần nữa sẽ được quyết định bởi những người thừa kế nhà Umayyad."
	fp2_struggle.0900.opening.iberian:0 "Đã quá lâu người dân Iberia phải chịu đựng dưới tay những kẻ xâm lược Moor; hôm nay chúng ta sẽ khôi phục niềm hy vọng mà những người thừa kế chính đáng của La Mã đã đánh mất từ nhiều thế kỷ trước."
	fp2_struggle.0900.opening:0 "Sự hỗn loạn mà Iberia phải chịu đựng trong những thế kỷ trước đã để lại vết nhơ trong trái tim của mọi cư dân. Hôm nay mở ra chương tiếp theo của bán đảo này..."
	fp2_struggle.0900.desc:0 "\n\nGiờ đây không còn vương quốc nào có thể thực sự thách thức sự thống trị của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] tại Iberia, hay các giáo sĩ và người định cư mang lời dạy của [ROOT.Char.GetFaith.HighGodName] cùng nền văn minh [ROOT.Char.GetCulture.GetName] đến các ngôi làng.\n\nTất cả những gì còn lại là tuyên bố chiến thắng này, sau khi đã quyết định cách chúng ta sẽ tiếp tục cai trị."
	fp2_struggle.0900.a:0 "Đây sẽ là vùng đất của [ROOT.Char.GetFaith.HighGodNameAlternate]!"
	fp2_struggle.0900.b:0 "Việc định cư bán đảo này sẽ là trọng tâm của chúng ta."
	fp2_struggle.0900.c:1 "[ROOT.Char.GetFaith.HighGodName] đã trao Iberia cho người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
	# Other Players
	fp2_struggle.0910.opening.involved:0 "Dù điều này đến từ một vương quốc khác, sự giải thoát khỏi bất ổn đã bao trùm vùng đất này suốt nhiều thế kỷ có lẽ đang đến gần..."
	fp2_struggle.0910.opening:0 "Tin tức về những diễn biến gần đây tại bán đảo Iberia đã đến triều đình của chúng ta, hứa hẹn chấm dứt những cuộc xung đột đã tàn phá vùng đất này."
	fp2_struggle.0910.desc:0 "\n\n[struggle_ender.GetName], người hiện kiểm soát phần lớn bán đảo, đã tuyên bố [struggle_ender.GetHerselfHimself] là người chiến thắng cuối cùng của cuộc đấu tranh đã được khởi đầu từ lâu bởi cuộc xâm lược của người Moor.\n\n"
	fp2_struggle.0910.closing.faith:0 "[struggle_ender.GetSheHe|U] đã tuyên bố Iberia là vùng đất của người [struggle_ender.GetFaith.GetAdjective], và rằng, nếu [struggle_ender.GetFaith.HighGodName] cho phép, mọi kẻ dị giáo và ngoại đạo sẽ bị trục xuất khỏi lãnh địa của [struggle_ender.GetHerHis]."
	fp2_struggle.0910.closing.culture:0 "[struggle_ender.GetSheHe|U] đã tuyên bố Iberia thuộc về người [struggle_ender.GetCulture.GetName], và rằng mọi kẻ xâm lược ngoại bang cùng các dân tộc bị khuất phục phải chấp nhận thực tế này."
	fp2_struggle.0910.closing.combined:0 "[struggle_ender.GetSheHe|U] đã tuyên bố Iberia và [struggle_ender.GetPrimaryTitle.GetNameNoTier] là một và như nhau, nay được trao vào tay người [struggle_ender.GetFaith.GetAdjective] [struggle_ender.GetCulture.GetName] bởi [struggle_ender.GetFaith.HighGodName]..."
	fp2_struggle.0910.a:0 "Chuyện này chưa kết thúc."
	fp2_struggle.0910.b:0 "Thật thú vị."
	##### Compromise #####
	# Struggle Ender
	fp2_struggle.0901.t:0 "$struggle_iberia_ending_compromise_decision$"
	fp2_struggle.0901.desc:1 "\n\nGiờ đây đã rõ rằng sẽ không có hồi kết cho vòng xoáy đổ máu này nếu mọi thứ tiếp diễn; bán đảo này sẽ không chịu nổi sự thống nhất.\n\nChúng ta phải hài lòng với [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], và để các thế lực khác ở Iberia tự lo liệu — ít nhất là vào lúc này..."
	fp2_struggle.0901.a:0 "Đây là lựa chọn tốt nhất."
	fp2_struggle.0901.tt:0 "[THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier] đã trở thành một [de_jure|E] [empire|E]"
	# Other Players
	fp2_struggle.0911.desc:0 "\n\n[struggle_ender.GetTitledFirstName] đã chính thức từ bỏ mọi ý định thống nhất bán đảo dưới một vương miện chung, và tuyên bố bất kỳ ai cố làm điều đó đều là kẻ không chính danh.\n\nNhững vương quốc khác nhau được hình thành qua nhiều thế kỷ xâm lược và tái chinh phục giờ đã quá ăn sâu để có thể hợp nhất."
	fp2_struggle.0911.a:0 "Chúng ta sẽ không quên giấc mơ Hispania..."
	##### Conciliation #####
	# Struggle Ender
	fp2_struggle.0902.t:0 "$struggle_iberia_ending_conciliation_decision$"
	fp2_struggle.0902.desc:0 "\n\nMột lời thề bảo hộ — mà giờ chỉ mình ta có thể thực thi — sẽ đảm bảo các dân tộc đa dạng của vùng này có thể sống và thờ phụng tự do.\n\n[ROOT.Char.GetFaith.HighGodName] cho phép, những cuộc chiến của quá khứ sẽ ở lại trong quá khứ, và các vương công Iberia khác sẽ nhận ra lợi ích của việc cùng tồn tại."
	fp2_struggle.0902.a:0 "Hãy cử sứ giả."
	# Other Players
	fp2_struggle.0912.desc:0 "\n\nCác sứ giả của [struggle_ender.GetPrimaryTitle.GetAdjectiveNoTooltip] đã tuyên bố đảm bảo quyền tự do đi lại và thờ phụng cho tất cả mọi người, do [struggle_ender.GetTitledFirstName] thực thi, nhận được sự hoan nghênh rộng rãi từ dân chúng.\n\nNhiều người từ lâu đã mong chờ chấm dứt đổ máu ở Iberia; có lẽ #EMP hòa bình này#! sẽ là một nền hòa bình lâu dài."
	fp2_struggle.0912.a:0 "Quả là bất ngờ."

 # fp2_event_dan
	fp2_yearly.1001.t:0 "Cờ Vua Hai"
	fp2_yearly.1001.desc:0 "Sau khi lại thắng thêm một ván cờ trước chính mình, ta không khỏi nghĩ rằng trí tuệ vượt trội của mình có lẽ có thể cải tiến trò chơi này đôi chút. \n\nNhưng thay đổi nào sẽ hợp lý nhất?"
	fp2_yearly.1001.a:0 "Rõ ràng Vua quá yếu."
	fp2_yearly.1001.b:0 "Tượng nên mạnh hơn."
	fp2_yearly.1001.c:0 "Tại sao ta không thể tra tấn các quân tốt?"


	fp2_yearly.1002.t:0 "Một Tình Thế Khó Xử"
	fp2_yearly.1002.desc:1 "Đêm khuya, ta nghe thấy những âm thanh kỳ lạ phát ra từ một căn phòng ở cuối hành lang. Khi hé nhìn qua cửa, ta thấy [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)] của mình trần truồng, bị trói và đang bị một người hầu đánh bằng roi gỗ, Bạn ta dường như đang mặc vài bộ quần áo cũ của ta. Nếu vậy còn chưa đủ kỳ lạ, thì [deviant_courtier.GetSheHe] dường như còn đang thích thú với chuyện đó.\n\nGiữa những cú đánh, [deviant_courtier.GetSheHe] hét lên: "Đúng rồi! Hãy trừng phạt ta đi [ROOT.GetCharacter.GetNameNoTooltip], ta là một [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)] hư hỏng!""
	fp2_yearly.1002.b:0 "Ta ngửi thấy mùi tư liệu tống tiền."
	fp2_yearly.1002.c:0 "Trông có vẻ vui đấy!"
	fp2_yearly.1002.a:0 "Ta sẽ lặng lẽ rời đi."
 

	fp2_yearly.1003.t:0 "Đấu Với... Người Khổng Lồ?"
	fp2_yearly.1003.desc:0 "Một sự náo loạn trong sân của ta thu hút sự chú ý khi [injured_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] được vài nông dân khiêng vào. [injured_knight.GetSheHe|U] rõ ràng bị thương nặng.\n\nKhi ta yêu cầu họ giải thích chuyện gì xảy ra, những nông dân nói rằng họ tìm thấy [injured_knight.GetHerHim] ngoài cánh đồng nơi [injured_knight.GetSheHe] khẳng định vừa mới chiến đấu và đánh bại một gã khổng lồ.\n\nSau khi câu chuyện kết thúc, cận vệ của anh ta kéo ta sang một bên: "Sự thật là [injured_knight.GetSheHe] đã cố đấu thương với một cối xay gió và thua, thưa ngài, nhưng những người làng này dường như rất tin vào câu chuyện của [injured_knight.GetHerHis].""
	fp2_yearly.1003.a:0 "Tôn vinh hiệp sĩ dũng cảm! Ta sẽ mua cho [injured_knight.GetHerHim] một chiến mã mới."
	fp2_yearly.1003.b:0 "Triều đình của ta không dung thứ những câu chuyện hoang đường."

	fp2_yearly.1004.t:0 "Con Diều Hâu của Quraysh"
	fp2_yearly.1004.desc:0 "Ta đang đọc một cuốn lịch sử về [hawk_of_quraysh.GetName], còn được biết đến với cái tên "Con Diều Hâu của Quraysh".\n\nTìm hiểu về cuộc đời ông ta thật truyền cảm hứng, từ cuộc trốn thoát khỏi [abbasid_dynasty.GetName], cho đến việc lập nên triều đại [hawk_dynasty.GetName] ở Iberia, khiến ta không khỏi nghĩ rằng mình cũng nên học theo phần nào."
	fp2_yearly.1004.a:0 "Ta cũng có thể truyền cảm hứng cho binh lính như ông đã làm ở Carmona."
	fp2_yearly.1004.b:0 "Những thương thuyết ngoại giao của ông với người Yemen thật huyền thoại."
	fp2_yearly.1004.c:0 "Chúng ta có họ hàng!"

	nick_the_hawk_of_quraysh:0 "Con Diều Hâu của Quraysh"


 fp2_hawk_of_quraysh_martial_modifier:0 "Martial Inspiration"
 fp2_hawk_of_quraysh_martial_modifier_desc:0 "This character has gained martial inspiration from the Hawk of Quraysh."


 fp2_hawk_of_quraysh_diplomacy_modifier:0 "Diplomatic Inspiration"
 fp2_hawk_of_quraysh_diplomacy_modifier_desc:0 "This character has gained diplomatic inspiration from the Hawk of Quraysh."

	fp2_yearly.1005.t:0 "Người Viking Lạc Lối"
	fp2_yearly.1005.desc:0 "Vừa giãy giụa vừa la hét, một [hidden_viking.GetWomanMan] to lớn bị lôi đến trước mặt ta. [hidden_viking.GetSheHe|U] rõ ràng là một kẻ cướp Viking, loại đã gieo rắc hỗn loạn trong lãnh địa của chúng ta suốt nhiều thập kỷ.\n\n"Xin hãy thương xót. Tên Ta là [hidden_viking.GetName] và Ta đã sống ở [viking_county.GetNameNoTooltip] nhiều năm rồi. Ta bị bỏ lại vì bị thương. Dân làng đã cứu Ta; giờ họ là gia đình của Ta."\n\nNgười Viking quỳ sụp xuống, hy vọng ta sẽ tha mạng cho [hidden_viking.GetHerHis]. Vài nông dân xác nhận câu chuyện của [hidden_viking.GetHerHis]."
	fp2_yearly.1005.a:1 "Ngươi có thể kể câu chuyện độc đáo của mình để giải trí cho các cận thần của ta."
	fp2_yearly.1005.b:0 "Một việc tốt không thể xóa bỏ tội lỗi — ngươi phải chết."
	fp2_yearly.1005.c:0 "Nếu ngươi phục vụ ngôi làng, tạm thời ngươi có thể sống."


	fp2_yearly.1006.t:0 "Phô Mai Viking?"
	fp2_yearly.1006.desc:0 "Ta dừng lại ở một quầy ven đường bán vài món ăn đơn giản. Người bán, [cheese_trader.GetName], mời chào ta đủ loại hàng hóa trước khi cúi xuống dưới quầy và lấy ra một chiếc hộp gỗ chạm khắc.\n\n\"Thưa bệ hạ, đây là loại phô mai ngon nhất trong toàn cõi. [cheese_trader.GetSheHe|U] đặt khối phô mai nhỏ vào tay ta, nghiêng người lại gần và thì thầm đầy vẻ bí mật, \"Nó được làm bởi những người Viking làm phô mai ở ngay tại Iberia.\" \n\nDù lời nói nghe thật kỳ quặc, phô mai này lại ngon đến kinh ngạc."
	fp2_yearly.1006.a:0 "Ta sẽ nhận phô mai của ngươi nhưng không tin câu chuyện ngớ ngẩn đó."
	fp2_yearly.1006.b:0 "Ta phải tìm những \"Viking Phô Mai\" này..."
	fp2.1006.b.tt:0 "Ngài cử thuộc hạ đi tìm \"Viking Phô Mai\""
	fp2_yearly.1006.c:0 "Thật là chuyện vớ vẩn."


	fp2_yearly.1007.t:0 "$fp2_yearly.1006.t$"
	fp2_yearly.1007.desc:0 "Một [fake_cheese_viking.GetWomanMan] trông gầy gò được đưa đến trước mặt ta. Tuy nhiên, [fake_cheese_viking.GetWomanMan] thảm hại trước mặt ta trông khó mà giống một người làm phô mai — chứ đừng nói đến một Viking.\n\n\"Tôi thực sự xin lỗi, nhưng tôi không thực sự là một Viking. Đó chỉ là lời nói dối để giúp bán phô mai thôi,\" [fake_cheese_viking.GetSheHe] lắp bắp."
	fp2_yearly.1007.a:0 "Thôi được, ít nhất ta cũng giải được bí ẩn."
	fp2_yearly.1007.b:0 "Ta muốn một nửa lợi nhuận của ngươi, và một nửa số phô mai."

	fp2_respected_clergy_chess:0 "Tôn Trọng Giáo Sĩ Trong Cờ Vua"
	fp2_respected_clergy_chess_desc:0 "Đã thay đổi luật cờ vua để tôn trọng giới giáo sĩ."

	fp2_cheese_artifact:0 "Phô Mai Ủ Lâu Năm"
	fp2_cheese_artifact_desc:0 "Bất chấp những lời đồn, loại phô mai này không được làm bởi người Viking. Tuy vậy nó cực kỳ ngon."


	fp2_yearly.1008.t:0 "Thưởng Thức Phô Mai"
	fp2_yearly.1008.desc: "Đã đến lúc. Sâu trong kho của ta là một trong những loại phô mai tuyệt vời nhất thế giới được biết đến, đã được ủ lâu, ngày càng đậm vị.\n\n Và giờ ta sẽ ăn nó."
	fp2_yearly.1008.a:0 "[ROOT.Char.GetFaith.HealthGodName|U] cũng phải rơi lệ. Đúng là phô mai hảo hạng."
	fp2_yearly.1008.b:0 "Thực ra, hãy để phô mai ủ thêm."

 # fp2_struggle_event_ola
	stoke_tension_toast.success:0 "Chiến dịch gieo rắc thù hận của Ngài đã thành công."
	stoke_tension_toast.failure:0 "Sự can dự của Ngài đã bị lộ."

	delegated_stoke_tension_toast.success:0 "[tension_councillor.GetTitledFirstName] đã gieo rắc thù hận."

	ease_tension_toast.success:0 "Ngài đã hòa giải thành công."
	ease_tension_toast.failure:0 "Nỗ lực của Ngài đã thất bại."

	bad_intrigue.tt:0 "Tùy chọn này khả dụng vì kỹ năng Âm Mưu của Ngài quá kém."

	fp2_struggle.1000.t:0 "Thổi Bùng Ngọn Lửa"
	fp2_struggle.1000.desc:1 "Đã xảy ra những vụ đụng độ giữa người theo [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] và dân cư theo [tension_county.GetCountyData.GetFaith.GetAdjectiveNoTooltip] tại [tension_county.GetName]. \"Hãy tận dụng cơ hội này,\" [tension_councillor.GetCouncilTitle] của ta là [tension_councillor.GetFirstName] đề nghị, \"để tuyển mộ bọn côn đồ đánh thuê từ những kẻ bạo loạn theo [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. Và nếu họ tiếp tục #italic luyện tập#! tại quê nhà của mình thì cũng đâu có hại! Thậm chí chúng ta còn có thể #italic khuyến khích#! điều đó...\" \n\n Ta có nên để [tension_county.GetNameNoTierNoTooltip] cháy trong hỗn loạn để chiêu mộ những kẻ cuồng tín bạo lực này không?"
	fp2_struggle.1000.a:0 "Hãy gieo rắc chút thù hận... một cách kín đáo."
	fp2_struggle.1000.b:0 "Ta tin ngươi sẽ xử lý chuyện này."
	fp2_struggle.1000.c:0 "Không, ta sẽ cố gắng xoa dịu căng thẳng."
	fp2_struggle.1000.d:0 "Nếu ta không thể ngăn cơn điên loạn này, có lẽ một vị cai trị [minority_courtier.GetFaith.GetAdherentNameNoTooltip] có thể."
 
 
	not_my_problem_toast:0 "Những bà mẹ đơn thân và trẻ em trong lãnh địa của Ngài sẽ phải chịu đói trong nhiều năm tới."

	fp2_struggle.1001.t:0 "Góa Phụ Chiến Tranh"
	fp2_struggle.1001.desc:0 "[expectant_courtier.GetTitledFirstName] đang mang thai, và đã đến để suy ngẫm về tình cảnh của những người mẹ khác trong [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'trại', 'lãnh thổ')] của chúng ta - những người bị chiến tranh và bất hạnh gần đây bỏ lại để chăm sóc con cái một mình. \"Chúng ta có thể lập một quỹ đặc biệt, thưa [ROOT.Char.Custom('FormOfAddressForLiege')], để hỗ trợ những người mẹ nuôi con không có phương tiện hỗ trợ khác. Suy cho cùng, nuôi dạy con cái là một công việc vất vả và đáng khen ngợi không kém gì những việc khác.\""
	fp2_struggle.1001.a:0 "Ý kiến hay! Ta sẽ lập quỹ như vậy."
	fp2_struggle.1001.b:1 "Chỉ các góa phụ mới nhận được sự hỗ trợ của ta."
	fp2_struggle.1001.b.tt:0 "Đức tin của Ngài không chấp nhận phụ nữ có con ngoài hôn nhân."
	fp2_struggle.1001.c:0 "Họ có thể đến sống tại [ROOT.Char.Custom('GetCourt')] của ta! Chúng ta có dư thức ăn!"
	fp2_struggle.1001.c.tt:0 "Ngài mời tất cả các bà mẹ đơn thân nghèo trong lãnh địa đến sống tại [ROOT.Char.Custom('GetCourt')] của mình."
	fp2_struggle.1001.d:0 "Chắc chắn các chư hầu nhân từ của ta có thể giúp tài trợ cho việc này."
	fp2_struggle.1001.e:0 "Ta là [ROOT.Char.GetTitleTierName] của các ngươi, không phải vú nuôi!"
	fp2_struggle.1001.specialdescpositive:0 "Các chư hầu sẵn lòng trả tiền sẽ nhận #positive_value 10#! #color_light_blue Ý kiến#! về Ngài"
	fp2_struggle.1001.specialdescnegative:0 "Các chư hầu không muốn trả tiền sẽ mất #negative_value 10#! #color_light_blue Ý kiến#! về Ngài"
 
	reading_avicenna_toast.success:0 "Ngài đã đọc một cuốn sách lớn về y học."
	reading_avicenna_toast.failure:0 "Có lẽ Ngài đã hiểu sai điều gì đó..."
	reading_hippocrates_toast.success:0 "Ngài đã đọc toàn bộ tác phẩm của Galen."
	reading_hippocrates_toast.failure:0 "Tại sao tiếng Hy Lạp lại khó đến vậy?"
	rolling_in_filth_toast:0 "Triều đình của Ngài là một mối nguy cho sức khỏe."

	fp2_struggle.1002.t:0 "Tiến Bộ của [xenophilic_culture.GetNameNoTooltip]"
	fp2_struggle.1002.desc_early_golden_age:0 "Các học giả [xenophilic_culture.GetNameNoTooltip] gần đây đã đạt được nhiều bước tiến lớn trong tri thức y học. Nhưng học giả uyên bác [great_physician.GetFirstName] đã bị trục xuất khỏi triều đình của [neighboring_ruler.GetTitledFirstNamePossessive] — người là [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] của ta — chỉ vì một #italic bài thơ và một sai lầm#!, và giờ đang tìm kiếm công việc mới. \n\n"
	fp2_struggle.1002.desc_late_golden_age:0 "Các học giả [xenophilic_culture.GetNameNoTooltip] từ lâu đã tận tâm nghiên cứu y học. Giờ đây học giả uyên bác [great_physician.GetFirstName] đang tìm cách gia nhập triều đình của ta, nhưng gần đây [great_physician.GetSheHe] đã bị trục xuất khỏi triều đình của [neighboring_ruler.GetTitledFirstNamePossessive] — người là [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] của ta — vì một lỗi lầm không được tiết lộ. \n\n"
	fp2_struggle.1002.desc_post_golden_age_christian:0 "Dù những người như Averroes và Albucasis đã qua đời từ lâu, các thầy thuốc [xenophilic_culture.GetNameNoTooltip] vẫn nổi bật về tri thức. Giờ đây học giả uyên bác [great_physician.GetFirstName] đang tìm việc mới sau khi bị trục xuất khỏi triều đình của [neighboring_ruler.GetTitledFirstNamePossessive] — người là [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] của ta — vì một lỗi lầm không được tiết lộ. \n\n"
	fp2_struggle.1002.desc_post_golden_age_unchristian:0 "Dù những người như Ibn Rushd và Al-Zahrawi đã qua đời từ lâu, các thầy thuốc [xenophilic_culture.GetNameNoTooltip] vẫn nổi bật về tri thức. Giờ đây học giả uyên bác [great_physician.GetFirstName] đang tìm việc mới sau khi bị trục xuất khỏi triều đình của [neighboring_ruler.GetTitledFirstNamePossessive] — người là [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] của ta — vì một lỗi lầm không được tiết lộ. \n\n"
	fp2_struggle.1002.desc_albucasis:0 "\"Dù kỹ năng của Ta khiêm tốn,\" ông nói, \"Ta từng cứu sống một nữ nô lệ đã tự cắt cổ mình, và sau đó giọng cô ấy chỉ hơi khàn đi một chút. Và Ta cũng muốn ngài thay đổi vài thói quen vệ sinh của mình...\" \n\n"
	fp2_struggle.1002.desc_avenzoar:0 "\"Ta đã hành nghề y cả đời,\" ông nói, \"và viết một cuốn sách về chế độ sống lành mạnh. Nhưng Ta là kẻ thù của mê tín và những phương thuốc giả dối do phù thủy và nhà chiêm tinh rao bán, nên Ta mong ngài cấm những thứ đó...\" \n\n"
	fp2_struggle.1002.desc_tufail:0 "\"Ta nghiên cứu cả bầu trời, trí tuệ và những bệnh tật của thân xác,\" [great_physician.GetSheHe] nói. \"Nhưng Ta cũng ủng hộ lợi ích của việc nghiên cứu cơ thể con người #italic sau khi chết#!... Ngài có thể cho Ta cơ hội để theo đuổi điều đó không?\" \n\n"
	fp2_struggle.1002.desc_no_historical_physician_early:0 "\"Ta đã học được nhiều điều,\" [great_physician.GetSheHe] nói, \"từ các tác phẩm của người cổ đại. Nhưng Ta đã cứu vớt tri thức của họ khỏi sự dài dòng rườm rà, và có thể dùng nó vì lợi ích của ngài.\" \n\n"
	fp2_struggle.1002.desc_no_historical_physician_late:0 "\"Ta đã học được nhiều điều,\" [great_physician.GetSheHe] nói, \"từ các tác phẩm của Al-Zahrawi và Ibn Sina. Nhưng Ta đã cải tiến các kỹ thuật của họ. Ta có thể chữa đục thủy tinh thể, mụn nhọt và điều trị những bệnh trước đây được cho là không thể chữa.\" \n\n"
	fp2_struggle.1002.desc_has_physician_and_is_christian:0 "Thầy thuốc hiện tại của ta, [scoped_physician.GetTitledFirstName], khuyên ta đừng thay thế [scoped_physician.GetHerHim] bằng kẻ ngoại đạo này."
	fp2_struggle.1002.desc_has_physician_but_not_christian:0 "Thầy thuốc hiện tại của ta, [scoped_physician.GetTitledFirstName], khuyên ta đừng thay thế [scoped_physician.GetHerHim] bằng kẻ lập dị này."
	fp2_struggle.1002.desc_has_no_physician_but_is_christian:0 "Một số cận thần khuyên ta không nên giao du với kẻ ngoại đạo này."
	fp2_struggle.1002.desc_has_no_physician:0 "Ta có nên mời [great_physician.GetWomanMan] này vào triều đình của mình không?"
	fp2_struggle.1002.a:0 "Ta có thể cần một thầy thuốc mới..."
	fp2_struggle.1002.b:1 "Ta có thể mua sách và tự học y học."
	fp2_struggle.1002.b.tt:0 "Ngài cố gắng học từ những tác phẩm y học vĩ đại."
	fp2_struggle.1002.c:0 "Ta cần ngươi làm gì? Ta tự đọc tiếng Hy Lạp được."
	fp2_struggle.1002.c.tt:1 "Ngài mua các tác phẩm của Galen và cố đọc chúng."
	fp2_struggle.1002.d:0 "Ta sẽ gửi ngươi trở lại cho [neighboring_ruler.GetTitledFirstNameNoTooltip]... trong xiềng xích."
	fp2_struggle.1002.e:0 "Sức khỏe của ta vẫn ổn, cảm ơn."
	fp2_struggle.1002.f:0 "Cút đi, đổi mới chỉ nên đến từ Chúa."
	fp2_struggle.1002.physicianleaves:0 "[great_physician.GetFirstName] tìm việc ở nơi khác"
	fp2_struggle.1001.physician_imprisoned:0 "[great_physician.GetFirstName] bị [neighboring_ruler.GetName] giam giữ vì một số lý do"

	fp2_struggle.1010.t:0 "Linh Hồn Sắt Thép"
	fp2_struggle.1010.desc:1 "Một [great_swordsmith.GetWomanMan] tên là [great_swordsmith.GetName] đã đến triều đình của ta, tự xưng là một bậc thầy rèn kiếm đã đi khắp nơi.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [great_swordsmith.GetSheHe] nói, \"gia đình Ta đã làm kiếm ở [toledo_holding.GetNameNoTierNoTooltip] từ thời cổ đại, và từng rèn #italic falcata#! cho quân đội Carthage. Không hợp kim nào mạnh bằng thứ được rèn ở Iberia, và Ta có thể hoàn thiện nó. Ta có thể làm ra vũ khí tốt nhất thế giới, nhưng đổi lại ngài phải trao cho Ta quyền chỉ huy nghiệp đoàn thợ rèn ở [blacksmith_county.GetNameNoTierNoTooltip]. Khi đó họ sẽ thấy rằng Ta giỏi hơn tất cả bọn họ!\""
	fp2_struggle.1010.a:1 "Không, ngươi sẽ làm việc cùng nghiệp đoàn, vì lợi ích chung."
	fp2_struggle.1010.b:1 "Dù ngươi biết điều gì, ta cũng sẽ ép ngươi khai ra..."
	fp2_struggle.1010.c:1 "Ngươi sẽ có nó, nếu rèn kiếm cho quân đội của ta."
	fp2_struggle.1010.d:1 "Hãy rèn cho ta thanh kiếm tốt nhất Iberia, và nghiệp đoàn sẽ là của ngươi."
	fp2_struggle.1010.e:0 "Ta sẽ không chọc giận nghiệp đoàn chỉ vì lòng kiêu ngạo của ngươi."
	fp2_struggle.1010.smithgoesaway:1 "[great_swordsmith.GetNameNoTooltip] rời đi để nắm quyền chỉ huy nghiệp đoàn thợ rèn."
	fp2_struggle.1010.paranoid_rivals:1 "Việc trang bị vũ khí cho binh lính có thể khiến các vị cai trị láng giềng  lo ngại."
	fp2_struggle.1010.smithmakesweapon:1 "[great_swordsmith.GetNameNoTooltip] ở lại triều đình của Ngài trong khi rèn thanh kiếm Ngài yêu cầu."
	fp2_struggle.1010.swordsmith_imprisoned:0 "Ngài giam cầm và tra tấn [great_swordsmith.GetNameNoTooltip] để học bí mật của ông ta"
	fp2_struggle.1010.compassionate_courtiers:0 "Không phải mọi cận thần đều tán thành việc này"
	toledo_compromise_flavor:0 "Ngài buộc [great_swordsmith.GetNameNoTooltip] và nghiệp đoàn đạt được thỏa hiệp."
	fp2_struggle.1010.swordsmith_leaves:0 "[great_swordsmith.GetNameNoTooltip] đến một triều đình khác."

 
	fp2_struggle.1011.t:1 "Thanh Kiếm của [blacksmith_county.GetNameNoTierNoTooltip]"
	fp2_struggle.1011.desc:1 ""Hoàn thành rồi", [great_swordsmith.GetName] nói, nhưng trông có vẻ mệt mỏi lạ thường.\n\n"Có lẽ linh hồn tổ tiên đã dẫn dắt ta trong lúc rèn, vì đây là lưỡi kiếm tuyệt vời nhất ta từng tạo ra. Sẽ không bao giờ ta rèn được thứ giống như vậy nữa, và cũng chẳng ai trên mảnh đất này làm được, vì bí mật tạo nên nó ta sẽ mang xuống mồ. Giờ ta sẽ đi nhận lấy phường hội mà ngài đã hứa cho ta, dù chiến thắng ấy giờ đây lại thấy trống rỗng lạ thường. Nhưng dù sao đi nữa, ngài phải đặt tên cho thanh kiếm mà ta đã rèn cho ngài.""
	fp2_struggle.1011.a:1 "#italic Martiello#!, cây búa."
	fp2_struggle.1011.b:0 "#italic Tiniebra#!, bóng tối."
	fp2_struggle.1011.c:0 "#italic Vermejo#!, màu đỏ."
	fp2_struggle.1011.d:0 "#italic Jargonça#!, như viên ngọc lam."
	fp2_struggle.1011.e:0 "#italic Suhayl#!, vinh quang."
	fp2_struggle.1011.f:0 "#italic al-Battar#!, kẻ chém."
	fp2_struggle.1011.g:0 "#italic Qazeeb#!, chuôi chắc."
	fp2_struggle.1011.h:0 "#italic Zumurrud#!, như viên ngọc lục bảo chói lòa."
	fp2_struggle.1011.i:0 "#italic Ortzi#!, như tiếng sấm."
	fp2_struggle.1011.j:0 "#italic Gaueko#!, linh hồn bóng đêm."
	fp2_struggle.1011.k:0 "#italic Gorri#!, kẻ đỏ."
	fp2_struggle.1011.l:0 "#italic Aiztoto#!, con dao nhỏ."
	fp2_struggle.1011.m:0 "#italic Escremire#!, kiếm sĩ."
	fp2_struggle.1011.n:0 "#italic Folha#!, chiếc lá."
	fp2_struggle.1011.o:0 "#italic Proeza#!, lòng dũng cảm."
	fp2_struggle.1011.p:0 "#italic Trebalhar#!, kẻ hành hạ."
	fp2_struggle.1011.q:0 "#italic Sufax#!, như vị anh hùng vĩ đại thuở xưa."
	fp2_struggle.1011.r:0 "#italic Toumellalt#!, kẻ trắng."
	fp2_struggle.1011.s:0 "#italic Ayugu#!, cái ách."
	fp2_struggle.1011.u:0 "Tất nhiên là #italic Ironsoul#!."
	fp2_struggle.1011.v:0 "Ta khá thích cái tên #italic Mistletoe#!..."
	fp2_struggle.1011.w:0 "#italic Moor-cleaver#!, còn gì khác?"
	fp2_struggle.1011.x:0 "#italic Usurper's blade#! có vẻ hợp, xét đến những gì chúng ta đã làm với các phường hội..."
	fp2_struggle.1011.swordsmith_leaves:0 "Hoàn thành công việc, [great_swordsmith.GetName] rời khỏi triều đình của Ngài"
