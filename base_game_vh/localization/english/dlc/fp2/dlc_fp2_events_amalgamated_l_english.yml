	awesome_toledo_sword_name:1 "Thanh Kiếm của [great_swordsmith.GetTitledFirstNamePossessiveNoTooltip]"
	awesome_toledo_sword_desc:0 "Thanh kiếm này là tác phẩm vĩ đại nhất của thợ rèn [great_swordsmith.GetName] ở [toledo_county.GetNameNoTierNoTooltip], được rèn bằng những kỹ thuật bí mật mà [great_swordsmith.GetSheHe] đã mang xuống mồ. Một [great_swordsmith.GetWomanMan] tài hoa nhưng kiêu ngạo, người ta nói rằng [great_swordsmith.GetSheHe] đã đặt một phần linh hồn của [great_swordsmith.GetHerHis] vào lưỡi kiếm, và quả thật nó dường như ban cho người sử dụng một ý chí sắt đá."

	fp2_struggle.1012.t:1 "Kiệt Tác"
	fp2_struggle.1012.desc:1 "\"Nó đã xong\", [great_swordsmith.GetName] nói.\n\n\"Đây là thanh kiếm ta đã hứa với ngài, một trong những tác phẩm tốt nhất của ta. Lưỡi kiếm của nó được làm từ hợp kim tốt nhất có thể tưởng tượng được, thứ mà chỉ có thể được tạo ra ở Iberia. Nó thực sự có, như họ nói, #italic một linh hồn bằng sắt#!. Một lưỡi kiếm phù hợp với một [Select_CString(ROOT.Char.IsFemale,'quý bà cao quý','lãnh chúa vĩ đại')] như ngài.\""
	fp2_struggle.1012.a:0 "Nó thật... tuyệt mỹ. Ngươi có thể ra đi trong yên bình."
	fp2_struggle.1012.b:0 "Tuyệt vời. Ta không thể thuyết phục ngươi ở lại phục vụ ta sao?"
	fp2_struggle.1012.swordsmith_leaves:1 "Sau khi hoàn thành công việc của [great_swordsmith.GetHerHis], [great_swordsmith.GetName] rời đi để chỉ huy hiệp hội thợ rèn, như ngài đã hứa."
	fp2_struggle.1012_swordsmith_stays:1 "[great_swordsmith.GetName] ở lại triều đình của Ngài"

	toledo_sword_name:0 "Kiếm Toledo"
	toledo_sword_desc:0 "Thanh kiếm này là một kiệt tác của thép Toledo, cực kỳ bền và chắc. Một dòng khắc nhỏ gần chuôi cho biết nó được rèn bởi #italic vị thợ rèn vĩ đại#! [great_swordsmith.GetName] tại [blacksmith_county.GetNameNoTierNoTooltip]."

	fp2_struggle.1050.t:0 "Những Giấc Mơ Hủy Diệt"
	fp2_struggle.1050.desc_opening:1 "[visionary_spouse.GetTitledFirstName] đến gặp ta trong đêm tối, sốt cao và tái nhợt. \"Ta đã có những giấc mơ\", [visionary_spouse.GetSheHe] nói, \"nơi ta thấy mình đứng giữa một cánh đồng chết chóc."
	fp2_struggle.1050.desc_christian:0 "Thành phố của chúng ta bị san bằng, tháp nhà thờ sụp đổ, dân chúng bị giẫm đạp trong vũng máu của chính mình."
	fp2_struggle.1050.desc_islamic:0 "Những thư viện của chúng ta bị thiêu rụi, các tháp minaret sụp đổ, anh chị em của chúng ta bị đóng đinh lên thập giá, bị chim ăn xác rỉa."
	fp2_struggle.1050.desc_rampaging_barbarian_heathen:0 "Nhà cửa của chúng ta bị thiêu rụi, đá rune bị lật đổ, chiến binh của chúng ta bị giết mà không có danh dự hay vinh quang."
	fp2_struggle.1050.desc_non_barbarian_heathen:0 "Thành phố của chúng ta bị san bằng, đền thờ bị đốt cháy, dân chúng bị giết hoặc bị kéo đi tới số phận không ai biết."
	fp2_struggle.1050.desc_islamic_heritage:0 "Ta đã thấy sự hủy diệt hoàn toàn của tất cả những gì chúng ta đã xây dựng kể từ khi tổ tiên đặt chân đến vùng đất này."\n\n"
	fp2_struggle.1050.desc_christian_bling_reference_drop:0 "Thánh tích của các vị thánh bị ném vào ngọn lửa dữ dội."\n\n"
	fp2_struggle.1050.desc_middle_neutral_version:0 "Tất cả những gì chúng ta xây dựng đều bị phá hủy, và cái chết cùng sự tuyệt vọng bao trùm mặt đất."\n\n"
	fp2_struggle.1050.desc_love_and_warmth_ending:0 ""Xin người yêu dấu của ta, hãy giúp ta. Ta rất sợ rằng những giấc mơ của ta là thật, rằng những điều này sẽ xảy ra. Ôm ta đi, ta thấy lạnh quá.""
	fp2_struggle.1050.desc_no_love_and_warmth_ending:0 ""[ROOT.Char.GetWifeHusband] thân mến, xin hãy nghe ta. Đây không phải căn bệnh bình thường. Ta sợ rằng những giấc mơ của ta là thật, rằng những điều này có thể xảy ra. Xin đừng để chúng xảy ra. Ngài phải cứu Iberia.""
	fp2_struggle.1050.a:0 "Ngươi là phù thủy sao?"
	fp2_struggle.1050.b:0 "Bình tĩnh lại đi, [ROOT.GetCharacter.GetFaith.HighGodName] đang thử thách đức tin của ngươi."
	fp2_struggle.1050.c:0 "Nào, hãy kể cho ta thêm về những thị kiến của ngươi."
	fp2_struggle.1050.d:0 "Để ta yên, ta đang lên kế hoạch cho cuộc chinh phục tiếp theo."
	fp2_struggle.1050.spouse_imprisoned:0 "Ngài giam giữ [visionary_spouse.GetTitledFirstNameNoTooltip] vì nghi ngờ phù thủy"
	fp2_struggle.1050.condition_might_improve:0 "Tình trạng của [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] có thể cải thiện"
	fp2_struggle.1050.condition_might_get_worse:0 "Tình trạng của [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] có thể trở nên tệ hơn"
	fp2_struggle.1050.condition_might_get_very_worse:0 "Tình trạng của [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] có thể trở nên tệ hơn nhiều"
	comforting_spouse_visionary_toast.success:0 "Ngài đã an ủi [visionary_spouse.GetTitledFirstName]"
	comforting_spouse_visionary.failure:0 "Ngài không thể an ủi [visionary_spouse.GetTitledFirstName]"
	fp2_yearly.8004.t:0 "Trường Dịch Thuật [translation_capital.GetNameNoTierNoTooltip]"
	fp2_yearly.8004.desc_opening:0 "Với tinh thần hòa giải lan khắp Iberia, các học giả từ khắp vùng đã nán lại trong những thư viện thuộc lãnh địa của ta. Có lẽ ta có thể hướng năng lượng của họ vào điều gì đó hữu ích...\n\n"
	fp2_yearly.8004.desc_chaplain:0 "[translation_enthusiast.GetCouncilTitle] của ta, [translation_enthusiast.GetTitledFirstName], có một ý tưởng. \"Chúng ta nên tổ chức một nhóm dịch thuật\", [translation_enthusiast.GetSheHe] nói, \"và Ta có thể lãnh đạo nó. Hãy tìm khắp vùng đất những dịch giả tài giỏi, kể cả dị giáo, và để họ làm việc dưới sự bảo trợ của ngài. [translation_capital.GetNameNoTierNoTooltip] có thể trở thành ngọn hải đăng của tri thức, nếu ngài tài trợ!\""
	fp2_yearly.8004.desc_wanderer:0 "Lữ khách học giả [translation_enthusiast.GetTitledFirstName] mang đến một cơ hội. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [translation_enthusiast.GetSheHe] nói, \"Ta đã thành thạo hàng chục ngôn ngữ và có thể giúp ngài tổ chức một nhóm dịch thuật. Hãy tìm khắp nơi những dịch giả giỏi và để họ làm việc dưới sự bảo trợ của ngài. [translation_capital.GetNameNoTierNoTooltip] có thể trở thành một ngọn hải đăng lớn của tri thức.\""
	fp2_yearly.8004.a:0 "Ta sẽ #italic không tiếc#! chi phí để tìm những người giỏi nhất."
	fp2_yearly.8004.b:0 "Vì ngươi giỏi như vậy, #italic chính ngươi#! hãy làm tất cả bản dịch."
	fp2_yearly.8004.c:0 "Thư viện thật phiền phức..."
	recruiting_brilliance_toast.success:0 "Ngài đã tìm được những dịch giả xuất sắc"
	recruiting_mediocrity_toast.failure:0 "Ngài đã thuê những dịch giả tầm thường"

	fp2_yearly.8005.t:0 "Dưới Tán Thông Đá"
	fp2_yearly.8005.desc_opening:0 "Giữa cái nóng thiêu đốt của buổi trưa, họ ngồi trong bóng râm dưới một cây thông đá lớn, gảy đàn lute và thổi sáo."
	fp2_yearly.8005.desc_iberian:0 "Họ hát bằng tiếng Galicia-Bồ Đào Nha, bằng tiếng Catalan, về cuộc sống, mất mát và tình yêu ngọt ngào xen lẫn cay đắng."
	fp2_yearly.8005.desc_arabic:0 "Họ hát bằng tiếng Ả Rập về vẻ đẹp, vinh quang, tình yêu đã mất rồi lại tìm thấy."
	fp2_yearly.8005.desc_language_neutral:0 "Họ hát bằng nhiều thứ tiếng, nhưng trái tim ta hiểu được từng lời."
	fp2_yearly.8005.desc_middle_part:0 "Ta có thể nghe họ từ ban công của mình, và âm nhạc ấy lay động tâm hồn ta.\n\nNhưng ta không biết danh tính của những nhạc công này, và khi ta rời khỏi đại sảnh cao vút để tiến lại gần cái cây, họ đã biến mất."
	fp2_yearly.8005.desc_post_troubadours:0 "Ta từng nghĩ chỉ những troubadour của Occitania mới sở hữu tài năng và trí tuệ như vậy, nhưng có lẽ ta đã nhầm...\n\nTa phải làm gì với những #italic cảm xúc chết tiệt#! này đây?"
	fp2_yearly.8005.desc_pre_troubadours:0 "\n\nLiệu họ được gửi xuống từ [ROOT.Char.GetFaith.PositiveAfterLife|U]? Hay là những bóng ma do [ROOT.Char.GetFaith.DevilName] tạo ra để cám dỗ ta? Có lẽ không... nhưng ta phải làm gì với những #italic cảm xúc chết tiệt#! này đây?"
	fp2_yearly.8005.a:0 "Tình yêu của ta dành cho [courtly_lover.GetFirstNameNoTooltip] khiến trái tim ta tràn đầy giai điệu."
	fp2_yearly.8005.b:0 "Thật đẹp..."
	fp2_yearly.8005.c:0 "Ta nên bảo trợ thêm nhiều nhạc công!"
	fp2_yearly.8005.d:0 "Đủ rồi! Ta sẽ cho chặt cái cây chết tiệt đó."

	fp2_yearly.8002.t:0 "Tiến Thoái Lưỡng Nan Về Ăn Uống"
	fp2_yearly.8002.desc:0 "Hai đứa trẻ đang nhặt sò trên bãi biển ở [beached_whale_province.GetName] thì phát hiện một cái xác khổng lồ. Người dân ven biển nói rằng thịt của sinh vật biển đã chết này vẫn chưa hỏng và #italic rất#! ngon. Nhưng [preoccupied_ulama.GetCouncilTitle] của ta, [preoccupied_ulama.GetFirstName], kéo ta sang một bên trong cuộc họp hội đồng, trông có vẻ lo lắng.\n\n\"Việc ăn thịt cá voi thật sự có được phép đối với chúng ta, những [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], không?\" [preoccupied_ulama.GetSheHe] trầm ngâm. \"Ta không thể đưa ra phán quyết trong chuyện này. Chúng ta nên chờ tuyên bố từ một học giả rất đáng kính. Nhưng ngài nên cấm dân chúng ăn thịt con thú này — phòng khi...\""
	fp2_yearly.8002.a:0 "Không, #italic ta#! có thể tuyên bố nó được phép."
	fp2_yearly.8002.b:0 "Cho ta ít thịt! Ta #italic phải#! nếm thử."
	fp2_yearly.8002.c:0 "Được thôi, hãy chờ phán quyết."
	fp2_yearly.8002.d:0 "Tuyệt đối #italic không#! được ăn. Ta sẽ đích thân đến đó và thiêu hủy nó."
	exploding_whale_toast:0 "Cái xác đột nhiên phát nổ!"
	exploding_whale.tt:0 "Cái xác phát nổ!"
	healthy_whale_toast:0 "Nó có vị rất ngon"
	unhealthy_whale_toast:0 "Có gì đó không ổn..."

	fp2_yearly.8003.t:0 "Giấc Mơ Bay"
	fp2_yearly.8003.desc:0 "Nhà phát minh nổi tiếng [flying_polymath.GetFirstName] tìm đến ta với một thỉnh cầu rất kỳ lạ, mang theo một đôi cánh làm từ gỗ và lụa. \n\n\"Từ lâu con người đã khao khát bay lượn trên bầu trời\", [flying_polymath.GetSheHe] nói, \"và ta đã tính toán. Ta sẽ chứng minh rằng chúng ta có thể! Hãy cho phép ta nhảy từ tòa tháp cao nhất của [ROOT.Char.Custom('ResidenceBuilding')] của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')], và sau đó ta sẽ trung thành phục vụ ngài.\" \n\nKhông may, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enthusiastic_child'))] của ta là [enthusiastic_child.GetTitledFirstName] đã biết chuyện này và đang nài nỉ ta cho [enthusiastic_child.GetHerHim] chứng kiến học giả già kia bay thử. "
	fp2_yearly.8003.a:0 "Được thôi, ta cho phép."
	fp2_yearly.8003.b:0 "Đưa đôi cánh đó đây — #italic ta#! muốn bay."
	fp2_yearly.8003.c:0 "Không, đây là điên rồ."
	flight_attempt_toast.success:0 "Ngài bay vút như đại bàng"
	flight_attempt_toast.failure:0 "Ngài rơi xuống đất"
	fp2_yearly.8003_child_reaction:0 "Không ai biết [enthusiastic_child.GetFirstNameNoTooltip] sẽ phản ứng ra sao khi chứng kiến điều này."
	polymath_flight_attempt_toast.success:0 "[flying_polymath.GetFirstNameNoTooltip] đã bay!"
	polymath_flight_attempt_toast.failure:0 "[flying_polymath.GetFirstNameNoTooltip] đã ngã đến chết."

	fp2_yearly.8001.t:0 "Triệu Tập Cortes"
	fp2_yearly.8001.desc:0 "[commoner_enthusiast.GetCouncilTitle] của ta, [commoner_enthusiast.GetTitledFirstName], từ lâu đã suy nghĩ về tài chính của chúng ta và giờ đề nghị đã đến lúc triệu tập #italic cortes#! — một hình thức nghị viện mới nơi các đại diện được bầu của các đô thị tự do tham gia thảo luận cùng hội đồng hoàng gia.\n\n\"Đổi lại đặc quyền này\", [commoner_enthusiast.GetSheHe] nói, \"chúng ta có thể đánh thuế các thành phố nhiều hơn nữa. Nếu thực sự cần vàng, [ROOT.Char.Custom('FormOfAddressForLiege')], chúng ta thậm chí có thể cho vài nông dân bớt khốn khổ tham dự các cuộc họp, dù thần khuyên ngài đừng làm vậy, vì chắc chắn sẽ khiến giới quý tộc phẫn nộ.\""
	fp2_yearly.8001.a:0 "Mời đại diện các thành phố."
	fp2_yearly.8001.b:0 "Mời tất cả mọi người! Ý ta là #italic tất cả#!."
	fp2_yearly.8001.c:0 "Không, quý tộc luôn biết điều gì là tốt nhất."
	fp2_flavor.8001_vassal_opinion:0 "Các chư hầu bảo vệ đặc quyền của mình sẽ không thích điều này"

	fp2_yearly.8000.t:0 "Thiêu Hủy Vườn Nho"
	fp2_yearly.8000.desc_muslim_opening:0 "Rượu vang hảo hạng được làm ở Iberia từ lâu đã được những tín đồ định cư tại đây thưởng thức. Nhưng giờ [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] đã quyết định điều này phải chấm dứt.\n\n\"Rượu vang\", sứ giả của [vinoclast_caliph.GetHerHis], [hof_emissary.GetTitledFirstName], tuyên bố, \"chắc chắn là #italic haram#!, và cả việc sản xuất lẫn tiêu thụ đều không thể dung thứ thêm nữa. Vì vậy ngài phải thiêu rụi các vườn nho ở [vineyard_county.GetName].\""
	fp2_yearly.8000.desc_jewish_opening:0 "Rượu vang hảo hạng được làm ở Iberia từ lâu đã được tổ tiên chúng ta định cư tại đây thưởng thức. Nhưng giờ [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] đã quyết định điều này phải chấm dứt.\n\n\"Rượu vang\", sứ giả của [vinoclast_caliph.GetHerHis], [hof_emissary.GetTitledFirstName], tuyên bố, \"chắc chắn không kosher, và cả việc sản xuất lẫn tiêu thụ đều không thể dung thứ thêm nữa. Vì vậy ngài phải thiêu rụi các vườn nho ở [vineyard_county.GetName].\""
	fp2_yearly.8000.desc_jerez:0 "Nhưng vì thành phố [jerez_vineyards.GetNameNoTier] của ngài có những vườn nho lớn nhất toàn Iberia, chúng Ta hiểu sự hy sinh to lớn này và [vinoclast_caliph.GetTitleTierName] sẽ không quên. Dù vậy, các vườn nho vẫn phải bị đốt!"
	fp2_yearly.8000.desc_not_jerez:0 "[vinoclast_caliph.GetTitleTierName] hiểu nỗi đau điều này có thể gây ra cho những người trồng nho của ngài, nhưng hãy nghĩ đến tất cả đất đai sẽ được giải phóng cho những mục đích tốt đẹp và chính đáng hơn! Các vườn nho phải bị phá hủy."
	fp2_yearly.8000.a:0 "Phá hủy rượu vang hảo hạng sao? [vinoclast_caliph.GetTitleTierName] đã phát điên à?"
	fp2_yearly.8000.b:0 "Ta sẽ đốt chúng thành tro!"
	fp2_yearly.8000.c:0 "Không, ta phải bảo vệ những người trồng nho."

	fp2_struggle.1020.t:0 "Cái chết của một [Select_CString(minority_councillor.IsFemale,'Nữ Ủy viên','Nam Ủy viên')]"
	fp2_struggle.1020_desc_opening:1 "Thật là thảm họa! Giữa những căng thẳng đã âm ỉ từ lâu ở [unrest_capital.GetNameNoTierNoTooltip], một đám đông giận dữ gồm những [unrest_capital.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] đã chỉ đích danh cố vấn của ta, [minority_councillor.GetTitledFirstName], là nguyên nhân cho sự bất mãn của họ vì niềm tin [minority_councillor.GetFaith.GetAdherentNameNoTooltip] của [minority_councillor.GetHerHis]."
	fp2_struggle.1020_desc_beaten_by_mob:0 "Khi [minority_councillor.GetNameNoTooltip] đang trên đường đến [ROOT.Char.Custom('ResidenceBuilding')] của ta, đám đông đã ập đến và đánh đập [minority_councillor.GetHerHim] đến chết.\n\n"
	fp2_struggle.1020_desc_burned_by_mob:0 "Trong bóng đêm, chúng lẻn vào [ROOT.Char.Custom('ResidenceBuilding')] của ta, trói [minority_councillor.GetNameNoTooltip] vào khung cửi và châm lửa đốt.\n\n"
	fp2_struggle.1020_desc_hanged_and_disemboweled_by_mob:0 "Họ tóm lấy [minority_councillor.GetHerHim] trên đường đến một cuộc họp hội đồng, treo [minority_councillor.GetHerHim] lên cổng [ROOT.Char.Custom('ResidenceBuilding')] và rạch bụng [minority_councillor.GetHerHis], để nội tạng rơi tự do xuống mặt đất ẩm ướt bên dưới.\n\n"
	fp2_struggle.1020_desc_crucified_by_mob:0 "[minority_councillor.GetNameNoTooltip] đang thăm một người quen tại [unrest_capital.GetNameNoTierNoTooltip] thì đám đông giận dữ bắt [minority_councillor.GetHerHim] và đóng [minority_councillor.GetHerHim] lên một cây thập giá gỗ, nơi [minority_councillor.GetSheHe] nhanh chóng chết đi.\n\n"
	fp2_struggle.1020_desc_defenestrated_by_mob:0 "Trong sự cuồng loạn không thánh thiện, chúng đã phá được vào [ROOT.Char.Custom('ResidenceBuilding')] của ta, tóm lấy [minority_councillor.GetNameNoTooltip] và ném [minority_councillor.GetHerHim] từ cửa sổ xuống, dẫn đến cái chết của người đó.\n\n"
	fp2_struggle.1020_desc_molten_silver_by_mob:0 "Trong cơn cuồng loạn vô đạo, chúng phá vào phòng của [minority_councillor.GetTitledFirstNamePossessiveNoTooltip] trong [ROOT.Char.Custom('ResidenceBuilding')], nung chảy trang sức quý của [minority_councillor.GetHerHis] rồi đổ kim loại nóng chảy xuống cổ họng [minority_councillor.GetHerHis].\n\n"
	fp2_struggle.1020_desc_torn_to_pieces_by_mob:0 "[minority_councillor.GetNameNoTooltip] đang đi từ nhà tắm đến [ROOT.Char.Custom('ResidenceBuilding')] của ta thì đám đông giận dữ ập đến. Với sức mạnh cuồng nộ từ lòng căm thù, chúng xé xác [minority_councillor.GetHerHim] ra từng mảnh bằng đôi bàn tay không.\n\n"
	fp2_struggle.1020_desc_councillor_had_family:0 "Gia đình của [minority_councillor.GetTitledFirstNamePossessiveNoTooltip] đổ lỗi cho ta về chuyện đã xảy ra. [councillor_executor.Custom2('HerHisCharacterIntroduction', minority_councillor)|U] giờ đứng trước mặt ta, yêu cầu ta xin lỗi vì hành động kinh khủng này đối với gia tộc [minority_councillor.GetDynastyName]."
	fp2_struggle.1020_desc_councillor_had_no_family_faith:0 "Người của [minority_councillor.GetTitledFirstNamePossessiveNoTooltip] dường như đổ lỗi #italic cho ta#! về chuyện đã xảy ra, và [councillor_executor.GetTitledFirstName], một lãnh đạo cộng đồng [minority_councillor.GetFaith.GetAdherentNameNoTooltip], đã đến trước mặt ta để yêu cầu ta bồi thường cho những [minority_councillor.GetFaith.GetAdherentNamePluralNoTooltip] khốn khổ ở [unrest_capital.GetNameNoTierNoTooltip] vì hành động độc ác này."
	fp2_struggle.1020.a:0 "Xin sự tha thứ từ gia tộc [minority_councillor.GetDynastyNameNoTooltip]."
	fp2_struggle.1020.b:0 "Sửa chữa mọi chuyện với người của [minority_councillor.GetTitledFirstNamePossessiveNoTooltip]."
	fp2_struggle.1020.c:0 "Truy lùng thủ phạm."
	fp2_struggle.1020.d:0 "Triển khai binh lính để lập lại trật tự ở [unrest_capital.GetNameNoTierNoTooltip]."
 
	fp2_yearly.8006.t:0 "Những Người Định Cư Saqaliba"
	fp2_yearly.8006.desc:0 "Một nhóm vài trăm #italic Saqaliba#! da nhợt nhạt, những người đàn ông và phụ nữ bị bắt làm nô lệ từ những vùng đất phía đông châu Âu, đã trốn thoát khỏi vương quốc của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('former_master'))] [former_master.GetTitledFirstName]. Dù [former_master.GetSheHe] có nói về việc họ được trân trọng như thế nào trong quân đội và hậu cung của [former_master.GetHerHis], họ đã vượt qua nhiều nguy hiểm để tìm kiếm tự do trên đất của ta.\n\n\"Tất cả chúng tôi đều có những vết sẹo\", thủ lĩnh [saqaliba_leader.GetFirstName] của họ nói với ta, \"trên cơ thể, hoặc sâu bên trong. Nhưng chúng tôi mạnh mẽ và quyết tâm. Chúng tôi khao khát một mảnh đất của riêng mình, nơi chúng tôi có thể nói ngôn ngữ tổ tiên. Nếu ngài cho phép chúng tôi định cư tại [saqaliba_barony.GetName], chúng tôi sẽ làm việc chăm chỉ để làm cho nó thịnh vượng.\""
	fp2_yearly.8006.a:0 "Ta thậm chí có thể phong ngươi làm thị trưởng..."
	fp2_yearly.8006.b:0 "Ngươi có thể ở lại, nhưng Bạn Bè ngươi phải đi nơi khác."
	fp2_yearly.8006.c:0 "Ta sẽ gửi các ngươi trở lại chủ cũ."
	furious_rival_8006.desc:0 "Đối thủ của Ngài [former_master.GetTitledFirstNameNoTooltip] có thể đưa ra [claim|E] lên [saqaliba_county.GetName]"
	fp2_yearly.8006.flavor.b.tt:0 "Một cách miễn cưỡng, [saqaliba_leader.GetFirstNameNoTooltip] ở lại triều đình của ngài, để những người theo dõi [saqaliba_leader.GetHerHis] tự tìm con đường riêng."
	fp2_yearly.8006.flavor.c.tt:0 "Người Saqaliba bị cưỡng ép trả lại cho [former_master.GetTitledFirstNameNoTooltip]."

 # fp2_struggle_event_vero
	fp2_struggle.3001.t:0 "Cái Giá Của Chiến Tranh"
	fp2_struggle.3001.desc:0 "[struggle_3001_steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bước vào phòng với vẻ mặt nghiêm trọng. "Thưa [ROOT.GetCharacter.GetLadyLord] của Ta," [struggle_3001_steward.GetSheHe] nói, "kho bạc của chúng ta gần như cạn kiệt. Thời buổi này rất nguy hiểm." [struggle_3001_steward.GetSheHe|U] không cần nói thêm gì nữa. Trong im lặng, Ta nhìn ông ta với vẻ u ám. "[ROOT.Char.Custom('FormOfAddressForLiege')]...," [struggle_3001_steward.GetSheHe] lặp lại khi Ta rời đi."
	fp2_struggle.3001.desc_no_war_intro:0 "\n\nTất cả những gì ta có chỉ là chiếc vương miện này. Chiếc vương miện này và nghĩa vụ phải phụng sự nó thật tốt. Nhưng một chiếc vương miện có ích gì khi không có của cải để giữ lấy nó?"
	fp2_struggle.3001.desc_war_intro:0 "\n\nTất cả những gì ta có chỉ là chiếc vương miện này. Chiếc vương miện này và nghĩa vụ phải phụng sự nó thật tốt. Nhưng một chiếc vương miện có ích gì khi dù sao nó cũng sẽ bị lấy đi nếu ta thất bại?"
	fp2_struggle.3001.desc_outro:0 "Ta đưa tay chạm vào chất liệu lạnh lẽo của nó — vàng.\n\nTa biết vài thương nhân vô lương tâm chắc chắn sẽ hứng thú với nó..."
	fp2_struggle.3001.a:0 "Ta sẽ làm điều cần phải làm."
	fp2_struggle.3001.a_flavour:0 "Ngài sẽ mất vương miện của mình."
	fp2_struggle.3001.b:0 "Nhưng chiếc vương miện kia thì..."
	fp2_struggle.3001.c:0 "Khoan đã! Không phải chỉ mình ta có vương miện trong nhà này."
	fp2_struggle.3001.c_flavour:0 "Phối ngẫu của Ngài sẽ mất vương miện của họ."
	fp2_struggle.3001.d:0 "Chiếc vương miện này chỉ rời khỏi đầu ta khi ta chết!"
	struggle_3001_spouse_crown_modifier:0 "Đã Bán Vương Miện"
 
	fp2_struggle.3011.t:0 "Thiếu Nữ Gặp Nạn"
	fp2_struggle.3011.desc:1 "\"Thưa [ROOT.GetCharacter.GetLadyLord] của tôi! Điều không tưởng đã xảy ra!\" [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mất một giây để lấy lại hơi thở của [struggle_3011_marshal.GetHerHis], trán ướt đẫm mồ hôi. \"Những người phụ nữ của [struggle_3011_county_town.GetNameNoTier] đã cầm vũ khí để tự mình bảo vệ thành phố.\""
	fp2_struggle.3011.desc_men:0 "\"Thưa [ROOT.GetCharacter.GetLadyLord] của tôi! Điều không tưởng đã xảy ra!\" [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mất một giây để lấy lại hơi thở của [struggle_3011_marshal.GetHerHis], trán ướt đẫm mồ hôi. \"Những chàng trai của [struggle_3011_county_town.GetNameNoTierNoTooltip] đã cầm vũ khí để tự mình bảo vệ thành phố.\""
	fp2_struggle.3011.desc_outro:0 "\n\n[bishop.GetTitledFirstName] xông vào phòng ngay sau đó. "Điều này thật trái tự nhiên, thưa [ROOT.GetCharacter.GetLadyLord]!" [bishop.GetSheHe] kêu lên, "Nếu chúng ta để họ chiến đấu thì chẳng bao lâu họ cũng sẽ đòi đất đai, và ai sẽ chăm sóc bọn trẻ khi đó?"\n\n"Một thanh kiếm vẫn là một thanh kiếm," [struggle_3011_marshal.GetFirstNameNoTooltip] trả lời ngay lập tức. "Chắc hẳn ngài cũng đồng ý chứ, thưa [ROOT.GetCharacter.GetLadyLord]?"" 
	fp2_struggle.3011.a:0 "Ước gì mọi thần dân của ta đều sẵn sàng bảo vệ lãnh thổ của chúng ta như vậy!"
	fp2_struggle.3011.b:0 "Phụ nữ chỉ nên ôm một thứ trong tay — trẻ con."
	fp2_struggle.3011.b_men:0 "Đàn ông chỉ nên ôm một thứ trong tay — trẻ con."
	fp2_struggle.3011.c:0 "Phù thủy! #EMP Phù thủy!#!"
	fp2_struggle.3011.d:0 "Ôi, những quý bà tội nghiệp! Ta sẽ giải cứu họ khỏi điều xấu xa này!"
	fp2_order_of_the_hachet_modifier:0 "Không Hề Gặp Nạn"
	fp2_order_of_the_hachet_modifier_desc:0 "Đàn ông và phụ nữ trong quận sẽ cùng nhau bảo vệ nó."
	fp2_punished_order_of_the_hachet_modifier:0 "Bị Ép Trở Thành Thiếu Nữ Gặp Nạn"
	fp2_punished_order_of_the_hachet_modifier_desc:0 "Ở những quận này, những ai bảo vệ vùng đất của mình mà không có sự cho phép của lãnh chúa sẽ bị trừng phạt nặng hơn cả kẻ xâm lược."
 
	fp2_struggle.3021.t:0 "Cơn Thịnh Nộ Của Thiên Đường"
	fp2_struggle.3021.desc:0 "Khuôn mặt của [struggle_3021_knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bị bóp méo vì sợ hãi khi ta đến thăm doanh trại. [struggle_3021_courtier.GetTitledFirstName] đang cố gắng giúp [struggle_3021_knight.GetHerHim] và nhướng mày khi [struggle_3021_courtier.GetSheHe] nhìn thấy ta.\n\n\"Ngài sẽ ít nhất nói cho [ROOT.GetCharacter.GetLadyLord] biết chuyện gì đã xảy ra chứ?\"\n\n[struggle_3021_knight.GetFirstNameNoTooltip] lập tức ngẩng đầu lên. \"Thưa [ROOT.GetCharacter.GetLadyLord]... những gì tôi thấy không dành cho người khác thấy. Những hình bóng ném đá làm từ bột đen từ trên mặt thành. Những hòn đá bốc cháy và sấm sét khi chúng va vào kẻ thù. Chúng cắt đôi một người đàn ông, thưa [ROOT.GetCharacter.GetLadyLord]!\"\n\n[struggle_3021_courtier.GetFirstNameNoTooltip] gật đầu đầy quan tâm. \"Có lẽ... nếu chúng ta cũng có thể có được sức mạnh đó...\""
	fp2_struggle.3021.a:0 "Điều này chắc chắn đáng để nghiên cứu."
	fp2_struggle.3021.b:0 "Ai biết được những nguy hiểm nào có thể xảy ra."
	fp2_struggle.3021.c:0 "Bột đen sao... một loại gia vị mới và bùng cháy."
	fp2_struggle.3021.d:0 "Đây là sự trừng phạt của thần linh!"
	fp2_struggle.3021.e:0 "Sấm sét dành cho vị thần sấm."
	bad_struggle_3021_courtier_desc:0 "[struggle_3021_courtier.GetTitledFirstNamePossessive] chết vì nghiên cứu của [struggle_3021_courtier.GetHerHis]"
	good_struggle_3021_courtier_desc:0 "[struggle_3021_courtier.GetTitledFirstNamePossessive] thành công với nghiên cứu của [struggle_3021_courtier.GetHerHis]"
	bad_stone_research_title:0 "Bị Sét Đánh"
	good_stone_research_title:0 "Nghiên Cứu Thành Công!"
	fp2_lightning_stones_modifier:0 "Đá Sét"
	stone_poisoning_discovered:0 "Phản Tác Dụng"
	stone_poisoning_worked:0 "Gia Vị Lửa"
	stone_poisoning_worked_desc:0 "Đã nghiên cứu thành công loại bột đen bí ẩn."
	fp2_lightning_stones_poison_modifier:0 "Độc Bột Đen"
 
 # placeholderhugofp2eventtasf_events
	fp2_struggle.2000.t:0 "Khu Chợ Hỗn Loạn"
	fp2_struggle.2000.desc:0 "Trong khi khảo sát các con phố chợ, Ta bắt gặp một muḥtasib đang lo lắng, [fp2_2000_market_inspector.GetFullName], đang cố thực thi các quy định của chợ đối với những người bán hàng rong. "Sắp xếp lộn xộn, dầu đặt cạnh cửa nhà thờ Hồi giáo, thỏ chưa lột da, và phô mai trong bát! Nhân danh Allah, tất cả các ngươi phải nghe ta ngay bây giờ!"\n\nVị muḥtasib này #emphasis đáng lẽ phải#! trừng phạt các vi phạm trong chợ, bằng bạo lực nếu cần. Tuy nhiên, [fp2_2000_market_inspector.GetSheHe] đang bị các thương nhân mù quáng vì lòng tham phớt lờ.\n\nTa có thể làm gì để giúp [fp2_2000_market_inspector.GetHerHim]?"
	fp2_struggle.2000.a:0 "Can thiệp vào chuyện này và đe dọa gọi qāḍī."
	fp2_struggle.2000.a.desc:0 "Muḥtasib chỉnh đốn con đường của những thương nhân lạc lối,\nqāḍī trừng phạt họ theo phán quyết của mình"
	fp2_struggle.2000.a.a:0 "Các thương nhân nghe theo lời Ngài nhưng vẫn chưa bị thuyết phục"
	fp2_struggle.2000.a.a.notif:0 "Quan Liêu Leo Thang"
	fp2_struggle.2000.a.b:0 "Ngài giải quyết tình huống một cách ôn hòa"
	fp2_struggle.2000.a.b.notif:0 "Thỏa Hiệp Hợp Lý"
	fp2_struggle.2000.b:0 "Quở trách tất cả bọn chúng thật nghiêm khắc!"
	fp2_struggle.2000.b.desc:0 "Ta tự mình thực hiện hình phạt thể xác đối với các thương nhân"
	fp2_struggle.2000.b.notif:0 "Biểu Hiện Của Sự Cần Mẫn"
	fp2_struggle.2000.b.notif.desc:0 "Kinh ngạc khi thấy một muḥtasib bị mắng, các thương nhân nhanh chóng dọn sạch khu chợ."
	fp2_struggle.2000.d:0 "Tại sao luật lệ phải cản trở việc kinh doanh?"
	fp2_struggle.2000.d.desc:0 "Cho phép buôn bán mà không lo quy định sẽ tăng thương mại, nhưng dần làm thị trường bất ổn"
	fp2_struggle.2000.e:0 "Ta sẽ không dung thứ sự bất tuân này! Lính đâu!"
	fp2_struggle.2000.f:0 "Nhân tiện, sao chúng ta không xây luôn một nhà chứa?"
	fp2_struggle.2000.f.desc:0 "Ngài khuyến khích các thương nhân tiếp tục vi phạm ḥisba nhằm giảm căng thẳng"
	fp2_struggle.2000.f.notif:0 "Khoan Dung Với Thương Nhân Ngoại Quốc"
	fp2_struggle.2000.f.notif.desc:0 "Các vi phạm chợ chỉ tăng lên khi muḥtasib đã ngừng thực thi quy định"
	fp2_struggle.2001.t:0 "Ngôi Làng Bị Bỏ Rơi"
	fp2_struggle.2001.desc:0 "Khi Ta đi tuần quanh khu [ROOT.GetCharacter.Custom('FortifiedBuilding')] của mình, một trưởng lão nông dân tiến đến chỗ Ta.\n\n"Thưa [ROOT.Char.GetLadyLord] vĩ đại, xin hãy thương xót chúng Ta và cứu ngôi làng của chúng Ta khỏi sự chuyên chế của [fp2_2001_desperate_county.GetHolder.GetName]". [fp2_2001_desperate_county.GetHolder.GetSheHe|U] đã bỏ bê khu định cư của chúng Ta quá lâu. Người dân khao khát một người cai trị mới; họ khao khát ngài, [ROOT.Char.GetLadyLord].""
	fp2_struggle.2001.desc.extra.a:0 "[fp2_2001_desperate_county.GetName] thuộc về đồng minh của Ngài, [fp2_2001_desperate_county.GetHolder.GetName]. Việc hỗ trợ quân sự cho phiến quân sẽ bị coi là một hành động xâm lược.\n\n"
	fp2_struggle.2001.desc.extra.b:0 "[fp2_2001_desperate_county.GetHolder.GetName], người đang sở hữu [fp2_2001_desperate_county.GetName], hiện đang có hiệp ước đình chiến với Ngài. Giúp đỡ nông dân sẽ là vi phạm thỏa thuận này."
	fp2_struggle.2001.a:0 "Ta hứa với các ngươi, [fp2_2001_desperate_county.GetNameNoTierNoTooltip] sẽ được giải phóng!"
	fp2_struggle.2001.a.desc:0 "Ngài sẽ phải chiếm được [fp2_2001_desperate_county.GetNameNoTier] trong vòng #bold năm năm#!"
	fp2_struggle.2001.a.a.desc:0 "[2001_scoped_chaplain.GetTitledFirstName] sẽ vô cùng thất vọng nếu Ngài thất bại"
	fp2_struggle.2001.a.notif:0 "Yêu Sách Chính Nghĩa Được Ban"
	fp2_struggle.2001.b:0 "Các ngươi có sẵn sàng từ bỏ [fp2_2001_desperate_elder.GetFaith.HighGodName] vì điều đó không?"
	fp2_struggle.2001.b.desc:0 "Ngài sẽ phải chiếm được [fp2_2001_desperate_county.GetNameNoTier] trong vòng #bold mười năm#!"
	fp2_struggle.2001.b.notif:0 "[fp2_2001_desperate_county.GetNameNoTierNoTooltip] Cải Sang [ROOT.Char.GetFaith.GetNameNoTooltip]"
	fp2_struggle.2001.b.notif.desc:0 "Dù là tự nguyện hay vì tuyệt vọng, ngôi làng [fp2_2001_desperate_county.GetNameNoTier] đã chấp nhận [ROOT.Char.GetFaith.GetName]"
	fp2_struggle.2001.c:0 "Hãy chứng minh quyết tâm của các ngươi; chĩa giáo về phía [fp2_2001_desperate_county.GetHolder.GetFirstNameNoTooltip]!"
	fp2_struggle.2001.d:0 "Có lẽ các ngươi nên bắt đầu bằng việc nộp cống cho [ROOT.Char.GetLadyLord] mới của mình..."
	fp2_struggle.2001.d.notif:0 "Dân Làng Tuyệt Vọng Trả Phí Giải Phóng"
	fp2_struggle.2001.d.notif.desc:0 "Những nông dân từ [fp2_2001_desperate_county.GetName] đã gom góp mọi thứ có giá trị cuối cùng để Triều cống phẩm cho việc giải phóng"
	fp2_struggle.2001.e:0 "Ta xin lỗi, nhưng người dân của các ngươi sẽ phải tự giúp mình."
	fp2_struggle.2001.e.desc:0 "Ngài bỏ mặc những nông dân cho số phận của họ dưới sự cai trị của [fp2_2001_desperate_county.GetHolder.GetName]"
	fp2_struggle.2001.f:0 "Ta đứng về phía [fp2_2001_desperate_county.GetHolder.GetTitleAsNameNoTooltip] và sẽ báo cho [fp2_2001_desperate_county.GetHolder.GetHerHim] về sự phản bội của các ngươi!"
	fp2_every_major_vassal_notifier:0 "Mọi chư hầu quyền lực"
	fp2_every_major_same_faith_vassal_notifier:0 "Mọi chư hầu quyền lực theo [dyloc_powerful_vassal_faith.GetAdjective]"
	fp2_every_major_different_faith_vassal_notifier:0 "Mọi chư hầu quyền lực không theo [dyloc_powerful_vassal_faith.GetAdjective]"
	fp2_every_major_same_culture_vassal_notifier:0 "Mọi chư hầu quyền lực thuộc văn hóa [dyloc_powerful_vassal_culture.GetNameNoTooltip]"
	fp2_one_independent_ruler_of_each_culture_notifier:0 "Một [independent_ruler|E] tham gia [struggle|E] này của mỗi [culture|E]"
	fp2_struggle.2002.t.a:0 "Ngôi Làng Được Giải Phóng"
	fp2_struggle.2002.t.b:0 "Nghĩa Vụ Chưa Hoàn Thành"
	fp2_struggle.2003.t:0 "Băng Nhóm Chim Lạc"
	fp2_struggle.2003.desc:1 "Một nhóm lính đánh thuê bị thương và mất phương hướng đã đến [fp2_2003_county_town.GetName]. Người dân địa phương nói rằng họ nghe lỏm được chuyện về việc "ổn định cuộc sống sau khi cướp bóc một mục tiêu dễ dàng" và bắt đầu lo lắng.\n\nCăng thẳng đang dâng cao và xung đột có thể xảy ra nếu Ta không can thiệp vào chuyện này."
	fp2_struggle.2003.a:0 "Cầu xin họ rời đi."
	fp2_struggle.2003.a.a.notif:0 "Bọn cướp phớt lờ lời cầu xin"
	fp2_struggle.2003.a.b.notif:0 "Giải Quyết Hòa Bình"
	fp2_struggle.2003.b:0 "Đề nghị họ một vị trí trong đội đồn trú của thành phố."
	fp2_struggle.2003.b.desc:0 "Đội đồn trú có thể cần những binh lính kỳ cựu, và cho một con thú bị thương ăn là cách nhanh nhất để thuần hóa nó"
	fp2_struggle.2003.c:0 "Đuổi chúng ra khỏi thành phố!"
	fp2_struggle.2003.c.desc:0 "Ngài tổ chức một cuộc tấn công phủ đầu, sử dụng đội đồn trú địa phương trong một cuộc tập kích bất ngờ để đẩy lũ phá hoại ra ngoài\n"
	fp2_struggle.2003.c.a:0 "Lính đánh thuê tàn sát binh lính"
	fp2_struggle.2003.c.b:0 "Binh lính chế ngự lính đánh thuê"
	fp2_struggle.2003.c.b.notif:0 "Mối Đe Dọa Lính Đánh Thuê Bị Dập Tắt"
	fp2_struggle.2003.d:0 ""Trông các ngươi có vẻ là nhân lực làm nông khá tốt đấy!""
	fp2_struggle.2003.d.desc:0 "Ngài đề nghị mua đất nông nghiệp và thiết bị từ người dân địa phương rồi giao cho lính đánh thuê"
	fp2_struggle.2003.e:0 "Cứ để người dân địa phương tự xử lý."
	fp2_struggle.2003.e.desc:0 "Căng thẳng vốn đã cao, khiêu khích họ chỉ làm tăng thêm rủi ro"
	fp2_struggle.2003.e.notif.a:0 "Lính Đánh Thuê Cướp Phá Vùng Nông Thôn"
	fp2_struggle.2003.e.notif.b:0 "Sự Khiêu Khích Của Nông Dân Kết Thúc Trong Bi Kịch"
	fp2_struggle.2003.e.notif.b.desc:0 "Người dân địa phương yêu cầu lính đánh thuê rời đi, nhưng điều đó chỉ đủ để khiến họ tấn công."
	fp2_struggle.2003.e.notif.c:0 "Lính Đánh Thuê Ổn Định Cuộc Sống"
	fp2_struggle.2003.e.notif.c.desc:0 "Những lính đánh thuê đã bắt đầu thích [fp2_2003_county_town.GetName]."
	fp2_struggle.2007.t:0 "Một Lâu Đài Xứng Tầm Iberia"
	fp2_struggle.2007.desc.main:1 "đã sẵn sàng để phát triển," [fp2_2007_scoped_steward.GetCouncilTitleFirstName] của Ta nói. "Với tài trợ của ngài, chúng ta có thể củng cố [fp2_2007_free_real_estate.GetCounty.GetTitle.GetNameNoTier] trước những kẻ thù đang chờ đợi với chi phí #emphasis giảm đáng kể#!. [2007_vassal_sponsor.GetTitledFirstName] đã kiến nghị xây dựng một [ROOT.Char.Custom('FortifiedBuilding')] theo phong cách [fp2_2007_foreign_faith.GetAdjective] tại đó, thậm chí còn đề nghị bỏ ra một phần tiền của [2007_vassal_sponsor.GetHerHis] để thuyết phục ngài. Tuy nhiên, các chư hầu khác của ngài yêu cầu ngài sử dụng các kiến trúc sư [ROOT.Char.GetFaith.GetAdjective] địa phương. Dù ngài chọn ai, đây sẽ là cơ hội vàng để củng cố toàn bộ vương quốc." Vấn đề duy nhất là #EMP ai#! sẽ được chọn cho cơ hội vàng này..."
	fp2_struggle.2007.desc.a:0 ""Lãnh địa của ngài $fp2_struggle.2007.desc.main$"
	fp2_struggle.2007.desc.b:0 ""Lãnh địa của [fp2_2007_castle_holder.GetTitledFirstName] $fp2_struggle.2007.desc.main$"
	fp2_struggle.2007.a:0 "Ta sẽ thuê kiến trúc sư [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
	fp2_struggle.2007.a.castile:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] à? [fp2_2007_foreign_faith.GetAdjectiveNoTooltip] à? Ta muốn một kiến trúc sư [fp2_2007_allegedprotocastilean.GetNameNoTooltip]!"
	fp2_struggle.2007.a.notif:0 "Việc xây dựng lâu đài sẽ bắt đầu tại [fp2_2007_free_real_estate.GetName]."
	fp2_struggle.2007.a.major_vassal_flavor:0 "Ý kiến của các chư hầu quyền lực cùng đức tin sẽ không bị ảnh hưởng vì đây là kết quả được mong đợi."
	fp2_struggle.2007.a.castile.favor:0 "Không ai phản đối một [fp2_2007_allegedprotocastilean.GetNameNoTooltip] vì họ nổi tiếng là những kiến trúc sư xuất sắc"
	fp2_struggle.2007.b:0 "Ta sẽ thuê kiến trúc sư [fp2_2007_foreign_faith.GetAdjectiveNoTooltip]."
	fp2_struggle.2007.b.flavor:0 "Hành động này sẽ được xem như một tuyên bố bất kể đức tin."
	fp2_struggle.2007.c:0 "Ta sẽ tự thiết kế lâu đài, khó đến mức nào chứ?"
	fp2_struggle.2007.c.flavor:0 "Thiết kế một lâu đài mà không tiêu tốn cả gia tài là một nhiệm vụ vô cùng khó khăn."
	fp2_struggle.2007.c.roco:0 "$royal_architect_court_position$ sẽ xử lý nhiệm vụ này."
	fp2_struggle.2007.c.notif.a.t:0 "Nền Móng Mục Nát, Công Trình Sụp Đổ"
	fp2_struggle.2007.c.notif.a.desc:0 "Kế hoạch xây lâu đài của Ngài thất bại thảm hại"
	fp2_struggle.2007.c.notif.b.desc:0 "Thiết kế đã thành công"
	fp2_struggle.2007.d:1 "Ta #EMP sẽ không#! tài trợ bất kỳ lâu đài nào, nhất là khi nó không phải của ta!"
	fp2_struggle.2007.d.alt:0 "Những vùng đất này không cần lâu đài, cứ để chúng yên."
	fp2_struggle.2008.t:0 "Tội Lỗi Của [fps_2008_misdeed_actor.GetCouncilTitle]"
	fp2_struggle.2008.desc:0 "Vào buổi tối, [fps_2008_misdeed_actor.GetCouncilTitleFirstName] ngồi trong phòng hội đồng ánh sáng lờ mờ. Ánh mắt và cây bút của [fps_2008_misdeed_actor.GetHerHis|U] tập trung vào các báo cáo chi tiêu có vẻ vô hại. Tuy nhiên, bên cạnh [fps_2008_misdeed_actor.GetHerHim] là những khuôn đất sét có đóng ấn hoàng gia, thứ chỉ cần thiết nếu [fps_2008_misdeed_actor.GetSheHe] định lừa đảo vương quốc. Thật khó tin khi một [fps_2008_misdeed_actor.GetWomanMan] ở vị trí của [fps_2008_misdeed_actor.GetHerHis] lại dám hành động đáng xấu hổ như vậy dưới ánh mắt của [ROOT.Char.GetFaith.HighGodName]!\n\nĐáng xấu hổ... nhưng cũng rất khéo léo. Nếu Ta không bắt gặp [fps_2008_misdeed_actor.GetHerHim] ngay tại chỗ, có lẽ chẳng ai biết đến âm mưu của [fps_2008_misdeed_actor.GetHerHis]."
	fp2_struggle.2008.a:0 "Ta đã thấy đủ rồi, tống ngươi vào ngục!"
	fp2_struggle.2008.b.a:0 "Dạy ta cách làm giả giấy tờ và ta sẽ tha cho ngươi."
	fp2_struggle.2008.b.flavor:1 "Ngài gạt bằng chứng sang một bên để đổi lấy kiến thức về nghệ thuật lừa dối."
	fp2_struggle.2008.c:0 "Số tiền đó vốn là dành cho ta... đúng chứ?"
	fp2_struggle.2008.c.flavor:0 "Ngài che giấu bằng chứng sai phạm và tham gia vào kế hoạch tham nhũng."
	fp2_struggle.2008.d:0 "Ngươi sẽ bị bêu xấu trước quảng trường thị trấn."
	fp2_struggle.2008.d.flavor:0 "Ngài phơi bày hành động của [fps_2008_misdeed_actor.GetHerHis] trước dân chúng, để họ tự phán xét [fps_2008_misdeed_actor.GetHerHim]. Đi ngược lại mong muốn giữ kín chuyện của các chư hầu và cố vấn."
	fp2_struggle.2009.t:0 "Bắt Giữ Những Kẻ Trộm Trong Truyền Thuyết"
	fp2_struggle.2009.desc:0 ""Ngươi chọn nhầm lâu đài rồi, đồ ngu!" nguyên soái của ta hét lên khi [fp2_2009_marshal.GetSheHe] chĩa kiếm đe dọa kẻ xâm nhập đang run rẩy.\n\nDưới áp lực tiếp tục từ nguyên soái của ta, [fp2_2009_garduna_young_thief.GetWomanMan] trẻ tuổi giải thích rằng [fp2_2009_garduna_young_thief.GetSheHe] là một phần của một tổ chức tội phạm lớn có nguồn gốc từ [fp2_2009_involved_ruler.GetPrimaryTitle.GetName] và do kẻ khét tiếng [fp2_2009_garduna_guild_master.GetFullNameNicknamed] chỉ huy. "Vậy ra ngươi định lập một bang hội trộm cắp mới ngay dưới mũi ta, hả?" ta hỏi, và tên trộm chỉ gật đầu. [fp2_2009_garduna_young_thief.GetSheHe|U] sẵn sàng trao đổi thêm thông tin để đổi lấy mạng sống của [fp2_2009_garduna_young_thief.GetHerHis]."
	fp2_struggle.2009.a:0 "Vương quốc này không đủ chỗ cho #EMP hai#! [Select_CString(ROOT.Char.IsFemale,'nữ hoàng','vua')]."
	fp2_struggle.2009.a.flavor:0 "Ngài thả tên trộm để đổi lấy vị trí của thủ lĩnh chúng, rồi lên đường tiêu diệt hắn và giành danh hiệu "Kẻ Diệt Trộm"."
	fp2_struggle.2009.b:0 "Nói cho ta biết đồng bọn của ngươi đang ẩn náu ở đâu, và ngươi có thể còn sống."
	fp2_struggle.2009.b.blues:0 "Nhận [trait|E] #TUT_KW [GetTrait('depressed_1').GetName(GetNullCharacter)]#! sau khi bán đứng Bạn Bè của [fp2_2009_garduna_young_thief.GetHerHis]"
	fp2_struggle.2009.c:0 "Bang hội trộm của ngươi nghe có vẻ... #emphasis có thể đánh thuế được.#!"
	fp2_struggle.2009.d:0 "Làm việc cho ta, phá rối [fp2_2009_involved_ruler.GetPrimaryTitle.GetNameNoTooltip]."
	fp2_struggle.2009.d.flavor.st:0 "Ngài trả tiền cho bang hội trộm để chúng rời khỏi lãnh địa của Ngài"
	fp2_struggle.2009.e:0 "Ta sẽ tặng cái đầu bị chặt của ngươi cho [fp2_2009_involved_ruler.GetTitledFirstNameNoTooltip]."
	fp2_struggle.2009.e.a:0 "Bang hội trộm có thể trả đũa bằng cách gây bất ổn một quận ngẫu nhiên"
	# Note to spanish translators: please translate this as "Cazando a la Martes Foina", saying Garduña is too blatant.
	fp2_struggle.2010.t:0 "Săn Chồn Cây"
	fp2_struggle.2010.desc:0 "Sau khi hành trình tới [fp2_2009_involved_capital_county.GetNameNoTierNoTooltip], ta bước vào một nhà thờ bị bỏ hoang. [fp2_2009_garduna_guild_master.GetNameNoTooltip] đã chờ sẵn ta.\n\n"[ROOT.Char.GetFirstNameNoTooltip], đúng không? [ROOT.Char.Custom('signature_weapon')] của ngươi cho ta biết ngươi không đến đây để thương lượng. Nhưng trộm cắp gần với thương nhân hơn là binh lính. Cả hai ta có thể rời đi hài lòng nếu ngươi trả tiền cho ta. Khi đó, ta sẽ không còn dính dáng gì tới [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ngươi nữa.""
	fp2_struggle.2010.b:0 "Chuẩn bị bị chặt đầu đi, đồ rắn độc!"
	fp2_struggle.2010.c:0 "Trả tiền bảo kê nghe có vẻ tốt hơn là đánh nhau..."
	fp2_struggle.2011.desc:0 "Với việc [fp2_2009_garduna_guild_master.GetFirstName] bị đánh bại, bang hội trộm và các hoạt động của chúng đã bị tê liệt."
	fp2_struggle.2011.a:0 "Làm [Select_CString(ROOT.Char.IsFemale,'Nữ hoàng','Vua') #DIE2 của bọn trộm#! thật là tốt"
	fp2_struggle.2012.t:0 "Báo cáo từ nguồn địa phương:"
	fp2_struggle.2012.desc:0 "Có một băng trộm tàn nhẫn đang hoành hành tại [fp2_2009_involved_capital_county.GetNameNoTierNoTooltip]. Rõ ràng có kẻ đã cố tình tài trợ cho bọn tội phạm này để chống lại chúng ta. Hiện tại, tốt nhất nên cử một nguyên soái tới bảo vệ khu vực."
	fp2_struggle.2012.a:0 "Kẻ nào làm chuyện này đang chơi bẩn!"
	fp2_struggle.2012.t.alt:1 "[fp2_2012_sender.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
	fp2_struggle.2012.desc.alt:0 "Kèm theo bức thư này Ngài sẽ thấy cái đầu bị chặt của một trong những tên trộm đã gây náo loạn trong cả hai lãnh địa của chúng ta. Ta đã tự tiện xử tử [fp2_2009_garduna_young_thief.GetHerHim] và thông báo cho đồn trú của Ngài tại [fp2_2009_involved_capital_county.GetNameNoTier] về vị trí nơi đồng bọn của [fp2_2009_garduna_young_thief.GetHerHis] ẩn náu."
	fp2_struggle.2012.a.alt:0 "[fp2_2009_has_gifted_head.GetFirstNameNoTooltip] đã mang đến cho ta một món quà tuyệt vời!"
	fp2_struggle.2013.t:0 "Bí Mật Đổi Lấy Tự Do"
	fp2_struggle.2013.desc:0 "[fp2_2013_prisoner_with_a_secret.GetFullNameRegnal] là tù nhân trong tay ta; ý thức rõ điều đó, [fp2_2013_prisoner_with_a_secret.GetSheHe] đưa ra một lời cầu xin tuyệt vọng... "Ta sẽ nói cho ngươi bí mật của [fp2_2013_secret_owner.GetFullNameRegnal] nếu ngươi thả ta.""
	fp2_struggle.2013.a:0 "Nói bí mật cho ta và ngươi sẽ được tự do, [fp2_2013_prisoner_with_a_secret.GetWomanMan]"
	fp2_struggle.2013.a.a:0 "Ngài sẽ biết bí mật của #TUT_KW [fp2_2013_secret_owner.GetFirstName]#!"
	fp2_struggle.2013.b:0 "Tại sao phải thương lượng khi ta có thể tra tấn ngươi?"
	fp2_struggle.2013.b.b:0 "[fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] chống lại tra tấn"
	fp2_struggle.2013.c:0 "Đồ rắn phản bội! [fp2_2013_secret_owner.GetFirstNameNoTooltip] sẽ nghe chuyện này!"
	fp2_struggle.2013.c.desc:0 "Không học được bí mật, Ngài quyết định đưa [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] đến trước mặt [fp2_2013_secret_owner.GetFirstNameNoTooltip] để trừng phạt sự phản bội của [fp2_2013_prisoner_with_a_secret.GetHerHis]."
	fp2_struggle.2013.c.a:0 "[fp2_2013_secret_owner.GetFirstName] sẽ quyết định số phận của [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip]"
	fp2_struggle.2013.d:0 "Ta không hứa gì cả, cứ nói đi rồi ta sẽ cân nhắc sau..."
	fp2_struggle.2014.t:0 "Gửi tới [ROOT.Char.GetNameNoTooltip] đáng kính:"
	fp2_struggle.2014.desc.start:0 "Cảm ơn vì đã trả lại [fp2_2013_prisoner_with_a_secret.GetNameNoTooltip] cho Ta, "
	fp2_struggle.2014.desc.light:0 "nhưng Ta không tin rằng [fp2_2013_prisoner_with_a_secret.GetSheHe] đã làm điều gì đáng bị trừng phạt. Ta đã thả [fp2_2013_prisoner_with_a_secret.GetHerHim] mà không gây tổn hại.$fp2_struggle.2014.desc.end$"
	fp2_struggle.2014.desc.heavy.start:0 "Ta hiểu kẻ khốn này đã cố gắng bán bí mật của ta để cứu lấy cái mạng của chính [fp2_2013_prisoner_with_a_secret.GetHerHis]."
	fp2_struggle.2014.desc.heavy.outcome.prison:0 "$fp2_struggle.2014.desc.heavy.start$ Ta sẽ đảm bảo rằng cả [fp2_2013_prisoner_with_a_secret.GetSheHe] lẫn những bí mật đó sẽ không bao giờ thấy ánh sáng mặt trời. $fp2_struggle.2014.desc.end$"
	fp2_struggle.2014.desc.heavy.outcome.death:0 "$fp2_struggle.2014.desc.heavy.start$ Thay vào đó, Ta đã ra lệnh cho đao phủ lột sạch mọi thứ khỏi hắn! $fp2_struggle.2014.desc.end$"
	fp2_struggle.2014.desc.end:0 "\n\nNgài đã làm tốt cho Ta, Ta sẽ không quên điều này. Cảm ơn."
	fp2_struggle.2014.b:0 "Tiếc là [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] không bị xử tử, nhưng ít nhất ta cũng được ưu ái."
	fp2_struggle.2015.t:0 "Bức Thư Ở Mặt Sau"
	fp2_struggle.2015.desc:0 "Khi đi ngang qua triều đình của mình, ta thấy một gương mặt lạ tiến đến. "Thưa chủ nhân [ROOT.Char.Custom('ComplimentAdjective')] nhất của Ta, Ta là [fp2_struggle_2015_peasant_to_murder.GetFirstName], cựu cận thần của [fp2_struggle_2015_murder_requester_vassal.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. [fp2_struggle_2015_murder_requester_vassal.GetSheHe|U] đã yêu cầu Ta đến trình diện trước ngài và tham gia triều đình. [fp2_struggle_2015_murder_requester_vassal.GetSheHe|U] cũng đưa Ta một lá thư giới thiệu chỉ mình ngài được đọc." Sau đó, [fp2_struggle_2015_peasant_to_murder.GetSheHe] đưa cho ta bức thư niêm phong.\n\nSau khi phá niêm phong, lá thư chỉ viết: "#EMP Gửi [ROOT.Char.GetFirstName], xin hãy ám sát người mang lá thư này#!. - [fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip]""
	fp2_struggle.2015.a:0 ""Chào mừng! Lại đây, uống chút #DIE2 (đã tẩm độc)#! [ROOT.Char.Custom('GetExpensiveDrink_Singular')].""
	fp2_struggle.2015.a.a:0 "Ngài làm hỏng nỗ lực đầu độc"
	fp2_struggle.2015.a.murder_scheme:0 "[fp2_struggle_2015_murder_requester_vassal.GetTitledFirstName] sẽ tiếp tục cố giết [fp2_struggle_2015_peasant_to_murder.GetFirstName]"
	fp2_struggle.2015.a.b:0 "Cận thần bị đầu độc!"
	fp2_struggle.2015.b:0 "Bỏ qua bức thư và chấp nhận [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] vào triều."
	fp2_struggle.2015.c:0 ""Ngươi đã bị đánh dấu để chết, chạy đi khi còn có thể.""
	fp2_struggle.2015.c.a:0 "[fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] "bí ẩn thất bại" trong việc trốn thoát"
	fp2_struggle.2015.c.b:0 "[fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip] bị lừa rằng [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] đã chết"
	fp2_struggle.2016.t:0 "Gửi tên ngốc [ROOT.Char.GetFirstNameNoTooltip],"
	fp2_struggle.2016.desc:0 "Ta biết ngươi đã giết #DIE2 (theo yêu cầu của ta)#! sứ giả yêu quý nhất của ta [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip]. Nhưng đừng lo, với tư cách chư hầu trung thành của ngươi, ta sẽ giữ bí mật này giữa hai ta. Miễn là chúng ta tiếp tục giúp đỡ lẫn nhau, như những người Bạn Tốt."
	fp2_struggle.2016.a:0 "Ta đã bị lừa! Đồ [fp2_struggle_2015_murder_requester_vassal.Custom2('InsultNoun', ROOT.Char)] đó!"
	fp2_struggle.2018.t:1 "Cờ Vua Cho Bạn Bè"
	fp2_struggle.2018.t.outcome.a:0 "Rèn Luyện Tình bạn"
	fp2_struggle.2018.t.outcome.b:0 "Tận Hưởng Sự Đồng Hành"
	fp2_struggle.2018.t.outcome.c:0 "Một Khoảng Thời Gian Khó Chịu"
	fp2_struggle.2018.desc.desc_combat_clarification:0 "Trong tâm trí ta, những thanh kiếm va chạm, một trận chiến khốc liệt của phân tích chiến lược và ý chí thô bạo.\n\nChúng ta chỉ đang di chuyển quân cờ trên bàn, nhưng sự tập trung mãnh liệt khiến căn phòng và bàn cờ biến mất vào hư không, để lại chúng ta trên chiến trường của trí tưởng tượng; từng nước một tiến gần hơn tới chiến thắng, chiến đấu dữ dội cho từng con tốt...\n\n"
	fp2_struggle.2018.desc.desc_intro:0 "Khi phút giây biến thành giờ và hoàng hôn báo hiệu kết thúc thời gian của chúng ta, [fp2_2017_gamervassal.GetFirstNameNoTooltip] nhận xét... "
	fp2_struggle.2018.desc.good_intro_match:0 ""À, một ván đấu tuyệt vời!"
	fp2_struggle.2018.desc.bad_intro_match:0 ""Ugh, ván đấu gì mà chán... Ngươi nên luyện tập nhiều hơn, nước đi của ngươi quá đơn giản và dễ đoán, chẳng có niềm vui khi chơi với đối thủ không thể tự phòng thủ. "
	fp2_struggle.2018.desc.fought_hard:0 "$fp2_struggle.2018.desc.good_intro_match$ Ngươi đã chiến đấu rất quyết liệt, ta tôn trọng điều đó. "
	fp2_struggle.2018.desc.was_creative:0 "$fp2_struggle.2018.desc.good_intro_match$ Ngươi đã khiến ta bất ngờ với khai cuộc hà mã phía vua, thật là một nước đi táo bạo! "
	fp2_struggle.2018.desc.match_end_win:0 "Và ngươi còn thắng nữa, xứng đáng! "
	fp2_struggle.2018.desc.match_end_loss:0 "Nhưng cuối cùng ta vẫn thắng. "
	fp2_struggle.2018.desc.match_end_loss_noticed:0 "Ta vẫn thắng, dù cảm giác như đó là kế hoạch của ngươi ngay từ đầu. "
	fp2_struggle.2018.desc.social_pre_intro:0 "Chúng ta giết thời gian bằng cách uống rượu và nói chuyện đủ thứ, từ chuyện làng mạc gần đó tới kết quả các trận đấu tay đôi giữa [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]. "
	fp2_struggle.2018.desc.social_pre_intro_crit:0 "[fp2_2017_gamervassal.GetFirstName] hoàn toàn bị cuốn hút vào cuộc trò chuyện và tham gia nhiệt tình, bàn luận các chủ đề với đam mê lớn."
	fp2_struggle.2018.desc.social_pre_intro_good:0 "[fp2_2017_gamervassal.GetFirstName] rõ ràng rất thích cuộc trò chuyện và sự hiếu khách.\n\n"
	fp2_struggle.2018.desc.social_pre_intro_bad:0 "[fp2_2017_gamervassal.GetFirstName] tỏ ra chán nản và lơ đãng suốt buổi...\n\n"
	fp2_struggle.2018.desc.social_intro:0 ""Ta nghĩ mình uống đủ rồi. "
	fp2_struggle.2018.desc.social_good:0 "[ROOT.Char.Custom('GetExpensiveDrink_Singular')] thật tuyệt, cảm ơn. "
	fp2_struggle.2018.desc.outcome_0:0 "Ta đã rất vui, ta nên ghé thăm ngươi thường xuyên hơn!""
	fp2_struggle.2018.desc.outcome_1:0 "Cũng vui đấy, có lẽ ta sẽ ghé lại lúc khác.""
	fp2_struggle.2018.desc.outcome_2:0 "Ta nên đi rồi, [SCOPE.sC('fp2_2017_gamervassal').Custom2('RelationToMe', SCOPE.sC('fp2_2017_questgiver'))] của ta chắc nhớ ta. Tạm biệt, [ROOT.Char.GetFirstNameNoTooltip].""
	fp2_struggle.2018.a:0 "Thành công! Ta đã chinh phục được [fp2_2017_gamervassal.GetHerHim]!"
	fp2_struggle.2018.b:0 "Chúng ta chưa hẳn thành bạn, nhưng cũng đã vui!"
	fp2_struggle.2018.c:0 "Ừm, chuyện đó không ổn lắm..."
	fp2_struggle.2020.t:1 "Thứ này quý như vàng đấy, cô bé!"
	fp2_struggle.2020.desc:0 "Đi ngang qua [fp2_2020_valencia.GetName], một phụ nữ nông dân đưa ta một cốc sữa mát lạnh có vị ngọt hơn bất cứ thứ gì ta từng nếm. "Thức uống tuyệt vời này là gì vậy?" ta hỏi, và cô đáp "sữa từ hạnh nhân đất."\n\nKhông ai có thể cưỡng lại sức hấp dẫn của thứ đồ uống này trong ngày hè nóng bức, không đứa trẻ nào không mỉm cười khi được mời một cốc, và không người Valencia nào không mê vị ngọt của nó. #EMP Thứ này không phải sữa, nó là vàng!#!"
	fp2_struggle.2020.a:0 ""Từ nay [fp2_2020_valencia.GetNameNoTooltip] sẽ chỉ trồng hạnh nhân đất!""
	fp2_struggle.2020.a.desc:0 "Ngài ép nông dân chỉ trồng hạnh nhân đất, tạo ra sản phẩm xa xỉ cho thủ đô."
	fp2_struggle.2020.b:0 ""Đưa ta toàn bộ thùng của ngươi, thứ này sẽ là trung tâm bữa tiệc tiếp theo của ta!""
	fp2_struggle.2020.c:0 ""Ta sẽ không sa vào cám dỗ của thứ đồ uống này, biến đi!""
	fp2_struggle.2020.c.desc:0 "Với trái tim nặng nề, Ngài từ bỏ ham muốn horchata và nổi tiếng vì chống lại cám dỗ lớn."
	fp2_struggle.2020.d:0 "Tài trợ trồng thêm hạnh nhân đất khắp cánh đồng."
	fp2_struggle.2021.t:0 "Sự Trở Lại Của Vua Trộm"
	fp2_struggle.2021.desc:0 ""Xin chào [ROOT.Char.GetFirstName], ta cá là ngươi không nghĩ sẽ gặp lại ta. "
	fp2_struggle.2021.desc.alt.cutout:0 "Đặc biệt sau khi ngươi phá hủy tổ chức của ta nhiều năm trước. Nhưng phá thứ gì đó dễ như ghép lại vậy, và ta không muốn chơi trò mèo vờn chuột nữa. Cho ta đường an toàn tới [fp2_2021_old_napoly.GetNameNoTier] và ngươi sẽ không bao giờ thấy ta nữa, bang hội sẽ được dựng lại ở nơi xa khỏi của cải của ngươi.""
	fp2_struggle.2021.desc.alt.paidoff:0 "Đặc biệt khi chúng ta đã thỏa thuận không làm phiền ngươi nữa. Nhưng túi tiền của ta lại bắt đầu nhẹ quá. Đây có thể là đất màu cho tội phạm, nhưng không phải để tổ chức. Ta muốn chuyển người của mình tới [fp2_2021_old_napoly.GetNameNoTier], cho chúng ta đường đi an toàn và ngươi sẽ không phải lo nữa.""
	fp2_struggle.2021.desc.alt.work:0 "Nhưng ta khá thích làm việc với ngươi lần trước, và ta thiếu [ROOT.Char.GetWomenMen] đáng tin. Ta muốn nghỉ hưu khi đang thắng thế, ngươi có thể đảm bảo ta tới [fp2_2021_old_napoly.GetNameNoTier] an toàn không?""
	fp2_struggle.2021.desc.alt.behead:0 "Ta không đến để trả thù cho [fp2_2009_garduna_young_thief.GetFirstName], mà để nghỉ hưu. Một cái đầu đã quá đủ và ta biết đầu mình có thể là cái tiếp theo. Cho ta rời đi tới [fp2_2021_old_napoly.GetNameNoTier] và ngươi sẽ không thấy ta nữa. Không cần kết thúc cuộc gặp này trong máu.""
	fp2_struggle.2021.desc.outro:1 "[fp2_2009_garduna_guild_master.GetFullNameNicknamed] nói, tay cầm túi tiền run rẩy và tay kia giấu một vũ khí."
	fp2_struggle.2021.a:0 ""Được thôi, ta sẽ giúp ngươi rời đi tới Ý.""
	fp2_struggle.2021.a.alt:0 ""Hay là cứ nghỉ hưu ở Ý đi?""
	fp2_struggle.2021.a.a:0 "[fp2_2009_garduna_guild_master.GetFirstName] sẽ rời tới [fp2_2021_old_napoly.GetName] và biến mất"
	fp2_struggle.2021.b:0 ""Hay là gia nhập hàng ngũ của ta?""
	fp2_struggle.2021.c:0 ""Nghe mệt mỏi quá, làm gián điệp thay vì tội phạm thì sao?""
	fp2_struggle.2021.c.flavor:0 "Ngài đưa [fp2_2009_garduna_guild_master.GetFirstNameNoTooltip] đủ tiền để vận hành mạng lưới gián điệp tìm bí mật cho Ngài."
	fp2_struggle.2021.c.a:0 "Mạng lưới gián điệp sẽ tìm và báo cáo tối đa hai bí mật từ các lãnh chúa khác trong cuộc đấu tranh"
	fp2_struggle.2021.c.spynet.a:0 "Mạng Lưới Gián Điệp Tìm Thấy Bí Mật:"
	fp2_struggle.2021.c.spynet.b:0 "Mạng gián điệp không tìm được bí mật"
	fp2_struggle.2021.c.spynet.b.desc:0 "Mạng gián điệp do [fp2_2009_garduna_guild_master.GetFirstName] điều hành không tìm được bí mật nào, nhưng mật vụ của Ngài học được nhiều điều..."
	fp2_struggle.2021.d:0 ""Không, lần này ngươi sẽ không thoát đâu! Chuẩn bị đi!""
	fp2_struggle.2021.d.alt:0 "Ngươi nói đúng, cái đầu tiếp theo #EMP sẽ#! là của ngươi! #BER Chết đi!#!"
	fp2_struggle.2021.d.a:0 "Giết Kẻ Thù Cũ"
	fp2_struggle.2021.d.b:0 "@warning_icon! Ngài sẽ bước vào một trận đấu tay đôi sinh tử với [dueltarget.GetFirstName]"
	fp2_struggle.2023.t:0 "Một Vị Vua Cho Thi Sĩ"
	fp2_struggle.2023.desc:1 "Ta đang ở trong một chiếc lều tại một doanh trại nằm giáp biên giới [fp2_2023_foreign_king.GetPrimaryTitle.GetName], được giao nhiệm vụ đánh giá mức độ căng thẳng giữa hai vương quốc của chúng ta. Đột nhiên, một [fp2_2023_enemy_knight.GetWomanMan] bước vào lều, đòi gặp “vị chỉ huy mới”. Theo phản xạ, ta bước lên phía trước.\n\n“Vậy ra ngươi là chỉ huy mới à? Tốt thôi, chọn một thử thách đi, kẻ thua sẽ trả tiền rượu cho trại bên kia tối nay!” [fp2_2023_enemy_knight.GetFirstName], chỉ huy của doanh trại nước ngoài, nói — hoàn toàn không biết rằng ta là [ROOT.Char.GetFirstNameRegnal] chứ không phải chỉ là một chỉ huy quân sự bình thường."
	fp2_struggle.2023.a.desc:0 "Ngài nói cho những người lính biết mình là ai, chấm dứt buổi tiệc và yêu cầu quân lính của mình chống đẩy làm hình phạt vì giao du với kẻ địch khi đang làm nhiệm vụ."
	fp2_struggle.2023.a.a:1 ""Đồ ngu, ta là [ROOT.GetCharacter.GetFullNameNoTooltip]!"" 
	fp2_struggle.2023.b:0 ""Mang ra bài thơ cay độc nhất về lãnh chúa của nhau đi!"" 
	fp2_struggle.2023.b.desc:0 "Hai người viết những bài thơ bêu xấu vị quân chủ của phe kia, rồi đọc to trước đám đông đang hò reo."
	fp2_struggle.2023.b.a:0 "Ngài chế giễu [fp2_2023_foreign_king.GetFirstNameRegnal]"
	fp2_struggle.2023.b.b:0 "Bài thơ của Ngài bị chế nhạo"
	fp2_struggle.2023.c:0 ""Giải quyết chuyện này bằng một trận đấu thân thiện đi, en garde!"" 
	fp2_struggle.2023.c.desc:0 "Ngài tham gia một trận đấu không chí mạng với vị chỉ huy đối phương để quyết định ai sẽ trả tiền rượu sau đó."
	fp2_struggle.2023.c.exptooltip:0 "Ngài có thể nhận thêm kinh nghiệm [martial_lifestyle|E] từ trận đấu."
	fp2_struggle.2023.c.a:0 "Đánh bại Chỉ Huy Địch"
	fp2_struggle.2023.c.b:0 "Bị [fp2_2023_enemy_knight.GetNameNoTooltip] đánh bại"
	fp2_struggle.2023.d:0 ""Sao phải đợi đến quán rượu? Hãy thi uống bia ngay tại đây!"" 
	action_considered_haram_warning:0 "@warning_icon! #italic Hành động này được xem là#! #X haram#!#italic !#!"
	fp2_struggle.2023.d.a:0 "Ngài say đến bất tỉnh"
	fp2_struggle.2023.d.b:0 "Uống hết cả một thùng bia"
	fp2_struggle.2025.t:0 "Khổ Vì Thành Công"
	fp2_struggle.2025.desc:1 "Dưới ánh nắng ấm áp là một mảnh đất với những cánh đồng bỏ hoang và các tòa nhà đổ nát, cơn gió thì thầm nỗi cô độc qua những phiến đá mục nát của nó. Đây chỉ là một trong nhiều ngôi làng như vậy tại [fp2_2025_razed_land.GetNameNoTier], nơi cư dân đã rời đi khi chiến tranh đến và không bao giờ quay lại khi nó kết thúc, dù lá cờ của [ROOT.Char.GetPrimaryTitle.GetName] giờ đang tung bay trên vùng đất này.\n\n“Đẹp đấy chứ?” [ROOT.Char.Custom2('RelationToMe', fp2_2025_marshal)] của ta, [fp2_2025_marshal.GetFirstName], hỏi, “Đây là đất trống tự do, rất thích hợp để tái thiết. Chúng ta có thể dựng một tượng đài cho chiến thắng của mình ngay tại đây.”"
	fp2_struggle.2025.a:0 "Thần dân mới của ta cần thời gian để tang, không phải chiến đấu..."
	fp2_struggle.2025.b:0 "Ý tưởng tuyệt vời! Tại đây sẽ dựng nên tượng đài vĩ đại nhất!"
	fp2_struggle.2025.c:0 "Chúng ta sẽ khôi phục thị trấn này trở lại như trước."
	fp2_struggle.2025.d:0 "Ta sẽ lập các tiền đồn tạm thời ở đây để bảo vệ lãnh địa mới của mình."
	fp2_struggle.2050.title_main_ichi:0 "Bất An"
	fp2_struggle.2050.title_main_ni:0 "Tin Đồn Triều Đình"
	fp2_struggle.2050.title_main_san:0 "Những Lời Thì Thầm Thù Địch"
	fp2_struggle.2050.title_main_shi:0 "Mối Lo Ngại"
	fp2_struggle.2050.t_about_generic:0 "Về El Cid"
	fp2_struggle.2050.t_about_muslim:0 "Về El Sidi"
	fp2_struggle.2050.t_generic_one:0 "$fp2_struggle.2050.title_main_ichi$ $fp2_struggle.2050.t_about_generic$"
	fp2_struggle.2050.t_generic_two:0 "$fp2_struggle.2050.title_main_ni$ $fp2_struggle.2050.t_about_generic$"
	fp2_struggle.2050.t_generic_three:0 "$fp2_struggle.2050.title_main_san$ $fp2_struggle.2050.t_about_generic$"
	fp2_struggle.2050.t_generic_four:0 "$fp2_struggle.2050.title_main_shi$ $fp2_struggle.2050.t_about_generic$"
	fp2_struggle.2050.t_muslim_one:0 "$fp2_struggle.2050.title_main_ichi$ $fp2_struggle.2050.t_about_muslim$"
	fp2_struggle.2050.t_muslim_two:0 "$fp2_struggle.2050.title_main_ni$ $fp2_struggle.2050.t_about_muslim$"
	fp2_struggle.2050.t_muslim_three:0 "$fp2_struggle.2050.title_main_san$ $fp2_struggle.2050.t_about_muslim$"
	fp2_struggle.2050.t_muslim_four:0 "$fp2_struggle.2050.title_main_shi$ $fp2_struggle.2050.t_about_muslim$"
	fp2_struggle.2050.desc_court:0 "Những lời thì thầm lan khắp triều đình của ta như tàn lửa nhóm thành đám cháy. Dường như mọi người xung quanh đều tin rằng [fp2_2050_el_cid.GetFullName] đã hành động sau lưng ta.\n\nTin đồn về cống phẩm bị đánh cắp, những cuộc chiến không được phép, và nhiều hành động khác khiến quyền uy của ta bị đặt dấu hỏi trước triều thần. Ta không hề nghi ngờ sự chính trực của [fp2_2050_el_cid.GetFirstName], nhưng liệu ta có thể giữ một người luôn thu hút những lời đồn tai tiếng như vậy trong triều không? Chúng giờ không thể bị dập tắt nữa, và nếu ta không sớm hành động, ta sẽ bị xem là yếu đuối."
	fp2_struggle.2050.desc_knights:0 "Khi bước qua các hành lang của [ROOT.GetCharacter.Custom('FortifiedBuilding')], ta nhận ra tất cả các [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] của mình đều ủ rũ. Sự hiện diện của [fp2_2050_el_cid.GetFullNameNicknamed] truyền cảm hứng cho binh lính thường dân lập nên những chiến công vĩ đại, nhưng lại khiến các [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] quý tộc trở nên lu mờ trước hào quang của hắn.\n\nLà một chỉ huy tài năng và chiến binh xứng đáng với những câu chuyện truyền kỳ, không ai nghi ngờ giá trị mà [fp2_2050_el_cid.GetFirstNameNicknamed] mang lại cho hàng ngũ của ta, nhưng nếu sức mạnh của một người lại khiến những người khác suy yếu... liệu ta có thể để ảnh hưởng như vậy tồn tại giữa các [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] của mình?"
	fp2_struggle.2050.desc_nobles:0 "Các quý tộc khắp vương quốc gần đây liên tục tìm đến ta để chia sẻ lo ngại, buôn chuyện và thậm chí công khai những lời thù địch về [ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] của ta, [fp2_2050_el_cid.GetFirstNameNicknamed]. Rõ ràng giới quý tộc không thích sự ưu ái của ta dành cho [fp2_2050_el_cid.GetFirstName] và muốn thấy kẻ [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] mới nổi này bị trục xuất trước khi bất kỳ thường dân nào cố gắng bước theo con đường của hắn. [fp2_2050_el_cid.GetFirstName] có thể từng là một quý tộc, nhưng giờ hắn là một [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] tự thân lập nghiệp và bị xem là mối đe dọa đối với trật tự xã hội của vương quốc.\n\nQuyết định là của ta, nhưng giữ [fp2_2050_el_cid.GetFirstName] ở lại sẽ làm tổn hại vị thế của ta với giới quý tộc."
	fp2_struggle.2050.desc_faith:0 "Ở khắp nơi ta đi, ta đều thấy sự thiếu tôn trọng phản chiếu trong ánh mắt của các [ROOT.Char.Custom('DefaultPriestTitlePlural')] của mình. Những lời đồn vô căn cứ cho rằng lòng tham đất đai và vàng bạc đã khiến ta lạc khỏi [ROOT.GetCharacter.GetFaith.HighGodName] và đứng về phía những lính đánh thuê vô tín như [fp2_2050_el_cid.GetFirstNameNicknamed], kẻ chẳng bận tâm mình chiến đấu cho ai.\n\nTâm trí ngu muội của họ bị che mờ bởi những ảo tưởng lãng mạn về chiến tranh hiệp sĩ nơi chỉ những kẻ sùng đạo mới bảo vệ đức tin, trong khi sự thật là chính những người như hắn mới bảo đảm cho lối sống của chúng ta. Dù vậy, nếu ta muốn tiếp tục giữ được thiện cảm của giới giáo sĩ thì có lẽ đã đến lúc cân nhắc trục xuất [fp2_2050_el_cid.GetFirstName]."
	fp2_struggle.2050.a:0 "Ta tin tưởng [ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] của mình và hắn sẽ ở lại!"
	fp2_struggle.2050.a.serve_tooltip:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] tiếp tục phục vụ Ngài."
	fp2_struggle.2050.a.notif.t:0 "[fp2_2050_el_cid.GetNicknameNoTooltip|U] Ở Lại"
	fp2_struggle.2050.b:0 "[fp2_2050_el_cid.GetFirstNameNoTooltip] sẽ tiếp tục phục vụ ta bất kể thế nào!"
	fp2_struggle.2050.c:0 "Có lẽ đã đến lúc để hắn ra đi..."
	fp2_struggle.2050.c.notif:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] sẽ tìm nơi khác để phục vụ..."
	fp2_struggle.2051.t:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip]"
	fp2_struggle.2051.desc:0 "Một hiệp sĩ lừng danh tên [fp2_2050_el_cid.GetFullName], còn được gọi là "[fp2_2050_el_cid.GetNicknameNoTooltip|U]", đã đến triều đình của ta tìm một lãnh chúa để phục vụ. Hắn chắc chắn là một chỉ huy tài năng và một chiến binh xứng đáng với truyền thuyết.\n\n[fp2_2050_el_cid.GetFirstNameNoTooltip] không ngại làm việc với bất kỳ ai sẵn sàng chào đón hắn. Đây là cơ hội để chiêu mộ một hiệp sĩ có thể xoay chuyển cục diện trận chiến chỉ bằng sức mình."
	fp2_struggle.2051.a:0 "À chào mừng! Ngươi sẽ có một vị trí cao trong triều đình của ta."
	fp2_struggle.2051.b:0 "Một người tài như ngươi luôn được chào đón trong vương quốc của ta."
	fp2_struggle.2051.c:0 "Hãy tìm nơi khác để phục vụ, [fp2_2050_el_cid.GetFirstNameNoTooltip]."

 # fp2_2004placeholder
	fp2_struggle.2004.t:0 "Một Hạm Đội Lớn Hơn"
	fp2_struggle.2004.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2004_scoped_steward'))] của ta, [2004_scoped_steward.GetFirstName], báo rằng các biên niên sử gia của [2004_scoped_steward.GetHerHis] đã trở về sau khi đi khắp biển cả để nghiên cứu công nghệ hải quân. [2004_scoped_steward.GetSheHe|U] nói rằng nếu được cấp kinh phí, chúng ta có thể thiết kế một loại tàu mới vượt trội hơn các láng giềng  và mở ra kỷ nguyên thống trị biển cả cho [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nMặt khác, [2004_scoped_marshal.GetCouncilTitleFirstName] của ta lại muốn dùng số vàng đó cho những việc khác thay vì tàu buôn."
	fp2_struggle.2004.a:0 "Coi như dự án này được tài trợ"
	fp2_struggle.2004.a.a.desc:0 "Các thiết kế tàu mới được đưa vào sử dụng"
	fp2_struggle.2004.a.b.desc:0 "Những thợ đóng tàu tại [fp2_2004_dockyards.GetNameNoTierNoTooltip] trở thành nghệ nhân nổi tiếng"
	fp2_struggle.2004.b:0 "Số tiền đó có thể được dùng tốt hơn ở nơi khác"
	fp2_struggle.2004.b.desc:0 "Ngài bác bỏ nỗ lực của [2004_scoped_steward.GetFirstNameNoTooltip] và giữ lại số tiền"
	fp2_struggle.2004.c:0 "Ta không muốn thiết kế tàu mới, ta muốn một con tàu bằng bạc nguyên khối!"
	fp2_struggle.2004.c.desc:0 "Ngài đánh cược số tiền của mình để có cơ hội đạt được danh tiếng phi thường, tập hợp những nghệ nhân vĩ đại nhất để tạo nên điều không tưởng — một con tàu bằng bạc nguyên khối."
	fp2_struggle.2005.t:0 "Một Hạm Đội Đi Trước Thời Đại"
	fp2_struggle.2005.t.alt:0 "Những Bậc Thầy Thủ Công của [fp2_2004_dockyards.GetNameNoTier]"
	fp2_struggle.2005.desc:0 "Những con tàu mới có thiết kế như sau:"
	fp2_struggle.2005.desc.intro:0 ""Thưa bệ hạ, cuối cùng tàu của chúng ta đã sẵn sàng ra khơi!" [2005_scoped_steward.GetFirstName] nói. "Ta tin rằng thiết kế này sẽ khiến ngài hài lòng."\n\n"
	fp2_struggle.2005.desc.cirt.notif:0 "Những thiết kế mới là một thành công vang dội! Thậm chí, một xưởng đóng tàu mới đã được lập tại [fp2_2004_dockyards.GetNameNoTier] chỉ để sản xuất những con tàu hiện đại bậc nhất này.\n\n"
	fp2_struggle.2005.desc.cirt.a.notif:0 "Đáng tiếc là trong thời gian xây dựng, [fp2_2004_dockyards.GetName] đã rơi vào tay [fp2_2004_dockyards.GetHolder.GetName]. Chúng ta vẫn giữ được bản thiết kế tàu, nhưng các xưởng đóng tàu giờ đã thuộc về họ.\n\n"
	fp2_struggle.2005.desc.newdesigner.notif:0 "Nhà thiết kế ban đầu, [2004_scoped_steward.GetFirstName], không còn ở với chúng ta nữa, nhưng [2005_scoped_steward.GetFirstNameNicknamed] đã có thể tiếp quản và hoàn thành dự án mà không cần [2004_scoped_steward.GetHerHim].\n\n"
	fp2_struggle.2005.desc.bottom.generic:0 "Phần đáy của con tàu sử dụng"
	fp2_struggle.2005.desc.bottom.a:1 "$fp2_struggle.2005.desc.bottom.generic$ sống tàu đáy phẳng, cho phép di chuyển ổn định trên vùng nước êm. "
	fp2_struggle.2005.desc.bottom.b:1 "$fp2_struggle.2005.desc.bottom.generic$ vách ngăn kín nước được thiết kế để ngăn tàu chìm khi bị hư hại. "
	fp2_struggle.2005.desc.bottom.c:1 "$fp2_struggle.2005.desc.bottom.generic$ sống tàu sắc và sâu, có thể cắt qua sóng với tốc độ cực lớn! "
	fp2_struggle.2005.desc.bottom.d:1 "$fp2_struggle.2005.desc.bottom.generic$ khung sườn đóng kiểu clinker, khiến thân tàu vừa chắc chắn hơn vừa nhẹ hơn. "
	fp2_struggle.2005.desc.unique.init:0 "Sau đó, phía trên là phần độc đáo nhất của nó, với"
	fp2_struggle.2005.desc.unique.a:0 "$fp2_struggle.2005.desc.unique.init$ bộ phao kép khổng lồ, mang lại sự ổn định vô song. "
	fp2_struggle.2005.desc.unique.b:0 "$fp2_struggle.2005.desc.unique.init$ các pháo đài gỗ nâng cao ở mỗi đầu thân tàu, cho phép cung thủ trút mưa tên lên kẻ địch. "
	fp2_struggle.2005.desc.unique.c:0 "$fp2_struggle.2005.desc.unique.init$ một công trình đồ sộ như lâu đài trên boong tàu. "
	fp2_struggle.2005.desc.unique.d:0 "$fp2_struggle.2005.desc.unique.init$ mái gỗ phủ đầy gai nhọn để ngăn chặn việc bị đột kích lên tàu. "
	fp2_struggle.2005.desc.unique.e:0 "$fp2_struggle.2005.desc.unique.init$ mũi đâm ở phía trước, dùng để xuyên thủng tàu địch trong một cuộc đụng độ trực diện. "
	fp2_struggle.2005.desc.sails.init:0 "Cuối cùng, con tàu sử dụng"
	fp2_struggle.2005.desc.sails.a:0 "$fp2_struggle.2005.desc.sails.init$ những cánh buồm vuông lớn xếp chồng tận dụng tối đa gió biển."
	fp2_struggle.2005.desc.sails.b:0 "$fp2_struggle.2005.desc.sails.init$ những cánh buồm lug khổng lồ chồng lên nhau xứng đáng với những con tàu mạnh mẽ nhất."
	fp2_struggle.2005.desc.sails.c:0 "$fp2_struggle.2005.desc.sails.init$ hệ buồm trước–sau phức tạp để đạt khả năng cơ động tối đa."
	fp2_struggle.2005.desc.sails.d:0 "$fp2_struggle.2005.desc.sails.init$ nhiều hàng mái chèo lớn. Khiến con tàu kiên định như ý chí của những người điều khiển nó."
	fp2_struggle.2005.desc.outro:0 "\n\n"Thật ấn tượng, ngài không thấy vậy sao?" [2005_scoped_steward.GetFirstNameNicknamed] nói."
	fp2_struggle.2005.desc.outro.crit:0 "\n\n"Điều này chắc chắn sẽ mở ra cho chúng ta một kỷ nguyên thống trị hải quân!" [2005_scoped_steward.GetFirstNameNicknamed] tự hào tuyên bố."
	fp2_struggle.2005.a:0 "Ngươi đã làm rất tốt."
	fp2_struggle.2005.a.a:0 "Đáng tiếc về các xưởng tàu, nhưng ít nhất chúng ta vẫn có những con tàu."
	fp2_struggle.2005.desc.alt.a:1 "Bạc Chìm"
	fp2_struggle.2005.desc.alt.a.desc:0 "Biết rằng tin này sẽ khiến ta rất khó chịu, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))], [2005_scoped_steward.GetFirstName], thận trọng tiến đến để báo cáo kết quả của nỗ lực khiến bạc nổi trên mặt nước.\n\n"Dù đã cố gắng hết sức, ý tưởng đóng một con thuyền bằng kim loại là điều điên rồ. Sau khi hoàn thành, con thuyền rời cảng và lập tức chìm xuống vực sâu của đại dương. Một phần đáng kể kho bạc của chúng ta giờ nằm ngoài tầm với dưới những con sóng tàn nhẫn. Ta xin lỗi, thưa bệ hạ."\n\n"
	fp2_struggle.2005.desc.alt.b:1 "Những Con Tàu Bạc"
	fp2_struggle.2005.desc.alt.b.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))] của ta, [2005_scoped_steward.GetFirstName], biết rằng đây chỉ là một vật phô trương để tạo danh tiếng. Thuyền làm bằng kim loại sẽ không bao giờ nổi, dù công nghệ có tiến bộ đến đâu.\n\nVì vậy, thay vì nghiêm túc cố gắng làm điều không thể, [2005_scoped_steward.GetSheHe] đã phủ một lớp bạc mỏng lên một con tàu gỗ để đánh lừa người xem. Ta và "con tàu kim loại" mới của mình trở thành chủ đề bàn tán khắp nơi và là niềm ghen tị của cả thế giới!\n\n"

 # fp2_struggle_event_2006
	fp2_struggle.2006.t:0 "Ranh Giới Của Đức Tin"
	fp2_struggle.2006.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp2_2006_vassal_in_crisis'))] [fp2_2006_vassal_in_crisis.GetTitledFirstName] của ta tiếp cận ta trong riêng tư với sự nghi ngờ rõ ràng trong đôi mắt của [fp2_2006_vassal_in_crisis.GetHerHis].\n\n[fp2_2006_vassal_in_crisis.GetSheHe|U] giải thích với ta rằng đức tin của [fp2_2006_vassal_in_crisis.GetHerHis] đang lung lay do thời gian [fp2_2006_vassal_in_crisis.GetHerHis] dành để canh giữ biên giới chống lại [fp2_2006_foreign_faith.GetNameNoTooltip] và giao du với kẻ thù. Những lời của [fp2_2006_vassal_in_crisis.GetHerHis|U] không phải là đùa giỡn. Cảm giác như chỉ cần một sai lầm nhỏ nhất cũng có thể đẩy [fp2_2006_vassal_in_crisis.GetHerHim] rời xa [ROOT.Char.GetFaith.HighGodName].\n\nTuy nhiên, đây là cơ hội để củng cố sự nhiệt thành cũng như mối quan hệ của chúng ta."
	fp2_struggle.2006.a:0 ""Hãy gọi một linh mục tới!""
	fp2_struggle.2006.a.a:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] vẫn còn nghi ngờ"
	fp2_struggle.2006.a.b:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] cảm thấy bị đe dọa bởi sự hiện diện của [2006_scoped_chaplain.GetTitledFirstNameNoTooltip]"
	fp2_struggle.2006.a.c:0 "[2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] trấn an đức tin của [fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip]"
	fp2_struggle.2006.a.desc:1 "Ngài gọi [2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] tới để giải quyết tình huống. [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] sẽ cảm thấy bị phản bội vì Ngài đã kể với người khác về nỗi lo của [fp2_2006_vassal_in_crisis.GetHerHis]."
	fp2_struggle.2006.b:0 "Chính ta sẽ khơi lại lòng nhiệt thành của [fp2_2006_vassal_in_crisis.GetHersHis]."
	fp2_struggle.2006.b.a.desc:0 "[fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] khó chịu trước nỗ lực này"
	fp2_struggle.2006.b.b.desc:0 "Ngài trấn an lòng trung thành của [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip]"
	fp2_struggle.2006.c:0 ""Chọn đức tin nào cũng được, miễn là #emphasis phục vụ#! #BER ta#!.""
	fp2_struggle.2006.c.desc:0 "Ngươi cho phép [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] chọn một đức tin theo ý muốn của [fp2_2006_vassal_in_crisis.GetHersHis]."
	fp2_struggle.2006.c.notif.t:0 "Tự Do Tình Bằng Hữu"
	fp2_struggle.2006.d:0 "Đe dọa tố cáo [fp2_2006_vassal_in_crisis.GetHerHim] là dị giáo."
	fp2_struggle.2006.d.notif.t:0 "Chống Lại Nghi Ngờ Bằng Nỗi Sợ"
	fp2_struggle.2006.e:0 ""Quên chuyện đức tin đi, #emphasis hãy theo phù thủy!#! ""
	fp2_struggle.2006.e.alreadywitch:0 "[fp2_2006_vassal_in_crisis.GetFirstName] vốn đã là phù thủy! Đây không phải khủng hoảng đức tin. [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] chỉ cần một người Ngài có thể thấu hiểu [fp2_2006_vassal_in_crisis.GetHerHim]."
	fp2_struggle.2006.generic.notif.a.t:0 "Chư Hầu Theo [fp2_2006_foreign_faith.GetNameNoTooltip]"
	fp2_struggle.2006.generic.notif.b.t:0 "Chư Hầu Vẫn Trung Thành Với Đức Tin"
	fp2_struggle.2006.e.notif.t:0 "Những Pháp Sư Hòa Nhã"
	fp2_struggle.2006.e.tacticalwitchfaithchange:0 "Cải sang [fp2_2006_foreign_faith.GetName] để tránh bị bức hại"

 # fp2_flavor_events_vero
	fp2_flavor.3001.t:0 "Khi Ta Nằm Chờ Cái Chết"
	fp2_flavor.3001.desc:0 "Gió trở nên lạnh hơn và những ngày trở nên tối tăm, ngắn ngủi và tĩnh lặng hơn. Ngai vàng trông vẫn như ngày đầu ta ngồi lên nó. Ngai vàng sẽ luôn như vậy. Nhưng ta thì không.\n\nĐã đến lúc ta chuẩn bị cho điều không thể tránh khỏi, và ta sẽ cho khắc một dòng bia mộ trước khi ra đi, để có thể ra đi trong thanh thản."
	fp2_flavor.3001.a:0 "Chúng ta sẽ dùng ngôn ngữ [SCOPE.Custom('IberiaSacredLanguage')]."
	fp2_flavor.3001.b:0 "Đó không phải ngôn ngữ mọi người nói. Ta sẽ dùng [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]."
	fp2_flavor.3001.c:0 "Ta sẽ không phân biệt. [SCOPE.Custom('IberiaSacredLanguage')] và [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]."
	fp2_flavor.3001.d:0 "Chúng ta đâu phải những người duy nhất sống ở đây."
	IberiaSacredLanguage_hebrew:0 "Do Thái"
	IberiaRomanceLanguage_castilian:0 "Castilian"
	IberiaRomanceLanguage_sephardi:0 "Sephardi"
	IberiaRomanceLanguage_mozarabic:0 "Mozarabic"
	fp2_epitaph_modifier:0 "Bia Mộ Đa Ngôn Ngữ"
 
	fp2_flavor.3011.t:0 "Một Động Thái Bất Ngờ"
	fp2_flavor.3011.desc:0 "Người bạn thân nhất [fp2_flavor_3011_best_friend.GetFirstName] của ta không cần phải thông báo [fp2_flavor_3011_best_friend.GetHerselfHimself] trước khi bước vào [ROOT.Char.Custom('GetChamber')] của ta. À, nụ cười vui vẻ của [fp2_flavor_3011_best_friend.GetHerHis] sẽ không bao giờ thôi làm ta thích thú. Nhưng... có điều gì đó khác biệt về [fp2_flavor_3011_best_friend.GetHerHis] hôm nay; tóc của [fp2_flavor_3011_best_friend.GetHerHis] được làm hoàn hảo và quần áo của [fp2_flavor_3011_best_friend.GetHerHis] thật lộng lẫy và thanh lịch.\n\n\"[ROOT.Char.GetFirstNameNoTooltip], người bạn thân nhất của ta! Cả một [ROOT.Char.Custom('ResidenceBuilding')]... và ngài ở đây một mình! Không có gì ta thích hơn sự bầu bạn quý giá của ngài và nếu có thể — ôi, chao ôi, nếu ta có thể! — ta sẽ dành tất cả ngày đêm cùng ngài trong [ROOT.Char.Custom('GetRoom')] này.\""
	fp2_flavor.3011.a:0 "Và ở đây chỉ có một chiếc giường."
	fp2_flavor.3011.b:0 "Ta sẽ tìm cho Ngài một chỗ ở xứng đáng!"
	fp2_flavor.3011.c_spouse:0 "Ta đã có phối ngẫu!"
	fp2_flavor.3011.c:0 "Ta cô đơn theo cách ta muốn."
 
	fp2_flavor.3021.t:0 "Một Buổi Tối Tẻ Nhạt"
	fp2_flavor.3021.desc:0 "Khi người Bạn Thân của ta [fp2_flavor_3021_best_friend.GetFirstName] mời ta tối nay, ta không ngờ rằng ta lại muốn ăn da ướt trong hang còn hơn.\n\nTa quay đầu đi khi một vị khách khoe vết thương nhiễm mủ của mình: "Vết này ta bị khi đang đi vệ sinh!"\n\n"Một buổi tối thật tuyệt phải không?," [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] tiến lại gần ta, tay cầm cốc, nụ cười ửng đỏ của [fp2_flavor_3021_best_friend.GetHerHis] không hề bị ảnh hưởng bởi bầu không khí tệ hại, cuộc trò chuyện tệ hại và đồ ăn tệ hại."
	fp2_flavor.3021.a:0 "Tuyệt nhất có thể!"
	fp2_flavor.3021.b:0 "Ừ-ừm, [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip]... ta— nghe này, buổi tối n-này—"
	fp2_flavor.3021.c:0 "[fp2_flavor_3021_best_friend.GetSheHe|U] nên biết sự thật."
	fp2_flavor.3021.d:0 "Than ôi, đã đến lúc rời đi."
	fp2_flavor.3021.b.success_tt:0 "[fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] sẽ hiểu những lo lắng của Ngài"
	fp2_flavor.3021.b.success:0 "Một Cuộc Trò Chuyện Thành Công"
	fp2_flavor.3021.b.fail:0 "Một Cuộc Trò Chuyện Đáng Xấu Hổ"

 # fp2_james_events
	fp2_james.0001.t:0 "Cộng Đồng [fp2_james_0001_jewish_trader.GetFaith.GetAdherentNameNoTooltip] Thịnh Vượng tại [fp2_james_0001_thriving_community.GetNameNoTierNoTooltip]"
	fp2_james.0001.desc:0 "Sự mở rộng của các cảng thương mại tại [fp2_james_0001_thriving_community.GetNameNoTier] đã biến nơi đây thành một trung tâm thịnh vượng cho người Do Thái trên khắp Iberia!\n\nMột thành viên của một gia tộc thương nhân lớn thuộc văn hóa [fp2_james_0001_jewish_trader.GetCulture.GetName] đã đưa ngày càng nhiều người của [fp2_james_0001_jewish_trader.GetHerHis] đến đây.\n\nChẳng bao lâu nữa nơi này sẽ trở thành trái tim của mạng lưới thương mại Do Thái rộng lớn khắp Iberia."
	fp2_james.0001.a:0 "Nếu họ không theo [ROOT.Char.GetFaith.GetReligion.GetAdjective], họ không được chào đón!"
	fp2_james.0001.b:0 "Có lẽ [fp2_james_0001_jewish_trader.GetSheHe] nên trở thành lãnh chúa của [fp2_james_0001_thriving_community.GetNameNoTooltip]!"
	fp2_james.0001.c:0 "Thật là một sự phát triển tuyệt vời!"
	fp2_thriving_jewish_community_modifier:0 "Cộng Đồng Do Thái Thịnh Vượng"
	fp2_thriving_jewish_community_modifier_desc:0 "Quận này đang trải qua sự bùng nổ kinh tế khi các gia đình Do Thái giàu có thiết lập mạng lưới thương mại trong khu vực."
	fp2_jewish_community_denied_modifier:0 "Người Địa Phương Bị Bức Hại"
	fp2_jewish_community_denied_modifier_desc:0 "Sự phát triển xã hội và kinh tế của khu vực này đã bị phá hoại bởi các đạo luật phân biệt đối xử với các nhóm tôn giáo thiểu số."
	fp2_conversos_persecution_modifier:0 "Conversos Bị Bức Hại"
	fp2_conversos_persecution_modifier_desc:0 "Dù đã cải sang Kitô giáo, những người Do Thái trước đây và hậu duệ của họ vẫn tiếp tục bị bức hại."
	fp2_james.0002.t:0 "Cải Đạo Giả"
	fp2_james.0002.desc:0 "Một số người được gọi là [fp2_james_0002_conversos_character.GetFaith.GetAdherentName] đã được các [fp2_james_0002_jewish_faith.PriestNeuterPlural] trước đây của họ bảo phải tuyên bố cải sang đức tin chân chính. Nhưng họ vẫn tiếp tục thực hành [fp2_james_0002_jewish_faith.GetName] trong bí mật!\n\nNếu điều này là thật, nó sẽ phá hoại mọi nỗ lực cải đạo các cộng đồng Do Thái tại Iberia sang Kitô giáo.\n\nMột trong những thủ lĩnh của họ, [fp2_james_0002_conversos_character.GetName], bị nghi ngờ đang truyền bá giáo lý Do Thái."
	fp2_james.0002.a:0 "Ta không quan tâm, thế nào cũng được."
	fp2_james.0002.a.tt:0 "Cho phép [fp2_james_0002_conversos_character.GetNameNoTooltip] làm điều [fp2_james_0002_conversos_character.GetSheHe] muốn"
	fp2_james.0002.b:0 "Ta nên thẩm vấn kẻ dị giáo này."
	fp2_james.0002.c:0 "Dù thật hay không, [fp2_james_0002_conversos_character.GetSheHe] sẽ mục nát trong ngục tối của ta!"
	fp2_james.0003.t:0 "Người Tị Nạn [fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNameNoTooltip]"
	fp2_james.0003.desc:0 "[fp2_james_003_jewish_refugee_leader.GetName] đã chạy trốn khỏi [fp2_james_003_intolerant_ruler.GetPrimaryTitle.GetNameNoTier] cùng với một nhóm lớn đồng đạo [fp2_james_003_jewish_refugee_leader.GetHerHis] là [fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNamePluralNoTooltip].\n\n[fp2_james_003_jewish_refugee_leader.GetSheHe|U] đến gặp ta cầu xin một mái nhà cho dân của [fp2_james_003_jewish_refugee_leader.GetHerHis] và sẵn sàng tuyên thệ trung thành với vương miện [fp2_james_003_jewish_refugee_leader.GetPrimaryTitle.GetAdjective] để đổi lấy sự bảo vệ khỏi bức hại."
	fp2_james.0003.a:0 "[fp2_james_0003_province_to_convert.GetNameNoTooltip] có thể hưởng lợi từ vài người định cư."
	fp2_james.0003.b:0 "[fp2_james_003_jewish_refugee_leader.GetSheHe|U] sẽ phải tìm nơi khác."
	fp2_james.0002.b.succesful_interrogation:0 "Cuộc thẩm vấn thành công"
	fp2_james.0002.b.failed_interrogation:0 "Cuộc thẩm vấn là một thảm họa"
	fp2_james_0002.b.failed_interrogation.tt:0 "Mọi quận Kitô giáo và Do Thái trong lãnh thổ của Ngài"
	fp2_james.0002.a.offended_conversos:0 "Conversos bị xúc phạm"
	fp2_james.0002.a.jewish_communities_thrive:0 "Các cộng đồng Do Thái phát triển mạnh!"
	fp2_james.0002.a.nothing_happened_toast:0 "Conversos là những Kitô hữu chân chính"
	cultural_acceptance_gain_conversos_tolerance:0 "Khoan dung với Conversos"
	cultural_acceptance_loss_conversos_tolerance:0 "Không khoan dung với Conversos"
	fp2_james.0004.t:0 "Những Đêm [fp2_james_0004_place_of_murder.GetAdjectiveNoTooltip]"
	fp2_james.0004.desc:0 "[fp2_james_0004_place_of_murder.GetName] là một nơi hỗn loạn với nhiều niềm tin và hệ thống cai trị khác nhau. Mỗi cộng đồng đều có lãnh đạo riêng, tạo nên một mạng lưới thứ bậc và quyền lực phức tạp không thể tiếp tục như vậy. Nếu tất cả họ cầu nguyện với [ROOT.Char.GetFaith.HighGodName] theo cách đúng đắn và phục tùng cùng một lãnh đạo, điều đó sẽ làm tăng ảnh hưởng của ta.\n\n[fp2_james_0004_murder_baron.GetName] đã bước lên, muốn trở thành lãnh đạo mới của [fp2_james_0004_place_of_murder.GetTierAsNamePossessiveNoTooltip|U] và sẽ tổ chức một bữa tiệc nơi [fp2_james_0004_murder_baron.GetSheHe] sẽ tàn sát tất cả các lãnh đạo tôn giáo địa phương như giết gia súc."
	fp2_james.0004.a:0 "Ta nóng lòng nghe tiếng họ gào thét."
	fp2_james.0004.b:0 "Ta không phải là một con quái vật #EMP hoàn toàn#!."
	fp2_james.0005.t:0 "Quan Điểm"
	fp2_james.0005.desc.intro:0 "[fp2_james_angry_priest.GetName] hôm nay đã đến gặp ta yêu cầu rằng [ROOT.Char.GetFaith.HouseOfWorship] vừa được cải đạo gần đây đang quay sai hướng!"
	fp2_james.0005.desc.christian:0 "\n\nKhi còn là một nhà thờ Hồi giáo, chỉ có Mihrab quay về hướng đông về phía Mecca, nhưng giờ khi đã trở thành một nhà thờ đúng nghĩa, toàn bộ công trình được kỳ vọng phải quay về hướng đông."
	fp2_james.0005.desc.muslim:0 "\n\nVì trước đây là một nhà thờ, nhà thờ Hồi giáo này quay về hướng đông, khiến việc xây dựng Mihrab để hướng tín đồ về thánh địa trở nên không thể!"
	fp2_james.005.desc.outro:0 "\n\n[fp2_james_angry_priest.GetNameNoTooltip] cho rằng gần như không thể thực hiện nghi lễ đúng cách trong tình trạng này và yêu cầu chúng ta cấp kinh phí để xoay toàn bộ tòa nhà sang hướng đúng."
	fp2_james.0005.a:0 "Bất cứ điều gì vì đức tin!"
	fp2_james.0005.b:0 "Ngươi đang lãng phí thời gian của ta."
	fp2_toledo_nights_modifier:0 "Lãnh Đạo Địa Phương Bị Tàn Sát"
	fp2_toledo_nights_modifier_desc:1 "Các lãnh đạo tôn giáo địa phương của quận này gần đây đã bị tàn sát."
	fp2_toledo_nights_fallout_modifier:0 "Giáo Sĩ Bị Tàn Sát"
	fp2_toledo_nights_fallout_modifier_desc:0 "Các lãnh đạo tôn giáo gần đây đã bị tàn sát tại một thị trấn gần đó, gây ra hậu quả khắp lãnh thổ."
	fp2_correctly_facing_church:0 "Đền Thờ Được Định Hướng Đúng"
	fp2_correctly_facing_church_desc:1 "Nơi thờ phụng tại quận này đã được xoay lại từng viên gạch để đảm bảo việc thờ phụng đúng cách."

 # fp2_nick_events (all three files)
	fp2_yearly.4001.t:0 "Giờ Thứ Sáu"
	fp2_yearly.4001.desc:0 "Ôi trời! Làm một [ROOT.Char.GetTitleAsNameNoTooltip] thật sự rất hao tổn sức lực. Ta phải lao lực suốt cả ngày và phần lớn cả đêm chỉ để theo kịp mọi việc. Lũ nông dân thì sống thật may mắn ở khía cạnh đó; chúng không phải chịu những áp lực như vậy đè nặng lên mình, khiến chúng mệt mỏi và uể oải!\n\nCó lẽ một giấc ngủ ngắn sẽ tốt cho ta? Ta có thể ngủ bù sau bữa trưa và sẵn sàng giải quyết phần còn lại của ngày!"
	fp2_yearly.4001.a:0 "Không! Ta còn việc phải làm!"
	fp2_yearly.4001.b:0 "Mm, #EMP tuyệt vời.#!"

	fp2_yearly.4002.t:0 "Sống Hòa Hợp"
	fp2_yearly.4002.desc:0 "Cái cau mày không hài lòng trên gương mặt của [realm_priest.GetCouncilTitle] [realm_priest.GetTitledFirstNamePossessive] khiến ta lập tức chuẩn bị tinh thần cho thứ chắc chắn sẽ là một mớ phiền toái nhân danh [ROOT.Char.GetFaith.HighGodName].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]," [realm_priest.GetSheHe] bắt đầu, "có một vấn đề vô cùng nghiêm trọng đang xảy ra ngay trong lãnh địa của ngài. Quận [interfaith_province.GetCounty.GetName] đầy những kẻ không theo đức tin chân chính! Nếu vậy còn chưa đủ tệ, chúng còn sống cạnh những người theo đức tin! Và, và, và #EMP gian dâm#! với nhau và-"\n\nTa nhắm mắt lại khi giọng lải nhải bất tận tiếp tục. Ta không dám nghĩ [realm_priest.GetSheHe] sẽ còn tiếp tục thế nào nếu ta không làm gì đó..."
	fp2_yearly.4002.a:0 "Hãy để họ sống yên bình, [realm_priest.GetFirstNameNoTooltip]."
	fp2_yearly.4002.b:0 "Ngươi nói đúng. Điều này không thể tiếp tục."

	fp2_yearly.4003.t:0 "Con Đường đến Santiago"
	fp2_yearly.4003.desc:0 "Thành phố linh thiêng Santiago de Compostela là thỏi nam châm đối với các tín đồ, thu hút người hành hương từ gần lẫn xa. Con đường dẫn đến đó vì vậy luôn tấp nập, uốn lượn từ chân dãy Pyrenees đến địa điểm linh thiêng này. Dĩ nhiên, nơi nào có những người đủ giàu để hành hương đến thánh địa, nơi đó cũng có những kẻ tìm cách kiếm lợi từ niềm tin của họ vào đấng tối cao.\n\nBản báo cáo thứ năm về một vụ cướp bạo lực của bọn cướp trong vòng năm ngày trên các đoạn đường chạy qua lãnh thổ của ta cuối cùng đã khiến [steward.GetCouncilTitle] [steward.GetFirstName] phải đến hỏi ý kiến ta về cách giải quyết vấn đề này."
	fp2_yearly.4003.a:0 "Ta sẽ liên lạc với các chiến binh thánh tại [ho_province.GetProvince.GetCounty.GetNameNoTooltip]!"
	fp2_yearly.4003.b:0 "Trả tiền cho lính canh tuần tra một đoạn đường."
	fp2_yearly.4003.c:0 "[ROOT.Char.GetFaith.HighGodName] giúp những ai biết tự giúp mình..."
	fp2_yearly.4003.tt:0 "[holy_order|E] địa phương sẽ tuần tra con đường trong quận của họ."
	fp2_yearly.4004.t:0 "Bậc Thầy Lang Thang"
	fp2_yearly.4004.desc:0 "Ta đang đi qua phòng triều khi một cuộc xô xát ở phía xa thu hút sự chú ý của ta. Một [mozarab_wanderer.GetWomanMan] lực lưỡng đang bị lính gác của ta tiến đến, nhưng vũ khí của họ lập tức rơi loảng xoảng xuống sàn chỉ trong chớp mắt. Kẻ lạ mặt vung thanh kiếm [mozarab_wanderer.GetHerHis] chào ta.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]", [mozarab_wanderer.GetSheHe] bắt đầu khi ta ra hiệu cho lính gác lùi lại, "ta hiện không có lãnh chúa nào để phục vụ, và nhìn vào sự bảo vệ của ngài ở đây có vẻ ngài sẽ cần sự giúp đỡ của ta."\n\nTừ cây thánh giá [mozarab_wanderer.GetSheHe] đeo quanh cổ [mozarab_wanderer.GetHerHis], ta suy ra [mozarab_wanderer.GetSheHe] là một [mozarab_wanderer.GetFaith.GetAdherentName]."
	fp2_yearly.4004.a:0 "Đối với một [mozarab_wanderer.GetWomanMan] tài năng như ngài? Chắc chắn rồi!"
	fp2_yearly.4004.b:0 "Ta muốn các $knight_culture_player_no_tooltip_lowercase$s của ta là [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]."
	fp2_yearly.4004.c:0 "Cút đi, kẻ ngoại đạo!"
	fp2_yearly.4004.tt:0 "[mozarab_wanderer.GetName] từ chối cải đạo và tiếp tục lang thang"
	fp2_yearly.4004.b.succ:0 "[mozarab_wanderer.GetName] gia nhập triều đình của Ngài"
	fp2_yearly.4004.b.fail:0 "[mozarab_wanderer.GetName] từ chối cải đạo và tiếp tục lang thang"
	fp2_yearly.4004.c.tt:0 "[mozarab_wanderer.GetName] tiếp tục lang thang"

	fp2_yearly.4005.t:0 "Thiết Lập Khu Cộng Đồng"
	fp2_yearly.4005.desc.christian:0 "Người [mozarab_merchant.GetFaith.GetAdherentNamePlural] giữ một vị trí đặc biệt trong xã hội Iberia. "
	fp2_yearly.4005.desc.muslim:0 "Các thần dân [mozarab_merchant.GetFaith.GetReligion.GetAdjectiveNoTooltip|U] giữ một vị trí đặc biệt trong xã hội Iberia. "
	fp2_yearly.4005.desc:0 "Vì vậy việc một thương nhân địa phương của họ xin diện kiến ta là điều khá bất thường.\n\n"Chúng Ta, những người [mozarab_merchant.GetFaith.GetAdherentNamePlural], thường phải đối mặt với một mức độ... khó khăn nhất định khi sống cuộc sống của mình." [mozarab_merchant.GetSheHe|U] nói một cách bình thản, không hề oán giận, nhưng rõ ràng có sự cứng rắn trong lời nói của [mozarab_merchant.GetHerHis].\n\n"Tất cả những gì chúng Ta muốn là một khu nhỏ trong các thành phố của [mozarab_quarter.GetName] để gọi là của riêng mình và sống cùng dân tộc của mình. Ta đến đây để thỉnh cầu ngài, [ROOT.Char.Custom('FormOfAddressForLiege')], xem liệu ngài có thể rộng lượng ban cho chúng Ta điều đó không.""
	fp2_yearly.4005.a:0 "Các ngươi được chào đón trong thành phố của ta."
	fp2_yearly.4005.b:0 "Ta sẽ không để các ngươi làm ô uế thị trấn của ta!"

	fp2_yearly.4006.t:0 "Kiến Trúc Sư của [ROOT.Char.GetFaith.HighGodNamePossessive]"
	fp2_yearly.4006.desc:0 "Phải là người rất gan dạ mới dám chặn ta khi ta rời [ROOT.Char.GetFaith.HouseOfWorship] sau buổi cầu nguyện hằng ngày, nhưng một [mozarab_priest.GetWomanMan] đã làm đúng như vậy. Ta chú ý cây thánh giá treo quanh cổ [mozarab_priest.GetHerHis] với chút nghi ngờ khi [mozarab_priest.GetSheHe] bắt đầu nói.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta chỉ xin một phút thời gian của ngài. Tất cả những gì Ta muốn là đàn chiên của mình có thể thờ phụng trong một [mozarab_priest.GetFaith.HouseOfWorship] như mọi tín đồ ngoan đạo của [mozarab_priest.GetFaith.HighGodName] nên làm!" Vị linh mục lo lắng dừng lại và nhìn ta khẩn cầu.\n\nCho phép người [mozarab_priest.GetFaith.GetAdherentNamePlural] xây nơi thờ phụng sẽ khiến việc cải đạo họ khó khăn hơn, nhưng có lẽ một chút khoan dung sẽ giúp tăng sự gắn kết trong lãnh địa của ta?"
	fp2_yearly.4006.a:0 "Ngươi có sự chấp thuận của ta. Hãy xây [mozarab_priest.GetFaith.HouseOfWorshipPlural] của các ngươi."
	fp2_yearly.4006.b:0 "Ngươi sẽ #EMP không bao giờ #!xây những túp lều ngoại đạo đó trên đất của ta!"
	fp2_yearly.4007.t:0 "Nhìn Và Ngươi Sẽ Tìm Thấy Vỏ Sò"
	fp2_yearly.4007.desc:0 "Ta đang trên đường trở về sau khi cầu nguyện, [realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] đi bên cạnh, thì ta thấy một tia trắng lóe lên dưới đất. Cúi xuống nhặt lên, ta đào được một vật tròn, cứng, trắng như xương: một vỏ sò điệp.\n\nNhững chiếc vỏ như vậy là dấu hiệu của các người hành hương đi trên con đường này hướng về Santiago, và bất cứ ai sở hữu một chiếc — đặc biệt là chiếc có dấu Santiago in trên đó — đều đã hoàn thành hành trình gian khổ.\n\nTa xoay chiếc vỏ trong tay với vẻ tham lam, cảm nhận ánh nhìn không tán thành của [realm_priest.GetFirstNameNoTooltip] như đang xuyên vào sau gáy ta."
	fp2_yearly.4007.a:0 "Ta sẽ giữ cái này, và ngươi sẽ giữ mồm."
	fp2_yearly.4007.b:0 "Được rồi. #EMP Được rồi!#! Ta sẽ bỏ lại cái vỏ chết tiệt này."
	fp2_yearly.4007.c:0 "...ngươi nghĩ họ sẽ tin ai, [realm_priest.GetFirstNameNoTooltip]?"
	fp2_yearly.4007.c.tt.flavour:0 "Nếu ta giữ chiếc vỏ này, ai dám nói nó #EMP không phải#! là thật?"
	fp2_yearly.4007.c.tt.success:0 "Ngài giữ chiếc vỏ trông rất thuyết phục"
	fp2_yearly.4007.c.tt.fail:0 "[realm_priest.GetFirstNameNoTooltip] dễ dàng kết luận chiếc vỏ là đồ giả"

	fp2_yearly.4008.t:0 "Những Câu Chuyện Bên Bếp Lửa"
	fp2_yearly.4008.desc.intro:0 "Ngọn lửa lách tách cháy, hắt những cái bóng dài lên bức tường của khu ở của gia nhân. Một bà lão nhăn nheo đang khiến lũ trẻ say mê với những câu chuyện của bà.\n\n"
	fp2_yearly.4008.desc.basque.a:0 ""...Aatxe là một linh hồn hang động, thường xuất hiện dưới hình dạng hung dữ của một con bò đỏ, bảo vệ con người khỏi những ảnh hưởng xấu xa và tấn công những kẻ trộm.""
	fp2_yearly.4008.desc.basque.b:0 ""...Gaueko là linh hồn của màn đêm. Nó không cho phép con người làm việc ngoài trời sau khi hoàng hôn buông xuống, và bất kỳ sự khoe khoang gan dạ ban đêm nào — như khoe rằng không sợ bóng tối — sẽ khiến nó nổi giận.""
	fp2_yearly.4008.desc.galician.a:0 ""...Ojáncanu là những gã khổng lồ lông lá khát máu với số răng gấp đôi một [ROOT.Char.GetWomanMan]. Điểm yếu chí mạng của chúng là một sợi lông trắng duy nhất mà — nếu bị nhổ — sẽ giết chết chúng ngay lập tức.""
	fp2_yearly.4008.desc.galician.b:0 ""...Estadea là những linh hồn lang thang của người chết ám các ngôi làng vào lúc nửa đêm. Lảo đảo bước đi, chúng đi theo một linh hồn sống bị mê hoặc, kẻ bị buộc phải dẫn đầu đoàn diễu hành ma quái đó cho đến khi trời sáng. Nếu người đó không kịp truyền đoàn diễu hành ma quái của mình cho một kẻ xấu số khác, họ sẽ héo mòn và chết trong vài tuần.""
	fp2_yearly.4008.desc.castilian.a:0 ""...Những Con Ngựa của Quỷ xuất hiện khi con người đốt lửa trại để thanh tẩy linh hồn. Với bờm đen như đêm, cánh chuồn chuồn và miệng sùi bọt, chúng bùng lên từ tro tàn trong một vụ nổ. Mỗi con là linh hồn của một kẻ tội lỗi với câu chuyện riêng để kể.""
	fp2_yearly.4008.desc.castilian.b:0 ""...Ventolines là những linh hồn gió giúp đỡ thủy thủ. Mang dáng vẻ thiên thần, với đôi mắt màu bọt biển và đôi cánh như những con sóng vỡ, chúng sống trong những đám mây đỏ thẫm lúc hoàng hôn. Nếu một thủy thủ tốt bị mắc kẹt trong vùng lặng gió, Ventolines sẽ thổi gió vào cánh buồm để đưa họ trở về bờ.""
	fp2_yearly.4008.desc.catalan.a:0 ""...Cocollona là một con quái vật sông. Ban đầu nó là một nữ tu vô tín bị trừng phạt vì tội lỗi và bị giam cầm. Những người canh giữ chỉ cho phép cô ra ngoài để đến sông Onyar. Cuối cùng cô mọc vảy, và giờ đây rình rập dưới những cây cầu chờ con mồi bất cẩn.""
	fp2_yearly.4008.desc.catalan.b:0 ""...Dip nổi tiếng là chó săn địa ngục và sứ giả của Quỷ. Một Xóa Bạn người hút máu, sinh vật giống sói này lang thang trên các cánh đồng ban đêm tàn sát bò và những con người xấu số. Bị què một chân, đôi mắt đỏ rực của nó là thứ cuối cùng nhiều kẻ say rượu lảo đảo về nhà nhìn thấy.""
	fp2_yearly.4008.desc.aragonese.a:0 ""...Omes Hail là những gã khổng lồ gắn liền với chính những ngọn núi. Khi những linh hồn này lộ diện, chúng biến thành những khối núi khổng lồ bảo vệ chúng ta khỏi kẻ thù. Tức giận vì số phận của mình, chúng gào thét và làm đá tảng lăn xuống sườn đồi vào các ngôi làng bên dưới.""
	fp2_yearly.4008.desc.aragonese.b:0 ""...Basajaun hiền hòa và nhân hậu là một người khổng lồ với bộ râu dài chạm đến chân. To gấp đôi người thường, ông tuần tra rừng rậm với một thân cây làm gậy chống, cảnh báo những người chăn cừu về cơn bão đang đến hoặc thậm chí là bầy sói bằng một tiếng huýt sáo khàn khàn.""
	fp2_yearly.4008.desc.spain.a:0 ""...Cuélebre là một con rắn khổng lồ không thể tưởng tượng nổi. Dù gần như bất tử, con rắn này lười biếng và hiếm khi rời khỏi nơi trú ẩn sâu trong hang. Kho báu của nó được nói là gần như không thể tưởng tượng, và nước bọt của nó có thể chữa bệnh.""
	fp2_yearly.4008.desc.spain.b:0 ""...Mouros là những sinh vật cổ xưa đầy quyền năng đã sống ở đây từ thuở đầu thế giới. Là những thợ rèn kim loại vĩ đại, Mouros hiếm khi được thấy trên mặt đất. Những thiếu nữ của họ là những kẻ biến hình mê hoặc với vẻ đẹp tuyệt trần, canh giữ các lối đi dưới lòng đất.""
	fp2_yearly.4008.desc.spain.c:0 ""...Anjana là những nàng tiên tốt bụng chăm sóc rừng. Với đồng tử đen và đôi cánh mỏng như tơ, họ giúp đỡ động vật bị thương và người lạc đường. Họ bước nhẹ đến mức cành cây không gãy dưới chân. Nếu Ngài tìm thấy một cánh hoa hồng đầy màu sắc của họ, Ngài có thể hạnh phúc cho đến lúc chết.""
	fp2_yearly.4008.desc.ending:0 "\n\nNgọn lửa tàn dần khi bà lão kết thúc câu chuyện và thúc giục lũ trẻ chuẩn bị đi ngủ."
	fp2_yearly.4008.a:0 "Một câu chuyện cổ thật thú vị!"
	fp2_yearly.4008.b:0 "Ha! Toàn chuyện ma nhảm nhí!"
	fp2_yearly.4008.c:0 "Bà kể chuyện hay lắm, bà lão!"

	fp2_yearly.4009.t:0 "Chúa Tể Trắng"
	fp2_yearly.4009.desc:0 "Hôm nay là một ngày đặc biệt. Ta rẽ qua góc đường và nhìn thấy mục tiêu của mình: Cây Malato từ truyền thuyết về Jaun Zuria. Câu chuyện về chàng chiến binh trẻ đã đẩy lùi cả một đội quân đã in sâu trong tâm trí mọi đứa trẻ [root_culture.GetName].\n\nTa đặt tay lên thân cây sần sùi, các ngón tay dừng lại ở một khe hở rộng bằng ngón tay. Theo truyền thuyết, một thanh kiếm đã được cắm ở đây bởi những người theo Chúa Tể Trắng để chứng minh quyết tâm đi theo ông đến bất cứ đâu."
	fp2_yearly.4009.a:0 "Ta cũng sẽ đánh bại kẻ thù của dân tộc mình!"
	fp2_yearly.4009.b:0 "Ta còn hơn cả một người [root_culture.GetNameNoTooltip]."
	fp2_yearly.4009.c:0 "Một chút kỷ niệm của ngày hôm nay cũng hay."

	fp2_yearly.4010.t:0 "Những Con Lợn Đá"
	fp2_yearly.4010.desc:0 "Đáng lẽ đây chỉ là một chuyến đi đơn giản đến thăm [verraco_county.GetName], nhưng ta đã bắt gặp một thứ hiếm và kỳ lạ.\n\nNhững con thú đá khổng lồ hình con lợn rừng đứng trước mặt ta giữa vùng đồng quê rộng lớn. Qua dấu vết phong hóa, ta đoán chúng thật sự rất cổ xưa. Nếu đúng là cổ như vậy, thì điều gì đã khiến những người này bỏ công sức tạo ra những con lợn đá khổng lồ như thế?"
	fp2_yearly.4010.a:0 "Có lẽ đây là những ngôi mộ... dành cho các vị thánh?"
	fp2_yearly.4010.a.success:0 "Mọi người tin vào giả thuyết của Ngài"
	fp2_yearly.4010.a.fail:0 "Mọi người chỉ ra rằng điều này không có cơ sở thực tế"
	fp2_yearly.4010.b:0 "Chúng chẳng có ích gì. Tháo dỡ chúng."
	fp2_yearly.4010.c:0 "Đây là những bức tượng báng bổ! Phá hủy chúng!"
	fp2_yearly.4010.d:0 "Toàn nói về lợn khiến ta chán phát ngán."
