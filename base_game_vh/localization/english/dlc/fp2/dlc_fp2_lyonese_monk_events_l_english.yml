l_english:
 ##################################################
 # #Misc

  fp2_lyonese_monk.0000.t.revealed:0 "Những Giáo Lý Kỳ Lạ:"
  fp2_lyonese_monk.0000.t.council:0 "Công Đồng:"
  fp2_lyonese_monk_cancel_chain_effect.tt:0 "Trong lúc cố gắng bắt giữ, [acolyte.GetFirstName] bị giết"
  fp2_lyonese_monk.0000.tt.continues_to_teach:0 "[acolyte.GetFirstName] tiếp tục giảng dạy"
  fp2_lyonese_monk.0000.tt.teachings_fade:0 "Những giáo lý của [acolyte.GetFirstNamePossessive] sẽ dần phai nhạt"
  fp2_lyonese_monk.0000.tt.is_humbled:0 "#EMP [acolyte.GetFirstName] trở nên khiêm nhường#!"
  fp2_lyonese_monk.0000.tt.is_paused:0 "#EMP [acolyte.GetFirstName] tạm dừng để suy ngẫm#!"
  fp2_lyonese_monk.0000.tt.is_emboldened:0 "#EMP [acolyte.GetFirstName] trở nên táo bạo hơn#!"
  fp2_lyonese_monk.0000.tt.favour_elipandics:0 "[GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] thắng cuộc tranh luận"
  fp2_lyonese_monk.0000.tt.favour_felicians:0 "[GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] thắng cuộc tranh luận"
  fp2_lyonese_monk.0000.tt.favour_radicals:0 "[GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] thắng cuộc tranh luận"

 ##################################################
 # #Setup & Misc
 
  fp2_lyonese_monk.0001.t:0 "Một Đêm Bão Táp"
  fp2_lyonese_monk.0001.desc:0 "Gió đập dữ dội vào những bức tường đá của [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTier], gào rú suốt đêm như bầy chó săn của [acolyte_host.GetFaith.NegativeAfterLife], cố điên cuồng xé toạc nơi trú ẩn của ta.\n\nChiếc giường ấm áp của ta đang chờ đợi, xa khỏi những hành lang lộng gió này, nhưng... đó có phải là cánh cửa đại sảnh? Ta quay phắt lại trước tiếng động bất ngờ, và thấy một [acolyte.GetWomanMan] tu sĩ ướt sũng, rách rưới, loạng choạng bước vào nơi khô ráo.\n\n\"Thưa—\" [acolyte.GetSheHe] ho sặc sụa, khạc ra một cục đờm ướt, \"thưa [acolyte_host.GetLadyLord], xin hãy thương xót! Cơn bão thật dữ dội và Ta đã đi đường nhiều tháng. Xin hãy cho Ta một chiếc giường đến khi bình minh và bão tan.\""
  fp2_lyonese_monk.0001.a:0 "Dĩ nhiên, cứ ở bao lâu tùy thích!"
  fp2_lyonese_monk.0001.b:0 "Ngươi có thể ở lại #EMP một#! đêm."
  fp2_lyonese_monk.0001.c:0 "Không có ăn mày ở [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. #EMP Cút đi#!."
 
  fp2_lyonese_monk.0011.t:0 "Một Người  Bạn của[acolyte_host.Custom2('RelationToMeShort', dead_owner)|U]"
  fp2_lyonese_monk.0011.desc:0 "\"Thưa [acolyte_host.GetLadyLord] của tôi, ngài có thể cho ta một phút không?\" vị giáo sĩ trước mặt hỏi. \"Tên ta là [acolyte.GetFullNameNoTooltip], và ta là một tôi tớ khiêm nhường của [acolyte_host.Custom2('RelationToMeShort', dead_owner)] của ngài.\"\n\n\"Ta biết ngài hẳn vẫn còn đau buồn, nhưng người tiền nhiệm của ngài và ta đã có một sự hiểu biết, và ta phải hỏi — liệu ngài có cho phép ta ở lại triều đình và tiếp tục dạy các cận thần của ngài về cách thức của [acolyte.GetFaith.HighGodName] không?\"."
  fp2_lyonese_monk.0011.a:0 "Ừm, ta nghĩ... cũng được..."
  fp2_lyonese_monk.0011.b:0 "Thu dọn đồ đạc đi, kẻ lang thang."
 
  fp2_lyonese_monk.0021.t:0 "Mọi Thứ Đã Kết Thúc"
  fp2_lyonese_monk.0021.desc.intro:0 "Không có [acolyte.GetFullNameNoTooltip] đi lang thang khắp vương quốc của ta, sự phổ biến của những giáo lý của [acolyte.GetHerHis] bắt đầu sụt giảm. Không có nhà truyền giáo, không có người nghe đạo.\n\n"
  fp2_lyonese_monk.0021.desc.dead:0 "Hậu quả sau cái chết của [acolyte.GetHerHis] diễn ra khá lặng lẽ, điều mà ta nghi ngờ rằng nhiều người sẽ còn nhớ sau một thập kỷ hay một thế kỷ."
  fp2_lyonese_monk.0021.desc.imprisoned:0 "Dù [acolyte.GetSheHe] chỉ bị giam cầm trong ngục, ký ức của đa số người rất ngắn ngủi, và có một cảm giác kết thúc nặng nề đối với bản án của [acolyte.GetHerHis]."
  fp2_lyonese_monk.0021.desc.gone:0 "[acolyte.GetSheHe] #EMP đã đi đâu#! vẫn là một câu hỏi chưa có lời đáp, nhưng ta nghi rằng phần lớn mọi người cũng chẳng mấy quan tâm."
  fp2_lyonese_monk.0021.a:0 "[acolyte.GetSheHe|U] chắc cũng không quan trọng đến thế..."
  fp2_lyonese_monk.0021.b:0 "[acolyte.GetSheHe|U] rõ ràng gây rắc rối nhiều hơn giá trị của [acolyte.GetSheHe]..."
  fp2_lyonese_monk.0021.c:0 "Tất cả chỉ để rồi vô ích sao?"
 
  fp2_lyonese_monk.0031.t:0 "Đức Tin Tan Vỡ"
  fp2_lyonese_monk.0031.desc.acolyte_host:0 "Việc đón nhận ánh sáng của [acolyte_host.GetFaith.GetName] không phải là điều ta làm một cách nhẹ nhàng, và nhiều người đã tỏ ra bất bình với hành động sùng đạo của ta.\n\n[acolyte.GetFirstName] là người mà ta nghĩ sẽ chỉ trích ta nhiều nhất, nhưng thay vào đó [acolyte.GetSheHe] lại đơn giản là... biến mất. Hôm trước còn ở đây, hôm sau đã không thấy đâu.\n\nTa không nhớ lời từ biệt nào, chỉ nhớ một cái cau mày buồn bã."
  fp2_lyonese_monk.0031.desc.acolyte:0 "Trong tất cả những người có thể cải đạo, ta chưa bao giờ nghĩ một kẻ cuồng tín như #EMP [acolyte.GetFirstName]#! lại từ bỏ [acolyte_host.GetFaith.HighGodName]. Nhưng thời thế thật kỳ lạ, và [acolyte.GetSheHe] đã làm vậy.\n\nNhững bài giảng thường lệ của [acolyte.GetHerHis|U] đã bị bỏ dở, thay vào đó là một kiểu nhiệt thành bình thường hơn nhiều."
  fp2_lyonese_monk.0031.a:0 "Ta không cần [acolyte.GetFirstNameNoTooltip] khi ta có [acolyte_host.GetFaith.HighGodName]!"
  fp2_lyonese_monk.0031.b:0 "[acolyte.GetSheHe|U] rõ ràng cũng không tận tâm đến thế."
 
  fp2_lyonese_monk.0041.t:0 "Những Vấn Đề Lớn Hơn"
  fp2_lyonese_monk.0041.desc.pope_hope_is_nope:0 "Điều không tưởng đã xảy ra — Tòa Thánh Roma đã bị hủy diệt hoàn toàn. Nền tảng thực sự và biểu tượng của Giáo hội chúng ta đã bị xé toạc, và chẳng ai còn thời gian để tranh cãi những chi tiết giáo lý nhỏ nhặt.\n\nLinh hồn của tất cả tín hữu của Chúa Kitô đang lâm nguy nếu không có sự lãnh đạo tinh thần vững chắc. Trước điều đó, còn gì quan trọng nữa?"
  fp2_lyonese_monk.0041.desc.schism:0 "Những biến động gần đây đã tạo ra một hố sâu giữa chúng ta và Giáo hoàng — vì vậy chúng ta không còn thời gian tranh cãi về những chi tiết giáo lý nhỏ nhặt. Tại sao phải quan tâm đến cách giải thích của họ, những vấn đề của họ, những điều vô nghĩa của họ khi chúng ta không còn công nhận quyền lực tinh thần của họ?\n\nChắc chắn rằng bất cứ ai nghĩ điều này không phải là một phúc lành thì không được chào đón trong cộng đồng tín hữu."
  fp2_lyonese_monk.0041.a.pope_hope_is_nope:0 "Ai sẽ dẫn dắt chúng ta khi không còn Đại Diện của Chúa?"
  fp2_lyonese_monk.0041.a.backup:0 "Giờ chúng ta sẽ có những tranh cãi #EMP hoàn toàn mới#!!"

  fp2_lyonese_monk.0051.t:0 "Đó Là Một Bí Ẩn"
  fp2_lyonese_monk.0051.desc:0 "Kể từ khi ta bị giam cầm, liên lạc với thế giới bên ngoài trở nên rất hiếm. Những lời thì thầm và thỉnh thoảng vài mẩu giấy nhàu nát là tất cả những gì đến được với ta, và ngay cả thế cũng rất hiếm.\n\nMẩu tin cuối cùng ta nhận được là [acolyte.GetFirstName] về cơ bản đã biến mất. Không rõ [acolyte.GetSheHe] chỉ đơn giản rời đi vào một ngày nào đó hay có điều gì đen tối hơn đang xảy ra, nhưng dù thế nào đi nữa, [acolyte.GetWomanMan] đó đã biến mất."
  fp2_lyonese_monk.0051.a:0 "Điều gì đã xảy ra với [acolyte.GetHerHim]?"

 ##################################################
 # #Private Teachings
 
  fp2_lyonese_monk.0201.t:0 "Chỉ Vài Người Ngài"
  fp2_lyonese_monk.0201.desc:0 "[acolyte.GetFirstName] đã trở thành một gương mặt quen thuộc trong triều kể từ khi [acolyte.GetHerHis] đến đây. Có sức hút kỳ lạ, ít nhất là trong các vấn đề thần học, [acolyte.GetSheHe] luôn trò chuyện nho nhỏ trong các hốc tường của pháo đài với cận thần này hoặc $knight_culture_player_no_tooltip$ kia.\n\nVì vậy ta cũng phần nào đoán trước được khi [acolyte.GetSheHe] đến gặp ta với yêu cầu xin một căn phòng để tổ chức nhóm nghiên cứu [acolyte.GetFaith.random_ReligiousText] hàng tuần.\n\n\"Xin hãy cho phép, thưa [acolyte_host.GetTitleAsNameNoTooltip]? Điều đó có ý nghĩa rất lớn với Ta, và Ta có thể chia sẻ rất nhiều với thần dân của ngài về con đường và ý chí của [acolyte.GetFaith.HighGodName]. Ta chỉ cần sự cho phép của ngài và một không gian nhỏ để tụ họp.\""
  fp2_lyonese_monk.0201.a:0 "Ta nghĩ chắc cũng không hại gì..."
  fp2_lyonese_monk.0201.a.tt:0 "[acolyte.GetFirstNameNoTooltip] sẽ bắt đầu tổ chức các buổi học Chủ Nhật"
  fp2_lyonese_monk.0201.b:0 "Một nhóm #EMP âm mưu#! sao? Ta không nghĩ vậy!"
  fp2_lyonese_monk.0201.c:0 "Ta nghĩ ngươi đã ở đây quá lâu rồi, [acolyte.GetFirstNameNoTooltip]."
 
  fp2_lyonese_monk.0211.t:0 "[baron.Custom2('AppropriateGreetingPositive', acolyte_host)]"
  fp2_lyonese_monk.0211.desc:0 "Ta vui mừng thông báo rằng ta sẽ lập tức từ nhiệm chức vụ cai quản [baron_holding.GetNameNoTier].\n\nĐức tin của ta kêu gọi ta phụng sự [acolyte.GetFaith.HighGodName], và ta dự định dành phần đời còn lại hoàn toàn cống hiến cho sự phụng sự của [acolyte.GetFaith.HighGodHerHis|U]."
  fp2_lyonese_monk.0211.a:0 "[baron.GetSheHe] #EMP có thể#! làm vậy sao?"
 
  fp2_lyonese_monk.0221.t:0 "Nụ Cười Nhăn Nhở"
  fp2_lyonese_monk.0221.desc:0 "Thật là một tiếng huýt sáo vui vẻ một cách #EMP khó chịu#! đang vang vọng về phía ta, ngay sau một cuộc họp hội đồng #EMP dài#!. Ta chưa kịp xử lý điều đó thì [courtier.Custom2('MyCharacterIntroduction' , acolyte_host)] rẽ góc và đâm sầm vào ta, suýt nữa làm ta ngã xuống sàn.\n\n\"Ôi, chao ôi, tôi rất xin lỗi [acolyte_host.GetFirstName]!\" [courtier.GetSheHe] cười khúc khích. \"Chỉ là... hôm nay #EMP thật#! là một ngày đẹp trời, phải không? Ngài thực sự có thể hít thở hơi thở từ tạo hóa của [courtier.GetFaith.HighGodNamePossessive]!\".\n\n[courtier.GetWomanMan] đó đưa tay ra cho ta, cười toe toét khi [courtier.GetSheHe] làm vậy."
  fp2_lyonese_monk.0221.a:0 "Mừng vì ngươi vẫn ổn, [courtier.GetFirstNameNoTooltip]!"
  fp2_lyonese_monk.0221.b:0 "Ta có linh cảm xấu về chuyện này..."
 
  fp2_lyonese_monk.0231.t:0 "La Ó Vị Giám Mục"
  fp2_lyonese_monk.0231.desc:0 "Tin đồn trong triều cho rằng bài giảng gần đây nhất của [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)] trước dân chúng tại [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTier] đã diễn ra #EMP vô cùng tệ hại#!.\n\nNghe nói các giáo dân bắt đầu ném hành chỉ vài phút sau khi ông ta bắt đầu, rồi nhanh chóng chuyển sang ném củ cải, trước khi kết thúc bằng một bắp cải lớn đến mức khi trúng vào mặt [irate_theocrat.GetHerHim], vị [irate_theocrat.GetWomanMan] đã ngã lăn ra đất.\n\n[irate_theocrat.GetFirstNameNoTooltip] từ đó đến nay vẫn chưa nguôi ngoai, và không thể đưa ra lời giải thích hợp lý nào vì sao [irate_theocrat.GetSheHe] lại khiến dân chúng nổi giận đến vậy."
  fp2_lyonese_monk.0231.a:0 "Mọi người cần phải thể hiện sự #EMP tôn trọng#! hơn với Giáo Hội."
  fp2_lyonese_monk.0231.b:0 "Rõ ràng [irate_theocrat.GetSheHe] cần phải làm việc lại những bài thuyết giáo của [irate_theocrat.GetHerHis]."
 
  fp2_lyonese_monk.0241.t:0 "Tất Cả Là Lỗi Của [acolyte.GetHerHis|U]"
  fp2_lyonese_monk.0241.desc:0 "Với một tiếng gầm vang dội, [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)] xông vào phòng của ta, kéo [acolyte.GetFirstName] đi bằng tay áo áo choàng của [acolyte.GetHerHis].\n\n\"Thưa [acolyte_host.GetTitleAsNameNoTooltip] của ta! Tất cả đều là tại tên khốn này! Những nông dân vô lễ, những cận thần #EMP vui vẻ#!, dòng người tu sĩ lạ lùng tràn vào! [acolyte.GetWomanMan] này đang nhồi nhét đầu óc họ bằng những lời dối trá và dị giáo hàng tuần, và lại làm điều đó với #EMP con dấu của ngài#!!!\"\n\n\"Thưa [acolyte_host.GetLadyLord|U] cao quý\", [acolyte.GetFirstNameNoTooltip] ngắt lời, \"Ta là một tôi tớ trung thành của Chúa và [acolyte_host.GetFaith.GetReligiousHead.GetTitledFirstName]. #EMP Xin ngài#! đừng rơi vào bẫy của sự bất an đầy nịnh hót từ kẻ #EMP điên rồ#! rống rít này, kẻ chỉ đơn giản là khó chịu vì các tiêu chuẩn địa phương dành cho giáo sĩ gần đây đã được nâng lên\"."
  fp2_lyonese_monk.0241.a:0 "Được rồi — thu dọn đồ đạc đi, [acolyte.GetFirstNameNoTooltip]."
  fp2_lyonese_monk.0241.b:0 "LÍNH ĐÂU! Bắt tên dị giáo này!"
  fp2_lyonese_monk.0241.c:0 "Ta nghĩ kẻ gây rắc rối là #EMP ngươi#! đấy, [irate_theocrat.GetFirstNameNoTooltip]."
  fp2_lyonese_monk.0241.c.tt:0 "[acolyte.GetFirstNameNoTooltip] sẽ tiếp tục giảng dạy cho các cận thần của Ngài"

 ##################################################
 # #Public Controversy
 
  fp2_lyonese_monk.0401.t:0 "[pope.Custom2('AppropriateGreetingPositive', acolyte_host)]"
  fp2_lyonese_monk.0401.desc:0 "Gần đây ta nhận được những thư từ đáng lo ngại liên quan đến những giáo lý lệch lạc tại triều đình của ngươi.\n\nVì ta biết ngươi là một tín đồ tốt của [pope.GetFaith.GetAdherentName], ta tin rằng bức thư này sẽ đủ để khiến ngươi làm điều đúng đắn và trục xuất kẻ #EMP [acolyte.GetFirstName]#! này, vì sức khỏe tinh thần của tất cả chúng ta."
  fp2_lyonese_monk.0401.a:0 "Tòa Thánh buộc ta phải làm vậy."
  fp2_lyonese_monk.0401.b:0 "Ta không nhớ là đã hỏi ý kiến của [papal_capital.GetNameNoTierPossessiveNoTooltip]."
 
  fp2_lyonese_monk.0411.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Không Gian Để Giảng Dạy"
  fp2_lyonese_monk.0411.desc:0 "\"Thưa [acolyte_host.GetLadyLord|U], xin ngài chút thời gian?\" [acolyte.GetFirstName] cầu xin khi bước ra từ bóng tối của một hốc tường lúc ta rời nhà nguyện trong pháo đài. Ta suy nghĩ một lát rồi gật đầu.\n\n\"Ta vô cùng biết ơn sự hỗ trợ và bảo trợ của ngài trong sứ mệnh giảng dạy Lời của [acolyte.GetFaith.HighGodName] cho thần dân của ngài, nhưng Ta đang chạm đến giới hạn với chỉ một căn phòng nhỏ và vài giờ mỗi tuần.\"\n\n\"Liệu ngài, với trí tuệ và lòng hào phóng vô hạn, có sẵn sàng giao cho Ta quyền quản lý [acolyte_fief.GetNameNoTier]? Với tiền thuê từ lãnh địa đó, Ta có thể cứu rỗi hàng ngàn linh hồn thay vì chỉ vài chục!\""
  fp2_lyonese_monk.0411.a:0 "Ta nghĩ... có lẽ ta có thể cho phép..."
  fp2_lyonese_monk.0411.b:0 "Đừng có vô lý!"
  fp2_lyonese_monk.0411.b.tt:0 "Ước mơ của [acolyte.GetFirstNamePossessiveNoTooltip] hoàn toàn tan vỡ"
 
  fp2_lyonese_monk.0421.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Căng Thẳng Leo Thang"
  fp2_lyonese_monk.0421.desc:0 "Chỉ một bữa tối yên tĩnh. Chỉ. Một. Bữa. Tối. Yên tĩnh. Kẻ ngu ngốc nào trong đội ngũ phục vụ đã xếp [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)] ngồi cạnh [acolyte.GetFirstName]?\n\n\"#EMP Cái gì#! ngài vừa nói?\" [irate_theocrat.GetFirstNameNoTooltip] hét lên, loạng choạng đứng dậy khỏi ghế, làm trái cây và bánh mì vương vãi khắp nơi. \"Đó là Con của [irate_theocrat.GetFaith.HighGodName], vĩnh cửu và đồng bản thể mà ngài dám phỉ báng, đồ [acolyte.GetWomanMan] kia!\" Căn phòng trở nên im lặng đáng sợ, ánh mắt mọi người đổ dồn vào các giáo sĩ đang tranh cãi.\n\n\"Ta không phỉ báng ai cả. Ngài đơn giản là không hiểu được những sắc thái trong thần học Kitô của ta, và ta không thể tự trách ngài. Ít nhất là không phải khi xem xét những...\" [acolyte.GetFirstNameNoTooltip] dừng lại một chút, \"... khiếm khuyết của ngài\"."
  fp2_lyonese_monk.0421.a:0 "[irate_theocrat.GetFirstNameNoTooltip], hãy giữ lễ nghi!"
  fp2_lyonese_monk.0421.b:0 "[acolyte.GetFirstNameNoTooltip], ngươi #EMP phải#! tôn trọng quyền uy của [irate_theocrat.GetHerHis]!"
  fp2_lyonese_monk.0421.c:0 "Hai người chẳng phải có nhiều điểm chung hơn là khác sao?"
 
  fp2_lyonese_monk.0431.t:0 "[pope.Custom2('AppropriateGreetingPositive', acolyte_host)]"
  fp2_lyonese_monk.0431.desc.pope.different:0 "Có lẽ người tiền nhiệm của ta"
  fp2_lyonese_monk.0431.desc.pope.same:0 "Có lẽ chính ta"
  fp2_lyonese_monk.0431.desc.outro:0 "không rõ ràng trong bức thư đầu tiên được gửi đi. [acolyte.GetFullNameNoTooltip] bị buộc tội khơi dậy những học thuyết #EMP ly khai#! tốt nhất nên để chúng cháy rụi cùng với những kẻ ủng hộ đáng ghét của chúng ở [pope.GetFaith.NegativeAfterLife2]. Hãy giao [acolyte.GetHerHim] cho ta để xét xử, #EMP ngay lập tức#!, nếu không muốn đối mặt với nguy cơ bị khiển trách."
  fp2_lyonese_monk.0431.a:0 "Không nên chọc giận ngai tòa Thánh Phêrô..."
  fp2_lyonese_monk.0431.b:0 "Có lẽ vẫn có cách dung hòa."
  fp2_lyonese_monk.0431.b.tt.success:0 "[pope.GetTitledFirstNameNoTooltip] phần nào nguôi giận"
  fp2_lyonese_monk.0431.b.tt.failure:0 "Lập luận vụng về của Ngài khiến Giáo hoàng nổi giận"
  fp2_lyonese_monk.0431.c:0 "Chết tiệt, ta mới là [acolyte_host.GetTitleAsNameNoTooltip]!"
 
  fp2_lyonese_monk.0441.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Công Đồng tại [council_1_venue.GetNameNoTierNoTooltip]"
  fp2_lyonese_monk.0441.desc:0 "[council_1_venue.GetNameNoTier] thực sự #EMP chật cứng#! giáo sĩ và những người thông thái, tất cả ở đó để chứng kiến một cuộc tranh luận công khai giữa [acolyte.GetFullNameNoTooltip] và [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)], cả hai đều cam kết vạch trần những sai lầm mà họ coi là hiển nhiên trong giáo lý của đối phương.\n\nNhững ngày đầu tiên diễn ra không suôn sẻ lắm đối với [irate_theocrat.GetFirstNameNoTooltip]. Bất chấp những nỗ lực hết mình của [irate_theocrat.GetHerHis] nhằm chứng minh rằng thần học của [acolyte.GetFirstNamePossessiveNoTooltip] là sai lầm, khi quá chú trọng vào yếu tố con người trong bản tính của Chúa Jesus, buổi tụ họp khu vực của [acolyte.GetFaith.PriestNeuterPlural] có vẻ không quan tâm đến những lý lẽ của [irate_theocrat.GetHerHis].\n\n[acolyte.GetFirstNameNoTooltip], ngược lại, lại quá tự tin vào lý tưởng của [acolyte.GetHerHis] đến mức [acolyte.GetSheHe] đã mời ta giám sát những lời phát biểu kết thúc, mang lại tính hợp pháp trần thế cho một sự kiện mang tính tâm linh."
  fp2_lyonese_monk.0441.a:0 "Nếu họ đã mời ta..."
  fp2_lyonese_monk.0441.b:0 "Thần học không phải chuyện của ta."
  fp2_lyonese_monk.0441.c:0 "Ta đã để chuyện này đi quá xa!"

 ##################################################
 # #Schism

  fp2_lyonese_monk.0601.t:0 "[pope.Custom2('AppropriateGreetingNegative', acolyte_host)]"
  fp2_lyonese_monk.0601.desc:0 "Như con chó quay lại với bãi nôn của nó, những kẻ ngu ngốc luôn quay lại với dị giáo của [GetFaithByKey('adoptionist').GetName]. Bằng mọi ân điển của Chúa Jesus và Thánh Peter, ta #EMP ra lệnh#! cho ngài giao nộp kẻ dị giáo [acolyte.GetFullNameNoTooltip] để trừng trị — hãy hối cải ngay bây giờ và tình yêu vô bờ bến của Giáo hội sẽ tha thứ cho ngài, nhưng nếu cứ tiếp tục với sự dị giáo này, ngài sẽ bị #EMP trừng phạt#! cùng với [acolyte.GetHerHim]."
  fp2_lyonese_monk.0601.a:0 "Ta chỉ có thể cầu xin sự tha thứ của [acolyte_host.GetFaith.HighGodNamePossessive]."
  fp2_lyonese_monk.0601.b:0 "Ta được #EMP bổ nhiệm#! bởi [acolyte_host.GetFaith.HighGodName]!"
 
  fp2_lyonese_monk.0611.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Căng Thẳng Cao Độ"
  fp2_lyonese_monk.0611.desc:0 "\"Dị giáo! Kẻ nói dối! Kẻ báng bổ!\"\n\n\"Dân ngoại! Lũ ngu! Kẻ thờ ngẫu tượng!\"\n\nTừ trên tường thành pháo đài ở [rioting_county.GetNameNoTier], ta nhìn xuống hai đám đông đối địch gồm thị dân và nông dân, mỗi bên đều phun ra những lời cay độc. Các học trò và tín đồ của [acolyte.GetFirstName] đang đối mặt với đám đông chống đối họ.\n\nGiữa hai bên là hàng lính mỏng manh của ta, tạm thời giữ khoảng cách, nhưng bầu không khí căng thẳng gần như sắp bùng nổ."
  fp2_lyonese_monk.0611.a:0 "Ta có thể làm dịu tình hình này."
  fp2_lyonese_monk.0611.b:0 "Xin các thần dân của ta, hãy bình tĩnh!"
  fp2_lyonese_monk.0611.b.tt.success:0 "Ngài làm dịu được tình hình"
  fp2_lyonese_monk.0611.b.tt.failure:0 "Bạo lực vẫn bùng nổ"
  fp2_lyonese_monk.0611.c:0 "Mang kiếm cho ta, chúng ta sẽ giải tán lũ #EMP nổi loạn#! này."
  fp2_lyonese_monk.0611.c.tt:0 "Ngài đứng về phía những kẻ cuồng tín dị giáo"
  fp2_lyonese_monk.0611.d:0 "Dị giáo? Trên #EMP lãnh thổ của ta#! sao?"
  fp2_lyonese_monk.0611.d.tt:0 "Ngài đứng về phía những kẻ cuồng tín chính thống"
  fp2_lyonese_monk.0611.e:0 "Đóng cổng lại."
 
  fp2_lyonese_monk.0621.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Một Lời Khiếu Nại Chính Thức"
  fp2_lyonese_monk.0621.desc:0 "\"Thưa chủ quân,\" [zealous_vassal.GetTitledFirstName] cầu xin, \"chẳng phải Ta là chư hầu trung thành của ngài sao? Chẳng phải Ta luôn ủng hộ ngài một cách trung thành sao? Ta khẩn cầu ngài, xin đừng đi theo... tên #EMP giáo chủ dị giáo#! này trên con đường mà Ta không thể theo.\" \n\n\"Đừng nghe lời [zealous_vassal.GetWomanMan] này, thưa [acolyte_host.GetTitleAsNameNoTooltip],\" [acolyte.GetFirstName] thì thầm sau lưng ta. \"Ai cũng biết [zealous_vassal.GetSheHe] chỉ là con tốt của [papal_capital.GetNameNoTier], cố đầu độc tâm trí ngài.\" \n\n\"Câm miệng lại trước khi ta cắt lưỡi ngươi, đồ rắn độc!\" [zealous_vassal.GetFirstNameNoTooltip] gầm lên."
  fp2_lyonese_monk.0621.a:0 "[pope.GetTitledFirstNameNoTooltip] còn không thuyết phục được ta; ngươi nghĩ ngươi làm được sao?"
  fp2_lyonese_monk.0621.a.tt.success:0 "Ngài gieo nghi ngờ vào lập luận của [zealous_vassal.GetHerHis]"
  fp2_lyonese_monk.0621.a.tt.failure:0 "[zealous_vassal.GetFirstNameNoTooltip] càng thêm phẫn nộ"
  fp2_lyonese_monk.0621.b:0 "Chư hầu? Ngươi chỉ là kẻ bất mãn!"
  fp2_lyonese_monk.0621.c:0 "[zealous_vassal.GetTitledFirstNameNoTooltip] nói đúng, chuyện này đã đi quá xa."
 
  fp2_lyonese_monk.0631.t:0 "[neighbouring_ruler.Custom2('AppropriateGreetingNegative', acolyte_host)]"
  fp2_lyonese_monk.0631.desc:0 "Ta viết thư này để thông báo, với tất cả thiện ý của mình, rằng [pope.GetTitledFirstName] gần đây đã trao cho ta một sắc lệnh về quyền sở hữu hoàn toàn và #EMP hợp pháp#! đối với [acolyte_host.GetPrimaryTitle.GetNameNoTier].\n\nKhi ta đến kiểm tra tài sản mới của mình, ta tin rằng ngươi sẽ giao nó lại mà không gây rắc rối."
  fp2_lyonese_monk.0631.a:0 "Thật vô lý!"
 
  fp2_lyonese_monk.0641.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Chỉ Là Một Con Người"
  fp2_lyonese_monk.0641.desc:0 "Ta có kẻ thù ở mọi phía. Những chư hầu không trung thành, một Giáo hoàng phẫn nộ, nông dân đang tàn sát lẫn nhau... Ta cảm thấy như [acolyte_host.GetPrimaryTitle.GetNameNoTier] đang bắt đầu tan rã xung quanh ta, bị xé nát bởi những tiểu tiết thần học và những cuộc đấu tranh quyền lực nhỏ nhặt. Chán nản, ta gục xuống bàn làm việc.\n\n\"Thưa [acolyte_host.GetTitleAsNameNoTooltip]\", [acolyte.GetFullNameNoTooltip] lầm bầm, đứng sau ghế của ta. Ta thậm chí không nghe thấy [acolyte.GetHerHim] bước vào. \"Có vẻ như, bất chấp mọi nỗ lực tốt nhất của chúng ta, [pope.GetTitledFirstName] và lũ tay sai của [pope.GetHerHis] từ chối thỏa hiệp về bất kỳ khía cạnh nào trong giáo điều sai lầm của họ\".\n\n\"Tuy nhiên, ta tự hỏi... họ dường như #EMP sợ hãi#! những chân lý tiềm năng mà chúng ta khám phá ra khi đặt câu hỏi về cách giải thích giáo luật của họ. Nếu những kẻ ngu ngốc và tôn thờ ngẫu tượng như thế này nhất quyết nguyền rủa chúng ta là [GetFaithByKey('adoptionist').GetAdherentNamePlural], thì liệu đó có thực sự là một sự nguyền rủa? Có lẽ [acolyte.GetFaith.HighGodName] đang #EMP bày tỏ#! chính [acolyte.GetFaith.HighGodHerselfHimself|U] thông qua tiếng kêu của họ?\"."
  fp2_lyonese_monk.0641.a:0 "Phải... #EMP phải#!, tại sao không? Nếu họ đã #EMP quyết#! buộc tội chúng ta."
  fp2_lyonese_monk.0641.a.tt.hidden_convert.character:0 "Mạng lưới tín đồ bí mật của [acolyte.GetFirstNamePossessiveNoTooltip]"
  fp2_lyonese_monk.0641.a.tt:0 "Một công nghị giáo hội sẽ được triệu tập"
  fp2_lyonese_monk.0641.b:0 "Đồ rắn độc! Ngươi đã lên kế hoạch chuyện này từ đầu!"

 ##################################################
 # #Council

  fp2_lyonese_monk.0801.t.first:0 "Công đồng tại [council_2_venue.GetNameNoTierNoTooltip]"
  fp2_lyonese_monk.0801.t.second:0 "Công đồng lần thứ hai tại [council_2_venue.GetNameNoTierNoTooltip]"
  fp2_lyonese_monk.0801.desc.intro:0 "Một đức tin mới nổi đòi hỏi sự tranh luận, và vì vậy [acolyte.GetFirstName] đã tập hợp một hội nghị gồm các giáo sĩ có ảnh hưởng thông cảm với mục tiêu của chúng ta. Ba phe phái thống trị, đang tranh giành quyền lực trong sảnh đường của ta khi chúng ta chuẩn bị thảo luận về giáo lý cho phong trào của mình.\n\n[GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] ủng hộ một cách giải thích tinh tế nhưng không khoan nhượng, dung hòa nhiều quan điểm Ba Ngôi truyền thống. [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] nghiêm khắc hơn, nhưng tập trung vào tính thực tế của đức tin trong một thế giới thù địch. Nhóm thiểu số [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] tràn ngập sự phẫn nộ khó che giấu, coi chính thống giáo truyền thống chẳng khác gì sự ngoại giáo được che đậy một cách sơ sài.\n\nKhẳng định thời gian [acolyte.GetHerHis] ở trong triều đình của ta đã dạy [acolyte.GetHerHim] giá trị của"
  fp2_lyonese_monk.0801.desc.elipandic:0 "tranh luận và sự kiên định, [acolyte.GetFirstNameNoTooltip] đứng về phía phe [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName]."
  fp2_lyonese_monk.0801.desc.felicitous:0 "sự khiêm nhường và tính thực tiễn, [acolyte.GetFirstNameNoTooltip] đứng về phía phe [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName]."
  fp2_lyonese_monk.0801.desc.radical:0 "lửa và sự dữ dội, [acolyte.GetFirstNameNoTooltip] đứng về phía phe [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName]."
  fp2_lyonese_monk.0801.tt.invalidation_warning:0 "#WEAK Nếu ta bị [imprisoned|E] và không thể hoàn thành hội nghị, quan điểm của [acolyte.GetFirstNamePossessiveNoTooltip] sẽ chiếm ưu thế#!"
  fp2_lyonese_monk.0801.a:0 "Đương nhiên, ta sẽ đóng vai trò chủ đạo trong các cuộc thảo luận."
  fp2_lyonese_monk.0801.a.tt:0 "Ngài tham gia các cuộc đấu trí [learning|E] để bảo vệ quan điểm của mình"
  fp2_lyonese_monk.0801.b:0 "Ảnh hưởng của ta sẽ được cảm nhận nhiều hơn là nhìn thấy..."
  fp2_lyonese_monk.0801.b.tt:0 "Ngài tiêu tốn [piety_i]#N [EmptyScope.ScriptValue('fp2_lyonese_monk_conclave_cost_value')|0]#! [piety|E] cho mỗi lựa chọn cứng rắn #WEAK nhưng không thể tiêu $game_concept_piety$ mà Ngài không có#!"
  fp2_lyonese_monk.0801.c:0 "Đây là chuyện của riêng giới giáo sĩ."
  fp2_lyonese_monk.0801.c.tt:0 "Hội nghị sẽ được quyết định mà không có sự tham gia của Ngài"
 
  fp2_lyonese_monk.0811.t:0 "$fp2_lyonese_monk.0000.t.council$ Cha & Con"
  fp2_lyonese_monk.0811.desc:0 "Câu hỏi rõ ràng nhất được đưa ra là vấn đề đồng bản thể, hay làm thế nào Chúa Jesus vừa có thể sống một cuộc đời ý nghĩa như một con người từng chịu đau khổ, vừa tồn tại như một đấng thần thánh vĩnh cửu.\n\nPhe [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] cho rằng hai điều này không loại trừ lẫn nhau, trong khi phe [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] kêu gọi một sự phân biệt rõ ràng, không phủ nhận thần tính của Con Thiên Chúa mà chỉ đặt nó dưới quyền của Chúa Cha.\n\nCác thành viên của phe [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] thì ném trái cây và gào lên rằng toàn bộ vấn đề chỉ là trò phô trương vô nghĩa."
  fp2_lyonese_monk.0811.a:0 "Tình hình phức tạp hơn thế..."
  fp2_lyonese_monk.0811.a.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0811.a.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0811.b:0 "Được [acolyte.GetFaith.HighGodName] lựa chọn không phải là điều đáng xấu hổ."
  fp2_lyonese_monk.0811.b.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0811.b.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0811.c:0 "Đã #EMP từng#! là con người thì không thể #EMP vĩnh viễn#! là Thượng Đế!"
  fp2_lyonese_monk.0811.c.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0811.c.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0811.d:0 "Ta không có ý kiến về chuyện này."
 
  fp2_lyonese_monk.0821.t:0 "$fp2_lyonese_monk.0000.t.council$ Thực tiễn vs. Nguyên tắc"
  fp2_lyonese_monk.0821.desc:0 "Các cuộc thảo luận của hội nghị đã chuyển sang vấn đề làm thế nào để sống và thờ phụng trong một thế giới coi [acolyte_host.GetFaith.GetName] là sự giản lược đến mức dị giáo tột cùng.\n\nTrước hết, phe [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] khẳng định rằng chân lý nội tâm quan trọng hơn lời nói bên ngoài, viện dẫn người cùng tên của họ, Felix xứ Urgell, với vô số — #EMP vô số#! — lần cải đạo giả và cuộc đời dài lâu mà chúng mang lại.\n\nCác đồng sự của họ trong phe [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] lên án điều này là sự hèn nhát báng bổ, cho rằng thảo luận và tranh luận mới là con đường duy nhất để đạt được sự tôn trọng. Phe [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] thì khẳng định rằng #EMP chỉ#! quyền lực thế tục mới có thể bảo vệ tín đồ."
  fp2_lyonese_monk.0821.a:0 "Sự dung hòa với phần còn lại của Kitô giáo là điều thiết yếu."
  fp2_lyonese_monk.0821.a.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0821.a.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0821.b:0 "Tính thực tiễn tự thân đã là một nguyên tắc."
  fp2_lyonese_monk.0821.b.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0821.b.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0821.c:0 "Đức tin ẩn giấu là đức tin không có ngọn lửa!"
  fp2_lyonese_monk.0821.c.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0821.c.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0821.d:0 "Điều này còn tùy hoàn cảnh..."

  fp2_lyonese_monk.0831.t:0 "$fp2_lyonese_monk.0000.t.council$ Một Thượng Đế"
  fp2_lyonese_monk.0831.desc:0 "Hội nghị đi đến hồi kết đầy căng thẳng, với những vụ ẩu đả nhỏ và các cuộc tranh cãi nảy lửa lan khắp [council_2_venue.GetNameNoTier], khi cả ba phe giáo sĩ chiến đấu — cả theo nghĩa đen lẫn nghĩa bóng — vì niềm tin của mình.\n\nTrọng tâm của cuộc tranh luận #EMP sôi nổi#! này là những nguyên lý cơ bản.\n\nPhe [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] khẳng định điều họ xem là độc thần thuần túy; phe [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] nhấn mạnh mạnh mẽ vào Chúa Cha nhưng không chỉ trích gay gắt như phe Cấp tiến yêu cầu; còn phe [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] vẫn giữ nhiều yếu tố tư tưởng Ba Ngôi mà những phe khác cho là không thể chấp nhận."
  fp2_lyonese_monk.0831.a:0 "Chúa Cha, Chúa Con và Chúa Thánh Thần vẫn là một."
  fp2_lyonese_monk.0831.a.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0831.a.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0831.b:0 "Sự tách biệt giữa Cha và Con không làm giảm giá trị của bên nào."
  fp2_lyonese_monk.0831.b.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0831.b.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0831.c:0 "Quyền tối thượng của Chúa Cha là bất biến."
  fp2_lyonese_monk.0831.c.tt.success:0 "Ngài thuyết phục được các [acolyte_host.GetFaith.PriestNeuterPlural]"
  fp2_lyonese_monk.0831.c.tt.failure:0 "Giới giáo sĩ chế giễu Ngài"
  fp2_lyonese_monk.0831.d:0 "Chúng ta đã chia rẽ theo giáo điều nhanh đến vậy sao?"
 
  fp2_lyonese_monk.0841.t:0 "$fp2_lyonese_monk.0000.t.council$ Từ Bờ Vực"
  fp2_lyonese_monk.0841.desc.intro:0 "Vào ngày này, tín điều #EMP mới#! của [acolyte_host.GetFaith.GetAdjective] ra đời! "
  fp2_lyonese_monk.0841.desc.pluralist:0 "Sau khi chấp nhận sự cần thiết phải dung hòa với những người khác trong lãnh thổ của chúng ta,"
  fp2_lyonese_monk.0841.desc.righteous:0 "Sau khi giữ vững lập trường trong việc đối xử với những người khác trong lãnh thổ của chúng ta,"
  fp2_lyonese_monk.0841.desc.fundamentalist:0 "Sau khi quyết tâm cải đạo những kẻ chưa được cứu rỗi trong lãnh thổ của chúng ta,"
  fp2_lyonese_monk.0841.desc.sanctioned_false_conversions:0 "chúng ta không thấy vấn đề gì khi vẫn thực tế khi tình thế đảo ngược."
  fp2_lyonese_monk.0841.desc.religious_law:0 "chúng ta vẫn cam kết giải quyết các tranh chấp thần học một cách công khai."
  fp2_lyonese_monk.0841.desc.pursuit_of_power:0 "chúng ta không thấy lý do gì để không làm hết sức mình nhằm #EMP mở rộng#! những vùng đất đó bằng mọi giá."
  fp2_lyonese_monk.0841.desc.felicitous:0 "\n\nSau cuộc tranh luận dữ dội, những chiếc lưỡi bạc của phe [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] cuối cùng đã chiến thắng."
  fp2_lyonese_monk.0841.desc.elipandic:0 "\n\nQua những cuộc tranh luận điềm tĩnh, những cái đầu lạnh của phe [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] đã giành chiến thắng."
  fp2_lyonese_monk.0841.desc.radical:0 "\n\nSau tất cả những cuộc thảo luận vô nghĩa này, chỉ những người cực đoan của phe [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] còn giữ được tầm nhìn rõ ràng, và giờ đây chúng ta hướng về họ để dẫn dắt mình."
  fp2_lyonese_monk.0841.desc.outro:0 "\n\nChúng ta không còn chỉ là giấc mơ của một giáo sĩ lang thang đơn độc. Giờ đây chúng ta là một cộng đồng sống động và mạnh mẽ, và chẳng bao lâu nữa toàn thể Kitô giáo chắc chắn sẽ chấp nhận chúng ta."
  fp2_lyonese_monk.0841.a:0 "Cứ để họ gọi chúng ta là dị giáo. Chúng ta chỉ có sự tinh tế mà họ thiếu."
  fp2_lyonese_monk.0841.b:0 "Lời nói của chúng ta hợp lý, hành động của chúng ta cũng vậy."
  fp2_lyonese_monk.0841.c:0 "Hãy nhìn những Kitô hữu giả dối này và thuyết đa thần của họ bị vạch trần!"
  fp2_lyonese_monk.0841.d:0 "Ta chỉ hy vọng chúng ta đã chọn đúng."
