l_english: 
  game_concept_struggle:1 "Xung Đột"
  game_concept_struggle_struggles:0 "Các Xung Đột"
  game_concept_struggle_struggles_possessive: "của Xung Đột"
  game_concept_struggle_desc:2 "$game_concept_struggle_struggles$ là những cuộc xung đột dài hạn liên quan đến các [struggle_region_regions|E] rộng lớn với nhiều [faiths|E] và [cultures|E]. Trong phạm vi của một $game_concept_struggle$, các quy tắc đặc biệt và [modifiers|E] riêng có thể được áp dụng và thay đổi theo thời gian. Vì chúng kéo dài từ vài thập kỷ đến hàng thế kỷ, không phải mọi [characters|E] trong một $game_concept_struggle$ đều [war|E] với nhau mọi lúc.\n\nMỗi $game_concept_struggle$ bao gồm nhiều [struggle_phase_phases|E]. Khi các $game_concept_characters$ trong [struggle_region|E] hành động (ví dụ: tuyên bố $game_concept_war$, hoặc [marrying|E]), họ có thể kích hoạt các [struggle_catalyst_catalysts|E] khiến tiến trình chuyển sang các $game_concept_struggle_phase_phases$ khác nhau.\n\nTùy vào mức độ mà họ được những người tham gia khác xem là một phần của $game_concept_struggle$, các $game_concept_characters$ có [land|E] trong khu vực có thể được xem là [struggle_involved|E], [struggle_interloper_interlopers|E], hoặc [struggle_uninvolved|E]."

  game_concept_iberian_struggle:1 "Xung Đột Iberia"
  game_concept_iberian_struggle_desc:2 "$game_concept_iberian_struggle$ mô tả nhiều thế kỷ quan hệ đầy chia rẽ trên Bán đảo Iberia. Mặc dù bắt nguồn từ cuộc chinh phục Iberia của Umayyad vào thế kỷ 8, [struggle|E] này liên tục chuyển đổi giữa các [struggle_phase_phases|E] gồm bạo lực do thù hận thúc đẩy, những thỏa thuận đình chiến đầy cảnh giác, và sự hợp tác mang tính thực dụng. Trong hoàn cảnh như vậy hiếm có đồng minh vĩnh viễn, và các [rulers|E] nên cẩn trọng khi chỉ dựa vào [faith|E] hoặc [culture|E] chung."
  game_concept_struggle_phase:1 "Giai Đoạn Xung Đột"
  game_concept_struggle_phase_phase:1 "Giai Đoạn"
  game_concept_struggle_phase_phases:0 "Các Giai Đoạn"
  game_concept_struggle_phase_desc:1 "Một $game_concept_struggle_phase_phase$ là tâm thế chung của các [struggle_involved|E] [characters|E] và [counties|E] trong một [struggle_region|E]. Nó đại diện cho các xu hướng xã hội và chuẩn mực ngắn hạn tạm thời chi phối diễn biến của [struggle|E].\n\n#weak Ví dụ: trong một $game_concept_struggle_phase_phase$, người dân của một $game_concept_struggle_region_region$ có thể cho rằng sự khoan dung tôn giáo là điều tối quan trọng ngay cả khi phần còn lại của tín ngưỡng của họ không đồng ý.#!"

  game_concept_struggle_catalyst:1 "Chất Xúc Tác Xung Đột"
  game_concept_struggle_catalyst_catalyst:1 "Chất Xúc Tác"
  game_concept_struggle_catalyst_catalysts:0 "Các Chất Xúc Tác"
  game_concept_struggle_catalyst_desc:2 "[struggle_struggles|E] chuyển đổi giữa các [struggle_phase_phases|E] khi một số hành động đáng chú ý được thực hiện, dần hình thành sự đồng thuận của [struggle_region|E] theo một xu hướng nhất định. Danh sách những hành động quan trọng trong từng $game_concept_struggle_phase_phase$ có thể được tìm thấy trong cửa sổ $game_concept_struggle$.\n\n#weak Ví dụ: [struggle_phase_iberia_opportunity|E] của [iberian_struggle|E] có thể chuyển sang [struggle_phase_iberia_hostility|E] hoặc [struggle_phase_iberia_conciliation|E]. Việc ám sát một [character|E] quan trọng có thể khiến tiến trình nghiêng về hướng thứ nhất, trong khi việc thiết lập [marriage|E] [alliance|E] với người có [faith|E] khác sẽ thúc đẩy hướng thứ hai.#!"

  game_concept_struggle_involved:1 "Tham Gia"
  game_concept_struggle_involved_desc:2 "Khi một [character|E] hoặc một [county|E] là $game_concept_struggle_involved$, điều đó có nghĩa họ được người dân của một [struggle_region|E] cụ thể xem là phần tự nhiên và không thể tách rời của một [struggle|E]. Họ được hưởng đầy đủ các lợi thế linh hoạt từ [struggle_phase_phases|E], và là những người kích hoạt chính của [struggle_catalyst_catalysts|E].\n\n[cultures|E] và [faiths|E] được coi là $game_concept_struggle_involved$ là những nền văn hóa và tín ngưỡng đã hoặc đang có sự hiện diện đáng kể trong $game_concept_struggle_region_region$.\n\n#weak Để được coi là $game_concept_struggle_involved$, một $game_concept_character$ phải có cả $game_concept_culture$ và $game_concept_faith$ đều là $game_concept_struggle_involved$ #EMP và#! có [capital|E] nằm trong $game_concept_struggle_region$.#!"

  game_concept_struggle_interloper:1 "Kẻ Can Thiệp"
  game_concept_struggle_interloper_interlopers:0 "Những Kẻ Can Thiệp"
  game_concept_struggle_interloper_desc:2 "Khi một [character|E] bị vướng vào một [struggle|E] cụ thể nhưng chưa được coi là hoàn toàn [struggle_involved|E], họ là một $game_concept_struggle_interloper$.\n\n$game_concept_struggle_interloper_interlopers$ có [capital|E] của họ nằm trong [struggle_region|E], nhưng không có cả [faith|E] $game_concept_struggle_involved$ và [culture|E] $game_concept_struggle_involved$.\n\nNhững $game_concept_characters$ $game_concept_struggle_involved$ hoàn toàn coi họ là những kẻ ngoài cuộc tò mò, phiền toái, không hiểu nơi nào họ không được hoan nghênh. Do đó, các [rulers|E] $game_concept_struggle_interloper$ thường phải chịu một số hình phạt ở các [counties|E] mà họ nắm giữ bên trong một $game_concept_struggle_region$."

  game_concept_struggle_uninvolved:1 "Không Tham Gia"
  game_concept_struggle_uninvolved_desc:2 "Để một [character|E] được coi là $game_concept_struggle_uninvolved$ trong một [struggle|E] cụ thể, họ chỉ cần có [capital|E] nằm ngoài [struggle_region|E].\n\nĐiều này có nghĩa họ bị xem là người ngoài cuộc, người không chỉ không có lợi ích đáng kể trong các [struggle_phase_phases|E] đang diễn ra mà còn #EMP không nên#! can dự, bởi vì họ rõ ràng không thể hiểu được những sắc thái địa phương.\n\nVì một trong số ít điều mà mọi người trong một $game_concept_struggle$ có thể đồng ý là các $game_concept_characters$ $game_concept_struggle_uninvolved$ không có việc gì trong lãnh thổ #EMP của họ#!, nên các [rulers|E] $game_concept_struggle_uninvolved$ thường chịu các hình phạt nặng tại bất kỳ [counties|E] nào họ nắm giữ trong $game_concept_struggle_region$."

  game_concept_struggle_large_conquest:1 "Chinh Phạt Lớn Trong Xung Đột"
  game_concept_struggle_large_conquest_desc:1 "Một số $game_concept_struggle_catalyst_catalysts$ liên quan đến việc kẻ tấn công hoàn thành thành công một [war|E] lớn.\n\nCác [casus_bellis|E] sau được tính cho điều này:\n$EFFECT_LIST_BULLET$ $duchy_conquest_cb$ \n$EFFECT_LIST_BULLET$ $individual_duchy_de_jure_cb$ \n$EFFECT_LIST_BULLET$ $imperial_reconquest_cb$ \n$EFFECT_LIST_BULLET$ $invasion_war$ \n$EFFECT_LIST_BULLET$ $clan_invasion_war$ \n$EFFECT_LIST_BULLET$ $mongol_invasion_war$ \n$EFFECT_LIST_BULLET$ $major_religious_war$ $game_concept_war$ \n$EFFECT_LIST_BULLET$ Both [great_holy_war_directed|E] & [great_holy_war_undirected|E] $game_concept_great_holy_wars$ \n$EFFECT_LIST_BULLET$ $tribal_subjugation_cb$"

  game_concept_struggle_region:1 "Khu Vực Xung Đột"
  game_concept_struggle_region_region:1 "Khu Vực"
  game_concept_struggle_region_regions:0 "Các Khu Vực"
  game_concept_struggle_region_desc:2 "Mỗi [struggle|E] đều gắn với một [region|E] trên bản đồ. Vị trí của một [character_possessive|E] trong $game_concept_region$ này (cùng với [culture|E] và [faith|E] của họ) quyết định họ được phân loại là [struggle_involved|E], [struggle_interloper|E], hay [struggle_uninvolved|E].\n\nCác [counties|E] trong một $game_concept_struggle_region$ thường chịu các [county_modifiers|E] khác nhau tùy thuộc vào [struggle_phase_phase] hiện tại."

  game_concept_struggle_conquest:1 "Đụng Độ Xung Đột"
  game_concept_struggle_conquest_conquest:1 "Đụng Độ"
  game_concept_struggle_conquest_conquests:0 "Các Cuộc Đụng Độ"
  game_concept_struggle_conquest_desc:2 "Không hiếm khi các [rulers|E] tham gia một [struggle|E] vướng vào tranh chấp biên giới và những cuộc xung đột nhỏ lẻ, thay đổi tùy theo bản chất của [struggle_phase|E] hiện tại. Sự tồn tại sẵn có của các tranh chấp địa phương quy mô nhỏ cho phép $game_concept_rulers$ tiến hành những cuộc chiếm đất quy mô nhỏ, chinh phục hoặc biến mục tiêu của họ thành chư hầu.\n\nVì $game_concept_struggle_conquest_conquests$ phụ thuộc vào môi trường của $game_concept_struggle$ mà chúng thuộc về, chi phí [prestige|E] của chúng sẽ thay đổi theo $game_concept_struggle_phase$ hiện tại."

  game_concept_struggle_phase_iberia_opportunity:1 "Giai Đoạn Cơ Hội"
  game_concept_struggle_phase_iberia_opportunity_desc:2 "Sau một thời gian dài chung sống tương đối hòa bình trong [struggle_phase_iberia_conciliation|E], sự tự mãn bắt đầu xuất hiện. Cả nông dân lẫn quý tộc đều cảm thấy mọi thứ đơn giản là #EMP vận hành tốt#!, cho phép những [characters|E] khôn ngoan hơn lợi dụng sự ngây thơ của họ.\n\nCuối cùng, những sự lạm dụng mới sẽ либо khiến tình hình leo thang thành [struggle_phase_iberia_hostility|E], hoặc những toan tính chính trị khéo léo sẽ đạt được một thế cân bằng mong manh thông qua [struggle_phase_iberia_conciliation|E]."

  game_concept_struggle_phase_iberia_hostility:1 "Giai Đoạn Thù Địch"
  game_concept_struggle_phase_iberia_hostility_desc:2 "Căng thẳng bùng phát và sự giận dữ gia tăng trong $game_concept_struggle_phase_phase$ này. Những hành động ác ý lặp đi lặp lại và các hiểu lầm leo thang trong [struggle_phase_iberia_opportunity|E] đã dẫn đến sự gia tăng thù hận đối với các [characters|E] có [cultures|E], [faiths|E] khác biệt, hoặc #EMP tệ hơn#!: cả hai.\n\nTuy nhiên, sự đổ máu như vậy không thể kéo dài mãi. Cuối cùng, либо những cái đầu lạnh hơn либо sự kiệt quệ đơn thuần sẽ đưa bán đảo đến [struggle_phase_iberia_compromise|E]."

  game_concept_struggle_phase_iberia_compromise:1 "Giai Đoạn Thỏa Hiệp"
  game_concept_struggle_phase_iberia_compromise_desc:2 "Dù là do chán ghét những xung đột của [struggle_phase_iberia_hostility|E] hay do sự leo thang khéo léo trong [struggle_phase_iberia_conciliation|E], $game_concept_struggle_phase_iberia_compromise$ đại diện cho sự thích nghi ngày càng tăng giữa các dân tộc Iberia. Những khác biệt dần bị gạt sang một bên và lịch sử cùng di sản chung gắn kết những kẻ thù cũ lại với nhau.\n\nBán đảo đứng trước một ngã rẽ: nếu các xung đột tái xuất hiện, thì [struggle_phase_iberia_opportunity|E] đang chờ đợi."

  game_concept_struggle_phase_iberia_conciliation:1 "Giai Đoạn Hòa Giải"
  game_concept_struggle_phase_iberia_conciliation_desc:1 "Là kết quả của một [struggle_phase_iberia_compromise|E] đáng chú ý, trong $game_concept_struggle_phase_phase$ này, quan hệ giữa các dân tộc Iberia trở nên thân thiện đến mức những người ngoài cuộc khó có thể hiểu được sự khoan dung của họ. Các [marriages|E] giữa các [faith|E] khác nhau đặc biệt phổ biến.\n\nTuy nhiên điều này không thể kéo dài mãi, và những sự lạm dụng lòng tin cuối cùng sẽ đưa [iberian_struggle|E] quay trở lại [struggle_phase_iberia_compromise|E]."

  game_concept_struggle_involved_faith:0 "Tín Ngưỡng Tham Gia"
  game_concept_struggle_involved_faiths:0 "Các Tín Ngưỡng Tham Gia"
  game_concept_struggle_involved_faith_desc:0 "Một số [faiths|E] đã bắt đầu sẵn ở trạng thái [struggle_involved|E] trong [struggle|E]. Những tín ngưỡng khác có thể trở nên tham gia do hoàn cảnh thay đổi."

  game_concept_struggle_involved_culture:0 "Văn Hóa Tham Gia"
  game_concept_struggle_involved_cultures:0 "Các Văn Hóa Tham Gia"
  game_concept_struggle_involved_culture_desc:0 "Một số [cultures|E] đã bắt đầu sẵn ở trạng thái [struggle_involved|E] trong [struggle|E]. Những nền văn hóa khác có thể trở nên tham gia do hoàn cảnh thay đổi."

  game_concept_dissolution_faction:0 "Phe Giải Thể"
  game_concept_dissolution_factions:0 "Các Phe Giải Thể"
  game_concept_faction_dissolution:0 "Giải Thể"
  game_concept_dissolution_faction_dissolved: "Đã Giải Thể"
  game_concept_dissolution_faction_desc:0 "[dissolution_faction|E] tìm cách phá hủy [realm|E] của [liege|E] của họ. Nếu thành công, tất cả chư hầu trong vương quốc sẽ trở thành [independent|E], và lãnh chúa của họ sẽ mất [primary_title|E]."

 
 game_concept_improve_city_province_decision:0 "$improve_city_province_decision_name$ Quyết Định"
 game_concept_improve_city_province_decision_desc:0 "Một [decision|E] cho phép Ngài tăng số lượng [buildings|E] có thể xây trong một [city_holding|E]."

 game_concept_border_raid:0 "Tập Kích Biên Giới"
 game_concept_border_raids:0 "Các Cuộc Tập Kích Biên Giới"
 game_concept_border_raiding:0 "Tập Kích Biên Giới"
 game_concept_border_raid_desc:3 "Đây là một dạng [war|E] đặc biệt giữa các [struggle_involved|E] [rulers|E] trong [struggle|E] Iberia, trong đó kẻ tấn công nhắm tới việc [siege|E] một [county|E] cụ thể của kẻ địch nằm giáp biên giới [realm|E] của họ.\n\n[war_leader|E] sẽ nhận được [gold|E] khi chiếm được [war_target|E], nơi sẽ mất [development|E] và [control|E]. Các [buildings|E] cũng có thể bị phá hủy để thu thêm [gold|E], với khả năng tăng theo [development|E] và quy mô [army|E] đang [siege|E].\n\nKẻ tấn công sẽ nhanh chóng nhận được [war_score|E] khi [occupying|E] [war_target|E]."

 game_concept_bargain_fealty:0 "Thương Lượng Thần Phục"
 game_concept_bargained_fealty:0 "Đã Thương Lượng Thần Phục"
 game_concept_bargain_fealty_desc:3 "Đây là một [interaction|E] đặc biệt dành cho các [struggle_involved|E] [rulers|E] đang tham gia một [war|E] phòng thủ.\n\n[war_leader|E] có thể yêu cầu một [ruler|E] láng giềng  có [rank|E] cao hơn tham gia cuộc chiến của họ để đổi lấy việc trở thành [vassal|E] của người đó."

 game_concept_contract_assistance:0 "Hỗ Trợ Quân Sự"
 game_concept_contract_assisting: "Đang Hỗ Trợ Quân Sự"
 game_concept_contract_assistance_desc:2 "Đây là một loại [interaction|E] đặc biệt dành cho các [struggle_involved|E] [rulers|E] trong [struggle|E] Iberia, cho phép họ tham gia các [wars|E] của [rulerpossessive|E] [struggle_involved|E] khác để đổi lấy [gold|E].\n\nKhoản thanh toán được thực hiện khi [war|E] kết thúc, bất kể kết quả ra sao, miễn là người nhận hợp đồng đã đóng góp ít nhất 100 [war_contribution|E]."
 
 game_concept_iberian_reclamation:0 "Tái Chiếm Iberia"
 game_concept_iberian_reclaiming:0 "Đang Tái Chiếm Iberia"
 game_concept_iberian_reclamations:0 "Các Cuộc Tái Chiếm Iberia"
 game_concept_iberian_reclamation_desc:2 "Đây là một loại [war|E] đặc biệt dành cho các [struggle_involved|E] [rulers|E] trong [iberian_struggle|E].\n\nKẻ tấn công nhắm tới việc chinh phục một [duchy|E] có chứa các [counties|E] [struggle_involved|E] do một [ruler|E] [struggle_interloper|E] hoặc [struggle_uninvolved|E] nắm giữ, hoặc [vassalize|E] họ nếu họ không sở hữu lãnh thổ nào bên ngoài Công quốc đó."

 game_concept_enforce_truce:0 "Áp Đặt Đình Chiến"
 game_concept_enforced_truce:0 "Đã Áp Đặt Đình Chiến"
 game_concept_enforce_truce_desc:2 "Đây là một loại [interaction|E] đặc biệt dành cho các [struggle_involved|E] [rulers|E] nhằm kết thúc một [war|E] bằng [white_peace|E] và thiết lập [truces|E].\n\nChỉ có thể sử dụng để kết thúc các cuộc chiến giữa những [struggle_involved|E] [rulers|E] khác có [rank|E] thấp hơn, trong đó ít nhất một bên là [independent|E] hoặc thuộc cùng một [realm|E]."

 game_concept_incite_revolts_interaction:1 "Kích Động Nổi Loạn"
 game_concept_incite_revolts_interaction_desc:1 "Cho phép đầu tư [gold_i][gold|E] để kích động [peasant_faction|E] trong một [realm|E] khác, nếu họ có các [counties|E] với [county_opinion|E] âm."

 game_concept_secure_iberian_foothold_decision:0 "$secure_iberian_foothold_decision_title$"
