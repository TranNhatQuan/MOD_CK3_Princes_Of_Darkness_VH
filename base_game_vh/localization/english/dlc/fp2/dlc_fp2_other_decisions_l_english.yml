  found_kingdom_toledo_decision_title:0 "Thành lập Vương quốc Toledo"
  found_kingdom_toledo_decision_desc:0 "Kể từ khi vương quốc Visigoth sụp đổ trước người Moor, [GetTitleByKey('c_toledo').GetNameNoTier] đã bị suy giảm vị thế. Với tư cách là thủ đô của một vương quốc [ROOT.Char.GetFaith.GetAdjective] mới, nơi đây sẽ một lần nữa trở thành ngai vàng của các vị vua."
  found_kingdom_toledo_decision_confirm:0 "Toledo là trái tim của Iberia!"
  found_kingdom_toledo_decision_tooltip:0 "Thành lập một [kingdom|E] [GetFaithByKey('mozarabic_church').GetAdjective] mới đặt tại [GetTitleByKey('k_toledo').GetNameNoTier]"
  found_kingdom_toledo_culture_tt:0 "[culture|E] của Ngài có [heritage|E] Iberia"
  found_kingdom_toledo_faith_tt:0 "[faith|E] của Ngài là [GetFaithByKey('mozarabic_church').GetName], hoặc được tạo ra từ nó"
  found_kingdom_toledo_duchy_tt:0 "Ngài [hold|E] và [completely_control|E] bất kỳ [duchy|E] nào [de_jure|E] giáp với [GetTitleByKey('d_toledo').GetName], và thuộc về một [kingdom|E] có hơn hai [duchies|E] [de_jure]"
  found_kingdom_toledo_capital_tt:0 "[GetTitleByKey('c_toledo').GetNameNoTier] là [realm_capital|E] của Ngài"

  fp2_other_decisions.1100.t:0 "Vương quốc Toledo"
  fp2_other_decisions.1100.desc:0 "Với sức mạnh vị thế của ta giờ đây không còn nghi ngờ gì nữa, lễ đăng quang tại [GetTitleByKey('c_toledo').GetNameNoTier] cuối cùng cũng đã diễn ra đúng như kế hoạch.\n\nĐã đến lúc chúng ta, những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural], tạo nên lãnh địa của riêng mình, khác biệt với các taifa nhỏ bé và các vương quốc phương bắc; một vương quốc sánh ngang với vương quốc Visigoth xưa!"
  fp2_other_decisions.1100.a:0 "Mong vương quốc của chúng ta thịnh vượng lâu dài."

  fp2_other_decisions.1101.desc:0 "Từ thắng lợi này đến thắng lợi khác, [toledo_former.GetTitledFirstName] đã để bản thân được chính thức lên ngôi tại [GetTitleByKey('c_toledo').GetNameNoTier].\n\nSức mạnh của vương quốc [toledo_former.GetFaith.GetAdjective] mới này, kết hợp các vùng đất của những lãnh địa cũ của Iberia, hiện không còn gì phải nghi ngờ.\n\n"
  fp2_other_decisions.1101.stolen:1 "Những kẻ ngạo mạn đáng ghét này sớm muộn cũng phải bị xử lý!"
  fp2_other_decisions.1101.mozarab:0 "Dù điều này có lợi cho đức tin của chúng ta, nhưng nó cũng có thể là con dao hai lưỡi..."
  fp2_other_decisions.1101.a:0 "Chúng sẽ không tồn tại lâu đâu!"
  fp2_other_decisions.1101.b:0 "Cần phải theo dõi chuyện này."
  fp2_other_decisions.1101.c:0 "Thật thú vị."

  fp2_form_kingdom_toledo_modifier:0 "$fp2_other_decisions.1100.t$"
  fp2_form_kingdom_toledo_modifier_desc:0 "Nhân vật này đã thành lập một vương quốc mới lấy trung tâm tại thủ đô Visigoth cổ xưa."
