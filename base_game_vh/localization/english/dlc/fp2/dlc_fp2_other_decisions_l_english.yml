l_english:
  improve_city_province_decision:1 "$improve_city_province_decision_name$"
  improve_city_province_decision_name:0 "Mở rộng Thành phố"
  improve_city_province_decision_desc:1 "Chi tiền xây dựng những khu phố mới xa hoa trong thành phố của Ngài"
  improve_city_province_decision_confirm:0 "Bắt đầu mở rộng"
  improve_city_province_decision_tooltip:0 "Đầu tư tiền để nhận thêm các ô [building|E] mới trong [cities|E] của Ngài"
  improve_city_province_decision_decision_no_effect:1 "Không có [city|E] nào đủ điều kiện"
  improve_city_province_decision_at_least_one_city_tt:0 "Ít nhất một thành phố có dưới 5 ô công trình"

  fp2_secure_mediterranean.t:0 "Bảo vệ Địa Trung Hải"
  fp2_secure_mediterranean.desc:0 "Khi các hòn đảo then chốt khắp Địa Trung Hải đã được kiểm soát và đóng vai trò như những tháp canh của biển cả, đã đến lúc chúng ta tuyên bố quyền sở hữu đối với những làn sóng."
  fp2_secure_mediterranean.tip:0 "Tuyên bố quyền sở hữu Địa Trung Hải"

  secure_iberian_foothold_decision_title:0 "Bàn đạp Iberia"
  secure_iberian_foothold_decision_desc:0 "Những quốc gia đang suy yếu vì chiến tranh ở Iberia đã mở cánh cửa bán đảo cho kẻ ngoài cuộc. Nếu ai đó có thể tự xưng là lãnh đạo [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] mới của khu vực, hoặc đơn giản là một kẻ xâm lược vinh quang, thì có thể đạt được rất nhiều."
  secure_iberian_foothold_decision_tooltip:0 "Sáp nhập một phần Iberia"
  secure_iberian_foothold_decision_confirm:0 "Kẻ mạnh nhất sẽ thắng."
  fp2_struggle_uninvolved_or_external_tt:0 "[capital|E] của Ngài nằm ngoài [region|E] [GetGeographicalRegion('world_europe_west_iberia').GetName]"
  fp2_struggle_secure_iberian_foothold_empire_tt:0 "Ngài [hold|E] một [title|E] [empire|E] không phải là [GetTitleByKey('e_spain').GetNameNoTier]"

  fp2_struggle_phase_hostility_or_opportunity_tt:1 "[struggle_phase|E] Iberia đang là [struggle_phase_iberia_hostility|E] hoặc [struggle_phase_iberia_opportunity|E] (Hiện tại: [GetStruggle('iberian_struggle').GetCurrentPhase.GetName])"
  fp2_struggle_secure_iberian_foothold_kingdom_iberian_tt: "Ngài [hold|E] và [completely_control|E] một [kingdom|E] [de_jure|E] trong [GetTitleByKey('e_spain').GetNameNoTier]"

  fp2_struggle_secure_iberian_foothold_kingdom_faith_tt:0 "Ít nhất #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_faith_target_percent_value')|0]%#! [counties|E] [de_jure|E] của [titlepossessive|E] này là [THIS.Char.GetFaith.GetAdjective]"
  fp2_struggle_secure_iberian_foothold_kingdom_border_tt: "Danh hiệu [title|E] này giáp với một [kingdom|E] [de_jure|E] mà Ngài [hold|E] trong một [empire|E] Ngài sở hữu và không phải [GetTitleByKey('e_spain').GetNameNoTier]"
  fp2_struggle_secure_iberian_foothold_kingdom_held_tt:0 "Ngài đã nắm giữ [title|E] này ít nhất [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_years_value')|0Z] năm"

  fp2_struggle_secure_iberian_foothold_religion_tt:0 "Ngài [hold|E] ít nhất #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_target_percent_value')|0]%#! [counties|E] theo [faith|E] [THIS.Char.GetFaith.GetReligion.GetAdjective] trong [region|E] [GetGeographicalRegion('world_europe_west_iberia').GetName] (Hiện tại: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_religion_percent_value')|1]%)\n"
  fp2_struggle_secure_iberian_foothold_outsider_tt:0 "Ngài [hold|E] ít nhất #Z [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_target_percent_value')|0]%#! [counties|E] trong [region|E] [GetGeographicalRegion('world_europe_west_iberia').GetName] (Hiện tại: [SCOPE.ScriptValue('fp2_struggle_secure_iberian_foothold_outsider_percent_value')|0]%)\n"

  fp2_struggle_secure_iberian_foothold_empire_held_effect_tt: "Mỗi [kingdom|E] [de_jure|E] của [GetTitleByKey('e_spain').GetNameNoTier] thỏa mãn các điều kiện dưới đây sẽ trở thành một phần [de_jure|E] của [THIS.Char.GetPrimaryTitle.GetNameNoTier]"
  fp2_struggle_secure_iberian_foothold_empire_dejure_effect_tt:0 "Mỗi [kingdom|E] [de_jure|E] của [GetTitleByKey('e_spain').GetNameNoTier] thỏa mãn các điều kiện dưới đây sẽ trở thành một phần [de_jure|E] của [empire|E] [THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier]"

  fp2_struggle_secure_iberian_foothold_ends_the_struggle_tt:0 "[iberian_struggle|E] kết thúc"

  iberian_footholder_transfer_tt:0 "[THIS] [THIS.Title.GetName] [THIS.GetName]"

  fp2_other_decisions.1000.t:0 "$secure_iberian_foothold_decision_title$: Sự Củng Cố của [iberian_footholder.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  fp2_other_decisions.1000.involved_religion:0 "Những cuộc chiến giữa các tiểu quốc Iberia gần như đã quật ngã các vương quốc [ROOT.Char.GetFaith.GetReligion.GetAdjective] trong khu vực.\n\nNếu không có sự can thiệp của chúng ta, những tín đồ của [ROOT.Char.GetFaith.HighGodNamePossessive] cuối cùng đã bị những kẻ ngoại đạo kiêu ngạo đẩy khỏi bán đảo.\n\n"
  fp2_other_decisions.1000.desc:0 "Các tôn giáo và dân tộc chia rẽ của Iberia đã trao cho chúng ta một cơ hội lớn, quá bận chiến đấu lẫn nhau để chống lại cuộc xâm lược [ROOT.Char.GetFaith.GetReligion.GetAdjective] vào bán đảo."
  fp2_other_decisions.1000.involved_faith:0 "Chúng ta là những người bảo vệ hợp pháp của các [ROOT.Char.GetFaith.GetAdherentNamePlural] phương tây, giờ đây an toàn dưới sự bảo hộ của [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
  fp2_other_decisions.1000.uninvolved_faith:0 "Chúng ta có nhiệm vụ mang ánh sáng của [ROOT.Char.GetFaith.GetName]; với tư cách là một phần của [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], những vùng đất này sẽ lại thịnh vượng và yên bình."
  fp2_other_decisions.1000.closing:0 "\n\nTheo thời gian họ sẽ thấy rằng thời đại của những vị thần giả của họ đã kết thúc, và vui mừng khi [ROOT.Char.GetFaith.HighGodName] đã dẫn dắt [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] đến sự cứu rỗi của vùng đất này."
  fp2_other_decisions.1000.a:0 "Iberia cần dòng máu mới."

  fp2_other_decisions.1001.involved_religion:0 "Sau nhiều thế kỷ chiến tranh giữa người Kitô giáo Iberia và người Moor, cuộc đấu tranh của chúng ta giờ đã bị những kẻ xâm nhập [iberian_footholder.GetPrimaryTitle.GetAdjective] lợi dụng.\n\n"
  fp2_other_decisions.1001.desc:0 "Do sự lơ là, đố kỵ và bất cẩn, chúng ta người Iberia đã để cho những kẻ xâm nhập [iberian_footholder.GetPrimaryTitle.GetAdjective] lợi dụng sự chia rẽ của quê hương và xâm chiếm các vương quốc lịch sử của bán đảo."
  fp2_other_decisions.1001.involved_faith:0 "[iberian_footholder.GetTitledFirstName] đã tuyên bố [iberian_footholder.GetHerselfHimself] là nhà lãnh đạo [iberian_footholder.GetFaith.GetAdjectiveNoTooltip] hợp pháp của bán đảo, sử dụng những chiến thắng của [iberian_footholder.GetHerHis] làm bằng chứng cho tính chính danh của [iberian_footholder.GetHerHis] trên các vương quốc [iberian_footholder.GetFaith.GetReligion.GetAdjective] đang suy yếu của Iberia."
  fp2_other_decisions.1001.same_uninvolved_faith:0 "Họ cho rằng thất bại của chúng ta là hình phạt của [ROOT.Char.GetFaith.HighGodNamePossessive] vì đã rời xa con đường chính nghĩa của [iberian_footholder.GetFaith.GetName], và rằng [iberian_footholder.GetTitledFirstName] là lãnh đạo hợp pháp của Iberia [ROOT.Char.GetFaith.GetReligion.GetAdjective]..."
  fp2_other_decisions.1001.uninvolved_faith:0 "Với những chiến thắng của [iberian_footholder.GetHerHis] làm bằng chứng, [iberian_footholder.GetTitledFirstName] đã tuyên bố đức tin [iberian_footholder.GetFaith.GetAdjective] của mình là con đường [iberian_footholder.GetFaith.GetReligion.GetAdjective] chân chính; một con đường sẽ thống nhất toàn bộ bán đảo dưới [iberian_footholder.GetFaith.HighGodName]."
  fp2_other_decisions.1001.closing:0 "\n\nKhi [iberian_footholder.GetTitledFirstName] củng cố các vùng đất của mình, những khác biệt trong quá khứ giữa người Hồi giáo và Kitô giáo dường như trở nên nhạt nhòa so với cuộc chiếm đóng [iberian_footholder.GetFaith.GetAdjective] này..."
  fp2_other_decisions.1001.a:0 "Lũ xâm nhập đáng nguyền rủa."

 ### Council of Toledo Decision
  council_of_toledo_decision_title:0 "Triệu tập Công đồng Toledo"
  council_of_toledo_decision_desc_count:0 "Sẽ đến lúc triệu tập Công đồng Toledo lần thứ [SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] tại [GetTitleByKey('c_toledo').GetNameNoTier], và một lần nữa giải quyết các vấn đề tôn giáo của những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural]."
  council_of_toledo_decision_desc:0 "Trong nhiều thế kỷ, các công đồng tôn giáo đã được tổ chức tại [GetTitleByKey('c_toledo').GetNameNoTier], nơi giáo sĩ từ khắp Kitô giáo giải quyết những tranh chấp của thời đại. Bằng cách tổ chức công đồng lần thứ 19, truyền thống Visigoth này có thể được khôi phục."
  council_of_toledo_decision_tooltip:0 "Tổ chức một cuộc tụ họp của các giáo sĩ [ROOT.Char.GetFaith.GetReligion.GetAdjective] tại Toledo"
  council_of_toledo_decision_confirm:0 "Đã đến lúc."
  council_of_toledo_decision_toledo_holder_trigger:0 "Ngài [hold|E] hoặc cai trị [GetTitleByKey('c_toledo').GetName], và [ruler|E] của nó theo [THIS.Char.GetFaith.GetName]"
  council_of_toledo_decision_toledo_faith_trigger:0 "[faith|E] là [THIS.Char.GetLiege.GetFaith.GetName]"
  council_of_toledo_decision_catalyst_tt:0 "Một [struggle_catalyst|E] có thể xảy ra"
  council_of_toledo_decision_tt:0 "Phần thưởng phụ thuộc vào kết quả của Công đồng"
 # Event - Organization
  fp2_other_decisions.0700.council:0 "Công đồng Toledo lần thứ [SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')]"
  fp2_other_decisions.0700.t:0 "$fp2_other_decisions.0700.council$: Tổ chức"
  fp2_other_decisions.0700.19:0 "[council_priest.GetTitledFirstName] đã bắt đầu sắp xếp cho công đồng tôn giáo lần thứ mười chín tại [GetTitleByKey('c_toledo').GetNameNoTier], nhằm tái hiện các thượng hội đồng Visigoth cổ xưa.\n\nTrong khi ảnh hưởng của [GetTitleByKey('k_papal_state').GetDefinitiveName] đã gia tăng kể từ cuộc xâm lược của người Moor, giáo sĩ của chúng ta vẫn giữ truyền thống và quyền tự chủ riêng. Đã đến lúc khẳng định lại tầm quan trọng của Iberia như một nơi đối thoại tôn giáo.\n\nCác cuộc họp trước đây có sự tham dự của các [ROOT.Char.GetFaith.BishopNeuterPlural] từ khắp Kitô giáo, nhưng điều đó giờ đây không nhất thiết phải như vậy..."
  fp2_other_decisions.0700.desc:0 "Các [ROOT.Char.GetFaith.BishopNeuterPlural] của Iberia đã háo hức chờ đợi công đồng tiếp theo kể từ khi truyền thống Toledo được khôi phục.\n\n[council_priest.GetCouncilTitleFirstName] đã bắt đầu chuẩn bị, dù vẫn chưa quyết định liệu các linh mục từ những truyền thống khác có được mời tham dự hay không."
  fp2_other_decisions.0700.a:0 "Đây sẽ là một thượng hội đồng Mozarab."
  fp2_other_decisions.0700.b:0 "Mọi người phụng sự của [ROOT.Char.GetFaith.HighGodNamePossessive] đều được chào đón tại Toledo."
  fp2_other_decisions.0700.b.success:0 "Các giám mục đại kết tham dự"
  fp2_other_decisions.0700.b.failure:0 "Lời kêu gọi đến Toledo bị phớt lờ"
  fp2_other_decisions.0700.tt:0 "Công đồng Toledo lần thứ [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] sẽ bắt đầu trong vài tuần nữa"
 # Event - Arrival
  fp2_other_decisions.0701.t:0 "$fp2_other_decisions.0700.council$: Người tham dự"
  fp2_other_decisions.0701.opening.success:0 "Có vẻ như lời mời gửi đến các [ROOT.Char.GetFaith.AltPriestTermPlural] [ROOT.Char.GetFaith.GetReligion.GetAdjective] rộng rãi hơn đã được đón nhận tích cực; nhiều [ROOT.Char.GetFaith.BishopNeuterPlural] đáng kính từ các vùng đất xa xôi đã háo hức đổ về [GetTitleByKey('c_toledo').GetNameNoTier]."
  fp2_other_decisions.0701.opening.failure:0 "Phản hồi đối với lời mời của chúng ta tới cộng đồng đại kết khá lạnh nhạt; nhiều [ROOT.Char.GetFaith.BishopNeuterPlural] viện cớ thời tiết xấu khiến họ không thể đến [GetTitleByKey('c_toledo').GetNameNoTier], chỉ còn lại các giáo sĩ địa phương tham dự...."
  fp2_other_decisions.0701.opening.catastrophe:0 "Chúng ta không thấy một giám mục, phó tế hay viện phụ nào từ các giáo phái [ROOT.Char.GetFaith.GetReligion.GetAdjective] khác tại [GetTitleByKey('c_toledo').GetNameNoTier]; có vẻ công đồng của chúng ta bị cộng đồng đại kết khinh thường hoặc phẫn nộ, và chỉ có các giáo sĩ địa phương tham dự."
  fp2_other_decisions.0701.opening:0 "Những nhân vật quan trọng và đáng kính đã tụ hội tại [GetTitleByKey('c_toledo').GetNameNoTier], đại diện cho mọi giáo phận và tu viện của những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural]."
  fp2_other_decisions.0701.religious_head_bishop:0 "\n\nTrong số các giáo sĩ có mặt có [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], người đứng đầu Giáo hội [portrait_bishop.GetFaith.GetAdjective]."
  fp2_other_decisions.0701.powerful_bishop:0 "\n\nCó lẽ nổi bật nhất trong số họ là [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], một giáo sĩ [portrait_bishop.GetFaith.GetAdjective] có ảnh hưởng lớn."
  fp2_other_decisions.0701.saint_bishop:0 "\n\nNhững người tham dự thật may mắn khi có [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], một vị thánh [portrait_bishop.GetFaith.GetAdjective]!"
  fp2_other_decisions.0701.theologian_bishop:0 "\n\nĐáng chú ý trong số họ là [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], một nhà thần học [portrait_bishop.GetFaith.GetAdjective] được kính trọng rộng rãi."
  fp2_other_decisions.0701.bad_bishop:0 "\n\nMột trong những người nổi tiếng nhất là [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], kẻ vô đạo của ông ta là trò cười khắp Kitô giáo."
  fp2_other_decisions.0701.senior_bishop:0 "\n\nNgười cao niên nhất trong các giáo sĩ là [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], một [portrait_bishop.GetWomanMan] đáng kính của giáo hội. "
  fp2_other_decisions.0701.failure:0 "\n\nCác thương nhân của thành phố có tường thành thất vọng trước số người tham dự ít ỏi, khi họ đã chuẩn bị cho sự ghé thăm của rất nhiều giáo sĩ. Thật đáng tiếc."
  fp2_other_decisions.0701.desc:0 "\n\nThành phố có tường thành đã bắt đầu hưởng lợi từ các giáo sĩ ghé thăm, khi hoạt động thương mại và lòng hiếu khách được các thương nhân mong đợi."
  fp2_other_decisions.0701.a:0 "Tuyệt vời."
  fp2_other_decisions.0701.b:0 "Kiêu ngạo rồi sẽ..."
  fp2_other_decisions.0701.c:0 "Tốt."
  fp2_other_decisions.0701.tt:0 "Công đồng Toledo lần thứ [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] bắt đầu"
 # Event - Debate
  fp2_other_decisions.0702.t:0 "$fp2_other_decisions.0700.council$: Tranh luận"
  fp2_other_decisions.0702.19:0 "Nhiều thế kỷ sau công đồng cuối cùng của Tổng giám mục Gunderic dưới triều vua Wittiza, [council_priest.GetCouncilTitleFirstName] đã khôi phục truyền thống của chúng ta bằng cách khai mạc cuộc họp lần thứ mười chín tại [GetTitleByKey('c_toledo').GetNameNoTier] lừng danh.\n\n"
  fp2_other_decisions.0702.opening:0 "Một công đồng khác đã bắt đầu tại [GetTitleByKey('c_toledo').GetNameNoTier], lần này do [council_priest.GetCouncilTitleFirstName] chủ trì.\n\n"
  fp2_other_decisions.0702.present:0 "\n\nĐến cuối tuần, nhanh chóng rõ ràng rằng [debate_bishop.GetTitledFirstName] của [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] đã chiếm được sự chú ý của cả hội trường về vấn đề này, $fp2_other_decisions.0702.closing$"
  fp2_other_decisions.0702.second_hand:0 "\n\nKhi các cuộc thảo luận đi đến hồi kết, rõ ràng rằng [debate_bishop.GetTitledFirstName] của [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] được xem là người dẫn đầu quan điểm này, $fp2_other_decisions.0702.closing$"
  fp2_other_decisions.0702.conversion:0 "Một chủ đề xuyên suốt nhanh chóng xuất hiện rằng việc cải đạo những kẻ dị giáo và ngoại đạo là con đường duy nhất để đảm bảo hòa bình và bảo vệ những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural]."
  fp2_other_decisions.0702.reform:0 "Chủ đề chính là những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural] không nên sợ những cải cách lớn, giờ đây khi vị thế của Giáo hội Iberia đã vững chắc."
  fp2_other_decisions.0702.tolerance:0 "Chủ đề chi phối là những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural] nên khoan dung hơn với những ngoại đạo ôn hòa, một ý tưởng nhanh chóng trở thành trọng tâm của các cuộc thảo luận."
  fp2_other_decisions.0702.rights:0 "Chủ đề chính là mối quan tâm về việc bảo vệ các quyền cổ xưa của giáo sĩ [ROOT.Char.GetFaith.GetAdjective], cũng như sửa chữa các nhà thờ."
  fp2_other_decisions.0702.hof:0 "Đáng ngạc nhiên, nhiều giám mục cho rằng những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural] cần có một lãnh đạo tinh thần riêng."
  fp2_other_decisions.0702.pope:0 "Bầu không khí hợp tác lan tỏa, khi nhiều giám mục kêu gọi tăng cường hợp tác giữa những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural] và các anh em đại kết của họ."
  fp2_other_decisions.0702.heresy:0 "Một sự khẩn trương bao trùm các cuộc thảo luận, khi mối đe dọa từ [heretic_faith.GetAdherentNamePlural], những kẻ dị giáo như Priscillian và Arius trong quá khứ, được đưa ra bàn luận."
  fp2_other_decisions.0702.closing:0 "trong khi [counter_bishop.GetTitledFirstName|U] của [counter_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] phản đối mạnh mẽ nhất các lập luận của [debate_bishop.GetHerHis]."
  fp2_other_decisions.0702.a:0 "Ta hoàn toàn đồng ý."
  fp2_other_decisions.0702.b.hof:0 "Đó không phải ý muốn của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  fp2_other_decisions.0702.b:0 "[debate_bishop.GetSheHe|U] sẽ bị la ó phản đối."
  council_of_toledo_ruler_effect_tt:0 "Mọi [ruler|E] theo đức tin [council_toledo_faith.GetAdjective]"
 # Event - Invalidated
  fp2_other_decisions.0703.t:0 "$fp2_other_decisions.0700.council$: Hoãn lại"
  fp2_other_decisions.0703.war:0 "Với sự bùng nổ của chiến tranh, [council_priest.GetCouncilTitleFirstName] đã tạm hoãn Công đồng Toledo sắp tới."
  fp2_other_decisions.0703.control:0 "Do mất quyền kiểm soát [GetTitleByKey('c_toledo').GetNameNoTier], việc tổ chức Công đồng Toledo sắp tới không còn khả thi..."
  fp2_other_decisions.0703.desc:0 "\n\nNhững người theo [ROOT.Char.GetFaith.GetAdherentNamePlural] chắc chắn sẽ sớm vượt qua trở ngại này..."
  fp2_other_decisions.0703.a:0 "Thật đáng thất vọng."
 # Event - Ping
  fp2_other_decisions.0704.t:0 "$fp2_other_decisions.0700.council$"
  fp2_other_decisions.0704.success:0 "\n\nVới sự ủng hộ của [council_toledo_host.GetTitledFirstNamePossessive], giáo sĩ của những người theo [ROOT.Char.GetFaith.GetAdherentNamePlural] đã cất lên tiếng nói của mình."
  fp2_other_decisions.0704.failure:0 "Tuy nhiên có vẻ [council_toledo_host.GetTitledFirstName] lại có ý định khác, và đã tích cực vận động chống lại những đề xuất này."
  fp2_other_decisions.0704.a:0 "Thú vị."
 # Custom Loc
