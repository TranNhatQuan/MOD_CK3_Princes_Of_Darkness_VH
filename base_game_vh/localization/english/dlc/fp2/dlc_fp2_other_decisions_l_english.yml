 # Tooltips
  fp2_council_culture_tt:0 "Các [culture|E] Iberia nhận được #positive_value [SCOPE.ScriptValue('council_toledo_culture_acceptance_value')|0]#! [cultural_acceptance|E] đối với văn hóa [THIS.Char.GetCulture.GetName]"
  fp2_council_opinion_mozarabic_effect_tt:0 "Mọi người tham dự Mozarab"
  fp2_council_opinion_other_effect_tt:0 "Mọi người tham dự không phải Mozarab"
  fp2_council_conversion_modifier_tt:0 "Chuyển đổi Đức tin tại Quận sẽ tiến triển nhanh hơn đối với các [religions|E] khác khi modifier này còn hiệu lực"
  fp2_council_heresies_modifier_tt:0 "Chuyển đổi Đức tin tại Quận sẽ tiến triển nhanh hơn đối với các [faiths|E] cùng [religion|E] có [head_of_faith|E] khi modifier này còn hiệu lực"
  excluded_from_council_toledo_tt:0 "Mọi [head_of_faith|E] khác của tôn giáo [THIS.Char.GetFaith.GetReligion.GetAdjective] trong [diplomatic_range|E]"
  fp2_council_end_tt:0 "Công đồng Toledo lần thứ [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] kết thúc"
 # Modifiers
  fp2_small_council_modifier:0 "Công đồng Toledo"
  fp2_small_council_modifier_desc:0 "Một công đồng địa phương của các giáo sĩ đã được tổ chức tại Toledo, mang lại sự thịnh vượng cho thị trấn."
  fp2_big_council_modifier:0 "$fp2_small_council_modifier$"
  fp2_big_council_modifier_desc:0 "Một công đồng lớn của các giáo sĩ đã được tổ chức tại Toledo, mang lại sự thịnh vượng lớn cho thị trấn."
  fp2_disappointing_council_modifier:0 "$fp2_small_council_modifier$"
  fp2_disappointing_council_modifier_desc:0 "Một công đồng giáo sĩ với số người tham dự đáng thất vọng đã được tổ chức tại Toledo, khiến các thương nhân của thị trấn chịu thiệt hại."
  fp2_stifled_council_modifier:0 "Công đồng bị bóp nghẹt"
  fp2_stifled_council_modifier_desc:0 "Phản đối một công đồng tôn giáo đã khiến nhân vật này trở nên không được lòng giới giáo sĩ."
  fp2_council_conversion_modifier:0 "Công đồng Cải đạo"
  fp2_council_conversion_modifier_desc:0 "Công đồng Toledo gần đây đã khuyến khích việc cải đạo những kẻ ngoại đạo trong các vương quốc Mozarab."
  fp2_council_tolerance_modifier:0 "Công đồng Khoan dung"
  fp2_council_tolerance_modifier_desc:0 "Công đồng Toledo gần đây đã khuyến khích sự khoan dung giữa các tôn giáo tại Iberia."
  fp2_council_reform_modifier:0 "Công đồng Cải cách"
  fp2_council_reform_modifier_desc:0 "Công đồng Toledo gần đây đã khuyến khích cải cách Giáo hội Mozarab khi quyền lực của nó gia tăng."
  fp2_council_rights_modifier:0 "Công đồng Quyền lợi"
  fp2_council_rights_modifier_desc:0 "Công đồng Toledo gần đây đã khuyến khích bảo vệ quyền của giáo sĩ và sửa chữa các nhà thờ."
  fp2_council_hof_modifier:0 "Công đồng Lãnh đạo"
  fp2_council_hof_modifier_desc:0 "Công đồng Toledo gần đây đã khuyến khích người Mozarab bổ nhiệm lãnh đạo tôn giáo riêng của họ."
  fp2_council_pope_modifier:0 "Công đồng Hợp tác"
  fp2_council_pope_modifier_desc:0 "Công đồng Toledo gần đây đã khuyến khích sự hợp tác giữa người Mozarab và thế giới Kitô giáo rộng lớn hơn."
  fp2_council_heresy_modifier:0 "Công đồng Thẩm tra Dị giáo"
  fp2_council_heresy_modifier_desc:0 "Công đồng Toledo gần đây đã khuyến khích việc tiêu diệt các dị giáo đã xuất hiện tại Iberia."
