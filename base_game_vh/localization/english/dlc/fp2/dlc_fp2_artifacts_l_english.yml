l_english:

##################################################
# Uniques

  fp2_chalice_dona_urraca:0 "Chén Thánh của Doña Urraca"
  fp2_chalice_dona_urraca_desc:0 "Một chén lễ nghi được chạm khắc từ mã não đen sâu thẳm và khảm đầy châu báu cùng hoa văn lưới bằng vàng. Được [owner.GetTitledFirstName] đặt chế tác để tôn vinh Giáo hội."

  fp2_santiago_aquamanile:0 "(Trước đây là) $fp2_santiago_bells$"
 # We have to use |U here so that al-Mansur is presented correctly.
  fp2_santiago_aquamanile_desc:0 "[reforger.GetTitledFirstName|U] đã rèn những bình nước này từ xỉ kim loại nung chảy của $fp2_santiago_bells$. Dù hiện được dùng để thanh tẩy tay của chủ nhân theo nghi lễ, sự tồn tại của chúng vẫn khẳng định sự tối thượng của Hồi giáo trước Kitô giáo."
  fp2_santiago_aquamanile_melted_desc:0 "Bị nung chảy #EMP lần nữa#!, gần đây nhất bởi [reforger.GetTitledFirstName], những chiếc $fp2_santiago_bells$ trước đây giờ trở thành những bình nước gây tranh chấp dữ dội nhất từng tồn tại. Hình dạng hiện tại của chúng tuyên bố sự tối thượng của Hồi giáo tại Iberia."
  fp2_santiago_aquamanile_melted_tally_desc:0 "$fp2_santiago_aquamanile_melted_desc$\n\nKhối kim loại thường xuyên bị tái rèn này đã đổi chủ [ROOT.Var('artefact_santiago_bells').GetValue] lần."

  fp2_santiago_bells:0 "Chuông Santiago"
  fp2_santiago_bells_desc:0 "Những chiếc Chuông lừng danh của Santiago de Compostela là một lời nhắc nhở mạnh mẽ, giản dị, và trên hết là #EMP vang dội#! về quyền uy tâm linh bất biến của Thánh James."
  fp2_santiago_bells_melted_desc:0 "Được giành lại từ tay kẻ ngoại đạo, nung chảy và phục hồi gần giống hình dạng ban đầu bởi [reforger.GetTitledFirstName], những chiếc Chuông lừng danh của Santiago de Compostela lại vang lên để an ủi toàn thể Kitô giáo."
  fp2_santiago_bells_melted_tally_desc:0 "$fp2_santiago_bells_melted_desc$\n\nKhối kim loại thường xuyên bị tái rèn này đã đổi chủ [ROOT.Var('artefact_santiago_bells').GetValue] lần."

##################################################
# Multiples

  fp2_armillary_sphere:0 "Thiên Cầu Vòng"
  fp2_armillary_sphere_desc:0 "Một thiết bị chiêm tinh tinh xảo với tay nghề [SCOPE.Custom('ArtifactQuality')]. Các vòng tròn được chạm khắc từ [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] và khảm [newly_created_artifact.GetFeatureText( 'decoration_material_inlay' )], mô phỏng những quỹ đạo uốn lượn của thiên giới với chi tiết kỳ diệu."

  fp2_2p_chess_board:0 "Bàn Cờ May Mắn"
  fp2_2p_chess_board_desc:0 "Đóng vai trò quan trọng trong chiến thắng vang dội trước [bg_loser.GetTitledFirstName], công cụ giải trí này lần đầu mang vận may đặc biệt của nó đến cho [bg_victor.GetTitledFirstName]."

  fp2_4p_chess_board:0 "Bàn Cờ Bốn Người"
  fp2_4p_chess_board_desc:0 "Khi [bg_victor.GetTitledFirstName] đánh bại [bg_loser.GetTitledFirstName] tại trò cờ vua, suy nghĩ đầu tiên của [bg_victor.GetHerHis] là kỷ niệm tài nghệ chơi game của [bg_victor.GetHerHis] bằng cách nghĩ ra một biến thể cải tiến đặc biệt đến mức [bg_victor.GetSheHe] không bao giờ có thể bắt ai chơi cùng."

  fp2_votive_crowns:0 "Vương Miện Dâng Tế Visigoth"
  fp2_votive_crowns_desc:0 "Được thiết kế để treo phía trên hoặc quanh bàn thờ nhà thờ, đôi khi trên tượng thánh, việc dâng một vương miện hiến tế cho Chúa là cách thể hiện sự quy phục trước một quyền lực cao hơn bất kỳ vị vua trần thế nào."

  fp2_andalusian_aquamanile:0 "Bình Rửa Tay Nghi Lễ"
  fp2_andalusian_aquamanile_desc:0 "Một bình nước [newly_created_artifact.GetFeatureText( 'goblet_material' )] tuyệt đẹp, trang trí bằng [newly_created_artifact.GetFeatureText( 'decoration_material_inlay' )] mạ vàng, dùng để chứa nước phục vụ nghi thức rửa tay."
