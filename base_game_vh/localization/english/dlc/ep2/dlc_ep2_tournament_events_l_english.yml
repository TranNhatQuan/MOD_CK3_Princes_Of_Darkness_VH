l_english:
 
  ep2_tournament_events.0001.t:1 "$tournament_versus_header$ Đối thủ bị khập khiễng"
  ep2_tournament_events.0001.desc:0 "Gạt lớp bụi khỏi mắt, ta trấn tĩnh lại khi những tiếng la ó, reo hò của đám đông dội xuống xung quanh. [versus_contestant.GetFirstName] đứng cách ta một quãng, cả hai vừa tách ra trong giây lát để lấy lại hơi thở.\n\nTiếng gào thét của khán giả lắng xuống đôi chút khi chúng ta bắt đầu chậm rãi xoay vòng quanh nhau. Chỉ một bước đi sai lầm cũng có thể kết thúc trận đấu này ngay lập tức. Đôi mắt của [versus_contestant.GetFirstNamePossessiveNoTooltip] khẽ nheo lại, gần như không thể nhận ra.\n\nKhi tiếp tục xoay vòng, ta để ý thấy từng làn bụi nhỏ tung lên dưới chân phải của [versus_contestant.GetFirstNamePossessiveNoTooltip] mỗi khi [versus_contestant.GetSheHe] bước đi. Trông gần như thể [versus_contestant.GetFirstNameNoTooltip] đang... hơi khập khiễng?"
  ep2_tournament_events.0001.a:0 "Nếu ta lách sang phải lúc này, ta sẽ biết được..."
  ep2_tournament_events.0001.b:0 "\"Ha! Ta bắt được ngươi rồi!\""
  ep2_tournament_events.0001.c:0 "[versus_contestant.GetFirstNamePossessiveNoTooltip] chỉ đang hù dọa. Ta sẽ đánh theo cách của mình."
  ep2_tournament_events.0001.a.tt:0 "Chuyển động của Ngài sẽ xác định đối thủ có đang đánh lừa hay không"
  ep2_tournament_events.0001.b.tt.win:0 "Chân của [versus_contestant.GetFirstNamePossessiveNoTooltip] bị thương"
  ep2_tournament_events.0001.b.tt.lose:0 "[versus_contestant.GetFirstNameNoTooltip] chỉ đang đánh lừa"

  ep2_tournament_events.0002.t:1 "$tournament_versus_header$ Chiều lòng đám đông"
  ep2_tournament_events.0002.desc:0 "#EMP Thunk!#!\n\nMy body thuds into the wooden wall at the edge of the arena, [versus_contestant.GetFirstName] having bodily hurled me there with a snarl. No sooner has [versus_contestant.GetSheHe] done so than [versus_contestant.GetFirstNamePossessiveNoTooltip] face morphs into a smug smile, and to my astonishment [versus_contestant.GetSheHe] turns away from me completely.\n\nRaising [versus_contestant.GetHerHis] arms to the baying crowd, [versus_contestant.GetSheHe] curls [versus_contestant.GetHerHis] arms up and flexes in the imitation of a traveling strong[versus_contestant.GetWomanMan]. The cheers from the crowd redouble; those fickle peasants are eating it up!"
  ep2_tournament_events.0002.a:0 "#EMP This#! is what a #EMP real#! [ROOT.Char.GetWomanMan] looks like!"
  ep2_tournament_events.0002.b:0 "Quay lại đối mặt ta đi, đồ hèn!"
  ep2_tournament_events.0002.c:0 "I'll teach [versus_contestant.GetHerHim] to show [versus_contestant.GetHerHis] back to me!"
  ep2_tournament_events.0002.a.tt:0 "Gồng mình cho đám đông xem!"
  ep2_tournament_events.0002.c.tt:0 "Tấn công từ phía sau"

  ep2_tournament_events.0003.t:1 "$tournament_versus_header$ Lòng khoan dung bị thử thách"
  ep2_tournament_events.0003.desc:0 "Dust puffs up around [versus_contestant.GetFirstNamePossessive] body as [versus_contestant.GetSheHe] falls backwards into the dirt. I am winning this fight, and everyone knows it.\n\nAmidst the cacophony of noise from the crowd, [versus_contestant.GetFirstName] drags [versus_contestant.GetHerHim]self to [versus_contestant.GetHerHis] knees and stretches out both arms.\n\n"Enough! I've had enough. No more." [versus_contestant.GetSheHe] calls out."
  ep2_tournament_events.0003.desc.dread:0 "I can see from the tremors in [versus_contestant.GetHerHis] body that it is not my skill alone that causes such a loss of fight. [versus_contestant.GetFirstNameNoTooltip] fears me."
  ep2_tournament_events.0003.desc.wounded:0 "Nỗi đau hiện rõ trên gương mặt [versus_contestant.GetFirstNamePossessiveNoTooltip]. [versus_contestant.GetSheHe] không phải kẻ hèn nhát, nhưng tiếp tục chiến đấu lúc này chỉ là ngu xuẩn."
  ep2_tournament_events.0003.desc.craven:0 "Whilst [versus_contestant.GetFirstNamePossessiveNoTooltip] wounds from this tournament are clear, the way [versus_contestant.GetSheHe] avoids my eyes and trembles as [versus_contestant.GetSheHe] begs betrays the real reason for surrender: simple cowardice."
  ep2_tournament_events.0003.a:0 "Ngươi là đồ hèn và là nỗi ô nhục!"
  ep2_tournament_events.0003.b:0 "Ta hiểu. Đứng dậy đi; trận đấu kết thúc rồi."
  ep2_tournament_events.0003.c:0 "Vết thương của ngươi trông khá nặng. Ta sẽ gọi thầy thuốc."
  ep2_tournament_events.0003.d:0 "Đừng bao giờ thách đấu ta nữa!"
  ep2_tournament_events.0003.e:0 "Ngươi nên tự hào về trận đấu này, [versus_contestant.GetFirstNameNoTooltip]."

  ep2_tournament_events.0004.t:1 "$tournament_versus_header$ Tử thần từ trên cao"
  ep2_tournament_events.0004.desc:1 "My blade clashes with that of my opponent [versus_contestant.GetFirstNamePossessive], sparks sent flying as the two weapons grate. We both step back, circling to our left.\n\n[versus_contestant.GetFirstNameNoTooltip|U] swings at me, the sword's point thudding into the ground after passing my body. Quick as a viper, I step in and kick it as hard as possible. Ripped from [versus_contestant.GetHerHis] grasp, [versus_contestant.GetFirstNamePossessiveNoTooltip] sword cartwheels off through the air, landing — to both of our horror — amongst the crowd!\n\nA shrill cry pierces the air, and we both hurry over to see [watching_crowd.GetFirstName] on [watching_crowd.GetHerHis] knees, the flying sword having impacted directly into [watching_crowd.GetHerHis] arm."
  ep2_tournament_events.0004.a:0 "[versus_contestant.GetFirstNameNoTooltip], sao #EMP ngươi có thể#! làm vậy?"
  ep2_tournament_events.0004.b:0 "[watching_crowd.GetFirstNameNoTooltip]! Ngươi có sao không?"
  ep2_tournament_events.0004.b.success:0 "[watching_crowd.GetFirstNameNoTooltip] chấp nhận lời xin lỗi của Ngài"
  ep2_tournament_events.0004.b.failure:0 "[watching_crowd.GetFirstNameNoTooltip] không tha thứ cho Ngài"
  ep2_tournament_events.0004.c:0 "Thôi, không thể chần chừ..."
  ep2_tournament_events.0004.c.tt:0 "Ra đòn khi [versus_contestant.GetSheHe] đang phân tâm!"

  ep2_tournament_events.0005.t:0 "$tournament_versus_header$ Bằng mọi giá"
  ep2_tournament_events.0005.start:0 "Ta vung kiếm, rồi lại vung thêm lần nữa, dồn dập nện vào thế thủ của [versus_contestant.GetFirstNamePossessive]. Một cú húc vai mạnh mẽ khiến [versus_contestant.GetHerHim] trượt lùi về sau, chân tay choạng choạng, và ta thấy ngay một cơ hội vàng. Hoàn toàn theo bản năng, ta quét chân theo một vòng cung dài, bàn chân nện thẳng vào háng của [versus_contestant.GetHerHis] với một tiếng #EMP thịch#! nặng nề.\n\n"
  ep2_tournament_events.0005.eunuch:0 "My follow-up, a bludgeoning swing, merely clangs against [versus_contestant.GetFirstNamePossessiveNoTooltip] weapon. It forces [versus_contestant.GetHerHim] backwards, but my shoulders sag as I remember one particular detail about [versus_contestant.GetFirstNameNoTooltip]...\n\n"Not much use kicking me there, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [versus_contestant.GetSheHe|U] calls over, shaking [versus_contestant.GetHerHis] head. "Not since it happened, at least."\n\n #EMP Of course.#! [versus_contestant.GetFirstNameNoTooltip] is a eunuch!"
  ep2_tournament_events.0005.pain:0 "[versus_contestant.GetFirstNameNoTooltip] bật lên một tiếng kêu nửa như hớp hơi, nửa như ho sặc, nửa như rên rỉ. Những ngón tay run rẩy barely bám được vào vũ khí khi đôi mắt của [versus_contestant.GetHerHis] lập tức trợn ngược vì đau đớn. Chỉ trong vài giây, [versus_contestant.GetSheHe] đã gập người xuống, gần như không thể đứng vững."
  ep2_tournament_events.0005.a:0 "Ha! Ta bắt được ngươi rồi!"
  ep2_tournament_events.0005.b:0 "Ôi! Ôi, xin lỗi! Ta không cố ý!"
  ep2_tournament_events.0005.c:0 "À. Phải rồi. Ta quên mất chuyện đó."

  ep2_tournament_events.0006.t:0 "$tournament_versus_header$ Một kẽ hở"
  ep2_tournament_events.0006.desc:0 "Tiếng thép va thép vang dội khắp đấu trường khi ta và [versus_contestant.GetFirstName] liên tiếp ra đòn. Khi [versus_contestant.GetSheHe] lùi lại, ta áp sát theo, và thêm một tiếng choang vang rền từ lưỡi kiếm của cả hai truyền rung động dọc cánh tay ta.\n\nBất chợt, một cơ hội: [versus_contestant.GetFirstNameNoTooltip] trượt chân, bàn chân của [versus_contestant.GetHerHis] chệch đi, và ta húc mạnh vai vào ngực [versus_contestant.GetHerHis], hất [versus_contestant.GetHerHim] ngã sóng soài.\n\n[versus_contestant.GetFirstNameNoTooltip|U] chậm chạp đứng dậy, và tâm trí ta bỗng quay về những quyển sổ huấn luyện mà ta từng bỏ hàng giờ nghiên cứu, cùng những chiêu trò kỳ quặc mà chúng gợi ý khi có được một lợi thế rõ ràng.\n\nGần như theo phản xạ, ta bắt đầu vặn tháo chốt đuôi chuôi vũ khí của mình..."
  ep2_tournament_events.0006.a:0 "Cuối cùng! Một cơ hội!"
  ep2_tournament_events.0006.a.tt:0 "Dùng chốt chuôi làm vật ném!"
  ep2_tournament_events.0006.a.toast:0 "Một chốt chuôi bị ném trúng thẳng vào mặt Ngài!"
  ep2_tournament_events.0006.b:0 "Đỡ lấy này, đồ khốn!"
  ep2_tournament_events.0006.b.tt:0 "Tốt nhất là đá một [versus_contestant.GetWomanMan] khi chúng còn đang nằm..."
  ep2_tournament_events.0006.c:0 "Tốt hơn hết là để họ đứng dậy."

  ep2_tournament_events.0007.t:0 "$tournament_versus_header$ Một xu cho suy nghĩ của ngươi..."
  ep2_tournament_events.0007.desc:0 "Ít có niềm vui nào sánh được với việc dễ dàng giành chiến thắng trong một cuộc đấu tay đôi. [versus_contestant.GetFirstName|U] lảo đảo lùi lại trên mặt đất gồ ghề, những đòn đánh của ta chỉ vừa đủ bị gạt đi khi ta tiến lên. Thêm một cú vung sấm sét nữa mắc vào thế đỡ của [versus_contestant.GetHerHis], và [versus_contestant.GetSheHe] tuyệt vọng chộp lấy cánh tay ta. Ta nở một nụ cười méo mó.\n\n\"Khoan. #EMP Khoan đã!#!\" [versus_contestant.GetFirstNameNoTooltip] thì thầm hét lên khi chúng ta vật lộn, lưỡi kiếm vẫn khóa chặt vào nhau. \"Nghe ta nói. Ta cần chiến thắng này!\" Cái nhún vai hờ hững của ta càng khiến [versus_contestant.GetHerHim] hoảng loạn hơn.\n\n\"Dừng lại! Ta là một [versus_contestant.GetWomanMan] giàu có. Làm ơn, ta có thể khiến việc này đáng giá với ngươi. M-... một trăm đồng vàng để ngươi chịu thua!\""
  ep2_tournament_events.0007.a:0 "Một trăm đồng vàng, ngươi nói sao?"
  ep2_tournament_events.0007.b:0 "Giả sử ta bỏ vàng đi, nhưng thêm vào một nghĩa vụ..."
  ep2_tournament_events.0007.c:0 "Ngươi không thể dùng tiền để thoát khỏi chuyện này đâu, [versus_contestant.GetFirstNameNoTooltip]."
 
  ep2_tournament_events.0010.t:0 "$tournament_versus_header$ Canh bạc tính toán"
  ep2_tournament_events.0010.desc:0 "Thời gian như chậm lại khi lưỡi kiếm của [versus_contestant.GetFirstNamePossessive] vạch một vòng cung từ trên cao, lưỡi thép ngân vang trong không khí. Đây không phải là một đòn nhẹ; nếu ta đứng yên, nó sẽ gây cho ta tổn thương thừa sức chịu đựng.\n\nLẽ ra chuyện phải đơn giản, vì một đòn đánh hoang dại như vậy sẽ để lộ sơ hở cho phản kích, nhưng ở phía sau tâm trí ta lại dấy lên một cảm giác khó chịu. Nét nhăn nhúm dữ tợn trên mặt [versus_contestant.GetFirstNameNoTooltip] khi [versus_contestant.GetSheHe] tung đòn là điều dễ hiểu với sức lực bỏ ra, nhưng ta lại thoáng thấy một tia thỏa mãn nhỏ nhoi trong đó. Đôi mắt của [versus_contestant.GetHerHis|U] cũng dường như liếc nhanh về phía hông ta khi [versus_contestant.GetSheHe] chuẩn bị ra đòn. Chẳng lẽ tất cả chỉ là nghi binh?\n\nĐòn đánh đã sát người ta. Đã đến lúc phải hành động."
  ep2_tournament_events.0010.a:0 "Ta bắt được ngươi rồi!"
  ep2_tournament_events.0010.a.success:0 "Đòn phản kích của Ngài thành công"
  ep2_tournament_events.0010.a.failure:0 "[versus_contestant.GetFirstNameNoTooltip] chỉ đang đánh lừa"
  ep2_tournament_events.0010.b:0 "Ta thà đỡ đòn còn hơn liều phản kích."
  ep2_tournament_events.0010.b.success:0 "Đỡ đòn thành công"
  ep2_tournament_events.0010.c:0 "Tốt hơn hết là sống để còn trận sau."
  ep2_tournament_events.0010.c.tt:0 "Một bước né đơn giản sẽ nhường vị trí, nhưng thận trọng lúc này vẫn hơn."

  ep2_tournament_events.0011.t:0 "$tournament_versus_header$ Một lựa chọn tiện lợi"
  ep2_tournament_events.0011.desc:0 "Mọi thứ diễn ra chỉ trong khoảnh khắc. Khi lưỡi kiếm của chúng ta va vào nhau dữ dội, chuôi vũ khí của [versus_contestant.GetFirstNamePossessive] trượt qua, đập mạnh vào mu bàn tay cầm kiếm của ta. Loạng choạng lùi lại để tạo khoảng cách, ta nắm lấy bàn tay mình bằng tay còn lại, thanh kiếm được giữ lỏng lẻo phía trước.\n\nCơn đau nhói lan dọc cánh tay khi ta tò mò cử động các ngón tay. Nó #EMP dường như#! không bị tổn thương nặng — nếu có — nhưng việc kiểm tra rất khó khăn khi ta phải liên tục lùi lại để tránh đòn đánh từ [versus_contestant.GetFirstNameNoTooltip] đang tiến tới. [versus_contestant.GetSheHe|U] cười nhếch mép, rõ ràng đã thấy lợi thế, và vung thêm một đòn nữa sượt qua bên hông ta.\n\nTa không thể cứ né mãi. Bàn tay này phải được xử lý, bằng cách này hay cách khác."
  ep2_tournament_events.0011.a:0 "\"Ha! Ngươi nghĩ ta chỉ luyện tập bằng một tay sao?!\""
  ep2_tournament_events.0011.a.tt:0 "Tay trái của ta cũng lợi hại chẳng kém tay phải!"
  ep2_tournament_events.0011.b:0 "Chỉ còn một cách thôi."
  ep2_tournament_events.0011.b.tt:0 "Đã đến lúc xem những bài tập tay phụ có phát huy tác dụng không..."
  ep2_tournament_events.0011.b.success:0 "Mưu kế của Ngài thành công"
  ep2_tournament_events.0011.b.failure:0 "[versus_contestant.GetFirstNameNoTooltip] chẳng hề nao núng"
  ep2_tournament_events.0011.b.criticalfailure:0 "Ngài đánh rơi hoàn toàn vũ khí"
  ep2_tournament_events.0011.c:0 "Dù chuyện gì xảy ra, ta cũng không lùi bước!"
  ep2_tournament_events.0011.c.tt:0 "Chuyển sang thế cầm hai tay có thể giảm bớt cơn đau, nhưng sẽ chẳng giúp ích nhiều nếu tay ta thực sự bị thương..."
  ep2_tournament_events.0011.c.opinion:0 "Tất cả người chứng kiến nhận #COLOR_GREEN 5#! thiện cảm với Ngài"
  ep2_tournament_events.0011.c.success:0 "Ngài kiên cường chiến đấu"
  ep2_tournament_events.0011.c.failure:0 "Bàn tay bị thương của Ngài không chịu nổi nữa"

  ep2_tournament_events.0012.t:0 "$tournament_versus_header$ Khoác lấy tấm choàng"
  ep2_tournament_events.0012.desc:0 "As I stride forward to engage [versus_contestant.GetFirstName], [versus_contestant.GetSheHe] pauses and lowers [versus_contestant.GetHerHis] weapon. My cloak billows around me in the light breeze.\n\n"Are you... going to be wearing that?" [versus_contestant.GetSheHe|U] asks, [versus_contestant.GetHerHis] face a mask of confusion and no small amount of suspicion. "I'm not here to judge, of course. I'm sure you look very #EMP fashionable.#!"\n\nI'm not sure I appreciate that sudden smirk of [versus_contestant.GetHersHis]."
  ep2_tournament_events.0012.intrigue:0 "Nhìn vượt qua đối thủ, ta thấy một người phụ nữ trong đám đông đang vật lộn với chiếc khăn choàng bị gió cuốn. Kế hoạch hình thành chậm rãi, nhưng cuối cùng cũng thành hình..."
  ep2_tournament_events.0012.arrogant:0 "Thực ra, ta có thể nói là ta hoàn toàn không thích điều đó. Sao [versus_contestant.GetSheHe] dám chế giễu ta và bộ y phục #EMP lộng lẫy#! này chứ?!"
  ep2_tournament_events.0012.a:0 "Ta sẽ cho ngươi thấy ta #EMP chiến đấu#! thời trang ra sao!"
  ep2_tournament_events.0012.b:0 "Dĩ nhiên là #EMP không#! ta sẽ đấu trong th- hây da!"
  ep2_tournament_events.0012.b.tt:0 "Let's see how well [versus_contestant.GetSheHe] fights with a cape thrown at [versus_contestant.GetHerHis] face!"
  ep2_tournament_events.0012.c:0 "Dĩ nhiên là không. Xin chờ một chút."
  ep2_tournament_events.0012.c.tt:0 "Thật lòng mà nói, 'áo choàng đấu kiếm' ư? Ta đã #EMP nghĩ#! gì vậy chứ?!"
  ep2_tournament_events.0012.d:0 "Tất cả bậc đại cao thủ đều chiến đấu như thế này, [versus_contestant.Custom2('InsultNoun', ROOT.Char)]!"

  ep2_tournament_events.0020.t:0 "$tournament_versus_header$ Lời đấu khẩu"
  ep2_tournament_events.0020.desc:1 "Một làn gió nhẹ khuấy động không khí khi [versus_contestant.GetFirstName] tiến về phía ta, kiếm đã sẵn sàng. Ta quan sát xung quanh để tìm bất kỳ lợi thế nào, như mọi đấu sĩ giỏi đều làm. Không có địa hình gồ ghề, không có ánh nắng thấp làm mù mắt [versus_contestant.GetHerHim], không có điểm yếu nào trong thế đứng của [versus_contestant.GetHerHis]. Ta chuẩn bị giao đấu một cách công bằng.\n\nMột tiếng la từ đám đông — chắc lại có kẻ ngã khỏi ghế — khiến [versus_contestant.GetFirstNameNoTooltip] khựng lại. [versus_contestant.GetSheHe|U] tập trung lại vào ta, đầy căng thẳng. Người ta nói rằng có kẻ cần hoàn toàn không bị xao nhãng mới có thể chiến đấu. Có lẽ [versus_contestant.GetFirstNameNoTooltip] là một [versus_contestant.GetWomanMan] như thế?"
  ep2_tournament_events.0020.secret:0 "\n\nGần như vô thức, một mẩu kiến thức nhỏ bật lên trong đầu ta. Chẳng phải [versus_contestant.GetSheHe] chính là kẻ đã... à, đúng rồi. Đúng là vậy!"
  ep2_tournament_events.0020.a:0 "\"Cái gì cơ, [versus_contestant.GetFirstNameNoTooltip]? Ngươi đã làm #EMP gì?!#!\""
  ep2_tournament_events.0020.a.tt:0 "Nói to lên, để tất cả mọi người đều nghe!"
  ep2_tournament_events.0020.b:0 "Ta biết ngươi đã làm gì, [versus_contestant.GetFirstNameNoTooltip]!"
  ep2_tournament_events.0020.b.tt:0 "Thì thầm thôi; bí mật nói cho tất cả thì không còn sức nặng nữa!"
  ep2_tournament_events.0020.c:0 "Nói chuyện vốn luôn là sở trường của ta."
  ep2_tournament_events.0020.c.success:0 "[versus_contestant.GetFirstNameNoTooltip] bị phân tâm bởi lời nói của Ngài"
  ep2_tournament_events.0020.c.failure:0 "[versus_contestant.GetFirstNameNoTooltip] không bị phân tâm bởi lời nói của Ngài"
  ep2_tournament_events.0020.d:0 "Ta nên tập trung vào trận đấu."

  ep2_tournament_events.0021.t:0 "$tournament_versus_header$ Mọi lợi thế"
  ep2_tournament_events.0021.desc:0 "[versus_contestant.GetFirstNamePossessive] sword scrapes along the edge of mine, sparks scattering as I reel backwards. [versus_contestant.GetSheHe|U] smiles grimly as my back hits the perimeter of the arena, and [versus_contestant.GetSheHe] circles to cut me off against the barrier. I need an advantage of any kind.\n\nSuddenly, deliciously, a fragment of realization swims itself to the front of my mind. How foolish I have been! Of all the things to forget! Perhaps now is the time to use it...\n\n"Are you done, [ROOT.Char.GetFirstName]?" [versus_contestant.GetSheHe|U] grunts, brandishing [versus_contestant.GetHerHis] weapon. "You look just about done to me.""
  ep2_tournament_events.0021.a:0 "\"Quả thật, ngươi còn nói nhiều hơn cả [family.GetFirstNameNoTooltip] trước kia.\""
  ep2_tournament_events.0021.b:0 "\"[versus_contestant.Custom2('InsultNoun', ROOT.Char)|U], ta đã #EMP xử lý#! [versus_contestant.Custom2('RelationToMeShort', SCOPE.sC('family') )] của ngươi rồi!\""
  ep2_tournament_events.0021.c:0 "Có lẽ tốt nhất là đừng chọc giận [versus_contestant.GetHerHim]..."

 # Melee

  ep2_tournament_events.1001.t:1 "$tournament_contest_header$ Những Tòa Nhà Bốc Cháy"
  ep2_tournament_events.1001.desc:0 "Giữa máu lửa và tiếng sấm của cuộc hỗn chiến, gần như không thể giữ được phương hướng. Đám đông đấu sĩ dập dềnh, xô đẩy — một khối nhân loại mất kiểm soát. Khốn cho kẻ nào đứng chắn đường họ! Dĩ nhiên, một nông dân xấu số chỉ cần mau chóng tránh sang một bên là có thể thoát nạn. Vấn đề, theo ta nghĩ, trở nên nghiêm trọng hơn đôi chút khi nạn nhân lại là… một tòa nhà.\n\nCuộc hỗn chiến đã tràn vào khu vực chính của [activity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly], và ngay lúc này ta còn thấy các đấu sĩ từ cả hai phe xé toạc mặt tiền nhà cửa để làm khiên tạm bợ, thậm chí dùng làm vũ khí ném. Ta thậm chí còn tưởng như nghe thấy tiếng lửa cháy lách tách ở phía xa…"
  ep2_tournament_events.1001.a:0 "Dừng lại, mở to mắt ra! Đình chiến!"
  ep2_tournament_events.1001.b:0 "Nếu họ đánh ở đây, ta cũng sẽ đánh."
  ep2_tournament_events.1001.c:0 "#EMP Đủ rồi!#! Đình chiến!"
  ep2_tournament_events.1001.c.success:0 "Cuộc hỗn chiến tạm thời chấm dứt"
  ep2_tournament_events.1001.c.failure:0 "Không ai thèm nghe"
  ep2_tournament_events.1001.d:0 "Có lẽ đã đến lúc rời đi."

  ep2_tournament_events.1002.t:1 "$tournament_contest_header$ Công Trình Tái Thiết"
  ep2_tournament_events.1002.desc:0 "Ta lảo đảo rời khỏi vòng va đập của cuộc hỗn chiến, quay về phía trại, nhưng chẳng bao lâu đã cảm nhận được một sự hiện diện giận dữ đang nhanh chóng tiến tới.\n\n\"Ngài định nói gì để biện hộ cho mình đây?!\" Vẻ mặt ngơ ngác của ta hẳn đã tố cáo sự bối rối trước câu hỏi ấy, và nét mặt [mayor.GetHerHis] càng tối sầm hơn. \"Ngôi làng của ta đã thành #EMP đống đổ nát!#!\"\n\nNgười [mayor.GetWomanMan] ăn vận chỉnh tề — [mayor.GetFirstName], như [mayor.GetSheHe] cáu kỉnh tự giới thiệu [mayor.GetHerselfHimself] — là thị trưởng của khu định cư nay đã thê lương, và rõ ràng đang đổ mọi trách nhiệm lên đầu ta.\n\n\"Sao nữa? Ngài định làm gì về chuyện này đây? Chúng ta sẽ mất #EMP tất cả#! vào mùa đông tới!\""
  ep2_tournament_events.1002.a:0 "Có lẽ ta có thể giúp các ngươi tái thiết?"
  ep2_tournament_events.1002.b:0 "Ngươi cũng to gan thật đấy, [mayor.GetFirstNameNoTooltip]."
  ep2_tournament_events.1002.b.tt:0 "Lựa chọn này khả dụng nhờ danh tiếng [dread|E] của Ngài"
  ep2_tournament_events.1002.c:0 "Được rồi, được rồi, ta sẽ trả tiền."
  ep2_tournament_events.1002.d:0 "Cút đi! Ta cần nghỉ ngơi!"

  ep2_tournament_events.1003.t:1 "$tournament_contest_header$ Lưỡi Kiếm Thất Lạc"
  ep2_tournament_events.1003.desc:0 "Cuộc hỗn chiến cuộn trào, dồn ép lấy ta. Ta bị hất sang bên này rồi bên kia, cố gắng vừa đỡ vừa phản công. Kiếm xé toạc giáp, giáo va vào những mấu kim loại tròn trên khiên.\n\nMột vũ khí vụt qua tầm nhìn, nhắm thẳng vào đầu ta. Ta barely kịp né, xoay [tournament_weapon.GetName] để đỡ đòn. Một pha thoát chết trong gang tấc.\n\nTa quay lại để vung [tournament_weapon.GetType] lần nữa, chỉ để nhận ra rằng nó đã hoàn toàn bị đánh văng khỏi tay! Nó rơi xuống nền đất bụi, bị đá qua đá lại giữa những kẻ đang vật lộn."
  ep2_tournament_events.1003.a:0 "Á! Vũ khí của ta!"
  ep2_tournament_events.1003.a.tt.success:0 "Ngài thành công giành lại nó"
  ep2_tournament_events.1003.a.tt.failure:0 "Vũ khí bị đá xa hơn nữa"
  ep2_tournament_events.1003.b:0 "Đành để sau vậy."
  ep2_tournament_events.1003.b.tt:0 "Một vũ khí phụ sẽ phải tạm dùng."

  ep2_tournament_events.1004.t:1 "$tournament_contest_header$ [comely_stray.Custom('GetLassLad')|U] Lạc Lối"
  ep2_tournament_events.1004.desc:0 "A glimpse, through the struggling bodies, the rent helms and the swirling dust; is that a spirit? [comely_stray.GetSheHe|U] has an ethereal beauty to [comely_stray.GetHerHim].\n\nNo, no, it is no spirit: etched upon [comely_stray.GetHerHis] winsome face is a look of pure terror as [comely_stray.GetSheHe] looks for a way out.\n\nNo sooner have I opened my mouth than [comely_stray.GetSheHe] trips and falls, [comely_stray.GetHerHis] ankle twisting from stepping awkwardly on an errant spear, [comely_stray.GetHerHis] mournful eyes welling with tears as [comely_stray.GetSheHe] cowers away from the whirling blades."
  ep2_tournament_events.1004.a:0 "Cố lên, người đẹp!"
  ep2_tournament_events.1004.a.tt:0 "Mặc kệ hỗn chiến; ta còn việc lớn hơn!"
  ep2_tournament_events.1004.c:0 "[rescuer_knight.GetFirstNameNoTooltip]! Giúp [comely_stray.GetHerHim] ra chỗ an toàn!"
  ep2_tournament_events.1004.d:0 "Họ phải tự lo cho mình thôi."
  ep2_tournament_events.1004.d.escape.tt:0 "Họ thoát thân an toàn"
  ep2_tournament_events.1004.d.injured.tt:0 "Họ bị thương"
  ep2_tournament_events.1004.d.dead.tt:0 "Họ gặp kết cục bi thảm"

  ep2_tournament_events.1005.t:1 "$tournament_contest_header$ Nhắm Thẳng Yết Hầu"
  ep2_tournament_events.1005.desc:0 "Xung quanh ta, [ROOT.Char.GetWomenMen] lần lượt ngã khỏi cuộc hỗn chiến cuộn xoáy, máu tuôn xối xả từ tay chân họ. Khiên vỡ làm đôi nằm lẫn với giáo gãy và những thanh kiếm bị vứt bỏ, rải khắp chiến địa.\n\nMột đối thủ vô danh tiến lên, ta gạt được cú đánh của [ROOT.Char.GetHerHis], chấn động truyền dọc cánh tay. Ta lách người né đòn kế tiếp, phản công nhưng hụt, #X bước lên#! để tiếp tục và—\n\nĐòn phản kích của đối phương đã luồn thẳng dưới cằm ta. Nếu ta giữ nguyên vị trí, nó đã trượt mất. Thay vào đó, cổ họng ta hứng trọn cú đánh. Loạng choạng rời khỏi đám hỗn chiến, ta tuyệt vọng chụp lấy vết thương rồi khuỵu gối xuống."
  ep2_tournament_events.1005.a:0 "...khục!"
  ep2_tournament_events.1005.b:0 "Xin hàng! Ta xin hàng..."
  ep2_tournament_events.1005.success: "Dù sao thì cũng chỉ là vết thương ngoài da thôi"
  ep2_tournament_events.1005.fail: "Một cái kết thảm hại"
  ep2_tournament_events.1005.resign: "#V Ngài#! đã rút khỏi giải đấu"

  ep2_tournament_events.1006.t:0 "$tournament_header$ Bị Bắt Giữ"
  ep2_tournament_events.1006.start:0 "I batter at [surrendering_knight.GetFirstName] with my sword, sparks flying off the blade as it rents [surrendering_knight.GetHerHis] armor. Forced backwards and down by the hammering blows, [surrendering_knight.GetSheHe] eventually throws [surrendering_knight.GetHerHis] weapon down and raises an arm in a sign of surrender.\n\n"
  ep2_tournament_events.1006.normal:0 "Ta áp giải [surrendering_knight.GetFirstNameNoTooltip] ra khỏi đám hỗn chiến về phía người hầu cận, vừa để trông chừng [surrendering_knight.GetHerHim] vừa quay lại giao tranh. Thông thường, tù binh sẽ tự chuộc thân để giành lại tự do; [surrendering_knight.GetSheHe] hẳn sẽ trả được một khoản kha khá!"
  ep2_tournament_events.1006.rival:0 "Ta kề vũ khí vào mặt [surrendering_knight.GetFirstNamePossessiveNoTooltip], thưởng thức nỗi sợ hãi và căm phẫn trong ánh mắt của [surrendering_knight.GetHerHis]. Thường thì vàng bạc hay trang bị là đủ để chuộc bại trận, nhưng..."
  ep2_tournament_events.1006.broke:0 "Trong lúc ta chờ đợi, [surrendering_knight.GetFirstNameNoTooltip] khẽ thở dài.\n\n\"Ta sẽ không lừa dối ngươi. Ta không có đủ tiền để trả khoản chuộc mà ngươi muốn. Đây là tất cả những gì ta có.\" [surrendering_knight.GetSheHe|U] nói, mệt mỏi, giơ ra một túi nhỏ xíu với rõ ràng chỉ có vài đồng xu bên trong."
  ep2_tournament_events.1006.a:0 "Ngươi sẽ hối hận vì đã đối đầu với ta!"
  ep2_tournament_events.1006.b:0 "Ta sẽ nhận tiền chuộc!"
  ep2_tournament_events.1006.c:0 "\"[artifact.GetNameNoTooltip]\" à? Trông cũng khá đấy."
  ep2_tournament_events.1006.d:0 "Ừm, ta nghĩ ta sẽ lấy nó vậy."
  ep2_tournament_events.1006.e:0 "Hãy đi tự do, đối thủ cao quý!"

  ep2_tournament_events.1007.t:0 "$tournament_header$ Chốn Ẩn Náu Êm Ái"
  ep2_tournament_events.1007.desc:0 "Kiệt sức, ta lê bước vào nơi trú ẩn với những tiện nghi khắc khổ. Xung quanh là các đấu sĩ từ cả hai phe, giáp trụ rách nát, kiếm mòn sứt mẻ. Người hầu và gia nhân hối hả chạy qua chạy lại giúp đỡ chủ nhân của mình.\n\nTa bắt gặp vài đồng đội đang hồi sức. Họ chào ta uể oải khi ta sụp xuống bên cạnh, toàn thân đau nhức. Từ vị trí râm mát của mình, ta thấy một người bán hàng lanh lợi đang chuẩn bị vội vài món ăn thức uống để bán cho những chiến binh tan tác. [teammate_1.GetFirstName] và [teammate_2.GetFirstName] dõi theo người bán với chút hy vọng, trong khi [teammate_3.GetFirstName] lẩm bẩm điều gì đó về một bài diễn thuyết với vẻ tươi cười gượng gạo."
  ep2_tournament_events.1007.a:0 "Vẫy gọi người bán lại."
  ep2_tournament_events.1007.a.tt.success:0 "Đồ ăn thức uống tiếp thêm sinh lực cho tất cả các ngươi"
  ep2_tournament_events.1007.a.tt.bigsuccess:0 "Đồ ăn thức uống thật tuyệt vời!"
  ep2_tournament_events.1007.a.result:1 "Điểm số của đội Ngài #positive_value increases#!"
  ep2_tournament_events.1007.a.bigresult:1 "Điểm số của đội Ngài #positive_value greatly increases#!"
  ep2_tournament_events.1007.b:0 "\"Tụ họp lại đây, các ngươi.\""
  ep2_tournament_events.1007.b.tt:0 "Có lẽ vài lời truyền cảm hứng sẽ nâng cao tinh thần họ?"
  ep2_tournament_events.1007.b.tt.success:0 "Lời nói của Ngài khôi phục sinh lực cho họ"
  ep2_tournament_events.1007.b.tt.failure:0 "Bài diễn thuyết dường như không mấy tác dụng"
  ep2_tournament_events.1007.b.result:1 "Điểm số của đội Ngài #positive_value increases#!"
  ep2_tournament_events.1007.c:0 "Tốt hơn hết là cứ để họ tự lo."

  ep2_tournament_events.1011.t:0 "$tournament_contest_header$ Một Đối Thủ Lừng Danh"
  ep2_tournament_events.1011.start:0 "Giữa máu lửa và sấm sét của cuộc hỗn chiến, ta nhận ra một bóng hình đang tiến đến trên lưng ngựa. Những biểu trưng treo trước cổ chiến mã đã tiết lộ thân phận của họ trước cả khi cất lời: một $knight_culture_player_no_tooltip_lowercase$ thực sự lừng danh đang hiện diện trên chiến trường.\n\n"
  ep2_tournament_events.1011.unequal:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip|U]!" [famous_knight.GetFirstName|U] thunders, drawing closer at a sharp trot, voice carrying clearly across the field. [famous_knight.GetSheHe|U] flourishes [famous_knight.GetHerHis] sword with practiced aplomb, a clear master of [famous_knight.GetHerHis] environment.\n\n"I wish to cross blades with you. Come, face me, and let us see which of us proves mightier!""
  ep2_tournament_events.1011.equal:0 ""Ah, [ROOT.Char.GetTitledFirstNameNoTooltip|U]! This is indeed an honor!" [famous_knight.GetFirstName|U] removes [famous_knight.GetHerHis] helmet before continuing.\n\n"Finally, the two greatest $knight_culture_player_plural_no_tooltip_lowercase$ known to the world meet. Two soldiers of honor who have competed together in the blood-soaked glory of the field, face to face at last. How often I have rehearsed this moment of destiny in my dreams! The panoply to encapsulate the unspoken nobility of our comradeship—""
  ep2_tournament_events.1011.a:0 "Hãy xem tình huynh đệ này cao quý đến mức nào..."
  ep2_tournament_events.1011.a.tt:0 "Ném một nắm đất vào mặt [famous_knight.GetHerHis] khi [famous_knight.GetSheHe] đang nói có thể là hèn hạ, nhưng chắc chắn rất hiệu quả!"
  ep2_tournament_events.1011.a.success:0 "Ngài giành chiến thắng trong trận đấu"
  ep2_tournament_events.1011.a.failure:0 "Ngài thua trận"
  ep2_tournament_events.1011.b:0 "\"Nào, đối thủ cao quý! Hãy cùng thử sức trong giao chiến.\""
  ep2_tournament_events.1011.c:0 "Có lẽ thận trọng mới là dũng khí, lúc này..."
  ep2_tournament_events.1011.d.success:0 "Ngài lẩn đi thành công vào đám hỗn chiến"
  ep2_tournament_events.1011.d.failure:0 "[famous_knight.GetFirstNameNoTooltip] bắt kịp Ngài"

  ep2_tournament_events.1012.t:0 "$tournament_contest_header$ Từ Trong Lùm Cây"
  ep2_tournament_events.1012.desc:0 "The hardy scrub shivers and rustles as I push my way through it. This copse of trees is in a perfect ambush spot, adjacent to the path to a rest spot.\n\nI do not have to wait long. [caught_opponent.GetFirstName] shambles [caught_opponent.GetHerHis] way along the path, clearly looking forward to a break from the fighting. The dappled sunlight glints off [caught_opponent.GetHerHis] armor as the susurration of the leaves masks my approach through the undergrowth.\n\nKeeping my eyes on [caught_opponent.GetFirstNameNoTooltip], I eventually get myself into prime position, merely two or so strides away from where [caught_opponent.GetSheHe] is about to tread."
  ep2_tournament_events.1012.a:0 "Ta chỉ là tiếng xào xạc của cành lá."
  ep2_tournament_events.1012.b:0 "\"[caught_opponent.GetFirstNameNoTooltip]! Hãy đối mặt ta trong trận đấu danh dự!\""
  ep2_tournament_events.1012.b.success:0 "Ngài thắng cuộc đấu tay đôi"
  ep2_tournament_events.1012.b.failure:0 "Ngài thua cuộc đấu tay đôi"
  ep2_tournament_events.1012.c:0 "Ta phải ra tay thật nhanh!"
  ep2_tournament_events.1012.c.success:0 "Cuộc phục kích thành công"
  ep2_tournament_events.1012.c.failure:0 "Cuộc phục kích thất bại thảm hại"
  ep2_tournament_events.1012.d:0 "Chiến thắng theo cách này thật không phải lẽ."

  ep2_tournament_events.1013.t:0 "$tournament_contest_header$ Lợi Thế Địa Hình"
  ep2_tournament_events.1013.desc:0 "Ta ghìm cương sau khi lướt qua một đối thủ rồi quay lại vòng hỗn chiến. Khi tiến gần, ta thấy một bóng người bị hất văng khỏi yên ngựa, trúng đòn đánh lén từ phía sau.\n\nDường như không bị thương, [felled_participant.GetFirstName] hoảng hốt nhìn quanh tìm chiến mã của [felled_participant.GetHerHis], nhưng nó đã bỏ chạy từ lâu, hoảng sợ trước âm thanh náo loạn.\n\nTa tiến lại gần hơn nữa, ánh mắt không rời khỏi cảnh ngộ của [felled_participant.GetHerHis]. Ngồi trên lưng chiến mã, [felled_participant.GetSheHe] trông thật nhỏ bé, thật yếu ớt. Người ngoài có thể nói rằng làm vậy là không danh dự, nhưng trong vòng hỗn chiến này thì danh dự vốn đã chẳng còn bao nhiêu..."
  ep2_tournament_events.1013.a:0 "\"Ngươi có cần giúp không, [felled_participant.GetFirstNameNoTooltip]?\""
  ep2_tournament_events.1013.a.tt:0 "Che chắn cho [felled_participant.GetHerHim] khỏi vòng hỗn chiến cho đến khi một người hầu mang tới cho [felled_participant.GetHerHim] một con ngựa khác."
  ep2_tournament_events.1013.b:0 "Đành vậy thôi. #EMP Hyah!#!"
  ep2_tournament_events.1013.c:0 "Chúng ta sẽ giải quyết công bằng, dưới đất."
  ep2_tournament_events.1013.c.success:0 "Ngài giành phần thắng trong cuộc đấu tay đôi"
  ep2_tournament_events.1013.c.failure:0 "Ngài thua trong cuộc đấu tay đôi"
  ep2_tournament_events.1013.d:0 "Đây không phải cách ta chiến đấu."
  ep2_tournament_events.1013.d.tt:0 "Quay đầu tìm kiếm những cuộc giao tranh khác, công bằng hơn."

  ep2_tournament_events.1015.t:0 "$tournament_contest_header$ Một $knight_culture_player_no_tooltip$ Bí Ẩn"
  ep2_tournament_events.1015.desc:0 "Chiến mã gầm vang lao qua vòng hỗn chiến. Cú xung phong của ta đưa ta rời khỏi giao tranh, và ta vòng lại theo một quỹ đạo rộng để quan sát.\n\nNgay lập tức, ánh mắt ta bị hút chặt. Một $knight_culture_player_no_tooltip_lowercase$ vung vũ khí đầy khí thế, hung hãn và không kém phần điêu luyện, hất văng một đối thủ khỏi yên rồi xuống ngựa tiếp tục chiến đấu. Rõ ràng họ vượt trội hẳn so với kẻ địch bất lực kia, và chẳng mấy chốc đã dồn đối phương vào thế cùng đường, thu về một khoản vàng kha khá làm tiền chuộc.\n\nNhững phù hiệu ấy trông quen mắt, nhưng thật khó nhận ra. Ta thúc ngựa lại gần rồi xuống ngựa, cất tiếng gọi, nhưng bóng người kia vẫn kiên quyết rời đi để tìm kiếm những kẻ thù mới."
  ep2_tournament_events.1015.a:0 "Thôi thì, ta cũng có thể hưởng ké từ tàn dư của họ."
  ep2_tournament_events.1015.a.tt:0 "Đây là cơ hội tốt để đánh bại vài đối thủ đã suy yếu và kiếm chút tiền!"
  ep2_tournament_events.1015.b:0 "Ta phải biết người đó là ai!"
  ep2_tournament_events.1015.b.success:0 "Ngài bắt kịp kẻ lạ mặt"
  ep2_tournament_events.1015.b.failure:0 "Họ lẫn mất vào đám đông"
  ep2_tournament_events.1015.b.success.tt:0 "Ngài đối mặt với nhân vật ấy"
  ep2_tournament_events.1015.c:0 "Tốt hơn hết là cứ để họ tự lo."

  ep2_tournament_events.1016.t:0 "$tournament_contest_header$ Bí Ẩn Được Giải Đáp"
  ep2_tournament_events.1016.start:0 "Rất nhanh, ta nhận ra sự hiện diện của mình không được chào đón. $knight_culture_player_no_tooltip_lowercase$ kia liên tục liếc nhìn ta đầy lo lắng qua vai, lắt léo len lỏi qua vòng hỗn chiến để cắt đuôi, nhưng ta không bỏ cuộc. Cuối cùng ta cũng đuổi kịp, đặt tay lên cánh tay họ và giật phăng mũ giáp. Ta không kìm được một tiếng hít mạnh.\n\n"
  ep2_tournament_events.1016.mulan:0 ""I hope I have proved myself worthy." [mysterious_knight.GetFirstName] says, bowing [mysterious_knight.GetHerHis] head slightly. "Thank you for your trust in me. Now, let me repay it." [mysterious_knight.GetSheHe] raises [mysterious_knight.GetHerHis] weapon, the sunlight catching on the blade."
  ep2_tournament_events.1016.mulanunknown:0 "Đó là một #EMP [mysterious_knight.GetWomanMan]#!!\n\n\"Xin ngài, ta cầu xin ngài, đừng nói với bất kỳ ai.\" [mysterious_knight.GetSheHe|U] khẩn khoản. [mysterious_knight.GetSheHe|U] cúi nhìn xuống đất rồi ngước lên ta với ánh mắt đầy hy vọng. \"Tất cả những gì ta mong muốn là được phép chứng tỏ giá trị của mình!\""
  ep2_tournament_events.1016.relation:0 "Trong tất cả mọi người, đó lại là [ROOT.Char.Custom2('RelationToMeShort', mysterious_knight)] của ta — [mysterious_knight.GetFirstName]! [mysterious_knight.GetSheHe|U] chỉ có thể nở một nụ cười gượng trước vẻ sững sờ của ta, rồi đưa tay ra hiệu về phía vòng hỗn chiến đang xoáy cuộn phía sau.\n\n\"Chúng ta không có thời gian để hỏi han.\" [mysterious_knight.GetSheHe|U] cắt ngang lời phản đối của ta. \"Chúng ta còn một trận chiến phải thắng!\""
  ep2_tournament_events.1016.a:0 "Được thôi. Coi chừng sau lưng ta!"
  ep2_tournament_events.1016.b:0 "Ngươi phải cho ta thấy bản lĩnh của mình!"
  ep2_tournament_events.1016.b.tt:0 "Quan sát kỹ lưỡng chắc chắn sẽ dạy cho Ngài vài điều."
  ep2_tournament_events.1016.b.success:0 "Ngài học hỏi được rất nhiều"
  ep2_tournament_events.1016.b.failure:0 "Ngài học được một chút"
  ep2_tournament_events.1016.c:0 "Không! Ngươi không thể #EMP làm#! chuyện này!"

  ep2_tournament_events.1017.t:0 "$tournament_contest_header$ Bị Dồn Góc"
  ep2_tournament_events.1017.desc:0 "Bị một binh khí cán dài giật khỏi yên ngựa, ta loạng choạng đứng dậy, đầu óc choáng váng. Những kẻ tấn công lập tức quay lại đối mặt với ta.\n\n\"Xin lỗi vì cú ngã hơi thô bạo,\" [knight_1.GetFirstName] nói, \"nhưng bọn ta không dám mạo hiểm.\" Ba tên tất cả, vũ trang tận răng. Mục đích của chúng quá rõ ràng: ta là một mục tiêu giá trị cao, kẻ sẽ mang lại khoản tiền chuộc kếch xù.\n\nKhi đầu óc dần tỉnh táo, ta nhận ra hai bóng người đang tiến đến từ phía sau vai bọn tấn công, khoác trên mình màu sắc của đội ta. Ba tên khốn đang cười cợt kia hoàn toàn không hay biết mối nguy cận kề, và sự giải cứu của ta chắc chắn đang trong tầm tay — nếu ta muốn."
  ep2_tournament_events.1017.a:0 "Lùi lại. #EMP Ba tên này là của ta.#!"
  ep2_tournament_events.1017.a.success:0 "Ngài một mình đánh bại cả ba"
  ep2_tournament_events.1017.a.failure:0 "Ngài hoàn toàn bị áp đảo"
  ep2_tournament_events.1017.b:0 "Bây giờ! Xông vào chúng!"
  ep2_tournament_events.1017.b.success:0 "Ngài đánh úp chúng khi chúng chưa kịp trở tay"
  ep2_tournament_events.1017.b.failure:0 "Chúng rút lui trong giao tranh"

  ep2_tournament_events.1018.t:0 "$tournament_contest_header$ Một Nhà Đồng Lòng"
  ep2_tournament_events.1018.desc:0 "Phóng tầm mắt qua vòng hỗn chiến, ta bắt gặp một đồng đội đang bị vây hãm, phải chiến đấu dưới đất trước hai kẻ thù. Nhìn kỹ hơn, ta thấy những màu sắc lấm bùn và rách nát mà [family.GetSheHe] đang khoác: lá cờ của Gia tộc cao quý [ROOT.Char.GetHouse.GetName] của chúng ta.\n\nThúc chiến mã lao thẳng vào vòng brawl, một kẻ địch bị hất văng. Kẻ còn lại, bị bất ngờ, nhanh chóng gục ngã trước lưỡi kiếm hợp lực của chúng ta. [family.GetFirstName] mỉm cười cảm kích, cúi chào trước ta và chiến mã.\n\n\"Đa tạ. Nếu không có ngài, hẳn ta đã gục ngã.\" [family.GetSheHe|U] cúi nhìn những mảnh vải sờn rách nhưng vẫn rực rỡ mà cả hai chúng ta đang mang, vỗ nhẹ lên huy hiệu nằm trên ngực [family.GetHerHis]. \"[ROOT.Char.GetHouse.GetMotto].\""
  ep2_tournament_events.1018.a:0 "\"[ROOT.Char.GetHouse.GetMotto]\", [family.GetFirstNameNoTooltip]."
  ep2_tournament_events.1018.b:0 "Ta sẽ luôn bảo vệ ngươi, chừng nào còn hơi thở."
 
 # Archery

  ep2_tournament_events.1501.t:0 "$tournament_contest_header$ Im Lặng Nào!"
  ep2_tournament_events.1501.desc:0 "Đám đông rì rầm êm ả khi [competitor.GetFirstName] bước vào vị trí của [competitor.GetHerHis]. Ta ngỡ như bắt được vài lời theo gió, và rõ ràng [competitor.GetFirstNameNoTooltip] cũng vậy. [competitor.GetSheHe|U] quay lại với vẻ hơi cáu kỉnh và lên tiếng với đám đông.\n\n\"Im lặng! Có chút tôn trọng dành cho các đấu thủ đi chứ!\" [competitor.GetSheHe|U] càu nhàu gắt gỏng. Vài tiếng cười khúc khích vang lên đáp lại. Rõ ràng [competitor.GetSheHe] cần sự yên tĩnh để bắn tên, nhưng — ta nghĩ, khi [competitor.GetSheHe] lại quay sang vung nắm đấm về phía đám đông — chuyện này có lẽ đang bị đẩy đi quá xa."
  ep2_tournament_events.1501.secret:0 "\n\nTa để tâm trí trôi về những gì mình tưởng đã nghe được từ những lời xì xào của đám đông. Ít nhất thì chúng nghe cũng khá là #EMP dâm dật#!..."
  ep2_tournament_events.1501.a:0 "\"Ngươi kia. Ngươi vừa nói gì vậy?\""
  ep2_tournament_events.1501.a.tt:0 "Đám đông này sẽ chẳng thể giữ mồm giữ miệng nổi nữa khi mẩu chuyện đồi trụy kia đã bị nghe rõ mồn một!"
  ep2_tournament_events.1501.b:0 "Ôi chao. Ta thấy cổ họng mình bỗng ngứa quá."
  ep2_tournament_events.1501.b.tt:0 "#EMP Khụ!#! #EMP KHỤ!#!"
  ep2_tournament_events.1501.c:0 "Tốt hơn là để [competitor.GetHerHim] tiếp tục phần thi."

  ep2_tournament_events.1502.t:0 "$tournament_contest_header$ Động Học Mũi Tên"
  ep2_tournament_events.1502.desc:0 "Cờ xí phần phật cuộn xoáy quanh ta khi ta bước lên để bắn, bị gió quật mạnh. Bụi tung mù mịt khi ta lắp tên vào dây cung, cơn gió hăng hắc làm mắt ta cay xè.\n\nTa chờ cho nó dịu lại.\n\nTa tiếp tục chờ.\n\nTa không nghĩ là nó sẽ dừng đâu."
  ep2_tournament_events.1502.secret:0 "\n\nTa để tâm trí trôi về những gì mình tưởng đã nghe được từ những lời xì xào của đám đông. Ít nhất thì chúng nghe cũng khá là #EMP dâm dật#!..."
  ep2_tournament_events.1502.a:0 "Hah! Chút gió thế này không cản được ta!"
  ep2_tournament_events.1502.b:0 "\"Thật ra thì, chưa đến lượt ta mà, đúng không?\""
  ep2_tournament_events.1502.b.tt:0 "Ra hiệu cho tội nghiệp [contestant.GetFirstNameNoTooltip] tiến lên với tư cách người tiếp theo có thể sẽ hiệu quả..."
  ep2_tournament_events.1502.b.success:0 "Các trọng tài chấp thuận"
  ep2_tournament_events.1502.b.failure:0 "Ngài bị yêu cầu tiếp tục bắn"
  ep2_tournament_events.1502.c:1 "Có lẽ nếu ta bắn #EMP chéo#! theo hướng gió..."
  ep2_tournament_events.1502.c.success:0 "Ngài bắn trúng mục tiêu"
  ep2_tournament_events.1502.c.failure:0 "Gió quá dữ dội"

  ep2_tournament_events.1503.t:0 "$tournament_contest_header$ Chán Chường Ở Bãi Bắn"
  ep2_tournament_events.1503.desc:0 "#EMP Vút!#!\n\nMũi tên của một đấu thủ rời khỏi dây cung và cắm phập vào bia. Một tràng pháo tay lác đác vang lên. Ta tựa vào cây cung của mình, chán nản chờ tới lượt.\n\n#EMP Vút!#!\n\nLại một mũi tên trúng đích. [contestant.GetFirstName] thong thả đi lấy lại cây cung của [contestant.GetHerHis]. Ta cần tìm #EMP thứ gì đó#! để làm trong lúc chờ đợi, nếu không đầu óc ta sẽ phát điên mất."
  ep2_tournament_events.1503.a:0 "...cái dấu mốc kia trông tạm bợ thật."
  ep2_tournament_events.1503.a.tt:0 "Liệu có ai để ý nếu ta xóa nó đi và dời bia lùi lại vài bước không?"
  ep2_tournament_events.1503.a.success:0 "Ngài làm được"
  ep2_tournament_events.1503.a.failure:0 "Ngài bị bắt quả tang"
  ep2_tournament_events.1503.b:0 "Ta sẽ đi dạo một vòng nói chuyện với đám đông."
  ep2_tournament_events.1503.b.flavor:0 "Biết đâu lại nghe lỏm được chuyện gì đó?"
  ep2_tournament_events.1503.b.tt:0 "Ngài khám phá ra một [secret|E] của đấu thủ khác"
  ep2_tournament_events.1503.b.success:0 "Ngài phát hiện một bí mật"
  ep2_tournament_events.1503.b.failure:0 "Ngài tán gẫu cho đỡ chán"
  ep2_tournament_events.1503.c:0 "Đành phải chịu đựng thôi."

 # Wrestling

  ep2_tournament_events.2001.t:1 "$tournament_versus_header$ Mánh Khóe Bẩn"
  ep2_tournament_events.2001.desc:1 "[versus_contestant.GetFirstName] và ta quần thảo dưới đất, gồng mình chống lại nhau. Một thế khóa tay kéo ta vào vị trí bất lợi và bất chợt [versus_contestant.GetFirstNameNoTooltip] đè lên người ta, tìm cách kết thúc trận đấu.\n\nMặt đất đầy bụi cát dịch chuyển dưới những thân thể căng cứng, gương mặt đối thủ cà sát xuống đất khi [versus_contestant.GetSheHe] cố ghìm ta xuống. Bàn tay tự do của ta, vô thức tìm điểm tựa, nắm chặt lấy đất cát, để lại trong tay ta cả nắm bụi bẩn. Gương mặt [versus_contestant.GetHerHis] ở rất gần tay ta, gần đến mức..."
  ep2_tournament_events.2001.a:0 "Hyah!"
  ep2_tournament_events.2001.b:0 "Đây không phải cách để chiến đấu."
  ep2_tournament_events.2001.b.success:0 "Ngài vùng dậy thành công"
  ep2_tournament_events.2001.b.failure:0 "[versus_contestant.GetFirstNameNoTooltip] dễ dàng ghìm chặt Ngài"
  ep2_tournament_events.2001.a.tt:0 "Ném đất cát vào mặt [versus_contestant.GetHerHis]."

  ep2_tournament_events.2002.t:1 "$tournament_versus_header$ Thọc Mũi Vào"
  ep2_tournament_events.2002.desc:0 "[versus_contestant.GetFirstName] nện mạnh lên người ta khi cú quật của [versus_contestant.GetHerHis] khiến ta ngã nhào xuống đất. Lập tức cả hai vật lộn giành vị trí; ta cố lật [versus_contestant.GetHerHim] ra khỏi người mình, còn [versus_contestant.GetSheHe] thì tìm cách tận dụng sơ hở.\n\n[versus_contestant.GetFirstNameNoTooltip] kẹp một cánh tay của ta dưới đầu gối [versus_contestant.GetHerHis] và bắt đầu dồn ép để kết thúc trận đấu. Trong tuyệt vọng, tay còn lại của ta quờ quạng tìm bất cứ thứ gì có thể dùng được. Nửa mù vì bụi đất, ta cảm nhận được không khí, rồi đến lớp vải thô ráp của trang phục vật, và rồi bất chợt là một... khe mông?\n\nNếu ta không làm gì đó ngay, trận này coi như thua chắc. Và thế là ngón tay cái của ta duỗi ra khỏi nắm đấm..."
  ep2_tournament_events.2002.a:0 "Trong tình yêu và đấu vật thì mọi thứ đều được phép..."
  ep2_tournament_events.2002.b:0 "Ta sẽ thua trong danh dự nếu buộc phải vậy!"
  ep2_tournament_events.2002.b.tt:0 "Đến lúc vùng thoát rồi!"
  ep2_tournament_events.2002.a.tt:0 "Mọi thành viên gia đình thân cận"

  ep2_tournament_events.2003.t:1 "$tournament_versus_header$ Can Thiệp Từ Bên Ngoài"
  ep2_tournament_events.2003.desc:0 "\"Ê! Ê trọng tài!\"\n\nTa không khỏi nhẹ nhõm khi nghe thấy giọng của người Ngài [friend.GetFirstName]. Sự xao nhãng đầy phúc lành ấy khiến trọng tài bước về phía thành hố, còn đối thủ của ta [versus_contestant.GetFirstName] chần chừ chỉ trong khoảnh khắc — vừa đủ để một cú thúc khuỷu tay vào mặt làm [versus_contestant.GetHerHim] choáng váng tức thì.\n\nĐám đông không hài lòng với màn tiểu xảo này, và đủ thứ bắt đầu bay xuống hố. Trái cây, rau củ, thậm chí cả một chiếc ghế đẩu nhỏ. Quả thật, chiếc ghế ấy rơi đủ gần để ta nhặt lên, và khi trọng tài quay lưng xử lý màn cãi vã của [friend.GetFirstNamePossessiveNoTooltip], trong đầu ta nảy ra một ý nghĩ nhỏ nhoi..."
  ep2_tournament_events.2003.a:0 "\"#EMP Á!#! Trọng tài! [versus_contestant.GetSheHe|U] vừa đánh ta bằng cái đó!\""
  ep2_tournament_events.2003.b:0 "\"Lại đây, [versus_contestant.GetFirstNameNoTooltip]!\""
  ep2_tournament_events.2003.c:0 "Đủ rồi, mấy trò bẩn thỉu này."
  ep2_tournament_events.2003.a.tt:0 "Ném chiếc ghế vào tay [versus_contestant.GetFirstNamePossessiveNoTooltip], rồi ôm lấy đầu mình."
  ep2_tournament_events.2003.b.tt:0 "#EMP Rắc!#!"

  ep2_tournament_events.2004.t:1 "$tournament_versus_header$ Trận Đấu Của Khối Thịt"
  ep2_tournament_events.2004.desc:0 "Ta lại cố vòng tay ôm lấy lưng cái bụng đồ sộ của [versus_contestant.GetFirstNamePossessive], và như mọi lần, tất cả những gì [versus_contestant.GetSheHe] làm là cười lớn rồi húc ta bay thẳng vào thành hố bằng toàn bộ khối lượng khổng lồ của [versus_contestant.GetHerHis]. [versus_contestant.GetSheHe|U] sải bước về phía ta, nọng thịt rung lên, lớp mỡ cuộn sóng, trong tiếng reo hò phấn khích của đám đông.\n\nDù thân hình đồ sộ của đối thủ là một lợi thế, nhưng chắc chắn không phải tất cả khối lượng ấy đều là cơ bắp. [versus_contestant.GetFirstNameNoTooltip] bắt đầu di chuyển vòng quanh để tiếp tục thu hẹp khoảng trống của ta. Hẳn phải có cách nào đó để khai thác điểm này?"
  ep2_tournament_events.2004.a:0 "Có lẽ nếu ta buộc [versus_contestant.GetHerHim] phải di chuyển nhiều hơn..."
  ep2_tournament_events.2004.b:0 "Cứ nhấc bổng lên rồi kết thúc cho xong!"
  ep2_tournament_events.2004.c:0 "[versus_contestant.GetSheHe|U] đâu phải kẻ duy nhất có chút #EMP béo tốt#! đâu!"
  ep2_tournament_events.2004.d:0 "Một tòa tháp vĩ đại không thể đứng vững nếu thiếu nền móng."
  ep2_tournament_events.2004.e:0 "Tránh né giao đấu thì chẳng có vinh quang!"
  ep2_tournament_events.2004.d.tt.success:0 "Ngài nhắm trúng vào chân [versus_contestant.GetFirstNamePossessiveNoTooltip]"
  ep2_tournament_events.2004.d.tt.failure:0 "[versus_contestant.GetFirstName] dễ dàng chống đỡ đòn đánh của Ngài"

  ep2_tournament_events.2005.t:1 "$tournament_versus_header$ Vật Lộn Với Dục Vọng"
  ep2_tournament_events.2005.desc:0 "Khi ta vật lộn với đối thủ [versus_contestant.GetFirstName], một cú trượt nhỏ mở ra cơ hội. Một pha quật nhanh khiến [versus_contestant.GetHerHim] ngã xuống đất, nhưng [versus_contestant.GetSheHe] tiếp đất rất khéo, và chúng ta kết thúc trong tư thế ngực áp ngực. Mồ hôi chảy ròng trên cơ thể ta lẫn [versus_contestant.GetFirstNamePossessiveNoTooltip] khi cả hai giành giật vị trí, khiến chúng ta trơn tuột.\n\n#EMP Rất#! trơn, đúng hơn là vậy. Khi chúng ta tách ra sau thêm một lần ôm ghì nữa — lần này có lẽ ít tính đối kháng hơn lần trước? — ta nhận ra gương mặt [versus_contestant.GetFirstNamePossessiveNoTooltip] ửng đỏ, và ta nghi ngờ rằng đó không chỉ là vì gắng sức."
  ep2_tournament_events.2005.a:0 "\"Chúng ta có nên tiếp tục ở nơi kín đáo hơn không?\""
  ep2_tournament_events.2005.b:0 "\"Ta đang rất thích cuộc vật lộn này, [versus_contestant.GetFirstNameNoTooltip]. #EMP Rất#! thích.\""
  ep2_tournament_events.2005.c:0 "Hah! [versus_contestant.GetSheHe|U]'s let [versus_contestant.GetHerHis] guard down!"
  ep2_tournament_events.2005.b.tt.success:0 "[versus_contestant.GetFirstNameNoTooltip] có hứng thú với lời tán tỉnh của Ngài"
  ep2_tournament_events.2005.b.tt.failure:0 "[versus_contestant.GetFirstNameNoTooltip] cảm thấy được tâng bốc, nhưng lịch sự từ chối"
  ep2_tournament_events.2005.b.tt.criticalfailure:0 "Ngài hiểu sai nghiêm trọng ngôn ngữ cơ thể của [versus_contestant.GetFirstNamePossessiveNoTooltip]"

  ep2_tournament_events.2006.t:1 "$tournament_versus_header$ Kỳ Tích Sức Mạnh"
  ep2_tournament_events.2006.desc:0 "Ta giả vờ đánh sang trái rồi lao sang phải, bổ nhào vào chân [versus_contestant.GetFirstNamePossessive], nhưng [versus_contestant.GetSheHe] nhanh hơn. Chộp lấy eo ta, [versus_contestant.GetSheHe] nhấc bổng ta lên không trung trong tư thế lộn ngược, bụng [versus_contestant.GetHerHis] áp vào lưng ta, chân ta vung vẩy bất lực.\n\nTiếng reo hò vang dội bên tai khi ta vùng vẫy thoát thân, vô ích cố dùng đầu gối thúc vào đầu [versus_contestant.GetFirstNameNoTooltip]. Càng giãy giụa, ta càng cảm nhận được lực siết của đối thủ dần lỏng ra. Ta càng cố gắng hơn nữa, nhưng dường như [versus_contestant.GetFirstNameNoTooltip] đã quá đủ với những cử động quằn quại của ta và đơn giản là... thả tay.\n\nMặt đất bất ngờ lao thẳng lên phía ta. Ý nghĩ kinh hoàng cuối cùng của ta là nhận ra rằng đầu mình sẽ hứng trọn cú va chạm-\n\n#X Rắc.#!"
  ep2_tournament_events.2006.a:0 "..."

  ep2_tournament_events.2007.t:0 "Khán Giả Can Dự"
  ep2_tournament_events.2007.desc:0 "Ta đè [versus_contestant.GetFirstName] xuống, ép hai vai [versus_contestant.GetHerHis] sát mặt đất. Ta gần như làm được điều đó thì nghe thấy tiếng gọi từ một vị trọng tài đang quan sát. Phải mất một lúc ta mới nhận ra đó là quyết định có lợi cho mình, và các trọng tài đang tính cho ta một pha ngã hợp lệ!\n\nTa đứng dậy, có phần lưỡng lự, cân nhắc liệu có nên thừa nhận sai sót của họ hay không, thì âm lượng đám đông bất ngờ tăng vọt. Ta quay lại và thấy [opponent_friend.GetFirstName] xông thẳng về phía ta sau khi nhảy qua rào chắn, tay chân vung vẩy giận dữ.\n\n\"Đây là bất công! Vai của [versus_contestant.GetHerHis|U] còn chưa #EMP chạm#! đất!\" [opponent_friend.GetSheHe|U] hét lên, túm lấy cổ tay một trọng tài."
  ep2_tournament_events.2007.a:0 "Lính đâu! Tống cổ kẻ gây rối này ra ngoài!"
  ep2_tournament_events.2007.b:0 "Vai của [versus_contestant.GetHerHis|U] #EMP chắc chắn#! đã chạm đất!"
  ep2_tournament_events.2007.b.tt.success:0 "Ngài thắng trong cuộc tranh luận"
  ep2_tournament_events.2007.b.tt.failure:0 "Các trọng tài đứng về phía [opponent_friend.GetFirstNameNoTooltip]"
  ep2_tournament_events.2007.c:0 "Không, ngươi nói đúng. Không hề có pha ngã."

 # Fistfighting

  ep2_tournament_events.2501.t:0 "Lựa chọn, lựa chọn..."
  ep2_tournament_events.2501.desc:1 "A feral shoulder-bash from [versus_contestant.GetFirstName] thuds into my ribcage and I am brought to the floor, but [versus_contestant.GetSheHe] doesn't follow me into a pin. It's with good reason, too, as my fist flashes through the air where their head would have been. The feeling-out stages of this particular bout are clearly very much over.\n\nThe two of us circle cautiously, [versus_contestant.GetFirstNameNoTooltip] with a shadow of a sly grin. It is the calm before the storm, and a wily wrestler uses these moments to strategize."
  ep2_tournament_events.2501.a:1 "Tập trung vào các thế khóa đầu."
  ep2_tournament_events.2501.b:1 "Dồn lực vào các đòn vật thân người."
  ep2_tournament_events.2501.c:1 "Chỉ cần quật [versus_contestant.GetHerHim] xuống đất."
  ep2_tournament_events.2501.a.tt.criticalsuccess:0 "Ngài đánh ngã đối thủ"
  ep2_tournament_events.2501.a.tt.success:0 "Chiến thuật khá hiệu quả"
  ep2_tournament_events.2501.a.tt.failure:0 "Chiến thuật thất bại"

  ep2_tournament_events.2502.t:0 "Trật Khớp"
  ep2_tournament_events.2502.desc:1 "As I disengage from a brief clinch with [versus_contestant.GetFirstName], I catch [versus_contestant.GetHerHim] by surprise and grab [versus_contestant.GetHerHim] by the neck! Completely unprepared, [versus_contestant.GetFirstNamePossessiveNoTooltip] neck audibly cracks from the impact, the force causing [versus_contestant.GetHerHim] to scream in panic.\n\nThe crowd erupt, but the raucous cheers quickly die down to whispered confusion as I loosen my grasp. The moment my arm had made contact, a sickening #EMP pop#! signaled that all was not well, and the pain juddering through my finger confirms some manner of dislocation.\n\n[versus_contestant.GetFirstNameNoTooltip] is still gathering themselves. If I react quickly, perhaps..."
  ep2_tournament_events.2502.a:0 "Được rồi, chỉ còn một cách thôi."
  ep2_tournament_events.2502.b:0 "Nếu dùng tay còn lại, có lẽ ta vẫn thắng được..."
  ep2_tournament_events.2502.c:0 "Ta bị thương rồi! Ta phải xin thua."
  ep2_tournament_events.2502.a.tt:0 "Cố gắng nắn ngón tay về đúng khớp"
  ep2_tournament_events.2502.a.tt.success:0 "Cách chữa trị tức thời có hiệu quả"
  ep2_tournament_events.2502.a.tt.failure:0 "Ái! Chẳng đỡ chút nào!"
  ep2_tournament_events.2502.b.tt:0 "Tiếp tục chiến đấu!"

  ep2_tournament_events.2503.t:0 "Cái Nháy Mắt Yếu Nhất"
  ep2_tournament_events.2503.desc:1 "Một cánh tay siết chặt lấy đầu ta, và ta đáp trả bằng một cú chỏ hiểm vào bụng [versus_contestant.GetFirstNamePossessive]. Ta thoát khỏi vòng kìm kẹp của [versus_contestant.GetHerHis], lao vào một thế vật của riêng mình, và chúng ta khóa chặt lấy nhau, tay chân quấn chặt, hơi thở gấp gáp.\n\nTrong lúc giằng co, ta thoáng thấy một nụ cười hiện lên trên gương mặt đối thủ. [versus_contestant.GetSheHe] đang cười vì điều gì—\n\n#EMP Áaaa!#! #EMP MẮT TA!#! Ngón tay cái của [versus_contestant.GetFirstNamePossessiveNoTooltip] cắm thẳng vào hốc mắt ta, và phải cần một cú đánh mạnh vào mặt mới đẩy được [versus_contestant.GetHerHim] ra. Ta lảo đảo lùi lại, hai tay che con mắt bị thương, đối thủ mờ nhạt đang tiến về phía ta."
  ep2_tournament_events.2503.a:0 "Muốn chơi theo kiểu đó sao?!"
  ep2_tournament_events.2503.b:0 "Trọng tài! #EMP Trọng tài!#!"
  ep2_tournament_events.2503.c:0 "Ngươi sẽ không thoát đâu!"
  ep2_tournament_events.2503.d:0 "Đồ [versus_contestant.Custom2('InsultAdjective', ROOT.Char)] [versus_contestant.Custom2('InsultNoun', ROOT.Char)]! Lại đây để ta đánh ngươi!"
  ep2_tournament_events.2503.a.tt:0 "Ngài chọc ngược vào mắt [versus_contestant.GetHerHim] để trả đũa!"
  ep2_tournament_events.2503.b.tt.success:0 "[versus_contestant.GetFirstNameNoTooltip] bị xử thua"
  ep2_tournament_events.2503.b.tt.failure:0 "Trận đấu vẫn được tiếp tục"
  ep2_tournament_events.2503.c.tt:0 "Ngài tiếp tục chiến đấu!"

  ep2_tournament_events.2504.t:0 "Hành Vi Phản Cảm"
  ep2_tournament_events.2504.desc:1 "Ta quay phắt lại đối thủ [versus_contestant.GetFirstName] và khóa chặt [versus_contestant.GetHerHim] trong một thế ghì đầu. Ta siết chặt hơn, nhưng [versus_contestant.GetSheHe] dường như lại #EMP thích thú#! với sự tiếp xúc này. Ta quật [versus_contestant.GetHerHim] xuống đất, nhưng [versus_contestant.GetFirstNameNoTooltip] chỉ buông lỏng cơ thể và mặc kệ, một tia điên loạn bắt đầu lóe lên trong đôi mắt hoang dại của [versus_contestant.GetHerHis].\n\nTa nhanh chóng hạ người để ghì đè, nhưng đột nhiên đối thủ trở thành một cơn lốc chuyển động, đánh bật ta sang một bên, để ta nằm sõng soài trên sàn. Thay vì ghì đè, [versus_contestant.GetSheHe] cưỡi lên người ta và bắt đầu nện những cú đấm vào mặt ta! Trong tuyệt vọng, ta tung một cú đấm mạnh trúng thái dương [versus_contestant.GetHerHis], nhưng đáp lại, cái miệng đầy bọt mép của [versus_contestant.GetHerHis] há ra, lao tới và—\n\n#EMP \"Aaaaaarrrghh! Mũi ta!#!\""
  ep2_tournament_events.2504.a:1 "Tống cổ Bạn ta ra khỏi sàn đấu ngay!"
  ep2_tournament_events.2504.b:0 "Gọi ngự y của ta!"
  ep2_tournament_events.2504.c:0 "Ai đó, tìm một thầy thuốc!"
  ep2_tournament_events.2504.a.tt:0 "[versus_contestant.GetFirstNameNoTooltip] lập tức bị xử thua, và Ngài tiếp tục đi tiếp trong giải đấu"
  ep2_tournament_events.2504.b.tt:0 "Quên giải đấu đi, Ngài cần thầy thuốc!"
  ep2_tournament_events.2504.b.tt.criticalsuccess:0 "[physician.GetFirstNameNoTooltip] chữa trị kỳ diệu"
  ep2_tournament_events.2504.b.tt.success:0 "[physician.GetFirstNameNoTooltip] cứu được chiếc mũi của Ngài"
  ep2_tournament_events.2504.b.tt.failure:0 "Ngay cả sự chữa trị của [physician.GetFirstNamePossessiveNoTooltip] cũng không cứu nổi mũi Ngài"
  ep2_tournament_events.2504.c.tt:0 "Một người đưa tin được phái đi tìm một $court_physician_court_position$ mới"

  ep2_tournament_events.2505.t:0 "Hứng Chịu Đòn Nặng"
  ep2_tournament_events.2505.desc:1 "Cánh tay ta đau nhức, cơ bắp rã rời.\n\nKhông chỉ là cổ, nơi đã chịu đựng vô số thế khóa chặt. Không chỉ là thân mình, gần như đã bị đánh cho mềm nhũn. Không, #EMP chính đôi tay ta#! mới là thứ cảm giác như vừa bị một đội ngựa do [ROOT.Char.GetFaith.DevilName] điều khiển giẫm nát. Niềm an ủi duy nhất của ta, khi nhìn [versus_contestant.GetHerHim] qua hơi thở đứt quãng và con mắt mờ nhòe, là đối thủ [versus_contestant.GetFirstName] cũng chẳng khá hơn ta là bao.\n\nCả hai lảo đảo tiến lại gần nhau lần nữa, máu nhỏ giọt từ những vết rách. Chúng ta vừa gần chạm tới nhau thì bị kéo tách ra, các trọng tài lo lắng vây quanh. Họ đang đề nghị... một trận hòa?"
  ep2_tournament_events.2505.a:0 "Một trận đấu ngang tài ngang sức không cần phải có kẻ thua."
  ep2_tournament_events.2505.b:1 "Hòa ư?! Các ngươi sẽ phải lôi xác ta ra khỏi sàn đấu!"
  ep2_tournament_events.2505.b.tt.success:0 "Ngài thắng trận đấu"
  ep2_tournament_events.2505.b.tt.failure:0 "[versus_contestant.GetFirstNameNoTooltip] thắng trận"
  ep2_tournament_events.2505.b.tt.doublefailure:0 "Cả hai gục xuống vì kiệt sức"
  ep2_tournament_events.2505.b.tt.sadistic:0 "Tất cả các cận thần và khách mời có đặc tính [GetTrait('sadistic').GetName( GetNullCharacter )]"
  ep2_tournament_events.2505.b.tt.notsadistic:0 "Tất cả các cận thần và khách mời không có đặc tính [GetTrait('sadistic').GetName( GetNullCharacter )]"

  ep2_tournament_events.2506.t:0 "Một Góc Nhìn Mới"
  ep2_tournament_events.2506.desc:2 "Né một thế vật, hụt đòn phản công...\n\nTa cố gắng trả đòn tương xứng, nhưng tất cả những gì ta có thể làm chỉ là cầm cự trước những nỗ lực điên cuồng của [versus_contestant.GetFirstNamePossessive] nhằm khóa chặt ta. Né một đòn, phản công một đòn khác, lao sang bên, nhưng rồi [versus_contestant.GetSheHe] chộp được ta.\n\nThế khóa đầu siết chặt cổ ta như một con rắn khổng lồ khi bàn tay [versus_contestant.GetHerHis] bẻ nó theo hướng ngược lại, như thể đang kết liễu một con thú. Ta không thể thở, mắt như muốn bật khỏi hốc, máu dồn lên mặt nóng ran, cổ kêu răng rắc như một cành cây khô.\n\n#X Rắc.#!\n\nThế giới chuyển sang một màu xám xịt. Cơ thể ta co giật.\n\nTa nằm sấp, nhìn lên bầu trời."
  ep2_tournament_events.2506.a:0 "#DIE2 ...ựck!#!"

  ep2_tournament_events.2507.t:0 "Những Cú Đòn Làm Choáng Váng"
  ep2_tournament_events.2507.desc:1 "There is nothing like a good wrestle to truly bring the senses to life. Everything is sharper, brighter, more distinct in sound and sight and smell. It's enough to make a [ROOT.Char.GetWomanMan] feel superhuman! And perhaps depriving one of a sense would do the opposite...\n\nI contemptuously weave left to avoid an incoming grapple from [versus_contestant.GetFirstName] and, as [versus_contestant.GetSheHe] recoils, unleash a mighty two-handed clubbing blow to both sides of [versus_contestant.GetHerHis] head.\n\n[versus_contestant.GetFirstNameNoTooltip] bellows in agony, trickles of blood rolling out of [versus_contestant.GetHerHis] ears. It's clear this bout is coming to a quick conclusion, but the wild attempts at a grapple being thrown in my vague direction imply [versus_contestant.GetFirstNameNoTooltip] is going to get [versus_contestant.GetHerHis] revenge or be felled trying."
  ep2_tournament_events.2507.a:0 "...làm lại lần nữa."
  ep2_tournament_events.2507.b:0 "Kết thúc nhanh gọn thôi."
  ep2_tournament_events.2507.b.tt:0 "Chiến thắng đã nằm chắc trong tay, nhưng kết thúc nhanh vẫn là nhân từ."
  ep2_tournament_events.2507.c:0 "\"Ta nghĩ ngươi đủ rồi đấy, [versus_contestant.GetFirstNameNoTooltip].\""
  ep2_tournament_events.2507.c.success:0 "Ngài thuyết phục được [versus_contestant.GetFirstNameNoTooltip] xin thua"
  ep2_tournament_events.2507.c.failure:0 "[versus_contestant.GetFirstNameNoTooltip] tiếp tục cuộc tấn công vô vọng của mình"
 
 ### Jousting Events

  ep2_tournament_events.3501.t:2 "Đấu Thương Để Thu Hút Chú Ý"
  ep2_tournament_events.3501.desc:1 "A blur of motion, a sonorous crack, and the training quintain swings wildly again. The young $knight_culture_player_no_tooltip_lowercase$ who set it in motion gallops through unscathed, and [knight1.GetSheHe] salutes victoriously. Salutes victoriously #EMP at me#!, I realize, as [knight1.GetSheHe] finishes [knight1.GetHerHis] flourishes with a short bow from the saddle.\n\n#EMP Clunk!#! Another knight has taken on the quintain. Similarly skilled, the whirling beam misses [knight1.GetHerHim] handsomely, both [knight2.GetWomanMan] and steed comfortably through. [knight2.GetSheHe|U] curbs [knight2.GetHerHis] horse right next to the first $knight_culture_player_no_tooltip_lowercase$ and flourishes [knight2.GetHerHis] weapon pompously, again in my direction. The pair raise their visors, and even from this distance away I can see them glower at each other."
  ep2_tournament_events.3501.a:0 "[knight1.GetFirstNameNoTooltip] có vẻ rất thiện chiến."
  ep2_tournament_events.3501.b:0 "[knight2.GetFirstNameNoTooltip] hẳn là lựa chọn sáng giá."
  ep2_tournament_events.3501.c:1 "Kẻ chiến thắng sẽ nhận được ân sủng của ta!"
  ep2_tournament_events.knight_1_wins:0 "[knight1.GetFirstName] chiến thắng!"
  ep2_tournament_events.knight_2_wins:0 "[knight2.GetFirstName] chiến thắng!"
  ep2_tournament_events.3501.d:0 "Đủ rồi! Thật trẻ con."

  ep2_tournament_events.3502.t:2 "Thảm Họa Công Trình"
  ep2_tournament_events.3502.desc:1 "Thịch. Thịch. Thịch. Những tiếng nứt không đều của thương gãy tạo nên một nhịp nền cho các cú va chạm nặng nề của hình nhân.\n\nThịch. Thịch. #EMP Thụp.#! Nhiều kỵ sĩ nữa thử sức, nhưng bỗng nhiên có điều gì đó không ổn. Cú va chạm vừa rồi nghe có vẻ khác thường—\n\n[competitor.GetFirstName] lao tới hình nhân, và cú đánh khủng khiếp mà [competitor.GetSheHe] tung ra làm toàn bộ cấu trúc vỡ vụn. Cột trụ lộn vòng văng xa trên mặt đất, bản thân kết cấu chao đảo dữ dội trước khi đổ sập xuống với một tiếng rầm."
  ep2_tournament_events.3502.a:0 "Ai chịu trách nhiệm chuyện này?! Tìm ra và trừng phạt hắn!"
  ep2_tournament_events.3502.b:0 "Một giải đấu được bảo trì thật đáng xấu hổ."
  ep2_tournament_events.3502.c:0 "Ta sẽ chi trả việc sửa chữa."
  ep2_tournament_events.3502.d:0 "Một cú đánh ấn tượng, [competitor.GetFirstNameNoTooltip]!"

  ep2_tournament_events.3503.t:1 "$tournament_header$ $knight_culture_player_no_tooltip$ Xui Xẻo"
  ep2_tournament_events.3503.desc:1 "The crowd are rumbling strangely, as if half are groaning and the other half... elated? I peer through the assorted ranks of competitors and let out an involuntary sigh myself. [hapless_knight.GetFirstName] has spent the entire training so far missing the target handsomely, and is preparing for another tilt now.\n\nAs [hapless_knight.GetSheHe] approaches it, [hapless_knight.GetSheHe] drops [hapless_knight.GetHerHis] lance entirely. Panicking, [hapless_knight.GetFirstNameNoTooltip] looks up in time to be #EMP clobbered#! in the midriff by the quintain! [hapless_knight.GetHerHis|U] arms go out and grab wildly on to the pole, but momentum carries [hapless_knight.GetHerHim] through. A few seconds later [hapless_knight.GetSheHe] swings on the end of the pole helplessly, stranded in midair."
  ep2_tournament_events.3503.a:0 "Một món quà tuyệt vời cho hài kịch hình thể!"
  ep2_tournament_events.3503.a.tt.success:0 "[hapless_knight.GetFirstNameNoTooltip] chấp nhận lời mời phục vụ của Ngài"
  ep2_tournament_events.3503.a.tt.failure:0 "[hapless_knight.GetFirstNameNoTooltip] khó chịu với lời đề nghị"
  ep2_tournament_events.3503.b:0 "[hapless_knight.GetSheHe|U] đang bôi nhọ môn thể thao này! Cấm [hapless_knight.GetHerHim]!"
  ep2_tournament_events.3503.b.tt.success:0 "[hapless_knight.GetFirstNameNoTooltip] bị loại khỏi giải đấu vì làm mất uy tín"
  ep2_tournament_events.3503.b.tt.failure:0 "[hapless_knight.GetFirstNameNoTooltip] manages to plead [hapless_knight.GetHerHis] case successfully"
  ep2_tournament_events.3503.c:0 "Thú thật là ta khá thích [hapless_knight.GetHerHim]."
  ep2_tournament_events.3503.d:0 "Ha! #EMP Ha!#!"

  ep2_tournament_events.3504.t:0 "Quá Chậm"
  ep2_tournament_events.3504.desc:0 "Khi còn nhỏ, vị huấn luyện viên già từng dạy ta rằng hơi thở cuối cùng phải thoát ra ngay trước khoảnh khắc mũi thương va chạm.\n\nMột bước, hai bước, ba bước. Đi, phi nước kiệu. Hạ thương, chỉnh lại, ngắm mũi. Hít vào, thở ra, đánh trúng.\n\nThành công! Thương của ta vỡ vụn, nhưng ta nhận ra — quá muộn — rằng ngựa của ta vẫn chỉ đang phi nước kiệu, chứ chưa lao nước đại. Cơn đau ập đến ngay tức khắc khi chùy ở đầu cột #X nện#! thẳng vào lưng ta, hất ta văng khỏi yên.\n\nTa lơ lửng giữa không trung, thế giới như đứng yên. Ôi, vị huấn luyện viên già hẳn sẽ cau mày nếu ta làm điều gì đó không hoàn hảo...\n\nThế giới lại chuyển động. Mặt đất lao tới, và rồi tất cả chìm vào bóng tối."
  ep2_tournament_events.3504.a:0 "..."

 ### Joust Events

  ep2_tournament_events.4001.t:1 "$tournament_versus_header$ Bị Rạch Thịt"
  ep2_tournament_events.4001.desc:0 "Tiến đến vạch xuất phát, hạ thương, ngả lưng trên yên, chờ hiệu lệnh, nghiêng người về trước, ngắm-\n\nTrình tự của một cuộc đấu thương giờ đây gần như đã trở thành phản xạ với ta, nhưng khi hai cú va chạm đồng thời dội qua người, một cơn đau sắc lạnh, bỏng rát bùng lên dọc cánh tay ta.\n\nMáu tuôn ra không ngừng từ một vết thương đỏ tươi trên bắp tay, ngọn thương của đối thủ [versus_contestant.GetFirstNamePossessive] đã rạch một đường tàn nhẫn dọc theo cánh tay trên của ta.\n\nĐây là một vết thương nghiêm trọng. Sẽ chẳng ai dám gọi ta là hèn nhát nếu ta rút lui, và thực tế là vài gia nhân đầy lo lắng đang khăng khăng yêu cầu ta làm như vậy."
  ep2_tournament_events.4001.a:0 "Đỡ ta lên ngựa!"
  ep2_tournament_events.4001.a.tt:0 "Tất cả [courtiers|E] và [guests|E] nhận được #COLOR_GREEN 10#! thiện cảm với Ngài"
  ep2_tournament_events.4001.b:0 "Ta không yếu ớt đến thế."
  ep2_tournament_events.4001.c:0 "Biết dừng đúng lúc mới là dũng cảm."

  ep2_tournament_events.4002.t:1 "$tournament_versus_header$ Ngã Ngựa"
  ep2_tournament_events.4002.desc:0 "Thunk! A sonorous crash of wood against wood signals my aim to be true, and the force behind it is such that [versus_contestant.GetFirstName] reels precipitously before crashing to the ground. I curb my horse at the end of its run and peer down at my adversary.\n\n[versus_contestant.GetFirstNameNoTooltip] hauls [versus_contestant.GetHerHim]self to an upright position, seemingly just winded rather than injured, but [versus_contestant.GetHerHis] shield lies rent in two on the ground near [versus_contestant.GetHerHim]. [versus_contestant.GetSheHe|U] regards it sorrowfully as a valet collects the pieces, adding them to a small pile I recognize as being [versus_contestant.GetHerHis] primary - and presumably only other - shield."
  ep2_tournament_events.4002.a:0 "Gia nhân! Mang cho [versus_contestant.GetWomanMan] này một chiếc khiên dự phòng của ta!"
  ep2_tournament_events.4002.b:0 "Ngươi có bị thương không? Để ta đỡ ngươi dậy!"
  ep2_tournament_events.4002.c:0 "Đó là bản chất của đấu thương."

  ep2_tournament_events.4003.t:1 "$tournament_versus_header$ Thân Gỗ Khổng Lồ"
  ep2_tournament_events.4003.desc:0 "Ta đang cho ngựa bước nước kiệu về vạch xuất phát thì bỗng khựng lại, nheo mắt nhìn. Trừ khi mắt ta lừa dối ta, một cảnh tượng thực sự kỳ quái đang diễn ra ở đầu kia của bãi đấu.\n\nCác gia nhân của đối thủ [versus_contestant.GetFirstNamePossessive] đang chật vật nâng ngọn thương đưa cho [versus_contestant.GetHerHim], và điều đó hoàn toàn có lý do. Vũ khí khổng lồ kia chẳng khác nào một thân cây bị bật gốc, một trục gỗ đồ sộ dài bằng hai người trưởng thành.\n\nTa chết lặng nhìn [versus_contestant.GetFirstNameNoTooltip] hất ngọn thương lên đầy đắc ý, tựa nó vào cổ ngựa để giữ thăng bằng. Đám đông rì rầm với đủ loại cảm xúc — vừa háo hức, vừa bất bình — có người đòi cho phép, kẻ khác thì phản đối sự bất công."
  ep2_tournament_events.4003.a:0 "Chuyện này sao có thể cho phép được?!"
  ep2_tournament_events.4003.a.tt:0 "Giờ thì vị trọng tài gần nhất ở đâu?"
  ep2_tournament_events.4003.b:0 "Thật sao? Ngươi chắc mình muốn thắng theo cách này chứ?"
  ep2_tournament_events.4003.b.tt.win:0 "Ngài thuyết phục được [versus_contestant.GetHerHim]"
  ep2_tournament_events.4003.b.tt.lose:0 "Ngài không thể thuyết phục được [versus_contestant.GetHerHim]"
  ep2_tournament_events.4003.c:0 "Cái mầm cây quá cỡ đó không cứu được ngươi đâu!"
  ep2_tournament_events.4003.c.tt.win:0 "Ngài vượt qua bất lợi của mình"
  ep2_tournament_events.4003.c.tt.lose:0 "Ngọn thương của [versus_contestant.GetFirstNamePossessiveNoTooltip] quá đáng sợ để chống lại"

  ep2_tournament_events.4004.t:1 "$tournament_versus_header$ Rắc Rối Dưới Chân"
  ep2_tournament_events.4004.desc:0 "I push away the usual nervousness before a joust by busying myself checking and re-checking my various equipment. As I do so, however, I become aware of a presence beside me. My opponent [versus_contestant.GetFirstName] is, curiously, on foot. Sword resting on [versus_contestant.GetHerHis] shoulder, [versus_contestant.GetSheHe] leans forward to speak in a somewhat conspiratorial tone.\n\n"[ROOT.Char.GetFirstName]! How would you like to stretch your legs with me?" [versus_contestant.GetSheHe] booms. In response to my nonplussed expression, [versus_contestant.GetSheHe] laughs and points at the ground.\n\n"How about we do this round on foot, eh? A small break to give the crowd something different?""
  ep2_tournament_events.4004.a:0 "Ta thắng ngươi thế nào cũng được!"
  ep2_tournament_events.4004.a.success:0 "Ngài đánh bại [versus_contestant.GetFirstNameNoTooltip] bằng lưỡi kiếm"
  ep2_tournament_events.4004.a.failure:0 "Ngài không thể vượt qua [versus_contestant.GetFirstNameNoTooltip]"
  ep2_tournament_events.4004.b:0 "Lên ngựa ngay, đồ ngu."
  ep2_tournament_events.4004.c:0 "Đi bộ thì được. Nhưng là #EMP với#! thương."

  ep2_tournament_events.4005.t:1 "$tournament_versus_header$ Một [versus_contestant.GetWomanMan|U] Danh Dự?"
  ep2_tournament_events.4005.desc:0 "My opponent [versus_contestant.GetFirstNamePossessive] forearm lolls ineffectually as [versus_contestant.GetSheHe] takes [versus_contestant.GetHerHis] stance. A grimace turns into a stifled gasp of pain as [versus_contestant.GetSheHe] attempts to lift [versus_contestant.GetHerHis] lance. Clearly the last round has taken a severe toll.\n\nI watch with some wonderment as [versus_contestant.GetFirstNamePossessiveNoTooltip] valets heave the lance into position, strapping it to [versus_contestant.GetHerHis] upper arm. It appears the need to demonstrate their honor leads my adversary to continue to compete, but there's no hope of them winning.\n\nI salute with my own lance in response as the crowd cheers us both."
  ep2_tournament_events.4005.a:0 "Chỉ có thể đáp lại bằng toàn lực của ta."
  ep2_tournament_events.4005.a.tt:0 "Ngài đấu thương với họ như với bất kỳ đối thủ nào khác."
  ep2_tournament_events.4005.b:0 "Danh dự cần được đáp lại bằng danh dự!"
  ep2_tournament_events.4005.b.tt:0 "Ngài ban cho đối thủ một lượt nhân nhượng, giương thương lên trời."
  ep2_tournament_events.4005.c:0 "Cơ hội hoàn hảo!"
  ep2_tournament_events.4005.c.tt:0 "Ngài quét thương thành một vòng rộng, chắc chắn hất đối thủ khỏi yên ngựa."

  ep2_tournament_events.4006.t:1 "$tournament_versus_header$ Nhân Nhượng"
  ep2_tournament_events.4006.desc:0 "The two horses break into a trot. My lance begins to descend to its position, but I see no similar movement from my adversary [versus_contestant.GetFirstName]. Instead, [versus_contestant.GetHerHis] lance points away from me, far off-target.\n\nThe 'mercy pass' is well-known amongst those that are familiar with jousting; once the pass has begun, deliberately aiming away from your opponent will signal you would like to appeal for a reset. It is a matter of respect for one's competitors to comply with that request.\n\nOf course, this is only if you #EMP see#! your opponent's wish..."
  ep2_tournament_events.4006.a:0 "Ta không nhận chiến thắng dễ dàng."
  ep2_tournament_events.4006.a.tt:0 "Tôn trọng mong muốn nhân nhượng của [versus_contestant.GetFirstNamePossessiveNoTooltip]."
  ep2_tournament_events.4006.b:0 "Ồ, hình như ta không hề để ý thấy tín hiệu đó!"
  ep2_tournament_events.4006.b.tt:0 "Ngài không để ngọn thương chệch hướng."

  ep2_tournament_events.4007.t:1 "$tournament_versus_header$ Họa Và Người Hầu"
  ep2_tournament_events.4007.desc:0 "[versus_contestant.GetFirstName|U] walks by me on [versus_contestant.GetHerHis] horse after a pass, busying [versus_contestant.GetHerHim]self with [versus_contestant.GetHerHis] animal's bridle. Shuffling along beside is [versus_contestant.GetHerHis] groom. [groom.GetSheHe|U] is dressed in surprisingly tatty clothing, the material fraying at the seams.\n\n"What is your name, my [groom.GetWomanMan]?" [groom.GetSheHe|U] looks up, startled, as [groom.GetHerHis] liege and horse carry on without [groom.GetHerHim].\n\n"[groom.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]." In the midst of [groom.GetHerHis] reply, it's impossible to miss [groom.GetHerHis] envious glance at [groom.GetHerHis] smartly-presented counterpart attending to my horse."
  ep2_tournament_events.4007.a:0 "Thật là một sinh vật đáng thương!"
  ep2_tournament_events.4007.b:0 "Ngươi có muốn một công việc không?"
  ep2_tournament_events.4007.b.tt:0 "[versus_contestant.GetFirstNameNoTooltip] sẽ không thích chuyện này..."
  ep2_tournament_events.4007.c:0 "Hay là ngươi muốn kiếm chút tiền?"
  ep2_tournament_events.4007.c.tt:0 "Thuyết phục [groom.GetHerHim] vỗ mạnh vào mông ngựa."
  ep2_tournament_events.4007.d:0 "Phục vụ lãnh chúa của ngươi cho tốt, [groom.GetFirstNameNoTooltip]."

  ep2_tournament_events.4008.t:1 "$tournament_versus_header$ Ngươi Là Ai?"
  ep2_tournament_events.4008.desc:0 "Khi tiếng ồn từ khán đài đổ xuống như thác, con ngựa của ta giật tai đầy bất an. Ta vỗ nhẹ lên bờm nó để trấn an. Đám đông tỏ ra đặc biệt thù địch trong hiệp này. Quả thật, khi ta nhìn quanh, họ đồng loạt cất tiếng hát.\n\n#EMP [ROOT.Char.Custom('GetNegativeChant')]#!\n\nMột vài kẻ còn nghiêng người qua rào chắn, những khuôn mặt gào thét đầy bọt nước bọt ở hàng đầu khiến ta không khỏi rùng mình."
  ep2_tournament_events.4008.a:0 "Họ sẽ phải chấp nhận chiến thắng của ta!"
  ep2_tournament_events.4008.a.success:0 "Ngài thành công gạt bỏ sự lăng mạ của đám đông"
  ep2_tournament_events.4008.a.failure:0 "Đám đông khiến Ngài phân tâm"
  ep2_tournament_events.4008.a.criticalfailure:0 "Ngài bị thương nhẹ do đám đông ném đồ vào"
  ep2_tournament_events.4008.b:0 "Có lẽ chiến thắng không phải lựa chọn khôn ngoan..."
  ep2_tournament_events.4008.b.tt:0 "Cố tình thua cuộc."

  ep2_tournament_events.4009.t:1 "$tournament_versus_header$ Hiệp Sĩ Nghèo Khó"
  ep2_tournament_events.4009.desc:0 "Rắc! Hai ngọn thương vỡ vụn dữ dội khi va chạm. Ta lăn người theo đà phản lực như đã được dạy, gượng dậy khi ngựa chậm lại. Khi lắc đầu xua đi cơn choáng, sự náo động ngày càng tăng trong đám đông khiến ta ngoái nhìn lại phía sau.\n\nĐối thủ của ta, [versus_contestant.GetFirstName], rõ ràng đang gặp rắc rối. Không phải về thể xác, mà là [versus_contestant.GetSheHe] đang tranh cãi — hay thương lượng — với một gia nhân khốn khổ. Tiến lại gần, ta nghe được vài mẩu đối thoại.\n\n\"Ý ngươi là sao không còn cái nào nữa? Ngươi #EMP làm mất#! chiếc dự phòng duy nhất của chúng ta ư?!\""
  ep2_tournament_events.4009.desc.poor:0 "\n\nPhải mất một lúc ta mới nhận ra. Có lẽ những lời đồn về tình cảnh tài chính hiện tại của [versus_contestant.GetFirstNamePossessiveNoTooltip] không phải vô căn cứ..."
  ep2_tournament_events.4009.desc.lowborn:0 "\n\nDần dần ta hiểu ra. [versus_contestant.GetFirstNameNoTooltip] không phải xuất thân quý tộc. Tiền bạc hẳn là thứ khó kiếm hơn nhiều so với những gì ta từng nghĩ..."
  ep2_tournament_events.4009.a:0 "Ha ha! Cút khỏi bãi đấu đi, đồ [versus_contestant.Custom2('InsultNoun', ROOT.Char)] nghèo mạt!"
  ep2_tournament_events.4009.b:0 "\"[versus_contestant.GetFirstNameNoTooltip]! Ta có thể cho ngươi mượn một ngọn thương không?\""
  ep2_tournament_events.4009.c:0 "Dù sao thì giải đấu vẫn phải tiếp tục."

 #### Horse Racing

  ep2_tournament_events.4500.t:0 "$tournament_header$ Kỵ Sĩ"
  ep2_tournament_events.4500.desc:0 "Con ngựa của ta đã sẵn sàng, nhưng dẫu sao thì ngựa cũng vô dụng nếu không có một kỵ sĩ đủ giỏi điều khiển nó. Vì vậy, ta đứng trước ba ứng viên tiềm năng, tất cả đều tranh nhau vinh dự được đại diện cho ta.\n\n"
  ep2_tournament_events.4500.knight:0 "The first is my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey1') )] [jockey1.GetFirstName], a fair candidate considering [jockey1.GetHerHis] experience handling horses in [jockey1.GetHerHis] profession."
  ep2_tournament_events.4500.guest:0 "Người tình nguyện thứ hai là [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey2') )] của ta, [jockey2.GetFirstName], có lẽ muốn chứng minh mình xứng đáng với sự tiếp đãi của ta."
  ep2_tournament_events.4500.nobody:0 "\n\nNgười cuối cùng hoàn toàn xa lạ với ta, một [jockey3.GetWomanMan] địa phương vô danh tiểu tốt, tên là [jockey3.GetFirstName]."
  ep2_tournament_events.4500.fallback:0 "Cả ba đều chẳng có gì nổi bật — tất cả đều là người lạ, rõ ràng chỉ là thường dân khao khát danh tiếng và tiền tài — nhưng họ là những người duy nhất có mặt."
  ep2_tournament_events.4500.a:0 "Ngươi đấy!"
  ep2_tournament_events.4500.b:0 "Có lẽ là ngươi?"
  ep2_tournament_events.4500.c:0 "Thôi thì liều một phen..."
  ep2_tournament_events.4500.knight.tt:0 "Chọn [jockey1.GetFirstNameNoTooltip]."
  ep2_tournament_events.4500.guest.tt:0 "[jockey2.GetFirstNameNoTooltip] có vẻ là lựa chọn tốt."
  ep2_tournament_events.4500.nobody.tt:0 "Sao không thử vận may với [jockey3.GetFirstNameNoTooltip]?"

 #### Recital Events

  ep2_tournament_events.5501.t:2 "$tournament_contest_header$ Khoảnh khắc bị đánh cắp"
  ep2_tournament_events.5501.desc:0 "Những tiếng reo hò cuồng nhiệt bùng nổ từ đám đông tụ tập khi [enemy.GetFirstName] kết thúc phần ngâm của [enemy.GetHerHis] bằng một động tác hoa mỹ và cúi chào. Người duy nhất không huýt sáo hay vỗ tay, tình cờ thay, lại chính là ta.\n\n#EMP Sao#! [enemy.GetSheHe] có thể biết được chứ? Đây là sắp đặt sẵn ư? Hay có lẽ, bằng cách nào đó, do một mưu mô của [ROOT.Char.GetFaith.DevilName], thì chỉ đơn giản là trùng hợp rằng những vần thơ của [enemy.GetFirstNamePossessiveNoTooltip] lại gần như #EMP giống hệt#! với của ta?\n\nCác khán giả tụ họp im lặng đầy mong đợi. Đến lượt ta."
  ep2_tournament_events.5501.a:0 "Ta sẽ cho họ thấy tất cả nằm ở #EMP cách thể hiện#!."
  ep2_tournament_events.5501.b:0 "Đến lúc ứng biến rồi!"
  ep2_tournament_events.5501.b.success:0 "Ngài ứng biến thành công"
  ep2_tournament_events.5501.b.failure:0 "Màn thể hiện của Ngài là một thảm họa"
  ep2_tournament_events.5501.c:0 "Đây là sắp đặt. Quan tòa!"
  ep2_tournament_events.5501.c.success:0 "Quả thật #EMP là#! một mưu mẹo từ [enemy.GetFirstNameNoTooltip]"
  ep2_tournament_events.5501.c.failure:0 "Mọi người đều nghĩ Ngài là kẻ ngớ ngẩn mất lý trí"

  ep2_tournament_events.5502.t:2 "$tournament_contest_header$ Chỉ là một sự hiểu lầm"
  ep2_tournament_events.5502.start:0 "Chỉ cần một câu thơ cất lên là những tiếng xì xào đã bắt đầu. [contestant.GetFirstName] đứng trên sân khấu một cách hết sức #EMP trơ trẽn#!, ngâm lại những câu từ của một khúc hát dân gian quen thuộc! Những tiếng càu nhàu bất mãn nổi lên trong đám đông khi [contestant.GetSheHe] tiếp tục.\n\n"
  ep2_tournament_events.5502.culture:0 "Có gì đó không ổn, ta trầm ngâm. Chắc chắn [contestant.GetFirstNameNoTooltip] sẽ không quen thuộc với bài hát ấy, xét rằng [contestant.GetSheHe] xuất thân từ [contestant.GetCulture.GetName]. Một ký ức nhỏ bất chợt hiện lên trong đầu ta: người thợ dựng bục diễn đã huýt sáo chính giai điệu ấy từ trước!"
  ep2_tournament_events.5502.friend:0 "Ta lập tức nhận ra chuyện gì đã xảy ra, ngay cả khi đám đông vẫn đang la ó người  Bạn củata là [contestant.GetFirstNameNoTooltip]. [contestant.GetSheHe|U] thuộc về [contestant.GetCulture.GetName], và hẳn chỉ vô tình nghe được giai điệu này mà không nhận ra nó phổ biến đến mức nào!"
  ep2_tournament_events.5502.end:0 "\n\nBack on stage, [contestant.GetFirstNameNoTooltip] meanders to a verbal halt as the crowd explodes with jeers, a few choice vegetables raining down on [contestant.GetHerHim] as [contestant.GetSheHe] shields [contestant.GetHerHim]self from the projectiles."
  ep2_tournament_events.5502.a:0 "Đủ rồi! Đây không phải lỗi của [contestant.GetHerHis]!"
  ep2_tournament_events.5502.c.success:0 "Ngài thuyết phục được đám đông"
  ep2_tournament_events.5502.c.failure:0 "Đám đông phớt lờ lời kêu gọi của Ngài"
  ep2_tournament_events.5502.b:0 "Booooo! #EMP Booooo!#!"
  ep2_tournament_events.5502.c:0 "Thật là quá mất thể diện."

  ep2_tournament_events.5503.t:1 "$tournament_contest_header$ Sợ sân khấu"
  ep2_tournament_events.5503.desc:1 "Kèn trumpet vang rền! Quần chúng reo hò náo nhiệt! Ta bước lên bục ngâm thơ, vẫy tay chào. Một khoảng lặng bao trùm khi ta đứng vào thế anh hùng, ngực ưỡn ra, hai tay dang rộng.\n\nTa mở miệng. Khô khốc. Rất, rất khô. Ta cố nói, nhưng lời không thốt ra được. Hàng trăm ánh mắt đổ dồn vào ta.\n\nSao ta không thể nói được?!"
  ep2_tournament_events.5503.rich:1 "Khi những tiếng xì xào của đám đông ngày càng dồn dập, đôi tay lóng ngóng của ta chạm vào một thứ gì đó, to và bằng da: túi tiền của ta."
  ep2_tournament_events.5503.seducer:1 "Cơn hoảng loạn khiến ta run rẩy, hơi thở dồn dập theo một cách... #EMP quen thuộc#!. Một lời nhắc nhở... rằng đam mê chưa bao giờ phản bội ta..."
  ep2_tournament_events.5503.fallback:1 "Một nút thắt trong dạ dày, chưa từng có chỉ vài khoảnh khắc trước, siết chặt đầy khó chịu, và những tiếng xì xào của đám đông ngày càng lớn."
  ep2_tournament_events.5503.a:0 "Phải có thứ gì đó ta có thể vượt qua được..."
  ep2_tournament_events.5503.a.tt:0 "May mắn thay, ta vẫn nhớ vài vần thơ cũ!"
  ep2_tournament_events.5503.b:0 "Nhìn này! Tiền miễn phí!"
  ep2_tournament_events.5503.b.tt:0 "Ta có thể nhanh chóng thoát thân khi họ tranh nhau!"
  ep2_tournament_events.5503.c:1 "Một chút #EMP hình thể#! chắc sẽ không thừa."
  ep2_tournament_events.5503.c.tt:0 "Đám khán giả sẽ #EMP thích mê#! chuyện này!"
  ep2_tournament_events.5503.d:0 "Nhìn kìa! Một con khỉ ba đầu!"
  ep2_tournament_events.5503.d.win:0 "Ngài đánh lạc hướng đám đông thành công"
  ep2_tournament_events.5503.d.lose:0 "Đám đông không bị lừa"
  ep2_tournament_events.5503.e:1 ""À-#EMP hừm#!. Như tổ tiên của chúng ta từng, ờ, h-h-hát rằng...""

  ep2_tournament_events.5504.t:2 "$tournament_contest_header$ Ý chí của thời tiết"
  ep2_tournament_events.5504.desc:0 "#BOL Rầm đooom!#!\n\nMột tia chớp lóe lên trước tiếng sấm vang rền, và khi ta tiến về phía bục cao, rõ ràng thời tiết dễ chịu trước đó đã nhường chỗ cho những điều kiện u ám hẳn. Vừa bước lên bậc đầu tiên thì mưa bắt đầu trút xuống.\n\nĐám đông đứng chờ đợi, có phần miễn cưỡng, ngày càng ướt sũng theo từng phút. Ta mở miệng, và một tiếng nổ trầm hùng khác vang dội khắp nơi tụ họp. Ta ngước nhìn lên bầu trời.\n\nĐược thôi, đây sẽ là một thử thách thực sự."
  ep2_tournament_events.5504.a:0 "...và ta #EMP yêu#! thử thách!"
  ep2_tournament_events.5504.a.success:0 "Thời tiết làm tăng thêm chất bi tráng cho lời nói của Ngài"
  ep2_tournament_events.5504.a.failure:0 "Ngài bị cơn bão lấn át"
  ep2_tournament_events.5504.b:0 "Nếu chúng ta bị sét đánh thì sao?!"

  ep2_tournament_events.5505.t:2 "$tournament_contest_header$ Chớp lấy cơ hội"
  ep2_tournament_events.5505.desc:0 "Another verse done, another smash hit with the crowd. I'm very much enjoying myself, and the noisy appreciation of the mob only lifts my spirits even higher.\n\nAs I take in some applause after a particularly witty line, I can see one of my opponents, [enemy.GetFirstName], rehearsing [enemy.GetHerHis] lines with something of a scowl on [enemy.GetHerHis] face. A further burst of ovation confirms my suspicions: [enemy.GetSheHe] is clearly less than happy with the reception I'm getting!\n\nWell then. Perhaps that"
  ep2_tournament_events.5505.start.malevirgin:0 "kẻ cô độc buồn thảm, chẳng có nổi một mối tình"
  ep2_tournament_events.5505.start.femalevirgin:0 "kẻ cô độc lùn tịt, chẳng được ai yêu"
  ep2_tournament_events.5505.start.old:0 "[enemy.GetWomanMan] già nua, héo hon"
  ep2_tournament_events.5505.start.fat:0 "tên béo nhão nhoẹt, nhầy nhụa"
  ep2_tournament_events.5505.start.soft:0 "kẻ ngốc mềm yếu, nhão nhoét"
  ep2_tournament_events.5505.start.compassionate:0 "linh hồn đáng thương"
  ep2_tournament_events.5505.start.fallback:0 "[enemy.Custom2('InsultAdjective', ROOT.Char)] [enemy.Custom2('InsultNoun', ROOT.Char)]"
  ep2_tournament_events.5505.end:0 "này cần một câu thơ chuẩn bị #EMP riêng biệt#! cho [enemy.GetHerHim]!\n\n"Nếu [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U] có mặt ở đây, hẳn [ROOT.Char.GetFaith.HighGodNameSheHe|U] sẽ nói rằng...""
  ep2_tournament_events.5505.maidenless:0 "...[enemy.GetFirstNameNoTooltip] quả là một mối tình #EMP bi thảm#!!"
  ep2_tournament_events.5505.old:0 "...ngay cả [ROOT.Char.GetFaith.HighGodNameSheHe] cũng chẳng thể ngăn được sự mục rữa của [enemy.GetFirstNamePossessiveNoTooltip]!"
  ep2_tournament_events.5505.torturer:0 "...da thịt của [enemy.GetFirstNamePossessive] đã chín muồi để lột!"
  ep2_tournament_events.5505.fat:0 "...ngay cả [ROOT.Char.GetFaith.HighGodNameSheHe] cũng chẳng thể kéo [enemy.GetFirstNamePossessiveNoTooltip] đi!"
  ep2_tournament_events.5505.idiot:0 "...[enemy.GetFirstNameNoTooltip] bốc mùi!"
  ep2_tournament_events.5505.compassionate:0 "...hãy mua cho [enemy.GetFirstNameNoTooltip] một ly, rồi [enemy.GetSheHe] sẽ đòi trả tiền!"
  ep2_tournament_events.5505.fallback:0 "...đánh bại [enemy.GetFirstNameNoTooltip] trong chuyện này chỉ là trò trẻ con!"
  ep2_tournament_events.5505.getout:0 "...thôi bỏ đi."
  ep2_tournament_events.5505.opinion.tt:0 "Mọi thành viên gia đình thân cận không có Đặc tính Sadistic:"
 
 # Honse Anchery

  ep2_tournament_events.6501.t:1 "$tournament_contest_header$ Danh vọng và Tài lộc"
  ep2_tournament_events.6501.desc:1 "Một làn gió nhẹ gợn qua bãi thi khi một thí sinh khác bắn mũi tên của họ. Đám đông tỏ ra tôn trọng và im lặng. Thành thật mà nói, hơi #EMP quá#! im lặng và tôn trọng. Ta thậm chí tưởng như nghe thấy một cái ngáp xen lẫn trong những tràng vỗ tay lịch sự khi dây cung bật lên và mũi tên trúng đích.\n\nTa tiến lên đến lượt mình. Những tiếng tán thưởng còn nhã nhặn và rời rạc hơn vang lên. Đây chẳng phải là một buổi tụ họp sôi động.\n\nKhi ta đặt mũi tên lên dây, một ý tưởng — không hẳn là hay, nhưng đầy kích thích — lướt qua đầu ta.\n\nHãy xem họ còn ngáp nổi nữa không!"
  ep2_tournament_events.6501.a:0 "Ta sẽ được ghi nhớ suốt nhiều đời!"
  ep2_tournament_events.6501.a.tt.win:1 "Ngài bắn trúng mục tiêu trong khi đứng thăng bằng một chân trên cọc rào"
  ep2_tournament_events.6501.a.tt.lose:0 "Ngài trượt chân và ngã"
  ep2_tournament_events.6501.b:0 "Ta sẽ cho họ thứ để reo hò!"
  ep2_tournament_events.6501.b.tt.win:1 "Ngài bắn trúng mục tiêu khi bịt mắt"
  ep2_tournament_events.6501.b.tt.lose:1 "Ngài bắn trượt"
  ep2_tournament_events.6501.c:0 "Nghĩ lại thì..."

  ep2_tournament_events.6502.t:1 "$tournament_contest_header$ Mất cả tay lẫn chân"
  ep2_tournament_events.6502.desc:2 "The sights and sounds of a joust are always something to behold. The clashing of lance on shield cuts through the noise of thundering hooves as waiting horses whinny and snort.\n\nIt is as I am listening keenly that another noise rings through the field. A short, sharp yelp presages the sound of a gathering commotion. I hurry over to join it.\n\nA ring of people surround [versus_contestant.GetFirstName], who has clearly fallen from [versus_contestant.GetHerHis] horse before [versus_contestant.GetHerHis] match. [versus_contestant.GetHerHis|U] arm hangs at a rather grisly angle; a small mercy, then, that [versus_contestant.GetSheHe] also appears to be quite dazed."
  ep2_tournament_events.6502.a:0 "Nào, để ta giúp ngươi đứng dậy!"
  ep2_tournament_events.6502.a.tt:0 "Đúng rồi, giúp đứng dậy. Với #EMP cánh tay#! đó..."
  ep2_tournament_events.6502.b:0 "Gọi ngự y của ta!"
  ep2_tournament_events.6502.b.tt.success:0 "[physician.GetFirstNameNoTooltip] làm rất tốt"
  ep2_tournament_events.6502.b.tt.failure:0 "[physician.GetFirstNameNoTooltip] không giúp được nhiều"
  ep2_tournament_events.6502.c:0 "Hãy tìm cho ngươi chút trợ giúp."
  ep2_tournament_events.6502.d:0 "Tên ngốc lẽ ra phải bám chặt hơn."

  ep2_tournament_events.6503.t:2 "$tournament_contest_header$ Lạc mũi"
  ep2_tournament_events.6503.desc:2 "I watch with a practiced eye as [competitor1.GetFirstName] begins [competitor1.GetHerHis] approach towards the targets. The first shot flies true and thuds home. The second was more wayward. #EMP Much#! more wayward.\n\nA shrill cry, an ungodly scream, pierces the air. The second arrow had not just missed the target but flown so far wide that it landed amidst a group of waiting competitors. Landed, indeed, in [competitor2.GetFirstName]!\n\nA crowd rounds on the stricken [competitor2.GetWomanMan]. [competitor2.GetSheHe|U] is lying on [competitor2.GetHerHis] back, clutching [competitor2.GetHerHis] wound in a vain effort to stop the blood, the arrow still embedded half a hand deep in [competitor2.GetHerHis] flesh."
  ep2_tournament_events.6503.a:0 "Tránh ra! Ta có thuốc bôi."
  ep2_tournament_events.6503.b:1 "Gọi thầy thuốc!"
  ep2_tournament_events.6503.c:0 "Chuyện này hoàn toàn không liên quan đến ta."

