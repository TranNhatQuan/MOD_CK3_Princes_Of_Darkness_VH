l_english:

  invite_to_activity_interaction:1 "Mời tham gia Hoạt động"
  invite_to_activity_accepted:0 "Lời mời được chấp nhận"
  invite_to_activity_accepted_desc:0 "[recipient.GetShortUIName] đã chấp nhận lời mời của Ngài và sẽ khởi hành ngay."
  invite_to_activity_refused:0 "Lời mời bị từ chối"
  invite_to_activity_refused_desc:0 "[recipient.GetShortUIName] đã từ chối lời mời của Ngài."
  invite_to_activity_interaction_desc:0 "Mời [recipient.GetTitledFirstNameNoTooltip|U] tham gia [activity|E] mà Ngài hiện đang chủ trì."
  invite_to_activity_reply_item_key:0 "#T Thư mời [CHARACTER.GetInvolvedActivity.GetNameNoTooltip]\n#!Người gửi: [CHARACTER.GetUIName]"
  invite_to_activity_flavor:2 "[SCOPE.sC('actor').Custom2('GetInviteToActivityFlavor', SCOPE.sC('recipient'))][SCOPE.sC('actor').Custom2('GetTournamentPrizeFlavor', SCOPE.sC('recipient'))]"
  invite_to_activity_flavor_tournament:1 "Ta đang tổ chức một giải đấu lớn tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]."
  invite_to_activity_flavor_wedding:1 "Ta rất hân hạnh mời Ngài đến"
  invite_to_activity_flavor_tour:1 "Ta trân trọng mời Ngài cùng tham gia chuyến du hành của ta khắp [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier], bắt đầu tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]."
  invite_to_activity_flavor_feast:1 "Ta trân trọng mời Ngài đến dự yến tiệc tại [ROOT.Char.Custom('FortifiedBuilding')] của ta ở [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]."
  invite_to_activity_flavor_hunt:1 "Ngài được trân trọng mời tham gia cuộc săn của ta tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] thuộc [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]."
  invite_to_activity_flavor_pilgrimage:1 "Ta trân trọng mời Ngài cùng ta tham gia chuyến hành hương tới [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]."
  invite_to_activity_flavor_playdate:1 "Xin hãy đến buổi tụ họp của ta tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]. Sẽ rất vui, và là cơ hội để gặp gỡ những đứa trẻ khác!"
  invite_to_activity_flavor_witch_ritual:1 "Đã đến lúc một lần nữa bày tỏ sự tôn kính với [ROOT.Char.GetFaith.WitchGodName], Ngài có đến [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] và cùng chia sẻ những khải thị không?"
  invite_to_activity_flavor_gruesome_festival:1 "Ta trân trọng mời Ngài đến [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] để dự một lễ hiến tế long trọng nhằm tôn vinh [ROOT.Char.GetFaith.PantheonTerm]."
  invite_to_activity_flavor_fallback:0 "Ta trân trọng mời Ngài tham gia hoạt động của ta."
  invite_to_activity_flavor_examination: "Ta trân trọng mời Ngài tham gia kỳ khảo xét của ta."
  invite_to_activity_flavor_examination_family: "Ngài được yêu cầu mang theo các thành viên gia đình để cùng tham gia kỳ khảo xét này."
  invite_to_activity_flavor_festival: "Ta sẽ rất vinh dự nếu Ngài cùng ta tham dự một dịp lễ hội tưng bừng."
  activity_location_any_game_tt:0 "Địa điểm phải có thú săn"
  activity_location_owned_or_vassal_tt:1 "[county|E] phải do Ngài nắm giữ hoặc do một [direct_vassal|E] sở hữu"
  invite_to_activity_flavor_imperial_debate: "Ta trân trọng mời Ngài đến tham dự Cuộc Tranh Biện Hoàng Gia tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]. [ROOT.Char.Custom('GetMyMovement')] sẽ giành được sự ủng hộ của đế quốc!"
  invite_to_activity_flavor_movement_debate_honorary_guest: "Sự cai trị của Ngài đối với [ROOT.Char.Custom('GetMyMovement')] đã đến hồi kết! Hãy tranh biện với ta và chứng minh Ngài đủ khả năng dẫn dắt chúng ta, nếu không ta sẽ vui vẻ nhận lấy trọng trách ấy."
  invite_to_activity_flavor_movement_debate: "Ngài được trân trọng mời tham dự Cuộc Tranh Biện của [ROOT.Char.Custom('GetMyMovementShort')] để quyết định người lãnh đạo!"


  FINALIZE_DESTINATION_SELECTION:0 "Hoàn tất [ActivityType.GetNameNoTooltip]"
  START_DESTINATION_SELECTION:0 "Chỉnh sửa [ActivityType.GetNameNoTooltip]"
  NUM_STOPS:0 "Số chặng ([GetDataModelSize( ActivityPlanner.AccessPlannedPhases )])"
  ESTIMATED_TRAVEL_TIME_NEXT_DESTINATION:0 "[TravelPlanData.GetNextDestination.GetEstimatedArrivalDate.GetTimeDiffFromNow] để di chuyển đến [Title.GetName]"
  ESTIMATED_TRAVEL_TIME_TOTAL:0 "Tổng thời gian di chuyển: [TravelPlanData.GetFinalDestination.GetEstimatedArrivalDate.GetTimeDiffFromNow]"

  tournament_invite_flavor_contestant:0 "$invite_to_activity_flavor_tournament$ Chúng ta sẽ bắt đầu với phần thi [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName]; một cơ hội để Ngài phô diễn kỹ năng trước mọi người, ta cam đoan.\n"
  tournament_invite_flavor_standard:0 "$invite_to_activity_flavor_tournament$ Chúng ta sẽ bắt đầu với phần thi [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName]; hẳn sẽ vô cùng mãn nhãn.\n"
 
  tournament_invite_flavor_bad_prizes:0 "\nĐáng tiếc là phần thưởng chỉ là những món tầm thường, nhưng cơ hội vinh quang thì vô cùng lớn!\n"
  tournament_invite_flavor_normal_prizes:0 "\nDù trọng tâm là rèn luyện kỹ năng, người chiến thắng vẫn sẽ nhận được những phần thưởng xứng đáng.\n"
  tournament_invite_flavor_good_prizes:0 "\nPhần thưởng có chất lượng tốt, nếu cơ hội giành vinh quang cá nhân vẫn chưa đủ để lôi cuốn Ngài!\n"
  tournament_invite_flavor_very_good_prizes:0 "\nTa đã đảm bảo chuẩn bị những phần thưởng thực sự tinh xảo để người chiến thắng nhận lấy!\n"
  tournament_invite_flavor_splendid_prizes:0 "\nChỉ những phần thưởng lộng lẫy bậc nhất mới được trao, những tác phẩm nghệ thuật đích thực của các nghệ nhân ưu tú nhất trong lãnh thổ của ta!\n"

  wedding_invite_flavor_betrothed:0 "Cuối cùng, thời khắc đã đến để cử hành lễ cưới long trọng của chúng ta. Ta kiên nhẫn chờ đón Ngài tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n"
  wedding_invite_flavor_host:0 "$invite_to_activity_flavor_wedding$ cử hành hôn lễ giữa [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] và ta tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n"
  wedding_invite_flavor_standard:0 "$invite_to_activity_flavor_wedding$ cử hành hôn lễ giữa [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_1').GetCharacter.GetFullName] và [ROOT.Char.GetInvolvedActivity.GetSpecialGuest('spouse_2').GetCharacter.GetFullName] tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n"

  feast_invite_flavor_honor:0 "$invite_to_activity_flavor_feast$ Ta mong Ngài sẽ là thượng khách danh dự của ta, ngồi ở vị trí trang trọng nhất trên bàn tiệc.\n"
  feast_invite_flavor_standard:0 "$invite_to_activity_flavor_feast$ Cùng nhau, chúng ta sẽ thưởng thức những hoa trái của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n"

  hunt_invite_flavor_standard:0 "$invite_to_activity_flavor_hunt$ Cùng nhau, chúng ta sẽ có một cuộc săn thật hoành tráng!\n"
  hunt_invite_flavor_legendary:0 "$invite_to_activity_flavor_hunt$ Cùng nhau, chúng ta sẽ dồn vào chân tường một [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetLegendaryColor')] [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetTitle.GetDeJureLiege.Custom('GetAnimalType')] huyền thoại!\n"
  hunt_invite_flavor_dangerous:0 "$invite_to_activity_flavor_hunt$ Cùng nhau, chúng ta sẽ hạ gục một con thú hiểm ác!\n"
  hunt_invite_flavor_falconry:0 "$invite_to_activity_flavor_hunt$ Cùng nhau, những chú chim ưng của chúng ta sẽ nhanh chóng kết liễu con mồi!\n"
  hunt_invite_flavor_nerge: "Ta đã cử những thợ săn giỏi nhất đi gom góp những dã thú hùng mạnh nhất vùng đất cho Nerge của ta. Hãy cùng ta tham gia cuộc chinh phục này!"

  NOT_activity_invite_max_num_guests:0 "Không thể thêm [CHARACTER.GetShortUIName] vào hoạt động, đã đủ chỗ!"
  REASON_NOT_A_WITCH: "Ngài không phải là Phù thủy"
