l_english:
 
#RACE EVENTS
  jason_first_race_event.1.t:0 "Một Mớ Chân Tay"
  jason_first_race_event.1.desc:1 "Đang phi nước đại, kỵ sĩ của [opponent.GetTitledFirstNamePossessive] kéo mạnh #EMP [opponent.Custom('GetContestHorseRaceName')]#! lao vào ngựa của ta cùng người cưỡi là [jockey.GetFirstName] — hay có lẽ chính #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! đã chệch hướng tông vào họ? Dù thế nào, cả nhóm xui xẻo ấy đều bị hất văng sang bên, đâm sầm vào rào chắn.\n\nNơi từng là một đàn ngựa phi nước kiệu đồng loạt, mồ hôi lấp lánh, giờ đây có hai con bật văng khỏi khối đông, người cưỡi vật lộn để kiểm soát chúng.\n\nĐoàn kỵ mã vẫn lao đi vun vút, còn hai con ngựa chao đảo nay đã tụt lại phía sau một thân ngựa."
  jason_first_race_event.1.desc.suspicious:0 "Từ giữa đám tùy tùng của [opponent.GetHerHis], [opponent.GetTitledFirstNameNoTooltip] kêu lên đầy \"kinh ngạc\"... một cách khó thuyết phục."
  jason_first_race_event.1.desc.sympathetic:0 "Từ giữa đám tùy tùng của [opponent.GetHerHis], [opponent.GetTitledFirstNameNoTooltip] kêu lên đầy kinh hoàng."
  jason_first_race_event.1.a:0 "Âm mưu! Ta đã bị lừa!"
  jason_first_race_event.1.a.tt:1 "Hành vi hung hăng này là căn cứ để loại họ khỏi cuộc đua!"
  jason_first_race_event.1.a.tt.win:1 "Hành vi \"chơi bẩn\" của [opponent.GetFirstNamePossessiveNoTooltip] khiến ngựa của họ bị loại khỏi cuộc đua"
  jason_first_race_event.1.a.tt.lose:0 "Nghe thật nhỏ nhen... chẳng ai để ý tới lời ngươi"

  jason_first_race_event.1.b:0 "Chỉ mình [opponent.GetFirstNameNoTooltip] cùng ta chia sẻ nỗi khổ lúc này."
  jason_first_race_event.1.b.tt:1 "Ngươi bày tỏ sự cảm thông chân thành với đối thủ cùng chung vận rủi."

  jason_first_race_event.1.c:2 "\"Nới cương ra, [jockey.GetFirstNameNoTooltip]!\""
  jason_first_race_event.1.c.tt:1 "Gọi to với kỵ sĩ của ngươi để thúc giục họ tiến lên!"
  jason_first_race_event.1.c.tt.win:1 "[jockey.GetFirstNameNoTooltip] giữ vững con ngựa của [jockey.GetHerHis]"
  jason_first_race_event.1.c.tt.lose:1 "[jockey.GetFirstNameNoTooltip] không thể nghe thấy ngươi"

  jason_first_race_event.1.d:1 "Tạm biệt, chiến thắng?"
  jason_first_race_event.1.d.tt:1 "Ta chỉ mong [jockey.GetFirstNameNoTooltip] vẫn bình an..."

  contest_horse_race_collision_log_title:0 "Các Kỵ Mã Va Chạm"
  contest_horse_race_collision_log:1 "Phần thi của [CHARACTER.GetShortUINamePossessive|U] và [TARGET_CHARACTER.GetShortUINamePossessive] đã chệch hướng và va vào nhau"
