l_english:
  tournament_events.8000.t:0 "Ân Huệ Cao Quý"
  tournament_events.8000.desc.intro:0 "Khi ta chuẩn bị cho trận đấu sắp tới, ta bắt gặp [favor_giver_1.GetName] đang vẫy gọi mình, giơ lên một [favor_giver_1.Custom('GetRandomFavor')] và ngỏ ý ban cho ta ân huệ của [favor_giver_1.GetHerHis]."
  tournament_events.8000.desc.mid.two:0 "\n\nChưa kịp đáp lời, [favor_giver_2.GetName] đã xuất hiện, chìa ra một [favor_giver_2.Custom('GetRandomFavor')] cho ta và khăng khăng rằng ta nên nhận ân huệ của [favor_giver_2.GetHerHis] thay vào đó!"
  tournament_events.8000.desc.mid:0 "Ta cảm thấy may mắn khi giành được sự ủng hộ và thiện cảm của [favor_giver_1.GetHerHis], và việc nhận ân huệ này sẽ thể hiện sự quan tâm của ta dành cho [favor_giver_1.GetHerHim] trong khuôn khổ tán tỉnh và tinh thần hiệp sĩ."
  tournament_events.8000.desc.outro.homo:0 "\n\nNhưng [favor_giver_1.GetSheHe] nào hay biết, [favor_giver_1.GetWomenMen] chẳng mấy khi khiến ta xiêu lòng..."
  tournament_events.8000.desc.outro:0 "\n\nSự quan tâm của [favor_giver_1.GetHerHis|U] dành cho ta dường như là chân thành, và không điều gì hiệp nghĩa hơn việc giành chiến thắng trong một trận đấu vì một [favor_giver_1.GetLadyLord] cao quý."
  tournament_events.8000.a:0 "Ta sẽ nhận, [favor_giver_1.GetTitledFirstNameNoTooltip]."
  tournament_events.8000.b:0 "[favor_giver_2.GetTitledFirstNameNoTooltip], thật là hào phóng!"
  tournament_events.8000.c:0 "Ta cần tập trung cho trận đấu."
