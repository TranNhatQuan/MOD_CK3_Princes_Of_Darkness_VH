l_english:

#HORSE RACES
  jason_race_events.1.t:0 "Ý Chí Của Đám Đông"
  jason_race_events.1.desc:0 "Từ biển người mênh mông đang theo dõi cuộc đua, đám thường dân gào thét. Những chiến binh lang bạt hô vang lời sỉ nhục, ám chỉ thô tục. Giữa tất cả, chúng ta — giới quý tộc — cười khẽ đầy căng thẳng. Ánh mắt đều hướng về đám cận vệ."

  jason_race_events.1.desc.guest_local_anger:0 "\n\n\"[host.GetTitledFirstName]!\" vang lên những tiếng gào, kèm theo các lời như “#EMP [host.Custom('GetCrime')|U]!#!”. Những kẻ giận dữ nhất chính là dân địa phương: tại [ROOT.Char.GetCurrentLocation.GetName], [host.GetFirstNameNoTooltip] đang ở giữa một dân chúng căm ghét [host.GetHerHim].\n\nĐưa mắt nhìn khắp đám đông, ta thấy đá, dao, và cả những vũ khí chiến tranh."

  jason_race_events.1.desc.host_local_anger:0 "\n\n\"[ROOT.Char.GetTitledFirstName]!\" vang lên những tiếng gào, kèm theo các lời như “#EMP [ROOT.Char.Custom('GetCrime')|U]!#!”. Những kẻ giận dữ nhất đều là dân địa phương — tại [ROOT.Char.GetCurrentLocation.GetName], ta đang ở giữa một dân chúng căm ghét chính mình.\n\nĐưa mắt nhìn khắp đám đông, ta thấy đá, dao, và cả những vũ khí chiến tranh."

  jason_race_events.1.desc.rowdy_fans:0 "\n\nSự phấn khích của cuộc đua luôn kéo đến những thành phần tệ hại nhất của lãnh thổ, với số lượng khổng lồ, kích động họ bằng những lời hứa chè chén và cờ bạc.\n\nĐôi khi, vào những ngày xui rủi, những thú vui thường lệ là không đủ: chỉ có máu mới làm họ thỏa mãn."

  jason_race_events.1.desc.end:0 "\n\nMột cuộc bạo loạn sắp nổ ra."

  jason_race_events.1.a:0 "Chỉ có ta mới có thể xoa dịu đám đông."
  jason_race_events.1.a.tt:0 "Chỉ cần những lời dỗ dành đúng mực, ta sẽ kéo sự chú ý của họ trở lại cuộc đua."
  jason_race_events.1.a.tt.win:0 "Bài diễn thuyết của Ngài làm đám đông dịu lại"
  jason_race_events.1.a.tt.race:1 "Cuộc thi tiếp tục mà không bị gián đoạn"
  jason_race_events.1.a.tt.lose:0 "Ngài không thể ngăn chặn cuộc bạo loạn"

  jason_race_events.1.b:0 "Đập tan nhuệ khí của chúng, $knights$!"
  jason_race_events.1.b.tt:0 "Và khi lau sạch máu khỏi mắt, chúng ta sẽ tiếp tục cuộc đua!"

  jason_race_events.1.c:0 "Có lẽ đám đông cần được thúc đẩy thêm một chút..."
  jason_race_events.1.c.tt:0 "Đi đi, các $knights$ của ta — khơi mào một cơn bạo lực thực sự tàn khốc!"
  jason_race_events.1.c.tt.win:0 "Các $knights$ của Ngài dẹp yên đám đông"
  jason_race_events.1.c.tt.lose:0 "Những kẻ thực thi của Ngài đã châm ngòi cho một cuộc bạo loạn kinh hoàng"
  jason_race_events.1.c.tt.lose_knights:0 "Một số $knight_culture_player_plural$ của Ngài bị [GetTrait('wounded_1').GetName( GetNullCharacter )]"

  jason_race_events.1.d:0 "Ta cần rời khỏi đây, #EMP thật nhanh#!."
  jason_race_events.1.d.tt:0 "Ai mà biết được? Có lẽ mọi thứ rồi sẽ ổn."

  jason_race_events.1.d.tt.win:0 "Bất ổn được khống chế"
  jason_race_events.1.d.tt.lose:0 "Bạo lực của đám đông lan rộng khắp vùng"

  jason_race_events.1.d.tt.leave:0 "Ngài và đoàn tùy tùng rút lui về nơi an toàn."

  contest_wound_attendees_effect:0 "Nhiều người tham dự $activity_tournament$ bị [GetTrait('wounded_1').GetName( GetNullCharacter )]"

  contest_wound_non_root_attendees_effect:0 "Nhiều người khác tham dự $activity_tournament$ bị [GetTrait('wounded_1').GetName( GetNullCharacter )]"


  jason_race_events.2.t:0 "Khúc Cua Tốc Độ"
  jason_race_events.2.desc:1 "Những con ngựa rầm rập lao dọc đường đua, thân hình đang phi nước đại bị che khuất bởi mây bụi mù mịt, những tiếng nguyền rủa và la hét của các kỵ mã không thể nghe rõ giữa tiếng vó ngựa và tiếng gầm của đám đông.\n\nDẫu vậy, Ngài vẫn nhận ra kỵ mã của mình, [jockey.GetFirstName], đang tập trung tuyệt đối vào một khúc cua đang đến rất nhanh. Khi những người khác giảm tốc để ôm cua gắt, kỵ mã của Ngài thúc ngựa hết sức.\n\nChỉ vừa đủ trong gang tấc, [jockey.GetFirstNameNoTooltip] và #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! lách qua giữa những kẻ phía trước. Một pha xử lý không tưởng — cả đám đông đồng loạt hít vào kinh ngạc!"

  jason_race_events.2.a:0 "Kỹ năng như thế nên dùng trên chiến trường!"
  jason_race_events.2.a.tt:0 "Kỵ binh của ta cần được huấn luyện để cưỡi ngựa táo bạo như vậy."

  jason_race_events.2.b:1 "Đoàn tùy tùng của ta đang thiếu một trinh sát..."
  jason_race_events.2.b.tt:1 "Một kỵ mã gan dạ như thế nên luôn đi trước chúng ta trên mọi hành trình."

  jason_race_events.2.c:1 "Khoảnh khắc đáng để kể cả nghìn lần!"
  jason_race_events.2.c.tt:1 "Thắng hay thua, không tay đua nào khác để lại ấn tượng như của ta."
