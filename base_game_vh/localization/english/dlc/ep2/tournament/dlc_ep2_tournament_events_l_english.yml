l_english:
 ##### TOURNAMENT #####

  tournament_events.0050.t:0 "Đến Giải Đấu"
  tournament_events.0050.desc:0 "Ta đã đến địa điểm tổ chức Giải đấu, tại [activity.GetCurrentPhase.GetLocation.GetName]!\n\nDù chưa phải tất cả những người vui hội đều đã có mặt, từng đoàn người vẫn lang thang khắp khung cảnh rực rỡ sắc màu, ai nấy đều mong chờ những màn phô diễn kỹ năng và sức mạnh sắp tới.\n\n"
  tournament_events.0050.murder:0 "Riêng ta thì có những tham vọng lớn lao hơn là chỉ tận hưởng niềm vui. Nếu mọi việc diễn ra đúng ý, [starting_intent.GetFirstName] sẽ không sống để chứng kiến lễ bế mạc..."
  tournament_events.0050.seduce:0 "Việc đầu tiên ta cần làm, dĩ nhiên, là chinh phục trái tim của [starting_intent.GetFirstName]!"
  tournament_events.0050.befriend:0 "Còn nơi nào thích hợp hơn thế này để ta xây dựng một Tình bạn bền chặt với [starting_intent.GetFirstName]!"
  tournament_events.0050.win:0 "Không có thời gian để lãng phí: ta phải bắt đầu chuẩn bị! Ta phải trở thành người chiến thắng, bằng bất cứ giá nào!"
  tournament_events.0050.recruit:0 "Ta đã sớm thấy không ít ứng viên đầy triển vọng để gia nhập hàng ngũ [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] của mình!"
  tournament_events.0050.relax:0 "Ít có nơi nào thích hợp để giải tỏa căng thẳng và tận hưởng như một Giải đấu, và ta sẽ tận dụng điều đó đến cùng!"
  tournament_events.0050.a:0 "Ta nóng lòng chờ nó bắt đầu!"

 # START
  tournament_events.0100.t:1 "$tournament_header$ Khai Mạc"
  tournament_events.0100.desc:0 "Cuối cùng thì giải đấu cũng đã đến!\n\n"
  tournament_events.0100.host:0 "Rất đông người đã đổ về lãnh địa của ta tại [activity.GetCurrentPhase.GetLocation.GetName], háo hức chứng tỏ giá trị bản thân hoặc đơn giản là thưởng thức quang cảnh."
  tournament_events.0100.contestant:0 "Giống như nhiều người khác tụ hội tại [activity.GetCurrentPhase.GetLocation.GetName], mong chờ những cuộc thi sắp diễn ra, ta bận rộn giao thiệp và chuẩn bị trang bị của mình."
  tournament_events.0100.spectator:0 "Rất đông người đã đổ về lãnh địa của [host.GetTitledFirstNamePossessive] tại [activity.GetCurrentPhase.GetLocation.GetName], vừa để tranh tài, vừa — như ta — để thưởng thức."
  tournament_events.0100.closing:1 "\n\nMặt trời dần lên cao trên bầu trời, bóng đổ cũng ngắn lại. Nếu ta muốn tham gia cuộc thi [activity.GetCurrentPhase.GetPhase.GetName], ta phải đảm bảo mình đủ điều kiện. Mọi thứ sắp bắt đầu."
  tournament_events.0100.a:0 "Không thể chần chừ!"

 # END
  tournament_events.0150.t:1 "$tournament_header$ Kết Thúc"
  tournament_events.0150.desc:0 "Mặt trời lặn xuống vào ngày cuối cùng của Giải đấu, và đám đông đông đúc bắt đầu tản đi. Ta trầm ngâm suy ngẫm về kết quả:\n\n"
  tournament_events.0150.melee:0 "Đội của [melee_winner.GetTitledFirstNamePossessive|U] đã giành chiến thắng trong trận Hỗn Chiến.\n"
  tournament_events.0150.melee_self:0 "Đội của ta đã giành chiến thắng trong trận Hỗn Chiến.\n"
  tournament_events.0150.archery:0 "[archery_winner.GetTitledFirstName|U] là người có khả năng ngắm bắn xuất sắc nhất trong phần Bắn Cung.\n"
  tournament_events.0150.archery_self:0 "Ta là người có khả năng ngắm bắn xuất sắc nhất trong phần Bắn Cung.\n"
  tournament_events.0150.recital:0 "Khả năng thi ca bậc thầy của [recital_winner.GetTitledFirstNamePossessive|U] đã giúp họ trở thành người chiến thắng xứng đáng trong phần Ngâm Thơ.\n"
  tournament_events.0150.recital_self:0 "Khả năng thi ca bậc thầy của ta đã giúp ta trở thành người chiến thắng xứng đáng trong phần Ngâm Thơ.\n"
  tournament_events.0150.joust:0 "[joust_winner.GetTitledFirstName|U] đã bẻ gãy vô số thương để chứng minh thực lực của mình trong phần Đấu Thương.\n"
  tournament_events.0150.joust_self:0 "Ta đã bẻ gãy vô số thương để chứng minh thực lực của mình trong phần Đấu Thương.\n"
  tournament_events.0150.wrestling:0 "[wrestling_winner.GetTitledFirstName|U] là một đối thủ không thể khuất phục khi giành vị trí quán quân trong phần Vật.\n"
  tournament_events.0150.wrestling_self:0 "Ta là một đối thủ không thể khuất phục và đã giành vị trí quán quân trong phần Vật.\n"
  tournament_events.0150.duel:0 "Sự vượt trội về kiếm thuật của [duel_winner.GetTitledFirstNamePossessive|U] đã giúp họ mang về phần thưởng trong phần Đấu Tay Đôi.\n"
  tournament_events.0150.duel_self:0 "Sự vượt trội về kiếm thuật của ta đã giúp ta mang về phần thưởng trong phần Đấu Tay Đôi.\n"
  tournament_events.0150.board_game:0 "Trí tuệ sắc bén của [board_game_winner.GetTitledFirstNamePossessive|U] đã vượt qua mọi đối thủ để chiến thắng phần Trò Chơi Bàn Cờ.\n"
  tournament_events.0150.board_game_self:0 "Trí tuệ sắc bén của ta đã vượt qua mọi đối thủ để chiến thắng phần Trò Chơi Bàn Cờ.\n"
  tournament_events.0150.horse_race:0 "Con ngựa của [horse_race_winner.GetTitledFirstNamePossessive|U] đã về nhất trong phần Đua Ngựa.\n"
  tournament_events.0150.horse_race_self:0 "Con ngựa của ta đã về nhất trong phần Đua Ngựa.\n"
  tournament_events.0150.murdersuccess:1 "\n[finishing_intent.GetFirstName] đã nhận lấy kết cục mà họ hoàn toàn xứng đáng.\n"
  tournament_events.0150.murderfailure:1 "\n[finishing_intent.GetFirstName] lần này đã thoát khỏi móng vuốt của ta.\n"
  tournament_events.0150.seducesuccess:1 "\nNhững lời quyến rũ xác thịt của ta đối với [finishing_intent.GetFirstName] đã thành công.\n"
  tournament_events.0150.seducefailure:1 "\n[finishing_intent.GetFirstName] đã chống lại những lời quyến rũ xác thịt của ta.\n"
  tournament_events.0150.befriendsuccess:1 "\n[finishing_intent.GetFirstName] và ta đã trở thành Bạn Tốt của nhau!\n"
  tournament_events.0150.befriendfailure:2 "\n[finishing_intent.GetFirstName] và ta vẫn chưa thiết lập được một Tình bạn bền chặt.\n"
  tournament_events.0150.winsuccess:1 "\nTa đã hoàn thành mục tiêu giành chiến thắng một Cuộc Thi!\n"
  tournament_events.0150.winfailure:1 "\nTa đã không thể giành chiến thắng một Cuộc Thi.\n"
  tournament_events.0150.knightsuccess:2 "\nTa đã củng cố hàng ngũ [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] của mình.\n"
  tournament_events.0150.knightfailure:2 "\nTa đã không tìm được ứng viên phù hợp nào để gia nhập hàng ngũ [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] của mình.\n"
  tournament_events.0150.end:1 "\nTa mong chờ lần tiếp theo!"
  tournament_events.0150.a:0 "Thật là một dịp tuyệt vời!"
  tournament_events.0150.b:0 "Có lẽ ta nên nói vài lời, dù sao ta cũng là chủ nhà..."
  tournament_events.0150.c:0 "[tournament_champion.GetFirstNameNoTooltip] xứng đáng được thưởng thêm cho chiến thắng của [tournament_champion.GetHerHis]!"
  tournament_events.0150.b.success:0 "Lời nói của Ngài mang lại cho Ngài chút danh tiếng"
  tournament_events.0150.b.failure:0 "Chẳng mấy ai để tâm"
  tournament_events.0150.legendseeddrop: "\nLần thứ ba ta giành chiến thắng một Cuộc Thi. Những câu chuyện về thành tựu của ta đã bắt đầu lan truyền khắp nơi.\n"

  tournament_events.0160.t:0 "$tournament_header$ Chiến Lợi Phẩm"
  tournament_events.0160.desc:0 "Các cuộc thi cuối cùng cũng kết thúc, và phần thưởng ta công bố — gả [marriage_prize.GetTitledFirstNamePossessive] cho người chiến thắng xứng đáng — không bị các thí sinh quên lãng, cũng như [ROOT.Char.Custom2('RelationToMeShort', marriage_prize)] của ta...\n\n"
  tournament_events.0160.a:0 "Xem ra chính ta đã thắng được ngươi rồi, [ROOT.Char.Custom2('RelationToMeShort', marriage_prize)]!"
  tournament_events.0160.b:0 "Chúc mừng, [bachelor_1.GetFirstNameNoTooltip]!"
  tournament_events.0160.c:0 "[bachelor_2.GetFirstNameNoTooltip] sẽ là một [marriage_prize.Custom('GetBrideGroom')] tuyệt vời, [bachelor_2.GetFirstNameNoTooltip]!"
  tournament_events.0160.d:0 "Hãy chăm sóc [marriage_prize.GetHerHim], [bachelor_3.GetFirstNameNoTooltip]!"
  tournament_events.0160.e:0 "Ta đã... đổi ý."
  tournament_events.0160.f:0 "Ta không có ý nói là bản thân mình..."
  tournament_events.0160.g:0 "Thôi vậy..."

  tournament_events.0161.desc:0 "Các cuộc thi cuối cùng cũng kết thúc, và phần thưởng do [host.GetTitledFirstNamePossessive] công bố — gả [marriage_prize.GetTitledFirstNamePossessive] cho người chiến thắng xứng đáng — không bị các thí sinh quên lãng, cũng như [host.GetHerHis] [ROOT.Char.Custom2('RelationToMeShort', marriage_prize)]...\n\n"
  tournament_events.0161.a:0 "Nào, người yêu của ta!"
  tournament_events.0161.b:0 "Thật quá đáng."
  tournament_events.0161.c:0 "Thôi vậy..."
 # ACCIDENT PING
  tournament_events.0701.t:1 "$tournament_contest_header$ Tai Nạn"
  tournament_events.0701.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', accident_victim)] của Ngài, [accident_victim.GetName], đã thiệt mạng trong một tai nạn chùy bất ngờ trong cuộc thi [activity.GetCurrentPhase.GetPhase.GetName|l]!"
  tournament_events.0701.a:0 "Thật bi thảm..."
  tournament_accident_death_msg_title:0 "Cái Chết Do Tai Nạn"

 # CONTESTANT INVALIDATION
  tournament_events.0800.t:1 "$tournament_contest_header$ Rút Lui"
  tournament_events.0800.wounded:0 "Ta e rằng vết thương của mình quá nặng để tiếp tục giải đấu này. Với tình trạng này, ta sẽ không thể hiện tốt được, và cũng không nên liều lĩnh với những chấn thương nghiêm trọng hơn..."
  tournament_events.0800.disease:0 "Ta e rằng bệnh tình của mình quá nghiêm trọng để tiếp tục giải đấu này. Với tình trạng này, ta sẽ không thể hiện tốt được, và cũng không nên chọc giận y sư..."
  tournament_events.0800.health:0 "Ta e rằng thể trạng của mình không cho phép tiếp tục giải đấu này. Với tình trạng này, ta sẽ không thể hiện tốt được, và cũng không nên chọc giận y sư..."
  tournament_events.0800.a:0 "Ta không thể tiếp tục."
  tournament_events.0800.b:0 "Không, ta vẫn làm được!"

  tournament_events.0801.t:0 "$tournament_events.0800.t$"
  tournament_events.0801.desc:0 "[contest_withdrawal.GetTitledFirstName] đã chính thức rút lui khỏi các cuộc thi."
  tournament_events.0801.wounded:0 "Có vẻ như vết thương của [contest_withdrawal.GetHerHis] quá nghiêm trọng để mạo hiểm tiếp tục."
  tournament_events.0801.disease:0 "Có vẻ như bệnh tình của [contest_withdrawal.GetHerHis] đã trở nên quá nghiêm trọng để tiếp tục."
  tournament_events.0801.health:0 "Có vẻ như thể trạng của [contest_withdrawal.GetHerHis] quá mất cân bằng để tiếp tục."
  tournament_events.0801.a:0 "Thật đáng tiếc."

 # WAGERING
  tournament_events.1000.t:1 "$tournament_contest_header$ Đặt Cược"
  tournament_events.1000.desc:0 "Dưới ánh đèn mờ mờ của quán rượu, ta nhìn chằm chằm vào tay cái, suy ngẫm về dòng tỷ lệ cược mà hắn hò hét giữa đám người đặt cược đang chen chúc.\n\n"
  tournament_events.1000.horse_race:0 ""[wager_top_contestant.GetTitledFirstNamePossessive] [wager_top_contestant.Custom('ContestHorseRaceGender')], #EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#!, là ứng cử viên sáng giá nhất! Tỷ lệ bốn ăn một cho #EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#!!""
  tournament_events.1000.fallback:0 ""[wager_top_contestant.GetTitledFirstName] là ứng cử viên sáng giá nhất của phần [activity.GetCurrentPhase.GetPhase.GetName]! Tỷ lệ bốn ăn một cho [wager_top_contestant.GetNameNoTooltip]!""
  tournament_events.1000.a:0 "Hừm, ta sẽ cược vào chính mình!"
  tournament_events.1000.a.horse:0 "Con ngựa tốt nhất của ta, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, có thể chiến thắng."
  tournament_events.1000.a.best_horse:0 "Đúng vậy, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! sẽ thắng!"
  tournament_events.1000.b:0 "[wager_top_contestant.GetFirstNameNoTooltip] là một lựa chọn an toàn."
  tournament_events.1000.b.horse:0 "#EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#! quả thực là một lựa chọn an toàn."
  tournament_events.1000.c:0 "Mặt khác, [wager_second_contestant.GetFirstNameNoTooltip] cũng rất sát nút."
  tournament_events.1000.c.horse:0 "Mặt khác, '[wager_second_contestant.Custom('GetContestHorseRaceName')]' của [wager_second_contestant.GetFirstNamePossessiveNoTooltip] cũng rất sát nút."
  tournament_events.1000.d:0 "Nhà vô địch của ta, [wager_champion_contestant.GetFirstNameNoTooltip], sẽ giành chiến thắng!"
  tournament_events.1000.e:0 "Ừm, [wager_underdog_contestant.GetFirstNameNoTooltip] là một kẻ cửa dưới ít được kỳ vọng."
  tournament_events.1000.e.horse:0 "#EMP [wager_underdog_contestant.Custom('GetContestHorseRaceName')]#! của [wager_underdog_contestant.GetFirstNamePossessiveNoTooltip] là một kẻ cửa dưới ít được kỳ vọng."
  tournament_events.1000.f:0 "Ta có thể được gì nếu cược vào [ROOT.Char.Custom2('RelationToMeShort', wager_flavor_contestant)] của ta, [wager_flavor_contestant.GetFirstNameNoTooltip]?"
  tournament_events.1000.f.horse:0 "Ta có thể được gì nếu cược vào con ngựa của [ROOT.Char.Custom2('RelationToMePossessive', wager_flavor_contestant)], #EMP [wager_flavor_contestant.Custom('GetContestHorseRaceName')]#!?"
  tournament_events.1000.g:0 "Ta có linh cảm tốt về '[mysterious_stranger.GetFirstNameNoTooltip] của [attending_barony.GetNameNoTierNoTooltip].'"
  tournament_events.1000.g.horse:0 "Ta có linh cảm tốt về #EMP [mysterious_stranger.Custom('GetContestHorseRaceName')]#! của [mysterious_stranger.GetFirstNamePossessiveNoTooltip]."
  tournament_events.1000.h:0 "Không, đây là ý tưởng tồi..."

  tournament_events.1000.bet_debug_tt:0 "#D tournament_wager_target_score_value#!: [SCOPE.ScriptValue('tournament_wager_target_score_value')|V]\n#D tournament_wager_top_score_value#!: [SCOPE.ScriptValue('tournament_wager_top_score_value')|V]\n#D tournament_wager_bottom_score_value#!: [SCOPE.ScriptValue('tournament_wager_bottom_score_value')|V]\n#D tournament_wager_top_minus_bottom_score_value:#! [SCOPE.ScriptValue('tournament_wager_top_minus_bottom_score_value')|V]\n#D tournament_wager_target_minus_bottom_value#!: [SCOPE.ScriptValue('tournament_wager_target_minus_bottom_value')|V]\n#D tournament_wager_odds_percent_value#!: [SCOPE.ScriptValue('tournament_wager_odds_percent_value')|V]\n#D tournament_wager_payout_value#!: [SCOPE.ScriptValue('tournament_wager_payout_value')|V]"

  tournament_events.1000.winnings_tt:0 "Nếu người chiến thắng là [wager_target.GetShortUIName]:\nNhận @gold_icon! #positive_value [SCOPE.ScriptValue('tournament_wager_payout_value')|0]#!"
  tournament_events.1000.horse_winnings_tt:2 "Nếu con ngựa của [wager_target.GetShortUINamePossessive], [wager_target.Custom('GetContestHorseRaceName')|V], thắng cuộc đua:\nNhận @gold_icon! #positive_value [SCOPE.ScriptValue('tournament_wager_payout_value')|0]#!"

 # PASSAGE OF ARMS
  tournament_events.1100.t:1 "Thách Đấu Qua Đường"
  tournament_events.1100.desc:0 "Bồn chồn trong lúc chờ các cuộc thi bắt đầu, hoặc đơn giản là háo hức phô diễn kỹ năng của [pas_darmes_instigator.GetHerHis], người [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)] của ta, [pas_darmes_instigator.GetFullName], đã tuyên bố một “thách đấu qua đường” tại vùng ngoại ô của [activity.GetCurrentPhase.GetLocation.GetName].\n\n\"#EMP Nếu bất kỳ [pas_darmes_instigator.Custom('MountedWarriorTerm')] lành lặn nào muốn đi qua, hãy đối mặt với ta — hoặc chịu nhục!#!\"\n\nNgười ta nói rằng [pas_darmes_instigator.GetSheHe] giữ lại cựa sắt của tất cả những kẻ bị [pas_darmes_instigator.GetSheHe] đánh bại, và bất kỳ quý nương nào muốn đi qua mà không có hộ tống đều phải để lại một vật kỷ niệm để sau này được chuộc lại thay mặt nàng."
  tournament_events.1100.a:0 "Giờ thì #EMP đúng là#! một [ROOT.Char.Custom('MountedWarriorTerm')]!"
  tournament_events.1100.b:0 "Thật là vui!"
  tournament_events.1100.c:0 "Ta cần gặp [pas_darmes_instigator.GetWomanMan] này!"
  tournament_events.1100.d:0 "Sự ngu xuẩn này bị cấm."
  pas_darmes_token_claim_tt:0 "Mọi [spouse|E], cha mẹ và [child|E] của [pas_darmes_victim.GetName]"

  tournament_events.1101.t:0 "$tournament_events.1100.t$"
  tournament_events.1101.desc:0 "No doubt drawn to my tournament by the promise of glory and surfeit of adversaries, a foreign [pas_darmes_instigator.Custom('MountedWarriorTerm')] has declared a 'passage of arms' near [activity.GetCurrentPhase.GetLocation.GetName].\n\n[pas_darmes_instigator.GetSheHe|U] calls [pas_darmes_instigator.GetHerselfHimself] '[pas_darmes_instigator.GetFullName]', and claims to hail from the distant [exotic_origin.GetDeJureLiege.GetAdjectiveNoTooltip] lands. Any [ROOT.Char.Custom('MountedWarriorTerm')] who wishes to pass [pas_darmes_instigator.GetHerHis] camp must break lances with [pas_darmes_instigator.GetHerHim] - or else forfeit their pride.\n\nTo be treated thusly by a foreign adventurer is sure to anger the [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] nobility."
  tournament_events.1101.a:0 "Tốt, các chiến binh của ta cần được rèn luyện cảnh giác."
  tournament_events.1101.b:0 "Không được, tống cổ tên lang bạt này đi."
  tournament_events.1101.c:1 "Đó mới là một $knight_culture_player_no_tooltip_lowercase$ thực thụ! Thật truyền cảm hứng!"

  tournament_events.1102.t:0 "$tournament_events.1100.t$"
  tournament_events.1102.desc:0 "Eager to prove [pas_darmes_instigator.GetHerselfHimself], my [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)], [pas_darmes_instigator.GetFullName], has declared a 'passage of arms', blocking the main route into [activity.GetCurrentPhase.GetLocation.GetName].\n\n[pas_darmes_instigator.GetSheHe|U] is accompanied by my [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_2)], [pas_darmes_2.GetFullName], and an assemblage of minor [pas_darmes_instigator.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] nobles with something to prove.\n\nI am told they have declared an oath to break three-hundred lances before they will consider their quest complete."
  tournament_events.1102.a:0 "Chúc họ may mắn."
  tournament_events.1102.a.tt:0 "Cuộc thách đấu qua đường tại [activity.GetCurrentPhase.GetLocation.GetName] sẽ tiếp diễn"
  tournament_events.1102.b:0 "Not in #EMP my#! [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
  tournament_pas_darmes_forbidden_tt:0 "Cuộc thách đấu qua đường tại [activity.GetCurrentPhase.GetLocation.GetName] sẽ kết thúc"

  tournament_events.1120.t:2 "Cái Giá Đắt"
  tournament_events.1120.desc:0 "[pas_darmes_instigator.GetTitledFirstName], the showy [pas_darmes_instigator.Custom('MountedWarriorTerm')] who guards [pas_darmes_instigator.GetHerHis] passage by challenging all comers, has had one fight too many.\n\n[pas_darmes_victim.GetTitledFirstName] is said to have delivered [pas_darmes_victim.GetHerHim] a frightful injury, opening the way for nobles to pass freely once more."
  tournament_events.1120.a:0 "Đó là rủi ro của một cuộc đời hiệp sĩ."
  tournament_events.1120.a.dead:0 "Một cái chết đầy danh dự."

  tournament_events.1130.opening:0 "[pas_darmes_victim.Custom2('AppropriateGreeting', ROOT.Char)]"
  tournament_events.1130.desc:0 "Khi đang trên đường tới [activity.GetCurrentPhase.GetLocation.GetName] cùng gia nhân, [pas_darmes_instigator.GetFullName] đã chặn đoàn của ta và ngang ngược đòi hỏi một vật kỷ niệm cá nhân...\n\nTa không còn lựa chọn nào khác ngoài việc trao cho [pas_darmes_instigator.GetHerHim] món tín vật đáng ghét đó... [pas_darmes_instigator.GetSheHe|U] nói rằng nếu ta muốn lấy lại, ta phải cử một kẻ thách đấu tới đối mặt với [pas_darmes_instigator.GetHerHis]."
  tournament_events.1130.a:0 "Phải làm gì đó thôi."

  tournament_events.1140.t:2 "Niềm Kiêu Hãnh Của Một [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  tournament_events.1140.desc:0 "Khi ta cưỡi ngựa hít thở không khí, chiêm ngưỡng sự nhộn nhịp của [activity.GetCurrentPhase.GetLocation.GetName], ta bắt gặp võ sĩ khét tiếng đó, “[pas_darmes_instigator.GetFullName]”, đang bảo vệ trại “thách đấu qua đường” của [pas_darmes_instigator.GetHerHis].\n\n"
  tournament_events.1140.skilled:0 "Some petty challenger hobbles away along the road as the [pas_darmes_instigator.Custom('MountedWarriorTerm')] returns contentedly to [pas_darmes_instigator.GetHerHis] seat, admiring the spurs [pas_darmes_instigator.GetSheHe] has just collected.\n\n"
  tournament_events.1140.unskilled:0 "Một [pas_darmes_instigator.Custom('MountedWarriorTerm')] vô cùng mãn nguyện đi ngang qua ta, cúi đầu chào kính, trong khi [pas_darmes_instigator.GetFirstNameNoTooltip] đứng quan sát từ yên ngựa của [pas_darmes_instigator.GetHerHis], rõ ràng vẫn nhức nhối vì thất bại.\n\n"
  tournament_events.1140.wounded:0 "Battered and bruised, the [pas_darmes_instigator.GetSheHe] grimaces through [pas_darmes_instigator.GetHerHis] pain as I approach. "You cannot win them all," [pas_darmes_instigator.GetSheHe] chuckles, squinting up at me."
  tournament_events.1140.fallback:0 "[pas_darmes_instigator.GetSheHe|U] jumps up when [pas_darmes_instigator.GetSheHe] spots me, eager for another fight, but quickly realizes who I am. Squinting up at me with a smile, [pas_darmes_instigator.GetFirstNameNoTooltip] bows, "Well met, [ROOT.Char.Custom('FormOfAddressForLiege')] of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip].""
  tournament_events.1140.a:0 "Để ta cho ngươi thấy một #EMP [ROOT.Char.GetTitleAsNameNoTooltip|l]#! giao đấu thế nào."
  tournament_events.1140.a.wounded:0 "Và ngươi cũng sẽ không thắng trận này."
  tournament_events.1140.a.success:0 "Ngài đánh bại [pas_darmes_instigator.GetNameNoTooltip]"
  tournament_events.1140.a.failure:0 "[pas_darmes_instigator.GetNameNoTooltip] đánh bại Ngài"
  tournament_events.1140.b:0 "Ngươi là một chiến binh hùng mạnh, ta có thể cần ngươi."
  tournament_events.1140.b.success:0 "Ngài thuyết phục được [pas_darmes_instigator.GetNameNoTooltip]"
  tournament_events.1140.b.failure:0 "[pas_darmes_instigator.GetNameNoTooltip] từ chối lời đề nghị của Ngài"
  tournament_events.1140.c:0 "Ta nghĩ vậy là đủ rồi."
  tournament_events.1140.d:0 "Cứ tiếp tục đi!"

  tournament_events.1141.t:0 "$tournament_events.1140.t$"
  tournament_events.1141.desc:0 "Một đám đông hiếu kỳ tụ tập khi [pas_darmes_instigator.GetFirstName] và ta lên ngựa, vào vị trí. Không do dự, [pas_darmes_instigator.GetSheHe] bất ngờ lao tới, hạ thấp giáo, bụi tung mù và vó ngựa dồn dập!\n\nTa phi nhanh về phía trước, tập trung toàn bộ sự chú ý vào mũi giáo đang chao đảo lao thẳng tới [pas_darmes_instigator.GetHerHim]."
  tournament_events.1141.win:0 "\n\nGiáo của ta vỡ tan trên khiên của [pas_darmes_instigator.GetHerHis] với một tiếng nổ vang trời, khiến [pas_darmes_instigator.GetHerHim] ngả người về sau trên yên khi ta lướt qua."
  tournament_events.1141.lose:0 "\n\nTa cảm nhận được giáo của [pas_darmes_instigator.GetHerHis] vỡ vụn trên khiên của mình với tiếng nổ long trời, khiến ta ngả người về sau trên yên khi [pas_darmes_instigator.GetSheHe] lướt qua."
  tournament_events.1141.kill_me:0 "\n\nKhuôn mặt ta bỗng nóng rát và ướt đẫm. Ta cố nói, nhưng gần như không thể mở mắt. Gương mặt đầy lo lắng của [pas_darmes_instigator.GetFirstNamePossessiveNoTooltip] hiện ra trước mắt khi thế giới chìm vào bóng tối..."
  tournament_events.1141.beat_me:0 "\n\n[pas_darmes_instigator.GetSheHe|U] kéo ta đứng dậy, phủi mảnh vỡ khỏi áo giáp. “Ngươi chiến đấu tốt — nhưng đã thua.” [pas_darmes_instigator.GetSheHe|U] cười, đưa tay ra."
  tournament_events.1141.kill_them:0 "\n\nKết thúc lượt chạy, ta quay ngựa lại với nụ cười, tìm [pas_darmes_sinstigator.GetFirstNameNoTooltip]. Ta thấy thân hình [pas_darmes_instigator.GetHerHis] nằm sấp trong bụi, con ngựa khẽ dụi vào bàn chân của [pas_darmes_instigator.GetHerHis]."
  tournament_events.1141.beat_them:0 "\n\nTa nhanh chóng vòng lại, kéo [pas_darmes_instigator.GetHerHim] đứng dậy và kiểm tra vết thương. “Ta sẽ ổn thôi,” [pas_darmes_instigator.GetHerHis] gầm gừ, “Đây, cựa của ta.”"
  tournament_events.1141.a:0 "Chỉ là vết xước thôi..."
  tournament_events.1141.a.death:0 "#weak *ọc máu*#!"
  tournament_events.1141.b:0 "Ta đã nói là sẽ cho ngươi thấy rồi!"
  tournament_events.1141.b.death:0 "[pas_darmes_instigator.GetFirstNameNoTooltip]? #EMP [pas_darmes_instigator.GetFirstNameNoTooltip]?!#!"

  tournament_events.1150.t:1 "$tournament_header$ Khôi Phục Danh Dự"
  tournament_events.1150.desc:0 "[pas_darmes_instigator.GetTitledFirstName] sits by a road, sharpening [pas_darmes_instigator.GetHerHis] blade, as I approach [pas_darmes_instigator.GetHerHis] meager camp.\n\n"Ah, I was wondering when you would show your face, good [ROOT.Char.GetTitleAsNameNoTooltip]." [pas_darmes_instigator.GetSheHe] smirks, pulling a garment from [pas_darmes_instigator.GetHerHis] belt. "Come to win back this, I suppose?"\n\n"
  tournament_events.1150.skilled:0 "I am well aware of the martial reputation of this [pas_darmes_instigator.GetWomanMan], but [pas_darmes_instigator.GetHerHis] ego will prove to be [pas_darmes_instigator.GetHerHis] downfall."
  tournament_events.1150.unskilled:0 "[pas_darmes_instigator.GetWomanMan] này nổi tiếng là khoác lác hơn là có thực lực, nhưng ta không nên xem thường [pas_darmes_instigator.GetHerHim]."
  tournament_events.1150.wounded:0 "Dù sao thì, những vết thương của [pas_darmes_instigator.GetHerHis] chắc chắn sẽ mang lại cho ta lợi thế..."
  tournament_events.1150.fallback:0 "Danh dự của ta đã bị đặt lên bàn cân bởi một [ROOT.Char.Custom('MountedWarriorTerm')] tầm thường..."
  tournament_events.1150.a:0 "Nào, hãy giao đấu."
  tournament_events.1150.a.wounded:0 "Ta sẽ cho ngươi thêm một vết thương — để #EMP nhớ đến ta#!."
  tournament_events.1150.a.success:0 "Ngài đánh bại [pas_darmes_instigator.GetTitledFirstNameNoTooltip]"
  tournament_events.1150.a.failure:0 "[pas_darmes_instigator.GetTitledFirstNameNoTooltip] đánh bại Ngài"
  tournament_events.1150.b:0 "Giữ lấy mảnh vải đó đi, hỡi [pas_darmes_instigator.Custom('MountedWarriorTerm')]."
 # FLAVOR
  tournament_events.1200.t:2 "Khiển Trách Tôn Giáo"
  tournament_events.1200.desc:0 "Trong khi quý tộc và dân thường hào hứng chuẩn bị cho các cuộc thi và trò vui sắp tới, [angry_clergy.GetTitledFirstName] thẳng thừng bày tỏ sự không tán thành của các [angry_clergy.GetFaith.AltPriestTermPlural].\n\n“Giải đấu này là phương tiện của tội lỗi; những [angry_clergy.GetFaith.GetAdherentNamePluralNoTooltip] ngoan đạo sẽ chết vì lòng kiêu hãnh; đổ máu lẫn nhau chỉ vì những món đồ vặt; từ bỏ [angry_clergy.GetFaith.PositiveAfterLife] để đổi lấy danh tiếng.”\n\n“Những khuynh hướng này cần được điều hướng, hướng về kẻ thù của [angry_clergy.GetFaith.HighGodNamePossessive], chứ không phải bị thổi phồng và dìm trong hư vinh.”"
  tournament_events.1200.a:0 "Họ không thể bảo vệ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] nếu không có chút luyện tập!"
  tournament_events.1200.a.success:0 "[angry_clergy.GetTitledFirstNameNoTooltip] bị thuyết phục"
  tournament_events.1200.a.failure:0 "Ngài không thể thay đổi suy nghĩ của [angry_clergy.GetTitledFirstNamePossessiveNoTooltip]"
  tournament_events.1200.b:0 "Từ khán đài của ta, ngươi sẽ thấy đức hạnh của cạnh tranh."
  tournament_events.1200.b.success:0 "[angry_clergy.GetTitledFirstNameNoTooltip] bị chinh phục"
  tournament_events.1200.b.failure:0 "[angry_clergy.GetTitledFirstNameNoTooltip] tỏ ra khinh miệt"
  tournament_events.1200.c:0 "Lập luận hợp lý, ta sẽ không tham gia."
  tournament_events.1200.d:0 "Ôi thôi đi [angry_clergy.GetFaith.PriestNeuter], để họ vui vẻ chút chứ."
  tournament_events.1230.t:2 "Từ Áo Rách Đến Giáp Sắt"
  tournament_events.1230.desc:0 "Khi ta đi dạo quanh khu vực giải đấu, cảm nhận bầu không khí và đánh giá kỹ thuật của các thí sinh đang luyện tập, một [battle_peasant.GetWomanMan] đặc biệt thu hút ánh nhìn của ta.\n\nMỗi cử động của [battle_peasant.GetHerHis|U] đều tràn đầy sự duyên dáng, hiệu quả và điềm tĩnh, dễ dàng hạ gục cả hình nộm rơm lẫn Ngài tập.\n\nKhi ta gọi [battle_peasant.GetHerHim] lại và hỏi [battle_peasant.GetSheHe] xuất thân từ gia tộc quý tộc nào, mắt [battle_peasant.GetHerHis] trợn to rồi cúi xuống đất. “T-thưa [ROOT.Char.GetLadyLord]! Thần chỉ là một nông dân, không hơn.” hắn lắp bắp, cúi rạp người."
  tournament_events.1230.a:0 "Không, ngươi sẽ là nhà vô địch của ta!"
  tournament_events.1230.b:0 "Vận mệnh của ngươi đã đổi thay rồi, [battle_peasant.Custom('MountedWarriorTerm')]."
  tournament_events.1230.b.tt:0 "Trở thành [battle_peasant.Custom('KnightCulture')] của Ngài"
  tournament_events.1230.c:0 "Ta phải thấy ngươi thi đấu! Ta sẽ bảo trợ cho ngươi."
  tournament_events.1230.c.tt:1 "Gia nhập [activity.GetShortName] của Ngài"
  tournament_events.1230.d:0 "Ặc, một #EMP nông dân?!#! Thật đáng tiếc..."
  tournament_events.1230.d.tt:0 "[battle_peasant.GetName] biến mất"
  tournament_events.1240.t:1 "$tournament_header$ Dành Cho Người Chiến Thắng"
  tournament_events.1240.desc:1 "Suy tính những phần thưởng có thể trao cho người chiến thắng cuộc thi [activity.GetCurrentPhase.GetPhase.GetName], ta nghĩ đến bàn tay của người con chưa kết hôn [ROOT.Char.Custom2('RelationToMe', prize_child_1)] của ta, [prize_child_1.GetFirstName].\n\nNhưng mà... nếu một thường dân giành chiến thắng thì sao..."
  tournament_events.1240.a:1 "Ta quyết định [prize_child_1.GetFirstNameNoTooltip] sẽ kết hôn với người chiến thắng."
  tournament_events.1240.b:0 "[prize_child_2.GetFirstNameNoTooltip] phù hợp hơn."
  tournament_events.1240.c:0 "Nên là [prize_child_3.GetFirstNameNoTooltip]."
  tournament_events.1240.d:0 "Đây không phải cách chúng ta làm."
  tournament_events.1240.betrothal_tt:0 "Nếu hợp lệ, người chiến thắng sẽ được đính hôn với [marriage_prize.GetTitledFirstName]"
  tournament_events.1240.marry_tt:0 "Nếu hợp lệ, người chiến thắng sẽ kết hôn với [marriage_prize.GetTitledFirstName]"

  tournament_events.1250.t:1 "$tournament_header$ Vật Kỷ Niệm Ân Sủng"
  tournament_events.1250.desc:0 "Theo lệ thường, người ta sẽ khích lệ tinh thần người mình yêu mến bằng một vật kỷ niệm ân sủng, một món đồ nhỏ mà họ sẽ mang theo vào giải đấu cho mọi người cùng thấy.\n\nCâu hỏi duy nhất là đấu sĩ nào xứng đáng nhất với tình cảm của ta..."
  tournament_events.1250.a:0 "Ta sẽ trao nó cho [favor_recipient_1.GetFirstNameNoTooltip]."
  tournament_events.1250.b:0 "[favor_recipient_2.GetFirstNameNoTooltip] là người xứng đáng."
  tournament_events.1250.c:0 "Nó sẽ thuộc về [favor_recipient_3.GetFirstNameNoTooltip]."
  tournament_events.1250.d:0 "Không ai xứng đáng với ân sủng của ta..."
  tournament_events.1250.favor_tt:0 "[favor_recipient.GetUIName] nhận được ân sủng của Ngài"
  tournament_favor_accepted_title:0 "Ân Sủng Được Chấp Nhận"
  tournament_favor_rejected_title:0 "Ân Sủng Bị Từ Chối"
  tournament_favor_accepted_desc:0 "[THIS.Char.GetSheHe|U] chấp nhận ân sủng của Ngài"
  tournament_favor_rejected_desc:0 "[THIS.Char.GetSheHe|U] từ chối ân sủng của Ngài"
  tournament_events.1251.t:0 "$tournament_events.1250.t$"
  tournament_events.1251.discrete:0 "Trong một khoảnh khắc tương đối yên tĩnh, rời xa khu vực chính của giải đấu, ta thấy mình ở riêng cùng [favor_giver.GetTitledFirstName], [favor_recipient.Custom2('RelationToMe', favor_giver)] của ta, với ánh nhìn tinh nghịch thật khó cưỡng.\n\n"
  tournament_events.1251.open:0 "Đứng trong khu đấu, quan sát các buổi luyện tập và chuẩn bị, ta nghe thấy một giọng gọi khe khẽ phía sau. \"[ROOT.Char.GetTitledFirstName]!\" [favor_giver.GetTitledFirstName], [favor_recipient.Custom2('RelationToMe', favor_giver)] của ta, vội vàng tiến lại, tay ôm chặt một mảnh vải.\n\n"
  tournament_events.1251.many:0 "Nhân danh [favor_recipient.GetFaith.HouseholdGodName], ta đã chẳng còn đếm nổi số ân sủng mình nhận được — giá mà họ biết về nhau..."
  tournament_events.1251.two:0 "Đây đã là ân sủng thứ hai ta được trao! Ta phải làm gì với từng này mảnh vải đây."
  tournament_events.1251.one:0 "[favor_giver.GetSheHe|U] buộc một vật kỷ niệm vào tay ta, mỉm cười nói: \"Hãy mang nó khi thi đấu, nó sẽ mang lại may mắn cho Ngài!\""
  tournament_events.1251.favor_tt:0 "Mỗi ân sủng được trang bị sẽ #positive_value tăng nhẹ#! cơ hội chiến thắng trong các [contests|E]"
  tournament_events.1251.a.spouse:0 "Cảm ơn ngươi, người yêu dấu."
  tournament_events.1251.a.consort:0 "Ồ, thật cảm động."
  tournament_events.1251.a.lover:0 "Ngươi thật quá đáng, tình yêu của ta."
  tournament_events.1251.a:0 "Ta sẽ mang nó với niềm tự hào, thưa [favor_giver.GetLadyLord] của ta."
  tournament_events.1251.b:0 "Gỡ thứ đó ra khỏi ta."
  tournament_events_equip_favor_tt:0 "Trang bị ân sủng của Ngài"
  tournament_events_destroy_favor_tt:0 "[THIS.Char.GetShortUIName|U] vứt bỏ ân sủng của Ngài"
  tournament_events.1252.t:2 "Ân Sủng Quen Thuộc"
  tournament_events.1252.desc:0 "Kể từ khi thấy ân sủng của một người ngưỡng mộ được buộc trên tay [favor_recipient.GetTitledFirstNamePossessive] hôm qua, ta đã vắt óc suy nghĩ vì sao nó lại quen thuộc đến vậy...\n\nKhi [favor_giver.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', favor_giver)] của ta, chào ta sáng nay, ta chợt nhận ra — ta nghĩ nó thuộc về [favor_giver.GetHerHim]!"
  tournament_events.1252.a:0 "Ta phải biết!"
  tournament_events.1252.a.tt:0 "Ngài đối chất với [favor_giver.GetFirstNameNoTooltip] về ân sủng"
  tournament_events.1252.b:0 "Không... thật vô lý..."
  tournament_events.1253.t:0 "$tournament_events.1252.t$"
  tournament_events.1253.desc:0 "[favor_investigator.GetTitledFirstName] xông thẳng vào phòng của Ta. Đảo mắt nhìn quanh căn phòng, ánh nhìn bồn chồn của [favor_investigator.GetHerHis] cuối cùng cũng dừng lại nơi Ta.\n\n\"Nói thật cho ta biết, vật tín vật treo trên tay [favor_recipient.GetTitledFirstNamePossessive] có phải là của ngươi không?\""
  tournament_events.1253.a:0 "#weak ...phải.#!"
  tournament_events.1253.b:0 "Cái gì? Đừng có ngớ ngẩn!"
  tournament_events.1254.t:0 "$tournament_events.1252.t$"
  tournament_events.1254.desc:0 "[favor_giver.GetFirstName] quay mặt đi giữa cơn dồn dập câu hỏi của Ta, yếu ớt chống tay lên bàn.\n\nCuối cùng, [favor_recipient.GetSheHe] chậm rãi quay lại, nhẹ nhàng phá vỡ sự im lặng: \"Đúng vậy — đó là vật tín của Ta mà [favor_recipient.GetTitledFirstName] đang mang...\""
  tournament_events.1254.a:0 "L-là vậy sao?"
  tournament_events.1254.b:0 "#EMP LÀ VẬY Á?!#!"
  tournament_events.1255.t:0 "$tournament_events.1252.t$"
  tournament_events.1255.desc:0 "[favor_giver.GetTitledFirstName] phủ nhận mọi liên quan với [favor_recipient.GetTitledFirstName], rõ ràng là vô cùng bực bội trước lời buộc tội. \"Ta thậm chí còn chẳng quen [favor_recipient.GetWomanMan] đó!\"\n\nDù [favor_giver.GetSheHe] có nói gì đi nữa, những hạt mầm nghi ngờ đã được gieo xuống..."
  tournament_events.1255.a:0 "Ta còn có thể làm gì nữa?"
  tournament_events.1255.a.tt:0 "\"Chỉ thời gian mới trả lời được...\""
  tournament_events.1260.t:2 "Giữ Gìn Hòa Khí"
  tournament_events.1260.desc:0 "Với vô số lãnh chúa và [ROOT.Char.Custom('MountedWarriorTermPlural')] tụ họp tại một nơi, việc cãi vã liên miên cũng chẳng có gì lạ, khi những hiềm khích cũ bùng lên và thói hư danh càng làm căng thẳng leo thang.\n\n"
  tournament_events.1260.rival:0 ""Listen here, you slippery [duelist_2.Custom2('InsultNoun', SCOPE.sC('duelist_1'))]!" [duelist_1.GetFirstName] snarls, as [duelist_2.GetTitledFirstName] fingers [duelist_2.GetHerHis] [duelist_2.Custom('SignatureWeaponNameOrType')] grip menacingly. No one is sure what started it.\n\nUsually these petty shows of bravado end with a black-eye at worst, but [duelist_1.GetTitledFirstNamePossessive] fearsome quarrel with [duelist_2.GetTitledFirstName] threatens to tar the whole event."
  tournament_events.1260.fallback:0 "\"Nghe đây, đồ [duelist_2.Custom2('InsultNoun', SCOPE.sC('duelist_1'))] trơn tuột!\" [duelist_1.GetFirstName] gầm lên, trong khi [duelist_2.GetFirstNameNoTooltip] nắm chặt chuôi kiếm của [duelist_2.GetHerHis] đầy đe dọa.\n\nThường thì những màn phô trương trẻ con như thế này cùng lắm chỉ kết thúc bằng một con mắt bầm, nhưng cuộc cãi vã dữ dội này lại đe dọa làm hoen ố cả sự kiện. Không ai biết chuyện bắt đầu từ đâu."
  tournament_events.1260.a:0 "Đủ rồi! Đây không phải trại cướp!"
  tournament_events.1260.b:0 "Thôi nào, đừng làm chủ nhà mất mặt."
  tournament_events.1260.c:0 "Cút! Lôi bọn gây rối này ra ngoài!"
  tournament_events.1260.d:0 "Đánh gục [second_duelist.GetHerHim] đi, [preferred_duelist.GetFirstNameNoTooltip]!"
  tournament_events.1260.duel_toast:0 "[duel_winner.GetTitledFirstName] đã thắng trận đấu"
  tournament_events.1260.peace_toast:0 "Hai đấu sĩ chịu xuống thang"
  tournament_events.1260.duel_tt:0 "Trận đấu diễn ra, khiến [duelist_1.GetFirstName] hoặc [duelist_2.GetFirstName] bị thương"
  tournament_events.1270.t:1 "$tournament_header$ Cao Thượng"
  tournament_events.1270.winner:0 "Ta bắt gặp [congratulate_winner.GetTitledFirstName] được vây quanh bởi những kẻ ngưỡng mộ trong đại lều, hẳn là đang khoe khoang chiến thắng của [congratulate_winner.GetHerHis] trong cuộc thi [congratulate_winner.Custom('GetRandomWonContest')|l] cùng phần thưởng mà [congratulate_winner.GetSheHe] giành được."
  tournament_events.1270.matcher:0 "Ta bắt gặp [congratulate_winner.GetTitledFirstName] trong đại lều, hẳn là đang khoe khoang việc đã đánh bại Ta trong trận đấu của chúng Ta."
  tournament_events.1270.desc:0 "\n\nPhép lịch sự đòi hỏi Ta phải thừa nhận [congratulate_winner.GetHerHim] khi lướt qua — một cơ hội để đưa ra tuyên bố công khai trước các vị khách đang hiện diện..."
  tournament_events.1270.a:0 "Ba tiếng hoan hô cho Nhà Vô Địch!"
  tournament_events.1270.b:0 "Chúc mừng [congratulate_winner.GetFirstNameNoTooltip], hoàn toàn xứng đáng!"
  tournament_events.1270.c:0 "À [congratulate_winner.GetFirstNameNoTooltip], vận mệnh quả thật vận hành khó lường..."
  tournament_events.1270.d:0 "Ta vừa nhớ ra là mình cần đi nơi khác."
  tournament_events.1270.nickname_toast:0 "Danh xưng được lan truyền"
  tournament_events.1280.t:1 "$tournament_header$ Tiêu Chuẩn Lỏng Lẻo"
  tournament_events.1280.desc:1 "Dòng người bình dân lẫn quý tộc đổ xô về bãi thi đấu, tranh nhau chiếm vị trí quan sát tốt cho [activity.GetCurrentPhase.GetPhase.GetName].\n\nMột tiếng rên rỉ kinh hoàng xé toạc bầu không khí náo nhiệt — một khán đài quá tải khán giả sụp đổ với một #EMP tiếng rầm#!! Hàng loạt nạn nhân gào thét bị hất văng khỏi tầm mắt.\n\nGiữa những lời đổ lỗi bay tứ phía, [ROOT.Char.Custom2('RelationToMeShort', intercessor)] của Ta, [intercessor.GetName], kiên quyết phản đối việc trừng phạt những kẻ xây dựng khán đài: \"Đây là ý chí của [intercessor.GetFaith.HighGodName], không phải thứ gì khác!\""
  tournament_events.1280.a:0 "Xử tử lũ '#EMP thợ xây#!' này!"
  tournament_events.1280.b:0 "Điều ta cần quan tâm là những người chịu tang."
  tournament_events.1280.c:0 "Đôi khi tai họa là điều không thể tránh..."
  tournament_events.1290.t:2 "Đám Gây Rối Khó Trị"
  tournament_events.1290.desc:0 "Bị đánh thức sớm bởi hồi chuông báo động, giờ đây Ta chứng kiến dân thị trấn hoảng loạn chuyền từng xô nước về phía những tòa nhà đang bốc cháy tại [fire_holding.GetBaronyNameExplicitly], trong khi [fire_holder.GetTitledFirstName] giận dữ giải thích.\n\n\"Một nhóm hộ vệ say xỉn vì [ROOT.Char.Custom('RegionalAlcoholicDrink')] và bị các cuộc thi kích động đã phóng hỏa một sạp hàng của thương nhân sau một cuộc cãi vã...\" [fire_holder.GetSheHe] sôi sục. \"Sẽ mất hàng tháng trời để xây dựng lại!\"\n\nĐây không phải là cách Ta muốn giải đấu của mình được ghi nhớ..."
  tournament_events.1290.a:0 "Đám hộ vệ đó phải trả giá cho trò vui của chúng."
  tournament_events.1290.b:0 "Ta sẽ chi trả việc sửa chữa."
  tournament_events.1290.c:0 "E rằng đó chỉ là một tai nạn đáng tiếc..."

  tournament_events.1300.t:1 "$tournament_header$ Dưới Cánh [old_knight.GetHerHis|U]"
  tournament_events.1300.desc:1 ""No, not quite. Move your foot back a bit to balance and swing #EMP through#! the target and... yes! Perfect! Well done [young_knight.Custom('GetLassLad')]!"\n\nIn front of me, the grizzled old veteran [old_knight.GetFirstName] is training [young_knight.GetFirstName], clearly passing on knowledge gained from one [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] to another. [old_knight.GetFirstNameNoTooltip] spots me as I approach.\n\n"Good morning, my [ROOT.Char.GetTitleAsNameNoTooltip]! I'm helping [young_knight.GetFirstNameNoTooltip] here perfect [young_knight.GetHerHis] stances. You have a talented young warrior on your hands already!" [young_knight.GetFirstNameNoTooltip] tries and fails to hide an embarrassed but pleased grin at the praise from [young_knight.GetHerHis] mentor."
  tournament_events.1300.a:0 "Tuyệt lắm! Cứ tiếp tục!"
  tournament_events.1300.b:0 "Có lẽ #EMP ta#! nên tự mình đảm nhận việc này."
  tournament_events.1300.b.success:0 "[young_knight.GetFirstNameNoTooltip] nhận #color_white 10#! [GetTrait('tourney_participant').GetName( GetNullCharacter )] $game_concept_trait_level_track_xp$ trong một $game_concept_trait_level_track$ ngẫu nhiên"
  tournament_events.1300.b.failure:0 "[young_knight.GetFirstNameNoTooltip] mất #color_white 5#! [GetTrait('tourney_participant').GetName( GetNullCharacter )] $game_concept_trait_level_track_xp$ trong một $game_concept_trait_level_track$ ngẫu nhiên"
  tournament_events.1300.c:0 "Ngài có phiền dạy Ta nữa không?"

  tournament_events.1310.t:2 "Vị Khách Lừng Lẫy"
  tournament_events.1310.desc:1 "Một hồi kèn rộn ràng xé toạc không khí. Phi ngang qua Ta, một sứ giả cưỡi ngựa mở cuộn da dê.\n\n\"Nghe đây, nghe đây! Trong ngày lành nhất này, chúng ta vinh dự được chào đón sự hiện diện của một bậc kỳ tài thực thụ. [famous_knight.GetSheHe|U] đã đánh bại mọi đối thủ từ Ireland cho tới Cathay! Ta vinh hạnh giới thiệu người tài giỏi nhất, huy hoàng nhất, xuất sắc nhất thế gian: [famous_knight.GetTitledFirstName]!\"\n\nMột bóng người lao vụt qua sứ giả, ghì cương khiến ngựa của [famous_knight.GetHerHis] dừng khựng lại, một tia nắng xuyên qua chiếu rọi [famous_knight.GetHerHim] như hào quang, trong khi tiếng gầm vang của đám đông gần như làm rung chuyển mặt đất."
  tournament_events.1310.a:0 "Thật vinh hạnh khi có ngài ở đây, [famous_knight.GetFirstNameNoTooltip]!"
  tournament_events.1310.b:1 "Có lẽ họ có thể dạy ta đôi điều?"
  tournament_events.1310.b.critsuccess:0 "[famous_knight.GetFirstNameNoTooltip] dạy Ngài một số kỹ thuật"
  tournament_events.1310.b.success:0 "Ngài học hỏi được vài mẹo"
  tournament_events.1310.b.failure:0 "Ngài không hiểu những lời chỉ dạy của [famous_knight.GetFirstNamePossessiveNoTooltip]"
  tournament_events.1310.c:0 "Xin lỗi, ai cơ?"

  tournament_events.1311.t:2 "Lẫn Lộn"
  tournament_events.1311.desc:0 ""Chú ý, hỡi tất cả những ai đang lang thang nơi đây!" Giọng của một người xướng ngôn cắt ngang đám đông đang tụ tập quanh giải đấu, khiến không ít người quay lại nhìn.\n\n"Hãy để mọi người được biết rằng người đang bước vào đấu trường lúc này là... là..." Người xướng ngôn khẽ hít gấp, đảo mắt tìm kiếm trong đám đông một cái tên rõ ràng đã bị lãng quên.\n\n"Là... thưa quý nương- à, quý #EMP lãnh chúa#!- à..." Đôi tay của người xướng ngôn siết chặt rồi lại thả ra một cách co giật, sự hoảng loạn vì quên mất tên của [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')] đang được giới thiệu hiện rõ mồn một. Vị [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')] ấy, [forgotten_knight.GetTitledFirstName], tiến lại gần người xướng ngôn đang run rẩy với vẻ mặt giông tố."
  tournament_events.1311.a:0 "[forgotten_knight.GetFirstNameNoTooltip]! Ta có thể cho ngươi một người xướng ngôn khác chứ?"
  tournament_events.1311.b:0 "Tên sứ giả đó có lẽ sẽ cần một công việc mới..."
  tournament_events.1311.b.tt:0 "Tất cả những người tham dự có đặc tính [GetTrait('compassionate').GetName( GetNullCharacter )] nhận #color_green +25#! thiện cảm với Ngài"
  tournament_events.1311.c:0 "Ha! Họ quên mất #EMP tên#! của [forgotten_knight.GetHerHis]!"
  tournament_events.1312.t:2 "Phong Thái Ngoại Quốc"
  tournament_events.1312.desc:0 "Oohs and aahs, followed by applause, catch my attention as I walk past a small crowd. Interest piqued, I push my way into their midst.\n\nAt their center stands a [foreign_knight.GetWomanMan], sword half-drawn from its scabbard, showing off the weapon's unusual hilt to the awestruck commoners. It's clear that [foreign_knight.GetSheHe] is not from these parts: [foreign_knight.GetHerHis] accent is lilting and foreign. As [foreign_knight.GetSheHe] sees me, [foreign_knight.GetSheHe] bows [foreign_knight.GetHerHis] head respectfully, before turning back to the crowd.\n\n"Now, how about I show you all a sword trick from my lands?" The crowd cheer again, raucously."
  tournament_events.1312.a:0 "Ngươi có muốn một quân chủ mới không?"
  tournament_events.1312.a.success:0 "[foreign_knight.GetFirstNameNoTooltip] đồng ý gia nhập"
  tournament_events.1312.a.failure:0 "[foreign_knight.GetFirstNameNoTooltip] từ chối Ngài"
  tournament_events.1312.b:0 "Thật là một nhân vật thú vị!"
  tournament_events.1312.c:0 "[foreign_knight.GetSheHe|U] chỉ là người ngoại quốc thôi, thì sao chứ?"

  tournament_events.1320.t:0 "Đồng Tiền Đỏ"
  tournament_events.1320.desc:0 "Ta đang trên đường trở về từ nhà xí, lách mình giữa hai chiếc lều, thì bất ngờ một bàn tay bịt chặt miệng ta từ phía sau.\n\n"Im lặng khi ta cho phép ngươi nói. Làm được chứ?" Tiếng đáp ú ớ của ta dường như làm hài lòng giọng nói ấy, và ta xoay người lại, đối mặt với một kẻ lạ mặc y phục khác thường. Một vật nhỏ lập tức được nhét vào tay ta.\n\n"Ta cần ngươi giữ hộ thứ này. Nó vô cùng quan trọng với ta. Ta sẽ quay lại lấy. Nếu ta không..." Một nụ cười mệt mỏi kỳ lạ thoáng qua trên môi kẻ lạ. "...thì hãy coi đó là món quà ta tặng ngươi.\n\nTa cúi xuống nhìn. Nằm gọn trong lòng bàn tay là một đồng tiền vàng nhưng kỳ lạ thay lại mang màu #EMP đỏ#!. Nó nằm đó lặng lẽ, hơi ấm khi chạm vào."
  tournament_events.1320.a:0 "Ta sẽ giữ thứ này cho ngươi."
  tournament_events.1320.b:0 "Ta không muốn dính dáng gì đến chuyện này!"

  tournament_events.1321.t:0 "Đồng Tiền Mượn"
  tournament_events.1321.desc:0 "Nhìn qua miệng cốc khi đang giải khát giữa các lượt thi đấu, ta thấy một bóng người khoác áo choàng, quen thuộc một cách lạ lùng, tiến về phía mình.\n\n"Ta tin rằng ngài đang giữ thứ gì đó của ta." Người ấy bước ra ánh sáng, như thể không quen với sự chói chang. "Đồng tiền, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ngài vẫn còn giữ nó, phải không?\n\nTa rút nó ra khỏi túi, kim loại lấp lánh dưới ánh nắng. Nó trông còn đỏ hơn trước, một sắc đỏ đậm như ngọc hồng lựu. Bóng người mỉm cười dưới chiếc mũ trùm.\n\n"Lòng biết ơn sâu sắc nhất của ta, từ tận đáy con tim. Xin nhận chút đáp lễ vì công sức của ngài." Họ chìa một tay ra để nhận lại đồng tiền, trong khi tay kia đưa ra một túi vàng nặng trĩu."
  tournament_events.1321.a:0 "Hãy đến triều đình của ta. Ta có thể cần đến tài năng của ngươi."
  tournament_events.1321.b:0 "Rất hân hạnh được làm ăn cùng ngươi,  Bạn củata."
  tournament_events.1321.c:0 "Hừm. Ta nghĩ là không."
  tournament_events.1321.c.tt:0 "Cảm giác này thật rủi ro..."

  tournament_events.1322.t:0 "Đáng Để Mạo Hiểm?"
  tournament_events.1322.desc:0 "The sheer rage that flashes across the stranger's face takes me aback and has my guards take a step forward, drawing their weapons. The figure's lip curls as they lower their hood, disgusted, derisive.\n\n"You can see my face." [unusual_stranger.GetSheHe|U] says. "I will also tell you my name. My dearest wish now is for you to lie awake at night thinking about how [unusual_stranger.GetFirstName] will exact just vengeance upon you. It may be years from now, but I never forget, and I hope only now that you never forget as well."\n\n"Remember this: #EMP there will be a reckoning.#!" [unusual_stranger.GetSheHe|U] sweeps [unusual_stranger.GetHerHis] hood back up, drawing [unusual_stranger.GetHerHis] cloak tighter about [unusual_stranger.GetHerHis] body, before melting away back into the crowd."
  tournament_events.1322.a:0 "Ta... ta chắc là sẽ ổn thôi."

  tournament_events.1330.t:0 "Thế Hệ Kế Tiếp"
  tournament_events.1330.desc:0 ""Chúc may mắn nhé, [ROOT.Char.Custom('FormOfAddressForLiege')]!" Ta đáp lại tiếng hô từ một thành viên trong đám đông tụ tập bằng một cái vẫy tay biết ơn. "Và con cũng vậy, [heir.GetFirstName]!"\n\n"Ý họ là sao?" Ta hỏi [heir.GetFirstNameNoTooltip], bước đi song song bên cạnh ta. "Sao họ lại cần chúc con may mắn?" Vẻ lo lắng trên gương mặt [heir.GetHerHis|U] nhanh chóng trả lời câu hỏi đó.\n\n"Con... con muốn tham gia thi đấu!" [heir.GetSheHe|U] khăng khăng. "Người tham gia được, sao con lại không?" Ta dừng khựng lại, [heir.GetFirstNameNoTooltip] loạng choạng dừng theo bên cạnh ta, sự gan dạ của [heir.GetHerHis] phần nào tan biến trước phản ứng của ta."
  tournament_events.1330.a:0 "Con cần phải hiểu. Con quá quý giá để đem ra mạo hiểm."
  tournament_events.1330.b:0 "Thật là một vinh hạnh khi có một [heir.Custom('GetDaughterSon')] như vậy!"
  tournament_events.1330.c:0 "Ta cấm chuyện này! Đi và rút lui ngay lập tức!"
  tournament_events.1330.d:0 "...đừng nói cho [spouse.GetMotherFather] của con biết."

  tournament_events.1331.t:0 "Vì Gia Tộc?"
  tournament_events.1331.desc:0 ""[ROOT.Char.GetFirstName]! Just the [ROOT.Char.GetWomanMan] I've been wanting to run into!" [dynast.GetFirstName] hurries up to me. "We need to talk. You see, I had heard you were signed up for the upcoming contest and, well..."\n\nMy impassive look clearly hardens [dynast.GetFirstNamePossessiveNoTooltip] stance towards the situation. [dynast.GetSheHe|U] draws [dynast.GetHerselfHimself] up to [dynast.GetHerHis] full height.\n\n"You need to withdraw. I am the head of [dynast.GetDynastyName] and I demand it! For the good of our lineage!" As [dynast.GetSheHe] berates me, I look back across at where the colors of the participating contestants were hoisted. Including, predictably, [dynast.GetFirstNamePossessiveNoTooltip]."
  tournament_events.1331.a:0 "Đe dọa sẽ không có tác dụng với ta đâu, [dynast.GetFirstNameNoTooltip]."
  tournament_events.1331.b:0 "Dĩ nhiên rồi. Bất cứ điều gì vì #EMP 'gia đình'#!."
  tournament_events.1331.c:0 "Ngươi có muốn suy nghĩ lại lời nói của mình không, [dynast.GetFirstNameNoTooltip]?"
  tournament_events.1331.d:0 "Ta sẽ không bị ép buộc vì lợi ích của ngươi!"
  tournament_events.1331.e:0 "Ta sẽ rút lui, nếu buộc phải vậy."

  tournament_events.1332.t:0 "Cho Và Nhận"
  tournament_events.1332.desc:0 "Ta thấy [powerful_vassal.GetFirstName] sải bước về phía mình và khẽ nhắm mắt lại trong chán nản. Khi mở mắt ra, [powerful_vassal.GetSheHe] đã đứng ngay trước mặt ta, nhìn chằm chằm với một nụ cười gượng che giấu ánh nhìn sắc lạnh.\n\n"[ROOT.Char.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')], thật là #EMP tuyệt vời#! khi được thấy ngài ở đây và còn tham gia thi đấu!" [powerful_vassal.GetSheHe|U] nắm lấy tay ta, kéo ta rời khỏi đám đông một chút để thì thầm. "Nghe này. Ta cần một ân huệ." Vẻ mặt của [powerful_vassal.GetHerHis|U] suýt nữa thì sụp đổ khi ta đảo mắt.\n\n"Ta muốn thể hiện thật tốt trong cuộc thi này, và với tư cách là một trong những chư hầu hùng mạnh và #EMP trung thành#! nhất của ngài, ta tự hỏi liệu có thể trông cậy vào sự giúp đỡ của ngài không.""
  tournament_events.1332.a:0 "Ngươi đúng là trung thành, phải không?"
  tournament_events.1332.b:0 "Trung thành nhất, ngươi nói sao?"
  tournament_events.1332.c:0 "Dạo này túi tiền của ta hơi trống rỗng..."
  tournament_events.1332.d:0 "Vì ngươi, [powerful_vassal.GetFirstNameNoTooltip]? Bất cứ điều gì."
  tournament_events.1332.e:0 "Ngươi sẽ phải tự lo cho bản thân."

 # SPECTATOR EVENTS
  tournament_events.1400.t:1 "$tournament_header$ Những Chuyện Nhỏ"
  tournament_events.1400.desc:0 "Trở thành một phần của đám đông tại một sự kiện thể thao thực sự có thể là một niềm vui. Bầu không khí, âm thanh và cảnh tượng — tất cả đều cuốn hút. Chỉ có điều, đôi khi nó cũng mang lại không ít phiền toái bên cạnh những lợi ích.\n\nMột trong những phiền toái đó vừa xuất hiện, khi ta nhận ra mình bị mắc kẹt phía sau thân hình đồ sộ của [tall_person.GetFirstName]. Ta nghiêng người sang bên này rồi bên kia, nhưng vóc dáng quá khổ của [tall_person.GetHerHis] gần như che kín hoàn toàn diễn biến trên sân.\n\nTa thở dài thật to và dậm chân. [tall_person.GetFirstNameNoTooltip] không hề nhúc nhích. Tiếng reo hò vang lên khi một điều gì đó to lớn và đầy phấn khích xảy ra. Cơn nóng giận trong ta bắt đầu dâng cao."
  tournament_events.1400.a:0 "Ta sẽ bắt ngươi #EMP quỳ xuống#! để xem!"
  tournament_events.1400.a.fight:0 "Ít nhất thì một trận đánh cũng sẽ giải quyết vấn đề theo cách này hay cách khác..."
  tournament_events.1400.b:0 "Xin lỗi. Ngươi có thể #EMP nhích sang#! được không?"
  tournament_events.1400.b.success:0 "[tall_person.GetFirstNameNoTooltip] miễn cưỡng đồng ý"
  tournament_events.1400.b.failure:0 "[tall_person.GetFirstNameNoTooltip] từ chối"
  tournament_events.1400.c:0 "Ngươi có muốn chiến đấu cho ta không?"
  tournament_events.1400.c.success:0 "[tall_person.GetFirstNameNoTooltip] gia nhập cùng Ngài"
  tournament_events.1400.c.failure:0 "[tall_person.GetFirstNameNoTooltip] từ chối"
  tournament_events.1400.d:0 "Thôi bỏ đi."

  tournament_events.1401.t:1 "$tournament_header$ Chuyện Người Cao"
  tournament_events.1401.desc:0 "Đúng là một ngày tuyệt vời! Vị trí ngay sát phía trước đám đông cho ta một tầm nhìn không ai sánh bằng. Mọi thứ đều ổn cho đến khi ta cảm thấy ai đó khẽ kéo áo mình. Cúi xuống nhìn, ta thấy một dáng người nhỏ bé hơn ta rất nhiều đang cố chen qua.\n\nKhi nhận ra ánh mắt ta đang nhìn [smol_person.GetHerHim], [smol_person.GetFirstName] đứng thẳng người và bắt đầu van nài cho hoàn cảnh của [smol_person.GetHerHis].\n\n\"Ngươi thì... quá là #EMP cao lớn#!!\" [smol_person.GetSheHe] nói, vừa khoa tay chỉ vào sự chênh lệch vóc dáng của chúng ta. \"Ta chẳng thấy gì cả! Làm ơn, cho ta đứng phía trước ngươi được không?\""
  tournament_events.1401.a:0 "Ha ha! Không."
  tournament_events.1401.a.success:0 "Ngài chặn họ lại thành công"
  tournament_events.1401.a.failure:0 "[smol_person.GetFirstNameNoTooltip] lẻn qua được"
  tournament_events.1401.b:0 "Được rồi, đi qua đi."

  tournament_events.1402.t:1 "$tournament_header$ Đồ Uống Đổ Phí"
  tournament_events.1402.desc:0 "Cuộc tranh tài trước mặt ta đang lên đến cao trào, các đối thủ ngang tài ngang sức. Ta nắm chặt lan can gỗ phía trước và hét vang cùng đám đông để bày tỏ sự phấn khích. Tuy nhiên, tiếng hét đó nhanh chóng biến thành tiếng kêu nghẹn khi ta cảm thấy thứ gì đó đang chảy dọc sống lưng. Một loại chất lỏng nào đó... vừa nóng #EMP mà#! lại vừa lạnh, thật khó hiểu.\n\nTa xoay người lại và đối diện với [drinking_spectator.GetFirstName], chiếc cốc của [drinking_spectator.GetHerHis] đang sóng sánh phần còn lại của thứ đồ uống không rõ danh tính, hiện đang bò dọc xuống lưng ta.\n\n\"Này nhé, coi chừng đường đi chứ!\" [drinking_spectator.GetSheHe] lè nhè, vừa nói vừa chỉ trích ta bằng chiếc cốc. \"Ngươi nên cẩn thận hơn!\""
  tournament_events.1402.a:0 "Hay là ta mua cho cả hai ta một cốc khác?"
  tournament_events.1402.b:0 "Lính đâu! Tống cổ cái [drinking_spectator.Custom2('InsultAdjective', ROOT.Char)] [drinking_spectator.Custom2('InsultNoun', ROOT.Char)] này khỏi mắt ta!"
  tournament_events.1402.c:0 "Ngươi nói đúng. Lỗi của ta!"

  tournament_events.1403.t:1 "$tournament_header$ Đám Đông Khiếp Sợ"
  tournament_events.1403.desc:0 "The crowd leans in as a competitor readies themself, but the atmosphere is cut through keenly by a screeching voice. [realm_priest.GetFirstName] has burst on to the field.\n\n"How #EMP could#! you be watching this idle, time-wasting #EMP filth#!!" [realm_priest.GetSheHe] rumbles, turning from person to person, spittle flying from [realm_priest.GetHerHis] lips as [realm_priest.GetSheHe] harangues them. "You should be spending less time here and more worshipping!"\n\nThe sea of people wavers somewhat, a sliver of truth sensed in the words, before a few brave and angry voices speak out in return. The tide of public opinion washes over [realm_priest.GetFirstNameNoTooltip] ferociously, but [realm_priest.GetSheHe] stands [realm_priest.GetHerHis] ground, booming [realm_priest.GetHerHis] screed."
  tournament_events.1403.a:0 "[realm_priest.GetFirstNameNoTooltip] nói đúng đấy, lũ truỵ lạc!"
  tournament_events.1403.b:0 "Booo! #EMP Boooooo!#!"
  tournament_events.1403.c:0 "Có lẽ ta nên để chuyện này tự lắng xuống."

  tournament_events.1404.t:1 "$tournament_header$ Những Kẻ Theo Đuổi Tiềm Năng"
  tournament_events.1404.desc:0 "Khi ta ổn định chỗ ngồi gần phía trước đám đông cùng với [ROOT.Char.Custom2('RelationToMeShort', gossip_friend)] là [gossip_friend.GetFirstName], các thí sinh phi ngựa băng qua sân ngay trước mặt chúng ta. [gossip_friend.GetFirstNameNoTooltip] huých nhẹ ta vài lần, khẽ hất đầu về phía hai thí sinh một cách chẳng hề kín đáo.\n\n\"Ngươi nghĩ sao về hai người kia?\" [gossip_friend.GetSheHe] nói, cố kìm một tiếng cười khúc khích đầy thích thú. \"Ai là lựa chọn #EMP của ngươi#!?\" Từ đôi lông mày nhướn lên quá mức của [gossip_friend.GetHerHis], rõ ràng [gossip_friend.GetSheHe] không hỏi xem ta nghĩ ai sẽ chiến thắng.\n\n\"Kìa, kìa, họ đang đi lại gần! Nói gì đi! To đủ để họ nghe thấy ấy!\""
  tournament_events.1404.a:0 "\"Cả hai đều không thể sánh bằng #EMP vẻ đẹp#! của ngươi.\""
  tournament_events.1404.b:0 "\"Ha! Ngươi còn làm tốt hơn cả hai trên chiến trường tình ái ấy chứ!\""
  tournament_events.1404.c:0 "\"#BOL Ôi trời, kia chẳng phải là mỹ nhân [knight_1.GetFirstNameNoTooltip] đó sao?!#!\""
  tournament_events.1404.d:0 "\"#BOL Oa, chỉ cần #EMP nhìn#! [knight_2.GetFirstNameNoTooltip] kìa!#!\""
  tournament_events.1404.e:0 "\"#EMP Suỵt, suỵt!#! #DIE1 Thế là #EMP đủ rồi #!, [gossip_friend.GetFirstNameNoTooltip]!#!\""

  tournament_events.1405.t:1 "$tournament_header$ Một [flirty_onlooker.Custom('GetLassLad')|U] May Mắn"
  tournament_events.1405.desc:0 "Ánh mắt ta lướt qua đám đông. Sự ồn ào chung bao trùm khắp nơi, mọi khán giả đều mải trò chuyện hoặc cổ vũ cho các thí sinh. Ngoại trừ một người.\n\n[flirty_onlooker.GetFirstName] đang nhìn chằm chằm vào ta. Ánh mắt chúng ta chạm nhau trước khi [flirty_onlooker.GetSheHe] lập tức quay đi, ánh mắt [flirty_onlooker.GetHerHis] đảo quanh khắp nơi trừ ta ra. Bình thường ta sẽ nghi ngờ, nhưng bờ môi bị cắn nhẹ và những cái liếc trộm liên tục để xem ta còn nhìn không lại kể một câu chuyện rất khác trong trường hợp này."
  tournament_events.1405.a:0 "Thông tin hữu ích cho sau này!"
  tournament_events.1405.b:0 "Ồ ồ ồ..."
  tournament_events.1405.b.tt:0 "Trao cho [flirty_onlooker.GetFirstNameNoTooltip] một nụ cười nhẹ và một cái nháy mắt đáp lại."
  tournament_events.1405.c:0 "Ta đến đây để xem, không phải để tán tỉnh!"

  tournament_events.1406.t:1 "$tournament_header$ Trải Nghiệm Mới"
  tournament_events.1406.desc:0 "Len lỏi qua đám đông, cái đầu nhỏ của [root_child.GetFirstNamePossessive] liên tục ngoảnh qua ngoảnh lại, thu vào mọi cảnh tượng và âm thanh. [root_child.GetSheHe|U] gần như rung lên vì phấn khích, kéo tay ta và chỉ trỏ vào những thí sinh đang vội vã đi ngang.\n\nTa nhẹ nhàng giữ [root_child.GetHerHim] lại, nhưng [root_child.GetSheHe] vẫn tiếp tục vùng ra, hoàn toàn không thể kìm nén sự háo hức của [root_child.GetHerHis] trước hoàn cảnh mới mẻ như vậy."
  tournament_events.1406.a:0 "\"Tập trung vào việc học hành của con đi.\""
  tournament_events.1406.b:0 "\"Nào, trèo lên vai ta đi!\""
  tournament_events.1406.c:0 "\"Ta cũng hào hứng lắm, [root_child.GetFirstNameNoTooltip]!\""

  tournament_events.1407.t:1 "$tournament_header$ Danh Dự Được Bảo Vệ"
  tournament_events.1407.desc:0 "Kia rồi! [competing_family.GetSheHe] đó! Người [ROOT.Char.Custom2('RelationToMeShort', competing_family)] của ta, [competing_family.GetFirstName], đang tham gia cuộc thi này, và cuối cùng ta cũng đã nhận ra [competing_family.GetHerHim] giữa đám thí sinh đông đúc. Ta vừa định mở miệng hô lên vài lời cổ vũ thì đã nghe thấy một giọng nói khác.\n\n\"Ê, [competing_family.GetFirstNameNoTooltip]! Tốt hơn là bỏ cuộc ngay bây giờ cho đỡ phiền phức!\"\n\nTa nhìn quanh giữa những khán giả cười khúc khích và thấy [shouting_fan.GetFirstName] đang chuẩn bị tung ra thêm một tràng sỉ nhục nữa."
  tournament_events.1407.a:0 "Ngươi vừa nói cái gì?!"
  tournament_events.1407.a.success:0 "Ngài thắng trong trận đánh"
  tournament_events.1407.a.failure:0 "Ngài thua trong trận đánh"
  tournament_events.1407.b:0 "Cố lên [competing_family.GetFirstNameNoTooltip]! Chiến thắng là của ngươi!"
  tournament_events.1407.b.success:0 "Ngài át được tiếng của [shouting_fan.GetFirstNameNoTooltip]"
  tournament_events.1407.b.failure:0 "Ngài không át được tiếng của [shouting_fan.GetFirstNameNoTooltip]"
  tournament_events.1407.c:0 "Mong là [competing_family.GetFirstNameNoTooltip] sẽ không để tâm..."

  tournament_events.1408.t:0 "$tournament_header$ Giải Khát"
  tournament_events.1408.desc:0 "Mặt trời gay gắt chiếu xuống khi ta theo dõi cuộc thi từ vị trí thuận lợi ở phía trước đám đông. Hôm nay nóng quá. Hay là ta mặc đồ quá dày?\n\nTa còn đang suy nghĩ thì thấy một thương nhân trẻ tháo vát vác trên vai một thùng nhỏ đựng thứ đồ uống không rõ loại, rõ ràng đang mời chào người qua đường để đổi lấy tiền xu. Miệng ta lập tức khô khốc. Giá mà ta có thể sang đó mà không mất chỗ đứng này...\n\nTa tuyệt vọng nhìn quanh tìm cách, nhưng chỉ thấy [drinking_fan.GetFirstName] đang thong thả quay lại chỗ của [drinking_fan.GetHerHis] trong đám đông, tay cầm chắc ly nước."
  tournament_events.1408.a:0 "\"Ta có thể mua lại ly đó của ngươi không?\""
  tournament_events.1408.a.tt:0 "Có lẽ sẽ cần chút thuyết phục..."
  tournament_events.1408.b:0 "Có lẽ nếu ta nhanh lên..."
  tournament_events.1408.b.success:0 "Ngài chạy đi mua nước rồi quay lại dễ dàng"
  tournament_events.1408.b.failure:0 "Ngài mua được nước nhưng mất chỗ đứng"
  tournament_events.1408.b.criticalfailure:0 "Ngài mất chỗ đứng và người bán cũng bỏ đi"
  tournament_events.1408.c:0 "Ta đành phải chịu đựng vậy."

  tournament_events.1409.t:0 "$tournament_header$ Có Người Để Cổ Vũ"
  tournament_events.1409.desc:0 "Ta dịch sang bên để nhường đường cho ai đó, nhưng vừa làm xong thì người ấy đã bắt đầu nói chuyện.\n\n\"À, [ROOT.Char.GetTitledFirstName]! Không ngờ lại gặp ngài ở đây!\" Ta vừa định đáp lại thì [friendly_fan.GetFirstName] đã nói tiếp quá nhanh. \"Chắc ngài cũng có người ưa thích chứ? Ai đó mà ngài nghĩ sẽ mang chiến thắng về nhà? Riêng ta thì có linh cảm rất tốt về [fan_favourite.GetFirstName]!\"\n\nTa cân nhắc các lựa chọn của mình trong chốc lát. Có lẽ đồng ý thì vẫn hơn?"
  tournament_events.1409.a:0 "\"Dĩ nhiên rồi! Phải là [fan_favourite.GetFirstNameNoTooltip] thôi!\""
  tournament_events.1409.b:0 "\"Rõ ràng là [other_favourite.GetFirstNameNoTooltip] sẽ thắng, đồ [friendly_fan.Custom2('InsultNoun', ROOT.Char)]!\""
  tournament_events.1409.c:0 "Có lẽ ta chỉ cần mỉm cười và gật đầu..."

  tournament_events.1410.t:0 "$tournament_header$ Người Hâm Mộ Bất Mãn"
  tournament_events.1410.desc:0 "Above the baying of the crowd, I can hear quite clearly the brewing of a fight. Craning my neck to look behind me, I can make out two figures, each with a handful of the others' garments. Exactly what this dispute is over is uncertain, but a small circle of rowdy watchers has already formed.\n\n"You [fan_2.Custom2('InsultAdjective', SCOPE.sC('fan_1'))] [fan_2.Custom2('InsultNoun', SCOPE.sC('fan_1'))]!" [fan_1.GetFirstName] spits out, cursing as [fan_1.GetSheHe] rears up to [fan_1.GetHerHis] full height. [fan_2.GetFirstName] responds in kind.\n\n"You're a churl and a [fan_1.Custom2('InsultNoun', SCOPE.sC('fan_2'))]! I'll rip your guts out!" The two are quite clearing squaring off."
  tournament_events.1410.a:0 "\"Đủ rồi!\""
  tournament_events.1410.a.tt:0 "Xen vào giữa họ có thể rất nguy hiểm, nhưng ta phải làm #EMP điều gì đó#!..."
  tournament_events.1410.a.success:0 "Ngài thành công trong việc can ngăn"
  tournament_events.1410.a.failure:0 "Ngài bị thương trong vụ ẩu đả"
  tournament_events.1410.b:0 "\"Bình tĩnh nào! Đây không phải lúc hay nơi để đánh nhau!\""
  tournament_events.1410.b.success:0 "Lời nói trấn an của Ngài có tác dụng"
  tournament_events.1410.b.failure:0 "Hai kẻ đó vẫn tiếp tục đánh nhau"
  tournament_events.1410.c:0 "Đúng rồi! Đánh [fan_1.GetHerHim] đi!"
  tournament_events.1410.c.fan1:0 "[fan_1.GetFirstNameNoTooltip] thắng trận"
  tournament_events.1410.c.fan2:0 "[fan_2.GetFirstNameNoTooltip] thắng trận"

 # INTENT EVENTS
  tournament_events.6000.t:1 "$tournament_header$ Bằng Mọi Giá"
  tournament_events.6000.desc:0 "Một giải đấu là nơi hoàn hảo để ta và cả thế gian thoát khỏi tên [murder_target.Custom2('InsultNoun', ROOT.Char)] kia, [murder_target.GetTitledFirstName] — hiểm nguy cải trang rình rập khắp mọi ngóc ngách, và những tai nạn xảy ra thường xuyên khiến nghi ngờ bị phân tán.\n\n"
  tournament_events.6000.again:0 "[murder_target.GetTitledFirstName] vẫn còn sống...\n\n"
  tournament_events.6000.deferred:0 "Ta đã kiên nhẫn chờ đợi một cách đáng khen... đợi khoảnh khắc hoàn hảo để ra tay với [murder_target.GetTitledFirstName]..."
  tournament_events.6000.foot:0 "Phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] đang đến gần, và một lưỡi dao tẩm độc trong tay kẻ thích hợp có thể kết liễu [murder_target.GetHerHim] chỉ trong chớp mắt...\n\n"
  tournament_events.6000.joust:0 "Những cây thương ở phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] đều được làm an toàn với đầu tù, nhưng nếu âm thầm thay thế bằng những người anh em chết chóc hơn của chúng thì có lẽ chẳng ai để ý...\n\n"
  tournament_events.6000.self_match:0 "Việc can thiệp vào trang bị của chính ta quá dễ dàng, vô hiệu hóa các biện pháp an toàn của giải đấu, và kết liễu [murder_target.GetFirstNameNoTooltip] ngay trước đám đông..."
  tournament_events.6000.patsy_match:0 "Ta chỉ cần phá hoại trang bị của [murder_match.GetFirstNamePossessive] trước khi [murder_match.GetSheHe] đối mặt với [murder_target.GetFirstNameNoTooltip], rồi cầu cho các vì sao đứng về phía mình..."
  tournament_events.6000.injuries:0 "Chấn Thương Có Thể Xảy Ra"
  tournament_events.6000.a:0 "Một cơ hội thú vị."
  tournament_events.6000.b:0 "Phải, mọi tội lỗi sẽ đổ lên đầu [murder_match.GetFirstNameNoTooltip]."
  tournament_events.6000.c:0 "Ta sẽ kết liễu tên ngốc đó!"
  tournament_events.6000.d:0 "Chưa phải lúc..."
  tournament_events.6000.e:0 "Quá rủi ro..."
  tournament_events.6000.success:0 "Cuộc phá hoại của Ngài đã thành công"
  tournament_events.6000.failure:0 "Cuộc phá hoại của Ngài không mang lại kết quả gì"
  tournament_events.6000.success_tt:0 "[murder_target.GetFirstNameNoTooltip] bị giết bởi [murder_match.GetFirstNameNoTooltip]"
  tournament_events.6000.blame:0 "Mọi cáo buộc sẽ đổ lên [murder_match.GetShortUIName]"
  tournament_events.6000.imprisonment_tt:0 "Vì [murder_target.GetFirstNameNoTooltip] là Chủ nhà, [murder_match.GetFirstNameNoTooltip] có thể bị giam giữ"
  tournament_events.6001.t:0 "$tournament_events.6050.t$"
  tournament_events.6001.foot:0 "Ta xoa lưỡi dao bằng thứ độc dược hôi thối, suy ngẫm về những lời hứa của tên giả kim đã bán cho ta hỗn hợp ghê tởm ấy, rồi cẩn thận tra nó vào vỏ."
  tournament_events.6001.horse:0 "Ta thay thế những cây thương trong kho vũ khí khi đêm xuống, để chúng nằm trong bóng tối, chờ tiếng kèn của bình minh."
  tournament_events.6001.success_patsy:0 "\n\nSau một khoảnh khắc căng thẳng đến nghẹt thở, ta đã rút lui an toàn! Với chút may mắn, [murder_match.GetFirstName] sẽ không nhận ra cho tới khi đã quá muộn..."
  tournament_events.6001.success:0 "\n\nTrang bị bị chỉnh sửa một cách hiểm độc của ta đã sẵn sàng cho phần thi [activity.GetCurrentPhase.GetPhase.GetName|l], giờ chỉ cần đảm bảo ta sử dụng nó đúng cách..."
  tournament_events.6001.failure:0 "\n\nThan ôi, khi ta quay lại vào sáng hôm sau, rõ ràng một người hầu lanh lợi đã phát hiện trò bịp của ta — những nỗ lực này chỉ khiến nghi ngờ về hành vi mờ ám gia tăng, và bọn tiểu đồng trở nên cảnh giác hơn bao giờ hết."
  tournament_events.6001.closing:0 "\n\nNgày của ngươi sẽ đến sớm hơn ngươi tưởng đấy, [murder_target.GetFirstName]..."
  tournament_events.6001.a:0 "Và ta nóng lòng chờ đợi..."
  tournament_events.6001.b:0 "Khốn kiếp..."
  tournament_events.6010.t:1 "$tournament_header$ Ám Sát Kình Địch"
  tournament_events.6010.desc:0 "Khi ngày tàn, ta bắt gặp kình địch của mình, [murder_target.GetName], trông có vẻ rất thư thái, đang vui vẻ cùng đám đông. Cuộc thi này mang lại cơ hội hoàn hảo cho một #EMP tai nạn#! ập xuống [murder_target.GetHerHim]...\n\nTrong bầu không khí thả lỏng thế này, việc lén bỏ thứ gì đó vào cốc của [murder_target.GetHerHis] hẳn không khó."
  tournament_events.6010.a:0 "Ta biết một tiệm thuốc gần đây."
  tournament_events.6010.a.flavor:0 "[murder_target.GetFirstNameNoTooltip] sẽ nếm thử một loại độc khác!"
  tournament_events.6010.a.success:0 "Your rival quaffs [murder_target.GetHerHis] last drink"
  tournament_events.6010.a.ill:0 "Thể dịch của kình địch Ngài bị rối loạn"
  tournament_events.6010.a.failure:0 "Kình địch của Ngài dường như không hề hấn gì"
  tournament_events.6010.b:0 "Mấy tên cùng đinh ta thấy ban nãy đâu rồi?"
  tournament_events.6010.b.flavor:0 "Không gì hữu dụng hơn một kẻ tuyệt vọng..."
  tournament_events.6010.b.success:0 "Kình địch của Ngài bị giết"
  tournament_events.6010.b.caught:0 "Kình địch của Ngài khuất phục tên côn đồ"
  tournament_events.6010.b.failure:0 "Kình địch của Ngài thoát khỏi tên côn đồ"
  tournament_events.6010.c:0 "Chuyện này sẽ không ổn..."

  tournament_events.6011.t:0 "$tournament_events.6010.t$"
  tournament_events.6011.poison:0 "Ta vội vã quay lại từ chỗ người bán dược, kẻ đã quá dễ dàng tin vào câu chuyện chuột trong chuồng ngựa của ta.\n\nKhi người giữ quán bận rộn rót đầy các ly, việc lén thả hỗn hợp đó vào cốc của [murder_target.GetFirstNamePossessive] trở nên đáng sợ là quá dễ dàng.\n\n"
  tournament_events.6011.thug:0 "Tên du đãng nhận tiền của ta, miễn cưỡng đồng ý điều khoản, và xác nhận cái gật đầu kín đáo của ta về phía [murder_target.GetTitledFirstName].\n\n"
  tournament_events.6011.death:0 "Có lẽ điều đáng rợn người hơn cả là tốc độ [murder_target.GetSheHe] gục xuống sau khi uống thứ đó, quằn quại trong đau đớn, nghẹn ngào cầu cứu."
  tournament_events.6011.ill:0 "I hold my breath as [murder_target.GetSheHe] brings the cup to [murder_target.GetHerHis] lips, and briefly revel in success, but it is not to be. The [murder_target.Custom2('InsultNoun', ROOT.Char)] is merely feverish, and will probably live."
  tournament_events.6011.second_chance:0 "Bực bội thay, chất độc dường như chỉ làm tên [murder_target.GetWomanMan] choáng váng, nhưng khi theo [murder_target.GetHerHim] ra ngoài, ta thấy giờ đây chúng ta đang ở một nơi hẻo lánh trong khuôn viên giải đấu.\n\nĐây rất có thể là cơ hội cuối cùng để ta đạt được mục tiêu..."
  tournament_events.6011.ache:0 "Tác dụng đến rất nhanh: ta nhìn đám đông vây quanh tên [murder_target.Custom2('InsultNoun', ROOT.Char)] đang rên rỉ, nhưng chẳng mấy chốc rõ ràng lọ thuốc không hề có sức mạnh như đã hứa.\n\nTệ nhất thì [murder_target.GetSheHe] chỉ có một đêm khốn khổ trong nhà xí mà thôi..."
  tournament_events.6011.slain:0 "Ta gần như không thể ngủ, chờ đợi tin tức, nhưng trong thâm tâm đã nhẹ nhõm vì thoát khỏi kình địch.\n\nĐến bình minh, cả [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] xôn xao bàn tán về vụ tấn công kinh hoàng nhằm vào [murder_target.GetFirstNameNoTooltip], kẻ được tìm thấy bị mổ bụng ngoài phố bởi một lính canh, con dao dính máu nằm cạnh [murder_target.GetHerHis]."
  tournament_events.6011.caught:0 "I can hardly sleep waiting for the news, a formless fear nags at my heart until morning.\n\nMy attendants knock at dawn, informing me [murder_target.GetFirstNameNoTooltip] claims [murder_target.GetSheHe] overcame a thug who tried to murder [murder_target.GetHerHim] in the night, and said I was behind it."
  tournament_events.6011.escape:0 "Ta gần như không thể ngủ, chắc chắn rằng đã có điều gì đó sai sót.\n\nTrực giác của ta đúng — [murder_target.GetFirstNameNoTooltip] vẫn còn sống, và tin tức về vụ mưu sát nhằm vào [murder_target.GetHerHis] bởi một kẻ trùm đầu đã lan khắp [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]."
  tournament_events.6011.a.death:0 "Gần như #EMP quá#! dễ dàng..."
  tournament_events.6011.a.ill:0 "Vẫn còn hy vọng..."
  tournament_events.6011.a.slain:0 "Một chuyện làm ăn bẩn thỉu."
  tournament_events.6011.a.caught:0 "Lũ lang thang đáng nguyền rủa."
  tournament_events.6011.a:0 "Vận rủi chết tiệt."
  tournament_events.6011.b:0 "Ta phải hành động ngay."
  tournament_events.6011.b.success:0 "Ngài giết kình địch của mình"
  tournament_events.6011.b.failure:0 "Kình địch của Ngài trốn thoát"
  tournament_events.6011.c:0 "Hết rồi..."
  tournament_events.6012.t:0 "$tournament_events.6010.t$"
  tournament_events.6012.poison:0 "Ta đang vui vẻ trò chuyện về các cuộc thi sắp tới với vài người tham dự thì đột nhiên cảm thấy ruột gan đảo lộn và hơi thở bị siết chặt.\n\n"
  tournament_events.6012.thug:0 "Ta rời đi về lều của mình, sau một buổi tối tán gẫu về những ứng cử viên sáng giá với vài người tham dự khác, thì cảm nhận được một bóng người phía sau.\n\n"
  tournament_events.6012.death:0 "Các vị thần ơi, ngọn lửa gì đang thiêu đốt trong ta thế này! \"C-cứu!\" ta sặc sụa, những gương mặt ngu ngơ của đám quen biết nhìn chằm chằm vào ta."
  tournament_events.6012.ill:0 "Ta khuỵu xuống, ôm chặt bụng, khi xung quanh là những người lo lắng. \"Cứu, g-gọi thầy thuốc!\" ta cố thốt lên."
  tournament_events.6012.slain:0 "Chưa kịp quay người, cảm giác như có con ngựa đá thẳng ta xuống đất. Một bóng người trùm đầu ghì chặt ta, đâm lưỡi dao về phía tim!"
  tournament_events.6012.caught:0 "Ta né sang bên đúng lúc hắn lao tới, làm hắn mất thăng bằng trước khi ta ghì hắn xuống đất. Một con dao lấp lánh cắm trong bùn."
  tournament_events.6012.escape:0 "Những bước chân nặng nề của kẻ trùm đầu tiến đến. Ta quay phắt lại khi hắn áp sát, hất hắn ngã xuống đất rồi lao về phía biển lều trại."
  tournament_events.6012.a.death:0 "#EMP *nghẹt thở*#! C- #weak cứu...!#!"
  tournament_events.6012.a.ill:0 "Ta c-chỉ c-cần n-nghỉ một c-chút."
  tournament_events.6012.a.poison:0 "Mấy l-ly rượu này thật t-tội lỗi!"
  tournament_events.6012.a.slain:0 "#weak Ai...?!#!"
  tournament_events.6012.a.caught:0 "#EMP Ai sai ngươi?!"
  tournament_events.6012.a:0 "Ta sẽ ổn thôi..."
  tournament_events.6013.t:0 "$tournament_events.6010.t$"
  tournament_events.6013.death:0 "I rush up behind [murder_target.GetHerHim] as quietly as I can, grabbing at [murder_target.GetHerHis] head, and bring my blade across [murder_target.GetHerHis] neck.\n\n[murder_target.GetSheHe|U] splutters and kicks as I sprint away into the labyrinth of tents."
  tournament_events.6013.fallback:0 "Ta lặng lẽ áp sát sau lưng [murder_target.GetHerHim], nhưng [murder_target.GetFirstName] nghe thấy và quay lại, trừng mắt nhìn con dao sáng loáng của ta.\n\n[murder_target.GetSheHe|U] vùng chạy với nguồn năng lượng mới, húc bật hơi thở khỏi lồng ngực ta, rồi biến mất vào mê cung lều trại."
  tournament_events.6013.a.death:0 "Thế là xong!"
  tournament_events.6013.a:0 "Khônggg!"
  tournament_events.6014.t:0 "$tournament_events.6010.t$"
  tournament_events.6014.desc:0 "Khi ta lê bước trở về lều, yếu ớt ôm lấy mạn sườn, một [murder_target.GetHerHis] lao tới từ phía sau!"
  tournament_events.6014.death:0 "Chưa kịp phản ứng, [murder_target.GetSheHe] đã giật đầu ta ra sau và kề dao vào cổ!"
  tournament_events.6014.fallback:0 "Ta xoay người, húc [murder_target.GetHerHim] ngã xuống đất cùng một tiếng rên, rồi lao đầu vào mê cung lều trại."
  tournament_events.6014.a.death:0 "Cái- #EMP K-không!#! *ọc ọc*"
  tournament_events.6014.a:0 "Không thể nào... #EMP [murder_actor.GetFirstNameNoTooltip]#!!"

  tournament_events.6050.t:1 "$tournament_contest_header$ Phá Hoại"
  tournament_events.6050.desc:0 "Ta đã tự thề với bản thân rằng sẽ giành chiến thắng trong một phần thi của giải đấu này, và không khỏi cân nhắc một cách tiếp cận kém... #EMP \"công bằng\"#! hơn để đoạt giải thưởng của phần thi [activity.GetCurrentPhase.GetPhase.GetName|l].\n\nTa chắc rằng đối thủ của mình cũng sẽ làm điều tương tự, nếu họ chỉ cần nảy ra ý tưởng — ai mà biết được, có khi họ đã làm rồi?"
  tournament_events.6050.a:0 "[sabotage_target_1.GetFirstNameNoTooltip] là mối đe dọa."
  tournament_events.6050.a.horse_race:0 "#EMP [sabotage_target_1.Custom('GetContestHorseRaceName')]#! của [sabotage_target_1.GetFirstNamePossessiveNoTooltip] là mối đe dọa."
  tournament_events.6050.b:0 "Ta không thể chịu được cảnh [sabotage_target_2.GetFirstNameNoTooltip] chiến thắng."
  tournament_events.6050.b.horse_race:0 "Ta không thể chịu được cảnh [sabotage_target_2.GetFirstNameNoTooltip] chiến thắng cùng #EMP [sabotage_target_2.Custom('GetContestHorseRaceName')]#!."
  tournament_events.6050.c:0 "[sabotage_target_3.GetFirstNameNoTooltip] phải bị trấn áp."
  tournament_events.6050.c.horse_race:0 "#EMP [sabotage_target_3.Custom('GetContestHorseRaceName')]#! của [sabotage_target_3.GetFirstNamePossessiveNoTooltip] phải bị trấn áp."
  tournament_events.6050.d:0 "Đây không phải là cách để chiến thắng..."
  tournament_events.6050.success:0 "Cuộc phá hoại của Ngài đã thành công"
  tournament_events.6050.detected:0 "Cuộc phá hoại của Ngài đã bị phát hiện"
  tournament_events.6050.failure:0 "Cuộc phá hoại của Ngài đã thất bại"
  tournament_host_disqualification_tt:0 "[host.GetTitledFirstName] may disqualify you for attempting to sabotage them"
  tournament_contestant_disqualification_tt:0 "[host.GetTitledFirstName] có thể truất quyền thi đấu của Ngài vì cố gắng phá hoại một thí sinh khác"
  contest_sabotage_score_diff_far_behind_horse_race_tt:0 "#EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! của [sabotage_target.GetShortUINamePossessive] #negative_value vượt trội hơn rất nhiều#! so với #EMP [sabotage_actor.Custom('GetContestHorseRaceName')]#!"
  contest_sabotage_score_diff_behind_horse_race_tt:0 "#EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! của [sabotage_target.GetShortUINamePossessive] #negative_value tốt hơn#! so với #EMP [sabotage_actor.Custom('GetContestHorseRaceName')]#! của Ngài"
  contest_sabotage_score_diff_close_horse_race_tt:0 "#EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! của [sabotage_target.GetShortUINamePossessive] ngang ngửa với #EMP [sabotage_actor.Custom('GetContestHorseRaceName')]#! của Ngài"
  contest_sabotage_score_diff_ahead_horse_race_tt:0 "#EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! của [sabotage_target.GetShortUINamePossessive] #positive_value kém hơn#! so với #EMP [sabotage_actor.Custom('GetContestHorseRaceName')]#!"
  contest_sabotage_score_diff_far_ahead_horse_race_tt:0 "#EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! của [sabotage_target.GetShortUINamePossessive] #positive_value kém xa#! so với #EMP [sabotage_actor.Custom('GetContestHorseRaceName')]#!"
  contest_sabotage_score_diff_far_behind_tt:0 "[sabotage_target.GetShortUIName] #negative_value vượt trội hơn rất nhiều#! so với Ngài"
  contest_sabotage_score_diff_behind_tt:0 "[sabotage_target.GetShortUIName] #negative_value giỏi hơn#! so với Ngài"
  contest_sabotage_score_diff_close_tt:0 "[sabotage_target.GetShortUIName] có kỹ năng ngang ngửa với Ngài"
  contest_sabotage_score_diff_ahead_tt:0 "[sabotage_target.GetShortUIName] #positive_value kém hơn#! so với Ngài"
  contest_sabotage_score_diff_far_ahead_tt:0 "[sabotage_target.GetShortUIName] #positive_value kém xa#! so với Ngài"
  tournament_events.6051.t:0 "$tournament_events.6050.t$"
  tournament_events.6051.foot:0 "Ta tìm cách phá hoại bộ giáp của [sabotage_target.GetTitledFirstNamePossessive] trước khi phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] tiếp diễn, làm yếu các dây da cố định những bộ phận với hy vọng chúng sẽ mòn đứt."
  tournament_events.6051.archery:1 "Ta tìm cách phá hoại cây cung của [sabotage_target.GetTitledFirstNamePossessive] trước khi phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] tiếp diễn, khéo léo thay đổi độ kéo của dây cung để làm [sabotage_target.GetHerHim] chệch hướng."
  tournament_events.6051.pugilism:0 "Ta tìm cách phá hoại các dải băng quấn tay của [sabotage_target.GetTitledFirstNamePossessive] trước khi phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] tiếp diễn, phủ lên đó một lớp thuốc bôi gây kích ứng để làm [sabotage_target.GetHerHim] mất tập trung."
  tournament_events.6051.horse:0 "Ta tìm cách đầu độc con ngựa của [sabotage_target.GetTitledFirstNamePossessive] trước khi phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] tiếp diễn, tráo thức ăn trong chuồng bằng những mẻ bị nhiễm độc khi bọn tiểu đồng đang ngủ."
  tournament_events.6051.horse_race:0 "Ta tìm cách đầu độc ngựa đua, #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!, của [sabotage_target.GetTitledFirstNamePossessive] trước khi phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] bắt đầu, tráo thức ăn trong chuồng bằng những mẻ bị nhiễm độc khi bọn tiểu đồng đang ngủ."
  tournament_events.6051.falconry:0 "Ta tìm cách đầu độc chim của [sabotage_target.GetTitledFirstNamePossessive] trước khi phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] bắt đầu, làm bẩn khẩu phần ăn của nó khi bọn tiểu đồng đang ngủ."
  tournament_events.6051.success:0 "\n\nSự kiên nhẫn của ta cuối cùng cũng được đền đáp; ta thực hiện việc tráo đổi mà không gây ra chút nghi ngờ nào rồi rút lui trong đêm. Đến sáng, ta nhẹ nhõm khi không hề có một lời thì thầm nào về những âm mưu của mình."
  tournament_events.6051.detected:0 "\n\nJust as I was about to take my leave, my careful work moments from completion, I turned to find [sabotage_target.GetFirstNamePossessiveNoTooltip] attendant, mouth agape. Before I could react, [sabotage_target.GetSheHe] had rushed off to tell [sabotage_target.GetHerHis] master!"
  tournament_events.6051.failure:0 "\n\nThan ôi, giữa sự tinh ranh của [sabotage_target.GetHerHis] và vận rủi của ta, những nỗ lực này chẳng mang lại điều gì ngoài việc làm dấy lên nghi ngờ về hành vi mờ ám giữa các thí sinh, những kẻ giờ đây cảnh giác hơn bao giờ hết."
  tournament_events.6051.disqualified:0 "\n\nKhông mất nhiều thời gian trước khi ta bị truất quyền thi đấu..."
  tournament_events.6051.forgiven:0 "\n\nMay mắn thay, ta vẫn được phép tiếp tục tham gia..."
  tournament_events.6051.a:0 "Trong chiến thắng, mọi thứ đều công bằng."
  tournament_events.6051.a.disqualified:0 "Thật quá đáng..."
  tournament_events.6051.a.detected:0 "Vận rủi quái quỷ..."
  tournament_events.6051.a.failure:0 "Khỉ thật..."

  tournament_events.6052.t:0 "$tournament_events.6050.t$"
  tournament_events.6052.host:1 "Người hầu của ta khẳng định đã bắt gặp [sabotage_actor.GetTitledFirstName], một trong các thí sinh của phần thi [activity.GetCurrentPhase.GetPhase.GetName], đang tìm cách phá hoại ta ngay trong sự kiện!\n\n"
  tournament_events.6052.guest:0 "[sabotage_target.GetTitledFirstName], một trong các thí sinh của phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] sắp tới, đã buộc tội [sabotage_actor.GetTitledFirstName] có hành vi mờ ám, thậm chí còn trước ngày thi!\n\n"
  tournament_events.6052.foot:1 ""[sabotage_actor.GetSheHe|U] đã can thiệp vào bộ giáp của [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], làm yếu các dây da cố định các bộ phận với hy vọng chúng sẽ mòn đứt ngay giữa trận!""
  tournament_events.6052.archery:2 ""[sabotage_actor.GetSheHe|U] đã can thiệp vào cây cung của [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], khéo léo thay đổi độ kéo của dây cung.""
  tournament_events.6052.pugilism:1 ""[sabotage_actor.GetSheHe|U] đã can thiệp vào các dải băng quấn tay của [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], phủ lên đó một lớp thuốc bôi gây kích ứng.""
  tournament_events.6052.horse:1 ""[sabotage_actor.GetSheHe|U] đã tìm cách đầu độc con ngựa của [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], tráo thức ăn trong chuồng bằng những mẻ bị nhiễm độc khi bọn tiểu đồng đang ngủ.""
  tournament_events.6052.horse_race:1 ""[sabotage_actor.GetSheHe|U] đã tìm cách đầu độc con ngựa đua, #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!, của [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], tráo thức ăn trong chuồng bằng những mẻ bị nhiễm độc khi bọn tiểu đồng đang ngủ.""
  tournament_events.6052.a:0 "Không thể dung thứ cho gian lận."
  tournament_events.6052.a.host:0 "Gian lận thì phải bị truất quyền thi đấu!"
  tournament_events.6052.b:0 "Thôi nào, chỉ là chuyện vô hại."
  tournament_events.6053.t:0 "$tournament_events.6050.t$"
  tournament_events.6053.desc:0 "Ngay cả trước khi phần thi [activity.GetCurrentPhase.GetPhase.GetName|l] bắt đầu, đã có kẻ bị bắt quả tang đang phá hoại!"
  tournament_events.6053.foot:1 ""[sabotage_actor.GetTitledFirstName] đã can thiệp vào bộ giáp của [sabotage_target.GetTitledFirstNamePossessive], làm yếu các dây da cố định các bộ phận với hy vọng chúng sẽ mòn đứt ngay giữa trận!""
  tournament_events.6053.archery:2 ""[sabotage_actor.GetTitledFirstName] đã can thiệp vào cây cung của [sabotage_target.GetTitledFirstNamePossessive], khéo léo thay đổi độ kéo của dây cung để làm ta chệch hướng.""
  tournament_events.6053.pugilism:1 ""[sabotage_actor.GetTitledFirstName] đã can thiệp vào các dải băng quấn tay của [sabotage_target.GetTitledFirstNamePossessive], phủ lên đó một lớp thuốc bôi gây kích ứng để làm ta mất tập trung.""
  tournament_events.6053.horse:1 ""[sabotage_actor.GetTitledFirstName] đã tìm cách đầu độc con ngựa của [sabotage_target.GetTitledFirstNamePossessive], tráo thức ăn trong chuồng bằng những mẻ bị nhiễm độc khi bọn tiểu đồng đang ngủ.""
  tournament_events.6053.horse_race:1 ""[sabotage_actor.GetTitledFirstName] đã tìm cách đầu độc con ngựa đua, #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!, của [sabotage_target.GetTitledFirstNamePossessive], tráo thức ăn trong chuồng bằng những mẻ bị nhiễm độc khi bọn tiểu đồng đang ngủ.""
  tournament_events.6053.disqualified_target:0 "\n\n[host.GetTitledFirstName] đã chính đáng truất quyền thi đấu của tên chó ghẻ đáng nguyền rủa kia. Thật trơ trẽn!"
  tournament_events.6053.disqualified:0 "\n\nKhông có gì lạ khi [host.GetTitledFirstName] đã truất quyền thi đấu của [sabotage_actor.GetHerHim], khiến nạn nhân được nhắm tới của [host.GetHerHis] vô cùng hả hê."
  tournament_events.6053.forgiven_target:0 "\n\n[host.GetTitledFirstName] một cách trắng trợn đã tha thứ cho tên chó ghẻ kia, kẻ vẫn được phép tiếp tục thi đấu! Thật là trơ trẽn!"
  tournament_events.6053.forgiven:0 "\n\nĐáng ngạc nhiên thay, [host.GetTitledFirstName] đã không có bất kỳ hành động nào chống lại [sabotage_actor.GetHerHim], coi như bỏ qua sự việc."
  tournament_events.6053.a:0 "Thật trơ trẽn!"
  tournament_events.6500.t:1 "$tournament_header$ Những Điều Ta Làm Vì Tình Yêu"
  tournament_events.6500.desc:0 "Những nỗ lực của ta nhằm giành được sự chú ý của [woo_target.GetTitledFirstName] không hề bị bỏ qua, nhưng trái tim của [woo_target.GetHerHis] vẫn chưa mở ra với ta.\n\n\"Ta không phải là một [woo_target.Custom('GirlBoy')], một kẻ ngây thơ để giới quý tộc theo đuổi rồi vứt bỏ. Hãy cho ta thấy — chứng minh cho ta — tình cảm của ngươi, rồi chúng ta sẽ nói chuyện...\"\n\n\"Cho nàng thấy ư?\" ta hỏi, \"...ta phải làm thế nào?\"\n\nCâu trả lời của [woo_target.GetFirstNamePossessiveNoTooltip] đến rất nhanh: \"Thua cuộc.\""
  tournament_events.6500.a:0 "Theo ý nàng, [woo_target.GetFirstNameNoTooltip] yêu dấu."
  tournament_events.6500.b:0 "Không có danh dự nào trong thất bại!"
  tournament_events.6510.t:0 "Sức Quyến Rũ Của Chiến Thắng"
  tournament_events.6510.opening:0 "Những khoảng lặng trong lễ hội giải đấu cho ta đủ thời gian để sắp đặt một cuộc chạm mặt với [woo_target.GetFirstName]."
  tournament_events.6510.married:0 "Thật dễ dàng để đảm bảo rằng [woo_target.GetHerHis] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], sẽ ở nơi khác."
  tournament_events.6510.currentspouse:0 "Một cơ hội để chứng minh lòng tận tụy của ta với [woo_target.GetWomanMan] của mình!"
  tournament_events.6510.desc:0 "\n\n\"Xin chúc mừng vì chiến thắng trong phần thi [ROOT.Char.Custom('GetRandomWonContest')|l], [ROOT.Char.GetTitledFirstName],\" [woo_target.GetSheHe] lịch sự nói. \"Thật là một màn trình diễn ngoạn mục.\"\n\nCó một tia lấp lánh chân thành trong ánh mắt của [woo_target.GetHerHis], ta dám chắc điều đó."
  tournament_events.6510.a:0 "Ta làm tất cả vì #EMP nàng#!, thưa [woo_target.GetLadyLord] của ta."
  tournament_events.6510.a.tt:0 "#F Khơi gợi mặt cảm xúc của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
  tournament_events.6510.b:0 "Ồ, chuyện đó ư? Chẳng đáng gì cả."
  tournament_events.6510.b.tt:0 "#F Khơi gợi mặt kiêu ngạo của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
  tournament_events.6510.c:0 "Ta chỉ may mắn: các đối thủ đã chiến đấu rất anh dũng."
  tournament_events.6510.c.tt:0 "#F Khơi gợi mặt khiêm nhường của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
  tournament_events.6510.d:0 "[ROOT.Char.GetFaith.HighGodName] đã đáp lại lời cầu nguyện của ta bằng ân sủng của [ROOT.Char.GetFaith.HighGodHerHis]."
  tournament_events.6510.d.tt:0 "#F Khơi gợi mặt mộ đạo của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
  tournament_events.6511.reply_dedicate:0 "[woo_actor.GetSheHe|U] trơ trẽn đáp lại rằng [woo_actor.GetSheHe] đã làm tất cả vì ta!\n\n"
  tournament_events.6511.reply_dismiss:0 "[woo_actor.GetSheHe|U] thản nhiên đáp rằng ta thậm chí không nên nhắc tới một chuyện vặt vãnh như vậy.\n\n"
  tournament_events.6511.reply_praise:0 "[woo_actor.GetSheHe|U] nhanh chóng đáp rằng [woo_actor.GetSheHe] chỉ là may mắn; các đối thủ của [woo_actor.GetHerHis] chẳng hề kém cạnh [woo_actor.GetSheHe].\n\n"
  tournament_events.6511.reply_god:0 "[woo_actor.GetSheHe|U] chân thành đáp rằng [woo_actor.GetSheHe] biết ơn vì đã được [woo_actor.GetFaith.HighGodName] ban phúc.\n\n"
  tournament_events.6511.opening:0 "Ta tình cờ gặp [woo_actor.GetTitledFirstName] tại gian đình, và gửi lời chúc mừng cho chiến thắng của [woo_actor.GetHerHis] trong phần thi [ROOT.Char.Custom('GetRandomWonContest')|l].\n\n"
  tournament_events.6511.dedicate:0 "$tournament_events.6511.reply_dedicate$Ta không khỏi đỏ mặt trước màn tán tỉnh táo bạo này..."
  tournament_events.6511.dismiss:0 "$tournament_events.6511.reply_dismiss$Thật là một [woo_actor.GetWomanMan] táo bạo..."
  tournament_events.6511.praise:0 "$tournament_events.6511.reply_praise$Thật khiêm nhường..."
  tournament_events.6511.god:0 "$tournament_events.6511.reply_god$Quả là một [woo_actor.GetWomanMan] mộ đạo."
  tournament_events.6511.fallback:0 "[woo_actor.GetSheHe|U] chỉ mỉm cười đầy ẩn ý với ta, và ta thấy thật khó để rời mắt."
  tournament_events.6511.a:0 "Ta không thể phủ nhận [woo_actor.GetSheHe] có một sức quyến rũ nhất định..."

  tournament_events.6512.dedicate:0 "$tournament_events.6511.reply_dedicate$Ta không khỏi rùng mình trong lòng..."
  tournament_events.6512.dismiss:0 "$tournament_events.6511.reply_dismiss$Thật là kiêu căng..."
  tournament_events.6512.praise:0 "$tournament_events.6511.praise$Học cách đón nhận lời khen đi, thật vậy!"
  tournament_events.6512.god:0 "$tournament_events.6511.god$Thật là chán ngắt..."
  tournament_events.6512.fallback:0 "[woo_actor.GetSheHe|U] chỉ mỉm cười với ta đầy ẩn ý, khiến ta cảm thấy #EMP cực kỳ#! khó chịu."
  tournament_events.6512.a:0 "Thật là một [woo_actor.GetWomanMan] lố bịch."
  tournament_events.6513.reply:0 "[woo_target.GetTitledFirstName] dường như đã phản ứng khá nồng nhiệt trước câu trả lời của ta"
  tournament_events.6513.dedicate:0 "$tournament_events.6513.reply$, đỏ mặt khi [woo_target.GetSheHe] cười e thẹn."
  tournament_events.6513.dismiss:0 "$tournament_events.6513.reply$, gần như đang nhìn ta bằng một ánh mắt hoàn toàn khác."
  tournament_events.6513.praise:0 "$tournament_events.6513.reply$, đáp rằng [woo_target.GetSheHe] tin chắc đó không chỉ là may mắn."
  tournament_events.6513.god:0 "$tournament_events.6513.reply$, đáp rằng hẳn là ý chí của [woo_target.GetFaith.HighGodName]."
  tournament_events.6513.fallback:0 "$tournament_events.6513.reply$, nhìn thật lâu và sâu vào mắt ta."
  tournament_events.6513.desc:0 "\n\nKhi [woo_target.GetSheHe] rời đi, sự căng thẳng hiện rõ trong từng lời xã giao — ta biết mình đã tìm được những lời đúng đắn để chinh phục [woo_target.GetHerHim]!"
  tournament_events.6513.a:0 "Ta nghĩ [woo_target.GetSheHe] đã mắc câu..."
  tournament_events.6514.reply:0 "Câu trả lời của ta dường như không gây ấn tượng với [woo_target.GetTitledFirstName]"
  tournament_events.6514.dedicate:0 "$tournament_events.6514.reply$, for [woo_target.GetSheHe] avoids my gaze when [woo_target.GetSheHe] thanks me and quickly takes [woo_target.GetHerHis] leave."
  tournament_events.6514.dismiss:0 "$tournament_events.6514.reply$, for [woo_target.GetSheHe] rolls [woo_target.GetHerHis] eyes dismissively."
  tournament_events.6514.praise:0 "$tournament_events.6514.reply$, khi [woo_target.GetSheHe] nhanh chóng mất hứng, bị lời nói của ta làm cụt hứng."
  tournament_events.6514.god:0 "$tournament_events.6514.reply$, khi [woo_target.GetSheHe] trở nên lơ đãng, dường như chỉ nghe ta nửa tai."
  tournament_events.6514.fallback:0 "$tournament_events.6513.reply$, khi [woo_target.GetSheHe] không thể rời khỏi ta sớm hơn được nữa."
  tournament_events.6514.desc:0 "\n\nStanding alone after [woo_target.GetHerHis] has made [woo_target.GetHerHis] farewell, I cannot help but feel a fool for such an utter misstep..."
  tournament_events.6514.a:0 "Ta đã nghĩ gì thế này...?"
  tournament_events.6900.t:1 "$tournament_header$ Kỵ Sĩ Địa Phương"
  tournament_events.6900.desc:0 "Quan sát đám tiểu quý tộc tụ họp tại [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], ta bắt gặp đúng kiểu [local_lancer.GetWomanMan] mà mình cần.\n\n"
  tournament_events.6900.new:0 "[local_lancer.GetFullName] is a local horse[local_lancer.GetWomanMan] of some experience, known in these parts for [local_lancer.GetHerHis] valor despite [local_lancer.GetHerHis] low station — a [ROOT.Char.Custom('MountedWarriorTerm')] of a forgotten provincial line."
  tournament_events.6900.pool:0 "[local_lancer.GetFullName] là một kỵ sĩ lang bạt có chút kinh nghiệm, đi từ triều đình này sang triều đình khác để tìm một [ROOT.Char.GetLadyLord] mà phục vụ. Những [local_lancer.GetWomenMen] như vậy thường không đáng tin, nhưng tài năng của [local_lancer.GetHerHis] thì lộ rõ ngay lập tức."
  tournament_events.6900.closing:0 "\n\nKhi ta tiến tới để giới thiệu, [bidder.GetTitledFirstName] xuất hiện bên cạnh [local_lancer.GetHerHim], rõ ràng là cũng chung ý tưởng với ta..."
  tournament_events.6900.a:0 "Hãy yên tâm, ta sẽ trả giá cao hơn."
  tournament_events.6900.a.success:0 "[local_lancer.GetFirstNameNoTooltip] bị chi phối bởi tiền bạc"
  tournament_events.6900.a.failure:0 "[local_lancer.GetFirstNameNoTooltip] thích [bidder.GetFirstNameNoTooltip] hơn"
  tournament_events.6900.b:0 "[local_lancer.GetFirstNameNoTooltip], ngươi sẽ ngồi trong lều lớn của ta!"
  tournament_events.6900.b.success:0 "[local_lancer.GetFirstNameNoTooltip] tìm kiếm sự hưởng thụ trần thế"
  tournament_events.6900.c:0 "Nào, ngươi thật sự muốn phục vụ một #EMP [bidder.GetTitleAsNameNoTooltip]#! tầm thường sao?"
  tournament_events.6900.c.success:0 "[local_lancer.GetFirstNameNoTooltip] là kẻ đầy tham vọng"
  tournament_events.6900.d:0 "Tránh ra [bidder.GetFirstNameNoTooltip], [ROOT.Char.GetTitleAsNameNoTooltip] của ngươi phải đứng sau."
  tournament_events.6900.e:0 "Ta sẽ không mặc cả vì một [ROOT.Char.Custom('MountedWarriorTerm')]."

  tournament_events.7000.t:1 "$tournament_header$ Hãy Làm Một [ROOT.Char.GetWomanMan|U]!"
  tournament_events.7000.desc:2 "Ta chào một nhóm [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] khi họ đi ngang qua Ta. Một người, tụt lại phía sau những người còn lại, khiến Ta khựng lại. Xoay gót chân, Ta gọi với theo dáng người đó.\n\nHọ khoác lên mình bộ giáp vô định hình, không vừa vặn, đôi mắt mở to và rõ ràng là đầy sợ hãi dưới chiếc mũ trụ. #EMP Có điều gì đó#! không ổn ở đây. Tiến lên một bước, Ta giật phăng chiếc mũ trước khi họ kịp phản ứng.\n\nĐứng trước mặt Ta, lén lút nhìn quanh xem có ai khác chú ý không, không ai khác chính là một [mulan.GetWomanMan]! Lại còn cải trang thành một [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')]. Thậm chí còn định #EMP tranh tài#! với tư cách là một [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] nữa!"
  tournament_events.7000.a:0 "Ta sẽ giữ kín bí mật của ngươi."
  tournament_events.7000.a.tt:1 "Tham gia [activity.GetShortName]"
  tournament_events.7000.b:0 "Ta có thể cần đến sự phục vụ của người như ngươi."
  tournament_events.7000.b.tt:0 "Trở thành [mulan.Custom('KnightCulture')] của Ngài"
  tournament_events.7000.c:0 "Lính canh! #EMP Lính canh!#! Có một #EMP [mulan.GetWomanMan]#! trong giải đấu của chúng ta!"

