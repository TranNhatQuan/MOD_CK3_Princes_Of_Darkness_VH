 # MODIFIERS
  tournament_allow_foreign_pas_darmes_modifier:0 "Kẻ Ngoại Bang Được Dung Thứ"
  tournament_allow_foreign_pas_darmes_modifier_desc:0 "Việc nhân vật này cho phép một hiệp sĩ ngoại bang liên tục thách đấu giới quý tộc bằng võ nghệ đã khiến nhiều người phải nhíu mày."
  tournament_butt_tragedy_modifier:0 "Dân Chúng Phẫn Nộ"
  tournament_butt_tragedy_modifier_desc:0 "Sự rẻ rúng mạng sống của một nông dân địa phương bị bắn chết ngoài ý muốn đã khiến thường dân vô cùng bàng hoàng và phẫn nộ."
  tournament_battle_peasant_modifier:0 "Thường Dân Trỗi Dậy"
  tournament_battle_peasant_modifier_desc:0 "Việc thăng tiến từ một thường dân thấp kém lên hàng hiệp sĩ của nhân vật này đã khiến giới quý tộc hiện hữu vô cùng khó chịu."
  tournament_battle_peasant_county_modifier:0 "Dịch Chuyển Xã Hội"
  tournament_battle_peasant_county_modifier_desc:0 "Việc đề bạt một nông dân địa phương đã thắp lên trong lòng thường dân niềm hy vọng về sự vươn lên."
  tournament_favor_scheme_modifier:0 "Ân Huệ Được Ban"
  tournament_favor_rejected_scheme_modifier:0 "Ân Huệ Bị Từ Chối"
  tournament_thug_escape_modifier:0 "Dấy Lên Phẫn Nộ"
  tournament_thug_escape_modifier_desc:0 "Nhân vật này gần đây đã thoát chết khỏi một âm mưu hiểm độc nhằm vào mạng sống của mình."
  tournament_poison_tummy_ache_modifier:0 "Đau Bụng"
  tournament_poison_tummy_ache_modifier_desc:0 "Nhân vật này đã uống phải một thứ đồ uống tệ hại và vẫn còn cảm thấy khó chịu."
  tournament_attempted_sabotage_modifier:0 "Kẻ Phá Hoại Bị Lộ"
  tournament_attempted_sabotage_modifier_desc:0 "Nhân vật này đã bị bắt quả tang khi cố gắng phá hoại các thí sinh khác trong giải đấu."
  tournament_stands_collapsed_modifier:0 "Khán Đài Sập"
  tournament_stands_collapsed_modifier_desc:0 "Hạt này đang chao đảo vì mất mát cả sinh mạng lẫn niềm tin vào vương quyền sau khi một khán đài giải đấu bất ngờ sụp đổ."
  tournament_stands_compensated_modifier:0 "Sụp Đổ Được Bồi Thường"
  tournament_stands_compensated_modifier_desc:0 "Hạt này đã hứng chịu một thảm họa bi thương, nhưng việc bồi thường cho các nạn nhân của khán đài sập là một ân huệ không ngờ tới."
  tournament_executed_builders_modifier:0 "Thợ Xây Bị Xử Tử"
  tournament_executed_builders_modifier_desc:0 "Sự trừng phạt nhanh chóng dành cho các thợ xây đã xoa dịu phần nào cơn giận của thường dân, nhưng cái giá phải trả là gì?"
  tournament_compensated_stands_modifier:0 "Nạn Nhân Được Bồi Thường"
  tournament_compensated_stands_modifier_desc:0 "Việc bồi thường cho các nạn nhân của khán đài sập đã khôi phục niềm tin của thường dân vào một nền cai trị nhân hậu."
  tournament_punished_arsonists_modifier:0 "Kẻ Phóng Hỏa Bị Trừng Phạt"
  tournament_punished_arsonists_modifier_desc:0 "Sự trừng phạt khắc nghiệt dành cho các cận vệ hỗn láo đã gieo mầm bất mãn trong hàng hiệp sĩ của họ, nhưng lại giành được sự kính trọng của nhiều người khác."
  tournament_coddled_arsonists_modifier:0 "Kẻ Phóng Hỏa Được Bao Che"
  tournament_coddled_arsonists_modifier_desc:1 "Việc bao che cho các cận vệ hỗn láo đã khiến nhân vật này được lòng các [ROOT.Char.Custom('KnightCulture')]s của mình, nhưng lại làm nhiều người khác kinh hãi."
  tournament_squire_riot_modifier:0 "Hỏa Hoạn Do Cận Vệ"
  tournament_squire_riot_modifier_desc:0 "Hạt này đã bị tàn phá bởi một vụ cháy do các cận vệ hỗn láo gây ra khi chè chén tại một giải đấu."
  tournament_tyrannical_disqualification_modifier:0 "Loại Trừ Độc Đoán"
  tournament_tyrannical_disqualification_modifier_desc:0 "Nhân vật này đã mang tiếng xấu là không mấy khi chơi đúng luật."

  tournament_melee_winner_modifier:0 "Quán Quân Cận Chiến"
  tournament_melee_winner_modifier_desc:0 "Đội của nhân vật này đã chiến thắng trong cuộc thi Cận Chiến, mang lại cho họ danh tiếng và vinh quang lớn."
  tournament_joust_winner_modifier:0 "Nhà Vô Địch Thương Kỵ"
  tournament_joust_winner_modifier_desc:0 "Nhân vật này đã giành được danh tiếng và tài lộc khi chiến thắng cuộc thi Thương Kỵ tại giải đấu."
  tournament_wrestling_winner_modifier:0 "Đô Vật Xuất Chúng"
  tournament_wrestling_winner_modifier_desc:0 "Nhân vật này đã chứng minh bản lĩnh và sức mạnh của mình khi chiến thắng cuộc thi Đô Vật tại giải đấu."
  tournament_duel_winner_modifier:0 "Đấu Sĩ Tài Năng"
  tournament_duel_winner_modifier_desc:0 "Khả năng kiếm thuật của nhân vật này đã giúp họ chiến thắng cuộc thi Song Đấu tại giải đấu."
  tournament_archery_winner_modifier:0 "Thiện Xạ"
  tournament_archery_winner_modifier_desc:0 "Khả năng bắn cung chuẩn xác của nhân vật này đã giúp họ chiến thắng cuộc thi Bắn Cung tại giải đấu."
  tournament_recital_winner_modifier:0 "Bậc Thầy Thi Ca"
  tournament_recital_winner_modifier_desc:0 "Tài ăn nói lưu loát của nhân vật này đã giúp họ chiến thắng cuộc thi Ngâm Thơ tại giải đấu."
  tournament_horse_race_winner_modifier:0 "Quán Quân Đua Ngựa"
  tournament_horse_race_winner_modifier_desc:0 "Con ngựa của nhân vật này đã chiến thắng trong cuộc thi Đua Ngựa tại giải đấu."
  tournament_board_game_winner_modifier:0 "Đại Cao Thủ"
  tournament_board_game_winner_modifier_desc:0 "Sự tinh thông trò chơi bàn cờ của nhân vật này đã được chứng minh khi họ chiến thắng cuộc thi Cờ Bàn tại giải đấu."

  tournament_melee_participant_modifier:0 "Người Tham Gia Cận Chiến"
  tournament_melee_participant_modifier_desc:0 "Nhân vật này đã tham gia một cuộc thi Cận Chiến tại giải đấu, mang lại cho họ một mức độ danh tiếng và tài lộc nhất định."
  tournament_joust_participant_modifier:0 "Kỵ Sĩ Thương"
  tournament_joust_participant_modifier_desc:0 "Nhân vật này đã tham gia một cuộc thi Thương Kỵ tại giải đấu, mang lại cho họ một mức độ danh tiếng và tài lộc nhất định."
  tournament_wrestling_participant_modifier:0 "Đô Vật Sĩ"
  tournament_wrestling_participant_modifier_desc:0 "Nhân vật này đã tham gia Đô Vật tại giải đấu, mang lại cho họ một mức độ danh tiếng và tài lộc nhất định."
