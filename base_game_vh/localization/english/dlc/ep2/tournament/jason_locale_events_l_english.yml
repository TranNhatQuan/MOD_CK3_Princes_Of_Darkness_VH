l_english:
 
#LOCALE EVENTS

#VISITOR'S CAMP
  jason_locale_events.100.t:0 "[unreliable_knight.GetSheHe|U] Khước Từ Trận Đấu"
  jason_locale_events.100.desc:0 "Những lần vắng mặt gần đây của $knight_culture_player_no_tooltip_lowercase$ [unreliable_knight.GetTitledFirstNamePossessive] không qua được mắt ta, cũng như việc nhiều gia nhân bị xua khỏi cửa phòng của [unreliable_knight.GetHerHis]. Theo yêu cầu của ban tổ chức giải, ta bước vào chỗ ở của [unreliable_knight.GetHerHis].\n\n"
  jason_locale_events.100.desc.mess:0 "Rượu tràn vấy bẩn nền nhà, ngổn ngang là đồ ăn bị gặm nham nhở, những thứ lặt vặt kỳ quái, đồ đạc xáo trộn.\n\n"
  jason_locale_events.100.desc.self_harm:0 "Ánh sáng u ám phủ lên nền nhà vương vãi quần áo rách nát, đồ vật vỡ vụn,"
  jason_locale_events.100.desc.smug:0 "[unreliable_knight.GetTitledFirstNameNoTooltip] acknowledges me with a scant obeisance, turning [unreliable_knight.GetHerHis] shining sword over and over in [unreliable_knight.GetHerHis] hands.\n\n"
  jason_locale_events.100.desc.insanity:0 "lông vũ, phân và máu.\n\nMột bàn tay bị chặt rời nằm dưới chân [unreliable_knight.GetTitledFirstNamePossessiveNoTooltip]. Của ai ư? Ta không biết. [unreliable_knight.GetSheHe|U] vung vẩy cả hai tay [unreliable_knight.GetHerHis], lảm nhảm:\n\n\"Sẽ còn nhiều bàn tay nữa xuất hiện, thưa [ROOT.Char.GetTitleTierName|U] của Ta, nhiều bàn tay nữa. Ngài thấy chứ? Nếu ta tham dự các cuộc thi, sẽ còn xuất hiện thêm những bàn tay đẫm máu.\""
  jason_locale_events.100.desc.drunk:0 "$knight_culture_player_no_tooltip_lowercase$ của ngươi say khướt đến kinh người, vẫn còn nốc thêm rượu, nhăn nhó vì sự tự khinh ghét lộ rõ trên gương mặt [unreliable_knight.GetHerHis]. Gã say xỉn này sáng mai chắc chắn sẽ thảm hại.\n\n\"Ta có phải, có phải — #EMP *hic*#! — cưỡi ngựa hay đánh nhau hay cái gì đó không?\""
  jason_locale_events.100.desc.hash:0 "Your $knight_culture_player_no_tooltip_lowercase$ is staggeringly addled, with [unreliable_knight.GetHerHis] breath stinking of hashish. Skin sticky with sweat, [unreliable_knight.Custom('EyeEyes')] narrowly squinting, [unreliable_knight.GetSheHe] giggles and drools out a question:\n\n"Am I, uh, meant to be doing something... in the next lil' while?""
  jason_locale_events.100.desc.depressed:0 "máu của một $knight_culture_player_no_tooltip_lowercase$.\n\nNước mắt nhuộm đỏ gò má [unreliable_knight.GetTitledFirstNamePossessiveNoTooltip].\n\n\"Ta không thể ra ngoài kia,\" $knight_culture_player_no_tooltip_lowercase$ của ngươi nức nở. \"Ta không thể đối mặt với họ. Không phải lần nữa — không phải bây giờ. Xin hãy, thưa [ROOT.Char.GetTitleTierName|U] của Ta, #EMP xin hãy#!… tha cho Ta khỏi vòng tranh đấu của giải đấu?\""
  jason_locale_events.100.desc.demand:0 "\"Cả thiên hạ đều biết ta là một $knight_culture_player_no_tooltip_lowercase$ vĩ đại và xứng đáng,\" [unreliable_knight.GetSheHe] gầm gừ. \"Vì vậy, nếu không có tùy tùng quý tộc và lễ vật xứng tầm từ lãnh chúa của ta, ta buộc phải #EMP từ chối#! thi đấu.\"\n\n\"Việc ta dự giải trong cảnh nghèo túng sẽ làm ô danh cả hai chúng ta.\""

  jason_locale_events.100.a:0 "Ngươi nợ ta sự phục vụ, còn nhớ chứ?"
  jason_locale_events.100.a.tt:0 "Perhaps [unreliable_knight.GetSheHe] isn't prepared to give [unreliable_knight.GetHerHis] best, but this $knight_culture_player_no_tooltip_lowercase$ #EMP will#! bend to your authority."

  jason_locale_events.100.b:1 "Thi đấu đi! Ta sẽ cho ngươi bất cứ thứ gì!"
  jason_locale_events.100.b.tt:1 "Và ta thề sẽ chăm lo cho các $knight_culture_player_plural_no_tooltip_lowercase$ ưu tú nhất của ta!"

  jason_locale_events.100.c.mad:0 "Lời thề của ngươi đã bị hủy, đồ điên! Cút đi!"
  jason_locale_events.100.c.drunk:0 "Lời thề của ngươi đã bị hủy, đồ say xỉn! Cút đi!"
  jason_locale_events.100.c.hash:0 "Lời thề của ngươi đã bị hủy, đồ ngu ngốc! Cút đi!"
  jason_locale_events.100.c.depressed:0 "Ngươi không còn là $knight_culture_player_no_tooltip_lowercase$ của ta."
  jason_locale_events.100.c.demanding:0 "Lời thề của ngươi đã bị hủy, đồ khoác lác! Cút đi!"
  jason_locale_events.100.c.tt:0 "Trục xuất $knight_culture_player_no_tooltip_lowercase$ đáng xấu hổ này khỏi sự phục vụ!"

  jason_locale_events.100.c.forbid_knight:0 "[unreliable_knight.GetShortUIName] bị cấm làm $knight_culture_player_no_tooltip_lowercase$ của ngươi"

  jason_locale_events.100.d:0 "Có lẽ ngươi chỉ nên… nghỉ ngơi."
  jason_locale_events.100.d.not_competing:0 "[unreliable_knight.GetShortUIName] sẽ không thi đấu hay hỗ trợ các nội dung đồng đội"

  knight_not_participating_log_title:0 "Tùy Tùng Rút Lui"
  knight_not_participating_log:1 "Chiến binh của [CHARACTER.GetTitledFirstNamePossessive], [TARGET_CHARACTER.GetTitledFirstName], đã rút khỏi giải đấu. Tin đồn lan truyền khắp nơi."
  knight_dismissed_log_title:0 "Tùy Tùng Bị Sa Thải"
  knight_dismissed_log:1 "[CHARACTER.GetTitledFirstName] released the noted competitor [TARGET_CHARACTER.GetTitledFirstName] from [CHARACTER.GetHerHis] service following a mysterious incident."

  jason_locale_events.210.t.camel_cavalry:0 "Bậc Thầy Sa Mạc"
  jason_locale_events.210.t.elephant_cavalry:0 "Những Quản Tượng Tương Lai"
  jason_locale_events.210.t.horse_archer:0 "Phát Bắn Ngoảnh Lại"
  jason_locale_events.210.t.heavy_cavalry:0 "Như Sấm Sét"
  jason_locale_events.210.t.crossbowmen:0 "Cung Nỏ Giao Thoa"
  jason_locale_events.210.t.heavy_infantry:0 "Đứng Vững, Bất Động"
 
  jason_locale_events.210.desc:0 "$knight_culture_player_plural_no_tooltip$ diễn lại các hành vi chiến trận, các đối thủ thân thiện vênh váo, còn phiên dịch thì vừa làm việc vừa cười đùa.\n\n\"Các ngươi, những [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], có kỹ nghệ của mình,\" [foreign_lord.GetName] thừa nhận,"
  jason_locale_events.210.desc.teen:0 "$knight_culture_player_plural_no_tooltip$ diễn lại các hành vi chiến trận, các đối thủ thân thiện vênh váo, còn phiên dịch thì vừa làm việc vừa cười đùa.\n\n\"Các ngươi, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], ừ thì… cũng được đấy,\" [foreign_lord.GetName] sụt sịt,"
  jason_locale_events.210.desc.camel_cavalry:0 "\"nhưng tất cả các ngươi đều thiếu ý chí để thuần phục một con lạc đà! Và ngay cả cái mông heo của các ngươi cũng chẳng an ủi nổi các ngươi trên yên của chúng ta!\"\n\nNhững người chăm ngựa gần đó nắm chặt dây cương lạc đà: thách thức của [foreign_lord.GetTitleTierName] là hoàn toàn nghiêm túc. Dù người [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] khiến ngựa khiếp sợ và thống trị sa mạc, đất khô cằn trên lưng thú cưỡi của họ… mùi lạc đà thì thực sự khủng khiếp."
  jason_locale_events.210.desc.elephant_cavalry:0 "\"nhưng có chiến binh [ROOT.Char.GetCulture.GetNameNoTooltip] nào đủ can đảm đứng trên lưng voi giữa trận mạc — vừa vung thương vừa bắn cung khi cái vòi khổng lồ gầm thét cuồng nộ?\"\n\nCặp ngà mạ vàng của một con voi lấp lánh gần đó; tháp chiến trên lưng nó kẽo kẹt ở độ cao chót vót. [foreign_lord.GetTitleTierName] đưa ra một thách thức mênh mông và khó lường."
  jason_locale_events.210.desc.horse_archer:0 "\"nhưng trong các ngươi, ai có thể ngoảnh người trên yên khi phi hết tốc lực, rồi bắn tên qua đuôi ngựa? Có thể canh đúng nhịp giữa những bước vó không? Đứa trẻ [foreign_lord.GetCulture.GetNameNoTooltip] nhỏ nhất cũng làm được.\"\n\nTa thấy các [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] của mình kéo cung sừng, vỗ về những con ngựa thảo nguyên. Chúng ta là những kỵ sĩ giỏi… nhưng liệu có sánh được với một dân tộc sinh ra đã ở trên yên ngựa?"
  jason_locale_events.210.desc.heavy_cavalry:0 "\"nhưng ai trong các ngươi đã từng thúc ngựa xông thẳng vào hàng ngũ địch, mặc kệ mọi vũ khí, để chiến mã giẫm nát, mũi thương đâm trúng đích? Thử con chiến mã của ta xem: hãy xem các ngươi có thể hất ngã cả kỵ sĩ [foreign_lord.GetCulture.GetNameNoTooltip] tệ nhất không.\"\n\nDân ta không dùng bộ yên cương cần thiết để cưỡi thương nặng lao vào trận: đó không phải lối đánh của chúng ta. Nhưng… ta có thể để lời khoe khoang ấy đứng vững sao?"
  jason_locale_events.210.desc.crossbowmen:0 "\"nhưng các ngươi đã từng #EMP thấy#! thứ này chưa? Có thể lên dây và ngắm bắn không?\"\n\n[foreign_lord.GetTitleTierName] trao cho ta một vũ khí mà ta thực ra đã từng thấy… từ xa. Đó là một cây cung mạnh đặt ngang ở đầu rãnh dẫn tên: người [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] dùng nó để xuyên giáp. Bất kỳ loại giáp nào."
  jason_locale_events.210.desc.heavy_infantry:0 ""you can dart to and fro! But what of holding firm against one of my warriors, weighed down by our heavy kit, until the foe breaks against you?"\n\nMy [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] struggle into impressive [foreign_lord.GetCulture.GetNameNoTooltip] armor, hoist [foreign_lord.GetCulture.GetNameNoTooltip] weapons, marvel at their weight. To sweat through such a strange duel... would take impressive grit."

  jason_locale_events.210.a:0 "Ta sẽ thử!"
  jason_locale_events.210.b:0 "[root_culture_knight.GetTitledFirstNameNoTooltip] là hiện thân của kỹ nghệ [ROOT.Char.GetCulture.GetNameNoTooltip]."
  jason_locale_events.210.b.same_heritage:0 "[root_culture_knight.GetTitledFirstName] là hiện thân của kỹ nghệ [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip]."
  jason_locale_events.210.a.win:0 "Ngươi đại diện cao quý cho người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]"
  jason_locale_events.210.a.lose:0 "Sự vụng về và mảnh mai của ngươi mời gọi những lời chế giễu hả hê"

  jason_locale_events.210.b.tt:0 "[root_culture_knight.GetSheHe|U] sánh ngang mọi kỳ công, dù xa lạ đến đâu!"
  jason_locale_events.210.b.win:0 "[root_culture_knight.GetFirstNameNoTooltip] sánh kịp kỹ nghệ của người [foreign_lord.GetCulture.GetNameNoTooltip]"
  jason_locale_events.210.b.lose:0 "Những nỗ lực của [root_culture_knight.GetFirstNamePossessiveNoTooltip] thì… khá thảm hại"
  jason_locale_events.210.c:0 "Ngài có thể cho mượn vài [foreign_lord.Custom('KnightCultureNoTooltip')|l] để dạy chúng ta chăng?"
  jason_locale_events.210.c.tt:0 "Một ít tài năng ngoại bang có thể giúp ích cho cả các [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] lẫn quân sĩ chuyên nghiệp của ta."
  jason_locale_events.210.d.camel_cavalry:0 "Người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] chúng ta không cần lũ thú thô kệch!"
  jason_locale_events.210.d.tt.camel_cavalry:0 "Ta thề người [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] các ngươi thà nếm vị nước bọt lạc đà còn hơn đối đầu binh sĩ dũng cảm của ta!"
  jason_locale_events.210.d.elephant_cavalry:0 "Người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] chúng ta đã đủ cao lớn!"
  jason_locale_events.210.d.tt.elephant_cavalry:0 "Bọn [foreign_lord.GetCulture.GetNameNoTooltip] ngu ngốc có thể bị chính quái thú của mình giẫm nát bất cứ lúc nào! #EMP Còn ta sẽ giành vinh quang!#!"
  jason_locale_events.210.d.horse_archer:0 "Người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] chúng ta đối mặt kẻ thù!"
  jason_locale_events.210.d.tt.horse_archer:0 "Cứ để bọn [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] vô danh quay vòng vòng! Vợ chồng họ hẳn phải ghen tị với những con ngựa của họ lắm…"
  jason_locale_events.210.d.heavy_cavalry:0 "Người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] chúng ta đánh đủ mạnh!"
  jason_locale_events.210.d.tt.heavy_cavalry:1 "Chúng ta chẳng cần lao vào nhau một cách mù quáng!"
  jason_locale_events.210.d.crossbowmen:0 "Người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] chúng ta không cần mấy thứ máy móc!"
  jason_locale_events.210.d.tt.crossbowmen:0 "Như kẻ hèn nhát, bọn [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] hạ sát những chiến binh cao quý nhất từ xa. Còn chúng ta thì không bao giờ."
  jason_locale_events.210.d.heavy_infantry:0 "Người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] chúng ta tự vệ được!"
  jason_locale_events.210.d.tt.heavy_infantry:0 "Giáp ư? Cần gì, khi ta có kỹ nghệ? Người [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] nặng nề như đá tảng: ta sẽ chôn vùi họ dưới lòng đất."

  cultural_acceptance_knightly_camaraderie:0 "Trao đổi thực hành võ nghệ"
  cultural_acceptance_knightly_rivalry:0 "Thù địch giữa các chiến binh dự giải"
  tournament_open_minded_warrior_modifier:0 "Chiến Binh Cởi Mở"
  tournament_open_minded_warrior_modifier_desc:0 "Nhân vật này thể hiện sự quan tâm sâu sắc tới các lối võ nghệ của những dân tộc khác."
  tournament_knight_humiliated_modifier:0 "Hiệp Sĩ Tối Thượng Bị Làm Nhục"
  tournament_knight_humiliated_modifier_desc:0 "Những kẻ thách đấu ngoại bang đã làm nhục hiệp sĩ lỗi lạc của nhân vật này: các chiến binh của ông ta bị xem là trò cười."
  tournament_loyalty_martial_traditions_modifier:0 "Trung Thành Với Truyền Thống Võ Nghệ"
  tournament_loyalty_martial_traditions_modifier_desc:0 "Nhân vật này kịch liệt bảo vệ sự ưu việt của lối đánh quê hương mình."

#TAVERN
  jason_locale_events.200.t:0 "Lòng Trung Thành, Ợ Hơi"
  jason_locale_events.200.desc:0 ""Every dram of my honor," slurs [drunk_knight.GetFullName], spilling on [drunk_knight.GetHerselfHimself], "Belongs with you!"\n\nServants try to restrain [drunk_knight.GetHerHim], [drunk_knight.GetHerHis] friends offering excuses. The drunken $knight_culture_player_no_tooltip_lowercase$ swats them away.\n\n"Unhand me! Damn you all! [ROOT.Char.GetTitleTierName] — free me from my tatty master! My oath is yours. Will you have me?"\n\nLaughter catches in my throat. For [drunk_knight.GetFirstNameNoTooltip] is a truly famed $knight_culture_player_no_tooltip_lowercase$, granted high honors by [drunk_knight.GetHerHis] liege, [drunk_knight_liege.GetTitledFirstName]."
  jason_locale_events.200.desc.caution:0 "Trò điên rồ do rượu này… có thể mang về cho ta cả một chiến binh vĩ đại lẫn một kẻ thù thù hằn."
  jason_locale_events.200.desc.party:0 "Và đúng là, việc mất [drunk_knight.GetHerHis] sẽ khiến [drunk_knight_liege.GetTitleTierName] nổi giận… nhưng ta linh cảm một cuộc ăn mừng #EMP để đời#! sắp diễn ra…"

  jason_locale_events.200.a:0 "Chứng minh đi, $knight_culture_player_no_tooltip_lowercase$! #EMP Uống đi!#!"
  jason_locale_events.200.a.tt:0 "[drunk_knight.GetFirstNameNoTooltip] say mèm sẽ cố chứng tỏ giá trị của [drunk_knight_liege.GetHerHis]… bằng cách nào ư? Chỉ có rượu mới biết."
  jason_locale_events.200.a.tt.join:0 "[drunk_knight.GetFirstNameNoTooltip] trở thành $knight_culture_player_no_tooltip_lowercase$ của ngươi, khơi dậy cơn thịnh nộ của [drunk_knight_liege.GetShortUINamePossessive]"
  jason_locale_events.200.a.tt.recruit:0 "\"[ROOT.Char.GetTitleTierName] hiệu triệu, hỡi các $knight_culture_player_plural_no_tooltip_lowercase$! Các ngươi có đáp lời không?\""
  jason_locale_events.200.a.tt.recruit_desc:0 "Nhiều $knight_culture_player_plural_no_tooltip_lowercase$ say xỉn khác thề trung thành với ngươi"
  jason_locale_events.200.a.tt.join_three:0 "[drunk_knight.GetShortUIName] trở thành $knight_culture_player_no_tooltip_lowercase$ của ngươi"
  jason_locale_events.200.a.tt.recruit_lieges:0 "Lãnh chúa của các cận thần mới của ngươi nổi giận, đặc biệt là [drunk_knight_liege.GetShortUIName]"
  jason_locale_events.200.a.tt.recruit_specific:0 "[extra_knight.GetFirstNameNoTooltip] và [extra_knight_2.GetFirstNameNoTooltip] thề trung thành với ngươi"
  jason_locale_events.200.a.tt.song:0 "\"Tụ họp lại! Ta sẽ hát câu chuyện về [ROOT.Char.GetTitledFirstNameNoTooltip] vĩ đại!\""
  jason_locale_events.200.a.tt.song_specific:0 "Khúc hát cuồng nhiệt của [drunk_knight.GetFirstNamePossessiveNoTooltip] báo hiệu lời thề trung thành của [drunk_knight.GetHerHis] với ngươi"
  jason_locale_events.200.a.tt.beatings:0 "\"Ngươi muốn xem ta đánh nhau ư?\""
  jason_locale_events.200.a.tt.beatings_specific:0 "[drunk_knight.GetFirstNameNoTooltip] proves [drunk_knight.GetHerselfHimself] with some brutal beatings"
  jason_locale_events.200.a.tt.marry:0 "\"Chỉ có hôn nhân mới gắn kết chúng ta!\""
  jason_locale_events.200.a.tt.marry_desc:0 "Một thành viên thuộc [house|E] hoặc [close_family|E] của ngươi sẽ kết hôn với [drunk_knight.GetUIName]"
  jason_locale_events.200.a.tt.marry_specific:0 "[ROOT.Char.Custom2('RelationToMeShort', surprise_spouse)] của ngươi, [surprise_spouse.GetFirstNameNoTooltip], kết hôn với [drunk_knight.GetFirstNameNoTooltip]"
  jason_locale_events.200.a.tt.death:0 "\"Ta sẽ uống với ngài từng chén một, thưa [ROOT.Char.GetTitleTierName]!\""
  jason_locale_events.200.a.tt.death_specific:0 "Tài uống rượu của [drunk_knight.GetFirstNamePossessiveNoTooltip]… đã phản bội [drunk_knight.GetHerHim]"

  jason_locale_events.200.b:0 "Cầu mong lòng tận tụy của ngươi chẳng bao giờ lung lay... dù chính ngươi thì có!"
  jason_locale_events.200.b.tt:0 "Thực hiện nghi thức tuyên thệ trang trọng, không thể rút lại khi bình minh lên."

  jason_locale_events.200.c:1 "Tránh ra, đồ ngu. Lãnh chúa của ngươi sẽ nghe chuyện này."
  jason_locale_events.200.c.tt:1 "Tên phản đồ say rượu này thì làm được gì? Nôn vào ta sao? [drunk_knight.GetSheHe|U] đâu còn đủ tỉnh táo để chiến đấu."

  jason_locale_events.200.c.unchallenged:0 "$knight_culture_player_no_tooltip_lowercase$ chùn bước"

  jason_locale_events.200.c.attacked:0 "[drunk_knight.GetSheHe|U] #bold tát#! vào mặt Ngài"

  jason_locale_events.200.c.duel.tt:0 "Cả hai cùng rút vũ khí!"
  jason_locale_events.200.c.slap.tt:0 "Cận vệ của Ngài can thiệp, nhưng đã quá muộn!"

  jason_locale_events.200.c.won_brawl.tt:0 "Cái đầu tỉnh táo hơn của Ngài đã chiến thắng!"
  jason_locale_events.200.c.lost_brawl.tt:0 "Bị làm nhục bởi một kẻ say rượu"


  jason_locale_events.200.d:0 "Im lặng. Giữ lấy danh dự của ngươi, [drunk_knight.GetFirstNameNoTooltip]."
  jason_locale_events.200.d.tt:1 "Không nên chọn lời nói ngu muội trong cơn say thay vì lời thề trung thành đã tuyên."

