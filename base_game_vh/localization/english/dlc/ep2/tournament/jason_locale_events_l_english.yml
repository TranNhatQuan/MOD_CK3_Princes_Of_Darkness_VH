# TOURNAMENT GROUNDS

  jason_locale_events.0220.t:0 "Nơi Nuôi Dưỡng Chiến Thắng"
  jason_locale_events.0220.desc:0 "Các $knight_culture_player_plural_no_tooltip_lowercase$ của ta tập hợp cho buổi huấn luyện trong ngày, tùy tùng mang theo đầy đủ trang bị. [senior_knight.GetTitledFirstName] và ta đứng trước toàn đội.\n\n\"$knight_culture_player_plural_no_tooltip$! Điều gì các ngươi chưa biết, hãy khiêm nhường mà học hỏi,\" [senior_knight.GetFirstNameNoTooltip] thúc giục. \"Chúng ta cùng đại diện cho [ROOT.Char.GetTitleAsNameNoTooltip]! Hãy cùng nhau chuẩn bị cho vinh quang sắp tới.\"\n\n[senior_knight.GetSheHe|U] quay sang ta, đôi [senior_knight.Custom('EyeEyes')] ánh lên.\n\n\"Hãy ra lệnh cho chúng Ta.\""

  jason_locale_events.0220.a:0 "Quan sát đối thủ: học lấy điểm yếu của họ."
  jason_locale_events.0220.a.tt:0 "Những $knight_culture_player_plural_no_tooltip_lowercase$ này có mặt để chiến thắng các cuộc thi. Không gì khác quan trọng."

  jason_locale_events.0220.b:0 "Kỹ năng ư? Hừ! Chúng ta đến đây để được chú ý."


  jason_locale_events.0220.c:0 "Lên ngựa — rút kiếm!"
  jason_locale_events.0220.c.tt:0 "Chúng ta sẽ Ta luyện sức mạnh và phản xạ, cả trên lưng ngựa lẫn dưới đất"

  jason_locale_events.0220.d:0 "$knight_culture_player_plural_no_tooltip$! Chứng tỏ sự sắc bén, cả về mắt lẫn trí."
  jason_locale_events.0220.d.tt:0 "Rèn luyện trí tuệ cũng đáng giá như đổ mồ hôi suốt ngày"

  jason_locale_events.0220.e:0 "Đánh bại tất cả bọn họ, [senior_knight.GetFirstNameNoTooltip]. #EMP Ngay bây giờ.#!"
  jason_locale_events.0220.e.tt:0 "Cho mọi người có thứ để trố mắt nhìn! #EMP Tự vệ đi!#!"

