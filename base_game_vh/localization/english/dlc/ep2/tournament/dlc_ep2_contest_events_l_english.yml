l_english:
 ##### CONTEST #####

 ### SHARED
  contest_events_opening_prize_desc:1 ""Dành cho người chiến thắng: [newly_created_artifact.GetType|l] này, do ân huệ của chủ nhà hào phóng của chúng ta: [host.GetTitledFirstName]!""
  contest_events_marriage_prize_desc:1 ""Dành cho người chiến thắng, bàn tay hôn phối của [marriage_prize.GetTitledFirstName], theo sắc lệnh của chủ nhà hào phóng của chúng ta: [host.GetName]!""
  contest_events_opening_intent_contestant:0 "[intent_scope.GetName] cũng đang tham gia cuộc thi."
  contest_events_opening_intent_contestant_team:0 "Ta ghi nhận rằng [intent_scope.GetName] đã được xếp vào đội của ta..."
  contest_events_opening_intent_contestant_opposing:0 "Ta ghi nhận rằng [intent_scope.GetName] đã được xếp vào đội đối địch..."
  contest_events_opening_intent_spectator:1 "\n\n[intent_scope.GetName] không tham gia cuộc thi."
  contest_events_opening_intent_contestant_horse_race:0 "[intent_scope.GetName] cũng đã cho [intent_scope.GetHerHis] [intent_scope.Custom('ContestHorseRaceGender')] của mình, #EMP [intent_scope.Custom('GetContestHorseRaceName')]#!, tham gia."
  contest_events_closing_win_winner:0 "\n\nTa đã chứng minh giá trị của mình không còn nghi ngờ gì nữa!"
  contest_events_closing_win_contestant:0 "\n\nTa phải cố gắng hơn nữa nếu muốn giành chiến thắng trong giải đấu này!"
  tournament_events_murder_sabotage_contest_tt:0 "Sẽ dễ dàng hơn để \"vô tình\" giết chết [murder_target.GetFirstName] trong cuộc thi sắp tới"
  contest_events_closing_marriage_valid_host_only:1 "\n\nTrong một bước ngoặt kỳ lạ của vận mệnh, cùng với tài năng không thể phủ nhận, ta là [marriage_prize.Custom('GetBrideGroom')] khả dĩ duy nhất..."
  contest_events_closing_marriage_valid:1 "Việc ta có giữ lời hứa hay không là tùy thuộc vào ta..."
  contest_events_closing_marriage_wedding_host:0 "\n\n""Following [host.GetHerHis] own ruling, [host.GetTitledFirstNameNoTooltip] has married [host.GetHerHis] [host.Custom2('RelationToMeShort', marriage_prize)], [marriage_prize.GetFirstNamePossessive], as the victor!"
  contest_events_closing_marriage_wedding:0 "\n\n""Đúng như đã hứa, [host.GetTitledFirstNameNoTooltip] đã ban hôn lễ, trao bàn tay của [host.GetHerHis] [host.Custom2('RelationToMeShort', marriage_prize)], [marriage_prize.GetFirstNamePossessive], cho [contest_winner.GetFirstNameNoTooltip]!""
  contest_events_closing_marriage_betrothal_host:0 "\n\n""Following [host.GetHerHis] own ruling, [host.GetTitledFirstNameNoTooltip] has betrothed [host.GetHerHis] [host.Custom2('RelationToMeShort', marriage_prize)], [marriage_prize.GetFirstName], as the victor!"
  contest_events_closing_marriage_betrothal:1 "\n\n""Đúng như đã hứa, [host.GetTitledFirstNameNoTooltip] đã đề nghị hôn ước, trao [host.GetHerHis] [host.Custom2('RelationToMe', marriage_prize)], [marriage_prize.GetFirstNamePossessive], cho [contest_winner.GetFirstNameNoTooltip]!""
  contest_events_closing_marriage_reneged_winner:1 "\n\n"[host.GetTitledFirstNameNoTooltip] has outrageously refused to honor [host.GetHerHis] promised prize of [host.GetHerHis] [host.Custom2('RelationToMe', marriage_prize)], [marriage_prize.GetFirstNamePossessive], hand it marriage! This can only be seen as an insult to the victors!"
  contest_events_closing_marriage_invalid_slots:0 "$contest_events_closing_marriage_invalid$ Suy cho cùng, một [contest_winner.GetWomanMan] cũng chỉ cần đến từng ấy Ngài đời mà thôi."
  contest_events_closing_marriage_invalid_family:0 "$contest_events_closing_marriage_invalid$ Một [marriage_prize.GetWomanMan] không thể kết hôn với [marriage_prize.GetHerHis] [marriage_prize.Custom2('RelationToMeShort', contest_winner)]."
  contest_events_closing_marriage_invalid:1 "\n\nDường như số phận đã an bài rằng phần thưởng đã hứa — bàn tay của [host.GetTitledFirstNamePossessive] [host.Custom2('RelationToMeShort', marriage_prize)], [marriage_prize.GetFirstNamePossessive], trong hôn nhân — sẽ không thể trở thành hiện thực."
  contest_events_closing_marriage_host_refused:0 "\n\nChỉ có [host.GetTitledFirstName] [host.GetHerselfHimself] là người cầu hôn hợp lệ, và [host.GetSheHe] đã quyết định không kết hôn với [host.GetHerHis] [host.Custom2('RelationToMeShort', marriage_prize)]"

  contest_events_closing_marriage_host:0 "Trong một bước ngoặt kỳ lạ của vận mệnh, cùng với tài năng không thể phủ nhận, ta nhận ra mình nằm trong số những người chiến thắng hợp lệ..."
  contest_events_closing_marriage_three:0 "[bachelor_1.GetFullName], [bachelor_2.GetFullName], và [bachelor_3.GetFullName] đều háo hức thành hôn, và mỗi người đều là kẻ chiến thắng theo cách riêng của mình."
  contest_events_closing_marriage_two:0 "[bachelor_1.GetFullName] và [bachelor_2.GetFullName] đều là những lựa chọn khả dĩ, mỗi người đều là kẻ chiến thắng theo cách riêng."
  contest_events_closing_marriage_one:0 "Có vẻ như [bachelor_1.GetFullName] là người cầu hôn khả dĩ duy nhất."
  contest_events_closing_marriage_none:0 "Tuy nhiên, không một người chiến thắng nào đủ điều kiện làm người cầu hôn..."

  every_tournament_attendee_tt:0 "Tất cả những người tham dự giải đấu"
 ### RACE ###
 # START
  contest_events.0500.t:1 "[activity.GetCurrentPhase.GetPhase.GetName]: Cuộc Thi Bắt Đầu"
  contest_events.0500.horse_race:1 "Những chiến mã ưu tú nhất tại [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], khoác lên mình màu sắc của các chủ nhân, được dắt vòng quanh [activity.Custom('ContestHorseRaceTrack')] khi sứ giả tuyên bố khai cuộc. Các kỵ sĩ tụ tập chờ đợi, kẻ thì vươn vai khởi động, kẻ thì dò xét lẫn nhau.\n\n"
  contest_events.0500.contestant_horse:0 "Chiến mã nhanh nhất của ta, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, đã không thoát khỏi ánh mắt của các nhà lai giống và con bạc.\n\n"
  contest_events.0500.closing:0 "Không gì sánh bằng một cuộc đua kịch tính."
  mysterious_stranger_horse_race:0 "Có vẻ như [mysterious_stranger.GetFullNamePossessive] [mysterious_stranger.Custom('ContestHorseRaceGender')], #EMP [mysterious_stranger.Custom('GetContestHorseRaceName')]#!, đã thu hút sự chú ý của nhiều người với tư cách một đối thủ bất ngờ.\n\n"
  contest_events.0500.a.contestant:0 "Đây sẽ là một cuộc đua đáng gờm."
  contest_events.0500.a:0 "Thật là một cảnh tượng."
  contest_events.0500.b:0 "Ta cần đặt một kèo cược..."
  contest_events.0500.c:0 "Chiến mã của ta #EMP chắc chắn#! sẽ tham gia!"
  contest_events.0500.d:0 "[rival_contestant.GetTitledFirstNamePossessiveNoTooltip] sẽ #EMP không#! được xuất trận."
  contest_events.0500.e:0 "Hẳn phải có cách để đưa ngựa của ta vào cuộc đua này..."
  contest_events_place_wager_tt:2 "Đặt cược [gold_i|E][gold|E] cho người chiến thắng của [activity.GetCurrentPhase.GetPhase.GetName] [contest|E]"
 # END
  contest_events.0505.t:2 "Người Chiến Thắng Cuộc Thi"
  contest_events.0505.t.horse_race:1 "$tournament_phase_horse_race$: $contest_events.0505.t$"
  contest_events.0505.horse_race:1 "Chiến mã của [contest_winner.GetShortUINamePossessiveNoFormat|U], #EMP [contest_winner.Custom('GetContestHorseRaceName')|U]#!, cán đích trong tiếng reo hò vang dội, theo sát phía sau là [second_place.GetShortUINamePossessiveNoFormat] với #EMP [second_place.Custom('GetContestHorseRaceName')|U]#! và [third_place.GetShortUINamePossessiveNoFormat] với #EMP [third_place.Custom('GetContestHorseRaceName')|U]#!!\n\n"
  contest_events.0505.first_horse:1 "Phải rồi #EMP [ROOT.Char.Custom('GetContestHorseRaceName')|U]#!! Ngươi thật tuyệt vời, [ROOT.Char.Custom('ContestHorseRaceGender')] xinh đẹp!"
  contest_events.0505.first_maydan:0 "Phải rồi, #EMP Sabiq#!! Ngươi thật tuyệt vời, [ROOT.Char.Custom('ContestHorseRaceGender')]!"
  contest_events.0505.second_horse:0 "Chỉ thiếu chút nữa thôi, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!..."
  contest_events.0505.second_maydan:0 "Chỉ thiếu chút nữa thôi, #EMP Mutabarriz#!, chỉ thiếu chút nữa..."
  contest_events.0505.third_horse:0 "Hạng ba... cũng tốt lắm rồi, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, vị trí tệ nhất trong những vị trí tốt nhất..."
  contest_events.0505.third_maydan:0 "#EMP Mujalli#!... tin ta đi, ta vẫn có thể vui hơn nữa..."
  contest_events.0505.contestant_horse:1 "#EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! thậm chí còn không lọt top. Lần sau ta sẽ phải chuẩn bị kỹ hơn!"
  contest_events.0505.spectator:0 "Một màn tranh tài nghẹt thở!"
  contest_events.0505.a.winner:0 "Ta, [ROOT.Char.GetTitleAsNameNoTooltip] của các ngươi, đã chiến thắng!"
  contest_events.0505.a.marriage:0 "Ta nghĩ phần thưởng này cũng ổn."
  contest_events.0505.a:0 "Làm tốt lắm, [contest_winner.GetTitledFirstNameNoTooltip]."
  contest_events.0505.b:0 "[ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip], ta đã chiến thắng vì ngươi!"
  contest_events.0505.c.winner:0 "Có vẻ như chúng ta sẽ thành hôn, [marriage_prize.GetFirstNameNoTooltip]."
  contest_events.0505.c:0 "Làm tốt lắm, bàn tay của [marriage_prize.GetTitledFirstNamePossessiveNoTooltip] là của ngươi."
  contest_events.0505.d.winner:0 "Ta thắng rồi! Ta #EMP thực sự#! đã thắng!"
  contest_events.0505.d.second:0 "Chỉ thiếu chút nữa thôi..."
  contest_events.0505.d.loser:0 "Lần sau sẽ khác..."
  contest_events.0505.d:0 "Vận may hẳn đang mỉm cười với [contest_winner.GetHerHim]."

  contest_events.0510.t:0 "$tournament_contest_header$ Vòng Cuối"
  contest_events.0510.desc:0 "Những chiến mã tiếp tục dồn dập lao quanh đường đua, các kỵ sĩ giật cương thúc ngựa nhanh hơn nữa. Đã có không ít biến cố trong cuộc đua này, khi ta nhớ lại lúc"
  contest_events.0510.flavor_1:0 "kỵ sĩ của ta ngã khỏi yên, rồi gượng dậy và trèo lên lại.\n\n"
  contest_events.0510.flavor_2:0 "ta đã hò reo cổ vũ kỵ sĩ của mình một cách cuồng nhiệt.\n\n"
  contest_events.0510.flavor_3:0 "hai kỵ sĩ cùng chiến mã của họ va chạm vào nhau.\n\n"
  contest_events.0510.flavor_4:0 "đám đông suýt nữa thì bùng nổ bạo loạn.\n\n"
  contest_events.0510.flavor_5:0 "kỵ sĩ của ta lách vào phía trong đường đua, giành lợi thế to lớn.\n\n"
  contest_events.0510.flavor_6:0 "một vụ va chạm liên hoàn khiến ba kỵ sĩ bị loại trong chớp mắt.\n\n"
  contest_events.0510.flavor_7:0 "chiến mã của ta bị ngựa của đối thủ húc trúng.\n\n"
  contest_events.0510.flavor_8:0 "toàn bộ khán giả bị mê hoặc bởi một kỵ sĩ xinh đẹp.\n\n"
  contest_events.0510.flavor_9:0 "một thường dân trần truồng lao thẳng vào đường đua.\n\n"
  contest_events.0510.flavor_fallback:0 "Chỉ còn đúng một vòng nữa! Ta nghiêng người qua lan can khán đài, hét lớn với kỵ sĩ của mình khi đoàn ngựa lao qua."
  contest_events.0510.a:0 ""Thưởng thêm nếu ngươi thắng!""
  contest_events.0510.b:0 ""Đánh hắn đi! Vào mặt!""
  contest_events.0510.c:0 ""Giật cương của chúng!""
  contest_events.0510.d:0 ""Tiến lên! #EMP Nhanh hơn!#!""

  contest_events.0530.t:0 "$tournament_contest_header$ Ngựa Gặp Đúng Đường"
  contest_events.0530.pivotal_success:0 "Mưu kế của kỵ sĩ ta đã thành công! Chiến mã của ta vọt lên khi vào khúc cua cuối cùng để lao vào đoạn nước rút. Chỉ còn vài khoảnh khắc nữa thôi...\n\n"
  contest_events.0530.pivotal_neutral:0 "Khó mà nói liệu lời khuyên của ta có tạo ra khác biệt gì không, khi toàn bộ đoàn ngựa cùng ôm cua cuối để lao vào đoạn nước rút trong một khối chặt chẽ.\n\n"
  contest_events.0530.pivotal_failure:0 "Bị mất thăng bằng và bất ngờ trước tiếng gọi của ta, kỵ sĩ của ta chao đảo suýt ngã. Chiến mã của ta mất đi chút khoảng cách khi vào khúc cua cuối. Trận này sẽ rất sát nút...\n\n"
  contest_events.0530.ptv_close:0 "Gần như không thể phân biệt ai sẽ giành chiến thắng. Chúng đang song hành ngang ngửa!"
  contest_events.0530.ptv_top:0 "Chiến mã của ta đang bứt khỏi nhóm bám đuổi! Nếu giữ vững được thế này, chúng ta sẽ thắng!"
  contest_events.0530.ptv_top_spectator:0 "Chiến mã của [pivotal_contestant.GetFirstNamePossessive] đã bứt lên! Giờ chỉ cần đưa nó về đích!"
  contest_events.0530.ptv_bottom:0 "Chiến mã của ta đang đội sổ, và ta cảm nhận chiến thắng đang tuột khỏi tay. Chúng ta cần một điều gì đó, #EMP bất cứ điều gì#!..."
  contest_events.0530.ptv_bottom_spectator:0 "Chiến mã của [pivotal_contestant.GetFirstNamePossessive] gần như đã bị đánh bại. [pivotal_contestant.GetSheHe|U] cần một điều gì đó, #EMP bất cứ điều gì#!..."
  contest_events.0530.ptv_top_half:0 "Chiến mã của ta đang ở nhóm dẫn đầu, nhưng cuộc đua cực kỳ sát sao. Chỉ cần thêm một cú thúc nữa là đủ để chiến thắng!"
  contest_events.0530.ptv_top_half_spectator:0 "Chiến mã của [pivotal_contestant.GetFirstNamePossessive] đang ở nửa trên đoàn đua, nhưng cuộc cạnh tranh vẫn rất khốc liệt. Vinh quang vẫn chưa ngã ngũ."
  contest_events.0530.ptv_bottom_half:0 "Chiến mã của ta bị kẹt trong nhóm sau, nhưng chiến thắng vẫn chưa quá xa vời. Nếu kỵ sĩ tìm được khoảng trống, chúng ta vẫn có thể bứt phá..."
  contest_events.0530.ptv_bottom_half_spectator:0 "Chiến mã của [pivotal_contestant.GetFirstNamePossessive] bị kẹt gần cuối, nhưng mọi chuyện vẫn chưa kết thúc. Chỉ một hành động nữa thôi cũng có thể xoay chuyển cục diện..."
  contest_events.0530.ptv_fallback:1 "Cuộc đua lao nhanh về hồi kết, những chiến mã gần như vươn cổ hết mức để chạm tới vạch đích."
  contest_events.0530.spectator:0 "\n\nMồ hôi tung tóe khỏi những thân ngựa đang phi nước đại khi chúng ôm cua cuối cùng, các kỵ sĩ khản giọng thúc giục, trong khi đám đông gào thét cuồng nhiệt."
  contest_events.0530.final:0 "\n\nĐám đông đạt tới cao trào. Các kỵ sĩ đồng loạt thúc ngựa. Vạch đích đã hiện ra trước mắt."
  contest_events.0530.a:0 "Thêm một cú thúc nữa!"
  contest_events.0530.b:0 "Không còn xa nữa!"

  contest_events.0520.t:0 "Chiến Mã"
  contest_events.0520.desc:0 "Cuộc đua ngựa đang đến gần, và ý nghĩ cho chiến mã của ta, #EMP [ROOT.Char.Custom('WarhorseStoryName')]#!, tham gia thay vì ngựa đua của ta, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, đã luẩn quẩn trong đầu ta suốt nhiều ngày.\n\nTa sẽ không tự mình cưỡi [ROOT.Char.Custom('HorseStoryHerHim')], nhưng [ROOT.Char.Custom('HorseStorySheHe')] vẫn tràn đầy khí thế..."
  contest_events.0520.a:0 "#EMP [ROOT.Char.Custom('WarhorseStoryName')]#! sẽ không làm ta thất vọng."
  contest_events.0520.b:0 "Không, vị trí của [ROOT.Char.Custom('HorseStoryHerHis')] là trên chiến trường."
  contest_horse_race_enter_war_horse_tt:0 "Cho chiến mã của Ngài tham gia cuộc đua ngựa"
 ### TEAM ###
 # START
  contest_events.0600.t:1 "[activity.GetCurrentPhase.GetPhase.GetName]: Cuộc Thi Bắt Đầu"
  contest_events.0600.melee:1 "Ranh giới rõ ràng đã được vạch ra giữa hai đội, khi họ đứng đối diện nhau, chế giễu trong lúc chuẩn bị trang bị và thì thầm kế hoạch. Những con ngựa được chuẩn bị phía sau, các chiến mã hí vang và phì mũi. Đây sẽ là một ngày đẫm máu.\n\n"
  contest_events.0600.contestant:1 "Đội của ta chắc chắn sẽ đánh bại bọn khoác lác của [other_team_captain.GetTitledFirstNamePossessive]!\n\n"
  contest_events.0600.champion_self:1 "Quán quân của ta, [contest_champion.GetFirstName], và ta sẽ cho [other_team_captain.GetTitledFirstName] thấy thế nào là thực lực!\n\n"
  contest_events.0600.champion:1 "Quán quân của ta, [contest_champion.GetFirstName], sẽ cho [other_team_captain.GetTitledFirstName] thấy thế nào là thực lực!\n\n"
  contest_events.0600.neither_qualify:1 "Cả ta lẫn quán quân của ta, [contest_champion.GetFirstName], đều không đủ điều kiện."
  contest_events.0600.champion_qualify:0 "Quán quân của ta, [contest_champion.GetFirstName], lần này không đủ điều kiện."
  contest_events.0600.self_qualify:0 "Khi ta tiến đến trước ban giám định để xác nhận tư cách, ta bị từ chối: lần này ta không đủ điều kiện."
  contest_events.0600.closing:0 "Trận này hứa hẹn sẽ rất hay."
  contest_events.0600.a:0 "Ra chiến trường!"
  contest_events.0600.a.contestant:0 "Vinh quang sẽ thuộc về chúng ta!"
  contest_events.0600.captains_tt:0 "[my_team_captain.GetShortUIName|U] và [other_team_captain.GetShortUIName] là đội trưởng nhờ [rank|E] và kinh nghiệm"
  contest_events.0600.team_tt:0 "Ngài thuộc đội của [my_team_captain.GetShortUINamePossessive]"
 # END
  contest_events.0605.t.melee:0 "$tournament_phase_melee$: $contest_events.0605.t$"
  contest_events.0605.t:2 "Những Người Chiến Thắng"
  contest_events.0605.desc:3 "Kèn trumpet vang lên, đám đông gào thét, các đấu thủ bắt đầu tập hợp. Cuộc thi đã kết thúc, và khoảnh khắc vinh quang của một đội đang được chuẩn bị. Một sứ giả bước lên, giọng vang dội khắp nơi.\n\n\"Sau vô vàn thử thách, không ít gian truân, và trên hết là tinh thần tranh tài mãnh liệt, chúng ta đã tìm ra những người chiến thắng: đội của [contest_winner.GetTitledFirstNamePossessive] đã đánh bại đội của [second_place.GetTitledFirstNamePossessive]!\"\n\n"
  contest_events.0605.desc.winner:0 "Tất cả đều đã chơi rất hay! Đến lúc ăn mừng rồi!"
  contest_events.0605.desc.loser:0 "Lần này ta đã không thể dẫn dắt đội của mình đến chiến thắng..."
  contest_events.0605.desc.team_winner:0 "Trận đấu hay lắm! Không gì sánh bằng cảm giác chiến thắng!"
  contest_events.0605.desc.team_loser:0 "Thôi thì... lần sau chúng ta sẽ phải luyện tập chăm chỉ hơn..."
  contest_events.0605.desc.spectator:0 "Một môn thể thao gay cấn, kể cả khi chỉ đứng xem!"
  contest_events.0605.a.host_winner:0 "[ROOT.Char.GetTitleAsNameNoTooltip] là bất khả chiến bại!"
  contest_events.0605.a.host_loser:0 "Ngay cả [ROOT.Char.GetTitleAsNameNoTooltip] cũng không thể thắng mọi trận..."
  contest_events.0605.a.winner:0 "Chúng ta đã làm được. Chúng ta thắng rồi!"
  contest_events.0605.a.loser:0 "Lần sau bọn ta sẽ trả đũa!"
  contest_events.0605.a:0 "Thật là một môn thể thao hỗn loạn."

  contest_events.0610.t:0 "$tournament_contest_header$ Lao Vào Giao Tranh"
  contest_events.0610.desc:0 "Những cái bóng kéo dài khi trận chiến tiếp diễn, vòng giao tranh dần thu hẹp khi các đấu thủ tập tễnh rút lui. Xoay ngựa của mình, ta nhớ lại những gì đã xảy ra cho đến lúc này, chẳng hạn như khi"
  contest_events.0610.flavor_1:0 "ta mất kiểm soát cơn giận và đánh một đối thủ đến bê bết máu.\n\n"
  contest_events.0610.flavor_2:0 "vị trưởng trấn địa phương nổi giận khi một cuộc ẩu đả lan ra đường phố.\n\n"
  contest_events.0610.flavor_3:0 "vũ khí của ta bị đánh rơi khỏi tay, khiến ta phải vội vàng lao theo nhặt lại.\n\n"
  contest_events.0610.flavor_4:0 "một kẻ lạc lối đầy mê hoặc lang thang vào vòng hỗn chiến.\n\n"
  contest_events.0610.flavor_5:0 "ta giành được quyền đòi một khoản tiền chuộc lớn!\n\n"
  contest_events.0610.flavor_6:0 "tìm chỗ nghỉ ngơi, ta tạm thời ẩn náu trong một nơi trú ẩn.\n\n"
  contest_events.0610.flavor_7:0 "ta đối mặt với một chiến binh lừng danh và vẫn sống sót để kể lại.\n\n"
  contest_events.0610.flavor_8:0 "ta ẩn mình trong lùm cây, giăng bẫy những kẻ qua đường không đề phòng.\n\n"
  contest_events.0610.flavor_9:0 "ta thong dong cưỡi ngựa xuyên qua vòng giao tranh, chứng kiến kẻ khác ngã khỏi yên.\n\n"
  contest_events.0610.flavor_10:0 "ta phát hiện một hiệp sĩ bí ẩn với kỹ năng phi thường đang chiến đấu giữa trận địa.\n\n"
  contest_events.0610.flavor_11:0 "ta bị ba hiệp sĩ đối phương dồn vào thế bí.\n\n"
  contest_events.0610.flavor_12:0 "ta cứu một thành viên của Gia tộc khỏi tình thế nguy hiểm.\n\n"
  contest_events.0610.flavor_fallback:0 "Rõ ràng mọi thứ đang đi đến cao trào, khi những tuyến chiến đấu mệt mỏi được tái lập. Đây chính là cơ hội để ta ghi dấu ấn trong cuộc thi này."
  contest_events.0610.a:0 "Ta sẽ giành chiến thắng của một chiến binh!"
  contest_events.0610.b:0 "\"Theo ta! Đến chiến thắng!\""
  contest_events.0610.c:0 "Có lẽ, nếu ta dụ chúng vào đây..."
  contest_events.0610.d:0 "Hay là cứ cầm cự đến cùng?"
  contest_events.0610.d.tt:0 "Xúc xắc đã được gieo; ta không nên can thiệp."

  contest_events.0620.t:0 "$tournament_contest_header$ Những Đòn Quyết Định"
  contest_events.0620.pivotal_success:0 "Mưu kế đã giáng một đòn chí mạng! Thế trận nghiêng về phía đội ta, nhiều kỵ sĩ bứt phá khi chúng ta áp đảo sườn đối phương, lao thẳng về doanh trại của họ. Chỉ còn hy vọng họ đến đó trước khi điều tương tự xảy ra với chúng ta.\n\n"
  contest_events.0620.pivotal_neutral:0 "Khó mà nói nước đi cuối cùng của ta tạo ra khác biệt lớn đến đâu. Nó không khiến chúng ta mất thế, nhưng trận chiến dữ dội vẫn giằng co như cũ.\n\n"
  contest_events.0620.pivotal_failure:0 "Xét về chiến thuật, đó khó có thể gọi là đòn hay nhất của ta. Dù chưa đến mức thảm họa, việc đội địch xuyên thủng trung tâm của chúng ta và bắt đầu lao về doanh trại không phòng bị vẫn có thể là hồi chuông cáo chung cho hy vọng chiến thắng.\n\n"
  contest_events.0620.ptv_close:0 "Gần như không thể đoán bên nào đang gần chiến thắng hơn. Mọi thứ vẫn còn bỏ ngỏ."
  contest_events.0620.ptv_close_spectator:0 "Hai đội gần như ngang sức ngang tài! Thắng bại sẽ chỉ cách nhau trong gang tấc."
  contest_events.0620.ptv_top:0 "Đội của ta rõ ràng đang chiếm ưu thế! Chiến thắng gần đến mức ta có thể nếm được!"
  contest_events.0620.ptv_top_spectator:0 "Đội của [pivotal_contestant.GetFirstNamePossessive] đang hoàn toàn áp đảo! Giờ chỉ cần kết thúc cho trọn vẹn!"
  contest_events.0620.ptv_bottom:0 "Đội của ta đang thua, và là thua rõ rệt. Ta cảm nhận chiến thắng đang dần tuột khỏi tay. Cần một nỗ lực phi thường mới có thể lật ngược thế cờ..."
  contest_events.0620.ptv_bottom_spectator:0 "Đội của [pivotal_contestant.GetFirstNamePossessive] trông tả tơi và gần như bị đánh bại. Cần một nỗ lực khổng lồ mới có thể thắng từ đây..."
  contest_events.0620.ptv_top_half:0 "Đội của ta đang dẫn trước, nhưng trận đấu cực kỳ sít sao. Chỉ cần giữ vững là đủ!"
  contest_events.0620.ptv_top_half_spectator:0 "Đội của [pivotal_contestant.GetFirstNamePossessive] đang nhỉnh hơn, nhưng cuộc đấu rất cân não. Vinh quang vẫn chưa thuộc về ai."
  contest_events.0620.ptv_bottom_half:0 "Chúng ta đang thua, nhưng chiến thắng vẫn chưa ngoài tầm với. Chỉ cần một nỗ lực cuối cùng nữa thôi...!"
  contest_events.0620.ptv_bottom_half_spectator:0 "Đội của [pivotal_contestant.GetFirstNamePossessive] đang thua, nhưng mọi chuyện vẫn chưa kết thúc. Chỉ một hành động nữa cũng có thể xoay chuyển cục diện..."
  contest_events.0620.ptv_fallback:0 "Trận chiến tiếp tục cuộn xoáy, ngày càng tiến gần đến hồi kết."
  contest_events.0620.spectator:0 "\n\nTiếng kim loại va chạm vang lên nhịp nhàng xé toạc không khí. Khán giả, tụ tập rải rác quanh rìa trận địa, hò reo cổ vũ cho phe mình yêu thích, ngay cả khi ngày càng nhiều đấu thủ gục ngã vì tiền chuộc và diệt vong."
  contest_events.0620.final:0 "\n\nTa thấy các sứ giả bắt đầu tiến vào chiến trường để báo hiệu kết thúc sự kiện. Hồi kết đã cận kề."
  contest_events.0620.a:0 "Thêm một cú thúc nữa!"
  contest_events.0620.b:0 "Sắp xong rồi!"
 ### TURN ###
 # START
  contest_events.0700.t:1 "[activity.GetCurrentPhase.GetPhase.GetName]: Cuộc Thi Bắt Đầu"
  contest_events.0700.archery:1 "Đám đông đấu thủ đủ mọi tầng lớp tụ tập quanh bia bắn, so sánh cung tên và kể cho nhau nghe những phát bắn xuất sắc nhất. Tiếng cung kẽo kẹt và dây bật vang xa, điểm xuyết cho sự ồn ào, trong khi mùi nhựa thông phảng phất trong không khí tĩnh lặng.\n\n"
  contest_events.0700.recital:0 "Những người dự thi tụ tập quanh lều chính, khởi động giọng và ghi nhớ các khổ thơ khi đám đông lấp kín khán đài.\n\n"
  contest_events.0700.contestant:2 "Tai ta dựng lên khi nghe tên mình được nhắc tới, trôi theo làn gió nhẹ. Đó có thể là dấu hiệu tốt — hoặc xấu..."
  contest_events.0700.champion:1 "Có lẽ quán quân của ta, [contest_champion.GetName], sẽ khiến ta tự hào.\n\n"
  contest_events.0700.closing:0 "Cầu mong kẻ xứng đáng nhất chiến thắng!"
  contest_events.0700.a:0 "Không biết ai sẽ thắng đây!"
  contest_events.0700.a.contestant:0 "Đã đến lúc cho cả thiên hạ thấy tài nghệ của ta."
  contest_events.0700.b:0 "Ta có một kèo cược cần đặt..."
  contest_events.0700.c:0 "Ta #EMP sẽ#! tự mình tham gia cuộc thi."
  contest_events.0700.d:0 "[rival_contestant.GetTitledFirstNameNoTooltip] không đủ tư cách để tranh tài."
  contest_events.0700.e:0 "Nếu ta tìm được đúng người để nói chuyện..."
  mysterious_stranger_archery:0 "Có vẻ như một thường dân vô danh tên là [mysterious_stranger.GetFirstName] đã trở thành tâm điểm bàn tán tại [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] sau khi luyện tập bắn bia.\n\n"
  mysterious_stranger_recital:0 "Một gương mặt mới mang tên '[mysterious_stranger.GetFirstName], trước nay chưa từng được biết đến trong giới thi sĩ và nghệ nhân của [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], đã thu hút nhiều sự chú ý trong năm nay.\n\n"
 # END
  contest_events.0705.t.recital:0 "$tournament_phase_recital$: $contest_events.0505.t$"
  contest_events.0705.t.archery:0 "$tournament_phase_archery$: $contest_events.0505.t$"
  contest_events.0705.desc:1 "Kèn trumpet vang lên, đám đông hò reo, các đấu thủ bắt đầu tập hợp. Cuộc thi đã kết thúc, và khoảnh khắc vinh quang của ai đó đang được chuẩn bị. Một sứ giả bước lên, giọng vang dội khắp nơi.\n\n\"Sau vô vàn thử thách, không ít gian truân, và trên hết là tinh thần tranh tài mãnh liệt, chúng ta đã có ba người cuối cùng. Hạng ba, đầy quả cảm, là [third_place.GetTitledFirstName]. Về nhì trong gang tấc, [second_place.GetTitledFirstName]! Và dĩ nhiên, người chiến thắng của chúng ta là [contest_winner.GetTitledFirstName]!\"\n\n"
  contest_events.0705.first:0 "Ta biết mình có thể chiến thắng!"
  contest_events.0705.second:0 "Hạng nhì, có lẽ ta cũng không thể phàn nàn."
  contest_events.0705.third:0 "À, ta là kẻ chiến thắng ít vinh quang nhất..."
  contest_events.0705.contestant:0 "Lần sau ta sẽ cho họ thấy."
  contest_events.0705.spectator:0 "Một màn phô diễn kỹ năng vô cùng mãn nhãn!"
  contest_events.0705.first_champion:0 "Không ai có thể đánh bại [contest_champion.GetTitledFirstName]!"
  contest_events.0705.second_champion:0 "[contest_champion.GetTitledFirstName] đã khiến ta tự hào."
  contest_events.0705.third_champion:0 "Không vô địch, nhưng ít nhất [contest_champion.GetTitledFirstName] cũng suýt soát..."
  contest_events.0705.contestant_champion:0 "Quán quân của ta, [contest_champion.GetTitledFirstName], đã không thể lọt vào top ba..."
  contest_events.0705.spectator_champion:0 "Quán quân của ta, [contest_champion.GetTitledFirstName], đã không tham gia."
  contest_events.0705.a.winner:0 "Phải rồi! [ROOT.Char.GetTitleAsNameNoTooltip] của các ngươi đã chiến thắng!"
  contest_events.0705.a.marriage:0 "Ta đã đổi ý, phần thưởng là dành cho ngươi."
  contest_events.0705.a:0 "Làm tốt lắm, [contest_winner.GetTitledFirstNameNoTooltip]."
  contest_events.0705.b:0 "Ta làm tất cả vì [ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip]!"
  contest_events.0705.c.winner:0 "Có vẻ như chúng ta sẽ thành hôn, [marriage_prize.GetFirstNameNoTooltip]."
  contest_events.0705.c:0 "Làm tốt lắm, bàn tay của [marriage_prize.GetTitledFirstNamePossessiveNoTooltip] là của ngươi."
  contest_events.0705.d.winner:0 "Ta thắng rồi! Ta #EMP thực sự#! đã thắng!"
  contest_events.0705.d.second:0 "Chỉ thiếu chút nữa thôi..."
  contest_events.0705.d.loser:0 "Lần sau vậy..."
  contest_events.0705.d:0 "Người [contest_winner.GetWomanMan] xuất sắc nhất đã chiến thắng."

  contest_events.0710.t:0 "$tournament_contest_header$ Bắn Trúng Đích"
  contest_events.0710.desc:0 "Hoàng hôn dần buông xuống một cách chậm rãi nhưng đều đặn khi cuộc thi tiếp diễn, tiếng dây cung bật lên tạo thành một nhịp điệu dồn dập. Ta tựa vào cây cung của mình, suy ngẫm về con đường mà cuộc thi này đã đi qua cho đến lúc này, như khi"
  contest_events.0710.flavor_1:0 "một đối thủ khác đã làm ầm ĩ vì thiếu sự yên tĩnh trong lượt của họ.\n\n"
  contest_events.0710.flavor_2:0 "một người đứng xem không may bị trúng tên.\n\n"
  contest_events.0710.flavor_3:0 "Ta đã bắn một phát trúng ngay chính giữa bia.\n\n"
  contest_events.0710.flavor_4:0 "Ta bắn một mũi tên xoáy lệch, rơi trước khi tới bia.\n\n"
  contest_events.0710.flavor_5:0 "một kẻ lạ mặt bí ẩn xuất hiện tại sự kiện, làm dấy lên vô số lời đồn.\n\n"
  contest_events.0710.flavor_6:0 "gió bắt đầu thổi mạnh, buộc Ta phải ứng biến.\n\n"
  contest_events.0710.flavor_7:0 "Ta chán nản giữa cuộc thi, và dao động với ham muốn gây chút rắc rối.\n\n"
  contest_events.0710.flavor_8:0 "Ta quyết định cuộc thi cần được khuấy động thêm một chút.\n\n"
  contest_events.0710.flavor_9:0 "một mũi tên bị chệch hướng trên đường bay và trúng một đối thủ khác.\n\n"
  contest_events.0710.flavor_fallback:0 "Cuộc thi dần đi đến hồi kết, khi những mũi tên vẫn tiếp tục bay vào — và vượt qua — bia. Nếu Ta muốn tạo ra bất kỳ ảnh hưởng nào từ giờ trở đi, Ta phải hành động ngay."
  contest_events.0710.a:0 "Ta và cây cung là một!"
  contest_events.0710.b:0 "“Kiếm được” một mũi tên tốt hơn sẽ cho ta lợi thế..."
  contest_events.0710.c:0 "Với hướng gió này, quỹ đạo này hẳn sẽ ổn."
  contest_events.0710.d:0 "Phát bắn cuối cùng của ta cứ bình thường thôi, có lẽ vậy."

  contest_events.0711.t:0 "$tournament_contest_header$ Lời Khuyên Cho Người Khôn Ngoan"
  contest_events.0711.desc:0 "Màn đêm dần buông xuống khung cảnh, nhưng những ngọn đuốc thắp sáng cuộc thi khi nó tiếp tục. Ta lẩm bẩm một mình, chuẩn bị lời lẽ cho lượt tiếp theo trong khi hồi tưởng lại những chuyện đã xảy ra trước đó, như khi"
  contest_events.0711.flavor_1:0 "một đối thủ khác có một câu thơ đáng ngờ là rất giống của Ta ngay trước khi Ta bước lên sân khấu.\n\n"
  contest_events.0711.flavor_2:0 "một đối thủ khác đã sao chép được một câu thơ nổi tiếng.\n\n"
  contest_events.0711.flavor_3:0 "Ta phải đối mặt với một cơn sợ sân khấu.\n\n"
  contest_events.0711.flavor_4:0 "bầu trời đổ mưa xối xả, làm ướt sũng cả thí sinh lẫn khán giả.\n\n"
  contest_events.0711.flavor_5:0 "Ta thấy cơ hội để sỉ nhục một đối thủ khác bằng thơ ca.\n\n"
  contest_events.0711.flavor_6:0 "danh dự của Ta bị một đối thủ khác bôi nhọ, và Ta buộc phải đáp trả tương xứng.\n\n"
  contest_events.0711.flavor_7:0 "bài thơ của Ta thành công đến mức Ta buộc phải nối tiếp ngay bằng một bài khác.\n\n"
  contest_events.0711.flavor_8:0 "bài thơ của Ta tệ đến mức Ta buộc phải nhanh chóng xoa dịu nó bằng một bài khác.\n\n"
  contest_events.0711.flavor_fallback:0 "Ta bước lên nhận lượt của mình, leo lên những bậc thềm dẫn đến bục. Đã đến lúc cho câu thơ cuối cùng."
  contest_events.0711.a:0 "Một khúc vè về việc kiếm tiền và sống cuộc đời tốt đẹp."
  contest_events.0711.b:0 "Kể cho đám đông nghe một câu chuyện về chiến tranh và chiến thắng!"
  contest_events.0711.c:0 "Cầu khẩn một đấng quyền năng tối cao."
  contest_events.0711.d:0 "Cứ an toàn và đơn giản là được."

  contest_events.0720.t:0 "$tournament_contest_header$ Dây Cung Căng Thẳng"
  contest_events.0720.pivotal_success:0 "Ta bước lên, đặt tên, ngắm, kéo và buông. Mũi tên rít qua không trung, cắm sâu vào bia. Đám đông vỡ òa. Không thể có tranh cãi nào; đó là một điểm số cực lớn nghiêng về phía Ta!\n\n"
  contest_events.0720.pivotal_neutral:0 "Phát bắn của Ta bay đúng hướng, nhưng đau đớn thay lại không chuẩn xác như Ta mong muốn. Nó cắm vào bia, nhưng chỉ ở rìa. Nó sẽ không gây hại cho Ta, nhưng cũng khó mà mang lại nhiều vinh quang.\n\n"
  contest_events.0720.pivotal_failure:0 "Khi Ta kéo dây cung đến cằm, Ta cảm nhận một rung động rất nhẹ trong cánh tay. Ta hoảng hốt buông tay, nhưng mọi chuyện đã muộn. Mũi tên bay loạn xạ, chao đảo trong không trung, rồi rít qua ngay bên cạnh bia! Đám đông rên rỉ, và Ta ôm đầu bằng hai tay.\n\n"
  contest_events.0720.ptv_close:0 "Gần như không thể phân định ai đang dẫn đầu. Ta chắc chắn là một trong những người dẫn đầu, nhưng tất cả chúng Ta gần như ngang bằng nhau!"
  contest_events.0720.ptv_close_spectator:0 "Cuộc đua ở nhóm đầu quá sít sao. Các ứng viên dẫn đầu đang ngang tài ngang sức!"
  contest_events.0720.ptv_top:0 "Ta đang dẫn đầu! Chiến thắng đã rất gần!"
  contest_events.0720.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] rõ ràng đang dẫn đầu! Chỉ cần [pivotal_contestant.GetHerHis] giữ được sự vững vàng, chiến thắng gần như là chắc chắn!"
  contest_events.0720.ptv_bottom:0 "Ta đang trôi dạt, bỏ xa phía sau nhóm dẫn đầu. Sẽ cần một vận may khổng lồ để chiến thắng từ vị trí này..."
  contest_events.0720.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] trông như đã bị đánh bại. Sẽ cần một vận may khổng lồ để chiến thắng từ vị trí này..."
  contest_events.0720.ptv_top_half:0 "Ta đang ở nửa trên bảng xếp hạng, nhưng chưa dẫn đầu. Với một chút may mắn, điều này vẫn có thể trở thành chiến thắng..."
  contest_events.0720.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] đang dần vượt lên, nhưng [pivotal_contestant.GetSheHe] vẫn chưa dẫn đầu. Vinh quang vẫn còn đang tranh đoạt."
  contest_events.0720.ptv_bottom_half:0 "Ta mắc kẹt ở nửa dưới bảng xếp hạng, nhưng chiến thắng vẫn chưa hoàn toàn ngoài tầm với..."
  contest_events.0720.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] mắc kẹt ở nửa dưới bảng xếp hạng, nhưng chiến thắng vẫn chưa hoàn toàn ngoài tầm với..."
  contest_events.0720.ptv_fallback:0 "Nhiều mũi tên nữa được bắn đi, những thí sinh tuyệt vọng buông tên gần như nhanh nhất có thể."
  contest_events.0720.spectator:0 "\n\nMột tiếng chửi rủa khi dây cung cọ vào cẳng tay. Một tiếng bật mạnh từ dây cung, dù bị đứt hay chỉ đơn giản là quá lớn, vang vọng khắp khu vực. Đám đông đã rơi vào một nhịp điệu: im lặng tuyệt đối khi một thí sinh bước lên, và reo hò náo nhiệt khi mũi tên được bắn ra."
  contest_events.0720.final:0 "Chỉ còn lại vài mũi tên cuối cùng cho mỗi thí sinh. Hồi kết đã cận kề."
  contest_events.0720.a:0 "Thêm một lần đặt tên cuối cùng..."
  contest_events.0720.b:0 "Thêm một lần đặt tên cuối cùng!"

  contest_events.0721.t:0 "$tournament_contest_header$ Thuộc Lòng Thuộc Dạ"
  contest_events.0721.pivotal_success:0 "Ta kết thúc câu thơ cuối cùng, nhưng đám đông thậm chí không chờ đến hồi kết. Tiếng reo hò nhấn chìm lời Ta, hoa rơi quanh sân khấu khi Ta bước xuống.\n\n"
  contest_events.0721.pivotal_neutral:0 "Câu thơ cuối cùng của Ta nhận được tiếng reo hò và vỗ tay, nhưng khi rời khỏi bục, Ta không thể xua đi cảm giác dai dẳng rằng mình chưa thể hiện được hết khả năng.\n\n"
  contest_events.0721.pivotal_failure:0 "Ta kết thúc bài thơ với nắm tay giơ cao và giọng điệu hùng hồn. Tuy nhiên, đám đông chỉ đáp lại bằng những tràng vỗ tay lịch sự, xen lẫn vài tiếng ho khẽ. Vai Ta trĩu xuống khi rời bục. Hy vọng của Ta đang phai dần...\n\n"
  contest_events.0721.ptv_fallback:0 "Ngày càng nhiều thí sinh xếp hàng chờ lên bục, lo lắng dịch chuyển từ chân này sang chân kia."
  contest_events.0721.spectator:0 "\n\nChỉ cần một từ dùng sai chỗ cũng đủ khiến đám đông rên rỉ thất vọng vào lúc này, trong khi những màn trình diễn sắc sảo lại tạo ra những tràng pháo tay vang dội. Khán giả giậm chân và reo hò khi các thí sinh tiến lên sân khấu, bầu không khí sôi sục đang lan rộng."
  contest_events.0721.final:0 "Chỉ còn lại rất ít thí sinh, và thời gian còn lại thậm chí còn ít hơn. Tất cả sẽ được quyết định ngay lúc này."
  contest_events.0721.a:0 "Một câu thơ cuối cùng..."
  contest_events.0721.b:0 "Một câu thơ cuối cùng!"

 ### VERSUS ###
 # START
  contest_events.0800.t:1 "[activity.GetCurrentPhase.GetPhase.GetName]: Cuộc Thi Bắt Đầu"
  contest_events.0800.joust:1 "Các thí sinh cưỡi ngựa vòng quanh trường đấu, gia nhân giơ cao vũ khí của họ, trong khi người xướng ngôn tuyên bố cuộc thi chính thức bắt đầu. Các tiểu đồng tất bật qua lại, khoác màu sắc của chúa tể mình, mang theo trang bị và vật dụng cho những lượt đấu sắp tới.\n\n"
  contest_events.0800.wrestling:1 "Xếp hàng quanh bãi cát, các thí sinh cởi trần khởi động cho lượt đấu của mình khi người xướng ngôn tuyên bố cuộc thi bắt đầu. Một số người xoa đất cát lên người, kẻ khác chọn dầu, tất cả đều tìm kiếm một lợi thế nhỏ nhoi cho những lượt đấu sắp tới.\n\n"
  contest_events.0800.duel:1 "Các thí sinh tiến ra sân đấu, vào vị trí quanh khu giao đấu, khi người xướng ngôn tuyên bố cuộc thi bắt đầu. Võ đài hình vuông đang được kiểm tra phía sau, rung lắc và lay động để đảm bảo không có độ đàn hồi nếu một thí sinh bị hất văng vào đó.\n\n"
  contest_events.0800.board_game:1 "Các thí sinh vào chỗ tại những bàn trò chơi, chỉnh lại đệm ngồi và gọi đồ giải khát, khi người xướng ngôn tuyên bố cuộc thi bắt đầu. Bản thân các trò chơi được bày ra trên những bàn gỗ dài, các quân cờ được đánh bóng sáng như gương.\n\n"
  contest_events.0800.desc:0 "Âm điệu và âm lượng đa dạng trong tiếng reo hò của đám đông cho thấy rõ đâu là những ứng viên được yêu thích."
  contest_events.0800.vs:2 "\n\nTrong lượt đấu đầu tiên, Ta được ghép cặp với [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)] của mình, [versus_contestant.GetName]."
  contest_events.0800.champion_self: "Nhà vô địch của ta, [contest_champion.GetFirstName], và ta sẽ cho lũ quê mùa này thấy thế nào là đúng nghĩa!\n\n"
  contest_events.0800.a.contestant:0 "Ta đã sẵn sàng!"
  contest_events.0800.a.champion:1 "Cố lên [contest_champion.GetTitledFirstNameNoTooltip]! Xứng đáng với danh hiệu vô địch đi!"
  contest_events.0800.a:0 "Kẻ mạnh nhất sẽ chiến thắng!"
  contest_events.0800.b:0 "Ta có một vụ cá cược cần đặt..."
  contest_events.0800.c:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip] mà không tham gia thì không ổn chút nào..."
  contest_events.0800.d:0 "[rival_contestant.GetTitledFirstNameNoTooltip]?! Không phải tại #EMP trò chơi của ta#!!"
  contest_events.0800.e:0 "Có lẽ danh sách có thể được thay đổi..."
  contest_events.0800.e.flavor:0 "Ngươi, gia nhân! Ta có một việc tinh tế..."
  contest_events.0800.f:0 "Dĩ nhiên là [versus_contestant.GetFirstNameNoTooltip] sẽ nhường bước trước chúa tể của [versus_contestant.GetHerHis]..."
  contest_events.0800.f.flavor:0 "Đó mới là lẽ phải."
  mysterious_stranger_joust:1 "Sự xuất hiện của '[mysterious_stranger.GetFirstName] xứ [attending_barony.GetNameNoTierNoTooltip]', một [mysterious_stranger.Custom('KnightCultureNoTooltipLowercase')] [mysterious_stranger.GetCulture.GetNameNoTooltip] tài giỏi với lai lịch mờ ám, đã gây nên không ít xôn xao."
  mysterious_stranger_wrestling:2 "Một kẻ mới đến tên là [mysterious_stranger.GetFirstName], nổi danh trong vùng của [mysterious_stranger.GetHerHis], đã xuất hiện với mong muốn tạo dựng tên tuổi cho chính [mysterious_stranger.GetHerselfHimself]."
  mysterious_stranger_duel:0 "$mysterious_stranger_joust$"
  mysterious_stranger_board_game:0 "Một người đàn ông tên [mysterious_stranger.GetFirstName] đã tham gia năm nay theo lời giới thiệu của một lãnh chúa địa phương, rất ít người biết về lối chơi của [mysterious_stranger.GetHerHis] ngoài những lời đồn."
