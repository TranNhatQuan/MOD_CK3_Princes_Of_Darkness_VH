 ### HORSE RACE ###
 # FALL
  contest_events.4500.t:1 "$tournament_contest_header$ Cú Ngã Bi Thảm"
  contest_events.4500.desc:0 "Ta gần như nhảy cẫng lên vì vui sướng khi nhìn con ngựa đua #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! của mình vẫn bám trụ trong nhóm dẫn đầu.\n\nKhi họ tiến đến cuối một vòng đua nữa, tim ta chùng xuống khi con [ROOT.Char.Custom('ContestHorseRaceGender')] của ta và kỵ sĩ của [ROOT.Char.Custom('ContestHorseRaceHerHis')] bất ngờ ngã nhào, biến mất trong làn bụi mù!\n\nSau khi những người khác lướt qua, suýt nữa thì xảy ra thảm họa, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! cố gắng đứng dậy — rõ ràng là [ROOT.Char.Custom('ContestHorseRaceSheHe')] không thể tiếp tục..."
  contest_events.4500.unskilled:0 "[ROOT.Char.Custom('ContestHorseRaceSheHe')|U] không phải là con ngựa xuất sắc nhất, nhưng nỗi nhục nhã này sẽ làm hoen ố danh tiếng của ta với tư cách là một nhà nuôi ngựa đua..."
  contest_events.4500.sabotage:0 "Ta thật không hiểu nổi! #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! là một trong những con ngựa tốt nhất quanh đây! Trừ khi... ta nghi ngờ liếc nhìn khán đài..."
  contest_events.4500.a:0 "Khốn kiếp."
  contest_horse_race_crashed_out_log_title:0 "Ngã Ngựa"
  contest_horse_race_crashed_out_log:1 "Con ngựa của [CHARACTER.GetTitledFirstName], [CHARACTER.Custom('GetContestHorseRaceName')], đã ngã và rút khỏi cuộc đua"
  contest_events.4501.t:0 "$contest_events.1540.t$"
  contest_events.4501.desc:0 "[contestant.GetTitledFirstName] đang nhảy cẫng lên vì vui sướng khi nhìn con ngựa đua #EMP [contestant.Custom('GetContestHorseRaceName')]#! của [contestant.GetHerHis] vẫn bám trụ trong nhóm dẫn đầu.\n\nKhi họ tiến đến cuối một vòng đua nữa, con [contestant.Custom('ContestHorseRaceGender')] và kỵ sĩ của [contestant.Custom('ContestHorseRaceHerHis')] bất ngờ ngã nhào, biến mất trong làn bụi mù! [contestant.GetFirstNameNoTooltip] chết lặng.\n\nSau khi những người khác đã lướt qua, suýt nữa thì xảy ra thảm họa, #EMP [contestant.Custom('GetContestHorseRaceName')]#! cố gắng đứng dậy — rõ ràng là [contestant.Custom('ContestHorseRaceSheHe')] không thể tiếp tục...\n\n"
  contest_events.4501.unskilled:0 "Ta không nghĩ rằng sẽ còn ai đặt cược vào một trong những con ngựa của [contestant.GetTitledFirstNamePossessiveNoTooltip] trong thời gian tới..."
  contest_events.4501.sabotage:0 "[contestant.GetTitledFirstNameNoTooltip] rõ ràng là đang bối rối. \"Ta thật không hiểu nổi! #EMP [contestant.Custom('GetContestHorseRaceName')]#! là một trong những con ngựa tốt nhất quanh đây!\" [contestant.GetSheHe] kêu lên, ánh mắt đầy nghi ngờ hướng về khán đài."
  contest_events.4501.a:0 "Chuyện thường thôi."
 # CHEER
  contest_events.4600.t:1 "$tournament_contest_header$ Cổ Vũ Nhiệt Tình"
  contest_events.4600.desc:0 "Ta dõi theo những con ngựa nện vó lao qua khán đài, hít căng mùi bụi đất tung lên, âm thanh đám đông gào thét và tiếng dậm vang trầm đục của vô số vó ngựa.\n\n"
  contest_events.4600.wager_entrant:0 "Dù ta đã cho con [ROOT.Char.Custom('ContestHorseRaceGender')] của mình, [ROOT.Char.Custom('GetContestHorseRaceName')], tham gia, ánh mắt ta vẫn dán vào con #EMP [wager_owner.Custom('GetContestHorseRaceName')]#! của [wager_owner.GetTitledFirstNamePossessive] cùng kỵ sĩ của [wager_owner.Custom('ContestHorseRaceHerHis')], nghĩ về số tiền mình có thể thắng..."
  contest_events.4600.wager:1 "Ta chăm chú dõi theo con [wager_owner.Custom('ContestHorseRaceGender')] #EMP [wager_owner.Custom('GetContestHorseRaceName')]#! của [wager_owner.GetTitledFirstNamePossessive] và kỵ sĩ của [wager_owner.Custom('ContestHorseRaceHerHis')], mơ về số tiền mình có thể thắng..."
  contest_events.4600.entrant:1 "Con [ROOT.Char.Custom('ContestHorseRaceGender')] của ta, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, vẫn giữ được nhịp độ khi các vòng đua trôi qua, kỵ sĩ của [ROOT.Char.Custom('ContestHorseRaceHerHis')] đang cạnh tranh sòng phẳng với những người khác."
  contest_events.4600.a:0 "Chạy đi! Chạy đi, đồ ngựa già!"
  contest_events.4600.b:0 "Lên nào, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!!"
  contest_events.4600.b.wager:0 "Lên nào, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!"
  contest_events.4600.c:0 "Bình tĩnh..."

 ### RECITAL ###
  contest_events.5000.t:0 "Buổi Ngâm Thơ Ồn Ào"
  contest_events.5000.desc:0 "[enemy.GetFirstName] nở một nụ cười khinh khỉnh đầy ngạo mạn về phía ta khi [enemy.GetSheHe] bước lên bục, và chẳng mất bao lâu ta hiểu được lý do. Ngay câu đầu tiên đã là một lời sỉ nhục nặng nề nhắm vào ta, và những câu sau cũng chẳng khá hơn!\n\nÂm thanh reo hò, la ó của đám đông vang dội bên tai. Ta không còn lựa chọn nào khác ngoài việc đáp trả bằng chính bài thơ của mình, công kích danh dự của [enemy.GetFirstNamePossessiveNoTooltip]! Câu mở đầu mang ý nghĩa sống còn.\n\n"#POE Quả thực [enemy.GetFirstNameNoTooltip] gieo vần chẳng ai sánh kịp! Tuy nhiên..."
  contest_events.5000.shagged_your_mum:0 "#POE ...ta đã từng nằm chung giường với mẹ của [enemy.GetHerHis]!\""
  contest_events.5000.shagged_your_dad:0 "#POE ...ta đã từng nằm chung giường với cha của [enemy.GetHerHis]!\""
  contest_events.5000.licentious:0 "#POE ...[enemy.GetSheHe] là kẻ tình ái trác táng!\""
  contest_events.5000.stupid:0 "#POE ...đầu óc của [enemy.GetHerHis] chẳng thể nào ngu muội hơn!\""
  contest_events.5000.ugly:0 "#POE ...khuôn mặt của [enemy.GetHerHis] chẳng thể nào thô kệch hơn!\""
  contest_events.5000.success:0 "Câu thơ của Ngài chinh phục đám đông"
  contest_events.5000.failure:0 "Câu thơ của Ngài không mang lại hiệu quả"
  contest_events.5010.t:0 "Lạc Lối Trong Phiên Dịch"
  contest_events.5010.desc:0 "[enemy.GetFirstName] trừng mắt nhìn ta chằm chằm, cuộn giấy và bút lông vẫn còn trong tay. [enemy.GetSheHe|U] hít một hơi thật sâu rồi bắt đầu tuôn ra những lời nhảm nhí mà ta hoàn toàn không thể hiểu nổi.\n\nRõ ràng những gì [enemy.GetSheHe] đang nói có ý nghĩa vô cùng lớn với [enemy.GetHerHim], khi [enemy.GetSheHe] tiếp tục nhìn ta không rời mắt, trong lúc vài thành viên của đám đông im lặng kinh ngạc, thì thầm với nhau, hẳn là đang dịch lại các vần thơ cho Bạn Bè của họ."
  contest_events.5010.a:0 "Đáp trả bằng một lời xúc phạm!"
  contest_events.5010.b:0 "Ta phải cố gắng hiểu."
  contest_events.5020.t:0 "Một Vần Thơ Đức Hạnh"
  contest_events.5020.desc:0 "Đám đông hò reo vang dội khi ta hoàn thành phần ngâm thơ mới nhất — một tác phẩm được tạo ra để công kích danh dự của [enemy.GetFirstNamePossessive] và cho tất cả thấy trí tuệ của ta vượt trội đến mức nào! Không ai còn nghi ngờ ai mới là người chiến thắng rõ ràng, nhưng trong cơn hưng phấn tột độ ấy, ta lại nảy sinh ham muốn tung ra thêm một bài thơ nữa cho đám đông hâm mộ."
  contest_events.5020.a:0 "Thêm một câu nữa cũng chẳng hại gì!"
  contest_events.5020.b:0 "Ta nên cúi chào và rời đi."
  contest_events.5030.t:0 "Một Bài Vè Nhạt Nhẽo"
  contest_events.5030.desc:0 "Ta thở phào đầy đắc thắng khi hoàn thành câu cuối cùng của buổi ngâm thơ. Ta chuẩn bị tinh thần đón nhận tràng pháo tay vang dội từ khán giả, nhưng thay vào đó, bãi đấu im phăng phắc, chỉ còn tiếng gió rít qua hàng cây.\n\nThật là thảm họa, nhưng có lẽ tình thế này vẫn còn cứu vãn được nếu ta sáng tác và ngâm ngay một bài thơ mới."
  contest_events.5030.a:0 "\"Ta còn một bài nữa!\""
  contest_events.5030.b:0 "Chấp nhận thất bại."
 ### BOARD GAME ###
  contest_events.5500.t:1 "$tournament_contest_header$ Sự Phân Tâm Gian Xảo"
  contest_events.5500.desc:0 "Sự im lặng nặng nề bao trùm: [versus_contestant.GetTitledFirstName] đã trầm ngâm suy tính nước đi tiếp theo của [versus_contestant.GetHerHis] dường như cả một đời người, ánh mắt chăm chú dán chặt vào bàn cờ [activity.Custom('ContestBoardGameType')] bên dưới đôi mày nhíu chặt.\n\nRõ ràng, [versus_contestant.GetWomanMan] này rất muốn giành chiến thắng.\n\nMột khi ý nghĩ đánh lạc hướng [versus_contestant.GetHerHim] nảy ra trong đầu ta, thật khó mà gạt bỏ..."
  contest_events.5500.a:0 "Ta cảm thấy ngứa ngáy rồi đây..."
  contest_events.5500.b:0 "Giá mà ta có thể khụ khịt cơn ho chết tiệt này..."
  contest_events.5500.success:0 "[versus_contestant.GetFirstNameNoTooltip] chật vật tập trung"
  contest_events.5500.mixed:0 "Ngài hơi quá đà"
  contest_events.5500.failure:0 "Ngài suýt thì nghẹn thở"
  contest_events.5500.nothing:0 "[versus_contestant.GetFirstNameNoTooltip] không hề để tâm"
  contest_events.5500.c:0 "À, giai điệu của khúc hát người hát rong kia là thế nào nhỉ?"
  contest_events.5500.d:0 "Mánh khóe rẻ tiền không đáng để ta dùng."
  contest_events.5510.t:1 "$tournament_contest_header$ Cơn Thịnh Nộ Trên Bàn Cờ"
  contest_events.5510.desc:0 "Chiếc bàn bị hất tung với một tiếng #EMP rầm#! kinh thiên động địa, khiến các quân cờ [activity.Custom('ContestBoardGameType')] bay tứ tung.\n\nTâm trạng của [versus_contestant.GetFirstNamePossessive] đã chuyển biến xấu từ vài nước trước, khi [versus_contestant.GetSheHe] nhận ra một sai lầm đơn giản đã gần như định đoạt ván đấu nghiêng hẳn về phía ta.\n\n\"Được rồi, được rồi, ngươi thắng, [ROOT.Char.GetTitledFirstName]!\" [versus_contestant.GetSheHe] rên rỉ, \"#EMP Vui chưa?!#!\""
  contest_events.5510.a:0 "Nhặt chúng lên đi! Ta cần thực hiện nước cuối!"
  contest_events.5510.b:0 "Hành vi phi thể thao như vậy không thể chấp nhận!"
  contest_events.5510.c:0 "Thôi nào, hãy quay lại vài nước trước."
  contest_events.5510.d:0 "Biết không, ngươi hoàn toàn có thể đầu hàng mà..."
  contest_events.5520.t:0 "Nước Cờ Gambit của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  contest_events.5520.desc:0 "Lặng lẽ nhìn bàn cờ [activity.Custom('ContestBoardGameType')] khi [versus_contestant.GetFirstName] đang cân nhắc nước đi tiếp theo của [versus_contestant.GetHerHis], ta bất chợt nhận ra.\n\nMải mê trong những toan tính chiến lược vụn vặt, ta đã bỏ lỡ một sơ hở có thể mang lại lợi thế rõ ràng cho mình — miễn là đối thủ chưa kịp đoán ra.\n\nTa cẩn trọng không để lộ bất kỳ dấu hiệu nhận thức nào, e rằng sẽ thu hút sự chú ý, đồng thời dò xét ánh mắt của [versus_contestant.GetFirstNamePossessive] để tìm xem có sự cảnh giác hay chỉ là cái bẫy tinh vi..."
  contest_events.5520.a:1 "$tournament_contest_header$ Nhẹ nhàng, từ tốn..."
  contest_events.5520.a.success:0 "Nước cờ là một đòn quyết định"
  contest_events.5520.a.failure:0 "Nước cờ phản tác dụng"
  contest_events.5520.b:0 "Ta nói này, ngươi đang để lộ sơ hở đấy."
  contest_events.5520.c:0 "Chỉ là mồi nhử thôi, chiến lược hiện tại của ta vẫn vững vàng."
  contest_events.5530.t:0 "Nhanh Tay Lẹ Mắt"
  contest_events.5530.desc:0 "Ván [activity.Custom('ContestBoardGameType')] dường như đang diễn ra hoàn hảo. Ta đã nghĩ trước ba, bốn, thậm chí năm nước so với đối thủ thì đột nhiên, [versus_contestant.GetFirstName] thực hiện một nước đi khiến toàn bộ chiến lược tinh vi của ta tan biến như bông tuyết trước ngọn nến.\n\nTa hoàn toàn cạn lựa chọn — nếu không làm điều gì đó liều lĩnh, chắc chắn ta sẽ thua!"
  contest_events.5530.a:0 "Thêm một quân cờ nữa thì chẳng ai để ý đâu..."
  contest_events.5530.a.success:0 "Ngài gian lận thành công để giành chiến thắng"
  contest_events.5530.a.failure:0 "Mưu mẹo của Ngài bị phát hiện"
  contest_events.5530.b:0 "\"Thật ra thì có một luật hiếm gặp thế này...\""
  contest_events.5530.c:0 "Ta sẽ không gian lận!"
  contest_events.5540.t:0 "$tournament_contest_header$ Sức Mạnh Hơn Trí Óc"
  contest_events.5540.desc:0 "It would appear my grand strategy is falling apart, and [versus_contestant.GetFirstName] is gaining ground fast. If this were a matter of warfare, I would be considering a merciful surrender. I can feel my insides boil with rage and my fists clench tight enough they're fit for bleeding.\n\nAs [versus_contestant.GetSheHe] reaches for [versus_contestant.GetHerHis] playing piece, [versus_contestant.GetHerHis] smug eyes meet with mine, and [versus_contestant.GetHerHis] face melts into a look of shock and dread.\n\nPerhaps I can use this moment to intimidate [versus_contestant.GetHerHim] from making [versus_contestant.GetHerHis] next move."
  contest_events.5540.a:0 "\"Chạm vào quân đó, ta sẽ bẻ gãy ngón tay ngươi.\""
  contest_events.5540.a.success:0 "Đối thủ của Ngài bỏ cuộc"
  contest_events.5540.a.failure:0 "Đối thủ của Ngài không hề nao núng"
  contest_events.5540.b:0 "Ta sẽ không tự làm ô danh mình."
  contest_events.5550.t:0 "$tournament_contest_header$ Luật [versus_contestant.GetCulture.GetNameNoTooltip]!"
  contest_events.5550.desc:0 "I keep a trained eye on the [activity.Custom('ContestBoardGameType')] as my opponent prepares to make [versus_contestant.GetHerHis] next move. To my shock, [versus_contestant.GetFirstName] picks up [versus_contestant.GetHerHis] piece and... breaks the rules right in front of me!\n\n"What manner of trickery is this?" I object!\n\n"Oh, forgive me." My opponent smugly rests [versus_contestant.GetHerHis] hands on the table. "I was under the impression we were playing by [versus_contestant.GetCulture.GetName] rules.""
  contest_events.5550.a:0 "Trọng tài!"
  contest_events.5550.a.success:0 "Trọng tài phán xử theo luật [ROOT.Char.GetCulture.GetName]"
  contest_events.5550.a.failure:0 "Trọng tài phán xử theo luật [versus_contestant.GetCulture.GetName]"
  contest_events.5550.b:0 "\"Xin hãy chỉ giáo cho ta những luật [versus_contestant.GetCulture.GetNameNoTooltip] này.\""
  contest_events.5550.c:0 "Có lẽ một ít tiền sẽ khiến trọng tài đứng về phía ta."
  cultural_acceptance_board_game:0 "Mức độ chấp nhận trò chơi bàn cờ trong giải đấu"
  contest_events.5560.t:0 "$tournament_contest_header$ Kẻ Điều Khiển"
  contest_events.5560.desc:1 "Ván đấu của ta với [versus_contestant.GetName] đang diễn ra vô cùng tệ hại. [versus_contestant.GetSheHe|U] chơi ở trình độ mà ta chưa từng nghĩ là có thể.\n\nTa để ý thấy ánh mắt của [versus_contestant.GetHerHis] liên tục liếc về phía đám đông, dường như đang nhìn thẳng vào một nhân vật đứng gần như ngay sau lưng ta! Người đó đang ra những cử chỉ tay rất tinh tế và mấp máy môi, không nghi ngờ gì nữa, đang chỉ dẫn cho [versus_contestant.GetFirstNameNoTooltip]."
  contest_events.5560.a:0 "\"Trọng tài! [versus_contestant.GetFirstNameNoTooltip|U] đang gian lận!\""
  contest_events.5560.a.success:0 "Trọng tài tin lời Ngài"
  contest_events.5560.a.failure:0 "Trọng tài không tin Ngài"
  contest_events.5560.b:0 "Các nước đi của ta phải trở nên khó lường hơn."
  contest_events.5560.b.success:1 "Ngài khiến [versus_contestant.GetFirstNameNoTooltip] rối loạn"
  contest_events.5560.b.failure:1 "[versus_contestant.GetFirstNameNoTooltip] đánh bại Ngài"
  contest_events.5560.c:0 "Ta chỉ cần tập trung vào ván cờ."
  contest_events.5560.c.success:1 "Ngài vượt trội [versus_contestant.GetFirstNameNoTooltip]"
  contest_events.5570.t:0 "$tournament_contest_header$ Một Nước Đi Xảo Quyệt"
  contest_events.5570.desc:0 "Ta tập trung cao độ vào bàn cờ, và toàn bộ khán giả cũng nín thở theo dõi. Bất chợt, với một tiếng kim loại chát chúa, sự chú ý của tất cả bị thu hút về phía tên hầu cận ngốc nghếch vừa làm đổ cả đống vũ khí và áo giáp xuống đất.\n\nKhông ai còn nhìn bàn cờ — đây chính là cơ hội để ta xoay chuyển ván đấu bằng cách động tay vào các quân cờ!"
  contest_events.5570.a:0 "Đổi chỗ một vài quân."
  contest_events.5570.a.success:0 "Ngài không bị phát hiện"
  contest_events.5570.a.failure:0 "Ngài bị bắt quả tang gian lận"
  contest_events.5570.b:0 "Hoảng loạn và nuốt luôn một quân cờ!"
  contest_events.5570.c:0 "Ta sẽ không làm ô danh mình bằng gian lận."
 ### TOOLTIPS ###
