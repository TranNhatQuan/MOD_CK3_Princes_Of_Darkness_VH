  contest_events.0810.t:0 "[activity.GetCurrentPhase.GetPhase.GetName] [activity.Custom('GetVersusRound')]: [contest_winner.GetFirstNameNoTooltip] và [contest_loser.GetFirstNameNoTooltip]"
  contest_events.0810.both_relation:0 "Trận đấu giữa [ROOT.Char.Custom2('RelationToMeShort', contest_winner)] của ta, [contest_winner.GetTitledFirstName], và [ROOT.Char.Custom2('RelationToMeShort', contest_loser)] của ta, [contest_loser.GetTitledFirstName], đã được phân định.\n\n"
  contest_events.0810.winner_relation:0 "Trận đấu giữa [ROOT.Char.Custom2('RelationToMeShort', contest_winner)] của ta, [contest_winner.GetTitledFirstName], và [contest_loser.GetTitledFirstName], đã được phân định.\n\n"
  contest_events.0810.loser_relation:0 "Trận đấu giữa [contest_winner.GetTitledFirstName] và [ROOT.Char.Custom2('RelationToMeShort', contest_loser)] của ta, [contest_loser.GetTitledFirstName], đã được phân định.\n\n"
  contest_events.0810.desc:0 "Trận đấu giữa [contest_winner.GetTitledFirstName] và [contest_loser.GetTitledFirstName] đã được phân định.\n\n"
  contest_events.0810.murder_success:0 "Kế hoạch được sắp đặt cẩn thận của ta dành cho [contest_loser.GetFirstNameNoTooltip] đã diễn ra hoàn hảo như dự tính, tên [contest_loser.Custom2('InsultNoun', ROOT.Char)] khốn kiếp đó sẽ không còn quấy rầy ta nữa!"
  contest_events.0810.murder_fail_lose:0 "Âm mưu phá hoại tinh vi của ta không mang lại kết quả như mong muốn — [contest_loser.GetFirstNameNoTooltip] vẫn sống — nhưng ít nhất thì tên [contest_winner.Custom2('InsultNoun', ROOT.Char)] khốn kiếp đó cũng không thắng..."
  contest_events.0810.murder_fail_win:0 "Không những âm mưu của ta không giết được [contest_winner.GetHerHim], mà [contest_winner.GetFirstNameNoTooltip], tên [contest_winner.Custom2('InsultNoun', ROOT.Char)] khốn kiếp ấy, còn giành chiến thắng trong trận đấu chết tiệt này!"
  contest_events.0810.close:1 "Đó là một trận đấu vô cùng sít sao, nhưng cuối cùng thì [contest_winner.Custom2('GetVersusContestEndFlavor', contest_loser)]"
  contest_events.0810.average:1 "Cả hai thí sinh đều thể hiện kỹ năng rất tốt, nhưng rốt cuộc thì [contest_winner.Custom2('GetVersusContestEndFlavor', contest_loser)]"
  contest_events.0810.far:1 "Sau một trận đấu một chiều đến mức không thỏa mãn, chẳng ai ngạc nhiên khi [contest_winner.Custom2('GetVersusContestEndFlavor', contest_loser)]"
  contest_events.0810.champion_won:0 "#EMP Chính vì thế#! mà [contest_winner.GetSheHe] là nhà vô địch của ta!"
  contest_events.0810.champion_lost:0 "Thế là cơ hội của nhà vô địch của ta tiêu tan..."
  tournament_versus_contest_end_flavor_joust_1:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] đã hất [second.GetFirstNameOrMeNoTooltip] khỏi yên ngựa trong một loạt va chạm dữ dội."
  tournament_versus_contest_end_flavor_joust_2:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] đã làm gãy cây thương thứ ba của [ROOT.Char.GetHerHisMy] trên khiên của [second.GetFirstNamePossessiveOrMyNoTooltip] bằng một đòn đánh chuẩn xác."
  tournament_versus_contest_end_flavor_joust_3:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] có nhiều điểm hơn [second.GetFirstNameOrMeNoTooltip] khi những cây thương cuối cùng được sử dụng."
  tournament_versus_contest_end_flavor_wrestling_1:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] ghìm chặt [second.GetFirstNameOrMeNoTooltip] xuống sàn và được tuyên bố là người chiến thắng."
  tournament_versus_contest_end_flavor_wrestling_2:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] quăng [second.GetFirstNameOrMeNoTooltip] khỏi võ đài trong một đám mây bụi khổng lồ."
  tournament_versus_contest_end_flavor_wrestling_3:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] dứt khoát đánh ngã [second.GetFirstNameOrMeNoTooltip] xuống đất."
  tournament_versus_contest_end_flavor_duel_1:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] đã tước vũ khí của [second.GetFirstNameOrMeNoTooltip|U] và buộc [second.GetHerHim] phải nhận thua."
  tournament_versus_contest_end_flavor_duel_2:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] đánh gục [second.GetFirstNameOrMeNoTooltip|U] xuống đất, buộc phải bỏ cuộc."
  tournament_versus_contest_end_flavor_duel_3:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] được tuyên bố là người chiến thắng rõ ràng qua một phán quyết vang dội."
  tournament_versus_contest_end_flavor_board_game_1:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] đã định đoạt ván cờ bằng một chuỗi nước đi được tính toán kỹ lưỡng."
  tournament_versus_contest_end_flavor_board_game_3:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] đã ép [second.GetFirstNameOrMeNoTooltip] vào thế buộc phải bỏ cuộc."
  tournament_versus_contest_end_flavor_board_game_2:1 "[ROOT.Char.GetFirstNameOrMeNoTooltip|U] chớp thời cơ khi [second.GetFirstNameOrMeNoTooltip] mắc phải một sai lầm kinh điển."
  contest_events.0810.wound:0 "\n\nNhững vết thương của [contest_loser.GetFirstNamePossessiveNoTooltip] là minh chứng cho lòng dũng cảm của [contest_loser.GetHerHis]."
  contest_events.0810.death:0 "\n\nThan ôi, [contest_loser.GetFirstNameNoTooltip] đã bị tàn phế vì nỗ lực của [contest_loser.GetHerHis], và không lâu sau đó thì qua đời."
