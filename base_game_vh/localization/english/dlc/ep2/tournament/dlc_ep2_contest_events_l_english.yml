  contest_events.0805.t.board_game:1 "$tournament_phase_board_game$: $contest_events.0505.t$"
  contest_events.0805.t.duel:0 "$tournament_phase_duel$: $contest_events.0505.t$"
  contest_events.0805.t.wrestling:0 "$tournament_phase_wrestling$: $contest_events.0505.t$"
  contest_events.0805.t.joust:0 "$tournament_phase_joust$: $contest_events.0505.t$"
  contest_events.0805.desc:1 "Tiếng kèn vang lên, đám đông náo động, các thí sinh bắt đầu tụ tập. Cuộc thi đã kết thúc, và khoảnh khắc tỏa sáng của ai đó đang được chuẩn bị. Một người xướng ngôn bước lên, giọng nói vang dội khắp không gian.\n\n\"Sau vô số thử thách, vài gian truân, và trên hết là một cuộc tranh tài vô cùng sôi nổi, [contest_winner.GetTitledFirstName] đã đánh bại [second_place.GetTitledFirstName] trong trận chung kết! [contest_winner.GetFirstNameNoTooltip] chính là người chiến thắng của chúng ta!\"\n\n"
  contest_events.0805.first:0 "Quả thực, không ai ở [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] có thể sánh được với kỹ năng của ta!"
  contest_events.0805.second:0 "Ta không chiến thắng, nhưng đã tiến rất gần..."
  contest_events.0805.contestant:2 "\"Lần sau ta phải cố gắng hơn nữa!\" Ta tự nhủ, khi nhìn cánh tay của người chiến thắng được giơ cao."
  contest_events.0805.spectator:0 "Một sự kiện vô cùng mãn nhãn!"
  contest_events.0805.first_champion:0 "\n\nNhà vô địch của ta #EMP thực sự#! thắng rồi sao?! Ta phải ban thưởng cho [contest_champion.GetHerHim]!"
  contest_events.0805.second_champion:0 "\n\nDù [contest_champion.GetSheHe] không chiến thắng, ta vẫn tự hào về nhà vô địch của mình."
  contest_events.0805.contestant_champion:1 "\n\nNhà vô địch của ta, [contest_champion.GetFirstName], chẳng mấy xứng đáng với cái tên ấy..."
  contest_events.0805.spectator_champion:0 "\n\nNhà vô địch của ta, [contest_champion.GetFirstName], thậm chí còn không đủ điều kiện."
  contest_events.0805.a.winner:0 "Ta thắng rồi! [ROOT.Char.GetTitleAsNameNoTooltip] của các ngươi đã thắng!"
  contest_events.0805.a.marriage:1 "Thực ra chỉ món [contest_prize.GetType|l] này là dành cho ngươi."
  contest_events.0805.a:0 "Chúc mừng, [contest_winner.GetTitledFirstNameNoTooltip]."
  contest_events.0805.b:0 "Ta xin dâng chiến thắng này cho [ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip]!"
  contest_events.0805.c.winner:0 "Có vẻ như chúng ta sẽ thành hôn, [marriage_prize.GetFirstNameNoTooltip]."
  contest_events.0805.c:0 "Làm tốt lắm, tay của [marriage_prize.GetTitledFirstNamePossessiveNoTooltip] là của ngươi."
  contest_events.0805.d.winner:0 "Ta thắng rồi! Ta #EMP thực sự#! thắng rồi!"
  contest_events.0805.d.second:0 "Suýt nữa thì..."
  contest_events.0805.d.loser:0 "Lần sau vậy..."
  contest_events.0805.d:0 "Một chiến thắng hoàn toàn xứng đáng."
