 # SUMMARY
  contest_events.0820.t:0 "[activity.GetCurrentPhase.GetPhase.GetName]: [activity.Custom('GetVersusRound')]"
  contest_events.0820.qualify:4 "Vòng loại của [activity.GetCurrentPhase.GetPhase.GetName] đã kết thúc, và hiện đã rõ ai sẽ được đưa vào vòng tứ kết.\n\n"
  contest_events.0820.semi:1 "Vòng tứ kết của [activity.GetCurrentPhase.GetPhase.GetName] đã kết thúc!\n\nVị sứ giả vang giọng: \"[contest_summary_1.GetNameRegnal], [contest_summary_2.GetNameRegnal], [contest_summary_3.GetNameRegnal], và [contest_summary_4.GetNameRegnal] đã tiến vào bán kết!\"\n\n"
  contest_events.0820.final:0 "Vòng bán kết của [activity.GetCurrentPhase.GetPhase.GetName] đã kết thúc!\n\nVị sứ giả vang giọng: \"[contest_summary_1.GetNameRegnal] và [contest_summary_2.GetNameRegnal] đã tiến vào trận chung kết!\"\n\n"
  contest_events.0820.open:1 "Các trận đấu của [activity.GetCurrentPhase.GetPhase.GetName] cuối cùng cũng chính thức bắt đầu.\n\nAi trong số những đấu thủ xứng đáng sẽ được đội vương miện vinh quang, giờ chỉ còn nằm trong tay của [ROOT.Char.GetFaith.HighGodName]!\n\n"
  contest_events.0820.contestant:0 "Không còn thời gian để chuẩn bị nữa. Nhân danh [ROOT.Char.GetFaith.WarGodName], ta sẽ cho đối thủ biết tay!\n\n"
  contest_events.0820.vs_resigned:0 "Trận đấu tiếp theo của ta lẽ ra là với [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)], [versus_contestant.GetTitledFirstName], nhưng [versus_contestant.GetSheHe] đã xin thua!\n\n"
  contest_events.0820.vs_disqualified:0 "Trận đấu tiếp theo của ta lẽ ra là với [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)], [versus_contestant.GetTitledFirstName], nhưng [versus_contestant.GetSheHe] đã bị loại!\n\n"
  contest_events.0820.vs:0 "Trận đấu tiếp theo của ta sẽ là với [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)], [versus_contestant.GetTitledFirstName].\n\n"
  contest_events.0820.vs_final:0 "Ta đã tiến vào trận chung kết! [versus_contestant.GetTitledFirstName] là kẻ duy nhất ngăn cách ta với chiến thắng.\n\n"
  contest_events.0820.intent_match:0 "Trong khi đó, [intent_scope.GetTitledFirstName] đã được ghép cặp với [intent_match.GetTitledFirstName].\n\n"
  contest_events.0820.woo_vow:0 "Ta kín đáo quan sát khán đài để tìm [woo_target.GetTitledFirstName], và nhanh chóng thấy [woo_target.GetHerHim] đang buồn bã nhìn ta — [woo_target.GetSheHe] dường như tin chắc rằng ta sẽ thi đấu..."
  contest_events.0820.a:0 "Ta làm được!"
  contest_events.0820.b:0 "Thật ra thì... ta xin thua..."
  contest_events.0820.c.resigned:0 "Xin thua sao? Ta thắng rồi!"
  contest_events.0820.c.disqualified:0 "Đó là lý do phải tuân theo luật lệ."
  contest_events.0820.d:2 "Một vòng đấu thú vị..."
  contest_events.0820.d.contestant:0 "Ta đã sẵn sàng!"
  contest_events.0820.d.loser:0 "Lần sau ta sẽ thắng..."
  contest_events.0825.t:0 "$activity_tournament$: Bỏ cuộc tại [activity.GetCurrentPhase.GetPhase.GetName]"
  contest_events.0825.desc:1 "Shying from the danger, or perhaps driven by some other motive, [resign_target.GetTitledFirstName] has conceded to [resign_target.GetHerHis] opponent, [versus_contestant.GetTitledFirstName], in the [activity.GetCurrentPhase.GetPhase.GetName|l] contest.\n\n"
  contest_events.0825.safe:0 "Shying from the chance for embarrassment, or perhaps driven by some other motive, [resign_target.GetTitledFirstName] has conceded to [resign_target.GetHerHis] opponent, [versus_contestant.GetTitledFirstName], in the [activity.GetCurrentPhase.GetPhase.GetName|l] contest.\n\n"
  contest_events.0825.qualify:0 "[versus_contestant.GetFirstNameNoTooltip] sẽ mặc định tiến vào bán kết."
  contest_events.0825.semi:0 "[versus_contestant.GetFirstNameNoTooltip] sẽ mặc định tiến vào chung kết."
  contest_events.0825.final:0 "[versus_contestant.GetFirstNameNoTooltip] mặc định giành chiến thắng trong cuộc thi!"
  contest_events.0825.a:0 "Thật vậy sao?"
  contest_events.0825.b:1 "[resign_target.GetSheHe|U] đã làm #EMP CÁI GÌ?!#!"
  contest_events.0826.t:0 "$activity_tournament$: Bị loại tại [activity.GetCurrentPhase.GetPhase.GetName]"
  contest_events.0826.desc:0 "In a show of [host.GetHerHis] ire, [host.GetTitledFirstName] has disqualified [disqualify_target.GetTitledFirstName] from the [activity.GetCurrentPhase.GetPhase.GetName|l] contest, opening the way for [versus_contestant.GetTitledFirstName] to progress.\n\n"
  contest_events.0826.a:0 "Quả là một bất ngờ."
  contest_events.0826.b:0 "[disqualify_target.GetSheHe|U] đã làm #EMP CÁI GÌ?!#!"

  contest_events.0860.t:0 "$tournament_contest_header$ Hết Tốc Lực"
  contest_events.0860.desc:0 "Những lá cờ phấp phới trong gió, khiến đám đông nín thở trong chốc lát khi ta ghìm cương ngựa. Ta nâng cao cây thương khi những sự kiện trước đó của cuộc thi lướt qua tâm trí, như khi"
  contest_events.0860.flavor_1:0 "ta tiếp tục chiến đấu dù bị thương sau một cú đánh nặng vào sườn.\n\n"
  contest_events.0860.flavor_2:0 "đối thủ của ta bị hất văng khỏi lưng ngựa.\n\n"
  contest_events.0860.flavor_3:0 "đối thủ của ta cố sử dụng một cây thương khổng lồ.\n\n"
  contest_events.0860.flavor_4:0 "đối thủ của ta tiến đến đề nghị một cuộc đấu bộ.\n\n"
  contest_events.0860.flavor_5:0 "đối thủ cao quý của ta cố đấu thương dù bị thương nặng.\n\n"
  contest_events.0860.flavor_6:0 "đối thủ của ta xin được một lượt nhân nhượng.\n\n"
  contest_events.0860.flavor_7:0 "ta trò chuyện với gã chải ngựa luộm thuộm của đối thủ.\n\n"
  contest_events.0860.flavor_8:0 "đám đông chế giễu ta khi ta chuẩn bị xung phong.\n\n"
  contest_events.0860.flavor_9:0 "ta cho đối thủ mượn một cây thương khi họ đã dùng hết.\n\n"
  contest_events.0860.flavor_10:0 "một đấu thủ khác ngã ngựa và chịu một vết thương kinh hoàng.\n\n"
  contest_events.0860.flavor_fallback:0 "Đối thủ của ta vào vị trí ở đầu bên kia của hàng rào. Đến lúc rồi."
  contest_events.0860.a:0 "Có lẽ nếu ta đánh trúng đầu hắn..."
  contest_events.0860.b:0 "Nhắm cao, đánh thấp."
  contest_events.0860.c:0 "Ta nghĩ mình đã thấy một sơ hở ở lượt trước..."
  contest_events.0860.d:0 "Không mánh khóe. Chỉ nhắm vào khiên."

  contest_events.0861.t:0 "$tournament_contest_header$ Bị Đè"
  contest_events.0861.desc:0 "Đám đông gào thét khát máu khi ta loạng choạng tiến lên để tiếp tục đối mặt với đối thủ. Ta gạt dòng máu đỏ từ trán và suy ngẫm về trận đấu cho đến giờ, nhớ lại khi"
  contest_events.0861.flavor_1:0 "ta đã cố nhận ra điểm yếu của đối thủ từ trước.\n\n"
  contest_events.0861.flavor_2:0 "đối thủ của ta dừng lại để làm trò với đám đông.\n\n"
  contest_events.0861.flavor_3:0 "ta dùng đất cát làm mù mắt đối thủ.\n\n"
  contest_events.0861.flavor_4:0 "ta phải dùng đến những mánh khóe bẩn thỉu để giành phần thắng.\n\n"
  contest_events.0861.flavor_5:0 "một người trong đám đông đã bất ngờ giúp đỡ ta.\n\n"
  contest_events.0861.flavor_6:0 "đối thủ đồ sộ của ta dùng thân hình to lớn áp đảo ta.\n\n"
  contest_events.0861.flavor_7:0 "ta và đối thủ rơi vào một tư thế khá là thân mật.\n\n"
  contest_events.0861.flavor_8:0 "một người quen của đối thủ buộc tội ta gian lận.\n\n"
  contest_events.0861.flavor_9:0 "ta phân tích đối thủ để bảo đảm chiến thắng.\n\n"
  contest_events.0861.flavor_10:0 "ngón tay của ta bị trật khớp.\n\n"
  contest_events.0861.flavor_11:0 "đối thủ chọc vào mắt ta.\n\n"
  contest_events.0861.flavor_12:0 "đối thủ sùi bọt mép cắn vào mũi ta.\n\n"
  contest_events.0861.flavor_13:0 "ta úp tay lên tai đối thủ, làm vỡ màng nhĩ của hắn.\n\n"
  contest_events.0861.flavor_fallback:0 "để tung ra đòn quyết định.\n\n"
  contest_events.0861.a:0 "Gan hắn trông có vẻ sơ hở..."
  contest_events.0861.b:0 "\"Đến đi! Hãy khóa chặt như những chiến binh!\""
  contest_events.0861.c:0 "Giả thấp, đánh cao."
  contest_events.0861.d:0 "Đơn giản thôi, an toàn là trên hết."

  contest_events.0862.t:0 "$tournament_contest_header$ Phản Đòn"
  contest_events.0862.desc:0 "Tiếng kim loại rít lên chói tai khi hai lưỡi kiếm cọ sát dọc thân nhau, tia lửa bắn ra lấp lánh khi rơi xuống đất. Ta tìm kiếm lợi thế, nhớ lại khi"
  contest_events.0862.flavor_3:0 "thanh kiếm của đối thủ bay văng vào đám đông.\n\n"
  contest_events.0862.flavor_4:0 "ta theo bản năng đá thẳng vào hạ bộ đối thủ.\n\n"
  contest_events.0862.flavor_5:0 "ta nắm được một lợi thế mang tính quyết định và cân nhắc cách tận dụng nó.\n\n"
  contest_events.0862.flavor_6:0 "đối thủ tìm cách hối lộ ta.\n\n"
  contest_events.0862.flavor_7:0 "ta phải chọn giữa phản đòn và đỡ đòn trước đối thủ hung hãn.\n\n"
  contest_events.0862.flavor_8:0 "ta thấy cơ hội sử dụng tay còn lại trong cuộc đấu.\n\n"
  contest_events.0862.flavor_9:0 "ta nhận ra mình đang chiến đấu trong chiếc áo choàng của một đấu sĩ.\n\n"
  contest_events.0862.flavor_10:0 "ta cân nhắc việc phân tâm đối thủ bằng lời nói.\n\n"
  contest_events.0862.flavor_11:0 "ta tận dụng kinh nghiệm #EMP thân mật#! của mình với một người trong gia đình đối thủ.\n\n"
  contest_events.0862.flavor_fallback:0 "Chúng ta lại tiến về phía nhau. Cả hai đều bầm dập, mệt mỏi, và chỉ có thể có một người chiến thắng.\n\n"
  contest_events.0862.a:0 "Ta phải nhớ những gì mình được huấn luyện."
  contest_events.0862.b:0 "\"Sao? Ngươi #EMP sợ rồi à?#!\""
  contest_events.0862.c:0 "Một cú hù dọa cuối cùng có thể định đoạt tất cả..."
  contest_events.0862.d:0 "\"Đến đây. Hãy chiến đấu.\""

  contest_events.0863.t:0 "$tournament_contest_header$ Chiếu"
  contest_events.0863.desc:1 "Tiếng lách cách nhẹ của các quân cờ bị xê dịch phá vỡ bầu không khí tĩnh lặng. Chúng ta đã bước sâu vào tàn cuộc, và ván đấu đang ở thế cân bằng. Ta suy ngẫm về những gì đã xảy ra trước đó, như khi"
  contest_events.0863.flavor_1:0 "ta cố làm đối thủ rối trí bằng những đòn tâm lý.\n\n"
  contest_events.0863.flavor_2:0 "đối thủ hất tung cả bàn cờ trong một cú va chạm kinh thiên.\n\n"
  contest_events.0863.flavor_3:0 "ta thấy cơ hội cho một nước đi mạo hiểm nhưng đầy phần thưởng.\n\n"
  contest_events.0863.flavor_4:0 "ta nhận ra và cân nhắc một cơ hội gian lận.\n\n"
  contest_events.0863.flavor_5:0 "ta uy hiếp đối thủ khiến hắn đi những nước cờ tệ hại.\n\n"
  contest_events.0863.flavor_6:0 "đối thủ yêu cầu ta tôn trọng cách diễn giải luật chơi của họ.\n\n"
  contest_events.0863.flavor_fallback:0 "Các quân cờ di chuyển lặng lẽ nhưng gấp gáp. Cả hai chúng ta đều không còn nhiều thời gian để buộc đối phương thua cuộc.\n\n"
  contest_events.0863.a:0 "Có lẽ ta có thể vận dụng kiến thức quân sự của mình?"
  contest_events.0863.b:0 "\"Ngươi có vẻ tự tin quá nhỉ...\""
  contest_events.0863.c:0 "Có lẽ đã đến lúc cho một nước đi táo bạo?"
  contest_events.0863.d:0 "Đánh an toàn mới là lựa chọn đúng."

  contest_events.0870.t:0 "$tournament_contest_header$ Đòn Quyết Định"
  contest_events.0870.pivotal_success:0 "Trước hết là tiếng va chạm. Rồi ngay sau đó, một cú giật mạnh truyền dọc cánh tay ta. Rồi đột nhiên, một âm thanh khác vang lên: tiếng tung hô của đám đông. Cây thương của ta đánh trúng đích với lực khủng khiếp, vỡ tan trên chiếc khiên của đối thủ. Đáng chú ý hơn cả, hắn hoàn toàn đánh trượt!\n\n"
  contest_events.0870.pivotal_neutral:0 "Dù cả hai đều khởi đầu khá tốt, cánh tay ta chao đảo và trượt xuống, lướt qua chiếc khiên của đối thủ. Niềm an ủi duy nhất là đối thủ cũng đánh trượt cao như ta đánh thấp, giữa tiếng rên rỉ vang dội của đám đông.\n\n"
  contest_events.0870.pivotal_failure:0 "Ta nhìn mũi thương của mình tiến lại gần, gần nữa, rồi... #EMP trượt#! khỏi chiếc khiên của đối thủ. Ngay khoảnh khắc sau, ta bị giật ngược lại trên yên ngựa, khi một cây thương khác vỡ tan trên khiên của chính ta, tiếng gào thét của đám đông như lời nguyền rủa bên tai.\n\n"
  contest_events.0870.ptv_close:0 "Đã đến lúc cho lượt lao cuối cùng. Tất cả sẽ được định đoạt tại đây."
  contest_events.0870.ptv_top:0 "Ta đang dẫn trước, nhưng vẫn còn một lượt lao nữa. Chỉ cần hòa ở lượt cuối này là đủ..."
  contest_events.0870.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] đang dẫn trước, nhưng vẫn còn một lượt lao cuối cùng..."
  contest_events.0870.ptv_bottom:0 "Ta đang bị bỏ xa, lại còn bầm dập tơi tả. Hy vọng thực sự duy nhất là đánh đối thủ mạnh đến mức hắn không thể tiếp tục, nhưng điều đó cần đến một phép màu..."
  contest_events.0870.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] trông như đã thua đến nơi. Trừ phi có một màn lội ngược dòng kịch tính, mọi thứ dường như đã an bài."
  contest_events.0870.ptv_top_half:0 "Ta đang thắng, nhưng vẫn còn rất nhiều điều phải lo lắng. Chỉ một đòn duy nhất cũng có thể kết thúc cuộc thi này theo hướng có lợi cho ta hoặc cho hắn."
  contest_events.0870.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] đang thắng, nhưng thế trận rất sít sao. Vinh quang vẫn còn trong tầm với."
  contest_events.0870.ptv_bottom_half:0 "Ta đang thua về điểm số, nhưng vẫn có thể gỡ lại. Còn một lượt lao nữa, thêm một cơ hội nữa cho vinh quang..."
  contest_events.0870.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] đang thua, nhưng mọi thứ vẫn chưa kết thúc. Chỉ một hành động nữa cũng có thể xoay chuyển cục diện cho [pivotal_contestant.GetHerHim]..."
  contest_events.0870.ptv_fallback:1 "Lượt lao cuối cùng của vòng đấu đã đến, khi cả hai con ngựa cùng tăng tốc phi nước đại."
  contest_events.0870.spectator:0 "\n\nNhững lượt cuối của một trận đấu thương trở nên hỗn loạn: khán giả la ó và hò hét, các thầy thuốc bận rộn chăm sóc người bị thương, và sức nóng của đám đông chen chúc đẩy mọi thứ lên cao trào."
  contest_events.0870.final:0 "\n\nMóng ngựa dội vang như sấm. Những cây thương hạ thấp. Đám đông gào thét."
  contest_events.0870.winner_start:0 "Chúng ta thiết lập lại lần cuối, và khi con ngựa của ta phi như sấm về phía [versus_contestant.GetFirstName], ta có một linh cảm rất tốt về lượt lao này."
  contest_events.0870.loser_start:0 "Chúng ta lại thiết lập lại, nhưng khi ta xung phong thì có gì đó không ổn; nhịp điệu của con ngựa, hoặc cách bộ giáp của ta ôm sát cơ thể."
  contest_events.0870.winner_break:0 "Cây thương của ta đánh trúng đích, đâm thẳng vào chiếc khiên của [versus_contestant.GetHerHis] với một tiếng va chạm điếc tai và một vụ nổ mảnh vỡ, trong khi cây thương của [versus_contestant.GetHerHis] bay sượt qua ta. Chừng đó điểm là đủ để ta chiến thắng!"
  contest_events.0870.winner_unhorse:0 "Cây thương của ta đánh trúng ngực [versus_contestant.GetHerHim], hất văng [versus_contestant.GetHerHim] xuống đất giữa cơn mưa mảnh vỡ khi con ngựa của ta vẫn lao tiếp."
  contest_events.0870.loser_break:0 "Cây thương của ta chệch mục tiêu vào giây cuối cùng, và ta cảm nhận được cú đánh chuẩn xác của [versus_contestant.GetHerHis], làm bật chiếc khiên của ta trước tiếng va chạm điếc tai và vụ nổ mảnh vỡ."
  contest_events.0870.loser_unhorse:0 "Ta không thể giữ mục tiêu khi hai bên áp sát, và ta thấy cây thương của [versus_contestant.GetHerHis] luồn qua chiếc khiên của ta, đâm thẳng vào ngực. Choáng váng nằm trên mặt đất, ta nghe thấy [versus_contestant.GetHerHim] cưỡi ngựa đi tiếp trong chiến thắng."
  contest_events.0870.a:0 "Lượt lao cuối của vòng đấu đang gọi."
  contest_events.0870.b:0 "Một lượt lao cuối cùng cho vòng đấu!"

  contest_events.0871.t:0 "$tournament_contest_header$ Cân Não"
  contest_events.0871.pivotal_success:0 "Một tay đặt lên vai đối thủ, một cú vấp khéo léo và một cú quật dữ dội. Chúng Ta đổ ầm xuống sàn. Mọi âm thanh chỉ còn là hơi thở nặng nhọc và, ở xa hơn, là tiếng gầm của đám đông. Ta vùng lên, trèo lên người đối thủ, dồn sức ép để tận dụng lợi thế.\n\n"
  contest_events.0871.pivotal_neutral:0 "Hơi thở gấp gáp của cả hai lấp đầy không khí khi chúng Ta vật lộn tìm cách quật ngã nhau. Cuối cùng, một bàn chân móc trúng chân kia trở thành bước ngoặt, và chúng Ta cùng ngã xuống đất. Choáng váng trong chốc lát, chúng Ta nhận ra mình đang nằm nghiêng hai bên và lập tức gồng mình tìm lợi thế.\n\n"
  contest_events.0871.pivotal_failure:0 "Ta cố ném đối thủ, nhưng ngay khi làm vậy thì chính Ta lại bị hất tung. Ta tiếp đất nặng nề, không khí bật khỏi phổi trong tiếng rên, và lập tức phải phòng thủ, gắng sức không để bị ghìm chặt.\n\n"
  contest_events.0871.ptv_close:0 "Trận đấu sát nút đến nghẹt thở. Chỉ một sai lầm của bất kỳ ai cũng có thể kết thúc tất cả trong chớp mắt."
  contest_events.0871.ptv_close_spectator:0 "Trận đấu quá sát sao! Chỉ một sai lầm của bất kỳ võ sĩ nào cũng có thể quyết định kết cục ngay tức thì."
  contest_events.0871.ptv_top:0 "Ta đang chiếm ưu thế! Chỉ cần trụ vững là sẽ giành chiến thắng!"
  contest_events.0871.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] đang dẫn trước! Chiến thắng đã ở rất gần!"
  contest_events.0871.ptv_bottom:0 "Ta đang thất thế, và là thất thế khá rõ. Con đường đến chiến thắng rất hẹp, nhưng vẫn còn khả năng..."
  contest_events.0871.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] đang bị dẫn sâu. Để thắng từ đây, có lẽ cần đến một phép màu..."
  contest_events.0871.ptv_top_half:0 "Ta đang dẫn trước, nhưng chiến thắng vẫn chưa chắc chắn. Chỉ cần thêm một chút nỗ lực nữa..."
  contest_events.0871.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] đang dẫn trước, nhưng chiến thắng vẫn chưa hoàn toàn trong tay."
  contest_events.0871.ptv_bottom_half:0 "Ta đang thua, nhưng thất bại vẫn chưa được định đoạt. Ta vẫn có thể xoay chuyển tình thế!"
  contest_events.0871.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] đang thua, nhưng thất bại vẫn chưa là điều chắc chắn."
  contest_events.0871.ptv_fallback:0 "Mồ hôi tuôn xối xả. Tứ chi quấn chặt lấy nhau, cả hai cùng tìm điểm tựa."
  contest_events.0871.spectator:0 "\n\nHai thân người tách ra, rồi lại lao vào, rồi lại rời nhau, hơi thở nặng nề của các đấu thủ bị nhấn chìm bởi tiếng gầm của đám đông. Họ khóa chặt lấy nhau lần nữa, bụi bay mù và bám dính lên những mảng da ướt đẫm mồ hôi."
  contest_events.0871.final:0 "Bụi tung mù mịt, đám đông gào thét phấn khích. Trận đấu sẽ được định đoạt."
  contest_events.0871.winner_start:1 "Chỉ ít giây sau, ta chớp được khoảnh khắc [versus_contestant.GetFirstName] mất cảnh giác."
  contest_events.0871.loser_start:1 "Chỉ ít giây sau, [versus_contestant.GetFirstName] bất ngờ khiến ta trở tay không kịp!"
  contest_events.0871.winner_pin:0 "Ta ra đòn quyết định, ghìm chặt [versus_contestant.GetHerHim], giữ [versus_contestant.GetHerHim] bất động trong khi [versus_contestant.GetSheHe] vùng vẫy vô ích để thoát ra."
  contest_events.0871.winner_throw:1 "Ta không bỏ lỡ cơ hội, túm lấy eo [versus_contestant.GetHerHis] và dồn toàn lực quật [versus_contestant.GetHerHim] về phía rìa sàn đấu, nơi [versus_contestant.GetSheHe] văng khỏi võ đài."
  contest_events.0871.loser_pin:0 "Khi ta còn đang cố trấn tĩnh, [versus_contestant.GetSheHe] quật ta xuống đất và ghìm chặt như gọng kìm. Ta giãy giụa vô vọng, không thể thoát ra."
  contest_events.0871.loser_throw:0 "Khi ta loay hoay tìm điểm bám, [versus_contestant.GetSheHe] quật mạnh ta, hất văng ta khỏi võ đài xuống đất."
  contest_events.0871.winner_end:1 "Các trọng tài tuyên bố kết thúc. Ta đã thắng!"
  contest_events.0871.loser_end:1 "Các trọng tài tuyên bố kết thúc. Ta đã thua..."
  contest_events.0871.a:0 "Chiến thắng!"
  contest_events.0871.a.loser:0 "Khốn kiếp..."
  contest_events.0871.b:0 "Chỉ cần thêm một lần ngã nữa là xong!"

  contest_events.0872.t:0 "$tournament_contest_header$ Thép Chạm Thép"
  contest_events.0872.pivotal_success:0 "Một cú đánh vang dội khi vũ khí của ta sượt qua mũ trụ, khiến đối thủ loạng choạng trong cơn choáng váng. Ta lập tức dồn ép; một cú giả trái, một đòn nặng tay bên phải. Ta tiến lên khi đối thủ lùi bước trong tuyệt vọng, lưỡi kiếm của ta chỉ vừa đủ bị gạt đi trong gang tấc.\n\n"
  contest_events.0872.pivotal_neutral:0 "Cú bổ từ trên cao của ta bị gạt sang bên, và ta né được đòn phản công. Vũ khí lại va chạm, đỡ và đâm trong tiếng reo hò và thở gấp của đám đông. Không ai trong chúng ta tìm được sơ hở.\n\n"
  contest_events.0872.pivotal_failure:0 "Cú đâm mệt mỏi của ta đi chệch hướng, đối thủ thậm chí khinh thường đến mức không buồn né tránh. Ngay lập tức, ta rơi vào thế phòng thủ, liên tục đỡ đòn mà không thể phản kích. Ta lùi lại trong tuyệt vọng, lách người né tránh, làm mọi thứ để tiếp tục trụ lại.\n\n"
  contest_events.0872.ptv_close:0 "Trận đấu tay đôi vẫn cực kỳ sát sao! Người chiến thắng có thể là bất kỳ ai trong hai chúng ta."
  contest_events.0872.ptv_close_spectator:0 "Trận đấu tay đôi vẫn cực kỳ sát sao! Người chiến thắng có thể là bất kỳ đấu thủ nào."
  contest_events.0872.ptv_top:0 "Ta đang chiếm ưu thế rõ rệt. Chỉ cần giữ vững thêm một chút nữa..."
  contest_events.0872.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] đang dẫn trước! Chỉ cần thêm chút nữa là chiến thắng..."
  contest_events.0872.ptv_bottom:0 "Ta đang thất thế rõ ràng. Ta cần làm gì đó ngay!"
  contest_events.0872.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] đang thất thế rõ rệt. [pivotal_contestant.GetSheHe|U] cần phải hành động sớm!"
  contest_events.0872.ptv_top_half:0 "Ta đang dẫn trước, nhưng bản chất của một trận đấu tay đôi là phải dồn ép lợi thế ngay, nếu không sẽ hối hận."
  contest_events.0872.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] đang dẫn trước, nhưng trong một trận đấu tay đôi, cục diện có thể đổi thay bất cứ lúc nào."
  contest_events.0872.ptv_bottom_half:0 "Ta đang thua. Có lẽ không nhiều, nhưng ta cần làm gì đó sớm..."
  contest_events.0872.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] đang thua. Có lẽ không nhiều, nhưng [pivotal_contestant.GetSheHe] cần hành động sớm."
  contest_events.0872.ptv_fallback:0 "Thép chạm thép khi những lưỡi kiếm lại va vào nhau."
  contest_events.0872.spectator:0 "\n\nHai đấu thủ lại xoay quanh nhau, những tia lửa sáng lóe lên dưới ánh ban ngày. Tiếng hít thở dồn dập của đám đông vang lên cùng nhịp với những cú va chạm của lưỡi kiếm."
  contest_events.0872.final:0 "Tiếng gầm, tiếng kim loại va chạm, tiếng hò reo của đám đông. Một bản hợp xướng tàn bạo cho hồi kết của trận đấu này."
  contest_events.0872.winner_start:0 "Ta cảm nhận được chiến thắng, và lao lên giành lấy nó trước khi [versus_contestant.GetFirstName] kịp hồi phục."
  contest_events.0872.loser_start:0 "[versus_contestant.GetFirstName] bất ngờ đổi thế, và ta cảm thấy hồi kết đã cận kề."
  contest_events.0872.winner_yield:0 "[versus_contestant.GetSheHe|U] withers under my flurrying blows, barely keeping form with [versus_contestant.GetHerHis] guards, until at last [versus_contestant.GetSheHe] steps away, yielding."
  contest_events.0872.winner_disarm:0 "I catch the strong of [versus_contestant.GetHerHis] blade with the last of a quick string of blows, breaking [versus_contestant.GetHerHis] grip and sending the weapon spinning into the dirt."
  contest_events.0872.loser_yield:0 "Ta hầu như không thể giữ nổi thế thủ trước những đòn chính xác của [versus_contestant.GetHerHis], thể lực cạn dần. Ta giơ tay xin thua, không muốn kéo dài điều không thể tránh."
  contest_events.0872.loser_disarm:0 "Ta cố giữ thế thủ trước cơn mưa đòn của [versus_contestant.GetHerHis], nhưng cú đánh cuối cùng làm lệch lưỡi kiếm, phá vỡ thế cầm và hất nó xuống đất."
  contest_events.0872.a:0 "Chỉ thêm một đòn nữa..."
  contest_events.0872.b:0 "Chỉ thêm một đòn nữa!"

  contest_events.0873.t:0 "$tournament_contest_header$ Tàn Cuộc"
  contest_events.0873.pivotal_success:0 "Ta không kìm được nụ cười khi đối thủ rơi trọn vào cái bẫy ta đã giăng sẵn. Chỉ vài nước đi sau, ta đã biến sơ hở đó thành lợi thế rõ rệt.\n\n"
  contest_events.0873.pivotal_neutral:0 "Đối thủ phớt lờ cái bẫy ta đặt ra, nhưng ta cũng kịp nhận ra và tránh được bẫy của họ. Vài nước căng thẳng nữa trôi qua mà không bên nào thu được lợi thế. Ván cờ rơi vào thế giằng co khi tiến dần về hồi kết.\n\n"
  contest_events.0873.pivotal_failure:0 "Ngay khi tay rời khỏi quân cờ, ta biết mình đã phạm sai lầm, và cái bẫy tinh vi của đối thủ lập tức khép lại. Chỉ vài nước nữa, ta rơi vào thế bất lợi rõ ràng vì lỗi lầm ấy, bị đẩy vào vị trí ta hoàn toàn không mong muốn.\n\n"
  contest_events.0873.ptv_close:0 "Kết cục của ván đấu thật khó đoán. Khoảng cách chiến thắng mong manh, và cái giá của sai lầm thì quá lớn."
  contest_events.0873.ptv_top:0 "Ta đang dẫn trước khá nhiều. Chỉ cần dồn ép lợi thế này, chiến thắng chắc chắn đang ở phía trước!"
  contest_events.0873.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] đang dẫn trước khá nhiều. Nếu [pivotal_contestant.GetSheHe] tiếp tục dồn ép, chiến thắng chắc chắn sẽ đến!"
  contest_events.0873.ptv_bottom:0 "Ta đang thua, và vị thế xấu đi gần như sau mỗi nước cờ. Để thắng từ đây, có lẽ cần đến một phép màu..."
  contest_events.0873.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] đang thua, và vị thế ngày càng tệ sau mỗi nước cờ. Để lật ngược tình thế, có lẽ cần đến một phép màu..."
  contest_events.0873.ptv_top_half:0 "Ta đang dẫn trước, nhưng chưa thể chắc chắn. Bất kỳ sai lầm nào cũng có thể phải trả giá đắt."
  contest_events.0873.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] đang dẫn trước, nhưng vẫn chưa thể chắc chắn. Một sai lầm nhỏ cũng có thể rất tai hại."
  contest_events.0873.ptv_bottom_half:0 "Ta đang thua, nhưng vị thế vẫn chưa tuyệt vọng. Nếu ta chỉ cần tìm được một sơ hở..."
  contest_events.0873.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] đang thua, nhưng vị thế vẫn chưa tuyệt vọng. Nếu [pivotal_contestant.GetSheHe] tìm được một sơ hở..."
  contest_events.0873.ptv_fallback:0 "Thế cờ ngày càng rối rắm, nhưng đồng thời cũng đơn giản hơn khi các đường đi và chiến lược dần bị chặn lại."
  contest_events.0873.spectator:0 "\n\nNhững cái trán nhíu chặt khi ván đấu không ngừng tiến về phía trước, khán giả giữ im lặng để tránh gây phân tâm; hoặc tệ hơn, vô tình tiết lộ một nước đi có lợi cho người họ ủng hộ."
  contest_events.0873.final:0 "Thêm những tiếng lách cách khẽ khàng, thêm áp lực tinh thần. Tàn cuộc đã thực sự bắt đầu."
  contest_events.0873.winner_start:0 "Chẳng bao lâu sau, rõ ràng là [versus_contestant.GetFirstName] không còn đường lui."
  contest_events.0873.loser_start:1 "Chỉ ít lâu sau, ta cuối cùng cũng nhận ra mối nguy trong vị thế của mình. [versus_contestant.GetFirstName] đã nhử ta ngay từ đầu!"
  contest_events.0873.winner_surprise:0 "[versus_contestant.GetSheHe|U] đã hoàn toàn sập bẫy, không nhận ra cái kết ta đã tính toán kỹ lưỡng. Với một cử chỉ thản nhiên, nước đi cuối cùng của ta đặt xuống bàn."
  contest_events.0873.winner_grind:1 "Ta từng bước nghiền nát [versus_contestant.GetHerHim], không ngừng tiến tới chiến thắng khi vị thế của [versus_contestant.GetHerHis] suy yếu chậm rãi nhưng không thể cứu vãn."
  contest_events.0873.loser_surprise:1 "[versus_contestant.GetSheHe|U] had been baiting me into a trap for half the game, biding [versus_contestant.GetHerHis] time while I blundered. By now, there is no escape."
  contest_events.0873.loser_grind:1 "Mỗi nước cờ ta đi dường như đều là một sự thỏa hiệp, từng chút một thua kém trước lối chơi vượt trội của [versus_contestant.GetHerHis]. Chẳng bao lâu sau, vị thế của ta trở nên không thể cứu vãn."
  contest_events.0873.a:0 "Chỉ còn vài nước nữa..."
  contest_events.0873.b:0 "Chỉ còn vài nước nữa!"
 ## FLAVOR
 # MURDER INTENT
  contest_events.1100.t:0 "$activity_tournament$: Vận May Cuồng Loạn"
  contest_events.1100.desc:0 "Scrambling through the chaotic tumult that engulfs [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], dodging and weaving past friends and foes, I finally spot my [murder_actor.Custom2('RelationToMeShort', murder_target)], [murder_target.GetTitledFirstName], and with [murder_target.GetHerHis] back to me!\n\nI approach unseen, another opponent distracting all [murder_target.GetHerHis] attention; in this thundering noise and swirling chaos, no one is focused on me...\n\nI have you now, [murder_target.Custom2('InsultNoun', ROOT.Char)]!"
  contest_events.1100.a:0 "Đỡ này!"
  contest_events.1100.b:0 "Chuyện này không danh dự..."
  contest_events.1101.t:0 "$contest_events.1100.t$"
  contest_events.1101.desc:0 "Ta lao về phía [murder_target.GetHerHim], thu hẹp khoảng cách, [murder_actor.Custom('signature_weapon')] giơ cao, rồi dốc toàn lực giáng xuống!"
  contest_events.1101.miss:0 "\n\nAt that precise moment, the [murder_target.Custom2('InsultAdjective', ROOT.Char)] fiend dodges a probing thrust from [murder_target.GetHerHis] other foe, and my [murder_actor.Custom('signature_weapon')] hurtles down into the dirt.\n\nI quickly recover, as [murder_target.GetTitledFirstName] howls, "You miserable bastard!" [murder_target.GetHerHis|U] scowling face disappears into the flurry as we both jump to our respective defenses."
  contest_events.1101.wound:0 "\n\n[murder_target.GetSheHe|U] moves slightly, just as my blow connects with [murder_target.GetHerHis] helmet, sending my [murder_actor.Custom('signature_weapon')] glancing off at an angle.\n\n[murder_target.GetTitledFirstName] howls in pain turning towards me, [murder_target.GetHerHis] eyes widening in recognition.\n\nI hear [murder_target.GetHerHim] groan "Dirty [murder_actor.Custom2('InsultNoun', SCOPE.sC('murder_target'))]" before [murder_target.GetSheHe] keels over, and the storm of the melee separates us."
  contest_events.1101.kill:0 "\n\nMy strike connects perfectly with [murder_target.GetHerHis] helmet, which rings like a bell as the [murder_target.Custom2('InsultNoun', ROOT.Char)] keels over into the dirt like a sack of potatoes.\n\n[murder_target.GetHerHis|U] opponent growls his thanks at me, before a look of concern spreads across his face. I glimpse [murder_target.GetTitledFirstNamePossessive] eyes as the heaving mass separates us; they show no recognition."
  contest_events.1101.a:0 "\"Coi chừng sau lưng, [murder_target.Custom2('InsultNoun', ROOT.Char)]!\""
  contest_events.1101.b:0 "\"Ngươi gặp may rồi, [murder_target.Custom2('InsultNoun', ROOT.Char)]!\""
  contest_events.1101.c:0 "\"[murder_target.Custom2('InsultNoun', ROOT.Char)]!\""
  contest_events.1102.t:0 "$contest_events.1100.t$"
  contest_events.1102.desc:0 "Bị vây quanh bởi Ngài lẫn thù, ta cố giữ tỉnh táo trong cơn hỗn chiến đang xoáy cuộn qua [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], đỡ những đòn đánh nhắm vào ta từ một đối thủ quyết liệt."
  contest_events.1102.miss:0 "\n\nAs I dodge one such thrust, a [murder_actor.Custom('signature_weapon')] whooshes down from behind, missing me by inches. Putting distance between both my adversaries, I see the weapon belongs to none other than [murder_actor.GetTitledFirstName], whose scowling face melts now into the crowd!"
  contest_events.1102.wound:0 "\n\nTa bất ngờ trúng một cú đánh vụng về nhưng đầy quyết tâm từ phía sau, trượt qua mũ trụ khiến ta loạng choạng.\n\nKhi quay lại, gào lên đau đớn, ta thấy [murder_actor.GetTitledFirstName], rõ ràng khó chịu vì [murder_actor.GetSheHe] chưa gây được nhiều sát thương hơn, rồi biến mất vào khối hỗn loạn, trước khi ta gục xuống."
  contest_events.1102.kill:0 "\n\nKhoảnh khắc tiếp theo, giác quan của ta tê liệt, tai ù đi. Mặt đất chậm rãi lao tới khi ta đổ sập xuống, nằm xoài trên nền đất gồ ghề. Ta thoáng thấy gương mặt của [murder_actor.GetSheHe], nhưng không kịp hiểu gì trước khi thế giới chìm vào bóng tối."
  contest_events.1102.a:0 "Đồ khốn nạn!"
  contest_events.1102.b:0 "Đồ [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] bẩn thỉu!"
  contest_events.1102.c:0 "#weak *ọc ọc*#!"
  contest_events.1110.t:1 "Cơ Hội Ra Tay"
  contest_events.1110.desc:1 "Ta đã kiên nhẫn chờ đợi cơ hội để hạ sát [murder_target.GetTitledFirstName], và giờ thì khoảnh khắc ấy có lẽ đã đến.\n\n[activity.GetCurrentPhase.GetPhase.GetName] sẽ là vỏ bọc hoàn hảo cho một tai nạn nho nhỏ..."
  contest_events.1110.a:0 "Né #EMP cái này#!!"
  contest_events.1110.b:0 "Thế này là quá đáng!"
  contest_events.1131.t:1 "$tournament_contest_header$ Tử Chiến"
  contest_events.1131.team:0 "Dù [ROOT.Char.Custom2('RelationToMeShort', portrait_scope)] của ta, [portrait_scope.GetTitledFirstName] – tên [portrait_scope.Custom2('InsultNoun', ROOT.Char)] ấy – được xếp chung đội với ta trong trận hỗn chiến, khi ta rút vào một con hẻm để lấy lại hơi thở và phát hiện mình đơn độc cùng [portrait_scope.GetHerHim], cả hai đều hiểu rõ nhau."
  contest_events.1131.enemy:0 "Chạy xuyên qua [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], trinh sát phía trước đội mình, ta rẽ qua một góc và chạm mặt [ROOT.Char.Custom2('RelationToMeShort', portrait_scope)] của ta, [portrait_scope.GetTitledFirstName], kẻ giữ cùng vai trò nhưng ở phe đối địch."
  contest_events.1131.desc:0 "\n\nTa thấy trong ánh nhìn của [portrait_scope.GetHerHis] cùng một quyết tâm – cùng một thù hận – mà [portrait_scope.GetSheHe] hẳn cũng thấy trong mắt ta...\n\nChỉ có một lối thoát cho chuyện này."
  contest_events.1131.win:0 "Ngươi đánh bại [portrait_scope.GetFirstNameNoTooltip]"
  contest_events.1131.lose:0 "[portrait_scope.GetFirstNameNoTooltip] đánh bại ngươi"
  contest_events.1131.a:0 "#EMP Chết đi!#!"
  contest_events.1131.b:0 "Aaaaargh!"
  contest_events.1131.b.flavor:0 "#EMP CHẠY ĐIIIIII!#!"
  contest_events.1133.t:0 "$contest_events.1131.t$"
  contest_events.1133.fled_both:0 "Ta quay lưng bỏ chạy nhanh nhất có thể, gào lên để thu hút sự chú ý của đội mình.\n\nChỉ đến cuối con phố ta mới ngoái lại và thấy [portrait_scope.GetFirstName] ở đằng xa, cũng xấu hổ chẳng kém gì ta.\n\nTa sẽ không nói gì nếu [portrait_scope.GetSheHe] cũng vậy..."
  contest_events.1133.chase_team:0 "Chưa kịp phản ứng, [portrait_scope.GetFirstName] đã phá vòng vây, lao về lối ra và the thé gọi đồng đội trợ giúp."
  contest_events.1133.chase_enemy:0 "Before I can react, [portrait_scope.GetFirstName] makes a break for the exit, crying shrilly for [portrait_scope.GetHerHis] teammates help."
  contest_events.1133.fled_team:0 "Ta lao về lối ra, chạy thẳng về phía đội mình, tìm sự an toàn sau những tấm khiên của họ."
  contest_events.1133.fled_enemy:0 "Ta lao về lối ra, cắm đầu chạy về phía đồng đội và gào gọi sự yểm trợ."
  contest_events.1133.fled:0 "\n\nĐến cuối con phố ta ngoái lại và thấy [portrait_scope.GetFirstName] đã bỏ cuộc; [portrait_scope.GetSheHe] thở hổn hển, trừng mắt nhìn ta."
  contest_events.1133.chase:0 "\n\n[portrait_scope.GetSheHe|U] is faster than [portrait_scope.GetSheHe] looks, and is away at the end of the street when I give up, panting..."
  contest_events.1133.fight:0 "Đọc được ý nghĩ của nhau, cả hai cùng lao vào, kiếm của [portrait_scope.GetFirstNamePossessive] và của ta cắn xé dữ dội khi chúng ta liên tục đỡ và phản công."
  contest_events.1133.nothing:0 "\n\nCuộc ẩu đả nhanh chóng bị chấm dứt khi những người khác kéo tới, để lại chúng ta trừng mắt nhìn nhau qua con hẻm."
  contest_events.1133.wound_self_fled:0 "\n\n[portrait_scope.GetSheHe|U] rạch trúng ta ngay trước khi ta kịp thoát khỏi tầm với, nhưng may mắn thay đó là tất cả những gì [portrait_scope.GetSheHe] làm được..."
  contest_events.1133.wound_self:0 "\n\nTên [portrait_scope.Custom2('InsultNoun', ROOT.Char)] chiếm thế thượng phong, rạch trúng ta khi ta mất cảnh giác trước khi những người khác tới."
  contest_events.1133.wound_enemy_fled:0 "\n\nI only manage to nick [portrait_scope.GetHerHim] before [portrait_scope.GetSheHe] is out of reach, hobbling towards [portrait_scope.GetHerHis] comrades, the coward..."
  contest_events.1133.wound_enemy:0 "\n\nAs the sparks fly, I spot an opportunity, nicking [portrait_scope.GetHerHi] forcefully before [portrait_scope.GetSheHe] recovers, though the others arrive before we can continue..."
  contest_events.1133.kill_fled:0 "\n\nKhi tên [portrait_scope.Custom2('InsultAdjective', ROOT.Char)] quay đầu bỏ chạy, [portrait_scope.GetSheHe] trượt chân ngã sấp xuống đất. Mọi chuyện kết thúc trước khi tiếng cầu xin tha mạng của [portrait_scope.GetHerHis] kịp thoát ra trọn vẹn..."
  contest_events.1133.kill:0 "\n\nCuộc đụng độ điên cuồng của chúng ta leo thang như một cơn bão, thép va chạm chan chát và tia lửa bắn tung. Khi di chuyển, ta bất ngờ chiếm được vị trí cao, và cả hai đều biết rằng mọi thứ đã kết thúc — nhanh như lúc nó bắt đầu."
  contest_events.1133.a.both_fled:0 "Khụ."
  contest_events.1133.a.wound:0 "Ngươi gặp may đấy! Ta sẽ xử ngươi!"
  contest_events.1133.a.kill:0 "Mọi chuyện đã kết thúc."
  contest_events.1133.a:0 "Suýt nữa thì..."
 ### ARCHERY ###
 # TRAGEDY
  contest_events.1520.t:1 "$tournament_contest_header$ Bi Kịch Tại Bãi Bắn"
  contest_events.1520.opening:0 "Ta bước lên vạch bắn, rút một mũi tên khỏi thùng, cẩn thận kéo cung và ngắm dọc theo thân tên về phía mục tiêu xa.\n\nNgay khoảnh khắc ta buông tay, một bóng người bất ngờ xuất hiện phía sau bia!"
  contest_events.1520.skilled:0 "Mũi tên bay thẳng, lao thẳng về phía họ!\n\n"
  contest_events.1520.unskilled:0 "Mũi tên đi chệch, chắc chắn trượt, nhưng lại lệch hẳn về phía họ!\n\n"
  contest_events.1520.desc:1 "Tiếng kinh hãi vang lên từ khán giả, và sau khoảng thời gian tưởng như vô tận, thân người ấy gục xuống, rên rỉ yếu ớt. Một cận vệ nhanh chóng xác nhận điều tồi tệ nhất: người nông dân đã chết — không có điểm cho mũi tên #EMP đó#!..."
  contest_events.1520.a:0 "Gia đình họ sẽ được chăm lo."
  contest_events.1520.b:0 "Đừng để chuyện này làm hỏng cuộc vui."
  contest_events.1520.c:0 "Có lẽ ta bắn cung thế là đủ rồi..."
  contest_events.1521.t:0 "$contest_events.1520.t$"
  contest_events.1521.desc:0 "[contestant.GetTitledFirstName] steps up to the line, pulls an arrow from the barrel, and carefully draws [contestant.GetHerHis] bow, one eye cocked, feeling [contestant.GetHerHis] way to the target.\n\nAt the very moment [contestant.GetSheHe] looses, a silhouette suddenly emerges from behind the butt!\n\n"
  contest_events.1521.resigned:0 "\n\n[contestant.GetFirstNameNoTooltip] đã tự nguyện rút khỏi cuộc thi bắn cung, để tỏ lòng kính trọng với số phận bất hạnh."
  contest_events.1521.dismissed:0 "\n\n[contestant.GetFirstNameNoTooltip] nhanh chóng gạt bỏ tai nạn, nôn nóng chờ đến lượt bắn tiếp theo."
  contest_events.1521.compensated:0 "\n\n[contestant.GetFirstNameNoTooltip] paid a small allowance out of [contestant.GetHerHis] own purse, for the family of the bereaved."
  contest_events.1521.a:0 "Thật bi thảm."
 # NAIL
  contest_events.1530.t:1 "$tournament_contest_header$ Trúng Đinh"
  contest_events.1530.desc:0 "Ta giật dây cung vài lần để làm nóng, rồi hít một hơi thật sâu.\n\nDồn toàn bộ sự kiểm soát, ta kéo cung lên cao rồi từ từ hạ xuống thẳng hàng với mục tiêu. Ngay khi mũi tên rời khỏi đầu ngón tay, ta theo bản năng biết rằng cú bắn này rất tốt.\n\nChỉ chốc lát sau, một tiếng keng thỏa mãn vang lên: ta đã bắn trúng chiếc đinh ngay chính giữa mục tiêu!"
  contest_events.1530.a:0 "Tuyệt!"
  contest_events.1531.t:0 "$contest_events.1530.t$"
  contest_events.1531.desc:0 "[contestant.GetTitledFirstName] giật dây cung vài lần để làm nóng, rồi hít một hơi thật sâu.\n\nDồn toàn bộ sự kiểm soát của [contestant.GetHerHis], [contestant.GetSheHe] kéo cung lên cao rồi từ từ hạ xuống thẳng hàng với mục tiêu. Ngay khi mũi tên rời khỏi đầu ngón tay của [contestant.GetHerHis], rõ ràng đó là một cú bắn xuất sắc.\n\nChỉ chốc lát sau, một tiếng keng thỏa mãn vang lên: [contestant.GetSheHe] đã bắn trúng chiếc đinh ngay chính giữa mục tiêu!"
  contest_events.1531.a:0 "Gặp may thật..."
 # BAD DAY
  contest_events.1540.t:1 "$tournament_contest_header$ Ngày Xui Xẻo"
  contest_events.1540.desc:0 "Ta tự tin lấy một mũi tên, đứng vào vị trí trước mục tiêu và cảm nhận bầu không khí. Đám đông im lặng khi ta chỉnh tư thế và đặt tên.\n\nMũi đầu tiên trượt sát trong gang tấc, cắm vào bia đất. Mũi thứ hai vút xa hàng dặm khỏi mục tiêu. Mũi thứ ba rơi cách ta vài thước, do buông tay quá tệ.\n\n"
  contest_events.1540.unskilled:0 "Đám đông khúc khích cười khi ta quay lại, khó giấu được sự bực bội. Ta cần luyện tập thêm..."
  contest_events.1540.sabotage:0 "Ta thật sự không hiểu! Khi luyện tập ta vẫn bắn trúng. Trừ khi... ta nghi ngờ nhìn cây cung của mình..."
  contest_events.1540.a:0 "Đành chịu vậy."
  contest_events.1541.t:0 "$contest_events.1540.t$"
  contest_events.1541.desc:0 "[contestant.GetTitledFirstName] confidently collects an arrow, taking [contestant.GetHerHis] place before the target. The crowd hushes as [contestant.GetSheHe] perfects [contestant.GetHerHis] stance and nocks.\n\nThe first shot misses by a hairsbreadth, embedding in the earthen butt. The second whistles miles over the target. The third falls a few yards from [contestant.GetHerHim], sprung by a poor release.\n\n"
  contest_events.1541.unskilled:0 "Đám đông khúc khích cười khi [contestant.GetSheHe] quay lại, khó giấu được sự bực bội của [contestant.GetHerHis]. [contestant.GetSheHe|U] cần luyện tập thêm!"
  contest_events.1541.sabotage:0 "[contestant.GetTitledFirstNameNoTooltip] is clearly at a loss. "I just don't understand! I'm not nearly as bad as that!" [contestant.GetSheHe] mewls, checking [contestant.GetHerHis] bow suspiciously."
  contest_events.1541.a:0 "Chuyện cũng hay xảy ra."
 # MYSTERIOUS
  contest_events.1550.t:1 "$tournament_contest_header$ [contestant.GetFirstNameNoTooltip] Đội Mũ Trùm"
  contest_events.1550.desc:1 "The crowd hushes as [contestant.GetTitledFirstName] nocks [contestant.GetHerHis] first arrow, fascinated to see whether this [contestant.GetWomanMan] is as good as the rumors circulating the tourney grounds suggest.\n\n"
  contest_events.1550.good:0 "Not even the wildest rumors could have lived up to [contestant.GetHerHis] performance; like a dance, the [contestant.GetWomanMan] sends each arrow effortlessly into the center of the target, splitting [contestant.GetHerHis] own shafts and driving the crowd wild."
  contest_events.1550.normal:1 "Bỏ qua mọi lời bàn tán, [contestant.GetHerHis] chỉ là một cung thủ tầm thường. Không thể chê trách [contestant.GetHerHim], nhưng điểm số của [contestant.GetHerHis] chẳng có gì đáng khoe, ngang bằng với những thí sinh ít luyện tập nhất."
  contest_events.1550.bad:0 "Khán giả vô cùng thất vọng trước màn bắn đầy trượt và sai sót. Người ta hoàn toàn có thể nghi ngờ rằng [contestant.GetWomanMan] này từng cầm cung bao giờ chưa, chứ đừng nói là sử dụng nó."
  contest_events.1550.a:0 "Hoan hô!"
  contest_events.1550.a.good:0 "Ngoạn mục."
  contest_events.1550.a.bad:0 "Thất vọng."
  contest_events.1550.b:0 "Ta phải gặp [contestant.GetHerHim]!"
  contest_events.1550.b.tt:0 "Ngài sẽ tìm cách trò chuyện với [contestant.GetFirstName]"
  contest_events.1550.c:0 "Hừm."
  contest_events.1550.d:0 "Rõ ràng có kẻ đã trêu đùa chúng ta."
  contest_events.1553.t:1 "$contest_events.1550.t$"
  contest_events.1553.desc:0 "Khi [contestant.GetFirstName] được các hầu cận đưa tới, [marshal.GetTitledFirstName] đột ngột quát lên: \"Này! Ta biết ngươi! Bắt hắn lại!\"\n\n\"Tên [contestant.GetWomanMan] này là thủ lĩnh của một toán thảo khấu địa phương, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [marshal.GetFirstName] sùi bọt mép, \"Chúng ẩn náu trong vùng [activity.GetCurrentPhase.GetLocation.GetTerrain.GetNameNoTooltip|l], trộm gia súc và cướp bóc lữ khách vô tội.\"\n\n\"Dối trá!\" tên cung thủ phun ra đầy thách thức, \"Bọn ta lấy của người giàu trả lại cho chủ nhân thực sự: nhân dân!\""
  contest_events.1553.a:0 "Tống giam [contestant.GetHerHim]!"
  contest_events.1553.b:0 "Xử tử công khai là đủ."
  contest_events.1553.c:0 "Ngươi được ân xá, [contestant.GetFirstNameNoTooltip], đừng lãng phí cơ hội này."
  contest_events.1553.d:0 "Trả giá cho tội lỗi của ngươi — bằng việc phục vụ ta."
  contest_events.1554.t:1 "$contest_events.1550.t$"
  contest_events.1554.desc:0 "Các hầu cận ta phái đi tìm [contestant.GetFirstName] trở về trong bối rối.\n\nCó vẻ như tay cung thủ đã vội vã rời khỏi bãi đấu ngay khi [contestant.GetHerHis] mũi tên dùng hết — từ đó đến nay không còn dấu vết gì của [contestant.GetHerHim]..."
  contest_events.1554.a:0 "Cái quái gì vậy..."
 ### HORSE RACE ###
  contest_events.3000.t:1 "$tournament_contest_header$ Va Chạm Liên Hoàn"
  contest_events.3000.desc:3 "Kỵ sĩ của [contestant_1.GetFirstNamePossessive] đang xé gió lao dọc theo đường đua.\n\nVào khoảnh khắc cuối cùng, họ bất cẩn lệch sang một bên, trượt dài trong đất cát, khiến các kỵ sĩ cưỡi ngựa của [contestant_2.GetFirstName] và [contestant_3.GetFirstNamePossessive] không kịp dừng lại!\n\nTiếng rên rỉ đồng loạt của đám đông vang lên còn nhanh hơn cả lúc ba con ngựa và kỵ sĩ của chúng đâm sầm vào nhau.\n\n"
  contest_events.3000.a:0 "Đau thật."
  contest_events.3000.b:0 "\"[contestant_1.GetFirstNameNoTooltip]! Sao ngươi lại để chuyện này xảy ra được chứ?!\""
  contest_events.3010.t:0 "$tournament_contest_header$ Tay Đua Vụng Về"
  contest_events.3010.desc:1 "Quan sát kỵ sĩ của [enemy_competitor.GetNamePossessive] cưỡi ngựa chẳng khác nào nhìn một tảng đá lăn qua quảng trường làng. Hắn cưỡi ngựa như một kẻ điên loạn, và không may thay, kỵ sĩ của ta là [jockey.GetFirstName] đã trở thành nạn nhân của lối đua hung hãn và vụng về ấy.\n\nVới một tiếng hí đau đớn cùng cú va chạm nặng nề, con ngựa của ta bị hất mạnh vào bờ tường đường đua, và ta chắc chắn rằng chân của [jockey.GetFirstNamePossessiveNoTooltip] đã bị thương."
  contest_events.3010.a:0 "\"Rõ ràng chuyện này vi phạm luật lệ!\""
  contest_events.3010.a.success:0 "Ngài thuyết phục được trọng tài trừng phạt tay đua"
  contest_events.3010.a.failure:0 "Ngài không thuyết phục được trọng tài"
  contest_events.3010.b:0 "Ta sẽ bỏ qua."
  contest_events.3020.t:0 "$tournament_contest_header$ Tay Đua Được Lòng Người"
  contest_events.3020.desc:0 "Among the commoners attending the race, it is no secret who holds their favor. Peasants look upon [enemy_competitor.GetNamePossessive] rider with equal parts amour and admiration. They swoon as the horses thunder past and cheer as [enemy_competitor.GetFirstNameNoTooltip] lauds [enemy_competitor.GetHerHis] rider to the crowd. [enemy_competitor.GetSheHe|U] watches the race smugly, knowing [enemy_competitor.GetHerHis] rider has the undivided support of the crowd.\n\nI wonder: perhaps with the right encouragement, I may be able to turn the crowd's attention to #EMP my#! rider [jockey.GetFirstName] instead?"
  contest_events.3020.a:0 "\"Hãy nhìn xem! Kỵ sĩ cao quý của ta đây!\""
  contest_events.3020.a.success:0 "Ngài khiến đám đông ủng hộ kỵ sĩ của mình"
  contest_events.3020.a.failure:0 "Đám đông không mấy ấn tượng"
  contest_events.3020.b:0 "\"Ngươi thật biết cách chọn người đấy, [enemy_competitor.GetFirstNameNoTooltip].\""
  contest_events.3020.c:0 "Ta sẽ gặp [enemy_competitor.GetHerHim] sau cuộc đua để có một cú ngã đáng nhớ."
  contest_events.3030.t:0 "$tournament_contest_header$ Như [ROOT.Char.GetFaith.CreatorName|U] Sinh Ra [naked_peasant.GetHerHim|U]"
  contest_events.3030.desc:0 "Khi những con ngựa chuẩn bị xuất phát, toàn bộ khán đài đang hò reo và hô vang tên tay đua yêu thích của mình. Cho đến khi tất cả đồng loạt há hốc mồm rồi chìm vào im lặng hoàn toàn. Một [naked_peasant.GetWomanMan] trần truồng lao ra đường đua và phô bày tất cả những gì mà [ROOT.Char.GetFaith.CreatorName|U] đã ban cho [naked_peasant.GetHerHim] từ đầu đến chân.\n\nĐám đông lập tức bắt đầu la ó sinh vật bốc đồng này và ném bất cứ thứ gì họ cầm được vào [naked_peasant.GetHerHim]."
  contest_events.3030.a:0 "Thật ghê tởm! Lính gác đâu!"
  contest_events.3030.b:0 "Ha! Một màn trình diễn thật đã mắt!"
  contest_events.3030.c:0 "Ta sẽ tham gia cùng [naked_peasant.GetHerHim]! Trông vui đấy!"
  contest_events.3030.d:0 "Khỏa thân không phải là tội lỗi!"
  contest_events.3030.a.success:0 "Ngài thuyết phục được đám đông"
  contest_events.3030.a.failure:0 "Đám đông không lay chuyển"
  contest_events.3030.e:0 "Cho ngựa giẫm chết [naked_peasant.GetHerHim]."
 ### JOUST ###
 # BOUTS
  contest_events.0840.t:0 "[activity.GetCurrentPhase.GetPhase.GetName] Đối Đấu"
  contest_events.0840.desc:0 "[versus_contestant.GetTitledFirstName] và ta giao chiến!"
  contest_events.0840.a:0 "Võ Lực"
  contest_events.0840.b:0 "Âm Mưu"
  contest_events.0840.c:0 "Học Thức"
  contest_events.0841.t:0 "[activity.GetCurrentPhase.GetPhase.GetName] Đối Đấu: [activity.Custom('GetVersusRound')]"
  contest_events.0841.desc:1 "Sau khi [versus_contestant.GetTitledFirstName] và ta hoàn thành lượt đối đấu cuối cùng, ta nín thở chờ điểm số được công bố...\n\n"
  contest_events.0841.winner:0 "Ta đã đánh bại [versus_contestant.GetTitledFirstName]!"
  contest_events.0841.loser:1 "Các trọng tài sớm tuyên bố rằng [versus_contestant.GetTitledFirstNameNoTooltip] đã đánh bại ta!"
  contest_events.0841.qualify_win:0 "\n\nTa đã lọt vào bán kết [activity.GetCurrentPhase.GetPhase.GetName]!"
  contest_events.0841.qualify:0 "\n\n[contest_winner.GetSheHe|U] đã lọt vào bán kết [activity.GetCurrentPhase.GetPhase.GetName]!"
  contest_events.0841.semi_win:0 "\n\nTa đã lọt vào chung kết [activity.GetCurrentPhase.GetPhase.GetName]!"
  contest_events.0841.semi:0 "\n\n[contest_winner.GetSheHe|U] đã lọt vào chung kết [activity.GetCurrentPhase.GetPhase.GetName]!"
  contest_events.0841.final_win:0 "\n\nTa đã giành chiến thắng trong cuộc thi [activity.GetCurrentPhase.GetPhase.GetName]!"
  contest_events.0841.final:0 "\n\n[contest_winner.GetSheHe|U] đã chiến thắng cuộc thi [activity.GetCurrentPhase.GetPhase.GetName]!"
  contest_events.0841.a:0 "Trận đấu hay lắm."
  contest_events.0841.b:0 "Khốn thật..."
  contest_events.0841.c:0 "[contest_winner.GetSheHe|U] đã gian lận! Loại!"
  contest_events.0850.t:0 "$contest_events.0840.t$"
  contest_events.0850.desc:0 "$contest_events.0840.t$"
  contest_events.0850.a:0 "$contest_events.0840.t$"
  contest_events.0852.t:0 "$contest_events.0840.t$"
  contest_events.0852.desc:0 "Ối trời, ai thắng vậy?"
  contest_events.0852.a:0 "Được thôi"
  contest_events.0853.t:0 "$contest_events.0852.t$"
  contest_events.0853.desc:0 "$contest_events.0852.desc$"
  contest_events.0853.a:0 "$contest_events.0852.a$"
  contest_events.0910.t:1 "$tournament_contest_header$ Mất Kiểm Soát"
  contest_events.0910.melee:0 "Máu trong người ta sôi sục khi chứng kiến các hiệp sĩ đấu tập nghiền nát đối thủ, trong khi từng cơ hội giành vinh quang của ta lại bị cướp mất bởi đồng đội hoặc những pha rút lui vội vã.\n\nCuối cùng, [wrathful_victim.GetTitledFirstName] ngã nhào xuống bùn ngay dưới chân ta, mất thăng bằng sau một đòn tấn công quá liều lĩnh, thanh kiếm văng ra ngoài tầm với.\n\n\"Ngươi suýt nữa thì chém trúng đầu ta rồi!\" ta gầm lên, trừng mắt nhìn [wrathful_victim.GetHerHim]. Tên ngu xuẩn ấy giờ đã nằm trong tay ta."
  contest_events.0910.wrestling:0 "[wrathful_victim.GetTitledFirstName] và ta đã xoay vòng quanh nhau tưởng chừng như vô tận, phơi mình dưới cái nắng trưa gay gắt.\n\nMỗi lần ta ra tay, [wrathful_victim.GetSheHe] lại trượt khỏi vòng khống chế của ta vào phút chót, và ta đang gần như mất hết kiên nhẫn.\n\nNgay khi ta chuẩn bị lao vào tên khốn đó, [wrathful_victim.GetFirstNameNoTooltip] vấp ngã, hoàn toàn để lộ sơ hở cho một đòn tấn công."
  contest_events.0910.duel:0 "$contest_events.0910.melee$"
  contest_events.0910.a:0 "Ta sẽ cho ngươi một bài học, đồ khốn kiếp bé mọn...!"
  contest_events.0910.b:0 "Đứng dậy đi, đồ nhãi!"
  contest_events.0911.t:0 "$contest_events.0910.t$"
  contest_events.0911.wrathful:0 "Ta buông mình theo cơn thịnh nộ, không ngừng giáng đòn lên [wrathful_victim.GetFirstName] khi [wrathful_victim.GetSheHe] cố gắng chịu đựng cơn mưa đòn của ta.\n\n"
  contest_events.0911.melee:0 "Cuộc [activity.GetCurrentPhase.GetPhase.GetName|l] đột ngột dừng lại, khi tất cả mọi người sững sờ chứng kiến [wrathful_contestant.GetFirstName] gầm lên rồi quật ngã [wrathful_victim.GetFirstName] xuống đất, điên cuồng nện [wrathful_victim.GetHerHim].\n\n"
  contest_events.0911.wrestling:0 "Chưa lâu sau khi hiệp [activity.GetCurrentPhase.GetPhase.GetName|l] bắt đầu, [wrathful_contestant.GetTitledFirstName] đã phát điên vì [wrathful_victim.GetTitledFirstName], hoàn toàn mất kiểm soát và vật [wrathful_victim.GetHerHim] xuống đất.\n\n"
  contest_events.0911.duel:0 "$contest_events.0911.melee$"
  contest_events.0911.dead:0 "Chỉ đến khi ta bị kéo ra và màn sương đỏ trong đầu tan biến, ta mới nhận ra mình đã đi quá xa..."
  contest_events.0911.wound:0 "Khi ta bị lôi khỏi [wrathful_victim.GetHerHim], rõ ràng là [wrathful_victim.GetSheHe] đang phải chịu cơn đau dữ dội."

  contest_events.0911.angry_host:1 "Chuyện này không thể chấp nhận được!"
  contest_events.0911.host:1 "Thật đáng tiếc."
  contest_events.0911.a.dead:0 "Một bi kịch đáng buồn..."
  contest_events.0911.a.wound:0 "Ngươi sẽ không sớm quên chuyện này đâu!"
  contest_events.0911.a:0 "Đó là cách của kẻ mạnh."
  contest_events.0911.c.dead:0 "Một phản ứng công bằng..."
  contest_events.0911.c:0 "Ghê thật..."
  contest_events.0912.dead:0 "Khi [wrathful_contestant.GetFirstNameNoTooltip] cuối cùng cũng bị kéo ra, thì đã quá muộn — [wrathful_victim.GetFirstNameNoTooltip] đã chết rồi..."
  contest_events.0912.wound:0 "Khi [wrathful_contestant.GetFirstNameNoTooltip] bị lôi khỏi [wrathful_victim.GetHerHim], rõ ràng là [wrathful_victim.GetFirstNameNoTooltip] đang phải chịu cơn đau dữ dội."
  contest_events.0912.b:0 "Những hành vi quá đà như vậy là không thể chấp nhận."
  contest_savagely_pummeled_log_title:0 "Đánh Đập Dã Man"
  contest_savagely_pummeled_log:1 "[CHARACTER.GetTitledFirstName] đã đánh đập dã man [TARGET_CHARACTER.GetTitledFirstName]"
  contest_savagely_pummeled_death_log_title:0 "$contest_savagely_pummeled_log_title$"
