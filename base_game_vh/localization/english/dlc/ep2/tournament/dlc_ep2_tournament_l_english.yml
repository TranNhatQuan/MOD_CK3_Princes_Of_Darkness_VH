 ##### TOURNAMENT #####

 ### DECISIONS
  train_for_tournament_decision_name:0 "Luyện tập cho Giải đấu"
  train_for_tournament_decision_desc:0 "Tiếng gọi của thép không thể bị phớt lờ: ta sẽ khoác trang bị và đến bãi huấn luyện để rèn luyện."
  train_for_tournament_decision_tooltip:0 "Rèn luyện [prowess|E] cho một [GetActivityType('activity_tournament').GetName] sắp tới"
  train_tournament_decision.tt:0 "Ngài và các $knight_culture_player_plural$ của mình sẽ mài giũa kỹ năng. Nếu thành công, điều này sẽ tăng [prowess|E] của Ngài cho các nội dung võ thuật trong một [GetActivityType('activity_tournament').GetName] sắp tới."
  train_for_tournament_decision_confirm:0 "Bắt đầu luyện tập"
  grand_tournament_active:0 "Phải tồn tại một [GetActivityType('activity_tournament').GetName] mà Ngài có thể tham gia"
 
  ep2_decision_events.0001.t:0 "Huấn luyện Giải đấu"
  ep2_decision_events.0001.desc:0 ""Và rồi ngươi rẽ sang phải!" [marshal.GetTitledFirstName] hét lên, đồng thời giáng một cú mạnh vào kiếm của ta khiến ta phải lùi lại vài bước. "Trong giải đấu họ sẽ không nương tay với ngài đâu, [ROOT.Char.Custom('FormOfAddressForLiege')]," [marshal.GetSheHe] nói, vừa lau mồ hôi trên trán [marshal.GetHerHis].\n\n"Nếu muốn chiến thắng, ngài không được phép thua. Kể cả với ta. Dù chỉ một lần.""
  ep2_decision_events.0001.a:0 ""#EMP Arghhhh!#!""
  ep2_decision_events.0001.a.crit_success:0 "Buổi luyện tập #EMP xuất sắc#!"
  ep2_decision_events.0001.a.success:0 "Buổi luyện tập rất ấn tượng"
  ep2_decision_events.0001.a.failure:0 "Buổi luyện tập thành công"
  ep2_decision_events.0001.a.crit_failure:0 "Ngài bị thương"
  ep2_decision_events.0001.a.knight_fail:0 "Buổi luyện tập không thành công"
  ep2_decision_events.0001.b:0 "Văn hóa này còn nhiều điều hơn là chỉ luyện tập."
  ep2_decision_events.0001.b.tt:0 "$tradition_tournament_discount_desc$"
  tournament_training_decision_modifier:0 "Được Huấn luyện Kỹ lưỡng"
  tournament_training_decision_modifier_desc:0 "Nhân vật này đã luyện tập cho một [GetActivityType('activity_tournament').GetName] sắp tới và sẽ bắt đầu với [progress_to_victory|E] cao hơn"
  tradition_tournament_discount_desc:1 "Chuyển sang [culture_tradition|E] $tradition_chivalry_name$ sẽ được giảm 2000 [prestige|E]"

 ### ACTIVITY
  activity_tournament:0 "Đại Giải đấu"
  activity_tournament_plural: "Các Đại Giải đấu"
  activity_tournament_desc:1 "Tổ chức một chuỗi [contests|E] võ thuật hoặc văn hóa lộng lẫy, thu hút các đối thủ từ gần xa đến tranh tài trong các cuộc so tài vì [prizes|E] và [prestige|E]."
  activity_tournament_host_desc: "$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$[GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[acclaimed_knights|E] nhận được [glory|E]"
  activity_tournament_selection_tooltip:1 "Mời các $knight_culture_player_plural$, thần dân và láng giềng  của Ngài đến một quang cảnh tranh tài hoành tráng\n\nPhần thưởng Dự kiến:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E] Gia tăng\n$BULLET_WITH_TAB$[stress_loss_i] [stress|E] Giảm"
  tournament_contest:0 "Cuộc thi"
  progress_to_victory:0 "$game_concept_progress_to_victory$"
  progress_to_victory_desc:0 "$game_concept_progress_to_victory_desc$"
  activity_tournament_destination_selection:0 ""
  activity_tournament_guest_help_text:1 "Mọi [guests|E] sẽ có cơ hội cố gắng đủ điều kiện tham gia một [contest|E] — nếu họ đủ tư cách — và sau đó tranh tài trong [GetActivityType('activity_tournament').GetName].\n\nNhững vị khách không đủ điều kiện có thể dạo quanh các [locales|E] để nhận phần thưởng độc đáo và xem các cuộc thi khi chúng diễn ra."

  tournament_province_jousting_lists_desc:0 "#color_green + Trường Đấu Thương#!"
  tournament_province_gathering_halls_desc:0 "#color_green + Đại Sảnh Tụ họp#!"
  tournament_province_war_camps_desc:0 "#color_green + Trại Chiến tranh#!"
  tournament_province_military_camps_desc:0 "#color_green + Doanh trại Quân sự#!"
  tournament_province_archery_grounds_desc:0 "#color_green + Bãi Bắn Cung#!"
  tournament_province_smithies_desc:0 "#color_green + Lò Rèn#!"
  tournament_province_royal_armories_desc:0 "#color_green + Kho Vũ khí Hoàng gia#!"
  tournament_hall_of_heroes_desc:0 "#color_green + Sảnh Anh hùng#!"
  tournament_barracks_desc:0 "#color_green + Doanh trại#!"
  tournament_regimental_grounds_desc:0 "#color_green + Bãi Luyện Trung đoàn#!"
 
 ### PHASES

 # TEAM
  tournament_phase_melee:0 "Melee"
  tournament_phase_melee_desc:1 "Một trận giả chiến, trên ngựa và dưới bộ, giữa hai đội tranh giành quyền kiểm soát một chiến địa và bắt giữ đối thủ để đòi tiền chuộc.\n\n$tournament_contest_format_team$"
 # TURN
  tournament_phase_archery:0 "Bắn Cung"
  tournament_phase_archery_desc:1 "Một cuộc thi bắn cung trong đó mỗi thí sinh bắn vào bia với số mũi tên cố định, nhằm ghi được càng nhiều điểm càng tốt.\n\n$tournament_contest_formaty_turn$"

  tournament_phase_recital:0 "Ngâm Thơ"

  tournament_phase_recital_desc:1 "Một cuộc thi thơ trong đó mỗi thí sinh công khai ngâm một bài thơ viết cho dịp này và được chấm điểm so với tất cả những người tham gia khác.\n\n$tournament_contest_formaty_turn$"
 # VERSUS
  tournament_phase_joust:0 "Đấu Thương"
  tournament_phase_joust_desc:1 "Một cuộc thi cưỡi ngựa trong đó các thí sinh giao đấu bằng thương, cố gắng hất ngã đối thủ hoặc ghi nhiều điểm hơn để trở thành người trụ lại cuối cùng.\n\n$tournament_contest_format_versus$\nSố [contest_rounds|e]: 3"
  tournament_phase_duel:0 "Đấu Tay Đôi"
  tournament_phase_duel_desc:1 "Một chuỗi các cuộc đấu vũ trang dưới bộ, trong đó các thí sinh cố gắng tước vũ khí hoặc ghi nhiều điểm hơn đối thủ để trở thành người trụ lại cuối cùng.\n\n$tournament_contest_format_versus$\nSố [contest_rounds|e]: 3"
 
  tournament_phase_wrestling:0 "Vật"
  tournament_phase_wrestling_desc:2 "Một cuộc so tài sức mạnh và mưu trí, trong đó các thí sinh cố gắng quật ngã hoặc ném đối thủ ra khỏi sàn để trở thành người trụ lại cuối cùng.\n\n$tournament_contest_format_versus$\nSố [contest_rounds|e]: 3"
  tournament_phase_board_game:0 "Trò chơi Bàn cờ"
  tournament_phase_board_game_desc:1 "Một cuộc đấu trí trong đó các thí sinh chơi một loạt ván cờ, với người chiến thắng cuối cùng là người còn trụ lại sau cùng.\n\n$tournament_contest_format_versus$\nSố [contest_rounds|e]: 3"
 # RACE
  tournament_phase_horse_race:0 "Đua Ngựa"
  tournament_phase_horse_race_desc:1 "Một môn thể thao dành cho khán giả, trong đó các lãnh chúa và quý bà cho ngựa của mình đua với nhau, người chiến thắng là con đầu tiên cán đích.\n\n$tournament_contest_format_race$"

 # CEREMONY
  tournament_phase_ceremony:0 "Nghi lễ"
  tournament_phase_ceremony_desc:0 "Nghi lễ bế mạc và các lễ hội ăn mừng!"

 ### OPTIONS

 # ACCOMMODATIONS
  tournament_option_accommodations:0 "Chỗ ở"
  tournament_accommodations_bad:0 "Lều Trại Tạm Bợ"
  tournament_accommodations_bad_desc:0 "$EFFECT_LIST_BULLET$ Một số sự kiện tiêu cực có khả năng xảy ra cao hơn\n\n#weak Điều gì quan trọng hơn, kỹ năng được phô diễn hay nơi Ngài phô diễn chúng?#!"
  tournament_accommodations_normal:0 "Nhà Lều Đơn Sơ"
  tournament_accommodations_normal_desc:0 "$EFFECT_LIST_BULLET$ Trọng số sự kiện không bị ảnh hưởng\n\n#weak Chìa khóa của một cuộc so tài ra hồn là một giấc ngủ ngon.#!"
  tournament_accommodations_good:0 "Doanh Trại Xa Hoa"
  tournament_accommodations_good_desc:0 "$EFFECT_LIST_BULLET$ Một số sự kiện tiêu cực #EMP ít#! có khả năng xảy ra hơn\n\n#weak Giải đấu nên là nhiều hơn một sự kiện thể thao đơn thuần, mà là cả một #underline trải nghiệm#! thể thao trọn vẹn.#!"
 # PRIZES
  tournament_option_prizes:0 "Giải thưởng"
  tournament_prizes_bad:1 "Giải thưởng Đơn Giản"
  tournament_prizes_bad_desc:1 "$EFFECT_LIST_BULLET$ [artifacts|E] làm giải thưởng sẽ có [rarity|E] Thường\n\n#weak Chúng ta đến đây vì tình yêu thể thao, những món đồ lấp lánh chỉ là cái cớ.#!"
  tournament_prizes_normal:2 "Giải thưởng Khá"
  tournament_prizes_normal_desc:1 "$EFFECT_LIST_BULLET$ [artifacts|E] làm giải thưởng sẽ có [rarity|E] Thường hoặc Tinh xảo\n\n#weak Dù không đến đây vì giải thưởng, nhưng có tiền cho chuyến về nhà vẫn là mục tiêu rất thực tế.#!"
  tournament_prizes_good:2 "Giải thưởng Chất lượng"
  tournament_prizes_good_desc:1 "$EFFECT_LIST_BULLET$ [artifacts|E] làm giải thưởng sẽ có [rarity|E] Tinh xảo hoặc Danh tiếng\n\n#weak Không có đặt cược, thì thi đấu để làm gì?#!"
  tournament_prizes_very_good:0 "Giải thưởng Tốt"
  tournament_prizes_very_good_desc:0 "$EFFECT_LIST_BULLET$ [artifacts|E] làm giải thưởng sẽ có [rarity|E] Tinh xảo, Danh tiếng, hoặc Lừng lẫy\n\n#weak Giải thưởng không chỉ là món đồ trao cho kẻ chiến thắng, mà là ngọn hải đăng thu hút những kẻ dũng cảm và táo bạo đến tham dự.#!"
  tournament_prizes_splendid:0 "Giải thưởng Lộng lẫy"
  tournament_prizes_splendid_desc:0 "$EFFECT_LIST_BULLET$ [artifacts|E] làm giải thưởng sẽ có [rarity|E] Danh tiếng hoặc Lừng lẫy\n\n#weak Những giải thưởng tốt nhất là những thứ hào nhoáng đến mức che mờ cả người chiến thắng.#!"

 ### INTENTS
  win_contest_intent:1 "Chiến thắng"
  win_contest_intent_desc:2 "Giành chiến thắng trong các cuộc thi tại [GetActivityType( 'activity_tournament' ).GetName] này, bất chấp mọi thứ khác. Điều này thường dẫn đến phần thưởng [progress_to_victory|E] cao hơn cùng các lựa chọn và sự kiện đặc biệt."

 ### GUESTS
  special_guest_champion:0 "Nhà Vô địch"
  special_guest_champion_for_host:0 "$special_guest_champion$"
  special_guest_champion_desc:0 "Một $special_guest_champion$ có thể được chỉ định tại một [GetActivityType( 'activity_tournament' ).GetName] để đại diện cho Ngài, dù Ngài có trực tiếp tham gia hay không — tuy nhiên các giới tính không thiên về võ thuật thường sẽ tận dụng họ hiệu quả nhất. Mọi phần thưởng mà $special_guest_champion$ nhận được trong một [contest|E] sẽ được chia sẻ với người đã chỉ định họ."
  special_guest_champion_desc_for_host:0 "$special_guest_champion_desc$"
  tournament_activity_champion_appointed:0 "$champion_court_position$ được Bổ nhiệm"

