l_english:

 #What You Don't See...
  tour_grounds_events.7000.t:0 "Những Gì Ngài Không Thấy..."
  tour_grounds_events.7000.desc:0 "[stop_host_scope.GetTitledFirstName|U] cho đến giờ vẫn là một chủ nhà vô cùng hiếu khách, tự hào dẫn Ta đi xem lãnh địa và tài sản của [stop_host_scope.GetHerHis], nên Ta lập tức giật mình khi [stop_host_scope.GetSheHe] bắt đầu lắp bắp và rõ ràng đang cố chuyển hướng sự chú ý của Ta khỏi một cánh cửa trông có vẻ chẳng có gì đặc biệt mà chúng Ta đang đi ngang qua.\n\n\"Ngươi đang #EMP giấu#! ta thứ gì sao, [stop_host_scope.GetFirstNameNoTooltip]?\"\n\nTa lợi dụng khoảnh khắc sững sờ — xấu hổ? #EMP Tội lỗi#!? — im lặng của [stop_host_scope.GetHerHis] để đẩy cánh cửa ra, và Ta ngạc nhiên trước những gì mình thấy:"
  tour_grounds_events.7000.desc_artifacts:0 "những báu vật, châu báu, và thậm chí cả [this_artifact.GetName] của [stop_host_scope.GetFirstNamePossessiveNoTooltip]!"
  tour_grounds_events.7000.desc_pantry:0 "một kho lương bí mật, chất cao đến trần với gia vị ngoại quốc, thịt ướp, mật ong, và các thùng muối!"
  tour_grounds_events.7000.desc_cellar:0 "cả một hầm rượu, chất cao đến trần với những loại rượu vang và rượu mạnh đắt tiền từ những vùng đất xa xôi!"
  tour_grounds_events.7000.desc_gold:0 "nhiều đống vàng và những rương tiền tràn ngập tiền xu!"
  tour_grounds_events.7000.desc_falcons:0 "một chuồng chim lớn nuôi vô số chim ưng kiêu hãnh trong những lồng được chăm sóc cẩn thận!"
  tour_grounds_events.7000.desc_dogs:0 "cánh cửa dẫn ra một sân trong đầy những con chó săn khỏe mạnh, cường tráng nhất mà Ta từng thấy trong thời gian gần đây!"
  tour_grounds_events.7000.desc_horses:0 "cánh cửa dẫn ra một sân trong đầy những con ngựa khỏe mạnh, cường tráng nhất mà Ta từng thấy trong thời gian gần đây!"
  tour_grounds_events.7000.desc_fallback:0 "một kho dự trữ lương thực, tiền vàng, và các loại hàng hóa thông thường!"
  tour_grounds_events.7000.a:0 "Chia sẻ những thứ này với [ROOT.Char.GetTitleAsNameNoTooltip] của ngươi là điều công bằng."
  tour_grounds_events.7000.a.tt:0 "Kho bí mật bị đánh thuế"
  tour_grounds_events.7000.b:0 "Lính gác! Tịch thu #EMP tất cả#!."
  tour_grounds_events.7000.b.tt:0 "Kho bí mật bị tịch thu"
  tour_grounds_events.7000.b.tt.2:0 "Chủ quân của Ngài lấy đi những thứ tốt nhất trong kho dự trữ của Ngài!"
  tour_grounds_events.7000.c:0 "Một người sành sỏi giống ta!"
  tour_grounds_events.7000.c.tt:0 "Kho bí mật được đánh giá cao"
  tour_grounds_events.7000.c.tt.2:0 "Ngài gắn kết với chủ quân của mình bằng cách chia sẻ sở thích chung!"
  tour_grounds_events.7000.d:0 "Ta sẽ giả vờ như chưa từng thấy chuyện này."
  tour_grounds_events.7000.d.tt:0 "Kho bí mật bị bỏ qua"
  tour_grounds_events.7001.desc:0 "Ta tin rằng mình đã là một chủ nhà cực kỳ hiếu khách đối với chủ quân đến thăm, [visiting_liege.GetTitledFirstName], cho đến giờ.\n\nĐặc biệt là chuyến tham quan [ROOT.Char.Custom('ResidenceBuilding')] của Ta đã diễn ra rất suôn sẻ — cho đến khi Ta rẽ nhầm đường và đưa vị [visiting_liege.GetLadyLord] đầy tò mò của mình thẳng đến trước cánh cửa duy nhất mà Ta đang cố giữ [visiting_liege.GetHerHim] tránh xa:"
  tour_grounds_events.7001.desc_artifacts:0 "căn phòng bí mật nơi Ta cất giữ báu vật gia truyền!"
  tour_grounds_events.7001.desc_pantry:0 "kho lương bí mật nơi Ta cất giấu gia vị ngoại quốc, thịt ướp, mật ong và các thùng muối!"
  tour_grounds_events.7001.desc_cellar:0 "hầm rượu bí mật nơi Ta cất giữ những loại rượu vang và rượu mạnh đắt tiền từ những vùng đất xa xôi!"
  tour_grounds_events.7001.desc_gold:0 "kho báu bí mật nơi Ta cất giữ những đống vàng và các rương tiền tràn ngập tiền xu!"
  tour_grounds_events.7001.desc_falcons:0 "chuồng chim bí mật nơi Ta nuôi giữ những con chim ưng quý giá nhất!"
  tour_grounds_events.7001.desc_dogs:0 "sân trong bí mật nơi Ta nuôi dưỡng những con chó săn quý giá nhất!"
  tour_grounds_events.7001.desc_horses:0 "sân trong bí mật nơi Ta nuôi dưỡng những con ngựa quý giá nhất!"
  tour_grounds_events.7001.desc_fallback:0 "kho bí mật của Ta gồm lương thực, tiền vàng, và các loại hàng hóa đắt tiền nói chung!"
  tour_grounds_events.7001.desc_conclusion:0 "\n\nKhi Ta bắt đầu lắp bắp một cách lo lắng, [visiting_liege.GetTitledFirstNameNoTooltip] ngày càng trở nên tò mò."
  tour_grounds_events.7001.a:0 "Thưa [visiting_liege.GetLadyLord]! Chúng ta đi lối #EMP này#!!"
  tour_grounds_events.7001.a.success:0 "Ngài hướng chủ quân sang nơi khác"
  tour_grounds_events.7001.a.success.tt:0 "Tài sản của Ngài được an toàn"
  tour_grounds_events.7001.a.failure:0 "Chủ quân của Ngài xông thẳng vào căn phòng"
  tour_grounds_events.7001.a.failure.tt:0 "Kho bí mật của Ngài bị phát hiện"
  tour_grounds_events.7001.b:0 "Ta chắc là có thể thuyết phục [visiting_liege.GetSheHe] làm ngơ chứ?"
  tour_grounds_events.7001.b.success:0 "Chủ quân của Ngài chấp nhận hối lộ"
  tour_grounds_events.7001.b.success.tt:0 "Hối lộ được nhận"
  tour_grounds_events.7001.b.tt.2:0 " Chủ nhà của Ngài [ROOT.Char.GetTitledFirstNameNoTooltip] đã trả tiền để Ngài làm ngơ trước một căn phòng nào đó."
  tour_grounds_events.7001.b.tt:0 "Bị hối lộ để làm ngơ"
  tour_grounds_events.7001.c:0 "Ta ĐỊNH đưa ngài đến đó ngay bây giờ!"
  tour_grounds_events.7001_followup:0 "Chủ quân của Ngài sẽ quyết định phải làm gì với tài sản bị giấu kín của Ngài — Ngài có thể bị đánh thêm thuế!"
