l_english:
#### Tour Travel Events
  tour_travel.3120.t:0 "Một Chuyến Ghé Thăm Quán Count's Arms"
  tour_travel.3120.desc.intro:0 "Mọi quán trọ trên đường đều đắt đỏ như nhau. Rất khó để không bị chú ý đến đoàn tùy tùng của chúng ta, mà cũng chẳng phải chúng ta cố tình kín đáo. Mọi người lập tức im bặt ngay khi chúng ta bước vào.\n\nChỉ có một [vassal_inn.GetWomanMan] tiến đến gần chúng ta, háo hức muốn ngồi cùng bàn. Chẳng bao lâu [vassal_inn.GetSheHe] bắt đầu nói chuyện với dáng vẻ [vassal_inn.Custom('quirk_pos_standalone')|l]. Và có vẻ như [vassal_inn.GetSheHe] sẽ không dừng lại sớm đâu: \"Và rồi chính lúc đó, khi [vassal_memory.GetDescription]...\"\n\n"
  tour_travel.3120.desc.artifact:0 "\"À, nhìn cái này xem!\" [vassal_inn.GetSheHe] kêu lên, đặt [vassal_artifact.GetName] lên bàn. \"Giờ nó là của ngài rồi!\""
  tour_travel.3120.desc.fallback:0 "Thà thế này còn hơn là im lặng."
  tour_travel.3120.a:0 "\"Ta thích bầu  Bạn củangươi, [vassal_inn.GetFirstNameNoTooltip], sao không ngồi cùng ta?\""
  tour_travel.3120.a.success:0 "Ngài thuyết phục được [vassal_inn.GetShortUIName]"
  tour_travel.3120.a.failure:0 "[vassal_inn.GetShortUIName] cảm thấy được tâng bốc, nhưng không bị thuyết phục"
  tour_travel.3120.b:0 "\"Kể tiếp đi!\""
  tour_travel.3120.c:0 "\"Món quà thật đáng yêu!\""
 
  tour_travel.3130.t:0 "Hệ Quả Nhẹ Hơn"
  tour_travel.3130.desc.intro:0 "\"Ngài kia!\" Ta nghe thấy một tiếng gọi từ xa và quay lại, bắt gặp một nông dân đang cầm cày, [complaining_peasant.GetHerHis|U] thở dốc đầy kích động khi [complaining_peasant.GetSheHe] dừng lại trong giây lát.\n\n\"Ta xin lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng hiếm khi Ta có cơ hội được nói chuyện với ngài. Ta hiểu rằng ngài phải phát triển lãnh thổ, nhưng\""
  tour_travel.3130.desc.no_farms:0 "những công trình hoàng gia mà ngài xây dựng ở đây đã khiến chúng Ta mất việc.\""
  tour_travel.3130.desc.no_jobs:0 "những cối xay mà ngài xây dựng ở đây đã chiếm mất một phần đất của chúng Ta.\""
  tour_travel.3130.desc.outro:0 "\n\n[complaining_peasant.GetSheHe|U] clutches [complaining_peasant.GetHerHis] plow."
  tour_travel.3130.a:0 "\"Điều này khiến ta nặng lòng. Hãy nhận lấy số vàng này.\""
  tour_travel.3130.b:0 "\"Hãy đến làm việc trên đất của ta. Ta sẽ bù đắp những gì đã lấy đi của ngươi.\""
  tour_travel.3130.c:0 "\"Vương quốc luôn là trên hết.\""
  peasant_influx_modifier:0 "Dòng Người Nông Dân"
  peasant_influx_modifier_desc:0 "Những vùng đất này được trao cho một nhóm nông dân như sự bồi thường cho thiệt hại do các công trình mới gây ra."
 
  tour_travel.3140.t:0 "Bên Ngoài Tường Thành"
  tour_travel.3140.desc:1 "Ta nghe thấy tiếng ồn ào ngay cả trước khi nhìn thấy tòa nhà. Giọng nói vang lên từ bên trong căn nhà gỗ khiêm tốn; tiếng cười và âm nhạc. Khi chúng Ta tiến lại gần, một [brothel_worker.GetWomanMan] vẫy tay về phía chúng Ta, cắn nhẹ vào [ROOT.GetCharacter.Custom('GetSmallFoodIndef')].\n\n\"Ồ, chào mừng,\" [brothel_worker.GetSheHe] nói với dáng vẻ [brothel_worker.Custom('quirk_pos_standalone')|l]. \"Ngài muốn ở lại qua đêm không? Hay chỉ vài giờ? Một chút thôi?\"\n\nKhông khó để nhận ra ý đồ của [brothel_worker.GetHerHis]."
  tour_travel.3140.a:0 "\"Ta #EMP rất muốn#!.\""
  tour_travel.3140.b:0 "\"Ta sẽ không sa vào cám dỗ.\""
  brothel_stop_modifier:0 "Hồi Phục Sinh Lực"
  brothel_stop_modifier_desc:0 "Nhân vật này đã dừng chân tại nhiều nhà thổ trên đường đi."
 
#### Tour Cultural Festival Events
#Liege Events
  cultural_festival.2000.t:0 "Lễ Hội Văn Hóa tại [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
  cultural_festival.2000.desc.intro:0 "Những con phố tại [ROOT.Char.GetCurrentLocation.GetName] được trang hoàng lộng lẫy để chào đón ta, và chư hầu của ta, [stop_host_scope.GetTitledFirstName], đang cung kính chờ đợi.\n\n"
  cultural_festival.2000.desc.first_time_lovers:0 "Ta không thể chờ đợi để lần đầu đặt chân đến vùng đất này, với phong cảnh tuyệt đẹp và bầu trời diệu kỳ mà [stop_host_scope.GetFirstNameNoTooltip] đã nhiều lần miêu tả cho ta trên giường. Và để"
  cultural_festival.2000.desc.first_time_rivals:0 "Ôi, không biết bao nhiêu lần ta đã mơ về việc tàn phá những vùng đất mục nát của [stop_host_scope.GetHerHis], về việc ghé thăm pháo đài mà [stop_host_scope.GetSheHe] khoe khoang không ngớt chỉ để thấy nó còn tệ hơn của ta.\n\nTa thực sự không thể chờ để tận mắt chứng kiến cái #EMP ổ thối rữa đó.#! May thay, ta có mặt ở đây để"
  cultural_festival.2000.desc.first_time_neutral:0 "Ta không thể nói rằng mình không tò mò về phong tục nơi đây và những gì [stop_host_scope.GetFirstNameNoTooltip] có thể mang đến cho ta. Và đổi lại, ta sẽ"
  cultural_festival.2000.desc.first_time_good:0 "À, ta khao khát được tận hưởng những hoạt động tuyệt vời và niềm vui mà ta chắc chắn [stop_host_scope.GetFirstNameNoTooltip] đã chuẩn bị — và để"
  cultural_festival.2000.desc.first_time_bad:0 "Vậy là ta ở đây, tham dự một lễ hội nhàm chán — tầm thường là cùng — do tên ngốc [stop_host_scope.GetFirstNameNoTooltip] miễn cưỡng chuẩn bị. May thay, ta đến đây để"
  cultural_festival.2000.desc.again_lovers:0 "Ta đã không thể chờ đợi để quay lại vùng đất này! Ta nhớ rõ lần trước đã tận hưởng phong tục và truyền thống nơi đây ra sao, và ta đã mong mỏi được gặp lại người thân yêu [stop_host_scope.GetFirstNameNoTooltip] như thế nào.\n\nVà dĩ nhiên, để"
  cultural_festival.2000.desc.again_rivals:0 "À, đặt chân #EMP một lần nữa#! đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] chỉ có thể so sánh với việc bước xuống tận cùng của [ROOT.Char.GetFaith.NegativeAfterLife]. May thay, ta trở lại để"
  cultural_festival.2000.desc.again_good:0 "À! Thật tuyệt vời khi lại được đặt chân đến đây! Ta nóng lòng muốn xem những màn trình diễn rực rỡ và những bữa tiệc ngon lành mà [stop_host_scope.GetSheHe] đã chuẩn bị cho ta lần này. Và để"
  cultural_festival.2000.desc.again_neutral:0 "Lần trước cũng không quá tệ, nên ta hy vọng lần này cũng dễ chịu như vậy. Ta thực sự cần một chút giải trí, tránh xa những âm mưu chốn triều đình. Và tất nhiên, để"
  cultural_festival.2000.desc.again_bad:0 "#EMP Agh#! phải có mặt ở đây, #EMP một lần nữa#!, là một trong những hình phạt lớn nhất của số phận. Việc phải chịu đựng sự hiện diện buồn tẻ đến đáng kinh ngạc của [stop_host_scope.GetHerHis] có lẽ là thử thách lớn nhất. May thay, ta cũng ở đây để"
  cultural_festival.2000.desc.majesty:0 "phô bày cho mọi người thấy sự vĩ đại của ta."
  cultural_festival.2000.desc.intimidation:0 "cho [stop_host_scope.GetHerHim] thấy một [ROOT.Char.GetTitleAsNameNoTooltip] cai trị như thế nào."
  cultural_festival.2000.desc.again_intimidation:0 "nhắc nhở họ về lần ghé thăm trước của ta. Ta sắp khiến lần này cũng #EMP không thể nào quên.#!"
  cultural_festival.2000.desc.taxation:1 "làm nhẹ bớt túi tiền nặng trĩu vàng của họ."
  cultural_festival.2000.a:1 "\"Bắt đầu thôi!\""
  cultural_festival_begins_tt:1 "Bắt đầu hoạt động Lễ Hội Văn Hóa"
 
  cultural_festival.2001.t:0 "Khởi Đầu Sai Bước"
  cultural_festival.2001.desc.intro:0 "Âm nhạc trên sân khấu chính vừa dứt thì các vũ công lập tức xuất hiện. Vẻ đẹp trong từng chuyển động của họ khiến họ trông như một phần của sân khấu. Họ tung tay lên không trung, trông chẳng khác nào cây cối đang đâm chồi nảy lộc.\n\nMột tiếng thét kinh hãi vang lên từ khán giả khi một vũ công bắt đầu leo lên bức tường gỗ của sân khấu: \"Và giờ,\" [injured_artist.GetSheHe] nói, \"ta sẽ trả thù — #EMP aaaAAAAAH#!\".\n\n"
  cultural_festival.2001.desc.child:1 "Khi [injured_artist.GetSheHe] ngã xuống đất, chiếc mũ trùm đầu của [injured_artist.GetHerHis] tuột ra, để lộ khuôn mặt của [stop_host_scope.GetTitledFirstNamePossessive] [injured_artist.Custom('GetDaughterSon')]: [injured_artist.GetName]."
  cultural_festival.2001.desc.normal:0 "Khi người biểu diễn ngã xuống đất, sự im lặng của đám đông khiến mọi người nghe rõ một tiếng #EMP rắc#!."
  cultural_festival.2001.a:0 "Chà... đúng là đau thật."
  cultural_festival.2001.b:0 "\"Gọi thầy thuốc ngay lập tức!\""
  cultural_festival.2001.c:0 "\"Ta sẽ cho ngươi ăn roi vì sự bất tài này!\""
  festival_helped_injured_artist_modifier:0 "Đã Giúp Đỡ Nghệ Sĩ Bị Thương"
  festival_whipped_injured_artist_modifier:0 "Đã Đánh Roi Nghệ Sĩ Bị Thương"
 
  cultural_festival.2002.t:0 "Khởi Đầu Đúng Bước"
  cultural_festival.2002.desc.intro:0 "Những nông dân địa phương đã dựng các quầy hàng bán rau củ và — thỉnh thoảng, hiếm hoi — [stop_host_scope.Custom('RegionalEdibleMeat')]. Khi ta tiếp tục dạo bước, được hộ tống bởi một số lượng không nhỏ các cận thần, ta thấy một gương mặt quen thuộc trong số họ, ánh mắt của [injured_artist.GetHerHis] khóa chặt vào ta.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" cuối cùng [injured_artist.GetSheHe] tiến đến, và chỉ với một cử chỉ tay của ta, lính canh liền cho phép [injured_artist.GetHerHim] tiếp tục, \"ngài đã giúp Ta lúc khó khăn, khi Ta bị thương trong buổi biểu diễn. Giờ đến lượt Ta đáp lại ngài bằng những gì Ta có.\""
  cultural_festival.2002.desc.secret:0 "Ta biết bí mật của [secret_target.GetTitledFirstNamePossessive].\""
  cultural_festival.2002.desc.hunting:0 "Ta rất thông thạo vùng đất này.\""
  cultural_festival.2002.desc.savings:0 "Và đây là tất cả những gì Ta có.\""
  cultural_festival.2002.a:0 "\"Một sự đền đáp xứng đáng.\""
  cultural_festival.2002.b:0 "\"Ta chỉ làm điều cần làm. Không hơn.\""
  terrain_knowledge_modifier:0 "Hiểu Biết Địa Hình"
 
  cultural_festival.2010.t:0 "[ROOT.Char.Custom('GetMonarchofBeautyGoodBad')]"
  cultural_festival.2010.desc_bad:0 "Every person in [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] seems to be immersed in the funniest conversation that ever was. They chuckle and cough, and even nudge each other whenever they think it may be too excessive. From here and there I manage to hear the word "grimly".\n\nWhen I approach the main stage, I find [stop_host_scope.GetTitledFirstName] holding a flower crown in [stop_host_scope.GetHerHis] hands, with a mischievous smile: "Here [ROOT.Char.GetSheHe] is!," [stop_host_scope.GetSheHe] announces, pointing at me, "our [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')]!""
  cultural_festival.2010.desc_good:1 "The streets of [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] hang with [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')] and banners, every person in the village merrily celebrating my arrival — I could even swear that they don't take their eyes off me.\n\nWhen I approach the main stage, I find [stop_host_scope.GetTitledFirstName] holding a flower crown in [stop_host_scope.GetHerHis] hands, smiling at me: "Here [ROOT.Char.GetSheHe] is!," [stop_host_scope.GetSheHe] announces, "our [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')]!""
  cultural_festival.2010.a:0 "\"Thật là một bất ngờ dễ mến!\""
  cultural_festival.2010.b:0 "Tốt nhất là không làm ầm ĩ. Rời đi thôi."
  cultural_festival.2010.c:0 "\"Ngươi #EMP dám#! sao.\""
  cultural_festival.2010.c.success:0 "Ngài thắng trong cuộc ẩu đả"
  cultural_festival.2010.c.failure:0 "[stop_host_scope.GetShortUIName] thắng trong cuộc ẩu đả"
  monarch_of_beauty_bad_male:0 "Vua của U Ám và Oán Hận"
  monarch_of_beauty_bad:0 "Nữ Vương của U Ám và Oán Hận"
  monarch_of_beauty_good_male:0 "Vua của Vẻ Đẹp và Cao Quý"
  monarch_of_beauty_good:0 "Nữ Vương của Vẻ Đẹp và Cao Quý"
  king_of_beauty_modifier:0 "Sự Ngưỡng Mộ Ngoại Hình"
  king_of_ugly_modifier:0 "Phản Ứng Thái Quá của Chúa Thượng"
 
  cultural_festival.2020.t:0 "'Đến Mùa Rồi'"
  cultural_festival.2020.desc.intro:0 "Những con phố treo đầy thảm trang trí! À, mùi thơm của [stop_host_scope.Custom('RegionalEdibleMeat')] vừa mới nấu! Cách mà [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] tỏa sáng vào thời điểm này trong năm!\n\n"
  cultural_festival.2020.desc.christmas:1 "Chuông vang lên và người dân địa phương chuẩn bị cho thánh lễ. Họ rôm rả trò chuyện về sự ra đời của Chúa Kitô. \"Có một con lừa, Ta nói thật!\", \"Và chuyện đó xảy ra gần con sông, giống như ở đây\", \"Khi con Ta ra đời Ta mong ngài sẽ cho nó thật nhiều vàng!\"\n\nMột vở diễn ngắn ngay sau đó được trình diễn, và Chúa đã ra đời."
  cultural_festival.2020.desc.midsommar:2 "Họ đã dựng một cột hoa ở giữa làng, và người dân địa phương mặc đồ trắng chuẩn bị nhảy múa xung quanh nó. Ta bắt gặp một vòng hoa làm từ [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')] đặt trên một trong các chiếc bàn, và một cô gái trẻ mỉm cười với Ta trước khi gia nhập vòng tròn. Trên bầu trời, thứ ánh sáng đẹp nhất chiếu rọi suốt cả đêm."
  cultural_festival.2020.desc.summer_solstice:1 "Một đống lửa trại đã được đốt lên ở trung tâm thị trấn để ăn mừng chiến thắng của ngôi sao rực rỡ nhất, đang vươn lên thiên đường phía trên. Giữa những cuộc vui chơi và những chén [stop_host_scope.Custom('RegionalDrink')], một người dân địa phương bắt đầu một bài hát mà tất cả cùng hòa giọng: \"Mùa hè đã đến, hãy cất tiếng hát vang, [ROOT.Char.Custom('GetRandomMigratoryBird')]! Hạt giống đang lớn lên, và đồng cỏ đang nở hoa, hãy cất tiếng hát, [ROOT.Char.Custom('GetRandomMigratoryBird')]!\""
  cultural_festival.2020.desc.eid:0 "Sau những lời cầu nguyện, người dân địa phương thăm hỏi lẫn nhau và ăn mừng kết thúc thời kỳ nhịn ăn. Những mâm đầy [stop_host_scope.Custom('get_region_root_vegetable_plural')] và cá được dọn ra cùng với [stop_host_scope.Custom('RegionalDrink')], và lễ hội tiếp diễn cho đến khi mặt trời lặn."
  cultural_festival.2020.desc.harvest:1 "Sau nhiều tuần lao động, ngày cuối cùng của mùa gặt cuối cùng cũng đã đến, và các đội được lập ra trong dân làng để cố gắng thu gom mảnh ruộng cuối cùng. \"Nhìn này!\" một người trong số họ khoe khoang khi vung lưỡi hái về phía cánh đồng, cũng chẳng cắt được nhiều hơn ai khác.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy đến ăn mừng cùng chúng Ta!\" mời gọi [stop_host_scope.GetTitledFirstName], ra hiệu về phía nhóm người đang nhảy múa vui vẻ bên mùa gặt."
  cultural_festival.2020.desc.generic:1 "Thật là ca hát, hò hét và vui chơi tưng bừng! \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], hãy đến ăn mừng cùng chúng Ta!\" [stop_host_scope.GetTitledFirstName] nói, với nụ cười chào đón. Tại quảng trường, người dân địa phương đã tụ họp: họ nhảy múa giữa mùi nồng nặc của [stop_host_scope.Custom('RegionalDrink')] và [stop_host_scope.Custom('GetLocalStreetFood')]."
  cultural_festival.2020.a:0 "Một lễ hội thật đáng yêu!"
  cultural_festival.2020.b.drink:0 "#EMP Hãy uống một chút [stop_host_scope.Custom('RegionalAlcoholicDrink')]#!."
  cultural_festival.2020.b.no_drink:0 "Đã đến lúc uống [stop_host_scope.Custom('RegionalDrink')] và ăn [stop_host_scope.Custom('RegionalEdibleMeat')]!"
  cultural_acceptance_embraced_festival:0 "Đón Nhận Lễ Hội Văn Hóa"
  enjoyed_culture_modifier:0 "Ăn Mừng Lễ Hội Văn Hóa"
  enjoyed_culture_modifier_desc:1 "Nhân vật này đã tham gia một lễ hội địa phương"
  festival_tis_the_season:0 "Uống Và Quên Hết!"
  festival_tis_the_season_desc:0 "Nhân vật này đã dành thời gian uống rượu trong một lễ hội địa phương"
 
  cultural_festival.2030.t:0 "Đánh Thuế Lễ Hội Văn Hóa"
  cultural_festival.2030.desc:0 "Khi người dân [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] bắt đầu tụ tập quanh sân khấu gỗ, một ý nghĩ chợt lóe lên trong đầu Ta... một đám đông lớn như vậy, ai nấy đều muốn thưởng thức một màn trình diễn được chuẩn bị công phu đến thế... #EMP miễn phí#!. Thật là lãng phí.\n\nNếu Ta đứng ở lối vào, chắc chắn Ta có thể đòi một khoản phí nhỏ cho việc này... suy cho cùng thì cũng là để vinh danh #EMP Ta#!."
  cultural_festival.2030.a:0 "Họ nợ ta điều này."
  cultural_festival.2030.b:0 "Ta nên tạo ấn tượng tốt và không xen vào."
  cultural_festival.2030.c:0 "Anh thấy đấy, việc đi tới đây #EMP cực kỳ#! tốn kém..."
  no_taxation_modifier:0 "Không Đánh Thuế Lễ Hội"
  festival_taxation_modifier:0 "Thuế Lễ Hội"
  
  cultural_festival.2040.t:0 "Lễ Hội Thiếu Văn Hóa...?"
  cultural_festival.2040.desc:0 "Ta không biết mình đã mong đợi điều gì khi yêu cầu [stop_host_scope.GetTitledFirstName] tổ chức một lễ hội văn hóa để phô bày phong tục của người dân [stop_host_scope.GetHerHis], nhưng... nó không phải là #EMP thế này#!.\n\nTa quay đầu đi khỏi điệu nhảy lộn xộn của những người biểu diễn được huấn luyện kém, cố tìm chút an ủi nơi các món ăn được chuẩn bị — #EMP khiếp thật#!, [stop_host_scope.Custom('RegionalEdibleMeat')] thì gần như chưa chín, còn [stop_host_scope.Custom('get_region_root_vegetable_plural')] thì bị cháy đen hoàn toàn. Đây có phải là hình ảnh đại diện tốt cho nền văn hóa [cultural_festival_scope.GetAdjectiveNoTooltip] không?"
  cultural_festival.2040.a:0 "Thật sự là #EMP kinh khủng#!. Nhận lấy sự giúp đỡ và cải thiện đi."
  cultural_festival.2040.b:0 "Thực ra cũng không tệ đến thế."
  cultural_festival.2040.c:0 "Hah! Ta sẽ cho họ thấy người [ROOT.Char.GetCulture.GetCollectiveNoun] nhảy múa thế nào."
  cultural_festival.2040.c.success:0 "Mọi người đều ấn tượng với văn hóa của Ngài"
  cultural_festival.2040.c.failure:0 "Mọi người nghĩ Ngài thiếu tôn trọng"
  no_culture_modifier:0 "Bác Bỏ Văn Hóa Của Họ"
  helped_culture_modifier:0 "Hỗ Trợ Cải Thiện Văn Hóa"
  appreciated_culture_modifier:0 "Trân Trọng Văn Hóa Của Họ"
  cultural_acceptance_insulted_festival:0 "Xúc Phạm Lễ Hội Văn Hóa"
  
  cultural_festival.2050.t:0 "Những Điệu Nhảy Gây Tai Tiếng"
  cultural_festival.2050.desc_intro:0 ""Và giờ, để vinh danh [ROOT.Char.GetTitledFirstNameNoTooltip], chúng ta sẽ cùng thưởng thức một điệu nhảy địa phương!" [stop_host_scope.GetTitledFirstName] tuyên bố, còn Ta thì hào hứng ngồi vào chỗ bên phải của [stop_host_scope.GetHerHis], nhâm nhi trái cây tươi và [stop_host_scope.Custom('RegionalDrink')].\n\n"
  cultural_festival.2050.desc_lustful:0 "Những người biểu diễn nhanh chóng bước lên bục, và ánh mắt Ta lập tức dõi theo đôi chân trần được thoa dầu của họ. Những lồng ngực trần trụi cũng bóng lên không kém, gần như #EMP chẳng#! để lại chút gì cho trí tưởng tượng. Ta điều chỉnh lại tư thế trên ghế, cảnh tượng thân thể đẹp đẽ này là sao?"
  cultural_festival.2050.desc_fallback:0 "Những người biểu diễn nhanh chóng bước lên bục, tất cả đều mặc... à mà, nói họ #EMP có mặc#! thì hơi quá. Làn da trần nơi đôi chân họ được thoa dầu thơm, và phần... phần #EMP ngực#! của họ lộ ra quá nhiều để có thể làm ngơ."
  cultural_festival.2050.desc_outro:0 "\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] liếc nhìn Ta: "Ngài thấy thế nào, Ngài hiền?""
  cultural_festival.2050.a:0 "Cái #EMP quái#! gì đây, sự suy đồi này?"
  cultural_festival.2050.b:0 "À — ừ thì, đó là văn hóa của họ mà, đúng không?"
  cultural_festival.2050.c:0 "Sao đến giờ ta mới được thấy thứ này?"
  
  cultural_festival.2060.t:0 "Một Bảo Vật Từ Kinh Đô"
  cultural_festival.2060.desc:1 "Dù lễ hội rõ ràng đã được đầu tư rất nhiều công sức, Ta vẫn nhận ra vài ngôi nhà bỏ hoang và vật liệu kém chất lượng ở [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip].\n\nKhi Ta tiến đến quảng trường chính, Ta thấy [stop_host_scope.GetTitledFirstName] đang bị một nhóm trẻ con vây quanh, háo hức hỏi về đoàn tùy tùng của chúng Ta. Chúng lập tức trốn đi khi thấy Ta. "Ta mang thứ này từ kinh đô tới, nếu ai muốn xem thì..." Ta nói, vừa cho [stop_host_scope.GetFirstNameNoTooltip] thấy [sophisticated_artifact.GetNameNoTooltip] mà Ta mang theo."\n\n"Thật tráng lệ!" [stop_host_scope.GetSheHe] nói, khi lũ trẻ quay lại để ngắm nhìn."
  cultural_festival.2060.a:0 ""Thực ra, ngươi có thể giữ nó.""
  cultural_festival.2060.b:0 ""Cẩn thận đôi tay đó.""
  cultural_festival.2060.c:0 ""Ta sẽ trả tiền để thợ thủ công của ngươi làm một cái!""
  
  cultural_festival.2070.t:0 "Một Ván Đỏ Đen"
  cultural_festival.2070.desc:0 "An impressively strong smell hits me when I open the door to the tavern. A group of [retired_mercenary.GetWomenMen] sing lively on a table at the back. "Hah! I told you I'd win!" one of them yells, rolling some dice across [retired_mercenary.GetHerHis] fingers, then [retired_mercenary.GetSheHe] lifts up [retired_mercenary.GetHerHis] head, looking directly at me. "Do you wanna try your luck too, [ROOT.Char.GetTitleAsNameNoTooltip]?"\n\n"Careful, [ROOT.Char.Custom('FormOfAddressForLiege')]," [stop_host_scope.GetTitledFirstName] warns me, "these [retired_mercenary.GetWomenMen] are retired mercenaries that have taken a liking to my lands.""
  cultural_festival.2070.a:0 ""Có lẽ các ngươi cứ ở lại đây... và trông chừng người dân.""
  cultural_festival.2070.b:0 ""Thôi nào, chỉ #EMP một#! ván nữa — nếu ta thắng.""
  cultural_festival.2070.b.success:0 "Ngài thắng ván cược"
  cultural_festival.2070.b.failure:0 "Ngài thua ván cược"
  cultural_festival.2070.c:0 ""Ta mang xúc xắc riêng, làm cho thú vị hơn nào!""
  cultural_festival.2070.c.failure:0 "Họ phát hiện Ngài đã gian lận"
  cultural_festival.2070.d:0 ""À thôi, cùng uống vì những ngày xưa cũ vậy.""
  festival_hired_mercenaries:0 "Thuê Lính Đánh Thuê Giải Ngũ"
  festival_hired_mercenaries_desc:0 "Nhân vật này đã thuê một nhóm lính đánh thuê giải ngũ để giữ trật tự."
  festival_luck_mercenaries:0 "Cuộc Chiến Cuối Cùng"
  festival_luck_mercenaries_desc:0 "Nhân vật này đã thuyết phục một số lính đánh thuê giải ngũ hỗ trợ trong chiến tranh."
  festival_drank_with_mercenaries:0 "Uống Rượu Cùng Lính Đánh Thuê"
  
  cultural_festival.2080.t:0 "Một Giao Dịch Kỳ Lạ"
  cultural_festival.2080.desc:0 "Khi Ta dạo quanh lễ hội, Ta để ý thấy một kẻ trùm áo choàng đang bán những chiếc lọ với thứ chất lỏng khó phân biệt.\n\n"Hãy mua thuốc của ta đi, [ROOT.Char.Custom('FormOfAddressForLiege')], chúng có thể làm nên điều kỳ diệu và cân bằng thể dịch ngay cả với [ROOT.Char.GetWomanMan] yếu ớt nhất."\n\nKhi nhìn kỹ các lọ thuốc, Ta nhận ra một lọ ánh lên sắc đỏ son, như thể được làm từ chu sa hảo hạng nhất. Lọ còn lại thì xanh lục rực rỡ, như thể ai đó đã ngâm các tấm đồng trong rượu vang tươi."
  cultural_festival.2080.a:0 ""Ta sẽ lấy lọ đỏ!""
  cultural_festival.2080.b:0 ""À, loại thuốc xanh trông có vẻ lành mạnh nhất!""
  cultural_festival.2080.c:0 ""Ta không mạo hiểm sức khỏe với thứ này.""
  cultural_festival.2080.tt:0 "Điều này có thể dẫn đến những hậu quả khó lường"
  festival_2080_red_health:0 "Thuốc Bổ Kỳ Diệu"
  cultural_festival_2080.a.health:0 "Cải Thiện Sức Khỏe"
  cultural_festival_2080.a.prowess:0 "Cải Thiện Võ Lực"
  cultural_festival_2080.a.prowess_bad:0 "Suy Giảm Võ Lực"
