  festival_civil_parade_best_modifier:0 "Được truyền cảm hứng từ $parade_type_civil_parade$"
  festival_civil_parade_modifier:0 "$festival_civil_parade_best_modifier$"
  festival_religious_parade_best_modifier:0 "Được truyền cảm hứng từ $parade_type_religious_parade$"
