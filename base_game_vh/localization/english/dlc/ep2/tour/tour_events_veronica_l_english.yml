  regional_farm_animal_whinnying_horse: "ngựa $regional_farm_animal_horse$ hí"
 
  cultural_festival.3040.t:0 "Lưỡi Gươm Trong Đá"
  cultural_festival.3040.desc:0 "Ta nghe thấy một giọng nói quen thuộc khi đang dạo bước trên những con phố lễ hội của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: \"Ta phải làm gì với tảng đá này đây, hả? Ngươi muốn ta ngồi lên nó à?\"\n\n[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đang chỉ vào một tảng đá lớn mà một người thợ xây đã để lại trước mặt [marshal.GetHerHim].\n\n\"Dành cho cuộc thi sức mạnh,\" người thợ giải thích, nhún vai. \"Cuộc thi sức mạnh nào cơ? Thứ này không thể nào nhấc nổi!\" [marshal.GetTitledFirstNameNoTooltip] cãi lại."
  cultural_festival.3040.a:0 "\"Ngươi đâu có cần phải #EMP nhấc#! nó lên, Bạn ta.\""
  cultural_festival.3040.flavor:0 "Sẽ không ai có thể rút lưỡi gươm khỏi tảng đá!"
  cultural_festival.3040.a.tt:0 "@warning_icon! #X Ngài có thể mất cổ vật này"
  cultural_festival.3040.b:0 "\"Cứ vứt nó đi.\""
 
  cultural_festival.3041.t:0 "$cultural_festival.3040.t$"
  cultural_festival.3041.desc:0 "Một tảng đá lớn được đặt ngay giữa [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], với vẻ phô trương quá mức khiến khó mà tin đây chỉ là ngẫu nhiên. Khi đến gần hơn, Ta nhanh chóng hiểu vì sao mọi người chú ý đến nó — một vũ khí đã bị gắn chặt trên bề mặt, lưỡi gươm sáng loáng, nửa thép nửa đá."
  cultural_festival.3041.a:0 "Hah! Ta sẽ cho chúng thấy sức mạnh của mình!"
  cultural_festival.3041.a.success:0 "Ngài rút được vũ khí ra khỏi đá"
  cultural_festival.3041.a.success.vassal:0 "[visiting_liege.GetShortUIName] đã rút vũ khí ra khỏi đá"
  cultural_festival.3041.a.failure:0 "Vũ khí không nhúc nhích"
  cultural_festival.3041.b:0 "Ta nên để [stop_host_scope.GetTitledFirstNameNoTooltip] lấy nó, coi như một cử chỉ xã giao."
  cultural_festival.3041.c:0 "#EMP ĐƯỢC RỒI!#! Ra đây nào!"
 
  cultural_festival.3042.t:0 "$cultural_festival.3040.t$: Phô Diễn Sức Mạnh"
  cultural_festival.3042.desc.intro:0 "À. Đây rồi! Tảng đá được đặt ngay trung tâm thị trấn, được trang trí bằng những dòng chữ vàng: \"Kẻ nào rút được lưỡi gươm này khỏi tảng đá này, thì chính là chủ nhân hợp pháp của nó.\"\n\nTa quay đầu nhìn [visiting_liege.GetTitledFirstName], người hiển nhiên là ứng viên hàng đầu cho chiến thắng. Tuy nhiên... khi [visiting_liege.GetSheHe] cố kéo chuôi kiếm, vũ khí không hề nhúc nhích."
  cultural_festival.3042.desc.failed:0 "\n\n\"Khốn kiếp,\" Ta nghe [visiting_liege.GetSheHe] lẩm bẩm. Có lẽ đã đến lượt ta thử thách này?"
  cultural_festival.3042.desc.pretended:0 "\"À, xui xẻo thật,\" [visiting_liege.GetSheHe] nói, gật đầu về phía Ta, \"ngươi có muốn thử không, Bạn ta?\""
  cultural_festival.3042.a:0 "#EMP Ta#! sẽ rút nó khỏi tảng đá!"
  cultural_festival.3042.b:0 "Tại sao phải mạo hiểm chịu nhục trước đám đông?"
 
  cultural_festival.3050.t:0 "Màn Trình Diễn Gây Buồn Ngủ"
  cultural_festival.3050.desc:0 "Một nhóm người địa phương bước lên sân khấu với thứ trông giống như bài giảng dài lê thê và nhạt nhẽo nhất mà Ta từng nghe.\n\nTa cố giữ cho mắt mình mở, nhưng chẳng mấy chốc những đống rơm ở góc phố trông có vẻ quá thoải mái, quá cám dỗ..."
  cultural_festival.3050.a:0 "Ta #EMP phải#! tỉnh táo."
  cultural_festival.3050.b:0 "Ta chỉ đang nghỉ mắt thôi..."
  cultural_festival.3050.b.tt:0 "Có khả năng [stop_host_scope.GetShortUIName] sẽ để ý..."
  festival_enjoyed_local_performance:0 "Giả Vờ Hứng Thú Với Lễ Hội"
 
  cultural_festival.3051.t:0 "Yên Tĩnh Quá..."
  cultural_festival.3051.desc:0 "Khi một nhóm người địa phương bước lên sân khấu, Ta lắng nghe bài diễn thuyết của họ với sự thích thú và kính phục. Giá như Ta biết rằng ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] lại có những con người hiểu biết đến thế! Thật kiên cường! Thật cuốn hút!\n\nKhi Ta quay sang [visiting_liege.GetTitledFirstName] để bình luận về giáo huấn của họ, Ta nhận ra mắt [visiting_liege.GetHerHis] đang... nhắm lại? Đó có phải là #EMP tiếng ngáy#! Ta vừa nghe không?"
  cultural_festival.3051.a:0 "Sao [visiting_liege.GetSheHe] lại thấy chuyện này nhàm chán được chứ!?"
  cultural_festival.3051.a.toast:0 "[stop_host_scope.GetShortUIName] đã thấy Ngài ngủ gật"
  cultural_festival.3051.b:0 "Có lẽ không phải ai cũng hợp với chuyện này..."
 
  cultural_festival.3060.t:0 "Ta Có Thể...?"
  cultural_festival.3060.desc.intro:0 "Âm thanh của sáo và trống nhanh chóng hòa cùng một nhóm khách đang nhảy múa, tất cả đều theo nhịp nhạc với những chuyển động vui tươi và tiếng cười. Một cặp đôi lẻn vào con hẻm, bọn trẻ nhảy vòng tròn, một ông lão cô độc cố gắng lắc lư hông mình.\n\n"
  cultural_festival.3060.desc.spouse:0 "Ta quay sang phối ngẫu của mình, [my_spouse.GetTitledFirstName], và ngắm nhìn nụ cười dịu dàng của [my_spouse.GetHerHis] khi vỗ tay theo nhịp nhạc."
  cultural_festival.3060.desc.vassal:0 "Ta bắt gặp [stop_host_scope.GetTitledFirstName] giữa đám đông và bên cạnh ngài ấy là một trong những [vassal_spouse.GetWomenMen] xinh đẹp nhất mà Ta từng thấy..."
  cultural_festival.3060.a:1 "\"Ta có thể chứ, người yêu dấu [my_spouse.GetFirstNameNoTooltip]?\""
  cultural_festival.3060.b:2 "Nhảy cùng phối ngẫu của [stop_host_scope.GetTitledFirstNameNoTooltip] sẽ gây xôn xao..."
  cultural_festival.3060.b.success:0 "Điệu nhảy của Ngài quyến rũ [vassal_spouse.GetShortUIName]"
  cultural_festival.3060.b.failure:0 "[vassal_spouse.GetShortUIName] không mấy ấn tượng với điệu nhảy của Ngài"
  cultural_festival.3060.b.tt:0 "[stop_host_scope.GetShortUIName] có thể sẽ không thích điều này..."
  cultural_festival.3060.c:0 "Ta có thể nhân cơ hội này để nhảy cùng dân địa phương."
  cultural_festival.3060.d:0 "Hừm, #EMP nhảy múa#!."
  festival_danced_with_local_modifier:0 "Tham Gia Điệu Nhảy Địa Phương"
 
  cultural_festival.3061.t:0 "Ngài Nhảy"
  cultural_festival.3061.desc:0 "I clap following the rhythm of the song, but stop when I see [visiting_liege.GetTitledFirstName] approaching us. "Are you...?" I start, but it's not me who [visiting_liege.GetSheHe] seems to be interested in, as [visiting_liege.GetSheHe] directs [visiting_liege.GetHerHis] invitation to my spouse: "Would you do me the honor of having a dance?""
  cultural_festival.3061.a:0 "Đây là một sự xúc phạm đến danh dự của ta!"
  cultural_festival.3061.a.toast:0 "Danh dự bị xúc phạm"
  cultural_festival.3061.b:0 "Ai mà lại không chọn [vassal_spouse.GetHerHim] chứ!"
  festival_flattered_spouse_modifier:0 "Nịnh Bợ Công Khai"
  festival_flattered_spouse_modifier_desc:0 "Nhân vật này đã công khai khen ngợi phối ngẫu của mình một cách đầy quyến rũ."
 
  cultural_festival.3070.t:0 "Bữa Tiệc Của Những Kẻ Ngốc"
  cultural_festival.3070.desc:0 "An idea comes to me like a snapped branch after hearing the bells toll: a Feast of Fools! A world upside down where a sinner is the priest and we all delight and revel for days!\n\nAh, but who to make my [ROOT.Char.GetFaith.BishopNeuter|U] of Fools...? [rival_jester.GetTitledFirstName]? I never liked [rival_jester.GetHerHim] a bit. Or perhaps [sinful_jester.GetTitledFirstName], [sinful_jester.GetHerHis] sinful ways are well known by everyone."
  cultural_festival.3070.a:0 "[rival_jester.GetShortUINameNoTooltip] xứng đáng với vinh dự này."
  cultural_festival.3070.b:0 "Còn ai thích hợp hơn [sinful_jester.GetShortUINameNoTooltip]?"
  cultural_festival.3070.c:0 "Hay là vị khách của chúng ta, [visiting_liege.GetTitledFirstNameNoTooltip]...?"
  cultural_festival.3070.d:0 "Giáo hội sẽ không bao giờ chấp thuận chuyện này."
  festival_feast_of_fools_county_modifier:0 "Bữa Tiệc Của Những Kẻ Ngốc"
  festival_king_of_fools_modifier:0 "Giám Mục Ngốc"
  festival_feast_of_fools_county_modifier_desc:0 "Hạt này đã cho phép tổ chức Bữa Tiệc Của Những Kẻ Ngốc, nơi các nghi thức giáo hội bị châm biếm."
 
  cultural_festival.3071.t:0 "$cultural_festival.3070.t$"
  cultural_festival.3071.desc.intro:0 "Cuồng nhiệt! Vui sướng! Khi Ta bước vào quảng trường chính của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], Ta thấy một nhóm người hóa trang thành giáo sĩ, vừa hát vừa nhảy múa."
  cultural_festival.3071.desc_jester:0 "In its center, a mannequin holding a half-[ROOT.Char.GetFaith.BishopNeuter] half-jester costume, ready to be worn. [stop_host_scope.GetTitledFirstName|U] claps [stop_host_scope.GetHerHis] hands from the stage, laughing viciously: "And here [ROOT.Char.GetTitledFirstName] is — our $nick_monarch_of_fools_masc$! Listen, friends, for [ROOT.Char.GetHerHis] sinful ways know no end, and [ROOT.Char.GetHersHis] is now the power to impose them!""
  cultural_festival.3071.desc_fallback:0 "In its center — a half-[ROOT.Char.GetFaith.BishopNeuter] half-jester [final_jester.GetWomanMan], presiding over the crowd.\n\n[stop_host_scope.GetTitledFirstName] makes an appearance, clapping [stop_host_scope.GetHerHis] hands in joy: "Now listen, friends, as [final_jester.GetTitledFirstName] is now our $nick_monarch_of_fools_masc$ and [final_jester.GetHerHis] will is law and [final_jester.GetHerHis] voice the voice of the Lord. What kind of #EMP sinful#! joy can we expect from [final_jester.GetHerHim]?""
  cultural_festival.3071.a:0 "\"Ta nóng lòng chờ xem đây!\""
  cultural_festival.3071.b:0 "\"Những lễ hội báng bổ như thế này không có chỗ trong lãnh thổ của ta.\""
  cultural_festival.3071.c:0 "\"Hah! #EMP Thuê luôn#!\""
  cultural_festival.3071.d:0 "\"Ngươi dám khắc họa ta như một kẻ ngốc ư!?\""

  cultural_festival.4000.t:0 "Giọng Nói Kỳ Lạ"
  cultural_festival.4000.desc:0 "Đột nhiên, Ta nhận ra mình bị tách khỏi đoàn tùy tùng bởi một đám đông lớn đang chen lên để quan sát các lễ hội đang diễn ra, và trước khi kịp phản ứng thì Ta đã bị kẹt giữa hai người đang tranh cãi gay gắt.\n\nTuy nhiên, Ta không hiểu họ đang nói gì cả và [local_character_scope.GetTitledFirstName] bắt đầu nói chuyện trực tiếp với Ta. Ta cố hòa vào, nhưng [local_translator_scope.GetTitledFirstName] lại liếc Ta với ánh mắt nghi ngờ.\n\nCó lẽ Ta nên đáp lại điều gì đó. Ngôn ngữ của họ nghe thật hấp dẫn, biết đâu Ta có thể học được từ đây?"
  cultural_festival.4000.a:0 "Ta không hiểu, nhưng Ta muốn [local_translator_scope.GetNameNoTooltip] dạy Ta!"
  cultural_festival.4000.b:0 "Gật đầu và mỉm cười..."
  cultural_festival.4000.b.success:0 "Không ai nhận ra rằng Ta chẳng hiểu gì cả"
  cultural_festival.4000.b.failure:0 "[local_translator_scope.GetNameNoTooltip] gọi thẳng Ta ra"
  cultural_festival.4000.c:0 "Thật ra thì chuyện này quá rối rắm với Ta."
  cultural_festival.4100.t:0 "Cử Chỉ Thô Lỗ"
  cultural_festival.4100.desc:0 "I cannot believe my eyes as [inconsiderate_character_scope.GetTitledFirstName] starts gesturing towards [offended_character_scope.GetTitledFirstName] what is considered highly offensive in [offended_character_scope.GetCulture.GetName] culture!\n\n[offended_character_scope.GetNameNoTooltip] shouts and calls [inconsiderate_character_scope.GetTitledFirstName] explicit names, while [offended_character_scope.GetHerHis] men hold [offended_character_scope.GetHerHim] back. It seems like [offended_character_scope.GetSheHe] is not going to calm down on [offended_character_scope.GetHerHis] own, I have to do something to ease the tension."
  cultural_festival.4100.a:0 "Khoan đã, đây chỉ là hiểu lầm thôi."
  cultural_festival.4100.a.success:0 "Ngài đã thuyết phục được [offended_character_scope.GetNameNoTooltip]"
  cultural_festival.4100.a.failure:0 "[offended_character_scope.GetNameNoTooltip] không bị thuyết phục"
  cultural_festival.4100.b:0 "Ta nên công khai khiển trách [inconsiderate_character_scope.GetNameNoTooltip]!"
  cultural_festival.4100.c:0 "Có lẽ Ta có thể đề nghị bồi thường bằng vàng."
  cultural_festival.4200.t:1 "Chuẩn Bị Diễu Hành"
  cultural_festival.4200.desc:0 "Kể từ khi các vị khách đến [ROOT.Char.GetCurrentLocation.GetName], họ đã có rất nhiều thứ để làm và để xem. Tuy nhiên, Ta không nên nghỉ ngơi dù chỉ một khoảnh khắc để giữ họ luôn hứng thú, vì vậy Ta đang nghĩ đến việc làm điều gì đó đặc biệt cho [visiting_liege.GetTitledFirstName] và đoàn tùy tùng của [visiting_liege.GetHerHis]. Một cuộc diễu hành vừa đảm bảo họ được chào đón, vừa phô bày vương quốc của chúng ta dưới ánh sáng tốt đẹp nhất.\n\nTuy nhiên, Ta không chắc loại diễu hành nào sẽ làm hài lòng [visiting_liege.GetNameNoTooltip]?"
  cultural_festival.4200.a:0 "Ta sẽ phô trương sức mạnh quân sự của chúng ta!"
  cultural_festival.4200.tt.liege_likes:0 "Lãnh chúa của Ngài có lẽ sẽ #P thích#! điều này"
  cultural_festival.4200.tt.liege_indifferent:0 "Lãnh chúa của Ngài có lẽ sẽ thấy ổn"
  cultural_festival.4200.tt.liege_dislikes:0 "Lãnh chúa của Ngài có lẽ sẽ #X ghét#! điều này"
  cultural_festival.4200.b:0 "Hãy làm nổi bật con người của chúng ta."
  cultural_festival.4200.c:0 "Ta muốn một trải nghiệm mang tính tâm linh."
  cultural_festival.4201.t:1 "Cuộc Diễu Hành [stop_host_scope.Custom('GetParadeType')|U]"
  cultural_festival.4201.desc:0 "Quyết định tổ chức [stop_host_scope.Custom('GetParadeType')] khiến Ta bổ nhiệm [coordinator_scope.GetTitledFirstName] làm người điều phối cuộc diễu hành và tham khảo ý kiến của [coordinator_scope.GetHerHim] về cách chuẩn bị sự kiện. [coordinator_scope.GetSheHe|U] suy nghĩ một lúc, rồi đưa ra vài lựa chọn:\n\n"
  cultural_festival.4201.desc_military:0 "$cultural_festival.4201.desc$\"Chúng ta có thể mời những hiệp sĩ giỏi nhất trong lãnh thổ và tổ chức một trận chiến thực thụ. Hoặc có lẽ là trình diễn quân lính và đồn trú từ [ROOT.Char.GetCurrentLocation.GetName] với toàn bộ sức mạnh của họ, giao đấu trên quảng trường chính.\""
  cultural_festival.4201.desc_civil:0 "$cultural_festival.4201.desc$\"Chúng ta có thể mời những nông dân và thợ thủ công giỏi nhất trong lãnh thổ để phô bày tay nghề của họ. Hoặc có lẽ là tập hợp người dân địa phương để trình diễn lao động của họ và tập trung vào [ROOT.Char.GetCurrentLocation.GetName] thân yêu của chúng ta.\""
  cultural_festival.4201.desc_religious:0 "$cultural_festival.4201.desc$\"Chúng ta có thể mời những tín đồ sùng đạo nhất của [ROOT.Char.GetFaith.GetName] và các [stop_host_scope.GetFaith.PriestNeuterPlural] để cử hành cầu nguyện. Hoặc có lẽ là tổ chức một buổi thờ phụng [ROOT.Char.GetFaith.HighGodName] kính yêu của chúng ta cùng với người dân từ [ROOT.Char.GetCurrentLocation.GetName].\""
  cultural_festival.4201.desc_end:0 "\n\nĐó đều là những ý tưởng hay, tuy nhiên, người đưa ra quyết định cuối cùng vẫn là Ta."
  cultural_festival.4201.a.military:0 "Mang đến những hiệp sĩ và trang bị tốt nhất trong lãnh thổ của chúng ta!"
  cultural_festival.4201.a.civil:0 "Mang đến những thợ thủ công giỏi nhất trong lãnh thổ!"
  cultural_festival.4201.a.religious:0 "Mang đến những người mộ đạo nhất và các [stop_host_scope.GetFaith.PriestNeuterPlural] trong lãnh thổ!"
  cultural_festival.4201.b:0 "Dùng những gì chúng ta sẵn có."
  cultural_festival.4201.c:0 "Hãy làm điều gì đó đơn giản hơn."
  cultural_festival.4202.t:0 "$cultural_festival.4201.t$"
  cultural_festival.4202.desc:0 "[coordinator_scope.GetTitledFirstName] mời Ta tham gia một [stop_host_scope.Custom('GetParadeType')]. [coordinator_scope.GetSheHe|U] đảm bảo với Ta rằng [stop_host_scope.GetTitledFirstName] đã giám sát khâu chuẩn bị để mang đến cho Ta cuộc diễu hành tốt nhất mà [cultural_festival_scope.GetName] có thể tổ chức. Khi [coordinator_scope.GetSheHe] nói,"
  cultural_festival.4202.desc_military_best:0 "$cultural_festival.4202.desc$ những hiệp sĩ giỏi nhất trong lãnh thổ bắt đầu giao chiến. Họ liên tục đổi mục tiêu và di chuyển một cách linh hoạt, như thể đang khiêu vũ, và âm thanh kiếm va vào giáp nghe như âm nhạc.\n\nThật là một cảnh tượng đáng xem và Ta phải thừa nhận với [coordinator_scope.GetNameNoTooltip] rằng đây là cuộc diễu hành tuyệt vời nhất Ta từng thấy!"
  cultural_festival.4202.desc_military_good:0 "$cultural_festival.4202.desc$ một trung đoàn quân lính được trang bị đầy đủ giao đấu trên quảng trường chính của [cultural_festival_scope.GetNameNoTierNoTooltip].\n\nQuả thực là một màn phô diễn kỹ năng quân sự đầy ấn tượng."
  cultural_festival.4202.desc_military_worst:0 "$cultural_festival.4202.desc$ chỉ có vài binh lính đấu tập với nhau. Có vẻ như đó là tất cả những gì Ta sẽ thấy hôm nay, thật đáng tiếc, vì nó đã khiến Ta chán ngấy rồi. Ta thà nhìn một con ngựa gặm cỏ còn hơn là tốn thêm một phút xem cảnh này. Ta không hiểu sao [stop_host_scope.GetNameNoTooltip] lại nghĩ đây là một ý tưởng hay?"
  cultural_festival.4202.desc_civil_best:0 "$cultural_festival.4202.desc$ các thợ thủ công tụ họp từ khắp lãnh thổ trưng bày những sản phẩm thủ công tinh xảo nhất của họ.\n\n Ta chưa từng thấy những sản phẩm chất lượng đến vậy, người dân từ [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] quả thực rất tài năng."
  cultural_festival.4202.desc_civil_good:0 "$cultural_festival.4202.desc$ các thợ thủ công từ [cultural_festival_scope.GetNameNoTierNoTooltip] trưng bày những sản phẩm thủ công tinh xảo nhất của họ.\n\n Ta chưa từng thấy những sản phẩm chất lượng đến vậy. Ta thật sự ngạc nhiên vì điều này không được báo cho Ta sớm hơn, người dân từ [cultural_festival_scope.GetNameNoTierNoTooltip] quả thực rất tài năng."
  cultural_festival.4202.desc_civil_worst:0 "$cultural_festival.4202.desc$ một vài người dân địa phương trưng bày vài món đồ thủ công nào đó.\n\nTa chưa thấy gì mới mẻ cả. Thành thật mà nói, Ta khá thất vọng."
  cultural_festival.4202.desc_religious_best:0 "$cultural_festival.4202.desc$ một nhóm [stop_host_scope.GetFaith.PriestNeuterPlural] tụ tập tại quảng trường chính đang cầu nguyện với cường độ chưa từng thấy."
  cultural_festival.4202.desc_religious_good:0 "$cultural_festival.4202.desc$ các [stop_host_scope.GetFaith.DevoteeNeuterPlural] địa phương đang cầu nguyện tại quảng trường chính, bày tỏ sự tôn kính đối với [stop_host_scope.GetFaith.HighGodName]."
  cultural_festival.4202.desc_religious_worst:0 "$cultural_festival.4202.desc$ một nhóm người dân địa phương cầu nguyện với [stop_host_scope.GetFaith.HighGodName] bằng giọng đều đều.\n\nĐó thực sự là một trải nghiệm nhàm chán."
  cultural_festival.4202.desc_religious_different_faith_good:0 "\n\nTa không quen thuộc với tôn giáo [stop_host_scope.GetFaith.GetName]. Tuy nhiên, lòng sùng đạo của họ thật đáng nể."
  cultural_festival.4202.desc_religious_same_faith_good:0 "\n\nThật tốt khi thấy người dân từ [cultural_festival_scope.GetNameNoTierNoTooltip] sùng đạo với đức tin của chúng ta đến vậy."
  cultural_festival.4202.desc_religious_different_faith_bad:0 "\n\nTa không quen thuộc với tôn giáo [stop_host_scope.GetFaith.GetName]. Tuy nhiên, lòng sùng đạo của họ khiến Ta thấy sợ hãi."
  cultural_festival.4202.desc_religious_same_faith_bad:0 "\n\nThật đáng tiếc khi thấy [stop_host_scope.GetNameNoTooltip] dường như không sùng đạo như Ta từng nghĩ."
  cultural_festival.4202.a.revelry:0 "Đây là cuộc diễu hành tuyệt vời nhất Ta từng thấy!"
  cultural_festival.4202.a:0 "Ta có thể học hỏi được một hai điều từ [stop_host_scope.GetTitledFirstNameNoTooltip]."
  cultural_festival.4202.b:0 "Thật ra, Ta muốn xem một [stop_host_scope.Custom('GetLiegeParadeType')] hơn."
  cultural_festival.4203.t:0 "$cultural_festival.4201.t$"
  cultural_festival.4203.desc:0 "Sau cuộc diễu hành, Ta gặp [coordinator_scope.GetTitledFirstName] để hỏi về phản ứng của [visiting_liege.GetTitledFirstName].\n\n\"Thưa Lãnh chúa\""
  cultural_festival.4203.desc_success:0 "$cultural_festival.4203.desc$ Ta rất vui mừng thông báo rằng [visiting_liege.GetTitledFirstNameNoTooltip] vô cùng hài lòng với cuộc diễu hành. [visiting_liege.GetSheHe|U] thậm chí còn hỏi về việc chia sẻ phong tục giữa các lãnh thổ của chúng ta, để [visiting_liege.GetSheHe] có thể mang chúng trở về kinh đô tại [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTier].\"\n\nThật tuyệt khi được ghi nhận."
  cultural_festival.4203.desc_failure:0 "$cultural_festival.4203.desc$ Ta e rằng [visiting_liege.GetTitledFirstNameNoTooltip] thấy cuộc diễu hành thật nhàm chán. [visiting_liege.GetSheHe|U] nói rằng [visiting_liege.GetSheHe] thà xem một con ngựa gặm cỏ hoặc xem một [stop_host_scope.Custom('GetLiegeParadeType')].\"\n\nThật là một kẻ vô ơn!"
  cultural_festival.4203.a.success:0 "Ta mừng vì tất cả chúng ta đều đã có khoảng thời gian tuyệt vời."
  cultural_festival.4203.a.failure:0 "Ít nhất thì các thần dân của ta cũng đã vui vẻ."
  cultural_festival.4300.t:0 "Trao Đổi Quà Tặng"
  cultural_festival.4300.desc:0 "Ta vô cùng vinh dự khi được [visiting_liege.GetTitledFirstName] đến thăm, và để đáp lại, Ta nghĩ đến việc trao đổi quà tặng với [visiting_liege.GetHerHim] nhằm tạo dựng mối gắn kết bền chặt giữa chúng ta. Ta đang cân nhắc làm một món đồ cho dịp này, Ta có thể đặt làm một [newly_created_artifact.GetName]. $cultural_festival.4302.desc_gold$"
  cultural_festival.4300.desc_existing_artifact:0 "\n\nTa cũng có sẵn [existing_artifact.GetName] chỉ nằm đó mà thôi. Nó sẽ trở thành một món quà tuyệt vời, mang tính cá nhân hơn."
  cultural_festival.4300.tt:0 "[visiting_liege.GetShortUIName] sẽ phải chọn một món quà để trao đổi"
  cultural_festival.4300.a:0 "Ta sẽ tặng [existing_artifact.GetNameNoTooltip] cá nhân của mình."
  cultural_festival.4300.b:0 "Ta sẽ đặt làm [newly_created_artifact.GetNameNoTooltip] làm quà."
  cultural_festival.4300.c:0 "Chỉ cần vàng là đủ."
  cultural_festival.4300.d:0 "#EMP Không#!."
  cultural_festival.4301.t:1 "$cultural_festival.4300.t$"
  cultural_festival.4301.desc:0 "Ta được [stop_host_scope.GetTitledFirstName] tiến đến, trên tay cầm "
  cultural_festival.4301.desc_artifact:0 "[gifted_artifact.GetName].$cultural_festival.4301.desc_inbetween$\n\nTa trân trọng việc [stop_host_scope.GetSheHe] đã nghĩ đến điều này. $cultural_festival.4301.desc_end$"
  cultural_festival.4301.desc_gold:0 "một túi tiền.$cultural_festival.4301.desc_inbetween$\n\nTa vui vẻ nhận lấy số tiền đó, nhưng có vẻ như [stop_host_scope.GetSheHe] không biết nên tặng Ta thứ gì? $cultural_festival.4301.desc_end$"
  cultural_festival.4301.desc_inbetween:0 "\n\n\"Thưa Lãnh chúa, Ta vô cùng vinh dự khi ngài đến đây. Xin hãy nhận món quà này như một kỷ niệm của lễ hội văn hóa này. Một thứ sẽ nhắc chúng ta nhớ đến ngày hôm nay trong nhiều năm tới!\""
  cultural_festival.4301.desc_end:0 "Tuy nhiên, [stop_host_scope.GetSheHe] nhìn Ta với vẻ mong đợi, Ta tin rằng [stop_host_scope.GetSheHe] đang chờ Ta đáp lễ bằng một món quà?"
  cultural_festival.4301.a:0 "Món quà thật tinh xảo! Ta rất thích."
  cultural_festival.4301.a.tt:0 "Ngài trang bị [gifted_artifact.GetName]"
  cultural_festival.4301.b:0 "Món đồ vô dụng. Có lẽ ta có thể bán nó lấy phế liệu?"
  cultural_festival.4301.c:0 "Vàng sao? Thật chu đáo."
  cultural_festival.4301.tt:0 "Ngài sẽ phải chọn một món quà để trao đổi"
  cultural_festival.4302.t:1 "$cultural_festival.4300.t$"
  cultural_festival.4302.desc:0 "Ta rất vinh dự trước món quà này, tuy nhiên vì ta cũng phải đáp lễ nên tốt hơn hết là nghĩ ra thứ gì đó phù hợp, để không trông như một kẻ ngốc! Ta có thể sai người mang về cho ta [newly_created_artifact.GetName]"
  cultural_festival.4302.desc_existing_artifact:0 "$cultural_festival.4300.desc_existing_artifact$"
  cultural_festival.4302.desc_gifted_gold:0 "Có lẽ ta nên chọn cách dễ dàng, giống như [stop_host_scope.GetTitledFirstNameNoTooltip], và tặng [stop_host_scope.GetHerHim] vàng?"
  cultural_festival.4302.desc_gold:0 " Tuy nhiên, chỉ một túi tiền xu đơn giản làm quà tặng cũng luôn là lựa chọn an toàn, đúng không?"
  cultural_festival.4302.a:0 "$cultural_festival.4300.a$"
  cultural_festival.4302.b:0 "$cultural_festival.4300.b$"
  cultural_festival.4302.c:0 "$cultural_festival.4300.c$"
  cultural_festival.4302.d:0 "$cultural_festival.4300.d$"
  cultural_festival.4303.t:0 "$cultural_festival.4301.t$"
  cultural_festival.4303.desc:0 "Khi [visiting_liege.GetTitledFirstName] nhận món quà của ta, [visiting_liege.GetSheHe] liền đưa tay vào kho bạc của [visiting_liege.GetHerHis].\n\n\"Ta phải thừa nhận rằng ngươi đã khiến ta bất ngờ. Ta rất vinh dự trước món quà của ngươi và không có nhiều thứ để đáp lễ, nhưng xin hãy nhận lấy vật nhỏ bé này như một dấu hiệu cho lòng biết ơn của ta\"\n\n[visiting_liege.GetSheHe|U] trao cho ta "
  cultural_festival.4303.desc_artifact:0 "[gifted_artifact.GetName]. Ta trân trọng việc [visiting_liege.GetSheHe] đã bị thôi thúc phải đáp lễ, ta hoàn toàn không mong đợi điều đó."
  cultural_festival.4303.desc_gold:0 "một túi tiền xu. Có lẽ [visiting_liege.GetSheHe] không biết nên tặng ta thứ gì? Hay thực sự đã bị bất ngờ bởi ý tưởng tuyệt vời của ta!"
  cultural_festival.4303.a:0 "$cultural_festival.4301.a$"
  cultural_festival.4303.b:0 "$cultural_festival.4301.b$"
  cultural_festival.4303.c:0 "$cultural_festival.4301.c$"
  cultural_festival.4310.t:1 "Ký Ức Êm Đề"
  cultural_festival.4310.desc:0 "Ta dành khá nhiều thời gian bên cạnh [gift_receiver.GetTitledFirstName], điều này khiến ta nhớ lại một lễ hội trước đây mà chúng ta từng cùng tham dự từ rất lâu. Ta mơ hồ nhớ rằng [giving_gift_memory.GetDescription]. Giờ ta tự hỏi liệu [gift_receiver.GetSheHe] còn giữ nó không, có lẽ ta nên gợi chuyện với [gift_receiver.GetHerHim] về điều đó?"
  cultural_festival.4310.a:0 "Ta sẽ hỏi, một cách lịch sự."
  cultural_festival.4310.a.tt:0 "[gift_receiver.GetTitledFirstNameNoTooltip] sẽ quyết định điều gì xảy ra tiếp theo"
  cultural_festival.4310.b:0 "Không, ta không #EMP nhỏ nhen#! đến vậy."
  cultural_festival.4311.t:0 "$cultural_festival.4310.t$"
  cultural_festival.4311.desc:0 "[giving_gift_memory_owner.GetTitledFirstName] chào đón ta với vòng tay rộng mở.\n\n\"Thật là một lễ hội tuyệt vời! Nó khiến ta nhớ đến một lễ hội cũ mà chúng ta đã cùng tổ chức vài năm trước. Ngươi còn nhớ không? Ta tin rằng ta đã tặng ngươi một món quà nào đó, có lẽ ngươi có thể nhắc lại cho ta đó là gì không?\"\n\n"
  cultural_festival.4311.desc.old_gift:0 "Thực ra, ta vẫn còn giữ nó, đó là [old_gift.GetName]. Ta không chắc vì sao [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] lại dò hỏi về chuyện này, nhưng nhìn qua thì có vẻ như [giving_gift_memory_owner.GetSheHe] muốn lấy lại nó?"
  cultural_festival.4311.desc.decoy_gift:0 "Nghĩ lại thì, ta cũng có [decoy_gift.GetName] mà ta không còn dùng nữa. Có lẽ ta có thể thuyết phục [giving_gift_memory_owner.GetHerHim] tin rằng đó chính là món quà cũ của [giving_gift_memory_owner.GetHerHis]?"
  cultural_festival.4311.desc.lost_gift:0 "Đáng tiếc thay, ta tin rằng mình không còn giữ nó nữa. Không rõ ta đã làm mất nó như thế nào, nhưng [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] cũng đâu cần phải biết."
  cultural_festival.4311.desc.no_gift:0 "Có lẽ ta có thể lừa [giving_gift_memory_owner.GetHerHim] tin rằng [giving_gift_memory_owner.GetSheHe] đã nhầm ta với người khác?"
  cultural_festival.4311.a:0 "Được thôi, đây này."
  cultural_festival.4311.a.success:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] chỉ muốn được nhìn lại nó"
  cultural_festival.4311.a.failure:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] mong đợi một ân huệ"
  cultural_festival.4311.b:0 "Đúng vậy, chắc chắn là [giving_gift_memory_owner.GetSheHe] đã tặng ta [decoy_gift.GetNameNoTooltip]!"
  cultural_festival.4311.c:0 "[giving_gift_memory_owner.GetSheHe|U] chưa từng tặng ta bất cứ thứ gì."
  cultural_festival.4311.b.success:0 "Ngài thuyết phục được [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] rằng ông ta đã tặng Ngài [decoy_gift.GetNameNoTooltip]"
  cultural_festival.4311.b.failure:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] nhớ rõ món quà"
  cultural_festival.4311.c.success:0 "Ngài thuyết phục được [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] rằng ông ta chưa từng tặng Ngài thứ gì"
  cultural_festival.4311.c.failure:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] biết rằng [giving_gift_memory_owner.GetSheHe] đã tặng Ngài một món quà"
  cultural_festival.4311.d:0 "Ta phải thừa nhận rằng ta đã làm mất nó từ rất lâu rồi"
  cultural_festival.4311.proper_gift_taost:0 "Trưng bày đúng món quà"
  cultural_festival.4311.no_gift_toast:0 "Cố lừa [giving_gift_memory_owner.GetNameNoTooltip]"
  cultural_festival.4311.liege_failed_toast:0 "Hành động của Ngài bị đem ra chống lại Ngài"
  cultural_festival.4312.t:0 "$cultural_festival.4310.t$"
  cultural_festival.4312.desc:0 "[gift_receiver.GetTitledFirstName] trầm ngâm một lúc sau khi được hỏi về món quà.\n\n"
  cultural_festival.4312.desc.decoy_gift:0 ""Oh, yes, I remember as if it was yesterday! You gave me [decoy_gift.GetName]. I even still have it with me, do you want to hold it?"\n\n[gift_receiver.GetSheHe|U] looks very confident, as [gift_receiver.GetSheHe] swiftly orders [gift_receiver.GetHerHis] men to bring the gift."
  cultural_festival.4312.desc.decoy_gift_succeeded:0 "$cultural_festival.4312.desc.decoy_gift$ Tuy nhiên, có điều gì đó không ổn, ta chưa chắc đó là gì?"
  cultural_festival.4312.desc.decoy_gift_failed:0 "$cultural_festival.4312.desc.decoy_gift$ Tuy nhiên, thật là nực cười! Lại còn là một lời nói dối trắng trợn. Ta nhớ chính xác món quà mình đã tặng, [gift_receiver.GetSheHe] không thể lừa ta như vậy."
  cultural_festival.4312.desc.no_gift:0 "\"Ta e rằng ta không hiểu ngài đang nói về điều gì, [giving_gift_memory_owner.GetNameNoTooltip]? Có lẽ ngài đã nhầm ta với người khác, vì chúng ta chưa từng trao đổi quà tặng.\"\n\n"
  cultural_festival.4312.desc.no_gift_succeeded:0 "$cultural_festival.4312.desc.no_gift$Dường như ta chưa từng tặng [gift_receiver.GetHerHim] bất kỳ món quà nào? Chỉ mới giây trước ta còn thề rằng chúng ta đã trao quà cho nhau trong lễ hội trước. [gift_receiver.GetSheHe|U] tỏ ra rất chắc chắn rằng chuyện đó chưa từng xảy ra, có lẽ ta đã nhầm?"
  cultural_festival.4312.desc.no_gift_failed:0 "[gift_receiver.GetSheHe|U] khẳng định rằng ta chưa từng tặng [gift_receiver.GetHerHim] thứ gì. Thật là nực cười! Lại còn là một lời nói dối trắng trợn. Ta nhớ chính xác món quà mình đã tặng, [gift_receiver.GetSheHe] không thể lừa ta như vậy."
  cultural_festival.4312.desc.liege_lost_gift:0 "\"Với trái tim nặng trĩu, ta phải thừa nhận rằng ta đã làm mất nó từ rất lâu rồi. Xin hãy tha thứ cho ta.\"\n\nCó vẻ như ta đã đặt [gift_receiver.GetHerHim] vào một tình huống khó xử. Chuyện đó đã xảy ra từ nhiều năm trước và ta cũng không trách [gift_receiver.GetHerHim] vì đã làm mất nó. Thậm chí ta cũng không chắc mình đã mong đợi điều gì?"
  cultural_festival.4312.desc.show_real_gift_flag:0 "\"Đúng vậy, ta nhớ đó chính là [old_gift.GetName]! Ta tin rằng mình vẫn còn giữ nó nếu ngài muốn xem?\"\n\n[gift_receiver.GetSheHe|U] tự hào trưng ra [old_gift.GetNameNoTooltip]. Có vẻ như [gift_receiver.GetSheHe] đã bảo quản nó rất cẩn thận."
  cultural_festival.4312.a:0 "Thật tốt bụng từ phía [gift_receiver.GetHerHim]. Ta thực sự trân trọng điều đó."
  cultural_festival.4312.a.decoy_success:0 "Ồ, đây hẳn phải là món quà rồi, đúng không?"
  cultural_festival.4312.b.decoy_success_holup:0 "Khoan đã. Đây không phải món quà của ta!"
  cultural_festival.4312.b.decoy_fail:0 "Thật trơ trẽn! Đây không phải món quà của ta!"
  cultural_festival.4312.b.nogift_success_holup:0 "Không thể nào. Ta chắc chắn đã tặng [gift_receiver.GetHerHim] một món quà!"
  cultural_festival.4312.b.nogift_fail:0 "Thật trơ trẽn! Ta biết rõ là mình đã tặng [gift_receiver.GetHerHim] món quà đó!"
  cultural_festival.4312.b.holup:0 "Lời bào chữa thật tệ, thưa [ROOT.Char.Custom2('RelationToMe', gift_receiver )] của ta."
  cultural_festival.4312.c:0 "Có lẽ ta có thể lợi dụng điều này để chống lại [gift_receiver.GetHerHim]?"
  cultural_festival.4312.d:0 "Thật đáng tiếc."
  cultural_festival.4312.d.nogift_success:0 "Hừm, có lẽ ta đã nhầm với người khác?"

  cultural_acceptance_feast_of_fools:0 "Tán Thành Lễ Hội Kẻ Ngốc"
