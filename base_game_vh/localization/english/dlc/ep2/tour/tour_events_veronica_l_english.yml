  cultural_festival.2090.t:0 "Xếp Hàng!"
  cultural_festival.2090.desc:0 "Khi Ta xem đến màn biểu diễn nhạt nhẽo thứ năm mươi mà cái nơi thối tha [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] này có thể mang lại, Ta chỉ ước tất cả đám vũ công ấy gãy hết mọi cái xương có thể rồi biến đi cho khuất mắt.\n\nChờ đã… #EMP chính ta#! có thể đuổi chúng đi.\n\nTa hắng giọng trước khi cất lời: \"Hỡi những thần dân yêu quý của ta, ta vừa nghe được một tin cực kỳ đáng tiếc rằng các ngươi đã liên tục trộm cắp và phản bội trên khắp vùng đất này.\""
  cultural_festival.2090.a:0 "\"Sẽ thật đáng tiếc nếu có ai đó trừng phạt các ngươi vì những tội ác ấy...\""
  cultural_festival.2090.b:0 "\"Chẳng phải đây là đám nông dân từng nổi loạn chống lại ta sao? Bắt chúng lại!\""
  cultural_festival.2090.c:0 "\"Thả họ đi.\""
  festival_arrested_artists:0 "Giam Giữ Nghệ Sĩ Biểu Diễn"
  festival_no_prisoners:0 "Không Có Tù Nhân"
  festival_no_prisoners_desc:0 "Nhân vật này đã không giam giữ các nghệ sĩ biểu diễn trong lãnh địa trong Lễ Hội Văn Hóa"
  
  cultural_festival.2100.t:0 "Một Đóng Góp Xa Hoa"
  cultural_festival.2100.desc:0 "\"Nhìn kìa!\" Ta nghe thấy khi đang đi dọc các con phố của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_courtier'))] của Ta, [inspired_courtier.GetFirstName], đang chỉ về phía thứ trông giống như thứ được gọi là [guild_location.GetCounty.GetFaith.WealthGodNamePossessive] [guild_location.Custom('GetGuildType')]; một nụ cười hạnh phúc nhanh chóng hiện lên trên gương mặt [inspired_courtier.GetHerHis].\n\nMột nhóm học việc đang quỳ trước bàn làm việc. Người thợ cả giám sát công việc từ khung cửa, khoanh tay, ngẩng cao đầu. \"Con cần thêm một chút sức nữa cho việc đó, nhóc ạ.\"\n\n[inspired_courtier.GetFirstName] bước về phía họ, hoàn toàn bị mê hoặc."
  cultural_festival.2100.a:1 "Những người này đáng để giúp đỡ."
  cultural_festival.2100.b:1 "Chúng ta cũng nên đầu tư vào các thương nhân ở quê nhà..."
  cultural_festival.2100.c:0 "\"Cứ đi đi, [inspired_courtier.GetFirstNameNoTooltip], tới thăm họ đi.\""
  cultural_festival.2100.c.success:0 "[inspired_courtier.GetShortUIName] tìm thấy con đường của [inspired_courtier.GetHerHis]"
  cultural_festival.2100.c.failure:0 "[inspired_courtier.GetShortUIName] trở nên tò mò"
  discounted_guild_holding_build_cost_modifier:0 "Công Trình Đô Thị"
  
  cultural_festival.2110.t:0 "Một Nghệ Sĩ Biểu Diễn Bất Ngờ"
  cultural_festival.2110.desc.intro:0 "Những người nhào lộn nhảy múa trong trang phục sặc sỡ, một người trong số họ há miệng bắt lấy quả bóng do người khác ném tới và đám đông bùng nổ trong tiếng reo hò."
  cultural_festival.2110.desc.callous:0 "Dễ bị mua vui thật."
  cultural_festival.2110.desc.outro:0 "\n\nÂm nhạc nhanh chóng vang lên sau đó. Ta đã từng nghe bài hát này trước đây. Có lẽ vậy. Phần lớn chúng nghe quá giống nhau. Ngay cả từ trên bục cao Ta cũng có thể nghe thấy đám nông dân hát theo đầy ồn ào.\n\n“Và nhảy múa giữa những cánh đồng của...” #EMP “gâu! Gâu gâu!”#! một sinh vật quyết định xen vào, cướp lấy những quả bóng tung hứng.\n\n#EMP “Bắt con chó đó lại!”#!"
  cultural_festival.2110.a:0 "Ta có thể mang nó về cùng mình..."
  cultural_festival.2110.b:0 "Một người Ngài đồng hành hoàn hảo cho [my_heir.GetFirstNameNoTooltip]!"
  cultural_festival.2110.c:0 "Aw... ta không cưỡng lại được việc vuốt ve nó!"
  cultural_festival.2110.d:0 "Ặc, đúng là một con thú phiền phức."
  cultural_festival.2110.e:0 "Ta phải giữ nguyên vị trí."
  cultural_festival_2110_d_tt:0 "Ngài đá con chó"
  cultural_festival_2110_d_opinion_tt:0 "Mọi nhân vật tham dự không có đặc tính Lạnh Lùng hoặc Tàn Bạo"
  available_because_intent_tt:0 "#EMP #low This option is available because of your [THIS.Char.GetInvolvedActivityIntent.GetName|V] [intent|E]#!#!"
  
  #Tour Cultural Festival Events - Bilateral 
  cultural_festival.3000.t:0 "Vở Kịch Lớn"
  cultural_festival.3000.desc:0 "Một cơ hội lớn mở ra trước mắt Ta khi lãnh chúa của Ta, [visiting_liege.GetTitledFirstName], đến thăm. Ta hoàn toàn có thể tận dụng cuộc gặp gỡ định mệnh này để giành được thiện cảm của [visiting_liege.GetHerHis] và có lẽ sẽ dễ đạt được điều mình muốn hơn…\n\nCó lẽ Ta có thể tổ chức một vở kịch tái hiện những chiến công vĩ đại của [visiting_liege.GetHerHis]?"
  cultural_festival.3000.a:0 "Một cơ hội hoàn hảo để giành được sự ưu ái của lãnh chúa!"
  cultural_festival.3000.a.tt:0 "Lãnh chúa của Ngài sẽ đánh giá cao một màn khắc họa hay..."
  cultural_festival.3000.b:0 "Ta sẽ không tiêu vàng cho việc này."
  
  cultural_festival.3001.t:0 "Vở Kịch Lớn: Một Lời Khen?"
  cultural_festival.3001.desc:0 "The stage has been set for the play, right in the middle of the square. Festive wreaths hang from the poles and the interpreters are finishing the last details of the script. "Of course [visiting_liege.GetSheHe] would never like apples, you moron!" I hear the playwright complaining to the main actor.\n\nI wait until the end of the rehearsal and [liege_actor.GetSheHe]'s quick to approach me before I leave. [ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [liege_actor.GetSheHe] puts [liege_actor.GetHerHis] hands together, almost begging, "Do you have any insight on how I should portrait [visiting_liege.GetTitledFirstNameNoTooltip]?""
  cultural_festival.3001.compassionate:0 "\"Trái tim nhân hậu của [visiting_liege.GetShortUIName] nên được thể hiện ở đây.\""
  cultural_festival.3001.bold:0 "\"[visiting_liege.GetShortUIName] luôn hành động vô cùng dũng cảm!\""
  cultural_festival.3001.honorable:0 "\"Không gì quan trọng với [visiting_liege.GetShortUIName] hơn danh dự.\""
  cultural_festival.3001.greed:0 "\"Tham vọng của [visiting_liege.GetShortUIName] là vô hạn!\""
  cultural_festival.3001.rational:0 "\"[visiting_liege.GetShortUIName] luôn giữ phong thái điềm tĩnh ấy.\""
  cultural_festival.3001.zealous:0 "\"Hãy thể hiện sự mộ đạo của [visiting_liege.GetWomanMan] [visiting_liege.GetShortUIName]!\""
  cultural_festival.3001.energetic:0 "\"Hãy nhớ rằng [visiting_liege.GetSheHe] luôn sẵn sàng hành động!\""
  cultural_festival.3001.forgiving:0 "\"Hãy chắc chắn thể hiện lòng nhân từ phi thường của [visiting_liege.GetHerHis].\""
  cultural_festival.3001.beautiful:0 "\"Người ta có thể ngất xỉu chỉ vì vẻ đẹp của [visiting_liege.GetHerHis]!\""
  cultural_festival.3001.strong:0 "\"Sức mạnh thể chất của [visiting_liege.GetHerHis] là vô song.\""
  cultural_festival.3001.extroverted:0 "\"Hãy cho thấy mọi người yêu mến và ngưỡng mộ [visiting_liege.GetHerHim] thế nào.\""
  cultural_festival.3001.dominant:0 "\"Hãy phản ánh khí chất áp đảo mà [visiting_liege.GetSheHe] toát ra.\""
  cultural_festival.3001.negative:0 "\"Thực ra thì — bộ trang phục hề sẽ rất hợp với [visiting_liege.GetHerHim]...\""
  cultural_festival.3001.tt:0 "#F Việc [visiting_liege.GetTitledFirstName] đón nhận màn khắc họa này thế nào phụ thuộc vào mức độ phù hợp với [visiting_liege.GetHerHim]#!"
  cultural_festival.3001.negative.flavor:0 "Lãnh chúa của ta sẽ không thích, nhưng #EMP ta#! thì có."
  dressed_liege_like_buffon_modifier:0 "Chỉ Là Đùa Thôi"
  dressed_liege_like_buffon_modifier_desc:0 "Nhân vật này đã quyết định khắc họa lãnh chúa của mình như một tên hề trong vở kịch lễ hội."
  
  cultural_festival.3002.t:0 "Vở Kịch Lớn"
  cultural_festival.3002.desc.intro:0 "Một sân khấu gỗ sừng sững giữa quảng trường. Những vòng hoa lễ hội treo trên các cột trụ và các diễn viên ẩn mình ở một bên, cười khúc khích, trò chuyện. Tất cả đều im lặng khi [stop_host_scope.GetTitledFirstName] bước vào, [stop_host_scope.GetHerHis] ưỡn ngực đầy tự hào.\n\n\"Ta xin tuyên bố rằng vở kịch vinh danh vị khách danh dự nhất của chúng ta, [ROOT.Char.GetTitledFirstNameNoTooltip], sắp bắt đầu — xin mời thưởng thức!\"\n\nCâu chuyện tiếp diễn không dứt, kể về những con phố của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] và các chiến công của ta."
  cultural_festival.3002.desc.good:0 "Thật dễ chịu khi được ca tụng như thế này!"
  cultural_festival.3002.desc.neutral:0 "Không có gì đáng chú ý."
  cultural_festival.3002.desc.bad:0 "Ta không thể tin đây là cách họ nghĩ ta sẽ hành xử."
  cultural_festival.3002.desc.buffoon:0 "Và kia là ta... ăn mặc như một #EMP tên hề#! ư?"
  cultural_festival.3002.a:0 "\"Đây là lời khen tuyệt vời nhất ta từng nhận!\""
  cultural_festival.3002.a.toast:0 "Lời khen tuyệt vời nhất"
  cultural_festival.3002.b:0 "Ừ thì... có lẽ vẫn còn đỡ hơn."
  cultural_festival.3002.b.toast:0 "Một vở kịch giải trí"
  cultural_festival.3002.c:0 "Sao họ lại hiểu ta #EMP sai#! đến vậy?"
  cultural_festival.3002.c.toast:0 "Một màn trình diễn xúc phạm"
  cultural_festival.3002.d.toast:0 "Màn trình diễn tệ hại nhất"
  cultural_festival.3002.d:0 "Các ngươi nghĩ mình đang làm cái gì vậy!?"
  cultural_festival.3002.e:0 "Ta không thể nói cho [stop_host_scope.GetHerHim] biết suy nghĩ thật của mình."
  cultural_festival.3002.e.toast:0 "[visiting_liege.GetTitledFirstName] dường như đã thích vở kịch"
  festival_good_play:0 "Vở Kịch Hay"
  festival_neutral_play:0 "Vở Kịch Trung Bình"
  festival_bad_play:0 "Vở Kịch Dở"
 
  cultural_festival.3010.t:0 "Một Mùa Xuân Tuyệt Diệu"
  cultural_festival.3010.desc:0 "Ta đi dạo trong khuôn viên lâu đài và dừng lại bên đài phun nước, dành chút thời gian quan sát dòng nước chảy trên những phiến đá cẩm thạch. Một con mèo rình rập trong khu vườn được chăm sóc cẩn thận, uốn cong lưng trước khi rời đi.\n\nTa chạm tay vào phù điêu trên ống bạc — huy hiệu gia tộc của ta. Giá như... à! Ta có thể gây ấn tượng với [visiting_liege.GetTitledFirstName] nếu để nó chảy bằng một thứ khác..."
  cultural_festival.3010.a:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U], tất nhiên rồi!"
  cultural_festival.3010.b:0 "Một loại nước trái cây ngon lành sẽ dễ hơn."
  cultural_festival.3010.c:0 "Không đáng để tốn thời gian cho việc này."
  alcohol_fountain_modifier:0 "Đài Phun Nước Tuyệt Diệu"
  alcohol_fountain_modifier_desc:0 "Nhân vật này đã quyết định để đài phun nước chảy rượu thay vì nước."
  juice_fountain_modifier:0 "$alcohol_fountain_modifier$"
  juice_fountain_modifier_desc:0 "Nhân vật này đã quyết định để đài phun nước chảy nước trái cây thay vì nước."
 
  cultural_festival.3011.t:0 "Suối Kỳ Diệu"
  cultural_festival.3011.desc.intro:0 "Ta theo chân [stop_host_scope.GetTitledFirstName] khi [stop_host_scope.GetSheHe] dẫn Ta tham quan lễ hội. \"Và bây giờ,\" [stop_host_scope.GetSheHe] lên tiếng khi chúng Ta bước vào khuôn viên lâu đài, \"là điều mà ta hy vọng sẽ khiến ngài bất ngờ.\" Ta nhướng mày khi trước mắt hiện ra một đài phun nước tuyệt đẹp, toàn bằng đá trắng, với một ống bạc và dòng chảy dồi dào của thứ trong suốt..."
  cultural_festival.3011.desc.alcohol:0 "#EMP [stop_host_scope.Custom('RegionalAlcoholicDrink')]?#!"
  cultural_festival.3011.desc.juice:0 "#EMP nước ép?#!"
  cultural_festival.3011.desc.outro:0 "\n\nMột vài người tụ tập xung quanh, cười đùa và ném tiền xu vào giếng."
  cultural_festival.3011.a:0 "Hãy cùng nhau uống!"
  cultural_festival.3011.b:0 "Sẽ thật phí nếu không ước một điều!"
  festival_wishing_well_modifier:0 "Giếng Ước Nguyện"
  drank_together_modifier:0 "Cùng Uống Từ Đài Phun"
 
  cultural_festival.3020.t:0 "Lời Nhắc Nhở Trung Thành"
  cultural_festival.3020.desc:0 "The sky above [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] is clouded and the gray streamers of the night start to wander around the narrow alleys. [stop_host_scope.GetTitledFirstNamePossessive] hold rises at the top of the hill, almost defiant. [stop_host_scope.GetSheHe|U] could use a reminder of who [stop_host_scope.GetSheHe] serves.\n\nI am [ROOT.Char.GetTitleAsNameNoTooltip] by divine right. The crown hangs over my head like the moon above all the other stars. No matter how brightly you shine, #EMP I#! prevail."
  cultural_festival.3020.a:0 "[stop_host_scope.GetFirstNameNoTooltip] shall renew [stop_host_scope.GetHerHis] homage to me."
  cultural_festival.3020.a.tt:0 "Điều này sẽ có lợi cho Ngài, nhưng chư hầu của Ngài có thể sẽ không thích..."
  cultural_festival.3020.b:0 "Cứ tận hưởng lễ hội thôi!"
  festival_no_homage_modifier:0 "Chủ Quân Khiêm Nhường"
  festival_no_homage_modifier_desc:0 "Nhân vật này đã chọn không tổ chức nghi lễ triều cống xa hoa mà thay vào đó là tận hưởng niềm vui."
 
  cultural_festival.3021.t:0 "Lời Nhắc Nhở Trung Thành: Triều Cống"
  cultural_festival.3021.desc:0 "Mọi cây nến trong căn phòng đều cháy rực để xua đi bóng tối bên ngoài. Những luồng gió lạnh luồn qua các khe đá quanh cửa sổ. [stop_host_scope.GetTitledFirstName] quỳ trước mặt ta, và ta đưa tay ra nắm lấy tay [stop_host_scope.GetHerHis].\n\n\" Bạn củata,\" ta bắt đầu và siết chặt tay hơn, \"ngươi đặt tay mình vào tay ta thay cho trái tim chúng ta. Ta đánh giá cao lòng trung thành của ngươi, và vì thế ta yêu cầu ngươi phải...\""
  cultural_festival.3021.a:0 "\"vàng.\""
  cultural_festival.3021.b:0 "\"binh lính.\""
  cultural_festival.3021.a.tt:0 "Điều này sẽ #Bold không#! chặn Hợp đồng Chư hầu."
  cultural_festival.3021.c:0 "\"lòng trung thành.\""
  cultural_festival.3021.c.flavor:0 "...đổi lại là của ta."
  cultural_festival.3021.d:0 "\"tình bằng hữu.\""
 
  cultural_festival.3022.t:0 "Lời Nhắc Nhở Trung Thành: Dâng Triều Cống"
  cultural_festival.3022.desc.intro:0 "It is a solemn night when [visiting_liege.GetTitledFirstName] summons me to my own throne room. [visiting_liege.GetSheHe|U] has sent notice to my entourage talking about a "renewed homage ceremony". I take a deep breath before entering the room — there [visiting_liege.GetSheHe] is, sitting on #EMP my#! chair. A liege is a liege. [visiting_liege.GetSheHe|U]'ll make sure I never forget.\n\nI kneel in front of [visiting_liege.GetHerHim] and [visiting_liege.GetSheHe] takes my hands into [visiting_liege.GetHersHis]. "My friend," [visiting_liege.GetSheHe] says, "you give your hands into my hands in the place of our hearts. I think highly of your fidelity, and as such I demand your"
  cultural_festival.3022.desc.friends:0 "\"tình bằng hữu.\""
  cultural_festival.3022.desc.hook:0 "\"lòng trung thành.\""
  cultural_festival.3022.desc.levies:0 "\"binh lính.\""
  cultural_festival.3022.desc.money:0 "\"vàng.\""
  cultural_festival.3022.a:0 "\"Ngài cứ lấy.\""
  cultural_festival.3022.b:0 "\"Họ là của ngài.\""
  cultural_festival.3022.annoyed:0 "Nghĩa Vụ Chư Hầu"
  cultural_festival.3022.d:0 "\"Và ta sẵn lòng dâng hiến!\""
  cultural_festival.3022.d.friends:0 "Mối Quan Hệ Khăng Khít"
  cultural_festival.3022.money:0 "[visiting_liege.GetShortUIName] tăng thuế trong Hợp đồng Chư hầu của Ngài"
  cultural_festival.3022.levies:0 "[visiting_liege.GetShortUIName] tăng quân dịch trong Hợp đồng Chư hầu của Ngài"
  cultural_festival.3022.hook:0 "[visiting_liege.GetShortUIName] nắm giữ một móc Lòng Trung Thành với Ngài"
 
  cultural_festival.3030.t:0 "Dành Cho Kẻ Đẹp Nhất!"
  cultural_festival.3030.desc:0 "Khi ta dạo bước trên những con phố của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], cố gắng nghĩ ra ý tưởng mới cho Lễ Hội Văn Hóa, một người nông dân địa phương rụt rè tiến đến. Con [ROOT.Char.Custom('RegionalFarmAnimal')] mà [local_farmer.GetSheHe] dắt theo phía sau [local_farmer.GetHerHim] dừng lại để nhai thứ gì đó dưới đất.\n\n\"Thưa chủ quân,\" [local_farmer.GetSheHe] nói với vẻ ngày càng phấn khích, \"ngài có muốn làm giám khảo cho cuộc thi sắc đẹp của chúng Ta không? Bé Sturdy của Ta chắc chắn sẽ chiến thắng.\" \n\nTa liếc nhanh con [ROOT.Char.Custom('RegionalFarmAnimal')] của [local_farmer.GetHerHis], lúc này đang bận rộn gặm lá. Nếu như... ta để [visiting_liege.GetTitledFirstName] làm giám khảo thì sao?"
  cultural_festival.3030.a:0 "\"Hãy bắt đầu chuẩn bị!\""
  cultural_festival.3030.b:0 "Không đời nào [visiting_liege.GetFirstNameNoTooltip] lại thích chuyện này."
  farm_contest_modifier:0 "Tổ Chức Cuộc Thi Gia Súc"
 
  cultural_festival.3031.t:0 "Dành Cho Kẻ Đẹp Nhất...?"
  cultural_festival.3031.desc:0 "The stage in [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] has been set up with hay, flowers and... interesting guests. Three different [stop_host_scope.Custom('RegionalFarmAnimalPlural')] stand in the center, accompanied by their proud owners. [stop_host_scope.GetTitledFirstName] gestures to me from the other end of the dais: "Ah, there is our judge!"\n\nI look around, trying to see if [stop_host_scope.GetSheHe]'s referring to me, but there's no mistake. I start walking towards [stop_host_scope.GetHerHim] while [stop_host_scope.GetSheHe] continues: "Welcome to our annual Animal Fair, where the prettiest [stop_host_scope.Custom('RegionalFarmAnimal')] will be crowned!" When [stop_host_scope.GetSheHe] talks I notice that [stop_host_scope.GetSheHe]'s sneakily pointing at the one on the left."
  cultural_festival.3031.a:0 "\"Rõ ràng là con bên trái!\""
  cultural_festival.3031.b:0 "\"Con dễ nhìn kia mang vẻ đẹp quen thuộc...\""
  cultural_festival.3031.c:0 "\"[stop_host_scope.GetCulture.GetNameNoTooltip] [stop_host_scope.Custom('RegionalFarmAnimalPlural')] quả thật là đẹp nhất!\""
  cultural_festival.3031.d:0 "\"Ta thậm chí chẳng buồn tham gia chuyện này.\""
  cultural_festival.3031.e:0 "Ồ, ta biết chính xác con [stop_host_scope.Custom('RegionalFarmAnimal')] nào là tốt nhất..."
  cultural_festival.3031.e.tt:0 "Ngài trao vương miện cho đối thủ của mình [farm_animal_rival.GetShortUIName]"
  favourite_animal_contest_modifier:0 "Chấm Thi Gia Súc"
  underdog_animal_contest_modifier:0 "Tôn Vinh Gia Súc Xấu Xí"
  underdog_animal_contest_modifier_desc:1 "Nhân vật này đã chọn một con vật có vẻ ngoài xấu xí làm người chiến thắng trong cuộc thi sắc đẹp."
  mocked_animal_fair_modifier:0 "Chế Nhạo Hội Chợ Gia Súc"
  cultural_acceptance_farm_contest:0 "Cuộc Thi Gia Súc"
 
