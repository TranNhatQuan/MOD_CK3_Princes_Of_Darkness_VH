l_english:
 #Tour General Events
 ##Bilateral Vassal Events
 #Vassal: Your liege just suggested to purge all local cats/dogs
  tour_general.1003.t:0 "$activity_tour$: Một Đề Xuất Man Rợ"
  tour_general.1003.desc_purge_cats:0 "Khi đi dạo quanh khu đất, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] của Ta là [visiting_liege.GetTitledFirstName] vừa công khai bày tỏ sự ghê tởm cháy bỏng của [visiting_liege.GetHerHis] đối với loài mèo và đồng loại của chúng."
  tour_general.1003.desc_purge_dogs:0 "Khi đi dạo quanh khu đất, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] của Ta là [visiting_liege.GetTitledFirstName] vừa công khai bày tỏ sự ghê tởm của [visiting_liege.GetHerHis] đối với lũ chó hạ đẳng và loài chó nói chung."
  tour_general.1003.desc_pet_cat_outro:0 "Khi chúng Ta trở về chỗ ở của Ta, con mèo [ROOT.Char.Custom('CatStoryName')] của Ta thong thả tiến lại với tiếng gừ gừ thân thiện; theo cái cách mà [ROOT.Char.Custom('CatStorySheHe')] vẫn thường làm mỗi khi Ta về nhà.\n\nKhi Ta nhẹ nhàng vuốt ve đôi tai mềm mại và ria mép của [ROOT.Char.Custom('CatStoryHerHis')], Ta cảm nhận được ánh nhìn như thiêu đốt của [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] sau lưng. Ta chợt nhận ra việc thanh trừng #EMP toàn bộ#! mèo sẽ thực sự có ý nghĩa gì, và bụng Ta chùng xuống.\n\n\"Ta #EMP sẵn sàng#! chấp nhận chỉ riêng cái cá thể đáng ghê tởm kia,\" [visiting_liege.GetTitleAsNameNoTooltip] nói khẽ, với giọng ngọt ngào đến bệnh hoạn."
  tour_general.1003.desc_pet_dog_outro:0 "Khi chúng Ta trở về nơi ở của Ta, con chó [ROOT.Char.Custom('DogStoryName')] của Ta chạy tới với ánh mắt hiền lành và chào đón Ta bằng một cái cọ mũi đầy nghi thức.\n\nÁnh nhìn sắc bén của [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] di chuyển giữa Ta và con chó khi Ta âu yếm vuốt ve [ROOT.Char.Custom('DogStoryName')] sau tai. Ta khựng lại trong giây lát, nhận ra việc thanh trừng #EMP toàn bộ#! chó sẽ đồng nghĩa với điều gì.\n\n\"Ta #EMP sẵn sàng#! chấp nhận chỉ riêng cái cá thể kinh tởm kia,\" [visiting_liege.GetTitledFirstNameNoTooltip] nói khẽ, với giọng ngọt ngào đến bệnh hoạn."
  tour_general.1003.desc_default_outro:0 "\n\nTrở về phòng riêng, chúng Ta lấy đồ uống và Ta suy ngẫm về tình thế tiến thoái lưỡng nan này. Ta có thể cảm nhận được [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] đang nhìn chằm chằm vào mình, chờ đợi câu trả lời của Ta cho câu hỏi về cuộc diệt chủng loài vật."
  tour_general.1003.a_cat:0 "Ôi, [ROOT.Char.Custom('CatStoryName')]..."
  tour_general.1003.a_dog:0 "Con là một [ROOT.Char.Custom('DogStoryGirlBoy')] ngoan, [ROOT.Char.Custom('DogStoryName')]..."
  tour_general.1003.a_cat.flavor:0 "Sự hi sinh của [ROOT.Char.Custom('CatStoryNamePossessive')] sẽ cứu những con mèo còn lại."
  tour_general.1003.a_dog.flavor:0 "Sự hi sinh của [ROOT.Char.Custom('DogStoryNamePossessive')] sẽ cứu những con chó còn lại."
  tour_general.1003.b:0 "Hãy thanh trừng lũ [visiting_liege.Custom('HateCatsDogs')] hoang."
  tour_general.1003.c:0 "Ta không muốn dính líu đến chuyện này."

 ##Vassal Events
 #Find secret/hook on your liege/key member of liege's court
  tour_general.2000.t:0 "$activity_tour$: Lỡ Lời"
  tour_general.2000.desc_intro:0 "Đống lửa trại nổ lách tách khi buổi ăn mừng dành cho [visiting_liege.GetTitledFirstName] của chúng Ta kéo dài đến tận khuya. Ta đi vòng quanh, tán gẫu và uống rượu cùng những người trong đoàn tùy tùng của [visiting_liege.GetHerHis].\n\nỞ một góc xa hơn của khu vực lửa trại, Ta để ý thấy [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] [visiting_liege.Custom2('RelationToMeShort', SCOPE.sC('2000_secret_holder'))] là [2000_secret_holder.GetTitledFirstName], rõ ràng đã say mềm và lờ đờ với tay tìm thêm một ly rượu.\n\nKhi Ta lại gần hơn, Ta nghe thấy [2000_secret_holder.GetHerHim] lẩm bẩm: "
  tour_general.2000.desc_liege:0 "\"Ôi [visiting_liege.GetTitledFirstNameNoTooltip], sao ngài lại cứ mê mẩn cái...\""
  tour_general.2000.desc_self:0 "\"[2000_secret_holder.GetFirstNameNoTooltip], tỉnh lại đi! Đừng cứ si mê chuyện...\""
  tour_general.2000.desc_outro:0 "[2000_secret_holder.GetSheHe] quickly stops [2000_secret_holder.GetHerselfHimself] when [2000_secret_holder.GetSheHe] notices my presence."
  tour_general.2000.a:0 "Ồ, ta cũng có những nỗi khổ riêng, ngươi biết mà..."
  tour_general.2000.a_liege:0 "Ồ, #EMP ta#! sẽ không nói với ai đâu..."
  tour_general.2000.a_spill_beans.t:0 "Học Được Bí Mật"
  tour_general.2000.a_spill_beans.desc:0 "Thành công moi được bí mật từ [2000_secret_holder.GetShortUIName]"
  tour_general.2000.a_liege_beans.tt:0 "Ngài học được một bí mật về [visiting_liege.GetShortUIName]"
  tour_general.2000.a_self_beans.tt:0 "Ngài học được một bí mật về [2000_secret_holder.GetShortUIName]"
  tour_general.2000.a_unsuccessful.t:0 "Hành Vi Đáng Ngờ"
  tour_general.2000.a_unsuccessful.desc:0 "[2000_secret_holder.GetShortUIName] bắt đầu nghi ngờ Ngài"
  tour_general.2000.b:0 "Rời đi ngay lúc này."
 #Help liege entourage member, gain scheme progress
  tour_general.2001.t:0 "$activity_tour$: Một Tình Huống Trớ Trêu"
  tour_general.2001.desc_hashish:0 "Ta bắt gặp [2001_precarious_entourage_character.GetTitledFirstName] khi đang kiểm tra các cỗ xe trong đoàn tùy tùng của lãnh chúa. [2001_precarious_entourage_character.GetSheHe|U] trông khác thường một cách bồn chồn, mắt liên tục đảo qua lại trong khi [2001_precarious_entourage_character.GetSheHe] cứ loay hoay với thứ gì đó trong túi của [2001_precarious_entourage_character.GetHerHis].\n\nTa cúi người lại gần, nhận thấy đôi mắt đỏ hoe của [2001_precarious_entourage_character.GetHerHis] khi [2001_precarious_entourage_character.GetSheHe] ngước lên nhìn Ta và cười gượng: \"[ROOT.Char.GetTitledFirstNameNoTooltip], xin thứ lỗi cho bộ dạng thảm hại của Ta. Dường như Ta đã làm thất lạc một ít... thuốc men. Ngài có tình cờ biết gì về #EMP thứ thảo dược đó#! không?\""
  tour_general.2001.desc_privy:0 "Trên đường băng qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] để gặp vị [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] [visiting_liege.GetTitledFirstName] đang ghé thăm, Ta bất chợt nghe thấy một tiếng kêu bị bóp nghẹt. Ta dừng lại lắng nghe, rồi bắt đầu tiến về phía âm thanh đó.\n\nNó dẫn Ta đến một nhà xí trong một con hẻm hẹp, nơi Ta nghe rõ một giọng nói cầu cứu: \"Tên Ta là [2001_precarious_entourage_character.GetTitledFirstName], và có vẻ như Ta đang bị... mắc kẹt,\" giọng nói thú nhận."
  tour_general.2001.desc_outro:0 "\n\n\"Nếu ngài tốt bụng giúp Ta thoát ra, Ta có thể chia sẻ một vài thông tin giá trị về triều đình của chúng ta...\" [2001_precarious_entourage_character.GetSheHe] van nài."
  tour_general.2001.a:0 "Chờ đó, ta sẽ kéo ngươi ra."
  tour_general.2001.a_hashish:0 "Để ta xem có thể làm được gì."
  tour_general.4004.a_discreet.t:0 "Thoát Nhà Xí Thành Công"
  tour_general.4004.a_discreet.desc:0 "Ngài khéo léo giúp [2001_precarious_entourage_character.GetShortUIName] rời khỏi nhà xí"
  tour_general.4004.a_stained.t:0 "Bị Lấm Bẩn"
  tour_general.4004.a_stained.desc:0 "Bộ trang phục yêu thích của Ngài bị bẩn trong quá trình cố gắng"
  tour_general.2001.a_success.t:0 "Tăng Tỷ Lệ Thành Công Âm Mưu"
  tour_general.2001.a_success.desc:0 "[2001_precarious_entourage_character.GetShortUIName] chia sẻ thông tin thú vị về [2001_scheme_target.GetShortUIName]"
  tour_general.2001.a_secrecy.t:0 "Tăng Độ Bí Mật Âm Mưu"
  tour_general.2001.a_secrecy.desc:0 "[2001_precarious_entourage_character.GetShortUIName] chia sẻ thông tin về các lối đi bí mật"
  tour_general.2001.b:0 "Lúc này có chút hashish thì hay biết mấy."
  tour_general.2001.b_super_success.t:0 "Tăng Mạnh Tỷ Lệ Thành Công Âm Mưu"
  tour_general.2001.b_super_success.desc:0 "[2001_precarious_entourage_character.GetShortUIName] chia sẻ thông tin cực kỳ giá trị về [2001_scheme_target.GetShortUIName]"
  tour_general.2001.b_super_secrecy.t:0 "Tăng Mạnh Độ Bí Mật Âm Mưu"
  tour_general.2001.b_super_secrecy.desc:0 "[2001_precarious_entourage_character.GetShortUIName] chia sẻ thông tin về các đường hầm bí mật"
  tour_general.2001.b_spaceout.t:0 "Lơ Đãng"
  tour_general.2001.b_spaceout.desc:0 "Ngài và [2001_precarious_entourage_character.GetShortUIName] hoàn toàn lơ đãng"
  tour_general.2001.c:0 "Ta... không. Chuyện này thật không xứng đáng."

 ##Bilateral Liege Events
 #Liege: You are a fanatical cat/dog person
  tour_general.3003.t_cat:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Đây Là Thế Giới Của Loài Mèo"
  tour_general.3003.t_dog:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Đây Là Thế Giới Của Loài Chó"
  tour_general.3003.desc_love_cats:0 "Trong lúc lang thang trên những con phố của [ROOT.Char.GetCurrentLocation.GetName], với [stop_host_scope.GetTitledFirstName] ở bên cạnh, ta bị một con chó hoang tiếp cận. Nhìn xa hơn dọc theo con đường, cả một bầy chó dại đang chạy nháo nhào và gây náo loạn.\n\nTa nhếch môi đầy ghê tởm. Những sinh vật #EMP đó#!. Thiếu đi sự duyên dáng tự nhiên của loài mèo, ngửi mông của chính chúng và của kẻ khác, liếm láp... #EMP khiếp thật#!... rõ ràng chúng là những sinh vật hạ đẳng. Và ở nơi này, chúng quả thực là một mối phiền toái.\n\nKhông, nơi này sẽ tốt hơn nếu những con dịch hại đó được xử lý."
  tour_general.3003.desc_love_dogs:0 "Trong lúc khám phá các con phố của [ROOT.Char.GetCurrentLocation.GetName], với [stop_host_scope.GetTitledFirstName] sẵn sàng ở bên cạnh, đột nhiên có thứ gì đó rơi thẳng lên đầu ta. #EMP Một vật nhọn.#!\n\nTa lập tức chộp lấy thứ đó và phát hiện ra đó là một con mèo vô cùng tức giận và xấu xa, nó rít lên khi cào cấu mặt ta. Theo bản năng, ta lùi lại vài bước và thả con quái vật xuống một cách thô bạo.\n\nNhững sinh vật dối trá, không đáng tin cậy... độc ác. Ta ngẩng lên và chỉ thấy cả một đàn chúng đang tụ tập ở cuối phố, tất cả đều nhìn ta bằng ánh mắt đầy ác ý. Chuyện này không thể chấp nhận được."
  tour_general.3003.a:0 "Chúng ta cần thanh trừng thị trấn này khỏi những [ROOT.Char.Custom('HateCatsDogs')] ghê tởm đó."
  tour_general.3003.a_host_decides.tt:0 "[stop_host_scope.GetShortUIName] quyết định điều gì sẽ xảy ra tiếp theo"
  tour_general.3003.a_potential_outcome_agree:0 "[stop_host_scope.GetShortUIName] giúp Ngài giết những [ROOT.Char.Custom('HateCatsDogs')]"
  tour_general.3003.a_potential_outcome_offer_up_pet:0 "[stop_host_scope.GetShortUIName] dâng hiến chính con [ROOT.Char.Custom('HateCatDog')] của [stop_host_scope.GetHerHis]"
  tour_general.3003.a_potential_outcome_disagree:0 "[stop_host_scope.GetShortUIName] sẽ #EMP không#! giúp Ngài giết những [ROOT.Char.Custom('HateCatsDogs')]"
  tour_general.3003.b:0 "Nghĩ lại thì, hãy làm chuyện khác."
  tour_general.3003.b_cynical:0 "Thôi, việc này sẽ gây ra quá nhiều bừa bộn."
  tour_general.3003.fanatic_subjects_approve.tt:0 "Những thần dân yêu [visiting_liege.Custom('GetCatDog')] của Ngài tán thành hành động này"
  tour_general.3003.compassionate_subjects_disapprove.tt:0 "Những thần dân nhân ái của Ngài phản đối hành động này"

 #Liege: Did you vassal decide to help you kill cats/dogs?
  tour_general.3004.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Một Cái Ác Cần Thiết"
  tour_general.3004.desc_intro_sacrifice:0 "Mọi việc đã xong; con thú từng trú ngụ trong dinh thự của [stop_host_scope.GetTitledFirstNamePossessive] đã bị thanh trừng và hiện được trưng bày như một lời cảnh cáo tại pháp trường của [stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  tour_general.3004.desc_intro:0 "Giờ thì mọi việc đã xong; xác các con vật được chất đống bên cạnh pháp trường của [stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], và những đống lửa nhỏ đang cháy để tiêu hủy hoàn toàn những sinh vật ghê tởm đó."
  tour_general.3004.desc_vassal_sacrifice:0 "\n\nI appreciate that [stop_host_scope.GetSheHe] came to [stop_host_scope.GetHerHis] senses and gave up the dirty creature. I should probably go wash myself; who knows what diseases it was carrying."
  tour_general.3004.desc_vassal_help:0 "\n\nTa trân trọng việc [stop_host_scope.GetTitledFirstName] đã nhanh chóng đến hỗ trợ và bắt đầu lùa những con vật đáng nguyền rủa đó lại. Giờ ta có thể ngủ yên, biết rằng lãnh địa đã an toàn hơn đôi chút."
  tour_general.3004.desc_no_help:0 "\n\nCòn tên hèn nhát [stop_host_scope.GetTitledFirstName] thì chẳng giúp được gì. Ta hừ mũi khi suy ngẫm về sự bất tuân mà [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stop_host_scope'))] của ta đã thể hiện. Ít nhất giờ ta cũng biết [stop_host_scope.GetSheHe] đứng về phía nào."
  tour_general.3004.desc_outro:0 "\n\nKhi ta bước về phía phòng tắm đã được chỉ định trong tư thất, ta bắt gặp một con [ROOT.Char.Custom('GetCatDog')] hoang đang tò mò nhìn cảnh tượng nơi pháp trường. Ta mỉm cười với con [ROOT.Char.Custom('GetFelineCanine')] đó và gật đầu: \"Mọi thứ ổn rồi, cưng à.\""
  tour_general.3004.a:0 "Mọi việc đã được giải quyết."

 ##Liege Events
 #Parade your entourage prisoners down the holding main street
  tour_general.4000.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Cuộc Diễu Hành Khốn Khổ"
  tour_general.4000.desc:0 "Con đường chính của [ROOT.Char.GetCurrentLocation.GetName] chật kín người [stop_host_scope.GetCulture.GetNameNoTooltip], háo hức được thoáng thấy [ROOT.Char.GetTitleAsNameNoTooltip|U] của họ.\n\nBiết rõ mục đích của [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip], ta liếc nhìn các tù nhân trong đoàn tùy tùng của mình, bị xếp hàng và xiềng xích trong một đoàn bắt đầu ngay phía sau ta. Những người dân này cần phải tôn trọng ta và biết điều gì sẽ xảy ra với những kẻ dám vượt ranh giới.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parade_master'))] của ta, [parade_master.GetTitledFirstName], nhìn ta đầy mong đợi, tay cầm kiếm, chờ tín hiệu để bắt đầu diễu hành đám tù nhân dọc theo con phố."
  tour_general.4000.a:0 "Diễu hành chúng dọc theo con phố!"
  tour_general.4000.a_parade.t:0 "Cuộc Diễu Hành Khốn Khổ"
  tour_general.4000.a_parade.desc:0 "Ngài diễu hành các tù nhân dọc theo con phố"
  tour_general.4000.a_egged.t:0 "Bị Ném Trứng"
  tour_general.4000.a_egged.desc:0 "Ngài bị ném trứng"
  tour_general.4000.b:0 "#EMP Kéo lê#! chúng dọc theo con phố."
  tour_general.4000.b.flavor:0 "Lũ cặn bã tội lỗi này!"
  tour_general.4000.c:0 "Có lẽ ta có thể làm chuyện khác..."
 #Search a room and find vassal secrets
  tour_general.4001.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Cất Giữ Bí Mật"
  tour_general.4001.desc:0 "Trong lúc thăm [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stop_host_scope'))] của ta là [stop_host_scope.GetTitledFirstName] tại lãnh địa của [stop_host_scope.GetHerHis] ở [ROOT.Char.GetCurrentLocation.GetName], ta dường như đã lạc mất đoàn tùy tùng, để rồi bị bỏ lại một mình trong khu tư thất của [stop_host_scope.GetHerHis].\n\nGiờ thì, đây có lẽ là một cơ hội hoàn hảo để #EMP hiểu#! [stop_host_scope.GetHerHim] rõ hơn một chút. Có lẽ ta nên nhìn quanh và xem liệu có thể tìm thấy thứ gì đó... bất thường... đáng chú ý hay những thứ mà [stop_host_scope.GetSheHe] không muốn ta phát hiện?"
  tour_general.4001.a:0 "Phòng ngủ chắc chắn đáng ngờ."
  tour_general.4001.a.tt:0 "Ngài lục soát phòng ngủ"
  tour_general.4001.b:0 "Phòng hội đồng, nơi thích hợp cho những giao dịch mờ ám."
  tour_general.4001.b.tt:0 "Ngài lục soát phòng hội đồng"
  tour_general.4001.c:0 "Nơi thờ phụng của [stop_host_scope.GetHerHis|U] có thể chứa những điều khiếm nhã."
  tour_general.4001.c.tt:0 "Ngài lục soát [stop_host_scope.GetFaith.HouseOfWorship]"
  tour_general.4001.d:0 "Ai biết được nhà bếp có thể giấu những vật lệch lạc gì."
  tour_general.4001.d.tt:0 "Ngài lục soát nhà bếp"
  tour_general.4001.e:0 "Ta có những việc tốt hơn để làm."
  tour_general.4001.outcome_a_desc:0 "Ngài tìm thấy thứ gì đó đáng ngờ"
  tour_general.4001.outcome_a:0 "Ngài phát hiện một bí mật về [stop_host_scope.GetShortUIName]"
  tour_general.4001.outcome_b_desc:0 "Ngài không tìm thấy gì"
  tour_general.4001.outcome_c_desc:0 "Ngài bị bắt quả tang"
 #You find a secret!
  tour_general.4002.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Bí Mật Bị Phanh Phui"
  tour_general.4002.desc_bedchamber:0 "Phòng ngủ của [stop_host_scope.GetTitledFirstNamePossessive] sạch sẽ và gọn gàng một cách đáng ngạc nhiên. Chiếc giường thì đặc biệt đáng ngờ. Ta nhìn quanh căn phòng một lúc, cố tìm xem có thứ gì lệch lạc hay không.\n\n"
  tour_general.4002.desc_council_chamber:0 "Ta lén lút bước vào phòng hội đồng của [stop_host_scope.GetTitledFirstNamePossessive], căng mắt căng tai đề phòng bất kỳ âm thanh hay chuyển động nào báo hiệu ta sắp bị bắt gặp. Căn phòng trông khá bình thường đối với một phòng hội đồng, khi ta lục lọi xung quanh, rà soát các kệ và nhấc lên những tài liệu bị vứt rải rác.\n\n"
  tour_general.4002.desc_shrine:0 "Nơi thờ phụng [stop_host_scope.GetFaith.HouseOfWorship] yên tĩnh một cách rợn người khi ta lục soát các hành lang để tìm bất kỳ mẩu thông tin nào. Các gian phòng trông hết sức tầm thường và bình thường, ta rẽ thêm một khúc nữa, trong khi vẫn căng tai đề phòng có người xuất hiện.\n\n"
  tour_general.4002.desc_kitchen:0 "Khi tiến đến nhà bếp, ta chắc chắn rằng căn phòng trống rỗng trước khi bước vào. Ta nhanh chóng đảo mắt quan sát để nắm bắt tình hình. Hầm rượu trông có vẻ là một nơi đầy hứa hẹn để che giấu bí mật, có lẽ vậy.\n\n"
  tour_general.4002.desc_deviant:0 "Đột nhiên ta nhận ra một khe nứt trên bức tường, và cẩn thận kéo ra thứ hóa ra là nhiều bản vẽ của... #EMP ôi trời#!... những kẻ lệch lạc đang tham gia vào một dạng lệch lạc đặc biệt.\n\nCòn có cả một số vật dụng đi kèm nữa, những thứ mà ta thà không chạm vào thì hơn."
  tour_general.4002.desc_homosexual:0 "Ta tiến lại gần chiếc giường, luồn tay xuống dưới mép của tấm nệm nhồi và tìm thấy... thư từ của [stop_host_scope.GetTitledFirstNameNoTooltip]. Trong những lá thư, [stop_host_scope.GetSheHe] dường như đang thổ lộ tình yêu của [stop_host_scope.GetHerHis] dành cho một [stop_host_scope.GetWomanMan] khác?!\n\nHừm, ai mà ngờ được chứ."
  tour_general.4002.desc_murder_attempt:0 "Khi ta tập trung vào bàn trang điểm, ta để ý đến chiếc gương quý giá được gắn chặt vào lớp gỗ tinh xảo. Ta cúi người nhìn ra phía sau nó và phát hiện một chiếc túi nhỏ chứa... thứ gì đó.\n\nTa mở chiếc túi ra và phát hiện thông tin chi tiết về một vụ mưu sát gần đây! Ta nhanh chóng đặt chiếc túi trở lại chỗ cũ."
  tour_general.4002.desc_cannibal:0 "Ta đẩy cánh cửa ra với một tiếng kẽo kẹt nhỏ và nhìn vào căn phòng lờ mờ ánh sáng. Bước vào bên trong, ta nhận ra... một hộp sọ người? Đặt trên mặt quầy ở bức tường đối diện? Đó là... Ta đột nhiên buồn nôn trước mùi xâm lấn khó chịu và nhận ra một bàn tay.\n\nBàn tay đó đã bị tách khỏi cơ thể. #EMP Thịt người#!?"
  tour_general.4002.desc_lover:1 "Ta loạng choạng một chút, đưa tay quệt dọc theo bức tường và vô tình kéo vào một chiếc đèn trong nỗ lực không để ngã. Thật bất ngờ, nó trượt xuống trong một chuyển động mượt mà, để lộ một lỗ hổng trên tường.\n\nKhoang rỗng đó chứa đầy... những lá thư tình của [stop_host_scope.GetTitledFirstNamePossessive]? Gửi cho một #EMP người tình bí mật#!?"
  tour_general.4002.desc_murder:0 "Ánh mắt ta lướt dọc theo bệ cửa sổ khi nhận ra một phần bức tường có gì đó hơi lệch. Ta tiến lại gần và rút ra thứ trông giống như một con dao găm dính máu, kèm theo thư từ của [stop_host_scope.GetTitledFirstNameNoTooltip] gửi cho các đặc vụ tiềm năng trong một vụ #EMP giết người#! đã được thực hiện!\n\nTa vội vàng cất những món đồ đó trở lại chỗ giấu."
  tour_general.4002.desc_non_believer:0 "Ta nhìn về phía bàn thờ ở cuối căn phòng. Tấm rèm bên dưới chiếc bàn có thứ gì đó thò ra... Ta kéo nó ra và phát hiện — một tập giấy ghi chép lộn xộn, mô tả sự hoài nghi của [stop_host_scope.GetTitledFirstNamePossessive] đối với [stop_host_scope.GetFaith.HighGodName].\n\nTa lùi lại vài bước. [stop_host_scope.GetTitledFirstNameNoTooltip] — một #EMP kẻ không tin#!?"
  tour_general.4002.desc_incest:0 "Ta rón rén tiến lại gần cánh cửa hầm, vốn đang hé mở, và cúi người nhìn vào bên trong. Mắt ta mở to và ta vội vàng nhảy lùi lại vài bước, cố giữ im lặng và tiêu hóa những gì mình vừa thấy.\n\n[stop_host_scope.GetTitledFirstNameNoTooltip]? Trong quan hệ xác thịt với... với... #EMP một người thân cận#!?"
  tour_general.4002.desc_witch:0 "Một trong những lá cờ treo trên tường trông có vẻ hơi lệch... Ta chạm vào lá cờ, khiến một cuốn ma thư đen nhỏ nhưng tinh xảo rơi xuống sàn với một tiếng bịch trầm.\n\n[stop_host_scope.Custom('MagicPracticeTerm')|U]?"
  tour_general.4002.desc_embezzler:0 "Khi ta lướt tay dọc theo cạnh chiếc bàn, ta cảm thấy có thứ gì đó ở mặt dưới của mặt bàn. Ta kéo nó ra và lộ ra... tài liệu thuế khóa?\n\nKhông, đây là những tài liệu mô tả số vàng bị rút ruột từ kho bạc của #EMP người khác#! vào kho bạc của [stop_host_scope.GetTitledFirstNamePossessive]. Tham ô!"
  tour_general.4002.a:0 "Thế này thì quá ổn rồi..."
  tour_general.4002.a_deviant:0 "Một kẻ phá bỏ chuẩn mực giống ta!"
  tour_general.4002.a_homosexual_female:0 "Một quý cô yêu quý cô giống ta!"
  tour_general.4002.a_homosexual_male:0 "Một quý ông yêu quý ông giống ta!"
  tour_general.4002.a_homosexual:0 "Một cá nhân vui tính giống ta!"
  tour_general.4002.a_cannibal:0 "Một tay sành ăn giống ta!"
  tour_general.4002.a_non_believer:0 "Một người truy cầu chân lý giống ta!"
  tour_general.4002.a_incest:0 "Một kẻ yêu đương không giới hạn giống ta!"
  tour_general.4002.a_witch:0 "Một [stop_host_scope.Custom('SisterBrother')] giống ta!"
 #You find ... bupkis
  tour_general.4003.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Chẳng Có Gì Ở Đây"
  tour_general.4003.desc_faux_bedchamber:0 "Khi ta liếc nhìn vào phòng ngủ, ta bị một người hầu đang bận dọn dẹp căn phòng tiếp cận. [servant_gender.GetSheHe|U] ra hiệu rõ ràng bảo ta cúi lại gần.\n\n\"Có ai từng nói cho m'[ROOT.Char.GetLadyLord] biết bí quyết gấp ga #EMP hoàn hảo tuyệt đối#! chưa?\" người hầu nói, nhìn ta đầy mong đợi.\n\nTa khẽ thở dài, xin phép rồi rời khỏi căn phòng."
  tour_general.4003.desc_faux_council_chamber:0 "Phòng hội đồng gần như trống rỗng. Đặc biệt là hoàn toàn không có bất kỳ mẩu thông tin hay bí mật nào dù chỉ hơi thú vị để ta tìm hiểu.\n\nKhi ta quay người định rời đi, ta giật mình vì một giọng nói phía sau. \"Để ta nói cho m'[ROOT.Char.GetLadyLord] bí quyết giữ cho mặt bàn không dính bụi nhé...\"\n\nTa giả vờ không nghe thấy và vội vàng rời khỏi phòng hội đồng."
  tour_general.4003.desc_faux_shrine:0 "Ta lang thang trong các hành lang của [stop_host_scope.GetFaith.HouseOfWorship], cẩn thận quan sát xung quanh để tìm bất cứ thứ gì đáng ngờ, nhưng chẳng thu được gì cả.\n\nTrong lúc lục soát khu vực, ta vấp phải một người hầu, kẻ khăng khăng muốn kể cho ta nghe bí quyết của việc... đánh bóng đồ thiếc.\n\nTa lịch sự từ chối."
  tour_general.4003.desc_faux_kitchen:0 "The kitchen is messy, as if the staff were just here working on whatever meal is coming up next. I take a veer towards the cellar, peeking my head inside.\n\nI catch a glimpse of a servant inside, busy stacking [stop_host_scope.Custom('get_region_root_vegetable_plural')]. [servant_gender.GetSheHe|U] gives me a curious look, then opens [servant_gender.GetHerHis] mouth:\n\n"Did someone ever tell you the secret about [stop_host_scope.Custom('get_region_root_vegetable_plural')], m'[ROOT.Char.GetLadyLord]?"\n\nI give the servant a skeptical look, then turn and walk out of the kitchen."
  tour_general.4003.a:0 "Thật là công cốc."
 #You got caught!
  tour_general.4004.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Bị Bắt Gặp!"
  tour_general.4004.desc_bedchamber_caught:0 "Ta vừa mới bước vào phòng ngủ và bắt đầu nhìn quanh thì một cánh cửa ở phía đối diện căn phòng bật mở, để lộ [stop_host_scope.GetTitledFirstName] bằng xương bằng thịt. [stop_host_scope.GetSheHe|U] nhìn ta, đôi mắt hơi mở to vì ngạc nhiên.\n\nRồi ánh mắt của [stop_host_scope.GetHerHis] híp lại. Ta cảm thấy một làn sóng hoảng loạn nhẹ khi cố giữ bình tĩnh."
  tour_general.4004.desc_council_chamber_caught:0 "Vừa bước chân vào phòng hội đồng, ta đã nghe thấy tiếng bước chân đang nhanh chóng tiến lại gần. Ta toát mồ hôi lạnh khi vội vã cố gắng chạy sang phía bên kia căn phòng để trốn, nhưng thất bại thảm hại.\n\nÁnh mắt của [stop_host_scope.GetTitledFirstName] đổ dồn vào ta khi [stop_host_scope.GetSheHe] gọi lớn: \"Ngươi ở đó à, thưa [ROOT.Char.GetTitleAsNameNoTooltip]!\" Đôi mắt [stop_host_scope.GetHerHis|U] híp lại khi [stop_host_scope.GetSheHe] quan sát ta và nỗ lực giữ vẻ trung lập của ta."
  tour_general.4004.desc_shrine_caught:0 "Ta bước vào [stop_host_scope.GetFaith.HouseOfWorship], đi dọc các hành lang một đoạn — rồi khi rẽ qua một góc khác, ta suýt nữa thì #EMP đâm sầm vào#! [stop_host_scope.GetTitledFirstName]. Tim ta gần như ngừng đập.\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] quay lại, ngạc nhiên vì bị chặn lại theo cách này. Khi [stop_host_scope.GetSheHe] nhận ra ai suýt va phải [stop_host_scope.GetHerHim], ánh mắt [stop_host_scope.GetHerHis] híp lại. \"Ta đang tìm ngươi đấy, thưa [ROOT.Char.GetTitleAsNameNoTooltip].\""
  tour_general.4004.desc_kitchen_caught:0 "Nhà bếp mờ tối và lờ mờ ánh sáng khi ta cẩn thận băng qua căn phòng có diện tích khá lớn. Ta cúi xuống xem vài ghi chú công thức nấu ăn thì nghe thấy một tiếng kẽo kẹt phía sau — và lập tức quay lại, chỉ để thấy [stop_host_scope.GetTitledFirstName] bước ra từ hầm.\n\n[stop_host_scope.GetSheHe|U] nhìn ta, rõ ràng cũng ngạc nhiên không kém gì ta. Rồi ánh mắt [stop_host_scope.GetHerHis] híp lại: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]... ?\""
  tour_general.4004.desc_outro:0 "\n\n\"... ngài đã làm gì vậy?\" [stop_host_scope.GetTitledFirstNameNoTooltip] hỏi với giọng tra vấn."
  tour_general.4004.a:0 "Ơ. Ờ. Ta đang tìm ngươi!"
  tour_general.4004.a_diplomacy:0 "Ồ. #EMP Ở kia#! ngươi rồi."
  tour_general.4004.a_diplomacy_convinced.t:0 "Màn Thuyết Phục Thành Công"
  tour_general.4004.a_diplomacy_convinced.desc:0 "Ngài đã thuyết phục được [stop_host_scope.GetShortUIName]"
  tour_general.4004.a_diplomacy_nonconvinced.t:0 "Không Bị Thuyết Phục"
  tour_general.4004.a_diplomacy_nonconvinced.desc:0 "Ngài không thuyết phục được [stop_host_scope.GetShortUIName]"
  tour_general.4004.a_diplomacy_snooping.t:0 "Chủ Quân Rình Mò"
  tour_general.4004.a_diplomacy_snooping.desc:0 "Ngài bắt gặp chủ quân của mình đang lén lút lục soát lãnh địa"
  tour_general.4004.b:0 "Ta đang chờ #EMP ngươi#!..."
 #Come across a drunk vassal servant, gain scheme buff/s
  tour_general.4006.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Mưu Đồ Trong Cơn Say"
  tour_general.4006.desc:1 "Sau một ngày bị [stop_host_scope.GetTitledFirstName] dẫn đi khắp [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ta quyết định rằng một buổi tối không có mặt [stop_host_scope.GetHerHim] là hoàn toàn xứng đáng. Vì thế, đoàn tùy tùng của ta thư giãn tại một quán rượu địa phương.\n\nKhi ta liếc nhìn qua một đám say xỉn hỗn độn — một gương mặt đỏ bừng nổi bật hẳn lên. Đó là một trong những gia nhân của [stop_host_scope.GetTitledFirstNamePossessiveNoTooltip].\n\nTa nghiêng người lại gần hơn khi kẻ say lảm nhảm: \"Ồ, ta có thể kể cho ngài nghe vài chuyện về vị [stop_host_scope.GetTitleTierName]! Không chỉ vài chuyện đâu...\""
  tour_general.4006.a:1 "Cứ nói tiếp đi..."
  tour_general.4006.a_success.t:0 "Tăng Tỷ Lệ Thành Công Mưu Kế"
  tour_general.4006.a_success.desc:0 "[servant_character.GetShortUIName] chia sẻ những thông tin thú vị về [4006_scheme_target.GetShortUIName]"
  tour_general.4006.a_secrecy.t:0 "Tăng Độ Bí Mật Mưu Kế"
  tour_general.4006.a_secrecy.desc:0 "[servant_character.GetShortUIName] chia sẻ thông tin về các lối đi bí mật"
  tour_general.4006.b:1 "Ai đó mang thêm rượu cho [servant_character.GetWomanMan] này."
  tour_general.4006.b_super_success.t:0 "Tăng Rất Nhiều Tỷ Lệ Thành Công Mưu Kế"
  tour_general.4006.b_super_success.desc:0 "[servant_character.GetShortUIName] chia sẻ những thông tin vô cùng giá trị về [4006_scheme_target.GetShortUIName]"
  tour_general.4006.b_super_secrecy.t:0 "Tăng Rất Nhiều Độ Bí Mật Mưu Kế"
  tour_general.4006.b_super_secrecy.desc:0 "[servant_character.GetShortUIName] chia sẻ thông tin về các đường hầm bí mật"
  tour_general.4006.b_passout.t:0 "Bất Tỉnh"
  tour_general.4006.b_passout.desc:0 "[servant_character.GetShortUIName] uống quá nhiều và bất tỉnh"
  tour_general.4006.b_passout_tt:0 "Ngài không nhận được bất kỳ thông tin nào"
 ##Gain a hook on one of the vassal's close characters
  tour_general.4007.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Hoạt Động Đáng Ngờ"
  tour_general.4007.desc:0 "Vừa rời khỏi quán rượu do [stop_host_scope.GetTitledFirstName] giới thiệu, ta thấy mình đang đứng ngoài một con hẻm tối tăm. Từ trong bóng tối, một âm thanh kỳ lạ vang lên.\n\nKhi ta lặng lẽ tiến về phía âm thanh đó, tò mò về nguồn gốc của nó, ta thoáng thấy... [4007_secret_holder.GetTitledFirstName]? [4007_secret_holder.GetSheHe] đang làm gì ở đây, trong con hẻm u ám này, vào giờ này?\n\nTa cố gắng vô ích để quan sát rõ hơn hành động của [4007_secret_holder.GetSheHe] mà không để lộ sự hiện diện của mình; nhưng có một điều chắc chắn, đó là [4007_secret_holder.GetTitledFirstNameNoTooltip] đang làm điều mờ ám."
  tour_general.4007.a:0 "Chỉ cần tiến lại gần thêm chút nữa..."
  tour_general.4007.a_secret.t:0 "Phát Hiện Bí Mật"
  tour_general.4007.a_secret.desc:0 "Ngài tiến lại gần hơn và biết được [4007_secret_holder.GetShortUIName] đang làm gì"
  tour_general.4007.a_secret.tt:0 "Ngài học được một bí mật về [4007_secret_holder.GetShortUIName]"
  tour_general.4007.a_detected.t:0 "Bị Phát Hiện"
  tour_general.4007.a_detected.desc:0 "[4007_secret_holder.GetShortUIName] bắt gặp Ngài đang rình mò [4007_secret_holder.GetHerHim]"
  tour_general.4007.b:0 "Thôi bỏ đi."
 
  tour_paraded_prisoners_modifier:0 "Diễu Hành Tù Nhân"
  tour_paraded_prisoners_modifier_desc:0 "Nhân vật này đã cho diễu hành tù nhân qua một con phố thuộc khu giữ."
  tour_dragged_prisoners_modifier:0 "Lôi Kéo Tù Nhân"
  tour_dragged_prisoners_modifier_desc:0 "Nhân vật này đã lôi kéo tù nhân qua một con phố thuộc khu giữ, gây tổn hại thân thể."
  tour_dragged_prisoners_through_holding_modifier:0 "Lãnh Chúa Hằn Thù"
  tour_dragged_prisoners_through_holding_modifier_desc:0 "Tù nhân bị lôi kéo qua các con phố trong một khu sở hữu của hạt."
