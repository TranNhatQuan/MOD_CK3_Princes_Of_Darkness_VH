l_english:
 
 # BLOODY WEDDING 
  ep2_wedding.0101.t:0 "Cho tới khi Cái chết..."
  ep2_wedding.0101.desc.intro:0 "Tất cả khách mời đã tụ tập trong sân. Một ngày nắng đẹp tuyệt vời. Ta liếc nhìn các [dummy_gender.GetWomenMen] của mình — những lính gác mà ta, với tư cách là một chủ tiệc hào phóng, đã hứa sẽ bố trí. #EMP Trang bị tận răng#!. Chẳng bao lâu nữa, mọi sự chuẩn bị của ta sẽ thành hiện thực.\n\nTa thấy [spouse_2.GetTitledFirstName] xuất hiện, cùng với đoàn tùy tùng của [spouse_2.GetHerHis]"
  ep2_wedding.0101.desc.spouse:0 ". Kết hôn — chỉ trong đúng một ngày."
  ep2_wedding.0101.desc.bad:0 ": một sự hiện diện đáng khinh như vậy phải bị quét sạch."
  ep2_wedding.0101.desc.good:0 "... Ta xin lỗi, người yêu dấu."
  ep2_wedding.0101.a:0 "Mọi thành viên của gia tộc [spouse_2.GetHouse.GetNameNoTooltip] đều phải bị xóa sổ."
  ep2_wedding.0101.a_lowborn:0 "Mọi thành viên của gia đình này đều phải bị xóa sổ."
  ep2_wedding.0101.b:0 "Chỉ riêng mạng sống của [spouse_2.GetFirstNamePossessiveNoTooltip] là thứ ta sẽ lấy."
  ep2_wedding.0101.c:0 "Đêm tân hôn — một dịp hoàn hảo."
  ep2_wedding.0101.d:0 "Ta không thể làm điều này. Không phải ở đây. Không phải lúc này."
  ep2_wedding.0101.a.tt:0 "Đám cưới bắt đầu... và nó sẽ được ghi nhớ"
  ep2_wedding.0101.c.tt:0 "Một lựa chọn riêng tư"
  ep2_wedding.0101.d.tt:0 "Đám cưới bắt đầu, và không ai bị hại"
  ep2_wedding.0200.desc.murder:0 "$ep2_wedding.0200.desc.murder_intro$\"Ta vô cùng biết ơn lòng nhân từ của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')], điều đó thực sự sưởi ấm trái tim Ta.\""
  ep2_wedding.0200.desc.murder_intro:0 "Khi các vị khách bước vào đại sảnh, ta cố tình chậm lại, trò chuyện với một nhóm người tham dự về [ROOT.Char.Custom('my_subject_of_interest')]. \"Thật là một chủ tiệc hào phóng!\" — ta nghe thấy khi xin phép tiến về bàn danh dự. Lính gác của ta ở #EMP khắp nơi#!. Sẵn sàng. Khi ta ngồi xuống, ánh mắt ta chạm phải [spouse_2.GetTitledFirstName]:\n\n"
  ep2_wedding.0200.desc.murder_spouse:0 "$ep2_wedding.0200.desc.murder_intro$\"Chẳng mấy chốc sẽ chỉ còn #EMP hai#! chúng ta thôi, người yêu dấu,\" ta nói, nâng cao chiếc ly."
  ep2_wedding.0200.a.murder:0 "#EMP Thưởng thức đi!#!"
  ep2_wedding.0202.t.spouse:0 "...Cho tới khi Ta Chia lìa"
  ep2_wedding.0202.t:0 "...Chia lìa Bọn Chúng"
  ep2_wedding.0202.desc.outro:0 "\n\nTa ra hiệu cho gia nhân khi cắn một miếng [ROOT.Char.Custom('GetExpensiveDessert')]. Các [dummy_gender.GetWomenMen] của ta tiến vào đại sảnh, cải trang thành lính đánh thuê. Cửa bị khóa chặt và âm nhạc bắt đầu vang lên. Hãy để cuộc thảm sát bắt đầu."
  ep2_wedding.0202.desc.intro:0 "Khách mời đang mải mê trò chuyện đến mức thật khó theo dõi hết tất cả. [spouse_2.GetTitledFirstName] bị bao quanh bởi một nhóm cận thần đầy nhiệt huyết, tất cả đều trao nhau những lời tán dương. Đó là sự trùng hợp ngẫu nhiên hay số phận an bài — ta không thể nói rõ.\n\n"
  ep2_wedding.0202.desc.compassionate:0 "Thật đáng tiếc khi mọi chuyện lại thành ra thế này. Ta sẽ không thể nhìn được."
  ep2_wedding.0202.desc.paranoid:0 "Cuối cùng thì kẻ thù của ta cũng sẽ thôi âm mưu chống lại ta — môi miệng của chúng sẽ vĩnh viễn im lặng."
  ep2_wedding.0202.desc.zealous:0 "Nguyện cho linh hồn chúng tìm được sự cứu rỗi nơi [ROOT.Char.GetFaith.NegativeAfterLife]."
  ep2_wedding.0202.desc.sadistic:0 "Ta nóng lòng muốn thấy những phiến đá lát nền nhuộm đỏ dưới chân chúng."
  ep2_wedding.0202.desc.craven:0 "Ta lau mồ hôi trên trán. #EMP Khục.#! Cúi đầu xuống, [ROOT.Char.GetFirstNameNoTooltip], đừng để chúng nghi ngờ."
  ep2_wedding.0202.desc.arrogant:0 "Ta ngả lưng trên ghế, cố gắng không mỉm cười. Người đời sẽ ghi nhớ chuyện này suốt nhiều thế hệ."
  ep2_wedding.0202.desc.lazy:0 "Ta thật biết ơn vì không phải tự tay làm — giết chóc quả là một việc mệt mỏi."
  ep2_wedding.0202.desc.just:0 "Ta gọi đây là công lý."
  ep2_wedding.0202.desc.cannibal:0 "Dù sao thì ta cũng đang đói..."
  ep2_wedding.0202.desc.wrathful:0 "Hãy để đầu chúng lăn khắp những đại sảnh mà chúng từng phỉ báng!"
  ep2_wedding.0202.desc.fallback:1 "Ta vô thức huýt sáo theo giai điệu."
  ep2_wedding.0202.a:0 "Gia tộc [spouse_2.GetHouse.GetNameNoTooltip] kết thúc tại đây."
  ep2_wedding.0202.a.lowborn:0 "Gia tộc của ngươi kết thúc tại đây."
  ep2_wedding.0203.t.spouse:0 "$ep2_wedding.0202.t.spouse$"
  ep2_wedding.0203.t:0 "$ep2_wedding.0202.t$"
  ep2_wedding.0203.desc.intro:0 "Khi bữa tiệc sắp tàn, những cuộc trò chuyện dần thưa thớt, và khách mời bị phân loại thành quá say hoặc quá mệt. Những người còn đủ tỉnh táo — hoặc đủ say — giờ đây vây quanh [spouse_2.GetTitledFirstName], trong nỗ lực cuối cùng để giành lấy ân huệ từ cuộc hôn nhân này.\n\n"
  ep2_wedding.0203.desc.compassionate:0 "Ta chỉ mong mọi chuyện diễn ra nhanh chóng, và không đau đớn."
  ep2_wedding.0203.desc.paranoid:0 "Giờ thì [spouse_2.GetSheHe] sẽ hiểu! Giờ thì chắc chắn [spouse_2.GetSheHe] sẽ hiểu! #EMP Tất cả#! bọn chúng sẽ!"
  ep2_wedding.0203.desc.zealous:0 "Đây là cách duy nhất để loại bỏ một linh hồn độc hại như vậy."
  ep2_wedding.0203.desc.sadistic:0 "Ta liếm lưỡi dao. Giá như ta có thể tự tay làm việc này..."
  ep2_wedding.0203.desc.cannibal:0 "Ta chăm chú nhìn làn da của [spouse_2.GetHerHis]... thật là một món ngon."
  ep2_wedding.0203.desc.craven:0 "Ta không thể... ta không thể nhìn. Có lẽ còn tệ hơn ta tưởng!"
  ep2_wedding.0203.desc.arrogant:0 "Ta ngả người trên ghế, nhấp một ngụm [ROOT.Char.Custom('RegionalDrink')]."
  ep2_wedding.0203.desc.just:0 "Đó là điều cần phải làm."
  ep2_wedding.0203.desc.wrathful:0 "#EMP Chặt đầu [spouse_2.GetHerHis] đi. Chặt đi.#!"
  ep2_wedding.0203.desc.fallback:0 ""
  ep2_wedding.0203.desc.outro:0 "Một trong các cận thần cười lớn hơn mức cần thiết. Mạnh mẽ hơn. [my_agent.GetSheHe|U] rút ra một con dao găm và trái tim của [spouse_2.GetFirstNameNoTooltip] nhanh chóng im lặng — cũng như toàn bộ khách mời.\n\n\"Bắt lấy [my_agent.GetHerHim]!\" ta hét lên, hoàn toàn biết rằng [my_agent.GetSheHe] sẽ được thả vào ngày hôm sau."
  ep2_wedding.0203.a:0 "Một bi kịch!"
  ep2_wedding.0300.desc.murder_spouse:0 "Khi bữa tiệc sắp kết thúc, nến tắt dần và khách mời đã lui về phòng riêng. Tiếng nói lại vang lên khi tới lúc đêm tân hôn: \"Hãy để đôi tân lang tân nương tận hưởng!\"\n\nTa #EMP thực sự#! không thể chờ đợi."
  ep2_wedding.3060.t:0 "Một Đêm Để Chết Vì"
  ep2_wedding.3060.desc:0 "Một chiếc giường phủ vải sang trọng đang chờ đợi chúng ta. Khi ánh nến chiếu lên gương mặt của [spouse_2.GetTitledFirstNamePossessive], ta nín thở trong khoảnh khắc. \"Hãy đến nằm cùng ta, tình yêu của ta,\" [spouse_2.GetSheHe] nói, cởi chiếc áo của [spouse_2.GetHerHis].\n\nÁnh trăng sáng như ban ngày. Ta vuốt ve cổ họng của [spouse_2.GetHerHis] trước khi hôn lên đó. Bàn tay ta — chỉ cần siết chặt hơn một chút, mọi thứ sẽ kết thúc."
  ep2_wedding.3060.a:0 "\"Lại gần hơn nữa đi, người yêu dấu...\""
  ep2_wedding.3060.a.success:0 "Ngài siết cổ [spouse_2.GetShortUIName]"
  ep2_wedding.3060.a.failure:0 "[spouse_2.GetShortUIName] thoát khỏi vòng tay của Ngài"
  ep2_wedding.3060.b:0 "Ta biết vài loại thảo dược có thể khiến [spouse_2.GetHerHim] im lặng hơn."
  ep2_wedding.3060.b.success:0 "Ngài đầu độc [spouse_2.GetShortUIName] thành công"
  ep2_wedding.3060.b.failure:0 "[spouse_2.GetShortUIName] phát hiện ý đồ của Ngài"
  ep2_wedding.3060.c:0 "Một động tác chớp nhoáng. Ta có sẵn một con dao găm ngay dưới chiếc gối này."
  ep2_wedding.3060.c.flavor:0 "Để ta cắt ít trái cây cho ngươi nhé, người yêu!"
  ep2_wedding.3060.c.success:0 "Ngài cắt cổ [spouse_2.GetShortUINamePossessive]"
  ep2_wedding.3060.c.failure:0 "[spouse_2.GetShortUIName] trở nên nghi ngờ"
  ep2_wedding.3060.d:0 "Không, ta không thể làm điều này."
  ep2_wedding.0301.t:0 "Dư Vị"
  ep2_wedding.0301.desc.family:0 "Thi thể nằm la liệt khắp căn phòng. Gia nhân chuẩn bị cáng trong khi thì thầm về kẻ sát nhân có thể là ai. \"Ta nghe nói họ có rất nhiều kẻ thù.\" \"Ta nghe nói họ chẳng có ai.\""
  ep2_wedding.0301.desc.agent:0 "Lính gác đã áp giải kẻ thực hiện đi, nhưng vẻ kinh hoàng vẫn còn hằn trên gương mặt các vị khách. Một thầy thuốc bước ra, như để an ủi, nhưng rõ ràng rằng không có phương thuốc nào cho một nhát dao xuyên tim."
  ep2_wedding.0301.desc.wedding_night:0 "Ta chạy dọc theo các hành lang tới đại sảnh, chỉ mặc độc chiếc áo ngủ. Trước khi mở cửa, ta dừng lại một chút để khoác lên gương mặt đau khổ nhất của mình. #EMP \"Cứu với! Cứu với!\"#! ta kêu lên, \"Một kẻ nội gián đã lấy mạng [spouse_2.GetTitledFirstName], ngay trong chính phòng của chúng Ta!\""
  ep2_wedding.0301.non_spouse:0 "\n\nTiếng khóc của [spouse_1.GetTitledFirstNamePossessive] vang vọng khắp căn phòng. [spouse_1.GetHerHis|U] tay siết chặt lấy [spouse_2.GetFirstNamePossessiveNoTooltip], không chịu buông ra."
  ep2_wedding.0301.spouse:1 "\n\n\"Ôi, người yêu dấu, số phận sao lại tàn nhẫn với chúng ta đến vậy!\" ta khóc, nắm chặt bàn tay lạnh lẽo của [spouse_2.GetHerHis]. \"Ta sẽ tìm ra kẻ đã làm điều này với ngươi, và #EMP kết liễu#! hắn.\""
  ep2_wedding.0301.spouse_wnight:0 "\n\nSự im lặng bao trùm. Lính gác của ta bắt đầu chạy về phía phòng ngủ, và ta vùi mặt vào hai bàn tay."
  ep2_wedding.0301.a:0 "Thật tàn nhẫn, thật tàn nhẫn."
  ep2_wedding.0302.t:0 "Khúc Ai Ca Bắt Đầu"
  ep2_wedding.0302.desc.family:0 "Âm nhạc cắt ngang cuộc trò chuyện đầy thân mật của ta về [ROOT.Char.Custom('my_subject_of_interest')] với vài vị khách. Ta quay lại nhìn các nghệ sĩ, và ánh mắt bất ngờ chạm phải một cảnh khác. Một nhóm lính đánh thuê đang tiến về phía [spouse_2.GetTitledFirstName] và gia đình của [spouse_2.GetHerHim].\n\nKiếm được rút ra. #EMP \"Không! Không, xin đừng! KHÔNG!\"#!\n\nThi thể đổ xuống sàn với âm thanh khô khốc, khò khè."
  ep2_wedding.0302.desc.agent:0 "Một tiếng thét sắc bén cắt ngang cuộc trò chuyện thân mật của ta về [ROOT.Char.Custom('my_subject_of_interest')] với vài vị khách. #EMP \"Không!\"#! Ta quay lại và thấy [spouse_2.GetTitledFirstName], với một con dao găm cắm thẳng xuyên tim của [spouse_2.GetHerHis].\n\nLính gác lập tức lao tới kẻ sát nhân, \"Bắt hắn, bắt hắn!\" — ta nghe [host.GetTitledFirstName] hét lên.\n\n"
  ep2_wedding.0302.desc.wedding_night:0 "Cánh cửa đại sảnh bật mở, và [spouse_1.GetTitledFirstName] đứng sững giữa phòng — thở dốc, hai tay [spouse_1.GetHerHis] bám chặt lấy cánh cửa. \"Cứu... cứu với!\" [spouse_1.GetSheHe] kêu lên, \"Một kẻ nội gián đã lấy mạng [spouse_2.GetTitledFirstName], ngay trong chính phòng của chúng Ta!\"\n\nCả căn phòng lặng đi."
  ep2_wedding.0302.spouse:0 "Ta vội vã tiến tới bên [spouse_2.GetFirstNameNoTooltip] và nắm lấy bàn tay [spouse_2.GetHerHis]. Vẫn còn ấm. \"Không... trái tim ta... chưa thể là lúc này...\""
  ep2_wedding.0302.good:0 "Người yêu dấu của ta, [spouse_2.GetFirstNameNoTooltip]... ra đi như thế này."
  ep2_wedding.0302.bad:0 "Ta không nên nói rằng [spouse_2.GetSheHe] đáng phải nhận lấy kết cục đó, nhưng..."
  ep2_wedding.0302.sadistic:0 "Ta không thể rời mắt khỏi vũng máu... một công việc thật hoàn hảo."
  ep2_wedding.0302.indifferent:0 "Ta không quen biết [spouse_2.GetFirstNameNoTooltip] nhiều, nhưng không ai đáng phải chịu kết cục như vậy."
  ep2_wedding.0302.a:0 "Một bi kịch."
  ep2_wedding.0955.t:0 "Bình Minh Đỏ Máu"
  ep2_wedding_departure_intro:0 "Đại sảnh trông chẳng còn giống ngày hôm qua. Gia nhân đã dọn sạch bàn tiệc, không còn âm nhạc, và phần lớn khách mời đã rời đi."
  ep2_wedding.0955.desc.intro:0 "$ep2_wedding_departure_intro$\n\nKhi ta chuẩn bị nói lời từ biệt với những người còn lại,"
  ep2_wedding.0955.desc.failed:0 "ta bắt gặp gương mặt của [spouse_2.GetTitledFirstNamePossessive], đang vui vẻ trò chuyện cùng đoàn tùy tùng của [spouse_2.GetHerHis].\n\nTa biết [spouse_2.GetSheHe] nghi ngờ ta — và có lý do chính đáng. Cuộc hôn nhân này sẽ chẳng bao giờ nhàm chán."
  ep2_wedding.0955.desc.murder:0 "ta dừng lại một chút để nghĩ về [spouse_2.GetTitledFirstName]. Đã ra đi."
  ep2_wedding.0955.good:0 "Mọi chuyện đã không cần phải kết thúc như thế này."
  ep2_wedding.0955.bad:0 "Cuối cùng thì ta cũng không còn phải nhìn thấy gương mặt [spouse_2.Custom2('InsultAdjective', ROOT.Char)] của [spouse_2.GetHerHis] nữa."
  ep2_wedding.0955.sadistic:1 "Giá như ta có thể nói cho mọi người biết đó là #EMP ta#!..."
  ep2_wedding.0955.compassionate:0 "Ta chỉ có thể hy vọng rằng [ROOT.Char.GetFaith.HighGodName] sẽ tha thứ cho ta."
  ep2_wedding.0955.indifferent:0 "Chuyện đã làm thì cũng đã làm rồi."
  ep2_wedding.0955.a:0 "Thật sự nhẹ nhõm."
  ep2_wedding.0955.a.failure:0 "Lần sau... lần sau nữa."
  ep2_wedding.0956.t:0 "Từ Biệt"
  ep2_wedding.0956.desc:0 "$ep2_wedding_departure_intro$\n\n[host.GetTitledFirstName] tiến đến chỗ ta, giọng nói của [host.GetHerHis] vẫn ngập tràn nỗi buồn: \"Trái tim ta nặng trĩu trước sự mất mát của [spouse_2.GetTitledFirstName], ta xin lỗi vì buổi lễ đầy tai ương này.\""
  ep2_wedding.0956.a:0 "Ta chỉ mừng vì không phải là ta."
  ep2_wedding.0956.a.good:0 "Không... chuyện này không thể là sự thật."
  ep2_wedding.0204.t:0 "Máu và Thép"
  ep2_wedding.0204.desc.intro:0 "Cuộc trò chuyện vui vẻ của ta đột ngột chấm dứt khi"
  ep2_wedding.0204.desc.family.non_spouse:0 "ta thấy một nhóm lính đánh thuê đang tiến về phía chúng ta. #EMP Suỵt#!. Kiếm được rút ra. Những nụ cười của chúng báo trước bi kịch của chúng ta.\n\n\"Hãy nói lời từ biệt với gia đình của ngươi đi, [spouse_2.GetTitledFirstName].\""
  ep2_wedding.0204.desc.family:0 "$ep2_wedding.0204.desc.family.non_spouse$ Chúng nói, trước khi đặt lưỡi kiếm lên chính cổ họng ta."
  ep2_wedding.0204.desc.solo:0 "một trong các cận thần cười hơi quá mức. Hơi kỳ lạ. Ta nhìn về phía [mercenary_1.GetHerHim] và thấy rằng [mercenary_1.GetSheHe] đang chĩa một con dao vào ngực ta. \"Chúc ngươi mọi điều tốt đẹp.\""
  ep2_wedding.0204.a:0 "Không! #EMP Dừng lại!#!"
  ep2_wedding.0204.a.tt.success:0 "Ngài sống sót"
  ep2_wedding.0204.a.tt.failure:0 "Ngài chết"
