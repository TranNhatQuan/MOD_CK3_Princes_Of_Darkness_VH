 #A Magnificent Welcome
  ep2_wedding.1010.t:0 "Màn Đón Tiếp Lộng Lẫy"
  ep2_wedding.1010.desc:0 "Ta mừng vì đã dặn người hầu từ sớm để ý đến sự xuất hiện của [1010_target.GetTitledFirstNamePossessive], bởi giữa bộn bề chuẩn bị hôn lễ, nếu không ta hẳn đã bỏ lỡ khoảnh khắc này.\n\nThay vào đó, ta tự hào đứng giữa sân trong, khoác lên mình bộ y phục lộng lẫy nhất, được bao quanh bởi đội danh dự, khi [1010_target.GetFirstNameNoTooltip] bước vào, thực hiện màn xuất hiện của [1010_target.GetHerHis]."
  ep2_wedding.1010.diplo:0 "\n\n\"Ta vô cùng hân hạnh được chào đón ngài, [1010_target.GetTitledFirstNameNoTooltip]! Ta tin chắc ngài sẽ hài lòng với lòng hiếu khách của ta, và sẽ ấn tượng trước mọi điều kỳ diệu mà lãnh địa này mang lại!\""
  ep2_wedding.1010.seduce:0 "\n\n\"Người thương mến [1010_target.GetTitledFirstNameNoTooltip]! Cuối cùng ngài cũng đã đến! Không có lễ hội nào khiến ta vui sướng bằng việc được đắm mình trong sự hiện diện rực rỡ của ngài!\""
  ep2_wedding.1010.match:0 "\n\n\"[1010_target.GetTitledFirstNameNoTooltip], hoan nghênh! [1010_match.GetFirstName], lại đây chào hỏi đi! — #EMP Nhất định phải tạo ấn tượng tốt với [1010_target.GetHerHim] và gia đình [1010_target.GetHerHis], rõ chưa?!\" ta nói thêm bằng giọng thì thầm đầy giận dữ."
  ep2_wedding.1010.a:0 "Để ta dẫn ngài tham quan khu vườn!"
  ep2_wedding.1010.a.success:0 "[1010_target.GetFirstNameNoTooltip] thích khu vườn của Ngài"
  ep2_wedding.1010.a.success.tt:0 "[1010_target.GetFirstNameNoTooltip] đã bị ấn tượng"
  ep2_wedding.1010.a.failure:0 "Khu vườn của Ngài không gây ấn tượng với [1010_target.GetFirstNameNoTooltip]"
  ep2_wedding.1010.a.failure.tt:0 "[1010_target.GetFirstNameNoTooltip] không bị ấn tượng"
  wedding_welcome_garden_log_title:0 "Ấn Tượng Tốt"
  wedding_welcome_garden_log:0 "[CHARACTER.GetUIName|U] impressed [TARGET_CHARACTER.GetUIName] with [CHARACTER.GetHerHis] gardens"
  wedding_welcome_garden_fail_log_title:0 "Ấn Tượng Xấu"
  wedding_welcome_garden_fail_log:0 "[CHARACTER.GetUIName|U] failed to impress [TARGET_CHARACTER.GetUIName] with [CHARACTER.GetHerHis] gardens"
  ep2_wedding.1010.b:0 "Ngài có muốn xem công tác chuẩn bị địa điểm không?"
  ep2_wedding.1010.b.success:0 "[1010_target.GetFirstNameNoTooltip] trầm trồ trước địa điểm hôn lễ"
  ep2_wedding.1010.b.failure:0 "Địa điểm hôn lễ để lại ấn tượng nhạt nhòa với [1010_target.GetFirstNameNoTooltip]"
  ep2_wedding.1010.c:0 "Mong rằng ngài sẽ tận hưởng nghi lễ!"
  wedding_welcome_ceremony_log_title:0 "$wedding_welcome_garden_log_title$"
  wedding_welcome_ceremony_log:0 "[CHARACTER.GetUIName|U] đã gây ấn tượng với [TARGET_CHARACTER.GetUIName] bằng địa điểm tổ chức nghi lễ"
  wedding_welcome_ceremony_fail_log_title:0 "$wedding_welcome_garden_fail_log_title$"
  wedding_welcome_ceremony_fail_log:0 "[CHARACTER.GetUIName|U] đã không gây được ấn tượng với [TARGET_CHARACTER.GetUIName] bằng địa điểm tổ chức nghi lễ"
 #A Proper Match
  ep2_wedding.1080.t:0 "Mối Lương Duyên Phù Hợp"
  ep2_wedding.1080.desc:0 "Việc chuẩn bị hôn lễ vẫn đang diễn ra hết công suất, nhưng ánh mắt ta đã hướng tới một mục tiêu xa hơn: tìm một đối tượng xứng đôi cho [ROOT.Char.Custom2('RelationToMe', 1080_target)] của ta, [1080_target.GetFirstName]!\n\nMay mắn thay, [1080_target.GetSheHe] đã có mặt tại địa điểm, một khởi đầu tốt, và đang đứng đó đầy lúng túng. Giờ thì tìm một người phù hợp nào... Ánh nhìn của ta bị thu hút bởi một nhóm khách đang trò chuyện, trong đó [matchmaking_1.GetTitledFirstName] nổi bật với vẻ đẹp và phong thái. #EMP Hoàn hảo!#!"
  ep2_wedding.1080.desc_2:0 "\n\nTa đang định bảo [1080_target.GetFirstNameNoTooltip] tiến tới thì lại để ý đến [matchmaking_2.GetTitledFirstName]. Có lẽ [matchmaking_2.GetSheHe] mới là mối lương duyên tốt hơn chăng?"
  ep2_wedding.1080.a:0 "[1080_target.GetFirstNameNoTooltip], đến nói chuyện với [matchmaking_1.GetFirstNameNoTooltip] đi!"
  ep2_wedding.1080.a.success:0 "[1080_target.GetFirstNameNoTooltip] gây ấn tượng với [matchmaking_1.GetFirstNameNoTooltip]"
  ep2_wedding.1080.a.success.tt:0 "Đúng là một cặp đẹp!"
  wedding_propermatch_court_log_title:0 "Tiếng Sét Ái Tình"
  wedding_propermatch_court_log:0 "[CHARACTER.GetUIName|U] bắt đầu theo đuổi [TARGET_CHARACTER.GetUIName]"
  ep2_wedding.1080.a.failure:0 "[1080_target.GetFirstNameNoTooltip] không gây được ấn tượng với [matchmaking_1.GetFirstNameNoTooltip]"
  ep2_wedding.1080.a.failure.tt:0 "Không phải một cặp phù hợp"
  wedding_propermatch_court_fail_log_title:0 "Dư Vị Cay Đắng"
  wedding_propermatch_court_fail_log:0 "[CHARACTER.GetUIName|U] đã không để lại ấn tượng ban đầu tốt với [TARGET_CHARACTER.GetUIName]"
  ep2_wedding.1080.b:0 "[1080_target.GetFirstNameNoTooltip], con thấy [matchmaking_2.GetFirstNameNoTooltip] thế nào?"
  ep2_wedding.1080.b.success:0 "[1080_target.GetFirstNameNoTooltip] gây ấn tượng với [matchmaking_2.GetFirstNameNoTooltip]"
  ep2_wedding.1080.b.failure:0 "[1080_target.GetFirstNameNoTooltip] không gây được ấn tượng với [matchmaking_2.GetFirstNameNoTooltip]"
  ep2_wedding.1080.c:0 "Thôi vậy. Ta sẽ tìm tiếp."
  ep2_wedding.1080.c.tt:0 "Hẳn vẫn còn những ứng viên tốt hơn quanh đây."
 #A Ritual Wash
  ep2_wedding.1100.t:0 "Nghi Thức Tắm Gội"
  ep2_wedding.1100.desc_bride:0 "Ngày cưới của ta đang đến gần, và họ hàng đã tụ tập tại địa điểm suốt nhiều ngày qua, nên ta không lấy làm lạ khi [ROOT.Char.Custom2('RelationToMe', guest_1)] của ta, [guest_1.GetTitledFirstName], cùng [ROOT.Char.Custom2('RelationToMe', guest_2)] của ta, [guest_2.GetTitledFirstName], lôi ta đi đến một nhà tắm hẻo lánh không xa [ROOT.Char.GetCurrentActivity.GetLocation.GetName].\n\n\"Theo những truyền thống cổ xưa của dân tộc ta,\" [guest_1.GetFirstNameNoTooltip] bắt đầu, \"con sẽ cởi bỏ xiêm y cũ và #EMP kransen#! — vòng hoa trinh nguyên\".\n\n\"Chúng ta sẽ tắm rửa cho con thật sạch, và con sẽ được tái sinh thành một cô dâu xinh đẹp!\" [guest_2.GetFirstNameNoTooltip] long trọng kết lời."
  ep2_wedding.1100.desc_relative:0 "Ngày cưới của [ROOT.Char.Custom2('RelationToMe', bride)] ta, [bride.GetTitledFirstNamePossessive], đang đến gần, và gia đình đã ở [ROOT.Char.GetCurrentActivity.GetLocation.GetName] suốt nhiều ngày. Hôm nay, chúng ta sẽ đưa cô dâu đi đến một nhà tắm kín đáo để thực hiện nghi thức tẩy rửa truyền thống.\n\n\"Hôm nay,\" ta bắt đầu, \"con sẽ cởi bỏ xiêm y cũ và #EMP kransen#! — vòng hoa trinh nguyên. Khi đã được làm sạch và thanh tẩy, con sẽ đứng dậy như một cô dâu đích thực!\"\n\nBên cạnh ta, [ROOT.Char.Custom2('RelationToMe', guest_2)] của ta, [guest_2.GetTitledFirstName], reo hò vang dội."
  ep2_wedding.1100.desc_extra_guest:0 "\n\n\"Bọn ta sẽ làm cho con trở nên #EMP xinh đẹp#!!\" [guest_3.GetTitledFirstName|U] reo lên."
  ep2_wedding.1100.a:0 "Truyền thống thì phải được tuân theo."
  wedding_cleansing_log_title:0 "Tẩy Rửa Thanh Khiết"
  wedding_cleansing_log:0 "[CHARACTER.GetUIName|U] đã tham gia nghi thức tẩy rửa truyền thống trước ngày cưới của mình"
  ep2_wedding.1100.b:0 "Sao chúng ta không chơi một trò chơi nhỉ?"
  wedding_cleansing_new_log_title:0 "Tẩy Rửa Mới Lạ"
  wedding_cleansing_new_log:0 "[CHARACTER.GetUIName|U] đã thử một hình thức tẩy rửa mới lạ trước ngày cưới của mình"
  ep2_wedding.1100.c:0 "Mấy truyền thống ngớ ngẩn này..."
  wedding_cleansing_dismiss_log_title:0 "Bỏ Qua Nghi Thức"
  wedding_cleansing_dismiss_log:0 "[CHARACTER.GetUIName|U] đã gạt bỏ nghi thức tẩy rửa truyền thống trước ngày cưới của mình"
  ep2_wedding.1100.d:0 "Tắm táp thật #EMP thư giãn#!..."

 # CEREMONY
 #Could it Be You?
  ep2_wedding.1020.t:0 "Có Phải Là Em?"
  ep2_wedding.1020.desc:0 ""Hôn nhân chỉ là chính trị." Ta tự trấn an khi chờ đợi [spouse_2.Custom('WifeHusband')] tương lai của mình bước tới.\n\n"Chỉ là chính trị thôi." Ta lặp lại trong đầu. "Tệ đến mức nào được chứ?"\n\nNhưng không điều gì có thể chuẩn bị cho Ta khoảnh khắc lần đầu tiên nhìn thấy [spouse_2.GetFirstName]. Không bức chân dung hay lời miêu tả nào có thể lột tả hết vẻ dịu dàng trên gương mặt [spouse_2.GetHerHis]. Chưa từng có thi sĩ nào ca tụng một vẻ đẹp như của [spouse_2.GetHersHis]. Thời gian như ngừng trôi khi ánh mắt chúng Ta chạm nhau, và mọi thứ xung quanh dường như biến mất.\n\nRồi [spouse_2.GetSheHe] mỉm cười với Ta, và Ta biết. Mọi chuyện rồi sẽ ổn thôi."
  ep2_wedding.1020.a:0 "Có phải là em — người Ta đã chờ đợi bấy lâu?"
  wedding_first_sight_log_title:0 "Mũi Tên Thần Tình Ái"
  wedding_first_sight_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã yêu nhau ngay từ cái nhìn đầu tiên"
 #A Good/Bad Omen
  ep2_wedding.1030.t:0 "Một Điềm [ROOT.Char.Custom('GoodBad')|U]"
  ep2_wedding.1030.desc:0 "Khách mời đã tề tựu đông đủ, nghi lễ sắp bắt đầu và mọi thứ tưởng như đâu vào đấy, thì một chuyện bất thường xảy ra ngay trước mắt Ta.\n\n"
  ep2_wedding.1030.desc_good1:0 "Một con vịt hoang lạc đàn len lỏi giữa đám đông khách mời, lạch bạch tiến thẳng về phía [spouse_2.GetTitledFirstName], người vẫn chưa hề để ý. Khi đến gần [spouse_2.GetHerHim], con chim bất ngờ kêu lên một tiếng #EMP QUẠC QUẠC!!#! chói tai, quay đầu bỏ đi, để lại [spouse_2.GetFirstNamePossessiveNoTooltip] sững sờ và cả đám đông cười rộ."
  ep2_wedding.1030.desc_good2:0 "[spouse_2.GetTitledFirstName|U], on [spouse_2.GetHerHis] way to [spouse_2.GetHerHis] future [ROOT.Char.GetWifeHusband], trips and flails around, about to fall! When a concerned servant approaches, [spouse_2.GetSheHe] just smiles and picks up the culprit: a horseshoe!"
  ep2_wedding.1030.desc_good3:0 "A flock of birds on our left takes flight abruptly when [spouse_2.GetTitledFirstName] appears, and flies straight over [spouse_2.GetHerHis] head to [spouse_2.GetHerHis] right!"
  ep2_wedding.1030.desc_bad1:0 "Một người hầu trên đường vào bếp trượt chân, làm đổ cả lọ muối xuống đất!"
  ep2_wedding.1030.desc_bad2:0 "The lucky charm that [spouse_2.GetTitledFirstName] was wearing around [spouse_2.GetHerHis] neck comes unfastened and slips off to the ground, to be carelessly stepped on by hurried servants!"
  ep2_wedding.1030.desc_bad3:0 "Mây đen kéo đến từ hư không, tụ lại ngay phía trên nơi cử hành hôn lễ. Bầu trời nắng đẹp nhanh chóng trở nên u ám và đe dọa, phủ bóng xấu lên nghi lễ sắp bắt đầu."
  ep2_wedding.1030.desc_outro:0 "\n\n[1030_chatter.GetTitledFirstName], người cũng chứng kiến toàn bộ cảnh tượng như Ta, bắt gặp ánh mắt Ta và nhận xét:"
  ep2_wedding.1030.desc_good:0 ""Thật là... bất ngờ, phải không?""
  ep2_wedding.1030.desc_bad:0 ""Thật là... tệ hại, phải không?""
  ep2_wedding.1030.a:0 "Đúng là một điềm lành!"
  wedding_omen_good_log_title:0 "Điềm Lành"
  wedding_omen_good_log:0 "[CHARACTER.GetUIName|U] đã thấy một điềm lành liên quan đến [TARGET_CHARACTER.GetUIName]"
  ep2_wedding.1030.b:0 "Nó #EMP CHẲNG CÓ Ý NGHĨA GÌ#! cả."
  wedding_omen_bad_log_title:0 "Điềm Gở"
  wedding_omen_bad_log:0 "[CHARACTER.GetUIName|U] đã thấy một điềm gở liên quan đến [TARGET_CHARACTER.GetUIName]"
  ep2_wedding.1030.c:0 "Thật là một điềm dữ khủng khiếp! Chúng ta TIÊU RỒI!"
  wedding_omen_dismissed_log_title:0 "Bỏ Qua Điềm Báo"
  wedding_omen_dismissed_log:0 "[CHARACTER.GetUIName|U] đã gạt bỏ một điềm gở liên quan đến [TARGET_CHARACTER.GetUIName]"
  ep2_wedding.1030.d:0 "Tuyệt vời! Một đám cưới đúng chất nhà [ROOT.Char.dynasty.GetName]!"
 #New Family
  ep2_wedding.1120.t:0 "Gia Đình Mới"
  ep2_wedding.1120.desc:0 "Lễ cưới lúc nào cũng dài dòng, khá nhàm chán và phần lớn chẳng có gì đáng chú ý — cho đến khi phía sau Ta bỗng náo loạn."
  ep2_wedding.1120.desc_child:0 "\n\nI immediately recognize the familiar sound of [trouble_child.GetFirstNamePossessive] best complaining voice, as [trouble_child.GetSheHe] makes [trouble_child.GetHerHis] way through the crowd. "[ROOT.Char.GetMotherFather|U], is this supposed to be my new [other_parent.GetMotherFather], instead of [other_parent.GetFirstName]?""
  ep2_wedding.1120.desc_adult:0 "\n\n"Ta có điều muốn nói!" Giọng quen thuộc của [trouble_child.GetFirstNamePossessive] vang lên từ trong đám đông. "Đây #EMP là cái thứ#! tốt nhất mà người có thể thay thế [other_parent.GetMotherFather] của con, [other_parent.GetTitledFirstName], sao?!""
  ep2_wedding.1120.desc_parent:0 "\n\nKhóe mắt Ta bắt gặp [other_parent.GetFirstNameNoTooltip] đứng sững lại vì kinh ngạc."
  ep2_wedding.1120.a:0 "Dừng trò nhảm nhí này lại. #EMP Ngay.#!"
  ep2_wedding.1120.b:0 "Ta hiểu, cưng à, chuyện này khó khăn với tất cả chúng ta..."
  ep2_wedding.1120.c:0 "#EMP [other_parent.GetMotherFather] của con đáng lẽ phải là bí mật!#!"
  wedding_child_fuss_log:0 "Đứa con của [TARGET_CHARACTER.GetUINamePossessive|U], [CHARACTER.GetUIName|U], đã gây náo loạn trong lễ cưới."
  wedding_child_fuss_log_title:0 "$ep2_wedding.1120.t$"
  wedding_child_fuss_secret_log:0 "Đứa con của [TARGET_CHARACTER.GetUINamePossessive|U], [CHARACTER.GetUIName|U], đã gây náo loạn trong lễ cưới và tiết lộ một bí mật về thân thế của mình."
  wedding_child_fuss_secret_log_title:0 "Bí Mật Bị Tiết Lộ"
  ep2_wedding.1121.desc_child:0 "\n\nỞ trung tâm của sự việc là [other_spouse.GetFirstNamePossessive] [trouble_child.Custom('GetDaughterSon')], [trouble_child.GetTitledFirstName], đang sụt sịt khóc lóc. "[other_spouse.GetMotherFather|U], sao người lại thay thế [other_parent.GetMotherFather] của con, [other_parent.GetFirstName] chứ?""
  ep2_wedding.1121.desc_adult:0 "\n\n"Ta có điều muốn nói!" [trouble_child.GetTitledFirstName], [other_spouse.GetFirstNamePossessive] [trouble_child.Custom('GetDaughterSon')], gầm lên từ trong đám đông. "Đây #EMP là cái thứ#! tốt nhất mà người có thể thay thế [other_parent.GetMotherFather] của con, [other_parent.GetTitledFirstName], sao?!""
  ep2_wedding.1121.a:0 "Im đi, #EMP nhóc con#!."
  ep2_wedding.1121.b:0 "Ta sẽ là một phụ huynh tốt hơn!"
  ep2_wedding.1122.desc_repentant:0 "Ta đang thưởng thức một phần lớn [ROOT.Char.Custom('GetExpensiveMeal')], hoàn toàn vô tư, thì [trouble_child.GetFirstName] với vẻ mặt vô cùng hối lỗi tiến lại gần Ta.\n\n"[ROOT.Char.GetMotherFather|U], con muốn xin lỗi vì đã gây náo loạn trong buổi lễ. Hành vi đó không xứng với sự giáo dưỡng và địa vị của con, và con thực sự hối hận.""
  ep2_wedding.1122.desc_unrepentant:0 "Ta cố tận hưởng phần [ROOT.Char.Custom('GetExpensiveMeal')] thịnh soạn, nhưng những lời lẽ gay gắt của [trouble_child.GetFirstNamePossessive] cùng việc vô tình phơi bày bí mật của Ta cứ ám ảnh tâm trí.\n\nKhi cuối cùng Ta tiến tới chỗ [trouble_child.GetHerHim], [trouble_child.GetFirstNameNoTooltip] tỏ ra hoàn toàn thản nhiên và không hề hối lỗi. "Ta vẫn giữ nguyên những gì đã nói, và #EMP không hối hận#! chút nào. Đó chỉ là sự thật." [trouble_child.GetSheHe] đáp lại với một nụ cười khinh khỉnh."
  1122_child_pacified_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName|U] đã có một cuộc trò chuyện thẳng thắn để làm rõ mọi chuyện."
  1122_child_pacified_log_title:0 "Đoàn Tụ Gia Đình"
  1122_child_not_pacified_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName|U] không thể tìm được tiếng nói chung."
  1122_child_not_pacified_log_title:0 "Bất Hòa Gia Đình"
  ep2_wedding.1122.a:0 "Ta tha thứ cho con."
  ep2_wedding.1122.b:0 "Hành động đó thực sự không thể chấp nhận được."
  ep2_wedding.1122.c:0 "Ta phải tôn trọng nỗi thất vọng của con."
  ep2_wedding.1122.d:0 "Thật không thể chấp nhận nổi!"
 #Secret Whispers
  ep2_wedding.1130.t:0 "Lời Thì Thầm Bí Mật"
  ep2_wedding.1130.desc:0 "Nghi lễ đang diễn ra sôi nổi, nhưng Ta không thể tập trung vào những gì đang xảy ra #EMP phía trước#! khi liên tục nghe thấy những tiếng xì xào vọng lên từ #EMP phía sau#!. Nếu lắng nghe kỹ, Ta có thể bắt gặp vài mẩu câu chuyện dường như là một cuộc buôn chuyện lớn, với cả khách mời lẫn người hầu tham gia. #EMP"Ngươi có nghe chưa-" "Liệu có thật không?" "Thế còn-" "-không biết à??"#!\n\n"
  ep2_wedding.1130.desc_continue:0 "Khi Ta tức giận quay lại để chất vấn, Ta bắt gặp ánh mắt đắc ý của [1130_knows.GetTitledFirstName], kẻ dường như là trung tâm của toàn bộ sự náo động. "Ngài không có gì muốn chia sẻ sao, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
  wedding_secret_revealed_log:0 "[CHARACTER.GetUIName|U] đã tiết lộ bí mật của [TARGET_CHARACTER.GetUINamePossessive|U] trong nghi lễ, gây ra một cảnh tượng ồn ào."
  wedding_secret_revealed_log_title:0 "$wedding_child_fuss_secret_log_title$"
  wedding_secret_not_revealed_log:0 "[CHARACTER.GetUIName|U] đã cố tiết lộ bí mật của [TARGET_CHARACTER.GetUINamePossessive|U] trong nghi lễ, nhưng bị tống cổ ra ngoài."
  wedding_secret_not_revealed_log_title:0 "Kẻ Gây Rối Bị Tống Xuất"
  ep2_wedding.1130.a:0 "Ta sẽ không phủ nhận những bằng chứng đó."
  ep2_wedding.1130.b:0 "Lính đâu, tống cổ tên #EMP phỉ báng#! này ra khỏi tầm mắt ta."
  ep2_wedding.1131.desc:0 "Ở trung tâm của sự náo loạn là [1130_knows.GetTitledFirstName], đang mỉm cười đầy đắc ý. "[other_spouse.GetFirstName] chưa từng nói với ngài sao? #EMP Ai cũng#! biết cả!""
  ep2_wedding.1131.a:0 "Không còn bí mật nào giữa chúng ta nữa, [other_spouse.GetFirstNameNoTooltip]."
  ep2_wedding.1131.b:0 "Thật là #EMP quá đáng#!!"
  ep2_wedding.1132.desc:0 "Nghi lễ đang diễn ra sôi nổi nhưng Ta chẳng để tâm mấy, vì tâm trí cứ mãi bị kéo về thông tin đáng lo mà Ta biết được về [spouse_with_secret.GetTitledFirstName]. [other_spouse.GetTitledFirstName] có biết không? Chẳng phải [other_spouse.GetSheHe] nên biết sao?\n\nTa buột miệng chia sẻ vài mối lo ngại với người ngồi cạnh, và trước khi kịp nhận ra, cả đám đông đã xôn xao bàn tán, còn cả [spouse_with_secret.GetFirstNameNoTooltip] lẫn [other_spouse.GetFirstNameNoTooltip] đều tức giận nhìn về trung tâm của sự náo động: chính là Ta."
  ep2_wedding.1132.a:0 "[other_spouse.GetFirstNameNoTooltip] xứng đáng với điều tốt đẹp hơn thế này!"
  ep2_wedding.1132.b:0 "Chỉ là mấy lời đồn #EMP vớ vẩn#! thôi, đúng không, [spouse_with_secret.GetFirstNameNoTooltip]?"
 # A Misstep
  ep2_wedding.1140.t:0 "Một Sơ Suất"
  ep2_wedding.1140.desc:0 "Ta đang tận hưởng nghi lễ, tự hào về những gì mình đã sắp xếp. Mọi thứ đến giờ đều diễn ra suôn sẻ — và ngay khi nghĩ vậy, Ta biết mình đã xui xẻo rồi."
  ep2_wedding.1140.desc_1:0 "\n\n[fumbling_spouse.GetTitledFirstName] trips and falls flat on [fumbling_spouse.GetHerHis] face on [fumbling_spouse.GetHerHis] way to [fumbling_spouse.GetHerHis] spouse!"
  ep2_wedding.1140.desc_2:0 "\n\n[fumbling_spouse.GetTitledFirstName] starts stuttering during the vows, severely mispronouncing [fumbling_spouse.GetHerHis] spouse's name!"
  ep2_wedding.1140.desc_3:0 "\n\n[fumbling_spouse.GetTitledFirstName] đứng sững lại vì bối rối, rõ ràng đã quên mất bước tiếp theo của nghi lễ!"
  ep2_wedding.1140.desc_target:0 "\n\nTa có thể cảm nhận được ánh mắt của [intent_target.GetTitledFirstNamePossessive] xuyên qua đám đông, thúc giục Ta can thiệp."
  ep2_wedding.1140.desc_target_spouse:0 "\n\nTa bắt gặp ánh mắt hoảng loạn của [intent_target.GetTitledFirstNamePossessive] bên kia gian phòng, cầu xin Ta làm gì đó."
  ep2_wedding.1140.a:0 "Ta vẫn có thể cứu vãn tình hình..."
  ep2_wedding.1140.a.success:0 "Ngài đã hóa giải tình huống"
  ep2_wedding.1140.a.success.tt:0 "Ngài đã hóa giải tình huống"
  ep2_wedding.1140.a.success.tt2:0 "[intent_target.GetFirstNameNoTooltip] ấn tượng với cách xử lý khéo léo của Ngài."
  ep2_wedding.1140.a.failure:0 "Ngài chỉ càng tự làm mình xấu hổ"
  ep2_wedding.1140.a.failure.tt:0 "Ngài đã tự làm mình xấu hổ"
  ep2_wedding.1140.b:0 "Tiếp tục thôi."
  ep2_wedding.1140.c:0 "Chuyện thường tình!"
  recovered_from_misstep_log:0 "[CHARACTER.GetUIName|U] đã khéo léo hóa giải một sơ suất do [TARGET_CHARACTER.GetUIName] gây ra."
  recovered_from_misstep_log_title:0 "$ep2_wedding.1140.t$"
  made_a_misstep_log:0 "[CHARACTER.GetUIName|U] đã gây ra một sơ suất trong nghi lễ."
  made_a_misstep_log_title:0 "$ep2_wedding.1140.t$"
 # Romantic Scouting
  ep2_wedding.1150.t:0 "Thăm Dò Lãng Mạn"
  ep2_wedding.1150.desc:0 "Lễ cưới thường dài dòng và tẻ nhạt, và ánh mắt Ta không ngừng dò tìm trong đám khách mời đối tượng khao khát của mình: [intent_target.GetTitledFirstName]."
  ep2_wedding.1150.desc_1:0 "\n\nWhen I finally locate [intent_target.GetHerHim], [intent_target.GetSheHe] is a bit far from the crowd, smelling some flowers from the venue's decoration with a delighted smile on [intent_target.GetHerHis] face."
  ep2_wedding.1150.desc_2:0 "\n\nKhi cuối cùng cũng tìm thấy [intent_target.GetHerHim], [intent_target.GetSheHe] đang chăm chú nhìn những người hầu hối hả mang theo các đĩa thức ăn đầy ắp và những thùng [host.Custom('RegionalDrink')]."
  ep2_wedding.1150.desc_3:0 "\n\nKhi cuối cùng cũng tìm thấy [intent_target.GetHerHim], [intent_target.GetSheHe] đang buôn chuyện với một nhóm khách nhỏ về sự vô nghĩa của hôn lễ."
  ep2_wedding.1150.desc_4:0 "\n\nKhi cuối cùng cũng tìm thấy [intent_target.GetHerHim], [intent_target.GetSheHe] đang thuyết giảng cho vài vị khách khác về sự thiêng liêng của hôn nhân."
  ep2_wedding.1150.desc_fallback:0 "\n\nKhi cuối cùng cũng tìm thấy [intent_target.GetHerHim], [intent_target.GetSheHe] đang bận giao lưu với một nhóm khách nhỏ."
  ep2_wedding.1150.desc_conclusion:0 "Đây là cơ hội hoàn hảo để tiếp cận [intent_target.GetHerHim]."
  ep2_wedding.1150.a:0 "Hoàn cảnh này cần chút #EMP thi ca#!!"
  ep2_wedding.1150.b:0 "Ngươi có biết đám cưới khiến ta ở trong #EMP tâm trạng#! thế nào không?"
  ep2_wedding.1150.c:0 "Ngươi có thể kể thêm cho ta nghe không?"
  seduction_good_impression_log:0 "[CHARACTER.GetUIName|U] đã có một hành động đầy duyên dáng với [TARGET_CHARACTER.GetUIName]."
  seduction_good_impression_log_title:0 "$ep2_wedding.1150.t$"
  ep2_wedding.1150.a.success:0 "[intent_target.GetFirstNameNoTooltip] tỏ ra hứng thú"
  ep2_wedding.1150.a.success.tt:0 "Ngài đã tạo được ấn tượng tốt với [intent_target.GetFirstNameNoTooltip]"
  ep2_wedding.1150.a.failure:0 "[intent_target.GetFirstNameNoTooltip] khó chịu"
  ep2_wedding.1150.a.failure.tt:0 "Ngài đã làm phiền [intent_target.GetFirstNameNoTooltip]"
 # Gatecrashers
  ep2_wedding.1160.t:0 "Khách Không Mời"
  ep2_wedding.1160.desc:0 "Đám cưới của giới quý tộc luôn là một màn trình diễn lớn đối với thường dân, những người tụ tập với hy vọng được thoáng thấy lãnh chúa của mình và nếm trải sự giàu sang.\n\nĐặc biệt, Ta không thể không nhận ra rằng các khâu chuẩn bị cho bữa tiệc linh đình đang diễn ra được một nhóm nông dân trông cực kỳ tiều tụy theo dõi với ánh mắt say mê..."
  ep2_wedding.1160.a:0 "Ta có thể cho họ vào!"
  ep2_wedding.1160.a.tt:0 "Chuyện này sẽ làm không khí thêm náo nhiệt!"
  ep2_wedding.1160.b:0 "Ta có thể lén mang thức ăn cho họ!"
  ep2_wedding.1160.b.tt:0 "[host.GetFirstNameNoTooltip] sẽ chẳng bao giờ nhận ra!"
  ep2_wedding.1160.c:0 "Chuyện này không xứng với ta."
  ep2_wedding.1161.desc:0 "Ta đã để ý đám đông thường dân tụ tập quanh buổi lễ từ lâu.\n\nĐiều Ta không ngờ tới là thấy một nhóm nhỏ trong số họ xông thẳng vào nhà bếp, cố sức uống ngấu nghiến càng nhiều [ROOT.Char.Custom('RegionalDrink')] và [ROOT.Char.Custom('GetExpensiveMeal')] càng tốt!\n\n#EMP Sao họ vào được đây?!#!"
  ep2_wedding.1161.a:0 "Tống cổ chúng ra!"
  ep2_wedding.1161.b:0 "Hãy để mọi người cùng chung vui!"
  ep2_wedding.1161.success:0 "Đám nông dân bị đuổi ra ngoài"
  ep2_wedding.1161.success.tt:0 "Ngài đã lập lại trật tự"
  ep2_wedding.1161.success.tt2:0 "[host.GetFirstName] đã đuổi đám nông dân đi."
  ep2_wedding.1161.failure:0 "Ngài không kiểm soát được đám đông"
  ep2_wedding.1161.failure.tt:0 "Đám khách không mời tiếp tục náo loạn"
  ep2_wedding.1161.failure.tt2:0 "[host.GetFirstName] đã không xử lý được đám khách không mời."
  ep2_wedding.1161.b.tt:0 "[host.GetFirstName] cho phép đám nông dân ở lại."
  wedding_peasant_invasion_managed_log:0 "[CHARACTER.GetUIName|U] đã xử lý thành công cuộc xâm nhập của đám thường dân không mời."
  wedding_peasant_invasion_managed_log_title:0 "$ep2_wedding.1160.t$"
  wedding_peasant_invasion_not_managed_log:0 "[CHARACTER.GetUIName|U] đã không xử lý được cuộc xâm nhập của đám thường dân không mời."
  wedding_peasant_invasion_not_managed_log_title:0 "$ep2_wedding.1160.t$"
  wedding_peasant_invasion_stay_log:0 "[CHARACTER.GetUIName|U] đã cho phép một nhóm thường dân không mời tham gia lễ hội."
  wedding_peasant_invasion_stay_log_title:0 "$ep2_wedding.1160.t$"
 # The Parade
  ep2_wedding.1170.t:0 "Cuộc Diễu Hành"
  ep2_wedding.1170.desc:0 "Sự xuất hiện của [rich_spouse.Custom('GetBrideGroom')], [rich_spouse.GetTitledFirstName], được hộ tống bởi vô vàn phô trương: cả một đoàn ngựa được trang hoàng lộng lẫy thả rơi những chiếc móng bạc cho thường dân nhặt lấy; trống, đàn lia, kèn túi, diễn viên câm, và hề cung đình.\n\nGiờ đây đoàn diễu hành đã tan, nhưng vẫn thu hút một đám đông lớn, làm phân tâm khỏi nghi lễ đang diễn ra."
  ep2_wedding.1170.desc_relax:0 "\n\nTa ước gì có thể tận hưởng mọi thứ cùng lúc! Thay vào đó, ta chạy qua chạy lại giữa màn tung hứng, vuốt ve những con ngựa và màn nuốt lửa."
  ep2_wedding.1170.desc_mischief:0 "\n\nQuá nhiều khả năng! Ta nên thả ngựa ra chăng? Hay trộm một chiếc trống để dọa mấy vị khách khác..."
  ep2_wedding.1170.desc_murder:0 "\n\nI catch a glimpse of [murderee.GetTitledFirstName], enraptured by a musical performance, completely unaware of [murderee.GetHerHis] surroundings..."
  ep2_wedding.1170.a:0 "Ta cũng muốn tham gia!"
  ep2_wedding.1170.a.tt:0 "Ngài lén bỏ túi vài chiếc móng ngựa khi không ai để ý."
  ep2_wedding.1170.b:0 "Vui đấy, nhưng hơi quá đà."
  ep2_wedding.1170.b.tt:0 "Ngài tập trung trở lại nghi lễ."
  ep2_wedding.1170.c:0 "#EMP Thật là phấn khích!#!"
  ep2_wedding.1170.d:1 "Nếu ta làm tên hề kia vấp ngã thì sao?"
  ep2_wedding.1170.e:0 "[murderee.GetFirstNameNoTooltip] đang mất tập trung..."
  ep2_wedding.1170.e.tt:0 "Ngài cố tận dụng đám đông và sự hỗn loạn của cuộc diễu hành."
  ep2_wedding.1170.success:0 "Ngài lẻn ra sau [murderee.GetFirstNameNoTooltip] và #EMP ra tay#!"
  ep2_wedding.1170.success.tt:0 "Ngài biến mất vào đám đông"
  ep2_wedding.1170.failure:0 "Ngài không thể len qua đám đông"
  ep2_wedding.1170.failure.tt:0 "[murderee.GetFirstNameNoTooltip] biến mất trong đám đông"
  wedding_parade_arrival_log:0 "[CHARACTER.GetUIName|U] arrived to [CHARACTER.GetHerHis] wedding with a magnificent parade."
  wedding_parade_arrival_log_title:0 "$ep2_wedding.1170.t$"
  wedding_parade_death_log:0 "[TARGET_CHARACTER.GetUIName|U] đã bị sát hại một cách bí ẩn trong cuộc diễu hành chào mừng sự xuất hiện của [CHARACTER.GetUINamePossessive]."
  wedding_parade_death_log_title:0 "Cái Chết Trong Cuộc Diễu Hành"
 # A Bad Match
  ep2_wedding.1180.t:0 "Một Cuộc Hôn Nhân Tệ Hại"
  ep2_wedding.1180.desc:0 "Khi cuối cùng chúng ta đứng đối diện nhau, Ta có thể thấy qua những cử động bồn chồn của [other_spouse.GetTitledFirstNamePossessive] rằng [other_spouse.GetSheHe] hoàn toàn không thoải mái.\n\nÁnh mắt [other_spouse.GetHerHis|U] tránh né ánh nhìn của Ta, và vẻ cau có trên gương mặt [other_spouse.GetHerHis] nói lên tất cả. [other_spouse.GetSheHe|U] không thích Ta."
  ep2_wedding.1180.a:0 "Ý kiến của ngươi không được yêu cầu."
  ep2_wedding.1180.b:0 "Ta sẽ khiến ngươi phải thích ta!"
  ep2_wedding.1180.c:0 "Ta không quan tâm! Đồ ăn đâu rồi?"
 # Religious Complaints
  ep2_wedding.1190.t:0 "Những Lời Phàn Nàn Tôn Giáo"
  ep2_wedding.1190.desc:1 "Everyone is excited and amazed by the magnificence of the wedding venue. Everyone but [grumbler.GetTitledFirstName].\n\nSince [grumbler.GetHerHis] arrival, [grumbler.GetFirstNameNoTooltip] has been prowling, searching for any pretext to complain. "Are you wearing #EMP make-up#!?!" "Those colorful veils are #EMP sinful#!!" "What's with all the unchaste #EMP mingling#!?" "Is this all a show of luxury and lust?""
  ep2_wedding.1190.a:0 "Ta thật sự cảm thấy hổ thẹn..."
  ep2_wedding.1190.b:0 "Lính canh, tiễn kẻ phá đám này ra ngoài."
  ep2_wedding.1190.c:0 "Ta sẽ giả vờ như không nghe thấy."
  ep2_wedding.1190.d:0 "Đúng vậy, và ta sẽ tận hưởng nó!"
  every_zealous_attending_character:0 "Mọi nhân vật sùng đạo tham dự"
  wedding_religious_complaints_log:0 "[CHARACTER.GetUIName|U] đã làm ầm ĩ về sự xa hoa của hôn lễ và việc khách mời giao thiệp không đoan chính."
  wedding_religious_complaints_log_title:0 "$ep2_wedding.1190.t$"
 # A Parent's Heart
  ep2_wedding.1200.t:0 "Trái Tim Của Một [ROOT.Char.GetMotherFather|U]"
  ep2_wedding.1200.desc:0 "Ngày trọng đại cuối cùng cũng đã đến, và ta chưa bao giờ cảm thấy tự hào hơn về [my_child.GetFirstName], đứa con xinh đẹp của ta, [my_child.Custom('GetBrideGroom')]!\n\nNhư người đứng cạnh ta bất đắc dĩ phải nghe thấy: \"Hãy nhìn [my_child.GetHerHim] kìa! [my_child.GetSheHe] thật #EMP rạng rỡ#! phải không?\" \"Đúng là một cặp đôi hoàn hảo!\" \"Mọi thứ đều thật hoàn mỹ!\""
  ep2_wedding.1200.desc_interest:0 "\n\nKhi cuối cùng ta quay sang bên cạnh, ta nhận ra láng giềng của mình không ai khác ngoài [listener.GetTitledFirstName]! Ta có thể tận dụng khoảnh khắc gắn kết này..."
  ep2_wedding.1200.desc_generic:0 "\n\nBên cạnh ta, [listener.GetTitledFirstName] chỉ mỉm cười lịch sự."
  ep2_wedding.1200.a:0 "Ta thật sự rất tự hào."
  ep2_wedding.1200.b:0 "Chẳng lẽ #EMP ngươi#! không ghen tị sao?"
  ep2_wedding.1200.c:0 "Tình yêu quả thật đang ngập tràn..."
  ep2_wedding.1200.d:0 "Những hôn lễ trọng đại tạo nên những đồng minh trọng yếu!"
  ep2_wedding.1200.d.tt:0 "[listener.GetFirstNameNoTooltip|U] có thể sẽ sẵn sàng cân nhắc một liên minh với Ngài."
  ep2_wedding.1200.e:0 "Giá như ta cũng có thể thấy điều đó với [intent_target.GetFirstNameNoTooltip]..."
  ep2_wedding.1200.success:0 "[listener.GetFirstNameNoTooltip|U] bị ấn tượng"
  ep2_wedding.1200.success.tt:0 "Ngài đã gây ấn tượng với [listener.GetFirstNameNoTooltip]"
  ep2_wedding.1200.failure:0 "[listener.GetFirstNameNoTooltip|U] không bị ấn tượng"
  ep2_wedding.1200.failure.tt:0 "Ngài không gây được ấn tượng với [listener.GetFirstNameNoTooltip]"
  ep2_wedding.1200.e.success:0 "[listener.GetFirstNameNoTooltip|U] tỏ ra hứng thú"
  ep2_wedding.1200.e.failure:0 "[listener.GetFirstNameNoTooltip|U] không hứng thú"
  ep2_wedding.1200.e.success.tt:0 "Ngài đã đạt được tiến triển trong việc se duyên [listener.GetFirstNameNoTooltip] với [intent_target.GetFirstNameNoTooltip]"
  wedding_gloating_log:0 "[CHARACTER.GetUIName|U] đã xúc phạm [TARGET_CHARACTER.GetUIName] khi khoe khoang về hôn lễ thành công."
  wedding_gloating_log_title:0 "Khoe Khoang"
  wedding_alliance_log:0 "[CHARACTER.GetUIName|U] đã giành được một liên minh với [TARGET_CHARACTER.GetUIName] nhờ phô bày các mối hôn nhân quyền lực."
  wedding_alliance_log_title:0 "Liên Minh Mới"
 # Political Talk
  ep2_wedding.1210.t:0 "Chuyện Chính Trị"
  ep2_wedding.1210.desc:0 "As the ceremony runs its course, I finally manage to place myself by [talk_to.GetTitledFirstName] and to engage [talk_to.GetHerHim] in some small talk, which rapidly moves into a more interesting field: politics.\n\nWe share some casual remarks until I lead [talk_to.GetHerHim] exactly where I wanted [talk_to.GetHerHim]."
  ep2_wedding.1210.desc_gold:0 "\n\n\"Thật đau lòng khi phải thừa nhận, nhưng ngân khố của ta đã cạn kiệt!\""
  ep2_wedding.1210.desc_fear:0 "\n\n\"Ta sống trong nỗi sợ thường trực cho [talk_to.GetPrimaryTitle.GetTierAsNameNoTooltip] của mình, và cho chính bản thân ta...\""
  ep2_wedding.1210.desc_raids:0 "\n\n\"Ta vô cùng lo lắng về những cuộc cướp bóc gần đây trên lãnh thổ của mình...\""
  ep2_wedding.1210.desc_rivals:0 "\n\n\"Ta không thể ngủ yên, kẻ thù hiện lên trong mọi bóng tối!\""
  ep2_wedding.1210.desc_age:0 "\n\n\"Thật đau lòng khi phải thừa nhận, nhưng ta không còn trẻ nữa!\""
  ep2_wedding.1210.desc_bad_harvest:0 "\n\n\"Đáng buồn thay, những vụ mùa thất bát gần đây đã kìm hãm sự phát triển của chúng ta...\""
  ep2_wedding.1210.desc_rain:0 "\n\n\"Những cơn mưa bất thường đang hoành hành, gây thiệt hại nghiêm trọng cho mùa màng...\""
  ep2_wedding.1210.desc_enemies:0 "\n\n\"Không bao giờ là quá an toàn. Kẻ thù của ngươi luôn mạnh lên xung quanh.\""
  ep2_wedding.1210.a:0 "Thật đáng tiếc nếu có kẻ lợi dụng điều đó, nhỉ?"
  ep2_wedding.1210.a.success:0 "[talk_to.GetFirstNameNoTooltip] bị đe dọa"
  ep2_wedding.1210.a.failure:0 "[talk_to.GetFirstNameNoTooltip] không bị đe dọa"
  ep2_wedding.1210.b:0 "Có những đồng minh hùng mạnh luôn là điều tốt trong lúc khó khăn!"
  ep2_wedding.1210.b.success:0 "[talk_to.GetFirstNameNoTooltip] bị ấn tượng"
  ep2_wedding.1210.b.failure:0 "[talk_to.GetFirstNameNoTooltip] không tin tưởng Ngài"
  ep2_wedding.1210.c:0 "Ngươi đã từng nghĩ đến việc tìm một người bảo hộ chưa?"
  ep2_wedding.1210.c.success:0 "[talk_to.GetFirstNameNoTooltip] bị thuyết phục"
  ep2_wedding.1210.c.failure:0 "[talk_to.GetFirstNameNoTooltip] trở nên nghi ngờ"
  wedding_intimidation_log:0 "[CHARACTER.GetUIName|U] đã đe dọa [TARGET_CHARACTER.GetUIName] và giành được một móc ràng buộc."
  wedding_intimidation_log_title:0 "Nhận Được Móc"
  wedding_fealty_log:0 "[CHARACTER.GetUIName|U] đã đe dọa [TARGET_CHARACTER.GetUIName] thề trung thành với [CHARACTER.GetHerHim]."
  wedding_fealty_log_title:0 "Chư Hầu Mới"
 # Poisonous Relations
  ep2_wedding.1220.t:0 "Quan Hệ Độc Hại"
  ep2_wedding.1220.desc:0 "Các khâu chuẩn bị và nghi lễ của một đám cưới rất nhiều; trong một khoảng lặng giữa chúng, ta nghe thấy tiếng cười khẩy và chế nhạo từ một nhóm họ hàng của [other_spouse.GetFirstNamePossessive].\n\nKhi nhận ra đã thu hút được sự chú ý của ta, [relative.GetTitledFirstName] bắt đầu nói thẳng vào mặt ta:"
  ep2_wedding.1220.desc_marry_down:0 ""I can't believe our family agreed to let [other_spouse.GetFirstNameNoTooltip] sully [other_spouse.GetHerselfHimself] by marrying such a social inferior!""
  ep2_wedding.1220.desc_feud:0 "\"Ta không thể tin chúng ta lại đồng ý kết duyên với Gia tộc #EMP đáng khinh#! [ROOT.Char.GetHouse.GetName]!\""
  ep2_wedding.1220.desc_despicable:0 "\"Thật là #EMP trắng trợn#! khi chúng ta để [other_spouse.GetFirstNameNoTooltip] tội nghiệp kết hôn với một kẻ đê tiện như #EMP ngươi#!\""
  ep2_wedding.1220.desc_miscreant:1 "\"Sao chúng ta lại để một kẻ #EMP vô lại#! bại hoại như ngươi làm hoen ố [other_spouse.GetFirstNameNoTooltip] tội nghiệp chứ?\""
  ep2_wedding.1220.desc_fallback:0 "\"Thật đáng tiếc khi chúng ta không thể tìm được ai đó #EMP tốt hơn#! cho [other_spouse.GetFirstNameNoTooltip] tội nghiệp, nhưng đời là vậy...\""
  ep2_wedding.1220.desc_target:0 "\n\nSự ồn ào này cũng đã thu hút sự chú ý của [diplo_intent.GetTitledFirstNamePossessive], người giờ đang chăm chú quan sát ta."
  ep2_wedding.1220.a:0 "Vâng vâng, dĩ nhiên rồi..."
  ep2_wedding.1220.b:1 "Đó là một lời thách thức sao?"
  ep2_wedding.1220.c:0 "Ta #EMP sẽ#! chứng minh các ngươi sai."
  ep2_wedding.1220.c.tt:0 "Xử lý tình huống khéo léo cũng sẽ tạo ấn tượng tốt với [diplo_target.GetFirstNameNoTooltip]"
  ep2_wedding.1220.c.success:0 "Ngài đã tạo được ấn tượng tốt với [relative.GetFirstNameNoTooltip]"
  ep2_wedding.1220.c.success.tt:0 "[relative.GetFirstNameNoTooltip] thích Ngài hơn!"
  ep2_wedding.1220.c.failure:0 "Ngài không thể bác bỏ những định kiến của [relative.GetFirstNamePossessiveNoTooltip]"
  ep2_wedding.1220.c.failure.tt:0 "[relative.GetFirstNameNoTooltip] vẫn không thích Ngài!"
  ep2_wedding.1220.d:0 "Ồ, ta còn có thể #EMP tệ hơn nhiều#!!"
  wedding_proved_wrong_log:0 "[CHARACTER.GetUIName|U] convinced [TARGET_CHARACTER.GetShortUIName] of [CHARACTER.GetHerHis] good qualities, disproving [TARGET_CHARACTER.GetShortUINamePossessive] prejudices."
  wedding_proved_wrong_log_title:0 "Bác Bỏ Định Kiến"

 # BANQUET
 #A Kindred Spirit
  ep2_wedding.1040.t:0 "Tri Kỷ Đồng Tâm"
  ep2_wedding.1040.desc:0 "Suốt bữa tiệc, ta nhận ra mình dễ dàng bị cuốn vào câu chuyện với [new_friend.GetTitledFirstNamePossessive].\n\n[new_friend.GetSheHe|U] có những quan điểm vô cùng thú vị, kể những câu đùa duyên dáng nhất, và dường như chúng ta có rất nhiều điểm chung! Mỗi khi ta kể lại một giai thoại, [new_friend.GetSheHe] luôn lắng nghe chăm chú và góp lời đúng lúc, đúng chỗ.\n\nAi mà ngờ được ta lại tìm thấy một người Ngài đồng điệu dễ chịu đến vậy tại một đám cưới cơ chứ?"
  ep2_wedding.1040.a:0 "Ta thật sự rất thích được ở bên [new_friend.GetFirstNamePossessiveNoTooltip]!"
  ep2_wedding.1040.b:0 "Nhưng cũng không cần phải thân thiết hơn."
  wedding_kindred_log_title:0 "Tri Kỷ"
  wedding_kindred_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã trở thành Bạn Bè"
 #A Fiery Dance
  ep2_wedding.1050.t:0 "Vũ Điệu Rực Lửa"
  ep2_wedding.1050.desc:0 "Mọi người đều trong tâm trạng phấn khởi; bên trái ta, một nhóm trẻ con mê mẩn nhìn các nghệ sĩ tung hứng; bên phải, những thi sĩ ngâm vang các tác phẩm mới nhất của mình trước đám đông say mê.\n\nTuy nhiên, cả yến tiệc bỗng im bặt khi một đoàn vũ công cầm đuốc tiến vào trung tâm sảnh tiệc, vừa đi vừa mời gọi khách khứa tham gia. Khung cảnh dưới ánh chiều tà thật ngoạn mục: những ngọn đuốc soi sáng khuôn mặt tươi cười của họ giữa bầu trời đang sẫm tối, đổ nên những cái bóng đan xen huyền ảo.\n\nTất cả đều tuyệt mỹ — cho đến khi [1050_victim.GetTitledFirstName] vấp ngã, làm rơi một ngọn đuốc khỏi tay người bên cạnh, khiến chính y phục của [1050_victim.GetHerHis] bốc cháy..."
  ep2_wedding.1050.a:0 "Ta phải làm gì đó!"
  ep2_wedding.1050.a.success:0 "Ngài cứu được [1050_victim.GetFirstNameNoTooltip] khỏi ngọn lửa"
  ep2_wedding.1050.a.success.tt:0 "Ngài đã cứu [1050_victim.GetFirstNameNoTooltip]!"
  wedding_dance_rescue_log_title:0 "Giải Cứu Giữa Lửa"
