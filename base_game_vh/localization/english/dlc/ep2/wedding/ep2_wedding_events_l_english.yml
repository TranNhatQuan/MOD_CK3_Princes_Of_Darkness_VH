  ep2_wedding.1350.t:0 "Cạn Lời"
  ep2_wedding.1350.desc.intro:0 "Đầu ta nhức nhối bởi tiếng đồ đạc va chạm và khách khứa huyên náo. Hẳn sự căng thẳng đã lộ rõ, bởi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('caring_relative'))] của ta, [caring_relative.GetTitledFirstName], nắm lấy tay ta và dẫn sang căn phòng bên cạnh.\n\nÂm thanh của những khâu chuẩn bị dần lắng xuống. Chúng ta nói những chuyện vụn vặt: những ngày đã qua, những con người từng quen biết, không một lời nào nhắc đến hôn lễ. Rồi lời nói cạn dần, và cả hai chìm vào im lặng."
  ep2_wedding.1350.a:0 "Tận hưởng khoảnh khắc yên bình bên nhau."
  ep2_wedding.1350.b:1 "Nói với [caring_relative.GetShortUINameNoTooltip] rằng sự hiện diện của họ có ý nghĩa lớn lao thế nào."
