  ep2_wedding.1050.d.tt:0 "Trong lúc hoảng loạn, Ngài có thể xô ai đó vào lửa"
  ep2_wedding.1050.d.tt.2:0 "Ngài đã xô [other_victim.GetShortUIName] vào ngọn lửa!"
