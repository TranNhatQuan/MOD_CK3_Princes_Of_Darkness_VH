 #A Match Made In...?
  ep2_wedding.1090.t:0 "Lương Duyên Do Ai Sắp Đặt...?"
  ep2_wedding.1090.desc:0 "Đám đông đang hò reo và nâng cốc chúc mừng đôi tân hôn, nhưng giữa họ, ta dường như đã đánh mất bóng dáng của [ROOT.Char.Custom2('RelationToMe', 1090_target)] của mình, [1090_target.GetFirstName]."
  ep2_wedding.1090.desc_already_matched:0 "\n\nSau một hồi tìm kiếm cẩn thận, cuối cùng ta cũng thấy [1090_target.GetHerHim] ở một góc khuất, đang trò chuyện say sưa với không ai khác ngoài [1090_match.GetTitledFirstName] — chính là người mà trước đây ta đã cố gắng se duyên cho [1090_target.GetHerHim]! Có lẽ ta không nên xen vào..."
  ep2_wedding.1090.desc_new_match:0 "\n\nSau một hồi tìm kiếm cẩn thận, cuối cùng ta cũng thấy [1090_target.GetHerHim], đang ngồi trong một góc và chăm chú, thậm chí là đầy khao khát, nhìn về phía [1090_match.GetTitledFirstName], người đang làm náo động một nhóm khách hiếu động bằng những câu chuyện và trò đùa của [1090_match.GetHerHis]."
  ep2_wedding.1090.a:0 "Hãy đến gặp [1090_match.GetHerHim]."
  ep2_wedding.1090.b:0 "[1090_match.GetSheHe|U] không phù hợp với ngươi."
  ep2_wedding.1090.a.success:0 "[1090_target.GetFirstNameNoTooltip] ngỏ lời cầu hôn [1090_match.GetFirstNamePossessiveNoTooltip]"
  ep2_wedding.1090.a.failure:0 "[1090_match.GetFirstNameNoTooltip] không bị [1090_target.GetFirstNameNoTooltip] gây ấn tượng"
