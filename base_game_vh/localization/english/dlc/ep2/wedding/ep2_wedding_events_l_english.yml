l_english:
 
 # MAINTENANCE
  ep2_wedding.0001.t:0 "[GetActivityType('activity_wedding').GetNameNoTooltip]: Hết Hạn Đính Hôn"
  ep2_wedding.0001.desc:0 "Thời gian đã không còn đứng về phía ta. Ta cứ nghĩ mình vẫn còn đủ thời gian để tổ chức một [GetActivityType('activity_wedding').GetName] đàng hoàng, nhưng một bức thư giận dữ từ [spouse_2.GetTitledFirstName] nhắc nhở ta rằng sự kiên nhẫn của [spouse_2.GetHerHis] đã cạn, và thời gian của ta cũng đã hết."
  ep2_wedding.0001.desc_betrothed:0 "\n\nVì không thể tổ chức lễ cưới giữa [spouse_1.GetTitledFirstName] và [spouse_2.GetFirstNameNoTooltip] trong khoảng thời gian đã thỏa thuận, hôn ước nay được xem là vô hiệu."
  ep2_wedding.0001.desc_self:0 "\n\nVì không thể tổ chức lễ cưới giữa ta và [spouse_2.GetFirstNameNoTooltip] trong khoảng thời gian đã thỏa thuận, hôn ước nay được xem là vô hiệu."
  ep2_wedding.0001.desc_conclusion:0 "\n\n[spouse_2.GetFirstNameNoTooltip] dĩ nhiên vô cùng thất vọng và nhắc nhở ta rằng sẽ có hậu quả..."
  ep2_wedding.0001.a:0 "Có lẽ chúng ta không có duyên."
  ep2_wedding.0002.t:0 "[GetActivityType('activity_wedding').GetNameNoTooltip]: Qua Đời Quá Sớm"
  ep2_wedding.0002.desc:0 "Tin dữ ập đến với ta sáng nay: [dead_spouse.GetTitledFirstName], người được hứa gả cho [alive_spouse.GetTitledFirstName] trong một [GetActivityType('activity_wedding').GetName], đã qua đời, và mọi sự chuẩn bị cẩn thận của ta đều trở nên vô nghĩa!\n\nĐã đến lúc tìm một mối lương duyên mới."
  ep2_wedding.0002.a:0 "Bi kịch của đời người."
  ep2_wedding.0003.desc:0 "Không điều gì có thể chuẩn bị cho ta trước bức thư ta đang cầm trên tay run rẩy: vị hôn thê của ta, [dead_spouse.GetTitledFirstName], người ta được hứa sẽ cưới trong một [GetActivityType('activity_wedding').GetName], đã đột ngột qua đời.\n\nSẽ không có lễ ăn mừng nào cho ta, và mọi sự chuẩn bị cẩn thận của gia đình ta nay đều thành công cốc."
  ep2_wedding.0003.a:0 "Một bi kịch thực sự..."
  ep2_wedding.0100.t:0 "Lễ Cưới Bắt Đầu"
  ep2_wedding.0100.desc_host:1 "Luôn là một cảm giác tuyệt vời khi Ngài đã chuẩn bị cho một việc trong thời gian dài — và tiêu tốn #EMP rất nhiều tiền#! — để rồi cuối cùng nó cũng #EMP diễn ra#!.\n\nMọi thứ đã sẵn sàng: trang trí đã hoàn tất, khách khứa đang chuyện trò, và đám gia nhân tất bật với những mâm thức ăn đầy ắp."
  ep2_wedding.0100.desc_host_outro:0 "Hai phu thê, [spouse_1.GetTitledFirstName] và [spouse_2.GetTitledFirstName], đều đã có mặt, rạng rỡ trong bộ y phục đẹp nhất.\n\nChỉ cần ta ra hiệu, mọi người sẽ vào vị trí và nghi lễ sẽ bắt đầu."
  ep2_wedding.0100.desc_host_spouse:0 "$ep2_wedding.0100.desc_host$ Ta đi lại không yên vì phấn khích và hồi hộp khi người Ngài đời tương lai của ta, [my_spouse.GetTitledFirstName], xuất hiện, rạng rỡ trong bộ y phục lộng lẫy nhất của [my_spouse.GetHerHis].\n\nChúng ta đã sẵn sàng bắt đầu."
  ep2_wedding.0100.desc_spouse:1 "Cuối cùng ngày này cũng đã đến — ngày ta thành hôn với [my_spouse.GetTitledFirstName]!\n\nTa vừa háo hức vừa khiếp sợ trước ngày hôm nay và tương lai đang chờ đợi, nhưng không thể không ấn tượng trước sự kiện hoành tráng do chủ lễ hào phóng của chúng ta, [host.GetTitledFirstName], tổ chức.\n\nKhi ta thấy [host.GetHerHim] vẫy tay ra hiệu đầy phấn khích, ta hiểu rằng đã đến lúc bắt đầu."
  ep2_wedding.0100.desc_guest:1 "Ta nhìn quanh với niềm phấn khích.\n\nKhắp nơi là khách khứa đang chuyện trò, hoa trang trí trên mọi bề mặt, gia nhân tất bật với những mâm thức ăn đầy ắp, và một chủ lễ vô cùng tự hào, [host.GetTitledFirstName], đang kiểm tra những chi tiết cuối cùng. Hai phu thê hồi hộp nhưng phấn khởi, [spouse_1.GetTitledFirstName] và [spouse_2.GetTitledFirstName], đang đứng sẵn sàng.\n\nNghi lễ sắp bắt đầu!"
  ep2_wedding.0100.desc_root_pregnant:0 "Tuy nhiên, khi tiến về phía Ngài đời của mình, ta không thể không nhận ra ánh mắt phán xét của mọi vị khách đang dán chặt vào cái bụng mang thai quá rõ ràng của ta. Thôi thì kệ vậy..."
  ep2_wedding.0100.desc_spouse_pregnant:0 "Tuy nhiên, ngay lập tức có thể thấy rằng sự chú ý của mọi người — kể cả ta — đều đổ dồn vào cái bụng mang thai không thể che giấu của cô dâu... Chuyện này sẽ khá là khó xử."
  ep2_wedding.0100.a:0 "Ta không chờ nổi nữa!"
  ep2_wedding.0101.desc:0 "Mọi sự chuẩn bị của ta sắp sửa đơm hoa kết trái.\n\nNhưng trước mắt, hãy để nghi lễ bắt đầu!"
  ep2_wedding.0150.t:0 "Nghi Lễ Thành Hôn"
  ep2_wedding.0150.desc:1 "Nghi lễ cuối cùng cũng đạt đến cao trào.\n\nNhững nghi thức truyền thống đã hoàn tất, và tất cả những gì còn lại là lời thề cuối cùng, sự chấp thuận chính thức, dấu ấn cho cuộc hôn nhân! Khi cả [spouse_1.GetTitledFirstName] và [spouse_2.GetTitledFirstName] cùng thốt lên lời \"Ta đồng ý\", đám đông vỡ òa reo hò, và tất cả chúng ta đều chứng kiến khoảnh khắc họ bắt đầu cuộc sống chung."
  ep2_wedding.0150.a:0 "Thật hào hứng!"
  ep2_wedding.0151.desc_diplo:0 "Đằng sau mọi nghi thức và lễ nghi, hôn lễ trước hết vẫn là những sự kiện chính trị. Khi nghi lễ tiến đến cao trào, tâm trí ta đã hướng về những điều sắp tới. Liệu liên minh này có bền vững không? Người Ngài đời mới của ta có thực sự là một sự trợ giúp xứng đáng trong việc cai quản lãnh thổ của ta?\n\nTuy nhiên, vẫn còn một câu hỏi nữa ta phải trả lời trước điều đó, khi đã đến lúc ta phải đưa ra sự chấp thuận rõ ràng cho cuộc hôn nhân này.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_religious:0 "Mọi bước trong một nghi lễ đều quan trọng. Suy cho cùng, tính hợp lệ của bất kỳ nghi thức nào cũng dựa trên việc tái hiện chính xác từng phần của nó.\n\nTa đã dõi theo cẩn thận từng cử chỉ, từng lời nói, từng bước đi — đâu phải ngày nào cũng được tự mình thực hiện #EMP lễ cưới#! của mình!! Giờ đây, khoảnh khắc trọng yếu nhất đã đến, và ta phải đưa ra sự chấp thuận cho sự kết hợp này.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_party:0 "Khi nghi lễ cuối cùng cũng đạt đến cao trào, và cả ta lẫn Ngài đời đều được hỏi về sự chấp thuận chính thức, ta hầu như chẳng để tâm, tâm trí rộn ràng vì buổi tiệc sắp tới: từng đống món ăn ngon, rượu uống không giới hạn, và vô số gương mặt hân hoan để cùng chia sẻ — ta không thể tưởng tượng điều gì tuyệt hơn! Nhưng trước mắt, hãy cứ hoàn tất các thủ tục đã.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_seducer:0 "Mọi nghi lễ cưới hỏi đều giống nhau: chỉ là việc chất chồng những lời sáo rỗng và những lời hứa hẹn trống rỗng lên cao nhất. Như thể hạnh phúc và sự thỏa mãn có thể tìm thấy ở một con người duy nhất!\n\nKhi nghi lễ chạm đến đỉnh điểm và ta được hỏi về sự chấp thuận chính thức cùng lời thề của mình, ta khịt mũi cười khẩy, bởi câu hỏi ấy vừa mỉa mai vừa vô nghĩa.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_shy:0 "Mọi thứ thật quá tải: trang trí, khách khứa trò chuyện, các nghi thức và lời chúc phúc nối tiếp nhau, cùng ánh mắt sắc lạnh của [spouse_2.Custom('GetBrideGroom')] đang nhìn chằm chằm vào ta, đánh giá từng cử động.\n\nTất cả hòa quyện thành một cơn lốc hỗn loạn khiến ta run rẩy vì căng thẳng, cho đến khi khoảnh khắc trao lời hứa chính thức đến — quá nhanh.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_arrogant:0 "Ngày mới chỉ vừa bắt đầu mà ta đã chán ngấy những lời lảm nhảm không dứt của đám được gọi là giới chức tôn giáo, kẻ chúc tụng, bọn xu nịnh và lũ gia nhân ngơ ngác. Không có gì lạ khi ta đã bực bội suốt phần lớn nghi lễ.\n\nĐến lúc đưa ra sự chấp thuận chính thức cho hôn nhân, sự kiên nhẫn của ta đã cạn, và ta buông lời đáp lại đầy cáu kỉnh.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_paranoid:0 "Ta hầu như chẳng nhớ gì về toàn bộ nghi lễ, mải mê dò xét kẻ thù trong từng cái bóng và dựng lên những viễn cảnh đáng sợ cho tương lai trong đầu.\n\nGiờ đây, đã đến lúc đặt dấu ấn chính thức cho sự kết hợp của chúng ta bằng lời chấp thuận, và ta không khỏi tự hỏi liệu mình đang rước một người Ngài hay một kẻ thù không đội trời chung vào nhà.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_appearance:0 "Phần lớn nghi lễ giờ đã trôi qua.\n\nKhi đứng đối diện với [spouse_2.Custom('GetBrideGroom')] để đưa ra sự chấp thuận chính thức cho cuộc hôn nhân, ta lại rùng mình, cố gắng đọc xem trên nét mặt của [spouse_2.GetHerHis] liệu thân thể tàn tạ này có khiến [spouse_2.GetHerHim] ghê tởm và cản trở hạnh phúc của chúng ta hay không. Rồi đến lượt ta cất lời.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc:1 "Nghi lễ trôi qua trong mơ hồ. Ta hầu như không nhớ nổi các bước, nghi thức và lời chúc phúc đã trải qua, và giờ đây đã đến lúc trao lời thề, sự chấp thuận chính thức, dấu ấn thực sự của hôn nhân.$ep2_wedding.0151.desc_end$"
  ep2_wedding.0151.desc_end:0 "\n\nTa có muốn dành phần đời còn lại của mình bên [spouse_2.GetFirstName] không?"
  ep2_wedding.0151.desc.murder:0 "Đã đến lúc trao lời thề. \"Hãy chứng giám lời thề của ta rằng ta sẽ không nhận ai khác làm Ngài đời ngoài nàng,\" ta lẩm bẩm. \"Mãi mãi.\" Ta trấn an [spouse_2.GetHerHis], siết chặt tay [spouse_2.GetHerHis].\n\nMay mắn thay, quãng đời còn lại của chúng ta sẽ #EMP vô cùng#! ngắn ngủi."
  ep2_wedding.0151.a:0 "Ta đồng ý."
  ep2_wedding.0151.b:0 "Ta không đồng ý!"
  ep2_wedding.0151.b.tt:0 "Sẽ có hậu quả..."
  ep2_wedding.0152.t:0 "Hủy Bỏ Lễ Cưới"
  ep2_wedding.0152.desc:0 "Sự từ chối của ta vấp phải những tiếng hít vào kinh ngạc từ đám đông, và một sự im lặng đầy bất định.\n\nTa có thể thấy gương mặt của [spouse_2.GetFirstNamePossessive] dần chuyển từ sững sờ sang phẫn nộ, và đột nhiên nghe thấy làn sóng lời đồn đại bùng nổ sau lưng mình, nhưng ta không quan tâm. Ta đơn giản là không thể chấp nhận việc cưới [spouse_2.GetFirstNameNoTooltip]!\n\nTa sẽ chấp nhận mọi hậu quả."
  ep2_wedding.0152.a:0 "Không nghĩa là KHÔNG."
  ep2_wedding.0200.t:0 "Yến Tiệc Cưới Bắt Đầu"
  ep2_wedding.0200.desc_host:0 "Mọi nghi thức đã ở lại phía sau, giờ là lúc ăn mừng!\n\nTa ra hiệu cho gia nhân mang thức ăn và rượu ra, đồng thời dẫn khách khứa đến nơi tổ chức yến tiệc.\n\nHãy để yến tiệc cưới bắt đầu!"
  ep2_wedding.0200.desc:0 "Phần trang trọng của lễ cưới — nghi lễ — cuối cùng cũng đã kết thúc.\n\nMọi người đều mỉm cười chờ đợi bữa tiệc khổng lồ, những màn giải trí sôi động và bầu không khí vui chơi náo nhiệt sắp được dâng lên.\n\nHãy cùng nhập tiệc!"
  ep2_wedding.0200.desc_spouse_dislike:0 "Nghi lễ đã kết thúc suôn sẻ, và giờ ta đã kết hôn với [my_spouse.GetFirstName] đáng ghét.\n\nKhi bước vào nơi tổ chức yến tiệc, ta thấy xung quanh toàn là những vị khách vui vẻ, háo hức tham gia lễ hội. Ta ước gì mình có thể chia sẻ niềm vui ấy. Ta ngồi vào chỗ được chỉ định và cầu xin [ROOT.Char.GetFaith.HighGodName] ban cho ta sức mạnh.\n\nVà giờ thì, hãy để màn kịch bắt đầu!"
  ep2_wedding.0200.desc_spouse_like:0 "Khi nghi lễ kết thúc và mọi người cùng tiến vào nơi tổ chức yến tiệc, ta khẽ mỉm cười với chính mình, hình dung những niềm vui đang chờ đợi trong cuộc sống hôn nhân với [my_spouse.GetFirstName].\n\nKhông phải ai cũng may mắn được cưới một người dễ mến đến vậy!\n\nTa mong mọi người cùng chia sẻ niềm hạnh phúc của ta, và hãy cùng nhập tiệc!"
  ep2_wedding.0200.desc_spouse_party:0 "Cảm giác như cả một đời đã trôi qua kể từ khi nghi lễ bắt đầu, nhưng giờ đây khi cuối cùng cũng được tự do, ta thật sự mong chờ phần #EMP thú vị#! nhất trong ngày: yến tiệc!\n\n...Dĩ nhiên, ta cũng đã có được một #EMP người Ngài đời#! từ toàn bộ sự việc này, nhưng ta sẽ nghĩ đến chuyện đó sau khi bữa tiệc đã mang lại cho ta một nụ cười trọn vẹn.\n\nGiờ thì, hãy ăn mừng!"
  ep2_wedding.0200.desc_spouse_shy:0 "Nếu ta nghĩ nghi lễ đã đủ căng thẳng, thì chẳng điều gì có thể chuẩn bị cho ta cảm giác bồn chồn ngay sau đó.\n\nYến tiệc đang chờ đợi, với làn sóng lời chúc tụng, âm thanh ồn ào, nghệ sĩ biểu diễn, và nhận thức dần rõ rằng ta đã chính thức kết hôn và cuộc đời mình sắp thay đổi sâu sắc.\n\nVì thế, với bàn tay hơi run, ta nâng chén của mình lên để chúc mừng. Hãy để lễ hội bắt đầu."
  ep2_wedding.0200.desc_spouse_arrogant:0 "Khi mọi nghi thức nhàm chán cuối cùng cũng xong xuôi, tất cả chúng ta tiến đến nơi tổ chức yến tiệc.\n\nSự kiên nhẫn của ta đã sắp cạn khi gia nhân mang từng món ăn ra, một cách #EMP chậm đến tra tấn#!, còn [my_spouse.GetFirstName] thì nhìn ta đầy lo lắng.\n\nTrước khi ta kịp hối hận thêm về toàn bộ sự việc, ta chộp lấy chén rượu và hô lớn \"Hãy bắt đầu bữa tiệc này đi!\""
  ep2_wedding.0200.desc_spouse_fallback:0 "Nghi lễ trang trọng đã kết thúc, và ta chính thức kết hôn với [my_spouse.GetFirstName]. Ta sẽ cần chút thời gian để làm quen với ý nghĩ đó, và ta thẫn thờ tự hỏi cuộc đời mình rồi sẽ ra sao.\n\nTuy nhiên, những suy tư ấy nhanh chóng bị cắt ngang khi toàn bộ đoàn cưới bắt đầu di chuyển về phía nơi tổ chức yến tiệc.\n\nSẽ còn thời gian để nghĩ về tương lai. Trước mắt, hãy ăn mừng!"
  ep2_wedding.0200.a:0 "Tận hưởng đi!"
  ep2_wedding.0300.t:0 "Đêm Tân Hôn Bắt Đầu"
  ep2_wedding.0300.desc:0 "Ta có thể thấy mọi vị khách đều đã thỏa mãn và khá mệt mỏi, nhưng ngày hội vẫn chưa kết thúc.\n\nTa nhanh chóng tổ chức một đoàn rước long trọng để đưa đôi tân hôn về phòng riêng. Hãy để họ ăn mừng #EMP riêng tư#!. Còn với những người ở lại, hãy rót thêm một chén nữa!"
  ep2_wedding.0300.desc_spouse:0 "Bữa tiệc dần lắng xuống, mọi người đều no nê và mệt mỏi, nhưng ngày hôm nay vẫn chưa kết thúc đối với ta và [other_spouse.GetFirstName].\n\nMột đoàn khách dẫn chúng ta về phòng riêng, bởi tính hợp lệ của hôn nhân phụ thuộc vào việc nó được hoàn hợp!"
  ep2_wedding.0300.desc_guest:0 "Cảm giác như ta đã ăn uống, giao lưu, nhảy múa và ca hát suốt nhiều ngày liền.\n\nChẳng bao lâu nữa, lễ hội sẽ lắng xuống, và đôi phu thê sẽ lui về phòng riêng để hoàn tất hôn lễ. Còn với những người ở lại, hãy rót thêm một chén nữa và cùng nâng ly chúc mừng họ!"
  ep2_wedding.0300.a:0 "Đã đến lúc!"
  every_attending_relative_of_spouse_2:0 "Mọi thân quyến tham dự của [spouse_2.GetUIName]"
  ep2_wedding.0900.t:0 "Lễ Cưới Bị Vô Hiệu"
  ep2_wedding.0900.desc:0 "Tin tức về cái chết đột ngột của [dead_spouse.GetTitledFirstNamePossessive] giáng xuống đoàn cưới như tiếng sấm giữa trời quang.\n\nTiếng hát lặng đi, những nụ cười hóa thành nước mắt, hoa trên mặt đất bị giẫm nát và vương vãi bởi đám đông đang đau buồn.\n\nThật là một bi kịch khi một ngày đáng lẽ dành cho hạnh phúc lại biến thành ngày tang tóc..."
  ep2_wedding.0900.a:0 "Quả là một bi kịch..."
  ep2_wedding.9000.tt:0 "[previous_host.GetUIName|U] đã nhận lại khoản hoàn tiền cho [GetActivityType('activity_wedding').GetName] bị hủy trị giá [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0]"
  ep2_wedding.0910.desc:0 "Tin tức về cái chết đột ngột của [dead_spouse.GetTitledFirstNamePossessive] đánh thẳng vào tim ta, bất ngờ và thảm khốc ngay trong chính ngày cưới của chúng ta.\n\nChúng ta thậm chí còn chưa kết hôn được một ngày, vậy mà người đã bị cướp khỏi ta..."
  ep2_wedding.0910.a:0 "Hãy để ta ở một mình để than khóc..."
  ep2_wedding.9015.tt:0 "[ROOT.Char.GetUIName|U] đã nhận lại khoản hoàn tiền cho [GetActivityType('activity_wedding').GetName] bị hủy trị giá [gold_i][THIS.Var('gwedding_gold_recoup_value').GetValue|V0]"
  ep2_wedding.0915.desc:0 "[previous_host.Custom2('MyCharacterIntroduction', ROOT.Char)] đang tổ chức một [GetActivityType('activity_wedding').GetName] vào thời điểm [previous_host.GetHerHis] qua đời. Một hoạt động thú vị mà ta lại không được mời.\n\nGiờ đây khi [previous_host.GetSheHe] đã khuất, buổi tiệc rơi vào hỗn loạn và mọi người đều bị cho về nhà trong thất vọng."
  ep2_wedding.0915.a:0 "Lẽ ra ta nên có mặt."
  ep2_wedding.0920.desc:0 "Ta đã thật sự mong chờ lễ cưới của mình với [free_spouse.GetTitledFirstName], nhưng có vẻ như [ROOT.Char.GetFaith.HouseholdGodName] đã có kế hoạch khác cho ta — hoặc cho [free_spouse.GetFirstNameNoTooltip].\n\nDù hôn ước vẫn còn, lời hứa về một Đại Hôn Lễ giờ đã hoàn toàn vô hiệu."
  ep2_wedding.0920.a:0 "Thật buồn..."
  ep2_wedding.0921.desc:0 "Tin tức về việc [prisoner_spouse.GetTitledFirstNamePossessive] bị giam cầm đã chấm dứt mọi cuộc ăn mừng. Có vẻ như [ROOT.Char.GetFaith.HouseholdGodName] đã có kế hoạch khác cho [prisoner_spouse.GetHerHim].\n\nDù hôn ước vẫn còn, lời hứa về một Đại Hôn Lễ giờ đã hoàn toàn vô hiệu."
  ep2_wedding.0921.a:0 "Thật đáng thất vọng."
  ep2_wedding.0950.t:0 "Hồi Kết"
  ep2_wedding.0950.desc:0 "Khi — #EMP cuối cùng#! — vị khách cuối cùng rời đi, ta nhìn quanh địa điểm trống trải, thức ăn thừa, [ROOT.Char.Custom('RegionalDrink')] đổ trên sàn, dư âm tiếng cười của mọi người vẫn còn vang vọng trong không khí, và cảm thấy mãn nguyện.\n\nThật là một ngày tuyệt vời! Ta đã làm rất tốt trong việc tổ chức nó."
  ep2_grand_wedding_host_incentives_effect.tt:0 "Các nhân vật khác sẽ có nhiều khả năng chấp nhận lời cầu hôn của nhân vật này hơn trong vòng 20 năm tới."
  ep2_wedding.0950.a:0 "Cảm ơn tất cả đã đến!"
  ep2_wedding.0960.desc:0 "Mặt trời ló rạng cho một ngày mới — ngày đầu tiên của cuộc đời ta bên [other_spouse.GetFirstName].\n\nĐã đến lúc khép lại những lễ hội và cuộc vui, dù chúng có ngọt ngào đến đâu, để bước vào nhịp sống mới."
  ep2_wedding.0970.desc:0 "Từng người một, các vị khách lần lượt ra về, và cũng đã đến lúc ta phải rời đi.\n\nLễ cưới là dịp tuyệt vời để giao lưu với những người đồng cấp và thư giãn, và ta rời khỏi nơi này trong trạng thái mệt mỏi nhưng mãn nguyện, gửi lời chúc tốt đẹp nhất đến đôi phu thê cho một cuộc hôn nhân thịnh vượng và hạnh phúc."
  ep2_wedding.0970.a:0 "Chúc mừng lần nữa!"
  ep2_wedding.0997.desc_intro:0 "Việc chờ đợi [missing_spouse.GetFirstName] đã kéo dài quá lâu, và giờ đây rõ ràng rằng [missing_spouse.GetSheHe] đã biến mất trên đường đi.\n\nChẳng bao lâu, dân chúng bắt đầu bàn tán. Lời đồn từ một thị trấn không xa cho rằng [missing_spouse.GetSheHe] lần cuối được nhìn thấy tại một khu chợ nhếch nhác khi mua thảo dược, trong khi người khác lại thề rằng họ đã thấy [missing_spouse.GetHerHim] lên một con tàu đi về miền đất xa xôi."
  ep2_wedding.0997.desc_spouse:0 "\n\nDù thế nào đi nữa, rõ ràng là [missing_spouse.GetFirstNameNoTooltip] đã bỏ trốn vì [missing_spouse.GetSheHe] thà sống cuộc đời lang bạt của [missing_spouse.GetHerHis] còn hơn là kết hôn với ta."
  ep2_wedding.0997.desc_generic:0 "\n\nDù thế nào đi nữa, rõ ràng là [missing_spouse.GetFirstNameNoTooltip] đã bỏ trốn vì [missing_spouse.GetSheHe] thà sống cuộc đời lang bạt của [missing_spouse.GetHerHis] còn hơn là kết hôn với [other_spouse.GetFirstName]."
  ep2_wedding.0998.desc:0 "Luôn là một ngày buồn khi mọi hy vọng gắn liền với một lễ cưới mới đều tan thành mây khói, và mọi công sức bỏ ra để tổ chức một sự kiện trọng đại đều trở nên vô nghĩa.\n\nĐáng tiếc thay, lễ cưới này đơn giản là không có duyên thành hiện thực.\n\nKhi gia nhân bắt đầu dọn dẹp, các vị khách rời đi thành từng nhóm trong sự bối rối và thất vọng để trở về nhà."
  ep2_wedding.0998.a:0 "Thật đáng tiếc."
  ep2_wedding.0999.t:0 "$ep2_wedding.0900.t$"
  ep2_wedding.0999.desc:0 "Tin tức gần đây đã cắt ngang lễ hội, khiến mọi người bàng hoàng và bối rối.\n\nRõ ràng là địa vị và tài sản của chủ lễ không cho phép buổi cưới tiếp tục, và thiếu đi một chủ lễ đủ mạnh để điều phối, chúng ta chỉ còn cách lặng lẽ quay về nhà trong thất vọng."
  ep2_wedding.0999.a:0 "Thật đáng buồn..."
 
