 # An Exotic Show
  ep2_wedding.1070.t:0 "Màn Trình Diễn Kỳ Lạ"
  ep2_wedding.1070.desc_host:0 "Ta đảo mắt nhìn quanh với nụ cười mãn nguyện. Bầu không khí của yến tiệc thật thư thái, các vị khách vui vẻ trò chuyện cùng nhau, tận hưởng âm nhạc và các tiết mục giải trí — hoàn toàn không hay biết rằng phần đặc sắc nhất mà ta chuẩn bị để khiến họ kinh ngạc vẫn còn ở phía trước. Ta ra hiệu cho gia nhân tiếp tục."
  ep2_wedding.1070.desc_guest:0 "Ta đang tận hưởng khoảng thời gian tuyệt vời tại yến tiệc cưới. Đặc biệt là [host.GetTitledFirstName] đã không tiếc chi phí cho việc giải trí! Những nhạc công xuất sắc nhất đang biểu diễn, các diễn viên và nghệ sĩ tung hứng phô diễn tài nghệ, còn các du ca ngâm vang những vần thơ tao nhã. Vì vậy ta không khỏi ngạc nhiên khi [host.GetFirstNameNoTooltip] ra hiệu mang thêm thứ gì đó vào."
  ep2_wedding.1070.desc_mid:0 "\n\nBốn gia nhân nhanh chóng quay lại, kéo theo một chiếc lồng giam giữ một con [host.Custom('GetAnimalTypeCaptive')] oai vệ — loài thú tuyệt mỹ nhất mà ta từng thấy."
  ep2_wedding.1070.desc_good:0 "Con thú có phần bồn chồn, nhưng song sắt đủ vững chắc, và mọi người đều thưởng thức màn trình diễn từ vị trí an toàn."
  ep2_wedding.1070.desc_bad:0 "Con thú trở nên hung hăng, và ta quan sát với cảm giác bất an khi chiếc lồng rên rỉ theo từng cử động của nó. Rồi, với một tiếng #EMP rắc#! khủng khiếp, một thanh song quan trọng gãy nát — và địa ngục bỗng chốc bùng nổ."
  ep2_wedding.1070.desc_bad_target:0 "\n\n[1070_target.GetTitledFirstName] nhanh chóng bị vây quanh."
  ep2_wedding.1070.a:0 "Quả là một màn trình diễn tuyệt hảo."
