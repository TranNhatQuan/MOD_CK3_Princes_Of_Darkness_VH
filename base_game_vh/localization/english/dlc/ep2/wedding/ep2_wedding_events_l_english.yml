 #A Friend Is Monopolizing Your Attention
  ep2_wedding.1310.t:0 "Không Thể Rời Đi"
  ep2_wedding.1310.desc_spouse:0 "Ta biết mình nên dành thời gian cho [other_spouse.GetWifeHusband] mới cưới của mình là [other_spouse.GetFirstName] và gia đình của [other_spouse.GetHerHis], nhưng Ta просто không thể rời xa người Ngài [friend.GetTitledFirstName]! Ta có thể thấy [other_guest.GetTitledFirstName] bắt đầu liếc nhìn Ta đầy khó chịu, $ep2_wedding.1310.howlingwithlaughter$"
  ep2_wedding.1310.desc_host:0 "Với tư cách là chủ hôn lễ, Ta biết mình nên dành thời gian cho đôi uyên ương và gia đình của họ, nhưng Ta просто không thể rời xa người Ngài [friend.GetTitledFirstName]! Ta có thể thấy [other_guest.GetTitledFirstName] bắt đầu liếc nhìn Ta đầy khó chịu, $ep2_wedding.1310.howlingwithlaughter$"
  ep2_wedding.1310.desc_guest:0 "Ta biết mình nên giao lưu với các vị khách khác, nhưng Ta просто không thể rời xa người Ngài [friend.GetTitledFirstName]! Ta có thể thấy [other_guest.GetTitledFirstName] đang cố thu hút sự chú ý của Ta, $ep2_wedding.1310.howlingwithlaughter$"
  ep2_wedding.1310.howlingwithlaughter:0 "nhưng mỗi khi Ta định xin phép rời đi, [friend.GetFirstNameNoTooltip] lại khiến Ta cười nghiêng ngả thêm lần nữa."
  ep2_wedding.1310.a:1 "Thật là một niềm vui khi có [friend.GetFirstNameNoTooltip] ở bên Ta!"
  ep2_wedding.1310.b:1 "[other_guest.GetFirstNameNoTooltip], lại đây tham gia cùng chúng Ta nào!"
  ep2_wedding.1310.c:0 "Chúng ta lén ra ngoài để nói chuyện cho đàng hoàng đi!"
  ep2_wedding.1310.d:0 "Xin thứ lỗi cho Ta, thưa Ngài."
  wedding_banquet_bond_log_title:0 "Gắn Kết Yến Tiệc"
  wedding_banquet_bond_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã trò chuyện và cười đùa suốt buổi tiệc, khiến tình  Bạn củahọ thêm bền chặt."
  ep2_wedding.1310.b.newfriends:1 "[other_guest.GetFirstNameNoTooltip] hòa hợp tuyệt vời với Ngài và [friend.GetFirstNameNoTooltip]"
  ep2_wedding.1310.log.b.newfriends:0 "[CHARACTER.GetUIName|U] called [TARGET_CHARACTER.GetUIName] to [CHARACTER.GetHerHis] table, and [TARGET_CHARACTER.GetSheHe] got along splendidly with [CHARACTER.GetShortUINamePossessive] friends."
  ep2_wedding.1310.log.b.newfriends_title:0 "$wedding_banquet_bond_log_title$"
  ep2_wedding.1310.b.goodtime:0 "[other_guest.GetShortUIName] có khoảng thời gian vui vẻ cùng Ngài và [friend.GetShortUIName]"
  wedding_cannot_escape_goodtime_log_title:0 "Khoảng Thời Gian Vui Vẻ"
  wedding_cannot_escape_goodtime_log:0 "[CHARACTER.GetUIName|U] được gọi đến bàn của [TARGET_CHARACTER.GetUINamePossessive], và họ đã có một khoảng thời gian vui vẻ bên nhau."
  wedding_cannot_escape_badtime_log_title:0 "Khoảng Thời Gian Tồi Tệ"
  wedding_cannot_escape_badtime_log:0 "[CHARACTER.GetUIName|U] được gọi đến bàn của [TARGET_CHARACTER.GetUINamePossessive], và một cuộc cãi vã đã nổ ra."
  wedding_cannot_escape_friends_log_title:0 "Bạn Bè Mới"
  wedding_cannot_escape_friends_log:0 "[CHARACTER.GetUIName|U] được gọi đến bàn của [TARGET_CHARACTER.GetUINamePossessive], và họ nhanh chóng trở thành Bạn Thân."
  ep2_wedding.1310.b.badtime:0 "[other_guest.GetShortUIName] và [friend.GetShortUIName] rơi vào một cuộc tranh cãi"
  wedding_cannot_escape_sneak_log_title:0 "Khoảnh Khắc Riêng Tư"
  wedding_cannot_escape_sneak_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] lén rời khỏi yến tiệc để trò chuyện."
  wedding_cannot_escape_excuse_log_title:0 "Xin Phép Rời Đi"
  wedding_cannot_escape_excuse_log:0 "[CHARACTER.GetUIName|U] chủ động rời Bạn Bè để dành thời gian cho [TARGET_CHARACTER.GetUIName]."
  ep2_wedding.1310.d.tt:1 "Đừng lo, [friend.GetFirstNameNoTooltip] sẽ hiểu."

 #A Rival Seeks Forgiveness
  ep2_wedding.1320.t:0 "Cơ Hội Bắt Đầu Lại?"
  ep2_wedding.1320.desc_intro:0 "Tên [rival.GetTitledFirstName] đáng ghét đó đã nhìn chằm chằm Ta từ bên kia bàn tiệc. Ánh mắt chúng Ta chạm nhau, và Ta căng thẳng chờ đợi một cuộc cãi vã khi [rival.GetSheHe] bước về phía Ta. Khoan đã... [rival.GetSheHe] đang khóc sao?\n\n"
  ep2_wedding.1320.desc_host_vs_spouse:0 "\"Vì sao ngài lại tổ chức một hôn lễ lộng lẫy đến vậy cho ta?\""
  ep2_wedding.1320.desc_host_vs_guest:0 "\"Vì sao ngài lại mời ta đến một hôn lễ lộng lẫy như thế này?\""
  ep2_wedding.1320.desc_spouse_vs_guest:0 "\"Vì sao ta lại được mời đến hôn lễ của ngài?\""
  ep2_wedding.1320.desc_guest_vs_host:0 "\"Ta chưa từng nghĩ ngài sẽ đến.\""
  ep2_wedding.1320.desc_guest_vs_spouse:0 "$ep2_wedding.1320.desc_guest_vs_host$"
  ep2_wedding.1320.desc_spouse_vs_host:0 "\"Chắc hẳn trông rất kỳ lạ khi ta lại là người tổ chức hôn lễ cho ngài.\""
  ep2_wedding.1320.desc_guest_vs_guest:0 "\"Được thấy ngài trong một dịp hạnh phúc như thế này khiến ta phải suy nghĩ.\""
  ep2_wedding.1320.desc_outro:0 " Sau tất cả những gì đã xảy ra giữa chúng ta...\" Đôi mắt [rival.GetHerHis|U] ngấn lệ. \"Ta ước gì có thể rút lại tất cả!\"\""
  ep2_wedding.1320.a:0 "Ta ôm lấy [rival.GetFirstNameNoTooltip] và tha thứ tất cả!"
  ep2_wedding.1320.a.friendliness:0 "[rival.GetShortUINameNoTooltip] trân trọng cử chỉ hòa giải của Ngài"
  ep2_wedding.1320.a.friend:0 "[rival.GetShortUINameNoTooltip] đón nhận cử chỉ hòa giải của Ngài"
  wedding_embraced_rival_log_title:0 "Ôm Hòa Giải"
  wedding_embraced_rival_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã ôm nhau và chấm dứt mối thù địch!"
  ep2_wedding.1320.b:0 "Ta ném thẳng [host.Custom('GetExpensiveMeal')] vào khuôn mặt tự mãn của [rival.GetHerHis]."
  ep2_wedding.1310.b.nowound:1 "[rival.GetFirstNameNoTooltip|U] bị làm nhục"
  ep2_wedding.1310.b.wound:1 "[rival.GetFirstNameNoTooltip|U] slips and hits [rival.GetHerHis] head"
  wedding_dished_rival_log_title:0 "Làm Nhục Kình Địch"
  wedding_dished_rival_log:0 "[CHARACTER.GetUIName|U] đã ném [CHARACTER.Custom('GetExpensiveMeal')] vào mặt [TARGET_CHARACTER.GetUINamePossessive]."
  ep2_wedding.1320.c:0 "\"Sự tha thứ đáng giá bao nhiêu với ngươi?\""
  ep2_wedding.1310.c.hook:1 "[rival.GetFirstNameNoTooltip|U] đề nghị bù đắp cho Ngài"
  ep2_wedding.1310.c.apology:1 "[rival.GetFirstNameNoTooltip|U] xin lỗi Ngài"
  ep2_wedding.1310.c.refusal:1 "[rival.GetFirstNameNoTooltip|U] từ chối hạ mình"
  wedding_hooked_rival_log_title:0 "Nắm Thóp Kình Địch"
  wedding_hooked_rival_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã thương lượng để chấm dứt mối thù."
  wedding_apology_rival_log_title:0 "Kình Địch Xin Lỗi"
  wedding_apology_rival_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã thương lượng để chấm dứt mối thù."
  wedding_refusal_rival_log_title:0 "Kình Địch Hiếu Chiến"
  wedding_refusal_rival_log:0 "[TARGET_CHARACTER.GetUIName] cố gắng hòa giải với [CHARACTER.GetUIName], nhưng cuối cùng họ lại cãi vã như mọi khi."
  ep2_wedding.1320.d:0 "Ta phớt lờ [rival.GetShortUIName] cho đến khi [rival.GetSheHe] bỏ đi."

 # WEDDING NIGHT
 #That Cursed Table
  ep2_wedding.1060.t:0 "Chiếc Bàn Bị Nguyền Rủa"
  ep2_wedding.1060.desc:1 "Với một tiếng thở dài nặng nề, Ta rời bỏ mọi lễ hội bên ngoài và khép lại cánh cửa phòng tân hôn của chúng Ta. Đó là một ngày dài, nhưng một đám cưới thì phải được #EMP hoàn phòng#!, đúng không?\n\nTa không thể không để ý rằng [spouse_2.GetTitledFirstName] ngày càng trở nên bồn chồn khi buổi tối trôi qua, nhưng Ta cũng không nghĩ nhiều. Ai mà chẳng hơi căng thẳng trong ngày cưới của mình chứ? Thế nhưng, khi Ta với tay đến lớp áo lót của chàng, Ta bàng hoàng nhận ra chàng kém #EMP hứng khởi#! hơn Ta tưởng rất nhiều.\n\nChàng gần như giật bắn người và kêu lên: \"Chính căn phòng này! Cái giường! Hay cái bàn đầu giường kia! Có khi là tấm thảm treo tường? Sinh lực của ta đã bị nguyền rủa rồi!!\""
  ep2_wedding.1060.a:0 "#EMP ĐƯỢC THÔI#!."
  ep2_wedding.1060.a.tt:1 "Ngài đảm bảo rằng [spouse_2.GetFirstNameNoTooltip] sẽ không còn cớ để viện dẫn nữa"
  ep2_wedding.1060.b:0 "Ta hiểu. Đừng lo."
  ep2_wedding.1061.desc:0 "Suốt một giờ qua, đám gia nhân liên tục ra vào phòng tân hôn của Ta, hốt hoảng dọn đi toàn bộ đồ đạc và vật trang trí. Giờ đây, chỉ còn lại một chiếc bàn trơ trọi, đứng cô độc giữa căn phòng.\n\nNgồi lên đó, trần trụi chẳng kém gì chiếc bàn, chờ đợi người chồng mới cưới của mình là [spouse_2.GetTitledFirstName], Ta không khỏi mỉm cười đầy thâm ý, nghĩ rằng giờ thì chàng sẽ không còn bất kỳ cái cớ nào nữa."
  ep2_wedding.1061.desc_1:0 "\n\nKhi chàng bước vào phòng, vẻ ngạc nhiên trên khuôn mặt nhanh chóng tan biến, nhường chỗ cho sự ham muốn."
  ep2_wedding.1061.desc_2:0 "\n\n[spouse_2.GetFirstNameNoTooltip] bước vào phòng muộn, mắt nhìn xuống, tay chân bồn chồn. Cách chàng cố tình tránh ánh nhìn dò hỏi của Ta đã cho Ta mọi câu trả lời cần biết."
  ep2_wedding.1061.a:0 "Đúng thế chứ còn gì nữa!"
  ep2_wedding.1061.b:0 "#EMP CÚT ĐI! Ngươi còn đê tiện hơn cả một con giun!#!"
  ep2_wedding.1061.c:0 "Thôi vậy. Không có gì phải vội."
  THEY_ARE_ACCUSED_IMPOTENCY:0 "Ngài đã tố cáo [secondary_recipient.GetShortUIName] là bất lực"
  ep2_wedding.1065.desc:0 "Cuối cùng cũng rời khỏi đám đông reo hò bên ngoài, [spouse_2.GetTitledFirstName] và Ta ở một mình trong phòng tân hôn. Đó là một ngày dài, nhưng một đám cưới thì phải được #EMP hoàn phòng#!, đúng không?\n\nKhông may thay, [spouse_2.GetFirstNameNoTooltip] nhanh chóng nhận ra rằng #EMP một vài bộ phận#! của Ta lại không hề sốt sắng như những phần khác, và dù có dỗ dành, hối lộ hay đe dọa đến đâu thì mọi thứ cũng chẳng khá hơn là bao.\n\n\"Ta đang cố đây mà!\" Ta thốt lên. Thật là #EMP xấu hổ#!!"
  ep2_wedding.1065.a:0 "#EMP Chắc chắn ta đã bị nguyền rủa rồi!!#!"
  ep2_wedding.1065.a.tt:0 "[spouse_2.GetShortUINamePossessive] cong môi cười mỉa, nhưng [spouse_2.GetSheHe] không nói gì khi [spouse_2.GetSheHe] rời khỏi phòng"
  ep2_wedding.1065.b:0 "Ta chỉ đang căng thẳng thôi..."
  ep2_wedding.1065.b1:1 "[spouse_2.GetFirstNameNoTooltip] tỏ ra kiên nhẫn"
  ep2_wedding.1065.b2:1 "[spouse_2.GetFirstNameNoTooltip] lên án sự yếu kém của Ngài"
  ep2_wedding.1066.desc:0 "[spouse_2.GetTitledFirstName|U] quay lại phòng tân hôn vài phút sau đó, theo sau là mấy gia nhân bối rối, lập tức bắt tay vào việc dọn sạch toàn bộ đồ đạc và trang trí trong phòng. Mọi câu hỏi của Ta đều chỉ nhận lại sự im lặng bướng bỉnh. Khi họ rời đi, chỉ còn lại một chiếc bàn trơ trọi. Một chiếc bàn trơ trọi với một [spouse_2.GetFirstNameNoTooltip] #EMP trần trụi chẳng kém#! nằm trên đó.\n\n\"Ta không còn thấy vật gì #EMP bị nguyền rủa#! nữa, ngươi thấy sao?\" [spouse_2.GetSheHe|U] mỉm cười đầy ẩn ý."
  ep2_wedding.1066.desc_1:0 "\n\nMọi suy nghĩ trong đầu Ta tan biến."
  ep2_wedding.1066.desc_2:0 "\n\n\"#EMP Ồ.#!!\" Ta lắp bắp, cố kéo dài thời gian. \"Ý ta là... Không phải vậy — Ta muốn nói là—\" Nhưng ánh nhìn lạnh lẽo của [spouse_2.GetHerHis] khiến Ta đứng chết trân tại chỗ."
  ep2_wedding.1066.a:0 "Kết cục tốt đẹp là được!"
  ep2_wedding.1066.b:0 "Ta thề là không phải #EMP cố ý#!!"
  ep2_wedding.1066.b_1:0 "[spouse_2.GetFirstNameNoTooltip] cảm thấy bị xúc phạm."
  ep2_wedding.1066.b_2:0 "[spouse_2.GetFirstNameNoTooltip] tỏ ra kiên nhẫn và cảm thông."
 #One More Goblet
  ep2_wedding.1110.t:0 "Thêm Một Chén Nữa"
  ep2_wedding.1110.desc_intro:0 "Sau khi đôi tân lang tân nương rời đi về phòng riêng, lễ hội vẫn tiếp diễn suốt đêm, chỉ dần dần lắng xuống về mức độ náo nhiệt và ồn ào. Từng người một, phần lớn khách khứa либо ra về, либо ngủ gục, либо lui về để tự mình tận hưởng những thú vui của đêm tối."
  ep2_wedding.1110.desc:0 "\n\n#EMP Hầu hết#! khách mời, nhưng không phải là [1110_drunk.GetTitledFirstName]. [1110_drunk.GetSheHe|U] lớn tiếng gọi hết chén này đến chén khác, cười ầm ĩ nhất, và kiên quyết từ chối mọi nỗ lực của gia nhân nhằm đưa [1110_drunk.GetHerHim] đến một nơi yên tĩnh hơn."
  ep2_wedding.1110.desc_host:0 "\n\nTa thực sự nên làm gì đó với [1110_drunk.GetHerHim]..."
  ep2_wedding.1110.a:0 "Đúng là có người chẳng biết xấu hổ."
  wedding_goblet_refusal_log_title:0 "Ở Quá Lâu"
  wedding_goblet_refusal_log:0 "[CHARACTER.GetUIName|U] đã tự làm xấu mặt [CHARACTER.GetHerselfHimself] khi say xỉn và từ chối rời đi"
  ep2_wedding.1110.b:0 "Đủ rồi!"
  ep2_wedding.1110.b.tt:0 "Lính canh của Ngài sẽ tiễn [1110_drunk.GetHerHim] ra cửa"
  wedding_goblet_eject_log_title:0 "Bị Đuổi Ra Ngoài"
  wedding_goblet_eject_log:0 "[CHARACTER.GetUIName|U] đã tống cổ [TARGET_CHARACTER.GetUIName] khỏi tiệc cưới vì say xỉn và gây rối"
  ep2_wedding.1110.c:0 "Nếu không đánh lại được thì nhập bọn luôn!"
  wedding_goblet_fool_log_title:0 "Bẽ Mặt Tột Cùng"
  wedding_goblet_fool_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã tự làm trò cười vì say xỉn và gây rối"
  ep2_wedding.1111.desc:0 "#EMP Hầu hết#! khách mời, nhưng không phải là ta!\n\n\"Mang thêm cho ta một chén nữa! Rồi thêm một chén nữa!\" Ta gào lên với bất kỳ gia nhân nào lọt vào tầm mắt."
  ep2_wedding.1111.desc_host:0 "Dù sao thì ta cũng là người trả tiền cho tất cả, chẳng phải ta xứng đáng hay sao?"
  ep2_wedding.1111.desc_conclusion:0 "\n\nFrom [1111_other.GetHerHis] table, however, I can feel [1111_other.GetTitledFirstNamePossessive] judging stare on me. "Haven't you drunk enough for today?" [1111_other.GetSheHe|U] inquires coldly."
  ep2_wedding.1111.a:0 "Xin lỗi, ta sẽ kiềm chế lại..."
  wedding_goblet_reprimand_log_title:0 "Bị Khiển Trách"
  wedding_goblet_reprimand_log:0 "[CHARACTER.GetUIName|U] bị khiển trách vì say xỉn và gây rối tại yến tiệc cưới"
  ep2_wedding.1111.b:0 "Đừng càu nhàu nữa, lại đây uống cùng ta!"
  ep2_wedding.1111.b.1:1 "[1111_other.GetFirstNameNoTooltip|U] tham gia cùng Ngài"
  ep2_wedding.1111.b.1.tt:1 "[1111_other.GetFirstNameNoTooltip|U] đã tham gia cùng Ngài"
  ep2_wedding.1111.b.2:1 "[1111_other.GetFirstNameNoTooltip|U] cho người đuổi Ngài ra ngoài"
  ep2_wedding.1111.b.2.tt:1 "[1111_other.GetFirstNameNoTooltip|U] đã đuổi Ngài ra ngoài"
  ep2_wedding.1111.b.3:1 "[1111_other.GetFirstNameNoTooltip|U] âm thầm không hài lòng"
  ep2_wedding.1111.b.3.tt:1 "[1111_other.GetFirstNameNoTooltip|U] không tán thành bạn"

 #Why Would You Marry Someone Like Me?
  ep2_wedding.1300.t:0 "Vì Sao Lại Là Ta?"
  ep2_wedding.1300.desc_intro:0 "Ta tỉnh giấc trong chiếc giường lạnh lẽo vào đêm tân hôn. [spouse_2.GetTitledFirstName] đứng bên cửa sổ, đôi tay [spouse_2.GetHerHis] nổi da gà trong làn không khí ban đêm.\n\n"
  ep2_wedding.1300.desc_appearance:0 "\"Ta xấu xí. Ai cũng nói vậy, dù họ có nói nhỏ đi chăng nữa.\""
  ep2_wedding.1300.desc_dark_past:0 "\"Những việc ta đã làm... chẳng ai cho phép ta quên chúng.\""
  ep2_wedding.1300.desc_voice:0 ""I..." [spouse_2.GetSheHe] pauses to collect [spouse_2.GetHerHis] words. "I can barely even speak without everyone laughing at me behind their hands."
  ep2_wedding.1300.desc_lowborn:0 "\"Ta chỉ là kẻ thấp hèn vô danh. Ta không thuộc về triều đình này. Ta cảm giác như ai cũng đang cười vào mặt ta.\""
  ep2_wedding.1300.desc_outro:0 " Vì sao một [ROOT.Char.GetTitleAsNameNoTooltip] lại muốn cưới một kẻ như ta?\""
  ep2_wedding.1300.followup.tt:0 "[spouse_2.GetShortUIName|U] will react according to [spouse_2.GetHerHis] personality, and might feel reassured or offended"
  ep2_wedding.1300.followup.a:0 "Những bất an của [spouse_2.GetShortUINamePossessiveNoTooltip|U] được xoa dịu"
  ep2_wedding.1300.followup.b:0 "[spouse_2.GetShortUINameNoTooltip|U] chấp nhận tính thực tế của cuộc hôn nhân này"
  ep2_wedding.1300.followup.c:0 "[spouse_2.GetShortUINameNoTooltip|U] cảm thấy bị hiểu lầm"
  ep2_wedding.1300.virtue:0 "Ta chọn nàng vì đức hạnh của nàng."
  ep2_wedding.1300.virtue.tt:0 "Lựa chọn này khả dụng vì [spouse_2.GetShortUIName] là một [spouse_2.GetWomanMan] đức hạnh"
  ep2_wedding.1300.rule_together:0 "Ta cần một người như nàng để cùng ta cai trị."
  ep2_wedding.1300.rule_together.tt:0 "Lựa chọn này khả dụng vì [spouse_2.GetShortUIName] có tư chất của một nhà cầm quyền"
  ep2_wedding.1300.practical:0 "Cuộc hôn nhân này mang tính thực tế cho cả hai chúng ta."
  ep2_wedding.1300.stop_whining:0 "Đừng than vãn nữa, ta đã khiến nàng trở thành một [spouse_2.GetTitleAsNameNoTooltip]."
  ep2_wedding.1300.understanding:0 "Ta hiểu cảm giác thấy bản thân không xứng đáng."
  ep2_wedding.1300.beauty:0 "Ta đã cưới người [spouse_2.GetWomanMan] đẹp nhất trên đời."
  ep2_wedding.1300.beauty.tt:0 "Lựa chọn này khả dụng vì [spouse_2.GetShortUIName] nổi danh vì vẻ đẹp của [spouse_2.GetHerHis]"
  ep2_wedding.1300.fertility:0 "Ta chọn nàng để ban cho ta nhiều người thừa kế khỏe mạnh."
  ep2_wedding.1300.fertility.tt:0 "Lựa chọn này khả dụng vì [spouse_2.GetShortUIName] có những phẩm chất phù hợp để trở thành một [spouse_2.GetMotherFather] mắn con"
  ep2_wedding.1301.t:0 "$ep2_wedding.1300.t$"
  ep2_wedding.1301.desc_intro:0 "Những suy nghĩ bồn chồn kéo ta ra khỏi giấc ngủ tân hôn."
  ep2_wedding.1301.desc_appearance:0 "Ta xấu xí. Vì sao một [spouse_1.GetTitleAsNameNoTooltip] lại muốn cưới một kẻ như ta?"
  ep2_wedding.1301.desc_dark_past:0 "Vì sao một [spouse_1.GetTitleAsNameNoTooltip] lại muốn cưới ta, sau những việc ta đã làm?"
  ep2_wedding.1301.desc_voice:0 "Vì sao một [spouse_1.GetTitleAsNameNoTooltip] lại muốn cưới ta, khi ta gần như chẳng thể mở miệng mà không bị người ta cười nhạo?"
  ep2_wedding.1301.desc_lowborn:0 "Vì sao một [spouse_1.GetTitleAsNameNoTooltip] lại muốn cưới một kẻ thấp hèn vô danh như ta?"
  ep2_wedding.1301.desc_midtro:0 "\n\nSự băn khoăn của ta đánh thức [spouse_1.GetTitledFirstName], và trước khi kịp nhận ra, ta đã hỏi [spouse_1.GetHerHim] vì sao [spouse_1.GetSheHe] lại chọn cưới ta."
  ep2_wedding.1301.desc_virtue:0 "[spouse_1.GetSheHe|U] nói rằng [spouse_1.GetSheHe] chọn ta vì đức hạnh của ta."
  ep2_wedding.1301.desc_rule_together:0 "[spouse_1.GetSheHe|U] nói rằng [spouse_1.GetSheHe] chọn ta để ta có thể giúp [spouse_1.GetHerHim] cai trị."
  ep2_wedding.1301.desc_practical:0 "[spouse_1.GetSheHe|U] nói rằng [spouse_1.GetSheHe] chọn ta vì sự thực tế đơn thuần."
  ep2_wedding.1301.desc_stop_whining:0 "[spouse_1.GetSheHe|U] bảo ta ngừng than vãn và hãy biết ơn cuộc hôn nhân này."
  ep2_wedding.1301.desc_understanding:0 "[spouse_1.GetSheHe|U] nói rằng [spouse_1.GetSheHe] cũng hiểu cảm giác thấy bản thân vô giá trị."
  ep2_wedding.1301.desc_beauty:0 "[spouse_1.GetSheHe|U] nói rằng [spouse_1.GetSheHe] chọn ta vì vẻ đẹp của ta."
  ep2_wedding.1301.desc_fertility:0 "[spouse_1.GetSheHe|U] nói rằng [spouse_1.GetSheHe] chọn ta để sinh cho [spouse_1.GetHerHim] những người thừa kế khỏe mạnh."
  ep2_wedding.1301.desc_outro:0 " Ta nên nghĩ gì về điều này đây?"
  ep2_wedding.1301.love:0 "Ta muốn xứng đáng với tình yêu của [spouse_1.GetHerHis]."
  ep2_wedding.1301.trust:0 "Ta muốn tin tưởng [spouse_1.GetHerHim]."
  ep2_wedding.1301.silly:0 "[spouse_1.GetSheHe|U] nói đúng, ta đang quá ngớ ngẩn."
  ep2_wedding.1301.misunderstood:0 "Ta đã biết [spouse_1.GetSheHe] sẽ không hiểu ta."
  ep2_wedding.1301.outcome.love:0 "[spouse_2.GetShortUIName] mỉm cười khi ngươi xoa dịu những bất an của [spouse_2.GetHerHis]."
  ep2_wedding.1301.outcome.trust:0 "[spouse_2.GetShortUIName] cảm thấy rằng [spouse_2.GetSheHe] có thể tin tưởng ngươi."
  ep2_wedding.1301.outcome.silly:0 "[spouse_2.GetShortUIName] chấp nhận rằng cuộc hôn nhân này là hợp lý."
  ep2_wedding.1301.outcome.misunderstood:0 "[spouse_2.GetShortUIName] cảm thấy như ngươi không hề lắng nghe [spouse_2.GetHerHim]."
  wedding_whyme_love_log_title:0 "Gần Gũi Hơn"
  wedding_whyme_love_log:0 "[CHARACTER.GetUIName|U] đã lắng nghe những bất an của [TARGET_CHARACTER.GetUINamePossessive], và khiến [TARGET_CHARACTER.GetHerHim] cảm thấy được yêu thương"
  wedding_whyme_trust_log_title:0 "$wedding_whyme_love_log_title$"
  wedding_whyme_trust_log:0 "[CHARACTER.GetUIName|U] đã lắng nghe những bất an của [TARGET_CHARACTER.GetUINamePossessive], và khiến [TARGET_CHARACTER.GetHerHim] cảm thấy được tôn trọng"
  wedding_whyme_silly_log_title:0 "Hôn Nhân Thực Dụng"
  wedding_whyme_silly_log:0 "[CHARACTER.GetUIName|U] đã lắng nghe những bất an của [TARGET_CHARACTER.GetUINamePossessive], và khiến [TARGET_CHARACTER.GetHerHim] cảm thấy mình thật ngớ ngẩn"
  wedding_whyme_misunderstood_log_title:0 "Hiểu Lầm"
  wedding_whyme_misunderstood_log:0 "[CHARACTER.GetUIName|U] đã lắng nghe những bất an của [TARGET_CHARACTER.GetUINamePossessive], nhưng lại khiến [TARGET_CHARACTER.GetHerHim] cảm thấy nhỏ bé"
 
 #Wedding Night Events
  ep2_wedding.3000.t:0 "Khởi Đầu Rụt Rè"
  ep2_wedding.3000.desc:0 "#EMP Thở dài#!. Thế là bắt đầu rồi. Chắc vậy. Giờ ta phải làm gì đây nhỉ? [my_spouse.GetSheHe] có thích... ôm ấp không? Hay chỉ là hôn nhẹ thôi. Ta quay mặt đi khi [my_spouse.GetSheHe] nhìn thẳng vào ta. Ít nhất ta cũng thấy [my_spouse.GetSheHe] đang bồn chồn vò đôi tay [my_spouse.GetHerHis] của mình.\n\n\"Ơ...\", ta cố cất lời, hắng giọng; ga giường vẫn phẳng phiu không một nếp nhăn, \"tối nay nàng trông thật xinh đẹp.\"\n\n\"C-Cảm ơn... ta cũng rất thích... mái tóc của ngài.\"\n\nChết tiệt, rõ ràng chuyện này không ổn chút nào."
  ep2_wedding.3000.a:0 "\"Nàng có muốn đi dạo một lát không?\""
  ep2_wedding.3000.a.success:1 "[my_spouse.GetFirstNameNoTooltip] thấy buổi dạo chơi thật đáng yêu"
  ep2_wedding.3000.a.failure:1 "[my_spouse.GetFirstNameNoTooltip] thấy buổi dạo chơi thật tẻ nhạt"
  ep2_wedding.3000.b:0 "\"Nàng có thích... đọc sách không?\""
  ep2_wedding.3000.b.success:1 "[my_spouse.GetFirstNameNoTooltip] và ngươi có một cuộc trò chuyện dễ chịu"
  ep2_wedding.3000.b.failure:1 "[my_spouse.GetFirstNameNoTooltip] thấy cuộc trò chuyện thật nhàm chán"
  ep2_wedding.3000.c:0 "\"#EMP Ngáp~#!, ta #EMP buồn ngủ#! quá.\""
  ep2_wedding.3000.tt:1 "[my_spouse.GetFirstNameNoTooltip] có thể thích hoặc không, tùy theo các đặc điểm của [my_spouse.GetHerHis]...\n"
  ep2_wedding_3000_log_a_title:0 "Một Cuộc Dạo Chơi Lãng Mạn"
  ep2_wedding_3000_log_a:0 "[CHARACTER.GetUIName|U] đã đưa [TARGET_CHARACTER.GetUIName] đi dạo lãng mạn trong đêm tân hôn"
  ep2_wedding_3000_log_b_title:0 "Một Cuộc Trò Chuyện Lãng Mạn"
  ep2_wedding_3000_log_b:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã có một cuộc trò chuyện duyên dáng trong đêm tân hôn"
  wnight_common_things_opinion:0 "Sở Thích Chung"
  wnight_common_things_opinion_desc:0 "Hai nhân vật này đã chia sẻ những sở thích chung trong đêm tân hôn"
  wnight_nothing_in_common_opinion:0 "Không Có Điểm Chung"
  wnight_nothing_in_common_opinion_desc:0 "Hai nhân vật này đã trải qua một đêm tân hôn tẻ nhạt, không có điểm chung nào"
 
  ep2_wedding.3010.t:0 "Lời Thú Nhận"
  ep2_wedding.3010.desc.intro:0 "[my_spouse.GetTitledFirstName] gần như bất động suốt cả đêm, đứng nhìn ra ngoài cửa sổ và thở dài đầy u sầu mỗi khi ta cố lại gần [my_spouse.GetHerHim]. [my_spouse.GetSheHe|U] không ngừng vuốt mái tóc [my_spouse.GetHerHis], tránh ánh mắt của ta.\n\nNhững ngọn nến sắp tàn, và [my_spouse.GetSheHe] bắt đầu lặng lẽ rơi lệ khi ta đứng dậy để châm lại chúng. \"[ROOT.Char.GetFirstNameNoTooltip], ta... ta có điều muốn thú nhận.\""
  ep2_wedding.3010.desc.murder:0 "\"Máu... ở khắp nơi...\""
  ep2_wedding.3010.desc.murder_attempt:0 "\"Ta từng cố... chuyện đó thật khủng khiếp.\""
  ep2_wedding.3010.desc.cannibal:0 "\"Ta không thể cưỡng lại được, hương vị của nó...\""
  ep2_wedding.3010.desc.deviant:0 "\"Ta biết điều này ghê tởm trong mắt ngài, trong mắt tất cả mọi người...\""
  ep2_wedding.3010.desc.witch:0 "\"Ta biết những loại thảo dược thích hợp, những lời thì thầm đúng đắn...\""
  ep2_wedding.3010.desc.non_believer:0 "\"Ta có thể... ta không thể tin được.\""
  ep2_wedding.3010.desc.fallback:0 "\"Ta biết điều đó không tốt, nhưng...\""
  ep2_wedding.3010.a:0 "\"Đừng lo, ái nhân của ta, ta sẽ bảo vệ nàng.\""
  ep2_wedding.3010.b:0 "\"Dừng lại. Ta không muốn nghe tiếp.\""
  ep2_wedding.3010.c:0 "\"Thật ra... ta cũng có điều muốn thú nhận.\""
  wedding_confession_log_title:0 "Chia Sẻ Bí Mật"
  wedding_confession_log:0 "[TARGET_CHARACTER.GetUIName|U] đã thú nhận bí mật của mình với [CHARACTER.GetUIName] trong đêm tân hôn"
  wedding_confession_joint_log_title:0 "$wedding_confession_log_title$"
  wedding_confession_joint_log:0 "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName] đã thú nhận bí mật của mình với nhau trong đêm tân hôn"
  wnight_clear_conscience_modifier:0 "Lương Tâm Thanh Thản"
  wnight_clear_conscience_modifier_desc:0 "Nhân vật này đã chọn một đêm tân hôn yên bình và không khám phá bí mật của phối ngẫu"
 
  ep2_wedding.3020.t:0 "Không Có Hứng Thú"
  ep2_wedding.3020.desc:0 "[my_spouse.GetTitledFirstName] has been smiling all day, celebrating the ceremony and showing how virtuous [my_spouse.GetSheHe] is in amenable conversations. The talk seems to never end and, after we've spent a decent time in our now shared bedchamber, I feel the urge to lean in and kiss [my_spouse.GetHerHim]...\n\nBut it's nothing like I'd expected. [my_spouse.GetHerHis|U] lips are dry, [my_spouse.GetHerHis] movements unenthusiastic. I pull away and look into [my_spouse.GetHerHis] eyes, inquiring.\n\n"I...," [my_spouse.GetSheHe] says, taking a deep breath, "have different... tastes." "
  ep2_wedding.3020.a:0 "Thôi... ta không muốn nghe."
  ep2_wedding.3020.b:0 "Ta hiểu."
  ep2_wedding.3020.c:0 "#EMP Hah!#! Nàng sẽ không tin đâu, nhưng mà..."
  wnight_confider_modifier:0 "Tri Kỷ"
  wnight_confider_modifier_desc:0 "Nhân vật này xem phối ngẫu của mình là một tri kỷ đáng tin cậy"
 
  ep2_wedding.3030.t:0 "Một Đêm Đáng Nhớ"
  ep2_wedding.3030.desc:0 "Ngọn lửa trong lò sưởi dần tàn lụi, và ta lặng lẽ nhìn vào những đốm sáng của nó. Ánh sáng, hơi ấm. [my_spouse.GetTitledFirstName] đang tìm kiếm thứ gì đó trong chiếc rương gỗ [my_spouse.GetHerHis], và ta rời mắt khỏi ngọn lửa để nhìn về phía [my_spouse.GetHerHim].\n\n\"[ROOT.Char.GetFirstNameNoTooltip],\" [my_spouse.GetSheHe] nói, trao cho ta một gói nhỏ bọc trong lụa, \"ta đã giữ nó từ khi nghe tin đính hôn của chúng ta, và giờ ta xin trao nó cho ngài như một tín vật tình yêu.\""
  ep2_wedding.3030.a:1 "\"Chính #EMP nàng#! mới là món quà lớn nhất của ta.\""
  ep2_wedding.3030.a.tt:0 "Điều này sẽ ban thưởng một lợi thế cho các [schemes|E] [GetScheme('courting').GetTypeName] nhằm vào [my_spouse.GetShortUIName]"
  ep2_wedding.3030.b:1 "\"Ta cũng có thứ dành cho nàng...\""
  ep2_wedding.3030.b.tt:0 "Điều này sẽ ban thưởng một lợi thế cho các [schemes|E] [GetScheme('seduce').GetTypeName] nhằm vào [my_spouse.GetShortUIName]"
  ep2_wedding.3030.c:0 "\"Thật ra... ta cũng có thứ dành cho nàng.\""
  ep2_wedding.3030.d:0 "\"#EMP Hah!#! Ta không dễ mắc lừa trò đó đâu!\""
  love_memento_desc:0 "[love_memento.GetDesc]\n\n[my_spouse.GetShortUIName|U] đã trao cổ vật này cho [ROOT.Char.GetFirstName] trong đêm tân hôn như một biểu tượng tình cảm."
  lock_of_hair:0 "Lọn Tóc"
  lock_of_hair.desc:0 "Một lọn tóc được buộc bằng dải lụa, mang đúng sắc màu của [my_spouse.GetShortUIName]."
  house_ribbon:0 "Dải Thêu Gia Tộc"
  house_ribbon.desc:0 "Một dải ruy băng được thêu tinh xảo, thể hiện châm ngôn của gia tộc [itsa_me_scope.GetTitledFirstNamePossessive]."
  initials_necklace:0 "Vòng Cổ Chữ Cái"
  initials_necklace.desc:0 "Một chữ cái bằng đồng được trang trí bằng pha lê thủy tinh đen, gắn trong các chấu vàng. Nó mang chữ cái đầu của [itsa_me_scope.GetTitledFirstName]."
  marriage_prayer_brooch:0 "Trâm Cài Lời Nguyện Hôn Nhân"
  marriage_prayer_brooch.desc:1 "Một chiếc trâm tròn, phẳng, được khắc lời nguyện cầu cho hôn nhân, tráng men."
  wooden_phallus:0 "Biểu Tượng Dương Vật Bằng Gỗ"
  wooden_phallus.desc:0 "Một biểu tượng sinh sản bằng gỗ, đại diện cho dương vật nam giới."
  ep2_wedding.3030.artifact_tt:0 "Ngươi sẽ trở thành chủ sở hữu của [love_memento.GetName]"

  ep2_wedding.3040.t:0 "Một Đêm Rực Lửa"
  ep2_wedding.3040.desc:0 "Ôi, làn da của [my_spouse.GetTitledFirstName] mềm mại biết bao, hương thơm từ mái tóc [my_spouse.GetHerHis] ngọt ngào đến nhường nào! Quả đúng là đêm tân hôn của ta diễn ra chính xác như ta mong đợi, và chúng ta nhanh chóng chìm đắm trong tội lỗi xác thịt.\n\nĐam mê của chúng ta mãnh liệt đến mức, không để ý tới những cây nến chỉ le lói soi sáng căn phòng, ta vô tình đá đổ một cây bằng chân mình: \"Đừng dừng lại, ái nhân!\"\n\nNhưng [ROOT.Char.GetFaith.HighGodName] lại có kế hoạch khác cho chúng ta, và chiếc đệm rơm nhanh chóng bùng cháy."
  ep2_wedding.3040.a:0 "Ta phải cứu [my_spouse.GetFirstNameNoTooltip]!"
  ep2_wedding.3040.a.success:1 "Ngươi cứu được [my_spouse.GetFirstNameNoTooltip] khỏi biển lửa!"
  ep2_wedding.3040.a.failure:1 "Ngươi bị thương khi cố cứu [my_spouse.GetFirstNameNoTooltip]"
  ep2_wedding.3040.b:0 "Ta phải cứu lấy #EMP chính mình#!!"
  ep2_wedding.3040.b.success:1 "[my_spouse.GetFirstNameNoTooltip] cứu được chính [my_spouse.GetHerselfHimself] khỏi biển lửa"
  ep2_wedding.3040.b.failure:1 "[my_spouse.GetFirstNameNoTooltip] bị thương vì ngọn lửa"
  ep2_wedding.3040.c:0 "Đây chính là lúc ta tỏa sáng!"
  ep2_wedding.3040.c.success:1 "Ngươi phô diễn sức mạnh của mình khi cứu [my_spouse.GetFirstNameNoTooltip]"
  ep2_wedding.3040.d:0 "Đây sẽ là cơ hội hoàn hảo để trừ khử [my_spouse.GetShortUINameNoTooltip]..."
  ep2_wedding.3040.d.flavor:0 "Vào lửa đi, hỡi #EMP [my_spouse.GetWifeHusband]# thân yêu!"
  ep2_wedding.3040.d.success:1 "[my_spouse.GetFirstNameNoTooltip] sống sót sau âm mưu ám sát của ngươi"
  ep2_wedding.3040.d.failure:1 "[my_spouse.GetFirstNameNoTooltip] đã chết"
 
  ep2_wedding.3050.t:0 "Thứ Treo Lơ Lửng Phía Trên"
  ep2_wedding.3050.desc:0 "Buổi tối đã kéo dài quá lâu và khách khứa bắt đầu rời đi khi đôi tân hôn lui về những chuyện... riêng tư hơn. Ta quan sát [intent_victim.GetTitledFirstName] ở phía bên kia căn phòng, cố gắng không rời đi cho tới khi #EMP [intent_victim.GetSheHe]#! làm điều đó.\n\nMột hiệp sĩ ngoại quốc rời đi để cầu nguyện, và giờ chỉ còn lại hai chúng ta.\n\n\"Thôi, ta cũng nên đi,\" [intent_victim.GetFirstNameNoTooltip] nói, đứng dậy khỏi chiếc ghế của [intent_victim.GetHerHis].\n\nMột chiếc đèn bạc treo lơ lửng trên đầu [intent_victim.GetHerHis] như một lưỡi lửa."
  ep2_wedding.3050.a:0 "Giờ chính là lúc!"
  ep2_wedding.3050.a.success:1 "Ngươi giết chết [intent_victim.GetFirstNameNoTooltip]"
  ep2_wedding.3050.a.failure:1 "[intent_victim.GetFirstNameNoTooltip] sống sót"
  ep2_wedding.3050.b:0 "Sợi dây treo chiếc đèn kia trông yếu ớt lạ thường tối nay..."
  ep2_wedding.3050.b.success:1 "Chiếc đèn giết chết [intent_victim.GetFirstNameNoTooltip]"
  ep2_wedding.3050.b.failure:1 "[intent_victim.GetFirstNameNoTooltip] trở nên nghi ngờ về sự việc"
  ep2_wedding.3050.c:0 "Nếu ta theo chân [intent_victim.GetHerHim], ta sẽ biết [intent_victim.GetSheHe] ngủ ở đâu..."
  ep2_wedding.3050.c.tt:0 "\"Ngươi nhận được một lợi thế lớn cho các [schemes|E] [GetScheme('murder').GetTypeName] nhắm vào nhân vật này\""

  ep2_wedding.3200.t:0 "Bổn Phận Nghi Lễ"
  ep2_wedding.3200.both:0 "Khi yến tiệc đi đến cao trào, [my_spouse.GetFirstName] và ta trao nhau những ánh nhìn bối rối, bộc lộ cảm xúc chung về nghi thức động phòng sắp tới...\n\nKhi đoàn người đưa chúng ta về phòng riêng, ta đầy hy vọng nói lớn giữa tiếng reo hò và trống dồn dập: \"[ROOT.Char.Custom('WifeHusband')|U], chúng ta không #EMP nhất thiết#! phải làm chuyện này, đúng không?\""
  ep2_wedding.3200.self:0 "Khi yến tiệc đi đến cao trào, ta càng lúc càng lo lắng trước nghi thức động phòng, và rõ ràng [my_spouse.GetFirstName] chẳng hề chia sẻ sự do dự của ta.\n\n[my_spouse.GetSheHe|U] quay sang ta khi đoàn người đưa chúng ta về phòng, cười lớn giữa tiếng reo hò và trống dồn dập: \"Trông ngươi như thấy ma ấy, [ROOT.Char.Custom('WifeHusband')]! Thư giãn nào!\""
  ep2_wedding.3200.other:0 "Khi yến tiệc đi đến cao trào, sự lo lắng ngày càng tăng của [shy_spouse.GetFirstNamePossessive] trước nghi thức động phòng là điều quá rõ ràng.\n\n[shy_spouse.Custom('WifeHusband')] mới cưới của ta quay sang cầu khẩn khi đoàn người tiến về phòng: \"Làm ơn, chúng ta có thể bỏ qua chuyện này không...?\" giữa tiếng reo hò và trống dồn dập."
  ep2_wedding.3200.closing:0 "\n\nCánh cửa đã ở rất gần, tiếng hò reo của bữa tiệc lên đến đỉnh điểm; nghi lễ sắp bắt đầu."
  ep2_wedding.3200.a:0 "Hãy để căn phòng chỉ còn hai ta!"
  ep2_wedding.3200.a.flavor:0 "Nhanh lên, chặn cửa lại!"
  ep2_wedding.3200.b:0 "Ta đoán đây là điều người ta mong đợi ở ta..."
  ep2_wedding.3200.c:0 "Xin nàng, chúng ta có thể khóa họ ở ngoài không?"
  ep2_wedding.3200.c.success:0 "[my_spouse.GetFirstNameNoTooltip] bị thuyết phục"
  ep2_wedding.3200.c.failure:0 "[my_spouse.GetFirstNameNoTooltip] từ chối"
  ep2_wedding.3200.d:0 "Nào, ái nhân, rồi sẽ ổn thôi."
  ep2_wedding.3200.d.success:0 "[my_spouse.GetFirstNameNoTooltip] nhượng bộ"
  ep2_wedding.3200.d.failure:0 "[my_spouse.GetFirstNameNoTooltip] buồn bực"
  ep2_wedding.3200.e:0 "Đừng ngốc thế, đó là truyền thống!"
  ep2_wedding_witnesses_tt:0 "[bedding_witness_1.GetTitledFirstName] và những người chứng kiến khác"
  wedding_barred_bedding_log_title:0 "Động Phòng Bị Khóa Cửa"
  wedding_barred_bedding_log:0 "[CHARACTER.GetShortUIName] đã khóa cửa, không cho người ngoài chứng kiến nghi thức động phòng của [CHARACTER.GetHerHis] và [TARGET_CHARACTER.GetShortUINamePossessive]"
  wedding_barred_doors_modifier:0 "Khóa Cửa Động Phòng"
  wedding_barred_doors_modifier_desc:0 "Nhân vật này tìm được sự an tâm khi khóa những người hiếu kỳ ngoài cửa trong đêm tân hôn."
  wedding_barred_bedding_doors_opinion:0 "Khóa Cửa Nghi Lễ Động Phòng"
  wedding_forced_bedding_ceremony_opinion:0 "Bị Ép Dự Nghi Lễ Động Phòng"
  wedding_caved_to_bedding_opinion:0 "Nhượng Bộ Nghi Lễ Động Phòng"

  ep2_wedding.3300.t:0 "Đưa Vào Giường"
  ep2_wedding.3300.opening:0 "[my_spouse.GetFirstName] và ta được đoàn cưới ồn ào đưa về phòng, tiếng hò reo và cười nói vang vọng báo hiệu nghi thức động phòng.\n\n"
  ep2_wedding.3300.blessing:0 "[officiant.GetCouncilTitleFirstName] ban phúc cho giường hôn nhân của chúng ta"
  ep2_wedding.3300.decorate:0 "[officiant.GetCouncilTitleFirstName] trang hoàng giường của chúng ta bằng hoa và vòng hoa"
  ep2_wedding.3300.flowers:0 "Đoàn người đặt chúng ta lên chiếc giường phủ đầy vòng hoa và cánh hoa"
  ep2_wedding.3300.wine:0 "trước khi đắp chăn, rót những chén rượu vang cay nồng và bảo chúng ta uống cạn."
  ep2_wedding.3300.anointing:0 "trước khi đắp chăn, xức dầu cho cả hai theo nghi thức của đức tin [officiant.GetFaith.GetAdjectiveNoTooltip]."
  ep2_wedding.3300.lover:0 "Chúng ta hạnh phúc nhìn nhau khi đoàn người bắt đầu rời đi, cuối cùng cũng chỉ còn hai ta!\n\n"
  ep2_wedding.3300.friend:0 "Chúng ta nắm tay nhau khi đoàn người lần lượt rời đi, không thể có một sự kết đôi nào tốt đẹp hơn.\n\n"
  ep2_wedding.3300.hatred:0 "[my_spouse.GetWifeHusband] mới của ta quay đi, nhăn mặt ghê tởm khi đoàn người rời đi.\n\n"
  ep2_wedding.3300.unfriendly:0 "[my_spouse.GetWifeHusband] mới của ta trông chẳng mấy hào hứng khi đoàn người rời đi.\n\n"
  ep2_wedding.3300.friendly:0 "Chúng ta quay sang nhìn nhau, cả hai đều căng thẳng mong đợi, khi đoàn người rời đi.\n\n"
  ep2_wedding.3300.polite:0 "Ta quay sang [my_spouse.GetFirstNameNoTooltip] khi đoàn người rời đi. \"Vậy thì... [my_spouse.GetWifeHusband]...!\"\n\n"
  ep2_wedding.3300.jester_self:0 "Trước khi cánh cửa khép lại, tên hề của ta, [jester.GetFirstName], làm những cử chỉ tục tĩu, gầm gừ và sủa như một con chó."
  ep2_wedding.3300.jester:0 "Trước khi cánh cửa khép lại, tên hề của [my_spouse.GetFirstNamePossessiveNoTooltip], [jester.GetFirstName], làm những cử chỉ tục tĩu, gầm gừ và sủa như một con chó."
  ep2_wedding.3300.other_friend_self:0 "Trước khi cánh cửa khép lại, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] của ta, [friend.GetTitledFirstName], mỉm cười nói: \"Chúc may mắn!\""
  ep2_wedding.3300.other_friend:0 "Trước khi cánh cửa khép lại, [my_spouse.GetFirstNamePossessiveNoTooltip] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('friend'))], [friend.GetTitledFirstName], mỉm cười nói: \"Chúc may mắn!\""
  ep2_wedding.3300.other_spouse_self:0 "Trước khi cánh cửa khép lại, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))] của ta, [other_spouse.GetFirstName], gửi về phía chúng ta một ánh nhìn cuối cùng đầy tổn thương."
  ep2_wedding.3300.other_spouse:0 "Trước khi cánh cửa khép lại, [my_spouse.GetFirstNamePossessiveNoTooltip] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))], [other_spouse.GetFirstName], gửi về phía chúng ta một ánh nhìn cuối cùng đầy tổn thương."
  ep2_wedding.3300.family:0 "Trước khi cánh cửa khép lại, [my_spouse.GetFirstNamePossessiveNoTooltip] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('family'))], [family.GetFirstName], hét lớn: \"#EMP 'Giỏi lắm, [my_spouse.Custom('GirlBoy')]!#!\""
  ep2_wedding.3300.family_self:1 "Trước khi cánh cửa khép lại, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family'))] của ta, [family.GetFirstName], hét lớn: \"#EMP 'Giỏi lắm, [ROOT.Char.Custom('GirlBoy')]!#!\""
  ep2_wedding.3300.fallback:0 "Cánh cửa sập lại sau người chứng kiến cuối cùng, bữa tiệc ồn ào vẫn tiếp diễn ngoài hành lang, dù hẳn các gia đình vẫn đang lắng nghe."
  ep2_wedding.3300.a:0 "Lại đây nào, ta đã chờ đợi chuyện này suốt cả đêm!"
  ep2_wedding.3300.a.success:0 "[my_spouse.GetWifeHusband] của ngươi cảm thấy được tâng bốc"
  ep2_wedding.3300.a.failure:0 "[my_spouse.GetFirstNameNoTooltip] cảm thấy ghê tởm"
  ep2_wedding.3300.b:0 "Ồ — #EMP *NGÁP*#! — tự nhiên ta buồn ngủ quá..."
  ep2_wedding.3300.b.success:0 "Ngươi xúc phạm [my_spouse.GetWifeHusband] của mình"
  ep2_wedding.3300.b.failure:0 "[my_spouse.GetFirstNameNoTooltip] cảm thấy nhẹ nhõm"
  ep2_wedding.3300.c:0 "Có lẽ ta cần thêm chút rượu cho chuyện này!"
  ep2_wedding.3300.c.success:0 "[my_spouse.GetWifeHusband] của ngươi đồng ý"
  ep2_wedding.3300.c.failure:0 "[my_spouse.GetFirstNameNoTooltip] bị xúc phạm"
  ep2_wedding.3300.d:0 "Vì dòng tộc của ta, ta sẽ làm điều này..."
  ep2_wedding.3300.d.success:0 "Cả hai đều có một khoảng thời gian dễ chịu, dù chẳng hẳn mong muốn"
  ep2_wedding.3300.d.failure:0 "Ngươi và [my_spouse.GetFirstNameNoTooltip] chỉ làm cho xong nghi thức"

  ep2_wedding.3400.t:0 "Cuộc Gặp Gỡ Giữa Các Gia Tộc"
  ep2_wedding.3400.opening:0 "Khi đôi tân hôn đã lui về nghỉ ngơi, những lò than được nhóm lên, vò rượu được rót đầy, và nhạc công được triệu tập để cuộc vui kéo dài suốt đêm.\n\n"
  ep2_wedding.3400.drink_self:0 "Vài giờ sau, ta thấy mình mơ màng nhìn xuống chiếc cốc trong tay, đối diện [other_family_relative.GetTitledFirstName], [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] của [other_family_spouse.Custom('GetBrideGroom')],"
  ep2_wedding.3400.hashish_self:0 "Vài giờ sau, ta thấy mình mơ màng nhìn qua làn khói, đối diện [other_family_relative.GetTitledFirstName], [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] của [other_family_spouse.Custom('GetBrideGroom')],"
  ep2_wedding.3400.fallback_self:0 "Vài giờ sau, ta chớp mắt nhìn [other_family_relative.GetTitledFirstName], [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] của [other_family_spouse.Custom('GetBrideGroom')],"
  ep2_wedding.3400.drink:0 "người vừa suýt nghẹn vì cười khi uống [other_family_relative.GetHerHis] [host.Custom('RegionalAlcoholicDrink')].\n\n"
  ep2_wedding.3400.hashish:0 "người vừa ho sặc sụa vì cười.\n\n"
  ep2_wedding.3400.fallback:0 "người ngáp dài trong sự mãn nguyện no nê.\n\n"
  ep2_wedding.3400.drink_family:0 "[other_family_relative.GetSheHe|U] lắp bắp nói, \"Ta thừa nhận! [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)] của ngài là một — #EMP *NẤC*#! — sự kết đôi tuyệt vời với [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)] của Ta! C- #EMP *NẤC*#! chúc họ hạnh phúc!\""
  ep2_wedding.3400.drink_house:0 "[other_family_relative.GetSheHe|U] lắp bắp nói, \"N- #EMP *NẤC*#! Ngài biết đấy, Ta từng không chắc về cái kiểu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] của ngài, n- #EMP *NẤC*#! nhưng ngài ổn đấy!\""
  ep2_wedding.3400.family:0 "Cuối cùng [other_family_relative.GetSheHe] nói, \"Ta thừa nhận! [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)] của ngài là một sự kết đôi tuyệt vời với [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)] của Ta! Chúc họ hạnh phúc!\""
  ep2_wedding.3400.house:0 "Cuối cùng [other_family_relative.GetSheHe] nói, \"Ngài biết đấy, Ta từng không chắc về cái kiểu [ROOT.Char.GetHouse.GetBaseNameNoTooltip] của ngài, nhưng ngài ổn đấy!\""
  ep2_wedding.3400.a:0 "Nhắc mới nhớ, ta cần ý kiến của ngài!"
  ep2_wedding.3400.tt:0 "Cuộc Trò Chuyện Sâu Sắc"
  ep2_wedding.3400.b:0 "Ồ! [ROOT.Char.Custom2('RelationToMeShort', my_family_suitor)] của ta hẳn sẽ rất thích ngài!"
  ep2_wedding.3400.b.tt:0 "Hóa Hợp Tức Thì"
  ep2_wedding.3400.b.success:0 "Họ hợp cạ với nhau"
  ep2_wedding.3400.b.failure:0 "Họ chỉ giữ phép lịch sự"
  ep2_wedding.3400.c.drink:0 "Thêm bia! Thêm nữa!"
  ep2_wedding.3400.c.hashish:0 "Thêm hashish! Thêm nữa!"
  ep2_wedding.3400.d:0 "Chúng ta phải giữ liên lạc, giờ đã là người một nhà rồi!"
  ep2_wedding.3400.e:0 "Nói ta nghe, có phải tất cả [other_family_relative.GetHouse.GetBaseNameNoTooltip] [other_family_relative.GetWomenMen] đều xinh đẹp như vậy không?"
  ep2_wedding.3400.e.success:0 "[other_family_relative.GetFirstNameNoTooltip] tan chảy"
  ep2_wedding.3400.e.failure:0 "[other_family_relative.GetFirstNameNoTooltip] giật mình lùi lại"

  ep2_wedding.3410.t:0 "Đối Thủ Mới"
  ep2_wedding.3410.opening:0 "Cánh cửa đóng sầm lại sau lưng đôi tân hôn, tiếng cười và tiếng rúc rích bị dập tắt dọc hành lang. Ta ngả người xuống lại trong đại sảnh yến tiệc, không sao ngừng nghĩ về [jealousy_focus.GetFirstName] và [jealousy_usurper.GetFirstName]...\n\n"
  ep2_wedding.3410.double:0 "Cả hai đều thân thiết với ta, nhưng ta lo sợ bình minh sẽ mang đến sự đổi thay trong hơi ấm tình cảm họ dành cho ta, giờ đây đang say sưa giữa men vui lễ hội."
  ep2_wedding.3410.lover:0 "[ROOT.Char.Custom2('RelationToMeShort', jealousy_focus)] của ta đang tận hưởng sự đụng chạm của người khác — ta biết [jealousy_focus.GetSheHe] có bổn phận, nhưng điều đó chẳng làm dịu đi những mũi gai đâm vào tim ta."
  ep2_wedding.3410.primary:0 "I know I am still [jealousy_focus.GetFirstNamePossessive] first and ranking [ROOT.Char.GetWifeHusband], but fear what [jealousy_focus.GetHerHis] taste of a new [jealousy_usurper.GetWomanMan] could bring."
  ep2_wedding.3410.secondary:0 "Thêm một [jealousy_usurper.GetWifeHusband] nữa trong bộ sưu tập của [jealousy_focus.GetFirstNamePossessive]; thêm một đối thủ tranh giành thời gian và tình cảm của [jealousy_focus.GetHerHis]."
  ep2_wedding.3410.double_opinion:0 "\n\n\"Thế còn ta thì sao? Nguyền rủa cái tam giác đau đớn này...\""
  ep2_wedding.3410.positive_opinion:0 "\n\n[jealousy_focus.GetSheHe|U] sẽ không quên ta đâu... phải không, [jealousy_focus.GetSheHe]...?"
  ep2_wedding.3410.negative_opinion:0 "\n\nTa quan tâm quái gì chứ?! Sao cái [jealousy_focus.Custom2('InsultNoun', ROOT.Char)] kia lại khiến ta bứt rứt đến vậy..."
  ep2_wedding.3410.indifferent_opinion:0 "\n\nTa phải lo cho vị thế của mình, trước khi cái [jealousy_usurper.Custom2('InsultNoun', ROOT.Char)] đó làm thay ta."
  ep2_wedding.3410.a:0 "Ta sẽ cho họ biết #EMP ta#! cảm thấy thế nào!"
  ep2_wedding.3410.a.flavor:0 "Mấy cánh cửa đó không ngăn được ta!"
  ep2_wedding.3410.b:0 "[jealousy_focus.GetFirstNameNoTooltip] là #EMP của ta!#!"
  ep2_wedding.3410.b.tt:0 "Âm mưu sẽ nhận được [GetModifier('wedding_consorts_envy_modifier').GetNameWithTooltip]"
  ep2_wedding.3410.c:0 "Trái tim ta tan nát rồi..."
  ep2_wedding.3410.d:0 "Ít được [jealousy_focus.GetFirstNameNoTooltip] chú ý hơn có lẽ cũng có lợi."
  every_usurper_close_family_tt:0 "Các thành viên gia đình thân cận của [jealousy_usurper.Custom('GetBrideGroom')]"
  revealed_lover_wedding_night_opinion:0 "Kẻ Ngoại Tình Bí Mật"
  wedding_consorts_envy_modifier:0 "Sự Ghen Tị Của Phối Ngẫu"
  ruined_wedding_night_opinion:0 "Đêm Tân Hôn Bị Phá Hỏng"
  wedding_old_news_modifier:0 "Chuyện Cũ"
  wedding_old_news_modifier_desc:0 "Nhân vật này chấp nhận mối quan hệ mới của Ngài đời mình, tìm kiếm sự nhẹ nhõm."

  ep2_wedding.3420.t:0 "Vào Đêm"
  ep2_wedding.3420.opening:0 "Đôi tân hôn đã rời đi, được hai gia đình đưa vào phòng riêng để hoàn tất hôn lễ. Phần còn lại của chúng ta quay lại đại sảnh yến tiệc để tiếp tục vui chơi và ăn mừng.\n\n"
  ep2_wedding.3420.eat:0 "Ta thấy đầu mình quay ngay về phía những bàn tiệc; hương thơm ngọt ngào của thức ăn còn sót lại gần như không thể cưỡng lại.\n\n"
  ep2_wedding.3420.drink:0 "Nhiều vị khách đã bắt đầu giai đoạn tiếp theo của cuộc vui, cổ vũ nhạc công và khởi động vòng khiêu vũ kế tiếp.\n\n"
  ep2_wedding.3420.lech:0 "Với ngần ấy lời thề thốt và nghi lễ động phòng, tâm trí ta lập tức trôi dạt đến những hành vi không thể nói ra mà cặp đôi hạnh phúc hẳn đang làm.\n\n"
  ep2_wedding.3420.steal:0 "Đây quả là một [host.Custom('FortifiedBuilding')] xa hoa nơi ta đã trải qua cả buổi tối, và ta không khỏi nghĩ xem những thứ nào sẽ không bị chủ nhân để ý nếu biến mất.\n\n"
  ep2_wedding.3420.flee:0 "Bị nhốt cả ngày, vây quanh bởi người lạ khi nghi lễ rồi yến tiệc kéo dài bất tận; giờ đây có được tự do khiến ta nhẹ nhõm vô cùng.\n\n"
  ep2_wedding.3420.charity:0 "Suốt cả ngày, ta cảm thấy day dứt trước sự xa hoa của lễ hội, trong khi những thường dân nghèo khổ và gia nhân ngay bên ngoài tường thành vẫn đang vật lộn.\n\n"
  ep2_wedding.3420.social:0 "Dù hôm nay đã được giới thiệu với rất nhiều gương mặt mới, ta vẫn háo hức gặp gỡ thêm khách mời trước khi cơ hội xã giao này khép lại.\n\n"
  ep2_wedding.3420.posture:0 "Quan sát những vị khách đủ kiểu, trong y phục lộng lẫy và vẻ vênh váo, ta cảm thấy muốn đi một vòng để mọi người đều biết đến sự hiện diện của mình.\n\n"
  ep2_wedding.3420.blab:0 "Giữa đám đông đông đúc như vậy, ta đã cố gắng mang gánh nặng hiểu biết về những việc làm sai trái của [blab_guest.GetTitledFirstNamePossessive] mà không lỡ miệng, nhưng ta không biết mình còn chịu đựng được bao lâu!\n\n"
  ep2_wedding.3420.blab_self:0 "Giữa đám đông đông đúc như vậy, ta đã cố gắng mang gánh nặng những bí mật của chính mình mà không lỡ miệng, nhưng ta không biết mình còn chịu đựng được bao lâu!\n\n"
  ep2_wedding.3420.scheme:0 "Ta phóng mắt nhìn những vị khách đi lại, say sưa và no nê sau một ngày ăn mừng, và tự hỏi những chiếc lưỡi vặn vẹo kia hôm nay đã buột ra những mẩu chuyện gì.\n\n"
  ep2_wedding.3420.help:0 "Nhìn ra đám đông, ta đắm mình trong hơi ấm của một dịp vui vẻ, rút ra sức mạnh từ những gương mặt tươi cười và sự hòa hợp — nhưng kẻ khom lưng kia là ai?\n\n"
  ep2_wedding.3420.pray:0 "Khi các nghi lễ đã hoàn tất và lời thề đã được thốt ra, ta tràn đầy lo lắng và hy vọng cho cặp đôi hạnh phúc; cho mọi thử thách sắp tới của đời sống hôn nhân và làm cha mẹ.\n\n"
  ep2_wedding.3420.closing:0 "Phần còn lại của buổi tối là của ta, để tiêu pha theo ý muốn..."
  ep2_wedding.3420.a:0 "Hy vọng vẫn còn chút [ROOT.Char.Custom('RegionalEdibleMeat')] nào!"
  ep2_wedding.3420.b:0 "Cuối cùng, ta có thể #EMP thực sự#! thả mình!"
  ep2_wedding.3420.c:0 "Nào, người hầu thon thả kia đâu rồi?"
  ep2_wedding.3420.d:0 "Không có lúc nào tốt hơn để lục lọi các gian phòng..."
  ep2_wedding.3420.e:0 "Cuối cùng ta cũng thoát khỏi cái nơi chết tiệt này!"
  ep2_wedding.3420.f:0 "Đêm nay, ta phải để mắt đến những kẻ nghèo khổ ở [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]."
  ep2_wedding.3420.g:0 "Ta đã định nói chuyện với [social_guest.GetFirstNameNoTooltip] từ lâu."
  ep2_wedding.3420.h:0 "Sự hiện diện của ta hôm nay không được phép bị lu mờ."
  ep2_wedding.3420.i:0 "Bí mật này đang giết chết ta, phải có ai đó biết chứ!"
  ep2_wedding.3420.j:0 "Xem thử đám gia nhân đã nghe lỏm được gì tối nay..."
  ep2_wedding.3420.j.tt:0 "Ngươi sẽ biết được [secret|E] của ai đó"
  ep2_wedding.3420.k.drink:0 "Có vẻ như [help_guest.GetFirstNameNoTooltip] đã uống quá chén..."
  ep2_wedding.3420.k.health:0 "Tội nghiệp [help_guest.GetFirstNameNoTooltip], có vẻ cần một bàn tay giúp đỡ..."
  ep2_wedding.3420.k.fallback:0 "Tội nghiệp [help_guest.GetFirstNameNoTooltip], có vẻ đang gà gật ngủ..."
  ep2_wedding.3420.k.flavor:0 "#EMP Dậy#! nào! Lối này..."
  ep2_wedding.3420.l:0 "[host.GetFaith.HouseOfWorship|l] giờ hẳn sẽ yên tĩnh."
  ep2_wedding.3420.l.flavor:0 "[ROOT.Char.GetFaith.HighGodName], xin chúc phúc cho cuộc hôn nhân này và ban cho họ hạnh phúc."
  secret_discovered_toast:0 "Phát Hiện Bí Mật"

  ep2_wedding.3500.t:0 "Nghi Ngờ Về Huyết Thống"
  ep2_wedding.3500.intro:0 "Mệt mỏi sau một ngày dài chờ đợi và giao thiệp xã hội, ta cùng [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_1)], [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_2)] ngồi quây quần bên một chiếc bàn để bàn luận về cuộc hôn phối."
  ep2_wedding.3500.intro_plural:0 "Mệt mỏi sau một ngày dài chờ đợi và giao thiệp xã hội, ta cùng các [ROOT.Char.Custom2('GetFamilyRelationPlural', my_family_relative_1)] ngồi quây quần bên một chiếc bàn để bàn luận về cuộc hôn phối."
  ep2_wedding.3500.intro_connector:0 "\n\n[my_family_relative_1.GetFirstName] khẽ nói, \"Ngươi biết đấy,\""
  ep2_wedding.3500.relation_shared:0 "ta thật sự lo lắng cho [my_family_relative_1.Custom2('RelationToMeShort', my_family_spouse)] của chúng ta — thực sự là vậy."
  ep2_wedding.3500.relation:0 "ta phải nói rằng ta vẫn còn nhiều băn khoăn, ta lo cho [my_family_relative_2.Custom2('RelationToMeShort', my_family_spouse)] của mình."
  ep2_wedding.3500.young:0 "[other_family_spouse.GetFirstName] đơn giản là #EMP quá#! trẻ đối với [my_family_spouse.GetHerHim]. Chuyện này rồi sẽ chỉ kết thúc trong nước mắt.\""
  ep2_wedding.3500.old:0 "[other_family_spouse.GetFirstName] thì quá già, không đời nào [other_family_spouse.GetSheHe] có thể khiến [my_family_spouse.GetHerHim] hạnh phúc. Đó là sự thật."
  ep2_wedding.3500.bold:0 "[other_family_spouse.GetFirstName] is headstrong, while [my_family_spouse.GetSheHe] is meek; [other_family_spouse.GetSheHe] will have [my_family_spouse.GetHerHim] under [other_family_spouse.GetHerHis] thumb.""
  ep2_wedding.3500.shy:0 "[other_family_spouse.GetFirstName] thì rụt rè như cừu non, một [other_family_spouse.GetWomanMan] như vậy có thể mang lại điều gì cho một [my_family_spouse.GetWomanMan] như [my_family_spouse.GetHerHim] chứ?\""
  ep2_wedding.3500.dishonorable:0 "[other_family_spouse.GetWomanMan] này thiếu danh dự; ta đã quan sát [other_family_spouse.GetHerHim] suốt cả ngày; [other_family_spouse.GetSheHe] chỉ mang đến khổ đau cho [my_family_spouse.GetFirstName].\""
  ep2_wedding.3500.dislike:0 "[other_family_spouse.Custom2('InsultAdjective', SCOPE.sC('my_family_relative_1'))] [other_family_spouse.GetWomanMan] này giờ là một vết nhơ trên danh tiếng gia tộc ta; cái [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] đó sẽ chẳng đem lại điều tốt đẹp gì cho [my_family_spouse.GetFirstName]!\""
  ep2_wedding.3500.health:0 "[other_family_spouse.GetSheHe|U] là một gánh nặng ốm yếu, không thể nâng đỡ [my_family_spouse.GetFirstName] trong những thử thách và mối quan tâm của [my_family_spouse.GetHerHis]. Thật không khôn ngoan.\""
  ep2_wedding.3500.realms:0 "Sợi dây liên kết này mở cổng cho những âm mưu của [other_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.GetAdjectiveNoTooltip] phá hoại [my_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.GetNameNoTooltip] và Gia tộc [other_family_spouse.GetHouse.GetBaseNameNoTooltip] từ bên trong.\""
  ep2_wedding.3500.lowborn:0 "Một [other_family_spouse.GetWomanMan] thường dân như [other_family_spouse.GetHerHim] là dưới phẩm giá của gia tộc này; [other_family_spouse.GetSheHe] khiến [my_family_spouse.GetFirstName] mang tiếng xấu.\""
  ep2_wedding.3500.beauty:0 "Have you seen the sight of [other_family_spouse.GetHerHim]? I shudder to think how [my_family_spouse.GetFirstName] will do [my_family_spouse.GetHerHis] duty, or the countenances of their offspring...""
  ep2_wedding.3500.renown:0 "This provincial [other_family_spouse.GetHouse.GetBaseNameNoTooltip] [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] is beneath the dignity of so great a house as [my_family_spouse.GetHouse.GetBaseNameNoTooltip]; [other_family_spouse.GetSheHe] sullies [my_family_spouse.GetFirstName] by mere association...""
  ep2_wedding.3500.criminal:0 "[other_family_spouse.GetSheHe|U] là một kẻ quỷ dữ; cả buổi tối nay ai cũng bàn tán về điều đó! Sao chúng ta lại có thể tự trói mình vào cái [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] này chứ?! Ta chỉ mong tội nghiệp [my_family_spouse.GetFirstName] có thể chịu đựng nổi...\""
  ep2_wedding.3500.fornicator:0 "[other_family_spouse.GetWomanMan] này là kẻ trụy lạc khét tiếng; bị làm hoen ố bởi vô số tình nhân; sao ta có thể cho phép điều này làm tổn hại danh tiếng của [my_family_spouse.GetFirstNamePossessive]?! Hãy nghĩ đến những lời vu khống, tin đồn, trò cười!\""
  ep2_wedding.3500.fallback:0 "Có điều gì đó ở [other_family_spouse.GetHerHim]. [other_family_spouse.GetSheHe|U] có ánh mắt thật khó coi... hẳn ngươi cũng nhận ra chứ? Ta mong [my_family_spouse.GetFirstName] cũng vậy...\""
  ep2_wedding.3500.faith:0 "Làm sao có thể tin tưởng một [my_family_relative_1.Custom2('GetUnbelieverTerm', other_family_spouse)] như [other_family_spouse.GetHerHim]; [other_family_spouse.GetSheHe] sẽ bẻ lái [my_family_spouse.GetFirstName] rời xa [my_family_relative_1.GetFaith.HighGodName].\""
  ep2_wedding.3500.agree:0 "\n\n\"Ta nghĩ ngươi nói đúng, [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" [my_family_relative_2.GetFirstName] thở dài. \"Đây có vẻ là một sự kết đôi tai hại.\""
  ep2_wedding.3500.alliance:0 "\n\n\"Chắc ngươi cũng thấy đó, [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" [my_family_relative_2.GetFirstName] khiển trách, \"Liên minh với Gia tộc [other_family_spouse.GetHouse.GetBaseNameNoTooltip] phải được đặt lên trên hạnh phúc của [my_family_spouse.GetHerHis].\""
  ep2_wedding.3500.compromise:0 "\n\n\"Gác lại những nghi ngờ của ngươi đi, [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" [my_family_relative_2.GetFirstName] bác bỏ. \"Chính trị đòi hỏi sự thỏa hiệp.\""
  ep2_wedding.3500.time:0 "\n\n\"Thôi nào, [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" [my_family_relative_2.GetFirstName] thở dài. \"Hãy cho họ thời gian! Ít nhất một tháng bên nhau trước khi ngươi đưa ra phán xét như vậy.\""
  ep2_wedding.3500.a:0 "Ta e rằng ngươi nói không sai đâu, [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_1)]..."
  ep2_wedding.3500.b:0 "Tin ta đi, đây là một sự kết đôi tốt."
  ep2_wedding.3500.d:0 "Thì sao chứ? Cứ để tình yêu cho các thi sĩ."
  ep2_wedding.3500.e:0 "Giờ tất cả đã nằm trong tay [ROOT.Char.GetFaith.HighGodNamePossessive]."
 
 #Ceremony Events
  ep2_wedding.4000.t:0 "Đến Lượt Ai?"
  ep2_wedding.4000.desc.intro:0 "Khi đôi uyên ương trao lời thề, ta liếc nhìn [matchmaked_scope.GetTitledFirstName], vui vẻ vỗ tay. Ta đã cố gắng tìm cho [matchmaked_scope.GetHerHim] một hôn ước, và khoảnh khắc này có vẻ là cơ hội hoàn hảo để nhắc [matchmaked_scope.GetHerHim] về niềm vui của hôn nhân.\n\n\"Họ dễ thương thật, phải không?\" ta ngây thơ hỏi, vừa quan sát đám đông để tìm một ứng viên phù hợp."
  ep2_wedding.4000.desc.good_match:0 "Ta đã từng thấy [matchmaked_scope.GetFirstNameNoTooltip] nói chuyện với [objective_scope.GetTitledFirstName], và họ trông thật xứng đôi..."
  ep2_wedding.4000.desc.no_match:0 "\n\nTa biết [matchmaked_scope.GetSheHe] từng bắt chuyện với [objective_scope.GetTitledFirstName] trước đây, dù [matchmaked_scope.GetSheHe] không mấy hào hứng."
  ep2_wedding.4000.a:0 "\"Sao ngươi không noi gương họ với [objective_scope.GetShortUINameNoTooltip]?\""
  ep2_wedding.4000.a.success:1 "[matchmaked_scope.GetFirstNameNoTooltip] làm theo lời khuyên của Ngài"
  ep2_wedding.4000.a.failure:1 "[matchmaked_scope.GetFirstNameNoTooltip] từ chối lắng nghe"
  ep2_wedding.4000.b:0 "\"[objective_scope.GetShortUINameNoTooltip] trông có vẻ rất cô đơn...\""
  ep2_wedding.4000.b.success:1 "[matchmaked_scope.GetFirstNameNoTooltip] nói chuyện với [objective_scope.GetFirstNameNoTooltip]"
  ep2_wedding.4000.c:0 "Ta không nghĩ họ là một cặp hợp."
  ep2_wedding_4000_log_success_title:0 "Một Mối Lương Duyên Được Khơi Gợi"
  ep2_wedding_4000_log_success:1 "[CHARACTER.GetFirstNameNoTooltip] đã tìm cho [TARGET_CHARACTER.GetFirstNameNoTooltip] một mối xứng đôi"
 
  ep2_wedding.2010.t:0 "Vị Khách Huyền Thoại"
  ep2_wedding.2010.desc.intro:0 "Khi yến tiệc tiếp diễn, ta bỗng thấy mọi thứ hơi... nhạt nhẽo. Không lụa là hay thảm quý lộng lẫy, vàng ròng tinh xảo cũng chẳng hiện diện — những viên ngọc lớn nhất cũng vậy. Khi nhìn ra ngoài cửa sổ, bầu trời đêm lại gợi cho ta cảm hứng.\n\nNgoài kia tồn tại loài thú trắng. Chúng tự do rong ruổi trong rừng của ta và ẩn mình giữa những tán cây. Săn được một con — đó sẽ là kỳ tích.\n\nHay là ta có thể... đơn giản là sơn trắng một con [ROOT.Char.Custom('GetAnimalType')] của mình?"
  ep2_wedding.2010.desc_spouse:0 "\n\nCòn cách nào tốt hơn để tôn vinh chính đám cưới của ta?"
  ep2_wedding.2010.a:0 "Phải nhanh lên, bảo gia nhân bắt tay vào ngay."
  ep2_wedding.2010.a.tt:0 "Việc này sẽ giúp ngươi #EMP tăng danh tiếng#!, nhưng một vị khách tinh ý có thể sinh nghi..."
  ep2_wedding.2010.b:0 "Rủi ro quá lớn."
  ep2_wedding.2010.impressed_list:0 "Mọi vị khách tham dự có đặc điểm hòa đồng, ưa tiệc tùng, nghiện rượu, dũng cảm, thợ săn hoặc hào hoa"
  wbanquet_white_animal_opinion:0 "Vị Khách Huyền Thoại"
  wbanquet_white_animal_opinion_desc:0 "Nhân vật này bị ấn tượng bởi một con thú trắng xuất hiện trong yến tiệc cưới"
 
  ep2_wedding.2011.t:0 "$ep2_wedding.2010.t$: Dấy Lên Nghi Ngờ"
  ep2_wedding.2011.desc:0 "As the [ROOT.Char.Custom('GetAnimalType')] enters the hall, its pale fur shines brightly under the moonlight, an almost phosphorescent fever, an unnatural glow. The deception is almost perfect - a marvel. Guests stand in awe and quickly approach the animal, not daring to touch it, for its nature is sacred.\n\nHowever, I spot [doubting_guest.GetTitledFirstName] among the crowd, rolling [doubting_guest.GetHerHis] eyes: "Can't you tell it's just paint? [ROOT.Char.GetTitledFirstNameNoTooltip] must take us all for fools.""
  ep2_wedding.2011.a:0 "À, không cần giữ ảo tưởng này nữa."
  ep2_wedding.2011.b:0 "\"Sao ngươi dám nghi ngờ ta trong ngày yến tiệc của ta?\""
  ep2_wedding.2011.b.success:1 "[doubting_guest.GetFirstNameNoTooltip] miễn cưỡng tin Ngài"
  ep2_wedding.2011.b.failure:1 "[doubting_guest.GetFirstNameNoTooltip] không tin một lời nào"
 
  ep2_wedding.2020.t:0 "Không Ổn Chút Nào"
  ep2_wedding.2020.desc:0 "Những đĩa cao lương mỹ vị được chuyền quanh các bàn, với [host.Custom('GetExpensiveMeal')] và [host.Custom('GetExpensiveDessert')] lan tỏa mùi hương ngào ngạt khắp căn phòng.\n\n[host.GetTitledFirstName] đã chuẩn bị quá mức, và cái giếng trong sân tràn đầy [host.Custom('GetExpensiveDrink')], được múc bằng một chiếc xô bạc gắn xích bạc.\n\nKhi ta tò mò tiến lại gần, ta thấy [drunk_guest.GetTitledFirstName] loạng choạng đầy nguy hiểm sát bên, tay vẫn cầm chặt chiếc cốc."
  ep2_wedding.2020.a:0 "\"Ngươi sẽ bị thương đấy... lại đây nào, Ngài hiền.\""
  ep2_wedding.2020.a.success:1 "Ngài thuyết phục được [drunk_guest.GetFirstNameNoTooltip] rời đi"
  ep2_wedding.2020.a.failure:1 "[drunk_guest.GetFirstNameNoTooltip] rơi xuống giếng"
  ep2_wedding.2020.b:0 "Ta sẽ đứng yên lặng ở đây và quan sát."
  ep2_wedding.2020.b.success:1 "[drunk_guest.GetFirstNameNoTooltip] không bị ngã"
  ep2_wedding.2020.c:0 "\"Đi đi nào!\""
  ep2_wedding.2020.c.success:1 "Ngài đẩy [drunk_guest.GetFirstNameNoTooltip] xuống giếng thành công"
  ep2_wedding.2020.c.failure:1 "[drunk_guest.GetFirstNameNoTooltip] chống cự cú đẩy của Ngài"
  ep2_wedding.2020.c.death:1 "[drunk_guest.GetFirstNameNoTooltip] chết trong cú ngã"
 
  ep2_wedding.wedding_intent.success.tt:0 "Ý định [THIS.Char.GetInvolvedActivityIntent.GetName] của Ngài đã thành công"
 
  ep2_wedding.2000.t:0 " Bạn của bạn"
  ep2_wedding.2000.desc.intro:1 "Sau khi quan sát [diplo_target.GetTitledFirstName] từ xa, ta nhanh chóng nhận ra rằng không thể đơn giản bước tới [diplo_target.GetHerHim] rồi bắt chuyện về thời tiết, hay những luận thuyết y học mới nhất, hay chiến tranh, và hy vọng điều đó sẽ trở thành một liên minh.\n\nChẳng mấy chốc ta trông thấy [target_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] ở phía bên kia đại sảnh — người được biết đến là [SCOPE.sC('diplo_target').Custom2('RelationToMeShort', SCOPE.sC('target_friend'))] của [diplo_target.GetFirstNamePossessiveNoTooltip] — đang vui vẻ nốc cạn từng cốc [ROOT.Char.Custom('RegionalAlcoholicDrink')].\n\n\"Nói ta nghe xem, sở thích của [diplo_target.GetFirstNamePossessiveNoTooltip] nằm ở đâu?\" ta hỏi, đầy chú ý.\n\n"
  ep2_wedding.2000.desc.lustful:0 "\"Ha! Ở dưới thắt lưng của ai đó chứ đâu!\""
  ep2_wedding.2000.desc.nerd:0 "\"Chỉ cần... chỉ cần nói về sách vở và việc ngươi ghét ra ngoài đến mức nào.\""
  ep2_wedding.2000.desc.valiant:0 "\"À, một trong những [diplo_target.GetWomenMen] dũng mãnh nhất, tinh thông chiến tranh và binh pháp.\""
  ep2_wedding.2000.desc.social:0 "\"Ngay tại đây thôi! Một khoảnh khắc ăn mừng, ẩm thực hảo hạng, rượu ngon và những bằng hữu tinh túy nhất.\""
  ep2_wedding.2000.desc.fishy:0 "\"[diplo_target.GetSheHe|U] phát đạt nơi triều đình! Với sự cẩn trọng lớn lao, [diplo_target.GetSheHe] đã nghiên cứu nghệ thuật của bóng tối.\""
  ep2_wedding.2000.a:0 "Tuyệt vời! Hãy tận dụng hiểu biết này ngay!"
  ep2_wedding.2000.a.tt:1 "Ngài tiếp cận [diplo_target.GetFirstNameNoTooltip]"
  ep2_wedding.2000.b:0 "Sao ta biết có thể tin [target_friend.GetHerHim]?"
  ep2_wedding.2000.b.success.tt:1 "Việc này sẽ trao thưởng cho [GetScheme('befriend').GetTypeName] [schemes|E] nhắm vào [diplo_target.GetFirstNameNoTooltip]"
  ep2_wedding.2000.b.success:1 "[target_friend.GetFirstNameNoTooltip] dường như đang nói thật"
  ep2_wedding.2000.b.failure:1 "[target_friend.GetFirstNameNoTooltip] bị xúc phạm vì sự ngờ vực của Ngài"
 
  ep2_wedding.2001.t:0 "$ep2_wedding.2000.t$"
  ep2_wedding.2001.desc:0 "With my newly acquired knowledge I artfully approach [diplo_target.GetTitledFirstName], who's enjoying the feast and some others' company at a different table, where a rich cloth is laid. "May we have a small word, [diplo_target.GetTitleAsNameNoTooltip]?" I ask, "I wouldn't want to interrupt your parliament."\n\n[diplo_target.GetTitledFirstNameNoTooltip] raises [diplo_target.GetHerHis] eyebrows, a hint of curiosity in [diplo_target.GetHerHis] eyes, "Well, of course. What matters bring you to me, noble [ROOT.Char.GetFirstNameNoTooltip]?""
  ep2_wedding.2001.a:0 "\"Ngài có muốn lẻn ra ngoài tìm vài vị khách... thú vị không?\""
  ep2_wedding.2001.b:0 "\"Nihil est miserum nisi cum putes, như triết gia từng nói.\""
  ep2_wedding.2001.b.flavor:0 "#EMP Không có gì khốn khổ, trừ khi ngươi cho là vậy#!."
  ep2_wedding.2001.b.dull:0 "\"À thì... ngài có nghe nói về... một hiệp ước nào đó không?\""
  ep2_wedding.2001.c:1 "\"Ngài có nghe về chiến dịch của vị nam tước không? Một cuộc vây hãm thật ngoạn mục!\""
  ep2_wedding.2001.d:0 "\"Xin hãy cùng ta ăn uống, và cầu cho yến tiệc này kéo dài nhiều ngày!\""
  ep2_wedding.2001.e:0 "\"#EMP Suỵt#!, ngài có nghe những lời đồn về một âm mưu nơi triều đình không?\""
  ep2_wedding.2000.after.alliance:0 "[diplo_target.GetShortUINameNoTooltip] coi Ngài là một đồng minh hùng mạnh"
  ep2_wedding.2000.after.alliance.tt:1 "Ngài ký kết liên minh với [diplo_target.GetFirstNameNoTooltip]"
  ep2_wedding.2000.after.subjugate:0 "[diplo_target.GetShortUINameNoTooltip] wants you to be [diplo_target.GgetHerHis] liege"
  ep2_wedding.2000.after.subjugate.tt:1 "[diplo_target.GetFirstNameNoTooltip] thề trung thành với Ngài"
  ep2_wedding.2000.after.friends:0 "[diplo_target.GetShortUINameNoTooltip] xem Ngài như tri kỷ"
  ep2_wedding.2000.after.insult:0 "[diplo_target.GetShortUINameNoTooltip] bị xúc phạm khi Ngài nghĩ rằng [diplo_target.GetSheHe] sẽ hứng thú với chuyện đó"
  ep2_wedding.2000.after.insult.short:1 "[diplo_target.GetFirstNameNoTooltip] bị xúc phạm"
 
  ep2_wedding.1330.t:0 "My Lover, My [spouse.GetWifeHusband]"
  ep2_wedding.1330.desc:0 "Bao nhiêu vị khách dự hôn lễ đã nghi ngờ rằng [spouse.GetTitledFirstName] vốn đã là người tình của ta? Sau cánh cửa khép kín, chúng ta chẳng cần phải giả vờ nữa. Cái chạm thân quen của [spouse.GetHerHis|U], sự hiểu biết của ta về cơ thể [spouse.GetHerHis]... giờ đây tất cả đều thuộc về ta.\n\nKhi ngắm nhìn người tình — và cũng là [spouse.GetWifeHusband] của mình — một ý nghĩ duy nhất lướt qua tâm trí ta..."
  ep2_wedding.1330.a:0 "Ta yêu [spouse.GetWomanMan] này hơn cả ngàn lời nói."
  ep2_wedding.1330.b:0 "Ta sẽ không bao giờ cần ai khác ngoài [spouse.GetHerHim]."
  ep2_wedding.1330.c:0 "Ta sẽ sửa đổi bản thân và trở nên chung thủy!"
  ep2_wedding.1330.c.rakish.success:0 "Ngài thực sự nỗ lực để thay đổi"
  ep2_wedding.1330.c.rakish.failure:0 "Lời hứa của Ngài chỉ là trống rỗng"
  ep2_wedding.1330.c.breakup:1 "[ROOT.Char.GetFirstNameNoTooltip] rời bỏ ta vì tình yêu dành cho [ROOT.Char.GetHerHis] [spouse.GetWifeHusband]"
  ep2_wedding.1330.d:0 "Không biết [spouse.GetSheHe] có hứng thú với... chuyện đó không nhỉ?"
  ep2_wedding.1330.d.yuck:1 "[spouse.GetFirstNameNoTooltip|U] ghê tởm sự trụy lạc của ta"
  ep2_wedding.1330.d.yuck.tt:0 "$ep2_wedding.1330.d.yuck$"
  ep2_wedding.1330.d.yum:1 "[spouse.GetFirstNameNoTooltip|U] bị cuốn hút bởi sở thích táo bạo của ta"
  ep2_wedding.1330.d.yum.tt:0 "$ep2_wedding.1330.d.yum$"
  ep2_wedding.1330.d.yeahmetoo:1 "[spouse.GetFirstNameNoTooltip|U] hé lộ những sở thích táo bạo của riêng [spouse.GetHerHis]"
  ep2_wedding.1330.d.yeahmetoo.tt:0 "$ep2_wedding.1330.d.yeahmetoo$"
  ep2_wedding.1330.d.confession.tt:1 "[spouse.GetFirstNameNoTooltip|U] sẽ nói cho Ngài biết liệu [spouse.GetSheHe] có chung khuynh hướng hay không"
  ep2_wedding.1330.e:1 "Sao ta có thể làm điều này với [soulmate.GetFirstNameNoTooltip]?"
  ep2_wedding.1330.f:0 "Liệu ta có thực sự là tình yêu duy nhất của [spouse.GetHerHis]?"
  ep2_wedding.1330.f.mindatease:0 "Những lời trấn an của [spouse.GetShortUINamePossessive|U] khiến lòng ta an ổn"
  ep2_wedding.1330.f.mindatease.tt:1 "[spouse.GetFirstNameNoTooltip|U] khiến Ngài an tâm"
  ep2_wedding.1330.f.lingeringdoubts:1 "[spouse.GetFirstNameNoTooltip|U] khẳng định chỉ yêu mình ta, nhưng nghi ngờ vẫn giày vò"
  ep2_wedding.1330.f.lingeringdoubts.tt:0 "Sự hoài nghi vẫn tiếp tục giày vò Ngài"
  ep2_wedding.1330.f.confession:1 "[spouse.GetFirstNameNoTooltip|U] thú nhận những mối tình khác của [spouse.GetHerHis]"
  ep2_wedding.1330.f.confession.desc:0 "Sự thật được phơi bày"
  ep2_wedding.1330.f.confession.tt:1 "[spouse.GetFirstNameNoTooltip|U] tiết lộ liệu [spouse.GetSheHe] có người tình khác hay không"
  ep2_wedding.1330.g:0 "Cuối cùng, chúng ta không còn phải che giấu tình yêu nữa!"

  ep2_wedding.1340.t:0 "Chia Buồn Nhân Ngày Thành Hôn"
  ep2_wedding.1340.desc.intro:0 "\"Ta thương cho ngươi, [cynic.Custom2('RelationToMe', SCOPE.sC('nervous_spouse'))|U]...\" [cynic.GetTitledFirstName] nói với ta về cuộc sống hôn nhân là thế nào: "
  ep2_wedding.1340.i_would_know:0 "\"Ta biết rõ mà,\" [cynic.GetSheHe] càu nhàu."
  ep2_wedding.1340.like_me_and:0 "\"Giống như ta và [disliked_spouse.GetFirstName],\" [cynic.GetSheHe] càu nhàu."
  ep2_wedding.1340.cheating:0 "chồng phản bội vợ, vợ phản bội chồng, một chuỗi dài dối trá và nhục nhã."
  ep2_wedding.1340.desc.dislikes_spouse:0 "đầy cãi vã, ngờ vực và xung đột, chấm dứt mọi bình yên. $ep2_wedding.1340.like_me_and$"
  ep2_wedding.1340.desc.dislikes_spouse_lustful:0 "một chiếc giường lạnh lẽo và một [intended.GetWifeHusband] đa nghi, xiềng xích mọi niềm vui của ngươi. $ep2_wedding.1340.like_me_and$"
  ep2_wedding.1340.desc.divorced:2 "một cuộc hành trình chậm chạp và đau đớn, tiến tới khoảnh khắc khi ngươi nhận ra ai trong hai người sẽ là kẻ vứt bỏ người kia trước. \"Giống như ta và [divorced_spouse.GetFirstName],\" [cynic.GetSheHe] càu nhàu."
  ep2_wedding.1340.desc.cheated_on:0 "$ep2_wedding.1340.cheating$ $ep2_wedding.1340.i_would_know$"
  ep2_wedding.1340.desc.cheated_on_alt:2 "$ep2_wedding.1340.cheating$ \"Giống như ta và [adulterous_spouse.GetFirstName],\" [cynic.GetSheHe] càu nhàu."
  ep2_wedding.1340.desc.outro:0 "\n\nLiệu cuộc hôn nhân của ta với [intended.GetTitledFirstName] sẽ như thế sao?"
  ep2_wedding.1340.a:0 "[intended.GetFirstNameNoTooltip|U] là người hoàn hảo dành cho ta."
  ep2_wedding.1340.a.tt:0 "Chúng ta có thực sự hợp nhau không?"
  ep2_wedding.1340.a.success:0 "Ngài tin rằng [intended.GetFirstNameNoTooltip] sẽ hợp với mình"
  ep2_wedding.1340.a.failure:0 "Ngài lo sợ rằng [intended.GetFirstNameNoTooltip] sẽ không hợp với mình"
