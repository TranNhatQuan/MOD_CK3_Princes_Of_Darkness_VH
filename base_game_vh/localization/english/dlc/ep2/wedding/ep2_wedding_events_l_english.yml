 # GATHERING
 # Artistic Differences
  ep2_wedding.1000.t:0 "Bất Đồng Thẩm Mỹ"
  ep2_wedding.1000.desc:0 "Như thể việc tổ chức một hôn lễ xứng tầm địa vị gia tộc ta chưa đủ căng thẳng, giờ ta còn phải đối phó với họ hàng của [spouse_2.GetFirstNamePossessive].\n\n[spouse_2.GetHerHis|U] [spouse_2.Custom2('RelationToMe', SCOPE.sC('1000_relative'))], [1000_relative.GetTitledFirstName], đã đến từ sáng sớm hôm nay và từ đó cứ bám theo ta không rời, phàn nàn chuyện này chuyện nọ không ngừng. Khi cơn đau đầu như muốn xé toạc sau hốc mắt ta ngày một dữ dội, [1000_relative.GetSheHe] vẫn tiếp tục lải nhải không chút kiêng dè."
  ep2_wedding.1000.desc_servants:0 "\n\n\"Ngươi có #EMP chắc chắn#! là có đủ người hầu cho việc này không? Ngươi đâu có định bắt #EMP ta#! tự tay khiêng [ROOT.Char.Custom('GetExpensiveMeal')] chứ?! Truyền thuyết kể rằng trong đám cưới của cụ cố ta, người hầu đông đến mức mũ của họ che kín cả mặt trời!\""
  ep2_wedding.1000.desc_dec:0 "\n\n\"Mấy bông hoa đó là màu gì thế kia?! Chúng sẽ xung đột #EMP khủng khiếp#! với nước da của [spouse_2.GetFirstNamePossessiveNoTooltip]! Và tại sao ngươi lại chọn một kiểu bày bàn ăn #EMP vô duyên#! như vậy?! Đừng để ta bắt đầu nói về đống vải vóc #EMP lòe loẹt#! này!\""
  ep2_wedding.1000.desc_dec_low:0 "\n\n\"Ta đã #EMP biết ngay#! ngươi không xứng với [spouse_2.GetFirstNameNoTooltip] yêu quý của ta! Nhìn nơi này mà xem — hoa thì èo uột, bàn thì trơ trọi, không một vệt vàng nào lọt vào mắt! Trái tim tội nghiệp của ta #EMP rỉ máu#! khi nghĩ đến cuộc đời khốn khổ đang chờ đứa trẻ đáng thương ấy!\""
  ep2_wedding.1000.desc_entertainment:0 "\n\n\"Kia là diễn viên câm à? Bọn hầu kia đang mang mấy đống lửa nhỏ đi đâu thế? Và tại sao cái thùng gỗ kia lại #EMP gầm gừ#!?! Chuyện này sẽ thành thảm họa mất thôi!\""
  ep2_wedding.1000.desc_fallback:0 "\n\n\"Mấy bông hoa này sẽ làm [spouse_2.GetFirstNameNoTooltip] hắt hơi cho mà xem! Len thì thô ráp quá! Còn bảng màu thì sao? Ta biết chắc [spouse_2.GetFirstNameNoTooltip] sẽ không thích đâu!\""
  ep2_wedding.1000.a:0 "Ta chắc là chúng ta có thể tìm được tiếng nói chung..."
