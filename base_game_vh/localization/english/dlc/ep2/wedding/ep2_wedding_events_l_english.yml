  ep2_wedding.1050.b.2.tt:0 "[1050_victim.GetFirstNameNoTooltip|U] vẫn đang bốc cháy!"
  wedding_dance_saved_fail_log_title:0 "Tai Nạn Rực Lửa"
  wedding_dance_saved_fail_log:0 "[CHARACTER.GetUIName|U] bị thương trong một tai nạn với đuốc"
  ep2_wedding.1050.c:0 "Cháy đi! CHÁY ĐI! #EMP CHÁÁÁY NỮA ĐI!!#!"
  wedding_dance_disaster_log_title:0 "$wedding_dance_rescue_fail_log_title$"
  wedding_dance_disaster_log:0 "[CHARACTER.GetUIName|U] và nhiều người khác bị thương trong một tai nạn với đuốc"
