l_english:

 ##### WEDDING #####

 ### ACTIVITY
  activity_wedding:0 "Đám Cưới Hoành Tráng"
  activity_wedding_selection_tooltip:1 "Tổ chức một [GetActivityType('activity_wedding').GetName], lễ kỷ niệm tráng lệ về sự kết hợp của một cặp đôi\n\nPhần thưởng dự kiến:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] Mất [stress|E]"
  activity_wedding_desc:0 "Một lễ kỷ niệm lộng lẫy về sự kết hợp của hai người.\n\nTuy nhiên, đây không chỉ là một buổi lễ cưới; đó còn là màn trình diễn quyền lực trước công chúng, và là một sự kiện xã hội nơi quý tộc tụ họp để thực hành nghệ thuật ngoại giao, quyến rũ, và thậm chí là mưu đồ — hoặc chỉ đơn giản là nhâm nhi rượu cùng bạn bè!"
  activity_wedding_host_desc: "$BULLET_WITH_TAB$The selected [spouses|E] get [married|E]\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$Guest [opinion|E]\n$BULLET_WITH_TAB$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] [vassals|E] [opinion|E]\n$BULLET_WITH_TAB$May gain [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$May lose [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$May gain [GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$May gain [GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]"
  wedding_need_to_promise:0 "Ngươi cần phải [grand_wedding_promised|E] một [GetActivityType( 'activity_wedding' ).GetName] mới có thể tổ chức!"
  wedding_need_to_be_valid:0 "Cả hai nhân vật đính hôn cần là người trưởng thành và sẵn sàng kết hôn"
  activity_wedding_conclusion_characters_header:0 "Cặp đôi Tân Hôn"
  spouse_1:0 "Phối Ngẫu"
  spouse_2:0 "$spouse_1$"
  spouse_1_for_host:0 "$spouse_1$"
  spouse_2_for_host:0 "$spouse_2$"
  spouse_1_desc:0 "Một [GetActivityType( 'activity_wedding' ).GetName] cử hành sự kết hợp của hai [spouses|E]. Đây là phần cốt yếu của hoạt động, vốn không thể tổ chức nếu chưa có [GetActivityType( 'activity_wedding' ).GetNameNoTooltip] được [grand_wedding_promised|E] cho một cặp đôi vào thời điểm [betrothal|E].\n\nHai phối ngẫu sẽ luôn chấp nhận lời mời đến hôn lễ của mình, và nhận được những phần thưởng riêng khi hoạt động kết thúc.\n"
  spouse_2_desc:0 "$spouse_1_desc$"
  spouse_1_desc_for_host:0 "$spouse_1_desc$"
  spouse_2_desc_for_host:0 "$spouse_2_desc$"
  activity_window_character_spouse_1:1 "[Character.Custom('GetBrideGroom')|U]\n[Character.GetShortUINameNoTooltip|U]"
  activity_window_character_spouse_2:1 "[Character.Custom('GetBrideGroom')|U]\n[Character.GetShortUINameNoTooltip|U]"
  activity_wedding_conclusion_desc:0 "[GetActivityType( 'activity_wedding' ).GetName] đã kết thúc"
  activity_wedding_destination_selection:0 ""
  activity_wedding_province_desc:0 ""
  province_desc_wedding_capital:0 "\n#P + Đây là Thủ Đô của ngài#!\n#weak Điều này sẽ đem lại [gold_i] [gold|E]#!"
  province_desc_wedding_gardens:0 "\n#P + $building_royal_garden_01$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i] [stress|E]#!"
  province_desc_wedding_gardens_2:0 "\n#P ++ $building_royal_garden_02$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i] [stress|E]#!"
  province_desc_wedding_gardens_3:0 "\n#P +++ $building_royal_garden_03$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i] [stress|E]#!"
  province_desc_wedding_palace:0 "\n#P + $building_leisure_palace_01$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i][stress|E]#!"
  province_desc_wedding_palace_2:0 "\n#P ++ $building_leisure_palace_02$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i][stress|E]#!"
  province_desc_wedding_palace_3:0 "\n#P +++ $building_leisure_palace_03$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i][stress|E]#!"
  province_desc_wedding_pleasure_dome:0 "\n#P +++ $building_leisure_palace_03$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i][stress|E]#!"
  province_desc_wedding_izumo_taisha: "\n#P +++ $building_izumo_taisha_01$#!\n#weak Điều này sẽ tăng [dynasty_prestige_i] [dynasty_prestige|E] và giảm [stress_loss_i][stress|E]#!"
  province_desc_wedding_holy_site:0 "\n#P + Đây là Thánh địa của đức tin ngươi#!\n#weak Điều này sẽ đem lại [piety_i] [piety|E]#!"
  every_cruel_vassal:0 "Mỗi chư hầu tàn nhẫn"
  wedding_every_other_vassal:0 "Mỗi chư hầu khác"
  activity_wedding_guest_desc:0 "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Host và cặp đôi [opinion|E]\n$BULLET_WITH_TAB$Có thể mất [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$Có thể nhận [GetModifier( 'wedding_of_the_century_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$Có thể nhận [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait_level_track_xp|E]"
  activity_wedding_guest_help_text:0 "\nKhách dự đám cưới tham gia lễ hội, sẵn sàng choáng ngợp trước sự xa hoa của sự kiện và ấn tượng bởi cặp đôi cùng chủ tiệc!\nĐám cưới là sự kiện xã hội và chính trị, đầy cơ hội để giao lưu và xây dựng các mối quan hệ quan trọng."

 ### PHASES
  wedding_phase_ceremony:0 "Nghi lễ Hôn phối"
  wedding_phase_ceremony_desc:0 "Tất cả các nghi thức và sự chuẩn bị dẫn tới khoảnh khắc trao lời thề, chính thức hóa cuộc hôn nhân."
  wedding_phase_banquet:0 "Yến tiệc Hôn lễ"
  wedding_phase_banquet_desc:0 "Một bữa tiệc để chúc mừng mối liên kết mới: đồ ăn, thức uống và các tiết mục giải trí được dọn ra không tiếc tay."
  wedding_phase_wnight:0 "Đêm Tân hôn"
  wedding_phase_wnight_desc:0 "Trong khi các phối ngẫu hoàn tất hôn phối, những vị khách còn lại tận hưởng bữa tiệc dần đi đến hồi kết."

 ### OPTIONS
  wedding_type_normal:0 "Đám cưới Long trọng"
  wedding_type_normal_desc:1 "\n#weak Một đám cưới được tổ chức như một lễ kỷ niệm huy hoàng cho sự kết hợp không chỉ của hai phối ngẫu, mà còn của hai gia tộc.#!\n\n@warning_icon! #X Một [GetActivityType('activity_wedding').GetName] đã được hứa hẹn phải được tổ chức trước khi lời hứa hết hạn, nếu không Ngài sẽ phải chịu các hình phạt#!"
  wedding_type_bloody:0 "Đám cưới Đẫm máu"
  wedding_type_bloody_desc:1 "You will murder the other family.\n#weak You're not organizing a wedding, you're planning a funeral.#!\n\n@warning_icon! #X You won't be able to host a Bloody [GetActivityType('activity_wedding').GetName] for 15 years#!\n@warning_icon! #X Targeting your [liege|E] or [head_of_faith|E] will have bigger penalties#!\n\n@alert_icon! #alert_trial Characters with [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] and [GetTrait('calm').GetName( GetNullCharacter )] traits will gain [stress|E]#!"
  wedding_option_entertainment:0 "Giải trí"
  wedding_entertainment_bad:1 "Giải trí tại gia"
  wedding_entertainment_bad_desc:1 "$EFFECT_LIST_BULLET$ Giảm lượng [prestige|E] nhận được\n\n#weak Những nghệ sĩ vẫn biểu diễn hằng ngày tại triều đình như hề cung đình và nhào lộn sẽ tham dự đám cưới.#!"
  wedding_entertainment_normal:0 "Nhào lộn và Nhạc công"
  wedding_entertainment_normal_desc:1 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Lượng [prestige|E] trung bình\n\n#weak Những tiết mục tiêu chuẩn tại bất kỳ triều đình đáng kính nào.#!"
  wedding_entertainment_good:0 "Thi sĩ Du ca và Dị thú Ngoại lai"
  wedding_entertainment_good_desc:1 "$EFFECT_LIST_BULLET$ [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Tăng lượng [prestige|E] nhận được\n\n#weak Chỉ những nghệ sĩ xuất sắc nhất và những loài thú hiếm có nhất!#!"
  wedding_option_food:0 "Ẩm thực và Thức uống"
  wedding_food_bad:1 "Bữa tiệc Đạm bạc"
  wedding_food_bad_desc:1 "$EFFECT_LIST_BULLET$ Giảm [opinion|E] với tất cả các nhân vật tham dự\n\n#weak Một bữa tiệc đáp ứng kỳ vọng, nhưng chẳng để lại ấn tượng gì.#!"
  wedding_food_normal:0 "Bữa tiệc Hào phóng"
  wedding_food_normal_desc:0 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Lượng [opinion|E] trung bình với tất cả các nhân vật tham dự\n\n#weak Một yến tiệc phù hợp, làm hài lòng mọi vị khách.#!"
  wedding_food_good:0 "Đại yến Khổng lồ"
  wedding_food_good_desc:1 "$EFFECT_LIST_BULLET$ Thưởng thêm cho việc giảm [stress|E]\n$EFFECT_LIST_BULLET$ Tăng các thưởng [health|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Tăng [opinion|E] với tất cả các nhân vật tham dự\n\n#weak Những chiếc bàn sẽ oằn mình dưới sức nặng của núi thức ăn!#!"
  wedding_option_decoration:1 "Địa điểm Hôn lễ"
  wedding_decoration_bad:0 "Hoa dại"
  wedding_decoration_bad_desc:1 "$EFFECT_LIST_BULLET$ Nhận [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Giảm [opinion|E] với các [vassals|E] có lập trường [GetVassalStance( 'courtly' ).GetName]\n\n#weak Trang trí xinh xắn bằng hoa vừa hái, cùng một đội ngũ đầu bếp và gia nhân khiêm tốn.#!"
  wedding_decoration_normal:0 "Vòng hoa và Đuốc lửa"
  wedding_decoration_normal_desc:0 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Lượng [opinion|E] trung bình với các [vassals|E] có lập trường [GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$ Nhận [GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]\n\n#weak Trang trí truyền thống, và đủ gia nhân để không một chiếc ly nào bị bỏ trống.#!"
  wedding_decoration_good:0 "Bạc và Vàng"
  wedding_decoration_good_desc:2 "$EFFECT_LIST_BULLET$ Tăng [opinion|E] với các [vassals|E] có lập trường [GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$ [dynasty_prestige|E] và [prestige|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Nhận [GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n\n#weak Một màn phô diễn giàu sang không che giấu, với đủ gia nhân để mỗi vị khách có riêng người rót rượu#!"
  wedding_good_option_desc:1 "$EFFECT_LIST_BULLET$ Các [vassals|E] có lập trường [GetVassalStance( 'glory_hound' ).GetName] và [GetVassalStance( 'courtly' ).GetName] sẽ tăng thêm [opinion|E] với Ngài"
  wedding_normal_option_desc:1 "$EFFECT_LIST_BULLET$ Các [vassals|E] có lập trường [GetVassalStance( 'parochial' ).GetName] và [GetVassalStance( 'zealot' ).GetName] sẽ tăng thêm [opinion|E] với Ngài"

 ### INTENTS
  diplomatic_intent:0 "Ngoại giao"
  diplomatic_intent_desc:0 "Thiết lập một liên minh với nhân vật được chọn, hoặc thậm chí khiến họ tâm phục khẩu phục"
  matchmaking_intent:0 "Se duyên"
  matchmaking_intent_desc:0 "Tìm một đối tượng phù hợp cho nhân vật được chọn và sắp xếp một cuộc đính hôn"
  banquet_mischief_intent:0 "Quậy phá"
  banquet_mischief_intent_desc:1 "Gây hỗn loạn và tăng lượng giảm [stress|E], kèm theo những hậu quả #EMP không mấy may mắn#!."

 ### COST
  WEDDING_BASE_COST:0 "Chi phí Cơ bản của Đám cưới Long trọng"
