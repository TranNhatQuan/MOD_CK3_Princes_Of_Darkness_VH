 #Modifiers
  wedding_nagging_spouse_modifier:0 "Phối Ngẫu Hay Cằn Nhằn"
  wedding_nagging_spouse_modifier_desc:0 "Phối ngẫu của nhân vật này luôn thúc ép họ phải dốc toàn lực — kể cả bằng biện pháp mạnh"
  wedding_accused_impotency_modifier:0 "Bị Buộc Tội Bất Lực"
  wedding_accused_impotency_modifier_desc:0 "Phối ngẫu của nhân vật này đã công khai tố cáo họ là bất lực"
  ep2_beastmaster_modifier:0 "Bậc Thầy Thuần Thú"
  ep2_beastmaster_modifier_desc:0 "Nhân vật này có năng khiếu điều khiển và xử lý dã thú"
  wedding_purified_modifier:0 "Được Thanh Tẩy Nghi Lễ"
  wedding_purified_modifier_desc:0 "Nhân vật này đã tham gia một nghi lễ tắm gột rửa"
  gwedding_gracious_host_modifier:0 "Chủ Tiệc Nhã Nhặn"
  gwedding_gracious_host_modifier_desc:1 "Nhân vật này đã tổ chức thành công một [GetActivityType( 'activity_wedding' ).GetName]."
  gwedding_magnificent_host_modifier:0 "Chủ Tiệc Lộng Lẫy"
  gwedding_magnificent_host_modifier_desc:1 "Nhân vật này đã tổ chức một [GetActivityType( 'activity_wedding' ).GetName] vô cùng tráng lệ. $ep2_grand_wedding_host_incentives_effect.tt$"
  gwedding_grand_wedding_modifier:0 "Đã Cử Hành Đại Hôn Lễ"
  gwedding_grand_wedding_modifier_desc:1 "Nhân vật này đã thành hôn trong một [GetActivityType( 'activity_wedding' ).GetName]"
  gwedding_grandiose_wedding_modifier:0 "Đã Cử Hành Hôn Lễ Xa Hoa"
  gwedding_grandiose_wedding_modifier_desc:1 "Nhân vật này đã thành hôn trong một [GetActivityType( 'activity_wedding' ).GetName] xa hoa"
  gwedding_magnificent_wedding_modifier:0 "Đã Cử Hành Hôn Lễ Tráng Lệ"
  gwedding_magnificent_wedding_modifier_desc:1 "Nhân vật này đã thành hôn trong một [GetActivityType( 'activity_wedding' ).GetName] tráng lệ"
  wedding_of_the_century_modifier:0 "Khách Dự Hôn Lễ Thế Kỷ"
  wedding_of_the_century_modifier_desc:1 "Nhân vật này đã tham dự một [GetActivityType( 'activity_wedding' ).GetName] vô cùng tráng lệ"
  wedding_fertility_delay_modifier:0 "Chờ Đêm Tân Hôn"
  wedding_fertility_delay_modifier_desc:0 "Cuộc hôn nhân chưa thể hoàn tất cho tới Đêm Tân Hôn"
  wedding_wants_to_be_faithful_modifier:0 "Muốn Chung Thủy"
  wedding_wants_to_be_faithful_modifier_desc:0 "Nhân vật này chỉ để mắt tới phối ngẫu của mình"
  wedding_lingering_doubts_modifier:0 "Nghi Ngờ Âm Ỉ"
  wedding_lingering_doubts_modifier_desc:0 "Phối ngẫu của nhân vật này đã phủ nhận việc có tình nhân khác, nhưng vẫn còn đó những hoài nghi..."
  wedding_mind_at_ease_modifier:0 "Tâm Trí An Yên"
  wedding_mind_at_ease_modifier_desc:0 "Nhân vật này tin chắc rằng phối ngẫu yêu mình và chỉ mình họ mà thôi"
  wedding_insecure_marriage_modifier:0 "Hôn Nhân Bất An"
  wedding_insecure_marriage_modifier_desc:0 "Nhân vật này cảm thấy vô cùng bất an trong cuộc hôn nhân của mình."
  wedding_practical_marriage_modifier:0 "Hôn Nhân Thuận Tiện"
  wedding_practical_marriage_modifier_desc:0 "Nhân vật này đang ở trong một cuộc hôn nhân mang tính thực dụng. Họ #EMP gần như#! chỉ là kết hôn trên danh nghĩa."
  wedding_soothed_insecurity_modifier:0 "Xoa Dịu Bất An"
  wedding_soothed_insecurity_modifier_desc:0 "Phối ngẫu của nhân vật này đã giúp họ lấy lại niềm tin vào cuộc hôn nhân."
  wedding_lavish_food_modifier:0 "Ẩm Thực Xa Hoa"
  wedding_lavish_food_modifier_desc:0 "Nhân vật này đã tổ chức một hôn lễ với tiệc ăn uống vô cùng thịnh soạn"
  wedding_lavish_food_royal_modifier:0 "$wedding_lavish_food_modifier$"
  wedding_lavish_food_royal_modifier_desc:0 "$wedding_lavish_food_modifier_desc$"
  ep2_wedding_shared_values_modifier:0 "Phối Ngẫu Chung Giá Trị"
  ep2_wedding_shared_values_modifier_desc:0 "Biết rằng phối ngẫu tán thành phương cách của mình, nhân vật này có thể phát huy tốt nhất bản thân."
  ep2_wedding_authoritarian_modifier:0 "Tiếng Nói Độc Đoán"
  ep2_wedding_autoritharian_modifier_desc:0 "Nhân vật này không ngại đặt kẻ khác vào đúng vị trí của họ."
  ep2_wedding_family_focus_modifier:0 "Trọng Tâm Gia Đình"
  ep2_wedding_family_focus_modifier_desc:0 "Nhân vật này tập trung xây dựng mối quan hệ tốt đẹp hơn trong gia đình ruột thịt."
  wedding_clean_slate_modifier:0 "Trang Mới"
  wedding_clean_slate_modifier_desc:0 "Sau khi tiết lộ một bí mật của mình, nhân vật này trông đáng tin cậy hơn hẳn."
  wedding_web_of_secrets_modifier:0 "Mạng Lưới Bí Mật"
  wedding_web_of_secrets_modifier_desc:0 "Sau khi mạnh tay ngăn chặn việc lộ bí mật, nhân vật này toát ra một bầu không khí đầy bí ẩn."
  wedding_trust_compromised_modifier:0 "Niềm Tin Bị Sứt Mẻ"
  wedding_trust_compromised_modifier_desc:0 "Sau khi phát hiện phối ngẫu mới che giấu bí mật, nhân vật này trở nên dè chừng và cảnh giác."
  gwedding_hosted_murder_wedding_modifier:1 "Chủ Tiệc Đáng Ngờ"
  gwedding_hosted_murder_wedding_modifier_desc:1 "Nhân vật này đã không bảo vệ được phối ngẫu trong hôn lễ do chính mình tổ chức."
  wedding_peasants_connections_county_modifier:0 "Gắn Kết Với Dân Thường"
  wedding_peasants_connections_county_modifier_desc:0 "Lãnh chúa của quận này được dân chúng yêu mến vì cho phép thường dân tham gia Đại Hôn Lễ."
  wedding_enforced_security_modifier:0 "An Ninh Được Siết Chặt"
  wedding_enforced_security_modifier_desc:0 "Nhân vật này đã áp đặt an ninh thành công tại một Đại Hôn Lễ bị kẻ xâm nhập tràn ngập."
  wedding_peasants_overrun_modifier:0 "Bị Dân Đen Lấn Át"
  wedding_peasants_overrun_modifier_desc:0 "Nhân vật này đã thất bại trong việc duy trì an ninh tại một Đại Hôn Lễ bị kẻ xâm nhập tràn ngập."
  wedding_parade_mayhem_modifier:0 "Hỗn Loạn Diễu Hành"
  wedding_parade_mayhem_modifier_desc:0 "Nhân vật này đã vui thú khi tạo ra hỗn loạn trong đoàn diễu hành hôn lễ."
  wedding_political_mentality_modifier:0 "Tư Duy Chính Trị"
  wedding_political_mentality_modifier_desc:0 "Tâm trí nhân vật này tập trung vào chính trường hơn là cuộc hôn nhân."
  wedding_confident_groom:0 "Chú Rể Tự Tin"
  wedding_confident_groom_desc:1 "Nhân vật này sẵn sàng đối mặt với mọi điều trong ngày cưới; tiếc thay sự tự tin ấy chỉ kéo dài đến hết buổi lễ."
  wedding_confident_bride:0 "Cô Dâu Tự Tin"
  wedding_confident_bride_desc:0 "$wedding_confident_groom_desc$"
  wedding_jitters:0 "Bồn Chồn Trước Hôn Lễ"
  wedding_jitters_desc:1 "Nhân vật này sợ hãi từng bước tiến về lễ đường. May mắn thay, sự bồn chồn sẽ tan biến khi ngày cưới kết thúc."
  ruler_married_here_county_modifier:0 "Đại Hôn Lễ Của Lãnh Chúa"
  ruler_married_here_county_modifier_desc:0 "Lãnh chúa của quận này đã kết hôn tại đây với một lễ cưới long trọng khiến dân chúng vô cùng phấn khích."
  wedding_thinking_outside_box_modifier:0 "Tư Duy Phá Cách"
  wedding_thinking_outside_box_modifier_desc:0 "Nhân vật này có tinh thần độc lập và không bị ràng buộc bởi truyền thống cũ."
  wedding_severe_host_modifier:0 "Chủ Tiệc Nghiêm Khắc"
  wedding_severe_host_modifier_desc:0 "Nhân vật này có rất ít kiên nhẫn với những hành vi ngu ngốc và hỗn loạn trong các buổi giao tế."
  wedding_social_drinker_modifier:0 "Người Uống Giao Tế"
  wedding_social_drinker_modifier_desc:0 "Nhân vật này thích uống rượu nhiệt tình cùng Bạn Bè trong các sự kiện xã hội."

