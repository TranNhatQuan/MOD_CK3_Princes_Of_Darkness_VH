l_english:
 ##################################################
 # MISC
  ep2_wedding_ewan_0041_attraction_modifier:0 "Tâm điểm bàn tán"
  ep2_wedding_ewan_0041_attraction_modifier_desc:0 "Những phẩm chất nổi bật nhất của nhân vật này đang được mọi người truyền tai nhau."
  ep2_wedding_ewan_0051_snooty_modifier:0 "Kẻ kiêu căng"
  ep2_wedding_ewan_0051_snooty_modifier_desc:0 "Nhân vật này nổi tiếng là không bao giờ để mắt tới đám hạ lưu, bọn ăn theo, hay những kẻ ngu ngốc dám vượt quá địa vị của mình."
  ep2_wedding_ewan_0051_approachable_modifier:0 "Dễ gần"
  ep2_wedding_ewan_0051_approachable_modifier_desc:0 "Được xem là hình mẫu của sự khéo léo trong giao tiếp, nhân vật này luôn sẵn lòng trò chuyện — dù chủ đề có khô khan đến đâu."
  ep2_wedding_ewan.0000.desc.hate.fallback:0 ""Hừ, ngươi đúng là dễ thỏa mãn thật," [char_2.GetFirstNameNoTooltip] khịt mũi. "Ta mong đợi nhiều hơn ở những buổi yến tiệc kiểu này.""
  ep2_wedding_ewan.0000.desc.boilerplate.char_intro:0 "Gần chỗ ngồi của ta, cả [char_1.GetTitledFirstName] lẫn [char_2.GetTitledFirstName] đều chia sẻ quan điểm của mình"
  ep2_wedding_ewan.0000.flavour.hobnob.char_1:0 "Ngài dành phần lớn buổi tối để giao thiệp với vị [char_1.Custom('GetEducationTrait')] này"
  ep2_wedding_ewan.0000.flavour.hobnob.char_2:0 "Ngài dành phần lớn buổi tối để giao thiệp với vị [char_2.Custom('GetEducationTrait')] này"












 ##################################################
 # BANQUET PHASE

  ep2_wedding_ewan.0001.t:0 "Quả là một màn trình diễn"
  ep2_wedding_ewan.0001.desc.intro.bad:0 "Dù không phải là buổi tiệc hoành tráng nhất, các tiết mục giải trí trong đêm nay vẫn là một tập hợp đầy hứng khởi của diễn viên, nhào lộn, tung hứng và nhiều hơn nữa. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về màn trình diễn.\n\n"
  ep2_wedding_ewan.0001.desc.t1.love.diligent:0 ""Hoan hô! Hoan hô! Vừa đủ thú vị mà không trở nên #EMP quá#! phù phiếm!" [char_1.GetFirstNameNoTooltip] reo lên."
  ep2_wedding_ewan.0001.desc.t1.love.shy:0 ""Thật tốt khi có chút náo nhiệt nền mà không lấn át mọi cuộc trò chuyện," [char_1.GetFirstNameNoTooltip] gần như thì thầm."
  ep2_wedding_ewan.0001.desc.t1.love.humble:0 ""Số lượng người biểu diễn vừa vặn và trang nhã," [char_1.GetFirstNameNoTooltip] hài lòng gật đầu."
  ep2_wedding_ewan.0001.desc.t1.love.content:0 "$ep2_wedding_ewan.0001.desc.t1.love.humble$"
  ep2_wedding_ewan.0001.desc.t1.love.honest:0 ""Ta mừng là không có quá nhiều người biểu diễn," [char_1.GetFirstNameNoTooltip] cau mày. "Bọn ấy thường phiền phức lắm.""
  ep2_wedding_ewan.0001.desc.t1.love.just:0 "$ep2_wedding_ewan.0001.desc.t1.love.honest$"
  ep2_wedding_ewan.0001.desc.t1.love.craven:0 ""Ta lúc nào cũng hơi bồn chồn nếu các tiết mục #EMP quá#! liều lĩnh," [char_1.GetFirstNameNoTooltip] cười khì."
  ep2_wedding_ewan.0001.desc.t1.love.paranoid:0 ""Giới biểu diễn thật thất thường. Thế này là đủ rồi — tập trung quá đông một chỗ thì nguy hiểm," [char_1.GetFirstNameNoTooltip] gật đầu."
  ep2_wedding_ewan.0001.desc.intro.normal:0 "Một đoàn nhạc công, nghệ sĩ nhào lộn và diễn viên đông đảo đang mang đến phần giải trí cho buổi tối, khiến cả đại sảnh rộn ràng. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về màn trình diễn.\n\n"
  ep2_wedding_ewan.0001.desc.t2.love.content:0 ""À, theo ta thì mức độ náo nhiệt thế này là vừa đẹp," [char_1.GetFirstNameNoTooltip] cười lớn."
  ep2_wedding_ewan.0001.desc.t2.love.compassionate:0 "$ep2_wedding_ewan.0001.desc.t2.love.content$"
  ep2_wedding_ewan.0001.desc.t2.love.generous:0 ""Thật tốt khi thấy có chút đa dạng," [char_1.GetFirstNameNoTooltip] kéo dài giọng, "chứ nhiều người keo kiệt lắm trong mấy khoản này.""
  ep2_wedding_ewan.0001.desc.t2.love.calm:0 ""Để cân bằng âm thanh nền cần rất nhiều suy tính," [char_1.GetFirstNameNoTooltip] trầm ngâm, "thật mừng khi không #EMP quá#! ồn ào.""
  ep2_wedding_ewan.0001.desc.t2.love.patient:0 "$ep2_wedding_ewan.0001.desc.t2.love.calm$"
  ep2_wedding_ewan.0001.desc.t2.love.fickle:0 ""Ta chưa bao giờ biết chính xác mình muốn gì ở các nghệ sĩ," [char_1.GetFirstNameNoTooltip] cười, "nhưng thế này thì ta thấy vừa ý.""
  ep2_wedding_ewan.0001.desc.t2.love.cynical:0 ""Số lượng người biểu diễn vừa đủ, không hơn," [char_1.GetFirstNameNoTooltip] nhận xét khô khan, "tốt lắm, ta không chịu nổi mấy kẻ làm quá.""
  ep2_wedding_ewan.0001.desc.intro.good:0 "Đại sảnh ngập tràn một đoàn diễu hành náo nhiệt gồm các gánh hát, nhạc công khiêu vũ và những kẻ lang bạt kỳ dị, khiến khách mời vui thích khắp nơi. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về màn trình diễn.\n\n"
  ep2_wedding_ewan.0001.desc.t3.love.lazy:0 ""Nhào lộn đi!" [char_1.GetFirstNameNoTooltip] hét vào một nghệ sĩ nhào lộn, "nhân danh [char_1.GetFaith.HealthGodName], ta #EMP thích#! tiệc tùng kiểu này!""
  ep2_wedding_ewan.0001.desc.t3.love.gregarious:0 "$ep2_wedding_ewan.0001.desc.t3.love.lazy$"
  ep2_wedding_ewan.0001.desc.t3.love.arrogant:0 ""Giờ thì #EMP thế này#! mới đúng ý ta!" [char_1.GetFirstNameNoTooltip] cười sằng sặc, "một buổi lễ hoành tráng — không, phải là #EMP vĩ đại#!!""
  ep2_wedding_ewan.0001.desc.t3.love.ambitious:0 "$ep2_wedding_ewan.0001.desc.t3.love.arrogant$"
  ep2_wedding_ewan.0001.desc.t3.love.deceitful:0 ""Ta rất kính nể giới biểu diễn," [char_1.GetFirstNameNoTooltip] trầm ngâm, "biến dối trá thành nghề kiếm sống quả là có bản lĩnh.""
  ep2_wedding_ewan.0001.desc.t3.love.arbitrary:0 "$ep2_wedding_ewan.0001.desc.t3.love.deceitful$"
  ep2_wedding_ewan.0001.desc.t3.love.brave:0 ""Phải rồi, cứ chơi nhạc khi đang bay trên không đi, đừng nhúa!" [char_1.GetFirstNameNoTooltip] cười lớn, quát vào một nhạc công, "không có chút #EMP nguy hiểm#! thì còn gì vui.""
  ep2_wedding_ewan.0001.desc.t3.love.trusting:0 ""Những trò mới lạ thật," [char_1.GetFirstNameNoTooltip] cười, "ta gần như ước vài người trong số họ đến sống cùng ta.""
  ep2_wedding_ewan.0001.desc.midtro:0 "\n\n"
  ep2_wedding_ewan.0001.desc.t1.hate.lazy:0 ""Hừm, ta đã hy vọng có thứ gì đó... phô trương hơn chút," [char_2.GetFirstNameNoTooltip] rên rỉ."
  ep2_wedding_ewan.0001.desc.t1.hate.gregarious:0 "$ep2_wedding_ewan.0001.desc.t1.hate.lazy$"
  ep2_wedding_ewan.0001.desc.t1.hate.arrogant:0 ""Hừ, cũng tạm được đấy, nhưng chẳng phải màn cảnh tượng ta mong đợi," [char_2.GetFirstNameNoTooltip] càu nhàu."
  ep2_wedding_ewan.0001.desc.t1.hate.ambitious:0 "$ep2_wedding_ewan.0001.desc.t1.hate.arrogant$"
  ep2_wedding_ewan.0001.desc.t1.hate.deceitful:0 ""Thành thật mà nói, ta đã mong nhiều hơn," [char_2.GetFirstNameNoTooltip] than phiền, "ta thấy hạng người này rất thú vị.""
  ep2_wedding_ewan.0001.desc.t1.hate.arbitrary:0 "$ep2_wedding_ewan.0001.desc.t1.hate.deceitful$"
  ep2_wedding_ewan.0001.desc.t1.hate.brave:0 ""Lẽ ra phải có nhiều hơn nữa," [char_2.GetFirstNameNoTooltip] phàn nàn, "chừng này thì chẳng đủ để làm điều gì thực sự liều lĩnh.""
  ep2_wedding_ewan.0001.desc.t1.hate.trusting:0 ""Thật lòng mà nói, ta hy vọng có thêm sự đa dạng," [char_2.GetFirstNameNoTooltip] càm ràm, "dù sao thì cũng có thể thuê mấy hạng diễn rong ở bất kỳ thị trấn nào.""
  ep2_wedding_ewan.0001.desc.t2.hate.ambitious:0 ""Cũng được thôi," [char_2.GetFirstNameNoTooltip] khịt mũi, "chỉ là ta thích sự phô trương thật sự hơn mấy biện pháp nửa vời này.""
  ep2_wedding_ewan.0001.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0001.desc.t2.hate.ambitious$"
  ep2_wedding_ewan.0001.desc.t2.hate.greedy:0 ""Hừ, đông thì chẳng đủ để khen tiết kiệm, mà lại không đủ để thưởng thức tiền của kẻ khác được phô bày," [char_2.GetFirstNameNoTooltip] than vãn."
  ep2_wedding_ewan.0001.desc.t2.hate.wrathful:0 ""Thành thật mà nói, ta đã mong sự kiện này phải nhộn nhịp hơn," [char_2.GetFirstNameNoTooltip] hừ nhẹ."
  ep2_wedding_ewan.0001.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0001.desc.t2.hate.wrathful$"
  ep2_wedding_ewan.0001.desc.t2.hate.stubborn:0 ""Theo ý ta, đây vốn phải là một buổi ăn mừng cho nghi lễ," [char_2.GetFirstNameNoTooltip] nhận xét, "nên nó đáng ra phải xứng tầm và làm tới bến.""
  ep2_wedding_ewan.0001.desc.t2.hate.zealous:0 "$ep2_wedding_ewan.0001.desc.t2.hate.stubborn$"
  ep2_wedding_ewan.0001.desc.t3.hate.diligent:0 ""Ta chỉ thấy mọi thứ này hơi quá," [char_2.GetFirstNameNoTooltip] than phiền, "quá nhiều... phù phiếm...""
  ep2_wedding_ewan.0001.desc.t3.hate.shy:0 ""Ta gần như không nghe nổi suy nghĩ của chính mình," [char_2.GetFirstNameNoTooltip] thì thầm, "mọi thứ thật là... choáng ngợp...""
  ep2_wedding_ewan.0001.desc.t3.hate.humble:0 ""Cũng tốt đấy, nhưng phô trương quá mức," [char_2.GetFirstNameNoTooltip] khịt mũi, "ta cần thêm chút không gian để trò chuyện.""
  ep2_wedding_ewan.0001.desc.t3.hate.content:0 "$ep2_wedding_ewan.0001.desc.t3.hate.humble$"
  ep2_wedding_ewan.0001.desc.t3.hate.honest:0 ""#EMP Diễn viên#!" [char_2.GetFirstNameNoTooltip] càu nhàu, "toàn bọn nói dối chuyên nghiệp. Một dịp trọng đại thế này thì bớt đi vài người cũng chẳng sao.""
  ep2_wedding_ewan.0001.desc.t3.hate.just:0 "$ep2_wedding_ewan.0001.desc.t3.hate.honest$"
  ep2_wedding_ewan.0001.desc.t3.hate.craven:0 ""Coi chừng!" [char_2.GetFirstNameNoTooltip] gắt lên, né một quả bóng tung hứng, "lũ làm thuê cẩu thả chết tiệt, đến bữa ăn cũng không yên thân..."" 
  ep2_wedding_ewan.0001.desc.t3.hate.paranoid:0 ""Quá nhiều gương mặt lạ, quá nhiều 'dụng cụ' kỳ quái," [char_2.GetFirstNameNoTooltip] nguyền rủa, "như kẻ kia kìa! Hắn đang nuốt kiếm giả, hay là sát thủ đang rình rập?""
  ep2_wedding_ewan.0001.a:0 ""[char_1.GetFirstNameNoTooltip] rõ ràng nói đúng.""
  ep2_wedding_ewan.0001.a.host:0 ""[char_1.GetFirstNameNoTooltip], ta rất mừng vì ngươi thích điều này!""
  ep2_wedding_ewan.0001.b:0 ""Ta phải đồng ý với [char_2.GetFirstNameNoTooltip].""
  ep2_wedding_ewan.0001.b.host:0 ""Ta đã hình dung khác khi thuê họ, [char_2.GetFirstNameNoTooltip]""
  ep2_wedding_ewan.0001.c:0 "Ánh mắt đe dọa của ta khóa chặt vào [intent_target.GetFirstNameNoTooltip]..."
  ep2_wedding_ewan.0001.c.tt:0 "Ánh nhìn của Ngài khiến [intent_target.GetFirstNameNoTooltip] bất an"
  ep2_wedding_ewan.0001.d:0 "Ta tập trung vào phần giải trí thực sự."

  ep2_wedding_ewan.0011.t:0 "Bữa tiệc xứng tầm với một..."
  ep2_wedding_ewan.0011.desc.intro.bad:0 "Theo mọi tiêu chuẩn hợp lý, đồ ăn của buổi tối là một bản hòa trộn đầy kích thích của kết cấu, hương vị và sự phô diễn — dù đây là một dịp đặc biệt hơn hẳn. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về bàn tiệc.\n\n"
  ep2_wedding_ewan.0011.desc.t1.love.temperate:0 ""Nhân danh [char_1.GetFaith.HealthGodName], ẩm thực quả là #EMP tuyệt hảo#!" [char_1.GetFirstNameNoTooltip] hào hứng thốt lên, "đa dạng đúng mực mà không hề quá đà!""
  ep2_wedding_ewan.0011.desc.t1.love.humble:0 ""Thỉnh thoảng cũng nên tự thưởng cho bản thân," [char_1.GetFirstNameNoTooltip] trầm ngâm, "và đây chính là cách ta thích làm nhất.""
  ep2_wedding_ewan.0011.desc.t1.love.content:0 "$ep2_wedding_ewan.0011.desc.t1.love.humble$"
  ep2_wedding_ewan.0011.desc.t1.love.impatient:0 ""À ha, món ăn đầy đặn được dọn đúng lúc," [char_1.GetFirstNameNoTooltip] reo lên, "tuyệt vời! Ta không chịu nổi mấy bữa với hàng tá món lặt vặt.""
  ep2_wedding_ewan.0011.desc.t1.love.paranoid:0 ""Ừm, mức độ vừa phải," [char_1.GetFirstNameNoTooltip] nhận xét, lật qua một miếng thức ăn chắc nịch, "trang trí cầu kỳ quá chỉ mời gọi độc dược mà thôi.""
  ep2_wedding_ewan.0011.desc.t1.love.stubborn:0 ""Lại thêm đúng món này nữa," [char_1.GetFirstNameNoTooltip] cười lớn, "ta biết mình thích gì, và ta thích thứ họ đang dọn!""
  ep2_wedding_ewan.0011.desc.intro.normal:0 "Với các món ăn ngoại lai, tác phẩm ẩm thực cầu kỳ cùng sắc màu rực rỡ và hương thơm nồng nàn, các đầu bếp của buổi yến tiệc đã dốc toàn lực cho đám cưới. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về bàn tiệc.\n\n"
  ep2_wedding_ewan.0011.desc.t2.love.content:0 ""Àhh, mọi thứ thật đẹp," [char_1.GetFirstNameNoTooltip] gật đầu, "một sự hòa quyện hoàn hảo giữa hình thức và hương vị.""
  ep2_wedding_ewan.0011.desc.t2.love.compassionate:0 "$ep2_wedding_ewan.0011.desc.t2.love.content$"
  ep2_wedding_ewan.0011.desc.t2.love.generous:0 ""#EMP Tasty#!!" laughs [char_1.GetFirstNameNoTooltip], popping something purplish into [char_1.GetHerHis] mouth, "glad to see some coin on display.""
  ep2_wedding_ewan.0011.desc.t2.love.calm:0 ""Một bữa tiệc hay, theo ta là vậy," [char_1.GetFirstNameNoTooltip] cười khẽ, "rõ ràng có đầu tư suy nghĩ để tạo trải nghiệm mà vẫn không quên điều cốt lõi.""
  ep2_wedding_ewan.0011.desc.t2.love.patient:0 "$ep2_wedding_ewan.0011.desc.t2.love.calm$"
  ep2_wedding_ewan.0011.desc.t2.love.cynical:0 ""Mức độ đầu tư vừa đủ được phô bày ở đây," [char_1.GetFirstNameNoTooltip] nhận xét mỉa mai, "đủ để thấy có tâm, nhưng không lãng phí.""
  ep2_wedding_ewan.0011.desc.intro.good:0 "Thị giác, vị giác, xúc giác, khứu giác, thậm chí cả thính giác — không giác quan nào của con người không bị quy mô và sự tráng lệ của bữa tiệc tối nay chinh phục, một cuộc hỗn chiến rực rỡ giữa nghệ thuật và ẩm thực. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về bàn tiệc.\n\n"
  ep2_wedding_ewan.0011.desc.t3.love.gluttonous:0 ""Another! #EMP ANOTHER!#!" bellows [char_1.GetFirstNameNoTooltip], happily stuffing [char_1.GetHerselfHimself] in lieu of detailed commentary."
  ep2_wedding_ewan.0011.desc.t3.love.arrogant:0 ""#EMP Ưmmm#!!" [char_1.GetFirstNameNoTooltip] rên rỉ, "giờ thì #EMP thế này#! mới đúng là cách mở tiệc!""
  ep2_wedding_ewan.0011.desc.t3.love.ambitious:0 "$ep2_wedding_ewan.0011.desc.t3.love.arrogant$"
  ep2_wedding_ewan.0011.desc.t3.love.patient:0 ""Lại thêm một món nữa sao?" [char_1.GetFirstNameNoTooltip] phấn khích, "nhân danh [char_1.GetFaith.HealthGodName], dường như không bao giờ hết! Thật tuyệt!""
  ep2_wedding_ewan.0011.desc.t3.love.trusting:0 ""Ta chẳng hiểu sao có người lại lo lắng khi dự tiệc," [char_1.GetFirstNameNoTooltip] cười, "trước những món ăn tráng lệ thế này thì còn gì phải sợ?""
  ep2_wedding_ewan.0011.desc.t3.love.fickle:0 ""Ôi, thêm món đó nữa! #EMP Và#! cả món kia!" [char_1.GetFirstNameNoTooltip] phấn khởi, "ta thích nhất là những bữa tiệc mà không phải chọn chỉ vài món.""
  ep2_wedding_ewan.0011.desc.midtro:0 "\n\n"
  ep2_wedding_ewan.0011.desc.t1.hate.gluttonous:0 ""Thì cũng chỉ là..." [char_2.GetFirstNameNoTooltip] khịt mũi, "không #EMP hẳn#! như ta đã mong đợi, vậy thôi.""
  ep2_wedding_ewan.0011.desc.t1.hate.arrogant:0 ""Hừ, một bữa tiệc thì phải suýt làm quốc khố phá sản," [char_2.GetFirstNameNoTooltip] khịt mũi cười khẩy, "nếu không thì còn có ý nghĩa gì nữa?""
  ep2_wedding_ewan.0011.desc.t1.hate.ambitious:0 "$ep2_wedding_ewan.0011.desc.t1.hate.arrogant$"
  ep2_wedding_ewan.0011.desc.t1.hate.patient:0 ""Ta không hiểu sao nhịp độ dọn món lại vội vã đến thế," [char_2.GetFirstNameNoTooltip] phàn nàn, "mọi người mất bao lâu mới tới được đây, vậy mà giờ ăn thì lại vội?""
  ep2_wedding_ewan.0011.desc.t1.hate.trusting:0 ""Sự đa dạng có phần hơi nghèo nàn," [char_2.GetFirstNameNoTooltip] than vãn, "thêm vài món nữa thì có hại gì đâu?""
  ep2_wedding_ewan.0011.desc.t1.hate.fickle:0 "$ep2_wedding_ewan.0011.desc.t1.hate.trusting$"
  ep2_wedding_ewan.0011.desc.t2.hate.ambitious:0 ""Tầm thường," [char_2.GetFirstNameNoTooltip] khịt mũi, "đó là dấu hiệu của việc thiếu tham vọng.""
  ep2_wedding_ewan.0011.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0011.desc.t2.hate.ambitious$"
  ep2_wedding_ewan.0011.desc.t2.hate.greedy:0 ""Đồ ăn thì ngon," [char_2.GetFirstNameNoTooltip] nhận xét, "nhưng ta không hiểu sao lại tiêu từng này tiền mà không nhắm tới mức #EMP tuyệt đỉnh#!.""
  ep2_wedding_ewan.0011.desc.t2.hate.wrathful:0 ""Cũng ổn," [char_2.GetFirstNameNoTooltip] gắt lên, "nhưng vẫn chưa đủ với ta. Ta thích bữa tiệc náo loạn hơn thế này.""
  ep2_wedding_ewan.0011.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0011.desc.t2.hate.wrathful$"
  ep2_wedding_ewan.0011.desc.t2.hate.zealous:0 ""Ta đang vui mà," [char_2.GetFirstNameNoTooltip] càu nhàu, "chỉ là ta nghĩ mọi thứ có thể được đẩy xa hơn chút nữa để thành #EMP tốt nhất#!.""
  ep2_wedding_ewan.0011.desc.t3.hate.temperate:0 ""Chẳng phải mọi thứ đều khá là..." [char_2.GetFirstNameNoTooltip] khịt mũi, "#EMP ngấy sao?#! Ta thấy hình thức mà lấn át nội dung thì không phải là điểm tốt của một bữa ăn.""
  ep2_wedding_ewan.0011.desc.t3.hate.humble:0 ""Trời ạ, đúng là nhộn nhịp thật," [char_2.GetFirstNameNoTooltip] than phiền, "ta hầu như chẳng có cơ hội nếm kỹ từng món. Chậm lại chút thì tốt hơn.""
  ep2_wedding_ewan.0011.desc.t3.hate.content:0 "$ep2_wedding_ewan.0011.desc.t3.hate.humble$"
  ep2_wedding_ewan.0011.desc.t3.hate.impatient:0 ""Hừ!" [char_2.GetFirstNameNoTooltip] rủa khẽ, "ta không chịu nổi mấy bữa ăn dài lê thê này cứ tiếp diễn mãi..."" 
  ep2_wedding_ewan.0011.desc.t3.hate.paranoid:0 ""Những bữa tiệc quy mô thế này giống như khu rừng tối tăm," [char_2.GetFirstNameNoTooltip] u ám nói, "có thể an toàn, hoặc cũng có thể đầy rẫy hiểm họa rình rập.""
  ep2_wedding_ewan.0011.desc.t3.hate.stubborn:0 ""Đừng đụng vào!" [char_2.GetFirstNameNoTooltip] quát một người hầu, "ta sẽ ăn xong khi ta sẵn sàng! Quá nhiều món chết tiệt..."" 
  ep2_wedding_ewan.0011.a:0 ""Ta nghĩ ta đứng về phía ngươi, [char_1.GetFirstNameNoTooltip].""
  ep2_wedding_ewan.0011.a.host:0 ""Ta đã tự tay chọn các món chính đấy, [char_1.GetFirstNameNoTooltip].""
  ep2_wedding_ewan.0011.b:0 ""[char_2.GetFirstNameNoTooltip] nói có lý.""
  ep2_wedding_ewan.0011.b.host:0 ""Phải, [char_2.GetFirstNameNoTooltip], mọi thứ không hẳn như ta đã hình dung.""
  ep2_wedding_ewan.0011.c:0 "[intent_target.GetFirstNameNoTooltip] đang ngồi rất gần cửa ra món..."
  ep2_wedding_ewan.0011.c.tt.success:0 "Ngài làm một người hầu vấp ngã, hất đổ súp lên [intent_target.GetFirstNameNoTooltip]"
  ep2_wedding_ewan.0011.c.tt.failure:0 "Người hầu tránh được chân Ngài"
  ep2_wedding_ewan.0011.d:0 "Gật gù cho qua mà chẳng để tâm."

  ep2_wedding_ewan.0021.t:0 "Lấp Lánh, Rực Rỡ"
  ep2_wedding_ewan.0021.desc.intro.bad:0 "Những trang trí trong đại sảnh yến tiệc thật đẹp mắt, là sự hòa trộn của tranh tường và những loài hoa hiếm — dù chưa hẳn là loại đắt tiền nhất có thể. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về phần trang trí.\n\n"
  ep2_wedding_ewan.0021.desc.t1.love.content:0 ""Ahhhh, #EMP tuyệt vời#!\" [char_1.GetFirstNameNoTooltip] cười khoái chí, \"đủ cầu kỳ để tạo điểm nhấn, nhưng không đến mức lấn át cặp đôi hạnh phúc.\""
  ep2_wedding_ewan.0021.desc.t1.love.lazy:0 ""Ngươi biết không,\" [char_1.GetFirstNameNoTooltip] trầm ngâm, \"đây #EMP chính xác#! là mức độ công sức mà ta cũng sẽ bỏ ra. Ta rất tán thành!\""
  ep2_wedding_ewan.0021.desc.t1.love.humble:0 "$ep2_wedding_ewan.0021.desc.t1.love.content$"
  ep2_wedding_ewan.0021.desc.t1.love.forgiving:0 ""Có lẽ chưa phải là tráng lệ nhất có thể,\" [char_1.GetFirstNameNoTooltip] gật đầu, \"nhưng vẫn là một nỗ lực đáng khen, đầy tâm huyết.\""
  ep2_wedding_ewan.0021.desc.t1.love.compassionate:0 "$ep2_wedding_ewan.0021.desc.t1.love.forgiving$"
  ep2_wedding_ewan.0021.desc.t1.love.arbitrary:0 ""Ta mặc kệ ngươi nói gì,\" [char_1.GetFirstNameNoTooltip] nhún vai, \"ta thích nó. Người ta đã có cố gắng rồi, ngươi chỉ đang quá kén chọn thôi.\""
  ep2_wedding_ewan.0021.desc.t1.love.greedy:0 "$ep2_wedding_ewan.0021.desc.t1.love.lazy$"
  ep2_wedding_ewan.0021.desc.intro.normal:0 "Đại sảnh yến tiệc được khoác lên mình một bữa tiệc của sắc màu, hương thơm và thị giác — chỉ thiếu vắng những loại vải vóc và hoa hiếm bậc nhất. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về phần trang trí.\n\n"
  ep2_wedding_ewan.0021.desc.t2.love.content:0 ""Ta không hiểu sao có người lại không yêu thích tất cả những thứ này,\" [char_1.GetFirstNameNoTooltip] cười lớn, \"hãy nhìn xem người ta đã bỏ công đến mức nào!\""
  ep2_wedding_ewan.0021.desc.t2.love.compassionate:0 "$ep2_wedding_ewan.0021.desc.t2.love.content$"
  ep2_wedding_ewan.0021.desc.t2.love.generous:0 ""Khá nhiều tiền đã được chi ra ở đây,\" [char_1.GetFirstNameNoTooltip] nhận xét, \"thấy tấm thảm kia không? Nó được mang đến từ nửa vòng lục địa đấy.\""
  ep2_wedding_ewan.0021.desc.t2.love.calm:0 ""Nhân danh [char_1.GetFaith.WealthGodName], mọi thứ #EMP thật#! hoàn hảo,\" [char_1.GetFirstNameNoTooltip] hào hứng, \"vừa đủ để tinh tế mà không quá đà!\""
  ep2_wedding_ewan.0021.desc.t2.love.patient:0 "$ep2_wedding_ewan.0021.desc.t2.love.calm$"
  ep2_wedding_ewan.0021.desc.t2.love.fickle:0 ""Có lẽ cách bày biện chưa thật sự đồng nhất,\" [char_1.GetFirstNameNoTooltip] suy ngẫm, \"nhưng ta #EMP thích#! điều đó. Sự đa dạng rất quan trọng trong những dịp thế này.\""
  ep2_wedding_ewan.0021.desc.t2.love.cynical:0 ""Đủ sự xa hoa để làm hài lòng đám đông mà không đến mức lãng phí,\" [char_1.GetFirstNameNoTooltip] gật gù, \"được cân nhắc rất kỹ.\""
  ep2_wedding_ewan.0021.desc.intro.good:0 "Những bức tượng tinh xảo, thảm trang trí ngoại lai, những lẵng hoa kỳ lạ từ phương xa và vô số thứ khác phủ kín đại sảnh — đúng là một bữa tiệc cho đôi mắt. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ về phần trang trí.\n\n"
  ep2_wedding_ewan.0021.desc.t3.love.ambitious:0 ""Giờ thì #EMP đây#! mới đúng là thứ ta mong đợi!\" [char_1.GetFirstNameNoTooltip] vang giọng, \"một địa điểm xứng đáng cho một đám cưới #EMP vĩ đại#!!\""
  ep2_wedding_ewan.0021.desc.t3.love.diligent:0 "$ep2_wedding_ewan.0021.desc.t3.love.ambitious$"
  ep2_wedding_ewan.0021.desc.t3.love.arrogant:0 "$ep2_wedding_ewan.0021.desc.t3.love.ambitious$"
  ep2_wedding_ewan.0021.desc.t3.love.honest:0 ""Ta thật sự vui khi thấy mức độ đầu tư phù hợp như thế này,\" [char_1.GetFirstNameNoTooltip] cười, \"ta không chịu nổi cảnh chủ tiệc làm nửa vời cho một sự kiện quan trọng như vậy.\""
  ep2_wedding_ewan.0021.desc.t3.love.just:0 "$ep2_wedding_ewan.0021.desc.t3.love.honest$"
  ep2_wedding_ewan.0021.desc.t3.love.greedy:0 ""Rõ ràng là không hề keo kiệt tiền bạc,\" [char_1.GetFirstNameNoTooltip] cười lớn, \"thế thì ta cũng chẳng ngại tận hưởng lòng hiếu khách này.\""
  ep2_wedding_ewan.0021.desc.t3.love.generous:0 "$ep2_wedding_ewan.0021.desc.t3.love.greedy$"
  ep2_wedding_ewan.0021.desc.midtro:0 "\n\n"
  ep2_wedding_ewan.0021.desc.t1.hate.ambitious:0 ""Thành thật mà nói, ta vẫn thích một phong cách..." [char_2.GetFirstNameNoTooltip] tìm từ ngữ lịch sự, "#EMP cầu kỳ#! hơn một chút.\""
  ep2_wedding_ewan.0021.desc.t1.hate.diligent:0 "$ep2_wedding_ewan.0021.desc.t1.hate.ambitious$"
  ep2_wedding_ewan.0021.desc.t1.hate.arrogant:0 "$ep2_wedding_ewan.0021.desc.t1.hate.ambitious$"
  ep2_wedding_ewan.0021.desc.t1.hate.honest:0 ""Với ta thì sự kiện này có vẻ được quảng bá quá mức,\" [char_2.GetFirstNameNoTooltip] phàn nàn, \"sao lại mời nhiều người đến vậy nếu chỉ có thể chi trả chừng này?\""
  ep2_wedding_ewan.0021.desc.t1.hate.generous:0 "$ep2_wedding_ewan.0021.desc.t1.hate.honest$"
  ep2_wedding_ewan.0021.desc.t1.hate.just:0 ""Ta cho rằng tiêu chuẩn cũng khá cao,\" [char_2.GetFirstNameNoTooltip] hừ nhẹ, \"chỉ là ta đã mong đợi nhiều hơn chút nữa.\""
  ep2_wedding_ewan.0021.desc.t2.hate.ambitious:0 ""Hừm,\" [char_2.GetFirstNameNoTooltip] hừ mũi, \"thật phí tiềm năng. Đã có nhiều thứ để ngắm thế này rồi, sao lại #EMP không#! làm tới bến?\""
  ep2_wedding_ewan.0021.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0021.desc.t2.hate.ambitious$"
  ep2_wedding_ewan.0021.desc.t2.hate.greedy:0 ""Quá nhiều tiền được phô bày để mà tôn trọng,\" [char_2.GetFirstNameNoTooltip] khịt mũi, \"nhưng lại không đủ để thật sự tận hưởng. Ta thất vọng.\""
  ep2_wedding_ewan.0021.desc.t2.hate.wrathful:0 ""Ta thấy cũng ổn,\" [char_2.GetFirstNameNoTooltip] hừ lạnh, \"nhưng sẽ thích hơn nhiều nếu mọi thứ nhiều hơn một chút.\""
  ep2_wedding_ewan.0021.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0021.desc.t2.hate.wrathful$"
  ep2_wedding_ewan.0021.desc.t2.hate.stubborn:0 ""Nghi lễ rất quan trọng, và đây vẫn là một phần của nghi lễ,\" [char_2.GetFirstNameNoTooltip] hừ giọng, \"lẽ ra nó phải lớn hơn, đẹp hơn, hoành tráng hơn — tất cả mọi thứ.\""
  ep2_wedding_ewan.0021.desc.t2.hate.zealous:0 "$ep2_wedding_ewan.0021.desc.t2.hate.stubborn$"
  ep2_wedding_ewan.0021.desc.t3.hate.content:0 ""Thẳng thắn mà nói, ta thấy mọi thứ hơi mệt mỏi,\" [char_2.GetFirstNameNoTooltip] than vãn, \"ta thậm chí còn chẳng biết đâu là ghế ngồi, đâu là tượng trang trí.\""
  ep2_wedding_ewan.0021.desc.t3.hate.lazy:0 "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
  ep2_wedding_ewan.0021.desc.t3.hate.humble:0 "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
  ep2_wedding_ewan.0021.desc.t3.hate.compassionate:0 ""Hừm, ta không chắc lắm,\" [char_2.GetFirstNameNoTooltip] khịt mũi, \"chẳng phải mọi thứ này đang hơi làm lu mờ nghi lễ sao?\""
  ep2_wedding_ewan.0021.desc.t3.hate.arbitrary:0 ""Có thật là đẹp đến thế không?\" [char_2.GetFirstNameNoTooltip] làu bàu, \"tất cả đống này thì đắt đỏ được đến mức nào chứ?\""
  ep2_wedding_ewan.0021.a:0 ""Hừ, ta thích lối suy nghĩ tích cực của [char_1.GetFirstNamePossessiveNoTooltip] hơn.\""
  ep2_wedding_ewan.0021.a.host:0 ""Chính ta đã tự tay chọn nhiều món trang trí đấy, [char_1.GetFirstNameNoTooltip].\""
  ep2_wedding_ewan.0021.b:0 ""Ta e là ngươi nói cũng có lý, [char_2.GetFirstNameNoTooltip].\""
  ep2_wedding_ewan.0021.b.host:0 ""[char_2.GetFirstNameNoTooltip] nói đúng — mọi thứ không hẳn như ta hình dung.\""
  ep2_wedding_ewan.0021.c:0 "[intent_target.GetFirstNameNoTooltip] trông có vẻ khá cô đơn..."
  ep2_wedding_ewan.0021.d:0 "Không can dự vào."

  ep2_wedding_ewan.0031.t:0 "Bữa Tiệc Giao Hảo"
  ep2_wedding_ewan.0031.desc.intro:0 "Trong những dịp thế này lúc nào cũng có vô số người để gặp gỡ — gương mặt mới để làm quen, bằng hữu cũ để hàn huyên — tất cả diễn ra giữa không khí nhộn nhịp của một buổi tiệc tưng bừng.\n\nNgay từ chỗ ta ngồi, ta có thể thấy"
  ep2_wedding_ewan.0031.desc.char_1.conversationalist_neighbour:0 "vị quân chủ láng giềng  của ta"
  ep2_wedding_ewan.0031.desc.char_1.conversationalist_covassal:0 "vị chư hầu đồng cấp với ta"
  ep2_wedding_ewan.0031.desc.char_1.conversationalist_vassal:0 "chư hầu trung thành của ta"
  ep2_wedding_ewan.0031.desc.char_1.conversationalist_liege:0 "lãnh chúa trực tiếp của ta"
  ep2_wedding_ewan.0031.desc.char_1.conversationalist_other_ruler:0 "một quân chủ ngoại bang,"
  ep2_wedding_ewan.0031.desc.char_1.conversationalist_backup:0 "một vị [char_1.GetLadyLord] danh giá,"
  ep2_wedding_ewan.0031.desc.midro:0 "[char_1.GetTitledFirstName], trông như đang rất cần một người bầu Bạn Tốt hơn, và"
  ep2_wedding_ewan.0031.desc.char_2.conversationalist_neighbour:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_neighbour$"
  ep2_wedding_ewan.0031.desc.char_2.conversationalist_covassal:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_covassal$"
  ep2_wedding_ewan.0031.desc.char_2.conversationalist_vassal:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_vassal$"
  ep2_wedding_ewan.0031.desc.char_2.conversationalist_liege:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_liege$"
  ep2_wedding_ewan.0031.desc.char_2.conversationalist_other_ruler:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_other_ruler$"
  ep2_wedding_ewan.0031.desc.char_2.conversationalist_backup:0 "một vị [char_2.GetLadyLord] danh giá,"
  ep2_wedding_ewan.0031.desc.outro:0 "[char_2.GetTitledFirstName], tràn đầy tinh thần và niềm vui.\n\nCả hai đều có vẻ là những người thú vị để tìm hiểu kỹ hơn, và giờ #EMP chính là#! lúc cho một cuộc phiêu lưu xã giao..."
  ep2_wedding_ewan.0031.a:0 ""[conversationalist_neighbour.GetFirstNameNoTooltip], thật vui khi gặp ngài!""
  ep2_wedding_ewan.0031.b:0 ""À, [conversationalist_covassal.GetFirstNameNoTooltip], ta rất mừng vì ngươi đã đến...""
  ep2_wedding_ewan.0031.c:0 ""Luôn là một niềm vinh hạnh, [conversationalist_vassal.GetFirstNameNoTooltip].""
  ep2_wedding_ewan.0031.d:0 ""[conversationalist_liege.GetLadyLord|U] [conversationalist_liege.GetFirstNameNoTooltip], sự hiện diện của ngài làm rạng rỡ nơi này!""
  ep2_wedding_ewan.0031.e:0 ""[conversationalist_other_ruler.GetFirstNameNoTooltip]. Thật không ngờ lại gặp ngài ở đây.""
  ep2_wedding_ewan.0031.f:0 ""[conversationalist_backup.GetFirstNameNoTooltip], rất hân hạnh được gặp.""
  ep2_wedding_ewan.0031.g:0 "Tiệc tùng là để vui hết mình! Sao phải bó buộc vào một cuộc trò chuyện?"
  ep2_wedding_ewan.0031.h:0 "Ừm, ta nghĩ vẫn còn người khác ta muốn nói chuyện hơn."

  ep2_wedding_ewan.0041.t:0 "Phát Biểu! Phát Biểu!"
  ep2_wedding_ewan.0041.desc.intro:0 "Mỗi buổi yến tiệc cưới đều có một số lượng bài phát biểu #EMP dài lê thê#! đến mức đáng kinh ngạc. Có bài dài, bài ngắn, có bài chân thành, có bài đầy giả dối, dập dềnh lan khắp đại sảnh, xen kẽ từng món ăn trong những làn sóng nối tiếp.\n\nKhi lượt của ta sắp đến, ta tự hỏi — liệu nên nói về cặp đôi hạnh phúc, hay"
  ep2_wedding_ewan.0041.desc.murder:0 "nhân tiện khoe khoang đôi chút trước nạn nhân tương lai của ta, [intent_target.GetFirstNameNoTooltip]?"
  ep2_wedding_ewan.0041.desc.seduce:0 "đơn giản là ve vãn mục tiêu chinh phục sắp tới của ta, [intent_target.GetFirstNameNoTooltip]?"
  ep2_wedding_ewan.0041.desc.diplomacy:0 "chỉ cố thu hút sự chú ý bằng tài ăn nói của ta?"
  ep2_wedding_ewan.0041.desc.matchmaking:0 "nói vài lời tốt đẹp dành cho [intent_target.GetFirstNameNoTooltip]?"
  ep2_wedding_ewan.0041.desc.mischief:0 "khuấy động một chút náo nhiệt?"
  ep2_wedding_ewan.0041.desc.recreation:0 "tập trung vào không khí lễ hội?"
  ep2_wedding_ewan.0041.desc.outro:0 "\n\nSuy cho cùng, những ẩn ý hai nghĩa rất dễ bị lạc mất giữa biển lời nói này..."
  ep2_wedding_ewan.0041.a:0 "Ca ngợi cặp đôi hạnh phúc, như lẽ thường."
  ep2_wedding_ewan.0041.b:0 "Ca ngợi buổi yến tiệc."
  ep2_wedding_ewan.0041.c:0 "Ngấm ngầm đe dọa [intent_target.GetFirstNameNoTooltip]."
  ep2_wedding_ewan.0041.d:0 "Khéo léo hướng bài phát biểu về phía [intent_target.GetFirstNameNoTooltip]."
  ep2_wedding_ewan.0041.d.tt.success:0 "[intent_target.GetFirstNameNoTooltip] trân trọng những ẩn ý ấy"
  ep2_wedding_ewan.0041.d.tt.failure:0 "[intent_target.GetSheHe|U] cực kỳ bối rối"
  ep2_wedding_ewan.0041.e:0 "Phô diễn tài hùng biện của bản thân."
  ep2_wedding_ewan.0041.e.tt.success:0 "Một bài phát biểu xuất sắc"
  ep2_wedding_ewan.0041.e.tt.failure:0 "Một bài phát biểu tạm ổn"
  ep2_wedding_ewan.0041.f:0 "Tán dương những phẩm chất tốt đẹp của [intent_target.GetFirstNamePossessiveNoTooltip]"
  ep2_wedding_ewan.0041.g:0 "Gợi ý vài chuyện mờ ám, nửa thật nửa hư."
  ep2_wedding_ewan.0041.g.tt.success:0 "Khoan đã... chuyện đó là thật sao?"
  ep2_wedding_ewan.0041.g.tt.failure:0 "Những lời dối trá lộ liễu và giật gân"
  ep2_wedding_ewan.0041.h:0 "Lúng túng ngồi xuống mà không nói gì."
  ep2_wedding_ewan.0041.i:0 "Nói vài lời ngọt ngào nhưng cho có lệ."

  ep2_wedding_ewan.0051.t:0 "Còn Một Chuyện Nữa"
  ep2_wedding_ewan.0051.desc.intro:0 "Bữa tiệc nào cũng vậy. Lúc nào cũng có một kẻ — mọi, bữa, tiệc. Một tên lải nhải, xuất thân thấp kém, cứ chắn đường người khác và nhất quyết không chịu #EMP im miệng#!.\n\nLần này là [dolt.GetFirstName], và [dolt.GetSheHe] thì"
  ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch:0 "desperately trying to get me to invest some of my 'ample resources as a noble [ROOT.Char.GetLadyLord]-[ROOT.Char.GetTitleAsNameNoTooltip]' in [dolt.GetHerHis]"
  ep2_wedding_ewan.0051.desc.drunkard:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ purchase of what is apparently a #EMP charmingly#! rustic drinking establishment."
  ep2_wedding_ewan.0051.desc.hashishiyah:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ việc mua lại một sào huyệt bánh hashish vốn bị bôi nhọ một cách bất công."
  ep2_wedding_ewan.0051.desc.rakish:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ việc mua một nhà thổ với dàn nhân lực xinh đẹp nhất từ tận cùng thế giới."
  ep2_wedding_ewan.0051.desc.reclusive:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ kế hoạch tài trợ xây dựng một trang viên gần như không thể tiếp cận, đủ để mang lại sự cô lập ngay cả cho những quý tộc nổi danh nhất."
  ep2_wedding_ewan.0051.desc.flagellant:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ kế hoạch cho một thứ gì đó như là… một #EMP bãi#! cột roi, có thể dẫn truyền nỗi đau thanh tẩy cộng đồng của hàng chục kẻ sám hối."
  ep2_wedding_ewan.0051.desc.profligate:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ một âm mưu được giải thích cực kỳ tệ hại để… ta… ta thậm chí còn không hiểu nổi [dolt.GetSheHe] muốn dùng tiền vào việc gì."
  ep2_wedding_ewan.0051.desc.journaller:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ founding of a scriptorium that will, apparently, consist largely of #EMP [dolt.GetHerHis]#! works, at least initially."
  ep2_wedding_ewan.0051.desc.athletic:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ ý tưởng về một dạng phòng tập công cộng hoàn toàn mới, tập trung rèn luyện mọi dạng thể lực trên toàn bộ phổ bài tập."
  ep2_wedding_ewan.0051.desc.diligent:0 "hoàn toàn ám ảnh bởi công việc thường nhật. [dolt.GetWomanMan] dường như không hề có khái niệm nói chuyện về bất cứ điều gì ngoài những nhiệm vụ tẻ nhạt nhất, thậm chí còn không nhận ra rằng không phải ai cũng hứng thú với cuộc sống u ám, vô hồn của [dolt.GetHerHis]."
  ep2_wedding_ewan.0051.desc.patient:0 "không ngừng nghỉ. Ta đã thử mọi chủ đề có thể nghĩ ra, đã thử rút lui, đã thử kéo người khác vào, nhưng [dolt.GetSheHe] vẫn kiên quyết bám lấy ta với sự bền bỉ lạnh lùng."
  ep2_wedding_ewan.0051.desc.impatient:0 "hoàn toàn không có chút kiên nhẫn nào với bất kỳ chủ đề nào. Vừa mới chạm đến một chuyện, chúng ta đã nhảy sang chuyện khác, chẳng có nổi một sợi liên kết. Chỉ là một cơn mưa ý nghĩ rời rạc bất tận, mãi mãi."
  ep2_wedding_ewan.0051.desc.arrogant:0 "hoàn toàn, thảm hại trong việc tự mê đắm bản thân. Cuộc trò chuyện đầy rẫy đạo đức giả, ý tưởng hời hợt và sự ngu xuẩn trắng trợn, vậy mà [dolt.GetWomanMan] vẫn tin chắc rằng [dolt.GetSheHe] là một thiên tài xã giao hấp dẫn."
  ep2_wedding_ewan.0051.desc.arbitrary:0 "vô cùng khó hiểu. Những lời của [dolt.GetHerHis|U] rõ ràng có ý nghĩa với chính #EMP [dolt.GetHerHim]#!, nhưng với ta thì chúng gần như chẳng liên quan gì cả? Đã nửa giờ trôi qua mà ta vẫn không biết vai trò của mình trong cuộc trò chuyện này là gì."
  ep2_wedding_ewan.0051.desc.zealous:0 "lải nhải không ngừng, hết lần này đến lần khác, và #EMP mãi#! về mối liên hệ cá nhân của [dolt.GetHerHis] với đức tin của [dolt.GetHerHis], cùng việc ta nên mở lòng đón nhận ánh sáng chân chính của [dolt.GetFaith.random_GoodGodNames]. [dolt.GetSheHe|U] chưa từng hỏi một câu nào về niềm tin của #EMP ta#!."
  ep2_wedding_ewan.0051.desc.fickle:0 "vừa quyết liệt chào mời hết kế hoạch này đến kế hoạch khác, lại vừa hoàn toàn không chịu gắn bó với bất kỳ ý tưởng nào. Thay vào đó là một đoàn diễu hành bất tận của những mớ lời nói nửa vời, từ từ dìm chết ý chí sống của ta."
  ep2_wedding_ewan.0051.desc.vengeful:0 "ám ảnh tột độ với việc trút cơn thịnh nộ tối cao lên một kẻ thù vô danh nào đó vì một sự xúc phạm tưởng tượng. Tại sao ta lại phải tham gia vào âm mưu điên loạn này thì ta hoàn toàn không hiểu."
 # My continued apologies for the poetry randomiser.
  ep2_wedding_ewan.0051.desc.poet:0 "thứ kinh khủng nhất trên đời: một thi sĩ dở tệ với khán giả bị bắt buộc. Những vần thơ mà [dolt.GetSheHe] đang “thử nghiệm” lên ta thậm chí còn chẳng phải thơ — chỉ là những cặp câu vần vè gượng gạo, không chút nhịp điệu hay luật thơ."
  ep2_wedding_ewan.0051.desc.outro:0 "\n\nTa sắp hét lên rồi."
  ep2_wedding_ewan.0051.a:0 "Nhẹ nhàng rút khỏi cuộc trò chuyện."
  ep2_wedding_ewan.0051.a.tt.success:0 "Ngài thoát thân thành công"
  ep2_wedding_ewan.0051.a.tt.failure:0 "Nó #EMP không bao giờ#! kết thúc"
  ep2_wedding_ewan.0051.b:0 ""Nhân danh toàn thể cư dân của [ROOT.Char.GetFaith.random_NegativeAfterLife], ngươi có chịu ngừng cái mớ lảm nhảm này không?""
  ep2_wedding_ewan.0051.b.custom.every_wrathful_guest:0 "Mọi vị khách có đặc tính [GetTrait('wrathful').GetName( reference )]"
  ep2_wedding_ewan.0051.c:0 ""Im. Miệng.""
  ep2_wedding_ewan.0051.d:0 "Ngủ gật. Ngay lập tức."
  ep2_wedding_ewan.0051.d.custom.every_lazy_guest:0 "Mọi vị khách có đặc tính [GetTrait('lazy').GetName( reference )]"
  ep2_wedding_ewan.0051.e:0 ""Một #EMP quán rượu#!, ngươi nói sao...""
  ep2_wedding_ewan.0051.f:0 ""Một #EMP tiệm bánh#!, ngươi nói sao...""
  ep2_wedding_ewan.0051.g:0 ""Một #EMP nhà thổ#!, ngươi nói sao...""
  ep2_wedding_ewan.0051.h:0 ""Một #EMP nơi ẩn cư riêng tư#!, ngươi nói sao...""
  ep2_wedding_ewan.0051.i:0 ""Một #EMP bãi#! cột roi, ngươi nói sao...""
  ep2_wedding_ewan.0051.i.tt.deviant:0 "Lựa chọn này khả dụng nhờ [secret|E] [secret.GetName] của Ngài"
  ep2_wedding_ewan.0051.j:0 ""Và chúng ta không thể lỗ tiền? Hoàn toàn không?""
  ep2_wedding_ewan.0051.k:0 ""Một #EMP phòng chép sách#!, ngươi nói sao...""
  ep2_wedding_ewan.0051.l:0 ""Một #EMP phòng tập#!, ngươi nói sao...""
  ep2_wedding_ewan.0051.business_venture.tt:0 "Dự án kinh doanh của Ngài có thể sẽ mất nhiều năm để đi đến hồi kết"
  ep2_wedding_ewan.0051.m:0 ""Nghe có vẻ... rất thú vị...""
  ep2_wedding_ewan.0051.m.tt.success:0 "Ngài tỏ ra thật sự bị cuốn hút"
  ep2_wedding_ewan.0051.m.tt.failure:0 "Ngài lịch sự, nhưng chỉ đến thế mà thôi"
  ep2_wedding_ewan.0051.n:0 "Cười gượng và chịu đựng."
  ep2_wedding_ewan.0051.n.tt:0 "Ngài lắng nghe từng. Từ. Một."

  ep2_wedding_ewan.0052.t:0 "Việc Còn Dang Dở: Có Lãi"
  ep2_wedding_ewan.0052.desc.intro:0 "Nhiều năm về trước, ta đã đồng ý tài trợ cho một dự án kinh doanh do [dolt.GetFirstNameNoTooltip] đề xuất. Thành thật mà nói, ta gần như đã quên bẵng chuyện này —"
  ep2_wedding_ewan.0052.desc.dolt_availability.dead:0 "nhất là khi [dolt.GetFirstNameNoTooltip] giờ đây đã qua đời."
  ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned:0 "chưa kể việc [dolt.GetFirstNameNoTooltip] hiện chẳng còn ở vị thế để quản lý bất cứ thứ gì."
  ep2_wedding_ewan.0052.desc.dolt_availability.free:0 "[dolt.GetFirstNameNoTooltip] cũng hầu như không cố giữ ta tiếp tục đầu tư sau khoản ban đầu."
  ep2_wedding_ewan.0052.desc.midtro:0 "\n\nVậy mà trái với mọi dự đoán, sáng nay một bức thư đã đến, loan báo thành công bất ngờ của công việc chung."
  ep2_wedding_ewan.0052.desc.drunkard:0 "Quán rượu nhỏ bé đã phát triển thành một cơ sở uống rượu thịnh vượng."
  ep2_wedding_ewan.0052.desc.hashishiyah:0 "Sào huyệt hashish đã trở thành một nhà lười biếng phát đạt."
  ep2_wedding_ewan.0052.desc.rakish:0 "Nhà thổ nhỏ đã lớn mạnh thành một hố khoái lạc cuồng nhiệt."
  ep2_wedding_ewan.0052.desc.reclusive:0 "Trang viên riêng tư, một cách trớ trêu, lại trở nên nổi tiếng một cách lặng lẽ — ngay cả những quý tộc danh giá nhất cũng có thể biến mất ở đó một thời gian."
  ep2_wedding_ewan.0052.desc.flagellant:0 "Bãi cột roi giờ đã trở thành một điền trang của nỗi đau thanh tẩy và sinh lợi, với sức hấp dẫn rộng hơn đáng ngạc nhiên."
  ep2_wedding_ewan.0052.desc.profligate:0 "Bức thư #EMP vẫn#! không giải thích được công việc kinh doanh của chúng ta thực sự #EMP là gì#!, nhưng điều quan trọng là nó có lãi."
  ep2_wedding_ewan.0052.desc.journaller:0 "Phòng chép sách đã phát triển đủ để thường xuyên nhận đơn đặt hàng từ các nhà bảo trợ giàu có."
  ep2_wedding_ewan.0052.desc.athletic:0 "Phòng tập đã trở nên cực kỳ phổ biến với các tiểu quý tộc, hiệp sĩ lang thang và những… #EMP kẻ lữ hành#! giàu có, đang tìm một nơi để đấu tập mà không cần sở hữu điền trang riêng."
  ep2_wedding_ewan.0052.desc.outro:0 "\n\nSau khi thu về một khoản lợi nhuận kha khá từ số bạc bỏ ra, [dolt.GetFirstNameNoTooltip] đã trung thực hoàn trả phần lợi tức của ta."
  ep2_wedding_ewan.0052.desc.outro.dolt_unavailable:0 "\n\nSau khi thu về một khoản lợi nhuận kha khá từ số bạc bỏ ra, viên quản lý điều hành hoạt động đã trung thực hoàn trả phần lợi tức của ta."
  ep2_wedding_ewan.0052.a:0 "Ta nghĩ mình sẽ thu hồi #EMP toàn bộ#! khoản đầu tư."
  ep2_wedding_ewan.0052.b:0 "Tất nhiên rồi — suy cho cùng, ta là một thiên tài kinh doanh."
  ep2_wedding_ewan.0052.c:0 "Một bất ngờ dễ chịu ngoài mong đợi!"

  ep2_wedding_ewan.0053.t:0 "Việc Còn Dang Dở: Thua Lỗ"
  ep2_wedding_ewan.0053.desc.intro:0 "$ep2_wedding_ewan.0052.desc.intro$"
  ep2_wedding_ewan.0053.desc.dolt_availability.dead:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.dead$"
  ep2_wedding_ewan.0053.desc.dolt_availability.imprisoned:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned$"
  ep2_wedding_ewan.0053.desc.dolt_availability.free:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.free$"
  ep2_wedding_ewan.0053.desc.midtro:0 "\n\nĐáng ngạc nhiên thay, sáng nay một bức thư nặc danh đã tới, báo tin rằng toàn bộ cơ nghiệp của chúng ta đã bị hủy diệt hoàn toàn trong một vụ hỏa hoạn thảm khốc."
  ep2_wedding_ewan.0053.desc.drunkard:0 "Có vẻ như tai tiếng của quán rượu ngày càng tệ hơn, kéo theo lượng khách kém chất lượng, và cuối cùng là việc một kẻ địa phương vô danh tự mình giải quyết vấn đề."
  ep2_wedding_ewan.0053.desc.hashishiyah:0 "Sào huyệt hashish không thể thu hút khách mới, và rốt cuộc đã bị ngọn lửa nuốt chửng khi ai đó làm đổ một chiếc đèn rồi không hề để ý trong vài phút."
  ep2_wedding_ewan.0053.desc.rakish:0 "Nhà thổ nhỏ làm ăn tốt một thời gian, cho đến khi trở thành nạn nhân của một căn bệnh hoa liễu mới lan truyền khủng khiếp. Ngọn lửa là lựa chọn duy nhất để thanh tẩy nó."
  ep2_wedding_ewan.0053.desc.reclusive:0 "Sau khi không thể thu hút được sự quan tâm đáng kể nào, vị trí chính xác của trang viên riêng tư ấy — một cách trớ trêu — đã bị thất lạc. Chỉ một vụ cháy tình cờ do một nhóm cướp chiếm trú gây ra mới lần ra được tàn tích của nó."
  ep2_wedding_ewan.0053.desc.flagellant:0 "Thị trường được kỳ vọng dành cho những kẻ tìm kiếm sự viên mãn tinh thần thông qua nỗi đau thanh tẩy rốt cuộc chưa bao giờ hình thành, và bãi cột roi đã trở thành một bãi củi rẻ tiền. Dạo này lúc cần thì lại chẳng bao giờ đủ tội nhân."
  ep2_wedding_ewan.0053.desc.profligate:0 "Thứ đã cháy rụi là gì, ở đâu, và bằng cách nào, vẫn bí ẩn không kém gì đề xuất ban đầu — chỉ biết rằng chẳng còn lại gì ngoài khói, tro tàn và sự hỗn loạn."
  ep2_wedding_ewan.0053.desc.journaller:0 "Dù tiền công hậu hĩnh, vẫn không thể tìm được những người chép sách có học vấn và tay nghề, sẵn sàng cặm cụi với đống nhật ký sưu tập của [dolt.GetFirstNamePossessive]. Phòng chép sách rốt cuộc chưa bao giờ thành hình."
  ep2_wedding_ewan.0053.desc.athletic:0 "Có vẻ như phần lớn những kẻ muốn rèn luyện thân thể cũng đồng thời khát khao giao đấu với những người tương tự. Sau một chuỗi những cuộc đấu tay đôi biến thành giết chóc, phòng tập đã sụp đổ trong một cuộc bạo loạn san phẳng toàn bộ công trình."
  ep2_wedding_ewan.0053.desc.outro:0 "\n\nLẽ ra ta đã phải biết là không nên tài trợ cho một kẻ ngu xuẩn đáng nguyền rủa như [dolt.GetFirstNameNoTooltip]."
  ep2_wedding_ewan.0053.a.alive:0 "Khốn kiếp, ta muốn thấy tên ngu đó bị xiềng xích!"
  ep2_wedding_ewan.0053.a.dead:0 "Đáng tiếc là [dolt.GetSheHe] đã chết rồi, không thể bóp cổ được."
  ep2_wedding_ewan.0053.b:0 "Có lẽ kết cục này vốn đã có thể đoán trước."

  ep2_wedding_ewan.0061.t:0 "Gửi Đến [oldling.Custom2('RelationToMeShort', relative )|U] Yêu Dấu Của Ta!"
  ep2_wedding_ewan.0061.desc.intro:0 "Bất chấp không khí lễ hội, vẻ mặt kinh hoàng thuần túy nhanh chóng hiện rõ trên khuôn mặt [relative.GetTitledFirstName] khi [relative.GetHerHis] [relative.Custom2('RelationToMeShort', oldling )], [oldling.GetTitledFirstName], run rẩy đứng dậy — tay vẫn cầm chén rượu.\n\n"
  ep2_wedding_ewan.0061.desc.arrogant:0 "Vốn nổi tiếng là kẻ huênh hoang và khoác lác, [oldling.GetFirstNameNoTooltip] bắt đầu lao vào một bài diễn thuyết dài dòng về vai trò mà [oldling.GetSheHe] đã đóng trong quá trình trưởng thành của [relative.Custom('GetBrideGroom')], đầy ắp những giai thoại tuổi thơ đáng xấu hổ và những câu đùa gượng gạo."
  ep2_wedding_ewan.0061.desc.honest:0 "Most would consider [oldling.GetFirstNamePossessiveNoTooltip] reputation for honesty a blessing, but here it proves... misguided, with the good-willed old [oldling.GetWomanMan] whistfully telling the most embarrassing stories from the [relative.Custom('GetBrideGroom')]'s childhood."
  ep2_wedding_ewan.0061.desc.deceitful:0 "Vốn là kẻ thích thêu dệt ngay cả lúc tốt đẹp nhất, bài phát biểu của [oldling.GetFirstNamePossessiveNoTooltip] về tuổi thơ của [relative.Custom('GetBrideGroom')] — nói giảm nói tránh — là #EMP tai tiếng#! đến mức sai sự thật. Đặc biệt là vụ con lừa, hoàn toàn không cần thiết."
  ep2_wedding_ewan.0061.desc.gregarious:0 "Partial to a party in [oldling.GetHerHis] youth, [oldling.GetFirstNamePossessiveNoTooltip] speech is a near-bottomless list of interconnected, meandering anecdotes, with only the most embarrassing relating back to the [relative.Custom('GetBrideGroom')]."
  ep2_wedding_ewan.0061.desc.ambitious:0 "Always marked by [oldling.GetHerHis] drive and ambition, [oldling.GetFirstNamePossessiveNoTooltip] speech makes sure to give [oldling.GetHerselfHimself] ample credit for the successful upbringing that brought the [relative.Custom('GetBrideGroom')] to this point, in spite of an awkward (and apparently acne-ridden) childhood."
  ep2_wedding_ewan.0061.desc.diplomat:0 "Known for [oldling.GetHerHis] silvered tongue, [oldling.GetFirstNameNoTooltip] apparently cannot resist the chance to recount the story of the [relative.Custom('GetBrideGroom')]'s early life, and the many lessons [oldling.GetSheHe] tried to teach [relative.GetHerHim]. Generally unsuccessfully, according to [oldling.GetHerHim]."
  ep2_wedding_ewan.0061.desc.poet:0 "In a fate worse than death for the wider audience, it appears [oldling.GetFirstNameNoTooltip] has [oldling.GetHerselfHimself] penned a long, stilted poem concerning the [relative.Custom('GetBrideGroom')]'s most... endearingly awkward childhood moments."
  ep2_wedding_ewan.0061.desc.sadistic:0 "Với sự ác ý thuần túy hiện rõ trên [oldling.Custom('MaskFace_BehindAcross')] [oldling.GetHerHis] [oldling.Custom('MaskFace')], [oldling.GetFirstNameNoTooltip] bắt đầu một bản tường thuật #EMP đau đớn đến tột cùng#! về tuổi thơ của [relative.Custom('GetBrideGroom')]. Các giai thoại cá nhân thì nhiều vô kể — và thẳng thừng."
  ep2_wedding_ewan.0061.desc.drunkard:0 "Staggering where [oldling.GetSheHe] stands, [oldling.GetFirstNameNoTooltip] begins slurring out [oldling.GetHerHis] blurry recollection of the [relative.Custom('GetBrideGroom')]'s childhood. The impressions are a bit much, but certainly lend life to the performance."
  ep2_wedding_ewan.0061.desc.hashishiyah:0 "Trong một khoảnh khắc ngượng ngùng, [oldling.GetFirstNameNoTooltip] dường như quên mất lý do vì sao [oldling.GetSheHe] đứng dậy, chớp mắt qua đôi mắt đỏ ngầu. Rồi bỗng nhiên có điều gì đó khớp lại, và một câu chuyện tuổi thơ của [relative.Custom('GetBrideGroom')] với ít nhất một nửa là tiếng cười khúc khích bắt đầu."
  ep2_wedding_ewan.0061.desc.skill.diplomacy:0 "Luôn giỏi ăn nói, [oldling.GetFirstNameNoTooltip] rõ ràng đã mong chờ khoảnh khắc này từ lâu: bài phát biểu của [oldling.GetHerHis] nhanh chóng trượt thành một phép ẩn dụ cầu kỳ cho cuộc đời của [relative.Custom('GetBrideGroom')], có lẽ hơi kém duyên trong sự bảo ban mang tính trịch thượng."
  ep2_wedding_ewan.0061.desc.skill.learning:0 "Là một [relative.GetWomanMan] uyên bác, bài phát biểu của [oldling.GetFirstNamePossessiveNoTooltip] là một mớ hỗn độn các ám chỉ văn chương và những trò đùa triết học cao siêu, chỉ thỉnh thoảng mới dừng lại để xen vào những giai thoại tuổi thơ đáng xấu hổ của [relative.Custom('GetBrideGroom')]."
  ep2_wedding_ewan.0061.desc.old:0 "Not exactly spry for [oldling.GetHerHis] age, [oldling.GetFirstNamePossessiveNoTooltip] speech is a rambling slurry of the [relative.Custom('GetBrideGroom')]'s most humiliatingly-endearing childhood moments and how much better things #EMP used#! to be back then."
  ep2_wedding_ewan.0061.desc.very_old:0 "Một [oldling.GetWomanMan] già nua đến mức già cỗi, [oldling.GetFirstNameNoTooltip] sở hữu cả một #EMP kho#! giai thoại về [relative.Custom('GetBrideGroom')] để lôi ra. Và đó gần như chính xác là những gì [oldling.GetSheHe] làm. Chẳng có mạch liên kết nào rõ ràng — chỉ là một cơn lũ ký ức tuổi thơ và trò đùa nội bộ của gia đình."
  ep2_wedding_ewan.0061.desc.outro:0 "\n\n[relative.GetFirstNameNoTooltip] trông như thể [relative.GetSheHe] chỉ muốn chết quách đi cho rồi."
  ep2_wedding_ewan.0061.a:0 ""Cảm ơn ngài/bà, [oldling.GetFirstNameNoTooltip], vì bài phát biểu #EMP tuyệt vời#! ấy...""
  ep2_wedding_ewan.0061.b:0 "Lịch sự bắt đầu vỗ tay để ngăn [oldling.GetHerHim]."
  ep2_wedding_ewan.0061.b.tt.success:0 "Ngài ép [oldling.GetFirstNameNoTooltip] ngồi xuống"
  ep2_wedding_ewan.0061.b.tt.failure:0 "[oldling.GetSheHe|U] vẫn tiếp tục bất chấp tất cả"
  ep2_wedding_ewan.0061.c:0 "Cười gượng và chịu đựng."
  ep2_wedding_ewan.0061.d:0 "Hò reo cổ vũ cho nhiều hơn nữa."
  ep2_wedding_ewan.0061.d.tt.crit_success:0 "[oldling.GetFirstNameNoTooltip] bắt đầu một câu chuyện #EMP dài#!"
  ep2_wedding_ewan.0061.d.tt.success:0 "[oldling.GetFirstNameNoTooltip] phấn chấn hẳn lên"
  ep2_wedding_ewan.0061.e:0 "Thúc giục [oldling.GetFirstNameNoTooltip] tiếp tục"
  ep2_wedding_ewan.0061.e.tt.crit_success:0 "$ep2_wedding_ewan.0061.d.tt.crit_success$"
  ep2_wedding_ewan.0061.e.tt.success:0 "$ep2_wedding_ewan.0061.d.tt.success$"
  ep2_wedding_ewan.0061.e.tt.failure:0 "[oldling.GetFirstNameNoTooltip] lảo đảo nói thêm vài phút"
  ep2_wedding_ewan.0061.f:0 "Ngừng chú ý lắng nghe"

  ep2_wedding_ewan.0071.t:0 "Lời Thề Chớp Nhoáng"
  ep2_wedding_ewan.0071.desc:0 ""[ROOT.Char.GetFirstNameNoTooltip]," chúa thượng của ta — [liege.GetTitledFirstName] — trầm ngâm, "ta vẫn luôn khá là quý mến ngươi. Ngươi cố gắng hết sức để làm ta hài lòng, và danh tiếng của ngươi trải rộng khắp [liege.GetPrimaryTitle.GetNameNoTier] như tán cây rợp bóng".\n\nTa gật đầu, cho rằng [liege.GetWomanMan] có lẽ đã hơi quá chén giữa tiệc mừng khi [liege.GetSheHe] cứ thao thao bất tuyệt.\n\n"Ta có một đề nghị — ngươi thích làm vừa lòng ta, còn ta thì thích được gắn liền với ngươi. Sao ngươi không lan truyền vài lời tốt đẹp về ta đến những kẻ ngưỡng mộ ngươi, đổi lại ta sẽ cho mọi người biết rằng ngươi đang nhận được sự quan tâm đặc biệt từ ta?""
  ep2_wedding_ewan.0071.a:0 "Nghe đúng là một cuộc trao đổi quá công bằng!"
  ep2_wedding_ewan.0071.b:0 "Xin cảm ơn, nhưng ta xin phép từ chối."
