l_english:

  speeches_and_games_modifier:0 "Diễn thuyết & Trò chơi"
  speeches_and_games_modifier_desc:0 "Lãnh chúa của quận này đã, bằng sự lộng lẫy và sức cuốn hút, thuần phục được đám đông hỗn loạn."

  feeble_presence_modifier:0 "Hiện diện Yếu ớt"
  feeble_presence_modifier_desc:0 "Lãnh chúa của quận này không thể hiện được bất kỳ khả năng nào trong việc kiểm soát đám đông."

  deft_cavalrymen_modifier:0 "Kỵ binh Táo bạo"
  deft_cavalrymen_modifier_desc:0 "Kỵ sĩ của nhân vật này phi ngựa quanh chiến trường với tốc độ tối đa và sự thuần thục đáng kinh ngạc."

  daring_scout_modifier:0 "Trinh sát Táo bạo"
  daring_scout_modifier_desc:0 "Nhân vật này di chuyển cùng một tay thám báo gan dạ, dò đường phía trước."

  unwilling_tourneyer_modifier:0 "Miễn cưỡng Thi đấu"
  unwilling_tourneyer_modifier_desc:1 "[contest_aptitude|E]: -10"

  generous_to_knights_modifier:0 "Hào phóng với Hiệp sĩ"
  generous_to_knights_modifier_desc:1 "[contest_aptitude|E]: +5"

  safeguards_knightly_honor_modifier:0 "Bảo vệ Danh dự Hiệp sĩ"
  safeguards_knightly_honor_modifier_desc:0 "Sự tôn trọng của nhân vật này đối với các quy tắc ràng buộc giới chiến binh quý tộc dường như không hề lay chuyển."

  tournament_bracer_modifier:0 "Ốp tay Tinh xảo"
  tournament_bracer_modifier_desc:0 "Nhân vật này đã mua một chiếc ốp tay cho cung thủ tại Giải đấu để hỗ trợ kỹ năng của mình."

  tournament_two_bracers_modifier:0 "Ốp tay Đôi"
  tournament_two_bracers_modifier_desc:0 "Nhân vật này kỳ quặc mua ốp tay cung thủ cho cả hai tay — điều mà họ kịch liệt bảo vệ — nhưng đã khiến không ít người đứng xem khúc khích cười."

  tournament_poorly_announced_modifier:0 "Công bố Kém"
  tournament_poorly_announced_modifier_desc:0 "Nhân vật này đã đầu tư vào những người xướng danh khá là tệ."

  tournament_well_proclaimed_modifier:0 "Công bố Chu đáo"
  tournament_well_proclaimed_modifier_desc:0 "Nhân vật này được hưởng lợi từ một người xướng danh được đào tạo bài bản và giàu kinh nghiệm."

  tournament_star_struck_modifier:0 "Choáng ngợp Danh tiếng"
  tournament_star_struck_modifier_desc:0 "Nhân vật này bị cuốn hút bởi sự hào nhoáng và lộng lẫy khi được diện kiến một nhân vật nổi tiếng."

  tournament_grounded_modifier:0 "Vững vàng"
  tournament_grounded_modifier_desc:0 "Nhân vật này không mấy quan tâm đến danh tiếng, và thờ ơ với những ai theo đuổi hào quang của nó."

  tournament_foreign_knight_modifier:0 "Ủng hộ Hiệp sĩ Ngoại quốc"
  tournament_foreign_knight_modifier_desc:0 "Nhân vật này đã ủng hộ một hiệp sĩ ngoại quốc ấn tượng, giành được sự kính trọng từ người ngoài nhưng cũng gây khó chịu cho một số khác."

  tournament_farrier_mistake_modifier:0 "Chiến mã bị Thợ rèn làm bị thương"
  tournament_farrier_mistake_modifier_desc:0 "Sự vụng về của một học việc đã khiến con ngựa yêu thích của nhân vật này tạm thời bị què.\n\n#weak Khả năng thi đấu Ngựa cá nhân bị giảm nhẹ.#!"

  tournament_performative_sensuousness_modifier:0 "Gợi cảm Phô diễn"
  tournament_performative_sensuousness_modifier_desc:0 "Khi đứng trước khán giả, nhân vật này có xu hướng cử động cơ thể theo một cách khá là... mê hoặc."

  tournament_ambidextrous_modifier:0 "Thuận cả Hai tay"
  tournament_ambidextrous_modifier_desc:0 "Kỹ năng sử dụng kiếm bằng cả hai tay mang lại cho nhân vật này lợi thế bất ngờ khi giao đấu."

  tournament_ambisinister_modifier:0 "Vụng cả Hai tay"
  tournament_ambisinister_modifier_desc:0 "Sự vụng về hai tay của nhân vật này đã trở nên khét tiếng."

  tournament_fashionable_duelist_modifier:0 "Đấu sĩ Thời trang"
  tournament_fashionable_duelist_modifier_desc:0 "Lựa chọn trang phục khi đấu tay đôi của nhân vật này có thể không giúp giành chiến thắng, nhưng chắc chắn là rất đẹp mắt."

  tournament_charm_resistant_modifier:0 "Kháng lại Quyến rũ"
  tournament_charm_resistant_modifier_desc:0 "Nhân vật này dường như có khả năng chống lại những mưu mô ái tình."

  tournament_child_friendly_modifier:0 "Thân thiện với Trẻ em"
  tournament_child_friendly_modifier_desc:0 "Nhân vật này có khả năng đặc biệt trong việc kết nối với trẻ nhỏ."

  tournament_soaked_modifier:0 "Ướt sũng"
  tournament_soaked_modifier_desc:0 "Nhân vật này bị ướt đẫm sau khi một người vui chơi làm đổ đồ uống lên họ, để lại một mùi khá kỳ lạ."

  tournament_public_proselytiser_modifier:0 "Thuyết giáo Công khai"
  tournament_public_proselytiser_modifier_desc:0 "Nhân vật này đã thể hiện lòng mộ đạo bằng cách thuyết giảng đám đông tại một Giải đấu."

  tournament_sports_enthusiast_modifier:0 "Người mê Thể thao"
  tournament_sports_enthusiast_modifier_desc:0 "Sự nhiệt tình với các sự kiện thể thao của nhân vật này luôn thể hiện rõ ràng."

  tournament_low_blower_modifier:0 "Đánh Hạ bộ"
  tournament_low_blower_modifier_desc:0 "Nhân vật này đã xây dựng được danh tiếng về lối chơi không công bằng trong võ đài đấu tay đôi."

  tournament_roguish_duelist_modifier:0 "Đấu sĩ Lém lỉnh"
  tournament_roguish_duelist_modifier_desc:0 "Sự duyên dáng và táo bạo của nhân vật này khi cầm kiếm vừa khiến đối thủ tức giận, vừa mê hoặc khán giả."

  tournament_ended_rightly_modifier:0 "Kết cục Xứng đáng"
  tournament_ended_rightly_modifier_desc:0 "Nhân vật này đã bị bẽ mặt trong một trận đấu tay đôi khi đối thủ làm nhục họ bằng cách ném vào một chuôi kiếm đã bị tháo rời!"

  tournament_melee_protector_modifier:0 "Người Bảo vệ Hỗn chiến"
  tournament_melee_protector_modifier_desc:0 "Lưng của nhân vật này đang được bảo vệ bởi một người khá bất ngờ.\n\n#weak Hiệu ứng này sẽ kéo dài đến khi Cuộc thi Hỗn chiến kết thúc.#!"

  tournament_house_unity_modifier:0 "Gia tộc Đoàn kết"
  tournament_house_unity_modifier_desc:0 "Gia tộc này đã chứng tỏ bản lĩnh trong hỗn chiến, khiến người khác chú ý như một hình mẫu về sự đoàn kết."

  tournament_reckoning_modifier:0 "Ngày Thanh toán"
  tournament_reckoning_modifier_desc:0 "Nhân vật này sẽ phải trả giá cho lòng tham của mình vào một thời điểm nào đó trong tương lai. Họ không biết khi nào, chỉ biết rằng điều đó sẽ xảy ra."

  tournament_loving_parent_modifier:0 "Cha/Mẹ Yêu thương"
  tournament_loving_parent_modifier_desc:0 "Nhân vật này đã chứng tỏ mình là một bậc cha mẹ đầy yêu thương — ít nhất là đối với người thừa kế của họ."

  tournament_annoyed_locals_modifier:0 "Dân địa phương Bực bội"
  tournament_annoyed_locals_modifier_desc:0 "Đám đông trong quận này đã phải nghe thuyết giáo khi họ chỉ muốn xem giải đấu."
