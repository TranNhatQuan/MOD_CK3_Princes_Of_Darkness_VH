l_english:
 # Intents
  reduce_stress_intent:1 "Giải trí"

  reduce_stress_intent_desc:0 "Ngài muốn tập trung vào việc giảm căng thẳng bằng cách tìm kiếm các cơ hội giúp giảm [stress|E]."

  murder_attendee_intent:0 "Ám sát"
  murder_attendee_intent_desc:0 "Ngài chỉ tập trung vào việc kết liễu mục tiêu của mình. Điều này thường dẫn đến các tình huống ám sát và những lựa chọn đặc biệt."

  woo_attendee_intent:0 "Quyến rũ"
  woo_attendee_intent_desc:0 "Ngài chỉ có duy nhất một mục tiêu trong đầu: quyến rũ đối tượng của mình. Điều này thường dẫn đến các sự kiện đặc biệt và những lựa chọn nhằm thỏa mãn mong muốn đó."
 
  impose_obedience_intent: "Áp đặt Sự Tuân phục"
  impose_obedience_intent_desc: "Phô trương sức mạnh là điều duy nhất trong tâm trí Ngài. Điều này thường mở ra các cơ hội để giành được [obedience|E] từ mục tiêu."

  befriend_attendee_intent:0 "Kết giao"
  befriend_attendee_intent_desc:0 "Ngài quyết tâm giành được thiện cảm của mục tiêu. Điều này thường dẫn đến các sự kiện thân thiện và những lựa chọn hòa nhã."

  lechery_intent:0 "Trụy lạc"
  lechery_intent_desc:0 "Ngài dự định buông thả những ham muốn xác thịt và tìm kiếm các cuộc ái ân với nhiều đối tác. Điều này thường giúp giảm [stress|E] cho các nhân vật có đặc điểm [GetTrait('lustful').GetName( GetNullCharacter )]."

  legitimacy_intent: "Đề cao Tính Chính danh"
  legitimacy_intent_desc: "Ngài muốn tận dụng buổi tụ họp này như một phương tiện để quảng bá [legitimacy|E] của mình."

  altruism_intent_header:0 "Vị tha:"
  altruism_intent:0 "Vị tha"
  altruism_intent_desc:1 "Ngài tìm cách cải thiện cuộc sống của người khác bằng cách tìm kiếm các cơ hội để thực hiện những hành động vị tha. Điều này thường làm tăng [county_opinion|E] và [piety|E]. Các nhân vật có đặc điểm [GetTrait('zealous').GetName( GetNullCharacter )|U], [GetTrait('generous').GetName( GetNullCharacter )], và [GetTrait('improvident').GetName( GetNullCharacter )] có thể giảm [stress|E]."

  justice_intent:0 "Công lý"
  justice_intent_desc:0 "Ngài tìm cách thực thi công lý đối với cả những tên tội phạm nhỏ nhặt nhất trong lãnh thổ của mình. Điều này thường làm tăng [control|E] và các nhân vật có đặc điểm [GetTrait('just').GetName( GetNullCharacter )] có thể giảm [stress|E]."
 
  recruit_knights_intent:0 "Chiêu mộ"
  recruit_knights_intent_desc:0 "Ngài tìm cách củng cố triều đình của mình bằng những [knights|E] mới và hùng mạnh. Điều này thường dẫn đến các cơ hội chiêu mộ."
 # TOOLTIPS
