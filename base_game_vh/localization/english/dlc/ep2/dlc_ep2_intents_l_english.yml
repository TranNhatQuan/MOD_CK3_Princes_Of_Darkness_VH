  intent_murder_dead_tt:1 "[THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Ám sát, đã chết"
  intent_murder_fail_tt:1 "Ngài không thể giết [THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Ám sát"
  intent_woo_success_tt:1 "Ngài đã quyến rũ [THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Quyến rũ"
  intent_woo_potential_tt:1 "Ngài đã khơi gợi sự quan tâm của [THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Quyến rũ"
  intent_woo_fail_tt:1 "Ngài không thể quyến rũ [THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Quyến rũ"
  intent_befriend_success_tt:1 "Ngài đã gắn kết với [THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Kết giao"
  intent_befriend_potential_tt:1 "Ngài đã dành thời gian bên [THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Kết giao"
  intent_befriend_fail_tt:1 "Ngài không thể tạo được mối gắn kết với [THIS.Char.GetIntentTarget.GetShortUIName], mục tiêu của [intent|E] Kết giao"
  activity_intent_complete_toast:1 "Hoàn thành Ý định"
