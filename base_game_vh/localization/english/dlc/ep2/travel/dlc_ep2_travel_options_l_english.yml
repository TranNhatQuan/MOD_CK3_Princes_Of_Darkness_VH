l_english:
 
  travel_walking_modifier:0 "Đi bộ"
  travel_walking_modifier_desc:0 "Ngài không có thú cưỡi và phải cuốc bộ đến điểm đến"
  travel_guide_modifier:0 "Hướng dẫn viên địa phương"
  travel_guide_modifier_desc:0 "Ngài đã thuê một hướng dẫn viên địa phương để giúp định hướng hành trình"
 temporary_travel_character_limit_tt: "and will go back to being a [wanderer|E] immediately when [travel|E] ends"
 
 # New Travel Options
  experienced_captains_option:0 "Thuê Thuyền trưởng Lão luyện"
  experienced_captains_option_desc:0 "Ngài sẽ cho người đi tìm các thuyền trưởng dày dạn kinh nghiệm gia nhập đoàn tùy tùng, giảm đáng kể mức độ nguy hiểm khi di chuyển qua biển và đại dương."
  captain_recruited.t:0 "Đã Thuê Thuyền trưởng"
  captain_recruited.tt:0 "A seafarer with the [GetTrait('forder').GetName( GetNullCharacter )] trait will join your entourage $temporary_travel_character_limit_tt$"
 
  hire_experienced_mercenaries_option:0 "Thuê Lính Đánh thuê Hộ vệ"
  hire_experienced_mercenaries_option_desc:0 "Ngài thuê những lính đánh thuê dạn dày trận mạc gia nhập đoàn tùy tùng làm hộ vệ, gia tăng mức độ an toàn và tốc độ di chuyển."
  mercenary_leader.t:0 "Đã Thuê Đội trưởng Đánh thuê"
  mercenary_leader_recruited.tt:0 "A [mercenary|E] captain will join your entourage $temporary_travel_character_limit_tt$"
  available_mercenary.tt:0 "Có một đội [mercenary|E] chưa được thuê trong phạm vi cho phép"

  hire_jungle_expert_option:0 "Thuê Thợ săn Rừng rậm"
  hire_jungle_expert_option_desc:0 "Ngài sẽ cho người đi tìm các chuyên gia địa hình rừng rậm gia nhập đoàn tùy tùng, giảm đáng kể nguy hiểm khi di chuyển qua rừng rậm."
  jungle_stalker_recruited.t:0 "Đã Thuê Thợ săn Rừng rậm"
  jungle_stalker_recruited.tt:0 "A guide with the [GetTrait('jungle_stalker').GetName( GetNullCharacter )] trait will join your entourage $temporary_travel_character_limit_tt$"

  hire_mountaineer_option:0 "Thuê Người Leo núi"
  hire_mountaineer_option_desc:0 "Ngài sẽ cho người đi tìm các chuyên gia địa hình núi cao gia nhập đoàn tùy tùng, giảm đáng kể nguy hiểm khi di chuyển qua các đỉnh núi hiểm trở."
  mountaineer_recruited.t:0 "Đã Thuê Người Leo núi"
  mountaineer_recruited.tt:0 "A guide with the [GetTrait('rough_terrain_expert').GetName( GetNullCharacter )] trait will join your entourage $temporary_travel_character_limit_tt$"

  hire_forder_option:0 "Thuê Người Lội nước"
  hire_forder_option_desc:0 "Ngài sẽ cho người đi tìm các chuyên gia địa hình đầm lầy gia nhập đoàn tùy tùng, giảm đáng kể nguy hiểm khi di chuyển qua đầm lầy và đồng bằng ngập nước."
  forder_recruited.t:0 "Đã Thuê Người Lội nước"
  forder_recruited.tt:0 "A guide with the [GetTrait('forder').GetName( GetNullCharacter )] trait will join your entourage $temporary_travel_character_limit_tt$"
  wetlands_danger_reduction.tt:0 "[travel|E] [travel_danger|E] tại các Tỉnh có địa hình đầm lầy hoặc đồng bằng ngập nước: @travel_danger_icon!#P -25#!"

  hire_rough_terrain_expert_option:0 "Thuê Hướng dẫn Rừng"
  hire_rough_terrain_expert_option_desc:0 "Ngài sẽ cho người đi tìm các chuyên gia địa hình rừng rậm gia nhập đoàn tùy tùng, giảm đáng kể nguy hiểm khi di chuyển qua rừng."
  rough_terrain_expert_recruited.t:0 "Đã Thuê Hướng dẫn Rừng"
  rough_terrain_expert_recruited.tt:0 "A guide with the [GetTrait('forest_fighter').GetName( GetNullCharacter )] trait will join your entourage $temporary_travel_character_limit_tt$"

  hire_desert_warrior_option:0 "Thuê Chiến binh Sa mạc"
  hire_desert_warrior_option_desc:0 "Ngài sẽ cho người đi tìm các chuyên gia địa hình sa mạc gia nhập đoàn tùy tùng, giảm đáng kể nguy hiểm khi di chuyển qua những vùng đất khô cằn."
  desert_warrior_recruited.t:0 "Đã Thuê Chiến binh Sa mạc"
  desert_warrior_recruited.tt:0 "A guide with the [GetTrait('desert_warrior').GetName( GetNullCharacter )] trait will join your entourage $temporary_travel_character_limit_tt$"

  court_physician_option:1 "Mang theo Trang thiết bị Y tế"
  court_physician_option_suffix: " #weak (chỉ chống lại dịch bệnh)#!"
  court_physician_option_desc:2 "Ngài mang theo một lượng lớn trang thiết bị y tế trong chuyến đi nhằm giảm [travel_danger|E] do [epidemics|E]."
  court_physician_option_tt: "Ngài phải có một [GetCourtPositionType('court_physician_court_position').GetName] đủ điều kiện tham gia hành trình"

  cultural_ambassador_option:0 "Thuê Sứ giả Văn hóa"
  cultural_ambassador_option_desc:0 "Ngài thuê một người làm Sứ giả Văn hóa trong chuyến đi để truyền bá thông tin về văn hóa của Ngài đến mọi lãnh địa mà Ngài đi qua."
  cultural_ambassador_recruited.t:0 "Đã Thuê Sứ giả Văn hóa"
  cultural_ambassador_recruited.tt:0 "A Cultural Ambassador with high [diplomacy|E] will be recruited to your entourage $temporary_travel_character_limit_tt$"

  fancy_mounts_option:0 "Thú cưỡi Thượng hạng"
  fancy_mounts_option_desc:0 "Những người chăm ngựa lão luyện của Ngài trang bị cho đoàn tùy tùng những thú cưỡi tốt nhất trong toàn cõi."
 
  military_recruits_option:0 "Huấn luyện Hiệp sĩ"
  military_recruits_option_desc:0 "Ngài mang theo những hiệp sĩ yếu nhất của mình để họ được rèn luyện và học hỏi từ những thử thách trên đường thiên lý."
  military_recruits_option.t:0 "Hiệp sĩ Gia nhập Đoàn tùy tùng"
  military_recruits_option.desc:0 "Những hiệp sĩ kém kỹ năng nhất của Ngài đã được thêm vào đoàn tùy tùng vì Ngài đã chọn tùy chọn hành trình $military_recruits_option$."
  travel_events.0060.notification.a:0 "Đặc điểm Hiệp sĩ Cải thiện: [selected_knight.GetShortUIName]"
  travel_events.0060.notification_desc:0 "Kỹ năng của [selected_knight.GetShortUINamePossessive] đã được cải thiện nhờ kinh nghiệm tích lũy trong quá trình đồng hành cùng Ngài.#"
  travel_events.0060.notification.b:0 "Hiệp sĩ #EMP Cải thiện Rõ rệt#!"
  travel_events.0060.notification.c:0 "Hiệp sĩ Cải thiện"
  travel_events.0060.notification.d:0 "Hiệp sĩ Đạt Danh vọng"

  superior_armaments_option:0 "Trang bị Thượng hạng"
  superior_armaments_option_desc:0 "Những thợ rèn bậc thầy của Ngài trang bị cho đoàn tùy tùng những khí giới và chuẩn bị tốt nhất cho chuyến hành trình."

  anxious_option:0 "Gấp rút Lên đường"
  anxious_option_desc:0 "Thế giới là nơi u ám và đầy hiểm họa; tốt nhất nên tăng tốc hành trình càng nhiều càng tốt."
  circumspect_option:0 "Thận trọng"
  circumspect_option_desc:0 "Không bao giờ để lộ bước đi tiếp theo của mình."
 
  purchase_rough_terrain_gear_option: "Mua Trang bị Dẫn đường"
  purchase_rough_terrain_gear_option_desc: "Vượt qua núi non và đầm lầy là một thử thách — với những kẻ thiếu chuẩn bị! Ngài sẽ mua móc leo, dây thừng bổ sung và đủ loại dụng cụ cần thiết để vượt qua những con đường hiểm trở nhất."
 
  purchase_desert_gear_option: "Mua Bộ Trang bị Thám hiểm Sa mạc"
  purchase_desert_gear_option_desc: "Ngài sẽ mua khăn che mặt để tránh cát và những con lạc đà khỏe mạnh nhằm hỗ trợ hành trình."
 
  purchase_forest_gear_option: "Mua Bộ Dã ngoại Hoang dã"
  purchase_forest_gear_option_desc: "Khu rừng không có chủ nhân — nhưng Ngài sẽ chế ngự nó bằng dao dài, cưa, rìu và #EMP rất nhiều#! mỡ bôi bánh xe!"
 
  adventurers_encourage_relationships_option: "Khuyến khích Gắn kết"
  adventurers_encourage_relationships_option_desc: "Những mối quan hệ bền chặt không thể ép buộc mà hình thành từ gian khó chung. Con đường có thể tàn nhẫn, nhưng mỗi thử thách vượt qua lại có thể khai sinh một mối quan hệ mới."
  adventurers_encourage_relationships_option.tt: "Các [followers|E] của Ngài có thể tự phát hình thành [friendships|E], trở thành [lovers|E] hoặc [marry|E] — với nhau hoặc với các [wanderers|E] khi Ngài [travel|E] qua các [baronies|E]. Mỗi mối quan hệ được hình thành theo cách này sẽ mang lại cho Ngài [prestige_i][prestige|E].\n#weak ([children|E], [spouses|E] hoặc những người Ngài quan tâm sẽ không [marry|E] hay có [lovers|E]. Điều này cũng không khiến [followers|E] nhận đặc điểm [GetTrait('adulterer').GetName( GetNullCharacter )].)#!"
  ep3_travel_option_events.0002.title: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_marry'))|U] của Ngài là [courtier_to_marry.GetFirstName] đã kết hôn với [marriage_material.GetFirstName]"
  ep3_travel_option_events.0003.title: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_befriend'))|U] của Ngài là [courtier_to_befriend.GetFirstName] đã kết bạn với [friend_target.GetFirstName]"
  ep3_travel_option_events.0004.title: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_love'))|U] của Ngài là [courtier_to_love.GetFirstName] và [pls_love_me.GetFirstName] đã trở thành Tình nhân"
 
  adventurers_search_for_secrets_option: "Tìm kiếm Bí mật"
  adventurers_search_for_secrets_option_desc: "Tin đồn chính là bản đồ dẫn đến kho tàng bí mật — nhưng phải có đầu óc xảo quyệt mới lần theo được chúng, X đánh dấu điểm đến!"
  adventurers_search_for_secrets_option.tt: "Khi đi qua một [barony|E], Ngài có thể biết được một [secret|E] của ai đó đang sinh sống tại đó\n#weak (Tỷ lệ % bằng [intrigue_i] của Ngài)#!"
  adventurers_search_for_secrets_option.title: "[GetTravelOption('adventurers_search_for_secrets_option').GetName] Thành công!"
 
  adventurers_proselytize_zealously_option: "Truyền đạo cho Dân địa phương"
  adventurers_proselytize_zealously_option_desc: "Ở những miền xa xôi của thế giới, họ vẫn chưa nghe về đức tin chân chính. Bổn phận thiêng liêng của chúng ta là khắc phục điều đó."
  adventurers_proselytize_zealously_option.tt: "Khi đi qua một [barony|E], Ngài có thể cải đạo một [wanderer|E] đang sinh sống tại đó sang [faith|E] của Ngài và nhận [piety_i][piety|E]\n#weak (Tỷ lệ % bằng [learning_i] của Ngài)#!"
  adventurers_proselytize_zealously_option.title: "[wanderer_to_convert.GetShortUIName] cải đạo sang [ROOT.Char.GetFaith.GetName]!"
 
  adventurers_gather_inspiration_option: "Thu thập Cảm hứng"
  adventurers_gather_inspiration_option_desc: "Trên đường đi luôn có vô vàn nguồn cảm hứng — phong cảnh tuyệt đẹp, những địa danh ấn tượng và con người đáng nhớ. Tất cả khuấy động suối nguồn tư duy!"
  adventurers_gather_inspiration_option.tt: "Khi đi qua một [barony|E], một [follower|E] ngẫu nhiên có cơ hội trở nên [inspired|E]\n#weak (Tỷ lệ % bằng một phần sáu [stewardship_i] của Ngài)#!"
  adventurers_gather_inspiration_option.title: "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_follower'))|U] của Ngài là [inspired_follower.GetFirstName] đã nhận Cảm hứng!"
  adventurers_gather_inspiration_option.effect: "[inspired_follower.GetUIName] nhận được [inspired_follower.GetCurrentInspiration.GetName] - [inspired_follower.Custom('InspirationTypeDescriptionFuturePresent')].\n\n[inspired_follower.Custom('InspiredPersonQuality')]"
 
  adventurers_make_local_deals_option: "Mặc cả Mạo hiểm"
  adventurers_make_local_deals_option_desc: "#EMP Luôn luôn#! có một thỏa thuận để đạt được. Khi người ta biết đến Ngài, họ tin tưởng Ngài và sẵn sàng mặc cả. Đáng tiếc là điều đó cũng đồng nghĩa bọn cướp biết #EMP chính xác#! nên nhắm vào ai..."
  adventurers_make_local_deals_option.tt: "Khi đi qua một [barony|E], Ngài nhận được #V 25%#! giá trị [loot|E] của Lãnh địa đó dưới dạng [gold_i][gold|E]\n#weak (chỉ nhận Vàng một lần cho mỗi Lãnh địa)#!"
 
  adventurers_scout_for_talent_option: "Tìm kiếm Nhân tài"
  adventurers_scout_for_talent_option_desc: "Trong những chuyến hành trình, Ngài sẽ gặp vô số con người từng trải — và chắc chắn có kẻ đang tìm kiếm công việc!"
  adventurers_scout_for_talent_option.tt: "Kích hoạt các Sự kiện để tuyển mộ [wanderers|E] bằng [gold_i][gold|E] nếu Ngài còn vị trí trống cho [officers|E]"
  excellent.aptitude_tt: "[local_character.GetUINamePossessive] có [aptitude|E] ở mức $aptitude_excellent$"
  good.aptitude_tt: "[local_character.GetUINamePossessive] có [aptitude|E] ở mức $aptitude_good$"
  average.aptitude_tt: "[local_character.GetUINamePossessive] có [aptitude|E] ở mức $aptitude_average$"
  poor.aptitude_tt: "[local_character.GetUINamePossessive] có [aptitude|E] ở mức $aptitude_poor$"
  terrible.aptitude_tt: "[local_character.GetUINamePossessive] có [aptitude|E] ở mức $aptitude_terrible$"
  ep3_travel_option_events.0001.t: "$adventurers_scout_for_talent_option$: Người Theo chân Tự nguyện"
  ep3_travel_option_events.0001.intro: "Ta bắt gặp một [local_character.GetWomanMan] khi đi qua [location.GetTitle.GetNameNoTier]. [local_character.GetSheHe|U] trông [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('local_character'))] và [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('local_character'))] khi ta tiến lại gần.\n\n"
 
  ep3_travel_option_events.0001.court_physician_court_position: ""[local_character.GetFaith.HighGodName|U] phù hộ cho ngài, Ta là [local_character.GetFullName] — thầy thuốc và dược sư của [location.GetNameNoTooltip]. Dân địa phương tìm đến Ta để chữa trị đủ thứ: gãy xương, phát ban, thậm chí còn đỡ đẻ. Niềm đam mê y học và thể dịch khiến Ta khao khát được lang bạt."\n\n"
  ep3_travel_option_events.0001.bodyguard_court_position: ""Chào nhé, Ta là [local_character.GetFullName]. Ta biết cách dạy người khác một bài học. Mà Ta làm chuyện đó rất giỏi đấy. Tối qua Ta hạ gục tên quản chuồng chỉ với một cú đấm trong cuộc ẩu đả."\n\n"
  ep3_travel_option_events.0001.travel_leader_court_position: ""Này! Ngài bị lạc sao, lữ khách? Ta là [local_character.GetFullName], Ta rành rõ vùng đất này. Mỗi ngày Ta lùa cừu qua những [location.Custom('GetTerrainTypePlural')] tuyệt đẹp này, nhưng trái tim Ta thuộc về những con đường xa. Trở thành người dẫn lối — đó là giấc mơ của Ta."\n\n"
  ep3_travel_option_events.0001.second_camp_officer: ""Xin chào, Ta là [local_character.GetFullName]. Ta đã giám sát việc bốc dỡ xe hàng tại chợ [location.GetNameNoTooltip] suốt nhiều năm. Ta từng tổ chức hàng chục nông phu ở các cối xay địa phương. Phải, còn việc gì Ta chưa từng làm chứ..."\n\n"
  ep3_travel_option_events.0001.quartermaster_camp_officer: ""Ta đã quản lý kho lương của [location.GetNameNoTooltip] một cách tỉ mỉ, ghi chép từng quả táo, củ hành và bao ngũ cốc. Nhưng ở lại đây khiến Ta chán ngán."\n\n"
  ep3_travel_option_events.0001.armorer_camp_officer: ""Ta làm việc tại lò rèn, sửa áo giáp xích và giáp tấm cho đồn trú [location.GetNameNoTooltip]. Công việc thì không bao giờ thiếu, nhưng tiếng gọi của con đường đã vang lên từ lâu."\n\n"
  ep3_travel_option_events.0001.chief_forager_camp_officer: ""Ta là [local_character.GetFullName] — mỗi ngày Ta lang thang trong [location.Custom('GetTerrainTypePlural')], tìm kiếm [location.Custom('GetProvinceFoliageDesc')] và [location.Custom('GetProvinceGroundDesc')] để đào [local_character.Custom('RegionalRootVegetablePlural')] và trứng [local_character.Custom('GetRandomRegionalWildDaytimeBird')]. Ta mang chiến lợi phẩm ra chợ [location.GetNameNoTooltip] bán cho lữ khách."\n\n"
  ep3_travel_option_events.0001.master_thief_camp_officer: ""Cẩn thận túi tiền của ngài đấy, khu này lắm móc túi. Dĩ nhiên, Ta sẽ không bao giờ trộm của người như ngài đâu... đầu óc Ta tinh ranh hơn thế, và Ta muốn nhắm đến những kho báu ở phương xa."\n\n"
  ep3_travel_option_events.0001.head_porter_camp_officer: ""Xin chào, Ta là [local_character.GetFullName], một phu khuân vác — Ta thường nói đùa rằng mình cõng cả [location.GetNameNoTooltip] trên lưng, ha ha! Ta đóng gói và vận chuyển đủ loại hàng hóa: đồ gốm, lương thực, vũ khí, ngài muốn gì cũng có."\n\n"
  ep3_travel_option_events.0001.head_groom_camp_officer: ""[local_character.GetFaith.HighGodName|U] phù hộ, Ta là [local_character.GetFullName], người chăm ngựa tại [location.GetNameNoTooltip]. Ta chăm sóc hàng chục con vật, đỡ đẻ cho ngựa non và sửa chữa yên cương cũ kỹ."\n\n"
  ep3_travel_option_events.0001.huntperson_camp_officer: ""Hân hạnh gặp ngài — Ta là thợ săn [local_character.GetWomanMan], tên Ta là [local_character.GetFullName], và những [location.Custom('GetTerrainTypePlural')] của [location.GetNameNoTooltip] là nơi Ta săn bắn. [location.Custom('TerrainTypeProvince')] là nhà của vô số con mồi: [local_character.Custom('GetRegionalDeerType')], [local_character.Custom('GetRandomRegionalSmallGame')] và [local_character.Custom('GetRandomRegionalWildDaytimeBird')] đều không thoát."\n\n"
  ep3_travel_option_events.0001.kennelperson_camp_officer: ""Hello, I am [local_character.GetFullName], I run the kennel here in [location.GetNameNoTooltip]. Mans best friends I call them; my dogs, my [local_character.Custom('ComplimentAdjective')] pups. I train them, keep them, prepare them for the hunt — loyal companions like no other, I promise!"\n\n"
  ep3_travel_option_events.0001.chief_engineer_camp_officer: ""Ta đã xây máy bắn đá trong xưởng của [location.GetNameNoTooltip], làm việc ngày đêm suốt nhiều tháng! Vác gỗ, siết lò xo, đóng bánh răng... giờ đây Ta khao khát được lên đường."\n\n"
  ep3_travel_option_events.0001.witness_camp_officer: ""Ah, I can see how great you are! How great your camp is! This place, [location.GetNameNoTooltip], it used to be good — no more, I want out. You are obviously [ROOT.Char.Custom('ComplimentAdjective')], [ROOT.Char.Custom( 'RomanticComplimentAdjective')], a true [ROOT.Char.Custom('RomanticComplimentNoun')]!"\n\n"
  ep3_travel_option_events.0001.person_haggler_camp_officer: ""Ta là [local_character.GetFullName], cai ngục — Ta làm việc trong nhà giam của [location.GetNameNoTooltip]. Ta mặc cả tiền chuộc cho tù nhân, rồi cho họ ăn uống, tắm rửa, ăn mặc và áp giải khi tiền được trả."\n\n"
  ep3_travel_option_events.0001.camp_cook_camp_officer: ""Xin chào [ROOT.Char.Custom('RomanticComplimentNoun')], ngài đói chưa? Ta là đầu bếp, làm việc tại quán rượu địa phương. Ngài không tưởng tượng được Ta có thể làm gì với [local_character.Custom('RegionalRootVegetablePlural')] và [local_character.Custom('GetRandomRegionalSmallGame')] đâu! Nhưng ôi, Ta rất muốn được nấu với những nguyên liệu kỳ lạ hơn..."\n\n"
  ep3_travel_option_events.0001.master_bard_camp_officer: ""Xin chào, Ta là [local_character.Custom('ComplimentAdjective')] [local_character.GetFullName]! Ta chơi nhạc và ca hát tại các quán rượu, nhưng khát vọng lang bạt tràn ngập tim Ta! Ta cần rời khỏi nơi này, để âm nhạc của mình được cả thế giới lắng nghe!"\n\n"
  ep3_travel_option_events.0001.stooge_camp_officer: ""Ta mệt mỏi vì bị đá như chó! Không ai tôn trọng Ta ở đây, ai cũng cười nhạo khi cái tên '[local_character.GetFullName]' được nhắc đến, lũ ngu xuẩn! [local_character.Custom2('InsultNoun', ROOT.Char)|U]! [ROOT.Char.Custom2('InsultNoun', ROOT.Char)|U]! #EMP Aaaa, Ta tức điên lên — Ta phải rời khỏi đây!#!"\n\n"
  ep3_travel_option_events.0001.master_of_arms_camp_officer: ""Nghiêm! Ta là [local_character.GetFullName], đội trưởng cận vệ tại đồn trú [location.GetNameNoTooltip]. Ta rèn giũa đám lính trẻ và sắp xếp ca trực. Ai cũng trông cậy vào Ta để biết phải làm gì."\n\n"
  ep3_travel_option_events.0001.light_cavalry_captain_camp_officer: ""[local_character.GetFaith.HighGodName|U] phù hộ, Ta là [local_character.GetFullName]. Ta là trinh sát, sứ giả và kỵ binh tiền tiêu — trái tim Ta thuộc về hoang dã, xa rời bụi bặm thành thị."\n\n"
  ep3_travel_option_events.0001.camelry_captain_camp_officer: ""Lạc đà là sinh mệnh của Ta. Ta đã cưỡi chúng vào vô số trận chiến, không ai cản nổi '[local_character.GetFullNamePossessive] Lạc đà Chinh phạt'. Ta muốn nhìn lại thế giới, Ta muốn chinh phạt lần nữa!"\n\n"
  ep3_travel_option_events.0001.elephantry_captain_camp_officer: ""Xin chào, Ta là [local_character.GetFullName]. Ta chăm sóc những sinh vật khổng lồ mà ta gọi là voi, chải chuốt và cho chúng ăn. Không có cú xung phong nào chết chóc bằng của những gã khổng lồ có ngà này."\n\n"
  ep3_travel_option_events.0001.heavy_cavalry_captain_camp_officer: ""Ta là [local_character.GetFullName], từng phục vụ như một [local_character.Custom('KnightCultureNoTooltipLowercase')] trong đội cận vệ của [location.GetNameNoTooltip], khoác giáp nặng và cưỡi chiến mã bọc giáp, Ta đã lao vào vô số kẻ thù của lãnh địa."\n\n"
  ep3_travel_option_events.0001.horse_archer_captain_camp_officer: ""Ta là [local_character.GetFullName], từ khi còn bé Ta đã sống trên lưng ngựa. [local_character.GetFaith.HighGodName|U] ban cho Ta kỹ năng, sức bền và ý chí. Ta chỉ cần một cây cung và một con ngựa."\n\n"
  ep3_travel_option_events.0001.archer_captain_camp_officer: ""Xin chào, Ta là [local_character.GetFullName] lính gác, Ta quan sát những [location.Custom('GetTerrainTypePlural')] của [location.GetNameNoTooltip] từ đỉnh tháp. Nếu cướp đến, cây cung của Ta sẽ lên tiếng. Nhưng Ta chán cuộc sống tĩnh tại này — Ta muốn đi xa hơn bất kỳ mũi tên nào của mình!"\n\n"
  ep3_travel_option_events.0001.heavy_infantry_captain_camp_officer: ""Xin chào, Ta là [local_character.GetFullName]. Ta mặc giáp nặng và cầm khiên phục vụ đồn trú [location.GetNameNoTooltip]. Làm việc này nhiều năm rồi, nhưng mũi tên lần trước suýt kết liễu Ta, khiến Ta nghĩ rằng cuộc sống còn nhiều điều hơn thế."\n\n"
  ep3_travel_option_events.0001.light_infantry_captain_camp_officer: ""Ta là [local_character.GetFullName], một binh sĩ trong đồn trú [location.GetNameNoTooltip]. Đánh nhanh rút gọn, ném lao, cầm khiên nhỏ và dao găm — rồi kết liễu. Ta đã phục vụ đủ lâu, thế giới ngoài kia còn nhiều điều chờ đợi."\n\n"
  ep3_travel_option_events.0001.pike_captain_camp_officer: ""Ta đã phục vụ với tư cách lính giáo trong đồn trú [location.GetNameNoTooltip] suốt nhiều năm. Ta biết cách mọi thứ vận hành — đào công sự, đối mặt kẻ thù và chờ đợi đòn xung phong với ý chí thép."\n\n"
  ep3_travel_option_events.0001.master_of_spoils_camp_officer: ""Xin chào, Ta là [local_character.GetFullName]. Ta mệt mỏi vì phải cướp bóc một mình trên đường, vàng chẳng có ý nghĩa nếu không có ai để chia sẻ... còn ngài và đoàn của ngài trông thật cứng cỏi."\n\n"
  ep3_travel_option_events.0001.fallback: ""Xin chào, Ta là [local_character.GetFullName]. Ta đã chán việc lang thang một mình trên vùng đất này. Ta từng làm đủ nghề lặt vặt, nhưng giờ Ta không muốn tiếp tục nữa."\n\n"
 
  ep3_travel_option_events.0001.excellent: ""Ta là bậc thầy trong nghề của mình." [local_character.GetSheHe|U] nói đầy quả quyết. "Có Ta bên cạnh, ngài sẽ bất khả chiến bại.""
  ep3_travel_option_events.0001.good: ""Kỹ năng của Ta sẽ phục vụ ngài rất tốt." [local_character.GetSheHe|U] nói tiếp. "Chúng ta bàn chuyện thù lao chứ?""
  ep3_travel_option_events.0001.average: ""Ta sẵn sàng gia nhập doanh trại của ngài." [local_character.GetSheHe|U] nói. "Chỉ cần vài đồng xu là đủ để lôi Ta khỏi nơi này.""
  ep3_travel_option_events.0001.poor: ""Ta không phải kẻ giỏi nhất, nhưng Ta sẵn lòng." [local_character.GetSheHe|U] nói. "Chỉ với vài đồng vàng, Ta sẽ theo ngài.""
  ep3_travel_option_events.0001.terrible: ""Xin hãy thương xót kẻ vô dụng đáng thương này!" [local_character.GetSheHe|U] van nài. "Ta sẽ làm mọi thứ chỉ vì một đồng xu — thậm chí dọn nhà xí với một #EMP nụ cười#!.""
  ep3_travel_option_events.0001.a: "Ta sẵn sàng trả tiền để ngươi gia nhập doanh trại của ta!"
  ep3_travel_option_events.0001.provisions: "Ta chỉ có thể trả bằng lương thực và quần áo."
  ep3_travel_option_events.0001.b: "Biến đi, đồ vô dụng [local_character.Custom2('InsultNoun', ROOT.Char)]."
 
  estate_mounts_option: "Chiến mã Lộng lẫy"
  estate_mounts_option_desc: "Ngài trang bị cho toàn bộ đoàn tùy tùng những con ngựa lộng lẫy nhất mà tiền có thể mua được. Thậm chí còn xuất phát từ chính chuồng ngựa của Ngài!"

  hire_allied_mercenaries_option: "Đạo quân Riêng"
  hire_allied_mercenaries_option_desc: "Một nhóm pha trộn giữa các hiệp sĩ cấp thấp và lính đánh thuê địa phương, đảm bảo hành trình nhanh chóng, an toàn mà vẫn hợp túi tiền."

  appeasement_option: "Xoa dịu"
  appeasement_option_desc: "Đôi khi người ta phải khoác lên mình bộ mặt nhân từ, che giấu sự hà khắc bằng vẻ quyến rũ vương giả để xoa dịu chư hầu và thần dân."

  leisurely_option: "Hành trình Thư thả"
  leisurely_option_desc: "Trong chuyến đi, Ngài dành thời gian ghé thăm và khám phá những thị trấn, làng mạc nhỏ, tạo mối liên kết với dân địa phương."
  leisurely_option_tt: "Nhận [prestige_experience|E] cho mỗi [holding|E] đã ghé thăm"
  leisurely_option_effect: "$leisurely_option$"
 
  tutor_child_option: "Chuyến đi Dạy dỗ"
  tutor_child_option_desc: "Mang người thừa kế theo trong các chuyến hành trình khắp lãnh địa sẽ giúp họ học hỏi cuộc sống của một người cai trị."
  tutor_child_option_tt: "Trẻ em đi cùng Ngài tới các [holdings|E] trong [domain|E] của Ngài sẽ có thể tăng kỹ năng"
  child_brought_along.tt: "Người [heir|E] của Ngài sẽ được đưa vào đoàn tùy tùng."
  child_brought_along_specific.tt: "Người thừa kế của Ngài, [tutored_heir.GetName], sẽ được đưa vào đoàn tùy tùng."
  heir_can_join_tt: "[heir_for_tooltip.GetName] sẵn sàng gia nhập đoàn tùy tùng"
  no_heir_tt: "[heir|E] sẵn sàng gia nhập đoàn tùy tùng"
