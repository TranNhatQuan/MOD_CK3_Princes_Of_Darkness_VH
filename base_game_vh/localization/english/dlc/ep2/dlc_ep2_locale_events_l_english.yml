 # MODIFIERS
  tournament_wicked_hangover_modifier:0 "Say xỉn nặng"
  tournament_wicked_hangover_modifier_desc:0 "Nhân vật này đã quá chén vào đêm trước khi tham gia một cuộc thi."
  tournament_tailor_fancy_crest_modifier:0 "Huy hiệu tinh xảo"
  tournament_tailor_fancy_crest_modifier_desc:0 "Nhân vật này sở hữu một huy hiệu gia tộc tinh xảo và luôn mang theo bên mình."
  tournament_tailor_mixup_scheme_modifier:0 "Nhận dạng sai lầm"
  tournament_tailor_mixup_scheme_modifier_desc:0 "Nhân vật này sở hữu huy hiệu của một gia tộc khác, tạo cơ hội lớn để đánh lạc hướng."
  tournament_armorer_shield_modifier:0 "Khiên hảo hạng"
  tournament_armorer_shield_modifier_desc:1 "Nhân vật này được tặng một chiếc khiên trưng bày chất lượng cao, mua từ thợ rèn giải đấu."
  tournament_armorer_tournament_modifier:1 "Mũ đấu giải"
  tournament_armorer_tournament_modifier_desc:1 "Nhân vật này được tặng một chiếc mũ thi đấu chất lượng cao, mua từ thợ rèn giải đấu."
  tournament_tailor_banner_modifier:0 "Cờ hiệu đẹp"
  tournament_tailor_banner_modifier_desc:1 "Nhân vật này được tặng một lá cờ hiệu tuyệt đẹp, mua từ thợ may giải đấu."
  tournament_tailor_gambeson_modifier:0 "Áo gambeson hảo hạng"
  tournament_tailor_gambeson_modifier_desc:1 "Nhân vật này được tặng một chiếc gambeson chắc chắn, mua từ thợ may giải đấu."
  tournament_tailor_glove_modifier:0 "Găng tay hảo hạng"
  tournament_tailor_glove_modifier_desc:1 "Nhân vật này được tặng một đôi găng tay tinh xảo, mua từ thợ may giải đấu."
  tournament_weaponsmith_ornament_modifier:0 "Vũ khí trang trí"
  tournament_weaponsmith_ornament_modifier_desc:1 "Nhân vật này được tặng một vũ khí trưng bày trang trí chất lượng cao, mua từ thợ rèn giải đấu."
  tournament_bowyer_quiver_modifier:0 "Ống tên hảo hạng"
  tournament_bowyer_quiver_modifier_desc:1 "Nhân vật này được tặng một ống tên chất lượng cao, mua từ thợ làm cung tại giải đấu."
  tournament_bowyer_hunt_modifier:0 "Tên săn bắn hảo hạng"
  tournament_bowyer_hunt_modifier_desc:1 "Nhân vật này được tặng một số mũi tên săn bắn chất lượng cao, mua từ thợ làm cung tại giải đấu."
  tournament_kept_the_peace_modifier:0 "Giữ gìn hòa khí"
  tournament_kept_the_peace_modifier_desc:0 "Khả năng ăn nói khéo léo của nhân vật này đã xoa dịu một cuộc đối đầu căng thẳng."

  tournament_man_of_the_people_modifier:0 " Bạn củadân chúng"
  tournament_man_of_the_people_modifier_desc:0 "Nhân vật này vui vẻ giao lưu với tầng lớp bình dân."
  tournament_snob_modifier:1 "Kẻ khinh người"
  tournament_snob_modifier_desc:0 "Nhân vật này từ chối dành thời gian cho những kẻ bị coi là thấp kém hơn địa vị của mình."

  tournament_dice_player_modifier:0 "Con bạc xúc xắc"
  tournament_dice_player_modifier_desc:0 "Nhân vật này đã tham gia một ván xúc xắc ăn thua lớn tại quán rượu."
  tournament_lecherous_knight_modifier:0 "Chiến binh dâm đãng"
  tournament_lecherous_knight_modifier_desc:0 "Nhân vật này phát hiện các hiệp sĩ của mình đang vui vẻ ái ân với những người hành nghề kín đáo và quyết định tham gia."
  tournament_lecherous_knight_positive_modifier:0 "Chiến binh dâm đãng"
  tournament_lecherous_knight_positive_modifier_desc:1 "Nhân vật này phát hiện các hiệp sĩ của mình đang vui vẻ ái ân với những người hành nghề kín đáo và quyết định tham gia, với sự tán thành của các [ROOT.Char.GetFaith.PriestNeuterPlural]."
 
