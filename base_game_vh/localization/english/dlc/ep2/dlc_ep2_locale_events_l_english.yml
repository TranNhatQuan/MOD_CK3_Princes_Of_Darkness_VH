l_english:
 # TAVERN
  ep2_locale_events.1000.t:0 "$tournament_locale_tavern$: Thêm Một Vòng Nữa"
  ep2_locale_events.1000.independent:0 "Một tràng cười lớn bùng lên từ bàn của [drinking_leader.GetTitledFirstNamePossessive] ở góc quán rượu."
  ep2_locale_events.1000.liege:0 "Một tràng cười vang dội từ góc quán, nơi [drinking_leader.GetTitledFirstName], [drinking_leader.GetLiege.GetTitledFirstNamePossessive] [drinking_leader.GetLiege.Custom2('RelationToMeShort', drinking_leader)], đang ngồi."
  ep2_locale_events.1000.alcohol:0 "\n\n[drinking_leader.GetSheHe|U] được bao quanh bởi một nhóm Bạn Bè và những người quen mới — các thí sinh khác trong cuộc thi [activity.GetCurrentPhase.GetPhase.GetName] sắp tới — tất cả vừa thưởng thức [host.Custom('RegionalAlcoholicDrink')] vừa trao đổi những câu chuyện.\n\nKhi Ngài đi ngang qua, Ngài không khỏi cân nhắc việc khuyến khích buổi tụ họp nhỏ này..."
  ep2_locale_events.1000.a:0 "Chủ quán, mang thêm rượu qua đây!"
  ep2_locale_events.1000.b:0 "Bàn này để Ta trả!"
  ep2_locale_events.1000.c:0 "Ta nghĩ bọn họ uống đủ rồi."
  ep2_locale_events.1000.d:0 "Chúc anh một buổi tối vui vẻ, [drinking_leader.GetFirstNameNoTooltip]!"
  drinks_round_tt:0 "Mỗi người uống rượu"
  ep2_locale_events.1000.hangover_tt:0 "Không bao giờ nữa..."

  ep2_locale_events.1002.t:1 "$tournament_locale_tavern$: Dám Uống Không?"
  ep2_locale_events.1002.desc:0 "The local pub is rammed with bodies, as is expected when a Tournament rolls into town. Amongst all the newcomers, though, there sits a [local_drunk.GetWomanMan] who clearly is a fixture at the establishment. [local_drunk.GetSheHe|U] eyes me with suspicion as I sit down.\n\n"What are #EMP you#! doing here?" [local_drunk.GetSheHe|U] finally blurts out as my drink arrives. I turn to face [local_drunk.GetHerHim]; [local_drunk.GetSheHe] rises unsteadily to [local_drunk.GetHerHis] feet.\n\n"Forgive my presumptions, #EMP my [ROOT.Char.GetLadyLord]#!," — A flourishing, scornful bow punctuates the statement — "but I reckon you couldn't handle half of that, let alone all of it!""
  ep2_locale_events.1002.a:0 "Nào nào, đâu cần thù địch vậy. Ta mời ngươi một ly?"
  ep2_locale_events.1002.b:0 "Ồ thật sao? #EMP Mang hết mấy vại rượu ra đây!#!"
  ep2_locale_events.1002.b.success:0 "Ngài uống gục [local_drunk.GetFirstNameNoTooltip] dưới gầm bàn"
  ep2_locale_events.1002.b.failure:0 "Ngài tỉnh dậy vài giờ sau, đầu óc choáng váng với cơn đau đầu dữ dội"
  ep2_locale_events.1002.c:0 "Ngồi xuống và im miệng đi, đồ say rượu vô dụng."

  ep2_locale_events.1010.t:0 "$tournament_locale_tavern$: Muốn Chơi Một Ván Không?"
  ep2_locale_events.1010.desc:0 "Bầu không khí u ám của quán rượu được xua tan bởi tiếng lửa lách tách và sự huyên náo không dứt của đám chè chén. Ta lách qua hai kẻ say đặc biệt ồn ào rồi ngồi xuống một chiếc bàn gần đó, trống trơn ngoại trừ một người.\n\n\"Một đêm đẹp, phải không?\" [gambler.GetFirstName] ra hiệu về phía đám đông lộn xộn. Ta lịch sự gật đầu. Ta vừa kịp ngẩng đầu trở lại thì [gambler.GetFirstNameNoTooltip] đã nhanh tay đặt một bộ xúc xắc và những chiếc cốc lên bàn.\n\n\"Muốn chơi một trò đơn giản không? Đến kẻ ngốc cũng chơi được! Cả hai ta lắc xúc xắc dưới cốc, rồi ngươi đoán xem số của mình cao hay thấp hơn ta.\" [gambler.GetSheHe|U] mỉm cười, ánh lên tia sắc sảo của một con bạc trong mắt [gambler.GetHerHis]. \"Ba ván thắng hai.\""
 #ep2_locale_events.1010.a: "But how can I trust your dice?"
 #ep2_locale_events.1010.a.tt: "Let's use my set. My very fair and non-weighted set."
  ep2_locale_events.1010.b:0 "Đưa xúc xắc đây!"
  ep2_locale_events.1010.c:0 "Ta không phải dân cờ bạc."

  ep2_locale_events.1011.t:0 "$tournament_locale_tavern$: Lần Lắc Đầu Tiên"
  ep2_locale_events.1011.opening:0 "Xúc xắc kêu lách cách và nảy lên trong cốc trước khi cả hai chúng Ta cùng úp mạnh xuống bàn. Ta nhấc nhẹ mép cốc gần mình nhất, cẩn thận che kín bên trong.\n\n#BOL [ROOT.Var('root_dice_1').GetValue|0]#!. Ta quan sát kỹ [gambler.GetFirstName], tìm kiếm những dấu hiệu."
  ep2_locale_events.1011.tell.good:0 "\n\nCó phải Ta vừa thấy khóe môi của [gambler.GetFirstNamePossessiveNoTooltip] khẽ nhếch lên? Nó biến mất gần như ngay lập tức, nhưng chỉ một dao động nhỏ cũng có thể phơi bày sự thật sâu kín nhất..."
  ep2_locale_events.1011.tell.bad:0 "\n\nÁnh mắt của [gambler.GetFirstNamePossessiveNoTooltip] liếc xuống, một lần, rồi hai lần. Nó biến mất gần như ngay lập tức, nhưng chỉ một dao động nhỏ cũng có thể phơi bày sự thật sâu kín nhất..."
  ep2_locale_events.1011.average:0 "\n\nTay của [gambler.GetFirstNamePossessiveNoTooltip] khẽ run lên khiến Ta suýt reo mừng, nhưng ánh mắt của [gambler.GetHerHis] lại ánh lên tia lấp lánh. Cái run đó là dấu hiệu sao? Hay ánh mắt kia? Có ích gì không?"
  ep2_locale_events.1011.deceitful:0 "\n\n[gambler.GetFirstNamePossessiveNoTooltip] eyes bore into mine, not a flicker of emotion anywhere on [gambler.GetHerHis] face. I break the stare and regard [gambler.GetHerHis] body language, but it is as if [gambler.GetSheHe] is a statue."
  ep2_locale_events.1011.a:0 "Số của ta... cao hơn!"
  ep2_locale_events.1011.b:0 "Xúc xắc của ta thấp hơn."

  ep2_locale_events.1012.t:0 "$tournament_locale_tavern$: Vòng Thứ Hai"
  ep2_locale_events.1012.opening.win:0 "Chúng Ta lật xúc xắc. Chỉ mất một khoảnh khắc để cả hai cùng nhận ra rằng Ta đã thắng!\n\n\"À! Đoán hay lắm! Vòng đầu là của ngươi!\" Môi của [gambler.GetFirstNamePossessive] mỉm cười, nhưng ánh mắt [gambler.GetHerHis] thì không theo kịp. \"Vòng tiếp theo!\" Xúc xắc lại kêu lách cách trong cốc."
  ep2_locale_events.1012.opening.lose:0 "Chúng Ta lật xúc xắc. Chỉ mất một khoảnh khắc để cả hai cùng nhận ra rằng Ta đã thua. [gambler.GetFirstName] mỉm cười đầy tự mãn.\n\n\"Thật đáng tiếc! Có vẻ như ngươi đã đoán sai. Vòng tiếp theo!\" Xúc xắc lại kêu lách cách trong cốc."
  ep2_locale_events.1012.opening.draw:0 "Chúng Ta lật xúc xắc. Khi những chiếc cốc được nhấc lên, cả hai chỉ mất một lúc để tính ra rằng các con số bằng nhau.\n\n\"Vậy thì... coi như hòa.\" Sự thất vọng hiện rõ trên gương mặt [gambler.GetFirstNamePossessive]. \"Vòng tiếp theo!\" Xúc xắc lại kêu lách cách trong cốc."
  ep2_locale_events.1012.dice_reveal:0 "\n\nTa nhấc nhẹ mép cốc gần mình nhất. Những vết khắc nhỏ trên xúc xắc hé lộ con số: #BOL [ROOT.Var('root_dice_2').GetValue|0]#!. Ta đặt cốc trở lại bàn và ngẩng lên."
  ep2_locale_events.1012.tell.good:0 "\n\n[gambler.GetFirstName] gõ những ngón tay của [gambler.GetHerHis] lên mặt bàn. Cái nghiêng đầu hướng lên trần kia có phải là một gợi ý tinh tế không? Rõ ràng [gambler.GetSheHe] đang ngồi thẳng lưng hơn trước..."
  ep2_locale_events.1012.tell.bad:0 "\n\nÁnh mắt hơi nheo lại, trọng tâm cơ thể khẽ dịch chuyển. [gambler.GetFirstName] đang che giấu điều gì đó. Có lẽ lần lắc này không cao lắm..."
  ep2_locale_events.1012.average:0 "\n\nÁnh mắt của [gambler.GetFirstNamePossessiveNoTooltip] đảo quanh khắp phòng, nhìn bất cứ đâu trừ Ta. Cánh tay của [gambler.GetHerHis|U] run nhẹ khi nâng cốc. Ta không thể chắc liệu điều này có quan trọng hay không..."
  ep2_locale_events.1012.deceitful:0 "\n\nTư thế của [gambler.GetFirstNamePossessiveNoTooltip] đầy tự tin, gần như ngạo mạn, nhưng [gambler.GetSheHe] thậm chí còn chưa nhấc cốc lên! Ánh mắt của [gambler.GetHerHis|U] liếc xuống khi [gambler.GetSheHe] nghiêng cốc khỏi [gambler.GetHerHim] một cách dứt khoát, rồi đặt nó trở lại song song với mặt bàn. Thái độ của [gambler.GetHerHis] không hề thay đổi."
  ep2_locale_events.1012.a:0 "Ta nghĩ là cao hơn."
  ep2_locale_events.1012.b:0 "Thấp hơn, chắc chắn rồi."

  ep2_locale_events.1013.t:0 "$tournament_locale_tavern$: Ván Quyết Định"
  ep2_locale_events.1013.opening:0 "Chúng Ta lật xúc xắc cùng lúc, nhưng ngay lập tức rõ ràng rằng cần phải có vòng thứ ba. Chúng Ta cầm lấy cốc và xúc xắc cho vòng cuối cùng — được ăn cả, ngã về không."
  ep2_locale_events.1013.dice_reveal:0 "\n\nTa nhấc nhẹ mép cốc gần mình nhất. Những vết khắc nhỏ trên xúc xắc hé lộ con số: #BOL [ROOT.Var('root_dice_3').GetValue|0]#!. Ta đặt cốc trở lại bàn và ngẩng lên."
  ep2_locale_events.1013.tell.good:0 "\n\nBa vòng trôi qua, những dấu hiệu của [gambler.GetFirstNamePossessive] đã trở nên gần như quá rõ ràng. Mũi của [gambler.GetHerHis|U] khẽ phập phồng khi số lắc cao — Ta chắc chắn là vậy. Nhưng liệu đó chỉ là đòn hù dọa?"
  ep2_locale_events.1013.tell.bad:0 "\n\n[gambler.GetFirstName] runs [gambler.GetHerHis] hand over [gambler.GetHerHis] head distractedly. Despairingly? Is that a particularly low roll? [gambler.GetSheHe|U] sees me and puts on something of a brave face. It #EMP could#! be a double bluff..."
  ep2_locale_events.1013.average:0 "\n\n[gambler.GetFirstNamePossessiveNoTooltip] cố gắng nhìn thẳng vào Ta, nhưng ánh mắt [gambler.GetHerHis] lại dao động. Một bờ môi run rẩy để lộ #EMP điều gì đó#!, nhưng đó là gì?"
  ep2_locale_events.1013.deceitful:0 "\n\nSự lạnh lùng vô cảm của [gambler.GetFirstNamePossessive] xuyên suốt cuộc đấu trí này thực sự đáng kinh ngạc, và lần này cũng không khác. Sự thiếu vắng cảm xúc trên gương mặt [gambler.GetHerHis] gần như gây sốc. Cuối cùng, tất cả sẽ phải trông cậy vào may rủi."
  ep2_locale_events.1013.a:0 "Ta tin vào xúc xắc của mình. Cao hơn!"
  ep2_locale_events.1013.b:0 "Số của ta thấp hơn."

  ep2_locale_events.1014.t:0 "$tournament_locale_tavern$: Cược Thật Đáng Giá"
  ep2_locale_events.1014.opening:0 "Những chiếc cốc được nhấc lên lần cuối cùng. Đám đông nhỏ đã tụ lại quanh chúng Ta nghiêng người tới để xem rằng...\n\n"
  ep2_locale_events.1014.win:0 "I am the victor! [gambler.GetFirstName] puts on the bravest face [gambler.GetSheHe] can muster, but [gambler.GetHerHis] annoyance is clear to see. [gambler.GetSheHe|U] pushes the purses we had wagered over to my side of the table and walks away huffily, just the right side of politeness.\n\nI lean back in my chair, as joyous as I am mentally exhausted."
  ep2_locale_events.1014.lose:0 "Ta thua rồi! [gambler.GetFirstName] reo lên đầy khoái chí khi [gambler.GetSheHe] vơ lấy những túi tiền mà cả hai đã đặt cược.\n\n\"Chúc may mắn lần sau!\" [gambler.GetSheHe|U] cười khanh khách, ôm theo cả đống tiền rồi chuồn đi.\n\nTa ngả lưng vào ghế, chán nản."
  ep2_locale_events.1014.draw:0 "We... drew? [gambler.GetFirstName] rubs [gambler.GetHerHis] head ruefully, as we each take back the small purses of gold we had stacked on the table for the victor.\n\n"Well, sometimes the dice work in mysterious ways." [gambler.GetFirstNameNoTooltip] says, shrugging. "Well played, nonetheless." [gambler.GetSheHe|U] gets up and wanders away."
  ep2_locale_events.1014.a:0 "Chủ quán! Rượu hôm nay ta bao!"
  ep2_locale_events.1014.b:0 "À, dư vị của chiến thắng!"
  ep2_locale_events.1014.c:0 "Ta nghĩ mình cần một ly để vùi sầu."
  ep2_locale_events.1014.d:0 "Khốn thật!"
  ep2_locale_events.1014.e:0 "Vậy là xong rồi, hẳn thế."
  ep2_locale_events.1014.f:0 "Sau chuyện này thì ta cần một ly!"

  ep2_locale_events.1050.t:1 "$tournament_locale_tavern$: Một Kèo Cược Với [ROOT.Char.GetWomanMan|U]?"
  ep2_locale_events.1050.desc:0 "Ta vừa mới bước chân vào quán rượu thì đã bị một bóng người chặn lại. [wealthy_gambler.GetFirstName] vỗ mạnh vào vai Ta rồi kéo Ta đi về một góc kín đáo, hạ thấp giọng [wealthy_gambler.GetHerHis] xuống đầy conspiratorial.\n\n\"Ngươi có tham gia các cuộc thi thương mã, đúng không?\" [wealthy_gambler.GetSheHe|U] tiếp tục nói mà chẳng buồn để ý tới phản ứng của Ta. \"À thì, ta đang có một kèo cược khá là khác thường. Một trong những... đối tác làm ăn của ta cho rằng ngươi là một #EMP kẻ nhát gan#!, nói thế cho lịch sự.\" [wealthy_gambler.GetSheHe|U] khoát tay chặn ngay những lời phản đối của Ta.\n\n\"Tất nhiên là ta đã bảo vệ danh dự của ngươi rồi, [ROOT.Char.Custom('FormOfAddressForLiege')]! Ta nói rằng ngươi đủ dũng cảm để ra đấu trường mà không đội mũ giáp! Dĩ nhiên, nếu ngươi có thể #EMP đảm bảo#! điều đó xảy ra, thì, ờ, ta nghĩ mình có thể trả công xứng đáng cho ngươi...\""
  ep2_locale_events.1050.a:0 "Ta đoán kia là mấy tay cờ bạc Ngài ngươi?"
  ep2_locale_events.1050.a.tt:0 "Có lẽ họ sẽ rất muốn biết về trò gian lận nhỏ này. Trừ khi, tất nhiên, số tiền đủ để khiến người ta câm miệng..."
  ep2_locale_events.1050.b:0 "#EMP Nhát gan ư?!#! Ta sẽ thi đấu mà không mang bất kỳ cái #EMP bao tay#! chết tiệt nào!"
  ep2_locale_events.1050.c:0 "Ta cũng đang cần tiền..."
  ep2_locale_events.1050.d:0 "Thật là một đề nghị đáng khinh!"

 # TEMPLE
  ep2_locale_events.1500.t:0 "$tournament_locale_religious_building$: Ân Huệ của [ROOT.Char.GetFaith.HighGodNamePossessive]"
  ep2_locale_events.1500.host_faith:0 "Khi [tournament_priest.GetFirstName] tránh sang một bên để Ta tiến lên, Ta dành ra một khoảnh khắc trang nghiêm, một mình trong [ROOT.Char.GetFaith.HouseOfWorship] gần khu vực giải đấu."
  ep2_locale_events.1500.other_faith:0 "Ta dành ra một khoảnh khắc cho riêng mình trong ngôi đền tạm thời nhỏ bé theo đức tin [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] gần [activity.GetCurrentPhase.GetCurrentLocation.GetFaith.HouseOfWorship] của [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], với [tournament_priest.GetFirstName] đứng cách đó một khoảng đầy kính cẩn."
  ep2_locale_events.1500.desc:0 "\n\nTrầm tư trước sự hiện diện của [ROOT.Char.GetFaith.PantheonTerm], Ta tự hỏi trong thâm tâm mình mong muốn điều gì sẽ nảy sinh từ những ngày hội hè này."
  ep2_locale_events.1500.a:0 "Hãy ban cho con vinh quang, [ROOT.Char.GetFaith.WarGodName|U]."
  ep2_locale_events.1500.b:0 "Hãy khiến cuộc đời của [ROOT.Char.Custom2('RelationToMeShort', bad_prayer_target)], [bad_prayer_target.GetFirstNamePossessiveNoTooltip], thêm phần khốn khó."
  ep2_locale_events.1500.c:0 "Xin hãy mỉm cười với [ROOT.Char.Custom2('RelationToMeShort', good_prayer_target)], [good_prayer_target.GetFirstNameNoTooltip]."
  ep2_locale_events.1500.d:0 "Hình phạt dành cho [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)], [backup_prayer_target.GetFirstNameNoTooltip]!"
  ep2_locale_events.1500.e:0 "Xin dẫn dắt bàn tay của [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)], [backup_prayer_target.GetFirstNamePossessiveNoTooltip]."
  ep2_locale_events.1500.f:0 "Chiến thắng cho [wager_prayer_target.GetFirstNameNoTooltip], và cho cả túi tiền của ta!"
  ep2_locale_events.1500.g:0 "Hãy để ta tìm thấy sự an yên nội tâm."

  ep2_locale_events.1501.t:0 "$tournament_locale_religious_building$: Sùng Bái Phô Trương"
  ep2_locale_events.1501.desc:0 "Để tìm kiếm chút chỉ dẫn nào đó, Ta lang thang bước vào [ROOT.Char.GetFaith.HouseOfWorship] nhằm tĩnh tâm. Nhưng một vận may hiếm hoi đã mang đến cho Ta thứ thú vị hơn nhiều so với việc tĩnh tâm: [seduce_target.GetFirstName] đang đứng gần cửa, ánh mắt phảng phất nét bâng khuâng.\n\n[seduce_target.GetSheHe|U] thoáng nở một nụ cười mờ nhạt về phía Ta, nhưng sự chú ý rõ ràng đang ở nơi khác. Đây là cơ hội hoàn hảo để chinh phục [seduce_target.GetHerHim] bằng một màn thể hiện lòng mộ đạo!\n\nHoặc... có lẽ không? [seduce_target.GetSheHe] sẽ thích điều gì hơn? Biết đâu [seduce_target.GetSheHe] lại là kiểu người kín đáo?"
  ep2_locale_events.1501.a:0 "Ta sẽ chứng minh lòng sùng kính của mình không còn nghi ngờ gì nữa!"
  ep2_locale_events.1501.a.tt:0 "Lòng nhiệt thành tôn giáo của ta là vô hạn, [seduce_target.GetFirstNameNoTooltip] yêu dấu!"
  ep2_locale_events.1501.a.success:0 "Màn thể hiện của Ngài chạm tới cảm xúc"
  ep2_locale_events.1501.a.failure:0 "[seduce_target.GetFirstNameNoTooltip|U] bị phản cảm trước màn trình diễn của Ngài"
  ep2_locale_events.1501.b:0 "Ta nghĩ [seduce_target.GetFirstNameNoTooltip] là người thoải mái hơn."
  ep2_locale_events.1501.b.tt:0 "Một cái liếc mắt nhẹ và nụ cười hiểu ý khi ta thực hiện nghi lễ hẳn sẽ truyền đạt thông điệp rất rõ ràng tới [seduce_target.GetFirstNameNoTooltip]."
  ep2_locale_events.1501.b.success:0 "[seduce_target.GetFirstName|U] thích thú với sự mỉa mai của Ngài"
  ep2_locale_events.1501.b.failure:0 "[seduce_target.GetFirstNameNoTooltip|U] kinh hãi trước sự báng bổ của Ngài"
  ep2_locale_events.1501.c:0 "Có lẽ ta nên rời đi."

  ep2_locale_events.1510.t:0 "$tournament_locale_religious_building$: Cuộc Ăn Chơi Báng Bổ"
  ep2_locale_events.1510.desc:0 "Khi sự im lặng bao trùm lên các tín đồ đang tụ họp cho nghi lễ hằng ngày, bầu không khí yên bình đột ngột bị phá vỡ bởi tiếng la hét và hò reo đang tiến lại gần.\n\nCánh cửa bật mở, và cả tá kẻ ăn chơi cười đùa lao vào [ROOT.Char.GetFaith.HouseOfWorship],"
  ep2_locale_events.1510.alcohol:0 "trên tay cầm vại và thùng rượu."
  ep2_locale_events.1510.hashish:0 "nồng nặc mùi hashish."
  ep2_locale_events.1510.closing:0 "\n\n[instigator_scope.GetTitledFirstName], rõ ràng là kẻ khởi xướng, cười ngờ nghệch, \"Chuyện gì thế này?! Nhạc đâu rồi?\"\n\n[tournament_priest.GetFirstName] đứng nhìn, chết lặng trong sự kinh hoàng và không thể tin nổi."
  ep2_locale_events.1510.a:0 "Đây là sự báng bổ! Lính đâu, bắt chúng lại!"
  ep2_locale_events.1510.b:0 "Tiệc tùng à? Có ai nói tiệc tùng không?"
  ep2_locale_events.1510.c:0 "Tống cổ tên [instigator_scope.GetFaith.GetAdjectiveNoTooltip] [instigator_scope.Custom('GetUnbelieverName')] bẩn thỉu này đi!"
  ep2_locale_events.1510.d:0 "Cút đi, lũ khốn đáng yêu."
 # ARMORER
  ep2_locale_events.2001.t:1 "$tournament_locale_armorer$: Danh tiếng hay Hiệu quả?"
  ep2_locale_events.2001.desc:0 "Ta đặt bộ [improve_armour.GetName] của mình xuống quầy, và [tournament_armorer.GetFirstName] đưa tay vuốt qua nó.\n\n\"Tình trạng khá tệ đấy. Lâu rồi ngài chưa đem áo giáp đi kiểm tra phải không?\" [tournament_armorer.GetSheHe|U] thở dài rồi liếc sang những công việc còn dang dở đang chờ [tournament_armorer.GetHerHim].\n\n\"Ta không có nhiều thời gian. Có lẽ chỉ đủ để đánh bóng cho sáng loáng, hoặc tra dầu bảo dưỡng một chút. Ngài muốn làm gì?\""
  ep2_locale_events.2001.a:0 "Đánh bóng cho sáng như gương!"
  ep2_locale_events.2001.a.tt:0 "[improve_armour.GetName] nhận được một hiệu ứng [prestige|E]"
  ep2_locale_events.2001.b:0 "Ta muốn tra dầu và bảo dưỡng."
  ep2_locale_events.2001.b.tt:0 "[improve_armour.GetName] nhận được một hiệu ứng [prowess|E]"
  ep2_locale_events.2001.c:0 "Nó vẫn ổn như hiện tại."

  ep2_locale_events.2002.t:1 "$tournament_locale_armorer$: Dây đai sờn rách"
  ep2_locale_events.2002.desc:0 "[tournament_armorer.GetFirstName] vui vẻ trao lại cho ta bộ [armour.GetName]. Nó lấp lánh khi ta nhấc lên dưới ánh sáng.\n\nChính lúc ta đưa tiền cho người thợ đang tỏ ra hài lòng ấy, ta nhận ra một người học việc trẻ đứng cạnh [tournament_armorer.GetHerHim]. [apprentice.GetSheHe|U] lách quanh bàn khi chủ nhân của [apprentice.GetHerHis] đang cất tiền.\n\n\"Xin thứ lỗi, [ROOT.Char.GetLadyLord], nhưng...\" [apprentice.GetSheHe|U] chỉ vào những dây da của áo giáp. \"[tournament_armorer.GetSheHe|U] đã không thuê thợ thuộc da xử lý chúng.\"\n\nTa cúi xuống nhìn kỹ hơn. Không thể nhầm được. Lớp da đã sờn và cũ, rõ ràng không phải mới. Ở phía sau, túi tiền của người thợ giáp leng keng khi [tournament_armorer.GetSheHe] thả số vàng vào trong."
  ep2_locale_events.2002.a:0 "Ta không phải loại [ROOT.Char.GetWomanMan] đi lừa dối, [tournament_armorer.GetFirstNameNoTooltip]."
  ep2_locale_events.2002.b:0 "[tournament_armorer.GetFirstNameNoTooltip]! Chuyện này là sao?"
  ep2_locale_events.2002.b.success:0 "[tournament_armorer.GetFirstNameNoTooltip] miễn cưỡng sửa chữa lại"
  ep2_locale_events.2002.b.failure:0 "[tournament_armorer.GetFirstNameNoTooltip] worms [tournament_armorer.GetHerHis] way out of it"
  ep2_locale_events.2002.c:0 "Ta sẽ trả tiền cho dây đai chất lượng."
  ep2_locale_events.2002.d:0 "Ta không có thời gian cho chuyện này."

  ep2_locale_events.2010.t:0 "$tournament_locale_armorer$: Quà tặng phòng hộ"
  ep2_locale_events.2010.desc:0 "Cửa tiệm của thợ giáp tràn ngập các món đồ bảo hộ, đắt hay rẻ, mặc ngoài hay mặc trong, đủ mọi loại ở giữa.\n\nTa không khỏi nghĩ đến [befriend_target.GetFirstName] khi xem xét những món trang bị cứu mạng này.\n\n[befriend_target.GetSheHe|U] có lẽ sẽ thích #EMP thứ gì đó#! ở đây, nhưng là gì?"
  ep2_locale_events.2010.a:0 "Một bộ giáp thực dụng."
  ep2_locale_events.2010.a.tt:0 "#F Đánh vào sự thận trọng của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.2010.b:0 "[befriend_actor.GetSheHe|U] có thể sẽ thích chiếc khiên trưng bày này."
  ep2_locale_events.2010.b.tt:0 "#F Đánh vào niềm tự hào của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.2010.c:1 "Một mũ đấu giải được chế tác riêng."
  ep2_locale_events.2010.c.tt:0 "#F Đánh vào tinh thần cạnh tranh của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.2010.d:0 "Ta sẽ tìm cách khác để gây ấn tượng với [befriend_target.GetHerHim]."
  ep2_locale_events.2011.reply_armor:0 "Bên trong là một bộ [newly_created_artifact.GetType], chế tác tốt dù có phần đơn giản.\n\n"
  ep2_locale_events.2011.reply_shield:0 "Bên trong là một chiếc khiên vừa được bọc mới, trang trí bằng huy hiệu gia tộc ta.\n\n"
  ep2_locale_events.2011.reply_tournament:0 "Bên trong là một chiếc mũ đấu giải được chế tác riêng, bảo vệ tốt hơn mức cần thiết cho chiến trường.\n\n"
  ep2_locale_events.2011.opening:0 "[befriend_actor.GetTitledFirstName] bất ngờ xuất hiện trước lều của ta, ôm theo một bó lớn. \"Cái này dành cho ngài, [ROOT.Char.GetFirstNameNoTooltip]\" [befriend_actor.GetSheHe] mỉm cười ấm áp. Một món quà ư?\n\n"
  ep2_locale_events.2011.success_armor:0 "$ep2_locale_events.2011.reply_armor$Đó là một bộ đồ rất khá, rõ ràng được chế tác chắc chắn và đã tương đối vừa vặn."
  ep2_locale_events.2011.armor:0 "$ep2_locale_events.2011.reply_armor$Thật là xấu xí, chẳng lẽ vài miếng khảm lại đắt đỏ đến thế sao?"
  ep2_locale_events.2011.success_shield:0 "$ep2_locale_events.2011.reply_shield$Đó là một món trưng bày đẹp mắt, dù chỉ để treo, với huy hiệu được vẽ tinh xảo."
  ep2_locale_events.2011.shield:0 "$ep2_locale_events.2011.reply_shield$Một cái khiên. Ta cần khiên để làm #EMP gì#! chứ?"
  ep2_locale_events.2011.success_tournament:0 "$ep2_locale_events.2011.reply_tournament$Đây là một món trang bị khéo léo, được thiết kế cho thi đấu hơn là chiến tranh."
  ep2_locale_events.2011.tournament:0 "$ep2_locale_events.2011.reply_tournament$Thật lòng mà nói, ai lại coi mấy cuộc thi nhỏ nhặt này nghiêm túc đến mức phải gian lận như vậy?"
  ep2_locale_events.2011.a:0 "Ta không thể phủ nhận món quà được chọn rất đúng."
  ep2_locale_events.2011.b:0 "\"Ồ... một vật thể... thật là... thú vị.\""
  ep2_locale_events.2012.opening:0 "[befriend_target.GetTitledFirstName] nhận lấy bó quà nặng với nụ cười, rõ ràng phấn khích trước món quà bất ngờ.\n\n"
  ep2_locale_events.2012.success_reply:0 "[befriend_target.GetSheHe|U] can't hide [befriend_target.GetHerHis] appreciation as [befriend_target.GetSheHe] examines the gift from every angle."
  ep2_locale_events.2012.reply:0 "[befriend_target.GetSheHe|U] trông không được vui lắm khi [befriend_target.GetSheHe] xem qua món quà."
  ep2_locale_events.2012.success_armor:0 "\n\n\"Những món này thật tuyệt! Ta sẽ không sợ hãi khi mặc chúng ra chiến trường!\""
  ep2_locale_events.2012.armor:0 "\"Ồ... áo giáp... ít nhất thì cũng hữu dụng.\""
  ep2_locale_events.2012.success_shield:0 "\n\n\"Nhìn xem này! Ta sẽ treo nó ngay trong lều!\""
  ep2_locale_events.2012.shield:0 "\"Một cái khiên... rất tốt... cảm ơn.\""
  ep2_locale_events.2012.success_tournament:0 "\"Thiết kế thật khéo léo! Ta nhất định sẽ đội nó trong các cuộc thi!\""
  ep2_locale_events.2012.tournament:0 "\"Ồ, dùng cho thi đấu à? Ừm... được thôi...\""
  ep2_locale_events.2012.success:0 "\n\n[befriend_target.GetSheHe|U] cảm ơn ta đầy xúc động. Có lẽ ta đã chọn đúng!"
  ep2_locale_events.2012.failure:0 "\n\n[befriend_target.GetSheHe|U] cảm ơn ta một cách gượng gạo. Có lẽ ta đã chọn sai..."
  ep2_locale_events.2012.a:0 "Ta biết mà!"
  ep2_locale_events.2012.b:0 "Ít nhất thì thợ giáp cũng vui..."

  ep2_locale_events.2050.t:0 "$tournament_locale_armorer$: Bộ giáp lấp lánh"
  ep2_locale_events.2050.desc:0 "Upon seeing my armor, [tournament_armorer.GetFirstName] puts [tournament_armorer.GetHerHis] hands on [tournament_armorer.GetHerHis] hips and exhales loudly.\n\n"Well the job's a big'un. Shouldn't take all too long for someone of my #EMP prodigious#! talents, 'course!" [tournament_armorer.GetSheHe|U] grins toothily at me. I look at the armor. It seems fine to me. [tournament_armorer.GetFirstNameNoTooltip] catches my skepticism and shakes [tournament_armorer.GetHerHis] head.\n\n"Nah, it definitely needs a go-over. I wouldn't suggest it if it didn't!""
  ep2_locale_events.2050.a:0 "Được rồi, thể hiện phép màu của ngươi đi."
  ep2_locale_events.2050.a.success:0 "Áo giáp của Ngài được cải thiện"
  ep2_locale_events.2050.a.critsuccess:0 "Áo giáp của Ngài được cải thiện đáng kể"
  ep2_locale_events.2050.a.armour1:0 "[prowess|E] tăng #color_green +1#!"
  ep2_locale_events.2050.a.durability1:0 "[durability|E] tăng #color_green +5#!"
  ep2_locale_events.2050.a.armour1.tt:0 "[prowess|E] tăng #color_dark_green +1#!"
  ep2_locale_events.2050.a.durability1.tt:0 "[durability|E] tăng #color_dark_green +5#!"
  ep2_locale_events.2050.a.criticalsuccess:0 "Áo giáp của Ngài được cải thiện rõ rệt"
  ep2_locale_events.2050.a.armour2:0 "[prowess|E] tăng #color_green +2#!"
  ep2_locale_events.2050.a.durability2:0 "[durability|E] tăng #color_green +10#!"
  ep2_locale_events.2050.a.prestige2:0 "[prestige|E] hàng tháng tăng #color_green +0.04%#!"
  ep2_locale_events.2050.a.armour2.tt:0 "[prowess|E] tăng #color_dark_green +2#!"
  ep2_locale_events.2050.a.durability2.tt:0 "[durability|E] tăng #color_dark_green +10#!"
  ep2_locale_events.2050.a.prestige2.tt:0 "[prestige|E] hàng tháng tăng #color_dark_green +0.04%#!"
  ep2_locale_events.2050.a.failure:0 "Việc sửa chữa áo giáp của Ngài bị hỏng"
  ep2_locale_events.2050.a.durability3:0 "[durability|E] giảm #color_red -5#!"
  ep2_locale_events.2050.b:0 "Ta nghĩ nó sẽ ổn thôi."

 # TAILOR
  ep2_locale_events.2500.t:0 "$tournament_locale_tailor$: Huy hiệu sai lạc"
  ep2_locale_events.2500.desc:1 "Khi xem qua các món hàng được trưng bày trong tiệm may, ta bắt gặp một gói đồ được bọc cẩn thận giữa đống quần áo và phụ kiện.\n\nNgười thợ may vui vẻ mở nó ra cho ta, cẩn thận tháo dây da để lộ ra một huy hiệu được thêu tinh xảo: huy hiệu của #EMP Nhà [tailor_mixup.GetHouse.GetBaseName]#!."
  ep2_locale_events.2500.a.rival:0 "Bọn chó [tailor_mixup.GetHouse.GetBaseNameNoTooltip]! Đốt nó đi, ta sẽ #EMP trả tiền#! cho ngươi!"
  ep2_locale_events.2500.a:0 "Làm ơn giúp ta, đốt cái này đi."
  ep2_locale_events.2500.b:0 "Nghe này, ta sẽ lấy mấy thứ này, nhưng đừng hé miệng với ai."
  ep2_locale_events.2500.b.tt:0 "Hiệu ứng này sẽ tăng [success_chance|E] cho các [hostile_scheme|E] của Ngài chống lại Nhà [tailor_mixup.GetHouse.GetName]"
  ep2_locale_events.2500.c:0 "Tuyệt thật... Ta muốn huy hiệu của Nhà [ROOT.Char.GetHouse.GetNameNoTooltip]!"
  ep2_locale_events.2500.d:0 "Tay nghề rất đẹp..."

  ep2_locale_events.2501.t:0 "$tournament_locale_tailor$: Trang phục Giáo hoàng"
  ep2_locale_events.2501.desc:0 "Các loại vải vóc trong tiệm may trải dài từ gai thô cho đến gấm, nhung và lụa thượng hạng. Khi ta xem xét chúng cùng với [ROOT.Char.Custom2('RelationToMeShort', random_knight)] của mình, [random_knight.GetFirstName], một hoa văn quen thuộc lạ thường khiến ta khựng lại.\n\nNhấc cả bộ áo choàng lên dưới ánh sáng, mắt ta mở to. Đó là một bản phục dựng hoàn chỉnh phẩm phục của Giáo hoàng!\n\n\"Chúng Ta cũng có cả đồ cho Hồng y nữa đấy, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [tournament_tailor.GetFirstName] nói, đứng lấp ló sau lưng hai chúng ta. Đôi mắt của [random_knight.GetFirstNamePossessiveNoTooltip] sáng rực đầy thích thú khi [random_knight.GetSheHe] huých mạnh vào sườn ta. Người thợ may nói tiếp.\n\n\"Và bộ kia còn có cả mũ đi kèm nữa.\""
  ep2_locale_events.2501.a:0 "#EMP MUA NGAY!#!"
  ep2_locale_events.2501.a.tt:0 "Ngài và các [knights|E] của Ngài khoác lên mình bộ trang phục..."
  ep2_locale_events.2501.b:0 "Đây là báng bổ!"

  ep2_locale_events.2502.t:0 "$tournament_locale_tailor$: Áo choàng đấu tay đôi"
  ep2_locale_events.2502.desc:0 "I look at the impassive tailor, wordlessly imploring [tournament_tailor.GetHerHim] to repeat what sounded like the most ridiculous statement I had heard all day.\n\n"It's a dueling cloak. You never heard of one before?" [tournament_tailor.GetFirstName] shakes [tournament_tailor.GetHerHis] head as if #EMP I'm#! the fool in the room. "It helps your movement, helps wick away all the moisture of combat, but also keeps you warm and ready to go between rounds. All the greats have 'em!"\n\nThe tailor's hard sell done with, I move my attention back to the mantle I hold. The fabric was clearly hard-wearing and of a high quality, but... a #EMP dueling cloak? Really?#!"
  ep2_locale_events.2502.a:0 "Trái với phán đoán của ta... chốt kèo."
  ep2_locale_events.2502.b:0 "Ngươi nghĩ ta là kẻ ngu sao!"
  ep2_locale_events.2502.b.tt:0 "Nó chỉ vướng víu khắp nơi mà thôi!"

  ep2_locale_events.2510.t:0 "$tournament_locale_tailor$: Quà Tặng Thêu Dệt"
  ep2_locale_events.2510.desc:0 "Ta ngắm nhìn những cuộn vải quý hiếm và các mẫu vải treo tại quầy của người thợ may; từ gu thẩm mỹ cao sang nhất đến bình dân nhất đều có đủ.\n\nKhi xem xét những món hàng tinh xảo này, Ta không khỏi nghĩ đến điều mà [befriend_target.GetFirstName] hẳn sẽ yêu thích.\n\nKhông nghi ngờ gì, #EMP thứ gì đó#! ở đây hẳn sẽ hợp ý [befriend_target.GetHerHim]..."
  ep2_locale_events.2510.a:0 "Một lá cờ thật đẹp."
  ep2_locale_events.2510.a.tt:0 "#F Đánh vào lòng tự hào của [befriend_target.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.2510.b:0 "Không gì hữu dụng hơn một chiếc áo gambeson."
  ep2_locale_events.2510.b.tt:0 "#F Đánh vào bản tính hiếu chiến của [befriend_target.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.2510.c:0 "Đôi găng da hươu này quả thật tinh xảo."
  ep2_locale_events.2510.c.tt:0 "#F Đánh vào sự dịu dàng của [befriend_target.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.2510.d:0 "Có lẽ để dịp khác vậy."
  ep2_locale_events.2511.reply_banner:0 "Bên trong là một lá cờ được dệt tinh tế, gấp gọn gàng, mang huy hiệu của Ngài.\n\n"
  ep2_locale_events.2511.reply_gambeson:0 "Bên trong là một chiếc gambeson chần bông, loại áo bền chắc thường mặc dưới áo giáp xích.\n\n"
  ep2_locale_events.2511.reply_glove:0 "Bên trong là một đôi găng da hươu mềm mại, được may đo tinh tế.\n\n"
  ep2_locale_events.2511.opening:0 "[befriend_actor.GetTitledFirstName] xuất hiện như từ hư không, mỉm cười duyên dáng và trao cho Ta một gói đồ được gấp gọn. Một món quà ư?\n\n"
  ep2_locale_events.2511.success_banner:0 "$ep2_locale_events.2511.reply_banner$Ta không thể tìm ra điểm gì để chê trách, huy hiệu của Ta được thể hiện vừa chính xác vừa trang nhã."
  ep2_locale_events.2511.banner:0 "$ep2_locale_events.2511.reply_banner$Sự thiếu hào hứng của Ta hiện rõ, thứ này thì có ích gì cho Ta chứ?"
  ep2_locale_events.2511.success_gambeson:0 "$ep2_locale_events.2511.reply_gambeson$Xem xét kỹ lưỡng, đây quả là một món đồ tốt; nhiều lớp và rõ ràng rất bền chắc."
  ep2_locale_events.2511.gambeson:0 "$ep2_locale_events.2511.reply_gambeson$Một món như thế này Ta có thể mua ở bất kỳ thợ dệt tầm thường nào, thì sao chứ?"
  ep2_locale_events.2511.success_glove:0 "$ep2_locale_events.2511.reply_glove$Chúng mềm mại như nhung, và kỳ lạ thay lại vừa khít gần như hoàn hảo."
  ep2_locale_events.2511.glove:0 "$ep2_locale_events.2511.reply_glove$Thật là... yểu điệu..."
  ep2_locale_events.2511.a:0 "Ta không kìm được nụ cười, thật hoàn hảo!"
  ep2_locale_events.2511.b:0 ""Ta... cảm ơn...""
  ep2_locale_events.2512.opening:0 "[befriend_target.GetTitledFirstName] nhã nhặn nhận lấy gói quà của Ta, mở ra cẩn thận hết mức mà sự háo hức của [befriend_target.GetHerHis] cho phép.\n\n"
  ep2_locale_events.2512.success_reply:0 "[befriend_target.GetHerHis|U] ánh mắt lập tức ấm lên khi nhìn thấy món quà. Một dấu hiệu tốt."
  ep2_locale_events.2512.reply:0 "Ta không thể đoán được phản ứng của [befriend_target.GetHerHis], dường như chẳng có gì thay đổi."
  ep2_locale_events.2512.success_banner:0 "\n\n"Thật tuyệt vời! Đường thêu tinh xảo làm nổi bật thiết kế!""
  ep2_locale_events.2512.banner:0 ""Ồ, một lá cờ. Ta sẽ... treo nó ngay.""
  ep2_locale_events.2512.success_gambeson:0 "\n\n"Một tay nghề xuất sắc, thứ này có thể chặn được mọi đòn đánh trừ những cú mạnh nhất.""
  ep2_locale_events.2512.gambeson:0 ""Ta sẽ... để nó cùng những chiếc khác...""
  ep2_locale_events.2512.success_glove:0 ""Trời ơi, chúng hoàn hảo quá! Làm sao Ngài làm được vậy?!""
  ep2_locale_events.2512.glove:0 ""Ồ, găng tay... rất tốt...""
  ep2_locale_events.2512.success:0 "\n\n[befriend_target.GetSheHe|U] cảm ơn Ta hết lời trước khi chúng Ta chia tay."
  ep2_locale_events.2512.failure:0 "\n\n[befriend_target.GetSheHe|U] cảm ơn Ta một cách lạnh nhạt rồi rời đi..."
  ep2_locale_events.2512.a:0 "Mọi chuyện diễn ra tốt đẹp."
  ep2_locale_events.2512.b:0 "Thôi vậy..."
 
  ep2_locale_events.2560.t:0 "$tournament_locale_tailor$: Món Hàng Mới"
  ep2_locale_events.2560.desc.intro:0 "Ta bắt gặp [tailor.GetTitledFirstName] đang cắt một mảnh vải. Vài chiếc bàn được bày ra để trưng bày tác phẩm của [tailor.GetHerHis]: tất, khăn trùm đầu, mũ trùm và tay áo. Đối diện là một lò sưởi cháy nhẹ.\n\n"
  ep2_locale_events.2560.desc.previous_artifact:0 ""Ngài đang tìm thứ gì đó để tô điểm cho trang phục của mình sao, [ROOT.Char.Custom('FormOfAddressForLiege')]? Ta thấy ngài cũng mang theo vài cổ vật từ kinh thành... Nếu cho phép, Ta luôn muốn được xem qua tay nghề của các bậc thầy vùng [capital_barony.GetAdjectiveNoTooltip].""
  ep2_locale_events.2560.desc.new_artifact:0 ""Cẩn thận!" [tailor.GetSheHe] cảnh báo Ta, suýt đánh rơi dụng cụ. "Ngài sắp vấp phải đống vải lanh rồi đấy, [ROOT.Char.Custom('FormOfAddressForLiege')]," [tailor.GetSheHe] lẩm bẩm xin lỗi, vội vàng nhặt quần áo lên. "Ta đoán được mục đích chuyến thăm của ngài," khuôn mặt [tailor.GetHerHis] chỉ vừa ló ra khỏi đống lộn xộn."
  ep2_locale_events.2560.desc.new_artifact_2:0 ""Ngài [ROOT.Char.GetLadyLord] đang tìm kiếm thứ gì chăng?" [tailor.Custom('quirk_pos_standalone')|l]. Bộ sưu tập bên cạnh [tailor.GetHerHim] quả thật ấn tượng hơn Ta từng nghĩ."
  ep2_locale_events.2560.a:0 ""Thật ra, món [previous_artifact.GetNameNoTooltip] của ta có lẽ cần được trang trí thêm...""
  ep2_locale_events.2560.b:0 ""Ta có thể mua món [purchasable_trinket.GetNameNoTooltip] kia không?""
  ep2_locale_events.2560.c:0 ""Ngươi bảo ta phải #EMP trả tiền#! cho nó sao?""
  ep2_locale_events.2560.c.success:0 "Ngài uy hiếp được [tailor.GetShortUIName]"
  ep2_locale_events.2560.c.failure:0 "[tailor.GetShortUIName] không bị uy hiếp"
  ep2_locale_events.2560.d:0 ""Vài lá cờ sẽ khiến khán giả cổ vũ ta nhiệt tình hơn!""
  ep2_locale_events.2560.e:0 ""Đây, hãy tiếp tục làm việc tốt nhé.""
  feather_trinket:0 "Lông Vũ Rực Rỡ"
  feather_trinket.desc:0 "Một chiếc lông vũ rực màu, được cho là từng thuộc về một con công. Một món đồ ngoại lai hiếm có."
  chess_trinket:0 "Quân Cờ"
  chess_trinket.desc:0 "Một bức tượng nhỏ tuyệt đẹp được chạm khắc từ pha lê đá. Hình dáng trừu tượng khiến khó mà đoán được nó đại diện cho điều gì."
  ribbon_trinket:0 "Dải Ruy Băng Trang Trí"
  ribbon_trinket.desc:0 "Một dải lụa được thêu hoa văn tinh xảo. Một món quà tao nhã."
  glass_orb_trinket:0 "Quả Cầu Thủy Tinh"
  glass_orb_trinket.desc:0 "Một quả cầu trong suốt như pha lê. Nó sẽ không bao giờ hoàn toàn trong vắt."
  tapestry_trinket:0 "Thảm Thêu Cừu"
  tapestry_trinket.desc:0 "Một tấm thảm mô tả cảnh đồng quê yên bình. Đàn vật đang uống nước bên dòng suối êm đềm."
  tournament_banners_modifier:0 "Cờ Thi Đấu"
  tournament_banners_modifier_desc:0 "Nhân vật này đã cho treo các lá cờ dành cho khán giả."
  ep2_locale_events_artifact_decoration_desc:0 "[previous_artifact.GetDesc]\n\nNó đã được trang trí bằng một dải ruy băng hoa."
  artifact_monthly_prestige_3_modifier:0 "Ruy Băng Trang Trí"

# VISITOR CAMP
  ep2_locale_events.3001.t:0 "$tournament_locale_visitor_camp$: Khoảnh Khắc Riêng Tư"
  ep2_locale_events.3001.desc:0 "Cuối cùng Ta cũng có được chút thời gian riêng trong lều cùng [lover.GetFirstName], tránh xa sự ồn ào náo nhiệt của giải đấu, một cơn mệt mỏi sâu sắc tràn ngập trong Ta. Ta ngồi phịch xuống đệm rơm phủ vải, tâm trí đau nhức chẳng kém gì cơ thể.\n\nTa nghe thấy [lover.GetFirstNameNoTooltip] thì thầm với một lính gác — gì đó về việc không muốn bị làm phiền — rồi chỉ ít lâu sau Ta cảm nhận được hơi ấm của [lover.GetHerHis] bên cạnh mình.\n\n"Trông em mệt mỏi quá, tình yêu của ta." Ta nghe rõ sự lo lắng trong giọng [lover.GetHerHis]. "Em cần nghỉ ngơi trước khi các cuộc thi bắt đầu. Ở lại đây với ta một lát nhé?""
  ep2_locale_events.3001.a:0 "Ta không #EMP mệt đến thế#!..."
  ep2_locale_events.3001.b:0 "Ta rất muốn."
  ep2_locale_events.3001.c:0 "Ta cần phải chuẩn bị!"

  ep2_locale_events.3002.t:0 "$tournament_locale_visitor_camp$: Những Chiến Binh Trụy Lạc"
  ep2_locale_events.3002.desc:0 "What is that noise? Giggling... a few groans? It #EMP sounds#! like it's coming from that tent.\n\nMy curiosity gets the better of me as I wander over to the heavy flap that the sounds are coming from with equal parts anticipation and trepidation. I draw the covering aside to find quite a sight greeting me.\n\n[lech1.GetFirstName], caught completely #EMP in flagrante#!, physically panics, shoving [lech1.GetHerHis] partner bodily off [lech1.GetHerHim] and on to the floor. I peer into the gloom to find [lech2.GetFirstName] and [lech3.GetFirstName] also struggling to process their best response to such a turn of events, hurriedly and fruitlessly trying to hide their own partners as they are."
  ep2_locale_events.3002.a:0 "Có chỗ cho ta không?"
  ep2_locale_events.3002.b:0 "Đồ ngu xuẩn! Các ngươi cần dành thời gian để #EMP chuẩn bị#!!"
  ep2_locale_events.3002.c:0 "Đừng để ta làm gián đoạn!"
  ep2_locale_events.3002.c.tt:0 "Tốt nhất là để họ tự xử, nhỉ?"

 # FARRIER
  ep2_locale_events.3500.t:0 "$tournament_locale_farrier$: Một Vết Châm Nhẹ"
  ep2_locale_events.3500.desc:0 "Ta đưa con ngựa của mình đi đóng móng mới trước khi cuộc thi [activity.GetCurrentPhase.GetPhase.GetName] bắt đầu, cẩn thận quan sát người học việc của [tournament_farrier.GetFirstNamePossessive] đang cắt tỉa móng cho con vật đắt giá của Ta.\n\nTa có linh cảm không lành về gã trai trẻ ấy, và quả nhiên, chiếc đinh đầu tiên lại quá dài. Con vật đá mạnh, suýt trúng [tournament_farrier.GetFirstNameNoTooltip], rồi khập khiễng đau đớn quanh xưởng.\n\n"
  ep2_locale_events.3500.war:0 "Người học việc chạy theo #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#! — con [ROOT.Char.Custom('HorseStoryMareStallion')] sẽ cần được thay móng ngay lập tức."
  ep2_locale_events.3500.race:0 "Người học việc chạy theo #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#! — con [ROOT.Char.Custom('ContestHorseRaceGender')] sẽ cần được thay móng ngay lập tức."
  ep2_locale_events.3500.other:0 "Người học việc chạy theo [ROOT.Char.Custom('ContestHorseRaceHerHim')] — con [ROOT.Char.Custom('ContestHorseRaceGender')] sẽ cần được thay móng ngay lập tức."
  ep2_locale_events.3500.a:0 "[ROOT.Char.Custom('ContestHorseRaceSheHe')|U] đáng giá hơn năm năm tiền công của ngươi đấy, đồ ngu!"
  ep2_locale_events.3500.a.war_horse:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] đáng giá hơn năm năm tiền công của ngươi đấy, đồ ngu!"
  ep2_locale_events.3500.b:0 "Tên học việc đó sẽ không bao giờ làm việc trong lãnh địa của ta nữa!"
  ep2_locale_events.3500.c:0 "Ta mong việc này phải được miễn phí!"
  ep2_locale_events.3500.d:0 "Lần sau hãy cẩn thận hơn."
  every_attending_contestant_tt:0 "Mọi Thí Sinh"
 # BOWYER
  ep2_locale_events.4000.t:0 "$tournament_locale_bowyer$: Sự kiện Thợ làm cung"
  ep2_locale_events.4000.desc:0 "Ta rất yêu những mũi tên đẹp!"
  ep2_locale_events.4000.a:0 "Gắn lông"
  ep2_locale_events.4000.b:0 "Không gắn lông"

  ep2_locale_events.4001.t:0 "$tournament_locale_bowyer$: Cong mà vẫn chưa..."
  ep2_locale_events.4001.desc:1 ""Trông ổn mà!" [tournament_bowyer.GetFirstName] đang thử cây cung ta mang đến để [tournament_bowyer.GetHerHim] kiểm tra. Ta lục qua những bó tên xếp chồng trên bàn bên cạnh trong khi [tournament_bowyer.GetSheHe] tiếp tục xem xét.\n\n"Cạnh trước trông hơi lệch." Đôi mắt người thợ làm cung nheo lại khi [tournament_bowyer.GetSheHe] siết chặt hai cánh cung, uốn chúng ngày càng mạnh. "Đó, thấy chưa, có chút cong vênh ở—"\n\n#EMP Crrrrack!#! Miệng [tournament_bowyer.GetFirstNamePossessiveNoTooltip] há hốc vì sốc khi cây cung tách đôi. Những lời thanh minh của [tournament_bowyer.GetHerHis] rằng việc kiểm tra là cần thiết và cây cung sớm muộn gì cũng sẽ gãy vang khắp căn phòng, nhưng người bị bỏ lại trong mất mát lại chính là ta."
  ep2_locale_events.4001.a:0 "Tốt hơn hết là ngươi nên đền cho ta cái khác, miễn phí!"
  ep2_locale_events.4001.a.success:1 "[tournament_bowyer.GetFirstNameNoTooltip] thay thế cây cung miễn phí"
  ep2_locale_events.4001.a.failure:1 "[tournament_bowyer.GetFirstNameNoTooltip] từ chối trả tiền"
  ep2_locale_events.4001.b:0 "Chết tiệt. Vậy ngươi có cái nào để bán không?"
  ep2_locale_events.4001.c:1 "Đồ [tournament_bowyer.Custom2('InsultNoun', ROOT.Char)]! Ngươi, ngươi... #EMP [tournament_bowyer.Custom2('InsultNoun', ROOT.Char)]#!!"

  ep2_locale_events.4010.t:0 "$tournament_locale_bowyer$: Quà tặng Đạn đạo"
  ep2_locale_events.4010.desc:0 "Ta quan sát các món hàng được bày tại sạp của thợ làm cung, ngưỡng mộ những cây cung, mũi tên và phụ kiện khác nhau.\n\nTa ngay lập tức nghĩ đến [befriend_target.GetFirstName] khi nhìn thấy vô số vật dụng hữu ích đang được chào bán.\n\nCó lẽ thứ gì đó ở đây sẽ khiến [befriend_target.GetHerHis] thích thú..."
  ep2_locale_events.4010.a:0 "Một cây cung mới."
  ep2_locale_events.4010.a.tt:0 "#F Đánh vào mặt thực tế của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.4010.b:0 "Ống đựng tên tốt là thứ thường bị xem nhẹ."
  ep2_locale_events.4010.b.tt:0 "#F Đánh vào khả năng sắp xếp của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.4010.c:0 "Những mũi tên săn bắn này thật độc đáo."
  ep2_locale_events.4010.c.tt:0 "#F Đánh vào sự năng động của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.4010.d:0 "Ta không nghĩ vậy."
  ep2_locale_events.4011.reply_bow:0 "Bên trong là một cây cung hoàn hảo, kèm theo một bộ mũi tên.\n\n"
  ep2_locale_events.4011.reply_quiver:0 "Bên trong là một ống đựng tên có thiết kế kỳ lạ, lớn hơn bình thường.\n\n"
  ep2_locale_events.4011.reply_hunt:0 "Bên trong là một bộ mũi tên săn bắn được chế tác cực kỳ tỉ mỉ.\n\n"
  ep2_locale_events.4011.opening:0 "[befriend_actor.GetTitledFirstName] bất ngờ xuất hiện trước mặt ta, với một gói đồ hình thù kỳ lạ được [befriend_actor.GetHerHis] đưa ra phía trước. Một món quà?\n\n"
  ep2_locale_events.4011.success_bow:0 "$ep2_locale_events.4011.reply_bow$Đây là một tác phẩm rất tinh xảo, một cây cung xứng đáng với giới quý tộc."
  ep2_locale_events.4011.bow:0 "$ep2_locale_events.4011.reply_bow$Thật khó để che giấu sự thất vọng của ta. Ý ta là, một cây cung sao..."
  ep2_locale_events.4011.success_quiver:0 "$ep2_locale_events.4011.reply_quiver$Ta dành chút thời gian xem xét nó, đây là ống đựng tên tiện dụng nhất ta từng thấy!"
  ep2_locale_events.4011.quiver:0 "$ep2_locale_events.4011.reply_quiver$Ta cần thứ này để làm gì chứ? Ý ta là, thật sự..."
  ep2_locale_events.4011.success_hunt:0 "$ep2_locale_events.4011.reply_hunt$Chúng có kết cấu đặc biệt chắc chắn, rõ ràng là hoàn hảo để bắn thú nhỏ."
  ep2_locale_events.4011.hunt:0 "$ep2_locale_events.4011.reply_hunt$Mũi tên săn bắn sao? Ngươi #EMP thật sự#! không cần phải thế..."
  ep2_locale_events.4011.a:0 "Ta không thể giấu được nụ cười, [befriend_actor.GetSheHe] đã chọn rất đúng!"
  ep2_locale_events.4011.b:0 ""Thật là một... món quà chu đáo...""
  ep2_locale_events.4012.opening:0 "[befriend_target.GetTitledFirstName] vui vẻ nhận lấy, mở các lớp buộc của gói quà với sự háo hức trẻ con.\n\n"
  ep2_locale_events.4012.success_reply:0 "Đôi mắt [befriend_target.GetHerHis|U] mở to khi [befriend_target.GetSheHe] nhìn thấy nó — ta có linh cảm rất tốt."
  ep2_locale_events.4012.reply:0 "Trái tim [befriend_target.GetHerHis|U] dường như trĩu xuống khi [befriend_target.GetSheHe] nhìn thấy nó."
  ep2_locale_events.4012.success_bow:0 "\n\n"Một [newly_created_artifact.GetType] được chạm khắc bậc thầy! Ta sẽ trân trọng nó!""
  ep2_locale_events.4012.bow:0 ""Một [newly_created_artifact.GetType]! Tốt. Tốt.""
  ep2_locale_events.4012.success_quiver:0 "\n\n"Thật là một thứ đáng chiêm ngưỡng! Ngươi tìm được nó ở đâu vậy?""
  ep2_locale_events.4012.quiver:0 ""Một vật đựng mũi tên? Ta hiểu rồi.""
  ep2_locale_events.4012.success_hunt:0 ""Ôi, ta đã tìm thứ như thế này từ lâu rồi!""
  ep2_locale_events.4012.hunt:0 ""Để săn bắn sao? Được. Được.""
  ep2_locale_events.4012.success:0 "\n\n[befriend_target.GetSheHe|U] cảm ơn ta, đặt tay lên vai ta. Ta nghĩ mình đã bắn trúng hồng tâm!"
  ep2_locale_events.4012.failure:0 "\n\n[befriend_target.GetSheHe|U] cảm ơn ta một cách hời hợt rồi rời đi, ta đã nghĩ gì thế này..."
  ep2_locale_events.4012.a:0 "Một phát bắn chuẩn xác."
  ep2_locale_events.4012.b:0 "Có ích gì chứ..."

  ep2_locale_events.4050.t:0 "$tournament_locale_bowyer$: Tự Chuẩn Bị"
  ep2_locale_events.4050.desc:0 "Lục lọi giữa những bó mũi tên và đống dây cung, ta bắt gặp một chồng bao tay da bảo vệ cẳng tay đặc biệt tinh xảo. Xỏ một chiếc vào cẳng tay, lớp da cứng cáp bảo vệ mặt trong cánh tay ta.\n\n"Đây là những bao tay tốt nhất của chúng Ta, [ROOT.Char.Custom('FormOfAddressForLiege')]. Mười nghìn lần quất dây cung cũng không làm mòn được chúng!" [tournament_bowyer.GetFirstName] nhận ra một cơ hội bán hàng, và [tournament_bowyer.GetSheHe] nhanh chóng trượt đến bên cạnh ta.\n\nTa thử nghiệm lớp da một cách tò mò, cân nhắc nó trong tay."
  ep2_locale_events.4050.a:0 "Có lẽ chúng ta có thể thương lượng?"
  ep2_locale_events.4050.a.success:0 "Ngươi mặc cả thành công"
  ep2_locale_events.4050.a.failure:0 "Cuộc thương lượng của ngươi thất bại"
  ep2_locale_events.4050.a.critfailure:0 "[tournament_bowyer.GetFirstNameNoTooltip] bực bội từ chối bán"
  ep2_locale_events.4050.b:0 "Ta lấy hai cái!"
  ep2_locale_events.4050.c:0 "Bao nhiêu tiền?"
  ep2_locale_events.4050.d:0 "Ta không cần thứ này."

 # WEAPONSMITH
  ep2_locale_events.4500.t:0 "$tournament_locale_weaponsmith$: Sứt mẻ gia truyền"
  ep2_locale_events.4500.start:0 "Ta trao "
  ep2_locale_events.4500.artifact:0 "[chipped_sword.GetName] "
  ep2_locale_events.4500.noartifact:0 "vũ khí của ta "
  ep2_locale_events.4500.end:2 "để chuẩn bị cho các thử thách phía trước, nhưng ngay lập tức sự hối hận tràn ngập khi nó rời khỏi tay ta. [tournament_weaponsmith.GetFirstName] — người thợ rèn — rõ ràng đang ngập trong yêu cầu, và [tournament_weaponsmith.GetSheHe] liền chuyển nó cho một học việc trông có vẻ rụt rè xử lý.\n\nNgười [apprentice.GetWomanMan] trẻ tuổi phấn khích cầm vũ khí, vung thử một nhát bất cẩn — quá bất cẩn — trong không trung. Nó đập vào một cái đe gần đó, khoét ra một vết sứt sâu trên thân!\n\nTiếng hét vô thức của ta khiến người thợ rèn quay lại trong kinh hoàng, giật lấy vũ khí hư hỏng bằng một tay và vả vào tai [apprentice.Custom('GirlBoy')] bằng tay còn lại."
  ep2_locale_events.4500.a:0 "Sửa nó đi! Sửa ngay!"
  ep2_locale_events.4500.a.tt:0 "Sẽ tốn kém và cần khá nhiều công việc thô ráp để sửa, nhưng ta cần nó được làm!"
  ep2_locale_events.4500.b:0 "Ôi trời—... ngươi có cái nào để bán không?"
  ep2_locale_events.4500.c:0 "Đưa đây cho ta!"
  tournament_sword_name:0 "Kiếm Giải Đấu"
  tournament_sword_description:1 "$artifact_sword_description$\n\nVũ khí này được mua tại một giải đấu."
  tournament_sword.martiallifestyle:1 "$tournament_sword_description$ Kết cấu bền bỉ cho thấy cam kết trở thành một lưỡi kiếm giết chóc trước hết."
  tournament_sword.controlledadv:1 "$tournament_sword_description$ Dòng khắc trên lưỡi kiếm đề cập đến việc bảo vệ lãnh thổ."
  tournament_sword.foreignfaith:1 "$tournament_sword_description$ Dòng chữ kỳ lạ và xa lạ trên lưỡi kiếm dường như ám chỉ một tôn giáo không xác định."

  ep2_locale_events.4501.t:0 "$tournament_locale_weaponsmith$: Sẵn Sàng Ra Trận"
  ep2_locale_events.4501.desc:0 "Ta đang quan sát [tournament_weaponsmith.GetFirstName] rèn một vũ khí mới thì nghe thấy một tiếng #EMP choang#! nhỏ nhưng rõ ràng, theo sau là một lời chửi rủa thì thầm, nghe có phần… hụt hơi. Nhìn xuyên qua ánh lửa mờ ảo, cuối cùng ta cũng thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))] của ta, [spying_spouse.GetFirstName], đang khom người nấp sau một chiếc bàn nhỏ!\n\nMục đích của [spying_spouse.GetHerHis|U] nhanh chóng lộ rõ. Ánh mắt [spying_spouse.GetHerHis|U] lang thang trên cánh tay rắn chắc của [tournament_weaponsmith.GetFirstNamePossessiveNoTooltip], nơi mồ hôi chảy thành dòng trên những bó cơ cuồn cuộn. Rõ ràng, gương mặt ửng đỏ của [spying_spouse.GetFirstNamePossessiveNoTooltip] không chỉ là vì sức nóng...\n\nTa bước một bước về phía [spying_spouse.GetHerHim]. Chỉ thế là đủ: [spying_spouse.GetFirstNameNoTooltip] suýt nữa thì thở hắt ra thành tiếng khi ánh mắt chúng ta chạm nhau, bị bắt quả tang không chối cãi được."
  ep2_locale_events.4501.a:0 "Có lẽ ta nên xem liệu sự hứng thú này có được cả hai phía chia sẻ không?"
  ep2_locale_events.4501.a.tt:0 "Nụ cười thấp thoáng nơi khóe miệng của người thợ rèn kia đã nói lên tất cả, nếu ta đoán không nhầm..."
 #ep2_locale_events.4501.a.custom.tt: "#high [spying_spouse.GetFirstName]#! lays with #high [tournament_weaponsmith.GetFirstName]#!"
  ep2_locale_events.4501.b:0 "Ừ thì… quả là những cánh tay #EMP rất#! cường tráng..."
  ep2_locale_events.4501.b.tt:0 "Rõ ràng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))] của ta có gu thẩm mỹ tuyệt vời!"
  ep2_locale_events.4501.c:0 "Này! Chúng ta rời đi thôi!"
  ep2_locale_events.4501.d:0 "[spying_spouse.GetSheHe|U] chỉ nhìn thôi. Có hại gì đâu."

  ep2_locale_events.4505.t:0 "$tournament_locale_weaponsmith$: Lưỡi Kiếm Lừng Danh"
  ep2_locale_events.4505.desc:0 "Ngay khoảnh khắc ta bước vào lò rèn, mắt [tournament_weaponsmith.GetFirstNamePossessive] mở to. Được ôm trang trọng trong tay [tournament_weaponsmith.GetHerHis] là một tấm vải lụa mềm mại.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U].\" Giọng [tournament_weaponsmith.GetHerHis|U] hơi run. \"Kỹ nghệ và bản lĩnh của ngài với lưỡi kiếm đã trở thành huyền thoại. Ta… ta đã làm thứ này cho ngài.\"\n\n[tournament_weaponsmith.GetSheHe|U] vén tấm vải, để lộ một thanh kiếm lộng lẫy đến choáng ngợp. Khi ta cầm nó trong tay, lập tức cảm nhận được chất lượng thượng hạng — như thể vũ khí này là phần nối dài của chính cánh tay ta.\n\n\"Ta đã rèn nó theo chính phong thái của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]. Sẽ là vinh dự tối thượng nếu ngài chấp nhận nó như một món quà.\""
  ep2_locale_events.4505.a:0 "Vinh dự này là của ta, [tournament_weaponsmith.GetFirstNameNoTooltip]."
  ep2_locale_events.4505.a.tt:0 "Quà tặng ư?! Giá trị của nó chẳng khác nào ngàn thanh kiếm. Ta xin nhận!"
  ep2_locale_events.4505.b:0 "Một vũ khí tinh xảo thế này xứng đáng được trả công đàng hoàng."
  ep2_locale_events.4505.c:0 "Ta không cần những lưỡi kiếm xoàng xĩnh của ngươi!"

  ep2_locale_events.4506.t:0 "$tournament_locale_weaponsmith$: Một Cái Tên Có Ý Nghĩa Gì?"
  ep2_locale_events.4506.desc:0 "\"Nó cần một cái tên.\"\n\nSự ngắt lời của [tournament_weaponsmith.GetFirstNamePossessive] khi ta đang thử vài đường kiếm khiến ta nhướng mày nhìn người thợ rèn.\n\n\"Mọi vũ khí của những bậc anh hùng trong truyền thuyết đều có tên. Đó là lẽ thường! Thanh kiếm của một chiến binh vĩ đại cần một cái tên xứng đáng để khiến kẻ thù run sợ!\" [tournament_weaponsmith.GetFirstNameNoTooltip] khăng khăng."
  ep2_locale_events.4506.a:0 "Ta đã có sẵn một cái tên trong đầu."
  ep2_locale_events.4506.a.tt:0 "[rename_artifact.GetName] nhận một cái tên mới"
  ep2_locale_events.4506.b:0 "Kiếm chỉ là công cụ, không hơn."

  ep2_locale_events.4510.t:0 "$tournament_locale_weaponsmith$: Quà Tặng Chết Chóc"
  ep2_locale_events.4510.desc:0 "Nhìn quanh lò rèn của thợ vũ khí, đủ loại binh khí chết người và vật phẩm tinh xảo lần lượt lọt vào mắt ta.\n\nTâm trí ta chợt nghĩ đến [befriend_target.GetFirstName] khi ánh mắt lướt qua những giá treo lấp lánh.\n\nNếu muốn chiếm được cảm tình của [befriend_target.GetHerHim], ta cần tìm thứ gì đó mà #EMP [befriend_target.GetSheHe]#! sẽ thực sự trân trọng..."
  ep2_locale_events.4510.a:0 "Một vũ khí phụ được chế tác tinh xảo."
  ep2_locale_events.4510.a.tt:0 "#F Đánh vào khía cạnh hiếu chiến của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.4510.b:0 "Thứ gì đó đẹp mắt để trưng bày."
  ep2_locale_events.4510.b.tt:0 "#F Đánh vào khía cạnh yêu vật chất của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.4510.c:0 "I think [befriend_target.GetFirstNameNoTooltip] is a #EMP dagger#! [befriend_target.GetWomanMan]."
  ep2_locale_events.4510.c.tt:0 "#F Đánh vào khía cạnh mờ ám của [befriend_actor.GetFirstNamePossessiveNoTooltip].#!"
  ep2_locale_events.4510.d:0 "Ta sẽ tìm cách khác để gây ấn tượng với [befriend_target.GetHerHim]."
  ep2_locale_events.4511.reply_weapon:0 "Bên trong là một [newly_created_artifact.GetType] được rèn vô cùng chắc chắn, ánh lên vẻ trầm lặng dưới ánh sáng dịu nhẹ.\n\n"
  ep2_locale_events.4511.reply_ornament:0 "Bên trong là một vũ khí trang trí tinh xảo, hợp treo tường hơn là ra chiến trường.\n\n"
  ep2_locale_events.4511.reply_dagger:0 "Bên trong là một con dao găm nhỏ nhưng thanh nhã, lưỡi dao sáng loáng.\n\n"
  ep2_locale_events.4511.opening:0 "Một buổi sáng nọ, ta bất ngờ bị [befriend_actor.GetTitledFirstName] chặn lại, người đó đưa cho ta một gói đồ được bọc kỹ, mỉm cười đầy mong đợi. Một món quà?\n\n"
  ep2_locale_events.4511.success_weapon:0 "$ep2_locale_events.4511.reply_weapon$Không thể phủ nhận tay nghề và tính thực dụng rõ ràng của vũ khí này."
  ep2_locale_events.4511.weapon:0 "$ep2_locale_events.4511.reply_weapon$Tim ta trĩu xuống, ta cần thứ hung hiểm này để làm gì chứ?"
  ep2_locale_events.4511.success_ornament:0 "$ep2_locale_events.4511.reply_ornament$Một tác phẩm tuyệt đẹp, tinh xảo đến mức khó lòng rời mắt."
  ep2_locale_events.4511.ornament:0 "$ep2_locale_events.4511.reply_ornament$Ồ, một món đồ hoàn toàn vô dụng… ít nhất ta cũng có thể bán nó."
  ep2_locale_events.4511.success_dagger:0 "$ep2_locale_events.4511.reply_dagger$Hình dáng kín đáo của nó như mời gọi được nắm chặt và đâm sâu vào mục tiêu."
  ep2_locale_events.4511.dagger:0 "$ep2_locale_events.4511.reply_dagger$Thứ này dùng để làm gì chứ? Đây là công cụ của bọn vô lại."
  ep2_locale_events.4511.a:0 "Dù không muốn thừa nhận, [befriend_actor.GetSheHe] đã gây ấn tượng với ta..."
  ep2_locale_events.4511.b:0 "\"C-cảm ơn. Rất… đẹp.\""
  ep2_locale_events.4512.opening:0 "[befriend_target.GetTitledFirstName] receives my carefully wrapped gift warmly, hefting it in [befriend_target.GetHerHis] hand with a wide grin on [befriend_target.GetHerHis] face.\n\n"
  ep2_locale_events.4512.success_reply:0 "Nụ cười của [befriend_target.GetHerHis|U] càng rạng rỡ hơn khi lớp bọc được tháo ra."
  ep2_locale_events.4512.reply:0 "Sắc mặt [befriend_target.GetHerHis|U] đổi khác khi lớp bọc được tháo ra — đó là tò mò hay thất vọng?"
  ep2_locale_events.4512.success_weapon:0 "\n\n\"À, một [newly_created_artifact.GetType] được rèn bậc thầy. Thứ gì đó… đáng để dựa vào.\""
  ep2_locale_events.4512.weapon:0 "\"Ồ… một [newly_created_artifact.GetType]. Đúng thứ ta cần.\""
  ep2_locale_events.4512.success_ornament:0 "\n\n\"Một món trưng bày tuyệt mỹ! Xứng đáng với bộ sưu tập của bất kỳ quý tộc nào!\""
  ep2_locale_events.4512.ornament:0 "\"Ồ, đồ trưng bày à? Rất… hay.\""
  ep2_locale_events.4512.success_dagger:0 "\"Ồ, cái này tốt lắm, rất tốt… Cân bằng hoàn hảo.\""
  ep2_locale_events.4512.dagger:0 "\"Dùng để chặt… rau củ, chắc vậy?\""
  ep2_locale_events.4512.success:0 "\n\n[befriend_target.GetSheHe|U] chân thành cảm ơn ta. Ta dám chắc việc này không thể suôn sẻ hơn!"
  ep2_locale_events.4512.failure:0 "\n\n[befriend_target.GetSheHe|U] cảm ơn ta một cách lịch sự. Có vẻ nó không mang lại hiệu quả như mong muốn..."
  ep2_locale_events.4512.a:0 "Ta có con mắt tinh tường."
  ep2_locale_events.4512.b:0 "Thật lãng phí..."

  ep2_locale_events.4520.t:0 "$tournament_locale_weaponsmith$: Huyết Dịch Xứng Đáng"
  ep2_locale_events.4520.desc:0 "\"Máu của quý tộc!\" Giọng [tournament_weaponsmith.GetFirstNamePossessive] vang lên, khiến ta giật mình. Ta chớp mắt trong ánh lửa mờ để thấy [tournament_weaponsmith.GetSheHe] đang đứng đó, thèm khát, tay cầm một con dao găm lóe sáng.\n\n\"Ta chỉ cần một #EMP giọt#! máu quý tộc nhỏ thôi để Ta luyện lưỡi kiếm! Thanh kiếm ấy sẽ là vũ khí hoàn hảo nhất từng được tạo ra! Người đời sẽ hát về ta!\" [tournament_weaponsmith.GetSheHe|U] tiến lại gần, ánh điên loạn lóe lên trong mắt [tournament_weaponsmith.GetHerHis].\n\n\"Nó sẽ thuộc về ngài, [ROOT.Char.GetLadyLord], hoàn toàn là của ngài. Ta chỉ cần được là người rèn nó. Hãy cho phép ta điều đó, để tên tuổi chúng ta được khắc ghi mãi mãi!\"\n\nTa cúi nhìn cánh tay mình."
  ep2_locale_events.4520.a:0 "Vì vinh quang. Vì danh tiếng bất diệt!"
  ep2_locale_events.4520.a.success:0 "Quá trình rèn diễn ra thuận lợi"
  ep2_locale_events.4520.a.failure:0 "Quá trình rèn gặp trục trặc"
  ep2_locale_events.4520.b:0 "Ta có thể thử, nhưng để ta chuẩn bị thuốc bôi trước đã..."
  ep2_locale_events.4520.c:0 "Nếu ngươi #EMP chắc chắn#! việc này sẽ thành công..."
  ep2_locale_events.4520.d:0 "Thật nhảm nhí."

  ep2_locale_events.4521.t:0 "$tournament_locale_weaponsmith$: Thép Huyết Sắc"
  ep2_locale_events.4521.start:1 "Ta ép một miếng giẻ sạch lên cẳng tay để cầm máu, trong khi [tournament_weaponsmith.GetFirstName] hăm hở thổi lửa và nện búa không ngừng. Đến khi mục đích của nghi thức đổ máu này hoàn tất, miếng giẻ gần như đã thấm đẫm, nhưng dòng máu thì chậm lại và vết thương bắt đầu đông cứng.\n\nThanh kiếm được đặt xuống bàn với vẻ cung kính."
  ep2_locale_events.4521.success:0 "Đó là một vật trông thật kỳ lạ: máu khô vẫn tiếp tục bong ra khỏi lưỡi kiếm, để lộ những hoa văn dữ dội trong thớ thép. Ta thử uốn độ dẻo, và lưỡi kiếm kêu lên một tiếng răng rắc đầy lo ngại.\n\n"
  ep2_locale_events.4521.failure:0 "Nói gọn trong một từ: xấu xí. Máu khô phủ kín toàn bộ chiều dài lưỡi kiếm, còn trọng lượng của vũ khí thì dường như thay đổi từng khoảnh khắc. Thép giòn được xếp lớp với những vòng xoáy loang lổ, chắp vá.\n\n"
  ep2_locale_events.4521.ending:0 "\"Nó #EMP hoàn hảo#!!\" [tournament_weaponsmith.GetFirstNameNoTooltip] hoàn toàn không bị sự hoài nghi của ta làm chùn bước, tay [tournament_weaponsmith.GetHerHis] run rẩy khi [tournament_weaponsmith.GetSheHe] nâng lưỡi kiếm lên, say mê chiêm ngưỡng."
  ep2_locale_events.4521.a:0 "Ta sẽ lấy nó!"
  ep2_locale_events.4521.b:0 "Ngươi cứ giữ lấy."
 
  ep2_locale_events.5020.t:0 "$tournament_locale_tourney_grounds$: Ấn Tượng Chứ?"
  ep2_locale_events.5020.desc:0 "The tourney grounds are bustling with preparations. The pages run around carrying pieces of armor that make them look like tiny scarecrows. "Wait!" one of them yells, picking up a helmet.\n\nI hear a familiar giggle coming from the tribunes, and I see [impressed_lover.GetTitledFirstName], surrounded by other [impressed_lover.GetWomenMen] who cover their mouths with handkerchiefs. [impressed_lover.GetSheHe|U] doesn't wave at me. [impressed_lover.GetSheHe|U] doesn't need to.\n\n"Coming for some exercise?", [impressed_rival.GetTitledFirstName] walks past me, raising [impressed_rival.GetHerHis] chin, "You'll need it.""
  ep2_locale_events.5020.a:0 "Ta sẽ đảm bảo [impressed_lover.GetFirstNameNoTooltip] đang nhìn."
  ep2_locale_events.5020.a.success:0 "Ngài gây ấn tượng với [impressed_lover.GetShortUIName]"
  ep2_locale_events.5020.a.failure:0 "[impressed_lover.GetShortUIName] không hề ấn tượng"
  ep2_locale_events.5020.b:0 "Ha! Cơ hội hoàn hảo để đe dọa tên [impressed_rival.GetFirstNameNoTooltip] đáng ghét kia."
  ep2_locale_events.5020.b.success:0 "[impressed_rival.GetShortUIName] bị uy hiếp"
  ep2_locale_events.5020.b.failure:0 "[impressed_rival.GetShortUIName] không hề nao núng"
  ep2_locale_events.5020.c:0 "Chỉ có một người ta cần gây ấn tượng. Chính là bản thân ta."
  tournament_ground_flexing:0 "Màn Luyện Tập Ấn Tượng"
  ep2_locale_events.5020.a.success.tt:0 "Mối quan hệ của Ngài với [impressed_lover.GetShortUIName] được cải thiện, tăng [fertility|E]"
 
  ep2_locale_events.1520.t:0 "Hai Mặt Trăng"
  ep2_locale_events.1520.desc:0 "\"Điềm báo! Một dấu hiệu!\" Ta nghe thấy tiếng la hét vọng ra từ [ROOT.Char.GetFaith.HouseOfWorship] khi tiến đến gần cánh cửa. [tournament_priest.GetTitledFirstName] loạng choạng chạy tới chỗ ta, tay chỉ lên bầu trời. Theo ánh mắt hoảng loạn của [tournament_priest.GetHerHis], ta nhìn thấy nó: Mặt trăng. Và một mặt trăng nữa.\n\n\"Ta đã đọc về điều này trong những thư khố cổ,\" [tournament_priest.GetSheHe] tiếp tục, \"nó báo hiệu điều gì đó — nhưng là điều gì?\""
  ep2_locale_events.1520.a:0 "Một điềm lành! Nó báo trước chiến thắng của ta!"
  ep2_locale_events.1520.b:0 "Mặt trăng tròn như tiền xu. Rõ ràng là giàu sang."
  ep2_locale_events.1520.c:0 "Hai cái bóng bị chặt đầu hoàn hảo..."
  ep2_locale_events.1520.d:0 "Ta đã từng thấy chuyện này rồi... trong một cuốn sách về các vì sao."
  ep2_locale_events.1520.e:0 "Nó chẳng có ý nghĩa gì cả."
  tournament_astronomy_modifier:0 "Nhà Thiên Văn"
  tournament_astronomy_modifier_desc:0 "Nhân vật này đã nghiên cứu các vì sao và chuyển động của chúng"
  ep2_locale_events.1520.superstitious:0 "Ngài trở nên mê tín"
 
  ep2_locale_events.3010.t:0 "Không Khí Độc"
  ep2_locale_events.3010.desc:0 "Ngay khoảnh khắc ta bước vào doanh trại, một mùi nồng nặc ập vào mũi. Ta che mũi lại bằng tất cả sự tao nhã có thể, cố không để mình nôn ọe, thì [alerted_physician.GetFirstName] tiến đến, cũng che mũi bằng một chiếc khăn tay.\n\n\"Ngài nên rời đi, [ROOT.Char.Custom('FormOfAddressForLiege')], các thí sinh đang ngã bệnh, bị tổn hại bởi luồng không khí độc,\" [alerted_physician.GetSheHe] cảnh báo ta."
  ep2_locale_events.3010.a:0 "Ắt hẳn phải có lời giải thích. Hãy tìm ra nó."
  ep2_locale_events.3010.a.success:0 "[alerted_physician.GetShortUIName] điều tra doanh trại"
  ep2_locale_events.3010.b:0 "Giải đấu này hẳn đã bị nguyền rủa!"
  ep2_locale_events.3010.b.flavor:0 "Ta sẽ tránh xa doanh trại..."
  ep2_locale_events.3010.c:0 "Ta sẽ không mắc lừa những trò ngu xuẩn này!"
  ep2_locale_events.3010.d:0 "Sao ta phải quan tâm chứ?"
  tournament_not_cursed_modifier:0 "Không Khí Trong Lành"
  tournament_not_cursed_modifier_desc:0 "Nhân vật này đã tránh được luồng không khí độc đầu độc giải đấu"
  ep2_locale_events.3010.a.success.tt:0 "[alerted_physician.GetShortUIName] tìm ra nguyên nhân"
  ep2_locale_events.3010.a.failure:0 "[alerted_physician.GetShortUIName] không tìm được kết quả"
 
  ep2_locale_events.3011.t:0 "$ep2_locale_events.3010.t$: Khí Độc"
  ep2_locale_events.3011.desc:0 "[alerted_physician.GetFirstName] comes back to me with a content smile on [alerted_physician.GetHerHis] face. "I've found the source, [ROOT.Char.Custom('FormOfAddressForLiege')]," [alerted_physician.GetSheHe] announces, trying to contain [alerted_physician.GetHerHis] laughter.\n\n"The guests couldn't find a place to dispose of their... waste, so they've resorted to dumping it into the river. The bad air carries illnesses, as Hippocrates so announced.""
  ep2_locale_events.3011.a:0 "Ta phải cảnh báo họ!"
  ep2_locale_events.3011.b.contestant:0 "Ta sẽ giữ chuyện này cho riêng mình."
  ep2_locale_events.3011.b.champion:0 "Ta chỉ cảnh báo quán quân của mình, [contest_champion.GetFirstNameNoTooltip]."
  ep2_locale_events.3011.b:0 "Tại sao ta phải nói cho họ biết?"
 
  ep2_locale_events.3510.t:0 "Trang Bị Đầy Đủ"
  ep2_locale_events.3510.desc:0 "The warmth of the forge is enough to keep most guests away. When I open the door I find the farrier yawning over [farrier.GetHerHis] work table. Not many seem to have approached [farrier.GetHerHim]. [farrier.GetSheHe|U] quickly straightens, clearing [farrier.GetHerHis] throat with an audible cough.\n\n"May I help you? I can offer you the best horseshoes, ready for the tournament," [farrier.GetSheHe] suggests, displaying a more than impressive collection."
  ep2_locale_events.3510.a:0 "\"Cho ta loại tốt nhất!\""
  ep2_locale_events.3510.b:0 "\"Ta nên mua vài bộ cho các hiệp sĩ của mình...\""
  ep2_locale_events.3510.c:0 "\"Một bùa may mắn!\""
  ep2_locale_events.3510.d:0 "\"Ta ổn rồi, cảm ơn.\""
  ep2_locale_events.3510.a.prowess:0 "[prowess|E] của Ngài tăng"
  ep2_locale_events.3510.a.martial:0 "[martial|E] của Ngài tăng"
  ep2_locale_events.3510.a.prestige:0 "Trang bị mới của Ngài thật ấn tượng"
  tournament_new_horseshoes_modifier:0 "Móng Ngựa Mới"
  good_luck_horseshoe_artifact:0 "Móng Ngựa"
  good_luck_horseshoe_artifact_desc:0 "Một chiếc móng ngựa bằng sắt, được cho là có thể xua đuổi tà ma."
 
  ep2_locale_events.1530.t:0 "Ngươi Trở Về Với Bụi Đất"
  ep2_locale_events.1530.desc.intro:0 "Khoảng sân quanh [ROOT.Char.GetFaith.HouseOfWorship] vắng lặng khi mặt trời sắp lặn. Ta nghe tiếng xào xạc trong đám lá và thấy bóng một con vật nhỏ chạy giữa các bia mộ. Những nét chạm khắc trên một số bia gần như đã biến mất. Trên số khác, chúng vẫn còn rõ ràng.\n\nTa bước một bước về phía chúng"
  ep2_locale_events.1530.desc.young:0 "và cảm thấy chúng thật xa xôi. Gần như không thể chạm tới."
  ep2_locale_events.1530.desc.middle:0 ". Khi đến lượt ta, ta sẽ đảm bảo mình có một nơi an nghỉ tốt hơn thế này."
  ep2_locale_events.1530.desc.old:0 "vì đã muộn rồi. Vì sẽ còn muộn hơn nữa. Vì chưa bao giờ trong đời ta cảm thấy muộn đến vậy."
  ep2_locale_events.1530.a:0 "Ta tự hỏi liệu mình có thể tìm thấy một tổ tiên nào đó không..."
  ep2_locale_events.1530.b.christian:0 "Rồi ta cũng sẽ trở về với bụi đất."
  ep2_locale_events.1530.b.fallback:0 "Rồi sớm thôi cũng đến lượt ta."
  ep2_locale_events.1530.c:0 "Cát bụi về cát bụi! Thật là một cảnh tượng truyền cảm hứng!"
  ep2_locale_events.1530.d:0 "Hừm... nếu như...?"
  ep2_locale_events.1530.a.success:0 "Ngài tìm thấy một tổ tiên trong hầm mộ"
  ep2_locale_events.1530.a.failure:0 "Không có ai quen thuộc ở đây"
 
  ep2_locale_events.4540.t:0 "Trên Lưỡi Kiếm"
  ep2_locale_events.4540.desc.intro:0 "\"Thật là một tác phẩm tuyệt vời mà [weaponsmith.GetSheHe] đã làm!\" Ta nghe một hiệp sĩ tự hào nói khi rời khỏi xưởng. Lưỡi kiếm lấp lánh phản chiếu ánh mặt trời như một hồ nước pha lê.\n\nTa đẩy cửa bước vào và được chào đón bởi một ngọn lửa bùng cháy."
  ep2_locale_events.4540.desc.contestant:0 "\"Ngươi định thi đấu với thứ đó sao?\" người thợ rèn hỏi, chỉ vào [my_weapon.GetNameNoTooltip|l] đang treo bên hông ta."
  ep2_locale_events.4540.desc.fallback:0 "Dù lần này ta không tham gia thi đấu, ta cũng không nên bỏ qua tài nghệ của người thợ thủ công này."
  ep2_locale_events.4540.desc.outro:0 "\n\n\"Nếu ngài có vàng, ta có thép.\""
  ep2_locale_events.4540.a:0 "\"Hãy làm nó chết chóc hơn.\""
  ep2_locale_events.4540.a.tt:0 "Lưỡi kiếm được mài sắc chỉ có hiệu lực trong suốt thời gian diễn ra Giải đấu"
  ep2_locale_events.4540.b.christian:0 "\"Khắc #EMP In Nomine Domini#! dọc theo lưỡi kiếm.\""
  ep2_locale_events.4540.b.fallback:0 "\"Khắc một lời cầu nguyện.\""
  ep2_locale_events.4540.c:0 "\"Ta muốn nó ghi: [my_weapon.GetOwner.GetHouse.GetMotto].\""
  ep2_locale_events.4540.d:0 "\"Ta giữ vàng của mình.\""
  ep2_locale_events_artifact_sharp_desc:0 "[my_weapon.GetDesc]\n\nLưỡi kiếm đã được mài sắc cho giải đấu."
  ep2_locale_events_artifact_prayer_desc:0 "[my_weapon.GetDesc]\n\nMột lời cầu nguyện đã được khắc dọc theo lưỡi kiếm."
  ep2_locale_events_artifact_motto_desc:0 "[my_weapon.GetDesc] Dọc theo lưỡi kiếm có khắc: [my_weapon.GetOwner.GetHouse.GetMotto]."
  artifact_tournament_sharpened_blade_modifier:0 "Lưỡi Kiếm Được Mài Sắc"
  artifact_monthly_piety_7_modifier:0 "Khắc Lời Cầu Nguyện"
  artifact_monthly_prestige_7_modifier:0 "Khắc Khẩu Hiệu"
 
  ep2_locale_events.1060.t:0 "Quân Bài và Kẻ Ngốc"
  ep2_locale_events.1060.desc:0 ""Ha! Đồ vô lại!" Ta nghe ai đó hét lên khi vừa mở cửa. Một [tournament_gambler.GetWomanMan] nở nụ cười mãn nguyện trong lúc [tournament_gambler.GetSheHe] gom số vàng đặt trên bàn. "Hừ!" đối thủ của [tournament_gambler.GetHerHis] càu nhàu, đập tay xuống mặt gỗ khi [tournament_gambler.GetSheHe] đứng dậy.\n\nKẻ lạ mặt nhìn thẳng vào ta, hơi cúi đầu. "Không biết [ROOT.Char.GetTitleAsNameNoTooltip] có muốn tham gia một ván bài chăng? Ta đặt bài của mình xuống, còn ngài cược xem bài của ngài sẽ cao hơn hay thấp hơn. Kẻ thắng lấy tất cả. Đơn giản như lời nói."\n\n"Năm," [tournament_gambler.GetSheHe] nói, đặt lá bài của [tournament_gambler.GetHerHis] xuống."
  ep2_locale_events.1060.a:0 ""Bài của ta cao hơn!""
  ep2_locale_events.1060.b:0 ""Bài của ta thấp hơn!""
  ep2_locale_events.1060.c:0 ""Ta không muốn dính dáng đến cờ bạc.""
  ep2_locale_events.1060.a.success:0 "Ngài thắng gấp đôi"
  ep2_locale_events.1060.a.failure:0 "Ngài mất số vàng đã cược"
 
  ep2_locale_events.4530.t:0 "$tournament_locale_weaponsmith$: Trí Tuệ Của Búa"
  ep2_locale_events.4530.desc:0 "Ta có thể thấy ánh lửa bập bùng từ phía bên kia con đường. Hơi ấm quen thuộc bao bọc cơ thể ta ngay cả trước khi cánh cửa mở ra. Bên trong, người thợ rèn đang xếp ngay ngắn một mẻ đinh.\n\n"Ta có thể giúp gì cho ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]?" [tournament_weaponsmith.GetSheHe] hỏi, trán của [tournament_weaponsmith.GetHerHis] lấm lem than đá. Không khí nơi này đặc quánh lại."
  ep2_locale_events.4530.a:0 ""Ta nghe nói thợ rèn có thể phá giải bùa chú. Xin hãy xoa dịu tâm hồn ta.""
  ep2_locale_events.4530.a.tt:0 "Ngài trở nên Mê tín"
  ep2_locale_events.4530.b:0 ""Ngươi có thể chỉ cho ta một kỹ thuật cao tay không?""
  ep2_locale_events.4530.b.success:0 "Kỹ năng của Ngài được cải thiện"
  ep2_locale_events.4530.b.crit_success:0 "Kỹ năng của Ngài được cải thiện đáng kể"
  ep2_locale_events.4530.b.failure:0 "Ngài bị thương"
  ep2_locale_events.4530.c:0 ""Ngươi có thể cải tiến [improved_weapon.GetNameNoTooltip] của ta không?""
  ep2_locale_events.4530.c.tt:0 "Nhận được #positive_value +2#! [prowess|E]"
  ep2_locale_events.4530.d.success:0 "Việc điều trị có tác dụng!"
  ep2_locale_events.4530.d.nothing:0 "Việc điều trị không mang lại kết quả"
  ep2_locale_events.4530.d:0 ""Cơ thể ta! Nó đau quá! Cứu ta!""
  improved_artifact_desc:0 "[improved_weapon.GetDesc]\n\nĐược cải tiến bởi một thợ rèn lành nghề ngay trước một giải đấu quan trọng."
  ep2_locale_events.4530.e:0 ""Ta chỉ ghé xem qua thôi.""
 
 # TRAINING GROUNDS
  ep2_locale_events.5000.t:0 "Tiếng Gọi Của Thép"
  ep2_locale_events.5000.desc.intro:1 "Khi ta ghé thăm bãi đấu cùng đứa con của mình là [my_child.GetFirstName], chúng ta bắt gặp một nhóm [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] đang huấn luyện dữ dội cho cuộc tranh tài sắp tới. Ta vẫy tay về phía [my_knight.GetTitledFirstName], gần như không thể nhận ra dưới chiếc mũ trụ kia.\n\n""À, điều đó sẽ mang lại vinh quang lớn cho gia tộc chúng ta nếu như..."" nhưng ta nhanh chóng dừng lại khi nhận thấy ánh mắt của [my_child.GetFirstNamePossessiveNoTooltip] đang dán chặt vào những thanh kiếm."
  ep2_locale_events.5000.desc.martial:0 " Điều đó cũng chẳng có gì lạ, xét đến mối quan tâm võ nghệ của [my_child.GetHerHis]."
  ep2_locale_events.5000.desc.non_martial:0 "Ta không hề nhận ra rằng [my_child.GetSheHe] lại hứng thú với những thứ này."
  ep2_locale_events.5000.a:0 ""Thật là một ý hay!""
  ep2_locale_events.5000.b:0 ""Tốt. Vậy thì [my_knight.GetFirstNameNoTooltip] sẽ huấn luyện cho con.""
  ep2_locale_events.5000.c:0 ""Con nghĩ mình có thể sao nhãng bổn phận như vậy sao?""
 
 
  ep2_locale_events.5010.t:0 "$tournament_locale_tournament_grounds$: Sắp Tới Đích"
  ep2_locale_events.5010.desc.intro:1 "Tiến vào bãi đấu, ta nhập vào một nhóm gồm"
  ep2_locale_events.5010.desc.prowess:1 "những [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] lực lưỡng, trao đổi những lời châm chọc trong khi tùy tùng của họ bọc giáp lên từng người."
  ep2_locale_events.5010.desc.mind:1 "các đấu thủ đang trao đổi những chiến thuật quen thuộc, kèm theo những gợi ý đầy kịch tính về các màn phô diễn sắp tới."
  ep2_locale_events.5010.desc.fallback:1 "các đấu thủ đang luyện tập khả năng trình diễn với sự hào hứng có chừng mực."
  ep2_locale_events.5010.desc.outro:1 "\n\nMột vài khán giả đã đứng trên cao nhìn xuống chúng ta. Vừa nhai thịt nướng vừa nhổ xương, lũ dân đen hò hét đòi hỏi một màn biểu diễn.\n\nMột số người trong chúng ta càu nhàu vì bị phân tâm khỏi việc luyện tập. Những kẻ khác, giữa tiếng la ó, lại khăng khăng rằng đây chính là khoảnh khắc để chứng tỏ bản thân."
  ep2_locale_events.5010.a:1 "Ta sẽ cho tất cả các ngươi thấy phải làm thế nào."
  ep2_locale_events.5010.a.success:1 "Việc luyện tập của Ngài thành công"
  ep2_locale_events.5010.a.failure:0 "Việc luyện tập của Ngài trở nên đáng xấu hổ"
  ep2_locale_events.5010.b.good:0 "Ta nhớ lần trước, những ký ức thật tuyệt vời."
  ep2_locale_events.5010.b.bad:0 "Lần này. Lần này ta sẽ làm tốt hơn."
  ep2_locale_events.5010.b.flavor:0 "Một ký ức còn vương vấn trong tâm trí Ngài..."
  ep2_locale_events.5010.c:0 ""Các ngươi nhìn cái gì hả?!""
  ep2_locale_events.5010.c.success:0 "Đám đông bị Ngài làm cho khiếp sợ"
  ep2_locale_events.5010.c.failure:0 "Đám đông cười nhạo Ngài"
  ep2_locale_events.5010.d:0 "Ta nên rời đi thì hơn."
 
  ep2_locale_events.5030.t:0 "Một Tuyển Dụng Mới"
  ep2_locale_events.5030.desc.intro:1 "Các hộ vệ trẻ cười đùa trong lúc đánh bóng mũ trụ và áo giáp xích. Một người khịt mũi to đến mức nghe như tiếng lợn, và những người còn lại nhanh chóng bắt chước theo. Các [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] của họ thì lảng vảng gần đó.\n\nGiữa đám đông ấy, ta nhận ra [poached_councillor.GetTitledFirstName], một cận thần của [councillor_employer.GetTitledFirstNamePossessive]. "
  ep2_locale_events.5030.desc.contestant:0 "Kỹ năng của [poached_councillor.GetHerHis|U] được ca ngợi rộng rãi, và tên tuổi của [poached_councillor.GetHerHis] vang lên như một trong những ứng viên chiến thắng."
  ep2_locale_events.5030.desc.fallback:0 "[poached_councillor.GetHerHis|U] deeds have not gone unnoticed and the work [poached_councillor.GetSheHe]'s done for [poached_councillor.GetHerHis] liege's household is more than impressive."
  ep2_locale_events.5030.desc.outro:0 "\n\nTa có thể thuyết phục [poached_councillor.GetHerHim] gia nhập hội đồng của ta."
  ep2_locale_events.5030.a:0 "Vàng bạc là cám dỗ lớn nhất."
  ep2_locale_events.5030.b:0 ""Một [poached_councillor.GetWomanMan] tài giỏi xứng đáng có một lãnh chúa xứng tầm. Hoặc là chẳng cần lãnh chúa nào cả.""
  ep2_locale_events.5030.b.success:0 "Ngài khiến [poached_councillor.GetShortUIName] khiếp sợ"
  ep2_locale_events.5030.b.failure:0 "[poached_councillor.GetShortUIName] bị xúc phạm bởi sự thô lỗ của Ngài"
  ep2_locale_events.5030.c:0 ""Một cuộc sống danh giá hơn đang chờ đợi ngươi tại triều đình của ta.""
  ep2_locale_events.5030.d:0 ""Chẳng phải chúng ta là Bạn Tốt sao, [poached_councillor.GetFirstNameNoTooltip] thân mến? Hãy theo ta.""
  ep2_locale_events.5030.e:0 "Ta không muốn xúc phạm [councillor_employer.GetTitledFirstNameNoTooltip]."
 
 # VILLAGE
  ep2_locale_events.5500.t:0 "Cổ Xưa Như Đá"
  ep2_locale_events.5500.desc:0 "Một chuyến ghé thăm [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] đúng là điều ta cần để thư giãn trước cuộc tranh tài! Khi dạo bước trên những con phố, ta thấy lũ trẻ địa phương đang giả lập một trận chiến, dùng gậy làm vũ khí và hét lên những câu kiểu như \"vì danh dự của gia tộc ta!\" cùng vô số tiếng \"#EMP arghhhh#!\".\n\nTa dừng lại để chiêm ngưỡng một trong những tòa nhà nổi bật nhất: hiên ngang đứng giữa quảng trường. Tuy nhiên, khi quan sát kỹ hơn, ta nhanh chóng nhận ra vài dòng khắc cổ xưa..."
  ep2_locale_events.5500.a.rome:0 "Khoan đã... đó là tiếng Latin sao?"
  ep2_locale_events.5500.a.fallback:0 "Ha! Ta đã từng học thứ ngôn ngữ cổ này!"
  ep2_locale_events.5500.b:0 "Khối đá này sẽ làm tường rất tốt ở quê nhà!"
  ep2_locale_events.5500.c:0 "Chúng ta phải tiếp tục học hỏi từ họ."
  ancient_stone_artifact:0 "Bia Đá Cổ"
  ancient_stone_artifact_desc:0 "Một tấm bia mang dòng chữ cổ xưa. Có vẻ nó đã được tái sử dụng làm tường làng."
 
  ep2_locale_events.5510.t:0 "$tournament_locale_settlement$: Hẻm Sau"
  ep2_locale_events.5510.desc:0 "Dân địa phương ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] tỏ ra quan tâm đến giải đấu không kém gì giới quý tộc: một số đã dựng các quầy bán tạm ngay tầng trệt nhà mình, và mùi [ROOT.Char.Custom('GetLocalStreetFoodPlural')] thì thật hấp dẫn.\n\nGiữa những tiếng reo hò và trò chuyện, ta nghe thấy vài âm thanh bạo lực hơn phát ra từ một con hẻm; khi tiến lại gần, ta chứng kiến thứ trông như một trận ẩu đả của nông dân, nhưng có một kẻ rõ ràng là giỏi hơn hẳn số còn lại."
  ep2_locale_events.5510.a:0 ""Này ngươi! Ngươi đó! Từ giờ ngươi là hiệp sĩ của ta.""
  ep2_locale_events.5510.a.success:0 "Ngài thuyết phục được [village_thug.GetShortUIName]"
  ep2_locale_events.5510.a.failure:0 "[village_thug.GetShortUIName] tỏ ra không mấy hứng thú"
  ep2_locale_events.5510.b:0 ""Những động tác đó thật ấn tượng, để ta học hỏi xem sao...""
  ep2_locale_events.5510.c:0 ""Dừng lại ngay, lũ man rợ!""
  tournament_stopped_peasant_fight:0 "Đường Phố Yên Bình"
 
  ep2_locale_events.5520.t:0 "$tournament_locale_settlement$: Kéo Từng Sợi Chỉ"
  ep2_locale_events.5520.desc:0 "Một nhóm [village_woman.GetWomenMen] đã chiếm một căn nhà làm xưởng dệt chính, và ta dễ dàng nhận ra họ đang trò chuyện rôm rả về giải đấu đang diễn ra.\n\nTa tựa vào cửa sổ, cẩn thận hết mức để không bị phát hiện.\n\n\"...còn [gossip_knight.GetWomanMan] đó, [gossip_knight.GetFirstName] thì sao? Ta không thể tin được là họ bắt gặp [gossip_knight.GetHerHim] quả tang ngày hôm qua!\" một người nói, trong lúc đôi tay vẫn thoăn thoắt dệt từng sợi chỉ."
  ep2_locale_events.5520.a:0 "Ta có nghe nhầm không vậy?"
  ep2_locale_events.5520.a.success:0 "Họ dường như không nhận ra Ngài"
  ep2_locale_events.5520.a.success.tt:0 "Ngài biết được bí mật của [gossip_knight.GetTitledFirstNamePossessive]"
  ep2_locale_events.5520.a.failure:0 "Họ bắt gặp Ngài đang nghe lén"
  ep2_locale_events.5520.b:0 "Ta có thể học được đôi điều từ kiến thức kỹ thuật của họ..."
  ep2_locale_events.5520.c:0 "Hãy tưởng tượng lượng vàng họ thu được từ việc này..."
  ep2_locale_events.5520.d:0 "Ta không nghe thấy gì cả."
  tournament_supported_weavers:0 "Quan Tâm Nghề Dệt"
  tournament_supported_weavers_desc:0 "Nhân vật này đã dành kha khá thời gian học hỏi từ các thợ dệt trong làng"
  tournament_weaving_taxes_modifier:0 "Thuế Nghề Dệt"
 
  ep2_locale_events.5530.t:0 "Vui Hội"
  ep2_locale_events.5530.desc:0 "Âm nhạc vang lên từ những cánh đồng bao quanh ngôi làng. Lần theo giai điệu, ta tìm đến nguồn cơn: quảng trường được trang hoàng rực rỡ. Sáo, trống lục lạc, và đủ loại nhạc cụ cùng những khúc ca!\n\nNam nữ nhảy múa khắp quảng trường, khi thì tay trong tay, khi thì cất tiếng hát, khi thì xoay vòng, xoay mãi không thôi."
  ep2_locale_events.5530.a:0 "Thần dân của ta hẳn sẽ rất vui khi thấy ta cùng tham gia!"
  ep2_locale_events.5530.b:0 "Thời điểm hoàn hảo để gây ấn tượng với những người xung quanh."
  ep2_locale_events.5530.b.success:0 "Điệu nhảy của Ngài thật ấn tượng"
  ep2_locale_events.5530.b.failure:0 "Ngài trông thật vụng về"
  ep2_locale_events.5530.c.flavor:0 "Trận chiến cũng như một điệu múa của gươm kiếm!"
  ep2_locale_events.5530.c:0 "Những động tác này... có thể hữu ích cho cuộc thi sắp tới!"
  ep2_locale_events.5530.d:0 "Âm nhạc này thật truyền cảm hứng!"
  ep2_locale_events.5530.e:0 "Ta không được xao nhãng việc luyện tập."
  tournament_village_dance_modifier:0 "Vũ Hội Làng"
 
  ep2_locale_events.1070.t:0 "Thời Đã Qua"
  ep2_locale_events.1070.desc.intro:0 "Ta ngồi trong quán rượu cùng một nhóm nhỏ các cận thần, \"Ta thấy hiệp sĩ hào hoa đó cầm biểu trưng của ai đó,\" một người thì thầm, và ta nhanh chóng chìm vào dòng suy nghĩ của riêng mình, quan sát ánh nến chập chờn.\n\nKhi nhấp một ngụm"
  ep2_locale_events.1070.desc.alcohol:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')]"
  ep2_locale_events.1070.desc.no_alcohol:0 "[ROOT.Char.Custom('RegionalDrink')]"
  ep2_locale_events.1070.desc.outro:0 "ta hồi tưởng về lần đó khi [my_memory.GetDescription], nở nụ cười rạng rỡ.\n\n\"Các ngươi có muốn nghe một câu chuyện thật không?\" ta hỏi, quay sang những người Ngài đồng hành."
  ep2_locale_events.1070.a:0 "Đây là khoảnh khắc hoàn hảo cho một cuộc trò chuyện đầy hứng khởi."
  ep2_locale_events.1070.b:0 "Ta cần đảm bảo rằng #EMP chính ta#! trông thật nổi bật."
  ep2_locale_events.1070.c:0 "Ta chỉ muốn tiếp tục uống."
 
  ep2_locale_events.3020.t:0 "Lời Ngọt Ngào"
  ep2_locale_events.3020.desc:0 ""I'll be surprised if [enemy_knight.GetFirstName] doesn't sweep the floor with the other contestants!" I hear as I walk around the camp. A group of visitors are eating around a pot, and I spot the very [enemy_knight.GetTitledFirstNameNoTooltip] sitting with them.\n\n"You exaggerate, my friend," [enemy_knight.GetSheHe] says, as [enemy_knight.Custom('quirk_pos_standalone')|l]. I lock eyes with [enemy_knight.GetHerHim], and give [enemy_knight.GetHerHim] a subtle nod.\n\n"If you'll excuse me," [enemy_knight.GetSheHe] mutters, getting up. "Is there something the [ROOT.Char.GetLadyLord] wants to discuss?""
  ep2_locale_events.3020.a:0 ""Chiến thắng sẽ không mang lại cho ngươi Bạn Bè đâu.""
  ep2_locale_events.3020.a.success:0 "[enemy_knight.GetShortUIName] lắng nghe Ngài"
  ep2_locale_events.3020.a.failure:0 "[enemy_knight.GetShortUIName] bị xúc phạm bởi đề nghị của Ngài"
  ep2_locale_events.3020.b:0 ""Ta là lãnh chúa của ngươi. Ta ra lệnh cho ngươi dừng lại.""
  ep2_locale_events.3020.c:0 "Ta muốn một trận đấu công bằng."

