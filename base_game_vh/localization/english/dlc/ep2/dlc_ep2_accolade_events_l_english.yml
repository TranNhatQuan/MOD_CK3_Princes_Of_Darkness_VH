l_english:
 
  ep2_accolade_events.0100.t:0 "Nghệ thuật Săn bắn"
  ep2_accolade_events.0100.desc:0 "Mù quáng đuổi theo thú hoang, bắn hết mũi tên này đến mũi khác hay thúc ngựa ngày càng điên cuồng sao?\n\n\"Vô ích!\" [huntsmaster.GetName] — [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] lừng danh của ta — cười lớn.\n\nDã thú có thể rất xảo quyệt. Chúng đánh hơi kẻ rình rập từ xa, tản ra trước bầy săn, và trở nên hung hãn khi bị dồn vào chân tường. Hạ gục con mồi đòi hỏi phải hiểu rõ chúng và vùng hoang dã của chúng — và khi tù và đã cất lên thì không bao giờ được chùn bước.\n\nThợ săn lão luyện nhất là [huntsmaster.GetFirstNameNoTooltip]. Khi ở bên [huntsmaster.GetHerHis],"
  ep2_accolade_events.0100.desc.both:0 "ta và [ROOT.Char.Custom2('RelationToMeShort', new_hunter_2)] của ta — [new_hunter_2.GetFirstName] — đang dần thấu hiểu những lối mòn của tạo vật do [ROOT.Char.GetFaith.HighGodName] sinh ra... và cả cách qua mặt chúng."
  ep2_accolade_events.0100.desc.heir:0 "[ROOT.Char.Custom2('RelationToMeShort', new_hunter)] của ta — [new_hunter.GetFirstName] — đang dần thấu hiểu những lối mòn của tạo vật do [ROOT.Char.GetFaith.HighGodName] sinh ra... và cả cách qua mặt chúng."
  ep2_accolade_events.0100.desc.liege:0 "ta đang dần thấu hiểu những lối mòn của tạo vật do [ROOT.Char.GetFaith.HighGodName] sinh ra... và cả cách qua mặt chúng."
  ep2_accolade_events.0100.a:0 "Vào cuộc săn thôi!"
 
  ep2_accolade_events.0200.t:0 "Sắc bén như Lưỡi kiếm"
  ep2_accolade_events.0200.desc:0 "\"Tốt!\" [acclaimed_blademaster.GetName] rạng rỡ. #EMP \"Lần nữa!\"#!\n\nKiếm chạm kiếm, ý chí chạm ý chí. Nhu cầu chiến thắng là tất cả những gì tay kiếm tập sự cảm nhận — nhưng hiệp sĩ bậc thầy [acclaimed_blademaster.GetFirstNameNoTooltip] mỉm cười khi gạt phăng từng đòn đánh.\n\n"

  ep2_accolade_events.0200.desc.both_not_martial:0 "Ta hạ nhịp tấn công, kiệt sức.\n\n\"Bàn tay ngài hiểu rõ kiếm, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] nói, \"bàn tay của [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)] của ngài cũng vậy. Ta có thể... huấn luyện cả hai, nếu đó là điều ngài muốn?\"\n\nTa nhìn chuôi kiếm trong những ngón tay phồng rộp. Liệu ta có nên thách thức số phận sinh ra mình?"
  ep2_accolade_events.0200.desc.liege_not_martial:0 "Ta hạ nhịp tấn công, kiệt sức.\n\n\"Bàn tay ngài hiểu rõ kiếm, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] nói, \"và cả bàn tay của [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)] của ngài nữa. Ta có thể... huấn luyện ngài, như ta đang huấn luyện [new_blademaster_2.GetHerHim], nếu đó là điều ngài muốn?\"\n\nTa nhìn chuôi kiếm trong những ngón tay phồng rộp. Liệu ta có nên thách thức số phận sinh ra mình?"
  ep2_accolade_events.0200.desc.heir_not_martial:0 "Ta hạ nhịp tấn công, kiệt sức.\n\n\"Bàn tay ngài hiểu rõ kiếm, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] nói, \"cũng như... bàn tay của [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)] của ngài. [new_blademaster_2.GetFirstName] đã hỏi liệu ta có thể huấn luyện cả hai không.\"\n\nNgười thừa kế của ta — [new_blademaster_2.GetFirstName] — muốn thách thức số phận sinh ra của [new_blademaster_2.GetHerHis] sao?"
  ep2_accolade_events.0200.desc.both:0 "Ta hạ nhịp tấn công, kiệt sức.\n\n\"Bàn tay ngài hiểu rõ kiếm, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] nói, \"và bàn tay của [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)] của ngài cũng vậy! Có một nghệ thuật trong cơn cuồng nộ ấy: thứ cần được nuôi dưỡng.\""
  ep2_accolade_events.0200.desc.heir:0 "My [ROOT.Char.Custom2('RelationToMeShort', new_blademaster)] [new_blademaster.GetFirstName] slakes [new_blademaster.GetHerHis] assault, exhausted.\n\n"[new_blademaster.GetHerHis|U] hand knows the sword well, [ROOT.Char.Custom('FormOfAddressForLiege')]," says the [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]. "There's an art to [new_blademaster.GetHerHis] fury: something to nurture.""
  ep2_accolade_events.0200.desc.liege:0 "Ta hạ nhịp tấn công, kiệt sức.\n\n\"Bàn tay ngài hiểu rõ kiếm, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] nói. \"Có một nghệ thuật trong cơn cuồng nộ của ngài: thứ cần được nuôi dưỡng.\""

  ep2_accolade_events.0200.a:0 "Hãy để kẻ thù run sợ!"
  ep2_accolade_events.0200.b:0 "Chỉ những ai được phép chiến đấu mới cần biết điều này."
  ep2_accolade_events.0200.b.tt:0 "Dẫu sao thì [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] cũng nhìn vào tấm gương của ta."
 
  defied_martial_custom_modifier:0 "Thách thức Tập tục Võ bị"
  defied_martial_custom_desc:0 "Nhân vật này đã phớt lờ chuẩn mực xã hội khi để những người không phù hợp cầm kiếm."

  ep2_accolade_events.0300.t:0 "Tín điều của Kẻ Chiều Lòng Đám đông"
  ep2_accolade_events.0300.desc:0 "Ngồi cạnh ta trong bữa ăn sáng, [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] của ta — [master_of_revels.GetFirstName] — kể cho ta nghe những hiểu biết hiếm có về giới triều thần, những câu chuyện lộng lẫy và ngớ ngẩn, đồng thời làm biến mất một lượng đáng kinh ngạc thức ăn và đồ uống.\n\n\"Quả ngọt của đời sống đang chờ khắp nơi, thưa [ROOT.Char.GetTitleTierName] của Ta,\" [master_of_revels.GetSheHe] nói, \"chín mọng trên cành, chỉ được nếm khi liều mình trèo lên hái.\"\n\nNiềm hưởng thụ những trái ngọt của đời sống của [master_of_revels.GetFirstNameNoTooltip] là đề tài bàn tán khắp nơi. Luôn luôn, [master_of_revels.GetSheHe] thu hút Tình bạn và sự say mê, một cách vô tư.\n\n"

  ep2_accolade_events.0300.desc.both:0 "Một nguồn cảm hứng náo nhiệt cho người thừa kế của ta — [new_reveler_2.GetFirstName] — và cho chính ta."
  ep2_accolade_events.0300.desc.heir:0 "Một nguồn cảm hứng náo nhiệt cho người thừa kế của ta — [new_reveler_2.GetFirstName]."
  ep2_accolade_events.0300.desc.liege:0 "Ta thấy mình được truyền cảm hứng."
  ep2_accolade_events.0300.a:0 "Vì những đêm vui náo nhiệt và những trái ngọt ngào!"
