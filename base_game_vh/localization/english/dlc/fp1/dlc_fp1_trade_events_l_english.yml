l_english:

 ##################################################
 # #Misc Keys
TRUCE_TRADE_DEAL:1 "\nĐình chiến được ký kết để đổi lấy việc chấm dứt cướp bóc"

 ##################################################
 # #Standard Trade Events
 fp1_trade_events.0000.t:0 "Cướp Bóc hay Giao Thương"
 fp1_trade_events.0002.t:1 "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0002.desc:0 "Khi ta và binh lính chuẩn bị cướp phá vùng đất [county.GetNameNoTierNoTooltip], những toán trinh sát đầu tiên đã quay về báo cáo.\n\nCó vẻ như các thị trấn địa phương rất giàu có, nhưng nhiều nơi được phòng thủ kiên cố, và chúng ta hoàn toàn có thể bị các đạo quân báo thù bắt kịp trước khi kịp đột nhập vào những mục tiêu béo bở nhất.\n\nTuy vậy, chưa phải đã hết hy vọng: nghệ thuật cướp bóc giỏi nằm ở việc nắm bắt cơ hội, và có lẽ chúng ta có thể sắp xếp việc giao thương và nhận cống nạp để đổi lấy việc tra kiếm vào vỏ."
 fp1_trade_events.0002.a:0 "Có lẽ [county.GetHolder.GetTitleAsNameNoTooltip] địa phương sẽ dễ thương lượng chăng?"
 fp1_trade_events.0002.a.accepted:0 "Nếu đề nghị của Ngài được chấp nhận"
 fp1_trade_events.0002.a.rejected:0 "Nếu đề nghị của Ngài bị từ chối"
 fp1_trade_events.0002.a.tt:0 "Ngài tiếp tục cướp bóc [county.GetNameNoTierNoTooltip]"
 fp1_trade_events.0002.b:0 "Một hiệp ước đình chiến với [county.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip] cai trị có thể vô cùng giá trị..."
 fp1_trade_events.0002.c:0 "Phải, có lẽ chúng ta #EMP có thể#! kiếm tiền bằng giao thương. Nhưng cứ cướp phá đi."
 fp1_trade_events.0002.c.tt:0 "$fp1_trade_events.0002.a.tt$"
 fp1_trade_events.0002.d:0 "Loại hèn nhát phong kiến #EMP feudal#! nào lại kiếm tiền mà không đi cướp?"
 fp1_trade_events.0002.d.tt:0 "Ngài cướp phá [county.GetNameNoTierNoTooltip] và từ chối nghĩ đến chuyện giao thương thay vì cướp bóc suốt phần đời còn lại"

 fp1_trade_events.0003.t:1 "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0003.desc:0 "Một đám đông hỗn loạn gồm thổ phỉ, hải tặc và những kẻ lưu manh vũ trang hạng nặng đã tiến vào [county.GetNameNoTierNoTooltip], do [raider.GetFirstName] dẫn đầu!\n\nBan đầu, trinh sát của ta nghĩ chúng đến để cướp bóc, nhưng một sứ giả từ [raider.GetTitleAsNameNoTooltip] của họ tuyên bố rằng họ sẵn sàng giao thương thay thế. Lực lượng của họ đầy ắp chiến lợi phẩm, cả mới lẫn cũ, và điều này sẽ cho người dân địa phương cơ hội mua những món hàng kỳ lạ từ khắp thế giới.\n\nẨn ý đã quá rõ ràng. Giao thương theo những điều khoản thuận lợi và họ sẽ rời đi trong hòa bình, hoặc từ chối đề nghị và họ sẽ lấy bất cứ thứ gì họ muốn."
 fp1_trade_events.0003.a:0 "Một đề nghị bất ngờ, nhưng rất đáng hoan nghênh."
 fp1_trade_events.0003.a.tt_success:0 "Đề nghị của Ngài được chấp nhận!"
 fp1_trade_events.0003.b:0 "#EMP Giao thương#!? Với lũ cướp này sao?!"
 fp1_trade_events.0003.b.tt_failure:0 "Đề nghị của Ngài bị từ chối!"

 fp1_trade_events.0011.t:0 "$fp1_trade_events.0000.t$: Một Thỏa Thuận Êm Đẹp"
 fp1_trade_events.0011.desc.subsequent_renewal:0 "Suốt nhiều thập kỷ"
 fp1_trade_events.0011.desc.first_renewal:0 "Suốt nhiều năm"
 fp1_trade_events.0011.desc.outro:0 "nay, ta đã có một sự thỏa thuận với [recipient.GetTitledFirstName]. Những kẻ cướp của ta giữ vũ khí bên hông khi ở trên đất của [recipient.GetHerHis], và thần dân của [recipient.GetHerHis] mua những xa xỉ phẩm kỳ lạ mà ta mang về từ các vùng đất kém ngoại giao hơn.\n\nTuy nhiên, các điều khoản của thỏa thuận gần như đã hết hiệu lực, và nhiều người trong đoàn tùy tùng của ta không muốn từ bỏ những mối giao thương thuận tiện này.\n\nCó lẽ [recipient.GetFirstNameNoTooltip] sẽ sẵn lòng gia hạn?"
 fp1_trade_events.0011.a:0 "Một đề nghị hậu hĩnh!"
 fp1_trade_events.0011.a.accepted:0 "Đề nghị của Ngài được chấp nhận"
 fp1_trade_events.0011.a.rejected:0 "Đề nghị của Ngài bị từ chối"
 fp1_trade_events.0011.b:0 "Thỏa thuận này đã đến hồi kết..."
 fp1_trade_events.0011.b.tt:0 "Thỏa thuận sẽ âm thầm hết hiệu lực"

 fp1_trade_events.0012.t:0 "$fp1_trade_events.0011.t$"
 fp1_trade_events.0012.desc.subsequent_renewal:0 "$fp1_trade_events.0011.desc.subsequent_renewal$"
 fp1_trade_events.0012.desc.first_renewal:0 "$fp1_trade_events.0011.desc.first_renewal$"
 fp1_trade_events.0012.desc.outro:0 "thỏa thuận của ta với [raider.GetTitledFirstName] vẫn luôn bền vững: [raider.GetSheHe] giữ lũ chó săn của [raider.GetHerHis] trong tầm kiểm soát trên lãnh thổ của ta, và các thương nhân của ta mua chiến lợi phẩm mà [raider.GetSheHe] cướp được từ nơi khác.\n\nKhi thời điểm kết thúc thỏa thuận đang đến gần, [raider.GetFirstNameNoTooltip] đã liên hệ để hỏi về việc gia hạn.\n\nRiêng tư, vài chiến binh giàu có hơn của [raider.GetHerHis] đã đề nghị những món quà chọn lọc nếu ta tiếp tục cho họ tự do tiếp cận thị trường của chúng ta, và quả thực #EMP cũng#! thật dễ chịu khi không phải lo lắng về những kẻ cướp [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] giận dữ tàn phá miền quê..."
 fp1_trade_events.0012.a:0 "Một đề xuất hết sức hợp ý!"
 fp1_trade_events.0012.a.tt_success:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0012.b:0 "Ta đã chán ngấy [raider.GetWomanMan] này."
 fp1_trade_events.0012.b.tt:0 "$fp1_trade_events.0011.b.tt$"
 fp1_trade_events.0012.b.tt_failure:0 "$fp1_trade_events.0011.a.rejected$"

 fp1_trade_events.0021.t:0 "$fp1_trade_events.0000.t$: Những Vị Khách Từ Phương Xa"
 fp1_trade_events.0021.desc:0 "Thỏa thuận giao thương của ta với [partner.GetTitledFirstName] đảm bảo dòng chảy ổn định của các thương nhân và tiểu quý tộc của ta đến thăm lãnh thổ của [partner.GetHerHis], bán chiến lợi phẩm của họ và nhập khẩu những xa xỉ phẩm ngoại quốc.\n\nHiếm hoi hơn nhiều là một đoàn thám hiểm từ [partner.GetPrimaryTitle.GetNameNoTier] tiến đến [ROOT.Char.GetPrimaryTitle.GetNameNoTier], thường trở thành một sự kiện đáng chú ý tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]. Thật hiếm khi thấy nhiều người ngoại quốc xa xôi đến vậy mà tay không bị trói buộc.\n\nNhững người lãnh đạo đoàn thám hiểm đã xin được yết kiến để cầu xin sự bảo trợ: một [priest.GetFaith.PriestNeuter] hùng biện và một thương nhân đầu óc sắc sảo."
 fp1_trade_events.0021.a:0 "Ta có thể cần ai đó đếm tiền giúp mình..."
 fp1_trade_events.0021.b:0 "Chào mừng đến phục vụ ta, [priest.GetFirstNameNoTooltip]!"
 fp1_trade_events.0021.c:0 "Và ai đang đi cùng ngươi phía sau kia?"
 fp1_trade_events.0021.d:0 "Đi tiếp đi, lũ ngoại nhân, thỏa thuận của ta là với [partner.GetFirstNameNoTooltip]."

 fp1_trade_events.0031.t:0 "$fp1_trade_events.0021.t$"
 fp1_trade_events.0031.desc:0 "Những tên cướp của [raider.GetTitledFirstNameNoTooltip] là một đám người đáng sợ, đến mức ta thường cảm thấy biết ơn vì chúng ta coi nhau là những người bạn thận trọng hơn là những kẻ thù đẫm máu.\n\nMột trong những kẻ khủng bố nhỏ #EMP tàn ác#! hơn trong số đó là [warrior.GetFirstName], một kẻ cướp bóc có tiếng tăm không nhỏ.\n\nKhi [warrior.GetSheHe] yêu cầu một cuộc gặp, ta đã nửa phần mong đợi một âm mưu ám sát, nhưng ta #EMP dễ chịu#! ngạc nhiên khi thấy chiến binh trẻ đầy tham vọng này muốn cung cấp dịch vụ của [warrior.GetHerHis]."
 fp1_trade_events.0031.a:0 "Những kiếm [warrior.GetWomenMen] của [raider.GetPrimaryTitle.GetNameNoTierNoTooltip] thật huyền thoại!"
 fp1_trade_events.0031.b:0 "Biến đi, đồ cướp."

 fp1_trade_events.0041.t:0 "$fp1_trade_events.0000.t$: Lợi Ích Từ Kẻ Hiếu Chiến"
 fp1_trade_events.0041.desc:0 "Sự sắp xếp của ta với [partner.GetTitledFirstName] mang lại lợi ích cho cả hai bên, nhưng đôi khi ta tự hỏi liệu nó đã phát huy hết tiềm năng chưa. Lãnh địa của ta có thể cần đến tay nghề của những thợ xây và thợ mộc lão luyện của [partner.GetHerHis], và dù [partner.GetSheHe] an toàn trước các cuộc cướp bóc của ta, nhiều kẻ khác thì không có thỏa thuận như vậy.\n\nChỉ cần cùng nhau chi trả một ít để tạo điều kiện di chuyển cho thuộc hạ, chúng ta có thể giải quyết cả hai vấn đề: [partner.GetFirstNameNoTooltip] gửi những thợ lành nghề đến phục vụ ta một thời gian, và đổi lại, ta cho [partner.GetHerHim] mượn những kẻ cướp già và những người định cư nhiệt huyết làm cố vấn để giúp giữ an toàn cho lãnh thổ của [partner.GetHerHis]."
 fp1_trade_events.0041.foreign_architects_growth.tt:0 "[counties|E] trong [domain|E] chưa phát triển của Ngài"
 fp1_trade_events.0041.foreign_architects_no_growth.tt:0 "[counties|E] trong [domain|E] của Ngài có ít nhất 15 [development|E]"
 fp1_trade_events.0041.partner_gets_raid_aid.tt:0 "Một trong các [duchies|E] dễ bị tổn thương của [partner.GetFirstNamePossessiveNoTooltip] trở nên khó bị [raid|E] hơn"
 fp1_trade_events.0041.raider_gets_civic_aid.tt:0 "[domain|E] của [raider.GetFirstNamePossessiveNoTooltip] nhận tăng trưởng [development|E] và giảm chi phí xây dựng"
 fp1_trade_events.0041.partner.benefiting_counties.tt:0 "[counties|E] trong [duchy|E] được nêu tên"
 fp1_trade_events.0041.a.advanced:0 "Liệu họ có thể xây cho ta một cung điện theo phong cách [partner.GetCulture.GetNameNoTooltip] không?"
 fp1_trade_events.0041.a.fallback:0 "Những đôi tay lành nghề luôn được chào đón..."
 fp1_trade_events.0041.a.offer_accepted:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0041.a.offer_rejected:0 "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0041.b:0 "Cứ giữ mọi thứ ở mức không chính thức."

 fp1_trade_events.0051.t:0 "$fp1_trade_events.0041.t$"
 fp1_trade_events.0051.desc:0 "Đối tác giao thương khi có khi không của ta, [raider.GetTitledFirstName], đã gửi lời đề nghị đầy thú vị. Dù đúng là lãnh địa của ta an toàn trước những kẻ cướp của [raider.GetHerHis], điều đó không đúng với nhiều tên vô lại và du thủ khác, trong khi lãnh thổ của [raider.GetHerHis] lại nghèo nàn và kém phát triển.\n\nNếu cả hai cùng chi trả chi phí đi lại cho thuộc hạ, [raider.GetFirstNameNoTooltip] đề xuất một dạng chương trình trao đổi: những chiến binh lão luyện và người định cư từ lãnh thổ của [raider.GetHerHis] sẽ được gửi đến bảo vệ một biên cương dễ tổn thương của ta khỏi những tên trộm ít thân thiện hơn, còn những thợ xây và thợ mộc lành nghề từ vương quốc của ta sẽ phục vụ một thời gian trong [raider.GetHerHis] domain."
 fp1_trade_events.0051.offer_accepted:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0051.offer_rejected:0 "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0051.a:0 "[option_1.GetNameNoTierNoTooltip] có thể cần vài chuyên gia..."
 fp1_trade_events.0051.b:0 "[option_2.GetNameNoTierNoTooltip] có lẽ là nơi phù hợp cho họ?"
 fp1_trade_events.0051.c:0 "Ta nghĩ ta muốn củng cố [option_3.GetNameNoTierNoTooltip] hơn."
 fp1_trade_events.0051.d:0 "Thật là một đề xuất lố bịch!"

 ##################################################
 # Special Trade Events
 fp1_trade_events.1131.t:0 "Hiểm Họa Phương Bắc"
 fp1_trade_events.1131.desc:0 "Một đám cướp biển rời rạc, những người tự do không đất đai, những đứa trẻ thấp kém tuyệt vọng và những kẻ bất lương đủ loại khác đã tham gia cùng [attacker.GetFirstName] trong cuộc tấn công đề xuất của [attacker.GetHerHis] chống lại tài sản của ta.\n\nMặc dù quy mô của lực lượng rất đáng gờm, họ thiếu kỷ luật hoặc lòng trung thành, với mỗi tên lính đánh thuê được thu gom chỉ tập trung độc quyền vào những gì chúng có thể nhận được từ cuộc chiến trước tiên và quan trọng nhất.\n\nKhông giống như một kẻ thù thông thường, có thể chỉ cần đối phó trực tiếp với những kẻ xâm lược. Có lẽ một thỏa thuận có thể được thực hiện..."
 fp1_trade_events.1131.a:0 "Không bao giờ! Cút về vùng địa ngục băng giá của các ngươi đi, lũ cặn bã!"
 fp1_trade_events.1131.b:0 "Nếu chúng muốn đất, sao không cho chúng?"
 fp1_trade_events.1131.c:0 "Theo kinh nghiệm của ta, binh lính thích vàng hơn vinh quang..."
 fp1_trade_events.1131.c.tt:0 "Ngài trả một khoản gafol trực tiếp cho quân lính của [attacker.GetFirstNamePossessiveNoTooltip] để họ giải tán"
 fp1_trade_events.1131.d:0 "Chúng ta sẽ trục xuất lũ xâm lược này như vẫn thường làm."
 fp1_trade_events.1131.d.tt:0 "Ngài chiến đấu với người Bắc Âu theo cách truyền thống"

 fp1_trade_events.1171.t:0 "$fp1_trade_events.0000.t$: Bàn Tay Thánh Thiện Trợ Giúp"
 fp1_trade_events.1171.desc:0 "Mặc dù bắt đầu dưới những hoàn cảnh #EMP bất thường#!, mối quan hệ của ta với [partner.GetTitledFirstName] chỉ trở nên bền chặt hơn theo thời gian.\n\nMạnh mẽ hơn, có vẻ như, hơn ta tưởng tượng, vì lá thư cuối cùng của [partner.GetHerHis] bày tỏ sự quan tâm chân thành đến số phận linh hồn của ta.\n\nTrong một nỗ lực để dụ dỗ ta cải sang [partner.GetFaith.GetName], [partner.GetFirstNameNoTooltip] đang đề nghị trao tay [partner.GetHerHis] [prospective_spouse.Custom('GetDaughterSon')], một buổi lễ lớn để chào đón ta vào đức tin, #EMP và#! một của hồi môn hậu hĩnh."
 fp1_trade_events.1171.a:0 "[partner.GetSheHe|U] quả thật #EMP đưa ra#! một lời đề nghị rất thuyết phục..."
 fp1_trade_events.1171.b:0 "Thật là một nghĩa cử! Vì tình bằng hữu bền lâu!"
 fp1_trade_events.1171.b.tt:0 "Tất cả các hiệu ứng trên, cùng với..."
 fp1_trade_events.1171.c.cynical:0 "Hừ, ta mong một khoản hối lộ khá hơn thế."
 fp1_trade_events.1171.c.fallback:0 "Không loại hối lộ nào có thể khiến ta rời bỏ [raider.GetFaith.GetNameNoTooltip]."
