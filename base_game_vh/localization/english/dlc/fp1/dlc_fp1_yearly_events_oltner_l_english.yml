l_english:
 fp1_yearly.2000.t:0 "Khao Khát Phiêu Lưu"
 fp1_yearly.2000.desc:0 "\"Con đi đây, [parent.GetMotherFather]. Con và [lover_of_child.GetFirstNameNoTooltip] đang #EMP yêu nhau#!\"\n\nTa đảo [ROOT.Char.Custom('EyeEyes')] của mình về phía [child_to_leave.GetFirstNameNoTooltip]. Đứa [child_to_leave.Custom('GetDaughterSon')] ngu ngốc của ta lại đang làm trò gì #EMP đây#!?\n\n\"[lover_of_child.GetFirstNameNoTooltip] và con sẽ tìm kiếm phiêu lưu! Thế giới rất rộng lớn, và có vinh quang đang chờ đón! Con muốn hét lên #EMP '[child_to_leave.GetHouse.GetMotto]'#! với cả thế giới, cho đến khi nó nhớ tên con!\"\n\nRõ ràng là đứa [child_to_leave.Custom('GetDaughterSon')] #EMP yêu quý#! của ta đang nghiêm túc. Ta sẽ phải làm gì đó."
 fp1_yearly.2000.a:0 ""Lại đây nào, [child_to_leave.Custom('GetDaughterSon')] yêu quý, ta nghĩ đã đến lúc cần chút #EMP yêu thương nghiêm khắc#! rồi.""
 fp1_yearly.2000.b:0 ""Nghe đây, #EMP vinh quang#! cũng có thể tìm thấy ngay tại quê nhà.""
 fp1_yearly.2000.c:0 ""Có lẽ #EMP thứ này#! sẽ khiến con quên chuyện rời đi chăng?""
 fp1_yearly.2000.d:0 ""Rồi con sẽ quay về thôi, cứ chờ xem...""
 fp1_yearly.2000.d.tt:0 "#weak "...rồi con sẽ nhớ mình thuộc về nơi nào."#!"
 fp1_yearly.2000.a.tt:0 "#V Đấu tay đôi#! với [child_to_leave.GetFirstName] để buộc [child_to_leave.GetHerHim] ở lại!\n#weak Trận đấu KHÔNG phải đến chết.#!\nNếu Ngài thắng, Ngài sẽ nhận [prestige_i] [prestige|E]\n\n[prowess|E] của Ngài: [prowess_i]#V [parent.GetProwess]#!\n[prowess|E] của [child_to_leave.GetFirstNamePossessive]: [prowess_i]#V [child_to_leave.GetProwess]#!"
 fp1_yearly.2000.c.tt:0 "[child_to_leave.GetFirstName] ở lại [court|E] của Ngài"
 fp1_yearly.2000.b.tt:0 "Ở lại [court|E] của Ngài"
 lust_for_adventure:0 "Khao Khát Phiêu Lưu"
 lust_for_adventure_desc:0 "Nhân vật này khao khát phiêu lưu và du hành. Họ khó có khả năng quay về triều đình của cha mẹ."
 mellowed_spirit:0 "Tinh Thần Lắng Dịu"
 mellowed_spirit_desc:0 "Nhân vật này đã được cha/mẹ thuyết phục rằng phiêu lưu không dành cho mình, và vị trí của họ là ở quê nhà."
 fp1_yearly.2003.t:0 "Khao Khát Phiêu Lưu: Yêu Thương Nghiêm Khắc"
 fp1_yearly.2003.desc:0 ""Con chịu thua! Con chịu thua rồi, [parent.GetMotherFather]! Đừng nữa!" [child_to_leave.Custom('GetDaughterSon')] của ta kêu lên.\n\n"Con sẽ ở lại triều đình. [lover_of_child.GetFirstNameNoTooltip] không quan trọng hơn mạng sống của con!" [child_to_leave.GetFirstNameNoTooltip] nói, trong khi [lover_of_child.GetFirstNameNoTooltip] nhìn đầy vẻ bất mãn.\n\nCuối cùng thì có vẻ như [child_to_leave.GetFirstNameNoTooltip] cũng đã hiểu ra!"
 fp1_yearly.2003.a:0 ""[parent.GetMotherFather|U] luôn biết điều gì là tốt nhất, [child_to_leave.Custom('GirlBoy')] yêu quý.""
 fp1_yearly.2003.b:0 ""Và cắt đứt luôn với '[lover_of_child.GetFirstNameNoTooltip]' đó nữa!""
 fp1_yearly.2000.trigger_failure:0 "Trận đấu tay đôi giữa ta và [child_to_leave.GetFirstNameNoTooltip] đã bị hủy bỏ"
 fp1_yearly.2004.t:0 "Khao Khát Phiêu Lưu: Bị Đánh Bại"
 fp1_yearly.2004.desc:0 "Ta bị đánh ngã, kiệt sức sau trận chiến, khi [child_to_leave.GetFirstNameNoTooltip] tiến lại gần với vũ khí trong tay.\n\n"Con đã nói rồi, con #EMP sẽ rời đi#!, [parent.GetMotherFather]. Đền bù cho những rắc rối này, con sẽ lấy một túi vàng từ ngân khố. Chắc người hiểu mà."\n\nTa chỉ có thể bất lực nhìn [child_to_leave.Custom('GetDaughterSon')] của mình rời đi, một tay khoác [lover_of_child.GetFirstNameNoTooltip], tay kia cầm theo #EMP vàng của ta#!."
 fp1_yearly.2004.a:0 "Đứa con hỗn xược..."
 fp1_yearly.2000.b.success:0 "[child_to_leave.GetFirstNameNoTooltip] từ bỏ những hy vọng và ước mơ của [child_to_leave.GetHerHis]"
 fp1_yearly.2000.b.failure:0 "[child_to_leave.GetFirstNameNoTooltip] không bị thuyết phục bởi những lời của Ngài"

 fp1_yearly.2100.t:0 "Cuộc Cạnh Tranh Nảy Lửa"
 fp1_yearly.2100.desc:0 "\"Đồ [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))]! Đồ [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultNoun', SCOPE.sC('lover_1'))]! [lover_2.Custom2('InsultSentence', SCOPE.sC('lover_1'))|U], đồ [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))]!\" [lover_1.GetFirstName] hét lên hết cỡ phổi [lover_1.GetHerHis].\n\nCó vẻ như những người tình của ngươi đang muốn giết nhau.\n\n\"Cái [lover_1.Custom2('PointOfRidicule', SCOPE.sC('lover_2'))] của ngươi làm [lover_quarrel_target.GetHerHim] buồn nôn vì ghê tởm, đồ [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))]. [lover_quarrel_target.GetFirstNameNoTooltip] không thể yêu một kẻ [lover_1.Custom2('InsultAdjective', SCOPE.sC('lover_2'))] [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))] như ngươi! #EMP [lover_quarrel_target.GetSheHe|U] sẽ chỉ là của ta!#!\" [lover_2.GetFirstName] hét lên, rút [lover_2.Custom('SignatureWeaponArticle')] [lover_2.Custom('signature_weapon')] từ thắt lưng của [lover_2.GetHerHis]...\n\nChuyện này sắp trở nên đẫm máu rồi."
 fp1_yearly.2100.a:0 "Thật #EMP kích thích!#! Đúng vậy! Hãy chiến đấu vì tình yêu của ta!"
 fp1_yearly.2100.b:0 "Thật #EMP điên rồ!#! Ta cầu xin các ngươi, dừng lại ngay!"
 fp1_yearly.2100.c:0 "Ta sẽ tự mình ngăn các ngươi!"
 fp1_yearly.2100.a.tt:0 "[lover_1.GetFirstName] và [lover_2.GetFirstName] #V Đấu tay đôi#! đến chết."
 fp1_yearly.2100.b.tt:0 "[lover_1.GetFirstName] và [lover_2.GetFirstName] bình tĩnh lại."
 fp1_yearly.2101.t:0 "Cuộc Cạnh Tranh Nảy Lửa: Trái Tim Tan Vỡ"
 fp1_yearly.2101.desc:0 ""Giờ thì em hoàn toàn thuộc về ta rồi, [lover_quarrel_target.Custom('RomanticComplimentAdjective')] [lover_quarrel_target.GetFirstNameNoTooltip] của ta! Cái tên [lover_2.Custom2('InsultNounSexual', SCOPE.sC('winning_lover'))] [losing_lover.GetFirstName] đó sẽ không bao giờ xen vào giữa chúng ta nữa!" [winning_lover.GetFirstName] thì thầm ngọt ngào khi [winning_lover.GetSheHe] đặt [winning_lover.GetHerHis] [winning_lover.Custom('signature_weapon')] xuống đất.\n\n"Đến đây nào, [lover_quarrel_target.Custom('RomanticComplimentAdjective')] [lover_quarrel_target.Custom('RomanticComplimentNoun')] của ta. Màn kịch này thật mệt mỏi, sao chúng ta không lui về [ROOT.Char.Custom('GetChamber')] của nàng/chàng?" [winning_lover.GetFirstNameNoTooltip] gợi ý đầy quyến rũ."
 fp1_yearly.2101.a:0 "Ôi, [winning_lover.Custom('RomanticComplimentNoun')] của ta! Chàng thật biết cách chinh phục một [lover_quarrel_target.GetWomanMan]!"
 fp1_yearly.2101.b:0 "[losing_lover.GetFirstNameNoTooltip], không! #EMP Ngươi sẽ phải trả giá vì chuyện này, [winning_lover.GetFirstNameNoTooltip]!#!"
 fp1_yearly.2101.c:0 "Một cuộc vui trên đống cỏ khô? Tại sao không."
 fp1_yearly.2101.d:0 "Cứ... để ta yên một lúc."
 fp1_yearly.2100.b.success:0 "Những lời yêu thương của Ngài khiến cả hai bình tĩnh lại"
 fp1_yearly.2100.b.failure:0 "Lời nói của Ngài như nước đổ lá khoai"
 fp1_yearly.2100.c.success:0 "Ngài tách được hai kẻ đang ẩu đả"
 fp1_yearly.2100.c.failure:0 "Ngài không kịp ngăn lại"
 fp1_yearly.2100.c.tt:0 "Ngài ngăn [lover_1.GetFirstName] và [lover_2.GetFirstName] khỏi đánh nhau."
 
 fp1_yearly.2200.t:0 "Kẻ Cuồng Chiến Chán Chường"
 fp1_yearly.2200.desc:0 ""Hãy chiêm ngưỡng! Ta là [new_berserker.GetFirstNameNoTooltip] — kẻ [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))|U] — hãy mang đến cho ta những vại bia đầy ắp, [new_berserker.Custom('AttractionWomanManMultiple')], và [new_berserker.Custom('FavoriteTreatDemand')]! Kẻo các ngươi dám khơi dậy cơn thịnh nộ của ta!?" [new_berserker.GetWomanMan] gào lên với đám đông tụ tập.\n\nRõ ràng chiến binh to lớn này đang chán chường và tìm kiếm rắc rối. Có lẽ cơn cuồng nộ của [new_berserker.GetHerHis] sẽ được dùng tốt hơn nếu đứng trong hàng ngũ của ta?\n\n"Chẳng lẽ không ai dám đối mặt với ta sao? Lũ hèn nhát! Ta sẽ đánh đổi tất cả để có một trận ẩu đả ra hồn...""
 fp1_yearly.2200.a:0 "Không ai được gọi ta là hèn nhát, đồ [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))] [new_berserker.Custom2('InsultNoun', ROOT.Char)]!"
 fp1_yearly.2200.b:0 "Ta sẽ mang cho ngươi thật nhiều [new_berserker.Custom('FavoriteTreatDemand')] — nếu ngươi gia nhập hàng ngũ của ta."
 fp1_yearly.2200.c:0 "Chúng ta sắp đi cướp bóc, sao ngươi không gia nhập làm [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] của ta?"
 fp1_yearly.2200.d:0 "Lính canh! Bắt lấy [new_berserker.GetWomanMan] đó!"
 fp1_yearly.2200.a.tt:0 "#V Đấu tay đôi#! với [new_berserker.GetFirstName] để khiến [new_berserker.GetHerHim] phục vụ làm [potential_employer.Custom('KnightCultureNoTooltipLowercase')] của Ngài!\n#weak Trận đấu này KHÔNG phải tử chiến.#!\nDù Ngài thua, có lẽ cơn thịnh nộ của [new_berserker.GetFirstNamePossessiveNoTooltip] cũng sẽ được xoa dịu...\n\n[prowess|E] của Ngài: [prowess_i]#V [potential_employer.GetProwess]#!\n[prowess|E] của [new_berserker.GetFirstNamePossessive]: [prowess_i]#V [new_berserker.GetProwess]#!"
 fp1_yearly.2200.c.success:0 "[new_berserker.GetFirstNameNoTooltip] đồng ý gia nhập hàng ngũ của Ngài"
 fp1_yearly.2200.c.failure:0 "[new_berserker.GetFirstNameNoTooltip] nổi cơn thịnh nộ trong triều đình của Ngài"
 fp1_yearly.2200.fail.tt:0 "[new_berserker.GetFirstNameNoTooltip] làm bị thương [potential_victim.GetFirstName] trong cơn cuồng nộ của [new_berserker.GetHerHis]!"
 hurt_someone_close_to_me_crime:0 "Làm Tổn Thương Người Thân Cận Của Ta"
 fp1_yearly.2200.d.success:0 "[new_berserker.GetFirstNameNoTooltip] bị đánh chết"
 fp1_yearly.2200.trigger_failure:0 "Trận đấu tay đôi của ta với [new_berserker.GetFirstNameNoTooltip] đã bị vô hiệu"
 fp1_yearly.2203.t:0 "Kẻ Cuồng Chiến Chán Chường: Cơn Thịnh Nộ Được Xoa Dịu"
 fp1_yearly.2203.desc:0 ""Ngươi mạnh hơn vẻ bề ngoài đấy!" [new_berserker.GetFirstNameNoTooltip] thở hổn hển.\n\n[new_berserker.GetWomanMan] nằm đẫm máu trên mặt đất, cơn thịnh nộ của [new_berserker.GetHerHis] tạm thời được xoa dịu... ít nhất là lúc này.\n\n"Ta sẽ rất vui khi chiến đấu bên cạnh ngươi, cùng nhau chúng ta sẽ #EMP không thể bị ngăn cản!#!" hắn hét lên."
 fp1_yearly.2203.a:0 ""Ta xin lỗi, nhưng con đường của ngươi kết thúc tại đây.""
 fp1_yearly.2203.b:0 ""Ta rất vinh dự được chiến đấu cùng ngươi!""
 fp1_yearly.2203.c:0 ""Ngươi đã gây đủ thiệt hại rồi. Rời đi, ngay lập tức.""
 fp1_yearly.2204.t:0 "Kẻ Cuồng Chiến Chán Chường: Người Khổng Lồ Hiền Lành"
 fp1_yearly.2204.desc:0 ""Ta xin lỗi." [new_berserker.GetFirstNameNoTooltip] nói với giọng đầy xúc động. "Ta trở nên giận dữ khi đói."\n\n[new_berserker.GetWomanMan] to lớn đưa tay [new_berserker.GetHerHis] ra kéo ta đứng dậy. Cơn thịnh nộ của [new_berserker.GetHerHis|U] dường như đã lắng xuống... ít nhất là lúc này.\n\n"Ta rất thích trận đấu của chúng ta. Ta sẵn lòng gia nhập cùng ngươi, bằng hữu." hắn nói."
 fp1_yearly.2204.a:0 ""Và ta cũng sẵn lòng chào đón ngươi, bằng hữu!""
 fp1_yearly.2204.b:0 ""Làm ơn, hãy rời đi...""
 
 grizzled_veterans:0 "Những Cựu Binh Dày Dạn"
 glory_seekers:0 "Những Kẻ Tìm Vinh Quang"
 fp1_yearly.2300.t:0 "Những Kẻ Tìm Vinh Quang"
 fp1_yearly.2300.desc:0 "Các quán rượu ở [tavern_location.GetNameNoTier] gần đây tràn ngập những chiến binh khao khát vinh quang.\n\nTrong số đó — một nhóm cựu binh già dặn và dày dạn trận mạc, những huscarl đang tìm kiếm một [recruiting_character.Custom('MistressMaster')] mới.\n\nNgoài ra còn có cả một đám đông trai trẻ đầy nhiệt huyết nói không ngừng về việc tìm kiếm vinh quang nơi bờ biển xa lạ.\n\nCó lẽ ta nên chiêu mộ một vài người trong số họ?"
 fp1_yearly.2300.a:0 "Ta sẽ đưa các huscarl vào gia đình của mình."
 fp1_yearly.2300.b:0 "Đám trai trẻ thì thiếu kinh nghiệm — nhưng họ rất đông!"
 fp1_yearly.2300.c:0 "Đã đến lúc tăng gấp đôi giá bia!"
 fp1_yearly.2300.d:0 "Hãy theo ta, những chiến binh dũng cảm! Ta sẽ dẫn các ngươi đến vinh quang!"
 huscarls_tt:0 "#F Huscarls là những chiến binh tuyến đầu cứng cáp có khả năng gây rất nhiều sát thương lên quân yếu hơn#!"
 bondi_tt:0 "#F Bondí bền bỉ và xuất sắc khi chiến đấu trên đồng bằng hoặc đất nông nghiệp ở những bờ biển xa lạ#!"
 
 fp1_yearly.2400.t:0 "Chuẩn Bị Cho Cuộc Săn"
 fp1_yearly.2400.desc:0 "Thiên nhiên hoang dã đang gọi ta. Đã quá lâu kể từ lần cuối ta đi săn. Ngoài kia, trong vùng [ROOT.Char.Custom('TerrainType')] của [hunting_province.GetName], có rất nhiều [ROOT.Char.Custom('GetAnimalAdjective')] [ROOT.Char.Custom('GetAnimalPlural')]. Một trong số chúng sẽ rất hợp trên bàn ăn tối nay!\n\nNhưng vẫn còn thiếu điều gì đó. Có phải những cây lao săn của ta đã quá cũ và cùn? Hay là ta thiếu một Ngài đồng hành?\n\nTa nên chuẩn bị thật kỹ."
 fp1_yearly.2400.a:0 "Ta cần một chú chó săn mới!"
 fp1_yearly.2400.eagle: "Một con đại bàng săn mồi sẽ phục vụ ta rất tốt!"
 fp1_yearly.2400.b:0 "Những cây lao mới rèn, và mũi tên gắn lông quạ."
 fp1_yearly.2400.c:0 "Những gì ta có là đủ. Ta chỉ cần thời gian chuẩn bị."
 fp1_yearly.2400.free_hunt:1 "Hoạt động [GetActivityType('activity_hunt').GetName] tiếp theo của Ngài sẽ không tốn [gold|E]"
 brand_new_hunting_tools:0 "Dụng Cụ Săn Mới Tinh"
 brand_new_hunting_tools_desc:0 "Nhân vật này đã chi rất nhiều vàng cho trang bị săn bắn mới."
 
 fp1_yearly.2500.t:0 "Tảng Đá Rune Trụy Lạc"
 fp1_yearly.2500.desc:0 "Sau một chặng đường dài xuyên qua vùng [runestone_location.Custom('TerrainTypeCountyScope')] của [runestone_location.GetNameNoTier], ta đến nơi đặt tảng đá rune của gia tộc mình. Nhưng có vẻ ta không đơn độc, vị khách của ta là [deviant_guest.GetTitledFirstName] cũng ở đây — làm sao [deviant_guest.GetSheHe] tìm được nơi này!?\n\n"Không phải như ngài nghĩ đâu, thưa [ROOT.Char.GetTitleTierName]!" [deviant_guest.GetSheHe] biện hộ.\n\nViệc [deviant_guest.GetSheHe] đang bán khỏa thân và ra sức cọ xát [deviant_guest.GetHerselfHimself] vào #EMP tảng đá rune của gia tộc ta#! cho ta biết rằng thực ra nó đúng y như những gì ta thấy."
 
 fp1_yearly.2600.t:0 "Cơn Thịnh Nộ Của Người Phương Bắc"
 fp1_yearly.2600.desc:0 "\"[ROOT.GetCharacter.GetFirstNameNoTooltip], ngươi là một chiến binh vĩ đại, nhưng kẻ thù của ngươi có #EMP thực sự#! sợ ngươi không?\" [berserker_teacher.GetFirstName] nói.\n\nTa đã thấy [berserker_teacher.GetFirstNameNoTooltip] đưa bản thân vào một sự cuồng nộ không tưởng trên chiến trường, và ta đã thấy vô số kẻ thù chạy trốn trước hình dáng hú hét của [berserker_teacher.GetHerHis]. Chứng kiến trạng thái berserker của [berserker_teacher.GetFirstNamePossessiveNoTooltip] giống như chứng kiến cơn thịnh nộ của chính [ROOT.GetCharacter.GetFaith.HighGodName] vậy.\n\n\"Hãy tham gia cùng ta trước đống lửa. Hãy để chúng ta khơi dậy cơn thịnh nộ của ngươi.\" [berserker_teacher.GetSheHe|U] vẫy tay gọi."
 fp1_yearly.2600.a:0 "Để ta lấy tấm da gấu của mình!"
 fp1_yearly.2600.b:0 "Không, ta thích giữ toàn quyền kiểm soát."
 fp1_yearly.2600.a.tt:0 "Cố gắng trở thành một [GetTrait('berserker').GetName( GetNullCharacter )]\n#weak Có thể sẽ có rủi ro...#!"
 fp1_yearly.2600.b.tt:0 "Từ bỏ cơ hội trở thành một [GetTrait('berserker').GetName( GetNullCharacter )]"
 fp1_yearly.2601.desc:0 "Chúng ta ngồi bên lửa, tụng niệm những lời đầy quyền năng — ta nghiến răng và nhắm mắt lại. Những cơn rùng mình chạy dọc cơ thể, có điều gì đó đang trỗi dậy bên trong ta... bao trùm lấy ta.\n\nTa tỉnh dậy khỏi cơn cuồng loạn, "
 fp1_yearly.2601.success_no_one_harmed:0 "[berserker_teacher.GetFirstName] ở bên cạnh ta.\n\n"Ngươi đã triệu hồi một cơn thịnh nộ thật ấn tượng! Đám khúc gỗ đó chẳng có cơ hội nào!" [berserker_teacher.GetFirstNameNoTooltip] cười toe.\n\nRõ ràng ta đã hoạt động trong cơn cuồng loạn suốt cả đêm! Ít nhất thì chúng ta sẽ không thiếu củi trong nhiều tuần..."
 fp1_yearly.2601.success_harm_close_one:0 "[berserker_teacher.GetFirstName] đang giữ chặt vai ta.\n\n"Ngươi phải tỉnh lại! [harmed_victim.GetFirstName] không phải kẻ thù của ngươi!" [berserker_teacher.GetFirstNameNoTooltip] hét lên.\n\nNhân danh [ROOT.GetCharacter.GetFaith.HighGodName], ta đã làm gì vậy!?"
 fp1_yearly.2601.success_kill_berserker:0 "xác thân bị tàn phá của [berserker_teacher.GetFirstNamePossessive] nằm bên cạnh ta. Ta nhìn xuống hai bàn tay siết chặt của mình, cả hai vẫn đang cầm những chiếc rìu đẫm máu...\n\nNhân danh [ROOT.GetCharacter.GetFaith.HighGodName], ta đã làm gì vậy!?"
 fp1_yearly.2601.success_kill_everyone:0 "máu ở khắp xung quanh ta. Tất cả đều đã chết. #EMP Tất cả đều đã chết.#!\n\n#EMP Ta đã làm gì vậy!?#!"
 fp1_yearly.2601.fail_fall_asleep:0 "cảm thấy sảng khoái như một đứa trẻ sơ sinh! [berserker_teacher.GetFirstName] nhìn ta với vẻ không tán thành.\n\n\"Có một giấc ngủ ngon lành nhỉ? Vậy mà ta cứ tưởng ngươi có tố chất...\" [berserker_teacher.GetFirstNameNoTooltip] nói, lắc đầu [berserker_teacher.GetHerHis].\n\nTa cho rằng cơn cuồng nộ của mình chỉ là một giấc mơ!"
 fp1_yearly.2601.a:0 "Ta không thể chờ đến trận chiến tiếp theo!"
 fp1_yearly.2601.b:0 "Ắt hẳn đây là trò của [ROOT.Char.GetFaith.TricksterGodName]..."
 fp1_yearly.2601.c:0 "Thôi kệ! Ít nhất ta cảm thấy thật tuyệt!"
 
