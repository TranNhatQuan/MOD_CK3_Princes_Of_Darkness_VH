  SteleCommemoratesCarver:1 "[second.MakeScope.Var('stele_carver').Char.GetFirstNameNoTooltip] đã chạm khắc"

  SteleCommemoratesAncestors_Intro:1 "Dựng lên cho [second.MakeScope.Var('stele_container').Char.GetTitledFirstNameNicknamed] bởi [second.MakeScope.Var('stele_container').Char.GetHerHis] [second.MakeScope.Var('stele_container').Char.Custom2('RelationToMeShort',second.MakeScope.Var('stele_commissioner').Char)]"
  SteleCommemoratesAncestors_GenericFallback:0 "$SteleCommemoratesAncestors_Intro$. Một tâm hồn đẹp, mãi được tưởng nhớ. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_ChildFallback:0 "$SteleCommemoratesAncestors_Intro$. Bị cướp khỏi chúng ta quá sớm. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Diplomat:1 "$SteleCommemoratesAncestors_Intro$. Mong rằng tài ăn nói của [second.MakeScope.Var('stele_container').Char.GetHerHis] sẽ sống mãi. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_FamilyFirst:1 "$SteleCommemoratesAncestors_Intro$. Không gì quý giá với [second.MakeScope.Var('stele_container').Char.GetHerHim] hơn gia đình. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_August:1 "$SteleCommemoratesAncestors_Intro$. Thế giới này là một nơi khiêm nhường hơn khi thiếu đi nhân vật cao quý [second.MakeScope.Var('stele_container').Char.GetHerHis]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Reveler:1 "$SteleCommemoratesAncestors_Intro$. Mong [second.MakeScope.Var('stele_container').Char.GetSheHe] tiếp tục yến tiệc nơi [second.MakeScope.Var('stele_container').Char.GetFaith.PositiveAfterLife]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Blademaster:1 "$SteleCommemoratesAncestors_Intro$. Quả thật, chẳng ai có thể ngăn nổi lưỡi kiếm của [second.MakeScope.Var('stele_container').Char.GetHerHis]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Hunter:0 "$SteleCommemoratesAncestors_Intro$. Chưa từng có tay bắn nào chuẩn xác hơn trên cõi đời này. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Strategist:1 "$SteleCommemoratesAncestors_Intro$. Trí óc của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] vận hành nhanh hơn bất kỳ kẻ thù nào có thể lường trước. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Overseer:1 "$SteleCommemoratesAncestors_Intro$. Không điều gì thoát khỏi ánh nhìn sắc bén của [second.MakeScope.Var('stele_container').Char.GetHerHis]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Gallant:0 "$SteleCommemoratesAncestors_Intro$. Chưa từng có một tâm hồn cao thượng hơn thế. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Architect:1 "$SteleCommemoratesAncestors_Intro$. Những công trình và tượng đài của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] sẽ trường tồn hơn tất cả chúng ta. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Administrator:1 "$SteleCommemoratesAncestors_Intro$. Không điều gì diễn ra trong lãnh địa của [second.MakeScope.Var('stele_container').Char.GetHerHis] mà [second.MakeScope.Var('stele_container').Char.GetHerHim] không hay biết. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Avaricious:1 "$SteleCommemoratesAncestors_Intro$. Không gì khiến [second.MakeScope.Var('stele_container').Char.GetHerHim] hăng hái bằng tiếng bạc va vào nhau leng keng. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Schemer:1 "$SteleCommemoratesAncestors_Intro$. Những mưu toan trong tâm trí của [second.MakeScope.Var('stele_container').Char.GetHerHis] khiến cả những gián điệp giỏi nhất cũng rối trí. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Seducer:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] đã làm tan vỡ không biết bao nhiêu trái tim. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Torturer:1 "$SteleCommemoratesAncestors_Intro$. Thế gian hẳn nhẹ nhõm khi thoát khỏi những hành hạ kinh hoàng của [second.MakeScope.Var('stele_container').Char.GetHerHis]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Scholar:1 "$SteleCommemoratesAncestors_Intro$. Lời nói và trí tuệ của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] sẽ sống mãi muôn đời. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Theologian:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] được [second.MakeScope.Var('stele_container').Char.GetFaith.HighGodName] yêu quý hơn bất kỳ phàm nhân nào khác. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Mystic:1 "$SteleCommemoratesAncestors_Intro$. Mong [second.MakeScope.Var('stele_container').Char.GetSheHe] tìm thấy an nghỉ sau bức màn mà [second.MakeScope.Var('stele_container').Char.GetSheHe] đã nhiều lần bước qua. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Physician:1 "$SteleCommemoratesAncestors_Intro$. Những phương thuốc khôn ngoan của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] đã cứu sống vô số người. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Herbalist:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] đã mang theo bí mật về vạt nấm yêu thích của [second.MakeScope.Var('stele_container').Char.GetHerHis] xuống mồ. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Lustful:1 "$SteleCommemoratesAncestors_Intro$. Dục vọng của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] cuối cùng cũng được thỏa mãn. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Chaste:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] không còn phải lo lắng về những cám dỗ xác thịt nữa. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Gluttonous:1 "$SteleCommemoratesAncestors_Intro$. Trong suốt [second.MakeScope.Var('stele_container').Char.GetAge] năm cuộc đời, chưa một lần [second.MakeScope.Var('stele_container').Char.GetSheHe] bỏ bữa. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Temperate:1 "$SteleCommemoratesAncestors_Intro$. Sự điều độ đã dẫn lối [second.MakeScope.Var('stele_container').Char.GetHerHim] trong mọi việc. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Greedy:1 "$SteleCommemoratesAncestors_Intro$. Mong [second.MakeScope.Var('stele_container').Char.GetSheHe] tìm thấy của cải trong cái chết mà [second.MakeScope.Var('stele_container').Char.GetSheHe] từng khao khát khi còn sống. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Generous:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] được nhớ đến vì sự hào phóng với tiền bạc của [second.MakeScope.Var('stele_container').Char.GetHerHis]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Lazy:1 "$SteleCommemoratesAncestors_Intro$. Đôi khi [second.MakeScope.Var('stele_container').Char.GetSheHe|U] chẳng làm gì suốt nhiều năm liền. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Diligent:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] luôn nói rằng [second.MakeScope.Var('stele_container').Char.GetSheHe] có thể nghỉ ngơi khi [second.MakeScope.Var('stele_container').Char.GetSheHe] qua đời. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Wrathful:1 "$SteleCommemoratesAncestors_Intro$. Không ai tung cú đấm bất ngờ giỏi như [second.MakeScope.Var('stele_container').Char.GetHerHim]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Calm:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] là một đại dương tĩnh lặng. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Patient:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] nay không còn thời gian để chờ đợi nữa. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Impatient:1 "$SteleCommemoratesAncestors_Intro$. Sự vội vã của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] cuối cùng cũng dừng lại. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Arrogant:1 "$SteleCommemoratesAncestors_Intro$. Chưa ai từng có thể buộc tội sai rằng [second.MakeScope.Var('stele_container').Char.GetHerHim] thiếu lòng tự trọng. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Humble:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] khiêm nhường như một chú chuột nhỏ. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Deceitful:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] sẽ không bao giờ nói thêm một lời dối trá nào nữa. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Honest:1 "$SteleCommemoratesAncestors_Intro$. Từ lúc lọt lòng đến khi xuống mồ, [second.MakeScope.Var('stele_container').Char.GetSheHe|U] chưa từng nói một lời dối trá. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Craven:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] từng chạy trốn nhiều thứ, nhưng không [second.MakeScope.Var('stele_container').Char.GetWomanMan] nào chạy thoát khỏi cái chết. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Brave:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] đã dũng cảm đối mặt mọi kẻ thù, kể cả cái chết. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Shy:1 "$SteleCommemoratesAncestors_Intro$. Dù hiếm khi được thấy, sẽ không bao giờ còn một người như [second.MakeScope.Var('stele_container').Char.GetHerHis] nữa. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Gregarious:1 "$SteleCommemoratesAncestors_Intro$. Rất nhiều bằng hữu của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] sẽ mãi nhớ [second.MakeScope.Var('stele_container').Char.GetHerHim]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Ambitious:1 "$SteleCommemoratesAncestors_Intro$. Tham vọng của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] không có giới hạn — ngoại trừ một điều. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Content:1 "$SteleCommemoratesAncestors_Intro$. Dẫu [second.MakeScope.Var('stele_container').Char.GetSheHe] từng là ai, [second.MakeScope.Var('stele_container').Char.GetSheHe] đã ra đi trong mãn nguyện. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Arbitrary:1 "$SteleCommemoratesAncestors_Intro$. Mong luật lệ của [second.MakeScope.Var('stele_container').Char.GetFaith.DeathDeityName] đối xử với [second.MakeScope.Var('stele_container').Char.GetHerHim] tốt hơn cách [second.MakeScope.Var('stele_container').Char.GetSheHe] từng đối xử với luật lệ của người sống. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Just:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] tuân thủ luật pháp đến mức cực đoan. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Cynical:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] chưa từng tin vào [second.MakeScope.Var('stele_container').Char.GetFaith.PositiveAfterLife], và hẳn đang ở [second.MakeScope.Var('stele_container').Char.GetFaith.NegativeAfterLife]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Zealous:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] là một [second.MakeScope.Var('stele_container').Char.GetWomanMan] có đức tin mãnh liệt và áp đảo. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Paranoid:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] nhìn đâu cũng thấy kẻ thù, nhưng vẫn không thể tránh khỏi điều tất yếu. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Trusting:1 "$SteleCommemoratesAncestors_Intro$. Không hề đa nghi, [second.MakeScope.Var('stele_container').Char.GetSheHe] luôn tin điều tốt đẹp nhất ở mọi người. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Compassionate:1 "$SteleCommemoratesAncestors_Intro$. Mong lịch sử đối xử nhân hậu với [second.MakeScope.Var('stele_container').Char.GetHerHim] như cách [second.MakeScope.Var('stele_container').Char.GetSheHe] từng đối xử với người khác. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Callous:1 "$SteleCommemoratesAncestors_Intro$. Khi còn sống, [second.MakeScope.Var('stele_container').Char.GetSheHe] chẳng màng đến cảm xúc của ai; khi đã chết, cũng chẳng ai màng đến [second.MakeScope.Var('stele_container').Char.GetHerHis]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Sadistic:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] săn đuổi đồng loại của [second.MakeScope.Var('stele_container').Char.GetHerHis] với niềm khoái trá tàn nhẫn. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Stubborn:1 "$SteleCommemoratesAncestors_Intro$. Một [second.MakeScope.Var('stele_container').Char.GetWomanMan] của sự kiên định, [second.MakeScope.Var('stele_container').Char.GetSheHe] từ chối thay đổi suy nghĩ của [second.MakeScope.Var('stele_container').Char.GetHerHis] vì bất cứ ai. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Fickle:1 "$SteleCommemoratesAncestors_Intro$. Ai cũng biết quan điểm của [second.MakeScope.Var('stele_container').Char.GetHerHis] thay đổi theo chiều gió. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Vengeful:1 "$SteleCommemoratesAncestors_Intro$. Không ai ôm hận lâu như [second.MakeScope.Var('stele_container').Char.GetHerHim]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Forgiving:1 "$SteleCommemoratesAncestors_Intro$. Một [second.MakeScope.Var('stele_container').Char.GetWomanMan] của tình yêu vô hạn, không có mối thù hận nào mà [second.MakeScope.Var('stele_container').Char.GetSheHe] không thể tìm thấy sự tha thứ trong [second.MakeScope.Var('stele_container').Char.GetHerselfHimself]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Drunkard:1 "$SteleCommemoratesAncestors_Intro$. Dù tốt hay xấu, hiếm ai có thể uống gục [second.MakeScope.Var('stele_container').Char.GetHerHim]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Hashishiyah:1 "$SteleCommemoratesAncestors_Intro$. Với một tâm trí thư thái, ít điều gì làm phiền [second.MakeScope.Var('stele_container').Char.GetHerHim] chừng nào [second.MakeScope.Var('stele_container').Char.GetSheHe] còn có quyền truy cập vào kho bánh ngọt của [second.MakeScope.Var('stele_container').Char.GetHerHis]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Rakish:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] là khách quen được ưa chuộng tại nhiều chốn danh tiếng. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Reclusive:1 "$SteleCommemoratesAncestors_Intro$. Có người nói [second.MakeScope.Var('stele_container').Char.GetSheHe] chưa từng tồn tại, nhưng một số ít quả quyết đã từng thấy [second.MakeScope.Var('stele_container').Char.GetHerHim]. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Irritable:1 "$SteleCommemoratesAncestors_Intro$. Một [second.MakeScope.Var('stele_container').Char.GetWomanMan] nóng tính, [second.MakeScope.Var('stele_container').Char.GetSheHe] như ngọn nến cháy ở cả hai đầu. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Flagellant:1 "$SteleCommemoratesAncestors_Intro$. Sức chịu đựng của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] vừa khó hiểu vừa đáng khâm phục. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Profligate:1 "$SteleCommemoratesAncestors_Intro$. Không ai có thể nói [second.MakeScope.Var('stele_container').Char.GetSheHe] keo kiệt. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Improvident:1 "$SteleCommemoratesAncestors_Intro$. Sự từ thiện của [second.MakeScope.Var('stele_container').Char.GetHerHis|U] thật huyền thoại, còn kế hoạch tài chính của [second.MakeScope.Var('stele_container').Char.GetHerHis] thì ít hơn thế. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Contrite:1 "$SteleCommemoratesAncestors_Intro$. Dù lời nói của [second.MakeScope.Var('stele_container').Char.GetHerHis] có phần bừa bãi, lương tâm của [second.MakeScope.Var('stele_container').Char.GetHerHis] vẫn trong sạch. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_ComfortEater:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] có khẩu vị cho đủ thứ trên đời. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Inappetetic:1 "$SteleCommemoratesAncestors_Intro$. Mong bà tìm thấy sự an ủi nơi [second.MakeScope.Var('stele_container').Char.GetFaith.PositiveAfterLife] mà [second.MakeScope.Var('stele_container').Char.GetSheHe] từng thiếu trên trần thế. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Journaller:1 "$SteleCommemoratesAncestors_Intro$. Còn điều gì để viết thêm về [second.MakeScope.Var('stele_container').Char.GetHerHim]? $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Confider:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] chưa từng ngại tìm kiếm sự giúp đỡ. $SteleCommemoratesCarver$."
  SteleCommemoratesAncestors_Athletic:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] luôn nói rằng chẳng gì một cuộc chạy bộ tốt không thể giải quyết. $SteleCommemoratesCarver$."
