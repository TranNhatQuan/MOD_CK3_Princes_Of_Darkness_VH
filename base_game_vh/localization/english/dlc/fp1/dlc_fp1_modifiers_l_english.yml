l_english:
 ##################################################
 # #General Character Modifiers
  high_king_of_the_seas_fp1_modifier:0 "Đại Vương của Biển Cả"
  high_king_of_the_seas_fp1_modifier_desc:0 "Nhân vật này là kẻ thống trị không thể tranh cãi của Biển Bắc, một bá chủ hải quyền tối cao."
  high_queen_of_the_seas_fp1_modifier:0 "Đại Nữ Vương của Biển Cả"
  high_queen_of_the_seas_fp1_modifier_desc:0 "$high_king_of_the_seas_fp1_modifier_desc$"
  defiant_high_king_conversion_boost_modifier:0 "Đại Vương Bất Khuất"
  defiant_high_king_conversion_boost_modifier_desc:1 "Nhân vật này tôn thờ các Cổ Thần, và sẽ làm mọi thứ để chứng minh rằng người khác cũng nên như vậy.\n\nTăng đáng kể tốc độ [convert_county|E] đối với các [organized|E] [faiths|E]"
  defiant_high_queen_conversion_boost_modifier:0 "Đại Nữ Vương Bất Khuất"
  defiant_high_queen_conversion_boost_modifier_desc:0 "$defiant_high_king_conversion_boost_modifier_desc$"
  scandinavian_adventurer_fp1_modifier:0 "Kẻ Lưu Đày Viking"
  scandinavian_adventurer_fp1_modifier_desc:0 "Nhân vật này đã rời bỏ Scandinavia cùng một đội quân gồm những kẻ phiêu lưu và lưu manh, tìm cách lập nên một vương quốc ở nơi khác."
  nithing_fp1_modifier:0 "Nithing"
  nithing_fp1_modifier_desc:0 "Nhân vật này không còn là gì đối với $north_germanic_group_collective_noun$, bị xem như đã chết, còn thấp kém hơn cả nô lệ."
  stingy_host_fp1_modifier:0 "Chủ Nhà Keo Kiệt"
  stingy_host_fp1_modifier_desc:0 "Nhân vật này nổi tiếng vì từ chối đãi ngay cả một bữa ăn nóng cho những kẻ họ cho là không quan trọng tại triều đình."
  generous_host_fp1_modifier:0 "Chủ Nhà Hào Phóng"
  generous_host_fp1_modifier_desc:0 "Nhân vật này nổi tiếng vì đối xử với lữ khách bằng sự tôn trọng, lịch thiệp và một bữa ăn nóng."
  phantom_island_trivia_fp1_modifier:0 "Bí Ẩn Đại Tây Dương"
  phantom_island_trivia_fp1_modifier_desc:0 "Nhân vật này ghi nhớ nhiều câu chuyện thú vị về những hòn đảo bí ẩn giữa Đại Tây Dương."
  phantom_island_critique_fp1_modifier:0 "Nhà Tư Duy Phê Phán"
  phantom_island_critique_fp1_modifier_desc:0 "Nhân vật này được biết đến vì sự hoài nghi trước những câu chuyện phóng đại của vài thủy thủ."
  exotic_foreign_lord_fp1_modifier:0 "Lãnh Chúa Ngoại Quốc Kỳ Lạ"
  exotic_foreign_lord_fp1_modifier_desc:0 "Nhân vật này được biết đến trong thế giới Hồi giáo như vị quân chủ của một vương quốc ngoại giáo kỳ lạ và đầy hấp dẫn."
  horrifying_foreign_lord_fp1_modifier:0 "Lãnh Chúa Ngoại Quốc Kinh Hoàng"
  horrifying_foreign_lord_fp1_modifier_desc:0 "Khắp thế giới Hồi giáo lan truyền những câu chuyện về các nghi lễ hiến tế ngoại giáo kinh hoàng tràn ngập trong lãnh địa của nhân vật này."
  draugr_healthy_hiking_fp1_modifier:0 "Leo Núi Rèn Luyện"
  draugr_healthy_hiking_fp1_modifier_desc:0 "Nhân vật này đã dành vô số thời gian lang thang vô ích trong vùng hoang dã của lãnh địa mình để săn lùng quái vật."
  ultimate_blasphemer_modifier:0 "Kẻ Báng Bổ Tối Thượng"
  ultimate_blasphemer_modifier_desc:0 "Nhân vật này đã hiến tế chính [head_of_faith|E] của mình cho các thần linh của một [faithpossessive|E] khác. Không ai còn xem họ là tín đồ chân chính."
  embraced_local_traditions_modifier:0 "Tiếp Nhận Truyền Thống Bản Địa"
  embraced_local_traditions_modifier_desc:0 "Nhân vật từng là người Scandinavia này đã tiếp nhận văn hóa và đức tin của quê hương mới, dù họ vẫn có thể dựng #V Runestones#!."
  settled_norse_dynasty_modifier:0 "Vương Triều Định Cư"
  settled_norse_dynasty_modifier_desc:0 "Vương triều Scandinavia này đã định cư tại vùng đất ngoại quốc.\n#weak Chừng nào hiệu ứng này còn tồn tại, các nhà cai trị của Vương triều này sẽ không bị nhắm tới bởi những kẻ phiêu lưu Scandinavia.#!"
  fp1_focusing_on_rule_modifier:0 "Tập Trung Cai Trị"
  fp1_focusing_on_rule_modifier_desc:0 "Nhân vật này đang tập trung vào việc cai trị, và chỉ cai trị, bất chấp những đòi hỏi khác của cuộc sống."
  fp1_ignoring_annoyances_modifier:0 "Phớt Lờ Phiền Toái"
  fp1_ignoring_annoyances_modifier_desc:0 "Nhân vật này không có thời gian cho những phiền nhiễu và ý tưởng viển vông trẻ con."
  fp1_avoiding_the_snow_modifier:0 "Tránh Xa Tuyết Lạnh"
  fp1_avoiding_the_snow_modifier_desc:0 "Nhân vật này đã bị khiển trách vì dành quá nhiều thời gian ngoài trời lạnh."
  fp1_daydreaming_about_diplomacy_modifier:0 "Mơ Mộng Chính Sự"
  fp1_daydreaming_about_diplomacy_modifier_desc:0 "Nhân vật này đã dành nhiều thời gian suy tính chính sách ngoại giao."
  fp1_daydreaming_about_martial_modifier:0 "Mơ Mộng Chiến Lược"
  fp1_daydreaming_about_martial_modifier_desc:0 "Nhân vật này đã dành nhiều thời gian hoạch định các cuộc chiến tương lai."
  fp1_daydreaming_about_stewardship_modifier:0 "Mơ Mộng Vàng Bạc"
  fp1_daydreaming_about_stewardship_modifier_desc:0 "Nhân vật này đã dành nhiều thời gian tính toán cách tăng thuế trong tương lai."
  fp1_daydreaming_about_intrigue_modifier:0 "Mơ Mộng Âm Mưu"
  fp1_daydreaming_about_intrigue_modifier_desc:0 "Nhân vật này đã dành nhiều thời gian cân nhắc xem ai sẽ là người tiếp theo trong danh sách."
  fp1_daydreaming_about_learning_modifier:0 "Mơ Mộng Sách Vở"
  fp1_daydreaming_about_learning_modifier_desc:0 "Nhân vật này đã dành nhiều thời gian suy ngẫm về những cuốn sách ưa thích."
  fp1_excellent_longships_modifier:0 "Chiến Thuyền Xuất Sắc"
  fp1_excellent_longships_modifier_desc:0 "Hạm đội của nhân vật này rẽ sóng như lưỡi kiếm xuyên qua một tu sĩ."
  fp1_rotting_longships_modifier:0 "Chiến Thuyền Mục Nát"
  fp1_rotting_longships_modifier_desc:0 "Hạm đội của nhân vật này hầu như không đủ khả năng ra khơi."
  fp1_flagship_leviathan_modifier:0 "Kỳ Hạm Leviathan"
  fp1_flagship_leviathan_modifier_desc:0 "Chiến thuyền cá nhân của nhân vật này #EMP khổng lồ#!, có thể chứa một lượng chiến lợi phẩm phi lý."
  fp1_flagship_monster_modifier:0 "Kỳ Hạm Quái Vật"
  fp1_flagship_monster_modifier_desc:0 "Chiến thuyền cá nhân của nhân vật này được chạm khắc hình dã thú, quái vật, thần thoại và khổ đau. Nhiều hình khắc trông giống các chư hầu và kẻ thù của họ."
  fp1_flagship_dragon_modifier:0 "Kỳ Hạm Rồng Thiêng"
  fp1_flagship_dragon_modifier_desc:0 "Chiến thuyền cá nhân của nhân vật này đi vào huyền thoại, với diện mạo đặc trưng được biết đến khắp thế giới."
  fp1_cursed_by_nithing_pole_modifier:0 "Bị Nguyền bởi Cọc Nithing"
  fp1_cursed_by_nithing_pole_modifier_desc:0 "Nhân vật này đã bị nguyền rủa chí tử bởi một cọc nithing. Họ #EMP biết#! rằng diệt vong đang đến, chỉ là không biết khi nào, và nỗi sợ đang gặm nhấm họ #EMP từng ngày#!."
  fp1_bathing_health_modifier:0 "Tắm Rửa Nghiêm Ngặt"
  fp1_bathing_health_modifier_desc:0 "Nhân vật này duy trì lịch tắm rửa hoàn hảo, rửa tay trước bữa ăn và luôn có khăn nóng cho khách."
  fp1_bathing_attraction_modifier:0 "Diện Mạo Hoàn Hảo"
  fp1_bathing_attraction_modifier_desc:0 "Nhân vật này luôn được chải chuốt hoàn hảo: cạo sạch răng, chải tóc, làm sạch tai, rửa da, và không hề có dù chỉ một con rận."
  fp1_yearly_0071_troll_victory_bear_modifier:0 "Kẻ Diệt Gấu"
  fp1_yearly_0071_troll_victory_bear_modifier_desc:0 "Nhân vật này được đồn là đã giết một con troll, hoặc con gấu lớn nhất thế gian."
  fp1_yearly_0071_troll_victory_wolf_modifier:0 "Kẻ Diệt Sói"
  fp1_yearly_0071_troll_victory_wolf_modifier_desc:0 "Nhân vật này đã giết một con sói nhanh đến mức dân thường tin rằng đó là troll."
  fp1_yearly_0071_troll_victory_wolverine_modifier:0 "Kẻ Diệt Chồn Sói"
  fp1_yearly_0071_troll_victory_wolverine_modifier_desc:0 "Nhân vật này đã giết một con chồn sói hung dữ đến mức dân thường tin rằng đó là troll, giữ cho vùng hoang dã được an toàn."
  fp1_yearly_0071_troll_victory_lynx_modifier:0 "Kẻ Diệt Linh Miêu"
  fp1_yearly_0071_troll_victory_lynx_modifier_desc:0 "Nhân vật này đã giết một con linh miêu lặng lẽ đến mức dân thường tin rằng đó là troll."
  fp1_yearly_0071_troll_victory_moose_modifier:0 "Kẻ Diệt Nai Sừng Tấm"
  fp1_yearly_0071_troll_victory_moose_modifier_desc:0 "Nhân vật này đã giết một con nai sừng tấm điên loạn đến mức dân thường tin rằng đó là troll."
  fp1_yearly_0551_absent_lord_modifier:0 "Chủ Nhân Vắng Mặt"
  fp1_yearly_0551_absent_lord_modifier_desc:0 "Vì lý do nào đó, nhân vật này dường như không bao giờ có mặt tại triều đình của mình. Đặc biệt là vào giờ ăn tối."
  fp1_abased_before_highgod_modifier:0 "Nơi Quyền Năng Thật Sự Ngự Trị"
  fp1_abased_before_highgod_modifier_desc:0 "Nhân vật này từ chối đội vương miện, khẳng định rằng quyền năng #EMP thực sự#! chỉ nằm nơi thần linh."
  harald_tanglehairs_vow_modifier:0 "Lời Thề Tóc Rối"
  harald_tanglehairs_vow_modifier_desc:0 "Nhân vật này đã lập lời thề trọn đời: họ sẽ không cắt hay chải tóc cho đến khi trở thành vị Vua đầu tiên của Na Uy."
  harald_tanglehairs_reminder_modifier:0 "Lời Thề Tóc Rối Đã Hoàn Thành"
  harald_tanglehairs_reminder_modifier_desc:0 "Nhân vật này đã hoàn thành lời thề trọn đời: không cắt hay chải tóc cho đến khi trở thành Vua Na Uy. Họ vẫn tiếp tục giữ vậy như một lời nhắc nhở về hành trình của mình."
  harald_tanglehairs_vow_broken_modifier:0 "Lời Thề Tóc Rối Bị Phá Vỡ"
  harald_tanglehairs_vow_broken_modifier_desc:0 "Nhân vật này đã không thể hoàn thành lời thề trọn đời: vì họ không phải là vị Vua đầu tiên của Na Uy, họ có thể sẽ không bao giờ được cắt hay chải tóc."
  fp1_0511_carries_stinking_trophy_modifier:0 "Chiến Lợi Phẩm Bốc Mùi"
  fp1_0511_carries_stinking_trophy_modifier_desc:0 "Nhân vật này mang theo một chiến lợi phẩm đang phân hủy, đầy giòi bọ, đi khắp mọi nơi. Có người nói mùi hôi lan xa hàng dặm."
  fp1_reprieve_from_sa_modifier:0 "Tạm Thoát Khỏi Phiêu Lưu Scandinavia"
  fp1_reprieve_from_sa_modifier_desc:0 "Bằng cách nào đó, nhân vật này đã giành được chút thời gian yên ổn khỏi các đoàn Viking không ngừng nghỉ.\n$EFFECT_LIST_BULLET$ Sẽ không bị tấn công bởi các Nhà Phiêu Lưu Scandinavia không có đất"

 ##################################################
 # #Shieldmaiden Character Modifiers
 shieldmaiden_level_martial_1_fp1_modifier:0 "Chỉ Huy Dày Dạn Kinh Nghiệm"
 shieldmaiden_level_martial_1_fp1_modifier_desc:0 "Nhân vật này đã nỗ lực hơn nhiều người khác để nâng cao khả năng chỉ huy binh lính của mình."
 shieldmaiden_level_martial_2_fp1_modifier:0 "Chỉ Huy Lão Luyện"
 shieldmaiden_level_martial_2_fp1_modifier_desc:0 "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_martial_3_fp1_modifier:0 "Chỉ Huy Dạn Dày Trận Mạc"
 shieldmaiden_level_martial_3_fp1_modifier_desc:0 "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_1_fp1_modifier:0 "Chiến Binh Dày Dạn Kinh Nghiệm"
 shieldmaiden_level_prowess_1_fp1_modifier_desc:0 "Nhân vật này dường như không bao giờ ngừng luyện tập với lưỡi kiếm."
 shieldmaiden_level_prowess_2_fp1_modifier:0 "Chiến Binh Lừng Danh"
 shieldmaiden_level_prowess_2_fp1_modifier_desc:0 "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_3_fp1_modifier:0 "Chiến Binh Huyền Thoại"
 shieldmaiden_level_prowess_3_fp1_modifier_desc:0 "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_1_fp1_modifier:0 "Kẻ Đâm Sau Lưng Xảo Quyệt"
 shieldmaiden_level_intrigue_1_fp1_modifier_desc:0 "Nhân vật này luôn tìm kiếm cơ hội để lợi dụng kẻ thù của mình."
 shieldmaiden_level_intrigue_2_fp1_modifier:0 "Kẻ Đâm Sau Lưng Khét Tiếng"
 shieldmaiden_level_intrigue_2_fp1_modifier_desc:0 "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_3_fp1_modifier:0 "Kẻ Đâm Sau Lưng Tai Tiếng"
 shieldmaiden_level_intrigue_3_fp1_modifier_desc:0 "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"

 ##################################################
 # #County Modifiers
 nithing_exiled_fp1_modifier:0 "Nithing Địa Phương Bị Lưu Đày"
 nithing_exiled_fp1_modifier_desc:0 "Cộng đồng địa phương yên tâm khi biết rằng một kẻ vô lại đã bị trừng phạt thích đáng."
 nithing_harboured_fp1_modifier:0 "Che Chở Nithing Địa Phương"
 nithing_harboured_fp1_modifier_desc:0 "Cộng đồng địa phương căm ghét việc lãnh chúa của họ bảo hộ một kẻ vô lại đã bị biết tiếng."
 nithing_in_limbo_fp1_modifier:0 "Căng Thẳng Giai Tầng"
 nithing_in_limbo_fp1_modifier_desc:0 "Một số thành phần trong triều đình thường xuyên xung đột với cộng đồng địa phương."
 draugr_remedies_succeeded_fp1_modifier:0 "Draugr Bị Xua Đuổi"
 draugr_remedies_succeeded_fp1_modifier_desc:0 "Bằng mọi giá, cái xác sống từng ám ảnh hạt này cuối cùng đã bị xử lý."
 draugr_remedies_failed_fp1_modifier:0 "Draugr Ám Ảnh Dân Chúng"
 draugr_remedies_failed_fp1_modifier_desc:0 "Bất chấp mọi nỗ lực của người sống, hạt này bị bao trùm bởi dịch bệnh, lời nguyền và vận rủi."
 draugr_monstrous_wolfpack_fp1_modifier:0 "Tiếng Tru Trong Đêm"
 draugr_monstrous_wolfpack_fp1_modifier_desc:0 "Một bầy sói đói khát và hung hãn bất thường rình rập nơi hoang dã của hạt này, xé xác gia súc và những lữ khách cô độc."
 draugr_monstrous_bear_fp1_modifier:0 "Vùng Hoang Dã Nguy Hiểm"
 draugr_monstrous_bear_fp1_modifier_desc:0 "Một con gấu khổng lồ tấn công ngẫu nhiên trong hạt này, khi thì chỉ bắt một con bò, khi thì tàn sát cả gia đình."
 draugr_nithing_fp1_modifier:0 "Kẻ Ngoài Vòng Pháp Luật Ma Quái"
 draugr_nithing_fp1_modifier_desc:0 "Có kẻ gọi đó là xác sống biết đi, kẻ khác chỉ xem là tên trộm lặng lẽ, nhưng ai cũng đồng ý rằng một hồn ma mắc chứng trộm cắp đang quấy nhiễu dân chúng."
 draugr_nothing_found_fp1_modifier:0 "Nông Dân Mê Tín"
 draugr_nothing_found_fp1_modifier_desc:0 "Bất chấp nỗ lực của lãnh chúa nhằm chứng minh điều ngược lại, dân thường địa phương vẫn khăng khăng rằng họ bị xác sống rình rập."
 capital_of_rus_opinion_modifier:0 "Thủ Đô Đang Phát Triển"
 capital_of_rus_opinion_modifier_desc:0 "Dòng hàng hóa, thương nhân và nô lệ đổ về liên tục khiến người dân hạt này hoàn toàn mãn nguyện."
 capital_of_rus_misc_benefits_modifier:0 "Thủ Đô Varangian"
 capital_of_rus_misc_benefits_modifier_desc:0 "Khu định cư này là #EMP trung tâm#! khu vực cho cả người Slav lẫn Norse, và hưởng nhiều lợi ích nhờ là quê hương của vô số toán phiêu lưu, chinh phạt và hải tặc."
 held_grand_sacrifice_fp1_modifier:0 "Tham Dự Đại Tế Lễ"
 held_grand_sacrifice_fp1_modifier_desc:0 "Nông dân hạt này an tâm vì biết rằng các vị thần mỉm cười với những ai dâng lễ vật."
 commoners_grand_sacrifice_fp1_modifier:0 "Tham Dự Đại Tế Lễ Của Thứ Dân"
 commoners_grand_sacrifice_fp1_modifier_desc:0 "Nông dân trong hạt này vẫn nhắc về việc họ tự do hòa mình cùng giới quý tộc tại yến tiệc lớn gần đây được tổ chức để tôn vinh các vị thần."
 held_human_sacrifice_fp1_modifier:0 "Kinh Hoàng Trước Hiến Tế Người"
 held_human_sacrifice_fp1_modifier_desc:0 "Dân chúng phẫn nộ khi bị cai trị bởi một nhân vật thực hành nghi lễ sát tế con người."
 trade_instead_of_raid_fp1_modifier:0 "Liên Kết Thương Mại Với Kẻ Cướp"
 trade_instead_of_raid_fp1_modifier_desc:0 "Hạt này thu lợi lớn từ việc giao thương với những kẻ lẽ ra sẽ cướp bóc thay vì chống lại chúng, những người giàu có nhất khoác lên mình y phục và trang sức ngoại lai từ phương xa."
 fp1_stele_ancestors_strong:0 "Đá Rune Tổ Tiên"
 fp1_stele_ancestors_strong_custom_desc:1 "[ROOT.Char.Custom2_Title('SteleCommemoratesAncestors', SCOPE.sTitle('stele_location'))]"
 fp1_stele_ancestors_weak:0 "$fp1_stele_ancestors_strong$"
 fp1_stele_conquest_strong:0 "Đá Rune Chinh Phạt"
 fp1_stele_conquest_strong_custom_desc:1 "[ROOT.Char.Custom2_Title('SteleCommemoratesConquest', SCOPE.sTitle('stele_location'))]"
 fp1_stele_conquest_weak:0 "$fp1_stele_conquest_strong$"
 fp1_stele_promotion_strong:0 "Đá Rune Thanh Thế"
 fp1_stele_promotion_strong_custom_desc:1 "[ROOT.Char.Custom2_Title('SteleCommemoratesPromotion', SCOPE.sTitle('stele_location'))]"
 fp1_stele_promotion_weak:0 "$fp1_stele_promotion_strong$"
 fp1_yearly_0591_levy_modifier:1 "Được Ủng Hộ Tại Ting"
 fp1_yearly_0591_levy_modifier_desc:1 "Những tranh cãi nhỏ tại Ting địa phương gần đây đã giúp hạt này giành được các dải đất biên giới, khiến nhiều làng mới mọc lên."
 fp1_yearly_0591_building_modifier:1 "Được Minh Oan Tại Ting"
 fp1_yearly_0591_building_modifier_desc:1 "Ảnh hưởng chính trị tại Ting địa phương đã cho phép hạt này đòi hỏi một số lãnh thổ biên giới nhỏ, tạo thêm không gian để mở rộng các khu định cư hiện có."
 fp1_yearly_0591_spurned_modifier:0 "Cảm Thấy Bị Lạnh Nhạt"
 fp1_yearly_0591_spurned_modifier_desc:1 "Người dân trong hạt này biết rõ như #EMP ban ngày#! rằng lãnh chúa của họ ưu ái một hạt đối địch hơn hạt của mình."
 fp1_yearly_0591_otherwise_occupied_modifier:0 "Bận Việc Khác"
 fp1_yearly_0591_otherwise_occupied_modifier_desc:0 "Hạt này quá bận chiến đấu với các đối thủ lân cận nên không thể kích động bất ổn chống lại lãnh chúa."
 fp1_yearly_0071_troll_attacks_modifier:0 "Troll Tấn Công"
 fp1_yearly_0071_troll_attacks_modifier_desc:0 "Có một... #EMP thứ gì đó#! trong vùng hoang dã của hạt này, gieo rắc kinh hoàng và thậm chí giết hại dân chúng."
 fp1_mann_pirate_capital_modifier:0 "Thành Phố Bị Đánh Cắp"
 fp1_mann_pirate_capital_modifier_desc:0 "Thủ phủ địa phương có được biệt danh này nhờ máu, nỗi sợ và lao lực. Lao lực là của người bản địa, còn máu và nỗi sợ thì được mang từ phương xa tới. Thường xuyên."
 fp1_trade_events_foreign_architects_modifier:0 "Kiến Trúc Sư Ngoại Quốc"
 fp1_trade_events_foreign_architects_modifier_desc:0 "Các kiến trúc sư ngoại quốc mang đến những phong cách và kỹ thuật xây dựng mới nhất từ phương xa."
 fp1_trade_events_foreign_architects_no_growth_modifier:0 "Trợ Giúp Ngoại Quốc"
 fp1_trade_events_foreign_architects_no_growth_modifier_desc:0 "Các kiến trúc sư ngoại quốc mang đến những phong cách mới từ phương xa, dù họ khó có thể cải thiện thêm các công trình tinh xảo sẵn có."
 fp1_trade_events_raid_consultants_modifier:0 "Cướp Biển Lão Luyện Đóng Quân"
 fp1_trade_events_raid_consultants_modifier_desc:0 "Các nhóm cướp biển lão luyện đã được trả hậu hĩnh để bảo vệ hạt này khỏi những kẻ cùng loại."

 ##################################################
 # #Dynasty Modifiers
 fp1_legacy_of_piracy_modifier:0 "Di Sản Hải Tặc"
 fp1_legacy_of_piracy_modifier_desc:0 "Triều đại này có nguồn gốc gần đây từ tên hải tặc và cướp bóc vĩ đại nhất thời đại; biển cả, muối và khói luôn chảy trong huyết quản và vương trên môi họ.\n\nCó thể [raid|E], bất kể loại hình [government|E]\nCó thể $game_concept_raid$ ở hải ngoại & đi thuyền trên Sông Lớn"

 ##################################################
 # #Religion Modifiers
 gruesome_festivals_designated_sacrifice_fp1_modifier:0 "Sắp Bị Hiến Tế"
 gruesome_festivals_designated_sacrifice_fp1_modifier_desc:0 "Nhân vật này là một [designate_chief_sacrifice_chief_sacrifice|E] được chỉ định."
 fp1_jomsvikings_caused_faith_crisis_modifier:0 "Khủng Hoảng Đức Tin"
 fp1_jomsvikings_caused_faith_crisis_modifier_desc:0 "Một cuộc xung đột với thủ lĩnh của một dòng tu thánh đã khiến nhân vật này nghi ngờ niềm tin của mình."
