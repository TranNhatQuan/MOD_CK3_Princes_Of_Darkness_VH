l_english:
 ##################################################
 # #Misc
  fp1_berserk_roar_evtopt:0 "#BER RAAAAARGH!#!"

 ##################################################
 # #Ordinary Events
  fp1_yearly.0001.t:0 "Nô Lệ Bỏ Trốn"
  fp1_yearly.0001.desc:1 "Nô lệ là một phần tất yếu trong văn hóa [ROOT.Char.GetCulture.GetNameNoTooltip]. Những kẻ hạ đẳng, bị bắt từ phương xa hoặc sinh ra trong thân phận nô lệ, họ làm việc trên đồng ruộng và chăm lo bếp lửa cho chúng ta.\n\nÍt nhất là trên lý thuyết.\n\nĐêm qua, một nô lệ như thế đã quyết định rằng [dummy_gender.GetSheHe] đã chịu đủ rồi, và bỏ trốn, mang theo cả một ôm đầy trang sức quý giá cùng [dummy_gender.GetHerHim]! Tệ hơn nữa, [scapegoat.Custom2('MyCharacterIntroduction',ROOT.Char)] #EMP đã nhìn thấy#! tên nô lệ lao vào màn đêm, nhưng lại không nghĩ đến việc báo cho bất kỳ ai cho tới sáng."
  fp1_yearly.0001.gold_stays_lost.tt:0 "Số bạc của Ngài vẫn mất"
  fp1_yearly.0001.a:0 "Gửi mô tả đến mọi ngôi làng!"
  fp1_yearly.0001.a.tt_success:0 "Tên nô lệ bị phát hiện và bắt giữ"
  fp1_yearly.0001.a.tt_failure:0 "Tên nô lệ thoát lưới cùng số bạc của Ngài"
  fp1_yearly.0001.b:0 "Đưa áo choàng đây, ta sẽ tự mình săn lùng [dummy_gender.GetHerHim]."
  fp1_yearly.0001.b.tt_success:0 "Ngài bắt được tên nô lệ trước khi hắn đi xa"
  fp1_yearly.0001.b.tt_failure:0 "$fp1_yearly.0001.a.tt_failure$"
  fp1_yearly.0001.c:0 "[scapegoat.GetFirstNameNoTooltip], đây là lỗi của ngươi, vậy ngươi phải đền!"
  fp1_yearly.0001.d:0 "Ngươi được tha thứ, [scapegoat.GetFirstNameNoTooltip]. Những chuyện như vậy vẫn xảy ra."

  fp1_yearly.0011.t:0 "Lời Kêu Gọi Tuyên Bố [offensive_courtier.GetFirstNameNoTooltip] Là Nithing"
  fp1_yearly.0011.desc:1 "Một đoàn những nhân vật quan trọng từ [capital_barony.GetNameNoTier] đã lần lượt bước qua đại sảnh của ta suốt cả ngày, mỗi người đều mang theo một lời phàn nàn riêng về [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('offensive_courtier'))] của ta, [offensive_courtier.GetTitledFirstName].\n\nCó người phàn nàn về hành vi của [offensive_courtier.GetHerHis], kẻ khác về danh dự của [offensive_courtier.GetHerHis], nhưng tất cả đều đồng ý một điều: [offensive_courtier.GetSheHe] là nỗi ô nhục của triều đình.\n\nĐám dân chúng thô lỗ kêu gọi không gì khác ngoài việc tuyên bố nithing, trục xuất [offensive_courtier.GetHerHim] ra ngoài."
  fp1_yearly.0011.desc.priest:0 "[priest.Custom2('MyCharacterIntroduction',ROOT.Char)|U] khăng khăng rằng hành vi của [offensive_courtier.GetHerHis] #EMP thực ra#! rất mộ đạo, nhưng đám thị dân gầm gừ cho rằng [priest.GetFirstNameNoTooltip] đơn giản là không phải gánh chịu hậu quả của thứ “đức hạnh” đó."
  fp1_yearly.0011.a:0 "Họ nói đúng, [offensive_courtier.GetSheHe] phải bị từ mặt và lưu đày!"
  fp1_yearly.0011.b:0 "Họ nói đúng, [offensive_courtier.GetSheHe] phải bị lưu đày!"
  fp1_yearly.0011.c:0 "Lũ dân quê! [offensive_courtier.GetFirstNameNoTooltip] vô tội."
  fp1_yearly.0011.d:0 "Đây không phải việc của [ROOT.Char.GetTitleAsNameNoTooltip]..."

  fp1_yearly.0021.t:0 "Chuyện Sống Còn"
  fp1_yearly.0021.desc.intro:0 "Một cuộc tranh cãi gần đây giữa hai $knight_culture_player_plural_no_tooltip_lowercase$ của ta, [first_knight.GetTitledFirstName] và [second_knight.GetTitledFirstName], đã leo thang nghiêm trọng. Rõ ràng là,"
  fp1_yearly.0021.desc.doggo:1 "[first_knight.GetFirstNameNoTooltip] đã vô tình xiên chết con chó của [second_knight.GetFirstNamePossessiveNoTooltip] khi họ cùng săn một con [ROOT.Char.Custom('GetAnimalType')], và [second_knight.GetFirstNameNoTooltip] từ chối để [first_knight.GetFirstNameNoTooltip] chỉ đơn giản trả tiền mua con khác."
  fp1_yearly.0021.desc.spit_of_land:0 "[first_knight.GetFirstNameNoTooltip] đã mua một mảnh đất hẻo lánh mà [second_knight.GetFirstNameNoTooltip] khẳng định thuộc về [second_knight.GetHerHim]. Mảnh đất đó vốn vô giá trị, ngoại trừ việc người ta nói nó trồng được những cây bắp cải ngon nhất toàn [capital_barony.GetNameNoTierNoTooltip]."
  fp1_yearly.0021.desc.unrepeatable_insult:0 "họ bắt đầu ném vào nhau những lời lăng mạ vô cớ, và [first_knight.GetFirstNameNoTooltip] đã nói điều gì đó không thể lặp lại về [second_knight.GetFirstNameNoTooltip], một con dê, và một chiếc sừng uống rượu hảo hạng."
  fp1_yearly.0021.desc.escalating_prank_war:0 "mọi chuyện khởi đầu như một cuộc đùa ganh đua vô hại, mỗi người bày ra những trò đùa ngày càng kịch tính hơn, và niềm vui dần biến thành cơn thịnh nộ thuần túy."
  fp1_yearly.0021.desc.religious_differences:0 "nguyên nhân chỉ đơn giản là khác biệt đức tin, khi [first_knight.GetFaith.GetAdherentName] và [second_knight.GetFaith.GetAdherentName] đều sẵn sàng bóp cổ nhau vì bản chất của thần linh."
  fp1_yearly.0021.desc.stolen_pig:0 "điểm tranh chấp chính là một con lợn giải thưởng khổng lồ, mà [first_knight.GetFirstNameNoTooltip] đã trộm từ [second_knight.GetFirstNameNoTooltip]. Hoặc [second_knight.GetFirstNameNoTooltip] từ [first_knight.GetFirstNameNoTooltip]. Thành thật mà nói, với tất cả tiếng la hét, thật khó mà biết được."
  fp1_yearly.0021.desc.defiled_longboat.woman:0 "[unfortunate_knight.GetFirstNameNoTooltip] bắt gặp [defiling_knight.GetFirstNameNoTooltip] đang #EMP tận hưởng#! [defiling_knight.GetHerselfHimself] với bức tượng đầu thuyền của [unfortunate_knight.GetFirstNamePossessiveNoTooltip], phá hỏng hoàn toàn lớp sơn và hào quang đáng sợ vốn có của nó."
  fp1_yearly.0021.desc.defiled_longboat:1 "[defiling_knight.GetFirstNameNoTooltip] #EMP tận hưởng#! [defiling_knight.GetHerselfHimself] một cách không thể diễn tả được khắp mọi chỗ ngồi trên thuyền dài của [unfortunate_knight.GetFirstNamePossessiveNoTooltip], khiến cả con tàu #EMP bốc mùi#!."
  fp1_yearly.0021.desc.board_game:0 "cả hai đang chơi hnefatafl và bắt đầu cãi nhau về luật chơi chính xác. Chỉ trong vài phút, bàn cờ bị hất tung và nắm đấm bay loạn."
  fp1_yearly.0021.desc.outro:0 "\n\nGiờ đây, cả hai $knight_culture_player_plural_no_tooltip_lowercase$ đã công khai thách đấu holmgang. Trận quyết đấu hẳn sẽ đầy kịch tính, nhưng với tư cách là thành viên tuyên thệ trong gia đình ta, họ cần sự cho phép của ta để tiến hành cuộc chiến."
  fp1_yearly.0021.a:0 "Họ có thể đấu vì chuyện này nếu họ muốn."
  fp1_yearly.0021.a.tt_success:0 "[first_knight.GetFirstNameNoTooltip] thắng holmgang"
  fp1_yearly.0021.a.tt_failure:0 "[second_knight.GetFirstNameNoTooltip] thắng holmgang"
  fp1_yearly.0021.b:0 "Trẻ con! Ta cấm điều đó!"
  fp1_yearly.0021.b.tt_success:0 "Mệnh lệnh của Ngài gieo rắc sự phục tùng đầy sợ hãi"
  fp1_yearly.0021.b.tt_failure:0 "$knight_culture_player_plural_no_tooltip_lowercase$ của Ngài miễn cưỡng đồng ý nhưng chế giễu Ngài"
  fp1_yearly.0021.c:0 "Được thôi, và ta thậm chí sẽ cược vào [first_knight.GetFirstNameNoTooltip]."
  fp1_yearly.0021.c.tt_success:0 "$fp1_yearly.0021.a.tt_success$"
  fp1_yearly.0021.c.tt_failure:0 "$fp1_yearly.0021.a.tt_failure$"
  fp1_yearly.0021.d:0 "Cứ tự nhiên, dù ta sẽ đặt cược vào [second_knight.GetFirstNameNoTooltip]."
  fp1_yearly.0021.d.tt_failure:0 "$fp1_yearly.0021.a.tt_success$"
  fp1_yearly.0021.d.tt_success:0 "$fp1_yearly.0021.a.tt_failure$"

  fp1_yearly.0031.t:0 "Chuyện Phóng Đại Trên Bàn Tiệc"
  fp1_yearly.0031.desc.intro:1 "Đó là một buổi tối dài đằng đẵng bên cạnh [lying_warrior.GetFirstName]. Kẻ lãng khách dừng chân tại [capital_barony.GetBaseNameNoTierNoTooltip] để qua đêm, trả chi phí cho nơi ở của [lying_warrior.GetHerHis] bằng những câu chuyện về những chiến công của [lying_warrior.GetHerHis] kéo dài suốt #EMP nhiều giờ#!.\n\n"
  fp1_yearly.0031.desc.sunk_longboat:0 ""... thế là ta ở giữa Biển Bắc, thuyền dài chìm xuống vì quá nhiều chiến lợi phẩm đẫm máu. Ừ thì, ta không thể mang theo tất cả, nên ta nhảy xuống nước và bơi đến tận Na Uy!""
  fp1_yearly.0031.desc.wrestled_whale:0 ""... ta biết rằng hoặc phải bỏ rơi thủy thủ đoàn, hoặc tự mình chiến đấu với con cá voi. Ta chộp lấy dao, lao xuống đại dương và vật lộn con quái vật vào bờ chỉ với hai tay!""
  fp1_yearly.0031.desc.charged_city_fruit_knife:0 ""... mười nghìn quân địch trong đó, tay cầm lưỡi gươm cong, còn ta chỉ có một con dao nhỏ gọt trái cây. #EMP Ta đã làm được#!, nhờ con dao gọt trái cây trung thành của mình!""
  fp1_yearly.0031.desc.charged_city:0 ""... ta lao thẳng tới tường thành, leo tự do vào trong và chém giết tiến vào cung điện hoàng gia. Ta nấu chảy vương miện của nhà vua để trả tiền cho một đôi ủng mới.""
  fp1_yearly.0031.desc.kept_iceland_afloat:1 ""... và nếu hai gã khổng lồ đó thực sự #EMP đã#! tiến hành holmgang của họ, Iceland hẳn đã chìm trở lại biển cả. May mà ta đã khuyên can họ, thật đấy.""
  fp1_yearly.0031.desc.wooed_heir:1 ""... [disparaged_king.GetTitledFirstNamePossessive] [invented_heir.Custom('GetDaughterSon')], à thì #EMP người đó#! là tuyệt nhất ta từng có. [disparaged_king.GetTitledFirstNameNoTooltip] không thích ta lắm sau chuyện đó, nên ta đã rời khỏi triều đình của [disparaged_king.GetHerHis] thật nhanh, ta nói thật đấy!""
  fp1_yearly.0031.desc.hunted_troll:1 ""... còn vết thương gần đây nhất này là từ chính con quỷ khổng lồ. To như căn nhà, lặng như chuột, móng vuốt như đứa con hoang của [lying_warrior.GetFaith.DevilName]. Nhưng cứ đâm đủ lâu, thứ gì rồi cũng chết.""
  fp1_yearly.0031.desc.outro:1 "\n\nHết chuyện này đến chuyện khác, bản anh hùng ca cứ thế tiếp diễn, mỗi giai thoại lại dài và lớn hơn chuyện trước."
  fp1_yearly.0031.a:0 "Ngươi đơn giản là #EMP phải#! ở lại triều đình, [lying_warrior.GetFirstNameNoTooltip]!"
  fp1_yearly.0031.b:0 "Nghe có vẻ... khó tin."
  fp1_yearly.0031.b.tt_success:0 "Những lời dối trá của [lying_warrior.GetFirstNamePossessiveNoTooltip] bị vạch trần"
  fp1_yearly.0031.b.tt_failure:0 "[lying_warrior.GetFirstNameNoTooltip] xoay Ngài như chong chóng bằng lời nói"
  fp1_yearly.0031.c:1 "Hãy nói tốt về lòng hiếu khách của chúng ta ở điểm dừng tiếp theo!"

  fp1_yearly.0041.t:0 "Những Nhà Thám Hiểm Từ Phương Nam"
  fp1_yearly.0041.desc:2 "[explorer.GetFirstName], một nhà thám hiểm, học giả và đặc sứ từ [sponsoring_liege.GetTitledFirstName] của [sponsoring_liege.GetPrimaryTitle.GetName], gần đây đã đi du ngoạn khắp đất đai của ta. Là một [explorer.GetFaith.GetAdherentNameNoTooltip] uyên bác và sùng đạo, [explorer.GetSheHe] giữ một cuốn nhật ký chi tiết về những trải nghiệm của [explorer.GetHerHis], gửi những lá thư không thường xuyên về quê hương [explorer.GetHerHis] để tường thuật về cuộc sống ở nơi tận cùng thế giới này.\n\n[explorer.GetFirstNameNoTooltip] hiện đã đến [capital_barony.GetNameNoTierNoTooltip], và xin phép dừng chân vài ngày để quan sát phong tục địa phương và trò chuyện với những bậc trưởng lão thông thái nhất của chúng ta.\n\nBất chấp cung cách trang trọng trong yêu cầu của [explorer.GetHerHis], giọng điệu của [explorer.GetFirstNamePossessiveNoTooltip] gần như #EMP nhỏ giọt#! vẻ trịch thượng."
  fp1_yearly.0041.a:1 "Có lẽ [explorer.GetSheHe] có thể quan sát một nghi lễ blot nhỏ của chúng ta?"
  fp1_yearly.0041.a.tt_success:0 "Nghi lễ của Ngài gây ấn tượng với [explorer.GetFirstNameNoTooltip]"
  fp1_yearly.0041.a.tt_failure:0 "Phong tục ngoại giáo của Ngài khiến [explorer.GetFirstNameNoTooltip] ghê tởm"
  fp1_yearly.0041.b:0 "Hãy kể ta nghe thêm về vị... [explorer.GetFaith.HighGodName] này?"
  fp1_yearly.0041.c:0 "Triều đình #EMP của ta#! không có chỗ cho những kẻ ngoại quốc kiêu ngạo."

  fp1_yearly.0051.t:0 "Những Kẻ Chết Không Yên Nghỉ"
  fp1_yearly.0051.desc:1 "Cái chết của [draugr.GetTitledFirstNamePossessive] cách đây một thời gian đã không trôi qua mà không để lại dấu ấn trong dân chúng [capital_county.GetNameNoTier]. Dù [draugr.GetSheHe] từng là gì đi nữa, [draugr.GetFirstNameNoTooltip] cũng chẳng được lòng đám nông dân địa phương, và giờ đây mọi tai ương trong vùng đều bị đổ lỗi cho xác chết biết đi của [draugr.Custom('WomanManPossessive')].\n\nDường như chẳng tuần nào trôi qua mà không có nông dân, tiều phu hay kẻ hốt phân nào quanh kinh đô phàn nàn về con draugr của [draugr.GetFirstNamePossessiveNoTooltip].\n\n#EMP Phải#! làm điều gì đó."
  fp1_yearly.0051.a:0 "Ta sẽ đích thân đến gò mộ của [draugr.GetHerHis]."
  fp1_yearly.0051.a.tt:0 "Ngài quyết định tự mình điều tra..."
  fp1_yearly.0051.b:0 "Chỉ cần đào xác lên rồi thiêu hủy nó."
  fp1_yearly.0051.b.body_destroyed:0 "Dân Chúng Hân Hoan"
  fp1_yearly.0051.b.list:0 "Gia đình và bằng hữu của [draugr.GetFirstNameNoTooltip]"
  fp1_yearly.0051.c:0 "Có lẽ ta có thể giải quyết chuyện này bằng bùa chú bảo hộ?"
  fp1_yearly.0051.c.tt_success:0 "Thuốc và bùa chú của Ngài trấn an dân chúng"
  fp1_yearly.0051.c.tt_failure:0 "Nghi lễ của Ngài không đủ hiệu nghiệm"
  fp1_yearly.0061.t:0 "$fp1_yearly.0051.t$: Sói"
  fp1_yearly.0061.desc:0 "Ta và đoàn tùy tùng vừa đến gò mộ của [draugr.GetFirstNamePossessiveNoTooltip] thì tiếng gầm gừ đầu tiên đã vang lên từ bên trong.\n\nKhi con sói lớn nhất ta từng thấy chen mình qua lối vào tối om, cả bầy của nó dường như mọc lên từ mặt đất. Phải đến cả chục con hoặc hơn, mỗi con to ngang một người, và đã lao tới từ mọi phía.\n\nĐám nông dân đã sai về draugr, nhưng không sai về lời nguyền!"
  fp1_yearly.0061.a:0 "Binh sĩ! Về phía ta!"
  fp1_yearly.0061.a.tt_success:0 "Ngài tập hợp quân lính và tàn sát bầy sói!"
  fp1_yearly.0061.a.tt_failure:0 "Ngài suýt mất mạng mới thoát được"
  fp1_yearly.0061.b:0 "CHẠY!"
  fp1_yearly.0062.t:0 "$fp1_yearly.0051.t$: Gấu"
  fp1_yearly.0062.desc:0 "Gò mộ của [draugr.GetFirstNamePossessiveNoTooltip] lạnh lẽo và u ám. Dù ta và đoàn tùy tùng không thấy xác chết biết đi nào, trên tường có những vết cào dài và sâu, còn xương gia súc vương vãi khắp sàn.\n\nMột tiếng sột soạt bất ngờ từ góc tối thu hút ánh nhìn của ta, và thứ ta tưởng là một đống lá bắt đầu đứng dậy, lộ ra con gấu lớn nhất ta từng thấy, cao đến chín hay mười thước. Nó chớp mắt lờ đờ nhìn chúng ta, gần như thân thiện.\n\nRồi nó gầm lên."
  fp1_yearly.0062.a:0 "Ta sẽ lột da ngươi làm thảm!"
  fp1_yearly.0062.a.tt_success:0 "Ngài hạ gục con quái vật"
  fp1_yearly.0062.a.tt_failure:0 "Đoàn tùy tùng kéo Ngài khỏi cái chết chắc chắn"
  fp1_yearly.0062.b:0 "$fp1_yearly.0061.b$"
  fp1_yearly.0063.t:0 "$fp1_yearly.0051.t$: Nithing"
  fp1_yearly.0063.desc:0 "Gò mộ của [draugr.GetFirstNamePossessiveNoTooltip] không có quái vật, không có đồ tùy táng, thậm chí không có cả xác chết. Tìm kiếm quanh khu vực một lúc, ta phát hiện thi thể của [draugr.GetFirstNameNoTooltip] bị lật úp trong một con mương và phủ sơ sài bằng lá cây cách đó không xa.\n\nThay vào đó, ngôi mộ đã bị biến thành một nơi trú ngụ tạm bợ, bị một tên sống ngoài vòng pháp luật chiếm lấy từ tay kẻ chết.\n\nKhi ta bàn bạc với đoàn tùy tùng về việc nên làm gì, tiếng huýt sáo vui vẻ vang lên từ xa, ngày một gần. Tên vô lại đang tiến đến!"
  fp1_yearly.0063.a:0 "Mọi người im lặng, áp sát vào tường!"
  fp1_yearly.0063.a.tt_success:0 "Cái bẫy thành công"
  fp1_yearly.0063.a.tt_failure:0 "[draugr_nithing.GetFirstNameNoTooltip] nhận ra có điều bất thường và bỏ chạy"
  fp1_yearly.0063.a.tt_failure.draugr_nithing_escapes:0 "[draugr_nithing.GetFirstNameNoTooltip] lang thang nơi hoang dã, tiếp tục gây rắc rối"
  fp1_yearly.0063.b:0 "Thật phí thời gian chết tiệt của ta!"
  fp1_yearly.0064.t:0 "$fp1_yearly.0051.t$: Trẻ Mồ Côi"
  fp1_yearly.0064.desc:0 "Đám nông dân quả quyết rằng xác chết biết đi của [draugr.GetFirstNamePossessiveNoTooltip] đã trộm thức ăn của họ, yểm bùa gia súc và cào cửa sổ ban đêm, nhưng khi ta đến gò mộ của [draugr.GetHerHis], ta thấy một cảnh tượng hoàn toàn khác.\n\nGiữa một ổ lông thú bị đánh cắp và thức ăn ăn dở ngồi một đứa trẻ mồ côi, tròn mắt nhìn ta với nỗi kinh hoàng tột độ."
  fp1_yearly.0064.a:0 "Đi đi, đứa trẻ. Ngươi không thể ở lại đây."
  fp1_yearly.0064.a.tt:0 "[draugr_orphan.GetFirstNameNoTooltip] lang thang vào vùng hoang dã..."
  fp1_yearly.0064.b:0 "Trẻ con hay không, tống kẻ trộm này vào ngục!"
  fp1_yearly.0064.c:0 "Hãy đến triều đình, [Select_CString(draugr_orphan.IsFemale,'cô bé','cậu bé')]: mộ phần không phải là nơi dành cho người sống."
  fp1_yearly.0064.d:0 "Chẳng lẽ... chẳng lẽ mọi đứa trẻ đều xứng đáng có một [ROOT.Char.GetMotherFather] sao?"
  fp1_yearly.0065.t:0 "$fp1_yearly.0051.t$: Hóa Ra Vẫn Yên Lặng"
  fp1_yearly.0065.desc:0 "Gò mộ của [draugr.GetFirstNamePossessiveNoTooltip] vẫn như khi [draugr.GetSheHe] được chôn cất. Những ngôi mộ khác mà đám nông dân yêu cầu ta kiểm tra cũng vậy.\n\nTa cũng chẳng tìm thấy gì trong những hang động bị cho là bị nguyền rủa, lùm cây ma ám hay hang ổ của người khổng lồ: sau vài tuần, ta bắt đầu nghi ngờ liệu những quái vật ấy có thực sự #EMP tồn tại#! hay không.\n\nÍt ra chuyến đi này cũng rèn luyện thân thể cho ta."
  fp1_yearly.0065.a:0 "Có lẽ chỉ là gió thổi?"
  fp1_yearly.0065.a.locals_grumble:0 "Dân Chúng Bất Mãn"

  fp1_yearly.0071.t:0 "Nơi Sâu Thẳm Của Thế Gian"
  fp1_yearly.0071.desc.intro:0 "Đám nông dân ở [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] vốn mê tín, thường xuyên tìm đến ta với những lời kể về phù thủy, người khổng lồ hay các vị thần cải trang.\n\nThường thì ta bỏ ngoài tai những lời ấy như trò kịch của dân đen, nhưng lần này họ mang theo bằng chứng:"
  fp1_yearly.0071.desc.troll_type.bear:0 "một cậu bé nông dân trẻ, đầu bị nghiền nát thành bột và thịt vụn, cùng cha mẹ gào khóc đã chứng kiến cái chết của nó."
  fp1_yearly.0071.desc.troll_type.wolf:0 "xác một thợ săn nổi tiếng, ngực bị xé toạc, trái tim mềm bị nuốt chửng."
  fp1_yearly.0071.desc.troll_type.wolverine:0 "một đống xương và thịt rách nát mà họ khăng khăng mới đây còn là một bà lão giặt đồ."
  fp1_yearly.0071.desc.troll_type.lynx:0 "một tá lợn bị giết, mỗi con bị xé quá khéo léo để là thú hoang vụng về, nhưng rõ ràng là do móng vuốt chứ không phải dao."
  fp1_yearly.0071.desc.troll_type.moose:0 "xác một con cừu nhuốm máu, rõ ràng bị xé toạc nhưng không bị ăn, thậm chí không bị nhai, rách tả tơi bởi thứ không giống móng vuốt nào ta từng thấy."
  fp1_yearly.0071.desc.outro.loveli_lakes:0 "\n\nTa mới xem xét đống hỗn độn được một lúc thì [loveli_lakes.GetTitledFirstName] bước lên.\n\n\"Đây không phải quỷ khổng lồ, [ROOT.Char.GetFirstNameNoTooltip], mà là một con nai rừng hung dữ! Ta biết rõ con thú đó, cả cú cắn hiểm độc của nó, và ta sẽ khắc dấu của mình lên xác nó.\""
  fp1_yearly.0071.desc.outro.fallback:0 "\n\nDân địa phương khẳng định đây chắc chắn là việc của quỷ khổng lồ và yêu cầu ta lùng sục khu rừng lân cận để tiêu diệt nó."
  fp1_yearly.0071.a:0 "Ta sẽ tự tay giết con thú!"
  fp1_yearly.0071.a.tt:0 "Ngài lên đường cùng một nhóm chiến binh"
  fp1_yearly.0071.b:0 "[marshal.GetTitledFirstNameNoTooltip], lo việc này đi."
  fp1_yearly.0071.b.tt_success:0 "Thống chế và quân lính của [marshal.GetHerHis] săn lùng được con quái vật"
  fp1_yearly.0071.b.tt_failure:0 "Con thú thoát khỏi tay [marshal.GetFirstNameNoTooltip]"
  fp1_yearly.0071.c:0 "Nghe như gấu thôi. Tự lo đi, lũ hèn nhát."
  fp1_yearly.0081.hunt_invalidated:0 "Cuộc Săn Quỷ Ở [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] Chấm Dứt"
  fp1_yearly.0081.hunt_invalidated.tt:0 "Những tình huống bất ngờ buộc Ngài phải chuyển hướng chú ý"
  fp1_yearly.0081.desc.prelude:0 "Khu rừng thì thầm khe khẽ khi chúng ta tiến lên, ôm chặt nhóm tùy tùng nhỏ của ta trong vòng tay tối tăm. Ta tự nhủ đó chỉ là gió, nhưng có người nói quỷ khổng lồ hát như gió khi ở một mình...\n\nMột vài vụ mất tích xảy ra gần bãi trống này, khiến nơi đây có vẻ là chỗ trú ngụ của con thú. Ít nhất, dân địa phương nói vậy.\n\n"
  fp1_yearly.0081.desc.finisher:0 "Không phải quỷ khổng lồ, nhưng vẫn là con mồi của chúng ta!"
  fp1_yearly.0081.t:0 "$fp1_yearly.0071.t$: Cái Chết Cao Vút"
  fp1_yearly.0081.desc:0 "$fp1_yearly.0081.desc.prelude$Một tiếng gầm xé tai vang dội khắp lùm cây, và thứ ta tưởng là một tảng đá bỗng dựng đứng lên, lộ ra một con gấu #EMP cao lớn khủng khiếp#!.\n\n$fp1_yearly.0081.desc.finisher$"
  fp1_yearly.0081.a:0 "Chết đi, quái vật!"
  fp1_yearly.0081.a.tt_success:0 "Ngài tàn sát con gấu"
  fp1_yearly.0081.a.tt_failure:0 "Con gấu xé Ngài làm đôi"
  fp1_yearly.0081.b:0 "#BER RAAAAARGH!#!"
  fp1_yearly.0081.b.tt:0 "Ngài xé xác con thú làm hai trong cơn cuồng nộ berserk"
  fp1_yearly.0081.c:0 "Tiến lên, #EMP tiến lên#! và xông vào, hỡi những Con Sói của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!"
  fp1_yearly.0081.c.tt_success:0 "Ngài truyền cảm hứng cho binh lính giết con gấu"
  fp1_yearly.0081.c.tt_failure:0 "Con thú làm Ngài bị thương rồi trốn thoát"
  fp1_yearly.0081.c.tt_failure.tt:0 "Ngài chịu một vết thương nặng #warning VĨNH VIỄN#!"
  fp1_yearly.0081.d:0 "#EMP CHẠY MAU!#!"
  fp1_yearly.0082.t:0 "$fp1_yearly.0071.t$: Cái Chết Chớp Nhoáng"
  fp1_yearly.0082.desc:0 "$fp1_yearly.0081.desc.prelude$Một tiếng gầm rợn người vang lên phía sau chúng Ta, tiếng chân đệm trên đất, rồi ai đó ở cuối đội hét thất thanh. Ta quay phắt lại vừa kịp né con sói khổng lồ, bộ lông điểm bạc vì tuổi tác và nhuốm đỏ máu khi nó lao vụt qua. $fp1_yearly.0081.desc.finisher$"
  fp1_yearly.0082.a:0 "$fp1_yearly.0081.a$"
  fp1_yearly.0082.a.tt_success:0 "Ngài hạ gục con sói"
  fp1_yearly.0082.a.tt_failure:0 "Con sói xé toạc cổ họng Ngài"
  fp1_yearly.0082.b:0 "$fp1_yearly.0081.b$"
  fp1_yearly.0082.b.tt:0 "$fp1_yearly.0081.b.tt$"
  fp1_yearly.0082.c:0 "Tập hợp! Lập vòng tròn!"
  fp1_yearly.0082.c.tt_success:0 "Ngài dồn ép, bao vây và giết con sói"
  fp1_yearly.0082.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
  fp1_yearly.0082.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
  fp1_yearly.0082.d:0 "$fp1_yearly.0081.d$"
  fp1_yearly.0083.t:0 "$fp1_yearly.0071.t$: Cái Chết Cuồng Loạn"
  fp1_yearly.0083.desc:0 "$fp1_yearly.0081.desc.prelude$Thứ đầu tiên chúng Ta thấy là nó xé toạc cổ họng người lính bên trái Ta: một khối lông và răng lao đi như chớp, chỉ lớn hơn chó một chút nhưng nhanh hơn cả lưỡi kiếm bổ xuống. Một con chồn sói điên dại! $fp1_yearly.0081.desc.finisher$"
  fp1_yearly.0083.a:0 "$fp1_yearly.0081.a$"
  fp1_yearly.0083.a.tt_success:0 "Ngài kết liễu con chồn sói"
  fp1_yearly.0083.a.tt_failure:0 "Con chồn sói moi ruột Ngài ra"
  fp1_yearly.0083.b:0 "$fp1_yearly.0081.b$"
  fp1_yearly.0083.b.tt:0 "$fp1_yearly.0081.b.tt$"
  fp1_yearly.0083.c:0 "Có một nhà nghỉ săn bắn gần đây, rút lui tới đó cầu viện!"
  fp1_yearly.0083.c.tt_success:0 "Ngài nhử nó lại gần nhà nghỉ và áp đảo nó bằng quân số"
  fp1_yearly.0083.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
  fp1_yearly.0083.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
  fp1_yearly.0083.d:0 "$fp1_yearly.0081.d$"
  fp1_yearly.0084.t:0 "$fp1_yearly.0071.t$: Cái Chết Lặng Thầm"
  fp1_yearly.0084.desc:0 "$fp1_yearly.0081.desc.prelude$Ta khựng lại. Bằng cách nào đó nó chưa nhìn thấy chúng Ta, nhưng Ta #EMP vừa đủ#! nhận ra dáng hình rạp mình của một con linh miêu ở phía bên kia bãi trống. Chỉ thêm một bước bất cẩn nữa thôi có lẽ đã là bước cuối cùng của Ta. $fp1_yearly.0081.desc.finisher$"
  fp1_yearly.0084.a:0 "$fp1_yearly.0081.a$"
  fp1_yearly.0084.a.tt_success:0 "Ngài giết con linh miêu"
  fp1_yearly.0084.a.tt_failure:0 "Con linh miêu vặn gãy cổ Ngài"
  fp1_yearly.0084.b:0 "$fp1_yearly.0081.b$"
  fp1_yearly.0084.b.tt:0 "$fp1_yearly.0081.b.tt$"
  fp1_yearly.0084.c:0 "Im lặng! Hai người các ngươi vòng ra sau, chúng ta sẽ lùa nó về phía đó..."
  fp1_yearly.0084.c.tt_success:0 "Ngài dùng mưu và kỹ năng săn bắn để hạ con linh miêu"
  fp1_yearly.0084.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
  fp1_yearly.0084.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
  fp1_yearly.0084.d:0 "$fp1_yearly.0081.d$"
  fp1_yearly.0085.t:0 "$fp1_yearly.0071.t$: Cái Chết Cuồng Nộ"
  fp1_yearly.0085.desc.loveli_lakes:0 "Với [loveli_lakes.GetTitledFirstName] dẫn đường, chúng Ta nhanh chóng đến sào huyệt trong rừng của con thú điên loạn.\n\nƯớc gì chúng Ta đủ may mắn bắt gặp nó khi đang ngủ, nhưng không, và con quái vật hoang dại khổng lồ dựng đứng lên khi chúng Ta bước vào khoảng trống của nó, cao gấp đôi một [ROOT.Char.GetWomanMan].\n\nNó thở hồng hộc, mắt đảo loạn vì cơn cuồng bệnh trong tâm trí, móng guốc chẻ đôi giậm mạnh xuống đất.\n\nRồi nó lao tới."
  fp1_yearly.0085.desc.fallback:0 "$fp1_yearly.0081.desc.prelude$Sự im lặng vỡ tan bởi một tiếng #EMP RẦM#! kinh hoàng khi một con nai sừng tấm khổng lồ, điên dại lao ra, cao gấp đôi một [ROOT.Char.GetWomanMan], lỗ mũi phì bọt trắng và giận dữ. $fp1_yearly.0081.desc.finisher$"
  fp1_yearly.0085.a:0 "$fp1_yearly.0081.a$"
  fp1_yearly.0085.a.tt_success:0 "Ngài đâm chết con nai sừng tấm"
  fp1_yearly.0085.a.tt_failure:0 "Con nai sừng tấm nghiền nát xương Ngài"
  fp1_yearly.0085.b:0 "$fp1_yearly.0081.b$"
  fp1_yearly.0085.b.tt:0 "$fp1_yearly.0081.b.tt$"
  fp1_yearly.0085.c:0 "Điểm yếu ở gốc cổ! Chỉ dùng giáo và cung!"
  fp1_yearly.0085.c.tt_success:0 "Ngài hạ con nai sừng tấm mà không bị giẫm nát"
  fp1_yearly.0085.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
  fp1_yearly.0085.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
  fp1_yearly.0085.d:0 "$fp1_yearly.0081.d$"

  fp1_yearly.0091.t:0 "Một Con Tàu Xứng Với Một [ROOT.Char.GetTitleAsNameNoTooltip]"
  fp1_yearly.0091.desc:0 "Chiếc thuyền dài của một [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] nói lên rất nhiều điều về [ROOT.Char.GetHerHim]. Nó cho ngài biết [ROOT.Char.GetSheHe] giàu có đến đâu, thành công thế nào, và hình ảnh [ROOT.Char.GetSheHe] muốn thể hiện với phần còn lại của thế giới.\n\nTa nhìn vào con thuyền hiện tại của mình và đánh giá nó... là thiếu sót. Như để nhấn mạnh suy nghĩ đó, một mảnh giàn dây bung ra với tiếng nứt, cả con tàu kêu cọt kẹt đầy điềm gở khi nó phải phân bổ lại áp lực.\n\nĐặt làm một con tàu mới thì đủ đơn giản, nhưng liệu một sự thay thế đơn giản có đủ tốt? Chẳng lẽ ta không xứng đáng có một con thuyền nói với cả thế giới về #EMP chính ta#! sao?"
  fp1_yearly.0091.a:0 "Một con thủy quái khổng lồ, để chở chiến lợi phẩm của ta!"
  fp1_yearly.0091.b:0 "Một con quái vật, để khiến chư hầu phải khiếp sợ!"
  fp1_yearly.0091.c:0 "Một con rồng, để gầm vang tên ta!"
  fp1_yearly.0091.d:0 "Ta không cần một con tàu tốn kém như vậy."

  fp1_yearly.0101.t:0 "Một Trò Chơi Câu Đố"
  fp1_yearly.0101.desc:0 "Đố vui là thú tiêu khiển được ưa chuộng trong giới [ROOT.Char.GetCulture.GetNameNoTooltip]. Hai hay nhiều người sẽ thay nhau đưa ra những câu hỏi ngày càng hóc búa, thường có vần điệu và thấm đẫm ẩn dụ hoặc thần thoại.\n\nTrong một ngày dài và lười biếng, [riddler.Custom2('MyCharacterIntroduction',ROOT.Char)] nảy ý muốn thách đấu Ta một ván, với gần như nửa triều đình đứng xem."
  fp1_yearly.0101.a:0 "Ngươi thử thách tài ăn nói của #EMP ta#! ư? Thú vị đấy!"
  fp1_yearly.0101.a.tt_success:0 "Ngài thắng cuộc"
  fp1_yearly.0101.a.tt_failure:0 "[riddler.GetFirstNameNoTooltip] đánh bại Ngài"
  fp1_yearly.0101.a.every_courtier_and_guest:0 "Mọi [courtier|E] và [guest|E]"
  fp1_yearly.0101.b:0 "Ta nghĩ mình đã đọc vài cuốn sách về câu đố..."
  fp1_yearly.0101.c:0 "Bắt đầu nhé: kẻ nào không có não và sắp vào ngục tối?"
  fp1_yearly.0101.c.tt:0 "Mọi người có thể sẽ nhớ phản ứng thái quá của Ngài..."
  fp1_yearly.0101.c.tt_nickname:0 "Các cận thần thì thầm sau lưng Ngài..."
  fp1_yearly.0101.d:0 "Cảm ơn, nhưng ta là một [ROOT.Char.GetTitleAsNameNoTooltip], và ta còn nhiều việc phải làm."

  fp1_yearly.0111.t:0 "Bị Nguyền Rủa"
  fp1_yearly.0111.desc.intro:0 "[accursed.GetTitledFirstName] im lặng khi ta bước vòng quanh cột vật tổ bọc da ngựa dựng trước khu ở của [accursed.GetHerHis], quan sát nó từ mọi góc độ. [accursed.GetSheHe|U] nói đúng, đây chắc chắn là một cột nithing, một #EMP lời nguyền quyền năng#! đe dọa chính mạng sống của [accursed.GetHerHis].\n\nNhững ký tự rune khắc trên thân cột"
  fp1_yearly.0111.desc.skill.intrigue_high:0 " #color_blue_gray tinh xảo và cầu kỳ, hứa hẹn một cái chết méo mó, đau đớn#!."
  fp1_yearly.0111.desc.skill.learning_high:0 " #color_blue_gray sâu hoắm và nhuốm máu, rõ ràng do một pháp sư uyên thâm thực hiện#!."
  fp1_yearly.0111.desc.skill.intrigue_low:0 " #color_blue_gray tàn nhẫn nhưng nguệch ngoạc, như thể ý nghĩ đẫm máu của kẻ đê tiện kia đang lạc lối#!."
  fp1_yearly.0111.desc.skill.learning_low:0 " #color_blue_gray cẩu thả và thấm đẫm máu me, dấu hiệu của một pháp sư nghiệp dư#!."
  fp1_yearly.0111.desc.skill.fallback:0 " #color_blue_gray không thể nào giải đọc được#!."
  fp1_yearly.0111.desc.first_connector:0 "Nội dung thực sự của lời nguyền"
  fp1_yearly.0111.desc.trait_1.lazy_or_arbitrary:0 " #color_blue_gray toát lên sự do dự và lười biếng#!,"
  fp1_yearly.0111.desc.trait_1.wrathful_or_impatient:0 " #color_blue_gray sôi sục cơn giận dữ bồn chồn#!,"
  fp1_yearly.0111.desc.trait_1.calm_or_patient:0 " #color_blue_gray bình thản đến mức đáng sợ và đầy nham hiểm#!,"
  fp1_yearly.0111.desc.trait_1.sadistic_or_arrogant:0 " #color_blue_gray nói lên cái Ta to lớn hoặc trí tưởng tượng kinh hoàng#!,"
  fp1_yearly.0111.desc.trait_1.callous_or_ambitious:0 " #color_blue_gray cho thấy sự khinh rẻ hoàn toàn đối với đồng loại#!,"
  fp1_yearly.0111.desc.trait_1.deceitful_or_craven:0 " #color_blue_gray vặn vẹo và lặp lại quanh co không dứt#!,"
  fp1_yearly.0111.desc.trait_1.brave_or_trusting:0 " #color_blue_gray táo bạo và nổi bật, tự tin vào sự chính đáng của mình#!,"
  fp1_yearly.0111.desc.trait_1.paranoid_or_vengeful:0 " #color_blue_gray dường như chứa đựng một mối thù hận hết sức cá nhân#!,"
  fp1_yearly.0111.desc.trait_1.fallback:0 " #color_blue_gray là một mớ hỗn độn ngẫu nhiên#!,"
  fp1_yearly.0111.desc.second_connector:0 "kết lại bằng một nốt"
  fp1_yearly.0111.desc.trait_2.lazy_or_arbitrary:0 " #color_blue_gray giống như một cao trào hụt được giải thích cẩu thả#!."
  fp1_yearly.0111.desc.trait_2.wrathful_or_impatient:0 " #color_blue_gray của cơn thịnh nộ được viết vội vàng#!."
  fp1_yearly.0111.desc.trait_2.calm_or_patient:0 " #color_blue_gray của sự tất yếu đáng sợ#!."
  fp1_yearly.0111.desc.trait_2.sadistic_or_arrogant:0 " #color_blue_gray của thiên tài kinh hoàng#!."
  fp1_yearly.0111.desc.trait_2.callous_or_ambitious:0 " #color_blue_gray của hồi kết tàn nhẫn và vô cảm#!."
  fp1_yearly.0111.desc.trait_2.deceitful_or_craven:0 " #color_blue_gray của sự hèn nhát méo mó#!."
  fp1_yearly.0111.desc.trait_2.brave_or_trusting:0 " #color_blue_gray đầy tự tin thẳng thắn vào diệt vong của [accursed.GetFirstNamePossessiveNoTooltip]#!."
  fp1_yearly.0111.desc.trait_2.paranoid_or_vengeful:0 " #color_blue_gray đổ lỗi cho [accursed.GetFirstNameNoTooltip] về diệt vong của [accursed.GetHerHis]#!."
  fp1_yearly.0111.desc.trait_2.fallback:0 " #color_blue_gray của một cao trào hụt#!."
  fp1_yearly.0111.desc.outro:0 "\n\nChúng ta không có nhân chứng, và cũng chẳng có #color_blue_gray bằng chứng#! nào ngoài chính cột nguyền rủa này."
  fp1_yearly.0111.tt.correct_guess:0 "Nếu phán đoán của Ngài là đúng"
  fp1_yearly.0111.tt.wrong_guess:0 "Nếu phán đoán của Ngài là sai"
  fp1_yearly.0111.tt.correct_accusation:0 "Ngài tìm thấy bằng chứng rõ ràng về tội lỗi của [culprit.GetFirstNamePossessiveNoTooltip]"
  fp1_yearly.0111.tt.correct_accusation.tt:0 "[accursed.GetTitledFirstName] được giải khỏi lời nguyền và mãi mãi biết ơn"
  fp1_yearly.0111.tt.false_accusation:0 "Những cáo buộc của Ngài hóa ra vô căn cứ"
  fp1_yearly.0111.tt.false_accusation.tt:0 "[accursed.GetTitledFirstName] tin rằng kết cục đau đớn của [accursed.GetHerHis] sẽ sớm ập đến"
  fp1_yearly.0111.a:0 "Mùi này giống hệt [suspect_a.GetTitledFirstNameNoTooltip]!"
  fp1_yearly.0111.b:0 "Có lẽ... [suspect_b.GetTitledFirstNameNoTooltip]..."
  fp1_yearly.0111.c:0 "[suspect_c.GetTitledFirstNameNoTooltip] có vẻ đáng nghi."
  fp1_yearly.0111.d:0 "[accursed.GetFirstNameNoTooltip], chẳng phải tất cả chỉ là do Ngài tự tưởng tượng sao?"
  fp1_yearly.0111.d.tt_success:0 "Ngài trấn an được [accursed.GetFirstName]"
  fp1_yearly.0111.d.tt_failure:0 "[accursed.GetSheHe|U] bị suy sụp tinh thần"
  fp1_yearly.0111.e:0 "Đừng lo, ta có bùa giải chú!"

 ##################################################
 # #Flavour Events
  fp1_yearly.0501.t:0 "Ra Khơi"
  fp1_yearly.0501.desc:0 "Có nhiều lý do để ta dong buồm trên vùng biển gần [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] trong thời bình: phô trương sức mạnh, răn đe hải tặc, hay đơn giản là câu cá và tận hưởng gió biển.\n\nChúng ta đang trong một chuyến hải hành nhỏ như vậy thì ta phát hiện một con thuyền địa phương đang chao đảo phía xa.\n\nNgay cả từ đây cũng thấy rõ nó đã bị hư hại khi đi cướp bóc, thủy thủ đoàn chỉ vừa đủ sức giữ cho nó nổi bằng cách tát nước ra ngoài bằng những chiếc cốc bạc và bát sứ. Cảnh tượng ấy hẳn đã buồn cười nếu không nghiêm trọng đến vậy."
  fp1_yearly.0501.a:0 "Dừng lại và cố giúp họ!"
  fp1_yearly.0501.a.tt_success:0 "Ngài cứu được thủy thủ đoàn"
  fp1_yearly.0501.a.tt_failure:0 "Con thuyền chìm cùng toàn bộ thủy thủ"
  fp1_yearly.0501.b:0 "Ta có thể giữ chiến lợi phẩm nếu giết hết kẻ sống sót..."
  fp1_yearly.0501.b.tt_success:0 "Ngài dễ dàng chiếm thuyền"
  fp1_yearly.0501.b.tt_failure:0 "Những kẻ sống sót trốn thoát lên bờ"
  fp1_yearly.0501.c:0 "Cứ mặc kệ và tiếp tục hành trình."

  fp1_yearly.0511.t:0 "Mùi Hôi Của Thành Công"
  fp1_yearly.0511.desc:0 "#EMP Mùi này thật hoàn toàn không thể chịu nổi#!.\n\nĐã tròn một tháng kể từ khi [stinker.GetFirstName] hạ gục [ROOT.Char.Custom('GetAnimalType')] khốn khiếp đó trong lúc đi săn, và [stinker.GetSheHe] vẫn #EMP cứ#! mang cái đầu đầy dòi bọ của nó theo bên mình.\n\nMọi người ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] đều phát ốm vì nó, nhưng [stinker.GetSheHe] từ chối vứt bỏ cái thứ chết tiệt đó.\n\nCó vẻ như phần còn lại của triều đình cuối cùng đã chịu hết nổi, và ép [stinker.GetHerHim] phải đến gặp ta để xin một phán quyết."
  fp1_yearly.0511.a:0 "Nó đẹp lắm đấy, [stinker.GetFirstNameNoTooltip]. Đẹp lắm, thật sự đấy."
  fp1_yearly.0511.b:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.HealthGodName] và cả [ROOT.Char.GetFaith.HouseholdGodName], vứt #EMP ngay#! nó đi!"
  fp1_yearly.0511.c:0 "$fp1_berserk_roar_evtopt$"
  fp1_yearly.0511.d:0 "Hay là ngày mai ta kiếm cho ngươi một chiến tích #EMP mới#!?"
  fp1_yearly.0511.e:0 "Đúng vậy, [stinker.GetFirstNameNoTooltip], nó thối lắm. Giờ thì lui đi."

  fp1_yearly.0521.t:0 "Máu Trên Tuyết"
  fp1_yearly.0521.desc:0 "Nó đến từ hư không, trúng thẳng vào thái dương ta. Ta thậm chí còn không thấy vật thể bay tới, huống hồ là né tránh, và trong khoảnh khắc ta loạng choạng, hoa mắt.\n\nMột tràng cười khúc khích sắc lẻm vang lên sau lưng, và ta quay phắt lại.\n\n[child.GetFirstName] bước ra khỏi chỗ ẩn nấp của [child.GetHerHis], một quả cầu tuyết khác đã nằm gọn trong bàn tay nhỏ bé đầy “hiểm độc” của [child.GetHerHis]."
  fp1_yearly.0521.a:0 "Ném hay lắm! Lại đây nào, đồ ranh con!"
  fp1_yearly.0521.a.tt:0 "Ngài và [child.GetFirstNameNoTooltip] ném tuyết cho đến khi tê cóng đầu ngón tay"
  fp1_yearly.0521.b:0 "#EMP Ôi! Không! Ngươi hạ được ta rồi!#!"
  fp1_yearly.0521.b.tt:0 "Ngươi để cho [child.GetFirstNameNoTooltip] ném đá ngươi cho đến khi [child.GetHerHis] thỏa lòng"
  fp1_yearly.0521.c:0 "Ngươi nghĩ có thể đối đầu với #EMP ta#! trong #EMP chiến tranh tuyết#! sao?"
  fp1_yearly.0521.c.tt:0 "Trẻ con hay không, đây là chiến trận và Ngài quyết tâm chiến thắng!"
  fp1_yearly.0521.c.tt_success:0 "Ngài đánh bại đứa trẻ"
  fp1_yearly.0521.c.tt_failure:0 "[child.GetFirstNameNoTooltip] đánh bại Ngài"
  fp1_yearly.0521.d:0 "Thế mà gọi là phục kích ư? Chiến thuật #EMP thực thụ#! đòi hỏi sự #EMP xảo quyệt#! cơ!"
  fp1_yearly.0521.d.tt:0 "Ngài dễ dàng thắng trận ném tuyết"
  fp1_yearly.0521.e:0 "$fp1_berserk_roar_evtopt$"
  fp1_yearly.0521.e.tt:0 "Quả cầu tuyết khơi dậy cơn cuồng nộ berserk của Ngài"
  fp1_yearly.0521.f:0 "Ta đang bận, [child.GetFirstNameNoTooltip]. Đi làm phiền người khác đi."

  fp1_yearly.0531.t:0 "Gia Tộc [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] Trên Băng"
  fp1_yearly.0531.desc:0 "\"[ROOT.Char.Custom('GetMaPa')|U]!\" [child.GetFirstName] kêu lên, kéo tay áo ta ngay khi chúng ta đến bờ ao. \"Thật vô dụng, con chẳng làm được trò trống gì. Con không thể trượt băng, băng giá ghét con.\"\n\nMột cái nhìn nhanh cho thấy [child.GetSheHe] có thể đúng: nơi này trông như thể một đội quân vừa hành quân qua, với lượng băng vỡ mà [child.Custom('GetDaughterSon')] của ta để lại trên đường đi của [child.GetHerHis]."
  fp1_yearly.0531.a:0 "Dễ thôi mà! Đây, để ta giải thích cho con..."
  fp1_yearly.0531.a.tt_success:0 "[child.GetFirstNameNoTooltip] lấy lại tự tin và giữ thăng bằng tốt hơn"
  fp1_yearly.0531.a.tt_failure:0 "Ngài chỉ càng khiến [child.GetHerHim] thêm nản lòng"
  fp1_yearly.0531.b:0 "Chẳng phải có gia nhân để con làm phiền sao?"
  fp1_yearly.0531.c:0 "Vào trong nhà chơi đi, kẻo cảm lạnh."

  fp1_yearly.0541.t:0 "Quái Thú Của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
  fp1_yearly.0541.desc:0 "\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của tôi\", [courtier.GetTitledFirstName] hằn học khi [courtier.GetSheHe] tiến lại phía ta, lôi [child.Custom('GetDaughterSon')] [child.GetFirstName] của ta bằng tai của [child.GetHerHis].\n\n\"Đứa trẻ chết tiệt này cứ nấp ở các góc đường, mặc một bộ da [ROOT.Char.Custom('GetAnimalType')] để làm hóa trang, chỉ để nhảy ra hét lớn và làm mọi người khiếp vía!\""
  fp1_yearly.0541.a:0 "Thật lòng mà nói, chuyện này buồn cười chết đi được."
  fp1_yearly.0541.b:0 "[child.GetFirstNameNoTooltip], con cần bị phạt."
  fp1_yearly.0541.c:0 "Ngươi dám quấy rối [child.Custom('GetDaughterSon')] #EMP của ta#!? Ngươi bị trục xuất!"
  fp1_yearly.0541.d:0 "Ta thật sự, #EMP hoàn toàn#! không quan tâm."

  fp1_yearly.0551.t:0 "Chuyện Mùi Cá"
  fp1_yearly.0551.desc:0 "Nó bắt đầu như một món quà thỉnh thoảng có được. Một thói quen lạ lùng, nhưng ta là một [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.Char.GetWomanMan] tốt bụng, và [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.Char.GetWomanMan] nào chưa từng ăn phải món cá trích ươn trong đời của [ROOT.Char.GetHerHis] chứ?\n\nTuy nhiên, trong vài tuần qua, thiên hướng của [antisocialite.GetTitledFirstNamePossessive] đối với món cá #EMP thối rữa#! hoàn toàn đã chuyển từ một nét lập dị có thể chịu đựng được thành một sự hiện diện nồng nặc.\n\nSáng nay, khi ta phát hiện ra [antisocialite.GetSheHe] đã làm gì với nhà vệ sinh, ta quyết định rằng mình đã chịu đựng đủ. Ta tìm thấy [antisocialite.GetHerHim] trong sảnh, mặt thấm đẫm nước muối hôi hám, một nửa con mắt cá lười biếng chảy dài xuống cằm của [antisocialite.GetHerHis]."
  fp1_yearly.0551.a:0 "Ngồi xuống đi, [antisocialite.GetFirstNameNoTooltip]. Chúng ta cần nói chuyện."
  fp1_yearly.0551.a.tt_success:0 "Ngài trình bày quan điểm một cách thuyết phục"
  fp1_yearly.0551.a.tt_failure:0 "[antisocialite.GetFirstNameNoTooltip] cảm thấy bị xúc phạm nặng nề"
  fp1_yearly.0551.b:0 "Hay là ta chuyển phòng ở thì hơn?"
  fp1_yearly.0551.b.tt:0 "[antisocialite.GetFirstNameNoTooltip] sẽ tiếp tục làm cả nơi này bốc mùi"
  fp1_yearly.0551.b_alt:0 "Ờm... ngươi còn chút nào nữa không?"
  fp1_yearly.0551.b_alt.tt:0 "Ngài và [antisocialite.GetFirstNameNoTooltip] cùng nhau làm cả nơi bốc mùi"
  fp1_yearly.0551.c:0 "Biết không? Ngục tối. #EMP Ngay#!."
  fp1_yearly.0551.d:0 "Thật đáng tiếc, có vẻ ta phải chú ý tới việc ở #EMP rất#! xa nơi này!"

  fp1_yearly.0561.t:0 "Tay Ta Đấu Tay Ngươi"
  fp1_yearly.0561.desc:1 "\"Ngài nói sao, [ROOT.Char.GetFirstNameNoTooltip]?\" [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] ợ hơi giữa những ngụm bia từ cốc của [knight.GetHerHis]. [knight.Custom('GetYoungMiddleAgedOld')] [knight.GetWomanMan] gồng cơ bắp của [knight.GetHerHis] một cách đầy tự hào.\n\n\"Nghĩ là ngài có thể thắng tôi trong trò vật tay không? Làm đi, ai thắng ba trước là thắng.\"\n\nChiếc thìa của ta khựng lại trên đường đến miệng, nhưng quán rượu bùng nổ trong những tiếng reo hò và phấn khích, những thành viên thấp cấp hơn trong đoàn tùy tùng của ta háo hức chứng kiến cuộc so tài."
  fp1_yearly.0561.a:0 "Ngươi thách đấu ta?"
  fp1_yearly.0561.a.tt_success:0 "Ngài đánh bại [knight.GetFirstNameNoTooltip]"
  fp1_yearly.0561.a.tt_failure:0 "[knight.GetFirstNameNoTooltip] chiến thắng"
  fp1_yearly.0561.b:0 "#EMP *bẻ khớp tay*#!"
  fp1_yearly.0561.b.tt:0 "Ngài dễ dàng thắng liền ba hiệp"
  fp1_yearly.0561.c:0 "Ừ, ta cũng biết vài mánh khóe..."
  fp1_yearly.0561.c.tt_success:0 "Ngài gian lận để giành chiến thắng kịch tính"
  fp1_yearly.0561.c.tt_failure:0 "[knight.GetFirstNameNoTooltip] phát hiện trò gian dối của Ngài"
  fp1_yearly.0561.d:0 "[knight.GetFirstNameNoTooltip], ta đang ăn. Đi làm phiền người khác đi."

  fp1_yearly.0571.t:0 "Phá Hoại Vặt"
  fp1_yearly.0571.desc:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip]!" [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] kêu lên. Phía sau [courtier.GetHerHim], người [courtier.GetWomanMan] kéo [child.Custom('GetDaughterSon')] của ta là [child.GetFirstName], cả hai bận trừng mắt nhau đến mức gần như quên cả nhìn ta.\n\n"Đứa trẻ này bị bắt quả tang bôi bẩn bia đá rune của ngài ở [vandal_site.GetNameNoTier], vẽ bộ phận sinh dục lên lũ rồng và khắc những lời thô tục thay cho văn tự.""
  fp1_yearly.0571.a:0 "Để [child.Custom('GirlBoy')] lại cho ta, ta sẽ nói chuyện với [child.GetHerHim]."
  fp1_yearly.0571.tt_success:0 "[child.GetFirstNameNoTooltip] nhận ra sai lầm trong cách cư xử của [child.GetHerHis]"
  fp1_yearly.0571.tt_failure:0 "[child.GetFirstNameNoTooltip] không hiểu mình đã làm sai điều gì"
  fp1_yearly.0571.b:0 "Ta sẽ trừ chi phí sửa chữa vào #EMP đồ đạc của con#!, [child.GetFirstNameNoTooltip]!"
  fp1_yearly.0571.b.tt:0 "Bia đá rune được sửa chữa"
  fp1_yearly.0571.b.2:0 "Không sao, ta sẽ trả tiền."
  fp1_yearly.0571.c:0 "[child.GetSheHe|U] chỉ là trẻ con thôi, [courtier.GetFirstNameNoTooltip], bình tĩnh lại."

  fp1_yearly.0581.t:0 "Khi Con Trưởng Thành"
  fp1_yearly.0581.desc.intro:0 "Một cơn đau buốt bất ngờ ở bắp chân sau đi kèm tiếng hét rợn người phía sau lưng. Ta xoay phắt lại, sẵn sàng tự vệ, và đối diện với dáng hình bé nhỏ của [child.GetFirstName] đang vung một cây gậy gỗ to làm chùy."
  fp1_yearly.0581.desc.victim:0 "Phía sau [child.GetHerHim], [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] đứng đó với nụ cười nhếch mép."
  fp1_yearly.0581.desc.outro:0 "\n\n\"Hãy khiếp sợ ta! Viking đáng sợ [child.GetFirstNameNoTooltip] đã đến vì vàng và các tu sĩ của các người!\" [child.Custom('GetDaughterSon')] của ta hét lên, kèm theo một cú đập vào đầu gối ta. Chiếc mũ sắt bằng thiếc của [child.GetHerHis|U] trượt xuống che mắt [child.GetHerHis], vì vậy tất cả những gì ta có thể thấy là một nụ cười sún răng đang cười toe toét với ta.\n\n\"[ROOT.Char.Custom('GetMaPa')|U], con có thể trở thành một [child.Custom('ShieldPersonFemaleMale')] khi lớn lên được không?\""
  fp1_yearly.0581.a:0 "Con ta, con sẽ khiến cả thế gian phải #EMP run sợ#!."
  fp1_yearly.0581.a.tt:0 "[child.GetFirstNameNoTooltip] có khả năng cao hơn nhiều để trở thành [GetTrait('shieldmaiden').GetName(child.Self)]"
  fp1_yearly.0581.b:0 "Mục tiêu cao quý đấy! Đỡ lấy này, tên vô lại!"
  fp1_yearly.0581.b.tt:0 "$fp1_yearly.0581.a.tt$"
  fp1_yearly.0581.c:0 "Có lẽ, nếu con chứng tỏ bản thân trước [victim.GetFirstNameNoTooltip]..."
  fp1_yearly.0581.d:0 "Đừng làm phiền ta với những giấc mơ viển vông."
  fp1_yearly.0581.e:0 "Ha! Rồi ta sẽ xem, nhóc con."

  fp1_yearly.0591.t:0 "Tiếng Cãi Vã Tại Ting"
  fp1_yearly.0591.desc:1 "Các buổi họp Ting là bổn phận cần thiết của bất kỳ [ROOT.Char.GetTitleAsNameNoTooltip] tử tế nào, khi mọi [dummy_gender.GetWomenMen] tự do trong vùng tụ họp để bàn việc địa phương, chợ búa và tranh giành đặc quyền.\n\nNhư thường lệ với những đám đông như vậy, không khí dễ trở nên căng thẳng, và buổi Ting này cũng không ngoại lệ.\n\nTa khó lòng theo kịp chi tiết giữa tiếng la hét, nhưng có vẻ như [dummy_gender.GetWomenMen] từ [county_a.GetNameNoTier]"
  fp1_yearly.0591.desc.border_dispute:0 "đang tranh chấp một ngôi làng dọc biên giới với [county_b.GetNameNoTier], cả hai bên đều tuyên bố chủ quyền."
  fp1_yearly.0591.desc.stolen_flocks:0 "tố cáo một phú hộ nổi tiếng từ [county_b.GetNameNoTier] đã đánh cắp đàn gia súc của họ."
  fp1_yearly.0591.desc.kidnapped_child:0 "đang gào thét vào phía [county_b.GetNameNoTier] vì cáo buộc bắt cóc một đứa trẻ."
  fp1_yearly.0591.desc.drunken_arson:0 "phản đối việc bị buộc tội gây ra hàng loạt vụ phóng hỏa khi say xỉn ở [county_b.GetNameNoTier]."
  fp1_yearly.0591.desc.lost_dog:0 "khẳng định con chó biểu tượng của làng đã bị đám côn đồ ghen tị từ [county_b.GetNameNoTier] đánh cắp."
  fp1_yearly.0591.desc.disrupted_wedding:0 "đòi bồi thường cho một đám cưới bị khách say rượu từ [county_b.GetNameNoTier] phá hỏng."
  fp1_yearly.0591.desc.suspicious_will:0 "khăng khăng tính hợp pháp của một di chúc để lại cho họ nhiều dải đất lớn ở [county_b.GetNameNoTier]."
  fp1_yearly.0591.desc.sheltered_criminal:0 "đã che chở cho một tội phạm từ [county_b.GetNameNoTier]."
  fp1_yearly.0591.desc.bad_luck:0 "kêu rằng họ bị phù phép và nguyền rủa bởi các pháp sư từ [county_b.GetNameNoTier]."
  fp1_yearly.0591.desc.fly_tipping:0 "cứng đầu đổ rác bừa bãi từ một thị trấn dọc biên giới với [county_b.GetNameNoTier]."
  fp1_yearly.0591.a:0 "Người dân [county_a.GetNameNoTierNoTooltip] đúng."
  fp1_yearly.0591.b:0 "[county_b.GetNameNoTierNoTooltip] có sự ủng hộ của ta!"
  fp1_yearly.0591.c:0 "Chẳng lẽ những [county_a.GetNameNoTierNoTooltip][dummy_gender.GetWomenMen] tốt bụng lại chịu thua #EMP [county_b.GetNameNoTierNoTooltip]#! sao?"
  fp1_yearly.0591.d:0 "Rồi họ cũng sẽ tự mệt mà thôi."

  fp1_yearly.0601.t:0 "Phần Khó Nhất Khi Cai Trị"
  fp1_yearly.0601.desc:0 "Theo bản chất của mình, các buổi họp Ting thường #EMP cực kỳ#! nhàm chán.\n\nNếu không có ai nổi nóng hay gây kịch tính, thì chỉ là danh sách dài những [dummy_gender.GetWomenMen] tự do cấp thấp bàn chuyện vặt vãnh và đứng dưới mưa. Thế nhưng, với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], ta buộc phải có mặt.\n\nGià đi từng giây.\n\nNhìn [dummy_gender.GetWomenMen] của [county.GetNameNoTier] nói cho nhau đến chết.\n\nƯớc gì có một cuộc chiến để cứu ta khỏi địa ngục sống này."
  fp1_yearly.0601.a:0 "Phải. Thức. Tỉnh."
  fp1_yearly.0601.a.tt_success:0 "Ngài gắng gượng và giữ được vẻ điềm tĩnh"
  fp1_yearly.0601.a.tt_failure:0 "Ngài trượt khỏi ghế mà ngủ gật"
  fp1_yearly.0601.b:0 "Ta có thể làm bao việc hữu ích khác với thời gian này..."
  fp1_yearly.0601.c:0 "$fp1_yearly.0601.b$"
  fp1_yearly.0601.d:0 "$fp1_yearly.0601.b$"
  fp1_yearly.0601.e:0 "$fp1_yearly.0601.b$"
  fp1_yearly.0601.f:0 "$fp1_yearly.0601.b$"
  fp1_yearly.0601.g:0 "Thật vô nghĩa, ta đi ngủ một lát."
  fp1_yearly.0601.g.nickname:0 "Hành động của Ngài mang lại một biệt danh mới"

  fp1_yearly.0611.t:0 "Làm Gương"
  fp1_yearly.0611.desc:0 "\"[ROOT.Char.Custom('GetMaPa')|U]!\" [child_b.GetFirstNameNoTooltip] hét lên, chạy về phía ta, khóc lóc, với một [child_a.GetFirstNameNoTooltip] trông đầy tội lỗi đi theo sau. Một vết cắt lớn làm biến dạng khuôn mặt của [child_b.Custom('GetDaughterSon')] của ta, nông, nhưng vẫn đang rỉ máu. \"[child_a.GetSheHe|U] đánh con bằng một thanh kiếm #EMP thật#!! Nói rằng [child_a.GetSheHe] sẽ trở thành một chiến binh như ngài!\"\n\n[child_a.GetFirstNameNoTooltip] không thể ép bản thân nhìn thẳng vào mắt ta.\n\n\"Đó là tai nạn. Chúng con chỉ đang chơi đùa thôi...\""
  fp1_yearly.0611.a:0 "Nghe đây, #EMP chiến tranh#! không phải là #EMP trò chơi#!!"
  fp1_yearly.0611.a.tt_success:0 "[child_a.GetFirstNameNoTooltip] hiểu ra và xin lỗi"
  fp1_yearly.0611.a.tt_failure:0 "Lời nói của Ngài chỉ gieo thêm sự cay đắng"
  fp1_yearly.0611.b:0 "Ha! Đúng là con của [ROOT.Char.Custom('GetMaPa')] này, [child_a.GetFirstNameNoTooltip]!"
  fp1_yearly.0611.c:0 "Được rồi, [child_b.GetFirstNameNoTooltip], để ta dạy con cách chống lại kẻ bắt nạt."
  fp1_yearly.0611.d:0 "Các con, về với nhũ mẫu đi."

  fp1_yearly.0621.t:0 "Một Món Đồ Chơi Sáng Loáng"
  fp1_yearly.0621.desc:0 "Chúng Ta vừa dỡ xong những chiến lợi phẩm cuối cùng từ tàu thì [child.Custom('GetDaughterSon')] của Ta, [child.GetFirstName], xuất hiện với nụ cười rạng rỡ và hàng loạt câu hỏi. Ta đã hạ gục bao nhiêu [dummy_gender.GetWomenMen]? Khi nào [child.GetSheHe] có thể tham gia một cuộc cướp bóc? Ta có nhìn thấy rồng biển không?\n\nCơn mưa câu hỏi chỉ dừng lại khi [child.Custom('GirlBoy')] nhìn thấy một chiếc cốc bạc khổng lồ đặt trên chiếc rương lớn nhất, máu khô của chủ nhân cũ vẫn còn bong nhẹ ở bên cạnh.\n\n"[ROOT.Char.Custom('GetMaPa')|U], nó đẹp quá! Con... con có thể lấy nó không?""
  fp1_yearly.0621.a:0 "Tất nhiên con có thể lấy!"
  fp1_yearly.0621.b:0 "Không phải bây giờ: khi lớn hơn, con có thể tự mình giành lấy."
  fp1_yearly.0621.c:0 "Đi chỗ khác! Cái này dành cho người lớn!"

  fp1_yearly.0631.t:0 "Khuynh Hướng Hoài Nghi"
  fp1_yearly.0631.desc:0 "Sau khi trở về từ một cuộc cướp bóc thành công, mọi [ROOT.Char.GetCulture.GetNameNoTooltip] [cynic.GetWomanMan] tốt bụng đều biết phải hy sinh một phần chiến lợi phẩm của mình cho [ROOT.Char.GetFaith.PantheonTerm].\n\nMọi [ROOT.Char.GetCulture.GetNameNoTooltip] tốt bụng ngoại trừ [cynic.GetTitledFirstName], đó là.\n\nKhi những người còn lại trong chúng ta chia chiến lợi phẩm, khoe khoang về những món đồ tốt nhất và thảo luận xem chúng ta sẽ tặng món nào để cảm tạ vì vận may và những cơn gió thuận lợi, ta nhận thấy [cynic.GetSheHe] vẫn im lặng.\n\nKhi đối mặt với [cynic.GetWomanMan] này, [cynic.GetSheHe] thậm chí thừa nhận điều đó: \"Ta không thấy bàn tay của [cynic.GetFaith.PantheonTerm] trong cuộc đột kích của chúng ta, thưa [ROOT.Char.GetTitleAsNameNoTooltip], chỉ có bàn tay của chính ta thực hiện công việc của chính ta. Phần của ta là dành cho ta.\""
  fp1_yearly.0631.a:0 "[cynic.GetFirstNameNoTooltip], ngươi suýt nữa là phạm thượng!"
  fp1_yearly.0631.a.tt_success:0 "Ngài khiến [cynic.GetHerHim] phải hổ thẹn"
  fp1_yearly.0631.a.tt_failure:0 "[cynic.GetFirstNameNoTooltip] khiến Ngài thành trò cười"
  fp1_yearly.0631.b:0 "Hmm, ý hay đấy. Góp gió thành bão..."
  fp1_yearly.0631.c:0 "Eh, không phải chuyện của ta."

  fp1_yearly.0641.t:0 "Xứng Danh Biển Cả"
  fp1_yearly.0641.desc:0 "Thuyền dài, theo nhiều cách, chính là trái tim sức mạnh của một [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]. Không có biển, chúng ta chẳng khác gì những con sói bị mắc kẹt, không thể săn mồi hay lang thang?\n\nVì thế Ta không khỏi lo lắng khi lần kiểm tra mới nhất cho thấy nhiều con thuyền đang bắt đầu mục nát và hư hỏng, thân tàu ghép chắc chắn có nguy cơ bung ra khi hạ thủy."
  fp1_yearly.0641.a:0 "Sửa chúng chắc cũng không tốn bao nhiêu..."
  fp1_yearly.0641.a.tt:0 "Những con tàu được sửa chữa ổn thỏa"
  fp1_yearly.0641.b:0 "Chẳng phải [neighbour.GetTitledFirstNameNoTooltip] có một hạm đội khá mới sao?"
  fp1_yearly.0641.b.tt_success:0 "Ngài trộm được những con tàu tốt nhất của [neighbour.GetFirstNamePossessiveNoTooltip]"
  fp1_yearly.0641.b.tt_failure:0 "Ngài bị phát hiện và phải tháo chạy"
  fp1_yearly.0641.c:0 "Chi tiền tốt nhất bây giờ sẽ tiết kiệm về lâu dài."
  fp1_yearly.0641.d:0 "Kệ chúng mục đi. Có hại gì đâu?"

  fp1_yearly.0651.t:0 "Leviathan"
  fp1_yearly.0651.desc:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip] mạnh mẽ cần phải dành thời gian trên biển, với không khí mặn mòi trên khuôn mặt của [ROOT.Char.GetHerHis] và một con tàu tốt bên dưới đôi chân của [ROOT.Char.GetHerHis]. Hôm nay, con thuyền cá nhân và một phi đội hộ tống nhỏ của ta ra ngoài để diễn tập, luyện tập và giải trí.\n\nChuyến đi ngắn đã là một sự thay đổi nhịp độ đầy hứng khởi so với cuộc sống tại [ROOT.Char.Custom('GetCourt')], khi chúng ta phát hiện ra nó: một cột nước từ xa, theo sau là một hòn đảo nhỏ bằng thịt màu đỏ rượu vang lăn ra khỏi sóng.\n\nCon quái vật vĩ đại nhất của tất cả các vực sâu.\n\nMột con #EMP cá voi#!."
  fp1_yearly.0651.a:0 "Chuẩn bị lao móc!"
  fp1_yearly.0651.a.tt_success:0 "Ngài hạ gục cá voi và kéo nó vào bờ"
  fp1_yearly.0651.a.tt_failure:0 "Con thú thoát khỏi tay Ngài"
  fp1_yearly.0651.b:0 "Cứ để họ xử lý, mang xác về cho ta."
  fp1_yearly.0651.c:0 "Một con mồi #EMP vĩ đại#! biết bao!"
  fp1_yearly.0651.c.tt:0 "Ngài đối mặt với một #EMP quái vật biển sâu#! thực sự"
  fp1_yearly.0651.c.tt_success:0 "$fp1_yearly.0651.a.tt_success$"
  fp1_yearly.0651.c.tt_failure:0 "$fp1_yearly.0651.a.tt_failure$"
  fp1_yearly.0651.d:0 "Sinh vật uy nghi đáng sợ, hãy để nó đi."
  fp1_yearly.0651.d.tt:0 "Cá voi được tự do"

  fp1_yearly.0661.t:0 "Một Thử Thách Mới Lạ"
  fp1_yearly.0661.desc:0 ""Điều Ta muốn nói, [ROOT.Char.GetTitledFirstNameNoTooltip], là trượt tuyết vẫn vui ngay cả khi không săn bắn. Không nên xem việc trượt chỉ vì niềm vui là điều gì quá khác thường", [knight.GetTitledFirstName] lải nhải trong bữa tối.\n\nTa cảm giác như đã nghe cuộc trò chuyện này suốt cả đời. Sự ám ảnh của [knight.Custom('WomanManPossessive')].\n\n"Chúng ta nên thử ngay bây giờ, khi tuyết còn dày và mới! Có một con dốc cao không xa đây. Ta cá là Ta sẽ xuống tới chân dốc trước, và cả hai ta sẽ có khoảng thời gian tuyệt vời!""
  fp1_yearly.0661.a:0 "Thú vị đấy! Ta chấp nhận."
  fp1_yearly.0661.a.tt_success:0 "Sát nút, nhưng Ngài thắng!"
  fp1_yearly.0661.a.tt_failure:0 "[knight.GetFirstNameNoTooltip] trượt đến chiến thắng"
  fp1_yearly.0661.a.2:0 "Ra ngoài tuyết ư? Ta chấp nhận."
  fp1_yearly.0661.a.2.tt:0 "Ngài dễ dàng trượt đến chiến thắng"
  fp1_yearly.0661.b:0 "Hmmm, có lẽ ta cần một chút #EMP lợi thế#!..."
  fp1_yearly.0661.b.tt_success:0 "Ngài giành chiến thắng #EMP dễ dàng#!"
  fp1_yearly.0661.b.tt_failure:0 "Ngài bị phát hiện phá hoại ván trượt của [knight.GetFirstNamePossessiveNoTooltip]"
  fp1_yearly.0661.c:0 "Trượt tuyết #EMP thi đấu#! mà không săn bắn? Nghe chán thật."

  fp1_yearly.0671.t:0 "Con Dốc Trơn Trượt"
  fp1_yearly.0671.desc:0 ""[ROOT.Char.Custom('GetMaPa')|U]!" [child.GetFirstNameNoTooltip] hét lên ngay sát tai Ta. Ta miễn cưỡng mở mắt, từng bên một. Đúng là một cách đánh thức.\n\nĐứa trẻ nhỏ bên giường Ta gần như run lên vì phấn khích, ôm chặt găng tay và một tấm ván gỗ đắt tiền.\n\n"Bên ngoài đang có tuyết và con muốn đi #EMP trượt xe tuyết#!! Người sẽ đưa con đi chứ?""
  fp1_yearly.0671.a:0 "Ha, để ta kéo ra một cái bàn vậy!"
  fp1_yearly.0671.b:0 "Đi nào, lấy một cái khay từ nhà bếp!"
  fp1_yearly.0671.c:0 "Đi hỏi [sibling.Custom('SisterBrother')] của con đi."
  fp1_yearly.0671.d:0 "Đi đi, [ROOT.Char.GetMotherFather] đang nghỉ ngơi."

  fp1_yearly.0681.t:0 "Tại Sao Con Không Được Đi?"
  fp1_yearly.0681.desc:0 "Ta và các $knight_culture_player_plural_no_tooltip_lowercase$ đang tận hưởng một buổi tối vui vẻ tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], chia sẻ chuyện chiến trận xưa và những cuộc cướp bóc đã qua, cười nói, khoe khoang và chìm sâu vào men rượu. Quả là một khoảng thời gian tuyệt vời.\n\nLờ mờ, Ta thấy một bóng người lảng vảng bên cửa thư phòng và gọi kẻ xâm nhập vào. Những bàn tay lập tức đặt lên chuôi kiếm khắp căn phòng.\n\nThay vì một sát thủ, [child.Custom('GetDaughterSon')] của Ta, [child.GetFirstName], bước ra với gương mặt cương quyết, [child.Custom('HandHands')] siết chặt thành những [child.Custom('Fist_ArticleBlank')][child.Custom('FistFists')] nhỏ xíu.\n\n"[ROOT.Char.Custom('GetMaPa')|U], con cũng muốn đi cướp bóc! Thật không công bằng khi con bị bỏ lại chỉ vì còn nhỏ!""
  fp1_yearly.0681.a:0 "Ta để con ở lại canh giữ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], được chứ?"
  fp1_yearly.0681.b:0 "#EMP Ha!#! Con sẽ không bao giờ là một chiến binh #EMP thực thụ#! đâu."
  fp1_yearly.0681.b.haughty_knights:0 "Mọi [knight|E] kiêu ngạo"
  fp1_yearly.0681.c:0 "Chúng ta sẽ nói về chuyện này khi con lớn hơn."

  fp1_yearly.0691.t:0 "Chuộc Lỗi Bất Thành"
  fp1_yearly.0691.desc:0 "Đã muộn khi [knight.GetTitledFirstName] tiếp cận ta, một chiếc túi hành lý được đeo trên lưng của [knight.GetHerHis].\n\n\"Thưa [ROOT.Char.GetTitledFirstNameNoTooltip], tôi rất tiếc phải nói với ngài điều này, nhưng tôi không thể tiếp tục phục vụ ngài nữa.\n\n\"Kể từ cuộc đột kích vào [county.GetNameNoTier], tôi đã bị dằn vặt bởi cảm giác tội lỗi về những hành động của mình, và những nô lệ của tôi nói với tôi rằng chỉ bằng cách chấp nhận [knight.GetFaith.HighGodName] vào trái tim mình thì linh hồn tôi mới có thể được cứu rỗi.\n\n\"Với một trái tim nặng trĩu, tôi phải rời bỏ triều đình tội lỗi của ngài và những điều khủng khiếp mà tôi đã làm khi phục vụ ngài.\""
  fp1_yearly.0691.a:0 "Chắc hẳn ta có thể thuyết phục ngươi từ bỏ đức tin ngoại lai này?"
  fp1_yearly.0691.a.tt_success:0 "Ngài đưa [knight.GetFirstNameNoTooltip] trở lại ánh sáng"
  fp1_yearly.0691.a.tt_failure:0 "[knight.GetSheHe|U] từ chối nghe theo lẽ phải"
  fp1_yearly.0691.b:0 "[knight.GetFaith.GetReligion.GetNameNoTooltip]? Ngươi điên rồi. Lính đâu!"
  fp1_yearly.0691.b.same_faith_courtiers_and_guests:0 "Các [courtiers|E] và [guests|E] cùng [faith|E]"
  fp1_yearly.0691.c:0 "Ngươi có thể rời đi nếu muốn."

 ##################################################
 # #Special Events
  fp1_yearly.1001.t:0 "Kẻ Lạ Mặt Tại Triều Đình"
  fp1_yearly.1001.desc.intro:0 "Vài lần trong những ngày gần đây, ta nhận thấy một kẻ lang thang bí ẩn, [stranger.GetFirstName], xuất hiện tại triều đình. Ta không nhớ gương mặt [stranger.GetHerHis], cũng không hề có thông báo nào về việc [stranger.GetHerHis] đến.\n\n"
  fp1_yearly.1001.desc.behaviour_1.sneaks:0 "[stranger.GetSheHe|U] lén lút quanh quẩn khắp nơi,"
  fp1_yearly.1001.desc.behaviour_1.leaves_early:0 "[stranger.GetSheHe|U] luôn rời khỏi bữa tối rất sớm,"
  fp1_yearly.1001.desc.behaviour_1.earnest:0 "[stranger.GetSheHe|U] dành hàng giờ trò chuyện nghiêm túc với các cận thần,"
  fp1_yearly.1001.desc.behaviour_1.confident:0 "[stranger.GetSheHe|U] bước đi đầy tự tin #EMP khắp mọi nơi#!,"
  fp1_yearly.1001.desc.behaviour_1.talkative:0 "[stranger.GetSheHe|U] dành hàng giờ nói chuyện với bất kỳ ai và tất cả mọi người,"
  fp1_yearly.1001.desc.behaviour_1.eats_their_fill:0 "[stranger.GetSheHe|U] không bao giờ để sót một mẩu thức ăn nào trong bữa tối,"
  fp1_yearly.1001.desc.behaviour_2.sneaks:0 "và lén lút quanh quẩn đến tận đêm khuya."
  fp1_yearly.1001.desc.behaviour_2.leaves_early:0 "và không bao giờ ở lại ăn tối lâu hơn mức [stranger.GetSheHe] bắt buộc."
  fp1_yearly.1001.desc.behaviour_2.earnest:0 "và dành hàng giờ trò chuyện nghiêm túc với các cận thần của ta."
  fp1_yearly.1001.desc.behaviour_2.confident:0 "và bước đi đầy tự tin #EMP khắp mọi nơi#!."
  fp1_yearly.1001.desc.behaviour_2.talkative:0 "và dành hàng giờ nói chuyện với bất kỳ ai tình cờ đi ngang qua [stranger.GetHerHis]."
  fp1_yearly.1001.desc.behaviour_2.eats_their_fill:0 "và không bao giờ để sót một mẩu thức ăn nào trong bữa tối."
  fp1_yearly.1001.desc.outro:0 "Có lẽ [stranger.GetSheHe] chẳng là gì đáng kể, nhưng có điều gì đó ở [stranger.GetHerHim] khiến ta cảm thấy bất an.\n\nMột kẻ lang thang có thể gây ra bao nhiêu rắc rối chỉ trong một hai ngày?"
  fp1_yearly.1001.probably_harmless.tt:0 "Việc này sẽ chỉ có ảnh hưởng nhỏ"
  fp1_yearly.1001.guest_of_honour.tt:0 "Việc này sẽ có ảnh hưởng #EMP to lớn#!"
  fp1_yearly.1001.mysterious_stranger_disappears.tt:0 "Kẻ lạ mặt bí ẩn biến mất..."
  fp1_yearly.1001.a:0 "[stranger.GetSheHe|U] chắc cũng vô hại thôi."
  fp1_yearly.1001.b:1 "Kẻ lang thang ư? Ta sẽ phong [stranger.GetHerHim] làm thượng khách!"
  fp1_yearly.1001.c:0 "Lính đâu! Tống cổ tên ăn mày đó ra ngoài!"
  fp1_yearly.1011.t:0 "$fp1_yearly.1001.t$: Goði"
  fp1_yearly.1011.desc.critical_preamble:0 "Sự kỳ lạ của [stranger.GetNamePossessiveNoTooltip] chỉ càng tăng lên tương xứng với sự đối đãi tử tế mà [stranger.GetHerHis] nhận được, nhưng những hành vi lập dị của [stranger.GetHerHis] chưa bao giờ trở nên đáng báo động. Khi ta quyết định mặc kệ, ta kinh ngạc khi [stranger.GetNameNoTooltip] bất ngờ xuất hiện trong phòng riêng của ta vào một đêm, không hề báo trước.\n\n"
  fp1_yearly.1011.desc.critical_epilogue:0 "\n\nNhanh như lúc xuất hiện, [stranger.GetNameNoTooltip] biến mất, và ta bản năng biết rằng sẽ không còn dấu vết nào của [stranger.GetHerHim] vào sáng hôm sau."
  fp1_yearly.1011.desc.standard_preamble:0 "[stranger.GetNameNoTooltip] tiếp tục lảng vảng quanh triều đình, nhưng [stranger.GetSheHe] dường như chẳng làm gì ngoài việc khiến người khác khó chịu nhiều nhất. Cho đến cái đêm [stranger.GetSheHe] xuất hiện trong phòng riêng của ta sau khi trời tối.\n\n"
  fp1_yearly.1011.desc.standard_epilogue:0 "\n\nNgay khi [stranger.GetSheHe] đến, [stranger.GetFirstNameNoTooltip] tan biến trở lại bóng tối. Các nhóm tìm kiếm không tìm thấy gì cả, không một dấu vết, và ta chỉ còn lại với toàn những câu hỏi."
  fp1_yearly.1011.desc.separate_religion.critical:0 "$fp1_yearly.1011.desc.critical_preamble$\"Kẻ vô đạo!\" Tên vô ơn gào lên. \"Ngươi nghĩ có thể mua chuộc đức tin của ta bằng phép tắc bàn tiệc và gối lông ngỗng ư?! Ta là một [stranger.GetFaith.GetAdherentNameNoTooltip] chân chính, và ta sẽ không bao giờ từ bỏ các Cổ Thần! Thay vào đó, ta sẽ nói cho toàn bộ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.PriestNeuterPlural] của ngươi biết rằng ngươi đã chứa chấp một kẻ ngoại đạo!\"$fp1_yearly.1011.desc.critical_epilogue$"
  fp1_yearly.1011.desc.separate_religion.standard:0 "$fp1_yearly.1011.desc.standard_preamble$\"Nếu ta là một [stranger.GetWomanMan] tầm thường hơn, ta đã giết ngươi ngay tại đây vì đức tin báng bổ của ngươi. May cho ngươi, danh dự của ta đáng giá hơn mạng sống của ngươi, và ta chỉ tự bằng lòng với việc truyền bá lời của [stranger.GetFaith.HighGodName] tại triều đình của ngươi.\"$fp1_yearly.1011.desc.standard_epilogue$"
  fp1_yearly.1011.desc.same_religion.critical:0 "$fp1_yearly.1011.desc.critical_preamble$\"Ngươi thờ phụng các vị thần không ra sao, [ROOT.Char.GetFirstNameNoTooltip], nhưng lại tôn kính họ đúng mực. Dù đức tin của ngươi xúc phạm các Aesir, ngươi đã làm hài lòng Đấng Bị Treo, và ta, Grímnir, sẽ để các [stranger.GetFaith.PriestNeuterPlural] trong vùng biết điều đó.\"$fp1_yearly.1011.desc.critical_epilogue$"
  fp1_yearly.1011.desc.same_religion.standard:0 "$fp1_yearly.1011.desc.standard_preamble$\"Ngươi thờ phụng các vị thần một cách tệ hại, và không nhận ra thần tính chân thực trong triều đình mình, ngay cả khi Grímnir lảng vảng trong chính hành lang và ngồi tại bàn tiệc của ngươi. Ta thương hại ngươi, [ROOT.Char.GetWomanMan] con, vì ngươi sẽ #EMP không bao giờ#! được thấy đại sảnh Valhalla của ta!\"$fp1_yearly.1011.desc.standard_epilogue$"
  fp1_yearly.1011.desc.same_faith.critical:0 "$fp1_yearly.1011.desc.critical_preamble$\"Lòng hiếu khách của ngươi thật đáng khen, [ROOT.Char.GetFirstNameNoTooltip], và ta thấy rằng ngươi hoặc khôn ngoan, hoặc sùng đạo, hoặc cả hai. Dù sao đi nữa, các [stranger.GetFaith.PriestNeuterPlural] thông thái trong vùng sẽ biết rằng ngươi đã tiếp đãi Grímnir và đối xử tử tế với Chúa Tể của các Aesir.\"$fp1_yearly.1011.desc.critical_epilogue$"
  fp1_yearly.1011.desc.same_faith.standard:0 "$fp1_yearly.1011.desc.standard_preamble$\"Ngươi đã bị những ánh mắt cổ xưa dõi theo, [ROOT.Char.GetFirstNameNoTooltip], và bị đánh giá là chưa xứng đáng,\" [stranger.GetFirstNameNoTooltip] gào lên, nước bọt văng tung tóe. \"Grímnir lang thang trong triều đình ngươi, còn ngươi không làm gì, không thấy gì sao? Các [stranger.GetFaith.PriestNeuterPlural] trong vùng sẽ biết rằng ngươi đã được các Aesir viếng thăm, và các vị thần đang dõi theo để xem ngươi có tiến bộ hay không!\"$fp1_yearly.1011.desc.standard_epilogue$"
  fp1_yearly.1011.a:0 "Chẳng lẽ đó thật sự là #EMP Đấng Phụ Thần#!?"
  fp1_yearly.1011.b:0 "Đồ khốn!"
  fp1_yearly.1011.possible_converts_specific_list:0 "Ít nhất một [courtier|E]"
  fp1_yearly.1012.t:0 "$fp1_yearly.1001.t$: Nhà Truyền Giáo [stranger.GetFaith.GetAdjectiveNoTooltip]"
  fp1_yearly.1012.desc.preamble:0 "[stranger.GetNameNoTooltip] chứng tỏ là một vị khách hoạt bát và uyên bác, hết đêm này sang đêm khác tham gia vào những cuộc thảo luận dài với các thành viên khác trong triều.\n\nTối nay, [stranger.GetSheHe] đến gặp ta, nụ cười rạng rỡ hiện rõ trên gương mặt [stranger.GetHerHis].\n\n"
  fp1_yearly.1012.desc.same_faith_epilogue:0 "\n\n[stranger.GetFirstNameNoTooltip] ngập ngừng. \"Nếu ngài muốn, Ta rất vinh dự được ở lại triều đình của ngài vĩnh viễn?\""
  fp1_yearly.1012.desc.different_faith.critical:0 "$fp1_yearly.1012.desc.preamble$\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Đã lâu rồi Ta mới được đối đãi tử tế như vậy, và Ta cảm tạ lòng hiếu khách của ngài. Tuy nhiên, Ta e rằng mình phải thú nhận: Ta là một [stranger.GetFaith.GetAdherentNameNoTooltip], Ta tớ của [stranger.GetFaith.HighGodName], và Ta đã truyền dạy giáo lý của [stranger.GetFaith.HighGodHerHis] cho thần dân của ngài.\""
  fp1_yearly.1012.desc.different_faith.standard:0 "$fp1_yearly.1012.desc.preamble$\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], Ta biết ngài vốn không đặc biệt thiện cảm với Ta, nhưng Ta phải thú nhận một điều. Trong suốt thời gian ở triều đình của ngài, Ta đã bàn luận về giáo huấn của [stranger.GetFaith.HighGodName] với thần dân của ngài, truyền dạy đức tin [stranger.GetFaith.GetAdjectiveNoTooltip] cho bất kỳ ai sẵn lòng lắng nghe.\""
  fp1_yearly.1012.desc.same_faith.critical:1 "$fp1_yearly.1012.desc.preamble$\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] nhân từ! Ta xin cảm tạ vì đã được đối đãi tốt suốt thời gian qua. Là một [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)] sùng đạo và đồng đạo [stranger.GetFaith.GetAdherentNameNoTooltip], Ta đã gửi thư tới các nhà thần học có ảnh hưởng khắp lãnh địa để ca ngợi lòng mộ đạo của ngài.\"$fp1_yearly.1012.desc.same_faith_epilogue$"
  fp1_yearly.1012.desc.same_faith.standard:0 "$fp1_yearly.1012.desc.preamble$\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta đã không hoàn toàn trung thực với ngài. Dù trông như một kẻ ăn mày, thực ra Ta là một [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)], và Ta đã dành thời gian ở triều đình để giảng dạy về giáo lý của [stranger.GetFaith.HealthGodName]. Dù ngài có thể không khuyến khích điều đó, Ta vẫn cảm tạ lòng hiếu khách của ngài.\"$fp1_yearly.1012.desc.same_faith_epilogue$"
  fp1_yearly.1012.a:0 "Hãy nói ta nghe thêm về... [stranger.GetFaith.GetNameNoTooltip]..."
  fp1_yearly.1012.a.recoup_lost_piety.tt:0 "Toàn bộ [piety|E] đã tiêu để tiếp đãi nhà truyền giáo sẽ được hoàn lại"
  fp1_yearly.1012.b:0 "Ngươi #EMP nói gì cơ#!? Rời đi. Ngay."
  fp1_yearly.1012.c:0 "Đồ [stranger.Custom2('InsultAdjective', ROOT.Char)] [stranger.Custom2('InsultNoun', ROOT.Char)]! #EMP LÍNH ĐÂU!#! Bắt lấy [stranger.GetHerHim]!"
  fp1_yearly.1012.d:0 "Ta chấp nhận sự phụng sự của ngươi."
  fp1_yearly.1012.e:0 "Ta đã có quá đủ cố vấn và thần học gia rồi, cảm ơn."
  fp1_yearly.1012.possible_converts_specific_list:1 "$fp1_yearly.1011.possible_converts_specific_list$"
  fp1_yearly.1013.t:0 "$fp1_yearly.1001.t$: Nithing"
  fp1_yearly.1013.desc.critical:0 "#EMP Thảm họa!#!\n\n[stranger.GetNameNoTooltip] đã đáp lại lòng hiếu khách của ta bằng cách trộm cắp trong đêm, cuỗm sạch mọi mảnh kim loại sáng loáng hay vải vóc quý giá mà [stranger.GetSheHe] có thể tìm thấy trước khi phóng đi trên con ngựa tốt nhất của ta!"
  fp1_yearly.1013.desc.standard: "[stranger.GetNameNoTooltip] đã trốn chạy trong đêm, mang theo [stranger.GetHerHim] tất cả những vật có giá trị mà [stranger.GetSheHe] có thể chạm tay vào."
  fp1_yearly.1013.desc.outro:1 "\n\nCó vẻ như kẻ lạ mặt bí ẩn thực chất là một kẻ bị ruồng bỏ đang chạy trốn: bị kết án vì một tội ác bị coi là tàn ác đến mức [stranger.GetSheHe] hiện không còn lời thề, không còn danh dự, và bị gia đình [stranger.GetHerHis] coi là đã chết về mặt pháp lý. Sự xúc phạm này thấm sâu."
  fp1_yearly.1013.desc.outro.sodomite:0 "\n\nCó vẻ kẻ lạ mặt bí ẩn thực chất là một nithing đang bỏ trốn: bị cộng đồng ruồng bỏ, [stranger.GetSheHe] lang thang từ triều đình này sang triều đình khác để tìm nơi dung thân.\n\nKhi các cận thần của ta cũng bảo thủ chẳng kém chủ cũ của [stranger.GetHerHis], [stranger.GetSheHe] đã bỏ chạy thay vì ở lại chịu đựng."
  fp1_yearly.1013.a:0 "Chết tiệt!"
  fp1_yearly.1013.a.sodomite:0 "Sống một cuộc đời như vậy..."
  fp1_yearly.1013.b:0 "Ta sẽ không nghỉ ngơi cho đến khi tìm ra tên nithing đó!"
  fp1_yearly.1014.t:0 "$fp1_yearly.1001.t$: Chiến Binh"
  fp1_yearly.1014.desc.critical:0 "[stranger.GetNameNoTooltip] có vẻ ngạc nhiên xen lẫn hài lòng khi được đối đãi như thượng khách, và đến gặp riêng ta vào cuối ngày.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], Ta đã không hoàn toàn trung thực với ngài. Dù trông có vẻ yếu đuối, thực ra Ta là một chiến binh lừng danh đáng sợ! Ta đã tìm kiếm một quân chủ xứng đáng với sự phục vụ của mình, và cách hành xử của ngài khiến Ta tin rằng người đó chính là ngài.\""
  fp1_yearly.1014.desc.standard:0 "[stranger.GetNameNoTooltip] tiếp tục lảng vảng quanh triều đình một thời gian, cuối cùng cũng xoay xở để có được một buổi yết kiến riêng với ta.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại, Ta muốn dâng thanh kiếm của mình cho ngài. Ta là một chiến binh phiêu bạt đã tìm kiếm một quân chủ tốt từ lâu, và quãng thời gian ở triều đình của ngài khiến Ta tin rằng người đó có thể là ngài.\""
  fp1_yearly.1014.desc.outro:0 "\n\nChắc chắn đây không phải là quá trình thông thường để có được $knight_culture_player_plural_no_tooltip_lowercase$, nhưng việc vượt qua thử thách của [stranger.GetHerHis] #EMP quả là#! đáng tự hào."
  fp1_yearly.1014.a:0 "Tuyệt vời! Ngươi xứng đáng với thù lao của mình!"
  fp1_yearly.1014.b:0 "Ta đã có thừa chiến binh thiện chiến mà không cần thử thách lòng kiên nhẫn của ta."
  fp1_yearly.1015.t:0 "$fp1_yearly.1001.t$: Kẻ Lang Thang"
  fp1_yearly.1015.desc.critical: "[stranger.GetFirstNameNoTooltip] bối rối, choáng ngợp và phấn khích bởi sự đối xử mà [stranger.GetSheHe] nhận được. Được coi là giới quý tộc nhỏ dường như là một trải nghiệm hoàn toàn mới đối với [stranger.GetHerHim], và phải mất một lúc lâu thì người đó mới nhận ra vấn đề."
  fp1_yearly.1015.desc.standard: "[stranger.GetFirstNameNoTooltip] vẫn đủ vô hại, như dự đoán là gây ra rất ít rắc rối trong thời gian ngắn [stranger.GetHerHis] ở trong gia đình ta. Chỉ đến khi ta tình cờ nghe [stranger.GetHerHim] có một cuộc trò chuyện thì thầm, ta mới nhận ra."
  fp1_yearly.1015.desc.outro:0 "\n\nHóa ra [stranger.GetSheHe] thực sự #EMP chỉ#! là một kẻ lang thang đã lẻn vào trong tường thành!\n\nKhi ta còn đang cân nhắc phải làm gì, [stranger.GetFirstNameNoTooltip] tìm đến ta, tay cầm mũ, cầu xin được ở lại vĩnh viễn."
  fp1_yearly.1015.a:0 "Tất nhiên ngươi có thể ở lại."
  fp1_yearly.1015.b:0 "Cái gì cơ?! Thật quá đáng, cút ngay!"

  fp1_yearly.1062.t:0 "Một Cuộc Đời Đáng Ghi Nhớ: [ship_funeral_candidate.GetFirstNameNoTooltip]"
  fp1_yearly.1062.desc:0 "Sự ra đi gần đây của [ship_funeral_candidate.Custom2('MyCharacterIntroduction',mourner)] đã khiến những người thân yêu của [ship_funeral_candidate.GetHerHis] đau buồn trước mất mát của một [ship_funeral_candidate.GetWomanMan] vĩ đại.\n\nLà một trong những người thân cận nhất với người đã khuất, ta có thể đảm nhận trách nhiệm tổ chức một tang lễ xứng đáng.\n\nTheo truyền thống của những tín đồ mộ đạo [ship_funeral_candidate.GetFaith.GetAdherentNamePluralNoTooltip], chúng ta chôn cất những người cao quý nhất cùng với một con thuyền, để nó đưa họ đến [ship_funeral_candidate.GetFaith.PositiveAfterLife], và hẳn rằng [ship_funeral_candidate.GetFirstNameNoTooltip] xứng đáng với vinh dự cao quý này?"
  fp1_yearly.1062.a:0 "Một con thuyền đá nhỏ mang tính tượng trưng là đủ."
  fp1_yearly.1062.a.tt:0 "Việc chuẩn bị cho tang lễ bắt đầu..."
  fp1_yearly.1062.b:0 "Một con thuyền đá hoành tráng, để gây ấn tượng với [ship_funeral_candidate.GetFaith.WarGodName]!"
  fp1_yearly.1062.c:0 "Một con thuyền buồm chạm trổ tinh xảo; [ship_funeral_candidate.GetFirstNameNoTooltip] xứng đáng với những gì tốt nhất."
  fp1_yearly.1062.d:0 "Tất cả chuyện này #EMP đắt đỏ quá mức#!..."
  fp1_yearly.1063.t:0 "$fp1_yearly.1062.t$"
  fp1_yearly.1063.desc.intro:0 "Ta đứng trước đám đông nhỏ những người đưa tang, ánh mắt lần lượt lướt qua từng khuôn mặt đẫm lệ, rồi bắt đầu bài điếu văn.\n\n\"[ship_funeral_candidate.GetFirstNameNoTooltip]"
  fp1_yearly.1063.desc.achievements.title.duchy:0 "một [ship_funeral_candidate.GetTitleAsNameNoTooltip] cao quý,"
  fp1_yearly.1063.desc.achievements.title.kingdom:0 "một [ship_funeral_candidate.GetTitleAsNameNoTooltip] rực rỡ,"
  fp1_yearly.1063.desc.achievements.title.empire:0 "một [ship_funeral_candidate.GetTitleAsNameNoTooltip] huy hoàng,"
  fp1_yearly.1063.desc.achievements.prestige.high:0 "một [ship_funeral_candidate.GetWomanMan] lừng lẫy,"
  fp1_yearly.1063.desc.achievements.prestige.very_high:0 "một [ship_funeral_candidate.GetWomanMan] cao quý bậc nhất,"
  fp1_yearly.1063.desc.achievements.prestige.max:0 "một huyền thoại thực sự của một [ship_funeral_candidate.GetWomanMan],"
  fp1_yearly.1063.desc.achievements.piety.high:0 "một Ta tớ tận tụy của [ship_funeral_candidate.GetFaith.HighGodName],"
  fp1_yearly.1063.desc.achievements.piety.very_high:0 "một hình mẫu đức hạnh vô song của [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
  fp1_yearly.1063.desc.achievements.piety.max:0 "một biểu tượng chân chính của đức tin [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
  fp1_yearly.1063.desc.achievements.lifestyles.partying:0 "nguồn suối của niềm vui và tiếng cười,"
  fp1_yearly.1063.desc.achievements.lifestyles.duelling:0 "một đấu sĩ thực sự chết chóc,"
  fp1_yearly.1063.desc.achievements.lifestyles.hunting:0 "tay săn bắn cừ khôi nhất khắp [hunting_lands.GetNameNoTierNoTooltip],"
  fp1_yearly.1063.desc.achievements.lifestyles.magickerationing:0 "một bậc thầy về huyền thuật,"
  fp1_yearly.1063.desc.achievements.single.intro:0 "đã có một ý chí phi thường. Có lẽ vì thế mà [ship_funeral_candidate.GetSheHe] được xem là"
  fp1_yearly.1063.desc.achievements.single.outro:0 "— một thành tựu mà [ship_funeral_candidate.GetSheHe] có lẽ sẽ không bao giờ bị vượt qua.\""
  fp1_yearly.1063.desc.achievements.double.intro:0 "là một con người tài năng hiếm có với nhiều mối quan tâm đa dạng. Cả"
  fp1_yearly.1063.desc.achievements.double.connector:0 "và"
  fp1_yearly.1063.desc.achievements.double.outro:0 "— không gì có thể lấp đầy khoảng trống mà sự ra đi của [ship_funeral_candidate.GetHerHis] để lại trong cuộc đời chúng ta.\""
  fp1_yearly.1063.desc.achievements.triple.intro:0 "là biết bao điều. [ship_funeral_candidate.GetSheHe|U] vừa là "
  fp1_yearly.1063.desc.achievements.triple.connector:0 "$fp1_yearly.1063.desc.achievements.double.connector$"
  fp1_yearly.1063.desc.achievements.triple.outro:2 "— nhưng với ta, trên hết, [ship_funeral_candidate.GetSheHe] là [ship_funeral_candidate.Custom2('RelationToMe', mourner)] của ta. Chúng ta sẽ không bao giờ còn thấy một người như [ship_funeral_candidate.GetHerHis] nữa.\""
  fp1_yearly.1063.desc.ship_stone_small:0 "\n\nGò mộ phía sau ta đã chứa một mô hình con thuyền nhỏ, được tạo hình bằng những bia đá nặng và lấp đầy bằng đá cuội, nay đã được chôn dưới lớp đất dày."
  fp1_yearly.1063.desc.ship_stone_grand:0 "\n\nGò mộ lớn phía sau ta chứa một mô hình thuyền khổng lồ, được xếp bằng các phiến đá rune và lấp đầy bằng đá cuội, mỗi tảng đá lớn đều kể lại câu chuyện từ cuộc đời người đã khuất."
  fp1_yearly.1063.desc.ship_wood_ornate:0 "\n\nGò mộ phía sau ta chứa một con thuyền được đóng riêng cho mục đích này, làm từ gỗ quý phương xa và bởi những người thợ đóng tàu giỏi nhất của chúng ta. Nó sẽ không bao giờ lướt trên đại dương phàm trần, nhưng có thể làm hài lòng [ship_funeral_candidate.GetFaith.PantheonTerm] và mang phúc lành đến cho người đã khuất."
  fp1_yearly.1063.desc.outro:0 "\n\nCác cận vệ mang vào những báu vật chôn cất cuối cùng, và rồi, cuối cùng, thi thể của [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip] được đặt lên giàn tang."
  fp1_yearly.1063.trigger_failure.tt:0 "Hoàn cảnh đã khiến tang lễ công khai của [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip] bị hủy bỏ"
  fp1_yearly.1063.a:0 "Đóng gò mộ lại."

  fp1_yearly.1071.t:0 "Sạch Bong Sáng Láng"
  fp1_yearly.1071.desc:0 "Người [ROOT.Char.GetCulture.GetNameNoTooltip] nổi tiếng là cực kỳ sạch sẽ.\n\nMột trong những niềm vui lớn của cuộc sống là được nghe ngay cả những kẻ thù gay gắt nhất cũng phải cay đắng thừa nhận rằng không bộ râu của người đàn ông nào được chải chuốt kỹ lưỡng hơn, không mái tóc của [ROOT.Char.Custom('WomanManPossessive')] nào được gội rửa thường xuyên hơn, không gương mặt của [ROOT.Char.GetWomanMan] nào được chà rửa sạch không tì vết hơn một [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan] đúng nghĩa.\n\nHôm nay là ngày tắm, nhưng ta cảm thấy có lẽ thay đổi thói quen một chút sẽ tốt cho mình. Suy cho cùng, nếu tất cả người [ROOT.Char.GetCulture.GetNameNoTooltip] đều chỉnh tề, thì chẳng phải một [ROOT.Char.GetTitleAsNameNoTooltip] nên là người được chải chuốt #EMP kỹ lưỡng nhất#! sao?"
  fp1_yearly.1071.a:0 "Vệ sinh là chìa khóa của một cuộc sống lâu dài!"
  fp1_yearly.1071.b:0 "Có lẽ ta nên chăm chút thêm một chút..."
  fp1_yearly.1071.c:0 "Như thường lệ là được rồi."

  fp1_yearly.1081.t:0 "Nhà Thám Hiểm Từ Phương Tây"
  fp1_yearly.1081.desc.intro:0 "Buổi tối của ta bị chiếm trọn bởi một nhà thám hiểm lớn tuổi, [norse_explorer.GetFirstName], người muốn kể cho ta nghe những câu chuyện kỳ lạ về những chiến công và cuộc phiêu lưu của họ ở Đại Tây Dương.\n\nBất chấp tuổi tác của [norse_explorer.GetHerHis], đôi mắt của [norse_explorer.GetFirstNamePossessiveNoTooltip] vẫn sắc bén khi [norse_explorer.GetSheHe] kể cho ta nghe về"
  fp1_yearly.1081.desc.greenland:1 "một vùng đất của những $norse_collective_noun$ nghèo khổ, vật lộn sinh tồn giữa băng tuyết gần tận cùng thế giới. Vùng đất lạnh giá đến mức họ phải nhập khẩu toàn bộ gỗ, và gần như chỉ sống bằng thịt và cá."
  fp1_yearly.1081.desc.vinland:0 "một vùng đất xa về phía tây ngang bằng Cathay ở phía đông, nơi nho và lúa mì mọc lên dồi dào đến mức dường như tự gieo mình xuống đất, và rượu vang thì vô song. Người bản địa nào cũng là chiến binh đáng sợ, không dung thứ bất kỳ sự xâm phạm nào."
  fp1_yearly.1081.desc.antilia:0 "một hòn đảo được định cư bởi những kẻ lưu vong [antilia_culture.GetNameNoTooltip]. Những $christianity_religion_adherent_plural$ giàu có sống trong các lâu đài kiên cố, là hậu duệ của những người tị nạn chạy khỏi Iberia trong cuộc xâm lược của người Moor."
  fp1_yearly.1081.desc.fortunate_isles.hellenist:0 "phần lãnh thổ hải ngoại cuối cùng còn tồn tại của $hellenic_pagan$, một hòn đảo nhỏ ở phía tây với cư dân là $greek_collective_noun$ có nhiều điểm tương đồng với $b_athens$ cổ đại hơn là $b_constantinople$ hiện đại. Người dân nơi đây dành cả ngày để bàn luận triết học và nâng chén ca ngợi các vị thần Olympus!"
  fp1_yearly.1081.desc.fortunate_isles.other:0 "nơi ẩn náu của vài tín đồ ngoại giáo $hellenic_pagan_adherent_plural$ cuối cùng, thô sơ bắt chước tổ tiên xa xưa của họ ở $b_athens$ và $b_thebes$. Người dân sống uể oải qua ngày, bàn luận những triết lý kỳ lạ và thực hành đức tin cổ xưa của mình."
  fp1_yearly.1081.desc.st_brendans_island:0 "một hòn đảo ẩn sau những màn sương kỳ lạ, nơi thời gian dường như trôi chậm hơn bên trong so với bên ngoài. Về những bí ẩn khác của hòn đảo, [norse_explorer.GetFirstNameNoTooltip] giữ kín, dù đôi lúc nước mắt làm mờ ánh nhìn của [norse_explorer.GetHerHis]."
  fp1_yearly.1081.desc.isle_of_the_blessed.christian:0 "một hòn đảo đầy những $breton_collective_noun$ sùng đạo, cầu nguyện và sống cuộc đời trầm lặng suy niệm. Đức tin của họ mạnh mẽ đến mức mỗi người đều miễn nhiễm với vũ khí phàm trần, hoàn toàn được [norse_explorer.GetFaith.HighGodName] che chở."
  fp1_yearly.1081.desc.isle_of_the_blessed.other:0 "một hòn đảo đầy những $breton_collective_noun$ sùng đạo, giàu có với kho tàng vàng bạc. Đức tin của họ mạnh mẽ đến mức những khúc thánh ca du dương vẫn vang vọng khắp đảo ngay cả sau khi thủy thủ đoàn của [norse_explorer.GetFirstNamePossessiveNoTooltip] đã tàn sát họ."
  fp1_yearly.1081.desc.ard_majhulah:1 "một vùng đất kỳ lạ chỉ được nhắc đến trong các văn bản Hồi giáo cổ xưa, từng bị cho là đã thất lạc suốt nhiều năm. Người dân nơi đây có những đống vàng bạc lớn đến mức họ dùng chúng làm tăm xỉa răng và dệt vào quần áo."
  fp1_yearly.1081.desc.the_sticky_sea:0 "một vùng biển tang thương giữa Đại Tây Dương, một mớ nước đặc quánh và hôi thối, nơi rắn biển và rong rêu cấu kết kéo thủy thủ xuống cái chết. Chỉ những thủy thủ đoàn mạnh nhất mới có cơ hội thoát thân."
  fp1_yearly.1081.desc.purple_islands:0 "một quần đảo xa về phía nam, tràn ngập những loài hoa rực rỡ, nhiều loài mang sắc tím kỳ lạ, hoàn toàn không có dấu vết của con người. Vẻ đẹp ma mị của nơi này khiến ngay cả những thủy thủ dày dạn nhất cũng muốn nằm xuống và chết đi trong bình yên."
  fp1_yearly.1081.desc.hy_brasil:0 "một hòn đảo phần lớn thời gian vô hình, bị khóa sau những màn sương không thể xuyên thủng, chỉ lộ diện một ngày mỗi bảy năm. Ngay cả trong ngày duy nhất đó, chưa thủy thủ nào từng đặt chân thành công lên bờ."
  fp1_yearly.1081.desc.thule:0 "một vùng đất rộng lớn ở tận cùng phương bắc, nơi mọi vật chất đều tan rã. Con người hít thở nước và đất dễ dàng như không khí, những con cá voi khổng lồ bơi xuyên qua mặt đất và bầu trời, và mọi ranh giới đều trở nên vô nghĩa."
  fp1_yearly.1081.desc.great_ireland.abrahamic:0 "một vùng đất xa về phía tây, nơi cư dân chỉ mặc đồ trắng, mang theo những ngọn giáo tàn bạo và chiến đấu dữ dội với nhau cũng như với cả những vị khách cao quý nhất. Người dân nơi đây thờ phụng các vị thần ngoại giáo cổ xưa, từ lâu đã bị lãng quên bởi những tín đồ chính thống [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip]."
  fp1_yearly.1081.desc.great_ireland.other:0 "một vùng đất xa về phía tây, nơi cư dân chỉ mặc đồ trắng, mang theo những ngọn giáo hung ác và chiến đấu với sức mạnh cùng sự hung bạo phi nhân tính. Chiến công của họ lẫy lừng đến mức chưa chiến binh nào của vùng đất này từng ngã xuống trước lưỡi kiếm ngoại bang."
  fp1_yearly.1081.desc.sunset_empire:0 "một đế chế ở phía bên kia điểm rộng nhất của Đại Tây Dương, một vùng đất của máu, sọ người và những kẻ chinh phục khát máu, ẩn mình ngay dưới chân trời phía tây. Những chủ nhân tàn bạo của nó chờ đợi Ragnarok, khi chúng định xé toạc trái tim đang đập khỏi lồng ngực của mọi tín đồ chân chính [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip]."
  fp1_yearly.1081.desc.outro:0 "\n\nDù đêm đã khuya, [norse_explorer.GetFirstNameNoTooltip] dường như vẫn sẵn lòng kể tiếp nếu ta muốn."
  fp1_yearly.1081.a:0 "Thật hấp dẫn. Xin hãy kể lại từ đầu!"
  fp1_yearly.1081.b:0 "Ngài #EMP không thể nào#! đang nói sự thật đâu, lão [norse_explorer.GetWomanMan]."
  fp1_yearly.1081.c:0 "Những câu chuyện về vùng đất xa xôi luôn khiến lòng người dịu lại..."
  fp1_yearly.1081.c.sunset_empire:0 "Có lẽ chúng ta nên ngăn tàu thuyền đi về phía tây..."
