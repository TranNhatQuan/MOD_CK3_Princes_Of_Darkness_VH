l_english:
 # Securing the High Kingdom of the North Sea
  fp1_major_decisions.0001.t:0 "[founder.Custom('GetQueenKing')] Tối Cao của Phương Bắc"
  fp1_major_decisions.0001.desc:0 "Từ lâu ta đã nuôi tham vọng thống nhất những vương quốc vĩ đại của Biển Bắc dưới một vương miện duy nhất và vĩnh viễn. Suốt nhiều năm ta đã lao tâm khổ tứ, giành được sự công nhận là một vị quân vương vĩ đại của từng lãnh địa, và hôm nay ta thực hiện trọn vẹn giấc mơ của mình.\n\nSau khi buộc các chư hầu chủ chốt tuyên thệ trung thành vĩnh viễn bằng những lời lẽ được cân nhắc kỹ lưỡng, người Saxon, Na Uy và Đan Mạch đều thừa nhận tước vị của ta là [founder.Custom('GetQueenKing')] Tối Cao, bá chủ không thể tranh cãi của Biển Bắc.\n\nCó lẽ hậu duệ ta sẽ tiếp tục cai trị các vương quốc như một thể thống nhất. Cũng có lẽ là không. May thay, điều đó nay không còn quan trọng.\n\nDù ai đội những vương miện nhỏ hơn, #EMP tất cả#! đều phải cúi mình trước [founder.GetHouse.GetBaseNameNoTooltip] [founder.GetTitleAsNameNoTooltip]!"
  fp1_major_decisions.0001.a:0 "Một đế quốc trường tồn và hùng mạnh!"
  fp1_major_decisions.0002.t:0 "$fp1_major_decisions.0001.t$"
  fp1_major_decisions.0002.desc:0 "Trong nhiều năm, quân chủ của ta, [founder.Custom('GetQueenKing')] [founder.GetFirstName], đã nói rõ rằng [founder.GetSheHe] mong muốn lãnh địa của [founder.GetHerHis] tồn tại sau khi [founder.GetHerHim] qua đời.\n\nDù các vương quốc của chúng ta được gắn kết bởi huyết thống và xung đột, khoảng cách địa lý và sự khác biệt giữa chúng khiến mục tiêu này tưởng chừng bất khả thi.\n\nHôm nay, những nghi ngờ ấy đã bị chứng minh là vô căn cứ, khi [founder.GetFirstNameNoTooltip] ban hành những lời thề trung thành ràng buộc lẫn nhau được soạn thảo suốt nhiều năm cho toàn thể chư hầu trong lãnh địa.\n\n$title_high_kingdom$ của $e_north_sea$ đã ra đời!"
  fp1_major_decisions.0002.a:0 "Vạn tuế [founder.GetTitleAsNameNoTooltip]!"
  fp1_major_decisions.0002.b:0 "Một [founder.Custom('GetQueenKing')] giả hiệu, đến bốn lần."

  fp1_major_decisions.0003.t:0 "$fp1_major_decisions.0001.t$"
  fp1_major_decisions.0003.desc:0 "Từ lâu đã là tham vọng công khai của [founder.GetFirstName], [founder.Custom('GetQueenKing')] của $k_norway$, $k_england$, và $k_denmark$, để đảm bảo rằng vương quốc của [founder.GetHerHis] không tan vỡ sau cái chết của [founder.GetHerHis].\n\nHôm nay, sau những năm dài cai trị và đàm phán căng thẳng, [founder.GetSheHe] cuối cùng đã đạt được mong muốn của [founder.GetHerHis].\n\nCác chư hầu của ba vương quốc đã đồng ý rằng, bất kể ai ngồi trên ngai vàng của mỗi vương quốc, tất cả đều sẽ cúi đầu trước [founder.GetTitleAsNameNoTooltip]."
  fp1_major_decisions.0003.a:0 "Một vương quốc cho mọi tín đồ trung thành của [ROOT.GetCharacter.GetFaith.GetNameNoTooltip]!"
  fp1_major_decisions.0003.b:0 "Xin bảo hộ chúng con, hỡi [ROOT.GetCharacter.GetFaith.HighGodName], khỏi cơn thịnh nộ của [founder.GetFirstNameNoTooltip]!"
  fp1_major_decisions.0003.c:0 "[founder.GetSheHe|U] chỉ là một kẻ man rợ tự cao!"

 # Founding the Capital of the Rus'
  fp1_major_decisions.0011.t:0 "Một Kinh Đô cho toàn thể Rus'"
  fp1_major_decisions.0011.desc:0 "Từ $river_volga$ đến $river_dnieper$ và xa hơn nữa, người Varangian xuôi theo các dòng sông và lối mòn của vùng đất $east_slavic_group_collective_noun$. Chúng ta cướp bóc, chinh phục và hòa trộn với người bản địa. Khi cần, ta lập nên những khu định cư mới, hoặc chiếm lấy chúng bằng vũ lực.\n\nCho đến hôm nay, những trung tâm nhỏ này vẫn cạnh tranh nhau để thu hút các nhà phiêu lưu và lãnh chúa chiến tranh, tìm cách giành quyền tối thượng thực sự trong Rus'.\n\nKhông còn nữa! Bằng chiến công hiển hách và danh tiếng hung hãn của mình, ta sẽ thu hút cả người Bắc Âu lẫn Slav, xây dựng một kinh đô xứng đáng với [founder.GetPrimaryTitle.GetNameNoTier]!"
  fp1_major_decisions.0011.a:0 "$c_kiev$ sẽ là một kinh đô tuyệt vời!"
  fp1_major_decisions.0011.b:0 "[new_rus_capital.GetNameNoTierNoTooltip] thực sự là nguồn cội vĩ đại của chúng ta!"
  fp1_major_decisions.0012.t:0 "$fp1_major_decisions.0011.t$"
  fp1_major_decisions.0012.desc:0 "Nhờ sức mạnh của danh tiếng và uy danh của [founder.GetHerHis], quân chủ của ta, [founder.GetTitledFirstName], đã bắt đầu xây dựng một kinh đô vĩ đại tại [new_rus_capital.GetNameNoTier]. [founder.GetSheHe|U] hy vọng rằng một ngày nào đó, khu định cư này sẽ trở thành trung tâm của toàn bộ vùng đất Rus'."
  fp1_major_decisions.0012.a:0 "Một kinh đô xứng đáng!"
  fp1_major_decisions.0012.b:0 "Bah, chẳng qua chỉ là một ổ tội phạm và vô lại."
  fp1_major_decisions.0013.t:0 "$fp1_major_decisions.0011.t$"
  fp1_major_decisions.0013.desc:0 "Nhờ sức mạnh của danh tiếng và uy danh của [founder.GetHerHis], [founder.GetTitledFirstName], một lãnh chúa man rợ, đã kêu gọi sự trung thành của mọi Varangian phiêu bạt và những người Slav khát máu.\n\nNgay cả lúc này, các nhà phiêu lưu, hải tặc, cướp biển và trộm cắp đều tụ tập dưới lá cờ của [founder.GetHerHis], khiến dân số của [new_rus_capital.GetNameNoTier] tăng vọt."
  fp1_major_decisions.0013.a:0 "[new_rus_capital.GetNameNoTierNoTooltip] này nghe có vẻ... thịnh vượng..."
  fp1_major_decisions.0013.b:0 "Chúng vẫn chỉ là những kẻ ngoại bang lạc hậu."
  fp1_major_decisions.0013.c:0 "Ta thật sự không hiểu chuyện này liên quan gì đến mình?"

 #Elevating the Kingdom of Mann & the Isles
  fp1_major_decisions.0021.t:0 "Một Vương Quốc Hải Tặc"
  fp1_major_decisions.0021.desc:0 "Trong nhiều năm, ta đã tung hoành trên các tuyến đường thủy khắp thế gian, cướp bóc, đột kích và tàn phá. Ta đã đánh cắp nhiều vàng hơn phần lớn các vị vua từng được thấy, và cái tên của ta bị nguyền rủa từ Biển Ireland đến tận Cathay.\n\nKhông còn nghi ngờ gì nữa, ta là [founder.GetWomanMan] khét tiếng nhất còn sống, Tai Ương của Biển Cả, và đã đổ chiến lợi phẩm cùng danh tiếng của mình vào việc định cư quy mô lớn và củng cố $c_isle_of_man$.\n\nKhắp thế giới, người ta nguyền rủa ta là tên hải tặc độc ác nhất mà họ từng nghe đến.\n\nNhưng họ #EMP đã#! nghe đến ta."
  fp1_major_decisions.0021.a:0 "Ta là [founder.GetLadyLord|U] của Máu và Vàng!"
  fp1_major_decisions.0021.b:0 "Cuối cùng, giấc mơ của ta đã thành hiện thực..."
  fp1_major_decisions.0022.t:0 "$fp1_major_decisions.0021.t$"
  fp1_major_decisions.0022.desc:0 "Trong nhiều năm, ai cũng ngầm hiểu rằng [founder.GetFirstName] từ chối chấp nhận hay đội bất kỳ vương miện nào ngoài một cái duy nhất: [founder.GetPrimaryTitle.GetNameNoTier].\n\nTrái tim [founder.GetHerHis|U] đã đặt vào điều này quá lâu đến mức chủ quân của ta dường như đã hiến dâng cả cuộc đời [founder.GetHerHis] để hợp pháp hóa quyền lực và thẩm quyền của quê hương hải đảo [founder.GetHerHis].\n\nSau vô số cuộc cướp bóc, chiến tranh và tàn sát, [founder.GetSheHe] đã thành công.\n\nNghe nói mỗi viên ngọc trên vương miện mới của [founder.GetHerHis] đều được lấy từ một cuộc cướp khác nhau. Một số người trong triều thậm chí còn thì thầm rằng vẫn còn những ổ trống để [founder.GetTitledFirstNameNoTooltip] lấp đầy."
  fp1_major_decisions.0022.a:0 "Cứ nghĩ đến đống vàng chúng ta sẽ kiếm được đi!"
  fp1_major_decisions.0022.b:0 "Một #EMP [founder.GetTitleAsNameNoTooltip]#! ư? [founder.GetSheHe|U] còn tệ hơn cả một lãnh chúa cướp bóc!"
  fp1_major_decisions.0023.t:0 "$fp1_major_decisions.0021.t$"
  fp1_major_decisions.0023.desc:0 "Ngay cả người nông dân thấp kém nhất ở Quần đảo Anh cũng đã nghe nói về [founder.GetFirstName] quái dị, Tai họa của Biển cả, và cuộc tìm kiếm suốt đời của [founder.GetHerHis] để giành sự công nhận cho vương quốc cướp biển trong mơ của [founder.GetHerHis].\n\nĐó là một huyền thoại gây sợ hãi cho cả lãnh chúa lẫn nông nô thấp kém, nhưng có vẻ như ranh giới giữa huyền thoại và lịch sử gần đây đã mờ nhạt.\n\nKể từ hôm nay #EMP [founder.GetTitleAsNameNoTooltip]#! [founder.GetFirstNameNoTooltip] tuyên bố công trình cả đời của [founder.GetHerHis] đã hoàn thành.\n\nBritannia có thêm một vương quốc mới trên bờ biển của mình, và nó thật đáng sợ khi nhìn thấy."
  fp1_major_decisions.0023.a:0 "[founder.GetSheHe|U] sẽ không đột kích #EMP chúng ta#! đâu, đúng không?"
  fp1_major_decisions.0023.b:0 "Chẳng hơn gì một [founder.GetTitleAsNameNoTooltip] của bọn trộm!"

 # Forging the Jomsvikings
  fp1_major_decisions.0031.t:0 "Rèn Đúc Jomsvikings"
  fp1_major_decisions.0031.desc:0 "Với quyền lực và thanh danh của mình, ta đã tập hợp một nhóm những [founder.GetFaith.GetAdherentNamePlural] cuồng tín và tàn bạo nhất khắp Scandinavia, và Ta luyện họ thành một hội [leader.Custom('SisterBrother')] chiến binh!\n\nBên kia những vùng biển, tại xứ sở của người Slav và người Balt, $d_jomsvikings$ sẽ hưng thịnh. Cướp bóc và xung đột với dân bản địa sẽ khiến họ trở nên hung bạo, đồng thời chỉ khuyến khích những tín đồ xứng đáng tìm đến họ.\n\nĐổi lại, họ sẽ thưởng danh dự bằng chiến binh và chiến lợi phẩm, và trừng phạt kẻ hèn nhát, kẻ cải đạo và kẻ cải cách.\n\nTừ ngày này cho đến Ragnarok, [founder.GetFaith.GetNameNoTooltip] sẽ trường tồn."
  fp1_major_decisions.0031.a.cynical:0 "Miễn là họ chiến đấu các cuộc chiến của ta..."
  fp1_major_decisions.0031.a.fallback:0 "Cổ Đạo vẫn là con đường tốt nhất!"
  fp1_major_decisions.0032.t:0 "$fp1_major_decisions.0031.t$"
  fp1_major_decisions.0032.desc:0 "Nhằm ngăn chặn làn sóng cải đạo sang các tôn giáo Abraham và những tư tưởng cải cách đáng lo ngại của một số jarl hoài nghi, [founder.Custom2('MyCharacterIntroduction',ROOT.Char)] đã tập hợp một nhóm [founder.GetFaith.GetAdherentNamePlural] cuồng tín vào một hội [leader.Custom('SisterBrother')] chiến binh chính thức với mục tiêu bảo vệ Cổ Đạo.\n\nĐóng quân tại pháo đài hùng mạnh $b_jomsberg$, những hình mẫu của đức hạnh [founder.GetFaith.GetAdjectiveNoTooltip] này dự định tung hoành khắp Baltic, thưởng công lòng mộ đạo và trừng phạt sự ô nhục cùng hèn nhát."
  fp1_major_decisions.0032.a:0 "Vinh quang và máu vì [founder.GetFaith.HighGodName]!"
  fp1_major_decisions.0032.b:0 "Vậy họ là hải tặc à?"
  fp1_major_decisions.0033.t:0 "$fp1_major_decisions.0031.t$"
  fp1_major_decisions.0033.desc.autofounded:0 "[founder.GetTitledFirstName], một nhà phiêu lưu Bắc Âu đầy tham vọng, đã phát động một cuộc xâm lược tàn bạo chống lại [victim.GetTitledFirstName], quét sạch vùng đất [coup_target.GetNameNoTier] khỏi tay [victim.GetHerHim] trong một đòn tập kích bất ngờ.\n\nĐiều khiến việc này trở nên khác thường là cuộc xâm lược dường như mang động cơ tôn giáo: [founder.GetFirstNameNoTooltip] đã hợp tác với một kẻ cuồng tín [founder.GetFaith.GetAdjective] tên là [leader.GetFirstNameNoTooltip] để thành lập một hội [leader.Custom('SisterBrother')] chiến binh mà họ gọi là $d_jomsvikings$."
  fp1_major_decisions.0033.desc.decision_founded:0 "Sau nhiều năm chinh chiến, [founder.GetTitledFirstName], một kẻ cuồng tín [founder.GetFaith.GetAdjective], cuối cùng đã tập hợp đủ người theo để biến giấc mơ [founder.GetHerHis] thành hiện thực: tại pháo đài mới xây $b_jomsberg$, [founder.GetSheHe] đã thành lập một hội [leader.Custom('SisterBrother')] chiến binh mới để bảo vệ đức tin [founder.GetHerHis].\n\n$d_jomsvikings$ đã ra đời."
  fp1_major_decisions.0033.desc.outro:0 "\n\nNhóm này tuyên bố sẽ thực thi Cổ Đạo, tấn công những kẻ theo Abraham, những kẻ cải cách và cả các ngoại giáo đối địch, tạo nên một vệt máu trải dài khắp vùng biển Baltic."
  fp1_major_decisions.0033.a:0 "Tất cả sẽ biết cơn thịnh nộ của [founder.GetFaith.HighGodNamePossessive]!"
  fp1_founder_founded_the_jomsviking_tt:0 "Một [holy_order|E] của [founder.GetTitledFirstNamePossessiveNoTooltip] [faith|E] đã được thành lập\n$EFFECT_LIST_BULLET$[founder.GetFirstNameNoTooltip] trở thành [holy_order_patron|E] của hội"
  fp1_major_decisions.0033.b.competition:0 "Hừm, cạnh tranh sao?"
  fp1_major_decisions.0033.b.heathens:0 "#EMP *Thở dài*#! ... Lại thêm bọn ngoại giáo cướp bóc nữa sao?"

 # Canute-'em-Up
  fp1_major_decisions.1001.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip] của Biển Bắc"
  fp1_major_decisions.1001.desc.dumb:0 "Ta sống một cuộc đời khá may mắn. Với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], ai cũng biết ta là người khôn ngoan, nhân từ và #EMP quyền năng#! vô song, như thể chính thế giới xem ta là đứa con cưng của [ROOT.Char.GetFaith.HighGodNamePossessive] [ROOT.Char.Custom('GetDaughterSon')].\n\nTất cả cận thần của ta đều đồng tình và thường xuyên nói với ta như vậy, đặc biệt là [sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)].\n\nThậm chí, [sycophant.GetFirstNameNoTooltip] còn khẳng định rằng chính thủy triều cũng tuân theo mệnh lệnh của ta, và sẽ rút lui chỉ bằng một lời thì thầm..."
  fp1_major_decisions.1001.desc.smart:0 "Với tư cách [ROOT.Char.GetTitleAsNameNoTooltip], ta gần như bị #EMP bao vây#! bởi những kẻ chen nhau tâng bốc ta vĩ đại và quyền năng đến mức nào.\n\nThông thường, ta bỏ ngoài tai: sự xu nịnh đó chỉ là điều tất yếu của những kẻ tuyệt vọng khi đứng trước địa vị của ta.\n\nTuy nhiên hôm nay, nó đã đạt đến mức #EMP không thể chịu đựng#!. [sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)] cả gan ngắt lời ta trong bữa sáng để nói rằng [sycophant.GetSheHe] tin rằng thủy triều sẽ quay đầu chỉ bằng một ám chỉ nhỏ từ mệnh lệnh của ta.\n\nDù sự giả dối lộ liễu ấy thật buồn nôn, điều này lại cho ta một ý tưởng..."
  fp1_major_decisions.1001.a:0 "Ra bãi biển!"
  fp1_major_decisions.1001.a.tt:0 "Ngươi và triều đình ra biển một chuyến..."
  fp1_major_decisions.1001.b:0 "Lời mật ngọt vẫn chỉ là lời nói."
  fp1_major_decisions.1002.t:0 "$fp1_major_decisions.1001.t$"
  fp1_major_decisions.1002.desc.dumb:0 "Chúng ta ngồi suốt buổi chiều bên bờ biển, triều đình của ta run rẩy trong gió bắc lạnh lẽo và cay nghiệt.\n\nTừng phút, từng giờ, ta tuyên bố với đại dương: ngươi sẽ không được tiến tới! Ta là [ROOT.Char.GetTitleAsNameNoTooltip] của ngươi, và ta không hạ mình để bị làm ướt bởi thứ như ngươi!\n\nNổi loạn, nước biển dâng ngày càng gần, cho đến khi bắt đầu chạm vào chân ta. Những kẻ theo ta trông lúng túng, mỗi người đều tránh ánh mắt ta, hẳn là #EMP xấu hổ#! khi phải chứng kiến khoảnh khắc #EMP yếu đuối#! hoàn toàn của người cai trị mình."
  fp1_major_decisions.1002.desc.smart:0 "Không còn việc gì khác hôm nay, ta buộc #EMP toàn bộ#! triều đình dành buổi chiều bên biển, nhìn ta ngồi trên ngai vàng trong bộ lễ phục đăng quang, gào thét với biển cả ngừng tiến vào đất liền.\n\nKhông cần phải nói, nước biển chẳng hề lắng nghe.\n\nSau năm phút, những kẻ theo ta hiểu ý định của ta.\n\nSau năm giờ, khi sóng cuối cùng cũng chạm vào chân ta, họ cuối cùng hiểu được quyết tâm của ta.\n\nTa là [ROOT.Char.GetTitleAsNameNoTooltip], và ta sẽ không là kẻ ngốc của bất kỳ ai."
  fp1_major_decisions.1002.a:0 "Ta chỉ là một [ROOT.Char.GetWomanMan] phàm trần, và ta biết giới hạn của mình. Các ngươi cũng nên thế."
  fp1_major_decisions.1002.b:0 "Hãy xem quyền lực của [ROOT.Char.Custom('GetQueenKing')] #EMP vô dụng#! thế nào khi so với [ROOT.Char.GetFaith.HighGodName]!"
  fp1_major_decisions.1002.c:0 "#EMP CHẠY ĐI!#! Biển cả đã liên minh với [ROOT.Char.GetFaith.DevilName]!"
  fp1_major_decisions.1002.d:0 "Đồ đại dương láo xược! Đưa ta cây roi đó!"
  fp1_major_decisions.1002.d.tt:0 "Ngươi quất nước biển khuất phục"
  fp1_major_decisions.1002.e:0 "Có lẽ vẫn còn nhiều thứ để ta chinh phục hơn là chỉ cai trị..."

 # The True King of Norway
  fp1_major_decisions.1011.t:0 "Một Vị Vua cho $k_norway$"
  fp1_major_decisions.1011.desc.intro:0 "Nhiều năm trước, ta đã thề sẽ không cắt tóc cho đến khi đạt được tước vị cao quý là Vua của $k_norway$."
  fp1_major_decisions.1011.desc.gyda:0 "Vì tình yêu dành cho [gyda.GetTitledFirstName],"
  fp1_major_decisions.1011.desc.oath:0 "Vì vinh quang của gia tộc ta và di sản của con cháu ta,"
  fp1_major_decisions.1011.desc.outro:0 "ta sẽ chinh phục một trăm vương quốc.\n\nGiờ đây nhiệm vụ đã hoàn thành, và ta không còn bị ràng buộc phải giữ mái tóc dài và rối bù này nữa.\n\nCâu hỏi còn lại là: ta nên làm gì với mái tóc của mình?"
  fp1_major_decisions.1011.a:0 "Lời thề của ta đã hoàn thành!"
  fp1_major_decisions.1011.b:0 "[gyda.GetFirstNameNoTooltip] và ta cuối cùng cũng có thể ở bên nhau!"
  fp1_major_decisions.1011.c:0 "Mái tóc này sẽ được giữ lại; nó là dấu ấn của mọi gian khổ ta từng trải."
  fp1_major_decisions.1011.c.tt:0 "Ngươi sẽ tiếp tục được biết đến với biệt danh $nick_tanglehair$"
  fp1_major_decisions.1012.t:0 "[king_of_norway.GetTitledFirstNameNoTooltip] đã giành lấy $k_norway$ trước"
