 # Cultural MaA
  bondi:0 "Bondí"
  vigmen:0 "Vigmen"
  varangian_veterans:0 "Cựu Binh Varangian"
  jomsviking_pirates:0 "Hải Tặc Jomsviking"

 # MaA Flavour
  bondi_flavor:0 "#F Bondí thuộc tầng lớp địa chủ tự do, thường là những thủy thủ lão luyện, sử dụng thuyền dài để buôn bán hoặc đi cướp bóc kiểu Viking. Họ chiến đấu bằng giáo và khiên.#!"
  vigmen_flavor:0 "#F Các chiến binh tuyến đầu dựng nên một bức tường khiên không thể xuyên thủng để bảo vệ cung thủ phía sau. Chiến thuật này ngăn chặn quân quấy rối đồng thời cho phép đội hình tiến lên vững chắc.#!"
  varangian_veterans_flavor:0 "#F Những nhà thám hiểm, phiêu lưu gia, chiến binh và lính đánh thuê đến từ khắp các thuộc địa Bắc Âu xa xôi. Một số thậm chí từng phục vụ trong Đội Cận Vệ Varangian.#!"
  jomsviking_pirates_flavor:0 "#F Trong số những kẻ cướp biển khét tiếng nhất từng hoành hành vùng Baltic, Jomsviking rất giỏi gieo rắc hỗn loạn trong trận chiến, kéo dài giao tranh trước khi tung hoành sau đó.#!"
