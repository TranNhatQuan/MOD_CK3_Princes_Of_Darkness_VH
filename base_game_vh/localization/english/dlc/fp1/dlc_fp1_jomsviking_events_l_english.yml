l_english:
 # Jomsvikings offer a Retainer
  fp1_jomsvikings.0001.t:0 "Bàn Tay Trợ Giúp từ [leader.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
  fp1_jomsvikings.0001.desc.intro:0 "Đóng quân trong pháo đài tại [leader.GetCapitalLocation.GetTitle.GetNameNoTier], [leader.GetPrimaryTitle.GetNameNoTier] là một giáo đoàn chiến binh tận tụy bảo vệ Cổ Đạo của đức tin [leader.GetFaith.GetName] khỏi sự thay đổi, ô nhục và các tín ngưỡng ngoại lai.\n\nVì lòng sùng đạo và đức hạnh của ta, [leader.GetTitledFirstName] đã gửi đến ta lựa chọn giữa hai cận vệ: [retainer_a.GetFirstName],"
  fp1_jomsvikings.0001.desc.zealous:0 "kẻ đã cướp phá hàng trăm nhà thờ,"
  fp1_jomsvikings.0001.desc.wrathful:0 "kẻ từng xé đôi một con gấu bằng tay không,"
  fp1_jomsvikings.0001.desc.impatient:0 "nhanh như tia chớp,"
  fp1_jomsvikings.0001.desc.arrogant:0 "người lẽ ra đã trở thành [leader.GetTitleAsNameNoTooltip] kế nhiệm,"
  fp1_jomsvikings.0001.desc.brave:0 "kẻ đã đánh bại một con quỷ núi bằng tay không,"
  fp1_jomsvikings.0001.desc.ambitious:0 "người mong muốn một cái chết vinh quang nhất từng có,"
  fp1_jomsvikings.0001.desc.diligent:0 "người không bao giờ ngừng rèn luyện,"
  fp1_jomsvikings.0001.desc.gregarious:0 "kẻ đã kết thân với chính các vị thần,"
  fp1_jomsvikings.0001.desc.stubborn:0 "kẻ đã phá núi từng tảng đá một,"
  fp1_jomsvikings.0001.desc.fickle:0 "kẻ với tâm trí thất thường đã đánh lừa [leader.GetFaith.DevilName] [leader.GetFaith.DevilHerselfHimself],"
  fp1_jomsvikings.0001.desc.vengeful:0 "kẻ chưa từng để một mối thù nào không được báo đáp,"
  fp1_jomsvikings.0001.desc.viking:0 "Xóa Bạn mười nông dân mỗi ngày nơi xứ người,"
  fp1_jomsvikings.0001.desc.connector:0 "hoặc [retainer_b.GetFirstName],"
  fp1_jomsvikings.0001.desc.outro:0 "cùng với lời khen ngợi của [leader.GetHerHis] dành cho sự tận tâm của ta.\n\nMột người sẽ ở lại, người còn lại sẽ trở về với [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  fp1_jomsvikings.0001.a:0 "[retainer_a.GetFirstNameNoTooltip] có vẻ là một nhà chiến lược đáng gờm!"
  fp1_jomsvikings.0001.b:0 "Quả là một chiến binh oai phong, [retainer_b.GetFirstNameNoTooltip]..."
  fp1_jomsvikings.0001.c:0 "Ta đã có đủ chiến binh rồi, cảm ơn."

 # Jomsvikings terrorise their neighbours
  fp1_jomsvikings.0011.t.reformed_norse:0 "Cơn Thịnh Nộ của Cổ Đạo"
  fp1_jomsvikings.0011.t.reformed_other:0 "Cơn Thịnh Nộ của Các Cổ Thần"
  fp1_jomsvikings.0011.t.fallback:0 "Hải Tặc [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  fp1_jomsvikings.0011.desc.intro:0 "Tai họa! Một cuộc đột kích như sét đánh do [leader.GetTitledFirstName] của [leader.GetPrimaryTitle.GetNameNoTier] thực hiện tại [target_county.GetNameNoTier] đe dọa thiêu rụi nửa vùng đất!\n\n"
  fp1_jomsvikings.0011.desc.ideological_reformist:0 "Gán cho [ROOT.Char.GetFaith.GetName] là sự bóp méo ghê tởm của đức tin tổ tiên, lũ hải tặc đáng nguyền rủa này đang tàn sát hàng loạt [ROOT.Char.GetFaith.PriestNeuterPlural], phóng hỏa [ROOT.Char.GetFaith.HouseOfWorshipPlural], và tuyên bố làm tất cả nhân danh [leader.GetFaith.HighGodName]!"
  fp1_jomsvikings.0011.desc.ideological_other:0 "Những tín đồ cực đoan của [leader.GetFaith.GetAdherentNamePlural], lũ hải tặc này xem [ROOT.Char.GetFaith.GetReligion.GetName] là mối đe dọa cho lối sống của chúng. Không chỉ cướp bóc, chúng còn tàn sát [ROOT.Char.GetFaith.PriestNeuterPlural], thiêu rụi [ROOT.Char.GetFaith.HouseOfWorshipPlural], và gào thét về các vị thần giả dối của mình."
  fp1_jomsvikings.0011.desc.economic:0 "Dù [leader.GetPrimaryTitle.GetNameNoTierNoTooltip] không mang mối thù riêng với một [ROOT.Char.GetFaith.GetAdherentName] như ta, chúng vẫn sống nhờ cướp bóc và đột kích, và lãnh địa của ta là mục tiêu hấp dẫn. Có lẽ... có lẽ nộp một khoản gafol nặng nề có thể cứu thần dân của ta?"
  fp1_jomsvikings.0011.desc.outro:0 "\n\nKhông còn thời gian để triệu tập đại quân. Ta có thể đánh trả bằng lực lượng sẵn có, hoặc nghiến răng chịu đựng cho đến khi chúng rút đi."
  fp1_jomsvikings.0011.a:0 "Triệu tập tất cả, ra trận!"
  fp1_jomsvikings.0011.a.tt_success:0 "Lũ hải tặc bị bao vây và tiêu diệt"
  fp1_jomsvikings.0011.a.tt_failure:0 "[leader.GetTitledFirstNameNoTooltip] tàn phá trước khi [leader.GetSheHe] rút lui"
  fp1_jomsvikings.0011.b.benefactor:0 "Có lẽ [benefactor.GetTitledFirstNameNoTooltip] có thể gửi cho ta các [ROOT.Char.GetFaith.PriestNeuterPlural] mới?"
  fp1_jomsvikings.0011.b.fallback:0 "Đáng tiếc, nhưng ta có thể đưa về các [ROOT.Char.GetFaith.PriestNeuterPlural] thay thế..."
  fp1_jomsvikings.0011.c:0 "Thu gom gafol; về lâu dài còn rẻ hơn."
  fp1_jomsvikings.0011.c.tt:0 "[leader.GetTitledFirstName] rút lui mà không gây thêm sự cố"
  fp1_jomsvikings.0011.d:0 "Chẳng phải đây chỉ là vấn đề địa phương sao?"
  fp1_jomsvikings.0011.d.tt:0 "Ngài để mặc [target_county.GetNameNoTier] chìm trong biển lửa"

 # Jomsvikings send Event Troops
  fp1_jomsvikings.0021.t:0 "Thương Thuyết với Hải Tặc"
  fp1_jomsvikings.0021.desc:0 "Ta đón tiếp một phái đoàn côn đồ lộn xộn từ [leader.GetPrimaryTitle.GetNameNoTier] với sự nghi ngờ, chúng mang theo thư của [leader.GetTitledFirstName].\n\nLà những kẻ cướp bóc hung hãn cả trên biển lẫn đất liền, những kẻ cuồng tín này thuộc hàng hải tặc khét tiếng và chết chóc nhất thế giới.\n\nNhư bất kỳ [ROOT.Char.GetFaith.GetAdherentName] ngoan đạo nào, ta đã nghe chuyện về lòng sùng tín và võ nghệ của chúng với cả kính sợ lẫn e dè. Nay [leader.GetTitleAsNameNoTooltip] của chúng đề nghị giao cho ta quyền chỉ huy toán tình nguyện này, miễn là ta dùng chúng để cướp bóc nhân danh [ROOT.Char.GetFaith.PantheonTerm]."
  fp1_jomsvikings.0021.a:0 "Hải tặc mà biết nghe lệnh ư? Thú vị..."
  fp1_jomsvikings.0021.a.tt:0 "[army|E] sẽ bao gồm $jomsviking_pirates$ [men_at_arms|E] đặc biệt khó bị tiêu diệt"
  fp1_jomsvikings.0021.b:0 "Chỉ những thủy thủ có danh tiếng thôi."
  fp1_jomsvikings.0021.b.tt:0 "[army|E] sẽ bao gồm $bondi$ [men_at_arms|E] có thể tuyển mộ"
  fp1_jomsvikings.0021.c:0 "Ta thích binh lính có kỷ luật hơn..."

 # Jomsvikings challenge a Dishonorable Norse Pagan Ruler to Holmgang
  fp1_jomsvikings.0041.t:0 "Nỗi Ô Nhục Trước Các Vị Thần"
  fp1_jomsvikings.0041.desc:0 ""#EMP [ROOT.Char.GetFirstNameNoTooltip]#!!" [leader.GetTitledFirstName] gào lên khi [leader.GetSheHe] xông vào ngai vàng của ta, nửa người trần trụi.\n\n"Lối sống tội lỗi và sự ô nhục trắng trợn của ngươi là nỗi hổ thẹn cho toàn thể [leader.GetFaith.GetAdherentNamePlural], và [leader.GetPrimaryTitle.GetNameNoTier] sẽ không dung thứ nữa! Không viện cớ, không mưu mẹo, chúng ta holmgang, #EMP tại đây#! và #EMP ngay bây giờ#!!"\n\nSững sờ, lính canh của ta siết chặt vũ khí, sẵn sàng hành động.\n\nDù ta làm gì, tin tức chắc chắn sẽ lan khắp thế gian."
  fp1_jomsvikings.0041.a:0 "Ta sẽ tiễn ngươi đến Valhöll với nụ cười!"
  fp1_jomsvikings.0041.a.tt:0 "Ngài lập tức bước vào một [single_combat_fight|E]"
  fp1_jomsvikings.0041.a.tt_success:0 "Ngài chiến thắng"
  fp1_jomsvikings.0041.a.tt_failure:0 "[leader.GetTitledFirstName] chiến thắng"
  fp1_jomsvikings.0041.b:0 "Ngươi thật ngu ngốc khi đến một mình. Lính đâu!"
  fp1_jomsvikings.0041.b.tt_success:0 "[leader.GetTitledFirstName] bị xiềng lại và tống vào ngục"
  fp1_jomsvikings.0041.b.tt_failure:0 "[leader.GetTitledFirstName] trốn thoát ngoạn mục"
  fp1_jomsvikings.0041.c:0 "Ngươi biết mình chỉ là hải tặc hợm hĩnh chứ? Biến đi."

  fp1_jomsvikings.0042.trigger_failure:0 "Trận đấu của Ngài với [leader.GetTitledFirstNameNoTooltip] không còn hiệu lực"

  fp1_jomsvikings.0044.t:0 "$fp1_jomsvikings.0041.t$: Sự Minh Oan"
  fp1_jomsvikings.0044.desc:0 "Với [leader.GetTitledFirstName] nằm bất động dưới chân ta, đại sảnh chìm trong im lặng chết chóc. Không một tiếng thì thầm, không một hơi thở nào ngoài những nhịp thở dồn dập của ta.\n\nLặng lẽ, ta mặc lại y phục.\n\nTừng người một, ta nhìn thẳng vào mắt tất cả những ai còn ở đây."
  fp1_jomsvikings.0044.a:0 "Còn #EMP ai#! muốn thử nữa không?"
  fp1_jomsvikings.0044.b:0 "Sự chính danh của ta lại được chứng minh!"
  fp1_jomsvikings.0044.c:0 "Điều này chỉ cho thấy [leader.GetFaith.GetNameNoTooltip] là một đức tin không xứng đáng..."

 # Jomsvikings Destroyed
  fp1_jomsvikings.1001.t:0 "Sự Lụi Tàn của Cổ Đạo"
  fp1_jomsvikings.1001.desc.intro:0 "Với sự thất thủ của pháo đài cuối cùng, [title.GetNameNoTier] đã bị xóa sổ hoàn toàn.\n\n"
  fp1_jomsvikings.1001.desc.reformed_asatru_exists:0 "Dù đã cố gắng ngăn làn sóng đổi thay, đức tin của họ vẫn rạn nứt, như Kitô giáo và Hồi giáo từng trải qua.\n\nDù phe cải cách thắng thế hay những tín đồ trung thành khuất phục trước niềm tin ngoại lai, "
  fp1_jomsvikings.1001.desc.fallback:0 "Cuối cùng, họ vẫn không đủ sức ngăn làn sóng tín ngưỡng ngoại lai, và "
  fp1_jomsvikings.1001.desc.outro:0 "giờ đây dường như không thể tránh khỏi việc [leader.GetFaith.GetName] sẽ bị chôn vùi trong đống tro tàn của lịch sử."
  fp1_jomsvikings.1001.holy_order_destroyed:0 "[title.GetNameNoTier] đã bị tiêu diệt."
  fp1_jomsvikings.1001.a:0 "Các vị thần đã bỏ rơi chúng ta!"
  fp1_jomsvikings.1001.a.tt:0 "Jomsvikings sẽ không còn ban phước cho kẻ mộ đạo"
  fp1_jomsvikings.1001.b:0 "Đồ rác rưởi, biến đi cho khuất mắt!"
  fp1_jomsvikings.1001.b.tt:0 "Jomsvikings sẽ không còn cướp bóc kẻ ngoại đạo"
  fp1_jomsvikings.1001.c:0 "Yhomz-là ai cơ?"
  fp1_jomsvikings.1001.c.tt:0 "$fp1_jomsvikings.1001.b.tt$"
