l_english:
 # Holding a grand sacrifice.
 fp1_other_decisions.0001.t:0 "Đại [blotter.Custom('GruesomeFestivalName')|U]"
 fp1_other_decisions.0001.desc:0 "Mặc dù các [blotter.Custom('GruesomeFestivalNamePlural')] nhỏ hơn được tổ chức vào nhiều dịp trong năm, cứ mỗi thập kỷ một lần, các [gf_faith.GetAdherentNamePlural] của [blotter.GetPrimaryTitle.GetNameNoTierNoTooltip] lại tụ họp cho một lễ hội vĩ đại và, quan trọng nhất, một đại lễ #EMP hiến tế#!.\n\nDù vô số máu được đổ vì [gf_faith.PantheonTerm], thịt của các vật hiến tế sẽ thuộc về những tín đồ. Một bữa tiệc thịnh soạn như vậy thường tạo nên một lễ hội khó quên.\n\nDĩ nhiên, một sự kiện như thế này vô cùng tốn kém, và chắc chắn không phải #EMP tất cả#! [gf_faith.GetAdherentNamePluralNoTooltip] đều cần được mời..."
 fp1_other_decisions.0001.a.capital:0 "Có lẽ chỉ người dân [capital_county.GetNameNoTierNoTooltip] và triều đình?"
 fp1_other_decisions.0001.a.other:1 "Người dân [fallback_location.GetNameNoTierNoTooltip] giữ đức tin đủ vững để đón tiếp chúng ta."
 fp1_other_decisions.0001.b:0 "Tất cả những [blotter.Custom('WomenMenPeople_GenderPreference')] tự do trong lãnh địa của ta sẽ đến!"
 fp1_other_decisions.0001.c:0 "Mọi [blotter.Custom('LadyLordNoble_GenderPreference')|U] và thường dân trong [blotter.GetPrimaryTitle.GetTierAsNameNoTooltip] đều được mời!"
 fp1_other_decisions.0001.d:0 "Nghĩ lại thì, việc này quá tốn kém..."
 ## ^Technically, the two loc keys above should use gf_faith, but we permit blotter to think of the event through their personal world-view.
 fp1_other_decisions.0001.prep_start.tt:0 "Công tác chuẩn bị cho [blotter.Custom('GruesomeFestivalName')] bắt đầu..."
 fp1_other_decisions.0001.prep_continue.tt:0 "Công tác chuẩn bị cho [blotter.Custom('GruesomeFestivalName')] tiếp tục..."

 fp1_other_decisions.0002.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0002.desc.intro:0 "Một [blotter.Custom('GruesomeFestivalName')] có thể vừa hoành tráng vừa giản dị.\n\nTheo truyền thống, nó bao gồm cả hiến tế người và động vật. Một số tù nhân sẽ được dâng lên cho [gf_faith.PantheonTerm], thậm chí có thể bao gồm một lựa chọn đặc biệt do chính ta quyết định, mạng sống của họ được hiến dâng cho [gf_faith.PantheonTerm].\n\nDù tín điều của [gf_faith.GetNameNoTooltip] đòi hỏi điều này,"
 fp1_other_decisions.0002.desc.vassals_dislike_humsac:0 "vẫn có những chư hầu của ta cho rằng điều đó thật man rợ,"
 fp1_other_decisions.0002.desc.counties_dislike_humsac:0 "vẫn có những thường dân trong lãnh địa ghê tởm ý nghĩ ấy,"
 fp1_other_decisions.0002.desc.courtiers_dislike_humsac:0 "vẫn có vài người trong triều đình kinh tởm ngay cả ý tưởng này,"
 fp1_other_decisions.0002.desc.fallback:0 "thực ra đây không phải là yêu cầu bắt buộc,"
 fp1_other_decisions.0002.desc.outro:0 "và nghi lễ vẫn có thể được tiến hành chỉ với hiến tế động vật nếu ta muốn tránh tranh cãi."
 fp1_other_decisions.0002.a:0 "Một số lượng hiến tế động vật vừa phải là đủ."
 fp1_other_decisions.0002.animals_only.regular.opinion:0 "[opinion|E] và [county_opinion|E] nhận được với [gf_faith.GetAdherentNamePlural] sẽ ít hơn so với hiến tế người"
 fp1_other_decisions.0002.animals_only.appeased_humsac_haters:0 "Thần dân không ủng hộ hiến tế người sẽ không mất [opinion|E] hoặc [county_opinion|E]"
 fp1_other_decisions.0002.animals_only.regular.piety:0 "#positive_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] sẽ được nhận $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.regular.piety.loss:0 "#negative_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] sẽ bị mất $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.b:0 "Mang đến một con thú hay gia cầm cho mỗi [blotter.Custom('WomanManPerson_GenderPreference')]!"
 fp1_other_decisions.0002.animals_only.magnificent.opinion:0 "[opinion|E] và [county_opinion|E] nhận được với [gf_faith.GetAdherentNamePlural] sẽ ngang với hiến tế người"
 fp1_other_decisions.0002.animals_only.magnificent.piety:0 "#positive_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] sẽ được nhận $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.magnificent.piety.loss:0 "#negative_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] sẽ bị mất $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.c:0 "Truyền thống là điều quan trọng. [gf_faith.PantheonTerm|U] sẽ nếm máu người."
 fp1_other_decisions.0002.human_sacrifice.regular.opinion:0 "[opinion|E] và [county_opinion|E] nhận được với [gf_faith.GetAdherentNamePlural] sẽ ngang với hiến tế động vật hoành tráng"
 fp1_other_decisions.0002.animals_only.offended_humsac_haters:0 "Thần dân không ủng hộ hiến tế người sẽ mất nhiều [opinion|E] & [county_opinion|E]"
 fp1_other_decisions.0002.human_sacrifice.regular.piety:0 "#positive_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] sẽ được nhận $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.regular.piety.loss:0 "#negative_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] sẽ bị mất $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.optional_victim_picker:0 "Tùy chọn, Ngài có thể [designate_chief_sacrifice_article|E] trong số các [prisoners|E] của mình"
 fp1_other_decisions.0002.human_sacrifice.become_cannibal:0 "Ngài sẽ trở thành [GetTrait('cannibal').GetName( GetNullCharacter )] tại [blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0002.d:0 "Chỉ những lễ hiến tế cao quý nhất mới xứng đáng: cả [blotter.Custom('WomanManPerson_GenderPreference')] lẫn động vật..."
 fp1_other_decisions.0002.human_sacrifice.magnificent.opinion:0 "[opinion|E] và [county_opinion|E] nhận được với [gf_faith.GetAdherentNamePlural] sẽ đạt mức cao nhất"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety:0 "#positive_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] sẽ được nhận $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety.loss:0 "#negative_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] sẽ bị mất $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.blot_invalidation.tt:0 "[blotter.Custom('GruesomeFestivalName')|U] Bị Buộc Hủy"
 fp1_other_decisions.0002.blot_invalidation.costs_recouped.tt:0 "Phần lớn [gold|E] và toàn bộ [prestige|E] của Ta đã được hoàn lại"
 fp1_other_decisions.0002.piety_gain.rump:0 "tại [blotter.Custom('GruesomeFestivalName')]"

 fp1_other_decisions.0003.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0003.desc.intro.small:0 "Dù buổi tụ họp khá nhỏ, bầu không khí tại [blotter.Custom('GruesomeFestivalName')] vẫn vô cùng náo nhiệt, với những [gf_faith.GetAdherentNamePlural] vui vẻ chen lấn và hò reo khi"
 fp1_other_decisions.0003.desc.intro.medium:0 "[gf_faith.HouseOfWorship] chật kín những [gf_faith.GetAdherentNamePlural] hân hoan cổ vũ, tất cả cùng gầm vang khi"
 fp1_other_decisions.0003.desc.intro.large:0 "Khách tham dự [blotter.Custom('GruesomeFestivalName')] đông đến mức phủ kín khu vực quanh [gf_faith.HouseOfWorship], tạo nên một tiếng gầm hỗn loạn khi"
 fp1_other_decisions.0003.desc.animals.regular:0 "một đoàn động vật hiến tế trang trọng được lùa lên bàn thờ.\n\n"
 fp1_other_decisions.0003.desc.animals.magnificent:0 "một hàng dài động vật hiến tế hùng hậu được dẫn tới bàn thờ.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.sans_chief:0 "một nhóm tù nhân hoảng sợ bị áp giải về phía bàn thờ, phía sau là những con vật.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.sans_chief:0 "một toán tù nhân dữ tợn cùng đàn gia súc tuyệt hảo bị áp giải đến bàn thờ.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.plus_chief:0 "[sacrifice.GetFirstName] bị lôi lên bàn thờ, kẻ đầu tiên trong số nhiều tù nhân và thú vật.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.plus_chief:0 "[sacrifice.GetFirstName] bị kéo thẳng lên bàn thờ, kẻ đầu tiên trong một hàng dài người và thú kéo dài ra tận ngoài cửa.\n\n"
 fp1_other_decisions.0003.desc.sacrifice.named.norse_cannibals:0 "[sacrifice.GetSheHe|U] vùng vẫy vô vọng khi bị bóp cổ đến chết, rồi bị rút cạn máu. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.named.cannibals:0 "[sacrifice.GetSheHe|U] bị đánh bất tỉnh trước, $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.named.norse:0 "[sacrifice.GetSheHe|U] $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.named.fallback:0 "[sacrifice.GetSheHe|U] vùng vẫy dũng cảm cho đến khi cổ [sacrifice.GetHerHis] bị rạch.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse_cannibals:0 "Nạn nhân đầu tiên vùng vẫy trong vô vọng, và [sacrifice.GetHerHis] bị siết cổ nhanh chóng. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.cannibals:0 "[blotter.Custom('SacrificeTerm')] đầu tiên bị lôi lên bàn thờ và đánh bất tỉnh, $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse:0 "[blotter.Custom('SacrificeTerm')] đầu tiên $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.fallback:0 "[blotter.Custom('SacrificeTerm')] con người đầu tiên vẫn vùng vẫy cho đến khi cổ [sacrifice.GetHerHis] bị khoét rách.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.animal.norse:0 "Từng con một, [blotter.Custom('GruesomeFestivalAnimalPreference')] được đưa ra, bị siết cổ đến chết rồi rút cạn máu. Thịt được đưa vào lửa rồi thành bữa tiệc. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.animal.fallback:0 "Từng con một, [blotter.Custom('GruesomeFestivalAnimalPreference')] được đưa ra, cổ bị cắt gọn ghẽ, và thân xác giao cho đầu bếp cùng đám đông đói khát."
 fp1_other_decisions.0003.desc.outro.faithful:0 "\n\nQuả thật là một cảnh tượng xứng đáng với [gf_faith.PantheonTerm]."
 fp1_other_decisions.0003.desc.outro.political:0 "\n\nTa có thể không chia sẻ đức tin ấy, nhưng thần dân vui vẻ sẽ tạo nên một [blotter.GetTitleAsNameNoTooltip] vui vẻ."
 fp1_other_decisions.0003.happy_characters_list:0 "Mọi [character|E] theo [gf_faith.GetName] được mời"
 fp1_other_decisions.0003.happy_titles_list:0 "Mọi [county|E] theo [gf_faith.GetName] được mời"
 fp1_other_decisions.0003.unhappy_characters_list:0 "Mọi [character|E] trong [realm|E] không thực hành hiến tế người"
 fp1_other_decisions.0003.unhappy_titles_list:0 "Mọi [county|E] trong [realm|E] không thực hành hiến tế người"
 fp1_other_decisions.0003.attendee_became_cannibal:0 "Ngài đã tham dự yến tiệc ăn thịt người của [blotter.GetTitledFirstNamePossessiveNoTooltip]"
 fp1_other_decisions.0003.a:0 "Vì [gf_faith.HighGodName]! Vì [gf_faith.FertilityGodName]! Vì [gf_faith.WealthGodName]!"
 fp1_other_decisions.0003.b:0 "Đây có vẻ là cơ hội tuyệt vời để gây ấn tượng với giới quý tộc."
 fp1_other_decisions.0003.b.nobility_list:0 "Mọi quý tộc [gf_faith.GetName] được mời có cấp bậc ít nhất là [count|E]-[rank|E]"
 fp1_other_decisions.0003.b.clergy_list:0 "Mọi giáo sĩ [gf_faith.GetName] được mời có cấp bậc ít nhất là [count|E]-[rank|E] và [GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của Ngài"
 fp1_other_decisions.0003.c:0 "Đã đến lúc hòa mình với đám dân thường!"
 fp1_other_decisions.0003.d:0 "Ta rời đi sớm; ta đã làm #EMP đủ#! rồi."
 fp1_other_decisions.0003.e:0 "Vì [gf_faith.HighGodName]! Ta phát âm đúng chứ?"
 fp1_other_decisions.0003.f:0 "Đức tin của những [gf_faith.GetAdherentNamePluralNoTooltip] này quả thật đầy mời gọi..."

 fp1_other_decisions.0004.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0004.desc:0 "Có những kẻ trong lãnh địa của ta tin vào việc tổ chức những cuộc tàn sát hiến tế vĩ đại cho các vị thần hư cấu của họ. Đức tin khai sáng của ta theo [blotter.GetFaith.GetAdjective] không tán thành sự đồ sát như vậy, thế nhưng một đặc điểm đáng chú ý của nhiều [blotter.Custom('GruesomeFestivalNamePlural')] là chúng phụ thuộc vào sự tham gia tích cực của [blotter.GetTitleAsNameNoTooltip].\n\nTa không cần cải đạo để điều hành nghi thức của họ, nhưng chắc chắn ta sẽ giành được nhiều bằng hữu trong số những thần dân kém khai sáng hơn, cả nông dân lẫn quý tộc, nếu đồng ý tổ chức một [blotter.Custom('GruesomeFestivalName')] trọng thể cho đức tin của họ."
 fp1_other_decisions.0004.a:1 "Có lẽ đáng để xoa dịu các [option_1.GetAdherentNamePlural]..."
 fp1_other_decisions.0004.b:1 "Vậy các [option_2.GetAdherentNamePlural] thực sự sẽ #EMP ủng hộ#! ta sao?"
 fp1_other_decisions.0004.c:0 "Những lễ hội [option_3.GetAdjective] quả có sức hấp dẫn riêng."
 fp1_other_decisions.0004.d:0 "Đây, cùng lắm, sẽ là sự báng bổ #EMP hoàn toàn#!!"

 # Copy-paste labels.
 fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl:0 "Toàn bộ máu me được hứng vào một chiếc bát, và các [gf_faith.PriestNeuterPlural] dùng nó để vẽ lên tường [gf_faith.HouseOfWorship], cả bên trong lẫn bên ngoài"
 fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation:0 "Phần thịt ăn được được xẻ ra cho bữa tiệc, còn tàn dư bị treo lên cây treo xác bên ngoài, và [blotter.Custom('SacrificeTerm')] tiếp theo bị đẩy ra"
 fp1_other_decisions.0003.desc.sacrifice.norse_throttling:0 "vùng vẫy dữ dội khi các [gf_faith.PriestNeuterPlural] siết cạn sinh mạng [sacrifice.GetHerHis], ánh sáng trong [sacrifice.GetHerHis] [sacrifice.Custom('EyeEyes')] còn le lói cho đến khi con vật đầu tiên bị giết. Xác người lên cây treo, thú vật vào lửa nấu"
 fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter:0 "bị đánh ngất để cơ thể thả lỏng. Nỗi sợ sẽ làm hỏng thịt. Sau đó, các [gf_faith.PriestNeuterPlural] lao vào, xẻ những thớ thịt mọng nước cho nồi nấu ngay khi [blotter.Custom('SacrificeTerm')] tiếp theo còn đang gào thét bị lôi ra"
 fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling:0 "Các tù nhân khác của [sacrifice.GetHerHis|U] kinh hoàng chứng kiến xác bị mổ bụng, biết rằng lượt của mình rồi sẽ đến. Có lẽ họ còn ghen tị với cái chết sạch sẽ hơn của lũ vật, những kẻ được đưa thẳng vào lửa nấu sau khi chết"

  fp1_other_decisions.0011.t:0 "$fp1_other_decisions.0001.t$"
  fp1_other_decisions.0011.desc.intro:0 "[blotter.Custom('GruesomeFestivalNamePlural')|U] là một phần quan trọng của đức tin [gf_faith.GetName], và [blotter.Custom2('MyCharacterIntroduction', ROOT.Char)] đang tổ chức một buổi lễ như vậy.\n\nĐây sẽ là một sự kiện trọng đại, với sự tham dự của toàn thể [gf_faith.GetAdherentNamePluralNoTooltip] tại [blotter.GetPrimaryTitle.GetNameNoTier], từ quý tộc đến thường dân."
  fp1_other_decisions.0011.desc.cannibal_blot:0 "Giống như nhiều nghi thức đặc biệt khác, việc nghi thức hóa ăn thịt người sẽ là bắt buộc đối với địa vị của ta."
  fp1_other_decisions.0011.desc.fallback:0 "Thức ăn, giải trí và mọi thứ khác sẽ hoàn toàn do [blotter.GetTitledFirstNameNoTooltip] chi trả."
  fp1_other_decisions.0011.desc.outro:0 "\n\nNgay cả khi ta bận rộn, việc cử một sứ giả giải thích lý do vắng mặt vẫn là điều thông lệ. Tuy nhiên, nếu ta muốn khinh thường [blotter.GetTitleAsNameNoTooltip], ta cũng có thể không gửi bất kỳ hồi âm nào..."
  fp1_other_decisions.0011.a:0 "Dành ra một ngày tham dự cũng là phép lịch sự."
  fp1_other_decisions.0011.b:0 "Mặc xác [blotter.GetFirstNameNoTooltip] cùng con ngựa mà sứ giả [blotter.GetHerHis] cưỡi đến."
  fp1_other_decisions.0011.b.tt:0 "[blotter.GetFirstNameNoTooltip] sớm muộn có thể sẽ nhận ra sự vắng mặt của Ngài"
  fp1_other_decisions.0011.c:0 "Thịt thiêng! Ta không thể chờ để nếm thử lần đầu..."
  fp1_other_decisions.0011.d:0 "Ta sẽ đi, nhưng ta không ăn thịt người."
  fp1_other_decisions.0011.e:0 "Không đời nào ta làm #EMP chuyện đó#! trong [gf_faith.NegativeAfterLife]!"
  fp1_other_decisions.0011.e.tt:0 ""
  fp1_other_decisions.0012.t:0 "$fp1_other_decisions.0001.t$: Những Gương Mặt Vắng Bóng"
  fp1_other_decisions.0012.desc.intro:0 "Việc các nhân vật quan trọng vắng mặt ngay cả trong một [blotter.Custom('GruesomeFestivalName')] trọng đại cũng không phải hiếm, nhưng việc cử một sứ giả thích hợp để giải thích lý do và thay mặt tham dự được xem là lịch sự.\n\n"
  fp1_other_decisions.0012.desc.multiple_decliners:0 "[decliner_1.GetTitledFirstName] và một số kẻ khác đã"
  fp1_other_decisions.0012.desc.single_decliner:0 "[decliner_1.GetTitledFirstName] đã"
  fp1_other_decisions.0012.desc.outro:0 "vắng mặt một cách conspicuously và không gửi bất kỳ lời nhắn nào trước. Đây rõ ràng là một sự xúc phạm đến quyền uy của ta, dù không hẳn là phạm pháp."
  fp1_other_decisions.0012.a:0 "Nguyền rủa [decliner_1.GetTitledFirstNameNoTooltip]!"
  fp1_other_decisions.0012.a.decliner_toast.t:0 "[blotter.GetTitledFirstNameNoTooltip] đã nhận ra sự vắng mặt của Ngài tại [blotter.Custom('GruesomeFestivalName')]"
  fp1_other_decisions.0012.b:0 "Mặc xác cả lũ chúng nó!"
  fp1_other_decisions.0012.b.all_decliners_list:0 "Tất cả [vassals|E] đã từ chối"
  fp1_other_decisions.0012.c.singular:0 "Hừ, thiệt cho [decliner_1.GetHerHis] thôi."
  fp1_other_decisions.0012.c.plural:0 "Hừ, thiệt cho chúng thôi."

  fp1_other_decisions.0021.t:0 "Sự Báng Bổ Tối Thượng"
  fp1_other_decisions.0021.desc:0 "Tin tức khủng khiếp từ [sacrificer.GetPrimaryTitle.GetNameNoTierNoTooltip]! Có vẻ như kẻ [sacrificer.Custom('GetUnbelieverName')] đê tiện, [sacrificer.GetShortUIName], đã tế thần [sacrificed_hof.GetTitledFirstName] cao quý cho đức tin kinh tởm của [sacrificer.GetHerHis].\n\n"
  fp1_other_decisions.0021.desc.allows_holy_wars:0 "Khắp nơi, huyết quản của những [sacrificed_hof.GetFaith.GetAdherentNamePlural] nhiệt thành đang sôi sục vì phẫn nộ chính nghĩa!\n\nSự sỉ nhục này không thể không bị trừng phạt, và tại mọi quán rượu, pháo đài, và cung điện nơi danh của [sacrificed_hof.GetFaith.WarGodName] được tôn vinh, người ta đều bàn tán về một cuộc thánh chiến."
  fp1_other_decisions.0021.desc.disallows_holy_wars:0 "Ngay cả trong thời khắc thử thách này, chúng ta phải nhớ đến con đường của [sacrificed_hof.GetFaith.HighGodName], không đổ máu vô nghĩa. Không gì có thể đưa [sacrificed_hof.GetTitledFirstNameNoTooltip] trở lại, và [sacrificed_hof.GetSheHe] hẳn muốn chúng ta thương tiếc [sacrificed_hof.GetHerHim] một cách chính trực và ôn hòa."
  fp1_other_decisions.0021.a.zealous:0 "Báng bổ đến thế này sao?!"
  fp1_other_decisions.0021.a.cynical:0 "Dù gì thì đây cũng là sự sỉ nhục đối với dân tộc ta!"
  fp1_other_decisions.0021.a.fallback:0 "Thật kinh khủng!"
  fp1_other_decisions.0021.cheaper_holy_wars.tt:0 "[holy_wars|E] chống lại [sacrificer.GetShortUIName] giờ rẻ hơn đáng kể"
  fp1_other_decisions.0021.easier_holy_wars.tt:0 "[holy_wars|E] chống lại [sacrificer.GetShortUIName] yêu cầu ít [piety_levels|E] hơn bình thường"
  fp1_other_decisions.0021.ghw_target_preference.tt:0 "[great_holy_wars|E] có khả năng cao hơn sẽ nhắm vào [sacrificer.GetShortUIName]"

  fp1_other_decisions.0022.t:0 "$fp1_other_decisions.0021.t$"
  fp1_other_decisions.0022.desc:0 "Có vẻ như các tín đồ [unlucky_guest.GetFaith.GetAdherentNamePlural] trên khắp thế giới đã không đón nhận tốt đẹp việc ta hiến tế vị [unlucky_guest.GetTitleAsNameNoTooltip] giả dối của họ.\n\n"
  fp1_other_decisions.0022.desc.disallows_holy_wars:0 "Đúng với đức tin hòa bình của họ, họ dường như chỉ tụ họp cầu nguyện lặng lẽ với [unlucky_guest.GetFaith.HighGodName] thay vì tìm kiếm sự báo thù đẫm máu."
  fp1_other_decisions.0022.desc.allows_holy_wars:0 "Đúng với đức tin hiếu chiến của họ, nhiều kẻ trong số đó đang kêu gọi lấy đầu ta, rao giảng thánh chiến cho đến khi lãnh địa của ta bị xóa sổ khỏi mặt đất."
  fp1_other_decisions.0022.a.pacifists:0 "Ha, có khi [unlucky_guest.GetFaith.HighGodName] sẽ giáng sét xuống ta chăng?"
  fp1_other_decisions.0022.a.craven:0 "Chuyện này... có lẽ là một sai lầm."
  fp1_other_decisions.0022.a.fallback:0 "Hừ, để chúng kéo đến đi!"

  fp1_other_decisions.0023.t:0 "$fp1_other_decisions.0021.t$"
  fp1_other_decisions.0023.desc.intro:0 "Khắp nơi, các [unlucky_guest.GetFaith.GetAdherentNamePlural] đều bàng hoàng. [unlucky_guest.GetShortUIName] yêu quý của chúng ta đã bị hiến tế cho lũ [gf_faith.GetAdherentNamePlural] ghê tởm, và tệ hơn nữa, theo #EMP lệnh trực tiếp#! của một kẻ trong chính hàng ngũ chúng ta.\n\n"
  fp1_other_decisions.0023.desc.has_excommunication:0 "[blotter.GetShortUIName] đã ngay lập tức bị rút phép thông công và những hành vi báng bổ của [blotter.GetHerHis] bị lên án trước toàn thể [unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip] chính trực."
  fp1_other_decisions.0023.desc.does_not_have_excommunication:0 "Toàn thể [unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip] chính trực đều kêu gọi trục xuất [blotter.GetShortUIName], nguyền rủa danh [blotter.GetHerHis], khỏi đức tin."
  fp1_other_decisions.0023.desc.outro:0 "Cầu cho [unlucky_guest.GetFaith.NegativeAfterLife] nuốt chửng [blotter.GetHerHim]!"
  fp1_other_decisions.0023.a:0 "Không thể tha thứ!"
  fp1_other_decisions.0023.b:0 "Đó là loại [blotter.GetWomanMan] #EMP gì#! vậy?!"

  fp1_other_decisions.0024.t:0 "$fp1_other_decisions.0021.t$"
  fp1_other_decisions.0024.desc.intro:0 "Điều gì đã khiến ta làm vậy? Tên tay sai nào của [unlucky_guest.GetFaith.DevilName] đã bám rễ trong đầu ta khiến ta #EMP công khai#! dung túng việc hiến tế [unlucky_guest.GetShortUIName] cho các tà thần ngoại đạo? Sự báng bổ của ta đã trở thành câu chuyện bàn tán trong bữa tối của mọi tín đồ [unlucky_guest.GetFaith.GetAdherentName] chính trực trên khắp thế gian!\n\n"
  fp1_other_decisions.0024.desc.has_excommunication:0 "Chẳng cần chiếu thư rút phép thông công, các [unlucky_guest.GetFaith.PriestNeuterPlural] cũng từ chối lắng nghe tội lỗi của ta."
  fp1_other_decisions.0024.desc.does_not_have_excommunication:0 "Ngay cả những [unlucky_guest.GetFaith.PriestNeuterPlural] ít mộ đạo nhất cũng không dám nhìn thẳng vào ta."
  fp1_other_decisions.0024.desc.outro:0 "Trong mắt [unlucky_guest.GetFaith.GetReligion.GetName], ta đã lạc lối và bị nguyền rủa."
  fp1_other_decisions.0024.a:0 "#EMP Ta đã làm gì thế này?!#!"
  fp1_other_decisions.0024.b:0 "[unlucky_guest.GetSheHe|U] chỉ là một [unlucky_guest.GetWomanMan], đâu phải thần thánh!"
  fp1_other_decisions.0024.c:0 "Là thần dân của ta làm, không phải ta!"

  fp1_other_decisions.0063.t:0 "$game_concept_designate_chief_sacrifice_chief_sacrifice$ đã chết trước [ROOT.Char.Custom('GruesomeFestivalName')|U]"
  fp1_other_decisions.0063.desc:0 "[designated_sacrifice.GetTitledFirstNameNoTooltip] đã chết trước khi [designated_sacrifice.GetSheHe] có thể bị hiến tế."

  fp1_other_decisions.0101.t.root_title:0 "Những Tảng Đá Qua Năm Tháng"
  fp1_other_decisions.0101.t:0 "$fp1_other_decisions.0101.t.root_title$: Chủ Đề"
  fp1_other_decisions.0101.desc:0 "Mỗi bia đá rune đều kể lại một sự kiện quan trọng trong đời người cho dựng nó. Từ kẻ nông dân nhỏ bé nhất đến một [ROOT.Char.GetTitleAsNameNoTooltip] như ta, tảng đá ghi lại tất cả.\n\nTượng đài này sẽ kể về điều gì?"
  fp1_other_decisions.0101.a:0 "[ROOT.Char.Custom2('RelationToMeShort',ancestor)] quá cố của ta, [ancestor.GetFirstNameNoTooltip]."
  fp1_other_decisions.0101.a.tt:0 "Bia đá sẽ kể về người thân đã khuất của Ngài..."
  fp1_other_decisions.0101.b:0 "Hay là về kẻ thù bị ta đánh bại, [foe.GetTitledFirstNameNoTooltip]?"
  fp1_other_decisions.0101.b.tt:0 "Bia đá sẽ kể về những chiến thắng chinh phạt của Ngài..."
  fp1_other_decisions.0101.c:0 "Ngày ta đăng quang ngai vàng [new_title.GetNameNoTierNoTooltip]!"
  fp1_other_decisions.0101.c.tt:0 "Bia đá sẽ kể về cách Ngài lên nắm quyền..."
  fp1_other_decisions.0101.d:0 "Ngươi muốn ta trả #EMP BAO NHIÊU#! cho một tảng đá to vẽ màu?"

  fp1_other_decisions.0111.t:0 "$fp1_other_decisions.0101.t.root_title$: Địa Điểm"
  fp1_other_decisions.0111.desc.intro:0 "Giờ ta đã quyết định nội dung cho bia đá rune, câu hỏi còn lại là: đặt nó ở đâu?\n\n"
  fp1_other_decisions.0111.desc.ancestor:0 "Tưởng niệm gia đình như [ancestor.GetFirstName] khuyến khích sự tôn kính và trung thành. Tốt nhất nên đặt ở những nơi ít coi trọng ta, nơi ta có thể làm gương về sự tận tụy và phục vụ các thế lực tối cao."
  fp1_other_decisions.0111.desc.conquest:0 "Tưởng niệm chiến thắng, như chiến công của ta trước [foe.GetTitledFirstName], là lời nhắc nhở thường trực về hồi kết vinh quang của một cuộc chiến. Tốt nhất nên đặt ở những vùng cần được khích lệ hợp tác."
  fp1_other_decisions.0111.desc.promotion:0 "Tượng đài về sự thăng tước, như việc ta trở thành [ROOT.Char.GetTitleAsNameNoTooltip] của [new_title.GetNameNoTierNoTooltip], khuyến khích dân chúng phụng sự quân chủ dù thịnh hay suy. Tốt nhất nên đặt tại đô thị, nơi nhiều thanh niên có thể được truyền cảm hứng gia nhập quân ngũ."
  fp1_other_decisions.0111.desc.outro:0 "\n\nTất nhiên, có một hai địa điểm nảy ra trong đầu ta..."
  fp1_other_decisions.0111.a:0 "[location_a.GetNameNoTierNoTooltip|U] sẽ là nơi thích hợp."
  fp1_other_decisions.0111.b:0 "[location_b.GetNameNoTierNoTooltip|U] có vẻ cũng ổn?"
  fp1_other_decisions.0111.c:0 "[location_c.GetNameNoTierNoTooltip|U] là lựa chọn tuyệt vời!"
 
  fp1_other_decisions.1000.t:0 "Bị Hiến Tế!"
  fp1_other_decisions.1000.desc:0 "Ta đang đối mặt với đám đông đang tụng kinh, tất cả ánh mắt của họ đều dán chặt vào ta. [blotter.GetFirstName] đứng ở phía trước với một nụ cười trên khuôn mặt [blotter.GetHerHis], sẵn sàng kết liễu mạng sống của ta.\n\n\"Mighty [blotter.GetFaith.HighGodName]! Hãy chấp nhận sự hy sinh này!\" [blotter.GetSheHe] hét lên.\n\nThế là hết đối với ta.\n\nBóng tối bao trùm.\n\nMọi chuyện đã kết thúc."
  fp1_other_decisions.1000.a:0 "Ta sẽ gặp ngươi tại [ROOT.Char.GetFaith.NegativeAfterLife]!"
