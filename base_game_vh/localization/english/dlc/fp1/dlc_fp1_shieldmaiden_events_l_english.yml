l_english:
 ##################################################
 # #Ordinary Events
  fp1_shieldmaiden.0001.t:0 "Một [shieldmaiden.Custom('ShieldPersonFemaleMale')] Đầy Triển Vọng"
  fp1_shieldmaiden.0001.desc:0 "[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần đến trước ngài để xin một cơ hội chứng tỏ bản thân," [shieldmaiden.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shieldmaiden'))] của ta nói. Ta khẽ dịch người trên ngai vàng, đầy hứng thú, trong khi triều đình xung quanh căng tai lắng nghe.\n\n"Dù thần ngang hàng với bất kỳ $knight_culture_player_plural_no_tooltip_lowercase$ nào của ngài, thần vẫn bị cấm đứng trong tường khiên hay chỉ huy quân đội của ngài. Thần xin thách đấu [challenged_knight.GetTitledFirstName] một trận quyết đấu, để chứng minh bản lĩnh nơi chiến trường."
  fp1_shieldmaiden.0001.a:0 "Được thôi, ngươi có thể đấu với [challenged_knight.GetTitledFirstNameNoTooltip]."
  fp1_shieldmaiden.0001.a.tt_success:0 "[challenged_knight.GetFirstNameNoTooltip] chiến thắng"
  fp1_shieldmaiden.0001.a.tt_failure:0 "[shieldmaiden.GetFirstNameNoTooltip] giành chiến thắng"
  fp1_shieldmaiden.0001.b:0 "[challenged_knight.GetFirstNameNoTooltip]? Không đâu, ngươi sẽ đấu với #EMP ta#!!"
  fp1_shieldmaiden.0001.b.tt_success:0 "Ngài đánh bại [shieldmaiden.GetFirstNameNoTooltip]"
  fp1_shieldmaiden.0001.b.tt_failure:0 "[shieldmaiden.GetFirstNameNoTooltip] khiến Ngài choáng váng"
  fp1_shieldmaiden.0001.c:0 "Chỉ riêng việc dám xin đã đủ can đảm rồi."
  fp1_accepted_shieldmaiden_without_question:0 "Mọi [courtier|E] & [vassal|E] cho rằng [shieldmaiden.GetWomenMen] không thể chiến đấu"
  fp1_shieldmaiden.0001.d:0 "Một [shieldmaiden.Custom('ShieldPersonFemaleMale')] ư? Thật nực cười!"

  fp1_shieldmaiden.0011.t:0 "[shieldmaiden.Custom('ShieldPersonFemaleMale')] Chặn Đường Tẩu Thoát"
  fp1_shieldmaiden.0011.desc:0 "Việc mở khóa xà lim của ta dễ hơn mong đợi. Lẻn qua hết lính canh này đến lính canh khác thì khó hơn, nhưng ta vẫn làm được, len lỏi như một cái bóng rời khỏi ngục tù.\n\nChỉ đến khi ta gần như có thể #EMP nếm#! được tự do thì nó lại bị giật mất. Rẽ qua một góc tường, [shieldmaiden.GetTitledFirstName], [imprisoner.GetFirstNamePossessive] [shieldmaiden.Custom('ShieldPersonFemaleMale')|L], lặng lẽ bước ra từ bóng tối.\n\nTa thậm chí còn chưa kịp nhận ra [shieldmaiden.GetHerHis] cây chùy cho đến khi nó vung thẳng vào mặt ta."
  fp1_shieldmaiden.0011.a:0 "Khoan, không, đừn— ARRGH!"
  fp1_shieldmaiden.0012.t:0 "$fp1_shieldmaiden.0011.t$"
  fp1_shieldmaiden.0012.desc:0 "[prisoner.GetTitledFirstName] đã bị đưa trở lại giam giữ vào rạng sáng nay, sau khi suýt trốn thoát trong đêm.\n\nCó vẻ như tù nhân đã lẻn qua hầu hết lính canh trước khi bị [shieldmaiden.GetTitledFirstName], đang đi dạo khuya vì trằn trọc, phát hiện.\n\n[shieldmaiden.Custom('ShieldPersonFemaleMale')] của ta đã đánh [prisoner.GetFirstNameNoTooltip] đến bê bết máu, rồi cuối cùng lôi [prisoner.GetHerHim] trở lại giao cho [prisoner.GetHerHis] cai ngục."
  fp1_shieldmaiden.0012.a:0 "Làm tốt lắm, [shieldmaiden.GetFirstNameNoTooltip]."
  fp1_shieldmaiden.0012.b:0 "Sao ngươi lại đánh [prisoner.GetHerHim] nặng tay đến vậy?!"

  fp1_shieldmaiden.0021.t:0 "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
  fp1_shieldmaiden.0021.desc.assassin:0 "Sát thủ của ta đã thất bại trong việc giết [target.GetTitledFirstName]! Rõ ràng [shieldmaiden.GetTitledFirstName], [shieldmaiden.Custom('ShieldPersonFemaleMale')] của [target.GetFirstNamePossessiveNoTooltip], đã can thiệp chỉ vài giây trước khi án mạng xảy ra và hạ gục kẻ ta thuê."
  fp1_shieldmaiden.0021.desc.thugs:0 "Đám côn đồ ta thuê để giết [target.GetTitledFirstName] đã thất bại! Dù hung hãn, chúng không thể vượt qua [target.GetFirstNamePossessiveNoTooltip] [shieldmaiden.Custom('ShieldPersonFemaleMale')], người đã bảo vệ [target.GetHerHim] đủ lâu để lính canh của [target.GetHerHis] kịp tập hợp và tiêu diệt bọn cướp còn lại."
  fp1_shieldmaiden.0021.desc.mob:0 "Trong khi đám đông mà ta kích động để giết [target.GetTitledFirstName] đã xoay xở để kéo [target.GetHerHim] khỏi ngựa của [target.GetHerHis], họ đã không thể kết thúc công việc trước khi [shieldmaiden.Custom('ShieldPersonFemaleMale')] của [target.GetFirstNamePossessiveNoTooltip] can thiệp. [shieldmaiden.GetSheHe|U] tàn nhẫn hạ gục những tên nông dân trong tầm đánh của [target.GetFirstNameNoTooltip] và khiến những kẻ còn lại chạy trốn vì sợ hãi."
  fp1_shieldmaiden.0021.desc.lured_into_forest:0 "Ta đã nghĩ kế hoạch khiến [target.GetTitledFirstName] bị lạc trong rừng đã diễn ra hoàn hảo khi màn đêm buông xuống mà không thấy dấu vết của [target.Custom('GirlBoy')] ngang bướng.\n\nThật không may, ngay khi ta chuẩn bị đi ngủ thì nhận được tin rằng [shieldmaiden.Custom('ShieldPersonFemaleMale')] của [target.GetFirstNamePossessiveNoTooltip] đã ra khỏi rừng với [target.Custom('GirlBoy')] đi kèm. Rõ ràng [shieldmaiden.GetSheHe] đã tự mình truy tìm dấu vết của [target.GetFirstNamePossessiveNoTooltip] qua rừng và tìm thấy nó ngay trước khi những con thú đói khát kịp ra tay."
  fp1_shieldmaiden.0021.desc.child_pushed:0 "[target.Custom('GirlBoy')] ngốc nghếch nhỏ bé người mà lẽ ra sẽ là [target.GetTitleAsNameNoTooltip] đã đủ ngu ngốc để rơi vào bẫy của ta! [target.GetFirstName] trèo lên mép ban công đúng như kế hoạch, và tay sai của ta đã đẩy [target.GetHerHim] ra không trung...\n\n..Nhưng điều lẽ ra phải là một cú ngã chết người lại không thành, khi [target.GetSheHe] được [shieldmaiden.Custom('ShieldPersonFemaleMale')] của [target.GetHerHis] bắt được ngay trước khi chạm đất. [target.GetSheHe|U] vẫn sống sót để nhìn thấy ngày mai, và khó có khả năng sẽ lại rơi vào mưu mẹo đó lần nữa."
  fp1_shieldmaiden.0021.shieldmaiden_dies:0 "\n\nÍt nhất thì [shieldmaiden.GetFirstNameNoTooltip] sẽ không làm phiền ta nữa, vì [shieldmaiden.GetSheHe] đã chết vì những vết thương của [shieldmaiden.GetHerHis]."
  fp1_shieldmaiden.0021.a:0 "Kết thúc rồi..."
  fp1_shieldmaiden.0021.b:0 "... Chưa kết thúc cho đến khi ta nói là kết thúc!"
  fp1_shieldmaiden.0022.t:0 "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
  fp1_shieldmaiden.0022.desc.assassin:0 "Hôm nay ta suýt #EMP chết#!! Nếu [shieldmaiden.GetFirstName] không nhận ra điều bất thường và theo ta về phòng, giờ này ta đã là một cái xác.\n\nĐiều đầu tiên ta nghe thấy về tên sát thủ là [shieldmaiden.GetFirstNameNoTooltip] lao người quật ngã ai đó ngay phía sau lưng ta, rồi tất cả chỉ còn là dao găm và nắm đấm loang loáng cho đến khi kẻ tấn công nằm chết."
  fp1_shieldmaiden.0022.desc.assassin.shieldmaiden_dies:0 "\n\nĐáng tiếc, [shieldmaiden.GetFirstNameNoTooltip] đã trả giá bằng chính mạng sống mình. Dù sát thủ đã chết, vết thương của [shieldmaiden.GetHerHis] lại chí mạng."
  fp1_shieldmaiden.0022.desc.thugs:0 "Ta đang đi cùng với tùy tùng thì có tiếng hét từ một lùm cây. \"Tấn công! Hãy nhắm vào [ROOT.Char.GetTitleTierName]!\" Một cuộc phục kích!\n\nĐây không chỉ là những tên cướp vì vàng của ta, mà là những tên côn đồ vì mạng sống của ta! [shieldmaiden.Custom('ShieldPersonFemaleMale')] [shieldmaiden.GetFirstNameNoTooltip] của ta lao vào bảo vệ ta, đặt cơ thể [shieldmaiden.GetHerHis] giữa lũ cướp khát máu và ta.\n\n[shieldmaiden.GetFirstNameNoTooltip|U] dàn dựng một cuộc rút lui chiến đấu khi kẻ thù tụ tập quanh vị trí của chúng ta với những lưỡi kiếm vung lên, nhưng chẳng bao lâu sau, những vệ sĩ khác của ta đã có thể tập hợp để bảo vệ và hạ gục những kẻ tấn công còn lại."
  fp1_shieldmaiden.0022.desc.thugs.shieldmaiden_dies:0 "Chỉ khi giao tranh lắng xuống, [shieldmaiden.GetSheHe] mới khuỵu xuống đất, và ta phát hiện những vết thương sâu của [shieldmaiden.GetHerHis]. [shieldmaiden.GetSheHe] thực sự đã bảo vệ ta đến hơi thở cuối cùng..."
  fp1_shieldmaiden.0022.desc.mob:0 "Ta đang cưỡi ngựa qua các con phố của [home_province.GetName] thì một đám nông dân la hét xông vào đoàn hộ tống. Trước khi kịp hiểu chuyện gì xảy ra, bọn chúng kéo ta khỏi ngựa và bắt đầu đánh đập!\n\n[shieldmaiden.Custom('ShieldPersonFemaleMale')] của ta, [shieldmaiden.GetFirstName], lao tới bảo vệ với [shieldmaiden.Custom('signature_weapon')] trong tay, tàn nhẫn [shieldmaiden.Custom('SignatureWeaponWoundVerb1PresentParticiple')] những kẻ đang đánh ta và — có lẽ chẳng mấy hào nhoáng — che chắn ta khỏi tổn hại thêm khi ta bị vùi dưới xác chúng."
  fp1_shieldmaiden.0022.desc.mob.shieldmaiden_lives:0 "\n\nKhi tiếng giao tranh chấm dứt, [shieldmaiden.GetFirstNameNoTooltip] gạt những thi thể khỏi người ta và đỡ ta đứng dậy. Ngoài chúng ta ra, con phố giờ đã vắng lặng, mọi kẻ âm mưu đều đã chết hoặc bỏ chạy."
  fp1_shieldmaiden.0022.desc.mob.shieldmaiden_dies:0 "\n\nKhi ta thoát ra khỏi đống xác, con phố chỉ còn lại những thi thể ngã xuống — trong đó có [shieldmaiden.GetFirstNameNoTooltip]."
  fp1_shieldmaiden.0022.desc.lured_into_forest:0 "Ta đang chơi trốn tìm với vài cận thần trong rừng thì nhận ra đã rất lâu rồi không còn nghe ai tìm mình nữa. Quá lâu.\n\nTa gọi to, nhưng không ai đáp. Ta đã bị bỏ rơi... Ta cố tìm đường về, nhưng không biết đâu là hướng nào, và trời tối rất nhanh.\n\nChẳng mấy chốc ta nghe tiếng thú dữ di chuyển giữa những tán cây, nhưng trước khi chúng kịp đến gần, [shieldmaiden.Custom('ShieldPersonFemaleMale')] của ta, [shieldmaiden.GetFirstName], đã xuất hiện, thở hổn hển và cầm cao một ngọn đuốc cháy rực. Ánh lửa dường như khiến lũ thú chùn bước, giữ khoảng cách khi [shieldmaiden.GetSheHe] thở dốc: \"Hãy đưa... ngài về nhà... thưa bệ hạ...\""
  fp1_shieldmaiden.0022.desc.child_pushed:0 "\n\n#EMP BỊCH#!\n\nTa đã rơi vào vòng tay của [shieldmaiden.Custom('ShieldPersonFemaleMale')] của mình, [shieldmaiden.GetFirstNameNoTooltip]. \"Đứa trẻ ngốc nghếch! Nếu ta không kịp đến chỗ ngươi... thôi được. Hãy đưa ngươi đến nơi an toàn.\""
  fp1_shieldmaiden.0022.owner_discovered:0 "\n\nChỉ có một kẻ duy nhất có thể đứng sau vụ tấn công này: [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
  fp1_shieldmaiden.0022.a:0 "Ai lại muốn giết #EMP ta#! chứ?"
  fp1_shieldmaiden.0022.b:0 "[owner.GetSheHe|U] sẽ phải trả giá vì việc này!"

  fp1_shieldmaiden.0032.t:0 "[shieldmaiden.Custom('ShieldPersonFemaleMale')] Tích Lũy Kinh Nghiệm"
  fp1_shieldmaiden.0032.desc.root:0 "Giữa những cuộc chiến, điều quan trọng là phải giữ kỹ năng luôn sắc bén.\n\nChính vì vậy mà ta có mặt ở bãi tập, tàn nhẫn đánh đập, vật lộn và quở trách binh lính trong trận giả thứ ba của ngày.\n\nHọ rên rỉ khi ta gọi họ tập hợp lại cho trận thứ tư. Cứ để họ rên rỉ — ta còn phải luyện tập."
  fp1_shieldmaiden.0032.desc.courtier:0 "Nhìn [shieldmaiden.GetTitledFirstName] tập luyện luôn là một trải nghiệm. [shieldmaiden.GetSheHe|U] chiến đấu với sự hung dữ, sự giận dữ như vậy, đến nỗi dễ dàng quên mất [shieldmaiden.GetSheHe] chỉ đang tập dượt.\n\nThiết bị vỡ nát và những người lính bị bầm dập nằm la liệt trên sân. Một khoảng lặng trong hành động khiến một dàn đồng ca rên rỉ nhẹ nhõm vang lên từ những đối tác đấu tập yếu ớt của [shieldmaiden.GetHerHis].\n\nNhưng, gần như ngay lập tức, kỳ nghỉ kết thúc, và [shieldmaiden.GetFirstNameNoTooltip] lại bắt đầu."
  fp1_shieldmaiden.0032.a.root:0 "Tường khiên của ta là bất khả xâm phạm!"
  fp1_shieldmaiden.0032.a.courtier:0 "Xem cách [shieldmaiden.GetSheHe] chỉ huy tường khiên kìa!"
  fp1_shieldmaiden.0032.b.root:0 "Ta vung kiếm mạnh như [shieldmaiden.GetFaith.WarGodName]!"
  fp1_shieldmaiden.0032.b.courtier:0 "Hãy nhìn [shieldmaiden.GetHerHim] vung lưỡi kiếm của [shieldmaiden.GetHerHis]!"
  fp1_shieldmaiden.0032.c.root:0 "Ta nhìn thấy mọi điểm yếu của kẻ thù!"
  fp1_shieldmaiden.0032.c.courtier:0 "[shieldmaiden.GetSheHe|U] luôn tìm ra được sơ hở!"
