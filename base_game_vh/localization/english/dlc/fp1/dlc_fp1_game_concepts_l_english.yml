l_english:
  game_concept_designate_chief_sacrifice:0 "Chỉ Định Vật Tế Chính"
  game_concept_designate_chief_sacrifice_article:0 "Chỉ Định một Vật Tế Chính"
  game_concept_designate_chief_sacrifice_chief_sacrifice:0 "Vật Tế Chính"
  game_concept_designate_chief_sacrifice_desc:0 "Khi tổ chức một lễ hiến tế lớn, [characters|E] có thể chỉ định một trong những [prisoners|E] của mình làm vật tế chính. $game_concept_prisoner$ này sẽ bị xử tử đầu tiên và có thể khiến nhân vật thực hiện hiến tế nhận thêm [piety|E].\n\nNhững vật tế được ưu tiên bao gồm:\n$EFFECT_LIST_BULLET$ $game_concept_characters$ không có lãnh địa có [faith|E] thuộc dạng [faith_hostile|L] hoặc [faith_evil|L]\n$EFFECT_LIST_BULLET$ [landed|E] $game_concept_characters$ có cấp bậc tối thiểu là [count|E]-[rank|E]\n$EFFECT_LIST_BULLET$ [heads_of_faith|E] (dù điều này có thể gây ra hậu quả)"
  game_concept_varangian_adventure:0 "Cuộc Phiêu Lưu Varangian"
  game_concept_varangian_adventures:0 "Các Cuộc Phiêu Lưu Varangian"
  game_concept_varangian_adventuring:0 "Phiêu Lưu"
  game_concept_varangian_adventure_adventure:0 "Cuộc Phiêu Lưu"
  game_concept_varangian_adventure_desc:0 "Đây là một loại [war|E] đặc biệt, trong đó kẻ tấn công dự định di dời toàn bộ [realm|E] của mình đến [war_target|E].\n\nNếu chiến thắng, họ sẽ ngay lập tức sáp nhập các [counties|E] tương ứng và chuyển [capital|E] đến đó. Các chư hầu cũ của họ sẽ trở nên độc lập, và các $game_concept_counties$ cũ sẽ được trao cho những thủ lĩnh địa phương mới nổi. $game_concept_varangian_adventures$ #EMP CHỈ#! dành cho các [duke|E] và $game_concept_count$-[title_tier|E] [rulers|E], và sẽ ngày càng tốn kém hơn sau mỗi $game_concept_varangian_adventure_adventure$ thành công.\n\n[casus_belli|E] này #EMP KHÔNG BAO GIỜ#! khả dụng sau [era|E] $culture_era_tribal$, và không thể sử dụng chống lại các [cultures|E] khác cũng có thể thực hiện $game_concept_varangian_adventure_adventure$ hoặc chống lại các $game_concept_rulers$ láng giềng .\n\n$north_germanic_group_collective_noun$ thực hiện $game_concept_varangian_adventure$ đầu tiên của mình sẽ nhận tối đa [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] [special_troops|E] bổ sung; số lượng tăng lên theo mỗi quận cùng [faith|E] và cùng [culture|E] mà họ hoàn toàn kiểm soát trong khu vực [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
  game_concept_trial_by_combat:0 "Phán Xử Bằng Đấu Tay Đôi"
  game_concept_trials_by_combat:0 "Các Cuộc Phán Xử Bằng Đấu Tay Đôi"
  game_concept_trial_by_combat_trial:0 "Thử Thách"
  game_concept_trial_by_combat_combat:0 "Đấu Tay Đôi"
  game_concept_trial_by_combat_desc:0 "Trong một số [cultures|E], những vấn đề không thể giải quyết bằng lời nói hay chiến tranh có thể được phân xử bằng một $game_concept_trial_by_combat$. Nếu được chấp thuận, hai [characters|E] sẽ tham gia một [single_combat_duel|E] để định đoạt kết quả đã định trước. Nếu bên bị cáo buộc chiến thắng, họ sẽ chứng minh được sự vô tội của mình.\n\nCác yêu cầu chung cho một $game_concept_trial_by_combat_trial$ bao gồm:\n$EFFECT_LIST_BULLET$ Cả hai phải thuộc một nền văn hóa hợp lệ.\n$EFFECT_LIST_BULLET$ Ngài phải có [imprisonment_reason|E] đối với họ (và lý do này sẽ bị tiêu hao).\n$EFFECT_LIST_BULLET$ Họ không được là [liege|E], [vassal|E], [guest|E] hoặc [courtier|E] của Ngài hay của bất kỳ $game_concept_vassals$ nào của Ngài.\n\n$game_concept_characters$ không đủ khả năng tự chiến đấu vẫn có thể bị thách đấu nếu họ là [rulers|E], bằng cách chỉ định một [knight|E] chiến đấu thay mặt.\n\nMột $game_concept_trial_by_combat_combat$ chỉ có thể lựa chọn chiến đấu đến [character_death_death|E] nếu bên nguyên cáo là [tribal|E] và cả hai $game_concept_characters$ đều trực tiếp tham gia $game_concept_single_combat_duel$; nếu bên bị cáo buộc phải chỉ định một người đại diện chiến đấu thay, thì $game_concept_character_death_death$ sẽ không phải là một lựa chọn."
