l_english:
  secure_high_kingdom_north_sea_decision:0 "Củng Cố Đại Vương Quốc Bắc Hải"
  secure_high_kingdom_north_sea_decision_desc:0 "Các vương quốc $k_england$, $k_denmark$, và $k_norway$ là một sự kết hợp tự nhiên. Giàu có, hiếu chiến, và gắn kết với nhau bởi thương mại cùng huyết thống quý tộc. Giá như có ai đó có thể vượt qua tính cục bộ của họ, gắn kết cả ba vĩnh viễn..."
  secure_high_kingdom_north_sea_decision_tooltip:1 "Hợp nhất $k_england$, $k_denmark$, và $k_norway$ thành một [de_jure|E] [realm|E]"
  secure_high_kingdom_north_sea_decision_confirm:0 "Trên hết, một Đại Vương!"
  secure_high_kingdom_north_sea_decision_solve_danelaw:0 "$k_danelaw$ hiện có các [de_jure|E] [counties|E], và $k_england$ phải được hợp nhất lại trước."
  secure_high_kingdom_north_sea_scripted_effect.daneland_reabsorbed.tt:0 "Tất cả [duchies|E] được [completely_controlled|E] của $k_daneland$ sẽ được [de_jure_drift_drifted|E] trở lại $k_england$"
  secure_high_kingdom_north_sea_scripted_effect: "Ngài nhận được một [strong_hook|E] #weak (Lòng Trung Thành)#! đối với các [powerful_vassals|E]"
  secure_high_kingdom_north_sea_custom_powerful_vassals: "Mọi [powerful_vassal|E]"
  secure_high_kingdom_denmark_held_years: "Đã nắm giữ [temp_scope.GetName] trong #V 10#! năm #weak (hiện tại: [SCOPE.ScriptValue('north_sea_held_value')|0V])#!"
  secure_high_kingdom_neustria: "Ngài nhận được [title|E] #V Vương quốc Neustria#!"
  secure_high_kingdom_custom_every_coastal: "Mọi [province|e] ven biển"
  north_sea_kingdom_coastal_modifier: "Hòa bình Phương Bắc (Pax Nordica)"

  found_capital_of_the_rus_decision:0 "Thành Lập Thủ Đô của Rus'"
  found_capital_of_the_rus_decision_desc:0 "Những người Norse đầy tham vọng tràn ra khỏi Scandinavia và xuôi theo những con sông trù phú của người Slav hiếu chiến ở phương đông. Dù vô số khu định cư và tiểu quốc — cả Slav lẫn Norse — đang tranh giành quyền lực, chỉ #EMP một#! kẻ có thể thực sự đại diện cho sự hợp nhất của hai dân tộc..."
  found_capital_of_the_rus_decision_tooltip:0 "Thiết lập kinh đô của Ngài thành mái nhà đích thực của toàn thể Rus'"
  found_capital_of_the_rus_decision_confirm:0 "Một kinh đô vĩ đại cho muôn đời!"
  found_capital_of_the_rus_decision_before_last_date:0 "Thời điểm là ngày 1.1.1100 hoặc sớm hơn"

  elevate_mann_and_the_isles_decision:0 "Nâng Tầm Vương Quốc Mann & the Isles"
  elevate_mann_and_the_isles_decision_desc:0 "$c_isle_of_man$ có vị trí độc đáo để trở thành nơi trú ẩn cho các toán cướp biển Norse, với lối tiếp cận thuận tiện không chỉ tới Quần đảo Anh mà còn toàn bộ Tây Âu.\n\nChỉ cần một người chỉ lối cho mọi chiến binh Viking chân chính, để khai mở tiềm năng của nó và dát vàng cùng sắt lên hòn đảo này!"
  elevate_mann_and_the_isles_decision_tooltip:0 "Trở thành vị quân chủ hải tặc khét tiếng nhất mọi thời đại"
  elevate_mann_and_the_isles_decision_confirm:0 "Vì tai tiếng và sự bất tử!"

  hold_gruesome_festival_decision_blot_name:0 "Tổ Chức Đại Blót"
  hold_gruesome_festival_decision_fallback_name:0 "Tổ Chức Đại Tế Lễ"
  hold_gruesome_festival_decision_desc.gf_humsac_practitioner:0 "Đã đến lúc toàn thể [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] tụ họp để hiến tế lên [ROOT.Char.GetFaith.PantheonTerm]. Những nghi lễ này không chỉ gắn kết tín đồ, mà còn khẳng định vị thế của ta là [ROOT.Char.GetTitleAsNameNoTooltip] của toàn cõi."
  hold_gruesome_festival_decision_desc.non_gf_practioner:0 "Trong thần dân của ta có những kẻ thực hành các nghi lễ hiến tế lớn lao được chúc phúc bởi [GetPlayer.GetTitleAsNameNoTooltip]. Đồng ý tổ chức dù chỉ một biến thể hạn chế chắc chắn sẽ giành được thiện cảm của họ, nhưng chấp nhận những phong tục... man rợ hơn có thể khiến ta bị những kẻ khinh miệt họ coi thường."
  hold_gruesome_festival_decision_tt:1 "Ngài tổ chức một [Select_CString( Character.IsLocalPlayer, GetPlayer.Custom('GruesomeFestivalName') , '$gruesomefestivalname_festival|q$' )] long trọng, bao gồm:\n#indent_newline:0 $EFFECT_LIST_BULLET$ Quyết định quy mô lễ hội\n#indent_newline:0 $EFFECT_LIST_BULLET$ Lựa chọn vật hiến tế, thậm chí chọn một trong các [prisoners|E] làm [designate_chief_sacrifice_chief_sacrifice|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ Nhận hoặc mất [county_opinion|E] và [opinion|E] của [character|E] tùy theo [core_tenets|E] trong [faith|E] của thần dân"
  hold_gruesome_festival_decision_tt.piety_gain:0 "#indent_newline:0 Nhận [piety|E], vì Ngài là tín đồ của [GetPlayer.GetFaith.GetAdherentName]"
  hold_gruesome_festival_decision_tt.piety_lose:0 "#indent_newline:0 #EMP Mất#! [piety|E], vì Ngài là tín đồ của [GetPlayer.GetFaith.GetAdherentName]"
  hold_gruesome_festival_decision_tooltip:0 "Mời thần dân tham dự một nghi lễ linh thiêng và tốn kém"
  hold_gruesome_festival_decision_confirm:0 "Trong cái chết, tái sinh."

  raise_stele_decision_name:0 "Dựng Đá Rune"
  raise_stele_decision_desc:0 "Theo phong tục của người [GetPlayer.GetCulture.GetNameNoTooltip], việc dựng bia đá chạm khắc để kỷ niệm các sự kiện quan trọng là điều quen thuộc — cái chết của người thân, giải quyết tranh chấp, giành được đất đai, v.v. Có lẽ ta cũng có thể hưởng lợi từ một tảng đá như vậy..."
  raise_stele_decision_tt.effects_list:0 "Một trong các [counties|E] của Ngài sẽ nhận một trong các [modifiers|E] sau:\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_ancestors_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_conquest_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_promotion_strong').GetNameWithTooltip]"
  raise_stele_decision_tt.variable_strength:0 "Tất cả modifier sẽ mạnh hơn nếu được dựng tại các [cultures|E] sử dụng đá rune"
  raise_stele_decision_tooltip:0 "Trả tiền để chạm khắc một bia rune tại một quận của Ngài"
  raise_stele_decision_confirm:0 "Nhưng sẽ khắc điều gì?"
  fp1_raise_runestone_vassals:0 "$EFFECT_LIST_BULLET$Tất cả [direct_vassals|E] cũng sử dụng đá rune"

  raise_stele_decision_ancestor:0 "Ngài có một tổ tiên vừa qua đời gần đây"
  raise_stele_decision_victory:0 "Ngài vừa chinh phục lãnh thổ"
  raise_stele_decision_rank:0 "Ngài vừa đạt được cấp bậc mới"

  forge_the_jomsvikings_decision:0 "Thành Lập Jomsvikings"
  forge_the_jomsvikings_decision_desc:0 "Cổ Đạo đang lụi tàn. Mỗi ngày, những kẻ theo Abraham lôi kéo dân chúng của ta bằng lời hứa về sự sống vĩnh hằng cho tất cả; các nhà phiêu lưu và thực dân của ta tiếp nhận thần linh ngoại quốc ở bất cứ nơi nào họ đặt chân; thậm chí những kẻ cải cách trong lòng Scandinavia cũng muốn biến chúng ta giống các dân tộc của Thập Tự và Trăng Lưỡi Liềm.\n\nKhông còn nữa. Tất cả tín đồ trung thành của [GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip] phải đoàn kết, để bảo vệ trước thay đổi và báng bổ!"
  forge_the_jomsvikings_decision.tt.is_in_correct_region:0 "Nằm trong [GetGeographicalRegion('dlc_fp1_region_non_scandinavian_southern_baltic').GetName] [region|E]"
  forge_the_jomsvikings_decision.tt.empty_castle_or_city:1 "Phải có ít nhất một [castle|E] hoặc [city|E] trống, ngoài [county_capital|E]"
  forge_the_jomsvikings_decision_tooltip:0 "Thành lập một hội Vikingr sùng đạo để bảo vệ Cổ Đạo"
  forge_the_jomsvikings_decision_confirm:0 "Valhalla chỉ dành cho kẻ xứng đáng!"
  fp1_valid_norse_faith_for_jomsvikings_trigger_tt:0 "[THIS.Char.GetFaith.GetName] thuộc [religion|E] [GetReligionByKey('germanic_religion').GetAdjective] và chưa được cải cách"
