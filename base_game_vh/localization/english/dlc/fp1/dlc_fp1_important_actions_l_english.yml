l_english:
  action_can_challenge_to_single_combat:0 "Tội Phạm Ở Xa Có Thể Bị Thách Đấu"
  action_can_challenge_to_single_combat_label:0 "Ngài có thể thách đấu [recipient.GetShortUINameNoTooltip] bằng $game_concept_trial_by_combat$"
  action_can_challenge_to_single_combat_combined_label:0 "[recipient.GetShortUINameNoTooltip]"
  action_can_challenge_to_single_combat_desc:1 "[recipient.GetUIName] đã phạm [crimes|E] chống lại Ngài ([recipient.GetImprisonmentReasons( actor.Self )]), nhưng không thể bị [imprisoned|E], cho phép Ngài thách đấu [recipient.GetHerHim] trong một [trial_by_combat|E].$action_can_challenge_to_single_combat_HELP$"
  action_can_challenge_to_single_combat_click:0 "#I Nhấp để thách đấu [recipient.GetHerHim]#!"
  action_can_challenge_to_single_combat_combined_group_label:0 "Có thể thách đấu tội phạm bằng $game_concept_trial_by_combat$"
  action_can_challenge_to_single_combat_combined_group_name:0 "Có thể thách đấu tội phạm bằng $game_concept_trial_by_combat$"
  action_can_challenge_to_single_combat_combined_group_description:1 "Những [characters|E] khác đã phạm [crimes|E] chống lại Ngài ([recipient.GetImprisonmentReasons( actor.Self )]), nhưng không thể bị [imprisoned|E], cho phép Ngài thách đấu họ trong các [trials_by_combat|E].$action_can_challenge_to_single_combat_HELP$"
  action_can_challenge_to_single_combat_combined_unimportant:0 "@warning_icon! #X Không có tội phạm nào quan trọng với Ngài#!"
  action_can_challenge_to_single_combat_unimportant:0 "@warning_icon! #X [recipient.GetSheHe|U] không quan trọng với Ngài#!"
  action_can_challenge_to_single_combat_HELP:0 "\n\n#help Là một [ruler|E], Ngài không bắt buộc phải thách đấu mọi [criminal|E], và đôi khi sẽ có lợi hơn nếu chờ cơ hội để [imprison|E] họ. Hãy cẩn trọng khi thách đấu những $game_concept_characters$ có [prowess|E] cao, vì mọi [trials_by_combat|E] đều được chiến đấu dưới dạng [single_combat_fight_plural|E].#!"
 
  action_can_make_shieldmaiden:0 "Có Thể Phong Làm Shieldmaiden"
  action_can_make_shieldmaiden_label:0 "Ngài có thể phong [recipient.GetShortUINameNoTooltip] trở thành một [recipient.Custom('ShieldPersonFemaleMale')|U]"
  action_can_make_shieldmaiden_combined_label:0 "[recipient.GetShortUINameNoTooltip]"
  action_can_make_shieldmaiden_desc:0 "[recipient.GetUIName] có chỉ số [prowess|E] cao và sẽ chấp nhận trở thành một [recipient.Custom('ShieldPersonFemaleMale')|U].$action_can_make_shieldmaiden_HELP$"
  action_can_make_shieldmaiden_click:0 "#I Nhấp để phong làm [recipient.Custom('ShieldPersonFemaleMale')|U]#!"
  action_can_make_shieldmaiden_combined_group_label:0 "Có thể phong làm [recipient.Custom('ShieldPersonsFemaleMale')|U]"
  action_can_make_shieldmaiden_combined_group_name:0 "Có thể phong làm [recipient.Custom('ShieldPersonsFemaleMale')|U]"
  action_can_make_shieldmaiden_combined_group_description:0 "Một số [close_family|E] có chỉ số [prowess|E] cao và sẽ chấp nhận trở thành [recipient.Custom('ShieldPersonsFemaleMale')|U].$action_can_make_shieldmaiden_HELP$"
  action_can_make_shieldmaiden_HELP:1 "\n\n#help Sở hữu ít nhất một [recipient.Custom('ShieldPersonFemaleMale')|U] có thể rất có lợi. Họ sẽ liên tục cải thiện kỹ năng và thậm chí có thể cứu Ngài khỏi âm mưu [GetScheme('murder').GetTypeName] [scheme|E].\n\nTuy nhiên, Ngài không nên phong mọi [close_family|E] thành [recipient.Custom('ShieldPersonFemaleMale')|U], trừ khi Ngài có quá nhiều [prestige|E] không biết dùng vào đâu.#!"
