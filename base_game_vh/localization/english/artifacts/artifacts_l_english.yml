  artifact_seal_of_investiture: "$artifact_name_prefix$ $seal_of_investiture$"
  seal_of_investiture: "Ấn phong tước"
  artifact_seal_of_investiture_court: "$seal_of_investiture$"
  seal_of_investiture.desc: "[SCOPE.Custom('ArtifactArticleWealth')] [seal_of_investiture|E] với tay nghề chế tác [SCOPE.Custom('ArtifactQuality')]. Đây là một tấm [newly_created_artifact.GetFeatureText( 'decoration_material_slate' )] với mực [newly_created_artifact.GetFeatureText( 'decoration_material_ink' )].\n\nNó được chế tác theo lệnh của [tributary_scope.GetSuzerain.GetFullName] để ghi nhận sự trung thành của [tributary_scope.GetFullName], và được trao cho [tributary_scope.GetHerHim] trong nghi lễ bế mạc chuyến triều cống của [tributary_scope.GetHerHis] tới [tributary_scope.GetSuzerain.GetCapitalLocation.GetName]."
  feature_regalia_seal_slate: "một ấn hoàng gia bằng [Artifact.GetFeatureText( 'decoration_material_slate' )]"
  feature_regalia_seal_ink: "được thư pháp bằng mực [Artifact.GetFeatureText( 'decoration_material_ink' )]"

  heirloom_seal.name: "Ngọc Tỷ Gia Truyền"
  heirloom_seal.desc: "Ngọc tỷ cổ xưa này được chế tác từ ngọc bích, do Tần Thủy Hoàng tạo lập hơn nghìn năm trước sau khi thống nhất chư hầu Trung Hoa. Tương truyền, ngọc tỷ được tạc từ Hòa Thị Bích, một trong những bảo vật thiêng liêng bậc nhất từng tồn tại của hoàng triều.\n\nMinh văn khắc rằng: \"Phụng Thiên thừa vận, hoàng đế thọ mệnh vĩnh xương.\""

  artifact_seal_dynastic: "Đế Ấn"
  dynastic_imperial_seal.name: "Đế Ấn của [owner.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
  dynastic_imperial_seal.desc: "Đây là đế ấn của gia tộc [owner.GetDynasty.GetBaseNameNoTooltip] cùng quốc hiệu [owner.GetPrimaryTitle.GetBaseNameNoTooltip]. Vật này được chế tác theo chiếu chỉ của [owner.GetTitledFirstNamePossessiveNoTooltip], là một [newly_created_artifact.GetFeatureText( 'decoration_material_slate' )] được điểm xuyết bằng [newly_created_artifact.GetFeatureText( 'decoration_material_ink' )]. Đế ấn là một trong những chí bảo của quốc gia, đồng thời tượng trưng cho quyền uy của triều đại đương trị."


