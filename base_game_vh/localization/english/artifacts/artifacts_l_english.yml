 # FP3 artifacts
  artifact_oxus_bracelet_name: "Vòng Tay Oxus"
  artifact_oxus_bracelet_description: "Chiếc vòng tay với tay nghề chế tác tuyệt vời này được cho là xuất xứ từ vùng đất $k_transoxiana$. Dù lớp khảm men và đá bán quý đã thất lạc từ lâu, vàng vẫn giữ được độ sáng bóng. Những chiếc vòng như vậy từng là lễ vật danh dự tại triều đình của Vua của các vị Vua thời cổ đại, vì thế có lẽ nó từng được đeo bởi một đại lãnh chúa ở Babylon."
  fp3_incense_burner_sculpture: "Tượng Lư Đốt Hương"
  fp3_incense_burner_sculpture_desc: "Chiếc lư đốt hương hình loài mèo này phun làn khói thơm qua nhiều lỗ nhỏ trên thân. Phần đầu với đôi mắt nạm đá quý có bản lề, cho phép đặt hương đang cháy vào bên trong."
  fp3_ancient_drinking_vessel: "Chén Uống Thời Achaemenes"
  fp3_ancient_drinking_vessel_desc: "Chiếc chén cầu kỳ này kết thúc bằng hình dáng một con dê. Nó được chế tác từ thời đại đã bị lãng quên, nhưng vẻ đẹp thì chưa hề phai nhạt."
  artifact_sassanian_sword_name: "Kiếm Sassanian"
  artifact_sassanian_sword_description: "Được cho là tàn tích của thời kỳ Sassanian cổ xưa, thanh kiếm này $sassanian_sword_description_base$, khiến nó trở thành một cảnh tượng tráng lệ. Dù ngày nay nó quá mong manh để mang ra chiến trận, biết đâu thanh kiếm này từng nằm trong tay một vị anh hùng nay đã bị thời gian lãng quên?"
  artifact_sassanian_replica_sword_name: "Kiếm Phong Cách Sassanian"
  sassanian_sword_description_base: "được trang trí bằng nhiều loại đá quý và mang các hoa văn tinh xảo"
  famed_replica_sassanian_sword_description: "Thanh kiếm này được lấy cảm hứng từ viễn cảnh huy hoàng của một thời đại đã qua, gợi nhớ đến quá khứ anh hùng của tổ tiên người thợ rèn. Nó $sassanian_sword_description_base$, khiến nó trở thành một cảnh tượng tráng lệ. Khi cầm nó trong tay, người ta toát lên hình ảnh của những vị vua huyền thoại thuở xưa."
  masterwork_replica_sassanian_sword_description: "Thanh kiếm này rõ ràng được tạo ra để mô phỏng vũ khí của một thời đại cổ xưa, gợi nhớ đến quá khứ anh hùng của tổ tiên người thợ rèn. Nó $sassanian_sword_description_base$. Dù chỉ là tiếng vọng xa xôi của dĩ vãng, khi vung kiếm người ta vẫn có thể tưởng tượng mình là một lãnh chúa hùng mạnh của thời đã qua."
  common_replica_sassanian_sword_description: "Bản sao kém cỏi này là sự chế nhạo đối với dòng dõi của người thợ rèn. Nó được khảm bằng đá rẻ tiền và trang trí bằng những hoa văn thô ráp, lệch lạc. Mang nó lủng lẳng bên vỏ kiếm chỉ khiến người ta trông như một kẻ mê muội, khát khao quay về một thời đại đã vĩnh viễn lùi xa."

#CE1 Artifacts
  artifact_magnificent_crown_name: "Vương Miện Lộng Lẫy"
  artifact_magnificent_crown_description: "Những đường filigree tuyệt đẹp và hoa văn tinh xảo của chiếc vương miện này đều nhằm làm nổi bật lý do tồn tại thực sự của nó: các phù điêu khắc chìm ghi lại tổ tiên của [ROOT.Char.GetFirstNamePossessive], khơi dậy quyền uy của họ và đan xen nó với chính quyền lực của [ROOT.Char.GetHerHis]."
  artifact_splendid_necklace_name: "Vòng Cổ Lộng Lẫy"
  artifact_splendid_necklace_description: "Chiếc vòng cổ tinh xảo này được bao phủ bởi huy hiệu gia tộc [artifact.GetOwner.GetHouse.GetBaseName], không để lại bất kỳ nghi ngờ nào về tính chính danh của người sở hữu."
  artifact_fine_brooch_name: "Trâm Cài Tinh Xảo"
  artifact_fine_brooch_description: "Sự gợi nhắc tinh tế đến danh xưng của gia tộc [artifact.GetOwner.GetHouse.GetBaseName] dọc theo viền trâm cài khiến danh tiếng về tính chính danh của họ nhanh chóng lan rộng."

  medicine_jar: "Hũ Thuốc"
  medicine_jar_desc: "Chiếc hũ gốm tráng men mỏng này chứa các loại thảo dược hiếm và mạnh, khoáng chất chữa bệnh cùng nhiều bộ phận động vật phơi khô — tất cả đều được các thầy thuốc sử dụng khi điều trị bệnh tật và cân bằng thể dịch."
  whale_fat_candles_name: "Nến Mỡ Cá Voi"
  whale_fat_candles_description: "Những cây nến này được nấu chảy từ lớp mỡ của một con leviathan khủng khiếp. Chúng trông đầy đe dọa với những gai nhọn bằng mỡ cá voi."

  warenne_coin: "Đồng Xu Warenne"
  warenne_coin_description: "Đồng xu này mang phù hiệu bàn cờ xanh-vàng của triều đại Warenne ở mặt trước. Một vệt máu sẫm màu đánh dấu mép đồng xu."

  traitors_head: "Thủ Cấp Kẻ Phản Bội"
  traitors_head_description: "Một cái đầu bị chặt rời khỏi cơ thể chủ nhân một cách gọn gàng. Nó mang ý nghĩa của một thông điệp hơn là một kỷ vật."
 
  artifact_: "Di Vật Bị Phá Hủy"
  artifact_slot_untyped: "Di Vật Bị Phá Hủy             " # Yes the tabs are intended

  artifact_tale_of_genji: "Truyện Genji"
  artifact_tale_of_genji_description: "Được cho là lấy cảm hứng từ cuộc đời của Minamoto $TO_ru$, Truyện Genji là một tác phẩm mang phong cách tiểu thuyết do phu nhân Murasaki sáng tác. Tác phẩm kể về cuộc đời và các mối tình của Hoàng tử hư cấu Genji, con trai của Thiên hoàng."
  artifact_pillow_book: "Gối Thảo"
  artifact_pillow_book_description: "Được nữ thi sĩ kiêm cung nữ Sei Shōnagon viết như một cuốn nhật ký riêng, tác phẩm được gọi là Gối Thảo hé lộ những câu chuyện tán gẫu, tình ái và bi kịch thường nhật của giới quý tộc Nhật Bản."
