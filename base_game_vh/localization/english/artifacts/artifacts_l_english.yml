  jewelled_slippers:0 "Dép Nạm Ngọc"
  jewelled_slippers_description:0 "Một đôi dép tuyệt đẹp được nạm đầy đá quý. Có điều gì đó khi mang chúng khiến Ngài luôn cảm thấy mình sẽ tìm được đường về nhà."
  witchcraft_book:0 "Tập Sách Thảo Dược"
  witchcraft_book_description:0 "Một cuốn sách từng thuộc về Phù Thủy xứ [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier]. Các trang sách chứa đầy những phương thuốc thảo dược đơn giản nhằm cân bằng thể dịch."
  witchy_holy_text_mid:0 "[witch_scope.GetFaith.ReligiousText|U] Đính Ngọc"
  witchy_holy_text_mid_description:0 "Một bản [witch_scope.GetFaith.ReligiousText|U] được trang trí bằng đá quý khảm."
  immaculate_witchy_bones:0 "Xương Phù Thủy Vẹn Nguyên"
  immaculate_witchy_bones_description:0 "Một đống xương từng thuộc về Phù Thủy xứ [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier]. Ngay cả sau khi [witch_scope.GetHerHis] bị thiêu sống, những khúc xương vẫn còn nguyên vẹn."
  mysterious_lamp:0 "Đèn Bí Ẩn"
  mysterious_lamp_description:0 "Một chiếc đèn vàng rực rỡ, khảm đầy châu báu. Khi cầm nó, Ngài cảm nhận được một sức mạnh vũ trụ phi thường."
  mysterious_puzzle:0 "Khối Đố Bí Ẩn"
  mysterious_puzzle_description:0 "Một khối đố vàng xa hoa, phủ đầy những dòng khắc bằng ngôn ngữ xa lạ. Người ta nói nó từng thuộc về một bậc thầy trò chơi quyền năng."
  lunchbox:0 "Hộp Bảo Quản"
  lunchbox_description:0 "Một chiếc hộp được niêm kín chặt chẽ, dường như kéo dài thời gian thực phẩm bên trong còn dùng được."

