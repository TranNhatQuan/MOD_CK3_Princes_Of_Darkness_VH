  tiny_sculpture_trinket_name:0 "Tượng Nhỏ"
  tiny_sculpture_trinket_description:1 "Một bức tượng tí hon của [statue_owner.GetTitledFirstNameNoTooltip]. Vừa túi áo, sẵn sàng cai trị. Chế tác bởi [inspiration_owner.GetTitledFirstNameNoTooltip]."
  tiny_box_trinket_name:0 "Hộp Nhỏ"
  tiny_box_trinket_description:0 "Một chiếc hộp nhỏ bé nhưng đầy bí ẩn. Có lẽ khi mở ra, nó sẽ giải phóng một tội lỗi duy nhất lên thế gian. Chế tác bởi [inspiration_owner.GetTitledFirstNameNoTooltip]."
  tiny_chest_trinket_name:0 "Rương Nhỏ"
  tiny_chest_trinket_description:0 "Một chiếc rương khóa bé xíu, chỉ bằng ngón tay cái. Khi lắc lên, nó phát ra tiếng lạo xạo, để lộ rằng bên trong có vật gì đó. Chế tác bởi [inspiration_owner.GetTitledFirstNameNoTooltip]."
  tiny_cabinet_trinket_name:0 "Tủ Nhỏ"
  tiny_cabinet_trinket_description:0 "Một chiếc tủ nhỏ đến mức có lẽ nên cất nó trong một chiếc tủ khác để tránh bị giẫm phải. Chế tác bởi [inspiration_owner.GetTitledFirstNameNoTooltip]."
  tiny_throne_trinket_name:0 "Ngai Nhỏ"
  tiny_throne_trinket_description:0 "Một chiếc ngai phù hợp cho chuột hoặc loài gặm nhấm khác ngồi trị vì. Chế tác bởi [inspiration_owner.GetTitledFirstNameNoTooltip]."


#fund_inspiration.6301 same sex love poems
  prince_archivist_love_poem_name:0 "Ta Là Trăng, Người Là Mặt Trời"
  prince_archivist_love_poem_description:0 "Một khúc tình ca về hai người đàn ông yêu nhau — một vương tử và một viên lưu trữ, cùng ngắm sao trên đỉnh tháp, tránh xa những ánh mắt dòm ngó và hòa mình giữa các vì tinh tú. Lời đồn cho rằng nhân vật người lưu trữ được xây dựng từ chính trải nghiệm của tác giả [inspiration_owner.GetTitledFirstNamePossessiveNoTooltip]."
  witch_queen_love_poem_name:0 "Trái Tim Được Giải Thoát"
  witch_queen_love_poem_description:0 "Một bài thơ kể về hai người phụ nữ yêu nhau — một phù thủy và một nữ vương lạc bước trong khu rừng gần căn nhà gỗ của phù thủy. Cả hai tìm thấy sự an ủi trong khoảnh khắc rời xa xã hội. Những lời thì thầm cho rằng hình ảnh phù thủy là bức tự họa của tác giả [inspiration_owner.GetTitledFirstNameNoTooltip]."

