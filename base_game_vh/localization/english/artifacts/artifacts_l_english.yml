  artifact_armor_mail_description:2 "Dù các mắt xích không cho phép nhiều không gian trang trí, nhưng tay nghề tán đinh đạt mức [SCOPE.Custom('ArtifactQuality')] đã khiến bộ giáp này vượt trội so với giáp xích thông thường"
  artifact_armor_plate_description:2 "Bộ giáp được cấu thành từ các tấm [newly_created_artifact.GetFeatureText( 'armor_material' )] lớn, được rèn [SCOPE.Custom('ArtifactAdverbQuality')] nhằm bao phủ hoàn toàn người mặc"
  artifact_armor_scale_description:2 "Bộ giáp được cấu thành từ các vảy [newly_created_artifact.GetFeatureText( 'armor_material' )] được chế tác [SCOPE.Custom('ArtifactAdverbQuality')], gắn trên lớp nền bằng da"
  artifact_armor_lamellar_description:2 "Bộ giáp này được chế tạo từ những tấm giáp bằng [newly_created_artifact.GetFeatureText( 'armor_material' )] được liên kết chắc chắn với nhau bằng các sợi dây làm từ vải [newly_created_artifact.GetFeatureText( 'generic_material_cordage' )], trong khi phần viền và lớp lót được cắt may từ loại vải [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] tinh xảo."
  artifact_armor_laminar_description:2 "Bộ giáp được cấu thành từ các dải [newly_created_artifact.GetFeatureText( 'armor_material' )] xếp chồng theo phương ngang, được buộc [SCOPE.Custom('ArtifactAdverbQuality')] bằng dây [newly_created_artifact.GetFeatureText( 'generic_material_cordage' )], trong khi viền và lớp lót được cắt từ [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] thượng hạng"
  artifact_armor_brigandine_description:2 "Lớp [newly_created_artifact.GetFeatureText( 'armor_material' )] của bộ giáp được lót bên trong bằng các tấm thép hình bầu dục theo kỹ thuật [SCOPE.Custom('ArtifactAdverbQuality')], và phủ bên ngoài bằng lớp [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )]"
  artifact_armor_fallback_description:2 "[SCOPE.Custom('ArtifactDecorationArmor')]."

  create_artifact_armor_tooltip:1 "[inspiration_owner.GetShortUIName] đã chế tác [SCOPE.Custom('ArtifactArmorTypeLowercase')] với trình độ tay nghề [SCOPE.Custom('ArtifactQuality')]"

