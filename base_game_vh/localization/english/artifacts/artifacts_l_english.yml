  blooded_blade:0 "Lưỡi Kiếm Nhuốm Máu"
  blooded_blade_description:0 "Những hoa văn xoáy, gồ ghề trên vũ khí này là dấu hiệu tinh tế cho thấy độ giòn tương đối của lưỡi kiếm, đồng thời phản ánh nguồn gốc của nó: một vũ khí được Ta trong máu của [ROOT.Char.GetTitledFirstName]."
  sullied_blooded_blade:0 "Lưỡi Kiếm Vấy Bẩn"
  sullied_blooded_blade_description:0 "Những hoa văn xoáy, gồ ghề trên vũ khí này là dấu hiệu tinh tế cho thấy chất lượng tổng thể kém cỏi của lưỡi kiếm, đồng thời phản ánh nguồn gốc của nó: một vũ khí được Ta trong máu của [ROOT.Char.GetTitledFirstName]."

  fake_papal_tiara_name:0 "Vương Miện Giáo Hoàng Giả"
  fake_papal_tiara_description:0 "Một bản sao đồ sộ của mũ giáo hoàng, có lẽ không chịu được việc quan sát kỹ lưỡng. Dù sao thì… cũng chỉ để vui thôi, phải không?"

  artisanal_sword:0 "Thanh Kiếm của [ROOT.Char.GetFirstNamePossessive]"
  artisanal_sword_description:0 "Một thanh kiếm được chế tác tuyệt mỹ, chuôi kiếm nạm đá quý hài hòa với phần tay cầm vừa đẹp mắt vừa chắc chắn. Lưỡi kiếm mang hoa văn tinh xảo, cân bằng hoàn hảo, với mũi kiếm thuôn dần đến một điểm xuyên phá sắc bén."
