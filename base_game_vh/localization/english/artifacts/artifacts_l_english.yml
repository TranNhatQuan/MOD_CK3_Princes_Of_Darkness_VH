# Additional Historical Artifacts
  artifact_pedestal_koh_i_noor_name:0 "Núi Ánh Sáng"
  artifact_pedestal_koh_i_noor_description:0 "Đây là một viên kim cương có kích thước và độ tinh khiết vô song. Người ta nói nó được khai quật tại các mỏ ở đông nam Ấn Độ, nhưng nguồn gốc thực sự của nó có lẽ không ai biết rõ."
  artifact_jewelled_danda_name:0 "Gậy Danda Gắn Ngọc"
  artifact_jewelled_danda_description:0 "Đây là một quyền trượng gắn đầy châu báu đến từ Ấn Độ, biểu tượng tối thượng của quyền lực hoàng gia và khả năng của quân vương trong việc trừng phạt thần dân."
  artifact_aruval_name:0 "Aruval Cổ Đại"
  artifact_aruval_description:0 "Thanh Aruval dài này được cho là cổ xưa đến mức chính Karuppu Sami từng cầm nó trong tay."
  artifact_khanda_name:0 "Khanda Nghi Lễ"
  artifact_khanda_description:0 "Thanh Khanda này được chế tạo cho nghi lễ chứ không phải chiến đấu, và qua nhiều thế hệ đã trở thành lời nhắc nhở về sự cần thiết phải chặt bỏ bức màn vô minh."
  artifact_makarakundala_name:0 "Makarakundala"
  artifact_makarakundala_description:0 "Đây là đôi hoa tai như những gì các vị thần mang, thậm chí có người còn cho rằng cặp này từng thuộc về các đấng thần linh."
  artifact_cintamani_name:0 "Đá Cintamani"
  artifact_cintamani_hindu_description:0 "Đây là một viên đá được cho là từng rơi xuống từ bầu trời. Một số người tin rằng nó từng thuộc về Vishnu hoặc Vua Naga, và rằng nó mang lại sự thịnh vượng cho chủ nhân."
  artifact_cintamani_buddhist_description:0 "Đây là một viên đá được cho là từng rơi xuống từ bầu trời. Có người nói nó từng nằm trong tay các Bồ Tát Avalokiteshvara và Ksitigarbha, và rằng nó có thể thực hiện những ước nguyện của người sở hữu."
  artifact_navaratna_name:0 "Navaratna"
  artifact_navaratna_description:0 "Một chuỗi gồm chín viên bảo thạch, với một viên hồng ngọc lớn ở trung tâm, tượng trưng cho chín vị thần thiên thể trong Ấn Độ giáo."
  artifact_shankha_conch_name:0 "Ốc Shankha"
  artifact_shankha_conch_description:0 "Biểu tượng của thần Vishnu, chiếc ốc Shankha cổ xưa này được dùng làm kèn trong các nghi lễ tôn giáo và được cho là biểu trưng của sự thịnh vượng và đức hạnh."
  artifact_pedestal_great_diamond_name:0 "Đại Kim Cương"
  artifact_pedestal_great_diamond_description:0 "Viên ngọc khổng lồ này được cho là từng trang trí cho một bức tượng trong đền thờ, trước khi bị một kẻ tham lam đánh cắp."
  al_taj_crown_name:0 "al-Taj al-Sharif"
  al_taj_crown_description:0 "'Vương Miện Tôn Kính' hay 'Khăn Quấn Tôn Vinh' là vương miện nghi lễ truyền thống của các Caliph Fatimid. Nó được gắn viên bảo thạch khổng lồ mang tên 'al-Yatima'."
  qadib_al_mulk_name:0 "Qadib al-Mulk"
  qadib_al_mulk_description:0 "Gậy nghi lễ của Caliphate Fatimid, được bọc vàng và đính ngọc trai cùng châu báu."
  ryukyu_shaku_name: "Shaku Tam Sơn"
  ryukyu_shaku_description: "Một thẻ hốt nghi lễ sơn mài, được tạc từ gỗ tuyết tùng linh thiêng nơi hải đảo, tượng trưng cho sự hợp nhất các thị tộc dưới một thiên mệnh duy nhất."
  ryukyu_crown_name: "Vương Miện Hải Long"
  ryukyu_crown_description: "Một bảo vật khảm san hô, trên đỉnh là hải long bằng vàng ôm giữ minh châu trí tuệ. Ánh huy của nó lan khắp trùng dương, như ngọn đuốc soi đường cho quyền uy và phồn thịnh."
  al_sayf_al_khass_name:0 "al-Sayf al-Khass"
  al_sayf_al_khass_description:0 "Thanh kiếm gắn ngọc này được cho là rèn từ một tia sét. Nó được cất trong một vỏ vàng khắc chữ và hiếm khi được rút ra do ý nghĩa nghi lễ đặc biệt trong Caliphate."
  al_dawat_name:0 "al-Dawat"
  al_dawat_description:0 "Đây là một lọ mực làm từ vàng và san hô. Trong thời gian dài, nó giữ một vai trò đặc biệt trong các nghi lễ của Caliphate."
  al_hafir_name:0 "al-Hafir"
  al_hafir_description:0 "Viên hồng ngọc đỏ này, được gọi là al-Hafir hay 'Móng Guốc', có chất lượng hiếm thấy trên đời. Nó được khâu vào một mảnh lụa, xung quanh là các thanh ngọc lục bảo tạo thành một vòng tròn. Theo truyền thống, nó được gắn trên khuôn mặt con ngựa của Caliph."
  artifact_wall_banner_thankfulness_name:0 "Biểu Ngữ Tri Ân"
  artifact_wall_banner_thankfulness_description:0 "Lá cờ lụa trắng này được khắc chữ vàng và quấn quanh một ngọn giáo vàng. Theo truyền thống, lá cờ này và người anh em của nó được mang trong các cuộc rước của Caliph."
  artifact_arms_of_alex_name:0 "Giáp của Alexander"
  artifact_arms_of_alex_description:0 "Bộ giáp vải lanh ghép lớp cổ xưa này được cho là từng thuộc về Alexander Đại đế. Dù không còn có thể mặc được, bản thân bộ giáp vẫn mang theo di sản của vị chinh phạt vĩ đại, nổi danh từ Địa Trung Hải đến tận rìa Ấn Độ."
  artifact_pedestal_al_jabal_name:0 "al-Jabal"
  artifact_pedestal_al_jabal_description:0 "Đây là một chiếc nhẫn được gắn viên hồng ngọc lớn mang tên al-Jabal, hay 'Ngọn Núi'. Viên đá có kích thước vô song, và người ta nói chính chiếc nhẫn này từng được các hoàng đế Sassanid của Ba Tư đeo."
  artifact_pedestal_al_yatima_name:0 "al-Yatima"
  artifact_pedestal_al_yatima_description:0 "Được biết đến với tên al-Yatima ('Kẻ Mồ Côi'), viên ngọc trai khổng lồ này được cho là không giống bất kỳ viên nào khác trên đời — một kẻ mồ côi giữa các dòng họ bảo thạch và ngọc trai."
  artifact_dagger_of_rostam_name:0 "Dao găm của Rostam"
  artifact_dagger_of_rostam_description:0 "Con dao găm tinh xảo này được cho là vũ khí Rostam đã dùng để giết Bạch Quỷ Daeva."
  artifact_spear_of_ascalon_name:0 "Ascalon"
  artifact_spear_of_ascalon_description:0 "Ngọn giáo cổ gãy này được cho là một phần của cây giáo mà Thánh George đã dùng để giết con rồng ở Beirut."
  artifact_zomorrodnegar_name:0 "Shamshir-e Zomorrodnegar"
  artifact_zomorrodnegar_description:0 "Thanh kiếm nạm ngọc lục bảo này được cho là lưỡi kiếm huyền thoại của vua Solomon, dùng để tiêu diệt ác quỷ Fulad-zereh."
  artifact_muhammads_epistles_name:0 "Thư của Muhammad"
  artifact_muhammads_epistles_description:1 "Bức thư này là một phần trong thư tín giữa Nhà Tiên Tri Muhammad và các vị cai trị của [newly_created_artifact.Custom('EpistleReciever')|U]."
  epistle_syria:0 "Syria"
  epistle_arabia:0 "các bộ tộc Ả Rập"
  epistle_persia:0 "Ba Tư"
  epistle_byzantium:0 "Đế quốc Đông La Mã"
  epistle_bahrain:0 "Bahrain"
  artifact_kaves_apron_name:0 "Tạp dề của Kave"
  artifact_kaves_apron_description:0 "Lá cờ rách nát này được cho là biểu ngữ huyền thoại mà người thợ rèn Ba Tư Kave đã làm từ chính chiếc tạp dề của mình để hiệu triệu dân chúng đứng lên chống lại kẻ bạo chúa."
  artifact_joyeuse_name:0 "Joyeuse"
  artifact_joyeuse_description:1 "Thanh kiếm của Charlemagne, được rèn để chứa Thánh Thương Longinus. Joyeuse vừa là biểu tượng của tinh thần hiệp sĩ, vừa là di sản hoàng quyền của đế chế Charlemagne."
  artifact_durendal_name:0 "Durendal"
  artifact_durendal_description:0 "Thanh kiếm ngắn và nặng này được cho là Durendal huyền thoại, được Roland giấu đi trong khoảnh khắc hấp hối nhằm không để nó rơi vào tay kẻ thù của vương triều."
  artifact_curtana_name:0 "Curtana"
  artifact_curtana_description:0 "Thanh kiếm này được cho là Curtana, Thanh Kiếm của Lòng Nhân Từ. Vũ khí huyền thoại từng được Tristan sử dụng để giao chiến với Morholt, và đó cũng là lý do vì sao mũi kiếm bị sứt — một mảnh đã gãy khi chém vào chiếc sọ dày của gã khổng lồ Ireland."
  artifact_ring_angelica_name:0 "Nhẫn của Angelica"
  artifact_ring_angelica_description:0 "Chiếc nhẫn được cho là chính vật Angelica từng đeo, nhân vật quen thuộc trong các câu chuyện về Roland và Charlemagne. Quyền năng của nó có lẽ đã phai nhạt, khi dường như không còn ban cho khả năng tàng hình nữa, nhưng nó vẫn là một biểu tượng lộng lẫy của vị công chúa đã thuộc về dĩ vãng."
  artifact_olifant_name:0 "Olifant"
  artifact_olifant_description:0 "Chiếc kèn bằng ngà voi lớn, được chạm khắc tinh xảo. Một số người tin rằng đây chính là chiếc kèn Roland đã dùng để gọi viện binh trước khi hy sinh trong trận Roncevaux."
  artifact_colada_name:0 "Colada"
  artifact_colada_description:0 "Được đồn đại là một trong những thanh kiếm của El Cid, lưỡi kiếm này là nguồn cảm hứng cho bất kỳ ai khao khát những đức hạnh hiệp sĩ của ông."
  artifact_aram_name:0 "Aram"
  artifact_aram_description:0 "Ngọn giáo cổ xưa, sẫm màu này đã chứng kiến vô số thế hệ đến rồi đi. Nó già đến mức nhiều người tin rằng đây chính là cây giáo huyền thoại Aram, được nhắc đến trong các câu chuyện về Jangar."
  artifact_ikenga_name:0 "Ikenga"
  artifact_ikenga_description:0 "Bức tượng nhỏ có sừng này được cho là mang lại thành công và chiến thắng cho người sở hữu."
  artifact_mmaagha_kamalu_name:0 "Mmaagha Kamalu"
  artifact_mmaagha_kamalu_description:0 "Đây là một thanh kiếm nghi lễ cổ xưa, được trang trí cầu kỳ. Người ta cho rằng nó từng thuộc về Kamalu, vị thần chiến tranh của người Igbo."
  artifact_bronze_head_name:0 "Đầu Tượng Đồng"
  artifact_bronze_head_description:0 "Bức đầu tượng bằng đồng mang phong cách hiện thực này khắc họa các đường nét của một vị quân vương đã qua đời từ lâu với độ chi tiết đáng kinh ngạc, trông giống một tác phẩm điêu khắc hơn là vật được đúc kim loại. Trên đầu có đội vương miện để thể hiện địa vị của nhân vật được khắc họa."
  artifact_crystal_carving_name:0 "Chạm Khắc Pha Lê"
  artifact_crystal_carving_description:0 "Khối pha lê đá trong suốt hình chữ nhật này gần như hoàn toàn tinh khiết, và phần lớn bề mặt được phủ kín bởi những hoa văn chạm khắc tinh vi. Đây là một vật phẩm cực kỳ mỹ lệ, dù công dụng của nó không mấy rõ ràng."
  artifact_ibeji_name:0 "Ibeji"
  artifact_ibeji_description:0 "Bức tượng gỗ nhỏ này mô tả một người song sinh đã qua đời, được tin rằng sẽ mang lại giàu sang và may mắn nếu được gia đình chăm sóc. Nó được trang trí với kiểu tóc cầu kỳ và khá cao."
  artifact_kantele_name:0 "Kantele Cổ Đại"
  artifact_kantele_description:0 "Nhạc cụ dây bằng gỗ này đã được truyền lại qua nhiều thế hệ. Có tin đồn cho rằng nó thậm chí có thể có niên đại từ thời của chính Väinämöinen."
  artifact_sledovik_name:0 "Sledovik"
  artifact_sledovik_description:0 "Tảng đá lớn này in đầy những dấu chân hằn sâu vào mặt đá. Trong nhiều năm, nó đã đóng vai trò như một bàn thờ, và các dấu chân được cho là do những bậc thánh nhân địa phương để lại."
  artifact_nagelring_name:0 "Nagelring"
  artifact_nagelring_description:0 "Theo truyền thống, thanh kiếm già nua này có liên hệ với nhân vật huyền thoại rất được yêu mến Dietrich von Bern. Mối liên hệ ấy đã mang lại cho nó danh tiếng vượt xa giá trị thực tế."
  artifact_kladenets_name:0 "Kladenets"
  artifact_kladenets_description:1 "Dù đã qua thời kỳ huy hoàng, thanh kiếm thép cổ này vẫn được cho là Kladenets huyền thoại — một thanh kiếm có thể tự vung chém. Trong tình trạng hiện tại, nó hầu như không dễ sử dụng, nhưng chỉ riêng sự hiện diện của nó cũng đủ khiến những ai tin vào nguồn gốc siêu nhiên phải kính nể."
  artifact_legbiter_name:0 "Legbiter"
  artifact_legbiter_description:0 "Thanh kiếm cực kỳ sắc bén với chuôi bằng ngà voi này được cho là từng thuộc về đại vương Magnus Olafsson của Na Uy."
  artifact_quernbiter_name:0 "Quern-Biter"
  artifact_quernbiter_description:0 "Thanh kiếm này từng được chính vua Haakon của Na Uy sử dụng, và khi đó người ta nói rằng nó sắc đến mức có thể chém xuyên cả cối xay đá."
  artifact_dragvandil_name:0 "Dragvandil"
  artifact_dragvandil_description:0 "Thanh kiếm được cho là từng thuộc về Egill Skallagrimsson — nông dân, thi sĩ và chiến binh — nhân vật nổi tiếng trong Saga của Egill."
  artifact_szczerbiec_name:0 "Szczerbiec"
  artifact_szczerbiec_description:1 "Được cho là do một thiên thần ban cho vua Boleslaw Dũng Cảm, thanh kiếm này được tin là vũ khí đã dùng để chém vào Cổng Vàng của Kyiv. Nó mang ý nghĩa biểu tượng vô cùng to lớn."
  artifact_chinese_caligraphy_name:1 "Thư Pháp Trung Hoa"
  artifact_chinese_caligraphy_description:0 "Mảnh giấy mỏng manh này được phủ kín những ký tự kỳ lạ nhưng đẹp đẽ và vô cùng chuẩn xác. Người ta nói rằng nó đến từ vùng đất Trung Hoa ở phương Đông xa xôi."
  artifact_ruyi_name:0 "Ruyi"
  artifact_ruyi_description:0 "Đây là một quyền trượng nhỏ bằng ngọc bích, được phủ kín các ký tự và hoa văn Trung Hoa."
  turquoise_throne_name:0 "Ngai Ngọc Lam"
  turquoise_throne_description:0 "Ngai vàng hoàng gia nạm ngọc này được chế tác theo hình mẫu ngai huyền thoại của các vị vua Ba Tư trong Shahnama. Khung gỗ mun được trang trí bằng vô số ngọc lam cùng các tấm vàng ròng tráng men sắc lam. Vẻ đẹp choáng ngợp ấy chỉ có thể đạt được nhờ những nghệ nhân bậc thầy nhất."
  peacock_throne_name:0 "Ngai Chim Công"
  peacock_throne_description:0 "Ngai vàng xa hoa này nhằm tái hiện ngai trị vì của Jamsheed. Người ta nói rằng các nghệ nhân từ khắp nơi trên thế giới đã cùng hội tụ để ghép vàng, bạc và hàng trăm viên đá quý thành chiếc ngai hiện diện trước mắt Ngài."
  artifact_banner_islam_name:0 "Thánh Kỳ của Muhammad"
  artifact_banner_islam_description:0 "Lá cờ này được cho là Thánh Kỳ của Muhammad, một thánh tích từ thời Nhà Tiên Tri và là biểu tượng của toàn bộ đức tin Hồi giáo."
  artifact_spear_of_the_prophet_name:0 "Thương của Nhà Tiên Tri"
  artifact_spear_of_the_prophet_description:0 "Được cho là cây thương của Muhammad, do vị vua Abyssinia tặng cho al-Zubayr bin al-Awwam."
  artifact_mantle_of_the_prophet_islam_name:0 "Áo Choàng của Nhà Tiên Tri"
  artifact_mantle_of_the_prophet_description:0 "Được truyền lại qua nhiều thế kỷ từ Caliph này sang Caliph khác, đây là áo choàng của Nhà Tiên Tri. Theo truyền thống, Caliph mặc nó trong các dịp lễ trọng, mang lại cho ông vẻ điềm tĩnh và uy nghi vượt trội."
  afarganyu_name:0 "Afarganyu"
  artifact_afarganyu_description:0 "Chiếc bình lớn này là nơi ngọn lửa thiêng — trung tâm của nhiều nghi lễ trong Hỏa giáo — được thắp lên. Một dòng khắc cổ cho biết danh tính người đã hiến tặng nó cho hàng giáo sĩ."
  siddhachakra_name:0 "Siddhachakra"
  artifact_siddhachakra_description:0 "Đây là một đồ hình huyền bí dùng trong việc thờ phụng của đạo Jain. Ở trung tâm là một đóa sen nở rộ, xung quanh là các vị thần trên từng cánh hoa, biểu tượng gắn liền với truyền thuyết về vua Shripala và hoàng hậu Mayanasundari."
  artifact_staff_kakusandha:0 "Gậy của Kakusandha"
  artifact_staff_kakusandha_desc:0 "Kakusandha, vị Phật đầu tiên của kiếp Kalpa hiện tại, sở hữu cây gậy này để xua đuổi thú dữ và làm chúng sinh nhỏ bé tránh xa, hầu không bị giẫm phải trên những bước chân du hành của các tăng sĩ."
  water_filter_konagamana:1 "Bộ Lọc Nước của Koṇāgamana"
  water_filter_konagamana_desc:0 "Koṇāgamana, vị Phật thứ hai của kiếp Kalpa hiện tại, mang theo bộ lọc nước này trên các hành trình của mình. Mảnh vải đơn sơ này vừa dùng để tạo nước uống an toàn, vừa bảo đảm rằng mọi sinh vật nhỏ bé đều được lọc ra một cách từ bi."
  robe_kassapa:2 "Mảnh Áo của Kassapa"
  robe_kassapa_desc:0 "Kassapa, vị Phật thứ ba của kiếp Kalpa hiện tại, đã mặc chiếc áo này trong phần lớn sinh hoạt hằng ngày. Đây là một mảnh vải thô ráp một cách kỳ lạ, nhưng được tôn kính đặc biệt như một trong số rất ít những vật dụng y phục của một vị Phật còn tồn tại."
 ##Trinket Generation
 #Bad/Trash
  gilded_rats_tail:0 "Đuôi Chuột Mạ Vàng"
  gilded_rats_tail.desc:0 "Trang sức của kẻ nghèo."
  quail_eggshell_gem:0 "“Viên Ngọc” Vỏ Trứng Cút"
  quail_eggshell_gem.desc:0 "Một mảnh vỏ trứng sặc sỡ giả làm đá quý."
  stained_glass_shard:0 "Mảnh Kính Màu “Thánh Hóa”"
  stained_glass_shard.desc:0 "Nó dường như bị nhuốm một màu đỏ máu kỳ lạ..."
  xylospongium:0 "Miếng Bọt Biển Gắn Trên Gậy"
  xylospongium.desc:1 "Nguồn gốc và công dụng không rõ ràng — nhưng nó tỏa ra một mùi khó chịu, thoang thoảng."
 #Common
  st_davids_morsel:1 "Mẩu Thánh Tích của Thánh David"
  st_davids_morsel.desc:0 "Trông giống như một miếng thịt khô. Tuổi đời và nguồn gốc không rõ ràng."
  platypus_figurine:0 "Tượng Động Vật"
  platypus_figurine.desc:0 "Con vật tí hon này có chiếc mỏ rộng, bộ lông bóng và chân chèo. Thật kỳ lạ."
  terracotta_toy_fowl:0 "Gà Đồ Chơi Bằng Đất Nung"
  terracotta_toy_fowl.desc:0 "Bề mặt mòn cũ kể lại câu chuyện về một món đồ chơi từng được yêu quý."
 #This one uses a scope local to the stewardship_general.2001-event
  stewardship_general.2001.artifact.potsherd_holy:0 "Mảnh Gốm"
  stewardship_general.2001.artifact.potsherd_holy.desc:0 "Một mảnh gốm cổ. Theo ghi nhận, nó có nguồn gốc từ thánh địa [trinket_holy_site.GetNameNoTierNoTooltip]."
  small_bell_beaker:0 "Cốc Chuông Nhỏ"
  small_bell_beaker.desc:0 "Một chiếc cốc chuông với hoa văn tinh xảo."
  serpentine_budai:0 "Tượng Bố Đại Bằng Đá Serpentine"
  serpentine_budai.desc:0 "Hình tượng tí hon của một người đàn ông mập mạp, cười lớn và hói đầu."
 #Uncommon
  mythical_creature_horn:0 "Sừng của [ROOT.Char.Custom('HornedMythicalCreature')|U]"
  mythical_creature_horn.desc:0 "Một cục sừng có hình dạng đáng ngờ, được cho là đến từ sinh vật thần thoại [ROOT.Char.Custom('HornedMythicalCreature')]."
  mythical_creature_figurine:0 "Tượng [ROOT.Char.Custom('TrinketLookAdjective')|U] của [ROOT.Char.Custom('RegionalMythicalCreature')]"
  mythical_creature_figurine.desc:1 "Bức tượng mô tả con [new_trinket.Custom('ArtifactAnimalAdjective')] [SCOPE.Custom('RegionalMythicalCreatureLower')] này trông có vẻ [ROOT.Char.Custom('TrinketLookAdverbFollowup')] [ROOT.Char.Custom('TrinketLookAdjective')], được nạm những viên đá quý nhỏ, rực rỡ có nguồn gốc từ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
  st_davids_taper:1 "Nến Thánh David"
  st_davids_taper.desc:1 "Trông như thể ai đó đã cố đốt nó ở cả hai đầu."
  jira_stick:0 "Vương Trượng Đá Cẩm Thạch của J'Ira"
  jira_stick.desc:0 "Dù đã qua nhiều lần sử dụng, đầu nhọn của nó vẫn đầy uy lực."
  lucky_coin:0 "Đồng Xu May Mắn của [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
  lucky_coin.desc:1 "Một đồng xu của người [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip], có nguồn gốc từ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nBề mặt từng được khắc dấu nay đã nhẵn mịn vì bị xoa và xoay liên tục."
  lavender_jade_pendant:0 "Mặt Dây Ngọc Phỉ Thúy Tím"
  lavender_jade_pendant.desc:0 "Những vân tím đậm trông vô cùng mê hoặc."
 #Rare
  sekhmet_ring:0 "Nhẫn Ấn Cổ"
  sekhmet_ring.desc:0 "Chiếc nhẫn vàng được khắc hình một con người đội một chiếc mũ trông kỳ lạ."
  scarab_brooch:0 "Trâm Bọ Hung Cổ"
  scarab_brooch.desc:0 "Một chiếc trâm tinh xảo hình bọ hung. Phần ngọc lục bảo nạm trên đó được cho là có tác dụng tốt cho sức khỏe."
 
 # Easter eggs
  easteregg_artifact_elisabeth_plush:0 "Cáo Nhồi Bông của Elisabeth"
  easteregg_artifact_elisabeth_plush_description:0 "Con cáo nhồi bông của Elisabeth là một món đồ chơi được vô cùng yêu quý và đã ở bên cô suốt phần lớn cuộc đời. Elisabeth thường được trông thấy đang trò chuyện với nó khi cô dệt nên những mật mã phức tạp cho bất kỳ ai thuê dịch vụ của mình. Nó mang lại sự an ủi và truyền cảm hứng để người sở hữu noi theo sự xảo quyệt của loài cáo."
  easteregg_artifact_nicks_redolence: "Hương Thơm Cuối Cùng"
  easteregg_artifact_nicks_redolence_description: "Một chiếc lọ nhỏ chứa một lượng — [ROOT.Char.Custom('GetComplexColor')] — hương thơm, đủ khiến cả quý ông lẫn quý bà phải ngây ngất khi ở gần. Một dòng khắc nhỏ trên nút chai ghi rằng #EMP “Và giờ đây, hồi kết đã cận kề...”#!"
  easteregg_artifact_chad_book:0 "Bản Aeneid Có Chú Giải"
  easteregg_artifact_chad_book_description:0 "Một bản sao Aeneid của Virgil được yêu thích và minh họa công phu, nhưng bị phủ kín bởi vô số ghi chép — có cái ngớ ngẩn, có cái sâu sắc."
  easteregg_artifact_chad_dagger:0 "Con Dao Găm"
  easteregg_artifact_chad_dagger_description:0 "Ánh thép của nó đã trở nên xỉn màu bởi những vết máu khô, dù vậy nó vẫn khát khao thêm nữa."
  easteregg_artifact_veronica_book:0 "Những Chiếc Nhẫn của Chúa Tể"
  easteregg_artifact_veronica_book_description:0 "Một sự ám chỉ được che giấu khéo léo, dưới hình thức một cuốn sách. Được viết bằng thứ tiếng Bồ Đào Nha tinh tuyển nhất."
  easteregg_artifact_map_lohmander: "Lộ Trình Cổ"
  easteregg_artifact_map_lohmander_description: "Cuốn sách nhỏ bọc da này chứa đựng những câu chuyện của một người chép sách Scandinavia và hành trình của ông từ phương Tây tới Ấn Độ. Nó mô tả các hiểm nguy, tuyến đường và những trang bị cần thiết — từ việc mang nước ở đâu cho tới khi nào cần loại giày phù hợp, v.v. Ngoài ra còn có rất nhiều thông tin về các món ăn hay điệu múa địa phương.\n\nBên trong còn có một số bản đồ được gấp lại, khắc họa tiểu lục địa cũng như nhiều vùng đất khác, kèm theo ghi chú về những miền xa xôi và tên gọi của chúng trong các thời đại đã qua."

  easteregg_artifact_jason_sword:0 "Thanh Gươm của Thánh Martin"
  easteregg_artifact_jason_sword_description:0 "Dọc theo rãnh sống lưỡi kiếm, ai đó đã cào một cách vụng về dòng chữ “Ta là Đấng Hiện Hữu”."

  child_toy_template_tt:0 "Phải là [child|E] mới có thể trang bị như một [inventory_artifact|E]"

 # Blessed Junk
  fp2_blessed_junk:0 "[ROOT.Char.Custom('TrinketLookAdjective')|U] $blessed_artifact_modifier$"
  fp2_blessed_junk_desc:0 "Một hiện vật [ROOT.Char.Custom('TrinketLookAdverbFollowup')] [ROOT.Char.Custom('TrinketLookAdjective')] nhưng ngoài ra thì hoàn toàn vô dụng. $blessed_artifact_modifier_desc$."
 
  local_artisan_modifier:0 "Nghệ Nhân Địa Phương"
  local_artisan_modifier_desc:0 "Nhân vật này là một nghệ nhân địa phương được một vị quý tộc thuyết phục phục vụ cho mình.\n#weak Bất kỳ [inspirations|E] nào họ tạo ra sẽ có chất lượng thấp hơn.#!"

