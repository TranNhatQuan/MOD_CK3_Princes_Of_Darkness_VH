  brooch_decoration_centerpiece:0 "Nó gồm [SCOPE.Custom('BroochDecorationCenterpiece')] được gắn trên một chốt cài bằng [ROOT.Char.Custom2_Flag('ArtifactMetalType', SCOPE.GetFlagName('fastener_metal'))]"
