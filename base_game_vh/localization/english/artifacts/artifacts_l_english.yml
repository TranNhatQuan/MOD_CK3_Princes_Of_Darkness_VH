 # yearly.4081
  translated_arabic_book_de_materia_medica_name:0 "#italic Về Dược Liệu#!"
  translated_arabic_book_de_materia_medica_desc:0 "Một bản minh họa của bộ dược thư năm tập của Dioscorides về công dụng y học của các loài thực vật, được viết tại Alexandria cổ đại $translated_arabic_book_shared_desc$"
  translated_arabic_book_on_ascensions_name:0 "#italic Về Các Cung Thiên#!"
  translated_arabic_book_on_ascensions_desc:0 "Một bản sao của luận thuyết thiên văn của Hypsicles về chuyển động của các cung hoàng đạo trên bầu trời, được viết tại Alexandria cổ đại và $translated_arabic_book_shared_desc$"
  translated_arabic_book_elements_name:0 "#italic Cơ Bản#!"
  translated_arabic_book_elements_desc:0 "Một bản sao bộ trước tác toán học mười ba tập của Euclid về hình học, logic và các chứng minh của chúng, được viết tại Alexandria cổ đại và $translated_arabic_book_shared_desc$"
  translated_arabic_book_on_the_soul_name:0 "#italic Về Linh Hồn#!"
  translated_arabic_book_on_the_soul_desc:0 "Một bản sao bộ luận thuyết tâm lý học ba tập của Aristotle về bản chất của linh hồn và những khuynh hướng của nó, $translated_arabic_book_shared_desc$"
  translated_arabic_book_thucydides_name:0 "#italic Lịch Sử Của Thucydides#!"
  translated_arabic_book_thucydides_desc:0 "Một bản sao tác phẩm cổ của Thucydides về Chiến tranh Peloponnesus giữa Athens và Sparta, $translated_arabic_book_shared_desc$"
  translated_arabic_book_plutarch_name:0 "#italic Danh Nhân Truyện Của Plutarch#!"
  translated_arabic_book_plutarch_desc:0 "Một bản sao các tiểu sử so sánh của Plutarch về những nhà lãnh đạo cổ đại nổi bật và phẩm hạnh đạo đức của họ, $translated_arabic_book_shared_desc$"
  translated_arabic_book_shared_desc:0 "được dịch sang tiếng Ả Rập từ nguyên bản tiếng Hy Lạp cho [ROOT.Char.GetTitledFirstNameNoTooltipRegnal]."
 
 # hold_court.4300
  dress_me_artifact_desc:0 "Một bộ y phục tuyệt mỹ được tạo ra bởi những thợ may lành nghề nhất, được [ROOT.Char.GetTitledFirstNameNoTooltipRegnal] đặt làm để gây ấn tượng với triều đình [ROOT.Char.GetHerHis] bằng vẻ lộng lẫy của nó."

 # martial_authority.4000-5
  improvised_halberd_desc:0 "Biến thể kích tạm bợ này được gắn một lưỡi câu, khiến nó trở thành vũ khí hữu dụng trong tình thế cấp bách."
  improvised_dagger_desc:0 "Con dao găm tạm thời này được tạo ra từ việc cải biến một công cụ nông nghiệp, vẫn giữ được sự tiện dụng và khả năng cắt gọt."
  improvised_billhook_desc:0 "Chiếc câu liêm một tay này vốn dùng để cắt cành bụi rậm. Dù chẳng xứng với một vị vua, lưỡi cong của nó lại tỏ ra hiệu quả đáng ngạc nhiên khi tìm kẽ hở trong giáp trụ."

