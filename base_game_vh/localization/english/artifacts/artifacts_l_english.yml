 ## fund_inspiration.6001-6006 trinkets from your adventurer
  morin_khuur_ornament_name:0 "Trang trí đầu ngựa Morin Khuur"
  morin_khuur_ornament_description:1 "Một đầu ngựa được chạm khắc từ xương ngựa, thường dùng để trang trí trên đỉnh đàn Morin Khuur. Được gửi tới [owner.GetTitledFirstNameNoTooltip] bởi [inspiration_owner.GetTitledFirstNameNoTooltip] trong chuyến phiêu lưu của [inspiration_owner.GetHerHis]."
  animal_ring_name:0 "Nhẫn hổ lòe loẹt"
  animal_ring_description:1 "Được nạm đầy đá quý và có quá nhiều màu sắc, chiếc nhẫn này có khả năng làm lóa mắt quần thần nhiều hơn là gây ấn tượng về gu thẩm mỹ. Được gửi tới [owner.GetTitledFirstNameNoTooltip] bởi [inspiration_owner.GetTitledFirstNameNoTooltip] trong chuyến phiêu lưu của [inspiration_owner.GetHerHis]."
  ostrich_shell_necklace_name:0 "Vòng cổ hạt vỏ trứng đà điểu"
  ostrich_shell_necklace_description:1 "Một món trang sức tinh xảo với sắc trắng rực rỡ. Được gửi tới [owner.GetTitledFirstNameNoTooltip] bởi [inspiration_owner.GetTitledFirstNameNoTooltip] trong chuyến phiêu lưu của [inspiration_owner.GetHerHis]."
  pilgrimage_figurine_name:0 "Tượng Thánh Vardan bằng xương mực"
  pilgrimage_figurine_description:1 "Một bức tượng Thánh Vardan Mamikonian, vị tướng Armenia đã bảo vệ quyền thực hành Kitô giáo của người Armenia trong trận Avarayr năm 451. Chiếc mũ của ông được tô điểm bằng các chi tiết đồng. Được gửi tới [owner.GetTitledFirstNameNoTooltip] bởi [inspiration_owner.GetTitledFirstNameNoTooltip] trong chuyến phiêu lưu của [inspiration_owner.GetHerHis]."
  saint_margaret_fingernails_name:0 "Móng tay của Thánh Margaret"
  saint_margaret_fingernails_description:1 "Thánh Margaret thành Antioch nổi danh vì đã giết rồng chỉ bằng gót giày của mình. Theo truyền thuyết, những mảnh móng tay cũ kỹ và ghê rợn này thuộc về bà. Được gửi tới [owner.GetTitledFirstNameNoTooltip] bởi [inspiration_owner.GetTitledFirstNameNoTooltip] trong chuyến phiêu lưu của [inspiration_owner.GetHerHis]."
  seahorse_brooch_name:0 "Trâm cài cá ngựa bằng vàng"
  seahorse_brooch_description:1 "Một chiếc trâm cài với các tua xích mảnh phía dưới hình cá ngựa, sinh vật có cả cánh lẫn đuôi cá. Được gửi tới [owner.GetTitledFirstNameNoTooltip] bởi [inspiration_owner.GetTitledFirstNameNoTooltip] trong chuyến phiêu lưu của [inspiration_owner.GetHerHis]."


 #fund_inspiration.6500- trinkets from your adventurer
  leopard_hat_name:0 "Mũ Báo"
  leopard_hat_description:0 "Một chiếc mũ làm từ đầu của một con báo, bị hạ bởi [inspiration_owner.GetTitledFirstName]."
  kurgan_ornament_name:0 "Tượng Báo Scythia"
  kurgan_ornament_description:0 "Một bức tượng đá được [inspiration_owner.GetTitledFirstName] cướp từ một gò mộ Kurgan cổ của người Scythia."
  kurgan_saddle_name:0 "Yên Ngựa từ Kurgan"
  kurgan_saddle_description:1 "Một chiếc yên ngựa do [inspiration_owner.GetTitledFirstName] lấy từ một gò mộ Scythia. Hơn một nghìn năm tuổi, nó được bảo quản nhờ không khí bị niêm phong trong lăng mộ, giữa thi thể của hàng chục con ngựa được ướp xác. Có lẽ chúng ta có thể học hỏi điều gì đó từ lối chiến đấu của những kỵ sĩ yên ngựa cổ đại."
  naked_tapestry_name:0 "Thảm Dệt Khỏa Thân"
  naked_tapestry_description:0 "Một bức họa khỏa thân của [inspiration_owner.GetTitledFirstName] tại một ốc đảo ven biển, tự phe phẩy [inspiration_owner.GetHerselfHimself] bằng một chiếc lá, thân thể lấp lánh những giọt nước trong veo."

  frogspawn_jar_name:0 "Lọ Trứng Ếch"
  frogspawn_jar_description:0 "Một chiếc lọ chứa đầy trứng ếch đang sánh động, cùng vài con nòng nọc vừa nở. Được [inspiration_owner.GetTitledFirstName] gửi cho [ROOT.Char.GetTitledFirstNameNoTooltip] như một minh chứng cho những nỗi kinh hoàng của thế giới hoang dã.\n\nNgọ nguậy!"
  beaver_book_name:1 "Cung Điện của Loài Hải Ly"
  beaver_book_description:0 "Một cuốn sách về kiến trúc và kỹ thuật xây dựng của loài hải ly, do [inspiration_owner.GetTitledFirstName] ghi chép kèm phác họa trong những chuyến du hành của [inspiration_owner.GetHerHis]."
  crocodile_tapestry_name:0 "Thảm Dệt Cá Sấu"
  crocodile_tapestry_description:0 "Một tấm thảm thêu hình một con cá sấu được tạo ra bằng tất cả khả năng tốt nhất của [inspiration_owner.GetTitledFirstNamePossessive]. Sinh vật này có màu đỏ rực, sở hữu nhiều lớp răng nanh, những mụn độc và một chiếc đuôi có gai. Nó được bao quanh bởi một ổ trứng khổng lồ trong một hang động phía sau thác nước."
  mountain_rock_name:0 "Tảng Đá Núi"
  mountain_rock_description:0 "Một tảng đá lớn, được [inspiration_owner.GetTitledFirstName] vất vả khuân vác suốt quãng đường dài từ [mountain_location.GetName] trở về."
 
 # Game start additional unique artifacts
  reichskrone_name:0 "Vương Miện Đế Chế"
  reichskrone_description:1 "Đây là biểu trưng cho chức vị Hoàng đế La Mã Thần thánh. Đảm bảo sẽ thu hút ánh nhìn của mọi Công tước đi ngang qua."
  nikephoros_crown_name:0 "Vương Miện của Nikephoros II Phokas"
  nikephoros_crown_description:2 "Đây là vương miện của một trong những chiến lược gia kiệt xuất nhất từng xuất hiện trong dòng dõi Đế quốc. Thất bại trong các cuộc chiến ở phương Tây, nhưng là kẻ chinh phục phương Đông."
  skull_cap_charlemagne_name:0 "Hộp Sọ của Charlemagne"
  skull_cap_charlemagne_description:0 "Đỉnh đầu của Charlemagne được lưu giữ trong chiếc hộp này. Có lẽ trí tuệ của ông sẽ truyền lại cho người sở hữu."
  papal_tiara_name:0 "Mũ Ba Tầng Giáo Hoàng"
  papal_tiara_description:1 "Chiếc mũ miện nạm ngọc với vương miện vàng, biểu trưng cho quyền lực Giáo hoàng. Nhưng chẳng phải nó sẽ rực rỡ nhất khi được đội trên đầu Ngài sao?"
  essen_crown_name:0 "Kinderkrone"
  essen_crown_description:1 "Có người nói đây là vương miện được chế tác cho lễ đăng quang của Otto III tại Essen, kẻ khác lại cho rằng nó dùng để đội lên tượng Đức Mẹ. Dù thế nào, nó cũng rất nhỏ — nhưng biết đâu Ngài vẫn có thể cố đội lên đầu."
  monomachus_crown_name:1 "Vương Miện Monomachus"
  monomachus_crown_description:1 "Một chiếc vương miện gồm các tấm vàng chạm khắc chân dung Constantine IX Monomachus, vợ ông là Zoe, em gái Theodora, cùng những hình tượng vũ công mang tính biểu trưng."
  edmund_head_name:1 "Thủ Cấp của Thánh Edmund"
  edmund_head_description:0 "Edmund được cho là đã định sẵn trở thành Thánh nhân ngay từ lúc chào đời. Truyền thuyết kể rằng ông là Vua Đông Anglia, đã tự nguyện hiến thân cho người Viking để cứu dân mình khỏi bị tàn sát."
  dhammapada_name:0 "Pháp Cú (Dhammapada)"
  dhammapada_description:1 "Một tuyển tập những lời dạy của Đức Phật, được chép và đóng thành bản thảo lá cọ tinh xảo."
  excalibur_name:0 "'Excalibur'"
  excalibur_description:0 "Không có vị quân chủ nào tại Britannia mà không tự nhận mình sở hữu Excalibur thật. Chiến tranh được tài trợ bằng việc bán Excalibur, và Ngài chỉ có thể cầu mong rằng khách khứa không bắt gặp một thanh khác đang được trưng bày."
  vinaya_pitaka_name:0 "Luật Tạng (Vinaya Pitaka)"
  vinaya_pitaka_description:0 "Một kinh điển Phật giáo thuộc ba tạng của Tam Tạng Pali. Văn bản này hướng dẫn các quy tắc và giới luật trong đời sống tu hành của tăng ni."
  sutta_pitaka_name:0 "Kinh Tạng (Sutta Pitaka)"
  sutta_pitaka_description:1 "Một kinh điển Phật giáo Theravada, dựa trên kỳ kết tập Phật pháp lần thứ nhất sau khi Đức Phật nhập diệt. Bao gồm nhiều bài thơ và bài giảng được cho là của Đức Phật và các đệ tử. Thuộc Tam Tạng Pali."
  abhidhamma_pitaka_name:0 "Luận Tạng (Abhidhamma Pitaka)"
  abhidhamma_pitaka_description:0 "Một công trình học thuật phân tích sâu giáo lý của Đức Phật. Thuộc Tam Tạng Pali."




