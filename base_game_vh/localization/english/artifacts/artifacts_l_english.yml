  artifact_pas_darmes_token:0 "Kỷ Vật Pas d'Armes"
  artifact_pas_darmes_token_name:0 "Kỷ vật của [owner.GetFirstNamePossessiveNoTooltip]"
  artifact_pas_darmes_token_description:0 "Một [owner.GetFullNamePossessive] [SCOPE.Custom('ArtifactQuality')] [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] [owner.Custom('GetTournamentFavor')] được trang trí bằng [newly_created_artifact.GetFeatureText( 'decoration_pattern' )], trao cho [winner.GetFullName] tại một pas d'armes ở [location.GetName]."
  artifact_pas_darmes_spurs:0 "Chiến Lợi Phẩm Pas d'Armes"
  artifact_pas_darmes_spurs_name:0 "Cựa của [owner.GetFirstNamePossessiveNoTooltip]"
  artifact_pas_darmes_spurs_description:0 "Một cặp cựa [SCOPE.Custom('ArtifactQuality')] làm từ [newly_created_artifact.GetFeatureText( 'generic_material_metal' )], thuộc về [owner.GetFullName], được trao cho [winner.GetFullName] tại một pas d'armes ở [location.GetName]."
  artifact_tournament_favor:0 "Tín Vật Giải Đấu"
  artifact_tournament_favor_name:0 "Tín vật của một [owner.GetLadyLord|U]"
  artifact_tournament_favor_description:0 "Một [SCOPE.Custom('ArtifactQuality')] [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] [owner.Custom('GetTournamentFavor')], được trang trí bằng [newly_created_artifact.GetFeatureText( 'decoration_pattern' )], do một người ngưỡng mộ trao tặng cho [recipient.GetFullName]."
 # BOWS
  artifact_longbow:0 "Cung Dài"
  artifact_longbow_name:0 "$artifact_name_prefix_owner_culture$ Cung Dài"
  artifact_longbow_description:1 "Một cây cung dài tự thân [SCOPE.Custom('ArtifactQuality')], được chạm khắc từ [newly_created_artifact.GetFeatureText( 'longbow_wood' )] với lớp gỗ dát đàn hồi và lõi gỗ cứng, căng dây bằng [newly_created_artifact.GetFeatureText( 'bow_string' )]. Cao hơn cả một người trưởng thành, rất ít cây cung có thể sánh được lực kéo của nó."
  artifact_composite:0 "Cung Phức Hợp"
  artifact_composite_name:0 "$artifact_name_prefix$ Cung Phức Hợp"
  artifact_composite_description:0 "Một cây cung phức hợp [SCOPE.Custom('ArtifactQuality')] làm từ [newly_created_artifact.GetFeatureText( 'composite_wood' )], được gia cường bằng sừng [newly_created_artifact.GetFeatureText( 'composite_horn' )] và gân, căng dây bằng [newly_created_artifact.GetFeatureText( 'bow_string' )]. Kích thước ngắn khiến nó đặc biệt phù hợp để bắn khi cưỡi ngựa."
  artifact_bow:0 "Cung"
  artifact_bow_name:0 "$artifact_name_prefix$ Cung"
  artifact_bow_description:1 "Một cây cung tự thân [SCOPE.Custom('ArtifactQuality')] làm từ [newly_created_artifact.GetFeatureText( 'bow_wood' )], căng dây bằng [newly_created_artifact.GetFeatureText( 'bow_string' )], hữu dụng cả trong săn bắn lẫn chiến tranh."
  artifact_crossbow:0 "Nỏ"
  artifact_crossbow_name:0 "$artifact_name_prefix$ Nỏ"
  artifact_crossbow_description:0 "Một cây nỏ [SCOPE.Custom('ArtifactQuality')] với báng làm từ [newly_created_artifact.GetFeatureText( 'bow_wood' )], cánh nỏ bằng gân. Vô cùng mạnh mẽ và có thể giữ ở trạng thái sẵn sàng, nhưng nạp lại chậm."
