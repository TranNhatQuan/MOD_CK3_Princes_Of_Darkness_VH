 artifact_wall_narwhal_horn:1 "Một chiếc sừng lớn, thẳng, trắng lấp lánh. Tương truyền được lấy từ xác của một con kỳ lân bị giết. Chiếc sừng được bảo quản [SCOPE.Custom('ArtifactAdverbQuality')] và gắn lên một giá đỡ [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] được trang trí [SCOPE.Custom('ArtifactAdverbWealth')]."
