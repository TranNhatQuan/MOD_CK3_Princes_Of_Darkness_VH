 artifact_pedestal_rock_name:0 "Thánh Thạch"
 artifact_pedestal_rock_description:0 "Một tảng đá hiếm lạ mà theo truyền thống được cho là rơi từ trên trời xuống và được [owner.GetCulture.GetNameNoTooltip] xem là linh thiêng."
 artifact_pedestal_pouch_name:0 "$artifact_name_prefix$ Túi"
 artifact_pedestal_pouch_description:0 "Một chiếc túi được trang trí công phu, hoàn hảo để đựng đá quý, thánh tích và những kho báu nhỏ."
 artifact_pedestal_scroll_name:0 "$artifact_name_prefix$ Luật"
 artifact_pedestal_scroll_description:0 "Một cuộn văn thư mang dáng vẻ trang trọng, chứa các đạo luật nền tảng của [owner.GetPrimaryTitle.GetNameNoTooltip] do [owner.GetTitledFirstNameNoTooltip] ban hành."
 artifact_pedestal_religious_head_letter_name:0 "Thư từ [compliment_receiver.GetTitledFirstNameNoTooltip]"
 artifact_pedestal_religious_head_letter_description:0 "Nội dung ghi: \"$learning_theology.3022.desc$\"\n\nBức thư được gửi cho [letter_receiver.GetTitledFirstName], và ký tên bởi [compliment_receiver.GetTitledFirstName]."

 artifact_pedestal_crucifix_name:0 "$artifact_name_prefix$ Thập Giá"
 artifact_pedestal_crucifix_description:0 "Một cây thập giá gỗ được chế tác tinh xảo — vẻ đau khổ trên gương mặt Chúa Kitô có thể khiến ngay cả kẻ tội lỗi cứng cỏi nhất cũng phải ăn năn."
 artifact_pedestal_cross_name:0 "$artifact_name_prefix$ Thánh Giá"
 artifact_pedestal_cross_description:0 "Một cây thánh giá được chế tác bậc thầy, làm bằng vàng và nạm đá quý."
 artifact_pedestal_human_skull_name:0 "Hộp Sọ của [killed.GetTitledFirstNamePossessiveNoTooltip]"
 artifact_pedestal_human_skull_description:0 "Một hộp sọ người sạch sẽ và được bảo quản hoàn hảo, từng thuộc về [killed.GetTitledFirstNameNoTooltip], bị giết bởi [owner.GetTitledFirstNameNoTooltip]."
 artifact_pedestal_human_skull_specific_description:0 "Một hộp sọ người sạch sẽ và được bảo quản hoàn hảo, từng thuộc về [killed.GetFullName]. Theo lời đồn."
 artifact_pedestal_skull_of_the_enemy_name:0 "Hộp Sọ Kẻ Bị Căm Ghét"
 artifact_pedestal_skull_of_the_enemy_description:0 "Một hộp sọ người sạch sẽ và được bảo quản hoàn hảo, từng thuộc về [rival.GetTitledFirstNameNoTooltip], bị lấy đi do những xúc phạm cá nhân nhằm vào [owner.GetTitledFirstNameNoTooltip]."
 artifact_pedestal_skull_of_the_apostate_name:0 "Hộp Sọ Kẻ Bội Đạo"
 artifact_pedestal_skull_of_the_apostate_description:0 "Một hộp sọ người sạch sẽ và được bảo quản hoàn hảo, từng thuộc về [rival.GetTitledFirstNameNoTooltip], bị lấy đi vì sống trái với các giá trị của [owner.GetFaith.GetName]."
