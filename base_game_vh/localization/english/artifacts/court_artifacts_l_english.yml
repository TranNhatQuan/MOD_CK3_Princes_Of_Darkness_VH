  artifact_pedestal_massive_diamond_name:1 "Kim cương của [owner.GetTitledFirstNameNoTooltip]"
  artifact_pedestal_massive_diamond:0 "Một viên kim cương khổng lồ, sáng bóng và được mài giũa, độc nhất vô nhị về kích thước và độ tinh khiết."
  artifact_pedestal_crown_justinian_name:0 "Vương miện của Justinianus"
  artifact_pedestal_crown_justinian:1 "Đây là vương miện cổ xưa của Hoàng đế Justinianus: làm bằng vàng và nạm đá quý, nó vẫn mang trong mình toàn bộ uy quyền và tri thức của vị quân vương huy hoàng."
  artifact_pedestal_menorah_name:0 "Đèn Menorah của Jerusalem"
  artifact_pedestal_menorah_description:0 "Chiếc đèn Menorah — rất có thể — là bản gốc của Đền thờ Jerusalem."
  artifact_pedestal_gold_nugget_name:0 "Cục vàng phi thường"
  artifact_pedestal_gold_nugget:0 "Một cục vàng khổng lồ — kích thước vô song của nó hẳn là dấu hiệu của ân huệ thần linh."
  artifact_pedestal_jamshid_name:1 "Chén của Jamshid"
  artifact_pedestal_cup_jamshid:1 "Đây là chiếc Chén huyền thoại của Jamshid: từng được các bậc quân vương cổ đại Ba Tư sở hữu trong thời gian dài, nó được dùng để tiên tri và chứa đựng linh dược trường sinh."
  artifact_pedestal_spear_destiny_name:1 "Ngọn Giáo Định Mệnh"
  artifact_pedestal_spear_destiny:1 "Đây là mũi của một cây giáo cổ, được cho là đã bị một binh sĩ La Mã dùng để đâm vào sườn của Chúa Jesus trên thập giá."
  artifact_pedestal_david_harp_name:0 "Đàn hạc của David"
  artifact_pedestal_david_harp:1 "Đây là một cây đàn hạc gỗ cổ xưa. Người ta đồn rằng nó từng thuộc về Vua David và mang những năng lực chữa lành huyền bí."
  artifact_pedestal_branch_name:1 "Cành của [SCOPE.Custom('BranchTree')]"
  artifact_pedestal_branch_description:0 "Một cành cây trông rất đỗi bình thường nhưng mang giá trị tôn giáo to lớn: người ta tin rằng nó không xuất phát từ đâu khác ngoài chính [SCOPE.Custom('BranchTree')]."
