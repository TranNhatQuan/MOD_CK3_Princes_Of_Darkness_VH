 artifact_sculpture_animal_description:0 "[SCOPE.Custom('ArtifactArticleWealth')] bức tượng động vật, được sơn màu và chạm khắc [SCOPE.Custom('ArtifactAdverbQuality')]. Những phẩm chất huyền thoại của sinh vật được diễn giải như một ẩn dụ cho [owner.GetTitleAsNameNoTooltip] và [owner.GetHerHis] [owner.Custom('RulerSkill')]. Chất liệu [newly_created_artifact.GetFeatureText( 'sculpture_material' )] của bức tượng được gia công [SCOPE.Custom('ArtifactAdverbQuality')]."
