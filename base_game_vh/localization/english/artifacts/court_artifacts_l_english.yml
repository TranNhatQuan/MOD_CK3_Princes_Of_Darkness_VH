 #artifact_sculpture_ganesh_description: "A carved and painted statue of Ganesh the Remover of Obstacles."
 artifact_sculpture_armor_babr_name:0 "Babr-e Bayan"
 artifact_sculpture_armor_babr:1 "Đây là Babr-e Bayan huyền thoại, bộ giáp từng được vị anh hùng Ba Tư Rostam khoác lên."
 artifact_sculpture_cabinet_pentapyrgion_name:1 "Pentapyrgion"
 artifact_sculpture_cabinet_pentapyrgion_description:1 "Chiếc tủ trang nhã này được Hoàng đế Theophilos cho xây dựng nhằm trưng bày bình, vương miện và các vật quý khác trong Chrysotriklinos, đại sảnh tiếp kiến của Đại Cung điện Constantinople."
 create_artifact_epic_tooltip:0 "[inspiration_owner.GetShortUIName] đã mang [epic.GetName] từ một vùng đất xa lạ"
 create_artifact_adventure_tooltip:0 "[inspiration_owner.GetShortUIName] đã mang [newly_created_artifact.GetName] từ một vùng đất xa lạ"
 artifact_statue_constantine_name: "Tượng Constantine"
 artifact_statue_constantine: "Một bức tượng cổ xưa, hơi hư hại, nhưng vẫn đầy uy nghi của Constantine Đại đế, người sáng lập Constantinople và hình mẫu của mọi hoàng đế La Mã."
 artifact_statue_roman_woman_name: "Tượng một phụ nữ La Mã"
 artifact_statue_roman_woman_desc: "Một bức tượng cổ xưa, hơi hư hại, nhưng vẫn duyên dáng của một phụ nữ La Mã."
 artifact_statue_four_tetrarchs_name: "Tượng Tứ Đầu Chế"
 artifact_statue_four_tetrarchs_desc: "Một bức tượng porphyry uy nghi khắc họa hai thành viên của Tứ Đầu Chế đầu tiên do Diocletian thiết lập."
 artifact_hydraulic_organ_name: "Đàn phong cầm thủy lực"
 artifact_hydraulic_organ_desc: "Một cây phong cầm chạy bằng nước đầy ấn tượng, tự hào ngân vang những giai điệu của Hy Lạp cổ."

