 # Decorations for wooden furniture.
  feature_wood_decoration_none:0 "Bề mặt gỗ đã được mài nhẵn đến độ hoàn hảo."
  feature_wood_decoration_varnish:0 "Gỗ được phủ vecni, tạo nên sắc bóng tối đậm và sang trọng."
  feature_wood_decoration_hsb_inlay:0 "Gỗ được khảm trang trí bằng [Artifact.GetFeatureText( 'decoration_material_inlay_HSB' )]."
  feature_wood_decoration_painted_pattern:0 "Gỗ được sơn với [Artifact.GetFeatureText( 'decoration_pattern' )]."

 # Thrones 
  artifact_throne_charlemagne_name:1 "Ngai vàng của Charlemagne"
  artifact_throne_charlemagne_description:0 "Một chiếc ngai đơn giản nhưng đầy uy nghi, không hề có trang sức. Được dựng từ đá cẩm thạch nguyên khối, các phiến đá được đồn rằng lấy từ Nhà thờ Mộ Thánh tại Jerusalem."
  artifact_throne_solomon_name:1 "Ngai vàng của Solomon"
  artifact_throne_solomon_description:0 "Một chiếc ngai xa hoa được cho là từng thuộc về vị vua huyền thoại Solomon. Được chế tác từ ngà voi, mạ vàng, đính vô số đá quý, cùng những bức tượng kim loại hình thú trang trí các bậc thềm dẫn lên ngai."
  artifact_throne_stone_scone_name:1 "Đá Scone"
  artifact_throne_stone_scone:0 "Một chiếc ngai đơn sơ bằng sa thạch đỏ, nơi mọi quân vương của Alba đều được đăng quang kể từ thời Vua Kenneth I."
  artifact_byz_throne_name:0 "Ngai Solomon của Byzantine"
  artifact_byz_throne_description:0 "Một chiếc ngai thanh nhã, từ đó các hoàng đế Byzantine cai trị với sự khôn ngoan sánh ngang Vua Solomon trong Kinh Thánh. Điểm nổi bật nhất là cơ cấu bí mật cho phép ngai nâng lên sát trần rồi hạ xuống."

 # Banner
  artifact_wall_banner_battle_name:1 "Chiến kỳ [epic_loser.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  artifact_wall_banner_battle_description:1 "Một chiến kỳ của quân đội [epic_loser.GetPrimaryTitle.GetName], thu được sau trận chiến tại [epic_battle_location.GetName]."
  artifact_wall_banner_royal_name:0 "Hoàng kỳ [target.GetAdjectiveNoTooltip]"
  artifact_wall_banner_royal_description:1 "Đây là lá cờ của [target.GetNameNoTooltip], được chế tác để tôn vinh triều đại của [target.GetHolder.GetTitledFirstNameRegnal]."
  artifact_wall_banner_house_name:0 "Gia huy [target.GetBaseNameNoTooltip]"
  artifact_wall_banner_house_description:1 "Đây là lá cờ của gia tộc [target.GetBaseName], biểu trưng cho quyền uy của dòng họ và các hậu duệ."
  artifact_wall_banner_dynasty_name:0 "Vương kỳ Triều đại [target.GetBaseNameNoTooltip]"
  artifact_wall_banner_dynasty_description:1 "Đây là lá cờ của triều đại [target.GetBaseName], biểu tượng cho quyền lực của huyết thống và toàn thể thành viên, được ủy thác bởi [newly_created_artifact.MakeScope.Var('banner_commissioner').Char.GetNameRegnal]."
  artifact_wall_banner_name:1 "Cờ hiệu [target.GetAdjectiveNoTooltip]"
  artifact_wall_banner_description:3 "Đây là một lá cờ [target.GetAdjective], biểu trưng cho quyền uy của [target.GetHolder.GetTitleAsName]."

  artifact_wall_banner_kaviani_name:0 "Derafsh Kaviani"
  artifact_wall_banner_kaviani:1 "Đây là Derafsh Kaviani huyền thoại — quân kỳ hoàng gia của Đế quốc Sassanid đã sụp đổ. Một biểu tượng của bản sắc và niềm kiêu hãnh dành cho những người thừa kế Đế quốc Ba Tư."
  artifact_wall_big_edessa_name:1 "Thánh tượng Edessa"
  artifact_wall_big_edessa:2 "Đây là Mandylion, một tấm vải mang hình ảnh kỳ diệu của khuôn mặt Chúa Jesus, biểu tượng đầu tiên của Kitô giáo. Nguồn gốc của nó gắn liền với Vua Abgar của Edessa."

 # Shield
  artifact_wall_shield:0 "Khiên treo tường"
  artifact_wall_shield_name:0 "$artifact_name_prefix$ Khiên"
  artifact_wall_shield_description:1 "Một chiếc khiên gỗ với tay nghề [SCOPE.Custom('ArtifactQuality')], được ghép từ các tấm gỗ [newly_created_artifact.GetFeatureText( 'shaft_wood' )] chắc chắn và viền bằng một vành [newly_created_artifact.GetFeatureText( 'head_metal' )]. Phần rìa được khảm [newly_created_artifact.GetFeatureText( 'decoration_material_inlay_HSB' )] và sơn hình ảnh [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]."
  artifact_wall_shield_special:0 "$artifact_wall_shield$"
  artifact_wall_axe_description:0 "$artifact_axe_description$"
  artifact_wall_sword_description:0 "$artifact_sword_description$"
  artifact_wall_spear_description:0 "$artifact_spear_description$"
  artifact_wall_hammer_description:0 "$artifact_hammer_description$"
  artifact_wall_mace_description:0 "$artifact_mace_description$"
  artifact_wall_dagger_description:0 "$artifact_dagger_description$"

  artifact_wall_cid_sword_name:0 "Tizona"
  artifact_wall_el_cids_sword:1 "Đây là một thanh kiếm dài khoảng ba thước, mang khắc dòng chữ \"Tizona\". Tương truyền thanh kiếm này đã được vị lãnh chúa chiến tranh lừng danh El Cid đoạt lấy từ chủ nhân cũ. Chỉ riêng sự hiện diện của nó cũng đủ khơi dậy cảm giác kính sợ trước võ công."

 artifact_radzig_kobyla_longsword_name:0 "Radzig Kobyla's Longsword"
 artifact_henrys_longsword_name:0 "Henry's Longsword"
 artifact_radzig_kobyla_longsword_description:0 "Rumors claim the sword was forged for a "Sir Radzig Kobyla", and was presumed lost for a long time until recovered by a certain hungry man on his quest for revenge."

  artifact_wall_sword_muhammad_name:1 "Kiếm của Muhammad"
  artifact_wall_sword_muhammad:0 "Một trong chín thanh kiếm đích thực của Nhà Tiên tri Muhammad. Đây là [SCOPE.Custom('MuhammadSword')]."
  artifact_wall_sword_muhammad_aladb:0 "Al-'Adb — được Muhammad sử dụng trong các trận Badr và Uhud"
  artifact_wall_sword_muhammad_almathur:0 "Al-Ma'thur — được cha của Muhammad truyền lại"
  artifact_wall_sword_muhammad_arrasub:0 "Ar-Rasub — bảo vật gia truyền của Muhammad"
  artifact_wall_sword_muhammad_albattar:0 "Al-Battar — được Muhammad thu làm chiến lợi phẩm từ bộ tộc Banu Qaynaqa"
  artifact_wall_sword_muhammad_haft:0 "Haft — được Muhammad thu làm chiến lợi phẩm từ bộ tộc Banu Qaynaqa"
  artifact_wall_sword_muhammad_qali:0 "Qal'i — được Muhammad thu làm chiến lợi phẩm từ bộ tộc Banu Qaynaqa"
  artifact_wall_sword_muhammad_dhu:0 "Dhu al-Faqar — được Muhammad thu làm chiến lợi phẩm trong trận Badr"
  artifact_wall_sword_muhammad_mikhdham:0 "Al-Mikhdham — được Muhammad trao lại cho người anh em họ kiêm con rể là Ali ibn Abi Talib"
  artifact_wall_sword_muhammad_alqadib:0 "Al-Qadib — thanh kiếm luôn được lưu giữ trong nhà của Muhammad"
  artifact_wall_sword_attila_name:1 "Kiếm của Thượng Đế"
  artifact_wall_sword_attila_description:0 "Thanh kiếm huyền thoại của thủ lĩnh Hung Nô Attila, Kẻ Trừng Phạt của Thượng Đế. Còn được biết đến với tên gọi Kiếm của Thần Mars."

  artifact_sword_goujian_name: "Việt Vương Câu Tiễn Kiếm"
  artifact_sword_goujian: "Thanh cổ kiếm này được truyền rằng từng thuộc về Việt Vương Câu Tiễn. Dẫu kiểu dáng mang nét cổ xưa, song tay nghề chế tác lại vô cùng tinh xảo. Gần chuôi kiếm có thể thấy văn tự mạ vàng khắc theo thể điểu trùng triện."
  artifact_sword_goujian_refulgence: "[gujian_sword.GetDesc]\n\nThanh kiếm này được cho là 'Quang Huy', bảo kiếm mà Câu Tiễn từng mang theo khi cầu giáo nơi Khổng Tử."
  artifact_sword_goujian_purity: "[gujian_sword.GetDesc]\n\nThanh kiếm này được cho là 'Thanh Khiết'."

