  artifact_pedestal_branch_bo:0 "một cành từ Cây Bồ-đề, nơi Đức Phật ngồi khi đạt đến Giác Ngộ"
  artifact_pedestal_branch_bo_name:0 "Một Cành từ Cây Bồ-đề"
  artifact_pedestal_branch_thor:1 "Cây Sồi Thiêng của Thor"
  artifact_pedestal_branch_uppsala:1 "Cây Thiêng tại Đền Uppsala"
  artifact_pedestal_branch_alatyr:2 "Cây Sự Sống đứng trên tảng đá Alatyr"
  artifact_pedestal_branch_somb:1 "Somb, Cây Đầu Tiên trên Trái Đất"
  artifact_pedestal_branch_kalpavriksha:2 "một trong những Cây Ước Nguyện Kalpavriksha"
  artifact_pedestal_branch_general:1 "Cây Sự Sống"
  artifact_pedestal_crown_iron_name:1 "Vương miện Sắt của Lombardia"
  artifact_pedestal_crown_iron:1 "Vương miện Sắt của Lombardia — được gọi như vậy vì vòng sắt ở mặt trong được cho là được rèn từ một chiếc đinh của thập giá Chúa Jesus"
  artifact_pedestal_crown_thorns_name:0 "Vương miện Gai"
  artifact_pedestal_crown_thorns:1 "Chiếc Vương miện Gai của Chúa Jesus còn được bảo tồn nguyên vẹn, từng được đội trong Cuộc Khổ Nạn"
  artifact_pedestal_veil_veronica_name:1 "Khăn của Thánh Veronica"
  artifact_pedestal_veil_veronica:1 "Tấm Khăn đích thực của Thánh Veronica: một mảnh vải trên đó khuôn mặt Chúa Jesus được in dấu một cách kỳ diệu trong Cuộc Khổ Nạn. Người ta nói rằng nó có thể chữa lành bệnh tật nhờ Ân Sủng của Thiên Chúa"
  artifact_pedestal_cornerstone_name:0 "Viên đá góc bị đánh cắp"
  artifact_pedestal_cornerstone_name_desc:0 "Một viên đá góc từ [rival.GetTitledFirstNamePossessive] [rival.Custom('FortifiedBuilding')]"
 #artifact_pedestal_mosque_lamp_name: "Precious Oil Lamp"
 #artifact_pedestal_mosque_lamp: "A magnificent mosque lamp — a precious oil lamp made of enamelled glass and gilded."
  artifact_tree_automa_name: "Cây Tự Động"
  artifact_tree_automa: "Một cây được chạm khắc tinh xảo và mạ vàng, với những con chim sống động như thật đậu trên các cành. Chỉ người Hy Lạp mới biết bí mật của hệ thống bơm thủy lực ẩn giấu bên trong, khiến những con chim có thể chuyển động và hót lên những âm thanh êm tai."


