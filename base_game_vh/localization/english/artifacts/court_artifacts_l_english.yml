  feature_book_title_nemesis:0 "Mối Hận Thù Bất Diệt của [Artifact.GetOwner.GetTitledFirstName]"
  feature_book_topic_nemesis:0 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] bản thảo [Artifact.GetOwner.Custom('ArtifactAdverbBookContentQuality')] truyền tải lòng căm hận mà [Artifact.GetOwner.GetTitleAsName] dành cho [Artifact.GetOwner.MakeScope.Var('book_topic_relationship').Char.GetTitledFirstName] – gọi [Artifact.GetOwner.MakeScope.Var('book_topic_relationship').Char.GetHerHim] là [Artifact.GetOwner.MakeScope.Var('book_topic_relationship').Char.Custom2('InsultAdjectiveArticle', ROOT.Char)] [Artifact.GetOwner.MakeScope.Var('book_topic_relationship').Char.Custom2('InsultNoun', ROOT.Char)] cùng vô số lời lẽ khác. Văn bản được minh họa tỉ mỉ nhằm khắc họa [Artifact.GetOwner.MakeScope.Var('book_topic_relationship').Char.GetWomanMan] trong nhiều tình huống xấu xí nhất có thể."
 
