  feature_book_title_intrigue_poisons:0 "$artifact_name_prefix_artifact_scope$ Tuyển Tập Độc Dược"
  feature_book_topic_intrigue_poisons:0 "Một cuốn sách nhỏ, u ám với bìa da đen, chứa những bản vẽ chi tiết về thực vật cùng hướng dẫn từng bước, được minh họa [Artifact.GetOwner.Custom('ArtifactAdverbWealth')], để điều chế vô số loại độc dược."
  feature_book_title_intrigue_seduction:0 "$artifact_name_prefix_artifact_scope$ Nghệ Thuật Tình Ái"
  feature_book_topic_intrigue_seduction:0 "Một tập sách tinh nghịch đầy những lời khuyên [Artifact.GetOwner.Custom('ArtifactBookContentQuality')] được cho là khiến mọi quý cô và quý ông đều quỳ rạp dưới chân Ngài!"
  feature_book_title_intrigue_fertility:0 "Nguồn Mạch Sinh Mệnh"
  feature_book_topic_intrigue_fertility:0 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] cuốn sách đầy những lời khuyên [Artifact.GetOwner.Custom('ArtifactBookContentQuality')] về cách gia tăng khả năng sinh sản và giữ cho Ngài đời của Ngài hài lòng trong phòng khuê."
  feature_book_title_intrigue_punishment:0 "Tội Ác Và Trừng Phạt"
  feature_book_topic_intrigue_punishment:0 "Một tuyển tập đáng sợ về mọi hình thức tra tấn được biết đến trong thời đại của chúng ta, được mô tả một cách khoái trá và chi tiết bởi bậc thầy thực thụ trong lĩnh vực này, [author.GetFirstNameNoTooltip]."
  feature_book_topic_intrigue_punishment_not_torturer:0 "Một tuyển tập đáng sợ về mọi hình thức tra tấn được biết đến trong thời đại của chúng ta, được mô tả chi tiết và minh họa [Artifact.GetOwner.Custom('ArtifactAdverbWealth')]."

# learning
  feature_book_title_learning_religious:1 "$artifact_name_prefix_artifact_scope$ [Artifact.GetOwner.GetFaith.ReligiousText|U]"
  feature_book_topic_learning_religious:0 "Một bản sao của [Artifact.GetOwner.GetFaith.ReligiousText], được minh họa [Artifact.GetOwner.Custom('ArtifactAdverbWealth')] và viết bằng nét chữ tao nhã."
  feature_book_topic_learning_religious_big:0 "Một bản sao đồ sộ của [Artifact.GetOwner.GetFaith.ReligiousText], được minh họa [Artifact.GetOwner.Custom('ArtifactAdverbWealth')] và chép tay tinh mỹ."
  feature_book_title_learning_aristotle:0 "$artifact_name_prefix_artifact_scope$ Organon"
  feature_book_topic_learning_aristotle:1 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] bản sao Organon của Aristotle, được sao chép và chú giải [Artifact.GetOwner.Custom('ArtifactAdverbBookContentQuality')]."
  feature_book_title_learning_iliad:0 "$artifact_name_prefix_artifact_scope$ Iliad"
  feature_book_topic_learning_iliad:1 "[Artifact.GetOwner.Custom('ArtifactAdverbBookContentQuality')|U] bản Iliad Hy Lạp có chú giải, thể hiện sự am hiểu sâu sắc về nguyên tác và các sự kiện của cuộc Chiến tranh thành Troy."
  feature_book_title_learning_mahabharata:0 "$artifact_name_prefix_artifact_scope$ Mahabharata"
  feature_book_topic_learning_mahabharata:0 "[Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U], bản sao được minh họa [Artifact.GetOwner.Custom('ArtifactAdverbWealth')] của sử thi cổ đại Mahabharata. Câu chuyện thuật lại cuộc tranh đấu giữa hai nhánh anh em họ, Pandava và Kaurava, nhằm giành lấy ngai vàng Hastinapura."
  feature_book_title_learning_mufaddaliyat:0 "$artifact_name_prefix_artifact_scope$ Mufaddaliyat"
  feature_book_topic_learning_mufaddaliyat:0 "[Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] bản hiệu đính có chú giải của tuyển tập thi ca mang tên Mufaddaliyat do học giả lừng danh [author.GetTitledFirstNameNoTooltip] biên soạn."
  feature_book_title_learning_prayers:1 "Lời Cầu Nguyện Cho Tín Đồ [Artifact.GetOwner.GetFaith.GetAdjective]"
  feature_book_topic_learning_prayers:1 "Một cuốn sách cầu nguyện uy nghi dành cho tín đồ [Artifact.GetOwner.GetFaith.GetAdjective], được minh họa [Artifact.GetOwner.Custom('ArtifactAdverbWealth')]."
  feature_book_title_learning_hours:0 "$artifact_name_prefix_artifact_scope$ Sách Giờ Kinh"
  feature_book_topic_learning_hours:0 "Một bản sao lớn của Sách Giờ Kinh, được minh họa [Artifact.GetOwner.Custom('ArtifactAdverbWealth')], phù hợp hơn cho bộ sưu tập của người yêu sách hơn là để một tín đồ mộ đạo sử dụng."
  feature_book_title_learning_golden_legend:0 "$artifact_name_prefix_artifact_scope$ Truyền Thuyết Vàng"
  feature_book_topic_learning_golden_legend:0 "[Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] tuyển tập thánh truyện được viết bằng tiếng Latin giản dị, chắc chắn sẽ được mọi người yêu thích."
  feature_book_title_learning_anatomy:0 "Khảo Sát Cơ Thể Con Người"
  feature_book_topic_learning_anatomy:0 "Cuốn sách này chứa những quan sát [Artifact.GetOwner.Custom('ArtifactBookContentQuality')] và minh họa [Artifact.GetOwner.Custom('ArtifactWealth')] mô tả chi tiết giải phẫu cơ thể con người."

# medicine
  feature_book_title_medicine_medicine:0 "$artifact_name_prefix_artifact_scope$ Bản Thảo Y Học"
  feature_book_title_medicine_science:0 "$artifact_name_prefix_artifact_scope$ Herbolarium"
  feature_book_topic_medicine_science:0 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] herbolarium, tập hợp toàn bộ tri thức của thế giới về thảo dược và công dụng y học của chúng."
  feature_book_topic_medicine_science_big:0 "Một herbolarium đồ sộ, với các bản vẽ chi tiết từng loài cây và mô tả đặc tính y học của chúng."
  feature_book_title_medicine_galen:0 "$artifact_name_prefix_artifact_scope$ Galen"
  feature_book_topic_medicine_galen:0 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] bản thảo chứa toàn bộ trí tuệ y học của triết gia và thầy thuốc cổ đại Galen."

# alchemy
  feature_book_title_alchemy_the_great_book_of_mercy:0 "Đại Thư Của Lòng Từ Bi"
  feature_book_topic_alchemy_the_great_book_of_mercy:0 "[Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] bản sao tác phẩm giả kim Đại Thư Của Lòng Từ Bi của Jabir ibn Hayyan, được minh họa và trang trí [Artifact.GetOwner.Custom('ArtifactAdverbWealth')]."
  feature_book_title_alchemy_the_book_of_seventy:0 "Sách Bảy Mươi"
  feature_book_topic_alchemy_the_book_of_seventy:0 "[Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] bản sao cẩm nang toàn diện của Jabir ibn Hayyan, mô tả việc chế tạo linh dược, các học thuyết về bốn nguyên tố và việc sử dụng chất liệu động vật trong giả kim."
  feature_book_title_alchemy_mercury:0 "$artifact_name_prefix_artifact_scope$ Cẩm Nang Thủy Ngân"
  feature_book_topic_alchemy_mercury:1 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] bộ sách chứa những chỉ dẫn [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] để tạo ra phẩm nhuộm đỏ chu sa – được săn đón trong minh họa – bằng cách kết hợp lưu huỳnh và thủy ngân."
  feature_book_title_alchemy_arsenic:0 "$artifact_name_prefix_artifact_scope$ Vua Của Độc Dược"
  feature_book_topic_alchemy_arsenic:1 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] bộ sách chứa những chỉ dẫn [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] để điều chế arsen kim loại, một loại độc dược chết người và tinh vi."
  feature_book_title_alchemy_gold:0 "$artifact_name_prefix_artifact_scope$ Chrysopoeia"
  feature_book_topic_alchemy_gold:1 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] bộ sách chứa những chỉ dẫn [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] để biến đổi vàng từ chì và các kim loại hèn khác. Người đọc được cảnh báo rằng kết quả có thể không đồng nhất."
  feature_book_title_alchemy_silver:0 "$artifact_name_prefix_artifact_scope$ Argyropoeia"
  feature_book_topic_alchemy_silver:1 "[Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] bộ sách chứa những chỉ dẫn [Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] để biến đổi bạc từ đồng và các kim loại hèn khác. Người đọc được cảnh báo rằng kết quả có thể không đồng nhất."

