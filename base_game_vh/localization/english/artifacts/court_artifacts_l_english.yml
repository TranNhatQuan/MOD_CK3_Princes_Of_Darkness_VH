  create_artifact_diwan_tooltip:0 "[inspiration_owner.GetShortUIName] đã tạo ra một chiếc trường kỷ với tay nghề [SCOPE.Custom('ArtifactQuality')]."
  artifact_table_name:0 "$artifact_name_prefix$ Bàn"
