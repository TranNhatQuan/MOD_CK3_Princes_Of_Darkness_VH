  artifact_bowl_name:0 "$artifact_name_prefix$ Bát"
  artifact_bowl_description:0 "Một chiếc bát trang trí tinh xảo với tay nghề [SCOPE.Custom('ArtifactQuality')]. Nó được làm từ [newly_created_artifact.GetFeatureText( 'generic_material_metal' )] và được chạm khắc các họa tiết [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]."

  artifact_plate_name:0 "$artifact_name_prefix$ Đĩa"
  artifact_plate_description:0 "Một chiếc đĩa lộng lẫy với tay nghề [SCOPE.Custom('ArtifactQuality')]. Nó được đúc từ [newly_created_artifact.GetFeatureText( 'generic_material_metal' )] và được khắc axit các họa tiết [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]."

  artifact_urn_name:0 "$artifact_name_prefix$ Bình Tro"
  artifact_urn_description:0 "Một chiếc bình tinh xảo với tay nghề [SCOPE.Custom('ArtifactQuality')]. Nó được làm từ [newly_created_artifact.GetFeatureText( 'generic_material_earthware' )] và được bao quanh bởi các hình chạm khắc [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]."

  artifact_statuette_name:0 "$artifact_name_prefix$ Tượng Nhỏ"
  artifact_statuette_description:0 "Một bức tượng thu nhỏ thanh nhã với tay nghề [SCOPE.Custom('ArtifactQuality')], mô tả một [host.Custom('MountedWarriorTerm')] cưỡi ngựa trong thế xung phong. Tượng được đúc bằng vàng với độ chi tiết ấn tượng."

  artifact_tun_barrel_name:0 "$artifact_name_prefix$ Thùng Rượu Lớn"
  artifact_tun_barrel_description:0 "Một chiếc thùng bằng [newly_created_artifact.GetFeatureText( 'generic_material_wood' )] khổng lồ với tay nghề [SCOPE.Custom('ArtifactQuality')], có thể chứa hàng trăm gallon rượu vang."

  artifact_scepter_name:0 "$artifact_name_prefix$ Quyền Trượng"
  artifact_scepter_description:0 "Một cây quyền trượng trang trí tinh xảo, tay nghề [SCOPE.Custom('ArtifactQuality')], được rèn bằng vàng — dấu hiệu đích thực của địa vị."
 
  artifact_scepter_pedestal:0 "Quyền Trượng"

  artifact_wall_icon_court_large: "Thánh Tượng Lớn"
  artifact_wall_icon_court_small: "Thánh Tượng Nhỏ"

  artifact_pedestal_sakanoue_sword_name: "Banke no Hōken"
  artifact_pedestal_sakanoue_sword_desc: "Thanh kiếm này từng được vị danh tướng $dynn_Sakanoue$ $Tamuramaro$ sử dụng, và được truyền tụng là có thể bảo hộ hoàng triều. Sau khi $Tamuramaro$ qua đời, nó được $Saga_JP$ $king_tenno_male_japanese$ dâng nhập cung đình."
  artifact_higekiri_sword_name: "Higekiri"
  artifact_higekiri_sword_desc: "Thanh 'Trảm Tu' này được đặt rèn cùng với Hizamaru bởi $dynn_Minamoto$ no $Mitsunaka$, và được truyền lại qua gia tộc $Seiwa$ $dynn_Minamoto$."
  artifact_hizamaru_sword_name: "Hizamaru"
  artifact_hizamaru_sword_desc: "Thanh kiếm này được đặt rèn cùng với Higekiri bởi $dynn_Minamoto$ no $Mitsunaka$, và được truyền lại qua gia tộc $Seiwa$ $dynn_Minamoto$."
  artifact_dojigiri_sword_name: "Dōjigiri"
  artifact_dojigiri_sword_desc: "Thanh kiếm này do danh tượng sư $Yasutsuna_4$ rèn cho $dynn_Fujiwara$ $Toshihito$, và được truyền lại trong gia tộc $dynn_Fujiwara$."
  artifact_mikazuki_munechika_sword_name: "Mikazuki"
  artifact_mikazuki_munechika_sword_desc: "Thanh 'Tam Nguyệt' này được danh tượng sư $dynn_SanjO_$ $Munechika_2$ rèn vào triều đại của $IchijO_$ $king_tenno_male_japanese$."
  artifact_odenta_sword_name: "Ōtenta"
  artifact_odenta_sword_desc: "Thanh 'Đại Tenta' này được danh tượng sư $Mitsuyo$, hiệu Tenta, rèn dưới triều $Shirakawa$ $king_tenno_male_japanese$."
  artifact_pedestal_hamayumi_bow_name: "Hamayumi"
  artifact_pedestal_hamayumi_bow_desc: "Cung 'Phá Ma' này từng được $dynn_Minamoto$ $Yorimasa$ sử dụng, khi ông được triệu vào hoàng cung để trừ tà diệt quỷ."
  artifact_pedestal_seven_branched_sword_name: "Shichishitō"
  artifact_pedestal_seven_branched_sword_desc: "Thanh 'Thất Chi Kiếm', một lưỡi kiếm sắt với bảy nhánh tựa ngọn lửa, được cho là lễ vật hữu nghị dâng lên $king_tenno_male_japanese$, gửi vượt biển từ quốc vương Bách Tế thuở xa xưa."
  artifact_pedestal_gyerimro_dagger_name: "Đoản Kiếm Dị Vực"
  artifact_pedestal_gyerimro_dagger_desc: "Thanh đoản kiếm được chế tác tinh xảo này, chuôi và vỏ đều được khảm vàng cầu kỳ cùng bảo thạch quý giá, là bảo vật của triều đình Tân La, và được cho là có nguồn gốc từ những miền đất xa xôi phương Tây."
  artifact_karakawa_armor_name: "Karakawa"
  artifact_karakawa_armor_desc: "Bộ đại giáp ō-yoroi được chế tác tinh mỹ này là gia bảo của gia tộc Taira, và được truyền rằng là lễ vật từ người cháu của $Kanmu$ $king_tenno_male_japanese$."
  artifact_nukemaru_sword_name: "Nukemaru"
  artifact_nukemaru_sword_desc: "Tương truyền được chính Amaterasu ban cho một thợ săn tại Ise, thanh kiếm này sau được $dynn_Taira$ $Tadamori$ mua lại, và được kể rằng tự rút khỏi vỏ khi có rắn đe dọa giấc ngủ của ông."
  artifact_kogarasumaru_sword_name: "Kogarasumaru"
  artifact_kogarasumaru_sword_desc: "Thanh 'Tiểu Ô' này do Amakuni rèn cho hoàng triều, và về sau được $Suzaku$ $king_tenno_male_japanese$ ban cho $dynn_Taira$ $Sadamori$ để ghi nhận công lao trong loạn Jōhei–Tengyō."
  artifact_statue_green_amitabha_buddha_name: "Phật A Di Đà Ngọc Lục"
  artifact_statue_green_amitabha_buddha_descripton: "Bức tượng A Di Đà này dường như được tạc từ một khối đá xanh nguyên khối. Phần đế được trang trí bằng họa tiết cánh sen và sóng nước.\n\nTương truyền rằng pho tượng đã kỳ diệu xuất hiện từ đống đổ nát của một bảo tháp sụp đổ không lâu sau khi được dựng nên."
