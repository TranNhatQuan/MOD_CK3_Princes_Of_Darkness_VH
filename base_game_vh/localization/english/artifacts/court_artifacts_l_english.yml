 ##############################
 # Procedural court artifacts #
 ##############################

 # Wall Decorations - Large
  artifact_wall_tapestry_name:0 "$artifact_name_prefix$ Thảm treo"
  artifact_wall_tapestry_description:1 "Một tấm thảm treo lớn bằng [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )], được chế tác với tay nghề [SCOPE.Custom('ArtifactQuality')]. [newly_created_artifact.GetFeatureText( 'tapestry_scene' )]"
  feature_tapestry_scene_religious:0 "Tấm vải mô tả nhiều cảnh quan trọng được trích từ kinh điển của [Artifact.GetOwner.GetFaith.GetAdjectiveNoTooltip]."
  feature_tapestry_scene_historical:0 "Tấm vải khắc họa sự khai lập của [Artifact.GetOwner.GetPrimaryTitle.GetName] cùng các sự kiện lịch sử trọng đại dẫn đến triều đại của [Artifact.GetOwner.GetTitledFirstName]."
  feature_tapestry_scene_geometric_patterns:0 "Tấm vải được dệt thành một thiết kế tinh xảo gồm các hình học đan xen."
  feature_tapestry_scene_hunt:0 "Tấm vải mô tả một cảnh săn bắn: những thợ săn mang cung và giáo bao vây một con thú bị thương, chuẩn bị tung đòn kết liễu."
  feature_tapestry_scene_myth:0 "Những vị thần cổ đại, quái vật kinh hoàng và các anh hùng không sợ hãi được dệt lên tấm vải, tái hiện một cảnh trong thần thoại."
  feature_tapestry_scene_calligraphic:0 "Tấm vải được dệt thành một thiết kế tinh vi, nơi những nét thư pháp thanh nhã hòa quyện liền mạch với các hình học."
  feature_tapestry_scene_bucolic:0 "Tấm vải mô tả những cảnh thanh bình của đời sống nông thôn quanh năm: có người gieo hạt, có người cày ruộng, kẻ khác gặt hái mùa màng."
  feature_tapestry_scene_battle:0 "Tấm vải khắc họa bước ngoặt của trận chiến nổi tiếng tại [Artifact.GetOwner.MakeScope.Var('epic_battle_location').Province.GetName], nơi [Artifact.GetOwner.GetTitledFirstName] đánh bại [Artifact.GetOwner.MakeScope.Var('epic_loser').Char.GetTitledFirstName]."
  feature_tapestry_scene_coronation:0 "[Artifact.GetOwner.GetTitledFirstName|U] được khắc họa ở trung tâm khung cảnh trong lễ đăng quang của [Artifact.GetOwner.GetHerHis], ngự trên ngai vàng giữa tiếng hò reo của đám đông."
  feature_tapestry_scene_ships:0 "Tấm vải mô tả một hạm đội hùng mạnh đang vượt biển — trên mỗi con thuyền, những chiến binh vũ trang quan sát chân trời, dò tìm kẻ thù."
  feature_tapestry_scene_animals:0 "Tấm vải mô tả các loài thú săn mồi. Ở trung tâm, một con sư tử hùng dũng đã vồ lấy con nai đang tuyệt vọng tìm đường thoát."
  feature_tapestry_scene_banquet:0 "Tấm vải mô tả một yến tiệc xa hoa tại triều đình của [Artifact.GetOwner.GetTitledFirstName]: các vị khách danh giá ngồi quanh bàn tiệc thịnh soạn, trong khi nghệ sĩ biểu diễn âm nhạc và vũ điệu."
  feature_tapestry_scene_hearing:0 "Tấm vải mô tả một buổi thiết triều: [Artifact.GetOwner.GetTitledFirstName] ngồi uy nghi ở trung tâm, trong khi chư hầu, sứ thần, kẻ bại trận và gia nhân xếp hàng chờ vào yết kiến."
  feature_tapestry_scene_garden:0 "Một khu vườn tuyệt mỹ được khắc họa trên tấm vải: cỏ xanh mướt, hoa nở rực rỡ, cây cối trĩu quả vươn cao như chạm tới bầu trời."
  create_artifact_tapestry_tooltip:0 "[inspiration_owner.GetShortUIName] đã tạo ra một tấm thảm treo lớn với tay nghề [SCOPE.Custom('ArtifactQuality')]."

