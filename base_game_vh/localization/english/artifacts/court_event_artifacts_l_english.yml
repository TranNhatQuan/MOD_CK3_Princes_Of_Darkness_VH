l_english:

 #court.4500 Fake artifacts and trinkets
  blood_brooch_name:0 "Trâm Máu"
  blood_brooch_description:0 "Chiếc trâm này có một quả cầu thủy tinh chứa đầy máu của [ROOT.GetCharacter.GetTitledFirstName]."
  cuckoldry_psalter_name:0 "Thánh Thi Của Kẻ Bị Cắm Sừng"
  cuckoldry_psalter_description:0 "Truyền tay từ kẻ đội sừng này sang kẻ bị lừa khác qua bao thời đại, cuốn sách này được cho là món quà tuyệt vời nhất có thể dành tặng cho người phối ngẫu. Ít nhất thì những hình chạm ngà voi trên bìa trông có vẻ rất hạnh phúc trong hôn nhân."
  chastity_belt_name:0 "Đai Trinh Tiết"
  chastity_belt_description:0 "Chiếc đai trinh tiết này có gai cả bên trong lẫn bên ngoài, nhằm bảo vệ Ngài — và cả những người xung quanh."
  holy_needle_name:0 "Thánh Kim Của Antioch"
  holy_needle_description:0 "À thì, dùng nó để thêu cảnh Đóng Đinh cũng được đấy."
  finger_bones_name:0 "Xương Ngón Tay Của Một Vị Thánh"
  finger_bones_description:0 "Cả thảy mười một chiếc!"
  dead_chicken_name:0 "Khiên Gà Chết Của Kẻ Nhát Gan"
  dead_chicken_description:0 "Sẽ chẳng ai muốn ở gần Ngài nếu Ngài vung vẩy con gà chết này — đặc biệt là kẻ thù."
  worm_on_a_string_name:0 "Con Sâu Trên Sợi Dây"
  worm_on_a_string_description:0 "Một món đồ chơi mà có lẽ chỉ đủ sức gây ấn tượng với trẻ sơ sinh."


 #court.4750 Book commissions
  pope_joan_book_name:0 "Chuyện Kể Về Giáo Hoàng Joan"
  pope_joan_book_desc:0 "Một cuốn sách trong đó [ROOT.Char.GetTitledFirstNameNoTooltip] được khắc họa thành Giáo hoàng Joan. Sùng đạo, báng bổ, hay quyến rũ?"
  lady_godiva_book_name:0 "Chuyện Kể Về Lady Godiva"
  lady_godiva_book_desc:0 "Ít nhất thì những bức họa [ROOT.Char.GetTitledFirstNameNoTooltip] cưỡi ngựa khỏa thân cũng khá là tôn dáng."
  caligula_book_name:0 "Năm Trăm Roi"
  caligula_book_desc:0 "Năm trăm trang kể cảnh Caligula quất roi vào [ROOT.Char.GetTitledFirstNameNoTooltip]"
  nasreddin_book_name:0 "Chuyện Cười Nasreddin"
  nasreddin_book_desc:0 "Trong đó [ROOT.Char.GetTitledFirstNameNoTooltip] vinh dự trở thành đối tượng bị Nasreddin chế giễu"
  valmiki_book_name:0 "Châm Ngôn Của Valmiki"
  valmiki_book_desc:0 "Một loạt những câu nói hóm hỉnh của nhà thơ cổ xưa nhất, Valmiki, được thốt ra từ cái miệng khó tin của [ROOT.Char.GetTitledFirstNameNoTooltip]"
  ruler_hero_book_name:0 "Chuyện Kể Về [ROOT.Char.GetTitledFirstNameNoTooltip]"
  ruler_hero_book_desc:0 "Dòng mở đầu ghi lại cảnh [ROOT.Char.GetTitledFirstNameNoTooltip] tuyên bố với triều đình [ROOT.Char.GetHerHis]: 'Ta phải ngồi xuống, vì ta không thể đứng nổi khi ở cạnh các khanh.'"
  sinbad_book_name:0 "Những Chuyến Hải Hành Của Sinbad"
  sinbad_book_desc:0 "Một cuốn sách trong đó các quái vật mà Sinbad đối mặt đều mang gương mặt của [ROOT.Char.GetTitledFirstNameNoTooltip]"

 #court.4806 fan relics
  purple_underwear_name:0 "Nội y tím hoàng gia"
  purple_underwear_description:0 "Chỉ xứng đáng với một Hoàng đế.\n\nSic itur ad astra...?"
  fake_reichskrone_name:0 "Vương Miện Reich Giả"
  fake_reichskrone_description:0 "Đeo vào để thực sự trở thành một #EMP kẻ tiếm danh#! ngai vàng"
