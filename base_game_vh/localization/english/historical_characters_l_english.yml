l_english:
  HISTORICAL_CHARACTER_TOOLTIP: "#T Nhân Vật Lịch Sử#!\n\n#high [Character.Custom('HistoricalCharacterDesc')]#!\n\n#weak Nhân vật này là nhân vật lịch sử, nhưng có thể khác biệt so với nguyên mẫu ngoài đời thực của [Character.GetHerHis] tùy theo [culture|E] và [faith|E] của quê hương [Character.GetHerHis]. [Character.GetSheHe|U] cũng có thể xuất hiện lệch khoảng 1-5 năm so với mốc thời gian lịch sử nổi bật của [Character.GetHerHis].#!"
  danger_dynasty_abandon_tt: "#X @warning_icon! Ngài sẽ từ bỏ [dynasty|E] của mình và sẽ không thể tiếp tục chơi với họ nữa!#!"
  will_wander_tt: "[historical_character.GetFullName] sẽ trở thành một [wanderer|E]"
 
  historical_char_creation_events.t: "Dư Âm Lịch Sử: [historical_character.GetFullNameNicknamedNoTooltip]"
  historical_char_creation_events.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')] được biết đến với tên [historical_character.GetFullNameNicknamed] được cho là đang lang thang trong lãnh địa của ta để tìm kiếm sự trọng dụng. [historical_character.GetSheHe|U] xuất thân từ [birth_location.GetName], và toát lên một khí chất nơi [historical_character.GetHerHim]... [historical_character.Custom('DescriptorPositiveStandalone')] nhưng cũng phần nào [historical_character.Custom('DescriptorNegativeStandalone')].\n\n\n@historical_character_icon! #weak Nhân vật này là nhân vật lịch sử:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
  historical_char_creation_events_alternative.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')], được biết đến với tên [historical_character.GetFullNameNicknamed], đã tạo dựng danh tiếng cho [historical_character.GetHerselfHimself] tại triều đình. [historical_character.GetSheHe|U] là người [historical_character.Custom('DescriptorPositiveStandalone')], và dù ta không thể chỉ rõ, nhưng có điều gì đó phi thường ở [historical_character.GetHerHim]...\n\n\n@historical_character_icon! #weak Nhân vật này là nhân vật lịch sử:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
  historical_char_creation_events.1.a: "Không biết vận mệnh nào đang chờ đợi [historical_character.GetHerHim]..."
  historical_char_creation_events.1.b: "Một [historical_character.GetWomanMan] như vậy có thể phụng sự ta rất tốt!"
  historical_char_creation_events.1.c: "[historical_character.GetFullNameNoTooltip]? Ai mà quan tâm!"
 
  historical_char_creation_events.2.t: "Cải Cách Tôn Giáo: Thành Công"
  historical_char_creation_events.2.desc: "[inspiration_owner.GetFullName] đã dành vô số ngày đêm nghiên cứu sách vở, kinh điển và viết nên không biết bao nhiêu tài liệu, luận thuyết. Thiên tài của [inspiration_owner.GetHerHis|U] là điều không thể nghi ngờ khi ta đọc những gì [inspiration_owner.GetSheHe] đã viết...\n\nThật phi thường. Điều này có thể thay đổi #EMP tất cả.#!"
  historical_char_creation_events.2.a: "Những lời thiêng liêng này phải được lan truyền!"
  religious_reformer_modifier: "Nhà Cải Cách Tôn Giáo"
  religious_reformer_modifier_desc: "Được trợ giúp bởi một trí tuệ vĩ đại, nhân vật này đang sẵn sàng khai sinh một đức tin mới.\n\nModifier này sẽ bị xóa nếu một [faith|E] mới được tạo ra"
  mass_conversion_tt: "Cho phép sử dụng một lần quyết định #V $legendary_conversion$#! [decision|E]"
  religious_inspiration: "Cảm Hứng Tôn Giáo"
  religious_inspiration_desc: "Nhân vật có Cảm Hứng Tôn Giáo sẽ được [inspired|E] để dốc toàn tâm toàn ý nghiên cứu những điều huyền bí và tinh vi của [faith|E]. Họ thường là những nhà cải cách vĩ đại hoặc lãnh đạo phong trào tôn giáo. Cảm hứng này #EMP rất hiếm.#!"
 
  historical_character.karunakara: "Karunakara là một vị tướng nổi tiếng của vua Chola Kulottunga, đã nghiền nát cả kẻ thù lẫn phản đồ chống lại sự nghiệp Chola. Cuộc đời ông được ghi lại trong sử thi Kalinkkattuparani, nơi chiến thắng tại Kalinga và việc ông triều kiến Kulottunga được ca tụng như huyền thoại."
  historical_character.sekkilhar: "Từ nhỏ đã là một thần đồng, Sekkilhar được Raja Kulothunga chiêu mộ khi còn rất trẻ làm đại thần và chính khách. Ông nổi tiếng nhất với tác phẩm Periya Puranam, kể lại cuộc đời của 63 vị thánh Shaiva Nayanar trong 4.253 câu thơ. Về sau, chính Sekkilhar cũng được tôn kính và vẫn được rước như một vị thần trong khu vực."
  historical_character.omar_khayyam: "Omar Khayyam là một nhà bác học Ba Tư thế kỷ 11, đồng thời là thi sĩ, nhà toán học và thiên văn học. Ngày nay ông được biết đến nhiều nhất qua tập thơ “Rubaiyat”, nhưng ông cũng có đóng góp lớn cho đại số và thiên văn học tại Ba Tư. Công trình phân loại và giải phương trình bậc ba của ông là một thành tựu vĩ đại trong toán học."
  historical_character.bhaskaracharya: "Bhaskaracharya là nhà toán học và thiên văn học Ấn Độ thế kỷ 12, tác giả của công trình quan trọng “Siddhanta Shiromani”. Tác phẩm toàn diện này bao quát số học, đại số, chuyển động các hành tinh và lượng giác cầu. Nghiên cứu của ông về vi tích phân có trước Newton và Leibniz hơn năm thế kỷ."
  historical_character.joseph_rabban: "Joseph Rabban là nhân vật nổi bật của cộng đồng Do Thái tại Malabar thế kỷ 9. Vua Chera đã ban cho ông nhiều quyền lợi và đặc quyền dành cho cộng đồng Do Thái tại Cochin, và sự lãnh đạo của Rabban đã củng cố vị thế cũng như ảnh hưởng của người Do Thái ở miền nam Ấn Độ. Những hành động của ông đảm bảo quyền tự trị và sự tôn trọng đối với đóng góp thương mại và văn hóa của họ."
  historical_character.atisha: "Một trong những tên tuổi vĩ đại của Phật giáo Trung Cổ, Atisha là một lãnh đạo tôn giáo xuất thân từ Bengal và gắn liền mật thiết với tu viện Vikramashila tại Bihar. Thông qua các tác phẩm của mình, ông góp phần truyền bá cả Đại thừa lẫn Kim Cang thừa khắp Đông Nam Á và Tây Tạng."
  historical_character.hemachandra: "Hemachandra là học giả, nhà bác học và tu sĩ Kỳ Na giáo thế kỷ 12 của Ấn Độ. Ông có đóng góp quan trọng cho toán học, ngữ pháp, thi luật và triết học. Tác phẩm “Siddhahem” là công trình then chốt của văn học Jain, và giáo huấn của ông ảnh hưởng sâu rộng đến giáo dục và thực hành Kỳ Na giáo."
  historical_character.kshemendra: "Kshemendra là thi sĩ và học giả Kashmir thế kỷ 11, nổi bật với các sáng tác đa dạng từ châm biếm, nhại văn đến trước tác tôn giáo. Những tác phẩm tiêu biểu như “Samaya Matrika” và “Darpadalana” hài hước phê phán phong tục đương thời, khiến ông trở thành nhân vật độc đáo trong văn học Sanskrit cổ điển."
  historical_character.akka_mahadevi: "Akka Mahadevi là nữ thi sĩ Kannada thế kỷ 12 và là nhân vật nổi bật của phong trào Bhakti Lingayat. Nổi tiếng với các vachana (thi kệ), bà theo đuổi con đường sùng đạo và giải thoát tâm linh, thách thức chuẩn mực xã hội bằng việc từ bỏ đời sống thế tục và cổ vũ bình đẳng cũng như trao quyền cho phụ nữ trong thực hành tâm linh."
  historical_character.namdev: "Namdev là vị thánh và thi sĩ Marathi thế kỷ 13, nổi tiếng với những bài ca sùng kính dâng lên thần Vithoba và là nhân vật quan trọng trong phong trào Bhakti tại Maharashtra. Được quần chúng yêu mến, tác phẩm của ông cũng góp phần nâng cao vị thế và sự lan truyền của tiếng Marathi như một ngôn ngữ của thơ ca và tôn giáo."
  historical_character.madhvacharya: "Madhvacharya là triết gia Ấn Độ thế kỷ 13 và là người đứng đầu trường phái Dvaita của Vedanta. Ông giảng dạy rằng linh hồn (Atman) và thực tại tối cao (Brahman) là hai thực thể riêng biệt, trái ngược hẳn với các triết lý bất nhị đang thịnh hành lúc bấy giờ. Các trước tác và cuộc tranh luận của ông đã định hình sâu sắc thần học Hindu."
  historical_character.vidyapati: "Vidyapati là thi sĩ và học giả thế kỷ 14 đến từ Bihar, Ấn Độ. Ông nổi tiếng với các bài tình ca và thánh ca dâng lên thần Shiva, có ảnh hưởng sâu rộng đến phong trào Bhakti. Tác phẩm của ông được ca ngợi vì vẻ đẹp trữ tình và chiều sâu cảm xúc."
  historical_character.abhinavagupta: "Abhinavagupta là triết gia và nhà huyền học Ấn Độ thế kỷ 10–11 đến từ Kashmir. Ông được xem là một trong những học giả vĩ đại nhất của Shaivism Bất Nhị. Các tác phẩm của ông có ảnh hưởng sâu sắc đến triết học Hindu, đặc biệt là các lý thuyết về mỹ học và tâm linh trong chú giải “Abhinavabharati”."
  historical_character.basava: "Basava là triết gia và nhà cải cách xã hội Ấn Độ thế kỷ 12, người sáng lập phong trào Lingayat. Giáo lý của ông thách thức hệ thống đẳng cấp truyền thống và nhấn mạnh sự sùng kính thần Shiva. Các vachana (thi kệ) của Basava cổ vũ bình đẳng tâm linh và góp phần định hình phong trào Bhakti, ảnh hưởng sâu sắc đến xã hội và tôn giáo Ấn Độ thời trung đại."
  historical_character.hildegard: "Hildegard von Bingen là một nữ tu viện trưởng, nhà huyền học, tác giả và nhà soạn nhạc có tư tưởng tiến bộ, nổi tiếng với các thị kiến tôn giáo và trước tác học thuật. Bà viết về thần học, y học và âm nhạc, đóng góp cho tư tưởng Kitô giáo trung đại. Hildegard cũng được biết đến với các tác phẩm phụng vụ và kịch thánh, nhấn mạnh sự chữa lành toàn diện cả về tinh thần lẫn thể chất."
  historical_character.thomas_aquinas: "Thomas Aquinas là nhà thần học và triết gia dòng Đa Minh, nổi tiếng với việc dung hòa triết học Aristotle với thần học Kitô giáo trong tác phẩm “Summa Theologica”. Ông đề cao sự tương thích giữa lý trí và đức tin, ảnh hưởng sâu rộng đến giáo lý Kitô giáo, luật tự nhiên và đạo đức học. Di sản của ông vẫn trường tồn với tư cách một vị thánh được phong hiển thánh và Tiến sĩ Hội Thánh."
  historical_character.dante_alighieri: "Dante Alighieri là thi sĩ Ý nổi tiếng với tác phẩm “Thần Khúc”, cuộc hành trình sử thi qua Địa Ngục, Luyện Ngục và Thiên Đàng. Tác phẩm của ông có ảnh hưởng lâu dài đến văn học phương Tây và thần học Kitô giáo. Sự khám phá về đạo đức và bản tính con người giúp Dante được mệnh danh là “Cha đẻ của tiếng Ý”."
  historical_character.thomas_becket: "Thomas Becket là Tổng giám mục người Anh và là vị tử đạo, nổi tiếng với cuộc xung đột với vua Henry II về quyền lực của Giáo hội. Sự bảo vệ kiên quyết quyền tự trị giáo hội đã dẫn đến việc ông bị sát hại tại Nhà thờ Canterbury năm 1170. Cái chết tử đạo của ông củng cố địa vị thánh nhân, và đền thờ của ông tại Canterbury trở thành điểm hành hương quan trọng."
  historical_character.maimonides: "Maimonides là triết gia và học giả Do Thái thế kỷ 12. Ông nổi tiếng với “Mishneh Torah”, bộ pháp điển hóa luật Do Thái, và “Guide for the Perplexed”, bàn về mối quan hệ giữa tôn giáo và triết học. Ông được xem là một trong những nhà tư tưởng Do Thái có ảnh hưởng lớn nhất trong lịch sử."
  historical_character.chretien_de_troyes: "Các câu chuyện của Chrétien, được viết bằng tiếng Pháp cổ, đóng vai trò quan trọng trong sự phát triển của huyền thoại Arthur. Việc ông giới thiệu tình yêu cung đình và Chén Thánh trong các tác phẩm như “Lancelot, Hiệp sĩ Xe Ngựa” và “Perceval, Câu chuyện về Chén Thánh” đã ảnh hưởng mạnh mẽ đến văn học hiệp sĩ. Tác phẩm của ông nhấn mạnh tinh thần hiệp sĩ, chủ nghĩa anh hùng và tình yêu cung đình."
  historical_character.egil_skallagrimrsson: "Egil Skallagrímsson là chiến binh–thi sĩ Iceland lừng danh, nhân vật trung tâm của “Egil's Saga”. Nổi tiếng với tính khí nóng nảy và tài năng thi ca, ông được nhớ đến vì những hành động bạo liệt, những vần thơ mạnh mẽ và vai trò quan trọng trong thời kỳ định cư đầu tiên của Iceland cũng như các cuộc cướp phá Viking tại Anh."
  historical_character.gunnlaug_ormstunga: "Gunnlaug Ormstunga, nhân vật chính của “Gunnlaugs saga ormstungu”, là chiến binh–thi sĩ Viking nổi tiếng với những chuyến du hành và các cuộc thi tài thơ ca. Saga kể lại câu chuyện tình bi thương và cuộc đối đầu với đối thủ thi ca, phản ánh danh dự và khát vọng tiếng tăm trong xã hội Viking."
  historical_character.torbjorg_the_seeress: "Þorbjörg Nữ Tiên Tri là nhân vật tiên tri xuất hiện trong “Eirik the Red's Saga”. Nổi tiếng với việc thực hành spá (tiên đoán) và seiðr (ma thuật Bắc Âu), bà giữ vai trò quan trọng trong việc dự báo tương lai; sự xuất hiện nghi lễ của bà trong saga phản ánh niềm tin Bắc Âu vào sức mạnh của lời tiên tri."
  historical_character.erik_rode: "Erik Röde, còn được biết đến là Erik Đỏ, là nhà thám hiểm Viking và người sáng lập các khu định cư Bắc Âu đầu tiên tại Greenland. Ông nổi tiếng với tinh thần phiêu lưu và vai trò lãnh đạo công cuộc thuộc địa hóa, thiết lập một cộng đồng tồn tại suốt nhiều thế kỷ."
  historical_character.alhazen: "Hasan al-Haytham là nhà toán học và vật lý học Ả Rập thế kỷ 11, nổi tiếng với công trình về quang học. Tác phẩm “Kitab al-Manazir” (Sách Quang Học) của ông đặt nền tảng cho quang học hiện đại và ảnh hưởng đến khoa học phương Tây thời Trung Cổ. Ông được ghi nhớ vì phương pháp thực nghiệm nghiêm ngặt và những đóng góp lớn cho Thời kỳ Hoàng kim Hồi giáo."
  historical_character.ibn_battuta: "Ibn Battuta là nhà thám hiểm Maroc thế kỷ 14, nổi tiếng với những chuyến hành trình rộng khắp, vượt hơn 120.000 km qua thế giới Hồi giáo và nhiều vùng đất khác. Tập du ký “Rihla” của ông cung cấp cái nhìn chi tiết về các nền văn hóa và xã hội trung đại, khiến ông trở thành một trong những lữ hành gia vĩ đại nhất lịch sử."
  historical_character.william_of_ockham: "William xứ Ockham là triết gia và thần học gia người Anh thế kỷ 14, nổi tiếng với “Dao cạo Ockham” – nguyên lý ưu tiên lời giải thích đơn giản hơn. Là nhân vật quan trọng của truyền thống kinh viện, ông thách thức quyền lực Giáo hội và ủng hộ sự tách biệt giữa quyền lực thế tục và tôn giáo. Tư tưởng của ông ảnh hưởng lớn đến logic học, khoa học và chính trị."
  historical_character.geoffrey_chaucer: "Geoffrey Chaucer là thi sĩ và tác giả người Anh thế kỷ 14, nổi tiếng nhất với “The Canterbury Tales”, tuyển tập truyện kể về một cuộc hành hương đến Canterbury. Tác phẩm của ông được ca ngợi vì nhân vật sinh động, yếu tố hài hước và bức tranh xã hội trung đại. Những đóng góp của Chaucer giúp ông được mệnh danh là “Cha đẻ của thi ca Anh”."
  historical_character.aaron_of_lincoln: "Aaron xứ Lincoln là nhà tài chính và cho vay người Anh thế kỷ 12, được biết đến là một trong những người Do Thái giàu có nhất nước Anh trung đại. Ông cung cấp các khoản vay lớn cho giới quý tộc và Giáo hội để xây dựng nhiều công trình, bao gồm cả nhà thờ lớn. Sau khi ông qua đời, vua Henry II đã tịch thu khối tài sản khổng lồ của ông."
  historical_character.john_wycliffe: "John Wycliffe là nhà thần học và cải cách người Anh thế kỷ 14, nổi tiếng với những chỉ trích sớm đối với các thực hành của Giáo hội Công giáo. Ông ủng hộ việc dịch Kinh Thánh sang tiếng Anh, đặt nền móng cho Cải cách Tin Lành. Tư tưởng của ông, vốn chất vấn quyền lực Giáo hội, đã ảnh hưởng đến phong trào Lollard và các nhà cải cách sau này như Martin Luther."
  historical_character.roger_bacon: "Roger Bacon là triết gia và tu sĩ dòng Phanxicô người Anh thế kỷ 13, được biết đến với việc sớm đề cao phương pháp khoa học. Ông nhấn mạnh quan sát và thực nghiệm trong nghiên cứu, góp phần vào sự phát triển của khoa học thực chứng. Công trình của Bacon về quang học và giả kim thuật đã ảnh hưởng đến các học giả thời trung đại."
  historical_character.heloise_dargenteuil: "Héloïse d'Argenteuil là nữ tu viện trưởng và học giả người Pháp thế kỷ 12, nổi tiếng với thư từ trao đổi cùng Peter Abelard. Những bức thư của bà được ca ngợi vì nội dung đầy đam mê và trí tuệ, thể hiện chiều sâu cảm xúc và tư duy sắc bén. Về sau, Héloïse trở thành viện trưởng tu viện Paraclete, nơi bà thể hiện năng lực lãnh đạo vững vàng."
  historical_character.peter_abelard: "Peter Abelard là triết gia và thần học gia người Pháp thế kỷ 12, nổi tiếng với phương pháp kinh viện và mối tình gây tranh cãi với Héloïse. Tác phẩm “Sic et Non” của ông sử dụng lập luận biện chứng để bàn về các vấn đề thần học. Cuộc đời và tư tưởng của Abelard ảnh hưởng sâu sắc đến triết học trung đại, còn chuyện tình với Héloïse trở thành một huyền thoại lãng mạn thời trung cổ."
  historical_character.petrarch: "Petrarch là học giả và thi sĩ Ý thế kỷ 14, thường được xem là “Cha đẻ của Chủ nghĩa Nhân văn”. Ông nổi tiếng với các bài sonnet và thi phẩm, đặc biệt là tập “Canzoniere” viết về tình yêu đơn phương dành cho Laura. Tác phẩm của Petrarch góp phần quan trọng vào sự hình thành chủ nghĩa nhân văn thời Phục Hưng, đề cao học thuật cổ điển và giá trị cá nhân."
  historical_character.christine_pizan: "Christine de Pizan là nhà văn và thi sĩ Pháp thế kỷ 14, nổi tiếng với các tác phẩm bảo vệ quyền phụ nữ và giáo dục nữ giới. Bà viết “The Book of the City of Ladies”, thách thức tư tưởng bài nữ đương thời và tôn vinh thành tựu của phụ nữ. Các trước tác của Christine là một trong những tiếng nói sớm nhất về bình đẳng giới tại châu Âu trung đại."
  historical_character.giotto_di_bondone: "Giotto di Bondone là họa sĩ và kiến trúc sư Ý thế kỷ 13–14, nổi tiếng với việc sử dụng phối cảnh và tính hiện thực đầy sáng tạo trong nghệ thuật. Tác phẩm của ông đánh dấu sự rời bỏ phong cách Byzantine cách điệu, đặt nền móng cho thời kỳ Phục Hưng. Các bích họa của Giotto tại Nhà nguyện Scrovegni ở Padua được xem là kiệt tác, ảnh hưởng đến nhiều thế hệ nghệ sĩ."
  historical_character.fibonacci: "Leonardo Fibonacci là nhà toán học người Ý thế kỷ XII–XIII, nổi tiếng với việc đưa hệ thống chữ số Ấn Độ–Ả Rập vào châu Âu. Tác phẩm \"Liber Abaci\" của ông đã phổ biến việc sử dụng chữ số Ả Rập và phép tính số học trong thế giới phương Tây. Ông cũng được biết đến với dãy số Fibonacci, một khái niệm toán học mô tả quy luật xuất hiện trong tự nhiên và nhiều lĩnh vực nghiên cứu."
  historical_character.giovanni_boccaccio: "Giovanni Boccaccio là nhà văn và thi sĩ người Ý thế kỷ XIV, nổi tiếng nhất với tác phẩm \"The Decameron\", tuyển tập những câu chuyện do mười người kể lại khi chạy trốn khỏi Đại Dịch. Lối kể chuyện sinh động cùng sự khai thác sâu sắc bản tính con người đã đưa ông trở thành nhân vật then chốt của văn học Phục Hưng sơ kỳ. Các tác phẩm của ông ảnh hưởng đến những tác giả về sau như Chaucer và góp phần định hình truyền thống văn học Ý."
  historical_character.snorri_sturluson: "Snorri Sturluson là sử gia, thi sĩ và chính khách người Iceland thế kỷ XIII, nổi tiếng với việc biên soạn \"Prose Edda\", một tác phẩm nền tảng của thần thoại Bắc Âu. Các trước tác của ông là nguồn tư liệu then chốt giúp hậu thế hiểu về di sản Bắc Âu. Ông cũng là tác giả của \"Heimskringla\", bộ biên niên sử về các vị vua Na Uy kết hợp giữa lịch sử và truyền thuyết."
  historical_character.hrotsvitha: "Hrotsvitha là nữ tu, thi sĩ và nhà soạn kịch người Đức thế kỷ X, được xem là nữ tác giả kịch đầu tiên của thời đại Kitô giáo. Sáng tác tại tu viện Gandersheim, bà viết kịch, thơ và truyền thuyết kết hợp chủ đề Kitô giáo với ảnh hưởng cổ điển, thường tôn vinh sức mạnh và trí tuệ của phụ nữ."
  historical_character.ramanuja: "Ramanuja là nhà thần học Ấn Độ thế kỷ XI, nổi tiếng với vai trò nền tảng trong việc hình thành truyền thống Sri Vaishnavism. Ông cổ vũ lòng sùng kính Vishnu và đề cao cách tiếp cận tâm linh mang tính cá nhân và từ bi. Cách diễn giải Vedanta của ông nhấn mạnh thuyết nhị nguyên có điều kiện, khác biệt đáng kể so với các trường phái khác."
  historical_character.arnaldus_de_villa_nova: "Arnaldus de Villa Nova là thầy thuốc, nhà giả kim và học giả người Catalan thế kỷ XIII, nổi tiếng với những đóng góp cho y học và hóa học. Ông là người sớm ủng hộ phương pháp khoa học trong thực hành y khoa và được ghi nhận với nhiều trước tác y học và giả kim. Công trình của ông ảnh hưởng sâu rộng đến tư tưởng y học châu Âu và sự hình thành của ngành hóa học."
  historical_character.ibn_khaldun: "Ibn Khaldun là học giả Ả Rập thế kỷ XIV đến từ Tunis, được xem là một trong những người đặt nền móng cho xã hội học, sử học và kinh tế học hiện đại. Tác phẩm nổi tiếng nhất của ông, \"Muqaddimah\" (Lời Dẫn), là nỗ lực sớm nhằm loại bỏ yếu tố huyền thoại khỏi hiện tượng lịch sử và xã hội, thay vào đó phân tích dựa trên quan hệ nhân quả, xung đột xã hội và các yếu tố kinh tế."
  historical_character.rumi: "Rumi là thi sĩ, nhà thần học và nhà huyền học Sufi người Ba Tư thế kỷ XIII. Di sản tâm linh sâu sắc của ông được thể hiện qua các tác phẩm thi ca, đặc biệt là \"Masnavi\", thường được gọi là \"Kinh Qur'an bằng tiếng Ba Tư\". Giáo huấn của ông đề cao tình yêu vô điều kiện, lòng khoan dung và việc tìm kiếm chân lý thiêng liêng thông qua trải nghiệm tâm linh cá nhân."
  historical_character.avicenna: "Avicenna, còn được biết đến với tên Ibn Sina, là học giả bách khoa người Ba Tư, được xem là một trong những thầy thuốc, nhà thiên văn, triết gia và tác gia quan trọng nhất của Thời đại Hoàng kim Hồi giáo. Ông nổi tiếng với các trước tác đồ sộ như \"The Book of Healing\" và \"The Canon of Medicine\", từng được sử dụng làm giáo trình y học tiêu chuẩn tại thế giới Hồi giáo và châu Âu trong nhiều thế kỷ."
  historical_character.averroes: "Averroes (Ibn Rushd) là học giả bách khoa người Andalusia thế kỷ XII, nổi tiếng với các trước tác về triết học Aristotle. Ông nỗ lực dung hòa truyền thống Hồi giáo với triết học Hy Lạp cổ điển. Những cố gắng lý tính hóa triết học đã khiến ông trở thành nhân vật trung tâm trong lịch sử tư tưởng Hồi giáo và châu Âu, góp phần quan trọng vào thời kỳ Phục Hưng."
  historical_character.al_biruni: "Al-Biruni là học giả bách khoa người Ba Tư thế kỷ XI, có đóng góp quan trọng trong nhiều lĩnh vực khoa học như thiên văn học, toán học và địa lý. Ông nghiên cứu sâu về bán kính Trái Đất và biên soạn công trình toàn diện về tôn giáo và triết học Ấn Độ sau khi tháp tùng các cuộc chinh phạt của Ghaznavid."
  historical_character.rashi: "Rashi (Shlomo Yitzchaki) là giáo sĩ Do Thái người Pháp thế kỷ XI, nổi tiếng với các chú giải toàn diện về Talmud và Kinh Thánh Hebrew. Các tác phẩm của ông có ảnh hưởng sâu rộng và lâu dài đối với việc học tập và luật Do Thái, giữ vị trí trung tâm trong giáo dục truyền thống Do Thái."
  historical_character.yehuda_halevi: "Yehuda Halevi là thi sĩ và triết gia Do Thái người Tây Ban Nha thế kỷ XII, nổi tiếng với thi ca giàu cảm xúc và các đối thoại triết học. Trong tác phẩm \"The Kuzari\", ông bảo vệ chân lý triết học của Do Thái giáo và bày tỏ khát vọng sâu sắc hướng về Zion. Trước tác của ông kết hợp lòng sùng tín tôn giáo với truyền thống trữ tình phong phú, đưa ông trở thành nhân vật trung tâm của văn học Hebrew trung đại."
  historical_character.shaprut: "Hasdai ibn Shaprut là thầy thuốc, nhà ngoại giao và học giả Do Thái thế kỷ X tại Tây Ban Nha Hồi giáo. Với vai trò cận thần của Caliph Abd ar-Rahman III, ông giữ vị trí quan trọng trong đời sống trí thức và ngoại giao tại Córdoba, thúc đẩy giao lưu văn hóa giữa học giả Do Thái và Hồi giáo."
  historical_character.gersonides: "Levi ben Gershon (Gersonides) là triết gia, nhà thiên văn và toán học Do Thái người Pháp thế kỷ XIV. Nổi tiếng với phương pháp tiếp cận khoa học, ông biên soạn nhiều trước tác có ảnh hưởng về toán học và thiên văn học. Ông cũng cải tiến thiết kế dụng cụ thiên văn và bàn luận sâu về ý chí tự do cùng tri thức tiên nghiệm của Thượng Đế."
  historical_character.ezra: "Abraham ibn Ezra là học giả, thi sĩ và học giả bách khoa Do Thái người Tây Ban Nha thế kỷ XII. Ông nổi tiếng với những đóng góp sâu sắc cho chú giải Kinh Thánh, chiêm tinh học và toán học, đồng thời chu du khắp Địa Trung Hải, gây ảnh hưởng đến các giới trí thức qua trước tác của mình."
  historical_character.gabriol: "Solomon ibn Gabirol là triết gia và thi sĩ Do Thái người Tây Ban Nha Hồi giáo thế kỷ XI. Nổi tiếng với các tác phẩm mang tư tưởng Tân Plato, đặc biệt là \"Fons Vitae\" (\"Suối Nguồn Sự Sống\"), ông bàn về bản chất của Thượng Đế và vũ trụ, ảnh hưởng mạnh đến tư tưởng Do Thái và Kitô giáo. Ông cũng là tác giả phong phú của thi ca Hebrew."
  historical_character.nachmanides: "Nachmanides, còn được biết đến với tên Moses ben Nahman hay Ramban, là học giả và thần học gia Do Thái thế kỷ XIII. Ông nổi tiếng với các chú giải sâu sắc về Torah và vai trò lãnh đạo cộng đồng Do Thái tại Girona. Năm 1263, ông bảo vệ đức tin Do Thái trong Cuộc Tranh Luận tại Barcelona. Trước tác của ông kết hợp luật Do Thái, huyền học và giáo huấn đạo đức."
  historical_character.crescas: "Hasdai Crescas là triết gia Do Thái thế kỷ XIV, nổi tiếng với việc thách thức triết học Aristotle đương thời. Ông được biết đến nhiều nhất qua tác phẩm triết học \"Or Adonai\" (\"Ánh Sáng của Chúa\"), trong đó phản bác quan điểm Aristotle và đặt nền móng cho triết học Do Thái hiện đại, ảnh hưởng đến các tư tưởng gia như Spinoza."
  historical_character.saadia: "Saadia Gaon là một triết gia, nhà thần học và học giả Do Thái thế kỷ X. Ông giữ chức vụ đứng đầu Học viện Sura danh tiếng và nổi tiếng với các công trình về luật Do Thái cùng trước tác triết học \"Emunoth ve-Deoth\" (\"Sách về Niềm tin và Quan điểm\"). Đây là nỗ lực đầu tiên có hệ thống nhằm kết hợp thần học Do Thái với các yếu tố của triết học Hy Lạp."
  historical_character.awkal: "Yusuf ibn 'Awkal là một thương nhân và lữ khách Do Thái thế kỷ X đến từ thế giới Hồi giáo, nổi tiếng với những ghi chép chi tiết về các chuyến buôn bán khắp Địa Trung Hải, Cận Đông và một số vùng châu Phi. Các bài viết của ông cung cấp những hiểu biết quý giá về hoạt động thương mại, sự giao thoa văn hóa và đời sống sôi động của các cộng đồng Do Thái dọc theo các tuyến đường giao thương."
  historical_character.benjamin_of_tudela: "Benjamin xứ Tudela là một nhà du hành và thám hiểm Do Thái thế kỷ XII. Ông được biết đến nhiều nhất với nhật ký hành trình \"The Travels of Benjamin\", ghi lại các chuyến đi qua châu Âu, châu Á và châu Phi. Ông đã cung cấp những mô tả chi tiết về các cộng đồng Do Thái trong thế giới trung cổ."
  historical_character.marco_polo: "Marco Polo là một thương nhân, nhà thám hiểm và nhà văn người Venezia đã du hành khắp châu Á dọc theo Con đường Tơ lụa từ năm 1271 đến 1295. Những ghi chép phong phú về chuyến đi đến Trung Quốc dưới thời Hốt Tất Liệt được xuất bản trong tác phẩm \"The Travels of Marco Polo\", mang đến cho người châu Âu cái nhìn toàn diện về các vùng đất và nền văn hóa châu Á."
  historical_character.bridget_of_sweden: "Bridget của Thụy Điển là một nhà thần bí và thánh nữ thế kỷ XIV, nổi tiếng với những thị kiến tôn giáo sâu sắc và việc sáng lập Dòng Bridgettine. Sau khi chồng qua đời, bà посвdedicated cuộc đời mình cho phụng sự tôn giáo và thực hiện nhiều cuộc hành hương đến các thánh địa."
  historical_character.meister_eckhart: "Meister Eckhart là một nhà thần học, triết gia và nhà thần bí thế kỷ XIII, nổi tiếng với những giáo lý có ảnh hưởng về bản chất của Thượng Đế và mối quan hệ giữa linh hồn con người với thần linh. Các bài giảng và tác phẩm của ông khám phá các chủ đề như sự buông bỏ, sự sinh ra của Thiên Chúa trong linh hồn và bản thể của tồn tại."
  historical_character.jangar: "Jangar là vị anh hùng huyền thoại trong sử thi Oirat \"The Epic of Jangar\". Ông nổi tiếng với việc xây dựng thành phố huyền ảo Shambhala và lãnh đạo dân tộc mình bằng trí tuệ và lòng dũng cảm. Những trận chiến chống kẻ thù và hành trình khôi phục hòa bình, thịnh vượng cho quê hương thể hiện những khát vọng và lý tưởng của người Oirat."
  historical_character.zawisza: "Zawisza Đen là một hiệp sĩ và chỉ huy quân sự Ba Lan thế kỷ XV, nổi tiếng về lòng dũng cảm và tinh thần hiệp sĩ. Ông lập công tại Trận chiến Grünwald năm 1410 và sau đó phục vụ tại nhiều triều đình hoàng gia. Ông hy sinh anh dũng trong cuộc vây hãm pháo đài Golubac năm 1428 khi tham gia thập tự chinh chống Đế quốc Ottoman."
  historical_character.theophanes_the_greek: "Theophanes người Hy Lạp là một họa sĩ Byzantine nổi bật. Ông mang chiều sâu cảm xúc và tính biểu cảm vào sự phát triển của nghệ thuật thánh tượng Nga, vượt ra khỏi phong cách Byzantine trang trọng truyền thống. Những đóng góp quan trọng nhất của ông bao gồm các bích họa tại Nhà thờ Biến Hình ở Novgorod và Nhà thờ Truyền Tin tại Moskva."
  historical_character.nicetas_choniates: "Nicetas Choniates là một quan chức chính quyền và sử gia Byzantine vào cuối thế kỷ XII và đầu thế kỷ XIII. Nổi tiếng với tác phẩm \"Chronicle\", ông ghi lại chi tiết đời sống và chính trị Byzantine từ năm 1118 đến 1207, bao quát sự suy tàn của Đế quốc Byzantine và các sự kiện của Cuộc Thập tự chinh thứ tư."
  historical_character.michael_psellos: "Michael Psellos là một triết gia, chính khách và sử gia Byzantine thế kỷ XI. Phục vụ tại triều đình dưới nhiều hoàng đế, ông đóng vai trò quan trọng trong việc phục hưng triết học và khoa học Hy Lạp tại triều đình Byzantine. Tác phẩm nổi tiếng nhất của ông, \"Chronographia\", cung cấp cái nhìn sâu sắc và chi tiết về chính trị và đời sống cung đình Byzantine."
  historical_character.john_tzetzes: "John Tzetzes là một học giả Byzantine thế kỷ XII, nổi tiếng với khối lượng trước tác đồ sộ và sự uyên bác về văn học cổ điển. Ông viết nhiều về ngữ pháp, lịch sử và thần thoại; tác phẩm nổi tiếng nhất là \"Chiliades\" hay \"Book of Histories\", tuyển tập các giai thoại lịch sử và thần thoại dưới dạng thơ."
  historical_character.theophylact_of_ohrid: "Theophylact là một tổng giám mục và học giả Byzantine thế kỷ XI. Trong thời gian giữ chức Tổng giám mục Ohrid, ông đóng vai trò quan trọng trong đời sống tôn giáo và văn hóa của khu vực, có ảnh hưởng đáng kể đến thần học Chính Thống giáo Đông phương."
  historical_character.eustathius_of_thessalonica: "Eustathius của Thessalonica là một học giả, nhà thần học và Tổng giám mục Thessalonica thế kỷ XII. Nổi tiếng với các trước tác phong phú, ông viết những bản chú giải chi tiết về tác phẩm của Homer. Thời kỳ làm tổng giám mục của ông gắn liền với nỗ lực tái thiết và cải tổ vai trò của giáo hội sau cuộc xâm lược Thessalonica của người Sicilia."
  historical_character.nicephorus_blemmydes: "Nicephorus Blemmydes là một học giả và nhà thần học Byzantine thế kỷ XIII. Ông sáng lập một trường học và một tu viện, nơi ông giảng dạy và sinh sống phần lớn cuộc đời. Ông viết nhiều về triết học, thần học và khoa học, cố gắng dung hòa tư tưởng triết học cổ điển với giáo lý Kitô giáo."
  historical_character.georgius_pachymeres: "Georgius Pachymeres là một sử gia và học giả Byzantine thế kỷ XIII, nổi tiếng với tác phẩm toàn diện \"Historia Byzantina\", ghi chép lịch sử Đế quốc Byzantine từ năm 1255 đến 1308. Các tác phẩm của ông cung cấp tường thuật chi tiết về triều đại Palaiologos và tác động của thời kỳ chiếm đóng Latinh."
  historical_character.manuel_moschopoulos: "Manuel Moschopoulos là một học giả và nhà ngữ pháp Byzantine vào cuối thế kỷ XIII và đầu thế kỷ XIV, nổi tiếng với vai trò phục hưng việc học tập và văn học Hy Lạp cổ điển. Ông viết nhiều về ngữ pháp và soạn các bản chú giải cho các tác giả cổ điển nhằm bảo tồn và làm sáng tỏ văn bản cổ."
  historical_character.theodore_metochites: "Metochites là một học giả uyên bác trước thời Phục Hưng, xuất sắc trong triết học, thiên văn học, toán học và nghệ thuật, từng giữ chức đại thần dưới triều Hoàng đế Andronikos II Palaiologos. Ông nổi tiếng với việc bảo trợ Nhà thờ Chora ở Constantinople, nơi ông cho thực hiện nhiều bức tranh khảm và bích họa quy mô lớn."
  historical_character.michael_choniates: "Michael Choniates là một học giả, thi sĩ và nhân vật giáo hội Byzantine thế kỷ XII, nổi tiếng với thời gian giữ chức Tổng giám mục Athens từ năm 1182 đến 1204. Trong bối cảnh quyền kiểm soát Byzantine suy yếu, ông nỗ lực duy trì các truyền thống văn hóa và trí thức của Athens."
  historical_character.joseph_tarchaneiotes: "Joseph Tarchaneiotes là một tướng lĩnh Byzantine hoạt động vào cuối thế kỷ XI, chủ yếu được biết đến với vai trò trong các chiến dịch quân sự chống lại người Seljuk. Phục vụ dưới triều Hoàng đế Alexios I Komnenos, ông giữ vai trò quan trọng trong nhiều trận đánh then chốt, bao gồm việc phòng thủ thành công Nicaea."
  historical_character.gemistus_pletho: "Gemistus Pletho là một triết gia thế kỷ XV. Là người ủng hộ mạnh mẽ chủ nghĩa Tân Plato, ông đóng vai trò quan trọng trong sự phục hưng trí thức trước khi Constantinople thất thủ. Ông có ảnh hưởng lớn tại Công đồng Florence, nơi ông lập luận ủng hộ việc tái hợp Giáo hội Chính Thống và Công giáo."
  historical_character.arethas_of_caesarea: "Arethas của Caesarea là một tổng giám mục, học giả và nhà sưu tập bản thảo Hy Lạp cổ đại thế kỷ X. Với tư cách Tổng giám mục Caesarea ở Cappadocia, ông có đóng góp quan trọng cho đời sống trí thức và văn hóa Byzantine, góp phần bảo tồn tri thức cổ điển ảnh hưởng đến thời Phục Hưng sau này."
  historical_character.basil_lekapenos: "Basil Lekapenos là một hoạn quan và nhà quản trị quyền lực, giữ chức đại thần dưới triều nhiều hoàng đế Byzantine vào cuối thế kỷ X và đầu thế kỷ XI. Là con ngoài giá thú của Hoàng đế Romanos I, ông nắm giữ ảnh hưởng lớn trong triều đình thông qua chức vụ parakoimomenos, tức thị thần phụ trách nội cung."
  historical_character.john_the_orphanotrophos: "John the Orphanotrophos là một hoạn quan và quan chức triều đình có ảnh hưởng vào đầu thế kỷ XI dưới triều Hoàng đế Michael IV. Với vai trò đứng đầu cơ quan phụ trách phúc lợi cho trẻ mồ côi và người nghèo, ông tích lũy quyền lực và ảnh hưởng đáng kể."
  historical_character.samonas: "Samonas là một hoạn quan và quan chức triều đình có ảnh hưởng vào cuối thế kỷ IX và đầu thế kỷ X dưới triều Hoàng đế Leo VI the Wise. Xuất thân từ Samosata, ông thăng tiến nhờ giữ chức parakoimomenos, tức thị thần thân cận của hoàng đế, và nắm giữ quyền lực đáng kể trong triều đình Byzantine."
  historical_character.peter_the_eunuch: "Peter the Eunuch là một quan chức triều đình Byzantine nổi bật và cố vấn thân cận dưới triều Hoàng đế Michael IV vào thế kỷ XI. Với chức vụ parakoimomenos, ông đóng vai trò quan trọng trong việc hỗ trợ Michael IV lên ngôi và thúc đẩy lợi ích của tu viện Stoudios."
  historical_character.constantine_the_paphlagonian: "Constantine người Paphlagonia là một hoạn quan và quan chức triều đình Byzantine có ảnh hưởng vào thế kỷ IX. Ông giữ chức parakoimomenos, tức thị thần nội cung, dưới triều Hoàng đế Leo VI the Wise. Ông nổi tiếng với nỗ lực duy trì sự ổn định trong triều đình giữa thời kỳ âm mưu chính trị và phe phái đấu đá."
  historical_character.peter_the_stratopedarches: "Peter 'Stratopedarches' là một chỉ huy quân sự và hoạn quan nổi bật thế kỷ X, được mô tả là 'dồi dào sức mạnh thể chất'. Ông đóng vai trò quan trọng dưới triều Hoàng đế Basil II, đặc biệt trong cuộc nổi dậy do tướng Bardas Skleros lãnh đạo."
  historical_character.basilios_bessarion: "Basilios Bessarion là một học giả, triết gia và hồng y thế kỷ XV. Ông cải sang Công giáo và ủng hộ việc hợp nhất Giáo hội Chính Thống và Công giáo tại Công đồng Florence, cho rằng điều này sẽ củng cố sự đoàn kết Kitô giáo trước mối đe dọa Ottoman đang gia tăng."
  historical_character.demetrios_kydones: "Demetrios Kydones là một học giả, dịch giả và nhà ngoại giao nổi bật thế kỷ XIV, được biết đến với việc ủng hộ truyền thống Latinh và Công giáo Rôma trong Đế quốc Byzantine Chính Thống. Ông đã dịch nhiều tác phẩm của Thomas Aquinas và các triết gia kinh viện Latinh khác sang tiếng Hy Lạp."
  historical_character.manuel_holobolos: "Manuel Holobolos là một học giả và quan chức thế kỷ XIII, nổi tiếng với tài năng văn chương và hùng biện. Ông phục vụ trong nhiều vai trò hành chính dưới triều các hoàng đế Byzantine và được nhớ đến nhiều nhất qua những bức thư và bài diễn thuyết đầy thuyết phục."
  historical_character.john_axuch: "John Axuch là một chỉ huy quân sự Byzantine thế kỷ XII và là đại thần dưới triều Hoàng đế John II Komnenos. Nguyên là một người Seljuk bị bắt khi còn nhỏ và được nuôi dưỡng trong hoàng cung, ông đã trở thành cố vấn và bằng hữu thân cận nhất của hoàng đế."
  historical_character.mkhitar_gosh: "Mkhitar Gosh là một học giả, giáo sĩ và luật gia Armenia thế kỷ XII, nổi tiếng với những đóng góp cho luật pháp và văn học Armenia. Ông là tác giả của một trong những bộ luật thành văn sớm nhất của Armenia, \"Datastanagirk\" (\"Sách Luật\")."
  historical_character.shota_rustaveli: "Shota Rustaveli là một thi sĩ Georgia thế kỷ XII và là một trong những nhân vật vĩ đại nhất của văn học Georgia. Ông nổi tiếng với trường ca \"The Knight in the Panther's Skin\", được xem là kiệt tác của văn học dân tộc Georgia."
  historical_character.grigor_tatevatsi: "Grigor Tatevatsi là một triết gia, nhà thần học và học giả Armenia thế kỷ XIV, nổi tiếng với vai trò giảng dạy và đứng đầu trường học của Tu viện Tatev ở Armenia thời trung cổ."
  historical_character.sargis_pitsak: "Sargis Pitsak là một họa sĩ minh họa và chép sách bản thảo Armenia thế kỷ XIV, nổi tiếng với những đóng góp cho nghệ thuật chế tác sách thời trung cổ Armenia."
  historical_character.medici: "Averardo de' Medici, còn gọi là Bicci, là một tổ tiên sớm của gia tộc Medici lừng danh, dòng họ đã vươn lên quyền lực tại Florence thời Phục Hưng. Averardo có vai trò quan trọng trong việc đặt nền móng cho sự giàu có và vị thế chính trị - xã hội của gia đình."
  historical_character.borgia: "Alfonso de Borgia là một hồng y và nhà ngoại giao người Tây Ban Nha, sau này trở thành Giáo hoàng Callixtus III vào năm 1455. Trước khi lên ngôi giáo hoàng, ông là một luật gia và nhà quản trị được kính trọng, đóng vai trò quan trọng trong việc hòa giải các phe phái tại Thỏa ước Caspe."
  historical_character.william_wallace: "William Wallace là một hiệp sĩ Scotland và nhà lãnh đạo nổi bật trong các cuộc Chiến tranh giành độc lập của Scotland chống lại Anh vào cuối thế kỷ XIII. Nổi tiếng với chiến thuật táo bạo và tinh thần yêu nước mãnh liệt, ông đã đánh bại quân Anh tại Trận cầu Stirling năm 1297 và được bổ nhiệm làm Người Bảo hộ Scotland."
  historical_character.la_hire: "Étienne de Vignolles, thường được biết đến với tên La Hire, là một chỉ huy quân sự quan trọng trong giai đoạn cuối của Chiến tranh Trăm Năm. Nổi tiếng với lòng dũng cảm và tài năng chiến trận, ông là một trong những chỉ huy chủ chốt dưới quyền Jeanne d'Arc."
  historical_character.bar_sauma: "Rabban Bar Sauma là một tu sĩ Nestorian sau trở thành nhà ngoại giao xuất thân từ Trung Quốc thời nhà Nguyên. Ban đầu định hành hương đến Jerusalem nhưng không thành, ông sống nhiều năm tại Baghdad. Về sau, ông làm sứ thần Mông Cổ sang châu Âu, gặp gỡ các quốc vương châu Âu, Hoàng đế Byzantine và Giáo hoàng để bàn về khả năng liên minh Pháp-Mông Cổ."
  historical_character.hodja: "Nasreddin 'Hodja' là một nhân vật dân gian và biểu tượng văn học trong văn hóa Thổ Nhĩ Kỳ, thường được khắc họa như một ông lão thông thái, hóm hỉnh, đưa ra những lời khuyên ẩn ý hoặc rơi vào tình huống trớ trêu nhưng luôn giải quyết bằng trí tuệ và sự hài hước."
  historical_character.widukind_of_corvey: "Widukind xứ Corvey là một tu sĩ và sử gia người Sachsen thế kỷ X, nổi tiếng với tác phẩm \"Res gestae Saxonicae\", biên niên sử ghi lại công tích của người Sachsen, đặc biệt tập trung vào triều đại Hoàng đế Otto I."
  historical_character.roger_de_flor: "Roger de Flor là một đội trưởng lính đánh thuê và nhà phiêu lưu nổi bật cuối thế kỷ XIII và đầu thế kỷ XIV. Ban đầu là hiệp sĩ Dòng Đền, sau đó ông lãnh đạo đội Almogàvers và thành lập Công ty Catalan. Ông chiến đấu cho Andronikos II và Michael IX, nhưng bị Michael IX ám sát do ảnh hưởng ngày càng lớn trong Đế quốc Byzantine."
  historical_character.regino_of_prum: "Regino xứ Prüm là một tu sĩ Benedictine, sử gia và nhà lý luận âm nhạc nổi bật thế kỷ IX. Ông từng là viện trưởng Tu viện Prüm cho đến khi bị trục xuất năm 899, sau đó trở thành viện trưởng Tu viện Thánh Martin tại Trier. Ông nổi tiếng nhất với biên niên sử \"Chronicon\"."
  historical_character.geoffrey_of_monmouth: "Geoffrey xứ Monmouth là một giáo sĩ người Wales thế kỷ XII và là nhân vật quan trọng trong sự phát triển của sử học Anh và văn học Arthur. Tác phẩm tiêu biểu của ông, \"Historia Regum Britanniae\" (\"Lịch sử các Vua Anh\"), là một bản tường thuật mang tính giả lịch sử về các vị vua của Anh."
  historical_character.raiktor: "Năm 1081, giữa biến động sau khi Alexios I Komnenos lên ngôi, một tu sĩ tên Raiktor đã giả mạo mình là Hoàng đế bị phế truất Michael VII. Công tước Norman Robert Guiscard đã lợi dụng tuyên bố này để biện minh cho cuộc xâm lược Balkan. Dù sự lừa dối bị vạch trần, Guiscard vẫn tiếp tục chiến dịch, đưa Raiktor ra trước thành Dyrrachium để tìm kiếm sự ủng hộ. Khi mưu kế thất bại, Raiktor bị bỏ rơi và có lẽ bị thủ tiêu âm thầm."
  historical_character.nichiren: "Một nhà cải cách cấp tiến và không khoan nhượng của Phật giáo Nhật Bản, $Nichiren$ tuyên bố lòng sùng kính đối với Kinh Diệu Pháp Liên Hoa là con đường duy nhất dẫn đến sự cứu rỗi. Chỉ trích gay gắt các giáo phái đối thủ và sự tự mãn chính trị, ông đã phải chịu cảnh lưu đày và các âm mưu ám sát vì những lời dạy của mình. Di sản của ông đã khơi dậy sự ra đời của một trường phái Phật giáo dân tộc độc đáo tồn tại đến ngày nay."
  historical_character.dogen: "Người sáng lập tông phái Sōtō của Thiền tông Nhật Bản, được tôn kính với giáo lý về thiền định và tác phẩm lớn \"Shōbōgenzō\", định hình triết học Thiền Nhật Bản."
  historical_character.kokan_shiren: "Một thiền sư Rinzai, thi sĩ và sử gia thời Kamakura; biên soạn \"Zenrin Kokuhōki\" (một văn bản lịch sử Phật giáo quan trọng) cùng các tuyển tập thơ kết hợp tuệ giác Thiền với sự tao nhã văn chương."
  historical_character.jeong_mong_ju: "Một chính khách, học giả và thi sĩ cuối thời Goryeo, Jeong Mong-ju được tôn kính vì lòng trung thành tuyệt đối với triều đại trong những ngày cuối cùng. Là bậc thầy Tân Nho học và ngoại giao, ông phản đối sự trỗi dậy của triều Joseon và bị ám sát vì lập trường của mình. Bài thơ cuối cùng của ông, thể hiện lòng trung trinh son sắt, vẫn là một trong những thi phẩm nổi tiếng nhất Hàn Quốc."
  historical_character.yi_saek: "Một học giả Nho giáo then chốt cuối thời Goryeo, Yi Saek đã đưa Tân Nho học của Chu Hy vào Triều Tiên và đào tạo một thế hệ cải cách gia thời Joseon. Dù ủng hộ cải cách giáo dục, ông vẫn trung thành với triều Goryeo và từ chối phục vụ triều đại kế nhiệm. Ảnh hưởng của ông nối liền hai triều đại và định hình tư tưởng Hàn Quốc trong nhiều thế kỷ."
  historical_character.jinul: "Một thiền sư có tầm nhìn xa trông rộng thời Goryeo, $Ji_nul$ đã tìm cách cải cách Phật giáo Hàn Quốc thông qua việc thống nhất thực hành thiền định và nghiên cứu giáo lý. Sáng lập Tông phái Tào Khê tại Songgwangsa, ông nhấn mạnh sự giác ngộ cá nhân trong kỷ luật tu viện. Những lời dạy của ông đã đặt nền móng cho Thiền phái Hàn Quốc như được thực hành ngày nay, kết hợp giữa cái nhìn sâu sắc của Thiền tông với chiều sâu học thuật."
  historical_character.prapanca: "Thi sĩ cung đình và sử quan tại Java thời Majapahit, tác giả trường ca \"Nagarakretagama\" (1365) mô tả vinh quang và địa lý của Majapahit; tác phẩm là nguồn tư liệu quan trọng về lịch sử và nghệ thuật trị quốc Java."
  historical_character.tantular: "Thi sĩ Java nổi tiếng, Mpu Tantular là tác giả \"Kakawin Sutasoma\", nơi xuất hiện câu \"Bhinneka Tunggal Ika\" (\"Thống nhất trong Đa dạng\"), sau này trở thành quốc châm của Indonesia."
  historical_character.kanwa: "Thi sĩ cung đình dưới triều vua Airlangga, Mpu Kanwa sáng tác \"Kakawin Arjunawiwaha\", một trường ca kết hợp thần thoại Ấn Độ giáo với lý tưởng Java."
  historical_character.sedah: "Theo ủy thác của vua Jayabhaya, Mpu Sedah bắt đầu sáng tác \"Kakawin Bhāratayuddha\", bản chuyển thể từ Mahabharata, sau này được Mpu Panuluh hoàn thành."
  historical_character.panuluh: "Mpu Panuluh hoàn thành \"Kakawin Bhāratayuddha\" và sáng tác \"Kakawin Hariwangsa\", đóng góp lớn cho truyền thống văn học Java."
  historical_character.dharmaja: "Thi sĩ dưới triều vua Airlangga, Mpu Dharmaja nổi tiếng với \"Kakawin Smaradahana\", tác phẩm ảnh hưởng đến văn học Java hậu kỳ."
  historical_character.monaguna: "Mpu Monaguna được ghi nhận là tác giả \"Kakawin Sumanasantaka\", tác phẩm phản ánh sự hòa quyện giữa truyện tích Ấn Độ giáo và văn hóa Java."
  historical_character.kuturan: "Nhân vật tôn giáo được tôn kính trong lịch sử Bali, Mpu Kuturan có công thống nhất các tông phái Ấn Độ giáo tại Bali và thiết lập hệ thống Desa Adat, kết hợp luật tôn giáo và luật tục."
  historical_character.dwijendra: "Một lãnh đạo tâm linh có ảnh hưởng lớn trong việc truyền bá Ấn Độ giáo tại Lombok và Bali, Mpu Dwijendra nổi tiếng với giáo lý và việc xây dựng nhiều đền thờ trên các đảo."
  historical_character.kavindrarimathana: "Kavindrarimathana là một kiến trúc sư và kỹ sư nổi bật dưới triều vua Rajendravarman II, được cho là người thiết kế các đền quan trọng như Pre Rup và East Mebon, thể hiện trình độ kiến trúc cao của Đế quốc Khmer."
  historical_character.daun_penh: "Một góa phụ được tôn kính thế kỷ XIV, Daun Penh được cho là đã phát hiện các tượng Phật linh thiêng trong thân cây trôi trên sông Tonlé Sap khi lũ lụt xảy ra. Xem đó là điềm thiêng, bà lập đền trên đồi Wat Phnom để thờ phụng. Hành động sùng kính của bà khai sinh thành phố Phnom Penh, mang tên bà."
  historical_character.yue_fei: "Một trong những danh tướng được tôn vinh nhất Trung Hoa, Yue Fei xuất thân bình dân và trở thành trụ cột bảo vệ Nam Tống trước sự xâm lược của người Kim. Trung thành tuyệt đối với hoàng đế và lý tưởng thống nhất quốc gia, ông bị gian thần hãm hại và xử tử oan. Di sản của ông là biểu tượng của lòng yêu nước và chính trực."
  historical_character.wen_tianxiang: "Một học giả - tướng lĩnh được kính trọng cuối thời Nam Tống, Wen Tianxiang là biểu tượng kháng chiến chống Mông Cổ. Bị bắt sau khi triều đại thất thủ, ông từ chối phục vụ nhà Nguyên và hy sinh như một vị tử đạo. Thơ viết trong ngục, đặc biệt \"Chính Khí Ca\", khắc ghi ông như hình mẫu của đức hạnh và trung thành."
  historical_character.fan_zhongyan: "Chính khách, tể tướng và học giả Tân Nho giáo thời Bắc Tống, nổi tiếng với câu châm ngôn \"Lo trước thiên hạ, vui sau thiên hạ\"; thực hiện nhiều cải cách quan trọng nhằm cải thiện quản trị và phúc lợi xã hội."
  historical_character.li_qingzhao: "Một trong những nữ thi nhân vĩ đại nhất Trung Hoa, nổi tiếng với thể thơ Ci thời Tống, diễn tả sâu sắc nỗi mất mát cá nhân và vẻ tao nhã của thời đại đã qua."
  historical_character.qiu_chuji: "Đạo sĩ được tôn kính (một trong Thất Chân phương Bắc) và cố vấn của Thành Cát Tư Hãn; ông du hành từ Bắc Trung Hoa đến Trung Á để khuyên bảo về trị quốc và dưỡng sinh, góp phần định hình chính sách tôn giáo đầu thời Nguyên."
  historical_character.chu_van_an: "Chu Văn An là nhà giáo Nho học được kính trọng dưới triều Trần, đứng đầu Quốc Tử Giám tại Thăng Long; nổi tiếng vì sự chính trực, các cải cách giáo dục và bản sớ 'Thất trảm sớ' yêu cầu nhà vua trừng trị quan lại tham nhũng."
  historical_character.nguyen_thuyen: "Nguyễn Thuyên là quan lại – thi sĩ thế kỷ 13, được ghi nhận là người tiên phong sử dụng chữ Nôm (chữ viết tiếng Việt bản địa) trong văn học. Ông được nhớ đến với bài văn tế được truyền tụng là đã xua đuổi cá sấu, tượng trưng cho sức mạnh của ngôn ngữ và học vấn Đại Việt."
  historical_character.pham_ngu_lao: "Phạm Ngũ Lão là vị tướng lừng danh triều Trần, góp công đẩy lùi nhiều cuộc xâm lược của quân Mông Cổ trong thế kỷ 13. Xuất thân nông dân, ông vươn lên nhờ lòng dũng cảm và trở thành biểu tượng của tinh thần yêu nước (cũng là nhân vật trong một bài thơ nổi tiếng ca ngợi chí khí của ông)."
  historical_character.sakata_kintoki: "Một chiến binh hùng mạnh đến từ vùng núi Sagami, $dynn_Satake$ $Kin_toki$ được cho là đã phụng sự $dynn_Minamoto$ $Yorimitsu$ với sức mạnh và lòng trung thành lớn lao. Những chiến công huyền thoại của ông với tên gọi 'Kintarō' bao gồm vật gấu, nhổ bật cây và xông pha trận mạc."
  historical_character.takezaki_suenaga: "Một samurai trung thành mãnh liệt của Mạc phủ Kamakura, $dynn_Takezaki$ $Suenaga$ nổi danh nhờ lòng dũng cảm trong các cuộc xâm lược của quân Mông Cổ vào Nhật Bản. Quyết tâm được công nhận xứng đáng cho công lao của mình, ông đã cho thực hiện các cuộn tranh minh họa ghi lại chiến tích."
  historical_character.eisai: "Sinh ra trong một gia đình phục vụ đền thờ, $Eisai$ trở thành tăng sĩ nhưng không hài lòng với các tông phái Pundarika hay Tendai đang thịnh hành, nên đã sang Trung Quốc học giáo lý Dhyana (Thiền/Chan). Khi trở về, ông truyền bá những tư tưởng này tại Nhật Bản, sáng lập phái Thiền Rinzai, lập ngôi chùa đầu tiên và góp phần phổ biến lại trà xanh."
  historical_character.ippen: "$Ippen$ học kinh điển từ nhỏ trước khi trở lại đời sống thế tục. Trong chuyến hành hương đến Kumano, thần linh đã chỉ cho ông con đường giác ngộ: sự trì tụng xuất thần [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]. Được thần khải, $Ippen$ quay lại đời tu hành như một tăng sĩ Tịnh Độ tận tụy, đi khắp Nhật Bản cùng các môn đồ nhiệt thành và sáng lập phái Ji-shū."
  historical_character.myoe: "Mồ côi từ nhỏ, $MyO_e$ học qua nhiều tông phái khác nhau, với $Mongaku$ và $Eisai$ là những người thầy của ông, nhưng vẫn không thỏa mãn. Tìm kiếm sự tĩnh lặng khỏi các cuộc tranh luận nơi tự viện, ông quay về với giáo lý Kegon từng thịnh hành, làm mới nó bằng tư tưởng Shingon và Tendai, đồng thời bác bỏ sự say mê với [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]."
  historical_character.honen: "$HO_nen$ được xuất gia từ nhỏ sau khi cha bị sát hại và thăng tiến trong hàng ngũ tăng lữ Tendai. Không hài lòng khi thấy tăng sĩ sống sung túc trái ngược với cảnh khốn khó của dân chúng, $HO_nen$ nhìn nhận [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] là giáo lý mang tính phổ quát và trở thành một bậc thầy Tịnh Độ hàng đầu. Tư tưởng cấp tiến của ông khiến các tông phái khác phẫn nộ, dẫn đến việc ông bị lưu đày trong cuộc đàn áp Jogen."
  historical_character.shinran: "Mồ côi từ nhỏ, $Shinran$ xuất gia khi còn trẻ nhưng gặp nhiều trăn trở trong đời tu. Được chỉ dẫn trong một khải thị để tìm gặp tăng sĩ $HO_nen$, $Shinran$ trở thành đệ tử hàng đầu và cũng chịu lưu đày trong cuộc đàn áp Jogen. Kiên trì truyền giảng [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] Tịnh Độ cho dân chúng, về sau ông sáng lập tông phái riêng Jōdo Shinshū (Chân Tịnh Độ tông), hiện là tông phái được thực hành rộng rãi nhất tại Nhật Bản."
  historical_character.mibu_tadamine: "Dù xuất thân khiêm tốn, $Tadamine$ trở nên nổi tiếng nhờ thơ waka sau khi tham gia một cuộc thi, nhận được chiếu chỉ và sự bảo trợ từ gia tộc Fujiwara. Cùng với con trai $Tadami$, ông được xếp vào Ba Mươi Sáu Thi Ca Tiên của Nhật Bản, với hơn tám mươi mốt bài thơ được cho là có mặt trong các tuyển tập ngự soạn."
  historical_character.murasaki: "Chắt gái của thi nhân nổi tiếng Fujiwara Kanesuke, Lady Murasaki sinh ra trong gia tộc Yoshikado uyên bác và phục vụ với tư cách nữ quan cho Hoàng hậu Fujiwara Shōshi của Thiên hoàng Ichijo. Tài năng thơ ca của bà sớm được ghi nhận và bà được xếp vào Ba Mươi Sáu Nữ Thi Ca Tiên. Ngày nay bà được biết đến nhiều nhất qua nhật ký của mình, sự ganh đua với nữ sĩ #EMP Sei Shōnagon#!, và tác phẩm #EMP Tale of Genji#!, có lẽ là tiểu thuyết sớm nhất trong lịch sử."
  generic_importance: "Nhân vật này có tầm quan trọng lịch sử ngoài đời thực."
 
