 ### End Event ###
  bp3_survey.0010.t: "Kết Thúc"
  bp3_survey.0010.desc.border.success: "Những nỗ lực của chúng ta tại vùng biên giới của [province.GetName] đã đạt được thành công vang dội. Khu vực này nay đã được xác định rõ ràng là nằm dưới sự giám sát của [ROOT.Char.GetPrimaryTitle.GetName], và điều đó được phản ánh qua cách người dân nhắc đến nơi đây.\n\nNhiều người địa phương thậm chí còn nói về ta như thể ta đã là chúa tể của họ."
  bp3_survey.0010.desc.border.failure: "Bất chấp mọi cố gắng, mọi nỗ lực khẳng định quyền kiểm soát tại vùng biên của [province.GetName] đều thất bại, thậm chí có phần đáng xấu hổ. Một số cư dân vùng biên còn bắt đầu dùng câu “thành công như [ROOT.Char.GetTitledFirstName]” làm thành ngữ để chỉ những [ROOT.Char.GetWomenMen] trẻ tuổi bị từ chối.\n\nTa bắt đầu hối hận vì đã làm chuyện này..."
  bp3_survey.0010.desc.bureaucracy.success: "Ban đầu mọi thứ tưởng chừng như bất khả thi, nhưng bằng cách nào đó ta đã tìm ra con đường để bắt đầu chấn chỉnh lại tình hình tại [province.GetName], chấm dứt một phần tham nhũng và nạn thảo khấu địa phương. Dù đây mới chỉ là bước đi đầu tiên, nó vẫn vô cùng quan trọng cho tương lai của huyện.\n\nGiờ chỉ cần bảo đảm rằng chúng ta tiếp tục đi đúng hướng trong thời gian tới."
  bp3_survey.0010.desc.bureaucracy.failure: "Đã có lúc tưởng như nạn tham nhũng tại [province.GetName] sắp chấm dứt, nhưng cứ mỗi bước tiến lại xuất hiện một vấn đề mới. Luôn có thêm bọn thảo khấu cướp bóc, thêm quý tộc tham ô giấu thuế, hay thêm công trình cần tu sửa.\n\nDù ta đã nỗ lực hết mình, thì một [ROOT.Char.GetWomanMan] cũng chỉ có thể làm được đến thế..."
  bp3_survey.0010.desc.people.success: "Mức độ ủng hộ của dân chúng tại [province.GetName] đã tăng lên rõ rệt, đến mức một số người còn dùng câu “hãy giống như [ROOT.Char.GetFirstName]” như một thành ngữ. Chỉ là vấn đề thời gian trước khi họ học được cách trân trọng những bậc bề trên của mình.\n\nHy vọng họ sẽ nhớ điều này vào lần tới khi một chuyện nhỏ nhặt vô nghĩa nào đó phát sinh."
  bp3_survey.0010.desc.people.failure: "Dù ta đã nói chuyện và tiếp xúc với dân chúng tại [province.GetName] nhiều đến đâu, nơi đây vẫn bao trùm bởi bầu không khí bất mãn. Bất chấp mọi nỗ lực, ta không biết phải tiếp cận hay giải quyết vấn đề này ra sao.\n\nCó lẽ đây chưa phải lúc thích hợp — ít nhất là hiện tại."
  bp3_survey.0010.a: "Đúng như kế hoạch."
  bp3_survey.0010.b: "Ta sẽ quay lại và chấn chỉnh việc này vào một thời điểm khác."

  bp3_survey.0010.acceptance.positive: "Tăng mức chấp nhận [offer_vassalization|E] từ [THIS.Char.GetName]: "
