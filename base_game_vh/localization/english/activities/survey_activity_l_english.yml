 ### Setup Work ###
  activity_survey: "Thanh Tra"
  activity_survey_desc: "Tiến hành một cuộc thanh tra toàn diện lãnh thổ của Ngài để bảo đảm rằng vương quốc vận hành trơn tru, đồng thời tìm kiếm cơ hội cải thiện bộ máy quan liêu và tình hình hiện tại."
  activity_survey_tenet_bonus: "\n$BULLET_WITH_TAB$Sẽ nhận được [piety_experience|E] khi hoàn thành"
  activity_survey_host_desc: "[AddLocalizationIf( GetPlayer.GetGovernment.HasRule( 'merit' ), 'activity_survey_gain_merit_desc' )]$BULLET_WITH_TAB$Có thể nhận @pressed_claim![claims|E]\n$BULLET_WITH_TAB$Có thể tăng mức chấp nhận @vassal_icon![offer_vassalization|E]\n$BULLET_WITH_TAB$Có thể cải thiện @gold_icon![taxes|E] trong [county|E]\n$BULLET_WITH_TAB$Có thể cải thiện @development_icon![development|E] trong [county|E]\n$BULLET_WITH_TAB$Có thể cải thiện @control_icon![control|E] trong [county|E]\n$BULLET_WITH_TAB$Có thể cải thiện @stationed_regiment_icon![levies|E] trong [county|E]\n$BULLET_WITH_TAB$Có thể cải thiện @opinion_icon![opinion|E]\n$BULLET_WITH_TAB$Có thể cải thiện @domain_icon![county_opinion|E][AddLocalizationIf( GetPlayer.GetFaith.HasParameterByKey('inspections_unlocked_and_costs_piety' ), 'activity_survey_tenet_bonus' )]"
  activity_survey_guest_desc: ""
  activity_survey_conclusion_desc: "Chuyến hành trình này đã cho ta cơ hội quý giá để tận mắt chứng kiến lãnh thổ của mình, nhưng ta không thể ở đây mãi. Công việc đã hoàn tất, đã đến lúc trở về."
  activity_survey_selection_tooltip: "Đảm bảo vương quốc của Ngài được vận hành bởi những Bạn Tốt hành tận tụy thông qua một cuộc thanh tra kỹ lưỡng\n\nPhần thưởng dự kiến: $rewards_inspection_tt$"
  activity_survey_destination_selection: "\n[inspections|E] sẽ mang lại nhiều lợi ích hơn khi diễn ra tại các [counties|E] có [county_control|E] thấp hoặc nằm dọc biên giới với các [realms|E] ngoại bang, nơi bộ máy quan liêu địa phương đang hoạt động kém hiệu quả. Những khu vực này có thể mang lại nhiều cơ hội hơn và tăng [inspection_success_chance_no_prefix|E]."
  survey_activity_not_capital: "[inspections|E] không thể được tổ chức tại [capital|E]"
  survey_activity_on_cooldown: "[inspections|E] chỉ có thể được tổ chức tại một [county|E] mỗi #bold 5#! năm"
  rewards_inspection_tt: "\n$BULLET_WITH_TAB$@pressed_claim![claims|E] & mức chấp nhận @vassal_icon![offer_vassalization|E]\n$BULLET_WITH_TAB$@gold_icon![taxes|E], @development_icon![development|E], & @control_icon![control|E]\n$BULLET_WITH_TAB$@stationed_regiment_icon![levies|E], @opinion_icon![opinion|E], & @domain_icon![county_opinion|E]"
  activity_survey_predicted_cost: "Chi phí của một [inspection|E] chủ yếu bị ảnh hưởng bởi mức ngân sách được phân bổ cho [activity|E]. Nguồn lực càng nhiều thì việc hoàn thành nhiệm vụ càng dễ dàng, nhưng chi phí cũng sẽ cao hơn."
 
  activity_survey_gain_merit_desc: "$BULLET_WITH_TAB$$may_gain_merit_desc$\n"
 
  phase_surveying: "Thanh Tra Lãnh Thổ"
  phase_surveying_desc: ""

  survey_overseer_intent: "Chủ Đích Giám Sát"
  survey_overseer_intent_desc: "Các quan chức và quý tộc địa phương vốn nổi tiếng vì thu thêm thuế và túi tiền sâu không đáy — đã đến lúc chấm dứt chuyện đó.\n\n#emp Tăng [inspection_success_chance_no_prefix|E]#!"

