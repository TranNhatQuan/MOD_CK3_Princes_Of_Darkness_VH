  inspection_reward_focused_popular_opinion_modifier: "Trọng Tâm Thanh Tra: Dân Ý"
  inspection_reward_focused_popular_opinion_modifier_desc: "Chúa tể địa phương đã dành nhiều thời gian đi khắp huyện và tiếp xúc với dân chúng."
  inspection_reward_focused_opinion_modifier: "Trọng Tâm Thanh Tra: Quan Hệ"
