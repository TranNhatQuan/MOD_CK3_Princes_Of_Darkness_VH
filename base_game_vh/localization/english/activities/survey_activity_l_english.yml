  InspectionFightingGuildsBakers: "$LocalGuildsBakers$"
  InspectionFightingGuildsFishmongers: "$LocalGuildsFishmongers$"
  InspectionFightingGuildsShoemakers: "$LocalGuildsShoemakers$"
