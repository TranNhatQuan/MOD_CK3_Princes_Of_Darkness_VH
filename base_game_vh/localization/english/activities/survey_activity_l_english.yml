  bp3_survey.0020.t: "Kế Hoạch Mở Rộng"
  bp3_survey.0020.desc: "Ta tiến đến vùng biên giới của [province.GetName], tận mắt chứng kiến rìa ngoài của lãnh thổ mình. Một vùng đất hoang vu, đang chờ đợi một [ROOT.Char.GetLadyLord] có tham vọng đủ lớn để nắm quyền kiểm soát. Một người biết nhìn ra tiềm năng.\n\n"
