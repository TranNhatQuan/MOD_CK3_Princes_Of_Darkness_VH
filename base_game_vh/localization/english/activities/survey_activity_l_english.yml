 ### Activity Option ###
  inspection_option_allocated_funds: "Ngân Sách Thanh Tra"
  inspection_no_funding: "Không Cấp Ngân Sách"
  inspection_no_funding_desc: "$EFFECT_LIST_BULLET$ [skill_challenges|E] sẽ khó thành công hơn\n$EFFECT_LIST_BULLET$ Chi phí [gold_i] [gold|E] trong các sự kiện giữ nguyên\n\n#weak Với nguồn ngân sách hạn chế hoặc không có, sẽ rất khó tìm đủ tài chính để hỗ trợ mọi mục tiêu trong tỉnh.#!"
  inspection_small_fund: "Ngân Sách Đủ Dùng"
  inspection_small_fund_desc: "$EFFECT_LIST_BULLET$ [skill_challenges|E] trong [activity|E] có tỷ lệ thành công cao hơn\n$EFFECT_LIST_BULLET$ Chi phí [gold_i] [gold|E] trong sự kiện giảm #P 20%#!\n\n#weak Với một khoản vàng nhỏ, việc tài trợ cho những cải tổ cần thiết trong tỉnh sẽ dễ dàng hơn.#!"
  inspection_large_fund: "Ngân Sách Dồi Dào"
  inspection_large_fund_desc: "$EFFECT_LIST_BULLET$ [skill_challenges|E] trong [activity|E] có tỷ lệ thành công cao hơn đáng kể\n$EFFECT_LIST_BULLET$ Chi phí [gold_i] [gold|E] trong sự kiện giảm #p 40%#!\n\n#weak Với nguồn ngân sách lớn, khó có điều gì trong tỉnh mà Ngài không thể chi trả.#!"

 ### Intro Event ###
  bp3_survey.0005.t: "Đến Nơi"
  bp3_survey.0005.desc.holder: "Khi ta đến [ROOT.Char.GetCurrentLocation.GetName], ta được đưa tới một phòng làm việc nhỏ, nơi [county_holder.GetTitledFirstName] tiếp đón ta. Ta đã cử sứ giả báo trước, vì vậy việc ta xuất hiện ở đây không nên khiến [county_holder.GetSheHe] bất ngờ, nhưng rõ ràng [county_holder.GetSheHe] vẫn tò mò về lý do ta đến. Sự sốt sắng và lo lắng của [county_holder.GetHerHis] là vì lương tâm cắn rứt, hay chỉ đơn thuần là những lời khách sáo?\n\nDù sao đi nữa, hiện tại ta không đến đây để đối phó với [county_holder.GetHerHim], ta đến đây để..."
  bp3_survey.0005.desc.no_holder: "Khi ta đến [ROOT.Char.GetCurrentLocation.GetName], ta được đưa vào phòng làm việc. Một nhóm gia nhân lo liệu mọi thứ và lui tới không ngớt, cho đến khi ta yêu cầu họ rời đi. Làm sao ta có thể tập trung vào nhiệm vụ trước mắt nếu họ cứ chạy quanh như vậy?\n\nKhi mọi thứ đã yên ổn, ta cuối cùng cũng có thể bắt tay vào kế hoạch của mình, đó là..."
  bp3_survey.0005.a: "Mở rộng biên giới của ta."
  bp3_survey.0005.a.tt: "Cuộc [inspection|E] sẽ tìm cách:$SurveyArrivalIntroClaims$ $SurveyARrivalIntroVassals$"
  bp3_survey.0005.b: "Cải thiện bộ máy quan liêu tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
  bp3_survey.0005.b.tt: "Cuộc [inspection|E] sẽ tìm cách:$SurveyArrivalIntroTax$ $SurveyArrivalIntroDevelopment$ $SurveyArrivalIntroControl$"
  bp3_survey.0005.c: "Đảm bảo dân chúng nơi đây nhớ rõ vì sao ta là chúa tể của họ."
  bp3_survey.0005.c.tt: "Cuộc [inspection|E] sẽ tìm cách:$SurveyArrivalIntroLevy$ $SurveyArrivalIntroOpinion$ $SurveyArrivalIntroPopularOpinion$"

