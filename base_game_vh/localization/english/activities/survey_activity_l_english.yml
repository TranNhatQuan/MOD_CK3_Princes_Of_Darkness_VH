  InspectionFightingGuildsInnkeepers: "Phường Hội Chủ Quán Trọ"
  InspectionFightingGuildsArtists: "Phường Hội Nghệ Sĩ"

  inspection_fighting_guilds_innkeepers_guild_modifier: "Phường Hội Chủ Quán Trọ"
  inspection_fighting_guilds_innkeepers_guild_modifier_desc: "Thành phố này chịu ảnh hưởng mạnh mẽ từ một $inspection_fighting_guilds_innkeepers_guild_modifier$ hùng mạnh."
  inspection_fighting_guilds_artists_guild_modifier: "Phường Hội Nghệ Sĩ"
  inspection_fighting_guilds_artists_guild_modifier_desc: "Các nghệ sĩ từ khắp nơi đổ về để tham gia vào những hoạt động sáng tạo mà ta có thể dễ dàng bắt gặp ở mọi góc phố."
  inspection_learning_intent_local_guilds_modifier: "Các Phường Hội Địa Phương"
  inspection_learning_intent_local_guilds_modifier_desc: "Một số phường hội mới đã định cư tại lãnh địa này sau khi giao thiệp với chúa thượng ở những vùng khác trong lãnh thổ."

  bp3_survey.1040.t: "Ngọn Lửa Lan Rộng"
  bp3_survey.1040.desc: "Khi đang di chuyển qua các con phố của [province.GetName], đoàn tùy tùng của ta và ta bất ngờ bắt gặp một đám cháy đang tàn phá một trong những khu phố cổ nhất của thành phố. Nhiều người đứng chết lặng, mắt mở to vì kinh hoàng, hoặc lặng lẽ khóc bên những thi thể nằm rải rác trên mặt đường.\n\nKhoảng hơn chục binh lính đang tuyệt vọng cố gắng dập lửa trước khi nó kịp bùng lên khắp phần còn lại của thành phố và chỉ để lại tro tàn phía sau."
  bp3_survey.1040.a: "Phải cứu dân chúng!"
  bp3_survey.1040.a.win: "Ngươi giúp dập tắt đám cháy"
  bp3_survey.1040.a.loss: "Ngọn lửa vẫn lan rộng dù ngươi đã cố hết sức"
  bp3_survey.1040.a.death: "Mắc kẹt trong biển lửa"
  bp3_survey.1040.b: "Ta sẽ cấp ngân quỹ sau, trước mắt hãy cứu được gì thì cứu."
  bp3_survey.1040.c: "Một đám cháy còn lớn hơn sẽ đặt [county_owner.GetFirstNameNoTooltip] vào đúng vị trí của [county_owner.GetHerHis]."
  bp3_survey.1040.c.win: "Mọi người tin rằng ngươi đã cố gắng giúp đỡ"
  bp3_survey.1040.c.loss: "Mọi người biết rõ ngươi thực sự đã làm gì"
  bp3_survey.1040.d: "Ta không thể làm gì hơn ở đây..."
  bp3_survey.1040.destroyed_building: "Ngọn lửa lan rộng"

  inspection_fire_spreading_modifier: "Những Con Phố Bị Thiêu Rụi"
  inspection_fire_spreading_modifier_desc: "Việc thiêu rụi một phần mục nát cũ kỹ đã mở ra những cơ hội mới."
  inspection_selfless_ruler_modifier: "Vị Quân Chủ Vị Tha"
  inspection_selfless_ruler_modifier_desc: "Nhân vật này đã đặt sức khỏe của bản thân vào vòng nguy hiểm để giúp đỡ dân chúng."

  bp3_survey.1050.t: "Mở Rộng Tường Thành"
  bp3_survey.1050.desc: "Một lần nữa, ta lại thấy mình đang trò chuyện với một số người dân địa phương về việc nên ưu tiên tái cấu trúc [province.GetName] như thế nào. \"Hãy dời và xây lại những bức tường thành cũ, thưa chúa thượng,\" Đại úy [soldier_character.GetNameNoTooltip] của đội đồn trú địa phương nói với một nụ cười tinh quái, \"Hãy nghĩ xem chúng ta sẽ có thêm bao nhiêu không gian cho một khu dân cư mới!\"\n\n\"Không, không! Khu thương nhân cũ đang rất cần được tu sửa.\" [merchant_character.GetNameNoTooltip], một đại diện của các phường hội địa phương, chen ngang vào cuộc trò chuyện một cách không chút e dè. \"Hãy tưởng tượng xem thị trấn sẽ sôi động đến mức nào với một khu thương mại nhộn nhịp!\""
  bp3_survey.1050.a: "Hãy tập trung vào những bức tường thành cũ kỹ của [province.GetNameNoTooltip]."
  bp3_survey.1050.b: "Các thương nhân nói đúng."
  bp3_survey.1050.c: "Chúng ta không có đủ vàng để phân phát cho bất kỳ ai."

  inspection_expanding_walls_new_modifier: "Không Gian Mở Rộng"
  inspection_expanding_walls_new_modifier_desc: "Thị trấn này đã tìm được thêm không gian để mở rộng sau khi di dời một phần tường thành."
  inspection_expanding_walls_old_modifier: "Đầu Tư Cho Phường Hội"
  inspection_expanding_walls_old_modifier_desc: "Các phường hội địa phương đã nhận được một khoản lợi nhỏ sau khi một khoản vàng không nhỏ được phân bổ cho việc duy tu khu thương mại."
  inspection_learning_intent_building_modifier: "Thực Hành Xây Dựng"
  inspection_learning_intent_building_modifier_desc: "Sau khi tiếp thu một số phương thức từ những vùng khác trong lãnh thổ, thủ phủ đang tràn đầy sức sống."

  inspection_expanding_walls_new_desc: "\t#weak Tăng lên cho mỗi ô [building|E] trống#!"
  MODIFIER_DEFINITION_EXPANDING_WALLS_NEW_DESC: "\nHiệu ứng này tăng lên khi số ô [building|E] trống trong [barony|E] càng nhiều"

  inspection_expanding_walls_old_desc: "\t#weak Tăng lên cho mỗi [building|E]#!"
  MODIFIER_DEFINITION_EXPANDING_WALLS_OLD_DESC: "\nHiệu ứng này tăng lên khi số lượng [buildings|E] trong [barony|E] càng nhiều"

  bp3_survey.1060.t: "Mỏ Nhà Ai, Người Nấy Lo"
  bp3_survey.1060.desc: "Khi ta khảo sát vùng ngoại vi của [province.GetName], đoàn tùy tùng của ta và ta bắt gặp một con đường cũ hẻo lánh. Dù được che giấu khá kỹ, nó dẫn tới một mỏm đồi nhỏ, và cụ thể là một hang động, nơi chúng ta phát hiện nhiều dụng cụ khai thác bị bỏ hoang nằm rải rác trên nền hang.\n\n"
  bp3_survey.1060.desc.copper: "\"Thưa chúa thượng,\" một trong những binh sĩ của ta, [soldier_character.GetFirstNameNoTooltip], bất chợt thốt lên, \"Chẳng phải đây là một mạch đồng sao?\""
  bp3_survey.1060.desc.silver: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" một trong những binh sĩ của ta, [soldier_character.GetFirstNameNoTooltip], bất chợt kêu lên, \"Thứ lấp lánh này hẳn là bạc!\""
  bp3_survey.1060.desc.gold: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" một trong những binh sĩ của ta, [soldier_character.GetFirstNameNoTooltip], mắt mở to kinh ngạc, thốt lên, \"Đây có phải là một cục vàng không?\""
  bp3_survey.1060.a: "Chúng ta còn chờ gì nữa? Đào! ĐÀO!"

  inspection_learning_intent_flourishing_metal_trade_modifier: "Thị Trường Hưng Thịnh"
  inspection_learning_intent_flourishing_metal_trade_modifier_desc: "Lãnh địa này đã có được một thị trường hưng thịnh sau khi một mỏ được phát hiện ở nơi khác trong lãnh thổ."

  bp3_survey.1070.t: "Những Sai Lệch Thường Kỳ"
  bp3_survey.1070.desc.intro.personal: "Khi rà soát các khoản thuế do các quản lý và phó vương địa phương của ta thu về, ta nhận thấy những sai lệch rõ ràng giữa số liệu được ghi chép tại một số khu vực và số tiền thực tế ta nhận được.\n\n"
  bp3_survey.1070.desc.intro.vassal: "Khi rà soát các khoản thuế thu được trong thời gian [province.GetName] nằm dưới quyền cai trị của [county_owner.GetFirstNamePossessive], ta nhận thấy sự chênh lệch rõ ràng giữa số tiền ta đáng lẽ phải nhận và số tiền thực tế được nộp. Dù [county_owner.GetFirstNameNoTooltip] lẽ ra phải phát hiện ra điều này, các con số sai lệch đã được ghi nhận ngay từ trước khi chúng đến bàn làm việc của [county_owner.GetHerHis].\n\n"
  bp3_survey.1070.desc: "Bất kể rốt cuộc ai là người có lỗi, rõ ràng là phải có kẻ trả giá. Dân địa phương đã nộp đủ phần của họ, nhưng họ vẫn dễ bị bóc lột hơn so với những kẻ thực sự chịu trách nhiệm cho những 'sai sót' này."
  bp3_survey.1070.a: "Bọn quý tộc #emp sẽ#! phải trả đủ phần của chúng, bằng cách này hay cách khác."
  bp3_survey.1070.a.flavor: "Làm gương với những kẻ chịu trách nhiệm, để những kẻ còn lại biết điều gì đang chờ đợi."
  bp3_survey.1070.b: "Một khoản thuế một lần áp lên dân địa phương sẽ bù đắp được tổn thất này."
  bp3_survey.1070.b.flavor: "Dân chúng sẽ không hài lòng, nhưng số tiền này là cần thiết."
  bp3_survey.1070.c: "Lần này ta sẽ bỏ qua..."
  bp3_survey.1070.c.flavor: "Hy vọng sự khoan dung này sẽ được trân trọng."

  inspection_regular_irregularities_local_modifier: "Thuế Một Lần"
  inspection_regular_irregularities_local_modifier_desc: "Nhân vật này đã áp đặt một khoản thuế bất thường, chỉ thu một lần, lên dân địa phương để bù đắp cho những thiếu hụt do các chư hầu gây ra."
  inspection_regular_irregularities_modifier: "Hình Phạt Cưỡng Chế"
  inspection_regular_irregularities_modifier_desc: "Nhân vật này đã trừng phạt nghiêm khắc các chư hầu đã biển thủ tiền thuế cho bản thân."

  bp3_survey.1080.t: "Một Nơi Đáng Để Ghé Thăm"
  bp3_survey.1080.desc: "\"Hoàn toàn không an toàn chút nào đâu, [ROOT.Char.Custom('FormOfAddressForLiege')],\" một lữ khách trông tiều tụy nói với ta. \"Ta suýt nữa thì mất mạng.\" Đúng như lời [traveler_character.GetHerHis] nói, có vẻ như [traveler_character.GetSheHe] đã trải qua một chuyến đi vô cùng khắc nghiệt.\n\n"
  bp3_survey.1080.desc.holy_poi: "Dường như các tín đồ [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] từ khắp nơi đã đổ về [location_province.GetName] để chiêm ngưỡng thánh tích linh thiêng nhất, [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName], chỉ để rồi bị bọn tội phạm chặn đường."
  bp3_survey.1080.desc.poi: "Dường như người từ khắp nơi đã đến đây để chiêm ngưỡng [location_province.Custom('GetSpecialBuildingPrefix')][location_province.GetHolding.GetSpecialBuildingType.GetName], chỉ để rồi bị bọn tội phạm chặn đường."
  bp3_survey.1080.desc.holy_site: "Dường như các tín đồ [ROOT.GetCharacter.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] từ khắp nơi đã đến [location_province.GetName] để viếng thăm thánh địa địa phương, chỉ để rồi bị bọn tội phạm chặn đường."
  bp3_survey.1080.desc.outro: "Nếu ta để cho bọn cướp và du đãng tiếp tục săn mồi trên những du khách này... thì chỉ còn là vấn đề thời gian trước khi họ bắt đầu tìm đến những nơi khác."
  bp3_survey.1080.a: "Ta sẽ tuyển một đội tuần tra nhỏ để bảo vệ các lữ khách."
  bp3_survey.1080.b: "Hãy để dân chúng tự lo cho khách viếng thăm của họ."
  bp3_survey.1080.c: "Họ tự lo lấy thân mình."

  protected_poi_modifier_desc: "\nXác suất nhận [skill|E] Point từ [monument_expedition|E]: #p +10%#!"
  protected_holy_site_modifier_desc: "\nĐộ mộ đạo khi [pilgrimage|E]: #p +20#!"

  inspection_proteted_poi_levy_modifier: "Di Tích Được Bảo Vệ"
  inspection_proteted_poi_levy_modifier_desc: "Quân đồn trú đã được trưng dụng để bảo vệ di tích địa phương cùng vô số lữ khách.\n\n$protected_poi_modifier_desc$"

  inspection_protected_holy_site_levy_modifier: "Thánh Địa Được Bảo Vệ"
  inspection_protected_holy_site_levy_modifier_desc: "Quân đồn trú đã được trưng dụng để bảo vệ thánh địa địa phương cùng vô số khách hành hương.\n$protected_holy_site_modifier_desc$"

  inspection_protected_holy_poi_levy_modifier: "$inspection_protected_holy_site_levy_modifier$"
  inspection_protected_holy_poi_levy_modifier_desc: "Quân đồn trú đã được trưng dụng để bảo vệ thánh địa địa phương cùng vô số khách hành hương.\n$protected_poi_modifier_desc$ $protected_holy_site_modifier_desc$"

  inspection_protected_poi_gold_modifier: "Di Tích Có Quân Đồn Trú"
  inspection_protected_poi_gold_modifier_desc: "Di tích địa phương đã được bố trí một đội quân chuyên trách để bảo vệ nó cùng vô số lữ khách.\n$protected_poi_modifier_desc$"

  inspection_protected_holy_site_gold_modifier: "Thánh Địa Có Quân Đồn Trú"
  inspection_protected_holy_site_gold_modifier_desc: "Thánh địa địa phương đã được bố trí một đội quân chuyên trách để bảo vệ nó cùng vô số khách hành hương.\n$protected_holy_site_modifier_desc$"

  inspection_protected_holy_poi_gold_modifier: "$inspection_protected_holy_site_gold_modifier$"
  inspection_protected_holy_poi_gold_modifier_desc: "Thánh địa địa phương đã được bố trí một đội quân chuyên trách để bảo vệ nó cùng vô số khách hành hương.\n$protected_poi_modifier_desc$ $protected_holy_site_modifier_desc$"

  bp3_survey.1090.t: "Vùng Hậu Địa Ẩn Khuất"
  bp3_survey.1090.desc: ""Đến đây để tìm bọn săn trộm à?" Một thợ săn trông rách rưới hét lên với chúng ta khi ta tiến đến một khu trại nhỏ của [hunter_character.GetHerHis] trong chuyến khảo sát vùng hẻo lánh của [province.GetName]. \"Có rất nhiều thứ để tìm thấy, ngay cả khi đây không phải là đất hoàng gia thực sự. Ở [poaching_province.GetName] này, mọi [hunter_character.GetWomanMan] đều phải tự lo cho bản thân mình.\"\n\n\"Nếu ngài muốn khẳng định quyền sở hữu của mình trên những vùng đất này, ngài cần một người có thể thường xuyên xuất hiện thay mặt cho ngài, nếu ngài hiểu ý ta.\" [hunter_character.GetSheHe|U] tiếp tục nói với một cái nháy mắt, trước khi [hunter_character.GetSheHe] cắn một miếng thịt nướng. Một nhóm người có thể cho tất cả mọi người ở đây thấy rằng vùng đất này thực sự thuộc về ta? Có lẽ đó cũng không phải là một ý tưởng tồi..."
  bp3_survey.1090.a: "Chúng ta sẽ thuê một số lính canh để tuần tra vùng hậu địa."
  bp3_survey.1090.b: "Tuyển mộ các thợ săn địa phương vốn đã thông thạo khu vực này."
  bp3_survey.1090.c: "Vài tên săn trộm thì có gì đáng bận tâm?"

  inspection_hidden_hinterlands_modifier: "[hunt_success_chance|E]: #p +10%#!\n[hike|E] [prestige_experience|E]: #P +25%#!"

  inspection_hidden_hinterlands_recruit_modifier: "Tuần Tra Hoang Dã"
  inspection_hidden_hinterlands_recruit_modifier_desc: "Một đơn vị lính canh được bố trí nhằm đảm bảo khu vực này có ít thợ săn trộm và tội phạm nhất có thể.\n\n$inspection_hidden_hinterlands_modifier$"

  inspection_hidden_hinterlands_hunters_modifier: "Thợ Săn Địa Phương"
  inspection_hidden_hinterlands_hunters_modifier_desc: "Một nhóm thợ săn địa phương đã được chúa tể của họ thuê để bảo vệ lãnh địa khỏi bọn săn trộm và tội phạm.\n\n$inspection_hidden_hinterlands_modifier$"

 ### Progression Events ###
  bp3_survey.1200.t: "Đạt Được Tiến Triển"
  bp3_survey.1200.desc: "Bất chấp vô số vấn đề và khó khăn mà ta đã đối mặt tại [province.GetName], ta cảm thấy mình đã dần hiểu rõ cách xoay xở và làm việc tại nơi này. Các địa chủ, các phường hội địa phương — tất cả đều đang bắt đầu chấp nhận cách làm của ta.\n\nGiờ đây, ta chỉ cần vạch ra một con đường cho tương lai của hạt này và tìm đúng những người có thể dẫn dắt nó đi theo con đường đó."
  bp3_survey.1200.a: "Hy vọng đây sẽ là những thử thách cuối cùng của ta tại đây."

  bp3_survey.1210.t: "Một Bước Đi Đúng Hướng"
  bp3_survey.1210.desc: "Sau một buổi tối dài thảo luận với các địa chủ địa phương, cuối cùng ta cũng đã đạt được một thỏa thuận với một trong những phường hội thương nhân trong vùng.\n\nHy vọng đây chỉ là khởi đầu cho việc đưa hạt này trở lại đúng quỹ đạo mà ta mong muốn. Giá như ta có thể tìm thêm được những tiếng nói ôn hòa hơn để ủng hộ những nỗ lực của mình."
  bp3_survey.1210.a: "Bước đầu tiên trong rất nhiều bước."

  bp3_survey.1220.t: "Một Bước Sẩy Chân"
  bp3_survey.1220.desc: "Sau một buổi tối dài thảo luận với các địa chủ địa phương, họ vẫn không thể tìm được tiếng nói chung. Dù đã cố gắng hết sức, ta cảm thấy động lực để duy trì trật tự nơi đây đang dần phai nhạt.\n\nSao họ không thể, chỉ một lần thôi, sống hòa thuận với nhau?"
  bp3_survey.1220.a: "Chỉ cần #bold nói chuyện#! với nhau thôi!"

  bp3_survey.1230.t: "Sai Lầm Nối Tiếp Sai Lầm"
  bp3_survey.1230.desc: "Sau một ngày dài trò chuyện với các địa chủ địa phương, ta lại phải đối mặt với một tranh chấp nhỏ giữa các phường hội thương nhân, ngay sau đó là những màn cãi vã không dứt của giới quý tộc.\n\nDù nhìn về đâu, ta cũng có cảm giác như lại có thêm một vấn đề đang chờ ta giải quyết. Có chuyện gì với những con người sống tại [province.GetName] vậy chứ?!"
  bp3_survey.1230.a: "Họ thậm chí có #emp muốn#! mọi thứ khá hơn không vậy?!"

