  inspection_empty_lands_domain_modifier: "Đường Thu Phí"
  inspection_empty_lands_domain_modifier_desc: "Vùng đất xa xôi này đã được cải thiện hệ thống đường sá địa phương.\n#emp Sẽ chuyển thành một [economic_building|E] nếu một [holding|E] được xây dựng#!"

  inspection_empty_lands_border_modifier: "Tiền Đồn Nhỏ"
  inspection_empty_lands_border_modifier_desc: "Một tiền đồn biên giới nhỏ được xây dựng như bước đầu tiên để khai phá khu vực này.\n#emp Sẽ chuyển thành một [fortification_building|E] nếu một [holding|E] được xây dựng#!"

  inspection_survey_new_goods_modifier: "Hàng Hóa Mới"
  inspection_survey_new_goods_modifier_desc: "Hạt này đã chứng kiến các loại hàng hóa mới xuất hiện sau khi lãnh chúa mở rộng lãnh thổ sang những vùng đất mới."

  bp3_survey.1010.t: "Bọn Du Côn Ở [province.GetNameNoTooltip]"
  bp3_survey.1010.desc: "Khi ta đang đi qua những con phố của [province.GetName], ta bất ngờ bắt gặp một [peasant_character.GetWomanMan] đang bị đe dọa bởi một tên côn đồ nào đó giữa ban ngày. [peasant_character.GetSheHe|U] kêu cứu, khi [peasant_character.GetSheHe] nhìn về phía ta và những người lính canh của ta.\n\nGần đây, một số lính đánh thuê trong thành phố đã chuyển sang con đường cướp bóc và phạm tội để kiếm sống, nhưng ta không ngờ mọi chuyện đã trở nên tồi tệ đến mức này. Liệu ta có muốn can thiệp và giúp đỡ [peasant_character.GetWomanMan] đáng thương này không?"
  bp3_survey.1010.a: "Ra lệnh cho lực lượng đồn trú đuổi chúng ra khỏi thành phố."
  bp3_survey.1010.a.win: "Tập hợp lực lượng đồn trú địa phương và loại bỏ bọn cướp"
  bp3_survey.1010.a.win_short: "Đã tập hợp đồn trú"
  bp3_survey.1010.a.lose: "Mọi chuyện trở nên tệ hơn nữa"
  bp3_survey.1010.a.lose_short: "Bọn Cướp Cố Thủ"
  bp3_survey.1010.b: "Có lẽ chúng sẵn sàng nhận một lời đề nghị công việc..."
  bp3_survey.1010.b.flavor: "Dù sao thì chúng cũng tỏ ra khá giỏi trong việc đối phó với dân địa phương."
  bp3_survey.1010.c: "Ta phải can thiệp!"
  bp3_survey.1010.c.win: "Dọa cho tên du côn bỏ chạy"
  bp3_survey.1010.c.win_short: "Đã dọa chạy du côn"
  bp3_survey.1010.c.lose: "Bị thương bởi tên du côn"
  bp3_survey.1010.d: "Đừng để [bandit_character.GetHerHim] lại gần ta!"
  bp3_survey.1010.d.flavor: "[bandit_character.GetSheHe|U] đang bận cướp người khác, mau tránh đi!"

  inspection_bandits_in_x_domain_modifier: "Đồn Trú Lính Đánh Thuê"
  inspection_bandits_in_x_domain_modifier_desc: "Một nhóm lính đánh thuê và bọn cướp đã được thuê để tăng cường cho lực lượng đồn trú địa phương."
  inspection_bandits_in_x_populace_modifier: "Lãnh Chúa Bảo Hộ"
  inspection_bandits_in_x_populace_modifier_desc: "Nhân vật này đã không ngần ngại bảo vệ thần dân của mình, thậm chí còn đặt cả tính mạng bản thân vào nguy hiểm."
  inspection_bandits_in_x_border_negative_modifier: "Bọn Cướp Tàn Nhẫn"
  inspection_bandits_in_x_border_negative_modifier_desc: "Bọn tội phạm kiểm soát chặt chẽ hạt này, phần lớn điều hành các hoạt động thường nhật sau hậu trường."
  inspection_bandits_in_x_border_positive_modifier: "Đường Phố An Toàn"
  inspection_bandits_in_x_border_positive_modifier_desc: "Người dân trong khu vực cảm thấy an tâm khi biết rằng bọn cướp không còn là một vấn đề hay mối đe dọa lớn."

  bp3_survey.1020.t: "Những Con Đường Cũ Của [province.GetCounty.GetName]"
  bp3_survey.1020.desc: "Khi Ta di chuyển qua [province.Custom('HoldingNoHoldingTerrainRoamingTooltip')], Ta suy ngẫm về một vấn đề quá đỗi quen thuộc. Ngay khi rời khỏi thành phố, chúng Ta đã mắc kẹt trong những vũng bùn lầy và phải đi theo những lối mòn chẳng dẫn tới đâu.\n\nNhững con đường cũ này hầu như không còn tác dụng gì, nếu còn có thể gọi là có tác dụng. Trừ khi ta dành người ra để bắt đầu sửa chữa, tình trạng này rất có thể sẽ ảnh hưởng tới người dân địa phương và các thương nhân ngoại quốc, nếu như nó chưa xảy ra."
  bp3_survey.1020.a: "Ta sẽ phân bổ khoản kinh phí cần thiết cho việc này."
  bp3_survey.1020.b: "Trưng dụng dân chúng."
  bp3_survey.1020.c: "Lực lượng đồn trú có thể lo liệu việc này."
  bp3_survey.1020.d: "Đây không phải là vấn đề quá nghiêm trọng."

  inspection_value_old_roads_desc: "\t#weak Tăng thêm cho mỗi #bold 3#! [development|E] thấp hơn #bold 30#!#!"
  MODIFIER_DEFINITION_OLD_ROADS_DESC: "\nChỉ số này tăng lên khi [development|E] càng thấp"

  inspection_old_roads_of_x_border_modifier: "Đường Mới"
  inspection_old_roads_of_x_border_modifier_desc: "Một khoản vàng đáng kể đã được phân bổ để duy tu hệ thống đường sá địa phương."
  inspection_old_roads_of_x_domain_modifier: "Bảo Trì Đồn Trú"
  inspection_old_roads_of_x_domain_modifier_desc: "Lực lượng đồn trú địa phương đã được giao nhiệm vụ bảo trì những con đường cũ kỹ, xuống cấp của hạt."
  inspection_old_roads_of_x_populace_modifier: "Bảo Trì Bởi Dân Chúng"
  inspection_old_roads_of_x_populace_modifier_desc: "Người dân trong hạt đã bị ép buộc tham gia vào công tác bảo trì đường sá."
  inspection_old_roads_negative_modifier: "Đường Sá Xuống Cấp"
  inspection_old_roads_negative_modifier_desc: "Những con đường cũ trong hạt đã rơi vào tình trạng xuống cấp từ lâu và đang rất cần được bảo trì."

  bp3_survey.1030.t: "Xung Đột Giữa Các Phường Hội"
  bp3_survey.1030.desc: "Khi ta đang ở giữa cuộc thảo luận với một viên quan lại, ta đột ngột bị gián đoạn bởi hai nhóm người đang la hét vào mặt nhau chỉ cách đó vài bước chân. Đội cận vệ của ta khó nhọc lắm mới tách được họ ra, trong khi đại diện của hai phe vẫn tiếp tục gào thét vào nhau.\n\nSau nhiều lần cố gắng trấn an họ, cuối cùng ta cũng hiểu rằng đây là một cuộc đối đầu giữa [city_province.Custom('InspectionFightingGuilds1Loc')] và [city_province.Custom('InspectionFightingGuilds2Loc')] về quyền sở hữu tài sản tại khu vực quan trọng nhất của trung tâm thành phố."
  bp3_survey.1030.a: "Cả hai đều có chỗ đứng!"
  bp3_survey.1030.a.win: "Họ đạt được một thỏa hiệp"
  bp3_survey.1030.a.loss: "Nó biến thành một cuộc tranh giành quyền lực, ảnh hưởng đến toàn bộ [city_province.GetNameNoTooltip]"
  bp3_survey.1030.a.loss_short: "Họ từ chối thỏa hiệp"
  bp3_survey.1030.b: "Ủng hộ [city_province.Custom('InspectionFightingGuilds1Loc')]."
  bp3_survey.1030.c: "Hỗ trợ [city_province.Custom('InspectionFightingGuilds2Loc')]."
  bp3_survey.1030.d: "[city_province.Custom('InspectionFightingGuilds1Loc')] ư? [city_province.Custom('InspectionFightingGuilds2Loc')] á?! Hừ, đó là vàng của ta!"

