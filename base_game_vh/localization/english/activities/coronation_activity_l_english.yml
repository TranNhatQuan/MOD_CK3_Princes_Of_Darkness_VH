  coronation_location_hof_owned: "[THIS.Province.GetName] #bol không#! phải là một [holy_site|E] thuộc [realm|E] của [head_of_faith|E] của ngài"
  coronation_location_holy_site_host: "[THIS.Province.GetName] #bol không#! phải là một [holy_site|E] thuộc [realm|E] của ngài ([head_of_faith|E] của ngài không sở hữu [holy_site|E] nào)"
  coronation_location_neither_capital_nor_holy_site: "[THIS.Province.GetName] #bol không#! phải là [county_capital|E] cũng không phải là một [holy_site|E]"

 # Phases
  coronation_phase_preparations: "Khúc Dạo Đầu"
  coronation_phase_preparations_desc: ""
  coronation_phase_coronation: "Nghi Lễ"
  coronation_phase_coronation_desc: ""
  coronation_phase_feast: "Yến Tiệc"
  coronation_phase_feast_desc: ""

 # Types
  coronation_type_normal: "Lễ Đăng Quang"
  coronation_type_normal_desc: "$BULLET_WITH_TAB$Chứng minh [legitimacy_i][legitimacy|E] của Ngài\n$BULLET_WITH_TAB$Tuyên thệ một [oath|E] và định hướng triều đại của Ngài\n$BULLET_WITH_TAB$Có thể nhận [opinion_i][opinion|E] từ [vassals|E] [AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'coronation_type_tributaries' )]\n$BULLET_WITH_TAB$[vassals|E] có thể rời khỏi @faction_icon![factions|E]\n$BULLET_WITH_TAB$Có thể tự đội vương miện để nhận thêm [prestige_i][prestige|E]\n\n#weak $coronation_type_normal_flavor$#!"
  coronation_type_normal_flavor: "Một nghi lễ trang nghiêm sẽ chứng minh tính chính danh của triều đại Ngài, và sự huy hoàng của vương quốc sẽ trở thành biểu tượng tối thượng cho quyền lực của Ngài."
  coronation_type_tributaries: "và [tributaries|E]"
  coronation_type_anointment: "Lễ Xức Dầu"
  coronation_type_anointment_desc: "$BULLET_WITH_TAB$Chứng minh [legitimacy_i][legitimacy|E] không còn nghi ngờ\n$BULLET_WITH_TAB$Nhận [piety_i][piety|E], @fervor_icon![fervor|E] và sự ủng hộ của [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U] [vassals|E]\n$BULLET_WITH_TAB$Tuyên thệ một [oath|E] và định hướng triều đại của Ngài\n$BULLET_WITH_TAB$Nhận [opinion_i][opinion|E] từ [vassals|E]\n$BULLET_WITH_TAB$Nhận [opinion_i][opinion|E] từ các [rulers|E] khác\n$BULLET_WITH_TAB$[vassals|E] có thể rời khỏi @faction_icon![factions|E]\n$BULLET_WITH_TAB$@alert_icon! #alert_trial Phải được tổ chức tại một [holy_site|E] của [faith|E] của Ngài#!\n\n#weak $coronation_type_anointment_flavor$#!"
  coronation_type_anointment_flavor: "Một vị quân vương chân chính phải được bao bọc bởi mục đích thiêng liêng và được thiết lập bởi ân sủng thần linh. Sức mạnh trần thế không thể thay thế điều đó."

 # Options
  anointment_minimum: "[activity_option|E] không khả dụng cho [anointment|E]"
  ceremony_size: "Quy Mô Nghi Lễ"
  coronation_small_ceremony: "Nghi Thức Giản Dị"
  coronation_small_ceremony_desc: "$EFFECT_LIST_BULLET$Giảm [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$Các [rulers|E] ngoại quốc sẽ không tham gia [activity|E]\n$EFFECT_LIST_BULLET$Nếu [coronation_magnificence|E] thấp hơn #high 50#! khi Kết Thúc, Ngài sẽ nhận [GetModifier('ach_coronation_low_ceremony_modifier').GetNameWithTooltip] trong #high 10 năm#!\n\n#weak Ta đã là quân vương rồi, chẳng phải sao? Cớ gì phải long trọng hóa một hình thức đơn thuần như vậy...?#!"
  coronation_medium_ceremony: "Trang Nghiêm Truyền Thống"
  coronation_medium_ceremony_desc: "$EFFECT_LIST_BULLET$Tăng [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$[activity_guests|E] sẽ có khả năng tham gia cao hơn đôi chút\n\n#weak Những lời thề thiêng liêng của quyền lực cần được sánh đôi cùng không gian vương giả và một đại lễ trang nghiêm.#!"
  coronation_large_ceremony: "Vinh Quang và Huy Hoàng"
  coronation_large_ceremony_desc: "$EFFECT_LIST_BULLET$Tăng mạnh [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$[activity_guests|E] sẽ có khả năng tham gia cao hơn đáng kể\n\n#weak Giữa những thánh tích linh thiêng và châu báu lấp lánh, vang vọng âm nhạc mỹ lệ, sẽ có toàn thể gia tộc ta, các chư hầu và những vị khách danh giá từ phương xa.#!"
  ceremony_feast_type: "Yến Hội"
  ceremony_feast_type_austere: "Yến Lễ Khắc Khổ"
  ceremony_feast_type_austere_desc: "$EFFECT_LIST_BULLET$Giảm [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$Nếu [coronation_magnificence|E] thấp hơn #high 50#! khi Kết Thúc, Ngài sẽ nhận [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_coronation_low_feast', 'generic_coronation_low_feast' )] trong #high 10 năm#!\n\n#weak Một lời mời tham dự sự kiện lịch sử này chẳng lẽ vẫn chưa đủ vinh hạnh sao...?#!"
  generic_coronation_low_feast: "[GetModifier('ach_coronation_low_feast_modifier').GetNameWithTooltip]"
  mandala_coronation_low_feast: "[GetModifier('mandala_coronation_low_feast_modifier').GetNameWithTooltip]"
  ceremony_feast_type_regular: "Yến Tiệc Phù Hợp"
  ceremony_feast_type_regular_desc: "$EFFECT_LIST_BULLET$Tăng [coronation_magnificence|E]\n\n#weak Sẽ không có sự keo kiệt nào trong đại hội của giới quý tộc, cũng như bữa tiệc linh đình sau nghi lễ.#!"
  ceremony_feast_type_lavish: "Yến Tiệc Xa Hoa"
  ceremony_feast_type_lavish_desc: "$EFFECT_LIST_BULLET$Tăng mạnh [coronation_magnificence|E]\n$EFFECT_LIST_BULLET$Giảm nguy cơ xảy ra các sự kiện tiêu cực\n\n#weak Những món cao lương mỹ vị nối tiếp không dứt đang chờ đợi; những khoái lạc tráng lệ nhằm tô điểm cho bàn tiệc tối cao của bậc quân vương.#!"

  ach_coronation_low_ceremony_modifier: "Đăng quang trong lặng lẽ"
  ach_coronation_low_ceremony_modifier_desc: "Dân chúng hầu như còn chẳng hay biết vị quân vương này thực sự là chúa tể của họ, còn giới quý tộc thì thản nhiên quên đi những nghi lễ khai vị nghèo nàn ấy."
  ach_coronation_low_feast_modifier: "Giới quý tộc bị xúc phạm"
  ach_coronation_low_feast_modifier_desc: "Những buổi ăn mừng nghèo nàn đến mức xúc phạm xoay quanh lễ đăng quang của vị quân vương này đã khiến người tham dự tràn đầy khinh miệt, và hoàn toàn thiếu vắng cao lương mỹ vị."
  mandala_coronation_low_feast_modifier: "Thần dân bị xúc phạm"
  mandala_coronation_low_feast_modifier_desc: "$ach_coronation_low_feast_modifier_desc$"

 # Special Guests
  coronation_hof_guest: "Giáo chủ"
  coronation_hof_guest_desc: "$coronation_hof_guest_desc_for_host$"
  coronation_hof_guest_for_host: "Giáo chủ"
  coronation_hof_guest_desc_for_host: "Trong một lễ [anointment|E], [head_of_faith|E] phải là một [activity_guest|E] thì nghi lễ mới được xem là [legitimate|E].\n\nHãy đảm bảo sự ủng hộ của Giáo chủ bằng [interaction|E] [anointment_request|E]."

 # Doctrines related to Coronations
  doctrine_coronation_name: "Truyền thống đăng quang"
  doctrine_no_anointment_name: "Không xức dầu"
  doctrine_no_anointment_desc: "Trong đức tin này, không có dầu thánh nào chạm lên trán của các quân vương — con đường đến quyền lực của họ không cần sự xức dầu hay nghi lễ thần thánh."
  doctrine_anointment_permitted_name: "Cho phép xức dầu"
  doctrine_anointment_permitted_desc: "Ngay cả Hoàng đế cũng không cúi mình trước một nghi lễ duy nhất — dù Giáo chủ có thể chủ trì, quyền quyết định đăng quang vẫn thuộc về ngai vàng."
  doctrine_imperial_anointment_name: "Xức dầu hoàng đế"
  doctrine_imperial_anointment_desc: "Để trị vì với tư cách Hoàng đế mà không còn nghi ngờ nào, người ta phải quỳ gối — vì chỉ Giáo chủ mới có thể ban cho thẩm quyền tối hậu và không thể tranh cãi ấy."
  doctrine_parameter_no_anointment: "[characters|E] không thể sử dụng [activity_option|E] [coronation_anointment|E]"
  doctrine_parameter_theocratic_coronation: "[characters|E] có thể sử dụng [activity_option|E] [coronation_anointment|E]"
  doctrine_parameter_imperial_anointment: "[characters|E] có [title_tier|E] từ [empire|E] trở lên phải sử dụng [activity_option|E] [coronation_anointment|E] để nhận [law|E] [GetLaw('crowned_emperor').GetName]"
  doctrine_parameter_coronation_artifact: "[characters|E] của [faith|E] này phải có một [artifact|E] là [FAITH.Custom('CoronationRequiresArtifact')] để có thể sử dụng thêm các [activity_options|E]"
