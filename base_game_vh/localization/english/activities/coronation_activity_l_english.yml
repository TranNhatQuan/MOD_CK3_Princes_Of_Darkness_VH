  coronation_events.0200.t: "Khúc Dạo đầu"
  coronation_events.0200.desc.host: "Khách đã tề tựu. Từ gần, từ xa, vì trung thành, hay chỉ vì hiếu kỳ. Đám đông dày đặc những gương mặt mang theo kỳ vọng, toan tính, và đôi khi là chút ấm áp mong manh.\n\nTa cất giọng vừa đủ để trấn an người tham dự và chào đón họ đến lễ đăng quang của ta."
  coronation_events.0200.desc.guest: "Buổi tụ họp lộng lẫy đúng như mong đợi. Gương mặt quen lẫn lạ hòa vào nhau, những lời chào chỉ đủ ấm để giữ lễ. Khi chủ lễ cất tiếng, căn phòng theo bản năng mà lắng xuống.\n\n\"Bằng hữu của ta, chư hầu của ta, huyết thân của ta — sự hiện diện của các ngươi còn quý giá hơn bất kỳ vương miện nào. Trước khi nghi lễ bắt đầu, hãy ăn uống, chuyện trò tự nhiên… và hãy biết rằng ta ghi nhớ từng người đã đứng nơi đây hôm nay.\"\n\nMột lời hứa hiền hòa, hay một lời cảnh báo thầm lặng — tùy vào cách người ta lắng nghe."
  coronation_events.0200.a: "Chào mừng tất cả!"
  coronation_events.0200.b: "Nào, còn ai nữa ở đây?"

  coronation_events.0205.t: "Đại Lễ Đăng Quang"
  coronation_events.0205.meager: "Mọi chuẩn bị đã hoàn tất. Đoàn nghi lễ đạm bạc đang chờ đợi tại"
  coronation_events.0205.great: "Mọi chuẩn bị đã hoàn tất. Đại lễ long trọng nay đang chờ đợi tại"
  coronation_events.0205.hagia_sophia: "Đại Thánh đường Hagia Sophia, nơi ngự trị Thánh Trí của Thượng Đế."
  coronation_events.0205.st_peters: "Vương cung Thánh đường Thánh Phêrô, nơi ngự của vị đại diện tối cao của Đấng Christ."
  coronation_events.0205.saint_denis: "Vương cung Thánh đường Thánh Denis, nơi an nghỉ của vị thánh bảo hộ dân tộc Pháp."
  coronation_events.0205.westminster: "Tu viện Westminster uy nghi và cao quý."
  coronation_events.0205.reims: "Nhà thờ Đức Bà Reims, thánh đường của các bậc quân vương."
  coronation_events.0205.aachen: "Cung điện lừng danh Aachen của Charlemagne."
  coronation_events.0205.wawel: "Nhà thờ Wawel, mỹ lệ và trường tồn."
  coronation_events.0205.east_admin_location: "quần thể cung điện [location.GetTitle.GetNameNoTierPossessive] trong vẻ tĩnh lặng thanh nhã."
  coronation_events.0205.temple: "đại [host.GetFaith.HouseOfWorship] của [location.GetTitle.GetNameNoTierPossessive]."
  coronation_events.0205.east_admin_description: "\n\nTheo nhịp trống vang dội,"
  coronation_events.0205.silence: "\n\nTrong bầu không khí tĩnh lặng lạnh lẽo,"
  coronation_events.0205.cheers: "\n\nGiữa tiếng tung hô và hân hoan,"
  coronation_events.0205.desc.host_east_asian: "đoàn nghi trượng [ROOT.Char.Custom('GetTitleTierAdjective')] của ta tiến qua từng hàng ngũ [host.Custom('GetFighterTermPlural')] cùng quan lại. Phía sau, ta rời khỏi từ đường tổ tiên của gia tộc, nơi các nghi lễ đầu ngày đã được cử hành."
  coronation_events.0205.desc.guest_east_asian: "đoàn nghi trượng [ROOT.Char.Custom('GetTitleTierAdjective')] của [host.GetTitledFirstNamePossessive] tiến qua từng hàng ngũ [host.GetHerHis] [host.Custom('GetFighterTermPlural')] cùng quan lại. Phía sau, chúng ta rời khỏi từ đường tổ tiên của [host.GetTitleAsNameNoTooltip], nơi các nghi lễ đầu ngày đã được cử hành."
  coronation_events.0205.desc.host: "đoàn rước của ta rẽ lối giữa đám đông chen chúc của [ROOT.Char.Custom('SettlementCity')|l]: những [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] tinh nhuệ nhất đi trước, còn gia quyến [ROOT.Char.Custom('GetTitleTierAdjective')] theo sau."
  coronation_events.0205.desc.guest: "đoàn rước của [host.GetTitledFirstNamePossessive] rẽ lối qua đám đông, và tùy tùng của ta theo sau ở vị trí danh dự."
  coronation_events.0205.desc.low_magnificence_east_asian: "\n\nMột điềm xấu phủ lên các nghi lễ. Tổ tiên của [host.GetDynastyHouseName] sao có thể không hổ thẹn trước sự đăng vị đầy bất định này...?"
  coronation_events.0205.desc.medium_magnificence_east_asian: "\n\nMột cảm giác hy vọng lan tỏa trong không trung. Nghi lễ tôn kính kéo dài buổi sớm đã mang lại điềm lành, gắn kết buổi đại lễ này với quá khứ xa xưa."
  coronation_events.0205.desc.high_magnificence_east_asian: "\n\nSự tôn nghiêm kỳ diệu nâng tầm các nghi lễ buổi sớm, lan tỏa theo làn hương trầm, và được nuôi dưỡng bởi niềm kiêu hãnh vững chắc của tổ tiên [host.GetDynastyHouseName]."
  coronation_events.0205.desc.low_magnificence: "Một số [host.Custom('GetLocalCommonerTermPlural')] ngước nhìn chúng ta với ánh mắt trống rỗng; kẻ khác lẩm bẩm chế giễu. Có kẻ gào lên #EMP \"[host.GetTitleAsName] giả danh!\"#! và đám đông liền dâng trào, chỉ vừa bị những [host.Custom('GetFighterTermPlural')] ít ỏi dọc đường ngăn lại."
  coronation_events.0205.desc.medium_magnificence: "[host.Custom('GetLocalCommonerTermPlural')|U] chen chúc để được thoáng thấy vị [host.GetTitleAsNameNoTooltip|l] sắp đăng vị. Trên vai cha mẹ, giữa biển người, những đứa trẻ [location.GetCulture.GetName] nở nụ cười rạng rỡ."
  coronation_events.0205.desc.high_magnificence: "Tiếng tù và vang dội! Cờ xí tung bay trong sắc màu rực rỡ của [host.GetPrimaryTitle.GetAdjective]! [host.Custom('GetLocalCommonerTermPlural')|U] ca tụng vị [host.GetTitleAsNameNoTooltip|l], còn nữ nhân rơi lệ trong niềm hân hoan trước đoàn rước huy hoàng này."

  coronation_events.0205.a_low_magnificence_east_admin: "Chẳng được lòng người sống, cũng chẳng được lòng kẻ đã khuất..."
  coronation_events.0205.a_low_magnificence: "[ROOT.Char.GetFaith.HighGodName], xin dẫn dắt ta vượt qua đám ô hợp này..."
  coronation_events.0205.a_high_magnificence: "Và đại lễ đăng quang của ta #EMP mới chỉ vừa bắt đầu!#!"
  coronation_events.0205.a: "Khoảnh khắc vĩ đại nhất đang dần kề cận."
  coronation_events.0205.b: "Vị [ROOT.Char.GetTitleAsNameNoTooltip|l] này hẳn trông thật thảm hại..."
  coronation_events.0205.b_flavor_infirm: "...với chút sinh lực còn sót lại để cưỡi ngựa tới lễ đăng quang của chính mình."
  coronation_events.0205.b_improved: "Nhưng, may thay, giữa cảnh huy hoàng này, ắt sẽ ít ai để ý!"
  coronation_events.0205.c_low_magnificence_east_admin: "Kẻ có mắt ắt hiểu rõ hơn!"
  coronation_events.0205.c_low_magnificence: "Hãy nhìn kỹ đi, lũ dân đen! Ta đích thực là một [activity.GetHost.GetTitleAsNameNoTooltip|l] danh chính ngôn thuận."
  coronation_events.0205.c: "Ta chính là hiện thân hoàn mỹ của một [activity.GetHost.GetTitleAsNameNoTooltip|l] vĩ đại!"
  coronation_events.0205.d: "Giờ đây, hãy xem thực lực của vị [activity.GetHost.GetTitleAsNameNoTooltip] này."
  coronation_events.0205.e_east_admin: "Ánh kim ngân sẽ khôi phục điềm lành của ngày hôm nay!"
  coronation_events.0205.e: "Ánh kim ngân sẽ khôi phục vẻ huy hoàng của ngày hôm nay."
  coronation_events.0205.e.tt: "Một con [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')] được dắt vào, khoác vải dệt vàng; [ROOT.Char.CustomFixedRandom('GetExpensiveDrink_Singular')] tuôn chảy từ mọi đài phun; nhạc công ngồi trước đình trướng, ca tụng vinh quang của ngài."
  coronation_events.0205.e.toast: "[host.GetShortUIName] Không tiếc tay chi cho đại lễ"
  coronation_events.0205.f_east_admin: "Ta #EMP phải#! thân chinh phát biểu trước hội này."
  coronation_events.0205.f: "Bách tính đều biết ai mới là [ROOT.Char.GetTitleAsNameNoTooltip] của họ."
