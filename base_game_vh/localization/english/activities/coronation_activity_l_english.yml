 # Install Claimants
  coronation_events.0100.install_claimants: "Dựng lập người thừa kế hợp pháp"
  coronation_events.0100.install_claimants_flavor: "Ta thề sẽ đưa những người có quyền chính đáng lên ngai vàng của họ và lật đổ bọn tiếm quyền."
 # Mend the Fracture
  coronation_events.0100.mend_the_fracture: "Hàn gắn chia rẽ"
  coronation_events.0100.mend_the_fracture_flavor: "Ta thề sẽ hàn gắn sự chia rẽ văn hóa trong vương quốc và mang lại hòa bình cho vùng đất này."
 # Provide for the Warriors
  coronation_events.0100.provide_for_the_warriors: "Hậu thuẫn [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] của ta"
  coronation_events.0100.provide_for_the_warriors_flavor: "Ta thề sẽ rộng rãi ban phát cho những chiến binh của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 # Provide for the Faithful
  coronation_events.0100.provide_for_the_faithful: "Chăm lo cho tín đồ"
  coronation_events.0100.provide_for_the_faithful_flavor: "Ta thề sẽ bảo trợ cho các tín đồ trung thành của [ROOT.Char.GetPrimaryTitle.GetAdjective]."
 # Provide for the Poor
  coronation_events.0100.provide_for_the_poor: "Chăm lo cho người nghèo"
  coronation_events.0100.provide_for_the_poor_flavor: "Ta thề sẽ ban phát ân huệ từ thiện cho dân nghèo của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 # Repent
  coronation_events.0100.repent: "$GetRepentOathText$"
  coronation_events.0100.repent_flavor: "Ta thề sẽ sám hối vì những tội lỗi của mình."

  coronation_events.0100.opt_out: "Ta không thề điều gì cả."

  coronation_events.0110.t: "Lời Thề"
  coronation_events.0110.desc.intro: "[activity.GetHost.GetFirstName] đứng trước đám đông, bên cạnh chính [activity.GetHost.GetHerselfHimself], khi tất cả đều chờ đợi lời thề của [activity.GetHost.GetHerHis].\n\n"
 ## Diplomacy
  coronation_events.0110.desc.diplomacy_oath_1: "#emp \"Không một vương quốc nào có thể hưng thịnh trong cô độc. Quyền lực không chỉ nằm ở binh đao, mà còn ở những mối ràng buộc niềm tin, trong các hiệp ước được Ta luyện bằng lời nói và ý chí.\n\nTừ [activity.GetHost.GetCapitalLocation.GetName], ta sẽ dang tay kết giao, dệt nên những liên minh bảo vệ [activity.GetHost.GetPrimaryTitle.GetNameNoTier] cho muôn thế hệ.\"#!"
  coronation_events.0110.desc.diplomacy_oath_2: "#emp \"Sức mạnh của một vương quốc không chỉ đến từ liên minh, mà còn từ lời hứa thầm lặng về sự tiếp nối. Bằng cách bảo đảm [activity.GetHost.GetHouse.GetName] trường tồn, ta sẽ trao cho vương quốc một nền móng vững như đá.\n\nThông qua con cháu chúng ta, dòng dõi [activity.GetHost.GetHouse.GetName] sẽ không bao giờ đứt đoạn.\"#!"
 ## Martial
  coronation_events.0110.desc.martial_oath_1: "#emp \"Hôm nay ta đứng lên không chỉ để trị vì, mà để kiến tạo. Không chỉ giữ gìn những gì đang có, mà để tạo ra điều có thể trở thành. [activity.GetHost.GetPrimaryTitle.GetNameNoTier] không thể bị giam cầm trong ký ức hay bản đồ — nó phải lớn mạnh.\n\nVì tương lai của chúng ta, và của toàn dân.\"#!"
  coronation_events.0110.desc.martial_oath_2: "#emp \"Quá lâu rồi, những vùng đất thuộc về [activity.GetHost.GetPrimaryTitle.GetNameNoTier] đã phải chịu sự cai trị của những kẻ kém cỏi — những kẻ nhầm lẫn chiếm hữu với chính danh.\n\nĐiều đó chấm dứt từ hôm nay. Từ [activity.GetHost.GetCapitalLocation.GetName], họ sẽ biết thế nào là cai trị đích thực. Bởi ta.\"#!"
 ## Stewardship
  coronation_events.0110.desc.stewardship_oath_1: "#emp \"Một quân vương không chỉ bảo vệ biên cương, mà còn phải khiến cuộc sống bên trong đáng để sống. Ta sẽ gìn giữ hòa bình, chăm lo vương quốc, và hoạch định cho tăng trưởng, chứ không phải chiến tranh.\n\nTừ [activity.GetHost.GetCapitalLocation.GetName], ta sẽ đưa [activity.GetHost.GetPrimaryTitle.GetNameNoTier] bước vào một kỷ nguyên hoàng kim mới.\"#!"
  coronation_events.0110.desc.stewardship_oath_2: "#emp \"Không phải mọi di sản đều được tạo nên bởi chiến tranh. Có những di sản được dựng xây bằng đá, bằng mồ hôi và ý chí. Ta sẽ cải biến [activity.GetHost.GetPrimaryTitle.GetNameNoTier] với những công trình vĩ đại xứng đáng với tương lai.\n\nTừ [activity.GetHost.GetCapitalLocation.GetName], ta sẽ kiến tạo một vương quốc không chỉ trường tồn, mà còn bước vào một thời kỳ hoàng kim được hun đúc bằng sự tận tâm và tầm nhìn.\"#! "
 ## Intrigue

 ## Learning
  coronation_events.0110.desc.learning_oath_1: "#emp \"Đừng để một quân vương nhầm lẫn vô tri với sức mạnh. Một vương quốc được dẫn dắt bởi tri thức sẽ trường tồn hơn bất kỳ nỗi sợ nào.\n\nTừ [activity.GetHost.GetCapitalLocation.GetName], ta sẽ quy tụ những trí tuệ ưu tú nhất để định hình tương lai của [activity.GetHost.GetPrimaryTitle.GetNameNoTier].\"#!"
 ## Purge Pretenders
  coronation_events.0110.desc.purge_pretenders_oath: "#emp \"Những kẻ mạo xưng ngai vàng của [activity.GetHost.GetPrimaryTitle.GetName] sinh sôi như chuột cống. Và như loài vermin, chúng phải bị tiêu diệt.\"#!"
 ## End the Struggle
  coronation_events.0110.desc.end_the_struggle_oath: "#emp \"[activity.GetHost.MakeScope.Var('end_the_struggle_oath_type_var').Struggle.GetName] đã từ từ rút cạn sinh lực của biết bao thế hệ người dân [activity.GetHost.GetCulture.GetCollectiveNoun]. Mọi chuyện sẽ chấm dứt từ đây. Ta sẽ đặt dấu chấm hết cho sự phung phí tài nguyên vô nghĩa này và mở ra một kỷ nguyên mới của thịnh vượng chung trên toàn vùng. Cầu xin [activity.GetHost.GetFaith.HighGodName] chứng giám cho lời thề của ta.\"#!"
 ## Greatest Hunter
  coronation_events.0110.desc.greatest_hunter_oath: "#emp \"Săn bắn không chỉ là thử thách kỹ năng, mà còn là sự tôn vinh sự sống và thiên nhiên. Ta sẽ trở thành thợ săn vĩ đại nhất, chúa tể đích thực của vùng hoang dã [activity.GetHost.GetPrimaryTitle.GetNameNoTier].\"#!"
 ## Heir Preparation
  coronation_events.0110.desc.heir_preparation_oath: "#emp \"Không có người thừa kế xứng đáng, gia tộc [activity.GetHost.GetDynasty.GetName] tất sẽ rơi vào quên lãng. Ta sẽ đích thân dìu dắt việc giáo dưỡng người kế vị, truyền dạy những phẩm chất và trí tuệ cần thiết để đưa gia tộc [activity.GetHost.GetDynasty.GetName] vươn tới những đỉnh cao mới.\"#!"
 ## Install Claimants
  coronation_events.0110.desc.install_claimants_oath: "#emp \"Quyền thừa kế chính đáng không chỉ là huyết thống, mà còn là công lý. Ta sẽ dựng lập những người có quyền hợp pháp và quét sạch bọn tiếm quyền.\"#!"
 ## Mend the Fracture
  coronation_events.0110.desc.mend_the_fracture_oath: "#emp \"Sự chia rẽ văn hóa đã gieo rắc hỗn loạn quá lâu. Ta sẽ đoàn kết các dân tộc dưới ngọn cờ [activity.GetHost.GetHouse.GetName], trong khi vẫn tôn trọng bản sắc của họ.\"#!"
 ## Provide for the Warriors
  coronation_events.0110.desc.provide_for_the_warriors_oath: "#emp \"Những chiến binh của [activity.GetHost.GetPrimaryTitle.GetNameNoTier] là kiếm và khiên của ta. Ta sẽ bảo đảm họ được trang bị đầy đủ để bảo vệ lãnh thổ.\"#!"
 ## Provide for the Faithful
  coronation_events.0110.desc.provide_for_the_faithful_oath: "#emp \"Các tín hữu của [activity.GetHost.GetPrimaryTitle.GetNameNoTier] là trụ cột của vương quốc ta. Ta sẽ bảo đảm những nhu cầu trần thế của họ được đáp ứng, để họ có thể toàn tâm phụng sự [ROOT.Char.GetFaith.HighGodName], hầu mang lại sự cứu rỗi cho [activity.GetHost.GetPrimaryTitle.GetTierAsNamePossessive] của ta.\"#!"
 ## Provide for the Poor
  coronation_events.0110.desc.provide_for_the_poor_oath: "#emp \"Những người nghèo của [activity.GetHost.GetPrimaryTitle.GetNameNoTier] là muối của đất, là ánh sáng của thế gian. Họ lặng lẽ lao động vì lợi ích của mọi người. Ta sẽ bảo đảm rằng ngay cả những thần dân nghèo khó nhất trong vương quốc của ta cũng được sống với phẩm giá và hy vọng.\"#!"
 ## Repent
  coronation_events.0110.desc.repent_oath: "#emp \"Điều gì có thể thay đổi bản tính của một [activity.GetHost.GetWomanMan]? Ý chí của riêng ta liệu có đủ? Ta có thể thuyết phục những tín hữu khác của [activity.GetHost.GetFaith.GetAdherentNamePlural], liệu ta có thể khiến [activity.GetHost.GetFaith.HighGodName] tin rằng ta thực lòng ăn năn vì những tội lỗi của mình? Có lẽ đó là một nỗ lực ngốc nghếch, nhưng không cố gắng mới là tội lỗi nặng nề nhất.\"#!"

 ## Other
  coronation_events.0110.desc.fallback_compassionate: "#emp \"Ta thề sẽ tuân thủ mọi luật lệ công minh và tập tục của dân tộc [activity.GetHost.GetPrimaryTitle.GetAdjective]; cai trị bằng sự thông tuệ hiền đức, và phán xét bằng lòng khoan dung nhân từ.\"#!"
  coronation_events.0110.desc.fallback_honorable: "#emp \"Ta thề sẽ duy trì sự hòa hợp và an bình của các [activity.GetHost.GetFaith.AltPriestTermPlural] dưới danh nghĩa [activity.GetHost.GetFaith.HighGodNamePossessive] tại [activity.GetHost.GetPrimaryTitle.GetNameNoTier], và dùng danh dự của mình để bảo vệ quyền tự do cũng như lợi ích của nhân dân ta.\"#!"
  coronation_events.0110.desc.fallback_feckless: "#emp \"Ta... ờ... thề sẽ thực hiện các lời thề đúng mực của một [activity.GetHost.GetTierAsName] vùng [activity.GetHost.GetPrimaryTitle.GetNameNoTierPossessive]... từ nay về sau sẽ làm theo những gì các [activity.GetHost.GetFaith.AltPriestTermPlural] yêu cầu, và đáp lại khi vương quốc kêu gọi [activity.GetHost.GetTierAsNameNoTooltip] của nó, vân vân và mây mây...\"#!"
  coronation_events.0110.desc.fallback: "#emp \"Ta thề rằng dưới sự trị vì của ta, [activity.GetHost.GetPrimaryTitle.GetNameNoTier] sẽ đón nhận phồn vinh, phong tục của thần dân sẽ luôn được tôn trọng, và vinh quang sẽ thuộc về [activity.GetHost.GetPrimaryTitle.GetTierAsNameNoTooltip].\"#!"
  coronation_events.0110.regular: "Chúng ta sẽ xem liệu [activity.GetHost.GetSheHe] có xứng đáng với kỳ vọng hay không..."
  coronation_events.0110.no_oath: "Thật đáng thất vọng..."
  coronation_events.0110.desc.outro: ""


  coronation_events.0150.t: "Lời thề bị phản bội: [SCOPE.Custom('GetOathSpecific')|V]"
  coronation_events.0150.desc: "Ta nghe thấy những lời thì thầm sau cánh cửa khép kín. Ta thấy nỗi thất vọng hằn sâu trong ánh mắt họ. Và ta cảm nhận gánh nặng nhục nhã đè nén lên mình.\n\nTất cả đều biết — ta đã thất bại. Ta đã phá vỡ lời thề từng tuyên trước toàn thể thần dân.\n\nGiờ ta phải đối mặt với họ thế nào?"
  coronation_events.0150.desc_honest: "Quyền lực đến cùng với lời thề. Ta đã đứng trước toàn thể thần dân và tuyên thệ một lời thề mà họ tin tưởng — một lời thề mà chính #emp ta#! cũng tin tưởng.\n\nGiờ đây, ngai vàng chẳng khác nào một ngôi mộ hơn là chỗ ngự tọa. Một chiếc lồng mạ vàng lạnh lẽo, chế nhạo ta theo từng nhịp thở. Điều đau đớn nhất là biết rằng tất cả đều do chính ta gây nên."
  coronation_events.0150.desc_deceitful: "Cứ để họ thì thầm. Cứ để họ phẫn nộ. Nhưng xấu hổ ư? Không. Lời thề chỉ thiêng liêng với những kẻ ngu ngốc."
  coronation_events.0150.a: "Thật nhục nhã..."
  coronation_events.0150.a_honest: "Ta sẽ sống với nỗi hổ thẹn này ra sao?"
  coronation_events.0150.a_deceitful: "Mọi thứ vốn là như vậy."
  coronation_events.150.custom_list_tooltip: "Mọi [vassal|E], [courtier|E] hoặc [guest|E]"

  coronation_events.0175.t: "Hoàn thành lời thề: [SCOPE.Custom('GetOathSpecific')|V]"
  coronation_events.0175.desc: "Ta đã làm đúng như những gì đã hứa. Ta đã nghe sự chế nhạo của kẻ hoài nghi — và ta đã chứng minh họ sai.\n\nGiờ đây, họ trao cho ta sự tôn kính mà trước kia họ cho là ngoài tầm với.\n\nMột bình minh mới đã đến..."
  coronation_events.0175.a: "Và một [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] hùng cường hơn đã sẵn sàng đón nhận!"

 ## Diplomacy
  diplomacy_oath_1_tooltip: "Ta thề một [oath|E] nhằm #V Củng cố Liên minh#!:\n\t$EFFECT_LIST_BULLET$Cần có ít nhất #V 3#! [alliances|E] với các [rulers|E] thỏa điều kiện:\n\t\t$EFFECT_LIST_BULLET$Có ít nhất #V 50#! [opinion|E] đối với #V ngươi#!\n\t\t$EFFECT_LIST_BULLET$Thỏa mãn một trong các điều sau:\n\t\t\t$EFFECT_LIST_BULLET$Thấp hơn một bậc [title_tier|E]\n\t\t\t$EFFECT_LIST_BULLET$Cùng bậc [title_tier|E]\n\t\t\t$EFFECT_LIST_BULLET$Cao hơn một bậc [title_tier|E]\n\t$EFFECT_LIST_BULLET$Phải hoàn thành trong vòng #V 20 năm#!\n\t$EFFECT_LIST_BULLET$Phần thưởng: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [opinion_i][opinion|E], [cultural_acceptance_i][cultural_acceptance|E], và [GetModifier('oath_of_alliances').GetNameWithTooltip]"
  diplomacy_oath_2_tooltip: "Ta thề một [oath|E] nhằm #V Củng cố Gia tộc#!:\n\t$EFFECT_LIST_BULLET$Cần có ít nhất #V 7#! [children|E] [legitimate|E] #weak (Hiện tại [host.MakeScope.ScriptValue('children_oath_value')|V0]/#V 7#!)#!\n\t$EFFECT_LIST_BULLET$Phải hoàn thành trong vòng #V 30 năm#!\n\t$EFFECT_LIST_BULLET$Phần thưởng: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [dynasty_prestige_i][dynasty_prestige|E] và [GetModifier('oath_of_children').GetNameWithTooltip]"
 ## Martial
  martial_oath_1_tooltip: "Ta thề một [oath|E] nhằm #V Củng cố [host.GetPrimaryTitle.GetNameNoTierNoTooltip]#!:\n\t$EFFECT_LIST_BULLET$[host.GetPrimaryTitle.GetName] phải [completely_control|E] toàn bộ biên giới [de_jure|E] của mình #low (Hiện tại [host.MakeScope.ScriptValue('oath_reconquest_value_1')|V0]/[host.MakeScope.ScriptValue('oath_reconquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$Phải hoàn thành trong vòng #V 20 năm#!\n$EFFECT_LIST_BULLET$Phần thưởng: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], và [GetModifier('oath_of_reconquest').GetNameWithTooltip]"
  oath_reconquest_tooltip: "[completely_control|E] [de_jure|E] [THIS.Var('oath_reconquest_title').Title.GetName] #low ([root_scope.MakeScope.ScriptValue('oath_reconquest_value_1')]/[root_scope.MakeScope.ScriptValue('oath_reconquest_value_2')])#!"
  martial_oath_2_tooltip: "Ta thề một [oath|E] nhằm #V Mở rộng Lãnh thổ#!:\n\t$EFFECT_LIST_BULLET$[realm|E] phải đạt quy mô ít nhất là [host.MakeScope.ScriptValue('oath_conquest_value_1')|V0] #low (Hiện tại [host.MakeScope.ScriptValue('oath_conquest_value_2')|V0])#!\n$EFFECT_LIST_BULLET$Phải hoàn thành trong vòng #V 20 năm#!\n$EFFECT_LIST_BULLET$Chọn giữa một ân huệ dành cho [capital|E] hoặc việc điều chỉnh lãnh thổ [de_jure|E]\n$EFFECT_LIST_BULLET$Phần thưởng: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], và [GetModifier('oath_of_conquest').GetNameWithTooltip]"
 ## Stewardship
  stewardship_oath_1_tooltip: "Ta thề một [oath|E] nhằm #V Bảo đảm Hòa bình#!:\n\t$EFFECT_LIST_BULLET$Cần có ít nhất #V 5 năm#! hòa bình liên tục\n\t$EFFECT_LIST_BULLET$Phải hoàn thành trong vòng #V 50 năm#!\n\t$EFFECT_LIST_BULLET$Phần thưởng: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [development_i][development|E], và [GetModifier('oath_of_peace').GetNameWithTooltip]"
  stewardship_oath_2_tooltip: "Ta thề một [oath|E] nhằm #V Định hình Lãnh thổ#!:\n\t$EFFECT_LIST_BULLET$Cần xây dựng hoặc nâng cấp ít nhất #V 8#! [buildings|E]\n\t$EFFECT_LIST_BULLET$Phải hoàn thành trong vòng #V 20 năm#!\n\t$EFFECT_LIST_BULLET$Phần thưởng: [legitimacy_i][legitimacy|E], [prestige_i][prestige|E], [development_i][development|E], và [GetModifier('oath_of_buildings').GetNameWithTooltip]"
