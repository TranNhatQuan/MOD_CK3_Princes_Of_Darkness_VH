# Host activity rewards

  coronation_events.0310.t: "Ý định của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  coronation_events.0310.desc.high_magnificence: "Ta đã làm việc không ngơi nghỉ để tôn vinh vinh quang, để nuôi dưỡng sự tráng lệ cho lễ đăng quang của mình. Các vị khách tràn đầy cảm hứng trước những gì họ chứng kiến nơi đây, tỏa ra niềm ngưỡng mộ. Đó là một khởi đầu xứng đáng cho triều đại của ta với tư cách là một [ROOT.Char.GetTitleAsNameNoTooltip|l].\n\n"
  coronation_events.0310.desc.mid_magnificence: "Giờ ta đã thực sự là một [ROOT.Char.GetTitleAsNameNoTooltip|l]. Lễ đăng quang của ta chứng tỏ xứng đáng với địa vị ấy, một cảnh tượng đẹp đẽ cho các vị khách, nhiều người trong số họ vẫn còn nán lại với hy vọng được nghe thêm vài lời cuối mang phong thái [ROOT.Char.Custom('GetTitleTierAdjective')].\n\n"
  coronation_events.0310.desc.low_magnificence: "Những cuộc ăn mừng đang dần đi đến hồi kết. Có rất nhiều lời xì xào về sự hỗn loạn, căng thẳng, và các tiện nghi chắp vá. Giờ đây ta đứng vững với những lời vu khống vang bên tai và thức ăn cũ kỹ, ôi thiu trong bụng... nhưng điều quan trọng duy nhất là cuối cùng ta cũng là một [ROOT.Char.GetTitleAsNameNoTooltip|l] đúng nghĩa.\n\n"
  coronation_events.0310.desc.impress_attendees: "Từ đầu đến cuối, ta không tiếc công sức để gây ấn tượng với tất cả những người tham dự — cả Ngài lẫn thù! Nhưng sự hiện diện công bằng của ta, sự tập trung tuyệt đối của ta vào thành công của buổi tụ hội trọng đại này...\n\nRốt cuộc thì tất cả vì điều gì?"
  coronation_events.0310.desc.weaken_detractors: "Những kẻ gièm pha hỗn xược, [first_char.Custom('InsultAdjective')] như [first_char.GetName] và [second_char.GetName], đã dám đến dự lễ đăng quang của ta... và ta đáp lại chúng bằng thứ mật đắng [ROOT.Char.Custom('GetTitleTierAdjective')] mà chúng đáng phải nhận! Chúng đến để moi móc điểm yếu của ta, nhưng chỉ tìm thấy sự khinh miệt lạnh lùng và ý chí sắt đá.\n\nCó lẽ, ta nên tung ra thêm một đòn chí mạng cuối cùng..."
  coronation_events.0310.desc.embrace_supporters: "Mỗi cơ hội có được, ta đều ưu ái những kẻ trung thành nhất với ta, với vương miện của ta. Cùng nhau, ta và những người ủng hộ đã mưu tính, sắp đặt, và ca ngợi uy tín của lẫn nhau. [first_char.GetName], [second_char.GetName], cùng những người khác đã trở thành vòng tròn thân cận của ta.\n\nNiềm tin của họ có thể trở thành điều gì đó vững chắc hơn."
  coronation_events.0310.desc.exalt_crown: "Ta vẫn trung thành với niềm tin rằng vinh quang của vương miện là trên hết. Những thử thách ta đối mặt nơi đây, những tranh chấp nhỏ nhặt — chỉ là rắc rối thoáng qua, còn [ROOT.Char.GetPrimaryTitle.GetNameNoTier] thì sẽ trường tồn! Ta đã truyền đạt niềm tin lớn lao ấy đến các vị khách, và đức tin của họ vào lãnh thổ đã được củng cố.\n\nNhưng rốt cuộc tất cả sự tôn vinh này nhằm tới điều gì?"
  coronation_events.0310.low_magnificence: "#EMP #low Vì [coronation_magnificence|E] #N thấp#! của Ngài:#!#!"
  coronation_events.0310.mid_magnificence: "#EMP #low Vì [coronation_magnificence|E] #V khá#! của Ngài:#!#!"
