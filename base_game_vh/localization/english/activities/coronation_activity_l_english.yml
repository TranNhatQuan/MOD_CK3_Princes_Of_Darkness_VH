 ## Intents
 # Host Intents
  coronation_impress_attendees: "Gây ấn tượng với người tham dự"
  coronation_impress_attendees_desc: "Ngươi sẽ hiện thân hoàn hảo của một quân vương, thu về [legitimacy|E], [cultural_acceptance|E] và [coronation_i][coronation_magnificence|E].\n#EMP #low [intent|E] này làm hài lòng các [vassals|E] theo khuynh hướng [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] và [GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName].#!#!"
  coronation_embrace_supporters: "Ôm trọn người ủng hộ"
  coronation_embrace_supporters_desc: "Chế độ của ngươi sẽ được xây dựng bởi những kẻ trung thành, cùng nhau giành [prestige|E], tạo dựng [relations|E] và làm giàu cho [realms|E] của ngươi.\n#EMP #low [intent|E] này làm hài lòng [coronation_supporters|E], đặc biệt là các [vassals|E] theo khuynh hướng [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] và [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName].#!#!"
  coronation_weaken_detractors: "Làm suy yếu kẻ chống đối"
  coronation_weaken_detractors_desc: "Cùng với lễ đăng quang của ngươi là sự suy vong của các [claimants|E], và sự tan rã của [factions|E] cùng [confederations|E].\n#EMP #low [intent|E] này gây hại cho [coronation_detractors|E], đồng thời làm hài lòng các [vassals|E] không thuộc phe [coronation_detractor|E] theo khuynh hướng [GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName].#!#!"
  coronation_exalt_crown: "Tôn vinh vương miện"
  coronation_exalt_crown_desc: "Sự tôn kính dành cho mệnh lệnh của ngươi ban phúc lâu dài cho các địa điểm [coronation|E], [artifacts|E] và [oaths|E], như [dynasty_prestige|E].\n#EMP #low [intent|E] này làm hài lòng các [vassals|E] theo khuynh hướng [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName].#!#!"
 # Guest Intents
  coronation_bear_witness: "Chứng kiến"
  coronation_bear_witness_desc: "Bằng việc xuất hiện trong dịp lịch sử này, ngươi kỳ vọng nhận được [piety|E], [legitimacy|E] và [cultural_acceptance|E]."
