  coronation_events.0205.f.toast: "[host.GetShortUIName] Đã ban một bài diễn thuyết đầy hào khí"
 
  coronation_events.0210.t: "Yến Tiệc"
  coronation_events.0210.desc.host: "Nghi lễ đã hoàn tất: từng vinh dự xứng với một [ROOT.Char.Custom('GetTitleTierAdjective')] đều đã được ban cho ta. Ta một lần nữa đứng dậy, không phải để hứa hẹn hay ban lệnh, mà để thiết đãi mọi người bằng một yến tiệc thịnh soạn.\n\n\"Hãy bày đầy những bàn tiệc. Hãy nâng cao những chén rượu, và để đại sảnh này ghi nhớ không chỉ bổn phận, mà cả niềm vui.\"\n\nĐám đông, vốn đã đói lả sau khi kiên nhẫn chứng kiến những nghi thức dài dòng và cầu kỳ, đồng loạt hưởng ứng. Ít nhất vào lúc này, trước mặt mọi người đều có thứ gì đó để nhìn, ngoài ta."
  coronation_events.0210.desc.guest: "Các nghi thức trang trọng đã kết thúc, và cùng với đó là bầu không khí tĩnh lặng bao trùm cả hội trường. Vài tiếng xì xào nổi lên khi chủ nhân buổi lễ lại đứng dậy, lần này để khép lại nghi lễ và mở đầu cho một bầu không khí thư thái hơn.\n\n[host.GetTitleAsName] cất cao giọng vừa đủ để mọi người đều nghe thấy: \"Bằng hữu của ta, các nghi lễ đã hoàn tất. Hãy bày đầy những bàn tiệc, hãy nâng cao những chén rượu, và để đại sảnh này ghi nhớ không chỉ bổn phận, mà cả niềm vui.\"\n\nNhững lời ấy được đón nhận nồng nhiệt, và theo từng khoảnh khắc trôi qua, buổi hội tụ của giới [ROOT.Char.Custom('GetTitleTierAdjective')] dần biến thành một lễ hội tưng bừng."
  coronation_events.0210.a: "Gác chuyện đó lại, đã đến lúc ăn mừng!"
  coronation_events.0210.b: "Cuối cùng thì nghi lễ cũng kết thúc."

  coronation_events.0300.t: "Vị Trí Danh Dự"
  coronation_events.0300.desc: "Trước khi lễ đăng quang có thể tiếp diễn, ta phải quyết định ai sẽ chủ trì nghi thức thiêng liêng này. Nếu muốn bảo đảm sự ủng hộ của các [ROOT.Char.GetFaith.AltPriestTermPlural|U], sẽ khôn ngoan hơn nếu để một người trong số họ đứng ra giám lễ, ban cho buổi lễ sự linh thiêng và phúc lành mà chỉ họ mới có thể mang lại.\n\nThế nhưng, một phần trong ta lại tự hỏi: chẳng phải sẽ là một câu chuyện huy hoàng hơn nếu chính ta tự tay đội vương miện, tuyên bố quyền cai trị của mình trước toàn thể mà không cần bất kỳ sự trung gian nào sao?"
  coronation_events.0300.a: "Chỉ có [chaplain.GetFirstNameNoTooltip] mới có thể làm việc này."
  coronation_events_0300_a_tooltip: "[chaplain.GetFirstName] sẽ là người chủ trì nghi lễ"
  coronation_events.0300.b: "Hay là [alternative_1.GetFirstNameNoTooltip]?"
  coronation_events_0300_b_tooltip: "[alternative_1.GetFirstName] sẽ là người chủ trì nghi lễ"
  coronation_events.0300.c: "Ta đặt niềm tin vào [alternative_2.GetFirstNameNoTooltip]."
  coronation_events_0300_c_tooltip: "[alternative_2.GetFirstName] sẽ là người chủ trì nghi lễ"
  coronation_events.0300.d: "Đây là vinh dự chỉ có thể thuộc về chính ta."
  coronation_events_0300_d_tooltip: "#high Chính Ngài#! sẽ là người chủ trì nghi lễ"
  coronation_events_0300_d_tooltip_effect: "#high Ngài#! sẽ nhận @prestige_icon![prestige|E], nhưng mất @opinion_icon![opinion|E] với [court_chaplain|E] của Ngài và các [vassals|E] có lập trường [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U], tùy theo mức [coronation_magnificence|E] của [coronation|E]"
  coronation_events_0300_d_tooltip_effect_hof: "#high Ngài#! sẽ nhận @prestige_icon![prestige|E], nhưng mất @opinion_icon![opinion|E] với [head_of_faith|E] và các [vassals|E] có lập trường [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName|U], tùy theo mức [coronation_magnificence|E] của [coronation|E]"

  coronation_events.0301.t: "Cái Chết Của Người Chủ Lễ"
  coronation_events.0301.desc: "Người chủ trì lễ đăng quang của ta, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_officiator'))] của ta là [dead_officiator.GetFirstName], đã qua đời, [dead_officiator.GetDeathReason]. Chỗ ngồi của [dead_officiator.GetHerHis|U] nay bỏ trống, và nghi lễ thiêng liêng vẫn còn dang dở.\n\n[first_candidate.GetFirstName], một [first_candidate.GetFaith.GetAdherentName] [first_candidate.GetFaith.PriestNeuter] đáng kính, bước lên phía trước. \"[first_candidate.GetFaith.HighGodName] không nao núng trước sự ra đi của một linh hồn,\" [first_candidate.GetSheHe] nói một cách trang nghiêm. \"Nếu ngài cho phép, ta sẽ hoàn tất nghi thức.\""
  coronation_events.0301.a: "Thánh [ROOT.Char.Custom('GetCatholicSaint')], xin phó thác linh hồn [dead_officiator.GetHerHis] cho [ROOT.Char.GetFaith.PositiveAfterLife]."
  coronation_events.0301.a.tooltip: "[first_candidate.GetFirstNameNoTooltip] sẽ là người chủ trì nghi lễ mới"
  coronation_events.0301.a.c: "Ta sẽ không để cái chết của [dead_officiator.GetHerHis] cản trở buổi lễ."
  coronation_events.0301.b: "[second_candidate.GetTitledFirstNameNoTooltip] gần gũi với [first_candidate.GetFaith.HighGodName] hơn."
  coronation_events.0301.b.tooltip: "[second_candidate.GetFirstNameNoTooltip] sẽ là người chủ trì nghi lễ mới"
  coronation_events.0301.c: "[dead_officiator.GetSheHe|U] xứng đáng nhận được sự tôn kính cao nhất của ta. Hủy bỏ các nghi lễ."
  coronation_events.0301.c.tooltip: "#N @warning_icon! Hoạt động [coronation|E] của Ngài sẽ bị hủy.#!"
  coronation_events.0301.c.tooltip_second: "Ngài sẽ có thể tổ chức một [funeral|E] cho [dead_officiator.GetFirstName]."
  coronation_events.0301.c.tooltip_third: "Ngài sẽ có thể tổ chức lại [coronation|E] ngay sau [funeral|E] của [dead_officiator.GetHerHis]."
  coronation_events.0301.d: "Ta sẽ không để một cái chết ngăn cản #EMP lễ đăng quang của ta#!."
  coronation_events.0301.d.tooltip: "[first_candidate.GetFirstNameNoTooltip] sẽ là người chủ trì nghi lễ mới. Cái chết của [dead_officiator.GetTitledFirstNamePossessive] trong lễ đăng quang của Ngài được xem là một điềm cực xấu cho triều đại."
  coronation_events.0301.e: "[first_candidate.GetFaith.HighGodName] ban cho và [first_candidate.GetFaith.HighGodName] lấy đi."
  coronation_events.0301.e.tooltip: "#N @warning_icon! Hoạt động [coronation|E] của Ngài sẽ bị hủy.#!"
  coronation_events.0301.e.tooltip_second: "Ngài sẽ không thể tổ chức thêm một lễ đăng quang nào khác trong 12 tháng tới."

