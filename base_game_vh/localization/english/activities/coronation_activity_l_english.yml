  coronation_no_regalia_trigger: "Đức tin của ngài yêu cầu một [artifact|E] Bảo Vật Vương Quyền, có thể được chế tác thông qua [GetDecisionWithKey('commission_artifact_decision').GetName] [decision|E]"
