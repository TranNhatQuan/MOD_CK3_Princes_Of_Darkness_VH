l_english:
 # Base details
  activity_coronation: "Lễ Đăng Quang"
  activity_coronation_host_desc: "$BULLET_WITH_TAB$@law_icon![GetLaw('crowned_king').GetName] hoặc [GetLaw('crowned_emperor').GetName] [law|E]\n$BULLET_WITH_TAB$Trong thời gian Lễ Đăng Quang diễn ra, @faction_icon![factions|E] không thể Ép Buộc Yêu Sách\n$BULLET_WITH_TAB$[opinion_i][opinion|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i][legitimacy|E]\n$BULLET_WITH_TAB$Một [decision|E] [oath|E] đầy uy lực\n\n@warning_icon! #X @faction_icon![factions|E] và các kẻ thù khác sẽ làm tổn hại đến [coronation_magnificence|E] của Lễ Đăng Quang#!"
  activity_coronation_guest_desc: "$BULLET_WITH_TAB$ Người tham dự có thể nhận được [opinion_i][opinion|E] từ những người tham dự khác\n$BULLET_WITH_TAB$Người tham dự có thể có những cơ hội đặc biệt dựa trên [intent|E] của họ"
  activity_coronation_desc: "Mời những nhân vật quyền thế nhất trong lãnh thổ đến chứng kiến khoảnh khắc Ngài đăng quang. Điều này sẽ đặt nền móng cho một triều đại lâu dài và thịnh vượng."
  activity_coronation_conclusion_desc: "[GetActivityType( 'activity_coronation' ).GetName] đã kết thúc."
  activity_coronation_selection_tooltip: "Mời những nhân vật quyền thế nhất trong lãnh thổ đến chứng kiến khoảnh khắc Ngài đăng quang. Điều này sẽ đặt nền móng cho một triều đại lâu dài và thịnh vượng.\n\nPhần thưởng dự kiến:\n$activity_coronation_host_desc$"
  activity_coronation_destination_selection: "\nMột [coronation|E] thường phải được tổ chức trong [realm|E] của [host|E], ngoại trừ [anointments|E] có thể cần được tiến hành tại lãnh thổ của [head_of_faith|E] nếu họ sở hữu các [holy_sites|E] phù hợp."
  activity_coronation_guest_help_text: "Lễ Đăng Quang là cơ hội tuyệt vời để xây dựng mối quan hệ và gây ấn tượng với cả [vassals|E] lẫn các [rulers|E] khác.\n\nBất kỳ khách mời nào tham gia Lễ Đăng Quang đều sẽ có cơ hội gia tăng [opinion|E] với các khách mời khác, và có thể nhận được những cơ hội đặc biệt để tương tác với [host|E] của [activity|E]."
  invite_to_activity_flavor_coronation: "Trân trọng kính mời ngài đến cùng ta và toàn thể vương quốc tại [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] để tham dự Lễ Đăng Quang sắp tới của ta."
  activity_coronation_underage_tt: "Ngài #bold chưa#! đủ #V 12#! tuổi\n#flavor Vương miện trượt khỏi cái đầu bé nhỏ của Ngài#!"
  activity_coronation_not_approved_anointment: "[GetPlayer.GetFaith.GetReligiousHead.GetTitledFirstName] chưa phê chuẩn [anointment|E] này, hãy tìm kiếm sự chấp thuận của [GetPlayer.GetFaith.GetReligiousHead.GetHerHis] thông qua [interaction|E] [request_anointment|E]"

 # Province Desc
  activity_coronation_province_desc: "Lễ Đăng Quang sẽ được tổ chức tại [ROOT.Province.GetName]"
  activity_coronation_capital_province: "\n#p + Thủ đô#!"
  activity_coronation_holy_site_province: "\n#p + Thánh địa#!"
  activity_coronation_tradition_province: "\n#p + Địa điểm đăng quang truyền thống#!"
  activity_coronation_long_tradition_province: "\n#p ++ Địa điểm đăng quang truyền thống#!"
  activity_coronation_ancient_tradition_province: "\n#p +++ Địa điểm đăng quang truyền thống cổ xưa#!"

