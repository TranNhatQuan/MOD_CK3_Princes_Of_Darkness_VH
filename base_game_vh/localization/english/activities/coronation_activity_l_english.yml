 ### Events
 # Oaths
  coronation_events.0100.t: "Lời thề cho muôn đời"
 # Intro
  coronation_events.0100.desc.opening: "Đại hội đang dõi theo ta. Có kẻ mang hy vọng, có kẻ hoài nghi, tất cả đều chờ ta lên tiếng về triều đại của mình và tuyên thệ cho tương lai. Ta có thể nghe thấy những câu hỏi họ không nói ra. Ta sẽ công bằng chăng? Ta sẽ chính trực chăng?"
 # Mid section
  coronation_events.0100.desc.previous_ruler_close_family: "Liệu ta có xứng đáng với [ROOT.Char.Custom2( 'RelationToMeShort', previous_ruler )] của mình?"
  coronation_events.0100.desc.previous_ruler_not_family_no_house: "Liệu ta có vượt qua người tiền nhiệm, [previous_ruler.GetFirstNameNicknamed]?"
  coronation_events.0100.desc.previous_ruler_not_family: "Liệu ta có thể vượt qua người tiền nhiệm, [previous_ruler.GetFullNameNoTooltip]?"
  coronation_events.0100.desc.first_ruler: "Ta sẽ cai trị ra sao với tư cách [ROOT.Char.GetTitleAsNameNoTooltip|l] đầu tiên của những vùng đất này?"
 # Outro
  coronation_events.0100.desc.outro: "\n\nTa không đứng ở đây, với tư cách [ROOT.Char.GetTitleAsNameNoTooltip|l], để lặp lại những kỳ vọng của họ. Ta đến để tự chọn con đường của mình, và vạch ra lối đi cho [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nDù [ROOT.Char.GetPrimaryTitle.GetNameNoTier] sẽ trở thành điều gì — dù ta sẽ trở thành ai — tất cả đều bắt đầu từ khoảnh khắc này."
