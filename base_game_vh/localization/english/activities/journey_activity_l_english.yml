l_english:
  activity_journey: "Thám hiểm Di tích"
  activity_journey_desc: "Thực hiện một chuyến thám hiểm đến một di tích hay công trình nổi tiếng để tự hoàn thiện bản thân bằng cách khám phá lịch sử, tri thức và những bí ẩn tồn tại nơi đó."
  activity_journey_guest_desc: ""
  activity_journey_conclusion_desc: "Chuyến thám hiểm cho phép Ngài suy ngẫm và cải thiện năng lực của mình với tư cách là một quân chủ."
  activity_journey_selection_tooltip: "Lên đường thám hiểm đến một [special_building|E], tìm kiếm tri thức và sự hoàn thiện bản thân.\n\nPhần thưởng dự kiến:\n$activity_journey_host_desc$"
  activity_journey_host_desc: "#indent_newline:8 $BULLET_WITH_TAB$[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E]#V 1#! Điểm [skill|E] được đảm bảo, #V 1#! Điểm [skill|E] cộng thêm tiềm năng\n#weak (Phần thưởng Điểm Kỹ năng dựa trên [special_building|E] được viếng thăm)#!#!\n$BULLET_WITH_TAB$[court_position_i] [court_positions|E] với [aptitude|E] Xuất sắc\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n\n#weak Ngài sẽ mang theo [children|E] và [spouses|E] trong [entourage|E].#!"
  activity_journey_predicted_cost: "Chi phí của một [monument_expedition|E] chủ yếu bị ảnh hưởng bởi khoảng cách đến [special_building|E] mà Ngài chọn."
  activity_journey_destination_selection: "Điểm đến hợp lệ phải có một [special_building|E] đã được xây dựng, không phải là thánh địa chung #weak (như [GetBuilding('holy_site_cathedral_01').GetName])#! hay một [GetBuilding('generic_university').GetName] chung. Mỗi điểm đến chỉ có thể được viếng thăm một lần.\n\nViệc tăng [intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E][skill|E] dựa trên loại [point_of_interest|E] của [special_building|E] được viếng thăm."
 
  journey_knowledge_hoarding_intent: "Tích trữ Tri thức"
  journey_knowledge_hoarding_intent_desc: "Ngài chỉ có một mục đích duy nhất – thu thập càng nhiều tri thức càng tốt. Ngài có thể chọn tăng cơ hội nhận thêm một Điểm [skill|E] để đổi lấy [stress|E]."
 
  journey_curiosity_intent: "Hiếu kỳ"
  journey_curiosity_intent_desc: "Có rất nhiều điều để khám phá, không chỉ ở các di tích mà còn ở những con người sống xung quanh chúng. Ngài sẽ nhận thêm [cultural_acceptance|E] và [strong_hooks|E] với những người Ngài chiêu mộ."
 
  activity_journey_guest_help_text: "[activity_guests|E] sẽ có cơ hội gia tăng [skills|E] của họ, đặc biệt nếu họ là những người quan trọng với Ngài, như [player_heir|E]."
  phase_experience: "Khám phá"
  phase_experience_desc: "Quan sát di tích, dạo quanh khu vực xung quanh và tương tác với cư dân địa phương – nhằm tìm kiếm tri thức."

  journey_option_scribes: "Thư lại"
  journey_no_scribes: "Không có Thư lại"
  journey_no_scribes_desc: "#flavor Ta chỉ cần một cây bút, vài tờ giấy da và trí óc của chính mình.#!"
  journey_skilled_scribes: "Tuyển mộ Thư lại Thành thạo"
  journey_skilled_scribes_desc: "#indent_newline:8 $BULLET_WITH_TAB$ $increase_skill_chance_20$#!\n#indent_newline:8 $BULLET_WITH_TAB$ Hai nhân vật [GetTrait('devoted').GetName( GetNullCharacter )] rất thành thạo sẽ gia nhập đoàn tùy tùng. Sau khi [activity|E] kết thúc, họ sẽ trở thành [courtiers|E] của Ngài và Ngài sẽ có #EMP Nghĩa vụ#! [hooks|E] với họ, giúp giảm lương của họ khi đảm nhiệm [court_positions|E].#!\n\n#flavor Không có gì đáng xấu hổ khi tìm kiếm sự trợ giúp bên ngoài, dù sao thì ta cũng không thể nhớ #EMP mọi thứ#! một mình.#!"

