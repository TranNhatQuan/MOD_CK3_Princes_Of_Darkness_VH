  journey_knowledge_hoarding_intent_idesc: "Sự phấn khích khi hé lộ những bí mật ẩn chứa trong [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] khiến ta tràn đầy cơn khát tri thức vô tận."
  journey_knowledge_hoarding_intent_idesc2: "Mỗi viên đá, mỗi hoa văn tại [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] đều thì thầm tri thức cổ xưa, mời gọi ta đào sâu hơn nữa."
  journey_knowledge_hoarding_intent_idesc3: "Sức hút của trí tuệ cổ đại ẩn giấu trong [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] là lời gọi không thể cưỡng lại đối với trái tim của một học giả."
  journey_curiosity_intent_idesc: "Ta hầu như không thể chờ đợi để hòa mình cùng những con người quanh [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], lắng nghe câu chuyện của họ và chứng kiến cuộc sống thường nhật."
  journey_curiosity_intent_idesc2: "Sự nhộn nhịp sôi động bao quanh [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] hứa hẹn vô vàn cuộc gặp gỡ và tri thức mới."
  journey_curiosity_intent_idesc3: "Sức hấp dẫn của việc khám phá những khía cạnh chưa biết của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] qua lăng kính của con người nơi đây thật sự kích thích."
  spread_legend_intent_idesc: "Ý nghĩ khắc ghi [me_scope.GetPromotedLegend.GetName] giữa sự nhộn nhịp của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] khiến ta tràn đầy một mục đích chưa từng có."
  spread_legend_intent_idesc2: "Dưới bóng [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], ta hình dung [me_scope.GetPromotedLegend.GetName] vang vọng khắp các con phố, một câu chuyện khiến dân địa phương phải kinh ngạc!"
  spread_legend_intent_idesc3: "Ta sải bước về phía [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], phông nền hoàn hảo để khắc ghi [me_scope.GetPromotedLegend.GetName] vào biên niên sử, một truyền thuyết được người dân kể lại qua nhiều thế hệ."
  monument_view_intro_1: "Khi đường nét của [location.Custom('MonumentTypeDesc')] phá vỡ đường chân trời, sự mong đợi dâng trào trong ta."
  monument_view_intro_2: "Khoảnh khắc được tận mắt thấy [location.Custom('MonumentTypeDesc')] thắp lên một tia lửa trong tim ta, thôi thúc ta khám phá."
  monument_view_intro_3: "Khi hình dáng xa xa của [location.Custom('MonumentTypeDesc')] hiện ra, một cảm giác kính sợ trỗi dậy khi ta tiến lại gần."
