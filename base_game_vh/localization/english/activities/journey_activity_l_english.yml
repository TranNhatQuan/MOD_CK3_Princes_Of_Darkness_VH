  bp3_journey.0010.t: "Lời từ biệt [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  bp3_journey.0010.desc: "Đã đến lúc ta thu xếp hành lý và trở về nhà.\n\nTa đã lang thang khắp khuôn viên của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName], chiêm ngưỡng nhiều cảnh tượng, ghi chép và phác họa, đồng thời gặp gỡ những người [location.GetCulture.GetCollectiveNounNoTooltip] địa phương. Ta tin rằng mình sẽ không sớm quên được chuyến hành trình này!\n\nVĩnh biệt, [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] – vĩnh biệt, [location.Custom('ProvinceCompliment')] [location.GetNameNoTooltip]!"
  bp3_journey.0010.a: "Ta nhất định không được quên những điều đã học được tại đây."
  extra_skill_gained_tt: "Ngài nhận thêm một Điểm [skill|E] #weak (xác suất [activity.MakeScope.Var( 'skill_chance' ).GetValue|0]%)#!"
  no_extra_skill_gained_tt: "Ngài không nhận thêm Điểm [skill|E] nào #weak (xác suất [activity.MakeScope.Var( 'skill_chance' ).GetValue|0]%)#!"
  scribes_skill_tt: "[activity_options|E] của Ngài cung cấp thêm một Điểm [skill|E]"
 
  bp3_journey.0015.t: "Cảnh sắc của [location.GetNameNoTooltip]"
  bp3_journey.0015.desc: "[ROOT.Char.Custom('MonumentViewIntro')]\n\n[location.Custom('GetSpecialBuildingTouristDescriptor')]"
  bp3_journey.0015.a: "Ta sẽ trau dồi kỹ năng ngoại giao của mình!"
  bp3_journey.0015.b: "Chiến lược, chiến thuật, công sự – tất cả đều đáng quan tâm!"
  bp3_journey.0015.c: "Nơi này có rất nhiều điều để học hỏi."
  bp3_journey.0015.d: "Họ điều hành mọi thứ ở đây thế nào? Ta phải biết!"
  bp3_journey.0015.e: "Ta tự hỏi những chuyện gì đang diễn ra sau hậu trường..."
  bp3_journey.0015.knowledge_hoarding: "Đến lúc ghi chép rồi!"
  bp3_journey.0015.journey_curiosity_intent: "Ta sẽ hòa mình cùng dân địa phương!"
  bp3_journey.0015.spread_legend_intent: "Mọi người! Các ngươi đã nghe truyền thuyết về [ROOT.Char.GetPromotedLegend.GetNameNoTooltip] chưa?"
  bp3_journey.0015.friend: "Thật vui khi được chia sẻ khoảnh khắc này cùng [potential_friend.GetFirstNameNoTooltip]!"
  bp3_journey.0015.lover: "#EMP *Khẽ nghiêng người và trao cho [potential_lover.GetFirstNameNoTooltip] một nụ hôn*#!"
  bp3_journey.0015.prestige: "Ta đến đây để được mọi người chú ý!"
  friend_bonded_by_monument: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã trở thành Bạn Bè khi cùng nhau khám phá [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] tại [PROVINCE.GetName]."
  friend_bonded_by_monument_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] đã trở thành Bạn Bè khi cùng nhau khám phá [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] tại [PROVINCE.GetName]."
  lover_kissed_by_monument: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã trao nhau một nụ hôn nồng cháy gần [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] tại [PROVINCE.GetName]."
  lover_kissed_by_monument_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] đã trao nhau một nụ hôn nồng cháy gần [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] tại [PROVINCE.GetName]."
  lover_fell_in_love_with_prostitute_by_monument: "[CHARACTER.GetShortUIName|U] đã yêu [TARGET_CHARACTER.GetShortUIName] khi [TARGET_CHARACTER.GetShortUIName] đang \"làm việc\" trong những con hẻm tối gần [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] tại [PROVINCE.GetName]."
  lover_fell_in_love_with_prostitute_by_monument_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã yêu [CHARACTER.GetShortUIName] khi [CHARACTER.GetShortUIName] đang \"làm việc\" trong những con hẻm tối gần [PROVINCE.Custom('GetSpecialBuildingPrefix')][PROVINCE.GetHolding.GetSpecialBuildingType.GetName] tại [PROVINCE.GetName]."
 
  miniature_monument: "Mô hình thu nhỏ của [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  miniature_monument.desc: "Mô hình đất sét này, được mua tại [location.GetName], mô tả [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName].\n\n[location.GetHolding.GetSpecialBuildingType.GetDescription]"

  bp3_journey.1000.t: "Rao bán Kiến trúc"
  bp3_journey.1000.desc: "\"Mua mô hình thu nhỏ của [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] tại đây nào!\" – giọng rao của người bán vang dội khắp khu chợ.\n\nQuan sát kỹ hơn, ta nhận ra những món đồ đất sét này có chất lượng #EMP đáng kinh ngạc#!. Mọi chi tiết đều hiện diện, cho đến cả những phần nhỏ nhất. Thật sự khó tin là chúng tinh xảo đến vậy.\n\n\"Làm thủ công cả đấy, [ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ngài có muốn mua một chiếc không?\""
  bp3_journey.1000.knowledge_hoarding: "Ngươi phải chỉ cho ta cách ngươi làm ra chúng."
  bp3_journey.1000.curiosity: "Những nghệ nhân [local_character.GetCulture.GetNameNoTooltip] các ngươi thật đáng kinh ngạc! Hãy theo ta!"
  bp3_journey.1000.lechery: "Ngươi có nhận làm... theo yêu cầu riêng không?"
  bp3_journey.1000.a: "Ta sẽ lấy một cái!"
  bp3_journey.1000.b: "Ta có thể tận dụng kỹ năng của ngươi tại [ROOT.Char.Custom('GetCourtType')]."
  bp3_journey.1000.c: "Ta là một #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!, đừng lãng phí thời gian của ta!"
  will_have_excellent_aptitude: "[aptitude|E] của họ là $aptitude_excellent$"
  increase_skill_chance_25: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +25%#!"
  increase_skill_chance_20: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +20%#!"
  increase_skill_chance_15: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +15%#!"
  increase_skill_chance_10: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +10%#!"
  increase_skill_chance_30: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +30%#!"
  increase_skill_chance_35: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +35%#!"
  increase_skill_chance_50: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +50%#!"
  increase_skill_chance_5: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +5%#!"
  increase_skill_chance_2: "Cơ hội tăng thêm một [skill|E] khi kết thúc: #P +2%#!"
  suggestive_alterations: "Ngài đặt làm một phiên bản có phần... gợi ý hơn."
 
  suggestive_miniature_monument: "Mô hình thu nhỏ gợi dục của [location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  suggestive_miniature_monument.desc: "Mô hình đất sét này, được mua tại [location.GetName], mô tả [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName].\n\n[location.GetHolding.GetSpecialBuildingType.GetDescription] Những tháp trông giống dương vật và những hình nhân trần trụi có lẽ không phải là một phần của thiết kế nguyên bản."
 
  bp3_journey.1100.t: "Một Cái Tên, Vĩnh Cửu"
  bp3_journey.1100.desc_intro: "Khi đang bước đi trong khuôn viên, ta phát hiện một dấu khắc kỳ lạ trên [location.Custom('GetSpecialBuildingSurface')].\n\n"
  bp3_journey.1100.desc_name: "Khi quan sát kỹ hơn, ta nhận ra dòng chữ khắc: #EMP '[ancient_vandal.GetFullName] đã từng ở đây, hãy nhìn vào tên ta và biết rằng ta là một kẻ [ancient_vandal.Custom('FormalComplimentAdjective')]!'#! Hừm, nếu [ancient_vandal.GetSheHe] có thể khắc tên mình để những kẻ qua đường tò mò chiêm ngưỡng mãi mãi, vậy thì có lẽ..."
  bp3_journey.1100.desc_first: "Bề mặt này vẫn còn nguyên vẹn, chưa bị động chạm, lại nằm ngay tầm mắt của người qua đường... chỉ chờ ai đó khắc ghi tên mình."
  bp3_journey.1100.desc_outro: "\n\nTa cúi nhìn xuống và thấy một hòn đá sắc như đục đang mời gọi."
  bp3_journey.1100.knowledge_hoarding: "Chắc hẳn có trí tuệ ẩn giấu giữa những đường khắc này!"
  bp3_journey.1100.curiosity: "\"[ROOT.Char.GetFirstNameNoTooltip], bằng hữu của người [location.GetCulture.GetCollectiveNounNoTooltip], đã đi qua nơi này.\""
  bp3_journey.1100.a: "Thật đáng tiếc nếu người đời không nhớ đến #EMP tên ta#!!"
  bp3_journey.1100.b: "Đó sẽ là một món kỷ niệm hay..."
  bp3_journey.1100.c: "Ta thà ẩn danh thì hơn."
  a_large_rock: "một tảng đá lớn, phẳng đứng gần [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
  the_mine_entrance: "lối vào đầy đá của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
  a_wall: "một trong những bức tường cấu thành [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName]"
  artifact_gained: "Nhận được Bảo vật"
  prestige_trinket: "Ngài nhận một [artifact|E] linh tinh mang lại [prestige|E]"
  grafitti_rock: "Tảng đá khắc từ [location.GetNameNoTooltip]"
  grafitti_rock.desc: "Tảng đá này được tách ra từ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] và có một dòng khắc: #EMP '[ancient_vandal.GetFullName] đã ở đây, hãy ngắm nhìn tên ta và biết rằng ta là kẻ [ancient_vandal.Custom('FormalComplimentAdjective')]!'#!"
  defaced_monument_opinion: "Bôi bẩn Di tích"
 
  bp3_journey.1200.t: "Cạo râu và Cắt tóc"
  bp3_journey.1200.desc: "Ở một góc khu chợ, ta thấy một gian hàng với tấm biển ghi #EMP '[local_character.GetFirstNameNicknamed] – Thợ cắt tóc & Phẫu thuật gia'#!, bên ngoài là một hàng người dài đang chờ đợi. Rõ ràng đây là một nơi #EMP cực kỳ#! được ưa chuộng.\n\nTiến lại gần hơn, ta thấy [local_character.GetWomanMan] cắt tóc với tốc độ và độ chính xác mà ta chưa từng thấy! Những mớ tóc rối rắm, xơ xác biến thành những mái tóc bóng mượt và óng ả nhất có thể tưởng tượng."
  bp3_journey.1200.knowledge_hoarding: "[local_character.GetSheHe] làm sao có thể di chuyển uyển chuyển đến vậy?"
  bp3_journey.1200.curiosity: "Hãy cho ta một kiểu tóc #EMP 'phong cách [location.GetNameNoTooltip]'#! thực thụ, rồi theo ta!"
  bp3_journey.1200.a: "Cho ta cắt một kiểu!"
  bp3_journey.1200.b: "Ta có thể cần đến Thợ cắt tóc–Phẫu thuật gia này tại [ROOT.Char.Custom('GetCourtType')]."
  bp3_journey.1200.c: "Thật lãng phí thời gian."
  barber_success: "Ngài có một kiểu tóc mới tuyệt mỹ"
  barber_fail: "Ngài có một kiểu tóc tệ hại"
  hair_will_change: "Kiểu tóc của Ngài sẽ thay đổi trong #V 6#! tháng"
 
  bp3_journey.1300.t: "Khúc ca của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  bp3_journey.1300.desc: "Một giai điệu mê hoặc vang lên bên tai ta khi ta đứng bên ngoài [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Một nhạc công cầm trên tay nhạc cụ địa phương tinh xảo đang trình diễn một khúc nhạc điêu luyện, trong khi một gã hề đầy sắc màu – cũng xuất sắc không kém trong màn trình diễn của [local_character_2.GetHerHis] – vừa hát vừa nhảy theo giai điệu đó:\n\n#EMP \"[location.Custom('GetSpecialBuildingSong')]\"#!"
  bp3_journey.1300.knowledge_hoarding: "Chắc hẳn khúc ca này còn ẩn chứa ý nghĩa sâu xa..."
  bp3_journey.1300.curiosity: "Sao cả hai ngươi không gia nhập [ROOT.Char.Custom('GetCourtType')] của ta?"
  bp3_journey.1300.spread_legend_intent: "Các ngươi nên hát về [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
  bp3_journey.1300.a: "Gã hề này thật xuất chúng, ta phải có được [local_character.GetHerHim]!"
  bp3_journey.1300.b: "Âm nhạc như thế này phải vang lên trong dinh thự của ta!"
  bp3_journey.1300.c: "Thật tuyệt vời!"
 
 # Religious Buildings Song
  event_song_religious_01: "Bên dưới những mái vòm của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi đức tin và tĩnh lặng ngự trị, chúng ta tụ họp trong ánh sáng, tinh thần không bao giờ lụi tàn."
  event_song_religious_02: "Trong những đại sảnh bình yên linh thiêng, [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sừng sững vươn cao, những ngọn tháp chạm tới bầu trời, khi lời cầu nguyện và tiếng hát vang lên."
  event_song_religious_03: "Nơi hồi chuông của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ngân vang, âm vọng trong trẻo và tinh khiết, chúng ta tìm thấy sự an ủi nơi đây, trong thờ phụng, hy vọng và lời cầu nguyện."
 # Learning Buildings Song
  event_song_learning_01: "Giữa những cuốn sách phủ bụi và tri thức xa xưa, [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] thì thầm sự thông tuệ, những bí mật và nhiều điều hơn nữa."
  event_song_learning_02: "Nơi những trí tuệ hội tụ trong đại sảnh của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], hành trình tìm kiếm tri thức phá tan những bức tường của sự ngu muội."
  event_song_learning_03: "Bên dưới những mái vòm của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], các học giả tranh luận, hé mở những bí ẩn mà thời gian chẳng thể xóa nhòa."
 # Mines Buildings Song
  event_song_mines_01: "Sâu trong trái tim của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi kho báu ẩn mình, thợ mỏ miệt mài trong bóng tối, lấy niềm tự hào làm kim chỉ nam."
  event_song_mines_02: "Dưới lòng đất tại [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], tiếng cuốc chim cất vang, truy tìm những mạch giàu sang, mang về vận may to lớn."
  event_song_mines_03: "Trong những tầng sâu của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi tiếng vọng ngự trị, chúng ta khắc vào đá những bí mật, để kể lại câu chuyện của nó."
 # Martial Buildings Song
  event_song_martial_01: "Giữa những bóng đổ của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi binh sĩ luyện tập và khổ luyện, tiếng thép va chạm vang vọng trên mảnh đất đã được thánh hóa này."
  event_song_martial_02: "Dưới bóng uy lực của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], gươm giáo được rút ra vì chính nghĩa, bảo vệ mái ấm và quê hương cho tới ánh bình minh đầu tiên."
  event_song_martial_03: "Dưới ánh nhìn canh giữ của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi cờ hiệu dũng cảm tung bay, tiếng vọng của những lời thề vang lên trong nghệ thuật chiến tranh cổ xưa."
 # Ancient Wonders Buildings Song
  event_song_ancient_wonders_01: "Trong bóng dáng vượt thời gian của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi lịch sử yên giấc, những câu chuyện cổ xưa còn lưu lại trong sự tĩnh lặng được gìn giữ."
  event_song_ancient_wonders_02: "Chiêm ngưỡng [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], kỳ quan thuở xa xưa, những câu chuyện cũ, lời thì thầm của huyền thoại và truyền thuyết."
  event_song_ancient_wonders_03: "Vĩnh cửu như các vì sao, [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sừng sững, một minh chứng cho thời gian, được tạo tác bởi bàn tay cổ đại."
 # Economic Buildings Song
  event_song_economic_01: "Trong trái tim nhộn nhịp của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi thương mại hưng thịnh, nhịp đập của giao thương và trao đổi mang theo phồn vinh."
  event_song_economic_02: "Khúc ca sôi động của khu chợ lấp đầy không gian của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], một bản giao hưởng của doanh thương, giàu sang không gì sánh nổi."
  event_song_economic_03: "Thủ công và hàng hóa tràn ngập trong đại sảnh của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi tiếng rao của thương nhân vang vọng và vận may ghé đến."
 # Diplomatic Buildings Song
  event_song_diplomatic_01: "Dưới ánh nhìn của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi các liên minh được dệt nên, lời nói đan kết tương lai cho tới khi mặt trời lặn."
  event_song_diplomatic_02: "Những đại sảnh hùng biện của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], nơi tiếng nói thăng trầm, trong vũ điệu ngoại giao, chỉ một lời cũng có thể đổi thay tất cả."
  event_song_diplomatic_03: "Trong những triều đình tráng lệ của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], giữa lời thì thầm và mưu đồ, mỗi cử chỉ đều mang trọng lượng, trong thế giới của vua chúa và hoàng hậu."
  event_song_natural_wonders_01: "Ôi sự hùng vĩ của thiên nhiên, bao la và rộng lớn, nơi đại bàng sải cánh cao vời và những bí mật ẩn giấu. Trong lòng đất hay nơi dòng nước chảy, tồn tại một vẻ đẹp hoang sơ mà ít ai thực sự thấu hiểu."
  event_song_natural_wonders_02: "Dưới bầu trời vô tận, trên mảnh đất cổ xưa, nơi những lời thì thầm của quá khứ theo gió lan xa. Giữa những đỉnh núi sừng sững hay bên bờ nước trong veo, linh hồn của địa cầu cất tiếng hát cho những ai lắng nghe."
  event_song_natural_wonders_03: "Trong vòng tay của thiên nhiên, nơi muôn loài rong ruổi, giữa vẻ đẹp gồ ghề, chúng ta tìm thấy mái nhà. Bên sức mạnh của núi non hay mặt hồ yên bình, trong từng chiếc lá và hòn đá, những kỳ quan của thiên nhiên hiện hữu."


  bp3_journey.1400.t: "Rao Bán Thịt"
  bp3_journey.1400.desc: "Ta tiến đến gần một [local_character.GetWomanMan] có vẻ ngoài thô kệch, đang bày bán một bộ sưu tập da thú ấn tượng tại quầy hàng của [local_character.GetHerHis]. Có vẻ [local_character.GetSheHe] là một thợ săn lão luyện. \"Ta có [local_character.Custom('GetRandomRegionalSmallGame')], [local_character.Custom('GetRandomRegionalWildDaytimeBird')], [local_character.Custom('GetRegionalDeerType')] – mua thịt và da thú ở đây đi!\" [local_character.GetSheHe] hét lớn.\n\nBất chợt, [local_character.GetSheHe] nhìn thẳng vào mắt ta, ánh mắt của [local_character.GetHerHis] sắc bén như một [local_character.Custom('GetRegionalWolfType')]. \"Ồ, một #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#!, với ngài ta có thứ thịt vương giả nhất trong tất cả: #EMP [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]#!.\""
  bp3_journey.1400.knowledge_hoarding: "Ngươi rành rẽ nơi này, hãy chỉ dẫn cho ta."
  bp3_journey.1400.curiosity: "Ngươi có thể dạy ta đôi điều!"
  bp3_journey.1400.a: "Để ta mua [newly_created_artifact.GetNameNoTooltip]."
  bp3_journey.1400.b: "Ngươi nên trở thành Bậc Thầy Săn Bắn của ta!"
  bp3_journey.1400.c: "Thứ thịt đó quả thật xứng tầm hoàng gia!"

  bp3_journey.1500.t: "Những Người Dân Uyên Bác"
  bp3_journey.1500.desc: "Trong lúc khám phá, Ta vô tình nghe thấy cuộc trò chuyện giữa hai người dân địa phương uyên bác. \"Việc phân phát bố thí chưa bao giờ dễ dàng đến thế kể từ khi ngài sắp xếp lại khuôn viên. [local_character.GetFaith.HighGodName|U] hẳn sẽ ban phước cho ngài, [local_character_2.GetFirstName],\" một [local_character.GetWomanMan] nói.\n\n\"Ta thật khiêm nhường, thưa [local_character.GetFirstName], nhưng chính ngài mới là người được yêu mến và là một Ta tớ [local_character.Custom('ComplimentAdjective')] của đấng thiêng liêng – Ta chỉ đơn thuần làm tròn bổn phận của mình với tư cách là người trông coi [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip],\" người kia tiếp lời."
  bp3_journey.1500.knowledge_hoarding: "Nếu ta quyên góp bố thí, các ngươi sẽ dẫn ta tham quan chứ?"
  bp3_journey.1500.curiosity: "Cả hai ngươi đều thật [local_character.Custom('ComplimentAdjective')], liệu có thể ghé thăm [ROOT.Char.Custom('GetCourtType')] của ta không?"
  bp3_journey.1500.curiosity_2: "Từ người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] đến người [local_character.GetCulture.GetCollectiveNounNoTooltip] – một món quà của tình bằng hữu!"
  bp3_journey.1500.a: "Ta cần các ngươi phân phát bố thí cho ta tại [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
  bp3_journey.1500.b: "Gia nhân của ta lúc nào cũng chậm trễ – hãy tổ chức lại [ROOT.Char.Custom('GetCourtType')] của ta!"
  bp3_journey.1500.c: "Thì ra họ vận hành mọi việc ở đây như vậy..."
  inspired_by_alms_modifier: "Được Truyền Cảm Hứng bởi Bố Thí Có Tổ Chức"
  inspired_by_alms_modifier_desc: "Nhân vật này được truyền cảm hứng bởi cách bố thí được tổ chức quy củ trong chuyến viếng thăm một công trình vĩ đại."
 
  bp3_journey.1600.t: "Thành Phố Của Mèo"
  bp3_journey.1600.desc: "Mèo ở #EMP khắp mọi nơi#! quanh khu vực này – không có một góc, ngách hay kẽ hở nào mà không có một con mèo đang ngủ! Thậm chí còn có mèo ngủ [location.Custom('GetSpecialBuildingCatSleepingSpot')] của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]...\n\nBất chợt, một chú mèo con lanh lợi len qua chân Ta, dường như vẫy gọi Ta về phía một con hẻm mà trước đó Ta không hề để ý. Thật kỳ lạ."
  bp3_journey.1600.knowledge_hoarding: "Những bí mật gì đang chờ đợi vậy, người Bạn Nhỏ?"
  bp3_journey.1600.curiosity: "Người dân nơi đây yêu mèo, vậy thì ta sẽ cho tất cả ăn!"
  bp3_journey.1600.a: "Họ sẽ chẳng để ý thiếu chỉ #EMP một#! chú mèo con đâu..."
  bp3_journey.1600.b: "Biến đi, đồ sinh vật nhỏ bé!"
  cat_help: "Con mèo dẫn Ngài tới một phiến đá khắc thú vị"
  get_lost: "Ngài bị cướp, nhưng học được điều gì đó"
 # Religious
  cats_sleeping_religious_01: "trong ánh nắng ấm áp chiếu qua các ô cửa sổ"
  cats_sleeping_religious_02: "trên đỉnh của nhiều bàn thờ"
  cats_sleeping_religious_03: "trên những ngôi mộ được tôn kính"
 # Learning
  cats_sleeping_learning_01: "trên những chồng bản thảo đã được giở nhiều lần"
  cats_sleeping_learning_02: "trên đùi của những học giả đang say mê nghiên cứu"
  cats_sleeping_learning_03: "trên những bệ cửa sổ ngập nắng"
 # Mines
  cats_sleeping_mines_01: "trên những phiến đá mát lạnh nơi lối vào"
  cats_sleeping_mines_02: "cuộn tròn trong các xe goòng"
  cats_sleeping_mines_03: "trên các mỏm đá gần miệng hầm"
 # Martial
  cats_sleeping_martial_01: "trong bóng râm của tường thành"
  cats_sleeping_martial_02: "trên đùi của những lính gác cảnh giác"
  cats_sleeping_martial_03: "giữa những hốc tường yên tĩnh"
 # Ancient Wonders
  cats_sleeping_ancient_wonders_01: "bên dưới bóng của những cột đá tưởng niệm gần đó"
  cats_sleeping_ancient_wonders_02: "trong các hốc tường"
  cats_sleeping_ancient_wonders_03: "trên những bậc thềm cổ xưa"
 # Economic
  cats_sleeping_economic_01: "giữa các quầy chợ tấp nập"
  cats_sleeping_economic_02: "trên những thùng hàng tại các điểm giao thương nhộn nhịp"
  cats_sleeping_economic_03: "trong những góc nhỏ của các dinh thự thương nhân phồn thịnh"
 # Diplomatic
  cats_sleeping_diplomatic_01: "bên trong những khu vườn trang trí cầu kỳ"
  cats_sleeping_diplomatic_02: "trên đùi của các nhà ngoại giao"
  cats_sleeping_diplomatic_03: "trên những tấm thảm xa hoa"
 # Natural Wonders
  cats_sleeping_natural_wonders_01: "dưới bóng râm của những hàng cây gần đó"
  cats_sleeping_natural_wonders_02: "trên những tảng đá phơi nắng gần kề"
  cats_sleeping_natural_wonders_03: "trên những khung cảnh ngập ánh mặt trời"

  bp3_journey.1700.t: "[location.GetCulture.GetNameNoTooltip] Diễn tập quân sự"
  bp3_journey.1700.desc: ""[local_character.Custom('GetMilitaryDrillSentence')]" vị chỉ huy hét lớn với hai lính canh của [local_character.GetHerHis]. Có vẻ như đang có một cuộc thao diễn quân sự gần [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip].\n\n"
  bp3_journey.1700.desc_different_culture: "Quan sát các động tác và chiến thuật của những lính gác [location.GetCulture.GetName] này khiến ta tràn ngập cảm giác kính trọng và kinh ngạc. Chắc chắn có điều gì đó mà chúng ta, những người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], có thể học hỏi từ màn trình diễn này."
  bp3_journey.1700.desc_same_culture: "Quan sát các động tác và chiến thuật của các lính gác khiến ta tràn ngập cảm giác kính trọng và kinh ngạc. Chắc chắn có điều gì đó để ta học hỏi từ màn trình diễn này."
  bp3_journey.1700.knowledge_hoarding: "Viên chỉ huy #EMP nhất định#! phải dạy ta những chiến thuật này!"
  bp3_journey.1700.curiosity: "Ta có thể tận dụng cả ba người các ngươi trong [ROOT.Char.Custom('GetCourtType')] của ta!"
  bp3_journey.1700.b: "Hm, ta có thể cần hai cận vệ mới."
  bp3_journey.1700.c: "Ta sẽ mời toàn bộ đồn binh gia nhập quân đội của ta."
  bp3_journey.1700.d: "#EMP *Chào kiểu quân đội*#!"
  drill_order_1: "Theo lệnh ta, tiến lên, vững vàng như thể chính mặt đất đang dẫn lối cho bước chân các ngươi!"
  drill_order_2: "Xếp hàng, đứng sát vai nhau, như thể ngay cả gió cũng không dám lướt qua!"
  drill_order_3: "Quay sang trái, để tiếng bước chân vang dội như sấm, dọa bay cả bầy quạ!"
  drill_order_4: "Nghỉ, binh sĩ, nhưng hãy giữ sự cảnh giác như một hộ vệ thầm lặng, luôn quan sát,"
  drill_order_5: "Giương khiên lên, như thể bầu trời đang trút mưa tên chứ không phải mưa nước!"
  drill_order_6: "Lùi lại theo đội hình, như thể chính mặt đất đang dịch chuyển dưới chân các ngươi!"
  drill_order_7: "Tập hợp đội hình, chống khiên vững chắc, chỉ là diễn tập để đứng vững trước kẻ thù tưởng tượng!"
  drill_order_8: "Tiến lên với giáo sẵn sàng, như thể đang đối mặt kẻ địch trong trò đùa, chứ không phải chiến trận thực sự!"
  drill_order_9: "Bao vây và tái tập hợp, chế nhạo đòn xung phong của kẻ thù, một điệu vũ chiến tranh khi chẳng có địch nhân nào!"
  drill_order_10: "Giữ vững vị trí, hãy tưởng tượng mặt đất rung chuyển dưới vó ngựa của kỵ binh ma quái!"
  drill_order_11: "Tách ra rồi tái tập hợp, như thể không khí bị lưỡi kiếm các ngươi chém xuyên đang cười nhạo các ngươi!"
  maa_increases_tt: "Một trong các [maa.GetName] [men_at_arms|E] của Ngài tăng Quy mô lên #P +2#!\n#weak (Điều này có thể khiến họ vượt quá Quy mô Tối đa)#!"
  imported_tactics_modifier: "Chiến thuật du nhập"
  imported_tactics_modifier_desc: "Người cai trị vùng đất này đã du nhập chiến thuật từ phương xa, khiến các trung đoàn đóng quân tại đây trở nên đặc biệt hiệu quả."
  imported_tactics_character_modifier: "$imported_tactics_modifier$"
  imported_tactics_character_modifier_desc: "Thông qua những chuyến du hành, nhân vật này đã lĩnh hội các chiến thuật mới, tạo nên mối gắn kết sâu sắc hơn với binh sĩ của mình."
 
  bp3_journey.1800.t: "Hãy tin Ta"
  bp3_journey.1800.desc: ""[location.Custom('GetSpecialBuildingNonsensicalClaim')]" viên hướng dẫn địa phương trông gian xảo tuyên bố. "Nếu không phải sự thật thì Ta đâu còn mang tên [local_character.GetFirstNameNicknamed]!"\n\n"Đi nào, để Ta dẫn Ngài xem! Ta chỉ cần một khoản phí nhỏ thôi – chẳng là gì đối với một [ROOT.Char.GetTitleAsNameNoTooltip|U] như ngài cả!""
  bp3_journey.1800.spread_legend_intent: "Ngài #EMP CÓ#! từng nghe câu chuyện thật sự về [ROOT.Char.GetPromotedLegend.GetNameNoTooltip] chưa?"
  bp3_journey.1800.knowledge_hoarding: "Chuyện đó có thể là thật sao!? Ngươi phải cho ta xem!"
  bp3_journey.1800.curiosity: "Thay vào đó, hãy cho ta thấy cuộc sống nơi đây ở [location.GetNameNoTooltip] diễn ra thế nào!"
  bp3_journey.1800.a: "Toàn là nhảm nhí – hãy cho ta xem thứ gì đó thật sự."
  bp3_journey.1800.b: "Ngừng trò hề của ngươi lại, ta có thể cho ngươi nhiều hơn cuộc sống này."
  bp3_journey.1800.c: "Mang những lời dối trá của ngươi đi chỗ khác."
  bp3_journey.1800.trusting: "Hoàn toàn tin được, nghe có vẻ hợp lý!"
  mostly_true_tt: "Cảnh tượng này cực kỳ hấp dẫn"
  almost_true_tt: "Cảnh tượng này khá thú vị"
  not_true_tt: "Ta chỉ được tham quan bình thường"
  utterly_scammed_tt: "Chúng ta bị \"lạc đường\" và ta phải trả tiền để quay về"
  interesting_insight_modifier: "Nhận thức thú vị"
  interesting_insight_modifier_desc: "Nhân vật này đã thu được một vài nhận thức truyền cảm hứng khi ghé thăm một thành phố khác."
  beautiful_vista: "Ngài đứng trên một khung cảnh tuyệt đẹp"
  relaxing_sights: "Ngài dạo bước trên một lối đi thư giãn"
  interesting_insight: "Ngài chiêm ngưỡng một kiến trúc đầy cuốn hút"
 # Religious
  guide_religious_1: "Người ta nói rằng những cái bóng bên trong [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] tự mình chuyển động, hé lộ sự hiện diện của các linh hồn thần thánh trước những kẻ có đức tin."
  guide_religious_2: "Một truyền thuyết địa phương kể rằng những chiếc chuông của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ngân vang một giai điệu chỉ những ai được định sẵn cho sự vĩ đại ở thế giới bên kia mới có thể nghe thấy."
  guide_religious_3: "Người ta thì thầm rằng một căn phòng bí mật bên dưới [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] cất giữ một thánh tích có thể biến những lời cầu nguyện thành kính nhất thành hiện thực."
  guide_religious_4: "Truyền thuyết kể rằng bàn thờ của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] được chạm khắc kỳ diệu từ một thiên thạch thần thánh duy nhất, ban cho nó sức mạnh thiên giới."
  guide_religious_5: "Một câu chuyện cổ kể rằng những ô kính màu của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sẽ thay đổi câu chuyện của chúng để phản chiếu trái tim của những ai nhìn vào."
 # Learning
  guide_learning_1: "Người ta nói rằng ẩn sâu trong những bức tường của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] là một cuốn sách chỉ có thể đọc được dưới ánh trăng tròn."
  guide_learning_2: "Truyền thuyết kể rằng một căn phòng bí mật bên dưới [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] từng là nơi tụ họp của một hội kín những nhà tư tưởng khai sáng, vô hình trước những kẻ chưa được khai tâm."
  guide_learning_3: "Có một tin đồn dai dẳng rằng cây cổ thụ lâu đời nhất trong sân được trồng đúng tại nơi người sáng lập [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] từng nhìn thấy viễn cảnh huy hoàng trong tương lai."
  guide_learning_4: "Những lời thì thầm kể về một bản thảo ẩn giấu bên trong [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] có thể ban cho trí tuệ vô song cho những ai giải mã được văn tự cổ của nó."
  guide_learning_5: "Người ta nói rằng đi vòng quanh [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ba lần vào lúc nửa đêm sẽ khiến hồn ma của một học giả bị lãng quên từ lâu hiện ra, háo hức chia sẻ tri thức của mình."
 # Mines
  guide_mines_1: "Truyền thuyết địa phương cho rằng đường hầm sâu nhất dẫn xuống địa ngục, nơi các linh hồn dẫn lối thợ mỏ đến những mạch quặng giàu có nhất."
  guide_mines_2: "Một câu chuyện của thợ mỏ già kể về một mạch vàng tinh khiết đến mức tự nó phát sáng, nhưng chỉ những kẻ có trái tim trong sạch mới có thể nhìn thấy."
  guide_mines_3: "Những truyền thuyết thì thầm về một căn phòng bí mật chứa đầy của cải nguyên vẹn của các vị vua cổ đại, bị phong ấn và canh giữ bởi những thợ mỏ linh hồn."
  guide_mines_4: "Người ta nói rằng gõ ba lần vào một tảng đá không dấu hiệu nào đó trong mỏ sẽ mở ra con đường dẫn đến kho báu vượt ngoài sức tưởng tượng."
  guide_mines_5: "Tin đồn lan truyền về một viên ngọc bí ẩn ban cho những thị kiến về tương lai, được chôn giấu đâu đó trong mê cung đường hầm."
 # Martial
  guide_martial_1: "Có một truyền thuyết rằng các bức tường của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] chứa một hòn đá sẽ rỉ máu nếu kẻ thù tiến gần biên giới vương quốc."
  guide_martial_2: "Người ta thì thầm rằng một kho vũ khí bí mật gồm những binh khí bất khả chiến bại được giấu bên dưới [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], chỉ có thể tiếp cận vào lúc nguyệt thực."
  guide_martial_3: "Những binh sĩ già kể lại câu chuyện về một đường hầm bí mật bên dưới [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], từng được một vị vua thời xưa dùng để nghe lén kẻ thù."
  guide_martial_4: "Một huyền thoại trong hàng ngũ lính gác nói về một lính canh ma quái tuần tra trên tường thành vào ban đêm, bảo vệ [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] khỏi những mối nguy vô hình."
  guide_martial_5: "Dân gian truyền rằng những người xây dựng ban đầu đã khắc một lời nguyền lên cổng của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], khiến những kẻ xâm lược quay sang tàn sát lẫn nhau."
 # Ancient Wonders
  guide_ancient_wonders_1: "Người ta nói rằng thì thầm một điều ước vào những khe nứt của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] lúc bình minh sẽ khiến nó trở thành hiện thực."
  guide_ancient_wonders_2: "Một truyền thuyết cho rằng những cái bóng của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] vào lúc hoàng hôn sẽ chỉ đường đến kho báu bị chôn giấu của các bậc thống trị cổ xưa."
  guide_ancient_wonders_3: "Có một câu chuyện kể rằng kiến trúc sư thực sự của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] đã để lại một căn phòng bí mật chứa chìa khóa của sự bất tử."
  guide_ancient_wonders_4: "Một câu chuyện cổ cho rằng đi vòng quanh [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] theo hướng ngược lại vào lúc nửa đêm sẽ hé lộ lối vào một thế giới ngầm bị che giấu."
  guide_ancient_wonders_5: "Người ta thì thầm rằng những khối đá của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ngân vang những bùa chú cổ xưa vào thời khắc đông chí, mở ra cánh cổng đến những cõi giới đã bị lãng quên."
 # Economic
  guide_economic_1: "Tin đồn cho rằng của cải thực sự của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] không nằm ở hàng hóa buôn bán, mà ở một kho tiền bí mật bên dưới các khu chợ, chất đầy của cải vô kể."
  guide_economic_2: "Truyền thuyết kể về một cuốn sổ cái bí mật bên trong [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ghi chép các khoản nợ của vua chúa và hoàng đế, ban cho người đọc quyền lực thao túng các quốc gia."
  guide_economic_3: "Người ta nói rằng người sáng lập [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] đã chôn giấu một tấm bản đồ trong các bức tường, dẫn đến kho đá quý được cất kín."
  guide_economic_4: "Có một câu chuyện rằng một thương nhân ma quái lang thang trong các hành lang của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] vào ban đêm, đề nghị trao đổi bí mật để lấy linh hồn của kẻ tham lam."
  guide_economic_5: "Những lời thì thầm trong dân chúng cho rằng gõ theo một nhịp nhất định lên những viên đá lát trong sân của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sẽ hé lộ một ngăn bí mật chứa những đồng tiền cổ."
 # Diplomatic
  guide_diplomatic_1: "Một tin đồn được thì thầm trong giới triều thần rằng sức mạnh thực sự của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] nằm trong một căn phòng bí mật nơi mọi hiệp ước trên thế giới được ràng buộc bằng phép thuật và có thể bị thay đổi bởi người xứng đáng."
  guide_diplomatic_2: "Người ta nói rằng một lối đi ẩn bên trong [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] dẫn đến một căn phòng vang vọng suy nghĩ của các sứ thần ghé thăm, phơi bày ý đồ thật sự của họ."
  guide_diplomatic_3: "Truyền thuyết kể rằng những tấm gương trong đại sảnh của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] không chỉ phản chiếu diện mạo, mà còn cả bản chất thật của linh hồn, vạch trần đồng minh lẫn kẻ thù."
  guide_diplomatic_4: "Một câu chuyện cổ trong giới ngoại giao nói rằng những bức tượng trong khu vườn của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] thì thầm những bí mật của các cuộc đàm phán trong quá khứ với những ai lắng nghe lúc chạng vạng."
  guide_diplomatic_5: "Có một câu chuyện rằng đài phun nước trong sân của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] ban cho sự hùng biện và khả năng thuyết phục cho những ai uống nước của nó dưới trăng tròn."
 # Natural Wonder
  guide_natural_wonder_1: "Người dân địa phương tin rằng làn nước của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] có thể chữa lành mọi bệnh tật nếu tắm trong đó dưới ánh bình minh đầu tiên."
  guide_natural_wonder_2: "Một truyền thuyết trong giới leo núi cho rằng chạm tới đỉnh của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] sẽ ban cho thị kiến về số mệnh của bản thân, nhưng chỉ dành cho những ai leo lên một mình và không ngoảnh đầu lại."
  guide_natural_wonder_3: "Người ta nói rằng tiếng vọng giọng nói của Ngài từ đỉnh [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] có thể mang thông điệp đến người đã khuất, đem lại sự yên bình cho các linh hồn không yên nghỉ."
  guide_natural_wonder_4: "Một thần thoại cổ kể về một hang động bí mật bên trong [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] đưa những ai bước vào đến một thiên đường chưa từng được sinh linh nào chứng kiến."
  guide_natural_wonder_5: "Người ta thì thầm rằng những loài hoa hiếm nhất mọc dưới chân [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] chỉ nở một lần mỗi thế kỷ, và hương thơm của chúng ban cho những giấc mơ tiên tri."

  bp3_journey.1900.t: "Tội nghiệp [local_character.GetFirstNameNoTooltip]"
  bp3_journey.1900.desc: ""Hãy thương xót cho [local_character.GetFirstName] đáng thương này, chỉ cần vài đồng xu thôi là đủ rồi!" [local_character.GetWomanMan] van xin bằng một giọng run rẩy.\n\n[ROOT.Char.Custom('FormerJob')]"
  court_tutor_court_position_job: ""Ta từng dạy dỗ con cái của Nhà [former_employer.GetHouse.GetName] để phục vụ cho tên [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName]. Ta giỏi công việc của mình, dạy bọn trẻ về [ROOT.Char.Custom('highest_skill_noun')] – nhưng than ôi! Dịch vụ của Ta đã #EMP 'không còn cần thiết'#! khi bọn trẻ lớn lên, và giờ Ta sống lang thang trên đường phố!""
  royal_architect_court_position_job: ""Ta từng thiết kế những công trình vĩ đại cho [former_employer.GetTitledFirstName], tháp cao, dinh thự, thậm chí cả lâu đài! Khi công trình cuối cùng mang danh nghĩa của [former_employer.GetHerHis] hoàn thành, [former_employer.GetSheHe] đã chiếm hết vinh quang và đày Ta đi! Giờ Ta sống dưới bóng của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], mơ về ngày được xây dựng trở lại...""
  cupbearer_court_position_job: ""Ta từng phục vụ đồ uống tại hội đồng của [former_employer.GetTitledFirstName], và Ta đảm bảo không một chiếc cốc nào bị cạn! Một ngày nọ Ta bị đổ tội đầu độc một vị khách – nhưng đó chỉ là thịt hỏng trong bữa ăn, hôm sau ông ta hoàn toàn bình thường! Dĩ nhiên, điều đó không ngăn được họ tước đoạt danh dự và kế sinh nhai của Ta...""
  court_poet_court_position_job: ""Ta từng sáng tác những vần thơ tuyệt đẹp cho [former_employer.GetTitledFirstName], ca ngợi đức hạnh và nhân cách của [former_employer.GetHerHis]! Cả Nhà [former_employer.GetHouse.GetName] đều yêu thích thơ văn của Ta, nhưng khi kho bạc của họ cạn dần – thì tình yêu dành cho thi ca cũng biến mất, và giờ Ta ở đây, nghèo khổ và cô độc.""
  chronicler_court_position_job: ""Ta đã ghi chép biên niên sử các huyền thoại của Nhà [former_employer.GetHouse.GetName], làm việc ngày đêm, đôi tay nhuốm đầy mực... Nhưng ngay khi cuốn sách hoàn thành, chủ nhân của Ta là [former_employer.GetTitledFirstName] lại trơ trẽn gọi Ta là #EMP 'thừa thãi'#! và thẳng tay ném Ta ra đường!""
  wet_nurse_court_position_job: ""Ta từng chăm sóc những đứa trẻ thơ của Nhà [former_employer.GetHouse.GetName]. Ta nhìn chúng lớn lên, cho ăn, thay quần áo, dạy chúng tập đi... và chúng yêu quý Ta! Giờ Ta lạc lõng và khốn cùng, khi kẻ tàn nhẫn là [former_employer.GetTitledFirstName] cho rằng Ta là một #EMP 'gánh nặng vô dụng'#! khi bọn trẻ đã trưởng thành!""
  antiquarian_court_position_job: ""Ta từng chăm sóc các cổ vật của [former_employer.GetPrimaryTitle.GetAdjective] để phục vụ tên [former_employer.Custom2('InsultAdjective', SCOPE.sC('local_character'))] [former_employer.GetTitledFirstName]. Ta đánh bóng bình gốm và rương báu, bảo quản vũ khí và trang sức bằng dầu sáng bóng, gấp lụa và vải lanh với sự tỉ mỉ tuyệt đối – và Ta nhận lại được gì? Ta bị đuổi ra đường! Ôi, giá như Ta được chăm sóc những báu vật ấy thêm lần nữa..."
  bp3_journey.1900.knowledge_hoarding: "Ngươi biết gì về nơi này? Hãy nói cho ta tất cả!"
  bp3_journey.1900.curiosity: "Tội nghiệp ngươi, hãy theo ta, ta sẽ chăm sóc cho ngươi!"
  bp3_journey.1900.a: "Hãy nhận những đồng xu này, và kể ta nghe câu chuyện của ngươi."
  bp3_journey.1900.b: "Ta có thể cho ngươi nhiều hơn tiền – ta có thể cho ngươi một công việc!"
  bp3_journey.1900.c: "Cút đi, đồ ăn mày bẩn thỉu!"
 
  bp3_journey.2000.t: "Huyền Thoại Sống"
  bp3_journey.2000.desc: ""Chào ngài, ta tin rằng ngài chính là [ROOT.Char.GetTitledFirstName]?" người [new_promoter.GetWomanMan] ra hiệu gọi Ta lại.\n\n"Ta là [new_promoter.GetFirstNameNicknamed], [new_promoter.GetTitleAsNameNoTooltip|U] của [new_promoter.GetPrimaryTitle.GetBaseNameNoTier], và ta đã nghe truyền thuyết về [ROOT.Char.GetPromotedLegend.GetName]!" [new_promoter.GetSheHe] nói tiếp. "Một vài nhạc công gần [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] đã thu hút khá đông người khi hát về những chuyến phiêu lưu của [ROOT.Char.GetPromotedLegend.GetProtagonist.GetShortUINamePossessive], điều đó khiến ta vô cùng hứng thú – liệu ngài có thể ưu ái kể lại câu chuyện ấy bằng chính lời của mình không?""
  bp3_journey.2000.a: "Những nhạc công đó ở đâu? Ta muốn bảo trợ cho họ..."
  bp3_journey.2000.b: "Ta rất sẵn lòng kể cho ngươi!"
  bp3_journey.2000.c: "Ta còn những việc tốt hơn để làm."
 
  bp3_journey.2100.t: "Đặc Sản Của [location.GetCounty.GetTitle.GetAdjectiveNoTooltip]"
  bp3_journey.2100.desc: ""Thức ăn đây!" người bán hàng rong hét lớn. "Ta có xiên nướng [local_character.Custom('RegionalEdibleMeat')], ta có [local_character.Custom('GetRandomRegionalSmallGame')] nhồi [local_character.Custom('GetFoodDetail')], ta có [local_character.Custom('FavoriteTreatDemand')] – và tại sao không làm một cốc [local_character.Custom('RegionalDrink')] để trôi cổ!\n\n"Thật ra!" [local_character.GetSheHe] quay sang Ta. "Sao ngài không thử món đặc biệt nhất của ta – [local_character.Custom('FunFoodPrefix')]-[local_character.Custom('GetLocalStreetFood')] kiểu [location.GetCounty.GetTitle.GetAdjectiveNoTooltip]? Nó rất bổ dưỡng và còn có tác dụng kỳ diệu: nó sẽ khiến ngài trở nên còn [ROOT.Char.Custom('ComplimentAdjective')] hơn nữa!""
  bp3_journey.2100.knowledge_hoarding: "Tác dụng kỳ diệu ư? Hừm, cho ta một phần."
  bp3_journey.2100.curiosity: "Ta rất thích ẩm thực [local_character.GetCulture.GetNameNoTooltip], cho ta nếm thử tất cả!"
  bp3_journey.2100.curiosity_2: "Ngươi nên nếm thử món ăn [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] tại [ROOT.Char.Custom('GetCourtType')] của ta!"
  bp3_journey.2100.a: "Cho ta một cốc [local_character.Custom('RegionalDrink')] và một xiên [local_character.Custom('RegionalEdibleMeat')]."
  bp3_journey.2100.b: "Ngươi trông có vẻ sẽ trở thành một người nếm thức ăn rất tuyệt."
  bp3_journey.2100.c: "Không, ta đến đây để khám phá."
  food_prefix_honey: "mật ong"
  food_prefix_berry: "quả mọng"
  food_prefix_salt: "muối"
  chance_of_food_poisoning: "Khả năng Ngộ Độc Thực Phẩm #weak ([GetTrait('ill').GetName( GetPlayer )])#!: #N [SCOPE.ScriptValue('food_poison_value')|0]%#!"
 
  bp3_journey.2200.t: "[local_character.Custom('RaunchyComplimentNoun')|U] của [location.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
  bp3_journey.2200.desc: ""Ngài có khao khát được bầu Ngài không, [ROOT.Char.Custom('FormOfAddressForLiege')]?" một [local_character.GetWomanMan] thì thầm đầy quyến rũ, lướt ngón tay dọc theo [local_character.GetHerHis] [local_character.Custom('ObjectifiedFeature')]. "Dù ham muốn của ngài là gì, ta chắc chắn sẽ làm ngài hài lòng –" [local_character.GetSheHe] nói tiếp khe khẽ.\n\n"Ta có thể xoa dịu thân thể ngài bằng những loại dầu ấm, hoặc làm thỏa mãn tâm trí bằng việc đọc [SCOPE.Custom('RandomEntertainmentTextName')], hoặc nếu dục vọng của ngài mang tính... xác thịt hơn, thì đêm nay ta sẽ là của ngài.""
  bp3_journey.2200.spread_legend_intent: "Ta có thể đọc cho ngươi nghe một thứ: [ROOT.Char.GetPromotedLegend.GetNameNoTooltip]!"
  bp3_journey.2200.knowledge_hoarding: "Ta khao khát bầu Ngài – dưới hình thức trò chuyện!"
  bp3_journey.2200.curiosity: "Ngươi thật đặc biệt! Hãy từ bỏ cuộc sống này và theo ta."
  bp3_journey.2200.curiosity_2: "Vẻ đẹp này – hãy là của ta, [local_character.Custom('RaunchyComplimentNoun')] [location.GetCounty.GetTitle.GetAdjectiveNoTooltip] của ta!"
  bp3_journey.2200.a: "Ta sẽ cho [local_character.GetHerHim] một trận cuồng nhiệt!"
  bp3_journey.2200.a_2: "Dầu nóng nghe cũng không tệ..."
  bp3_journey.2200.b: "Người có tài năng như ngươi thật lãng phí khi ở đây."
  bp3_journey.2200.c: "Tránh xa ta ra, [local_character.Custom2('InsultNounSexual', ROOT.Char)]."
  local_monument_tt: "[local_character.GetSheHe|U] đã sống gần [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] trong phần lớn cuộc đời của [local_character.GetHerHis], vì vậy [local_character.GetSheHe] hẳn phải có rất nhiều điều để kể cho ta về nơi đó."

  bp3_journey.2300.t: "[local_ruler.GetTitledFirstNamePossessiveNoTooltip] [regiment.GetNameNoTooltip]"
  bp3_journey.2300.desc: "Trước cổng [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip], ta bắt gặp một đoàn diễu hành của [regiment.GetName] đang tổ chức lễ khải hoàn để vinh danh [local_ruler.GetLadyLord|U] địa phương, [local_ruler.GetTitledFirstName].\n\n"Các ngươi là niềm tự hào của vùng đất này!" giọng nói của [local_ruler.GetFirstNamePossessiveNoTooltip] vang vọng khắp sân. "Những chiến binh [location.GetCulture.GetNameNoTooltip] vinh quang của ta – tinh hoa ưu tú nhất của [regiment.GetNameNoTooltip] – và là những người bảo hộ vĩnh cửu của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!""
  bp3_journey.2300.knowledge_hoarding: "Hãy cùng trò chuyện về nơi đầy mê hoặc này, [local_ruler.GetLadyLord|U] [local_ruler.GetFirstNameNoTooltip]."
  bp3_journey.2300.curiosity: "Ngài cai trị người [location.GetCulture.GetCollectiveNounNoTooltip] thật đáng khâm phục!"
  bp3_journey.2300.curiosity_2: "Ta sẽ vô cùng vinh dự nếu được chiêu mộ một dũng sĩ, [local_ruler.GetFirstNameNoTooltip]!"
  bp3_journey.2300.a: "Với sự ban phước của [local_ruler.GetFirstNamePossessiveNoTooltip], ta cũng có thể triển khai [regiment.GetNameNoTooltip]!"
  bp3_journey.2300.b: "Một người trong số [regiment.GetNameNoTooltip] này sẽ là một dũng tướng tuyệt vời."
  bp3_journey.2300.c: "Ta nên xuất hiện bên cạnh [local_ruler.GetFirstNameNoTooltip]."
 
