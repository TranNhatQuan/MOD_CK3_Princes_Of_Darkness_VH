  bp3_journey.0005.t: "Cảnh sắc của [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
  bp3_journey.0005.desc: "[location.Custom('GetTouristHoldingIntro')] [ROOT.Char.Custom('IntentDesc')]\n\n[location.Custom('GetTouristStartEventOutro')]"
  bp3_journey.0005.a: "Ta sẽ rèn luyện kỹ năng ngoại giao của mình!"
  bp3_journey.0005.b: "Chiến lược, chiến thuật, công sự – mọi thứ đều đáng quan tâm!"
  bp3_journey.0005.c: "Nơi này có rất nhiều điều để học hỏi."
