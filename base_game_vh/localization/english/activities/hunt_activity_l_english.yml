  activity_hunt_conclusion_desc_legendary_success:0 "Cuộc săn con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] huyền thoại cuối cùng đã hoàn tất! Khúc ca sẽ được hát về ngày hôm nay và tài nghệ cần có để hạ gục một mãnh thú như vậy!"
