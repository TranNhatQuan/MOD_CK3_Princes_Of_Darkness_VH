  hunt_attendants_many:0 "Đội xua thú"
  hunt_attendants_many_desc:1 "$BULLET_WITH_TAB$Tăng [hunt_success_chance_no_prefix|E] đáng kể$hunt_attendants_roco_tt$\n\n#weak Các nhóm thợ săn chuyên nghiệp sẵn sàng truy đuổi và điều hướng con mồi.#!"
  hunt_option_party_size:0 "Quy mô đoàn"
  hunt_party_size_few:0 "Đoàn nhỏ thân mật"
  hunt_party_size_few_desc:0 "$BULLET_WITH_TAB$[GetPlayer.Custom('GetHuntMasterTooltipDesc')] của Ngài, [GetCourtPositionType('bodyguard_court_position').GetName()], [GetCourtPositionType('court_physician_court_position').GetName()], [spouses|E], [friends|E], [lovers|E] và các Thợ săn tham gia\n\n#weak Một nhóm nhỏ những cận thần và người thân tín đáng tin cậy.#!"
  hunt_party_size_normal:0 "Đoàn vừa phải"
  hunt_party_size_normal_desc:0 "$BULLET_WITH_TAB$Nhận thêm [prestige_i|E][prestige|E] khi kết thúc\n$BULLET_WITH_TAB$Các $knight_culture_player_plural$ không có đất và các [courtiers|E] hoặc [guests|E] lười biếng [GetTrait('lazy').GetName( GetNullCharacter )] hay được huấn luyện quân sự tham gia\n\n#weak Một nhóm khá đông các nhân vật và cận thần trong lãnh thổ.#!"
  hunt_party_size_many:0 "Đoàn đông đảo"
  hunt_party_size_many_desc:0 "$BULLET_WITH_TAB$Nhận nhiều hơn nữa [prestige_i|E][prestige|E] khi kết thúc\n$BULLET_WITH_TAB$Tất cả [courtiers|E] và [guests|E] đều tham gia\n\n#weak Một phần lớn của triều đình, lãnh thổ và vùng lân cận.#!"
