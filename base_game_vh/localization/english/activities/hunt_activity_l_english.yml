 ### ACTIVITY
 # GUESTS
 # PHASES
  hunt_phase:0 "Săn bắn"
  hunt_type_standard:0 "Săn bắn"
  hunt_type_standard_desc:1 "$EFFECT_LIST_BULLET$ Chọn con mồi từ nhiều loài động vật địa phương\n$EFFECT_LIST_BULLET$ Tăng $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ [hunt_danger_no_prefix|E] cao hơn sẽ mang lại nhiều [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Giới tính võ nghệ có thể trực tiếp tham gia\n$EFFECT_LIST_BULLET$ Giới tính không võ nghệ có thể quan sát\n#weak Những mãnh thú kiêu hãnh và xảo quyệt rình rập nơi hoang dã; đánh bại chúng là phép thử của dũng khí và kỹ nghệ.#!"
  hunt_type_legendary:1 "Huyền thoại"
  hunt_type_legendary_desc:1 "$EFFECT_LIST_BULLET$ Tìm kiếm sinh vật huyền thoại được phát hiện trong khu vực\n$EFFECT_LIST_BULLET$ Tăng $trait_track_hunter$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ [hunt_danger_no_prefix|E] cao hơn sẽ mang lại nhiều [prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$ Giới tính võ nghệ có thể tham gia\n$EFFECT_LIST_BULLET$ Giới tính không võ nghệ có thể quan sát\n#weak Sinh vật huyền thoại thường bị xem là truyền thuyết, nhưng rừng sâu vẫn còn nhiều điều bí ẩn.#!"
  hunt_type_falconry:1 "Nuôi chim săn"
  hunt_type_falconry_desc:1 "$EFFECT_LIST_BULLET$ Chọn con mồi từ nhiều loài chim săn\n$EFFECT_LIST_BULLET$ Tăng $trait_track_falconer$ [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Cả hai giới đều có thể tham gia\n#weak Dù tốn kém, nghệ thuật thả chim săn mang lại niềm vui thuần khiết trong việc chế ngự thiên nhiên – một thú vui cao quý bậc nhất.#!"

