l_english:
  tournament_events.9000.t:0 "Cảnh Sắc của [tournament_province.GetNameNoTooltip]"
  tournament_events.9000.desc:0 "Dạo bước quanh khu vực bên ngoài đấu trường, ta bị choáng ngợp bởi vẻ đẹp tràn ngập nơi đây tại [tournament_province.GetName].\n\nTa bước đi trên vùng [tournament_province.Custom('TerrainTypeProvince')] rải rác những thảm [tournament_province.Custom('get_region_flower_type_plural')], rồi dừng lại chỉ để chạm tay vào lớp vỏ của một cây [tournament_province.Custom('GetRandomAppropriateTree')] nguyên sơ. Ngẩng đầu lên, ta thấy một đàn [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] bay lượn phía trên.\n\n"
  tournament_events.9000.desc_home:0 "Ta nên làm điều này thường xuyên hơn — dù sao thì đây cũng là quê hương của ta."
  tournament_events.9000.desc_not_home:0 "Ta ước gì trong tương lai sẽ có cơ hội quay lại nơi này."
  tournament_events.9000.a:0 "À, thật thư thái!"
  tournament_events.9000.b:0 "Một nơi hoàn hảo để luyện tập trong yên bình."
  tournament_events.9000.impatient:0 "Toàn là mấy thứ cảm tính vô nghĩa! #EMP Ta cần vận động!#!"
 
  tournament_events.9001.t:0 "Một $knight_culture_player_no_tooltip$ Không Có Chủ"
  tournament_events.9001.desc:0 "Khi ta đang khám phá khu vực xung quanh, một nhân vật mặc giáp chỉnh tề tiến đến gần.\n\n\"[ROOT.Char.GetTitledFirstName], thật là vinh hạnh.\" người [liegeless_knight.GetWomanMan] cúi chào ngắn gọn và [liegeless_knight.Custom('quirk_pos_present')]. \"Ta là [liegeless_knight.GetFullName], một $knight_culture_player_no_tooltip_lowercase$ đang tìm kiếm người bảo trợ. Ta là [liegeless_knight.Custom('FormalComplimentAdjective')], [liegeless_knight.Custom('ComplimentAdjective')], trung thành, và gia tộc của Ta rất vững mạnh — #EMP [liegeless_knight.GetHouse.GetMotto]!#!\" [liegeless_knight.GetSheHe] hô lớn rồi đứng nghiêm.\n\nRõ ràng vị quý tộc nhỏ này đang phóng đại những đức tính của [liegeless_knight.GetHerHis], nhưng [liegeless_knight.GetSheHe] có vẻ có năng lực. Và tuyệt vọng."
  tournament_events.9001.a:0 "\"Ngươi có thể gia nhập hàng ngũ $knight_culture_player_plural_no_tooltip_lowercase$ của ta.\""
  tournament_events.9001.b:0 "\"Ta sẽ hậu đãi ngươi nếu ngươi thề trung thành với ta!\""
  tournament_events.9001.c:0 "\"Biến đi, ta khó mà tin tưởng ngươi.\""
  tournament_events.9001.d:0 "\"Ta còn rất nhiều điều phải học hỏi từ ngươi!\""
 
  tournament_events.9002.t:0 "Màn Trình Diễn Của Lực Sĩ Mạnh Mẽ"
  tournament_events.9002.desc:0 "Những âm thanh náo nhiệt khiến ta phát hiện ra một đấu trường tạm bợ do những người nông dân địa phương dựng lên, nơi hai đô vật lực lưỡng đang biểu diễn cho đám đông. Họ trao đổi những cú đánh, né tránh, cúi người và xoay quanh nhau — cho đến khi một người thực hiện một đòn thế táo bạo:\n\n\"Ta gọi chiêu này là #EMP [strongman_1.Custom('GetDescriptorManeuver')] [strongman_1.Custom('GetManeuver')]!#!\" [strongman_1.GetSheHe] hét lớn trước khi nhấc bổng đối thủ của [strongman_1.GetHerHis] lên và nện [strongman_1.GetHerHim] xuống đất — khiến [strongman_2.GetHerHim] lập tức chịu thua. \"[strongman_1.GetFirstName] Kẻ [strongman_1.Custom('ComplimentAdjective')|U] và [strongman_1.Custom('RandomPositiveLookAdjective')|U], lại một lần nữa giành chiến thắng!\" người chiến thắng tự đắc nói."
  tournament_events.9002.whole_of_body:0 "Thật thư giãn khi xem những kỹ thuật chuyên nghiệp!"
  tournament_events.9002.a:0 "Woo! Thật là kích thích!"
  tournament_events.9002.b:0 "Hm, ta nên nghiên cứu kỹ thuật của họ..."
  tournament_events.9002.c:0 "Ngươi, kẻ chiến thắng — đây là vài đồng xu!"
  tournament_events.9002.b.success:0 "Ngươi được truyền cảm hứng từ các đô vật"
  tournament_events.9002.b.failure:0 "Ngươi không học được điều gì"
 
  tournament_events.9003.t:0 "Một Cuộc Dạo Bước Tình Cờ"
  tournament_events.9003.desc:0 "Tìm chốn yên tĩnh tránh khỏi sự ồn ào của đấu trường, ta tình cờ phát hiện một lối mòn nhỏ ẩn giữa những cây [tournament_province.Custom('GetRandomRegionalWood')]. Lang thang dọc theo [tournament_province.Custom('GetProvinceFoliageDesc')], ta nhìn thấy từng luống [tournament_province.Custom('get_region_flower_type_plural')] rực rỡ.\n\n"
  tournament_events.9003.friend:0 "Bất chợt ta thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] của mình — [intent_target_character.GetFirstName] — đang tiến lại từ hướng đối diện, vận may thật mỉm cười! Ta vẫn muốn được nói chuyện riêng với [intent_target_character.GetHerHim], có lẽ ta nên bắt đầu một cuộc trò chuyện?"
  tournament_events.9003.lover:0 "Khi ngẩng đầu lên khỏi sự cô tịch của mình, ta bắt gặp bông hoa đẹp nhất trong số tất cả. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('intent_target_character'))] của ta, [intent_target_character.GetFirstName], người trong mộng của ta, cũng đã chọn cùng một lối đi!"
  tournament_events.9003.a:0 "Chúng ta lặng lẽ lướt qua nhau."
  tournament_events.9003.b:0 "Một nơi hoàn hảo để luyện tập trong yên bình."
  tournament_events.9003.lover_attempt:0 "\"Ngươi còn đẹp hơn bất kỳ đóa hoa nào ở đây.\""
  tournament_events.9003.lover_attempt.critical_success:0 "[intent_target_character.GetSheHe|U] say đắm yêu ngươi"
  tournament_events.9003.lover_attempt.success:0 "[intent_target_character.GetSheHe|U] thấy cử chỉ này vô cùng lãng mạn"
  tournament_events.9003.lover_attempt.minor_success:0 "[intent_target_character.GetSheHe|U] thấy cử chỉ này thật dễ thương"
  tournament_events.9003.lover_attempt.fail:0 "[intent_target_character.GetSheHe|U] hoàn toàn bối rối"
  tournament_events.9003.friend_attempt:0 "\"Đi bộ một mình thật chán, chúng ta nói chuyện về [intent_target_character.Custom('MatchingConversationSubject')] nhé?\""
  tournament_events.9003.friend_attempt.critical_success:0 "[intent_target_character.GetSheHe|U] rất thích sự đồng hành của ngươi"
  tournament_events.9003.friend_attempt.success:0 "[intent_target_character.GetSheHe|U] cảm thấy cuộc trò chuyện khá thú vị"
  tournament_events.9003.friend_attempt.failure:0 "[intent_target_character.GetSheHe|U] lặng lẽ rời đi..."
 
  tournament_events.9004.t:0 "Giải Trí Có Cánh"
  tournament_events.9004.desc:0 "\"Bay đi, #EMP [falconer_1.Custom('GetBirdName')|U]#!, nhanh hơn nữa!\" ta nghe thấy giọng của một [falconer_1.GetWomanMan] vang khắp khu vực. Ngẩng đầu lên, ta thấy một sinh vật nhỏ lao vun vút trên bầu trời như một tia sét đen. Chẳng bao lâu sau, nó lao xuống vạch đích.\n\n\"Bah, ngươi gian lận rồi! Chim của ngươi không thể bay nhanh như vậy được — nhìn nó kìa, nó [falconer_1.Custom('GetBirdInsult')]!\" kẻ thua cuộc giận dữ hét lên, trong khi người thắng cuộc tỏ vẻ đắc thắng."
  tournament_events.9004.hunter:0 "Ta có thể học hỏi được đôi điều từ chuyện này..."
  tournament_events.9004.a:0 "Thật là một màn giải trí tuyệt vời!"
  tournament_events.9004.b:0 "Hm, hẳn phải chuẩn bị rất nhiều cho việc này."
  tournament_events.9004.c:0 "Gấp đôi hay không có gì — làm lại lần nữa!"
  tournament_events.9004.c.success:0 "Ngươi thắng cược"
  tournament_events.9004.c.failure:0 "Ngươi thua cược"
  tournament_events.9004.d:0 "Ta không có thời gian cho chuyện này."
  round_as_an_egg:0 "tròn như trứng"
  heavy_as_a_stone:0 "nặng như đá"
  graceful_as_a_goose:0 "duyên dáng như ngỗng"
  shaped_like_a_brick:0 "hình thù như viên gạch"
  as_thick_as_you:0 "ngu ngốc như ngươi"
  barely_a_fledgeling:0 "non nớt như chim mới nở"
  wobbly_like_a_duck:0 "lảo đảo như vịt"
  as_fast_as_a_mountain:0 "nhanh như núi"
  as_bright_as_a_rain_cloud:0 "sáng sủa như đám mây mưa"
  an_empty_cup:0 "một chiếc cốc rỗng"
  a_stick_simple:0 "một cây gậy"
  a_rock:0 "một tảng đá"
  available_because_of_intent:0 "Tùy chọn này khả dụng nhờ [intent|E]"
  you_get_drunk:0 "Ngươi say rượu"
  they_share_some_tricks:0 "Họ chia sẻ vài mẹo nhỏ"
  you_have_a_good_time:0 "Ngươi có khoảng thời gian vui vẻ, nhưng không hơn thế"
  tournament_events.9005.t:0 "Cuộc Vui Hò Hét"
  tournament_events.9005.desc:0 "Thức ăn và đồ uống tràn ngập trong suốt giải đấu, khiến những người tham dự vô cùng thích thú. Đặc biệt có ba người nông dân dường như đang chia nhau thứ trông giống như #EMP cả một thùng#! [tournament_host.Custom('RegionalDrink')].\n\n\"A... ta... ta sẽ cho ngươi biết tay vì chuyện đó, tên [peasant_2.Custom2('InsultNoun', SCOPE.sC('peasant_1'))]!\" một người lắp bắp trong cơn say, yếu ớt ném [peasant_1.Custom('ThrowableObjectArticle')] về phía người hàng xóm của [peasant_1.GetHerHis].\n\n\"[peasant_1.GetFirstName], ta... ta... ta xin lỗi! [peasant_1.Custom('GetLaughType')]\" nạn nhân vừa che mặt vừa né tránh đòn tấn công. \"Giúp ta với, [peasant_3.GetFirstName]! #EMP *ợ*#!\"\n\n\"Tự lo đi nhé, [peasant_2.GetName]!\" người cuối cùng hét lên, rồi nốc cạn cả một cốc lớn chỉ bằng một hơi."
  tournament_events.9005.a:0 "Họ thật ồn ào... nhưng ta #EMP thật sự cần#! $knight_culture_player_plural_no_tooltip_lowercase$..."
  tournament_events.9005.b:0 "Ta có thể cùng các ngươi uống một cốc [tournament_host.Custom('RegionalDrink')] không?"
  tournament_events.9005.c:0 "Họ say mềm rồi... chọc tức họ hẳn là quá dễ!"
  tournament_events.9005.d:0 "Thật đáng tởm."
 
  tournament_events.9006.t:0 "Những Câu Chuyện Giải Đấu"
  tournament_events.9006.desc:0 "Một nhóm nhỏ tụ tập quanh [memory_holder.GetTitledFirstName], người đang hùng hồn diễn thuyết — tất cả đều lắng nghe chăm chú.\n\n"
  tournament_events.9006.family:0 "\"Vinh quang cá nhân chỉ là một phần, vinh quang thực sự nằm ở nơi khác.\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Gia đình chính là sức mạnh của ngươi — không có họ, ngươi chẳng là gì cả! Điều này làm ta nhớ đến lần khi [story_memory.GetDescription]...\""
  tournament_events.9006.martial:0 "\"Sức mạnh cơ bắp rất quan trọng, nhưng quan trọng hơn cả là sức mạnh của #EMP trí tuệ.#!" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Trở thành một chiến lược gia giỏi đòi hỏi phải lắng nghe thất bại và thành công của người khác — điều đó dẫn ta nhớ đến lần khi [story_memory.GetDescription]...\""
  tournament_events.9006.death:0 "\"Thành công thực sự bắt nguồn từ một tâm trí không xao nhãng.\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Hãy kìm nén những ký ức gây phân tâm và tận dụng điểm yếu của đối thủ. Để ta kể cho ngươi nghe lần khi [story_memory.GetDescription]...\""
  tournament_events.9006.war:0 "\"Ngươi hỏi sao ta lại lão luyện đến vậy ư?\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Ta đã chinh chiến và chỉ huy quân đội chống lại những kẻ thù hùng mạnh — để ta kể cho ngươi nghe lần khi [story_memory.GetDescription]...\""
  tournament_events.9006.relationships:0 "\"Kỹ năng của riêng ngươi chỉ đưa ngươi đi được đến một mức độ nhất định trong giải đấu.\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Chính những kẻ ủng hộ — hoặc không ủng hộ — ngươi mới là người quyết định số phận của ngươi. Để ta kể cho ngươi nghe lần khi [story_memory.GetDescription]...\""
  tournament_events.9006.travel:0 "\"Hành trình cũng quan trọng không kém đích đến, hãy luôn nắm bắt cơ hội!\" [memory_holder.GetSheHe|U] [memory_holder.Custom('quirk_pos_present')]. \"Ta sẽ không bao giờ đi xa đến vậy nếu không nhận ra mọi cơ hội trên đường — ví dụ như lần khi [story_memory.GetDescription]...\""
  tournament_events.9006.desc_end:0 "\n\nGần nửa giờ trôi qua nhưng cảm giác chỉ như vài giây — [memory_holder.GetSheHe] quả thật rất biết cách kể chuyện!"
  tournament_events.9006.a:0 "Điều này sẽ giúp ta trong phần thi sắp tới!"
  tournament_events.9006.b:0 "Ta nghĩ mình đã học được điều gì đó."
  lifestyle_experience_increased:0 "Kinh Nghiệm Lối Sống Tăng Lên"
  you_learn_a_little:0 "Ngươi học được một chút"
  you_learn_a_lot:0 "Ngươi học được rất nhiều"
  tournament_events.9006.shy:0 "Ước gì ta có thể nói chuyện trước đám đông như vậy..."
  tournament_events.9006.impatient:0 "Thật là lãng phéééé thời gian!"
 
  tournament_events.9007.t:0 "Khúc Khải Hoàn Của Hiệp Sĩ"
  tournament_events.9007.desc:0 "\"Ngài sẽ thắng thôi!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hype_knight'))] của ta, [hype_knight.GetFirstName], thốt lên. \"Chuyện nhỏ như lần [hype_memory.GetSecondPerspectiveDescription] — ngài quá [ROOT.Char.Custom('FormalComplimentAdjective')] và [ROOT.Char.Custom('ComplimentAdjective')] để mà thất bại!\"\n\nThật tuyệt khi biết rằng các $knight_culture_player_plural_no_tooltip_lowercase$ của ta luôn ủng hộ ta!"
  tournament_events.9007.ambitious:0 "Im đi, [hype_knight.Custom('RaunchyComplimentNoun')] — ta biết rồi!"
  tournament_events.9007.a:0 "Ta cảm thấy không gì có thể cản bước!"
  tournament_events.9007.b:0 "Ta chẳng là gì nếu thiếu những người ủng hộ vinh quang này!"
  tournament_events.9007.c:0 "Ta tạ ơn [ROOT.Char.GetFaith.HighGodName] cho chiến thắng sắp tới."
 
  tournament_events.9008.t:0 "Màn Trình Diễn Của Gã Hề"
  tournament_events.9008.desc:0 "\"Mọi người hãy đến đây, hãy chiêm ngưỡng [tournament_fool.Custom2('DescriptorPositive', SCOPE.sC('tournament_fool') )|U] [tournament_fool.GetFirstName]!\" Một [tournament_fool.GetWomanMan] ăn mặc sặc sỡ hét lớn, trong khi đang bấp bênh giữ một [tournament_fool.Custom('GetObjectToBalanceOnNose')] trên mũi của [tournament_fool.GetHerHis].\n\n\"Ta cũng biết kể chuyện nữa! Có lẽ các vị muốn nghe một câu chuyện vui vẻ, như chuyện về khi [memory_story.GetThirdPerspectiveDescription]?\" [tournament_fool.GetSheHe|U] nói trong khi đang thực hiện động tác trồng cây chuối.\n\n\"Hay có lẽ [ROOT.Char.GetLadyLord] của ta muốn nghe một câu chuyện #EMP u ám#! hơn, như câu chuyện về khi [memory_story_negative.GetThirdPerspectiveDescription]?\""
  tournament_events.9008.schemer:0 "Ta #EMP biết#! là ngươi còn nghe được thứ gì đó thú vị hơn..."
  tournament_events.9008.a:0 "Không cần chuyện nhàm chán — ta muốn xem ngươi tung hứng!"
  tournament_events.9008.b:0 "Hãy kể câu chuyện vui!"
  tournament_events.9008.c:0 "Câu chuyện u ám sẽ tạo đúng không khí."
  cheery_disposition_modifier:0 "Tính Cách Vui Vẻ"
  cheery_disposition_modifier_desc:0 "Nhân vật này lạc quan và dễ gần."
  grim_disposition_modifier:0 "Tính Cách U Ám"
  grim_disposition_modifier_desc:0 "Nhân vật này trầm lặng và kiên định."
