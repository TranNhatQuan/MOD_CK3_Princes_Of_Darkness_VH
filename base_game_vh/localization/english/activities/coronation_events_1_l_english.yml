l_english:
 ### Events
 # Flavor
  coronation_events.1000.t: "Lời Chế Giễu Ám Ảnh"
  coronation_events.1000.low_county_opinion.desc: "Một người hát rong quan sát những kẻ tụ họp với nụ cười mỉa mai.\n\n“Khúc ca này xin được dâng tặng [ROOT.Char.GetName], thay mặt cho dân chúng xứ [ROOT.Char.GetCurrentLocation.GetName]. Nó mang tựa đề ‘Ôi [ROOT.Char.GetTitledFirstNameNoTooltip], Người Được Trái Tim Chúng Ta Yêu Mến!’”\n\nGiai điệu rộn ràng, nhưng càng về sau, ta càng bắt gặp ánh tinh quái trong mắt người hát và những tiếng cười bị kìm nén của vài vị khách.\n\nYêu mến thật sao…"
  coronation_events.1000.rival.desc: "Giữa buổi yến tiệc náo nhiệt, ta bắt gặp [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] của mình, [rival.GetName], lén đưa tiền cho một người hát rong. Chỉ chốc lát sau, gã nhạc công lớn tiếng tuyên bố.\n\n“Bản nhạc này là món quà từ [rival.GetNameNoTooltip] dành cho người Bạn Thân yêu của ngài ấy, [ROOT.Char.GetName]! Nó có tên là ‘[ROOT.Char.GetFirstNameNoTooltip], Tên [ROOT.Char.Custom('InsultNoun')|U]!’”\n\nTa đảo mắt tìm kiếm đám đông và thấy [rival.GetFirstNameNoTooltip] đứng đó, gương mặt [rival.GetHerHis] ánh lên niềm hả hê [rival.Custom('InsultAdjective')]. Trớ trêu thay, bài hát lại vô cùng lôi cuốn."
  coronation_events.1000.tyrant.desc: "Một người hát rong, gương mặt đỏ bừng vì thách thức, sải bước lên phía trước và cất lên một khúc ca:\n\n“Hãy chiêm ngưỡng [ROOT.Char.GetName], Bàn Tay Sắt!”\n\nMỗi câu hát cay độc, được phủ lên lớp ca ngợi đầy gai nhọn, vang vọng khắp đại sảnh. Ta nghiến răng khi giai điệu chế nhạo dâng cao, khắc họa triều đại của ta chẳng khác gì một nền bạo ngược hèn mọn."
  coronation_events.1000.desc_fallback: "Người hát rong kết thúc khúc ca sôi nổi bằng một động tác khoa trương, rồi lớn tiếng tuyên bố:\n\n“Khúc ca này xin dành cho [ROOT.Char.GetName], mang tựa đề ‘[ROOT.Char.GetFirstNameNoTooltip], Tên [ROOT.Char.Custom('InsultNoun')|U]!’”\n\nCả đại sảnh chìm vào im lặng, rồi bùng nổ trong những tràng cười vang dội khắp đám đông. Giai điệu, đáng ngạc nhiên thay, lại vô cùng hào hùng."

  coronation_events.1000.bribe: "Trả tiền để đổi lấy một khúc ca ca ngợi ta."
  coronation_events.1000.epic_rap_battle: "Trí tuệ sẽ là chiến bào của ta!"
  coronation_events.1000.epic_rap_battle.tt.success: "Ngươi giành được sự ủng hộ của đám đông"
  coronation_events.1000.epic_rap_battle.tt.failure: "Ngươi tự làm mình bẽ mặt trong nỗ lực giành lấy vương miện"
  coronation_events.1000.guards: "Lính canh, bắt lấy tên [bard.Custom('InsultNoun')] này!"

  coronation_events.1002.t: "Nó Ở Đâu?"
  coronation_events.1002.desc: "Dù nổi tiếng về nhiều mặt, gia thất của ta lại chẳng được biết đến vì sự ngăn nắp. Tiền sảnh rì rầm những lời xin lỗi khe khẽ khi đám gia nhân lúng túng với áo choàng và những khâu chuẩn bị phút chót. Thừa thãi. Những vật quý giá và trọng yếu nhất hẳn phải an toàn — như vương miện của ta. Khoan đã.\n\nVương miện của ta đâu rồi?!"
  coronation_events.1002.rival.desc: "Chỉ vài khoảnh khắc trước lễ đăng quang, ta với tay tìm vương miện — và nó đã biến mất! Cơn hoảng loạn siết chặt lấy ta khi trông thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] của mình, [rival.GetName], đứng ở một góc, ánh mắt [rival.GetHerHis] lướt qua chiếc giá trống rỗng, cùng nụ cười nửa miệng đầy khiêu khích [rival.Custom('InsultAdjective')], như thách thức ta dám buộc tội [rival.GetHerHim].\n\nBên cạnh ta, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('helper'))] của ta, [helper.GetName], lập tức bước lên khi nhận ra tình huống đáng báo động. Không còn thời gian do dự — ta phải hành động!"
  coronation_events.1002.find: "Đến lúc sắp xếp lại mớ hỗn độn này!"
  coronation_events.1002.counterfeit: "May mắn thay, đó chỉ là đồ giả."
  coronation_events.1002.hold: "Lũ khốn khổ đáng thương! Ta sẽ cho các ngươi nếm roi vì chuyện này!"
  coronation_events.1002.accuse: "Chính ngươi đã làm việc này, đồ [rival.Custom('InsultAdjective')] [rival.Custom('InsultNoun')]!"
  coronation_events.1002.accuse.flavor: "Đỡ lấy!"
  coronation_events.1002.friend: "May mắn thay, ta có [helper.GetFirstNameNoTooltip] kề bên."

  coronation_events.1004.t: "Lời Thì Thầm Trong Yến Tiệc"
  coronation_events.1004.desc: "Bằng giọng nói khe khẽ, ta và [confidant.Custom2('MyCharacterIntroduction', ROOT.Char)] đang chia sẻ với nhau những chuyện riêng tư, tránh xa đám đông. Khi [confidant.GetFirstNameNoTooltip] thản nhiên nói rằng [confidant.GetSheHe] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')], ta chợt nhận ra một [spy.GetWomanMan] khả nghi đang nghiêng người về phía chúng ta, căng tai nghe lấy từng lời.\n\nAi mà biết được [spy.GetSheHe] đang mưu tính điều xấu xa gì. [spy.GetSheHe|U] tuyệt đối không được biết chuyện này. Một sự tiết lộ như thế là điều không thể chấp nhận."
  coronation_events.1004.bribe: "\"Bao nhiêu để ngươi giữ im lặng?\""
  coronation_events.1004.recruit: "\"Ta có thể cần một kẻ như ngươi...\""
  coronation_events.1004.intimidation: "#EMP Trừng mắt nhìn [spy.GetHerHim] với sát khí ngút trời.#!"
  coronation_events.1004.intimidation.tt.success: "Màn thị uy đáng sợ của ngươi khiến [spy.GetTitledFirstNameNoTooltip] khiếp đảm"
  coronation_events.1004.intimidation.tt.failure: "Lời đe dọa của ngươi không thể lay chuyển [spy.GetTitledFirstNameNoTooltip]"
  coronation_events.1004.guards: "Lôi tên [spy.Custom2('InsultNoun', ROOT.Char)] này xuống ngục!"
  coronation_events.1004.opt-out: "\"Chuyện đó không liên quan đến ta.\""

  coronation_events.1007.t: "Vấn Đề Thứ Bậc"
  coronation_events.1007.desc: "Khi đoàn rước sắp sửa bắt đầu, ta vô tình nghe thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))] của ta, [first_guest.GetFirstName], và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('second_guest'))] của ta, [second_guest.GetFirstName], tranh cãi về việc ai sẽ dẫn đầu đoàn tiến vào nghi lễ.\n\nCuộc cãi vã của họ vang vọng khắp tiền sảnh, một người khăng khăng rằng kẻ [first_guest.Custom('ComplimentAdjective')] nhất mới xứng đáng, kẻ kia thì cho rằng vị trí đó nên thuộc về người [second_guest.Custom('ComplimentAdjective')] nhất.\n\nQuả thật khiến ta thấy được tâng bốc."
  coronation_events.1007.guest.desc: "Ta đứng trước ngưỡng cửa, sẵn sàng dẫn đầu đoàn rước đăng quang, thì [second_guest.GetFirstName] xông lên phía trước và cười khẩy.\n\n“Công lao của ta với vương quyền đòi hỏi ta phải được đi trước!”\n\nLời thách thức thô lỗ của [second_guest.GetHerHis|U] làm vấy bẩn sự trang nghiêm của buổi chuẩn bị."
  coronation_events.1007.bigger: "Xin mời, [second_guest.GetFirstNameNoTooltip], cứ tự nhiên."
  coronation_events.1007.demand: "Đó là quyền của ta, vì ta là người [first_guest.Custom('ComplimentAdjective')] nhất!"
  coronation_events.1007.appease: "Thôi nào, hãy cùng bàn bạc một giải pháp..."
  coronation_events.1007.first_guest: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_guest'))] của ta phải là người đi đầu!"
  coronation_events.1007.second_guest: "[second_guest.GetFirstNameNoTooltip], ngươi xứng đáng với vinh dự này."
  coronation_events.1007.opt_out: "Vì sao ta phải can dự?"

  coronation_events.1011.t: "Nặng Tựa Vương Miện"
  coronation_events.1011.desc: "Trong khoảnh khắc tĩnh lặng trước lễ đăng quang, các quan chức vén màn, để lộ [ancestor_artifact.GetName]! Ánh sáng của nó tựa như khúc ca kể về những chiến công của tổ tiên ta.\n\nTa nhớ về [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('previous_holder'))] của mình, [previous_holder.GetTitledFirstNameRegnal], người mà sự tinh thông về [previous_holder.Custom('education_focus')] đã định hình nên triều đại phúc lành của [previous_holder.GetHerHis]. Triều đại của ta cũng sẽ được ghi dấu bằng những thành tựu của [ROOT.Char.Custom('education_focus')]. Những hành động của ta rồi sẽ thấm vào [ancestor_artifact.GetName], để nó cất lên những khúc ca mới, trên một chủ đề quen thuộc."
  coronation_events.1011.refit: "Danh tiếng của ta là thứ ta tự rèn nên."
  coronation_events.1011.previous: "Thánh vật này tôn vinh di sản của [previous_holder.GetFirstNamePossessiveNoTooltipRegnal]."
  coronation_events.1011.root_reward.tt: "#weak [artifact|E] sẽ nhận [modifier|E] [skill|E] mới dựa trên loại [education|E]#!"
  coronation_events.1011.previous_reward.tt: "Để vương miện giữ nguyên mục đích ban đầu sẽ gia tăng các Chỉ số cho thánh vật, nhằm tôn vinh Nền Giáo Dục của người tiền nhiệm."
