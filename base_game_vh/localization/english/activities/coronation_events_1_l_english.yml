  coronation_events.1012.t: "Món Ăn Chưa Chín"
  coronation_events.1012.guest.desc: "Món chính được dọn ra: tuyệt phẩm này sẽ được giới quyền quý ghi nhớ!\n\nKhi chủ tiệc cắt vào thớ thịt, cơn đói của ta hóa thành tro tàn trong miệng, phần thịt quay phun máu loang khắp bàn tiệc. Buổi yến tiệc biến thành chiến trường. Ta cố kìm cơn buồn nôn khi những tiếng xì xào ghê tởm vang lên xung quanh."
  coronation_events.1012.host.desc: "Món chính được dọn ra: tuyệt phẩm của bữa tiệc này sẽ được giới quyền quý ghi nhớ!\n\nKhi ta cắt vào phần [guest.Custom('GetExpensiveMeal')], cơn đói của ta hóa thành tro tàn trong miệng, phần thịt quay phun máu loang khắp bàn tiệc. Buổi yến tiệc biến thành chiến trường. Ta cố kìm cơn buồn nôn khi những tiếng xì xào ghê tởm vang lên xung quanh.\n\nTự hỏi liệu ta có nên chi nhiều hơn cho việc chuẩn bị tiệc hay không, ta nhìn [guest.GetName] kinh hãi đẩy chiếc đĩa của [guest.GetHerHis] ra xa — cần phải hành động ngay!"
  coronation_events.1012.eat_it: "Ngươi sẽ ăn nó, và phải tỏ ra thích thú!"
  coronation_events.1012.back: "Gia nhân! Mang thứ này trả lại bếp!"
  coronation_events.1012.trend: "Ý ngươi là sao? Đây là xu hướng mới nhất!"
  coronation_events.1012.complain: "[host.GetTitledFirstNameNoTooltip], đây là trò đùa sao?"
  coronation_events.1012.munch: "Trông cũng ổn đấy chứ!"

  coronation_events.1013.t: "Một Buổi Tối Rực Lửa"
  coronation_events.1013.guest.desc: "Những cuộc vui náo nhiệt của các vị khách xung quanh khiến ta mỉm cười. Ta bật cười khoái trá khi những màn chè chén ồn ào khiến họ loạng choạng va vào nhau.\n\nMột cử chỉ thô lỗ bất ngờ làm rơi một cây đuốc, và nó lao thẳng vào tấm rèm!\n\nNgọn lửa bùng lên dọc theo các bức tường khi khách khứa la hét và tán loạn. Ta lao đi tìm chỗ trú ẩn, tim đập thình thịch, khi đại sảnh nhanh chóng chìm trong khói và hoảng loạn."
  coronation_events.1013.host.desc: "Ta bật cười khi màn chè chén ồn ào của các vị khách khiến họ loạng choạng va vào nhau.\n\nMột cử chỉ thô lỗ bất ngờ làm rơi một cây đuốc, và nó lao thẳng vào tấm rèm! Ngọn lửa bùng lên dọc theo các bức tường khi khách khứa la hét và tán loạn.\n\nBị phân tâm bởi [guest.GetHerHis] [guest.Custom('GetExpensiveDrink_Singular')], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta là [guest.GetName] vẫn chưa nhận ra đám cháy. Ta phải hành động thật nhanh!"
  coronation_events.1013.burn: "Tốt lắm. Cứ để [guest.GetHerHim] cháy."
  coronation_events.1013.run: "Làm sao ta rời khỏi nơi này đây?!"
  coronation_events.1013.hero: "Ta sẽ kìm ngọn lửa lại! Đi theo lối này!"
  coronation_events.1013.snuff_out: "Nếu chỉ cần cắt nguồn không khí..."
  coronation_events.1013.douse: "Đổ cả một thùng [ROOT.Char.Custom('RegionalDrink')] để dập lửa!"

  coronation_events.1014.t: "Cơn Hoảng Loạn Vì Đói"
  coronation_events.1014.guest.desc: "Đang thưởng thức món [guest.Custom('GetExpensiveMeal')] thịnh soạn của mình, ta ngẩng lên trước những tiếng phẫn nộ vang lên.\n\nCó vẻ như chủ tiệc đã không chuẩn bị đủ thức ăn cho tất cả khách mời. Các lãnh chúa vung vẩy những chiếc đĩa trống rỗng, lòng tự ái bị tổn thương biến thành những lời lẽ cay nghiệt và những cú huých càng lúc càng mạnh. Ta né tránh một cơn mưa lời xúc phạm khi các vị khách bị xúc phạm tranh giành từng mẩu thừa.\n\n[guest.GetName] bị mắc kẹt giữa cuộc hỗn loạn."
  coronation_events.1014.host.desc: "Đang thưởng thức món [guest.Custom('GetExpensiveMeal')] thịnh soạn của mình, ta ngẩng lên trước những tiếng phẫn nộ vang lên.\n\nCó vẻ như chính ta đã không chuẩn bị đủ thức ăn cho tất cả khách mời. Các lãnh chúa vung vẩy những chiếc đĩa trống rỗng, lòng tự ái bị tổn thương biến thành những lời lẽ cay nghiệt và những cú huých càng lúc càng mạnh. Ta né tránh một cơn mưa lời xúc phạm khi các vị khách bị xúc phạm tranh giành từng mẩu thừa.\n\n[guest.GetName] bị mắc kẹt giữa cuộc hỗn loạn."
  coronation_events.1014.join: "Tránh ra! Phần cuối là của ta!"
  coronation_events.1014.calm: "Kiềm chế đám ngu xuẩn này lại!"
  coronation_events.1014.run: "Ta chán trò hề này rồi!"

  coronation_events.1015.t: "Lời Chúc Phúc Thiêng Liêng"
  coronation_events.1015.desc: "Một bầu không khí trang nghiêm bao trùm khi bài thánh ca của ca đoàn kết thúc, hào quang linh thiêng lan tỏa khắp đại sảnh. Danh tiếng [GetPietyLevelName(ROOT.Char.GetPietyLevel)|L] của ta dường như đã khiến [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta, [guest.GetName], đứng dậy và tuyên bố với nhiệt huyết chân thành:\n\n\"Nguyện ánh sáng của [ROOT.Char.GetFaith.DivineRealm|U] soi rọi triều đại của Người, và nguyện [ROOT.Char.GetFaith.HighGodName] dẫn lối cho con đường phía trước! Nguyện [ROOT.Char.GetFaith.CreatorName] ban cho Người trí tuệ, và nguyện [ROOT.Char.GetFaith.DevilName] không bao giờ phủ bóng lên ngưỡng cửa của Người!\""
  coronation_events.1015.divine: "Ngợi ca [ROOT.Char.GetFaith.HighGodName]!"
  custom.every_zealous_attending_character: "Mọi nhân vật tham dự có đặc tính [GetTrait('zealous').GetName( GetNullCharacter )]"
  coronation_events.1015.cherish: "Ngươi thật quá tốt bụng, [guest.GetFirstNameNoTooltip]!"
  coronation_events.1015.hush: "Đúng vậy. Giờ thì im lặng."

  coronation_events.1016.t: "Nâng Chén"
  coronation_events.1016.desc: "Đại sảnh lặng đi. Các vị khách nín thở chờ ta lên tiếng. Ta hạ thấp chiếc cốc và để ánh mắt dừng lại nơi [guest.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta, [guest.GetFirstName], và kẻ cũng đầy cảnh giác không kém là [guest_2.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_2'))], [guest_2.GetFirstName].\n\nTa nên phủ họ bằng những lời khen ngọt ngào đánh trúng lòng kiêu hãnh, hay nâng một lời chúc độc địa để nhắc nhở họ ai mới là kẻ nắm quyền ở đây?"
  coronation_events.1016.great: "\"Hãy nghe lời ta nói, bởi đó là sự thật!\""
  coronation_events.1016.great.tt.success: "Ngài thành công trong việc chinh phục họ"
  coronation_events.1016.great.tt.failure: "Ngài không thể lay chuyển họ"
  coronation_events.1016.embarrass: "\"[guest.GetFirstNameNoTooltip] và [guest_2.GetFirstNameNoTooltip], ta cần nhắc nhở các ngươi...\""
  coronation_events.1016.nah: "... hoặc ta có thể uống thêm [guest.Custom('GetExpensiveDrink_Singular')] nữa."

  coronation_events.1017.t: "Cơ Hội Trong Men Rượu"
  coronation_events.1017.desc: "Khắp đại sảnh, các quý tộc trưng ra những bình rượu hảo hạng nhất của vùng đất họ. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] [supporter.Custom('ComplimentAdjective')] của ta, [supporter.GetFirstName], mời ta nếm thử [supporter.Custom('RegionalDrink')], tỏa ra hương mật ong ngọt ngào.\n\nỞ phía đối diện, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] [detractor.Custom('InsultAdjective')] của ta, [detractor.GetFirstName], dâng lên loại [detractor.Custom('RegionalDrink')] hảo hạng, mùi hương nồng đượm hứa hẹn vị đắng khó tránh.\n\nChỉ riêng mùi hương cũng đủ khiến các giác quan của ta bừng tỉnh. Tất cả đều chờ đợi phán quyết của ta."
  coronation_events.1017.diplo: "Nguyện triều đại của ta xứng đáng với sự phong phú và tinh xảo này!"
  coronation_events.1017.isolate: "Phải rồi, [detractor.GetFirstNameNoTooltip], thứ nước hợp với đám hạ nhân của ta."
  coronation_events.1017.empower: "Làm ơn mang thêm cho ta nữa, [supporter.GetFirstName]!"
  coronation_events.1017.nah: "Cứ để các vị khách uống trước, ta sẽ uống sau."
  bp4_coronation_good_harvest_modifier: "Dồi Dào Đồ Uống Ngoại Quốc"
 
  coronation_events.1018.t: "Trò Chơi Ghế Ngồi"
  coronation_events.1018.desc: "Khi ta quan sát bữa tiệc, ta nghe [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] [supporter.Custom('ComplimentAdjective')] của ta, [supporter.GetFirstName], gọi lớn từ phía bên kia bàn: \"Thưa Bệ hạ, chắc hẳn [detractor.GetFirstName] không nên ngồi gần đến vậy!\" Ta liếc nhìn xuống [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] [detractor.Custom2('InsultAdjective', ROOT.Char)] của ta, [detractor.GetFirstName], đang ngồi bên tay trái."
  coronation_events.1018.desc.wrathful: "\n\nLễ nghi kìm hãm bàn tay ta, nhưng phương án rõ ràng nhất là ném cả [detractor.GetFirstName] lẫn chiếc ghế của [detractor.GetHerHis] ra xa khỏi ta."
  coronation_events.1018.desc.diplo: "\n\nNghi thức đòi hỏi ta giữ cao đầu và mỉm cười."
  coronation_events.1018.deal: "Giữ Bạn Bè ở gần..."
  coronation_events.1018.switch: "Giữ cái [detractor.Custom2('InsultNoun', ROOT.Char)] đó thật xa ta."
  bp4_shielded_reign_modifier: "Tránh Xa Kẻ Bất Đồng"

  coronation_events.1019.t: "Biểu Tượng Của Lòng Trung Thành"
  coronation_events.1019.desc: "Ta đưa mắt nhìn những đồng minh trung kiên của mình: [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] [supporter.GetFirstName] đáng kính của ta, người đã thể hiện lòng quả cảm không thể phủ nhận khi [supporter_memory.GetThirdPerspectiveDescription], và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter_2'))] [supporter_2.GetFirstName] đáng kính của ta, người đã luôn kề vai sát cánh cùng ta khi [supporter_2_memory.GetThirdPerspectiveDescription]. Gương mặt họ ánh lên niềm mong đợi, bởi họ biết chính lòng trung thành của mình đã đưa ta đến ngày hôm nay.\n\nLàm sao ta có thể đón nhận lòng trung nghĩa ấy mà lại không tận dụng mọi cơ hội để báo đáp...?"
  coronation_events.1019.both: "Cả hai đều xứng đáng như nhau."
  coronation_events.1019.memory_reward.tt: "Hiệu ứng của lựa chọn này phụ thuộc vào Loại Ký Ức."
  coronation_events.1019.supporter: "\"[supporter.GetFirstNameNoTooltip], ta có thứ dành cho ngươi.\""
  coronation_events.1019.supporter_2: "\"[supporter_2.GetFirstNameNoTooltip], xin hãy nhận lấy.\""
  coronation_events.1019.nah: "Lời nói là đủ rồi."

  coronation_events.1020.t: "Mối Lo Ngại Giữa Các Gia Tộc"
  coronation_events.1020.desc: "Khi yến tiệc đăng quang dần khép lại, những giọng nói cao vút cắt ngang đại sảnh. \"Gia tộc [ROOT.Char.GetDynastyName] là sức mạnh của lãnh thổ,\" [dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] quả quyết. \"Họ hàng của chúng ta nên lãnh đạo, theo đúng truyền thống.\" \n\nBên kia bàn, [not_dynasty_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] phản bác, \"Thế còn những người khác thì sao? Chúng ta phải nộp tiền cho họ và im lặng à?\""
  coronation_events.1020.embrace_supporters: "Ta sẽ ưu ái những kẻ trung thành."
  coronation_events.1020.embrace_supporters.tt: "#EMP #low Các [characters|E] bị ảnh hưởng là [coronation_supporters|E]#!#!"
  coronation_events.1020.weaken_detractors: "Và vì sao, nói ta nghe xem, ta phải lắng nghe ngươi?"
  coronation_events.1020.weaken_detractors.tt: "#weak #EMP Các [characters|E] nhận [stress|E] là [coronation_detractors|E]#!#!"
  coronation_events.1020.a: "Lắng nghe họ, và tìm điểm chung."
  coronation_events.1020.a.flavor: "Ta tập hợp cả hai chư hầu và lắng nghe cẩn trọng, tìm cách xoa dịu căng thẳng và củng cố những sợi dây gắn kết gia tộc."
  coronation_events.1020.b: "Đứng về phía mối lo của [not_dynasty_vassal.GetFirstNamePossessiveNoTooltip]."
  coronation_events.1020.b.custom: "Mọi [vassal|E] cùng [dynasty|E]"
  coronation_events.1020.b.tt: "Họ hàng của Ngài sẽ oán giận việc Ngài đứng về phía kẻ ngoài để đổi lấy lòng trung thành của [not_dynasty_vassal.GetHerHis]."
  coronation_events.1020.c: "Sự hỗn xược này không thể dung thứ."
  coronation_events.1020.d: "Bổn phận của ta trước hết thuộc về huyết thống."
  clan_unity_coronation_increased: "đã chọn ưu ái [house|E] thay vì người ngoài trong khi tổ chức Lễ Đăng Quang"
  clan_unity_coronation_decreased: "đã chọn ưu ái người ngoài thay vì [house|E] trong khi tổ chức Lễ Đăng Quang"

  coronation_events.1021.t: "Vàng Trước Vương Miện"
  coronation_events.1021.desc: "Ngay cả trước khi vương miện chạm đến trán ta, những nỗi lo của lãnh thổ đã đè nặng tâm trí. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('taxman'))] của ta, [taxman.GetTitledFirstName], bước lên và tuyên bố: \"Thưa Bệ hạ, Ta xin phép được thu đủ một phần mười như đã định — không có sự can thiệp từ các quan lại trong triều — nếu không, bổn phận tài chính của Ta sẽ trở thành gánh nặng bất công.\" \n\nBên cạnh [taxman.GetHerHim], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] của ta là [supporter.GetName] quan sát chăm chú, ánh mắt của [supporter.GetHerHis] như hỏi: ta sẽ khuất phục trước màn phô trương lòng tham này sao? Liệu những kẻ moi tiền như [taxman.GetFirstNameNoTooltip] sẽ là người quyết định công lý của ta?"
  coronation_events.1021.embrace_supporters: "\"[supporter.GetFirstNameNoTooltip], hãy để mắt đến tên quỷ này.\""
  coronation_events.1021.embrace_supporters.flavor: "Những người ủng hộ thực sự đứng về phía ta... còn những kẻ say mê lòng tham thì đứng sau lưng ta, thò tay vào túi tiền!"
  coronation_tax_collectors_watched_modifier: "Người Ủng Hộ Giám Sát Quan Chức"
  coronation_tax_collectors_watched_modifier_desc: "Bộ máy cai trị của vị quân chủ này được cài cắm những trụ cột trung thành, luôn theo dõi chặt chẽ tham nhũng và phản bội."
  coronation_tax_collector_scrutiny_modifier: "Bị Các Chư Hầu Khác Giám Sát"
  coronation_tax_collector_scrutiny_modifier_desc: "Nhân vật này nổi tiếng là kẻ khuấy động rắc rối, và đang bị soi xét khó chịu bởi những người ủng hộ trung thành của quân chủ."
  coronation_harsh_collector_modifier: "Quan Thu Thuế Tàn Nhẫn"
  coronation_harsh_collector_modifier_desc: "Nhân vật này cực kỳ tàn bạo trong việc thu thuế và khiến dân chúng khiếp sợ."
  coronation_thriving_collector_modifier: "Quan Thu Thuế Thịnh Vượng"
  coronation_thriving_collector_modifier_desc: "Nhân vật này thu thuế hiệu quả, khiến đồng liêu bất mãn."
  coronation_events.1021.impress_attendees: "\"Hãy tôn trọng dân chúng bằng sự công bằng của ngươi.\""
  coronation_events.1021.impress_attendees.flavor: "Tôn trọng truyền thống của gia tộc, ghi nhận mọi vị khách, và không để ai chắc chắn ta thực sự đứng về phía nào."
  coronation_events.1021.a: "[taxman.GetTitledFirstNameNoTooltip] đã quá phận."
  coronation_events.1021.a.flavor: "Ta sẽ không cúi đầu trước tiền bạc khi vương miện còn chưa đội. Hãy để tất cả thấy ai là kẻ ra lệnh."
  coronation_events.1021.b: "Ta sẽ nhượng bộ — vì sự ổn định."
  coronation_events.1021.b.flavor: "Cứ để [taxman.GetHerHim] thu những gì [taxman.GetSheHe] muốn, miễn là ta còn trị vì."
  custom.every_tax_slot_vassal: "Mọi [vassal|E] trong [tax_jurisdiction|E] của [tax_collector.GetShortUINamePossessive]"
  coronation_events.1021.c: "Kho bạc của ta là trên hết. Lấp đầy chúng."
  coronation_events.1021.c.flavor: "Nếu vàng mở lối đến quyền lực, thì hãy chất cao và sâu. Cho phép [taxman.GetFirstNameNoTooltip] toàn quyền."
  clan_unity_coronation_nepotism.desc: "đã ủng hộ nạn gia đình trị khi thiên vị chính [house|E] của [unity_character.GetHerHis] trong Lễ Đăng Quang của [unity_character.GetHerHis]"
  bp4_empowered_tax_collectors_modifier: "Quan Thu Thuế Được Trao Quyền"

  coronation_events.1022.t: "Một Lời Đề Nghị Lụa Là"
  coronation_events.1022.desc: "Người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] của ta, [supporter.GetName], quỳ xuống trước mặt ta, nâng lên một chiếc rương đựng những lễ phục thêu tinh xảo và nói:\n\n\"Muôn tâu Bệ hạ, tâm trí thần tựa như một khu vườn nở rộ bởi những ký ức mà chúng ta đã cùng nhau chia sẻ. Để tưởng nhớ vẻ đẹp của những tháng ngày ấy, thần xin dâng lên những bộ lễ phục bằng lụa này, đủ để trang bị cho toàn thể triều đình của ngài. Thần chỉ có một thỉnh cầu: xin ngài hãy luôn để những vị [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] cao quý trong đoàn tùy tùng của mình khoác lên những bộ y phục lộng lẫy vô song.\""
  coronation_events.1022.a: "Một món quà hào phóng, và một lời khuyên tuyệt hảo!"
  coronation_events.1022.b: "\"Tăng thêm lời đề nghị của ngươi, và ta sẽ mang ơn!\""
  coronation_events.1022.c: "Chúng ta nên kiếm lời từ số này!"
 
  coronation_events.1023.t: "Vạn Tuế [ROOT.Char.GetTitleAsNameNoTooltip]"
  coronation_events.1023.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] của ta, [detractor.GetName], đứng dậy với chiếc ly nâng cao. Với giọng điệu [detractor.Custom('InsultAdjective')], [detractor.GetSheHe] tuyên bố:\n\n\"Thưa Bệ hạ, dưới vương miện lộng lẫy kia, Ta thấy một [ROOT.Char.GetTitleAsNameNoTooltip] thật [ROOT.Char.Custom('ComplimentAdjective')] — hiếm ai có thể tự hào về nhiều thần dân #EMP sùng mộ#! đến vậy, cho dù một số kẻ cả gan nghi ngờ sự khôn ngoan trong các quyết định của Người. Phải rồi, chúng ta sẽ ra sao nếu thiếu đi một [ROOT.Char.Custom('ComplimentAdjectiveArticle')] [ROOT.Char.GetTitleAsNameNoTooltip] như thế để mà nịnh nọt và tôn sùng?\"\n\nNhững lời của [detractor.GetHerHis|U], trống rỗng sự tử tế, khiến cả đại sảnh lạnh sống lưng."
  coronation_events.1023.supporter.desc: "Ta cảm nhận mọi ánh mắt đang đổ dồn về phía mình — đặc biệt là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] sững sờ của ta, [supporter.GetName]."
  coronation_events.1023.a: "\"Hãy yên tâm, triều đại của ta quả thực sẽ [ROOT.Char.Custom('ComplimentAdjective')]!\""
  coronation_events.1023.b: "\"Và ta có được điều đó nhờ sự ủng hộ của [supporter.GetFirstNamePossessiveNoTooltip]!\""
  coronation_events.1023.c: "\"Lính canh — bắt giữ tên [detractor.Custom('InsultAdjective')] [detractor.Custom('InsultNoun')] này!\""
  coronation_events.1023.d: "\"[detractor.GetFirstNameNoTooltip], sự chào đón dành cho ngươi đã hết!\""
  coronation_events.1023.e: "Ta đáp lại lời nói của [detractor.GetHerHis] bằng một cái cúi chào lịch sự — không hơn."

  coronation_events.1024.t: "Bạn Bè Khắp Nơi"
  coronation_events.1024.intro_diff_faith: "Với sự kính cẩn lịch thiệp, [foreign.GetTitleAsNameNoTooltip] theo [foreign.GetFaith.GetAdherentName] của [foreign.GetPrimaryTitle.GetNameNoTier] tiến đến trước mặt ta."
  coronation_events.1024.intro_diff_culture: "Với vài cử chỉ nghi lễ kỳ lạ, [foreign.GetTitleAsNameNoTooltip] người [foreign.GetCulture.GetName] của [foreign.GetPrimaryTitle.GetNameNoTier] ra hiệu xin chút thời gian của ta."
  coronation_events.1024.intro_diff_neither: "Với nghi thức thành thạo và đầy trang trọng, [foreign.GetTitleAsName] đáng kính của [foreign.GetPrimaryTitle.GetNameNoTier] tiến đến yết kiến ta."
  coronation_events.1024.desc: "Tay nâng một chiếc rương khảm đầy châu báu, [foreign.GetFirstNameNicknamedNoTooltip] cất tiếng trước đại sảnh:\n\n\"Thưa Bệ hạ, xin hãy nhận lấy tín vật thiện chí này từ [foreign.GetPrimaryTitle.GetTierAsNameNoTooltip|l] của Ta. Nguyện nó tượng trưng cho mối gắn kết lâu dài giữa dân tộc của Người và của Ta.\""
  coronation_events.1024.supporter.desc: "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta, [guest.GetName], bước lên bên cạnh và thì thầm: \"Món quà này có thể là khởi đầu cho một điều gì đó bền lâu, thưa [ROOT.Char.GetTitleAsName]!\""
  coronation_events.1024.detractor.desc: "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta, [guest.GetName], nghiêng người lại gần, thì thầm đầy hiểm ý: \"Những tín vật như thế thường che giấu những toan tính không mấy tốt đẹp, thưa [ROOT.Char.GetTitleAsName]...\""
  coronation_events.1024.impress_attendees: "\"Một khoảnh khắc huy hoàng cho hai dân tộc của chúng ta!\""
  coronation_events.1024.embrace_supporters: "\"[foreign.GetFirstNameNoTooltip], nguyện mối ràng buộc của chúng ta không bao giờ đứt gãy!\""
  coronation_events.1024.weaken_detractors: "\"[guest.GetFirstNameNoTooltip] đang phỉ báng món quà của ngài đấy, [foreign.GetFirstNameNoTooltip]!\""
  coronation_events.1024.exalt_crown: "\"Vậy thì... ngài sẽ trở thành chư hầu cống nạp cho vương miện, phải không?\""
  coronation_events.1024.a: "\"#EMP Ha!#! Ta chẳng cần mấy thứ đồ lặt vặt này.\""
  coronation_events.1024.b: "\"Ta vui vẻ chấp nhận, và cam kết thiện chí của mình.\""

  coronation_events.1025.t: "Những Ánh Nhìn Lạnh Lẽo"
  coronation_events.1025.desc.intro: "Sự căng thẳng cuộn chặt quanh [supporter.GetName], và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] của ta là [detractor.GetName]. Họ ngồi tách biệt, trừng mắt và ra dấu cay nghiệt về phía nhau. Ta nghe thấy những dư âm thù hằn mà chỉ vương miện của ta mới có thể dập tắt.\n\n"
  coronation_events.1025.desc.supporter: "Dù [supporter.GetSheHe] vẫn không ngừng nói xấu người khác, [supporter.GetTitledFirstNameNoTooltip] vẫn nở nụ cười trung thành khi nhận ra ánh mắt ta đang hướng về [supporter.GetHerHim]."
  coronation_events.1025.desc.detractor: "\n\nTrái lại, [detractor.GetTitledFirstName] lại ngồi #EMP chễm chệ#! trên bàn tiệc của [detractor.GetHerHis], khoác trên mình những tấm vải [detractor.Custom('RegionalFabric')] lộng lẫy cùng vẻ ngạo mạn đầy thách thức. [detractor.GetSheHe|U] cầm đầu một nhóm những kẻ cùng chí hướng, chế giễu [supporter.GetFirstNameNoTooltip] là một kẻ '[supporter.Custom('InsultAdjective')]'."
  coronation_events.1025.a: "\"Ta ủng hộ [supporter.GetFirstNameNoTooltip], tuyệt đối và mãi mãi!\""
  coronation_events.1025.b: "\"Nào nào! Chúng ta phải vui mừng như một thể!\""
  coronation_events.1025.c: "[supporter.GetFirstNameNoTooltip] có sự hậu thuẫn của ta."
  coronation_events.1025.d: "Cứ đổ hết lỗi cho [detractor.GetFirstNameNoTooltip]."
  coronation_events.1025.e: "\"Xin hãy nghĩ đến tương lai của chúng ta!\""
  coronation_events.1025.f: "[detractor.GetFirstNameNoTooltip] thực ra là đúng trong chuyện này."

  coronation_events.1026.t: "Chiếc Bánh Đáng Nhớ"
  coronation_events.1026.desc: "Cuối cùng, chiếc bánh cũng được mang ra — cao ngất, lộng lẫy, viên ngọc quý của bữa tiệc. Mệt mỏi nhưng đầy tự hào, các đầu bếp đã thức suốt đêm xếp từng lớp [ROOT.Char.Custom('FavoriteTreatDemand')] và [ROOT.Char.Custom('GetFoodDetail')], mỗi tầng phảng phất hương [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]. Ẩn đâu đó bên trong là tín vật nhỏ bé, chính tay ta đã giấu!"
  coronation_events.1026.supporter_desc: "\n\n[token_finder.GetNameNoTooltip] hân hoan rút tín vật khỏi những lớp bánh béo ngậy, niềm vui của [token_finder.GetHerHis] lớn đến mức [token_finder.GetSheHe] suýt vỗ mạnh vào lưng [ROOT.Char.Custom('GetTitleTierAdjective')] của ta. Đại sảnh vỡ òa trong tràng pháo tay — một người ủng hộ trung thành, được vận may chạm tới, cũng được vương miện ưu ái."
  coronation_events.1026.detractor_desc: "\n\n[token_finder.GetNameNoTooltip] rút tín vật ra khỏi bánh với một nụ cười nhếch mép, chiến thắng của [token_finder.GetHerHis] không thể chối cãi. Một làn sóng xì xào lan khắp đại sảnh — vận may dường như cũng ưu ái cả những kẻ chỉ trích vương miện, ít nhất là trong đêm nay."
  coronation_events.1026.special_desc: "\n\nVới một động tác dứt khoát, ta cắm dao xuống và tự mình lôi ra tín vật. Một khoảnh khắc im phăng phắc, rồi cả đại sảnh bùng nổ tiếng vỗ tay — chủ tiệc đã giành lấy phần thưởng!"
  coronation_events.1026.fallback_desc: "\n\n[token_finder.GetNameNoTooltip] hân hoan rút tín vật, nhận về những tràng hoan hô và lời hứa hẹn về vận may sắp tới."
  coronation_events.1026.special: "Ta tìm thấy rồi! Hãy ca tụng ta!"
  coronation_events.1026.a: "Giờ thì làm mọi người lóa mắt bằng một bài diễn văn!"
  coronation_events.1026.b: "[token_finder.GetFirstName], hãy nhận phần thưởng của ngươi!"
  coronation_events.1026.c: "[token_finder.GetFirstName], ngươi sẽ là người đầu tiên quỳ gối."
  coronation_events.1026.d: "Nguyện khoảnh khắc này mãi mang danh [ROOT.Char.GetDynastyNameNoTooltip]!"
  coronation_events.1026.e: "Không thể chờ để ăn chiếc bánh đó!"
  coronation_events.1026.f: "Phần bánh của ta dành cho dân đen!"

  coronation_events.1027.t: "Khoảnh Khắc Của [highlighted_guest.GetTitledFirstNamePossessiveNoTooltip|U]"
  coronation_events.1027.desc: "Giới quý tộc bắt đầu một điệu [ROOT.Char.Custom('GetMedievalDance')] được biên đạo công phu. Tay cầm các đạo cụ mang tính biểu trưng, họ tái hiện những cảnh về sự trỗi dậy, chiến thắng và khát vọng của triều đại ta. Mọi ánh mắt đều hướng về nhân vật trung tâm của màn trình diễn..."
  coronation_events.1027.special_desc: "\n\nVà ta sững sờ nhận ra họ đang khắc họa chính ta như Người Anh Hùng của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — thật huy hoàng, một pháo đài vững chắc cho danh xưng [ROOT.Char.GetDynastyName]. Một khoảng trống mở ra ở trung tâm vũ đạo. Họ đang gọi ta tham gia điệu nhảy. Khách khứa vỡ òa trong tiếng reo hò, sự ngưỡng mộ của họ say mê chẳng kém gì rượu vang."
  coronation_events.1027.supporter_desc: "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] của ta, [highlighted_guest.GetFirstName], đảm nhận vai một vị tổ tiên được tôn vinh, thu hút tràng pháo tay bằng bài ngâm đầy nhiệt huyết về sức mạnh dòng dõi ta. Thông điệp rất rõ ràng: quyền cai trị của ta là một di sản được mang theo với niềm tự hào."
  coronation_events.1027.detractor_desc: "\n\nTrước sự kinh ngạc của ta, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] của ta, [highlighted_guest.GetFirstNameNoTooltip], bước lên khi nghi thức yêu cầu một hành động tri ân mang tính biểu tượng. Đám đông dao động giữa tiếng cười và những tràng vỗ tay gượng gạo, không chắc nên xem đây là trò đùa, một màn diễn xuất... hay lời cảnh báo."
  coronation_events.1027.fallback_desc: "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('highlighted_guest'))] của ta, [highlighted_guest.GetFirstNameNoTooltip], vào vai chính lãnh thổ — khoác lên mình sắc phục hoàng gia của [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip], bị trói bằng dải ruy băng vàng, và tuyên bố trung thành với vẻ trang nghiêm. Khách khứa gật đầu tán thưởng, đắm mình trong sự lộng lẫy của nghi lễ."
  coronation_events.1027.special: "Đã đến lúc ta bước vào vị trí của mình."
  coronation_events.1027.a: "Ta vỗ tay tán thưởng màn trình diễn với phong thái cung đình."
  coronation_events.1027.b: "Công khai ca ngợi [highlighted_guest.GetFirstNameNoTooltip] — lòng trung thành xứng đáng được tưởng thưởng."
  coronation_events.1027.c: "Phá hỏng khoảnh khắc của [highlighted_guest.GetFirstNamePossessiveNoTooltip]."
  coronation_events.1027.d: "Phát biểu về truyền thống và Gia tộc [ROOT.Char.GetDynastyNameNoTooltip]."
  coronation_events.1027.e: "Mỉm cười ấm áp và cùng sẻ chia niềm vui."
  coronation_events.1027.f: "Lùi vào hậu cảnh và để khoảnh khắc trôi qua."

  coronation_events.1028.t: "Phúc Lành Từ [clergy_representative.GetFaith.HighGodName]"
  coronation_events.1028.supporter.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))] của ta, [clergy_representative.GetFirstName], một tín đồ mộ đạo của [clergy_representative.GetFaith.GetAdjective], bước lên, nét mặt [clergy_representative.GetHerHis] trang nghiêm và thanh thản.\n\n\"[clergy_representative.GetFaith.HouseholdGodName] mỉm cười trước sự hòa hợp giữa các bậc cầm quyền,\" [clergy_representative.GetSheHe] tuyên bố. \"Xin cho phép Ta ban phúc cho Người nhân danh [clergy_representative.GetFaith.CreatorName], như một cử chỉ hòa thuận.\"\n\n[guest.GetFirstName], một trong những người ủng hộ trung thành của ta, dõi theo sát sao, bị cuốn hút bởi cử chỉ này."
  coronation_events.1028.detractor.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('clergy_representative'))] của ta, [clergy_representative.GetFirstName], một tín đồ cuồng nhiệt của [clergy_representative.GetFaith.GetAdjective], tiến lên với vẻ cung kính chậm rãi.\n\n\"[clergy_representative.GetFaith.HouseholdGodName] kêu gọi hòa bình vượt qua biên giới và tín ngưỡng,\" [clergy_representative.GetSheHe] nói. \"Liệu Ta có thể ban cho Người một lời chúc phúc từ [clergy_representative.GetFaith.CreatorName] trong lễ đăng quang này không?\"\n\nTừ đám đông, [guest.GetFirstName], một kẻ hoài nghi công khai về triều đại của ta, nheo mắt [guest.GetHerHis] rõ ràng bất mãn."
  coronation_events.1028.fallback.desc: "Khi lễ đăng quang tiếp diễn, [clergy_representative.GetFirstName], một [clergy_representative.GetFaith.GetAdherentName] viếng thăm, bước lên với đôi tay giơ cao đầy trang nghiêm.\n\n\"[clergy_representative.GetFaith.HouseholdGodName] dạy về hòa bình và sự thấu hiểu giữa các đức tin,\" [clergy_representative.GetSheHe] nhẹ nhàng nói. \"Người có tiếp nhận một lời chúc phúc từ [clergy_representative.GetFaith.CreatorName] để đánh dấu triều đại của mình không?\"\n\n[guest.GetFirstName], một trong các quý tộc hiện diện, nghiêng đầu [guest.GetHerHis] — khó đoán, dè chừng."
  coronation_events.1028.supporter: "Ta gọi [guest.GetFirstNameNoTooltip] đến bên mình."
  coronation_events.1028.detractor: "Gán [guest.GetFirstNameNoTooltip] là kẻ đồng cảm với [clergy_representative.GetFaith.GetAdjectiveNoTooltip]."
  coronation_events.1028.a: "Chấp nhận lời chúc phúc trong tinh thần khoan dung."
  coronation_events.1028.b: "Lịch sự từ chối phúc lành của dị giáo."
  coronation_events.1028.c: "\"Nhưng đây rõ ràng là tà giáo!\""
  coronation_events.1028.d: "Hoàn toàn lảng tránh câu hỏi."
  coronation_events.1028.detractor.tt: "Mọi người tham dự cùng [faith|E] không có đặc tính [GetTrait('cynical').GetName( GetNullCharacter )]"
  coronation_events.1028.a.tt: "Mọi người tham dự cùng [faith|E] có đặc tính [GetTrait('zealous').GetName( GetNullCharacter )]"
  coronation_events.1028.a.tt3: "Mọi người tham dự theo [faith|E] của [clergy_representative.GetShortUINamePossessive]"
  coronation_events.1028.b.tt: "Mọi người tham dự cùng [faith|E] có đặc tính [GetTrait('zealous').GetName( GetNullCharacter )]"
  coronation_events.1028.c.tt: "Mọi người tham dự cùng [faith|E] có đặc tính [GetTrait('zealous').GetName( GetNullCharacter )]"
 
  coronation_events.1029.t: "Lời Thề Bị Lãng Quên"
  coronation_events.1029.desc: "Ta nghe thấy tiếng một cuộn giấy dài được mở ra. \"Thưa quân thượng,\" [priest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] của ta nói, cúi nhẹ, \"Ta đã tìm thấy văn bản này trong những ghi chép cổ xưa nhất của [primary_title.GetAdjective]. Nó nhắc đến một lời thề do [ROOT.GetCharacter.Custom('GetMythicalFounder')] lập ra, ban cho các bậc quân chủ đời sau những quyền lợi và đặc ân mà thời gian đã lãng quên.\"\n\n[guest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta, nghiêng người lại với vẻ tò mò rõ rệt. \"Một lời hứa bị lãng quên ư? Điều này có thể là... thú vị,\" [guest.GetSheHe] lẩm bẩm."
  coronation_events.1029.supporter.desc: "Mùi giấy cũ xộc vào mũi ta. \"Thưa quân thượng,\" [priest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] của ta tuyên bố, \"đây là lời thề do [ROOT.GetCharacter.Custom('GetMythicalFounder')] lập ra, ràng buộc quân chủ và những thần dân trung thành trong nghĩa vụ và phần thưởng tương hỗ, từ kho lưu trữ cổ xưa nhất của chúng ta! Và chắc chắn được định cho những thời khắc như thế này.\"\n\n[guest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta và là người ủng hộ trung thành, cười rạng rỡ. \"Một thời điểm hoàn hảo để khôi phục những lời hứa xưa.\""
  coronation_events.1029.detractor.desc: "[priest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] của ta, mở ra một cuộn giấy cũ kỹ. \"Thưa quân thượng,\" [priest.GetSheHe] công bố, \"đây là lời thề của [ROOT.GetCharacter.Custom('GetMythicalFounder')], một tuyên ngôn về quyền lực tối thượng của quân chủ trên mọi vùng đất! Nó mới được khai quật từ kho lưu trữ của [primary_title.GetNameNoTier]. Lời thề này khẳng định quyền của Người trong việc đòi hỏi sự trung thành — và trừng phạt sự chống đối.\"\n\n[guest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta và là kẻ phản đối công khai, bật cười khinh miệt. \"Lời lẽ cũ kỹ, và đã chết từ lâu!\""
  coronation_events.1029.a: "Quả thật, triều đại của ta được [ROOT.Char.GetFaith.HighGodName] định đoạt!"
  coronation_events.1029.b: "[guest.GetFirstNameNoTooltip], hãy để lời thề của chúng ta tương xứng với thuở xưa."
  coronation_events.1029.c: "Biến nó thành câu chuyện về lòng trung thành của [guest.GetFirstNamePossessiveNoTooltip] với ta."
  coronation_events.1029.d: "Công bố văn bản thất lạc cho tất cả!"
  coronation_events.1029.e: "Hãy để quá khứ tiếp tục bị chôn vùi."
 
  coronation_events.1030.t: "Được lưu danh hậu thế"
  coronation_events.1030.exalt.desc: "[scholar.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] của ta, tiến lại với nụ cười đầy háo hức.\n\n\"Muôn tâu bệ hạ,\" [scholar.GetSheHe] nói, \"sự huy hoàng trong lễ đăng quang của người xứng đáng được ghi vào sử sách. Thần xin cho phép một thư lại ghi chép lại vẻ lộng lẫy của bảo vật hoàng gia, quyền uy của [ROOT.Char.GetPrimaryTitle.GetNameNoTier], và sự kính sợ mà người đã khơi dậy nơi đây.\""
  coronation_events.1030.impress.desc: "[scholar.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] của ta, khẽ ra hiệu về phía ta.\n\n\"Thật là một cử tọa tận tâm!\" [scholar.GetSheHe] thốt lên. \"Nếu bệ hạ cho phép, thần sẽ cử một thư lại ghi lại phản ứng của các vị khách — tiếng reo hò, những tiếng hít thở kinh ngạc, thậm chí cả lệ rơi. Để không ai quên được lễ đăng quang này đã lay động chúng ta đến nhường nào.\""
  coronation_events.1030.supporters.desc: "[scholar.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] của ta, chào ta với ánh mắt rạng rỡ.\n\n\"Điều khiến thần ấn tượng nhất,\" [scholar.GetSheHe] nói, \"chính là lòng trung thành của thần dân người. Nếu được chấp thuận, thần sẽ cho biên soạn một [scholar.Custom('GetChronicleSaga')] về sự kiện này — dành riêng cho những người ủng hộ bệ hạ, cho đức tin của họ, và cho sức mạnh đoàn kết của họ.\""
  coronation_events.1030.detractors.desc: "[scholar.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scholar'))] của ta, nghiêng người lại gần với vẻ đầy mưu tính, hạ giọng nói.\n\n\"Những kẻ chống đối thì hoặc im lặng đến ngột ngạt... hoặc ồn ào cay độc. Thư lại của thần sẽ ghi lại sự thách thức của chúng, để hậu thế tự phán xét kẻ thù của bệ hạ cho xứng đáng...\""
  coronation_events.1030.a: "\"Phải, phải — vinh quang trường tồn!\""
  coronation_events.1030.b: "\"Hãy nhấn mạnh niềm hoan hỉ của các vị khách.\""
  coronation_events.1030.c: "\"Mong lời văn của ngươi xứng đáng với lòng trung thành ấy.\""
  coronation_events.1030.d: "\"Hãy để lũ cặn bã bị nguyền rủa muôn đời.\""
  coronation_events.1030.e: "\"Không — đoạn ấy phải tôn vinh [ROOT.Char.GetFaith.HighGodName].\""
  coronation_events.1030.tt.success: "[scholar.Custom('GetChronicleSaga')] được ca ngợi"
  coronation_events.1030.tt.failure: "[scholar.Custom('GetChronicleSaga')] bị chế giễu"
  bp4_chronicled_coronation_modifier: "Lễ đăng quang được ghi vào sử sách"
  legend_chapter_great_coronation: "Lễ Đăng Quang của [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] là buổi lễ vĩ đại nhất mà nhân loại từng biết đến, với từng khoảnh khắc huy hoàng của nghi thức đều được [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] đích thân ban phước. Khắp mọi miền của thế giới văn minh đều kính sợ và ngưỡng mộ [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip]."

  coronation_events.1031.t: "Khúc thánh ca vang lên"
  coronation_events.1031.exalt.desc: "Trong khi đại sảnh vẫn vang vọng tiếng người tất bật chuẩn bị, [priest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] của ta, tiến đến với một chồng thánh ca cũ kỹ được ôm dưới cánh tay của [priest.GetHerHis].\n\n\"Muôn tâu Bệ hạ,\" [priest.GetSheHe] cất lời với niềm tự hào trầm lặng, \"ca đoàn đang chờ sự chỉ dẫn của ngài. Liệu tiếng hát của họ có nên cất cao để ca ngợi thiên mệnh thiêng liêng của ngài và sự huy hoàng của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] chăng?\"\n\nTa hình dung về nghi lễ sắp tới — mỗi khúc thánh ca vang lên sẽ càng nâng cao thanh thế của vương quốc trong mắt những người tham dự."
  coronation_events.1031.impress.desc: "Khi gia nhân chỉnh trang trang trí và cận vệ tập dượt đội hình, [priest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] của ta, tìm đến giữa lúc chuẩn bị.\n\n\"Cả vương quốc đang lắng nghe,\" [priest.GetSheHe] nói với nụ cười hiểu ý. \"Hãy để dàn hợp xướng hát một khúc ca lay động lòng người, và chinh phục cả những kẻ hoài nghi ngu muội.\""
  coronation_events.1031.supporters.desc: "Giữa dòng người tất bật của thư lại và đầu bếp trong hành lang, [priest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] của ta, nhẹ nhàng chặn ta lại.\n\n\"Những người trung thành với bệ hạ sẽ dõi theo,\" [priest.GetSheHe] nói. \"Hãy để thánh ca nhắc họ vì sao họ đi theo người — những khúc hát gắn kết trái tim tự nguyện, và củng cố đức tin vào triều đại của bệ hạ.\""
  coronation_events.1031.detractors.desc: "[priest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('priest'))] của ta, tiến đến với giọng nói hạ thấp và ánh mắt dè chừng.\n\n\"Không phải ai tụ họp cũng sẽ tung hô danh người,\" [priest.GetSheHe] cảnh báo. \"Khi thánh ca vang lên, hãy để chúng mang sức nặng — quyền uy mà lũ ác quỷ chống đối không thể làm ngơ. Hãy lấp đầy tai chúng bằng sức mạnh của vương miện!\""
  coronation_events.1031.a: "\"Hãy ca tụng vinh quang của ta!\""
  coronation_events.1031.b: "\"Hãy để thánh ca kêu gọi hòa bình và đoàn kết.\""
  coronation_events.1031.c: "\"Hãy biến nó thành lời cảnh báo dành cho những kẻ thù của Gia tộc [ROOT.Char.GetDynastyNameNoTooltip].\""
  coronation_events.1031.d: "\"Không thánh ca. Hôm nay, hãy để im lặng lên tiếng.\""
  coronation_events.1031.e: "\"Ta có sẵn một khúc nhạc hoàn hảo cho việc này!\""
  every_attending_vassal: "Mọi [vassal|E] tham dự"
  every_attending_detractor_or_compassionate: "Mọi kẻ chống đối và vị khách nhân từ tham dự"
  every_attending_poet_scholar: "Mọi nhân vật tham dự có đặc điểm [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] hoặc [GetTrait('scholar').GetName( GetNullCharacter )]"
  every_poet_scholar: "Mọi nhân vật tham dự có đặc điểm [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] hoặc [GetTrait('scholar').GetName( GetNullCharacter )]"

  coronation_events.1032.t: "Một cử chỉ táo bạo"
  coronation_events.1032.desc: "Buổi lễ, dù trang nghiêm và đúng mực, vẫn mang cảm giác... chưa trọn vẹn. Đây chỉ là một buổi tụ họp rập khuôn, một yến tiệc tầm thường sao? Hay là khoảnh khắc dành cho hành động chính trị lớn lao, cho một bước ngoặt lịch sử? [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('supporter'))] của ta, [supporter.GetTitledFirstName], ghé sát thì thầm bên tai.\n\n\"Những bậc quân vương không trở nên vĩ đại nhờ lời nói... mà bằng hành động,\" [supporter.GetSheHe] thúc giục. \"Hành động! Những hành động làm rung chuyển tận nền móng của [ROOT.Char.GetPrimaryTitle.GetTierAsName]!\"\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('detractor'))] của ta, [detractor.GetFirstName], kẻ chẳng coi buổi lễ này ra gì, đứng quan sát với ánh mắt khinh miệt."
  coronation_events.1032.b: "\"[supporter.GetFirstNameNoTooltip]: hãy để chúng ta tuyên thệ lòng trung thành vĩnh cửu.\""
  coronation_events.1032.c: "Với một Dòng tu mới, ta hiệu triệu những kẻ mộ đạo!"
  coronation_events.1032.c.flavor: "[supporter.GetFirstNameNoTooltip] sẽ chuẩn bị tuyên bố thành lập một Dòng Thánh mới."
  create_holy_order_decision_effect_message_coronation: "Một [holy_order|E] của [faith|E] của Ngài sẽ được thành lập\n$EFFECT_LIST_BULLET$Ngài trở thành [holy_order_patron|E] của dòng tu\n$EFFECT_LIST_BULLET$[barony.GetName] sẽ trở thành Tổng hành dinh của dòng tu"
  coronation_events.1032.d: "\"Những con mắt dòm ngó sẽ bị — #EMP móc ra!#!\""
  coronation_events.1032.d.flavor: "[detractor.GetFirstNameNoTooltip] sẽ bị nêu đích danh và trừng phạt công khai trong buổi lễ. Bất đồng sẽ không được dung thứ."
  coronation_events.1032.a: "Hãy để chính bầu trời cùng hòa vào lễ mừng!"
  coronation_events.1032.a.flavor: "Ra lệnh cho gia nhân thả đàn chim bị giam cầm lên không trung; mọi lồng giam đều được mở!"
  every_compassionate_calm_supporter: "Mọi người tham dự có đặc điểm [GetTrait('compassionate').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )] hoặc là [coronation_supporter|E]"
  every_ambitious_wrathful_vassal: "Mọi người tham dự có đặc điểm [GetTrait('ambitious').GetName( GetNullCharacter )] hoặc [GetTrait('wrathful').GetName( GetNullCharacter )]"
  every_attending_sadistic_arbitrary: "Mọi người tham dự có đặc điểm [GetTrait('sadistic').GetName( GetNullCharacter )] hoặc [GetTrait('arbitrary').GetName( GetNullCharacter )]"
  every_attending_compassionate_just: "Mọi người tham dự có đặc điểm [GetTrait('compassionate').GetName( GetNullCharacter )] hoặc [GetTrait('just').GetName( GetNullCharacter )]"
  create_alliance_supporter_tt: "Ngài và [supporter.GetShortUIName] lập thành một [alliance|E]"
  coronation_events.1032.e: "Ta chỉ mong chuyện này sớm kết thúc..."

  coronation_events.1033.t: "Một giọng nói chói tai"
  coronation_events.1033.desc: "\"Trò hề #EMP lố bịch#! này xúc phạm [ROOT.Char.GetPrimaryTitle.GetNameNoTier], bôi nhọ thần dân của nó, và làm ô uế mồ mả tổ tiên chúng ta!\" [rival.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))] của ta, gào lên.\n\nHơi men nồng nặc của [ROOT.Char.Custom('RegionalDrink')] phả ra từ miệng [rival.GetHerHis] — tên say xỉn này đã ngà ngà từ trước! Ánh mắt [rival.GetHerHis|U] đảo loạn qua giới quý tộc, hàng giáo sĩ [ROOT.Char.GetFaith.PriestNeuterPlural], và các sứ thần ngoại bang, thách thức bất kỳ ai dám ngăn cản màn bôi bác thô lỗ này. \"Dựa vào quyền gì mà [ROOT.Char.GetFirstName] dám đội vương miện ấy? #EMP Hả?#! Quyền gì?!?\"\n\nNhững tiếng xì xào kinh hãi lan khắp đại sảnh."
  coronation_events.1033.a: "\"Bằng thiên mệnh.\""
  coronation_events.1033.b: "Chớp lấy cơ hội để hòa giải công khai."
  coronation_events.1033.c: "Lôi [rival.GetHerHim] đi trong xiềng xích!"
  coronation_events.1033.d: "Cứ để con chuột đó trút hết cơn giận của [rival.GetHerHis]..."
  rival_publicly_denounced_at_coronation: "[TARGET_CHARACTER.GetShortUIName|U] đã công khai nghi ngờ tính chính danh của [CHARACTER.GetShortUINamePossessive] tại lễ Đăng quang của [CHARACTER.GetHerHis]"
  rival_publicly_denounced_at_coronation_corresponding: "Tính chính danh của [CHARACTER.GetShortUINamePossessive|U] đã bị [TARGET_CHARACTER.GetShortUINamePossessive] công khai nghi ngờ tại lễ Đăng quang của [CHARACTER.GetHerHis]"
  custom.every_friendly_vassal: "Mọi [vassal|E] có đặc điểm [GetTrait('loyal').GetName( GetNullCharacter )] và là người ủng hộ"
  custom.every_compassionate_trusting_supporter: "Mọi nhân vật tham dự là người ủng hộ có đặc điểm [GetTrait('compassionate').GetName( GetNullCharacter )] hoặc [GetTrait('trusting').GetName( GetNullCharacter )]"
  custom.every_compassionate_craven_supporter: "Mọi nhân vật tham dự là người ủng hộ có đặc điểm [GetTrait('compassionate').GetName( GetNullCharacter )] hoặc [GetTrait('craven').GetName( GetNullCharacter )]"
  custom.every_cynical_detractor: "Mọi nhân vật tham dự là kẻ chống đối có đặc điểm [GetTrait('cynical').GetName( GetNullCharacter )]"

  bp4_exalted_coronation: "Lễ đăng quang tôn vinh"
  bp4_exalted_coronation_alt: "Lễ đăng quang tôn vinh"
  bp4_supported_coronation: "Lễ đăng quang được ủng hộ"
  bp4_supported_coronation_alt: "Lễ đăng quang được ủng hộ"
  bp4_asserting_coronation: "Lễ đăng quang khẳng định quyền uy"
  bp4_asserting_coronation_alt: "Lễ đăng quang khẳng định quyền uy"
  bp4_impressive_coronation: "Lễ đăng quang gây ấn tượng"
  bp4_impressive_coronation_alt: "Lễ đăng quang gây ấn tượng"

  weaken_detractors_opinion: "$EFFECT_LIST_BULLET$Do #V Ý đồ [GetPlayer.GetInvolvedActivityIntent.GetName]#! của Ngài:\n$BULLET_WITH_TAB$Mọi [vassal|E] [GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName] không phải là [coronation_detractor|E]"
  exalt_crown_opinion: "$EFFECT_LIST_BULLET$Do #V Ý đồ [GetPlayer.GetInvolvedActivityIntent.GetName]#! của Ngài:\n$BULLET_WITH_TAB$Mọi [vassal|E] [GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]"
  embrace_supporters_opinion: "$EFFECT_LIST_BULLET$Do #V Ý đồ [GetPlayer.GetInvolvedActivityIntent.GetName]#! của Ngài:\n$BULLET_WITH_TAB$Mọi [vassal|E] [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] và [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]"
  impress_attendees_opinion: "$EFFECT_LIST_BULLET$Do #V Ý đồ [GetPlayer.GetInvolvedActivityIntent.GetName]#! của Ngài:\n$BULLET_WITH_TAB$Mọi [vassal|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] và [GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]"

 # Coronation host is ded, notify guests
  ach_maintenance_events.0100.t: "Cái chết của [host.GetTitleAsNamePossessiveNoTooltip]"
  ach_maintenance_events.0100.desc: "[host.GetName] [host.GetDeathReason] ngay trước thềm [host.GetHerHis] lễ kế vị ngai vàng. Ta chẳng còn việc gì khác ngoài việc tập hợp đoàn tuỳ tùng và rời đi."
  ach_maintenance_events.0100.a: "Nguyện [ROOT.Char.GetFaith.HighGodName] thương xót cho [host.GetPrimaryTitle.GetNameNoTooltip]."
  ach_maintenance_events.0101.t: "[host.GetTitleAsNameNoTooltip] bị giam cầm"
  ach_maintenance_events.0101.desc: "Vào đêm trước khi [host.GetHerHis] lên ngôi, [host.GetName] đã bị [gaoler.GetName] giam cầm. Những chi tiết về hành động táo bạo này vẫn chưa được sáng tỏ; ý định của [gaoler.GetHerHis] đối với tù nhân mới bị bắt giữ của [gaoler.GetHerHis] cũng chìm trong màn bí ẩn. Ta chẳng còn gì để làm ngoài việc tập hợp đoàn tùy tùng của mình và rời đi."
  ach_maintenance_events.0101.a: "$ach_maintenance_events.0100.a$"
  ach_maintenance_events.0102.t: "$ach_maintenance_events.0101.t$"
  ach_maintenance_events.0102.desc: "Tên [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNoun')] kia, đứa [gaoler.Custom('GetDaughterSon')] của bọn [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNounPlural')], đã dám giam giữ ta ngay trong #EMP chính lễ đăng quang của ta#! Nghi lễ bị huỷ bỏ, và số phận của ta thì hoàn toàn bất định."
  ach_maintenance_events.0102.a: "$ach_maintenance_events.0100.a$"
  ach_maintenance_events.0103.t: "Sự cô độc của [host.GetTitleAsNamePossessiveNoTooltip]"
  ach_maintenance_events.0103.desc: "Không một ai đến dự lễ đăng quang của ta! Khi không có thần dân chứng kiến sự kế vị, ta chỉ còn là một [host.GetTitleAsNameNoTooltip] trong chính mắt mình — và trong ảo tưởng.\n\nTa buộc phải huỷ bỏ nghi lễ. Sự sỉ nhục này sẽ không bị lãng quên."
  ach_maintenance_events.0103.a: "$ach_maintenance_events.0100.a$"
  ach_maintenance_events.0104.t: "Người chủ lễ qua đời"
  ach_maintenance_events.0104.desc: "[officiator.GetName], người chủ trì lễ đăng quang, [officiator.GetDeathReason] ngay trước thềm [host.GetNamePossessive] lễ kế vị ngai vàng. Chìm trong đau buồn, [host.GetTitledFirstName] đã huỷ bỏ lễ đăng quang. Ta chẳng còn việc gì khác ngoài việc tập hợp đoàn tuỳ tùng và rời đi."
  ach_maintenance_events.0104.a: "$ach_maintenance_events.0100.a$"
  ach_maintenance_events.0105.t: "[host.GetTitleAsNamePossessiveNoTooltip] bị rút phép thông công"
  ach_maintenance_events.0105.desc: "Với sự khôn ngoan vô tận của [hof.GetHerHis], được dẫn lối bởi ý chí thiêng liêng của [hof.GetFaith.HighGodNamePossessive], [hof.GetName] đã quyết định khai trừ [host.GetName] khỏi giáo hội ngay trước đêm [host.GetHerHis] lên ngôi. Ta chẳng còn gì để làm ngoài việc tập hợp đoàn tùy tùng của mình và rời đi."
  ach_maintenance_events.0105.a: "$ach_maintenance_events.0100.a$" 
  ach_maintenance_events.0106.t: "$ach_maintenance_events.0105.t$"
  ach_maintenance_events.0106.desc: "Tên [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNoun')] đó, [hof.Custom('GetDaughterSon')] của lũ [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNounPlural')], đã khai trừ #EMP ta#! khỏi giáo hội ngay trước lễ xức dầu của ta! Đây không phải là ý chí thiêng liêng của [hof.GetFaith.HighGodNamePossessive], mà là lời thì thầm của [ROOT.Char.GetFaith.DevilName] đã dẫn dắt [hof.GetHerHim] thực hiện hành động xúc phạm và báng bổ này.\n\nTa phải hủy bỏ các nghi lễ. Sự sỉ nhục này sẽ không bao giờ bị lãng quên."
  ach_maintenance_events.0106.a: "$ach_maintenance_events.0100.a$"

  coronation_events.1034.t: "Y Phục Nghi Lễ"
  coronation_events.1034.desc: ""Vậy là [host.GetTitleAsName] dám khoác lên mình [detractor.Custom('GetComplexColor')] [detractor.Custom('RegionalFabric')] ư?" [detractor.Custom2('MyCharacterIntroduction', ROOT.Char)] lẩm bẩm, ánh mắt sắc lại. "Những màu sắc ấy chỉ dành cho đức hạnh và địa vị — không phải cho sự phô trương. Nếu ta mặc thứ ấy mà không có chuẩn y, hẳn đã bị khiển trách."\n\n"Khiển trách ư?" [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)] cắt ngang. "Bộ y phục ấy đã được chuẩn thuận. Nó tôn vinh những nghi lễ còn xưa hơn cả thời ông cố chúng ta. Hoà hợp, cân bằng, quyền trị vì chính danh — đó không phải phô trương, mà là tính chính thống."\n\nLời qua tiếng lại vang lên, trầm thấp nhưng căng thẳng. Ta cúi nhìn tay áo của chính mình. Quyết định cuối cùng vẫn thuộc về ta… nhưng giờ đây ta tự hỏi: khi bước vào đại sảnh, nó sẽ tuyên bố điều gì?"
  coronation_events.1034.a: "Áo bào của ta sẽ rực rỡ hơn cả [host.GetTitledHouseNameOrFirstName]!"
  coronation_events.1034.a.tt: "Hệ quả của lựa chọn này sẽ do [host.GetTitledHouseNameOrFirstName] quyết định"
  coronation_events.1034.b: "Ta sẽ mặc màu của [host.GetTitledHouseNameOrFirstName] như một lời trung thành thầm lặng."
  coronation_events.1034.c: "Ta sẽ mặc đúng theo những gì nghi lễ quy định."
  coronation_events.1034.d: "Hãy để ta hoà theo bảng màu của kinh đô."

  coronation_events.1035.t: "Sắc Màu Bị Cấm"
  coronation_events.1035.desc: "Ngay khi [offending_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] xuất hiện, những lời xì xào lập tức vang lên. Bộ y phục của [offending_guest.GetHerHis] — xa hoa, rực rỡ và vượt quá địa vị của [offending_guest.GetHerHis] — không chỉ phá vỡ phong tục. Nó đã vượt qua cả luật lệ.\n\n[offending_guest.GetSheHe|U] tiến đến trước mặt ta với một nụ cười tự mãn. \"Ngài nghĩ sao, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
  coronation_events.1035.a: "Cứ để [offending_guest.GetHerHim] tận hưởng khoảnh khắc của [offending_guest.GetHerHis]."
  coronation_events.1035.a.toast: "[host.GetTitledHouseNameOrFirstName] đã bỏ qua sự vượt rào"
  coronation_events.1035.b: "Sự vượt rào của [offending_guest.GetHerHis|U] sẽ không thể bị làm ngơ."
  coronation_events.1035.b.toast: "[host.GetTitledHouseNameOrFirstName] cảm thấy bị xúc phạm"
  coronation_events.1035.c: "Ta sẽ nói chuyện riêng với [offending_guest.GetHerHim]. Một lời cảnh cáo là đủ."
  coronation_events.1035.c.toast: "[host.GetTitledHouseNameOrFirstName] đã đưa ra một lời cảnh cáo kín đáo"

  coronation_events.1036.t: "Thi Ca Trên Bàn Tiệc"
  coronation_events.1036.china.desc: "[host.Custom('GetExpensiveDrink_Singular')|U] tuôn tràn, chén va leng keng, đại sảnh rộn ràng tiếng cười cho đến khi một giọng nói vang lên rõ ràng.\n\n\"Hãy biến yến tiệc này thành thi ca,\" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] tuyên bố, vừa kết thúc một bài [Glossary('lüshi', 'GLOSS_LUSHI')] trau chuốt ca ngợi [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Những cuộc so tài như thế này là để thử thách [Glossary('wen', 'CONFUCIAN_WEN')], như các bậc sĩ phu vẫn thường làm.\"\n\nMọi người xôn xao — kẻ háo hức phô diễn học vấn, kẻ lại dè chừng những mũi gai ẩn trong vần thơ."
  CONFUCIAN_WEN: "Chỉ sự tu dưỡng văn hoá, sức mạnh khai hoá của văn chương, nghi lễ và tài hùng biện trong tư tưởng Nho gia."
  GLOSS_LUSHI: "Một thể thơ luật nghiêm ngặt, với quy tắc chặt chẽ về thanh điệu và đối ngẫu. Thành thạo lüshi là dấu hiệu của học vấn uyên thâm."
  coronation_events.1036.japan.desc: "Hương [host.Custom('GetExpensiveDrink_Singular')] và tiếng sột soạt của [host.Custom('RegionalFabric')] lan toả khắp đại sảnh, khi một giọng nói cất lên đầy điềm tĩnh.\n\n\"Chẳng phải chúng ta nên sáng tác thi ca cho dịp này sao?\" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] đề nghị, ngâm một bài [Glossary('waka', 'GLOSS_waka')] để tôn vinh [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Những vần thơ ấy bộc lộ [Glossary('miyabi', 'JAPANESE_MIYABI')] của tâm hồn, điều mà giới quý tộc đều thấu hiểu.\"\n\nNhững nụ cười trao nhau — bởi thơ ca có thể là lời tán dương, nhưng cũng có thể là mũi châm chích tinh tế."
  JAPANESE_MIYABI: "Chỉ sự tao nhã và tinh tế nơi cung đình, một lý tưởng thẩm mỹ và cảm xúc cốt lõi của văn hoá quý tộc Nhật Bản."
  GLOSS_WAKA: "Một thể thơ 31 âm tiết (5-7-5-7-7), phổ biến trong giới quý tộc Nhật Bản."
  coronation_events.1036.korea.desc: "Khi yến tiệc dần cao trào, chén [host.Custom('GetExpensiveDrink_Singular')] được nâng cao và tiếng cười tràn ngập đại sảnh. Rồi một giọng nói cất lên yêu cầu im lặng.\n\n\"Hãy dâng những vần thơ để tôn vinh chủ nhân buổi tiệc,\" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] tuyên bố, hoàn thành một cặp câu trang nghiêm ca ngợi [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Qua đó, chúng ta thể hiện [Glossary('mun', 'KOREAN_MUN')], học vấn được trân trọng từ thời các bậc hiền triết.\"\n\nCó người gật đầu tán thưởng, kẻ khác thì nín thở — bởi không phải vần thơ nào cũng chỉ là lời ca tụng."
  KOREAN_MUN: "Chỉ sự tinh luyện văn chương và học vấn Nho gia, dấu hiệu của tầng lớp sĩ phu."
  coronation_events.1036.desc: "Khi yến tiệc thêm phần sôi nổi, một giọng nói vang lên vượt qua mọi âm thanh — tự tin và tao nhã.\n\n\"Hãy để mỗi người chia sẻ một vần thơ,\" [verse_initiator.Custom2('MyCharacterIntroduction', ROOT.Char)] tuyên bố sau khi đọc một bài trau chuốt tôn vinh [host.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"Trong thi ca, chúng ta bộc lộ điều mình coi trọng — là đức hạnh, trật tự, hay sự huy hoàng.\"\n\nMột làn sóng lan khắp đại sảnh. Không phải mọi vần thơ đều là nịnh bợ; có những lời sắc bén hơn nhiều."
  coronation_events.1036.a: ""Ta sẽ hoà theo giọng điệu và ca ngợi [host.GetTitledFirstNamePossessive] [host.GetPrimaryTitle.GetTierAsNameNoTooltip].""
  coronation_events.1036.b: ""Ta đã có sẵn một câu… một âm vang sắc nhọn từ lời than của bậc cổ nhân.""
  coronation_events.1036.c: ""Hãy để lời ta tao nhã và chuẩn mực — một bài thơ hình thức, chỉ vì nghi lễ.""
  coronation_events.1036.d: ""Tác phẩm của [verse_initiator.GetFirstNamePossessiveNoTooltip] thật tuyệt. Ta sẽ nói rõ điều đó.""
  coronation_events.1036.e: ""Vẫn có điểm chưa ổn. Ta sẽ đưa ra vài góp ý nhẹ nhàng.""

  coronation_events.1037.t: "[ROOT.Char.GetFaith.HighGodName|U] Lên Tiếng"
  coronation_events.1037.desc: "Một làn xì xào lan khắp triều đình. [omen_happening.GetNameNoTooltip] vừa được báo cáo, lời bàn tán nổi lên như thể [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] đã trực tiếp phán truyền.\n\nVới ánh nhìn lo lắng, [skeptical_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] nghiêng người lại gần: \"Tin tức lan rất nhanh, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]. Nhiều người ở đây bất an. Họ tự hỏi liệu [ROOT.Char.GetFaith.HighGodName] có đang gửi đi một lời cảnh báo.\""
  coronation_events.1037.a: ""Những người trước ta còn chịu đựng điều tồi tệ hơn thế.""
  coronation_events.1037.b: ""Hãy để [respected_elder.GetTitledFirstNameNoTooltip] lên tiếng.""
  coronation_events.1037.c: ""Tống cổ kẻ gieo rắc sợ hãi này ra ngoài!""
  coronation_events.1037.d: ""[ROOT.Char.GetFaith.HighGodName|U] lay động, nhưng chúng ta vẫn tiếp tục.""

  coronation_events.1038.t: "Tế lễ tại Tứ Đàn"
  coronation_events.1038.desc: "Theo truyền thống, Thiên tử phải đích thân thực hiện các nghi thức tế lễ, giống như vị Hoàng Đế đầu tiên đã làm trước khi phi thăng hóa tiên.\n\nTa hồi tưởng lại điển tích này khi đứng trước bốn bàn thờ Trời, Đất, Hoàng vị và Thần Nông, trong khi [rite_official.Custom2('MyCharacterIntroduction', ROOT.Char)] đang lo liệu các công việc vụn vặt khác. Mùi hương trầm nồng nàn nơi cánh mũi, và ta có thể cảm nhận được thiên uy đang hiện hữu để chứng giám cho đại lễ này."
  coronation_events.1038.a: "Chế nhạo sự bất cẩn của [rite_official.GetFirstNamePossessiveNoTooltip]."
  coronation_events.1038.b: ""[rite_official.GetFirstNameNoTooltip], xin hãy đến đây cùng ta.""
  coronation_events.1038.c: "Thực hiện một cuộc đại tế lễ, một nghi thức để đời."
  coronation_events.1038.d: ""Nguyện cầu đợt tế lễ này mang lại vinh quang cho Gia tộc [ROOT.Char.GetDynastyNameNoTooltip]!""
  coronation_events.1038.e: ""Nguyện xin Thiên địa dẫn dắt ta đến với đức hạnh...""
  coronation_events.1038.e.flavor: "Và ban phúc cho vùng đất này trong kỷ nguyên này cũng như muôn đời sau."

  coronation_events.1039.t: "Thỉnh nguyện Thần linh"
  coronation_events.1039.desc: "Ta biết rằng để lễ đăng cơ thực sự viên mãn, ta cần phải chia sẻ thức ăn và trò chuyện với các vị thần trong nghi lễ [Glossary('Daijō-sai', 'DAIJO_SAI')].\n\nVới [supporter.Custom2('MyCharacterIntroduction', ROOT.Char)] bên cạnh, ta tiến về phía bàn thờ, sẵn sàng thực hiện lời thỉnh nguyện trước công chúng. \"Xin đừng lo lắng, [ROOT.Char.Custom('FormOfAddressForLiege')]\", [supporter.GetSheHe] nói. \"Thần chắc chắn rằng lời nói của Ngài sẽ vang vọng tâm nguyện của cả vương quốc.\""
  DAIJO_SAI: "Đại Thưởng Tế: Một nghi lễ diễn ra sau khi Thiên hoàng Nhật Bản đăng quang, được tổ chức trong một cung điện xây dựng riêng cho mục đích này và sẽ bị dỡ bỏ ngay sau khi đại lễ kết thúc. Sau một thời gian tịnh thân, Thiên hoàng sẽ dâng lễ vật lên các vị thần (Kami) và tự mình thụ lộc từ lễ vật đó."
  coronation_events.1039.a: "Ta cầu nguyện cho phúc lành của những thần dân trung thành."
  coronation_events.1039.b: "Lời thỉnh nguyện của ta là để [ROOT.Char.GetFaith.HighGodName|U] chứng giám cho vinh quang của ta!"
  coronation_events.1039.c: "Ta sẽ nói những lời mơ hồ và đầy hoài nghi."
  coronation_events.1039.d: "Mở một cuộn giấy ghi một bài thơ sùng đạo."
  coronation_events_1039_poem_name: "Thánh Giao Chúc Phúc"
  coronation_events_1039_poem_desc: "Một bài thơ sùng đạo tuyệt mỹ được [owner.GetTitledHouseNameOrFirstName] sáng tác để vinh danh các vị thần Kami trong chính lễ đăng quang của [owner.GetHerHis]."
  coronation_events.1039.d.tt: "Ngài sẽ nhận được một [artifact|E] là một bài thơ"
  coronation_events.1039.d.flavor: "\"Tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], một đóa hoa lẻ bóng khoe sắc...\""

  coronation_events.1040.t: "Bài học về Vô thường"
  coronation_events.1040.desc: "\"Việc chuẩn bị cho Mandala thế nào rồi, thưa [ROOT.Char.GetTitleAsNameNoTooltip] của thần?\" [tributary_1.Custom2('MyCharacterIntroduction', ROOT.Char)] hỏi với giọng nghiêm nghị. Theo tập tục, một [Glossary('sand mandala', 'GLOSS_MANDALA')] sẽ được tạo ra để vinh danh vị [ROOT.Char.GetTitleAsNameNoTooltip] mới, để rồi ngay sau đó bị phá hủy khi các nghi lễ phù hợp kết thúc.\n\nVấn đề này cứ quanh quẩn mãi trong tâm trí ta, bởi nghi lễ này mang tính biểu tượng rất cao, nhưng việc một tác phẩm nghệ thuật như thế bị phá hủy ngay lập tức cảm thấy thật là... hoang phí."
  GLOSS_MANDALA: "Mandala cát (Mạn-đà-la): Được các nhà sư khổ công tạo ra một cách tỉ mỉ và sau đó được phá hủy theo nghi thức để truyền tải thông điệp về sự vô thường. Mỗi bức Mandala mô tả một vị thần hoặc phẩm chất thiêng liêng ở trung tâm, bao quanh bởi các hình ảnh hài hòa, phản chiếu cách một vương quốc Mandala tự tổ chức và vận hành."
  coronation_events.1040.special: "\"Ra lệnh mang Mandala của [ROOT.Char.GetFaith.HouseOfWorship] đến đây.\""
  coronation_events.1040.a: "\"Không được tiếc chi phí để tạo ra dấu ấn thần thánh của ta!\""
  coronation_events.1040.b: "\"Hãy làm nó thật ý nghĩa nhưng đơn giản thôi.\""
  coronation_events.1040.c: "\"Các [ROOT.Char.GetFaith.HouseOfWorshipPlural] có thể dư dả nguồn lực, nhưng ta thì không.\""
