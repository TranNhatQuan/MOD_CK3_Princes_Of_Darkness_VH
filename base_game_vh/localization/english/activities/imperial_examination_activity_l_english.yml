  activity_imperial_examination_guest_help_text: "Bất kỳ [activity_guests|E] nào đủ điều kiện dự thi đều có thể tham gia. Đạt yêu cầu sẽ mang lại nhiều [merit|E] hơn cho thí sinh cũng như nhiều [prestige|E] hơn cho [activity_host|E]. Mặc dù Khách không được phép vào bên trong trường thi, họ vẫn có thể sử dụng ảnh hưởng của mình để hỗ trợ thí sinh theo nhiều cách khác nhau.\n\nCác kỳ thi là dịp hoàn hảo để tạo dựng mối quan hệ và gây ấn tượng với các giám khảo, thậm chí có thể giành được một trưởng bối."

