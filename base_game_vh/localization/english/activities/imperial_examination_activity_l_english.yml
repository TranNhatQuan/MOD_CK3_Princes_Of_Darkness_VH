 ### PHASES
  imperial_examination_phase_assembly: "Tập Hợp"
  imperial_examination_phase_assembly_desc: "Tìm kiếm khắp nơi, tất cả các thí sinh đủ điều kiện đang trên đường tới các trường thi."
  imperial_examination_phase_preparation: "Chuẩn Bị"
  imperial_examination_phase_preparation_desc: "Các thí sinh, cũng như chủ trì, chờ đợi thời điểm, vội vàng chuẩn bị những gì có thể cho kỳ thi."
  imperial_examination_phase_examination: "Khoa Thi Hội"
  imperial_examination_phase_examination_desc: "Khoa thi Hội bắt đầu. Hãy để kết quả tự định đoạt."
  imperial_examination_phase_palace_examination: "Khoa Thi Đình"
  imperial_examination_phase_palace_examination_desc: "Khoa thi Đình bắt đầu. Đây là lúc những học giả xuất sắc nhất chứng tỏ bản thân trước Hoàng Đế."

 ### OPTIONS
 #Examination Focus [Special Type] Option
  imperial_examination_focus: "Trọng Tâm Kỳ Thi"
  imperial_examination_focus_martial: "Chiến Lược Gia Quân Sự"
  imperial_examination_focus_martial_desc: "Kỳ thi sẽ trao nhiều [merit|E] hơn cho những thí sinh xuất sắc về [martial|E]\n\n#weak \"Chiến lược quân sự cũng là một đức hạnh như bất kỳ học vấn nào khác.\"#!"
  imperial_examination_focus_stewardship: "Quản Trị Hiệu Quả"
  imperial_examination_focus_stewardship_desc: "Kỳ thi sẽ trao nhiều [merit|E] hơn cho những thí sinh xuất sắc về [stewardship|E]\n\n#weak \"Có sự khác biệt rõ ràng giữa những kẻ sống bằng lời nói và những người thực sự hữu dụng.\"#!"
  imperial_examination_focus_learning: "Học Giả Uyên Bác"
  imperial_examination_focus_learning_desc: "Kỳ thi sẽ trao nhiều [merit|E] hơn cho những thí sinh xuất sắc về [learning|E]\n\n#weak \"Học tập là niềm vui, và vận dụng tri thức ấy vào thực tiễn còn đáng quý hơn.\"#!"

 #Examination Breadth Option
  imperial_examination_breadth: "Phạm Vi Kỳ Thi"
  imperial_examination_breadth_exclusive: "Triệu Tập Giới Hạn"
  imperial_examination_breadth_exclusive_desc: "$EFFECT_LIST_BULLET$ Hoạt động chỉ mở cho một số ít người được chọn, loại trừ dân chúng phổ thông\n$EFFECT_LIST_BULLET$Ngài sẽ nhận #EMP ít hơn#! [merit|E] khi hoàn thành\n\n#weak Ta sẽ để những đứa con ưu tú nhất của thần dân phục vụ trong #EMP lãnh thổ của ta#!.#!"
  imperial_examination_breadth_restricted: "Triệu Tập Hạn Chế"
  imperial_examination_breadth_restricted_desc: "$EFFECT_LIST_BULLET$Số lượng thí sinh bị giới hạn ở mức vừa phải, cho phép một phần dân chúng tham gia. \n\n#weak Những vị quan tương lai có thể xuất thân từ những cội nguồn khiêm nhường nhất.#!"
  imperial_examination_breadth_open: "Triệu Tập Rộng Rãi"
  imperial_examination_breadth_open_desc: "$EFFECT_LIST_BULLET$ Hoạt động được tổ chức trên quy mô lớn, thu hút rất nhiều thí sinh nhiệt huyết\n$EFFECT_LIST_BULLET$ Ngài sẽ nhận #EMP nhiều hơn#! [legitimacy|E] khi hoàn thành\n\n#weak Trí tuệ có thể đến từ mọi tầng lớp. Hãy giăng lưới rộng và xem ai sẽ vươn lên.#!"

 #Passing Grade Option
  imperial_examination_passing_grade: "Mức Đạt Kỳ Thi"
  imperial_examination_passing_grade_extreme: "Mức Cực Cao"
  imperial_examination_passing_grade_extreme_desc: "$EFFECT_LIST_BULLET$ Mức đạt của kỳ thi rất cao, loại bỏ #EMP rất nhiều#! thí sinh\n$EFFECT_LIST_BULLET$ Ngài sẽ nhận #EMP nhiều hơn rất nhiều#! [legitimacy|E] khi hoàn thành\n\n#weak Chỉ những tinh hoa trong tinh hoa mới đạt yêu cầu và trở thành #EMP quan lại#! tiếp theo của ta.#!"
  imperial_examination_passing_grade_high: "Mức Cao"
  imperial_examination_passing_grade_high_desc: "$EFFECT_LIST_BULLET$ Mức đạt của kỳ thi ở mức tiêu chuẩn, loại bỏ số thí sinh dự kiến\n$EFFECT_LIST_BULLET$ Phần thưởng [legitimacy|E] khi hoàn thành không thay đổi\n\n#weak Tiêu chuẩn của ta cao, nhưng không vô lý. Nếu muốn quan lại dựa trên thực tài, họ phải đạt đến một mức độ xuất sắc nhất định.#!"
  imperial_examination_passing_grade_mediocre: "Mức Trung Bình"
  imperial_examination_passing_grade_mediocre_desc: "$EFFECT_LIST_BULLET$ Mức đạt của kỳ thi được nới lỏng đôi chút, loại bỏ #EMP ít hơn#! thí sinh\n$EFFECT_LIST_BULLET$ Ngài sẽ nhận #EMP ít hơn#! [legitimacy|E] khi hoàn thành\n\n#weak Ai dám chắc những thí sinh xuất thân khiêm nhường này sẽ không học hỏi trong quá trình làm việc. Chỉ cần nền tảng vững chắc, ta cho phép họ vượt qua.#!"
  imperial_examination_passing_grade_low: "Mức Thấp"
  imperial_examination_passing_grade_low_desc: "$EFFECT_LIST_BULLET$ Mức đạt của kỳ thi rất thấp, loại bỏ #EMP rất ít#! thí sinh\n$EFFECT_LIST_BULLET$ Ngài sẽ nhận #EMP ít hơn rất nhiều#! [legitimacy|E] khi hoàn thành\n\n#weak Ta cần những quan lại có thực tài #EMP ngay bây giờ#!. Ta đặt ra luật lệ và tiêu chuẩn; họ tuân theo. Đó chính là thiên mệnh của ta.#!"

 #Conclusion
  activity_imperial_examination_conclusion_desc: "Kỳ [GetActivityType( 'activity_imperial_examination' ).GetName] đã kết thúc."
  imperial_examination_conclusion.intro: "Kỳ thi cuối cùng cũng đã đi đến hồi kết."
  imperial_examination_conclusion.intro.passing_grade.extreme: "\n\nCác quy định #BOL $imperial_examination_passing_grade_extreme$#! đã trao một lượng [merit|E] #BOL Phi thường#! cho một số lượng #BOL Nhỏ#! [entrants|E]."
  imperial_examination_conclusion.intro.passing_grade.high: "\n\nCác quy định #BOL $imperial_examination_passing_grade_high$#! đã trao một lượng [merit|E] #BOL Cao#! cho một số lượng #BOL Trung bình#! [entrants|E]."
  imperial_examination_conclusion.intro.passing_grade.mediocre: "\n\nCác quy định #BOL $imperial_examination_passing_grade_mediocre$#! đã trao một lượng [merit|E] #BOL Trung bình#! cho một số lượng #BOL Lớn#! [entrants|E]."
  imperial_examination_conclusion.intro.passing_grade.low: "\n\nCác quy định #BOL $imperial_examination_passing_grade_low$#! đã trao một lượng [merit|E] #BOL Thấp#! cho một số lượng #BOL Rất lớn#! [entrants|E]."
  imperial_examination_conclusion.intro.breadth.imperial: "\n\nMức độ mời gọi #BOL $imperial_examination_breadth_open$#! đồng nghĩa với việc có tổng cộng #BOL Nhiều#! [entrants|E]."
  imperial_examination_conclusion.intro.breadth.grand: "\n\nMức độ mời gọi #BOL $imperial_examination_breadth_restricted$#! đồng nghĩa với việc có tổng cộng #BOL Khá#! [entrants|E]."
  imperial_examination_conclusion.intro.breadth.palace: "\n\nMức độ mời gọi #BOL $imperial_examination_breadth_exclusive$#! đồng nghĩa với việc có tổng cộng #BOL Ít#! [entrants|E]."
  imperial_examination_conclusion.general: "\n\nTrong tổng số ban đầu là #BOL [activity.MakeScope.Var('num_initial_entrants').GetValue]#! [entrants|E], có #BOL [activity.MakeScope.Var('num_final_failees').GetValue]#! người đã #EMP trượt#! kỳ thi.\n\n[activity.MakeScope.Var('first_place_entrant').Char.GetShortUIName] là người xuất sắc nhất trong số các [entrants|E], đạt mức đánh giá [activity.Custom('ActivityGetExamScoreAdjective')] với số điểm #BOL [activity.MakeScope.Var('first_place_entrant_score').GetValue|0]#!, theo sau là [activity.MakeScope.Var('second_place_entrant').Char.GetShortUIName] và [activity.MakeScope.Var('third_place_entrant').Char.GetShortUIName]."
  imperial_examination_conclusion.entrant_failee: "\n\nKỳ thi kết thúc trong sự thất vọng nặng nề. Ta phải cố gắng hơn nữa vào lần sau."
  imperial_examination_conclusion.entrant_passed: "\n\nTa đã vượt qua Kỳ thi Đô thành, và gia đình ta có thể tự hào về thành tích này."
  imperial_examination_conclusion.entrant_passed_palace: "\n\nĐế quốc giờ đây biết đến ta như một trong những học giả xuất sắc nhất, và những cơ hội phía trước là vô cùng rộng mở."
  local_examination_conclusion.entrant_passed: "\n\nTa đã vượt qua Kỳ thi Tỉnh hôm nay, và gia đình ta có thể tự hào về thành tích này."
