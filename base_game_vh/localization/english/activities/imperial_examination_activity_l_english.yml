  activity_imperial_examination_desc: "Đó là vinh dự và bổn phận của chúng ta trong việc duy trì thể chế và tổ chức các kỳ thi này. Chúng cho phép chúng ta đánh giá, tuyển chọn và ban thưởng [merit|E] cho những cá nhân phù hợp nhất — nhằm bảo đảm sự phồn thịnh tương lai của quốc gia."
  activity_imperial_examination_host_desc: "$activity_imperial_examination_host_rewards$$activity_imperial_examination_guest_rewards$"
  activity_imperial_examination_host_rewards: "\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]"
  activity_imperial_examination_guest_desc: "\n$BULLET_WITH_TAB$Có cơ hội hoàn thành @metropolitan_exam_icon! #V Kỳ thi Kinh đô#!\n$BULLET_WITH_TAB$Có cơ hội hoàn thành @palace_exam_icon! #V Kỳ thi Điện đình#!\n$BULLET_WITH_TAB$Có thể gia tăng kinh nghiệm [trait_level_track_xp|E] trong [GetTrait('confucian_education').GetName( GetNullCharacter )] [trait|E] của ngài\n$BULLET_WITH_TAB$Có thể gia tăng [merit|E] của ngài\n$BULLET_WITH_TAB$ @alert_icon! #alert_trial Nếu ngài không biết [language|E] [host.GetCulture.GetLanguage.GetName], khả năng thành công của ngài sẽ bị giảm mạnh!#![SelectLocalization( Scope.HasFlag('passed_provincial_exam'), 'blank_line', 'activity_imperial_examination_warning' )]"
  activity_imperial_examination_warning: "\n#indent_newline:8 $BULLET_WITH_TAB$ @warning_icon! #color_red Do Ngài chưa vượt qua @provincial_exam_icon! [provincial_examination|E], khả năng trượt là rất cao!#!"
  activity_imperial_examination_guest_rewards: "\n$BULLET_WITH_TAB$Có thể chiêu mộ một nhân vật có kỹ năng rất cao\n$BULLET_WITH_TAB$Những người tham gia có thể nhận [trait_level_track_xp|E] của [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$Những người tham gia có thể nhận [merit|E]"
  imperial_examination_base_cost: "Chi Phí Cơ Bản"

  activity_imperial_examination_with_icon: "$activity_imperial_examination$ @metropolitan_exam_icon! @palace_exam_icon!"
  activity_imperial_examination_can_complete_tt: "$activity_imperial_examination_not_available_tt$"
  activity_imperial_examination_expected_frequency: "Dự kiến mỗi #V 5#! năm"
