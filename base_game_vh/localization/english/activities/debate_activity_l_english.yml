 ### SETUP
  activity_debate: "Tranh biện"
  activity_debate_plural: "Các cuộc tranh biện"
  activity_debate_destination_selection: "Ngài chỉ có thể tổ chức $activity_debate$ tại một [capital|E] thuộc về Ngài, [movement_leader|E] của Ngài, [liege|E] của Ngài hoặc [GetTitleByKey('h_china').GetName]."
  activity_debate_selection_tooltip: "Tổ chức [GetActivityType('activity_debate').GetName] để tranh giành quyền lực chính trị — giành quyền kiểm soát cho bản thân hoặc phong trào của Ngài $activity_debate_host_rewards$"
  activity_debate_desc: "Công lao, ảnh hưởng, #EMP quyền lực#! — tất cả đều trở nên vô nghĩa nếu Ngài không thể đưa ra những lập luận xác đáng cho bản thân và chính nghĩa của mình.\n\nHãy kêu gọi một cuộc tranh biện để thuyết phục người khác rằng Ngài xứng đáng có nhiều quyền lực hơn, hoặc thách thức một phong trào khác nhằm đưa phong trào của Ngài vào thế thuận lợi hơn."
  activity_debate_host_desc: "$activity_debate_host_rewards$$activity_debate_guest_rewards$"
  activity_debate_host_rewards: "\n$BULLET_WITH_TAB$[movement_power_i] [movement_power|E]\n$BULLET_WITH_TAB$[influence_i|E] [influence|E]\n$BULLET_WITH_TAB$[merit_i|E] [merit|E]"
  activity_debate_guest_desc: "\n$BULLET_WITH_TAB$Có thể nhận được [disciples|E]\n$BULLET_WITH_TAB$Có thể tăng [trait_level_track_xp|E] của đặc tính [GetTrait('confucian_education').GetName( GetNullCharacter )]"
