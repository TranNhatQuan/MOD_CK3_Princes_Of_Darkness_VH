 ### TOOLTIPS
  activity_debate_guest_help_text: "Mọi [activity_guests|E] được mời sẽ theo dõi hoặc tham gia tranh biện. Những lập luận thành công sẽ mang lại [movement_power|E], hoặc làm suy giảm quyền lực của một phong trào khác. Tham dự tranh biện là cơ hội tốt để giành [merit|E], nâng cao [trait_level_track_xp|E] của đặc tính [GetTrait('confucian_education').GetName( GetNullCharacter )], và có khả năng giành được một [elder|E]"
