l_english:
  submit_to_the_great_khan_decision:0 "Chấp nhận Đại Hãn"
  submit_to_the_great_khan_decision_confirm:0 "Ta sẽ khúm núm cầu sống"
  submit_to_the_great_khan_decision_opening_desc: "Cõi đất của ta sẽ thành tro, dân ta thành xác chết, thân ta thành nạn nhân của ngàn nhát chém và đòn đánh... trừ khi ta cầu xin lòng thương từ kị sĩ vĩ đại đang chinh phục thế giới."
  submit_to_the_great_khan_decision_tooltip:0 "Ngài trở thành chư hầu của Đại Hãn vĩ đại nhất"

  mongol_invasion.1001.title:0 "Hãn đã chết!"
  mongol_invasion.1001.generic.desc: "[ROOT.Char.GetFaith.HighGodName] nhân từ, và [ROOT.Char.GetFaith.DeathDeityName] hạ gục cả những kẻ hùng mạnh nhất! Tin lành: [old_khan.GetTitledFirstNameNicknamed], chúa ngựa và kẻ tàn phá, [old_khan.GetDeathReasonHideKiller|l].\n\nChúng ta đã sợ hãi bàn về vị chủ mới kinh hoàng cho [new_khan.GetPrimaryTitle.GetNameNoTier]... nhưng [new_khan.GetTitledFirstNameNicknamed] này chắc chắn không #EMP thể nào#! đáng sợ bằng tiền nhân [new_khan.GetHerHis]...\n\nCó lẽ đây là dấu chấm hết cho cuộc chinh phục [new_khan.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
  mongol_invasion.1001.sympathetic.desc: "#EMP Ôi, những lời than khóc! Những tiếng ai oán!#! Vị [old_khan.GetTitledFirstNameNicknamed] vĩ đại, người được Thiên Mệnh lựa chọn để chinh phục toàn bộ Trái Đất, nay đã không còn nữa. Người ta nói rằng [old_khan.GetTitleAsNameNoTooltip] [old_khan.GetDeathReasonHideKiller|l].\n\nSau khi chủ nhân qua đời, [new_khan.GetPrimaryTitle.GetDefinitiveName] tập hợp đại #EMP kurultai#! của mình và tuyên bố một [new_khan.GetTitleAsNameNoTooltip] mới.\n\nVà như vậy, trong khi [old_khan.GetFirstNameNoTooltip] mãi mãi cưỡi trên bầu trời, toàn bộ Trái Đất sẽ thuộc về [new_khan.GetTitledFirstNameNicknamed]!"
  mongol_invasion.1001.a: "Nhưng, tay ta vẫn run..."
  mongol_invasion.1001.b: "Đại [new_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] vẫn tồn tại."
  mongol_invasion.1001.c: "[old_khan.GetFirstNameNoTooltip] chiếm vị trí danh dự trong [ROOT.Char.GetFaith.NegativeAfterLife]."

  mongol_invasion.1002.t:0 "Sự trỗi dậy của [genghis_khan.GetCulture.GetCollectiveNounNoTooltip]"
  mongol_invasion.1002.desc.close: "Một lãnh tụ đáng sợ, [genghis_khan.GetTitledFirstName], xuất hiện từ các bộ tộc chiến tranh của"
  mongol_invasion.1002.desc.close_mongolia:0 "Mông Cổ"
  mongol_invasion.1002.desc.close_steppes:0 "các thảo nguyên"
  mongol_invasion.1002.desc.close.mid: "và — theo các hiền nhân của [genghis_khan.GetHerHis] dân chúng, tại một #EMP kurultai# rộng lớn — được tuyên bố là"
  mongol_invasion.1002.desc.genghis: "[Glossary( 'Genghis Khan', 'GENGHIS_KHAN_GLOSS' )]."
  mongol_invasion.1002.desc.gok: "Vĩ đại nhất trong tất cả các Hãn!"
  mongol_invasion.1002.desc.close.end: "Theo quyền lợi, [genghis_khan.GetSheHe] sẽ cai trị bốn phương thiên hạ.\n\nVô số kỵ binh du mục tập hợp dưới cờ của [genghis_khan.GetHerHis]. Theo ý muốn của Đại Hãn vĩ đại nhất, họ từ bỏ các liên minh bộ tộc cũ, được sắp xếp lại cho chiến tranh, và tiến ra chinh phục toàn thảo nguyên, toàn thế giới — mọi thứ dưới Trời Xanh vĩ đại!"
  GENGHIS_KHAN_GLOSS: "Chỉ có một vị chủ tể vĩ đại từng mang tước hiệu Mông Cổ #G Genghis#! hay #G Chinggis Khan#!. Ý nghĩa của nó không rõ ràng, có thể ám chỉ sức mạnh, chính nghĩa, hoặc quyền thống trị 'Toàn Cầu', 'Biển Cả'. Và thực sự, người mang danh hiệu này vượt xa #EMP Gurkhan#! thời bấy giờ, tạo nên đế chế thảo nguyên lớn nhất từng thấy."
  mongol_invasion.1002.desc.far_intro: "Tin đồn đến... một bạo chúa tàn nhẫn trỗi dậy giữa các bộ lạc man rợ ở thảo nguyên xa xôi. Một '[genghis_khan.GetTitledFirstName],' tuyên bố [genghis_khan.GetHerselfHimself] là Chúa tể Vũ trụ —"
  mongol_invasion.1002.desc.far: "\n\nTrong tiếng cười lo lắng, các cố vấn nói với ta rằng [genghis_khan.GetSheHe] đã thề sẽ chinh phục toàn thế giới, nghiền nát thành phố dưới móng ngựa, phá vỡ tường lâu đài bằng cung tên.\n\n[genghis_khan.GetSheHe|U] không phải là du mục đầu tiên tuyên bố điều này... nhưng họ còn nói rằng [genghis_khan.GetTitleAsNameNoTooltip] dẫn đầu hàng ngàn kỵ binh bất khả chiến bại."
  mongol_invasion.1002.a: "Kẻ nổi loạn! [genghis_khan.GetCulture.GetCollectiveNounNoTooltip] đã phát điên."
  mongol_invasion.1002.b: "Đằng sau tường thành chúng ta... chắc chắn, ta an toàn."
  mongol_invasion.1002.craven: "Và [genghis_khan.GetSheHe] đang đến đây?!"
  mongol_invasion.1002.genghis_khan_tt: "@warning_icon! #X [counties|E] bị [genghis_khan.GetCulture.GetCollectiveNoun] chiếm sẽ mất một phần lớn [development|E]#!"
  genghis_khan_mongol_empire_tt: "Đạt được [GetTitleByKey('e_mongol_empire').GetName]"
  genghis_khan_mongol_troops_tt: "Có được đội quân lớn gồm [special_troops|E]"
  mongol_invasion_submission_reminder_tt: "Ngài có thể tránh thảm họa với #high $submit_to_the_great_khan_decision$#! [decision|E]"
  gok_threatening_powers_tt: "@warning_icon! #X Sẽ đe dọa [rulers|E] với [holdings|E] bị phá hủy, [courtiers|E] bị thảm sát và [title|E] bị chiếm nếu họ từ chối [vassalization|E]#!"

  mongol_invasion.1003.t:0 "Ngôi Nhà Trí Thức Bốc Cháy"
  mongol_invasion.1003.desc:0 "Học viện và trung tâm tri thức vĩ đại của Baghdad, Ngôi Nhà Trí Thức, đã bị lửa thiêu rụi trong cuộc vây thành của người Mông Cổ.\n\nChỉ còn lại những tàn tích, như báo hiệu giá trị của tri thức cũ trong thế giới mới của người Mông Cổ."
  mongol_invasion.1003.a:0 "Quá nhiều thứ bị mất..."
  mongol_invasion.1003.b:0 "Chỉ là những kẻ ngoại đạo nhận hậu quả mà thôi!"
  mongol_invasion.1003.c:0 "Người Mông Cổ sẽ phá hủy thế giới nếu ta không ngăn họ!"

  mongol_invasion.1004.t:0 "Sụp Đổ của Đại Hãn"
  mongol_invasion.1004.desc: "Với cái chết của [old_mongol_emperor.GetFirstName] hùng mạnh — người cai trị tất cả những vùng đất bị người Mông Cổ khuất phục — nhiều kẻ kế vị tranh giành vị trí của [old_mongol_emperor.GetHerHis] để trở thành Đại Hãn. Không ai công nhận tính chính danh của những kẻ khác.\n\nVà như vậy, đây chính là hồi kết của Đế chế Mông Cổ thống nhất.\n\nNhững hậu duệ của vị đại chinh phục đầu tiên vẫn còn níu giữ một phần sức mạnh. Họ kêu gọi chiến tranh. Nhưng không một ai trong số họ, không phải [successor_1.GetName], cũng chẳng phải [successor_2.GetName], có thể đứng trên những người còn lại với tư cách là người cai trị toàn bộ vũ trụ."
  mongol_invasion.1004.a:0 "Một ngày nào đó, đế chế sẽ trỗi dậy lại..."
  mongol_invasion.1004.b:0 "Cuối cùng, lòng thương của [ROOT.Char.GetFaith.HighGodNamePossessive] cũng được thấy..."

  mongol_invasion.1005.t: "Hãn đã chết"
  mongol_invasion.1005.desc: "Cùng với sự chuyển giao ngai vàng [new_khan.GetPrimaryTitle.GetAdjective] từ [old_khan.GetTitledFirstName] sang [new_khan.GetTitledFirstName], các cố vấn của ta cười khoái chí, thở phào nhẹ nhõm... bởi vì [new_khan.GetFirstNameNoTooltip] không dám tự xưng [new_khan.GetHerselfHimself] là \"người cai trị vũ trụ\".\n\nThuở trước, những người du mục thảo nguyên từng đe dọa toàn bộ thế giới, từng tập hợp những đạo quân khổng lồ. Giờ đây, họ cuối cùng cũng thừa nhận rằng tham vọng của mình nằm ngoài tầm với."
  mongol_invasion.1005.a: "Một thời đại kinh hoàng đã kết thúc."
  mongol_invasion.1005.a.tt: "[GetTitleByKey('e_mongol_empire').GetName] mất đi các phương thức chinh phục chính và sẽ trở nên ít hiếu chiến hơn"

  mongol_invasion.2001.opening:0 "Ta định mệnh của ngươi,"
  mongol_invasion.2001.desc:0 "Là Chúa tể Vũ trụ, tất yếu ngươi sẽ cúi đầu trước ta. Hãy để đó là một lời thề trung thành, thay vì lưỡi rìu trên cổ ngươi."
  mongol_invasion.2001.a:0 "Ta xin tuân phục với danh dự, [mongol_emperor.GetTitleAsNameNoTooltip] của Ta."
  mongol_invasion.2001.a.tt:0 "Ngài trở thành chư hầu của [mongol_emperor.GetShortUIName]"
  mongol_invasion.2001.b:0 "Ngươi không đe dọa ta, kẻ ngạo mạn!"
  mongol_invasion.2001.b.tt:0 "[mongol_emperor.GetShortUIName|U] tuyên chiến với Ngài"

  mongol_invasion.2002.opening:0 "Kính chào Chúa tể Vũ trụ,"
  mongol_invasion.2002.desc:0 "Ta xin tuân phục ân sủng chính đáng và nhân từ của ngài. Ta sẽ sát cánh cùng ngài chống lại bất cứ ai phản đối định mệnh của ngài."
  mongol_invasion.2002.a:0 "Lựa chọn khôn ngoan, Ta tớ của ta."

  mongol_invasion.2003.opening:0 "Ngươi [mongol_emperor.Custom2('InsultAdjective', SCOPE.sC('demand_recipient'))] chỉ là cái bóng của một [mongol_emperor.GetTitleAsNameNoTooltip],"
  mongol_invasion.2003.desc:0 "Ngươi dám nghĩ có thể ép ta khuất phục? Ta sẽ cho ngươi thấy một vị vua thật sự xử lý bầy kỵ binh bất khả chiến bại của ngươi thế nào!"
  mongol_invasion.2003.a:0 "Vậy thì, chiến tranh và cái chết."

  mongol_invasion.2101.desc:0 "Ngươi đã là Ngài và Ta tớ tốt cho ta đến giờ. Đã đến lúc biến sự phục vụ của ngươi thành chính thức, khi ngươi thề trung thành với Chúa tể Vũ trụ."
  mongol_invasion.2101.a:0 "Dĩ nhiên, bệ hạ."
  mongol_invasion.2101.b:0 "Ngươi nghĩ ta phục vụ ngươi à? Nực cười!"
  mongol_invasion.2101.b.tt:0 "@warning_icon! [mongol_emperor.GetShortUIName] phá bỏ liên minh của [mongol_emperor.GetHerHis] với Ngài và có thể thay vào đó sẽ tiến hành chiến tranh!"

  mongol_invasion.2103.a:0 "Ngươi sẽ cúi đầu trước ta ngay bây giờ, bằng cách này hay cách khác!"
  mongol_invasion.2103.b:0 "Chờ đó, chó ngạo mạn..."

  mongol_invasion.2111.b:0 "Ngươi nghĩ ta kém hơn ngươi sao? Quá đáng!"
  mongol_invasion.2111.b.tt:0 "@warning_icon! [mongol_emperor.GetShortUIName] phá bỏ liên minh của [mongol_emperor.GetHerHis] với Ngài"

  mongol_invasion.2112.desc:0 "Ngươi thực sự cho rằng mình hơn ta sao? Ngươi còn chưa bằng ta! Rõ ràng Tình bạn mà ta ban cho chỉ là 'ném ngọc trước lợn'."
  mongol_invasion.2112.a:0 "Ôi, ngươi sẽ hối hận vì lời nói và hành động của mình..."
 
  temujin_horde_gathers_tt: "@alert_icon! #alert_trial Các chiến binh du mục sẽ tiếp tục tập hợp xung quanh ngươi, Đại Hãn được Trời chọn, mang thêm @herd_icon![herd|E], @prestige_icon![prestige|E], và @gold_icon![gold|E] — nếu [dominance|E] của ngươi vẫn trên [GetLaw('nomadic_authority_3').GetName]#!"
  mpo_greatest_of_khans.1010_title: "Các Bộ Lạc Nhỏ Tham Gia Bầy"
  mpo_greatest_of_khans.1010_desc: "Các kỵ binh vô chủ thề trung thành! Các chiến binh háo hức dâng cung! Vô số gia đình tập trung về trại vĩ đại của ngươi!"
  cadet_name_great_yuan: "Bó'érjìjin"
