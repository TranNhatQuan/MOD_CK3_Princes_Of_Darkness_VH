  MERIT_RANK_CAP_CELESTIAL_METROPOLITAN_EXAMINATION_TT: "Hoàn thành Kỳ thi Đô thành (hoặc cao hơn) là yêu cầu để đạt tới @merit_level_5_icon![GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]"
  MERIT_RANK_CAP_CELESTIAL_PALACE_EXAMINATION_TT: "Hoàn thành Kỳ thi Cung đình là yêu cầu để đạt tới @merit_level_7_icon![GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]"
  MERIT_RANK_CAP_MERITOCRATIC_PROVINCIAL_EXAMINATION_TT: "Hoàn thành Kỳ thi Tỉnh (hoặc cao hơn) là yêu cầu để đạt tới @merit_level_4_icon![GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]"

