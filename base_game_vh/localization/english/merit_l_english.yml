l_english: 
  TOTAL_MERIT: "Tổng [merit|E]: $VALUE|V0$"
  MERIT_EFFECTS_BREAKDOWN: "#S Hiệu ứng:#![AddTextIf( Not( StringIsEmpty(GetMeritLevelEffects( Character.GetMeritLevel )) ), '\n' )][GetMeritLevelEffects( Character.GetMeritLevel )]"
  MERIT_PROGRESSBAR_MARKER_TOOLTIP: "#T [GetMeritLevelNameNoTooltip( ComplexBarItem.GetIndex )]#!\nYêu cầu [GetMeritLevelThreshold( ComplexBarItem.GetIndex )|V^] $game_concept_merit$\n\n[GetMeritModifierByLevel( ComplexBarItem.GetIndex ).GetDescWithBulletPointEffects][AddTextIf( GreaterThan_int32( ComplexBarItem.GetIndex, '(int32)1' ), '\n' )]$BULLET$[movement_power|E]: [movement_power_i] [Multiply_int32( ComplexBarItem.GetIndex, '(int32)10' )|+=0]\n[GetMaxAppointmentRankDescription( 'merit', ComplexBarItem.GetIndex )][Character.GetMeritLevelDescription( ComplexBarItem.GetIndex )]"
  MERIT_TOOLTIP_COMPLETED_EXAMINATIONS: "Đã hoàn thành [imperial_examinations|E]"
  MERIT_TOOLTIP_EXAMINATION_DISCLAIMER: "[governors|E] phải nghỉ hưu mới có thể thi thêm các kỳ khảo hạch"
  MERIT_TOOLTIP_EXAMINATION_PASSED_CHILD_EXAM: "@child_exam_icon! #T Kỳ thi Thiếu nhi#!\n$CHILDRENS_EXAMINATION_PASSED_FAIL$\n\nThực hiện thông qua [decision|E] $tgp_china_attend_child_exam_decision$"
  MERIT_TOOLTIP_EXAMINATION_PASSED_PROVINCIAL_EXAM: "@provincial_exam_icon! #T Kỳ thi Tỉnh#!\n[SelectLocalization( HasPassedProvincialExamination(Character), 'ĐÃ VƯỢT QUA KỲ THI', SelectLocalization(HasFailedProvincialExamination(Character),'ĐÃ THẤT BẠI KỲ THI','CHƯA THAM GIA KỲ THI') )]\n\n#S Khi vượt qua:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithBulletPointEffects]\n\nĐược tổ chức bởi các quan chức chính phủ tại [activity|E] [GetActivityType('activity_local_examination').GetName]"
  MERIT_TOOLTIP_EXAMINATION_PASSED_METROPOLITAN_EXAM: "@metropolitan_exam_icon! #T Kỳ thi Đô thành#!\n[SelectLocalization( HasPassedMetropolitanExamination(Character), 'ĐÃ VƯỢT QUA KỲ THI', SelectLocalization(HasFailedMetropolitanExamination(Character),'ĐÃ THẤT BẠI KỲ THI','CHƯA THAM GIA KỲ THI') )]\n\n#S Khi vượt qua:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithBulletPointEffects]\n\nĐược tổ chức bởi [government|E] [GetGovernment('celestial_government').GetName|E] tại [activity|E] [GetActivityType('activity_imperial_examination').GetName]"
  MERIT_TOOLTIP_EXAMINATION_PASSED_PALACE_EXAM: "@palace_exam_icon! #T Kỳ thi Cung đình#!\n[SelectLocalization( HasPassedPalaceExamination(Character), 'ĐÃ VƯỢT QUA KỲ THI', 'CHƯA THAM GIA KỲ THI' )]\n\n#S Khi vượt qua:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithBulletPointEffects]\n\nĐược tổ chức trước [son_of_heaven|E] tại [activity|E] [GetActivityType('activity_imperial_examination').GetName]"

  CHILDRENS_EXAMINATION_PASSED_FAIL: "[SelectLocalization( HasPassedChildrenExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedChildrenExamination(Character), SelectLocalization(Character.IsAdult, 'EXAMINATION_FAILED_NO_RETAKE' , 'EXAMINATION_FAILED') ,'EXAMINATION_NOT_TAKEN') )]"

  EXAMINATION_PASSED: "@passed_examination!#P Đã đậu#!"
  EXAMINATION_FAILED_NO_RETAKE: "@failed_examination!#N Trượt#!" 
  EXAMINATION_FAILED: "$EXAMINATION_FAILED_NO_RETAKE$ #weak (có thể thi lại)#![AddLocalizationIf(And(And(Character.IsMeritCapped, Character.IsAdult), Or(ObjectsEqual(GetPlayer, Character.GetWarden.Self), Character.IsLocalPlayer)), 'EXAMINATION_WOULD_TAKE')]"
  EXAMINATION_NOT_TAKEN: "#weak Chưa dự thi#![AddLocalizationIf(And(And(And(Character.IsMeritCapped, Character.CanImproveMeritRank), Character.IsAdult), Or(ObjectsEqual(GetPlayer, Character.GetWarden.Self), Character.IsLocalPlayer)), 'EXAMINATION_WOULD_TAKE')]"
  EXAMINATION_WOULD_TAKE: "\n\n[Character.GetShortUINamePossessive|U] hạng [merit_level|E] tối đa bị giới hạn do chưa qua [examination|E] này. [SelectLocalization(Character.IsLocalPlayer, 'EXAMINATION_WOULD_TAKE_ME', 'EXAMINATION_WOULD_TAKE_OTHER')]"
  EXAMINATION_WOULD_TAKE_ME: "Ngươi nên tham dự một kỳ thi."
  EXAMINATION_WOULD_TAKE_OTHER: "[Character.GetSheHe|U] sẽ tham dự cùng ngươi nếu có thể và [Character.GetSheHe] sẵn sàng."
