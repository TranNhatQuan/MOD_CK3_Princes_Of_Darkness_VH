	house_guard:0 "Cận Vệ Gia Tộc"
	house_guard_flavor:0 "#F Trung đoàn tinh nhuệ này phục vụ cho một Triều Đại cụ thể. Các chiến binh được tuyển chọn từ những thần dân trung thành nhất.#!"
 
 #MaA Descriptions
	bowmen_flavor:1 "#F Các cung thủ chuyên nghiệp phủ kín bầu trời bằng mưa tên, tàn phá những hàng quân tiên phong của kẻ địch.#!"
	light_footmen_flavor:1 "#F Những lính quấy rối dày dạn kinh nghiệm vô cùng quý giá trong việc quấy nhiễu, phá vỡ hai cánh quân địch và bào mòn tinh thần chiến đấu.#!"
	light_horsemen_flavor:0 "#F Nhanh nhẹn và linh hoạt, những kỵ binh này rất giỏi đánh vòng sườn và cực kỳ nguy hiểm khi truy kích kẻ địch đang tháo chạy.#!"
	armored_footmen_flavor:1 "#F Được trang bị nặng và huấn luyện tốt, những binh sĩ này chuyên phá vỡ các khối bộ binh đông đảo.#!"
	pikemen_unit_flavor:0 "#F Những cây giáo dài cho phép các trung đoàn này tạo thành bức tường chông nhọn có thể chặn đứng mọi cuộc xung phong của kỵ binh.#!"
	armored_horsemen_flavor:0 "#F Được trang bị và bọc giáp nặng nề, những kỵ binh này thống trị chiến trường trên các đồng bằng rộng mở.#!"
	crossbowmen_flavor:0 "#F Dù nạp chậm, nỏ rất dễ sử dụng và bắn ra những mũi tên có thể xuyên qua hầu hết các loại giáp ở khoảng cách khá xa.#!"
	handgunners_flavor: "#F Đắt đỏ nhưng đầy uy lực, những khẩu súng thô sơ này là những vũ khí cực kỳ hiệu quả.#!\n#help Được mở khóa bởi [GetBuilding('powder_magazine_01').GetName].#!"
	fire_lancers_flavor: "#F Sử dụng các công thức thử nghiệm, những binh sĩ mang vũ khí cán dài kỳ lạ có thể phun lửa xuống những kẻ địch kinh hoàng.#!\n#help Được mở khóa bởi [GetBuilding('powder_magazine_01').GetName].#!"
	gakgung_archers_flavor: "#F Được trang bị cung phản xạ mạnh mẽ và nhẫn ngón tay cái để tăng lực kéo, các cung thủ này có thể bắn tên ở khoảng cách đáng kinh ngạc."
	pesilat_warriors_flavor: "#F Dù thường mang theo #italic kris#!, #italic golok#! hoặc nhiều loại vũ khí cận chiến khác, các võ sĩ silat cũng rất thành thạo chiến đấu tay không.#!"
	samurai_flavor: "#F Các #italic Bushi#! phục vụ tầng lớp quý tộc và thượng lưu, mang kiếm và mặc áo giáp da sơn hoặc kim loại.#!"
	zhanmadao_infantry_flavor: "#F Được trang bị những thanh đại kiếm hai tay khổng lồ, những binh sĩ này được huấn luyện để chống kỵ binh bằng các đòn đâm, chém và nghi binh điêu luyện.#!"

		black_armor_cavalry_flavor: "#F Một đơn vị vệ binh hoàng gia tinh nhuệ, nổi tiếng với áo giáp sắt tối màu đã bị oxi hóa.#!"
	tiefutu_flavor: "#F Được biết đến với tên gọi Thiết Phù Đồ, những kỵ binh được trang bị vũ khí nặng này được nhà Kim của người Nữ Chân đưa vào Trung Hoa. Kết hợp kỹ năng cưỡi ngựa điêu luyện với giáp trụ nặng nề, họ là kẻ thù đáng sợ trên mọi chiến trường.#!"
	burenjia_flavor: "#F Được triển khai với số lượng lớn trong đội hình chặt chẽ, lực lượng bộ binh này là xương sống của quân đội Hoàng gia. Bộ giáp nặng gồm hàng trăm mảnh giáp phiến cho phép họ chống lại gần như mọi kẻ xâm lược.#!"
	rocket_carts_flavor: "#F Chỉ cần một tia lửa, vài người lính có thể tung ra sức mạnh tương đương cả trăm cung thủ, dù có lẽ cũng nên dè chừng những người sẵn sàng vận hành thứ vũ khí như thế này.#!"
	ordo_riders_horse_archers_flavor: "#F Thảo nguyên đã rèn nên những chiến binh cứng rắn phục vụ Khả Hãn và thu cống nạp từ các láng giềng . Những kỵ sĩ tổ chức trong Ordo này tạo nên xương sống của các đội quân du mục tinh nhuệ.#!"

	onager_flavor:0 "#F Những máy bắn đá xoắn nhỏ này có thể phá hủy công sự của kẻ địch bằng cách phóng đá đi xa.#!"
	mangonel_flavor:0 "#F Mangonel dùng lực kéo dễ vận hành hơn onager và có tốc độ bắn nhanh hơn.#!"
	trebuchet_flavor:0 "#F Trebuchet đối trọng có thể phóng vật thể lớn với lực mạnh hơn nhiều so với mangonel hay onager.#!"
	bombard_flavor:0 "#F Không còn bị giới hạn bởi đòn bẩy và ròng rọc, những khẩu pháo này có thể phá vỡ công sự một cách dễ dàng.#!"

	ballista_flavor: "#F Những chiếc nỏ khổng lồ gắn trên bệ bánh xe có thể bắn các mũi tên thép đi rất xa#!"
	cloud_ladder_flavor: "#F Một chiếc thang gập có bản lề với cơ chế kéo đơn giản để mở ra khi đã tiếp cận tường thành.#!"
	siege_tower_flavor: "#F Một tòa tháp gỗ lớn có bánh xe có thể đẩy sát vào tường thành, mang lại sự bảo vệ và ổn định hơn so với thang công thành.#!"
	cannon_flavor: "#F Những khẩu pháo nhỏ nhưng chết chóc này được cố định xuống đất để giảm độ giật khi bắn.#!"

	war_elephant_flavor:0 "#F Một con voi xung phong gần như không thể bị chặn lại, khiến chúng trở thành lực lượng xung kích tuyệt vời.#!"
	ballista_elephant_flavor: "#F Một con voi xung phong đã đủ đáng sợ, nhưng một con voi mang ballista trên lưng còn khiến cả những chiến binh dày dạn trận mạc cũng phải khiếp đảm.#!"
	camel_rider_flavor:0 "#F Phù hợp với chiến tranh sa mạc hơn kỵ binh thông thường, những kỵ sĩ này thống trị các vùng cát.#!"

	huscarl_flavor:1 "#F Các Huscarls Germanic là bậc thầy trong việc dùng tường khiên để chặn các loạt mưa tên.#!"
	landsknecht_flavor:1 "#F Landsknechts Đức có thể dùng thanh zweihander khổng lồ của mình để phá vỡ hàng ngũ dày đặc của lính giáo đối phương.#!"
	longbowmen_flavor:2 "#F Dù cần cả đời để thành thạo, trường cung của Anh và Wales đủ mạnh để xuyên giáp tấm và có thể bắn liên tiếp với tốc độ gần như vô song.#!"
	goedendag_flavor:0 "#F Goedendag của người Flemish là một loại chùy có gai có thể chống lại các đợt xung phong kỵ binh.#!"
	gendarme_flavor:0 "#F Kỵ sĩ Gendarme của Pháp là đỉnh cao rực rỡ của kỵ binh hạng nặng, khiến cả thế giới phải kính nể.#!"
	chasseur_flavor:0 "#F Các hiệp sĩ Outremer đã thành thạo cả nghệ thuật cưỡi ngựa châu Âu lẫn chiến thuật sa mạc Levant.#!"
	picchieri_flavor:0 "#F Đội hình cơ động của Picchieri Latinh khiến họ nguy hiểm hơn lính giáo truyền thống.#!"
	praetorian_flavor:1 "#F Tinh nhuệ nhất trong tinh nhuệ, Palatini là những chiến binh La Mã phục vụ trực tiếp Hoàng đế.#!"
	caballero_flavor:0 "#F Không giống phần lớn kỵ binh, Caballero Iberia chiến đấu tốt cả ở đồng bằng lẫn địa hình đồi núi gồ ghề.#!"
	cataphract_flavor:0 "#F Bọc giáp sắt từ đầu đến chân, kỵ binh Cataphract Hy Lạp có thể phá vỡ hầu như mọi tuyến phòng thủ khi xung phong.#!"
	monaspa_flavor:0 "#F Xuất thân từ lực lượng cận vệ của các vị vua Gruzia, Monaspa là kỵ binh hạng nặng đáng sợ, rất quen thuộc với địa hình gồ ghề của Kavkaz.#!"
	hobelar_flavor:0 "#F Nhanh và linh hoạt, Hobelar Celt có thể dễ dàng cướp phá trong rừng và đồi nơi các kỵ binh khác tránh né.#!"
	schiltron_flavor:0 "#F Kỷ luật đáng kinh ngạc của lính giáo Scotland giúp họ dễ dàng phá vỡ các đợt xung phong của kẻ địch, ngay cả trên đồng bằng.#!"
	metsanvartija_flavor:0 "#F Metsänvartija Ural có thể phục kích kẻ xâm lược bằng mưa tên trước khi biến mất trở lại vào rừng.#!"
	horse_archers_flavor:0 "#F Cung kỵ binh của các bộ lạc du mục có thể bắn mưa tên trong khi gần như không thể bị bắt kịp.#!"
	ayyar_flavor:0 "#F Trẻ trung và nhiệt huyết, các thành viên của hội chiến đấu Ayyar là những chiến binh sẵn sàng chiến đấu bất cứ lúc nào được gọi.#!"
	mubarizun_flavor:0 "#F Được huấn luyện cả chiến đấu đội hình lẫn đấu tay đôi, Mubarizun Ả Rập có thể nghiền nát hầu hết bộ binh khác trên chiến trường.#!"
	druzhina_flavor:0 "#F Druzhina Nga là những cận vệ thiện chiến đã hiến mình để bảo vệ đồng minh.#!"
	hussar_flavor:1 "#F Bậc thầy cướp phá, kỵ binh nhẹ $hussar$ khét tiếng của Đông Âu có thể nhanh chóng tiêu diệt đội quân đang tháo chạy.#!"
	horn_warrior_flavor:0 "#F Thành thạo chiến tranh miền núi, các chiến binh từ Sừng Châu Phi không thể bị xem thường.#!"
	bush_hunter_flavor:0 "#F Những cung thủ Tây Phi này tận dụng địa hình rậm rạp của bụi rậm để làm lợi thế.#!"
	shomer_flavor:0 "#F Tận tâm bảo vệ đồng bào, các shomer Do Thái rất giỏi yểm trợ cho đồng đội trong chiến đấu.#!"
	khandayat_flavor:0 "#F Khandayat Ấn Độ là những kiếm sĩ bậc thầy có thể dễ dàng hạ gục cả người lẫn ngựa.#!"
	garudas_flavor:0 "#F Các chiến binh Garuda nổi tiếng vì lòng trung thành và tinh thần chiến đấu đến chết. Khi một Garuda ngã xuống, toàn bộ đoàn tùy tùng Lenka của ông ta cũng được kỳ vọng sẽ chết theo.#!"
	mountaineer_flavor:0 "#F Quá trình huấn luyện khắc nghiệt ở độ cao lớn khiến binh sĩ Tây Tạng trở thành bậc thầy tuyệt đối trong lãnh địa của họ.#!"
	sahel_horsemen_flavor:0 "#F Kỵ binh Sahel sử dụng giáp nhẹ và lao để tàn phá kẻ địch.#!"
	guinea_warrior_flavor:0 "#F Các chiến binh cao nguyên Guinea di chuyển nhanh và những cây lao của họ chính xác và chết chóc.#!"
	sarawit_flavor:0 "#F Sarawit là đội quân được huấn luyện tốt, quen thuộc với cao nguyên Ethiopia.#!"
	zbrojnosh_flavor:0 "#F Quen thuộc với đồi núi và rừng rậm Trung Âu, Zbrojnosh được sợ hãi khắp nơi.#!"
	abudrar_flavor:0 "#F Những chiến binh miền núi Abudrar biết rõ từng hẻm núi và thung lũng trong quê hương mình.#!"
	palace_guards_flavor:0 "#F Thường làm nhiệm vụ canh gác và giữ gìn trật tự, những chiến binh đa năng này có thể trở thành xương sống của bất kỳ đội quân nào.#!"
	shenbigong_flavor:1 "#F Những nỏ thủ tinh nhuệ này được trang bị Shenbigong — “Thần Tý Cung”. Mỗi mũi tên bắn ra có thể xuyên qua giáp và đội hình với độ chính xác đáng sợ.#!"
	mulaththamun_flavor:0 "#F Những kỵ sĩ này rèn luyện kỹ năng suốt đời trong sa mạc và che mặt bằng khăn Litham để tránh cát và tránh bị kẻ địch nhận ra.#!"
	archers_of_the_nile_flavor:0 "#F Suốt hàng nghìn năm, người Nubia bảo vệ quê hương bằng cách thành thạo cung tên từ nhỏ, chống lại các cuộc cướp phá và xâm lược.#!"
	paiks_flavor:0 "#F Bộ binh là trụ cột của quân đội Ấn Độ trong nhiều thế kỷ, và không vũ khí nào phổ biến hơn cây cung tre đơn giản mà người dân luyện tập từ nhỏ qua săn bắn.#!"
	guanch_vaulter_flavor:0 "#F Mang theo những cây sào dài, các chiến binh nhanh nhẹn này có thể di chuyển dễ dàng qua địa hình núi đá và thậm chí vượt qua một số công sự.#!"
	teulu_flavor: "#F Sworn by ancient oaths, these Brythonic horsemen ride as their lord’s loyal spear and shield.#!"
	ayrudzi_flavor: "#F Nhanh nhẹn trên lưng ngựa và khéo léo tận dụng địa hình khắc nghiệt, nhưng vẫn mặc giáp chắc chắn, những quý tộc hung mãnh này vừa có thể quấy rối vừa làm tiên phong đáng gờm.#!"
	conrois_flavor: "#F Lao giáo hạ thấp, những kỵ binh Norman liều lĩnh này lao vào mọi điểm yếu trong đội hình địch, háo hức giành chiến thắng bằng cú sốc và nỗi kinh hoàng.#!"
	akritai_flavor: "#F Những dân binh kỳ cựu vùng biên, bảo vệ các con đèo đá, dùng thời điểm chuẩn xác và hiểu biết địa phương để quấy rối cả những đạo quân hùng mạnh nhất.#!"
	ballistrai_flavor: "#F Những mũi tên khổng lồ từ các cỗ máy xoắn lực này bay vào thành trì bị vây và đội hình quân địch, gieo rắc sợ hãi và hỗn loạn.#!"
	skoutatoi_flavor: "#F Những tấm khiên #EMP skouton#! cao lớn mà bộ binh này mang theo chính là nguồn gốc tên gọi của họ. Nhưng đức tính quan trọng nhất của họ là kỷ luật, giúp giữ đội hình tốt cả khi tiến lẫn khi rút.#!"
	varangian_guards_flavor: "#F Những lính đánh thuê Germanic cầm rìu nổi tiếng này là lõi vững chắc của quân đội hoàng gia.\n\n@warning_icon! #X Họ sẽ đòi một phần [gold|E] sau khi Basileus qua đời.#!"
	handpicked_faithful_flavor: "#F Nổi bật về dũng khí, lòng trung thành và tài năng, những chiến binh này sẵn sàng hy sinh mạng sống để bảo vệ lãnh tụ của mình.#!"
	emishi_horse_archers_flavor: "#F Buộc phải tự vệ trước kẻ thù mạnh hơn, cung kỵ Emishi là bậc thầy chiến thuật đánh nhanh rút nhanh, cướp phá và phục kích.#!"
	japanese_horse_archers_flavor: "#F Áp dụng kỹ thuật của Emishi phương Bắc nhưng mặc giáp nặng hơn, các samurai cưỡi ngựa với cung yumi trong tay và quấy rối kẻ địch bằng mưa tên."
	warrior_monks_flavor: "#F Bảo vệ tín đồ và phục vụ người bảo trợ, cuộc sống tu hành của các tăng binh này cho họ nhiều thời gian luyện tập và niềm tin mạnh mẽ.#!"
	pikemen_militia_flavor: "#F Sẵn sàng chiến đấu vì đất đai và danh dự. Khi bị dồn đến đường cùng, họ sẽ nhắm vào các lãnh chúa để giành lại những gì thuộc về mình.#!"

