  FACTION_DEMAND_ACCEPT:0 "Có lẽ ta không còn lựa chọn nào khác..."
  FACTION_DEMAND_REFUSE:0 "Ta sẽ không bị đe dọa!"
  FACTION_DEMAND_ACCEPTED_OPT:0 "Một quyết định sáng suốt"
  FACTION_DEMAND_REFUSED_OPT:0 "Vậy thì chiến tranh!"
  faction_demand.2004.opt_tt:1 "Ta tham gia chiến tranh chống lại [faction_target.GetShortUIName]"
  FACTION_DEMAND_SEND_DEMAND_NOTIFICATION_OPT:0 "Gửi tối hậu thư!"
