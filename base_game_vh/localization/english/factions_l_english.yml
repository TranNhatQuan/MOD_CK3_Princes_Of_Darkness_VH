  FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Ta thấy rõ rằng ngươi sẽ để vương quốc cháy trước khi từ bỏ kế hoạch ngu ngốc này. Vì lợi ích của vương quốc, ta phải chấp nhận yêu cầu, nhưng hãy biết rằng một bất công lớn đã xảy ra hôm nay. Điều này sẽ không thể đứng yên!"
