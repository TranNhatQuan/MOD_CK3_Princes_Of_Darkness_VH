  faction_demand.9001.t:1 "[retaliating_faction.GetNameNoTooltip] trả đũa"
  FACTION_FAILED_IMPRISONMENT_RETALIATION:1 "[actor.GetShortUIName] đã bất công khi cố gắng bắt giam [recipient.GetShortUIName], một thành viên trong phe của ta."
  FACTION_SUCCESSFUL_IMPRISONMENT_RETALIATION:1 "[actor.GetShortUIName] đã bất công khi bắt giam [recipient.GetShortUIName], vốn là một thành viên trong phe của ta."
  FACTION_IMPRISONMENT_RETALIATION_END:0 "\n\nHành động trắng trợn nhằm vào [retaliating_faction.GetName] chỉ có thể được xem là tuyên chiến, và nếu chúng ta không tự vệ ngay bây giờ, chắc chắn sẽ bị tiêu diệt từng người một!"
  FACTION_IMPRISONMENT_RETALIATION_OPT:0 "Ra trận!"

 # Independence Faction
  independence_faction:0 "$game_concept_independence_faction$"
  independence_faction_desc:0 "Các thành viên của phe Độc Lập [faction|E] tìm kiếm sự độc lập khỏi [liege|E] của họ.\n\n#S Tối hậu thư#!\nTất cả thành viên phe trở thành [independent|E]\n[liege|E] mất [prestige|E]"
  independence_faction_short_effect_desc:0 "Muốn độc lập khỏi [liege|E] của họ"

  nation_fracturing_faction:1 "Phe Tan Rã"
  nation_fracturing_faction_desc:1 "Các thành viên của $nation_fracturing_faction$ [faction|E] tìm cách phá hủy vương quốc của [liege|E] của họ.\n\n#S Tối hậu thư#!\nTất cả thành viên phe trở thành [independent|E]\n[liege|E] mất [primary_title|E] và các [titles|E] khác cùng [title_tier|E]"
  nation_fracturing_faction_short_effect_desc:0 "Muốn phá hủy Lãnh địa của [liege|E]"
  liege_primary_title_dissolution:0 "Ngài giờ đã độc lập!"
  liege_primary_title_dissolution_desc:0 "[liege|E] của Ngài đã mất [primary_title|E] do phe $nation_fracturing_faction$ [faction|E]"

  FACTION_DEMAND_COLLAPSE:1 "Yêu cầu Tan Rã [faction_target.GetPrimaryTitle.GetNameNoTier]"
  FACTION_DEMAND_COLLAPSE_DESC:1 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nĐã đến lúc ngài phải thừa nhận rằng mình không thể duy trì sự thống nhất của [faction_target.GetPrimaryTitle.GetNameNoTier]. Đã đến lúc chấm dứt sự cai trị của ngài và những kẻ khác: vùng đất này cần tự do hơn. Hãy chấp nhận yêu sách của chúng tôi, nếu không sẽ đối mặt với gươm giáo trên chiến trường!"
  FACTION_DEMAND_COLLAPSE_ACCEPTED:1 "Yêu cầu Tan Rã được chấp nhận"
  FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC:1 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNhững yêu sách sai lầm của các ngươi chỉ làm suy yếu tất cả chúng ta. Tuy vậy, để tránh cảnh đổ máu vô ích, ta buộc phải chấp nhận yêu cầu độc lập của các ngươi."
  FACTION_DEMAND_COLLAPSE_REFUSED:1 "Yêu cầu Tan Rã bị từ chối"
  FACTION_DEMAND_COLLAPSE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nÂm mưu tống tiền đáng hổ thẹn của các ngươi đã thất bại. Dù các ngươi có lôi kéo bao nhiêu linh hồn sa ngã đi nữa, ta sẽ không khuất phục nếu chưa chiến đấu. Ta thà chết để bảo vệ những gì thuộc về mình!"
  FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION:1 "Sự kết thúc của [faction_target.GetPrimaryTitle.GetNameNoTier]!"
  FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION_DESC:0 "Khoảnh khắc đã đến! Tiếng nói thống nhất của [faction.GetName] khẳng định rằng [faction_target.GetName] đã đánh mất mọi quyền cai trị mà [faction_target.GetSheHe] từng có. Chúng ta sẽ được trao độc lập — hoặc sẽ giành lấy bằng vũ lực!"
  faction_demand.1002.tt:1 "[faction_target.GetPrimaryTitle.GetNameNoTier] bị phá hủy."

  FACTION_DEMAND_INDEPENDENCE:0 "Yêu cầu Độc lập"
  FACTION_DEMAND_INDEPENDENCE_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nĐã đến lúc ngài công nhận nền độc lập hoàn toàn của [faction_leader.GetPrimaryTitle.GetNameNoTier] và các quốc gia khác trong [faction.GetName]. Hãy chấp nhận yêu sách của chúng tôi, nếu không sẽ đối mặt với gươm giáo trên chiến trường!"
  FACTION_DEMAND_INDEPENDENCE_ACCEPTED:0 "Yêu cầu Độc lập được chấp nhận"
  FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC:1 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNhững yêu sách sai lầm của các ngươi chỉ làm suy yếu tất cả chúng ta. Tuy vậy, để tránh cảnh đổ máu vô ích, ta buộc phải chấp nhận yêu cầu độc lập của các ngươi."
  FACTION_DEMAND_INDEPENDENCE_REFUSED:0 "Yêu cầu Độc lập bị từ chối"
  FACTION_DEMAND_INDEPENDENCE_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nÂm mưu tống tiền đáng hổ thẹn của các ngươi đã thất bại. Dù các ngươi có lôi kéo bao nhiêu linh hồn sa ngã đi nữa, ta sẽ không khuất phục nếu chưa chiến đấu. Ta thà chết để bảo vệ những gì thuộc về mình!"
  FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION:0 "Độc lập!"
  FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION_DESC:0 "Khoảnh khắc đã đến! Tiếng nói thống nhất của [faction.GetName] khẳng định rằng [faction_target.GetName] đã đánh mất mọi quyền cai trị mà [faction_target.GetSheHe] từng có. Chúng ta sẽ được trao độc lập — hoặc sẽ giành lấy bằng vũ lực!"
  faction_demand.0002.tt:0 "Tất cả thành viên phe giành được Độc lập!"
 
  FACTION_DEMAND_BRIBE_CO_EMPEROR: "Có lẽ một chức vị sẽ buộc họ hợp tác?"
  FACTION_DEMAND_BRIBE_CO_EMPEROR_REASON: "[faction_leader.GetShortUIName|U] phải là [claimant|E] của [faction|E] #weak ([faction.GetSpecialCharacter.GetTitledFirstName])#!"
  faction_demand.0000.faction_leader_accepts: "Nếu thủ lĩnh phe chấp nhận đề nghị của Ngài"
  faction_demand.0000.faction_leader_rejects: "Nếu thủ lĩnh phe từ chối đề nghị của Ngài"
  faction_demand.0000.enter_co_rule_avoiding_worst_effects: "[faction_target.GetShortUIName|U] bổ nhiệm [_s(faction_target)] [faction_leader.GetShortUIName] làm [co_emperor|E] của [CharYourHerHis(faction_target)], tránh được những hậu quả tồi tệ nhất của phe [faction.GetName]"
  faction_demand.0000.truce_from_co_rule: "[faction_target.GetShortUIName|U] nhận được [_s(faction_target)] [truce|E] [EmptyScope.ScriptValue('faction_counter_offer_appointed_co_emperor_value')] năm với mọi thành viên phe [faction|E]"
  ep3_truce_appointed_faction_leader_coruler: "Đình chiến sau khi Thủ lĩnh Phe được phong Đồng Hoàng đế"

  FACTION_DEMAND_COUNTER_OFFER_CORULE: "Phản đề nghị của Phe"
  FACTION_DEMAND_COUNTER_OFFER_CORULE_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNhững yêu sách của các ngươi có lý — thậm chí chỉ ra sai lầm trong phán đoán của ta. Hạ vũ khí xuống và cùng ta trị vì với tư cách Đồng-[faction_target.GetTitleAsNameNoTooltip], chúng ta sẽ cùng nhau cai trị [faction_target.GetPrimaryTitle.GetDefinitiveName]!"
  FACTION_DEMAND_COUNTER_OFFER_CORULE_ACCEPT: "Một đề nghị không thể từ chối..."
  FACTION_DEMAND_COUNTER_OFFER_CORULE_REJECT: "Hừ, chỉ là chén rượu độc!"
  faction_demand.0000.offer_accepted: "Phản đề nghị được chấp nhận"
  faction_demand.0000.enter_co_emperorship: "[faction_leader.GetFirstName] trở thành [co_emperor|E] của Ngài"
  faction_demand.0000.offer_rejected: "Phản đề nghị bị từ chối"

  FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION: "Thủ lĩnh Phe được thăng chức"
  FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nTa vui mừng thông báo rằng [faction_target.GetTitledFirstName] đã thay đổi quan điểm. [faction_target.GetSheHe|U] đã bổ nhiệm #EMP ta#! làm Đồng-[faction_target.GetTitleAsNameNoTooltip], và ta đã đồng ý hạ vũ khí. Có hiệu lực ngay lập tức."
  FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.A: "Chúng ta đã ở rất gần..."
  FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.B: "Tên ngốc ích kỷ đó!"

 # Peasant Faction
  peasant_faction:0 "Phe Nông dân"
  peasant_faction_desc:0 "Phe Nông dân [faction|E] mong muốn tự do cho dân chúng khỏi sự cai trị của ngoại bang hoặc dị giáo, và sẽ tìm cách thay thế lãnh chúa không cùng [culture|E] và [faith|E] với dân thường trong các [counties|E]."
  peasant_faction_short_effect_desc:0 "Muốn giảm [county_control|E]"
  peasant_faction_every_county:0 "Mỗi [county|E] trong [faction|E]"
  peasant_faction_spawn_county_levies:0 "Triệu tập một [army|E] [new_title.GetAdjective] tương ứng với số [levies|E]"
  FACTION_DEMAND_PEASANT:1 "Gửi tới [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.GetTitledFirstName]"
  FACTION_DEMAND_PEASANT_DESC:0 "Chúng ta đã chịu đựng luật lệ áp bức của ngươi quá lâu rồi. Không còn nữa! Chúng ta sẽ không nộp thuế cho ngươi nữa.\n\nKhi kho bạc cạn kiệt và kho lương trống rỗng, ngươi sẽ ước rằng mình đã đối xử công bằng hơn với chúng ta."
  FACTION_DEMAND_PEASANT_ACCEPT:0 "Có lẽ ta có thể giảm thuế..."
  FACTION_DEMAND_PEASANT_REFUSE:0 "Không bao giờ! Số phận của nông dân là phục vụ lãnh chúa!"
  FACTION_PEASANT_NAME:0 "Dân đen nổi loạn"
  FACTION_PEASANT_TITLE_NAME:0 "Khởi nghĩa Nông dân"

 # Nomadic Faction
  nomadic_faction: "Phe Du Mục"
  nomadic_faction_desc: "Phe Du Mục [faction|E] mong muốn được cai trị bởi một [ruler|E] theo thể chế [GetGovernment( 'nomad_government' ).GetName] có [yurt|E] cùng [culture|E] và [faith|E] với họ."
  nomadic_faction_short_effect_desc: "Muốn thành lập các [realms|E] mới theo thể chế [GetGovernment( 'nomad_government' ).GetName]"
  FACTION_DEMAND_NOMADIC: "Gửi tới [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
  FACTION_DEMAND_NOMADIC_DESC: "Chúng ta sẽ không còn cúi đầu dưới ách áp bức của ngươi nữa! Chúng ta, những người [GetGovernment( 'nomad_government' ).GetName] [peasant_leader.GetCulture.GetCollectiveNoun] kiêu hãnh, sinh ra để rong ruổi tự do dưới bầu trời vô tận này.\n\nVới [peasant_leader.GetFaith.WarGodName] dẫn lối các kỵ sĩ, chúng ta sẽ phá tan sự cai trị hèn yếu của ngươi và giành lại vị thế trên thảo nguyên rộng lớn!"
  FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Được thôi! Lãnh địa của ta không có chỗ cho bầy gia súc bẩn thỉu của các ngươi."
  FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Chúng ta sẽ không còn dung thứ sự áp bức đê hèn của ngươi đối với những [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] kiêu hãnh. Sinh ra để tự do dưới bầu trời rộng mở này, chúng ta khước từ ách thống trị của ngươi — thời khắc của chúng ta đã đến!\n\nChúng ta sẽ rũ bỏ sự cai trị của ngươi và cả lãnh chúa của ngươi, [faction_target.GetTitledFirstName], một lần và mãi mãi!!"
  FACTION_DEMAND_NOMADIC_VASSAL_JOIN_WAR: "Vậy thì ta sẽ gặp các ngươi trên chiến trường, #EMP kẻ lang thang#!!"

 # Populist Faction
  populist_faction:0 "Phe Bình Dân"
  populist_faction_desc:1 "Phe Bình Dân [faction|E] mong muốn thoát khỏi sự cai trị của ngoại bang hoặc dị giáo, và sẽ tìm kiếm độc lập khỏi [liege|E] không cùng [culture|E] hoặc [faith|E] với họ."
  populist_faction_short_effect_desc:0 "Muốn độc lập khỏi [liege|E] của họ"
  populist_faction_short_effect_desc_admin: "Muốn [state_faith|E] phù hợp với đức tin của họ"
  FACTION_DEMAND_POPULIST:0 "Gửi tới [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
  FACTION_DEMAND_POPULIST_DESC_ADMIN: "Chúng ta sẽ không cho phép sự áp bức nào nữa từ sự cai trị [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] của ngươi. [peasant_leader.GetFaith.GetName|U] phải được công nhận là quốc giáo tối cao của [ROOT.Char.GetPrimaryTitle.GetName]!\n\nHãy trao cho đức tin của chúng ta địa vị xứng đáng, nếu không hãy chuẩn bị đối mặt với cơn thịnh nộ của vô số tín đồ!"
  FACTION_DEMAND_POPULIST_DESC_CULTURE:0 "Chúng ta sẽ không còn chịu đựng sự áp bức ngoại lai đối với truyền thống [peasant_leader.GetCulture.GetName]. Thời khắc của chúng ta đã đến!\n\nHãy trao cho chúng ta quyền tự cai trị, nếu không sẽ đối mặt với cơn thịnh nộ hợp nhất của toàn thể đồng bào!"
  FACTION_DEMAND_POPULIST_DESC_FAITH:0 "Chúng ta sẽ không còn chịu đựng sự áp bức đê hèn đối với những tín đồ [peasant_leader.GetFaith.GetAdherentNamePlural] nữa. Thời khắc của chúng ta đã đến!\n\nVới [peasant_leader.GetFaith.WarGodName] dẫn lối, chúng ta sẽ vùng lên và giải phóng mình khỏi ách cai trị [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] của ngươi!"
  FACTION_DEMAND_POPULIST_DESC:0 "Chúng ta sẽ không còn chịu đựng sự áp bức đê hèn đối với những [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] lương thiện nữa. Thời khắc của chúng ta đã đến!\n\nVới [peasant_leader.GetFaith.WarGodName] dẫn lối, chúng ta sẽ vùng lên và giải phóng mình khỏi ách cai trị [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] của ngươi!"
  FACTION_DEMAND_POPULIST_ACCEPT_CONVERT:0 "Khoan đã... nếu ta theo phong tục của các ngươi thì sao?"
  FACTION_DEMAND_POPULIST_ACCEPT_CONVERT_STATE_FAITH: "[peasant_leader.GetFaith.GetNameNoTooltip|U] sẽ được trao vinh dự này."
  FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENDENCE:0 "Được thôi, ta không cần những thần dân ương ngạnh như vậy!"
  FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENCE_TT:0 "#N Điều này sẽ khiến Ngài mất toàn bộ lãnh thổ!#!"
  FACTION_DEMAND_POPULIST_REFUSE:0 "Muốn tự do ư? Các ngươi sẽ có nó trong cái chết!"
  FACTION_DEMAND_POPULIST_REFUSE_ADMIN: "Những thay đổi đó không đến lượt ngươi quyết định, đồ [peasant_leader.Custom2('InsultNoun', ROOT.Char)] hỗn xược!"
  FACTION_DEMAND_POPULIST_REFUSE_TT:0 "#high [peasant_leader.GetTitledFirstName]#! và #high [faction.GetName]#! tuyên [war|E] với Ngài"
  FACTION_POPULIST_REVOLT_TITLE_NAME:0 "Cuộc Nổi dậy Bình Dân"
  FACTION_NOMADIC_REVOLT_TITLE_NAME: "Cuộc Nổi dậy Du Mục"
  FACTION_POPULIST_CREATED_TITLE_NAME:0 "Người [founder_culture.GetCollectiveNounNoTooltip]"
  FACTION_DEMAND_POPULIST_VASSAL_DESC_SAME_CULTURE_AND_FAITH:0 "Ngươi có thể chia sẻ truyền thống và đức tin của chúng ta, nhưng chúng ta không thể dung thứ ngươi hay [faction_target.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [faction_target.GetTitledFirstName] thêm nữa!\n\nHoặc đứng sang một bên, hoặc giúp chúng ta giành lấy tự do chính đáng!"
  FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE:0 "Chúng ta sẽ không còn chịu đựng sự áp bức ngoại lai đối với truyền thống [peasant_leader.GetCulture.GetName] nữa. Thời khắc của chúng ta đã đến!\n\nChúng ta đòi hỏi sự tự do hoàn toàn khỏi lãnh chúa của ngươi, [faction_target.GetTitledFirstName]!"
  FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH:0 "Chúng ta sẽ không còn chịu đựng sự áp bức đê hèn đối với những tín đồ [peasant_leader.GetFaith.GetAdherentNamePlural] nữa. Thời khắc của chúng ta đã đến!\n\nVới [peasant_leader.GetFaith.WarGodName] dẫn lối, chúng ta sẽ vùng lên chống lại sự cai trị của lãnh chúa ngươi, [faction_target.GetTitledFirstName]!"
  FACTION_DEMAND_POPULIST_VASSAL_DESC:0 "Chúng ta sẽ không còn chịu đựng sự áp bức đê hèn đối với những [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural] nữa. Thời khắc của chúng ta đã đến!\n\nChúng ta sẽ giải phóng mình khỏi sự cai trị của ngươi và ách bạo quyền của lãnh chúa ngươi, [faction_target.GetTitledFirstName]!"
  FACTION_DEMAND_POPULIST_VASSAL_JOIN_REBELS:0 "Hãy để ta tham gia cùng các ngươi!"
  FACTION_DEMAND_POPULIST_VASSAL_CONVERTS:0 "Chờ đã! Nếu ta theo phong tục của các ngươi và #EMP giúp#! các ngươi thì sao?"
  FACTION_DEMAND_POPULIST_VASSAL_CONVERTS_TT:0 "Ngài sẽ hỗ trợ quân nổi dậy chống lại [liege|E] của mình"
  FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR:0 "Vậy thì ta sẽ gặp các ngươi trên chiến trường, #EMP kẻ phản bội#!!"
  FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT:0 "Ngài không thể tham chiến vì đang chiến tranh với một bên khác"
  FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT_2:0 "Ngài không thể tham chiến vì điều đó sẽ khiến Ngài đối đầu với một đồng minh trong cuộc chiến khác"
  FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_TT:0 "Ngài sẽ hỗ trợ [liege|E] của mình chống lại quân nổi dậy"
  FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE:0 "Ta thà không dính líu..."
  FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_A:0 "Ngài không tham gia #high [populist_war.GetName]#!"
  FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B:0 "#N Ngài sẽ mất một phần lãnh địa nếu lãnh chúa đầu hàng yêu sách của họ!#!"
  POPULIST_FACTION_INDEPENDENCE_TITLE:0 "Giành được Độc lập"
  POPULIST_FACTION_INDEPENDENCE_DESC:0 "Ngài đã giành độc lập khỏi [faction_target.GetTitledFirstName] do kết quả của [popular_faction|E]"
  VASSAL_JOINS_LIEGE_TOOLTIP:0 "#high [vassal_to_join_liege.GetTitledFirstName]#! tham chiến phe Ngài với vai trò Phòng thủ"
  VASSAL_JOINS_REBELS_TOOLTIP:0 "#high [vassal_to_join_rebels.GetTitledFirstName]#! tham chiến phe nổi dậy với vai trò Tấn công"
  populist_faction_same_culture_faith_as_liege:0 "Không thể cùng [culture|E] và [faith|E] với [liege|E] của Ngài"

 # Liberty Faction
  liberty_faction:0 "Phe Tự Do"
  liberty_faction_desc:0 "Phe Tự Do [faction|E] tìm cách hạ thấp [crown_authority|E], [tribal_authority|E] hoặc [imperial_bureaucracy|E], nhưng ngoài ra vẫn trung thành với [realm|E]."
  liberty_faction_desc_admin: "Phe Tự Do [faction|E] tìm cách hạ thấp [imperial_bureaucracy|E], nhưng ngoài ra vẫn trung thành với [realm|E]."
  liberty_faction_desc_tribal: "Phe Tự Do [faction|E] tìm cách hạ thấp [tribal_authority|E], nhưng ngoài ra vẫn trung thành với [realm|E]."
  liberty_faction_desc_feudal: "Phe Tự Do [faction|E] tìm cách hạ thấp [crown_authority|E], nhưng ngoài ra vẫn trung thành với [realm|E]."
  liberty_faction_short_effect_desc:0 "Muốn hạ thấp [crown_authority|E]"
  liberty_faction_short_effect_desc_admin: "Muốn hạ thấp [imperial_bureaucracy|E]"
  liberty_faction_short_effect_desc_tribal: "Muốn hạ thấp [tribal_authority|E]"
  FACTION_DISCONTENT_CA_1:0 "Quyền lực Hoàng gia Hạn chế: #V $VALUE|0$%#!"
  FACTION_DISCONTENT_CA_2:0 "Quyền lực Hoàng gia Cao: #V $VALUE|0$%#!"
  FACTION_DISCONTENT_CA_3:0 "Quyền lực Hoàng gia Tuyệt đối: #V $VALUE|0$%#!"
  FACTION_DEMAND_LIBERTY:0 "Yêu sách Tự Do"
  FACTION_DEMAND_LIBERTY_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nĐã đến lúc ngài công nhận những quyền cổ xưa và bất khả xâm phạm của các chư hầu! Hãy chấp nhận yêu sách của [faction.GetName] hoặc đối mặt với gươm giáo của chúng ta!"
  FACTION_DEMAND_LIBERTY_ACCEPTED:0 "Yêu sách Tự Do được chấp nhận"
  FACTION_DEMAND_LIBERTY_ACCEPTED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNhững quan niệm ích kỷ về 'tự do' của các ngươi sẽ làm suy yếu toàn vương quốc. Tuy nhiên, để tránh đổ máu vô ích, ta sẽ chấp nhận yêu sách."
  faction_demand.0102.tt:0 "Quyền lực Hoàng gia của Lãnh chúa Ngài bị giảm!"
  FACTION_DEMAND_LIBERTY_REFUSED:0 "Yêu sách Tự Do bị từ chối"
  FACTION_DEMAND_LIBERTY_REFUSED_DESC:0 "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNỗ lực đe dọa lố bịch của các ngươi sẽ không bao giờ thành công. Ta là [faction_target.GetTitleAsNameNoTooltip]! Lũ phản bội khốn khổ các ngươi sẽ học được vị trí của mình trên chiến trường!"
  FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION:0 "Tự Do hoặc Chết!"
  FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION_DESC:0 "Khoảnh khắc đã đến! Các lãnh chúa thuộc phe [faction.GetName] đồng ý rằng [faction_target.GetName] là một bạo chúa phải từ bỏ quyền lực chuyên chế [faction_target.GetHerHis] đối với chúng ta… dưới mũi kiếm, nếu cần thiết."

 # Claimant faction
  claimant_faction:0 "Phe Đòi Ngôi"
  claimant_faction_desc:0 "Các thành viên của phe Đòi Ngôi [faction|E] ủng hộ một kẻ tiếm vị nhắm tới tước hiệu thuộc về [liege|E] của họ."
  claimant_faction_short_effect_desc:0 "Muốn [ROOT.Faction.GetSpecialTitle.GetDefinitiveName|l]"
  FACTION_DEMAND_CLAIMANT:0 "Yêu sách Ngai vị"
  FACTION_DEMAND_CLAIMANT_DESC:0 "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nQuyền cai trị [faction_targeted_title.GetNameNoTier] thuộc về [faction_claimant.GetName] theo thiên mệnh, và chúng ta đã có đủ sự ủng hộ để thực thi điều đó. Hãy chấp nhận sự thật này trong hòa bình, nếu không chúng ta sẽ buộc ngài phải làm vậy bằng vũ lực!"
  FACTION_DEMAND_CLAIMANT_DESC_ME:0 "Quyền cai trị [faction_targeted_title.GetNameNoTier] thuộc về ta theo thiên mệnh, và cuối cùng ta đã có đủ sức mạnh để thực thi điều đó. Hãy chấp nhận sự thật này trong hòa bình, nếu không ta sẽ buộc ngài phải làm vậy bằng vũ lực!"
  FACTION_DEMAND_CLAIMANT_ACCEPTED:0 "Yêu sách Ngai vị được chấp nhận"
  FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC:0 "Rõ ràng ngươi thà nhìn vương quốc chìm trong biển lửa hơn là từ bỏ tham vọng ngu xuẩn này. Vì lợi ích của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ta buộc phải chấp nhận yêu sách của ngươi, nhưng hãy biết rằng hôm nay một sự bất công lớn đã xảy ra. Chuyện này sẽ không dừng lại ở đây!"
  FACTION_DEMAND_CLAIMANT_REFUSED:0 "Yêu sách Ngai vị bị từ chối"
  FACTION_DEMAND_CLAIMANT_REFUSED_DESC:1 "Yêu sách của [faction_claimant.GetShortUINamePossessive|U] đối với tước hiệu của ta chẳng thực tế hơn những câu chuyện kể cho trẻ nhỏ trước giờ ngủ. Dù các ngươi có tụ tập bao nhiêu kẻ ngu muội đi nữa, ta sẽ không khuất phục trước đống phân đó. Ta thà chết còn hơn để quyền thừa kế rơi vào tay kẻ thấp hèn như vậy!"
  FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION:0 "Ngai vị Chính đáng!"
  FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC:1 "Khoảnh khắc đã đến! Tất cả những ai ủng hộ [faction_claimant.GetName] làm người cai trị hợp pháp của [faction_targeted_title.GetNameNoTier] giờ đây sẽ cùng nổi dậy như một và đảm bảo rằng [faction_claimant.GetSheHe] có thể giành lấy vị trí xứng đáng [faction_claimant.GetHerHis] trên ngai vàng. Chúng ta sẽ làm điều đó, bằng gươm giáo và lửa thiêu nếu cần!"
  FACTION_CLAIMANT_INVITE:1 "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
  FACTION_CLAIMANT_INVITE_DESC:0 "[faction_target.GetName] đang chiếm giữ ngai vàng lẽ ra phải thuộc về ngài! Ta sẵn sàng ủng hộ yêu sách của ngài bằng lời nói và gươm giáo, và chắc chắn những người khác trong vương quốc cũng sẽ làm vậy. Ngài chỉ cần chấp nhận."
  FACTION_CLAIMANT_INVITE_ACCEPT:0 "Cuối cùng cũng đến!"
  FACTION_CLAIMANT_INVITE_REFUSE:0 "Điều đó không đúng đắn..."
  FACTION_CLAIMANT_INVITE_ACCEPTED:1 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
  FACTION_CLAIMANT_INVITE_ACCEPTED_DESC:0 "Cuối cùng! [faction_target.GetName] chẳng khác gì một tên hề đóng vai [faction_target.GetTitleAsNameNoTooltip], và ta tin rằng vương quốc sẽ đứng lên vì ta. Những ai trợ giúp ta sẽ không bị lãng quên."
  FACTION_CLAIMANT_INVITE_ACCEPTED_OPT:0 "Chỉ còn là vấn đề thời gian..."

  FACTION_CLAIMANT_INVITE_REFUSED:1 "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
  FACTION_CLAIMANT_INVITE_REFUSED_ALLY_DESC:0 "Yêu sách của ta là chính đáng, điều đó ta biết. Nhưng liên minh với [faction_target.GetTitledFirstName] ngăn ta tham chiến. Ta sẽ ủng hộ ngươi về tinh thần."
  FACTION_CLAIMANT_INVITE_REFUSED_HOOK_DESC:0 "Dù yêu sách của ta là chính đáng, ta... không thể tham gia cùng ngươi. [faction_target.GetTitledFirstName] có một... #emphasis 'sức hút không thể chối cãi'#! khiến ta không thể chống lại [faction_target.GetHerHim]. Phải, là vậy đó. Chúc ngươi may mắn."
  FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC:1 "Ta vui khi thấy vương quốc nổi dậy chống lại [faction_target.GetTitledFirstName] giả mạo, nhưng hoàn cảnh hiện tại ngăn ta tham gia. Nếu ngươi thành công, ta sẽ ghi nhớ ơn này."
  FACTION_CLAIMANT_INVITE_REFUSED_CHILD_DESC:1 "Ta cũng nghĩ [faction_target.GetTitledFirstName] thật đáng ghét, và ta sẽ là người cai trị tốt hơn nhiều so với [faction_target.GetHerHim]!\n\nNhưng giờ ta đang bận chơi đồ chơi mới... nếu ngươi thắng, ta hứa sẽ chia sẻ chúng!"
  FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC:0 "Cuối cùng! [faction_target.GetName] chỉ là một tên hề đóng vai [faction_target.GetTitleAsNameNoTooltip], và ta tin vương quốc sẽ nổi dậy vì ta.\n\nVì địa vị thấp kém hiện tại, ta không thể trợ giúp ngươi. Nhưng hãy nhớ — #emphasis khi#! ngươi chiến thắng, ta sẽ tưởng thưởng xứng đáng!"
  FACTION_CLAIMANT_INVITE_REFUSED_DESC:1 "Ta trân trọng nhiệt huyết của ngươi dành cho yêu sách của ta, nhưng ta e rằng nỗ lực này sẽ thất bại. Vì vậy ta không thể ủng hộ ngươi, nhưng nếu ngươi bằng cách nào đó thành công, ta sẽ chấp nhận vị trí của mình trên ngai vàng."
  FACTION_CLAIMANT_INVITE_REFUSED_OPT:0 "Thật đáng tiếc."
  FACTION_CLAIMANT_EVERY_FACTION_MEMBER:0 "Mọi thành viên phe"
  FACTION_CLAMAINT_DYNAMIC_NAME:0 "Đưa [ROOT.Faction.GetSpecialCharacter.GetTitledFirstName] lên Ngai vàng [ROOT.Faction.GetSpecialTitle.GetAdjective]"
  FACTION_POPULIST_DYNAMIC_NAME:0 "Phong trào Bình Dân [ROOT.Var('faction_culture').Culture.GetNameNoTooltip] [ROOT.Var('faction_faith').Faith.GetAdjectiveNoTooltip]"
  FACTION_ESCALATED_PEASANT_DYNAMIC_NAME:0 "Khởi nghĩa [ROOT.Faction.GetSpecialCharacter.Custom('RegionalPeasantHeadgearPlural')|U] [ROOT.Faction.GetSpecialCharacter.Custom('GetTurbanRebellionColor')]"
 
  FACTION_NOMAD_DYNAMIC_NAME: "Du mục [ROOT.Var('faction_culture').Culture.GetNameNoTooltip] [ROOT.Var('faction_faith').Faith.GetAdjectiveNoTooltip]"

  WARNING_I_HAVE_ALREADY_JOINED_A_FACTION:1 "@warning_icon! #X Ngài đã tham gia một [faction|E]#!"
  WARNING_I_AM_ALREADY_AT_WAR_WITH_TARGET:1 "@warning_icon! #X Ngài đã đang chiến tranh với [faction_target.GetTitledFirstName]#!"
  WARNING_I_AM_AT_WAR_WITH_FACTION_LEADER:1 "@warning_icon! #X Ngài đang chiến tranh với [faction_invite_from.GetTitledFirstName]#!"
  WARNING_INVITE_CANNOT_JOIN:0 "@warning_icon! #X [faction_invite_from.GetTitledFirstName] không thể tham gia phe#!"

