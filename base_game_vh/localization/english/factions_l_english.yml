  FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED_DESC: "Hành động ủng hộ [faction_claimant.GetShortUINamePossessive|U] đối với [faction_targeted_title.GetDefinitiveName|l] là một sự xúc phạm đến phẩm giá của [faction_targeted_title.GetHolder.GetTitleAsName] hợp pháp!\n\nSự phản bội và thiếu danh dự của ngươi sẽ sớm gặp sự phán xét thần thánh, kẻ phản bội hèn hạ!"
  FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION: "Một Quyền lợi Hợp pháp!"
  FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC: "Khoảnh khắc đã đến! Tất cả những ai ủng hộ [faction_claimant.GetName] làm [faction_targeted_title.GetHolder.GetTitleAsName] hợp pháp giờ đây sẽ cùng nổi dậy như một và đảm bảo rằng [faction_claimant.GetSheHe] có thể giành lấy vị trí xứng đáng [faction_claimant.GetHerHis] trên [faction_targeted_title.GetDefinitiveName|l]. Chúng ta sẽ làm điều đó, bằng gươm giáo và lửa thiêu nếu cần!"
  FACTION_CEREMONIAL_CLAIMANT_INVITE: "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
  FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] đang chiếm ngai vàng vốn đúng ra là của ngươi! Ta sẵn sàng ủng hộ ngươi bằng lời nói và gươm, và ta chắc rằng những người khác trong vương quốc cũng sẽ ủng hộ lý do chính đáng này. Ngươi chỉ cần đồng ý."
  FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPT: "Cuối cùng!"
  FACTION_CEREMONIAL_CLAIMANT_INVITE_REFUSE: "Điều này không đúng..."
  FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
  FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Cuối cùng! [faction_target.GetName] chẳng khác gì một chú hề hành xử như [faction_target.GetTitleAsNameNoTooltip], và ta chắc rằng vương quốc sẽ đứng về phía ta. Những ai giúp ta sẽ không bị lãng quên."
  FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_OPT: "Chỉ còn là vấn đề thời gian..."

 # Imperial Policy
  FACTION_DEMAND_IMPERIAL_POLICY: "Chính sách Đế quốc"
  FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nCác thần dân trung thành của vương quốc đã phải chịu đựng những chính sách sai lầm của ngài quá lâu. [faction.GetName] yêu cầu ngài chấp thuận một hướng đi mới cho [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], nếu không chúng ta sẽ áp đặt điều đó lên ngài!"
  FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED: "Yêu sách Chính sách Đế quốc được Chấp nhận"
  FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Rõ ràng ngươi thà thấy vương quốc chìm trong biển lửa còn hơn từ bỏ ý định ngu ngốc này. Vì lợi ích của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ta buộc phải chấp nhận yêu sách của ngươi, nhưng hãy biết rằng hôm nay một bất công lớn đã xảy ra. Chuyện này sẽ không dừng lại!"
  FACTION_DEMAND_IMPERIAL_POLICY_REFUSED: "Yêu sách Chính sách Đế quốc bị Từ chối"
  FACTION_DEMAND_IMPERIAL_POLICY_REFUSED_DESC: "Sự ngạo mạn và nông nổi của ngươi khi phớt lờ những chính sách đúng đắn của triều đình chỉ chứng minh rằng ngươi hoàn toàn không đủ tư cách để đưa ra những quyết định như vậy!\n\nSự phản bội và ô nhục của ngươi sẽ sớm bị thần linh phán xét, tên phản nghịch đê hèn!"
  FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION: "Xoay Chuyển Con Thuyền"
  FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "Thời khắc đã đến! Tất cả những ai ủng hộ việc chấm dứt các chính sách sai lầm của [faction_target.GetTitledFirstNamePossessive] sẽ đồng loạt đứng lên và đảm bảo rằng vương quốc bước sang một hướng đi mới. Dù phải dùng gươm và lửa, chúng ta cũng sẽ hoàn thành việc này!"
  faction_demand.0222.tt: "[THIS.Char.GetShortUIName|U] sẽ chọn một [imperial_policy|E] mới"
  imperial_policy_faction_war: "Phe Chính sách Đế quốc"
  IMPERIAL_POLICY_WAR_NAME: "Chiến tranh Chính sách Đế quốc"
  imperial_policy_war_victory_desc: "[attacker.GetShortUIName|U] sẽ chọn một [imperial_policy|E] mới"
  imperial_policy_war_white_peace_end_desc: "[defender.GetShortUIName|U] nhận được một hiệp ước đình chiến và một [revoke_title_reason|E] chống lại tất cả chư hầu nổi loạn."
  imperial_policy_war_defeat_end_desc: "[defender.GetShortUIName|U] bỏ tù mọi chư hầu nổi loạn và nhận được một [revoke_title_reason|E] đối với từng kẻ trong số họ."
  faction_demand.0227.t: "Phe Chính sách Đế quốc: Soạn thảo Luật lệ"
  faction_demand.0227.desc: "Với [faction_target.GetTitledFirstNamePossessive] bị ép buộc, cuối cùng chúng ta có thể ban hành một chính sách có lợi cho lợi ích của mình — lợi ích của #EMP tất cả#! [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...\n\nNhiều đề xuất và yêu cầu đã được gửi lên, và với tư cách là thủ lĩnh phe phái, ta phải quyết định con đường tốt nhất."
