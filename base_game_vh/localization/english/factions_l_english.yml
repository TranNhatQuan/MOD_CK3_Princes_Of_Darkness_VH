  FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nKhông ai có thể phủ nhận rằng [faction_claimant.GetName], chứ không phải [faction_targeted_title.GetHolder.GetFirstName], là chủ quyền hợp pháp của [faction_targeted_title.GetNameNoTier].\n\nHãy chấp nhận sự thật này một cách hòa bình, nếu không chúng ta sẽ buộc ngươi phải làm vậy bằng sức mạnh!"
