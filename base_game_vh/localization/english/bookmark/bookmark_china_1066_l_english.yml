l_english:

  bm_1066_china:  "Khúc nhạc Thanh bình"
  bm_1066_china_desc:  "Từ đống đổ nát của Đại Đường, vinh quang của Đại Tống đã ra đời. Mở ra một thời kỳ trị vì vĩ đại chưa từng có trong gần hai thế kỷ – cống phẩm đổ về Kinh Đô như dòng thác chảy, các cuộc nổi loạn hiếm khi xảy ra và nhanh chóng bị dập tắt, và chính quyền hoàn toàn nằm trong tay những người hiền tài và có đức.\n\nTuy nhiên, thời bình kéo dài thì cám dỗ sinh sôi. Các dân tộc du mục từ xưa đã khao khát sự phồn thịnh của Trung Nguyên, ngay cả ở trong đế quốc, những kẻ bất lương cũng thường giả vờ làm người tốt để chiếm đoạt tài sản của quốc gia cho riêng mình.\n\n#bold Thiên Tử nắm giữ thiên hạ, nhưng những kẻ có thể buộc cả Thiên Tử phải hành động theo ý muốn của họ thì sao?#!"

  bookmark_china_1066_qin_guan:  "Tần Quan"
  bookmark_china_1066_qin_guan_subheading:  "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
  bookmark_china_1066_qin_guan_desc:  "Gia đình rơi vào cảnh nghèo khó sau khi cha ông qua đời, nhưng những khó khăn không làm giảm đi khát vọng của chàng trai trẻ Tần Quan; trái lại, trong hoàn cảnh khắc nghiệt, lòng nhiệt huyết của ông càng trở nên mãnh liệt hơn.\n\nMỗi khi mượn được một cuốn sách, ông đều dốc hết tâm sức vào thơ ca và chiến lược quân sự, mơ ước một ngày nào đó có thể tạo ra những công lao bất hủ được ghi vào sử sách.\n\n#bold Chí lớn dễ dàng bay cao, nhưng sự nghiệp ngàn thu thì khó thành. Bàn tay lớn của ngài sẽ dẫn dắt ông ấy đến số phận nào?#!"
 
  bookmark_china_1066_duan_silian:  "Tư Liêm Vương"
  bookmark_china_1066_duan_silian_subheading:  "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_china_1066_duan_silian_desc:  "Là một hậu duệ xa của người sáng lập Đại Lý, ít ai có thể tưởng tượng rằng Đoàn Tư Liêm một ngày nào đó sẽ ngồi lên ngai vàng, nhưng số phận thì thay đổi thất thường và khó lường.\n\nTrật tự đạo đức và trật tự xã hội của Nam Quốc đã bị Cao thị Đại Lý đảo lộn -  họ phế truất vị vua cũ phóng đãng và đưa Đoàn Tư Liêm lên ngôi - từ đó trở thành một gia tộc hùng mạnh chỉ sau Đoàn thị về tầm ảnh hưởng.\n\n#bold Liệu Tư Liêm Vương có thoát khỏi sự kiểm soát của gia tộc Gao thị để tự mình nắm giữ đại quyền, hay sẽ trở thành con rối cho tham vọng của họ?#!"

  bookmark_china_1066_ly_thanh_tong:  "Nhật Tôn Vương"
  bookmark_china_1066_ly_thanh_tong_subheading:  "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_china_1066_ly_thanh_tong_desc:  "Là nhà cai trị của Đại Việt, Lý Nhật Tôn mang trong mình khí chất của một vị vua bẩm sinh. Ông dũng mãnh, giỏi chiến đấu, trị quốc nhân ái, và thi hành pháp luật nghiêm minh; trong mắt thần dân, sắc chỉ của ông chính là mệnh trời.\n\nNgay cả nỗi lo duy nhất bao trùm triều đại huy hoàng của ông, sự vắng bóng người kế vị, cũng đã tan biến cùng với sự ra đời của Hoàng trưởng tử, Càn Đức.\n\n#bold Liệu Nhật Tôn Vương có thể biến Đại Việt thành một đế chế có thể đối đầu với bá chủ phương bắc, hay những thành tựu này về lâu dài sẽ chỉ là phù du?#!"

  bookmark_china_1066_new_noble_family:  "Nhân Vật Tùy chỉnh"
  bookmark_china_1066_new_noble_family_desc:  "Tạo lập một nhân vật mới và [noble_family|E] với một điền trang nhỏ ở Kinh Đô. \n\n#bold Ngài có thể bắt đầu từ đáy của bậc thang quan lại và tạo dựng tên tuổi cho bản thân cũng như gia đình mới khởi nghiệp của mình không?#!"

  bookmark_china_1066_empress_liang:  "$king_female$ $dynn_Liang_6881$ $Luoyao_843D_7464$"
  bookmark_china_1066_empress_liang_subheading:  "Hoàng hậu của $k_xia$"
  bookmark_china_1066_empress_liang_desc:  "Trước đây chỉ là con dâu của một quan chức trọng thần của Đại Hạ, $dynn_Mozang_6C92_85CF$ $Epang_8BB9_5E9E$, $dynn_Liang_6881$ nhưng tham vọng ẩn giấu của $Luoyao_843D_7464$ lại vượt xa cả dòng họ tầm thường của trượng phu.\n\nHoàn toàn bị mê hoặc bởi sắc đẹp và trí tuệ của bà, vị vua trẻ tuổi người Đảng Hạng, $king_male_tangut$ $Liangcha_5169_5C94$ đã ra tay giết chết gia tộc $dynn_Mozang_6C92_85CF$, bao gồm cả vợ mình, và đưa bà lên làm hoàng hậu bên cạnh mình.\n\n#bold Đại Hạ vẫn còn non trẻ và yếu ớt – liệu ngài có sẵn sàng nắm lấy tương lai của nó trong tay mình?#!"

  bookmark_china_1066_su_shi:  "Thứ sử Tô Thức"
  bookmark_china_1066_su_shi_subheading:  "$BOOKMARK_SUBHEADING_GOVERNOR$"
  bookmark_china_1066_su_shi_desc:  "Cha của Tô Thức, mặc dù không thành công trong kỳ thi khoa cử, nhưng lại nổi tiếng với những tác phẩm của mình vào thập niên thứ năm của cuộc đời, và danh tiếng đó càng được củng cố bởi thành tích xuất sắc và được ca ngợi của Tô Thức trong các kỳ thi của riêng mình.\n\nLúc này, Tô Thức không chỉ nhận được sự nâng đỡ từ các bậc thầy trong văn đàn mà còn giành được sự ưu ái từ triều đình Đại Tống, tạo nên một thời kỳ huy hoàng. Tuy nhiên, tin tức cha ông qua đời gần đây đã khiến tương lai tươi sáng này bỗng trở nên mờ mịt.\n\n#bold Liệu Tô Thức có thể sống xứng với những kỳ vọng nặng nề mà mọi người đặt lên ông không?#!"

  bookmark.0400.t: "Thùy Liêm Thính Chính"
  bookmark.0400.desc: "Chỉ một mũi tên duy nhất cũng đủ để phá tan nhiều năm chuẩn bị. [emperor.GetWifeHusband] của ta, [emperor.GetFirstName], đang nằm liệt giường, ngày càng suy yếu theo từng ngày trôi qua, bị hạ gục bởi một cung thủ nhà Tống sau khi ngu ngốc tiến quá gần chiến trường.\n\nSau tất cả những gì ta đã chịu đựng, ta #EMP sẽ không#! để tất cả tuột khỏi tay mình. Phụ nữ từng nắm quyền cai trị trước đây; nếu không thông qua phu quân của họ, thì thông qua con trai của họ, và [Glossary('Empress Wu', 'EMPRESS_WU_GLOSS')] thậm chí còn tự mình lập nên một #EMP triều đại#!.\n\nVới sức ảnh hưởng mà ta đã tích lũy cùng sự ủng hộ vững chắc của [brother.Custom('SisterBrother')] [brother.GetTitledFirstName], tương lai của [xia.GetNameNoTierNoTooltip] #EMP thuộc về ta#! quyết định."
  bookmark.0400.a: "Quyền lực của ngài rồi sẽ được ghi nhớ... như khúc dạo đầu cho triều đại của #EMP ta#!."
  bookmark.0400.a.tt: "[emperor.GetTitledFirstName] sẽ #EMP bi thảm#! qua đời vì những vết thương của [emperor.GetHerHis], và ngươi sẽ nắm quyền kiểm soát duy nhất [realm|E] với [brother.Custom('SisterBrother')] [brother.GetTitledFirstName] giữ chức [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle] của ngươi."
  bookmark.0400.b: "[emperor.GetSheHe] đã cận kề cái chết; ta sẽ buông rèm chấp chính."
  bookmark.0400.b.tt: "Với tình trạng suy yếu và năng lực giảm sút của [emperor.GetHerHis], ngươi sẽ đảm nhận vai trò [regent|E] cho [emperor.GetTitledFirstName], với [brother.GetTitledFirstName] giữ chức [emperor.GetHerHis] [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle]."
  bookmark.0400.c: "Ta sẽ nuôi dạy [child.Custom('GetDaughterSon')] của chúng ta thành người vĩ đại hơn cả [emperor.GetMotherFather] của [child.GetHerHis]."
  bookmark.0400.c.tt: "[emperor.GetTitledFirstName] sẽ #EMP bi thảm#! qua đời vì những vết thương của [emperor.GetHerHis], và ngươi sẽ đảm nhận vai trò [regent|E] cho [child.Custom('GetDaughterSon')] [child.GetTitledFirstName] của mình, với [brother.Custom('SisterBrother')] [brother.GetTitledFirstName] giữ chức [child.GetHerHis] [emperor.GetCouncillor('councillor_chancellor').GetCouncilTitle]."

  EMPRESS_WU_GLOSS: "Võ Tắc Thiên (624–705) đã phá vỡ lễ pháp truyền thống; sau khi phu quân qua đời, bà phế bỏ chính các hoàng tử của mình rồi #EMP tự lập#! làm hoàng đế, sáng lập triều đại Võ Chu."

  bookmark.0500.t: "Chính Đạo Lụi Tàn"
  bookmark.0500.desc: "Thất bại #EMP lần nữa#!. Ta còn phải cúi mình bao nhiêu lần nữa trong những kỳ khảo thí khốn khổ này, đọc những vần thơ rỗng tuếch dưới ánh mắt khinh miệt của lũ giám khảo? #EMP Chúng là ai#! mà dám cân đo giá trị của #EMP ta#!? Chúng rao giảng đạo đức, nhưng trong mắt ta chúng chỉ là lũ heo tham lam chúi đầu vào máng ăn gọi là quan trường.\n\nCon cháu được nuông chiều của chúng bước vào trường thi khi đáp án đã nằm sẵn trong tay, được bao bọc bởi gia sư mua bằng tiền bóc lột từ những kẻ nghèo khổ đến mức còn khó giữ nổi mái nhà trên đầu.\n\n[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] đã bị Thiên mệnh ruồng bỏ; khi đã biết điều gì là đúng mà vẫn đứng yên, ấy chính là hèn nhát. Vậy thì cứ thế đi. Hãy để chư thần chứng giám và để kẻ quyền thế run sợ, #EMP bởi giờ đây kẻ phán xét chính là ta#!."
  bookmark.0500.a: "Muốn đổi thay, cách chắc chắn nhất là từ bên trong."
  bookmark.0500.b: "Thời của ta đã đến; kỷ nguyên của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] đã #EMP chấm dứt#!!"
  bookmark.0500.c: "Cơ hội lớn chỉ chờ kẻ đủ gan mà nắm lấy."
  bookmark.0500.d: "Bách tính khát khao một vị cứu tinh, mà vị cứu tinh ấy chính là #EMP ta#!."
  faithful_followers: "Những Kẻ Theo Phò Trung Thành"
