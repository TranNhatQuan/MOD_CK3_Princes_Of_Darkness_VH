l_english: 
  bm_1178_nomads: "Bầu Trời Vô Tận"
  bm_1178_nomads_desc: "Cuộc di chuyển của một dân tộc du mục là một cảnh tượng hùng vĩ — một biển sống động của con người và gia súc, cuồn cuộn tiến bước qua những quãng đường mênh mông để tìm kiếm đồng cỏ.\n\nNhững nhịp vó tưởng chừng vô tận của đàn gia súc và bầy đàn vang lên như tiếng trống trận, nhắc nhở các láng giềng định cư rằng đoàn kỵ binh có thể giáng xuống bất cứ lúc nào! Bởi những bộ tộc lang bạt ấy khác gì những đạo quân vĩnh viễn hành quân?\n\n#bold Thế giới của ruộng đồng đang chín muồi cho bất kỳ thủ lĩnh nào đủ dũng khí chiếm lấy. Ngươi sẽ dẫn dắt bộ tộc vượt qua chân trời vô tận và dựng nên một đế chế trên lưng ngựa chăng?#!"

  bookmark_nomads_togrul: "Đại Thủ Lĩnh Togrul"
  bookmark_nomads_togrul_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
  bookmark_nomads_togrul_oghuul: "Oghuul"
  bookmark_nomads_togrul_desc: "Việc sát hại các huynh đệ kế đã đưa Togrul lên vị trí thủ lĩnh của người Keraits, nhưng chính nhờ bằng hữu và đồng minh Yesügei mà ngài mới giữ vững được quyền lực ấy. Hai lần Togrul bị đày ải, và hai lần Yesügei đưa ngài trở lại ngai vị.\n\nNhưng sẽ không có lần thứ ba, bởi Yesügei đã chết, bị một bộ tộc đối địch sát hại, và kẻ thù của Togrul đều đã biết rõ sự ra đi của người bảo hộ ấy.\n\n#bold Kẻ địch vây quanh như bầy sói — sức mạnh nào sẽ giúp ngươi chống lại tất cả chúng?#!"

  bookmark_nomads_temujin: "Đại Thủ Lĩnh Temüjin"
  bookmark_nomads_temujin_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
  bookmark_nomads_temujin_borte: "Borte"
  bookmark_nomads_temujin_hoelun: "Hoelun"
  bookmark_nomads_temujin_desc: "[Concept( 'story_content_temujin', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_temujin', '$bm_story_content_available_copy|q$' )|E]\nTemüjin sinh ra với một cục máu đông trong tay phải — dấu hiệu của một vận mệnh phi thường. Dẫu còn trẻ, ngài đã trải qua muôn vàn thử thách: phụ thân bị sát hại, cơn đói dày vò, và bị các bộ tộc đối địch giam cầm. Thế nhưng ý chí của ngài vẫn không hề lay chuyển, và nay ngài đang quy tụ những kỵ sĩ dũng mãnh dưới lá cờ của mình.\n\n#bold Hãy khiến mặt đất rung chuyển dưới vó ngựa của đoàn quân vô tận, và buộc thế gian phải khuất phục trước ý chí của ngươi!#!"

  bookmark_nomads_jamukha: "Thủ Lĩnh Jamukha"
  bookmark_nomads_jamukha_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
  bookmark_nomads_jamukha_desc: "[Concept( 'story_content_jamukha', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_jamukha', '$bm_story_content_available_copy|q$' )|E]\nLà một chiến binh đáng gờm, Jamukha đã trưởng thành cùng Temüjin, và giữa hai người hình thành một mối kết nghĩa còn bền chặt hơn cả huyết thống. Niềm kiêu hãnh bẩm sinh của hắn bổ trợ cho khát vọng quyền lực ngày càng lớn của Temüjin... nhưng cả hai hiếm khi đồng thuận về cách lãnh đạo.\n\n#bold Lưỡi gươm của Altai, ngươi sẽ khuất phục #EMP anda#! của mình, hay chết dưới cái bóng của hắn?#!"

  bookmark_nomads_koncek: "Khan Könçek"
  bookmark_nomads_koncek_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
  bookmark_nomads_koncek_kotyan: "Kotyan"
  bookmark_nomads_koncek_svoboda: "Svoboda"
  bookmark_nomads_koncek_desc: "Từ Biển Đen đến vùng hoang địa Altin — ai ai cũng biết đến danh ngài. Thống nhất người Cuman dưới một lá cờ không phải là việc dễ dàng, và cai trị vùng đất đầy biến động này lại càng đòi hỏi sự khoan dung để giữ vững quyền lực.\n\nCác thân vương Rus' lại một lần nữa tìm cách bôi nhọ danh tiếng của ngài, và khi tuổi đã cao, Könçek phải chuẩn bị cho những trận chiến sắp tới, bởi không một Khan nào có thể trị vì mãi mãi.\n\n#bold Bộ tộc của ngươi trông cậy vào ngươi. Ngươi sẽ giữ họ đoàn kết, hay để họ lại rơi vào cảnh chia rẽ và hỗn loạn?#!"

  bookmark_nomads_inanch_bilge: "Khan Inanch Bilge"
  bookmark_nomads_inanch_bilge_subheading: "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
  bookmark_nomads_inanch_bilge_gurbesu: "Gürbesu"
  bookmark_nomads_inanch_bilge_tayang: "Tayang Kẻ Yếu"
  bookmark_nomads_inanch_bilge_desc: "Tự nhận mình là hậu duệ huyền thoại của các nhà hiền triết Kinh Thánh, Inanch Bilge đã chứng minh dòng dõi của mình bằng cách giành lấy độc lập khỏi Kara Khitai.\n\nNhưng một số phận đen tối đang chờ đợi: con trai và người kế vị của Khan, Tayang, sẽ đối đầu Temüjin hùng mạnh trong trận chiến — và thất bại. Thê tử của hắn, Gürbesu, sau đó sẽ trở thành thiếp của kẻ chiến thắng...\n\n#bold Ngươi có thể thách thức định mệnh này và bảo đảm một sự kế vị vững chắc? Hay sự yếu đuối của con trai ngươi sẽ khiến huyết thống ngươi chìm trong ô nhục vĩnh viễn?#!"

  bookmark_nomads_duolubu: "Thủ Lĩnh Duolubu"
  bookmark_nomads_duolubu_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
  bookmark_nomads_duolubu_wolila: "Wolila"
  bookmark_nomads_duolubu_desc: "Từng là một Bagahatur trung thành của Kara Khitai, Duolubu nay phải gánh chịu sự phản bội từ chính huyết nhục của mình. Thê tử của hắn nằm chết, được ôm ấp trong vòng tay của chính huynh đệ hắn, và cháu trai của nàng nay ngồi trên ngai vàng.\n\nKhi phụ thân đang hấp hối trên giường bệnh, thời khắc hành động đã cận kề. Nếu Zhílugu trẻ tuổi không thể bị lay chuyển, thì đã đến lúc phải từ bỏ hắn hoàn toàn.\n\n#bold Những ngày đen tối nhất đã qua, và bình minh lại ló rạng. Ngươi có thể lấy lại danh dự, hay sẽ mãi bị nhớ đến như một kẻ ngu muội?#!"

  bookmark_nomads_wolila: "Thủ Lĩnh Wolila"
  bookmark_nomads_wolila_subheading: "$BOOKMARK_SUBHEADING_CHIEFTAIN$"
  bookmark_nomads_wolila_zhilugu: "Khagan Zhilugu"
  bookmark_nomads_wolila_desc: "Wolila có hai người con trai mạnh mẽ. Người thứ nhất, Duolubu kiên định, Kẻ Bình Định Phương Đông, đã cưới Nữ hoàng của Kara Khitai. Người thứ hai, Puguzi gian trá, lại trở thành tình nhân của nàng. Thê tử và huynh đệ: cùng nhau, chúng âm mưu sát hại Duolubu. Phẫn nộ trước tội huynh đệ tương tàn, Wolila đã trừng phạt đôi gian nhân bằng cái chết. Sau đó, Zhilugu của gia tộc Yelü đã bước lên ngai vàng Kara Khitai.\n\n#bold Cơn bão cuối cùng đang kéo đến với người Khitan. Ngươi có thể đứng lên vì dân tộc mình, giữ vững danh dự, và thay đổi số phận của họ chăng?#!"
