l_english: 

  bm_story_content_available_icon: "@story_content_icon!"
  bm_story_content_available_copy: "#font:TitleFont #size:15 Nội dung Cốt Truyện Đặc Biệt Có Sẵn#!#!#!"

  bm_1066_laamps: "Những Kẻ Lưu Đày Phiêu Bạt"
  bm_1066_laamps_desc: "Lãnh chúa và quý nữ xé toạc thế gian bằng những trò chơi quyền lực tầm thường của họ. Trong khi đó, những kẻ phiêu lưu vĩ đại vươn lên từ xuất thân thấp kém để khắc tên mình vào dòng chảy của thời gian. Không bị ràng buộc bởi nghĩa vụ, không tước vị hay vương miện, nhà của họ là những nẻo đường, và vận mệnh thì vô hạn.\n\n#bold Với lòng dũng cảm, mưu trí và tham vọng, ngươi có thể vượt qua những tranh chấp của giới quý tộc và lợi dụng những toan tính hư danh của chúng để nâng cao vinh quang của chính mình! Ngươi có đủ khả năng bước qua bùn lầy và bụi đất để trở thành huyền thoại không?#!"

  bookmark_laamps_hassan_sabbah: "Hasan Sabbah"
  bookmark_laamps_hassan_sabbah_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
  bookmark_laamps_hassan_sabbah_desc: "[Concept( 'story_content_hasan', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hasan', '$bm_story_content_available_copy|q$' )|E]\nHasan Sabbah sinh ra trong một gia đình vô danh, nhưng lòng tận tụy không ngừng với Hồi giáo và sự kháng cự cuồng nhiệt trước sự chiếm đóng của Seljuk đã đưa hắn bước lên con đường thay đổi lịch sử mãi mãi.\n\nTừ xuất thân thấp kém, Hasan được định mệnh dẫn dắt để lập nên giáo phái Sát Thủ tại pháo đài núi Alamut. Hắn sẽ trở thành huyền thoại, và tất cả sẽ phải khiếp sợ trước Lão Nhân Núi đáng sợ.\n\n#bold Ngươi có đủ mưu lược và đức tin tuyệt đối để tập hợp những kẻ sùng đạo và lật đổ các đế chế không?#!"

  bookmark_laamps_suleyman_qutalmishoglu: "Suleyman Qutalmishoglu"
  bookmark_laamps_suleyman_qutalmishoglu_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
  bookmark_laamps_suleyman_qutalmishoglu_desc: "Trong cuộc tranh giành ngai vàng Seljuk, Suleyman bị đánh bại bởi người anh em họ Alp Arslan và bị đẩy vào cảnh lưu đày cùng các huynh đệ. Bị hạ nhục nhưng chưa gục ngã, hắn đã giành được sự trung thành của các bộ lạc Turkmen tại dãy núi Taurus.\n\nSuleyman sau này sẽ tạo dựng nên Vương triều Rum giữa cơn hỗn loạn tại Anatolia, và bị cuốn vào các cuộc chiến của những kẻ tranh ngôi Byzantine.\n\n#bold Sức mạnh của ngươi có đủ để đặt nền móng cho một đế chế mới không?#!"
  bookmark_laamps_alt_alp_arslan: "Alp Arslan"
  bookmark_laamps_alt_mensur_qutalmishoglu: "Mensur"

  bookmark_laamps_el_cid: "Rodrigo Díaz 'the Campeador'"
  bookmark_laamps_el_cid_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
  bookmark_laamps_el_cid_desc: "[Concept( 'story_content_el_cid', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_el_cid', '$bm_story_content_available_copy|q$' )|E]\nXuất thân từ dòng dõi quý tộc, Rodrigo gia nhập hội đồng hoàng gia từ khi còn rất trẻ. Phục vụ dưới trướng Sancho II xứ Castile, hắn được rèn luyện cả về lễ nghi triều đình lẫn chiến trận, dưới sự giám sát chặt chẽ của nhà vua.\n\nTuy nhiên, cuộc chiến của Sancho với em trai Alfonso VI xứ León đã dẫn đến cái chết sớm của ông, và Alfonso sau đó đã lưu đày Rodrigo, vô tình khởi đầu cho huyền thoại của hắn.\n\n#bold Liệu Rodrigo có vươn lên trở thành El Cid, \"chúa tể\", và tự mình xưng vương, hay chỉ mãi là một quý tộc tầm thường?#!"

  bookmark_laamps_hereweard_the_wake: "Hereweard 'the Wake'"
  bookmark_laamps_hereweard_the_wake_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
  bookmark_laamps_hereweard_the_wake_desc: "[Concept( 'story_content_hereward', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_hereward', '$bm_story_content_available_copy|q$' )|E]\nBị lưu đày và bị gán danh kẻ ngoài vòng pháp luật bởi Edward the Confessor, Hereweard đã tới Flanders để tìm kiếm danh tiếng và vận mệnh của mình.\n\nMột ngày nào đó, Hereweard sẽ trở về Anh và lãnh đạo cuộc kháng chiến kiên cường chống lại quân Norman xâm lược, trở thành một anh hùng dân gian lừng danh.\n\n#bold Dưới sự dẫn dắt của ngươi, Hereweard sẽ mãi là kẻ phản loạn khét tiếng, hay trở thành người anh hùng mà hắn sinh ra để trở thành?#!"
  bookmark_laamps_alt_boudewijn_v: "Boudewijn V"

  bookmark_laamps_robert_crispin: "Robert 'Phrangopoulos'"
  bookmark_laamps_robert_crispin_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
  bookmark_laamps_robert_crispin_desc: "Là con trai thứ không có quyền thừa kế, Robert Crispin đã chọn con đường phiêu lưu theo tinh thần Norman.\n\nĐã là một cựu binh dày dạn từ các cuộc chiến tại Iberia, Robert gia nhập phục vụ dưới trướng Hoàng đế Byzantine và hiện chỉ huy một đội lính đánh thuê Norman chiến đấu chống lại người Thổ.\n\n#bold Liệu Robert sẽ đạt được vinh quang hắn tìm kiếm với tư cách một danh tướng, hay sẽ trở thành nạn nhân của ổ rắn độc mang tên triều đình Byzantine?#!"
  bookmark_laamps_alt_konstantinos_x: "Konstantinos X"
  bookmark_laamps_alt_roussel_de_baeilleul: "Roussel de Bailleul"


  bookmark_laamps_wallada_bint_al_mustakfi: "Wallada bint al-Mustakfi"
  bookmark_laamps_wallada_bint_al_mustakfi_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
  bookmark_laamps_wallada_bint_al_mustakfi_desc: "[Concept( 'story_content_wallada', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_wallada', '$bm_story_content_available_copy|q$' )|E]\nLà con gái của Caliph Córdoba và một trong những hậu duệ cuối cùng của Umayyad, Wallada посв hiến cuộc đời mình cho học vấn và tri thức. Không mấy quan tâm đến những ràng buộc dành cho phụ nữ trong xã hội Andalusia, nàng bước đi không che mặt giữa thế gian khắc nghiệt, khai mở trí tuệ cho phụ nữ thuộc mọi tầng lớp.\n\nCuộc đời Wallada không bị ràng buộc, và tiềm năng của nàng là vô hạn.\n\n#bold Hãy chiêu mộ và đào tạo những nữ nhân thông tuệ khắp thế gian về dưới trướng ngươi. Ngươi có thể phá vỡ xiềng xích truyền thống và kế thừa di sản của Đế chế Umayyad không?#!"

  bookmark.1073.t: "Seljuk Chính Danh"
  bookmark.1073.desc: "Đã ba năm trôi qua kể từ khi [tughril.GetTitledFirstName] qua đời mà không có người thừa kế, đẩy [GetTitleByKey('k_persia').GetBaseNameNoTier] vào hỗn loạn, chỉ còn người anh em họ của ông, phụ thân chính danh của ta, [qutalmish.GetTitledFirstName], giữ gìn trật tự.\n\nĐứa cháu tham lam của Tughril, [alp_arslan.GetFirstName], từ Khorasan kéo đến cướp lấy vương miện khi những kẻ trung thành tụ họp dưới trướng phụ thân ta và ta, nhưng số phận chúng ta đã định đoạt tại trận chiến [GetTitleByKey('b_damghan').GetNameNoTier]: phụ thân ta tử trận; còn ta bị bắt...\n\nĐược tha nhưng bị lưu đày bởi chính thân tộc vô danh dự, ta và các huynh đệ dẫn dắt những kẻ trung thành còn sót lại, sống lay lắt nơi núi non. Ta #EMP biết#! những điều vĩ đại đang chờ đợi — ngay lúc này, các đạo quân Oghuz đang tràn vào [GetTitleByKey('e_byzantium').GetNameNoTier|l], vùng đất trù phú chờ được chiếm lấy!"
  bookmark.1073.a: "Định mệnh của ta là dựng nên một Seljuk #EMP mới#!!"
  bookmark.1073.b: "Ngai vàng Seljuk thuộc về #EMP ta#!."
