l_english: 
  bm_1178_call_of_the_empire: "Tiếng Gọi Của Đế Chế"
  bm_1178_call_of_the_empire_desc: "Một hoàng đế tuổi đã xế chiều, một người thừa kế còn non trẻ, cùng thất bại gần đây trên chiến trường dưới tay người Seljuk Anatolia đã khiến Byzantine trở nên mong manh; và lịch sử đã chứng minh hết lần này đến lần khác rằng những mối họa lớn nhất đối với đế chế thường xuất phát từ nội tại không kém gì từ ngoại bang.\n\n#bold Liệu hậu duệ của La Mã sẽ đối diện với hoàng hôn cuối cùng, hay sẽ vượt qua đêm dài để đón lấy một bình minh mới?#!"

  bookmark_call_of_the_empire_tamar: "Công Nữ Tamar"
  bookmark_call_of_the_empire_tamar_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_call_of_the_empire_tamar_giorgi: "Quốc Vương Giorgi của Georgia"
  bookmark_call_of_the_empire_tamar_rusudan: "Rusudan"
  bookmark_call_of_the_empire_tamar_desc: "Bất chấp sự phản đối gay gắt từ giới quý tộc Georgia, Quốc vương Georgia đã tuyên bố rõ ràng rằng trưởng nữ của ngài, Tamar, sẽ kế vị ngai vàng — một hành động chưa từng có tiền lệ trong lịch sử lâu dài của vương quốc.\n\nCon đường phía trước sẽ đầy gian truân, và rất ít trong số các chư hầu tương lai của nàng hài lòng khi thấy nàng kế vị; song những ai hiểu rõ vị công nữ đều hoàn toàn tin tưởng rằng nàng sẽ vươn lên gánh vác trọng trách.\n\n#bold Ngươi có thể chứng minh những kẻ hoài nghi sai lầm, và dẫn dắt Georgia bước vào một thời đại hoàng kim huy hoàng chăng?#!"

  bookmark_call_of_the_empire_kilij_arslan: "Sultan Kilij Arslan"
  bookmark_call_of_the_empire_kilij_arslan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_call_of_the_empire_kilij_arslan_suleyman: "Suleyman"
  bookmark_call_of_the_empire_kilij_arslan_kaykhusraw: "Kaykhusraw"
  bookmark_call_of_the_empire_kilij_arslan_desc: "Vừa giành chiến thắng trước Byzantine tại trận Myriokephalon, Kilij Arslan đã chứng tỏ bản thân là một thế lực đáng gờm tại Anatolia.\n\nNếu có thời gian, ngài có thể dẫn đại quân tiến đến tận tường thành Constantinople; nhưng sự tranh đoạt kế vị giữa vô số hoàng tử của ngài có thể trở thành một sự xao lãng chết người, bởi ngay cả phụ thân của Kilij Arslan cũng đã bước lên ngai vàng trên xác của chính huynh đệ mình.\n\n#bold Trong số các hoàng tử của ngươi, ai sẽ chứng tỏ mình xứng đáng tiếp nối đại nghiệp, và liệu Rum có thể sống sót qua những mối kình địch này chăng?#!"

  bookmark_call_of_the_empire_angelos: "Strategos Andronikos"
  bookmark_call_of_the_empire_angelos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
  bookmark_call_of_the_empire_angelos_alexios: "Alexios"
  bookmark_call_of_the_empire_angelos_ioannes: "Ioannes"
  bookmark_call_of_the_empire_angelos_desc: "Là cháu nội của Basileus Alexios Komnenos, Andronikos đã có một sự nghiệp hiển hách trong phụng sự đế chế; nhưng khi ngày càng nhiều huynh đệ và con trai của ông leo lên kim tự tháp quyền lực, họ cũng tiến gần đến những đỉnh cao hiểm nguy, nơi chỉ một bước lầm lỡ có thể dẫn đến diệt vong cho tất cả.\n\n#bold Triều đại Komnenos được dựng nên từ mối ràng buộc của tình huynh đệ, và ngươi có thừa huyết thống. Liệu ngươi có thể tận dụng mối liên kết gia tộc để vươn lên cao hơn nữa chăng?#!"

  bookmark_call_of_the_empire_palaiologos: "Strategos Alexios"
  bookmark_call_of_the_empire_palaiologos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
  bookmark_call_of_the_empire_palaiologos_eirene: "Eirene"
  bookmark_call_of_the_empire_palaiologos_desc: "Gia tộc của Alexios nổi bật ngay cả giữa những danh gia quyền thế và ảnh hưởng nhất của Đế quốc Byzantine, đã giữ một chỗ đứng trong triều suốt hơn một thế kỷ, và tổ tiên của ông đã góp phần to lớn vào sự trỗi dậy của triều Komnenos.\n\nLòng trung thành của họ đối với ngai vàng vẫn luôn bền vững, nhưng sự gần kề quyền lực thường dẫn đến những cám dỗ lớn lao: họ sẽ còn mãn nguyện với việc phụng sự trong bao lâu?\n\n#bold Liệu Alexios và gia tộc của ông sẽ tiếp tục phò tá ngai vàng, hay sẽ tự mình khao khát chiếm lấy nó?#!"

  bookmark_call_of_the_empire_ioannes_kantakouzenos: "Strategos Ioannes"
  bookmark_call_of_the_empire_ioannes_kantakouzenos_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
  bookmark_call_of_the_empire_ioannes_kantakouzenos_michael: "Michael"
  bookmark_call_of_the_empire_ioannes_kantakouzenos_desc: "Là một trong những vị chỉ huy dày dạn nhất dưới trướng Basileus Manuel, Ioannes sở hữu vóc dáng vĩ lực cùng lòng dũng cảm nơi chiến trường, chỉ có thể sánh ngang với sự kiêu ngạo tột độ và tính nóng vội không kiềm chế của ông — những phẩm chất hiếm khi dẫn đến một cuộc đời dài lâu và yên ổn trong chính trường Byzantine.\n\n#bold Liệu sự táo bạo của Ioannes sẽ đưa gia tộc Kantakouzenos vượt lên khỏi vị thế hiện tại, hay chính lòng kiêu ngạo ấy sẽ trở thành nguyên nhân diệt vong của họ?#!"
