l_english: 
  bm_1066_japan: "Vầng Trăng Không Bao Giờ Khuyết"
  bm_1066_japan_desc: "Gần nửa thế kỷ đã trôi qua kể từ khi Fujiwara Michinaga, Kampaku của Nhật Bản, viết nên bài thơ nổi tiếng của mình: #EMP \"Ta coi thế gian này là của ta, và vầng trăng tròn kia sẽ không bao giờ khuyết.\"#!\n\nThường được diễn giải như một lời khẳng định về vị thế không thể lay chuyển của gia tộc Fujiwara với tư cách nhiếp chính hoàng gia, những lời ấy cho đến nay dường như vẫn hoàn toàn đúng. Con trai của Michinaga chuẩn bị truyền lại quyền lực tối cao ấy cho thế hệ tiếp theo.\n\n#bold Liệu Fujiwara có thể duy trì sự thống trị của mình đối với triều đình, trước sự phản đối của các gia tộc quý tộc khác và cả hoàng thất?#!"

  bookmark_japan_yorimichi: "Kampaku $dynn_Fujiwara$ $Yorimichi$"
  bookmark_japan_yorimichi_subheading: "$BOOKMARK_SUBHEADING_RULING_REGENT$"
  bookmark_japan_yorimichi_morozane: "$Morozane$"
  bookmark_japan_yorimichi_sadatsuna: "$Sadatsuna$"
  bookmark_japan_yorimichi_desc: "Là vị nhiếp chính thứ 9 trong dòng dõi lâu dài của [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )], Yorimichi đã cai trị Nhật Bản gần nửa thế kỷ. Nay tuổi già ập đến, ông đứng trước thời khắc trao lại quyền lực cho con trai mình, Morozane — nhưng tương lai vẫn đầy bất định.\n\nThiên hoàng Chikahito bất mãn dưới chế độ [Glossary( 'regency', 'KAMPAKU_GLOSS' )] và mong muốn tái tập trung quyền lực quanh [Glossary( 'Chrysanthemum Throne', 'CHRYSANTHEMUM_THRONE_GLOSS' )]. Xa rời kinh đô, các vùng xa xôi đã thoát khỏi bộ máy quan liêu trung ương, bị các quý tộc mới nổi cai trị như lãnh địa riêng.\n\n#BOLD Ngươi có thể tái khẳng định quyền lực của Fujiwara và chống lại sự tan rã của hệ thống [Glossary( 'Ritsuryō', 'RITSURYO_GLOSS')]?#!"

  RITSURYO_GLOSS: "#bold Ritsuryō#! là hệ thống pháp luật và hành chính tập quyền được thiết lập lần đầu tại Nhật Bản vào cuối thế kỷ thứ bảy nhằm mở rộng quyền lực của triều đình. Đến thế kỷ thứ mười một, hệ thống này đã suy tàn nghiêm trọng, khi các chức năng của nó dần bị các cá nhân và gia tộc quyền lực chiếm đoạt."

  bookmark_japan_go_reizei: "$Chikahito$ $king_tenno_male_japanese$"
  bookmark_japan_go_reizei_subheading: "$game_concept_ceremonial_liege$ của Nhật Bản"
  bookmark_japan_go_reizei_tameyuki: "$Tameyuki$"
  bookmark_japan_go_reizei_go_sanjo: "$Takahito$"
  bookmark_japan_go_reizei_desc: "$Chikahito$ lớn lên như một con tốt trong cuộc tranh giành quyền lực giữa phụ hoàng của mình, Cựu Hoàng [Glossary( 'Go-Suzaku', 'JOKO_GLOSS' )], và vị nhiếp chính nhà [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )], $Yorimichi$. Giờ đây với tư cách là [Glossary( 'Thiên Hoàng', 'TENNO_GLOSS' )], $Chikahito$ đã cố gắng hết sức để khẳng định quyền lực của hoàng gia, nhưng vẫn phần lớn chỉ đảm nhận một vai trò mang tính nghi lễ.\n\nBị gia tộc của chính phi ép buộc phải từ chối công nhận người con trai duy nhất của mình, giờ đây chính em trai của $Chikahito$, $Takahito$, mới là người có khả năng kế vị Ngai Vàng Hoa Cúc.\n\n#BOLD Ngươi có thể hạn chế sự thống trị của gia tộc Fujiwara, khôi phục [Glossary( 'Yamato', 'YAMATO_GLOSS' )], và cai trị với tư cách một vị Thiên Hoàng không chỉ trên danh nghĩa, mà còn thực sự nắm giữ quyền lực lâu dài và chân chính hay không?#!"
 #He seeks to 
 # restore [Glossary( 'Yamato', 'YAMATO_GLOSS' )] authority as true Emperor's of Japan?
  bookmark_japan_morofusa: "$dynn_Minamoto$ $Morofusa$"
  bookmark_japan_morofusa_subheading: "$game_concept_governor$ of $c_iyo$"
  bookmark_japan_morofusa_toshifusa: "$Toshifusa$"
  bookmark_japan_morofusa_akifusa: "$Akifusa$"
  bookmark_japan_morofusa_desc: "Là cháu trai của Thiên Hoàng $Murakami$, $Morofusa$ là một ví dụ hiếm hoi về một quan lại [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] tài giỏi và thành đạt, nhanh chóng thăng tiến dưới sự dìu dắt của cha nuôi mình, [Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] thuộc gia tộc $dynn_Fujiwara$ là $Yorimichi$.\n\nMặc dù mối quan hệ giữa gia tộc [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] và dòng họ Murakami Minamoto vẫn rất tốt đẹp, các gia tộc quý tộc khác cùng hoàng gia hy vọng $Morofusa$ sẽ trở thành đối trọng với ảnh hưởng của Fujiwara.\n\n#BOLD Ngươi có thể giành lại quyền nhiếp chính từ tay Fujiwara, trao quyền lực cho những hậu duệ trực hệ của hoàng gia hay không?#!"

  bookmark_japan_takenori: "$dynn_Kiyohara$ $Takenori$"
  bookmark_japan_takenori_subheading: "Lãnh Chúa Mutsu"
  bookmark_japan_takenori_takehira: "$Takehira$"
  bookmark_japan_takenori_mitsuyori: "$Mitsuyori$"
  bookmark_japan_takenori_desc: "Trong cuộc chiến Zenkunen gần đây, $Takenori$ đã giúp [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] giành quyền kiểm soát miền Bắc từ gia tộc Abe lâu đời. Để ghi nhận công lao này, triều đình do [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] lãnh đạo đã ban cho gia tộc Kiyohara quyền cai trị võ sĩ tại vùng đất phía Bắc.\n\nĐịa vị đáng mơ ước này, với rất ít sự giám sát từ triều đình, được chấp nhận miễn là của cải từ Mutsu tiếp tục chảy về kinh đô.\n\n#BOLD Ngươi sẽ giữ vững vị thế khó nhọc gây dựng và lập nên một lãnh địa Kiyohara trường tồn, hay sự bất hòa của hậu duệ sẽ phá hủy tất cả những gì ngươi đã xây dựng? #!"

  bookmark_japan_yoriyoshi: "$dynn_Minamoto$ $Yoriyoshi$"
  bookmark_japan_yoriyoshi_subheading: "Lãnh Chúa Kawachi"
  bookmark_japan_yoriyoshi_yoshiie: "$Yoshi_ie$"
  bookmark_japan_yoriyoshi_yorisue: "$Yorisue$"
  bookmark_japan_yoriyoshi_desc: "$Yoriyoshi$ lãnh đạo nhánh hùng mạnh nhất của [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )], những người là hậu duệ của Thiên hoàng $Seiwa$. Ảnh hưởng của họ đã gia tăng sau khi ông cùng con trai $Yoshi_ie$ phục vụ với tư cách tướng quân cho [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] trong cuộc chiến Zenkunen, chiến đấu bên cạnh gia tộc Kiyohara.\n\nChiến thắng này đã biến Minamoto trở thành biểu tượng lãnh đạo của các gia tộc samurai vùng Bandō, bao gồm cả [Glossary( 'Taira', 'TAIRA_GLOSS' )] hùng mạnh.\n\n#BOLD Ngươi có thể khẳng định vị thế thủ lĩnh của các gia tộc samurai và xây dựng một liên minh đủ sức thách thức Fujiwara tưởng chừng không thể lay chuyển?#!"
