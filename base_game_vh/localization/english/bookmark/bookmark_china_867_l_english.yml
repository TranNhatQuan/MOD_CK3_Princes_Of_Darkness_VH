l_english: 

  bm_867_china: "Mùa Thu Đức Hạnh"
  bm_867_china_desc: "Trong suốt hai thế kỷ rưỡi, Đại Đường đã cai trị Trung Hoa. Trong quãng thời gian ấy, thiên hạ đã chứng kiến và chịu đựng vô vàn loạn lạc cùng tai ương, không kém phần thảm khốc là cuộc đại loạn đã cướp đi vô số sinh mạng — vậy mà triều đại này vẫn tồn tại, thậm chí còn tiếp tục hưng thịnh.\n\nNhưng tồn tại chưa bao giờ là không phải trả giá. Để củng cố phòng thủ đế quốc, nhà Đường đã trao cho các Tiết độ sứ quyền lực phi thường; và trong sự tự do mới có được ấy, họ nhìn thấy cơ hội dựng nên lãnh địa riêng, những thế lực cát cứ chỉ còn danh nghĩa thần phục triều đình.\n\n#bold Chỉ một chiếc lá rơi cũng đủ báo hiệu mùa thu đang đến. Kẻ khôn ngoan tìm nơi ấm áp để tránh mùa đông sắp tới. Kẻ táo bạo thì lập mưu tính kế.#!"

  bookmark_china_867_huang_chao: "Hoàng Sào"
  bookmark_china_867_huang_chao_subheading: "$BOOKMARK_SUBHEADING_LANDLESS_ADMIN$"
  bookmark_china_867_huang_chao_desc: "Sinh ra trong một gia tộc buôn lậu muối lâu đời, Hoàng Sào sở hữu sự táo bạo cùng tài sản tích lũy từ cuộc sống ngoài vòng pháp luật, nhưng ngài vẫn khao khát một điều duy nhất chưa từng đạt được — địa vị đi kèm với chức quan trong triều.\n\nDẫu đã dốc hết tâm lực, ngài vẫn không thể vượt qua kỳ thi khoa cử; qua từng năm, nỗi bất mãn càng dâng cao khi hy vọng thành công dần lụi tàn.\n\n#bold Liệu Hoàng Sào có đạt được giấc mộng của mình, hay tham vọng bị dập tắt sẽ đẩy ngài vào một canh bạc tuyệt vọng?#!"

  bookmark_china_867_zhuye_chixin: "Tiết Độ Sứ Chu Da Xích Tâm"
  bookmark_china_867_zhuye_chixin_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
  bookmark_china_867_zhuye_chixin_desc: "Từ lâu, các bộ lạc Sa Đà đã được triều Đường trọng dụng nhờ lòng dũng cảm và tài năng chiến trận, và Chu Da Xích Tâm cũng không rời xa truyền thống tổ tiên.\n\nĐược vinh danh vì tham gia một cuộc giải cứu táo bạo thân quyến của hoàng đế vài năm trước, vị tướng Sa Đà này không ngừng thăng tiến trong ân sủng triều đình, khiến nhiều người tự hỏi tham vọng của ngài sẽ vươn xa đến đâu.\n\n#bold Nay khi ánh sao Đại Đường đang lụi tàn, liệu Chu Da Xích Tâm có đủ táo bạo để nắm lấy nó?#!"

  bookmark_china_867_he_quanhao: "Tiết Độ Sứ Hạ Toàn Hạo"
  bookmark_china_867_he_quanhao_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
  bookmark_china_867_he_quanhao_desc: "Gia tộc của Hạ Toàn Hạo từ thời tổ phụ đã cai trị như những lãnh chúa độc lập trên thực tế, chỉ còn danh nghĩa thần phục triều Đường.\n\nSau khi phụ thân qua đời, Toàn Hạo được quân đội tôn làm Tiết độ sứ, song không phải không có lo ngại — trong bản tính của người thanh niên này ẩn chứa sự tàn nhẫn.\n\n#bold Liệu Hạ Toàn Hạo có thể chế ngự bản thân để tiếp nối cơ nghiệp tổ tiên, hay chính bản năng sẽ dẫn ngài đến diệt vong?#!"

  bookmark_china_867_zhang_huaishen: "Tiết Độ Sứ Trương Hoài Thâm"
  bookmark_china_867_zhang_huaishen_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_china_867_zhang_huaishen_desc: "Sau khi chinh phạt và sáp nhập những vùng đất rộng lớn cho triều Đường, quân phiệt Trương Nghị Triều được vinh danh nơi triều đình và bổ nhiệm cháu mình, Hoài Thâm, cai trị các lãnh địa ấy thay mặt ông.\n\nNhưng Hoài Thâm, một vị chỉ huy mưu lược và tài năng, cũng mang trong mình tham vọng riêng, và không mấy sẵn lòng nhường lại vị thế cho các thân tộc khi thời khắc đến.\n\n#bold Liệu Trương Hoài Thâm có thể giành thắng lợi trong cuộc tranh đoạt kế vị sắp tới và đoạt lấy vị thế tối cao trong gia tộc chăng?#!"

  bookmark_china_867_gao_pian: "Tiết Độ Sứ Cao Biền"
  bookmark_china_867_gao_pian_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
  bookmark_china_867_gao_pian_desc: "Hậu duệ của các vị vua nước Tề cổ đại và là cháu của một danh tướng lừng danh, nhiều người tin rằng Cao Biền sinh ra để lập nên đại nghiệp; chiến tích bắn hạ hai con đại bàng chỉ với một mũi tên dường như đã chứng thực tài năng phi thường của ngài.\n\nĐược phái đến biên cương phương Nam để chống lại ngoại xâm, những chiến công của Cao Biền lại khiến ngài trở thành cái gai trong mắt những kẻ coi ngài là mối đe dọa đối với tham vọng của chúng.\n\n#bold Liệu vận mệnh hiển hách đang chờ đợi Cao Biền, hay ngài sẽ rơi xuống như chính những con đại bàng mà mình từng bắn hạ?#!"
