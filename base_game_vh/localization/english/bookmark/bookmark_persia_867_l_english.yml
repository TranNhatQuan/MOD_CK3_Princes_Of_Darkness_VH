l_english: 

  bm_867_persia: "Khoảng Lặng Iran"
  bm_867_persia_desc: "Hai trăm năm đã trôi qua kể từ khi Vương quốc Hồi giáo Rashidun chinh phục Ba Tư, sáp nhập vùng cao nguyên rộng lớn này vào Đế quốc Ả Rập hùng mạnh.\n\nHai trăm năm chịu cảnh lệ thuộc — nhưng mọi thứ rồi cũng sẽ thay đổi theo thời gian.\n\nGiờ đây, các lãnh chúa Ả Rập đang suy tàn, trong khi tầng lớp quý tộc cổ xưa của Ba Tư ngày càng trở nên hùng mạnh và thịnh vượng hơn bất kỳ thời điểm nào trong nhiều thế kỷ qua, phát triển mạnh mẽ giữa sự tan vỡ của một Ummah Hồi giáo từng thống nhất và hùng mạnh.\n\nỞ phía tây, Vương triều Abbasid chỉ còn kiểm soát vùng trung tâm của Đế quốc Rashidun cũ, trong khi những vị tổng đốc vĩ đại của họ từ Iberia đến Ấn Độ đã độc lập trên thực tế dù vẫn mang danh nghĩa trung thành. Việc kế vị bị cuốn vào một mớ hỗn loạn vô chính phủ của sự phản bội, ám sát và nổi loạn.\n\nỞ phía đông, những kẻ phiêu lưu Hồi giáo và lính đánh thuê bị ngăn cách bởi dãy Hindu Kush đang thèm khát nhòm ngó những chiến lợi phẩm của Rajasthan và Delhi.\n\nBa Tư đang đứng trước một ngã rẽ. Những người trung thành với Caliph đối đầu với những tín đồ còn sót lại của Hỏa giáo và Phật giáo, các lãnh chúa tham vọng tranh giành quyền lực với những thủ lĩnh vùng núi, còn các lính đánh thuê Turk đối đầu với những kẻ xâm lược Ả Rập.\n\n#Bold Thế giới đang xoay chuyển: nó sẽ đưa #Italic ngươi#! đến đâu?"

  bookmark_persia_amir_yaqub: "Amir Ya'qub"
  bookmark_persia_amir_yaqub_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_persia_amir_yaqub_desc: "Là con trai của một thợ rèn đồng nghèo hèn, Ya'qub là kẻ tự thân lập nghiệp, và vết sẹo do nhát kiếm để lại trên thân thể không hề làm chậm bước tiến của hắn.\n\nSau khi gây dựng một vương quốc rộng lớn tại Sistan, hắn nay đang chìm trong chiến tranh với nhà Tahirid — lũ tay sai cũ của Caliph. Ở hậu phương, chính những tướng lĩnh từng ủng hộ hắn tiếm quyền nay lại thì thầm về việc đổi phe lần nữa.\n\n#bold Ngươi dường như đã sẵn sàng rèn nên một vận mệnh mới cho Ba Tư — ngươi có dám thách thức sức mạnh trường tồn của Abbasid không?#!"
  bookmark_persia_yaqub_alt_amr: "Amr ibn al-Layth"
  bookmark_persia_yaqub_alt_sebuk_eri: "Sebük-eri"

  bookmark_persia_ismail_samani: "Ismail Samani"
  bookmark_persia_ismail_samani_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_persia_ismail_samani_desc: "Trong nhiều thập kỷ, gia tộc của Ismail đã thống trị các chức tổng trấn tại Transoxiana. Sự tan rã của Caliphate đã phá vỡ quyền lực trung ương, khiến nhà Samanid quay sang tranh giành lẫn nhau.\n\nCơ hội tranh đoạt quyền lực của Ismail trẻ tuổi đến khi hắn được chào đón làm người cai trị Bukhara, vừa bị cướp phá bởi quân đội Khwarezmshah hung bạo từ phía tây. Dẫu tài năng vượt trội, gia tộc hắn vẫn đòi hỏi sự phục tùng tuyệt đối.\n\n#bold Ngươi có thể vượt qua huynh đệ mình và khôi phục vinh quang Ba Tư không?#!"
  bookmark_persia_ismail_alt_nasr: "Amir Nasr"

  bookmark_persia_muhammad_ibn_abdallah: "Muhammad ibn Abdallah"
  bookmark_persia_muhammad_ibn_abdallah_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_persia_muhammad_ibn_abdallah_desc: "Là một nhà quản trị lão luyện và chuyên nghiệp, Muhammad đã trung thành phục vụ Abbasid suốt sự nghiệp dài của mình với tư cách tổng trấn Iraq, các Thánh địa, và cả Baghdad.\n\nDẫu vậy, những biến động gần đây đã thử thách cả tài trí chính trị của hắn, khi hắn suýt mất mạng vì đứng về phía sai Caliph. Ngay lúc này, sức khỏe hắn cũng đang dần suy yếu.\n\n#bold Ngươi sẽ dành những năm cuối đời để trợ giúp người cháu đang khốn khó — Amir xứ Khorasan — hay tập trung khôi phục danh dự gia tộc trước mắt Caliph?#!"
  bookmark_persia_muhammad_ibn_abdallah_alt_caliph: "Caliph al-Mu'tazz"
  bookmark_persia_muhammad_ibn_abdallah_alt_muhammad_ibn_tahir: "Muhammad ibn Tahir"

  bookmark_persia_rostam: "Rostam I"
  bookmark_persia_rostam_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_persia_rostam_desc: "Gia tộc của Rostam có dòng dõi gần như vô song trong thế giới được biết đến: phía phụ thân là những hậu duệ cuối cùng của Sassanid, còn thê tử hắn lại mang huyết thống Arsacid cổ xưa của Armenia.\n\nNhững triều đại và tín ngưỡng cổ vẫn tồn tại bền bỉ nơi vùng núi Tabaristan, nơi các lãnh chúa Daylamite giữ chặt thù hận truyền đời, và nhiều người — trong đó có Rostam — vẫn giằng co trước sự thống trị “mới” của Hồi giáo đối với truyền thống xưa cũ.\n\n#bold Ngươi có thể khôi phục vinh quang tổ tiên, hay sẽ chấp nhận thế giới mới?#!"
  bookmark_persia_rostam_alt_hasan: "Hasan Nhà Truyền Đạo"
  bookmark_persia_rostam_alt_shervin: "Sharvin"

  bookmark_persia_suri_of_mandesh: "Sūrī xứ Mandesh"
  bookmark_persia_suri_of_mandesh_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_persia_suri_of_mandesh_desc: "Là lãnh chúa Phật giáo cuối cùng phía tây sông Indus, Sūrī đứng trước ngã rẽ — giàu tài nguyên bạc và sắt, lãnh địa của hắn có thể trở thành hạt nhân của một đế chế hùng mạnh, nhưng các lãnh chúa tham lam từ Khorasan phía bắc và Makran phía nam cũng nhận ra điều đó.\n\nLà hậu duệ của các vị vua Guzgan thời xưa, Sūrī cảm nhận rõ hơn ai hết gánh nặng di sản và áp lực chính trị hiện tại.\n\n#bold Ngươi có thể thống nhất các bộ tộc Afghan chia rẽ và bảo vệ di sản tâm linh cổ xưa, hay cuối cùng sẽ quy phục ý chí của Allah?#!"
  bookmark_persia_suri_of_mandesh_alt_farhana: "Farhana xứ Bamian"
  bookmark_persia_suri_of_mandesh_alt_abdullah: "Abdullah bin Umar"


  war_Azariqa_Rebellion: "Khởi Nghĩa Azariqa"


