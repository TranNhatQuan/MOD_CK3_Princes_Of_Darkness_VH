l_english:
  bm_867_carolingians:0 "Vương Triều Caroling"
  bm_867_carolingians_desc:1 "Sau khi Louis the Pious băng hà, đế chế Caroling từng hùng mạnh đã bị chia cắt thành ba vương quốc riêng biệt: Đông, Tây và Trung Francia. Kể từ đó, những lãnh thổ này chỉ càng phân liệt sâu sắc hơn khi chiến tranh, phản loạn và việc kế vị liên tiếp gây nên bất ổn và tan rã.\n\n#bold Liệu có Karling nào đủ mạnh để tái thống nhất đế chế? Hay những tranh chấp gia tộc sẽ khiến họ trở thành miếng mồi cho kẻ cơ hội?#!"

 #Charles the Bald
  bookmark_carolingians_charles_the_bald:0 "Charles Kẻ Hói"
  bookmark_carolingians_charles_the_bald_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_carolingians_charles_the_bald_desc:0 "Vào thời điểm Charles chào đời, các huynh trưởng cùng cha khác mẹ của ngài đã cai trị những vương quốc riêng trong đế chế Caroling. Không có vương miện cho riêng mình, ngài bị gọi là 'Kẻ Hói', dù sau này vẫn thừa kế Aquitaine và Tây Francia. Trong tương lai, ngài thậm chí còn thừa kế cả Ý và chính Đế chế La Mã Thần thánh, song dòng dõi của ngài sẽ không trường tồn — đứa cháu nội cuối cùng sẽ chết mà không có con nối dõi chỉ bảy năm sau khi ngài qua đời.\n\n#bold Ngươi có thể thay đổi vận mệnh lịch sử và bảo đảm một dòng dõi lâu dài, thịnh vượng cho hậu duệ của Charles chăng?#!"

  bookmark_carolingians_charles_the_bald_alt_judith:0 "$Judith$"
  bookmark_carolingians_charles_the_bald_alt_louis:0 "$Louis$ $nick_the_stammerer$"

 #King Lothaire
  bookmark_carolingians_king_lothaire:0 "Quốc Vương Lothaire II"
  bookmark_carolingians_king_lothaire_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_carolingians_king_lothaire_desc:0 "Dẫu đem lòng yêu tình nhân Waldrada, phụ vương của Lothaire vẫn ép ngài kết hôn chính trị với Teutberga. Cuộc hôn phối ấy không sinh ra con cái, và cuộc đời của Lothaire trở thành chuỗi ngày đấu tranh nhằm ly dị chính thất và hợp pháp hóa những đứa con ngoài giá thú. Dẫu không ngừng cố gắng, Lothaire cuối cùng vẫn qua đời mà không có người thừa kế hợp pháp.\n\n#bold Ngươi có thể vượt qua mưu đồ của những kẻ chống đối và bảo đảm sự tiếp nối của gia tộc mình chăng?#!"

  bookmark_carolingians_king_lothaire_alt_waldrada:0 "$Waldrada$"
  bookmark_carolingians_king_lothaire_alt_teutberga:0 "$Teutberga$"

 #Ludwig the German
  bookmark_carolingians_ludwig_the_german:0 "Ludwig Người Đức"
  bookmark_carolingians_ludwig_the_german_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_carolingians_ludwig_the_german_desc:0 "Một con người đầy tham vọng, Ludwig từ lâu đã tìm cách tái chiếm những phần của đế chế mà ngài coi là quyền thừa kế của mình. Tuy nhiên, những tham vọng ấy liên tục gặp thất bại, khi các chiến dịch quân sự đều kết thúc trong thảm bại, còn những người con phản loạn dần tước đi phần lớn lãnh địa khỏi tay ngài.\n\n#bold Ngươi có thể xoay chuyển vận rủi của Ludwig và giành lại đế chế cho hậu duệ của ngài, hay con cháu của ông chỉ còn được ghi lại như một chú thích nhỏ bé trong sử sách?#!"

  bookmark_carolingians_ludwig_the_german_alt_youngerludwig:0 "$Ludwig$ $nick_the_younger$"
  bookmark_carolingians_ludwig_the_german_alt_karl:0 "$Karl$"

 #King Louis of Italy
  bookmark_carolingians_king_louis:0 "Quốc Vương Louis II"
  bookmark_carolingians_king_louis_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_carolingians_king_louis_desc:1 "Quyền lực đế chế đã suy yếu đến mức khi Louis được tấn phong Hoàng đế La Mã Thần thánh, danh hiệu ấy hầu như không còn thực quyền. Dẫu ngài đã tái chiếm được Vương quốc Provence, các thúc phụ và huynh đệ của ngài — không bị ràng buộc bởi lòng trung thành với Hoàng quyền — vẫn hành động theo ý riêng. Bị vây quanh bởi láng giềng hiếu chiến và một vương quốc bất ổn, Louis II sẽ qua đời trước khi có được một hoàng tử nối dõi.\n\n#bold Ngươi có thể thu hồi toàn bộ lãnh thổ đã mất của đế chế và tái lập Hoàng quyền như một thế lực thực sự chăng?#!"

  bookmark_carolingians_king_louis_alt_ermengarde:0 "$Ermengarde$"
  bookmark_carolingians_king_louis_alt_engelberga:0 "$Engelberga$"

 # King Karlmann of Bavaria
  bookmark_carolingians_king_karlmann:1 "Thân Vương Karlmann"
  bookmark_carolingians_king_karlmann_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_carolingians_king_karlmann_desc:0 "Trưởng tử của Ludwig Người Đức, Karlmann đã nổi dậy chống lại phụ vương và buộc ngài phải trao quyền cai trị vùng Bavaria. Sau đó, ông mở rộng lãnh thổ qua các cuộc chiến với người Slav ở phương Đông, và về sau còn được bầu làm Quốc vương Ý — song một cơn đột quỵ bất hạnh đã buộc ông phải thoái vị ngai vàng Bavaria và Ý cho các em trai. Ông qua đời chỉ vài năm sau đó.\n\n#bold Với một chút vận may, liệu ngươi có thể tránh được cái kết bi thảm của Karlmann và dựng nên một di sản trường tồn cùng thời gian chăng?#!"

  bookmark_carolingians_king_karlmann_alt_arnulf:0 "$Arnulf$"
  bookmark_carolingians_king_karlmann_alt_hemma:0 "$Hemma$"
