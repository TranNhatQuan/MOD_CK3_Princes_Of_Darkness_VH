l_english:

 # 867

 # Haraldr
  challenge_character_haraldr_vestfold:0 "Tù trưởng Haraldr"
  challenge_character_haraldr_vestfold_desc:0 "Là một anh hùng trong các saga, Haraldr được hậu thế ghi nhớ như một vị đại vương đã quy tụ các tù trưởng Na Uy đang tranh chấp dưới cùng một ngọn cờ.\n\n#bold Ngài có thể chấm dứt cảnh phân tranh và thống nhất Na Uy dưới quyền cai trị của mình không?#!"

 # Ashot
  challenge_character_ashot_armenia:0 "Thân vương Ashot"
  challenge_character_ashot_armenia_desc:0 "Dù triều đại của ông mang lại phồn vinh cho thần dân, Ashot vẫn mắc nợ ngai vàng và vương quốc của mình nhờ ân sủng của Khalip và phải duy trì thân phận chư hầu cho đến khi qua đời.\n\n#bold Ngài có thể thoát khỏi ách bá chủ ngoại bang và chứng minh mình là một quân vương độc lập thực thụ không?#!"

 # Aella
  challenge_character_aella_northumberland:0 "Tiểu vương Ælla"
  challenge_character_aella_northumberland_desc:0 "Lãnh thổ bị quân xâm lược ngoại bang vây hãm, cái chết của Ælla dưới tay họ đã đánh dấu sự chấm dứt của mọi kháng cự có ý nghĩa, còn người kế vị của ông chẳng khác nào một con rối Bắc Âu.\n\n#bold Ngài có thể xoay chuyển cục diện và cứu Northumbria khỏi tai họa Viking không?#!"

 # Gregorios
  challenge_character_gregorios_napoli:0 "Bá tước Gregorios"
  challenge_character_gregorios_napoli_desc:0 "Khi ảnh hưởng Byzantine tại Ý suy yếu, các vị thống trị Naples đã quay sang tìm kiếm đồng minh từ thế giới Hồi giáo để đối phó với sự bành trướng của người Lombard, khiến Giáo hoàng vô cùng phẫn nộ.\n\n#bold Ngài có thể lợi dụng khoảng trống do Byzantine để lại để dựng nên một đế chế của riêng mình không?#!"

 # Dawit
  challenge_character_dawit_dembiya:0 "Ras Dawit"
  challenge_character_dawit_dembiya_desc:0 "Dù dân số ít ỏi và thường xuyên lâm nguy, cộng đồng Beta Israel vẫn kiên cường chống lại sự đồng hóa từ những láng giềng  đông đảo và hùng mạnh hơn.\n\n#bold Ngài có thể vượt qua nghịch cảnh và xây dựng một quê hương phồn thịnh, an toàn cho người Beta Israel không?#!"

 # Werner
  challenge_character_werner_worms:0 "Bá tước Werner"
  challenge_character_werner_worms_desc:0 "Dù cái tên Salian vẫn chưa lừng danh vào thời của Werner, hậu duệ của ông sau này sẽ có tới bốn Hoàng đế La Mã Thần thánh và thậm chí cả một Giáo hoàng.\n\n#bold Ngài có thể giành lấy di sản của Charlemagne và tái rèn đế chế đã bị chia cắt của ông không?#!"

 # Siemowit
  challenge_character_siemowit_wielkopolska:0 "Đại tù trưởng Siemowit"
  challenge_character_siemowit_wielkopolska_desc:0 "Là con trai của Piast Người Thợ Xe huyền thoại, Siemowit cùng cha mình đã khai lập một triều đại sẽ cai trị Ba Lan cho tới cuối thế kỷ XIV.\n\n#bold Ngài có thể dẫn dắt Ba Lan an toàn qua dòng chảy lịch sử và biến nàng thành niềm ao ước của cả phương Đông lẫn phương Tây không?#!"

 # Ahmad
  challenge_character_ahmad_egypt:0 "Sultan Ahmad"
  challenge_character_ahmad_egypt_desc:0 "Xuất thân hèn kém nhưng vươn lên nắm quyền cai trị Ai Cập, Ahmad không thể có những người thừa kế xứng tầm, và vương quốc của ông sụp đổ chỉ hai mươi mốt năm sau khi ông qua đời.\n\n#bold Với sự giàu có và sức mạnh của Ai Cập trong tay, Ngài có thể trở thành bá chủ Địa Trung Hải không?#!"

 # Dyre
  challenge_character_dyre_kiev:0 "Jarl Dyre"
  challenge_character_dyre_kiev_desc:0 "Là một kẻ phiêu lưu Bắc Âu tìm cách tạo dựng danh tiếng nơi phương Đông, nỗ lực táo bạo của Dyre đã kết thúc bằng việc bị tiếm quyền một cách nhục nhã và bị Oleg Hiền Trí giết chết.\n\n#bold Ngài có thể viết lại câu chuyện bi thương của Dyre thành một saga vang vọng muôn đời không?#!"

 # Dumnarth
  challenge_character_dumnarth_cornwall:0 "Tiểu vương Dumnarth"
  challenge_character_dumnarth_cornwall_desc:0 "Dumnarth mang danh tiếng mập mờ khi chủ yếu được nhớ đến như vị vua cuối cùng của Cornwall, và còn chết đuối một cách xui xẻo trong một con sông.\n\n#bold Dưới sự cai trị của Ngài, Cornwall có thể đương đầu với cả người Anglo-Saxon lẫn Bắc Âu và giành chiến thắng không?#!"

 # Rhodri
  challenge_character_rhodri_gwynedd:0 "Thân vương Rhodri"
  challenge_character_rhodri_gwynedd_desc:0 "Thừa kế ngai vàng của một vương quốc Wales nhỏ bé ngay trước thềm các cuộc xâm lược Viking, vương miện của Rhodri đè nặng trên đầu ông, nhưng ông vẫn xoay xở rất khéo với số phận được trao.\n\n#bold Ngài có thể lèo lái an toàn qua thời đại hỗn loạn này và bảo đảm Gwynedd bước ra với chiến thắng không?#!"

 # Gunda
  challenge_character_gunda_orangallu:0 "Samanta Gunda"
  challenge_character_gunda_orangallu_desc:0 "Chỉ khi triều đại Kakatiya cải sang Ấn Độ giáo từ Kỳ-na giáo, họ mới giành được đủ lãnh thổ để xưng vương — điều có lẽ dễ dàng hơn khi không còn bị ràng buộc bởi sự cam kết bất bạo động nghiêm ngặt của Kỳ-na giáo.\n\n#bold Ngài có thể giành được ngai vàng của riêng mình mà vẫn trung thành với giáo lý đức tin không?#!"

 # Muhammad
  challenge_character_muhammad_africa:0 "Sultan Muhammad"
  challenge_character_muhammad_africa_desc:0 "Dù triều đại ngắn ngủi của ông chủ yếu bị ghi nhớ bởi sự trụy lạc và xa hoa, các tướng lĩnh của Muhammad lại thành công đến mức buộc chính Giáo hoàng phải nộp cống cho vị quân chủ sa đọa này.\n\n#bold Đã nếm trải sự giàu có của Ý, liệu Ngài có nuốt trọn nó để thỏa mãn dục vọng của mình không?#!"

 # Alfonsu
  challenge_character_alfonsu_asturias:0 "Vua Alfonsu"
  challenge_character_alfonsu_asturias_desc:0 "Vào cuối đời, Alfonsu trở thành nạn nhân của tham vọng từ chính các con trai mình, bị tước bỏ vương miện và buộc phải chia cắt vương quốc cho ba người trong số họ.\n\n#bold Ngài có thể tránh được số phận của Alfonsu và bảo đảm các Kitô hữu tại Iberia vẫn là một khối thống nhất trước mối đe dọa Umayyad không?#!"

 # Vicayalaya
  challenge_character_vicayalaya_chola_nadu:0 "Raja Vicayalaya"
  challenge_character_vicayalaya_chola_nadu_desc:0 "Ban đầu chỉ là chư hầu của triều đại Pallava, Vicayalaya đã nắm bắt thời cơ, tự lập và khai sáng một đế chế sẽ thống nhất toàn bộ miền nam Ấn Độ dưới lá cờ của mình.\n\n#bold Ngài có thể đưa tham vọng của Chola tới hồi kết tất yếu và đặt toàn cõi Ấn Độ dưới quyền cai trị của mình không?#!"

 # Lambert
  challenge_character_lambert_spoleto:0 "Công tước Lambert"
  challenge_character_lambert_spoleto_desc:0 "Được mời đến dự lễ tấn phong của Giáo hoàng, Lambert lại tai tiếng cướp phá thành phố, vơ vét dinh thự lẫn tu viện không chừa một ai khỏi lòng tham của mình.\n\n#bold Không tôn trọng luật lệ của loài người lẫn Thiên Chúa, Ngài sẽ đi xa đến đâu để theo đuổi tham vọng của mình?#!"

 # Amoghavarsha
  challenge_character_amoghavarsha_karnata:0 "Maharaja Amoghavarsha"
  challenge_character_amoghavarsha_karnata_desc:0 "Lên ngôi khi mới mười bốn tuổi, Amoghavarsha có một trong những triều đại dài nhất từng được ghi nhận và nổi tiếng bởi lòng nhân hậu cùng những thành tựu văn học và văn hóa.\n\n#bold Ngài có thể bảo đảm những thành tựu của Amoghavarsha được gìn giữ cho các thế hệ tương lai không?#!"

 # 1066

 # Gudrod
  challenge_character_gudrod_western_isles:0 "Tiểu vương Gudröd"
  challenge_character_gudrod_western_isles_desc:0 "Là một lãnh chúa Hebrides táo bạo xuất thân lính đánh thuê, Gudröd đã mở rộng quyền lực để trở thành bá chủ Dublin, Mann và vùng Biển Ireland, nhưng sự tranh chấp nội bộ giữa các hậu duệ của ông đã làm suy giảm đáng kể những thành tựu ấy.\n\n#bold Ngài có thể thiết lập một quyền thống trị bền vững hơn trên những hòn đảo tươi đẹp này không?#!"

 # Richard
  challenge_character_richard_capua:0 "Công tước Richard"
  challenge_character_richard_capua_desc:0 "Dù nhà Hauteville đã giành quyền bá chủ Sicilia, dòng Drengot không thể phủ nhận là những người đến trước, khi họ thuộc về nhóm phiêu binh Norman đầu tiên đặt chân lên bán đảo Ý.\n\n#bold Ngài có thể đặt những kẻ đến sau thuộc nhà Hauteville vào đúng vị trí của họ và chứng minh sự vượt trội của Drengot không?#!"

 # Fariburz
  challenge_character_fariburz_shirvan:0 "Shirvanshah Fariburz"
  challenge_character_fariburz_shirvan_desc:0 "Triều đại Shirvanshah được hậu thế ghi nhớ như những người bảo trợ và ân nhân của thi sĩ, triết gia, với nghệ thuật và đời sống trí thức thường xuyên nở rộ dưới thời họ cai trị.\n\n#bold Ngài có thể biến triều đình của mình thành một ngọn hải đăng văn hóa rực rỡ để cả thế giới ngưỡng mộ không?#!"

 # Shisnand
  challenge_character_shisnand_coimbra:0 "Bá tước Shisnand"
  challenge_character_shisnand_coimbra_desc:0 "Là một quý tộc Mozarab từng phục vụ cho cả triều Abbadid lẫn Leon, Shisnand cai trị Coimbra gần như tự trị trong hơn hai mươi năm, và sau khi qua đời, con rể ông đã kế nhiệm.\n\n#bold Từng phụng sự cả chủ nhân Hồi giáo lẫn Kitô giáo, Ngài có thể xây dựng một cây cầu giữa các đức tin và mang lại hòa bình cho Iberia không?#!"

 # Alusian
  challenge_character_alusian_vidin:0 "Bá tước Alusian"
  challenge_character_alusian_vidin_desc:0 "Là người con thứ hai của vị hoàng đế cuối cùng của Bulgaria, Alusian có thể đã được các chủ nhân Byzantine mới ban cho vô số vinh dự, nhưng ông không bỏ lỡ cơ hội phục hưng đế quốc của cha mình — dù cuối cùng vẫn quay lại thần phục.\n\n#bold Ngài có thể trút bỏ ách thống trị Byzantine và giành lại quyền thừa kế chính đáng của mình không?#!"

 # Rostislav
  challenge_character_rostislav_tmutarakan:0 "Bá tước Rostislav"
  challenge_character_rostislav_tmutarakan_desc:0 "Bị tước đoạt gia sản do cái chết sớm của cha mình, Rostislav đã chinh phục bán đảo xa xôi Tmutarakan và biến nơi đây thành căn cứ quyền lực, nhưng lại bị đầu độc trước khi có thể hiện thực hóa tham vọng.\n\n#bold Ngài có thể vượt qua sự thù địch của thân tộc và giành được một thân vương quốc xứng đáng với dòng dõi của mình không?#!"

 # Werner
  challenge_character_werner_aargau:0 "Bá tước Werner"
  challenge_character_werner_aargau_desc:0 "Khi nhà Habsburg vẫn chưa tạo được dấu ấn vào thời của Werner, những toan tính chính trị khôn ngoan đã đưa hậu duệ của ông lên nhiều ngai vàng trong suốt nhiều thế kỷ sau đó.\n\n#bold Ngài có thể giành được Áo cho nhà Habsburg và khiến cả thế giới phải thừa nhận sự trỗi dậy của họ không?#!"

 # Herbert
  challenge_character_herbert_vermandois:0 "Bá tước Herbert"
  challenge_character_herbert_vermandois_desc:0 "Dù dòng máu của Charlemagne không còn ngự trị trên ngai vàng, nó vẫn chảy trong huyết mạch của Herbert xứ Vermandois — tuy nhiên, thế hệ kế tiếp lại để mất lãnh thổ ra khỏi tay gia tộc.\n\n#bold Ngài có thể xoay chuyển bánh xe lịch sử và sắp đặt một sự trở lại quyền lực cho nhà Karling, bằng mọi giá không?#!"

 # Erik
  challenge_character_erik_svealand:0 "Thân vương Erik"
  challenge_character_erik_svealand_desc:0 "Là một vị quân chủ ngoại giáo đã từ bỏ Kitô giáo để quay về cội nguồn, Erik thuộc về lớp người cuối cùng của một giống loài đang dần biến mất trong một Scandinavia ngày càng Kitô hóa.\n\n#bold Ngài có thể chứng minh cho tất cả thấy rằng những con đường cổ xưa vượt trội hơn đám giáo sĩ ngoại lai và vị thần mới của họ không?#!"

 # Krutoj
  challenge_character_krutoj_nordmark:0 "Công tước Krutoj"
  challenge_character_krutoj_nordmark_desc:0 "Là người tận tâm với truyền thống của dân tộc mình, Krutoj đã lãnh đạo một cuộc nổi dậy và sát hại vị lãnh chúa Kitô giáo của mình để đoạt lấy ngai vàng, nhưng âm mưu trừ khử con trai của kẻ bại trận đã dẫn đến chính cái chết của ông.\n\n#bold Ngài có thể vượt qua các đối thủ và hợp pháp hóa quyền cai trị của mình, bất chấp khởi đầu đẫm máu ấy không?#!"

 # Ishaq
  challenge_character_ishaq_baalbek:0 "Sheikh Ishaq"
  challenge_character_ishaq_baalbek_desc:0 "Bất chấp quân số ít ỏi và sự bức hại từ những kẻ coi đức tin của họ là tà giáo, người Druze vẫn trường tồn qua nhiều thế kỷ bằng cách ẩn mình trong những dãy núi hiểm trở của vùng Levant.\n\n#bold Ngài có thể dẫn dắt người Druze vượt ra khỏi núi non để tìm kiếm một quê hương thanh bình của riêng mình không?#!"

 # Badr
  challenge_character_badr_acre: "Sheikh Badr"
  challenge_character_badr_acre_desc: "Là một binh sĩ Fatimid gốc Armenia, Badr thăng tiến qua các cấp bậc để trở thành nhà độc tài quân sự tối cao của Khalip, biến chính Khalip thành một bù nhìn.\n\n#bold Badr và những người kế nhiệm đã thống trị chính trường Ai Cập hơn sáu mươi năm — Ngài có thể vượt qua họ và loại bỏ Khalip hoàn toàn không?#!"

 # Berenguer
  challenge_character_berenguer_barcelona: "Công tước Berenguer"
  challenge_character_berenguer_barcelona_desc: "Trong nỗ lực theo đuổi công lý, Berenguer đã cho pháp điển hóa tập quán của lãnh thổ mình thành Usatges of Barcelona, đặt nền móng cho luật pháp Catalan suốt nhiều thế kỷ.\n\n#bold Hậu duệ của Berenguer sau này sẽ kiểm soát phần lớn Địa Trung Hải. Ngài có thể xây dựng trên những thành tựu ấy và làm được điều tương tự không?#!"
 
 # Raoul
  challenge_character_raoul_valois: "Bá tước Raoul"
  challenge_character_raoul_valois_desc: "Dù từng là đối thủ của nhà Capet thời trẻ, Raoul về sau đã đổi phe và trở thành một  Bề Tôi trung thành của vương quyền Pháp, thậm chí còn cưới góa phụ của chính vị vua mà ông từng chống lại.\n\n#bold Với mẹ của vị quân vương trẻ tuổi trở thành vợ mình, Ngài có thể biến ảnh hưởng ấy thành điều gì lớn lao hơn không?#!"
 
 # Ali
  challenge_character_ali_siracusa: "Sheikh Ali"
  challenge_character_ali_siracusa_desc: "Là một trong những kẻ kháng cự cuối cùng trước cuộc xâm lược Sicilia của người Norman, Ali đã lao mình xuống biển và chết đuối khi cố nhảy lên con tàu của kẻ thù.\n\n#bold Người Norman đã đến, nhưng họ chưa hoàn toàn chinh phục — Ngài có thể đảo ngược thế cờ và giành Sicilia cho riêng mình không?#!"
 
 # Eadgar
  challenge_character_eadgar_warwickshire: "Eadgar"
  challenge_character_eadgar_warwickshire_desc: "Sinh ra trong cảnh lưu vong, hậu duệ cuối cùng của nhà Wessex trở về Anh chỉ để chứng kiến quyền thừa kế của mình bị tiếm đoạt lần thứ hai bởi Harold Godwinson, rồi vĩnh viễn rơi vào tay kẻ chinh phục Norman.\n\n#bold Ánh lửa của nhà Wessex vẫn còn leo lét, nhưng chưa hề tắt hẳn. Ngài có thể phục hưng vận mệnh của dòng tộc này không?#!"
 
 # Ali
  challenge_character_ali_taizz: "Tiểu vương Ali"
  challenge_character_ali_taizz_desc: "Là con trai của một quan tòa, Ali khởi hành cùng một nhóm người theo chân ít ỏi và giành được cả một vương quốc, nhưng lại được ca ngợi nhiều hơn bởi trí tuệ của người vợ Asma, người mà ông giao phó việc điều hành đất nước.\n\n#bold Với một người Ngài đời xuất sắc bên cạnh, dường như không gì là không thể. Cùng nhau, cả Ả Rập nằm trong tầm tay Ngài!#!"
 
 # Pierre
  challenge_character_pierre_piedmonte: "Công tước Pierre"
  challenge_character_pierre_piedmonte_desc: "Nhà Savoie có được phần lớn lãnh thổ nhờ quyền thừa kế từ mẹ của Pierre — Adelaide xứ Turin — người có ảnh hưởng tối cao tại triều đình của con trai mình, gần như chắc chắn là vì lợi ích chung.\n\n#bold Ngài có thể bước ra khỏi cái bóng của người mẹ lừng danh và chứng tỏ mình là một quân chủ xứng đáng không?#!"
 
 # Anawrahta
  challenge_character_anawrahta_pagan: "Vua Anawrahta"
  challenge_character_anawrahta_pagan_desc: "Là người sáng lập Pagan, Anawrahta cai trị một cách thận trọng và thẳng tay đàn áp mọi mối đe dọa đối với vương quốc non trẻ, đồng thời sự bảo trợ của ông dành cho Phật giáo Theravada đã góp phần to lớn vào sự lan rộng của đức tin này.\n\n#bold Những người kế vị Anawrahta đều tài giỏi không kém tổ tiên, nhưng người Mông Cổ lại là một kẻ thù quá mạnh — Ngài có thể vượt qua cơn bão sắp tới không?#!"

 # 1178

 # Piarres
  challenge_character_piarres_albarracin:0 "Bá tước Piarres"
  challenge_character_piarres_albarracin_desc:0 "Từng là chư hầu của một lãnh chúa Hồi giáo, Piarres đã Cơ Đốc hóa lãnh địa của mình và tuyên bố độc lập, không thừa nhận bất kỳ chủ quân nào ngoài chính Thánh Maria.\n\n#bold Khi đã tự xem mình ngang hàng với các vị vua và khalip, liệu ngươi có thể biến lời tuyên bố ấy thành hiện thực và dựng nên một vương quốc mới sánh ngang mọi đế chế từng tồn tại?#!"

 # John
  challenge_character_john_ulster:0 "Bá tước John"
  challenge_character_john_ulster_desc:0 "Bằng lưỡi gươm trong tay và sự trợ giúp của một nhóm chiến hữu trung thành, John de Courcy đã làm chủ miền đông Ulster cho đến khi thất bại và bị giam cầm bởi một vị vua Anh nghi kỵ tham vọng của ông.\n\n#bold Liệu ngươi có thể hoàn thành điều John còn dang dở và khiến lá cờ Courcy tung bay trên toàn cõi Ireland?#!"

 # Rogier
  challenge_character_rogier_albi:0 "Bá tước Rogier"
  challenge_character_rogier_albi_desc:0 "Dù không công khai tiếp nhận giáo lý, nhà Trencavel nổi tiếng vì sự khoan dung gây tranh cãi và cảm tình dành cho các dị giáo Cathar lan rộng khắp lãnh địa của họ.\n\n#bold Liệu ngươi có thể che chở cho người Cathar khỏi sự đàn áp và bảo đảm đức tin của họ được hưng thịnh?#!"

 # Khusraw Malik
  challenge_character_khusraw_malik_punjab:0 "Sultan Khusraw Malik"
  challenge_character_khusraw_malik_punjab_desc:0 "Bị vây bủa bởi kẻ thù tứ phía, Khusraw Malik đã anh dũng chiến đấu để bảo vệ vương quốc tổ tiên, nhưng dòng dõi của ông sớm bị chấm dứt dưới tay đao phủ Ghurid.\n\n#bold Liệu ngươi có thể chiến đấu để giành lại thế thượng phong và tái hiện những cuộc chinh phạt của Mahmud xứ Ghazni?#!"

 # Kulin
  challenge_character_kulin_bosna:0 "Doux Kulin"
  challenge_character_kulin_bosna_desc:0 "Bị kẹp giữa tham vọng của Byzantine và Hungary tại vùng Balkan, Kulin đã khôn khéo lợi dụng xung đột giữa hai cường quốc để bảo toàn quyền tự chủ và mở rộng ảnh hưởng của mình.\n\n#bold Liệu ngươi có thể thoát khỏi ách bá quyền và mở ra một thời kỳ hoàng kim của hòa bình và phồn thịnh cho Bosnia?#!"

 # Nur al-Din Muhammed
  challenge_character_nur_al_din_muhammed_nizari:0 "Imam Muhammed"
  challenge_character_nur_al_din_muhammed_nizari_desc:0 "Từ những pháo đài hiểm trở giữa núi non Ba Tư, Muhammed đã cai trị lâu dài với tư cách imam cha truyền con nối của phái Nizari, được tín đồ công nhận là người gìn giữ hợp pháp duy nhất của đức tin nhờ dòng dõi từ Nizar.\n\n#bold Liệu ngươi có thể truyền bá giáo lý của mình và đạt được sự công nhận rộng khắp cho đức tin ấy?#!"

 # Algimantas
  challenge_character_algimantas_lithuanians:0 "Đại tù trưởng Algimantas"
  challenge_character_algimantas_lithuanians_desc:0 "Algimantas và hậu duệ của ông đã duy trì một tiểu quốc ngoại giáo lâu hơn bất kỳ dân tộc nào khác tại châu Âu, kiên cường chống lại việc cải sang Kitô giáo cho đến cuối thế kỷ XIV.\n\n#bold Khi người Kitô giáo khát khao cải đạo dân tộc ngươi, liệu ngươi có thể mở mắt họ trước chân lý của Vidilism?#!"

 # Sargis
  challenge_character_sargis_greater_armenia:0 "Công tước Sargis"
  challenge_character_sargis_greater_armenia_desc:0 "Là một chư hầu Armenia hùng mạnh của vua Georgia, lòng trung thành của Sargis đôi lúc đáng ngờ, nhưng ảnh hưởng và quyền lực của ông lớn đến mức không thể bị phớt lờ.\n\n#bold Liệu ngươi có thể tự lập để khôi phục Đại Armenia của những tổ tiên xa xưa?#!"

 # Aba
  challenge_character_aba_socotra: "Tiểu vương Aba"
  challenge_character_aba_socotra_desc: "Sự cô lập của Socotra đã giúp nơi đây duy trì đức tin Nestorian suốt nhiều thế kỷ, cư dân của đảo hiếm khi được chào đón vượt ra ngoài những bờ đá hiểm trở của mình.\n\n#bold Liệu ngươi có thể dẫn dắt dân tộc rời khỏi vị thế mong manh ấy để đạt tới vinh quang bất diệt nơi chân trời xa?#!"

 # Prithviraja
  challenge_character_prithviraja_rajputana: "Maharaja Prithviraja"
  challenge_character_prithviraja_rajputana_desc: "Prithviraja đã anh dũng chống lại nhiều cuộc xâm lăng của Ghurid, từng đánh bại quân thù trong ít nhất một trận đại chiến, nhưng cuối cùng lại chết trong cảnh tù đày.\n\n#bold Liệu ngươi có thể đẩy lùi mối họa Ghurid và bảo đảm tương lai cho triều đại Chauhan?#!"

 # Renaud
  challenge_character_renaud_kerak: "Bá tước Renaud"
  challenge_character_renaud_kerak_desc: "Là kẻ thù hung bạo và ngoan cố nhất của Salāh al-Dīn tại vương quốc Jerusalem, việc Renaud tấn công một đoàn hành hương Hồi giáo đã dẫn đến sự thất thủ của Jerusalem và chính bản thân ông bị Sultan Ai Cập xử tử.\n\n#bold Lịch sử ghi nhớ Renaud như một kẻ cướp bóc tham tàn – liệu ngươi có thể mang lại cho ông một di sản cao quý hơn?#!"

 # Henry
  challenge_character_henri_champagne: "Công tước Henri"
  challenge_character_henri_champagne_desc: "Được giáo dục theo nghệ thuật tự do, triều đại khai sáng của Henri đã mang lại sự thịnh vượng lớn cho thần dân, với các hội chợ trứ danh xứ Champagne thu hút thương nhân và hàng hóa quý giá từ khắp châu Âu.\n\n#bold Liệu ngươi có thể khiến Champagne trở thành biểu tượng của hòa bình và phồn vinh?#!"

 # Richard
  challenge_character_richard_poitiers: "Hoàng tử Richard"
  challenge_character_richard_poitiers_desc: "Sinh ra là con trai thứ ba, số phận đã đưa Richard lên ngai vàng nước Anh, và những chiến dịch tại Thánh Địa đã mang lại cho ông vinh quang vĩnh cửu với danh xưng #italic Richard Trái Tim Sư Tử#!.\n\n#bold Dẫu lẫy lừng danh tiếng, các chiến thắng của Richard đem lại ít thành quả lâu dài. Liệu ngươi có thể tận dụng cơ hội thứ hai để giành lấy một chiến công xứng đáng với tên tuổi ấy?#!"

 # Maghan
  challenge_character_maghan_sibi: "Maghan Kon Fatta"
  challenge_character_maghan_sibi_desc: "Truyền thuyết kể rằng một thợ săn từng tiên tri: nếu Maghan cưới một người phụ nữ xấu xí, con trai họ sẽ trở thành một vị vua vĩ đại. Dù thực hư ra sao, con trai ông là Sunjata quả thực đã sáng lập đế quốc Mali.\n\n#bold Liệu ngươi có thể biến lời tiên tri khiêm nhường của người thợ săn thành hiện thực và dựng nên một đế chế mới?#!"

 # Mohammed
  challenge_character_mohammed_azerbaijan: "Jahan Pahlavan Mohammed"
  challenge_character_mohammed_azerbaijan_desc: "Là người dựng vua cho vị sultan Seljuk cuối cùng, Mohammed trên thực tế cai trị cả đế quốc dù không mang danh xưng, nhưng hậu duệ của ông không thể chống đỡ trước bước tiến của Khwarazmshah.\n\n#bold Ngươi đang nắm chặt chính vị sultan trong tay – hãy tận dụng hắn, và toàn cõi Ba Tư sẽ khuất phục trước ý chí của ngươi!#!"

 # Heinrich
  challenge_character_heinrich_angria: "Heinrich Sư Tử"
  challenge_character_heinrich_angria_desc: "Là kình địch cay đắng của Hoàng đế La Mã Thần thánh, Heinrich từng là lãnh chúa quyền lực nhất đế quốc, nhưng sự thù địch với hoàng quyền cuối cùng đã dẫn đến thất bại của ông.\n\n#bold Liệu ngươi có thể thành công nơi Heinrich lịch sử đã thất bại và giành chiến thắng trước kẻ thù Hohenstaufen?#!"
