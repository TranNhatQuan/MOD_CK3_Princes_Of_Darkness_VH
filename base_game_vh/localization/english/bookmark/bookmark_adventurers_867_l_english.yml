l_english:
  bm_867_adventurers:0 "Những Nhà Phiêu Lưu Vĩ Đại"
  bm_867_adventurers_desc:0 "Mọi dòng tộc đều khởi nguồn từ những ngày tháng hèn mọn. Con đường vươn lên nắm quyền lực thường là một quá trình chậm rãi, qua từng thế hệ, mỗi thế hệ chỉ tiến thêm vài bậc trên nấc thang địa vị, nhờ những cuộc hôn nhân được tính toán kỹ lưỡng và các cuộc chiến không hồi kết.\n\n#bold Nhưng đây là thời đại của những biến động và đảo lộn lớn lao. Với đủ dũng khí, và có lẽ thêm một chút vận may, một anh hùng có thể nâng tên tuổi gia tộc mình từ chốn vô danh thành huyền thoại. Ngài đã sẵn sàng đón nhận thử thách chưa?#!"


 #Jarl Haesteinn
  bookmark_adventurers_jarl_haesteinn:0 "Jarl Hæsteinn"
  bookmark_adventurers_jarl_haesteinn_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_adventurers_jarl_haesteinn_desc:0 "Bằng mưu trí và lòng dũng cảm, Jarl Hæsteinn đã trở thành một kẻ giàu có. Sau khi dẫn đầu một cuộc cướp bóc béo bở xuyên suốt Địa Trung Hải cùng Björn Ironside, Hæsteinn đã định cư tại Brittany. Người Frank có những kho báu sẵn sàng để bị vét sạch, và một chiến binh Viking hùng mạnh là đồng minh tuyệt vời trong thời kỳ chính trị hỗn loạn.\n\n#bold Tuy nhiên, vận may không đến mà không có kẻ thù. Liệu lòng tham của Hæsteinn sẽ lấn át ông, hay triều đại của ông sẽ hưng thịnh dưới sự dẫn dắt của Ngài?#!"

  bookmark_adventurers_jarl_haesteinn_alt_ragnarr:0 "$Ragnarr$"
  bookmark_adventurers_jarl_haesteinn_alt_ragnarr_desc:0 "mô tả thay thế"

 #Rurik Rurikid
  bookmark_adventurers_rurik_rurikid:0 "Rurik Rurikid"
  bookmark_adventurers_rurik_rurikid_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_adventurers_rurik_rurikid_desc:0 "Ít ai có thể vươn lên từ tay trắng đến vĩ đại như Rurik dũng cảm! Cùng với các anh em của mình, ông đã lập lại trật tự cho miền hoang dã phương Đông, và kể từ khi họ qua đời, ông trở thành người cai trị duy nhất của một Đại Tù trưởng quốc rộng lớn. Tuy nhiên, đây mới chỉ là khởi đầu.\n\n#bold Một ngày nào đó, hậu duệ của Rurik sẽ lập nên Sa quốc Nga. Hay liệu điều đó có xảy ra không? Vận mệnh của dòng tộc vĩ đại này nằm trong tay Ngài.#!"

  bookmark_adventurers_rurik_rurikid_alt_helgi:0 "$Helgi$ $nick_the_seer$"

 #Eudes Capet
  bookmark_adventurers_count_eudes:0 "Bá tước Eudes"
  bookmark_adventurers_count_eudes_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_adventurers_count_eudes_desc:0 "Vào tháng 7 năm 866, kẻ cướp bóc Viking Hæsteinn đã giết cha của Eudes là Robert Mạnh mẽ. Chỉ vài tháng sau, mẹ ông là Adelais qua đời khi sinh em trai Robert. Thế giới thật tàn nhẫn và tương lai có vẻ bất định, nhưng những cậu bé mồ côi này được định sẵn sẽ ngồi trên ngai vàng nước Pháp. Hậu duệ của họ, nhà Capet, sẽ cai trị nước Pháp suốt nhiều thế kỷ.\n\n#bold Ngài có thể xoay xở trong nền chính trị hiểm độc của nước Pháp thời trung cổ và hoàn thành số mệnh của anh em nhà Robertine không?#!"

  bookmark_adventurers_count_eudes_alt_robert:0 "$Robert$"
  bookmark_adventurers_count_eudes_alt_robert_desc:0 "mô tả thay thế"
  bookmark_adventurers_count_eudes_alt_uncle_eudes:0 "$Eudes$"
  bookmark_adventurers_count_eudes_alt_uncle_eudes_desc:0 "mô tả thay thế"

 #Almos Arpad 
  bookmark_adventurers_almos_arpad:0 "Álmos Árpád"
  bookmark_adventurers_almos_arpad_subheading: "$BOOKMARK_SUBHEADING_KHAN_WITH_THE$"
  bookmark_adventurers_almos_arpad_desc:0 "Khi bảy bộ tộc Hungary hợp nhất để bầu ra một thủ lĩnh tối cao, sự lựa chọn của họ đã rơi vào Álmos dũng cảm. Một ngày nào đó, con trai ông là Árpád sẽ tiếp nhận trọng trách — nhưng chỉ khi người Hungary có thể giữ vững nền độc lập. Hiểm họa đang rình rập nơi chân trời phía Đông.\n\n#bold Ngài có thể bảo vệ người Hungary và dẫn dắt họ đến vinh quang không? Đây là cơ hội để Ngài kể lại những cuộc phiêu lưu của triều đại Árpád!#!"

 #Daurama Daura
  bookmark_adventurers_daurama_daura:0 "Daurama Daura"
  bookmark_adventurers_daurama_daura_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_adventurers_daurama_daura_desc:0 "Là Magajiya cuối cùng của Daura, Daurama là biểu tượng cho những phong tục cổ xưa của người Hausa. Người chồng mới của bà, Bayajiddah (nguyên quán từ Iraq), đại diện cho sự đổi thay, khi ngày càng nhiều người ngoại lai đổ về Hausaland, mang theo những đức tin và nền văn hóa xa lạ...\n\n#bold Daurama được định sẵn sẽ đi vào lịch sử với tư cách là Magajiya cuối cùng — nhưng liệu điều đó có bắt buộc phải xảy ra không?#!"

  bookmark_adventurers_daurama_daura_alt_bawo:0 "$Bawo$"

  bookmark_adventurers_almos_arpad_alt_son_arpad:0 "$A_rpA_d$"
  bookmark_adventurers_almos_arpad_alt_linutika:0 "$LinU_tika$"

 #EVENTS
  bookmark.0101.t:0 "Tên gọi có ý nghĩa gì?"
  bookmark.0101.desc_intro:0 "Qua nhiều thế hệ, [hausaland.GetNameNoTier] đã được cai trị bởi Magajiya, một dòng các nữ vương theo chế độ mẫu hệ, và ta là người kế vị mới nhất.\n\nNhững truyền thống ấy đã phục vụ chúng ta rất tốt, nhưng thế giới đang thay đổi. Những chiến công anh hùng của người [ROOT.Char.Custom2('RelationToMeShort', bayajidda)] của ta, [bayajidda.GetFirstName], đã mang về cho ông sự giàu có và danh tiếng lớn lao... tuy nhiên, vì [bayajidda.GetSheHe] đến từ những vùng đất xa xôi, những thành tựu của [bayajidda.GetHerHis] cũng báo hiệu sự đổi thay to lớn cho dân tộc ta.\n\n"
  bookmark.0101.desc_living:1 "Con trai ta, [bewo.GetTitledFirstName], là báu vật trong mắt cha nó. Dù chỉ là một hài nhi, ta tự hỏi liệu nó sẽ đồng cảm nhiều hơn với người cha phiêu lưu của mình, hay với di sản truyền thống của ta?"
  bookmark.0101.desc_dead:1 "Con trai ta, [bewo.GetTitledFirstName], từng là báu vật trong mắt cha nó. Dù chỉ là một hài nhi, ta tự hỏi liệu nó sẽ đồng cảm nhiều hơn với huyền thoại về người cha phiêu lưu của mình, hay với di sản truyền thống của ta?"
  bookmark.0101.a:1 "[bewo.GetFirstNameNoTooltip] phải mang theo truyền thống của người [ROOT.Char.GetCulture.GetNameNoTooltip] bước vào một thời đại mới."
  bookmark.0101.a.tt:1 "[bewo.GetUIName] sẽ trở thành [player_heir|E] của Ngài"
  bookmark.0101.b:1 "Con trai ta vẫn là con trai ta, bất kể tên gọi hay văn hóa."
  bookmark.0101.b.tt:1 "#warning @warning_icon! Lựa chọn này có thể khiến Ngài không còn [player_heir|E]!#!"
  bookmark.0101.c:0 "Magajiya không cần đàn ông để tiếp nối di sản!"
  bookmark.0101.c.tt:1 "Em gái Ngài, [shawata.GetUIName], sẽ tiếp tục là [player_heir|E] của Ngài"

 # Credit to Stu Taylor of Dead Good Comics for the title line and entire lead-in to this event.
  bookmark.0211.t: "Tưởng niệm Gu Thẩm Mỹ Tinh Tường"
 # Historically, both of Michael's hands were severed — we don't have a portrait modifier for that, I'm afraid, so we pretend it was just the one.
  bookmark.0211.desc: "[michael.GetFirstNamePossessive] nằm co quắp trên sàn trước mặt ta, dòng máu đầu tiên chảy ra từ phần chi bị chặt đứt của hắn giờ đã chậm lại, chỉ còn nhỏ giọt yếu ớt. Một buổi tối tốt đẹp, dù chúng ta đã [Glossary( 'struck earlier than intended', 'BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS' )].\n\nVị hoàng đế #EMP lão thành#!. Hừ, một kẻ ngây thơ ngu ngốc, không có tài năng cũng chẳng có bản lĩnh trong chính trường. Được ban cho mọi lợi thế mà Thượng Đế có thể trao cho một con người, vậy mà hắn vẫn đánh mất tất cả vào tay một kẻ vô danh đến từ các tỉnh lẻ.\n\nNhưng ta giờ đây không còn chỉ là một kẻ tỉnh lẻ nữa. Từ đêm nay, ta là #EMP hoàng đế#!, [basil.GetTitledFirstName], vị hoàng đế đầu tiên của triều đại chắc chắn sẽ vinh quang mang tên [basil.GetDynasty.GetName].\n\nUống cạn phần rượu cuối cùng trong chiếc ly của mình — một trong những loại rượu yêu thích của [michael.GetFirstNamePossessiveNoTooltip] — ta suy ngẫm xem lịch sử sẽ nhớ đến người thanh niên này như thế nào. Và ta sẽ #EMP cho phép#! lịch sử nhớ đến hắn ra sao."
  bookmark.0211.a: "Hắn chết trong men say, và sẽ mãi bị nhớ đến như một kẻ say!"
  bookmark.0211.a.flavour: "Ngài và hậu duệ của mình sẽ bôi nhọ [michael.GetFirstNameNoTooltip] suốt nhiều thập kỷ sau khi hắn chết, khắc họa hắn thành một kẻ nghiện rượu và trụy lạc."
  bookmark.0211.b: "Tên ngốc đó đã cho ta gia tộc, ngai vàng và cả mạng sống. Thế là đủ."
  bookmark.0211.b.flavour: "Ngài cho phép danh tiếng của [michael.GetFirstNamePossessiveNoTooltip] được phục hồi, coi việc mẹ hắn khôi phục thực hành tôn kính thánh tượng trong thời kỳ nhiếp chính như một công trạng gần với thánh thiện."
  bookmark.0211.c: "Quả thật đây là một niên vụ rượu tuyệt hảo..."
  bookmark.0211.c.flavour: "Ngài để ký ức về [michael.GetFirstNamePossessiveNoTooltip] phai nhạt theo tự nhiên — phần lớn là vậy."
  BOOKMARK_0211_MICHAEL_III_DEATH_GLOSS: "Trong lịch sử, Michael III bị ám sát vào ngày 24 tháng 9 năm 867, chứ không phải ngày 31 tháng 12 năm 866. Ngày mất của ông được đẩy sớm hơn trong Crusader Kings 3 vì lý do gameplay."

