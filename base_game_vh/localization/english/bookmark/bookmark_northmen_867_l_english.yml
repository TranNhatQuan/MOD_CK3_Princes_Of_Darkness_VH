l_english:
  bm_867_northmen:0 "Cơn Thịnh Nộ của Người Phương Bắc"
  bm_867_northmen_desc:1 "Hai năm trước, Vua Ælla của Northumbria đã ném vị anh hùng Viking lừng danh Ragnarr Loðbrók vào hố rắn để chết. Khi hay tin, các con trai của Ragnarr lập tức dong buồm đến Anh để báo thù cho phụ thân.\n\nKể từ đó, huynh đệ họ đã thiết lập được chỗ đứng vững chắc tại York và Quần Đảo. Các vị vua Anglo-Saxon liên tiếp thất bại — tương lai của họ quả thật u ám.\n\nNhưng hy vọng vẫn chưa hoàn toàn tắt, và một anh hùng vĩ đại vẫn có thể xoay chuyển dòng chảy lịch sử.\n\n#bold Ngươi sẽ đặt toàn cõi Anh dưới ách thống trị của người Norse, hay quét sạch Đại Quân Ngoại Đạo khỏi đất Anglo-Saxon?#!"

 #Halfdan Whiteshirt
  bookmark_northmen_halfdan_whiteshirt:0 "Halfdan Áo Trắng"
  bookmark_northmen_halfdan_whiteshirt_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_northmen_halfdan_whiteshirt_desc:0 "Làn sóng xâm lược đầu tiên đã diễn ra vô cùng thuận lợi với Halfdan Áo Trắng. Với sự trợ giúp của huynh đệ Ivar, hắn đã giành lại quyền kiểm soát York từ tay Vua Ælla. Và hắn sẽ còn đoạt lấy nhiều hơn thế nữa.\n\n#bold Ngươi sẽ bước theo con đường lịch sử, thực hiện cuộc báo thù đẫm máu, hay mở ra một con đường mới cho Halfdan?#!"

  bookmark_northmen_halfdan_whiteshirt_alt_gudfrid:0 "$GuT_friT_$"
  bookmark_northmen_halfdan_whiteshirt_alt_saga:0 "$Saga$ $nick_the_truthspeaker$"

 #Ivar the Boneless
  bookmark_northmen_ivar_the_boneless:0 "Ivar Không Xương"
  bookmark_northmen_ivar_the_boneless_subheading: "$BOOKMARK_SUBHEADING_DEFAULT_WITH_THE$"
  bookmark_northmen_ivar_the_boneless_desc:0 "Lời đồn nói rằng Ivar yếu đuối về thể xác, nhưng không ai có thể bảo hắn yếu kém về trí tuệ. Bằng mưu lược và sự tự tin, hắn đã quy tụ vô số chiến binh Norse dưới lá cờ của mình, và giành được những chiến thắng lẫy lừng trên vùng đất xa lạ này. Nhưng ngay cả chiến binh vĩ đại nhất cũng không thể lừa dối tử thần. Vào năm 870, Ivar sẽ biến mất khỏi lịch sử...\n\n#bold Ngươi có thể giành chiến thắng trong những cuộc chiến của Ivar, và giữ hắn sống đủ lâu để cai trị thêm nhiều năm nữa không?#!"

  bookmark_northmen_ivar_the_boneless_alt_barid:0 "$Barid$"
  bookmark_northmen_ivar_the_boneless_alt_barid_desc:0 "alt desc"
  bookmark_northmen_ivar_the_boneless_alt_sigfroth:0 "$SigfroT_$"
  bookmark_northmen_ivar_the_boneless_alt_sigfroth_desc:0 "alt desc"


 #Sigurdr Snake-in-the-eye
  bookmark_northmen_sigurdr_snake_in_the_eye:0 "Sigurdr Mắt Rắn"
  bookmark_northmen_sigurdr_snake_in_the_eye_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_northmen_sigurdr_snake_in_the_eye_desc:1 "Khi các huynh đệ của hắn dong buồm sang Anh để báo thù, Sigurdr Mắt Rắn ở lại cai trị lãnh địa của phụ thân quá cố. Ragnarr Loðbrók đã để lại cho hắn một di sản vô cùng to lớn.\n\n#bold Hậu duệ của Sigurd sẽ trở thành Vua của Đan Mạch, Na Uy và Anh suốt hơn một thế kỷ. Ngươi có thể hoàn thành vận mệnh của dòng tộc này không?#!"

  bookmark_northmen_sigurdr_snake_in_the_eye_alt_knud:0 "$Knud$"
  bookmark_northmen_sigurdr_snake_in_the_eye_alt_knud_desc:0 "alt desc"
  bookmark_northmen_sigurdr_snake_in_the_eye_alt_alof:0 "$Alof$"
  bookmark_northmen_sigurdr_snake_in_the_eye_alt_alof_desc:0 "alt desc"

 # Björn Ironside
  bookmark_northmen_bjorn_ironside:0 "Björn Sườn Sắt"
  bookmark_northmen_bjorn_ironside_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_northmen_bjorn_ironside_desc:0 "Björn đã sống một đời phiêu lưu đúng nghĩa của người Norse. Là một kẻ cướp bóc đáng sợ, hắn đã càn quét khắp Pháp, Iberia và Ý, cùng với bằng hữu Hæsteinn của Nantes. Nay, lực lượng Scandinavia lại một lần nữa tập hợp để tấn công bờ biển Anh.\n\n#bold Dẫu Björn được định mệnh báo thù cho phụ thân tại Anh, hậu duệ của hắn sẽ cai trị Thụy Điển trong hai thế kỷ tới. Định mệnh của ngươi nằm ở bờ nào của Biển Bắc?#!"

  bookmark_northmen_bjorn_ironside_alt_ingrid:0 "$Ingrid$"
  bookmark_northmen_bjorn_ironside_alt_ingrid_desc:0 "alt desc"
  bookmark_northmen_bjorn_ironside_alt_eirikr:0 "$Eirikr$"
  bookmark_northmen_bjorn_ironside_alt_eirikr_desc:0 "alt desc"

 #Earl Alfred (the great)
  bookmark_northmen_earl_alfred:0 "Bá Tước Alfred"
  bookmark_northmen_earl_alfred_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_northmen_earl_alfred_desc:0 "Khi người Viking tiến sâu hơn về phía nam, Bá tước Alfred của Dorset đang chuẩn bị quân đội.\n\nTrong những năm tới, Alfred sẽ chiến đấu trong vô số trận chiến chống lại người Norse và chấm dứt cuộc xâm lược. Khi thừa kế ngai vàng của huynh trưởng, ngài sẽ trở thành một trong những vị vua vĩ đại nhất trong lịch sử Anh.\n\n#bold Ngươi sẽ hoàn thành vận mệnh vĩ đại của Alfred, hay bị Đại Quân Ngoại Đạo nghiền nát?#!"

  bookmark_northmen_earl_alfred_alt_aethelred:0 "$E_thelred$"
  bookmark_northmen_earl_alfred_alt_aethelred_desc:0 "alt desc"

 ##EVENTS##
  bookmark.0002.t:0 "Vĩ Đại"
  bookmark.0002.desc:0 "Lần đầu tiên một chư hầu tung hô ta với lời "Vạn tuế [ROOT.Char.GetFirstNameNoTooltip] Vĩ Đại!", ta vô cùng vinh dự. Ta không nghĩ gì thêm, nhưng kể từ ngày đó, danh xưng ấy ngày càng lan rộng.\n\nDù ta đi đến đâu, từ [capital.GetNameNoTooltip] đến [province.GetNameNoTooltip], thần dân đều gọi ta là [ROOT.Char.GetFirstNameNoTooltip] Vĩ Đại."
  bookmark.0002.a:0 "Ta cầu mong mình sẽ không khiến họ thất vọng."

  bookmark.0004.t:1 "Báo Thù"
  bookmark.0004.desc_unknown:1 "Khi [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] được đưa đến trước mặt ta, [prisoner.GetSheHe] lập tức quỳ rạp xuống và cầu xin sự tha thứ của ta vì đã #EMP giết [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))] của ta#!?!\n\n\"Ta... ta tưởng ngài đã biết rồi! Hãy quên những gì ta vừa nói đi,\" [prisoner.GetSheHe] cười một cách lo lắng. \"Rõ ràng ta hẳn đã bị va đập vào đầu khi bị bắt. Hoặc gì đó tương tự. Ta không biết mình đang nói gì nữa!\"\n\nKhi ta nghe tin về cái chết của [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))] [dead.GetNamePossessive] của ta, ta đã thề rằng mình sẽ trả thù. Và ta là một [ROOT.Char.GetWomanMan] giữ lời."
  bookmark.0004.desc:1 "Cuối cùng, sau ngần ấy thời gian, ta đã có [prisoner.Custom2('InsultAdjective', ROOT.Char)] [prisoner.GetName] trong tay mình! Khi ta nghe tin [prisoner.GetHerHis] đã giết [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('dead'))] [dead.GetNamePossessive] của ta, ta đã thề rằng mình sẽ trả thù. Và ta là một [ROOT.Char.GetWomanMan] giữ lời."
  bookmark.0004.a.custom:0 "Mọi [close_family_member|E] của [dead.GetShortUIName]"
  bookmark.0004.a:0 "Ta sẽ xé lồng ngực hắn thành đôi cánh máu!"
  bookmark.0004.b:0 "Kẻ [prisoner.GetWomanMan] này thuộc về ngài, hỡi [ROOT.Char.GetFaith.HighGodName] vĩ đại!"
  bookmark.0004.c:0 "Ta có những kế hoạch khác dành cho [prisoner.GetHerHim]..."
