l_english: 

 bm_1178_swords_of_faith: "Những Thanh Gươm Đức Tin"
 bm_1178_swords_of_faith_desc: "Được thúc đẩy bởi lòng nhiệt thành tôn giáo và lời hứa về phần thưởng cả thiêng liêng lẫn trần thế, từ vương công đến thứ dân đều tiến về phương Đông nhân danh Thượng Đế, vàng bạc và vinh quang vĩnh cửu.\n\nCuộc thánh chiến của họ đã mang lại Vương quốc Jerusalem, và giờ đây, gần một thế kỷ sau, hậu duệ của họ phải chật vật duy trì di sản Thập Tự Quân trước những thế lực Hồi giáo hùng mạnh như Salah ad-Din Yusuf, vị Sultan mới của Ai Cập.\n\n#bold Đây là thời đại Thập Tự Chinh, nơi giao thoa giữa cuồng tín tôn giáo và tham vọng trần thế. Hãy chọn con đường của ngươi một cách khôn ngoan, bởi còn phần thưởng nào lớn hơn chính Thánh Địa?#!"

 bookmark_swords_of_faith_saladin: "Salāh al-Dīn Yusuf"
 bookmark_swords_of_faith_saladin_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_saladin_saphadin: "Sayf al-Dīn Ahmad"
 bookmark_swords_of_faith_saladin_ali: "Ali"
 bookmark_swords_of_faith_saladin_desc: "Vị tể tướng cuối cùng của triều Fatimid cho đến nay đã chứng tỏ mình là một người kế vị đầy năng lực và nhiệt huyết đối với triều đại mà ngài đã lật đổ, bất chấp thất bại gần đây trước vị Vua Jerusalem trẻ tuổi mắc bệnh phong.\n\nDù được Caliph Abbasid chính thức sắc phong làm Sultan của Ai Cập và Syria, chừng nào hậu duệ Thập Tự Quân vẫn ngoan cố giữ lấy những vùng đất tổ tiên họ chiếm được, vương quốc của ngài sẽ không bao giờ thực sự trọn vẹn.\n\n#bold Liệu nhà Ayyubid có thể đánh bại Vương quốc Jerusalem để giành lại Thánh Địa, hay triều đại mới này sẽ sụp đổ nhanh chóng như cách nó trỗi dậy?#!"

 bookmark_swords_of_faith_sibylla: "Công Chúa Sibylla"
 bookmark_swords_of_faith_sibylla_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_sibylla_baudouin: "Vua Baudouin của Jerusalem"
 bookmark_swords_of_faith_sibylla_baudouin_son: "Baudouin"
 bookmark_swords_of_faith_sibylla_desc: "Jerusalem đã từng có một nữ vương trong lịch sử ngắn ngủi của nó, và dường như sắp sửa có thêm một người nữa. Huynh trưởng của Sibylla, Vua Baudouin, đã cai trị đầy năng lực dù mang bệnh phong, nhưng cái chết của ngài chỉ còn là vấn đề thời gian.\n\nLà một góa phụ trẻ và người thừa kế được công nhận của huynh trưởng, bàn tay của Sibylla được nhiều kẻ khao khát, và một liên minh vững mạnh sẽ giúp củng cố vị thế của nàng.\n\n#bold Jerusalem đang ở thế nguy nan và vị vua của nó không còn sống được bao lâu. Ngươi có thể bước lên ngai vàng và đảm bảo nó không chỉ tồn tại mà còn hưng thịnh?#!"

 bookmark_swords_of_faith_levon: "Bá Tước Levon"
 bookmark_swords_of_faith_levon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_levon_roupen: "Thân Vương Roupen của Cilicia"
 bookmark_swords_of_faith_levon_desc: "Hai lần tử thần đã giáng xuống gia tộc Levon: lần đầu cướp đi phụ thân ngài, nạn nhân của âm mưu Byzantine, và lần thứ hai lấy đi thúc phụ ngài, một kẻ bạo ngược phản đạo bị chính cận thần sát hại vì sợ sẽ trở thành nạn nhân tiếp theo.\n\nGiờ đây huynh trưởng Roupen của Levon cai trị Cilicia, một người có tâm hồn thánh thiện giữa ổ rắn mưu mô và tham vọng, và có lẽ chỉ còn là vấn đề thời gian trước khi tử thần giáng xuống lần thứ ba.\n\n#bold Ngươi có thể vượt qua di sản tranh đấu của gia tộc và biến Cilicia thành một vương quốc thực sự?#!"

 bookmark_swords_of_faith_gokbori: "Muzaffar al-Dīn Gökböri"
 bookmark_swords_of_faith_gokbori_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_gokbori_ghazi: "Sayf al-Dīn Ghazi"
 bookmark_swords_of_faith_gokbori_yusuf: "Zayn al-Dīn Yusuf"
 bookmark_swords_of_faith_gokbori_desc: "Bị tước đoạt quyền thừa kế và lưu đày để nhường chỗ cho một người đệ đệ, Gökböri đã dâng thanh kiếm và lòng dũng cảm của mình cho một thân vương nhà Zengid và giành được một lãnh địa mới tại Harran.\n\nNgài luôn trung thành phục vụ chúa tể mới, nhưng vị thân vương ấy đang lâm bệnh nặng khó qua khỏi, và Gökböri hiểu rõ rằng lòng trung thành cũng có giới hạn, và tương lai bất định thường mở ra cơ hội.\n\n#bold Sultan Ai Cập đã chứng minh một kẻ có ý chí và tài năng có thể vươn xa đến đâu: ngươi có thể bước theo con đường ấy và sáng lập triều đại của riêng mình?#!"

 bookmark_swords_of_faith_raimon: "Công Tước Raimon"
 bookmark_swords_of_faith_raimon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_swords_of_faith_raimon_eschiva: "Eschiva"
 bookmark_swords_of_faith_raimon_desc: "Mất phụ thân từ thuở nhỏ vì thích khách Nizari, Raimon đã chiến đấu chống lại các toán cướp Turkmen từ năm mười bảy tuổi, thuê hải tặc tàn phá bờ biển Byzantine, và chịu đựng gần một thập kỷ bị giam cầm trong ngục Zengid.\n\nKhi được trả tự do, ngài là lựa chọn tự nhiên làm nhiếp chính cho vị vua thiếu niên Baudouin, nhưng giờ đây vị vua trẻ mắc bệnh phong ấy đã trưởng thành và Raimon trở về lãnh địa của mình để suy ngẫm về tương lai vương quốc cũng như chính bản thân.\n\n#bold Ngươi đã từng nắm giữ rồi từ bỏ quyền lực của một vị vua, và vẫn là trụ cột của vương quốc. Ngươi sẽ làm gì với ảnh hưởng của mình?#!"

 #EVENTS
 bookmark.0300.t: "Đứa Con Của Phụ Thân?"
 bookmark.0300.desc: "Phu quân quá cố của ta, [dead_husband.GetFirstName], đã qua đời vài tháng trước khi con trai chúng ta chào đời. Đứa trẻ này sẽ không bao giờ biết đến phụ thân, và khoảng cách giữa nó với gia tộc bên nội cũng không hề nhỏ.\n\nDẫu phụ thân nó có thể hào hiệp và dũng cảm, cuộc hôn nhân của chúng ta #italic vốn#! ngắn ngủi và danh tiếng của ngài chẳng mấy giá trị tại nơi này...\n\nNếu [baby_baudouin.GetFirstName] một ngày kia đội vương miện, thì sẽ có lợi hơn nếu ta để ký ức về phụ thân nó phai nhạt và nuôi dạy nó theo truyền thống hoàng tộc của chính dòng dõi ta."
 bookmark.0300.a: "Ta sẽ nuôi dạy [baby_baudouin.GetFirstNameNoTooltip] coi mình trước hết là người của [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bookmark.0300.b: "Không, chúng ta phải tôn vinh ký ức của [dead_husband.GetFirstNamePossessiveNoTooltip]."
 bookmark.0300.b.tt: "#warning @warning_icon! Lựa chọn này sẽ khiến [player_heir|E] của ngươi không thuộc cùng triều đại!#!"
