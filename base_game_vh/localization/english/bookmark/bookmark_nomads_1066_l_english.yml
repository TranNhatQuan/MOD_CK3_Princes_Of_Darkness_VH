l_english: 
  bm_1066_nomads: "Trước Cổng Thành"
  bm_1066_nomads_desc: "Từ thuở xa xưa, các dân tộc đã di cư khắp thảo nguyên, theo lối sống du mục qua vô số thế hệ. Nay, thế giới bên ngoài đang dần lấn chiếm quê hương của họ. Những đế chế định cư không ngừng mở rộng biên cương qua từng năm.\n\n#bold Liệu làn sóng định cư có thể bị đẩy lùi? Hay lối sống du mục phải bị từ bỏ? Trong các thị trấn và nông trang, dân thảo nguyên có thể tìm thấy cuộc đời mới... nhưng nếu một thời đại chinh phục vĩ đại trỗi dậy, lối sống xưa kia vẫn có thể được gìn giữ!#!"

  bookmark_nomads_cumans: "Khan Saru của Cumania"
  bookmark_nomads_cumans_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
  bookmark_nomads_cumans_desc: "Vừa vững trên yên ngựa, Saru nay chỉ huy những đoàn kỵ binh hùng hậu của Cumania. Nơi biên cương là những tiểu quốc trù phú, sẵn sàng bị chinh phục, nhưng liệu Saru có đủ tài năng để giữ cho bộ lạc đoàn kết trong những cuộc viễn chinh mới?\n\nCumania có thể rộng lớn, nhưng con dân của nó cũng có thể trở thành gánh nặng chẳng kém gì lợi thế — sau mỗi cái miệng cần nuôi là một cái tôi cũng khát khao không kém.\n\n#bold Ngươi có thể vừa đè bẹp láng giềng vừa giữ vững địa vị khi cưỡi ngựa dẫn đầu đoàn quân Cuman hay không?#!"

  bookmark_nomads_keraits: "Đại Thủ Lĩnh Inanch"
  bookmark_nomads_keraits_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
  bookmark_nomads_keraits_margus: "Margus"
  bookmark_nomads_keraits_hongji: "Khagan Hongji"
  bookmark_nomads_keraits_desc: "Bị trục xuất khỏi Trung Hoa theo sắc lệnh của Hoàng đế Wuzong hai thế kỷ trước, các nhà truyền giáo Nestorian đã tìm thấy những người tiếp nhận nơi tộc Keraits. Được thúc đẩy bởi tham vọng và đức tin, thủ lĩnh Inanch nay tìm cách quy tụ các dân tộc thảo nguyên dưới lá cờ của mình — một lá cờ mang thánh giá.\n\n#bold Hãy thống nhất các bộ tộc phương Đông, và truyền bá đức tin Nestorian khắp thảo nguyên!#!"

  bookmark_nomads_late_kirghiz: "Kokotoy của người Kirghiz"
  bookmark_nomads_late_kirghiz_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
  bookmark_nomads_late_kirghiz_desc: "Chỉ cần nhắc đến người Kirghiz cũng từng khiến mọi kẻ sống trên thảo nguyên phương Bắc phải rùng mình. Những ngày ấy đã qua từ lâu — đế chế của họ tan vỡ, và chỉ còn một tàn dư mong manh của Hãn quốc Kirghiz bám trụ nơi phương Bắc.\n\n#bold Liệu những tàn lửa cuối cùng của vinh quang Kirghiz sẽ bị dập tắt, hay có thể bùng cháy rực rỡ hơn cả Mặt Trời một lần nữa?#!"

  bookmark_nomads_eastern_karakhanids: "Muhmud của người Karluk"
  bookmark_nomads_eastern_karakhanids_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
  bookmark_nomads_eastern_karakhanids_desc: "Đại quân Karakhanid — những #italic Hắc Hãn#! — của Transoxiana từng kiểm soát Con đường Tơ lụa, nhưng thời hoàng kim ấy đã lùi xa. Bị chia cắt giữa hai dòng tộc Ali và Hasan, hai nửa đế quốc nay tranh đấu quyền bá chủ.\n\nỞ phương Đông, người Alid đã từ bỏ di sản du mục, trong khi Hasanid ở phương Tây vẫn trung thành với cội nguồn thảo nguyên.\n\n#bold Karakhanid đã bị chia rẽ — tương lai của Hãn quốc sẽ nằm trên yên ngựa hay trong cung điện xa hoa?#!"

  bookmark_nomads_pechenegs: "Tatus của người Pecheneg"
  bookmark_nomads_pechenegs_subheading: "$BOOKMARK_SUBHEADING_KHAN$"
  bookmark_nomads_pechenegs_desc: "Người Pecheneg du mục bị bao quanh bởi các dân tộc định cư: phía nam, chính trường Byzantine đầy chia rẽ mở ra cơ hội cho cả kẻ cướp lẫn lính đánh thuê. Người Magyar nay đã định cư tại Pannonia phía tây — nhưng trước họ cũng đã có kẻ khác, rồi lại bị những kẻ xâm lược tiếp theo nuốt chửng. Và phía bắc, các thân vương Rus' không ngừng tranh chấp trong những mối thù vặt.\n\n#bold Hãy dẫn dắt người Pecheneg bước vào một thời đại mới, phát triển và chuyển mình để đạt tới bất kỳ định mệnh nào đang chờ đợi họ!#!"
