l_english:
  bm_1066_rags_to_riches:0 "Từ Tay Trắng Đến Vinh Hoa"
  bm_1066_rags_to_riches_desc:1 "#V #font:TitleFont #size:20 @legends_of_ck_icon! Huyền Thoại Crusader Kings III#!#!#!\n\nKhắp châu Âu, các gia tộc tranh đấu và mưu tính quyền lực. Nhiều vùng đất vẫn đang bị tranh chấp, khi chiến thắng và thất bại nối tiếp nhau, còn các triều đại thì hưng rồi suy, khi những kẻ cai trị bị vượt mặt.\n\n#bold Những vị vua xưa đang bị thay thế, trong khi kẻ mới nổi vươn tay tới các vì sao. Ngươi sẽ là kẻ nào?#!"

  # Murchad Briain, Duke of Munster, Ireland
  bookmark_rags_to_riches_petty_king_murchad:0 "Tiểu Vương Murchad"
  bookmark_rags_to_riches_petty_king_murchad_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_rags_to_riches_petty_king_murchad_desc:0 "[diplomacy_lifestyle_i] #V #font:TitleFont #size:15 Huyền Thoại Crusader Kings III#!#!#!\nVào đầu thế kỷ XI, ngôi vị Đại Vương Ireland liên tục rơi vào rồi lại tuột khỏi tay gia tộc Briain, khi các quý tộc Ireland giao chiến vì lãnh thổ, chống lại lẫn nhau và cả những kẻ định cư Viking. Tuy vậy, dù xuất thân từ một dòng dõi được định sẵn cho vương quyền, triều đại ngắn ngủi của Murchad tại vùng Munster nhỏ bé lại ít được ghi chép.\n\n#bold Với sự trợ giúp của ngươi, liệu một người thuộc gia tộc Briain có thể một lần nữa ngồi lên ngai vàng Ireland?#!"

  bookmark_rags_to_riches_petty_king_murchad_alt_brian:0 "$Brian$"
  bookmark_rags_to_riches_petty_king_murchad_alt_bebinn:0 "$BE_binn$"

  # Matilda di Canossa, Duchess of Tuscany, Italy
  bookmark_rags_to_riches_duchess_matilda:0 "Nữ Công Tước Matilda"
  bookmark_rags_to_riches_duchess_matilda_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_rags_to_riches_duchess_matilda_desc:0 "[learning_lifestyle_i] #V #font:TitleFont #size:15 Huyền Thoại Crusader Kings III#!#!#!\nTrong bức tranh quyền lực phức tạp của miền Bắc Ý thế kỷ XI, Matilda xứ Canossa buộc phải cai trị một lãnh địa rộng lớn sau hàng loạt cái chết bất ngờ trong gia tộc. Những truyền thuyết về lòng sùng đạo của nàng cùng lời đồn phù thủy phủ lên triều đại của nàng một màn huyền bí.\n\n#bold Ngươi có thể bảo vệ quyền lực của nàng, khiến dòng họ Canossa trường tồn qua nhiều thế hệ giữa thời cuộc biến động này không?#!"

  # Yahya Dhunnunid, Emir (Duke) of Toldeo, Iberia
  bookmark_rags_to_riches_emir_yahya:0 "Emir Yahya"
  bookmark_rags_to_riches_emir_yahya_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_rags_to_riches_emir_yahya_desc:1 "[intrigue_lifestyle_i] #V #font:TitleFont #size:15 Huyền Thoại Crusader Kings III#!#!#!\nVương quốc Toledo sẽ được thành lập vào cuối thế kỷ XI, khi Vua León chiếm lấy thành phố cùng tên. Sự diệt vong của Emir Yahya cùng ảnh hưởng của ngài đồng nghĩa với việc gia tộc Dhunnunid sẽ mất quyền kiểm soát vùng đất mà họ đã cai trị qua nhiều thế hệ.\n\n#bold Thông qua thao túng đối thủ và tìm kiếm thêm đồng minh, ngươi có đủ khả năng thách thức các vị vua bán đảo Iberia và thay đổi lịch sử cho gia tộc Dhunnunid không?#!"

  bookmark_rags_to_riches_emir_yahya_alt_zahida:0 "$Zahida$"
  bookmark_rags_to_riches_emir_yahya_alt_yahya2:0 "$Yahya$"

  # Vratislav Premyslid, Duke of Bohemia, Czechia
  bookmark_rags_to_riches_duke_vratislav:0 "Công Tước Vratislav"
  bookmark_rags_to_riches_duke_vratislav_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_rags_to_riches_duke_vratislav_desc:0 "[stewardship_lifestyle_i] #V #font:TitleFont #size:15 Huyền Thoại Crusader Kings III#!#!#!\nGia tộc Přemyslid đã cai trị vùng Bohemia suốt hàng trăm năm. Họ phụ thuộc nhiều vào chế độ kế vị theo thâm niên, điều mà trong trường hợp của Công tước Vratislav sẽ dẫn đến xung đột nghiêm trọng với các huynh đệ.\n\n#bold Để trở thành Vua Bohemia, Vratislav cần vận dụng khéo léo mọi nguồn lực, cả hữu hình lẫn vô hình — ngươi đã sẵn sàng chưa?#!"

  bookmark_rags_to_riches_duke_vratislav_alt_judita:0 "$Judita$"
  bookmark_rags_to_riches_duke_vratislav_alt_ota:0 "$Ota$ $nick_the_handsome$"


  # Robert 'The Fox' de Hauteville, Duke of Apulia, Sicily
  bookmark_rags_to_riches_duke_robert:0 "Công Tước Robert"
  bookmark_rags_to_riches_duke_robert_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_rags_to_riches_duke_robert_desc:0 "[martial_lifestyle_i] #V #font:TitleFont #size:15 Huyền Thoại Crusader Kings III#!#!#!\nRobert khởi đầu sự nghiệp như một tên trộm và thủ lĩnh bọn cướp đường. Là một trong nhiều huynh đệ, không ai dự đoán người con ưa phiêu lưu này sẽ trở thành một chiến lược gia và chính khách kiệt xuất, cai trị vùng đất rộng lớn — vậy mà giờ đây hắn đã là một Công tước quyền lực tại miền nam Ý, sẵn sàng bước vào dòng chảy lịch sử, giúp gia tộc Hauteville có chỗ đứng tại Sicilia hơn một trăm năm.\n\n#bold Nếu ngươi có thể củng cố quyền lực trong lãnh địa, Vương quốc Sicilia đang chờ đợi chủ nhân của nó!#!"

  bookmark_rags_to_riches_duke_robert_alt_bohemond:0 "$Bohemond$"
  bookmark_rags_to_riches_duke_robert_alt_roger:0 "$Roger$"
  
  bookmark.1066.t: "Nan Đề Hôn Nhân của Matilda"
  bookmark.1066.desc: "Mười một năm trước, mẫu thân ta [mum.GetFirstName] đã sắp đặt hôn ước giữa ta và [hunchback.GetFirstNameNicknamed], em kế của ta, con trai của phu quân mới của bà, [hunchbacks_father.GetTitledFirstNameNicknamed].\n\nDẫu liên minh với [hunchbacks_father.GetPrimaryTitle.GetBaseNameNoTier] mang lại lợi ích, nhưng đây có thật là tương lai mà Thượng Đế dành cho gia tộc danh giá [ROOT.Char.GetHouse.GetBaseName]?\n\nTa #EMP phải#! hành động để bảo vệ tương lai dòng dõi của mình!"
  bookmark.1066.a: "Đức Chúa đã chết vì tội lỗi của chúng ta; thêm một tội nữa cũng chẳng sao."
  bookmark.1066.b: "Ta sẽ tránh hắn cho đến ngày ta chết."
  bookmark.1066.c: "Dù ly hôn là không thể, ta vẫn có ảnh hưởng với Giáo hoàng..."
  bookmark.1066.d: "Ta chấp nhận số phận của mình..."
  lineality_warning: "@warning_icon! #X Khi chọn hôn nhân [patrilineal|E], ngươi có nguy cơ thua cuộc vì con cái sẽ không thuộc [dynasty|E] của ngươi!#!"
  bookmark.1066.a_flavor: "[hunchback.GetFirstName] chẳng khỏe mạnh gì, hắn chỉ cần một cú đẩy nhẹ về phía nấm mồ..."
  bookmark.1066.b_flavor: "Nếu ta không bao giờ gặp hắn, gia tộc hắn sẽ không thể đòi đất của ta."
  bookmark.1066.c_flavor: "Bằng cách xoay xở, ta có thể biến hôn nhân này thành [matrilineal|E], đảm bảo con cái thuộc về [house|E] và [dynasty|E] của ta."
  abandoned_marriage_modifier: "Hôn Nhân Bị Bỏ Rơi"
  abandoned_marriage_modifier_desc: "Nhân vật này đã bỏ rơi bạn đời của mình, dù trên danh nghĩa họ vẫn còn kết hôn...\n[marriage|E] Chấp nhận: #N -150#!"
  ABANDONED_SPOUSE_MODIFIER: "Ngươi có [GetModifier('abandoned_marriage_modifier').GetNameWithTooltip]: $VALUE|=+0$"
  
  bookmark.1067.t: "Lời Thì Thầm Phù Thủy"
  bookmark.1067.desc: "Ngọn lửa lách tách khi [witch.GetFirstName] lấy ra một cuốn sách từ túi. Mùi thảo dược khô ngọt lan tỏa trong không khí đêm.\n\n\"Bí mật của ta không dễ dàng ban phát.\" Nàng nhìn thẳng vào mắt ta. \"Là một người cai trị trẻ tuổi, lại là nữ nhân, ngươi chịu muôn vàn bất lợi: tri thức quý giá này sẽ giúp ngươi tồn tại trong thế giới vốn muốn đẩy ngươi đến diệt vong.\"\n\nNgười phụ nữ bí ẩn dường như quyết tâm truyền lại tri thức của mình... nhưng đây chính là điều các giáo sĩ đã cảnh báo."
  bookmark.1067.a: "Hãy dạy ta tất cả, mặc kệ bọn [ROOT.Char.GetFaith.PriestMalePlural]!"
  bookmark.1067.a_flavor: "@warning_icon! #X Lựa chọn này sẽ khiến ngươi có một [criminal|E] [secret|E]!#!"
  bookmark.1067.b: "Không, đây là tà thuyết."
  bookmark.1067.b_flavor: "Đức tin của ta nơi [ROOT.Char.GetFaith.HighGodName] là đủ."
  
  bookmark.1068.t: "Biên Cương Slav"
    bookmark.1068.desc: "[GetTitleByKey('d_meissen').GetNameNoTier] và [GetTitleByKey('d_lausitz').GetNameNoTier], ôi ta khao khát biết bao những vùng đất màu mỡ và thịnh vượng ấy!\n\nChủ nhân của ta, [emperor.GetTitledFirstNameNicknamed], đã hứa ban chúng cho ta để đổi lấy lòng trung thành của ta. Nhưng ta biết đó chỉ là những lời hứa suông, [emperor.GetSheHe] sẽ không thể trao chúng cho ta.\n\nTa có thể chấp nhận những lời của [emperor.GetTitleAsNamePossessiveNoTooltip] đúng như bản chất của chúng — những lời ca ngợi dành cho phẩm chất cao quý của ta, nhưng không có gì hơn — hoặc ta có thể tự mình hành động."
  bookmark.1068.a: "Những vùng đất đó sẽ thuộc về ta, bằng vũ lực!"
  bookmark.1068.a_flavor: "Để thêm các [titles|E] vào [realm|E] của ngươi, ngươi có thể phải tiến hành [war|E] bằng [claim|E] [casus_belli|E]."
  bookmark.1068.b: "Ta sẽ tận hưởng ân sủng của [emperor.GetTitleAsNamePossessiveNoTooltip]."
  bookmark.1068.b_flavor: "[emperor.GetTitleAsNameNoTooltip], [liege|E] của ngươi, sẽ nợ ngươi một [hook|E] có thể dùng cho nhiều việc — như yêu cầu một [marriage|E] có lợi."
  
  bookmark.1069.t: "Huynh Đệ Ta [jaromir.GetFirstNameNoTooltip]"
  bookmark.1069.desc: "Luôn là cái gai trong mắt ta, 'người huynh đệ thân yêu' [jaromir.GetFirstName] chống lại quyền uy của ta ở mọi nơi.\n\nHắn chẳng giống người bằng hữu tốt của ta [john_monk.GetFirstName] tại Břevnov — một tu sĩ mộ đạo và #EMP không gây rối#!, người phụng sự [ROOT.Char.GetFaith.HighGodName] nhân danh ta. Giá như [john_monk.GetFirstNameNoTooltip] là [jaromir.GetCouncilTitle|U] của ta...\n\nCó lẽ điều đó có thể xảy ra?"
  bookmark.1069.a: "Ta sẽ phế truất [jaromir.GetFirstNameNoTooltip], và [jaromir.GetTitleAsNameNoTooltip] mới sẽ là [john_monk.GetFirstNameNoTooltip]!"
  bookmark.1069.a_flavor: "Có một [councillor|E] với [skills|E] cao lại là [friend|E] của ngươi rất có lợi, vì [councillor_tasks|E] sẽ hoàn thành nhanh hơn — nhưng chọc giận [head_of_faith|E] luôn nguy hiểm."
  bookmark.1069.b: "[jaromir.GetFirstNameNoTooltip] dù sao cũng là người nhà... và vàng thì nặng hơn máu."
  bookmark.1069.b_flavor: "Loại bỏ [Concept( 'rival', 'rivalry' )|E] giữa ngươi và anh trai mình sẽ làm giảm đáng kể nguy cơ bị [GetScheme('murder').GetTypeName] ám sát."
  bookmark.1069.c: "Ta phải lo việc thế tục..."
  bookmark.1069.c_flavor: "Đôi khi không làm gì lại là lựa chọn tốt nhất."
  
  bookmark.1070.t: "Một Sicilia Norman"
  bookmark.1070.desc: "Cuộc sống của một Công tước vẫn tốt hơn làm kẻ cướp đường... nhưng làm Vua thì hợp với ta hơn.\n\nNhờ ân sủng của Chúa và Thánh Phêrô, ta cai trị [GetTitleByKey('d_apulia').GetNameNoTier] và [GetTitleByKey('d_calabria').GetNameNoTier] — nhưng với sự trợ giúp của vài #EMP bằng hữu cũ#! từ thời ta còn là cướp đường, ta có thể cai trị toàn bộ [GetTitleByKey('k_sicily').GetName]. Bất kể Giáo hoàng hay Hoàng đế nghĩ gì.\n\nĐã đến lúc bắt tay vào việc."
  bookmark.1070.a: "Tất cả sẽ là của ta, và còn hơn thế nữa!"
  bookmark.1070.b: "Có lẽ ta nên tránh xa Đế chế."
  bookmark.1070.c: "Cứ để Giáo hoàng và Hoàng đế giữ lấy đất của họ..."
  norman_highwaymen: "Cướp Đường Norman"
  claim_sicily: "Ngươi nhận được [pressed_claims|E] đối với mọi [rulers|E] nhỏ hơn trong [GetTitleByKey('k_sicily').GetName]"
  
  bookmark.1071.t: "Nhà Sư Mạo Danh"
  bookmark.1071.desc: ""...và đó là lý do ngươi nên ủng hộ yêu sách của ta đối với [GetTitleByKey('e_byzantium').GetNameNoTier]!" vị tu sĩ nói, phủ phục trước mặt ta. "Ngươi sẽ có được một đồng minh đáng tin cậy, cùng mọi sự hỗ trợ ngươi cần!"\n\nTên tu sĩ này rõ ràng là kẻ lừa đảo. Hắn không phải cái gọi là #EMP 'Hoàng đế La Mã bị phế truất bất công'#!, nhưng hắn #EMP vẫn#! hữu dụng.\n\nDẫu chỉ là một nông dân thấp kém với yêu sách bịa đặt, một cái cớ để gây chiến vẫn là một cái cớ..."
  bookmark.1071.a: "Ta sẽ đặt hắn lên ngai vàng Constantinople!"
  bookmark.1071.b: "Thành thật mà nói, ta chỉ muốn chiếm vài cảng cho riêng mình..."
  bookmark.1071.c: "Ta không ở vào vị thế có thể giúp ngươi."
  start_raiktor_war: "Ngươi phát động [war|E] chống lại [byz_emperor.GetShortUIName] để [claim|E] [GetTitleByKey('e_byzantium').GetNameNoTier] cho [raiktor.GetShortUIName] và [GetTitleByKey('k_epirus').GetName] cho bản thân"
  start_raiktor_conquest_war: "Ngươi phát động [war|E] chống lại [byz_emperor.GetShortUIName] để chinh phục các [counties|E] [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier], và [GetTitleByKey('c_buthrotum').GetNameNoTier] cho [raiktor.GetShortUIName], kẻ sẽ trở thành [vassal|E] của ngươi"
  gain_war_troops: "Ngươi nhận được một [army|E] gồm #V 3000#! binh sĩ, họ sẽ giải tán sau [war|E]"
  raiktor_claim_cb: "Yêu Sách của Raiktor"
  raiktor_claim_cb_war: "Yêu Sách của Raiktor"
  raiktor_claim_cb_name: "Yêu Sách của Raiktor"
  raiktor_conquest_cb: "Yêu Sách của Raiktor"
  raiktor_conquest_cb_war: "Yêu Sách của Raiktor"
  raiktor_conquest_cb_name: "Yêu Sách của Raiktor"
  you_gain_epirus: "[GetTitleByKey('k_epirus').GetName] cùng toàn bộ [titles|E] bên trong bị [attacker.GetShortUIName|U] chiếm lấy"
  raiktor_gains_byzantium: "[claimant.GetShortUIName|U] chiếm lấy [GetTitleByKey('e_byzantium').GetName]"
  hard_raiktor_war: "Đây là một [war|E] khó khăn, nơi ngươi phải [occupy|E] phần lớn [de_jure|E] Byzantium và đánh bại các [armies|E] của họ để chiến thắng."
  easy_raiktor_war: "Đây là một [war|E] dễ hơn, nơi [occupations|E] và [battles|E] mang lại nhiều [war_score|E] hơn bình thường."
  raiktor_vassal_desc: "[vassal_to_be.GetShortUIName] nhận các [counties|E] [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier], và [GetTitleByKey('c_buthrotum').GetNameNoTier] và trở thành [vassal|E] của ngươi"
  raiktor_vassal_backup_desc: "Ngươi chiếm lấy các [counties|E] [GetTitleByKey('c_dyrrachion').GetNameNoTier], [GetTitleByKey('c_avlonas').GetNameNoTier], và [GetTitleByKey('c_buthrotum').GetNameNoTier]"
  guiscard_modifier: "Guiscard"
  guiscard_modifier_desc: "Nhân vật này đặc biệt xảo quyệt và tàn nhẫn."
  
  bookmark.1072.t: "Chinh Phục Cordoba"
  bookmark.1072.desc: "A, [GetTitleByKey('c_cordoba').GetNameNoTier] tuyệt mỹ! Từng là trung tâm quyền lực của Khalip tại [GetTitleByKey('e_spain').GetNameNoTier] dưới triều Umayyad. Một phần thưởng xứng đáng cho bất kỳ kẻ cai trị nào theo đuổi.\n\nGiờ đây ta đứng trước lựa chọn — dựa vào sức mạnh quân sự, hay tận dụng mưu kế để gieo rắc bất mãn trong hàng ngũ của chúng?\n\nCon đường ta chọn sẽ là con đường ta theo từ nay về sau."
  bookmark.1072.a: "Chiến tranh được thắng bằng lời nói và những lưỡi dao đặt đúng chỗ..."
  bookmark.1072.b: "Ta phải dựa vào quân sự."
  bookmark.1072.c: "[GetTitleByKey('c_cordoba').GetNameNoTierNoTooltip] có thể chờ."
