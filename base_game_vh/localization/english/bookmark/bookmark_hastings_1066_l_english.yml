l_english:
  bm_1066_hastings:0 "Định Mệnh của Nước Anh"
  bm_1066_hastings_desc:2 "Khi vị vua không con Edward the Confessor băng hà, nước Anh rơi vào một cuộc khủng hoảng kế vị chưa từng có.\n\nBa người đã tìm cách đoạt lấy ngai vàng cho riêng mình: Harold Godwinson, William the Bastard, và Harald Hardrade, trong khi Svend và Malcolm đứng ngoài quan sát, sẵn sàng ra tay khi xuất hiện bất kỳ dấu hiệu suy yếu nào.\n\n#bold Ai sẽ là kẻ chiến thắng sau thời khắc hỗn loạn này của lịch sử?#!"

  bookmark_hastings_england:0 "Vua Harold của Anh"
  bookmark_hastings_england_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_hastings_england_desc:2 "Harold Godwinson là người đứng đầu một gia tộc quý tộc hùng mạnh, đồng thời là em rể của nhà vua, khi vị vua không con Edward qua đời. Nay được các quý tộc bầu làm tân vương của nước Anh, ông phải đối mặt với thử thách giữ vững ngai vàng, khi Công tước xứ Normandy đầy tham vọng, cùng với vua Harald của Na Uy — được thúc đẩy và hậu thuẫn bởi chính người em trai lưu vong của Harold — đang tìm cách phế truất ông!\n\n#bold Với đại quân hùng hậu phía sau và sự ủng hộ của các lãnh chúa Anglo-Saxon — liệu bầy sói có nhận ra rằng chúng đã cắn phải miếng mồi vượt quá khả năng của mình?#!"

  bookmark_hastings_england_alt_tostig:0 "$Tostig$"
  bookmark_hastings_england_alt_eadgifu:0 "$Eadgifu$ $nick_the_fair$"

  bookmark_hastings_normandy:0 "William Kẻ Ngoại Hôn"
  bookmark_hastings_normandy_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_hastings_normandy_desc:1 "Gia tộc Normandy truy nguyên nguồn gốc từ các chiến binh Viking Bắc Âu, và đã định cư trên lục địa châu Âu hơn 200 năm trước. Nay, William II nuôi mộng đưa gia tộc mình lên cai trị Vương quốc Anh, và ông tin rằng quyền thừa kế ngai vàng đã được cố vương Edward hứa trao, thậm chí còn được chính Harold Godwinson thừa nhận. Thế nhưng, khi Edward qua đời, Harold đã nuốt lời thề và tự mình đoạt lấy vương miện!\n\n#bold William đang chinh chiến với nước Anh. Ngươi có thể tập hợp binh lực và giành lấy những gì vốn thuộc về mình chăng?#!"

  bookmark_hastings_normandy_alt_robert:0 "$Robert$ $nick_the_curthose$"
  bookmark_hastings_normandy_alt_william:0 "$William$ $nick_the_red$"

  bookmark_hastings_norway:0 "Harald Hardrade"
  bookmark_hastings_norway_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_hastings_norway_desc:1 "Sớm bộc lộ tài năng quân sự phi thường từ thuở thiếu niên, Harald gần đây đã thử chinh phục Đan Mạch nhưng thất bại. Nay, ông hướng ánh mắt vượt đại dương — theo khế ước cổ xưa, vương miện nước Anh lẽ ra phải thuộc về Harald khi vị vua trước qua đời mà không có người thừa kế. Nhưng thay vào đó, người Anglo-Saxon đã đưa Harold Godwinson lên ngai vàng! May thay, vị vua giả mạo này đã tự tạo ra kẻ thù, và Tostig Godwinson — chính em trai của Harold — đang sống lưu vong tại Na Uy...\n\n#bold Bằng cách dùng chính kẻ thù của hắn chống lại hắn, ngươi có thể trao quyền kiểm soát Biển Bắc cho vị Viking Varangian này chăng?#!"
 
  bookmark_hastings_norway_alt_olaf:0 "$Olaf$"
  bookmark_hastings_norway_alt_ingegerd:0 "$Ingegerd$"

  bookmark_hastings_denmark:0 "Vua Svend của Đan Mạch"
  bookmark_hastings_denmark_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_hastings_denmark_desc:1 "Với huyết thống gắn kết với cả Anh và Na Uy, Svend có yêu sách mạnh mẽ đối với cả hai ngai vàng. Đáng tiếc, quân đội của ông nhỏ bé và thiếu kỷ luật, khiến một cuộc chinh phạt trực diện trở nên bất khả thi. Tuy nhiên, vẫn còn những con đường khác để theo đuổi tham vọng...\n\n#bold Nếu con cái của ngươi được gả vào các gia tộc quyền thế, những liên minh hữu ích sẽ hình thành — và chính những liên minh ấy có thể giúp ngươi dựng nên một đế chế sánh ngang La Mã!#!"

  bookmark_hastings_denmark_alt_harald:0 "$Harald$ $nick_the_whetstone$"
  bookmark_hastings_denmark_alt_knud:0 "$Knud$"

  bookmark_hastings_scotland:0 "Vua Malcolm của Scotland"
  bookmark_hastings_scotland_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_hastings_scotland_desc:1 "Được người Scotland gọi là \"Đại Tù Trưởng\", tình thế của Malcolm III mong manh nhưng đầy cơ hội. Ở phía nam, vùng đất trù phú Northumbria đang dễ bị tổn thương khi nước Anh bị xé nát bởi chiến tranh, nhưng tại quê nhà, các lãnh chúa Bắc Âu và cao nguyên Gaelic vẫn thách thức quyền lực của nhà vua.\n\n#bold Quần đảo Anh tràn đầy hiểm nguy lẫn cơ hội: ngươi có thể hái được một đóa hồng giữa khu vườn gai góc này chăng?#!"

  bookmark_hastings_scotland_alt_duncan:0 "$Duncan$"
  bookmark_hastings_scotland_alt_donald:0 "$Donald$ $nick_the_fair$"

  war_1066_Norman_Conquest:0 "Cuộc Chinh Phạt Anh của người Norman"
  war_1066_Harald_Invasion:0 "Cuộc Xâm Lược Anh của Na Uy"
  war_1066_Seljuk_Invasion:0 "Cuộc Xâm Lược Armenia của Seljuk"
  war_1066_Sinhalese_Rebellion:0 "Cuộc Nổi Dậy của người Sinhala"

