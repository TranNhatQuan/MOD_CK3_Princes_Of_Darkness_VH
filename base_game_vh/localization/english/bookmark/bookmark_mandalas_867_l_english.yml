l_english: 

  bm_867_mandalas: "Những Thần Linh Sống Trên Trần Thế"
  bm_867_mandalas_desc: "Không nơi nào mà quyền lực vương giả và tín ngưỡng lại đan xen chặt chẽ như tại Đông Nam Á. Suốt hàng trăm năm, các đức tin Dharmic ngày càng siết chặt ảnh hưởng lên con dân, nhưng chỉ trong thế kỷ vừa qua, những kẻ từng là quân vương mới bắt đầu xưng danh Devaraja – Thần Vương.\n\n#bold Trong số những Thần Vương ấy, ai sẽ dựng nên một di sản của lòng sùng kính, và kẻ nào sẽ bị đánh bại rồi chìm vào quên lãng?#!"

  bookmark_mandalas_867_jayavarman_angkor: "Jayavarman III"
  bookmark_mandalas_867_jayavarman_angkor_subheading: "Sdach của Angkor"
  bookmark_mandalas_867_jayavarman_angkor_desc: "Angkor đã là một thế lực mới nổi kể từ thời Jayavarman II, người đầu tiên trong dòng tộc này xưng danh Devaraja. Sau khi ngài băng hà, vương quốc hầu như không còn mang dáng dấp của đế chế vĩ đại năm xưa, suy tàn chỉ còn như một thành bang nhỏ bé.\n\nThế nhưng, trở thành thần của người Khmer chưa bao giờ là vai trò dễ nắm giữ. Jayavarman III vẫn gặp khó khăn trong việc vượt qua tiền nhân và tự mình trở thành một bậc kiến tạo vĩ đại.\n\n#bold Liệu dòng tộc Varman có thể xứng đáng với di sản thần thánh của mình? Hay sẽ bị những kẻ khác vượt qua, những kẻ tự xưng là chủ nhân của trần thế này?#!"

  bookmark_mandalas_867_indra: "Indra"
  bookmark_mandalas_867_indra_subheading: "Raja của Kutai"
  bookmark_mandalas_867_indra_desc: "Vương quốc nhỏ Kutai là một trong những nơi đầu tiên trong quần đảo mời các tu sĩ Hindu đến để củng cố quyền lực cai trị.\n\nTuy nhiên, triều đại Segara vẫn chưa thể tận dụng liên minh này để đạt được quyền uy như những nơi khác, cai trị một vùng đất vừa dựa vào lòng trung thành bộ tộc, vừa dựa vào nghi lễ tôn giáo.\n\n#bold Liệu Indra sẽ tiếp tục con đường trở thành một Mandala, hay quay về cội nguồn, ôm lấy lối sống của các bộ tộc trên đảo?#!"

  bookmark_mandalas_867_padumaraja: "Padumaraja"
  bookmark_mandalas_867_padumaraja_subheading: "Sdach của Haripuñjaya"
  bookmark_mandalas_867_padumaraja_desc: "Chưa thể sánh ngang với những đô thị đang trỗi dậy như Pagan hay Angkor, thành bang Mon nhỏ bé Haripunjaya thường đóng vai trò một chư hầu phụ thuộc, dù nắm giữ vị trí thuận lợi giữa các thế lực ấy.\n\nPadumaraja là người cuối cùng của Haripunjaya, một triều đại mang tham vọng lớn lao nhưng cho đến nay vẫn chưa thể vươn tới địa vị cao hơn.\n\n#bold Liệu Padumaraja có phải là kẻ cuối cùng đưa dòng tộc mình vươn tới hàng thần linh?#!"

  bookmark_mandalas_867_lokapala: "Lokapala"
  bookmark_mandalas_867_lokapala_subheading: "Raja của Mataram"
  bookmark_mandalas_867_lokapala_desc: "Lokapala đã kiểm soát toàn bộ phần phía đông Java và nay nắm giữ quyền lực trực tiếp to lớn. Tuy nhiên, phần phía tây của hòn đảo vẫn cống nạp cho các hoàng đế Srivijaya đối địch.\n\n#bold Định mệnh của nhà Sanjaya là mở rộng quyền lực ra khắp các đảo khác, hay cuối cùng chỉ trở thành một chư hầu xa xôi của đế chế hải quân Srivijaya?#!"

  bookmark_mandalas_867_pyinbya: "Pyinbya"
  bookmark_mandalas_867_pyinbya_subheading: "Raja của Pagan"
  bookmark_mandalas_867_pyinbya_desc: "Là một trong nhiều thành thị cạnh tranh tại thung lũng Irrawady, Pagan nay đã trở thành một thế lực khu vực, thống lĩnh vô số chư hầu.\n\nPyinbya của Pagan xuất thân từ một dòng dõi quân vương địa phương lâu đời, nhưng chính ngài là người đã biến một thành phố thành một vương quốc đầy tham vọng.\n\n#bold Liệu Pyinbya có thể biến Pagan thành kinh đô tráng lệ mà nó vốn được định sẵn trở thành?#!"

  bookmark_mandalas_867_tanet: "Tanet"
  bookmark_mandalas_867_saladu: "Saladu"
