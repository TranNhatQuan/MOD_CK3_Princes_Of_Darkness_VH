l_english: 

  bm_1178_china: "Thiên Hạ Loạn Ly"
  bm_1178_china_desc: "Trung Hoa nay chia cắt. Thiên tử đã bị người Nữ Chân đánh bật khỏi Trung Nguyên, còn những kẻ đứng đầu triều đình lại lựa chọn con đường nhún nhường hèn yếu thay vì khôi phục giang sơn tổ tiên.\n\nHổ lang hoành hành khắp chốn, sông ngòi nhuộm đỏ máu người chính nghĩa. Để mặc đế quốc rơi vào cảnh tai ương như vậy, ắt hẳn thiên mệnh đã quay lưng sâu sắc.\n\n#bold Bách tính kêu than, mong chờ một anh hùng dẹp yên loạn thế — ai sẽ đứng ra đáp lời?#!"

  bookmark_china_1178_xin_qiji: "Tri Châu Tân Khí Tật"
  bookmark_china_1178_xin_qiji_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
  bookmark_china_1178_xin_qiji_desc: "Mồ côi từ thuở ấu thơ, Tân Khí Tật được tổ phụ nuôi dưỡng, hun đúc trong ngài khát vọng mãnh liệt quét sạch quân Nữ Chân khỏi Trung Nguyên.\n\nNgài nổi danh sau khi báo thù cho chủ soái, nhưng cũng từ đó mà dừng bước — giấc mộng đẩy lùi làn sóng Nữ Chân nhiều lần bị cản trở bởi chính sách cầu hòa của triều Tống.\n\n#bold Liệu Tân Khí Tật có thể thu phục phương Bắc, hay sẽ chuyển chí hướng sang con đường khác?#!"

  bookmark_china_1178_zhang_shi: "Tiết Độ Sứ Trương Thức"
  bookmark_china_1178_zhang_shi_subheading: "$BOOKMARK_SUBHEADING_MILITARY_GOVERNOR$"
  bookmark_china_1178_zhang_shi_desc: "Là con trai của một danh tướng, Trương Thức không chỉ tinh thông binh pháp mà còn là bậc học giả, triết gia xuất chúng.\n\nDẫu được kính trọng bởi trước tác của mình, tiền đồ chính trị của ngài vẫn bấp bênh, bởi ngài kịch liệt chủ trương thu hồi lãnh thổ phương Bắc từ tay nhà Kim — một ý tưởng không được lòng những kẻ chuộng hòa bình hơn chiến tranh.\n\n#bold Liệu Trương Thức sẽ là người xoay chuyển cục diện thiên hạ, hay cũng như bao kẻ khác, chỉ thuận theo dòng chảy của thời cuộc?#!"

  bookmark_china_1178_zhu_xi: "Tri Phủ Chu Hy"
  bookmark_china_1178_zhu_xi_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
  bookmark_china_1178_zhu_xi_desc: "Nổi danh là thần đồng từ thuở thiếu thời, Chu Hy đã chứng minh tài năng của mình không phải ánh hào quang thoáng qua — gạt bỏ Đạo giáo và Phật giáo, ngài dốc lòng nghiên cứu Nho học; nay trước tác của ngài được lưu truyền rộng rãi, còn các sĩ tử thì tranh nhau cơ hội được dự thính giảng học.\n\n#bold Được ca tụng rộng rãi nhờ trước tác và tư tưởng, liệu việc theo đuổi quyền lực có giúp Chu Hy hiện thực hóa xã hội lý tưởng của mình chăng?#!"

  bookmark_china_1178_li_renxiao: "Ninh Lệnh Ngôi Danh Nhân Hiếu"
  bookmark_china_1178_li_renxiao_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_china_1178_li_renxiao_desc: "Sau gần bốn thập kỷ trị vì, thần dân của Nhân Hiếu ca ngợi triều đại của ngài là thời kỳ huy hoàng và thịnh vượng bậc nhất mà Tây Hạ từng có. Dẫu hiện tại rực rỡ, tương lai vẫn phủ đầy bất định.\n\nChưa đầy mười năm trước, Nhân Hiếu đã xử tử tể tướng và các tướng lĩnh sau một cuộc đảo chính thất bại, và kể từ đó, quan hệ giữa vương quyền và binh sĩ không còn như xưa.\n\n#bold Ngươi có thể bảo vệ Đại Hạ khỏi nanh vuốt của các thế lực lân bang chăng?#!"

  bookmark_china_1178_tudan_xixian: "Tiết Độ Sứ Đồ Đan Tịch Hiển"
  bookmark_china_1178_tudan_xixian_subheading: "$BOOKMARK_SUBHEADING_GOVERNOR$"
  bookmark_china_1178_tudan_xixian_desc: "Xuất thân từ một trong những gia tộc Nữ Chân cao quý nhất, lại là phò mã của hoàng tộc nhà Kim, thân thế của Tịch Hiển hoàn mỹ chẳng kém gì tài bắn cung và cưỡi ngựa của ngài.\n\nÍt nói, trọng nghĩa, tinh thông binh pháp, danh tiếng của ngài lớn đến mức người ta cho rằng ngài có thể sánh ngang với cả vạn quân.\n\n#bold Nhà Kim đã chiếm lĩnh Trung Nguyên, nhưng phương Nam vẫn còn đó. Còn ai xứng đáng hoàn tất cuộc chinh phạt hơn vị danh tướng Nữ Chân vĩ đại nhất?#!"
