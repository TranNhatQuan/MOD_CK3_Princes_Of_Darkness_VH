l_english: 
  bm_1178_genpei: "Sự Trỗi Dậy của Võ Sĩ"
  bm_1178_genpei_desc: "Từng chút một, các võ sĩ đã giành lấy quyền lực khỏi kinh thành, cai trị các địa phương Nhật Bản như lãnh địa riêng, làm giàu cho bản thân và thuộc hạ.\n\nNhững thập kỷ qua chứng kiến gia tộc Minamoto kiêu hãnh liên tiếp thất bại trước thế lực Taira không thể ngăn cản. Họ liếm vết thương trong khi Kiyomori thao túng kinh thành. Nỗi sợ hãi và bạo lực nay thống trị nơi ấy, khi Kampaku và hoàng tộc chỉ có thể bất lực đứng nhìn.\n\n#bold Liệu Minamoto có thể chấm dứt sự trỗi dậy của Taira, hay một định mệnh khác đang chờ đợi quần đảo này?#!"

  bookmark_genpei_yoritomo: "$dynn_Minamoto$ $Yoritomo$"
  bookmark_genpei_yoritomo_subheading: "Lãnh Chúa $c_izu$"
  bookmark_genpei_yoritomo_noriyori: "$Noriyori$"
  bookmark_genpei_yoritomo_yoshitsune: "$Yoshitsune$"
  bookmark_genpei_yoritomo_desc: "Gia tộc [Glossary( 'Seiwa Minamoto', 'MINAMOTO_GLOSS' )] từng hùng mạnh nay đã chịu đựng vô số thất bại, suy yếu vì nội chiến khi kẻ thù truyền kiếp của họ, [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )], thừa cơ trỗi dậy.\n\nKhi Minamoto Yorimasa tỏ ra yếu kém, Yoritomo cùng những người con còn sống của danh tướng Yoshitomo có lẽ là rào cản cuối cùng giữa Taira Kiyomori và quyền thống trị tuyệt đối Nhật Bản.\n\n#BOLD Chẳng bao lâu nữa, Taira sẽ trở nên quá mạnh để chống lại. Ngươi sẽ bị bào mòn đến diệt vong, hay thống nhất quốc gia và mang lại hòa bình lâu dài?#!"

  bookmark_genpei_kiyomori: "$emperor_daijo_daijin_male_japanese_feudal$ $dynn_Taira$ $Kiyomori$"
  bookmark_genpei_kiyomori_subheading: "$BOOKMARK_SUBHEADING_RULING_REGENT$"
  bookmark_genpei_kiyomori_shigemori: "$Shigemori$"
  bookmark_genpei_kiyomori_tsunemori: "$Tsunemori$"
  bookmark_genpei_kiyomori_desc: "Gia tộc [Glossary( 'Kanmu Taira', 'TAIRA_GLOSS' )] đã từng bước khẳng định mình là gia tộc võ sĩ hùng mạnh nhất Nhật Bản, sau khi gạt bỏ các đối thủ bushi là [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] cùng tầng lớp quan lại [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )].\n\nKhi ái nữ của mình đã kết hôn với Thiên hoàng [Glossary( 'Yamato', 'YAMATO_GLOSS' )] Norihito, Kiyomori đang chờ đợi một hoàng tôn. Một hoàng tử mang dòng máu Taira trong hàng kế vị sẽ củng cố quyền lực của gia tộc tại triều đình. Nhưng nền tảng quyền lực này sẽ không dễ dàng được thiết lập khi kẻ thù ganh ghét vẫn còn đầy rẫy.\n\n#BOLD Ngươi sẽ thiết lập sự thống trị lâu dài của Taira trên Nhật Bản, hay gục ngã ngay trước ngưỡng cửa cuối cùng?#!"

  bookmark_genpei_motofusa: "$dynn_Fujiwara$ $Motofusa$"
  bookmark_genpei_motofusa_subheading: "$game_concept_governor$ của $c_oki$"
  bookmark_genpei_motofusa_kanezane: "$Kanezane$"
  bookmark_genpei_motofusa_takatada: "$Takatada$"
  bookmark_genpei_motofusa_desc: "Trên danh nghĩa giữ vai trò [Glossary( 'nhiếp chính', 'KAMPAKU_GLOSS' )], gia tộc [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] đã cai trị Nhật Bản từ trong bóng tối suốt nhiều thế kỷ, thống trị bộ máy quan liêu của kinh đô và kết thông gia với triều đại [Glossary( 'Yamato', 'YAMATO_GLOSS' )].\n\nTuy nhiên, cách xa kinh đô, các võ sĩ samurai đã xây dựng những lãnh địa riêng của mình. Của cải và binh lực của họ giờ đây đã vượt xa những quan lại quý tộc. Những võ sĩ bushi quyền lực nhất là [Glossary( 'Taira', 'TAIRA_GLOSS' )], dưới sự lãnh đạo của Kiyomori, đã chiếm quyền kiểm soát kinh đô.\n\n#BOLD Ngươi có thể ngăn chặn sự trỗi dậy của các samurai, và khơi dậy lại vinh quang của một triều đình Fujiwara lãnh đạo không?#!"

  bookmark_genpei_hidehira: "$dynn_Fujiwara$ $Hidehira$"
  bookmark_genpei_hidehira_subheading: "Lãnh Chúa Mutsu"
  bookmark_genpei_hidehira_yasuhira: "$Yasuhira$"
  bookmark_genpei_hidehira_hidehisa: "$Hidehisa$"
  bookmark_genpei_hidehira_desc: "Khi phần lớn [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] làm thơ nơi kinh thành, hậu duệ của tướng quân Hidesato lại định cư tại miền Bắc khắc nghiệt, bình định các bộ tộc và tranh đoạt quyền lực với những võ sĩ khác.\n\nTổ phụ của Hidehira từng được nhận làm con nuôi bởi gia tộc Kiyohara, những kẻ cai trị Ōshū. Sau khi tiêu diệt mọi đối thủ tranh đoạt quyền thừa kế của gia tộc này, ông đã khôi phục họ Fujiwara và mở rộng quyền kiểm soát miền Bắc.\n\n#BOLD Sự an nhàn nơi triều đình Fujiwara đã tạo điều kiện cho mối đe dọa từ [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] và [Glossary( 'Taira', 'TAIRA_GLOSS' )]. Thanh kiếm đã chinh phục phương Bắc — liệu nó có thể khôi phục vị thế tối cao của Fujiwara?#!"

  bookmark_genpei_yoshinaka: "$dynn_Minamoto$ $Yoshinaka$"
  bookmark_genpei_yoshinaka_subheading: "Lãnh Chúa $c_shinano$"
  bookmark_genpei_yoshinaka_tomoe: "$Tomoe$ $Gozen$"
  bookmark_genpei_yoshinaka_yoshitaka: "$Yoshitaka_2$"
  bookmark_genpei_yoshinaka_desc: "Bị chia rẽ vì quyền lãnh đạo và thừa kế gia tộc [Glossary( 'Minamoto', 'MINAMOTO_GLOSS' )] xứ Kawachi, trưởng tử Yoshitomo đã sát hại em mình là Yoshikata trong cuộc tranh đấu.\n\nGia tộc Nakahara đã che chở đứa con đang chạy trốn của Yoshikata nơi núi non Shinano, và dẫu Yoshitomo đã qua đời từ lâu, Yoshinaka nay trưởng thành vẫn không quên quyền thừa kế bị tước đoạt của mình.\n\n#BOLD Ngươi sẽ báo thù cho phụ thân bằng cách đối đầu với đường huynh Yoritomo, hay cùng gia tộc chống lại một kẻ thù lớn hơn?#!"
