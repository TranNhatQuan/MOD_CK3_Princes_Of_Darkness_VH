l_english:
  bm_1066_iberia:0 "Iberia Tan Vỡ"
  bm_1066_iberia_desc:0 "Khi vị lão vương Ferdinand I qua đời, ba người con trai của ông mỗi người thừa hưởng một phần vương quốc Iberia. Lòng tham, tham vọng và các cuộc thánh chiến nhanh chóng đẩy bán đảo Iberia vào cơn sôi sục, và mối ràng buộc giữa những người trong cùng huyết thống dần rạn nứt.\n\n#bold Liệu có ai trong số các huynh đệ Fernandez đủ mạnh mẽ, hay đủ mưu lược, để giành chiến thắng trước tất cả? Chiến tranh và ngoại giao sẽ nhào nặn bán đảo Iberia ra sao?#!"

 # Carcía Fernandez, King of Galicia, Iberia
  bookmark_iberia_king_garcia:0 "Vua García"
  bookmark_iberia_king_garcia_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_iberia_king_garcia_desc:0 "Được trao cho vương quốc bất ổn nhất trong ba anh em, García đã thử nhiều biện pháp cực đoan nhằm củng cố quyền lực của mình. Tuy nhiên, vùng đất mong manh này nhanh chóng trở thành mục tiêu hấp dẫn đối với người em Alfonso, kẻ đã xâm lược vào năm 1071. Cuộc tấn công ấy mở đầu cho chuỗi chiến tranh giữa các huynh đệ, nhưng phần lớn thời gian García lại bị giam cầm.\n\n#bold Cầm vũ khí chống lại chính huynh đệ của ngươi và dẫn dắt vương quốc bất ổn này tới vinh quang và chiến thắng!#!"

  bookmark_iberia_king_alfonso_alt_sancha:0 "$Sancha$"
  bookmark_iberia_king_alfonso_alt_nuno:0 "$NuN_o$"

 # Alfonso VI Fernandez, King of León, Iberia
  bookmark_iberia_king_alfonso:0 "Vua Alfonso VI"
  bookmark_iberia_king_alfonso_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_iberia_king_alfonso_desc:0 "Người con thứ, cũng là ái tử của phụ vương, Alfonso thừa hưởng vương quốc trung tâm trù phú León. Ông đã dùng mưu lược để vượt qua và khuất phục cả hai người anh em, rồi cai trị vương quốc được thống nhất lại của phụ thân.\n\n#bold Bằng chính trị, ngoại giao gia tộc và sức mạnh, liệu ngươi có đủ bản lĩnh để thống nhất ba vương quốc dưới một ngọn cờ?#!"

 # Sancho II Fernandez, King of Castile, Iberia
  bookmark_iberia_king_sancho:0 "Vua Sancho II"
  bookmark_iberia_king_sancho_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_iberia_king_sancho_desc:0 "Sancho đã bị tước đoạt phần thừa kế trọn vẹn khi phụ vương chia đất cho cả ba anh em. Là kẻ biết nắm bắt thời cơ, ông nhanh chóng cầm vũ khí chống lại huynh đệ ngay khi hòa bình bắt đầu rạn vỡ, nhưng chỉ kịp cai trị vương quốc thống nhất trong thời gian ngắn trước khi bị ám sát.\n\n#bold Bằng quân sự và mưu lược, liệu ngươi có thể khôi phục toàn vẹn vương quốc dưới một vị quân vương chính danh, và giữ vững quyền lực?#!"

  bookmark_iberia_king_sancho_alt_rodrigo:0 "$Rodrigo$"

 # Urraca Fernandez, Countess of Zamorra, Iberia
  bookmark_iberia_infanta_urraca:0 "Infanta Urraca"
  bookmark_iberia_infanta_urraca_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_iberia_infanta_urraca_desc:0 "Là trưởng nữ của Ferdinand, Urraca có ảnh hưởng rộng lớn đối với cả các huynh đệ lẫn Giáo hội. Nàng cùng em gái Elvira được trao quyền cai quản toàn bộ các tu viện trong ba vương quốc, và nàng không hề đứng yên khi các anh em tàn sát lẫn nhau.\n\n#bold Để vượt mặt các huynh đệ và ghi danh vào lịch sử, Urraca cần cả sự kiên nhẫn lẫn táo bạo — liệu ngươi có thành công?#!"

  bookmark_iberia_infanta_urraca_alt_elvira:0 "$Elvira$"

 # Antso IV Gartziez, King of Navarra, Iberia
  bookmark_iberia_king_antso:0 "Vua Antso IV"
  bookmark_iberia_king_antso_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_iberia_king_antso_desc:1 "Nhiều lãnh chúa ở phía tây vương quốc đã rời bỏ vua Antso sau khi ông lên ngôi kế vị cha mẹ. Ông nhanh chóng bị cuốn vào cuộc chiến với người anh em họ là vua Sancho, dẫn đến thất bại, và sau một triều đại nhuốm màu chiến tranh cùng thất bại, ông bị chính anh em ruột ám sát.\n\n#bold Viết lại lịch sử, vượt qua chính gia tộc của ngươi, và bảo vệ lãnh thổ lẫn di sản của mình!#!"

  bookmark_iberia_king_antso_alt_ramiro:0 "$Ramiro$"
  bookmark_iberia_king_antso_alt_sancho:0 "$Sancho$"
