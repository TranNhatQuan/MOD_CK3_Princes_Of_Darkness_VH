l_english:
  start_year_1178_10_01_desc:0 "Thời đại Thập tự chinh đã thực sự bước vào hồi cao trào vào năm 1178 SCN. Vua Baudouin mắc bệnh phong đang ngự trên ngai vàng của Vương quốc Thập tự Jerusalem — một vương quốc có tương lai bấp bênh chẳng kém gì chính số phận của ông — trong khi Sultan mới của Ai Cập, Salāh al-Dīn, chuẩn bị giành lại Thánh địa một lần và mãi mãi. Ở phương bắc, Đế quốc Byzantine đối mặt với nguy cơ mất quyền kiểm soát Anatolia và viễn cảnh sắp có một hoàng đế mới lần đầu tiên sau gần bốn thập kỷ, cùng toàn bộ những âm mưu và tranh đoạt đi kèm."
  start_year_1066_09_15_desc:0 "Sự trở lại của sao chổi Halley báo hiệu một năm 1066 SCN đầy biến động khi các cuộc xung đột lớn bùng nổ khắp thế giới. Trong lúc người Seljuk tiếp tục lấn sâu vào lãnh thổ Byzantine và người Sinhala nổi dậy chống lại ách áp bức tại Sri Lanka, thì tại Anh, một cuộc chiến toàn diện đã nổ ra khi ba kẻ tranh ngôi cùng lúc tuyên bố quyền kế vị vương miện. Bầu không khí căng thẳng bao trùm bán đảo Iberia bị chia cắt, khi các lãnh chúa bộ lạc dõi theo sự thay đổi cán cân quyền lực trên lục địa với sự pha trộn giữa nỗi sợ hãi và lòng tham."
  start_year_867_01_01_desc:0 "Năm 867 SCN chứng kiến những kẻ cướp bóc phương Bắc gieo rắc kinh hoàng dọc theo các bờ biển và sông ngòi, trong khi châu Âu vẫn bị chia rẽ dưới sự cai trị của nhà Karling. Trên tiểu lục địa Ấn Độ, cuộc tranh chấp tam cường giữa các triều đại Pratihara, Pala và Rashtrakuta đã âm ỉ suốt nhiều thập kỷ, nhưng xung đột khi ấy vẫn chỉ mới ở giai đoạn khởi đầu."
  bm_group_867:0 "867"
