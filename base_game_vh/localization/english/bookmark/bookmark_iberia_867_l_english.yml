l_english:

 # Bookmark
  bm_867_iberia:1 "Cuộc Tranh Đấu vì Iberia"
  bm_867_iberia_desc:3 "Những thế lực cổ xưa của Iberia đang dần suy tàn.\n\nỞ phương Bắc, Asturias đầy rẫy các chư hầu tham vọng, khao khát thoát khỏi sự ràng buộc.\n\nỞ phương Nam, al-Andalus ngày càng hùng mạnh nhưng phải đối mặt với làn sóng bất mãn âm ỉ. Các khu quân sự biên cương rì rầm về độc lập, và âm mưu lan tràn trong triều đại Umayyad đang cai trị.\n\nNhững thế lực ngoại bang tham lam dõi mắt về vùng đất trù phú của Iberia.\n\n#bold Được hun đúc qua nhiều thế kỷ, $game_concept_iberian_struggle$ bước sang một giai đoạn mới — và kết cục là máu đổ hay tình huynh đệ, tất cả đều nằm trong tay định mệnh.#!"
  war_867_Vimara_conquest_Portucale:0 "Chiến tranh vì [claim|E] của Vimara đối với $d_porto$"
  war_Andalusian_Rebellion:0 "Cuộc Nổi Dậy của các Khu Biên Cương"

 # Wilfred the Hairy
  bookmark_fp2_iberia_wilfred_the_hairy:0 "$GuifrE_$ $nick_the_hairy$"
  bookmark_fp2_iberia_wilfred_the_hairy_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_fp2_iberia_sunyer:0 "$Sunyer$"
  bookmark_fp2_iberia_bernat_of_gothia:0 "$Bernat$"
  bookmark_fp2_iberia_wilfred_the_hairy_desc:0 "Khi phụ thân và thúc phụ của ông bị Công tước xứ Toulouse tàn sát, quốc vương Frank đã tước đoạt lãnh địa của họ, để lại $GuifrE_$ cùng các huynh đệ họ hàng rơi vào cảnh trắng tay.\n\nHai mươi năm đã trôi qua, và bánh xe số phận lại xoay vần. Được phục chức tại lãnh địa của phụ thân, người anh em họ đầy mưu mô của $GuifrE_$ cũng đã giành lại quyền thừa kế của mình, và chủ nhân mới của họ lại chính là họ hàng của kẻ đã sát hại cha mẹ họ.\n\n#bold Không ai hiểu rõ hơn ngươi rằng vận mệnh có thể đổi thay trong chớp mắt — và ngươi khao khát một phần thưởng vững chắc hơn: $d_barcelona$.#!"

# Lupp ibn Musa / Lope Musez
  bookmark_fp2_iberia_lupp_ibn_musa:1 "$Lubb$ Muzez"
  bookmark_fp2_iberia_lupp_ibn_musa_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_fp2_iberia_lupp_ibn_musa_desc:0 "Triều đại hùng mạnh Banu Qasi, hậu duệ của Cassius, từng thống trị toàn bộ thung lũng Ebro. Nhưng thời hoàng kim đã qua kể từ triều đại vinh quang của phụ thân $Lubb$. Nay, Banu Musa — cái tên mới của họ — chỉ còn biết âm thầm chịu đựng và liếm vết thương từ cố đô Tudela, mưu tính ngày thu hồi những lãnh thổ phía nam.\n\n#bold Ngươi có thể giành lại những gì từng thuộc về Banu Qasi và khôi phục vinh quang xưa của triều đại chăng?#!"

  bookmark_fp2_iberia_lubb_ibn_musa_alt_mohamed:0 "Mohamed"
  bookmark_fp2_iberia_lubb_ibn_musa_alt_oria:0 "Oria"

 #Mendo Guterres of Santiago
  bookmark_fp2_iberia_mendo_guterres:0 "Bá tước $Hermenexildo$ Gutierrez"
  bookmark_fp2_iberia_mendo_guterres_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_fp2_iberia_mendo_guterres_desc:0 "Là một chư hầu quyền lực của vua Adelfonso III, $Hermenexildo$ cai quản vùng nam Galicia với nền hành chính trong sạch. Lòng trung thành tuyệt đối với quân vương đã giúp ông mở rộng lãnh địa tổ tiên — nhưng như thế đã đủ hay chưa?\n\n#bold Khi sự chú ý ngày càng hướng về phương Nam, ngươi có thể chinh phục vùng đất Portucale và đặt nền móng cho một trong những triều đại có ảnh hưởng nhất của nó chăng?#!"

  bookmark_fp2_iberia_mendo_guterres_alt_arias:0 "$Arias$"
  bookmark_fp2_iberia_mendo_guterres_alt_ermesinda:0 "Hermesinda Gatónez"

  bookmark_fp2_iberia_ibn_marwan:0 "Ibn Marwan"
  bookmark_fp2_iberia_ibn_marwan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_fp2_iberia_ibn_marwan_desc:1 "Mang bản chất của một kẻ nổi loạn, Abd al-Rahman ibn Marwan có mối quan hệ đầy biến động với chủ nhân của mình, vị sultan Umayyad, nhưng lại nhận được sự ủng hộ mạnh mẽ từ cộng đồng Mozarab trong lãnh địa, và thực chất có lẽ còn có nhiều điểm tương đồng với họ cùng đức tin của họ. Ông đã xây dựng một thành trì vững chắc tại Badajoz, nhưng ở phía tây, gia tộc Banu Danis cuồng tín ngày càng chống đối sự cai trị của ông tại Hạ Biên Khu.\n\n#bold Liệu một liên minh với Alfonso III, vị vua luôn chớp thời cơ của Asturias, có thể giúp ngươi giành lấy vương miện cho riêng mình chăng?#!"
  bookmark_fp2_iberia_ibn_marwan_alt_surunbaqi:0 "Tiểu vương Sa'dun xứ Porto"
  bookmark_fp2_iberia_ibn_marwan_alt_rahman:0 "Abd al-Rahman"

  bookmark_fp2_iberia_adanis_ibn_awsaga:0 "Tiểu vương Adanis"
  bookmark_fp2_iberia_adanis_ibn_awsaga_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
  bookmark_fp2_iberia_adanis_ibn_awsaga_desc:0 "Được sultan Umayyad giao phó nhiệm vụ bảo vệ bờ biển phía tây khỏi các cuộc cướp phá của Viking, triều đại Berber Banu Danis nhanh chóng gia tăng ảnh hưởng và quyền lực. Tiểu vương Adanis đã xây dựng các pháo đài kiên cố tại Alcácer và Coimbra, nhưng vẫn lo ngại về cộng đồng Mozarab dưới quyền, những người sẵn sàng ngả theo kẻ thù của ông — Ibn Marwan.\n\n#bold Ngươi có thể bảo vệ lãnh thổ và dẫn dắt người Berber tới một tương lai huy hoàng tại al-Andalus chăng?#!"
  bookmark_fp2_iberia_ibn_awsaga_alt_masud:0 "Mas'ud ibn Adanis"
  bookmark_fp2_iberia_ibn_awsaga_alt_yahya:0 "Yahya ibn Adanis"
