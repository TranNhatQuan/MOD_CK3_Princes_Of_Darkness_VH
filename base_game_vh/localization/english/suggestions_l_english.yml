 suggestion_increase_opinion_desc:0 "[actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] [recipient.GetShortUIName] hiện có mức [opinion|E] thấp về Ngài. Cải thiện điều này bằng một [personal_scheme|E] sẽ giúp Ngài dễ thở hơn."
 suggestion_increase_opinion_click:1 "#I Nhấp để bắt đầu Âm mưu Lấy lòng#!"

 suggestion_raid_label:0 "Cướp bóc"
 suggestion_raid:0 "Đề xuất: Cướp bóc [landed_title.GetNameNoTierNoTooltip]"
 suggestion_raid_desc:0 "Điều quân đội của Ngài đi [raid|E] [landed_title.GetNameNoTierNoTooltip] sẽ mang lại [loot|E]."
 suggestion_raid_click:1 "#I Nhấp để xem mục Quân sự#!"

 suggestion_grant_title_label:0 "Ban Tước vị"
 suggestion_grant_title:0 "Đề xuất: Ban [landed_title.GetNameNoTierNoTooltip] cho [recipient.GetShortUINameNoTooltip]"
 suggestion_grant_title_desc:0 "[recipient.GetShortUIName] là người nắm giữ [de_jure|E] của [landed_title.GetName]. Đảm bảo lãnh thổ tuân theo cấu trúc De Jure sẽ giúp ổn định và giảm phạt thiện cảm."
 suggestion_grant_title_click:1 "#I Nhấp để Ban Tước vị#!"

 suggestion_can_hire_court_positions:0 "Thuê Chức vụ Triều đình"
 suggestion_can_hire_court_positions_label:0 "Đề xuất: Thuê thêm Chức vụ Triều đình"
 suggestion_can_hire_court_positions_desc:0 "Ngài nên đầu tư vàng để bổ nhiệm thêm [court_positions|E] nhằm nhận các lợi ích đi kèm."
 suggestion_can_hire_court_positions_click:0 "#I Nhấp để xem các Chức vụ Triều đình khả dụng#!"

 suggestion_request_war_aid_petition:0 "Yêu cầu Hỗ trợ Quân sự"
 suggestion_request_war_aid_petition_label:0 "Đề xuất: Yêu cầu Hỗ trợ Quân sự"
 suggestion_request_war_aid_petition_desc:0 "Ngài có thể yêu cầu [liege|E] hỗ trợ trong cuộc [war|E] của mình. Họ có thể tham chiến hoặc chi trả binh lính."
 suggestion_request_war_aid_petition_click:0 "#I Nhấp để xem [royal_court|E] của [lieges|E]#!"

 suggestion_create_nation_fracturing_faction:0 "Thành lập $nation_fracturing_faction$"
 suggestion_create_nation_fracturing_faction_label:0 "Đề xuất: $suggestion_create_nation_fracturing_faction$"
 suggestion_create_nation_fracturing_faction_desc:1 "Ngài có thể thách thức [liege|E] và tìm cách giải thể vương quốc để giành độc lập cho bản thân và các [vassals|E] đồng minh."
 suggestion_create_nation_fracturing_faction_click:1 "#I Nhấp để xem các Phe phái chống lại [liege]#!"
