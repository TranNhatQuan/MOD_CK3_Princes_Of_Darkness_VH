l_english:
 SUGGESTION_TITLE:0 "#T $NAME$#!"
 
 suggestion_recruit_maa_label:0 "Chiêu mộ Quân Binh Thường Trực"
 suggestion_recruit_maa:0 "Đề xuất: Chiêu mộ một trung đoàn Quân Binh Thường Trực"
 suggestion_recruit_maa_desc:0 "Ngài có ít [men_at_arms|E] hơn mức được kỳ vọng đối với một [ruler|E] ở [rank|E] của Ngài.\n\nChiêu mộ thêm sẽ củng cố [armies|E] của Ngài, vừa giúp răn đe kẻ thù tiềm tàng, vừa đủ sức đối đầu với những kẻ vẫn quyết tâm gây chiến."
 suggestion_recruit_maa_click:0 "#I Nhấp để xem mục Quân sự#!"

 suggestion_declare_war_label:0 "Tuyên Chiến"
 suggestion_declare_war:0 "Đề xuất: Tuyên chiến với [recipient.GetShortUINameNoTooltip]"
 suggestion_declare_war_desc:1 "Chiến thắng trong cuộc chiến chống lại [recipient.GetShortUIName] sẽ cho phép Ngài chinh phục thêm lãnh thổ và mở rộng [realm|E], giúp đảm bảo sự hưng thịnh lâu dài cho [house|E] của Ngài."
 suggestion_declare_war_click:1 "#I Nhấp để Tuyên chiến#!"

 suggestion_construct_building_label:0 "Xây dựng Công trình"
 suggestion_construct_building:0 "Đề xuất: Xây dựng một công trình tại [landed_title.GetNameNoTierNoTooltip]"
 suggestion_construct_building_desc:1 "Xây dựng các công trình tại [landed_title.GetNameNoTooltip] sẽ mang lại nhiều lợi ích khác nhau và đem lại lợi thế lâu dài cho Ngài."
 suggestion_construct_building_click:1 "#I Nhấp để xem Lãnh địa#!"

 suggestion_fabricate_claim_label:0 "Ngụy tạo Yêu sách"
 suggestion_fabricate_claim:0 "Đề xuất: Ngụy tạo yêu sách đối với [landed_title.GetNameNoTierNoTooltip]"
 suggestion_fabricate_claim_desc:1 "[landed_title.GetName] lân cận vừa giàu có vừa phồn thịnh, nhưng Ngài không thể chinh phục nếu thiếu [casus_belli|E].\n\nCử [court_chaplain|E] hoặc [realm_priest|E] đi ngụy tạo một [claim|E] sẽ mang lại cho Ngài chính nghĩa cần thiết để phát động [war|E] và chiếm lấy tước vị đó!"
 suggestion_fabricate_claim_click:1 "#I Nhấp để xem Tước vị#!"

 suggestion_create_title_label:0 "Tạo Tước vị"
 suggestion_create_title:0 "Đề xuất: Tạo [landed_title.GetNameNoTooltip]"
 suggestion_create_title_desc:1 "Ngài sở hữu đủ lãnh thổ [de_jure|E] để [create|E] [landed_title.GetName]. Làm vậy sẽ gia tăng đáng kể [prestige|E] và khiến Ngài trở thành [rightful_liege|E] hợp pháp của các tước vị trực thuộc."
 suggestion_create_title_click:1 "#I Nhấp để xem Tước vị#!"

 SUGGESTIONS_DEBUG:0 "#D GỢI Ý DEBUG:#!"

 suggestion_convert_county_label:0 "Cải đạo Hạt"
 suggestion_convert_county:0 "Đề xuất: Cải đạo Đức tin tại [landed_title.GetNameNoTierNoTooltip]"
 suggestion_convert_county_desc:0 "Cử [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E] thuyết phục cư dân tại [landed_title.GetName] chấp nhận đức tin chân chính sẽ giúp ổn định khu vực."
 suggestion_convert_county_click:1 "#I Nhấp để xem Hội đồng#!"

 suggestion_increase_control_label:0 "Gia tăng Kiểm soát"
 suggestion_increase_control:0 "Đề xuất: Gia tăng Kiểm soát tại [landed_title.GetNameNoTierNoTooltip]"
 suggestion_increase_control_desc:2 "Cử [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )|E] gia tăng kiểm soát tại [landed_title.GetName] sẽ làm giảm [county_corruption|E] và có thể mang lại các hiệu ứng có lợi khác."
 suggestion_increase_control_click:1 "#I Nhấp để xem Hội đồng#!"

 suggestion_increase_opinion_label:0 "Gia tăng Thiện cảm"
