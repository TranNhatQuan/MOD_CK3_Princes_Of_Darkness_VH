  court_position_bodyguard_cherbi_modifier: "[GetCourtPositionType('cherbi_court_position').GetName|U] [aptitude|E]"
  cherbi_double_the_guard: "Tăng Gấp Đôi Lính Gác"
  cherbi_double_the_guard_desc: "Nhân vật này được giao nhiệm vụ bảo vệ lãnh chúa bằng #bold mọi#! giá."
  cherbi_validity_trigger_tt: "[prowess_i][prowess|E] là #high 12#! trở lên"

  yeke_jarquchi_court_position: "Yeke Jarquchi"
  yeke_jarquchi_court_position_fallback: "Tổng Giám Luật"
  yeke_jarquchi_court_position_turkic: "El Ögäsi"
  yeke_jarquchi_court_position_desc: "$yeke_jarquchi_court_position$ giám sát luật pháp của vùng đất, Yassa. Là đôi mắt của lãnh chúa, họ đảm bảo mọi người tuân thủ quy tắc của bộ tộc."
  yeke_jarquchi_court_position_fallback_desc: "$yeke_jarquchi_court_position_fallback$ là người đảm bảo luật lệ của lãnh chúa được tuân thủ trên khắp lãnh địa."
  yeke_jarquchi_court_position_turkic_desc: "$yeke_jarquchi_court_position_turkic$ là người đảm bảo luật lệ của lãnh chúa được tuân thủ trên khắp lãnh địa."
