  court_physician_celestial_imperial: "Ngự Y Cung Đình"
  court_physician_celestial_imperial_desc: "$court_physician_celestial_imperial$ chịu trách nhiệm về sức khỏe và sự an khang của [court|E] mà họ phục vụ. Họ sẽ chữa trị bệnh tật và khâu vá vết thương trong khả năng tốt nhất của mình."
  court_physician_celestial: "Thần Y"
  court_physician_celestial_desc: "$court_physician_celestial$ chịu trách nhiệm về sức khỏe và sự an khang của [court|E] mà họ phục vụ. Họ sẽ chữa trị bệnh tật và khâu vá vết thương trong khả năng tốt nhất của mình."
  court_astrologer_celestial_imperial: "Khâm Thiên Giám"
  court_astrologer_celestial_imperial_desc: "$court_astrologer_celestial_imperial$ quan sát bầu trời để dự đoán vận mệnh có thể đang chờ đợi chúng ta."
  court_astrologer_celestial: "Nhà Bói Toán"
  court_astrologer_celestial_desc: "$court_astrologer_celestial$ quan sát bầu trời để dự đoán vận mệnh có thể đang chờ đợi chúng ta."
  travel_leader_celestial_imperial: "Khai Lộ Sứ"
  travel_leader_celestial_imperial_desc: "$travel_leader_celestial_imperial$ hỗ trợ Ngài khi di hành và phụ trách toàn bộ hành trình. Họ đảm bảo Ngài đến nơi an toàn và đúng thời gian."
  travel_leader_celestial: "Tiên Phong Do Thám"
  travel_leader_celestial_desc: "$travel_leader_celestial$ hỗ trợ Ngài khi di hành và phụ trách toàn bộ hành trình. Họ đảm bảo Ngài đến nơi an toàn và đúng thời gian."
  antiquarian_celestial: "Thủ Hộ Bảo Vật"
  antiquarian_celestial_desc: "$antiquarian_celestial$ chịu trách nhiệm bảo quản, chăm sóc và thu thập các [artifacts|E]."
  seneschal_celestial: "Tổng Quản Nội Vụ"
  seneschal_celestial_desc: "$seneschal_celestial$ giữ vai trò quan trọng trong đời sống thường nhật của hoàng gia, quản lý gia nhân và đảm bảo mọi việc vận hành trôi chảy."
  court_tutor_celestial: "Học Sĩ Uyên Bác"
  court_tutor_celestial_desc: "$court_tutor_celestial$ phụ trách [education|E] của mọi trẻ em trong triều đình, và kỹ năng của họ sẽ ảnh hưởng đến mức độ tác động lên học trò. Trẻ em vẫn có thể có [guardians|E] riêng."
  chief_eunuch_celestial_imperial: "Thái Giám Cung Đình"
  chief_eunuch_celestial_imperial_desc: "$chief_eunuch_celestial_imperial$ là cận thần đáng tin cậy phụ trách các hoạn quan trong triều. Ít có chuyện gì xảy ra mà họ không nghe thấy, cả trong hàng gia nhân lẫn hoàng tộc."
  chief_eunuch_celestial: "Thái Giám Hầu Cận"
  chief_eunuch_celestial_desc: "$chief_eunuch_celestial$ là cận thần đáng tin cậy phụ trách các hoạn quan trong triều. Ít có chuyện gì xảy ra mà họ không nghe thấy, cả trong hàng gia nhân lẫn hoàng tộc."
  master_of_horse_celestial_imperial: "Giám Mã Đô Úy"
  master_of_horse_celestial_imperial_desc: "$master_of_horse_celestial_imperial$ chịu trách nhiệm về chiến mã và chuồng trại của quân vương. Công việc của họ không hề nhẹ nhàng, vì một con ngựa được chăm sóc tốt là lợi thế cả trên chiến trường lẫn đường trường."
  master_of_horse_celestial: "Quản Mã"
  master_of_horse_celestial_desc: "$master_of_horse_celestial$ chịu trách nhiệm về chiến mã và chuồng trại của quân vương. Công việc của họ không hề nhẹ nhàng, vì một con ngựa được chăm sóc tốt là lợi thế cả trên chiến trường lẫn đường trường."
  master_of_hunt_celestial: "Giám Sát Săn Bắn"
  master_of_hunt_celestial_desc: "$master_of_hunt_celestial$ phụ trách các cuộc săn do triều đình tổ chức, đồng thời quản lý chuồng chó săn và đàn chó."
  cave_hermit_celestial: "Ẩn Sĩ Thông Tuệ"
  cave_hermit_celestial_desc: "$cave_hermit_celestial$ là người sống trong lãnh địa của Ngài và giải trí cho khách bằng những lời tiên tri và câu đố. Một số người tin rằng họ thực sự là bậc huyền nhân."
  court_gardener_celestial_imperial: "Thượng Uyển Giám"
  court_gardener_celestial_imperial_desc: "$court_gardener_celestial_imperial$ chịu trách nhiệm chăm sóc các khu vườn của quân vương, dốc thời gian và kỹ năng để khiến chúng thật sự tươi tốt."
  court_gardener_celestial: "Người Làm Vườn"
  court_gardener_celestial_desc: "$court_gardener_celestial$ chịu trách nhiệm chăm sóc các khu vườn của quân vương, dốc thời gian và kỹ năng để khiến chúng thật sự tươi tốt."
  chronicler_celestial_imperial: "Đại Sử Quan"
  chronicler_celestial_imperial_desc: "$chronicler_celestial_imperial$ có nhiệm vụ ghi chép lại công tích của chủ nhân."
  chronicler_celestial: "Sử Quan"
  chronicler_celestial_desc: "$chronicler_celestial$ có nhiệm vụ ghi chép lại công tích của chủ nhân."
  champion_celestial_imperial: "Hổ Dũng Lang"
  champion_celestial_imperial_desc: "$champion_celestial_imperial$ là chiến binh thiện chiến và nguy hiểm, có thể đại diện cho quân vương trong các trận quyết đấu."
  champion_celestial: "Hổ Dũng Binh"
  champion_celestial_desc: "$champion_celestial$ là chiến binh thiện chiến và nguy hiểm, có thể đại diện cho quân vương trong các trận quyết đấu."
  court_brewmaster_celestial: "Tửu Chính"
  court_brewmaster_celestial_desc: "$court_brewmaster_celestial$ là đại diện được chọn để làm việc trực tiếp với các thợ nấu rượu trong lãnh địa, đảm bảo quân vương có được những loại rượu ngon nhất."
  lady_in_waiting_celestial_imperial: "Cung Nữ"
  lady_in_waiting_celestial_imperial_desc: "$lady_in_waiting_celestial_imperial$ là trợ lý và Ngài đồng hành của Nữ Vương hoặc Nữ Hoàng Đế, chăm lo mọi nhu cầu và đáp ứng mọi ý muốn của bà."
  lady_in_waiting_celestial: "Thị Nữ"
  lady_in_waiting_celestial_desc: "$lady_in_waiting_celestial$ là trợ lý và Ngài đồng hành của Nữ Vương hoặc Nữ Hoàng Đế, chăm lo mọi nhu cầu và đáp ứng mọi ý muốn của bà."
  royal_architect_celestial: "Đại Công Tượng"
  royal_architect_celestial_desc: "$royal_architect_celestial$ giám sát mọi công trình danh giá trong lãnh địa; không một viên gạch nào được đặt, không một khoảnh khắc nào bị lãng phí nếu chưa có sự cho phép của họ."
  court_poet_celestial: "Thi Nhân Cung Đình"
  court_poet_celestial_desc: "$court_poet_celestial$ là bậc am tường ngôn từ và thi ca, mang đến cho quân vương và triều đình sự giải trí, kích thích trí tuệ và trải nghiệm cảm xúc."
  court_musician_celestial_imperial: "Nhạc Sư"
  court_musician_celestial_imperial_desc: "$court_musician_celestial_imperial$ là nghệ sĩ ca hát và biểu diễn nhạc cụ để giải trí cho quân vương và triều đình."
  court_musician_celestial: "Nhạc Công"
  court_musician_celestial_desc: "$court_musician_celestial$ là nghệ sĩ ca hát và biểu diễn nhạc cụ để giải trí cho quân vương và triều đình."
  bodyguard_celestial_imperial: "Cấm Vệ Quân"
  bodyguard_celestial_imperial_desc: "$bodyguard_celestial_imperial$ là tuyến phòng thủ cuối cùng trước mọi kẻ tấn công. Họ theo sát chủ nhân mọi nơi và không ngần ngại che chắn trước bất kỳ hiểm nguy nào."
  bodyguard_celestial: "Vệ Binh Gia Tộc"
  bodyguard_celestial_desc: "$bodyguard_celestial$ là tuyến phòng thủ cuối cùng trước mọi kẻ tấn công. Họ theo sát chủ nhân mọi nơi và không ngần ngại che chắn trước bất kỳ hiểm nguy nào."
  court_artificer_celestial_imperial: "Ngự Tượng"
  court_artificer_celestial_imperial_desc: "$court_artificer_celestial_imperial$ là người đã chứng minh khả năng chế tác những vật phẩm xuất sắc. Dù phần lớn thời gian họ ở trong triều, hy vọng rằng cảm hứng sẽ lại đến."
  court_artificer_celestial: "Thợ Thủ Công"
  court_artificer_celestial_desc: "$court_artificer_celestial$ là người đã chứng minh khả năng chế tác những vật phẩm xuất sắc. Dù phần lớn thời gian họ ở trong triều, hy vọng rằng cảm hứng sẽ lại đến."

  grand_preceptor_court_position: "Đại Thái Phó"
  grand_preceptor_court_position_desc: "$grand_preceptor_court_position$ là trụ cột đạo đức của triều đình, có nhiệm vụ làm tấm gương chính trực để mọi người noi theo."
  grand_preceptor_court_position_task_instill_righteousness: "Bồi Dưỡng Chính Trực"
  grand_preceptor_court_position_task_instill_righteousness_desc: "$grand_preceptor_court_position$ sẽ dốc sức tu dưỡng đạo đức cho quân vương."
  grand_preceptor_court_position_task_propagate_civic_virtue: "Truyền Bá Đức Hạnh"
  grand_preceptor_court_position_task_propagate_civic_virtue_desc: "$grand_preceptor_court_position$ sẽ giữ vai trò chủ đạo trong việc lan truyền đức hạnh đạo lý đến dân chúng."
  grand_preceptor_court_position_task_exalt_imperial_deeds: "Tán Dương Công Tích Hoàng Gia"
  grand_preceptor_court_position_task_exalt_imperial_deeds_desc: "Với vai trò $grand_preceptor_court_position$, lời nói của nhân vật này mang thẩm quyền đạo đức to lớn, và nhiều người sẵn sàng xem đó là chân lý."

  grand_preceptor_powerfuL_family_score_desc: "$grand_preceptor_court_position$"

  grand_guardian_court_position: "Đại Hộ Vệ"
  grand_guardian_court_position_desc: "$grand_guardian_court_position$ là thanh kiếm và tấm khiên của lãnh địa, được tôn kính vì kinh nghiệm quân sự và tầm nhìn chiến lược."
  grand_guardian_court_position_task_guard_the_capital: "Bảo Vệ Kinh Đô"
  grand_guardian_court_position_task_guard_the_capital_desc: "$grand_guardian_court_position$ sẽ phụ trách công tác bảo vệ an ninh của kinh đô đế quốc."
  grand_guardian_court_position_task_shield_the_realm: "Che Chở Lãnh Địa"
  grand_guardian_court_position_task_shield_the_realm_desc: "$grand_guardian_court_position$ sẽ vận dụng kỹ năng chiến lược đáng gờm của mình để phòng thủ toàn bộ lãnh địa."
  grand_guardian_court_position_task_instill_martial_discipline: "Rèn Luyện Kỷ Luật Quân Sự"
