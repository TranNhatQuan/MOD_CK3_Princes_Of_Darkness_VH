  boyan_court_position: "Noyan"
  boyan_court_position_fallback: "Tướng Quân"
  boyan_court_position_desc: "$boyan_court_position$ là một trong những vị tướng chủ chốt trong quân đội của lãnh chúa, đảm bảo chiến thắng trên chiến trường."
  boyan_court_position_fallback_desc: "$boyan_court_position_fallback$ chỉ huy các đơn vị trong quân đội của lãnh chúa, đảm bảo thành công trong chiến trận."
  boyan_impress_vassals: "Uy Hiếp Chư Hầu"
  boyan_impress_vassals_desc: "Nhân vật này được giao nhiệm vụ đưa các chư hầu trở lại trật tự."
  boyan_impress_vassals_tt: "[vassal|E] [faction_commitment|E]: #P -20#!"
  boyan_prepare_raids: "Chuẩn Bị Cướp Phá"
  boyan_prepare_raids_desc: "Nhân vật này đang chuẩn bị quân đội của lãnh chúa để cướp phá những vùng đất xa xôi."
  boyan_validity_trigger_tt: "[martial_i][martial|E] là #high 12#! trở lên"

  siege_engineer_court_position: "Kỹ Sư Công Thành"
  siege_engineer_court_position_desc: "$siege_engineer_court_position$ thường là một chuyên gia ngoại quốc được tuyển mộ đến thảo nguyên vì kỹ năng chiến tranh công thành."
  siege_engineer_build_equipment: "Chế Tạo Vũ Khí Công Thành"
  siege_engineer_build_equipment_desc: "Nhân vật này tập trung chế tạo vũ khí công thành cho lãnh chúa."
  siege_engineer_build_equipment_tt: "Mỗi tháng có một xác suất nhỏ nhận được một đơn vị [siege_weapon|E] [men_at_arms|E]"
  siege_engineer_build_equipment_trigger_tt: "Đã có đầy đủ [siege_weapon|E] [men_at_arms|E]"
