  yurtchi_court_position: "Yurtchi"
  yurtchi_court_position_fallback: "Quản Nhu"
  yurtchi_court_position_desc: "$yurtchi_court_position$ giám sát việc tổ chức và phúc lợi của bộ tộc, đồng thời đảm bảo bộ tộc được trang bị đầy đủ cho chiến trận."
  yurtchi_court_position_fallback_desc: "$yurtchi_court_position_fallback$ đảm bảo bộ tộc luôn sẵn sàng di chuyển bất cứ lúc nào, cũng như được trang bị cho chiến tranh."
  yurtchi_lean_times: "Thực Hành Tiết Kiệm"
  yurtchi_lean_times_desc: "Nhân vật này đang thực hiện các biện pháp nhằm hạn chế chi tiêu của bộ tộc."
  yurtchi_prosperous_times: "Mở Hội Ăn Mừng"
  yurtchi_prosperous_times_desc: "Nhân vật này đảm bảo hạnh phúc của bộ tộc, dù phải trả giá đắt."
  yurtchi_validity_trigger_tt: "[stewardship_i][stewardship|E] là #high 12#! trở lên"

  cherbi_court_position: "Cherbi"
  cherbi_court_position_fallback: "Tổng Vệ Sĩ"
  cherbi_court_position_desc: "$cherbi_court_position$ giám sát $bodyguard_court_position_nomadic$, đảm bảo an toàn cho lãnh chúa. Với vai trò đứng đầu an ninh của lãnh chúa, đây là một trong những chức vị danh giá nhất trong bộ tộc."
  cherbi_court_position_fallback_desc: "$cherbi_court_position_fallback$ chịu trách nhiệm bảo vệ an toàn cho lãnh chúa, một vị trí vừa danh giá vừa nguy hiểm."
