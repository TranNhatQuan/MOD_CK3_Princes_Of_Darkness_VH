  minister_bureaucrat_court_position_desc: "Trong tầng lớp thượng tầng của chính quyền thiên triều, cần đến một đội ngũ lớn các quan lại hành chính. Được đích thân người đứng đầu mỗi bộ lựa chọn, họ đảm bảo mọi việc vận hành trơn tru."
