  keeper_of_the_harem_court_position: "Tổng Quản Hậu Cung"
  keeper_of_the_harem_court_position_desc: "$keeper_of_the_harem_court_position$ giữ một vị trí vô cùng quan trọng trong hậu cung hoàng gia, giám sát mọi việc từ y phục của phi tần đến việc sắp xếp thời điểm ân ái cát tường."

  keeper_of_the_harem_court_position_task_maintain_decorum: "Giữ Gìn Kỷ Cương Hậu Cung"
  keeper_of_the_harem_court_position_task_maintain_decorum_desc: "$keeper_of_the_harem_court_position$ sẽ tập trung dập tắt những âm mưu độc địa trong hậu cung và bảo vệ nơi này khỏi những sự can thiệp không mong muốn từ bên ngoài."
  keeper_of_the_harem_maintaining_decorum.tt: "$keeper_of_the_harem_court_position$ sẽ cản trở đáng kể các [schemes|U] nhắm vào thành viên hậu cung."

  keeper_of_the_harem_court_position_task_attend_to_wellness: "Chăm Sóc Sức Khỏe Phi Tần"
  keeper_of_the_harem_court_position_task_attend_to_wellness_desc: "$keeper_of_the_harem_court_position$ sẽ đặc biệt quan tâm đến sức khỏe và sự an khang của hậu cung, chữa trị bệnh tật và giảm bớt gánh nặng cho họ."
  keeper_of_the_harem_attend_to_wellness.tt: "Mỗi tháng, $keeper_of_the_harem_court_position$ sẽ tìm và chăm sóc một thành viên hậu cung đang mắc bệnh, giảm căng thẳng và triệu chứng của họ."

  keeper_of_the_harem_court_position_task_select_palace_beauties: "Tuyển Chọn Mỹ Nhân"
  keeper_of_the_harem_court_position_task_select_palace_beauties_desc: "$keeper_of_the_harem_court_position$ sẽ định kỳ rà soát hậu cung, cho hồi hưu những phi tần già yếu không con cái và tuyển chọn mỹ nhân tài sắc thay thế."
  keeper_of_the_harem_select_palace_beauties.tt: "Mỗi năm, $keeper_of_the_harem_court_position$ có thể cho hồi hưu một phi tần già yếu không con và tuyển thêm một phi tần mới vào hậu cung."

  court_guru_court_position: "Guru"
  court_guru_court_position_desc: "Một guru vừa là cố vấn vừa là hiền triết, khuyên bảo quân vương về những vấn đề trần thế lẫn chân lý thiêng liêng."
  guru_teach_learning: "Khai Sáng Trí Tuệ"
  guru_teach_learning_desc: "Guru chia sẻ kinh điển thiêng liêng và học vấn uyên thâm để nâng cao trí tuệ của quân vương."
  guru_teach_diplomacy: "Rèn Luyện Lời Nói"
  guru_teach_diplomacy_desc: "Guru dạy nghệ thuật diễn đạt nơi triều đình, sự im lặng đúng lúc và tài thuyết phục tao nhã."
  guru_teach_intrigue: "Mài Giũa Giác Quan"
  guru_teach_intrigue_desc: "Thông qua ngụ ngôn và những trò chơi tinh tế, guru rèn luyện quân vương nhìn thấu động cơ ẩn giấu và đánh lừa với sự điềm tĩnh."

  court_brahmin_court_position: "Bà La Môn Triều Đình"
  court_brahmin_court_position_desc: "Một vị tư tế đáng kính xuất hiện trong cả triều đình Ấn Độ giáo lẫn Phật giáo, Bà La Môn Triều Đình chịu trách nhiệm thực hiện nghi lễ, chủ trì nghi thức và củng cố tính chính danh của quân vương."
  court_brahmin_court_position_task_increase_tribute: "Gia Tăng Cống Nạp"
  court_brahmin_court_position_task_increase_tribute_desc: "Nhân vật này sẽ tận tâm thúc đẩy dòng chảy của cải từ chư hầu triều cống đến chủ thượng."

  khlon_glan_court_position: "Khlon Glan"
  khlon_glan_court_position_desc: "Khlon Glan là một quan chức cấp cao, phụ trách quản lý kho tàng và nguồn tiếp tế quân sự của lãnh địa."
  khlon_glan_assist_provisioning: "Phát Triển Thủ Đô"
  khlon_glan_assist_provisioning_desc: "Nhân vật này đang tập trung cải thiện thủ đô Mandala."
 
