  yeke_jarquchi_validity_trigger_tt: "[diplomacy_i][diplomacy|E] là #high 12#! trở lên"

  foreign_emissary_court_position: "Sứ Giả Ngoại Bang"
  foreign_emissary_court_position_desc: "$foreign_emissary_court_position$ được tuyển mộ từ phương xa để gây ấn tượng với triều đình của lãnh chúa bằng những câu chuyện kỳ lạ, đồng thời đóng vai trò nhà ngoại giao với các nhà lãnh đạo lân cận."
  court_position_different_culture: "Họ thuộc một [culture|E] khác"
  foreign_emissary_culture_acceptance_tt: "[cultural_acceptance|E] sẽ được tăng bởi [liege.Custom('GetAptitudeForeignEmissaryLoc')] giữa [liege.GetCulture.GetName] và các [cultures|E] của [tributary|E] mỗi năm #weak (tối đa #V 50#!)#!"
  foreign_emissary_aptitude: "[ROOT.Char.MakeScope.ScriptValue('foreign_emissary_aptitude_tooltip')|P0]"
  foreign_emissary_missing_aptitude: "#P 2-10#! (dựa trên [aptitude|E])"
  foreign_emissary_culture_acceptance: "Dung Hòa Chư Hầu Triều Cống"
  foreign_emissary_culture_acceptance_desc: "Nhân vật này sẽ đảm bảo rằng các chư hầu triều cống tuân phục chủ thượng của họ, bằng mọi biện pháp cần thiết."
  culture_acceptance_desc_foreign_emissary: "[liege.GetName] đã dàn xếp cho các nước triều cống của [liege.GetHerHis] thuộc [culture|E] này"
