  antiquarian_employer_custom_effect_description: "[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'antiquarian_employer_custom_effect_reforge_description', '' )]$BULLET$Mở khóa [decision|E] #V $commission_artifact_decision$#!\n$BULLET$Bảo vệ [artifacts|E] trong các [sieges|E] và [raids|E]"
  antiquarian_employer_custom_effect_reforge_description: "$BULLET$Cho phép Ngài [reforge|E] [artifacts|E]\n"

  chief_eunuch_court_position:1 "Tổng quản Thái giám"
  chief_eunuch_court_position_desc:1 "$chief_eunuch_court_position$ là một cận thần đáng tin cậy chịu trách nhiệm quản lý các thái giám trong triều. Rất ít chuyện xảy ra mà họ không nghe thấy, cả trong hàng ngũ người hầu lẫn hoàng tộc."
  keeper_of_swans_court_position:0 "Người trông Thiên nga"
  keeper_of_swans_court_position_desc:1 "$keeper_of_swans_court_position$ phụ trách đàn thiên nga hoàng gia. Theo dõi số lượng những sinh vật lộng lẫy mà Lãnh chúa sở hữu và chăm sóc chúng; đây là một vị trí đi kèm với trách nhiệm nặng nề."

  master_of_horse_court_position:0 "Quan quản Mã"
  master_of_horse_court_position_desc:1 "$master_of_horse_court_position$ chịu trách nhiệm về những chiến mã oai vệ và chuồng ngựa của Lãnh chúa. Công việc của họ không hề nhẹ nhàng, bởi một con ngựa được chăm sóc tốt là lợi thế cả trên chiến trường lẫn trên đường hành quân."
  master_of_horse_oversee_breeding: "Giám sát Nhân giống"
  master_of_horse_oversee_breeding_desc: "Nhân vật này được giao nhiệm vụ giám sát việc nhân giống tại chuồng ngựa hoàng gia."
  master_of_horse_mightiest_warhorse: "Chăm sóc Chiến mã"
  master_of_horse_mightiest_warhorse_desc: "Chỉ những chiến mã ưu tú nhất mới xứng đáng với một vị quân vương hiếu chiến."

  court_jester_court_position:0 "Hề Cung đình"
  court_jester_employer_custom_effect_description:1 "$BULLET$Mở khóa [decision|E] #V $jester_entertainment_decision$#!"
  court_jester_court_position_desc:1 "$court_jester_court_position$ – một kẻ mua vui – có mặt để giải trí cho Lãnh chúa và mọi vị khách đến thăm triều đình. Dù những lời nói hóm hỉnh đôi khi được trân trọng, một cú ngã đau điếng luôn khiến mọi người bật cười."
  master_of_hunt_court_position:0 "Quan quản Săn bắn"
  master_of_hunt_court_position_nomadic: "Chủ trì Cuộc Săn"
  master_of_hunt_employer_custom_effect_description:4 "$BULLET$[GetActivityType('activity_hunt').GetName] tăng [hunt_success_chance_no_prefix|E] theo [aptitude|E]"
  master_of_hunt_employee_custom_effect_description: "Tăng [hunt_success_chance_no_prefix|E] trong [GetActivityType('activity_hunt').GetName]"
  master_of_hunt_court_position_desc:1 "$master_of_hunt_court_position$ chịu trách nhiệm về mọi chuyến săn do các thành viên trong triều của Lãnh chúa tổ chức. Họ cũng quản lý chuồng chó săn và những con chó bên trong."
  master_of_hunt_court_position_nomadic_desc: "$master_of_hunt_court_position_nomadic$ chịu trách nhiệm tổ chức những cuộc săn lớn và đảm bảo một chuyến săn thành công cho lãnh chúa của mình."
  high_almoner_court_position:0 "Đại Phát chẩn quan"
  high_almoner_court_position_desc:1 "$high_almoner_court_position$ phụ trách phân phát bố thí cho người nghèo xứng đáng và các thần dân khác đang cần giúp đỡ."
  cupbearer_court_position:0 "Quan dâng Rượu"
  cupbearer_employer_custom_effect_description:3 "$BULLET$Có cơ hội ngăn chặn [schemes|E] [GetScheme('murder').GetTypeName] bằng Thuốc độc#!"
  cupbearer_court_position_desc:1 "$cupbearer_court_position$ chịu trách nhiệm rót đồ uống tại bàn tiệc hoàng gia và đảm bảo không ai bị cạn chén."

  seneschal_court_position:0 "Tổng quản Nội phủ"
  seneschal_court_position_desc:1 "$seneschal_court_position$ giữ vai trò quan trọng trong đời sống thường nhật của hoàng gia, quản lý người hầu và đảm bảo mọi việc vận hành trơn tru."
  seneschal_improve_court: "Tổ chức Triều đình"
  seneschal_improve_court_desc: "Nhân vật này đang tổ chức lại triều đình để đảm bảo mọi người đều làm đúng nhiệm vụ."
  seneschal_improve_court_task_tt: "@aptitude:4:color_green![aptitude|E] của các [court_positions|E] khác: #p +[SCOPE.ScriptValue('seneschal_improve_court_value')|0]#!"
  seneschal_improve_court_task_fallback_tt: "@aptitude:4:color_green![aptitude|E] của các [court_positions|E] khác: #p +2/+10#!"
  seneschal_improve_domain: "Quản lý Lãnh địa"
  seneschal_improve_domain_desc: "Nhân vật này được giao nhiệm vụ điều hành lãnh thổ của lãnh chúa."
  seneschal_handling_estate: "Quản lý Điền trang"
  seneschal_handling_estate_desc: "Nhân vật này chịu trách nhiệm chăm lo điền trang của lãnh chúa."

  antiquarian_court_position:0 "Cổ vật quan"
  antiquarian_court_position_desc:2 "$antiquarian_court_position$ chịu trách nhiệm bảo quản, chăm sóc và thu thập các cổ vật."

  court_tutor_court_position:0 "Gia sư"
  court_tutor_court_position_desc:1 "$court_tutor_court_position$ phụ trách [education|E] của toàn bộ trẻ em trong triều, và kỹ năng của họ sẽ ảnh hưởng đến mức độ tác động lên học trò. Trẻ em vẫn có thể có [guardians|E] riêng."
  court_tutor_employer_custom_effect_description:3 "$BULLET$Đóng vai trò [guardian|E] cho [children|E] chưa có người giám hộ\n$BULLET$Mở khóa [interaction|E] #V $make_child_learn_language_interaction$#!"
  court_tutor_improve_others: "Dạy dỗ Triều đình"
  court_tutor_improve_others_desc: "Nhân vật này được giao nhiệm vụ hỗ trợ các thành viên khác trong triều."
  court_tutor_improve_others_title: "Được dạy bởi [ROOT.Char.GetName]"
  court_tutor_improve_others_notification_desc: "[target_character.GetShortUIName|U] đã cải thiện kỹ năng của [CharYourHerHis( target_character )] với sự trợ giúp từ [ROOT.Char.GetShortUIName]"
  court_tutor_improve_others_fallback_tt: "[liege|E], [heir|E] của lãnh chúa hoặc những người giữ [court_position|E] khác tại [court|E] có thể nhận [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E] hoặc [traits|E] mỗi tháng"
  court_tutor_teach_kids: "Giáo dục Trẻ em"
  court_tutor_teach_kids_desc: "Nhân vật này vượt xa bổn phận trong việc giáo dục trẻ em trong triều."
  court_tutor_teach_kids_title: "Gia sư Giáo dục Trẻ"
  court_tutor_teach_kids_notification_desc: "[court_owner.Custom2('RelationToMeShort', SCOPE.sC('child') )] của Ngài đã được dạy bởi [court_tutor_scope.GetShortUIName]"
  court_tutor_teach_kids_notification_desc_you: "Ngài đã được dạy bởi [court_tutor_scope.GetShortUIName]"
  court_tutor_teach_kids_tt: "[children|E] tại [court|E] có cơ hội tăng một trong các [diplomacy_i][stewardship_i][learning_i][martial_i][skills|E] thêm #p +1#! hoặc #p +2#! mỗi năm"
 
  royal_architect_court_position:0 "Kiến trúc sư Hoàng gia"
  royal_architect_court_position_desc:1 "$royal_architect_court_position$ giám sát mọi dự án xây dựng danh giá trong lãnh thổ; không một viên gạch nào được đặt, cũng không một đồng nào được chi, nếu không có sự cho phép rõ ràng của họ."
  royal_architect_fortify_lands: "Củng cố Lãnh thổ"
  royal_architect_fortify_lands_desc: "Nhân vật này được giao nhiệm vụ đảm bảo an toàn cho lãnh thổ và thần dân của lãnh chúa."
  royal_architect_public_works: "Công trình Công cộng"
  royal_architect_public_works_desc: "Nhân vật này chịu trách nhiệm quản lý sự phát triển của thủ đô."

  court_poet_court_position:0 "Thi sĩ Cung đình"
  court_poet_employer_custom_effect_description:2 "$BULLET$Có thể ngẫu nhiên trở nên [inspired|E]"
  court_poet_court_position_desc:1 "$court_poet_court_position$ là một người am hiểu ngôn từ và thi ca, mang đến cho Lãnh chúa và triều đình sự giải trí, kích thích trí tuệ và những trải nghiệm cảm xúc."
  poet_inspired_message:0 "Nguồn Cảm Hứng Bừng Nở!"
  poet_inspired_effect:0 "[GetCourtPositionType('court_poet_court_position').GetName()] [inspired_poet.GetFirstName] của Ngài đã nhận được một [inspiration|E]"
  courtier_inspired_message: "$poet_inspired_message$"
  courtier_inspired_effect: "Cận thần [inspired_courtier.GetFirstName] của Ngài đã nhận được @inspiration_icon![inspiration|E]"
  court_poet_skald: "Thi nhân Cung đình"
  court_poet_skald_desc: "$court_poet_skald$ là một bậc thầy về ngôn từ và thi ca, người mang đến cho Lãnh chúa cùng toàn thể triều đình những giây phút giải trí, sự khai sáng về trí tuệ và những trải nghiệm đầy cảm xúc."

  bodyguard_court_position:0 "Hộ vệ"
  bodyguard_court_position_nomadic: "Kheshig"
  bodyguard_employer_custom_effect_description:3 "$BULLET$Có cơ hội ngăn chặn [schemes|E] [GetScheme('murder').GetTypeName] Ám sát#!\n#indent_newline:3 $BULLET$Giảm nguy cơ tử trận hoặc bị bắt trong các [battles|E] mà cả hai cùng tham gia#!#!"
  stooge_employer_custom_effect_description: "$BULLET$Mở khóa tùy chọn đặc biệt trong sự kiện\n#indent_newline:3 $BULLET$Mở khóa [decision|E] $humiliate_the_stooge_decision$#!#!"
  bodyguard_court_position_desc:1 "$bodyguard_court_position$ là tuyến phòng thủ cuối cùng trước mọi kẻ tấn công. Họ theo sát người được bảo vệ đến bất cứ đâu và không ngần ngại đặt mình vào nguy hiểm đang rình rập."
  bodyguard_court_position_nomadic_desc: "$bodyguard_court_position_nomadic$ có vinh dự bảo vệ lãnh chúa của mình cả trong chiến trận lẫn thời bình. Chia thành đội canh ngày và canh đêm, họ luôn sẵn sàng hy sinh tính mạng bất cứ lúc nào."

  champion_court_position:1 "Dũng sĩ Cá nhân"
  champion_employer_custom_effect_description:3 "$BULLET$Có thể thay Ngài tham gia một số [single_combat_duel_plural|E]\n[AddLocalizationIf( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC' )]"
  champion_employer_custom_effect_description_TOTO_DLC:1 "$BULLET$Mang lại [prestige|E] khi thi đấu trong [GetActivityType( 'activity_tournament' ).GetName]"
  champion_court_position_desc:1 "$champion_court_position$ là một chiến binh thiện chiến và nguy hiểm có thể đại diện cho Lãnh chúa trong các trận đấu tay đôi."
  champion_compete_task: "Thi đấu Nhân danh"
  champion_compete_task_desc: "Nhân vật này đang tích cực tham gia các giải đấu địa phương trong lãnh thổ nhân danh lãnh chúa."
  champion_exercise_ruler: "Luyện tập cùng Lãnh chúa"
  champion_exercise_ruler_desc: "Nhân vật này được giao nhiệm vụ đảm bảo lãnh chúa luôn khỏe mạnh và sung sức."
  champion_exercise_ruler_fallback_tt: "[liege|E] có thể nhận [prowess_i][prowess_skill|E] mỗi tháng"
  champion_exercise_ruler_title: "Luyện tập cùng [ROOT.Char.GetShortUIName]"
  champion_exercise_ruler_notification_desc: "[liege.GetShortUIName|U] [CharHaveHas( liege )] được huấn luyện bởi [ROOT.Char.GetShortUIName]"
  champion_improve_self: "Rèn luyện Kỹ năng"
  champion_improve_self_desc: "Nhân vật này đang tập trung cải thiện kỹ năng của mình với vai trò dũng sĩ cá nhân."
  champion_improve_self_fallback_tt: "Mỗi tháng nhân vật này có cơ hội nhận được [trait_level_track_xp|E] của [GetTrait('tourney_participant').GetName( GetNullCharacter )] hoặc [prowess_i][prowess_skill|E]"

  court_musician_court_position:0 "Nhạc công Cung đình"
  court_musician_employer_custom_effect_description:2 "$BULLET$Tăng lượng [opinion|E] nhận được khi tổ chức [GetActivityType('activity_feast').GetName]"
  court_musician_court_position_desc:1 "$court_musician_court_position$ là một nghệ sĩ ca hát và chơi nhạc cụ để mua vui cho Lãnh chúa và triều đình."
  food_taster_court_position:0 "Người Thử Thức ăn"
  food_taster_employer_custom_effect_description:3 "$BULLET$Có cơ hội ngăn chặn [schemes|E] [GetScheme('murder').GetTypeName] bằng Thuốc độc#!"
  food_taster_court_position_desc:1 "$food_taster_court_position$ có bổn phận đảm bảo đĩa thức ăn của Lãnh chúa không bao giờ bị nhiễm độc, và nếu thứ bột hay chất lỏng hiểm độc nào đó vẫn lọt vào bữa ăn... Thì đó chính là lý do người thử thức ăn phải nếm trước khi bữa tiệc bắt đầu."
  lady_in_waiting_court_position:0 "Thị nữ Hầu cận"
  lady_in_waiting_court_position_desc:1 "$lady_in_waiting_court_position$ là trợ lý và Ngài đồng hành của Nữ hoàng hoặc Nữ hoàng Đế quốc, phục vụ mọi nhu cầu và thực hiện mọi ý muốn của bà."

  executioner_court_position:0 "Đao phủ"
  executioner_employer_custom_effect_description:2 "$BULLET$Có thể công khai [execute|E] [prisoners|E] để tăng [control|E] và [county_opinion|E]\n@warning_icon! #X Tội ác của nhân vật sẽ được tha thứ#!"
  executioner_court_position_desc:1 "Đao phủ là những tội phạm, đổi lại tự do của mình, họ phải xử tử mọi kẻ thù của ngai vàng. Có người xem đó là vinh dự, có người coi đó là gánh nặng."
  executioner_terrify_court: "Gây Khiếp sợ Triều đình"
  executioner_terrify_court_desc: "Nhân vật này được diễu hành trong triều để đảm bảo mọi người biết rằng họ chỉ còn cách đoạn đầu đài một bước."

  garuda_court_position:0 "Garuda"
  garuda_employer_custom_effect_description:1 "$BULLET$Giảm nguy cơ Ngài tử trận hoặc bị bắt trong những trận chiến mà cả hai cùng tham gia"
  garuda_court_position_desc:0 "Hiệp sĩ này đã thề thực hiện ý chí của chủ quân hoặc chết khi cố gắng. Cũng như chim thần $garuda_court_position$ trong thần thoại mang trọng trách của Vishnu, các chiến binh $garuda_court_position$ gánh vác chủ quyền của quân vương."
  court_gardener_court_position:0 "Người Làm Vườn Hoàng Gia"
  court_gardener_court_position_desc:0 "$court_gardener_court_position$ chịu trách nhiệm chăm sóc các khu vườn thuộc về chủ quân của mình, dồn thời gian và kỹ năng để khiến chúng thực sự tươi tốt."
  chief_qadi_court_position:0 "Đại Qadi"
  chief_qadi_court_position_desc:0 "$chief_qadi_court_position$ là thẩm phán tối cao của lãnh địa, chịu trách nhiệm áp dụng luật Hồi giáo trong nhiều tranh chấp và vấn đề pháp lý."
  cultural_emissary_court_position:0 "Sứ Giả Văn Hóa"
  cultural_emissary_court_position_desc:0 "Mục đích của $cultural_emissary_court_position$ là thúc đẩy sự thấu hiểu giữa các nền văn hóa khác nhau thông qua việc tôn vinh và đề cao."
  court_artificer_court_position:0 "Thợ Thủ Công Hoàng Gia"
  court_artificer_court_position_desc:0 "Một $court_artificer_court_position$ là người đã chứng minh bản thân có thể chế tác những vật phẩm vĩ đại. Dù phần lớn thời gian họ chỉ quanh quẩn trong triều đình của Ngài, người ta vẫn hy vọng cảm hứng sẽ một lần nữa xuất hiện."
  court_artificer_employer_custom_effect_description:2 "$BULLET$Có cơ hội trở nên [inspired|E] trở lại (dựa trên [aptitude|E])\n@alert_icon! #alert_trial Sẽ rời khỏi [court|E] nếu bị sa thải#!"
  court_artificer_inspired_effect:0 "[GetCourtPositionType('court_artificer_court_position').GetName()] của Ngài là [artificer.GetFirstName] đã nhận được một [inspiration|E]"
  has_an_inspiration:0 "Có một [inspiration|E] đang hoạt động"
  has_a_completed_inspiration:0 "Đã từng hoàn thành một [inspiration|E]"
  COURT_POSITIONS_YOUR_SALARY:0 "$COURT_POSITION$"
  does_not_have_a_full_time_job:0 "Hiện #bold chưa#! được tuyển dụng toàn thời gian trong một [court_position|E] hoặc làm [councillor|E]"
  none_does_not_have_a_full_time_job: "Họ #bold chưa#! được tuyển dụng làm [councillor|E], [officer|E] trong trại, hoặc trong một [court_position|E] toàn thời gian"
  IS_NOT_APPLICABLE_DIARCH_COURT_POSITION: "Họ #bold không#! hiện đang [sharing_power|E] hoặc nằm trong [line_of_succession|E] để [share_power|E]"
  IS_NOT_GONE_ADVENTURING: "Họ #bold chưa#! đi phiêu lưu"
  none_has_no_particular_noble_roots_trigger: "Họ là [lowborn|E] hoặc thuộc một [dynasty|E] không đáng kể"
