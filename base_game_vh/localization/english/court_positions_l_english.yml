  court_position_jarquchi_obedience_modifier: "[GetCourtPositionType('yeke_jarquchi_court_position').GetName|U] [aptitude|E]"
  yeke_jarquchi_culture_acceptance: "Hòa Trộn Văn Hóa"
  yeke_jarquchi_culture_acceptance_desc: "Nhân vật này đảm bảo rằng tất cả những ai sinh sống trong lãnh địa có thể chung sống hòa bình, bất kể truyền thống và phong tục của họ."
  yeke_jarquchi_culture_acceptance_tt: "[cultural_acceptance|E] sẽ được tăng bởi [liege.Custom('GetAptitudeYekeJarquchiLoc')] giữa [liege.GetCulture.GetName] và các [cultures|E] khác trong [realm|E] mỗi năm #weak (tối đa #V 50#!)#!"
  yeke_jarquchi_aptitude: "[ROOT.Char.MakeScope.ScriptValue('yeke_jarquchi_aptitude_tooltip')|P0]"
