l_english:
  court_jester_prefix:0 "Hề Triều Đình: "
  jester.100.t:0 "$court_jester_prefix$Tên Hề Đối Thủ Của Ta, Phủ Đầy Phân"
  jester.100.desc:0 "Lại thêm một ngày căng thẳng... khi ta vừa ngồi xuống tìm chút yên tĩnh, cửa phòng bỗng bật tung.\n\nCó phải là tên đối thủ bị biến thành hề của ta — [jester.GetTitledFirstName] — đang khoác lên mình bộ [jester.Custom('GetClothingArticle')] sũng đầy chất bẩn cùng một món [jester.Custom('GetAccessory')|l] lòe loẹt đến khó tin!? Giờ thì [jester.GetSheHe] trông bên ngoài bẩn thỉu chẳng khác gì bản chất bên trong mà ta vẫn biết về [jester.GetHerHim]!\n\n\"[ROOT.Char.Custom('GetExpensiveDrink_Singular')] của ngài... thưa #EMP Bệ Hạ#!\" [jester.GetSheHe] nói, khuôn mặt [jester.GetHerHis] cau có thảm hại.\n\nSuy cho cùng, đôi khi cuộc sống cũng thật tốt đẹp."
  jester.100.a:0 "Nâng chén vì ngươi, [jester.GetFirstNameNoTooltip] thân mến!"
  covered_in_feces:0 "Phủ Đầy Phân"
  covered_in_feces_desc:1 "Nhân vật này đã bị phủ đầy chất thải từ đầu đến chân."
  jester.200.t:0 "$court_jester_prefix$Tiếng Cười Là Liều Thuốc Tốt Nhất"
  jester.200.desc:0 "\"Ngài đã nghe chuyện về [ROOT.Char.GetTitleTierName] và tên [ROOT.Char.Custom('lowly_servant_type')], thưa [ROOT.Char.Custom('FormOfAddressForLiege')] chưa? Câu chuyện như thế này!\" hề của ta, [jester.GetTitledFirstName], vui vẻ nói.\n\nMặt ta đỏ bừng và nước mắt vì cười chảy dài trên má — [jester.GetSheHe] lấy đâu ra lắm chuyện cười như vậy? [jester.GetSheHe|U] thật quá hài hước!\n\nCó lẽ đã đến lúc quay lại công việc, kẻo ta #EMP chết#! vì cười mất!"
  jester.200.a:0 "Kể tiếp đi!"
  jester.200.b:0 "Vui rồi đấy, ta phải trở lại làm việc!"
  death_laughter:0 "chết vì cười quá mức"
  jester.300.t:0 "$court_jester_prefix$Màn Tung Hứng Tuyệt Đỉnh"
  jester.300.desc:0 "\"Mời đến đại sảnh, thưa Bệ Hạ! Ngài phải xem thứ này!\" một người hầu đột nhiên kêu lên.\n\nKhi ta đến nơi, ta thấy hề của mình, [jester.GetTitledFirstName], đứng giữa phòng, điêu luyện tung hứng [ROOT.Char.Custom('DeviantObjectArticle')], [ROOT.Char.Custom('RandomPrivateObject')] của ta, một chai [ROOT.Char.Custom('GetExpensiveDrink_Singular')],"
  jester.300.desc_child:0 "[child_to_juggle.GetFirstName] bé nhỏ,"
  jester.300.desc_2:0 "[ROOT.Char.Custom('GetLivestockFowlIndef')], và [ROOT.Char.Custom('GetSmallFoodIndef')].\n\nTất cả người hầu đều nhìn với ánh mắt kinh ngạc. Và ta cũng vậy."
  jester.300.a:0 "Đúng là chuyện #EMP hiếm thấy#!!"
  jester.300.b:0 "Thôi được, tống [jester.GetHerHim] xuống ngục!"
  jester.400.t:0 "$court_jester_prefix$Một Nghệ Nhân Đánh Rắm Và Một Quý[jester.GetWomanMan]"
  jester.400.desc:0 "\"Bệ Hạ trông thật u sầu! Hãy để thần làm ngài vui lên bằng một bài thơ mà thần đã trau chuốt!\" hề của ta nói, chuông leng keng.\n\n\"Khụm, [jester.Custom('GeneratePoem_Title')]\"\n#flatulence *Tút tút*#!, [jester.GetSheHe] đánh rắm.\n\"[jester.Custom('GeneratePoem_Intro_Rhyming')]\"\n#flatulence *Tút tút tút*#!, [jester.GetSheHe] lại đánh rắm theo nhịp.\n\"[jester.Custom('GeneratePoem_Outro_Rhyming')]\"\n#flatulence *Tuuut*#!, tiếng rắm cuối cùng vang lên.\n\n\"Ngài thấy thế nào?\" [jester.GetSheHe] hỏi, khúc khích."
  jester.400.a:0 "Một thi sĩ #EMP lại còn#! là nghệ nhân đánh rắm!? Tài năng thật đáng kinh ngạc!"
  jester.400.b:0 "Ta thích lắm! Dạy ta vài chiêu được không?"
  aspiring_flatulist:0 "Kẻ Tập Sự Đánh Rắm"
  aspiring_flatulist_desc:0 "Nhân vật này đang theo đuổi nghệ thuật đánh rắm tao nhã và cao quý.\n#flatulence *Tút*#!"
  jester.500.t:0 "$court_jester_prefix$Kẻ Trộm Quần Áo"
  jester.500.desc:0 "Khi ta chuẩn bị lui về nghỉ đêm, một cảnh tượng hài hước khó tin diễn ra trước mắt ta — [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] của ta, [courtier.GetFirstName], trần truồng như ngày [courtier.GetSheHe] được sinh ra, đang cầm rìu đuổi theo hề triều đình của ta!\n\n\"Đứng lại đó! Trả quần áo cho ta, nếu không ta bổ ngươi làm đôi!\" [courtier.GetFirstNameNoTooltip] hét lên.\n\n\"Ôi chao, ngươi không bao giờ bắt được ta đâu! Ta cần quần áo của ngươi để xây cái tổ hề ấm cúng của ta!\" [jester.GetFirstName] khúc khích, tay ôm một đống quần áo ăn cắp."
  jester.500.a:0 "Ha ha! Đúng là thứ ta cần xem!"
  jester.500.b:0 "Dẫu cho cuộc vui này có thú vị đến đâu, hãy trả lại xiêm y cho [courtier.GetHerHim]!"
  jester.600.t:0 "$court_jester_prefix$Trận Chiến Thức Ăn"
  jester.600.desc:0 ""Thưa Bệ hạ, thần biết một cách sẽ khiến ngài vui lên — hãy nhìn kỹ khi thần lẻn tới con mồi của mình..." tên hề [jester.GetFirstName] thì thầm với Ta.\n[jester.GetSheHe] đang định làm gì vậy?\n\n"Đói không?" [jester.GetFirstNameNoTooltip] hét lên, ném [ROOT.Char.Custom('GetExpensiveDessertInTheFace')] thẳng vào mặt [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] của Ta là [courtier.GetFirstName]!\n\nBiểu cảm đó thật vô giá! Ồ, và [courtier.GetFirstNameNoTooltip] có vẻ đã đón nhận nó #EMP khá#! ổn. Ôi vui quá, thật là thú vị!"
  jester.600.a:0 "Đúng là một trò đùa kinh điển!"
  jester.600.b:0 "Để ta giúp ngươi lau sạch, [courtier.GetFirstNameNoTooltip]!"
  jester.600.c:0 "Thế thôi sao..? Giờ thì #EMP đánh nhau đi!#!"
  jester.700.t:0 "$court_jester_prefix$Màn Cà Khịa Chủ Nhật"
  jester.700.desc:0 "Tên hề của Ta, [jester.GetFirstName], đang đứng đối mặt với [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] của Ta là [courtier.GetFirstName] — và Ta vừa kịp nghe một màn cà khịa #EMP đặc biệt#! cay độc!\n\n"Ngươi là đồ [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))] [courtier.Custom2('InsultNounSexual', SCOPE.sC('jester'))] và [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))] [courtier.Custom2('InsultNoun', SCOPE.sC('jester'))], cái [courtier.Custom2('PointOfRidicule', SCOPE.sC('jester'))] và thói [courtier.Custom2('InsultBehavior', SCOPE.sC('jester'))] của ngươi đúng là huyền thoại! [courtier.Custom2('InsultSentence', SCOPE.sC('jester'))|U], đồ [courtier.Custom2('InsultNounSexual', SCOPE.sC('jester'))]!" [jester.GetFirstNameNoTooltip] nói, như thể bị [ROOT.Char.GetFaith.DevilName] nhập vậy!\n\nMặt [courtier.GetFirstNamePossessiveNoTooltip] đỏ bừng, nhưng [courtier.GetSheHe] biết Ta đang nhìn, nên [courtier.GetSheHe] cố nặn ra vài tiếng cười gượng gạo."
  jester.700.a:0 "Đúng là một màn cà khịa hay, #EMP rất#! hay!"
  jester.700.b:0 "Đừng buồn chứ [courtier.GetFirstNameNoTooltip]! Ngươi vẫn rất [courtier.Custom('ComplimentAdjective')] mà!"
  jester.800.t:0 "$court_jester_prefix$Hài Té Ngã"
  jester.800.desc:0 ""Ôi không! Có vẻ ta lại sắp ngã nữa rồi!" tên hề [jester.GetFirstName] của Ta kêu lên bằng giọng điệu khôi hài, "
  jester.800.desc_2:0 ""Ta thật là, thật là vụng về! Mong là lần này ta có thể đứng vững!" [jester.GetSheHe] nói, "
  jester.800.desc_3:0 ""[jester.Custom('CulturalCurse')|U]. Số ta đúng là đen đủi!" [jester.GetSheHe] khúc khích, "
  jester.800.desc_4:0 "Sau tất cả chuyện đó, trên người [jester.GetHerHis] chẳng có lấy một vết xước!"
  jester.800.a:0 "Ha! Ngã mà không bị thương, ấn tượng đấy!"
  jester.800.b:0 "Bah! Không có máu thì chẳng vui. Làm lại đi. #EMP Mạnh hơn.#!"
  fall_into_sculpture:0 "đâm sầm mặt vào [furniture_to_crash_into.GetName] của ta!\n\n"
  somersault_into_sculpture:0 "gần như lộn nhào lên [furniture_to_crash_into.GetName] của ta!\n\n"
  faceplant:0 "úp mặt xuống sàn nghe rõ mồn một!\n\n"
  walk_into_wall:0 "đi thẳng vào tường với một tiếng *rầm* vang dội!\n\n"
  weapon_pratfall:0 "ngã chúi lên [weapon_pratfall.GetName] của ta!\n\n"
  weapon_plummet:0 "rơi xuống nguy hiểm sát cạnh [weapon_pratfall.GetName] của ta!\n\n"
  forceful_tumble:0 "ngã lăn một cách đầy mạnh bạo!\n\n"
  jester.900.t:0 "$court_jester_prefix$Vài Tên Hề Trong Một Chiếc Áo"
  jester.900.desc:0 "Hửm. Ta chẳng nhớ tên hề [jester.Custom('ComplimentAdjective')] của ta lại... #EMP mập mạp#! đến mức này.\n\n"Thưa [ROOT.Char.GetLadyLord]! Xin thứ lỗi, thần... thần đã ăn hơi quá độ, và bụng dạ thần dường như không đồng tình với việc đó!" [jester.GetFirstName] nói, vẻ mặt đau đớn.\n\n#flatulence *Phẹt*#!\n\nĐột nhiên chiếc áo khoác sặc sỡ của tên hề vỡ toạc, "
  jester.900.cat:0 "để lộ cả một ổ mèo con! Phải đến ít nhất ba chục con — kêu meo meo và tràn khắp nơi!\n\n"
  jester.900.dog:0 "thả ra ít nhất mười hai chú cún vui vẻ, lập tức lao tới quấn lấy các cận thần của ta bằng cả mũi lẫn chân!\n\n"
  jester.900.bird:0 "lộ ra [ROOT.Char.Custom('GetLivestockFowlIndef')], rồi thêm một con nữa, rồi nữa, rồi nữa, #EMP rồi lại thêm nữa!#!\n\n"
  jester.900.eagle: "hé lộ một chú đại bàng non oai vệ, hào hứng tung cánh bay vòng quanh căn phòng!\n\n"
  jester.900.a:0 "Sẽ chẳng ai để ý nếu ta giữ lại chỉ #EMP một#! con..."
  jester.900.b:0 "À! Chú cún lanh lợi này sẽ cùng ta tham gia nhiều cuộc săn!"
  jester.900.c:0 "Ôi thật là một màn trình diễn! Tuyệt diệu!"
  jester.900.d: "Ta sẽ thuần hóa chú đại bàng non này và biến nó thành của riêng mình!"
  jester.1000.t:0 "$court_jester_prefix$Một Câu Chuyện Hay"
  jester.1000.desc:0 ""Ngài trông có vẻ mệt mỏi, [ROOT.Char.Custom('FormOfAddressForLiege')]," tên hề [jester.GetFirstName] nói.\n\n"Thần biết phương thuốc cho điều đó — nó gọi là '[SCOPE.Custom('RandomEntertainmentTextName')]', ngài thấy sao? Thần bắt đầu đọc nhé?" [jester.GetFirstNameNoTooltip] ra hiệu Ta ngồi xuống.\n\nĐó #EMP quả là#! một văn bản thú vị... Ta thực sự cần khoảng nghỉ này."
  jester.1000.a:0 "[jester.GetSheHe|U] thậm chí còn đổi giọng cho từng nhân vật!"
  jester.1000.b:0 "[jester.GetFirstNameNoTooltip], hay là kể ta nghe về chính ngươi đi?"
  jester.1000.c:0 "Ta muốn ngươi đọc từ #EMP [my_book.GetNameNoTooltip]!#!"
  jester.1000.c_flavor:0 "Ôi, ta yêu [my_book.GetName] biết bao!"
  reinvigorating_reading_modifier:0 "Đọc Sách Hồi Sức"
  reinvigorating_reading_modifier_desc:0 "Nhân vật này đã được nghe đọc to một trong những cuốn sách quý giá của mình, khiến họ được truyền cảm hứng."
  jester.1100.t:0 "$court_jester_prefix$Bóng Ma Trong [hiding_place.GetNameNoTooltip]"
  jester.1100.desc:0 "Tại sao lại có tiếng động phát ra từ [hiding_place.GetName]? Ta đảo mắt nhìn quanh, căn phòng trống không và tối mịt.\n\n#EMP *Cót két*#!\n\nChẳng lẽ là oan hồn? Hay yêu ma quỷ quái nào đó?\nĐột nhiên chỗ đó bật mở — lộ ra tên hề [jester.GetFirstName] đang nhảy cẫng lên, vung vẩy đôi tay!\n\n"Hãy coi chừng bóng ma trong [hiding_place.GetNameNoTooltip]! Ta tới đây để làm ngài cười đây!" kẻ đó reo lên đầy phấn khích."
  jester.1100.a:0 "Ha! Ngươi suýt lừa được ta rồi!"
  jester.1100.b:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName]... nếu ngươi là sát thủ thì sao!?"
  jester.1100.c:0 "Tim ta yếu lắm đó..!"
  jester.1100.d:0 "Lính đâu, mang búa và đinh tới đây..."
  jester.1100.d_flavor:0 "Nếu [jester.GetFirstNameNoTooltip] thực sự là 'bóng ma trong [hiding_place.GetNameNoTooltip]', thì [jester.GetSheHe] sẽ được ở trong đó thoải mái... suốt phần đời còn lại của [jester.GetHerHis]."
  death_heart_attack:0 "chết vì đau tim"
  death_nailed_in_cabinet:0 "bị đóng đinh vào một món đồ nội thất và bị bỏ đói đến chết"
  death_nailed_in_cabinet_killer:0 "bị đóng đinh vào một món đồ nội thất và bị bỏ đói đến chết bởi [TARGET_CHARACTER.GetUIName]"
  suspicious_of_furniture:0 "Đa Nghi Với Nội Thất"
  suspicious_of_furniture_desc:0 "Nhân vật này luôn đá thử bất kỳ món đồ nội thất lớn nào họ gặp. Nhiều lần."
  jester.1200.t:0 "$court_jester_prefix$Cỗ Máy Tin Đồn"
  jester.1200.desc:0 ""Ôi thưa ngài, ngài có nghe chuyện [vassal_1.GetTitledFirstName] đã khoe [vassal_1.GetHerHis] [vassal_1.Custom('ObjectifiedFeature')] nơi công cộng hôm qua không! Thật khó tin phải không?" [jester.GetFirstName] thì thầm vào tai Ta.\nTên hề của Ta đúng là nghe được đủ thứ chuyện.\n\n"Và — hô hô! Là thật đấy! [vassal_2.GetTitledFirstNamePossessive] [vassal_2_spouse.GetWifeHusband] đã gọi [vassal_2.GetHerHim] là #EMP [vassal_2.Custom2('InsultAdjectiveArticle', SCOPE.sC('jester'))] [vassal_2.Custom2('InsultNoun', SCOPE.sC('jester'))]!#! Đúng là kịch tính!" [jester.GetSheHe] tiếp tục.\n\n"Ồ, và ngài có biết [secret_holder.GetTitledFirstName] bí mật là [secret_holder.Custom('GetSecretCrimeDescIndef')] không?""
  jester.1200.a:0 "Tin đồn thật ngon lành!"
  jester.1200.b:0 "Khoan đã... chuyện gì về [secret_holder.GetTitledFirstNameNoTooltip] cơ!?"
  jester.1300.notification: "[jester.GetFirstName] đùa cợt về [jester.Custom('RandomObjectPlural')]"
  jester.1400.notification: "[jester_from_task.GetFirstName] giải trí cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_de_stress_target'))|U] của ngài là [first_de_stress_target.GetFirstName]"
  jester.1410.notification: "[jester_from_task.GetFirstName] giải trí cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_de_stress_target'))|U] của ngài là [second_de_stress_target.GetFirstName]"
  jester_entertainment_decision: "Để Triều Hề Giải Trí"
  jester_entertainment_decision_tooltip: "Để Triều Hề giải trí cho Ngài, giảm [stress|E]."
  jester_entertainment_decision_desc: "Trò đùa, nhào lộn, thơ ca! Hãy mang đến màn giải trí!"
  jester_entertainment_decision_confirm: "Giải trí cho ta!"
  jester_decision_rewards: "Triều Hề của Ngài được đưa tới trước mặt:\n$EFFECT_LIST_BULLET$Ngài giảm một ít [stress_loss_i] [stress|E]\n$EFFECT_LIST_BULLET$Có thể xuất hiện một Sự kiện giảm [stress|E] #weak (Triều Hề có [aptitude|E] cao hơn sẽ cho sự kiện tốt hơn)#!"
