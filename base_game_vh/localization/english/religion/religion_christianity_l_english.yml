 waldensian_adherent_plural:0 "Waldensian"
 waldensian_desc:0 "Cho rằng việc tích lũy của cải là điều bị nguyền rủa và không thể dung hòa với ơn cứu rỗi, người Waldensian rao giảng sự nghèo khó theo tinh thần tông đồ như con đường dẫn tới sự hoàn thiện, và tin rằng giáo sĩ không nên nắm giữ tước vị hay đất đai."

