 bosnian_church_desc:0 "Từ lâu đã bị cả Công giáo lẫn Chính thống giáo lãng quên, Krstjani ở vùng cao nguyên Bosnia khoan dung hơn so với những người đồng đạo nổi tiếng hơn của họ, nhưng lại thiếu cơ cấu tổ chức chính thức. Giữ lại nhiều yếu tố Kitô giáo cổ xưa, họ thường bị các tín hữu cùng tôn giáo coi thường, nếu như còn được nhớ tới."

