 adamites:0 "Adamite"
 adamites_adj:0 "Adamite"
 adamites_adherent:0 "Adamite"
 adamites_adherent_plural:0 "Các Adamite"
 adamites_desc:0 "Người Adamite cho rằng họ đã khôi phục lại trạng thái ngây thơ nguyên thủy của A-đam và Ê-va bằng cách cởi bỏ y phục. Các nhóm Adamite thường sống trong tình trạng vô luật tuyệt đối, tin rằng vì sự vô tội này, hành động của họ không thể bị coi là thiện hay ác."
