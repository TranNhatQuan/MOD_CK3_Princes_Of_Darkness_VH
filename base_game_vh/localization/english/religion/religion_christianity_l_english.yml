 armenian_apostolic_desc:1 "Do các Tông đồ Bác-thô-lô-mê-ô và Tha-đê-ô sáng lập, Giáo hội Tông truyền Armenia nhanh chóng thu hút tín đồ trong khu vực và dẫn dắt Vương quốc Armenia trở thành quốc gia đầu tiên chính thức tiếp nhận Cơ Đốc giáo."
