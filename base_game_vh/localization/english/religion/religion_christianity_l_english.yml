 cathar_desc:0 "Dạy rằng toàn bộ vật chất đều do Sa-tan tạo ra và vì thế vốn dĩ đã nhiễm tội lỗi, người Cathar tin rằng con đường duy nhất để đạt được ơn cứu rỗi là từ bỏ thế giới vật chất, cùng với mọi ham muốn trần tục."
