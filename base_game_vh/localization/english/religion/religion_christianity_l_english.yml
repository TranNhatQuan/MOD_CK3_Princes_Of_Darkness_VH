 iconoclast_desc:0 "Tin rằng mọi việc sử dụng biểu tượng tâm linh đều vi phạm Điều Răn Thứ Hai cấm tạo hình tượng chạm khắc, những người Bài Trừ Thánh Tượng tìm cách phá hủy các hình ảnh tôn giáo hiện có và bác bỏ việc tạo ra các hình ảnh mới."
 
