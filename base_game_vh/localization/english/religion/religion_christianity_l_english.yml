 bogomilist_adj:0 "Bogomil"
 bogomilist_adherent:0 "Bogomil"
 bogomilist_adherent_plural:0 "Các Bogomil"
 bogomilist_desc:0 "Chọn các lãnh đạo tinh thần từ chính cộng đồng, người Bogomil bác bỏ mọi phù hoa trần thế và các thể chế quyền lực, thay vào đó kêu gọi quay về những phương thức giảng dạy tâm linh ban đầu của Chúa Ki-tô và các môn đồ."
 bogomilist_priest:0 "người được chọn"
 bogomilist_priest_plural:0 "những người được chọn"

