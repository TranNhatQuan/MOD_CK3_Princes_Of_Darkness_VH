 nestorian:0 "Nestorian"
 nestorian_adj:0 "Nestorian"
 nestorian_adherent:0 "Nestorian"
 nestorian_adherent_plural:0 "Các Nestorian"
 nestorian_desc:0 "Giảng dạy rằng Chúa Giê-su Ki-tô có hai bản tính, một thần linh và một nhân loại, Nestorian bị hầu hết các đức tin Cơ Đốc khác coi là dị giáo. Dẫu vậy, quan điểm độc đáo này đã thu hút tín đồ trải dài từ Trung Hoa, Ấn Độ cho đến cả Mông Cổ."
 nestorian_religious_head_title:0 "Thượng phụ"
