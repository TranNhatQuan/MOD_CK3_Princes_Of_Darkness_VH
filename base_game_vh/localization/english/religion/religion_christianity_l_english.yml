 paulician_adherent:0 "Paulician"
 paulician_adherent_plural:0 "Các Paulician"
 paulician_desc:0 "Bác bỏ tính thần linh của Chúa Ki-tô và coi việc tôn kính thánh giá là ngoại giáo, người Paulician tìm cách khôi phục hình thức Cơ Đốc giáo mà họ tin là chân chính, như được Thánh Phao-lô thành Tác-xô truyền dạy."
