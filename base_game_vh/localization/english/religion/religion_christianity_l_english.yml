 mozarabic_church_adherent:0 "Mozarab"
 mozarabic_church_adherent_plural:0 "Người Mozarab"
 mozarabic_church_desc:0 "Là hậu duệ của các nghi lễ Iberia thời kỳ đầu, Cơ Đốc giáo Mozarab đã duy trì mức độ độc lập nhất định với Rôma do nhiều thế kỷ sống dưới sự cai trị Hồi giáo. Việc chung sống lâu dài với các đức tin khác khiến họ khoan dung hơn với sự khác biệt so với các giáo phái chính thống cực đoan."

 adoptionist:0 "Thuyết Nhận Tử"
 adoptionist_adj:0 "Nhận Tử"
 adoptionist_adherent:0 "Tín đồ Nhận Tử"
 adoptionist_adherent_plural:0 "Các tín đồ Nhận Tử"
 adoptionist_desc:0 "Nhánh Nhận Tử tại Iberia bắt nguồn từ sự kết hợp giữa tư duy độc lập của Tổng giáo phận Toledo và các giáo khu lân cận, chủ nghĩa khổ hạnh Bắc Phi trong nhiều thế kỷ trước, cùng với một số giáo chủ dị giáo đầu thế kỷ IX có sức lôi cuốn đặc biệt.\n\nDù tồn tại dưới nhiều hình thức, từ tinh vi đến thẳng thừng, điểm giáo lý thống nhất của họ là thái độ hoài nghi đối với bản tính thần linh vĩnh cửu của Người Con."
 adoptionist_religious_head_title:0 "Tổng giám mục"
 adoptionist_religious_head_title_name:0 "Tổng giáo phận"

 conversos:0 "Conversos"
 conversos_adj:0 "Converso"
 conversos_adherent:0 "Converso"
 conversos_adherent_plural:0 "Conversos"
 conversos_desc:0 "Conversos hình thành khi các cộng đồng Do Thái bị cưỡng bức cải đạo sang Cơ Đốc giáo. Dù đã tiếp nhận đức tin mới, họ vẫn ghi nhớ truyền thống cũ và cảm thông với những người còn theo chúng."

 #Orthodox-Group Faiths
 orthodox:0 "Chính Thống giáo"
 orthodox_adj:0 "Chính Thống"
 orthodox_adherent:0 "Tín đồ Chính Thống"
 orthodox_adherent_plural:0 "Các tín đồ Chính Thống"
 orthodox_desc:0 "Khẳng định rằng các giám mục của mình là những người kế vị trực tiếp và chân chính của các tông đồ của Chúa Ki-tô, Giáo hội Chính Thống Đông phương tự nhận là đức tin Cơ Đốc nguyên thủy được truyền lại qua truyền thống phụng vụ thiêng liêng."
