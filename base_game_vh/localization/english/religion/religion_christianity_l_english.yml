 lollard_adherent:0 "Lollard"
 lollard_adherent_plural:0 "Lollard"
 lollard_desc:0 "Lên án nhiều bí tích Kitô giáo phổ biến như phép rửa và xưng tội, người Lollard cho rằng Kinh Thánh là nguồn giáo lý Kitô giáo duy nhất hợp lệ, và mọi giáo huấn không trực tiếp dựa trên đó đều vốn dĩ là phi chính thống."

