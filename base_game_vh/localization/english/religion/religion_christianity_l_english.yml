 insular_celtic_adherent_plural:0 "Insular"
 insular_celtic_desc:1 "Là một giáo hội nông thôn đã tách xa chính thống Công giáo Rôma từ nhiều thế kỷ trước, Kitô giáo Insular đã đánh mất nhiều đặc điểm riêng từng có theo yêu cầu của giáo hội mẹ. Tuy vậy, nó vẫn duy trì sự nhấn mạnh mạnh mẽ hơn vào việc sám hối và đời sống tu viện, đồng thời dung hợp nhiều phong tục hôn nhân truyền thống của người Celt vốn xa lạ với Kitô giáo rộng lớn."

