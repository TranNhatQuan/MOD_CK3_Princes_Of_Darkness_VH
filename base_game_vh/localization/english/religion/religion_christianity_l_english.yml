 messalian_adherent_plural:0 "Các Messalian"
 messalian_desc:0 "Tin rằng bản thể của Thiên Chúa có thể được cảm nhận qua các giác quan thể xác, người Messalian bác bỏ các bí tích Cơ Đốc truyền thống và thay vào đó tìm cách trực tiếp trải nghiệm Thiên Chúa bằng những hình thức thờ phụng ít quy ước hơn."
 messalian_priest:0 "hoàn hảo giả"
