  priscillianism_adherent:0 "Tín đồ Priscillian"
  priscillianism_adherent_plural:0 "Các tín đồ Priscillian"
  priscillianism_desc:0 "Tồn tại hai vương quốc, một của Ánh Sáng và một của Bóng Tối. Linh hồn con người được định sẵn để chinh phục Vương Quốc Bóng Tối, nhưng đã sa ngã và bị giam cầm trong cõi vật chất. Trong loài người có Mười Hai Tộc Trưởng Ánh Sáng đã thất bại trong việc vượt qua Bóng Tối vì họ bị chia cắt giữa thể xác và linh hồn. Vì thế Thượng Đế đã phái Đấng Cứu Thế xuống trần gian, và thông qua cái chết của Ngài, một lần nữa mở ra con đường giải phóng linh hồn nhân loại."
  priscillianism_high_god_name:0 "Thần Tính"
  priscillianism_high_god_name_2:0 "$priscillianism_high_god_name$" # Optional translation alt
  priscillianism_high_god_name_possessive:0 "của Thần Tính"
  priscillianism_good_god_saviour:0 "Đấng Cứu Thế"
  priscillianism_good_god_the_light:0 "Ánh Sáng"

