  sethianism_desc:0 "Thượng Đế Vô Danh đã phát xuất toàn bộ tồn tại vào Pleroma hoàn hảo, nơi được lấp đầy bởi các aeon ân phúc, đứng đầu là Barbelo, Mẹ-Cha.\nMột sự băng hoại đã sinh ra Yaldabaoth, kẻ đánh cắp một mảnh thần tính và tạo ra thế giới vật chất. Tuy nhiên, khi tạo ra loài người, hắn vô tình trao cho họ tia thần tính bị đánh cắp ấy. Yaldabaoth sẽ vĩnh viễn tìm cách giành lại quyền năng của mình, trong khi loài người phải nỗ lực trở về với Barbelo và Thượng Đế Vô Danh."
