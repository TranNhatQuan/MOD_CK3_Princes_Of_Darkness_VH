 #Rabbinism
  rabbinism:0 "Do Thái giáo Rabbinism"
  rabbinism_adj:0 "Rabbinic"
  rabbinism_adherent:0 "Tín đồ Rabbinism"
  rabbinism_adherent_plural:0 "Tín đồ Rabbinism"
  rabbinism_desc:1 "Rabbinism nhấn mạnh vai trò của các rabbi như những người diễn giải luật tôn giáo Halakha. Luật lệ và truyền thống là điều đảm bảo giao ước với Đức Chúa được duy trì, và các rabbi bảo vệ những luật lệ đó."

 #Karaite
  karaism:0 "Do Thái giáo Karaite"
  karaism_adj:0 "Karaite"
  karaism_adherent:0 "Tín đồ Karaite"
  karaism_adherent_plural:0 "Tín đồ Karaite"
  karaism_desc:0 "Trong các vấn đề luật tôn giáo, chỉ riêng Tanakh là thẩm quyền tối cao và tuyệt đối. Vai trò của các rabbi không phải là đánh giá lại hay điều chỉnh các quy tắc của giao ước, mà là diễn giải ý nghĩa nguyên văn của chúng."

 #Haymanot
  haymanot:0 "Haymanot"
  haymanot_adj:0 "Haymanot"
  haymanot_adherent:0 "Tín đồ Haymanot"
  haymanot_adherent_plural:0 "Tín đồ Haymanot"
  haymanot_desc:0 "Các rabbi, hay kahen, phán xét các vấn đề luật tôn giáo, nhưng họ phối hợp cùng một hội đồng trưởng lão phán xét các vấn đề về truyền thống và đời sống."
  haymanot_religious_text:0 "Orit"
  haymanot_religious_text_2:0 "$haymanot_religious_text$" # Optional translation alt
  haymanot_religious_text_3:0 "$haymanot_religious_text$" # Optional translation alt
  haymanot_religious_head_title:0 "Liqa Kahnet"
  haymanot_devotee:0 "Monkosa"
  haymanot_devotee_plural:0 "Monkosa"
  haymanot_priest:0 "Kahen"
  haymanot_priest_plural:0 "Kahen"
  haymanot_bishop:0 "Shmagle"
  haymanot_bishop_plural:0 "Shmagle"

 #Malabar
  malabarism:0 "Do Thái giáo Malabar"
  malabarism_adj:0 "Malabar"
  malabarism_adherent:0 "Người Malabar"
  malabarism_adherent_plural:0 "Người Malabar"
  malabarism_desc:1 "Khi hậu duệ của các bộ tộc Israel lan rộng khắp thế giới, họ xây dựng những cộng đồng nhỏ từ tây sang đông, hoạt động như những bộ tộc riêng biệt. Còn được gọi là người Do Thái Cochin, họ định cư tại Vương quốc Cochin ở miền Nam Ấn Độ. Tại đó, họ hòa trộn với người bản địa và trao đổi văn hóa."

 #Samaritan
  samaritan:0 "Do Thái giáo Samaritan"
  samaritan_adj:0 "Samaritan"
  samaritan_adherent:0 "Người Samaritan"
  samaritan_adherent_plural:0 "Người Samaritan"
  samaritan_desc:0 "Có nguồn gốc từ các bộ tộc định cư tại Samaria, người Samaritan tuân theo một phiên bản nguyên bản, không thay đổi của Torah. Theo cách này, họ thực hành tôn giáo chân chính của Moses và thi hành trực tiếp những nghĩa vụ do Thượng Đế ban cho."

 #Kabarism
  kabarism:1 "Kuzarism"
  kabarism_adj:1 "Kuzarite"
  kabarism_adherent:1 "Người Kuzari"
  kabarism_adherent_plural:1 "Người Kuzari"
  kabarism_desc:2 "Là một cộng đồng cải đạo, người Kuzarite tuân theo cách diễn giải Halakha Rabbinic phổ biến. Ngay cả rất lâu sau khi cải đạo, họ vẫn tiếp tục giữ gìn một số tín ngưỡng và truyền thống địa phương với sự tôn kính tôn giáo."
 
 #Merkabah
  merkabah:0 "Merkabah"
  merkabah_adj:0 "Merkabah"
  merkabah_adherent:0 "Tín đồ Merkabah"
  merkabah_adherent_plural:0 "Tín đồ Merkabah"
  merkabah_desc:0 "Huyền học Merkabah là một giáo phái huyền bí của Do Thái giáo, chịu ảnh hưởng phần nào từ các giáo lý Ngộ Đạo. Đức tin này tập trung vào các thị kiến, theo đuổi lối sống khổ hạnh để hợp nhất với Ngai Vị của Thượng Đế."

  doctrine_temple_authority_name:0 "Thẩm quyền Halakha"
  doctrine_temple_authority_desc:0 "Halakha đề cập đến một tập hợp các luật lệ và quy tắc mà một người Do Thái phải tuân theo trong cuộc sống. Sau nhiều thế kỷ lưu vong, các nhóm Do Thái đã phân hóa thành nhiều trường phái tư tưởng khác nhau trong việc diễn giải Halakha."
  temple_authority_rabbinic_doctrine_name:0 "Rabbinic"
  temple_authority_rabbinic_doctrine_desc:0 "Người Do Thái Rabbinic tin rằng Halakha chỉ có thể được diễn giải bởi các rabbi. Họ tin vào Torah Thành Văn và Torah Truyền Khẩu, được truyền lại thông qua các rabbi. Toàn bộ niềm tin Rabbinic được hệ thống hóa trong Talmud Babylon, được xem là nguồn chính để diễn giải và truyền bá Halakha."
  temple_authority_toric_doctrine_name:0 "Toraic"
  temple_authority_toric_doctrine_desc:0 "Do Thái giáo Toraic bác bỏ Talmud và Torah Truyền Khẩu, trao thẩm quyền cho Torah Thành Văn. Các rabbi không thể thay đổi hay điều chỉnh Halakha; nhiệm vụ của họ chỉ là diễn giải ý nghĩa nguyên văn của Torah."
  temple_authority_kohanim_doctrine_name:0 "Kohenimic"
  temple_authority_kohanim_doctrine_desc:0 "Do Thái giáo Kohenimic khẳng định rằng các Kohen là thẩm quyền tối cao trong mọi vấn đề tôn giáo, bao gồm cả Halakha. Kohen phải có dòng dõi phụ hệ trực tiếp từ Aaron, anh trai của Moses."
  temple_authority_samaritan_torah_doctrine_name:0 "Samaritan"
  temple_authority_samaritan_torah_doctrine_desc:0 "Người Samaritan bác bỏ hoàn toàn thẩm quyền của Torah, thay vào đó trao thẩm quyền tối cao cho Samaritan Torah. Việc bác bỏ Torah khiến họ bị các tín hữu khác coi là dị giáo."
  doctrine_parameter_hostility_override_temple_authority_samaritan_torah_doctrine:0 "Coi các [faiths|E] theo [GetFaithDoctrine('temple_authority_samaritan_torah_doctrine').GetBaseName] là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  doctrine_parameter_hostility_override_temple_authority_rabbinic_doctrine:0 "Coi các [faiths|E] theo [GetFaithDoctrine('temple_authority_rabbinic_doctrine').GetBaseName] là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  doctrine_parameter_hostility_override_temple_authority_toric_doctrine:0 "Coi các [faiths|E] theo [GetFaithDoctrine('temple_authority_toric_doctrine').GetBaseName] là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  doctrine_parameter_hostility_override_temple_authority_kohanim_doctrine:0 "Coi các [faiths|E] theo [GetFaithDoctrine('temple_authority_kohanim_doctrine').GetBaseName] là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  doctrine_parameter_enables_temporal_head_parameter:0 "Cho phép lựa chọn [doctrine|E] Người Đứng Đầu Tôn Giáo Thế Tục."

  tenet_communal_identity_chosen_people_name:0 "Dân Tộc Được Chọn"
  tenet_communal_identity_chosen_people_desc:0 "Chúng ta được [ROOT.Faith.HighGodName] chọn cho một giao ước thiêng liêng. Điều này gắn kết dân tộc ta vào một mục đích chung, nhưng cũng có thể cản trở việc cải đạo."
