l_english:
 doctrine_muhammad_succession_name:0 "Kế Vị của Muhammad"
 doctrine_muhammad_succession_desc:0 "Câu hỏi ai là người kế vị chính danh của Muhammad với tư cách là lãnh đạo tinh thần của cộng đồng Hồi giáo là một vấn đề mang tính cốt yếu."
 muhammad_succession_sunni_doctrine_name:0 "Sunni"
 muhammad_succession_sunni_doctrine_desc:0 "Abu Bakr đã được Ummah lựa chọn làm lãnh đạo chính danh của họ, cả về chính trị lẫn tôn giáo."
 doctrine_parameter_hostility_override_muhammad_succession_sunni_doctrine_1:1 "Coi các [faiths|E] Sunni khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_muhammad_succession_sunni_doctrine: "Coi các [faiths|E] Sunni khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 muhammad_succession_shia_doctrine_name:0 "Shia"
 muhammad_succession_shia_doctrine_desc:0 "Ali đã được Muhammad chỉ định làm lãnh đạo của Ummah, và chỉ thông qua ông thì dòng dõi lãnh đạo tinh thần mới có thể được truy nguyên."
 doctrine_parameter_hostility_override_muhammad_succession_shia_doctrine_1: "Coi các [faiths|E] Shia khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_muhammad_succession_shia_doctrine: "Coi các [faiths|E] Shia khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 muhammad_succession_muhakkima_doctrine_name:0 "Muhakkima"
 muhammad_succession_muhakkima_doctrine_desc:0 "Ali là người kế vị chính danh của Muhammad, và việc ông chấp nhận trọng tài trong Cuộc Fitna Thứ Nhất vì thế đã đi ngược lại ý chí của Allah! Chỉ có Ngài mới có thể phán xét ai là lãnh đạo xứng đáng cho chúng ta."
 doctrine_parameter_hostility_override_muhammad_succession_muhakkima_doctrine_1: "Coi các [faiths|E] Muhakkima khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_muhammad_succession_muhakkima_doctrine: "Coi các [faiths|E] Muhakkima khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 muhammad_succession_zandaqa_doctrine_name:0 "Zandaqa"
 muhammad_succession_zandaqa_doctrine_desc:0 "Dù chúng ta có truy nguyên đúng hay không dòng dõi của Nhà Tiên Tri theo quan điểm của những người Hồi giáo khác, thì niềm tin của chúng ta vẫn khiến ta trở thành kẻ bị ruồng bỏ. Cứ để những kẻ tội lỗi gọi chúng ta là Zandaqa — chúng ta biết đâu là chân lý!"
