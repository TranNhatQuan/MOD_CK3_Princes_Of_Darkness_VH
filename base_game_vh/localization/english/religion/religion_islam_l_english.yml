 islam_religion_desc:0 "Hồi giáo là mặc khải cuối cùng của các tôn giáo Abraham, được dẫn dắt bởi lời của Thượng Đế, như đã được mặc khải cho Nhà Tiên tri Muhammad. Tôn giáo này tập trung vào việc sống một cuộc đời tốt đẹp trong sự phụng sự Đấng Thượng Đế duy nhất và đầy lòng thương xót."
