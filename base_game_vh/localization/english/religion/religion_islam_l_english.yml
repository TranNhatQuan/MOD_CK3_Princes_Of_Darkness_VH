 #Ash'ari
 ashari:0 "Ash'ari"
 ashari_adj:0 "Ash'ari"
 ashari_adherent:0 "Tín đồ Ash'ari"
 ashari_adherent_plural:0 "Các tín đồ Ash'ari"
 ashari_desc:0 "Một trường phái thần học chính thống cho rằng Allah đã tạo ra mọi khoảnh khắc trong thời gian, nhưng con người có ý chí tự do để lựa chọn giữa điều thiện — những gì Thượng Đế truyền lệnh — và điều ác — những gì Thượng Đế cấm đoán."

 #Muwalladism
 muwalladi:0 "Muwallad"
 muwalladi_adj:0 "Muwallad"
 muwalladi_adherent:0 "Tín đồ Muwallad"
 muwalladi_adherent_plural:0 "Các tín đồ Muwallad"
 muwalladi_desc:1 "Xa rời trung tâm của thế giới Ả Rập, người Hồi giáo Iberia đã thích nghi với thực tế cai trị một vùng đất có đông đảo dân cư Kitô giáo và Do Thái giáo với những truyền thống xa lạ."

 #Masmudism
 masmudi:1 "Almohad"
 masmudi_adj:1 "Almohad"
 masmudi_adherent:1 "Tín đồ Almohad"
 masmudi_adherent_plural:1 "Các tín đồ Almohad"
 masmudi_desc:2 "Một nhánh cải cách của Hồi giáo Sunni có nguồn gốc từ các bộ lạc Berber ở Bắc Phi. Phong trào Almohad coi mình là những người theo thuyết nhất nguyên và rao giảng học thuyết độc thần thuần khiết."
 masmudi_religious_head_title:0 "Caliph"
 masmudi_religious_head_title_name:0 "caliphate"

 #Mu'tazila
 mutazila:0 "Mu'tazila"
 mutazila_adj:0 "Mu'tazili"
 mutazila_adherent:0 "Tín đồ Mu'tazila"
 mutazila_adherent_plural:0 "Các tín đồ Mu'tazila"
 mutazila_desc:0 "Một trường phái thần học duy lý cho rằng Kinh Qur'an #EMP không#! đồng tồn tại vĩnh hằng với Thượng Đế, bởi Thượng Đế phải tồn tại trước chính lời của Ngài."

 #Maturidi
 maturidi:0 "Maturidi"
 maturidi_adj:0 "Maturidi"
 maturidi_adherent:0 "Tín đồ Maturidi"
 maturidi_adherent_plural:0 "Các tín đồ Maturidi"
 maturidi_desc:0 "Một trường phái thần học duy lý cho rằng đạo đức có sự tồn tại khách quan, bắt nguồn từ những phẩm tính vĩnh hằng của Thượng Đế, và vì thế con người phải theo đuổi những lựa chọn mang tính đạo đức."
 
 #Quranism
 quranist:0 "Quranism"
 quranist_adj:0 "Quranist"
 quranist_adherent:0 "Quranist"
 quranist_adherent_plural:0 "Quranists"
 quranist_desc:0 "Một cách diễn giải Hồi giáo theo lối nguyên văn, nhấn mạnh rằng Kinh Quran là nguồn duy nhất của trí tuệ thiêng liêng và phải được tuân theo một cách tuyệt đối, đồng thời bác bỏ hadith và fatwa."

 #Ismaili
 ismaili:0 "Isma'ilism"
 ismaili_adj:0 "Isma'ili"
 ismaili_adherent:0 "Isma'ili"
 ismaili_adherent_plural:0 "Isma'ilis"
 ismaili_desc:0 "Một đức tin Shia cho rằng dòng dõi các Imam chân chính — những người được ban tri thức thiêng liêng và sự không thể sai lầm — được tiếp nối qua Isma'il ibn Ja'far. Họ còn được gọi là Thất Imam, vì Isma'il là Imam thứ bảy sau Muhammad."

 #Qarmatians
 qarmatian:0 "Qarmatianism"
 qarmatian_adj:0 "Qarmatian"
 qarmatian_adherent:0 "Qarmatian"
 qarmatian_adherent_plural:0 "Qarmatians"
 qarmatian_desc:0 "Một nhánh của Isma'ilism có pha trộn các yếu tố của Hỏa giáo. Số lượng Imam được Thượng Đế tiền định là bảy, và do đó không thể có thêm Imam nào trước khi Imam thứ bảy — Muhammad ibn Isma'il — trở lại để dẫn dắt các tín đồ."

 #Nizari
 nizari:0 "Nizarism"
 nizari_adj:0 "Nizari"
 nizari_adherent:0 "Nizari"
 nizari_adherent_plural:0 "Nizaris"
 nizari_desc:0 "Một đức tin duy lý, nhấn mạnh việc suy luận trong quá trình diễn giải Kinh Quran và các hadith. Chức vị Imam được truyền theo huyết thống, và họ truy nguyên dòng kế vị về Ali."
 
 #Zayidi
 zayidi:0 "Zayidism"
 zayidi_adj:0 "Zayidi"
 zayidi_adherent:0 "Zayidi"
 zayidi_adherent_plural:0 "Zayidis"
 zayidi_desc:0 "Một Imam chân chính không phải là người không thể sai lầm, mà được xác định bởi cuộc đấu tranh của họ chống lại sự băng hoại và cái ác. Do đó, người Zayidi tin rằng Zayd ibn Ali là người kế vị chính danh của Imamate, bởi cuộc khởi nghĩa của ông chống lại triều đại Umayyad."

 #Imamism (Twelver)
 imami:0 "Imamism"
 imami_adj:0 "Imami"
 imami_adherent:0 "Imami"
 imami_adherent_plural:0 "Imamis"
 imami_desc:0 "Người Imami tin rằng Mười Hai Imam đã được tiên tri là sẽ lãnh đạo Ummah, và rằng Imam thứ mười hai — Imam Zaman — đang chờ ngày trở lại để dẫn dắt người Hồi giáo bước vào Ngày Phán Xét."
 islam_ayatollah:0 "ayatollah"
 islam_ayatollah_plural:0 "ayatollahs"

 #
 ghulat:1 "Ikhtilafism"
 ghulat_adj:1 "Ikhtilafi"
 ghulat_adherent:1 "Ikhtilafi"
 ghulat_adherent_plural:1 "Ikhtilafis"
 ghulat_desc:1 "Người Ikhtilafi tin vào bản chất thiêng liêng của các Imam không thể sai lầm, bắt đầu từ Ali. Thượng Đế không chỉ bổ nhiệm và truyền cảm hứng cho họ, mà còn phần nào ngự trong họ để dẫn dắt hành động của họ, và qua đó dẫn dắt toàn thể Ummah."

 alawite:0 "Alawism"
 alawite_adj:0 "Alawite"
 alawite_adherent:0 "Alawi"
 alawite_adherent_plural:0 "Alawis"
 alawite_desc:0 "Giáo lý Alawi mang tính bí truyền, và Kinh Quran chỉ là một trong những thánh điển của họ. Bên cạnh niềm tin vào dòng kế vị Imam thông qua Ali, người Alawi còn tin vào luân hồi, và rằng mọi sinh linh đều từng là những vì sao bị trục xuất khỏi thiên đường, nay phải tái sinh qua nhiều kiếp sống thiện lành và trung tín để giành lại vị trí của mình."

 #Alevis
 alevi:0 "Alevism"
 alevi_adj:0 "Alevi"
 alevi_adherent:0 "Alevi"
 alevi_adherent_plural:0 "Alevis"
 alevi_desc:0 "Người Alevi tin vào sự kế vị của Mười Hai Imam, nhưng đồng thời cũng tuân theo nhiều truyền thống khác được ghi chép trong bộ thánh thư của họ, Buyruk. Trong truyền thống Alevi, Thượng Đế là Chân Lý, còn Muhammad và Ali là những biểu hiện của Ngài trong thế giới trần tục."
 alevi_house_of_worship:0 "cemvi"
 alevi_house_of_worship_2:0 "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_3:0 "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_plural:0 "cemvis"
 alevi_religious_text:0 "Buyruks"
 alevi_religious_text_2:0 "$alevi_religious_text$" # Optional translation alt
 alevi_religious_text_3:0 "$alevi_religious_text$" # Optional translation alt

 #Druze
 druze:0 "Druze"
 druze_adj:0 "Druze"
 druze_adherent:0 "Druze"
 druze_adherent_plural:1 "Druze"
 druze_desc:0 "Xuất thân từ Núi Druze, đức tin Druze tuân theo nhiều nguyên lý của Isma'ilism, đồng thời bao gồm các tín ngưỡng ngộ đạo với nền thần học huyền vi tập trung vào Chân Lý của sự tồn tại."
 druze_religious_text:0 "Thư Tín Minh Triết"
 druze_religious_text_2:0 "$druze_religious_text$" # Optional translation alt
 druze_religious_text_3:0 "$druze_religious_text$" # Optional translation alt

 #Ibadi
 ibadi:1 "Ibadism"
 ibadi_adj:0 "Ibadi"
 ibadi_adherent:0 "Ibadi"
 ibadi_adherent_plural:0 "Ibadis"
 ibadi_desc:0 "Người Ibadi không tin rằng toàn bộ thế giới Hồi giáo nhất thiết phải được cai trị bởi một Caliph hay một Imam, nếu không có ứng viên phù hợp. Do đó, họ thuộc phái Muhakkima, không công nhận cả dòng dõi của Ali lẫn những người kế vị Abu Bakr là những lãnh đạo xứng đáng."

 #Azariqa
 azariqa:1 "Azraqism"
 azariqa_adj:0 "Azariqa"
 azariqa_adherent:0 "Azariqa"
 azariqa_adherent_plural:0 "Azariqas"
 azariqa_desc:0 "Không công nhận bất kỳ người kế vị xứng đáng nào của Muhammad, người Azariqa cho rằng họ có quyền và nghĩa vụ đấu tranh chống lại mọi lãnh đạo không giữ vững các giá trị của đức tin. Trên thực tế, bất kỳ sự khác biệt nào trong cách diễn giải đức tin cũng đủ để bị coi là kẻ ngoại đạo."

 #Najdat
 najdat:0 "Najdatism"
 najdat_adj:0 "Najdat"
 najdat_adherent:0 "Najdati"
 najdat_adherent_plural:0 "Najdatis"
 najdat_desc:0 "Những người theo nhánh Najdati của Khawarij kiên định tin vào việc thiết lập quyền lãnh đạo Hồi giáo thông qua sự đồng thuận của các tín đồ. Lãnh đạo không phải là người không thể sai lầm, nhưng thông qua cộng đồng mà được Thượng Đế lựa chọn."
 
 #Sufri
 sufri:0 "Sufrism"
 sufri_adj:0 "Sufri"
 sufri_adherent:0 "Sufri"
 sufri_adherent_plural:0 "Sufris"
 sufri_desc:0 "Người Sufri tin vào sự dẫn dắt và lãnh đạo thiêng liêng thông qua việc diễn giải lời của Thượng Đế, thay vì thông qua thừa kế. Ý chí của Thượng Đế được thể hiện như là ý chí của Ummah, miễn là các thành viên của Ummah thông thạo Kinh Quran."

 #Hafizi
 hafizi:0 "Hafizi"
 hafizi_adj:0 "Hafizi"
 hafizi_adherent:0 "Hafizi"
 hafizi_adherent_plural:0 "Hafizis"
 hafizi_desc:0 "Người Hafizi đặt việc ủng hộ người mà họ cho là Caliph chân chính lên trên tất cả, đồng thời chống lại mọi nỗ lực nhằm phế truất hoặc lật đổ vị lãnh đạo đó. Trong thất bại, họ được định hình bởi sự nổi dậy vì một chính nghĩa xứng đáng; còn trong chiến thắng, là sự tuân phục đầy tự hào trước ý chí của lãnh đạo của họ."
