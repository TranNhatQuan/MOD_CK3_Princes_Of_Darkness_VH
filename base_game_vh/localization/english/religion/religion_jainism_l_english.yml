 #Digambara
 digambara:0 "Digambara"
 digambara_adj:0 "Digambara"
 digambara_adherent:0 "Digambara"
 digambara_adherent_plural:0 "các Digambara"
 digambara_desc:0 "Kevala Jnana giải phóng thân xác khỏi mọi nhu cầu vật chất. Tuy nhiên, linh hồn chỉ có thể được giải thoát khi hoàn toàn trần trụi, vì vậy các tu sĩ Digambara phải sống không quần áo."

 #Svetambara
 svetambara:0 "Svetambara"
 svetambara_adj:0 "Svetambara"
 svetambara_adherent:0 "Svetambara"
 svetambara_adherent_plural:0 "các Svetambara"
 svetambara_desc:0 "Kevala Jnana là trạng thái của linh hồn, chứ không phải của thể xác. Thông qua đời sống thiện hạnh, con người có thể đạt được toàn tri và rời khỏi vòng luân hồi vô tận. Khoảnh khắc đạt đến moksha chỉ có thể xảy ra qua cái chết, khi người đó trở thành Siddha."
 svetambara_devotee_male:0 "sadhu"
 svetambara_devotee_male_plural:0 "sadhu"
 svetambara_devotee_female:0 "sadhvi"
 svetambara_devotee_female_plural:0 "sadhvi"

 #Yapaniya
 yapaniya:0 "Yapaniya"
 yapaniya_adj:0 "Yapaniya"
 yapaniya_adherent:0 "Yapaniya"
 yapaniya_adherent_plural:0 "các Yapaniya"
 yapaniya_desc:1 "Đức tin của các tín đồ Kỳ-na giáo Yapaniya có nhiều điểm tương đồng với cả truyền thống Svetambara lẫn Digambara, khiến tín đồ của cả hai phái đều tranh cãi. Các tu sĩ khổ hạnh Yapaniya được kỳ vọng sẽ sống trần trụi giống như Digambara, nhưng không tuân theo những quy tắc khắt khe của họ. Đức tin này cũng cho rằng phụ nữ có thể đạt được Moksha, và các ni sư là điều phổ biến trong tôn giáo này."
 yapaniya_devotee_male:0 "sadhu"
 yapaniya_devotee_male_plural:0 "sadhu"
 yapaniya_devotee_female:0 "sadhvi"
 yapaniya_devotee_female_plural:0 "sadhvi"
