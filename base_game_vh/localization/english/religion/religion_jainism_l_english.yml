 jainism_religion_adherent_plural:0 "các tín đồ Kỳ-na"
 jainism_religion_desc:0 "Các tín đồ Kỳ-na tìm cách noi theo hai mươi bốn bậc thầy, các Tirthankara, để thoát khỏi vòng luân hồi sinh tử vĩnh hằng của thế gian bằng cách đạt đến toàn tri, Kevala Jnana. Bất bạo động và đời sống thiện hạnh là cốt lõi của Kỳ-na giáo, và lời cầu nguyện quan trọng nhất của họ khẳng định rằng \"chức năng của các linh hồn là giúp đỡ lẫn nhau.\""
