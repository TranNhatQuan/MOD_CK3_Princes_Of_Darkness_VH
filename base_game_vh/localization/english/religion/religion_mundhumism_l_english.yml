 mundhum_religion_desc:0 "Mundhum giáo là một truyền thống tôn giáo của các dân tộc Kirati vùng Himalaya, tập trung vào những câu chuyện và bài ca cổ xưa được gọi là Mundhum, mà họ coi là kinh điển của mình. Mundhum giáo là một tôn giáo dung hợp, kết hợp nhiều vị thần và tập tục từ Ấn Độ giáo cùng với việc thờ cúng tổ tiên."
