 #Zhengyi
  zhengyi:0 "Chính Nhất"
  zhengyi_adj:0 "Chính Nhất"
  zhengyi_adherent:0 "Tín đồ Chính Nhất"
  zhengyi_adherent_plural:0 "Các tín đồ Chính Nhất"
  zhengyi_desc:0 "Khác với các tông phái Đạo giáo khác, Chính Nhất tuân theo một trật tự thần quyền nghiêm ngặt dưới quyền Thiên Sư. Các tín đồ chế tác và buôn bán bùa hộ mệnh nhằm ngăn chặn sự thất thoát khí, nguồn sinh lực duy trì mọi sinh vật sống."
 
