 #Shangqing
  shangqing:0 "Thượng Thanh"
  shangqing_adj:0 "Thượng Thanh"
  shangqing_adherent:0 "Tín đồ Thượng Thanh"
  shangqing_adherent_plural:0 "Các tín đồ Thượng Thanh"
  shangqing_desc:0 "Đạo giáo Thượng Thanh là hình thức Đạo giáo giữ vị thế chủ đạo trong thời nhà Đường. Các tín đồ tìm cách hài hòa bản thân với vũ trụ thông qua thiền định và các bài luyện tập thể chất, thay vì sử dụng bùa chú và thuật luyện đan như các nhánh Đạo giáo khác."

 #Quanzhen
  quanzhen:0 "Toàn Chân"
  quanzhen_adj:0 "Toàn Chân"
  quanzhen_adherent:0 "Tín đồ Toàn Chân"
  quanzhen_adherent_plural:0 "Các tín đồ Toàn Chân"
  quanzhen_desc:0 "Các tín đồ Đạo giáo Toàn Chân thực hành nội đan để hoàn thiện thân thể và hài hòa bản thân với Đạo. Thông qua quá trình này, người tu luyện đạt được tuổi thọ thể xác lâu dài và sự bất tử về tinh thần."
