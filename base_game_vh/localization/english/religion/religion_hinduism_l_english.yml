 #Srikula Shaktism
 srikula_shaktism:0 "Phái Shaktism Srikula"
 srikula_shaktism_adj:0 "Srikula"
 srikula_shaktism_adherent:0 "Tín đồ Srikula"
 srikula_shaktism_adherent_plural:0 "Các tín đồ Srikula"
 srikula_shaktism_desc:0 "Phái Shaktism tin vào Đại Nữ Thần như Đấng Tối Thượng từ đó mọi tồn tại sinh ra. Phái Srikula tôn thờ Tripura Sundari như phương diện tối cao nhất của Nữ Thần, và là nguồn gốc của toàn bộ Shakti, năng lượng của vũ trụ."
