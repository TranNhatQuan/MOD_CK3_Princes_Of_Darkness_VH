 krishnaism_high_god_name_possessive:0 "của Krishna"

 #Advaitism
 advaitism:0 "Advaita Vedanta"
 advaitism_adj:0 "Advaita"
 advaitism_adherent:0 "Tín đồ Advaita Vedanta"
 advaitism_adherent_plural:0 "Các tín đồ Advaita Vedanta"
 advaitism_desc:0 "Không giống nhiều tín ngưỡng Ấn Độ giáo khác, Advaita Vedanta nhấn mạnh sự hợp nhất giữa Atman, bản ngã chân thật, với Brahman, thực tại tối thượng, và tin rằng moksha có thể đạt được cả khi còn sống lẫn sau khi chết."

 #Saura
 saura: "Phái Saura"
 saura_adj: "Saura"
 saura_adherent: "Tín đồ Saura"
 saura_adherent_plural: "Các tín đồ Saura"
 saura_desc: "Surya, Thần Mặt Trời, Brahman hữu hình, là vị thần tối cao của phái Saura. Bắt nguồn từ truyền thống Veda, phái Saura mô tả Surya ngự trên một cỗ xe được kéo bởi bảy con ngựa, mỗi con tượng trưng cho một màu của cầu vồng."

