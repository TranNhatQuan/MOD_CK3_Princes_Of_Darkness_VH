 shaivism_desc:0 "Tín đồ Shaiva tôn thờ Shiva, đấng sáng tạo và hủy diệt các thế giới, như Đấng Tối Thượng hiện hữu trong vạn vật. Cũng như Shiva nỗ lực duy trì sự cân bằng và bảo tồn vũ trụ, những người mộ đạo phải cố gắng mang sự cân bằng vào cuộc sống của chính mình."
