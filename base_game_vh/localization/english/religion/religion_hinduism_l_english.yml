 #Kalikula Shaktism
 kalikula_shaktism:0 "Phái Shaktism Kalikula"
 kalikula_shaktism_adj:0 "Kalikula"
 kalikula_shaktism_adherent:0 "Tín đồ Kalikula"
 kalikula_shaktism_adherent_plural:0 "Các tín đồ Kalikula"
 kalikula_shaktism_desc:0 "Phái Shaktism tin vào Đại Nữ Thần như Đấng Tối Thượng từ đó mọi tồn tại sinh ra. Phái Kalikula tôn thờ Kali như đấng có thể ban sự chỉ dẫn, tái sinh tốt đẹp và cuối cùng là moksha."

 #Smartism
 smartism:1 "Phái Smarta"
 smartism_adj:1 "Smarta"
 smartism_adherent:1 "Tín đồ Smarta"
 smartism_adherent_plural:1 "Các tín đồ Smarta"
 smartism_desc:0 "Truyền thống Smarta bác bỏ việc thờ phụng các vị thần riêng lẻ. Brahman là một và vĩnh hằng, còn Vishnu, Devi, Shiva, Ganesh và Surya được tôn thờ như những hóa thân bình đẳng của Đấng Tối Thượng. Mọi hình thức thờ phụng cá nhân đều là một bước trên con đường đạt tới sự thấu hiểu và hợp nhất với Brahman."

 smartism_health_god_name:0 "Vishnu"
 smartism_health_god_name_possessive:0 "của Vishnu"
 smartism_household_god_name:0 "Shiva"
 smartism_household_god_name_possessive:0 "của Shiva"
 smartism_knowledge_god_name:0 "Ganesha"
 smartism_knowledge_god_name_possessive:0 "của Ganesha"
 smartism_war_god_name:0 "Devi"
 smartism_war_god_name_possessive:0 "của Devi"

 #Krishnaism
 krishnaism:0 "Phái Krishna"
 krishnaism_adj:0 "Krishna"
 krishnaism_adherent:0 "Tín đồ Krishna"
 krishnaism_adherent_plural:0 "Các tín đồ Krishna"
 krishnaism_desc:0 "Krishna là hình thái đích thực của Đấng Tối Thượng, còn Vishnu là hóa thân của Ngài khi Ngài mang hình dạng toàn năng. Thông qua các hóa thân thần thánh của mình, Ngài hiện diện trong vạn vật."
