 #Doctrines for FP3 

  doctrine_zoroastrian_branches_name: "Thiện và Ác"
  doctrine_zoroastrian_branches_desc: "Chúng ta nên ủng hộ hàng giáo sĩ đã được thiết lập cùng giáo lý của họ để bảo vệ đức tin khỏi dị giáo — hay chính họ mới là những kẻ lầm lạc và băng hoại?" 
  doctrine_major_branch_behdin_name: "Behdin"
  doctrine_major_branch_behdin_desc: "Dù có thể khác biệt ở một số chi tiết thực hành, chẳng phải các tín đồ Zoroastrian chính thống đều đồng thuận về nền tảng trung thành với Ahura Mazda sao?"
  doctrine_heretic_branch_zandik_name: "Korramdin"
  doctrine_heretic_branch_zandik_desc: "Những kẻ theo $doctrine_major_branch_behdin_name$ gọi chúng ta là dị giáo, bị ruồng bỏ và lật đổ trật tự. Dù chẳng có gì gắn kết chúng ta ngoài sự khinh miệt của họ, chính nghĩa thôi thúc sự kháng cự của chúng ta và sự khinh thường ấy càng làm trái tim ta trở nên cứng rắn."
  doctrine_parameter_hostility_override_doctrine_major_branch_behdin: "Coi các [faiths|E] Behdin khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
  doctrine_parameter_hostility_override_doctrine_heretic_branch_zandik: "Coi các [faiths|E] Korramdin khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
