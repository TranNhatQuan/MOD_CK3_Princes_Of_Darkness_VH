 #Mazdayasna
  mazdayasna:0 "Mazdayasna"
  mazdayasna_adj:0 "Mazdaya"
  mazdayasna_adherent:0 "Mazdaya"
  mazdayasna_adherent_plural:0 "Các tín đồ Mazdaya"
  mazdayasna_desc:1 "Con người hỗ trợ cuộc đấu tranh chống lại #italic Aka Manah#! thông qua tư tưởng và lối sống thiện lành. Điều này được thực hiện bằng sự thanh tẩy nghi lễ, bảo tồn thiên nhiên và tiêu diệt các sinh vật tà ác."

 #Behafaridism
  zurvanism:1 "Behafaridism"
  zurvanism_adj:1 "Behafaridi"
  zurvanism_adherent:1 "Behafaridite"
  zurvanism_adherent_plural:1 "Các tín đồ Behafaridite"
  zurvanism_desc:1 "Những người theo giáo lý của Behafarid, $zurvanism_adherent_plural$ tìm cách hợp tác với thế giới Hồi giáo, tiến hành nhiều cải cách đức tin để đáp lại các chỉ trích của người Hồi giáo đối với Bái Hỏa giáo truyền thống. Các cải cách này bao gồm cấm sử dụng rượu, phản đối nghiêm ngặt hôn nhân cận huyết và khuyến khích làm từ thiện như một cách sử dụng của cải vì lợi ích cộng đồng."
 

 #Zurvanism doctrine - FP3 update: removed from doctrine_asceticism and saved for possible future Fatalism tenet. 
  tenet_zurvanism_name:0 "Zurvanism"
  tenet_zurvanism_desc:1 "Tín đồ Zurvan tin rằng Ohrmazd và Ahriman là hai anh em song sinh ngang bằng nhưng đối lập, được sinh ra từ Zurvan, Đấng Tạo Hóa của vạn vật. Zurvanism đặc biệt nhấn mạnh việc trợ giúp Ahura Mazda bằng cách tiêu diệt cái ác và sự dối trá."
  zurvanism_creator_god_name:0 "Zurvān"
  zurvanism_creator_god_name_possessive:0 "của Zurvān"



 #Gayomarthianism
  gayomarthianism:0 "Gayomarthianism"
  gayomarthianism_adj:0 "Gayomarthian"
  gayomarthianism_adherent:0 "Gayomarthian"
  gayomarthianism_adherent_plural:0 "Gayomarthians"
  gayomarthianism_desc:1 "Dựa trên quan niệm rằng Ahura Mazda đã vô tình tạo ra các linh hồn tà ác thông qua tư tưởng của mình, tín đồ Gayomarthian bác bỏ tính không thể sai lầm của Chúa Tể Trí Tuệ, và thay vào đó nhấn mạnh thực hành nghi lễ để học hỏi Chân Lý trong sự hiệp thông với Ahura Mazda." 

 #Khurmazta
  khurmazta:0 "Khurmazdism"
  khurmazta_adj:0 "Khurmazta"
  khurmazta_adherent:0 "Khurmazta"
  khurmazta_adherent_plural:0 "Khurmazta"
  khurmazta_desc:1 "Có cội nguồn sâu xa trong sự pha trộn tôn giáo của Sogdiana, Khurmazta tôn thờ một tập hợp rộng lớn các vị thần và linh hồn, cả tổ tiên lẫn phổ quát. Họ cũng tôn kính các thánh tượng, điều bị nhiều nhánh Zoroastrian khác xem là báng bổ. Tuy vậy, dù một số khía cạnh đức tin của họ có độc đáo đến đâu, về nhiều mặt họ vẫn nằm trong quỹ đạo của giáo lý Zoroastrian chính thống, thực hành các nghi thức thanh tẩy và chăm sóc ngọn lửa vĩnh cửu với lòng sùng kính không ngơi nghỉ."
