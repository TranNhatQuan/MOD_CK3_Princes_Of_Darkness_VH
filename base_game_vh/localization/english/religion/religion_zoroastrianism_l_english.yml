 #Mazdakism
  mazdakism:0 "Mazdakism"
  mazdakism_adj:0 "Mazdakite"
  mazdakism_adherent:0 "Mazdakite"
  mazdakism_adherent_plural:0 "Mazdakites"
  mazdakism_desc:1 "Các nhà tiên tri cấp tiến Zardusht Khuragan và Mazdak chịu ảnh hưởng từ những tín ngưỡng huyền học của thời kỳ cổ đại muộn, và cổ xúy việc sở hữu tài nguyên chung cùng sự hợp tác phổ quát giữa con người nhằm vượt qua năm con quỷ: tham lam, phẫn nộ, đố kỵ, chiếm hữu và báo thù."

 #Khurramism
  khurramism:0 "Khurramism"
  khurramism_adj:0 "Khurramite"
  khurramism_adherent:0 "Khurramite"
  khurramism_adherent_plural:0 "Khurramites"
  khurramism_desc:1 "Trong một thế giới của Ánh Sáng và Bóng Tối, những kẻ thống trị bất công phải bị lật đổ để ủng hộ điều thiện. Thông qua các nhà tiên tri như Mazdak, Abu Muslim và al-Muqanna, tín đồ Khurram tin rằng thần tính được sinh ra trong nhân loại, và một ngày nào đó sẽ trở lại để lãnh đạo họ với tư cách là Đấng Cứu Thế."

