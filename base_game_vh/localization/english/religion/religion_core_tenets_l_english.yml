 tenet_pursuit_of_knowledge_name: "Theo Đuổi Tri Thức"
 tenet_pursuit_of_knowledge_desc: "Những người sinh ra đã được ban cho tri thức là những kẻ ưu việt nhất. Những người tự nguyện tìm kiếm tri thức đứng hàng thứ hai. Còn những kẻ ngu dốt và không chịu học hỏi là tầng lớp thấp kém nhất."
