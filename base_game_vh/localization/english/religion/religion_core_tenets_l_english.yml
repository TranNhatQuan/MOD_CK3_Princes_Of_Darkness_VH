  tenet_exaltation_of_pain_desc:0 "Đau đớn là cảm xúc phổ quát, bạo lực là ngôn ngữ phổ quát. Trao đau đớn cho kẻ khác là ban phước cho họ, cũng như tự mình tiếp nhận đau đớn là tiếp nhận ân sủng."
