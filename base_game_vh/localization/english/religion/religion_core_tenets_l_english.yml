  doctrine_parameter_hostility_override_special_doctrine_is_eastern_faith:0 "Coi các [faiths|E] [GetReligionFamily('rf_eastern').GetName] là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$, và cũng được các [game_concept_faiths|E] $rf_eastern$ coi như vậy"
