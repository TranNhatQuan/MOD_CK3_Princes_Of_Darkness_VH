l_english:
 doctrine_core_tenets_name:1 "Giáo lý cốt lõi"
 tenets_name:0 "Giáo lý"

 #Abrahamic Tenets
 tenet_communion_name:0 "Hiệp thông"
 tenet_communion_desc:0 "Các nghi lễ của chúng ta không chỉ mang tính biểu tượng — chúng triệu hồi chính sự hiện diện của thần linh. Những kẻ không thể hoặc không chịu tham gia thực hành các nghi lễ này thì không thể là tín đồ chân chính."
 doctrine_parameter_seek_indulgences_active:1 "Nhân vật có thể #V Xin Ân xá#! từ [head_of_faith|E] để trả [gold|E] đổi lấy [piety|E]"
 doctrine_parameter_seek_indulgences_active_2:0 "Nhân vật đã thực hiện các hành vi [criminal|E] có thể #V Xin Ân xá#! để được tha thứ cho các hành vi đó"
 doctrine_parameter_excommunication_active:0 "[heads_of_faith|E] có thể [excommunicate|E] các nhân vật khác cùng [faith|E]"
 tenet_excommunicated:0 "[GetTrait('excommunicated').GetName( GetNullCharacter )]"

 tenet_armed_pilgrimages_name:0 "Hành hương có vũ trang"
 tenet_armed_pilgrimages_desc:0 "Những người hành hương của chúng ta đi khắp thế giới để viếng thăm các thánh địa — và chúng ta sẵn sàng cầm gươm để bảo vệ họ khỏi bất kỳ kẻ nào muốn làm hại"
 doctrine_parameter_cheaper_holy_wars_active:0 "Các [rulers|E] của [faith|E] này tốn ít hơn #P -20%#! [piety|E] khi tuyên bố [holy_wars|E]"
 doctrine_parameter_great_holy_wars_active:1 "Nếu tồn tại [head_of_faith|E], có thể tuyên bố một [great_holy_war|E] khi [faith|E] có [fervor|E] cao"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active:0 "Nếu không tồn tại [head_of_faith|E], tín đồ nhận thưởng cho nhiệm vụ [convert_county|E] của [councillor_task|E] cho mỗi [holy_site|E] đang kiểm soát"
 doctrine_parameter_pilgrimage_decision_active:1 "Nhân vật của [faith|E] này nhận thêm thưởng khi hoàn thành thành công một chuyến [pilgrimage|E]"

 tenet_monasticism_name:0 "Tu viện chủ nghĩa"
 tenet_monasticism_desc:0 "Những khoái lạc của thức ăn và đồ uống chỉ khiến chúng ta xao nhãng khỏi việc phụng sự thần linh. Tự cô lập trong các tu viện hẻo lánh là cách tốt nhất để tránh những cám dỗ đó."
 doctrine_parameter_take_vows_active:0 "[courtiers|E] có thể Phát nguyện và trở thành một [GetTrait('devoted').GetName( GetNullCharacter )]"

 tenet_divine_marriage_name:0 "Hôn nhân thiêng liêng"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc:0 "Bằng cách kết hôn với người thân cận huyết, chúng ta noi theo những mối kết hợp linh thiêng của các thực thể đầu tiên trong công cuộc sáng tạo. Những phẩm chất tốt đẹp sẽ được truyền lại qua dòng tộc, giúp chúng ta đạt được sự thuần khiết và ân sủng trong cuộc chiến vĩnh cửu chống lại cái ác."
 doctrine_parameter_divine_marriage_opinion:0 "Tín đồ kết hôn với thành viên [close_family|E] nhận $VALUE|0+=$ [opinion|E] từ [vassals|E] cùng [faith|E]"
 doctrine_parameter_divine_marriage_piety_gain_active:2 "Thưởng hôn nhân của giáo lý [GetFaithDoctrine('doctrine_monogamy').GetBaseName] cũng ban cho một lượng lớn [piety|E] nếu kết hôn với [close_family|E]"
 
 tenet_pacifism_name:0 "Chủ nghĩa hòa bình"
 tenet_pacifism_desc:0 "Bạo lực là hành vi đáng ghê tởm chỉ dẫn đến đau khổ, mất mát và hối hận. Bằng cách tránh nó bất cứ khi nào có thể, chúng ta có thể xây dựng những xã hội mạnh mẽ và an toàn hơn cho các tín đồ."
 doctrine_parameter_holy_wars_forbidden:0 "Không thể tuyên bố [holy_wars|E] hoặc [raid|E]"
 doctrine_parameter_pacifist_opinion_active:0 ""
 pacifist_opinion_active_opinion_name:0 "Đồng đạo Hòa bình"
 pacifist_opinion_active_county_opinion_name:0 "Hạt theo Chủ nghĩa hòa bình"
 doctrine_parameter_opinion_of_pacifist_opinion_active:0 "[opinion|E] đối với các tín đồ Hòa bình khác: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace:0 "Người cai trị hòa bình ít nhất hai năm sẽ thay đổi [piety|E] mỗi tháng là $VALUE|+$"
 PIETY_LONG_PEACE:0 "Hòa bình lâu dài"

 tenet_vows_of_poverty_name:0 "Lời thề nghèo khó"
 tenet_vows_of_poverty_desc:0 "Tiền bạc làm băng hoại trái tim con người và đẩy họ rời xa đức tin chân chính. Chúng ta phải từ bỏ việc tích lũy của cải vật chất nếu muốn tập trung vào những điều thực sự quan trọng."
 doctrine_parameter_vows_of_poverty_active:0 "[rulers|E] có thể [decide|E] phát Lời thề Nghèo khó, giảm thu nhập [tax|E] hàng tháng nhưng tăng [piety|E] hàng tháng"

 tenet_human_sacrifice_name:0 "Hiến tế con người"
 tenet_human_sacrifice_desc:0 "Cách tốt nhất để chứng minh lòng sùng kính của chúng ta là thông qua hành vi hiến tế. Sự hiến tế quý giá nhất mà chúng ta có thể dâng lên chính là mạng sống con người."
 doctrine_parameter_human_sacrifice_active:1 "[executions|E] mang lại [piety|E] thay vì tiêu tốn [piety|E]\n$EFFECT_LIST_BULLET$[executions|E] không bao giờ tiêu tốn [prestige|E] khi [sharing_power|E]"
 doctrine_parameter_flower_war_cb_active:0 "Ban cho [casus_belli|E] [flowery_war|E] chống lại các lãnh thổ lân cận"

 tenet_gruesome_festivals_blot_name:0 "Blót"
 tenet_gruesome_festivals_name:0 "Lễ hội man rợ"
 tenet_gruesome_festivals_desc:0 "Tất cả chúng ta sinh ra trong máu. Chúng ta sống nhờ máu của gia súc, gia đình và kẻ thù. Việc [ROOT.Faith.PantheonTerm] đòi phần của mình là điều hoàn toàn tự nhiên."
 gruesome_festivals_active_name:0 "khả năng tổ chức hiến tế lớn"
 doctrine_parameter_gruesome_festivals_active:0 "Có thể tổ chức hiến tế lớn khoảng một lần mỗi thập kỷ để tăng thiện cảm của chư hầu cùng [faith|E] và [county_opinion|E]"

 tenet_volcanic_veneration_name:0 "Tôn thờ núi lửa"
 tenet_volcanic_veneration_desc:0 "Không có gì thiêng liêng hơn mảnh đất mới sinh phun trào từ những hố lửa quê hương chúng ta. Chúng ta sống bên bờ thảm họa, mãi phụ thuộc vào [ROOT.Faith.PantheonTerm]."
 tenet_cthonic_redoubts_name:0 "Thành lũy lòng đất"
 tenet_cthonic_redoubts_desc:0 "Không nơi trú ẩn nào tốt hơn rễ của Địa cầu, không pháo đài nào vững chắc hơn những gai đá nhô lên, không cuộc hành hương nào linh thiêng hơn những lối mòn ẩn giấu. Từ những đỉnh cao này, chúng ta nhìn xuống Sáng thế và cảm nhận sức nặng thực sự của Thần linh."
 doctrine_parameter_easier_to_convert_faith_in_mountains:0 "Tốc độ [convert_county|E] ở [terrain|E] núi: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains:0 "Tốc độ [promote_culture|E] ở [terrain|E] núi cùng [faith|E]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains:0 "Tốc độ [convert_county|E] thù địch ở [terrain|E] núi: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"

 tenet_consolamentum_name:1 "Endura"
 tenet_consolamentum_name_alternate:0 "Tự sát nghi lễ"
 tenet_consolamentum_desc:0 "Khi già yếu hoặc bệnh tật, chúng ta tiến hành một nghi lễ để thanh tẩy linh hồn khỏi tội lỗi. Sau đó, chúng ta nhanh chóng và dứt khoát kết liễu mạng sống, để tội lỗi không có cơ hội quay trở lại."
 doctrine_parameter_consolamentum_active:1 "Tín đồ có thể [decide|E] kết thúc cuộc đời khi già yếu, mất năng lực hoặc cận kề cái chết; việc này không chịu bất kỳ hình phạt thông thường nào của tự sát"

 tenet_gnosticism_name:0 "Ngộ đạo luận"
 tenet_gnosticism_desc:0 "Thông qua tri thức, tia lửa thần thánh ẩn chứa bên trong mỗi con người có thể được giải phóng và trở về nguồn cội thiên giới của nó trong cõi linh hồn."
 doctrine_parameter_hostility_override_tenet_gnosticism:3 "Xem các [faiths|E] Ngộ đạo và Nhị nguyên khác là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_hostile_tooltippable$ hoặc $hostility_evil_tooltippable$"
 doctrine_parameter_hostility_override_special_doctrine_is_gnostic_faith:0 ""
 doctrine_parameter_granting_titles_gives_stress:0 "Trao đi [titles|E] giúp giảm một lượng [stress|E] tương ứng"

 tenet_mendicant_preachers_name:0 "Giảng đạo khất thực"
 tenet_mendicant_preachers_desc:0 "Các nhà truyền giáo của chúng ta chu du khắp nơi chỉ với bộ quần áo trên người. Họ sống nhờ lòng hào hiệp của những người họ ghé thăm, và đổi lại chia sẻ tri thức về đức tin chân chính."
 doctrine_parameter_mendicant_preachers_conversion_active:0 "Tốc độ Cải đạo Hạt: #P +33#!"

 tenet_communal_identity_name:0 "Bản sắc cộng đồng"
 tenet_communal_identity_desc:0 "Đức tin và văn hóa của chúng ta gắn kết chặt chẽ với nhau. Thực hành này củng cố mối liên kết trong cộng đồng, nhưng thường loại trừ người ngoại lai."
 doctrine_parameter_same_communal_identity_opinion_active:0 "#P +10#! [opinion|E] với các nhân vật cùng [faith|E]"
 doctrine_parameter_same_culture_conversion_bonus_active:1 "Tốc độ Cải đạo ở các [counties|E] thuộc [culture|E] của ta: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active:1 "Tốc độ Quảng bá Văn hóa ở các [counties|E] cùng [faith|E]: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active:1 "Tốc độ Cải đạo ở các [counties|E] khác [culture|E]: #N -50%#!"

 tenet_pentarchy_name:0 "Giáo quyền thể chế"
 tenet_pentarchy_alternate_name:0 "Ngũ đại giáo tòa"
 tenet_pentarchy_desc:0 "Các Thánh địa của chúng ta không chỉ là nơi linh thiêng — chúng chính là những trung tâm quyền lực nơi các lãnh đạo tôn giáo cai trị."

 tenet_aniconism_name:0 "Bài trừ thánh tượng"
 tenet_aniconism_desc:0 "Việc thờ phụng hình tượng đã làm mù quáng quá nhiều người trước chân lý thần thánh. Chúng ta sẽ loại bỏ mọi thánh tượng khỏi các thánh địa để tín đồ không sa vào cạm bẫy đó."
 doctrine_parameter_reforging_artifacts_costs_piety:0 "[rulers|E] của [faith|E] này phải tiêu tốn [piety|E] để [reforge|E] hoặc [repair|E] [artifacts|E]"
 doctrine_parameter_destroying_artifacts_is_pious:0 "[rulers|E] của [faith|E] này có thể phá hủy [artifacts|E] để nhận [piety|E]"
 destroying_artifacts_is_not_pious_tt:0 "[faith|E] của Ngài không thể phá hủy [artifacts|E] để nhận [piety|E]"
 artifact_is_rarer_than_masterwork_tt:0 "[artifact|E] này có [rarity|E] cao hơn cấp Tinh xảo"

 tenet_alexandrian_catechism_name:0 "Giáo lý Alexandria"
 tenet_alexandrian_catechism_desc:0 "Trường Giáo lý Alexandria từng có truyền thống lâu đời trong việc khuyến khích các thần học gia tư duy phản biện và chất vấn hiện trạng.\n\nDù ngôi trường đã bị hủy diệt về mặt vật chất, chúng ta vẫn tiếp nối những truyền thống ấy."
 tenet_islamic_rationalism_name: "Chủ nghĩa duy lý Hồi giáo"
 tenet_islamic_rationalism_desc: "Vì [ROOT.Faith.HighGodNameAlternate] là đấng công minh và khôn ngoan, [ROOT.Faith.HighGodNameSheHe|U] không thể đi ngược lại lý trí hay xem nhẹ phúc lợi của tạo vật của [ROOT.Faith.HighGodHerHis|U]. Chỉ thông qua lý trí thuần túy, chúng ta mới có thể hiểu được vai trò của mình trong công trình vĩ đại của [ROOT.Faith.HighGodHerHis|U] và phân biệt thiện với ác."

  tenet_hedonistic_name:0 "Chủ nghĩa khoái lạc"
  tenet_hedonistic_desc:0 "Thần linh đã ban cho thế giới này vô vàn khoái lạc để chúng ta tận hưởng — từ chối chúng chẳng khác nào khước từ chính công trình sáng tạo."
  doctrine_parameter_piety_from_feasts_active:1 "Tổ chức một [GetActivityType('activity_feast').GetName] nhận được [piety|E]"
  doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" # Chỉ hiển thị nếu bạn có AUH
  doctrine_parameter_piety_from_festivals_active_auh: "Tổ chức một [GetActivityType('activity_festival').GetName] nhận được [piety|E]"

 tenet_carnal_exaltation_name:0 "Tôn vinh nhục dục"
 tenet_carnal_exaltation_desc:0 "Khoái lạc thể xác mang vẻ đẹp siêu việt, vượt lên trên mọi trải nghiệm trần thế khác và đưa chúng ta đến gần thần linh hơn. Chúng ta nên tôn vinh ham muốn tình dục và tìm kiếm cơ hội để thỏa mãn chúng."

 tenet_polyamory_name:0 "Đa ái"
 tenet_polyamory_desc:0 "Tình yêu của chúng ta dành cho nhau nên vô điều kiện như tình yêu của [ROOT.Faith.FertilityGodNamePossessive] dành cho chúng ta. Chúng ta phải gạt bỏ quan niệm lỗi thời rằng một người có thể sở hữu tình cảm của người khác."
 doctrine_parameter_no_unfaithfulness_penalty_active:0 "Tín đồ không chịu [opinion|E] phạt hay [imprisonment_reasons|E] đối với phối ngẫu hoặc người tình của phối ngẫu vì các mối quan hệ ngoài hôn nhân"

 tenet_unrelenting_faith_name:0 "Đức tin bất khuất"
 tenet_unrelenting_faith_desc:0 "Niềm tin của chúng ta vô cùng kiên định, và chúng ta sẵn sàng chiến đấu và hy sinh vì đức tin ấy. Dù cho nghịch cảnh có chồng chất đến đâu, chúng ta cũng sẽ không đầu hàng."
 tenet_unrelenting_faith_zandik_name: "Khởi nghĩa chính nghĩa"
 tenet_unrelenting_faith_zandik_desc: "Chúng ta không mong gây hại cho bất kỳ linh hồn hay sự vật nào, nhưng nếu con đường của mình bị đe dọa, chúng ta sẽ bảo vệ nó bằng sự hung mãnh không khoan nhượng." 

 tenet_rite_name:0 "Nghi lễ"
 tenet_rite_desc:0 "Niềm tin của chúng ta không khác biệt nhiều so với đức tin mẹ... vậy tại sao phải tranh cãi tiểu tiết khi chúng ta đồng thuận về các giáo lý cốt lõi và, quan trọng nhất, thẩm quyền tối cao để phân xử?"
 doctrine_parameter_maintains_head_of_faith_on_creation:0 "[faiths|E] mới giữ nguyên [head_of_faith|E] cũ khi được tạo lập"
 doctrine_parameter_ecumenical_christians_keep_ecumenism:0 "[GetPlayer.Custom('GetRiteEcumenismFullOrEmpty')]"
 GetRiteEcumenismFullOrEmpty_full:0 "Các [faiths|E] Kitô giáo có giáo lý [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName] sẽ giữ nguyên khi được tạo lập"
 GetRiteEcumenismFullOrEmpty_empty:0 ""

 #Muslim Tenets
 tenet_struggle_submission_name:0 "Đấu tranh và Phục tùng"
 tenet_struggle_submission_desc:0 "Ý chí thần thánh là nguồn gốc của mọi điều thiện, vì vậy một cuộc sống tốt đẹp được xây dựng trên sự phục tùng ý chí ấy, thể hiện qua cuộc đấu tranh nhằm thực thi nó."
 doctrine_parameter_bonus_holy_war_piety_active:0 "[piety|E] và [piety_experience|E] nhận được từ việc thắng [holy_wars|E] tăng #P 50%#!"

 tenet_religious_legal_pronouncements_name:0 "Luật tôn giáo"
 tenet_religious_legal_pronouncements_hisbah: "Hisbah"
 tenet_religious_legal_pronouncements_fatwa:0 "Fatwa"
 tenet_religious_legal_pronouncements_halakha:0 "Halakha"
 tenet_religious_legal_pronouncements_desc:0 "Ranh giới giữa lập luận thần học và pháp lý là rất mong manh, và các phẩm chất tinh thần có thể và nên được xem xét trong các phán quyết thế tục."
 doctrine_parameter_temporal_condemnation_enabled:0 "Những người cai trị có [learning|E] cao có thể lên án các chư hầu [sinful|E] của mình. Chư hầu càng tội lỗi, người cai trị càng cần ít Học vấn hơn để lên án họ.\n$EFFECT_LIST_BULLET$Chư hầu bị lên án được xem là [criminals|E] và có thể bị tước danh hiệu"
 doctrine_parameter_religious_legal_pronouncements_law_cost_reduction:0 "Chi phí Luật pháp: #P -10%#!"
 tenet_religious_legal_pronouncements_cost_tooltip:0 "Luật tôn giáo: #P -10%#!"
 tenet_religious_fatwa_cost_tooltip:0 "Fatwa: #P -10%#!"
 tenet_religious_halakha_cost_tooltip:0 "Halakha: #P -10%#!"

 tenet_false_conversion_sanction_name:0 "Chấp thuận cải đạo giả"
 tenet_temporal_condemnation_taqiya:0 "Taqiya"
 tenet_anusim:0 "Anusim"
 tenet_false_conversion_sanction_desc:0 "Nếu tính mạng bị đe dọa, việc xưng nhận một đức tin giả là điều chấp nhận được, miễn là Ngài vẫn giữ chân lý trong tim mình."
 doctrine_parameter_sanctioned_false_conversion:0 "Kháng Cải đạo: #P +30%#!\n$EFFECT_LIST_BULLET$[characters|E] và [counties|E] đôi khi có thể cải đạo ngược trở lại [faith|E] này nếu bị dẫn lạc"

 tenet_tax_nonbelievers_name:0 "Đánh thuế kẻ ngoại đạo"
 tenet_tax_nonbelievers_desc:0 "Nghĩa vụ quân sự chỉ dành cho tín đồ, trong khi những kẻ không tin phải đóng thuế để đổi lấy sự bảo hộ."
 tenet_tax_nonbelievers_jizya_name:0 "Jizya"

 tenet_literalism_name:0 "Chủ nghĩa văn tự"
 tenet_literalism_desc:0 "Các văn bản thánh của chúng ta đã nêu rõ ý định thần thánh, và sự diễn giải của con người chỉ có giá trị hạn chế."
 doctrine_parameter_literalist_debate_enabled:0 "Có thể tranh luận với các lãnh chúa khác trong lãnh địa với cái giá là [opinion|E], để nhận hoặc mất [piety|E]"

 tenet_legalism_name:0 "Chủ nghĩa pháp trị"
 tenet_legalism_desc:0 "Luật pháp của chúng ta là kết tinh của nhiều thế hệ trí tuệ và lòng mộ đạo, và việc tuân thủ chúng tự thân đã là hành vi mộ đạo. Kẻ có tội, dù là ai, cũng không bao giờ đứng trên pháp luật."
 doctrine_parameter_legalism_reduced_faction_virtues:0 "[vassals|E] và [counties|E] ít có khả năng tham gia [factions|E] chống lại một người cai trị [virtuous|E]"
 doctrine_parameter_legalism_increased_faction_sins:0 "[vassals|E] và [counties|E] có nhiều khả năng tham gia [factions|E] chống lại một người cai trị [sinful|E]"
 doctrine_parameter_legalism_modified_law_costs:1 "Giảm chi phí luật pháp #P -10%#! cho mỗi [virtue|E] mà người cai trị sở hữu"
 doctrine_parameter_legalism_modified_law_costs_2:0 "Tăng chi phí luật pháp #N 10%#! cho mỗi [sin|E] mà người cai trị mang"
 doctrine_parameter_legalism_trust_just_leader_active:1 "[electors|E] trong các dạng [succession|E] bầu chọn có nhiều khả năng bỏ phiếu theo lựa chọn của [liege|E] nếu Lãnh chúa có đặc tính $trait_just$"
 tenet_legalism_law_cost_tooltip:0 "[legalism|E]:\n   Tội lỗi và đức hạnh của ta đang ảnh hưởng như sau: [SCOPE.ScriptValue('legalism_law_cost_modifier')|-0%]"
 
 tenet_reincarnation_name:0 "Luân hồi"
 tenet_reincarnation_desc:0 "Chúng ta đã sống nhiều kiếp trước kiếp này, và sẽ còn sống nhiều kiếp nữa sau nó. Mỗi cái chết chỉ là khởi đầu của một điều mới."
 tenet_reincarnation_zoroastrian_name: "Raj'a"
 tenet_reincarnation_zoroastrian_desc: "Giống như các vị thần có thể nhập thể vào thân xác con người, chúng ta cũng có thể được tái sinh. Người thiện được ban thưởng bằng những hình dạng đẹp đẽ và thuần khiết, và cuối cùng có thể trở thành các thiên thần ánh sáng thuần túy."
 doctrine_parameter_reincarnation_resistance_to_conversion:0 "Kháng Cải đạo của Hạt: #P +20%#!"
 doctrine_parameter_reincarnation_events_active:1 "Trẻ em có cơ hội được xem là hiện thân luân hồi của một tổ tiên, mang lại thưởng cho [piety|E] và [opinion|E]"

 tenet_esotericism_name:0 "Huyền học"
 tenet_esotericism_kabbalah:0 "Kabbalah"
 tenet_esotericism_desc:0 "Những bí ẩn vĩ đại của thần linh có thể vượt ngoài sự lĩnh hội của phàm nhân, nhưng điều đó không thể là cái cớ cho sự ngu muội. Chính sự tồn tại của chúng thôi thúc chúng ta tìm kiếm tri thức và sự thấu hiểu về thế giới xung quanh."
 doctrine_parameter_tenet_esotericism_mystic_education:2 "Trẻ em có [education_focus|E] về [learning|E] có thể nhận được đặc tính [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] nếu học tập xuất sắc."
 tenet_esotericism_kabbalah_desc:0 "Giáo lý Kabbalah giúp phàm nhân hiểu được mối quan hệ giữa Thượng đế vĩnh hằng, bản chất vô hạn được gọi là Ein Sof, và tạo vật của Thượng đế. Kabbalah là nền tảng của mọi huyền học Do Thái, và những người thực hành Kabbalah thường giao thoa với các trường phái Do Thái khác."
 tenet_religious_kabbalah_cost_tooltip:0 "Kabbalah: #P -10%#!"

 #Eastern Tenets
 tenet_adaptive_name:0 "Thích ứng"
 tenet_adaptive_desc:0 "Việc bám chặt giáo điều vào những hạn chế cũ chỉ làm hại tín đồ. Miễn là chúng ta trung thành với các niềm tin cốt lõi của đức tin, chúng ta có thể điều chỉnh luật pháp cho phù hợp với thế giới xung quanh."
 doctrine_parameter_tenet_adaptive_conversion_resistance:0 "Kháng Cải đạo của Hạt: #P +30%#!"
 doctrine_parameter_reduced_vassal_religion_discontent:1 "Chư hầu ngoại đạo [vassals|E] ít có khả năng tham gia các [factions|E] Độc lập và Bình dân"
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "[piety_i|E][piety|E] cần để cải sang [faith|E] khác có [doctrine|E] này: #P -50%#!"
 doctrine_parameter_immaterial_harmony_buddhist_take_vows: "[faiths|E] [GetReligionByKey('buddhism_religion').GetAdjective] có thể sử dụng [interaction|E] #V $take_vows_interaction$#!"

 tenet_inner_journey_name:0 "Hành trình nội tâm"
 tenet_inner_journey_desc:0 "Chỉ khi thấu hiểu bản thân, ta mới có thể hiểu được thế giới. Hành trình khám phá chính mình vừa quan trọng vừa dài lâu và gian nan."
 doctrine_parameter_meditation_mechanics_active:0 "Nhân vật có thể [decide|E] Thiền định Ẩn cư, giúp giảm [stress|E] và có thể đạt được những giác ngộ thần học"

 tenet_dharmic_pacifism_name:0 "Bất bạo động Dharma"
 tenet_dharmic_pacifism_desc:0 "Tất cả chúng ta đều là một phần của trật tự vũ trụ. Bạo lực đối với bất kỳ điều gì cũng là bạo lực đối với mọi thứ, bao gồm chính bản thân mình."

 tenet_bhakti_name:0 "Bhakti"
 tenet_bhakti_patron_god_name:0 "Thần Bảo hộ"
 tenet_bhakti_desc:0 "Phàm nhân không thể sánh với vinh quang trọn vẹn của thần linh, nhưng bằng cách chọn một khía cạnh duy nhất của thần tính để noi theo, thờ phụng và dâng hiến bản thân, chúng ta có thể đến gần họ hơn."
 doctrine_parameter_select_personal_god_active:1 "Người cai trị có thể [decide|E] chọn một hiện thân cá nhân để tôn thờ, nhận thưởng tương ứng"

 tenet_asceticism_name:0 "Khổ hạnh"
 tenet_asceticism_desc:0 "Những theo đuổi vật chất làm chúng ta mù lòa trước chân lý thần thánh. Chỉ bằng cách sống giản dị, không xa hoa, chúng ta mới có thể đạt được giác ngộ tâm linh. "

 tenet_ritual_hospitality_name:0 "Hiếu khách nghi lễ"
 tenet_ritual_hospitality_alternate_name:0 "Pūjā"
 tenet_ritual_hospitality_desc:0 "Lòng hiếu khách là một trong những đức hạnh vĩ đại nhất của nhân loại. Khách đến nhà chúng ta, dù là phàm nhân hay thần linh, đều phải được đối đãi với sự tôn kính và tôn trọng tối đa."
 doctrine_parameter_host_honored_guests_active:0 "[rulers|E] có thể tiếp đãi các nhân vật khác như Khách Danh dự, tiêu tốn [piety|E] để đổi lấy [opinion|E] tăng cao"

 #Pagan tenets
 tenet_warmonger_name:0 "Chủ chiến"
 tenet_warmonger_desc:0 "Đức tin và chiến tranh song hành cùng nhau. Kẻ từ chối chiến đấu nhân danh thần linh không thể được gọi là tín đồ chân chính."
 doctrine_parameter_conquest_cb_enabled:0 "[rulers|E] có [casus_belli|E] Chinh phạt đối với những người cai trị láng giềng "
 doctrine_parameter_faith_can_raid:0 "Cho phép [raiding|E] các [counties|E] ngoại bang để cướp bóc"
 doctrine_parameter_invasion_cb_enabled:0 "Những [rulers|E] danh giá có thể dùng [casus_belli|E] Xâm lược một lần mỗi đời"
 doctrine_parameter_great_holy_wars_active_if_reformed:1 "Nếu tồn tại, [head_of_faith|E] có thể tuyên bố [great_holy_wars|E], miễn là [faith|E] này đã được [organized|E]"

 tenet_ancestor_worship_name:0 "Thờ cúng tổ tiên"
 tenet_ancestor_worship_desc:0 "Tổ tiên của chúng ta dõi theo từ bên kia mồ mả, dẫn dắt và chỉ đường cho chúng ta. Vì vậy, chúng ta phải kính trọng và tôn vinh họ."

 tenet_adorcism_name:0 "Thuật Thỉnh Linh"
  tenet_adorcism_desc:0 "Các linh hồn của thế giới này có thể thực hiện những hành động vĩ đại, cả thiện lẫn ác. Bằng cách tôn kính và tôn trọng họ, chúng ta chỉ có thể hy vọng rằng họ sẽ ban điều lành cho chúng ta và gieo điều dữ lên kẻ thù."
  doctrine_parameter_spirit_possession_active:1 "Mở khóa [decision|E] 'Cầu Xin Sự Trợ Giúp Của Các Linh Hồn'"

  tenet_ritual_celebrations_name:0 "Lễ Hội Nghi Thức"
  tenet_ritual_celebrations_desc:1 "Việc thờ phụng thần linh là điều cần được tôn vinh và chia sẻ với cộng đồng. Việc tổ chức những lễ hội lớn để tôn kính và ca ngợi thần linh sẽ gắn kết tất cả chúng ta lại với nhau."
  doctrine_parameter_mandatory_feast_attendance:0 "[vassals|E] có nhiều khả năng tham dự các Yến Tiệc của Ngài hơn. Những người vẫn từ chối đến dự sẽ mất [piety|E] vì hành động đó."

  tenet_sky_burials_name:0 "Điểu Táng"
  tenet_sky_burials_desc:1 "Người chết không nên bị giam cầm dưới lòng đất — tốt hơn hết là để họ được chim ăn xác tiêu thụ, qua đó trong hành động hào phóng cuối cùng, họ có thể nuôi dưỡng thế giới đã từng nuôi dưỡng họ."
  doctrine_parameter_sky_burials_active:3 "[rulers|E] có thể tổ chức Điểu Táng cho tổ tiên, nhận được [piety|E] và làm hài lòng các [vassals|E]\n$EFFECT_LIST_BULLET$Có thể xây dựng [GetBuilding('charnel_grounds_01').GetName] [duchy_building|E]"
  can_build_towers_of_silence_active_name: "khả năng sử dụng [GetBuilding('tower_of_silence_01').GetName] [duchy_building|E]"
  doctrine_parameter_can_build_towers_of_silence_active: "[vassals|E] có thể xây dựng [GetBuilding('tower_of_silence_01').GetName] [duchy_building|E] để củng cố lòng nhiệt thành của [county|E] — #EMP nếu#! [liege|E] của họ theo [faith|E] không thực hành $tenet_sky_burials_name$"

  tenet_sacred_childbirth_name:0 "Sinh Nở Linh Thiêng"
  tenet_sacred_childbirth_alternate_name:0 "Kūdikis Lemti"
  tenet_sacred_childbirth_desc:0 "Những nhà tắm nơi các bà mẹ sinh con phải được thanh tẩy và chuẩn bị bằng các nghi thức thích hợp, nhằm khuyến khích thần linh ban phúc lành trong lúc sinh nở."
  doctrine_parameter_safer_childbirths_active:0 "Các bà mẹ #P ít có khả năng#! tử vong khi sinh con"
  doctrine_parameter_healthier_children_active:0 "Trẻ em #P ít có khả năng#! ốm yếu hoặc chết non"
  doctrine_parameter_piety_from_childbirth_active:0 "Cha và mẹ nhận được [piety|E] khi con của họ chào đời"
  piety_from_childbirth_toast:0 "Sinh Nở Linh Thiêng"

  tenet_sanctity_of_nature_name:0 "Sự Thiêng Liêng Của Tự Nhiên"
  tenet_sanctity_of_nature_desc:1 "Thế giới tự nhiên là tạo vật của thần linh, và chúng ta chỉ là những vị khách trong đó. Chúng ta phải tôn trọng và gìn giữ mọi cái cây, mọi loài vật, và cả chính mặt đất này."
 # This parameter does nothing; it's just here to flag the tenet's nature silently so we can reference it without directly tagging the tenet.
  doctrine_parameter_believes_in_harmony_with_nature_invisible:0 ""

  tenet_mystical_birthright_name:0 "Thiên Mệnh Cát Tường"
  tenet_mystical_birthright_alternate:0 "Táltos Születés"
  tenet_mystical_birthright_desc:0 "Mỗi chúng ta đều sinh ra với một định mệnh, trong đó quan trọng nhất là Táltos — những người được chọn từ khi chào đời để nắm giữ sức mạnh huyền bí và trở thành các lãnh tụ tinh thần vĩ đại."
  doctrine_parameter_mystic_birthright_active:1 "Trẻ em hiếm khi có thể được sinh ra với đặc tính [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"

  tenet_astrology_name:0 "Chiêm Tinh"
  tenet_astrology_desc:0 "Bầu trời đêm là cánh cửa dẫn tới cõi thần linh. Những bí mật và huyền cơ vĩ đại của thế giới được ghi khắc nơi đó, mở ra cho tất cả những ai biết cách quan sát."
  doctrine_parameter_divine_the_stars_active:0 "Cho phép tín đồ Chiêm Tinh và dự đoán tương lai của họ"
  tenet_divination_name: "Thuật Tiên Tri"
  tenet_divination_desc: "Vận mệnh của phàm nhân và tương lai của thế giới được ghi trong các vì sao và những dấu hiệu ẩn giấu, và thông qua nghi lễ, giấc mơ và điềm báo, những người hành pháp có thể tiên đoán các bí mật này từ các linh hồn bên kia."

  tenet_sun_worship_name:0 "Thờ Phụng Mặt Trời"
  tenet_sun_worship_desc:0 "Đấng mang ánh sáng, đấng ban sự sống, ngọn lửa vĩnh hằng — ngự trị cao trên bầu trời như vị quân vương chân chính của thế giới."
  doctrine_parameter_summer_festivals_active:0 "Tổ chức Yến Tiệc vào các tháng mùa hè sẽ nhận được [piety|E]"
  doctrine_parameter_trial_by_sun_active:0 "[criminals|E] bị giam giữ có thể bị kết án bằng Thử Thách Mặt Trời"

