  tenet_ritual_cannibalism_desc:0 "Nhân loại được ban phước khi được trao cho tia lửa thiêng liêng. Vì vậy, thịt người là thiêng liêng, sự hiện diện của nó đáng để thưởng thức chứ không phải chôn vùi hay thiêu hủy."
