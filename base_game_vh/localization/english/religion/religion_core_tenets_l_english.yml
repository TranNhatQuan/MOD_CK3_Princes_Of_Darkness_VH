  tenet_communal_possessions_desc: "[ROOT.Faith.HighGodName] định sẵn cho tất cả chúng ta phần chia đều các tài nguyên trên trần thế. Chúng ta nên sở hữu mọi thứ chung, và tái phân phối của cải bị đánh cắp từ kẻ quyền thế."
