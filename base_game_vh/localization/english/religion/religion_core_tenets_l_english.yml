  tenet_sacrificial_ceremonies_name:0 "Nghi lễ hiến tế"
  tenet_sacrificial_ceremonies_desc:0 "Hiến tế con người, dù tự nguyện hay cưỡng ép, đưa chúng ta đến gần thần linh hơn. Việc tự nguyện hiến tế bản thân trong nghi lễ là tập tục và đức hạnh, cũng như việc hiến tế những kẻ phạm tội không thể tha thứ chống lại các Thần linh."
 
  tenet_megaliths_name:0 "Công trình cự thạch"
  tenet_megaliths_desc:0 "Việc thờ phụng không nên chỉ diễn ra trong khuôn khổ đền thờ; đó là những công trình nguyên thủy của con người làm họ xao nhãng khỏi các tạo tác thiêng liêng bao quanh chúng ta. Chúng ta đón nhận đá và không gian mở, sắp đặt những khối đá mà Đấng Tạo Hóa ban cho theo cách làm đẹp lòng họ và đưa chúng ta gần hơn với thần tính."
  doctrine_parameter_can_build_megaliths:0 "Cho phép xây dựng Cự thạch tại các lãnh địa [temple|E] và Đại Cự thạch tại Thủ phủ Công quốc."
  province_is_of_a_megalith_faith_tt:0 "[county|E] này phải theo một [faith|E] tin vào ý nghĩa của Cự thạch."

