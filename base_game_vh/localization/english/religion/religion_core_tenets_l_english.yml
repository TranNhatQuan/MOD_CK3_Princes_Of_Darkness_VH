  tenet_fp3_fedayeen_desc: "Khi chiến tranh thông thường không còn hiệu quả, bổn phận của chúng ta trước [ROOT.Faith.HighGodNameAlternate] là tiêu diệt kẻ thù của [ROOT.Faith.HighGodHerHis|U] thông qua thâm nhập và lừa dối. Chúng ta không được sợ cái chết hay nỗi đau, và sẵn sàng hiến dâng mạng sống cho đại nghĩa."
