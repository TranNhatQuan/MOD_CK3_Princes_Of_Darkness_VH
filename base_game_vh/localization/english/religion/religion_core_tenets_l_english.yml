 tenet_preservation_name: "Bảo Tồn"
 tenet_preservation_desc: "Sáng tạo, bảo hộ, chuyển hóa. Đức hạnh được sinh ra từ việc kiến thiết, từ việc xây dựng một điều gì đó và chứng kiến nó thịnh vượng."
