  tenet_eastern_syncretism_name:0 "Dung hợp $rf_eastern$"
  tenet_eastern_syncretism_desc:0 "Có nhiều điều đáng học hỏi từ cách các tôn giáo Dharmic khác nhau khoan dung với nhau. Họ có thể không theo đức tin chân chính, nhưng điều đó không khiến họ trở nên tà ác."
  doctrine_parameter_hostility_override_eastern_hostility_doctrine:1 "Các [faiths|E] [GetReligionFamily('rf_eastern').GetName] chỉ được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
