  tenet_sacred_shadows_name:0 "Dối trá thiêng liêng"
  tenet_sacred_shadows_desc:0 "Nói dối là nghệ thuật sâu sắc nhất tồn tại. Những ai có thể khiến kẻ khác tin vào lời dối trá của mình là thánh thiện. Những ai có thể dối trá thành công với chính bản thân mình thì không thể bị ngăn cản."
  doctrine_parameter_piety_gain_from_successful_intrigue_schemes:0 "Tín đồ nhận [piety|E] khi hoàn thành thành công các [schemes|E] [intrigue|E]"
  doctrine_parameter_adherents_more_likely_to_join_schemes:0 "Tín đồ sẵn sàng hơn trong việc trở thành Đặc vụ trong các [schemes|E] của nhân vật khác"

  tenet_pursuit_of_power_name:0 "Theo đuổi quyền lực"
  tenet_pursuit_of_power_desc:0 "Điều gì là chính nghĩa hay không là tạm thời, được định nghĩa bởi những kẻ hiện đang nắm quyền. Điều đó có nghĩa rằng việc theo đuổi quyền lực là mục tiêu chính nghĩa duy nhất."

  tenet_pastoral_isolation_name:0 "Cô lập mục vụ"
  tenet_pastoral_isolation_desc:0 "Điều duy nhất chúng ta muốn là được yên ổn. Thực hành của chúng ta là của riêng chúng ta, cũng không phải việc của ai khác hơn là việc của họ đối với chúng ta."
  doctrine_parameter_unattractive_for_character_conversions:0 "[characters|E], nhưng không phải [counties|E], sẵn sàng hơn trong việc bị cải đạo rời khỏi [faith|E] này"

  tenet_natural_primitivism_name:0 "Chủ nghĩa nguyên thủy tự nhiên"
  tenet_natural_primitivism_desc:0 "Văn minh là phi tự nhiên, một nỗ lực vô ích và báng bổ của con người nhằm áp đặt trật tự lên một tạo hóa vốn hỗn mang. Chúng ta đón nhận lối sống thuận tự nhiên và sống như [ROOT.Faith.PantheonTerm] đã định, hoang dã và tự do."
