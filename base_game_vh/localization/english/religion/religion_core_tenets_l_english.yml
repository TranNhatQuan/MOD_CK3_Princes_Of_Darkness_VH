 tenet_extinction_of_dharma_name: "Diệt Tận Pháp"
 tenet_extinction_of_dharma_desc: "Ác quỷ bước đi trên trần thế dưới lốt những kẻ mộ đạo và sùng tín; kẻ nào giết một con sẽ tiến một bước trên con đường thành Phật, kẻ nào giết mười con sẽ tiến mười bước."

 tenet_cranial_trophies_name: "Chiến Lợi Phẩm Sọ Người"
 tenet_cranial_trophies_desc: "Cái đầu là vật chứa tinh hoa của chủ nhân nó. Bằng cách chặt bỏ nó và lấy đi phần bên trong, chúng ta có thể chiếm đoạt nguồn năng lượng tâm linh mạnh mẽ ấy cho bản thân."
 doctrine_parameter_killing_bestows_heads: "Có thể nhận được Chiến Lợi Phẩm Sọ Người [artifact|E] khi [executing|E] một nhân vật khác, giết họ trong [single_combat_duel|E], hoặc hạ sát họ trong [battle|E]"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "Khi nhận được Chiến Lợi Phẩm Sọ Người [artifact|E], Xóa Bạn sẽ nhận thêm [piety|E] tỷ lệ với lượng [prestige|E] của người đã chết"

 tenet_benevolent_governance_name: "Cai Trị Nhân Đức"
 tenet_benevolent_governance_desc: "Những người cai trị quần chúng có nghĩa vụ đạo đức phải khuyến khích điều thiện và bài trừ điều ác. Chỉ bằng cách tuân theo nguyên tắc này, một người cai trị mới có thể thực sự công chính."
 tenet_filial_piety_name: "Hiếu Đạo"
 tenet_filial_piety_desc: "Lòng hiếu thảo và sự vâng lời đối với bậc trưởng thượng là nền tảng của việc hiện thực hóa bản tính thiện của con người. Khi cha mẹ còn sống, ta phụng dưỡng họ đúng lễ; khi họ qua đời, ta an táng họ đúng lễ, rồi thờ cúng họ đúng lễ."
 tenet_harmonious_society_name: "Xã Hội Hài Hòa"
 tenet_harmonious_society_desc: "Mọi thứ đều phải cân bằng: cá nhân, thiên nhiên, xã hội. Thiên Tử định nhịp điệu, và chúng ta theo lời xướng của ngài."
