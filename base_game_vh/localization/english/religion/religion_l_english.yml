  abrahamic_hostility_doctrine_name:0 "Abraham"
  abrahamic_hostility_doctrine_desc:0 "Các tôn giáo sau thuộc nhóm Abraham:\n[GetReligionFamily('rf_abrahamic').GetReligions]"
  pagan_hostility_doctrine_name:0 "Ngoại giáo"
  pagan_hostility_doctrine_desc:0 "Các tôn giáo sau thuộc nhóm Ngoại giáo:\n[GetReligionFamily('rf_pagan').GetReligions]"
  eastern_hostility_doctrine_name: "Dharmic"
  eastern_hostility_doctrine_desc: "Các tôn giáo sau thuộc nhóm Dharmic:\n[GetReligionFamily('rf_eastern').GetReligions]"
  sinitic_hostility_doctrine_name: "Sinitic"
  sinitic_hostility_doctrine_desc: "Các tôn giáo sau thuộc nhóm Sinitic:\n[GetReligionFamily('rf_eastern').GetReligions]"
 
  special_tolerance_name:0 "Khoan dung đặc biệt"
  special_doctrine_ecumenical_christian_name:0 "Đại Kết"
  special_doctrine_ecumenical_christian_desc:0 "Các lãnh đạo tôn giáo của chúng ta trong lịch sử đã tham gia đối thoại liên tôn nhằm tăng cường hợp tác giữa các giáo phái Kitô giáo khác nhau."

  special_doctrine_full_tolerance_name:0 "Khoan dung toàn diện"
  full_tolerance_name:0 "$special_doctrine_full_tolerance_name$"
  doctrine_parameter_hostility_override_special_doctrine_full_tolerance:1 "Tất cả [faiths|E] đều được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  special_doctrine_full_tolerance_desc:0 "Mọi người đều tự do lựa chọn đức tin của mình. Sự khác biệt không chia rẽ chúng ta, mà khiến chúng ta mạnh mẽ hơn."
 
  nudity_doctrine_name:0 "Quan điểm về khỏa thân"
  special_doctrine_naked_priests_name:0 "Giáo sĩ khỏa thân"
  special_doctrine_naked_priests_desc:0 "Các giáo sĩ của chúng ta hiểu rằng quần áo trói buộc tinh thần và ngăn cản ta đạt tới giác ngộ đích thực. Chỉ khi trút bỏ xiêm y, chúng ta mới có thể đánh thức linh hồn và cảm nhận tình yêu của [ROOT.Faith.HighGodNamePossessive]."
  doctrine_parameter_naked_priests_active:0 "Giáo sĩ và các nhân vật cuồng tín không mặc quần áo."

  doctrine_gender_name:0 "Quan điểm về giới tính"
  doctrine_gender_male_dominated_name:0 "Nam giới chi phối"
  doctrine_gender_male_dominated_desc:0 "Đàn ông mạnh mẽ hơn và phù hợp hơn để dẫn dắt chúng ta trong thế giới khắc nghiệt này, vì vậy chúng ta sẽ giao việc cai trị xã hội cho họ."
  doctrine_gender_equal_name:0 "Bình đẳng"
  doctrine_gender_equal_desc:0 "Thật ngu ngốc khi từ chối người tài năng tham gia chính quyền chỉ vì giới tính. Chúng ta sẽ cho phép mọi người đủ khả năng cai trị xã hội."
  doctrine_gender_female_dominated_name:0 "Nữ giới chi phối"
  doctrine_gender_female_dominated_desc:0 "Phụ nữ đã hết lần này đến lần khác chứng minh rằng chỉ họ mới có sự khôn ngoan và thận trọng cần thiết để cai trị xã hội đúng đắn."
 
  doctrine_divorce_name:0 "Ly hôn"
  doctrine_divorce_disallowed_name:0 "Không cho phép"
  doctrine_divorce_disallowed_desc:0 "Lời thề hôn nhân là cuối cùng và ràng buộc. Chỉ có cái chết mới chia lìa chúng ta."
  doctrine_divorce_approval_name:0 "Phải được phê chuẩn"
  doctrine_divorce_approval_desc:0 "Dù mối ràng buộc hôn nhân không nên bị xem nhẹ, nhưng trong một số trường hợp đặc biệt, ly hôn có thể là điều cần thiết."
  doctrine_divorce_allowed_name:0 "Luôn cho phép"
  doctrine_divorce_allowed_desc:0 "Hôn nhân chỉ đơn thuần là quan hệ hợp tác giữa hai người, và như mọi quan hệ hợp tác khác, nó có thể chấm dứt bất cứ lúc nào."
  doctrine_parameter_divorce_disallowed:0 "Nhân vật không bao giờ được phép [divorce|E] với [spouse|E] của mình"
  doctrine_parameter_divorce_approval:0 "Nhân vật được phép [divorce|E] với [spouse|E] nếu được [head_of_faith|E] Tinh thần chấp thuận (hoặc [house_head|E] nếu không có Giáo chủ Tinh thần)"
  doctrine_parameter_divorce_allowed:1 "Nhân vật luôn được phép [divorce|E] với [spouse|E] bằng cách tiêu tốn [piety|E]"
 
  doctrine_bastardry_name:0 "Con hoang"
  doctrine_bastardry_none_name:0 "Không có con hoang"
  doctrine_bastardry_none_desc:0 "Huyết thống quyết định dòng dõi, không phải hôn nhân. Trẻ em sinh ngoài giá thú cũng hợp pháp như bất kỳ ai khác."
  doctrine_bastardry_legitimization_name:0 "Hợp pháp hóa"
  doctrine_bastardry_legitimization_desc:0 "Hôn nhân là thiêng liêng, vì vậy trẻ em sinh ra ngoài hôn nhân phải được ban phúc theo cách khác nếu muốn được xem là hợp pháp."
  doctrine_bastardry_all_name:0 "Không hợp pháp hóa"
  doctrine_bastardry_all_desc:0 "Sợi dây hôn nhân là bất khả xâm phạm, và trẻ em sinh ngoài giá thú sẽ luôn là con hoang."
  doctrine_parameter_bastards_none:0 "Không tồn tại khái niệm [bastard|E]. Mọi đứa trẻ đều [legitimate|E] như nhau"
  doctrine_parameter_bastards_legitimize:0 "[bastards|E] có thể được hợp pháp hóa nếu [house_head|E] hoặc [dynast|E] chấp thuận"
  doctrine_parameter_bastards_always:0 "[bastards|E] không bao giờ có thể được hợp pháp hóa"
 
  doctrine_adultery_men_name:0 "Ngoại tình của nam giới"
  doctrine_adultery_men_crime_name:0 "Tội phạm"
  doctrine_adultery_men_crime_desc:0 "Nam giới quan hệ tình dục ngoài hôn nhân là một tội ác và sẽ bị trừng phạt tương xứng."
  doctrine_adultery_men_shunned_name:0 "Bị xa lánh"
  doctrine_adultery_men_shunned_desc:0 "Nam giới quan hệ tình dục ngoài hôn nhân là tội lỗi, nhưng cũng như mọi tội lỗi khác, chỉ thần linh mới có quyền phán xét sự sa ngã của họ."
  doctrine_adultery_men_accepted_name:0 "Được chấp nhận"
  doctrine_adultery_men_accepted_desc:0 "Không có gì sai trái một cách cố hữu khi một người đàn ông quyết định quan hệ tình dục ngoài hôn nhân, nên đó hoàn toàn là quyết định của anh ta."
  doctrine_parameter_adultery_male_crime:1 "Nam giới mang [trait|E] [GetTrait('adulterer').GetName( GetNullCharacter )] hoặc [GetTrait('fornicator').GetName( GetNullCharacter )] bị coi là [criminals|E]"
  doctrine_parameter_adultery_male_shunned:1 "Nam giới mang [trait|E] [GetTrait('adulterer').GetName( GetNullCharacter )] hoặc [GetTrait('fornicator').GetName( GetNullCharacter )] bị [shunned|E]"
  doctrine_parameter_adultery_male_accepted:1 "Nam giới mang [trait|E] [GetTrait('adulterer').GetName( GetNullCharacter )] hoặc [GetTrait('fornicator').GetName( GetNullCharacter )] được chấp nhận hoàn toàn"
 
  doctrine_adultery_women_name:0 "Ngoại tình của nữ giới"
  doctrine_adultery_women_crime_name:0 "Tội phạm"
  doctrine_adultery_women_crime_desc:0 "Nữ giới quan hệ tình dục ngoài hôn nhân là một tội ác và sẽ bị trừng phạt tương xứng."
  doctrine_adultery_women_shunned_name:0 "Bị xa lánh"
  doctrine_adultery_women_shunned_desc:0 "Nữ giới quan hệ tình dục ngoài hôn nhân là tội lỗi, nhưng cũng như mọi tội lỗi khác, chỉ thần linh mới có quyền phán xét sự sa ngã của họ."
  doctrine_adultery_women_accepted_name:0 "Được chấp nhận"
  doctrine_adultery_women_accepted_desc:0 "Không có gì sai trái một cách cố hữu khi một người phụ nữ quyết định quan hệ tình dục ngoài hôn nhân, nên đó hoàn toàn là quyết định của cô ấy."
  doctrine_parameter_adultery_female_crime:1 "Nữ giới mang [trait|E] [GetTrait('adulterer').GetName( GetNullCharacter )] hoặc [GetTrait('fornicator').GetName( GetNullCharacter )] bị coi là [criminals|E]"
  doctrine_parameter_adultery_female_shunned:1 "Nữ giới mang [trait|E] [GetTrait('adulterer').GetName( GetNullCharacter )] hoặc [GetTrait('fornicator').GetName( GetNullCharacter )] bị [shunned|E]"
  doctrine_parameter_adultery_female_accepted:1 "Nữ giới mang [trait|E] [GetTrait('adulterer').GetName( GetNullCharacter )] hoặc [GetTrait('fornicator').GetName( GetNullCharacter )] được chấp nhận hoàn toàn"
 
  doctrine_kinslaying_name:0 "Sát hại thân tộc"
  doctrine_kinslaying_any_dynasty_member_crime_name:0 "Thành viên dòng tộc là tội phạm"
  doctrine_kinslaying_any_dynasty_member_crime_desc:0 "Mọi thân tộc đều gắn kết bằng huyết thống, và giết hại dù chỉ là một họ hàng xa cũng là tội ác nghiêm trọng chống lại toàn bộ dòng tộc. Những hành vi như vậy sẽ không bị lãng quên."
  doctrine_parameter_kinslaying_any_dynasty_member_crime:0 "[kinslayers|E] mang [trait|E] [GetTrait('kinslayer_1').GetName( GetPlayer )] hoặc nặng hơn bị coi là [criminals|E] trong mắt [dynasty|E] của họ"
  doctrine_parameter_kinslaying_extended_family_crime:0 "[kinslayers|E] mang [trait|E] [GetTrait('kinslayer_2').GetName( GetPlayer )] hoặc nặng hơn bị coi là [criminals|E] trong mắt [dynasty|E] của họ"
  doctrine_parameter_kinslaying_close_kin_crime:0 "[kinslayers|E] mang [trait|E] [GetTrait('kinslayer_3').GetName( GetPlayer )] bị coi là [criminals|E] trong mắt [dynasty|E] của họ"
 

  doctrine_parameter_kinslaying_shunned:0 "[kinslayers|E] bị [shunned|E]"
  doctrine_parameter_kinslaying_accepted:0 "Nhân vật giết hại thân tộc không bị xem là [kinslayers|E]"
  doctrine_kinslaying_extended_family_crime_name:0 "Gia tộc là tội phạm"
  doctrine_kinslaying_extended_family_crime_desc:0 "Sát hại chính gia đình của mình là một trong những tội ác ghê tởm nhất mà người ta có thể phạm phải. Bất kỳ ai làm điều đó sẽ bị trừng phạt nặng nề."
  doctrine_kinslaying_close_kin_crime_name:0 "Thân thích gần là tội phạm"
  doctrine_kinslaying_close_kin_crime_desc:0 "Huynh đệ tương tàn và những hành vi tương tự không thể được dung thứ trong một xã hội công bằng và chính trực. Những kẻ phạm tội như vậy sẽ bị trừng phạt."
  doctrine_kinslaying_shunned_name:0 "Bị xa lánh"
  doctrine_kinslaying_shunned_desc:0 "Dù việc sát hại thân nhân là kinh khủng, nhưng những hành vi như vậy không vốn dĩ là tội ác nặng hơn các vụ giết người khác."
  doctrine_kinslaying_accepted_name:0 "Được chấp nhận"
  doctrine_kinslaying_accepted_desc:0 "Việc sát hại gia đình không khác gì các vụ giết người khác và sẽ được đối xử theo cùng một cách."
  kinslayer_crime_dynasty:0 "Kẻ sát hại thân tộc"
 
  doctrine_consanguinity_name:0 "Huyết thống"
  doctrine_consanguinity_dynastic_name: "Cấm đoán theo dòng tộc"
  doctrine_consanguinity_dynastic_desc: "Nghiêm cấm việc kết hôn với bất kỳ ai có cùng họ và chung tổ tiên, dù quan hệ xa đến đâu, và cũng không chấp nhận kết hôn với những người khác họ nhưng có quan hệ huyết thống gần."
  doctrine_consanguinity_restricted_name:0 "Cấm kỵ thân thích gần"
  doctrine_consanguinity_restricted_desc:0 "Cho phép hai người thân kết hôn hoặc quan hệ tình dục với nhau là một tội lỗi chống lại [ROOT.Faith.HighGodName]."
  doctrine_parameter_consanguinity_restricted_marriage:0 "Hôn nhân giữa bất kỳ [extended_family_members|E] và/hoặc [close_family_members|E] nào đều bị cấm"
  doctrine_parameter_consanguinity_restricted_close_kin_incest:0 "Quan hệ tình dục giữa bất kỳ [extended_family_members|E] và/hoặc [close_family_members|E] nào sẽ tạo ra [secret|E] loạn luân"
  doctrine_consanguinity_cousins_name:0 "Hôn nhân anh em họ"
  doctrine_consanguinity_cousins_desc:0 "Anh em họ có quan hệ huyết thống, nhưng đủ xa để việc kết hôn được chấp nhận nhằm bảo tồn dòng dõi."
  doctrine_parameter_consanguinity_cousins_marriage:0 "Cho phép hôn nhân giữa anh em họ"
  doctrine_parameter_consanguinity_cousins_incest:0 "Quan hệ tình dục giữa anh em họ sẽ không tạo ra [secret|E] loạn luân"
  doctrine_consanguinity_aunt_nephew_and_uncle_niece_name:0 "Hôn nhân cô–cháu / cậu–cháu"
  doctrine_consanguinity_aunt_nephew_and_uncle_niece_desc:0 "Miễn là không có quan hệ trực hệ, các thành viên gia đình được phép kết hôn với nhau vì lợi ích của dòng tộc."
  doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_marriage:0 "Cho phép hôn nhân giữa anh em họ, cô–cháu và cậu–cháu"
  doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_incest:0 "Quan hệ tình dục giữa anh em họ, cô–cháu và cậu–cháu sẽ không tạo ra [secret|E] loạn luân"
  doctrine_consanguinity_unrestricted_name:0 "Hôn nhân không hạn chế"
  doctrine_consanguinity_unrestricted_desc:0 "Việc các thành viên trong gia đình yêu thương nhau là tự nhiên và lành mạnh, và những kẻ cho rằng tình yêu đó chỉ nên giới hạn ở mối quan hệ phi tình dục là những kẻ ngu ngốc."
  doctrine_parameter_consanguinity_unrestricted_marriage:0 "Cho phép hôn nhân giữa mọi thành viên trong gia đình"
  doctrine_parameter_consanguinity_unrestricted_incest:0 "Quan hệ tình dục giữa bất kỳ thành viên gia đình nào sẽ không tạo ra [secret|E] loạn luân"
  doctrine_parameter_consanguinity_restricted_dynastic_marriage: "Hôn nhân giữa các thành viên cùng [dynasty|E] bị cấm"
