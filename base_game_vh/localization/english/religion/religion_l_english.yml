  doctrine_pluralism_name:0 "Thái độ Tôn giáo"
  doctrine_parameter_hostility_towards_us_mult:0 "Tín đồ của các [faiths|E] khác sẽ chịu mức phạt thiện cảm là $VALUE|%V0$"
  doctrine_pluralism_fundamentalist_name:0 "Chính thống tuyệt đối"
  doctrine_pluralism_fundamentalist_desc:0 "Đức tin của chúng ta là đức tin duy nhất đúng đắn, lời dạy của chúng ta là chân lý duy nhất. Bất kỳ sự sai lệch nào khỏi [ROOT.Faith.ReligiousText] đều vốn dĩ là báng bổ."
  doctrine_parameter_pluralism_fundamentalist_proselytization_bonus:0 "Tốc độ Cải đạo tại Hạt: #P +20%#!"
  doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal:2 "Có thể #P tước đoạt tước vị#! từ những kẻ ngoại đạo $hostility_hostile_tooltippable$ và $hostility_evil_tooltippable$ mà không chịu [tyranny|E]"
  doctrine_parameter_pluralism_fundamentalist_faction_join_chance:1 "Các [counties|E] thuộc [faiths|E] khác #N dễ#! tham gia [factions|E] hơn"
  doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy:0 "#N Nguy cơ tăng cao#! từ dị giáo khi [fervor|E] thấp"
  doctrine_pluralism_righteous_name:0 "Chính nghĩa"
  doctrine_pluralism_righteous_desc:0 "Là phàm nhân, chúng ta không thể hoàn toàn thấu hiểu ý chí của [ROOT.Faith.HighGodNamePossessive], nhưng các [ROOT.Faith.PriestNeuterPlural] của chúng ta vẫn có hiểu biết khá rõ về điều gì là thiêng liêng và điều gì là ô uế."
  doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced:2 "Có thể #P tước đoạt tước vị#! từ những kẻ ngoại đạo $hostility_evil_tooltippable$ mà không chịu [tyranny|E]"
  doctrine_pluralism_pluralistic_name:0 "Đa nguyên"
  doctrine_pluralism_pluralistic_desc:0 "Thật là ngu muội khi cho rằng chỉ có một cách diễn giải đúng về ý chí thiêng liêng và mọi cách khác đều sai lầm. Mỗi người chúng ta đều có con đường riêng để thờ phụng [ROOT.Faith.HighGodName]."
  doctrine_parameter_pluralism_pluralistic_proselytization_penalty:0 "Tốc độ Cải đạo tại Hạt: #N -20%#!"
  doctrine_parameter_pluralism_pluralistic_faction_join_chance:1 "Các hạt thuộc [faiths|E] khác #P ít#! tham gia [factions|E] hơn"
  doctrine_parameter_pluralism_pluralistic_resistant_to_heresy:0 "#P Giảm nguy cơ#! từ dị giáo khi [fervor|E] thấp"
  doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals:0 "Chiến thắng một [holy_war|E] sẽ biến các [rulers|E] ngoại đạo trong khu vực mục tiêu thành chư hầu thay vì chiếm đoạt đất đai của họ"
 
  doctrine_theocracy_name:0 "Truyền thống Giáo sĩ"
  doctrine_theocracy_temporal_name:0 "Thần quyền"
  doctrine_theocracy_temporal_desc:0 "Chỉ những [ROOT.Faith.PriestNeuterPlural] được công nhận mới có thể được giao phó việc duy trì giáo lý của đức tin chúng ta và, theo đó, quản lý và chăm sóc các thánh địa."
  doctrine_parameter_theocracy_temple_lease:0 "Các [holdings|E] Đền thờ được cho [realm_priest|E] của người nắm giữ thuê, và người này sẽ phục vụ họ với tư cách là một [vassal|E] [theocratic|E]"
  doctrine_theocracy_lay_clergy_name:0 "Giáo sĩ Thế tục"
  doctrine_theocracy_lay_clergy_desc:0 "Bất kỳ tín đồ sùng đạo nào cũng hoàn toàn có khả năng hiểu, tuân theo và truyền giảng giáo lý của đức tin chúng ta."
  doctrine_parameter_theocracy_temple_ownership:0 "Các [rulers|E] thế tục trực tiếp kiểm soát các [holdings|E] Đền thờ của mình và nhận toàn bộ lợi ích liên quan."
