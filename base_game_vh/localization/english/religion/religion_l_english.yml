  doctrine_clerical_function_name:0 "Chức năng Giáo sĩ"
  doctrine_clerical_function_taxation_name:1 "Kiểm soát"
  doctrine_clerical_function_taxation_desc:1 "Quyền uy của các [ROOT.Faith.AltPriestTermPlural] bắt nguồn từ [ROOT.Faith.HighGodName] [ROOT.Faith.HighGodHerselfHimself], và điều đó vẫn đúng ngay cả nơi trần thế."
  doctrine_clerical_function_alms_and_pacification_name:0 "Bố thí và An dân"
  doctrine_clerical_function_alms_and_pacification_desc:0 "Các [ROOT.Faith.PriestNeuterPlural] của chúng ta được giao phó trách nhiệm đảm bảo người nghèo khổ và bị áp bức có đủ lương thực và chỗ ở khi họ không thể tự lo cho bản thân."
  doctrine_clerical_function_recruitment_name:0 "Tuyển mộ"
  doctrine_clerical_function_recruitment_desc:1 "Các [ROOT.Faith.PriestNeuterPlural] của chúng ta có thể cầm vũ khí để bảo vệ đức tin. Trách nhiệm làm gương cho tín đồ ban cho họ thêm sức mạnh trong chiến đấu."
  doctrine_parameter_clergy_can_fight:0 "Thành viên của [clergy|E] có thể phục vụ với vai trò [commanders|E] hoặc $knight_culture_player_plural$"
 
  doctrine_clerical_gender_name:0 "Giới tính Giáo sĩ"
  doctrine_clerical_gender_male_only_name:0 "Chỉ Nam giới"
  doctrine_clerical_gender_male_only_desc:0 "Chỉ nam giới mới có thể gánh vác trọng trách lớn lao khi phục vụ với tư cách là [ROOT.Faith.PriestMalePlural] của đức tin chúng ta."
  doctrine_parameter_clergy_must_be_male:0 "Chỉ nam giới mới có thể được ban các [holdings|E] Đền thờ hoặc phục vụ với tư cách là [court_chaplains|E]"
  doctrine_clerical_gender_female_only_name:0 "Chỉ Nữ giới"
  doctrine_clerical_gender_female_only_desc:0 "Chỉ nữ giới mới đủ minh triết để diễn giải ý chí của [ROOT.Faith.HighGodNamePossessive] và phục vụ với tư cách là [ROOT.Faith.PriestFemalePlural] của đức tin chúng ta."
  doctrine_parameter_clergy_must_be_female:0 "Chỉ nữ giới mới có thể được ban các [holdings|E] Đền thờ hoặc phục vụ với tư cách là [court_chaplains|E]"
  doctrine_clerical_gender_either_name:0 "Không phân biệt"
  doctrine_clerical_gender_either_desc:0 "Bất kỳ ai cảm nhận được lời kêu gọi của thần linh đều nên có thể phục vụ với tư cách là [ROOT.Faith.PriestNeuterPlural], bất kể giới tính."
  doctrine_parameter_clergy_can_be_either_gender:0 "Giới tính không ảnh hưởng đến việc ai có thể được ban các [holdings|E] Đền thờ hoặc phục vụ với tư cách là [court_chaplains|E]"
 
  doctrine_clerical_marriage_name:0 "Hôn nhân Giáo sĩ"
  doctrine_clerical_marriage_allowed_name:0 "Được phép"
  doctrine_clerical_marriage_allowed_desc:0 "Hôn nhân là một thể chế thiêng liêng, và các [ROOT.Faith.PriestNeuterPlural] cũng nên được tham gia như mọi tín đồ trung thành khác."
  doctrine_parameter_clergy_can_marry:0 "Thành viên của [clergy|E] được phép [marry|E]"
  doctrine_clerical_marriage_disallowed_name:0 "Không được phép"
  doctrine_clerical_marriage_disallowed_desc:0 "Trở thành một [ROOT.Faith.PriestNeuter] đồng nghĩa với việc hiến dâng trọn đời mình cho [ROOT.Faith.HighGodName]. Việc cân nhắc kết hôn với một người phàm khác bên cạnh điều đó vốn dĩ là bất trung."
  doctrine_parameter_clergy_can_marry_disabled:0 "Thành viên của [clergy|E] bị cấm [marrying|E]"
 
  doctrine_clerical_succession_name:0 "Bổ nhiệm Giáo sĩ"
  doctrine_clerical_succession_temporal_appointment_name:0 "Thế tục, Có thể bãi nhiệm"
  doctrine_clerical_succession_temporal_appointment_desc:1 "Các [ROOT.Faith.BishopNeuterPlural|U] về bản chất là người phục vụ cho lãnh thổ, vì vậy lãnh chúa của họ nên có thể bổ nhiệm và bãi nhiệm với chỉ một số hạn chế nhỏ."
  doctrine_clerical_succession_spiritual_appointment_name:0 "Tâm linh, Có thể bãi nhiệm"
  doctrine_clerical_succession_spiritual_appointment_desc:0 "Dù các [ROOT.Faith.AltPriestTermPlural] nên bổ nhiệm tất cả [ROOT.Faith.BishopNeuterPlural], các lãnh chúa thế tục vẫn nên có thể bãi nhiệm những người không hoàn thành trách nhiệm."
  doctrine_clerical_succession_temporal_fixed_appointment_name:0 "Thế tục, Trọn đời"
  doctrine_clerical_succession_temporal_fixed_appointment_desc:0 "Dù một người cai trị nên có thể chọn [ROOT.Faith.BishopNeuterPlural] của mình, trách nhiệm của họ là thiêng liêng và cao cả, và việc bổ nhiệm không nên bị bãi nhiệm."
  doctrine_clerical_succession_spiritual_fixed_appointment_name:0 "Tâm linh, Trọn đời"
  doctrine_clerical_succession_spiritual_fixed_appointment_desc:0 "Các [ROOT.Faith.BishopNeuterPlural|U] là Ta tớ của thần linh, và với tư cách là đại diện của thần linh, quyết định của các [ROOT.Faith.AltPriestTermPlural] cho vị trí này là cuối cùng và tuyệt đối."
  doctrine_parameter_clerical_appointment_ruler:0 "[rulers|E] tự bổ nhiệm [realm_priest|E] hoặc [court_chaplain|E] của mình"
  doctrine_parameter_clerical_appointment_head_of_faith:1 "[head_of_faith|E] hoặc giáo sĩ bổ nhiệm tất cả [realm_priests|E] hoặc [court_chaplains|E]"
  doctrine_parameter_clerical_appointment_fixed_disabled:1 "[realm_priest|E] hoặc [court_chaplain|E] có thể bị bãi nhiệm và thay thế bằng người mới"
  doctrine_parameter_clerical_appointment_fixed:0 "[realm_priest|E] hoặc [court_chaplain|E] giữ chức vụ trọn đời"

  doctrine_theism_name: "Thần giáo"
  doctrine_monotheist_name: "Đạo Một Thần"
  doctrine_monotheist_desc: "Chỉ thờ một thần duy nhất. Những 'vị thần' khác, nếu có, nhiều nhất cũng chỉ là tượng vô nghĩa, tệ nhất là những nỗ lực của kẻ lừa gạt xấu xa nhằm cám dỗ tín đồ rời bỏ việc thờ phụng đúng đắn [ROOT.Faith.HighGodName].[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
  mandala_monotheist_warning: "\n\n$FAITH_MANDALA_MONOTHEIST_WARNING$"
  mandala_monotheist_warning_tt_global: "[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
  mandala_monotheist_warning_tt_first: "$mandala_monotheist_warning_tt_global$"
  mandala_monotheist_warning_tt_third: "$mandala_monotheist_warning_tt_global$"
  doctrine_polytheist_name: "Đa Thần"
  doctrine_polytheist_desc: "Vũ trụ đầy rẫy những thần linh và linh hồn quyền năng. Có thể có một nhóm thần được sắp xếp trong một thần điện rõ ràng, nhưng cũng có thể thế giới tâm linh là vô số, thấm permeates mọi thứ xung quanh chúng ta, và thậm chí không có thần nào được đặt tên."

  unreformed_faith_doctrine_name:1 "Chưa Cải cách"
  unreformed_faith_name:1 "giáo lý"
  unreformed_faith_doctrine_desc:1 "Một Đức tin Chưa Cải cách thiếu hệ thống giáo sĩ tổ chức và giáo lý chính thống được thiết lập; các cộng đồng khác nhau có thể danh nghĩa cùng theo một đức tin nhưng lại có tập tục và niềm tin tôn giáo rất khác nhau."
  doctrine_parameter_unreformed:1 "Ngăn các [rulers|E] Bộ lạc thay đổi loại hình [government|E] \n$EFFECT_LIST_BULLET$Ban cho [unreformed_pagan_combat_bonus|E]"
  doctrine_parameter_hostility_override_tenet_unreformed_syncretism:2 "Các [faiths|E] phi Ngoại giáo có tín điều $tenet_unreformed_syncretism_name$ được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"

  west_african_unreformed_faith_doctrine_name:0 "$unreformed_faith_doctrine_name$"
  west_african_unreformed_faith_doctrine_desc:0 "$unreformed_faith_doctrine_desc$"
 
  heresy_hostility_name:0 "Quan điểm về Dị giáo"
  heresy_hostility_doctrine_name:0 "Dị giáo"
  heresy_hostility_doctrine_desc:0 "Hãy cảnh giác với những kẻ tiên tri giả mạo, những kẻ bóp méo và làm băng hoại Đức tin vì mục đích riêng. Những kẻ như vậy là dị giáo và cần phải bị tiêu diệt."

  divine_destiny_name:0 "Thiên mệnh"
  divine_destiny_doctrine_name:0 "Những Kẻ Cai trị Chính danh của Thế giới"
  divine_destiny_doctrine_desc:0 "Chúng ta là những người sẽ mở ra một kỷ nguyên hòa bình và thịnh vượng cho toàn thể nhân loại. Chúng ta là những kẻ cai trị chính danh của thế giới."
  doctrine_parameter_divine_destiny_holy_war_cost_reduction:0 "Chi phí [piety|E] cho Thánh chiến: #P -50%#!"
 
  adoptionist_school_name:0 "Tín điều Nhận tử"
  special_doctrine_adoptionist_school_elipandic_doctrine_name:0 "Trường phái Elipandic"
  special_doctrine_adoptionist_school_elipandic_doctrine_desc:0 "Ưu tiên tập trung vào những khác biệt tinh tế trong Kitô học, biến thể Elipandic của $adoptionist$ nhấn mạnh tầm quan trọng của những khác biệt #EMP chính xác#! so với giáo điều Ba Ngôi. Một sự phân biệt phức tạp nhưng chuẩn xác được xem là vô hạn lần tốt hơn một lời giải thích đơn giản nhưng thiếu cơ sở."
  special_doctrine_adoptionist_school_felicitous_doctrine_name:0 "Trường phái Felicitous"
  special_doctrine_adoptionist_school_felicitous_doctrine_desc:0 "Những người $adoptionist$ theo Felician tin vào tính thực tiễn hơn là sự thuần khiết, hiểu rằng cần phải hoạt động trong các hệ thống thù địch để làm suy yếu chúng. Một lời dối trá ghê tởm nhằm theo đuổi mục tiêu cao cả được cho là đáng giá hơn ngàn sự thật trần trụi."
  special_doctrine_adoptionist_school_radical_doctrine_name:0 "Trường phái Cấp tiến"
  special_doctrine_adoptionist_school_radical_doctrine_desc:0 "Những $adoptionist_adherent_plural$ cấp tiến không thừa nhận vị Thần nào ngoài Chúa Cha, không chấp nhận bất kỳ thần tính nào từ xác phàm, và không công nhận bất kỳ $christianity_religion_adherent_plural$ nào ngoài chính họ. Đón nhận Đấng Christ mà không đồng thuận từng #EMP chữ#! trong giáo luật chẳng khác nào thừa nhận sự bội giáo."

  special_doctrine_is_christian_faith_name:0 "Giáo huấn của Chúa Giê-su"
  is_christian_faith_name:0 "$special_doctrine_is_christian_faith_name$"
  special_doctrine_is_christian_faith_desc:0 "Trên thế gian có những người tuân theo giáo huấn của Chúa Giê-su nhưng không thừa nhận thần tính của Ngài. Dù là báng bổ, chúng ta vẫn nên thể hiện lòng trắc ẩn với những linh hồn lầm lạc này, vì một ngày nào đó họ có thể cải đạo sang đức tin chân chính."
  doctrine_parameter_hostility_override_tenet_christian_syncretism:3 "Các [faiths|E] phi Kitô giáo có tín điều $tenet_christian_syncretism_name$ được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"

  special_doctrine_is_islamic_faith_name:0 "Giáo huấn của Nhà Tiên tri"
  is_islamic_faith_name:0 "$special_doctrine_is_islamic_faith_name$"
  special_doctrine_is_islamic_faith_desc:0 "Dù không tuân theo toàn bộ luật lệ của Nhà Tiên tri, vẫn có những người trên thế gian này được dẫn dắt bởi ý chí của Allah nhiều hơn họ tưởng. Theo thời gian, những kẻ cải đạo nửa vời này thậm chí có thể từ bỏ con đường tà ác và trở thành thành viên chân chính của Ummah!"
  doctrine_parameter_hostility_override_tenet_islamic_syncretism:3 "Các [faiths|E] phi Hồi giáo có tín điều $tenet_islamic_syncretism_name$ được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"

  special_doctrine_is_jewish_faith_name:0 "Giáo huấn của Môi-sê"
  is_jewish_faith_name:0 "$special_doctrine_is_jewish_faith_name$"
  special_doctrine_is_jewish_faith_desc:0 "Không phải tất cả những người ngoại bang đều chìm đắm trong tội lỗi. Có những người tôn trọng dân tộc được Chúa chọn, và họ xứng đáng nhận lại một phần sự tôn trọng từ chúng ta."
  doctrine_parameter_hostility_override_tenet_jewish_syncretism:3 "Các [faiths|E] phi Do Thái có tín điều $tenet_jewish_syncretism_name$ được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"

  prophecy_of_malachi_name:0 "Lời tiên tri của Malachi"
  special_doctrine_not_allowed_to_hof_name:0 "Giáo sĩ đoàn bị Giải thể"
  not_allowed_to_hof_name:0 "$special_doctrine_not_allowed_to_hof_name$"
  prophecy_of_malachi_desc:0 "Theo giáo lý Do Thái truyền thống, một Thượng tế mới chỉ có thể được chỉ định khi Nhà Tiên tri xuất hiện hoặc khi tìm được một hậu duệ của Aaron đủ tư cách để phục vụ."
  special_doctrine_not_allowed_to_hof_desc:0 "Chức vị Thượng tế của đức tin này đã bị giải thể hoàn toàn. Mọi nỗ lực chỉ định một Thượng tế trước hết sẽ đòi hỏi việc tái thiết toàn diện cơ cấu giáo hội truyền thống."
  doctrine_parameter_block_from_create_hof_parameter:0 "Đức tin này không thể tái lập [head_of_faith|E] của mình trong những điều kiện thông thường."

  special_doctrine_is_eastern_faith_name:0 "Đan xen Đa Tôn giáo"
  is_eastern_faith_name:0 "$special_doctrine_is_eastern_faith_name$"
  special_doctrine_is_eastern_faith_desc:0 "Chúng ta gắn kết với nhau không phải bởi một đức tin duy nhất, mà bởi nhiều đức tin tạo nên cấu trúc tôn giáo của xã hội chúng ta. Dù mang những danh xưng khác nhau và đi theo những con đường khác nhau, một số người ngoài hệ thống tín ngưỡng của chúng ta đã học được cách cùng tồn tại trong xã hội này như thể họ là một phần của chúng ta."
  doctrine_parameter_hostility_override_tenet_eastern_syncretism:0 "Các [faiths|E] phi Đông phương có tín điều $tenet_eastern_syncretism_name$ được xem là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"

  special_doctrine_is_sinitic_faith_name:0 "Vũ Trụ Quan Hoa Hạ"
  is_sinitic_faith_name:0 "$special_doctrine_is_sinitic_faith_name$"
  special_doctrine_is_sinitic_faith_desc:0 "$special_doctrine_is_eastern_faith_desc$"
  doctrine_parameter_hostility_override_tenet_sinitic_syncretism:0 "Các [faiths|E] ngoại bang có giáo điều $tenet_sinitic_syncretism_name$ được coi là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] thay vì $hostility_evil_tooltippable$"
  
  special_doctrine_is_gnostic_faith_name:0 "$tenet_gnosticism_name$"
  is_gnostic_faith_name:0 "$special_doctrine_is_gnostic_faith_name$"
  special_doctrine_is_gnostic_faith_desc:0 "$tenet_gnosticism_desc$"

  special_doctrine_fire_worship_name:0 "Thánh Hỏa"
  fire_worship_name:0 "$special_doctrine_fire_worship_name$"
  special_doctrine_fire_worship_desc:0 "Tất cả chúng ta được gắn kết bởi sự tôn thờ lửa, nguyên tố thuần khiết nhất và là hiện thân của vinh quang thần thánh. Bổn phận thiêng liêng của chúng ta là duy trì những ngọn lửa vĩnh cửu trên thế gian, để xua tan dối trá và cái ác."

  doctrine_parameter_same_hof_hostility_override:0 "Xem các [faiths|E] khác có chung [head_of_faith|E] là [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

  is_hostile_to_maitreya_name: "Thù địch với $maitreya$"
  special_doctrine_maitreya_hostility_name: "Thù địch với $maitreya_adherent_plural$"
  special_doctrine_maitreya_hostility_desc: "$maitreya_adherent_plural$ tìm cách tiêu diệt tất cả những tín đồ khác của giáo lý Phật. Mặc dù không phải tất cả đều đi cùng con đường, nhưng những cách của $maitreya$ là không thể chấp nhận."
  special_doctrine_is_maitreya_name: "Là $maitreya$"
  special_doctrine_is_maitreya_desc: "Chúng ta có nghĩa vụ trang nghiêm để tái thiết thế giới và mở ra thời đại của Phật Metteya."

