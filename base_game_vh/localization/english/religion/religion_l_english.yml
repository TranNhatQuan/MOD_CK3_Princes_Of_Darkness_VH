 doctrine_funeral_name: "Truyền thống Tang lễ"
 doctrine_funeral_stoic_name: "An táng Khắc kỷ"
 doctrine_funeral_stoic_desc: "Thân xác đã chết, nhưng linh hồn vẫn tiếp tục tồn tại. Cái chết không phải lúc để than khóc hay bi lụy; tang lễ là để tôn vinh người đã khuất bằng cách an táng thân xác họ xuống đất trong một nghi thức yên lặng và khiêm nhường."
 doctrine_funeral_bewailment_name: "An táng Than khóc"
 doctrine_funeral_bewailment_desc: "Linh hồn đã bắt đầu hành trình dài đến [ROOT.Faith.PositiveAfterLife] và chúng ta sẽ không bao giờ còn gặp lại họ trong cõi người sống. Điều bắt buộc là tất cả những ai từng quen biết người đã khuất phải tụ họp và bày tỏ nỗi đau buồn của mình bằng một nghi thức than khóc công khai. Điều này vừa tôn vinh người chết, vừa thanh tẩy linh hồn chúng ta khỏi nỗi đau do sự ra đi của họ gây nên."
 doctrine_funeral_cremation_name: "Hỏa táng"
 doctrine_funeral_cremation_desc: "Từ tro bụi mà đến, rồi sẽ trở về tro bụi. Thi hài của người đã khuất được thiêu rụi trên một giàn hỏa táng lớn, và phần tro cốt thu được sẽ được rải khắp mặt đất để tiếp tục hành trình của người chết."
 doctrine_funeral_sky_burial_name: "$tenet_sky_burials_name$"
 doctrine_funeral_sky_burial_desc: "$tenet_sky_burials_desc$"
 doctrine_funeral_mummification_name: "Ướp xác"
 mummification_funeral_name: "Mummification"
 doctrine_funeral_mummification_desc: "Thân xác đã ngừng hoạt động, nhưng nó vẫn là vật chứa mà qua đó linh hồn sẽ du hành đến [ROOT.Faith.PositiveAfterLife]. Vì vậy, hình hài vật chất phải được bảo toàn vững bền như linh hồn, chờ đợi sự phán xét của [ROOT.Faith.FateGodName]."
 doctrine_family_rites_name: "Nghi lễ Gia tộc"
 doctrine_family_rites_desc: "Cái chết là khoảng thời gian để tang và thực hành nghi lễ đối với người đang sống. Thứ bậc và thâm niên quan trọng trong cái chết không kém gì khi còn sống; việc tôn kính những bậc cao niên ngay cả sau khi họ qua đời là điều thiết yếu, và cũng quan trọng không kém là phải thể hiện sự tôn kính ấy theo đúng nghi thức."
 doctrine_parameter_burial_funeral: ""
 doctrine_parameter_stoic_funeral: "[activity|E] [funeral|E] mang lại nhiều cơ hội hơn để nhận [piety|E]"
 doctrine_parameter_bewailment_funeral: "[activity|E] [funeral|E] mang lại nhiều cơ hội hơn để giảm [stress|E]"
 doctrine_parameter_cremation_funeral: "[activity|E] [funeral|E] có chi phí [gold|E] giảm đáng kể"
 doctrine_parameter_mummification_funeral: "[activity|E] [funeral|E] tốn nhiều [gold|E] hơn và tạo ra các [artifacts|E] mạnh mẽ khi kết thúc hoạt động"
 doctrine_parameter_family_rites: "[activity|E] [funeral|E] mang lại cơ hội để nhận [merit|E]"
