  doctrine_homosexuality_name:1 "Quan hệ đồng giới"
  doctrine_homosexuality_crime_name:1 "Phạm pháp"
  doctrine_homosexuality_crime_desc:0 "Những ham muốn tội lỗi của bọn loạn luân là mối nguy cho xã hội, vì vậy chúng phải bị trừng phạt và giam cầm vì những hành vi sai trái."
  doctrine_homosexuality_shunned_name:1 "Bị xa lánh"
  doctrine_homosexuality_shunned_desc:0 "Hai người đàn ông quan hệ tình dục với nhau là điều trái tự nhiên, bất kể hoàn cảnh ra sao."
  doctrine_homosexuality_accepted_name:1 "Được chấp nhận"
  doctrine_homosexuality_accepted_desc:0 "Tình yêu vượt qua thể xác để đạt đến điều sâu sắc và kỳ diệu, không thể bị giới hạn bởi giới tính."
  doctrine_parameter_homosexuality_illegal:1 "Đàn ông có [trait|E] [GetTrait('sodomite').GetName( GetNullCharacter )] bị coi là [criminals|E]"
  doctrine_parameter_homosexuality_shunned:1 "Đàn ông có [trait|E] [GetTrait('sodomite').GetName( GetNullCharacter )] bị [shunned|E]"
  doctrine_parameter_homosexuality_accepted:0 "Quan hệ đồng giới được hoàn toàn chấp nhận"
 
  doctrine_deviancy_name:0 "Lệch lạc"
  doctrine_deviancy_crime_name:0 "Phạm pháp"
  doctrine_deviancy_crime_desc:0 "Chỉ có một cách đúng đắn để yêu thương. Mọi sự lệch lạc khỏi khuôn mẫu đó đều là tội lỗi và cần bị trừng phạt."
  doctrine_deviancy_shunned_name:0 "Bị xa lánh"
  doctrine_deviancy_shunned_desc:0 "Một số hành vi tình dục đơn giản là dị thường và kỳ quái. Những kẻ có ham muốn như vậy cũng dị thường không kém."
  doctrine_deviancy_accepted_name:0 "Được chấp nhận"
  doctrine_deviancy_accepted_desc:0 "Tình yêu đẹp đẽ và thiêng liêng dưới mọi hình thức. Mọi người đều nên được phép yêu và sống theo ý muốn."
  doctrine_deviancy_virtuous_name:0 "Đức hạnh"
  doctrine_deviancy_virtuous_desc:0 "Khoái lạc xác thịt đưa chúng ta đến gần thần thánh hơn, và những ai thoát khỏi ham muốn thông thường chính là đỉnh cao đức hạnh của đức tin."
  doctrine_parameter_deviancy_illegal:0 "Nhân vật có [trait|E] [GetTrait('deviant').GetName( GetPlayer )] bị coi là [criminals|E]"
  doctrine_parameter_deviancy_shunned:0 "Nhân vật có [trait|E] [GetTrait('deviant').GetName( GetPlayer )] bị [shunned|E]"
  doctrine_parameter_deviancy_accepted:0 "Nhân vật có [trait|E] [GetTrait('deviant').GetName( GetPlayer )] được hoàn toàn chấp nhận"
 
  doctrine_witchcraft_name:0 "Phù thủy"
  doctrine_witchcraft_crime_name:0 "Phạm pháp"
  doctrine_witchcraft_crime_desc:0 "Chỉ thần thánh mới có quyền làm phép màu trên cõi đời này. Bất kỳ kẻ nào cả gan làm điều báng bổ tương tự đều sẽ bị trừng phạt vì sự kiêu ngạo và ngông cuồng của mình."
  doctrine_witchcraft_shunned_name:0 "Bị xa lánh"
  doctrine_witchcraft_shunned_desc:0 "Thần thánh có quyền kiểm soát hợp pháp đối với các thế lực siêu nhiên trong thế giới này, vì vậy mọi nỗ lực ép buộc những thế lực đó phục tùng ý chí phàm nhân đều vốn dĩ là sai lầm."
  doctrine_witchcraft_accepted_name:0 "Được chấp nhận"
  doctrine_witchcraft_accepted_desc:0 "Ma thuật bao trùm thế giới quanh ta, và việc tiếp cận nó theo cách tổ tiên từng làm là quyền lợi cũng như đặc ân của chúng ta."
  doctrine_witchcraft_virtuous_name:0 "Đức hạnh"
  doctrine_witchcraft_virtuous_desc:0 "Thực hành phù thủy đồng nghĩa với việc đặt linh hồn mình vào hiểm nguy trước các tà linh. Vì sự dũng cảm trong khía cạnh cần thiết này để giữ linh hồn chúng ta trong sạch, các phù thủy đáng được tôn kính."
  doctrine_parameter_witchcraft_illegal:0 "Nhân vật có [trait|E] [GetTrait('witch').GetName( GetPlayer )] bị coi là [criminals|E]"
  doctrine_parameter_witchcraft_shunned:0 "Nhân vật có [trait|E] [GetTrait('witch').GetName( GetPlayer )] bị [shunned|E]"
  doctrine_parameter_witchcraft_accepted:0 "Nhân vật có [trait|E] [GetTrait('witch').GetName( GetPlayer )] được hoàn toàn chấp nhận"
  witchcraft_illegal_name:0 "Học thuyết Phù thủy Phạm pháp"
  witchcraft_shunned_name:0 "Học thuyết Phù thủy Bị xa lánh"
 
  doctrine_head_of_faith_name:0 "Giáo chủ"
  doctrine_head_of_faith_desc:0 "[head_of_faith|E] là người lãnh đạo của một [faith|E]"
  doctrine_no_head_name:0 "Không có"
  doctrine_no_head_desc:0 "Thật là ngu muội khi cho rằng một cá nhân nào đó có thể thực sự thấu hiểu ý chí của [ROOT.Faith.HighGodName]. Chúng ta phải tự lắng nghe con tim mình để khám phá kế hoạch mà [ROOT.Faith.HighGodHerHis] dành cho chúng ta."
  doctrine_parameter_no_head_of_faith:0 "Không có [head_of_faith|E]"
  no_head_of_faith_name: "Học thuyết Không có [head_of_faith|E]"
  doctrine_parameter_minimum_fervor:0 "[fervor|E] không thể giảm xuống dưới #V $VALUE|0$%#!"
  doctrine_spiritual_head_name:0 "Tinh thần"
  doctrine_spiritual_head_desc:0 "Thế giới vật chất và thế giới tinh thần không giống nhau. Chúng ta phải đảm bảo thế giới tinh thần có lãnh đạo riêng, để dẫn dắt chúng ta và bảo vệ đức tin khỏi bị vấy bẩn bởi những ham muốn trần tục."
  doctrine_parameter_spiritual_head_of_faith:0 "Chức vị [head_of_faith|E] được trao cho một giáo sĩ nổi bật"
  doctrine_parameter_spiritual_head_of_faith_claims:0 "[head_of_faith|E] có thể ban [claims|E] đối với các [titles|E] đã có chủ cho những tín đồ mộ đạo"
  doctrine_parameter_spiritual_head_of_faith_gold:0 "[head_of_faith|E] có thể ban [gold|E] cho những tín đồ mộ đạo"
  doctrine_temporal_head_name:0 "Thế tục"
  doctrine_parameter_temporal_head_of_faith:0 "Chức vị [head_of_faith|E] được trao cho người sáng lập [faith|E] và sẽ truyền lại cho [primary_heir|E] của họ khi qua đời"
  doctrine_parameter_temporal_head_of_faith_directed_holy_wars:1 "Nếu Đức tin có [great_holy_wars|E], Giáo chủ được phép chỉ đạo cuộc chiến và lựa chọn mục tiêu chiến tranh"
  doctrine_temporal_head_desc:0 "Tinh thần và vật chất gắn bó chặt chẽ, không thể tách rời. Thật ngu ngốc khi có hai lãnh đạo khác nhau cho cùng một cõi."
 
  doctrine_marriage_type_name:0 "Loại hình hôn nhân"
  doctrine_monogamy_name:0 "Một vợ một chồng"
  doctrine_monogamy_desc:0 "Hôn nhân là mối ràng buộc thiêng liêng giữa hai cá nhân. Cố gắng tạo lập mối ràng buộc như vậy với nhiều người cùng lúc là hành vi báng bổ."
  doctrine_polygamy_name:0 "Đa thê"
  doctrine_polygamy_desc:0 "Vì hôn nhân là sự kết hợp thánh thiêng, nên việc có nhiều cuộc hôn nhân rõ ràng là thiêng liêng hơn chỉ một cuộc — miễn là mỗi cuộc hôn nhân đều tự thân thánh thiện."
  doctrine_concubines_name:1 "Thê thiếp"
  doctrine_concubines_desc:1 "Hôn nhân là mối ràng buộc thiêng liêng, nhưng miễn là người phối ngẫu giữ vị trí ưu tiên, một người vẫn có thể được phép có thê thiếp."
 
