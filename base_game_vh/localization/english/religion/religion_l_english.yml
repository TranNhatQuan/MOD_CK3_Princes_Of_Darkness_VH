  doctrine_pilgrimage_name:0 "Thái độ Hành hương"
  doctrine_pilgrimage_local_rites_name: "Nghi lễ địa phương"
  doctrine_pilgrimage_local_rites_desc: "Những tín đồ của đức tin này ưa thích sự an toàn và ổn định từ các nghi lễ thường nhật tại đền thờ địa phương hơn là những khó khăn và mệt mỏi từ các chuyến hành hương dài ngày."
  doctrine_parameter_local_shrine_offering:0 "Có quyền truy cập [GetDecisionWithKey('visit_local_shrine_decision').GetName] [decision|E], nhưng [pilgrimage|E] [activity|E] tốn kém hơn"
  local_shrine_offering_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_local_rites_name$"
  doctrine_pilgrimage_forbidden_name:0 "Bị cấm"
  doctrine_pilgrimage_forbidden_desc:0 "Sự hiện diện của [ROOT.Faith.HighGodName] có thể cảm nhận ở khắp mọi nơi, và việc cho rằng một số nơi linh thiêng hơn những nơi khác là điều phản giáo."
  doctrine_pilgrimage_encouraged_name:0 "Khuyến khích"
  doctrine_pilgrimage_encouraged_desc:0 "Đức tin này khuyến khích các tín đồ đến thăm những địa điểm trên trần gian được coi là có ý nghĩa tâm linh như một cách để thể hiện lòng tôn kính đối với [ROOT.Faith.PantheonTerm]."
  doctrine_pilgrimage_mandatory_name:0 "Bắt buộc"
  doctrine_pilgrimage_mandatory_desc:0 "Mọi [ROOT.Faith.GetAdherentNamePlural] có khả năng đều được kỳ vọng hoàn thành một chuyến hành hương đến nơi linh thiêng ngay khi có thể. Việc không làm như vậy đồng nghĩa với thất bại trong việc phục tùng [ROOT.Faith.HighGodName]."
  doctrine_pilgrimage_mandatory_hajj_name:0 "Hajj"
  doctrine_pilgrimage_mandatory_hajj_desc:0 "Mọi tín đồ Hồi giáo có khả năng đều được kỳ vọng hoàn thành Hajj đến Mecca trong đời. Dù thường có những ngoại lệ đặc biệt, bất kỳ [ROOT.Faith.GetAdherentNameNoTooltip] nào không hoàn thành Hajj sẽ bị nhìn nhận với sự nghi ngờ."
  forbidden_from_pilgrimage_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_forbidden_name$"
  doctrine_parameter_forbidden_from_pilgrimage:0 "Không có quyền truy cập vào [pilgrimage|E] [activity|E][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_pilgrimage_warning')]"
  doctrine_parameter_can_go_on_pilgrimage:0 "Có quyền truy cập vào [pilgrimage|E] [activity|E]"
  mandatory_pilgrimage_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
  doctrine_parameter_mandatory_pilgrimage:1 "[GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E] cung cấp thêm phần thưởng và [pilgrimage|E] [activity|E] mang lại thêm [piety|E] khi hoàn thành"
  mandatory_hajj_name:0 "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
  doctrine_parameter_mandatory_hajj:1 "[GetTrait('hajjaj').GetName( GetNullCharacter )] [trait|E] cung cấp thêm phần thưởng và [hajj|E] [activity|E] mang lại thêm [piety|E] khi hoàn thành"
  doctrine_parameter_basic_pilgrimage_rewards:0 ""
  mandala_pilgrimage_warning: "\n@alert_icon! #alert_trial Chuyển sang $forbidden_from_pilgrimage_name$ [faith|E] sẽ khiến bạn không thể tiến triển như một [mandala_government|E] [ruler|E]#!\n"

 special_doctrine_has_jizya_doctrine_name: "$tenet_tax_nonbelievers_jizya_name$"
