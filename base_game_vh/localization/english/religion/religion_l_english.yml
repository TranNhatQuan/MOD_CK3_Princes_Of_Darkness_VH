 global_religion.1000.t: "Những [local_character.GetFaith.GetAdherentNamePluralNoTooltip] bị lưu đày"
 global_religion.1000.desc_same_faith_counties: "Hơn [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] [local_character.GetFaith.GetAdherentNamePlural], bị lưu đày khỏi [target_faith_associated_county.GetName], mong muốn được gia nhập lãnh địa của ta. Thủ lĩnh của họ, [local_character.GetFirstName], xin được yết kiến: \"Chúng Ta đang tìm kiếm một cuộc sống tốt đẹp và an toàn hơn, [ROOT.Char.GetTitleAsNameNoTooltip],\" [local_character.GetSheHe] nói. \"Hãy cho phép chúng Ta định cư trên khắp [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\""
 global_religion.1000.desc_same_faith_counties_alt: "Cuộc đàn áp tôn giáo đang lan tràn tại [target_faith_associated_county.GetName], nơi giới quý tộc theo đức tin [target_faith_associated_county_faith.GetAdjective] đang cưỡng ép cải đạo các [local_character.GetFaith.GetAdherentNamePlural].\n\nGiờ đây, hơn [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] người lưu đày mong muốn được gia nhập lãnh địa của ta. Thủ lĩnh của họ, [local_character.GetFirstName], xin được yết kiến: \"Chúng Ta đang tìm kiếm một cuộc sống tốt đẹp và an toàn hơn, [ROOT.Char.GetTitleAsNameNoTooltip],\" [local_character.GetSheHe] nói. \"Hãy cho phép chúng Ta định cư trên khắp [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\""
 global_religion.1000.desc_any_counties: "Cuộc đàn áp tôn giáo đang lan tràn tại [target_faith_associated_county.GetName], nơi giới quý tộc theo đức tin [target_faith_associated_county_faith.GetAdjective] đang cưỡng ép cải đạo các [local_character.GetFaith.GetAdherentNamePlural].\n\nGiờ đây, hơn [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] người lưu đày mong muốn được gia nhập lãnh địa của ta. Thủ lĩnh của họ, [local_character.GetFirstName], xin được yết kiến: \"Chúng Ta đang tìm kiếm một cuộc sống tốt đẹp và an toàn hơn, [ROOT.Char.GetTitleAsNameNoTooltip],\" [local_character.GetSheHe] khẩn cầu. \"Hãy cho phép chúng Ta định cư quanh [initial_county_target.GetNameNoTier].\"\n\nNếu ta cho phép, đức tin [local_character.GetFaith.GetAdjective] sẽ lan rộng khắp [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.desc_any_counties_alt: "Hơn [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] [local_character.GetFaith.GetAdherentNamePlural], bị lưu đày khỏi [target_faith_associated_county.GetName], mong muốn được gia nhập lãnh địa của ta. Thủ lĩnh của họ, [local_character.GetFirstName], xin được yết kiến: \"Chúng Ta đang tìm kiếm một cuộc sống tốt đẹp và an toàn hơn, [ROOT.Char.GetTitleAsNameNoTooltip],\" [local_character.GetSheHe] khẩn cầu. \"Hãy cho phép chúng Ta định cư quanh [initial_county_target.GetNameNoTier].\"\n\nNếu ta cho phép, đức tin [local_character.GetFaith.GetAdjective] sẽ lan rộng khắp [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.special: "Ta sẽ tiếp nhận đức tin [local_character.GetFaith.GetAdjectiveNoTooltip]!"
 global_religion.1000.a: "Các ngươi được chào đón nồng nhiệt."
