 #Ari
 ari:0 "Ari"
 ari_adj:0 "Ari"
 ari_adherent:0 "Ari"
 ari_adherent_plural:0 "Ari"
 ari_desc:0 "Đức tin Ari kết hợp các yếu tố của Phật giáo Mật tông, tín ngưỡng linh hồn, tín ngưỡng Nāga truyền thống cũng như Ấn Độ giáo. Những người theo Ari được xem là Phật tử, dù các thực hành của họ bị coi là phần nào không chính thống."

 #Theravada
 theravada:0 "Theravada"
 theravada_adj:0 "Theravada"
 theravada_adherent:0 "Phật tử Theravada"
 theravada_adherent_plural:0 "Phật tử Theravada"
 theravada_desc:0 "Con đường dẫn tới giác ngộ đi qua trải nghiệm cá nhân, sự chiêm nghiệm và lý trí. Đức Phật Thích-ca đã tự mình tìm ra con đường đến Niết Bàn, và cách duy nhất để tìm ra con đường tương tự là tự trải nghiệm, học hỏi và nghiên cứu chính sự tồn tại của bản thân."

 #Mahayana
 mahayana:0 "Đại thừa"
 mahayana_adj:0 "Đại thừa"
 mahayana_adherent:0 "Phật tử Đại thừa"
 mahayana_adherent_plural:0 "Phật tử Đại thừa"
 mahayana_desc:0 "Giải thoát khỏi luân hồi không chỉ là hành trình cá nhân, mà là trải nghiệm được chia sẻ giữa tất cả chúng sinh. Thành tựu Phật quả chỉ là một bước trên con đường dài để mọi chúng sinh đều được giải thoát vào Niết Bàn, và đó chính là mục tiêu cao cả của luân hồi."

 #Vajrayana
