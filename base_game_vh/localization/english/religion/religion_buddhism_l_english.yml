 dhyana: "Dhyana"
 dhyana_adj: "Dhyana"
 dhyana_adherent: "Thiền giả"
 dhyana_adherent_plural: "Thiền giả"
 dhyana_desc: "Phật giáo Dhyana đặc biệt nhấn mạnh thiền định sâu sắc và thâm áo như con đường duy nhất khả thi dẫn tới giác ngộ — chỉ thông qua sự quán chiếu và chiêm nghiệm nội tâm, chứ không phải bằng việc nghiên cứu kinh điển, con người mới có thể đạt được sự thấu hiểu chân thật."

 vinaya: "Vinaya"
 vinaya_adj: "Vinaya"
 vinaya_adherent: "Người theo Luật tạng"
 vinaya_adherent_plural: "Người theo Luật tạng"
 vinaya_desc: "Những người theo Phật giáo Vinaya tự đặt mình và lẫn nhau dưới những chuẩn mực đạo đức và luân lý nghiêm khắc, bởi kỷ luật tự thân là nền tảng cần thiết cho việc theo đuổi trí tuệ thâm sâu."
 
 pundarika: "Pundarika"
 pundarika_adj: "Pundarika"
 pundarika_adherent: "Phật tử Pundarika"
 pundarika_adherent_plural: "Phật tử Pundarika"
 pundarika_desc: "Kinh Pháp Hoa được tôn kính và thờ phụng cao hơn mọi kinh điển khác trong Phật giáo Pundarika, vốn nhấn mạnh các chân ngôn và nghi lễ phức tạp, và có nguồn gốc từ sự pha trộn giữa các yếu tố Mật tông và huyền giáo được truyền sang Trung Hoa dọc theo Con đường Tơ lụa."

 sukhavati: "Sukhavati"
 sukhavati_adj: "Sukhavati"
 sukhavati_adherent: "Phật tử Tịnh Độ"
 sukhavati_adherent_plural: "Phật tử Tịnh Độ"
 sukhavati_desc: "Sukhavati, hay Phật giáo Tịnh Độ, giảng dạy rằng các con đường giác ngộ truyền thống nay đã không còn khả thi. Tuy nhiên, bằng cách khẩn cầu lòng từ bi của Phật A Di Đà qua việc xưng niệm danh hiệu của Ngài, người ta có thể được tái sinh về Tịnh Độ của Ngài sau khi qua đời, dù là tu sĩ hay cư sĩ."

 yogacara: "Yogacara"
 yogacara_adj: "Yogacara"
 yogacara_adherent: "Phật tử Duy Thức"
 yogacara_adherent_plural: "Phật tử Duy Thức"
 yogacara_desc: "Phật tử Yogacara chất vấn những điều mà người khác suốt đời vẫn mặc nhiên chấp nhận, xem thế giới vật chất chẳng qua chỉ là sự biểu hiện của chính thức tâm của họ."

 avatamsaka: "Avatamsaka"
 avatamsaka_adj: "Avatamsaka"
 avatamsaka_adherent: "Phật tử Hoa Nghiêm"
 avatamsaka_adherent_plural: "Phật tử Hoa Nghiêm"
 avatamsaka_desc: "Phật tử Avatamsaka coi Kinh Hoa Nghiêm là nguồn chân lý tối thượng, nói về vô số thế giới, về những toàn thể vũ trụ được chứa đựng trong một hạt bụi nhỏ bé."

 mantrayana: "Mantrayana"
 mantrayana_adj: "Mantrayana"
 mantrayana_adherent: "Phật tử Chân Ngôn thừa"
 mantrayana_adherent_plural: "Phật tử Chân Ngôn thừa"
 mantrayana_desc: "Phật tử Mantrayana tăng cường sự thấu hiểu về những điều thâm sâu và đẩy nhanh hành trình tâm linh của mình bằng một loạt các nghi lễ huyền bí và pháp khí bí truyền."

 maitreya: "Di Lặc"
 maitreya_adj: "Di Lặc"
 maitreya_adherent: "Tín đồ Di Lặc"
 maitreya_adherent_plural: "Tín đồ Di Lặc"
 maitreya_desc: "Thời đại của Đức Phật Thích-ca đã kết thúc và Đức Phật Di Lặc đã giáng thế, theo niềm tin của những người tôn sùng và đón nhận Ngài như vị cứu thế được tiên tri. Chỉ thông qua sự hủy diệt trật tự cũ thì thế giới mới có thể được cứu rỗi."
 maitreya_religious_head_title: "Hierarch"  # 教主
