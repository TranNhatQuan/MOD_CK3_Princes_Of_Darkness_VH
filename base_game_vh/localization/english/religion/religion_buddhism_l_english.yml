 vajrayana_desc:0 "Động cơ hướng tới Phật quả là điều tối quan trọng, và giác ngộ chân chính chỉ có thể đạt được khi được tìm cầu vì lợi ích của tất cả chúng sinh. Mọi hữu tình đều sinh ra với tâm giác ngộ, nhưng nó bị che mờ bởi sự tồn tại. Việc tu tập để thấy được chân lý của thế giới và vũ trụ sẽ khai mở giác ngộ vốn có ấy."
