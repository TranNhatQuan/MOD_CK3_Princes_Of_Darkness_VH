 acharya: "Acharya"
 acharya_adj: "Acharya"
 acharya_adherent: "Phật tử Acharya"
 acharya_adherent_plural: "Phật tử Acharya"
 acharya_desc: "Acharya, một nhánh phát triển từ Phật giáo Kim Cương thừa, đã kết tinh vào thế kỷ thứ chín thông qua sự giao thoa và hòa nhập giữa các nghi lễ Trung Hoa và thực hành Mật tông Tây Tạng, tạo nên một hình thái Phật giáo mang tính khu vực hóa độc đáo trong thực hành và thờ phụng."

