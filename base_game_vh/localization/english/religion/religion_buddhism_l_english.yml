 GLOSS_NEMBUTSU: "Xưng niệm danh hiệu Phật A Di Đà là một pháp tu chánh niệm Phật giáo cổ xưa, nhận được sự quan tâm lớn trong các tông phái Đông Á. Được gọi là Niệm Phật tại Trung Hoa, hay Nembutsu tại Nhật Bản, pháp tu này được một số tông phái coi là cách trực tiếp khẩn cầu lòng từ bi của Phật A Di Đà, nhờ ân đức của Ngài mà người tu, dù là tăng sĩ hay cư sĩ, có thể được tiếp dẫn vào Tịnh Độ."
