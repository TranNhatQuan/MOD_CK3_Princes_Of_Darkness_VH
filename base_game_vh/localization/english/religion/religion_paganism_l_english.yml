 bilikuism_desc: "Những người thờ phụng nữ thần nhện Biliku, các tín đồ Bilikuism duy trì một mối quan hệ đầy đối kháng với các vị thần của mình. Người ta tin rằng chính Biliku sẽ trực tiếp giáng sự trừng phạt lên các tín đồ của bà bằng những cơn gió mùa nếu họ hủy hoại các tạo vật của bà và không sống hài hòa với thế giới do bà tạo ra. Hệ thần linh bao gồm Biliku và người chồng của bà, các con của họ, cùng vô số Tổ tiên loài người."
