 biliku_religion_desc: "Đây là tín ngưỡng vào một hệ thần linh có mối quan hệ phức tạp với nhân loại. Nhiều câu chuyện của người Nakkavara kể về những tổ tiên vĩ đại giao chiến với các vị thần tối cao trong đức tin của họ. Một số người nhân cách hóa vị thần tối cao thành một nữ thần nhện, trong khi những người khác lại xem đó là một vị thần thằn lằn nam giới. Trong mọi dị bản, đấng sáng tạo đã ném một ngọn lửa vào vị tổ tiên vĩ đại đã đánh cắp lửa, rồi biến mất khỏi thế giới vật chất vì mệt mỏi với loài người. Đấng sáng tạo để lại những người con của mình, mang hình dạng của gió, để ban thưởng và trừng phạt con người."

