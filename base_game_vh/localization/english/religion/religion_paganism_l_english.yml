  north_african_religion_desc:0 "Những tín ngưỡng Berber truyền thống tôn thờ Sùng Bái Tổ Tiên và tin rằng khi một người rời khỏi thế giới này, họ sẽ được thần thánh hóa trong chính gia đình mình. Việc thờ đá và xây dựng các công trình cự thạch giúp tín đồ tiến gần hơn tới các vị Thần, trong đó những thần chủ yếu — chỉ đứng sau Đấng Sáng Tạo — là Thần Mặt Trời và Thần Mặt Trăng. Ngay cả với tín đồ của các đức tin khác, sự dung hợp với truyền thống dân gian Bắc Phi vẫn rất phổ biến."
 
