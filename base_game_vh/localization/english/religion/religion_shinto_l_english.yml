 # Shinto
  shinto: "Thần đạo" # 神道
  shinto_adj: "Thần đạo"
  shinto_adherent: "Tín đồ Thần đạo"
  shinto_adherent_plural: "Các tín đồ Thần đạo"
  shinto_desc: "Thế giới linh hồn hiện diện khắp nơi quanh ta, và các linh thể cư ngụ trong mọi ngóc ngách của thế giới. Bất cứ thứ gì cũng có thể bị siêu nhiên chiếm ngự — một chiếc giường, một ngọn núi, thậm chí là một cơn mưa. Việc duy trì sự hài hòa với thế giới linh thiêng này, cũng như dành cho nó sự tôn trọng và thừa nhận xứng đáng, là điều vô cùng quan trọng."
 # Shugendo
  shugendo: "Shugendō" # 修験道
  shugendo_adj: "Shugendō"
  shugendo_adherent: "Tín đồ Shugendō"
  shugendo_adherent_plural: "Các tín đồ Shugendō"
  shugendo_desc: "Con đường đạt tới sức mạnh tâm linh là thông qua kỷ luật. Để thấu hiểu thế giới linh thiêng, các tín đồ Shugendō thực hành vô số nghi lễ và tìm đến những không gian linh thiêng nhất, nơi ranh giới giữa thế giới con người và thế giới linh hồn trở nên mong manh nhất."
  shugendo_devotee: "yamabushi" # 山伏
  shugendo_devoteeplural: "yamabushi"
