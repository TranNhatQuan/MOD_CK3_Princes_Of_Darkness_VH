  shintoism_religion_desc: "Thần đạo bao gồm các tín ngưỡng dân gian tiền Phật giáo của quần đảo Nhật Bản. Cốt lõi của nó là sự thừa nhận các linh hồn sống, hay kami, của thế giới tự nhiên, cũng như nhu cầu khiêm nhường xoa dịu và tôn kính họ để tránh cơn thịnh nộ của họ và nhận được phúc lành."

