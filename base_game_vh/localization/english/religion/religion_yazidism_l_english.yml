  yazidi_religion_adherent_plural:0 "Các Miletê"
  yazidi_religion_desc:0 "Vị thần vĩnh cửu đã tạo ra vũ trụ cùng bảy thiên thần của ngài. Đứng đầu trong số đó là Melek Taus, người được thần trao quyền cai quản thế giới."

  yazidi:0 "Yazidi giáo"
  yazidi_adj:0 "Yazidi"
  yazidi_adherent:0 "Người Yazidi"
  yazidi_adherent_plural:0 "Người Yazidi"
  yazidi_desc:0 "Người Yazidi tin rằng Thượng Đế đã tạo ra thế giới và đặt nó dưới sự bảo hộ của bảy thiên thần, đứng đầu là Tawûsê Melek, Thiên Thần Công. Thiên Thần Công ban đầu thất sủng với Thượng Đế, nhưng những giọt nước mắt ăn năn của ngài đã dập tắt ngọn lửa giam cầm, và ngài được đoàn tụ với Thượng Đế. Tương tự như vậy, tất cả chúng ta đều tìm cách hợp nhất trở lại với Thượng Đế sau vô số kiếp sống dài lâu."
