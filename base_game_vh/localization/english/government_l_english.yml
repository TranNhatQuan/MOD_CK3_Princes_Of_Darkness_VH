  feudal_government_vassals_label:1 "[obligations|E] phong kiến dựa trên [vassal_contract|E] của từng [vassal|E]"
  feudal_government_desc:1 "\n$game_concept_feudal_desc$\n\n#F Chế độ phong kiến là hình thức chính quyền thống trị tại châu Âu từ thế kỷ IX đến thế kỷ XV. Hệ thống phong kiến dựa trên mối quan hệ giữa người nắm giữ đất đai và những người cung cấp dịch vụ và lao động để được sinh sống trên đó. Các lãnh chúa sở hữu đất đai phong đất cho chư hầu cai trị. Đổi lại, chư hầu cung cấp [soldiers|E] và [taxes|E] cho quân chủ của mình.#!"
  feudal_government_obligations:0 "[GetGovernment( 'feudal_government' ).GetName] [obligations|E]"
  feudal_obligation_low:3 "$feudal_government_obligations$ Thấp"
  feudal_obligation_low_short:0 "Thấp"
  feudal_obligation_normal:3 "$feudal_government_obligations$ Bình thường"
  feudal_obligation_normal_short:0 "Bình thường"
