  special_contract:3 "#color_black [Concept( 'vassal_contract', 'Hợp đồng Đặc biệt' )|BU]#!"
  special_contract_none:0 "Không Có Khế Ước Đặc Biệt"
  special_contract_scutage:0 "Khế Ước Chuộc Dịch"
  special_contract_scutage_desc:1 "#flavor Khi chịu $special_contract_scutage$, [vassal|E] sẽ nộp nhiều hơn #high [EmptyScope.ScriptValue('scutage_contract_tax_tooltip')|0]%#! [tax|E] so với mức $feudal_government_taxes$ [obligation|E] quy định, đồng thời cung cấp ít hơn #high [EmptyScope.ScriptValue('scutage_contract_levies_tooltip')|0]%#! [levies|E] so với mức $feudal_government_levies$ [obligation|E] yêu cầu.#!"
  special_contract_march:0 "Khế Ước Biên Trấn"
  special_contract_march_desc:2 "#flavor Khi chịu $special_contract_march$, [vassal|E] nhận thêm thưởng cho [levies] và khả năng phòng thủ, nhưng nộp ít hơn #high [EmptyScope.ScriptValue('march_contract_taxes_tooltip')|0]%#! [tax|E] so với mức $feudal_government_taxes$ [obligation|E] quy định.#!"
  special_contract_march_border_trigger: "[vassal.GetName] không giáp ranh với một [realm|E] ngoại bang"
  special_contract_palatinate:0 "Khế Ước Bá Quốc"
  special_contract_palatinate_desc:2 "#flavor Khi chịu $special_contract_palatinate$, [vassal|E] được hưởng nhiều đặc quyền trong lãnh địa, gia tăng vị thế và ảnh hưởng chính trị. $special_contract_palatinate_short$ [vassals|E] gia tăng [prestige|E] cho [liege|E], nhưng nộp ít hơn #high [EmptyScope.ScriptValue('palatinate_contract_taxes_tooltip')|0]%#! [tax|E] và [levies|E] so với mức $feudal_government_taxes$ và $feudal_government_levies$ [obligations|E] quy định.#!"
  special_contract_castellan: "Khế Ước Tổng Quản Lâu Đài"
  special_contract_castellan_desc: "#flavor Khi chịu sự điều chỉnh của $special_contract_castellan$, [vassal|E] sẽ nhận được tiền thưởng cho [levies] và khả năng phòng thủ của họ. Họ cung cấp #high [EmptyScope.ScriptValue('march_contract_taxes_taxes_tooltip')|0]%#! ít [tax|E] hơn, nhưng #high [EmptyScope.ScriptValue('castellan_contract_levies_tooltip')|0]%#! nhiều [levy|E] hơn so với những gì [obligation|E] $feudal_government_taxes$ của họ quy định.#!"
  special_contract_none_short:0 "Không"
  special_contract_scutage_short:0 "Chuộc Dịch"
  special_contract_march_short:0 "Biên Trấn"
  special_contract_palatinate_short:0 "Bá Quốc"
  special_contract_castellan_short: "Tổng Quản"
 
  religious_rights:0 "Quyền Tự Do Tôn Giáo"
  religious_rights_none:0 "Không Được Bảo Hộ Tôn Giáo"
  religious_rights_none_short:0 "Không Bảo Hộ"
  religious_rights_protected:0 "Được Bảo Hộ Tôn Giáo"
  religious_rights_protected_desc:3 "#emphasis #bold Đặc Quyền [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [liege|E] không thể [demand_conversion|E] [vassal|E]\nThe [liege|E] không thể dùng [convert_county|E] tại lãnh địa của [vassals|E]\n$EFFECT_LIST_BULLET$ [liege|E] không thể dùng [faith|E] làm lý do để tránh [tyranny|E] khi tước đoạt tước vị\n\n#flavor [vassal|E] được trao địa vị bảo hộ đặc biệt, và lãnh địa chính thức công nhận quyền thực hành [faith|E] riêng của họ.#!"
  religious_rights_protected_short:0 "Bảo Hộ"
 
  fortification_rights:0 "Quyền Xây Công Sự"
  fortification_rights_none:0 "Không Có $fortification_rights$"
  fortification_rights_none_short:0 "Không"
  fortification_rights_granted:0 "$fortification_rights$ Được Ban"
  fortification_rights_granted_desc:0 "#flavor [vassal] được trao quyền xây dựng lâu đài và công sự mới với sự hậu thuẫn của [liege]. Trên thực tế, điều này đồng nghĩa họ nộp ít hơn #high [EmptyScope.ScriptValue('fortification_rights_contract_taxes_tooltip')|0]%#! [tax] so với mức $feudal_government_taxes$ [obligation] quy định.#!"
  fortification_rights_granted_short:0 "Được Ban"
 
  succession_rights:0 "Quyền Kế Vị"
  succession_rights_default:0 "$succession_rights$ Mặc Định"
  succession_rights_default_short:0 "Mặc Định"
  succession_rights_forced_partition:0 "Phân Chia Bắt Buộc"
  succession_rights_forced_partition_desc:0 "#emphasis #bold Hạn Chế [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [vassal|E] không thể có [succession_law|E] nào ngoài Phân Chia\n$EFFECT_LIST_BULLET$ [vassal|E] sẽ chuyển sang [succession_law|E] Phân Chia\n$EFFECT_LIST_BULLET$ [vassal|E] phải trả thêm #high [EmptyScope.ScriptValue('succession_rights_contract_law_cost_tooltip')|0]%#! [prestige|E] khi thay đổi [laws|E]\n\n#flavor [vassal|E] buộc phải duy trì chế độ Phân Chia cho [realm|E] của mình. Trở ngại hành chính này cũng làm tăng chi phí thay đổi [law] của [vassals] thêm #high [EmptyScope.ScriptValue('succession_rights_contract_law_cost_tooltip')|0]%.#!#!"
  succession_rights_forced_partition_short:0 "Phân Chia Bắt Buộc"
 
  coinage_rights:0 "Quyền Đúc Tiền"
  coinage_rights_none:0 "Không Có $coinage_rights$"
  coinage_rights_none_short:0 "Không"
  coinage_rights_granted:0 "$coinage_rights$ Được Ban"
  coinage_rights_granted_desc:0 "#flavor [vassal] được trao quyền đúc và lưu hành tiền tệ mới, thúc đẩy [development|E] của họ nhưng làm suy giảm của [liege].#!"
  coinage_rights_granted_short:0 "Được Ban"
 
  war_declaration_rights:0 "Quyền Tuyên Chiến"
  war_declaration_rights_default:0 "$war_declaration_rights$ Mặc Định"
  war_declaration_rights_default_short:0 "Mặc Định"
  war_declaration_rights_allowed:0 "Chuẩn Thuận $war_declaration_rights$"
  war_declaration_rights_allowed_desc:1 "#emphasis #bold Đặc Quyền [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [vassal|E] có thể tuyên [war|E] bất kể [crown_authority|E] của [liege|E]\n$EFFECT_LIST_BULLET$ [vassal|E] trả ít hơn #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! chi phí [casus_bellis|E] trong [realm|E]\n\n#flavor [vassal] không cần tiêu tốn [hook] nếu [crown_authority] của [liege] ngăn cản họ gây chiến. Đặc quyền này cũng giảm chi phí tuyên chiến nội bộ xuống #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
  war_declaration_rights_allowed_short:0 "Chuẩn Thuận"
 
  council_rights:0 "Quyền Tham Gia Hội Đồng"
  council_rights_none:0 "Không Có $council_rights$"
  council_rights_none_desc:0 "#flavor [vassal] không được trao đặc quyền đặc biệt nào liên quan đến [council].#!"
  council_rights_none_short:0 "Không"
  council_rights_guaranteed:0 "$council_rights$ Được Đảm Bảo"
  council_rights_guaranteed_desc:0 "#emphasis #bold Đặc Quyền [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ Có thể sử dụng tương tác #high $force_onto_council$#! bất cứ lúc nào\n\n#flavor [vassal] được trao đặc quyền đặc biệt trong [council] và sẽ mong đợi một ghế thường trực. Ban đặc quyền này cho quá nhiều [vassals] sẽ khiến các [powerful_vassals] trong [realm|E] bất mãn.#!"
  council_rights_guaranteed_short:0 "Đảm Bảo"
 
  title_revocation_rights:0 "Quyền Tước Đoạt Tước Vị"
  title_revocation_rights_default:0 "$title_revocation_rights$ Mặc Định"
  title_revocation_rights_default_short:0 "Mặc Định"
  title_revocation_rights_protected:0 "Bảo Hộ $title_revocation_rights$"
  title_revocation_rights_protected_desc:0 "#emphasis #bold Đặc Quyền [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ [liege|E] không thể tước đoạt [vassals_possessive|E] [titles|E]\n\n#flavor [vassal] được bảo đảm quyền sở hữu [titles], ngăn [liege|E] tước đoạt — bất kể có [revoke_title_reason] hay không.#!"
  title_revocation_rights_protected_short:0 "Bảo Hộ"
 
  clan_government:0 "Thị Tộc"
  clan_government_with_icon: "@government_type_clan! $clan_government$"
  clan_government_adjective:0 "Thị Tộc"
  clan_government_realm:0 "Thị Tộc"
  clan_government_desc:0 "\n$game_concept_clan_desc$\n\n#F Thị tộc được liên kết bởi huyết thống — hoặc bởi mối quan hệ chung với một tổ tiên biểu tượng. Lãnh tụ thị tộc phụ thuộc lớn vào sự ủng hộ của các thành viên. Khi đoàn kết, họ là một thế lực đáng gờm; nhưng khi bất mãn, thị tộc sẽ suy yếu từ bên trong.#!"
  clan_government_vassals_label:1 "Nghĩa Vụ Thị Tộc dựa trên [opinion|E]"
  clan_government_obligations:0 "Dựa trên [opinion|E]"
  clan_government_tax_contribution_postfix:0 " (tối đa [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
  clan_government_levies_contribution_postfix:0 " (tối đa [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
  clan_government_unclamped_contribution_label:0 "Dựa trên [opinion|E] về ta"
  clan_government_min_contribution_label:0 "Tối thiểu theo [crown_authority|E]"
  clan_vassal: "Thị Tộc"
  clan_vassal_desc: "$game_concept_clan_desc$"

  republic_government:0 "Cộng Hòa"
  republic_government_with_icon: "@government_type_republic! $republic_government$"
  republic_government_adjective:0 "Cộng Hòa"
  republic_government_realm:0 "Cộng Hòa"
  republic_government_desc:0 "\n$game_concept_republic_desc$\n\n#F Các thị trấn được cai trị bởi tầng lớp công dân đặc quyền thuộc giai cấp thị dân, trong số đó một người được bầu làm thị trưởng. Dù thị trưởng có ảnh hưởng đáng kể, họ vẫn phụ thuộc vào sự ủng hộ để được tái đắc cử.#!"
  republic_government_vassals_label:1 "Nghĩa Vụ Cộng Hòa giống nhau cho mọi [vassals|E] Cộng Hòa"
  republic_government_obligations:1 "Nghĩa Vụ Cộng Hòa"
  republican_vassals_pay_more_parameter:0 "Từ [culture_traditions|E] của [liege|E]"
  republic_vassal: "Cộng Hòa"
  republic_vassal_desc: "$game_concept_republic_desc$"

  tribal_government:0 "Bộ Lạc"
  tribal_government_with_icon: "@government_type_tribal! $tribal_government$"
  tribal_government_adjective:0 "Bộ Lạc"
  tribal_government_realm:0 "Bộ Lạc"
  tribal_government_desc:0 "\n$game_concept_tribal_desc$\n\n#F Trong bộ lạc, sức mạnh là tất cả. Thủ lĩnh bộ lạc dựa vào uy tín và danh vọng thay vì tiền bạc để phát triển lãnh địa và củng cố quân đội của mình.#!"

  tribal_government_obligations:0 "Dựa trên [prestige_level|E] của [liege|E]"
  tribal_government_vassals_label:1 "Nghĩa Vụ Bộ Lạc dựa trên [prestige_level|E] của [liege|E]"
  tribal_liege_inefficiency_plus_perk:0 "[liege|E] là [tribal|E] và có [GetPerk( 'detailed_ledgers_perk' ).GetName( GetPlayer )]"
  tribal_liege_inefficiency:0 "[liege|E] là [tribal|E]"
  has_detailed_ledgers_perk:0 "[liege|E] có [GetPerk( 'detailed_ledgers_perk' ).GetName( GetPlayer )]"
  tribal_vassal: "Bộ Lạc"
  tribal_vassal_desc: "$game_concept_tribal_desc$"
 
  theocracy_government:0 "Thần Quyền"
  theocracy_government_with_icon: "@government_type_theocracy! $theocracy_government$"
  theocracy_government_adjective:0 "Thần Quyền"
  theocracy_government_realm:0 "Thần Quyền"
  theocracy_government_desc:1 "\n$game_concept_theocracy_desc$\n\n#F Trong chính thể thần quyền, toàn bộ quyền lực thuộc về một thiết chế tôn giáo. Nhà nước được cai trị bởi một giáo sĩ — người thi hành ý chí của thần linh trên trần thế.#!"
  theocracy_government_vassals_label:1 "Nghĩa Vụ Thần Quyền dựa trên [piety_level|E] của [liege|E]"
  theocracy_government_obligations:1 "Nghĩa Vụ Thần Quyền"
  theocracy_government_vassal_contribution_wrong_faith:0 "@warning_icon! #X [liege|E] theo [faith|E] sai lệch#!"
  theocracy_government_vassal_contribution_piety_level:0 "[liege|E] là [GetPietyLevelName(liege.GetPietyLevel)|L]"
  theocracy_vassal: "Thần Quyền"
  theocracy_vassal_desc: "$game_concept_theocracy_desc$"

  holy_order_government:0 "Dòng Hiệp Sĩ Thánh"
  holy_order_government_with_icon: "@government_type_holy_order! $holy_order_government$"
  holy_order_government_desc:0 "\nNhững chiến binh thánh chiến của các dòng tu đã hiến dâng cuộc đời để chiến đấu chống dị giáo và phụng sự đức tin. Họ có thể sở hữu các lâu đài được ban bởi những lãnh chúa mộ đạo. Thủ lĩnh của dòng được chọn từ nội bộ hàng ngũ."
  holy_order_government_adjective:0 "Dòng Thánh"
  holy_order_government_realm:0 "Dòng Hiệp Sĩ Thánh"

  mercenary_government:0 "Đoàn Lính Đánh Thuê"
