  admin_theme_imperial_text_icon: "@imperial_administration!"
  admin_theme_imperial_benefits: "#emphasis #bold Lợi Ích [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ Tăng [governor_efficiency|E] dựa trên [prestige_level|E]#indent_newline:4 \n#weak Cộng thêm [EmptyScope.ScriptValue('efficiency_currency_level_increase_value')|+0%/] cho mỗi cấp#!#!\n$EFFECT_LIST_BULLET$ Tăng Chỉ Số [powerful_family|E]\nKhông thể bị bãi nhiệm nếu không có [revoke_title_reason|E]"
  admin_theme_imperial_desc: "#flavor Hành chính đế chế mang lại mức độ tự trị đáng kể và sự tự do khỏi nhiều trách nhiệm thông thường. Đây là loại hình hành chính danh giá nhất.#!"
  admin_theme_naval: "@naval_administration! Hành Chính Hải Quân"
  admin_theme_naval_short: "@naval_administration! Hải Quân"
  admin_theme_naval_text_icon: "@naval_administration!"
  admin_theme_naval_benefits: "#emphasis #bold Lợi Ích [liege|E]:#!#!\n$EFFECT_LIST_BULLET$ Mở khóa #high $frontier_influence_war_interaction$#! [interaction|E] cho phép lãnh chúa yêu cầu [vassal|E] tuyên chiến để giành một [title|E] cấp [duchy|E] từ [realm|E] ngoại bang\n\n#emphasis #bold Lợi Ích [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ Tăng [governor_efficiency|E] cho mỗi #high [GetBuilding('common_tradeport_01').GetTypeName]#!#indent_newline:4 \n#weak Cộng thêm [EmptyScope.ScriptValue('efficiency_building_increase_value')|+0%/] cho mỗi [GetBuilding('common_tradeport_01').GetTypeName]#!#!\n$EFFECT_LIST_BULLET$ Mở khóa #high $NAVAL_EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]"
  admin_theme_naval_desc: "#flavor Hải quân là trụ cột của mọi đế chế bành trướng. Với một nền hành chính hải quân chuyên biệt, an toàn và hiệu quả trên biển sẽ được gia tăng đáng kể.#!"
