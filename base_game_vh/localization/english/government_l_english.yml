  unity_improve_taxation_decision: "Cải thiện Thuế khóa"
  unity_improve_taxation_decision_desc: "Gia tộc ta có rất nhiều thành viên hiệu quả trong việc thu thuế và quản lý lãnh địa. Bằng cách chia sẻ ý tưởng và nhân sự có năng lực, tất cả chúng ta đều có thể hưởng lợi từ nguồn thu gia tăng."
  unity_improve_taxation_decision_tooltip: "Phối hợp cùng các thành viên gia tộc để cải thiện thuế khóa và thu nhập của lãnh địa"
