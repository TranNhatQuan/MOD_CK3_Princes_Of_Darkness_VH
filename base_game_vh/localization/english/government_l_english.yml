  unity_reinforce_army_decision: "Tăng cường Quân đội bằng Sĩ quan Trung thành"
  unity_reinforce_army_decision_desc: "Một đội quân chỉ mạnh khi có những sĩ quan chỉ huy nó. Bằng cách yêu cầu những binh sĩ có kỹ năng từ các thành viên trong gia tộc, ta có được những người lính dày dạn kinh nghiệm. Những người lính này có thể được thăng chức vào vị trí chỉ huy trong quân đội để nâng cao hiệu quả tác chiến. Mọi thành viên đều đóng góp cho gia tộc vì lợi ích chung, và tất cả đều được hưởng lợi!"
