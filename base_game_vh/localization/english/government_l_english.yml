  administrative_government_desc: "\n$game_concept_administrative_desc$\n\n#F Hành Chính là một chính thể tập trung cao độ, nơi quyền lực chủ yếu nằm tại kinh đô. Huyết thống tuy vẫn quan trọng nhưng không nổi bật như trong một lãnh địa phong kiến. Với đủ kỹ năng và tham vọng, bất kỳ ai, kể cả xuất thân thấp kém nhất, đều có thể vươn lên trở thành một tổng đốc đầy ảnh hưởng hoặc tranh đoạt ngai vàng để trở thành hoàng đế.#!"
  administrative_government_vassals_label: "[administrative|E] [obligations|E] được xác định dựa trên [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
  administrative_obligations: "Nghĩa Vụ Hành Chính"
  administrative_themes: "Các Loại Hình Hành Chính Khả Dụng"
  admin_theme_balanced: "@balanced_administration! Hành Chính Cân Bằng"
  admin_theme_balanced_short: "@balanced_administration! Cân Bằng"
  admin_theme_balanced_text_icon: "@balanced_administration!"
  admin_theme_balanced_desc: "#flavor Một nền hành chính cân bằng tìm kiếm sự điều độ để đảm bảo mọi lĩnh vực cai trị đều được quan tâm ngang nhau.#!"
  admin_theme_military: "@military_administration! Hành Chính Quân Sự"
  admin_theme_military_short: "@military_administration! Quân Sự"
  admin_theme_military_text_icon: "@military_administration!"
  admin_theme_military_benefits: "#emphasis #bold Lợi Ích [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ Tăng [governor_efficiency|E] dựa trên [martial|E]#indent_newline:4 \n#weak Cộng thêm [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] cho mỗi điểm [skill|E]#!#!"
  admin_theme_military_desc: "#flavor Hành chính quân sự dồn toàn bộ nguồn lực vào việc tuyển mộ và huấn luyện binh sĩ hùng mạnh cho quân đội đế quốc.#!"
  admin_theme_civilian: "@civilian_administration! Hành Chính Dân Sự"
  admin_theme_civilian_short: "@civilian_administration! Dân Sự"
  admin_theme_civilian_text_icon: "@civilian_administration!"
  admin_theme_civilian_benefits: "#emphasis #bold Lợi Ích [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ Tăng [governor_efficiency|E] dựa trên [stewardship|E]#indent_newline:4 \n#weak Cộng thêm [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] cho mỗi điểm [skill|E]#!#!\n[influence|E] nhận được từ việc xây dựng [buildings|E] tại các [counties|E] đang nắm giữ được tăng lên"
  admin_theme_civilian_desc: "#flavor Được miễn nghĩa vụ quân sự, hành chính dân sự tập trung vào việc cải thiện kinh tế và phúc lợi của người dân.#!"
  admin_theme_frontier: "@frontier_administration! Hành Chính Biên Cương"
  admin_theme_frontier_short: "@frontier_administration! Biên Cương"
  admin_theme_frontier_text_icon: "@frontier_administration!"
  admin_theme_frontier_benefits: "#emphasis #bold Lợi Ích [liege|E]:#!#!\n$EFFECT_LIST_BULLET$ Mở khóa #high $frontier_influence_war_interaction$#! [interaction|E] cho phép lãnh chúa yêu cầu [vassal|E] tuyên chiến để giành một [title|E] cấp [duchy|E] từ [realm|E] ngoại bang\n\n#emphasis #bold Lợi Ích [vassal|E]:#!#!\n$EFFECT_LIST_BULLET$ Tăng [governor_efficiency|E] dựa trên [prowess|E]#indent_newline:4 \n#weak Cộng thêm [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] cho mỗi điểm [skill|E]#!#!\n$EFFECT_LIST_BULLET$ Mở khóa #high $EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]\n$EFFECT_LIST_BULLET$ Cho phép [raiding|E]"
  admin_theme_frontier_desc: "#flavor Không thể để biên giới bị bỏ ngỏ. Hành chính biên cương sẽ đảm bảo phòng thủ lãnh thổ và luôn sẵn sàng đẩy lùi mọi kẻ xâm lược tiềm tàng.#!"
