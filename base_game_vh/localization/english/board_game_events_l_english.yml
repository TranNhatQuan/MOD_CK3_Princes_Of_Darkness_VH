 # Counter Content
  board_games.0001.desc.i_have_countered:0 "Dĩ nhiên là những kỹ thuật của Ta đã khéo léo #color_blue_gray hóa giải#! mọi nước đi của đối thủ.#!\n\n"
  board_games.0001.desc.i_am_countered:0 "Khốn thật, #EMP bằng cách nào đó#! gã [bg_opponent.GetWomanMan] này dường như #color_blue_gray bắt bài#! mọi mưu lược Ta sử dụng.\n\n"
  board_games.0001.desc.no_counters:0 "\n\n"

