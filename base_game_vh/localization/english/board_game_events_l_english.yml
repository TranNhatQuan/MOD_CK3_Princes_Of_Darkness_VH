 # Ending Events
  board_games.0031.t:0 "$board_games.0000.t$"


  board_games.0031.desc.intro.01:0 "Gầm lên trong chiến thắng, ta bật đứng dậy, hất tung [SCOPE.Custom('BG_GamePiecePlural')] văng khắp nơi."
  board_games.0031.desc.intro.02:0 "Với nụ cười tự mãn, ta đặt quân [SCOPE.Custom('BG_GamePiece')] cuối cùng lên bàn cờ."
  board_games.0031.desc.intro.03:0 "Cả hai chúng ta nhìn chằm chằm vào quân [SCOPE.Custom('BG_GamePiece')] cuối cùng. Ta đã làm được. Ta đã chiến thắng."

  board_games.0031.desc.middle.01:0 "Ván [SCOPE.Custom('BG_GameType')] này thuộc về ta — thêm một chiến thắng huy hoàng nữa trên con đường không thể ngăn cản dẫn ta tới danh xưng Vua của Trò Chơi."
  board_games.0031.desc.middle.02:0 "Một lần nữa, trí tuệ vượt trội của ta đã chiến thắng tất cả."
  board_games.0031.desc.middle.03:0 "[ROOT.Char.GetFaith.HighGodName] đã chứng giám chiến thắng của ta hôm nay. Ngay từ đầu, ta đã hoàn toàn tin tưởng rằng [ROOT.Char.GetFaith.HighGodName] sẽ ban cho ta phần thắng — không thể có kết cục nào khác."

  board_games.0031.desc.end.01:0 "\n\nMột [bg_loser.GetFirstName] tuyệt vọng vẫn ngồi đó, tay đặt trên [bg_loser.GetHerHis], cố gắng hiểu xem [bg_loser.GetSheHe] đã sai ở đâu."
  board_games.0031.desc.end.02:0 "\n\nChẳng còn gì ngoài cái vỏ trống rỗng của một [bg_loser.GetWomanMan] nơi [bg_loser.GetFirstName]. [bg_loser.GetSheHe|U] không thể tin rằng ta đã chiến thắng."
  board_games.0031.desc.end.03:0 "\n\n[bg_loser.GetFirstName] gần như không thể kiềm chế cơn giận của [bg_loser.GetHerHis]. Ta đã đánh bại và làm nhục [bg_loser.GetHerHim]."


  board_games.0031.a:0 "Ván đấu hay!"
  board_games.0031.a.a:0 "Một trận đấu thật xuất sắc!"
  board_games.0031.b:0 "Cảm giác thua cuộc thế nào, hỡi [bg_loser.GetWomanMan] bé nhỏ?"
  board_games.0031.b.a:1 "Quỳ gối trước ta đi, đồ [bg_loser.Custom2('InsultNoun', ROOT.Char)]!"
  board_games.0031.b.b:0 "Đừng cảm thấy #EMP quá#! tệ — đâu phải ai cũng có thể thông minh như ta."
  board_games.0031.b.progress_towards_rival:0 "[bg_loser.GetTitledFirstName] coi đó là một sự xúc phạm cá nhân"
  board_games.0031.c:0 "Ta rất muốn chơi lại vào một dịp khác..."
  board_games.0031.a.tt.success:0 "Đối thủ đồng ý rằng đó là một ván đấu hay"
  board_games.0031.a.tt.failure:0 "Đối thủ làm một cử chỉ thô tục rồi bỏ đi"
  board_games.0031.desc.result.skill:0 "#BOL Kết quả:#! Ta giành chiến thắng trong [board_game_match|E] trước [bg_loser.GetFirstNameNoTooltip] nhờ điểm [board_game_winning|E] của mình"
  board_games.0031.desc.result.sudden_death:0 "#BOL Kết quả:#! Ta giành chiến thắng trong [board_game_match|E] trước [bg_loser.GetFirstNameNoTooltip] nhờ [board_game_winning_sudden_death|E]"

   board_games.0041.t:0 "$board_games.0000.t$"


  board_games.0041.desc.intro.01:0 "Gào thét trong chiến thắng như thú dữ, [bg_victor.GetFirstName] bật dậy đứng lên.\n\nTa... ta đã thua. Hai tay ta trượt xuống đầu gối, tìm kiếm điểm tựa."
  board_games.0041.desc.intro.02:0 "Một nụ cười đắc thắng kéo dài từ tai này sang tai kia trên gương mặt [bg_victor.GetFirstName]. [bg_victor.GetSheHe] đã thắng, còn ta thì thua.\n\n"
  board_games.0041.desc.intro.03:0 "Không có nỗi thất vọng nào lớn hơn cảm giác của ta khi nhìn chằm chằm vào những [SCOPE.Custom('BG_GamePiecePlural')] trên bàn cờ này — cách chúng được sắp xếp đã quá rõ ràng rằng ta đã bị đánh bại."

  board_games.0041.desc.middle.01:0 "Với [ROOT.Char.GetFaith.HighGodName] làm chứng, ta đã làm hết sức mình..."
  board_games.0041.desc.middle.02:0 "Thật không thể tin nổi một kẻ ngốc như [bg_victor.GetFirstName] lại có thể qua mặt được ta."
  board_games.0041.desc.middle.03:0 "\n\n[SCOPE.Custom('BG_GameType')|U] suy cho cùng cũng chỉ là một bản sao rẻ tiền của #EMP chiến tranh thực sự#! mà thôi — thứ mà ta chắc chắn vượt trội hơn hẳn so với đối thủ thấp kém này. Trong khi [bg_loser.GetSheHe] nghiên cứu [SCOPE.Custom('BG_GameType')], thì #EMP ta nghiên cứu lưỡi kiếm.#! Dẫu vậy..."

  board_games.0041.desc.end.01:0 "\n\nChẳng lẽ ta #EMP kém#! trong [SCOPE.Custom('BG_GameType')] sao?"
  board_games.0041.desc.end.02:0 "\n\nLòng bàn tay ta đổ mồ hôi, đầu gối run rẩy khi ta nhận ra rằng khả năng tốt nhất của mình vẫn không đủ để đánh bại [bg_victor.GetFirstName]."
  board_games.0041.desc.end.03:0 "\n\nTên [recipient.Custom2('InsultNoun', ROOT.Char)] đó! Tên [recipient.Custom2('InsultNoun', ROOT.Char)] đó! Không đời nào là hắn không gian lận — làm sao #EMP ta#! lại có thể thua được chứ?!"

  board_games.0041.a:0 "Rồi sẽ xem ai thắng vào lần sau..."
  board_games.0041.b:0 "Hôm nay ngươi đã tạo ra một kẻ thù."
  board_games.0041.b.b:0 "Cứ ăn mừng tiếp đi, và nhân danh [ROOT.Char.GetFaith.HighGodName], ngươi sẽ nếm mùi cú đá của ta!"
  board_games.0041.c:0 "Thôi thì người [bg_victor.GetWomanMan] giỏi hơn đã thắng!"
  board_games.0041.desc.result.skill:0 "#BOL Kết quả:#! Ta thua [board_game_match|E] trước [bg_victor.GetFirstNameNoTooltip] do điểm [board_game_winning|E] của [bg_victor.GetHerHis]"
  board_games.0041.desc.result.sudden_death:0 "#BOL Kết quả:#! Ta thua [board_game_match|E] trước [bg_victor.GetFirstNameNoTooltip] do [board_game_winning_sudden_death|E]"

 ##################################################
 # Gaining a Trinket
  board_games.0051.t:0 "Một Vận May Bất Ngờ"
  board_games.0051.desc:0 "Cho đến tận bây giờ, đôi khi ta vẫn hoài niệm đầy thích thú về chiến thắng áp đảo trước [bg_loser.GetFirstName] trong ván [SCOPE.Custom('BG_GameType')] cách đây vài tháng. Biểu cảm trên [bg_loser.GetHerHis] [bg_loser.Custom('MaskFace')] khi ấy thật sự là #EMP vô giá#!.\n\nTa nghĩ rằng có lẽ mình vẫn còn giữ bàn cờ đã dùng trong ván đấu đó ở đâu đó chăng? Một bàn cờ chắc chắn, một bàn cờ may mắn, với những [SCOPE.Custom('BG_GamePiecePlural')] đã chứng kiến một trong những ván cờ xuất sắc nhất từng được chơi.\n\nKhông nghi ngờ gì nữa, [bg_victor.GetFaith.KnowledgeGodName] hẳn đã mỉm cười phù hộ cho nó từ lâu; ta sẽ thật ngu ngốc nếu để nó thất lạc."
  board_games.0051.a:0 "À ha, chắc chắn sẽ mang lại may mắn mãi về sau!"
  board_games.0051.b:0 "Chỉ cần thêm vài quân nữa thôi là ta có thể có một bộ cờ #EMP thực sự#! hiếm có..."
  board_games.0051.c:0 "Ta không cần những món đồ chơi đặc biệt."

 ##################################################
 # Debug Events
  board_games.0102.t:0 "Trò Chơi Của Mọi Trò Chơi"
  board_games.0102.desc:0 "BGE là sự kết hợp của tất cả những trò chơi bàn cờ yêu thích của Ngài: cờ vua, pachisi, hnefaffetteffleelfae, tabula.\n\nNgài còn thích những trò nào nữa?\n\nNó cũng có thể bao gồm mấy trò đó luôn, mà còn hay hơn nữa!\n\n#EMP Và hợp pháp từ trước hàng thế kỷ.#!\n\nMấy trò bàn cờ thường thì nên gọi là gì nhỉ. Ta chán rồi. Chơi đi."
  board_games.0102.a:0 "Cho ta một ván bình thường."
  board_games.0102.b:0 "Đối thủ chỉ dùng các ô thắng thôi."
  board_games.0102.c:0 "Đối thủ chỉ dùng các ô thua thôi."
