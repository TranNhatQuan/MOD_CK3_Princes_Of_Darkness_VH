 # Closeness to Victory
  board_games.0001.desc.relative_victory.winning_heavily:0 "Ta đang áp đảo hoàn toàn [bg_opponent.GetHerHim],"
  board_games.0001.desc.relative_victory.winning_somewhat:0 "Hiện tại Ta đang dẫn trước,"
  board_games.0001.desc.relative_victory.drawing:0 "Chúng Ta đang giằng co sát nút,"
  board_games.0001.desc.relative_victory.losing_somewhat:0 "[bg_opponent.GetSheHe|U] bắt đầu vượt lên,"
  board_games.0001.desc.relative_victory.losing_heavily:0 "Đối thủ của Ta đang bỏ xa Ta,"
  board_games.0001.desc.actual_victory.both_close:0 "và bất cứ ai trong hai chúng Ta cũng có thể giành chiến thắng bất cứ lúc nào.\n\n"
  board_games.0001.desc.actual_victory.i_am_close:0 "và chiến thắng đã gần đến mức Ta gần như có thể nếm được.\n\n"
  board_games.0001.desc.actual_victory.they_are_close:0 "và đối thủ của Ta có thể giành phần thắng bất kỳ giây nào.\n\n"
  board_games.0001.desc.actual_victory.sudden_death:0 "và ván đấu này đang nhanh chóng đi đến hồi quyết định.\n\n"
  board_games.0001.desc.actual_victory.neither_close:0 "dù cả hai chúng Ta đều chưa hề tiến gần đến chiến thắng.\n\n"

