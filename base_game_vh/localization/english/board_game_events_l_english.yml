l_english:

 ##################################################
 # Misc
 board_games.0000.t:0 "The Greatest Game: [SCOPE.Custom('BG_GameType')|U]"
 board_games.0001.t:0 "$board_games.0000.t$"

 ##################################################
 # Opponent Winning
  board_games.0001.desc.opponent_winning.diplomacy.low:0 ""Cậu biết đấy," đối thủ của ta trầm ngâm, "ta không giỏi ăn nói lắm, nhưng lại giỏi đến đáng sợ ở trò [SCOPE.Custom('BG_GameType')].""
  board_games.0001.desc.opponent_winning.diplomacy.medium:0 ""Ahhhh, giá mà diễn thuyết trước đám đông cũng dễ như việc đánh bại cậu trong [SCOPE.Custom('BG_GameType')]," đối thủ của ta nhận xét."
  board_games.0001.desc.opponent_winning.diplomacy.high:0 ""Thật lòng mà nói ta không biết cái nào dễ hơn," đối thủ than thở, "đánh bại cậu trong [SCOPE.Custom('BG_GameType')] hay kể lại câu chuyện thất bại bẽ bàng của cậu.""
  board_games.0001.desc.opponent_winning.martial.low:0 ""Nếu chiến tranh mà dễ như [SCOPE.Custom('BG_GameType')] thì giờ này ta đã thống trị cả thế giới rồi," đối thủ cười lớn. "Nhưng thôi, đó chỉ là ta thôi.""
  board_games.0001.desc.opponent_winning.martial.medium:0 ""Mmmm, xem ra cậu chẳng phải là một nhà chiến lược cho lắm nhỉ?" đối thủ cười khẩy."
  board_games.0001.desc.opponent_winning.martial.high:0 ""Chiến trường, bàn cờ, tất cả đều chỉ là vấn đề của thứ quan trọng nhất," đối thủ của ta ngân nga. [bg_opponent.GetSheHe|U] dùng khớp ngón tay gõ lên trán [bg_opponent.GetHerHis] để nhấn mạnh."
  board_games.0001.desc.opponent_winning.stewardship.low:0 ""Ước gì chuyện tiền bạc cũng dễ như chơi [SCOPE.Custom('BG_GameType')]," đối thủ nhận xét. "Khi đó ta đã ngập trong bạc rồi.""
  board_games.0001.desc.opponent_winning.stewardship.medium:0 ""Cậu có nghĩ [SCOPE.Custom('BG_GameType')] là cách luyện tập tốt cho việc quản trị thực sự không?" đối thủ thờ ơ hỏi. "Ta thì vẫn luôn nghĩ vậy. Không phải là ta... ám chỉ gì đâu.""
  board_games.0001.desc.opponent_winning.stewardship.high:0 ""Ta vẫn luôn nói rằng [SCOPE.Custom('BG_GameType')] dạy cho một [bg_opponent.GetWomanMan] rất nhiều điều về cách điều hành một lãnh thổ," đối thủ lên giọng dạy đời. "Và dĩ nhiên là ngược lại.""
  board_games.0001.desc.opponent_winning.intrigue.low:0 ""Thấy chưa, đó là lý do ta thích [SCOPE.Custom('BG_GameType')]," đối thủ bình luận. "Không lén lút, không nói dối, chỉ là một cuộc đấu trí công bằng. Một cuộc mà, ờ thì...""
  board_games.0001.desc.opponent_winning.intrigue.medium:0 ""Cậu có biết rằng người ta có thể học được #EMP chính xác#! cách ai đó nói dối bằng cách quan sát [bg_myself.Custom('MaskFace')] của họ khi chơi [SCOPE.Custom('BG_GameType')] không?" đối thủ hỏi. "Ồ, ta không có ý... chỉ là nhận xét thôi...""
  board_games.0001.desc.opponent_winning.intrigue.high:0 ""Cẩn thận đấy," đối thủ cười nhếch mép, "thêm một nước như thế nữa là cậu sẽ kích hoạt bẫy [SCOPE.Custom('BG_GamePiece')] của ta đấy.""
  board_games.0001.desc.opponent_winning.learning.low:0 ""Cậu biết không, người ta bảo ta cần #EMP sách vở#! để chứng minh mình thông minh," đối thủ giảng giải, "nhưng hiện giờ thì rõ ràng là ta đâu có ngu ngốc đến vậy.""
  board_games.0001.desc.opponent_winning.learning.medium:0 ""Thành thật mà nói," đối thủ thao thao, "ta khá ấn tượng vì cậu chơi tốt đến thế, xét đến việc cậu đang đối đầu với ai.""
  board_games.0001.desc.opponent_winning.learning.high:0 ""Ta đã nghiên cứu [SCOPE.Custom('BG_GameType')] rất kỹ," đối thủ giải thích, "và tiếc là đến lúc này ta không thấy còn cách nào để cậu thắng được nữa.""
  board_games.0001.desc.opponent_winning.trait.lustful:0 ""Với tư cách là người tình vĩ đại nhất thế giới #EMP và#! cũng là cao thủ [SCOPE.Custom('BG_GameType')], ta không trách cậu vì đã thua ta," đối thủ cười khoái chí."
  board_games.0001.desc.opponent_winning.trait.chaste:0 ""Kỷ luật trong gia đình sẽ sinh ra kỷ luật trên bàn cờ, cậu biết mà," đối thủ lên giọng giáo huấn. "Chỉ cần tiết chế một chút là đủ đi rất xa rồi.""
  board_games.0001.desc.opponent_winning.trait.gluttonous:0 ""Ta nghĩ mình nên ăn mừng chiến thắng này bằng một bữa tiệc," đối thủ trầm ngâm. "Một chút ngọt ngào cho xứng với chiến thắng.""
  board_games.0001.desc.opponent_winning.trait.temperate:0 ""Có lẽ sau ván này ta sẽ tự thưởng cho mình một chén nước hoa hồng," đối thủ trầm ngâm. "Ta hiếm khi chiều bản thân, nhưng lần này thì xứng đáng.""
  board_games.0001.desc.opponent_winning.trait.greedy:0 ""Thứ duy nhất ngọt ngào hơn tiếng leng keng của vàng bạc là tiếng nức nở khe khẽ của một [bg_myself.GetWomanMan] rơi trên bàn [SCOPE.Custom('BG_GameType')]," đối thủ mỉm cười. "Cậu không thấy vậy sao?""
  board_games.0001.desc.opponent_winning.trait.generous:0 ""Này, dù ta đang thắng, nhưng nếu cậu năn nỉ cho tử tế thì ta sẵn sàng... nhường cậu ván này," đối thủ giải thích, giọng đầy lòng tốt và thương hại. "Cuộc đời còn nhiều thứ hơn là thắng thua trong [SCOPE.Custom('BG_GameType')].""
  board_games.0001.desc.opponent_winning.trait.lazy:0 "Đối thủ của ta ngáp dài đầy ồn ào. \"Thật lòng mà nói, ta mong đợi một thử thách lớn hơn chút, [bg_myself.GetFirstNameNoTooltip]. Ta còn chưa tỉnh hẳn nữa kìa.\""
  board_games.0001.desc.opponent_winning.trait.diligent:0 "\"Đó là lý do vì sao cậu cần phải bỏ công sức vào,\" đối thủ an ủi, giọng điệu #EMP cực kỳ#! khó chịu. \"Không có gì thay thế được sự chăm chỉ, dù là trong đời sống hay trong [SCOPE.Custom('BG_GameType')].\""
  board_games.0001.desc.opponent_winning.trait.wrathful:0 "Đối thủ của ta lạ thay lại bình tĩnh một cách bất thường. \"Ồ, chẳng có gì để tức giận cả,\" [bg_opponent.GetSheHe] nói khi bắt gặp ánh mắt ta, \"khi mọi thứ đang diễn ra #EMP tốt đẹp#! như thế này.\""
  board_games.0001.desc.opponent_winning.trait.calm:0 "\"Ta luôn nhận thấy rằng chìa khóa của [SCOPE.Custom('BG_GameType')] nằm ở một cái đầu tỉnh táo và tâm trí điềm tĩnh,\" đối thủ trầm ngâm. \"Rồi cậu sẽ hiểu thôi.\""
  board_games.0001.desc.opponent_winning.trait.patient:0 "\"Phần lớn mọi người,\" đối thủ lên lớp, \"không thật sự hiểu việc thực hiện [bg_opponent.Custom('BG_RandomArticleDirection')] [bg_opponent.Custom('BG_RandomRankPossessive')] [bg_opponent.Custom('BG_RandomMoveType')] khó đến mức nào, chứ chưa nói đến việc phòng thủ trước nó.\""
  board_games.0001.desc.opponent_winning.trait.impatient:0 "\"Cậu chơi [SCOPE.Custom('BG_GameType')] chậm thật đấy, [bg_myself.Custom2('GetYoungMiddleAgedOld',bg_opponent)] [bg_myself.GetWomanMan],\" đối thủ lẩm bẩm, vừa gõ những ngón tay [bg_opponent.GetHerHis] lên bàn cờ."
  board_games.0001.desc.opponent_winning.trait.arrogant:0 ""Đừng cảm thấy tệ [bg_myself.GetFirstNameNoTooltip]," đối thủ của ta nói với vẻ tự mãn, ngả người thư giãn tại nơi [bg_opponent.GetSheHe] đang ngồi. "Không phải ai cũng có tài năng #EMP thiên bẩm#! như thế này!""
  board_games.0001.desc.opponent_winning.trait.humble:0 "\"Thật ra thì cậu chơi rất tốt rồi,\" đối thủ vui vẻ nói. \"Ta thường không chơi hay đến thế đâu, nên chắc chỉ là cậu gặp vận rủi thôi.\""
  board_games.0001.desc.opponent_winning.trait.deceitful:1 "\"Đừng quá buồn,\" đối thủ xoa dịu, giọng ngọt như mật. \"Ngay cả [bg_opponent.GetFaith.TricksterGodName] cũng không thể theo kịp các nước đi của ta.\""
  board_games.0001.desc.opponent_winning.trait.honest:0 "\"Ôi trời, mọi chuyện đang diễn ra #EMP tốt hơn rất nhiều#! so với ta mong đợi!\" đối thủ thốt lên. \"Cậu chẳng phải là đối thủ khó nhằn chút nào cả... à xin lỗi, ta không có ý thô lỗ đâu. Chỉ là ta thành thật thôi.\""
  board_games.0001.desc.opponent_winning.trait.craven:0 ""Ta... ta đang thắng sao? Ta đang thắng!" đối thủ của ta hét lên. [bg_opponent.GetSheHe|U] có vẻ thực sự kinh ngạc, nhưng rồi, [bg_opponent.GetSheHe] #EMP đã#! dành nửa trận đấu nhìn qua kẽ ngón tay [bg_opponent.GetHerHis]."
  board_games.0001.desc.opponent_winning.trait.brave:0 "\"Cho phép ta cười nhẹ một chút,\" đối thủ nhận xét. \"Nhưng cậu sẽ phải chơi táo bạo hơn #EMP thế kia#! nhiều nếu muốn đánh bại #EMP ta#!.\""
  board_games.0001.desc.opponent_winning.trait.shy:0 "\"Bao công luyện tập cuối cùng cũng được đền đáp!\" đối thủ lí nhí nói, ánh lên niềm tự hào rụt rè khi nhìn bàn cờ."
  board_games.0001.desc.opponent_winning.trait.gregarious:0 "\"Đừng buồn quá,\" đối thủ kéo dài giọng, bẻ khớp các ngón tay [bg_opponent.GetHerHis]. \"Ta thắng [SCOPE.Custom('BG_GameType')] cũng dễ như kết bạn vậy. Đáng báo động là dễ.\""
  board_games.0001.desc.opponent_winning.trait.ambitious:0 "\"Cậu có nghĩ người ta sẽ phong một kiểu... #EMP Vua#! Trò Chơi nào đó không?\" đối thủ hỏi, gãi cằm [bg_opponent.GetHerHis]. \"Ta có cảm giác như mình đang tiến dần tới danh hiệu đó rồi.\""
  board_games.0001.desc.opponent_winning.trait.content:0 "\"Thật là một ván đấu tuyệt vời,\" đối thủ cười khúc khích. \"Chúng ta còn có thể đòi hỏi gì hơn nữa chứ? À, ngoài vận may của cậu ra thì không.\""
  board_games.0001.desc.opponent_winning.trait.arbitrary:0 "\"Ta thường không mấy coi trọng luật lệ,\" đối thủ bình luận, \"nhưng [SCOPE.Custom('BG_GameType')] khiến ta thấy được chút hấp dẫn của chúng. Đôi khi chúng cho phép cậu #EMP ép#! người khác phải thừa nhận rằng cậu giỏi hơn họ.\""
  board_games.0001.desc.opponent_winning.trait.just:0 "\"Này,\" đối thủ giải thích, vừa vẫy xấp giấy trước mặt ta. \"Ta xin lỗi vì cậu cứ cố thực hiện các nước đi phạm luật, nhưng nếu cậu #EMP đọc luật#! thì mọi chuyện đã khá hơn rồi.\""
  board_games.0001.desc.opponent_winning.trait.cynical:0 "\"Tất nhiên là ta sẽ không nương tay với cậu,\" đối thủ cười nham hiểm. \"Cậu #EMP chắc chắn#! cũng chẳng làm vậy với ta, thế thì hà cớ gì phải nương?\""
  board_games.0001.desc.opponent_winning.trait.zealous:0 "\"Ta ước mình có thể nhận công cho chiến thắng chắc chắn này,\" đối thủ uể oải nói, \"nhưng tất cả đều là công lao của [bg_opponent.GetFaith.KnowledgeGodName] #EMP thông qua#! ta mà thôi.\""
  board_games.0001.desc.opponent_winning.trait.paranoid:0 "\"Ta biết cậu vẫn còn mánh khóe gì đó giấu trong tay áo,\" đối thủ cau có. \"Không ai có thể #EMP dễ#! bị đánh bại đến mức này.\""
  board_games.0001.desc.opponent_winning.trait.trusting:0 "\"Có lẽ ta sẽ tranh thủ đi nhà xí trong lúc đến lượt cậu,\" đối thủ mỉm cười. \"Đừng có động vào mấy [SCOPE.Custom('BG_GamePiecePlural')] của ta đấy!\""
  board_games.0001.desc.opponent_winning.trait.compassionate:0 "\"Ta xin lỗi nếu đã đẩy cậu vào một nước đi tệ, [bg_myself.GetFirstNameNoTooltip],\" đối thủ nói, giọng [bg_opponent.GetHerHis] đầy hối lỗi chân thành. \"Ta chơi [SCOPE.Custom('BG_GameType')] cho vui, và ta nghĩ vui nhất là khi #EMP cả hai#! chúng ta đều đang tận hưởng nó.\""
  board_games.0001.desc.opponent_winning.trait.callous:0 "\"Nhân danh [bg_opponent.GetFaith.HouseholdGodName], cậu chống trả yếu ớt thật đấy, phải không?\" đối thủ thẳng thừng thốt lên."
  board_games.0001.desc.opponent_winning.trait.sadistic:0 "\"Thật là #EMP quá#! thú vị khi được đùa giỡn với một đối thủ bị thương,\" đối thủ kéo dài giọng với vẻ khoái trá độc địa, \"cậu cũng thấy vậy mà, [bg_myself.GetFirstNameNoTooltip]?\""
  board_games.0001.desc.opponent_winning.trait.stubborn:0 "\"Thật dễ chịu khi có một chiến thắng nhẹ nhàng như thế này cho đổi gió,\" đối thủ cười khẩy. \"Thường thì ta phải tranh cãi hàng giờ trước khi đối phương chịu thừa nhận là ta thắng.\""
  board_games.0001.desc.opponent_winning.trait.fickle:0 "\"Ta thực sự rất thích việc dù ta chọn chiến thuật nào thì cậu cũng thua thảm y như nhau,\" đối thủ buông lời châm chọc."
  board_games.0001.desc.opponent_winning.trait.vengeful:0 "\"Dĩ nhiên, tất cả chuyện này chỉ là để trả đũa thôi,\" đối thủ rít lên. \"Và cậu #EMP thừa#! biết là vì chuyện gì rồi.\""
  board_games.0001.desc.opponent_winning.trait.forgiving:0 "\"Thú thật thì ta mong đợi một thử thách lớn hơn chút,\" đối thủ than vãn. \"Nhưng cũng không sao. Ít nhất thì cậu cũng là một bài tập tốt.\""
  board_games.0001.desc.opponent_winning.trait.rowdy:0 "Đối thủ nhí của ta hò hét, hay đúng hơn là lảm nhảm, hàng loạt lời đe dọa thiếu suy nghĩ, suýt nữa thì hất văng cả bàn cờ trong cơn phấn khích của [bg_opponent.GetHerHis]."
  board_games.0001.desc.opponent_winning.trait.charming:0 "\"Chúng ta nên chơi [SCOPE.Custom('BG_GameType')] mỗi ngày đi, [bg_myself.GetFirstNameNoTooltip],\" đối thủ nhí lanh lảnh nói. \"Lúc nào cũng vui hết!\""
  board_games.0001.desc.opponent_winning.trait.curious:0 "\"Cậu biết không,\" đối thủ nhí trầm ngâm, \"ta đang học được rất nhiều điều từ việc đánh bại cậu đấy.\""
  board_games.0001.desc.opponent_winning.trait.pensive:0 "\"Ta đã đọc rất nhiều về cách chơi [SCOPE.Custom('BG_GameType')],\" đối thủ nhí rạng rỡ nói, \"nhưng ta không ngờ là việc #EMP áp dụng#! chúng lại dễ đến thế!\""
  board_games.0001.desc.opponent_winning.trait.bossy:0 "\"Sau khi ta đánh bại cậu,\" đối thủ nhí tuyên bố, \"ta muốn một cái bánh ngọt. Để làm cống phẩm.\""
  board_games.0001.desc.opponent_winning.relation.friend:0 "\"Vui lên đi, đồ mặt-[bg_myself.Custom('MaskFace')] chua chát,\" đối thủ cười. \"Chỉ là một trò chơi nho nhỏ giữa Bạn Bè thôi mà, đúng không?\""
  board_games.0001.desc.opponent_winning.relation.best_friend:0 "\"Dù thắng hay thua,\" người Bạn Thân nhất của ta nói, \"trên đời này không có ai mà ta muốn cùng chơi [SCOPE.Custom('BG_GameType')] hơn cậu cả.\""
  board_games.0001.desc.opponent_winning.relation.rival:0 "\"Nhân danh [bg_opponent.GetFaith.FateGodName], cậu chơi [SCOPE.Custom('BG_GameType')] tệ y như cách cậu cai trị vậy!\" kình địch của ta cười hô hố."
  board_games.0001.desc.opponent_winning.relation.nemesis:0 "Kẻ tử địch của ta không nói một lời. [bg_opponent.GetSheHe|U] chỉ trừng mắt nhìn ta, [bg_opponent.Custom('EyeEyes')] bốc cháy bằng nỗi #EMP thù hận#! thuần khiết, không che giấu."
  board_games.0001.desc.opponent_winning.relation.lover:0 "Không rời mắt khỏi ta, người tình của ta bắt đầu khẽ vuốt ve một trong những [SCOPE.Custom('BG_GamePiecePlural')] bằng đầu ngón tay [bg_opponent.GetHerHis] và... Ôi. #EMP Ôi trời ơi#!"
  board_games.0001.desc.opponent_winning.relation.soulmate:0 "Tri kỷ của ta chỉ chú ý một nửa vào ván [SCOPE.Custom('BG_GameType')] của chúng ta. Phần lớn thời gian, [bg_opponent.GetSheHe] dường như chỉ chăm chú nhìn sâu vào [bg_myself.Custom('EyeEyes')] của ta."
  board_games.0001.desc.opponent_winning.relation.bully:0 "\"Thấy chưa?\" đối thủ cười khúc khích, \"đó là lý do ta đánh cậu. Cậu đúng là #EMP quá#! kẻ thua cuộc.\""
  board_games.0001.desc.opponent_winning.relation.victim:0 "Đôi mắt của nạn nhân ta rực cháy cơn phẫn nộ chính đáng, vui mừng vì hiếm hoi lắm mới có thứ gì đó diễn ra #EMP theo ý [bg_opponent.GetHerHis]#!."
  board_games.0001.desc.opponent_winning.relation.crush:0 "Khoan đã, [bg_opponent.GetSheHe] vừa nói gì sao? Ta nghĩ là [bg_opponent.GetSheHe] có nói gì đó! Trời ơi, đôi khi ta chỉ mải ngắm nhìn [bg_opponent.GetHerHim] đến mức lạc cả hồn, và giờ thì ta đã làm hỏng mọi thứ rồi."
  board_games.0001.desc.opponent_winning.relation.guardian:0 "\"Hãy quan sát ta thật kỹ, [bg_myself.GetFirstName],\" người giám hộ của ta nói. \"Nghiên cứu cách ta chơi, và cậu có thể sẽ học được điều gì đó.\""
  board_games.0001.desc.opponent_winning.relation.ward:0 "Người được ta bảo hộ mỉm cười rạng rỡ với ta. \"Chúng ta có thể chơi [SCOPE.Custom('BG_GameType')] thường xuyên hơn không? #EMP Làm ơn#!!\""
  board_games.0001.desc.opponent_winning.hook_on.weak:0 "\"$board_games.0001.desc.opponent_winning.hook_on.strong$\""
  board_games.0001.desc.opponent_winning.hook_on.strong:0 "\"Cảm giác lật ngược thế cờ trước mặt cậu thật tuyệt, cậu biết không,\" đối thủ nói. \"Lúc nào cũng có cảm giác như cậu đang nắm ta trong lòng bàn tay. Trừ khi chúng ta chơi [SCOPE.Custom('BG_GameType')], dĩ nhiên.\""
  board_games.0001.desc.opponent_winning.hooked_by.weak:0 "\"$board_games.0001.desc.opponent_winning.hooked_by.strong$\""
  board_games.0001.desc.opponent_winning.hooked_by.strong:0 "\"Cậu không cố tình thua vì #EMP thỏa thuận#! của chúng ta đấy chứ?\" đối thủ hỏi, vừa trầm ngâm gãi cằm [bg_opponent.GetHerHis]. \"Vì cách cậu chơi trông như là đang cố thua vậy.\""
  board_games.0001.desc.opponent_winning.match_history.recently_won_against.default:0 "\"Ahhh, giờ thì ta đã đánh bại cậu bao nhiêu lần rồi nhỉ?\" đối thủ cười khẽ. \"Ta #EMP thật sự#! không đếm nổi nữa.\""
  board_games.0001.desc.opponent_winning.match_history.recently_won_against.county:0 "\"[bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] đang phát triển rất tốt đấy,\" đối thủ kéo dài giọng, \"#EMP tốt hơn nhiều#! kể từ khi ta tiếp quản nơi đó.\""
  board_games.0001.desc.opponent_winning.match_history.recently_won_against.gamble:0 "\"Lại thêm một ván nữa,\" đối thủ nhận xét, \"lại thêm một chiến thắng cho bảng thành tích của ta. Cậu sắp phá sản rồi đấy.\""
  board_games.0001.desc.opponent_winning.match_history.recently_lost_against.default:0 "\"Thế này,\" đối thủ cười khúc khích, \"#EMP tốt hơn nhiều#! so với ván #EMP kia#! mà chúng ta đã chơi.\""
  board_games.0001.desc.opponent_winning.match_history.recently_lost_against.county:0 "\"Sau chuyện [bg_opponent.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier], ta không thể thắng cậu đủ nhiều,\" đối thủ càu nhàu, vẫn còn cay cú vì vụ cá cược cũ."
  board_games.0001.desc.opponent_winning.match_history.recently_lost_against.gamble:0 "\"Có vẻ như lần này vận may đang đứng về phía ta, phải không?\" đối thủ cười hả hê."
  board_games.0001.desc.opponent_winning.other.pro_gamer:0 "\"Cậu nên chú ý thật kỹ các kỹ thuật của ta,\" đối thủ nói giọng khinh khỉnh. \"Ta sắp thực hiện cái gọi là một nước đi của cao thủ bàn cờ.\""
  board_games.0001.desc.opponent_winning.other.avlf:0 "\"#EMP Cậu#! là bậc thầy trò chơi ư? Đừng tự tâng bốc mình thế, [bg_myself.GetFirstNameNoTooltip]. Cậu thậm chí còn chẳng phải là một người chơi.\""

 ##################################################
 # Player Winning
  board_games.0001.desc.i_am_winning.diplomacy.low:0 ""Ta không… Ta không thể… Làm ơn nương tay một chút đi!" đối thủ của Ta gần như gào lên, rõ ràng đang bực bội và không thể tìm ra lời lẽ thích hợp."
  board_games.0001.desc.i_am_winning.diplomacy.medium:0 "Đối thủ của Ta không nói gì, chỉ gõ nhịp các ngón tay của [bg_opponent.GetHerHis] lên bàn trong cơn cáu kỉnh."
  board_games.0001.desc.i_am_winning.diplomacy.high:0 ""Có vẻ như," đối thủ mỉa mai, "ngươi đang khiến ta rơi vào thế bất lợi nho nhỏ. Ít nhất là lúc này.""
  board_games.0001.desc.i_am_winning.martial.low:0 ""Không chỉ huy nổi binh lính," đối thủ than vãn, "cũng chẳng chơi nổi [SCOPE.Custom('BG_GameType')]. Ta còn làm được gì đây?""
  board_games.0001.desc.i_am_winning.martial.medium:0 "Đối thủ vuốt cằm [bg_opponent.GetHerHis] đầy suy tư. "Ta đã #EMP tin chắc#! rằng chiến thuật đó sẽ hiệu quả...""
  board_games.0001.desc.i_am_winning.martial.high:0 ""Nếu đây là một chiến trường thực sự," đối thủ tuyên bố, "mọi chuyện #EMP đã#! rất khác rồi.""
  board_games.0001.desc.i_am_winning.stewardship.low:0 ""Sao mấy con số #EMP lúc nào#! cũng khó thế này?" đối thủ phụng phịu. "[SCOPE.Custom('BG_GameType')|U] bắt ngươi phải tính trước xa đến vậy, mà ta thì #EMP không thể#!.""
  board_games.0001.desc.i_am_winning.stewardship.medium:0 "Đối thủ chăm chú nhìn bàn cờ. "Ta phải… ta hẳn đã tính sai ở đâu đó...""
  board_games.0001.desc.i_am_winning.stewardship.high:0 ""Ta thật không muốn thừa nhận," đối thủ càu nhàu, "nhưng vận may xem ra không đứng về phía ta.""
  board_games.0001.desc.i_am_winning.intrigue.low:0 ""Ngươi có thể bớt cái trò gian lận #EMP lộ liễu#! đó lại một chút không?" đối thủ gầm gừ."
  board_games.0001.desc.i_am_winning.intrigue.medium:0 ""Ta nghi rằng chiến lược của mình cần thêm chút… mưu mẹo..." đối thủ lẩm bẩm, bực bội nhìn bàn cờ."
  board_games.0001.desc.i_am_winning.intrigue.high:0 ""Ngươi nghĩ mình đang thắng," đối thủ khúc khích, "nhưng ngươi chỉ nghĩ vậy vì ta muốn ngươi nghĩ thế. Và ta biết rằng ngươi biết rằng ta biết ngươi biết điều đó.""
  board_games.0001.desc.i_am_winning.learning.low:0 ""Thật là bất công, ta còn #EMP không hiểu#! nổi nửa số luật này," đối thủ hừ mũi. "Rõ ràng ngươi đang bịa ra chúng khi chơi.""
  board_games.0001.desc.i_am_winning.learning.medium:0 ""Ngươi lại dùng [bg_myself.Custom('BG_RandomRankPossessive')] [bg_myself.Custom('BG_RandomMoveType')] #EMP nữa#! à?" đối thủ rên rỉ. "Ngươi #EMP keo kiệt#! thật đấy.""
  board_games.0001.desc.i_am_winning.learning.high:0 ""Ta biết mà, lẽ ra không nên mở đầu bằng Nước Đi Kẻ Ngốc [bg_opponent.Custom('BG_RandomMoveType')]," đối thủ than vãn. "Coi như ta đã thua ngay từ đầu rồi.""
  board_games.0001.desc.i_am_winning.trait.lustful:0 "Đối thủ dường như chẳng chú tâm gì đến ván đấu, thay vào đó lại chăm chăm nhìn… hình dáng của vài [SCOPE.Custom('BG_GamePiecePlural')]."
  board_games.0001.desc.i_am_winning.trait.chaste:0 ""Đây chính là vấn đề của [SCOPE.Custom('BG_GameType')]," đối thủ kêu lên, khoa tay múa chân. "Nó kích động dục vọng! Khuấy động giác quan! Một sự phóng túng trần trụi và xác thịt ở dạng thấp kém nhất.""
  board_games.0001.desc.i_am_winning.trait.gluttonous:0 "Đối thủ nhai nhẩn nha một chiếc bánh mì nhỏ, chìm trong mớ vụn bánh và sự tập trung."
  board_games.0001.desc.i_am_winning.trait.temperate:0 ""Hừm," đối thủ càu nhàu. "Mạo hiểm kiểu này rồi có ngày ngươi tự hại mình thôi.""
  board_games.0001.desc.i_am_winning.trait.greedy:0 "Đối thủ của ta thờ ơ tung một đồng xu giữa các ngón tay [bg_opponent.GetHerHis], thứ kim loại lạnh lẽo có lẽ đang an ủi [bg_opponent.GetHerHim] khi [bg_opponent.GetSheHe] nhìn chằm chằm vào thất bại sắp tới của [bg_opponent.GetHerHis]."
  board_games.0001.desc.i_am_winning.trait.generous:0 "Đối thủ mỉm cười hiền hậu với Ta. "Ngươi chơi #EMP tốt lắm#! đấy, cứ tiếp tục đi!""
  board_games.0001.desc.i_am_winning.trait.lazy:0 ""Ồ, đến lượt ta rồi à?" đối thủ ngáp dài. "Xin lỗi, ta không để tâm #EMP nhiều#! lắm.""
  board_games.0001.desc.i_am_winning.trait.diligent:0 ""Đúng, hiện tại ngươi đang dẫn trước," đối thủ lên giọng giảng giải, "nhưng chỉ cần cố gắng thêm chút nữa, ta sẽ bắt kịp!""
  board_games.0001.desc.i_am_winning.trait.wrathful:0 "Một mạch máu trông thật xấu xí đang phồng lên [bg_opponent.Custom('MaskFace_BehindIn')] [bg_opponent.Custom('MaskFace')] của đối thủ. "Nếu ngươi còn tiếp tục thắng, ta sẽ nôn ra #EMP máu thật#! lên cái bàn cờ này, đồ gian lận khốn kiếp [bg_myself.Custom2('InsultNoun', SCOPE.sC('bg_opponent'))]!""
  board_games.0001.desc.i_am_winning.trait.calm:0 "Vẻ điềm tĩnh thường ngày của đối thủ nay đã… méo mó. Một cái cau mày khẽ làm u ám [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')]."
  board_games.0001.desc.i_am_winning.trait.patient:0 ""Hiện tại ngươi có lợi thế," đối thủ nhận xét, "nhưng rồi ngươi sẽ sơ hở thôi. Lúc nào cũng vậy.""
  board_games.0001.desc.i_am_winning.trait.impatient:0 ""Nhân danh [bg_opponent.GetFaith.HighGodName], ngươi thắng rồi, #EMP được chưa#!?" đối thủ cau có. "Chỉ cần #EMP kết thúc#! nó đi.""
  board_games.0001.desc.i_am_winning.trait.arrogant:0 ""Ngươi biết đấy, thực ra ngươi không hề đánh bại được ta," đối thủ huênh hoang. "Ngươi có thể #EMP nghĩ#! là có, nhưng điều đó là không thể.""
  board_games.0001.desc.i_am_winning.trait.humble:0 "Tai đối thủ đỏ #EMP thấy rõ#! vì bối rối. "Không thể phủ nhận rằng kỹ thuật của ngươi là…," [bg_opponent.GetSheHe] nuốt nước bọt, "hoàn hảo.""
  board_games.0001.desc.i_am_winning.trait.deceitful:0 ""Trông ngươi có vẻ cần đi nhà xí," đối thủ thông cảm gợi ý. "Cứ tự nhiên; ta sẽ trông bàn cờ.""
  board_games.0001.desc.i_am_winning.trait.honest:0 ""Ta không ngờ ngươi lại…" đối thủ ngập ngừng một lát, "#EMP khó chơi#! đến vậy.""
  board_games.0001.desc.i_am_winning.trait.craven:0 "Đối thủ bồn chồn không ngừng, trông như sắp bỏ chạy đến nơi."
  board_games.0001.desc.i_am_winning.trait.brave:0 ""Ta đã có kế hoạch," đối thủ khoe khoang, "và nó sẽ đảo ngược cả ván đấu này!""
  board_games.0001.desc.i_am_winning.trait.shy:0 "Đối thủ im lặng và bất động, cau mày khi [bg_opponent.GetSheHe] suy tính cách xoay chuyển ván cờ về phía [bg_opponent.GetHerHis] [SCOPE.Custom('BG_GamePiecePlural')]."
  board_games.0001.desc.i_am_winning.trait.gregarious:0 ""Ngươi giỏi hơn hẳn những người ta thường chơi cùng," đối thủ ngưỡng mộ, "mà ta chơi #EMP rất nhiều#! [SCOPE.Custom('BG_GameType')].""
  board_games.0001.desc.i_am_winning.trait.ambitious:0 ""Ta đã…" đối thủ ngập ngừng, không biết nói gì, "…đặt #EMP nhiều#! kỳ vọng hơn cho ván này.""
  board_games.0001.desc.i_am_winning.trait.content:0 ""À thì," đối thủ thở dài, "có thể ta không thắng, nhưng ta đã cố hết sức rồi.""
  board_games.0001.desc.i_am_winning.trait.arbitrary:0 ""Ta không hiểu sao chúng ta không thể dùng luật của ta," đối thủ than vãn. "Ta nói thật đấy, ở [bg_opponent.GetCurrentLocation.GetNameNoTooltip] ai cũng chơi như vậy.""
  board_games.0001.desc.i_am_winning.trait.just:0 ""Ta không thể chứng minh," đối thủ lẩm bẩm, "nhưng ta #EMP chắc chắn#! ngươi đang gian lận.""
  board_games.0001.desc.i_am_winning.trait.cynical:0 ""#EMP Dĩ nhiên#! là ngươi đang thắng rồi," đối thủ rên rỉ u sầu. "Chẳng có ai #EMP bao giờ#! để ta thắng một ván [SCOPE.Custom('BG_GameType')].""
  board_games.0001.desc.i_am_winning.trait.zealous:0 ""Nhân danh [bg_opponent.GetFaith.KnowledgeGodName]! Hãy giải thoát ta khỏi tai họa này," đối thủ lầm bầm dưới hơi thở của [bg_opponent.GetHerHis]."
  board_games.0001.desc.i_am_winning.trait.paranoid:0 ""Ngươi đã lên kế hoạch sẵn, đúng không?" đối thủ gần như gầm lên. "Lên kế hoạch để #EMP làm nhục#! ta bằng một ván đấu bị dàn xếp!""
  board_games.0001.desc.i_am_winning.trait.trusting:0 ""Nhân danh [bg_opponent.GetFaith.KnowledgeGodName]," đối thủ than thở. "Có phải ta đã cho ngươi quá nhiều cơ hội không? Ta không ngờ lại thua thảm đến vậy nhanh như thế.""
  board_games.0001.desc.i_am_winning.trait.compassionate:0 ""Ngươi biết không," đối thủ nói đầy ẩn ý, "[SCOPE.Custom('BG_GameType')] vốn là để #EMP vui vẻ#!, chứ không phải chỉ để thắng bằng mọi giá.""
  board_games.0001.desc.i_am_winning.trait.callous:0 ""Hừm, vậy ra cảm giác thua cuộc là thế này sao?" đối thủ tự hỏi. "Chẳng phải thứ ta đặc biệt thích.""
  board_games.0001.desc.i_am_winning.trait.sadistic:0 "Đối thủ im lặng, đôi [bg_opponent.Custom('EyeEyes')] để lộ sự tôn trọng miễn cưỡng trước kỹ năng và chiến thắng sắp đến."
  board_games.0001.desc.i_am_winning.trait.stubborn:0 ""Ngươi sẽ không đánh bại được ta đâu," đối thủ phun ra qua hàm răng nghiến chặt. "Chẳng có ai #EMP từng#! đánh bại được ta.""
  board_games.0001.desc.i_am_winning.trait.fickle:0 ""Ta đang thấy chán ngấy [SCOPE.Custom('BG_GameType')] rồi," đối thủ than vãn. "Không chơi thứ khác được sao?""
  board_games.0001.desc.i_am_winning.trait.vengeful:0 "Gương mặt đối thủ cứng đờ. Những ngón tay [bg_opponent.GetHerHis|U] siết chặt mép bàn cờ, như thể đang cố kìm nén bản thân."
  board_games.0001.desc.i_am_winning.trait.forgiving:0 "Đối thủ trông hoàn toàn bình thản, không hề có dấu vết oán giận nào hiện lên [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')]."
  board_games.0001.desc.i_am_winning.trait.rowdy:0 ""Chỉ để ngươi biết," đối thủ thì thầm, "nếu ta thua, ta sẽ ném cả bàn cờ này vào cái đầu ngu ngốc của ngươi.""
  board_games.0001.desc.i_am_winning.trait.charming:0 ""Ngươi không muốn nương tay cho ta #EMP một chút#! sao?" đối thủ hỏi, giọng [bg_opponent.GetHerHis] ngọt đến phát ngấy."
  board_games.0001.desc.i_am_winning.trait.curious:0 ""Chờ đã… sao ngươi lại #EMP thắng#! được vậy?" đối thủ tỏ ra hoàn toàn không thể tin nổi."
  board_games.0001.desc.i_am_winning.trait.pensive:0 ""Ôi không, ta biết là không nên chơi mà… giờ ta đã làm mất thời gian của ngươi rồi…" đối thủ lẩm bẩm."
  board_games.0001.desc.i_am_winning.trait.bossy:0 ""Hừm, nếu chơi theo #EMP luật của ta#! #EMP thì#! ta đã cho ngươi biết tay rồi!" đối thủ than vãn."
  board_games.0001.desc.i_am_winning.relation.friend:0 ""Chết tiệt," Bạn ta cười khẽ, "ngươi chơi [SCOPE.Custom('BG_GameType')] chẳng nương tay với ai cả, đúng không?""
  board_games.0001.desc.i_am_winning.relation.best_friend:0 ""Không gì sướng bằng," Bạn Thân ta cười khoái trá, "việc thắng đậm một ai đó ở [SCOPE.Custom('BG_GameType')]. Ta ghen tị với ngươi đấy!""
  board_games.0001.desc.i_am_winning.relation.rival:0 ""Ngươi #EMP thích#! làm nhục ta lắm phải không?" kình địch của ta phun ra, đúng kiểu kẻ thua cay cú."
  board_games.0001.desc.i_am_winning.relation.nemesis:0 "$board_games.0001.desc.opponent_winning.relation.nemesis$"
  board_games.0001.desc.i_am_winning.relation.lover:0 ""Chúng ta đâu #EMP cần#! phải chơi [SCOPE.Custom('BG_GameType')], [bg_myself.GetFirstNameNoTooltip]," người tình của ta thì thầm. "Chắc chắn còn những cách khác để tự giải trí mà…""
  board_games.0001.desc.i_am_winning.relation.soulmate:0 "$board_games.0001.desc.opponent_winning.relation.soulmate$"
  board_games.0001.desc.i_am_winning.relation.bully:0 ""Nếu ngươi đánh bại ta, ta sẽ đánh ngươi. Đơn giản vậy thôi," kẻ bắt nạt ta cau có."
  board_games.0001.desc.i_am_winning.relation.victim:0 "Nạn nhân của ta im lặng, nhưng trông như [bg_opponent.GetSheHe] sắp bật khóc."
  board_games.0001.desc.i_am_winning.relation.crush:0 "Người ta thầm thích là… Ôi không! [bg_opponent.GetSheHe|U] giận ta rồi, ta biết chắc mà, ta đọc được điều đó trên [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')]!"
  board_games.0001.desc.i_am_winning.relation.guardian:0 ""Có vẻ như ngươi đang học được điều gì đó," người giám hộ của ta nhận xét. "Hoặc ít nhất là bắt chước ta hiệu quả hơn.""
  board_games.0001.desc.i_am_winning.relation.ward:0 "Người được ta bảo trợ rõ ràng bị tổn thương bởi việc [bg_opponent.GetSheHe] đang thua thảm hại, một ánh nhìn giận dữ hiện rõ trên [bg_opponent.Custom('MaskFace_BehindAcross')] [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')]."
  board_games.0001.desc.i_am_winning.hook_on.weak:0 "$board_games.0001.desc.i_am_winning.hook_on.strong$"
  board_games.0001.desc.i_am_winning.hook_on.strong:0 ""[bg_opponent.GetFaith.random_GoodGodNames]! Ngươi không thể để ta có dù chỉ một chút quyền kiểm soát sao?" đối thủ than vãn."
  board_games.0001.desc.i_am_winning.hooked_by.weak:0 "$board_games.0001.desc.i_am_winning.hooked_by.strong$"
  board_games.0001.desc.i_am_winning.hooked_by.strong:0 ""Nếu việc gọi món nợ mà ngươi #EMP còn thiếu#! ở đây không phải là lãng phí," đối thủ cau có, "ta đã muốn #EMP ép#! ngươi thua rồi.""
  board_games.0001.desc.i_am_winning.match_history.recently_won_against.default:0 ""Ừ thì," đối thủ rên rỉ, "có vẻ #EMP ván này#! không đứng về phía ta.""
  board_games.0001.desc.i_am_winning.match_history.recently_won_against.county:0 ""Giá như ngươi chơi giỏi thế này khi [bg_myself.MakeScope.Var('bg_recent_land_loss_stake').Title.GetNameNoTier] còn là phần cược," đối thủ nhếch mép."
  board_games.0001.desc.i_am_winning.match_history.recently_won_against.gamble:0 ""À…," đối thủ thở dài. "Có thắng có thua. Lần này, có lẽ đến lượt ngươi thắng rồi.""
  board_games.0001.desc.i_am_winning.match_history.recently_lost_against.default:0 ""Không, không, không!" đối thủ than vãn. "Không phải #EMP lại#! thế này, không phải thua #EMP ngươi#!!""
  board_games.0001.desc.i_am_winning.match_history.recently_lost_against.county:0 "Đối thủ lau giọt mồ hôi trên [bg_opponent.GetHerHis] [bg_opponent.Custom('MaskFace')], đôi [bg_opponent.Custom('EyeEyes')] mở to, rõ ràng đang hồi tưởng lại ván đấu khiến [bg_opponent.GetHerHim] mất [bg_myself.MakeScope.Var('bg_recent_land_less_stake').Title.GetNameNoTier] khi chúng ta chơi."
  board_games.0001.desc.i_am_winning.match_history.recently_lost_against.gamble:0 ""Ta chỉ cần một chiến thắng, chỉ cần một chiến thắng, chỉ cần—" đối thủ lẩm bẩm lặp đi lặp lại dưới hơi thở của [bg_opponent.GetHerHis]."

 ##################################################
 # Introductions
  board_games.0001.desc.intro.opening.defender:0 "[bg_opponent.GetTitledFirstName] đã chờ sẵn để bắt đầu ván [SCOPE.Custom('BG_GameType')] nho nhỏ của chúng Ta, ngồi đó với một #color_blue_gray [bg_myself.Custom('BG_RandomFacialExpression')]#! hiện rõ trên gương mặt [bg_opponent.GetHerHis]."
  board_games.0001.desc.intro.opening.attacker:0 "[bg_opponent.GetTitledFirstName] ngồi vào chỗ đối diện ta. Trò chơi nhỏ của [SCOPE.Custom('BG_GameType')] sắp bắt đầu, và một #color_blue_gray [SCOPE.Custom('BG_RandomFacialExpression')]#! cho ta biết chính xác sự tự tin của [bg_myself.Custom2('RelationToMeShort', bg_opponent)] của ta."
  board_games.0001.desc.intro.subsequent:0 "Ván đấu tiếp tục diễn ra, [bg_opponent.GetFirstName] tiếp tục với"

 ##################################################
 # Opponent's Play
  board_games.0001.desc.intro.diplomacy.crit_success:0 "một chuỗi nước đi táo bạo đến mức phát bực, chưa kể còn đầy khiêu khích."
  board_games.0001.desc.intro.diplomacy.success:0 "một nước đi thành thạo kèm theo một câu bông đùa khéo léo."
  board_games.0001.desc.intro.diplomacy.failure:0 "vài nỗ lực đánh lạc hướng được che giấu khá vụng về."
  board_games.0001.desc.intro.diplomacy.crit_failure:0 "một cố gắng thảm hại, quá sức lộ liễu nhằm khiến Ta rối trí."
  board_games.0001.desc.intro.martial.crit_success:0 "một loạt nước đi chiến lược sáng tạo với sức tàn phá ghê gớm."
  board_games.0001.desc.intro.martial.success:0 "vài chiến thuật thích ứng được triển khai rất gọn gàng."
  board_games.0001.desc.intro.martial.failure:0 "một… nỗ lực xây dựng chiến lược #EMP vững chắc#!."
  board_games.0001.desc.intro.martial.crit_failure:0 "một chiến lược khoa trương đến mức #EMP buồn cười#!."
  board_games.0001.desc.intro.stewardship.crit_success:0 "một chuỗi nước đi mà xét về mặt toán học, gần như hoàn hảo."
  board_games.0001.desc.intro.stewardship.success:0 "một loạt nước đi được tính toán kỹ lưỡng và chính xác."
  board_games.0001.desc.intro.stewardship.failure:0 "một tập hợp nước đi nhạt nhẽo và tính toán sai lầm."
  board_games.0001.desc.intro.stewardship.crit_failure:0 "một mớ chắp vá thảm hại của những lần đoán mò xác suất."
  board_games.0001.desc.intro.intrigue.crit_success:0 "một mưu kế #EMP xảo quyệt#! đến mức khiến Ta câm lặng."
  board_games.0001.desc.intro.intrigue.success:0 "một loạt đòn nghi binh và mánh khóe đầy tinh ranh."
  board_games.0001.desc.intro.intrigue.failure:0 "một cái bẫy quá sức rõ ràng."
  board_games.0001.desc.intro.intrigue.crit_failure:0 "một nước cờ đơn giản là đáng thương."
  board_games.0001.desc.intro.learning.crit_success:0 "một nước đi như bước ra từ truyền thuyết."
  board_games.0001.desc.intro.learning.success:0 "vài chiến thuật truyền thống đã quá quen thuộc."
  board_games.0001.desc.intro.learning.failure:0 "một số nước đi tiêu chuẩn, chẳng có gì nổi bật."
  board_games.0001.desc.intro.learning.crit_failure:0 "một nỗ lực lóng ngóng nhằm bắt chước nước đi của những kỳ thủ giỏi hơn."
  board_games.0001.desc.intro.prowess.crit_success:0 "một màn tranh luận bằng sức mạnh #EMP vô cùng#! thuyết phục."
  board_games.0001.desc.intro.prowess.success:0 "một nước đi khá ổn cùng cú ra tay dứt khoát."
  board_games.0001.desc.intro.prowess.failure:0 "một nước đi tệ và một cú đánh còn tệ hơn."
  board_games.0001.desc.intro.prowess.crit_failure:0 "một nỗ lực dùng vũ lực buồn cười đến mức [bg_opponent.GetSheHe] suýt nữa thì tự đập vào đầu [bg_opponent.GetHerselfHimself]."

