  camp_purpose: "Mục Đích Trại"
  camp_purpose_pass_phrase: "Trở Thành [Law.GetNameNoTooltip]"
  camp_purpose_confirmation_button_text: "Thay Đổi Mục Đích"
  camp_purpose_mercenaries: "Lính Đánh Thuê"
  camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Tìm thấy nhiều [mercenary_task_contracts|E] hơn\n$EFFECT_LIST_BULLET$Tìm thấy nhiều [task_contracts|E] dựa trên [prowess|E] và [martial|E] hơn\n$EFFECT_LIST_BULLET$Mở khóa [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$Có thể bổ nhiệm một số [officers|E] đặc biệt:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Mở khóa qua $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Mở khóa qua $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Lính đánh thuê kiếm tiền trước hết bằng lưỡi kiếm. Thường là hợp pháp, nhưng khi thời thế khó khăn và trong tay Ngài chỉ còn một chiếc rìu...#!"
  camp_purpose_wanderers: "Lãng Du"
  camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Cơ hội ngang nhau để tìm [task_contracts|E] thuộc mọi loại\n$EFFECT_LIST_BULLET$Có thể chuyển sang bất kỳ $camp_purpose$ nào khác mà không phải trả nhiều [prestige|E]\n\n#WEAK Con đường rộng mở mang lại một tự do không gì sánh bằng — cớ gì phải tự trói mình vào một lối đi hẹp hòi?#!"
  camp_purpose_scholars: "Học Giả"
  camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Tìm thấy nhiều [task_contracts|E] dựa trên [learning|E] và [stewardship|E] hơn\n$EFFECT_LIST_BULLET$Tìm thấy hơi nhiều [task_contracts|E] dựa trên [diplomacy|E] hơn\n$EFFECT_LIST_BULLET$Mở khóa [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Có thể bổ nhiệm một số [officers|E] đặc biệt:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Mở khóa qua $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK Một cuốn sách bị giữ trong một thư viện sẽ trở nên tù túng, một ý tưởng chỉ tồn tại trong một tâm trí là điều lãng phí.#!"
  camp_purpose_explorers: "Nhà Thám Hiểm"
  camp_purpose_explorers_effects: "$EFFECT_LIST_BULLET$Tìm thấy nhiều [transport_task_contracts|E] hơn\n$EFFECT_LIST_BULLET$Tìm thấy nhiều [task_contracts|E] dựa trên [diplomacy|E] và [intrigue|E] hơn\n$EFFECT_LIST_BULLET$Tìm thấy hơi nhiều [task_contracts|E] dựa trên [martial|E] hơn\n$EFFECT_LIST_BULLET$Mở khóa [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK Luôn có một ngọn đồi khác, một ngọn núi khác, một nền văn hóa khác, một ngôn ngữ khác đang chờ đợi phía bên kia chân trời...#!"
  camp_purpose_brigands: "Kẻ Cướp Tự Do"
  camp_purpose_brigands_effects: "$EFFECT_LIST_BULLET$Tìm thấy nhiều [criminal_task_contracts|E] thuộc mọi loại hơn\n$EFFECT_LIST_BULLET$Tìm thấy nhiều [task_contracts|E] dựa trên [prowess|E] và [intrigue|E] hơn\n$EFFECT_LIST_BULLET$Mở khóa [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$Có thể bổ nhiệm một số [officers|E] đặc biệt:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Mở khóa qua $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (Mở khóa qua $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Mở khóa qua $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK “Kẻ cướp” là một từ nghe thật khó chịu — chẳng có gì sai khi hành động quyết đoán và thực tế, nhất là khi Ngài còn có thể kiếm lời kha khá từ đó.#!"
  camp_purpose_legitimists: "Chính Thống Phái"
  camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$Cơ hội ngang nhau để tìm [task_contracts|E] thuộc mọi loại\n$EFFECT_LIST_BULLET$Có thể sử dụng tương tác $request_laamp_legitimist_support$ với Vua và Hoàng đế\n$EFFECT_LIST_BULLET$Có thể sử dụng $claim_cb$ [casus_belli|E]\n$EFFECT_LIST_BULLET$Tìm thấy [task_contract|E] độc nhất $laamp_legitimist_support_contract$\n$EFFECT_LIST_BULLET$Mở khóa [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_future_dreams').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_bodyguard_drills').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_proof_of_claims').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$EFFECT_LIST_BULLET$Có thể bổ nhiệm một số [officers|E] đặc biệt:\n$BULLET_WITH_TAB$[GetCourtPositionType('witness_camp_officer').GetName()] #weak (Mở khóa qua $baggage_train_proof_of_claims_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Mở khóa qua $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Họ gọi đó là một yêu sách. Chỉ là một yêu sách. Nhưng đó không chỉ là yêu sách — mà là món nợ phải trả, là tuyên ngôn ý chí, và là dấu hiệu chắc chắn cho sự khôi phục sắp tới.#!"
