  minority:0 "Thiểu Số"
  minority_desc:0 "$minority$ [vassals|E] cảm thấy [faith|E] hoặc [culture|E] của họ bị gạt ra bên lề bởi [liege|E]. Các Chư hầu thuộc [faiths|E] hoặc [cultures|E] thù địch với mức [cultural_acceptance|E] dưới 30% thường theo [vassal_stance|E] này.\n\n#low $minority$ Vassals like when their Liege:#!\n$EFFECT_LIST_BULLET$Sử dụng nhiệm vụ $task_accept_culture$ [councillor_task|E]\n#weak (vì họ thường sẽ đổi lập trường khi trên 30% Chấp Nhận Văn Hóa)#!\n\n#low $minority$ Vassals dislike when their Liege:#!\n$EFFECT_LIST_BULLET$Cải đạo [faith|E] hoặc chuyển đổi [culture|E] của một [county|E]\n$EFFECT_LIST_BULLET$Có [crown_authority|E] cao\n\nHọ ưa chuộng các [heirs|E] danh dự và nhân hậu, tốt nhất là khác [faith|E] hoặc [culture|E] so với Lãnh chúa hiện tại của họ."
