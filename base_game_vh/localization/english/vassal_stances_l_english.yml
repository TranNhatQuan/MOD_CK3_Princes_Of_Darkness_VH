  courtly:0 "Cung Đình"
  courtly_desc:2 "$courtly$ [vassals|E] tin vào huyết thống cao quý và truyền thống, mong muốn duy trì trật tự tôn ti hiện hữu. Những Chư hầu thiên về giao thiệp hoặc nhân hậu thường theo [vassal_stance|E] này.\n\n#low $courtly$ Vassals like when their Liege:#!\n$EFFECT_LIST_BULLET$Ban cho họ các [court_positions|E]\n$EFFECT_LIST_BULLET$Tạo lập [titles|E] mới\n$EFFECT_LIST_BULLET$Mời họ tham dự [GetActivityType('activity_feast').GetName] [activities|E]\n\n#low $courtly$ Vassals dislike when their Liege:#!\n$EFFECT_LIST_BULLET$Ban [titles|E] cho nhân vật [lowborn|E]\n$EFFECT_LIST_BULLET$[marries|E] một nhân vật [lowborn|E] làm [primary_spouse|E]\n$EFFECT_LIST_BULLET$[disinherits|E] những [heirs|E] không có tranh chấp\n\nHọ ưa chuộng các [heirs|E] khéo giao thiệp và nhân hậu với chỉ số [diplomacy_i][diplomacy|E] cao."
