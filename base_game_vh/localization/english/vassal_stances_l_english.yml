  belligerent_nomad_desc: "$belligerent$ [vassals|E] tìm kiếm biểu hiện uy quyền từ [liege|E] của mình. Họ thường tham dự các giải đấu để tận mắt chứng kiến những chiến công [prowess|E] của lãnh chúa. [nomads|E] có khả năng theo [vassal_stance|E] này cao hơn.\n\n#low $belligerent$ Vassals like when their Liege:#!\n$EFFECT_LIST_BULLET$Có [nomadic_authority|E] cao\n$EFFECT_LIST_BULLET$Tổ chức [GetActivityType( 'activity_tournament' ).GetName] và chiến thắng các [contests|E]\n$EFFECT_LIST_BULLET$Tổ chức [GetActivityType( 'activity_hunt' ).GetName] [activities|E]\n$EFFECT_LIST_BULLET$Chiến thắng [single_combat_duel_plural|E]\n$EFFECT_LIST_BULLET$Yêu cầu [obedience|E]\n\n#low $belligerent$ Vassals dislike when their Liege:#!\n$EFFECT_LIST_BULLET$Thua [single_combat_duel_plural|E]\n$EFFECT_LIST_BULLET$Có [obedience|E] thấp\n$EFFECT_LIST_BULLET$Áp dụng bất kỳ [succession_laws|E] Phân Chia nào\n\nHọ ưa chuộng các [heirs|E] táo bạo và nóng giận với chỉ số [prowess_i][prowess|E] cao."
