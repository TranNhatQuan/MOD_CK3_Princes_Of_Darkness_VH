  zealot:0 "Cuồng Tín"
  zealot_desc:0 "$zealot$ [vassals|E] chuyên tâm vào các vấn đề của [faith|E], và dễ bị tác động bởi những hành động sùng đạo. Những Chư hầu nhiệt thành hoặc hiếu thù thường theo [vassal_stance|E] này, cũng như giới [clergy|E].\n\n#low $zealot$ Vassals like when their Liege:#!\n$EFFECT_LIST_BULLET$Xây dựng hoặc nâng cấp [temple|E] [holdings|E]\n$EFFECT_LIST_BULLET$Thành công với mưu đồ [GetScheme('learn_language').GetTypeName] [scheme|E]\n$EFFECT_LIST_BULLET$Có các [traits|E] [virtuous|E]\n$EFFECT_LIST_BULLET$Thực hiện [pilgrimage|E] [activities|E]\n\n#low $zealot$ Vassals dislike when their Liege:#!\n$EFFECT_LIST_BULLET$Xin [gold_i][gold|E] từ [head_of_faith|E]\n$EFFECT_LIST_BULLET$Có các [traits|E] [sinful|E]\n\nHọ ưa chuộng các [heirs|E] nhiệt thành và đức hạnh với chỉ số [learning_i][learning|E] cao."
