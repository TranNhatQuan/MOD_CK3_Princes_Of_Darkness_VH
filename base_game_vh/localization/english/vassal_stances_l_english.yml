  parochial:0 "Cục Bộ"
  parochial_desc:0 "$parochial$ [vassals|E] mong muốn sự ổn định, phân quyền và hòa bình, cũng như để vương quốc tránh xa những can dự bên ngoài. Những Chư hầu danh dự hoặc kín đáo thường theo [vassal_stance|E] này.\n\n#low $parochial$ Vassals like when their Liege:#!\n$EFFECT_LIST_BULLET$Xây dựng hoặc nâng cấp [holdings|E]\n$EFFECT_LIST_BULLET$Chỉ định họ làm [guardians|E] cho [close_family|E]\n$EFFECT_LIST_BULLET$Sử dụng nhiệm vụ $task_domestic_affairs$ [councillor_task|E]\n\n#low $parochial$ Vassals dislike when their Liege:#!\n$EFFECT_LIST_BULLET$Có [crown_authority|E] cao\n$EFFECT_LIST_BULLET$Tuyên bố các [wars|E] không mang tính phòng thủ nhỏ lẻ\n\nHọ ưa chuộng các [heirs|E] danh dự và lý trí với chỉ số [stewardship_i][stewardship|E] cao."
