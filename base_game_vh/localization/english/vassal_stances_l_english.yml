l_english:
  glory_hound:0 "Kẻ Săn Vinh Quang"
  glory_hound_desc:1 "$glory_hound$ [vassals|E] coi trọng thanh thế và uy danh, đồng thời muốn phô bày với thiên hạ sức mạnh của lãnh địa mà họ phụng sự. Những Chư hầu táo bạo hoặc vô cảm thường theo [vassal_stance|E] này.\n\n#low $glory_hound$ Vassals like when their Liege:#!\n$EFFECT_LIST_BULLET$Có bất kỳ [succession_law|E] Phân Chia nào\n$EFFECT_LIST_BULLET$Giành [victory|E] trong các [wars|E] tấn công\n$EFFECT_LIST_BULLET$Mời họ tham dự [GetActivityType('activity_hunt').GetName] [activities|E]\n\n#low $glory_hound$ Vassals dislike when their Liege:#!\n$EFFECT_LIST_BULLET$Có [crown_authority|E] cao\n$EFFECT_LIST_BULLET$Ký nhận [defeat|E] hoặc [white_peace|E] trong Chiến tranh\n$EFFECT_LIST_BULLET$[marries|E] một nhân vật [lowborn|E] làm [primary_spouse|E]\n\nHọ ưa chuộng những [heirs|E] táo bạo và dũng cảm với chỉ số [martial_i][martial|E] cao."
