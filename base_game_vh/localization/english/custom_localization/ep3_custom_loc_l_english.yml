  BLUE_VENETOI_GLOSS: "The #bold Venetoi#!, tên gọi thời kỳ của phe \"Xanh Lam\", được xem là một trong những đội danh giá nhất từng tranh tài tại Trường Đua Constantinople và thường được cho là có liên hệ với tầng lớp thượng lưu. Người đánh xe nổi tiếng Porphyrius là một thành viên danh tiếng của phe Xanh Lam, dù ông từng trong thời gian ngắn chuyển sang phe Xanh Lục vào thời kỳ Bạo Loạn Nika."
  GREEN_PRASINOI_GLOSS: "The #bold Prasinoi#!, tên gọi thời kỳ của phe \"Xanh Lục\", được xem là phe phái của dân chúng. Vào thế kỷ VI, phe Xanh Lục đã tàn sát gần 3.000 thành viên phe Xanh Lam tại đấu trường Constantinople."
  WHITE_LEUKOI_GLOSS: "The #bold Leukoi#!, tên gọi thời kỳ của phe \"Trắng\", trong lịch sử bị lu mờ bởi phe Xanh Lam và Xanh Lục, nhưng tuyệt nhiên không phải là không đáng kể. Đến giai đoạn này, họ đã bị phe Xanh Lam sáp nhập."
  RED_RHOUSIOI_GLOSS: "The #bold Rhousioi#!, tên gọi thời kỳ của phe \"Đỏ\", trong lịch sử bị lu mờ bởi phe Xanh Lam và Xanh Lục, nhưng tuyệt nhiên không phải là không đáng kể. Đến giai đoạn này, họ đã bị phe Xanh Lục sáp nhập."

