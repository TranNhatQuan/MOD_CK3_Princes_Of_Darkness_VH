 # GovernorChitChat
  chariot_governor_chitchat_1: "Hãy chiêm ngưỡng vẻ uy nghi của các cuộc đua xe ngựa, thưa người đồng nhiệm. Trường Đua là nơi tinh thần Byzantium thực sự bừng sống!"
  chariot_governor_chitchat_2: "Trong tiếng gầm vang của đám đông và tiếng vó ngựa rền vang, ta cảm nhận được nhịp đập của đế quốc vĩ đại này, ngài có đồng ý không?"
  chariot_governor_chitchat_3: "Những cuộc đua này không chỉ là màn trình diễn; chúng là minh chứng cho sự đoàn kết và sức mạnh của nhân dân ta. Một lời nhắc rằng dù cạnh tranh, chúng ta vẫn là một."
  chariot_governor_chitchat_4: "Hãy nhìn những sắc màu rực rỡ của các phe tranh tài, một bữa tiệc thị giác phản chiếu sự đa dạng và phồn thịnh của đế quốc thân yêu."
  chariot_governor_chitchat_5: "Với cương vị tổng đốc, chúng ta là những người gìn giữ truyền thống. Các cuộc đua xe tại Trường Đua là sợi dây không đứt nối liền hiện tại với quá khứ huy hoàng."
  chariot_governor_chitchat_6: "Hãy xem tiếng reo hò và la ó vọng qua thời gian, mang theo dư âm của những Hoàng đế đã khuất. Trường Đua là di sản chung của chúng ta."
  chariot_governor_chitchat_7: "Trong đấu trường, nơi kỹ năng và chiến lược hội tụ, ta thấy hình ảnh phản chiếu của trách nhiệm hành chính. Chúng ta cũng phải vượt qua chướng ngại với sự chính xác như các đánh xe."
  chariot_governor_chitchat_8: "Hãy chứng kiến sự cuồng nhiệt của dân chúng khi họ cổ vũ cho những tay đánh xe yêu thích. Đó là lời nhắc rằng cai trị, cũng như đua xe, là điệu nhảy cùng dư luận."
  chariot_governor_chitchat_9: "Trường Đua thì thầm những câu chuyện thắng bại, nhắc nhở rằng thành công đòi hỏi cả chiến lược lẫn khả năng thích ứng, giống như nhiệm vụ của chúng ta."
  chariot_governor_chitchat_10: "Hãy tận hưởng đôi chút khoảng lặng này khỏi công vụ, Ngài hữu của ta, và đắm mình trong cảnh tượng Trường Đua. Dẫu sao, ngay cả tổng đốc cũng xứng đáng có vài khoảnh khắc thư nhàn."

