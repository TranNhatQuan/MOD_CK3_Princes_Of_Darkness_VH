  marco_polo_quote_artifact_desc_5: "$marco_polo_quote_desc_5$ (...)"
  marco_polo_quote_artifact_desc_6: "$marco_polo_quote_desc_6$ (...)"
  marco_polo_quote_artifact_desc_7: "$marco_polo_quote_desc_7$ (...)"
