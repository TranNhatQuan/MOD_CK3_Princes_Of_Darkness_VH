  damage_artifact_fallback:0 "gây hư hại cho"

 #Marco Polo quotes
  marco_polo_quote_intro_1: "Ngươi sẽ tự tai nghe thấy, và điều đó hẳn sẽ khiến ngươi tràn đầy kinh ngạc."
  marco_polo_quote_intro_2: "Thế giới là một tấm thảm rộng lớn, được dệt nên từ những sợi chỉ của các nền văn hóa và truyền thống khác nhau."
  marco_polo_quote_desc_1: "Chúng Ta khỏa thân vì không muốn mang theo điều gì của thế gian này; bởi khi đến với đời, chúng Ta trần truồng và không y phục. Việc không xấu hổ khi để lộ thân thể là vì chúng Ta không phạm tội lỗi bằng nó, nên cũng chẳng xấu hổ hơn khi các ngươi để lộ tay, mặt hay những bộ phận khác không dẫn đến tội dục vọng; còn các ngươi thì dùng thân thể để phạm tội và dâm loạn, nên mới che giấu và xấu hổ về nó. Còn chúng Ta, không xấu hổ khi phô bày chúng cũng như không xấu hổ khi phô bày ngón tay mình, bởi chúng Ta không phạm tội với chúng."
  marco_polo_quote_desc_2: "Và ta đảm bảo rằng phụ nữ mua bán và lo liệu mọi việc cần thiết cho chồng con và gia đình. Đàn ông thì chẳng bận tâm điều gì ngoài săn bắn, chiến tranh và nuôi chim ưng. Họ sống bằng thịt, sữa và thú rừng, cùng với chuột, thứ có rất nhiều ở khắp nơi."
  marco_polo_quote_desc_3: "Họ là những chiến binh cường tráng, vượt trội về lòng can đảm và sức chịu đựng. Ta sẽ giải thích vì sao họ có thể chịu đựng hơn bất kỳ ai khác. Thường thì, khi cần, họ có thể đi hoặc ở suốt cả tháng không cần lương thực, chỉ uống sữa ngựa cái và ăn thú rừng do chính họ săn được."
  marco_polo_quote_desc_4: "Còn một phong tục kỳ lạ khác mà ta đã quên mô tả: các ngươi có thể tin chắc rằng, khi có hai người đàn ông, một người từng có con trai chết lúc bốn tuổi (hoặc bao nhiêu tuổi cũng được), và người kia từng có con gái cũng đã chết, thì họ sẽ sắp xếp một cuộc hôn nhân giữa hai đứa trẻ ấy."
  marco_polo_quote_desc_5: "Có những thung lũng rất lớn và rất sâu, không thể tiếp cận được đáy. Vì thế, những người đi tìm kim cương mang theo các mảnh thịt, càng nạc càng tốt, rồi ném xuống đáy thung lũng. Khi đại bàng thấy thịt bị ném xuống, chúng lao tới và mang lên các mỏm đá. Người ta đến các tổ đại bàng trắng đó — mà có rất nhiều — và trong phân của chúng tìm thấy vô số kim cương, vì chim đã nuốt chúng khi ăn thịt bị ném xuống."
  marco_polo_quote_desc_6: "Có một nguồn dầu phun ra với lượng lớn đến mức có thể chất đầy cho nhiều lạc đà. Dầu này không dùng làm thực phẩm, mà dùng như thuốc bôi để chữa các bệnh ngoài da cho người và gia súc, cùng những chứng bệnh khác, và cũng rất tốt để đốt. Trong vùng xung quanh, không có loại dầu nào khác được dùng trong đèn, và người ta từ những nơi xa xôi cũng đến để lấy nó."
  marco_polo_quote_desc_7: "Nếu có ai thắc mắc làm sao dân cư của xứ này có thể cung cấp đủ người cho những bổn phận ấy, và bằng cách nào họ được nuôi sống, thì có thể trả lời rằng tất cả những kẻ thờ ngẫu tượng đều nuôi sáu, tám hay mười người vợ, tùy hoàn cảnh, và bởi họ mà sinh ra vô số con cái. Một số người có tới ba mươi con trai đủ sức theo cha ra trận."
  marco_polo_quote_end_1: "Ta nói và nói, nhưng người nghe chỉ giữ lại những lời họ vốn mong đợi. Không phải giọng nói điều khiển câu chuyện: mà là đôi tai."
  marco_polo_quote_end_2: "Bởi dù ta kể thế nào đi nữa, các ngươi cũng sẽ chẳng bao giờ hài lòng rằng ta đang giữ đúng sự thật và lẽ phải."

  marco_polo_quote_artifact_intro_1: "$marco_polo_quote_intro_1$ (...)"
