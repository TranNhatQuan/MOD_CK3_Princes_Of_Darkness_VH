l_english:
  martial_good_trait_match_good_outcome:0 "Là một đứa trẻ năng động và đầy nhiệt huyết, không có gì ngạc nhiên khi [ROOT.Char.GetFirstName] đã đạt được thành tích tốt trong việc học hỏi về chiến tranh và chiến đấu."
  martial_bad_trait_match_good_outcome:0 "Nói rằng [ROOT.Char.GetFirstName] bướng bỉnh không phù hợp với con đường binh nghiệp thì còn là nói giảm. Tuy nhiên, [ROOT.Char.GetSheHe] đã phá vỡ mọi kỳ vọng."
  martial_neutral_trait_match_good_outcome:0 "Với sự chỉ dạy thích đáng, ngay cả một đứa trẻ ít thể hiện khuynh hướng tự nhiên với chiến tranh như [ROOT.Char.GetFirstName] cũng có thể thực sự lĩnh hội được nó."
  education_martial_3_outcome_description:0 "[ROOT.Char.GetSheHe|U] đã thể hiện năng khiếu tuyệt vời cả trong chiến thuật chiến đấu lẫn việc chỉ huy và quản lý quân đội. Ta chắc chắn rằng một ngày nào đó [ROOT.Char.GetSheHe|U] sẽ trở thành một vị chỉ huy tài ba."
  education_martial_3_outcome_description_not_commander:0 "[ROOT.Char.GetSheHe|U] đã thể hiện năng khiếu vượt trội cả trong chiến thuật lẫn quản lý quân đội. Thật đáng tiếc là [ROOT.Char.GetSheHe] sẽ không bao giờ chỉ huy binh mã."
  education_martial_4_outcome_description:0 "Thật ấn tượng khi thấy kỹ năng như vậy ở một người trẻ tuổi. [ROOT.Char.GetSheHe|U] thể hiện sự nhạy bén hiếm thấy ngay cả ở những vị chỉ huy lão luyện!"
 
  martial_good_trait_match_bad_outcome:0 "Bản tính tràn đầy năng lượng của [ROOT.Char.GetFirstNamePossessive] từng được cho là dấu hiệu của năng khiếu đối với chiến tranh và chiến đấu, nhưng có lẽ đó chỉ đơn giản là sự bướng bỉnh."
  martial_bad_trait_match_bad_outcome:1 "[ROOT.Char.GetFirstName] chưa bao giờ tỏ ra hứng thú với chiến tranh, nhưng ta vẫn hy vọng đó chỉ là giai đoạn thoáng qua. Ta đã quá ngây thơ."
  martial_neutral_trait_match_bad_outcome:1 "Trong một thời gian dài, ta hy vọng rằng sự chỉ dạy tốt sẽ đủ để dạy [ROOT.Char.GetFirstName] những điều tinh tế của chiến tranh. Ta đã quá ngây thơ."
  education_martial_1_outcome_description:2 "[ROOT.Char.GetSheHe|U] tỏ ra hiểu biết rất ít về lĩnh vực này, nhưng ít nhất [ROOT.Char.GetSheHe] cũng biết cầm kiếm đúng cách, và có lẽ còn phân biệt được một lính bộ binh với một $knight_culture_player_no_tooltip_lowercase$."
  education_martial_2_outcome_description:1 "[ROOT.Char.GetSheHe|U] chỉ mới phát triển được hiểu biết cơ bản, nhưng ít nhất [ROOT.Char.GetSheHe] đã nắm được những điều cốt lõi trong việc quản lý quân đội. Ta chỉ có thể hy vọng kinh nghiệm sẽ bù đắp phần còn lại."

  education_martial_prowess_1_outcome_description:1 "\n\nXét về năng lực cá nhân, [ROOT.Char.GetSheHe] không học được nhiều từ quá trình rèn luyện $knight_culture_player_adjective_no_tooltip_lowercase$ của mình, và tỏ ra vô cùng vụng về trong các cuộc giao đấu một chọi một."
  education_martial_prowess_2_outcome_description:1 "\n\nXét về năng lực cá nhân, [ROOT.Char.GetSheHe] cũng đã tham gia vài trận giao tranh thành công chống lại những nhóm nông dân nổi loạn nhỏ, qua đó thể hiện [ROOT.Char.GetHerHim] là một $knight_culture_player_no_tooltip_lowercase$ có năng lực."
  education_martial_prowess_3_outcome_description:0 "\n\nXét về năng lực cá nhân, [ROOT.Char.GetSheHe] đã chứng minh bản thân là một chiến binh cận chiến thành công, có khả năng sử dụng thanh kiếm của [ROOT.Char.GetHerHis] và đội tùy tùng riêng như một thể thống nhất."
  education_martial_prowess_4_outcome_description:0 "\n\nXét về năng lực cá nhân, [ROOT.Char.GetSheHe] đã thể hiện bản thân là một chiến binh đơn đấu vô cùng tài giỏi, làm chủ ngay cả những hình thức chiến đấu truyền thống khó nhất của nền văn hóa [ROOT.Char.GetCulture.GetNameNoTooltip] của mình."

  diplomacy_good_trait_match_good_outcome:0 "Ngay từ khi còn nhỏ, [ROOT.Char.GetFirstName] đã luôn có tài ăn nói. Vì vậy, việc [ROOT.Char.GetSheHe] tiếp thu tốt các nghiên cứu về ngoại giao là điều không có gì đáng ngạc nhiên."
  diplomacy_good_trait_match_bad_outcome:0 "Dù là một đứa trẻ hay trò chuyện, [ROOT.Char.GetFirstName] đôi khi vẫn gặp khó khăn trong việc hòa hợp với người khác."
  diplomacy_bad_trait_match_good_outcome:0 "Dù hiếm khi hòa hợp với những đứa trẻ khác, [ROOT.Char.GetFirstName] lại cho thấy năng khiếu đáng ngạc nhiên trong việc xoay chuyển ngoại giao."
  diplomacy_bad_trait_match_bad_outcome:0 "[ROOT.Char.GetFirstName] luôn quá chú tâm vào điều mà #EMP [ROOT.Char.GetSheHe]#! muốn, nên có lẽ cũng không quá bất ngờ khi [ROOT.Char.GetSheHe] gặp nhiều khó khăn trong việc gây ảnh hưởng đến người khác."
  diplomacy_neutral_trait_match_good_outcome:0 "Với sự chỉ dạy thích đáng, ngay cả một đứa trẻ ít thể hiện khuynh hướng tự nhiên về ảnh hưởng ngoại giao như [ROOT.Char.GetFirstName] cũng có thể thực sự hiểu được nó."
  diplomacy_neutral_trait_match_bad_outcome:0 "Trong một thời gian dài, ta hy vọng rằng sự chỉ dạy tốt sẽ đủ để dạy [ROOT.Char.GetFirstName] những điều tinh tế của ngoại giao. Nhưng mọi nỗ lực đều vô ích."

  stewardship_good_trait_match_good_outcome:0 "Là một nhà quản lý bẩm sinh ngay từ khi chào đời, không có gì đáng ngạc nhiên khi [ROOT.Char.GetFirstName] đã tiến xa trong quá trình học hỏi về việc cai quản lãnh địa."
  stewardship_good_trait_match_bad_outcome:0 "Dù luôn tỏ ra tìm kiếm trật tự và quyền lực, [ROOT.Char.GetFirstName] lại không đạt được mức thành thạo như mong đợi trong việc quản lý đất đai và dân chúng."
  stewardship_bad_trait_match_good_outcome:0 "Dù quan tâm nhiều hơn đến những lời đồn về dân chúng hơn là thuế khóa và sổ sách, [ROOT.Char.GetFirstName] vẫn phát triển được năng khiếu quản trị."
  stewardship_bad_trait_match_bad_outcome:0 "Có lẽ không có gì đáng ngạc nhiên, sự ám ảnh của [ROOT.Char.GetFirstNamePossessive] với những chi tiết vụn vặt trong cuộc sống của mọi người đã không giúp ích gì cho việc hiểu biết về công việc quản lý cả một vương quốc của [ROOT.Char.GetHerHis]."
  stewardship_neutral_trait_match_good_outcome:0 "Với sự chỉ dạy thích đáng, ngay cả một đứa trẻ ít thể hiện khuynh hướng tự nhiên về quản trị như [ROOT.Char.GetFirstName] cũng có thể thực sự hiểu được nó."
  stewardship_neutral_trait_match_bad_outcome:0 "Trong một thời gian dài, ta hy vọng rằng sự chỉ dạy tốt sẽ đủ để dạy [ROOT.Char.GetFirstName] những điều tinh tế của quản trị. Nhưng mọi nỗ lực đều vô ích."

  intrigue_good_trait_match_good_outcome:0 "Luôn là một đứa trẻ thông minh, [ROOT.Char.GetFirstName] đã hết lần này đến lần khác chứng minh trong suốt quá trình học tập rằng [ROOT.Char.GetSheHe] có năng khiếu bẩm sinh về việc lập kế hoạch cẩn trọng và không thiếu khả năng đánh lạc hướng người khác."
  intrigue_good_trait_match_bad_outcome:0 "Dù từng có không ít kinh nghiệm nói dối khi còn nhỏ, [ROOT.Char.GetFirstName] luôn gặp khó khăn trong việc áp dụng sự sáng tạo đó vào bất kỳ cấu trúc nào."
  intrigue_bad_trait_match_good_outcome:0 "Dù là một đứa trẻ hướng nội, thường đắm chìm trong suy nghĩ, [ROOT.Char.GetFirstName] vẫn dần hình thành khuynh hướng với nghệ thuật thao túng."
  intrigue_bad_trait_match_bad_outcome:0 "Là một đứa trẻ trầm lặng và sống khép kín, [ROOT.Char.GetFirstName] chưa bao giờ thể hiện nhiều hứng thú trong việc đạt được điều [ROOT.Char.GetHerHis] mong muốn."
  intrigue_neutral_trait_match_good_outcome:0 "Với sự chỉ dạy thích đáng, ngay cả một đứa trẻ ít thể hiện khuynh hướng tự nhiên về lập kế hoạch cẩn trọng như [ROOT.Char.GetFirstName] cũng có thể thực sự hiểu được giá trị của nó."
  intrigue_neutral_trait_match_bad_outcome:0 "Trong một thời gian dài, ta hy vọng rằng sự chỉ dạy tốt sẽ đủ để dạy [ROOT.Char.GetFirstName] những điều tinh tế của việc lập kế hoạch. Nhưng mọi nỗ lực đều vô ích."

  learning_good_trait_match_good_outcome:0 "Luôn là một đứa trẻ tò mò và khao khát tri thức, [ROOT.Char.GetFirstName] đã sớm cho thấy năng khiếu học thuật."
  learning_good_trait_match_bad_outcome:0 "Mặc dù là một đứa trẻ tò mò và ham học hỏi, sự chú ý của [ROOT.Char.GetFirstNamePossessive] đã dần chuyển sang những thứ khác khi [ROOT.Char.GetSheHe] lớn lên."
  learning_bad_trait_match_good_outcome:0 "Dù từng tỏ ra là một đứa trẻ lơ đãng, [ROOT.Char.GetFirstName] đã chứng minh rằng sự chuyên cần tập trung không phải là yếu tố duy nhất tạo nên một học giả."
  learning_bad_trait_match_bad_outcome:0 "Vốn là một đứa trẻ thiếu tập trung, không khó để hiểu vì sao [ROOT.Char.GetFirstName] gặp nhiều khó khăn trong việc nắm bắt học thuật."
  learning_neutral_trait_match_good_outcome:0 "Với sự chỉ dạy thích đáng, ngay cả một đứa trẻ ít thể hiện khuynh hướng tự nhiên với học thuật như [ROOT.Char.GetFirstName] cũng có thể thực sự hiểu bất kỳ lĩnh vực nào."
  learning_neutral_trait_match_bad_outcome:0 "Trong một thời gian dài, ta hy vọng rằng sự chỉ dạy tốt sẽ đủ để dạy [ROOT.Char.GetFirstName] những điều tinh tế của học thuật. Nhưng mọi nỗ lực đều vô ích."



  education_diplomacy_1_outcome_description:1 "Những phép tắc về sự lịch thiệp và danh dự quả thực là một thử thách lớn đối với [ROOT.Char.GetHerHim], nhưng ít nhất [ROOT.Char.GetSheHe] cũng biết cách ứng xử với những nghi lễ cơ bản."
  education_diplomacy_2_outcome_description:1 "Ít có ai trong bất kỳ triều đình nào sẽ thực sự ấn tượng với sự hiểu biết về phép tắc của [ROOT.Char.GetHerHis], nhưng ít nhất [ROOT.Char.GetSheHe] vẫn biết cách giữ mình trong những cuộc giao tiếp lịch sự."
  education_diplomacy_3_outcome_description:0 "Với sự nắm vững xuất sắc mọi phép tắc lễ nghi, hiểu biết về đủ loại hình giải trí cùng khả năng ăn nói lưu loát, [ROOT.Char.GetSheHe] sẽ không gặp nhiều khó khăn khi sống nơi triều đình."
  education_diplomacy_4_outcome_description:0 "Một chiếc lưỡi bạc thực thụ, [ROOT.Char.GetSheHe] có thể lay chuyển ý kiến của cả Bá tước lẫn Quốc vương! Khi [ROOT.Char.GetSheHe] lên tiếng, triều đình lắng nghe trong sự say mê tuyệt đối."

  education_stewardship_1_outcome_description:0 "Có lẽ [ROOT.Char.GetSheHe] nên tự xem mình là may mắn khi đã thành thạo nghệ thuật đếm tiền xu, bởi hầu như mọi khía cạnh khác trong công việc của một quan quản gia đều vượt quá khả năng của [ROOT.Char.GetHerHim]."
  education_stewardship_2_outcome_description:1 "Ít ai sẽ ấn tượng với mức độ hiểu biết của [ROOT.Char.GetHerHis], nhưng ít nhất [ROOT.Char.GetSheHe] cũng đã nắm vững những nguyên tắc quản lý cơ bản và bước đầu hình thành tính tiết kiệm hợp lý."
  education_stewardship_3_outcome_description:0 "Thể hiện sự thấu hiểu sâu sắc về dòng chảy của vàng bạc và sự dịch chuyển của con người, [ROOT.Char.GetSheHe] thậm chí còn bộc lộ óc sáng tạo đáng kể trong việc xử lý những vấn đề này."
  education_stewardship_4_outcome_description:0 "Không chỉ hiểu rõ dòng chảy của của cải và con người, [ROOT.Char.GetSheHe] dường như còn có thể dự đoán chúng như theo bản năng! [ROOT.Char.GetSheHe|U] cũng luôn tìm ra những cách mới để trục lợi từ đó."

  education_intrigue_1_outcome_description:0 "Với sự thiếu tinh tế và kiên nhẫn, [ROOT.Char.GetSheHe] gặp khó khăn trong việc thực hiện những kế hoạch dài hạn của [ROOT.Char.GetHerHis]. Ít nhất thì [ROOT.Char.GetSheHe] vẫn cố gắng lập ra kế hoạch."
  education_intrigue_2_outcome_description:1 "Dù [ROOT.Char.GetSheHe] đã chứng tỏ [ROOT.Char.GetHerselfHimself] hoàn toàn có khả năng thực hiện những mưu đồ nhỏ nhặt, nhưng ít ai gọi chúng là tinh xảo; dù vậy, tinh xảo không phải lúc nào cũng là điều cần thiết."
  education_intrigue_3_outcome_description:0 "[ROOT.Char.GetSheHe|U] giờ đây biết rất nhiều cách để đạt được điều [ROOT.Char.GetSheHe] mong muốn. Quan trọng hơn cả, [ROOT.Char.GetSheHe] nhận thức rất rõ những hệ quả chính trị của các mong muốn đó."
  education_intrigue_4_outcome_description:0 "Tuy nhiên, giờ đây mọi chuyện đã trở nên khó nói hơn. Mọi nhiệm vụ được giao cho [ROOT.Char.GetHerHim] đều đã được người khác hoàn thành trước khi [ROOT.Char.GetSheHe] kịp bắt tay vào làm, và [ROOT.Char.GetSheHe] cũng không còn nói những lời dối trá vụn vặt như trước kia nữa. Có lẽ [ROOT.Char.GetSheHe] không thông minh như vẻ ngoài ban đầu sau cùng."

  education_learning_1_outcome_description:0 "Việc theo đuổi tri thức dường như chưa bao giờ bén rễ vững chắc trong tâm trí [ROOT.Char.GetHerHis], và giờ đây thời gian dành cho sách vở và kinh điển đối với [ROOT.Char.GetHerHim] giống một nghĩa vụ hơn là niềm vui."
  education_learning_2_outcome_description:0 "Không phải là người quá chăm chỉ học tập, [ROOT.Char.GetSheHe] ít nhất cũng đã cố gắng ghi nhớ một số câu trích dẫn đặc sắc từ các tác phẩm kinh điển. Có lẽ [ROOT.Char.GetSheHe|U] sẽ không bao giờ viết nên những định lý vĩ đại, nhưng [ROOT.Char.GetSheHe] có thể đọc được một hoặc hai cuốn sách."
  education_learning_3_outcome_description:0 "Là một người học hỏi say mê, [ROOT.Char.GetSheHe] đã trở thành một kẻ sưu tầm tri thức thực thụ, và chứng minh [ROOT.Char.GetHerselfHimself] hoàn toàn có khả năng xây dựng những lập luận lý thuyết và thần học nâng cao."
  education_learning_4_outcome_description:0 "Sự am hiểu của [ROOT.Char.GetHerHis|U] về các tác phẩm triết học và lý thuyết thật đáng kinh ngạc, và [ROOT.Char.GetSheHe] thường xuyên tham gia tranh luận với những người thầy cũ của mình. Ngay cả khi còn trẻ như vậy, người ta vẫn có thể nghe thấy [ROOT.Char.GetSheHe] trích dẫn những đoạn văn ít người biết đến để ủng hộ những ý tưởng và học thuyết mới."


