 ##################################################
 # Intro Lines
 ## Romance
  GeneratePoem_Intro_Rhyming_Romance_01_A_01:0 "Ôi dung nhan ấy rạng ngời biết bao,"
  GeneratePoem_Intro_Rhyming_Romance_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
  GeneratePoem_Intro_Rhyming_Romance_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_01_A_01$"
  GeneratePoem_Intro_Rhyming_Romance_01_B_01:0 "Lấp lánh, lung linh, ám ảnh giấc mơ ta,"
  GeneratePoem_Intro_Rhyming_Romance_01_B_02:0 "Thuần khiết đến mức khiến tim ta tan vỡ,"
  GeneratePoem_Intro_Rhyming_Romance_01_B_03:0 "Lạc trong nụ cười của [ROOT.Var('poem_subject').Char.GetHerHis] ấm áp tựa ánh dương,"
  GeneratePoem_Intro_Rhyming_Romance_02_A_01:0 "[ROOT.Var('poem_subject').Char.GetWomanMan] yêu kiều ấy, quyến rũ lòng ta đến thế,"
  GeneratePoem_Intro_Rhyming_Romance_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
  GeneratePoem_Intro_Rhyming_Romance_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_02_A_01$"
  GeneratePoem_Intro_Rhyming_Romance_02_B_01:0 "Ôi, ôi, [ROOT.Var('poem_subject').Char.GetWomanMan] ấy giờ nơi đâu?"
  GeneratePoem_Intro_Rhyming_Romance_02_B_02:0 "Dung nhan ấy dường như luôn bừng sáng,"
  GeneratePoem_Intro_Rhyming_Romance_02_B_03:0 "Người mà ta nguyện trung thành trọn kiếp,"
  GeneratePoem_Intro_Rhyming_Romance_03_A_01:0 "Ta tự hỏi những bí mật nào đang được che giấu sau chiếc mặt nạ của [ROOT.Var('poem_subject').Char.GetHerHis]?"
  GeneratePoem_Intro_Rhyming_Romance_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
  GeneratePoem_Intro_Rhyming_Romance_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Romance_03_A_01$"
  GeneratePoem_Intro_Rhyming_Romance_03_B_01:0 "Những điều kỳ diệu nào ẩn giấu? Những chân tướng nào bị che đậy?"
  GeneratePoem_Intro_Rhyming_Romance_03_B_02:0 "Bởi lẽ [ROOT.Var('poem_subject').Char.GetWomanMan] này hẳn không tì vết,"
  GeneratePoem_Intro_Rhyming_Romance_03_B_03:0 "Đó là khiên chắn hay chỉ là lớp ngụy trang?"
 ## Mourning
  GeneratePoem_Intro_Rhyming_Mourning_01_A_01:0 "Dẫu bao ngày tháng vặn xoắn trôi qua,"
  GeneratePoem_Intro_Rhyming_Mourning_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
  GeneratePoem_Intro_Rhyming_Mourning_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_01_A_01$"
  GeneratePoem_Intro_Rhyming_Mourning_01_B_01:0 "Đời thiếu vắng [ROOT.Var('poem_subject').Char.GetHerHim] chỉ còn bùn lầy bệnh hoạn,"
  GeneratePoem_Intro_Rhyming_Mourning_01_B_02:0 "Thế gian trở nên xa cách, như nhìn qua lớp kính,"
  GeneratePoem_Intro_Rhyming_Mourning_01_B_03:0 "Gió thì thầm lạnh lẽo xuyên qua đồng cỏ,"
  GeneratePoem_Intro_Rhyming_Mourning_02_A_01:0 "Khi dung nhan tuyệt mỹ ấy khuất khỏi tầm mắt,"
  GeneratePoem_Intro_Rhyming_Mourning_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
  GeneratePoem_Intro_Rhyming_Mourning_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_02_A_01$"
  GeneratePoem_Intro_Rhyming_Mourning_02_B_01:0 "Ta gào thét, ta khóc than, mặc cho sức lực còn bao,"
  GeneratePoem_Intro_Rhyming_Mourning_02_B_02:0 "Nỗi đau ấy tựa một sự sỉ nhục cá nhân,"
  GeneratePoem_Intro_Rhyming_Mourning_02_B_03:0 "Kẻ ở lại tất phải mang vết nhơ u ám,"
  GeneratePoem_Intro_Rhyming_Mourning_03_A_01:0 "Ngẫu nhiên thật là một ả tình nhân tàn nhẫn,"
  GeneratePoem_Intro_Rhyming_Mourning_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Mourning_03_A_01$"
  GeneratePoem_Intro_Rhyming_Mourning_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Mourning_03_A_01$"
  GeneratePoem_Intro_Rhyming_Mourning_03_B_01:0 "Cướp khỏi thế gian điệu vũ tuyệt trần ấy,"
  GeneratePoem_Intro_Rhyming_Mourning_03_B_02:0 "Hất [ROOT.Var('poem_subject').Char.GetHerHim] sang một bên không buồn ngoái lại,"
