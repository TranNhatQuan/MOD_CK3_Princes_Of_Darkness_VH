  GeneratePoem_Intro_Rhyming_Legacy_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Legacy_02_A_01$"
  GeneratePoem_Intro_Rhyming_Legacy_02_B_01:0 "Miễn là họ để lại phía sau những tác phẩm,"
  GeneratePoem_Intro_Rhyming_Legacy_02_B_02:0 "Bước sang cõi chết lặng yên với tấm lòng cao cả,"
  GeneratePoem_Intro_Rhyming_Legacy_02_B_03:0 "Dẫu điều đó xé nát trái tim người ở lại,"
  GeneratePoem_Intro_Rhyming_Legacy_03_A_01:0 "Có [ROOT.Var('poem_subject').Char.GetWomanMan] nào không mong được nghỉ ngơi khi đã mệt nhoài,"
