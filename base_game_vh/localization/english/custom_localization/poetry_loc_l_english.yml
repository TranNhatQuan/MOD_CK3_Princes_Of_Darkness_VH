  GeneratePoem_Intro_Rhyming_Legacy_03_B_03:0 "Bao quanh bởi công trình của [ROOT.Var('poem_subject').Char.GetHerHis|U], an hưởng tuổi già?"
 ## Strife
  GeneratePoem_Intro_Rhyming_Strife_01_A_01:0 "Khi chiến tranh lông đỏ tràn đến đất đai của [ROOT.Var('poem_subject').Char.GetHerHis],"
  GeneratePoem_Intro_Rhyming_Strife_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Strife_01_A_01$"
  GeneratePoem_Intro_Rhyming_Strife_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Strife_01_A_01$"
  GeneratePoem_Intro_Rhyming_Strife_01_B_01:0 "Nó sẽ chẳng tìm được đôi tay nào sắc bén hơn,"
  GeneratePoem_Intro_Rhyming_Strife_01_B_02:0 "Ngọn lửa dữ này hẳn chẳng ai ngờ tới,"
  GeneratePoem_Intro_Rhyming_Strife_01_B_03:0 "Sắt thép lóe sáng cùng những mệnh lệnh gào thét,"
  GeneratePoem_Intro_Rhyming_Strife_02_A_01:0 "Khi những [ROOT.Var('poem_subject').Char.GetWomenMen] khác buông lời bạc ngọt,"
  GeneratePoem_Intro_Rhyming_Strife_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Strife_02_A_01$"
  GeneratePoem_Intro_Rhyming_Strife_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Strife_02_A_01$"
  GeneratePoem_Intro_Rhyming_Strife_02_B_01:0 "[ROOT.Var('poem_subject').Char.Custom('GetHeroineHero')] của chúng ta, chính [ROOT.Var('poem_subject').Char.GetHerselfHimself], khoác lên mình giáp sắt"
  GeneratePoem_Intro_Rhyming_Strife_02_B_02:0 "[ROOT.Var('poem_subject').Char.GetSheHe|U] dẫn binh sĩ như đàn thép lạnh,"
  GeneratePoem_Intro_Rhyming_Strife_02_B_03:0 "[ROOT.Var('poem_subject').Char.GetSheHe|U] làm ăn rất khá trong việc diệt trừ lũ cặn bã,"
 ### ^Edward I, bein' a lad.
  GeneratePoem_Intro_Rhyming_Strife_03_A_01:0 "Dẫu xung đột sớm muộn mang phẫn nộ đến muôn người,"
  GeneratePoem_Intro_Rhyming_Strife_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Strife_03_A_01$"
  GeneratePoem_Intro_Rhyming_Strife_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Strife_03_A_01$"
  GeneratePoem_Intro_Rhyming_Strife_03_B_01:0 "Chính thanh gươm của [ROOT.Var('poem_subject').Char.GetWomanMan] này giữ tử thần ngoài rìa,"
  GeneratePoem_Intro_Rhyming_Strife_03_B_02:0 "[ROOT.Var('poem_subject').Char.Custom('GetHeroineHero')] của chúng ta sống để xông pha trận mạc!"
  GeneratePoem_Intro_Rhyming_Strife_03_B_03:0 "Không con mồi nào khốn khổ hơn [ROOT.Var('poem_subject').Char.Custom('GetHeroineHeroPossessive')]!"
 ## Incompetence
  GeneratePoem_Intro_Rhyming_Incompetence_01_A_01:0 "Một [ROOT.Var('poem_subject').Char.GetLadyLord] chẳng là gì nếu thiếu trí tuệ,"
  GeneratePoem_Intro_Rhyming_Incompetence_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Incompetence_01_A_01$"
  GeneratePoem_Intro_Rhyming_Incompetence_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Incompetence_01_A_01$"
  GeneratePoem_Intro_Rhyming_Incompetence_01_B_01:0 "Nếu không, những việc làm của [ROOT.Var('poem_subject').Char.GetHerHis] sẽ không thể đạt được tầm nhìn mà [ROOT.Var('poem_subject').Char.GetHerHis] mong muốn,"
  GeneratePoem_Intro_Rhyming_Incompetence_01_B_02:0 "Đầu óc trống rỗng, chẳng có nổi một ý nghĩ sắc bén,"
  GeneratePoem_Intro_Rhyming_Incompetence_01_B_03:0 "Một trò nhại nhẽo chế giễu, một rạn nứt chực chờ,"
  GeneratePoem_Intro_Rhyming_Incompetence_02_A_01:0 "Có những [ROOT.Var('poem_subject').Char.GetWomenMen] chỉ khiến người khác thấy buồn nôn,"
  GeneratePoem_Intro_Rhyming_Incompetence_02_A_02:0 "$GeneratePoem_Intro_Rhyming_Incompetence_02_A_01$"
  GeneratePoem_Intro_Rhyming_Incompetence_02_A_03:0 "$GeneratePoem_Intro_Rhyming_Incompetence_02_A_01$"
  GeneratePoem_Intro_Rhyming_Incompetence_02_B_01:0 "Dung mạo tệ đến mức ai cũng dễ đem ra giễu cợt,"
  GeneratePoem_Intro_Rhyming_Incompetence_02_B_02:0 "Đường nét vụng về, hơi thở thì khò khè,"
  GeneratePoem_Intro_Rhyming_Incompetence_02_B_03:0 "Đến nỗi chẳng ai xung quanh có thể nói năng tự nhiên,"
  GeneratePoem_Intro_Rhyming_Incompetence_03_A_01:0 "Đôi khi Số Mệnh thật quá tàn nhẫn,"
  GeneratePoem_Intro_Rhyming_Incompetence_03_A_02:0 "$GeneratePoem_Intro_Rhyming_Incompetence_03_A_01$"
  GeneratePoem_Intro_Rhyming_Incompetence_03_A_03:0 "$GeneratePoem_Intro_Rhyming_Incompetence_03_A_01$"
  GeneratePoem_Intro_Rhyming_Incompetence_03_B_01:0 "Đặt cả quý tộc lẫn thứ dân dưới ách cai trị như thế,"
  GeneratePoem_Intro_Rhyming_Incompetence_03_B_02:0 "Để một vương quốc hóa thành vũng bùn thối rữa,"
  GeneratePoem_Intro_Rhyming_Incompetence_03_B_03:0 "Trao vương miện của một [ROOT.Var('poem_subject').Char.GetLadyLord] lên đầu một con lừa,"

 ##################################################
 # Outro Lines
 ## Romance
  GeneratePoem_Outro_Rhyming_Romance_01_A_01:0 "Dẫu biết đâu, có lẽ, [ROOT.Var('poem_subject').Char.GetSheHe] rồi sẽ làm tim ta tan vỡ?"
  GeneratePoem_Outro_Rhyming_Romance_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Romance_01_A_01$"
  GeneratePoem_Outro_Rhyming_Romance_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Romance_01_A_01$"
  GeneratePoem_Outro_Rhyming_Romance_01_B_01:0 "Nhưng vì [ROOT.Var('poem_subject').Char.GetWomanMan] ấy, ta nguyện đặt cược."
  GeneratePoem_Outro_Rhyming_Romance_01_B_02:0 "Ít nhất thì ký ức về [ROOT.Var('poem_subject').Char.GetHerHis], ta sẽ chẳng bao giờ quên."
  GeneratePoem_Outro_Rhyming_Romance_01_B_03:0 "Bởi không dám thử còn là nỗi hối tiếc lớn hơn."
  GeneratePoem_Outro_Rhyming_Romance_02_A_01:0 "Vì đời [ROOT.Var('poem_subject').Char.GetHerHis] chính là đời ta, và là đời chung của chúng ta,"
  GeneratePoem_Outro_Rhyming_Romance_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Romance_02_A_01$"
  GeneratePoem_Outro_Rhyming_Romance_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Romance_02_A_01$"
  GeneratePoem_Outro_Rhyming_Romance_02_B_01:0 "Khởi đầu tươi đẹp của một cây gia phả."
  GeneratePoem_Outro_Rhyming_Romance_02_B_02:0 "Và miễn là ta còn ở bên [ROOT.Var('poem_subject').Char.GetHerHim], ta sẽ mãi được tự do."
  GeneratePoem_Outro_Rhyming_Romance_02_B_03:0 "Ấm áp và khoan khoái như một tách trà nóng thơm lừng."
  GeneratePoem_Outro_Rhyming_Romance_03_A_01:0 "Chỉ nghĩ đến nụ cười của [ROOT.Var('poem_subject').Char.GetHerHis] thôi cũng đủ khiến ta mỉm cười,"
  GeneratePoem_Outro_Rhyming_Romance_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Romance_03_A_01$"
  GeneratePoem_Outro_Rhyming_Romance_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Romance_03_A_01$"
  GeneratePoem_Outro_Rhyming_Romance_03_B_01:0 "Và một khi nụ cười ấy xuất hiện, nó liền ở mãi nơi đó."
  GeneratePoem_Outro_Rhyming_Romance_03_B_02:0 "Khiến tim ta rung động với nhịp đập dồn dập lạ thường."
  GeneratePoem_Outro_Rhyming_Romance_03_B_03:0 "Mọi âu lo, buồn khổ và đau đớn tan biến không dấu vết."
 ## Mourning
  GeneratePoem_Outro_Rhyming_Mourning_01_A_01:0 "Cô độc, trống rỗng, không còn [ROOT.Var('poem_subject').Char.GetWomanMan] ngọt ngào ấy,"
  GeneratePoem_Outro_Rhyming_Mourning_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Mourning_01_A_01$"
  GeneratePoem_Outro_Rhyming_Mourning_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Mourning_01_A_01$"
  GeneratePoem_Outro_Rhyming_Mourning_01_B_01:0 "Trái tim, trí óc, linh hồn chúng ta, tất cả đều bị nguyền rủa..."
  GeneratePoem_Outro_Rhyming_Mourning_01_B_02:0 "Ta lang thang, tự hỏi, nỗi đau bắt đầu từ đâu?"
  GeneratePoem_Outro_Rhyming_Mourning_01_B_03:0 "Ai trong chúng ta sẽ là người tiếp theo khép lại sinh mệnh của [ROOT.Var('poem_subject').Char.GetHerHis]?"
  GeneratePoem_Outro_Rhyming_Mourning_02_A_01:0 "Không có [ROOT.Var('poem_subject').Char.GetHerHim], chúng ta chỉ là những vỏ rỗng,"
  GeneratePoem_Outro_Rhyming_Mourning_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Mourning_02_A_01$"
  GeneratePoem_Outro_Rhyming_Mourning_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Mourning_02_A_01$"
  GeneratePoem_Outro_Rhyming_Mourning_02_B_01:0 "Những trái tim cô đơn giam mình trong từng ngục thất riêng..."
  GeneratePoem_Outro_Rhyming_Mourning_02_B_02:0 "Khổ đau mục rữa, trái tim ta nổi loạn."
  GeneratePoem_Outro_Rhyming_Mourning_02_B_03:0 "Mỗi người trong chúng ta là một xác chết nhỏ bé, rỗng tuếch, song song."
  GeneratePoem_Outro_Rhyming_Mourning_03_A_01:0 "Khi một kẻ vĩ đại ngã xuống quá sâu,"
  GeneratePoem_Outro_Rhyming_Mourning_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Mourning_03_A_01$"
  GeneratePoem_Outro_Rhyming_Mourning_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Mourning_03_A_01$"
  GeneratePoem_Outro_Rhyming_Mourning_03_B_01:0 "Hiếm ai có thể thoát thân, huống chi là không mang sẹo."
  GeneratePoem_Outro_Rhyming_Mourning_03_B_02:0 "Chẳng phải những trò đùa tàn nhẫn của Số Mệnh thật quá quái đản sao?"
  GeneratePoem_Outro_Rhyming_Mourning_03_B_03:0 "Mọi cuộc đời, mọi toan tính, đều dang dở."
 ## Legacy
  GeneratePoem_Outro_Rhyming_Legacy_01_A_01:0 "Và chỉ còn biết trông mong vào ân huệ của ký ức,"
  GeneratePoem_Outro_Rhyming_Legacy_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Legacy_01_A_01$"
  GeneratePoem_Outro_Rhyming_Legacy_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Legacy_01_A_01$"
  GeneratePoem_Outro_Rhyming_Legacy_01_B_01:0 "Thời chinh phạt của họ khép lại, nhanh chóng..."
  GeneratePoem_Outro_Rhyming_Legacy_01_B_02:0 "Để lịch sử tìm được vị trí xứng đáng của họ..."
  GeneratePoem_Outro_Rhyming_Legacy_01_B_03:0 "Để cả thế gian còn nhớ đến gương mặt ấy!"
  GeneratePoem_Outro_Rhyming_Legacy_02_A_01:0 "Thật hiếm hoi khi [ROOT.Var('poem_subject').Char.GetWomenMen] chịu thừa nhận,"
  GeneratePoem_Outro_Rhyming_Legacy_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Legacy_02_A_01$"
  GeneratePoem_Outro_Rhyming_Legacy_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Legacy_02_A_01$"
  GeneratePoem_Outro_Rhyming_Legacy_02_B_01:0 "Rằng tất cả những gì họ để lại chỉ là đống rác rưởi."
  GeneratePoem_Outro_Rhyming_Legacy_02_B_02:0 "Rằng hành động của họ khiến người ở lại tan tác."
  GeneratePoem_Outro_Rhyming_Legacy_02_B_03:0 "Rằng nếu có cơ hội, họ đã thay đổi rất nhiều."
  GeneratePoem_Outro_Rhyming_Legacy_03_A_01:0 "Và khi giờ phút cuối cùng cận kề,"
  GeneratePoem_Outro_Rhyming_Legacy_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Legacy_03_A_01$"
  GeneratePoem_Outro_Rhyming_Legacy_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Legacy_03_A_01$"
  GeneratePoem_Outro_Rhyming_Legacy_03_B_01:0 "Liệu họ có hy vọng rằng tên mình sẽ được reo hò?"
  GeneratePoem_Outro_Rhyming_Legacy_03_B_02:0 "Tên họ sống mãi trên môi của đồng liêu..."
  GeneratePoem_Outro_Rhyming_Legacy_03_B_03:0 "Hay tự hỏi liệu cuộc đời có vọng lại qua năm tháng?"
 ## Strife
  GeneratePoem_Outro_Rhyming_Strife_01_A_01:0 "[ROOT.Var('poem_subject').Char.GetHerHis|U] thần dân tỏ ra biết ơn, bởi nếu không,"
  GeneratePoem_Outro_Rhyming_Strife_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Strife_01_A_01$"
  GeneratePoem_Outro_Rhyming_Strife_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Strife_01_A_01$"
  GeneratePoem_Outro_Rhyming_Strife_01_B_01:0 "Thì ngay trước cửa nhà họ sẽ là thanh gươm của [ROOT.Var('poem_subject').Char.GetHerHis]."
  GeneratePoem_Outro_Rhyming_Strife_01_B_02:0 "Rồi họ sẽ học được cách một đế chế được tạo nên."
  GeneratePoem_Outro_Rhyming_Strife_01_B_03:0 "Sớm thôi họ sẽ biết mình đã đứng về phía nào."
  GeneratePoem_Outro_Rhyming_Strife_02_A_01:0 "Rồi tất cả sẽ run rẩy khi [ROOT.Var('poem_subject').Char.GetSheHe] bước ra chiến địa,"
  GeneratePoem_Outro_Rhyming_Strife_02_A_02:0 "$GeneratePoem_Outro_Rhyming_Strife_02_A_01$"
  GeneratePoem_Outro_Rhyming_Strife_02_A_03:0 "$GeneratePoem_Outro_Rhyming_Strife_02_A_01$"
  GeneratePoem_Outro_Rhyming_Strife_02_B_01:0 "Và cho kẻ thù thấy rằng chẳng có tấm khiên nào đủ dày."
  GeneratePoem_Outro_Rhyming_Strife_02_B_02:0 "Chỉ toàn lửa giận, cuồng nộ và sấm sét được tung ra."
  GeneratePoem_Outro_Rhyming_Strife_02_B_03:0 "Những nhát chém gặt mạng của [ROOT.Var('poem_subject').Char.GetHerHis|U], tàn khốc đến không thể hàn gắn."
  GeneratePoem_Outro_Rhyming_Strife_03_A_01:0 "Vậy chớ ai thách thức ý chí táo bạo của [ROOT.Var('poem_subject').Char.GetHerHis],"
  GeneratePoem_Outro_Rhyming_Strife_03_A_02:0 "$GeneratePoem_Outro_Rhyming_Strife_03_A_01$"
  GeneratePoem_Outro_Rhyming_Strife_03_A_03:0 "$GeneratePoem_Outro_Rhyming_Strife_03_A_01$"
  GeneratePoem_Outro_Rhyming_Strife_03_B_01:0 "Kẻo họ sẽ phát hiện kẻ thách thức trước đã đi về đâu."
  GeneratePoem_Outro_Rhyming_Strife_03_B_02:0 "Trừ phi họ mong được tiễn sang thế giới bên kia."
  GeneratePoem_Outro_Rhyming_Strife_03_B_03:0 "Bằng không, cơn thịnh nộ khủng khiếp sẽ xé nát thân xác họ."
 ## Incompetence
  GeneratePoem_Outro_Rhyming_Incompetence_01_A_01:0 "Ôi những số phận tàn nhẫn mà Định Mệnh ban phát,"
  GeneratePoem_Outro_Rhyming_Incompetence_01_A_02:0 "$GeneratePoem_Outro_Rhyming_Incompetence_01_A_01$"
  GeneratePoem_Outro_Rhyming_Incompetence_01_A_03:0 "$GeneratePoem_Outro_Rhyming_Incompetence_01_A_01$"
  GeneratePoem_Outro_Rhyming_Incompetence_01_B_01:0 "Khi một kẻ ngu độn lại nắm trong tay quyền lực lớn đến vậy?"
  GeneratePoem_Outro_Rhyming_Incompetence_01_B_02:0 "Khi thế gian cho phép sự ngu xuẩn mọc mầm?"
  GeneratePoem_Outro_Rhyming_Incompetence_01_B_03:0 "Khi tất cả buộc phải chứng kiến một kẻ đốn mạt khủng khiếp như thế?"
  GeneratePoem_Outro_Rhyming_Incompetence_02_A_01:0 "Khi một [ROOT.Var('poem_subject').Char.GetWomanMan] như vậy tồn tại,"
