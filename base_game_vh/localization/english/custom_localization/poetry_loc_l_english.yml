 ## Legacy
  GeneratePoem_Intro_Rhyming_Legacy_01_A_01:0 "Ngay cả [ROOT.Var('poem_subject').Char.GetWomenMen] hùng mạnh nhất cũng phải rời cõi trần,"
  GeneratePoem_Intro_Rhyming_Legacy_01_A_02:0 "$GeneratePoem_Intro_Rhyming_Legacy_01_A_01$"
  GeneratePoem_Intro_Rhyming_Legacy_01_A_03:0 "$GeneratePoem_Intro_Rhyming_Legacy_01_A_01$"
  GeneratePoem_Intro_Rhyming_Legacy_01_B_01:0 "Chiến công, hành trạng, danh giá phình to,"
  GeneratePoem_Intro_Rhyming_Legacy_01_B_02:0 "Và lời ca ngợi tốt đẹp chẳng hề khan hiếm,"
  GeneratePoem_Intro_Rhyming_Legacy_01_B_03:0 "Dẫu họ đã khai sinh bao nhiêu cõi giới,"
  GeneratePoem_Intro_Rhyming_Legacy_02_A_01:0 "[ROOT.Var('poem_subject').Char.GetWomenMen|U] chẳng cần sợ hãi khi sinh mệnh lìa tan,"
