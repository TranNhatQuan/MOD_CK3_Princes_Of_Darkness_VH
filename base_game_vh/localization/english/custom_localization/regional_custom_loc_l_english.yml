  trickster_spirit_germania: "[Glossary( 'kobold', 'KOBOLD_GLOSS' )]"
  KOBOLD_GLOSS: "Một linh hồn gia cư trong dân gian Đức, lúc giúp việc nhà, lúc bày trò quái ác khi bị xúc phạm."
  
  trickster_spirit_netherlands: "[Glossary( 'kabouter', 'KABOUTER_GLOSS' )]"
  KABOUTER_GLOSS: "Sinh vật giống người lùn trong truyền thuyết Hà Lan, thường giúp việc hoặc trêu chọc khi bị coi thường."
  
  trickster_spirit_francia: "[Glossary( 'lutin', 'LUTIN_GLOSS' )]"
  LUTIN_GLOSS: "Một linh hồn nhỏ trong nhà hoặc rừng của dân gian Pháp, nổi tiếng với trò nghịch như rối tóc hay giấu đồ."
  
  trickster_spirit_iberia: "[Glossary( 'duende', 'DUENDE_GLOSS' )]"
