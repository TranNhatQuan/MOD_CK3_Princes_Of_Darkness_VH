  friendship_metaphor_with_tending_martial_1:0 "Tình bạn giống như huynh đệ vào sinh ra tử; phải luôn rèn luyện để không lạc nhịp"
  friendship_metaphor_with_tending_intrigue_1:0 "Tình bạn là sự trao đổi bí mật những thông điệp; một mật mã không đổi theo thời gian rồi cũng sẽ bị phá"
  friendship_metaphor_with_tending_stewardship_1:0 "Tình bạn là một khu vườn; nó cần được tưới nước và chăm sóc thường xuyên"
  friendship_metaphor_with_tending_diplomacy_1:0 "Tình bạn là một cuộc thương lượng; cả hai bên đều phải cảm thấy mình nhận được điều xứng đáng"
  friendship_metaphor_with_tending_learning_1:0 "Tình bạn là cuộc tranh luận giữa những kẻ ngang hàng; nếu chỉ một phía tham gia thì nó sẽ tan vỡ"
