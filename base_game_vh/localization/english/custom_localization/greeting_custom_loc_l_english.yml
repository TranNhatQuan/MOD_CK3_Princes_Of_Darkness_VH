  greeting_supplimentary.negative.tales:0 "Những câu chuyện về hành vi xấu xa của ngươi được truyền tụng từ Ireland đến Cathay."
  greeting_supplimentary.negative.greek:0 "Nhân cách thấp hèn của ngươi đã trở thành đề tài cho các vở kịch Hy Lạp."
  greeting_supplimentary.negative.insult.1:0 "Cầu cho thể dịch của ngươi mục rữa ngay trong thân xác còn sống."
  greeting_supplimentary.negative.insult.2:0 "Cầu cho những năm tháng của ngươi ngắn ngủi và khốn khổ."
  greeting_supplimentary.negative.insult.3:0 "Cầu cho trí tuệ mãi mãi lẩn tránh ngươi."
  greeting_supplimentary.negative.insult_muslim.1:0 "Nguyền rủa đến tổ tiên bảy đời của ngươi."
  greeting_supplimentary.negative.insult_muslim.2:0 "Cầu cho ngươi bị khâu sống trong bụng một con lạc đà chết."
  greeting_supplimentary.negative.insult_muslim.3:0 "Cầu cho Allah hủy diệt gia tộc của ngươi."
  greeting_supplimentary.negative.insult_muslim.4:0 "Đồ con của một con chó ghẻ."

  greeting_supplimentary.positive:0 "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
  greeting_supplimentary.positive.flattery.1:0 "Phúc lành giáng xuống ngài và gia tộc của ngài."
  greeting_supplimentary.positive.flattery.2:0 "Sự thông tuệ và lòng nhân từ của ngài đã trở thành huyền thoại."
  greeting_supplimentary.positive.flattery.3:0 "Bình an ở cùng ngài."
  greeting_supplimentary.positive.flattery.4:0 "Cầu cho ngài sống trong hòa hợp và mãn nguyện."
  greeting_supplimentary.positive.flattery.5:0 "Sự tàn nhẫn của ngài khiến người khác phải ngưỡng mộ."
  greeting_supplimentary.positive.flattery.6:0 "Những ham muốn lớn lao của ngài được ca tụng khắp thiên hạ."

