l_english: 
 unify_region_decision: "Thống Nhất Vùng Thủ Đô"
 unify_region_decision_desc: "Thống nhất toàn thể dân chúng trong #EMP lãnh vực của ta#! là một sự nghiệp chính đáng và cao quý!"
 unify_region_decision_tooltip: "Củng cố quyền kiểm soát của Ngài đối với vùng thủ đô"
 unify_region_decision_confirm: "Thống Nhất Vùng"
 tutorial_event_prefix: "Mục Tiêu của Lãnh Chúa:"
 tutorial.1001.t: "$tutorial_event_prefix$ $unify_region_decision$"
 tutorial.1001.desc: "[councillor.GetName] bắt gặp ta trong [ROOT.Char.Custom('GetCourtyard')]:\n\n\"[councillor.Custom2('AppropriateGreetingPositive', ROOT.Char)] ngài đã làm rạng danh muôn dân trong lãnh địa của chúng ta.\" [councillor.GetSheHe|U] bắt đầu tâng bốc ta, rõ ràng mong cầu điều gì đó đáp lại.\n\n\"Ngài đã từng nghĩ tới việc cai trị toàn bộ vùng [region.GetName] chưa? Ta có kế hoạch, những kế hoạch vĩ đại!\""
 tutorial.1001.a: "Phải, hãy dẫn dắt ta, [councillor.GetNameNoTooltip]!"
 opted_into_tutorial_objectives_tt: "#EMP Tham gia Mục Tiêu Lãnh Chúa#!"
 enable_unify_region_decision_tt: "Mở khóa [decision|E] [GetDecisionWithKey('unify_region_decision').GetName]"
 tutorial.1001.b: "Có phải [councillor.GetSheHe] say rượu rồi không? Ta không cần sự giúp đỡ của [councillor.GetHerHis]."
 tutorial.1002.t: "$tutorial_event_prefix$ Chinh Phục Vùng Đất"
 tutorial.1002.desc: "Khi ngồi trên ngai vàng, ta nhìn qua khung cửa sổ, hướng mắt về phương xa, như thể có thể trông thấy toàn bộ lãnh thổ của ta trong [region.GetName] — và chúng thật rộng lớn."
 tutorial.1002.desc_alive: "Ta cho gọi [councillor.GetName].\n\n\"Chúng ta đã làm được, [councillor.GetFirstNameNoTooltip], nhưng ta vẫn không thể tin nổi! Những kế hoạch đầy tham vọng của ngươi #EMP quả thật#! đã thành công.\" Ta bật khỏi ngai vàng để ôm lấy [councillor.GetHerHim].\n\n\"Ta luôn biết ngài có thể làm được!\" [councillor.GetFirstNameNoTooltip] nói, ôm lấy ta. \"Chúng ta đã làm điều đó vì dân chúng.\""
 tutorial.1002.desc_dead: "\n\nTên khốn [councillor.GetName] đó, những kế hoạch đầy tham vọng của [councillor.GetHerHis] #EMP quả thật#! đã thành công."
 tutorial.1002.a: "Ước gì [councillor.GetNameNoTooltip] có thể chứng kiến điều này."
 tutorial.1002.a_councillor: "Đúng vậy, chúng ta đã làm điều đó vì họ!"
 ruler_objective_region_conquered_modifier: "Con Dân Bản Thổ"
 ruler_objective_region_conquered_modifier_desc: "Triều đại này đã đạt được ảnh hưởng áp đảo tại quê hương của mình và hướng tới việc cai trị nơi đây trong nhiều thế kỷ."
 EVENT_WINDOW_OPTION_AVAILABLE_RULER_OBJECTIVES: "Lựa chọn này khả dụng nhờ các mục tiêu lãnh chúa đang hoạt động"
 custom_ireland_development_growth: "$MOD_MONTHLY_DEVELOPMENT_GROWTH_FACTOR$ tại [GetGeographicalRegion('custom_ireland').GetName] [region|E]"

 # Dev. only advice example loc
 hint_dev_example_summary: "#D Tóm tắt ngắn gọn lời khuyên #!"
 hint_dev_example_description: "#D Mô tả chi tiết hơn về điều người chơi nên làm, hoặc có thể đang làm, và quan trọng nhất là lý do vì sao.#!"

 hint_summary_get_succession: "Giành [title.GetNameNoTier] thông qua kế vị"
 hint_murder_successors: "Ám sát những người đứng trước Ngài hoặc con Ngài trong hàng thừa kế"
 hint_marry_into_succession: "Dùng #HIGH $arrange_marriage_interaction$#! [character_interaction|E] để sắp đặt hôn nhân giữa [holder.GetName] hoặc [holder.GetHerHis] [heirs|E] với Ngài hay [dynasty_members|E] của Ngài, để con cái của họ sẽ thừa kế [title|E] trong tương lai.\n\n#help Hãy chú ý tới [succession_laws|E] của [title.GetName] và tùy chọn [matrilineal|E] [marriage|E] trong #HIGH $arrange_marriage_interaction$#! để đảm bảo tước vị được thừa kế bởi con cháu thuộc triều đại của Ngài. Sau khi đứa trẻ ra đời, Ngài có thể đẩy nhanh việc thừa kế bằng cách dùng #HIGH $start_murder_interaction$#! [scheme|E] với mọi người đứng trước con Ngài trong hàng kế vị.#!"
 hint_summary_get_title: "Tạo tước vị de jure của [title.GetNameNoTier]"
 hint_summary_fabricate_claim: "Làm giả yêu sách đối với [title.GetNameNoTier]"
 hint_summary_ask_for_claim: "Xin yêu sách đối với [title.GetNameNoTier]"
 hint_claim_benefits: "\n\nSở hữu một yêu sách sẽ mở khóa #HIGH Casus Belli Yêu Sách#! cho phép Ngài chiếm [title.GetName] thông qua chiến tranh."
 hint_ask_for_claim: "Dùng #HIGH $hof_ask_for_claim_interaction$#! [character_interaction|E] với [head_of_faith|E] của Ngài là [hof.GetFullName] để trả [piety|E] đổi lấy một [claim|E] đối với [title|E] này.\n\n#help Đây sẽ là [pressed_claim|E], vì vậy con cái Ngài sẽ thừa kế yêu sách và có thể sử dụng cùng casus belli.$hint_claim_benefits$#!"
 hint_fabricate_claim: "Làm giả một [claim|E] bằng cách dùng nhiệm vụ #HIGH $task_fabricate_claim$#! [councillor_task|E] của [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [chaplain.GetFirstNamePossessive].\n\n#help [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] có [learning_skill|E] càng cao thì càng có cơ hội thành công với [title_duchy.GetName]. Đây sẽ luôn là [unpressed_claim|E], nên con cái Ngài sẽ không thừa kế — Ngài phải hành động nhanh chóng. $hint_claim_benefits$#!"
 hint_summary_get_war: "Chinh phục [title.GetNameNoTier] bằng chiến tranh"
 hint_declare_war_intro: "Tuyên bố [war|E] bằng #HIGH [cb.GetName]#! [casus_belli|E]. Thắng cuộc chiến sẽ"
 hint_declare_war_outro: "\n\n#help Hãy xem xét [alliances|E], [levies|E], [knights|E] và [men_at_arms|E] của [holder.GetName] và so sánh với lực lượng của Ngài để đảm bảo chiến thắng.#!"
 hint_conquest_war: "$hint_declare_war_intro$ trao [title.GetName] vào [domain|E] của Ngài. $hint_declare_war_outro$"
 hint_create_title: "Tạo một [title|E] [de_jure|E] cao hơn: [de_jure_title.GetName].\n\n#help Điều này sẽ mở khóa [casus_bellis|E] [de_jure|E] hoặc tăng khả năng chấp thuận của #HIGH $offer_vassalization_interaction$#! [character_interaction|E].#!"
 hint_summary_conquer_vassal: "Buộc [holder.GetTitledFirstName] trở thành chư hầu của Ngài"
 hint_summary_offer_vassal: "Yêu cầu [holder.GetTitledFirstName] trở thành chư hầu"
 hint_offer_vassalization: "Hòa bình [vassalize|E] bằng #HIGH $offer_vassalization_interaction$#! [character_interaction|E].\n\n#help Điều này sẽ khiến [holder.GetTitledFirstName] trở thành [vassal|E] của Ngài."
 hint_vassalization_war: "$hint_declare_war_intro$ trao cho Ngài [holder.GetName] như một [vassal|E]. $hint_declare_war_outro$"
 hint_summary_help_offer_vassal: "Cải thiện quan hệ với [holder.GetTitledFirstName] thông qua mưu kế"
 hint_help_offer_vassalization:  "Dùng #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! hoặc #HIGH $seduce_interaction$#! [character_interaction|E] với [holder.GetName] để cải thiện [opinion|E] của họ về Ngài.\n\n#help Điều này sẽ khiến [holder.GetTitledFirstNameNoTooltip] dễ chấp nhận #HIGH $offer_vassalization_interaction$#! [character_interaction|E] hơn.$hint_opinion_schemes_benefits$#!"
 hint_summary_help_offer_vassal_interactions: "Cải thiện quan hệ với [holder.GetTitledFirstName] thông qua tương tác"
 hint_help_offer_vassalization_interactions: "Dùng #HIGH $gift_interaction$#!, #HIGH $offer_ward_interaction$#! hoặc #HIGH $gift_artifact_interaction$#! [character_interaction|E] với [holder.GetName] để cải thiện [opinion|E] của họ về Ngài.\n\n#help Điều này sẽ khiến [holder.GetTitledFirstNameNoTooltip] dễ chấp nhận #HIGH $offer_vassalization_interaction$#! [character_interaction|E] hơn. $hint_opinion_interaction_benefits$#!"
 hint_summary_murder_top_liege:  "Ám sát [holder.GetTitledFirstName]"
 hint_murder_top_liege: "Dùng #HIGH $start_murder_interaction$#! [character_interaction|E] với [holder.GetName] để giết họ.\n\n#help Điều này sẽ khiến [title.GetName] được thừa kế bởi [title_heir.GetName]. Các tân quân chủ thường có vương quốc yếu hơn do lãnh địa bị chia tách giữa các [heirs|E] hoặc vì hình phạt [short_reign|E] làm giảm [opinion|E] của chư hầu, từ đó giảm [taxes|E] và [levies|E].#!"
 hint_summary_get_knights: "Chiêu mộ [ROOT.Char.Custom('KnightCulturePluralNoTooltip')]"
 hint_get_knights: "Dùng [GetDecisionWithKey('invite_knights_decision').GetName] [decision|E] để thu hút [guests|E] mới và tuyển họ làm [knights|E] bằng #HIGH $recruit_guest_interaction$#! [character_interaction|E].\n\nDùng #HIGH $invite_to_court_interaction$#! [character_interaction|E] với nhân vật [unlanded|E] có [prowess|E] cao trong [courts|E] của các [rulers|E] khác.\n\nDùng #HIGH $arrange_marriage_interaction$#! để gả [courtiers|E] của Ngài cho những nhân vật không đất đai có chỉ số dũng mãnh cao.\n\n#help Tùy theo [martial_custom|E], Ngài có thể cần [matrilineal|E] hôn nhân để họ đến [court|E] của Ngài. Hãy dùng công cụ tìm nhân vật và sắp xếp theo Prowess.#!"
 hint_summary_marry_allies: "Kết hôn với các quân chủ hùng mạnh"
 hint_marry_allies: "Dùng #HIGH $arrange_marriage_interaction$#! [character_interaction|E] để [marry|E] bản thân hoặc [close_family|E] của Ngài với các [rulers|E] có sức mạnh quân sự cao nhằm đạt được [alliances|E] hùng mạnh (sắp xếp theo: Alliance Power).$hint_allies_benefits$"
 hint_summary_perk_negotiate_allies: "Nhận đặc quyền $defensive_negotiations_perk_name$"
 hint_allies_benefits: "\n\n#help Khi đang [war|E] với [holder.GetName], dùng #HIGH $call_ally_interaction$#! [character_interaction|E] để triệu gọi Đồng Minh tham chiến.#!"
 hint_perk_negotiate_allies: "Chọn [diplomacy_lifestyle|E] và tích lũy đủ [experience|E] để mở khóa [GetPerk('defensive_negotiations_perk').GetName(GetPlayer)] [perk|E].\n\n#help Điều này sẽ mở khóa #HIGH $perk_alliance_interaction$#! cho phép Ngài [ally|E] với [rulers|E] mà không cần [marrying|E].$hint_allies_benefits$#!"
 hint_summary_negotiate_allies: "Thương thuyết liên minh"
 hint_negotiate_allies: "Dùng #HIGH $perk_alliance_interaction$#! để [ally|E] với một [ruler|E] mà không cần [marrying|E].$hint_allies_benefits$"
 hint_summary_help_ask_for_claim_interactions: "Cải thiện quan điểm của [hof.GetTitledFirstName] bằng tương tác"
 hint_help_help_ask_for_claim_interactions: "Dùng #HIGH $gift_interaction$#!, #HIGH $seek_indulgences_interaction$#!, #HIGH $offer_ward_interaction$#! hoặc #HIGH $gift_artifact_interaction$#! với [hof.GetName] để cải thiện [opinion|E].\n\n#help Điều này sẽ khiến [hof.GetTitledFirstNameNoTooltip] dễ chấp nhận #HIGH $hof_ask_for_claim_interaction$#! hơn.\n\n#HIGH $seek_indulgences_interaction$#! và $hint_opinion_interaction_benefits$#!"
 hint_opinion_interaction_benefits: "#HIGH $gift_interaction$#! luôn có thể dùng nếu Ngài có đủ [gold_i][gold|E]. #HIGH $offer_ward_interaction$#! chỉ dùng khi Ngài có [child|E] chưa trưởng thành chưa có [guardian|E]. #HIGH $gift_artifact_interaction$#! chỉ dùng khi Ngài có [artifact|E]."
 hint_summary_help_ask_for_claim: "Cải thiện quan điểm của [hof.GetTitledFirstName] bằng mưu kế"
 hint_help_help_ask_for_claim: "Dùng #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! hoặc #HIGH $seduce_interaction$#! với [hof.GetName] để cải thiện [opinion|E].\n\n#help Điều này sẽ khiến [hof.GetTitledFirstNameNoTooltip] dễ chấp nhận #HIGH $hof_ask_for_claim_interaction$#! hơn.$hint_opinion_schemes_benefits$#!"
 hint_opinion_schemes_benefits: "\n\n#HIGH $sway_interaction$#! luôn có thể dùng với bất kỳ ai trong [diplomatic_range|E]. #HIGH $befriend_interaction$#! chỉ dùng nếu Ngài có [GetPerk('befriend_perk').GetName(GetPlayer)] [perk|E] hoặc [GetCultureTradition('tradition_fp2_ritualised_friendship').GetName] [tradition|E]. #HIGH $seduce_interaction$#! chỉ dùng nếu có [sexuality|E] tương thích."
 hint_summary_recruit_maa: "Tuyển Mãnh Binh"
 hint_recruit_maa: "Sử dụng [gold_i][gold|E] để tạo ra các [regiments|E] [men_at_arms|E] được trang bị tốt và huấn luyện bài bản để củng cố [army|E] của bạn. Hãy đến cửa sổ quân sự và chọn một loại [men_at_arms|E].\n\n#help Chọn loại quân dựa trên việc cái nào là [counter|E] tốt nhất đối với [men_at_arms|E] của [holder.GetNamePossessive]. Bạn có thể thấy điều đó trong cửa sổ nhân vật của [holder.GetHerHis] dưới phần chú thích sức mạnh quân sự.#!"
 hint_summary_recruit_mercenaries: "Thuê Lính Đánh Thuê"
 hint_recruit_mercenaries: "Sử dụng [gold_i][gold|E] để tuyển mộ [mercenaries|E] nhằm củng cố [army|E] của bạn. Hãy đến cửa sổ quân sự và chọn thẻ lính đánh thuê.\n\n#help [mercenaries|E] sẽ làm việc cho bạn dựa trên một [mercenary_contract|E] trong 3 năm. Bạn có thể gia hạn thêm 3 năm bất cứ lúc nào bằng cách trả cùng một số lượng vàng khi thuê.\n\nChọn loại quân dựa trên lượng [gold|E] bạn có (bạn có thể rơi vào [debt|E] để thuê họ, tuy nhiên nợ nần làm giảm [advantage|E] và chặn việc bổ sung [men_at_arms|E]) và loại nào là [counter|E] tốt nhất đối với [men_at_arms|E] của [holder.GetNamePossessive]. Bạn có thể thấy điều đó trong cửa sổ nhân vật của [holder.GetHerHis] dưới phần chú thích sức mạnh quân sự.#!"
 hint_summary_take_decision: "Hoàn Thành Mục Tiêu Lãnh Chúa"
 hint_take_decision: "Ngài đã đáp ứng mọi điều kiện của [GetDecisionWithKey('unify_region_decision').GetName] [decision|E], hãy thực hiện nó để hoàn thành Mục Tiêu Lãnh Chúa."

 advice_become_house_head_summary: "Trở thành [house_head|E] của Gia Tộc"
 advice_become_house_head_description: "[house_head|E] thường giữ vai trò đó suốt đời. Dù việc tàn sát gia tộc luôn là một lựa chọn, đôi khi lập một chi nhánh mới sẽ nhanh hơn.\n\n#help $EFFECT_LIST_BULLET$ Mở '$DECISIONS_AND_CONTRACTS_BUTTON$'.\n$EFFECT_LIST_BULLET$ Trong '#S $DECISIONS_VIEW_MAJOR_DECISIONS$#!' Ngài sẽ thấy quyết định '#S $create_cadet_branch_decision$#!'#!"
