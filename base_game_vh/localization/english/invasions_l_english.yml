l_english:
  almohad.1001.t:0 "Sự Trỗi Dậy của Almohads"
  almohad.1001.desc:0 "Có vẻ như một tín ngưỡng bên lề đang dần bén rễ tại [almohad_county.GetName]. Phong trào tôn giáo này tự gọi mình là Almohads, và rao giảng về việc cần thanh tẩy Maghreb khỏi những kẻ dị giáo và lầm lạc.\n\nCác quan chức địa phương tỏ ra lo ngại, nhưng chắc hẳn một nhóm tôn giáo nhỏ lẻ do một nhà thần học thất sủng lãnh đạo thì có gì đáng phải bận tâm?"
  almohad.1001.a:0 "Sao chuyện này lại đáng để ta quan tâm?"
  almohad.1001.a.flavor:0 "Từ bao giờ một giáo phái nhỏ ở tỉnh lẻ lại gây rắc rối cho ai chứ?"
  almohad.1001.b:0 "Hãy nhổ tận gốc trước khi nó thực sự bén rễ..."
  almohad.1001.b.conversion_tt:0 "Nếu Ngài đang cải đạo đức tin tại [almohad_county.GetName], tiến trình có thể bị mất nếu chọn tùy chọn này!"
  almohad.1001.player_warning:0 "@warning_icon! #X Nếu không cải đạo [almohad_county.GetNameNoTier] khỏi [masmudi.GetName] đủ nhanh, sự trỗi dậy của Almohads sẽ xảy ra. Hãy chuẩn bị sẵn sàng.#!"

  almohad.1002.desc:0 "Phong trào tôn giáo Almohad đã từ căn cứ điểm tiến ra, quyết tâm \"giải phóng Maghreb khỏi những kẻ vô thần\" bằng thanh gươm và ngọn giáo!\n\nLãnh tụ của họ, [ibn_tumart.GetTitledFirstName], vốn từng bị xua đuổi khỏi nhiều học viện vì bản tính cứng nhắc, nhưng nay kẻ đó đã tập hợp được một lực lượng trung thành và tự xưng là Mahdi!"
  almohad.1002.a:0 "Tên [ibn_tumart.GetFaith.PriestNeuter] hèn mọn này mà cũng là mối đe dọa sao!"
  almohad.1002.a.target.tt:0 "Almohads tuyên chiến với Ngài!"
  almohad.1002.a.not_target.tt:0 "Almohads tuyên chiến với lãnh chúa của Ngài!"
  almohad.1002.b:0 "Thực ra, [ibn_tumart.GetSheHe|U] cũng có vài điểm rất xác đáng."
  almohad.1002.b.flavor:0 "Ta khó có thể tự nhận mình là một tín đồ xứng đáng..."

  almohad.1003.desc:0 "Người sáng lập phái Almohad, [ibn_tumart.GetTitledFirstName], đã qua đời, cứ ngỡ phong trào ấy sẽ theo kẻ đó vào dĩ vãng. Nhưng thật đáng tiếc, không được như ý nguyện.\n\nMột thủ lĩnh mới đã xuất hiện! [al_mumin.GetTitledFirstName] không chỉ giữ vững được lòng quân, mà còn thu hút thêm #EMP muôn vàn#! tín đồ dưới ngọn cờ của mình!"
  almohad.1003.a:0 "Bọn cuồng tín này chẳng bao giờ dừng lại!"
  almohad.1003.a.tt:0 "Almohads quay trở lại, mạnh mẽ hơn bao giờ hết."

  almohad.1004.t:0 "Kiểm Soát Marrakesh"
  almohad.1004.desc:0 "Từng được xây dựng làm kinh đô đế chế, [marrakesh.GetTitle] giờ đã nằm dưới quyền kiểm soát của ta, đúng như lẽ phải. Tuy nhiên, nơi đây vẫn mang đậm ảnh hưởng của [old_faith.GetAdjective], và những người [masmudi.GetName] của ta nóng lòng muốn tái tạo nó theo hình ảnh của ta.\n\nThật đáng tiếc khi phải phá hủy biết bao cung điện và đền đài vẫn còn nguyên vẹn, nhưng điều đó có thể là cần thiết để thực hiện tham vọng mang ánh sáng khai hóa đến Maghreb."
  almohad.1004.a:0 "Chúng ta sẽ biến nơi này thành thủ đô mới mang đậm bản sắc [masmudi.GetAdjective]!"
  almohad.1004.b:0 "Hãy xây dựng một thành phố mới, còn vĩ đại hơn nữa!"
  almohad.1004.c:0 "Có lẽ đây không phải là quyết định sáng suốt..."
