  dlc_001:0 "$DLC001_PREORDER$"
  dlc_001_desc:0 "Đắm mình vào Đế chế La Mã Thần thánh với bộ sưu tập trang phục dành cho thường dân, chiến binh và các nhà cai trị Trung Âu."
  dlc_002:0 "$DLC002_SP_DAY1$"
  dlc_002_desc:0 "Mang đến cho triều đình của Ngài diện mạo mới đầy phong cách với bộ trang phục và tùy chọn ngoại hình dành cho Trung Đông và Bắc Phi."
  dlc_003:0 "$DLC003_FP1$"
  dlc_003_desc:0 "Những kẻ cướp biển hung tợn từ phương Bắc giá lạnh hay một xã hội phức tạp với các nhà thám hiểm, thương nhân và thi sĩ quả cảm? Khám phá sự phong phú thực sự của thế giới Bắc Âu trong Crusader Kings III: Northern Lords."
  dlc_004:0 "$DLC004_EP1$"
  dlc_004_desc:0 "Bản mở rộng Triều đình Hoàng gia bổ sung nhiều cách mới để tương tác với các nhân vật trong vương quốc hoặc đế chế của Ngài, cùng những thay đổi lớn đối với hệ thống văn hóa."
  dlc_005:0 "$DLC005_FP2$"
  dlc_005_desc:0 "Vùng đất Iberia rực nắng đang chờ đón sự cai trị huy hoàng của Ngài. Định mệnh trung cổ của bán đảo giàu lịch sử và văn hóa này nằm trong tay Ngài."
  dlc_006:0 "$DLC006_BP1$"
  dlc_006_desc:0 "Hãy cẩn trọng, thưa bệ hạ — Bạn Bè và kẻ thù chỉ là hai mặt của cùng một đồng xu. Trong Friends & Foes, các mối quan hệ của Ngài trở nên quan trọng hơn bao giờ hết."
  dlc_007:0 "$DLC007_EP2$"
  dlc_007_desc:0 "Viết lại lịch sử khi Ngài du hành qua những vùng đất trung cổ hiểm nguy và giành vinh quang từ các Đại hội, Đại hôn lễ và Đại du hành."
  dlc_008:0 "$DLC008_SP2$"
  dlc_008_desc:0 "Khoác lên người các nhà cai trị của Ngài những bộ lễ phục lộng lẫy nhất, lấy cảm hứng từ Hoàng đế Henry II và Hoàng hậu Cunigunde."
  dlc_009: "$DLC009_BP2$"
  dlc_009_desc: "Trong Wards & Wardens, các nhà cai trị trẻ tuổi và người giám hộ của họ trở thành tâm điểm. Nuôi dạy các hoàng tử và quý tộc trẻ trong một thế giới đầy vinh quang và hiểm nguy."
  dlc_010: "$DLC010_FP3$"
  dlc_010_desc: "Đế chế Sassanid đã lụi tàn, và Abbasid đang gây áp lực lên các Triều đại Iran còn lại. Ngài sẽ khuất phục hay dựng nên một Đế chế mới? Tương lai Ba Tư nằm trong tay Ngài!"
  dlc_011: "$DLC011_CE1$"
  dlc_011_desc: "Danh tiếng của Ngài lan truyền khắp nơi: hãy ghi tên mình vào biên niên sử và dựng nên những công trình vinh danh bản thân."
  dlc_012: "$DLC012_CP1$"
  dlc_012_desc: "Gói trang phục này bổ sung nhiều vật phẩm mới cho các nền văn hóa Bắc Phi, bao gồm áo, quần, áo choàng, mũ đội đầu và nhiều họa tiết mới."
  dlc_013: "$DLC013_SP3$"
  dlc_013_desc: "Lấy cảm hứng từ thời trang triều đình Pháp thời Trung Cổ Hưng thịnh, gói ngoại hình này mang đến phong cách và họa tiết mới."
  dlc_014: "$DLC014_EP3$"
  dlc_014_desc: "Dẫn dắt một gia tộc quý tộc trong đế chế cổ xưa hoặc trở thành lính đánh thuê lang bạt. Hệ thống chính thể, âm mưu và lối sống mới đang chờ Ngài khám phá."
  dlc_015: "$DLC015_BP3$"
  dlc_015_desc: "Bổ sung nội dung mới cho du hành, hoạt động và lối sống. Hãy đưa nhà cai trị của Ngài vào những hành trình đầy kịch tính."
  dlc_016: "$DLC016_CP2$"
  dlc_016_desc: "Lấy cảm hứng từ trang phục Tây Slav thời Trung Cổ, bao gồm quần áo, mũ đội đầu cầu kỳ và nhiều hoa văn đa dạng."
  dlc_017: "$DLC017_CP3$"
  dlc_017_desc: "Khám phá các thành tựu kiến trúc vĩ đại thời Trung Cổ với Medieval Monuments, bổ sung 20 công trình mới đa dạng và giàu ý nghĩa văn hóa."
  dlc_018: "$DLC018_CP4$"
  dlc_018_desc: "Đối mặt cái lạnh phương Bắc với phong cách riêng trong Arctic Attire, bổ sung các vật phẩm lấy cảm hứng từ thẩm mỹ Sami và Khanty."
  dlc_019: "$DLC019_SP4$"
  dlc_019_desc: "Tăng thêm vẻ uy nghi cho triều đại của Ngài với Crowns of the World, bộ sưu tập vương miện và tùy chọn ngoại hình hoàng gia."
  dlc_020: "$DLC020_CE2$"
  dlc_020_desc: "Thống trị hoặc bị thống trị. Di cư hoặc diệt vong. Trong Khans of the Steppe, chỉ kẻ mạnh nhất mới sống sót trên thảo nguyên khắc nghiệt."
  dlc_021: "$DLC021_BP4$"
  dlc_021_desc: "Khởi đầu triều đại với uy nghi! Hợp pháp hóa quyền lực của Ngài thông qua những nghi lễ long trọng đầy ấn tượng."
  dlc_022: "$DLC022_EP4$"
  dlc_022_desc: "Với All Under Heaven, lịch sử rộng lớn và sống động của Đông Á trở nên sống động. Giành lấy Thiên mệnh và định hình tương lai các đế chế!"
  dlc_023: "$DLC023_CP5$"
  dlc_023_desc: "Chuẩn bị cho chiến trận với trang phục chiến đấu thời Trung Cổ Cao. Gói Tạo Nội Dung này của modder JedNick bao gồm nhiều loại mũ, trang bị đầu và áo giáp phương Tây từ Thời Kỳ Trung Cổ Cao."
  dlc_024: "$DLC024_CP6$"
  dlc_024_desc: "Thêm sự đa dạng và chi tiết lịch sử cho bản đồ của ngươi với Công Trình Thánh. Gói Tạo Nội Dung này của modder Kefir úr mang đến các mô hình 3D mới cho các công trình tôn giáo: từ những nhà thờ khiêm nhường đến các đài kỷ niệm tráng lệ, Công Trình Thánh sẽ đem lại hương vị vùng miền và tôn giáo phong phú hơn cho trò chơi của ngươi!"
  dlc_025: "$DLC025_CP7$"
  dlc_025_desc: "Khám phá trang phục, áo giáp, và các khu định cư đặc trưng của Bắc Thái Bình Dương, lấy cảm hứng từ các nền văn hóa Ainu, Nivkh và Emishi."
  dlc_026: "$DLC026_CP8$"
  dlc_026_desc: "Tăng cường bản đồ thế giới với các công trình đồ sộ và địa điểm linh thiêng, lấy cảm hứng từ những kỳ quan kiến trúc Đông Á."
  dlc_027: "$DLC027_CP9$"
  dlc_027_desc: "Trang hoàng các vị quân chủ của ngươi bằng y phục tinh xảo và trang phục nghi lễ, lấy cảm hứng từ sự lộng lẫy của triều đình đế vương."
  dlc_028: "$DLC028_SP5$"
  dlc_028_desc: "Symbols of Authority bao gồm bảy kiểu tóc và mũ miện hoàng gia mới, lấy cảm hứng từ các nguyên mẫu lịch sử, nhằm làm tôn lên vẻ uy nghiêm cho nhân vật của Ngài."
  dlc_029: "$DLC029_MP1$"
  dlc_029_desc: "Songs of the Realm bao gồm 13 bản nhạc đồng hành cùng quá trình trị vì của Ngài, từ những giai điệu cung đình thanh bình đến những bản hành khúc chiến trận hào hùng. Những bản nhạc kinh điển của Crusader Kings được làm mới lại cùng với các bản phối mới của dân vũ châu Âu, Gói Âm nhạc này là bản nhạc nền hoàn hảo cho tham vọng gia tộc của Ngài."
