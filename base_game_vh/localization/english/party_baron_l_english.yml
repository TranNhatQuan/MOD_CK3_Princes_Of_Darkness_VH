l_english:
 # Misc
 party_baron_volunteer_levies:0 "Quân Tình Nguyện của [party_baron.GetFirstNamePossessiveNoTooltip]"
 # Modifiers
 party_baron_beloved_by_all_modifier:0 "Được Mọi Người Yêu Mến"
 party_baron_making_efforts_modifier:0 "Nỗ Lực Giao Thiệp Xã Hội"
 party_baron_self_aggrandizing_modifier:0 "Tự Đề Cao Bản Thân"
 party_baron_friendly_enough_modifier:0 "Đủ Thân Thiện"
 party_baron_friendly_enough_modifier_desc:0 "Hoàn toàn có thể có quá nhiều "Bạn Bè""
 party_baron_if_you_cannot_be_loved_modifier:0 "Nếu Không Thể Được Yêu Mến"
 party_baron_accommodating_modifier:0 "Chiều Theo Người Khác"
 party_baron_condemned_pb_modifier:0 "Sự Lên Án Không Được Lòng"
 party_baron_condemned_pb_modifier_desc:0 "Nhân vật này đã nói xấu một người rất được yêu mến"
 party_baron_praised_pb_modifier:0 "Lời Khen Miễn Cưỡng"
 party_baron_praised_pb_modifier_desc:0 "Nhân vật này đã miễn cưỡng khen ngợi một người rất được yêu mến"
 party_baron_murdered_the_joy_of_life_modifier:0 "Giết Chết Niềm Vui Cuộc Sống"
 party_baron_murdered_the_joy_of_life_modifier_desc:0 "Tại sao ai đó lại làm một điều như vậy?"
 party_baron_great_mercenary_deal_modifier:0 "Thỏa Thuận Lính Đánh Thuê Tuyệt Vời"
 party_baron_ended_the_party_modifier:0 "Chấm Dứt Yến Tiệc"
 party_baron_ended_the_party_modifier_desc:0 "Nhân vật này đã tước đi đại sảnh yến tiệc của những bữa tiệc vĩ đại nhất từng được tổ chức"
 party_baron_subversive_tactics_modifier:0 "Chiến Thuật Phá Hoại"
 party_baron_reflection_modifier:0 "Tự Suy Ngẫm"
 party_baron_beloved_by_all_except_modifier:0 "Được Mọi Người Yêu Mến, Ngoại Trừ..."
 party_baron_endorsed_successor_modifier:0 "Ủng Hộ Người Kế Vị"
 party_baron_endorsed_successor_modifier_desc:0 "Người dễ mến nhất thế giới đã trao sự ủng hộ của mình cho vị quân chủ mới này"

 # Events
 party_baron_header:0 "Bữa Tiệc Bất Tận"
 party_baron_negative_attitude_counter_stress_tt:0 "Do thái độ #V tiêu cực#! của Ngài đối với [TARGET_CHARACTER.GetShortUIName]:"
 party_baron_positive_attitude_counter_stress_tt:0 "Do thái độ #V tích cực#! của Ngài đối với [TARGET_CHARACTER.GetShortUIName]:"
 party_baron_move_towards_positive_tt:0 "Chuyển sang thái độ #V tích cực#! đối với [party_baron.GetShortUIName]"
 party_baron_move_towards_negative_tt:0 "Chuyển sang thái độ #V tiêu cực#! đối với [party_baron.GetShortUIName]"
 party_baron.1001.t:0 "$party_baron_header$"
 party_baron.1001.desc:0 "Tên của một vị quý tộc cấp thấp dường như đang ở trên môi của tất cả mọi người. Ta liên tục nghe nói về việc [party_baron.GetTitledFirstName] tuyệt vời ra sao khi ở bên cạnh, cách [party_baron.GetSheHe] khiến mọi người cảm thấy thoải mái, và việc [party_baron.GetSheHe] tổ chức những bữa tiệc #EMP tuyệt vời nhất#!.\n\nAi cũng biết [party_baron.GetHerHim] và có thể chứng thực cho sự thân thiện cùng lòng hào phóng của hắn — ít nhất đó là điều họ rất háo hức khẳng định."
 party_baron.1001.a:0 "Có lẽ ta có thể học được đôi điều từ sự nổi tiếng của [party_baron.GetHerHis]..."
 party_baron.1001.b:0 "Nhưng #EMP ta#! mới là người xứng đáng nhận được mọi lời ca tụng!"
 party_baron.1001.c:0 "Có lẽ ta nên làm quen với [party_baron.GetWomanMan] này!"
 party_baron.1001.c.tt:0 "Viết thư cho [party_baron.GetTitleAsName]"

 party_baron.1002.opening:0 "[party_baron.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 party_baron.1002.desc:0 "Ta cảm ơn ngài vì những lời chào hỏi tốt đẹp! Thật vui khi được nghe từ một người thực sự hiểu rằng niềm vui chân chính là niềm vui ta mang đến cho người khác.\n\nTa hy vọng một ngày nào đó có thể tiếp đãi ngài như vị khách danh dự của mình, và dù có hơi mạo muội khi nói điều này, Ta hy vọng rằng một ngày nào đó ngài sẽ coi Ta là một người Ngài."
 party_baron.1002.a:0 "[party_baron.GetSheHe|U] có vẻ rất dễ mến, ngay cả qua thư từ!"

 party_baron.1003.desc:0 "Cảm giác như ta chỉ chớp mắt một cái và đã bỏ lỡ tất cả, nhưng [party_baron.GetFirstName] đã đi từ nam tước lãnh địa nhỏ bé của [party_baron.GetHerHis], trở thành [party_baron_header.GetTitleAsName] của ta...\n\nThế giới đã đảo lộn nhanh hơn ta có thể tưởng tượng."
 party_baron.1003.a:0 "Ít nhất giờ ta có một [party_baron.GetTitleAsName] hào phóng."
 party_baron.1003.b:0 "Hãy cứ quên hết những gì ta đã nói..."

 party_baron.2001.t:0 "$party_baron_header$"
 party_baron.2001.negative:0 "Không hề có sự khuyến khích hay chấp thuận nào, vậy mà [party_baron.GetTitledFirstName] lại chủ động nói chuyện với [vassal.Custom2('RelationToMe', ROOT.Char )] về ta!\n\n[party_baron.GetSheHe|U] dường như đã ca ngợi ta không ngớt, nhưng điều đó chỉ khiến ta #EMP càng#! nghi ngờ động cơ của [party_baron.GetHerHis]!"
 party_baron.2001.positive:0 "Có vẻ như [party_baron.GetShortUIName], hoàn toàn theo sáng kiến của riêng [party_baron.GetHerHis], đã nói chuyện với [vassal.Custom2('MyCharacterIntroduction', ROOT.Char )] về ta.\n\nĐiều đó có thể đáng lo ngại, nếu không phải vì [vassal.GetFirstNameNoTooltip] giờ đây dường như thân thiện và ủng hộ ta hơn nhiều!"
 party_baron.2001.a_positive:0 "Một nỗ lực đáng nể!"
 party_baron.2001.a_negative:0 "Miễn là mọi thứ vẫn còn trong tầm kiểm soát..."
 party_baron.2001.b_negative:0 "Ngay từ đầu ta mới là người đáng được ngưỡng mộ và lắng nghe!"
 party_baron.2001.b_positive:0 "Đúng như lẽ phải. Ta thực sự rất tuyệt."

 party_baron.2002.t:0 "$party_baron_header$"
 party_baron.2002.desc:0 "Trong một bữa tiệc, ánh mắt ta chạm phải [party_baron.GetTitledFirstName] khi [party_baron.GetSheHe] đang trò chuyện với [new_friend.Custom2('MyCharacterIntroduction', ROOT.Char )]. Bất chấp sự thất lễ rõ ràng, [party_baron.GetSheHe] ra hiệu gọi ta lại.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Dĩ nhiên ngài biết [new_friend.GetFirstNameNoTooltip], nhưng ta nghĩ hai người nên dành thêm thời gian cho nhau. Hai người có quá nhiều điểm chung!\""
 party_baron.2002.a:0 "Có lẽ ta chưa thực sự hiểu rõ [new_friend.GetTitledFirstNameNoTooltip] như ta nghĩ."
 party_baron.2002.b:0 "Ồ, ta đã có quá đủ người quen rồi."

 party_baron.2003.desc:0 "Ta được biết rằng [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] đã âm mưu ám sát ngài!\n\nTuy nhiên đừng lo, vì ta đã nói chuyện với [owner.GetHerHim] và khiến [owner.GetHerHim] nhận ra sai lầm trong cách làm của [owner.GetHerHis]. Giết người thực sự là điều ghê tởm, ngài không nghĩ vậy sao?"
 party_baron.2003.a:0 "Cảm ơn vì đã... cứu mạng ta?"
 party_baron.2003.repentant_cannot_scheme:0 "Chừng nào [owner.GetShortUIName] còn hối cải, [owner.GetSheHe] không thể bắt đầu [hostile_schemes|E] chống lại Ngài"
 party_baron.2003.b:0 "[owner.GetSheHe|U] đã âm mưu làm #EMP cái gì cơ?!#!"
 party_baron.2003.c:0 "Chính xác thì âm mưu này đã \"lọt vào tai [party_baron.GetHerHis]\" bằng cách nào...?"

 party_baron.2004.t:0 "$party_baron_header$"
 party_baron.2004.desc:0 "Không thể biết liệu [party_baron.GetTitledFirstName] đang say rượu hay chỉ say men của bầu không khí lễ hội đang diễn ra quanh [party_baron.GetHerHim]. Dù là gì đi nữa, ta cũng cảm nhận được điều đó ngay khi [party_baron.GetSheHe] kéo ta vào một cái ôm.\n\n\"Ngài biết không,\" [party_baron.GetSheHe] nói, \"ta thực sự nghĩ rằng ngài là một trong những người Bạn Tốt nhất của ta.\"\n\nSuốt phần còn lại của buổi tối, ta chủ yếu nhìn [party_baron.GetHerHim] vui chơi trong cuộc hoan lạc của [party_baron.GetHerHis]. Ta bắt đầu tin rằng mình có thể hiểu [party_baron.GetHerHim] rõ hơn bất kỳ ai trong số những người đang nâng cốc chúc tụng [party_baron.GetHerHim]."
 party_baron.2004.a:0 "Ngài cũng vậy, [party_baron.GetFirstNameNoTooltip]..."

 party_baron.2005.t:0 "$party_baron_header$"
 party_baron.2005.desc:0 "Ta ngạc nhiên, nhưng hài lòng khi [party_baron.GetTitledFirstName] xuất hiện tại triều đình của ta. Càng bất ngờ hơn khi [party_baron.GetSheHe] muốn nói chuyện riêng, chỉ hai chúng ta.\n\n\"Ta không muốn nói điều này trong một bữa tiệc hay lễ hội.\" [party_baron.GetSheHe|U] trông nghiêm túc khác thường, nụ cười vui vẻ quen thuộc lần này không còn nữa. \"Ta không thể diễn tả ngài có ý nghĩa với ta nhiều đến mức nào. Ta có nhiều Bạn Bè, nhưng không ai giống như ngài. Ta hy vọng chúng ta sẽ giữ Tình bạn này cho đến cuối đời.\""
 party_baron.2005.a:0 "\"Ta cũng vậy, [party_baron.GetFirstNameNoTooltip]. Ta cũng vậy.\""

 party_baron.2006.desc:0 "Được mời đến một bữa tiệc vì \"một dịp rất đặc biệt\", ta đã phải tận mắt chứng kiến lễ ăn mừng của [party_baron.GetTitledFirstNamePossessive]. Quả là một đêm đáng nhớ.\n\nTa hiếm khi nhớ mình từng hạnh phúc đến vậy, và giờ đây cảm giác như ta đã lấy lại được phần nào khát khao sống!"
 party_baron.2006.a:0 "Hãy coi chừng, thế giới!"
 party_baron.2006.b:0 "Chẳng có gì đặc biệt."

 party_baron.2007.desc:0 "Ngay cả giữa chiến tranh, [party_baron.GetTitledFirstName] vẫn tìm ra cách thực hiện những trò quen thuộc của [party_baron.GetHerHis]. Khi ta đang thị sát quân đội, [party_baron.GetSheHe] cưỡi ngựa đến trước mặt ta, dẫn đầu một toán quân nhỏ của riêng [party_baron.GetHerHis]!\n\n\"Ta nghĩ chúng ta cần mọi bàn tay có thể, nên ta đã nói chuyện với vài người, và hóa ra họ rất sẵn lòng tham gia như những tình nguyện viên!\"\n\nTình nguyện viên...? Ta có nên hỏi những binh lính này từ đâu đến không?"
 party_baron.2007.a:0 "Đây chính xác là thứ ta cần!"
 party_baron.2007.b:0 "Để #EMP giúp#!, ngươi nên mang đến cho ta #EMP lính chuyên nghiệp!#!"
 party_baron.2007.b_flavor:0 "Ồ. Ồ, ngươi sẽ...?"

 party_baron.3001.t:0 "$party_baron_header$"
 party_baron.3001.desc:0 "Mọi người đều mê mẩn [party_baron.GetTitledFirstName], và ta thực sự không hiểu tại sao! [party_baron.GetSheHe|U] đâu có tuyệt vời đến thế. Tất cả những gì [party_baron.GetSheHe] làm chỉ là cư xử thân thiện và ca ngợi những điều tốt đẹp của những người mà [party_baron.GetSheHe] gặp! Đúng vậy, ngay cả khi bất đồng với [party_baron.GetHerHim] cũng có thể trở nên dễ chịu và thân thiện, và [party_baron.GetSheHe] vẫn kiên định với niềm tin của [party_baron.GetHerHis] trong khi cố gắng hiểu quan điểm của Ngài, nhưng như thế vẫn chưa...\n\nÝ ta là, tại sao họ lại yêu mến [party_baron.GetHerHim] đến thế?!"
 party_baron.3001.a:0 "Ta sẽ cho họ thấy ai mới là người xứng đáng được kính nể!"
 party_baron.3001.b:0 "Có lẽ ta đang quá khắt khe..."

 party_baron.3002.t:0 "$party_baron_header$"
 party_baron.3002.desc:0 "Chẳng lẽ việc [party_baron.GetTitledFirstName] được mọi người yêu mến vẫn chưa đủ, mà #EMP ta#! cũng phải yêu mến [party_baron.GetHerHim] sao?\n\nMột vài chư hầu của ta thậm chí còn ký vào một bản thỉnh cầu yêu cầu ta ngừng nói những lời cay độc về tên [party_baron.GetTitleAsName] vô dụng đó!"
 party_baron.3002.a:0 "Ồ, ta sẽ cho đám ngu ngạo mạn đó biết thế nào là "lời cay độc.""
 party_baron.3002.b:0 "Có lẽ nhẹ nhàng hơn một chút cũng không hại gì. Ít nhất là trước công chúng."

 party_baron.3003.desc:0 "Ngay cả sau tất cả những gì ta đã nói về [party_baron.GetHerHim], [party_baron.GetTitledFirstName] vẫn không hề nản lòng. [party_baron.GetSheHe|U] thậm chí còn dám tiếp cận ta tại một bữa tiệc, chỉ có hai chúng ta.\n\n\"Ta có cảm giác ngài không thích ta cho lắm.\" Ta khịt mũi. [party_baron.GetSheHe|U] nói đúng rồi đấy. Nhưng dĩ nhiên thay vì dừng lại, [party_baron.GetSheHe] vẫn tiếp tục mà không hề nao núng. \"Chúng ta có thể nói chuyện một chút được không?\"\n\nNhững gì xảy ra sau đó như một làn sương mờ, nhưng cuối cùng lại trở thành một trong những bữa tiệc tuyệt vời nhất đời ta. Ta phải thừa nhận, có lẽ ta đã sai về [party_baron.GetTitleAsName] này..."
 party_baron.3003.a:0 "Không ngờ cuối cùng ngươi cũng chinh phục được ta, [party_baron.GetFirstNameNoTooltip]!"
 party_baron.3003.b:0 "Không! Chẳng có gì thay đổi cả!"

 party_baron.3004.desc:0 "Chuyện này đã kéo dài quá lâu rồi! Việc [party_baron.GetTitledFirstName] liên tục được tôn vinh như biểu tượng của mọi điều tốt đẹp trong nhân loại đang khiến ta phát điên!\n\nBất cứ thứ bùa mê thao túng nào mà [party_baron.GetSheHe] đang dùng lên vương quốc này đều phải bị phá vỡ."
 party_baron.3004.a:0 "#EMP Chính [party_baron.GetSheHe|U]#! phải bị phá vỡ!"
 party_baron.3004.b:0 "Ta... có đang đi quá xa không?"

 party_baron.4001.desc:1 "Sự ra đi của [previous_character.Custom2('YourCharacterIntroduction', ROOT.Char)] thật khó chấp nhận. [previous_character.GetSheHe|U] là một người Bạn Tốt, và ngài nên tự hào về con người mà [previous_character.GetWomanMan] [previous_character.GetSheHe] đã trở thành.\n\nĐây hẳn là khoảng thời gian khó khăn đối với ngài, nhưng hãy biết rằng ngài có sự ủng hộ của ta!"
 party_baron.4001.a:0 "Cảm ơn những lời tốt đẹp của ngài."

 party_baron.4002.opening:0 "[party_baron.Custom2('AppropriateGreeting', ROOT.Char)]"
 party_baron.4002.desc:0 "Ta hiểu rằng ngài không thích ta. Đó là quyền của ngài. Nhưng ta không hiểu tại sao ngài vẫn tiếp tục độc ác và thù địch khi ta cố gắng cư xử thân thiện và lịch thiệp nhất có thể.\n\nChúng ta đã có nhiều cơ hội để giải quyết chuyện này, nhưng giờ ta hỏi ngài lần cuối. Làm ơn, hãy để chúng ta đơn giản chỉ... làm Ngài."
 party_baron.4002.a:0 "Sao [party_baron.GetSheHe] dám? Sao [party_baron.GetSheHe] dám chứ!"

 party_baron.9001.t:0 "Kết Thúc Của Một Bữa Tiệc"
 party_baron.9001.desc:0 "[party_baron.GetTitledFirstName] là lời nhắc nhở rõ ràng rằng dù chúng ta tận hưởng cuộc sống đến đâu, và dù chúng ta mang lại bao nhiêu niềm vui cho thế giới này, thì cuối cùng tất cả cũng sẽ kết thúc."
 party_baron.9001.a:0 "Thế giới này sẽ mất đi rất nhiều khi không còn [party_baron.GetHerHim]."
 party_baron.9001.a.tt:0 "[party_baron.GetShortUIName] đang ăn mừng tại [party_baron.GetFaith.PositiveAfterLife]"
 party_baron.9001.b:0 "Có vẻ [ROOT.Char.GetFaith.DeathDeityName] không bị đánh lừa bởi nụ cười giả tạo của [party_baron.GetHerHis]."
 party_baron.9001.b.tt:0 "[party_baron.GetShortUIName] cuối cùng đã biến mất mãi mãi."

 party_baron.9003.t:0 "$party_baron_header$"
 party_baron.9003.desc_positive:0 "Ta không thể tin được mình may mắn đến thế nào khi có [party_baron.GetWomanMan] này bên cạnh. Ta chưa từng nghĩ mình có thể cảm thấy hạnh phúc như trong ngày cưới, giống như một [ROOT.Char.Custom('GirlBoy')] nông dân đang ngây ngất. Và [party_baron.GetFirstName] dường như rạng rỡ vô cùng.\n\nKhi [party_baron.GetSheHe] nhìn vào mắt ta và nói rằng [party_baron.GetSheHe] không thể nghĩ ra niềm vui nào lớn hơn việc được ở bên ta mãi mãi, ta tin lời [party_baron.GetHerHim]."
 party_baron.9003.desc_negative:0 "Có lẽ đây vốn dĩ luôn là kết cục không thể tránh khỏi. Dù ta căm ghét và ghen tị đến đâu, ta vẫn không thể cưỡng lại sức quyến rũ của [party_baron.GetHerHis].\n\n[party_baron.GetFirstName] dường như đã chắc chắn rằng điều này rồi cũng sẽ xảy ra. Và giờ khi chúng ta đã kết hôn, [party_baron.GetSheHe] trông hạnh phúc hơn bao giờ hết."
 party_baron.9003.a_positive:0 "Ta là của ngươi, tình yêu của ta!"
 party_baron.9003.a_negative:0 "Cuối cùng ngươi cũng chinh phục được ta rồi, tên quyến rũ chết tiệt!"
