  scheme_apa_positive_3031_modifier: "$scheme_apa_positive.3031.t$"
  scheme_apa_positive_3031_modifier_desc: "Bi quan có thể thắng thế chúng ta, nhưng đôi khi lại dễ dàng bù trừ quá mức."
  scheme_apa_positive_3041_modifier: "$scheme_apa_positive.3041.t$"
  scheme_apa_positive_3041_modifier_desc: "Đôi khi sức hấp dẫn tự nhiên và nụ cười lôi cuốn của một người đơn giản là không thể cưỡng lại."
  scheme_apa_positive_3051_modifier: "$scheme_apa_positive.3051.t$"
  scheme_apa_positive_3051_modifier_desc: "Thật may mắn khi có quá nhiều điều để nói thay vì quá ít."
  scheme_apa_positive_3061_modifier: "$scheme_apa_positive.3061.t$"
  scheme_apa_positive_3061_modifier_desc: "Khi Ngài đã điền vài cái, những cái còn lại dường như tự viết ra."
  scheme_apa_positive_3071_modifier: "$scheme_apa_positive.3071.t$"
  scheme_apa_positive_3071_modifier_desc: "Đôi khi chúng ta phải dựa vào bản năng, nhưng đôi khi đó là tất cả những gì cần."
  scheme_apa_positive_3081_modifier: "$scheme_apa_positive.3081.t$"
  scheme_apa_positive_3081_modifier_desc: "Thôi... chỉ... hoàn thành... từ... này... Ái! Cây bút chết tiệt này!"
  scheme_apa_positive_3091_modifier: "$scheme_apa_positive.3091.t$"
  scheme_apa_positive_3091_modifier_desc: "Dù là do đánh giá thấp hay thành tích vượt trội, chúng ta đang đi trước nơi lẽ ra phải có."
  scheme_apa_positive_3101_modifier: "$scheme_apa_positive.3101.t$"
  scheme_apa_positive_3101_modifier_desc: "Thật nhẹ nhõm khi biết dàn hỗ trợ đang biểu diễn một màn trình diễn tuyệt vời."
  scheme_apa_positive_3111_modifier: "$scheme_apa_positive.3111.t$"
  scheme_apa_positive_3111_modifier_desc: "Không gì tuyệt vời bằng khi một kế hoạch được dàn xếp cẩn thận lại hoàn toàn suôn sẻ."
