  scheme_apa_negative_7171_modifier_desc: "Nỗ lực của chúng ta ngày càng bị kéo mỏng bởi hoàn cảnh xấu đi."
  scheme_apa_negative_7181_modifier: "$scheme_apa_negative.7181.t$"
  scheme_apa_negative_7181_modifier_desc: "Duy trì cảnh giác hàng giờ, hàng ngày, hàng tuần không phải là chuyện nhỏ."
  scheme_apa_negative_7191_modifier: "$scheme_apa_negative.7191.t$"
  scheme_apa_negative_7191_modifier_desc: "Rất dễ ngủ quên khi làm việc hoặc bị phân tâm."
  scheme_apa_negative_7201_modifier: "$scheme_apa_negative.7201.t$"
  scheme_apa_negative_7201_modifier_desc: "Nếu không chú ý và cẩn thận, việc chuẩn bị chiến tranh có thể dẫn đến thảm họa."
  scheme_apa_negative_7211_modifier: "$scheme_apa_negative.7211.t$"
  scheme_apa_negative_7211_modifier_desc: "Nếu lính mới mất tích, phải tìm người thay thế và bắt đầu lại bài học."
  scheme_apa_negative_7221_modifier: "$scheme_apa_negative.7221.t$"
  scheme_apa_negative_7221_modifier_desc: "Lệnh của chỉ huy chỉ hiệu quả khi các sĩ quan truyền đạt đúng."
  scheme_apa_negative_7231_modifier: "$scheme_apa_negative.7231.t$"
  scheme_apa_negative_7231_modifier_desc: "Biết khi nào mình bị đánh bại là nhận ra tàn nhẫn nhưng cần thiết."
  scheme_apa_negative_7241_modifier: "$scheme_apa_negative.7241.t$"
  scheme_apa_negative_7241_modifier_desc: "Kẻ thù khôn ngoan chỉ cần tìm và cắt những mắt xích yếu nhất."
  scheme_apa_negative_7251_modifier: "$scheme_apa_negative.7251.t$"
  scheme_apa_negative_7251_modifier_desc: "Nhục nhã công khai có thể làm suy yếu cả kẻ hung hãn nhất."
  scheme_apa_negative_7261_modifier: "$scheme_apa_negative.7261.t$"
  scheme_apa_negative_7261_modifier_desc: "Thật tệ hại khi nhận ra — quá muộn — rằng mình đã bị lừa."
  scheme_apa_negative_7271_modifier: "$scheme_apa_negative.7271.t$"
  scheme_apa_negative_7271_modifier_desc: "Ngay cả người có định hướng tốt đôi khi cũng lạc lối."
  scheme_apa_negative_7281_modifier: "$scheme_apa_negative.7281.t$"
  scheme_apa_negative_7281_modifier_desc: "Dù lỡ bước hay bị dẫn lạc, chẳng tiến triển gì khi đi lại con đường cũ."
  scheme_apa_negative_7291_modifier: "$scheme_apa_negative.7291.t$"
  scheme_apa_negative_7291_modifier_desc: "Những tờ giấy chết tiệt đâu rồi? Chúng vừa ở đây mà, Ta chắc chắn là vậy!"
  scheme_apa_negative_7301_modifier: "$scheme_apa_negative.7301.t$"
  scheme_apa_negative_7301_modifier_desc: "Cánh cửa những làng vắng lặng kì lạ như đóng sập ngay khi chúng ta đến."
  scheme_apa_negative_7311_modifier: "$scheme_apa_negative.7311.t$"
  scheme_apa_negative_7311_modifier_desc: "Người dân rõ ràng chẳng có hứng thú hợp tác với chúng ta."
  scheme_apa_negative_7321_modifier: "$scheme_apa_negative.7321.t$"
  scheme_apa_negative_7321_modifier_desc: "Hy vọng giải quyết mớ bòng bong vu khống này gần như là vô vọng."
  scheme_apa_negative_7331_modifier: "$scheme_apa_negative.7331.t$"
  scheme_apa_negative_7331_modifier_desc: "Dù đặt câu hỏi thế nào, câu trả lời cũng chẳng đâu vào đâu."
  scheme_apa_negative_7341_modifier: "$scheme_apa_negative.7341.t$"
  scheme_apa_negative_7341_modifier_desc: "Những giờ quý giá trôi qua nhanh trong những lối nói vòng vo và nhắc đi nhắc lại."
  scheme_apa_negative_7351_modifier: "$scheme_apa_negative.7351.t$"
  scheme_apa_negative_7351_modifier_desc: "Ngốc ơi, cái đó phải đặt sang kia! Không, đợi. Quay #EMP hướng đó#! sao?"
  scheme_apa_negative_7361_modifier: "$scheme_apa_negative.7361.t$"
  scheme_apa_negative_7361_modifier_desc: "Thiếu búa thì đinh cũng vô dụng, chưa kể phần còn lại…"
  scheme_apa_negative_7371_modifier: "$scheme_apa_negative.7371.t$"
  scheme_apa_negative_7371_modifier_desc: "Mỗi lần chúng ta bắt đầu làm việc, cơn mưa kinh khủng lại bắt đầu."
  scheme_apa_negative_7381_modifier: "$scheme_apa_negative.7381.t$"
  scheme_apa_negative_7381_modifier_desc: "Ánh sáng gần như mất khi chúng ta gom hết mọi thứ lại…"
  scheme_apa_negative_7391_modifier: "$scheme_apa_negative.7391.t$"
  scheme_apa_negative_7391_modifier_desc: "Tên cướp gian xảo và tàn nhẫn nhất cũng bối rối nếu không có nạn nhân."
  scheme_apa_negative_7401_modifier: "$scheme_apa_negative.7401.t$"
  scheme_apa_negative_7401_modifier_desc: "Lợi lộc trên đường như sóng biển, gần đây lại càng khan hiếm."
  scheme_apa_negative_7411_modifier: "$scheme_apa_negative.7411.t$"
  scheme_apa_negative_7411_modifier_desc: "Lập kế hoạch và tổ chức mai phục đã khó, càng khó hơn khi phải chạy trốn."
  scheme_apa_negative_7421_modifier: "$scheme_apa_negative.7421.t$"
  scheme_apa_negative_7421_modifier_desc: "Kẻ tranh luận thường tự làm hại mình bởi cách chọn từ ngữ tệ hại."
  scheme_apa_negative_7431_modifier: "$scheme_apa_negative.7431.t$"
  scheme_apa_negative_7431_modifier_desc: "Gì cơ, Ngài không hiểu? Lại nữa à? Nghe này, lần này theo Ta thật sát…"
  scheme_apa_negative_7441_modifier: "$scheme_apa_negative.7441.t$"
  scheme_apa_negative_7441_modifier_desc: "Một mâu thuẫn, khi bị chỉ ra, gieo rắc thêm nghi ngờ."
  scheme_apa_negative_7451_modifier: "$scheme_apa_negative.7451.t$"
  scheme_apa_negative_7451_modifier_desc: "Tiền quyên góp có thể đến nhanh, nhưng không dày đặc."
  scheme_apa_negative_7461_modifier: "$scheme_apa_negative.7461.t$"
  scheme_apa_negative_7461_modifier_desc: "Dù cố gắng, luôn có lý do để không mở hầu bao."
  scheme_apa_negative_7471_modifier: "$scheme_apa_negative.7471.t$"
  scheme_apa_negative_7471_modifier_desc: "Khó thuyết phục ai khi đang cạnh tranh với kẻ quấy rối."
  scheme_apa_negative_7481_modifier: "$scheme_apa_negative.7481.t$"
  scheme_apa_negative_7481_modifier_desc: "Những lời lẩm bẩm sắc bén của một linh mục có thể thay đổi tất cả với kẻ ngu dốt này."
  scheme_apa_negative_7491_modifier: "$scheme_apa_negative.7491.t$"
  scheme_apa_negative_7491_modifier_desc: "Khi nói đến danh tiếng về sự đáng tin, đôi khi ta là kẻ thù tồi tệ nhất của chính mình."
  scheme_apa_negative_7501_modifier: "$scheme_apa_negative.7501.t$"
  scheme_apa_negative_7501_modifier_desc: "Một miếng ngon tưởng chừng hấp dẫn có thể, khi xem xét kỹ, chỉ là chuyện tầm phào."
  scheme_apa_negative_7511_modifier: "$scheme_apa_negative.7511.t$"
  scheme_apa_negative_7511_modifier_desc: "Những vệ binh cảnh giác nhất trên thế giới cũng chỉ có thể che phủ một khu vực hạn chế."
  scheme_apa_negative_7521_modifier: "$scheme_apa_negative.7521.t$"
  scheme_apa_negative_7521_modifier_desc: "Lý thuyết chỉ giúp được đến mức nào đó, thực hành tệ không đi xa hơn."
  scheme_apa_negative_7531_modifier: "$scheme_apa_negative.7531.t$"
  scheme_apa_negative_7531_modifier_desc: "Ít ai còn e ngại chúng ta sau màn trình diễn tệ hại như vậy…"
  scheme_apa_negative_7541_modifier: "$scheme_apa_negative.7541.t$"
  scheme_apa_negative_7541_modifier_desc: "Nhìn này, chúng ta có thể tiết kiệm thời gian cắt ngang đường này, nếu không thì Ta thật ngốc."
  scheme_apa_negative_7551_modifier: "$scheme_apa_negative.7551.t$"
  scheme_apa_negative_7551_modifier_desc: "Dù bị nghi ngờ thật hay bị đặt câu hỏi lừa đảo, giấy tờ chứng nhận vô dụng nếu không có niềm tin."
 # Progress (Repurposed)
  scheme_apa_negative_8001_modifier: "$scheme_apa_negative.8001.t$"
  scheme_apa_negative_8001_modifier_desc: "Chỉ vài khoảnh khắc ngăn cách một cuộc đảo chính kịch tính với một thảm họa xấu hổ."
  scheme_apa_negative_8011_modifier: "$scheme_apa_negative.8011.t$"
  scheme_apa_negative_8011_modifier_desc: "Đôi khi cảm giác như toàn bộ vũ trụ đều chống lại chúng ta!"
  scheme_apa_negative_8021_modifier: "$scheme_apa_negative.8021.t$"
  scheme_apa_negative_8021_modifier_desc: "Dù nỗ lực, chúng ta dường như chẳng đi tới đâu!"
  scheme_apa_negative_8031_modifier: "$scheme_apa_negative.8031.t$"
  scheme_apa_negative_8031_modifier_desc: "Dù họ cố che giấu, dường như chúng ta thực sự đã gây ra chút tổn hại."
  scheme_apa_negative_8041_modifier: "$scheme_apa_negative.8041.t$"
  scheme_apa_negative_8041_modifier_desc: "Có lẽ lần đó Ta lảm nhảm quá nhiều…"
  scheme_apa_negative_8051_modifier: "$scheme_apa_negative.8051.t$"
  scheme_apa_negative_8051_modifier_desc: "Kiên trì nhanh chóng trở thành phiền toái, và chúng ta đang ở lại quá lâu."
  scheme_apa_negative_8061_modifier: "$scheme_apa_negative.8061.t$"
  scheme_apa_negative_8061_modifier_desc: "Có thể nghĩ rằng mình hiểu vấn đề, nhưng thực ra chỉ cầm sai đầu gậy."
  scheme_apa_negative_8071_modifier: "$scheme_apa_negative.8071.t$"
  scheme_apa_negative_8071_modifier_desc: "Tốt hơn là nhận ra lỗi trước khi dẫn đến tệ hơn, nhưng cũng chẳng an ủi gì."
  scheme_apa_negative_8081_modifier: "$scheme_apa_negative.8081.t$"
  scheme_apa_negative_8081_modifier_desc: "Một núi giấy vẫn nằm trên bàn, và bình minh sắp đến."
  scheme_apa_negative_8091_modifier: "$scheme_apa_negative.8091.t$"
  scheme_apa_negative_8091_modifier_desc: "Những kẻ phản bội vô ơn chết tiệt! Chúng lẽ ra phải phản bội họ, không phải chúng ta!"
  scheme_apa_negative_8101_modifier: "$scheme_apa_negative.8101.t$"
  scheme_apa_negative_8101_modifier_desc: "Mọi thứ ban đầu rõ ràng, nhưng dường như đang sụp đổ…"
  scheme_apa_negative_8111_modifier: "$scheme_apa_negative.8111.t$"
  scheme_apa_negative_8111_modifier_desc: "Một lời nói đúng chỗ bị phản bác. Chúng ta sẽ phải thử lại."
  scheme_apa_negative_8121_modifier: "$scheme_apa_negative.8121.t$"
  scheme_apa_negative_8121_modifier_desc: "Một câu chuyện vĩ đại cần đầy những tình tiết phóng đại, nhưng cũng phải nhất quán nội tại."
  scheme_apa_negative_8131_modifier: "$scheme_apa_negative.8131.t$"
  scheme_apa_negative_8131_modifier_desc: "Dù hy vọng nó đã được dẹp yên, mọi thứ vẫn có thể bùng lên bất ngờ."
