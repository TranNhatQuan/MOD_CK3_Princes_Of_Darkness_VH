  scheme_apa_positive_2061_modifier_desc: "Luôn vui khi nhận ra mình có một tài năng."
  scheme_apa_positive_2071_modifier: "$scheme_apa_positive.2071.t$"
  scheme_apa_positive_2071_modifier_desc: "Đam mê thật sự với một môn học có thể đưa ai đó đi rất xa."
  scheme_apa_positive_2081_modifier: "$scheme_apa_positive.2081.t$"
  scheme_apa_positive_2081_modifier_desc: "Câu hỏi sinh ra câu hỏi, đặc biệt với những người tìm hiểu đam mê."
  scheme_apa_positive_2091_modifier: "$scheme_apa_positive.2091.t$"
  scheme_apa_positive_2091_modifier_desc: "Điều gì nhỏ bé lan truyền nhanh nhất là nửa sự thật đầy hứng thú."
  scheme_apa_positive_2101_modifier: "$scheme_apa_positive.2101.t$"
  scheme_apa_positive_2101_modifier_desc: "Đánh nhanh, đánh mạnh, và Ngài sẽ không cần đánh lần hai."
  scheme_apa_positive_2111_modifier: "$scheme_apa_positive.2111.t$"
  scheme_apa_positive_2111_modifier_desc: "... không chờ ai, đặc biệt là những kẻ âm mưu."
  scheme_apa_positive_2121_modifier: "$scheme_apa_positive.2121.t$"
  scheme_apa_positive_2121_modifier_desc: "Bữa sáng, trưa hay tối — sảnh luôn đông, khách háo hức nghe chủ đề trong ngày bên thức ăn..."
  scheme_apa_positive_2131_modifier: "$scheme_apa_positive.2131.t$"
  scheme_apa_positive_2131_modifier_desc: "Khi câu chuyện biến người nghe thành người kể, nó sẽ sống một đời sống riêng."
  scheme_apa_positive_2141_modifier: "$scheme_apa_positive.2141.t$"
  scheme_apa_positive_2141_modifier_desc: "Như ong quanh hoa — hoặc ruồi quanh xác đối với kẻ thờ ơ — chỉ có #EMP một#! chuyện mà cả triều đình đang bàn luận."
  scheme_apa_positive_2151_modifier: "$scheme_apa_positive.2151.t$"
  scheme_apa_positive_2151_modifier_desc: "Công lý nhanh, vì vậy, nhanh cũng đồng nghĩa với công bằng."
  scheme_apa_positive_2161_modifier: "$scheme_apa_positive.2161.t$"
  scheme_apa_positive_2161_modifier_desc: "Đi thẳng vào trọng tâm vấn đề một cách nhanh nhẹn là một kỹ năng."
  scheme_apa_positive_2171_modifier: "$scheme_apa_positive.2171.t$"
  scheme_apa_positive_2171_modifier_desc: "Danh tiếng có thể làm nên điều kỳ diệu, đặc biệt khi rút ngắn các câu chuyện thương tâm và bớt giải thích dài dòng tại tòa án."
  scheme_apa_positive_2181_modifier: "$scheme_apa_positive.2181.t$"
  scheme_apa_positive_2181_modifier_desc: "Một màn thể hiện sức mạnh tốt là tất cả những gì cần để ngăn chặn phần lớn kẻ xấu."
  scheme_apa_positive_2191_modifier: "$scheme_apa_positive.2191.t$"
  scheme_apa_positive_2191_modifier_desc: "Tối quan trọng là hoàn thiện các tuyến đường, trạm gác và điểm mạnh trong kế hoạch phòng thủ."
  scheme_apa_positive_2201_modifier: "$scheme_apa_positive.2201.t$"
  scheme_apa_positive_2201_modifier_desc: "Vệ binh được củng cố giờ là kiến thức phổ biến trong khu vực, chỉ kẻ ngốc mới không nghĩ lại."
  scheme_apa_positive_2211_modifier: "$scheme_apa_positive.2211.t$"
  scheme_apa_positive_2211_modifier_desc: "Thật nhẹ nhõm khi phát hiện ra ai đó có năng khiếu học tập trong nhóm mình dạy."
  scheme_apa_positive_2221_modifier: "$scheme_apa_positive.2221.t$"
  scheme_apa_positive_2221_modifier_desc: "Thời tiết thuận lợi và lịch trình rộng rãi đã cho nhiều thời gian cho các bài học thực hành."
  scheme_apa_positive_2231_modifier: "$scheme_apa_positive.2231.t$"
  scheme_apa_positive_2231_modifier_desc: "Thầy giáo không có thời gian cho từng học sinh. May thay, các sĩ quan biết họ đang làm gì."
  scheme_apa_positive_2241_modifier: "$scheme_apa_positive.2241.t$"
  scheme_apa_positive_2241_modifier_desc: "Nhắc đến tên chúng ta kích thích sự quan tâm của người dân, và làm đối thủ hoang mang."
  scheme_apa_positive_2251_modifier: "$scheme_apa_positive.2251.t$"
  scheme_apa_positive_2251_modifier_desc: "Vận may đứng về phía chúng ta, kẻ thù thà chạy trước mặt còn hơn đối đầu."
  scheme_apa_positive_2261_modifier: "$scheme_apa_positive.2261.t$"
  scheme_apa_positive_2261_modifier_desc: "Dù đang hưởng vận may hay dằn vặt tội lỗi, người dân đang trong tâm trạng rộng lượng."
  scheme_apa_positive_2271_modifier: "$scheme_apa_positive.2271.t$"
  scheme_apa_positive_2271_modifier_desc: "Một đầu mối may mắn từ người có thông tin có thể tiết kiệm nhiều công tìm kiếm."
  scheme_apa_positive_2281_modifier: "$scheme_apa_positive.2281.t$"
  scheme_apa_positive_2281_modifier_desc: "Dù mục tiêu lười biếng hay chúng ta nhanh nhẹn, khoảng cách sẽ được thu hẹp."
  scheme_apa_positive_2291_modifier: "$scheme_apa_positive.2291.t$"
  scheme_apa_positive_2291_modifier_desc: "Có lẽ chúng ta đọc nhầm dấu hiệu, hoặc mục tiêu bị trễ, vì chúng ta đang ngay sát gót họ!"
  scheme_apa_positive_2321_modifier: "$scheme_apa_positive.2321.t$"
  scheme_apa_positive_2321_modifier_desc: "Sống trong sợ hãi thật kinh khủng, nhưng điều đó #EMP thực sự#! làm công việc của chúng ta dễ dàng hơn nhiều..."
  scheme_apa_positive_2331_modifier: "$scheme_apa_positive.2331.t$"
  scheme_apa_positive_2331_modifier_desc: "Thật nhẹ nhõm cho một thẩm phán khi biết ngay lập tức phán quyết phải là gì."
  scheme_apa_positive_2341_modifier: "$scheme_apa_positive.2341.t$"
  scheme_apa_positive_2341_modifier_desc: "Ý kiến quần chúng quan trọng, và vụ kiện của Ngài chỉ mạnh mẽ nếu có người sẵn sàng ủng hộ."
  scheme_apa_positive_2351_modifier: "$scheme_apa_positive.2351.t$"
  scheme_apa_positive_2351_modifier_desc: "Đôi khi một phán quyết phải được thúc tiến, và thật may mắn cho những kẻ không liêm chính đồng ý."
  scheme_apa_positive_2361_modifier: "$scheme_apa_positive.2361.t$"
  scheme_apa_positive_2361_modifier_desc: "Không sương mù, gió, hay mưa nào cản bước tiến của chúng ta, và công trình ngày càng cao lên từng ngày."
  scheme_apa_positive_2371_modifier: "$scheme_apa_positive.2371.t$"
  scheme_apa_positive_2371_modifier_desc: "Sự khác biệt do đúng người làm đúng việc là trời và đất."
  scheme_apa_positive_2381_modifier: "$scheme_apa_positive.2381.t$"
  scheme_apa_positive_2381_modifier_desc: "Chưa bao giờ Ta thấy sự phối hợp, nhận thức, và hợp tác nào tuyệt vời đến vậy!"
  scheme_apa_positive_2391_modifier: "$scheme_apa_positive.2391.t$"
  scheme_apa_positive_2391_modifier_desc: "Những con vật này rất sẵn lòng đi theo hướng khác."
  scheme_apa_positive_2401_modifier: "$scheme_apa_positive.2401.t$"
  scheme_apa_positive_2401_modifier_desc: "Hạt, và những người cần giúp đỡ, được ban phúc bởi sự hiện diện của những vị khách béo tốt, với túi đầy tiền."
  scheme_apa_positive_2411_modifier: "$scheme_apa_positive.2411.t$"
  scheme_apa_positive_2411_modifier_desc: "Khi Ngài cần ở đúng nơi vào đúng thời điểm, luôn có thể tạo ra hiệu quả."
  scheme_apa_positive_2421_modifier: "$scheme_apa_positive.2421.t$"
  scheme_apa_positive_2421_modifier_desc: "Các con đường ngập tràn những lữ khách không được bảo vệ, dễ dàng tách khỏi túi tiền của họ."
  scheme_apa_positive_2431_modifier: "$scheme_apa_positive.2431.t$"
  scheme_apa_positive_2431_modifier_desc: "Một lập luận tốt luôn có giá trị, nhưng một diễn giả thuyết phục thêm một cái #EMP gì đó mà không thể diễn tả bằng lời#!."
  scheme_apa_positive_2441_modifier: "$scheme_apa_positive.2441.t$"
  scheme_apa_positive_2441_modifier_desc: "Sắc mặt của cuộc tranh luận treo thấp, và mức cược, vì vậy, cũng tương ứng."
  scheme_apa_positive_2451_modifier: "$scheme_apa_positive.2451.t$"
  scheme_apa_positive_2451_modifier_desc: "Dù kết luận có thuyết phục đến đâu, cách trình bày nhút nhát sẽ không truyền được nhiều niềm tin."
  scheme_apa_positive_2461_modifier: "$scheme_apa_positive.2461.t$"
  scheme_apa_positive_2461_modifier_desc: "Thật may mắn khi những người đi qua đạo đức nhất xuất hiện đúng lúc."
  scheme_apa_positive_2471_modifier: "$scheme_apa_positive.2471.t$"
  scheme_apa_positive_2471_modifier_desc: "Chủ đất ở những vùng này dường như rất sùng đạo, nếu nhìn vào sự hào phóng của họ."
  scheme_apa_positive_2481_modifier: "$scheme_apa_positive.2481.t$"
  scheme_apa_positive_2481_modifier_desc: "Có thể là một trong những mánh khóe cổ xưa nhất, nhưng một cơ hội duy nhất trong đời là cái móc mạnh mẽ."
  scheme_apa_positive_2491_modifier: "$scheme_apa_positive.2491.t$"
  scheme_apa_positive_2491_modifier_desc: "Đây chắc chắn là công việc gác cổng thoải mái, thừa thãi nhất trong cả vương quốc."
  scheme_apa_positive_2501_modifier: "$scheme_apa_positive.2501.t$"
  scheme_apa_positive_2501_modifier_desc: "Dạy những người đã biết hầu hết bài học dễ dàng hơn nhiều."
  scheme_apa_positive_2511_modifier: "$scheme_apa_positive.2511.t$"
  scheme_apa_positive_2511_modifier_desc: "Con mồi bị thương khiến cuộc truy đuổi thoải mái hơn nhiều, và dễ theo dấu hơn."
  scheme_apa_positive_2521_modifier: "$scheme_apa_positive.2521.t$"
  scheme_apa_positive_2521_modifier_desc: "Một thư ký tốt làm việc ghi chép thông tin dễ dàng hơn rất nhiều so với kẻ tệ."
  scheme_apa_positive_2531_modifier: "$scheme_apa_positive.2531.t$"
  scheme_apa_positive_2531_modifier_desc: "Một phán quyết sẽ được tìm thấy nhanh hơn nếu tất cả những người liên quan đều muốn nó được ra nhanh chóng."
  scheme_apa_positive_2541_modifier: "$scheme_apa_positive.2541.t$"
  scheme_apa_positive_2541_modifier_desc: "Cái này đặt ở đây... cái kia đặt ở kia... cắt ba cái đó... công việc xong tốt rồi!"
  scheme_apa_positive_2561_modifier: "$scheme_apa_positive.2561.t$"
  scheme_apa_positive_2561_modifier_desc: "Tại sao phải vòng vo khi Ngài có thể đi thẳng vào vấn đề?"
  scheme_apa_positive_2571_modifier: "$scheme_apa_positive.2571.t$"
  scheme_apa_positive_2571_modifier_desc: "Cụm từ đúng, có thể là tên đúng, và tai người nghe sẽ chú ý ngay."
  scheme_apa_positive_2581_modifier: "$scheme_apa_positive.2581.t$"
  scheme_apa_positive_2581_modifier_desc: "Biết người nghe muốn biết gì là một chất bôi trơn tuyệt vời cho công việc."
 # Progress (repurposed)
  scheme_apa_positive_3001_modifier: "$scheme_apa_positive.3001.t$"
