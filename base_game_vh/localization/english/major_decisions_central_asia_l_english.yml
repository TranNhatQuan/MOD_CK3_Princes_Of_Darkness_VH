l_english:
 #Become Greatest of Khans
  become_greatest_of_khans_decision:0 "Trở Thành Đại Hãn Tối Cao"
  become_greatest_of_khans_decision_desc:0 "#F Ta đã sẵn sàng triệu tập mọi thủ lĩnh bộ tộc khắp lãnh thổ rộng lớn của mình đến một đại hội. Họ sẽ tôn xưng ta là Hãn của các Hãn, [ROOT.Char.GetLadyLord|U] của mọi thứ dưới bầu trời.\nTừ đó, chúng ta sẽ chinh phục.#!"
  become_greatest_of_khans_decision_tooltip:0 "Thành lập Đế quốc Mông Cổ và trở thành Thành Cát Tư Hãn – kẻ thống trị thế giới"
  become_greatest_of_khans_decision_confirm:0 "Triệu tập Đại Kurultai"
  become_greatest_of_khans_decision_gain_mongol_empire:1 "Lãnh địa của Ngài trở thành [mongol_empire|E]"
  become_greatest_of_khans_decision_enable_mongol_invasion_cb:1 "Ngài có quyền sử dụng [mongol_invasion_casus_belli|E]"
  GREATEST_OF_KHANS_TITLE_REQUIREMENT:1 "Ngài phải có cấp bậc [king|E] hoặc [emperor|E]"

 #Establish Bactrian Supremacy
  establish_bactrian_supremacy_decision:0 "Thiết Lập Quyền Tối Thượng Bactria"
  establish_bactrian_supremacy_decision_desc:0 "#F Trong nhiều thế hệ, các vị vua Bactria đã thống trị ngã tư của các nền văn minh. Đã đến lúc chúng ta tiếp nhận di sản đó, và để tin tức lan truyền từ caravanserai đến ốc đảo rằng tại đây, dưới bốn góc bầu trời, chính chúng ta là người cai trị.#!"
  establish_bactrian_supremacy_decision_tooltip:0 "Thể hiện sự thống trị đối với các tuyến đường thương mại nối liền đông tây, nam bắc"
  establish_bactrian_supremacy_decision_confirm:0 "Tuyên bố chủ quyền vùng đất cổ xưa!"

 #Establish the Yamagate of Samarkand
  establish_yamagate_in_samarkand_decision:0 "Thiết Lập $manichean_religious_head_title_name$ tại Samarkand"
  establish_yamagate_in_samarkand_decision_desc:0 "#F Cũng như Mar Sisin từng lãnh đạo đức tin tại Tòa Thánh Babylon, vị $manichean_religious_head_title$ hiện tại của chúng ta cũng đang dẫn dắt chúng ta tại Turan và Ba Tư. Bằng việc chính thức hóa thiên mệnh của giáo hội tại Samarkand, đức tin Mani sẽ được tái sinh và lan truyền đến một dân tộc mới!#!"
  establish_yamagate_in_samarkand_decision_tooltip:1 "Tuyên bố một thánh địa mới ở phương Đông"
  establish_yamagate_in_samarkand_decision_confirm:0 "$manichean$ được tái sinh!"

  hof_exists_tt:1 "[head_of_faith|E] của Ngài phải tồn tại"
  samarkand_held_by_you_or_vassal_tt:0 "$c_samarkand$ phải do Ngài hoặc một [vassal|E] nắm giữ"
