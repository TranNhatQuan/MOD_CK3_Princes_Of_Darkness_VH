l_english:
  elder_events.1000.t: "Người Từng Quen"
  elder_events.1000.desc: "\"[confusion_target.GetFirstName], [elder.Custom2('RelationToMeShort', SCOPE.sC('confusion_target'))] yêu dấu của ta — thật vui khi được gặp con!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] của ta, [elder.GetFirstName], nhìn thẳng vào mắt ta, một thoáng bất định hiện lên sau nụ cười của [elder.GetHerHis]. \"Con luôn là đứa [confusion_target.Custom('ComplimentAdjective')] nhất. Đó là lý do tại sao ta yêu con nhất.\"\n\nTrong tâm trí [GetTrait('withering_mind').GetName( GetNullCharacter )] của [elder.GetHerHis], hôm nay ta lại là [confusion_target.Custom('SisterBrother')] của chính mình...\n\nNgày mai, có lẽ ta sẽ chỉ là một người lạ."
  elder_events.1000.a: "Xin người, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] — con là [ROOT.Char.GetFirstNameNoTooltip] mà!"
  elder_events.1000.b: "Cái... vâng, con cũng rất vui được gặp người..."
  elder_events.1100.t: "Nấc Thang Dẫn Đến..."
  elder_events.1100.desc: "Đã bao nhiêu lần ta leo lên những bậc thang này. Vậy mà tại sao hôm nay cảm giác như đang chinh phục những ngọn núi vùng [mountain_reference.GetName]?\n\nĐôi chân ta run rẩy. Đầu gối ta khuỵu xuống. Chẳng có gì để bấu víu lấy.\n\nTa nhào lộn thẳng xuống dưới."
  elder_events.1100.a: "Áááá!"
  elder_events.1100.bodyguard: "Cứu với! Cứu ta với!"
  EVENT_WINDOW_OPTION_AVAILABLE_BODYGUARD: "Lựa chọn này khả dụng vì Ngài có một [GetCourtPositionType('bodyguard_court_position').GetName()]"
  EVENT_WINDOW_OPTION_AVAILABLE_TUTOR: "Lựa chọn này khả dụng vì Ngài có một [GetCourtPositionType('court_tutor_court_position').GetName()]"
  partially_mute_modifier: "Á khẩu một phần"
  partially_mute_modifier_desc: "Nhân vật này gặp khó khăn lớn trong việc phát âm do các bệnh lý liên quan đến tuổi già."
  elder_events.1200.t: "Tê Liệt"
  elder_events.1200.desc: "Nó ập đến không một lời cảnh báo. Nửa thân trái của ta tê dại. Ta cố mỉm cười, nhưng đôi môi chẳng chịu cử động.\n\nTa cố nói. Nhưng không thể.\n\nCuối cùng, giọng nói cũng trở lại. Nhưng nỗi sợ hãi về [ROOT.Char.GetFaith.NegativeAfterLife] vẫn còn đó."
  elder_events.1200.a: "..."
  elder_events.1300.t: "Những Bài Học Đã Quên"
  elder_events.1300.desc: "Ta đã đọc những cuộn giấy về [ROOT.Char.Custom('education_scroll_subject')] này chưa? Ta... ta không thể nhớ nổi. Có lẽ ta đã đọc rồi?\n\nChắc chắn chúng từng là một phần trong nghiên cứu, một phần trong sự giáo dục của ta...\n\nPhải. Sự... giáo dục của ta..."
  elder_events.1300.a: "Chắc nó cũng không quan trọng đến thế đâu..."
  elder_events.1300.tutor: "Ta cần giúp đỡ để nhớ lại."
  elder_events.1400.t: "Một Cuộc Mây Mưa Chất Lượng"
  elder_events.1400.desc: "“Hãy đến giường đi, [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.Custom('RaunchyComplimentNoun')] của em,” [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lover'))] của ta [lover.GetFirstName] [lover.Custom('PurrGrowl')] nói, đôi mắt [lover.GetHerHis] bừng lên dục vọng. “Anh không tò mò chút nào xem [lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')] của anh đã học được những gì sao?”\n\nVới một nụ cười tinh quái, [lover.GetSheHe] cắn môi và chìm vào ga giường.\n\n“Hãy chiếm lấy em. Ngay bây giờ.”"
  elder_events.1400.a: "Ngàn quân cũng không cản được ta!"
  elder_events.1400.b: "Cầu [ROOT.Char.GetFaith.HighGodName] cứu con khỏi [lover.GetWomanMan] này."
  death_best_sex_of_their_life: "đã bị đau tim trong khi đang có cuộc ân ái tuyệt vời nhất trong đời [CHARACTER.GetHerHis]"
  purrs: "thì thầm gợi tình"
  growls: "gầm gừ khát khao"
  raunchy_little: "bé nhỏ"
  raunchy_sweet: "ngọt ngào"
  raunchy_pretty: "xinh xắn"
  raunchy_bold: "táo bạo"
  raunchy_wild: "hoang dại"
  raunchy_fiery: "nồng cháy"
  raunchy_young: "trẻ trung"
  raunchy_eager: "hăm hở"
  elder_events.1500.t: "Cuộc Vui Chết Người"
  elder_events.1500.desc: "“Họ từng gọi em là ‘[lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')]’,” [lover.GetWifeHusband] của ta [lover.GetFirstName] thở dài, một nụ cười nhạt trên đôi môi [lover.GetHerHis]. “Giờ em khó mà leo nổi cầu thang mà không thở hổn hển…”\n\nVới sức sống tuổi trẻ, ta có thể giúp [lover.GetHerHim] nhớ lại cảm giác được khao khát là thế nào.\n\nNhưng… liệu [GetTrait('faltering_heart').GetName( GetNullCharacter )] của [lover.GetHerHis] có chịu nổi không?"
  elder_events.1500.a: "Ta sẽ cho nàng một đêm cuồng nhiệt nhất trong đời!"
  elder_events.1500.b: "Tốt hơn là không nên."
  elder_events.1600.t: "Không Thể Chạy Thoát Thời Gian"
  elder_events.1600.desc: "Ta chạy. Ta phải dừng lại. Đã hụt hơi mất rồi.\nTa từng chạy nhiều vòng quanh [ROOT.Char.Custom('ResidenceBuilding')]...\n\nTa bắt đầu lại. Ta suýt ngã. Ta lại dừng lại, một lần nữa.\n\nKhốn kiếp cái thân xác rệu rã này."
  elder_events.1600.a: "Những ngày tháng chạy nhảy của ta đã chấm dứt."
  elder_events.1600.b: "Ta #EMP phải#! vượt qua cơn đau này."
