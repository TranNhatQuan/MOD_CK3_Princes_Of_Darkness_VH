 trait_ill:0 "Bệnh"
 trait_ill_desc:0 "Dịch thể xấu hoành hành cơ thể nhân vật này, và mức độ nghiêm trọng của căn bệnh vẫn chưa thể xác định."
 trait_ill_character_desc:0 "Dịch thể xấu hoành hành cơ thể [ROOT.GetCharacter.GetFirstNameNoTooltip], và mức độ nghiêm trọng của căn bệnh [ROOT.GetCharacter.GetHerHis] vẫn chưa thể xác định."
 trait_pneumonic:0 "Viêm Phổi"
 trait_pneumonic_desc:0 "Bị hành hạ bởi những cơn ho và choáng váng vì sốt, nhân vật này mắc nhiễm trùng phổi."
