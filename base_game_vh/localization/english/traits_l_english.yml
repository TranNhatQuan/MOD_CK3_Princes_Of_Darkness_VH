 trait_lunatic_1_character_desc:0 "Bị ám ảnh bởi ảo giác, hoang tưởng và suy nghĩ rối loạn, [ROOT.GetCharacter.GetFirstNameNoTooltip] chật vật phân biệt đâu là thật đâu là giả."
