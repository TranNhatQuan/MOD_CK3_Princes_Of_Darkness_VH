 trait_disloyal:0 "Bất Trung"
 trait_disloyal_desc:1 "Nơi người khác nhìn thấy một mối quan hệ, người này nhìn thấy một cơ hội."
 trait_disloyal_character_desc:1 "Nơi người khác nhìn thấy một mối quan hệ, [ROOT.GetCharacter.GetFirstNameNoTooltip] nhìn thấy một cơ hội."

#Stress traits
 trait_drunkard:0 "Bợm Rượu"
 trait_drunkard_desc:0 "Nhân vật này sa vào rượu chè và không ngừng tìm đáy chai."
 trait_drunkard_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sa vào rượu chè và không ngừng tìm đáy chai."
 trait_hashishiyah:0 "Nghiện Hashish"
 trait_hashishiyah_desc:0 "Nhân vật này phụ thuộc vào việc sử dụng hashish để đối phó với căng thẳng trong cuộc sống thường ngày."
 trait_hashishiyah_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] phụ thuộc vào việc sử dụng hashish để đối phó với căng thẳng trong cuộc sống thường ngày."

 trait_rakish:0 "Trác Táng"
 trait_rakish_desc:0 "Nhân vật này dành quá nhiều thời gian trong nhà thổ đến mức nơi đó đã trở thành ngôi nhà thứ hai."
 trait_rakish_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] dành quá nhiều thời gian trong nhà thổ đến mức nơi đó đã trở thành ngôi nhà thứ hai của [ROOT.GetCharacter.GetHerHis]."
 trait_reclusive:0 "Ẩn Dật"
 trait_reclusive_desc:0 "Nhân vật này thường tự cô lập bản thân và sao nhãng trách nhiệm của mình."
 trait_reclusive_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thường tự cô lập [ROOT.GetCharacter.GetHerselfHimself] và sao nhãng trách nhiệm của [ROOT.GetCharacter.GetHerHis]."
 trait_irritable:0 "Cáu Kỉnh"
 trait_irritable_desc:0 "Căng thẳng khiến nhân vật này dễ bùng nổ và nổi cơn thịnh nộ thường xuyên."
 trait_irritable_character_desc:0 "Căng thẳng khiến [ROOT.GetCharacter.GetFirstNameNoTooltip] dễ bùng nổ và nổi cơn thịnh nộ thường xuyên."
 trait_flagellant:0 "Tự Hành Xác"
 trait_flagellant_desc:0 "Sự thanh tẩy từ việc tự quất roi là điều duy nhất khiến nhân vật này cảm thấy khá hơn."
 trait_flagellant_character_desc:0 "Sự thanh tẩy từ việc tự quất roi là điều duy nhất khiến [ROOT.GetCharacter.GetFirstNameNoTooltip] cảm thấy khá hơn."
 trait_profligate:0 "Phung Phí"
 trait_profligate_desc:0 "Thói tiêu xài bốc đồng khiến nhân vật này thường xuyên lãng phí tiền bạc vào những thứ không cần thiết."
 trait_profligate_character_desc:0 "Thói tiêu xài bốc đồng khiến [ROOT.GetCharacter.GetFirstNameNoTooltip] thường xuyên lãng phí tiền bạc vào những thứ không cần thiết."
 trait_improvident:0 "Hoang Tán"
 trait_improvident_desc:0 "Nhân vật này thường xuyên quyên góp nhiều tiền cho từ thiện hơn mức họ có thể chi trả hợp lý."
 trait_improvident_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thường xuyên quyên góp nhiều tiền cho từ thiện hơn mức [ROOT.GetCharacter.GetSheHe] có thể chi trả hợp lý."
 trait_contrite:0 "Ăn Năn"
 trait_contrite_desc:0 "Nhân vật này mang mặc cảm tội lỗi, thường cảm thấy bị thôi thúc phải thú nhận những điều lẽ ra nên giữ kín."
 trait_contrite_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] mang mặc cảm tội lỗi, thường cảm thấy bị thôi thúc phải thú nhận những điều lẽ ra nên giữ kín."
 trait_comfort_eater:0 "Ăn Uống Giải Sầu"
 trait_comfort_eater_desc:0 "Nhân vật này thường cố lấp đầy sự trống rỗng trong lòng bằng cách chìm đắm vào những món ăn an ủi."
 trait_comfort_eater_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thường cố lấp đầy sự trống rỗng mà [ROOT.GetCharacter.GetSheHe] cảm thấy bằng cách chìm đắm vào những món ăn an ủi."
 trait_inappetetic:0 "Chán Ăn"
 trait_inappetetic_desc:0 "Căng thẳng đã phá hỏng khẩu vị của nhân vật này, khiến họ bỏ bữa và dần suy kiệt..."
 trait_inappetetic_character_desc:0 "Căng thẳng đã phá hỏng khẩu vị của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip], khiến [ROOT.GetCharacter.GetHerHim] bỏ bữa và dần suy kiệt..."
 trait_journaller:0 "Viết Nhật Ký"
 trait_journaller_desc:0 "Nhân vật này bắt đầu viết ra những suy nghĩ ám ảnh mình để dễ kiểm soát chúng hơn."
 trait_journaller_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] bắt đầu viết ra những suy nghĩ ám ảnh [ROOT.GetCharacter.GetHerHim] để dễ kiểm soát chúng hơn."
 trait_confider:0 "Tâm Sự"
 trait_confider_desc:0 "Chia sẻ vấn đề của mình với một người Ngài tâm giao thân cận, nhân vật này có thể xoay xở cuộc sống tốt hơn nhiều so với khi một mình."
 trait_confider_character_desc:0 "Chia sẻ vấn đề của [ROOT.GetCharacter.GetHerHis] với một người Ngài tâm giao thân cận, [ROOT.GetCharacter.GetFirstNameNoTooltip] có thể xoay xở cuộc sống tốt hơn nhiều so với khi [ROOT.GetCharacter.GetSheHe] chỉ có một mình."
 trait_athletic:0 "Cường Tráng"
 trait_athletic_desc:0 "Tập luyện thường xuyên giúp nhân vật này giữ đầu óc tỉnh táo và giải tỏa căng thẳng."
 trait_athletic_character_desc:0 "Tập luyện thường xuyên giúp [ROOT.GetCharacter.GetFirstNameNoTooltip] giữ đầu óc tỉnh táo và giải tỏa căng thẳng."
 trait_burdened: "Nặng Gánh"
 trait_burdened_desc: "Thành công học thuật luôn lảng tránh nhân vật này, con đường của họ đầy chông gai. Để thoát khỏi cảm giác kém cỏi dai dẳng, họ để tâm trí mình trôi dạt về những đám mây mềm mại phía trên."
 trait_burdened_character_desc: "Thành công học thuật luôn lảng tránh [ROOT.GetCharacter.GetFirstNameNoTooltip], con đường của [ROOT.GetCharacter.GetHerHis] đầy chông gai. Để thoát khỏi cảm giác kém cỏi dai dẳng, [ROOT.GetCharacter.GetSheHe] để tâm trí [ROOT.GetCharacter.GetHerHis] trôi dạt về những đám mây mềm mại phía trên."

