 trait_golden_lineage: "Huyết Thống Hoàng Kim"
 trait_golden_lineage_desc: "Những gì huyết mạch của nhân vật này đã tạo nên trên thế giới không thể bị lãng quên. Họ là hậu duệ hoàng kim của lửa và chinh phục."
 trait_golden_lineage_character_desc: "Những gì huyết mạch của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] đã tạo nên trên thế giới không thể bị lãng quên. [ROOT.GetCharacter.GetSheHe|U] là hậu duệ hoàng kim của lửa và chinh phục."
