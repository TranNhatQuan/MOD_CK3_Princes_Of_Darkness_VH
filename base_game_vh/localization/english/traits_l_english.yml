 trait_great_pox:0 "Đại Hoa Liễu"
 trait_great_pox_desc:0 "Bị hành hạ bởi các vết loét và viêm nhiễm, nhân vật này mắc bệnh hoa liễu."
 trait_great_pox_character_desc:0 "Bị hành hạ bởi các vết loét và viêm nhiễm, [ROOT.GetCharacter.GetFirstNameNoTooltip] mắc bệnh hoa liễu."
 trait_lovers_pox:0 "Hoa Liễu"
 trait_lovers_pox_desc:0 "Được đánh dấu bởi mụn nước và nhiễm trùng, nhân vật này mắc bệnh lây qua đường tình dục."
 trait_lovers_pox_character_desc:0 "Được đánh dấu bởi mụn nước và nhiễm trùng, [ROOT.GetCharacter.GetFirstNameNoTooltip] mắc bệnh lây qua đường tình dục."
 trait_leper:0 "Phong Cùi"
 trait_leper_desc:1 "Da của nhân vật này đầy tổn thương và các mảng đổi màu, cho thấy khả năng cảm nhận khoái cảm, đau đớn và các cảm giác khác đã suy giảm."
 trait_leper_character_desc:1 "Da của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] đầy tổn thương và các mảng đổi màu, cho thấy khả năng cảm nhận khoái cảm, đau đớn và các cảm giác khác đã suy giảm."
 trait_wounded_1:0 "Bị Thương"
 trait_wounded_1_desc:0 "Nhân vật này đã bị thương, nhưng có lẽ sẽ hồi phục ổn nếu có thời gian."
