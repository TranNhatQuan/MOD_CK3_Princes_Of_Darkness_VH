#Education Traits
 trait_education_intrigue_1:0 "Kẻ Âm Mưu Non Tay"
 trait_education_intrigue_1_desc:0 "Kẻ Âm Mưu Non Tay đã được đào tạo đôi chút về nghệ thuật mưu lược, nhưng mọi kiến thức thực sự về lĩnh vực này dường như vẫn ngoài tầm với."
 trait_education_intrigue_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã được đào tạo đôi chút về nghệ thuật mưu lược, nhưng mọi kiến thức thực sự về lĩnh vực này dường như vẫn ngoài tầm với của [ROOT.GetCharacter.GetHerHim]."
 trait_education_intrigue_2:0 "Kẻ Lừa Lọc Phô Trương"
 trait_education_intrigue_2_desc:0 "Kẻ Lừa Lọc Phô Trương đã được đào tạo về nghệ thuật mưu lược, nhưng vẫn còn nhiều điều phải học trước khi sai lầm và sơ suất không còn là chuyện thường tình."
 trait_education_intrigue_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã được đào tạo về nghệ thuật mưu lược, nhưng vẫn còn nhiều điều phải học trước khi sai lầm và sơ suất không còn là chuyện thường tình."
 trait_education_intrigue_3:0 "Bậc Thầy Dệt Mưu"
 trait_education_intrigue_3_desc:0 "Bậc Thầy Dệt Mưu là bậc thầy về âm mưu, thao túng và giữ bí mật."
 trait_education_intrigue_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] là bậc thầy về âm mưu, thao túng và giữ bí mật."
 trait_education_intrigue_4:0 "Bóng Ma Khó Nắm Bắt"
 trait_education_intrigue_4_desc:0 "Bóng Ma Khó Nắm Bắt xuất sắc với vai trò bậc thầy mưu lược, và màn che bí mật bao quanh họ là vô song."
 trait_education_intrigue_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] xuất sắc với vai trò bậc thầy mưu lược, và màn che bí mật bao quanh [ROOT.GetCharacter.GetHerHim] là vô song."
 trait_education_intrigue_5: "Chủ Nhân Giật Dây Xảo Quyệt"
 trait_education_intrigue_5_desc: "Chủ Nhân Giật Dây Xảo Quyệt là tiếng thì thầm trong gió, là cái bóng trên tường. Con dao của họ làm thay điều mà lời nói không thể."
 trait_education_intrigue_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] là tiếng thì thầm trong gió, là cái bóng trên tường. Con dao của họ làm thay điều mà lời nói không thể."
 trait_education_diplomacy_1:0 "Kẻ Nhượng Bộ Ngây Thơ"
 trait_education_diplomacy_1_desc:0 "Kẻ Nhượng Bộ Ngây Thơ được đào tạo phần nào về nghệ thuật ngoại giao nhưng thường xuyên khiến bản thân và những người xung quanh phải xấu hổ."
 trait_education_diplomacy_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] được đào tạo phần nào về nghệ thuật ngoại giao nhưng thường xuyên khiến [ROOT.GetCharacter.GetHerselfHimself] và những người xung quanh [ROOT.GetCharacter.GetHerHim] phải xấu hổ."
 trait_education_diplomacy_2:0 "Nhà Thương Thuyết Tạm Ổn"
 trait_education_diplomacy_2_desc:0 "Mọi việc thường diễn ra có lợi cho Nhà Thương Thuyết Tạm Ổn, nhưng đó là nhờ kỹ năng ngoại giao hay may mắn thì vẫn còn gây tranh cãi."
 trait_education_diplomacy_2_character_desc:0 "Mọi việc thường diễn ra có lợi cho [ROOT.GetCharacter.GetFirstNameNoTooltip], nhưng đó là nhờ kỹ năng ngoại giao của [ROOT.GetCharacter.GetHerHis] hay may mắn thì vẫn còn gây tranh cãi."
 trait_education_diplomacy_3:0 "Nhà Đàm Phán Lôi Cuốn"
 trait_education_diplomacy_3_desc:0 "Bậc thầy về hùng biện thuyết phục và sự tinh tế trong ngoại giao; Nhà Đàm Phán Lôi Cuốn là một nhà ngoại giao xuất sắc."
 trait_education_diplomacy_3_character_desc:0 "Bậc thầy về hùng biện thuyết phục và sự tinh tế trong ngoại giao; [ROOT.GetCharacter.GetFirstNameNoTooltip] là một nhà ngoại giao xuất sắc."
 trait_education_diplomacy_4:0 "Quyền Thần Đứng Sau"
 trait_education_diplomacy_4_desc:0 "Am hiểu sự tinh tế của ngoại giao như lòng bàn tay, Quyền Thần Đứng Sau là bậc thầy của nghệ thuật này."
 trait_education_diplomacy_4_character_desc:0 "Thông thạo các sắc thái của ngoại giao như lòng bàn tay, [ROOT.GetCharacter.GetFirstNameNoTooltip] là một bậc thầy trong lĩnh vực này."
 trait_education_diplomacy_5: "Trọng Tài Xuất Chúng"
 trait_education_diplomacy_5_desc: "Chiếc lưỡi bạc của Trọng Tài Xuất Chúng có thể làm mềm những trái tim cứng rắn nhất và mở ra những cánh cửa kiên cố nhất."
 trait_education_diplomacy_5_character_desc: "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] có chiếc lưỡi bạc có thể làm mềm những trái tim cứng rắn nhất và mở ra những cánh cửa kiên cố nhất."
 trait_education_stewardship_1:0 "Kẻ Hoang Phí Trụy Lạc"
 trait_education_stewardship_1_desc:0 "Kẻ Hoang Phí Trụy Lạc được đào tạo về quản trị để nghiên cứu dòng chảy của tiền bạc, nhưng đáng tiếc thay dòng chảy ấy dường như chỉ đi theo một hướng..."
 trait_education_stewardship_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] được đào tạo về quản trị để nghiên cứu dòng chảy của tiền bạc, nhưng đáng tiếc thay dòng chảy ấy dường như chỉ đi theo một hướng..."
 trait_education_stewardship_2:0 "Viên Thư Lại Tằn Tiện"
 trait_education_stewardship_2_desc:0 "Viên Thư Lại Tằn Tiện làm việc khá ổn trong đầu tư và hành chính, nhưng sai sót trong nghệ thuật quản trị vẫn là chuyện thường tình."
 trait_education_stewardship_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] làm việc khá ổn trong đầu tư và hành chính, nhưng sai sót trong nghệ thuật quản trị vẫn là chuyện thường tình."
 trait_education_stewardship_3:0 "Nhà Gây Dựng Cơ Nghiệp"
 trait_education_stewardship_3_desc:0 "Nhà Gây Dựng Cơ Nghiệp sở hữu trực giác nhạy bén trong mọi vấn đề liên quan đến quản trị và là một thế lực hành chính đáng gờm."
 trait_education_stewardship_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sở hữu trực giác nhạy bén trong mọi vấn đề liên quan đến quản trị và là một thế lực hành chính đáng gờm."
 trait_education_stewardship_4:0 "Bàn Tay Midas"
 trait_education_stewardship_4_desc:0 "Bàn Tay Midas liên tiếp đạt được thành công trong nghệ thuật quản trị, thể hiện sự làm chủ không thể chối cãi."
 trait_education_stewardship_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] liên tiếp đạt được thành công trong nghệ thuật quản trị, thể hiện sự làm chủ không thể chối cãi."
 trait_education_stewardship_5: "Quân Chủ Hoàng Kim"
 trait_education_stewardship_5_desc: "Quân Chủ Hoàng Kim có thể biến một cơ nghiệp sắp sụp đổ thành thịnh vượng chỉ với chút ít quan tâm, của cải sinh sôi nơi từng tồn tại cảnh khánh kiệt."
 trait_education_stewardship_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] có thể biến một cơ nghiệp sắp sụp đổ thành thịnh vượng chỉ với chút ít quan tâm, của cải sinh sôi nơi từng tồn tại cảnh khánh kiệt."
 trait_education_martial_1:0 "Chiến Binh Lạc Lối"
 trait_education_martial_1_desc:0 "Chiến Binh Lạc Lối được đào tạo về nghệ thuật chiến tranh, nhưng có lẽ dễ tự làm hại mình hơn là gây hại cho kẻ thù."
 trait_education_martial_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] được đào tạo về nghệ thuật chiến tranh, nhưng có lẽ dễ tự làm hại [ROOT.GetCharacter.GetHerselfHimself] hơn là kẻ thù của [ROOT.GetCharacter.GetHerHis]."
 trait_education_martial_2:0 "Người Lính Gan Lì"
 trait_education_martial_2_desc:0 "Người Lính Gan Lì đã thể hiện chút năng lực trong quân sự, nhưng vẫn còn nhiều điều phải học."
 trait_education_martial_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã thể hiện chút năng lực trong quân sự, nhưng vẫn còn nhiều điều phải học."
 trait_education_martial_3:0 "Nhà Chiến Thuật Lão Luyện"
 trait_education_martial_3_desc:0 "Nhà Chiến Thuật Lão Luyện là một chỉ huy đáng tin cậy và chiến binh đáng sợ, nổi danh vì tài năng quân sự."
 trait_education_martial_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] là một chỉ huy đáng tin cậy và chiến binh đáng sợ, nổi danh vì tài năng quân sự của [ROOT.GetCharacter.GetHerHis]."
 trait_education_martial_4:0 "Đại Chiến Lược Gia"
 trait_education_martial_4_desc:0 "Chiến trường là lãnh địa của Đại Chiến Lược Gia, và không vấn đề quân sự nào vượt ngoài hiểu biết của họ."
 trait_education_martial_4_character_desc:0 "Chiến trường là lãnh địa của [ROOT.GetCharacter.GetFirstNameNoTooltip], và không vấn đề quân sự nào vượt ngoài hiểu biết của [ROOT.GetCharacter.GetHerHis]."
 trait_education_martial_5: "Chiến Vương Tôn Quý"
 trait_education_martial_5_desc: "Chiến Vương Tôn Quý vượt qua những nghịch cảnh tưởng chừng không thể trên chiến trường một cách dễ dàng, xoay chuyển cả chiến dịch chỉ bằng một nước đi chuẩn xác."
 trait_education_martial_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] vượt qua những nghịch cảnh tưởng chừng không thể trên chiến trường một cách dễ dàng, xoay chuyển cả chiến dịch chỉ bằng một nước đi chuẩn xác."
 trait_education_martial_prowess_1:0 "Tiểu Hiệp Vụng Về"
 trait_education_martial_prowess_1_desc:0 "Tiểu Hiệp Vụng Về chỉ là hiệp sĩ trên danh nghĩa, nhớ được rất ít từ quá trình huấn luyện chính quy."
 trait_education_martial_prowess_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] chỉ là hiệp sĩ trên danh nghĩa, nhớ được rất ít từ quá trình huấn luyện chính quy của [ROOT.GetCharacter.GetHerHis]."
 trait_education_martial_prowess_2:0 "Hiệp Sĩ Tự Tin"
 trait_education_martial_prowess_2_desc:0 "Hiệp Sĩ Tự Tin am hiểu lối chiến đấu truyền thống của nền văn hóa mình, thậm chí từng tham chiến vài trận với nông dân nổi loạn khi còn trẻ."
 trait_education_martial_prowess_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] am hiểu lối chiến đấu truyền thống của nền văn hóa [ROOT.GetCharacter.GetHerHis], thậm chí từng tham chiến vài trận với nông dân nổi loạn khi còn trẻ."
 trait_education_martial_prowess_3:0 "Kỵ Sĩ Lão Luyện"
 trait_education_martial_prowess_3_desc:0 "Kỵ Sĩ Lão Luyện đã chỉ huy binh lính và chiến đấu với thảo khấu ngay cả trước khi trưởng thành, Ta luyện thành một chiến binh kiên định."
 trait_education_martial_prowess_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã dẫn dắt quân đội và chiến đấu với cướp bóc ngay cả trước khi [ROOT.GetCharacter.GetHerHis] đến tuổi trưởng thành, rèn luyện bản thân trở thành một chiến binh quyết liệt."
 trait_education_martial_prowess_4:0 "Dũng Sĩ Lừng Danh"
 trait_education_martial_prowess_4_desc:0 "Dũng Sĩ Lừng Danh được biết đến, kính trọng, và thậm chí bị e sợ khắp vương quốc như hình mẫu cho truyền thống võ dũng của nền văn hóa mình."
 trait_education_martial_prowess_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] được biết đến, kính trọng, và thậm chí bị e sợ khắp vương quốc như hình mẫu cho truyền thống võ dũng của [ROOT.Char.GetCulture.GetName]."
 trait_education_martial_prowess_5: "Lưỡi Kiếm Thủy Ngân"
 trait_education_martial_prowess_5_desc: "Tài nghệ chiến đấu của Lưỡi Kiếm Thủy Ngân được nhắc đến bằng giọng thì thầm, chỉ riêng tên tuổi họ cũng đủ khiến cả những cựu binh dày dạn nhất phải chùn bước."
 trait_education_martial_prowess_5_character_desc: "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] tài nghệ chiến đấu được nhắc đến bằng giọng thì thầm, chỉ riêng tên tuổi họ cũng đủ khiến cả những cựu binh dày dạn nhất phải chùn bước."
 trait_education_learning_1:0 "Thư Lại Tận Tâm"
 trait_education_learning_1_desc:0 "Dù được giáo dục chú trọng vào học vấn, Thư Lại Tận Tâm lại tỏ ra ít năng khiếu với lĩnh vực này — ít nhất họ vẫn biết đọc..."
 trait_education_learning_1_character_desc:0 "Dù được giáo dục chú trọng vào học vấn, [ROOT.GetCharacter.GetFirstNameNoTooltip] lại tỏ ra ít năng khiếu với lĩnh vực này — ít nhất [ROOT.GetCharacter.GetSheHe] vẫn biết đọc..."
 trait_education_learning_2:0 "Nhà Tư Tưởng Sâu Sắc"
 trait_education_learning_2_desc:0 "Nhà Tư Tưởng Sâu Sắc khá am hiểu các vấn đề thần học, nhưng đáng tiếc cả kỹ năng lẫn sự tận tâm dường như vẫn còn thiếu."
 trait_education_learning_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] khá am hiểu các vấn đề thần học, nhưng đáng tiếc cả kỹ năng lẫn sự tận tâm dường như vẫn còn thiếu."
 trait_education_learning_3:0 "Học Giả Uyên Thâm"
 trait_education_learning_3_desc:0 "Học Giả Uyên Thâm sở hữu hiểu biết sâu rộng về thần học, triết học và mọi lĩnh vực học thuật cao cấp."
 trait_education_learning_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sở hữu hiểu biết sâu rộng về thần học, triết học và mọi lĩnh vực học thuật cao cấp."
 trait_education_learning_4:0 "Triết Gia Lỗi Lạc"
 trait_education_learning_4_desc:0 "Triết Gia Lỗi Lạc sở hữu trực giác phi thường trong mọi lĩnh vực học thuật cao cấp."
 trait_education_learning_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sở hữu trực giác phi thường trong mọi lĩnh vực học thuật cao cấp."
 trait_education_learning_5: "Nhà Hiền Triết Uyên Bác"
 trait_education_learning_5_desc: "Kiến thức của Nhà Hiền Triết Uyên Bác về cả thần thánh lẫn thế tục là vô song, lời khuyên của họ được giới học giả và bậc hiền tài khắp nơi tìm đến."
 trait_education_learning_5_character_desc: "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] kiến thức về cả thần thánh lẫn thế tục là vô song, lời khuyên của họ được giới học giả và bậc hiền tài khắp nơi tìm đến."

#Lifestyle Traits
 trait_diplomat:0 "Nhà Ngoại Giao"
 trait_diplomat_desc:0 "Nhà Ngoại Giao khéo léo lèo lái những vùng nước hiểm nguy của các tương tác xã hội, và đạt được mục tiêu của mình bằng sức hút rực rỡ cùng niềm tin vững chắc khi hòa giải giữa những vị quân vương quyền thế nhất trong thiên hạ."
 trait_diplomat_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] khéo léo lèo lái những vùng nước hiểm nguy của các tương tác xã hội, và đạt được mục tiêu của [ROOT.GetCharacter.GetHerHis] bằng sức hút rực rỡ cùng niềm tin vững chắc khi hòa giải giữa những vị quân vương quyền thế nhất trong thiên hạ."

 trait_family_first:0 "Gia Tộc Trên Hết"
 trait_family_first_neutral:0 "Gia Trưởng"
 trait_family_first_male:0 "Tộc Trưởng"
 trait_family_first_female:0 "Tộc Mẫu"
 trait_family_first_desc:0 "Một người thực sự tận tâm với gia đình và sự hưng thịnh của Nhà mình."
 trait_family_first_character_desc:0 "Một [ROOT.Char.GetWomanMan] thực sự tận tụy với gia đình và sự thịnh vượng của dòng tộc [ROOT.Char.GetHerHis]."

 trait_august:0 "Chí Tôn"
 trait_august_desc:0 "Họ được tôn vinh như một bậc quân vương chân chính, xứng đáng với những đế chế huy hoàng thời cổ!"
 trait_august_character_desc:0 "[ROOT.Char.GetSheHe|U] được tôn vinh như một bậc quân vương chân chính, xứng đáng với những đế chế huy hoàng thời cổ!"

 trait_reveler_1:0 "Kẻ Ham Yến Tiệc"
 trait_reveler_1_desc:0 "Kẻ Ham Yến Tiệc đã nếm trải cuộc sống say sưa của chè chén và trụy lạc, và vẫn còn khao khát nhiều hơn nữa."
 trait_reveler_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã nếm trải cuộc sống say sưa của chè chén và trụy lạc, và vẫn còn khao khát nhiều hơn nữa."
 trait_reveler_2:0 "Tay Chơi Lừng Danh"
 #trait_reveler_2_desc:0 "The Famous Reveler is the life of every gathering, attracting both debauchery and glamor."
 trait_reveler_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] là linh hồn của mọi buổi tụ họp, thu hút cả sự trụy lạc lẫn hào nhoáng."
 trait_reveler_3:0 "Huyền Thoại Yến Tiệc"
 #trait_reveler_3_desc:0 "Food, drink, intoxication of both body and mind — the Legendary Reveler denies themselves nothing and is the nexus of every feast."
 trait_reveler_3_character_desc:0 "Rượu ngon, mỹ thực, cơn say của cả thân xác lẫn tâm trí — [ROOT.GetCharacter.GetFirstNameNoTooltip] không từ chối [ROOT.GetCharacter.GetHerselfHimself] bất cứ điều gì và là trung tâm của mọi đại tiệc."
 trait_blademaster_1:0 "Kiếm Sĩ Tập Sự"
 trait_blademaster_1_desc:0 "Thành thạo trong giao chiến cá nhân — Kiếm Sĩ Tập Sự biết rõ nên đâm bằng đầu nào."
 trait_blademaster_1_character_desc:0 "Thành thạo trong giao chiến cá nhân — [ROOT.GetCharacter.GetFirstNameNoTooltip] biết rõ nên đâm bằng đầu nào."
 trait_blademaster_2:0 "Kiếm Sư"
 #trait_blademaster_2_desc:0 "The Blademaster is a formidable and respected opponent in all kinds of combat."
 trait_blademaster_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] là một đối thủ đáng gờm và được kính trọng trong mọi hình thức chiến đấu."
 trait_blademaster_3:0 "Kiếm Thánh Huyền Thoại"
 #trait_blademaster_3_desc:0 "The prowess of the Legendary Blademaster is the stuff of stories."
 trait_blademaster_3_character_desc:0 "Tài nghệ của [ROOT.GetCharacter.GetFirstNameNoTooltip] là chất liệu của những câu chuyện truyền kỳ."
 trait_hunter_1:0 "Thợ Săn Tập Sự"
 trait_hunter_1_desc:0 "Thợ Săn Tập Sự khéo léo đáp lại tiếng gọi của hoang dã và cây cung."
 trait_hunter_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] khéo léo đáp lại tiếng gọi của hoang dã và cây cung."
 trait_hunter_2:0 "Thợ Săn"
 #trait_hunter_2_desc:0 "The Hunter navigates the wilds with uncanny precision and knowledge."
 trait_hunter_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] băng qua miền hoang dã với độ chính xác và hiểu biết đáng kinh ngạc."
 trait_hunter_3:0 "Bậc Thầy Săn Bắn"
 #trait_hunter_3_desc:0 "The Master Hunter lives for the kill."
 trait_hunter_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sống vì khoảnh khắc hạ gục con mồi."
 trait_strategist:0 "Nhà Chiến Lược"
 trait_strategist_desc:0 "Một học giả tận tụy của nghệ thuật chiến tranh, người có thể xoay chuyển mọi tình thế theo hướng có lợi cho mình."
 trait_strategist_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] là một học giả tận tụy của nghệ thuật chiến tranh, có khả năng xoay chuyển mọi tình thế theo hướng có lợi cho mình."

 trait_overseer:0 "Giám Quản"
 trait_overseer_desc:0 "Sự chỉ đạo, bàn tay cứng rắn và uy quyền để đảm bảo các vấn đề được giải quyết thỏa đáng."
 
 trait_gallant:0 "Hiệp Sĩ Cao Quý"
 trait_gallant_desc:0 "Sự cao quý đích thực không chỉ đến từ huyết thống, mà còn từ những hành động được Ta luyện bởi tinh thần như thép sáng ngời."
 
 trait_architect:0 "Kiến Trúc Sư"
 trait_architect_desc:0 "Những công trình của một người thợ xây lão luyện sẽ trường tồn qua nhiều thế kỷ."
 
 trait_administrator:0 "Nhà Quản Trị"
 trait_administrator_desc:0 "Tổ chức, điều hành và nâng cao hiệu suất — Nhà Quản Trị sẽ hoàn thành công việc."
 trait_administrator_character_desc:0 "Tổ chức, điều hành và nâng cao hiệu suất — [ROOT.GetCharacter.GetFirstNameNoTooltip] sẽ hoàn thành công việc."

 trait_avaricious:0 "Tham Vàng"
 trait_avaricious_desc:0 "Vàng, vàng, vàng! Có lời kêu gọi nào cao hơn, mục tiêu nào cao quý hơn, ngoài việc theo đuổi của cải?"
 
 trait_schemer:0 "Kẻ Mưu Mô"
 trait_schemer_desc:0 "Thấu hiểu và thao túng những điều chi phối người khác — rồi khai thác chúng!"
 trait_schemer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sống để thấu hiểu và thao túng những điều chi phối người khác — rồi khai thác chúng!"
 
 trait_seducer:0 "Kẻ Quyến Rũ"
 trait_seducer_female:0 "Nữ Quyến Rũ"
 trait_seducer_desc:0 "Ham muốn không khó. Thử thách thực sự là #EMP được#! khao khát."
 
 trait_torturer:0 "Kẻ Tra Tấn"
 trait_torturer_desc:0 "Gây ra đau đớn. Nắm giữ sinh mạng của kẻ khác trong tay. Đó mới là quyền lực thực sự."
 
 trait_whole_of_body:0 "Thân Tâm Hợp Nhất"
 trait_whole_of_body_desc:0 "Hiểu rõ bản thân, hiểu giới hạn của mình, và hiểu trọn vẹn tầm với của chính mình."
 
 trait_scholar:0 "Học Giả"
 trait_scholar_desc:0 "Triết học, tự nhiên và tri thức. Thấu hiểu thế giới là cách duy nhất để cai trị nó."
 
 trait_theologian:0 "Thần Học Gia"
 trait_theologian_desc:0 "Thần tính nắm giữ lời giải cho mọi câu hỏi, từ những gì ẩn sâu trong trái tim con người đến những bí ẩn của sự sống."
 
 trait_mystic_female_1:0 "Nữ Hiền Triết"
 trait_mystic_male_1:0 "Hiền Nhân"
 trait_mystic_1_desc:0 "Nhân vật này được biết đến với cách tiếp cận tôn giáo khác thường nhưng thực tế."
 trait_mystic_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] nổi tiếng với cách tiếp cận tôn giáo không theo quy ước, nhưng đầy thực tế."
 trait_mystic_2:0 "Thần Bí Gia"
 #trait_mystic_2_desc:0 "This character is known for their unusual methods for achieving religious ascension."
 trait_mystic_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] được biết đến với những phương pháp khác thường để đạt được sự thăng hoa tôn giáo."
 trait_mystic_3:0 "Kẻ Tạo Phép Màu"
 #trait_mystic_3_desc:0 "Incense, chants, and odd cantrips – this character works miracles through unconventional means."
 trait_mystic_3_character_desc:0 "Hương trầm, thánh ca và những câu chú lạ kỳ – [ROOT.Char.GetFirstNameNoTooltip] tạo nên phép màu bằng những phương thức phi truyền thống."
 trait_physician_1:0 "Thầy Thuốc Tập Sự"
 trait_physician_1_desc:1 "Nhân vật này được đào tạo trong nghệ thuật chữa bệnh."
 trait_physician_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] được đào tạo trong nghệ thuật chữa bệnh."
 trait_physician_2:0 "Thầy Thuốc"
 #trait_physician_2_desc:1 "This character has plenty of experience tending to the sick and wounded."
 trait_physician_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] có nhiều kinh nghiệm chăm sóc người bệnh và thương binh."
 trait_physician_3:0 "Danh Y"
 #trait_physician_3_desc:1 "This character's healing skills are well known in scholarly circles."
 trait_physician_3_character_desc:0 "Kỹ năng chữa bệnh của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] được biết đến rộng rãi trong giới học giả."
 lifestyle_herbalist:0 "Dược Sư Thảo Mộc"
 lifestyle_herbalist_desc:0 "Nhân vật này rất am hiểu về thảo dược, thực vật học và các phương pháp chữa bệnh liên quan đến cây cỏ."
 lifestyle_herbalist_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] rất am hiểu về thảo dược, thực vật học và các phương pháp chữa bệnh liên quan đến cây cỏ."
 lifestyle_gardener:0 "Người Làm Vườn"
 lifestyle_gardener_desc:0 "Nhân vật này biết mọi thứ về vườn tược, cây cối và cách chăm sóc chúng."
 lifestyle_gardener_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] biết mọi thứ về vườn tược, cây cối và cách chăm sóc chúng."
 trait_lifestyle_poet_desc:0 "Nhân vật này thích dành buổi tối để gửi gắm suy nghĩ, cảm xúc và trải nghiệm của mình vào vần điệu và thi ca."
 trait_lifestyle_poet_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thích dành những buổi tối để gieo vần và đặt câu cho những suy nghĩ, cảm xúc và trải nghiệm của [ROOT.GetCharacter.GetHerHis]."

#Personality Traits
 trait_chaste:0 "Trinh Khiết"
 trait_chaste_desc:1 "Nhân vật này không ưa tiếp xúc thân mật, tránh xa những cám dỗ của xác thịt."
 trait_chaste_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] không ưa tiếp xúc thân mật, tránh xa những cám dỗ của xác thịt."
 trait_lustful:0 "Dâm Dục"
 trait_lustful_desc:0 "Những ham muốn xác thịt cháy bỏng trong nội tâm của nhân vật này."
 trait_lustful_character_desc:0 "Những ham muốn xác thịt cháy bỏng trong nội tâm của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]."
 trait_temperate:0 "Tiết Độ"
 trait_temperate_desc:0 "Theo nhân vật này, tốt nhất là nên tận hưởng mọi thứ một cách điều độ."
 trait_temperate_character_desc:0 "Theo [ROOT.GetCharacter.GetFirstNameNoTooltip], tốt nhất là nên tận hưởng mọi thứ một cách điều độ."
 trait_gluttonous:0 "Phàm Ăn"
 trait_gluttonous_desc:0 "Nhân vật này coi thường sự điều độ; họ muốn #EMP tất cả#!."
 trait_gluttonous_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] coi thường sự điều độ; [ROOT.GetCharacter.GetSheHe] muốn #EMP tất cả#!."
 trait_generous:0 "Hào Phóng"
 trait_generous_desc:0 "Những hành động nhân từ và bố thí không hề xa lạ với nhân vật này."
 trait_generous_character_desc:0 "Những hành động nhân từ và bố thí không hề xa lạ với [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_greedy:0 "Tham Lam"
 trait_greedy_desc:0 "Nhân vật này giữ chặt túi tiền của mình và luôn tìm cách làm nó đầy thêm."
 trait_greedy_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] giữ chặt túi tiền của [ROOT.GetCharacter.GetHerHis] và luôn tìm cách làm nó đầy thêm."
 trait_diligent:0 "Chăm Chỉ"
 trait_diligent_desc:0 "Nhân vật này không né tránh công việc khó nhọc."
 trait_diligent_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] không né tránh công việc khó nhọc."
 trait_lazy:0 "Lười Biếng"
 trait_lazy_desc:0 "Con đường dễ dàng nhất trong đời luôn là con đường mà nhân vật này chọn."
 trait_lazy_character_desc:0 "Con đường dễ dàng nhất trong đời luôn là con đường mà [ROOT.GetCharacter.GetFirstNameNoTooltip] chọn."
 trait_wrathful:0 "Nóng Giận"
 trait_wrathful_desc:0 "Nhân vật này dễ nổi giận và thịnh nộ."
 trait_wrathful_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] dễ nổi giận và thịnh nộ."
 trait_calm:0 "Điềm Tĩnh"
 trait_calm_desc:0 "Nhân vật này đón nhận mọi việc một cách bình thản, sống chậm rãi."
 trait_calm_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đón nhận mọi việc một cách bình thản, sống chậm rãi."
 trait_impatient:0 "Nóng Vội"
 trait_impatient_desc:0 "Nhân vật này cho rằng mọi thứ nên diễn ra nhanh chóng: lý tưởng nhất là phải diễn ra #EMP ngay bây giờ#!."
 trait_impatient_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cho rằng mọi thứ nên diễn ra nhanh chóng: lý tưởng nhất là phải diễn ra #EMP ngay bây giờ#!."
 trait_patient:0 "Kiên Nhẫn"
 trait_patient_desc:0 "Chờ đợi và nắm bắt thời cơ là sở trường của nhân vật này."
 trait_patient_character_desc:0 "Chờ đợi và kiên nhẫn nắm bắt thời cơ là sở trường của [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_humble:0 "Khiêm Tốn"
 trait_humble_desc:0 "Nhân vật này không đòi hỏi nhiều ở cuộc sống."
 trait_humble_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] không đòi hỏi nhiều ở cuộc sống."
 trait_arrogant:0 "Kiêu Ngạo"
 trait_arrogant_desc:0 "Nhân vật này không hề nghi ngờ giá trị của bản thân."
 trait_arrogant_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] không hề nghi ngờ giá trị của [ROOT.GetCharacter.GetHerHis]."
 trait_deceitful:0 "Xảo Trá"
 trait_deceitful_desc:0 "Nói dối và lừa lọc là bản tính của nhân vật này."
 trait_deceitful_character_desc:0 "Nói dối và lừa lọc là bản tính của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]."
 trait_honest:0 "Chính Trực"
 trait_honest_desc:0 "Nhân vật này đề cao sự thật và chân thành."
 trait_honest_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đề cao sự thật và chân thành."
 trait_craven:0 "Nhát Gan"
 trait_craven_desc:0 "Nhân vật này không hề thích bị thách thức hay bị dọa sợ."
 trait_craven_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] không hề thích bị thách thức hay bị dọa sợ."
 trait_brave:0 "Dũng Cảm"
 trait_brave_desc:0 "Thử thách hay hiểm nguy, nhân vật này chẳng sợ gì cả."
 trait_brave_character_desc:0 "Thử thách hay hiểm nguy, [ROOT.GetCharacter.GetFirstNameNoTooltip] chẳng sợ gì cả."
 trait_shy:0 "Nhút Nhát"
 trait_shy_desc:0 "Nhân vật này thích tránh né việc giao tiếp với người khác."
 trait_shy_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thích tránh né việc giao tiếp với người khác."
 trait_gregarious:0 "Hòa Đồng"
 trait_gregarious_desc:0 "Nhân vật này thích dành thời gian với người khác."
 trait_gregarious_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thích dành thời gian với người khác."
 trait_ambitious:0 "Tham Vọng"
 trait_ambitious_desc:0 "Nhân vật này biết mình muốn gì và không ngại tìm cách đạt được nó."
 trait_ambitious_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] biết rõ những gì [ROOT.GetCharacter.GetSheHe] muốn, và [ROOT.GetCharacter.GetSheHe] không ngại thử sức để giành lấy nó."
 trait_content:0 "An Phận"
 trait_content_desc:0 "Dù nhiều hay ít, những gì họ có đã là đủ với nhân vật này."
 trait_content_character_desc:0 "Dù nhiều hay ít, những gì [ROOT.GetCharacter.GetSheHe] có đã là đủ với [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_arbitrary:0 "Tùy Tiện"
 trait_arbitrary_desc:0 "Nhân vật này làm theo ý mình và ít quan tâm đến người khác."
 trait_arbitrary_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] làm mọi thứ theo ý mình và ít quan tâm đến người khác."
 trait_just:0 "Công Chính"
 trait_just_desc:0 "Nhân vật này có tinh thần công lý mạnh mẽ."
 trait_just_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] có tinh thần công lý mạnh mẽ."
 trait_cynical:0 "Hoài Nghi"
 trait_cynical_desc:0 "Nhân vật này tin rằng ai cũng hành động vì lợi ích cá nhân."
 trait_cynical_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] tin rằng ai cũng hành động vì lợi ích cá nhân."
 trait_zealous:0 "Sùng Đạo"
 trait_zealous_desc:0 "Niềm tin tôn giáo cháy sáng trong tâm hồn nhân vật này."
 trait_zealous_character_desc:0 "Niềm tin tôn giáo cháy sáng trong tâm hồn của [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_paranoid:0 "Hoang Tưởng"
 trait_paranoid_desc:0 "Nhân vật này nhìn thấy kẻ thù trong mọi bóng tối."
 trait_paranoid_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] nhìn thấy kẻ thù trong mọi bóng tối."
 trait_trusting:0 "Cả Tin"
 trait_trusting_desc:0 "Nhân vật này dễ dàng đặt niềm tin vào người khác."
 trait_trusting_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] rất nhanh chóng đặt niềm tin vào người khác."
 trait_compassionate:0 "Nhân Hậu"
 trait_compassionate_desc:0 "Vừa khoan dung vừa cảm thông, nhân vật này có tấm lòng ấm áp."
 trait_compassionate_character_desc:0 "Vừa khoan dung vừa cảm thông, [ROOT.GetCharacter.GetFirstNameNoTooltip] có tấm lòng ấm áp."
 trait_callous:0 "Lạnh Lùng"
 trait_callous_desc:0 "Bị gọi là vô tâm và máu lạnh, nhân vật này thờ ơ với hầu hết mọi thứ."
 trait_callous_character_desc:0 "Bị gọi là vô tâm và máu lạnh, [ROOT.GetCharacter.GetFirstNameNoTooltip] thờ ơ với hầu hết mọi thứ."
 trait_sadistic:0 "Tàn Bạo"
 trait_sadistic_desc:0 "Ít điều gì mang lại cho nhân vật này nhiều niềm vui bằng nỗi đau của kẻ khác."
 trait_sadistic_character_desc:0 "Ít điều gì mang lại cho [ROOT.GetCharacter.GetFirstNameNoTooltip] nhiều niềm vui bằng nỗi đau của kẻ khác."
 trait_stubborn:0 "Cứng Đầu"
 trait_stubborn_desc:0 "Nhân vật này không lùi bước trước bất cứ điều gì."
 trait_stubborn_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] không lùi bước trước bất cứ điều gì."
 trait_fickle:0 "Thất Thường"
 trait_fickle_desc:0 "Nhân vật này thường xuyên đổi ý, khiến họ khó đoán."
 trait_fickle_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thường xuyên thay đổi ý định, khiến [ROOT.GetCharacter.GetHerHim] trở nên khó đoán."
 trait_vengeful:0 "Thù Dai"
 trait_vengeful_desc:0 "Nhân vật này khó quên những sự xúc phạm hay những kẻ làm hại mình."
 trait_vengeful_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] khó quên những sự xúc phạm hay những kẻ làm hại [ROOT.GetCharacter.GetHerHim]."
 trait_forgiving:0 "Khoan Dung"
 trait_forgiving_desc:0 "Nhân vật này nhanh chóng bỏ qua hầu hết mọi chuyện."
 trait_forgiving_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] nhanh chóng bỏ qua hầu hết mọi chuyện."
 trait_eccentric: "Lập Dị"
 trait_eccentric_desc: "Hành vi của nhân vật này bị người khác xem là thất thường và phi lý, nhưng dường như vẫn có phương pháp trong sự điên rồ đó."
 trait_eccentric_character_desc: "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] bị người khác xem là thất thường và phi lý."
 trait_rowdy:0 "Hiếu Động"
 trait_rowdy_desc:1 "Đứa trẻ này luôn chạy nhảy không ngừng, tràn đầy năng lượng và tinh nghịch. Mỗi khi chúng bày trò gì đó, người khác bị thương cũng không phải chuyện hiếm."
 trait_rowdy_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] luôn chạy nhảy không ngừng, tràn đầy năng lượng và tinh nghịch. Mỗi khi [ROOT.Char.GetSheHe] bày trò gì đó, người khác bị thương cũng không phải chuyện hiếm."
 trait_charming:0 "Duyên Dáng"
 trait_charming_desc:2 "Đứa trẻ này chắc chắn biết cách khiến người khác xoay quanh ngón tay mình. Ngọt ngào và dễ mến, chúng có thể thoát khỏi gần như mọi rắc rối."
 trait_charming_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] chắc chắn biết cách khiến mọi người phải xoay quanh ngón tay mình. [ROOT.Char.GetSheHe|U] rất ngọt ngào và hòa nhã, điều đó cho phép [ROOT.Char.GetHerHim] thoát tội gần như trong mọi chuyện."
 trait_curious:0 "Tò Mò"
 trait_curious_desc:1 "Hiếm khi có khoảnh khắc yên tĩnh với đứa trẻ này. Luôn đặt câu hỏi, chúng tò mò về mọi thứ và mọi người."
 trait_curious_character_desc:0 "Hiếm khi có khoảnh khắc yên tĩnh với [ROOT.Char.GetFirstNameNoTooltip]. Luôn đặt câu hỏi, [ROOT.Char.GetSheHe] tò mò về mọi thứ và mọi người."
 trait_pensive:0 "Trầm Tư"
 trait_pensive_desc:1 "Đứa trẻ này thường chìm trong suy nghĩ, cố gắng hiểu thế giới xung quanh mình. Chúng thường dựa vào sách vở và hệ thống lý luận để lý giải mọi việc."
 trait_pensive_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] thường chìm trong suy nghĩ, cố gắng hiểu thế giới xung quanh [ROOT.Char.GetHerHim]. [ROOT.Char.GetSheHe|U] thường dựa vào sách vở và hệ thống lý luận để lý giải mọi việc."
 trait_bossy:0 "Hách Dịch"
 trait_bossy_desc:1 "Đứa trẻ này thường ra lệnh cho những đứa trẻ khác. Dù quan tâm đến việc mọi thứ được làm đúng cách, nhưng làm theo #EMP ý chúng#! cũng quan trọng không kém."
 trait_bossy_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] thường ra lệnh cho những đứa trẻ khác. Dù [ROOT.Char.GetSheHe] quan tâm đến việc mọi thứ được làm đúng cách, nhưng làm theo #EMP ý [ROOT.Char.GetHerHis]#! cũng quan trọng không kém."

 trait_loyal:0 "Trung Thành"
 trait_loyal_desc:0 "Người này coi trọng các mối quan hệ của mình hơn hầu hết mọi người."
 trait_loyal_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] coi trọng các mối quan hệ của [ROOT.GetCharacter.GetHerHis] hơn hầu hết mọi người."

 TRAIT_FLAG_DESC_join_factions_less:0 "Ít có khả năng tham gia [factions|E] chống lại [liege|E] của mình"
 TRAIT_FLAG_DESC_join_factions_more:0 "Có nhiều khả năng tham gia [factions|E] chống lại [liege|E] của mình"
