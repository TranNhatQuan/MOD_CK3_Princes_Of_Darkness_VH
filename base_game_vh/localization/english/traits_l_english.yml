#Commander Traits
	trait_logistician:0 "Chuyên Gia Hậu Cần"
	trait_logistician_1: "Chuyên Gia Hậu Cần Kinh Nghiệm"
	trait_logistician_2: "Bậc Thầy Tiếp Vận"
	trait_logistician_3: "Đại Sư Hậu Cần"
	trait_logistician_desc:0 "Nếu có một điều mà Chuyên Gia Hậu Cần hiểu rõ, thì đó là cách duy trì nguồn tiếp tế lâu dài — và hiệu quả."
	trait_logistician_character_desc:0 "Nếu có một điều mà [ROOT.GetCharacter.GetFirstNameNoTooltip] hiểu rõ, thì đó là cách duy trì nguồn tiếp tế lâu dài — và hiệu quả."
	trait_track_logistician: "Chuyên Gia Tiếp Vận"
	trait_track_logistician_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách chỉ huy quân đội khi di chuyển trên bản đồ.#!\n\nLàm chủ hậu cần là làm chủ chiến tranh, đảm bảo quân đội không bao giờ suy yếu vào thời khắc quyết định."

	trait_military_engineer:0 "Kỹ Sư Quân Sự"
	trait_military_engineer_1: "Kỹ Sư Kinh Nghiệm"
	trait_military_engineer_2: "Bậc Thầy Công Thành"
	trait_military_engineer_3: "Kẻ Phá Thành"
	trait_military_engineer_desc:0 "Với kiến thức sâu rộng về máy công thành và phòng thủ, Kỹ Sư Quân Sự sẽ không dễ bị cản bước."
	trait_military_engineer_character_desc:0 "Với kiến thức sâu rộng về máy công thành và phòng thủ, [ROOT.GetCharacter.GetFirstNameNoTooltip] sẽ không dễ bị cản bước."
	trait_track_military_engineer: "Chuyên Gia Công Thành"
	trait_track_military_engineer_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách hoàn thành các cuộc vây hãm.#!\n\nTrong chiến tranh, chướng ngại chỉ là thử thách cần vượt qua."

	trait_aggressive_attacker:0 "Kẻ Tấn Công Quyết Liệt"
	trait_aggressive_attacker_1: "Tiên Phong Táo Bạo"
	trait_aggressive_attacker_2: "Tiên Phong Không Khoan Nhượng"
	trait_aggressive_attacker_3: "Tiên Phong Lừng Danh"
	trait_aggressive_attacker_desc:0 "Không gì có thể thỏa mãn Kẻ Tấn Công Quyết Liệt ngoài máu của kẻ thù."
	trait_aggressive_attacker_character_desc:0 "Không gì có thể làm thỏa mãn [ROOT.GetCharacter.GetFirstNameNoTooltip] ngoại trừ máu của kẻ thù [ROOT.GetCharacter.GetHerHis]."
	trait_track_aggressive_attacker: "Chuyên Gia Tấn Công"
	trait_track_aggressive_attacker_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách chủ động mở cuộc tấn công trong giao chiến.#!\n\nPhòng thủ tốt nhất chính là tấn công nhanh và tàn bạo."

	trait_unyielding_defender:0 "Người Phòng Thủ"
	trait_unyielding_defender_1: "Hộ Vệ Kiên Cường"
	trait_unyielding_defender_2: "Người Phòng Thủ Bất Khuất"
	trait_unyielding_defender_3: "Vệ Binh Không Thể Phá Vỡ"
	trait_unyielding_defender_desc:0 "Người Phòng Thủ hiểu một điều trên hết: kẻ thù sẽ không thể tiến xa hơn thế."
	trait_unyielding_defender_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] hiểu một điều trên hết: kẻ thù sẽ không thể tiến xa hơn thế."
	trait_track_unyielding_defender: "Chuyên Gia Phòng Thủ"
	trait_track_unyielding_defender_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách phòng thủ trong giao chiến.#!\n\nMột pháo đài chỉ vững mạnh khi ý chí của những người bên trong không lung lay."

	trait_forder:0 "Kẻ Vượt Sông"
	trait_forder_1: "Trinh Sát Ven Sông"
	trait_forder_2: "Lữ Khách Qua Ngầm"
	trait_forder_3: "Kẻ Phá Sóng"
	trait_forder_desc:1 "Nhân vật này quen thuộc với địa hình gần nước và không chịu phạt Lợi Thế khi tấn công qua eo biển hoặc sông."
	trait_forder_character_desc:1 "[ROOT.GetCharacter.GetFirstNameNoTooltip] quen thuộc với địa hình gần nước và không chịu phạt Lợi Thế khi tấn công qua eo biển hoặc sông."
	trait_track_forder: "Chuyên Gia Sông Nước"
	trait_track_forder_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách chiến đấu tại tỉnh ven biển hoặc ven sông.#!\n\nNơi người khác thấy sông suối, có kẻ nhìn ra con đường dẫn đến chiến thắng."

	trait_flexible_leader:0 "Thủ Lĩnh Linh Hoạt"
	trait_flexible_leader_1: "Người Nhanh Trí"
	trait_flexible_leader_2: "Chỉ Huy Đa Năng"
	trait_flexible_leader_3: "Bậc Thầy Điều Binh"
	trait_flexible_leader_desc:0 "Nhân vật này biết cách giảm Lợi Thế mà quân phòng thủ nhận được từ công sự, địa hình, sông và eo biển."
	trait_flexible_leader_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] biết cách giảm Lợi Thế mà quân phòng thủ nhận được từ công sự, địa hình, sông và eo biển."
	trait_track_flexible_leader: "Ứng Biến Gia"
	trait_track_flexible_leader_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách giao chiến với quân địch.#!\n\nThích nghi là chìa khóa sinh tồn trên mọi chiến trường."

	trait_desert_warrior:0 "Chiến Binh Sa Mạc"
	trait_desert_warrior_1: "Kẻ Chiến Đấu Trên Cồn Cát"
	trait_desert_warrior_2: "Lữ Khách Cát"
	trait_desert_warrior_3: "Tai Ương Của Sa Mạc"
	trait_desert_warrior_desc:0 "Cái nắng thiêu đốt và sức nóng khắc nghiệt của sa mạc không phải là kẻ thù của nhân vật này."
	trait_desert_warrior_character_desc:0 "Cái nắng thiêu đốt và sức nóng khắc nghiệt của sa mạc không phải là kẻ thù của [ROOT.GetCharacter.GetFirstNameNoTooltip]."
	trait_track_desert_warrior: "Chuyên Gia Sa Mạc"
	trait_track_desert_warrior_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách chiến đấu tại địa hình sa mạc, núi sa mạc, ốc đảo hoặc vùng khô hạn.#!\n\nTrong sa mạc rộng lớn và khắc nghiệt, kẻ chịu đựng được sẽ vươn lên trên tất cả."

	trait_jungle_stalker:0 "Kẻ Săn Rừng Rậm"
	trait_jungle_stalker_1: "Kiếm Giữa Dây Leo"
	trait_jungle_stalker_2: "Thợ Săn Tán Rừng"
	trait_jungle_stalker_3: "Bóng Ma Rừng Rậm"
	trait_jungle_stalker_desc:0 "Rừng rậm xanh tốt là đồng minh của nhân vật này."
	trait_jungle_stalker_character_desc:0 "Rừng rậm xanh tốt là đồng minh của [ROOT.GetCharacter.GetFirstNameNoTooltip]."
	trait_track_jungle_stalker: "Chuyên Gia Rừng Rậm"
	trait_track_jungle_stalker_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách chiến đấu trong địa hình rừng rậm.#!\n\nRừng rậm dày đặc che giấu những kẻ làm chủ chiều sâu của nó, sẵn sàng tung đòn từ trong bóng tối."

	trait_reaver:0 "Kẻ Cướp Phá"
	trait_reaver_1: "Kẻ Cướp Bóc"
	trait_reaver_2: "Kẻ Tàn Phá"
	trait_reaver_3: "Nỗi Kinh Hoàng"
	trait_reaver_desc:0 "Kẻ Cướp Phá khao khát chiến lợi phẩm gần như khao khát chiến thắng: bất cứ thứ gì có giá trị, họ đều sẽ tìm ra."
	trait_reaver_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] khao khát chiến lợi phẩm gần như khao khát chiến thắng: bất cứ thứ gì có giá trị, [ROOT.GetCharacter.GetSheHe] đều sẽ tìm ra."
	trait_track_reaver: "Kẻ Đột Kích"
	trait_track_reaver_desc: "#help Ngài tích lũy kinh nghiệm theo hướng này bằng cách cướp phá thành công các khu định cư.#!\n\nNơi kẻ cướp đi qua, thế giới bị tái định hình bởi lửa và chinh phạt."

 trait_reckless:0 "Liều Lĩnh"
 trait_reckless_1: "Kẻ Ưa Mạo Hiểm"
 trait_reckless_2: "Con Bạc Lão Luyện"
 trait_reckless_3: "Trái Tim Hoang Dã"
 trait_reckless_desc:0 "Nếu có lợi thế nào để nắm bắt, vị chỉ huy Liều Lĩnh chắc chắn sẽ chớp lấy."
 trait_reckless_character_desc:0 "Nếu có lợi thế nào để nắm bắt, [ROOT.GetCharacter.GetFirstNameNoTooltip] chắc chắn sẽ chớp lấy."
 trait_track_reckless: "Chỉ Huy Thử Nghiệm"
 trait_track_reckless_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chiến đấu với những đội quân đông hơn mình.#!\n\nVận may mỉm cười với những ai đủ táo bạo để đánh cược tất cả vì vinh quang."

 trait_holy_warrior:0 "Thanh Gươm Trung Tín"
 trait_holy_warrior_1: "Thánh Kiếm"
 trait_holy_warrior_2: "Chiến Binh Thánh"
 trait_holy_warrior_3: "Nhà Vô Địch Đức Tin"
 trait_holy_warrior_desc:0 "Bừng cháy với lòng nhiệt thành chính nghĩa, Thanh Gươm Trung Tín sẽ không nghỉ ngơi cho đến khi mọi Kẻ Ngoại Đạo bị đánh bại."
 trait_holy_warrior_character_desc:0 "Bừng cháy với lòng nhiệt thành chính nghĩa, [ROOT.GetCharacter.GetFirstNameNoTooltip] sẽ không nghỉ ngơi cho đến khi mọi Kẻ Ngoại Đạo bị đánh bại."
 trait_track_holy_warrior: "Kẻ Cuồng Tín"
 trait_track_holy_warrior_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chiến đấu với những người thuộc đức tin khác.#!\n\nVới trái tim được Ta luyện bởi đức tin, không kẻ thù nào quá mạnh, không trận chiến nào quá đáng sợ."

 trait_open_terrain_expert:0 "Chuyên Gia Địa Hình Trống Trải"
 trait_open_terrain_expert_1: "Người Gác Đồng"
 trait_open_terrain_expert_2: "Chiến Lược Gia Vùng Rộng"
 trait_open_terrain_expert_3: "Bậc Thầy Đồng Bằng"
 trait_open_terrain_expert_desc:1 "Những cánh đồng rộng mở và không gian bao la là nơi nhân vật này cảm thấy như ở nhà, và họ nhanh chóng tận dụng điều đó trong chiến trận."
 trait_open_terrain_expert_character_desc:0 "Những cánh đồng rộng mở và không gian bao la là nơi [ROOT.GetCharacter.GetFirstNameNoTooltip] cảm thấy như ở nhà, và họ nhanh chóng tận dụng điều đó trong chiến trận."
 trait_track_open_terrain_expert: "Chuyên Gia Địa Hình Trống"
 trait_track_open_terrain_expert_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chiến đấu ở địa hình đồng bằng, đất nông nghiệp hoặc thảo nguyên.#!\n\nCánh đồng rộng mở mang đến vô vàn cơ hội để cơ động và áp đảo."

 trait_rough_terrain_expert:0 "Chuyên Gia Địa Hình Hiểm Trở"
 trait_rough_terrain_expert_1: "Người Mở Lối"
 trait_rough_terrain_expert_2: "Chiến Thuật Gia Cao Nguyên"
 trait_rough_terrain_expert_3: "Bậc Thầy Đỉnh Núi"
 trait_rough_terrain_expert_desc:0 "Địa hình khó khăn có thể là công cụ lợi hại cho những ai biết tận dụng để giành ưu thế trong chiến trận."
 trait_rough_terrain_expert_character_desc:0 "Địa hình khó khăn có thể là công cụ lợi hại cho những ai biết tận dụng để giành ưu thế trong chiến trận."
 trait_track_rough_terrain_expert: "Chuyên Gia Địa Hình Gồ Ghề"
 trait_track_rough_terrain_expert_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chiến đấu ở địa hình đồi núi, núi cao hoặc đất ngập nước.#!\n\nTrong những địa hình khắc nghiệt nhất, chiến thắng thuộc về kẻ biết vươn lên thách thức."

 trait_forest_fighter:0 "Chiến Binh Rừng"
 trait_forest_fighter_1: "Thợ Săn Rừng"
 trait_forest_fighter_2: "Người Gác Rừng"
 trait_forest_fighter_3: "Bậc Thầy Rừng Sâu"
 trait_forest_fighter_desc:0 "Nơi kẻ khác thấy rừng rậm là chướng ngại, nhân vật này thấy cơ hội."
 trait_forest_fighter_character_desc:0 "Nơi kẻ khác thấy rừng rậm là chướng ngại, [ROOT.GetCharacter.GetFirstNameNoTooltip] thấy cơ hội."
 trait_track_forest_fighter: "Chuyên Gia Rừng"
 trait_track_forest_fighter_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chiến đấu ở địa hình rừng hoặc taiga.#!\n\nGiữa những tán cây, mỗi bóng tối là một tấm khiên, mỗi cành cây là một đồng minh."

 trait_cautious_leader:0 "Thủ Lĩnh Thận Trọng"
 trait_cautious_leader_1: "Chiến Lược Gia Kiên Nhẫn"
 trait_cautious_leader_2: "Chỉ Huy Cảnh Giác"
 trait_cautious_leader_3: "Bậc Thầy Kiên Nhẫn"
 trait_cautious_leader_desc:0 "Một Thủ Lĩnh Thận Trọng cẩn thận tránh mọi rủi ro không cần thiết trong trận chiến, nhưng phải đánh đổi bằng cơ hội tiềm năng."
 trait_cautious_leader_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cẩn thận tránh mọi rủi ro không cần thiết trong trận chiến, nhưng phải đánh đổi bằng cơ hội tiềm năng."
 trait_track_cautious_leader: "Chỉ Huy Truyền Thống"
 trait_track_cautious_leader_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chiến đấu với những đội quân đông hơn mình.#!\n\nSự kiên nhẫn và chính xác đảm bảo mỗi bước đi đều đáng giá và mọi tổn thất được giảm thiểu."

 trait_organizer:0 "Nhà Tổ Chức"
 trait_organizer_1: "Nhà Chiến Thuật"
 trait_organizer_2: "Người Lập Kế Hoạch Chiến Dịch"
 trait_organizer_3: "Bậc Thầy Chiến Dịch"
 trait_organizer_desc:0 "Trong tay người tài giỏi, một đội quân được tổ chức tốt có thể nhanh chóng cơ động vượt mặt kẻ thù trong mọi tình huống."
 trait_organizer_character_desc:0 "Trong tay người tài giỏi, một đội quân được tổ chức tốt có thể nhanh chóng cơ động vượt mặt kẻ thù trong mọi tình huống."
 trait_track_organizer: "Người Hành Quân"
 trait_track_organizer_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chỉ huy quân đội trong lúc di chuyển trên bản đồ.#!\n\nMột lực lượng phối hợp nhịp nhàng sẽ di chuyển nhanh chóng và tung đòn chính xác."

 trait_winter_soldier:0 "Chiến Binh Mùa Đông"
 trait_winter_soldier_1: "Người Gác Băng Giá"
 trait_winter_soldier_2: "Cựu Binh Băng Giá"
 trait_winter_soldier_3: "Bậc Thầy Giá Lạnh"
 trait_winter_soldier_desc:0 "Nhân vật này được Ta luyện bởi cái lạnh buốt giá và biết cách biến nó thành lợi thế."
 trait_winter_soldier_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] được Ta luyện bởi cái lạnh buốt giá và biết cách biến nó thành lợi thế của [ROOT.GetCharacter.GetHerHis]."
 trait_track_winter_soldier: "Kẻ Theo Dấu Mùa Đông"
 trait_track_winter_soldier_desc: "#help Ngài nhận kinh nghiệm cho nhánh này khi chiến đấu tại các tỉnh chịu ảnh hưởng của mùa đông.#!\n\nCái lạnh thấu xương không phải kẻ thù — nó trở thành đồng minh của những ai bền bỉ và kiên cường."

# Commander Traits (cultural traditions)
 trait_sea_raider:0 "Kẻ Cướp Biển"
 trait_sea_raider_desc:0 "Kẻ Cướp Biển không hề sợ hãi sự khắc nghiệt của biển cả, và sử dụng sự táo bạo cùng kỹ năng hàng hải điêu luyện để bất ngờ tập kích những bờ biển không được phòng bị."
 trait_sea_raider_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] không hề sợ hãi sự khắc nghiệt của biển cả, và sử dụng sự táo bạo cùng kỹ năng hàng hải điêu luyện để bất ngờ tập kích những bờ biển không được phòng bị."

 #State traits
 trait_disinherited:0 "Bị Truất Quyền Thừa Kế"
 trait_disinherited_desc:0 "Nhân vật này đã bị [dynast|E] truất quyền thừa kế và không thể thừa kế bất kỳ tước vị nào từ các thành viên khác trong Triều Đại."
 trait_disinherited_character_desc:1 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã bị [ROOT.GetCharacter.GetHerHis] [dynast|E] truất quyền thừa kế và không thể thừa kế bất kỳ tước vị nào từ các thành viên khác trong Triều Đại."
 trait_denounced:0 "Bị Tố Cáo"
 trait_denounced_desc:0 "Nhân vật này đã bị [dynast|E] tố cáo và giờ đây có thể bị bỏ tù bởi bất kỳ thành viên nào khác trong Triều Đại."
 trait_denounced_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã bị [ROOT.GetCharacter.GetHerHis] [dynast|E] tố cáo và giờ đây có thể bị bỏ tù bởi bất kỳ thành viên nào khác trong Triều Đại."
 
 trait_decadent: "Bị Cáo Buộc Sa Đọa"
 trait_decadent_desc: "Nhân vật này đã bị [house_head|E] cáo buộc sa đọa. Dù những cáo buộc đó có đúng hay không, danh tiếng và uy tín của họ đã bị hoen ố nghiêm trọng."
 trait_decadent_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã bị [ROOT.GetCharacter.GetHerHis] [house_head|E] cáo buộc sa đọa. Dù những cáo buộc đó có đúng hay không, danh tiếng và uy tín của [ROOT.GetCharacter.GetHerHis] đã bị hoen ố nghiêm trọng."
 trait_extolled: "Được Tán Dương Bởi Gia Tộc"
 trait_extolled_desc: "Nhân vật này đã được [house_head|E] ca ngợi những đức hạnh của mình. Dù sự chú ý đó có xứng đáng hay không, giờ đây họ khó tránh khỏi ánh mắt soi mói của công chúng."
 trait_extolled_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã được [ROOT.GetCharacter.GetHerHis] [house_head|E] ca ngợi những đức hạnh của [ROOT.GetCharacter.GetHerHis]. Dù sự chú ý đó có xứng đáng hay không, [ROOT.GetCharacter.GetSheHe] giờ đây khó tránh khỏi ánh mắt soi mói của công chúng."
 trait_gallivanter: "Kẻ Ngao Du"
 trait_gallivanter_desc: "Nhân vật này né tránh những trách nhiệm vượt quá những gì họ đã có — thời gian của họ quý giá, và họ không muốn lãng phí nó vào những bổn phận vô nghĩa hay tham vọng hão huyền."
 trait_gallivanter_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] né tránh những trách nhiệm vượt quá những gì [ROOT.GetCharacter.GetSheHe] đã có — thời gian của [ROOT.GetCharacter.GetHerHis] quý giá, và [ROOT.GetCharacter.GetSheHe] không muốn lãng phí nó vào những bổn phận vô nghĩa hay tham vọng hão huyền."

