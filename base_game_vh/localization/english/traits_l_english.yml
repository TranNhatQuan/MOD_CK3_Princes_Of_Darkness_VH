 trait_crusader_king_fallback_desc:0 "Một vị quân chủ chiến binh vĩ đại đã gây dựng vương quốc của mình từ vùng đất của kẻ ngoại đạo."
 
 trait_augustus:0 "Augustus"
 trait_augustus_desc:0 "Nhân vật này là người cai trị hiện tại của Đế Chế La Mã được khôi phục và nắm giữ sự tôn kính xứng đáng với địa vị cao cả ấy."
 trait_augustus_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] là người cai trị hiện tại của Đế Chế La Mã được khôi phục và nắm giữ sự tôn kính xứng đáng với địa vị cao cả ấy."
