 # EP2
 trait_tourney_participant:2 "Kỵ Sĩ Đấu Trường"
 trait_tourney_participant_desc:1 "Nhân vật này đã tham gia các trò chơi võ thuật, rèn luyện kỹ năng chiến tranh và cận chiến."
 trait_tourney_participant_character_desc:1 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã tham gia các trò chơi võ thuật, rèn luyện kỹ năng chiến tranh và cận chiến."
 trait_track_foot:0 "Bộ Chiến"
 trait_track_foot_desc:0 "Cơ thể con người là công cụ tối thượng, và làm chủ nó sẽ giúp Ngài chinh phục thế giới."
 trait_track_horse:0 "Kỵ Mã"
 trait_track_horse_desc:0 "Chiến mã và kỵ sĩ hòa làm một, vinh quang và tự do dưới bầu trời xanh bất tận."
 trait_track_bow:0 "Cung Thủ"
 trait_track_bow_desc:0 "Gân lực của dây cung và của xạ thủ hợp nhất, đưa mũi tên bay trúng đích."
 trait_track_wit:0 "Trí Mưu"
 trait_track_wit_desc:0 "Sức mạnh rồi sẽ phai tàn, sắc đẹp sẽ héo úa, nhưng trí tuệ sắc bén sẽ đưa Ngài vượt qua những tình huống đen tối nhất."

 # REWORKED LIFESTYLES
 trait_lifestyle_hunter_desc:0 "Nhân vật này đã đáp lại tiếng gọi của hoang dã."
 trait_lifestyle_hunter_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã đáp lại tiếng gọi của hoang dã."
 trait_track_hunter:0 "Thợ Săn Lão Luyện"
 trait_track_hunter_desc:0 "Tiếng tù và, tiếng chó săn, con mồi! Dù là cung tên hay bẫy thú, không gì sánh bằng khoảnh khắc hạ gục một dã thú hung tợn!"
 trait_track_falconer:0 "Người Huấn Luyện Chim Săn"
 trait_track_falconer_desc:0 "Không có thú vui nào cao quý hơn săn bắn cùng diều hâu và chim ưng."
 trait_track_lifestyle_mystic:0 "Thần Bí Gia"
 trait_track_lifestyle_mystic_desc:0 "Những bí ẩn của thế giới, cả hữu hình lẫn vô hình, sẽ được hé lộ nếu chiêm nghiệm đủ lâu."
 trait_track_pilgrim:0 "Người Hành Hương"
 trait_track_pilgrim_desc:0 "Bàn chân chai sạn, tay chân rã rời, gương mặt phong sương. Tất cả chỉ là cái giá nhỏ để hoàn thành nghĩa vụ thiêng liêng."
 trait_track_lifestyle_reveler:0 "Kẻ Yến Tiệc"
 trait_track_lifestyle_reveler_desc:0 "Một chén rượu và một tràng cười, bên những người Bạn Tốt. Cuộc sống còn cần gì hơn?"
 trait_track_lifestyle_blademaster:0 "Bậc Thầy Kiếm Thuật"
 trait_track_lifestyle_blademaster_desc:0 "Cả đời rèn luyện một loại vũ khí, để một ngày nào đó sự tinh luyện ấy có thể cứu một mạng người và kết liễu một kẻ khác."
 trait_track_lifestyle_physician:0 "Danh Y"
 trait_track_lifestyle_physician_desc:0 "Cầm máu ở đó, rạch tĩnh mạch ở kia. Tứ dịch rồi sẽ được cân bằng!"
 trait_track_lifestyle_poet: "Thi Ca"
 trait_track_lifestyle_poet_desc:0 "Lời thơ có thể mang lại danh tiếng vĩnh cửu, và ngòi bút có thể sắc bén hơn cả lưỡi kiếm."
 
 # EP3
 trait_governor: "Thống Đốc"
 trait_track_governor: "$trait_governor$"
 trait_track_governor_desc: "Thuế khóa. Đất đai. Binh lính. Mọi thứ đều có thể, và nên, được quản trị một cách hoàn hảo.\n\n#weak [trait|E] này có thể được nâng cấp thông qua các hành động cải thiện [counties|E] đang nắm giữ hoặc mang lại lợi ích cho [realm|E], như giải quyết [governance_issues|E], xây dựng [buildings|E], hoặc chọn một số phương án nhất định trong sự kiện.#!"
 trait_governor_desc: "Nhân vật này đã tích lũy được những kỹ năng quý giá trong vai trò thống đốc."
 trait_governor_3_byz: "Thống Đốc Lão Luyện $duke_administrative_male_byzantine_group$"
 trait_governor_3: "Thống Đốc Lão Luyện"
 trait_governor_2_byz: "Thống Đốc Kinh Nghiệm $duke_administrative_male_byzantine_group$"
 trait_governor_2: "Thống Đốc Kinh Nghiệm"
 trait_governor_1_byz: "$duke_administrative_male_byzantine_group$"
 trait_governor_1_byz_female: "$duke_administrative_female_byzantine_group$"
 trait_governor_1: "Thống Đốc"
 trait_governor_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] là một nhà quản trị và phân xử xuất sắc, khiến [ROOT.GetCharacter.GetHerHim] trở thành lựa chọn hoàn hảo cho vị trí thống đốc."
 trait_governor_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] có nhiều kinh nghiệm quản lý lãnh địa và hoàn thành tốt vai trò thống đốc."
 trait_governor_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã đạt được những kỹ năng quý báu trong vai trò thống đốc của [ROOT.GetCharacter.GetHerHis]."

 trait_gallowsbait: "Tội Phạm Vặt"
 trait_gallowsbait_desc: "Không phải mọi tội ác đều liên quan đến giới quyền quý — nhân vật này đang tạo dựng tiếng tăm như một kẻ phạm pháp nhỏ lẻ."
 trait_gallowsbait_character_desc: "Không phải mọi tội ác đều gây quan tâm cho tầng lớp Cao quý và Thượng lưu — [ROOT.GetCharacter.GetFirstNameNoTooltip] đã tạo tên tuổi cho chính mình như một tên tội phạm vặt."
 trait_track_bandit: "Thảo Khấu"
 trait_track_bandit_desc: "Ánh sáng của luật pháp không vươn xa quá tường thành; ở ngoài kia, kẻ mạnh là lẽ phải."
 trait_track_trickster: "Kẻ Lừa Lọc"
 trait_track_trickster_desc: "Một cái đầu chậm chạp không chỉ là bi kịch — với kẻ thông minh, đó là một #EMP cơ hội#!."
 trait_track_thief: "Đạo Tặc"
 trait_track_thief_desc: "Sở hữu chiếm chín phần mười của luật pháp, suy cho cùng."
 trait_track_poacher: "Kẻ Săn Trộm"
 trait_track_poacher_desc: "Chỉ là một con thú thôi mà. Có hại gì đâu, phải không?"
 trait_track_marauder: "Kẻ Cướp Phá"
 trait_track_marauder_desc: "Bắt cóc và giết chóc ngoài giới thượng lưu thì kém hào nhoáng hơn, nhưng chưa chắc kém phần lợi nhuận."

 trait_despoiler_of_byzantium: "Kẻ Tàn Phá Byzantium"
 trait_despoiler_of_byzantium_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] nằm trong số những lãnh chúa Latin đáng sợ đã chinh phục và hủy hoại một đế chế Kitô giáo cổ đại."
 
 trait_campeador: "Chiến Tướng"
 trait_campeador_desc: "Tài nghệ chiến trường của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] đã mang lại cho [ROOT.GetCharacter.GetHerHim] danh hiệu \"Nhà Vô Địch Chiến Trường\"."

 trait_violet_poet: "Thi Nhân Tím"
 trait_violet_poet_desc: "Điều gì khiến trái tim cất tiếng hát và giọng nói vang dội hơn tình yêu? [ROOT.GetCharacter.GetFirstNameNoTooltip] hiểu rõ điều đó, và làm chủ nó một cách điêu luyện."
 trait_track_violet_poet: "Ngâm Thi Gia"
 trait_track_violet_poet_desc: "Biểu đạt chân thực nhất của một thi nhân không chỉ qua lời nói, mà còn qua tâm hồn và thể xác.\n\n#weak [trait|E] này có thể được nâng cấp bằng hai cách: либо sáng tác thi ca, hoặc bằng những phương thức #UND nồng cháy#! hơn."
 
 trait_knight_errant: "Hiệp Sĩ Lang Thang"
 trait_knight_errant_character: "$knight_culture_player_no_tooltip$ Lang Thang"
 trait_knight_errant_desc: "Một hiệp sĩ lừng danh, nhân vật này bảo vệ kẻ yếu, che chở người tay không, và đánh bại kẻ gian tà."
 trait_knight_errant_character_desc: "Một $knight_culture_player_no_tooltip_lowercase$ lừng danh, [ROOT.GetCharacter.GetFirstNameNoTooltip] bảo vệ kẻ yếu, che chở người tay không, và đánh bại kẻ gian tà."
 trait_track_knight_errant: "Hành Hiệp Trượng Nghĩa"
 trait_track_knight_errant_desc: "Chỉ tự nhận mình chính trực là chưa đủ — phải chứng minh điều đó.\n\n#weak [trait|E] này có thể được nâng cấp bằng cách hoàn thành các [task_contracts|E] thuộc Justicar, Prowess hoặc Martial thể hiện phẩm chất danh dự.#!"

 the_wake: "Kẻ Thức Tỉnh"
 trait_track_the_wake: "Kẻ Rình Rập Đầm Lầy"
 trait_track_the_wake_desc: "Số mệnh dệt nên tấm lưới tinh vi của nó. Những gì thuộc về ta theo lẽ phải sẽ được giành lại bằng sức mạnh.\n\n#weak Trait này có thể được nâng cấp bằng cách đánh bại các [characters|E] thuộc văn hóa #BOL $norman$#! trong [battle|E] hoặc [single_combat_duel_plural|E].#!"
 the_wake_1: "Kẻ Lưu Đày"
 the_wake_2: "Kẻ Ngoài Vòng Pháp Luật"
 the_wake_3: "Đồ Tể"
 the_wake_4: "Bóng Ma Ankou"
 the_wake_5: "$the_wake$"

 the_wake_1_desc: "Tội nghiệp Hereweard trẻ tuổi, vị quý tộc bị lưu đày. Một kẻ không mục đích, trôi dạt vô định. Bao tiềm năng bị bỏ phí."
 the_wake_2_desc: "Đã tìm thấy mục đích, nhưng còn nhiều việc phải làm. Những việc đẫm máu, cho đến khi đầm lầy nhuộm đỏ máu kẻ ngoại lai."
 the_wake_3_desc: "Kẻ tầm thường sẽ sa lầy và chết chìm trong những đầm lầy hôi hám nơi hắn sinh ra. Có người còn thì thầm rằng hắn có thể bước trên mặt bùn lầy, đến vậy là trình độ làm chủ vùng đầm nước."
 the_wake_4_desc: "Trẻ nhỏ run sợ được kể về con quái vật rình rập trong đầm lầy, để chúng không dám rời xa nơi an toàn."
 the_wake_5_desc: "Bóng đen trong hoàng hôn rình rập khắp miền đất, luôn cảnh giác, luôn theo dõi. Hereweard Đẫm Máu, Hereweard Đáng Sợ. Hereweard Kẻ Thức Tỉnh."

 norman_opinion: "Thiện Cảm Người Norman"
 TRAIT_FLAG_DESC_can_raid: "Cho phép [raiding|E]"

 trait_immortal: "Bất Tử"
 trait_immortal_desc: "Nhân vật này vượt lên trên nhân loại, không chịu sự khắc nghiệt của tuổi tác, mục rữa và thời gian."
 trait_immortal_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] vượt lên trên nhân loại, không chịu sự khắc nghiệt của tuổi tác, mục rữa và thời gian."

 # BP3
 trait_lifestyle_wayfarer: "Lữ Hành Gia"
 trait_lifestyle_wayfarer_desc: "Du hành không chỉ là phương tiện để đạt mục đích đối với [ROOT.GetCharacter.GetFirstNameNoTooltip]. Biến mất nhiều ngày liền, [ROOT.GetCharacter.GetSheHe] luôn trở về với những câu chuyện kỳ ảo về vùng đất xa xôi, núi cao, hang tối hay rừng sâu."
 trait_lifestyle_voyager: "Nhà Thám Du"
 trait_lifestyle_voyager_desc: "Những thành phố huy hoàng nhất, những tàn tích xưa cũ, những vị vua và hoàng hậu của những vương quốc xa xôi. [ROOT.GetCharacter.GetFirstNameNoTooltip] đã chứng kiến tất cả và rất vui lòng được chia sẻ những trải nghiệm của [ROOT.GetCharacter.GetHerHis] với người khác."
 trait_lifestyle_surveyor: "Thanh Tra Lãnh Địa"
 trait_lifestyle_surveyor_desc: "Lãnh địa hưng thịnh dưới ánh mắt giám sát của [ROOT.GetCharacter.GetFirstNameNoTooltip]. Với niềm đam mê du hành gắn liền với nghệ thuật cai trị, [ROOT.GetCharacter.GetSheHe] đích thân giám sát chư hầu và giải quyết các thách thức quản lý, đảm bảo một vùng đất phồn vinh và được chăm lo chu đáo."
 trait_lifestyle_surveyor_adventurer_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] nổi tiếng với chuyên môn đi lại khắp vùng đất. Hiểu rõ vùng hoang dã như lòng bàn tay, [ROOT.GetCharacter.GetSheHe] có thể điều hướng xung quanh quân địch, thiết lập những cuộc phục kích đáng sợ hoặc đơn giản là đảm bảo sự di chuyển an toàn từ thành phố này sang thành phố khác."

 #MPO
 trait_nomadic_philosophy: "Đạo Du Mục"
 trait_nomadic_philosophy_desc: "Nhân vật này được Ta luyện từ thuở lọt lòng bởi cuộc sống khắc nghiệt nơi thảo nguyên. Lối sống của họ, dù xa lạ với những dân tộc định cư yếu đuối, lại mang đến sức mạnh và mưu lược vô song.\n\n#weak $nomadic_philosophy_ender$#!"
 trait_nomadic_philosophy_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] được Ta luyện từ thuở lọt lòng bởi cuộc sống khắc nghiệt nơi thảo nguyên. Lối sống của [ROOT.GetCharacter.GetHerHis|U], dù xa lạ với những dân tộc định cư yếu đuối, lại mang đến sức mạnh và mưu lược vô song.\n\n#weak $nomadic_philosophy_ender$#!"
 nomadic_philosophy_ender: "Ta chống lại anh em ta — ta và anh em ta chống lại anh em họ — ta, anh em và anh em họ chống lại các bộ lạc khác — tất cả bộ lạc chống lại thế giới."
 trait_lifestyle_seasoned_pastor: "Mục Dân Lão Luyện"
 trait_lifestyle_seasoned_pastor_desc: "Nhân vật này đã trở thành chuyên gia trong nghệ thuật chăn nuôi và có thể đảm bảo đàn gia súc tận dụng đồng cỏ một cách tối ưu."
 trait_lifestyle_seasoned_pastor_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã trở thành một chuyên gia trong cách chăn nuôi và có thể đảm bảo đàn gia súc của [ROOT.GetCharacter.GetHerHis] tận dụng tốt nhất đồng cỏ."

