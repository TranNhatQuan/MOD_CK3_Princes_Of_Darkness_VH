 # TGP
 trait_track_confucian_education: "Nho Giáo"
 trait_track_confucian_education_desc: "Thông qua tiết độ và nhân ái, chúng ta cùng nhau xây dựng một xã hội tốt đẹp hơn.\n\n#weak [trait|E] này có thể được nâng cấp thông qua tương tác #V $request_mentoring_interaction$#! [character_interaction|E] hoặc các nhiệm vụ [court_position_tasks|E] của #V $grand_mentor_court_position$#! hoặc #V $court_tutor_court_position$#! [court_positions|E]"
 trait_confucian_education_character_desc: "Nhân vật này vừa bắt đầu hành trình hướng tới sự minh triết."
 trait_confucian_education: "Giáo Dục Nho Học"
 trait_confucian_education_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] vừa mới bắt đầu hành trình của [ROOT.GetCharacter.GetHerHis] trên con đường hướng tới sự thông thái."
 trait_confucian_education_1: "Nho Sĩ Chân Chính"
 trait_confucian_education_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã thoáng thấy trí tuệ bao la của Nho Đạo."
 trait_confucian_education_2: "Học Giả Kinh Điển"
 trait_confucian_education_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] khiêm tốn áp dụng những lời dạy của Khổng Tử vào cuộc sống hàng ngày của [ROOT.GetCharacter.GetHerHis]."
 trait_confucian_education_3: "Bậc Đức Hạnh"
 trait_confucian_education_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đang dần thấu hiểu ý nghĩa của việc trở thành một Nho sĩ đức hạnh."
 trait_confucian_education_4: "Khuôn Mẫu Đạo Đức"
 trait_confucian_education_4_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] sống đúng theo Đạo, trở thành tấm gương thực sự."
 trait_confucian_education_5: "Thánh Hiền Vô Khuyết"
 trait_confucian_education_5_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] gần như là một bậc thánh trong giới Nho học. Các Nho sĩ khắp nơi đều biết đến đạo đức và tài năng của [ROOT.GetCharacter.GetHerHis]."
