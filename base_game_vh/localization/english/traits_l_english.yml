 game_concept_clouded_eyes_mitigation: "Mitigate Clouded Eyes"
 game_concept_clouded_eyes_mitigation_desc: "While it's not possible to prevent [GetTrait('clouded_eyes').GetName( GetNullCharacter )] from progressing, you can slow it down by:\n$EFFECT_LIST_BULLET$Avoiding [travel|E]\n$EFFECT_LIST_BULLET$Avoiding locations with [GetTerrain( 'desert' ).GetName] or [GetTerrain( 'desert_mountains' ).GetName] [terrain|E]\n$EFFECT_LIST_BULLET$Avoiding locations with [winter_severity_normal|E] or [winter_severity_harsh|E]"
 game_concept_fragile_bones_mitigation: "Mitigate Fragile Bones"
 game_concept_fragile_bones_mitigation_desc: "While it's not possible to prevent [GetTrait('fragile_bones').GetName( GetNullCharacter )] from progressing, you can prevent large [trait_level_track|E] increases by:\n$EFFECT_LIST_BULLET$Avoiding [travel|E] and [activities|E]\n$EFFECT_LIST_BULLET$Avoiding [Concept( 'commander', 'Commanding Armies' )|E]"
 game_concept_withering_mind_mitigation: "Mitigate Withering Mind"
 game_concept_withering_mind_mitigation_desc: "While it's not possible to prevent [GetTrait('withering_mind').GetName( GetNullCharacter )] from progressing, you can slow it down by:\n$EFFECT_LIST_BULLET$Having [friends|E] #weak (the more, the better)#!\n$EFFECT_LIST_BULLET$Having [lovers|E] #weak (the more, the better)#!\n$EFFECT_LIST_BULLET$Keeping your [stress|E] low\n$EFFECT_LIST_BULLET$Having the [GetTrait('family_first').GetName( GetNullCharacter )] or [GetTrait('seducer').GetName( GetNullCharacter )] [traits|E]\n$EFFECT_LIST_BULLET$[traveling|E] and partaking in [activities|E]\n\nMany of these factors also reduce the chance of getting the [trait|E] in the first place."
 game_concept_infirm_mitigation: "Mitigate Infirmity"
 game_concept_infirm_mitigation_desc: "Staying healthy is the main way to stave off infirmity.\n\nThe [GetTrait('infirm').GetName( GetNullCharacter )] [trait|E] progresses by a full level when contracting an [illness|E], and by a small amount every year.\n\nIf you are sick for a prolonged amount of time, the [trait_level_track|E] will progress much faster each year. It will also progress much faster if you're more than 65 years old."
 game_concept_elder_traits: "Elder Health Traits"
 game_concept_elder_traits_desc: "As [characters|E] grow older, they can gain age-related [traits|E] like [GetTrait('faltering_heart').GetName( GetNullCharacter )] or [GetTrait('fragile_bones').GetName( GetNullCharacter )]. These normally appear around age #V 50#!, but may show up earlier.\n\nYou're less likely to get these traits if you have:\n$BULLET_WITH_TAB$Good [health|E]\n$BULLET_WITH_TAB$[GetTrait('athletic').GetName( GetNullCharacter )], [GetTrait('physique_good_1').GetName( GetNullCharacter )], or [GetTrait('whole_of_body').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$#indent_newline:6 For [GetTrait('withering_mind').GetName( GetNullCharacter )]: [GetTrait('family_first').GetName( GetNullCharacter )], [GetTrait('seducer').GetName( GetNullCharacter )], knowing [languages|E], many [friends|E] and [lovers|E]#!\n\nYou're more likely to get them if you have:\n$BULLET_WITH_TAB$Bad [health|E]\n$BULLET_WITH_TAB$[GetTrait('drunkard').GetName( GetNullCharacter )] or [GetTrait('reclusive').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetModifier( 'obese_modifier' ).GetNameWithTooltip] or [GetModifier( 'malnourished_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$High [stress|E]\n$BULLET_WITH_TAB$Parents or grandparents with the traits"
 trait_incapable:0 "Mất Năng Lực"
 trait_incapable_desc:0 "Do chấn thương thể chất hoặc khuyết tật tinh thần, nhân vật này không thể tự chăm sóc bản thân hay đưa ra quyết định một cách độc lập."
 trait_incapable_character_desc:0 "Do chấn thương thể chất hoặc khuyết tật tinh thần, [ROOT.GetCharacter.GetFirstNameNoTooltip] không thể tự chăm sóc [ROOT.GetCharacter.GetHerselfHimself] hay đưa ra quyết định một cách độc lập."
 trait_gout_ridden:0 "Gút Hành Hạ"
 trait_gout_ridden_desc:0 "Nhân vật này bị hành hạ bởi các khớp sưng tấy, khiến việc di chuyển đau đớn và da nhạy cảm, đỏ ửng."
