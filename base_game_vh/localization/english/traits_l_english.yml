 trait_diplomatic_court_1_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_diplomatic').GetName] nhộn nhịp, đầy rẫy sứ giả và nhà ngoại giao."
 trait_diplomatic_court_2:1 "Cận Thần Ngoại Giao Được Trọng Vọng"
