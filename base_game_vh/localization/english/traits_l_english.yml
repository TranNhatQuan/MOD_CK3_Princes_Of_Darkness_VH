 trait_possessed_1:0 "Bị Quỷ Ám"
 trait_possessed_1_desc:1 "Những thay đổi đột ngột về cảm xúc, nhận thức và khả năng mà nhân vật này trải qua chỉ có thể được giải thích là do linh hồn chiếm giữ cơ thể họ."
 trait_possessed_1_character_desc:0 "Những thay đổi đột ngột về cảm xúc, nhận thức và khả năng mà [ROOT.GetCharacter.GetFirstNameNoTooltip] trải qua chỉ có thể được giải thích là do linh hồn chiếm giữ cơ thể [ROOT.GetCharacter.GetHerHis]."
