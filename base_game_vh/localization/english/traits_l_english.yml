 trait_warlike_court_1_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_warlike').GetName] ồn ào, quy tụ các chiến binh và nhà chiến thuật."
 trait_warlike_court_2:1 "Cận Thần Hiếu Chiến Được Trọng Vọng"
 trait_warlike_court_2_desc:1 "Nhân vật này đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_warlike').GetName] thực sự tráng lệ, gắn bó cùng các chiến binh cao quý và nhà chiến thuật lừng danh."
 trait_warlike_court_2_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã dành ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm sống trong một [GetCourtType('court_warlike').GetName] thực sự hùng vĩ, gắn kết [ROOT.GetCharacter.GetHerselfHimself] với những chiến binh quý tộc và các nhà chiến thuật lỗi lạc."

 trait_administrative_court_1:1 "Cận Thần Hành Chính"
 trait_administrative_court_1_desc:1 "Nhân vật này đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_administrative').GetName] ngăn nắp, nơi quy tụ nhiều quan lại và viên chức."
 trait_administrative_court_1_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_administrative').GetName] ngăn nắp, nơi quy tụ nhiều quan lại và viên chức."
 trait_administrative_court_2:1 "Cận Thần Hành Chính Được Trọng Vọng"
 trait_administrative_court_2_desc:1 "Nhân vật này đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_administrative').GetName] thực sự tráng lệ, chứng kiến công việc thường nhật của các quan lại hiệu quả và viên chức đầy ảnh hưởng."
 trait_administrative_court_2_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_administrative').GetName] thực sự tráng lệ, chứng kiến công việc thường nhật của các quan lại hiệu quả và viên chức đầy ảnh hưởng."

 trait_intrigue_court_1:1 "Cận Thần Mưu Lược"
 trait_intrigue_court_1_desc:1 "Nhân vật này đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_intrigue').GetName] kín tiếng, quy tụ những sứ giả khéo ăn nói và cận vệ tinh anh."
 trait_intrigue_court_1_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_intrigue').GetName] kín tiếng, quy tụ những sứ giả khéo ăn nói và cận vệ tinh anh."
 trait_intrigue_court_2:1 "Cận Thần Mưu Lược Được Trọng Vọng"
 trait_intrigue_court_2_desc:1 "Nhân vật này đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_intrigue').GetName] thực sự tráng lệ, nơi họ học cách luôn cảnh giác giữa vô số sứ giả miệng lưỡi sắc bén và cận vệ tinh tường."
 trait_intrigue_court_2_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã dành ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm sống trong một [GetCourtType('court_intrigue').GetName] thực sự hùng vĩ, nơi [ROOT.GetCharacter.GetSheHe] đã học cách luôn cảnh giác giữa vô số sứ giả dẻo miệng và những người hầu cận tinh ý."

 trait_scholarly_court_1:1 "Cận Thần Học Giả"
 trait_scholarly_court_1_desc:1 "Nhân vật này đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_scholarly').GetName] uyên bác, đầy rẫy học giả và trí thức."
 trait_scholarly_court_1_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_scholarly').GetName] uyên bác, đầy rẫy học giả và trí thức."
 trait_scholarly_court_2:1 "Cận Thần Học Giả Được Trọng Vọng"
 trait_scholarly_court_2_desc:1 "Nhân vật này đã sống ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm trong một [GetCourtType('court_scholarly').GetName] uyên bác, quy tụ những học giả sắc sảo và trí thức đáng kính."
 trait_scholarly_court_2_character_desc:2 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã dành ít nhất [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] năm sống trong một [GetCourtType('court_scholarly').GetName] uyên bác, đầy ắp những [ROOT.GetCharacter.GetWomenMen] học thức nhạy bén và các trí thức đáng kính."

