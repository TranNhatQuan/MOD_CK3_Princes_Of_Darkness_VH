 trait_born_in_the_purple_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] sinh ra trong gia đình quyền quý, cuộc sống giàu sang và kỳ vọng lớn lao."
 trait_berserker:0 "Cuồng Chiến"
 trait_berserker_desc:0 "Một khi máu của nhân vật này sôi lên, chỉ cái chết của kẻ thù mới có thể làm nguôi ngoai."
 trait_berserker_character_desc:0 "Một khi máu của [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] sôi lên, chỉ cái chết của kẻ thù của [ROOT.GetCharacter.GetHerHis] mới có thể làm nguôi ngoai."
 trait_shieldmaiden_female:0 "Nữ Khiên Binh"
 trait_shieldmaidens_female:0 "Các Nữ Khiên Binh"
 trait_shieldmaiden_male:0 "Khiên Binh"
 trait_shieldmaidens_male:0 "Các Khiên Binh"
 trait_shieldmaiden_desc:0 "Nhân vật này thách thức chuẩn mực xã hội của mình, chiến đấu trong tường khiên như bất kỳ chiến binh nào."
 trait_shieldmaiden_female_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thách thức chuẩn mực xã hội của [ROOT.GetCharacter.GetHerHis], chiến đấu trong tường khiên như thể [ROOT.GetCharacter.GetSheHe] là một người đàn ông."
 trait_shieldmaiden_male_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] thách thức chuẩn mực xã hội của [ROOT.GetCharacter.GetHerHis], chiến đấu trong tường khiên như thể [ROOT.GetCharacter.GetSheHe] là một người phụ nữ."
 trait_varangian:0 "Varangian"
 trait_varangian_desc:0 "Nhân vật này đã phục vụ trong Quân đội Byzantine như một thành viên của Vệ binh Varangian."
 trait_varangian_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã phục vụ trong Quân đội Byzantine như một thành viên của Vệ binh Varangian."
 trait_viking_has_longships:0 "Viking"
 trait_viking_fallback:0 "Kẻ Cướp Biển"
 trait_viking_desc:0 "Nhân vật này là kẻ cướp phá nổi tiếng các khu định cư nước ngoài."
 trait_viking_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] là kẻ cướp phá nổi tiếng các khu định cư nước ngoài."
 trait_reincarnation:0 "Tái Sinh"
 trait_reincarnation_desc:0 "Đây không phải lần đầu tiên nhân vật này bước đi trên cõi đời."
 trait_reincarnation_desc_ancestor:0 "[ROOT.Char.GetSheHe|U] được cho là sự tái sinh của [ROOT.Char.GetHerHis] [ROOT.Char.Custom2('RelationToMe', ROOT.Var('reincarnation_of').Char)], [ROOT.Var('reincarnation_of').Char.GetTitledFirstName]."
 trait_adventurer:0 "Nhà Phiêu Lưu Lão Luyện"
 trait_adventurer_desc:0 "Nhân vật này từng sống cuộc đời dũng cảm và hành động như một nhà phiêu lưu, và đã chứng minh giá trị của mình bằng cách vươn lên từ khởi đầu khiêm tốn."
 trait_adventurer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã từng có một cuộc đời dũng cảm và hành động như một nhà thám hiểm, chứng minh giá trị của [ROOT.GetCharacter.GetHerHis] bằng cách nỗ lực đi lên từ khởi đầu khiêm tốn đó."
 trait_adventurer_follower: "Tùy Tùng"
 trait_adventurer_follower_desc: "Nhân vật này từng ở trong trại của một [GetTrait('adventurer').GetName( GetNullCharacter )], trở thành một phần trong đoàn tùy tùng khi họ được phong đất."
 trait_adventurer_follower_remembers_leader_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] đã dành một thời gian trong trại của [ROOT.Var('former_camp_leader').Char.GetTitledFirstNamePossessive] khi [ROOT.Var('former_camp_leader').Char.GetSheHe] là một [GetTrait('adventurer').GetName( GetNullCharacter )], và là một phần trong đoàn tùy tùng của [ROOT.Var('former_camp_leader').Char.GetHerHis] khi [ROOT.Var('former_camp_leader').Char.GetSheHe] được ban đất đai."
 trait_adventurer_follower_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] từng ở trong trại của một [GetTrait('adventurer').GetName( GetNullCharacter )], trở thành một phần trong đoàn tùy tùng khi họ được phong đất."

