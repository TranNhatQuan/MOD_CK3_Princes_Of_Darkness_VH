  great_project_contribution_master_builder_must_have_funded_province: "Ít nhất phải có 1 [province|E] được tài trợ để tiến hành cải thiện"

  great_project_walls_extend_materials_generic: "Vật liệu xây dựng"
  great_project_walls_extend_materials_generic_desc: "Bất kỳ bức tường nào cũng cần một lượng lớn vật liệu xây dựng. Một bức tường với quy mô như vậy đòi hỏi khối lượng vật liệu khổng lồ."
 
  great_project_type_great_wall_extend_to_shanhai_pass: "Mở rộng Vạn Lý Trường Thành đến Sơn Hải Quan"
  great_project_type_great_wall_extend_to_shanhai_pass_desc: "Vạn Lý Trường Thành vốn đã rất đồ sộ, nhưng vẫn có thể trở nên hùng vĩ hơn và mang lại khả năng phòng thủ tốt hơn nữa. Bằng cách kéo dài bức tường về phía đông, tới Sơn Hải Quan và bờ biển, chúng ta có thể phong tỏa toàn bộ lối tiếp cận từ phương bắc."
