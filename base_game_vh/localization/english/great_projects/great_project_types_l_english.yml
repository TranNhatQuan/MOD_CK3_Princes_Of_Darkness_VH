l_english: 
  great_project_type_great_wall: "Cải thiện Vạn Lý Trường Thành"
  great_project_type_great_wall_desc: "Vạn Lý Trường Thành là minh chứng cho trình độ kỹ thuật và sự khéo léo của các bậc tiền nhân trong việc ngăn chặn những kẻ xâm lược tiềm tàng. Tuy nhiên, cũng như mọi thứ khác, thời gian đã để lại dấu ấn của nó. Bức tường đang rất cần được cải thiện."
  great_project_type_great_wall_province_has_great_wall: "[province.GetNameNoTooltip] có một đoạn của [GetBuilding('the_great_wall_01').GetName]"
  great_project_type_great_wall_province_gains_great_wall: "Các [provinces|E] đã được tài trợ [great_project_contributions|E] sẽ được nâng cấp các đoạn [GetBuilding('the_great_wall_04').GetName] [building|E]"
  great_project_type_great_wall_possessive: "của Vạn Lý Trường Thành"
  great_project_type_great_wall_contribution_master_builder: "Thuê Đại Kiến Trúc Sư và Bắt Đầu Xây Dựng"
  great_project_type_great_wall_contribution_master_builder_desc: "Các công trình phòng thủ phải được coi trọng! Những bộ óc xuất sắc nhất cần được giao nhiệm vụ giám sát [great_project|e] này, để đảm bảo vật liệu tốt nhất được sử dụng, những lao động bền bỉ nhất được huy động, và những bức tường kiên cố nhất được dựng lên."
  great_project_type_great_wall_contribution_walls_01: "Cải thiện Tường Thành của [GetTitleByKey('b_wulan').GetNameNoTier]"
  great_project_type_great_wall_contribution_walls_01_desc: "Việc bảo vệ lãnh thổ đòi hỏi mọi biên cương đều phải được gia cố thích đáng. Chúng ta cần kiểm tra và tu sửa tường thành của [GetTitleByKey('b_wulan').GetNameNoTier]."
