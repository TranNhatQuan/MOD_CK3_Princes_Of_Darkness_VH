  great_project_type_minister_project_culture_desc: "Làm sao chúng ta có thể thực sự thống nhất nếu không chia sẻ những giá trị chung? Khác biệt có thể gây mâu thuẫn và bất ổn. Chúng ta có thể giải quyết những vấn đề này, ít nhất là một phần, bằng nỗ lực hòa nhập lâu dài. Một cõi, một dân."
