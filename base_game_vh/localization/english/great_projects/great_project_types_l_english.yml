  great_project_type_great_wall_extend_to_liaodong_contribution_logistics_desc: "$great_project_logistics_generic_desc$"

  great_wall_extend_to_top_liege_of_province: "[great_wall_extend_province.GetName] có một [holding|E] và Ngài là [top_liege|E] của nó"

  great_project_type_grand_canals: "Đại Vận Hà"
  great_project_type_grand_canals_desc: "Những người quản lý vùng đất này trước đây đã xây dựng các mạng lưới kênh đào rộng lớn, liên kết sông ngòi và hồ nước thông qua các tuyến thủy đạo nhân tạo, kết nối bắc và nam. Việc mở rộng hệ thống này bằng các kỹ thuật hiện đại sẽ khiến nó càng hiệu quả hơn, đồng thời tôn vinh di sản và tay nghề của những kỹ sư nguyên thủy."
  great_project_type_grand_canals_possessive: "của Đại Vận Hà"
  great_project_type_grand_canals_contribution_materials: "Vật liệu"
  great_project_type_grand_canals_contribution_materials_desc: "Một công trình với quy mô như vậy sẽ đòi hỏi một lượng vật liệu xây dựng khổng lồ."
  great_project_type_grand_canals_contribution_logistics: "$great_project_logistics_generic$"
  great_project_type_grand_canals_contribution_logistics_desc: "$great_project_logistics_generic_desc$"
  great_project_type_grand_canals_contribution_personnel_construction: "Đội thi công"
  great_project_type_grand_canals_contribution_personnel_dig: "Đội đào"
  great_project_type_grand_canals_contribution_engineers: "Kỹ sư"
  great_project_type_grand_canals_contribution_dredging_boats: "Thuyền nạo vét"
  grand_canals_effect_desc: "Khu vực mục tiêu nhận được [GetModifier('tgp_grand_canal_modifier').GetNameWithTooltip]"
 
  great_project_type_construct_great_barracks: "Xây dựng Doanh Trại Lớn"
  great_project_type_construct_great_barracks_desc: "Sức mạnh quân sự của chúng ta có thể được thể hiện thông qua việc xây dựng một pháo đài lớn, đủ sức chứa vô số binh sĩ. Các chỉ huy quân sự sẽ có thể tuyển mộ nhiều quân hơn và duy trì các đồn trú quy mô lớn, qua đó gia tăng đáng kể khả năng phòng thủ của khu vực."
  great_project_type_construct_great_barracks_military_governor_duchy_capital: "Là [capital|E] [duchy|E] [de_jure|E] của một [GetPlayer.Custom('GetGovernorConcept')] Quân sự"
  great_project_type_construct_great_barracks_does_not_already_have_barracks: "Chưa có [GetBuilding('celestial_great_barracks_01').GetName] [building|E]"
  great_project_type_construct_great_barracks_do_not_override_player_building: "Không do người chơi khác nắm giữ mà đã có [duchy_building|E]"
  great_project_type_construct_great_barracks_possessive: "Xây dựng Doanh Trại Lớn"
  great_project_type_construct_great_barracks_province_gains_great_barracks_fallback: "[province|E] được chọn"
  great_project_type_construct_great_barracks_province_gains_great_barracks: "[SelectLocalization(province.IsValid,province.GetName,'great_project_type_construct_great_barracks_province_gains_great_barracks_fallback')] sẽ nhận được [GetBuilding('celestial_great_barracks_01').GetName] [building|E]"
  project_great_barracks_replace_tt: "@alert_icon! #alert_trial Điều này sẽ thay thế [duchy_building|E] hiện có#!"
  great_project_type_construct_great_barracks_contribution_base_materials: "Vật liệu xây dựng"
  great_project_type_construct_great_barracks_contribution_fort_material: "Vật liệu công sự"
  great_project_type_construct_great_barracks_contribution_work_force: "Nhân lực"
  great_project_type_construct_great_barracks_contribution_soldiers: "Binh sĩ"
 
  great_project_contribution_must_be_province_owner_or_above: "Sở hữu [province|E] nơi [great_project|E] được xây dựng, hoặc là [liege|E] của chủ tỉnh đó hay cao hơn"

  great_project_type_strengthen_capital: "Củng cố Kinh đô"
  great_project_type_strengthen_capital_desc: "Kinh đô không chỉ là trung tâm chính quyền của ta. Đó còn là trái tim của cả quốc gia, và phải là biểu tượng huy hoàng cho triều đại của ta. Bằng cách cải tạo toàn bộ thành phố, nâng cấp đường phố, tài trợ cho một trường đại học, dựng tượng và các công trình tưởng niệm khác, thành phố xinh đẹp này sẽ trở thành tấm gương phản chiếu của dòng dõi ta."
  great_project_type_strengthen_capital_possessive: "$great_project_type_strengthen_capital$"
  great_project_type_strengthen_capital_contribution_materials: "Vật liệu xây dựng"
  great_project_type_strengthen_capital_contribution_workforce: "Nhân lực"
  great_project_type_strengthen_capital_contribution_architects: "Kiến trúc sư lành nghề"
  great_project_type_strengthen_capital_contribution_engineers: "Kỹ sư tài năng"
  great_project_type_strengthen_capital_contribution_sculptors: "Nhà điêu khắc bậc thầy"
  great_project_type_strengthen_capital_contribution_forbidden_city: "Tử Cấm Thành"
  adult_education_celestial_capital_desc: "\n#P + Thủ đô của [GetTitleByKey('h_china').GetDefinitiveName|U]#!"
  adult_education_improved_celestial_capital_desc: "\n#P +++ [GetModifier('tgp_strengthen_capital_modifier').GetNameWithTooltip]#!"

  great_project_type_mandala_capital_01: "$building_type_mandala_capital_01$"
  great_project_type_mandala_capital_01_desc: "Đã đến lúc chúng ta để lại dấu ấn cho muôn đời. Chúng ta sẽ dựng lên một ngôi đền vĩ đại để tôn vinh Devaraja của mình!"
  great_project_type_mandala_capital_01_possessive: "của $building_type_mandala_capital_01$"
  great_project_type_mandala_capital_01_contribution_rite_of_worthiness: "Nghi lễ Xứng Đáng"
  great_project_type_mandala_capital_01_contribution_rite_of_worthiness_desc: "Chúng ta sẽ chứng minh giá trị của mình để được phép xây dựng một [GetBuilding('mandala_capital_01').GetTypeName], cạnh tranh giành sự sùng kính của cư dân trong [kingdom|E] [de_jure|E] này!"
  great_project_type_mandala_capital_01_contribution_slabs_of_sandstone: "Phiến đá sa thạch"
  great_project_type_mandala_capital_01_contribution_slabs_of_sandstone_desc: "Ngôi đền này sẽ tôn vinh thần linh, nhưng việc xây dựng nó cũng có những đòi hỏi trần thế. Cung cấp cho [great_project|E] vật liệu cần thiết là một trong những đóng góp vĩ đại nhất."
  great_project_type_mandala_capital_01_contribution_laterite_blocks: "Khối đá laterit"
  great_project_type_mandala_capital_01_contribution_laterite_blocks_desc: "Đất laterit là yếu tố cần thiết cho nền móng vững chắc, đồng thời phục vụ cho trang trí."
  great_project_type_mandala_capital_01_contribution_timber: "Gỗ"
  great_project_type_mandala_capital_01_contribution_timber_desc: "Chúng ta sẽ sử dụng toàn bộ lượng gỗ cần thiết để chống đỡ công trình bằng dầm, mái, cửa xoay — đồng thời dành phần cho các tấm ốp trang trí."
  great_project_type_mandala_capital_01_contribution_work_force: "Nhân lực"
  great_project_type_mandala_capital_01_contribution_work_force_desc: "Đá không thể tự di chuyển! Chúng ta sẽ cung cấp cho [great_project|E] nguồn nhân lực thô cần thiết để hoàn thành nhiệm vụ huy hoàng này."
  great_project_type_mandala_capital_01_contribution_woodcarvings: "Chạm khắc gỗ"
  great_project_type_mandala_capital_01_contribution_woodcarvings_desc: "Bên cạnh các tấm ốp trang trí, chúng ta sẽ tạo ra những bức chạm khắc và hoa văn để tôn vinh thần linh và mang phúc lành đến cho dân chúng."
  great_project_type_mandala_capital_01_contribution_sanctified_domes: "Mái vòm linh thiêng"
  great_project_type_mandala_capital_01_contribution_sanctified_domes_desc: "Chúng ta sẽ dựng nên các mái vòm — một cấu trúc nhân tạo cho phép chúng ta chiêm nghiệm sự khéo léo của chính mình."
  great_project_type_mandala_capital_01_contribution_ornate_reliefs: "Phù điêu tinh xảo"
  great_project_type_mandala_capital_01_contribution_ornate_reliefs_desc: "Những bức phù điêu khắc họa devata, apsara và các khoảnh khắc thiêng liêng sẽ lấp đầy nơi này, khiến các tín đồ phải kinh ngạc."
  great_project_type_mandala_capital_01_contribution_family_shrine: "Điện thờ Gia tộc"
  great_project_type_mandala_capital_01_contribution_family_shrine_desc: "Một điện thờ dành riêng cho con cháu của các vị đại vương vĩ đại của chúng ta sẽ được dựng lên."

  great_project_mandala_capital_pick_aspect_tt: "Ngài đã tiếp nhận một [mandala_aspect|E]"
  great_project_mandala_capital_has_creation_aspect_tt: "Ngài đã tiếp nhận [aspect_of_creation|E]"
  great_project_mandala_capital_has_serenity_aspect_tt: "Ngài đã tiếp nhận [aspect_of_serenity|E]"
  great_project_mandala_capital_has_destruction_aspect_tt: "Ngài đã tiếp nhận [aspect_of_destruction|E]"
  great_project_mandala_capital_has_trickery_aspect_tt: "Ngài đã tiếp nhận [aspect_of_trickery|E]"

  great_project_type_mandala_capital_02: "Nâng cấp $building_type_mandala_capital_01$"
  great_project_type_mandala_capital_02_desc: "Giờ đây chúng ta đã có đủ năng lực để mở rộng ngôi đền hùng vĩ của mình! Hãy tạo nên một kỳ quan trường tồn cùng năm tháng!"
  great_project_type_mandala_capital_02_possessive: "của $building_mandala_capital_02$"

  great_project_type_mandala_capital_02_contribution_rite_of_worthiness: "Nghi lễ Xứng Đáng"
  great_project_type_mandala_capital_02_contribution_rite_of_worthiness_desc: "Chúng ta sẽ chứng minh giá trị của mình để được phép tiếp tục mở rộng [GetBuilding('mandala_capital_01').GetTypeName], cạnh tranh giành sự sùng kính của cư dân trong [kingdom|E] [de_jure|E] này!"

  great_project_type_mandala_capital_02_contribution_brick: "Gạch"
  great_project_type_mandala_capital_02_contribution_brick_desc: "Không thể tạo ra nhiều hơn từ hư không. Chúng ta sẽ cung cấp cho [great_project|E] toàn bộ số gạch cần thiết để hoàn tất công việc trên $building_mandala_capital_02$."

  great_project_type_mandala_capital_02_contribution_tiles: "Chồng ngói"
  great_project_type_mandala_capital_02_contribution_tiles_desc: "Một mái nhà hoạt động hiệu quả là một mái nhà lợp ngói. Chúng ta sẽ gửi những viên ngói tốt nhất cho [great_project|E] và bảo vệ nó khỏi ẩm thấp!"

  great_project_type_mandala_capital_02_contribution_shallow_pools: "Hồ nước nông"
  great_project_type_mandala_capital_02_contribution_shallow_pools_desc: "Các công trình mặt nước là yếu tố thiết yếu để tạo sự mát mẻ, đồng thời gắn kết chúng ta với cõi thiêng."

  great_project_type_mandala_capital_02_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
  great_project_type_mandala_capital_02_contribution_work_force_desc: "Những kỳ công lớn đòi hỏi lao động to lớn! Chúng ta phải cung cấp thêm nhân lực cho [great_project|E] để hoàn tất việc trùng tu $building_mandala_capital_02$."

  great_project_type_mandala_capital_02_contribution_decorative_tiles: "Ngói trang trí"
  great_project_type_mandala_capital_02_contribution_decorative_tiles_desc: "Hãy tận hưởng sự xa hoa và bổ sung ngói trang trí cho mái nhà. Mép cong. Chạm khắc tinh vi. Thêm phần tráng lệ để làm hài lòng cả đôi mắt lẫn thần linh."

  great_project_type_mandala_capital_02_contribution_decorated_domes: "Mái vòm trang trí"
  great_project_type_mandala_capital_02_contribution_decorated_domes_desc: "Một mái vòm tốt là một mái vòm tròn. Chúng sẽ nhanh chóng trở nên tròn trịa, có gờ nổi và những họa tiết thú vị."

  great_project_type_mandala_capital_02_contribution_family_statues: "Tượng Thánh của Người Thừa Kế"
  great_project_type_mandala_capital_02_contribution_family_statues_desc: "Những người thừa kế của dòng dõi thiêng liêng của chúng ta sẽ được khắc họa dung mạo linh thiêng trong các bức tượng đá, để được ghi nhớ mãi mãi."


  great_project_type_mandala_capital_03: "$great_project_type_mandala_capital_02$"
  great_project_type_mandala_capital_03_desc: "$great_project_type_mandala_capital_02_desc$"
  great_project_type_mandala_capital_03_possessive: "của $building_mandala_capital_03$"

  great_project_type_mandala_capital_03_contribution_rite_of_worthiness: "Nghi Lễ Chứng Tỏ Xứng Đáng"
  great_project_type_mandala_capital_03_contribution_rite_of_worthiness_desc: "Chúng ta sẽ chứng minh giá trị của mình để được phép tiếp tục phát triển [GetBuilding('mandala_capital_01').GetTypeName], vươn cao hơn nữa trong biên niên sử lịch sử!"

  great_project_type_mandala_capital_03_contribution_volcanic_stone: "Đá Núi Lửa"
  great_project_type_mandala_capital_03_contribution_volcanic_stone_desc: "Những tham vọng vĩ đại nhất cần những nền móng vững chắc nhất. Chúng ta sẽ cung cấp cho [great_project|E] loại đá núi lửa cần thiết để xây dựng nền móng kiên cố, trường tồn cùng thời gian."

  great_project_type_mandala_capital_03_contribution_corbel_gateways: "Cổng Vòm Chồng"
  great_project_type_mandala_capital_03_contribution_corbel_gateways_desc: "Khi mở rộng ngôi đền, chúng ta cần những khung kết cấu phù hợp để nâng đỡ công trình. Những cổng này sẽ giúp dẫn lối cho những ai lang thang trong khuôn viên để tìm kiếm sự giác ngộ."

  great_project_type_mandala_capital_03_contribution_divine_statues: "Tượng Thần Thánh"
  great_project_type_mandala_capital_03_contribution_divine_statues_desc: "Những chiếc đầu khổng lồ này có thể trông uy nghiêm, nhưng về bản chất, chúng thánh hóa nơi này, khơi dậy bầu không khí linh thiêng và đức hạnh."

  great_project_type_mandala_capital_03_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
  great_project_type_mandala_capital_03_contribution_work_force_desc: "Để vươn tới thần thánh, chúng ta phải lao động không ngừng. Cần thêm nhân lực để xây dựng $building_mandala_capital_03$, và sự đóng góp của chúng ta sẽ được đền đáp xứng đáng."

  great_project_type_mandala_capital_03_contribution_creation_aspect: "Tượng Thần Sáng Tạo"
  great_project_type_mandala_capital_03_contribution_creation_aspect_desc: "Những chiếc đầu khổng lồ này nhìn xa xăm, bận rộn với việc hoạch định và sắp đặt — duy trì sự sống ở cõi này và cõi bên kia. Chúng mang dáng dấp rất giống với vị quân chủ thần thánh của chúng ta."

  great_project_type_mandala_capital_03_contribution_serenity_aspect: "Tượng Thần Tĩnh Lặng"
  great_project_type_mandala_capital_03_contribution_serenity_aspect_desc: "Những chiếc đầu khổng lồ này toát lên cảm giác bình yên và tĩnh tại, dường như đã đạt tới giác ngộ. Chúng mang dáng dấp rất giống với vị quân chủ thần thánh của chúng ta."

  great_project_type_mandala_capital_03_contribution_destruction_aspect: "Tượng Thần Hủy Diệt"
  great_project_type_mandala_capital_03_contribution_destruction_aspect_desc: "Những chiếc đầu khổng lồ này mang vẻ mặt dữ tợn đáng sợ, sẵn sàng lao tới tấn công kẻ thù nào dám xâm phạm thánh địa này. Chúng mang dáng dấp rất giống với vị quân chủ thần thánh của chúng ta."

  great_project_type_mandala_capital_03_contribution_trickery_aspect: "Tượng Thần Quỷ Kế"
  great_project_type_mandala_capital_03_contribution_trickery_aspect_desc: "Những chiếc đầu khổng lồ này mang nụ cười tinh quái, gợi lên cảm giác rằng chúng thấu suốt Ngài — cả theo nghĩa đen lẫn triết học. Chúng mang dáng dấp rất giống với vị quân chủ thần thánh của chúng ta."
 
  great_project_type_mandala_capital_03_contribution_gilded_domes: "Mái Vòm Mạ Vàng"
  great_project_type_mandala_capital_03_contribution_gilded_domes_desc: "Để thực sự tỏa rạng sự huy hoàng, các mái vòm của $building_mandala_capital_03$ phải được phủ bằng loại vàng tinh khiết nhất có thể dâng hiến."

  great_project_type_mandala_capital_03_contribution_family_temple_compound: "Quần Thể Đền Thờ Gia Tộc"
  great_project_type_mandala_capital_03_contribution_family_temple_compound_desc: "Một quần thể linh thiêng dành cho việc thờ phụng các hoàng tử và công chúa của vị quân chủ thần thánh đã xây dựng nên những ngôi đền vĩ đại này."

  great_project_type_mandala_capital_04: "$great_project_type_mandala_capital_02$"
  great_project_type_mandala_capital_04_desc: "$great_project_type_mandala_capital_02_desc$"
  great_project_type_mandala_capital_04_possessive: "của $building_mandala_capital_04$"

  great_project_type_mandala_capital_04_contribution_rite_of_worthiness: "Nghi Lễ Chứng Tỏ Xứng Đáng"
  great_project_type_mandala_capital_04_contribution_rite_of_worthiness_desc: "Chúng ta sẽ chứng minh giá trị không thể nghi ngờ của mình để được phép tiếp tục phát triển [GetBuilding('mandala_capital_01').GetTypeName], ghi dấu ấn của chúng ta lên thế giới!"

  great_project_type_mandala_capital_04_contribution_slabs_of_granite: "Phiến Đá Granit"
  great_project_type_mandala_capital_04_contribution_slabs_of_granite_desc: "Hình ảnh bất diệt duy nhất là thứ được tạc vào đá. Chúng ta sẽ cung cấp loại đá tốt nhất để tạo nên nghệ thuật cho $building_mandala_capital_04$, trường tồn cùng vĩnh cửu."

  great_project_type_mandala_capital_04_contribution_zaungdans: "Zaungdan"
  great_project_type_mandala_capital_04_contribution_zaungdans_desc: "Những cầu thang thần thánh là phần quan trọng trong việc vươn lên cao hơn và tiến gần tới thần tính. Đây cũng là nơi tuyệt vời cho các sạp chợ và những nhu cầu thiết yếu khác."

  great_project_type_mandala_capital_04_contribution_gilded_shrines: "Đền Thờ Mạ Vàng"
  great_project_type_mandala_capital_04_contribution_gilded_shrines_desc: "Chúng ta sẽ dựng nên những đền thờ chứa các tượng thần; và mỗi vị thần ngự trong từng pho tượng sẽ ban ân huệ và trợ giúp cho vị quân chủ thần thánh của chúng ta."

  great_project_type_mandala_capital_04_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
  great_project_type_mandala_capital_04_contribution_work_force_desc: "Một công trình vĩ đại như vậy không chỉ cần sức mạnh và mồ hôi, mà còn cần con mắt tinh tường, công cụ tinh xảo và tư duy của người nghệ nhân. Lực lượng lao động chúng ta cung cấp sẽ không chỉ vận chuyển vật liệu thô, mà còn tạo nên những tác phẩm nghệ thuật tinh vi mà [great_project|E] tha thiết cần."

  great_project_type_mandala_capital_04_contribution_bell_stupas: "Tháp Stupa Hình Chuông"
  great_project_type_mandala_capital_04_contribution_bell_stupas_desc: "Loại cẩm thạch tinh tuyển nhất sẽ được dâng hiến cho $building_mandala_capital_05$, để công trình này có thể an tọa trên những nền móng thanh nhã nhất."

  great_project_type_mandala_capital_04_contribution_bejeweled_domes: "Mái Vòm Nạm Ngọc"
  great_project_type_mandala_capital_04_contribution_bejeweled_domes_desc: "Bầu trời phải tỏa sáng trên $building_mandala_capital_04$ này, và chúng ta sẽ cung cấp cho [great_project|E] những viên ngọc cần thiết để khiến nơi đây trông như thể chính các vì sao đang ngự giữa những hàng cột của quần thể thần thánh này."

  great_project_type_mandala_capital_04_contribution_family_temple_complex: "Quần Thể Đền Thờ Gia Tộc"
  great_project_type_mandala_capital_04_contribution_family_temple_complex_desc: "Con cháu của vị Devaraja vĩ đại của chúng ta sẽ được tôn vinh bằng một quần thể đền thờ riêng trong kinh đô hoàng gia. Tại đây, họ sẽ được thờ phụng từ rất lâu trước khi tự mình nắm giữ quyền lực."


  great_project_type_mandala_capital_05: "$great_project_type_mandala_capital_02$"
  great_project_type_mandala_capital_05_desc: "$great_project_type_mandala_capital_02_desc$"
  great_project_type_mandala_capital_05_possessive: "của $building_mandala_capital_05$"

  great_project_type_mandala_capital_05_contribution_rite_of_worthiness: "Nghi Lễ Chứng Tỏ Xứng Đáng"
  great_project_type_mandala_capital_05_contribution_rite_of_worthiness_desc: "Chúng ta sẽ chứng minh giá trị không thể nghi ngờ của mình để được phép tiếp tục phát triển [GetBuilding('mandala_capital_01').GetTypeName], biến nó thành thứ gì đó thực sự siêu việt!"

  great_project_type_mandala_capital_05_contribution_marble_foundation: "Nền Móng Cẩm Thạch"
  great_project_type_mandala_capital_05_contribution_marble_foundation_desc: "Loại cẩm thạch tinh tuyển nhất sẽ được dâng hiến cho $building_mandala_capital_05$, để công trình này có thể an tọa trên những nền móng thanh nhã nhất."

  great_project_type_mandala_capital_05_contribution_divine_barays: "Hồ Baray Thần Thánh"
  great_project_type_mandala_capital_05_contribution_divine_barays_desc: "Công trình của chúng ta sẽ có những hồ nước sâu thẳm, vừa bảo vệ chúng ta khỏi kẻ thù, vừa kết nối chúng ta với cõi linh hồn."

  great_project_type_mandala_capital_05_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
  great_project_type_mandala_capital_05_contribution_work_force_desc: "Chúng ta sẽ cung cấp lao động thuộc mọi trình độ, từ người nông dân thấp kém nhất đến học giả uyên bác nhất, được huy động từ khắp mọi miền trong lãnh thổ, để hỗ trợ việc xây dựng $building_mandala_capital_05$."

  great_project_type_mandala_capital_05_contribution_bejeweled_reliefs: "Phù Điêu Nạm Ngọc"
  great_project_type_mandala_capital_05_contribution_bejeweled_reliefs_desc: "Những vũ công thiên giới sẽ phủ kín các bức tường, tỏa ra vẻ duyên dáng trong từng bước đi, cùng với trang phục nạm ngọc lộng lẫy của họ."

  great_project_type_mandala_capital_05_contribution_bunga_mas_forest: "Rừng Bunga Mas"
  great_project_type_mandala_capital_05_contribution_bunga_mas_forest_desc: "Việc tôn kính một công trình uy nghi và chính trực như vậy đòi hỏi những lễ vật tinh tế và sâu sắc hơn. Chúng ta sẽ cung cấp cho $building_mandala_capital_05$ một khu trưng bày cây cối và hoa lá bằng vàng, được chế tác tinh xảo bởi những nghệ nhân bậc thầy."

  great_project_type_mandala_capital_05_contribution_dynastic_temple_complex: "Khu Đền Thờ Triều Đại"
  great_project_type_mandala_capital_05_contribution_dynastic_temple_complex_desc: "Một khu vực trong quần thể đền thờ kinh đô dành cho Devaraja của chúng ta sẽ được hiến dâng để thờ phụng dòng dõi và các hậu duệ của triều đại."

  great_project_error_plan_mandala_capital: "Thiếu điều kiện để lên kế hoạch mở rộng Kinh Đô Mandala"

