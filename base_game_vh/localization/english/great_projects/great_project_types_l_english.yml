  add_great_wall_in_shanhai_desc: "Mỗi [holding|E] trong [GetGeographicalRegion('dlc_tgp_great_wall_shanhai').GetName] sẽ nhận được [GetBuilding('the_great_wall_04').GetName] [great_building|E]"
 
  great_project_type_great_wall_extend_to_liaodong: "Mở rộng Vạn Lý Trường Thành đến Liêu Đông"
  great_project_type_great_wall_extend_to_liaodong_desc: "Khi lãnh thổ của chúng ta được mở rộng, Vạn Lý Trường Thành cũng phải được kéo dài để bao trùm cả đường bờ biển. Mọi phần của quốc gia, dù là đất liền hay biển cả, đều phải được bảo vệ."
  add_great_wall_in_liaodong_desc: "Mỗi [holding|E] trong [GetGeographicalRegion('dlc_tgp_great_wall_liaodong').GetName] sẽ nhận được [GetBuilding('the_great_wall_04').GetName] [great_building|E]"
  great_project_type_great_wall_extend_to_liaodong_contribution_materials_01: "$great_project_walls_extend_materials_generic$"
  great_project_type_great_wall_extend_to_liaodong_contribution_materials_01_desc: "$great_project_walls_extend_materials_generic_desc$"
  great_project_type_great_wall_extend_to_liaodong_contribution_materials_02: "$great_project_walls_extend_materials_generic$"
  great_project_type_great_wall_extend_to_liaodong_contribution_materials_02_desc: "$great_project_walls_extend_materials_generic_desc$"
  great_project_type_great_wall_extend_to_liaodong_contribution_materials_03: "$great_project_walls_extend_materials_generic$"
