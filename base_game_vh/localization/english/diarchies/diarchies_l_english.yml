  viz_extravagance.t1.treasure.hankerchiefs: "Nhân vật này tiêu thụ một lượng khăn tay vải lanh hảo hạng hoàn toàn quá mức — mười chiếc mỗi ngày vào mùa hè, và vẫn vứt bỏ sau mỗi lần dùng."
  viz_extravagance.t1.treasure.cosmetics: "Nhân vật này chắc chắn có quyền tiếp cận một kho nước hoa, thuốc mỡ và mỹ phẩm cao cấp lớn bất thường so với địa vị của mình."
  viz_extravagance.t1.treasure.jewellery: "Nhân vật này dường như chưa bao giờ thiếu những món trang sức mới để tô điểm bản thân; vàng, bạc và đá quý lấp lánh trên khuôn mặt và [ROOT.Char.GetDiarchy.GetDiarch.Custom('HandHands')] của họ."
  viz_extravagance.t1.treasure.furniture: "Đồ nội thất của nhân vật này luôn được làm từ những loại gỗ và quặng nhập khẩu thượng hạng — được thay mới thường xuyên theo mốt, đúng như gu thẩm mỹ."
  viz_extravagance.t1.treasure.clothing: "Nhân vật này sở hữu một tủ quần áo dường như không đáy với đủ loại y phục cao cấp theo mọi xu hướng mới nhất — thậm chí còn dư sức tạo ra mốt riêng."
  viz_extravagance.t1.treasure.hats: "Nhân vật này hiếm khi đội cùng một chiếc mũ quá một hoặc hai tuần — tại sao phải tự hạn chế khi mỗi năm lại có nhiều kiểu mới, cao hơn?"
  viz_extravagance.t1.treasure.relics: "Nhân vật này được biết là sở hữu một bộ sưu tập thánh tích nhỏ nhưng tinh xảo."
  viz_extravagance.t1.treasure.drugs: "Tủ của nhân vật này nổi tiếng vì chứa một bộ sưu tập các loại dược phẩm, đồ uống và chế phẩm ngoại lai cao cấp, nhiều thứ trong số đó thuộc hàng hiếm nhất có thể tiếp cận tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t1.treasure.game_pieces: "Nhân vật này sở hữu bản sao của mọi trò chơi bàn cờ được biết đến tại khu vực này, với quân cờ được chạm khắc từ đá quý cho tới xương của những quái thú huyền thoại."
  viz_extravagance.t1.treasure.hourglasses: "Nhân vật này sở hữu những chiếc đồng hồ cát chính xác bậc nhất thế giới — đối với một quan chức dân sự, hiếm có công cụ nào xa xỉ hơn."

  viz_extravagance.t1.activities.parades: "Nhân vật này thích tổ chức các cuộc diễu hành, nơi tiền xu và thực phẩm được ném cho người nghèo, luôn bằng tiền túi của chính họ — và dưới danh nghĩa của họ."
  viz_extravagance.t1.activities.festivals: "Nhân vật này được biết là mở cửa khu vườn và sảnh dưới của tư dinh để tổ chức các lễ hội nhỏ, cho thường dân nếm trải thoáng chốc sự xa hoa của giới quý tộc."
  viz_extravagance.t1.activities.auctions: "Nhân vật này thường xuyên tổ chức các buổi đấu giá từ thiện, bán bớt những châu báu tích lũy để gây quỹ cho người khốn khó trong vương quốc."
  viz_extravagance.t1.activities.feasts: "Nhân vật này thích thường xuyên chiêu đãi giới quý tộc địa phương trong các buổi tụ họp riêng. Có lời đồn rằng máu thật sự đã đổ chỉ để giành được một lời mời."
  viz_extravagance.t1.activities.board_game_tourneys: "Nhân vật này thích tổ chức các giải đấu cờ bàn mang tính cạnh tranh cho tầng lớp thượng lưu, với các nhân vật quyền quý của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] cùng chơi mọi biến thể mới nhất."
  viz_extravagance.t1.activities.pigeon_racing: "Nhân vật này có một niềm đam mê hơi đáng xấu hổ với đua bồ câu; thậm chí còn sở hữu một chuồng chim đồ sộ."
  viz_extravagance.t1.activities.orgies: "Nhân vật này được biết là tổ chức các cuộc gặp gỡ #EMP kín đáo#! cho một số cư dân… trụy lạc hơn của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t1.activities.feasts.weekly: "Nhân vật này khoái chí tổ chức những yến tiệc khổng lồ mỗi tuần, tuần nào cũng vậy — tầng lớp quý tộc thấp của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] gần như phụ thuộc hoàn toàn vào họ để có đồ ăn."
  viz_extravagance.t1.activities.exhibitions: "Nhân vật này có gu nghệ thuật và luôn chú trọng vừa bảo trợ nghệ sĩ vừa trưng bày thành quả đó, đôi khi còn cho cả những tầng lớp khiêm tốn nhất trong xã hội."
  viz_extravagance.t1.activities.feasts.commoners: "Nhân vật này thích những bữa tiệc thịnh soạn thường xuyên, nhưng luôn cố ý mời cả những công dân nổi bật nhất của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], dù giai cấp của họ vốn không cho phép."

  viz_extravagance.t1.property.townhouse: "Nhân vật này sở hữu một căn nhà phố được bài trí xa hoa nhưng vẫn chừng mực tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t1.property.minor_businesses: "Lợi ích kinh doanh của nhân vật này rất nhiều và đa dạng, bao gồm các xưởng nhỏ, phường hội cấp thấp và các bất động sản nhỏ rải rác khắp kinh đô."
  viz_extravagance.t1.property.small_arena: "Nhân vật này sở hữu và duy trì một đấu trường đua ngựa tư nhân nhỏ. Dĩ nhiên, cờ bạc là lợi ích phụ."
  viz_extravagance.t1.property.manse: "Nhân vật này có một dinh thự riêng ngay bên ngoài [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — đủ gần để tiện lợi, đủ xa để kín đáo."
  viz_extravagance.t1.property.toll_road: "Nhân vật này độc quyền sở hữu một con đường thu phí đặc biệt sinh lợi dẫn vào [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Việc họ có được nó bằng cách nào và phí được lập từ khi nào vẫn là điều gây nhiều đồn đoán."
  viz_extravagance.t1.property.agent_network: "Nhân vật này duy trì một mạng lưới mật thám khắp vương quốc, giám sát và quản lý lợi ích kinh doanh của mình ngay cả tại những tiền đồn xa xôi nhất."
  viz_extravagance.t1.property.rooftop_garden: "Nhân vật này chi tiền để duy trì một khu vườn trên mái rộng lớn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], khiến dân chúng bên dưới không khỏi kinh ngạc."
  viz_extravagance.t1.property.market_officials_on_payroll: "Nhân vật này được biết là đã đưa toàn bộ thanh tra và quan thuế của một khu chợ trọng yếu trong kinh đô vào danh sách trả lương. Tất nhiên, tất cả là để bảo vệ sự liêm chính của vương quốc."
  viz_extravagance.t1.property.hostel: "Nhân vật này sở hữu một nhà trọ giá rẻ tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], cố tình phục vụ những tầng lớp nghèo khổ và yếu thế nhất trong xã hội."
  viz_extravagance.t1.property.gangers: "Nhân vật này #EMP bị cho là#! đã mua chuộc một trong những băng đảng lớn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]; một công chức gương mẫu cần làm gì với một lũ côn đồ hung hãn thì thật khó mà đoán được."

  viz_extravagance.t1.charity.orphans: "Nhân vật này chi trả cho một khoản trợ cấp công cộng nhằm tiếp nhận và giáo dục một số lượng trẻ mồ côi nhất định mỗi năm. Những đứa trẻ được cung cấp nền giáo dục phù hợp, thực phẩm, chỗ ở và sự chỉ dẫn đạo đức cho đến khi chúng trưởng thành."
  viz_extravagance.t1.charity.building_repair: "Nhân vật này chi tiền lập một quỹ nhỏ dành cho cư dân thủ đô có nhà cửa bị hư hại — nếu họ không đủ khả năng sửa chữa, họ sẽ được cấp một khoản hỗ trợ."
  viz_extravagance.t1.charity.feasts.religious: "Nhân vật này trợ cấp cho một số yến tiệc tôn giáo hằng năm dành cho dân thường tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t1.charity.widowers: "Nhân vật này chi trả trợ cấp cho một số góa phu nghèo khổ của thủ đô."
  viz_extravagance.t1.charity.widows: "Nhân vật này chi trả trợ cấp cho một số góa phụ nghèo khổ của thủ đô."
  viz_extravagance.t1.charity.beggars: "Nhân vật này chi tiền cho một quỹ cung cấp thức ăn và quần áo cho những kẻ ăn xin và người cùng khổ tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], một đường sống thiết yếu cho tầng lớp đáy của lãnh thổ."
  viz_extravagance.t1.charity.awkward_children: "Nhân vật này chi tiền cho một chương trình mua bình nước thay thế cho những đứa trẻ hầu việc làm vỡ bình khi đi gánh nước buổi sáng — mà không để ai trong gia đình các em biết chút gì về những tai nạn nhỏ ấy."
  viz_extravagance.t1.charity.civil_service.guard: "Nhân vật này chi tiền dựng một chốt gác nhỏ, cùng một lính canh thường trực, đứng bên ngoài một trong những tòa nhà hành chính quan trọng hơn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t1.charity.birds: "Nhân vật này chi tiền mua hạt giống để thường xuyên rải tại một số con hẻm cho chim chóc của thủ đô — chỉ có kẻ man rợ mới để mặc những sinh vật ấy chịu khổ và chết đói."
  viz_extravagance.t1.charity.monastery: "Nhân vật này tài trợ việc duy trì (và đã chi tiền xây dựng) một cộng đồng tôn giáo biệt lập, xa rời những tội lỗi của đời sống thường nhật."
  viz_extravagance.t1.charity.judges: "Nhân vật này chi tiền để một số thẩm phán chuyên nghiệp của lãnh thổ dành nhiều thời gian hơn cho việc xét xử và đi tuần tra các khu vực phụ trách."
  viz_extravagance.t1.charity.kitchens: "Nhân vật này chi tiền duy trì một số nhà bếp miễn phí nhỏ, nuôi ăn những người nghèo biết ơn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."

  viz_extravagance.t2.treasure.cabinet_of_curiosities: "Nhân vật này có một căn phòng dành riêng cho các kỳ vật ngoại lai và đồ dùng kỳ quái từ những miền đất xa xôi; dù ít giá trị thực tiễn, nó #EMP quả thực là#! niềm cưng chiều của khách khứa."
  viz_extravagance.t2.treasure.gems: "Nghe nói nhân vật này sở hữu bao tải nối tiếp bao tải toàn đá quý. Những người hiếm hoi từng thấy bộ sưu tập cho rằng mỗi túi đều dành riêng cho một dòng đá đẹp độc nhất."
  viz_extravagance.t2.treasure.sculpture: "Nhân vật này là một người yêu nghệ thuật lớn, và nơi ở của họ thường xuyên trưng bày các bức tượng đúc bằng kim loại quý hoặc tạc từ những loại đá đắt đỏ và bóng bẩy nhất."
  viz_extravagance.t2.treasure.decorative_martial_gear: "Nhân vật này yêu thích vũ khí và giáp mang tính trang trí — nơi ở của họ ngập tràn những trang bị quân sự hoa mỹ nhưng thiếu thực dụng, từ kiếm vàng cho tới khiên khảm đá quý."
  viz_extravagance.t2.treasure.bezoar_cutlery: "Nhân vật này sở hữu một bộ dao nĩa bezoar đắt đến phi lý: những viên đá huyền bí này được cho là có thể làm chậm, trung hòa, hoặc thậm chí đảo ngược tác dụng của cả những chất độc chết người nhất, khiến bộ dụng cụ vừa cực kỳ thời thượng #EMP vừa#! hữu dụng."
 # Narrator's note: bezoars do not, in fact, stop poison. Le big RIP.
  viz_extravagance.t2.treasure.fly_stones: "Nhân vật này có một bộ sưu tập nhỏ các viên đá xua ruồi: một loại đá huyền bí được cho là có thể xua đuổi ruồi, muỗi và các loài côn trùng vo ve khác trong một bán kính nhỏ, khiến chúng trở thành món đồ rất được ưa chuộng trên bàn tiệc."
 # Narrator's note: fly stones are sadly fictional.
  viz_extravagance.t2.treasure.indexed_bribes: "Nhân vật này nổi tiếng với những khoản hối lộ được sắp xếp tỉ mỉ và phân tầng rõ ràng, đều đặn và dễ đoán đến mức người ta tin rằng họ luôn có sẵn hàng trăm túi tiền với từng kích cỡ — mỗi túi chứa đúng số xu chính xác."
  viz_extravagance.t2.treasure.map_of_world: "Nhân vật này sở hữu một tấm bản đồ của toàn bộ thế giới đã biết. Nghe nói đây là một trong những tấm chính xác nhất trong lãnh thổ, nó bao phủ trọn một bức tường — và họ thường được bắt gặp đang ngắm nhìn nó, đắm chìm trong suy tư."
  viz_extravagance.t2.treasure.horse_armour: "Những chiến mã của nhân vật này hiếm khi xuất hiện mà không được khoác lên những đồ trang sức quý giá và lộng lẫy giống hệt chủ nhân của chúng — từ yên cương đính ngọc trai đến dây cương bạc."
  viz_extravagance.t2.treasure.crockery: "Nhân vật này thường xuyên khoe khoang rằng nhà bếp của họ sở hữu những nồi niêu xoong chảo lớn nhất, làm từ những vật liệu hiếm và quý nhất có thể tìm thấy tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."

  viz_extravagance.t2.activities.feasts.pool: "Nhân vật này thích tổ chức yến tiệc quanh một hồ nước nhân tạo rộng rãi, được xây dựng với chi phí khổng lồ tại một trong những tư dinh của họ và bao quanh bởi gối mềm, ghế dài cùng tiếng rót đồ uống lanh canh."
  viz_extravagance.t2.activities.gambling.horse: "Niềm tự hào lớn nhất của nhân vật này là cả một chuồng ngựa đua thi đấu — gần như tất cả đều thuộc giống ngoại thuần chủng."
  viz_extravagance.t2.activities.feasts.interactive: "Yến tiệc của nhân vật này nổi tiếng với tính tương tác: túi tiền giấu trong món ăn của khách, khế ước đất đai chỉ chờ chữ ký trong nhà xí, những bức tượng bung mở để lộ viên đá quý cho người đầu tiên giải được bí mật của chúng, và còn nhiều trò khác."
  viz_extravagance.t2.activities.feasts.long: "Nhân vật này tin chắc rằng một bữa tiệc chỉ kết thúc khi kho lương của chủ nhà cạn sạch — vì thế, một số yến tiệc của họ được biết là kéo dài cả tuần hoặc hơn."
  viz_extravagance.t2.activities.concerts: "Nhân vật này coi trọng âm nhạc hơn mọi loại hình nghệ thuật khác, và xem sự vắng mặt của nó là bi kịch lớn nhất. Nhiều buổi lễ hội của họ về bản chất là những buổi hòa nhạc quy mô lớn — đôi khi đủ lớn để một số dân thường cũng được tham dự."
  viz_extravagance.t2.activities.theatre: "Nhân vật này yêu thích kịch nghệ, diễn xuất và nhào lộn hơn hẳn người thường. Các yến tiệc của họ có số lượng nghệ sĩ lang thang vượt trội, và những vở kinh điển với gương mặt mới là tiết mục quen thuộc trong mọi bữa tiệc."
  viz_extravagance.t2.activities.poetry: "Nhân vật này tự cho mình là một thi sĩ — dù người khác có đồng ý hay không, lời mời đến những yến tiệc xa hoa nơi họ đọc thơ vẫn luôn được săn đón."
  viz_extravagance.t2.activities.amnesties: "Nhân vật này tin rằng bất kỳ ai cũng có thể được tha thứ, miễn là họ biết ăn năn và chuộc lỗi — họ dùng vị trí hành chính của mình để tổ chức các đợt đại xá định kỳ cho những tội phạm chứng tỏ đủ thành tâm."
  viz_extravagance.t2.activities.animal_baiting: "Nhân vật này yêu thích nhất là những tiếng khịt mũi, gầm gừ và la hét của một con thú dữ đang chiến đấu cho mạng sống. Những kẻ chọc thú, chó săn và các sinh vật hung dữ, cả ngoại lai lẫn quen thuộc, giao chiến trong các hố đấu tại hầu hết các yến tiệc của họ."
  viz_extravagance.t2.activities.sermons: "Nhân vật này sùng đạo một cách mãnh liệt vượt xa mức lễ nghi thông thường, và luôn cố tình lấp đầy các buổi lễ hội của mình bằng những bài giảng cùng các [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural] lang thang."

  viz_extravagance.t2.property.monopoly: "Nhân vật này đủ may mắn để nắm độc quyền việc buôn bán một số mặt hàng thiết yếu trong phạm vi tường thành [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]; việc họ kiểm soát chính cơ quan cấp phép các độc quyền này có lẽ hoàn toàn không liên quan."
  viz_extravagance.t2.property.exotic_market: "Nhân vật này sở hữu, đồng thời thu thuế hậu hĩnh từ, một trong những khu chợ hàng hóa ngoại lai nổi tiếng hơn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t2.property.mine: "Nhân vật này sở hữu một mỏ sinh lợi nằm gần thủ đô, một nguồn cung kim loại thông dụng thiết yếu cho sinh hoạt gia đình và thương mại."
  viz_extravagance.t2.property.warehouses: "Nhân vật này sở hữu một quần thể kho bãi thực sự rộng lớn, nép mình gần trung tâm thương mại của thủ đô. Hàng hóa ngoại nhập chất đầy đến mức dân địa phương gọi nơi này là 'Kho Tàng của [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip]'."
  viz_extravagance.t2.property.messenger_network: "Nhân vật này sử dụng một mạng lưới sứ giả kín đáo trên toàn lãnh thổ (và quan trọng hơn là #EMP trung thành#!), có khả năng truyền đạt ý chí và mệnh lệnh của họ tới mọi tiền đồn."
  viz_extravagance.t2.property.workshops: "Nhân vật này sở hữu gần như toàn bộ các xưởng thủ công trên một trong những con phố công nghiệp sầm uất hơn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], một con đường nổi tiếng với hàng hóa đa dạng và tinh xảo."
  viz_extravagance.t2.property.personal_temple: "Nhân vật này sở hữu một [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.HouseOfWorship] cá nhân lộng lẫy, chỉ dành cho họ, gia đình họ và những đồng minh thân cận nhất."
  viz_extravagance.t2.property.fort: "Nhân vật này sở hữu một pháo đài nhỏ ở một vùng biên địa hiểm trở gần [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural]. Dù tốn kém để duy trì, nguồn thu từ những con thú bị bắt trong khu vực lại rất béo bở."
  viz_extravagance.t2.property.treasury: "Ngân khố của nhân vật này lớn đến mức chiếm trọn một tòa nhà riêng — một quần thể kiên cố giữa lòng [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], nơi tiền bạc của họ được đảm bảo an toàn."
  viz_extravagance.t2.property.defensible_palace: "Nhân vật này duy trì một cung điện nhỏ được gia cố tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — nghe nói nơi đây đầy rẫy những lối đi bí mật và đường thoát thân ẩn giấu."

  viz_extravagance.t2.charity.schools: "Nhân vật này đích thân tài trợ cho nhiều trường học nhằm giáo dục trẻ nhỏ — những đứa trẻ mà nếu không có sự giúp đỡ này thì gần như không có chút hy vọng nào được học hành."
  viz_extravagance.t2.charity.hospitals: "Nhân vật này đích thân tài trợ cho một số bệnh viện danh tiếng tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], những cơ sở chữa trị cho tầng lớp nghèo nhất trong xã hội nhưng hoàn toàn phụ thuộc vào sự hào phóng của họ."
  viz_extravagance.t2.charity.poor_funerals: "Nhân vật này đích thân chi trả tang lễ cho những người qua đời tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] mà không có tiền bạc, gia đình hay Bạn Bè, để họ có thể ra đi với phẩm giá."
  viz_extravagance.t2.charity.scholars.philosophical: "Nhân vật này đích thân tài trợ cho nhiều triết gia và học viện quan trọng, tập trung vào việc khám phá những quy luật sâu xa của thế giới."
  viz_extravagance.t2.charity.scholars.legal: "Nhân vật này đích thân tài trợ cho một số luật sư, pháp quan và giáo sĩ pháp lý hàng đầu của lãnh địa, góp phần làm rõ và củng cố việc thực thi một nền hòa bình công bằng và chính trực cho mọi người."
  viz_extravagance.t2.charity.civil_service.extra_positions: "Nhân vật này đích thân tài trợ nhân sự cho các vị trí then chốt trong bộ máy hành chính, khuếch đại sức mạnh của quan liêu lên gấp nhiều lần bằng cách rót tiền đúng chỗ."
  viz_extravagance.t2.charity.police: "Nhân vật này đích thân tài trợ cho một đội ngũ cảnh binh và chấp pháp trung thành đi tuần tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], đảm bảo luật pháp được thi hành đúng mức mà tể tướng mong muốn."
  viz_extravagance.t2.charity.scholars.theological: "Nhân vật này đích thân tài trợ cho một số học giả thần học danh tiếng nhất trong lãnh địa, đầu tư vào việc phát triển học thuyết [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.GetAdjective] chính thống vì lợi ích của các tín hữu."
  viz_extravagance.t2.charity.scholars.mystical: "Nhân vật này đích thân tài trợ cho nhiều nhà huyền học, bí thuật gia và kẻ xuất thần nổi tiếng, những người truyền bá tri thức kỳ lạ của họ tại các triều đình ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t2.charity.circumcision: "Nhân vật này đích thân chi trả cho việc cắt bao quy đầu và giáo dục tôn giáo cho một số bé trai mồ côi từ đường phố [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] mỗi năm."
  viz_extravagance.t2.charity.preachers: "Nhân vật này đích thân tài trợ cho các [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural] khất sĩ đi khắp lãnh thổ, chăm lo cho các tín hữu nghèo khổ và đưa ra lời khuyên tinh thần đúng đắn cho những kẻ thuộc các đức tin thấp kém hơn."

  viz_extravagance.t3.treasure.mirrors: "Nhân vật này sở hữu hàng chục chiếc gương trong suốt nhất mà tiền có thể mua được, thể hiện mức xa hoa phù phiếm đến mức gần như không đứng đắn — thứ mà ngay cả rất ít quý tộc cũng dám mơ tới."
  viz_extravagance.t3.treasure.parasols: "Nhân vật này dường như sở hữu một chiếc ô cho mỗi ngày trong năm: chiếc thì thêu vàng, chiếc thì bạc, chiếc bằng lụa, chiếc bằng gấm, chiếc đính hồng ngọc, chiếc đính lục bảo, và cứ thế, cứ thế, không dứt..."
  viz_extravagance.t3.treasure.silk_bigtop: "Nhân vật này sở hữu một lều du hành đủ chỗ cho năm mươi người trở lên, làm từ loại lụa xa hoa nhất — mỗi tấm vải đều được thêu công phu, mỗi cột lều đều là kim loại quý hoặc sơn mài đắt tiền."
  viz_extravagance.t3.treasure.fabrics: "Nhân vật này tự hào sở hữu số lượng lớn các loại vải xa xỉ nhất trong thế giới đã biết: lụa, gấm, nhung, brocade tinh xảo, chăn thêu cầu kỳ, và một biển biến thể nhỏ cùng đặc sản vùng miền gần như vô hạn."
  viz_extravagance.t3.treasure.exotic_pets: "Nhân vật này vừa mê hoặc vừa khiến khách khứa khiếp sợ bằng bộ sưu tập thú cưng ngoại lai của mình: sư tử, hổ, nai ngoại quốc kỳ lạ và còn nhiều sinh vật quái dị khác tô điểm cho vườn thú riêng."
  viz_extravagance.t3.treasure.carpets: "Nhân vật này sở hữu một tấm thảm đặc biệt lừng danh: dài một trăm cubit và rộng một nửa, dệt từ tơ lụa mịn khâu chỉ vàng, lót sa tanh bạc, thêu các cảnh tôn giáo và lịch sử được cho là kể lại toàn bộ lịch sử thế giới."
  viz_extravagance.t3.treasure.gold_mattress: "Nhân vật này sở hữu một tấm đệm được đồn là dệt hoàn toàn từ chỉ vàng, từng được những nhân vật nổi tiếng nhất của lịch sử gần đây sử dụng."
  viz_extravagance.t3.treasure.birth_control: "Nhân vật này sở hữu các loại thuốc nước, viên uống và những biện pháp kỳ lạ hơn nhằm đảm bảo việc giao hoan an toàn, khoái lạc và không sinh sản."
  viz_extravagance.t3.treasure.sculpture.articulated: "Niềm tự hào lớn nhất của nhân vật này là một bức tượng đa khớp mô tả chính họ, với tư thế và y phục có thể thay đổi vô hạn theo ý muốn của tể tướng."
  viz_extravagance.t3.treasure.plants: "Nhân vật này sở hữu một bộ sưu tập cây cỏ hiếm có lừng danh, rêu và thảo dược — mỗi mẫu được giữ trong một trong năm trăm chậu pha lê."

  viz_extravagance.t3.activities.feasts.surprise: "Nhân vật này nổi tiếng với những yến tiệc kèm các món ban thưởng bất ngờ cho khách mời duyên dáng: một câu đùa hóm hỉnh được thưởng mười nghìn gia súc, một bộ y phục lộng lẫy được tặng cả một cung điện xa xôi cùng gia nhân, hay một cuộc trò chuyện hấp dẫn được đền đáp bằng áo lụa nhuộm màu."
  viz_extravagance.t3.activities.aid: "Nhân vật này giữ cho các quý tộc láng giềng  quanh lãnh địa luôn hài lòng bằng những món quà nhỏ rải rác: một trăm tấm thảm xa hoa, ba nghìn yên ngựa hảo hạng, mười hai hũ long diên hương, mười nghìn cây giáo tốt — đại loại vậy."
  viz_extravagance.t3.activities.scholars.debates: "Nhân vật này mời các học giả đủ mọi trường phái từ khắp thế giới đã biết đến dự các buổi tụ họp, say mê những cuộc đối thoại giữa những bộ óc vĩ đại nhất của thời đại quanh cùng một bàn."
  viz_extravagance.t3.activities.feasts.give_away: "Nhân vật này thích tổ chức yến tiệc cho các đồng minh trung thành, thuộc hạ và thân hữu — hoàn toàn trùng hợp là họ thường ban phát tài sản trị giá bằng tiền chuộc của một vương tử tại những sự kiện như vậy, mà lúc nào cũng dường như còn dư quà đắt đỏ để cho."
  viz_extravagance.t3.activities.land_and_livestock_grants: "Đàn gia súc đông đúc của nhân vật này là huyền thoại địa phương; số lượng động vật họ ban thưởng cho công trạng hoặc bồi thường từ thiện mỗi năm dễ dàng lên đến hàng chục nghìn."
  viz_extravagance.t3.activities.feasts.spectacle: "Yến tiệc của nhân vật này tập trung vào phô diễn: nếu họ không thể #EMP ít nhất#! khoe một nghệ sĩ uốn dẻo nhảy múa, thăng bằng trên cột có một đứa trẻ nhảy nhót phía trên và tung hứng than hồng, thì còn có ý nghĩa gì nữa?"
  viz_extravagance.t3.activities.feasts.coin_shower: "Nhân vật này thích những màn phô trương của cải theo nghĩa đen tại yến tiệc: họ thường xuyên cho mưa hàng trăm hay hàng nghìn đồng tiền trút xuống những vị khách được ưu ái."
  viz_extravagance.t3.activities.gambling.palanquin: "Nhân vật này tuyên bố đã phát minh và làm chủ một môn thể thao kỳ lạ: đua kiệu, nơi những người khiêng kiệu của họ thi với đối thủ để đưa chủ nhân tới một điểm định sẵn ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] trong thời gian nhanh nhất."
  viz_extravagance.t3.activities.orgies: "Nhân vật này công khai tổ chức những yến tiệc tập trung vào khoái lạc xác thịt, nơi khách mời được chiều chuộng và phục vụ đến mức tối đa — và trơn tru nhất."
  viz_extravagance.t3.activities.parades: "Nhân vật này tin rằng của cải mà che giấu thì vô nghĩa: họ say mê việc tổ chức các cuộc diễu hành khoe thú cưng ngoại lai, ngựa quý, gia nhân được chăm chút và hàng hóa đắt tiền, đều được phô bày trên đường phố [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] một cách thường xuyên."

  viz_extravagance.t3.property.pool.cushions: "Nhân vật này duy trì một hồ bơi lớn được lót đầy đệm — bởi lẽ xuống nước cũng không phải là lý do để thiếu đi sự xa hoa."
  viz_extravagance.t3.property.businesses: "Các lợi ích kinh doanh của nhân vật này là một mê cung xoắn vặn gồm các tuyến thương mại liên kết, độc quyền, bảo trợ và điền sản."
  viz_extravagance.t3.property.palace.huge: "Nhân vật này duy trì một cung điện mà trên danh nghĩa chỉ #EMP hơi#! nhỏ hơn cung điện của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]. Những ai từng tận mắt thấy thì thường tỏ ra nghi ngờ điều đó."
  viz_extravagance.t3.property.bathhouse: "Nhân vật này duy trì một nhà tắm tư nhân cầu kỳ cho bản thân và các đồng minh thân cận, một trung tâm chính trị cho mọi âm mưu bẩn thỉu nhất — nhưng lại sáng bóng sạch sẽ — tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t3.property.stables: "Nhân vật này sở hữu một khu chuồng ngựa đồ sộ đến mức khó tin, nuôi hàng trăm hoặc nhiều hơn nữa những chiến mã tinh túy nhất trong lãnh địa."
  viz_extravagance.t3.property.pool.gold: "Nhân vật này sở hữu một hồ bơi mà đáy được lót bởi một lớp dày tiền vàng — của cải mà không thể nổi lên trên thì có ý nghĩa gì?"
  viz_extravagance.t3.property.fleet.commercial: "Nhân vật này sở hữu hàng chục tàu buôn tư nhân, tạo thành một hạm đội thực sự trải rộng khắp địa cầu."
  viz_extravagance.t3.property.business.stolen: "Nhân vật này dường như liên tục thâu tóm các cơ sở kinh doanh nhỏ hơn vốn không trả nổi nợ, είτε cho các chủ nợ hoặc cho nhà nước. Bản năng sinh tồn khiến hầu hết mọi người không dám bình luận."
  viz_extravagance.t3.property.tycoon: "Nhân vật này sở hữu gần trọn một phần tư [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], với cả những khu vực rộng lớn nằm trong điền trang tư nhân của họ."
  viz_extravagance.t3.property.den_of_vice: "Nhân vật này bị đồn là chủ nhân của một trong những ổ truỵ lạc tai tiếng nhất tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], nơi có thể mua được bất kỳ hỗn hợp chất ngoại lai nào — miễn là có đủ bạc."

  viz_extravagance.t3.charity.observatories: "Nhân vật này bảo trợ cho một đài thiên văn lớn, quan sát bầu trời và ghi chép chuyển động của các vì sao."
  viz_extravagance.t3.charity.universities: "Nhân vật này tài trợ cho một số đại học địa phương nhỏ nhưng danh giá, thúc đẩy học thuật và tri thức dưới danh nghĩa của họ."
  viz_extravagance.t3.charity.libraries: "Tiền bạc của nhân vật này thường được dùng cho việc xây dựng, mở rộng và bảo tồn một số thư viện chọn lọc, sao chép các tác phẩm vĩ đại để lan tỏa tri thức trong giới quý tộc."
  viz_extravagance.t3.charity.bathhouses: "Nhân vật này đã xây dựng và vẫn trợ cấp cho một nhà tắm công cộng lớn tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], khiến họ được dân thường yêu mến — những người vốn khó lòng chi trả cho sự xa hoa đồ sộ như vậy."
  viz_extravagance.t3.charity.hospitals.equipment: "Nhân vật này không chỉ tài trợ cho các bệnh viện địa phương mà còn đảm bảo chúng được trang bị những loại dược cao, dụng cụ phẫu thuật và vật dụng y học huyền bí mới nhất."
  viz_extravagance.t3.charity.civil_service.expansion: "Nhân vật này chi trả lương cho một loạt rộng các chức năng hành chính, phân bổ đều hơn khối lượng công việc hằng ngày và giảm áp lực cho nhà nước."
  viz_extravagance.t3.charity.watermills: "Nhân vật này tài trợ cho việc xây dựng các cối xay nước cộng đồng tại những làng mạc nghèo khó và khu vực nông thôn, cải thiện đáng kể chất lượng cuộc sống."
  viz_extravagance.t3.charity.beggar_spies: "Sự hoang tưởng huyền thoại của nhân vật này được cho là khiến họ thuê tới một nửa số ăn mày và lang thang trong lãnh địa, cung cấp thức ăn và chỗ ở đổi lấy đôi mắt và đôi tai của họ."
  viz_extravagance.t3.charity.hajj_water_tanks: "Nhân vật này đích thân chi trả cho việc xây dựng và đổ đầy các bể chứa nước bên ngoài thánh địa Mecca, giúp duy trì nguồn nước cho những người hành hương thực hiện Hajj chính nghĩa."
  viz_extravagance.t3.charity.holy_warrior_gear: "Nhân vật này thường xuyên quyên góp vũ khí và giáp trụ cho binh sĩ phục vụ các mục đích thánh chiến khác nhau, dù là cướp phá kẻ thù của đức tin hay bảo vệ các tín đồ."

  viz_extravagance.t4.treasure.cushions: "Nhân vật này sở hữu hàng ngàn, hàng vạn chiếc đệm, một cơn lũ taffeta và lụa cuồn cuộn khiến mọi căn phòng trong mọi dinh thự của họ đều trở thành nơi lý tưởng để ngồi — hoặc thậm chí chợp mắt."
  viz_extravagance.t4.treasure.martial_gear: "Nhân vật này mê mẩn đồ chơi quân sự hơi quá mức; theo lời đồn, họ có nhiều vũ khí và giáp trang trí hơn cả số đơn vị #EMP thực sự#! của [ROOT.Char.GetTitleAsNameNoTooltip]."
  viz_extravagance.t4.treasure.cosmetics: "Nhân vật này sở hữu kho nước hoa trị giá bằng tiền chuộc của một hoàng đế: long diên hương đựng theo hũ, nước hoa hồng, ghaliya thơm, bột xạ hương, tinh chất trầm hương và, dĩ nhiên, nghệ tây, tất cả đều ở số lượng và bình chứa đủ để nuôi cả quân đội."
  viz_extravagance.t4.treasure.office: "Văn phòng tể tướng của nhân vật này được chạm khắc và trang bị bằng đá, thủy tinh khảm kim loại đắt tiền, toát lên quyền lực điềm tĩnh và cứng rắn."
  viz_extravagance.t4.treasure.crockery.historic: "Nhân vật này duy trì một bộ đầy đủ đồ dùng yến tiệc mà theo lời đồn, mỗi món từng thuộc về người cai trị của một vương quốc ngoại lai hoặc đế chế cổ đại đã diệt vong."
  viz_extravagance.t4.treasure.precious_orchard: "Nhân vật này nổi tiếng với khu vườn quý giá của mình: một sân trong đầy những cây nhân tạo rèn từ vàng và bạc, kết trái bằng đá quý chạm khắc."
  viz_extravagance.t4.treasure.fleet.personal: "Nhân vật này nổi danh bởi dáng vẻ ấn tượng của chiếc thuyền giải trí cá nhân, cùng vô số tàu thuyền nhỏ khác hoạt động trên các tuyến thủy đạo của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] dưới danh nghĩa của họ."
  viz_extravagance.t4.treasure.massive_sword: "Nhân vật này khét tiếng vì sở hữu một thanh kiếm trang trí dài bằng ba binh sĩ đặt chân chạm đầu, treo dọc theo một trong những bức tường rộng của đại sảnh ưa thích."
  viz_extravagance.t4.treasure.mystic_ingredients: "Nhân vật này bị thì thầm về bộ sưu tập nguyên liệu giả kim ngoại lai: cây cỏ lạ từ phương xa, quặng kỳ dị từ sâu trong lòng đất, và bột nghiền từ thịt xương của các sinh vật huyền thoại."
  viz_extravagance.t4.treasure.sensible_investments_for_smart_adults: "Nhân vật này sở hữu một bản thảo minh họa duy nhất với hình ảnh xấu xí của một con khỉ — theo lời đồn, tác phẩm này cực kỳ đắt đỏ, nhưng nguồn gốc giá trị của nó thì không rõ ràng."

  viz_extravagance.t4.activities.feasts.pool.rose: "Nhân vật này nổi tiếng với việc tổ chức những buổi tiệc mà hồ bơi của họ được rải kín hoa trị giá hàng chục nghìn đồng tiền — một cảnh tượng thơm ngát và phô trương vượt xa bất cứ điều gì mà phần lớn khách mời từng thấy trong đời."
  viz_extravagance.t4.activities.give_aways: "Nhân vật này tùy hứng ban phát những món quà có giá trị vượt xa cả gia sản mà ngay cả những thương nhân may mắn nhất cũng chỉ dám mơ tích lũy trong cả đời."
  viz_extravagance.t4.activities.feasts.big: "Thứ mà nhân vật này gọi là 'một bữa tiệc riêng tư giữa Bạn Bè', thì với hầu hết những người khác lại là 'một lễ hội khổng lồ mười năm mới có một lần'."
  viz_extravagance.t4.activities.menagerie: "Vườn thú của nhân vật này có đủ loài bò sát rít lên, chim chóc rực rỡ, thú lớn khổng lồ, và dường như là đại diện cho gần như toàn bộ bức tranh đồ sộ các loài sinh vật mà thế giới có thể mang lại."
  viz_extravagance.t4.activities.aid: "Sự hào phóng của nhân vật này tài trợ cho những gói viện trợ hậu hĩnh đến mức một số kẻ tự xưng là 'quý tộc' ở lân cận dường như hoàn toàn phụ thuộc vào các khoản ban phát đó để giữ thể diện."
  viz_extravagance.t4.activities.host: "Nhân vật này coi việc tiếp đón các nhà ngoại giao nước ngoài là tối quan trọng, chỉ đứng sau việc tiêu tốn khối lượng tiền khổng lồ để chứng minh các lãnh địa của khách mời thua kém họ đến mức nào."
  viz_extravagance.t4.activities.gambling.xtra_xtreme: "Nhân vật này đánh cược tiền bạc, thú vật, đất đai, mạng sống, và bất cứ thứ gì khiến họ hứng thú — tất cả với quy mô khổng lồ đến mức khiến một số người tự hỏi liệu của cải của họ có thực sự #EMP là#! vô tận hay không."
  viz_extravagance.t4.activities.masquerade: "Nhân vật này thường xuyên tổ chức các dạ tiệc hóa trang, đặt chủ đề từ lịch sử và thần thoại cho khách mời noi theo, và mong đợi mỗi người phải chi tiêu ít nhất cả tháng thu nhập — hoặc hơn — cho mỗi bộ trang phục."
  viz_extravagance.t4.activities.plants.ever_changing: "Nhân vật này tin rằng sự đa dạng chính là gia vị của cuộc sống, và duy trì một khu vườn với các loài cây cối, hương thơm và thảo mộc ngoại lai luôn thay đổi, tất cả nở hoa và kết trái vào những thời điểm khác nhau trong năm và dưới những điều kiện khác nhau."
  viz_extravagance.t4.activities.feasts.cannibal: "Mọi người đều đồng ý rằng nhân vật này tổ chức những yến tiệc ngon bậc nhất mà lãnh địa từng biết đến, tràn ngập những tảng thịt mọng nước — dù rất ít người dám chắc đó là loại thịt gì."

  viz_extravagance.t4.property.palace.pool: "Nhân vật này duy trì một cung điện riêng chỉ để chứa hồ bơi khổng lồ của mình. Họ sinh sống ở nơi khác, nhờ vậy có thể tách biệt hoàn toàn khu sinh hoạt và văn phòng riêng khỏi nơi dùng để đãi khách."
  viz_extravagance.t4.property.palace.spa: "Nhân vật này sở hữu một khu nghỉ dưỡng rộng rãi ở miền quê ngay bên ngoài [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], một nơi yên tĩnh tách biệt khỏi sự ồn ào náo nhiệt của thành phố, được giữ kín nhờ hàng mẫu điền trang bao quanh."
  viz_extravagance.t4.property.army: "Nhân vật này duy trì một đội quân tư nhân gồm côn đồ và móc túi, sẵn sàng thực thi ý chí của họ ở bất cứ đâu trong [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  viz_extravagance.t4.property.livestock: "Những đàn gia súc tư nhân khổng lồ của nhân vật này, từ chiến mã cho đến thú kéo, trải dài trên phần lớn lãnh địa."
  viz_extravagance.t4.property.palace.guest: "Nhân vật này duy trì một cung điện riêng chỉ dành cho khách viếng thăm — một tuyên ngôn về của cải và quyền lực mà rất ít người không nhận ra."
  viz_extravagance.t4.property.spire: "Nhân vật này tiến hành phần lớn công việc tể tướng của mình từ một ngọn tháp ominous, vươn cao hơn phần lớn các tòa nhà trong [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Theo lời đồn, từ vô số cửa sổ của nó có thể nhìn thấy mọi con hẻm và góc phố."
  viz_extravagance.t4.property.palace.monthly: "Nhân vật này duy trì cả tá — hoặc hơn — cung điện khắp [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], luân phiên chuyển chỗ ở từ nơi này sang nơi khác theo từng tháng."
  viz_extravagance.t4.property.bordello: "Nhân vật này vận hành một kỹ viện riêng, nơi các nghệ sĩ được họ yêu thích thường xuyên dâng hiến những khoái lạc dâm đãng nhất cho họ."
  viz_extravagance.t4.property.gaol: "Nhân vật này sở hữu một nhà ngục giam nợ tư nhân — khi dân nghèo không thể trả các khoản nợ với tể tướng, hình phạt sẽ nhanh chóng và rõ ràng: giam giữ cho đến khi gia đình họ xoay đủ tiền. Hy vọng là vậy."
  viz_extravagance.t4.property.palace.torture: "'Địa Ngục [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip]', người ta gọi nơi đó — khu vườn đồn đại của những khoái lạc kỳ dị và công cụ kinh hoàng, nơi nhân vật này trút các hành hạ tàn bạo của mình lên kẻ thù và đối thủ."

  viz_extravagance.t4.charity.waystations: "Nhân vật này chi trả cho các trạm nghỉ và caravanserai khắp lãnh địa, tập trung phục vụ các nhóm nhỏ và những lữ khách đơn độc."
  viz_extravagance.t4.charity.bridges: "Nhân vật này nổi danh vì số tiền họ bỏ ra để xây dựng và bảo trì các cây cầu mới khắp lãnh địa — một dấu hiệu uy tín tối thượng đối với bất kỳ quan chức dân sự nào."
  viz_extravagance.t4.charity.dole: "Nhân vật này trợ cấp một quỹ phát chẩn lương thực tư nhân cho những công dân nghèo khổ nhất của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], đảm bảo rằng không ai hoàn toàn bị đói khi họ vẫn còn tiền để chi."
  viz_extravagance.t4.charity.housing: "Nhân vật này tài trợ việc xây dựng các khu nhà trọ nhỏ tại những khu đất trống của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], hoặc dựa sát tường thành, dành cho những người cần chỗ ở nhất."
  viz_extravagance.t4.charity.gardens: "Nhân vật này chi trả cho việc duy tu một khu vườn công cộng lớn — một pháo đài nhỏ của sự yên bình và tĩnh lặng trong một thế giới đôi khi quá đỗi tàn nhẫn."
  viz_extravagance.t4.charity.civil_service.fire: "Nhân vật này trực tiếp chịu trách nhiệm duy trì một đội cứu hỏa cho [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — điều gần như chưa từng có ở phần còn lại của thế giới."
  viz_extravagance.t4.charity.aqueducts: "Nhân vật này chịu trách nhiệm xây dựng và bảo trì một số đoạn cầu dẫn nước ngắn đưa nước sạch vào [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], điều mang lại cho họ lòng biết ơn của rất nhiều người nghèo nhất trong xã hội."
  viz_extravagance.t4.charity.festivals: "Nhân vật này chi trả cho một lễ hội lớn thường niên dành cho toàn bộ cư dân của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], một sự kiện mà thành phố mong đợi suốt cả năm."
  viz_extravagance.t4.charity.pilgrimage: "Nhân vật này điều hành một quỹ từ thiện cung cấp trợ cấp, trang bị phù hợp và kiến thức lộ trình để mọi người có thể khởi hành một cuộc hành hương thành công."
  viz_extravagance.t4.charity.loans: "Nhân vật này điều hành một quỹ từ thiện tổ chức việc trả thay các khoản vay và nợ nần, hợp pháp hay không, đang đè nặng lên người nghèo trong lãnh địa."

