 # TIT-53191
  proving_grounds_the_stump_domicile_building: "Gốc Cây"
 #proving_grounds_the_stump_domicile_building: "The [GetPlayer.Custom('GetStumpName')|U]"
  proving_grounds_the_stump_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nThấy cái kia không? Thấy mục tiêu trên đó chứ? Đó là điểm bắn hôm nay. Giương cung!"
  proving_grounds_personal_bouts_domicile_building: "Tỷ Thí Cá Nhân"
  proving_grounds_personal_bouts_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nHoàn toàn có thể hình thành khả năng chịu chấn thương sọ não nhờ… từng chịu chấn thương sọ não trước đó."
  proving_grounds_training_circle_domicile_building: "Vòng Huấn Luyện"
  proving_grounds_training_circle_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nNgài không luyện tập để #EMP trở nên#! giỏi, mà để #EMP duy trì#! sự giỏi giang."
  proving_grounds_mock_battle_drills_domicile_building: "Diễn Tập Giao Tranh Giả"
  proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nMột bức tường giáo vẫn là bức tường. Nó đứng vững khi cùng nhau, hoặc sụp đổ cùng nhau."
  proving_grounds_lockwagon_domicile_building: "Xe Chiến Lợi Phẩm"
  proving_grounds_lockwagon_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nChúng ta là một tập thể cùng di chuyển, chiến đấu và #EMP cướp bóc#! như một. Trang bị gom chung, rồi phân phát lại. Nếu không thì…"
  proving_grounds_martial_study_domicile_building: "Nghiên Cứu Binh Pháp"
  proving_grounds_martial_study_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nMọi trận chiến đều từng xảy ra, mọi cuộc chiến đều là hệ quả của cái trước. Vậy sao không tham khảo kết quả?"
  proving_grounds_the_stick_game_domicile_building: "Trò Chơi Gậy"
  proving_grounds_the_stick_game_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nAi giật được mà không làm gãy thì thắng: chỉ gây trầy xước, dao phải cùn, và nếu bị phát hiện thì bị loại."
