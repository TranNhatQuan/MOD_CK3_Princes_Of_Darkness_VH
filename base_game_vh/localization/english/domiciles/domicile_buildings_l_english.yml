  proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nMột kho dự trữ voi dự bị — sinh vật to lớn và vĩ đại nhất trong số các tạo vật của [GetPlayer.GetFaith.CreatorNamePossessive] — là điều mà phần lớn các #EMP quốc vương#! không thể khoe khoang."
  proving_grounds_nightly_barding_drills_domicile_building: "Diễn Tập Giáp Ngựa Ban Đêm"
  proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nMắt xích xoắn vặn, da thuộc rách nát, giáp sắt gỉ sét — ngay cả kỵ binh hạng nặng tinh nhuệ nhất cũng cần luyện tập thường xuyên như bất kỳ ai."
  proving_grounds_life_in_the_saddle_domicile_building: "Cả Đời Trên Yên Ngựa"
  proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nCó người sinh ra đã thuộc về yên ngựa, kẻ khác thì được rèn giũa để gắn bó với nó sau này."
