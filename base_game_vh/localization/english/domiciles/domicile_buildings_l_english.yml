  proving_grounds_horse_run_domicile_building: "Đường Tập Ngựa"
  proving_grounds_horse_run_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nNgựa cũng như con người, cần được vận động và huấn luyện thường xuyên, không chỉ đơn thuần là đi nước kiệu từ nơi này sang nơi khác."
  proving_grounds_camel_run_domicile_building: "Đường Tập Lạc Đà"
  proving_grounds_camel_run_domicile_building_desc: "#weak (Yêu cầu [GetDomicileBuilding('proving_grounds_01').GetName])#!\nChúng có thể là những con thú bướng bỉnh và dữ dằn, nhưng chính vì thế mà đội lạc đà của chúng ta càng cần được huấn luyện đều đặn."
