l_english:

  # everybody's intro to Japan

  action_reactive_advice_welcome_to_japan: "Lời khuyên: Nhật Bản"
  action_reactive_advice_welcome_to_japan_desc: "Trong thời kỳ Heian, Nhật Bản cân bằng giữa quan lại triều đình và các lãnh chúa địa phương. Mở mục này để tìm hiểu về cấu trúc chính trị đặc thù này."
  action_reactive_advice_welcome_to_japan_click: "$click_to_open_lesson$"

  reactive_advice_welcome_to_japan_step_intro: "Nhật Bản"
  reactive_advice_welcome_to_japan_step_intro_desc: "Chào mừng đến với thời kỳ Heian!\n\nTrong thời đại này, Nhật Bản dao động giữa truyền thống và bạo lực. Các [houses|E] đầy tham vọng tranh giành quyền lực và quyền kiểm soát ngai vàng hoàng gia.\n\n#TUT Chúng Ta giả định rằng Ngài đã có một số kinh nghiệm chơi Crusader Kings 3.#!"

  reactive_advice_welcome_to_japan_step_government: "Chính quyền"
  reactive_advice_welcome_to_japan_step_government_desc: "Nhật Bản là một [realm|E] bị chia rẽ giữa hai loại lãnh chúa.\n\nCác [rulers|E] thuộc một trong các hình thức [government|E] sau:\n$EFFECT_LIST_BULLET$[ritsuryo_i][ritsuryo|E] #weak (quan lại triều đình)#!\n$EFFECT_LIST_BULLET$[soryo_i][soryo|E] #weak (lãnh chúa phong kiến)#!\n\nTrong lịch sử, các lãnh chúa $game_concept_soryo$ ngày càng mạnh lên, cuối cùng dẫn đến sự cai trị của [shogun|E] tại Nhật Bản."

  reactive_advice_welcome_to_japan_step_open_families_tab: "$reactive_advice_welcome_to_japan_step_emperor_and_regent$"
  reactive_advice_welcome_to_japan_step_open_families_tab_desc: "Ở Nhật Bản, người được cho là cai trị và người #EMP thực sự#! nắm quyền không phải là một. Hãy cùng xem xét điều này."
  reactive_advice_welcome_to_japan_step_open_families_tab_prompt: "Mở thẻ '$administraction_tab_families|V$' trong bảng '$ADMINISTRATIVE_GOVERNMENT_HEADER|V$' (được đánh dấu)"

  reactive_advice_welcome_to_japan_step_emperor_and_regent: "Thiên hoàng và Nhiếp chính"
  reactive_advice_welcome_to_japan_step_emperor_and_regent_desc: "Đây là [japanese_emperor|E], còn được gọi là $king_tenno_male_japanese$.\n\nMặc dù danh xưng cho thấy ông cai trị Nhật Bản, nhưng ông được xem là [ceremonial_liege|E] và không có quyền lực thực sự.\n\nTuy nhiên, việc kết hôn với gia tộc của ông vẫn mang lại rất nhiều [prestige|E], và một $king_tenno_male_japanese$ đầy tham vọng có thể tìm cách nắm quyền."

  reactive_advice_welcome_to_japan_step_emperor_and_regent_2: "Thiên hoàng và Nhiếp chính"
  reactive_advice_welcome_to_japan_step_emperor_and_regent_2_desc: "Quyền lực thực sự ở Nhật Bản nằm trong tay [ceremonial_regent|E], được hiển thị tại đây.\n\nHọ là [independent|E] [ruler|E] thực sự của Nhật Bản. Ngoài các quyền hạn tiêu chuẩn của một $game_concept_independent$ $game_concept_ruler$, họ còn thiết lập [imperial_policy|E] [law|E] ảnh hưởng đến toàn bộ [realm|E]."

  reactive_advice_welcome_to_japan_step_manor: "$japanese_manor_domicile_type$"
  reactive_advice_welcome_to_japan_step_manor_desc: "Mỗi [house_head|E] tại Nhật Bản đều có một $japanese_manor_domicile_type$, nơi Ngài có thể mở rộng và phát triển bằng [gold|E] kiếm được.\n\nKhác với các [holdings|E] trong [domain|E] của Ngài, $japanese_manor_domicile_type$ sẽ gắn liền với [house_head|E] và không bị mất nếu [domain|E] của Ngài bị chinh phục.\n\n#I Nếu Ngài là $game_concept_house_head$, Ngài có thể xem và phát triển $japanese_manor_domicile_type$ bằng nút được đánh dấu#!."

  reactive_advice_welcome_to_japan_step_house_aspirations: "Khát vọng Gia tộc"
  reactive_advice_welcome_to_japan_step_house_aspirations_desc: "Tất cả các [houses|E] tại Nhật Bản đều có một [house_aspiration|E].\n\nThuộc tính này ảnh hưởng đến mọi thành viên của $game_concept_house$, và có thể được cải thiện theo thời gian khi [house_head|E] tiêu tốn [prestige_i|E][prestige|E].\n\n#I Với tư cách là $game_concept_house_head$, Ngài có thể xem và nâng cấp $game_concept_house_aspiration$ thông qua nút được đánh dấu."

  reactive_advice_welcome_to_japan_step_blocs: "Khối Gia tộc"
  reactive_advice_welcome_to_japan_step_blocs_desc: "Hầu hết các [vassals|E] ở Nhật Bản chỉ cai trị một [county|E].\n\nĐể củng cố quyền lực, hầu hết các [houses|E] đều thuộc về một [house_bloc|E], một liên minh phòng thủ gồm các [houses|E].\n\nCác thành viên của một $game_concept_house_bloc$ thường có cùng [house_aspiration|E] và có [house_relations|E] tốt với nhau. Nếu không, [bloc_cohesion|E] sẽ bị giảm sút và [leading_house|E] có thể chọn trục xuất các $game_concept_houses$ gây tranh cãi khỏi $game_concept_bloc$.\n\n#I Nếu ngài là một phần của $game_concept_bloc$, ngài có thể xem trạng thái của $game_concept_bloc$ của mình bằng cách nhấp vào nút được đánh dấu.#!"

  reactive_advice_welcome_to_japan_step_end: "Nhật Bản"
  reactive_advice_welcome_to_japan_step_end_desc: "Tại Nhật Bản, chính trị luôn là cuộc đấu tranh giữa hai thế lực. Hãy dẫn dắt [house|E] của Ngài một cách khôn ngoan, và Ngài sẽ quyết định tương lai của Nhật Bản."


 # Soryo in japan, your goal to become Shogun

  action_reactive_advice_soryo_intro: "Lời khuyên: Người cai trị $japan_feudal_government$"
  action_reactive_advice_soryo_intro_desc: "Ngài là một Người cai trị Soryo, một lãnh chúa địa phương. Mở mục này để tìm hiểu về loại hình chính quyền này."
  action_reactive_advice_soryo_intro_click: "$click_to_open_lesson$"

# lets assume you are in a bloc, but be a bit vague about it. Most on game start are anyway

  reactive_advice_soryo_intro_NAME: "Chính quyền $japan_feudal_government$"

  ra_soryo_intro: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_intro_desc: "Ngài là một [ruler|E] thuộc [GetGovernment('japan_feudal_government').GetName]: một lãnh chúa cai trị bằng sức mạnh vũ lực thay vì tính chính danh của bộ máy quan liêu triều đình."

  ra_soryo_basics: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_basics_desc: "[government|E] [GetGovernment('japan_feudal_government').GetName] rất giống với $game_concept_government$ [GetGovernment('feudal_government').GetName] bên ngoài Nhật Bản.\n\nTuy nhiên, tại Nhật Bản thời Heian, việc mở rộng [realm|E] thông qua [war|E] bị coi là một [crime|E]. Do đó, [top_liege|E] của Ngài có thể tự do tước đoạt các [titles|E] của Ngài.\n\nĐể ngăn $game_concept_top_liege$ lấy đi những gì Ngài đã giành được, Ngài nên đảm bảo mình là thành viên của một [house_bloc|E]. Trong trường hợp $game_concept_top_liege$ tuyên bố $game_concept_war$ với Ngài, các [houses|E] trong $game_concept_bloc$ của Ngài sẽ tham gia với tư cách là [allies|E].\n\n#I Nếu Ngài đã là thành viên của một $game_concept_bloc$, Ngài có thể chọn nó bằng nút được đánh dấu#!."

  ra_soryo_open_decisions: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_open_decisions_desc: "Khát vọng tối thượng của bất kỳ [ruler|E] [GetGovernment('japan_feudal_government').GetName] nào là trở thành [shogun|E], một $game_concept_ruler$ quân sự và cha truyền con nối của Nhật Bản.\n\nĐể đạt được điều này, có hai [decisions|E] then chốt mà Ngài có thể thực hiện. Hãy cùng xem chúng ngay bây giờ."
  ra_soryo_open_decisions_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"

  ra_soryo_regional_dominion: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_regional_dominion_desc: "Quyết định [decision|E] đầu tiên cần hướng tới là '$tgp_japan_assert_regional_dominion_government_decision|V$'.\n\nĐiều này cho phép ngài chinh phục [duchy|E] trong khu vực của mình. Mặc dù không bắt buộc để trở thành [shogun|E], đây là một bước đệm hữu ích.\n\n#TUT Nếu ngài đã đạt [rank|E] [duke|E], $game_concept_decision$ này sẽ không khả dụng.#!"

  ra_soryo_shogunate: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_shogunate_desc: "[decision|E] thực sự để trở thành [shogun|E] là '$tgp_japan_become_shogun_decision_TUTORIAL|V$'.\n\nTuy nhiên, để có thể cân nhắc điều này, trước hết Ngài phải trở thành [ceremonial_regent|E]."

  ra_soryo_intro_open_factions: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_intro_open_factions_desc: "Để tự mình trở thành [ceremonial_regent|E], Ngài phải khởi xướng một [faction|E]."
  ra_soryo_intro_open_factions_prompt: "Mở thẻ '$factions_tab_my_factions|V$' trong bảng '$FACTIONS_WINDOW|V$'"

  ra_soryo_intro_install_regent_faction: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_intro_install_regent_faction_desc: "Để trở thành [ceremonial_regent|E], Ngài phải thành lập một [faction|E] $replace_ceremonial_regent_faction_name|V$ và thành công trong việc cưỡng chế yêu sách của mình.\n\nVới tư cách là [leading_house|E], tất cả các [houses|E] trong $game_concept_bloc$ của Ngài sẽ tham gia $game_concept_faction$. Lực lượng quân sự của $game_concept_bloc$ càng mạnh, khả năng $game_concept_faction$ thành công càng cao.\n\nNgài cũng phải đảm bảo [cohesion|E] đủ cao, nếu không Ngài thậm chí không thể thành lập $game_concept_faction$."

  ra_soryo_end: "$reactive_advice_soryo_intro_NAME$"
  ra_soryo_end_desc: "Là một [ruler|E] [GetGovernment('japan_feudal_government').GetName], con đường dẫn tới [shogun|E] của Ngài được mở ra bằng lưỡi gươm.\n\nHãy củng cố quyền lực địa phương, thành lập một [faction|E] cùng [house_bloc|E] của Ngài, và một ngày nào đó Ngài có thể cai trị với tư cách là $game_concept_shogun$."


# reactive_advice_lead_your_soryo_bloc

  action_reactive_advice_lead_your_soryo_bloc_NAME: "Dẫn dắt $game_concept_house_bloc$ của Ngài"

  action_reactive_advice_lead_your_soryo_bloc: "Lời khuyên: $action_reactive_advice_lead_your_soryo_bloc_NAME$"
  action_reactive_advice_lead_your_soryo_bloc_desc: "Ngài là $game_concept_house_head$ của $game_concept_leading_house$ trong $game_concept_bloc$ của mình. Mở mục này để tìm hiểu cách quản lý $game_concept_bloc$."
  action_reactive_advice_lead_your_soryo_bloc_click: "$click_to_open_lesson$"

  ra_soryo_bloc_leader_intro: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_leader_intro_desc: "Ngài là [house_head|E] của [leading_house|E] trong [house_bloc|E] của mình — tuyệt vời!\n\nVới tư cách là người lãnh đạo $game_concept_bloc$, nó không chỉ còn là một tấm khiên phòng thủ, mà còn là công cụ để Ngài hình thành một [faction|E] hùng mạnh nhằm đưa Ngài lên vị trí [ceremonial_regent|E]!"

  ra_soryo_bloc_leader_open_bloc: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_leader_open_bloc_desc: "Hãy cùng xem qua [house_bloc|E] của Ngài."
  ra_soryo_bloc_leader_open_bloc_prompt: "Chọn $game_concept_bloc$ của Ngài (được đánh dấu)"

  ra_soryo_bloc_leader_strength_intro: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_leader_strength_intro_desc: "Các [houses|E] trong [bloc|E] của Ngài sẽ đứng về phía [leading_house|E] khi họ khởi xướng [factions|E].\n\nNếu Ngài muốn trở thành [ceremonial_regent|E], và cuối cùng là [shogun|E], họ sẽ tham gia $replace_ceremonial_regent_faction_name|V$ $game_concept_faction$ của Ngài!"
 
  ra_soryo_bloc_leader_strength_details: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_leader_strength_details_desc: "Sức mạnh tổng thể của toàn bộ thành viên trong [bloc|E] được hiển thị tại đây.\n\n$game_concept_bloc$ của Ngài càng mạnh, thì [faction|E] của Ngài càng có khả năng cưỡng chế yêu sách và đưa Ngài lên vị trí [ceremonial_regent|E]."

  ra_soryo_bloc_leader_expanding: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_leader_expanding_desc: "Một [bloc|E] mạnh mẽ là một khối có nhiều [houses|E] hùng mạnh.\n\nTrên bản đồ, ngài có thể thấy phạm vi của tất cả các $game_concept_blocs$ và tìm bất kỳ [house_heads|E] nào chưa có $game_concept_bloc$. Ngài có thể thử thuyết phục họ tham gia $game_concept_bloc$ của ngài bằng cách sử dụng [character_interaction|E] $invite_to_house_bloc_interaction|V$.\n\nTuy nhiên, họ có thể không phải lúc nào cũng chấp nhận... Thay vào đó, với tư cách là một [ruler|E] [GetGovernment('japan_feudal_government').GetName], ngài có thể mở rộng $game_concept_bloc$ của mình thông qua [war|E].\n\nNgài có hai lựa chọn khác nhau:\n$EFFECT_LIST_BULLET$[bloc_expansion|E] cho phép ngài chinh phục vùng đất nằm dưới sự kiểm soát của $game_concept_bloc$ của ngài.\n$EFFECT_LIST_BULLET$[bloc_supremacy|E] là một cuộc chiến toàn diện giữa hai $game_concept_blocs$, nơi các thành viên của $game_concept_bloc$ thất bại có thể gia nhập bên chiến thắng."

  ra_soryo_bloc_leader_cohesion: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_leader_cohesion_desc: "Việc thống nhất các [houses|E] rời rạc thành một [bloc|E] lớn đi kèm với nhiều thách thức, vì mỗi $game_concept_house$ đều đóng góp vào mức [cohesion|E] tổng thể của $game_concept_bloc$.\n\nNgoài các phần thưởng do $game_concept_cohesion$ cao mang lại, Ngài còn cần một mức $game_concept_cohesion$ nhất định chỉ để có thể thành lập một [faction|E]."

  ra_soryo_bloc_leader_cohesion_2: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_leader_cohesion_2_desc: "Để cải thiện [cohesion|E] của một [house|E] cụ thể, trước hết hãy đảm bảo rằng Ngài có cùng [house_aspiration|E], bằng cách sử dụng [character_interaction|E] $demand_aspiration_change_interaction|V$ lên [house_head|E] của họ.\n\nNgay cả như vậy, $game_concept_cohesion$ chủ yếu đến từ mối quan hệ [house_relations|E] tốt đẹp giữa tất cả các $game_concept_houses$ trong [bloc|E]. $game_concept_house_relations$ có thể được cải thiện, ví dụ như thông qua việc sắp xếp hôn nhân với các thành viên của $game_concept_house$.\n\nNếu mọi cách đều thất bại, Ngài đơn giản có thể phải sử dụng $kick_from_house_bloc_interaction|V$ $game_concept_character_interaction$."
 
  ra_soryo_bloc_end: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
  ra_soryo_bloc_end_desc: "Với tư cách là người lãnh đạo [bloc|E], hãy đảm bảo rằng nó phát triển theo thời gian bằng cách chiếm thêm lãnh thổ thông qua [war|E].\n\nKhi sở hữu một $game_concept_bloc$ hùng mạnh với [cohesion|E] cao, Ngài sẽ sẵn sàng thành lập $replace_ceremonial_regent_faction_name|V$ [faction|E] của mình!"

# You are soryo regent, but not yet shogun


  reactive_advice_soryo_regent_become_shogun_NAME: "Thành lập $empire_shogunate_japanese$"

  action_reactive_advice_soryo_regent_become_shogun: "Lời khuyên: $reactive_advice_soryo_regent_become_shogun_NAME$"
  action_reactive_advice_soryo_regent_become_shogun_desc: "Ngài là $game_concept_ceremonial_regent$. Mở mục này để tìm hiểu cách tiếp tục củng cố quyền lực và trở thành $game_concept_shogun$."
  action_reactive_advice_soryo_regent_become_shogun_click: "$click_to_open_lesson$"

  ra_become_shogun_intro: "Lời khuyên: $reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_intro_desc: "Ngài là [ceremonial_regent|E] của Nhật Bản và là [ruler|E] trên thực tế. Tuy nhiên, với tư cách là [shogun|E], Ngài sẽ có quyền lực và sự kiểm soát còn lớn hơn nữa!"

  ra_become_shogun_open_decisions: "$reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_open_decisions_desc: "Để trở thành [shogun|E], có một số yêu cầu Ngài phải đáp ứng. Hãy cùng xem ngay bây giờ."
  ra_become_shogun_open_decisions_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"

  ra_become_shogun_decision: "$reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_decision_desc: "'$tgp_japan_become_shogun_decision_TUTORIAL|V$' là [decision|E] cần thực thi để trở thành [shogun|E].\n\nTuy nhiên, để làm được điều đó, có ba trở ngại lớn cần vượt qua:\n$EFFECT_LIST_BULLET$Ban hành [law|E] [GetLaw('japanese_bureaucracy_2').GetName]\n$EFFECT_LIST_BULLET$[prestige_level|E] của ngài là [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L] hoặc cao hơn\n$EFFECT_LIST_BULLET$[legitimacy_level|E] của ngài lớn hơn hoặc bằng #V 4#!"

  ra_become_shogun_open_laws: "$reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_open_laws_desc: "Trước tiên, hãy xem xét tình trạng [laws|E] của Ngài."
  ra_become_shogun_open_laws_prompt: "Mở thẻ '$MY_REALM_WINDOW_BODY_TITLE_LAWS|V$' trong bảng '#V Lãnh thổ#!' (được đánh dấu)"

  ra_become_shogun_laws: "$reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_laws_desc: "Tại đây, Ngài có thể dần dần ban hành một bộ máy hành chính nghiêm ngặt hơn. Để trở thành [shogun|E], Ngài cần tối thiểu [law|E] [GetLaw('japanese_bureaucracy_2').GetName].\n\nHãy lưu ý rằng việc này tiêu tốn [prestige|E] và làm giảm [opinion|E] của các [vassals|E] đối với Ngài."

  ra_become_shogun_open_subjects: "$reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_open_subjects_desc: "Tiếp theo, chúng ta nên xem qua các [vassals|E] thuộc [GetGovernment('japan_administrative_government').GetNameWithIcon] của Ngài"
  ra_become_shogun_open_subjects_prompt: "Mở thẻ '$MY_REALM_WINDOW_BODY_TITLE_SUBJECTS|V$' trong bảng '#V Lãnh thổ#!' (được đánh dấu)"

  ra_become_shogun_subjects: "$reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_subjects_desc: "Ngài không thể trở thành [shogun|E] nếu chưa loại bỏ những tàn dư lỗi thời của [government|E] [GetGovernment('japan_administrative_government').GetNameWithIcon].\n\nNếu bất kỳ [vassals|E] nào của Ngài thuộc $japan_administrative_government$, Ngài có thể tìm họ tại đây và tước [titles|E] của họ bằng [character_interaction|E] $revoke_title_interaction|V$."

  ra_become_shogun_end: "$reactive_advice_soryo_regent_become_shogun_NAME$"
  ra_become_shogun_end_desc: "Quyền lực đã nằm trong tay ngài, ngài chỉ cần nắm chặt lấy chúng để trở thành [shogun|E].\n\nBan hành [GetLaw('japanese_bureaucracy_2').GetName] và đất nước này sẽ thuộc về ngài!"
