l_english:


  lesson_china_introduction: "$lesson_basics_welcome$"
  lesson_china_introduction_desc: "@tutorial_screenshot_1_china!\nNgài là một học giả trẻ tại Trung Hoa; xuất thân khiêm tốn, nhưng tràn đầy triển vọng. Thông qua học vấn, mưu lược và công trạng đáng kể, Ngài có thể từng bước thăng tiến trong hàng ngũ quan lại triều đình.\n\nDù đời người ngắn ngủi, nhưng con cháu Ngài có thể mang danh tiếng của gia tộc vươn tới vinh quang trường tồn.\n\nDưới sự cai trị ổn định của triều Tống, các kỳ khoa cử hoàng gia mở ra con đường tiến thân đến chức tri phủ — và có lẽ, thậm chí là ngai vàng hoàng đế."

  lesson_china_camera: "$lesson_basics_quick_camera$"
  lesson_china_camera_desc: "$lesson_basics_quick_camera_desc$"

  lesson_china_zoom: "$lesson_basics_quick_zoom$"
  lesson_china_zoom_desc: "$lesson_basics_quick_zoom_desc$"

  lesson_china_nested_tooltips: "Chú thích lồng nhau"
  lesson_china_nested_tooltips_desc: "$lesson_basics_tooltips_in_tooltips_desc$"
  lesson_china_nested_tooltips_hover_word: "$lesson_basics_tooltips_in_tooltips_hover_word$"
  lesson_china_nested_tooltips_hover_word_deeper: "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$"

  lesson_china_nested_tooltips_complete: "$lesson_china_nested_tooltips$"
  lesson_china_nested_tooltips_complete_desc: "$lesson_china_nested_tooltips_desc$"


  lesson_china_characters: "Nhân vật"
  lesson_china_characters_desc: "Ngài sẽ vào vai [GetPlayer.GetShortUINameNotMeNoTooltip], một trong vô số [characters|E] trong thế giới này, được thể hiện qua các chân dung Nhân vật.\n\nNgài là một viên quan đang trên con đường lập thân tại [GetTitleByKey('h_china').GetDefinitiveName]!"

  lesson_china_this_is_you_1: "$lesson_basics_quick_this_is_you_1$"
  lesson_china_this_is_you_1_desc: "Đây là nơi hiển thị bản thân Ngài và những thành viên [family|e] thân cận nhất.\n\nBên phải là [player_heir|e] của Ngài — người mà Ngài sẽ điều khiển khi [character|E] hiện tại qua đời.\n\n#TUT Nếu Ngài bị lạc trên bản đồ, hãy nhấp vào nhân vật của mình để đưa camera trở lại [realm|e] của Ngài.#!"

  lesson_china_this_is_you_2: "$lesson_basics_quick_this_is_you_2$"
  lesson_china_this_is_you_2_desc: "Việc có một [spouse|E] thường là lựa chọn sáng suốt. Họ sẽ hỗ trợ Ngài trong việc cai quản [realm|e] và giúp bảo đảm tương lai cho [dynasty|e] của Ngài.\n\nHiện tại, Ngài vẫn chưa thành thân. Sao chúng ta không giải quyết chuyện này nhỉ?"
  lesson_china_find_spouse_tt: "$lesson_basics_quick_find_spouse_tt$"

  lesson_china_marriage_window: "$lesson_basics_quick_this_is_you_2$"
  lesson_china_marriage_window_desc: "Việc tìm được [spouse|E] phù hợp không hề dễ dàng, nhưng hãy lưu ý một vài điểm sau:\n\n$EFFECT_LIST_BULLET$Năng lực: [skills|E] của họ sẽ được cộng vào của Ngài\n$EFFECT_LIST_BULLET$Di truyền: Các [congenital_traits|E], như [GetTrait('lisping').GetName( GetNullCharacter )], có thể được truyền lại cho [children|E]\n$EFFECT_LIST_BULLET$Thân phận: Kết hôn với một [lowborn|E] sẽ khiến Ngài mất [prestige|E]"

  lesson_china_married_great_job: "$lesson_basics_quick_married_great_job$"
  lesson_china_married_great_job_desc: "Chúc mừng Ngài đã thành thân!\n\nNếu sau khi nhân vật của Ngài qua đời mà không còn thành viên nào khác trong [dynasty|e], Ngài sẽ thua cuộc. Việc có một $game_concept_spouse$ sẽ giúp Ngài tránh điều này."

  lesson_china_this_is_you_3: "$lesson_basics_quick_this_is_you_3$"
  lesson_china_this_is_you_3_desc: "Đây là các [traits|e] của nhân vật! Như Ngài thấy, ông ta là @ambitious_icon_tutorial![Nbsp][GetTrait('ambitious').GetName( GetNullCharacter )], @compassionate_icon_tutorial![Nbsp][GetTrait('compassionate').GetName( GetNullCharacter )], và @gregarious_icon_tutorial![Nbsp][GetTrait('gregarious').GetName( GetNullCharacter )].\n\n#TUT $game_concept_traits$ ảnh hưởng đến cách nhân vật phản ứng trước các sự kiện trong thế giới trò chơi. Ngài cũng có thể nhận thêm đặc điểm mới trong quá trình chơi.#!"

  lesson_china_skills: "$lesson_basics_quick_skills$"
  lesson_china_skills_desc: "$lesson_basics_quick_skills_desc$"

  lesson_china_house: "$game_concept_house$"
  lesson_china_house_desc: "Đây là [house|E] của ngài, #V House [GetPlayer.GetHouse.GetNameNoTooltip]#!; một gia đình [nobles|E] Trung Hoa.\n\nVới tư cách là [house_head_head|E] của $game_concept_house$ của ngài, ngài được kỳ vọng sẽ dẫn dắt các thành viên của $game_concept_house$ đến thành công trong chính quyền Trung Hoa.\n\n$game_concept_house$ của ngài tuy nhỏ, nhưng sẽ phát triển theo thời gian khi [children|E] được sinh ra trong đó.\n\n#TUT Mỗi [house|E] đều thuộc về một [dynasty|E]. Tuy nhiên, House [GetPlayer.GetHouse.GetNameNoTooltip] quá nhỏ bé đến mức $game_concept_house$ và $game_concept_dynasty$ chỉ là một.#!"

  lesson_china_realm: "$game_concept_realm$"
  lesson_china_realm_desc: "Khu vực này hiển thị [realm|E] của Ngài — nói đơn giản là vùng đất và tài nguyên Ngài kiểm soát.\n\nHiện tại, Ngài chỉ là một sĩ phu khiêm tốn, chưa sở hữu [land|e], nên $game_concept_realm$ của Ngài rất hạn chế. Để có đất đai, Ngài cần phấn đấu trở thành một [governor|e]. Chúng ta sẽ nói rõ hơn sau."

  lesson_china_titles: "$game_concept_titles$"
  lesson_china_titles_desc: "Ngài hiện chỉ sở hữu một [title|E]. $game_concept_titles$ đại diện cho quyền sở hữu đất đai.\n\n$game_concept_title$ duy nhất của Ngài, [GetPlayer.GetPrimaryTitle.GetName], trao cho Ngài quyền sở hữu [estate|E] tư nhân của gia tộc. Chúng ta sẽ quay lại $game_concept_estate$ này sớm thôi.\n\n#TUT Khi Ngài cai quản một [province|E] với tư cách [governor|E], nó cũng sẽ xuất hiện như một $game_concept_title$ tại đây.#!"

  lesson_china_relationships: "$lesson_basics_quick_relationships$"
  lesson_china_relationships_desc: "Mục này hiển thị những [characters|e] mà Ngài có mối liên hệ, bao gồm [family|e], những người có [relationship|e] với Ngài, các [courtiers|e] và [subjects|E] của Ngài."

  lesson_china_liege_introduction: "$game_concept_liege$"
  lesson_china_liege_introduction_desc: "[liege|e] của Ngài là [son_of_heaven|e], Hoàng đế Trung Hoa. Một trong những cách tương tác với ngài là Nhấp Chuột Phải.\n\nThao tác này sẽ mở Menu Tương tác, cho phép Ngài thực hiện các hành động như #high Tìm Trưởng Bối#! hoặc #high Xin Chỉ Dẫn#!."
  lesson_china_find_elder_tt: "Nhấp Chuột Phải vào $game_concept_liege$"

  lesson_china_liege_introduction_good_job: "Những Nhân vật khác"
  lesson_china_liege_introduction_good_job_desc: "Làm tốt lắm! Ngài có thể tương tác với hầu hết [characters|e] bằng cách Nhấp Chuột Phải.\n\nCó lẽ Ngài muốn [GetScheme('seduce').GetTypeName] [spouse|e] của mình? Hay #high Giáo dục#! những người em nhỏ?"

  lesson_china_resources_1: "$lesson_basics_quick_resources_1$"
  lesson_china_resources_1_desc: "Tiếp theo, hãy nhìn vào thanh ở góc trên bên phải màn hình.\n\nTại đây, Ngài sẽ thấy nhiều loại tài nguyên dùng để tương tác với thế giới."

  lesson_china_resources_gold: "$lesson_basics_quick_resources_gold$"
  lesson_china_resources_gold_desc: "$lesson_basics_quick_resources_gold_desc$"

  lesson_china_resources_prestige: "$lesson_basics_quick_resources_prestige$"
  lesson_china_resources_prestige_desc: "$lesson_basics_quick_resources_prestige_desc$"

  lesson_china_resources_piety: "$lesson_basics_quick_resources_piety$"
  lesson_china_resources_piety_desc: "[piety_i|e] [piety|e] phản ánh mức độ đức hạnh của nhân vật.\n\n[piety_level|e] của Ngài cũng tăng theo lượng $game_concept_piety$ tích lũy. Việc tập trung vào [learning_i|e][learning|e] sẽ đặc biệt hữu ích cho những nhân vật mộ đạo."

  lesson_china_resources_influence: "@influence_icon! $game_concept_influence$"
  lesson_china_resources_influence_desc: "[influence_i] [influence|e] thể hiện khả năng khiến người khác lắng nghe Ngài. Khi Ngài tích lũy $game_concept_influence$, [influence_level|e] của Ngài cũng sẽ tăng.\n\n$game_concept_influence$ chủ yếu được dùng để đề cử ứng viên mà Ngài ủng hộ trở thành [governor|E] của một [province|E]."
 
  lesson_china_resources_renown: "$lesson_basics_quick_resources_renown$"
  lesson_china_resources_renown_desc: "$lesson_basics_quick_resources_renown_desc$"
 
  lesson_china_estate_heading: "Điền trang Gia tộc"
 
  lesson_china_open_estate: "$lesson_china_estate_heading$"
  lesson_china_open_estate_desc: "Với tư cách là [house_head_head|E] của [house|E], Ngài sở hữu một [estate|E].\n\nĐây là căn cứ quyền lực riêng của Ngài, và mọi khoản đầu tư vào đây sẽ theo Ngài suốt cả ván chơi.\n\nĐiền trang tọa lạc tại [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], và sẽ vẫn ở đó ngay cả khi Ngài trở thành [governor|E] ở nơi khác."
  lesson_china_open_estate_prompt: "Mở Điền trang (được đánh dấu)"

  lesson_china_estate_intro: "$lesson_china_estate_heading$"
  lesson_china_estate_intro_desc: "Lợi ích Ngài nhận được từ [estate|E] đến từ các [estate_buildings|E], vì vậy hãy xây một công trình ngay bây giờ!"
  lesson_china_estate_intro_prompt: "Chọn ô xây dựng trống (được đánh dấu)"

  lesson_china_estate_build_list: "$lesson_china_estate_heading$"
  lesson_china_estate_build_list_desc: "Một [estate_building|E] giúp tăng thu nhập [gold|E], như $rice_field_01_domicile_building|V$, là lựa chọn khởi đầu hợp lý.\n\nTuy nhiên, Ngài có thể tự do chọn bất kỳ công trình nào mình thích."
  lesson_china_estate_build_list_prompt: "Xây dựng bất kỳ $game_concept_estate_building$ nào"

  lesson_china_estate_manor: "$lesson_china_estate_heading$"
  lesson_china_estate_manor_desc: "Công trình đã bắt đầu xây dựng, rất tốt!\n\nCó lẽ Ngài đã nhận ra số ô xây dựng [estate_buildings|E] là có giới hạn. Để mở thêm chỗ, Ngài sẽ cần nâng cấp công trình trung tâm #V Dinh thự#!."
  lesson_china_estate_manor_prompt: "Chọn Dinh thự (được đánh dấu)"

  lesson_china_estate_manor_selected: "$lesson_china_estate_heading$"
  lesson_china_estate_manor_selected_desc: "Mọi [estate_buildings|E] đều có thể nâng cấp, và Dinh thự của Ngài cũng không ngoại lệ.\n\nQuan trọng hơn, nâng cấp Dinh thự sẽ mở thêm ô cho các $game_concept_estate_buildings$.\n\nTuy nhiên, việc này khá tốn kém, nên tạm thời chúng ta chưa cần làm."
 
  lesson_china_estate_close: "$lesson_china_estate_heading$"
  lesson_china_estate_close_desc: "Tạm thời rời khỏi Điền trang.\n\nTrước tiên hãy đóng Dinh thự, sau đó đóng cửa sổ Điền trang."
  lesson_china_estate_close_prompt: "Đóng Cửa sổ Điền trang"
 
  lesson_china_estate_summary: "$lesson_china_estate_heading$"
  lesson_china_estate_summary_desc: "Như đã đề cập, [estate|E] là tài sản tư nhân của riêng Ngài.\n\nNó sẽ theo Ngài ngay cả khi Ngài chuyển sang điều khiển [player_heir|E].\n\nDù sau này Ngài có thể trở thành [governor|E] của một [province|E] giàu có, thì các khoản đầu tư tại đó vẫn thuộc về nhà nước.\n\nVì vậy, dùng [gold|E] để cải thiện [estate|E] của mình là một lựa chọn rất khôn ngoan!"

  lesson_china_admin_intro: "Quan lộ Triều đình"
  lesson_china_admin_intro_desc: "Dù rất dễ chịu, nhưng Ngài không thể sống cả đời trong [estate|E] của mình.\n\nVới tư cách một quan viên, Ngài phải chứng minh [merit|E] và từng bước thăng tiến, trở thành [governor|E] — thậm chí là [minister|E]."

  lesson_china_admin_merit: "$lesson_china_admin_intro$"
  lesson_china_admin_merit_desc: "Đây là [merit_level|E] hiện tại của Ngài.\n\n$game_concept_merit_level$ phản ánh năng lực và địa vị của Ngài trong bộ máy quan liêu triều đình. Cấp thấp nhất là #V Cửu phẩm#!, còn cao nhất là #V Nhất phẩm#!.\n\nỞ thời điểm này, Ngài chưa lập được công trạng nào, nên chưa có $game_concept_merit_level$ và chưa đủ điều kiện để trở thành [governor|E]."

  lesson_china_admin_open: "$lesson_china_admin_intro$"
  lesson_china_admin_open_desc: "Hãy gia tăng [merit_level|E] của chúng ta!"
  lesson_china_admin_open_prompt: "Mở bảng '$ADMINISTRATIVE_GOVERNMENT_HEADER$' (được đánh dấu)"

  lesson_china_exam: "$lesson_china_admin_intro$"
  lesson_china_exam_desc: "Đế quốc vận hành theo chế độ trọng dụng nhân tài, và [imperial_examinations|E] bảo đảm rằng chỉ những người có năng lực và đức hạnh cao nhất mới được quản lý các [provinces|E] với tư cách [governors|E].\n\nNgài có thể tăng [merit_level|E] bằng cách tham gia các [activities|E] như $activity_local_examination|V$ và $activity_imperial_examination|V$.\n\n$game_concept_examinations$ được tổ chức bởi cả các [governors|E] lẫn chính [son_of_heaven|E].\n\nNgài sẽ nhận được lời mời khi kỳ thi được tổ chức."

  lesson_china_STUDY_SCHEME_SEGMENT: "Học tập"

  TUTORIAL_OPEN_DECISION_PANEL_PROMPT: "Mở bảng '$DECISIONS_VIEW_TITLE$'"

  lesson_china_decisions_open: "$lesson_china_STUDY_SCHEME_SEGMENT$"
  lesson_china_decisions_open_desc: "Khi Ngài quyết định tham gia một [imperial_examinations|E], việc chuẩn bị kỹ lưỡng sẽ rất có lợi.\n\nNgài có thể chuẩn bị cho $game_concept_examinations$ bằng cách học tập Kinh điển Nho gia."
  lesson_china_decisions_open_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"

  lesson_china_decisions: "$lesson_china_STUDY_SCHEME_SEGMENT$"
  lesson_china_decisions_desc: "Đây là các Quyết định — những hành động cá nhân khác nhau mà Ngài có thể thực hiện.\n\nTrước mắt, hãy chọn Quyết định $tgp_china_study_confucian_classics_decision|V$."
  lesson_china_decisions_prompt: "Bắt đầu Quyết định '$tgp_china_study_confucian_classics_decision$'"

  lesson_china_stress: "$lesson_china_STUDY_SCHEME_SEGMENT$"
  lesson_china_stress_desc: "Tốt lắm, Ngài đã bắt đầu việc học!\n\nViệc học sẽ làm tăng [stress_i][stress|E] của Ngài. Ngoài ra, $game_concept_stress$ thường tăng hoặc giảm tùy theo việc Ngài hành động có phù hợp với [personality_traits|E] hay không.\n\nNếu Ngài tích lũy [GetDefine('NCharacter', 'STRESS_PER_LEVEL')|0V] $game_concept_stress$, [stress_level|E] của Ngài sẽ tăng và sức khỏe tinh thần sẽ bị ảnh hưởng.\n\n#I Hãy chú ý chỉ báo $game_concept_stress$ được đánh dấu để tránh suy sụp tinh thần#!"

  lesson_china_schemes_open: "$lesson_china_STUDY_SCHEME_SEGMENT$"
  lesson_china_schemes_open_desc: "Việc học là một [scheme|E] — một kế hoạch cá nhân dài hạn. Hãy cùng xem nhanh tình trạng $game_concept_scheme$ của Ngài."
  lesson_china_schemes_open_prompt: "Mở bảng 'Intrigue'"

  lesson_china_schemes_list: "$lesson_china_STUDY_SCHEME_SEGMENT$"
  lesson_china_schemes_list_desc: "Đây là [scheme|E] $study_confucian_classics$ của Ngài.\n\nĐây là một $game_concept_scheme$ lặp lại. Khi hoàn thành, nó sẽ được giải quyết dựa trên [scheme_success_chance|E], sau đó bắt đầu lại từ đầu.\n\nVì $game_concept_scheme$ này làm tăng [stress|E], cuối cùng Ngài sẽ phải từ bỏ nó.\n\n#I Để từ bỏ một $game_concept_scheme$, hãy sử dụng nút ở góc trên bên phải của $game_concept_scheme$."
 
  lesson_china_unpause: "$lesson_basics_quick_resources_time$"
  lesson_china_unpause_desc: "Hiện tại, trò chơi đang tạm dừng. Ngài có thể điều chỉnh tốc độ thời gian trôi qua ở góc dưới bên phải màn hình.\n\n#TUT Crusader Kings III là một trò chơi diễn ra trong hàng trăm năm, vì vậy hãy thoải mái chơi chậm rãi.#!\n\nKhi trò chơi còn tạm dừng, sẽ không có ai tổ chức [imperial_examination|E] để Ngài tham gia, và [scheme|E] $study_confucian_classics$ của Ngài cũng sẽ không tiến triển, vì vậy hãy bỏ tạm dừng và chờ lời mời!"
  lesson_china_unpause_tt: "$lesson_basics_quick_unpause_tt$"
 
  lesson_china_done: "$lesson_basics_quick_done$"
