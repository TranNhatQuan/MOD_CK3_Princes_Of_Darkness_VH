l_english:
  reactive_advice_struggle:0 "Cuộc Đấu Tranh"
  action_reactive_advice_struggle:0 "Lời khuyên: Cuộc Đấu Tranh"
  action_reactive_advice_struggle_desc:1 "Ngài có thể tham gia vào một Cuộc Đấu Tranh. Mở mục này để tìm hiểu điều đó có ý nghĩa gì đối với Ngài."
  action_reactive_advice_struggle_click:0 "$click_to_open_lesson$"
 
  lessons_struggle_introduction:0 "Cuộc Đấu Tranh"
  lessons_struggle_introduction_desc:0 "Ngài hiện đang là một phần của một [struggle|E]!\n\n[struggle_struggles|E] là những xung đột kéo dài trong một [region|E], nơi hành động của tất cả những người tham gia sẽ làm thay đổi trạng thái của khu vực, từ đó hình thành các [struggle_phase_phases|E] khác nhau. Những thay đổi về trạng thái của khu vực sẽ mang lại các hiệu ứng đối với [war|E], [faith|E] và [culture|E].\n\nCuối cùng, tất cả những người tham gia đều cạnh tranh để trở thành người quyết định cách mà [struggle|E] kết thúc, ảnh hưởng đến toàn bộ những người tham gia trong khu vực."
  reactive_advice_struggle_introduction: "$lessons_struggle_introduction$"

  lessons_struggle_region_open:0 "Khu Vực Đấu Tranh"
  lessons_struggle_region_open_desc:1 "Khu vực [struggle_region|E] được đánh dấu bằng một đường viền mới, sẽ được làm nổi bật khi Ngài di chuột lên nút Cuộc Đấu Tranh. Chỉ những nhân vật sở hữu đất đai trong khu vực này mới tham gia vào [struggle|E].\n\n#TUT [characters|E] bên ngoài khu vực có thể tham gia một [struggle|E] bằng cách chiếm hữu đất đai trong [struggle_region|E] và chuyển [capital|E] của họ vào khu vực đó.#!"

  lessons_struggle_view_open:0 "Truy Cập Giao Diện Cuộc Đấu Tranh"
  lessons_struggle_view_open_desc:0 "Tại đây Ngài có thể mở giao diện [struggle|E], nơi Ngài có thể kiểm tra toàn bộ thông tin liên quan đến [struggle|E]."
  lessons_struggle_view_open_prompt:0 "Mở giao diện [struggle|E]"

  lessons_struggle_view:0 "Giao Diện Cuộc Đấu Tranh"
  lessons_struggle_view_desc:1 "Trong Giao Diện Cuộc Đấu Tranh, Ngài có thể tìm hiểu thêm về [struggle_phase|E] hiện tại và các hiệu ứng của nó. Ngài cũng có thể xem các giai đoạn tiếp theo tiềm năng và những [struggle_catalyst_catalysts|E] cần hoàn thành để thúc đẩy [struggle|E] tiến tới các giai đoạn đó."


  lessons_struggle_current_phases_and_effects:0 "Giai Đoạn Hiện Tại & Hiệu Ứng"
  lessons_struggle_current_phases_and_effects_desc:0 "[struggle_phase|E] hiện tại tác động đến toàn bộ [struggle_region|E], áp dụng các hiệu ứng đặc biệt cho những người tham gia [struggle_involved|E], [struggle_interloper|E] và [struggle_uninvolved|E].\n\nTrong mục này, Ngài có thể kiểm tra các hiệu ứng của giai đoạn lên [war|E], [faith|E], [culture|E] và các hiệu ứng khác."

  lessons_next_struggle_phases:0 "Các Giai Đoạn Đấu Tranh Tiếp Theo"
 # TODO_CD: The key should not use POINT_BASED_PHASE_DEFAULT_DURATION because it's valid only for point-based phases
  lessons_next_struggle_phases_desc:3 "[struggle_phase|E] hiện tại sẽ kết thúc khi một trong các giai đoạn tiếp theo tiềm năng đạt được [GetDefine('NStruggle', 'POINT_BASED_PHASE_DEFAULT_DURATION')] tiến trình. Để tăng tiến trình cho bất kỳ giai đoạn tiếp theo nào, Ngài phải hoàn thành các [struggle_catalyst_catalysts|E] được liệt kê bên dưới chúng.\n\n#TUT Kiểm tra bất kỳ giai đoạn tiếp theo tiềm năng nào để tìm hiểu thêm về chúng, các hiệu ứng của chúng, và tiến trình [struggle_catalyst|E] gần đây. Việc chọn chúng sẽ mở danh sách [struggle_catalyst|E], danh sách này có thể được hoàn thành không giới hạn số lần bởi Ngài hoặc các người tham gia [struggle_involved|E] khác trong [struggle|E].#!"

  lessons_ending_struggle_open:0 "Kết Thúc Cuộc Đấu Tranh"
  lessons_ending_struggle_open_desc:1 "[struggle|E] sẽ tiếp tục thay đổi các giai đoạn cho đến khi một người tham gia kích hoạt một trong các Quyết Định Kết Thúc và chấm dứt [struggle|E]. Ngài luôn có thể kiểm tra các Quyết Định Kết Thúc để xem yêu cầu và hiệu ứng của chúng."
  lessons_ending_struggle_open_prompt:0 "Mở các Quyết Định Kết Thúc"

  lessons_ending_struggle:0 "Kết Thúc Cuộc Đấu Tranh"
  lessons_ending_struggle_desc:1 "Tại đây Ngài có thể xem tất cả các Quyết Định Kết Thúc dành cho [struggle|E].\n\nHãy lưu ý rằng mỗi Quyết Định Kết Thúc đều yêu cầu Ngài phải đang ở trong một giai đoạn cụ thể thì mới có thể kích hoạt. Ngài sẽ được thông báo nếu có quyết định nào khả dụng."


  lessons_explore_struggle_open:0 "Khám Phá Cuộc Đấu Tranh"
  lessons_explore_struggle_open_desc:0 "Giờ đây Ngài đã nắm được tất cả những kiến thức cơ bản và sẵn sàng cho [struggle|E] đầu tiên của mình.\n\nViệc kiểm tra các hiệu ứng của giai đoạn hiện tại và các giai đoạn tiếp theo tiềm năng mà Ngài muốn hướng tới là một điểm khởi đầu tốt."
 
  lessons_struggle_involvement_view_open:0 "Mức Độ Tham Gia Cuộc Đấu Tranh"
  lessons_struggle_involvement_view_open_desc:0 "Trong một [struggle|E], tất cả các [characters|E] trong khu vực đều có thể kích hoạt [struggle_catalyst_catalysts|E]. Do đó, việc biết ai là những người tham gia [struggle_involved] và [struggle_interloper] là vô cùng quan trọng. Giao diện Mức Độ Tham Gia Cuộc Đấu Tranh cung cấp thông tin về điều này."
  lessons_struggle_involvement_view_open_prompt:1 "Mở Giao Diện Mức Độ Tham Gia Cuộc Đấu Tranh"
 
  lessons_struggle_involvement_view:0 "Mức Độ Tham Gia Cuộc Đấu Tranh"
  lessons_struggle_involvement_view_desc:0 "Tại đây Ngài có thể xem thông tin mức độ tham gia của bản thân, cùng với bản phân tích về lý do khiến Ngài được xếp vào [struggle_involved|E], [struggle_interloper|E] hoặc [struggle_uninvolved|E].\n\nBên cạnh mức độ tham gia cá nhân, Ngài còn có thể xem danh sách những người tham gia [struggle|E] và mức độ tham gia của họ. Các [struggle_involved_cultures|E] và [struggle_involved_faiths|E] cũng có thể được tìm thấy tại đây.\n\n#TUT Việc nắm rõ mức độ tham gia của những người chơi khác là rất quan trọng khi lập kế hoạch theo đuổi các Chất Xúc Tác, bởi vì các Chất Xúc Tác có thể yêu cầu Ngài nhắm tới một người tham gia [struggle|E], một [faith|E] hoặc một [culture|E] khác.#!"

