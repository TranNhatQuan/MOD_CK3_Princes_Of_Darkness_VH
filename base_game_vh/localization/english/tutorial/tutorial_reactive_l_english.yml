  ra_landless_adventurer_1: "Kẻ phiêu lưu vô lãnh thổ"
  ra_landless_adventurer_2: "Doanh trại của ngài"
  ra_landless_adventurer_3: "Thuộc hạ của ngài"
  ra_landless_adventurer_4: "Khế ước"
  ra_landless_adventurer_5: "Mục đích doanh trại"
  ra_landless_adventurer_6: "Con đường đến quyền lực"
  ra_landless_adventurer_1_desc: "@ra_landless_adventurer_2! \nNgài là một [adventurer|e]! Hãy du hành khắp nơi, ghé thăm [courts|e] của các [rulers|e] để tìm việc, và hoàn thành [task_contracts|e] để nhận phần thưởng.\n\nNgài có thể nâng cấp [camp|e], chiêu mộ [followers|e], và xây dựng mạng lưới [contact_list|e] rộng lớn."
  ra_landless_adventurer_2_desc: "Với tư cách là một [adventurer|e], ngài không bị ràng buộc vào bất kỳ mảnh đất nào, thay vào đó ngài có quyền tự do du hành khắp thế giới. Căn cứ hoạt động của ngài với tư cách là một $game_concept_adventurer$ là [camp|e] của ngài, thứ mà ngài có thể nâng cấp và mở rộng bằng các [camp_buildings|e] trong suốt sự nghiệp phiêu lưu của mình. "
  ra_landless_adventurer_3_desc: "Trong các chuyến du hành của mình, ngài có thể tập hợp các [followers|e], những người phục vụ mục đích tương tự như các [courtiers|e] của các [rulers|e] có đất đai. Khi [traveling|e] với tư cách là một [adventurer|e], ngài sẽ có cơ hội tận dụng [travel_option|e] [GetTravelOption('adventurers_scout_for_talent_option').GetName].\n\nNgoài ra, ngài cũng có thể thu thập các $game_concept_followers$ mới bằng cách thực hiện [decision|e] Tham quan Lãnh địa. Trong $game_concept_camp$ của mình, ngài có thể xem các $game_concept_followers$ của mình thông qua nút ở góc trên cùng bên trái của bảng."
  ra_landless_adventurer_4_desc: "Với tư cách là một [adventurer|e], nguồn thu nhập chính của ngài sẽ là các [task_contracts|e]. Ngài có thể thấy chúng được thể hiện dưới dạng những cuộn giấy trên bản đồ. Các $game_concept_task_contracts$ có thể được tìm thấy trên khắp thế giới, và yêu cầu ngài hoàn thành một nhiệm vụ cụ thể cho một nhà tuyển dụng.\n\n[prestige_level|E] của ngài quyết định [task_contract_tier|e] của các $game_concept_task_contracts$ mà ngài nhận được. Đạt được Cấp độ Danh tiếng [GetPrestigeLevelName('(int32)2')] trở lên sẽ mở khóa việc mua hoặc chinh phục [land|E], nếu ngài muốn chuyển sang làm một [ruler|E] [landed|E]. Các cấp độ cao hơn sẽ mở khóa các tùy chọn mạnh mẽ hơn.\n\nNgài có thể truy cập các $game_concept_task_contracts$ mới bằng cách di chuyển [camp|e] của mình, một hành động sẽ tiêu tốn một lượng [provisions|e] dựa trên khoảng cách di chuyển."
  ra_landless_adventurer_5_desc: "Ngài có thể xem chi tiết về [camp|e] trong tab $game_concept_realm$ (được làm nổi bật). Từ đó, ngài có thể thay đổi [camp_purpose|e] của mình và mở tổng quan $game_concept_camp$.\n\nMục đích của $game_concept_camp$ của ngài sẽ xác định loại [task_contracts|e] mà ngài có thể tìm thấy, có thể mở khóa một số [decisions|e] và [camp_buildings|e] nhất định, cũng như nhiều lợi ích khác."
  ra_landless_adventurer_6_desc: "@ra_landless_adventurer!\nHãy nhận [task_contracts|e], di chuyển [camp|e] và mở rộng lực lượng của ngài.\n\nNgài có thể tự do định đoạt tương lai của [dynasty|e]: tiếp tục phiêu bạt, giành lấy [title|e], hay can thiệp vào việc của các [rulers|e]?"

  reactive_advice_admin_gov: "Chính thể quan liêu"

