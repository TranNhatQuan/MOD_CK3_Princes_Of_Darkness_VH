  action_reactive_advice_landless_adventurer: "Chỉ dẫn: Kẻ phiêu lưu vô lãnh thổ"
  action_reactive_advice_landless_adventurer_desc: "Ngài đang đóng vai một [adventurer|e]. Mở để tìm hiểu thêm."
  action_reactive_advice_landless_adventurer_click: "$click_to_open_lesson$"
