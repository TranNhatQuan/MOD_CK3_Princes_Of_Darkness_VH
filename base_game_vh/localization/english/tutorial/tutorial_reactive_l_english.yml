l_english:
  open_tutorial_lesson:1 "Lời khuyên: "
  click_to_open_lesson:1 "#I Nhấn để tìm hiểu thêm#!"
  reactive_advice_mercenaries:0 "$reactive_advice_mercenaries_step_1$"
  action_reactive_advice_mercenaries:0 "$open_tutorial_lesson$$reactive_advice_mercenaries_step_1$"
  action_reactive_advice_mercenaries_desc:0 "Lính đánh thuê là những binh sĩ được thuê mướn, có thể xoay chuyển cục diện của một cuộc chiến.\nMở mục này để nhận một số gợi ý & mẹo về cách sử dụng họ hiệu quả nhất!"
  action_reactive_advice_mercenaries_click:0 "$click_to_open_lesson$"
  reactive_advice_mercenaries_step_1:0 "Lính đánh thuê"
  reactive_advice_mercenaries_desc:0 "Nếu Ngài đang thua trong một cuộc [war|E], Ngài có thể xoay chuyển tình thế bằng cách thuê [mercenaries|E].\n\nLính đánh thuê tốn [gold|E], nhưng sẽ cung cấp cho Ngài một [army|E] đáng kể. Khi đã được thuê, Ngài có thể điều khiển họ giống như bất kỳ đội quân nào khác.\n\n#TUT Ngài có thể muốn thuê một đơn vị Lính đánh thuê cho cuộc chiến hiện tại. Dù Ngài có thể rơi vào [debt|E] khi thuê họ, chúng Ta khuyên Ngài nên chọn một đội có chi phí phù hợp, trừ khi Ngài đang thua trận nặng nề.#!"
  reactive_advice_mercenaries_task:0 "Đi tới giao diện $HIRE_TROOPS$ và chọn bất kỳ đội Lính đánh thuê nào"
  reactive_advice_succession:0 "$reactive_advice_succession_step_1$"
  action_reactive_advice_succession:0 "$open_tutorial_lesson$$reactive_advice_succession_step_1$"
  action_reactive_advice_succession_desc:0 "Chuyện gì vừa xảy ra vậy? Ngài đã chết, và diễn ra một Cuộc kế vị!\nMở mục này để xem tổng quan những gì đã xảy ra, cùng một số gợi ý để chuẩn bị cho các lần kế vị sau."
  action_reactive_advice_succession_click:0 "$click_to_open_lesson$"
  reactive_advice_succession_step_1:0 "Kế vị"
  reactive_advice_succession_desc:3 "Nhà vua đã băng hà, vạn tuế tân vương!\n\nĐừng lo lắng — dù nhân vật cũ của Ngài đã chết, Crusader Kings III là trò chơi về các triều đại. Vì [ruler|E] của Ngài có một [player_heir|E], giờ Ngài sẽ điều khiển người đó!\n\n#TUT Cái chết là một phần tự nhiên của trò chơi, và Ngài thường sẽ tiếp tục với [eligible_child|E] lớn tuổi nhất (tùy theo [succession_laws|E] của lãnh địa). Để lên kế hoạch cho một cuộc kế vị an toàn, chúng Ta khuyên Ngài nên có ít nhất hai người con — người thứ hai đóng vai trò dự phòng trong trường hợp người đầu tiên qua đời.\n\nKhi kế vị, Ngài có thể mất một số [titles|E] mà nhân vật trước nắm giữ. Đừng lo, Ngài vẫn giữ [claims|E] đối với tất cả các danh hiệu đã mất.#!\n\n#weak Chúng Ta khuyên Ngài nên dành chút thời gian để làm quen với nhân vật mới trước khi tiếp tục.#!"
  reactive_advice_domain_limit:0 "$reactive_advice_domain_limit_step_1$"
  reactive_advice_domain_limit_step_1:0 "Giới hạn Lãnh địa"
  reactive_advice_domain_limit_desc:0 "Hiện tại Ngài đang nắm giữ nhiều đất trong [domain|E] hơn mức nhân vật của Ngài có thể tự quản lý — đã đến lúc tạo ra các [vassals|E] mới!\n\nVì Ngài sẽ muốn giữ lại các Danh hiệu có giá trị trong Lãnh địa của mình, chúng Ta khuyên Ngài nên vào tab Domain trong giao diện Realm, nơi Ngài có thể thấy mỗi Danh hiệu mang lại giá trị bao nhiêu. Đồng thời hãy cân nhắc Danh hiệu nào nằm trong [de_jure|E].\n\n#TUT Việc vượt quá [domain_limit|E] quá lâu nên tránh, vì điều đó sẽ gây ra hậu quả.\n\nĐể ở dưới giới hạn, Ngài cần ban các [titles|E] dư thừa cho các chư hầu mới. Dù Ngài có thể ban danh hiệu cho chư hầu hiện có, nhưng thường tốt hơn nếu tìm một người chưa có đất để ban.\n\nCác thành viên [dynasty|E] xa hoặc [courtiers|E] có [trait|E] [GetTrait('content').GetName( GetPlayer )] là những chư hầu rất tốt. Các [claimants|E] đối với danh hiệu của Ngài, hoặc các Courtiers có [GetTrait('ambitious').GetName( GetPlayer )] thì không.#!"
  reactive_advice_vassal_limit:0 "$reactive_advice_vassal_limit_step_1$"
  reactive_advice_vassal_limit_step_1:0 "Giới hạn Chư hầu"
  reactive_advice_vassal_limit_desc:0 "Không ai có thể quản lý cả một bầy Bá tước — những kẻ chinh phục đầy tham vọng cần dựa vào các [vassals|E] cấp cao hơn, như Công tước, để quản lý đất đai thay mình!\n\nNgài có thể xem Giới hạn Chư hầu hiện tại trong giao diện Domain.\n\n#TUT Cũng giống như giới hạn lãnh địa, Ngài không nên vượt quá [vassal_limit|E]. Để tránh hình phạt này, Ngài nên hợp nhất các chư hầu.\n\nCách tốt nhất để làm điều đó là ban các [duchies|E] cho chư hầu, khiến họ cai trị một khu vực lớn hơn để Ngài không phải quản lý! Tuy nhiên, để làm được điều này Ngài phải nắm giữ một [kingdom|E] hoặc [empire|E]; đừng mắc sai lầm khi ban đi một trong các [primary_titles|E] của mình!\n\nNếu Ngài vượt quá Giới hạn Chư hầu khi còn là Công tước, chúng Ta khuyên Ngài nên thành lập một Vương quốc sớm nhất có thể.#!"
  reactive_advice_megaduke_penalty:0 "$reactive_advice_megaduke_penalty_step_1$"
  reactive_advice_megaduke_penalty_step_1:0 "Công quốc quá lớn!"
  reactive_advice_megaduke_penalty_desc:2 "Công quốc [duchy|E] của Ngài đang sụp đổ dưới áp lực vì sở hữu quá nhiều đất đai. Ngài nên [create|E] hoặc [usurp|E] một [kingdom|E]!\n\n#TUT Có lẽ Ngài đã có thể tạo lập một Vương quốc? Nếu vậy, hãy mở giao diện Tình hình Hiện tại và xem liệu có Vương quốc nào Ngài có thể tạo không. Nếu chưa, Ngài có thể dùng một [decision|E] để tự thành lập Vương quốc của riêng mình — nhưng hãy cẩn thận, các danh hiệu do Ngài tự lập thường yếu hơn các danh hiệu [de_jure|E] có sẵn.\n\nNếu Ngài là một [vassal|E] và [liege|E] của Ngài là một Nhà vua, Ngài phải yêu cầu độc lập trước khi có thể tự trở thành Vua. Bước đầu tiên là tham gia hoặc khởi xướng một [independence_faction|E].#!"
  reactive_advice_bastards:0 "$reactive_advice_bastards_step_1$"
  action_reactive_advice_bastards:0 "$open_tutorial_lesson$$reactive_advice_bastards_step_1$"
  action_reactive_advice_bastards_desc:0 "Một đứa con ngoài giá thú có thể là phúc lành hoặc tai họa — nhưng rốt cuộc điều đó thực sự có ý nghĩa gì?\nMở mục này để xem tổng quan về con hoang, và cách Ngài có thể tận dụng chúng!"
  action_reactive_advice_bastards_click:0 "$click_to_open_lesson$"
  reactive_advice_bastards_step_1:0 "Con hoang"
  reactive_advice_bastards_desc:1 "Ối! Có vẻ như Ngài đã có một đứa con [bastard|E]! Điều này có thể là mối đe dọa — hoặc là cơ hội...\n\n#TUT Có con hoang không hẳn là điều xấu; Ngài có thể gả chúng để tạo [alliances|E] mà không đe dọa trực tiếp đến [succession|E], vì chúng không được xem là [legitimate|E].\n\nThậm chí, việc giữ lại vài đứa con hoang cũng có thể là ý hay, để Ngài có thể [legitimized|E] chúng nếu sau này thiếu người thừa kế hợp pháp. Tuy nhiên, hãy nhớ để ý tới [opinion|E] mà [spouse|E] của Ngài dành cho Ngài...\n\nNếu Ngài muốn có con hoang, chúng Ta khuyên Ngài nên dùng [scheme|E] [GetScheme('seduce').GetTypeName] với các nhân vật chưa kết hôn. Nếu Ngài quyến rũ một phụ nữ đã có chồng, chồng cô ta có thể nghĩ đứa trẻ là của mình — khi đó Ngài sẽ không thể Hợp pháp hóa đứa trẻ.#!"
  reactive_advice_protecting_against_hostile_schemes:0 "$reactive_advice_protecting_against_hostile_schemes_step_1$"
  action_reactive_advice_protecting_against_hostile_schemes:0 "$open_tutorial_lesson$$reactive_advice_protecting_against_hostile_schemes_step_1$"
  action_reactive_advice_protecting_against_hostile_schemes_desc:0 "Nhiều hiểm họa ẩn mình trong bóng tối, và nguy cơ từ các âm mưu luôn rình rập.\nMở mục này để xem tổng quan về các âm mưu, và cách tự bảo vệ bản thân!"
  action_reactive_advice_protecting_against_hostile_schemes_click:0 "$click_to_open_lesson$"
  reactive_advice_protecting_against_hostile_schemes_step_1:0 "Phòng chống Âm mưu"
  reactive_advice_protecting_against_hostile_schemes_step_2:0 "$reactive_advice_protecting_against_hostile_schemes_step_1$"
  reactive_advice_protecting_against_hostile_schemes_desc:0 "Hãy cẩn thận từng bước đi! Là một người cai trị, có rất nhiều kẻ sẽ [scheme|E] để thấy Ngài chết...\n\nHãy cố gắng đảm bảo các thần dân có [opinion|E] cao về Ngài — nhưng quan trọng nhất là #emphasis luôn luôn#! giữ cho [spymaster|E] của Ngài trung thành.\n\n#TUT Ngài có thể không biết đến sự tồn tại của chúng, nhưng các [hostile_schemes|E] có thể nhắm vào Ngài bất cứ lúc nào. Để ngăn chặn Âm mưu, chúng Ta khuyên Ngài nên giữ cho các [vassals|E] và [courtiers|E] hài lòng.#!"
  reactive_advice_protecting_against_hostile_schemes_2_desc:0 "Có một Spymaster với Opinion cực thấp đối với Ngài có thể là án tử hình, vì khi đó Ngài không có cách nào để phát hiện các [secret_schemes|E]!\n\n#TUT Hãy cân nhắc tất cả những điều này nếu Ngài dự định chơi như một [tyrant|E], vì dù Ngài có thể đàn áp thần dân bằng [dread|E], họ vẫn có thể âm mưu chống lại Ngài.\n\nCuối cùng, hãy cảnh giác với các [claimants|E] có trait [GetTrait('sadistic').GetName( GetPlayer )] hoặc [GetTrait('ambitious').GetName( GetPlayer )] đối với ngai vàng của Ngài...#!"
  reactive_advice_protect_against_factions:0 "$reactive_advice_protect_against_factions_step_1$"
  action_reactive_advice_protect_against_factions:0 "$open_tutorial_lesson$$reactive_advice_protect_against_factions_step_1$"
  action_reactive_advice_protect_against_factions_desc:0 "Một Phe phái là mối nguy hiểm lớn nếu bị bỏ mặc.\nMở mục này để xem tổng quan về các phe phái, và cách xử lý chúng hiệu quả nhất!"
  action_reactive_advice_protect_against_factions_click:0 "$click_to_open_lesson$"
  reactive_advice_protect_against_factions_step_1:0 "Phòng chống Phe phái"
  reactive_advice_protect_against_factions_desc:1 "Một [faction|E] đã hình thành chống lại Ngài, nhưng đừng hoảng sợ — Ngài vẫn còn thời gian để sửa chữa mọi thứ!\n\nCác [vassals|E] và [counties|E] sẽ tham gia phe phái khi họ không hài lòng với sự cai trị của Ngài. Để đối phó, Ngài có thể tăng [opinion|E] của họ đối với Ngài, hoặc cố gắng trở nên đáng sợ hơn ([dreaded|E]).\n\n#TUT Để tránh Phe phái, chúng Ta khuyên Ngài nên tăng [opinion|E] của các Chư hầu, chinh phạt với nhịp độ vừa phải, và cố gắng [GetScheme('murder').GetTypeName] những [claimants|E] được yêu mến hơn Ngài.\n\nNgài thường sẽ có thời gian để xoa dịu các Chư hầu trước khi Phe phái đưa ra yêu sách — hãy tận dụng thời gian đó một cách khôn ngoan.#!"
  reactive_advice_protect_against_factions_2_desc:0 "Các Hạt có [county_opinion|E] thấp thường sẽ tham gia [peasant_faction|E]. Không giống các phe phái khác, Phe này sẽ nổi dậy bất kể họ có cơ hội chiến thắng hay không!\n\nĐôi khi, Ngài đơn giản là phải đặt đám nông dân vào đúng vị trí của họ...\n\n#TUT Ngài nên luôn để mắt tới các Phe Nông dân. Nếu họ nổi dậy khi Ngài đang chiến tranh, họ có thể gây thiệt hại nghiêm trọng đến [control|E] của Ngài.#!"
  reactive_advice_protect_against_factions_step_2:0 "$reactive_advice_protect_against_factions_step_1$"
  reactive_advice_imprisoned:0 "$reactive_advice_imprisoned_step_1$"
  action_reactive_advice_imprisoned:0 "$open_tutorial_lesson$$reactive_advice_imprisoned_step_1$"
  action_reactive_advice_imprisoned_desc:0 "Ai đó đã tống Ngài vào ngục! Điều này không hề tốt...\nMở mục này để xem điều gì sẽ xảy ra và Ngài có thể làm gì khi bị giam cầm."
  action_reactive_advice_imprisoned_click:0 "$click_to_open_lesson$"
  reactive_advice_imprisoned_step_1:0 "Ngài đã bị giam!"
  reactive_advice_imprisoned_desc:2 "Nhân vật của Ngài đã bị bắt và giờ nằm trong tay kẻ khác. Ngài không thể làm được nhiều điều lúc này.\n\nHãy điều hướng tới nhân vật đang giam giữ Ngài với tư cách [prisoner|E] và sử dụng [interaction|E] #TUT_KW 'Chuộc chính mình'#! — nếu may mắn, Ngài có thể trả tiền để được thả! Nếu xui xẻo, họ có thể chọn [execute|E] Ngài.\n\n#TUT Nếu Ngài đang [war|E] với kẻ giam giữ mình, họ có thể áp đặt một [victory|E]. Ngài không thể làm gì khác ngoài việc cẩn thận hơn trong tương lai!\n\nNếu Ngài bị bắt khi đang [commanding|E] một [army|E], có thể là do Ngài có [prowess_i][prowess|E] thấp. Đôi khi, không trực tiếp chỉ huy quân đội là một lựa chọn khôn ngoan.\n\nNếu Ngài bị bắt trong một [siege|E], thì đó là vì kẻ địch đã [occupied|E] [realm_capital|E] của Ngài. Ngài nên luôn cố gắng không để kẻ thù tiến sát thủ đô!#!"
  reactive_advice_county_control:0 "$reactive_advice_county_control_step_1$"
  action_reactive_advice_county_control:0 "$open_tutorial_lesson$$reactive_advice_county_control_step_1$"
  action_reactive_advice_county_control_desc:1 "Nếu [control|E] trong một [county|E] thấp, Ngài sẽ thu được ít lợi ích hơn từ nó.\nMở mục này để xem tổng quan cách quản lý Kiểm soát Hạt!"
  action_reactive_advice_county_control_click:0 "$click_to_open_lesson$"
  reactive_advice_county_control_step_1:0 "Kiểm soát Hạt"
  reactive_advice_county_control_desc:2 "Một trong các [counties|E] của Ngài đang có [control|E] thấp, nghĩa là Ngài sẽ nhận ít [taxes|E] và [levies|E] hơn từ nó. Tuy nhiên, vẫn có cách để tăng Kiểm soát trở lại!\n\n#TUT Ngài có thể xem Kiểm soát ở nhiều nơi: trong tab Domain của giao diện Realm, trong giao diện Tình hình Hiện tại, và trong giao diện Hạt.\n\nĐể tăng Kiểm soát, hãy vào giao diện Hội đồng và giao nhiệm vụ [increase_control|E] cho [marshal|E] của Ngài. Kiểm soát cũng sẽ tăng theo thời gian, nhưng quá trình này rất chậm — chúng Ta khuyên Ngài nên dùng một Marshal có kỹ năng cao.\n\nNếu Ngài để một Hạt có Kiểm soát thấp quá lâu, nó có thể sinh ra [county_corruption|E]. Để tránh điều này, chúng Ta khuyên Ngài không nên chinh phục quá nhiều đất cùng một lúc.#!"
  reactive_advice_looming_game_over:0 "$reactive_advice_looming_game_over_step_1$"
  reactive_advice_looming_game_over_step_1:0 "Tránh Game Over"
  reactive_advice_looming_game_over_desc:5 "Ối! Có vẻ như Ngài không có [player_heir|E]. Nếu Ngài chết ngay bây giờ, trò chơi sẽ kết thúc ([game_over|E]) — hãy cố tránh điều đó!\n\n#TUT Nếu Ngài rơi vào tình huống này, rất có thể Ngài là người cuối cùng của Triều đại mình. Từ đây chỉ còn một con đường hợp lệ — tạo ra một Người thừa kế [legitimate|E]!\n\nNếu xã hội của Ngài chỉ cho phép một giới tính thừa kế, Ngài có thể thử thay đổi [gender_law|E] để bớt khắt khe hơn. Nếu Ngài có bất kỳ [bastards|E] nào, bây giờ chính là lúc để hợp pháp hóa họ!\n\nNgoài ra, hãy đảm bảo Ngài đang [married|E] với một nhân vật có [fertility|E] cao (theo kinh nghiệm, phụ nữ trên 45 tuổi hiếm khi còn khả năng sinh sản). Nếu vẫn không hiệu quả, hãy [divorce|E] hoặc thử [GetScheme('murder').GetTypeName] [spouse|E] của Ngài rồi tái hôn — hoặc dùng [scheme|E] [GetScheme('seduce').GetTypeName] để tạo ra một đứa con hoang.\n\nThời gian là yếu tố sống còn, đừng mạo hiểm không cần thiết!#!"
  reactive_advice_bankruptcy:0 "$reactive_advice_bankruptcy_step_1$"
  action_reactive_advice_bankruptcy:0 "$open_tutorial_lesson$$reactive_advice_bankruptcy_step_1$"
  action_reactive_advice_bankruptcy_desc:0 "Ngài không còn [gold_i]Vàng nào, Ngài đang mắc nợ!\nMở mục này để xem tổng quan về nợ nần và cách thoát khỏi nó."
  action_reactive_advice_bankruptcy_click:0 "$click_to_open_lesson$"
  reactive_advice_bankruptcy_step_1:0 "Nợ nần"
  reactive_advice_bankruptcy_desc:2 "Ngài đã cạn [gold_i][gold|E] — điều này rất tệ, Ngài phải cắt giảm chi tiêu và lấp đầy ngân khố càng sớm càng tốt!\n\n#TUT Mắc [debt|E] sẽ ngăn Ngài làm nhiều việc, như tuyên bố [wars|E] hoặc bổ sung [men_at_arms|E], và còn gây ra [county_corruption|E]. Đừng để nợ nần vượt tầm kiểm soát!\n\nĐiều rõ ràng nhất cần làm là kết thúc mọi [wars|E] Ngài đang tham gia — vì khi hòa bình, Ngài không phải trả chi phí duy trì cho [armies|E]. Nếu Ngài đang mất quá nhiều Vàng, Ngài thậm chí nên cân nhắc giải tán bớt Men-at-Arms.\n\nNếu [faith|E] của Ngài cho phép, Ngài có thể dùng [interaction|E] #TUT_KW $hof_ask_for_gold_interaction$#! với [head_of_faith|E], hoặc Decision #TUT_KW $borrow_from_holy_order_decision$#!.\n\nCũng có thể là ý hay nếu Ngài chuyển sang [focus|E] $stewardship_wealth_focus_short$, nếu Ngài chưa dùng nó.#!"
  reactive_advice_rightful_liege:0 "$reactive_advice_rightful_liege_step_1$"
  action_reactive_advice_rightful_liege:0 "$open_tutorial_lesson$$reactive_advice_rightful_liege_step_1$"
  action_reactive_advice_rightful_liege_desc:0 "Cấu trúc De Jure cực kỳ quan trọng đối với các chư hầu của Ngài — việc không phải là lãnh chúa #emphasis chính danh#! của họ có thể gây hại cho quan hệ.\nMở mục này để xem tổng quan về ý nghĩa của việc trở thành Lãnh chúa Chính danh!"
  action_reactive_advice_rightful_liege_click:0 "$click_to_open_lesson$"
  reactive_advice_rightful_liege_step_1:0 "Lãnh chúa Chính danh"
  reactive_advice_rightful_liege_step_2:0 "$reactive_advice_rightful_liege_step_1$"
  reactive_advice_rightful_liege_desc:1 "Ngài không phải là [rightful_liege|E] của một [vassal|E]. Điều này sẽ làm giảm [opinion|E] của họ đối với Ngài và khiến họ nộp ít [taxes|E] và [levies|E] hơn.\n\nNgài nên cố gắng trở thành Lãnh chúa Chính danh của tất cả các Chư hầu!\n\n#TUT Để làm được điều này, Ngài cần nắm giữ [title|E] cao hơn họ một bậc trong hệ thống [de_jure|E]. Một Chư hầu cấp [county|E] sẽ muốn trực thuộc [duchy|E] De Jure của họ. Ví dụ, Bá tước của $c_madrid$ muốn trực thuộc Công tước của $d_toledo$.\n\nViệc có một số Chư hầu mà Ngài #emphasis không#! phải là Lãnh chúa Chính danh là rất phổ biến — Ngài không thể làm được nhiều điều với việc này, và điều đó hoàn toàn bình thường! Tuy nhiên, hãy nhớ sử dụng [interaction|E] #TUT_KW $grant_vassal_interaction$#! để sắp xếp lại các Chư hầu, Ngài không thể tự giữ mọi danh hiệu.#!"
  reactive_advice_rightful_liege_2_desc:0 "Khi chinh phục các vùng đất mới, Ngài thường sẽ có các Chư hầu mới mà Ngài không phải là Lãnh chúa Chính danh của họ. Việc lên kế hoạch chinh phạt hợp lý có thể giảm nhẹ vấn đề này.\n\n#TUT Để tránh có quá nhiều Chư hầu không ưa Ngài, chúng Ta khuyên Ngài nên tập trung chinh phục trong một khu vực De Jure tại một thời điểm. Bằng cách đó, Ngài có thể #emphasis dần dần#! trở thành Lãnh chúa Chính danh của họ. Hãy thường xuyên kiểm tra xem Ngài có thể [create|E] các Danh hiệu mới hay không!\n\nHãy nhớ sử dụng các chế độ bản đồ De Jure mỗi khi Ngài lên kế hoạch chinh phạt!#!"
 
  reactive_advice_bishop_endorsement:0 "$reactive_advice_bishop_endorsement_step_1$"
  action_reactive_advice_bishop_endorsement:0 "$open_tutorial_lesson$$reactive_advice_bishop_endorsement_step_1$"
  action_reactive_advice_bishop_endorsement_desc:0 "Giám mục của Ngài không ủng hộ Ngài!\nMở mục này để xem điều đó có ý nghĩa gì và Ngài có thể khắc phục như thế nào."
  action_reactive_advice_bishop_endorsement_click:0 "$click_to_open_lesson$"
  reactive_advice_bishop_endorsement_step_1:0 "Sự ủng hộ của Giám mục"
  reactive_advice_bishop_endorsement_desc:3 "[faith|E] của nhân vật Ngài quy định rằng Ngài có một [realm_priest|E] trong [council|E] của mình.\n\nNhững Giám mục này nắm giữ quyền lực to lớn, và họ sẵn sàng chia sẻ quyền lực đó với Ngài — miễn là Ngài giữ được thiện cảm của họ...\n\n#TUT Giám mục của Ngài cung cấp cho Ngài [taxes|E] và [levies|E] từ tất cả các [temple_holdings|E] trong [realm|E] của Ngài, và lượng họ cung cấp phụ thuộc vào [opinion|E] của họ đối với Ngài.\n\nNếu bị họ ghét, Ngài sẽ không nhận được gì cả, và Giám mục thậm chí còn có thể khiến cuộc sống của Ngài trở nên khó khăn! Ví dụ, họ có thể ép Ngài ly hôn với [spouse|E] của mình...\n\nNgài nên cố gắng hết sức để cải thiện Opinion của họ đối với Ngài. Dùng [interaction|E] #TUT_KW $gift_interaction$#! hoặc khởi động một [scheme|E] [GetScheme('sway').GetTypeName] là hai lựa chọn rất đáng cân nhắc.\n\nNếu mọi cách đều thất bại, [GetScheme('murder').GetTypeName] luôn là một phương án... Biết đâu người kế nhiệm của họ lại dễ chịu hơn?#!"
 
  reactive_advice_encyclopedia:0 "$reactive_advice_encyclopedia_step_1$"
  action_reactive_advice_encyclopedia:0 "$open_tutorial_lesson$$reactive_advice_encyclopedia_step_1$"
  action_reactive_advice_encyclopedia_desc:0 "Muốn tìm hiểu thêm về các thuật ngữ trong trò chơi? Mở mục này để làm quen với Bách khoa toàn thư."
  action_reactive_advice_encyclopedia_click:0 "$click_to_open_lesson$"
  reactive_advice_encyclopedia_step_1:0 "Bách khoa toàn thư"
  reactive_advice_encyclopedia_desc:0 "Crusader Kings III có rất nhiều khái niệm và thuật ngữ để Ngài tìm hiểu. Nếu Ngài thấy bối rối về một khái niệm nào đó trong game, Ngài có thể mở Bách khoa toàn thư.\n\nHãy làm theo các chỉ dẫn UI được tô sáng để biết cách thực hiện.\n\n#TUT Mục 'Tutorial Lessons' trong Bách khoa toàn thư liệt kê nhiều phần của hướng dẫn, phòng khi Ngài cần ôn lại kiến thức.#!"

  reactive_advice_religion:0 "$lesson_basics_religion_1$"
  action_reactive_advice_religion:0 "$open_tutorial_lesson$$lesson_basics_religion_1$"
  action_reactive_advice_religion_desc:0 "Muốn tìm hiểu thêm về Đức tin và Tôn giáo? Mở mục này để làm quen với Tôn giáo của Ngài."
  action_reactive_advice_religion_click:0 "$click_to_open_lesson$"

  reactive_advice_dynamic_culture:0 "Văn hóa"
  action_reactive_advice_dynamic_culture:0 "$open_tutorial_lesson$$reactive_advice_dynamic_culture$"
  action_reactive_advice_dynamic_culture_desc:0 "Muốn tìm hiểu thêm về Văn hóa? Mở mục này để làm quen với các Nền văn hóa."
  action_reactive_advice_dynamic_culture_click:0 "$click_to_open_lesson$"

  reactive_advice_fabricate_claim:0 "$reactive_advice_fabricate_claim_step_1$"
  action_reactive_advice_fabricate_claim:0 "$open_tutorial_lesson$$reactive_advice_fabricate_claim_step_1$"
  action_reactive_advice_fabricate_claim_desc:0 "Ngài không thể tuyên chiến? Ngài có thể ngụy tạo yêu sách!\nMở mục này để xem cách dùng hội đồng của Ngài để tạo Claim."
  action_reactive_advice_fabricate_claim_click:0 "$click_to_open_lesson$"
  reactive_advice_fabricate_claim_step_1:0 "Ngụy tạo Yêu sách"
  reactive_advice_fabricate_claim_desc:1 "Ngài không thể tuyên chiến nếu không có [casus_belli|E]. Nguồn Casus Belli phổ biến nhất là [claims|E], nhưng đôi khi việc có được Claim mong muốn lại không hề dễ.\n\nĐó là lúc [fabricated_claims_short|E] phát huy tác dụng!\n\n#TUT Ngài có thể giao nhiệm vụ cho [court_chaplain|E] để ngụy tạo Claim lên bất kỳ [county|E] lân cận nào, thông qua giao diện [council|E]. Ngài chỉ có thể ngụy tạo một Claim tại một thời điểm, và mỗi Claim đều cần thời gian để hoàn thành.\n\nCông cụ này đặc biệt hữu ích khi Ngài chơi một [ruler|E] nhỏ, vì Casus Belli sẽ dễ kiếm hơn khi [realm|E] của Ngài lớn mạnh.\n\nChúng Ta khuyên Ngài nên ngụy tạo Claim lên các láng giềng  trực tiếp — lý tưởng nhất là những kẻ yếu hơn Ngài! Nếu Ngài đang chơi ở cấp Bá tước, hãy tập trung Claim các danh hiệu trong cùng [duchy|E] [de_jure|E] với [realm_capital|E] của Ngài.#!"
 
  reactive_advice_education:0 "$reactive_advice_education_step_1$"
  action_reactive_advice_education:0 "$open_tutorial_lesson$$reactive_advice_education_step_1$"
  action_reactive_advice_education_desc:1 "Người thừa kế của Ngài sẽ không thể trở thành một nhà cai trị vĩ đại nếu không được giáo dục!\nMở mục này để tìm hiểu về giám hộ và cách đào tạo người thừa kế đúng cách."
  action_reactive_advice_education_click:0 "$click_to_open_lesson$"
  reactive_advice_education_step_1:0 "Giáo dục"
  reactive_advice_education_desc:4 "Có vẻ như [player_heir|E] của Ngài không có [guardian|E]! Nếu không có [education|E] phù hợp, họ sẽ có [skills|E] kém và các [traits|E] ngẫu nhiên.\n\n#TUT Dùng [interaction|E] #TUT_KW $educate_child_interaction$#! với Người thừa kế của Ngài và chọn một nhân vật phù hợp làm [guardian|E].\n\nNgài nên tìm một nhân vật am hiểu lĩnh vực mà Ngài muốn [ward|E] của mình vượt trội. Chúng Ta khuyên Ngài nên chọn Giám hộ có [education_trait|E] cấp cao (ví dụ: [GetTrait('education_martial_4').GetName( GetPlayer )]) hoặc các trait như [GetTrait('intellect_good_1').GetName( GetPlayer )] hay [GetTrait('intellect_good_3').GetName( GetPlayer )]. Nếu Ngài không muốn mạo hiểm để người khác định hình tính cách con mình, Ngài có thể tự giáo dục Người thừa kế!\n\nNhìn chung, Ngài sẽ muốn tất cả con cái mình đều được giáo dục tốt. Tuy nhiên, với những đứa con Ngài không quá quan tâm (như con thứ tư hoặc thứ năm), Ngài có thể giao chúng cho [vassals|E] để nhận thêm [opinion|E]. Cách dễ nhất để tìm người dạy là dùng trực tiếp [interaction|E] #TUT_KW $offer_ward_interaction$#! với một Chư hầu.#!"
  reactive_advice_tooltip_modes:0 "$reactive_advice_tooltip_modes_step_1$"
  action_reactive_advice_tooltip_modes:0 "$open_tutorial_lesson$$reactive_advice_tooltip_modes_step_1$"
  action_reactive_advice_tooltip_modes_desc:1 "Crusader Kings III có nhiều chế độ tooltip khác nhau!\nMở mục này để xem tổng quan các chế độ và tìm ra chế độ phù hợp nhất với phong cách chơi của Ngài."
  action_reactive_advice_tooltip_modes_click:0 "$click_to_open_lesson$"
  reactive_advice_tooltip_modes_step_1:0 "Chế độ Tooltip"
  reactive_advice_tooltip_modes_step_2:0 "Chế độ Tooltip Nâng cao"
  reactive_advice_tooltip_modes_desc:1 "Chế độ Tooltip quyết định #EMP cách#! Ngài truy cập [highlighted_text|E] và thông tin trong tooltip #weak (nói cách khác, cách khóa tooltip để Ngài có thể đưa chuột vào bên trong)#!.\n\nChế độ Tooltip mặc định được gọi là #V Khóa theo Thời gian#!. Với chế độ này, tooltip sẽ tự động khóa sau một khoảng thời gian được hiển thị bằng thanh tiến trình nhỏ."
  reactive_advice_tooltip_modes_2_desc:0 "Nếu Ngài là người chơi có kinh nghiệm, hoặc đơn giản là không muốn tooltip tự động khóa, chúng Ta khuyên Ngài thử #V Khóa theo Hành động#!. Với chế độ này, Ngài nhấn #V Chuột giữa#! để khóa tooltip.\n\n#I Ngài có thể đổi Chế độ Tooltip bằng cách vào #V Menu trong game#!, sau đó vào #V Cài đặt#!, rồi tới mục #V Game#! — tùy chọn #V Tooltip Mode#! nằm ở đó.#!"

  action_perk_bonus_cap_modes:0 "Đạt giới hạn Thưởng Perk"
  action_perk_bonus_cap_modes_desc:0 "Ngài đã đạt đến mức thưởng tối đa mà một perk có thể cung cấp. Một số perk, như [GetPerk('sound_foundations_perk').GetName(GetPlayer)], có giới hạn tối đa về số điểm kỹ năng mà chúng có thể cộng thêm."
  action_perk_bonus_cap_modes_click:0 "$click_to_open_lesson$"
  reactive_advice_perk_bonus_cap:0 "$action_perk_bonus_cap_modes$"
  reactive_advice_perk_bonus_cap_desc:0 "$action_perk_bonus_cap_modes_desc$ Khi vượt quá giới hạn, phần thưởng sẽ không tăng thêm nữa, và cũng sẽ không giảm cho tới khi Ngài trở lại dưới giới hạn."
  reactive_advice_perk_bonus_cap_step_1:0 "$action_perk_bonus_cap_modes$"

  action_reactive_advice_varangian_adventure:0 "$open_tutorial_lesson$$reactive_advice_varangian_adventure_step_1$"
  action_reactive_advice_varangian_adventure_desc:0 "Ngài có thể khởi động một Cuộc phiêu lưu Varangian.\nMở mục này để tìm hiểu thêm về loại chiến tranh đặc biệt này."
  action_reactive_advice_varangian_adventure_click:0 "$click_to_open_lesson$"
  reactive_advice_varangian_adventure:0 "$game_concept_varangian_adventures$"
  reactive_advice_varangian_adventure_step_1:0 "$game_concept_varangian_adventures$"
  reactive_advice_varangian_adventure_desc:0 "Ngài có thể tuyên bố một [varangian_adventure|E].\n\nTrong suốt kỷ nguyên [era|E] $culture_era_tribal$, loại chiến tranh này cho phép Ngài bắt đầu một cuộc sống mới tại vùng đất xa xôi, rời xa bờ biển lạnh giá của quê hương.\n\nMột $game_concept_varangian_adventures$ thành công không chỉ di dời lãnh thổ của Ngài sang vùng đất mới, mà còn khiến toàn bộ lãnh thổ hiện tại của Ngài trở nên độc lập, bao gồm cả các chư hầu.\n\nCuộc [varangian_adventure|E] đầu tiên của Ngài với tư cách là một người cai trị thuộc nhóm $north_germanic_group$ cũng sẽ triệu tập thêm quân từ các hạt cùng [faith|E] và cùng [culture|E] mà Ngài sở hữu tại [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName] để hỗ trợ chinh phục quê hương mới."

# Court positions
  action_reactive_advice_court_positions:0 "$open_tutorial_lesson$$ra_court_pos_open_view$"
  action_reactive_advice_court_positions_desc:0 "Mở mục này để làm quen với các Chức vụ Triều đình"
  action_reactive_advice_court_positions_click:0 "$click_to_open_lesson$"
  reactive_advice_court_positions: "$ra_court_pos_open_view$"
 

  ra_court_pos_open_view:0 "Chức Vụ Triều Đình"
  ra_court_pos_open_view_desc:0 "Đây là thời điểm thích hợp để tìm hiểu về [court_positions|E]. Chúng là các chức vụ và danh hiệu mà Ngài có thể trao cho [courtiers|E] và [vassals|E] của mình.\n\nMỗi chức vụ đều mang lại lợi ích, nhưng phải trả lương hàng tháng. Ví dụ, một [GetCourtPositionType('court_physician_court_position').GetName()] sẽ giúp giữ cho Ngài và [court|E] của Ngài luôn khỏe mạnh."
  ra_court_pos_open_view_trigger:0 "Mở tab Chức Vụ Triều Đình (được đánh dấu)"
  ra_court_pos_appointing:0 "$ra_court_pos_open_view$"
  ra_court_pos_appointing_desc:1 "Ngài có thể bổ nhiệm [court_positions|E] mới bằng cách nhấp vào một trong các khung chân dung trống của chức vụ còn khuyết. Một nhân vật có [aptitude|E] cao cho chức vụ đó sẽ mang lại hiệu quả lớn hơn.\n\n#TUT Khi Ngài bổ nhiệm ai đó vào một Chức vụ, điều này cũng ảnh hưởng đến [opinion|E] của họ đối với Ngài. Vì vậy, đôi khi việc bổ nhiệm một người có $game_concept_aptitude$ thấp hơn cũng có thể có lợi, chỉ để khiến họ quý mến Ngài hơn.#!"
  ra_court_pos_salary:0 "$ra_court_pos_open_view$"


