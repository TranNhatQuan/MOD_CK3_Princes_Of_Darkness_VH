  ra_admin_gov_1_desc: "@ra_admin_gov_1!Ngài đang ở trong một [administrative_government|e]. Nó bao gồm các $TUTORIAL_GOVERNORS$ quản lý và cai trị đất đai cho [top_liege|e] của họ, mặc dù họ không thực sự sở hữu vùng đất đó."
  ra_open_admin_gov_panel_prompt: "Mở tab '$TUTORIAL_PROVINCES_NO_TOOLTIP$' trong bảng Chính phủ Hành chính (được làm nổi bật)"

  ra_admin_gov_2_desc: "Đây là tất cả các $TUTORIAL_PROVINCES$ hiện có trong [top_realm|e].\n\nMột $TUTORIAL_GOVERNOR$ chỉ có thể nắm giữ một $TUTORIAL_PROVINCE_NO_TOOLTIP$, trở nên mạnh hơn đồng nghĩa với việc phân chia quyền cai trị các $TUTORIAL_PROVINCES_NO_TOOLTIP$ giữa các thành viên trong [house|e] của họ.\n\nVì $TUTORIAL_GOVERNORS_NO_TOOLTIP$ không sở hữu $TUTORIAL_PROVINCE_NO_TOOLTIP$ của mình, họ cần củng cố vị trí thông qua [schemes|e] và các hành động chính trị.\n\n#I Ngài có thể kiểm tra $TUTORIAL_PROVINCES_NO_TOOLTIP$ bằng cách nhấp vào chúng trên bản đồ hoặc trong danh sách.#!"
  ra_open_admin_gov_theme_detail_prompt: "Xem một $TUTORIAL_PROVINCE_NO_TOOLTIP$"

  ra_admin_gov_3_desc: "[skills|e] của một $TUTORIAL_GOVERNOR_NO_TOOLTIP$, cùng thứ hạng của họ trong [GetTrait('governor').GetName( GetNullCharacter )] [trait|e], sẽ quyết định [governor_efficiency|e], chỉ số đo lường số [levies|e] và [taxes|e] mà họ có thể thu thập cho $game_concept_top_liege$.\n\n$game_concept_governor_efficiency$ cao cũng tăng cường $TUTORIAL_PROVINCIAL_ARMIES$ của [province|E].\n\nNếu Ngài là [top_liege|e], Ngài nên đảm bảo rằng các $game_concept_provinces$ được giao cho những $TUTORIAL_GOVERNORS_NO_TOOLTIP$ có $game_concept_governor_efficiency$ cao."
  ra_admin_gov_3_prompt: "Mở tab 'Bổ nhiệm $TUTORIAL_GOVERNOR_NO_TOOLTIP$'"

  ra_admin_gov_4_desc: "[succession|e] của một $TUTORIAL_PROVINCE$ trong [administrative_government|e] được quyết định thông qua bầu cử, nơi Ngài sử dụng @influence_icon![influence|e] để tăng [candidate_score|E] của một ứng viên. \n\nNếu Ngài muốn mở rộng quyền lực trong [realm|e], hãy đảm bảo các thành viên trong [house|e] của Ngài là $TUTORIAL_GOVERNORS$, hoặc thậm chí nắm giữ [title|e] của $game_concept_top_realm$."

  ra_admin_gov_5_desc: "Mỗi $TUTORIAL_PROVINCE$ được [governed|e] bởi một [family|e]. Ngài có thể thấy huy hiệu [house|e] hiển thị bên cạnh mỗi $TUTORIAL_PROVINCE_NO_TOOLTIP$.\n\nKhi $game_concept_house$ của Ngài có thêm nhiều [titles|e], Ngài sẽ trở nên nổi bật hơn, và có thể trở thành một [powerful_family|e]."

  ra_open_admin_gov_powerful_families_intro: "Mở tab Gia tộc Quý tộc (được làm nổi bật)"

  ra_admin_gov_6_desc: "Một [powerful_family|e] là một [house|e] có ảnh hưởng trong [administrative_government|e]. Gia tộc của [top_liege|e] luôn được coi là quyền lực, bất kể [powerful_family_rating_mid|e] của họ. Ngoài ra, còn có thể có thêm năm $game_concept_powerful_families$ khác.\n\nMặc dù bất kỳ $game_concept_house$ nào cũng có thể thiết lập một [powerful_family_attribute|E], nó chỉ có hiệu lực khi Gia tộc tương ứng được coi là Quyền lực."
  ra_open_admin_gov_open_estate_prompt: "Xem Lãnh địa của Ngài"
  ra_admin_gov_7_desc: "Một [estate|e] là một loại [domicile|e], đại diện cho một bất động sản tư nhân không gắn liền với bất kỳ [titles|e] [landed|e] cụ thể nào. Trong [administrative_government|e], nó đóng vai trò là căn cứ hoạt động cho [family|e] của Ngài, và sẽ được thừa kế trong [house|e] của Ngài.\n\nNgài có thể nâng cấp và xây dựng các [estate_buildings|e] mới trong $game_concept_estate$ của mình để tăng [influence|e] và ảnh hưởng chính trị trong [realm|e].\n\n#TUT Đáng chú ý, các [rulers|e] [feudal|e] trong $game_concept_administrative_government$ sẽ không có quyền truy cập vào $game_concept_estate$.#!"
  ra_admin_gov_8_desc: "@ra_admin_gov_8! Một [administrative_government|e] xoay quanh gia đình, ảnh hưởng chính trị, âm mưu, và việc bổ nhiệm đúng người vào đúng vị trí.\n\nNgài sẽ sử dụng [influence|e] để cải thiện vị thế của mình trong [realm|e] đồng thời đưa các thành viên trong [dynasty|e] của Ngài vào các vị trí quyền lực.\n\nThực hiện [scheme|e] chống lại đối thủ và làm suy yếu quyền lực của họ thông qua các âm mưu chính trị. Con đường đến quyền lực dài và đầy khúc khuỷu, nhưng nếu chơi đúng nước đi, Ngài có thể vượt qua nó."

  ra_agent_scheme_rework_1: "Âm mưu Phức tạp"
  ra_agent_scheme_rework_1_desc: "Hãy cùng xem qua các [schemes|e] phức tạp. Những $game_concept_schemes$ này gồm ba thông số chính: [success_chance|e], [scheme_speed_single|e], và [secrecy|e].\n\nĐể hỗ trợ Ngài hoàn thành một $game_concept_scheme$, có nhiều loại [agents|e] khác nhau, thường xuất hiện theo nhóm năm người được chọn sẵn khi bắt đầu một $game_concept_scheme$ phức tạp."
  reactive_advice_agent_scheme_rework: "$ra_agent_scheme_rework_1$"

  ra_agent_scheme_rework_2: "Chi tiết Âm mưu Phức tạp"
  ra_agent_scheme_rework_2_desc: "Một [scheme|e] phức tạp sẽ diễn ra qua nhiều [scheme_phases|e]. Mỗi $game_concept_scheme_phase$ gồm một số ngày nhất định, sau đó [success_chance|e] của Ngài sẽ tăng lên.\n\nCó khả năng Ngài sẽ nhận được một [scheme_opportunity_opportunity|e] sau mỗi $game_concept_scheme_phase$, mà Ngài có thể dùng để thuyết phục [agents|e] tham gia, hoặc thực hiện $game_concept_scheme$ với $game_concept_success_chance$ cao hơn."

  ra_agent_scheme_rework_3: "Tiềm năng Âm mưu Phức tạp"
  ra_agent_scheme_rework_3_desc: "Mỗi [scheme|e] có một [scheme_potential|e] tương ứng. Tiềm năng này có thể được tăng lên thông qua [agents|e], và đóng vai trò là giới hạn tối đa cho [success_chance|e] Ngài có thể đạt được.\n\n$game_concept_scheme_potential$ không bao giờ vượt quá 95%, nghĩa là mọi $game_concept_schemes$, bất kể Ngài dùng bao nhiêu [scheme_opportunity_opportunities|e] để tăng $game_concept_success_chance$, vẫn luôn có khả năng thất bại."

  ra_agent_scheme_rework_4: "Bí mật của Âm mưu Phức tạp"
  ra_agent_scheme_rework_4_desc: "Một [scheme|e] phức tạp có một mức [secrecy|e] nhất định. Đây là giá trị thể hiện khả năng $game_concept_scheme$ bị phát hiện.\n\nKhi bắt đầu một $game_concept_scheme$, nó sẽ có một khoảng thời gian an toàn vài tháng, trong đó không thể bị phát hiện dưới bất kỳ hoàn cảnh nào. Sau thời gian này, $game_concept_scheme$ có nguy cơ bị lộ thông qua [scheme_breaches|e].\n\nNgài vẫn có thể thực hiện một âm mưu ngay cả khi nó có $game_concept_scheme_breaches$, nhưng [success_chance|e] sẽ bị giảm. Nếu $game_concept_scheme$ tích lũy bảy $game_concept_scheme_breaches$, nó sẽ bị hủy.\n\n#TUT Ngoài ra, một số âm mưu cơ bản, như [GetScheme('seduce').GetTypeName], cũng có thể được coi là bí mật và có thời gian an toàn tương tự.#!"
 
  ra_agent_scheme_rework_5: "Đặc vụ trong Âm mưu Phức tạp"
  ra_agent_scheme_rework_5_desc: "Các [schemes|e] phức tạp có năm ô [agent|e] có thể được lấp đầy bởi các đồng mưu tiềm năng. Nói chung, Ngài nên lấp đầy càng nhiều ô $game_concept_agent$ càng tốt, vì họ có thể cung cấp các бонус có lợi cho [scheme_speed|e], [secrecy|e], hoặc [scheme_potential|e].\n\nCác loại $game_concept_agent$ khác nhau sẽ ưu tiên các [skills|e] khác nhau. Ví dụ, một [GetAgentSlotType( 'agent_infiltrator' ).GetName] sẽ hưởng lợi từ [intrigue_i|e] [intrigue|e] và [diplomacy_i|e] [diplomacy|e], cùng với một số [traits|e] nhất định."

  ra_agent_scheme_rework_6: "Thực hiện Âm mưu"
  ra_agent_scheme_rework_6_desc: "Khi Ngài cảm thấy đã chuẩn bị đủ, có thể đã đến lúc cân nhắc thực hiện [scheme|e] của mình. Để làm điều này, Ngài có thể sử dụng [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t2_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t3_value')], hoặc [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t4_value')] từ số [scheme_opportunity_opportunities|e] đã tích lũy.\n\nNgoài ra, nếu Ngài nghi ngờ ai đó đang âm mưu chống lại mình, Ngài nên thay đổi [scheme_countermeasure|e] đang sử dụng để tránh những rủi ro không mong muốn.\n\nChúc may mắn, và hãy tận hưởng việc bày mưu tính kế!"

