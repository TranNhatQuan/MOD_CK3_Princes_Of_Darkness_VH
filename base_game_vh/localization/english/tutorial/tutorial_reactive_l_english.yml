  action_reactive_advice_great_projects_click: "$click_to_open_lesson$"
  ra_gp_1: "Công trình Vĩ đại"
  ra_gp_1_desc: "Ngài có thể bắt đầu hoặc đóng góp cho một [great_project|e]! Hãy cùng tìm hiểu."
  ra_gp_1_prompt: "Mở tab Dự án trong bảng Quyết định (được đánh dấu)"
  ra_gp_2: "$ra_gp_1$"
  ra_gp_2_desc: "[great_projects|e] là những công trình quy mô lớn được hoàn thành nhờ sự đóng góp của nhiều [characters|e].\n\nChúng được dùng để xây dựng [great_buildings|e], hoặc khắc phục [natural_disasters|e], cùng nhiều mục đích khác.\n\nHãy cùng xem một $game_concept_great_project$."
  ra_gp_2_prompt: "Mở một Công trình Vĩ đại (được đánh dấu)"
  ra_gp_3: "$ra_gp_1$"
  ra_gp_3_desc: "[great_projects|e] có địa điểm và chi phí phải được thanh toán trước khi khởi động.\n\nSau khi bắt đầu, Người sáng lập và [subjects|e] của họ có thể đóng góp [great_project_contributions|e] để hoàn thành, giúp người sáng lập không phải tự trả toàn bộ $game_concept_great_project_contributions$.\n\n$game_concept_great_projects$ thường đòi hỏi rất nhiều thời gian và công sức."

  reactive_advice_natural_disasters: "Thiên tai"
  action_reactive_advice_natural_disasters: "Lời khuyên: $reactive_advice_natural_disasters$"
  action_reactive_advice_natural_disasters_desc: "Đã có $game_concept_natural_disaster$ xảy ra trong $game_concept_realm$ của ngài. Ngài có thể hành động để giảm thiểu tác động."
  action_reactive_advice_natural_disasters_click: "$click_to_open_lesson$"
  ra_natural_disasters_1: "$reactive_advice_natural_disasters$"
  ra_natural_disasters_1_desc: "Ôi không! Một [natural_disaster|e] đã giáng xuống [realm|e] của ngài.\n\nHãy xem ngài có thể làm gì."
  ra_natural_disasters_1_prompt: "Mở tình huống Thiên tai"
  ra_natural_disasters_2: "$reactive_advice_natural_disasters$"
  ra_natural_disasters_2_desc: "Một [natural_disaster|e] có ba [situation_phases|e].\n\n#high Cảnh báo#!: một $game_concept_natural_disaster$ sắp xảy ra.\n#high Tác động#!: Thảm họa đang có hiệu lực.\n#high Phục hồi#!: ngài có thể bắt đầu xây dựng lại.\n\nVới tư cách là một [ruler|e], các [subjects|e] của ngài mong đợi ngài xử lý hậu quả của một $game_concept_natural_disaster$."

  reactive_advice_women_in_china: "Phụ nữ tại Trung Hoa"
  action_reactive_advice_women_in_china: "Lời khuyên: Phụ nữ tại Trung Hoa"
  action_reactive_advice_women_in_china_desc: "[law|E] Giới tính của $game_concept_realm$ của ngài không cho phép ngài trở thành một $game_concept_governor$."
  action_reactive_advice_women_in_china_click: "$click_to_open_lesson$"
  ra_women_in_china: "Phụ nữ tại Trung Hoa"
  ra_women_in_china_desc: "Để trở thành [governor|e] với tư cách phụ nữ tại Trung Hoa, ngài cần thay đổi Luật Giới tính của [hegemony|e]. Để làm điều đó, ngài phải trở thành [hegemon|e] trước.\n\nNếu ngài quan tâm đến trải nghiệm này, chúng tôi khuyến nghị thay đổi Game Rules về giới tính khi bắt đầu, hoặc tạo nhân vật tùy chỉnh để trở thành $game_concept_hegemon$ trong màn hình Bookmark."
