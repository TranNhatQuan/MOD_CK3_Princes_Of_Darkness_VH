  ra_admin_gov_troops_1: "Quân Lực trong Chế Độ Hành Chính"
  ra_admin_gov_troops_1b: "Quân Lực trong Chế Độ Hành Chính"
  ra_admin_gov_troops_1_desc: "@ra_admin_troops_1! Trong một [administrative_government|e], việc quản lý binh lực và quân đội khác biệt so với các loại $game_concept_government$ khác.\n\nDẫu ngài vẫn toàn quyền điều động quân đội của mình, ngài cũng có thể sử dụng $TUTORIAL_PROVINCIAL_ARMIES$. Trong chế độ $game_concept_administrative_government$, mỗi [province|e] đều có thể có một [army|e] riêng, thuộc về chính [title|e] ấy.\n\n[governors|e] vừa đảm nhiệm việc dân sự vừa nắm quyền quân sự, trong khi [top_liege|e] có thể điều phối binh lực của $game_concept_governors$, thu quyền chỉ huy hoặc phân bổ lại cho các $game_concept_governors$ khác trong [realm|e]."
  ra_admin_gov_troops_1_prompt: "Mở tab $TUTORIAL_PROVINCIAL_ARMIES_NO_TOOLTIP$ (được đánh dấu)"

  ra_admin_gov_troops_2: "Quân Lực trong Chế Độ Hành Chính"
  ra_admin_gov_troops_2b: "Quân Lực trong Chế Độ Hành Chính"
  ra_admin_gov_troops_2_desc: "Các [governors|e] có thể tạo các [men_at_arms|e] như một phần của $game_concept_governorship$ mà họ chịu trách nhiệm. Những đội quân này thuộc về [title|e], và có thể được vay mượn bởi các $game_concept_governors$ khác trong [realm|e].\n\n[top_liege|e] có $TUTORIAL_PROVINCIAL_ARMIES$ tùy ý sử dụng, và có khả năng quản lý đội quân của các $game_concept_governors$. Họ có thể giành quyền kiểm soát chúng trong các [wars|e] của riêng mình, hoặc tái phân bổ chúng cho các $game_concept_governors$ đang cần.\n\nĐiều này cho phép họ có khả năng huy động và sử dụng chúng, cải thiện hệ thống phòng thủ dọc theo biên giới của $game_concept_realm$."
  ra_admin_gov_troops_2_prompt: "Xem xét một [GetPlayer.Custom('GetProvincialArmyConceptNoTooltip')]"

  ra_admin_gov_troops_3: "Chiêu Nạp Binh Lực"
  ra_admin_gov_troops_3_desc: "Với tư cách [governor|E], ngài có thể dùng [influence|e] để cầu viện một $game_concept_army$ từ [province|e] khác.\n\n[top_liege|e] có thể ép bất kỳ $game_concept_governor$ nào điều chuyển $game_concept_army$, hoặc trực tiếp nắm quyền chỉ huy."

  ra_admin_gov_troops_4: "Chi Tiết Quân Đội"
  ra_admin_gov_troops_4_desc: "Nếu quân đội được [governor|e] triệu tập trong [war|e], [top_liege|e] không thể điều chuyển chúng cho đến khi bị giải tán.\n\nNếu xảy ra phản loạn từ $game_concept_governors$ chống lại [liege|e], thì $game_concept_governor$ sẽ thu hồi toàn bộ binh lực xuất thân từ [governorship|e] của mình.\n\nHãy luôn quan sát cục diện toàn cõi để tận dụng binh lực một cách tối ưu."

  ra_admin_gov_troops_5: "Con Đường Quyền Lực"
  ra_admin_gov_troops_5_desc: "@ra_admin_troops_5! Dẫu một [administrative|e] [realm|e] vận hành bằng chính trị và mưu lược, thì một quân đội hùng mạnh vẫn là nền tảng cho phòng thủ lẫn ngoại giao.\n\nSuy cho cùng, binh lực chỉ là một trong nhiều con đường dẫn đến quyền lực..."
 
  action_reactive_advice_laamp_contract_move: "$open_tutorial_lesson$ Tìm Kiếm Khế Ước"
  action_reactive_advice_laamp_contract_move_desc: "Phải chăng [task_contract|E] quanh vùng đã cạn? Hãy mở mục này để học cách tìm cơ hội mới."
  action_reactive_advice_laamp_contract_move_click: "$click_to_open_lesson$"
  reactive_advice_laamp_contract_move: "$ra_laamp_contract_move_1$"

  ra_laamp_contract_move_1: "Tìm Kiếm Khế Ước"
  ra_laamp_contract_move_1_desc: "Nếu công việc tại chỗ đã cạn, hoặc ngài muốn thử vận nơi xa, hãy dời [camp|E] để tìm [task_contracts|E] mới.\n\nNgài cần [travel|E] đủ xa khỏi nơi cũ để cơ hội mới xuất hiện."
  ra_domicile_camp_task: "Mở giao diện Trại"

  ra_laamp_contract_move_2: "Di Chuyển Trại"
  ra_laamp_contract_move_2_desc: "Đây là ví dụ về một điểm đến xa nơi trại hiện tại.\n\nNgài có thể lên kế hoạch [travel|E] từ [county|E] tới bất kỳ [barony|E] nào.\n\n#weak Lưu ý: Có thể di chuyển trại từ giao diện Trại.#!"
  ra_domicile_travel_task: "Mở giao diện $relocate_camp_to_interaction$"

  ra_laamp_contract_move_3: "Hành Trình Trại"
  ra_laamp_contract_move_3_desc: "Việc [traveling|E] cùng [camp|E] tương tự hành trình thường, nhưng mang theo [camp_buildings|E], [followers|E], và tiêu hao [provisions|E]."
  ra_domicile_depart_task: "Bắt đầu hành trình"

  ra_laamp_contract_move_4: "$ra_laamp_contract_move_3$"
  ra_laamp_contract_move_4_desc: "$ra_laamp_contract_move_3_desc$"
  ra_domicile_arrive_task: "Hoàn tất hành trình"

  ra_laamp_contract_move_5: "Khế Ước Mới"
  ra_laamp_contract_move_5_desc: "Khi đã tới nơi, nhiều [task_contracts|E] mới sẽ xuất hiện.\n\nHãy nhớ, di chuyển trại bất cứ lúc nào để tìm cơ hội — ít nhất nên cách hai [duchies|E] để đạt hiệu quả."
 
  reactive_advice_tutorial_war: "Chiến Tranh"
  reactive_advice_lesson_army_movement: "$lesson_army_movement$"
  reactive_advice_lesson_army_purpose: "Giao Chiến & Công Thành"
  reactive_advice_lesson_battle_mechanics: "$lesson_battle_mechanics$"
  reactive_advice_lesson_siege_mechanics: "$lesson_siege_mechanics$"
  reactive_advice_lesson_warscore: "$lesson_warscore$"
  reactive_advice_lesson_winning_wars: "$lesson_winning_wars$"
  reactive_advice_lesson_losing_wars: "$lesson_losing_wars$"

 #CE2

  reactive_advice_migration: "Di cư"

  action_reactive_advice_migration: "Lời khuyên: $reactive_advice_migration$"
  action_reactive_advice_migration_desc: "Là một Du mục nơi Đại Thảo Nguyên, ngài có thể Di cư đến những vùng đất mới. Hãy mở ra để tìm hiểu về việc Di cư."
  action_reactive_advice_migration_click: "$click_to_open_lesson$"

  ra_migration_1: "$reactive_advice_migration$"
  ra_migration_1_desc: "Khi ngài đóng vai một [nomad|E] trong [the_great_steppe|E], ngài có thể thực hiện [migrate|E].\nDi cư là việc trọng yếu đối với các Du mục, bởi đó là cách tìm kiếm vùng đất mới để [herd|E] của ngài chăn thả và phát triển hùng mạnh.\n\nHerd tượng trưng cho dân chúng cùng đàn gia súc, và đàn của ngài cần vùng đất có [county_fertility|E] cao để duy trì sinh trưởng.\nHãy cùng xét xem những vị trí tối ưu nơi thảo nguyên, nơi độ phì nhiêu sẽ mang lại lợi ích cho ngài cùng [realm|E]."
  ra_migration_1_prompt: "Ấn vào nút Di cư (đã được làm nổi bật)"

  ra_migration_1b: "$ra_migration_1$"

  ra_migration_2: "$reactive_advice_migration$"
  ra_migration_2_desc: "Việc lựa chọn nơi chốn mới cho ngài và [herd|E] nên đặt trọng tâm vào [county_fertility|E]. Độ phì nhiêu của đất được đo từ 0–100 và sẽ suy giảm dần theo thời gian khi ngài cư trú tại đó. Khi cạn kiệt, ngài buộc phải [migrate|E] sang nơi khác để tiếp tục phát triển."
  ra_migration_2_prompt: "Ấn vào chế độ bản đồ để xem bản đồ độ phì nhiêu (đã được làm nổi bật)"

  ra_migration_3: "$reactive_advice_migration$"
  ra_migration_3_desc: "Khoảng cách mà ngài có thể [migrate|E] phụ thuộc vào [title_tiers|E] và luật [dominance|E] mà ngài đang thi hành. Những quốc độ có Domain lớn cùng Dominance cao sẽ có nhu cầu di cư khác nhau, thậm chí về sau không còn cần di cư để nuôi dưỡng [herd|E].\nĐể chọn nơi muốn di cư đến, hãy nhấn vào một danh hiệu [de_jure|E] trên bản đồ."
  ra_migration_3_prompt: "Ấn vào bất kỳ địa điểm nào trong tầm trên bản đồ"

  ra_migration_4: "$reactive_advice_migration$"
  ra_migration_4_desc: "Tùy theo nơi ngài chọn, sẽ xuất hiện các dấu chỉ trên bản đồ biểu thị [county_fertility|E] cụ thể, hoặc tổng [domain_fertility|E] của danh hiệu [de_jure|E] đã chọn."

  ra_migration_5: "$reactive_advice_migration$"
  ra_migration_5_desc: "Vùng đất được chọn để [migration|E] luôn có ít nhất một [nomad|E] hoặc [herder|E] mà ngài phải thương lượng để được phép đặt chân vào. Ngài có thể dâng [herd|E], [gold|E], hoặc dùng [hook|E] để thuyết phục họ chấp thuận lời thỉnh cầu di cư của ngài."

  ra_migration_6: "$reactive_advice_migration$ (Chấp thuận thương lượng)"
  ra_migration_6_desc: "Có thể tồn tại nhiều [nomads|E] trong cùng một vùng mục tiêu. Nếu ngài [migrate|E] theo cách đối địch, tất cả sẽ phản ứng; nhưng nếu ngài thuyết phục được kẻ mạnh nhất trong vùng, tất thảy sẽ quy thuận.\n\nNếu thương lượng di cư được chấp thuận, ngài sẽ rời bỏ tước vị hiện tại và có thể cả [subjects|E] của ngài."

  ra_migration_7: "$reactive_advice_migration$ (Từ chối thương lượng)"
  ra_migration_7_desc: "Nếu [nomad|E] có [herd|E] lớn nhất trong vùng không chấp thuận lời thỉnh cầu, ngài buộc phải tuyên [war|E] chống lại hắn cùng toàn bộ du mục trong vùng đất ấy.\n\nTương tự như khi được chấp thuận, việc từ chối cũng khiến ngài rời bỏ [title|E] hiện tại và có thể cả [subjects|E]. Ngài sẽ trở thành [unlanded|E], tức không còn [county_fertility|E], và đàn của ngài sẽ không còn phát triển.\n\nVì thế, hoặc là chiến thắng, hoặc sau đó tìm nơi khác để tiếp tục di cư."

  ra_migration_8: "$reactive_advice_migration$"
  ra_migration_8_desc: "Nếu mọi sự thuận lợi với [migration|E], ngài sẽ có thêm vô số vùng đất để chăn thả, cùng nhiều cơ hội xử lý [settlement_issue|E], qua đó giải quyết xung đột và gia tăng [county_control|E] trong [domain|E] mới.\n\nĐất đai trong [the_great_steppe|E] thay chủ thường xuyên, vì vậy hãy cân bằng giữa [dread|E] và [opinion|E] để giữ mọi con đường rộng mở. Một tước vị mất đi với một Du mục, có thể đổi lấy gấp nhiều lần nếu ngài nuôi dưỡng đủ mạnh [herd|E] và [dominance|E]."

 # one small steppe for man...

  reactive_advice_great_steppe: "Đại Thảo Nguyên"

  action_reactive_advice_great_steppe: "Lời khuyên: $reactive_advice_great_steppe$"
  action_reactive_advice_great_steppe_desc: "Đại Thảo Nguyên là một tình thế mà ngài phải cân nhắc độ phì nhiêu của đất đai. Hãy mở ra để hiểu rõ điều này ảnh hưởng ra sao."
  action_reactive_advice_great_steppe_click: "$click_to_open_lesson$"

  ra_great_steppe_1: "$reactive_advice_great_steppe$"
  ra_great_steppe_1_desc: "Kính chào đến [the_great_steppe|E]!\n\nKhi ngài trị vì với tư cách một [GetGovernment( 'nomad_government' ).GetName] [ruler|E], việc bảo đảm [herd|E] phát triển là điều tối trọng. Đàn chỉ lớn mạnh khi có đất đai phì nhiêu để chăn thả, vì thế ngài phải du hành tìm kiếm những đồng cỏ trù phú.\n\nCác Du mục trị vì nơi Thảo Nguyên, nơi ngài sẽ tham gia một [situation|E]. Vùng Steppe được chia thành ba khu vực, trong đó trọng tâm là [county_fertility|E] của đất."
  ra_great_steppe_1_prompt: "Ấn nút Tình huống để tiếp tục (đã được làm nổi bật)"

  ra_great_steppe_1b: "$reactive_advice_great_steppe$"

  ra_great_steppe_2: "$reactive_advice_great_steppe$"
  ra_great_steppe_2_desc: "Mỗi trong ba khu vực sẽ chịu ảnh hưởng bởi [steppe_season|E]. Những mùa này không phải xuân hạ thu đông, mà là ảnh hưởng lâu dài lên [county_fertility|E] của đất.\n\nTác động của chúng được hiển thị qua hiệu ứng mùa. Ví dụ, sống nơi đồng cỏ trù phú sẽ tăng khả năng nuôi dưỡng [herd|E], nhưng cũng ảnh hưởng đến lòng người theo ngài."

  ra_great_steppe_3: "$reactive_advice_great_steppe$"
  ra_great_steppe_3_desc: "Để lập kế hoạch dài hạn, ngài có thể nhờ đến [GetCourtPositionType('court_astrologer_court_position').GetName()]. Nhà chiêm tinh sẽ dự đoán xác suất hai mùa kế tiếp của một vùng.\n\nNhờ đó, ngài quyết định nên an cư hay [migrate|E] sang vùng lân cận.\n\nCàng ở lâu nơi đất phì nhiêu, [herd|E] càng lớn và dân chúng càng an lạc."

  ra_great_steppe_4: "$reactive_advice_great_steppe$"
  ra_great_steppe_4_desc: "Để xem các Du mục khác trong [the_great_steppe|E], ngài có thể quan sát ở phần dưới giao diện. Kẻ có [herd|E] lớn nhất mang danh [gurkhan|E], sức mạnh đàn của họ có thể là đại họa hoặc đại phúc.\n\nNếu ngài giữ danh hiệu này, ngài có thể nâng [dominance|E] lên cấp cuối: Unrestricted Dominance.\n\nSức mạnh đàn sẽ được dùng trong chiến tranh dưới dạng [horde|E]. Horde là phần chiến lực gồm ngựa, lạc đà và chiến binh, còn lại là gia súc và dân chúng không chiến đấu."

  ra_great_steppe_5: "$reactive_advice_great_steppe$"
  ra_great_steppe_5_desc: "Để xem các khu vực khác, ngài có thể nhấp vào chúng trong chế độ xem này, nhưng khu vực đang ảnh hưởng đến ngài là khu vực ngài hiện đang ở. \n\n Giờ đây, ngài đã sẵn sàng dẫn dắt đàn gia súc của mình trong cả những lúc sung túc và khó khăn chưa? Tìm kiếm vùng đất mới thông qua [war|E] hoặc [migrating|E] luôn là một lựa chọn cho một [ruler|E] [GetGovernment( 'nomad_government' ).GetName] mạnh mẽ để chỉ cho người dân của mình con đường đến những vùng đất trù phú, Quả táo Vàng của thảo nguyên."


  reactive_advice_kurultai: "Hội nghị Kurultai"

  action_reactive_advice_kurultai: "Lời khuyên: $reactive_advice_kurultai$"
  action_reactive_advice_kurultai_desc: "Hãy mở ra để tìm hiểu về Hội đồng Du mục, Kurultai."
  action_reactive_advice_kurultai_click: "$click_to_open_lesson$"

  ra_kurultai_1: "$reactive_advice_kurultai$"
  ra_kurultai_1_desc: "Ngài có một [kurultai|E] [council|E] với tư cách một vị quân chủ nơi [the_great_steppe|E]. \n\nCó lẽ ngài đã quen với việc có một Hội đồng, nhưng khi trị vì với tư cách [nomad|E], ngài sẽ có một loại quan lại mới, tập trung nhiều hơn vào việc hỗ trợ sự tăng trưởng [county_fertility|E] hoặc [herd|E] của ngài."
  ra_kurultai_1_prompt: "Nhấn vào Bảng Hội đồng để tiếp tục (đã được làm nổi bật)"

  ra_kurultai_1b: "$ra_kurultai_1$"

  ra_kurultai_2: "$reactive_advice_kurultai$"
  ra_kurultai_2_desc: "Ngài có thể có tối đa 4 thành viên [kurultai|E] trong [council|E], cùng với [spouse|E] và [spymaster|E]. Kurultai có thể đảm nhiệm nhiều nhiệm vụ khác nhau gắn với các [skills|E], ví dụ như Quản lý Độ Phì Nhiêu sẽ dựa trên chỉ số [stewardship|E] của kurultai. Nếu đã phân công kurultai, ngài có thể nhấn nút ở góc dưới bên trái để thay đổi nhiệm vụ."

  ra_kurultai_3: "$reactive_advice_kurultai$"
  ra_kurultai_3_desc: "Các thành viên [kurultai|E] sẽ thực thi nhiệm vụ được giao, nhưng ảnh hưởng lớn nhất của họ nằm ở [succession|E] của [realm|E] ngài.\n\nMỗi nhân vật trong [the_great_steppe|E] có thể [obedient|E] với một [ruler|E], và sự phục tùng này đặc biệt quan trọng đối với các thành viên kurultai, vì nó quyết định tiếng nói của họ trong việc chọn [heir|E]."
  ra_kurultai_3_prompt: "Nhấn vào tab lãnh thổ để tiếp tục (đã được làm nổi bật)"

  ra_kurultai_4: "$reactive_advice_kurultai$"
  ra_kurultai_4_desc: "Ở phía trên của bảng này, ngài có thể thấy liệu [succession|E] đang ổn định hay hỗn loạn. Đây là dấu hiệu cho biết [heir|E] của ngài sẽ thừa kế toàn bộ [realm|E] hay sẽ bị chia cắt cho các nhân vật quyền lực khác."
  ra_kurultai_4_prompt: "Nhấn vào tab kế vị để tiếp tục (đã được làm nổi bật)"

  ra_kurultai_5: "$reactive_advice_kurultai$"
  ra_kurultai_5_desc: "Trên thanh được làm nổi bật, ngài sẽ thấy dấu hiệu cho biết liệu [kurultai|E] và các con trưởng của ngài có chấp thuận hay phản đối [succession|E] hay không.\n\nĐể đạt đến trạng thái kế vị ổn định, ngài cần giữ cho kurultai [obedient|E], đồng thời phải để các [steppe_seasons|E] thuận lợi cho mình. Nếu mùa hiện tại gây bất lợi cho vùng đất, như Zud chẳng hạn, dân chúng sẽ cho rằng ngài bị trời phạt và sẽ nghi ngờ quyền trị vì cũng như quyết định người kế vị.\n\nĐể duy trì quyền kiểm soát kế vị, hãy giữ dân chúng phục tùng và [migrate|E] đến những vùng đất thuận lợi cho ngài."


# tributaries
  reactive_advice_tributaries: "Chư hầu triều cống"

  action_reactive_advice_tributaries: "Lời khuyên: $reactive_advice_tributaries$"
  action_reactive_advice_tributaries_desc: "Chư hầu triều cống là một loại Thuộc quốc mà một Vị quân chủ có thể sở hữu. Hãy mở ra để tìm hiểu giới thiệu về Chư hầu triều cống."
  action_reactive_advice_tributaries_click: "$click_to_open_lesson$"

  ra_tributaries_1: "$reactive_advice_tributaries$"
  ra_tributaries_1_desc: "[tributaries|E] là một loại [subject|E], một dạng quan hệ giữa hai [rulers|e] trong đó một thỏa ước [truce|E] được thiết lập để đổi lấy khoản cống nạp định kỳ. Khi giao ước được lập, chư hầu sẽ cống nạp [herd|E], [taxes|E] hoặc [prestige|E] cho bên kia, tức [suzerain|E] của họ."
  ra_tributaries_1_prompt: "Nhấn vào bảng Lãnh thổ để tiếp tục (đã được làm nổi bật)"

  ra_tributaries_2: "$reactive_advice_tributaries$"
  ra_tributaries_2_desc: "So với loại [subject|E] thông thường là [vassals|E], các [tributaries|E] có phần tự do hơn khỏi [suzerain|E] của mình. Họ có thể thoát ly nếu điều kiện về một người lãnh đạo không được đáp ứng, và tự tìm vận mệnh khác."
  ra_tributaries_2_prompt: "Nhấn vào tab Thuộc quốc để tiếp tục (đã được làm nổi bật)"

  ra_tributaries_3: "$reactive_advice_tributaries$"
  ra_tributaries_3_desc: "Tất cả các loại [subjects|E] sẽ được hiển thị trong bảng lãnh thổ. Trong danh sách Thuộc quốc, ngài sẽ thấy xác suất [tributaries|E] muốn ly khai, cùng một [tributary_contract|E] đặc biệt nơi ngài với tư cách [suzerain|E] có thể điều chỉnh mức cống nạp, hoặc mức hỗ trợ chiến tranh mà hai bên sẽ nhận trong các xung đột sắp tới."

  ra_tributaries_4: "$reactive_advice_tributaries$"
  ra_tributaries_4_desc: "Vì [migration|E] là hành động phổ biến của các [nomads|E], việc rời xa lãnh thổ của các [tributaries|E] sẽ ảnh hưởng lớn đến mức độ trung thành của họ. Nếu họ không còn chứng kiến sự vĩ đại của ngài, họ sẽ sớm tìm kiếm sự bảo hộ và hòa ước với các [rulers|e] lân cận."

  ra_tributaries_5: "$reactive_advice_tributaries$"
  ra_tributaries_5_desc: "Nếu chính ngài mang vai trò [tributary|E], điều đó có thể giúp ngài phát triển [herd|E] trong hòa bình dưới sự bảo hộ của một [suzerain|E] mạnh hơn. Nhưng quyền lực có thể đổi thay rất nhanh nơi [the_great_steppe|E]; vì vậy hãy bảo đảm rằng ngài và những người được xem là đồng minh hỗ trợ lẫn nhau khi cần thiết để trưởng thành, nhưng cũng đừng ngần ngại phá vỡ ràng buộc và theo về phía một Khan vĩ đại hơn khi thời cuộc đòi hỏi."

  reactive_advice_meritocratic_governor: "Thống đốc"

  action_reactive_advice_meritocratic_governor: "Lời khuyên: $reactive_advice_meritocratic_governor$"
  action_reactive_advice_meritocratic_governor_desc: "Là một $game_concept_governor$, ngài có quyền năng đặc biệt, nhưng cũng mang trách nhiệm tương ứng. Hãy mở ra để tìm hiểu về việc làm một $game_concept_governor$."
  action_reactive_advice_meritocratic_governor_click: "$click_to_open_lesson$"

  ra_merit_governor_intro: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_intro_desc: "Ngài là một [governor|E]!\n\nVới tư cách một viên chức được trọng dụng, ngài có quyền tiếp cận các nguồn lực của triều đình, nhưng phải sử dụng chúng một cách đúng đắn."
  ra_merit_governor_advancing: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_advancing_desc: "Mỗi [governor|E] cai quản một [province|E] thuộc một [title_tier|E] nhất định.\n\nTừ thấp đến cao, bao gồm:\n$EFFECT_LIST_BULLET$$county_celestial_chinese_vassal$ #weak (một [county|E])#!\n$EFFECT_LIST_BULLET$$duchy_celestial_chinese_vassal$ #weak (một [duchy|E])#!\n$EFFECT_LIST_BULLET$$kingdom_celestial_chinese_vassal$ #weak (một [kingdom|E])#!\n\nĐể thăng tiến trong hệ thống và đạt đến $game_concept_title_tier$ cao hơn, ngài phải tăng [merit_level|E] bằng cách tích lũy [merit|E], và cuối cùng là lui về để hoàn thành [imperial_examinations|E]."
  ra_merit_governor_treasury_1: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_treasury_1_desc: "$ra_treasury_1_desc$"
  ra_merit_governor_treasury_2: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_treasury_2_desc: "$ra_treasury_2_desc$"
  ra_merit_governor_treasury_3: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_treasury_3_desc: "$ra_treasury_3_desc$"
  ra_merit_governor_realm_open: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_realm_open_desc: "Vậy, với quyền truy cập vào [treasury|E], việc sử dụng nó một cách hợp lý là điều nên làm.\n\nLà một [governor|E], ngài cai trị đất đai và dân chúng trong [province|E] của mình. Việc dùng $game_concept_treasury$ để đầu tư vào đó là một lựa chọn tốt."
  ra_merit_governor_realm_open_prompt: "Mở bảng 'Lãnh thổ' để tiếp tục"
  ra_merit_governor_domain_tab_open: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_domain_tab_open_desc: "Các [holdings|E] do ngài cai trị được liệt kê trong tab 'Lãnh thổ'."
  ra_merit_governor_domain_tab_open_prompt: "Mở tab 'Lãnh thổ'"
  ra_merit_governor_holdings_list: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_holdings_list_desc: "Tại đây ngài có thể thấy mọi [holding|E] mà ngài cai quản, còn gọi là [domain|E] của ngài.\n\nMỗi [holding|E] là một trung tâm nơi thu [taxes|E] và tuyển [levy|E]."
  ra_merit_governor_holdings_list_prompt: "Chọn một $game_concept_holdings$ của ngài"
  ra_merit_governor_holding_view: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_holding_view_desc: "Đây là các ô nơi có thể xây dựng [buildings|E] trong [holding|E] đã chọn.\n\nVì các $game_concept_buildings$ này thuộc về [province|E], ngài phải dùng [treasury|E] để xây dựng, không phải [gold|E] cá nhân.\n\nViệc xây dựng $game_concept_buildings$ với tư cách [governor|E] sẽ mang lại [merit|E], giúp ngài dần cai quản các [province|E] thuộc [title_tier|E] cao hơn.\n\n#I Ngài có thể bắt đầu xây dựng trước khi tiếp tục.#!"
  ra_merit_governor_activities_open: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_activities_open_desc: "Là một [governor|E], một cách khác để sử dụng [treasury|E] là thực hiện $activity_survey|V$ [activity|E]."
  ra_merit_governor_activities_open_prompt: "Mở bảng 'Hoạt động'"
  ra_merit_governor_inspection: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_inspection_desc: "$activity_survey|V$ [activity|E] sẽ trừ từ [treasury|E] của [province|E], nhưng đồng thời cải thiện $game_concept_province$ và cho ngài cơ hội nhận [merit|E]."
  ra_merit_governor_advancing_retire: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_advancing_retire_desc: "Dù ngài tích lũy bao nhiêu [merit|E], để mở khóa [merit_levels|E] cao hơn ngài vẫn phải hoàn thành [imperial_examinations|E].\n\nTuy nhiên, [governors|E] không được phép tham gia [imperial_examinations|E].\n\nVì vậy, khi đạt mức [merit_level|E] tối đa hiện tại, việc lui về và tham gia $game_concept_examinations$ là cách duy nhất để thăng lên [title_tier|E] cao hơn.\n\n#I Ngài có thể từ nhiệm $game_concept_governor$ bằng quyết định $renounce_governorship_decision|V$ trong bảng '$DECISIONS_VIEW_TITLE$'."
  ra_merit_governor_finish: "$reactive_advice_meritocratic_governor$"
  ra_merit_governor_finish_desc: "Đó là tất cả về việc làm [governor|E], hiện tại. Sẽ có thêm lời khuyên khi ngài gặp các tình huống cụ thể hơn.\n\nViệc xây dựng [buildings|E] trong [holdings|E] của [province|E] và thực hiện $activity_survey|V$ [activity|E] là khởi đầu tốt để tích lũy [merit|E]."

  reactive_advice_treasury: "$game_concept_treasury$"

  action_reactive_advice_treasury: "Lời khuyên: $ra_treasury_1$"
  action_reactive_advice_treasury_desc: "Kho bạc đại diện cho số tiền mà ngài có quyền sử dụng với tư cách là một $game_concept_governor$ hoặc $game_concept_hegemon$. Hãy mở ra để tìm hiểu cách thức hoạt động của Kho bạc."
  action_reactive_advice_treasury_click: "$click_to_open_lesson$"
 
  ra_treasury_1: "$reactive_advice_treasury$"
  ra_treasury_1_desc: "Trong [realm|E] này, [top_liege|E] và mỗi [governor|E] đều có một [treasury_i] [treasury|E].\n\nTrong khi [gold|E] là tài sản cá nhân của ngài, $game_concept_treasury$ chỉ được dùng cho mục đích chính quyền (ví dụ như cải thiện [province|E] nếu ngài là $game_concept_governor$).\n\n$game_concept_treasury$ gắn với [title|E] hiện tại của ngài, vì vậy nếu vị trí của ngài trong [realm|E] thay đổi, ngài sẽ không còn quyền truy cập vào $game_concept_treasury$ cũ nữa."
  ra_treasury_2: "$ra_treasury_1$"
  ra_treasury_2_desc: "Ngài có thể tự nguyện đóng góp [gold|E] của mình để bổ sung cho [treasury|E] nếu nó đang cạn kiệt.\n\nHãy lưu ý rằng không có cách hợp pháp nào để lấy lại số $game_concept_gold$ đã đóng góp!\n\n#I Nếu ngài muốn thực hiện điều này, hãy sử dụng nút được đánh dấu#!"
  ra_treasury_3: "$ra_treasury_1$"
  ra_treasury_3_desc: "Nếu [gold|E] của ngài đang cạn kiệt, ngài có thể sử dụng $celestial_siphon_treasury_interaction_without_scheme_suffix|V$ [scheme|E] lên chính mình hoặc bất kỳ [governor|E] nào trong [realm|E]. Việc này sẽ chuyển đổi [treasury|E] của mục tiêu thành $game_concept_gold$ của ngài.\n\nTuy nhiên, ngài sẽ không muốn bị phát hiện khi biển thủ ngân khố triều đình..."

 #dynastic cycle
  reactive_advice_dynastic_cycle: "$game_concept_dynastic_cycle$"

  action_reactive_advice_dynastic_cycle: "Lời khuyên: $game_concept_dynastic_cycle$"
  action_reactive_advice_dynastic_cycle_desc: "$game_concept_dynastic_cycle$ là chu kỳ hưng thịnh và suy vong của các triều đại Trung Hoa, cùng với tầm nhìn của họ về Đế quốc."
  action_reactive_advice_dynastic_cycle_click: "$click_to_open_lesson$"

  ra_dynastic_cycle_intro: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_era_effects: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_era_open_groups: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_era_open_eras: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_era_groups: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_era_group_leader: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_era_actions: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_intro_desc: "#F Thiên hạ đại thế, lâu phân tất hợp; lâu hợp tất phân. Đó vốn là lẽ thường.\n\n — #italic La Quán Trung\nTam Quốc Diễn Nghĩa#!#!\n\nTrung Hoa trong lịch sử đã từng được cai trị bởi nhiều [dynasties|E] khác nhau, xen kẽ bởi các thời kỳ chiến tranh và chia cắt.\n\n[dynastic_cycle|E] đại diện cho quá trình này, cũng như cuộc đấu tranh ảnh hưởng và cải cách trong nội bộ đế quốc."
  ra_dynastic_cycle_open: "$game_concept_dynastic_cycle$"
  ra_dynastic_cycle_open_desc: "[dynastic_cycle|E] là một [situation|E] liên quan đến tất cả các [rulers|e] trong và xung quanh Trung Hoa.\n\nHãy cùng xem qua ngay bây giờ."
  ra_dynastic_cycle_open_trigger: "Mở giao diện $game_concept_dynastic_cycle$"
  ra_dynastic_cycle_era_open_eras_desc: "Trước tiên, hãy xem [dynastic_cycle_era_short|e] mà Chu kỳ Triều đại đang ở."
  ra_dynastic_cycle_era_open_eras_trigger: "Mở tab '$dynastic_cycle_tab_dynastic_cycle$'"
  ra_dynastic_cycle_era_effects_desc: "Trung Hoa hiện đang ở một [dynastic_cycle_era_short|e] của Giai đoạn Phát triển.\n\nNếu ngài là một quan chức cấp thấp, điều quan trọng nhất cần hiểu là nó ảnh hưởng đến ngài như thế nào, được thể hiện tại đây.\n\nCó nhiều $game_concept_dynastic_cycle_eras_short$ khác nhau, mỗi loại sẽ định hướng Trung Hoa theo một con đường khác nhau."
  ra_dynastic_cycle_era_open_groups_desc: "Quốc gia không thể tự thay đổi, mà bị ảnh hưởng bởi các nhóm quyền lực của [characters|E] bên trong biên giới Trung Hoa. Hãy cùng xem các $game_concept_characters$ này."
  ra_dynastic_cycle_era_open_groups_trigger: "Mở tab '$dynastic_cycle_tab_movements$'"
  ra_dynastic_cycle_era_groups_desc: "Nhiều [characters|E] trong và xung quanh Trung Hoa có ảnh hưởng đến tương lai của nó. Những $game_concept_characters$ này thuộc về các [movements|e], mỗi nhóm muốn định hướng Trung Hoa theo một con đường khác nhau.\n\nVí dụ, $dynastic_cycle_participant_group_advancement_movement|V$ muốn cải cách đế quốc theo hướng nội trị thông qua Giai đoạn Phát triển, trong khi $dynastic_cycle_participant_group_expansion_movement|V$ lại muốn mở rộng lãnh thổ bằng sức mạnh quân sự qua Giai đoạn Mở rộng."

  ra_dynastic_cycle_era_group_leader_desc: "Mỗi [movement|E] có một [movement_leader|E], người có thể đưa ra kiến nghị để thúc đẩy mục tiêu của $game_concept_movement$.\n\nĐể trở thành $game_concept_movement_leader$, ngài cần có [movement_power|E] cao nhất trong $game_concept_movement$ của mình."

  ra_dynastic_cycle_era_actions_desc: "Ngài cũng có thể thực hiện các Hành động để ảnh hưởng đến [dynastic_cycle|e], một mình hoặc thông qua [movement|e] của mình.\n\nCác hành động này nằm ở cuối cửa sổ.\n\nNếu ngài vẫn thuộc nhóm $dynastic_cycle_participant_group_undecided_movement|V$, hãy tham gia một $game_concept_movement$."

 # merit candidacy

  reactive_advice_merit_candidacy: "Ứng viên Thống đốc"



  action_reactive_advice_merit_candidacy: "Lời khuyên: $reactive_advice_merit_candidacy$"
  action_reactive_advice_merit_candidacy_desc: "Hãy cùng xem cần những gì để trở thành một $game_concept_governor$."
  action_reactive_advice_merit_candidacy_click: "$click_to_open_lesson$"

  ra_merit_candidacy_intro: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_intro_desc: "Chỉ những người có [merit_level|E] cao nhất mới có thể trở thành [governors|E].\n\nMỗi khi một $game_concept_governor$ rời khỏi chức vụ, sẽ có người khác tự động được bổ nhiệm thay thế.\n\nVì vậy, chỉ cần có $game_concept_merit_level$ tốt, ngài sẽ sớm được bổ nhiệm làm [governor|E], nếu [law|e] của [realm|e] cho phép."
  ra_merit_candidacy_open: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_open_desc: "Hãy xem xét sự tiến triển của ngài và [house|E] trong bộ máy quan liêu!"
  ra_merit_candidacy_open_prompt: "Mở bảng '$ADMINISTRATIVE_GOVERNMENT_HEADER$' (được đánh dấu)"
  ra_merit_candidacy_house_members: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_house_members_desc: "Danh sách này cho thấy mức độ tiến bộ của từng thành viên trong [house|E] của ngài trong hệ thống quan liêu.\n\nVì bản thân ngài chỉ có thể làm [governor|E] của một [province|E], việc hỗ trợ họ hàng trong sự nghiệp cũng rất quan trọng."
  ra_merit_candidacy_merit: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_merit_desc: "Mỗi [character|E] có một [merit_level|E]. $game_concept_merit_level$ càng tốt, thì [title_tier|E] [provinces|E] mà họ có thể cai trị với tư cách là [governor|E] càng cao.\n\nKhi $game_concept_merit_level$ của ngài tăng lên, các cuộc bổ nhiệm có tầm ảnh hưởng hơn sẽ khả dụng:\n$BULLET_WITH_TAB$#V Thứ 9 đến thứ 8#!: $game_concept_governor$ của một $county_celestial_chinese_vassal$ #weak (một Tước vị [county|E])#!\n$BULLET_WITH_TAB$#V Thứ 7 đến thứ 6#!: $game_concept_governor$ của một $duchy_celestial_chinese_vassal$ #weak (một Tước vị [duchy|E])#!\n$BULLET_WITH_TAB$#V Thứ 5 đến thứ 4#!: $game_concept_governor$ của một $kingdom_celestial_chinese_vassal$ #weak (một Tước vị [kingdom|E])#!\n$BULLET_WITH_TAB$#V Thứ 3 đến thứ 1#!: [minister|E] cho [son_of_heaven|E] #weak (một Tước vị [empire|E])#!\n\nCác $game_concept_characters$ không có $game_concept_merit_level$ không thể trở thành $game_concept_governor$."
  ra_merit_candidacy_score: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_score_desc: "Dù [merit_level|E] rất quan trọng, nếu hai ứng viên có cùng [merit_level|E], người có @appointment_score![candidate_score|E] cao hơn sẽ được nhận [province|E] trước.\n\nVì vậy, tăng $game_concept_candidate_score$ sẽ giúp ngài không phải chờ lâu để trở thành [governor|E].\n\nĐể tăng $game_concept_candidate_score$ của một thành viên [house|E], ngài có thể dùng [influence_i][influence|E] qua $influence_meritorious_career_interaction|V$, hoặc bắt đầu một $promote|V$ [scheme|E] #weak (cả hai đều được đánh dấu).#!"
  ra_merit_candidacy_exams: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_exams_desc: "Mỗi lần hoàn thành [imperial_examination|E] sẽ tăng [merit|E] và mở khóa các [merit_levels|E] cao hơn.\n\nCác thành viên $game_concept_house$ khác sẽ tham gia cùng ngài nếu đi thi $game_concept_examinations$, và cố gắng hoàn thành nó.\n\nVì vậy, việc quay lại một $game_concept_examination$ đã từng hoàn thành vẫn mang lại lợi ích cho nhiều người."
  ra_merit_candidacy_child_exams: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_child_exams_desc: "Nếu có thành viên [house|E] còn là [children|E], ngài cũng có thể hỗ trợ sự nghiệp của họ bằng cách gửi họ tham gia @child_exam_icon!#V Kỳ thi Nhi đồng#!.\n\nNếu họ thành công, quá trình tiến tới các $game_concept_examinations$ sẽ nhanh hơn."
  ra_merit_candidacy_summary: "$reactive_advice_merit_candidacy$"
  ra_merit_candidacy_summary_desc: "Bằng cách đảm bảo rằng ngài có [merit_level|E] ngày càng tốt hơn, bằng cách tham dự các [imperial_examinations|E] và cai trị [province|E] của mình thật tốt, ngài sẽ thăng tiến lên đỉnh cao của bộ máy quan liêu.\n\nỞ đỉnh cao của hệ thống phân cấp, ngài thậm chí có thể được bổ nhiệm làm [minister|E], phục vụ trực tiếp [son_of_heaven|E]!"
 
  action_reactive_advice_great_projects: "Lời khuyên: Công trình Vĩ đại"
  reactive_advice_great_projects: "$action_reactive_advice_great_projects$"
