  action_reactive_advice_artifact_inventory:0 "$open_tutorial_lesson$$ra_artifact_inventory_general$"
  action_reactive_advice_artifact_inventory_desc:0 "Mở mục này để tìm hiểu về Di Vật trong Túi Đồ"
  action_reactive_advice_artifact_inventory_click:0 "$click_to_open_lesson$"
  reactive_advice_artifact_inventory: "$ra_artifact_inventory_general$"

  ra_artifact_inventory_general:0 "Túi Đồ"
  ra_artifact_inventory_general_desc:0 "Ngài đã nhận được [inventory_artifact|E] đầu tiên của mình. Những [artifacts|E] này được mang theo bên người và mang lại nhiều lợi ích khác nhau."
  ra_artifact_inventory_open_step:0 "$ra_artifact_inventory_general$"
  ra_artifact_inventory_open_step_desc:0 "[inventory_artifacts|E] được lưu trữ trong Túi Đồ của Ngài, hãy mở nó ra ngay bây giờ."
  ra_artifact_inventory_open_step_open:0 "Mở Túi Đồ (được đánh dấu)"
  ra_artifact_inventory_welcome:0 "$ra_artifact_inventory_general$"
  ra_artifact_inventory_welcome_desc:0 "Trong Túi Đồ, Ngài có thể trang bị [inventory_artifacts|E] để nhận được nhiều lợi ích khác nhau, chẳng hạn như tăng một [skill|E] nhất định hoặc tăng [prestige|E] của Ngài.\n\nNgài cũng có thể [repair|E] hoặc [reforge|E] [inventory_artifacts|E], giúp khôi phục [durability|E] của chúng và ngăn chúng bị phá hủy theo thời gian.\n\nNgoài ra, Ngài còn có thể xem những [artifact_claims|E] mà mình đang có, và tìm cách chiếm lấy các [artifacts|E] đó cho riêng mình!"
 
 # Station Men-at-Arms
  ra_maa_stationing_open_card_step:0 "Đồn Trú Quân Chính Quy"
  ra_maa_stationing_open_card_step_desc:0 "Ngài đang có [men_at_arms|E] chưa được [stationed|E].\n\nViệc đồn trú các [regiments|E] sẽ khiến chúng mạnh hơn và chiến đấu hiệu quả hơn, điều này có thể mang tính sống còn để giành chiến thắng trong các [battles|E].\n\nHãy đồn trú một Trung Đoàn ngay bây giờ!"
  ra_maa_stationing_open_card_step_tt:0 "Nhấp vào một đơn vị Quân Chính Quy có dòng chữ '#X $MAA_UNSTATIONED$#!' (được đánh dấu)"
  ra_maa_stationing_click_station_button:0 "$ra_maa_stationing_open_card_step$"
  ra_maa_stationing_click_station_button_desc:0 "Ngài có thể đồn trú một [regiment|E] [men_at_arms|E] cho mỗi [holding|E] trong [domain|E] của mình.\n\nMọi Holding đều có thể dùng cho tất cả các loại Trung Đoàn, nhưng một số sẽ mang lại hiệu quả cao hơn những cái khác.\n\nHãy chọn một Holding để đồn trú Trung Đoàn này."
  ra_maa_stationing_click_station_button_tt:0 "Nhấp vào nút 'Thay đổi Holding Đồn Trú' (được đánh dấu)"
  ra_maa_stationing_select_station:0 "$ra_maa_stationing_open_card_step$"
  ra_maa_stationing_select_station_desc:0 "Các [holdings|E] khác nhau sẽ mang lại mức thưởng khác nhau tùy theo các [buildings|E] mà Ngài xây dựng.\n\nTrong giao diện này, Ngài có thể thấy chính xác Trung Đoàn [men_at_arms|E] sẽ mạnh hơn bao nhiêu nếu được đồn trú tại một Holding cụ thể.\n\nHãy nhấp vào một Holding #P màu xanh#! trên bản đồ mà Ngài cho là mang lại lợi ích tốt nhất cho Trung Đoàn."
  ra_maa_stationing_select_station_tt:0 "Nhấp vào bất kỳ Holding #P màu xanh#! nào trên bản đồ"
  ra_maa_stationing_finished:0 "$ra_maa_stationing_open_card_step$"
  ra_maa_stationing_finished_desc:0 "Trung Đoàn [men_at_arms|E] hiện đã được [stationed|E]. Ngài có thể thấy mức cải thiện của nó ngay bên dưới chân dung (phần được đánh dấu).\n\nHãy nhớ kiểm tra định kỳ để đảm bảo các Trung Đoàn của Ngài luôn được đồn trú tại những [holdings|E] tối ưu nhất.\n\nĐiều này đặc biệt quan trọng khi Ngài chinh phục hoặc thừa kế lãnh thổ mới, hoặc khi Ngài quyết định chuyên môn hóa một Holding bằng các [buildings|E] như [GetBuilding('smiths_01').GetName] hoặc [GetBuilding('stables_01').GetName]."
  reactive_advice_station_maa: "$ra_maa_stationing_open_card_step$"


# Tours
  REACTIVE_ADVICE_TOURS:0 "Chuyến Du Hành"

  action_reactive_advice_tours_picking_vassals:0 "$open_tutorial_lesson$$REACTIVE_ADVICE_TOURS$"
  action_reactive_advice_tours_picking_vassals_desc:0 "Ngài đang lên kế hoạch chọn những chư hầu sẽ ghé thăm trong Đại Du Hành. Mở mục này để tìm hiểu thêm về cách lập kế hoạch Chuyến Du Hành."
  action_reactive_advice_tours_picking_vassals_click:0 "$click_to_open_lesson$"

  reactive_advice_tours_picking_vassals:0 "$REACTIVE_ADVICE_TOURS$"
  ra_tours_picking_vassals_intro:0 "$REACTIVE_ADVICE_TOURS$"
  ra_tours_picking_vassals_intro_desc:0 "Ngài sắp bắt đầu một [GetActivityType( 'activity_tour' ).GetName()] trong [realm|E] của mình.\n\nTrong chuyến đi, Ngài sẽ [travel|E] để thăm các [vassals|E], đầu tư [gold|E] để nhận được phần thưởng như [county_control|E], [opinion|E], [cultural_acceptance|E], và nhiều hơn nữa!"

  ra_tours_picking_vassals_add:0 "$REACTIVE_ADVICE_TOURS$"
  ra_tours_picking_vassals_add_desc:0 "Trước tiên, Ngài cần chọn những [vassals|E] sẽ ghé thăm.\n\nViệc chọn ai phụ thuộc vào loại [GetActivityType( 'activity_tour' ).GetName()]. Ví dụ, trong [majesty_tour|E], mỗi [stop|E] sẽ tăng [opinion|E] của chư hầu đó, nên Ngài có thể chọn những người có thiện cảm thấp với mình.\n\nDi chuyển xa giữa các điểm dừng sẽ làm tăng chi phí [gold|E] cho mỗi điểm dừng."
  ra_tours_picking_vassals_add_prompt:0 "Thêm ít nhất một chư hầu để ghé thăm bằng cách nhấp vào bản đồ"

  ra_tours_picking_vassals_stops:0 "$REACTIVE_ADVICE_TOURS$"
  ra_tours_picking_vassals_stops_desc:0 "Ở mỗi [stop|E] trong chuyến đi, Ngài có thể:\n$BULLET_WITH_TAB$[tour_the_grounds|E], tăng [county_control|E]\n$BULLET_WITH_TAB$Yêu cầu một [hosted_dinner|E], tạo [hooks|E] và [relations|E]\n$BULLET_WITH_TAB$Yêu cầu [vassal|E] tổ chức [cultural_festival|E], tăng [county_opinion|E] và [cultural_acceptance|E]"

  ra_tours_picking_vassals_conclusion:0 "$REACTIVE_ADVICE_TOURS$"
  ra_tours_picking_vassals_conclusion_desc:0 "Khi Ngài đã hài lòng với các [stops|E] và thứ tự của chúng, Ngài có thể chuyển sang bước lập kế hoạch tiếp theo."

# Active Regency Liege Side
  REACTIVE_ADVICE_REGENCY_TERM:0 "Nhiếp Chính"
  REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT:0 "Mở giao diện Nhiếp Chính (được đánh dấu)"
  REACTIVE_ADVICE_YOU_REGENCY_REASONS:0 "Một [regency|E] có thể xảy ra vì nhiều lý do, bao gồm:\n$BULLET_WITH_TAB$Khi Ngài [travel|E] ra ngoài [realm|E]\n$BULLET_WITH_TAB$Khi Ngài là [child|E]\n$BULLET_WITH_TAB$Khi Ngài trở thành [GetTrait('incapable').GetName( GetPlayer )]"

  reactive_advice_regency_for_liege:0 "$action_reactive_advice_regency_for_liege$"
  action_reactive_advice_regency_for_liege:0 "$open_tutorial_lesson$$REACTIVE_ADVICE_REGENCY_TERM$"
  action_reactive_advice_regency_for_liege_desc:0 "Ngài hiện có một Nhiếp Chính. Mở mục này để xem giới thiệu về cơ chế Nhiếp Chính."
  action_reactive_advice_regency_for_liege_click:0 "$click_to_open_lesson$"

  ra_regency_liege_intro:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_intro_desc:0 "Ngài hiện có một [regent|E].\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$"

  ra_regency_liege_effects:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_effects_desc:0 "Trong thời kỳ [regency|E], Ngài vẫn có thể thực hiện mọi hành động như bình thường.\n\nTuy nhiên, [regent|E] sẽ có các [diarch_powers|E] đặc biệt có thể dùng lên Ngài hoặc các [vassals|E] của Ngài. Ngài luôn có quyền [veto|E] đối với các $game_concept_diarch_powers$ này."

  ra_regency_liege_open_UI:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_open_UI_desc:0 "Giờ hãy xem qua giao diện [regency|E] của Ngài!"
  ra_regency_liege_open_UI_prompt:0 "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"

  ra_regency_liege_open_tab:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_open_tab_desc:0 "[regent|E] của Ngài được hiển thị trong tab '$DIARCHY_WINDOW_YOUR_TAB$'."
  ra_regency_liege_open_tab_prompt:0 "Mở tab '$DIARCHY_WINDOW_YOUR_TAB$' (được đánh dấu)"

  ra_regency_liege_scales_of_power:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_scales_of_power_desc:0 "Đây là [scales_of_power|E].\n\nCán cân càng nghiêng về phía [regent|E], họ sẽ có quyền truy cập vào nhiều [diarch_powers|E] hơn, và việc chấm dứt [regency|E] sẽ càng khó.\n\nNgài có thể trực tiếp kéo cán cân về phía mình bằng nút '$DIARCHY_WINDOW_SWING_SCALES$'."

  ra_regency_liege_mandate:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_mandate_desc:0 "Ngài có thể giao cho [regent|E] một [mandate|E], giúp họ tập trung vào lĩnh vực đó.\n\nNgài luôn có thể thay đổi Nhiệm vụ này sau tùy theo ưu tiên của mình."

  ra_regency_liege_ending:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_ending_desc:0 "Nếu các điều kiện dẫn đến [regency|E] không còn, Ngài có thể thử chấm dứt nó.\n\n[regent|E] phải chấp nhận điều này, nhưng Ngài có thể đưa cho họ những thứ như [gold|E] hoặc [favor|E] để tăng khả năng đồng ý.\n\nNếu họ từ chối, họ có thể tuyên [war|E] với Ngài!"

  ra_regency_liege_conclusion:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_liege_conclusion_desc:0 "Nhiếp Chính chủ yếu là một cơ chế mang tính phản ứng. Hiện tại, hãy chú ý đến [scales_of_power|E].\n\nKhi [regent|E] sử dụng một trong các [diarch_powers|E], Ngài sẽ biết và có thể quyết định cách xử lý."


# Active Regency Regent Side
  reactive_advice_regency_for_regent:0 "$action_reactive_advice_regency_for_regent$"
  action_reactive_advice_regency_for_regent:0 "$open_tutorial_lesson$Nhiếp Chính"
  action_reactive_advice_regency_for_regent_desc:0 "Ngài hiện đang giữ vai trò Nhiếp Chính cho Lãnh chúa của mình. Mở mục này để tìm hiểu về cơ chế Nhiếp Chính."
  action_reactive_advice_regency_for_regent_click:0 "$click_to_open_lesson$"

  ra_regency_regent_intro:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_intro_desc:0 "Ngài đang đảm nhiệm vai trò [regent|E] cho [liege|E] của mình.\n\nMột [regency|E] có thể xảy ra vì nhiều nguyên do, bao gồm:\n$BULLET_WITH_TAB$Khi Lãnh chúa của ngài [travels|E] ra ngoài [realm|E]\n$BULLET_WITH_TAB$Khi Lãnh chúa của ngài là [child|E]\n$BULLET_WITH_TAB$Khi Lãnh chúa của ngài trở thành [GetTrait('incapable').GetName( GetPlayer )]"

  ra_regency_regent_powers:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_powers_desc:0 "Với tư cách [regent|E], ngài có các [diarch_powers|E] đặc biệt có thể sử dụng lên [liege|E] của mình hoặc các [vassals|E] khác. Lãnh chúa của ngài luôn có quyền [veto|E] đối với các $game_concept_diarch_powers$ này.\n\nViệc sử dụng những quyền lực này lên các chư hầu khác có thể bị xem là lạm quyền, khiến ngài chịu bất lợi về [opinion|E] do [strife|E]."

  ra_regency_regent_open_UI:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_open_UI_desc:0 "Giờ hãy xem qua giao diện [regency|E] của ngài!"
  ra_regency_regent_open_UI_prompt:0 "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"

  ra_regency_regent_open_tab:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_open_tab_desc:0 "Trạng thái [regent|E] của ngài được hiển thị trong tab '$DIARCHY_WINDOW_LIEGE_TAB$'."
  ra_regency_regent_open_tab_prompt:0 "Mở tab '$DIARCHY_WINDOW_LIEGE_TAB$' (được đánh dấu)"

  ra_regency_regent_scales_of_power:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_scales_of_power_desc:0 "Đây là [scales_of_power|E].\n\nCán cân càng nghiêng về phía ngài, ngài sẽ có quyền truy cập vào nhiều [diarch_powers|E] hơn, và việc chấm dứt [regency|E] sẽ càng khó khăn.\n\nNgài có thể trực tiếp kéo cán cân về phía mình bằng nút '$DIARCHY_WINDOW_SWING_SCALES$'."

  ra_regency_regent_mandate:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_mandate_desc:0 "[liege|E] của ngài có thể giao cho ngài một [mandate|E], giúp ngài có cơ hội cải thiện [realm|E].\n\nNếu xử lý tốt những cơ hội này, ngài sẽ khiến [scales_of_power|E] nghiêng về phía mình."

  ra_regency_regent_ending:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_ending_desc:0 "Nếu các điều kiện dẫn đến [regency|E] không còn, [liege|E] của ngài có thể tìm cách chấm dứt nó.\n\nNếu [scales_of_power|E] nghiêng mạnh về phía ngài, ngài thậm chí có thể chống lại việc chấm dứt Nhiếp Chính, thậm chí khơi mào một [war|E] nhằm giành [primary_title|E] của họ!"

  ra_regency_regent_conclusion:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
  ra_regency_regent_conclusion_desc:0 "Với vai trò [regent|E], ngài có thể thử sử dụng các [diarch_powers|E] lên [liege|E] hoặc các [vassals|E] khác.\n\nNếu không muốn làm phật lòng Lãnh chúa, ngài có thể đơn giản phản ứng với các cơ hội xuất hiện, và Lãnh chúa có thể ban thưởng cho lòng trung thành của ngài!"


# Prepare by setting a Regent
  REACTIVE_ADVICE_FUTURE_REGENT:0 "Nhiếp Chính Tương Lai"
  action_reactive_advice_set_future_regent:0 "$open_tutorial_lesson$$REACTIVE_ADVICE_FUTURE_REGENT$"
  action_reactive_advice_set_future_regent_desc:1 "Nếu ngài không còn khả năng cai trị, một Nhiếp Chính sẽ thay ngài điều hành. Mở mục này để tìm hiểu cách kiểm soát người sẽ trở thành Nhiếp Chính."
  action_reactive_advice_set_future_regent_click:0 "$click_to_open_lesson$"

  reactive_advice_set_future_regent:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"

  ra_regency_future_regent_intro:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_intro_desc:0 "Trong tương lai, ngài có thể không còn khả năng tự mình cai trị [realm|E], khi đó một [regency|E] sẽ bắt đầu.\n\nTrước khi điều đó xảy ra, ngài có thể xem trước [regent|E] tương lai của mình và thậm chí tự chỉ định một người!\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$"

  ra_regency_future_regent_open_realm_panel:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_open_realm_panel_desc:0 "Hãy xem trước [regency|E] tương lai của ngài! Ngài có thể xem trong giao diện Lãnh địa."
  ra_regency_future_regent_open_realm_panel_prompt:0 "Mở giao diện Lãnh địa (được đánh dấu)"

  ra_regency_future_regent_open_UI:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_open_UI_desc:1 "Trạng thái [regency|E] của ngài được hiển thị tại đây, ở phía trên giao diện Lãnh địa."
  ra_regency_future_regent_open_UI_prompt:1 "Mở giao diện Nhiếp Chính (được đánh dấu)"

  ra_regency_future_regent_open_tab:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_open_tab_desc:0 "[regent|E] tương lai của ngài được hiển thị trong tab '$DIARCHY_WINDOW_YOUR_TAB$'."
  ra_regency_future_regent_open_tab_prompt:0 "$ra_regency_liege_open_tab_prompt$"

  ra_regency_future_regent_current_regent:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_current_regent_desc:0 "[regent|E] tương lai của ngài được hiển thị tại đây.\n\nNếu ngài không chỉ định, ứng viên có [regent_succession_score|E] cao nhất sẽ được chọn."

  ra_regency_future_regent_swap_regent:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_swap_regent_desc:0 "Ngài có thể chỉ định một [regent|E] bằng cách sử dụng nút này.\n\nNgài nên cố gắng tìm một Nhiếp chính có [diarch_loyalty|E] cao và [Concept( 'diarch_aptitude', 'Aptitude' )|E] cao."

  ra_regency_future_regent_succession:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_succession_desc:0 "Nếu [regent|E] hiện tại qua đời hoặc không còn khả năng đảm nhiệm vai trò này, nhân vật tiếp theo trong thứ tự kế vị sẽ thay thế."

  ra_regency_future_regent_conclusion:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
  ra_regency_future_regent_conclusion_desc:0 "Hiện tại, hãy cân nhắc việc chỉ định một [regent|E] nếu ngài muốn kiểm soát tốt hơn người sẽ cai trị thay mình."


# Travel Planning
  REACTIVE_ADVICE_TRAVEL_PLANNING:0 "Lập kế hoạch hành trình"
  action_reactive_advice_travel_planning:0 "$open_tutorial_lesson$$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  action_reactive_advice_travel_planning_desc:0 "Ngài sắp khởi hành, hãy mở mục này để hiểu rõ hơn về cách chuẩn bị hành trình."
  action_reactive_advice_travel_planning_click:0 "$click_to_open_lesson$"

  reactive_advice_travel_planning:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"

  ra_travel_planning_intro:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  ra_travel_planning_intro_desc:0 "Ngài sắp [travel|E] rời khỏi nơi hiện tại. Trước khi lên đường, ngài nên chuẩn bị kỹ lưỡng hành trình của mình."

  ra_travel_planning_entourage:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  ra_travel_planning_entourage_desc:0 "Hiếm khi ngài [travel|E] một mình; những [characters|E] đồng hành cùng ngài chính là [entourage|E].\n\nNhững người này thường cũng sẽ theo ngài đến điểm đến."

  ra_travel_planning_speed_safety:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  ra_travel_planning_speed_safety_desc:0 "Có hai yếu tố chính cần cân nhắc khi lập kế hoạch [travel|E]: [travel_speed|E] và [travel_safety|E].\n\nTốc độ cơ bản là 100%, tốc độ cao giúp ngài đến nơi nhanh hơn.\n\nAn toàn giúp giảm thiểu các [travel_danger|E] có thể gặp trên đường. An toàn càng cao, ngài và [entourage|E] càng ít gặp rủi ro khi đi qua vùng nguy hiểm."

  ra_travel_planning_caravan_master:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  ra_travel_planning_caravan_master_desc:0 "Ngài có thể bổ nhiệm một [GetCourtPositionType('travel_leader_court_position').GetName()]; một [court_position|E] đặc biệt sẽ đồng hành cùng ngài trong mọi chuyến [travels|E].\n\nNgười này ảnh hưởng lớn đến [travel_speed|E] và [travel_safety|E], vì vậy nên có trong những hành trình dài."

  ra_travel_planning_travel_options:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  ra_travel_planning_travel_options_desc:0 "Ngài cũng có thể chọn tối đa hai [travel_options|E] cho hành trình này.\n\nCác lựa chọn này thường tiêu tốn [gold|E] và mang lại nhiều lợi ích, chủ yếu liên quan đến [travel_speed|E] và [travel_safety|E].\n\nNhiều lựa chọn giúp giảm [travel_danger|E] đối với các loại [terrain|E] cụ thể trên đường đi. Mỗi loại nguy hiểm đều được hiển thị bằng màu sắc riêng trên bản đồ, và cũng xuất hiện dưới dạng biểu tượng trên lộ trình."

  ra_travel_planning_custom_route:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  ra_travel_planning_custom_route_desc:0 "Cuối cùng, ngài có thể tự điều chỉnh lộ trình để tránh các [travel_danger|E], thay vì đi thẳng đến đích."

  ra_travel_planning_conclusion:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
  ra_travel_planning_conclusion_desc:0 "Trước khi khởi hành, hãy kiểm tra tổng thời gian di chuyển và đảm bảo rằng hành trình có ít nguy cơ [travel_danger|E].\n\nChúc ngài thượng lộ bình an!"

# Create Accolade
  REACTIVE_ADVICE_CREATE_ACCOLADE:0 "Ban tước vinh danh"

  reactive_advice_create_accolade:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"

  ra_create_accolade_knights_panel:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
  ra_create_accolade_knights_panel_desc:0 "Giờ đây, ngài có thể ban một [accolade|E] cho một [knights|E] của mình!\n\nMỗi hiệp sĩ được ban vinh danh sẽ trở thành [acclaimed_knight|E], mang lại lợi ích cho ngài và [armies|E].\n\nVinh danh này tồn tại cho đến khi bị hủy, và sẽ được truyền lại qua [accolade_succession|E]."
  ra_create_accolade_knights_panel_prompt:0 "Hãy chọn một vinh danh chưa được gán (được tô sáng)"

  ra_create_accolade_candidates:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
  ra_create_accolade_candidates_desc:0 "Khi tạo [accolade|E], ngài sẽ chọn một [knights|E] phù hợp trong danh sách."
  ra_create_accolade_candidates_prompt:0 "Hãy chọn một ứng viên trong danh sách (được tô sáng)"

  ra_create_accolade_attributes:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
  ra_create_accolade_attributes_desc:0 "Mỗi [acclaimed_knight|E] có hai [accolade_types|E] (được tô sáng), gồm một chính và một phụ.\n\nMỗi thuộc tính mang lại các lợi ích khác nhau cho ngài và [armies|E] khi vinh danh tích lũy [glory|E]. Vinh quang có được qua các [contests|E] trong [GetActivityType( 'activity_tournament' ).GetName()] và [battles|E].\n\nThuộc tính chính luôn gắn liền với [accolade|E] và không thể thay đổi khi truyền thừa."
  
  ra_create_accolade_conclusion:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
  ra_create_accolade_conclusion_desc:0 "Giờ đây, ngài có thể tạo [accolade|E] này nếu muốn.\n\nNhững vinh danh khác sẽ mở khóa khi [culture|E] của ngài khám phá thêm [innovations|E]."

# House Unity
  reactive_advice_house_unity: "Sự hòa hợp gia tộc"

  action_reactive_advice_house_unity: "Chỉ dẫn: $reactive_advice_house_unity$"
  action_reactive_advice_house_unity_desc: "Tìm hiểu về [house_unity|E] của [clans|E], và cách ngài có thể tác động để nhận lợi ích và mở khóa [succession_laws|E]."
  action_reactive_advice_house_unity_click: "$click_to_open_lesson$"

  ra_house_unity_1: "$reactive_advice_house_unity$"
  ra_house_unity_1_desc: "Với tư cách là một [clan|E], ngài có [house_unity|E]!\n\nChỉ số này thể hiện mối quan hệ nội bộ trong [house|E], từ đối địch đến hòa hợp. Mỗi [house_unity_level|E] mang lại hiệu ứng khác nhau cho toàn bộ thành viên, đồng thời quyết định [succession_law|E].\n\nHiểu rõ cách tác động sẽ giúp ngài đạt được mục tiêu."

  ra_house_unity_2: "$reactive_advice_house_unity$"
  ra_house_unity_2_desc: "Trước hết, ngài cần biết cách xem [house_unity|E]. Hãy mở giao diện [house|E]."

  ra_house_unity_panel_prompt: "Mở giao diện [house|E]"

  ra_house_unity_3: "$reactive_advice_house_unity$"
  ra_house_unity_3_desc: "Tab Sự hòa hợp gia tộc chứa toàn bộ thông tin và tương tác cần thiết.\n\nNgài có thể xem điểm hiện tại, cấp độ, và biến động gần đây. Mọi thành viên đều có thể thực hiện [house_unity_unifying_actions|E] hoặc [house_unity_devisive_actions|E] để thay đổi chỉ số này."

  ra_house_unity_4: "$reactive_advice_house_unity$"
  ra_house_unity_4_desc: "Mỗi [house_unity_level|E] có hiệu ứng riêng. Tại đây ngài có thể xem danh sách hiệu ứng đang áp dụng.\n\nNhững hiệu ứng này ảnh hưởng đến toàn bộ [house|E], bao gồm cả [succession_law|E]."

  ra_house_unity_5: "$reactive_advice_house_unity$"
  ra_house_unity_5_desc: "Mỗi gia tộc có thể sử dụng các [decisions|E] liên quan đến House Unity.\n\nPhần lớn chỉ [house_head|E] mới có thể thực hiện.\n\n#weak Ngài có thể thách đấu để giành vị trí này.#!"

  ra_house_unity_6: "$reactive_advice_house_unity$"
  ra_house_unity_6_desc: "Giờ đây, ngài đã nắm rõ về Sự hòa hợp gia tộc!\n\nHãy vận dụng để gia tộc của ngài lưu danh hậu thế."

# Tax Collection
  action_reactive_advice_tax_collector: "Chỉ dẫn: Thu thuế"
  action_reactive_advice_tax_collector_desc: "Mở để tìm hiểu về [tax_jurisdictions|E] và [tax_collectors|E]."
  action_reactive_advice_tax_collector_click: "$click_to_open_lesson$"

  reactive_advice_tax_collector: "Thu thuế"

  ra_tax_collector_1: "$reactive_advice_tax_collector$"
  ra_tax_collector_1_desc:0 "Ngài có các [tax_collectors|E]!\n\nHọ sẽ giúp ngài thu thập [gold|E] và [levies|E] từ các chư hầu trong Clan. Các quan thu thuế cũng hỗ trợ quản lý [tax_jurisdictions|E] và thi hành các sắc lệnh thuế.\n\n#weak Năng lực của họ sẽ ảnh hưởng đến mức cống nạp mà ngài nhận được từ người nộp thuế.#!"

  ra_tax_collector_2: "$reactive_advice_tax_collector$"
  ra_tax_collector_2_desc:0 "Trước hết, ngài cần biết nơi xem [tax_jurisdictions|E], cách bổ nhiệm [tax_collectors|E], và phân công người nộp thuế."

  ra_tax_collector_panel_prompt: "Mở bảng [tax_jurisdictions|E]"

  ra_tax_collector_3: "$reactive_advice_tax_collector$"
  ra_tax_collector_3_desc:0 "Chào mừng ngài đến giao diện [tax_jurisdiction|E]!\n\nTại đây, ngài có thể quan sát và quản lý toàn bộ lãnh vực thu thuế.\n\nPhía trên hiển thị số lượng [tax_collectors|E] đã bổ nhiệm cùng tổng [gold|E] và [levies|E] mà ngài thu được."

  ra_tax_collector_4: "$reactive_advice_tax_collector$"
  ra_tax_collector_4_desc:0 "Đây là các [tax_jurisdictions|E] của ngài, nơi ngài có thể chỉ định chư hầu làm người nộp thuế và ban hành sắc lệnh thuế cho từng khu vực.\n\nNgài cũng cần bổ nhiệm một [tax_collector|E] để quản lý và thi hành các sắc lệnh.\n\n#weak Nếu một khu vực có người nộp thuế nhưng không có quan thu thuế, nó sẽ không bị đánh thuế, và ngài sẽ không thu được [gold|E] hay [levies|E].#!"

  ra_tax_collector_5: "$reactive_advice_tax_collector$"
  ra_tax_collector_5_desc:0 "Chúc mừng!\n\nNgài đã nắm được những điều cơ bản về thu thuế. Hãy điều chỉnh sắc lệnh thuế trong [tax_jurisdictions|E] để phù hợp với [vassal_obligations|E] hiện tại.\n\nMong rằng [clan|E] của ngài sẽ lưu danh muôn đời."

  action_reactive_advice_legitimacy: "Chỉ dẫn: Chính danh"
  action_reactive_advice_legitimacy_desc: "Mở để tìm hiểu về [legitimacy|E]."
  action_reactive_advice_legitimacy_click: "$click_to_open_lesson$"

  reactive_advice_legitimacy: "Chính danh"

  ra_legitimacy_1: "$reactive_advice_legitimacy$"
  ra_legitimacy_1_desc:0 "[legitimacy|E] là sự thể hiện 'quyền cai trị' của ngài. Các [vassals|E] của ngài tạo ra các [legitimacy_expectations|E], và ngài được kỳ vọng sẽ đáp ứng chúng.\n\n$game_concept_legitimacy$ cao hơn mang lại cho ngài nhiều lợi ích, và $game_concept_legitimacy$ thấp sẽ ảnh hưởng xấu đến sự thuận lợi trong việc cai trị của ngài.\n\n#weak $game_concept_legitimacy$ có 5 [legitimacy_levels|E] và một cấp độ thấp nhất là 'Bất hợp pháp', với một phần [legitimacy|E] của bậc Cầm quyền trước đó được [heir|E] của họ kế thừa. Ngài đạt được $game_concept_legitimacy$ thông qua nhiều cách khác nhau, bao gồm chiến thắng trong các cuộc chiến, tạo ra [legends|E] hoặc tham gia các [activities|E]. Tương tự như vậy, nó có thể bị mất do thua trận và mất tước vị, hoặc do [epidemics|E] không được kiểm soát tàn phá vùng đất.#!"

  ra_legitimacy_2: "$reactive_advice_legitimacy$"
  ra_legitimacy_2_desc:0 "Giao diện [legitimacy|E] nằm ở góc dưới bên trái, hiển thị cấp độ, kỳ vọng và các hiệu ứng hiện tại.\n\n#weak Ảnh hưởng bao gồm thay đổi thiện cảm, [dynasty_prestige|E], chi phí [casus_belli|E], và điều kiện [alliances|E] hay [faction|E].#!"

  action_reactive_advice_epidemics: "Chỉ dẫn: Dịch bệnh"
  action_reactive_advice_epidemics_desc: "Mở để tìm hiểu về [epidemics|E]."
  action_reactive_advice_epidemics_click: "$click_to_open_lesson$" 

  reactive_advice_epidemics: "Dịch bệnh"
  ra_epidemics_panel_prompt: "Mở bảng [epidemics|E]"
  ra_specific_epidemics_panel_prompt: "Mở bảng 'Xem dịch bệnh'"

  ra_epidemics_1: "$reactive_advice_epidemics$"
  ra_epidemics_1_desc:0 "[epidemics|E] là các đợt bùng phát bệnh lan rộng, ảnh hưởng đến [characters|E] và [holdings|E]. Khi xuất hiện, các [baronies|E] sẽ có [infection_rate|E] thể hiện mức độ nghiêm trọng.\n\nGiao diện nằm ở góc dưới bên phải."

  ra_epidemics_2: "$reactive_advice_epidemics$"
  ra_epidemics_2_desc:0 "Mỗi [epidemic|E] trên bản đồ được chia thành các phần trong bảng $reactive_advice_epidemics$.\n\n$reactive_advice_epidemics$ của Vương quốc truyền đạt thông tin về $reactive_advice_epidemics$ trong vương quốc của ngài, $reactive_advice_epidemics$ của Thế giới thông báo cho ngài về $reactive_advice_epidemics$ ở phần còn lại của thế giới, và $reactive_advice_epidemics$ Lân cận ghi lại tiến trình của các $reactive_advice_epidemics$ chưa nằm trong vương quốc của ngài, nhưng đủ gần để có khả năng gây ra mối đe dọa trong tương lai."

  ra_epidemics_3: "$reactive_advice_epidemics$"
  ra_epidemics_3_desc:0 "Bảng này hiển thị mức độ dịch (nhẹ, nặng, tận thế), nơi phát sinh, số người chết, cùng các [modifiers|E] ảnh hưởng đến [baronies|E] và [counties|E].\n\nNút 'Xem dịch bệnh' cho phép xem chi tiết hơn."

  ra_epidemics_4: "$reactive_advice_epidemics$"
  ra_epidemics_4_desc:0 "Bảng này bao gồm thông tin về [infection_rate|E] của từng [barony|E] bị ảnh hưởng bởi Bệnh dịch. [infection_rate|E] sẽ tiến triển đến giá trị tối đa với tốc độ khác nhau tùy thuộc vào cường độ của Bệnh dịch, và có thể được giảm nhẹ bằng $game_concept_epidemic_resistance$.\n\n#weak Cách ngài quản lý và đối phó với $reactive_advice_epidemics$ sẽ quyết định không chỉ cách [realm|E] của ngài phục hồi và sau đó thịnh vượng, mà còn quyết định lượng [legitimacy|E] ngài sẽ mất với tư cách là bậc Cầm quyền.#!"

  action_reactive_advice_legends: "Chỉ dẫn: Truyền thuyết"
  action_reactive_advice_legends_desc: "Mở để tìm hiểu về [legends|E]."
  action_reactive_advice_legends_click: "$click_to_open_lesson$" 

  reactive_advice_legends: "Truyền thuyết"
  ra_legends_panel_prompt: "Mở bảng [legends|E]"
  ra_legends_view_panel_prompt: "Mở bảng tạo truyền thuyết"

  ra_legends_1: "$action_reactive_advice_legends$"
  ra_legends_1_desc:0 "[legends|E] là những câu chuyện về chiến công của một [character|E]. Mỗi truyền thuyết có loại riêng: chính danh, anh hùng hoặc linh thiêng.\n\nGiao diện nằm ở góc dưới bên trái."

  ra_legends_2: "$action_reactive_advice_legends$"
  ra_legends_2_desc:0 "Mỗi [legend|E] khả dụng với ngài đều có thể nhìn thấy ở đây, cùng với tất cả thông tin của chúng.\n\nỞ trên cùng là các [legend_seeds|E], cơ sở của một Huyền thoại. Chúng có thể kiếm được hoặc trong một số trường hợp, ngài đã sở hữu do nhân vật của ngài đáp ứng các tiêu chí nhất định. Bên dưới chúng là các $action_reactive_advice_legends$ Thế giới, theo dõi các $action_reactive_advice_legends$ khác trên thế giới không được thúc đẩy tích cực bởi ngài.\n\n#weak 'Người thúc đẩy' là những nhân vật hỗ trợ tích cực cho một Huyền thoại nhất định.#!"

  ra_legends_3: "$action_reactive_advice_legends$"
  ra_legends_3_desc:0 "Thông tin có trong bảng $action_reactive_advice_legends$ bao gồm chi phí cơ bản, duy trì, hiệu ứng đang hoạt động và Chất lượng Huyền thoại.\n\nĐược làm nổi bật là nút được sử dụng để chọn một Huyền thoại từ danh sách của ngài."

  ra_legends_4: "$action_reactive_advice_legends$"
  ra_legends_4_desc:0 "Bảng này cho phép ngài tạo truyền thuyết và chọn [characters|E] làm [legend_protagonists|E].\n\n#weak Khởi đầu sẽ mở Biên niên sử truyền thuyết, nơi ngài có thể nâng cao [legend_quality|E] hoặc hoàn tất nó.#!"

 # Plague Resistance
  action_reactive_advice_plague_resistance: "Chỉ dẫn: Kháng dịch"
  action_reactive_advice_plague_resistance_desc: "Mở để tìm hiểu về [epidemic_resistance|E]."
  action_reactive_advice_plague_resistance_click: "$click_to_open_lesson$"

  reactive_advice_plague_resistance: "Kháng dịch"

  ra_plague_resistance_1: "$reactive_advice_plague_resistance$"
  ra_plague_resistance_1_desc:0 "Khi đối mặt với dịch bệnh, ngài có một số biện pháp để hạn chế sự lan rộng trong lãnh thổ.\n\nYếu tố quan trọng nhất là [epidemic_resistance|E]. Mức kháng dịch của các [baronies|E] và [counties|E] càng cao, ngài càng có thể chống đỡ dịch bệnh hiệu quả.\n\n#weak Dù có thể chống lại dịch bệnh, ngài khó lòng ngăn chặn hoàn toàn. Hãy chuẩn bị tinh thần rằng các đại dịch lớn vẫn có thể lan rộng bất chấp nỗ lực của ngài.#!"

  ra_plague_resistance_2: "$reactive_advice_plague_resistance$"
  ra_plague_resistance_2_desc:0 "$reactive_advice_plague_resistance$ có thể được tăng theo nhiều cách. Các tòa nhà như $building_type_hospices_01$ và $building_type_charnel_grounds_01$ mang lại tiền thưởng bẩm sinh cho $reactive_advice_plague_resistance$ đối với [county|E] hoặc [barony|E] nơi chúng được xây dựng.\n\n Các lựa chọn khác ít lâu dài hơn bao gồm các [court_position_tasks|E] được thực hiện bởi $court_physician_court_position$, [decisions|E] hoặc các sự kiện."

  ra_plague_resistance_3: "$reactive_advice_plague_resistance$"
  ra_plague_resistance_3_desc:0 "Khi $reactive_advice_plague_resistance$ tăng lên, [infection_rate|E] tại các [baronies|E] liên quan sẽ giảm.\n\nDù khó có thể dập tắt hoàn toàn một đại dịch lớn, việc giảm [infection_rate|E] sẽ giúp hạn chế thiệt hại chung đối với [realm|E] của ngài."

  action_reactive_advice_tutorial_schemes: "Chỉ dẫn: $game_concept_schemes$"
  action_reactive_advice_tutorial_schemes_desc: "Mở để tìm hiểu về [schemes|e]."
  action_reactive_advice_tutorial_schemes_click: "$click_to_open_lesson$"
  reactive_advice_tutorial_schemes: "$ra_tutorial_schemes_1$"

  ra_tutorial_schemes_1: "$game_concept_schemes$"
  ra_tutorial_schemes_1_desc:0 "Ngài vừa bắt đầu một [scheme|E]! Các $game_concept_schemes$ là mục tiêu dài hạn, nhắm vào một Nhân vật khác. Chúng có thể có mục tiêu thù địch, như cố gắng [GetScheme('murder').GetTypeName] hoặc [GetScheme('abduct').GetTypeName] mục tiêu của ngài, hoặc mang tính lành mạnh hơn, chẳng hạn như [scheme|E] [GetScheme('befriend').GetTypeName]."

  ra_tutorial_schemes_2: "$game_concept_schemes$"
  ra_tutorial_schemes_2_desc:0 "Ngài vừa bắt đầu một [scheme|E]! Các $game_concept_schemes$ là mục tiêu dài hạn, nhắm vào một Nhân vật khác. Chúng có thể có mục tiêu thù địch, như cố gắng [GetScheme('murder').GetTypeName] hoặc [GetScheme('abduct').GetTypeName] mục tiêu của ngài, hoặc mang tính lành mạnh hơn, chẳng hạn như [scheme|E] [GetScheme('befriend').GetTypeName]."

  ra_tutorial_schemes_3: "$game_concept_schemes$"
  ra_tutorial_schemes_3_desc:0 "Đây là nơi hiển thị toàn bộ các kế hoạch đang hoạt động của ngài. Ngài có thể duy trì đồng thời một [personal_scheme|e] và một [hostile_scheme|e].\n\n#TUT Ngài có thể sử dụng kế hoạch bất cứ lúc nào, nhưng hiệu quả sẽ phụ thuộc vào [traits|e] và [skills|e] của nhân vật. Một số [lifestyle|e] [perks|e] có thể mở khóa thêm các $game_concept_schemes$.#!"

 # Favorite Child
  action_reactive_advice_favorite_child: "Chỉ dẫn: Con được sủng ái"
  action_reactive_advice_favorite_child_desc: "Ngài có thể chọn [favorite_child|E]. Mở để tìm hiểu và lựa chọn."
  action_reactive_advice_favorite_child_click: "$click_to_open_lesson$"

  reactive_advice_favorite_child: "Con được sủng ái"

  ra_favorite_child_1: "$reactive_advice_favorite_child$"
  ra_favorite_child_1_desc:0 "Giờ đây, ngài có thể chọn [favorite_child|E]. Người này sẽ có [opinion|E] cao hơn với ngài, và khi ngài qua đời, ngài có thể tiếp tục di sản của mình thông qua họ thay vì người thừa kế.\n\nCon được sủng ái có thể là:\n$BULLET_WITH_TAB$Con\n$BULLET_WITH_TAB$Cháu\n$BULLET_WITH_TAB$Chắt\nMiễn là họ thuộc [dynasty|E] của ngài."
  ra_favorite_child_1_prompt: "Mở giao diện nhân vật của ngài (được tô sáng)"

  ra_favorite_child_2: "$reactive_advice_favorite_child$"
  ra_favorite_child_2_desc:0 "Trong giao diện nhân vật, hãy tìm người con mà ngài muốn chọn.\n\nNhấp chuột phải để tương tác và chọn tùy chọn 'Chọn con được sủng ái', hoặc chọn trực tiếp từ danh sách con cái.\n\nHãy nhớ rằng việc chọn một $game_concept_favorite_child$ có thể khiến những người con khác giảm thiện cảm với ngài."
  ra_favorite_child_2_prompt: "Nhấp chuột phải vào một người con để xem các tương tác (được tô sáng)"

  ra_favorite_child_3: "$reactive_advice_favorite_child$"
  ra_favorite_child_3_desc:0 "Sau khi chọn, một biểu tượng sẽ xuất hiện trên chân dung của họ. Dù không phải người thừa kế, ngài vẫn có thể tiếp tục chơi với họ sau khi qua đời.\n\nNếu muốn thay đổi, hãy quay lại giao diện nhân vật và chọn người khác."


 # Army Automation
  action_reactive_advice_army_automation: "Chỉ dẫn: $ARMY_AUTOMATION_FEATURE_NAME$"
  action_reactive_advice_army_automation_desc: "Nếu ngài không muốn tự mình điều khiển mọi [war|E], ngài có thể bật $ARMY_AUTOMATION_FEATURE_NAME$. Mở mục này để tìm hiểu cách sử dụng."
  action_reactive_advice_army_automation_click: "$click_to_open_lesson$"

  reactive_advice_army_automation: "$ARMY_AUTOMATION_FEATURE_NAME$"

  ra_army_auto_intro: "$reactive_advice_army_automation$"
  ra_army_auto_intro_desc: "Nếu ngài muốn tập trung vào những việc khác thay vì điều binh khiển tướng, ngài có thể để trò chơi tự động điều khiển [armies|E] của mình."
  ra_army_auto_open: "$reactive_advice_army_automation$"
  ra_army_auto_open_desc: "Ngài có thể bật/tắt $ARMY_AUTOMATION_FEATURE_NAME$ trong giao diện Quân sự."
  ra_army_auto_open_prompt: "Mở giao diện Quân sự"
  ra_army_auto_explain: "$reactive_advice_army_automation$"
  ra_army_auto_explain_desc: "Tại đây, ngài có thể quyết định liệu [armies|E] có được tự động hóa hay không. Ngài có thể thay đổi bất cứ lúc nào, kể cả khi đang trong [war|E].\n\nNgài vẫn tự mình tuyển [men_at_arms|E], thuê [mercenaries|E] và tiến hành [raids|E]. Các thiết lập này có thể được điều chỉnh thông qua nút cài đặt $ARMY_AUTOMATION_FEATURE_NAME$."

 # EP3
  action_reactive_advice_admin_gov: "Chỉ dẫn: Chính thể quan liêu"
  action_reactive_advice_admin_gov_desc: "Ngài đang cai trị dưới [administrative_government|e]. Mở để tìm hiểu thêm."
