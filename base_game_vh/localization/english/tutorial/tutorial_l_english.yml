  quick_tutorial_desc: "Bắt đầu Hướng dẫn nhanh"
  full_tutorial_desc: "Bắt đầu Hướng dẫn nâng cao"
 # Basics
  lesson_basics_welcome:1 "Chào mừng đến với Crusader Kings III"
  lesson_welcome_desc:3 "@tutorial_screenshot_1!\nNgài là một vị quân vương thời trung cổ! Triều đại của Ngài có thể ngắn ngủi, nhưng thông qua những người thừa kế, Ngài có thể đưa dòng dõi của mình lên đỉnh cao danh vọng.\n\nĐất đai đang chờ Ngài chinh phục — bằng lưỡi gươm hoặc thông qua hôn nhân — trong khi ngoại giao khôn khéo có thể mở rộng ảnh hưởng của Ngài vượt xa cả những giấc mơ điên rồ nhất của mọi kẻ chinh phạt..."
 
  full_tutorial_explanation_desc: "\n#TUT 2 Giờ#!"
  quick_tutorial_explanation_desc: "\n#TUT 13 Phút#!"

 #Quick Tutorial
  lesson_basics_quick_camera: "Camera"
  lesson_basics_quick_camera_desc: "Sử dụng các phím W, A, S và D để di chuyển camera trên bản đồ.\n\nNgài cũng có thể di chuyển con trỏ chuột ra mép màn hình để xoay góc nhìn.\n\nNhấn phím '#V Home#!' trên bàn phím để quay về lãnh địa của Ngài tại [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."

  lesson_basics_quick_zoom: "Thu phóng"
  lesson_basics_quick_zoom_desc: "Để phóng to hoặc thu nhỏ bản đồ, hãy sử dụng bánh xe cuộn chuột.\n\nKhi phóng to tối đa, Ngài sẽ thấy $game_concept_detail_zoom$. Thu nhỏ một chút, Ngài sẽ chuyển sang $game_concept_political_zoom$. Cuối cùng, khi thu nhỏ hoàn toàn, Ngài sẽ thấy $game_concept_paper_zoom$."

  lesson_basics_quick_nested_tooltips: "Tooltip lồng nhau"
  lesson_basics_quick_nested_tooltips_desc: "$lesson_basics_tooltips_in_tooltips_desc$"
  lesson_basics_quick_nested_tooltips_hover_word: "$lesson_basics_tooltips_in_tooltips_hover_word$"
  lesson_basics_quick_nested_tooltips_hover_word_deeper: "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$"

  lesson_basics_quick_nested_tooltips_complete: "$lesson_basics_quick_nested_tooltips$"
  lesson_basics_quick_nested_tooltips_complete_desc: "$lesson_basics_quick_nested_tooltips_desc$"


  lesson_basics_quick_characters: "Nhân vật"
  lesson_basics_quick_characters_desc: "Ngài điều khiển [GetPlayer.GetShortUINameNotMeNoTooltip], một trong rất nhiều [characters|E] trong thế giới này, được thể hiện thông qua chân dung nhân vật.\n\nNgài là [ruler|E] của một [realm|E] phong kiến!"

  lesson_basics_quick_this_is_you_1: "Đây là Ngài"
  lesson_basics_quick_this_is_you_1_desc: "Đây là nơi Ngài thấy chính mình và những người [family|e] thân cận nhất.\n\nBên phải, Ngài có thể thấy [heir|e] của mình — người sẽ kế thừa $game_concept_realm$ sau khi Ngài qua đời.\n\n#TUT Nếu Ngài bị lạc trên bản đồ, hãy nhấp vào nhân vật của mình để đưa camera trở lại trung tâm [realm|e] của Ngài.#!"
 
  lesson_basics_quick_this_is_you_2: "Phối ngẫu của Ngài"
  lesson_basics_quick_this_is_you_2_desc: "Thông thường, việc có một [spouse|E] là rất quan trọng. Họ sẽ hỗ trợ Ngài cai trị [realm|e] và giúp đảm bảo tương lai cho [dynasty|e] của Ngài.\n\nHiện tại, Ngài vẫn chưa kết hôn. Sao chúng ta không giải quyết việc này nhỉ?"
  lesson_basics_quick_find_spouse_tt: "Kết hôn"

  lesson_basics_quick_marriage_window: "$lesson_basics_quick_this_is_you_2$"
  lesson_basics_quick_marriage_window_desc: "Tìm được một [spouse|E] phù hợp không hề dễ dàng, nhưng có một vài điều Ngài nên cân nhắc:\n\n$EFFECT_LIST_BULLET$Chính trị: [marriages|E] là cách chính để hình thành một [alliance|E]\n$EFFECT_LIST_BULLET$Năng lực: [skills|E] của họ sẽ được cộng vào chỉ số của Ngài\n$EFFECT_LIST_BULLET$Di truyền: các [congenital_traits|E], chẳng hạn như [GetTrait('intellect_good_2').GetName( GetNullCharacter )], có thể được truyền lại cho [children|E]\n$EFFECT_LIST_BULLET$Địa vị: Kết hôn với một [lowborn|E] sẽ khiến Ngài mất [prestige|E]"

  lesson_basics_quick_married_great_job: "Phối ngẫu của Ngài"
  lesson_basics_quick_married_great_job_desc: "Chúc mừng Ngài đã kết hôn!\n\nCuộc hôn nhân giữa Ngài và [spouse|e] đã tạo ra một [alliance|e] giữa Ngài và [ruler|e] của [realm|e] nơi $game_concept_spouse$ của Ngài xuất thân. Điều này có nghĩa là hai bên có thể kêu gọi nhau tham gia [wars|e]!\n\n#TUT Nếu không còn bất kỳ thành viên nào khác trong [dynasty|e] của Ngài còn sống sau khi nhân vật của Ngài qua đời, Ngài sẽ thua cuộc. Việc có một $game_concept_spouse$ sẽ giúp Ngài tránh được điều này.#!"

  lesson_basics_quick_this_is_you_3: "Đặc điểm"
  lesson_basics_quick_this_is_you_3_desc: "Đây là các [traits|e] của nhân vật Ngài! Như Ngài thấy, ông ta là @temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )], @gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )], và @impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )].\n\n#TUT $game_concept_traits$ ảnh hưởng đến cách nhân vật của Ngài phản ứng trước các sự kiện trong thế giới game. Ngài cũng có thể nhận thêm các đặc điểm mới trong quá trình chơi.#!"

  lesson_basics_quick_skills: "Kỹ năng"
  lesson_basics_quick_skills_desc: "Nhân vật cũng có các [skills|e]! Hãy cùng xem qua chúng.\n\nNăm $game_concept_skills$ chính quyết định năng lực của nhân vật là [diplomacy_i|e][diplomacy|e], [martial_i|e][martial|e], [stewardship_i|e][stewardship|e], [intrigue_i|e][intrigue|e], và [learning_i|e][learning|e].\n\n#TUT $game_concept_skills$ có thể thay đổi trong suốt quá trình chơi, tùy theo hành động của Ngài.#!"

  lesson_basics_quick_your_domain_1: "Lãnh địa của Ngài"
  lesson_basics_quick_your_domain_desc_1: "@tutorial_screenshot_2! Tiếp theo, hãy xem [domain|e] của Ngài, bao gồm toàn bộ vùng đất Ngài trực tiếp sở hữu. Tổng quan về $game_concept_domain$ được hiển thị trong khu vực được tô sáng."
 
  lesson_basics_quick_your_domain_2: "Huy hiệu của Ngài"
  lesson_basics_quick_your_domain_desc_2: "Đây là Huy hiệu của [GetPlayer.GetPrimaryTitle.GetName]. Nó được dùng để đại diện cho [realm|e] của Ngài ở nhiều nơi khác nhau. Ví dụ, Ngài có thể thấy nó bay phía trên [capital|e] của Ngài, $cn_luimneach$.\n\n#TUT Ngài thấy chiếc vương miện nhỏ phía trên Huy hiệu không? Nó thể hiện [title_tier|e] của tước vị đó. Khi $game_concept_title_tiers$ tăng cấp bậc, chiếc vương miện phía trên Huy hiệu cũng sẽ trở nên lộng lẫy hơn!#!"

  lesson_basics_quick_your_domain_3: "Tước vị của Ngài"
  lesson_basics_quick_your_domain_desc_3: "Hiện tại, Ngài đang nắm giữ tổng cộng ba [titles|e], mỗi tước vị đại diện cho một lãnh thổ trên bản đồ. $game_concept_title$ chính và quan trọng nhất của Ngài là tước vị nằm ngoài cùng bên trái. Nó quyết định tên của [realm|e] Ngài. Ngài cũng sở hữu các $game_concept_titles$ $c_thomond$ và $c_ennis$.\n\n#TUT Di chuột lên các $game_concept_titles$ trong Bảng Nhân vật sẽ hiển thị lãnh thổ mà chúng đại diện trên bản đồ.#!"
 
  lesson_basics_quick_relationships: "Nhân vật khác"
  lesson_basics_quick_relationships_desc: "@tutorial_screenshot_3!\nTại đây, Ngài có thể thấy nhiều [characters|e] khác mà Ngài có mối liên hệ. Bao gồm [family|e] của Ngài, những người Ngài có [relationship|e], các [courtiers|e], và [subjects|e] của Ngài."


  lesson_basics_quick_realm: "Lãnh thổ"
  lesson_basics_quick_realm_desc: "Hãy nhìn vào thanh ở phía bên phải màn hình. Tại đây có một vài nút, nhưng trước hết chúng ta sẽ quan tâm đến [realm|e] của Ngài."

 
  lesson_basics_quick_realm_great_job: "Hạt & Điền trang"
  lesson_basics_quick_realm_great_job_desc: "Ngài còn nhớ các [titles|e] chúng ta đã thấy trước đó chứ? Ở giao diện này, Ngài có thể xem chi tiết hơn vùng đất mà chúng đại diện. Chúng là các [counties|e], nhưng có tên gọi riêng do [culture|e] Ireland của Ngài.\n\n$game_concept_counties$ (trong trường hợp của Ngài là các Bá tước lãnh / Earldoms) được cấu thành từ những mảnh đất nhỏ hơn gọi là [holdings|e]. Mỗi $game_concept_holding$ có thể hỗ trợ nhiều [buildings|e], mang lại các lợi ích khác nhau."

  lesson_basics_quick_vassals: "Chư hầu"
  lesson_basics_quick_vassals_desc: "Ngài có để ý rằng $c_ormond$ vẫn nằm trong đường viền [realm|e] của Ngài trên bản đồ dù không xuất hiện trong giao diện [domain|e] không? Để giải thích điều đó, chúng ta cần xem qua các [vassals|e] của Ngài."

  lesson_basics_quick_vassals_2: "Chư hầu"

  lesson_basics_quick_council_1: "Hội đồng"
  lesson_basics_quick_council_1_desc: "May mắn thay, Ngài không phải tự mình quản lý toàn bộ [realm|e]. Hãy cùng xem [council|e] của Ngài — một giao diện khác có thể truy cập từ thanh bên phải."

  lesson_basics_quick_council_2: "Hội đồng"
  lesson_basics_quick_council_2_desc:0 "@tutorial_screenshot_4! Đây là [council|e] của Ngài, bao gồm sáu [councillors|e], trong đó có cả [spouse|e] của Ngài. Ví dụ, họ có thể $task_collect_taxes$ hoặc $task_find_secrets$ thông qua các [councillor_tasks|e]."

  lesson_basics_quick_council_3: "Nhiệm vụ Hội đồng"
  lesson_basics_quick_council_3_desc: "Hãy thử sử dụng một [councillor_task|e]! Sẽ thật tuyệt nếu Ngài có thêm một [county|e] trong [realm|e] của mình, đúng không? Để làm được điều đó, Ngài cần có một [claim|e]. Ngài có thể yêu cầu [realm_priest|e] của mình tạo ra nó."
 
  lesson_basics_council_fabricate_claim_tt: "Ngụy tạo một $game_concept_claim$ đối với một $game_concept_county$ bên ngoài biên giới của Ngài"

  lesson_basics_quick_vassals_great_job: "Chư hầu"
  lesson_basics_quick_vassals_great_job_desc: "@tutorial_screenshot_5! Đây là một [vassal|e] — một [ruler|e] khác hỗ trợ việc quản lý [realm|e] của Ngài bằng cách cai trị một [county|e] nằm ngoài [domain|e] của Ngài.\n\nVới tư cách là [liege|e] của một $game_concept_vassal$, Ngài nhận được cống nạp dưới dạng $game_concept_taxes$ (@gold_icon![gold|e]) và @soldier_icon! [levies|e]."

  lesson_basics_quick_vassals_great_job_2: "Lãnh địa & Lãnh thổ"
  lesson_basics_quick_vassals_great_job_2_desc: "Có một sự khác biệt quan trọng giữa [domain|e] và [realm|e] của Ngài. $game_concept_domain$ là vùng đất Ngài trực tiếp sở hữu, trong khi $game_concept_realm$ còn bao gồm cả những vùng đất do các [vassals|e] của Ngài nắm giữ.\n\n#TUT [domain_limit|e] của Ngài khiến việc tự mình nắm giữ quá nhiều [titles|e] trở nên bất lợi, đồng nghĩa với việc Ngài sẽ cần dựa vào $game_concept_vassals$ để tiếp tục mở rộng lãnh thổ.#!"

  lesson_basics_quick_holdings: "Điền trang"
  lesson_basics_quick_holdings_desc: "Hiện tại, [domain|E] của Ngài bao gồm các [counties|E] (được gọi là \"Earldoms\" do [culture|E] Ireland của Ngài) là $c_thomond$ và $c_ennis$. Vì $c_ormond$ do [vassal|e] của Ngài nắm giữ, nên nó không thuộc $game_concept_domain$ của Ngài.\n\nCác [counties|E] này được cấu thành từ những đơn vị đất nhỏ hơn — [baronies|E], tức các [holdings|E] riêng lẻ của một [realm|E].\n\n#TUT Điền trang đại diện cho các khu định cư trong lãnh thổ của Ngài!#!"

  lesson_basics_quick_resources_1: "Tài nguyên"
  lesson_basics_quick_resources_1_desc: "Làm tốt lắm! [councillor|e] của Ngài hiện đang tiến hành tạo ra một [claim|e] cho Ngài.\n\nTiếp theo, hãy nhìn vào thanh ở góc trên bên phải màn hình. Tại đây, Ngài sẽ thấy nhiều loại tài nguyên có thể dùng để tương tác với thế giới theo nhiều cách khác nhau."

  lesson_basics_quick_resources_gold: "@gold_icon! $game_concept_gold$"
  lesson_basics_quick_resources_gold_desc: "[gold_i|e] [gold|e] thể hiện của cải cá nhân của Ngài, và có thể dùng để chi trả cho nhiều thứ như xây dựng công trình, duy trì quân đội hay hối lộ.\n\nNói chung, việc có [stewardship_i|e][stewardship|e] [skill|e] cao sẽ giúp Ngài kiếm $game_concept_gold$ hiệu quả hơn."

  lesson_basics_quick_resources_prestige: "@prestige_icon! $game_concept_prestige$"
  lesson_basics_quick_resources_prestige_desc: "[prestige_i|e] [prestige|e] đại diện cho vinh quang và danh tiếng cá nhân của Ngài. Khi tích lũy $game_concept_prestige$, Ngài cũng sẽ nâng cao [prestige_level|e] của mình.\n\nVới tư cách là một tài nguyên, $game_concept_prestige$ có thể được dùng để đưa ra các quyết định thế tục trong [realm|e] của Ngài. [diplomacy_i|e][diplomacy|e] cao sẽ giúp Ngài kiếm thêm $game_concept_prestige$."

  lesson_basics_quick_resources_piety: "[piety_i|e] $game_concept_piety$"
  lesson_basics_quick_resources_piety_desc: "[piety_i|e] [piety|e] là tài nguyên phản ánh mức độ mộ đạo của nhân vật Ngài. Nó có thể được dùng để tương tác với [faith|e] của Ngài theo nhiều cách, chẳng hạn như tuyên bố [holy_wars|e].\n\n[piety_level|e] của Ngài cũng sẽ tăng lên cùng với lượng $game_concept_piety$ tích lũy được. Tập trung vào [learning_i|e][learning|e] là một lựa chọn tốt cho những nhân vật đặc biệt sùng đạo."

  lesson_basics_quick_resources_renown: "@dynasty_prestige_icon! $game_concept_dynasty_prestige$"
  lesson_basics_quick_resources_renown_desc: "[dynasty_prestige_i|e] [dynasty_prestige|e] thể hiện mức độ ảnh hưởng của [dynasty|e] Ngài, và có thể dùng cho các quyết định định hình tương lai gia tộc.\n\n$game_concept_dynasty_prestige$ gắn liền với [dynasty_prestige_level|e], là thước đo tổng thể mức độ danh tiếng của $game_concept_dynasty$."

  lesson_basics_quick_resources_time: "Thời gian"
  lesson_basics_quick_resources_time_desc: "Giờ chúng ta đã nói xong về tài nguyên, hãy kết thúc bằng một vài lời khuyên cuối cùng. Hiện tại, trò chơi đang tạm dừng. Ngài có thể điều chỉnh tốc độ trôi của thời gian ở góc dưới bên phải.\n\n#TUT Crusader Kings III là một trò chơi diễn ra trong suốt hàng trăm năm, vì vậy hãy cứ thong thả mà chơi.#!"

  lesson_basics_quick_unpause_tt: "Bỏ tạm dừng trò chơi bằng cách nhấn phím Space hoặc nhấp vào nút ở góc dưới bên phải"

  lesson_basics_quick_done: "Chúc may mắn!"
  lesson_basics_quick_done_desc: "Chúc mừng Ngài đã hoàn thành Hướng dẫn nhanh! Trò chơi giờ đã được tiếp tục và thời gian đang trôi. Kể từ thời điểm này, việc định hình tương lai của Gia tộc [GetPlayer.GetHouse.GetName] hoàn toàn nằm trong tay Ngài.\n\n#TUT Ngài có thể tự do làm bất cứ điều gì mình muốn, nhưng hãy chú ý tới @reactive_advice_icon! Lời khuyên phản ứng xuất hiện ở phía trên màn hình.\n\nBiết đâu Ngài thậm chí còn có thể trở thành Vua của Ireland thì sao?#!"

 
 #Camera & Map
  lesson_basics_camera:0 "Camera ($lesson_basics$)"
  lesson_basics_camera_desc:1 "Sử dụng các phím W, A, S và D để di chuyển camera trên bản đồ. Ngài cũng có thể đưa con trỏ chuột ra mép màn hình để xoay góc nhìn. Nhấn phím 'Home' để chuyển nhanh đến [realm_capital|E] của Ngài.\n\nĐể phóng to hoặc thu nhỏ bản đồ, hãy dùng bánh xe cuộn chuột.\n\n#TUT Ở mỗi mức thu phóng khác nhau, trò chơi sẽ hiển thị những thông tin khác nhau: [detail_zoom|E], [political_zoom|E] và [paper_zoom|E].\n\nKhi phóng to, Ngài có thể chọn và quản lý các [holdings|E] của mình. Khi thu nhỏ, Ngài sẽ có cái nhìn tổng quan về toàn bộ các [realms|E].#!"
  lesson_basics_paused_intro:0 "Tạm dừng ($lesson_basics$)"
  lesson_basics_paused_intro_desc:1 "Crusader Kings III trải dài qua hàng trăm năm và nhiều thế hệ. Ngay lúc này, thời gian đang đứng yên vì trò chơi đang được #EMP tạm dừng#!.\n\n#TUT Trong phần hướng dẫn này, chúng ta sẽ giữ trò chơi ở trạng thái tạm dừng trong khi giới thiệu cho Ngài một số khái niệm cơ bản của trò chơi.#!"


  lesson_basics_tooltips_in_tooltips: "Tooltip lồng nhau ($lesson_basics$)"
  lesson_basics_tooltips_in_tooltips_desc: "Các thuật ngữ quan trọng được đánh dấu bằng [highlighted_text|E] màu xanh. Điều này có nghĩa là Ngài có thể đưa con trỏ chuột lên các từ đó để mở tooltip cung cấp thông tin.\n\nBên trong các tooltip này cũng có thể chứa những từ khóa được đánh dấu, và Ngài cũng có thể di chuột lên chúng.\n\nMất #bold vài giây#! để một tooltip được \"khóa\" lại khi Ngài di chuột."
  lesson_basics_tooltips_in_tooltips_hover_word: "Đặt con trỏ chuột lên [highlighted_text|E] này để mở tooltip"
  lesson_basics_tooltips_in_tooltips_hover_word_deeper: "Di chuột lên từ \"neat\" bên trong tooltip vừa mở"
  lesson_basics_tooltips_in_tooltips_complete: "$lesson_basics_tooltips_in_tooltips$"
  lesson_basics_tooltips_in_tooltips_complete_desc: "$lesson_basics_tooltips_in_tooltips_desc$"


  lesson_basics_web_of_titles:0 "Những Người Cai Trị Lãnh Thổ ($lesson_basics_map$)"
  lesson_basics_web_of_titles_desc:2 "Giờ thì, hãy nói về #EMP trò chơi#! này! Mọi thứ đều diễn ra trên bản đồ trước mặt Ngài. Thế giới bao gồm những vùng lãnh thổ lớn nhỏ — các [titles|E] có đất đai, được nắm giữ bởi nhiều [rulers|E] khác nhau.\n\n#TUT $game_concept_titles$ được thể hiện bằng những huy hiệu cầu kỳ, hiển thị dưới dạng biểu tượng trên bản đồ.\n\nBiểu tượng đại diện cho [realm|E] của Ngài chính là biểu tượng của [primary_title|E] — $game_concept_title$ quan trọng và danh giá nhất mà Ngài đang nắm giữ.#!"
 #\n\n@coa_icon!"
  lesson_basics_realm:0 "Biên Giới ($lesson_basics_map$)"
  lesson_basics_realm_desc:3 "Nếu Ngài di chuột lên chân dung nhân vật của mình, huy hiệu phía trên [realm_capital|E] ($cn_luimneach$) sẽ phát sáng và toàn bộ [realm|E] của Ngài sẽ được làm nổi bật. Munster là [primary_title|E] của Ngài, vì vậy $game_concept_realm$ của Ngài được đặt theo tên đó.\n\nNgài cũng đang nắm giữ Bá tước địa Thomond như một $game_concept_title$ riêng biệt.\n\n#TUT Nếu Ngài thu nhỏ bản đồ, chữ \"Munster\" sẽ hiện ở khu vực này, bởi vì Ngài là Người Cai Trị tối cao của vùng đất đó.#!"
  lesson_basics_map_modes:0 "Cai Trị Người Khác ($lesson_basics_map$)"
  lesson_basics_map_modes_desc:1 "Với tư cách là một [ruler|E], Ngài chỉ có thể trực tiếp nắm giữ một lượng đất nhất định — Ngài sẽ thường có các $game_concept_rulers$ khác hỗ trợ việc quản lý [realm|E] bằng cách nắm giữ đất đai ([titles|E]) trong biên giới của Ngài, khiến họ trở thành [vassals|E] của Ngài.\n\n#TUT Để tìm đất của chính mình — [domain|E] — hãy nhấn phím 'Home' và phóng to bản đồ. Khi ở gần hơn, Ngài sẽ thấy các nhãn màu xanh trên những [baronies|E] thuộc về Ngài (trong trường hợp này là $cn_luimneach$ và $cn_inis$).\n\nBá tước địa $c_ormond$ đang do một Chư hầu của Ngài nắm giữ.#!"
 ### What makes a ruler
  lesson_basics_characters:0 "Nhân Vật ($lesson_basics_character$)"
  lesson_basics_characters_desc:1 "Ngài điều khiển một trong rất nhiều [characters|E] trong thế giới này, được thể hiện bằng chân dung Nhân Vật. Nhân Vật của Ngài là [ruler|E] của một [realm|E]!\n\n#TUT Ngài cần đảm bảo rằng [dynasty|E] của mình tồn tại và hưng thịnh qua nhiều thời đại. Các [titles|E] mang lại cho Ngài quyền lực và sự kiểm soát lãnh thổ, cũng như ảnh hưởng lên những Nhân Vật khác (những người cũng có thể nắm giữ Tước vị và đất đai riêng).#!"
  lesson_basics_characters_click_on_character:0 "Nhấp vào Nhân Vật của Ngài"
  lesson_basics_skills:0 "Kỹ Năng ($lesson_basics_character$)"
  lesson_basics_skills_desc:3 "[characters|E] có [skills|E], thể hiện mức độ thành thạo của họ trong một lĩnh vực nhất định. Có người giỏi ăn nói, trong khi người khác lại thích thể hiện ý định của mình trên chiến trường.\n\n#TUT Các Kỹ Năng chính gồm:\n#![diplomacy_i|E] [diplomacy|E]\n#weak Cải thiện thiện cảm của người khác với Ngài#!\n[martial_i|E] [martial|E]\n#weak Tuyển mộ và chỉ huy quân đội#!\n[stewardship_i|E] [stewardship|E]\n#weak Quản lý lãnh thổ cá nhân#!\n[intrigue_i|E] [intrigue|E]\n#weak Âm mưu và tìm kiếm bí mật#!\n[learning_i|E] [learning|E]\n#weak Nghiên cứu thần học và công nghệ#!"
  lesson_basics_traits_1:0 "Đặc Điểm ($lesson_basics_character$)"
  lesson_basics_traits_1_desc:2 "Các [characters|E] cũng có [traits|E], có thể ảnh hưởng đến [skills|E], cũng như cách họ phản ứng với mọi việc. Những điều này được minh họa bằng các biểu tượng trong Giao diện Nhân vật.\n\nMột vài Traits cho ngài biết về tính cách của một $game_concept_character$, như [GetTrait('fickle').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], hoặc [GetTrait('generous').GetName( GetNullCharacter )]. Các Traits khác dành riêng cho cách một $game_concept_character$ đã sống cuộc đời của họ, chẳng hạn như [tutorial_education_trait|E] hoặc [commander_traits|E].\n\n#TUT Ngài là:\n@temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )]\n@gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )]\n@impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )]\n\nKhi một Nhân vật chọn hành xử trái với các Traits tính cách của họ, điều đó có thể gây ra [stress|E] cho họ.#!"
  lesson_basics_traits_2:0 "Đặc Điểm ($lesson_basics_character$)"
  lesson_basics_traits_2_desc:1 "[traits|E] cũng có thể ảnh hưởng đến cách các [characters|E] khác phản ứng với #EMP Ngài#!.\n\nMột số người ấn tượng với Đặc Điểm @brave_icon! [GetTrait('brave').GetName( GetNullCharacter )], trong khi một Nhân Vật @lustful_icon! [GetTrait('lustful').GetName( GetNullCharacter )] lại dễ trở thành chủ đề của những lời đồn thổi dung tục...\n\n#TUT Đặc Điểm ảnh hưởng đến đạo đức và lòng tham của các Nhân Vật khác, từ đó tác động đến cả hành động thân thiện lẫn thù địch của họ.#!"
  lesson_basics_opinion:0 "Thiện Cảm ($lesson_basics_character$)"
  lesson_basics_opinion_desc:3 "Tất cả [characters|E] (đúng vậy, #EMP tất cả#!) đều có [opinion|E] về nhau, và điều này chi phối hành vi của họ.\n\n#N Thấp#! $game_concept_opinion$ có thể khiến người khác nổi dậy chống lại Ngài hoặc không muốn giúp đỡ. Ngược lại, #P Cao#! $game_concept_opinion$ có thể khiến $game_concept_characters$ sẵn sàng tham gia vào các [schemes|E] của Ngài hơn...\n\n#TUT Cách Ngài lựa chọn tương tác với các $game_concept_characters$ khác thường sẽ ảnh hưởng đến Thiện Cảm của họ đối với Ngài.#!"
 
 ### Resources
  lesson_basics_resources_1:0 "[gold_i|E] Vàng ($lesson_basics_resources$)"
  lesson_basics_resources_1_desc:2 "Để theo đuổi mục tiêu của mình, Ngài sẽ cần [gold|E]. Ngoài những thứ khác, $game_concept_gold$ dùng để chi trả cho [buildings|E], [armies|E] và hối lộ. $game_concept_gold$ được thu thập thụ động từ cả [holdings|E] lẫn [vassals|E] của Ngài dưới dạng [tax|E]. Các $game_concept_vassals$ lớn hơn và $game_concept_holdings$ quan trọng hơn thường mang lại nhiều $game_concept_tax$ hơn.\n\nTuy nhiên, tiền không mua được mọi thứ — một số việc chỉ có thể đạt được bằng cách tiêu tốn đủ [prestige|E] hoặc, đối với các vấn đề tôn giáo, là [piety|E].\n\n#TUT Ngài có thể xem tình trạng hiện tại của Vàng, Uy Danh và Lòng Mộ Đạo ở thanh phía trên bên phải.#!\n"
  lesson_basics_resources_2:0 "[prestige_i|E] Uy Danh ($lesson_basics_resources$)"
  lesson_basics_resources_2_desc:2 "[prestige|E] của Ngài cho biết mức độ được tôn trọng của Ngài. Nó có thể được tích lũy thụ động theo thời gian (ví dụ như khi nắm giữ nhiều [titles|E]) hoặc chủ động (chẳng hạn như [marrying|E] vào các [dynasties|E] danh giá hay tham chiến với tư cách [ally|E] trong các [wars|E]).\n\nMỗi khi Ngài kiếm được $game_concept_prestige$, Ngài sẽ tiến gần hơn đến [prestige_level|E] tiếp theo. Các $game_concept_prestige_levels$ cao hơn khiến các [characters|E] khác đánh giá Bạn Tốt hơn và mở ra những cách tiến hành $game_concept_war$ đầy quyền lực.\n\n#TUT Một số hành động sẽ #EMP tiêu tốn#! $game_concept_prestige$, như tuyên bố $game_concept_war$. Những hành động này cho phép Ngài tận dụng danh tiếng của mình vì lợi ích bản thân, và các $game_concept_characters$ sẽ không đánh giá thấp Ngài vì điều đó.\n\nViệc tiêu $game_concept_prestige$ không ảnh hưởng đến tiến trình $game_concept_prestige_level$, mà chỉ ảnh hưởng đến lượng $game_concept_prestige$ hiện tại của Ngài.#!"
  lesson_basics_resources_3:0 "[piety_i|E] Lòng Mộ Đạo ($lesson_basics_resources$)"
  lesson_basics_resources_3_desc:2 "Với lượng lớn [piety|E], Ngài sẽ dễ dàng hơn khi tương tác với [head_of_faith|E] của mình. Vì Ngài là $catholic_adherent$, người đó chính là Giáo hoàng.\n\n$game_concept_piety$ có thể được tích lũy thụ động từ [learning|E] [skill|E] và các [virtuous|E] [traits|E], hoặc chủ động thông qua các hành động mộ đạo, chẳng hạn như đi [pilgrimage|E].\n\nNgài cũng có một [piety_level|E], được xây dựng dần theo thời gian mỗi khi Ngài nhận được $game_concept_piety$, và có thể mang lại các hiệu ứng tích cực cho Nhân Vật của Ngài.\n\n#TUT Tương tự Uy Danh, một số hành động yêu cầu Ngài phải #EMP tiêu#! $game_concept_piety$, như tuyên bố [holy_wars|E] hoặc tạo ra một [faith|E] mới.\n\nViệc tiêu $game_concept_piety$ theo cách này là hoàn toàn bình thường, và các [characters|E] khác sẽ không đánh giá xấu Ngài vì điều đó.#!"

 # Lifestyles
  lesson_basics_lifestyles_1:0 "Lối Sống ($lesson_basics_lifestyles$)"
  lesson_basics_lifestyles_1_desc:1 "Bên cạnh [traits|E], [character|E] của Ngài còn có thể chọn một [lifestyle|E]. Có [SelectLocalization( HasDlcFeature( 'wandering_nobles' ), 'number_six', 'number_five' )] $game_concept_lifestyles$, mỗi cái tương ứng với một Kỹ Năng.\n\n$game_concept_lifestyles$ thể hiện điều mà Ngài tập trung nhiều nhất trong đời sống hằng ngày, và mỗi Lối Sống đều có nhiều [focuses|E] liên quan bên trong.\n\nMỗi $game_concept_focus$ mang lại một phần thưởng riêng và làm tăng khả năng xảy ra các sự kiện gắn liền với $game_concept_focus$ đó."
  lesson_basics_lifestyle_open_window_tt:2 "Nhấp vào nút Lối Sống (được làm nổi bật)"
  lesson_basics_lifestyles_2:0 "Trọng Tâm ($lesson_basics_lifestyles$)"
  lesson_basics_lifestyles_no_GUI_highlight:0 "$lesson_basics_lifestyles_2$"
  lesson_basics_lifestyles_2_desc:3 "Nhấp vào bất kỳ [lifestyle|E] nào để xem các [focuses|E] của nó.\n\nTheo thời gian, [character|E] của Ngài sẽ nhận được [lifestyle_experience|E] khi duy trì một $game_concept_lifestyle$ nhất định. Khi Ngài tích lũy đủ $game_concept_lifestyle_experience$, Ngài có thể chọn một trong các [perks|E] của $game_concept_lifestyle$ đó từ #EMP bất kỳ#! cây nào.\n\n$game_concept_perks$ đại diện cho việc Ngài rèn luyện và phát triển bản thân theo thời gian, mang lại các phần thưởng độc đáo (như các Đặc Điểm đặc biệt) hoặc mở khóa các cơ chế và nội dung riêng của $game_concept_lifestyle$ (chẳng hạn như khả năng khởi động các [GetScheme('abduct').GetTypeName] [schemes|E]).$lesson_basics_lifestyles_2_reuse$"
  lesson_basics_lifestyles_2_reuse:1 "\n\n#TUT Ví dụ, các Trọng Tâm $martial_strategy_focus_short$, $martial_authority_focus_short$ và $martial_chivalry_focus_short$ đều mang lại Kinh Nghiệm Quân Sự, có thể dùng để mở bất kỳ [perks|E] nào thuộc Lối Sống Quân Sự.\n\nHoàn thành các cây Đặc Quyền sẽ dẫn đến những Đặc Điểm Lối Sống khác nhau!#!"
  lesson_basics_lifestyle_choose_focus_tt:0 "Chọn một Trọng Tâm"
  lesson_basics_lifestyles_2_b:0 "$lesson_basics_lifestyles_2$"
  lesson_basics_lifestyles_2_b_desc:0 "Sau khi đã chọn một [focus|E], hẳn Ngài cũng đoán được rằng [character|E] của Ngài sẽ nhận được [lifestyle_experience|E] theo thời gian. $lesson_basics_lifestyles_2_reuse$"
 
# Interacting
  lesson_basics_interacting_1:0 "Nhân Vật Khác ($lesson_basics_interacting$)"
  lesson_basics_interacting_1_desc:1 "Giờ thì, sau khi đã chọn [focus|E], chúng ta chuyển sang những người khác! Tương tác với các [characters|E] khác là yếu tố then chốt trong Crusader Kings III, và Ngài có rất nhiều lựa chọn để làm điều đó.\n\n#TUT Ngài có thể nhấp chuột phải vào chân dung một Nhân Vật, kể cả của chính mình, để xem danh sách các [interactions|E] có thể thực hiện, như sắp xếp một [marriage|E] hoặc khởi động một [scheme|E]. Đây cũng là nơi Ngài bắt đầu các [wars|E], nhưng ta sẽ để chuyện đó lại sau.#!"
  lesson_basics_open_character_view_tt:0 "Mở giao diện Nhân Vật của Ngài"
  lesson_basics_open_interactions_tt:2 "Nhấp chuột phải vào chân dung $game_concept_character$ của [player_heir|E] để xem các Tương tác khả dụng"
  lesson_basics_interacting_2:0 "Gửi Quà ($lesson_basics_interacting$)"
  lesson_basics_interacting_2_desc:2 "Hãy bắt đầu với điều cơ bản — ai cũng thích vàng! Thử gửi một khoản hối lộ cho [player_heir|E] của Ngài.\n\n#TUT Hầu hết các [interactions|E] khi được chọn sẽ mở ra một cửa sổ thứ hai với thông tin chi tiết. Ngài có thể xác nhận hoặc hủy hành động trong cửa sổ này.#!"
  lesson_basics_send_gift_tt:2 "Xác nhận Tương Tác #TUT_KW Gửi Quà#! với $game_concept_heir$ của Ngài"
  lesson_basics_interacting_3:0 "Đã Gửi Quà ($lesson_basics_interacting$)"
  lesson_basics_interacting_3_desc:1 "Tốt lắm! Ngài đã thành công #P tăng#! [opinion|E] của ai đó đối với mình.\n\n#TUT Hãy chú ý đến #bold thông báo nhật ký#! ở góc dưới bên phải — đây là nơi hiển thị các thông tin #EMP thú vị nhưng không quan trọng#!, và chúng sẽ tự biến mất sau một thời gian khi trò chơi được tiếp tục.#!\n\nMột số hiệu ứng Thiện Cảm tồn tại vĩnh viễn, như mối quan hệ gia đình. Những hiệu ứng khác sẽ phai nhạt theo thời gian, chẳng hạn như ký ức mờ dần về việc từng nhận được một món quà bằng tiền...\n\n#TUT Nếu Ngài di chuột lên con số Thiện Cảm của một Nhân Vật khác, Ngài có thể xem chính xác các giá trị đó đến từ đâu. Là do liên minh hôn nhân, món quà bằng vàng, hay đơn giản là vì họ trân trọng bản tính trung thực của Ngài?#!"

# Generational Gameplay
  lesson_basics_many_lives_1:0 "Chơi Qua Nhiều Thế Hệ ($lesson_basics_succession$)"
  lesson_basics_many_lives_1_desc:2 "Tiếp theo, hãy nói về [dynasty|E] của Ngài. Khi trò chơi tiếp diễn, trừ khi [character|E] của Ngài gặp phải một \"tai nạn\" bất ngờ hay căn bệnh khủng khiếp, họ sẽ già đi và cuối cùng qua đời.\n\n#TUT Câu chuyện chưa kết thúc ở đó — chỉ khi Ngài không có người thừa kế thuộc Chính Triều Đại của mình thì mới là [game_over|E]!#!"
  lesson_basics_many_lives_2:0 "Người Thừa Kế ($lesson_basics_succession$)"
  lesson_basics_many_lives_2_no_GUI_highlight:0 "$lesson_basics_many_lives_2$"
  lesson_basics_many_lives_2_desc:5 "Miễn là các [titles|E] của ngài có [heirs|E] thuộc [dynasty|E] của ngài, di sản của ngài sẽ còn sống mãi. Khi [character|E] hiện tại của ngài qua đời, ngài chỉ cần bắt đầu chơi một nhân vật mới: [player_heir|E].\n\nTùy thuộc vào loại [succession|E] mà [realm|E] của ngài có, đây nhiều khả năng sẽ là một trong những đứa con của ngài — có lẽ là đứa trẻ mà ngài đã chăm chút để [Concept( 'ruler', 'Rule' )|E]?\n\n#TUT $game_concept_dynasty$ của ngài có huy hiệu riêng, hiện đang được làm nổi bật và có thể nhấp vào để biết thêm thông tin.\n\nNgài không cần phải làm bất cứ điều gì với việc này bây giờ, nhưng nếu ngài muốn xem chi tiết về $game_concept_dynasty$ của mình sau này, ngài có thể tìm thấy ở đây.\n\n#!"

# Succession Laws 
  lesson_basics_succession_laws:0 "Luật Kế Vị ($lesson_basics_succession$)"
  lesson_basics_succession_laws_desc:0 "[succession_laws|E] quyết định cách tất cả [titles|E] và tài nguyên được phân chia giữa các [heirs|E] khi một [character|E] qua đời. Hiện tại Ngài chỉ có một Người Thừa Kế, nhưng dù vậy ta vẫn cứ xem qua!\n\n#TUT Trong một số trường hợp, khi Ngài tiếp quản Nhân Vật mới, Ngài thậm chí có thể phát hiện ra rằng họ chịu trách nhiệm cho cái chết đột ngột của Người Cai Trị trước đó...#!"
  lesson_basics_succession_tab_tt:0 "Xem thẻ Kế Vị"
  lesson_basics_succession_laws_complete_2:0 "$lesson_basics_succession_laws$"
  lesson_basics_succession_laws_complete_2_desc:0 "$lesson_basics_succession_laws_desc$"
  lesson_basics_renown:0 "Danh Vọng ($lesson_basics_succession$)"
  lesson_basics_renown_no_GUI_highlight:0 "$lesson_basics_renown$"
  lesson_basics_renown_no_GUI_highlight_2:0 "$lesson_basics_renown$"
  lesson_basics_renown_desc:2 "Là một thành viên của [dynasty|E], Ngài cũng có [dynasty_prestige|E]. Được chia sẻ bởi tất cả mọi người trong $game_concept_dynasty$, $game_concept_dynasty_prestige$ tăng lên theo nhiều cách khác nhau và phản ánh mức độ (vô) danh tiếng của #EMP Triều Đại#! Ngài, chứ không chỉ riêng Ngài.\n\nViệc tăng $game_concept_dynasty_prestige$ sẽ vang vọng qua nhiều thế hệ hậu duệ, nâng cao [dynasty_prestige_level|E] của Ngài. Với tư cách là [dynast|E] (thành viên quyền lực nhất của $game_concept_dynasty$), Danh Vọng cho phép Ngài mở khóa các [dynasty_perks|E] mang lại lợi ích cho toàn bộ dòng họ.\n\n#TUT Để xem $game_concept_dynasty_perk$ của một Triều Đại, hãy nhấp vào huy hiệu Triều Đại của họ.#!"

# Marriage
  lesson_basics_marriage_concept_1:0 "Hôn Nhân ($lesson_basics_marriage$)"
  lesson_basics_marriage_concept_1_desc:1 "Để đảm bảo tương lai cho [dynasty|E] của Ngài, Ngài cần có các thành viên trong gia đình. Việc [married|E] là một khởi đầu tốt, nhưng chúng Ta không thể hứa rằng Ngài sẽ kết hôn vì tình yêu. @arrange_marriage_icon!"
  lesson_basics_marriage_concept_2:0 "Tìm Phối Ngẫu ($lesson_basics_marriage$)"
  lesson_basics_marriage_concept_2_b:0 "$lesson_basics_marriage_concept_2$"
  lesson_basics_marriage_concept_2_desc:1 "Hãy kết hôn nào!\n\nĐối với các Nhân Vật chưa kết hôn trong [domain|E] của Ngài, Ngài có thể sắp xếp [marriages|E] (hoặc [betrothals|E]) bằng cách nhấp chuột phải vào Nhân Vật và chọn #TUT_KW Tìm Phối Ngẫu#! hoặc #TUT_KW Sắp Xếp Hôn Nhân#!.\n\n#TUT Hai tùy chọn này hoạt động khác nhau, vì vậy chúng ta sẽ lần lượt xem cả hai...#!"
  lesson_basics_marriage_concept_2_b_desc:1 "Vì Nhân Vật của Ngài đã kết hôn, hãy để chúng Ta hướng dẫn Ngài các bước liên quan.\n\nĐối với các Nhân Vật chưa kết hôn trong [domain|E] của Ngài, Ngài có thể sắp xếp [marriages|E] (hoặc [betrothals|E]) bằng cách nhấp chuột phải vào Nhân Vật và chọn #TUT_KW Tìm Phối Ngẫu#! hoặc #TUT_KW Sắp Xếp Hôn Nhân#!.\n\n#TUT Ngài không cần phải kết hôn thêm cho ai cả, nhưng việc chọn #TUT_KW Tìm Phối Ngẫu#! sẽ mở giao diện Hôn Nhân cho chúng ta.#!"
  lesson_basics_marriage_instruction_open_window:0 "$lesson_basics_marriage_concept_1$"
  lesson_basics_marriage_instruction_open_window_desc:0 "Hãy tìm người để Nhân Vật của Ngài kết hôn!"
  lesson_basics_open_interactions_marriage_tt:0 "Nhấp chuột phải vào chính Nhân Vật của Ngài"
  lesson_basics_open_interactions_marriage_alt_tt:0 "Nhấp chuột phải vào một Nhân Vật #EMP chưa kết hôn#!"
  lesson_basics_marriage_view_tt:1 "Chọn #TUT_KW Tìm Phối Ngẫu#!"
  lesson_basics_find_spouse_concept:0 "Chọn Phối Ngẫu ($lesson_basics_marriage$)"
  lesson_basics_find_spouse_concept_desc:1 "Việc chọn #TUT_KW Tìm Phối Ngẫu#! sẽ mở ra danh sách các [spouses|E] tiềm năng — họ đến từ các [courts|E] khắp thế giới!\n\nViệc chọn #TUT_KW Sắp Xếp Hôn Nhân#! cũng mở danh sách các [spouses|E] tiềm năng, nhưng chỉ giới hạn trong [court|E] của Nhân Vật Ngài đã nhấp vào.\n\n#TUT Nhân Vật của chính Ngài hiển thị bên trái, vì cuộc hôn nhân này cần #EMP sự chấp thuận của Ngài#!. Người là [liege|E] của phối ngẫu còn lại sẽ xuất hiện bên phải, vì cuộc hôn nhân cũng cần sự đồng ý của họ.\n\n#TUT_KW Sắp Xếp Hôn Nhân#! rất hữu ích khi ghép đôi các [courtiers|E] của Ngài hoặc khi thiết lập một [alliance|E] hôn nhân cụ thể. Hiện tại, #TUT_KW Tìm Phối Ngẫu#! phù hợp hơn cho mục đích của chúng ta.#!"
  lesson_basics_arrange_marriage_concept:0 "Sắp Xếp Hôn Nhân ($lesson_basics_marriage$)"
  lesson_basics_arrange_marriage_concept_desc:0 "\n\n#TUT Điều này hữu ích để ghép đôi các [courtiers|E] của Ngài hoặc để thiết lập một [alliance|E] hôn nhân cụ thể.#!"
  lesson_basics_choosing_a_spouse:0 "Bộ Lọc Nhân Vật ($lesson_basics_marriage$)"
  lesson_basics_choosing_a_spouse_no_GUI_highlight:0 "$lesson_basics_choosing_a_spouse$"
  lesson_basics_choosing_a_spouse_desc:2 "Có rất nhiều yếu tố cần cân nhắc khi chọn một [spouse|E]. Để hỗ trợ Ngài, có một chức năng lọc (được làm nổi bật) giúp thu hẹp danh sách ứng viên. Các yếu tố bao gồm khả năng hình thành [alliances|E], [skills|E], các [traits|E] tính cách, [fertility|E] dự kiến, và nhiều yếu tố khác.\n\nMột số Đặc Điểm là [congenital|E], nghĩa là chúng có thể được truyền lại cho con cái của Ngài — có lẽ một Nhân Vật sở hữu Đặc Điểm như vậy là điểm khởi đầu tốt?\n\n#TUT Ngài có thể thay đổi lựa chọn bằng cách nhấp nút #TUT_KW Xóa Nhân Vật#! ở giữa hai Nhân Vật đang được ghép hôn. Sẽ không có gì xảy ra cho đến khi Ngài nhấp #TUT_KW Gửi Đề Nghị#!.#!"
  send_marriage_proposal_button_name:0 "Gửi Đề Nghị"
  lesson_basics_say_yes:0 "Gửi Đề Nghị ($lesson_basics_marriage$)"
  lesson_basics_said_yes:0 "$lesson_basics_say_yes$"
  lesson_basics_say_yes_desc:1 "Khi Ngài đã chọn hai Nhân Vật cho một [marriage|E], Ngài sẽ được xem chi tiết của cuộc hôn nhân, cùng với các tùy chọn bổ sung như việc hôn nhân có phải là [matrilineal|E] hay không.\n\n#TUT Nếu Ngài hài lòng với cuộc hôn nhân này, hãy gửi đề nghị. Hành động này thường mất vài ngày, nhưng trong phần hướng dẫn, chúng Ta sẽ khiến nó diễn ra ngay lập tức.#!"
  lesson_basics_get_married_tt:1 "Kết hôn — chọn Phối Ngẫu cho Nhân Vật của Ngài và nhấp #TUT_KW Gửi Đề Nghị #! để đề xuất cuộc hôn nhân"
  lesson_basics_already_married:0 "$lesson_basics_marriage_concept_1$"
  lesson_basics_already_married_desc:0 "Mỗi khi Ngài thiết lập một [marriage|E] giữa các [characters|E], bước cuối cùng trước khi gửi đề nghị sẽ hiển thị chi tiết cuộc hôn nhân, cùng với các tùy chọn bổ sung như việc hôn nhân có phải là [matrilineal|E] hay không.\n\n#TUT Nhân Vật của Ngài đã kết hôn rồi — làm tốt lắm!#!"
  lesson_basics_marriage_final_notes:0 "Chúc Mừng! ($lesson_basics_marriage$)"
  lesson_basics_marriage_final_notes_desc:3 "Tuyệt vời! Chúc hai Ngài sống lâu và hạnh phúc bên nhau!\n\n#TUT Ngài có thể đã nhận thấy #bold thông báo Toast#! ở phía trên màn hình — các thông báo Toast cung cấp thông tin nhanh, liên quan trực tiếp đến Ngài hoặc Nhân Vật của Ngài. Các [marriages|E] thường cũng đi kèm với một #bold Sự Kiện#! khi [liege|E] của [spouse|E] tiềm năng chấp thuận (hoặc từ chối) đề nghị của Ngài bằng một bức thư. Có nhiều loại sự kiện khác nhau và chúng đóng vai trò quan trọng trong việc định hình số phận của Ngài, vì vậy hãy chú ý theo dõi!#!\n\nTrong phần hướng dẫn này, chúng Ta khuyên Ngài cũng nên sử dụng #TUT_KW Tìm Phối Ngẫu#! cho con trai của mình.\n\n#TUT Ngay khi con trai Ngài kết hôn, cậu ta có thể bắt đầu sinh ra các thành viên trong gia đình (và các [heirs|E] cho [titles|E] của Ngài thuộc [dynasty|E] của Ngài).#!"

# Dynasty & House
  lesson_basics_dynasty_and_house:0 "Triều Đại và Gia Tộc ($lesson_basics_titles$)"
  lesson_basics_dynasty_and_house_desc:0 "Gia đình là điều vô cùng quan trọng! [player_heir|E] của Ngài sẽ luôn xuất thân từ [dynasty|E] của Ngài, và trong hầu hết các trường hợp là từ [house|E] của Ngài.\n\n#TUT Trong tương lai, việc theo dõi gia đình của Ngài — và #EMP thứ tự kế vị#! ([line_of_succession|E]) của họ — sẽ không bao giờ là thừa. Tùy thuộc vào [succession_laws|E], Ngài có thể sẽ thừa kế các [titles|E] (cùng với đất đai và [vassals|E]) từ người thân của mình.#!"

# Titles & Holdings
  lesson_basics_landed_titles:0 "Đất Đai và Tước Hiệu ($lesson_basics_titles$)"
  lesson_basics_landed_titles_desc:2 "Không phải mọi thành viên trong [dynasty|E] của Ngài đều sở hữu đất đai, nhưng mọi mảnh đất trên bản đồ #EMP đều#! có chủ sở hữu.\n\nĐôi khi người đó là Ngài, đôi khi là một trong các [vassals|E] của Ngài, và đôi khi là một [realm|E] hoàn toàn khác (nhiều người trong số đó cũng có — hoặc chính là — $game_concept_vassals$)."
  lesson_basics_de_jure_titles:0 "Tước Hiệu ($lesson_basics_titles$)"
  lesson_basics_de_jure_titles_desc:4 "Phần lớn các [titles|E] tồn tại trong một hệ thống phân cấp giống hình kim tự tháp, dựa theo $game_concept_title$ [title_tier|E]:\n\n[barony|E] — do Nam Tước hoặc Nữ Nam Tước cai trị\n[county|E] — do Bá Tước hoặc Nữ Bá Tước cai trị\n[duchy|E] — do Công Tước hoặc Nữ Công Tước cai trị\n[kingdom|E] — do Quốc Vương hoặc Nữ Vương cai trị\n[empire|E] — do Hoàng Đế hoặc Nữ Hoàng cai trị\n\nMỗi $game_concept_title$ về mặt pháp lý đều thuộc về một $game_concept_title$ ở cấp $game_concept_title_tier$ cao hơn — ví dụ, mỗi $game_concept_county$ đều là một phần của một $game_concept_duchy$.\n\n#TUT Lưu ý: Có rất nhiều tên gọi động cho các Tước Hiệu — [ruler|E] hiện tại của Ngài đang cai trị một \"Tiểu Vương Quốc\", tương ứng với cấp [duchy|E].#!"
  lesson_basics_de_jure_cbs:0 "De Jure $lesson_basics_de_jure_titles$"
  lesson_basics_de_jure_cbs_desc:4 "Chúng ta nói \"về mặt pháp lý\" bởi vì trong Crusader Kings III — nơi Ngài có thể thay đổi lịch sử — không có gì đảm bảo rằng một [king|E] #EMP thực sự#! kiểm soát toàn bộ các [titles|E] mà [kingdom|E] của ông ta \"lẽ ra\" phải bao gồm.\n\nChúng ta gọi hệ thống phân cấp $game_concept_title$ này là [de_jure|E], và nếu cấu trúc đó bị phá vỡ, thường Ngài có thể tuyên chiến để đòi lại các lãnh thổ bị sai lệch.\n\n#TUT Nếu Ngài chuyển sang chế độ bản đồ Tước Hiệu Công Quốc, Ngài sẽ thấy rằng với tư cách là người cai trị [duchy|E] $d_munster$, [county|E] $c_desmond$ về mặt pháp lý đáng lẽ phải thuộc về lãnh thổ của Ngài.#!"
  lesson_basics_de_jure_cbs_complete_1:0 "$lesson_basics_de_jure_cbs$"
  lesson_basics_de_jure_cbs_complete_2:0 "$lesson_basics_de_jure_cbs$"
  lesson_basics_change_map_mode_1_tt:1 "Chuyển sang chế độ bản đồ Tước Hiệu Công Quốc"
  lesson_basics_change_map_mode_2_tt:0 "Quay lại chế độ bản đồ Lãnh Thổ"
  lesson_basics_holdings_and_buildings:0 "Lãnh Địa Của Ngài ($lesson_basics_holdings$)"
  lesson_basics_holdings_and_buildings_desc:3 "Tước Hiệu [de_jure|E] của Munster bao gồm bốn [counties|E]. Tên của chúng hiển thị trên bản đồ: $c_thomond$ và $c_ennis$ (do Ngài nắm giữ), $c_desmond$ (do một [ruler|E] láng giềng  nắm giữ), và $c_ormond$ (do một [vassal|E] của Ngài nắm giữ).\n\nCác [counties|E] này được chia thành những mảnh đất nhỏ hơn — các [baronies|E], tức các [holdings|E] riêng lẻ trong một [realm|E].\n\n#TUT Holdings đại diện cho các khu định cư trong lãnh thổ của Ngài!#!"
  lesson_basics_buildings:0 "Công Trình ($lesson_basics_holdings$)"
  lesson_basics_buildings_no_GUI_highlight:0 "Công Trình ($lesson_basics_holdings$)"
  lesson_basics_buildings_desc:3 "[holdings|E] cung cấp các mức [taxes|E] và [levies|E] khác nhau, đồng thời có các [buildings|E] mà Ngài có thể xây dựng và nâng cấp, tùy thuộc vào [holding_type|E].\n\n#TUT Chúng Ta khuyên Ngài nên bắt đầu bằng việc nâng cấp #TUT_KW $building_curtain_walls_01$#.#!#!"
  lesson_basics_start_construction_tt:1 "Nhấp vào Holding Thủ Phủ của Ngài ($cn_luimneach$), chọn #TUT_KW $building_curtain_walls_01$#! trong danh sách công trình và #TUT_KW Nâng Cấp#!"
  lesson_basics_buildings_complete:0 "$lesson_basics_holdings_and_buildings$"
  lesson_basics_buildings_complete_desc:1 "Làm tốt lắm! Tuy nhiên, sẽ cần một khoảng thời gian để [building|E] hoàn thành — $cn_luimneach$ không được xây trong một ngày... Ngài có thể đóng cửa sổ xây dựng #EMP $building_type_curtain_walls_01$#!.\n\n#TUT Khi công trình hoàn tất, Ngài sẽ nhận được các lợi ích từ Công Trình hoặc Nâng Cấp mà Ngài đã chọn.#!"
  lesson_basics_taxes:0 "Thuế Khóa ($lesson_basics_holdings$)"
  lesson_basics_taxes_desc:1 "Mỗi [holding|E] đều cung cấp [taxes|E] cho [holder|E] của nó. Nếu người đó là một [vassal|E], họ sẽ tiếp tục nộp Thuế cho [liege|E] của mình.\n\nThuế là nguồn [gold_i] [gold|E] [income|E] chính của Ngài!\n\n#TUT [obligations|E] có thể ảnh hưởng đến mức Thuế cao hay thấp. Việc đang trong tình trạng [war|E] có thể làm giảm mức [control|E] của một [county|E], từ đó ảnh hưởng đến Thuế.#!"

#Vassals
  lesson_basics_vassals_concept:0 "Chư Hầu ($lesson_basics_vassals$)"
  lesson_basics_realm_view_tt:2 "Mở giao diện Lãnh Thổ ở phía bên phải màn hình (được làm nổi bật)"
  lesson_basics_vassals_tab_tt:0 "Xem thẻ Chư Hầu"
  lesson_basics_vassals_concept_desc:3 "Với tư cách là một [ruler|E], Ngài gần như chắc chắn sẽ là [liege|E] của ít nhất một [vassal|E]. Đây là các $game_concept_rulers$ đã thề trung thành với Ngài và vì thế thuộc về [realm|E] của Ngài.\n\n#TUT Chư Hầu cung cấp cho Ngài [gold|E] ([taxes|E]) và binh lính ([levies|E]).\n\nMột Nhân Vật hoàn toàn có thể vừa là $game_concept_liege$, vừa là $game_concept_vassal$ cùng lúc.#!"
  lesson_basics_vassals_concept_complete_2:0 "$lesson_basics_vassals_concept$"

  lesson_basics_vassals_concept_great_job:0 "$lesson_basics_vassals_concept$"
  lesson_basics_vassals_concept_great_job_desc:2 "Đây là danh sách các [vassals|E] hiện tại của Ngài, cùng với một số thông tin bổ sung về họ.\n\nỞ đầu danh sách là [ruler|E] của $c_ormond$, lãnh thổ của ông ta có thể thấy trên bản đồ — đây là một Bá Quốc (một [title|E] cấp [county|E]) nằm trong [realm|E] của Ngài.\n\n#TUT Tại đây, Ngài có thể xem tổng quan các thông tin như [opinion|E] hiện tại của Chư Hầu đối với Ngài, liệu họ có phải là [powerful_vassal|E] hay không, cũng như mức [taxes|E] và [levies|E] họ đang cung cấp.#!"
  lesson_basics_vassals_concept_greyed_out:0 "$lesson_basics_vassals_concept$"
  lesson_basics_vassals_concept_greyed_out_desc:0 "Đây cũng là nơi Ngài có thể thay đổi [vassal_contracts|E], thứ quyết định một Chư Hầu Phong Kiến sẽ cung cấp cho Ngài bao nhiêu [levies|E] và [taxes|E]."

  lesson_basics_happy_vassals:0 "$lesson_basics_vassals_concept$"
  lesson_basics_happy_vassals_desc:2 "Việc giữ cho [vassals|E] của Ngài hài lòng là vô cùng quan trọng — điều này giúp họ không tham gia vào các [schemes|E] hay [factions|E] chống lại Ngài.\n\nDù [ruler|E] của Ngài có quyền lực đến đâu, nếu toàn bộ [realm|E] liên kết chống lại Ngài — dù là để [depose|E] Ngài bằng [war|E] hay đơn giản là [GetScheme('murder').GetTypeName] Ngài trong lúc ngủ — thì triều đại của Ngài cũng sẽ sớm kết thúc.\n\n#TUT Một số Chư Hầu của Ngài có thể phục vụ trong [council|E], khiến [opinion|E] của họ càng trở nên quan trọng, vì họ sẽ được giao phó các [councillor_tasks|E].#!"
  lesson_basics_vassal_limit:0 "Giới Hạn Chư Hầu ($lesson_basics_vassals$)"
  lesson_basics_vassal_limit_desc:2 "Có một giới hạn về số lượng [vassals|E] mà Ngài có thể quản lý hiệu quả trước khi [realm|E] trở nên cồng kềnh. Việc vượt quá [vassal_limit|E] sẽ làm giảm lượng [taxes|E] và [levies|E] mà Ngài nhận được.\n\nĐiều này chưa quan trọng trong phần hướng dẫn, nhưng khi Ngài bắt đầu xây dựng vương quốc của riêng mình, hãy cẩn thận với việc bành trướng quá nhanh.\n\n#TUT Nếu Ngài vượt quá Giới Hạn Chư Hầu, Ngài có thể ban các Tước Hiệu cấp thấp hơn cho Chư Hầu. Đôi khi, Ngài thậm chí có thể [create|E] #EMP các#! Tước Hiệu cấp [title_tier|E] cao mới để củng cố quyền lực trong một khu vực và tăng cường sự kiểm soát đối với các Tước Hiệu [de_jure|E] cấp thấp hơn trực thuộc Tước Hiệu mới đó.#!"

# Domain
  lesson_basics_domain_1:0 "Lãnh Thổ và Lãnh Địa ($lesson_basics_domain$)"
  lesson_basics_domain_1_desc:3 "#EMP [realm|E]#! của ngài là toàn bộ vùng đất và [titles|E] mà ngài kiểm soát, bao gồm cả các khu vực do [vassals|E] của ngài nắm giữ. Ngay lúc này, đối với ngài, điều này có nghĩa là các [counties|E] (gọi là 'Earldoms', do [culture|E] Ireland của ngài) $c_ennis$, $c_thomond$ và $c_ormond$.\n\nKhi từ #EMP [domain|E]#! được sử dụng, chúng ta đang đề cập đến vùng đất mà ngài sở hữu cá nhân, không có các $game_concept_vassals$: $c_ennis$ và $c_thomond$.\n\n#TUT Một số việc xảy ra sẽ chỉ ảnh hưởng đến [domain|E] của ngài ($c_ennis$ và $c_thomond$), trong khi những việc khác sẽ tác động đến toàn bộ [realm|E] của ngài, [duchy|E] (hoặc 'Tiểu Vương quốc') của Munster.#!"
  lesson_basics_domain_1_b:0 "Lãnh Thổ và Lãnh Địa ($lesson_basics_domain$)"
  lesson_basics_domain_1_b_desc:0 "Ví dụ: [county|E] Essex đang gặp tình trạng suy giảm số lượng binh lính do khu vực này bị #EMP kẻ ăn thịt người#! tràn vào. [holder|E] của Essex sẽ được thông báo vì đây là phần nằm trong [domain|E] của họ. [liege|E] của họ thì không.\n\n#TUT #EMP Liege#! của Bá Tước Essex vẫn có Essex trong [realm|E] của mình, và chỉ biết chuyện nếu họ nhấp vào Quận trên bản đồ để xem hiệu ứng, hoặc nếu họ nhận ra Chư Hầu đó đang cung cấp ít Levies hơn.#!"
  lesson_basics_domain_2:0 "$lesson_basics_domain_1$"
  lesson_basics_domain_2_desc:2 "Lưu ý rằng có một giới hạn về lượng đất Ngài có thể trực tiếp sở hữu trước khi bị phạt: đó là [domain_limit|E].\n\n#TUT Khi vượt quá Giới Hạn Lãnh Địa, việc sử dụng tương tác #TUT_KW Ban Tước Hiệu#! cho các [characters|E] thân thiện để biến họ thành [vassals|E] của Ngài là một ý hay.\n\nDo hiện tại Ngài không có Tước Hiệu dư để ban, Ngài chưa thể làm điều này, nhưng trong các tình huống khác, Ngài sẽ tìm thấy tùy chọn này trong menu $game_concept_character$, hiển thị khi nhấp chuột phải vào một $game_concept_character$.#!"

# Council
  lesson_basics_council_concept:0 "Hội Đồng ($lesson_basics_council$)"
  lesson_basics_council_concept_desc:1 "Quản lý một [realm|E] là một công việc nặng nề. Với tư cách là [ruler|E], Ngài có sự trợ giúp từ [council|E] — họ có thể là [vassals|E] hoặc thành viên trong [court|E] của Ngài, và đóng vai trò là những cố vấn đáng tin cậy.\n\n#TUT Mỗi [skill|E] đều có một vị trí Hội Đồng tương ứng, và các [rulers|E] đã kết hôn cũng sẽ nhận được sự hỗ trợ từ [spouse|E] của mình.#!"
  lesson_basics_council_view_tt:1 "Mở giao diện Hội Đồng (được làm nổi bật)"
  lesson_basics_council_tasks:0 "Nhiệm Vụ Hội Đồng ($lesson_basics_council$)"
  lesson_basics_council_tasks_desc:1 "[councillors|E] có thể được giao nhiệm vụ, và mỗi người sẽ thực hiện các công việc khác nhau!\n\nNgài có thể thay đổi nhiệm vụ của một Cố Vấn bằng cách nhấp vào nút bên cạnh chân dung của họ trong giao diện Hội Đồng.\n\n#TUT Trở thành Cố Vấn là một vị trí danh giá — các [powerful_vassals|E] mong đợi được bổ nhiệm và sẽ không hài lòng nếu bị bỏ qua.#!"

# Schemes & Hooks
  lesson_basics_schemes_concept:0 "Âm Mưu ($lesson_basics_schemes$)"
  lesson_basics_schemes_concept_complete:0 "$lesson_basics_schemes_concept$"
  lesson_basics_schemes_concept_desc:4 "[schemes|E] là các mục tiêu dài hạn, nhắm vào một Nhân Vật khác. Chúng có thể mang tính thù địch, như cố gắng [GetScheme('murder').GetTypeName] hoặc [GetScheme('abduct').GetTypeName] mục tiêu, hoặc mang tính tích cực hơn, như Âm Mưu [GetScheme('befriend').GetTypeName]."
  lesson_basics_intrigue_view_tt:0 "Mở giao diện Âm Mưu (được làm nổi bật)"
  lesson_basics_schemes_tab_tt:1 "Xem thẻ Âm Mưu (mặc định đã mở)"
  lesson_basics_hooks_and_secrets_tab_tt:0 "Xem thẻ Móc Nợ và Bí Mật"
  lesson_basics_schemes_murder:0 "$lesson_basics_schemes_concept$"
  lesson_basics_schemes_murder_desc:3 "Một thời điểm tốt để sử dụng [scheme|E] là khi Ngài thấy [line_of_succession|E] không rõ ràng hoặc không thuận lợi — một cách để đi trước là đơn giản #EMP loại bỏ#! đối thủ.\n\nÂm thầm, và không để lại nhân chứng.\n\n#TUT Một âm mưu [GetScheme('murder').GetTypeName] luôn tiềm ẩn nguy cơ bị phát hiện. Nếu thất bại, nó sẽ khiến [character|E] của Ngài trở nên mất thiện cảm — đặc biệt là với mục tiêu của Ngài.#!"
  lesson_basics_schemes_sway:0 "$lesson_basics_schemes_concept$"
  lesson_basics_schemes_sway_desc:0 "Âm Mưu Lấy Lòng ([scheme|E] Sway) được dùng để tăng [opinion|E] của người khác đối với Nhân Vật của Ngài. Hãy thử xem!"
  lesson_basics_schemes_sway_complete:0 "$lesson_basics_schemes_concept$"
  lesson_basics_schemes_sway_complete_desc:2 "Tuyệt vời! Khi đã khởi động, [scheme|E] của Ngài sẽ dần tiến triển theo thời gian. Thời gian để đạt kết quả phụ thuộc vào [success_chance|E] của Âm Mưu, thứ có thể bị ảnh hưởng bởi các [skills|E] liên quan — trong trường hợp này là [diplomacy|E] của Ngài.\n\n#TUT Nếu Ngài không hài lòng với Âm Mưu đang diễn ra, Ngài luôn có thể hủy nó bằng cách nhấp nút #bold Hủy Âm Mưu#! (#TUT_KW X#!) bên cạnh.#!"
  tutorial_basic_schemes_start_swaying_tt:2 "Nhấp chuột phải vào [court_chaplain|E] của Ngài (\"$councillor_court_chaplain_theocrat_duchy$\") và chọn #TUT_KW Lấy Lòng (Âm Mưu)#!"
  lesson_basics_hooks:0 "Bí Mật ($lesson_basics_schemes$)"
  lesson_basics_hooks_desc:3 "Đôi khi [schemes|E] có thể tạo ra các [secrets|E] — nếu Ngài bắt gặp ai đó đang cố [GetScheme('murder').GetTypeName] người khác, có lẽ việc giữ im lặng là vì lợi ích của họ.\n\nNgài cũng có thể [blackmail|E] họ để giành lấy một [hook|E]! $game_concept_hooks$ đại diện cho một ân huệ hoặc sự ràng buộc Ngài có đối với một [character|E], cho phép Ngài thuyết phục (hoặc ép buộc) họ làm theo ý mình.\n\nTrong quá trình chơi, Ngài sẽ tìm ra nhiều cách khác nhau để giành và sử dụng $game_concept_hooks$. Hãy thử nghiệm chúng!\n\n#TUT Tiếp theo, hãy giả sử rằng Ngài đã có được một [hook|E] đối với một trong các [vassals|E] của mình...#!"
  lesson_basics_hooks_complete:0 "Móc Nợ ($lesson_basics_schemes$)"
  lesson_basics_hooks_complete_desc:4 "[weak_hook|E] này có thể được sử dụng cho nhiều mục đích. Ví dụ, Ngài có thể tăng [obligations|E] trong [vassal_contract|E] giữa Ngài và một [vassal|E] thuộc chính quyền [GetGovernment('feudal_government').GetName].\n\n#TUT Để truy cập menu chỉnh sửa Khế Ước Chư Hầu, hãy vào danh sách Chư Hầu trong giao diện Lãnh Thổ, hoặc nhấp chuột phải vào chân dung của họ và chọn #TUT_KW Chỉnh Sửa Khế Ước Chư Hầu#!.\n\nNgài có thể nhận thấy rằng một số tương tác không hiển thị ngay lập tức. Khi có quá nhiều tương tác, menu tương tác [character|E] chỉ hiển thị những tùy chọn phổ biến nhất.\n\nĐể hiển thị các tương tác bị ẩn, hãy nhấp nút \"Thêm...\" trong danh mục tương ứng.#!"

# Culture
  lesson_basics_culture_open_view:1 "Văn hóa"
  lesson_basics_culture_open_view_desc:0 "Mỗi [character|E] và [county|E] đều thuộc về một [culture|E]. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_open_view_desc_INGAME', '' )]"
  lesson_basics_culture_open_view_desc_INGAME:0 "\n\n[ruler|E] hiện tại của Ngài thuộc nền Văn hóa [GetPlayer.GetCulture.GetNameNoTooltip], được hiển thị ở góc dưới bên trái."
  lesson_basics_culture_open_view_trigger:0 "Mở giao diện Văn hóa (được tô sáng)"
 
  lesson_basics_culture_elements:0 "Văn hóa"
  lesson_basics_culture_elements_desc:1 "Một [culture|E] được xác định bởi [ethos|E], [culture_pillars|E] và [traditions|E]. Mỗi yếu tố này quyết định các lợi ích hoặc hình phạt khác nhau áp dụng cho toàn bộ thành viên của Văn hóa.\n\n#V Ethos#! mô tả những giá trị cốt lõi của một Văn hóa. Đây là yếu tố chính quyết định những Truyền thống nào có sẵn cho Văn hóa đó. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_elements_desc_INGAME', '' )]\n\n#V Trụ cột Văn hóa#! phản ánh nguồn gốc của Văn hóa và không thể thay đổi. Chúng ảnh hưởng mạnh đến [cultural_acceptance|E] với các nền văn hóa khác, nhưng ngoài ra có tầm quan trọng thấp hơn Ethos.\n\n#V Truyền thống#! của một Văn hóa linh hoạt hơn, nhưng vẫn cực kỳ quan trọng. Không giống như Ethos và Trụ cột, Truyền thống có thể được thay đổi bởi Thủ lĩnh Văn hóa — đó sẽ là chủ đề tiếp theo."
  lesson_basics_culture_elements_desc_INGAME:1 "Ethos của Văn hóa Ngài, [GetPlayer.GetCulture.GetCollectiveNounNoTooltip], là [GetPlayer.GetCulture.GetEthos.GetName]."
  lesson_basics_culture_culture_head:0 "Văn hóa (Thủ lĩnh Văn hóa)"
  lesson_basics_culture_culture_head_desc:0 "[culture_head|E] là [ruler|E] của một [culture|E] có [realm|E] lớn nhất. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_culture_head_desc_INGAME', '' )]\n\nThủ lĩnh Văn hóa có thể thiết lập các Truyền thống mới cho Văn hóa của mình.\n\nHọ cũng đóng vai trò quan trọng trong sự phát triển công nghệ và xã hội của Văn hóa, điều mà chúng ta sẽ tìm hiểu ngay sau đây."
  lesson_basics_culture_culture_head_desc_INGAME:0 "[SelectLocalization(ObjectsEqual(GetPlayer, GetPlayer.GetCulture.GetCultureHead), 'lesson_basics_culture_culture_head_desc_YOU', 'lesson_basics_culture_culture_head_desc_OTHER' )]"
  lesson_basics_culture_culture_head_desc_YOU:0 "Ngài là Thủ lĩnh Văn hóa của Văn hóa mình."
  lesson_basics_culture_culture_head_desc_OTHER:0 "[GetPlayer.GetCulture.GetCultureHead.GetName] là Thủ lĩnh Văn hóa của Văn hóa Ngài."

  lesson_basics_culture_innovations_open:0 "Văn hóa (Đổi mới)"
  lesson_basics_culture_innovations_open_desc:0 "[culture|E] của Ngài quyết định những [innovations|E] nào Ngài có thể tiếp cận, được hiển thị trong thẻ Đổi mới."
  lesson_basics_culture_open_innovations_tab_trigger:0 "Mở thẻ Đổi mới (được tô sáng)"

  lesson_basics_culture_innovations:0 "Văn hóa (Đổi mới)"
  lesson_basics_culture_innovations_desc:0 "[innovations|E] là các phát minh và thích nghi mà một [culture|E] có thể khám phá theo thời gian. $game_concept_innovations$ mang lại các hiệu ứng thưởng mới, [buildings|E] và [men_at_arms|E] cho tất cả thành viên của $game_concept_culture$.\n\nCác Đổi mới được chia theo [eras|E], vì vậy phần lớn sẽ không khả dụng ở giai đoạn đầu của trò chơi. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_innovations_desc_INGAME', '' )]"
  lesson_basics_culture_innovations_desc_INGAME:0 "Văn hóa của Ngài hiện đang ở Kỷ nguyên [GetPlayer.GetCulture.GetCultureEra.GetName]."

  lesson_basics_culture_innovations_spread:0 "Văn hóa (Đổi mới)"
  lesson_basics_culture_innovations_spread_desc:0 "[innovations|E] thường được khám phá rất chậm. Tuy nhiên, [culture_head|E] có thể đẩy nhanh quá trình này bằng cách chọn một Đổi mới làm [fascination|E] của Văn hóa (được tô sáng).\n\n#I Khi Ngài là Thủ lĩnh Văn hóa, Ngài có thể nhấp vào một Đổi mới để đặt nó làm Sự quan tâm mới.#!\n\nCác Văn hóa cũng khám phá Đổi mới nhanh hơn nếu các Văn hóa lân cận đã có chúng."

# Religion
  lesson_basics_religion_1:1 "Đức tin và Tôn giáo"
  lesson_basics_religion_1_read_only:0 "$lesson_basics_religion_1$"
  lesson_basics_religion_1_desc:2 "Tất cả [characters|E] đều tin vào một [faith|E], và mỗi Đức tin lại thuộc về một [religion|E]. Ví dụ, Công giáo là một $game_concept_faith$, thuộc về $christianity_religion$.\n\nMỗi $game_concept_faith$ đều khác biệt với các $game_concept_faith$ khác — hãy cùng xem kỹ hơn."
  lesson_basics_religion_click_religion_tt:1 "Mở giao diện Đức tin (được tô sáng)"
  lesson_basics_religion_2:0 "Giáo lý ($lesson_basics_religion$)"
  lesson_basics_religion_2_desc:2 "[faith|E] của Ngài có một số [doctrines|E]. Các $game_concept_doctrines$ này đặt ra quy tắc cho thành viên của $game_concept_faith$ và chi phối nhiều yếu tố, chẳng hạn như Luật [succession_laws|E] theo giới tính, hoặc ai có thể nắm giữ [temple_holdings|E].\n\n[core_tenets|E] ở phía trên là những $game_concept_doctrines$ đặc biệt, mang lại các hiệu ứng hoặc tùy chọn cho Nhân vật của Ngài, như khả năng thiền định hoặc tham gia [great_holy_wars|E].\n\n#TUT Mỗi Đức tin cũng có [sins|E] và [virtues|E], thể hiện những hành vi bị chê trách hoặc được tôn vinh trong cộng đồng.#!"
  lesson_basics_religion_3:0 "@fervor_icon! Nhiệt thành ($lesson_basics_religion$)"
  lesson_basics_religion_3_desc:1 "Tất cả các [faiths|E] đều có [fervor|E], tăng giảm theo thời gian tùy thuộc vào số lượng tín đồ của $game_concept_faith$, các [holy_wars|E] đang diễn ra như thế nào, và hơn thế nữa. $game_concept_fervor$ thể hiện mức độ cuồng tín mà hầu hết các thành viên của $game_concept_faith$ đang cảm thấy, bao gồm cả những nông dân lầm than trên khắp thế giới.\n\nKhi $game_concept_fervor$ của $game_concept_faith$ của ngài cao, việc chuyển đổi [counties|E] (sử dụng [convert_county|E]) sang $game_concept_faith$ của ngài sẽ dễ dàng hơn, và các $game_concept_counties$ theo $game_concept_faith$ của ngài sẽ #EMP chống lại#! việc chuyển đổi sang các $game_concept_faiths$ khác.\n\nTuy nhiên, khi $game_concept_fervor$ thấp, các $game_concept_rulers$ có thể quyết định từ bỏ $game_concept_faith$ hiện tại để chuyển sang một đức tin khác từ cùng [religion|E], tạo ra một [heresy|E]. \n\n#TUT Các $game_concept_rulers$ theo tà giáo sẽ cải đạo cùng với lãnh thổ và chư hầu thân cận nhất của họ, và họ được tự do truyền bá $game_concept_faith$ mới của mình thay cho đức tin cũ.#!"
  lesson_basics_religion_4:0 "Đức tin mới ($lesson_basics_religion$)"
  lesson_basics_religion_4_no_GUI_highlight:0 "$lesson_basics_religion_4$"
  lesson_basics_religion_4_desc:1 "Từ chế độ xem [faith|E], ngài có thể tạo một $game_concept_faith$ mới của riêng mình. Các [doctrines|E] và [core_tenets|E] sẽ tiêu tốn một lượng [piety|E] nhất định tùy thuộc vào các $game_concept_core_tenets$ mà $game_concept_faith$ hiện tại của ngài đang có.\n\nĐây không phải là điều cần lo lắng trong [character|E] đầu tiên của ngài, nhưng có thể là một mục tiêu đầu tiên rất thú vị để hướng tới khi ngài cảm thấy tự tin hơn!\n\n#TUT [family_members|E] và [vassals|E] có [opinion|E] cao về ngài nhiều khả năng sẽ gia nhập $game_concept_faith$ mới của ngài, và kỹ năng [learning|E] cao có thể thuyết phục thêm nhiều người khác, nhưng bất kỳ ai theo $game_concept_faith$ cũ của ngài mà không cải đạo sẽ coi ngài là kẻ dị giáo.#!"

# War
  lesson_basics_warfare:0 "Chiến tranh ($lesson_basics_war$)"
  lesson_basics_warfare_desc:1 "[war|E] là một phần thiết yếu của Crusader Kings III. Có rất nhiều khái niệm cần tìm hiểu, nhưng trước mắt hãy điểm qua một vài điều cơ bản.\n\n#TUT Phần còn lại và chi tiết, hãy để Ngài tự khám phá khi bắt đầu chơi.#!"
  lesson_basics_levies:0 "Chiến tranh ($lesson_basics_war$)"
  lesson_basics_levies_complete:0 "$lesson_basics_levies$"
  lesson_basics_levies_desc:2 "Những sự kiện quan trọng nhất trong chiến tranh là các [battles|E], được tiến hành bởi [armies|E]. Phần lớn binh lính của Ngài đến từ [levies|E], nhưng Ngài có thể mở rộng $game_concept_army$ bằng cách tuyển dụng [men_at_arms|E].\n\n#TUT Khi tình thế trở nên khó khăn, Ngài cũng có thể thuê [mercenaries|E] — miễn là có đủ [gold|E].#!"
  lesson_basics_military_view_tt:1 "Mở giao diện Quân sự (được tô sáng)"
  lesson_basics_rally_points:0 "Chiến tranh ($lesson_basics_war$)"
  lesson_basics_rally_points_desc:2 "Khi một [war|E] bắt đầu, Ngài có thể triệu tập [armies|E] chỉ với một cú nhấp vào nút đỏ lớn \"$RAISE_ALL$\" xuất hiện cạnh biểu tượng $game_concept_war_score$ ở góc dưới bên phải — Ngài cũng có thể dùng $RAISE_ALL$ từ giao diện Quân sự.\n\nKhi $game_concept_war$ kết thúc, Ngài phải giải tán quân đội trước khi bắt đầu một $game_concept_war$ khác.\n\n#TUT [rally_points|E] là nơi tập kết của [levies|E] và [men_at_arms|E] dưới quyền Ngài; đây là nơi họ xuất hiện khi được triệu tập ra trận.#!"
  lesson_basics_casus_belli:0 "Chiến tranh ($lesson_basics_war$)"
  lesson_basics_casus_belli_desc:1 "Để bắt đầu một [war|E], Ngài cần có lý do chính đáng, gọi là [casus_belli|E], chống lại một [ruler|E] khác.\n\nCó nhiều cách để có được $game_concept_casus_belli$: Ngài có thể sở hữu [de_jure|E] [titles|E] khiến Ngài là [rightful_liege|E] của mục tiêu, Ngài có thể thừa kế [claims|E], hoặc tiến hành [holy_wars|E] chống lại những kẻ ngoại đạo lân cận.\n\nNgoài những cách phổ biến này, còn hàng chục loại $game_concept_casus_belli$ khác để Ngài khám phá và sử dụng trong quá trình chơi!\n\n#TUT Cách dễ và trực tiếp nhất để có $game_concept_claims$ là dùng #EMP [fabricate_claim|E]#! — việc này do [court_chaplain|E] của Ngài thực hiện thông qua một trong các [councillor_tasks|E].#!"

# UNPAUSING!! :D Do this when the player is actually supposed to unpause
  lesson_basics_pausing_2:0 "Gần xong rồi ($lesson_basics_unpause$)"
  lesson_basics_pausing_2_desc:1 "Sắp tới, Ngài sẽ có thể bỏ tạm dừng trò chơi! Nhưng trước hết vẫn còn vài điều cần lưu ý.\n\nThứ nhất, có năm tốc độ chơi khác nhau (nhấn phím 1–5 để chuyển nhanh), và Ngài có thể tạm dừng hoặc thay đổi tốc độ bất cứ lúc nào.\n\n#BOLD Thứ hai, với một số sự kiện quan trọng, trò chơi sẽ tự động tạm dừng.#!\n\n#TUT Không có gì sai khi chơi ở tốc độ thấp, tăng tốc khi yên bình hoặc giảm tốc khi bước vào chiến tranh.\n\nThông thường, chúng Ta khuyên Ngài nên tạm dừng khi xem xét menu hoặc khi phải đưa ra những quyết định khó khăn.#!"
  lesson_basics_pausing_3:0 "Bắt đầu trò chơi ($lesson_basics_unpause$)"
  lesson_basics_pausing_3_desc:2 "Để thời gian bắt đầu trôi, hãy bỏ tạm dừng trò chơi (bằng #EMP phím Space#! hoặc nhấp nút Chơi ở góc dưới bên phải).\n\nNgày tháng và năm sẽ trôi qua. Quân đội được lệnh hành quân sẽ di chuyển, sự kiện sẽ xuất hiện trên màn hình, thư từ được gửi đi, và [characters|E] sẽ già đi.\n\n#TUT Hãy tìm một tốc độ phù hợp với Ngài — Ngài luôn có thể thay đổi sau.#!"

 # Actual Warfare
  lesson_declare_war_step_1:0 "Tiếp Theo Là Gì?"
  lesson_declare_war_step_1_complete:0 "$lesson_declare_war_step_1$"
  lesson_declare_war_step_1_desc:1 "Giờ thì, với nhiệm vụ đầu tiên, hãy nhắc nhở người láng giềng  của ngài — Bá tước xứ $c_desmond$ — xem ai mới thực sự là [rightful_liege|E] của hắn… Nếu việc đó đồng thời mở rộng [realm|E] của Ngài, thì càng tốt!\n\nSử dụng hệ thống tương tác nhân vật mà chúng ta đã tìm hiểu trước đó, chọn hắn trực tiếp trên bản đồ và tuyên chiến với [ruler|E] của $c_desmond$. Ngài đã có sẵn một [casus_belli|E] hợp lệ, vì [title|E] của hắn về mặt [de_jure|E] vốn là một phần của $game_concept_realm$ của Ngài.\n\n#TUT Để có trải nghiệm trực quan hơn, chúng ta sẽ cùng đi từng bước qua diễn biến của một cuộc chiến.#!"
  lesson_declare_war_tt:1 "#TUT_KW Tuyên chiến#! với Bá tước Muiredach của $c_desmond$"
  lesson_raise_troops_step_1:0 "Triệu tập Quân đội"
  lesson_raise_troops_step_2:0 "$lesson_raise_troops_step_1$"
  lesson_raise_troops_step_1_desc:3 "Ngài hiện đang tham gia một [war|E]! Tiếp theo, hãy tập hợp [armies|E] của Ngài. Một nút bấm đã xuất hiện ở phía dưới màn hình để hỗ trợ việc này, nhưng Ngài cũng có thể làm điều đó từ giao diện Quân sự.\n\n#TUT Dù [rally_point|E] của Ngài nằm ở đâu, đó sẽ là nơi [army|E] của Ngài tập kết và chờ lệnh.\n\nLưu ý: Ngài cần bỏ tạm dừng trò chơi (nhấn phím Space!) để $game_concept_army$ có thể tập hợp đầy đủ binh lính. Hãy để vài ngày trôi qua, và Quân đội sẽ đạt quân số tối đa!#!"
  lesson_declare_war_step_2:0 "$lesson_declare_war_step_1$"
  lesson_raise_troops_tt:0 "Triệu tập Quân đội của Ngài"
  lesson_army_movement_step_1:0 "Di chuyển Quân đội"
  lesson_army_movement_step_1_desc:2 "Để di chuyển [army|E], hãy nhấp vào $game_concept_army$ (trên bản đồ) rồi nhấp chuột phải vào khu vực Ngài muốn họ đến.\n\nĐể giành chiến thắng trong một [war|E], Ngài thường cần chiếm được [realm_capital|E] của kẻ địch thông qua một [siege|E]. Vì vậy, đây thường là mục tiêu chính khi Ngài ở thế tấn công.\n\n#TUT Nếu Ngài ra lệnh cho $game_concept_army$ băng qua vùng nước, họ sẽ [embark|E], biến thành một [fleet|E]. Nhưng hiện tại, hãy cứ ở trên đất liền.#!"
  lesson_army_purpose_step_1:0 "Quân đội"
  lesson_army_purpose_step_1_desc:2 "Giờ đây khi [army|E] của Ngài đang di chuyển, rất có thể họ sắp chạm trán quân địch. Đó có thể là một trận đối đầu trực diện với $game_concept_armies$ khác, hoặc là khởi đầu của một [siege|E].\n\n#TUT [battles|E] sẽ tự động xảy ra khi hai $game_concept_armies$ thù địch chạm trán nhau. Tương tự, $game_concept_sieges$ diễn ra khi Ngài đặt $game_concept_army$ lên một [holding|E] của kẻ địch.\n\nĐây là thời điểm thích hợp để #EMP bỏ tạm dừng trò chơi#!, nếu Ngài chưa làm vậy. Nếu không, thời gian sẽ đứng yên và $game_concept_armies$ của Ngài sẽ không di chuyển!#!"
  lesson_battle_mechanics_step_1:0 "Một Trận Chiến!"
  lesson_battle_mechanics_step_1_desc:2 "Kết quả của một [battle|E] giữa hai [armies|E] phụ thuộc vào nhiều yếu tố: số lượng [levies|E] của mỗi bên, việc bên nào sử dụng (nếu có) [men_at_arms|E], các [commanders|E] tham chiến, và thậm chí cả [terrain|E] nơi trận đánh diễn ra.\n\n#TUT Ngài có thể xem thêm chi tiết trong giao diện Chiến đấu — hãy nhấp vào $game_concept_army$ đang giao tranh để mở nó.#!"
  lesson_siege_mechanics_step_1:0 "Một Cuộc Vây Hãm!"
  lesson_siege_mechanics_step_1_desc:4 "Một [army|E] đang tấn công một [holding|E]! Hãy nhấp vào biểu tượng được tô sáng (những mũi giáo!) để xem diễn biến.\n\nMỗi bên cần giành chiến thắng trong các $game_concept_sieges$ để thắng hầu hết các cuộc chiến, vì chúng làm tăng [war_score|E].\n\nMỗi khi một $game_concept_siege$ thành công (cần vài vòng tấn công), khu vực đó sẽ trở thành [occupied|E], và khi thu nhỏ bản đồ, màu sắc của nó sẽ chuyển từ màu liền sang dạng sọc."
  lesson_warscore_step_1:0 "Điểm Chiến tranh"
  lesson_warscore_step_1_desc:1 "Để biết ai đang chiếm ưu thế trong một [war|E], Ngài luôn có thể xem [war_score|E] ở góc dưới bên phải. Chỉ số này dao động từ #N -100#! đến #P +100#!, và thay đổi dựa trên các [battles|E] và [sieges|E] thắng hoặc thua, cũng như lãnh thổ bị chiếm giữ.\n\n#TUT Ở mức #P 100#! $game_concept_war_score$, Ngài có thể buộc đối phương chấp nhận [peace_offer|E] của mình.\n\nNgược lại, ở mức #N -100#! $game_concept_war_score$, #EMP họ#! có thể buộc #EMP Ngài#! phải chấp nhận [peace_offer|E] của #EMP họ#!.#!"
  lesson_warscore_step_2:0 "Kết cục Chiến tranh"
  lesson_warscore_step_2_desc:6 "Mọi [wars|E] đều kết thúc theo một trong ba cách:\n$EFFECT_LIST_BULLET$[victory|E]\n$EFFECT_LIST_BULLET$[white_peace|E]\n$EFFECT_LIST_BULLET$[defeat|E]\n\nHệ quả cụ thể của mỗi kết cục sẽ thay đổi tùy theo [casus_belli|E].\n\n#TUT Ngài có thể xem chi tiết một cuộc chiến cụ thể bằng cách nhấp chuột phải vào [ruler|E] đối phương và chọn #TUT_KW Đề nghị Hòa bình#!, hoặc nhấp vào biểu tượng $game_concept_war_score$ ở góc dưới bên phải rồi chọn một trong các thẻ ở phía dưới màn hình.#!"
  lesson_winning_wars_step_1:0 "Chiến thắng Đã Gần"
  lesson_winning_wars_step_1_desc:3 "[war_score] của Ngài đã đạt #P +100%#!!\n\nGiờ Ngài có thể thực thi yêu sách của mình bằng cách nhấp vào biểu tượng $game_concept_war_score$ để mở giao diện Chiến tranh, sau đó chọn thẻ #TUT_KW Thực thi Yêu sách#! ở phía dưới màn hình.\n\n#TUT Ngài cũng có thể nhấp chuột phải vào [ruler|E] đối phương và chọn #TUT_KW Đề nghị Hòa bình#!.#!"
  lesson_losing_wars_step_1:0 "Thất Bại Đang Đến Gần"
  lesson_losing_wars_step_1_desc:2 "Cuộc [war|E] này đang diễn biến không thuận lợi! Có lẽ đã đến lúc đề nghị [white_peace|E].\n\nDù #EMP cuộc#! $game_concept_war$ này có thể đã không còn hy vọng, việc chấp nhận thất bại để sống sót và chờ ngày khác phản công cũng không có gì sai. Hãy nhấp chuột phải vào kẻ địch và chọn #TUT_KW Hòa bình Trắng#! (hoặc #TUT_KW Đầu hàng#! nếu không thể Hòa bình Trắng) trong giao diện Tương tác."
  lesson_war_final_notes_reuse:1 "\n\n#TUT Các bài học hướng dẫn kết thúc tại đây. Tuy nhiên, những mẩu Lời khuyên vẫn sẽ thỉnh thoảng xuất hiện dưới dạng biểu tượng cảnh báo ở phía trên màn hình. Hãy nhấp vào chúng để tìm hiểu thêm về các tình huống hoặc hệ thống Ngài đang gặp phải!\n\nCảm ơn Ngài đã đồng hành cùng chúng Ta — và chúc may mắn!#!"
  lesson_war_final_notes_victory_step_1:0 "Chiến Thắng!"
  lesson_war_final_notes_victory_step_1_desc:1 "Chúc mừng chiến thắng [victory|E] của Ngài!\n\nGiờ Ngài đã trải nghiệm xong một phần thiết yếu của trò chơi.$lesson_war_final_notes_reuse$"
  lesson_war_final_notes_defeat_step_1:0 "Thua Trận"
  lesson_war_final_notes_defeat_step_1_desc:1 "Chúng Ta cùng Ngài tiếc thương cho [defeat|E] này, nhưng hãy yên tâm rằng Ngài đã vượt qua một khía cạnh đầy thử thách của trò chơi — và từ đây mọi thứ sẽ chỉ dễ dàng hơn.$lesson_war_final_notes_reuse$"
  lesson_war_final_notes_white_peace_step_1:0 "Hòa Bình Trắng"
  lesson_war_final_notes_white_peace_step_1_desc:0 "Biết bao bài học đã được rút ra! Những kinh nghiệm này sẽ theo Ngài trong tương lai!$lesson_war_final_notes_reuse$"
  lesson_war_final_notes_invalidated_step_1:0 "Chiến tranh Bị Vô hiệu"
  lesson_war_final_notes_invalidated_step_1_desc:0 "Ngài vẫn còn ở đây! Tuyệt vời! Dù hơi kỳ lạ khi cuộc chiến lại không còn hiệu lực nữa.$lesson_war_final_notes_reuse$"
  lesson_guided_final_notes_mission_step_1:0 "Tiếp Theo Là Gì?"
  lesson_guided_final_notes_mission_step_1_desc:3 "Giờ đây khi Ngài đã chạm tay vào một số hệ thống cốt lõi, có rất nhiều điều Ngài có thể làm — Crusader Kings III là trò chơi của những mục tiêu do chính Ngài đặt ra.\n\nNếu cần một gợi ý, chúng Ta khuyên Ngài hãy thử trở thành Vua hoặc Nữ hoàng của toàn bộ $k_ireland$! Và [war|E] không phải là con đường duy nhất…\n\nHoặc Ngài có thể nhấp nút #bold Tình hình Hiện tại#! ở phía trên và xem liệu mục nào trong phần Gợi ý hoặc Tình hình Hiện tại khiến Ngài hứng thú không!"
  lesson_open_war_overview_tt:0 "Mở giao diện Chiến tranh (được tô sáng)"
