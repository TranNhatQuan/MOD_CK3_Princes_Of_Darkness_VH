l_english:
 # Tell the player that Hybridising is a thing they SHOULD do, whether or not they can currently
  reactive_advice_should_form_hybrid_culture:0 "Văn hoá Lai"
  action_reactive_advice_should_form_hybrid_culture:0 "$open_tutorial_lesson$$reactive_advice_should_form_hybrid_culture$"
  action_reactive_advice_should_form_hybrid_culture_desc:0 "Hướng tới việc hình thành một [hybrid_culture|E] với [culture.GetCollectiveNoun]."
  action_reactive_advice_should_form_hybrid_culture_click:0 "$click_to_open_lesson$"
  lessons_ep1_form_hybrid_culture: "$reactive_advice_should_form_hybrid_culture$"
  lessons_ep1_should_form_hybrid_culture_desc: "Ngài có thể hình thành một [hybrid_culture|E] với [culture|E] này nếu [cultural_acceptance|E] đủ cao và Văn hoá của Ngài đã tồn tại hơn 50 năm!\n\nĐiều này có nghĩa là Ngài sẽ tạo ra một Văn hoá mới, với các yếu tố từ cả Văn hoá của Ngài và Văn hoá kia.\n\nNgài có thể gia tăng Mức độ Chấp nhận Văn hoá bằng cách:\n$EFFECT_LIST_BULLET$Ban cấp các [counties|E] của Văn hoá này cho các [characters|E] thuộc Văn hoá này\n$EFFECT_LIST_BULLET$Sử dụng [councillor_task|E] [accept_culture|E]\n$EFFECT_LIST_BULLET$Tăng [culture_intermingling|E]\n$EFFECT_LIST_BULLET$Có các [vassals|E] thuộc Văn hoá này\n\nNếu Ngài có Mức độ Chấp nhận Văn hoá cao và ít nhất một quận của Văn hoá đó nằm trong [realm|E] của Ngài, Ngài có thể hình thành một Văn hoá Lai!"
  lessons_ep1_hybrid_culture_benefits: "Lợi ích của Văn hoá Lai"
  lessons_ep1_hybrid_culture_benefits_desc: "Việc hình thành một Văn hoá Lai mang lại nhiều lợi ích:\n\n$EFFECT_LIST_BULLET$Ngài có thể lựa chọn [culture_pillars|E] và [culture_traditions|E] từ một trong hai Văn hoá Gốc\n$EFFECT_LIST_BULLET$Văn hoá mới của Ngài sẽ kế thừa toàn bộ [innovations|E] từ cả hai Văn hoá Gốc\n$EFFECT_LIST_BULLET$Văn hoá mới của Ngài sẽ có Mức độ Chấp nhận Văn hoá cao với cả hai Văn hoá Gốc\n$EFFECT_LIST_BULLET$Một Văn hoá Lai có thể cải đạo lãnh thổ của các Văn hoá Gốc nhanh hơn rất nhiều trong vài năm sau khi được hình thành"

#Royal Court Feature
 
  action_reactive_advice_royal_court:0 "$open_tutorial_lesson$$ra_rc_intro$"
  action_reactive_advice_royal_court_desc:0 "Mở mục này để xem phần giới thiệu về Triều đình Hoàng gia của Ngài"
  action_reactive_advice_royal_court_click:0 "$click_to_open_lesson$"
  reactive_advice_royal_court: "$ra_rc_intro$"

  ra_rc_intro:0 "Triều đình Hoàng gia"
  ra_rc_intro_desc:2 "Giờ đây Ngài đã có quyền truy cập vào [royal_court|E] của riêng mình!\n\nTriều đình Hoàng gia là một loại triều đình đặc biệt, đại diện cho sự xuất hiện long trọng của Ngài trên vũ đài thế giới, cho phép tiếp cận nhiều tuỳ chọn và lợi ích mới.\n\nNó khả dụng cho các [kings|E] và [emperors|E] thuộc các [government|E] [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName], [GetGovernment( 'tribal_government' ).GetName] và [GetGovernment( 'administrative_government' ).GetName]."

  ra_rc_open:0 "$ra_rc_intro$"
  ra_rc_open_desc:0 "Ngài có thể làm nhiều việc trong [royal_court|E] của mình, vì vậy hãy thoải mái khám phá các tuỳ chọn này!\n\nTrước mắt, hãy cùng điểm qua nhanh tất cả các hành động mới hiện có cho Ngài."
  ra_rc_open_prompt:0 "Mở Triều đình Hoàng gia (được đánh dấu)"

  ra_rc_throne_room_open:0 "$ra_rc_intro$"
  ra_rc_throne_room_open_desc:0 "Để tiếp tục, hãy quay lại Phòng Ngai vàng"
  ra_rc_throne_room_open_prompt:0 "Mở thẻ Phòng Ngai vàng (được đánh dấu)"

  ra_rc_throne_room:0 "$ra_rc_intro$"
  ra_rc_throne_room_desc:1 "Đây là Phòng Ngai vàng của Ngài. Nhiều tình huống và [court_events|E] có thể thỉnh thoảng diễn ra tại đây, và Ngài có thể lựa chọn can thiệp vào bất cứ điều gì đang xảy ra."

  ra_rc_hold_court:0 "Mở Triều"
  ra_rc_hold_court_desc:1 "Nếu Ngài cảm thấy Phòng Ngai vàng của mình chưa đủ sôi động, Ngài có thể [hold_court|E]. Điều này sẽ mời các thỉnh nguyện giả từ khắp [realm|E], mang những vấn đề của họ đến trước sự phán xét sáng suốt của Ngài."

  ra_rc_grandeur_open:0 "$ra_rc_grandeur$"
  ra_rc_grandeur_open_desc:0 "Tuy nhiên, sẽ không ai muốn đến [royal_court|E] của Ngài nếu nó không đủ danh tiếng! Tiếp theo, hãy cùng xem xét Uy thế Triều đình!"
  ra_rc_grandeur_open_prompt:0 "Mở thẻ Uy thế Triều đình (được đánh dấu)"

  ra_rc_grandeur:0 "Uy thế Triều đình"
  ra_rc_grandeur_desc:0 "[grandeur_level|E] là thước đo mức độ danh tiếng của [royal_court|E] của Ngài.\n\nNhiều yếu tố đóng góp vào [grandeur|E], nhưng các nguồn chính là [amenities|E] và [court_artifacts|E].\n\nKhi [realm|E] của Ngài trở nên rộng lớn hơn, Ngài sẽ được kỳ vọng đạt tới một Cấp độ Uy thế cao hơn: điều này được gọi là [grandeur_expectations|E]."

  ra_rc_amenities:0 "Tiện nghi Triều đình"
  ra_rc_amenities_desc:0 "[amenities|E] là các dịch vụ và tiện ích khác nhau mà Ngài cung cấp cho tất cả những ai tham dự [royal_court|E]. Mỗi loại mang lại lợi ích riêng và tất cả đều đóng góp vào [grandeur|E].\n\nChúng đều tiêu tốn [gold|E] mỗi tháng, vì vậy hãy cẩn thận để không chi tiêu quá mức!"

  ra_rc_court_types_and_language:0 "Loại hình Triều đình và Ngôn ngữ Triều đình"
  ra_rc_court_types_and_language_desc:0 "Nếu Ngài muốn tìm hiểu sâu hơn về [grandeur|E], Ngài có thể khám phá [court_types|E] và [court_language|E].\n\nLoại hình Triều đình ảnh hưởng đến những gì Ngài nhận được ở các [grandeur_levels|E], trong khi việc thay đổi Ngôn ngữ Triều đình có thể làm tăng tổng [grandeur|E] của Ngài."

  ra_rc_artifacts_open:0 "$ra_rc_artifacts$"
  ra_rc_artifacts_open_desc:0 "Cuối cùng, hãy cùng xem Bảo vật Triều đình, một nguồn khác của [grandeur|E], cũng như nhiều lợi ích khác."
  ra_rc_artifacts_open_prompt:0 "Mở thẻ Bảo vật Triều đình (được đánh dấu)"

  ra_rc_artifacts:0 "Bảo vật Triều đình"
  ra_rc_artifacts_desc:0 "Tại đây, Ngài có thể chọn những [court_artifacts|E] nào sẽ được trưng bày trong [royal_court|E] của mình.\n\nBảo vật Triều đình là các [artifacts|E] đặc biệt như tượng và thảm trang trí mà Ngài có thể đem ra trưng bày. Chúng cung cấp nhiều hiệu ứng cộng thêm khác nhau, và nhiều món cũng mang lại [grandeur|E].\n\nGiờ thì hãy quay lại Phòng Ngai vàng."

  ra_rc_conclusion:0 "$ra_rc_intro$"
  ra_rc_conclusion_desc:0 "Đây là phần kết của chuyến tham quan [royal_court|E] của Ngài.\n\nHiện tại, hãy thoải mái thử bất cứ điều gì Ngài muốn. Chúng Ta gợi ý Ngài nên [hold_court|E] để chúc mừng địa vị mới của mình!"

 #Fund Inspiration
  lessons_ep1_fund_inspiration:0 "Tài trợ Cảm hứng"
  ra_inspiration_open_desc:0 "Giờ đây Ngài có thể tài trợ cho [inspiration|E] đầu tiên của mình. Cảm hứng là mong muốn của một nhân vật nhằm hiện thực hoá một [artifact|E].\n\nCác [characters|E] đang [inspired|E] đến rồi đi tại những [royal_courts|E] danh giá nhất thế giới; khi một người ghé thăm triều đình của Ngài, Ngài sẽ được thông báo và được mời [sponsor|E] cho [project|E] của nhân vật đó.\n\nBằng cách trả một lượng [gold|E] khác nhau, Ngài có thể đảm bảo sự phục vụ của nhân vật này và sau một thời gian sẽ nhận được một Bảo vật mới!"
  ra_inspiration_open:0 "Cảm hứng"
  ra_inspiration_court_view:0 "Tìm Cảm hứng"
  ra_inspiration_court_view_desc:0 "Bên trong [royal_court|E], Ngài có thể thấy tất cả [inspirations|E] hiện đang có mặt tại triều đình của mình ở phía bên trái.\n\nNgài có thể kiểm tra trạng thái của họ bằng cách nhấp vào biểu tượng của họ (được đánh dấu)."
  ra_inspiration_court_view_prompt:0 "Nhấp vào biểu tượng Cảm hứng (được đánh dấu)"
  ra_inspiration_funding:0 "Tài trợ Cảm hứng"
  ra_inspiration_funding_desc:0 "Tại đây, Ngài có thể thấy Nhân vật được Truyền cảm hứng, họ dự định tạo ra vật gì, kỹ năng của họ tốt đến đâu, liệu Ngài có đủ khả năng tài trợ Cảm hứng hay không và chi phí sẽ là bao nhiêu.\n\nNếu Cảm hứng đang diễn ra, Ngài có thể thấy còn bao lâu nữa sẽ hoàn thành; nếu chưa, Ngài có thể bắt đầu nó."
  reactive_advice_fund_inspiration: "$lessons_ep1_fund_inspiration$"
