l_english:
### MANDALA

  action_lesson_tgp_playtest_intro_mandala: "Chính quyền Mandala"
  action_lesson_tgp_playtest_intro_mandala_desc: "Mandala là một Chính quyền đặc biệt tập trung vào Đức tin và Chư hầu triều cống. Mở mục này để tìm hiểu về chính quyền này."
  action_lesson_tgp_playtest_intro_mandala_click: "$click_to_open_lesson$"

  lesson_tgp_playtest_intro_mandala_step_intro: "Mandala"
  lesson_tgp_playtest_intro_mandala_step_intro_desc: "Ngài là một [ruler|E] theo [mandala|E]!\n\n$game_concept_mandala$ là một [government|E] đặc biệt ở Đông Nam Á, tập trung vào tôn giáo và [piety|E]."

  lesson_tgp_playtest_intro_mandala_step_government: "Chính quyền Mandala"
  lesson_tgp_playtest_intro_mandala_step_government_desc: "Nền tảng quyền lực của Ngài đến từ một mạng lưới [tributaries|E] linh hoạt hơn, với chỉ một số ít [vassals|E] mang tính lâu dài.\n\nĐiều này có nghĩa là Ngài có thể \"chiếm\" các Chư hầu triều cống của các [ruler|E] Mandala khác, ví dụ bằng cách sử dụng [character_interaction|E] $offer_tributary_status_interaction|V$.\n\nTôn giáo cũng đóng vai trò trung tâm trong [mandala_government|E]. Để thực hiện nhiều hành động cốt lõi của chính quyền này, Ngài phải tiêu tốn [piety|E]."

  lesson_tgp_playtest_intro_mandala_step_temple_complex: "Quần thể Đền thờ"
  lesson_tgp_playtest_intro_mandala_step_temple_complex_desc: "Ngoài ra, để tăng giới hạn quy mô [realm|E] của Ngài, Ngài phải nâng cấp [great_building|E] Quần thể Đền thờ tại [capital|E] của mình.\n\nViệc này được thực hiện bằng cách khởi động một [great_project|E]. Điều này có thể khá tốn kém, nhưng nếu các [subjects|E] của Ngài đóng góp [great_project_contributions|E] của riêng họ, Ngài sẽ không phải trả toàn bộ chi phí.\n\n#I Ngài có thể bắt đầu các Công trình Vĩ đại trong thẻ Công trình Vĩ đại của bảng '$DECISIONS_VIEW_TITLE$'.#!"

  lesson_tgp_playtest_intro_mandala_step_mandala_aspect: "Khía cạnh Mandala"
  lesson_tgp_playtest_intro_mandala_step_mandala_aspect_desc: "Với tư cách là [house_head|E] theo [mandala|E], [house|E] của Ngài có một [mandala_aspect|E], tương tự như [powerful_family_attribute|E] trong Đế quốc Byzantine.\n\nThuộc tính này không ảnh hưởng đến [liege|E] của Ngài nếu Ngài có, và có thể được cải thiện theo thời gian bằng cách tiêu tốn [piety|E] và [prestige|E]."

  lesson_tgp_playtest_intro_mandala_step_end: "Chính quyền Mandala"
  lesson_tgp_playtest_intro_mandala_step_end_desc: "Một [ruler|E] [mandala|E] vĩ đại dựa vào [piety|E], [tributaries|E], và sức mạnh của [mandala_aspect|E] của họ. Làm chủ những điều này, và ảnh hưởng của Ngài sẽ lan rộng khắp Đông Nam Á."

