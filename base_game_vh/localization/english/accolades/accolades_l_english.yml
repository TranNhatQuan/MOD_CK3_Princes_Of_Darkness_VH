  thug_attribute.unlock_tt: "Một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] là một [GetTrait('reaver').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('wrathful').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('arbitrary').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('arrogant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('impatient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Có thể mở khi [acclaimed_knight|E] ở trong [army|E] giết [knights|E] địch"
