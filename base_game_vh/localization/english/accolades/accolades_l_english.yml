# Common attribute unlocks

  marauder_attribute.unlock_tt: "Một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('sadistic').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('callous').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('vengeful').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Có thể được mở sau khi một [army|E] có [acclaimed_knight|E] thành công [occupies|E] một [holding|E]"
  accolade_marauder_unlock.t: "Cướp phá thành trì địch truyền cảm hứng cho [marauder.GetName]"
