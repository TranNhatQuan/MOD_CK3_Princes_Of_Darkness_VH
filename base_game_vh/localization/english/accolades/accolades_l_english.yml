  stalwart_attribute.unlock_tt: "Một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('honest').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('just').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('patient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] là một [GetTrait('unyielding_defender').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Có thể mở khi [acclaimed_knight|E] đang [traveling|E] trong #high đoàn tùy tùng của ngài#! qua các [provinces|E] có mức [travel_danger|E] cao"
