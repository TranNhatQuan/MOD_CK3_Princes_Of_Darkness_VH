  idealist_attribute.unlock_tt: "Một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('compassionate').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('forgiving').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('generous').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('trusting').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Có thể mở khi #high bạn#! thả một [prisoner|E] không điều kiện"
  accolade_idealist_unlock.t: "Tha tù nhân truyền cảm hứng cho [idealist.GetName]"
  accolade_idealist_unlock.tt: "Cách đối xử nhân từ của chúng ta với tù nhân truyền cảm hứng cho [idealist.GetName] về những lý tưởng mới. [idealist.GetSheHe|U] có thể được [acclaimed|E] với tư cách là [GetAccoladeType('idealist_attribute').GetName]"

  charmer_attribute.unlock_tt: "Một trong các điều kiện sau:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] là một [GetTrait('seducer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] có [GetTrait('lustful').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Có thể mở sau khi bạn hoàn thành [scheme|E] [GetScheme('seduce').GetTypeName]"
