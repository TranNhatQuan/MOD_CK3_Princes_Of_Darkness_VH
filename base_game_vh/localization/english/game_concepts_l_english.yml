l_english:
  test_text_to_use_explanation:0 "[primary_title|E] là một khái niệm trò chơi."
  game_concept_vassal:0 "Chư hầu"
  game_concept_vassals:0 "Chư hầu"
  game_concept_vassalage:0 "Chư hầu"
  game_concept_vassal_possessive:0 "Chư hầu"
  game_concept_vassals_possessive:0 "Chư hầu"
  game_concept_direct_vassal:0 "Chư hầu Trực tiếp"
  game_concept_direct_vassals:0 "Chư hầu Trực tiếp"
  game_concept_direct_vassal_desc:0 "$game_concept_direct_vassals$ của ngài là những [vassals|E] phục vụ dưới quyền cá nhân của ngài. Các chư hầu của chư hầu #emphasis không#! được bao gồm."
  game_concept_vassalize:0 "Chư hầu"
  game_concept_vassalization:0 "Chư hầu"
  game_concept_vassal_desc:1 "$game_concept_vassal$ là [ruler|E] đã thề trung thành với một nhà cai trị khác — [liege|E] của họ.\n\n$game_concept_vassal$ cung cấp cho người cai trị của họ [levies|E] và [taxes|E] — [obligations|E] của họ — để đổi lấy sự bảo vệ.\n\nNếu [opinion|E] của $game_concept_vassal$ về lãnh chúa của họ thấp, họ có thể tham gia vò các [factions|E], hoặc [scheme|E] thay thế lãnh chúa của họ bằng người khác."
  game_concept_ruler:0 "Nhà cai trị"
  game_concept_rulers:0 "Nhà cai trị"
  game_concept_rulerpossessive:0 "Nhà cai trị"
  game_concept_ruler_desc:1 "$game_concept_ruler$ là [character|E], người mà nắm giữ ít nhất một [title|E]."
  game_concept_title:0 "Tước vị"
  game_concept_title_i:  "@titles_icon!"
  game_concept_titles:0 "Tước vị"
  game_concept_titlepossessive:0 "Tước vị"
  game_concept_title_desc:1 "$game_concept_title$ về cơ bản là bằng chứng về quyền sở hữu đất đai.\n\nĐơn vị đất nhỏ nhất trên bản đồ là [barony|E]. Nam tước được tổ chức thành các khu vực lớn hơn được gọi là [counties|E]. Bá quốc [de_jure|E] thuộc về [duchy|E], công quốc thuộc về [kingdom|E], và Vương quốc thuộc về [empire|E].\n\nCông quốc, Vương quốc và Đế quốc không phải lúc nào cũng có [holder|E], nhưng là các Tước vị có thể được [created|E] bởi một người cai trị, người kiểm soát đủ lãnh thổ tương ứng."
  game_concept_holder:0 "Người nắm giữ"
  game_concept_holders:0 "Người nắm giữ"
  game_concept_holder_possessive:0 "Người nắm giữ"
  game_concept_holders_possessive:0 "Người nắm giữ"
  game_concept_hold:0 "Nắm giữ"
  game_concept_holder_desc:1 "$game_concept_holder$ [title|E] là nhân vật sở hữu tước vị. Tước vị [barony|E] và [county|E] sẽ luôn có $game_concept_holders$ khi đã định cư, trong khi tước vị [duchy|E], [kingdom|E] và [empire|E] có thể vẫn chưa được tạo ra. Lưu ý thêm, $game_concept_holder$ của một Danh hiệu cấp cao có thể không thực sự kiểm soát bất kỳ lãnh thổ nào trong khu vực [de_jure|E] của Tước vị.\n\nViệc nắm giữ Tước vị cấp cao hơn cho phép ngài có [vassals|E]. cấp cao hơn. Ví dụ: Công tước có thể có Bá tước là Chư hầu, và Quốc vương có thể có Công tước."
  game_concept_de_jure:0 "De Jure"
  game_concept_de_jure_desc:1 "Hầu hết các [titles|E] trong số này được coi là một phần của Tước vị $game_concept_de_jure$ ('theo luật') Cấp cao hơn.\n\nVí dụ, [ruler|E] có thể là [king|E] của England, nhưng [realm|E] của họ chưa bao gồm tất cả các vùng đất được coi là một phần của England về mặt pháp lý.\n\n[holder|E] [duchy|E], [kingdom|E], hoặc [empire|E] luôn có [casus_belli|E] để giành quyền kiểm soát các tước vị cấu thành $game_concept_de_jure$ của mình.\n\nCác [vassals|E] cũng sẽ quyết định nhà cai trị mà họ coi là [rightful_liege|E] dựa trên [primary_title|E] của họ, mà theo De Jure là một phần trong đó."
  game_concept_de_jure_drift:0 "Biến động De Jure"
  game_concept_de_jure_drift_drifted:0 "Biến động"
  game_concept_de_jure_drift_drift:0 "Biến động"
  game_concept_de_jure_drifting:  "Biến động De Jure"
  game_concept_de_jure_drift_desc:1 "$game_concept_de_jure_drift_desc_part_1$\n\n$game_concept_de_jure_drift_desc_part_2$"
  game_concept_de_jure_drift_desc_part_1:0 "Một quá trình chậm mà [liege|E] [title|E] [de_jure|E] có thể thay đổi. Nó xảy ra một cách tự nhiên khi [duchy|E] hoặc [kingdom|E] hoàn toàn bị kiểm soát bởi [ruler|E] người không giữ tước vị lãnh chúa de jure của lãnh thổ.\n\nTiến trình này có thể đẩy nhanh bằng cách chỉ định [chancellor|E] của ngài cho [councillor_task|E] thích hợp #weak ($task_integrate_title$)#!. Công quốc chỉ có thể $game_concept_de_jure_drift$ thành Vương quốc, và Vương quốc chỉ có thể Biến động thành [empires|E].\n\nĐể tước vị De Jure Biến động thành [primary_title|E] của ngài là một cách tốt để thoát khỏi hình phạt [rightful_liege|E]."
  game_concept_de_jure_drift_desc_part_2:0 "#weak Ví dụ: Công quốc $d_northumberland$ là de jure một phần của $k_england$, nhưng lãnh thổ của công quốc hoàn toàn nằm trong $k_scotland$. Vì Vua $k_scotland$ không nắm giữ $k_england$, công quốc sẽ bắt đầu $game_concept_de_jure_drift$ để trở thành một phần của $k_scotland$.#!"
  game_concept_primary_title:0 "Tước vị Chính"
  game_concept_primary_titles:0 "Tước vị Chính"
  game_concept_primary_title_desc:0 "$game_concept_primary_title$ [rulerpossessive|E] là [title|E] cấp cao nhất mà họ xác định chặt chẽ nhất, xác định Huy hiệu và tên [realm|E] của họ.\n\nNếu ngài kiểm soát nhiều tước vị của cùng một cấp, ngài có thể chọn một cái phải là $game_concept_primary_title$ của ngài."
  game_concept_recently_acquired_holding:0 "Địa sản giành được gần đây"
  game_concept_recently_acquired_holdings:0 "Địa sản giành được gần đây"
  game_concept_recently_acquired_holding_desc:0 "[holdings|E] giành được vào năm ngoái đặt người cai trị vượt quá [domain_limit|E] của họ không gây ra hình phạt cho các địa sản khác của họ, nhưng cũng không cung cấp [taxes|E] hoặc [levies|E]."
  game_concept_domain_size:0 "Quy mô Lãnh địa"
  game_concept_domain_size_desc:0 "$game_concept_domain_size$ của một nhân vật phản ánh số lượng [barony|E] và [county|E] [titles|E] mà cá nhân họ nắm giữ."
  game_concept_levies:0 "Chiêu binh"
  game_concept_levy:0 "Chiêu binh"
  game_concept_levies_desc:2 "Phần lớn [armies|E] được tạo thành từ $game_concept_levies$.\n\nMỗi [holding|E] cung cấp một số lượng $game_concept_levies$ cho [holder|E] của họ. [vassals|E] cung cấp một phần $game_concept_levies$ của họ cho [liege|E] của họ.\n\n$game_concept_levies$ bao gồm hầu hết là các chiến binh có vũ trang kém #weak (dân quân nông dân, bọn lưu manh, lính đánh thuê địa phương, quý tộc nghèo, địa chủ nhỏ, v.v.)#! cấu thành và được coi là một đơn vị duy nhất.\n\n$game_concept_levy$ có [GetDefine('NCombat', 'LEVY_ATTACK')|0] [damage|E] và [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] [toughness|E]. Loại [soldiers|E] khác trong trò chơi là [men_at_arms|E] — những chuyên gia được đào tạo đắt giá."
  game_concept_vassal_obligations:0 "Nghĩa vụ Chư hầu"
  game_concept_obligations:1 "Nghĩa vụ"
  game_concept_obligation:0 "Nghĩa vụ"
  game_concept_vassal_obligations_desc:4 "$game_concept_vassal_obligations$ xác định số lượng [tax|E] và [levies|E] mà một [vassal|E] phải cung cấp cho [liege|E] của họ là bao nhiêu. [government_form|E] của một Chư hầu quyết định $game_concept_obligations$ của họ được sửa đổi như thế nào.\n\n#weak Ví dụ, $game_concept_obligations$ của các [vassals|E] [GetGovernment('feudal_government').GetName] và [GetGovernment('clan_government').GetName] phụ thuộc vào [vassal_contract|E], trong khi của Chư hầu [GetGovernment('administrative_government').GetName] lại phụ thuộc vào [province_administration|E] của họ."
  game_concept_contract:0 "Hợp đồng"
  game_concept_crown_authority:0 "Uy quyền Quân chủ"
  game_concept_crown_authority_desc:1 "$game_concept_crown_authority$ thể hiện quyền lực chung mà một [ruler|E] nắm giữ đối với các [vassals|E] của họ.\n\nCó bốn cấp độ $game_concept_crown_authority$; [autonomous_vassals|E], [limited|E], [high|E], và [absolute|E]. Tăng $game_concept_crown_authority$ tiêu tốn một lượng [prestige|E] tùy thuộc vào cấp độ và [learning_skill|E] của người cai trị.\n\n#weak Các chư hầu không thích các cấp độ $game_concept_crown_authority$ cao, và hạ thấp nó là mục tiêu chính của [Concept( 'liberty_faction', 'Phe Tự Do' )|E].#!"
  game_concept_autonomous_vassals:0 "Chư hầu Tự trị"
  game_concept_autonomous_vassals_crown_authority:0 "Uy quyền Quân chủ Chư hầu Tự trị"
  game_concept_autonomous_vassals_crown_authority_desc:0 "'$game_concept_autonomous_vassals$ là cấp thấp nhất của [crown_authority|E]. Ở cấp này, [vassals|E] không có [opinion|E] hình phạt đối với [liege|E] của họ, và lãnh chúa chỉ có quyền lực cơ bản đối với họ."
  game_concept_limited:0 "Giới hạn"
  game_concept_limited_crown_authority:0 "Uy quyền Quân chủ Giới hạn"
  game_concept_limited_crown_authority_desc:1 "'$game_concept_limited_crown_authority$' là cấp độ thứ hai đến cấp thấp nhất của [crown_authority|E]. [vassals|E] có hình phạt #N -10#! [opinion|E] đối với [liege|E] của họ và lãnh chúa có thể [revoke|E] [titles|E] và [retract|E] chư hầu của một chư hầu. [ruler|E] có thể thay đổi giữa các [succession_laws|E] Phân chia khả dụng."
  game_concept_high:0 "Cao"
  game_concept_high_crown_authority:0 "Uy quyền Quân chủ Cao"
  game_concept_high_crown_authority_desc:2 "$game_concept_high_crown_authority$ là cấp thứ hai đến cấp cao nhất. [vassals|E] có hình phạt #N -20#! [opinion|E] đối với [liege|E] của họ.\n\nỞ cấp độ này — ngoài quyền hạn lãnh chúa ở [limited_crown_authority|E] — chư hầu dưới cùng một lãnh chúa không còn có thể gây chiến với nhau nữa, nhà trị có thể thay đổi giữa tất cả [succession_laws|E], và [titles|E] của chư hầu không thể được kế thừa bởi nhà cai trị bên ngoài [realm|E].\n\nCuối cùng, việc từ chối [revocation|E] tước vị [retraction|E] chư hầu bị coi là [crime|E] ngay cả khi lãnh chúa thiếu sự biện minh."
  game_concept_absolute:0 "Tuyệt đối"
  game_concept_absolute_crown_authority:0 "Uy quyền Quân chủ Tuyệt đối"
  game_concept_absolute_crown_authority_desc:2 "$game_concept_absolute_crown_authority$ là cấp độ cao nhất của [crown_authority|E]. [vassals|E] có hình phạt #N -30#! [opinion|E] đối với [liege|E] của họ.\n\nỞ cấp độ này — ngoài tác dụng của Uy quyền Quân chủ [high|E] và [limited|E] — nhà cai trị có thể chọn [designated_heir|E] với giá [prestige|E].\n\nNgoài ra, chư hầu không thể tuyên chiến ngay cả với nước những nhà cai trị ngoại quốc."
  game_concept_tribal_authority:0 "Uy quyền Bộ lạc"
  game_concept_tribal_authority_desc:2 "$game_concept_tribal_authority$ thể hiện tầm ảnh hưởng chung mà [ruler|E] [tribal|E] đối với [vassals|E] của họ. So với [crown_authority|E], nó cung cấp ít quyền hạn hơn và ở các cấp độ sau.\n\nTại đây là bốn cấp độ của $game_concept_tribal_authority$: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E], và [absolute_tribal|E]. Việc tăng $game_concept_tribal_authority$ tốn một lượng [prestige|E] tùy thuộc vào cấp độ và [learning_skill|E] của nhà cai trị, nhưng nhìn chung tốn kém hơn việc tăng uy quyền quân chủ.\n\n#weak Chư hầu không thích các cấp độ cao hơn của $game_concept_tribal_authority$, và việc hạ thấp nó là mục tiêu chính của bất kỳ [liberty_faction|E].#!"
  game_concept_disparate_tribes:0 "Bộ lạc Phân tán"
  game_concept_disparate_tribes_tribal_authority:0 "Uy quyền Bộ lạc Phân tán"
  game_concept_disparate_tribes_tribal_authority_desc:0 "$game_concept_disparate_tribes$ là cấp thấp nhất của [tribal_authority|E]. Ở cấp độ này, [vassals|E] không có hình phạt [opinion|E] nào đối với [liege|E] của họ, và Chư hầu không có bất kỳ quyền lực nào đối với họ ngoài khả năng đòi hỏi [levies|E] và [taxes|E]."
  game_concept_limited_tribal:0 "Giới hạn"
  game_concept_limited_tribal_authority:0 "Uy quyền Bộ lạc Giới hạn"
  game_concept_limited_tribal_authority_desc:0 "$game_concept_limited_tribal_authority$ là cấp thấp thứ hai của [tribal_authority|E]. [vassals|E] có hình phạt #N -10#! [opinion|E] đối với [liege|E] của họ, và lãnh chúa có thể [imprison|E] [characters|E] trong [realm|E] của họ."
  game_concept_high_tribal:0 "Cao"
  game_concept_high_tribal_authority:0 "Uy quyền Bộ lạc Cao"
  game_concept_high_tribal_authority_desc:0 "$game_concept_high_tribal_authority$ is là cấp độ cao thứ hai của [tribal_authority|E]. [vassals|E] có hình phạt #N -20#! [opinion|E] đối với [liege|E] của họ.\n\nỞ cấp độ này , cũng như khả năng [imprison|E] [characters|E], lãnh chúa có thể [revoke|E] [titles|E] và [retract|E] chư hầu của một chư hầu."
  game_concept_absolute_tribal:0 "Tuyệt đối"
  game_concept_absolute_tribal_authority:0 "Uy quyền Bộ lạc Tuyệt đối"
  game_concept_absolute_tribal_authority_desc:0 "$game_concept_absolute_tribal_authority$ là cấp cao nhất của [tribal_authority|E]. [vassals|E] có hình phạt #N -30#! [opinion|E] đối với [liege|E] của họ.\n\n Ở cấp độ này, ngoài ảnh hưởng của [limited_tribal|E] và [high_tribal_authority|E], nhà cai trị giờ đây có thể ổn định và trở thành [feudal|E].\n\nNhà cai trị [tribal|E] [GetReligionFamily('rf_pagan').GetName] chưa cải cách yêu cầu luật này để cải cách [faith|E] của họ."
  game_concept_powerful_vassal:0 "Chư hầu Quyền lực"
  game_concept_powerful_vassal_powerful:0 "Quyền lực"
  game_concept_powerful_vassals:0 "Chư hầu Quyền lực"
  game_concept_powerful_vassal_possessive:0 "Chư hầu Quyền lực"
  game_concept_powerful_vassal_desc:1 "'$game_concept_powerful_vassals$' là một số ít các [vassals|E] với nhiều [soldiers|E] nhất và [income|E] cao nhất. Ngài cần phải chú ý cẩn thận đến các chư hầu này, vì họ mong muốn giữ vững chức vị trong [council|E] của ngài và sẽ có [opinion|E] về ngài thấp hơn đáng kể nếu họ không làm được như vậy.\n\nThay đổi [succession_law|E] yêu cầu tất cả $game_concept_powerful_vassals$ phải có [opinion|E] tích cực về ngài, bị [cowed|E] bởi ngài, hoặc bị [imprisoned|E]."
  game_concept_realm_law:0 "Luật pháp Quốc gia"
  game_concept_realm_law_desc:0 "Các luật được áp dụng cho quốc gia của nhân vật này, chẳng hạn như cấp độ [crown_authority|E] hoặc [tribal_authority|E]."
  game_concept_title_law:0 "Luật Tước vị"
  game_concept_title_laws:0 "Luật Tước vị"
  game_concept_title_law_desc:1 "[titles|E] có thể được ban hành Luật [title_specific_succession|E] dành riêng cho Tước vị đó. Luật này sẽ quy định các quy tắc kế vị khác với các tước vị khác do cùng một nhân vật nắm giữ."
  game_concept_strong_vassal:0 "Chư hầu Mạnh mẽ"
  game_concept_strong_vassals:0 "Chư hầu Mạnh mẽ"
  game_concept_strong_vassal_desc:0 "$game_concept_strong_vassal$ là [vassal|E] người tiếp cận hoặc vượt quá quyền lực [liege|E] của họ, phải chịu một hình phạt [opinion|E]. #weak Họ coi lãnh chúa của họ là yếu đuối và không phù hợp để cai trị quốc gia.#!"
  game_concept_domain_limit:0 "Giới hạn Lãnh địa"
  game_concept_domain_limit_desc:0 "$game_concept_domain_limit$ xác định số lượng [holdings|E] ngài có thể có hợp pháp trong [domain|E] của mình. $game_concept_domain_limit$ bị ảnh hưởng bởi nhiều thứ, chẳng hạn như [stewardship_skill|E], [succession_law|E] của ngài và cấp của [primary_title|E].\n\nMặc dù ngài có thể nhận được mức $game_concept_domain_limit$ cao hơn, nhưng làm như vậy sẽ làm giảm [income|E] và [opinions|E] từ [vassal|E] của ngài."
  game_concept_vassal_limit:0 "Giới hạn Chư hầu"
  game_concept_vassal_limit_desc:2 "$game_concept_vassal_limit$ xác định ngài có thể có bao nhiêu [direct_vassals|E] hợp pháp (không bao gồm các chư hầu [barony|E]).\n\nMặc dù ngài có thể cao hơn $game_concept_vassal_limit$ của ngài, nhưng làm như vậy sẽ giảm [taxes|E] và [levies|E] chư hầu của ngài cung cấp, và ngài có thể tốt hơn nên [transferring|E] một số chư hầu ở dưới mức giới hạn."
  game_concept_leasing:0 "Thuê"
  game_concept_lease:0 "Thuê"
  game_concept_leases:0 "Thuê"
  game_concept_leased:0 "Thuê"
  game_concept_lessee:0 "Người thuê"
  game_concept_leasing_desc:1 "[baronies|E] nhỏ có thể được cho [holy_orders|E] hoặc [clergy|E] $game_concept_leased$. Các nam quốc đã thuê cung cấp [taxes|E] và [levies|E] cho [lessee|E] chứ không phải cho [holder|E].\n\nHiệp sĩ Đoàn có thể thuê [castle_holdings|E], trong khi giáo sĩ có thể thuê [temple_holdings|E].\n\n[holdings|E] đã thuê vẫn được coi là một phần của [realm|E] của người nắm giữ. Không thể thuê [county_capitals|E]."
  game_concept_succession:0 "Kế vị"
  game_concept_succession_desc:1 "$game_concept_succession$ xảy ra khi một [ruler|E] chết, phân chia [gold|E] và [titles|E] của họ cho [heirs|E] của họ theo [succession_laws|E].\n\nNgười chơi sẽ tiếp tục chơi với tư cách là [player_heir|E] của họ ngay cả khi một số tước vi bị mất vào tay các nhân vật khác.\n\nNếu không có người thừa kế của ngài, trò chơi sẽ kết thúc.\n\n#weak Một số trường hợp hiếm hoi có thể buộc một việc Kế vị xảy ra ngay cả trước Nhà cai trị chết, chẳng hạn như thua [excommunication_war|E]. Tuy nhiên, về mặt pháp lý, Nhà cai trị không thể tự mình thoái vị.#!"
  game_concept_heir:0 "Người Thừa kế"
  game_concept_heirs:0 "Người Thừa kế"
  game_concept_heir_possessive:  "Người Thừa kế"
  game_concept_heir_desc:3 "Người thừa kế là một Nhân vật kế thừa một hoặc nhiều [titles|E].\n\nMỗi người [title|E] nắm giữ đều có $game_concept_heir$, được xác định bởi [succession_laws|E] của [holder|E] hiện tại. Khi Người nắm giữ Tước vị hiện tại qua đời, hoặc kích hoạt [succession|E], $game_concept_heir$ hiện tại của Tước vị sẽ kế thừa nó.\n\nLưu ý rằng các Tước vị do cùng một [ruler|E] nắm giữ có thể có $game_concept_heirs$ khác nhau. Đáng chú ý nhất, [primary_title|E] được kế thừa bởi [primary_heir|E] và người chơi sẽ tiếp tục chơi với tư cách [player_heir|E]."
  game_concept_primary_heir:0 "Thừa kế Chính"
  game_concept_primary_heirs:0 "Thừa kế Chính"
  game_concept_primary_heir_possessive:  "Thừa kế Chính"
  game_concept_primary_heir_desc:0 "$game_concept_primary_heir$ là nhân vật sẽ kế thừa [primary_title|E] của [ruler|E] [succession|E]. Đây thường là — nhưng không phải lúc nào cũng — nhân vật giống với [player_heir|E]."
  game_concept_player_heir:0 "người thừa kế của ngài"
  game_concept_player_heir_desc:1 "$game_concept_player_heir$ là [heir|E] mà một người chơi sẽ tiếp tục chơi như theo [succession|E].\n\n$game_concept_player_heir$ is thường giống với [primary_heir|E], nhưng nếu [succession_law|E] của [primary_title|E] của ngài ra lệnh rằng nó phải thuộc về một nhân vật bên ngoài [dynasty|E] của ngài, thay vào đó, ngài sẽ tiếp tục đóng vai người thừa kế triều đại cho tước vị cao nhất thứ hai của mình (hoặc thứ ba, thứ tư, v.v.).\n\nTrường hợp này thường xảy ra khi $game_concept_player_heir$ của ngài được bỏ phiếu theo luật kế vị bầu cử."
  game_concept_title_heir:0 "Người Thừa kế Tước vị"
  game_concept_title_heirs:0 "Người Thừa kế Tước vị"
  game_concept_title_heir_desc:0 "Người thừa kế Tước vị là [heir|E] một [title|E] cụ thể với [title_succession|E] của riêng nó, Họ sẽ nhận được Tước vị đó khi [holder|E] hiện tại qua đời."
  game_concept_realm_heir:0 "Người Thừa kế Quốc gia"
  game_concept_realm_heirs:0 "Người Thừa kế Quốc gia"
  game_concept_realm_heir_desc:0 "Người thừa kế Quốc gia là một trong những [heirs|E] của [realm|E], và sẽ nhận được tất cả hoặc một số [titles|E] do [ruler|E] của Quốc gia đó nắm giữ khi Nhà cai trị đó chết.\n\nQuốc gia có thể có một hoặc nhiều Người thừa kế Quốc gia tùy thuộc vào [succession_law|E]."
  game_concept_disinherit:0 "Tước quyền Thừa kế"
  game_concept_disinherited:0 "Tước Quyền thừa kế"
  game_concept_disinheriting:0 "Tước Quyền thừa kế"
  game_concept_disinherits:0 "Tước Quyền thừa kế"
  game_concept_disinherit_desc:1 "[dynast|E] có thể tước quyền thừa kế một thành viên của [dynasty|E] của họ với cái giá phải trả là [dynasty_prestige|E].\n\nĐiều này sẽ xóa thành viên triều đại khỏi [line_of_succession|E] thông thường của bất kỳ tước vị nào thuộc hiện do các thành viên triều đại khác nắm giữ."
  game_concept_council:0 "Nội các"
  game_concept_council_i:  "@council_icon!"
  game_concept_council_desc:0 "$game_concept_council$ bao gồm sáu [councillors|E] những người hỗ trợ [ruler|E] của họ trong việc quản lý [realm|E]. Với tư cách là người đứng đầu các bộ phận tương ứng, họ có thể được giao nhiều [councillor_tasks|E] quan trọng."
  game_concept_councillor:0 "Thành viên Nội các"
  game_concept_councillors:0 "Thành viên Nội các"
  game_concept_councillor_desc:2 "Thành viên Nội các là trợ lý chính của bất kỳ [ruler|E] nào, và tạo nên [council|E]. Có sáu vị trí trong nội các: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (hoặc [realm_priest|E]), và cuối cùng là [spouse|E] của ngài.\n\nMỗi người phụ trách một bộ phận có thể được giao [councillor_tasks|E] khác nhau thực hiện.\n\n[powerful_vassals|E] sẽ rất khó chịu nếu không được bổ nhiệm vào một trong những vị trí này, nghĩa là ngài thường phải lựa chọn giữa việc xoa dịu một chư hầu quyền lực hoặc bổ nhiệm một người thực sự có năng lực.\n\nPhục vụ với tư cách là Thành viên Nội các cho [liege|E] của ngài sẽ mang lại cho ngài một khoản tiền thưởng, số tiền này sẽ tăng theo [rank|E] của Lãnh chúa."
  game_concept_councillor_task:0 "Nhiệm vụ Nội các"
  game_concept_councillor_tasks:0 "Nhiệm vụ Nội các"
  game_concept_councillor_task_desc:1 "$game_concept_councillor_tasks$ là những công việc quan trọng có thể được giao cho [councillors|E] của ngài. Những nhiệm vụ này có thể là chung chung hoặc nhắm tới mục tiêu cụ thể đến [county|E] hoặc [court|E].\n\nNếu ngài có [relation|E] với Thành viên Nội các, thì Nhiệm vụ có thời gian hoàn thành có thể mất nhiều thời gian hơn hoặc ít hơn.\n\n#weak Lưu ý rằng thành viên nội các không hiện diện thực tế để thực hiện các nhiệm vụ này, mà chỉ đơn thuần là dẫn dắt các nỗ lực.#!"
  game_concept_councillor_task_possible_side_effects:0 "Tác dụng phụ có thể xảy ra"
  game_concept_councillor_task_possible_side_effects_desc:2 "[councillor_task|E] có thể gây ra những kết quả không mong muốn theo thời gian. Những điều này có thể tốt hoặc xấu, với những tác động tích cực thì [skill|E] của Thành viên Nội các càng cao, và những tác động tiêu cực có nhiều khả năng là Kỹ năng liên quan càng thấp."
  game_concept_chancellor:0 "Chưởng ấn"
  game_concept_chancellors:0 "Chưởng ấn"
  game_concept_chancellor_desc:0 "$game_concept_chancellor$ là [councillor|E] phụ trách các nỗ lực ngoại giao, cả bên trong và bên ngoài [realm|E]."
  game_concept_steward:0 "Nhà Quản lý"
  game_concept_stewards:0 "Nhà Quản lý"
  game_concept_steward_desc:0 "$game_concept_steward$ là [councillor|E] phụ trách quản lý [domain|E], for ví dụ như các vấn đề về [taxation|E], [culture|E] và [development|E]."
  game_concept_marshal:0 "Thống soái"
  game_concept_marshals:0 "Thống soái"
  game_concept_marshal_desc:0 "$game_concept_marshal$ là [commander|E] trưởng của ngài và [councillor|E] phụ trách các vấn đề quân sự nói chung."
  game_concept_spymaster:0 "Bậc thầy Gián điệp"
  game_concept_spymaster_desc:1 "$game_concept_spymaster$ là [councillor|E] của ngài phụ trách các vấn đề về mưu lược và tình báo. Hãy cẩn thận khi có một Bậc thầy Gián điệp không trung thành, vì họ có thể dễ dàng che giấu và tham gia vào âm mưu [GetScheme('murder').GetTypeName] chống lại ngài và gia đình ruột thịt của ngài!"
  game_concept_court_chaplain:0 "Tư tế Triều đình"
  game_concept_court_chaplains:0 "Tư tế Triều đình"
  game_concept_court_chaplain_desc:0 "$game_concept_court_chaplain$ là [councillor|E] phụ trách các vấn đề tôn giáo và tâm linh [faiths|E] với [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName].\n\nĐức tin với Giáo lý [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName] có [realm_priest|E] mạnh mẽ hơn nhiều (và rắc rối) thay vì $game_concept_court_chaplain$."
  game_concept_realm_priest:0 "Tư tế Quốc gia"
  game_concept_realm_priests:0 "Tư tế Quốc gia"
  game_concept_realm_priest_possessive:0 "Tư tế Quốc gia"
  game_concept_realm_priest_desc:0 "$game_concept_realm_priest$ là [councillor|E] phụ trách các vấn đề tôn giáo và tâm linh [faiths|E] với [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName].\n\nKhông giống như [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] tương đương ([court_chaplains|E]), $game_concept_realm_priests$ tự động [lease|E] tất cả các [temple_holdings|E] trong [domain|E] của [ruler|E], và cũng nhận được một phần [taxes|E] và [levies|E] từ [vassal|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ cung cấp cho [liege|E] của họ Chiên binh và Thuế nếu họ có Quan điểm tích cực. [opinion|E] về [liege|E] của họ càng cao, họ sẽ cung cấp càng nhiều hơn.\n\n$game_concept_realm_priests$ với Quan điểm thấp về [liege|E] của họ sẽ không cung cấp cho họ bất kỳ khoản Thuế hoặc Chiêu binh nào và có thể gây ra các vấn đề."
  game_concept_law:0 "Luật pháp"
  game_concept_laws:0 "Luật pháp"
  game_concept_law_i:  "@law_icon!"
  game_concept_law_desc:  "Luật pháp [realm_possessive|E] là thứ xác định cách cấu trúc của Quốc gia đó.\n\Điều cơ bản nhất trong số này là [crown_authority|E] của Quốc gia (hoặc [tribal_authority|E] đối với [tribes|E], [imperial_bureaucracy|E] đối với [administrative|E] và [nomadic_authority|E] đối với [nomads|E]), vì những Luật đó xác định cách các [lieges|E] và [vassals|E] tương tác thường xuyên.\n\nMặc dù ít ảnh hưởng đến cuộc sống hàng ngày của [rulers|E] trong một Quốc gia, nhưng  [succession_laws|E] và [title_laws|E] vẫn rất quan trọng cần xem xét đối với [succession|E]."
  game_concept_succession_law:0 "Luật Kế vị"
  game_concept_succession_laws:0 "Luật Kế vị"
  game_concept_succession_law_desc:2 "Mỗi [ruler|E] đều có Luật Kế vị chính xác định điều gì xảy ra với [titles|E] của họ khi [succession|E].\n\nNgoài ra, một Tước vị riêng lẻ đôi khi có thể có Luật [title_succession|E] riêng được ưu tiên hơn so với Luật mặc định. Đối với ví dụ: Đế quốc La Mã Thần thánh có thể là Quyền bầu cử mặc dù hoàng đế có Phân chia làm Luật Kế vị chính.\n\nNgài chỉ có thể thay đổi Luật Kế vị khi ở cấp độ [crown_authority|E] thích hợp."
  game_concept_religious_head_succession_law:0 "Luật kế vị Lãnh đạo Đức tin"
  game_concept_religious_head_succession_law_short:0 "Luật của Lãnh đạo Đức tin"
  game_concept_religious_head_succession_laws:0 "Luật kế vị Lãnh đạo Đức tin"
  game_concept_religious_head_succession_laws_short:0 "Luật của Lãnh đạo Đức tin"
  game_concept_religious_head_succession_law_desc:0 "[rulers|E] đồng thời là [heads_of_faith|E] có thêm một luật [succession|E] lãnh thổ, yêu cầu [heir|E] của họ phải có cùng [faith|E] với họ. Điều này không bao giờ thay đổi được, và [titles|E] $game_concept_head_of_faith$ không thể có [title_succession|E] riêng biệt. Cách duy nhất để loại bỏ loại luật pháp quốc gia này là để một thế lực bên ngoài phá hủy [head_of_faith|E] $game_concept_title$."
  game_concept_opinion:0 "Quan điểm"
  game_concept_opinions:0 "Quan điểm"
  game_concept_opinion_i:0 "@opinion_icon!"
  game_concept_opinion_desc:1 "Mỗi Nhân vật đều có $game_concept_opinion$ một chiều với mọi Nhân vật khác, được biểu thị bằng một giá trị từ #N -100#! đến #P +100#!.\n\nQuan điểm về một nhân vật khác của ngài là rất quan trọng tầm quan trọng, vì nó sẽ thúc đẩy hành vi của họ!\n\nNgài nên đặc biệt cảnh giác với Quan điểm của [powerful_vassals|E], [spymaster|E] và [spouse|E] của ngài."
  game_concept_faction:0 "Phe phái"
  game_concept_factions:0 "Phe phái"
  game_concept_faction_desc:0 "Một $game_concept_faction$ là một nhóm các [vassals|E] có lợi ích chính trị chung. Dân số địa phương tại các [counties|E] cũng có thể tham gia một số loại Phe, như Phe Nông dân.\n\nCác Phe trở nên nguy hiểm một khi [faction_discontent|E] của chúng đạt đến một điểm nhất định, vào thời điểm đó chúng sẽ đưa ra tối hậu thư.\n\nNếu [liege|E] không tuân thủ, Phe sẽ nổi dậy, châm ngòi cho một cuộc [civil_war|E]. Nếu Phe tan rã, Lãnh chúa phải có ít nhất [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E] để thắng cuộc Chiến."
  game_concept_faction_discontent:0 "Bất mãn"
  game_concept_discontent:0 "Bất mãn"
  game_concept_faction_discontent_desc:1 "$game_concept_faction_discontent$ là thước đo mức độ gần gũi của [faction|E] trong việc đưa ra tối hậu thư.\n\nNếu [military_power|E] của Phe phái đạt đến ngưỡng, Sự bất mãn sẽ tăng lên hằng tháng. Nếu Sức mạnh Quân sự dưới mức ngưỡng, Sự bất mãn sẽ giảm xuống. Những Phe phái rất mạnh sẽ khiến Sự bất mãn của họ tăng lên nhanh chóng."
  game_concept_military_power:0 "Sức mạnh Quân sự"
  game_concept_faction_military_power:0 "Sức mạnh Quân sự Phe phái"
  game_concept_faction_military_power_desc:0 "$game_concept_faction_military_power$ là thước đo tổng sức mạnh quân sự của [faction|E] so với mục tiêu của họ.\n\nMỗi thành viên phe phái cá nhân sẽ thêm toàn bộ sức mạnh của họ vào Phe phái miễn là họ vẫn ở trong Phe phái. Nếu mục tiêu phe phái là [liege|E] của một thành viên, sức mạnh của thành viên đó cũng bị trừ vào sức mạnh tương đối của Lãnh chúa."
  game_concept_scheme:0 "Âm mưu"
  game_concept_scheming:0 "Âm mưu"
  game_concept_schemes:0 "Âm mưu"
  game_concept_scheme_desc:3 "$game_concept_scheme$ là một nỗ lực dài hạn nhằm tác động đến thế giới xung quanh ngài. Các $game_concept_schemes$ có thể nhắm mục tiêu vào [characters|e], [titles|e], [cultures|e] và [faiths|e], và có bốn loại: [personal|e], [scheme_hostile|e], [political|e], và [contract_schemes|e].\n\n[success_chance|e] $game_concept_scheme$ của ngài tăng lên theo thời gian tùy thuộc vào mức độ thành thạo của ngài trong [skill|e] liên quan, và cũng có thể bị ảnh hưởng bởi [agents|e] mà ngài lên kế hoạch trong $game_concept_scheme$ của mình.\n\n#WEAK [secret_schemes|e] bị ẩn khỏi mục tiêu nhưng có thể bị phát hiện nếu [secrecy|e] của chúng thấp. #!"
  game_concept_scheme_countermeasure:  "Trọng tâm Biện pháp Đối phó"
  game_concept_scheme_countermeasures:  "Trọng tâm Biện pháp Đối phó"
  game_concept_scheme_countermeasure_countermeasure:  "Biện pháp Đối phó"
  game_concept_scheme_countermeasure_countermeasures:  "Biện pháp Đối phó"
  game_concept_scheme_countermeasure_desc:  "Khi ngài nghi ngờ rằng một [scheme|e] đang nhắm vào mình, thì ngài có thể làm gì đó bằng cách hướng tất cả các biện pháp phòng thủ của mình vào một loại $game_concept_scheme$ với cái giá phải trả là bỏ qua những loại khác.\n\nVì lý do này, chỉ có một loại có thể hoạt động tại một thời điểm. Việc tăng cường phòng thủ ở một khu vực liên quan đến việc thu hút sự chú ý khỏi khu vực khác.\n\nChúng có thể được sử dụng để giảm [secrecy|E] hoặc điều chỉnh [success_chance|E] của các nhóm $game_concept_schemes$ khác nhau. Chúng có thể giúp ngài tiết kiệm thời gian hoặc củng cố các biện pháp phòng thủ của mình, nhưng đi kèm với những nhược điểm khiến ngài không muốn có một loại hoạt động mọi lúc."
  game_concept_scheme_precaution:  "Biện pháp Bổ sung"
  game_concept_scheme_precautions:  "Biện pháp Bổ sung"
  game_concept_scheme_precaution_precaution:  "Biện pháp"
  game_concept_scheme_precaution_precautions:  "Biện pháp"
  game_concept_scheme_precaution_desc:  "Không phải [character|E] nào cũng có thể thực hiện được $game_concept_scheme$ chỉ bằng [skill|E] alone — khi [scheme_target_target|E] quá khó khăn, thì việc trả tiền cho các $game_concept_scheme_precautions$ có thể giúp bù đắp cho một điểm yếu bằng cách đánh đổi điểm yếu khác.\n\n#WEAK $game_concept_scheme_precaution_precautions$ là tùy chọn: hãy sử dụng chúng một cách chiến thuật.#!"
  game_concept_personal_scheme:0 "Âm mưu Cá nhân"
  game_concept_personal_schemes:0 "Âm mưu Cá nhân"
  game_concept_personal:0 "Cá nhân"
  game_concept_personal_scheme_desc:  "$game_concept_personal_schemes$ là các [schemes|E] nhằm tạo ra trạng thái giữa [scheme_owner|E] và [scheme_target|E].\n\nVí dụ về $game_concept_personal_schemes$ là:\n$BULLET_WITH_TAB$[GetScheme('sway').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('befriend').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
  game_concept_scheme_owner:0 "Kẻ Âm mưu"
  game_concept_schemer:0 "Kẻ Âm mưu"
  game_concept_scheme_owners:0 "Kẻ Âm mưu"
  game_concept_scheme_owner_owner:  "Sở hữu"
  game_concept_scheme_owner_desc:0 "$game_concept_scheme_owner_owner$ của $game_concept_scheme$ là một [character|E] đang âm mưu nhắm tới [scheme_target|E].\n\n#WEAK Ví dụ, kẻ giết người tiềm năng trong một $game_concept_scheme$ [GetScheme('murder').GetTypeName].#!"
  game_concept_scheme_target:0 "Mục tiêu Âm mưu"
  game_concept_scheme_targets:0 "Mục tiêu Âm mưu"
  game_concept_scheme_target_target:0 "Mục tiêu"
  game_concept_scheme_target_desc:0 "$game_concept_scheme_target_target$ của $game_concept_scheme$ là một [character|E] đang bị [scheme_owner|E] âm mưu nhắm tới.\n\n#WEAK Ví dụ, nạn nhân tiềm năng trong một $game_concept_scheme$ [GetScheme('murder').GetTypeName].#!"
  game_concept_secret_scheme:0 "Âm mưu Bí mật"
  game_concept_secret_scheme_single:0 "Bí mật"
  game_concept_secret_schemes:0 "Âm mưu Bí mật"
  game_concept_secret_scheme_desc:0 "$game_concept_secret_scheme$ là một [scheme|E] được tiến hành mà [scheme_target|E] không biết.\n\nTuy nhiên, nó có thể bị phát hiện, gây làm giảm [success_chance|E] và tăng khả năng [scheme_owner|E] bị phát hiện khi Âm mưu thực thi.\n\nCác [agents|E] được tuyển vào $game_concept_secret_scheme$  xác suất bị [agent_discovery_discovered|E]."
  game_concept_agent:0 "Đồng mưu"
  game_concept_agents:0 "Đồng mưu"
  game_concept_agent_i:0 "@scheme_agent_icon!"
  game_concept_agents_desc:3 "$game_concept_agent$ là người tham gia vào một [scheme|E], người có thể cung cấp một trong ba lợi ích. Họ có thể tăng [success_chance|e], giảm [scheme_speed_single|e], hoặc cải thiện [secrecy|e]. Chỉ có các [courtiers|E], [guests|E], và [direct_vassals|E] của mục tiêu mới có thể được tuyển một làm Đồng mưu.\n\nĐối với các Âm mưu [scheme_hostile|E], việc có các các đồng mưu ở gần mục tiêu là rất quan trọng. Ví dụ [councillors|E] hoặc [close_family|E] của Mục tiêu Âm mưu đóng góp nhiều hơn vào $game_concept_scheme_speed_single$ và $game_concept_success_chance$.\n\nViệc trở thành $game_concept_agent$ trong một [hostile_scheme|e] là [crime|E], và $game_concept_agent$ có nguy cơ bị [agent_discovery_discovered|E]."
  game_concept_agent_discovery:0 "Phát hiện Đồng mưu"
  game_concept_agent_discovery_discovered:0 "Phát hiện"
  game_concept_agent_discovery_desc:1 "Các [agents|E] [secret_scheme|E] bị phát hiện có thể bị [liege|E] của họ coi là [criminals|E], và có khả năng bị [imprisoned|E] nếu đúng như thế."
  game_concept_scheme_discovery_chance:0 "Cơ hội Phát hiện Âm mưu"
  game_concept_scheme_discovery_chance_desc:0 "Con số này được khấu trừ trực tiếp từ điểm [secrecy|E] của bất kỳ [secret_scheme|E] nào nhắm tới ngài hoặc các [courtiers|E] của ngài.\n\n#WEAK $game_concept_secrecy$ được kiểm tra khi một $game_concept_scheme$ được thực thi, và với tần suất giảm mỗi tháng một lần.#!"
  game_concept_predicted_scheme_difficulty:  "Độ khó Âm mưu Dự đoán"
  game_concept_predicted_difficulty:  "Độ khó Dự đoán"
  game_concept_predicted_scheme_difficulty_desc:  "Nhiều yếu tố tạo nên một [scheme|E], thành công, một số yếu tố không thể biết được cho đến khi nó bắt đầu và các [agents|E] được tuyển dụng.\n\nMặc dù bất kỳ $game_concept_scheme$ nào cũng khả thi, nhưng nhiều yếu tố có thể phải tốn kém.\n\nNăm cấp độ khó là:\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_excellent$ #WEAK — có khả năng dễ dàng, nhanh chóng và im lặng#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_high$ #WEAK — cần nỗ lực tối thiểu#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_medium$ #WEAK — có thể cần một vài khoản hối lộ#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_low$ #WEAK — thành công sẽ là điều đắt đỏ#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_abysmal$ #WEAK — thành công không có khả năng xảy ra và rất tốn kém#!"
  game_concept_prevented_murder:0 "Ngăn chặn Mưu sát"
  game_concept_prevented_murder_prevent:0 "Ngăn chặn"
  game_concept_prevented_murder_desc:2 "Trong một số trường hợp hiếm gặp, một số tình huống nhất định đối với sinh mạng của [scheme_target_target|E] của [GetScheme('murder').GetTypeName] có thể khiến [scheme|E] thất bại ở giai đoạn cuối cùng của quá trình thực hiện.\n\nĐiều này ghi đè lên [success_chance|E].\n\n#WEAK Các ví dụ bao gồm sự can thiệp của vệ sĩ, người nếm thức ăn, shieldmaiden hoặc thú cưng trung thành.#!"
  game_concept_political_scheme:  "Âm mưu Chính trị"
  game_concept_political_schemes:  "Âm mưu Chính trị"
  game_concept_political:  "Chính trị"
  game_concept_political_scheme_desc:  "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'game_concept_political_scheme_desc_tgp', 'game_concept_political_scheme_desc_default' )]"
  game_concept_political_scheme_desc_default:  "$game_concept_political_schemes$ bao gồm tất cả các [schemes|E] được sử dụng độc quyền bởi [administrative_governments|E]. Chúng bao gồm:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n"
  game_concept_political_scheme_desc_tgp:  "$game_concept_political_schemes$ bao gồm các [schemes|E] chủ yếu mang tính chất chính trị và quan liêu, thường được sử dụng bởi các loại [administrative|E] và [mandala_government|E].\n\nÂm mưu Chính trị Hành chính:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n\nÂm mưu Chính trị Mandala:\n$BULLET_WITH_TAB$[GetScheme('coerce_tributary').GetTypeName]\n"
  game_concept_hostile_scheme:0 "Âm mưu Thù địch"
  game_concept_scheme_hostile:0 "Thù địch"
  game_concept_hostile_schemes:0 "Âm mưu Thù địch"
  game_concept_hostile_scheme_desc:5 "$game_concept_hostile_schemes$ là [schemes|E] nhằm mục đích gây hại cho một [character|E]. Hầu hết các $game_concept_hostile_schemes$ đều khai thác [secrecy|E].\n\nVí dụ của $game_concept_hostile_schemes$ là:\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('abduct').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName]"
  game_concept_scheme_phase:  "Giai đoạn Âm mưu"
  game_concept_scheme_phases:  "Giai đoạn Âm mưu"
  game_concept_scheme_phase_phase:  "Giai đoạn"
  game_concept_scheme_phase_phases:  "Giai đoạn"
  game_concept_scheme_phase_desc:  "$game_concept_scheme_phase_phase$ là khoảng thời gian cần thiết để tăng [scheme_success_chance|E] #EMP once#!.\n\nỞ mỗi $game_concept_scheme_phase_phase$, $game_concept_scheme$ sẽ nhận được [scheme_opportunity_opportunity|e]. Một [scheme_speed_single|e] có thể được rút ngắn bằng cách chỉ định các [agents|e], và được tăng lên bởi [scheme_resistance|e] của mục tiêu."
  game_concept_secret:0 "Bí mật"
  game_concept_secrets:0 "Bí mật"
  game_concept_secret_desc:0 "$game_concept_secrets$ là những điều mà các nhân vật không muốn người khác biết vì họ đáng xấu hổ, vô đạo đức hoặc hoàn toàn là [criminal|E].\n\nCó thể khám phá những bí mật thông qua '$task_find_secrets$' [councillor_task|E] cho [spymaster|E]. Khi ngài biết $game_concept_secret$ của ai đó, ngài có thể [blackmail|E] nhân vật đó để nhận được [hook|E]."


#RANKS/TIERS
  game_concept_barony:  "Nam quốc"
  game_concept_baronies:  "Nam quốc"
  game_concept_barons:  "Nam tước"
  game_concept_baron:  "Nam tước"
  game_concept_barony_desc:  "$game_concept_barony$ là một [title|E] có [title_tier|E] thấp nhất.\n\nCác $game_concept_baronies$ có diện tích nhỏ nhất trên bản đồ, được tổ chức thành các [counties|E] lớn hơn.\n\nCác $game_concept_titles$ $game_concept_barony$ phải luôn có một [holder|E] nếu chúng chứa một [holding|E]."
  game_concept_baron_desc: "Một $game_concept_baron$ là một [ruler|E] có [primary_title|E] là một [barony|E].\n\n[rank|E] của họ là cấp thấp nhất có thể, trực tiếp dưới cấp [counts|E]. Do đó, họ không thể có [vassals|E] và bất kỳ ai không phải là $game_concept_baron$ đều có thể trở thành [liege|E] của họ."

  game_concept_county:  "Bá quốc"
  game_concept_counties:  "Bá quốc"
  game_concept_count:  "Bá tước"
  game_concept_counts:  "Bá tước"
  game_concept_county_desc:  "$game_concept_county$ là một [title|E] có [title_tier|E] thấp hơn một bậc so với [duchy|E] và cao hơn một bậc so với [barony|E].\n\n$game_concept_title$ bao gồm [county_capital|E] trong $game_concept_county$, cũng như các quyền [de_jure|E] đối với tất cả các [baronies|E] trong $game_concept_county$.\n\nCác $game_concept_counties$ luôn có [holders|E] vì $game_concept_county_capitals$ không thể bị phá hủy."
  game_concept_count_desc: "Một $game_concept_count$ là một [ruler|E] có [primary_title|E] là một [county|E].\n\n[rank|E] của họ chỉ đứng trên [barons|E] và trực tiếp dưới cấp [dukes|E], và do đó họ có thể có các $game_concept_barons$ làm [vassals|E], đồng thời có một $game_concept_duke$ hoặc cấp cao hơn làm [liege|E] của mình."

  game_concept_duchy:  "Công quốc"
  game_concept_duchies:  "Công quốc"
  game_concept_duke:  "Công tước"
  game_concept_dukes:  "Công tước"
  game_concept_duchy_desc:  "$game_concept_duchy$ là một [title|E] có [title_tier|E] thấp hơn một bậc so với [kingdom|E] và cao hơn một bậc so với [county|E].\n\n[holder|E] của một $game_concept_duchy$ có quyền [de_jure|E] đối với các $game_concept_counties$ cấu thành nên nó và có thể có các [counts|E] là các [vassals|E].\n\nCác công quốc có thể không hoạt động và không có [holder|E] hiện tại. $game_concept_title_succession$ như vậy có thể được tạo ra bởi một [ruler|E] kiểm soát ít nhất một nửa số $game_concept_counties$ của nó."
  game_concept_duke_desc: "Một $game_concept_duke$ là một [ruler|E] có [primary_title|E] là một [duchy|E].\n\n[rank|E] của họ trực tiếp đứng trên [counts|E] và trực tiếp dưới cấp [kings|E], và do đó họ có thể có các $game_concept_counts$ làm [vassals|E], đồng thời có một $game_concept_king$ hoặc cấp cao hơn làm [liege|E] của mình."

  game_concept_kingdom:  "Vương quốc"
  game_concept_kingdoms:  "Vương quốc"
  game_concept_king:  "Quốc vương"
  game_concept_kings:  "Quốc vương"
  game_concept_kingdom_desc: "Một $game_concept_kingdom$ là một [title|E] thấp hơn một [empire|E] một [title_tier|E] và cao hơn một [duchy|E] một bậc.\n\n[holder|E] của một $game_concept_kingdom$ có quyền [de_jure|E] đối với lãnh thổ cấu thành của nó.\n\n$game_concept_kingdoms$ có thể ở trạng thái ngủ yên và hiện không có $game_concept_holder$. Các $game_concept_titles$ như vậy có thể được tạo bởi một [ruler|E] kiểm soát ít nhất một nửa số [counties|E] bên trong."
  game_concept_king_desc: "Một $game_concept_king$ là một [ruler|E] có [primary_title|E] là một [kingdom|E].\n\n[rank|E] của họ trực tiếp đứng trên [dukes|E] và trực tiếp dưới cấp [emperors|E], và do đó họ có thể có các $game_concept_dukes$ và cấp thấp hơn làm [vassals|E], đồng thời có một $game_concept_emperor$ hoặc cấp cao hơn làm [liege|E] của mình."

  game_concept_empire:  "Đế quốc"
  game_concept_empires:  "Đế quốc"
  game_concept_emperor:  "Hoàng đế"
  game_concept_emperors:  "Hoàng đế"
  game_concept_empire_desc: "Một $game_concept_empire$ là một [title|E] thấp hơn một [hegemony|E] một [title_tier|E] và cao hơn một [kingdom|E] một bậc.\n\n[holder|E] của một Đế chế có quyền [de_jure|E] đối với lãnh thổ cấu thành của nó và có thể có các [kings|E] làm [vassals|E].\n\n$game_concept_empires$ có thể ở trạng thái ngủ yên và hiện không có $game_concept_holder$. Các $game_concept_titles$ như vậy có thể được tạo bởi một [ruler|E] kiểm soát hơn 80% số [counties|E] bên trong."
  game_concept_emperor_desc: "Một $game_concept_emperor$ là một [ruler|E] có [primary_title|E] là một [empire|E].\n\n[rank|E] của họ trực tiếp đứng trên [kings|E] và trực tiếp dưới cấp [hegemons|E], và do đó họ có thể có các $game_concept_kings$ và cấp thấp hơn làm [vassals|E], và chỉ có thể có một $game_concept_hegemon$ làm [liege|E] của mình."

  game_concept_hegemony:  "Bá quyền"
  game_concept_hegemonies:  "Bá quyền"
  game_concept_hegemon:  "Bá chủ"
  game_concept_hegemons:  "Bá chủ"
  game_concept_hegemony_desc:  "$game_concept_hegemony$ là một [title|E] có [title_tier|E] cao nhất.\n\n[holder|E] của một $game_concept_hegemony$ có quyền [de_jure|E] đối với lãnh thổ cấu thành của nó và có thể có [emperors|E] là các [vassals|E]."
  game_concept_hegemon_desc: "Một $game_concept_hegemon$ là một [ruler|E] có [primary_title|E] là một [hegemony|E].\n\n[rank|E] của họ là cấp cao nhất có thể, trực tiếp đứng trên [emperors|E]. Do đó, họ có thể có bất kỳ ai không phải là $game_concept_hegemons$ làm [vassals|E], và họ không bao giờ có [liege|E]."


  game_concept_culture:0 "Văn hóa"
  game_concept_cultures:0 "Văn hóa"
  game_concept_culture_possessive:  "Văn hóa"
  game_concept_cultural:0 "Văn hóa"
  game_concept_culture_desc:1 "$game_concept_culture$ đại diện cho ngôn ngữ và phong tục của một Nhân vật hoặc [county|E].\n\nCác nhân vật thuộc các nền văn hóa khác nhau sẽ có [opinions|E] thấp hơn về nhau. Hình phạt này có thể được giảm bớt bằng cách tăng cường [cultural_acceptance|E]."
  game_concept_culture_i:  "@culture_icon!"
  game_concept_religion:0 "Tôn giáo"
  game_concept_religions:0 "Tôn giáo"
  game_concept_religion_desc:  "Một $game_concept_religion$ có thể bao gồm nhiều giáo phái khác nhau, được gọi là [faiths|E]. Tôn giáo, đến lượt mình, thuộc một trong ba [religious_families|E]; [GetReligionFamily('rf_abrahamic').GetName], [GetReligionFamily('rf_eastern').GetName], [GetReligionFamily('rf_sinitic').GetName] hoặc [GetReligionFamily('rf_pagan').GetName]."
  game_concept_heresy:0 "Dị giáo"
  game_concept_heresies:0 "Dị giáo"
  game_concept_heresy_desc:0 "Khi [fervor|E] của [faith|E] thấp, sự bùng phát của Dị giáo có thể xảy ra. Khi điều đó xảy ra, một [ruler|E] Đức tin nhiệt thành thấp sẽ chuyển đổi sang một Đức tin khác, trở thành [GetTrait('heresiarch').GetName( GetNullCharacter )]. Sau đó, họ sẽ truyền bá Đức tin mới đến [counties|E] và [vassals|E].\n\nNếu một đợt bùng phát nhỏ, nó sẽ dừng lại ở đó. Nếu đó là một đợt bùng phát lớn, nhiều nhà cai trị trong cùng khu vực sẽ chuyển đổi. Nếu ngài ở trong khu vực đó, ngài cũng có quyền lựa chọn chuyển đổi, nếu ngài mong muốn. "
  game_concept_faith:0 "Đức tin"
  game_concept_faiths:0 "Đức tin"
  game_concept_faithpossessive:0 "Đức tin"
  game_concept_faith_desc:0 "Đức tin là một giáo phái cụ thể của [religion|E] lớn hơn. Tất cả các nhân vật và [counties|E] đều có Đức tin giống như họ có [culture|E].\n\nMỗi Đức tin được xác định bởi một tập hợp [doctrines|E] với những kết quả sâu rộng đối với những người tin theo nó.\n\nMỗi Đức tin cũng có một giá trị [fervor|E] kiểm soát mức độ dễ bị tổn thương của nó đối với [heresy|E] ([rulers|E] và các Bá quốc chuyển đổi Đức tin trong cùng một Tôn giáo)."
  game_concept_tolerance:0 "Khoan dung"
  game_concept_tolerate:0 "Khoan dung"
  game_concept_tolerates:0 "Khoan dung"
  game_concept_fervor:0 "Nhiệt thành"
  game_concept_fervor_desc:2 "$game_concept_fervor$ là phạm vi [faith|E] nằm trong khoảng từ #V 0#! tới #V 100%#!. $game_concept_fervor$ thấp giúp [rulers|E] dễ dàng tạo ra đức tin mới cho riêng họ và tăng khả năng [counties|E] và các nhân vật chuyển đổi sang các tín ngưỡng khác, bao gồm cả [heresies|E]. $game_concept_fervor$ cao làm tăng tốc độ chuyển đổi của Bá quốc.\n\n$game_concept_fervor$ thay đổi tự nhiên theo thời gian. Những Đức tin nhỏ hơn có xu hướng có Nhiệt thành cao hơn. Các Đức tin lớn hơn có xu hướng có $game_concept_fervor$ thấp hơn.\n\nTiến hành Đại Thánh Chiến và Thánh Chiến thành công sẽ giảm $game_concept_fervor$. Là mục tiêu sẽ tăng $game_concept_fervor$. Bùng phát [heresy|E] sẽ làm tăng $game_concept_fervor$ đáng kể."
  game_concept_doctrine:0 "Giáo lý"
  game_concept_doctrines:0 "Giáo lý"
  game_concept_doctrines_desc:1 "Giáo lý có thể được coi là luật tôn giáo xác định hành vi được chấp nhận trong [faith|E]."
  game_concept_gender_doctrines:0 "Giáo Lý Giới tính"
  game_concept_gender_doctrines_desc:0 "Những [doctrines|E] này xác định [gender_laws|E] nào có sẵn cho các nhân vật của [faith|E].\n\nNó cũng xác định một số quy tắc bổ sung, chẳng hạn như những [claims|E] có thể được kế thừa, ai có thể trở thành [commanders|E] và [knights|E], và [house|E] của cha mẹ họ sẽ thuộc về [bastard|E].\n\nGiáo Lý Giới tính:\n$BULLET_WITH_TAB$Nam giới Thống trị\n$BULLET_WITH_TAB$Cân bằng\n$BULLET_WITH_TAB$Nữ giới Thống trị"
  game_concept_realm_capital:0 "Thủ đô Quốc gia"
  game_concept_realm_capitals:0 "Thủ đô Quốc gia"
  game_concept_realm_capital_possessive:  "Thủ đô Quốc gia"
  game_concept_capital:0 "Thủ đô"
  game_concept_capitals:  "Thủ đô"
  game_concept_capital_possessive:  "Thủ đô"
  game_concept_realm_capital_desc:0 "$game_concept_realm_capital$ là [holding|E] nơi cư trú của [ruler|E] và [court|E] của họ. Địa sản này có phần thưởng [tax|E], và luôn được kế thừa bởi [primary_heir|E].\n\n[occupying|E] Thủ đô Quốc gia của kẻ thù trong một cuộc chiến tranh mang lại một lượng [war_score|E] đáng kể và đôi khi cho phép ngài [imprison|E] các thành viên trong gia đình của kẻ thù."
  game_concept_county_capital:0 "Thủ phủ Bá quốc"
  game_concept_county_capitals:0 "Thủ phủ Bá quốc"
  game_concept_county_capital_desc:0 "$game_concept_county_capital$ là [holding|E] chính củ [county|E]. Địa sản này không bao giờ có thể bị phá hủy hoặc [leased|E] và luôn thuộc sở hữu của [ruler|E] người nắm giữ [title|E] Bá quốc.\n\nThủ phủ Bá quốc cho phép xây dựng một [building|E] bổ sung so với một Địa sản nhỏ hơn."
  game_concept_de_jure_capital:0 "Thủ đô De Jure"
  game_concept_de_jure_capital_desc:1 "$game_concept_de_jure_capital$ của [title|E] là [county|E] từng là thủ phủ lịch sử của nó. Ngài luôn có thể chọn chuyển [realm_capital|E] của ngài đến $game_concept_de_jure_capital$ của [primary_title|E] của ngài, ngay cả khi nó đã được chuyển đi."
  game_concept_capital_duchy:0 "Thủ đô Công quốc"
  game_concept_capital_duchy_desc:1 "Sửa đổi $game_concept_capital_duchy$ gia tăng số lượng các [levies|E] mà ngài nhận được từ tất cả [holdings|E] do mình nắm giữ trong cùng một [duchy|E] [de_jure|E] như là [capital|E] của ngài. Nó cũng đem lại phần thưởng cho tất cả các [men_at_arms|E] [stationed|E]. Để sửa đổi này hoạt động, ngài cần đích thân nắm giữ Công quốc được liên kết.\n\nSửa đổi này không cộng dồn với phần thưởng Thủ đô Quốc gia."
  game_concept_liege:0 "Lãnh chúa"
  game_concept_lieges:1 "Lãnh chúa"
  game_concept_liege_possessive:0 "Lãnh chúa"
  game_concept_liege_desc:0 "$game_concept_liege$ là [ruler|E] với ít nhất một [vassal|E]. Lãnh chúa có thể là Chư hầu của những Nhà cai trị có xếp hạng cao hơn, v.v.."
  game_concept_rightful_liege:0 "Lãnh chúa Pháp lý"
  game_concept_rightful_liege_desc:1 "$game_concept_rightful_liege_desc_part1$\n\n$game_concept_rightful_liege_desc_part2$"
  game_concept_rightful_liege_desc_part1:1 "$game_concept_rightful_liege$ của một [vassal|E] là [ruler|E], người nắm giữ [title|E] [de_jure|E] [liege|E] trực tiếp của [primary_title|E] của $game_concept_vassal$. Nếu $game_concept_vassal$ không nằm dưới $game_concept_rightful_liege$ của họ, thì họ sẽ đóng góp ít hơn [taxes|E] và [levies|E] cũng như phải chịu hình phạt [opinion|E] đối với $game_concept_liege$ của họ. Nắm giữ $game_concept_title$ [title_tier|E] cao hơn của cùng $game_concept_de_jure$ dẫn đến các hình phạt được giảm nhẹ.\n\nMột ngoại lệ đây là [dukes|E] một phần của hệ thống phân cấp $game_concept_de_jure$ [empire|E] và là chư hầu trực tiếp của $game_concept_emperor$ của họ, vẫn đóng góp đầy đủ, chính xác như thể $game_concept_emperor$ nắm giữ $game_concept_title$ $game_concept_de_jure$ [kingdom|E] của họ."
  game_concept_rightful_liege_desc_part2:0 "#weak Ví dụ: Bá tước của $c_dunbar$ là chư hầu trực tiếp dưới quyền Quốc vương của $k_england$. Vì Quốc vương không phải là Công tước của $d_lothian$, Quốc vương của $k_scotland$, cũng như không phải Hoàng đế của $e_britannia$, nên Bá tước của $c_dunbar$ chỉ đóng góp một phần nhỏ tiền thuế và chiêu binh của họ.\n\nBá tước của $c_norfolk$ cũng là chư hầu trực tiếp dưới quyền Quốc vương của $k_england$. Quốc vương không nắm giữ Công quốc của $d_norfolk$, vì vậy Bá tước cũng giảm bớt đóng góp các khoản thuế và chiêu binh. Tuy nhiên, vì $k_england$ là Vương quốc De Jure của $c_norfolk$, nên Bá tước của $c_norfolk$ vẫn đóng góp nhiều hơn đáng kể tiền thuế và chiêu binh cho Quốc vương so với Bá tước cửa $c_dunbar$ phải làm.#!"
  game_concept_megaduke_penalty:0 "Mở rộng Quá mức"
  game_concept_megaduke_penalty_desc:1 "Khi ngài có nhiều hơn [GetDefine('NCharacter', 'MAX_COUNTIES_IN_REALM_AS_DUKE')] [counties|E] trong [realm|E] của mình với vị thế là một [duke|E], ngài chịu Hình phạt $game_concept_megaduke_penalty$, làm giảm thu nhập [tax|E] của ngài.\n\nTiến tới trở thành [rank|E] [king|E] hoặc [emperor|E] sẽ xóa hình phạt này."
  game_concept_top_liege:0 "Lãnh chúa Tối cao"
  game_concept_top_lieges:  "Lãnh chúa Tối cao"
  game_concept_top_liege_possessive:  "Lãnh chúa Tối cao"
  game_concept_top_liege_desc:0 "'$game_concept_top_liege$' là [liege|E] đứng đầu hệ thống phân cấp [vassal|E].\n\nHọ là các [rulers|E] [independent|E] hoàn toàn và không cần phải chịu trách nhiệm trước bất kỳ ai."
  game_concept_top_realm:0 "Quốc gia Tối cao"
  game_concept_top_realm_desc:0 "'$game_concept_top_realm$' là [realm|E] của [top_liege|E]."
  game_concept_domain:0 "Lãnh địa"
  game_concept_domains:0 "Lãnh địa"
  game_concept_domain_i:  "@domain_icon!"
  game_concept_domain_desc:0 "$game_concept_domain$ [ruler|E] là tập hợp tất cả [holdings|E] mà cá nhân họ sở hữu.\n\n[domain_limit|E] khá tĩnh có nghĩa là những Nhà cai trị phải dựa vào [vassals|E] để tăng quy mô [realm|E] của họ khỏi bị vượt quá một số điểm nhất định."
  game_concept_regiment:0 "Trung đoàn"
  game_concept_regiments:0 "Trung đoàn"
  game_concept_regiment_desc:1 "$game_concept_regiment$ là một nhóm các [soldiers|E] thuộc một loại duy nhất (ví dụ: cung thủ, bộ binh hoặc [levies|E]). Mặc dù $game_concept_levies$ được tổ chức thành các $game_concept_regiments$, nhưng điều thực sự đáng chú ý là [men_at_arms|E]."
  game_concept_realm:0 "Quốc gia"
  game_concept_realms:0 "Quốc gia"
  game_concept_realm_possessive:  "Quốc gia"
  game_concept_realm_desc:0 "$game_concept_realm$ là tất cả vùng đất mà [ruler|E] kiểm soát trực tiếp hoặc thông qua các [vassals|E] (trái ngược với [domain|E], chỉ là [holdings|E] thuộc sở hữu cá nhân của Nhà cai trị)."
  game_concept_gold:0 "Vàng"
  game_concept_gold_desc:0 "'Vàng' thực sự đại diện cho tất cả tài sản lưu động của một Nhân vật; sự giàu có của họ. Nó có thể được chi cho nhiều thứ, đặc biệt nhất là xây dựng [buildings|E], trả tiền cho [regiments|E], và tạo ra [titles|E]."
  game_concept_gold_i:0 "@gold_icon!"
  game_concept_income:0 "Thu nhập"
  game_concept_income_desc:0 "Có nhiều nguồn [gold|E], nhưng hai nguồn quan trọng nhất là [taxation|E] từ [holdings|E] của riêng ngài và của [vassals|E]."
  game_concept_trait:0 "Đặc điểm"
  game_concept_traits:0 "Đặc điểm"
  game_concept_trait_desc:0 "$game_concept_traits$ của Nhân vật mô tả tính cách cá nhân, kỳ quặc, hành động và trạng thái của họ.\n\nĐặc điểm có thể có nhiều tác động, nhưng nhiều đặc điểm ảnh hưởng đến các [skills|E] của Nhân vật.\n\nĐặc điểm tính cách cũng ảnh hưởng rất nhiều đến cách cư xử của nhân vật. Hành động chống lại Tính cách của chính ngài gây ra [stress|E].\n\nMột số đặc điểm là [congenital|E] và có thể được di truyền cho con cháu."
  game_concept_spouse:0 "Phối ngẫu"
  game_concept_spouses:0 "Phối ngẫu"
  game_concept_spouse_possessive:  "Phối ngẫu"
  game_concept_spouse_desc:1 "$game_concept_spouse$ là chồng hoặc vợ của một Nhân vật; là kết quả của cuộc [marriage|E].\n\nĐể có con cái hợp pháp và sinh ra [heirs|E], ngài nên có Phối ngẫu hoặc [concubine|E] (mặc dù [bastards|E] có thể được hợp pháp hóa).\n\nCách duy nhất để tạo dựng một [alliance|E] là thông qua hôn nhân hoặc [betrothal|E]; của ngài hoặc của một người thân.\n\nPhối ngẫu (chính) của ngài cũng là thành viên trong [council|E] của ngài và có thể thực hiện nhiều [councillor_tasks|E].\n\n[doctrines|E] [faith|E] xác định xem có bao nhiêu $game_concept_spouses$ mà ngài có thể có và làm thế nào họ có thể [divorced|E]."
  game_concept_primary_spouse:0 "Phối ngẫu Chính"
  game_concept_primary_spouse_desc:0 "Trong [faiths|E] [GetFaithDoctrine('doctrine_polygamy').GetBaseName], các [rulers|E] phải chọn một trong số các [spouses|E] của họ làm $game_concept_primary_spouse$. $game_concept_primary_spouse$ của nhà cai trị gia tăng [fertility|E] với họ, gia tăng [opinion|E] về họ, và có thể phục vụ trong [council|E] của họ."
  game_concept_available_spouse:0 "Phối ngẫu Khả dụng"
  game_concept_available_spouse_desc:1 "Để phục vụ trong [council|E] của nhà cai trị, một [spouse|E] phải sẵn sàng thực hiện các trách nhiệm của vai trò đó.\n\nNhiều trường hợp khác nhau có thể ngăn $game_concept_spouse$ thực hiện các trách nhiệm này, nhưng một số trường hợp phổ biến nhất bao gồm:\n$BULLET_WITH_TAB$Trở thành [ruler|E] của [realm|E] mà họ sở hữu\n$BULLET_WITH_TAB$Cư trú tại một [court|E] của Nhà cai trị khác\n$BULLET_WITH_TAB$Bị [imprisoned|E], ở trong nước hoặc ngoại bang\n$BULLET_WITH_TAB$Có [trait|E] [GetTrait('incapable').GetName( GetNullCharacter )]\n\nNếu một Phối ngẫu không sẵn sàng, họ sẽ tự động tiếp tục thực hiện các nhiệm vụ của mình trong Nội các.\n\nPhối ngẫu là những Người cai trị theo đặc quyền riêng của họ vẫn có thể phục vụ trong Nội các nếu họ là [direct_vassals|E] của ngài, còn nếu không thì sẽ không bao giờ được coi là sẵn sàng."
  game_concept_holding:0 "Địa sản"
  game_concept_holdings:0 "Địa sản"
  game_concept_holding_desc:0 "$game_concept_holding$ là khu định cư trung tâm của [barony|E] hoặc [county_capital|E].\n\nNó cung cấp [taxes|E] và [levies|E] cho [holder|E], tùy thuộc vào [holding_type|E] của nó. Tập hợp Địa sản thuộc sở hữu cá nhân của [ruler|E] được gọi là [domain|E]."
  game_concept_holding_type:0 "Loại Địa sản"
  game_concept_holding_types:0 "Loại Địa sản"
  game_concept_holding_type_desc:2 "Có bốn loại [holdings|E]: [castles|E], [cities|E], [tribes|E], và [temples|E]. Mỗi loại cho phép các loại [buildings|E] khác nhau. [government_form|E] của [ruler|E] xác định loại Địa sản Nhà cai trị có thể sở hữu cá nhân mà không chịu hình phạt. Trong trường hợp Đền thờ, [doctrines|E] của [faith|E] của họ cũng có thể đóng một vai trò nào đó."
  game_concept_castle_holding:0 "Địa sản Lâu đài"
  game_concept_castle:0 "Lâu đài"
  game_concept_castles:0 "Lâu đài"
  game_concept_castle_holdings:0 "Địa sản Lâu đài"
  game_concept_castle_holding_desc:0 "Lâu đài là [holding_type|E] kiên cố nhất và là loại tiêu chuẩn cho [rulers|E] [feudal|E], [clan|E] và [tribal|E], cũng như [holy_orders|E]. Chúng có xu hướng cung cấp nhiều [levies|E] hơn [taxes|E]."
  game_concept_temple_holding:0 "Địa sản Đền thờ"
  game_concept_temple:0 "Đền thờ"
  game_concept_temples:0 "Đền thờ"
  game_concept_temple_holdings:0 "Địa sản Đền thờ"
  game_concept_temple_holding_desc:0 "Đền thờ là một [holding_type|E] có thể được nắm giữ bởi các thành viên [clergy|E] với tư cách là [church_property|E] ([government_form|E] [theocratic|E]). Tuy nhiên, trong [faiths|E] với [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName], bất kỳ ai cũng có thể giữ Đền thờ mà không bị phạt.\n\nĐền thờ cung cấp sự kết hợp khá đồng đều giữa [levies|E] và [taxes|E]."
  game_concept_city_holding:0 "Địa sản Thành phố"
  game_concept_city:0 "Thành phố"
  game_concept_cities:0 "Thành phố"
  game_concept_city_holdings:0 "Địa sản Thành phố"
  game_concept_tribal_holding:0 "Địa sản Bộ lạc"
  game_concept_tribal_holdings:0 "Địa sản Bộ lạc"
  game_concept_tribal_holding_desc:0 "Bộ lạc nghèo về [taxes|E] nhưng giàu về [levies|E], [prestige|E], và nâng cấp [men_at_arms|E]. Họ có tiềm năng nâng cấp hạn chế và dù mạnh ở giai đoạn đầu nhưng sức mạnh sẽ nhanh chóng bị suy giảm càng lâu theo thời gian. Chỉ những nhân vật [tribal|E] mới có thể nắm giữ chúng mà không bị phạt.\n\nNếu một Bộ lạc tồn tại trong [county|E], thì không thể xây dựng [holdings|E] nào khác. Những nhà cai trị [feudal|E] sẽ sử dụng [gold|E] để biến các Bộ lạc thành [castles|E]."
  game_concept_tribe:0 "Bộ lạc"
  game_concept_tribes:0 "Bộ lạc"
  game_concept_city_holding_desc:1 "Thành phố là [holding_type|E] giàu có nhất, ưu tiên [taxes|E] hơn [levies|E]. Họ được liên kết với [republics|E], và giữ chúng dưới dạng [government_forms|E] bất kỳ có thể chơi được sẽ luôn bị phạt."
  game_concept_rally_point:0 "Điểm Tập kết"
  game_concept_rally_points:0 "Điểm Tập kết"
  game_concept_rally_point_desc:0 "$game_concept_rally_point$ là nơi tập hợp [levies|E] và [men_at_arms|E] dưới quyền chỉ huy của ngài.\n\nTrong thời gian [war|E], ngài có thể kêu gọi [soldiers|E] của mình tại Điểm Tập kết để tập hợp [army|E].\n\n Các Chiêu binh được chỉ định cho một Điểm Tập kết phải đến từ [domain|E] của riêng ngài hoặc [vassals|E] của ngài. Điểm Tập kết có thể được tổ chức lại, chia tách và hợp nhất nếu ngài thấy phù hợp."
  game_concept_piety:0 "Mộ đạo"
  game_concept_pious:0 "Ngoan đạo"
  game_concept_piety_i:1 "[GetLocalPlayerPietyTextIcon]"
  game_concept_piety_desc:1 "$game_concept_piety$ đại diện cho đức tính của một Nhân vật.\n\nHành động ngoan đạo (theo [doctrines|E] [faith|E] của họ) sẽ làm tăng Ngoan đạo của một Nhân vật, chẳng hạn như tham gia [GetActivityType('activity_pilgrimage').GetName].\n\nNgoan đạo có thể được sử dụng cho nhiều vấn đề tôn giáo khác nhau tùy thuộc vào [government_form|E], Giáo lý, vv.\n\nMỗi khi một Nhân vật nhận được $game_concept_piety$, họ cũng dần tiến tới [piety_level|E] tiếp theo."
  game_concept_piety_experience:0 "Hiến dâng"
  game_concept_piety_experience_desc:0 "Mỗi điểm Hiến dâng mà một nhân vật nhận được sẽ làm tăng tiến trình của họ đối với [piety_level|E] tiếp theo. Khi một nhân vật nhận được [piety|E] họ cũng nhận được một số điểm Hiến dâng tương đương."
  game_concept_maximum_piety_level:  "Cấp độ Hiến dâng Tối đa"
  game_concept_maximum_piety_level_desc:  "$game_concept_maximum_piety_level$ đại diện cho [piety_level|E] cao nhất mà một [ruler|E] có thể đạt được trong suốt cuộc đời của họ. Theo mặc định, cấp độ này là [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L].[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'maximum_piety_level_mandala')]"
  maximum_piety_level_mandala:  "\n\nTuy nhiên, khi một [ruler|E] [mandala|E] chết theo cách có thể chấp nhận được đối với [aspect|E] của họ, sau khi đạt tới [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], thì [heir|E] của Nhà cai trị đó sẽ phát triển khả năng tiến tới Cấp độ Hiến dâng [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
  game_concept_piety_level:  "Cấp độ Hiến dâng"
  game_concept_piety_levels:  "Cấp độ Hiến dâng"
  additional_mandala_government_piety_levels:  "[government|E] [mandala|E] có thể mở khóa các Cấp độ Hiến dâng bổ sung sau [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] lên tới, và bao gồm, [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]. Để đạt được cấp độ thần thánh đó, Hiến dâng của họ cần phải được chứng minh qua nhiều thế hệ."
  game_concept_piety_level_desc:  "$game_concept_piety_level$ của một Nhân vật là thước đo mức độ đạo đức và sùng đạo của họ, cũng như vị thế của họ với các thành viên khác trong [faith|E].\n\nMỗi khi Nhân vật nhận được [piety|E], họ cũng tiến tới Cấp độ Hiến dâng tiếp theo.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nCấp độ là:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
  game_concept_additional_piety_level_desc:  "\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]"
  game_concept_prestige:0 "Uy tín"
  game_concept_prestigious:0 "Uy tín"
  game_concept_prestige_i:0 "@prestige_icon!"
  game_concept_prestige_desc:0 "$game_concept_prestige$ đại diện cho danh tiếng và địa vị xã hội của một Nhân vật.\n\nUy tín có thể được sử dụng cho nhiều vấn đề thế tục khác nhau tùy thuộc vào [government_form|E], [doctrines|E], vv.\n\nMỗi lần Nhân vật nhận được Uy tín, họ cũng dần tiến tới [prestige_level|E] tiếp theo."
  game_concept_prestige_experience_i:  "$game_concept_prestige_i$"
  game_concept_prestige_experience:0 "Danh vọng"
  game_concept_prestige_experience_desc:0 "Mỗi điểm Danh vọng mà một nhân vật nhận được sẽ làm tăng sự tiến bộ của họ đối với [prestige_level|E] tiếp theo. Khi một nhân vật nhận được [prestige|E] họ cũng nhận được một lượng Danh vọng tương đương."
  game_concept_prestige_level:0 "Cấp độ Danh vọng"
  game_concept_prestige_levels:0 "Cấp độ Danh vọng"
  game_concept_prestige_level_desc:2 "$game_concept_prestige_level$ của Nhân vật đo lường danh tiếng chung của họ và mức độ nhận biết của mọi người đối với họ.\n\nMỗi lần Nhân vật nhận được [prestige|E], họ cũng tiến tới $game_concept_prestige_level$ tiếp theo.\n\nCấp độ là:\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_5' ).GetNameWithTooltip|L]"
  game_concept_dynast:1 "Lãnh đạo Triều đại"
  game_concept_dynast_desc:  "$game_concept_dynast$ là [house_head|E] đứng đầu toàn bộ [dynasty|E] và tất cả các [houses|E] của nó.\n\nLãnh đạo Triều đại nắm giữ một số quyền lực độc nhất đối với các thành viên của Triều đại, được gọi là [dynast_interactions|E]. $game_concept_dynast$ cũng chọn các [dynasty_perks|E] cho $game_concept_dynasty$.\n\nThông thường, $game_concept_dynast$ là $game_concept_house_head$ có thể có nhiều [soldiers|E] nhất. Nếu tất cả các $game_concept_house_heads$ đều có [government|E] [administrative|E], thì $game_concept_dynast$ là người có [powerful_family_rating|E] cao nhất."
  game_concept_dynasty:0 "Triều đại"
  game_concept_dynasties:0 "Triều đại"
  game_concept_dynastic:0 "Triều đại"
  game_concept_dynasty_members:0 "Thành viên Triều đại"
  game_concept_dynasty_desc:1 "$game_concept_dynasty$ là một nhóm con cháu [noble|E] [landed|E] tổ tiên; người sáng lập ra Triều đại. [house|E] ban đầu có thể tách thành những gia tộc mới ([cadet_branches|E]), tất cả vẫn là thành viên của Triều đại rộng lớn hơn.\n\nKhi Nhân vật của ngài chết, ngài phải có [player_heir|E], nếu không trò chơi sẽ kết thúc (mặc dù ngài có thể chọn một người cai trị khác và tiếp tục chơi trong cùng một thế giới).\n\nCũng giống như [prestige|E] cho nhân vật, các triều đại cũng có [dynasty_prestige|E]."
  game_concept_dynast_interaction:0 "Tương tác Lãnh đạo Triều đại"
  game_concept_dynast_interactions:0 "Tương tác Lãnh đạo Triều đại"
  game_concept_dynast_interaction_desc:0 "Các tương tác chỉ dành cho [dynast|E] của [dynasty|E], chống lại các thành viên khác của triều đại đó.\n\nHọ phải trả [dynasty_prestige|E] để sử dụng."
  game_concept_dynasty_prestige:0 "Danh tiếng"
  game_concept_dynasty_prestige_i:0 "@dynasty_prestige_icon!"
  game_concept_renown:  "$game_concept_dynasty_prestige$"
  game_concept_dynasty_prestige_desc:0 "$game_concept_dynasty_prestige$ giống như [prestige|E], nhưng được chia sẻ bởi cả [dynasty|E].\n\nMột triều đại thu được $game_concept_dynasty_prestige$ cho mục sau:\n$BULLET_WITH_TAB$ Số thành viên hiện đang sống\n$BULLET_WITH_TAB$ Số lượng [rulers|E]\n$BULLET_WITH_TAB$ Số lượng [spouses|E] với các Nhà cai trị khác\nLưu ý rằng một Nhà cai trị sẽ không tạo $game_concept_dynasty_prestige$ nếu họ có bất kỳ [liege|E] nào cùng Triều đại.\n\nCũng như với Uy tín, $game_concept_dynasty_prestige$ cũng được tính vào việc gia tăng [dynasty_prestige_level|E] của ngài.\n\n$game_concept_dynasty_prestige$ có thể sử dụng bởi [dynast|E] để mở khóa [dynasty_perks|E] và ảnh hưởng đến các thành viên của Triều đại theo nhiều cách khác nhau.\n\n#weak Một Triều đại mở rộng ra nhiều [realms|E] khác nhau sẽ tạo ra nhiều $game_concept_dynasty_prestige$ hơn một Triều đại tập trung trong một Quốc gia.#!"
  game_concept_dynasty_prestige_level:0 "Cấp độ Uy danh"
  game_concept_dynasty_prestige_level_desc:1 "$game_concept_dynasty_prestige_level$ là thước đo mức độ nổi tiếng của [dynasty|E]. Cấp độ được thực hiện bất cứ khi nào Triều đại của ngài nhận được [dynasty_prestige|E]. Nhân vật nhận được một lượng [prestige|E] ban đầu khi họ sinh ra tùy thuộc $game_concept_dynasty_prestige_level$ của họ. Tương tự, [spouses|E] được một số Uy tín từ Triều đại của nhau khi họ [marry|E].\n\nCấp độ là:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
  game_concept_house:0 "Gia tộc"
  game_concept_houses:0 "Gia tộc"
  game_concept_house_possessive:  "Gia tộc"
  game_concept_house_desc:1 "$game_concept_house$ là một nhánh của các thành viên trên cây [dynasty|E] lớn hơn. Gia tộc được tạo ra bởi [rulers|E] người không còn muốn chịu trách nhiệm cho [house_head|E] hiện tại của họ và muốn trở thành Người đứng đầu một Gia tộc mới.\n\nMặc dù các Gia tộc có tên và Quốc huy riêng, chúng vẫn có chung [dynasty_prestige|E], và các thành viên khác trong Triều đại vẫn có thể là [player_heir|E] của ngài."
  game_concept_house_head:0 "Lãnh đạo Gia tộc"
  game_concept_house_heads:0 "Lãnh đạo Gia tộc"
  game_concept_house_heads_possessive:  "Lãnh đạo Gia tộc"
  game_concept_house_head_head:0 "Lãnh đạo"
  game_concept_house_head_heads:  "Lãnh đạo"
  game_concept_house_head_desc: "Mỗi [house|E] trong một [dynasty|E] đều có một $game_concept_house_head$, người nắm giữ một số quyền lực độc nhất đối với các thành viên của Gia tộc.\n\nĐáng chú ý, $game_concept_house_head$ có thể hợp pháp hóa những đứa trẻ [bastards|E], kêu gọi các thành viên trong Gia tộc tham gia [war|E] và yêu cầu cải đạo các thành viên có [landed|E]. $game_concept_house_head$ cũng nhận được một [weak_hook|E] đối với tất cả thành viên trong Gia tộc của họ được sinh ra khi họ đang nắm quyền.\n\nKhi họ chết, [primary_heir|E] của họ trở thành $game_concept_house_head$ mới.\n\n[clan_house_heads|E] có các quy tắc và đặc quyền riêng."
  game_concept_clan_house_head:  "Lãnh đạo Thị tộc"
  game_concept_clan_house_heads:  "Lãnh đạo Thị tộc"
  game_concept_clan_house_head_head:  "$game_concept_house_head_head$"
  game_concept_clan_house_head_desc:  "$game_concept_clan_house_head$ về nhiều mặt giống như một [house_head|E] bình thường, nhưng khác biệt ở một số điểm đáng lưu ý.\n\n$game_concept_clan_house_heads$ không nhận được [weak_hook|E] đối với tất cả các thành viên trong [house|E] của mình. Họ có nhiều ảnh hưởng đối với [house_unity|E] hơn các thành viên khác trong nhóm. Ngoài ra, bất kỳ thành viên nào trong nhóm đều có thể thách thức $game_concept_clan_house_head$ để giành ưu thế để trở thành chính $game_concept_house_head$."
  game_concept_denounce:0 "Tố cáo"
  game_concept_denouncement:0 "Tố cáo"
  game_concept_denounce_desc:1 "[dynast|E] có thể tố cáo một thành viên trong [dynasty|E] của họ vì cái giá phải trả là [dynasty_prestige|E].\n\nBất kỳ thành viên nào trong cùng triều đại (bao gồm cả chính Lãnh đạo Triều đại) sẽ nhận được [imprisonment_reason|E] chống lại thành viên bị tố cáo."
  game_concept_hook:0 "Kiềm chế"
  game_concept_hooks:0 "Kiềm chế"
  game_concept_hooked:0 "Kiềm chế"
  game_concept_hook_i:0 "@cs_weak_hook_icon!"
  game_concept_hook_desc:1 "$game_concept_hook$ là một thuật ngữ chung cho mối quan hệ giữa các nhân vật, trong đó một người có thể khiến người kia làm theo ý mình.\n\nCó hai loại, [weak_hooks|E] và [strong_hooks|E], có được theo những cách khác nhau.\n\n$game_concept_hooks$ có thể được sử dụng để thúc đẩy nhiều tương tác, ví dụ như đề xuất [marriage|E] và thay đổi [vassal_contract|E]."
  game_concept_weak_hook:0 "Kiềm chế Yếu"
  game_concept_weak_hooks:0 "Kiềm chế Yếu"
  game_concept_weak_hook_desc:1 "$game_concept_weak_hook$ là một [hook|E] khá phổ biến mà ngài có thể có đối với một nhân vật nợ ngài một ân huệ hoặc ngài đã thao túng để làm theo ý mình.\n\nMặc dù có nhiều tương tác mà $game_concept_weak_hook$ có thể được sử dụng, chẳng hạn như trong các đề xuất [marriage|E], chúng không thể được sử dụng để buộc ai đó trở thành [agent|E] trong âm mưu [GetScheme('murder').GetTypeName] và không mang lại lợi ích thụ động #weak (vì vậy, [strong_hook|E] là cần thiết.)#!\n\nMọi đứa trẻ sinh ra từ [house|E] [noble|E] cũng nợ [house_head|E] một $game_concept_weak_hook$ ban đầu.\n\nMột khi $game_concept_weak_hook$ được sử dụng, nó cũng #emphasis được dùng luôn.#!"
  game_concept_perpetual_hook:  "Kiềm chế Suốt đời"
  game_concept_perpetual_hooks:  "Kiềm chế Suốt đời"
  game_concept_perpetual_hook_desc:  "$game_concept_perpetual_hook$ là một [hook|E] mà ngài có thể áp dụng với một nhân vật mắc nợ ngài hoặc ngài đã thao túng để làm theo ý mình.\n\nChúng không thể được sử dụng để buộc ai đó trở thành [agent|E] của ngài trong một âm mưu [GetScheme('murder').GetTypeName] và không mang lại lợi ích thụ động #weak (thay vì điều đó, thì một [strong_hook|E] là cần thiết rồi.)#!\n\n$game_concept_perpetual_hooks$ không thể dùng được khi đã sử dụng, mà thay vào đó chúng sẽ có thời gian hồi phục trước khi có thể sử dụng lại.#!"

  game_concept_strong_hook:0 "Kiềm chế Mạnh"
  game_concept_strong_hooks:0 "Kiềm chế Mạnh"
  game_concept_strong_hook_i:  "@unspent_strong_hook_icon!"
  game_concept_strong_hook_desc:2 "$game_concept_strong_hook$ là một [hook|E] rất mạnh mà ngài có thể có trên một nhân vật mà ngài đã [blackmailed|E].\n\n$game_concept_strong_hooks$ mạnh hơn nhiều so với [weak_hooks|E], và có thể buộc ai đó làm những hành động khủng khiếp vì ngài — chẳng hạn như trở thành [agent|E] của ngài trong âm mưu [GetScheme('murder').GetTypeName] #weak (ngoài mọi thứ mà $game_concept_weak_hook$ có thể làm!)#!\n\n$game_concept_strong_hook$ cũng ngăn mục tiêu thực hiện bất kỳ hành động thù địch nào đối với người nắm giữ.\n\n$game_concept_strong_hooks$ không bị mất đi khi sử dụng mà thay vào đó giảm thời gian hồi chiêu trước khi chúng có thể được sử dụng lại. Ảnh hưởng thụ động không bị mất khi Kiềm chế được sử dụng."
  game_concept_favor:0 "Ân huệ"
  game_concept_favors:0 "Ân huệ"
  game_concept_favor_desc:0 "Các nhân vật có thể nợ nhau $game_concept_favors$, được coi là một loại [hook|E].\n\nÂn huệ có thể nhận được bằng nhiều cách, nhưng thường là thông qua các sự kiện kịch bản khác nhau. Mọi đứa trẻ sinh ra trong một [house|E] [noble|E] cũng nợ [house_head|E] một Ân huệ ban đầu."
  game_concept_blackmail:0 "Tống tiền"
  game_concept_blackmailed:0 "Tống tiền"
  game_concept_blackmailing:0 "Tống tiền"
  game_concept_blackmail_desc:1 "Nếu ngài biết [secret|E] [criminal|E] của Nhân vật khác, ngài có thể sử dụng [character_interaction|E] $game_concept_blackmail$ để có khả năng kiếm được [hook|E] vào họ.\n\nĐộ mạnh của Kiềm chế này khác nhau với mức độ nghiêm trọng của Bí mật, đến lượt nó, thường được xác định bởi [doctrines|E]."
  game_concept_manipulation:0 "Thao túng"
  game_concept_manipulation_desc:0 "$game_concept_manipulation$ là một dạng [hook|E] trong đó ngài có thể thao túng điều khiển tâm trí của một nhân vật khác theo một cách nào đó để khiến họ làm theo ý muốn của ngài."
  game_concept_soldier:0 "Binh lính"
  game_concept_soldiers:0 "Binh lính"
  game_concept_soldier_i:0 "@soldier_icon!"
  game_concept_soldiers_desc:0 "$game_concept_soldiers$ là thuật ngữ chung cho quân lính trong một [regiment|E] hoặc một [army|E], bất kể họ là [levies|E], [men_at_arms|E], hay [knights|E].\n\nViệc có nhiều $game_concept_soldiers$ nhất sẽ giúp ích trong việc giành chiến thắng trong các [battles|E] và [sieges|E]."
  game_concept_health:0 "Sức khỏe"
  game_concept_healthy:  "Sức khoẻ"
  game_concept_health_desc:1 "$game_concept_health$ đo lường khả năng một Nhân vật sẽ chết do [illnesses|E] hoặc tuổi già.\n\nCác nhân vật già có khả năng suy giảm sức khỏe hằng năm, càng lớn tuổi thì càng tăng."
  game_concept_child_health:  "Sức khoẻ Trẻ em"
  game_concept_child_health_desc:  "Một số [traits|E] nhất định, chẳng hạn như [GetTrait('measles').GetName( GetNullCharacter )], đặc biệt nguy hiểm đối với [children|E].\n\nBất kỳ hình phạt nào đối với $game_concept_child_health$ đều sẽ cộng dồn với các hình phạt thông thường đối với [health|E], thậm chí từ cùng một Đặc điểm."
  game_concept_adult_health:  "Sức khỏe Người lớn"
  game_concept_adult_health_desc:  "Một số [traits|E] nhất định, chẳng hạn như [GetTrait('ill').GetName( GetNullCharacter )], nguy hiểm hơn đối với [adults|E].\n\nBất kỳ hình phạt nào đối với $game_concept_adult_health$ đều sẽ cộng dồn với các hình phạt thông thường đối với [health|E], thậm chí từ cùng một Đặc điểm."
  game_concept_elderly_health:  "Sức khỏe Người già"
  game_concept_elderly_health_desc:  "Một số [traits|E] nhất định, chẳng hạn như [GetTrait('pneumonic').GetName( GetNullCharacter )], nguy hiểm hơn đối với những người từ [GetDefine( 'NCharacter', 'FEMALE_ELDERLY_AGE' )|V] tuổi trở lên.\n\nBất kỳ hình phạt nào đối với $game_concept_elderly_health$ đều sẽ cộng dồn với các hình phạt thông thường đối với [health|E], thậm chí từ cùng một Đặc điểm."
  game_concept_character_death:0 "Nhân vật Chết"
  game_concept_character_death_death:0 "Cái chết"
  game_concept_character_death_deaths:  "Cái chết"
  game_concept_character_death_dying:0 "Sắp chết"
  game_concept_character_death_die:0 "Chết"
  game_concept_character_death_dies:0 "Chết"
  game_concept_character_death_desc:1 "Cái chết kích hoạt [succession|E], điều này rất quan trọng đối với [rulers|E].\n\nNếu một Nhân vật của Người chơi chết, người chơi sẽ tiếp tục chơi với tư cách [player_heir|E] của họ — hoặc đối mặt với Kết thúc Trò chơi, nếu họ không có người thừa kế hợp lệ."
  game_concept_death_natural_causes:  "Nguyên nhân Tự nhiên"
  game_concept_death_natural_cause:  "Nguyên nhân Tự nhiên"
  game_concept_death_natural_causes_desc:  "Passing on peacefully is the key to dying of $game_concept_death_natural_causes$. For this purpose, old age and chronic diseases are the main ways to leave this world."
  game_concept_death_religion:  "Tôn giáo"
  game_concept_death_religious:  "Tôn giáo"
  game_concept_death_religion_desc:  "Bị những kẻ ngoại đạo tiễn sang thế giới bên kia và bị xử tử một cách phạm thượng bằng cách tử đạo, đóng đinh trên thập tự giá - nhưng vẫn trung thành với đức tin của mình cho đến cùng, còn cách nào chân chính hơn để ra đi chứ."
  game_concept_death_combat:  "Chiến đấu"
  game_concept_death_combat_desc:  "Nhận đòn chí mạng khi tham gia trận chiến, giao đấu tay đôi hoặc các cuộc thi đấu võ thuật khác, chẳng hạn như Giải đấu, là nguyên nhân tử vong hàng đầu theo khái niệm $game_concept_death_combat$."
  game_concept_death_murder:  "Mưu sát"
  game_concept_death_murder_desc:  "Cái chết cuối cùng cũng đến với ngài bằng cách bị sát hại — một cái chết trong sự lừa dối. Cách ngài sống; cách ngài chết."
  game_concept_fertility:0 "Khả năng Sinh sản"
  game_concept_fertility_desc:0 "$game_concept_fertility$ đo lường khả năng một Nhân vật sinh ra con cái."
  game_concept_life_expectancy:0 "Tuổi thọ"
  game_concept_life_expectancy_desc:0 "$game_concept_life_expectancy$ là số năm mà một nhân vật dự kiến sẽ sống trước khi chết vì nguyên nhân tự nhiên.\n\n$game_concept_life_expectancy$ cao sẽ khiến nhân vật già đi trông thấy và có thể sinh [children|E] lâu hơn."
  game_concept_betrothal:0 "Hôn ước"
  game_concept_betrothals:0 "Hôn ước"
  game_concept_betrothed:0 "Hôn ước"
  game_concept_betrothal_desc:1 "[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_betrothal_desc_TOTO_DLC', 'game_concept_betrothal_desc_NO_TOTO_DLC' )]"
  game_concept_betrothal_desc_NO_TOTO_DLC:0 "$game_concept_betrothal$ là lời hứa về một cuộc [marriage|E] trong tương lai, nó có thể được thực hiện khi một trong hai bên chưa phải là [adult|E].\n\nHôn ước có thể mang lại các [alliances|E] giống như Hôn nhân, nhưng có thể dễ dàng bị phá vỡ. Khi trưởng thành, Hôn ước có thể được chuyển đổi thành Hôn nhân chính thức."
  game_concept_betrothal_desc_TOTO_DLC:0 "$game_concept_betrothal$ là lời hứa về một cuộc [marriage|E] trong tương lai. Nó có thể được thực hiện khi một trong hai bên chưa phải là [adult|E], hoặc khi một [GetActivityType( 'activity_wedding' ).GetName] được [grand_wedding_promised|E].\n\nHôn ước có thể mang lại các [alliances|E] giống như Hôn nhân. Hôn ước Thông thường có thể tồn tại miễn là còn cần thiết và có thể dễ dàng bị phá vỡ. Chúng có thể được chuyển đổi thành Hôn nhân chính thức khi trưởng thành, khi Hôn ước cho Lễ cưới Hoành tráng được chuyển đổi thành Hôn nhân bằng cách hoàn thành [GetActivityType( 'activity_wedding' ).GetName]."
  game_concept_marriage:0 "Hôn nhân"
  game_concept_marriages:0 "Hôn nhân"
  game_concept_marry:0 "Kết hôn"
  game_concept_marries:0 "Kết hôn"
  game_concept_married:0 "Kết hôn"
  game_concept_marrying:0 "Kết hôn"
  game_concept_marriage_desc:3 "$game_concept_marriages$ là sự kết hợp giữa hai [spouses|E], và (cùng với [betrothals|E]) là cách chính để tạo nên một [alliance|E] với một [ruler|E] khác.\n\n$game_concept_spouses$ cũng có thể sinh ra những đứa con [legitimate|E], những đứa trẻ có thể được [bred|E] và nuôi dạy như những [heirs|E] phù hợp.\n\n$game_concept_marriages$ chỉ kết thúc khi một $game_concept_spouse$ chết hoặc [divorces|E] người kia.[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_marriage_desc_TOTO_DLC', '' )]"
  game_concept_marriage_desc_TOTO_DLC:0 "\n\nViệc tổ chức [GetActivityType( 'activity_wedding' ).GetName] làm tăng đáng kể khả năng chấp nhận lời Cầu hôn."
  game_concept_concubinage:0 "Trắc thất"
  game_concept_concubine:0 "Trắc thất"
  game_concept_concubines:0 "Trắc thất"
  game_concept_concubine_male:0 "Thứ phu"
  game_concept_concubine_female:0 "Thị thiếp"
  game_concept_concubinage_desc:1 "Trắc thất có địa vị thấp hơn [spouse|E], được cho phép trong [faiths|E] với [doctrine|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName].\n\nKhông giống như [marriage|E], Trắc thất không mang lại [alliances|E]. Trắc thất cũng có thể được đặt sang một bên theo ý muốn, mà không có sự phức tạp của việc [divorce|E]. Những đứa con của Trắc thất bị coi là [legitimate|E].\n\nTrắc thất loại trừ lẫn nhau với [GetFaithDoctrine('doctrine_polygamy').GetBaseName]."
  game_concept_bastard:0 "Con hoang"
  game_concept_bastards:0 "Con hoang"
  game_concept_bastard_desc:1 "$game_concept_bastards$ là những đứa trẻ bất hợp pháp sinh ra ngoài giá thú. Vì lý do đó, chúng bị cấm thừa kế [titles|E]. Tuy nhiên, cha mẹ chúng có thể [Concept( 'legitimized', 'hợp pháp hóa' )|E] con của họ với sự chấp thuận của [house_head|E].\n\nMột đứa trẻ hoang thuộc [house|E] nào được xác định bởi [doctrines|E] của [faiths|E] cha mẹ chúng khi chúng được sinh ra.\n\nNếu Bastard được ban Tước hiệu hoặc có con riêng, chúng sẽ thành lập một [dynasty|E] mới."
  game_concept_legitimized_bastard:0 "Hợp pháp hóa Con hoang"
  game_concept_legitimized:0 "Hợp pháp hóa"
  game_concept_legitimized_bastard_desc:0 "[bastard|E] có thể được Hợp pháp hóa, khi mới sinh, hoặc là [character_interaction|E] sau này, tùy thuộc vào sự chấp thuận từ [house_head|E] của họ.\n\nCon hoang hợp pháp hóa có cùng quyền thừa kế như Những đứa trẻ [legitimate|E], nhưng vết nhơ con hoang sẽ theo chúng suốt cuộc đời."
  game_concept_bastardy:  "Con hoang"
  game_concept_bastardy_desc:  "$game_concept_bastard_desc$"
  game_concept_real_father:0 "Cha Ruột"
  game_concept_real_father_desc:0 "Cha ruột của một nhân vật. Đối với hầu hết các nhân vật, đây là nhân vật được thừa nhận rộng rãi là cha của họ, nhưng đối với những đứa con hoang bí mật, đó là một người khác."
  game_concept_legitimate:0 "Hợp pháp"
  game_concept_legitimate_desc:0 "Những đứa trẻ do bố mẹ [married|E] sinh ra được coi là $game_concept_legitimate$, trái ngược với [bastards|E] người có thể không thừa kế bất kỳ [titles|E] nào. Con cái của [concubines|E] cũng được coi là [legitimate|E], mặc dù trạng thái thấp hơn một chút."
  game_concept_matrilineal:0 "Mẫu hệ"
  game_concept_matrilineally:0 "Mẫu hệ"
  game_concept_matrilineal_desc:0 "Trong [marriage|E] $game_concept_matrilineal$, con cái sẽ được sinh ra trong [house|E] của mẹ chúng thay vì của cha chúng."
  game_concept_patrilineal:0 "Phụ hệ"
  game_concept_patrilineal_desc:0 "Trong [marriage|E] $game_concept_patrilineal$, con cái sẽ được sinh ra trong [house|E] của cha chúng."
  game_concept_divorce:0 "Ly hôn"
  game_concept_divorced:0 "Ly hôn"
  game_concept_divorcing:0 "Ly hôn"
  game_concept_divorces:0 "Ly hôn"
  game_concept_divorce_desc:0 "[spouses|E] [married|E] có thể dàn xếp $game_concept_divorce$, mặc dù các luật lệ, yêu cầu và hậu quả phụ thuộc vào [doctrines|E] [faiths|E] của họ.\n\n[concubines|E] có thể đơn giản đặt sang một bên theo ý muốn."
  game_concept_stress:0 "Căng thẳng"
  game_concept_stress_i:0 "@stress_icon!"
  game_concept_stress_gain_i:0 "@stress_gain_icon!"
  game_concept_stress_loss_i:0 "@stress_loss_icon!"
  game_concept_stress_loss:  "Căng thẳng Mất đi"
  game_concept_stress_critical_i:0 "@stress_critical_icon!"
  game_concept_stress_desc:2 "Nhân vật bị Căng thẳng khi thực hiện các hành động mâu thuẫn với [personality_traits|E].\n\nCác Nhân vật chịu đủ mức Căng thẳng cũng sẽ nhận được [stress_level|E], gây ra nhiều tác động tiêu cực đến sức khỏe tinh thần của họ và kéo dài cho đến khi họ giảm được Căng thẳng.\n\nMột cách đơn giản để giảm bớt Căng thẳng là tham gia các [activities|E] chẳng hạn như [GetActivityType( 'activity_hunt' ).GetName]."
  game_concept_adult:0 "Người lớn"
  game_concept_adults:0 "Người lớn"
  game_concept_adulthood:0 "Trưởng thành"
  game_concept_adult_desc:0 "$game_concept_adult$ là nhân vật ít nhất #V 16#! tuổi."
  game_concept_child:0 "Trẻ con"
  game_concept_children:0 "Trẻ con"
  game_concept_child_possessive:  "Trẻ con"
  game_concept_child_desc:1 "$game_concept_child$ là một nhân vật nhỏ hơn #V 16#!."
  game_concept_eligible_child:0 "Trẻ em đủ điều kiện"
  game_concept_eligible_children:0 "Trẻ em đủ điều kiện"
  game_concept_eligible_child_desc:0 "$game_concept_eligible_children$ theo luật, được phép thừa kế [titles|E] của cha mẹ chúng.\n\n[bastards|E] không được coi là đủ điều kiện, cũng như trẻ em thuộc một số giới tính theo [gender_laws|E] cụ thể."
  game_concept_alliance:0 "Liên minh"
  game_concept_alliances:0 "Liên minh"
  game_concept_allies:0 "Đồng minh"
  game_concept_allied:0 "Đồng minh"
  game_concept_ally:0 "Đồng minh"
  game_concept_ally_i:0 "@alliance_icon!"
  game_concept_alliance_desc:2 "An $game_concept_alliance$ mối quan hệ ngoại giao giữa hai [rulers|E]. Các nhà cai trị [independent|E] có thể kêu gọi $game_concept_allies$ tham gia [wars|E] cùng nhau.\n\nLiên minh được tạo và duy trì thông qua [marriage|E] hoặc [betrothal|E], miễn là hai nhân vật kết hôn đủ liên quan mật thiết đến hai Nhà cai trị. Ví dụ: nếu [king|E] gả con gái của mình cho con trai của Vua khác, thì cả hai Vị vua trở thành $game_concept_allies$.\n\n[lieges|E] cũng có thể tạo lập $game_concept_alliances$ với các [vassals|E] của họ. Lãnh chúa không thể kêu gọi Chư hầu tham chiến, nhưng điều đó ngăn cản họ tham gia [factions|E]."
  game_concept_war:0 "Chiến tranh"
  game_concept_wars:0 "Chiến tranh"
  game_concept_war_desc:0 "Xung đột vũ trang là cách đơn giản nhất để mở rộng [realm|E]của ngài. Tuy nhiên, việc tuyên bố $game_concept_war$ cần có lý do để làm như vậy, được gọi là [casus_belli|E]. Ngài không thể đạt được nhiều hơn với $game_concept_war$ so với mức đã chọn lý do tuyên chiến cho phép.\n\nChiến thắng sẽ giành được khi đánh bại [armies|E] trong [battle|E] và [occupying|E] [holdings|E] kẻ thù. Làm như vậy sẽ tích lũy [war_score|E], cuối cùng buộc kẻ thù chấp nhận [defeat|E] trong [peace_offer|E].\n\nBất kể kết quả của $game_concept_war$, bên tấn công giành được [truce|E] về phía bên phòng thủ trong một thời gian, nhưng bên phòng thủ được tự do tuyên bố một cuộc chiến mới ngay lập tức."
  game_concept_civil_war:0 "Nội Chiến"
  game_concept_civil_wars:0 "Nội chiến"
  game_concept_raid:0 "Đột kích"
  game_concept_raids:0 "Đột kích"
  game_concept_raiding:0 "Đột kích"
  game_concept_raider:0 "Kẻ cướp"
  game_concept_raiders:0 "Kẻ cướp"
  game_concept_raided:0 "Đột kích"
  game_concept_raid_desc:0 "[armies|E] có thể được huy động thành $game_concept_raiders$ từ các [rally_points|E]. $game_concept_raiders$ có thể di chuyển đến các vùng đất lân cận và cướp bóc chúng để thu lấy [gold|E].\n\nĐể ra lệnh $game_concept_raid$, Đội quân Đột kích phải dừng lại trong một [holding|E] thuộc sở hữu của [ruler|E] nước ngoài và chọn bắt đầu Đột kích — khi làm như vậy họ sẽ bị mắc kẹt trong Đột kích một thời gian, sau đó họ sẽ nhận được Vàng và cướp đoạt Địa sản.\n\nVàng sẽ được cất giữ trong Quân đội và chỉ được thêm vào kho bạc khi họ về đến nhà. Nếu ngài đánh bại một Đội quân Đột kích mang theo Vàng, ngài sẽ lấy nó và họ sẽ không thể Đột kích ngài trong một thời gian.\n\nChỉ một số Nhà cai trị mới được phép $game_concept_raid$, đáng chú ý nhất là Nhà cai trị [tribal|E] và [GetGovernment( 'nomad_government' ).GetName].\n\nCó thể thiết lập [raid_intents|E] cụ thể để nhận được các phần thưởng khác nhau."
  game_concept_raid_i:  "@raid_icon!"
  game_concept_loot:  "Chiến lợi phẩm"
  game_concept_loot_desc: "Nếu một [holding|E] bị [Concept( 'raid', 'Đột kích' )|E], [occupied|E] trong một cuộc [siege|E], hoặc tham gia vào [bartering|E], kẻ tấn công hoặc [barterer|E] sẽ nhận được một lượng [gold|E] tương đương với $game_concept_loot$. [holding|E] càng thịnh vượng, càng có nhiều $game_concept_loot$.\n\nMột Lãnh địa vừa bị Đột kích, Vây hãm hoặc Trao đổi gần đây sẽ không có Chiến lợi phẩm nào."
  game_concept_loot_i: "@loot_icon!"

  game_concept_barter:0 "Giao thương"
  game_concept_barter_i:0 "@barter_icon!"
  game_concept_barter_desc:0 "Các [rulers|E] thuộc [GetGovernment( 'wanua_government' ).GetName] có thể triệu tập những [barterers|E] để thu về [gold|E] thông qua các biện pháp hòa bình. Giao thương hoạt động tương tự như [raiding|E] nhưng có một vài khác biệt trọng yếu — đây không phải hành động của một [hostile_army|E], và ngài sẽ cần đến [barter_goods|E].\n\nNgài cần có #V 2#! Hàng hóa Trao đổi để thu về #V 1#! [loot|E] từ một [holding|E]. Nếu số lượng quá ít, việc giao thương sẽ không thể diễn ra.\n\nGiao thương là một hành động thiện chí, và thái ấp mục tiêu sẽ nhận được hiệu ứng [GetModifier('recently_bartered_modifier').GetNameWithTooltip] sau khi hoàn tất. Khác với Cướp bóc, ngài có thể tự do Giao thương trên lãnh thổ của các [tributaries|E] và [suzerain|E] của mình."
  game_concept_bartering:0 "Đang giao thương"
  game_concept_bartered:0 "Đã giao thương"
  game_concept_barterer:0 "Đoàn giao thương"
  game_concept_barterers:0 "Các đoàn giao thương"
  game_concept_barters:0 "Giao thương"
  game_concept_barterer_desc:0 "Các [rulers|E] thuộc [GetGovernment( 'wanua_government' ).GetName] có thể [barter|E] bằng cách triệu tập [armies|E] của họ dưới danh nghĩa là các $game_concept_barterers$. Họ hoạt động tương tự như các [raiders|E], ngoại trừ việc họ sẽ không trở thành [hostile_army|E] đối với [holder|E] của [holding|E] mục tiêu.\n\nTuy nhiên, đoàn quân Cướp bóc của các Thống lĩnh khác vẫn có thể tấn công Đoàn giao thương và chiếm đoạt [loot|E] của họ."
  game_concept_barter_goods:0 "Hàng hóa Giao thương"
  game_concept_barter_goods_desc:0 "Hàng hóa trao đổi — đại diện cho nhiều loại hàng hóa trên đảo như cá khô hoặc các sản phẩm [Glossary('rattan', 'MÂY TRE')] — được sử dụng để [barter|E] và duy trì các [armies|E] bởi các [rulers|E] [GetGovernment( 'wanua_government' ).GetName].\n\n$game_concept_barter_goods$ được sản xuất bởi [GetBuilding('tribe_01').GetName] và các [buildings|E] khác."
  game_concept_barter_goods_i:0 "@barter_goods_icon!"

  game_concept_revolt:0 "Nổi loạn"
  game_concept_revolts:0 "Nổi loạn"
  game_concept_revolting:0 "Nổi loạn"
  game_concept_civil_war_desc:0 "[war|E] trong đó một hoặc nhiều [vassals|E] và/hoặc [counties|E] nổi dậy chống lại [liege|E] của họ. Chúng thường là kết quả của một [faction|E] có yêu cầu chưa được đáp ứng.\n\nViệc thất bại $game_concept_civil_war$ thường gây ra hậu quả nặng nề hơn so với yêu cầu ban đầu của phe nổi dậy."
  game_concept_casus_belli:0 "Biện minh Chiến tranh"
  game_concept_casus_bellis:0 "Biện minh Chiến tranh"
  game_concept_casus_belli_desc:1 "Cần có $game_concept_casus_belli$ ('Nguyên nhân Gây chiến tranh') để tuyên bố [war|E] với một [ruler|E] khác.\n\n$game_concept_casus_belli$ chỉ định nội dung của Chiến tranh, thường là một lãnh thổ cụ thể — [war_target|E]. Không thể kiếm được gì nhiều hơn mức $game_concept_casus_belli$ cho phép, bất kể kẻ thù bị đánh bại như thế nào.\n\nMột trong những Lý do Tuyên chiến quan trọng nhất là [claims|E], cho dù họ đến từ [succession|E] hoặc Nhiệm vụ [fabricate_claim|E]."
  game_concept_war_score:0 "Điểm Chiến tranh"
  game_concept_war_score_desc:1 "Thước đo bên nào đang thắng trong [war|E]. Nó đi từ #N -100#! tới #P 100#!, ví dụ: #N -25#! cho một bên là #P 25#! cho bên còn lại. Tại #P 100#! Điểm Chiến tranh, ngài có thể buộc bên kia chấp nhận [peace_offer|E] của ngài.\n\nĐiểm Chiến tranh có thể nhận được bằng cách:\n$EFFECT_LIST_BULLET$ Đánh bại [armies|E] trong [battle|E]\n$EFFECT_LIST_BULLET$ [imprisoning|E] [ruler|E] kẻ thù hoặc [heirs|E] của họ (không bao gồm [allies|E])\n$EFFECT_LIST_BULLET$ [occupying|E] [holdings|E] kẻ thù (đặc biệt là trong [war_target|E])\n$EFFECT_LIST_BULLET$ Chiếm đóng [realm_capital|E] kẻ thù\n$EFFECT_LIST_BULLET$ Kiểm soát tất cả [objectives|E] trong một khoảng thời gian dài"
  game_concept_war_target:0 "Mục tiêu Chiến tranh"
  game_concept_war_targets:0 "Mục tiêu Chiến tranh"
  game_concept_war_target_desc:0 "Một khu vực trên bản đồ được nhắm mục tiêu bởi [casus_belli|E] trong [war|E]. Nếu lý do tuyên chiến không nhắm mục tiêu đến một khu vực cụ thể, [realm_capital|E] của bên phòng thủ là $game_concept_war_target$.\n\nBên Tấn công nhận được nhiều [war_score|E] hơn bằng cách [occupying|E] [holdings|E] trong $game_concept_war_target$. Ngược lại, bên phòng thủ sẽ — sau thời gian gia hạn ban đầu — bắt đầu tích lũy điểm chiến để giữ tất cả [counties|E] trong vùng $game_concept_war_target$."
  game_concept_occupation:0 "Chiếm đóng"
  game_concept_occupations:0 "Chiếm đóng"
  game_concept_occupy:0 "Chiếm đóng"
  game_concept_occupies: "Chiếm đóng"
  game_concept_occupying:0 "Chiếm đóng"
  game_concept_occupied:0 "Chiếm đóng"
  game_concept_occupation_desc:0 "[holdings|E] bị chiếm đóng tạm thời nằm dưới sự kiểm soát của [ruler|E] thù địch trong [war|E]. Một [army|E] đang đứng trong một [barony|E] có [fortified_holding|E] thù địch sẽ bắt đầu [besiege|E] nó nếu số lượng [soldiers|E] trong đội quân đông hơn [garrison|E].\n\nNếu Cuộc vây hãm thành công, Địa sản sẽ bị Chiếm đóng, điều này sẽ mang [war_score|E] về phe Chiếm đóng trong [war|E].\n\nChiếm đóng Địa sản không có nghĩa là giờ đây nó thuộc về ngài! Chỉ lãnh thổ được chỉ định bởi [war_target|E] mới thực sự có thể đổi chủ và chỉ khi Bên Tấn công [wins|E]."
  game_concept_peace:0 "Hòa bình"
  game_concept_peace_offer:0 "Đề nghị Hòa bình"
  game_concept_peace_offers:0 "Đề nghị Hòa bình"
  game_concept_peace_desc:1 "[wars|E] có thể kết thúc bằng ba loại $game_concept_peace$: [victory|E], [defeat|E], hoặc [white_peace|E].\n\nTại #V 100%#! [war_score|E], bên kia không thể từ chối Đề nghị hòa bình và phải chấp nhận [defeat|E].\n\nẢnh hưởng của $game_concept_victory$ hoặc $game_concept_defeat$ hoàn toàn phụ thuộc vào loại [casus_belli|E] được sử dụng để tuyên chiến và [war_target|E] liên quan."
  game_concept_victory:0 "Chiến thắng"
  game_concept_win:0 "Thắng lợi"
  game_concept_wins:0 "Thắng lợi"
  game_concept_winning:0 "Thắng lợi"
  game_concept_victory_desc:0 "$game_concept_victory$ là một trong ba [peace_offers|E] khả thi. Kết quả chính xác của Chiến thắng trong [war|E] phụ thuộc vào [casus_belli|E].\n\nĐối với Bên Tấn công, nó thường liên quan đến việc chiếm giữ [titles|E] trong khu vực [war_target|E] region.\n\nĐối với Bên Phòng thủ, Chiến thắng thường có nghĩa là kẻ tấn công phải trả một số tiền lớn bằng vàng để bồi thường chiến tranh."
  game_concept_defeat:0 "Thất bại"
  game_concept_defeat_desc:0 "$game_concept_defeat$ là một trong ba [peace_offers|E] khả thi. Kết quả chính xác của Thất bại trong [war|E] phụ thuộc vào [casus_belli|E], nhưng Bên Phòng thủ bị đánh bại thường mất [titles|E] trong khu vực [war_target|E], trong khi Bên Tấn công bị đánh bại thay vào đó mất những thứ như [gold|E], [prestige|E] và [piety|E]."
  game_concept_white_peace:0 "Hòa bình Trắng"
  game_concept_white_peace_desc:0 "$game_concept_white_peace$ là một trong ba [peace_offers|E] khả thi. Đôi khi, cả hai bên sẽ đồng ý rằng [war|E] không còn đáng để theo đuổi.\n\nVới Hòa bình Trắng, Kẻ tấn công thường vẫn mất một số [piety|E] hoặc [prestige|E], nhưng kém xa với một [defeat|E] nhục nhã."
  game_concept_siege:0 "Vây hãm"
  game_concept_sieges:0 "Vây hãm"
  game_concept_besiege:0 "Vây hãm"
  game_concept_besieging:0 "Vây hãm"
  game_concept_besieged:0 "Vây hãm"
  game_concept_siege_desc:0 "Vây hãm là khi [army|E] bao quanh [fortified_holding|E] khiến công dân chết đói để có thể [occupied|E]. Cuộc vây hãm bắt đầu tự động sau khi Quân đội tiến vào vị trí Địa sản Kiên cố và đứng yên — nếu Quân đội đông hơn [garrison|E].\n\nQuân đội bao vây có thể [assault|E] Địa sản nếu bức tường của nó bị phá vỡ."
  game_concept_assault:0 "Tấn công"
  game_concept_assaults:0 "Tấn công"
  game_concept_assaulting:0 "Tấn công"
  game_concept_assaulted:0 "Tấn công"
  game_concept_assault_desc:0 "Tấn công là khi [army|E][besieging|E] cố gắng xông vào [fortified_holding|E] với nguy cơ mất rất nhiều [soldiers|E]. Chỉ có thể tấn công nếu các bức tường của Địa sản đã bị Phá vỡ, điều này yêu cầu Quân đội phải chứa [siege_weapons|E]."
  game_concept_fort_level:0 "Cấp độ Pháo đài"
  game_concept_fort_level_i:0 "@fort_icon!"
  game_concept_fort_level_desc:0 "Một số [holdings|E] được củng cố và cần bị [besieged|E] và [occupied|E] để giành quyền kiểm soát [county|E].\n\n$game_concept_fort_level$ của [fortified_holdings|E] đó xác định thời gian Vây hãm có thể sẽ kéo dài.\n\n$game_concept_fort_level$ cao sẽ yêu cầu [siege_weapons|E] để $game_concept_besieged$ hiệu quả, mặc dù mỗi Vũ khí Vây hãm chỉ có hiệu lực đến một Cấp độ Pháo đài nhất định."
  game_concept_garrison:0 "Lực lượng Đồn trú"
  game_concept_garrison_desc:2 "$game_concept_garrison$ của một [fortified_holding|E] bảo vệ nó khỏi bị [besieged|E] bởi [armies|E] nhỏ hơn.\n\nQuân đội vây hãm cần có nhiều [soldiers|E] hơn Lực lượng Đồn trú để cuộc vây hãm tiến triển.\n\nKhi một cuộc [siege|E] thất bại, $game_concept_garrison$ được đặt thành [GetDefine('NDomain', 'HOLDING_MIN_GARRISON_COUNT')|0]. Từ đó, $game_concept_garrison$ được tái bổ sung hàng tháng tùy thuộc vào [garrison_reinforcement|E] cho đến khi đạt năng lực tối đa.\n\nKhi một cuộc [siege|E] bắt đầu, cách bố trí của $game_concept_garrison$ ảnh hưởng đến số lượng [siege_progress|E] cần thiết."
  game_concept_garrison_reinforcement:0 "Tỷ lệ Tăng viện Lực lượng Đồn trú"
  game_concept_garrison_reinforcement_desc:0 "$game_concept_garrison_reinforcement$ của [fortified_holding|E] xác định tốc độ hồi phục của [garrison|E] sau khi thua cuộc [siege|E].\n\nMỗi tháng, [garrison|E] sẽ lấy lại một phần trăm khả năng tối đa của nó bằng tốc độ hiện tại. Có thể tăng nó bằng cách nâng cấp [holding|E].\n\nTuy nhiên, trong khi bị [siege|E], tăng viện bị đóng băng và tốc độ đặt thành 0."
  game_concept_fortified_holding:0 "Địa sản Kiên cố"
  game_concept_fortified_holdings:0 "Địa sản Kiên cố"
  game_concept_fortified_holding_desc:0 "$game_concept_fortified_holding$ là một [holding|E] với [buildings|E] tăng [fort_level|E] của nó. [county_capitals|E] luôn được củng cố.\n\nĐể hoàn toàn [occupy|E] [county|E], tất cả các Địa sản Kiên cố của nó phải bị Chiếm giữ."
  game_concept_army:0 "Quân đội"
  game_concept_armies:0 "Quân đội"
  game_concept_army_desc:1 "Quân đội được sử dụng để giành chiến thắng [wars|E] bằng cách tham gia [battle|E] với các đội quân khác, và [besiege|E] và [occupy|E] [fortified_holdings|E] kẻ thù. Quân đội được tập hợp tại [rally_points|E] và chủ yếu bao gồm [levies|E] và [men_at_arms|E], nhưng cũng có thể được hỗ trợ bởi [mercenaries|E] và [holy_orders|E].\n\nQuân đội có thể di chuyển trên mặt nước bằng cách chi tiêu một lượng [gold|E] để đảm bảo vận chuyển. Họ có thể bị tổn thất do [attrition|E] nếu [barony|E] địa phương không thể cung cấp đầy đủ [supply|E] cho họ."
  game_concept_holy_order:0 "Hiệp sĩ Đoàn"
  game_concept_holy_orders:0 "Hiệp sĩ Đoàn"
  game_concept_holy_order_i:  "@government_type_holy_order!"
  game_concept_holy_order_desc:1 "$game_concept_holy_orders$ là các tổ chức quân sự độc lập hoạt động để bảo vệ và mở rộng ảnh hưởng của [faith|E] của họ.\n\nCác nhà cai trị của Đức tin của họ có thể thuê họ nếu họ tham gia [war|E] với [faith|E] [faith_hostile|L] hoặc [faith_evil|L], với cái giá phải trả là [piety|E]. Khi Cuộc chiến này kết thúc, họ không còn chiến đấu vì Nhà cai trị đó nữa.\n\n$game_concept_holy_order$ có thể có [holy_order_patron|E], những người không cần thanh toán cho việc thuê các dịch vụ của họ."
  game_concept_holy_order_patron:0 "Người bảo trợ Hiệp sĩ Đoàn"
  game_concept_holy_order_patron_desc:0 "$game_concept_holy_order_patron$ của [holy_order|E] là Vua hoặc Hoàng đế có chung [faith|E] của họ và [realm|E] chứa Thủ đô của họ.\n\n$game_concept_holy_order_patron$ có thể kêu gọi sự hỗ trợ của $game_concept_holy_order$ chống lại kẻ thù tôn giáo miễn phí, thay vì thanh toán [piety|E].\n\nKhông phải tất cả $game_concept_holy_orders$ đều có $game_concept_holy_order_patron$."
  game_concept_mercenary_company:0 "Đại đội Đánh thuê"
  game_concept_mercenaries:0 "Lính đánh thuê"
  game_concept_mercenary:0 "Lính đánh thuê"
  game_concept_mercenary_i:  "@government_type_mercenary!"
  game_concept_mercenary_company_desc:0 "[mercenaries|E] là các [soldiers|E] được thuê để chiến đấu và đổi lấy [gold|E]. [armies|E] Lính đánh thuê có nhiều quy mộ khác nhau, với các loại [men_at_arms|E] khác nhau và một số lượng [knights|E].\n\nLính đánh thuê ký kết hợp đồng #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] tháng#! có thể được gia hạn thêm #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] tháng#! nếu ngài vẫn đang [war|E]. Hợp đồng Đánh thuê vẫn tồn tại ngay cả nếu khi Trung đoàn của họ bị giải thể — họ có thể tập hợp trở lại mà không phải trả thêm chi phí.\n\nNgài được phép [debt|E] để thuê Lính đánh thuê #weak (tối đa [GetDefine('NMercenary', 'ALLOWED_DEBT_MONTHS')] tháng)#!."
  game_concept_mercenary_contract:0 "Hợp đồng Đánh thuê"
  game_concept_mercenary_contracts:  "Hợp đồng Đánh thuê"
  game_concept_mercenary_contract_desc:0 "Việc thành lập Hợp đồng [mercenary|E] phải trả chi phí một lần cho phép sử dụng quân đội của họ trong #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] tháng#!."
  game_concept_hired_troops:0 "Những người lính đã Thuê"
  game_concept_hired_troops_desc:0 "Những người lính đã Thuê là [mercenaries|E] hoặc [holy_orders|E]."
  game_concept_commander:0 "Chỉ huy"
  game_concept_commanders:0 "Chỉ huy"
  game_concept_army_commanders:0 "Chỉ huy Quân đội"
  game_concept_commanding:0 "Chỉ huy"
  game_concept_army_commander:0 "Chỉ huy Quân đội"
  game_concept_army_commander_desc:0 "$game_concept_army_commander$ là một Nhân vật chỉ huy [army|E]. Bất kỳ [courtiers|E] hoặc [vassals|E] trực tiếp nào của ngài đều có thể được chỉ định làm Chỉ huy (tùy theo độ tuổi, [health|E], và [doctrines|E]).\n\nTrong [battle|E], [martial_skill|E] của Chỉ huy ảnh hưởng rất nhiều đến [advantage|E]. Miễn là có sự hiện diện của Chỉ huy, thì [rolls|E] sẽ được thực hiện để cố gắng tăng $game_concept_advantage$.\n\nNgoài ra, [commander_traits|E] có thể cung cấp cho Quân đội nhiều đặc quyền khác nhau, cả trong và ngoài Trận chiến."
  game_concept_commander_trait:0 "Đặc điểm Chỉ huy"
  game_concept_commander_traits:0 "Đặc điểm Chỉ huy"
  game_concept_commander_trait_desc:1 "$game_concept_commander_traits$ là [traits|E] đặc biệt mang lại những đặc quyền hữu ích cho các nhân vật khi hoạt động với tư cách là [army|E] [commanders|E].\n\nĐặc điểm chỉ huy thường được những đứa trẻ lớn lên bằng [education_focus|E] Quân sự có được , nhưng cũng có thể kiếm được thông qua [martial_lifestyle|E] và các phương tiện khác."
  game_concept_battle_advantage:0 "Lợi thế Trận chiến"
  game_concept_advantage:0 "Lợi thế"
  game_concept_battle_advantage_desc:0 "$game_concept_battle_advantage$ khiến một bên trong [battle|E] gây ra nhiều sát thương hơn. $game_concept_advantage$ càng cao, [soldiers|E] càng gây nhiều sát thương.\n\nCác trận chiến thường bắt đầu với một bên có Lợi thế cao hơn dựa trên trên [terrain|E] và [martial_skill|E] và [commander_traits|E] của [commander|E]. Một trong hai bên sau đó có thể giành thêm $game_concept_advantage$ từ [rolls|E] $game_concept_commander$."
  game_concept_education_trait:0 "Đặc điểm Giáo dục"
  game_concept_education_traits:0 "Đặc điểm Giáo dục"
  game_concept_education_trait_desc:2 "Khi đạt tới [adulthood|E], mỗi nhân vật sẽ nhận được $game_concept_education_trait$.\n\nCó năm loại Đặc điểm Giáo dục, mỗi loại tương ứng trực tiếp với một [skill|E] cụ thể.\n\nChất lượng của [trait|E] mà một nhân vật nhận được sẽ phụ thuộc vào việc [childhood_trait|E] của họ phù hợp với [education_focus|E] cũng như Kỹ năng liên quan của [guardian|E] của họ như thế nào.\n\n$game_concept_education_trait$ của Nhân vật cải thiện tốc độ mà họ sẽ tiến bộ trong [lifestyle|E] tương ứng."
  game_concept_education_focus:0 "Trọng tâm Giáo dục"
  game_concept_education:0 "Giáo dục"
  game_concept_educations:0 "Giáo dục"
  game_concept_educate:0 "Giáo dục"
  game_concept_educated:0 "Giáo dục"
  game_concept_education_focus_short:0 "Trọng tâm"
  game_concept_education_focus_desc:1 "Tất cả [children|E] trong độ tuổi giữa #V 6#! và #V 9#! đều có thể nhận được $game_concept_education_focus$ hướng tới một trong năm [skills|E].\n\nGiáo dục kết thúc bằng [education_trait|E] khi đạt tới [adulthood|E].\n\nChất lượng $game_concept_education_trait$ mà họ nhận được sẽ phụ thuộc vào mức độ phù hợp của [childhood_trait|E] của họ đối với Trọng tâm Giáo dục cũng như Kỹ năng liên quan của [guardian|E] của họ.\n\nKhi đặt Trọng tâm Giáo dục, ngài cũng có thể chỉ định xem đứa trẻ có nên được nuôi dưỡng trong [faith|E] và/hoặc [culture|E] của [guardian|E]."
  game_concept_childhood_trait:0 "Đặc điểm Tuổi thơ"
  game_concept_childhood_trait_desc:0 "Mỗi đứa trẻ đều có một Đặc điểm thời thơ ấu khi chúng lớn lên, chẳng hạn như [GetTrait('rowdy').GetName( GetNullCharacter )] hoặc [GetTrait('charming').GetName( GetNullCharacter )].\n\nĐặc điểm nhận được là cho biết [education_focus|E] nào phù hợp với chúng nhất."
  game_concept_diplomacy:0 "Ngoại giao"
  game_concept_diplomacy_i:0 "@skill_diplomacy_icon!"
  game_concept_diplomacy_skill:0 "Kỹ năng Ngoại giao"
  game_concept_diplomacy_skill_desc:1 "$game_concept_diplomacy$ là [skill|E] đại diện cho khả năng mê hoặc, đàm phán và thuyết phục của một Nhân vật.\n\nNgoại giao ảnh hưởng trực tiếp đến [opinions|E] các nhân vật khác về ngài. Nó cũng được sử dụng để tiếp tục các [schemes|E] Ngoại giao.\n\n[lifestyle|E] tương ứng là [diplomacy_lifestyle|E]."
  game_concept_martial:0 "Quân sự"
  game_concept_martial_i:0 "@skill_martial_icon!"
  game_concept_martial_skill:0 "Kỹ năng Quân sự"
  game_concept_martial_skill_desc:2 "[skill|E] $game_concept_martial$ cho biết một Nhân vật tiến hành [war|E] giỏi như thế nào và lãnh đạo [armies|E] trong [battle|E].\n\nKỹ năng Quân sự cao rất quan trọng đối với [army_commanders|E], vì nó cải thiện [advantage|E] của họ trong [battle|E].\n\n[lifestyle|E] tương ứng là [martial_lifestyle|E]."
  game_concept_stewardship:0 "Quản lý"
  game_concept_stewardship_i:0 "@skill_stewardship_icon!"
  game_concept_stewardship_skill:0 "Kỹ năng Quản lý"
  game_concept_stewardship_skill_desc:1 "$game_concept_stewardship$ là một [skill|E] giúp các [rulers|E] quản lý các [domains|E] của họ. Nó làm tăng trực tiếp [taxation|E], khiến nó trở thành một Kỹ năng rất hữu ích cho mọi nhà cai trị.\n\n[lifestyle|E] tương ứng là [stewardship_lifestyle|E]."
  game_concept_intrigue:0 "Mưu lược"
  game_concept_intrigue_i:0 "@skill_intrigue_icon!"
  game_concept_intrigue_skill:0 "Kỹ năng Mưu lược"
  game_concept_intrigue_skill_desc:1 "$game_concept_intrigue$ là [skill|E] đại diện cho khả năng của một Nhân vật trong việc hiểu và điều khiển các nhân vật khác, đồng thời tổ chức các âm mưu phức tạp.\n\nNó chủ yếu được sử dụng để tiếp tục — và chống lại — [schemes|E] Mưu lược.\n\n[lifestyle|E] tương ứng là [intrigue_lifestyle|E]."
  game_concept_learning:0 "Học thức"
  game_concept_learning_i:0 "@skill_learning_icon!"
  game_concept_learning_skill:0 "Kỹ năng Học thức"
  game_concept_learning_skill_desc:1 "$game_concept_learning$ là [skill|E] đo lường khả năng đọc viết và trí tuệ của một Nhân vật. Kỹ năng Học thức của [ruler|E] ảnh hưởng đến chi phí tăng [crown_authority|E], đồng thời mang lại một lượng [piety|E] hằng tháng.\n\nNhân vật có trình độ học thức cao có thể mong muốn có kiến thức sâu rộng về tất cả các nỗ lực học thuật thông thường, bao gồm thần học, triết học, ngôn ngữ và toán học.\n\n[lifestyle|E] tương ứng là [learning_lifestyle|E]."
  PROWESS_MUSCLE_INFO:1 "Tăng võ dũng thông qua các nguồn tự nhiên #weak (không phải thông qua [artifacts|E])#! sẽ tăng khối lượng cơ bắp của Nhân vật."
  PROWESS_MUSCLE_INFO_PERSONAL:0 "Tăng [prowess|E] sẽ tăng khối lượng cơ bắp của ngài"
  game_concept_prowess:0 "Võ dũng"
  game_concept_prowess_i:0 "@skill_prowess_icon!"
  game_concept_prowess_skill:0 "Kỹ năng Võ dũng"
  game_concept_prowess_skill_desc:3 "$game_concept_prowess$ là một [skill|E] phản ánh năng khiếu của Nhân vật trong chiến đấu cá nhân.\n\nKỹ năng Võ dũng cao có nghĩa là họ có nhiều khả năng sống sót hơn và hoạt động tốt với tư cách là các [knights|E] trong [battles|E] và trong [single_combat_duel_plural|E].\n\nMỗi điểm Võ dũng mang lại cho một Hiệp sĩ:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
  game_concept_natural_prowess:0 "Võ dũng Bẩm sinh"
  game_concept_lifestyle:0 "Lối sống"
  game_concept_lifestyles:0 "Lối sống"
  game_concept_lifestyle_desc:2 "Các [rulers|E] [adult|E] có thể chọn một $game_concept_lifestyle$, điều này sẽ cho phép họ chọn một [focus|E] và bắt đầu nhận được các [perks|E].\n\nMỗi $game_concept_lifestyle$ đều có có loại [experience|E] riêng, được sử dụng để mua $game_concept_perks$. Ví dụ, Kinh nghiệm trong [intrigue_lifestyle|E] là điều cần thiết để nhận được các $game_concept_perks$ chẳng hạn như [GetPerk( 'dreadful_perk' ).GetName( GetNullCharacter )] hoặc [GetPerk( 'like_weed_in_a_garden_perk' ).GetName( GetNullCharacter )].\n\nCác$game_concept_lifestyles$ gồm:\n$BULLET_WITH_TAB$ [diplomacy_lifestyle|E]\n$BULLET_WITH_TAB$ [stewardship_lifestyle|E]\n$BULLET_WITH_TAB$ [martial_lifestyle|E]\n$BULLET_WITH_TAB$ [intrigue_lifestyle|E]\n$BULLET_WITH_TAB$ [learning_lifestyle|E]\n$BULLET_WITH_TAB$ [wanderer_lifestyle|E]"
  game_concept_lifestyle_experience:0 "Kinh nghiệm Lối sống"
  game_concept_experience:0 "Kinh nghiệm"
  game_concept_lifestyle_experience_desc:0 "$game_concept_lifestyle_experience$ được tích lũy một cách thụ động bằng cách chọn [focus|E] hoặc đạt được bởi các sự kiện. Có nhiều loại $game_concept_lifestyle_experience$, mỗi loại một danh mục [lifestyle|E].\n\nNhận được đủ $game_concept_lifestyle_experience$ trong một hạng mục sẽ trao [perk|E]."
  game_concept_focus:0 "Trọng tâm"
  game_concept_focuses:0 "Trọng tâm"
  game_concept_focus_desc:0 "Mỗi [lifestyle|E] chứa một số $game_concept_focuses$, một trong số đó phải được chọn khi chọn $game_concept_lifestyle$.\n\n$game_concept_focuses$ cung cấp phần thưởng thụ động và ảnh hưởng đến các loại sự kiện xuất hiện. #weak (Ví dụ: có $intrigue_temptation_focus$ sẽ tăng [fertility|E] à tăng cơ hội xuất hiện các sự kiện theo chủ đề Quyến rũ.)#!\n\nCác nhân vật có thể chuyển đổi giữa $game_concept_focuses$ trong cùng một $game_concept_lifestyle$ mà không mất khả năng nhận kinh nghiệm trong $game_concept_lifestyle$."
  game_concept_dynasty_perk:0 "Di sản Triều đại"
  game_concept_dynasty_perks:0 "Di sản Triều đại"
  game_concept_dynasty_perk_desc:0 "$game_concept_dynasty_perks$ là những lợi ích có thể mở khóa mang lại ảnh hưởng mạnh mẽ cho tất cả các thành viên của [dynasty|E].\n\n[dynast|E] mở khóa $game_concept_dynasty_perks$ bằng cách sử dụng [dynasty_prestige|E], với mỗi Di sản trong cùng một hàng ngày càng đắt tiền và mạnh mẽ hơn.\n\n$game_concept_dynasty_perks$ kiếm được chậm chạp, nhưng ở lại với Triều đại mãi mãi."
  game_concept_perk:0 "Thiên phú"
  game_concept_perks:0 "Thiên phú"
  game_concept_perk_desc:1 "Thiên phú là những lợi ích có thể mở khóa cung cấp nhiều ảnh hưởng hữu ích và thú vị. Chúng được mở khóa bằng cách chọn [focus|E] trong [lifestyle|E] và sử dụng hình thức liên quan của [experience|E] #weak (ví dụ: Mưu lược $game_concept_experience$ nếu ngài muốn mở khóa $game_concept_perk$ $game_concept_intrigue_lifestyle$.)#!"
  game_concept_decision:0 "Quyết nghị"
  game_concept_decisions:0 "Quyết nghị"
  game_concept_decide:0 "Quyết định"
  game_concept_decision_desc:1 "$game_concept_decision$ là một hành động đặc biệt mà [character|E] có thể thực hiện khi rảnh rỗi.\n\nMỗi quyết nghị đều có các ảnh hưởng thiết lập riêng, có thể bao gồm từ những thay đổi nhỏ của nhân vật đến tác động rung chuyển [empire|e].\n\nCác quyết nghị di chuyển một Nhân vật đến một vị trí cụ thể trong một khoảng thời gian được gọi là [activities|E]."
 
  game_concept_activity:0 "Hoạt động"
  game_concept_activities:0 "Hoạt động"
  game_concept_activity_desc:3 "$game_concept_activity$ là một dịp đặc biệt được tổ chức cho một mục đích cụ thể, chẳng hạn như tham gia [GetActivityType( 'activity_hunt' ).GetName] để giải tỏa [stress|E].\n\n[activity_host_short|E] tổ chức Hoạt động ở một [location|E], cụ thể, điều này ảnh hưởng đến nó theo nhiều cách khác nhau và tất cả những người tham dự đều phải [travel|E] tới đó.\n\nMỗi Nhân vật tham dự tương tác với nhau bằng cách đặt [intent|E], mà họ cố gắng theo đuổi trong Hoạt động này.[SelectLocalization( HasDlcFeature( 'advanced_activities' ), 'game_concept_activity_desc_GRAND_ACTIVITY_DLC', '' )]"
  game_concept_activity_desc_GRAND_ACTIVITY_DLC:0 "\n\nMột $game_concept_activity$ thông thường chẳng hạn như [GetActivityType( 'activity_feast' ).GetName] hoặc [GetActivityType( 'activity_hunt' ).GetName] nhỏ hơn và kém ấn tượng hơn các [grand_activities|E]."
  game_concept_activity_option:0 "Tùy chọn Hoạt động"
  game_concept_activity_options:0 "Tùy chọn Hoạt động"
  game_concept_activity_option_desc:0 "Tất cả các [activities|E] đều có Tùy chọn cho phép ngài tùy chỉnh kế hoạch hoạt động của mình. Các tùy chọn có nhiều chi phí và yêu cầu khác nhau."
  game_concept_activity_type:0 "Loại Hoạt động"
  game_concept_activity_types:0 "Loại Hoạt động"
  game_concept_activity_type_desc:0 "Một số [activities|E] và [grand_activities|E] có các loại khác nhau tương ứng với các biến thể đặc biệt của hoạt động.\n\nVí dụ: khi lập kế hoạch Săn bắn, bạn có thể chọn giữa Tiêu chuẩn, Chim ưng và Huyền thoại nếu ngài đáp ứng các yêu cầu đối với loại đó."
  game_concept_activity_phase:1 "Giai đoạn Hoạt động"
  game_concept_activity_phases:1 "Giai đoạn Hoạt động"
  game_concept_activity_phase_desc:2 "Giai đoạn hành động của một hoạt động chẳng hạn như [contest|E] trong một [GetActivityType( 'activity_tournament' ).GetName], [stop|E] một [tour|E], hoặc điểm đến của [pilgrimage|E] trong thời gian các sự kiện xảy ra."
  game_concept_activity_phase_action:0 "Hành động Giai đoạn Hoạt động"
  game_concept_activity_phase_action_desc:0 "Mỗi #V 7#! ngày trong khi tham gia [activity|E] thì có khả năng xảy ra #EMP điều gì đó#! ngoài các sự kiện thông thường. Những sự kiện này được hiển thị ở góc trên bên phải của cửa sổ Hoạt động.\n\nĐiều gì có thể xảy ra tùy thuộc vào [activity_type|E], ví dụ: [activity_host|E] có thể nhận được [prestige|E] hoặc [activity_guest|E] [opinion|E] trong một [GetActivityType('activity_feast').GetName].\n\nLuôn có khả năng không có gì xảy ra, điều này đặc biệt có thể xảy ra trước khi [activity_phase|E] hiện tại là [activity_state_active|E]."
  game_concept_activity_state_passive:0 "Thụ động"
  game_concept_activity_state_passive_desc:1 "Một [activity|E] ở giai đoạn thụ động khi chủ nhà hoặc khách mời đều chưa đến hoặc khi họ đang ở giữa [stop|E] và điểm tiếp theo trong chuyến [tour|E]."
  game_concept_activity_state_active:0 "Chủ động"
  game_concept_activity_state_active_desc:1 "Khi chủ nhà và khách mời đến và tham gia vào một [activity|E] thì hoạt động đó được coi là đang hoạt động."
  game_concept_activity_host:0 "Chủ trì Hoạt động"
  game_concept_activity_host_possessive:  "Chủ trì Hoạt động"
  game_concept_activity_host_short:0 "Chủ nhà"
  game_concept_activity_host_desc:0 "Chủ nhà của [activity|E] là [ruler|E] đã bắt đầu nó.\n\nHọ chọn [activity_type|E], [location|E], [activity_options|E] và [activity_guests_short|E] nào được mời."
  game_concept_activity_guest:0 "Khách mời Hoạt động"
  game_concept_activity_guest_short:0 "Khách mời"
  game_concept_activity_guests:0 "Khách mời Hoạt động"
  game_concept_activity_guests_short:0 "Khách mời"
  game_concept_activity_attending:0 "Tham dự"
  game_concept_activity_guest_desc:0 "Khách mời tại một [activity|E] là bất kỳ [character|E] nào được mời bởi [activity_host|E].\n\nMặc dù họ thường không thể ảnh hưởng đến Hoạt động nhiều như Chủ nhà nhưng họ vẫn có thể theo đuổi [intent|E] của mình."
  game_concept_intent:1 "Ý định"
  game_concept_intents:0 "Ý định"
  game_concept_intent_desc:0 "$game_concept_intent$ đại diện cho điều mà cá nhân nhân vật tìm cách đạt được tại một [activity|E]; chủ nhà và khách mời đều có động cơ và mục đích riêng của họ."

  game_concept_location:0 "Vị trí"
  game_concept_locations:0 "Vị trí"
  game_concept_location_desc:0 "Mọi [character|E] đều có một vị trí cho biết họ hiện đang ở đâu trên thế giới. Để đi từ địa điểm này đến địa điểm khác, ngài phải [travel|E]."

  game_concept_feast:0 "$activity_feast$"
  game_concept_feast_desc:2 "Một [activity|E] nơi những nhà cai trị và cận thần trong quốc gia tụ tập để ăn mừng... vì điều này hay điều khác.\n\nNhững người tham gia sẽ mất đi [stress|E] và gia tăng [opinion|E] của họ về chủ tiệc. Có thể cũng là bất kỳ kết quả nào khác từ việc tập hợp nhiều người đó lại với nhau.\n\nMột [ruler|E] sẽ mời [liege|E] và các [vassals|E] của họ (cùng với nhiều [courtiers|E] khác) tham gia $activity_feast$."
  game_concept_hunt_success_chance:0 "Cơ hội Săn bắn Thành công"
  game_concept_hunt_success_chance_no_prefix:0 "Cơ hội Thành công"
  game_concept_hunt_success_chance_desc:1 "Khi bắt đầu một [GetActivityType('activity_hunt').GetName] không có gì đảm bảo ngài sẽ tóm được con mồi của mình. Các yếu tố chính là:\n$BULLET_WITH_TAB$[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_hunt_court_position').GetName()] [aptitude|E]\n$BULLET_WITH_TAB$[buildings|E], [terrain|E], và [development|E]\n$BULLET_WITH_TAB$[hunt_sightings_no_prefix|E] Động vật\n\n$game_concept_hunt_success_chance$ không bao giờ có thể cao hơn #V 80#!.\n\n#weak Chuyến Săn bắn thành công kết thúc bằng việc tóm được con mồi, nơi có thể giành được [artifacts|E] chiến tích và [prestige_i|E][prestige|E] tuyệt vời được trao cho thợ săn.#!"
  game_concept_hunt_danger:0 "Săn bắn Nguy hiểm"
  game_concept_hunt_danger_no_prefix:0 "Nguy hiểm"
  game_concept_hunt_dangerous:0 "Nguy hiểm"
  game_concept_hunt_danger_desc:1 "Tính khó đoán của ngay cả những con thú hoang dã hiền lành, cùng với sự điên cuồng của cuộc rượt đuổi, đã hạ gục nhiều chiến binh dũng mãnh.\n\nThêm nhiều loài động vật $game_concept_hunt_dangerous$ sẽ mang lại [prestige_i|E][prestige|E] lớn hơn cho thợ săn.\n\nSự xa xôi hoang vu và cơ hội dồi dào cũng không nên bỏ qua khi chọn khách mời..."
  game_concept_playdate:0 "$activity_playdate$"
  game_concept_playdate_desc:0 "Một [activity|E] nơi các người cai trị và cận thần dưới độ tuổi [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] tụ tập để vui chơi và quên đi nỗi buồn tẻ trong cả ngày.\n\nNhững người tham gia sẽ mất đi [stress|E] và gia tăng [opinion|E] của họ về chủ tiệc. Cũng có thể có bất kỳ kết quả nào khác từ việc tập hợp nhiều trẻ em đó lại với nhau.\n\nMột [ruler|E] sẽ mời [liege|E] và các [vassals|E] của họ (cùng với nhiều [courtiers|E] khác) tham gia $activity_playdate$."
  game_concept_wedding_ceremony:0 "Hôn lễ"
  game_concept_wedding_ceremony_desc:0 "[activity_phase|E] trong một [GetActivityType('activity_wedding').GetName] trong đó [spouses|E] thề nguyện với nhau và chấp nhận [married|E]."
  game_concept_wedding_banquet:0 "Tiệc cưới"
  game_concept_wedding_banquet_desc:0 "[activity_phase|E] trong một [GetActivityType('activity_wedding').GetName] trong đó đồ ăn và đồ uống được phục vụ, đồng thời khách mời sẽ được giải trí và giao lưu."
  game_concept_wedding_night:0 "Đêm tân hôn"
  game_concept_wedding_night_desc:0 "[activity_phase|E] trong một [GetActivityType('activity_wedding').GetName] trong đó [spouses|E] đã kết thúc đám cưới và khách mời tiếp tục ăn mừng."
  game_concept_grand_wedding_promise:0 "Lời hứa Lễ cưới Hoành tráng"
  game_concept_grand_wedding_promises:0 "Lời hứa Lễ cưới Hoành tráng"
  game_concept_grand_wedding_promised:0 "Hứa hẹn"
  game_concept_grand_wedding_promise_desc:0 "Một [betrothal|E] kèm theo lời hứa rằng [GetActivityType('activity_wedding').GetName] sẽ được tổ chức cho sự kết hợp của hai nhân vật có liên quan.\n\nLời hứa Lễ cưới Hoành tráng sẽ hết hạn sau 3 năm. Việc không tổ chức [GetActivityType('activity_wedding').GetName] kịp thời hạn hoặc phá vỡ Hôn ước sẽ phải chịu hậu quả trừng phạt."
  game_concept_taxes:0 "Thuế"
  game_concept_tax:0 "Thuế"
  game_concept_taxation:0 "Thuế"
  game_concept_taxes_desc:1 "$game_concept_taxes$ là nguồn [income|E] [gold|E] hằng tháng quan trọng nhất của [rulers|E].\n\nMỗi [holding|E] nhà cai trị đều cung cấp cho họ một số [domain_taxes|E] mỗi tháng. Ngoài ra, hầu hết [vassals|E] có [obligation|E] thanh toán một phần Thuế đã thu cho [liege|E] của họ dưới dạng [liege_taxes|E]."
  game_concept_dread:0 "Kinh sợ"
  game_concept_dreadful:0 "Kinh sợ"
  game_concept_dreaded:0 "Kinh sợ"
  game_concept_dread_i:  "@dread_icon!"
  game_concept_dread_desc:4 "$game_concept_dread$ là thước đo mức độ đáng sợ của một [ruler|E].\n\nCác nhà cai trị tăng $game_concept_dread$ bằng cách thực hiện những hành vi tàn ác và ghê tởm như tra tấn và hành hình [prisoners|E].\n\nKinh sợ khiến cho việc chơi như một [tyrant|E] trở lên khả thi, bởi vì các [vassals|E] ngỗ ngược có thể bị [intimidated|E] hoặc [cowed|E], khiến họ quá sợ hãi khi chống lại ngài.\n\nĐộ Kinh sợ của một nhân vật có thể từ 0 đến 100, ngoại trừ [nomads|E], những người có thể đạt tới 150. Theo thời gian, Kinh sợ của họ sẽ có xu hướng về Kinh sợ Tự nhiên, được xác định bởi các [personality_traits|E] của họ.\n\n#high Một [ruler] Kinh sợ sẽ gặt hái được những lợi ích sau:#!\n$BULLET_WITH_TAB$Các [vassals] không được tham gia [factions|E]\n$BULLET_WITH_TAB$Các [vassals] không được tham gia [scheming|E]\n$BULLET_WITH_TAB$Tăng sự chấp nhận của các [vassal] #weak (Ví dụ: Thu hồi Tước vị)#!\n$BULLET_WITH_TAB$Tăng sự chấp nhận [offer_vassalization|E]\n$BULLET_WITH_TAB$Làm cho các [electors|E] có nhiều khả năng bỏ phiếu cho ngài hơn\n$BULLET_WITH_TAB$Khiến chư hầu không phản đối thay đổi [law|E]\n\n#weak Lưu ý rằng các [vassals] dũng cảm và táo bạo ít bị ảnh hưởng bởi Kinh sợ!#!"
  game_concept_truce:0 "Hiệp định Đình chiến"
  game_concept_truces:0 "Hiệp định Đình chiến"
  game_concept_truce_desc:0 "Mọi [war|E] đều kết thúc bằng $game_concept_truce$; khoảng thời gian mà Bên Tấn công có thể không tuyên bố Chiến tranh lần nữa với cùng [ruler|E] đó (Bên Phòng thủ không bị ràng buộc bởi Hiệp định Đình chiến).\n\n Hiệp định Đình chiến có thể bị phá vỡ , nhưng có một hình phạt nghiêm khắc."
  game_concept_government:0 "Chính thể"
  game_concept_governments:0 "Chính thể"
  game_concept_government_form:0 "Chính thể"
  game_concept_government_forms:0 "Chính thể"
  game_concept_government_desc:3 "$game_concept_government_form$ của một [ruler|E] xác định loại [laws|E] nào mà họ có quyền sử dụng, cũng như [obligations|E] mà họ phải làm đối với [liege|E], nếu họ không [independent|E].\n\nCác hình thái Chính thể bao gồm: [feudal|E], [tribal|E], [clan|E], [theocracy|E], [republic|E], [administrative|E], [GetGovernment( 'nomad_government' ).GetName] và [herder|E]."
  game_concept_feudal:0 "Phong kiến"
  game_concept_feudal_government:0 "Chính thể Phong kiến"
  game_concept_feudalism:0 "Chế độ Phong kiến"
  game_concept_feudal_i:  "@government_type_feudal!"
  game_concept_feudal_desc:0 "Dưới sự cai trị của [government_form|E] Phong kiến, một [liege|E] trao tặng cho các [vassals|E] của mình [land|E] quyền cai trị để đổi lấy [levies|E] và [taxes|E], được điều chỉnh bởi [vassal_contract|E] riêng giữa Chư hầu và Lãnh chúa."
  game_concept_tribal:0 "Bộ lạc"
  game_concept_tribal_government:0 "Chính thể Bộ lạc"
  game_concept_tribal_i:  "@government_type_tribal!"
  game_concept_tribal_desc:0 "Các quốc gia bộ lạc có các khu vực [development|E] bị đình trệ, không thể cải tiến [innovations|E] trong Thời đại Bộ Lạc, không thể xây dựng các [holdings|E] mới, và thường không thể thay đổi [succession_law|E].\n\nTuy nhiên, họ có thể sử dụng [prestige|E] hơn là [gold|E] để xây dựng lãnh thổ của họ và thuê [men_at_arms|E], đồng thời có quyền sử dụng [casus_belli|E] nhiều hơn so với Quốc gia [feudal|E]. Các đội quân phi Bộ lạc phải chịu một Hình phạt [supply_limit|E] trong lãnh thổ Bộ lạc thù địch."

  game_concept_clan:0 "Thị tộc"
  game_concept_clans:  "Thị tộc"
  game_concept_clan_government:0 "Chính thể Thị tộc"
  game_concept_clan_i:  "@government_type_clan!"
  game_concept_clan_desc:1 "Thị tộc là một [government_form|E] trong đó số lượng [levies|E] và [taxes|E] mà [liege|E] nhận được từ các [vassals|E] của mình được xác định bởi [aptitude|E] của các [tax_collector|E] của Lãnh chúa đã nói tới. Các thị tộc cũng sử dụng [house_unity|E]."
  game_concept_theocracy:0 "Thần quyền"
  game_concept_theocracies:0 "Thần quyền"
  game_concept_theocratic:0 "Thần quyền"
  game_concept_theocratic_government:0 "Chính thể Thần quyền"
  game_concept_theocracy_government:0 "Chính thể Thần quyền"
  game_concept_theocracy_i:  "@government_type_theocracy!"
  game_concept_theocracy_desc:0 "$game_concept_theocracy$ là [government_form|E] không thể chơi được dành cho một số [faiths|E] tùy thuộc vào [doctrines|E]. Họ thường được dẫn dắt bởi [head_of_faith|E] hoặc [realm_priest|E] [landed|E]. Một Giám mục cũng có thể trở thành một nhà cai trị Thần quyền [independent|E] theo đúng nghĩa của họ."
 
  game_concept_republic:0 "Cộng hòa"
  game_concept_republics:0 "Cộng hòa"
  game_concept_republican:0 "Cộng hòa"
  game_concept_republic_government:0 "Chính thể Cộng hòa"
  game_concept_republic_i:  "@government_type_republic!"
  game_concept_republic_desc:1 "$game_concept_republic_government$ là một [government_form|E] không thể chơi được, nơi một công dân được bầu làm nhà cai trị suốt đời — $game_concept_government_form$ của cư dân đô thị và thương gia.\n\n[vassals|E] $game_concept_republican$ có [obligations|E] cố định không thể được thay đổi, và do đó luôn cung cấp một lượng [levies|E] và [taxes|E]."
  game_concept_skill:0 "Kỹ năng"
  game_concept_skills:0 "Kỹ năng"
  game_concept_skills_desc:0 "Kỹ năng của một nhân vật đo lường mức độ giỏi của họ trong nhiều việc khác nhau.\n\nNăm kỹ năng chính là: [diplomacy|E], [martial|E], [stewardship|E], [intrigue|E], [learning|E]."
  game_concept_building:  "Công trình"
  game_concept_buildings:  "Công trình"
  game_concept_building_desc:  "$game_concept_buildings$ là những cải tiến có thể được xây dựng trong [holdings|E].\n\nNhiều loại Công trình chỉ có thể được xây dựng ở [baronies|E] cụ thể hoặc ở một số [terrain|E] nhất định.\n\nMỗi loại Công trình có số lượng vị trí Công trình giới hạn, do đó, việc địa sản không thể chứa tất cả các loại Công trình. [county_capitals|E] có quyền sử dụng vị trí Công trình bổ sung.\n\n[duchy_buildings|E] và [special_buildings|E] sử dụng vị trí của riêng chúng."
  game_concept_duchy_building:  "Công trình Công quốc"
  game_concept_duchy_buildings:  "Công trình Công quốc"
  game_concept_duchy_building_desc:  "$game_concept_duchy_buildings$ là [buildings|E] quyền thế chỉ có thể được xây dựng trong [de_jure_capital|E] của [duchy|E]. Chỉ có thể xây dựng một loại trong mỗi Công quốc.\n\n$game_concept_duchy_buildings$ chỉ hoạt động nếu chủ sở hữu cũng nắm giữ [title|E] Công quốc được liên kết.\n\nNhiều $game_concept_duchy_buildings$ có công cụ sửa đổi ảnh hưởng đến tất cả [holdings|E] trong Công quốc, khiến chúng trở thành công cụ mạnh mẽ để chuyên môn hóa [domain|E] của ngài."
  game_concept_special_building:  "Công trình Đặc biệt"
  game_concept_special_buildings:  "Công trình Đặc biệt"
  game_concept_special_building_desc:  "$game_concept_special_buildings$ là các [buildings|E] độc đáo hiện diện ở một số địa điểm được xác định trước trên khắp thế giới.\n\nVí dụ bao gồm các kỳ quan cổ đại, đại thánh đường và các hầm mỏ nổi tiếng. Một số đã được xây dựng khi bắt đầu trò chơi, trong khi những nơi khác phải được phát triển.\n\n$game_concept_special_buildings$ thường rất có sức ảnh hưởng và rất đáng để chiến đấu."
  game_concept_great_building:  "Công trình Vĩ đại"
  game_concept_great_buildings:  "Công trình Vĩ đại"
  game_concept_great_building_desc:  "$game_concept_great_buildings$ là những [buildings|E] độc đáo, và được xây dựng dựa trên các [great_projects|E]. Một ví dụ nổi tiếng là Vạn Lý Trường Thành của Trung Hoa.\n\n$game_concept_great_buildings$ thường rất hùng vĩ, nhưng tính hữu dụng của chúng lại phụ thuộc vào những điều kiện cụ thể."

  game_concept_ruined_building:  "Công trình Đổ nát"
  game_concept_ruined:  "Hủy hoại"
  game_concept_ruined_building_desc: "Một công trình bị $game_concept_ruined$ đã bị đập phá, làm hư hại hoặc bị cướp bóc để lấy vật liệu bởi các thế lực bên ngoài.\n\nNhững thế lực bên ngoài này có thể là:\n$BULLET_WITH_TAB$[natural_disasters|E][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ruined_buildings_tgp' )]"
  game_concept_ruined_buildings_tgp: "\n$BULLET_WITH_TAB$Những nhà cai trị [mandala|E] đầy thù hận"

  game_concept_rebuilt_building: "Công trình được tái thiết"
  game_concept_rebuilt: "Đã tái thiết"
  game_concept_rebuilding: "Đang tái thiết"
  game_concept_rebuilt_building_desc: "Hành động tái thiết một công trình đã bị [ruined|E], khôi phục lại vinh quang trước đây của nó."

  game_concept_economic_building:  "Công trình Kinh tế"
  game_concept_economic_buildings:  "Công trình Kinh tế"
  game_concept_economic_building_desc:  "$game_concept_economic_buildings$ là [buildings|E] có chức năng chính là tăng [domain_income|E] địa sản của họ."
  game_concept_military_building:  "Công trình Quân sự"
  game_concept_military_buildings:  "Công trình Quân sự"
  game_concept_military_building_desc:  "$game_concept_military_buildings$ là [buildings|E] có chức năng chính là tăng số lượng [levies|E] mà chúng cung cấp cho [holder|E]."
  game_concept_fortification_building:  "Công trình Công sự"
  game_concept_fortification_buildings:  "Công trình Công sự"
  game_concept_fortification_building_desc:  "$game_concept_fortification_buildings$ là [buildings|E] có chức năng chính là tăng [fort_level|E] địa sản của họ hoặc cung cấp phần thưởng [advantage|E] cho bên phòng thủ."
  game_concept_pious_building: "Công trình Ngoan đạo"
  game_concept_pious_buildings: "Các công trình Ngoan đạo"
  game_concept_pious_building_desc: "$game_concept_pious_buildings$ là các [buildings|E] mà chức năng chính là tăng cường [piety|E] cho điểm nắm giữ của chúng."

  game_concept_battle:0 "Trận chiến"
  game_concept_battles:0 "Trận chiến"
  game_concept_battle_desc:1 "$game_concept_battles$ bắt đầu khi hai [armies|E] đối nghịch tiến vào cùng một [barony|E].\n\nKhi bắt đầu $game_concept_battle$, một bên thường bắt đầu với [advantage|E] phụ thuộc vào các yếu tố như [terrain|E], [commander|E] và [commander_traits|E].\n\nQuân đội nhận [casualties|E] dựa trên lượng [damage|E] phải gánh chịu. $game_concept_battle$ đi vào [aftermath|E] của nó khi không có [soldiers|E] nào ở lại một bên.\n\nBên chiến thắng trong $game_concept_battle$ được thưởng [war_score|E] tùy thuộc vào tính quan trọng của chiến thắng."
  game_concept_aftermath:0 "Truy kích"
  game_concept_aftermath_desc:1 "Giai đoạn $game_concept_aftermath$ của một trận [battle|E] xảy ra bất cứ khi nào một bên đã chiến thắng. Bên chiến thắng sẽ cố gắng truy đuổi nhiều [Concept( 'retreat', 'đang rút lui' )|E] [soldiers|E] nhất có thể.\n\nCác [men_at_arms|E] với [pursuit|E] cao có thể tiêu diệt nhiều $game_concept_soldiers$ hơn trong giai đoạn $game_concept_aftermath$, trong khi các $game_concept_men_at_arms$ với [screen|E] cao sẽ bảo vệ [soldiers|E] đồng minh."
  game_concept_casualty:0 "Thương vong"
  game_concept_casualties:0 "Thương vong"
  game_concept_casualty_desc:0 "[armies|E] sẽ chịu một lượng $game_concept_casualties$ nhất định trong [battle|E] tùy thuộc vào lượng [damage|E] nhận phải.\n\nKhi [soldiers|E] bị loại bỏ khỏi $game_concept_battle$, chúng sẽ bị coi là [routed_soldiers|E] hoặc [dead_soldiers|E]."
  game_concept_retreat:0 "Rút lui"
  game_concept_retreats:0 "Rút lui"
  game_concept_retreat_desc:0 "Một [army|E] sẽ $game_concept_retreat$ nếu nó thua một [battle|E]. Quân đội cũng có thể được lệnh cho $game_concept_retreat$ trong $game_concept_battles$. Trong khi Rút lui, $game_concept_army$ không thể giải tán hoặc nhận lệnh di chuyển mới."
  game_concept_illness:0 "Đau ốm"
  game_concept_ill:0 "Đau ốm"
  game_concept_sick:0 "Đau ốm"
  game_concept_sickness:0 "Bệnh tật"
  game_concept_illnesses:0 "Bệnh tật"
  game_concept_diseases:0 "Bệnh tật"
  game_concept_illness_desc:0 "Bệnh tật là một loại [traits|E] tiêu cực làm giảm [health|E] của Nhân vật. Đặc điểm bệnh tật có thể tồn tại trong những khoảng thời gian khác nhau và khác nhau rất nhiều về khả năng gây tử vong."
  game_concept_medical_treatments:0 "Điều trị Y tế"
  game_concept_medical_treatments_desc:1 "Khi một nhân vật bị [ill|E] hoặc bị [GetTrait('wounded_1').GetName( GetNullCharacter )] thì một Phương pháp Điều trị Y tế có thể giúp họ hồi phục nhanh hơn.\n\nNgười chịu trách nhiệm điều trị cho ngài và các [courtiers|E] của ngài là [GetCourtPositionType('court_physician_court_position').GetName()]. Hãy cố gắng luôn thuê một người làm việc nếu ngài có khả năng chi trả mức lương của họ.\n\nCàng nhiều phương pháp điều trị mà một $court_physician_court_position$ được thực hiện, thì kỹ năng của họ sẽ càng phát triển, mang lại cho họ [traits|E] [GetTrait('lifestyle_physician').GetName( GetNullCharacter )]."
  game_concept_combat_width:0 "Chiều rộng Chiến đấu"
  game_concept_combat_width_desc:1 "$game_concept_combat_width$ cho biết số lượng [soldiers|E] của mỗi bên có thể chiến đấu với nhau đồng thời trong [battle|E], và có thể bị ảnh hưởng bởi các yếu tố như [terrain|E].\n\nĐiều này ngăn cản một bên hoàn toàn áp đảo đối phương và được xác định khi bắt đầu Trận chiến."
  game_concept_roll:0 "Tung Xúc xắc"
  game_concept_rolls:0 "Tung Xúc xắc"
  game_concept_combat_roll:0 "Xúc xắc Trận chiến"
  game_concept_advantage_roll:0 "Xúc xắc Lợi thế"
  game_concept_advantage_rolls:0 "Xúc xắc Lợi thế"
  game_concept_combat_roll_desc:0 "Xúc xắc [advantage|E] được tạo ra bởi mỗi [commander|E] trong [battle|E]. Chúng được thực hiện trên thang điểm từ 0-10 và hoàn toàn ngẫu nhiên, nhưng có thể có ảnh hưởng quyết định đến kết quả của $game_concept_battle$."
  game_concept_terrain:0 "Địa hình"
  game_concept_terrains:  "Địa hình"
  game_concept_terrain_desc:1 "Mỗi [barony|E] có một Địa hình ưu thế cụ thể có thể ảnh hưởng đến những thứ như [supply|E], tốc độ di chuyển của [armies|E], hiệu quả của nhiều loại [regiments|E] [men_at_arms|E] trong [battle|E] và các [buildings|E] có thể được xây dựng ở đó.\n\nNhiều [commander_traits|E] cũng đề cập tới Địa hình."
  game_concept_independent_ruler:0 "Nhà cai trị độc lập"
  game_concept_independent_rulers:  "Nhà cai trị độc lập"
  game_concept_independent_ruler_desc:0 "[rulers|E] $game_concept_independent$ không có [liege|E] và do đó được hưởng quyền tự do hành động cao hơn (ví dụ: tuyên bố [wars|E]).\n\nTuy nhiên, không giống như [vassals|E] họ cũng có thể trực tiếp bị tấn công bởi [rulers|E] nước ngoài."
  game_concept_independent:0 "Độc lập"
  game_concept_unlanded:0 "Không có Đất đai"
  game_concept_unlanded_desc:0 "Nhân vật $game_concept_unlanded$ không có [holdings|E] trong [domain|E] của họ, nhưng về mặt lý thuyết vẫn có thể là [rulers|E] thuộc một loại. Ví dụ: đây có thể là trường hợp của [heads_of_faith|E] và Các bậc thầy của [holy_orders|E]."
  game_concept_landed:0 "Có Đất đai"
  game_concept_land:0 "Đất đai"
  game_concept_landed_desc:0 "Nhân vật $game_concept_landed$ là [ruler|E] người sở hữu [holdings|E]. Ex Ngoại trừ [theocracies|E] và [republics|E], [commoners|E] tự động trở thành [nobles|E] khi họ có đất đai, thành lập một [dynasty|E] mới."
  game_concept_head_of_faith:0 "Lãnh đạo Đức tin"
  game_concept_heads_of_faith:0 "Lãnh đạo Đức tin"
  game_concept_head_of_faith_desc:0 "$game_concept_head_of_faith$ là nhà lãnh đạo chính thức của [faith|E]. Quyền hạn và bản chất của $game_concept_head_of_faith$ phụ thuộc vào [doctrines|E] của Đức tin.\n\nMột số Đức tin có [spiritual_head_of_faith|E] #weak (ví dụ: Giáo hoàng)#!, một số có [temporal_head_of_faith|E] #weak (ví dụ: Caliph)#!, và một số hoàn toàn không có $game_concept_head_of_faith$."
  game_concept_spiritual_head_of_faith:0 "Lãnh đạo Đức tin Tinh thần"
  game_concept_head_of_faith_spiritual:0 "Tinh thần"
  game_concept_spiritual_head_of_faith_desc:0 "Một [head_of_faith|E] [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] là [theocratic|E] và không cần phải [landed|E] #weak (mặc dù họ có thể có)#!.\n\n$game_concept_heads_of_faith$ $game_concept_head_of_faith_spiritual$ thường có quyền sử dụng các tương tác chẳng hạn như có thể ban [claims|E] hoặc [gold|E].\n\nNếu [doctrines|E] của [faith|E] cho phép [great_holy_wars|E] thì chúng sẽ là [great_holy_war_undirected|E] #weak (ví dụ: Crusades (Thập Tự Chinh))#!."
  game_concept_temporal_head_of_faith:0 "Lãnh đạo Đức tin Thế tục"
  game_concept_head_of_faith_temporal:0 "Thế tục"
  game_concept_temporal_head_of_faith_desc:0 "[head_of_faith|E] [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] hoạt động giống như một [ruler|E] bình thường, với [title|E] $game_concept_head_of_faith$ bị phá hủy nếu họ mất hết đất đai của họ.\n\nNếu [doctrines|E] của [faith|E] cho phép [great_holy_wars|E] thì chúng sẽ là [great_holy_war_directed|E] #weak (ví dụ: Jihads)#!."
  game_concept_routed_soldiers:0 "Thương vong Rút lui"
  game_concept_routed_soldiers_desc:1 "Trong [battle|E], hầu hết [casualties|E] thực sự là $game_concept_routed_soldiers$ và không chết hoặc bị thương nặng. Không giống như [dead_soldiers|E], những [soldiers|E] này sẽ sống để chiến đấu vào một ngày khác và trở lại [army|E] sau khi $game_concept_battle$ kết thúc. Họ vẫn có thể bị bên thắng áp chế trong [aftermath|E] của $game_concept_battle$, bao gồm nếu $game_concept_army$ tự nguyện [retreats|E]."
  game_concept_dead_soldiers:1 "Thương vong Chí mạng"
  game_concept_dead_soldiers_desc:0 "Trong [battle|E], nhiều (nhưng thường không phải hầu hết) [soldiers|E] bị giết hoặc bị thương quá nặng để có thể chiến đấu lại. Đây là [casualties|E] vĩnh viễn chứ không phải chỉ có [routed_soldiers|E]."
  game_concept_title_claim:0 "Yêu sách Tước vị"
  game_concept_title_claims:0 "Yêu sách Tước vị"
  game_concept_claims:0 "Yêu sách"
  game_concept_claim:0 "Yêu sách"
  game_concept_claimed:0 "Yêu sách"
  game_concept_claim_i:1 "@pressed_claim!"
  game_concept_title_claim_desc:0 "$game_concept_claim$ đối với một [title|E] thể hiện quyền hợp pháp để sở hữu nó và cung cấp một [casus_belli|E] để chinh phục nó thông qua [war|E]. Yêu sách cũng đưa ra lý do hợp lệ để [revoke|E] [titles|E] của [holders|E] [vassal|E].\n\nYêu sách thường được trao cho các [rulers|E] bất cứ khi nào họ mất quyền kiểm soát các Tước vị cho người khác, nhưng cũng có thể được tạo ra thông qua Nhiệm vụ [fabricate_claim_short|E].\n\nHơn nữa, mỗi đứa con (thậm chí là [bastards|E]) của một nhà cai trị đều có một [implicit_claim|E] đối với tất cả các [titles|E] của nhà cai trị. Nếu họ không kế thừa tước vị đó từ [ruler] khi họ chết, những [implicit_claims] đó sẽ chuyển đổi thành [pressed_claims|E], sau đó có thể được thừa kế bởi con cái của họ là [unpressed_claims|E]."
  game_concept_pressed_claim:0 "Yêu sách Mạnh"
  game_concept_pressed_claims:0 "Yêu sách Mạnh"
  game_concept_pressed_claim_i:1 "@pressed_claim!"
  game_concept_pressed:0 "Mạnh"
  game_concept_pressed_claim_desc:0 "[claims|E] $game_concept_pressed$ được coi là mạnh mẽ về mặt pháp lý và được con cái của [unpressed_claims|E] kế thừa dưới dạng [claimant|E]."
  game_concept_unpressed_claim:0 "Yêu sách Yếu"
  game_concept_unpressed_claims:0 "Yêu sách Yếu"
  game_concept_unpressed_claim_i:1 "@unpressed_claim!"
  game_concept_unpressed:0 "Yếu"
  game_concept_unpressed_claim_desc:0 "[claims|E] $game_concept_unpressed$ không có giá trị pháp lý và không được thừa kế bởi con cái của [claimant|E].\n\nTuy nhiên, Yêu sách Yếu sẽ trở thành [pressed|E] nếu chúng được sử dụng trong [casus_belli|E] để tuyên bố [war|E] — ngay cả nếu chiến tranh kết thúc trong [white_peace|E]."
  game_concept_implicit_claim:0 "Yêu sách Tiềm ẩn"
  game_concept_implicit_claims:0 "Yêu sách Tiềm ẩn"
  game_concept_implicit_claim_i:1 "@implicit_claim!"
  game_concept_implicit_claim_desc:2 "$game_concept_implicit_claims$ là [claims|E] được trao cho [eligible_children|E] đối với tất cả [titles|E] được nắm giữ bởi cha mẹ của họ. Nếu cha mẹ mất [title|E], $game_concept_implicit_claim$ của con cái cũng sẽ bị xóa bỏ."
  game_concept_claimant:0 "Kẻ đoạt quyền"
  game_concept_claimants:0 "Kẻ đoạt quyền"
  game_concept_claimant_possessive:  "Kẻ đoạt quyền"
  game_concept_claimant_desc:0 "$game_concept_claimant$ là một người có một hoặc nhiều [claims|E] đối với [titles|E]. [ruler|E] Kẻ đoạt quyền có thể ấn định các quyền này bằng cách sử dụng Yêu sách [casus_belli|E] để tuyên bố [wars|E].\n\nBiện minh Chiến tranh này cũng có thể được sử dụng để ấn định Yêu sách của [vassals|E] và thậm chí cả các nhân vật [unlanded|E] trong [realm|E] của ngài.\n\nKẻ đoạt quyền cũng có thể lãnh đạo [factions|E] — ngay cả nếu họ không cư trú trong Quốc gia của ngài."
  game_concept_renounce:0 "Từ bỏ"
  game_concept_renounced:0 "Từ bỏ"
  game_concept_renounce_desc:0 "[prisoners|E] có thể được phóng tích cho việc Từ bỏ tất cả [claims|E] đối với [titles|E] trong [realm|E] của ngài.\n\nTuy nhiên, con cái của [holder|E] hiện tại không bao giờ có thể mất Yêu sách của họ miễn là Người nắm giữ vẫn còn sống."
  game_concept_court:0 "Triều đình"
  game_concept_courts:0 "Triều đình"
  game_concept_court_desc:  "Mỗi [ruler|E] đều có một $game_concept_court$, bao gồm các Nhân vật [unlanded|E] khác nhau phục vụ cho [liege|E] của họ.\n\nThông thường, các [courtiers|E] này bao gồm gia đình Nhà cai trị và hỗn hợp các [nobles|E] và thường dân không liên quan nhưng có thể hữu ích."
  game_concept_courtier:0 "Cận thần"
  game_concept_courtiers:0 "Cận thần"
  game_concept_courtier_desc:2 "$game_concept_courtier$ là một nhân vật [unlanded|E], người phục vụ một một [ruler|E] trong [court|E] của họ.\n\nCận thần có thể:\n$BULLET_WITH_TAB$Phục vụ với tư cách là [councillors|E]\n$BULLET_WITH_TAB$Phục vụ trong [court_positions|E]\n$BULLET_WITH_TAB$Phục vụ trong [armies|E] với tư cách là [commanders|E] hoặc [knights|E]\n$BULLET_WITH_TAB$Trở thành [vassal|E] của Nhà cai trị nếu họ được trao tặng một [title|E]\n$BULLET_WITH_TAB$Để Nhà cai trị của họ thúc đẩy các [claims|E] trong [war|E]\n\n#WEAK Các [adventurers|E] có [followers|E] thay vì $game_concept_courtiers$ — họ có vai trò tương tự, mặc dù nhìn chung có mùi hôi hơn và nhiều bùn hơn.#!"
  game_concept_court_guest:0 "Khách mời Triều đình"
  game_concept_guest:0 "Khách mời"
  game_concept_guests:0 "Khách mời"
  game_concept_court_guest_desc:0 "[wanderers|E] đôi khi xuất hiện tại [court|E] với tư cách là Khách. Họ sẽ chỉ ở lại trong một thời gian giới hạn, nhưng có thể được chiêu mộ bởi [ruler|E] và trở thành [courtiers|E] vĩnh viễn."
  game_concept_wanderer:0 "Lãng khách"
  game_concept_wanderers:0 "Lãng khách"
  game_concept_wanderer_desc:0 "Những nhân vật không thuộc về [court|E] hoặc giữ bất kỳ [titles|e] nào được gọi là Lãng khách. Họ đi khắp thế giới, ghé thăm Triều đình với tư cách [guests|E] trên đường đi. Những Lãng khách có thể trở thành Thủ lĩnh [mercenary|E], lãnh đạo [holy_orders|E], thành viên [clergy|E], hoặc người nắm giữ [city|E]."

  game_concept_court_host:0 "Chủ nhà Triều đình"
  game_concept_court_host_desc:2 "$game_concept_court_host$ là một [ruler|E] không phải là lãnh chúa của một nhân vật, nhưng vẫn có họ trong [court] của họ.\n\nCó một số lý do có thể khiến điều này xảy ra, chẳng hạn như các [wanderers|E] viếng thăm Nhà cai trị hoặc [wards|E] ở cùng Triều đình với [guardian|E] của họ."
  game_concept_host:0 "Chủ nhà"
  game_concept_hosting:  "Tổ chức"
  game_concept_noble:0 "Quý tộc"
  game_concept_nobles:0 "Quý tộc"
  game_concept_nobleman:0 "Nam Quý tộc"
  game_concept_noblemen:0 "Nam Quý tộc"
  game_concept_noblewoman:0 "Nữ Quý tộc"
  game_concept_noblewomen:0 "Nữ Quý tộc"
  game_concept_nobility:0 "Quý tộc"
  game_concept_noble_desc:0 "$game_concept_nobles$ là các nhân vật là thành viên của [dynasty|E]. Các nhân vật không có triều đại được coi là [commoners|E] bần tiện."
  game_concept_commoner:0 "Thường dân"
  game_concept_lowborn:0 "Tiện dân"
  game_concept_commoners:0 "Thường dân"
  game_concept_commoner_desc:0 "Nhân vật $game_concept_commoner$ hoặc $game_concept_lowborn$ không phải là thành viên của [noble|E] [dynasty|E]. Tuy nhiên, họ vẫn có thể, là [rulers|E] quyền lực của [theocracies|E] và [republics|E].\n\nNếu một Thường dân trở thành [landed|E], họ ngay lập tức trở thành Quý tộc và thành lập [dynasties|E] của riêng mình (ngoại trừ [republics|E] và [theocracies|E], phần lớn do Thường dân điều hành)."
  game_concept_martial_lifestyle:0 "Lối sống Quân sự"
  game_concept_martial_lifestyle_i:  "@martial_lifestyle_icon!"
  game_concept_martial_lifestyle_desc:0 "$game_concept_martial_lifestyle$ phù hợp với những Nhân vật muốn cải thiện [men_at_arms|E] và [knights|E], tăng [control|E] trong [domain|E] của họ, hoặc tăng cơ hội chiến thắng [wars|E]."
  game_concept_intrigue_lifestyle:0 "Lối sống Mưu lược"
  game_concept_intrigue_lifestyle_i:  "@intrigue_lifestyle_icon!"
  game_concept_intrigue_lifestyle_desc:0 "$game_concept_intrigue_lifestyle$ phù hợp với những Nhân vật muốn thành công trong [schemes|E], giành được [dread|E], hoặc Quyến rũ người khác một cách dễ dàng."
  game_concept_intrigue_lqwuljxh:0 "Âm mưu"
  game_concept_intrigue_9_14_20_18_9_7_21_5:0 "9 14 20 18 9 7 21 5"
  game_concept_intrigue_rigueint:0 "Rigueint"
  game_concept_diplomacy_lifestyle:0 "Lối sống Ngoại giao"
  game_concept_diplomacy_lifestyle_i:  "@diplomacy_lifestyle_icon!"
  game_concept_diplomacy_lifestyle_desc:0 "$game_concept_diplomacy_lifestyle$ phù hợp với những Nhân vật muốn nhận được [claims|E] và [casus_bellis|E], tăng [prestige|E] của họ, hoặc nhận được lợi ích từ Gia đình và Bằng hữu."
  game_concept_stewardship_lifestyle:0 "Lối sống Quản lý"
  game_concept_stewardship_lifestyle_i:  "@stewardship_lifestyle_icon!"
  game_concept_stewardship_lifestyle_desc:0 "$game_concept_stewardship_lifestyle$ phù hợp với những Nhân vật muốn cải thiện [domain|E] của họ, xoa dịu [liege|E] và [vassals|E] của họ, hoặc kiếm được nhiều [gold|E]."
  game_concept_learning_lifestyle:0 "Lối sống Học thức"
  game_concept_learning_lifestyle_i:  "@learning_lifestyle_icon!"
  game_concept_learning_lifestyle_desc:0 "$game_concept_learning_lifestyle$ phù hợp với những Nhân vật muốn sống lâu và khỏe mạnh, nhận được [piety|E], hoặc nhận thêm tiền thưởng từ [faith|E] của họ."
  game_concept_wanderer_lifestyle:  "Lối sống Lang thang"
  game_concept_wanderer_lifestyle_desc:  "$game_concept_wanderer_lifestyle$ phù hợp với những Nhân vật muốn xem các [points_of_interest|E], hoặc nhận thêm phần thưởng từ [traveling|E]."
  game_concept_crime:0 "Tội ác"
  game_concept_crimes:0 "Tội ác"
  game_concept_criminal:0 "Tội phạm"
  game_concept_criminals:0 "Tội phạm"
  game_concept_crime_i:0 "@crime_icon!"
  game_concept_crime_desc:2 "$game_concept_crimes$ là những hành động mà xã hội coi là phản cảm đến mức đáng bị trừng phạt.\n\nCác Tội ác có thể là thế tục (chẳng hạn như [vassal|E] [revolting|E] chống lại [liege|E] của họ) hoặc tôn giáo ( bất kỳ loại hành vi [shunned|E] nào bị [doctrine|E] coi là bất hợp pháp). Tội ác thế tục chỉ có thể bị trừng phạt bởi (những) nhân vật bị tổn hại bởi hành vi đó, nhưng bất kỳ [ruler|E] nào cũng có thể trừng phạt các thần dân của họ vì Tội ác tôn giáo.\n\nTất cả các tội ác đều cho Nhà cai trị một lý do hợp lệ để [imprison|E] $game_concept_criminals$, và, tùy theo mức độ nghiêm trọng của Tội ác, mà có thể [revoke|E] [titles|E] của họ, [banish|E], [torture|E], hoặc [execute|E] họ. Mỗi Tội ác chỉ có thể bị Nhà cai trị trừng phạt một lần, mặc dù một số Tội ác sẽ khiến Tội phạm phải gánh chịu [fame_trait|E] tiêu cực mà họ sẽ mang chúng xuống mồ.\n\nĐôi khi các nhân vật thoát khỏi Tội ác, sau đó là các[secrets|E] mà các nhân vật khác có thể khám phá và được sử dụng để [blackmail|E]."

  game_concept_shunned:0 "Xa lánh"
  game_concept_shunned_desc:1 "Nhiều [faiths|E] có [doctrines|E] chỉ định một số hành vi nhất định là Bị xa lánh. Tùy thuộc vào Giáo lý cụ thể, những hành vi này cũng có thể bị coi là [criminal|E].\n\nNhững nhân vật bị bắt quả tang đang thực hành các hành vi bị Xa lánh bởi Đức tin của họ bị mất một [piety_level|E] và nhận được [fame_trait|E]; Đặc điểm này sẽ bị không thích bởi những người mà Đức tin cho rằng hành vi đó là Xa lánh hoặc Tội phạm.\n\nVí dụ về các hành vi Xa lánh bao gồm:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
  game_concept_refuse_conversion_crime:0 "Từ chối Cải đạo"
  game_concept_refusing_conversion_crime:0 "Từ chối Cải đạo"
  game_concept_refused_conversion_crime:0 "Từ chối Cải đạo"
  game_concept_refuse_conversion_crime_desc:2 "Từ chối chuyển đổi sẽ bị coi là [crime|E] nếu:\n$EFFECT_LIST_BULLET$ [character|E] từ chối có cùng [religion|E] với $game_concept_character$ đưa ra yêu cầu\n$EFFECT_LIST_BULLET$$game_concept_religion$ có [heresies|E]\n$EFFECT_LIST_BULLET$[faith|E] của $game_concept_character$ đưa ra yêu cầu là [faith_hostile|E] hoặc hơn thế nữa đối với $game_concept_faith$ của $game_concept_character$ từ chối"
  game_concept_prison:0 "Nhà tù"
  game_concept_imprisons:0 "Cầm tù"
  game_concept_imprison:0 "Cầm tù"
  game_concept_imprisoning:0 "Cầm tù"
  game_concept_imprisoned:0 "Cầm tù"
  game_concept_imprisonment:0 "Cầm tù"
  game_concept_prisons:0 "Nhà tù"
  game_concept_prisoner:0 "Tù nhân"
  game_concept_prisoners:0 "Tù nhân"
  game_concept_jailor:0 "Jailor"
  game_concept_prison_desc:  "Các [rulers|E] [landed|E] có thể giam giữ các Nhân vật khác làm Tù nhân, trong [dungeon|E] của họ hoặc đơn giản hơn là [house_arrest|E]. Trong một [camp|E] tất cả Tù nhân đều bị giam giữ trong [stockade|E]. Các Nhân vật có nguy cơ bị cầm tù trong [battle|E] hoặc khi kết thúc [siege|E].\n\nCác Nhân vật cũng có thể bắt giữ bất kỳ ai trong [realm|E], hoặc [camp|E]. Tuy nhiên, điều này bị coi là [tyrannical|E] trừ khi Nhân vật [crime|E].\n\nCác Tù nhân nằm trong tay ngài và có thể bị [executed|E], [tortured|E], đòi Tiền chuộc hoặc đơn giản là Phóng thích."
  game_concept_dungeon:  "Ngục tối"
  game_concept_stockade:  "Trại tập trung"
  game_concept_dungeons:  "Ngục tối"
  game_concept_stockades:  "Trại tập trung"
  game_concept_dungeon_desc:  "Các nhân vật bị [imprisoned|E] bị giam giữ trong $game_concept_dungeon$ hoặc $game_concept_stockade$ phải chịu đựng [stress|E] ngày càng tăng cũng như hình phạt [health|E]. Theo thời gian, họ có khả năng chết vì [illness|E] hoặc suy sụp tinh thần.\n\nĐối với các [rulers|E] [landed|E], [commoners|E] tự động bị tống vào Ngục tối, nhưng có thể được chuyển đến [house_arrest|E]."
  game_concept_stockade_desc:  "$game_concept_dungeon_desc$"
  game_concept_house_arrest:0 "Quản thúc Tại gia"
  game_concept_house_arrest_desc:0 "$game_concept_house_arrest$ là một hình thức khoan dung với [prison|E] nơi Nhân vật không bị ảnh hưởng xấu nào ngoại trừ sự buồn chán. Tuy nhiên, các [rulers|E] có thể tống họ vào [dungeon|E], mặc dù nó làm giảm [opinions|E] của [close_family|E] của Tù nhân.\n\nCác [nobles|E] bị bắt sẽ tự động được đưa vào [house_arrest|E]."
  game_concept_tyranny:0 "Chuyên chế"
  game_concept_tyrant:0 "Bạo chúa"
  game_concept_tyrannical:0 "Chuyên chế"
  game_concept_tyranny_desc:0 "Nhiều hành động của [ruler|E] bị coi là $game_concept_tyrannical$ — chống lại luật pháp hoặc [doctrine|E] tôn giáo. Ví dụ, [imprisoning|E] hoặc [revoking|E] [titles|E] đối với người không phải là [crime|E] bị coi là Chuyên chế.\n\nHành động chuyên chế đóng vai trò như một công cụ sửa đổi [opinion|E] cho tất cả các nhân vật trong [realm|E]."
  game_concept_execute:0 "Hành hình"
  game_concept_executed:0 "Hành hình"
  game_concept_executing:0 "Hành hình"
  game_concept_execution:0 "Hành hình"
  game_concept_executions:0 "Hành hình"
  game_concept_execute_desc:1 "Các nhân vật bị [imprisoned|E] có thể bị $game_concept_executed$. Đây bị coi là [tyrannical|E] trừ khi kẻ cầm tù của họ có [execute_reason|E].\n\nHành hình làm tăng [dread|E] của ngài và không bao giờ được đón nhận bởi [close_family|E] của mục tiêu bất hạnh."
  game_concept_torture:0 "Tra tấn"
  game_concept_tortured:0 "Tra tấn"
  game_concept_torturing:0 "Tra tấn"
  game_concept_torture_desc:0 "Các nhân vật bị [imprisoned|E] có thể bị $game_concept_tortured$, gây tổn hại đến [health|E] của họ hoặc thậm chí khiến họ bị ảnh hưởng theo những cách khác nhau.\n\nTra tấn có thể làm giảm [stress|E] cho các Nhân vật [GetTrait('callous').GetName( GetNullCharacter )] và [GetTrait('sadistic').GetName( GetNullCharacter )], nhưng gây ra Căng thẳng cho những người có bản chất tốt.\n\nTra tấn các [rulers|E] cũng có thể làm tăng [dread|E] của ngài."
  game_concept_banish:0 "Trục xuất"
  game_concept_banished:0 "Trục xuất"
  game_concept_banishment:0 "Trục xuất"
  game_concept_banishment_desc:1 "Các nhân vật bị [imprisoned|E] có thể bị $game_concept_banished$ khỏi [realm|E] vương quốc, được cho là hình thức trừng phạt khắc nghiệt nhất. Nhà cai trị [landed|E] $game_concept_banished$ bị phết truất, trong khi [courtiers|E] $game_concept_banished$ bị tịch thu tài sản.\n\nTrục xuất mà không có lý do (ví dụ: một số [crime|E] nghiêm trọng) bị coi là cực kỳ [tyrannical|E]."
  game_concept_revoke:0 "Tước đoạt"
  game_concept_revoked:0 "Tước đoạt"
  game_concept_revoking:0 "Tước đoạt"
  game_concept_revocation:0 "Tước đoạt"
  game_concept_revocations:0 "Tước đoạt"
  game_concept_revoke_desc:0 "Ở mức [limited_crown_authority|E] trở lên, các [rulers|E] có thể $game_concept_revoke$ [titles|E] của [vassals|E] của họ, nhưng trừ khi Chư hầu bị [imprisoned|E], đây là một đề xuất mạo hiểm, vì Chư hầu có thể từ chối và nổi dậy trong cuộc nổi loạn.\n\nCách chức tước vị bị coi là [tyrannical|E] trừ khi Chư hầu phạm một [crime|E] nghiêm trọng."
  game_concept_retract:0 "Thu hồi"
  game_concept_retracted:0 "Thu hồi"
  game_concept_retracting:0 "Thu hồi"
  game_concept_retraction:0 "Thu hồi"
  game_concept_retractions:0 "Thu hồi"
  game_concept_retract_desc:0 "Ở mức [limited_crown_authority|E] trở lên, [rulers|E] có thể $game_concept_retract$ [vassal|E] của một Chư hầu, nhưng trừ khi sau khi [imprisoned|E] điều này rất rủi ro, vì Chư hầu có thể từ chối và trỗi dậy trong cuộc nổi loạn.\n\nThu hồi Chư hầu bị coi là [tyrannical|E] trừ khi mục tiêu phạm một [crime|E] nghiêm trọng."
  game_concept_transfer:0 "Ban Phong"
  game_concept_transferred:0 "Ban Phong"
  game_concept_transferring:0 "Ban Phong"
  game_concept_transfer_desc:0 "[rulers|E] có thể $game_concept_transfer$ môt trong số [vassals|E] cho Chư hầu khác, miễn là người trước có cấp bậc thấp hơn người sau. Đây là một cách hay để nâng cao [opinion|E] của một Chư hầu, đặc biệt nếu chư hầu được Ban phong là một phần [de_jure|E] của [realm|E] của ngài."
  game_concept_men_at_arms:0 "Men-at-Arms"
  game_concept_men_at_arms_desc:1 "$game_concept_men_at_arms$ là các [soldiers|E] chuyên nghiệp vượt trội hơn hẳn so với [levies|E].\n\nNgười chơi có quyền kiểm soát trực tiếp thành phần và quy mô [regiments|E] của Men-at-Arms.\n\nCác loại Men-at-Arms khác nhau có thể tốt hoặc tệ hại tùy thuộc vào [terrain|E] khác nhau. Mỗi loại cũng [counters|E] một loại khác.\n\nMen-at-Arms có thể [stationed|E] ở các [holdings|E] để gia tăng hiệu quả của mình."
  game_concept_skirmishers:0 "Đơn vị Giao tranh"
  game_concept_skirmisher:0 "Đơn vị Giao tranh"
  game_concept_skirmishers_desc:0 "Đơn vị Giao tranh là [men_at_arms|E] được trang bị nhẹ và có kỹ năng quấy rối kẻ thù.\n\nMặc dù mỗi loại Tản binh là duy nhất, nhưng chúng thường [counter|E] [heavy_infantry|E], và lần lượt bị Khắc chế bởi [archers|E]."
  game_concept_archers:0 "Cung thủ"
  game_concept_archer:1 "Cung thủ"
  game_concept_archers_desc:0 "Cung thủ là [men_at_arms|E] chiến đấu trên bộ bằng vũ khí tầm xa.\n\nMặc dù mỗi loại Cung thủ là duy nhất, nhưng chúng thường [counter|E] [skirmishers|E], và lần lượt bị Khắc chế bởi [heavy_cavalry|E] và [light_cavalry|E]."
  game_concept_light_cavalry:0 "Kỵ binh Hạng nhẹ"
  game_concept_light_cavalry_desc:0 "Kỵ binh Hạng nhẹ là kị binh [men_at_arms|E] những người xuất sắc trong việc trinh sát và truy đuổi kẻ thù.\n\nMặc dù mỗi loại Kỵ binh Hạng nhẹ là duy nhất, chúng thường [counter|E] [archers|E], và lần lượt bị Khắc chế bởi [spearmen|E].\n\nCác Kỵ binh Hạng nhẹ cũng thường mạnh mẽ trên [terrain|E] bằng phẳng.\n\nSo với [heavy_cavalry|E], họ thường giỏi hơn trong [pursuit|E] và [screen|E]."
  game_concept_heavy_cavalry:0 "Kỵ binh Hạng nặng"
  game_concept_heavy_cavalry_desc:0 "Kỵ binh Hạng nặng là kị binh [men_at_arms|E], bọc giáp nặng\n\nMặc dù mỗi loại Kỵ binh hạng nặng là duy nhất, nhưng chúng thường [counter|E] [archers|E], và lần lượt bị Khắc chế bởi [spearmen|E].\n\nCác kỵ binh Hạng nặng cũng thường mạnh mẽ trên [terrain|E] bằng phẳng.\n\nSo với [light_cavalry|E], chúng thường mạnh hơn ở [damage|E] nguyên bản và [toughness|E]."
  game_concept_spearmen:0 "Lính giáo"
  game_concept_spearmen_desc:0 "Lính giáo là [men_at_arms|E] những người chiến đấu trên bộ với nhiều loại vũ khí khác nhau.\n\nMặc dù mỗi loại Lính giáo là duy nhất, nhưng chúng thường [counter|E] [heavy_cavalry|E] và [light_cavalry|E], và lần lượt bị Khắc chế bởi [heavy_infantry|E].\n\nLính giáo cũng thường mạnh mẽ trên [terrain|E] đồi núi."
  game_concept_heavy_infantry:0 "Bộ binh Hạng nặng"
  game_concept_heavy_infantry_desc:0 "Bộ binh Hạng nặng là [men_at_arms|E] chiến đấu trên bộ, với áo giáp và vũ khí hạng nặng.\n\nMặc dù mỗi loại Bộ binh Hạng nặng là duy nhất, nhưng chúng thường [counter|E] [spearmen|E], và lần lượt bị Khắc chế bởi [skirmishers|E]."
  game_concept_archer_cavalry:0 "Kỵ binh Cung thủ"
  game_concept_archer_cavalry_desc:0 "$game_concept_archer_cavalry$ là [men_at_arms|E] cưỡi thú được trang bị vũ khí tầm xa.\n\nMặc dù mỗi loại $game_concept_archer_cavalry$ là duy nhất, nhưng chúng thường [counter|E] [heavy_infantry|E], và ngược lại bị Khắc chế bởi [archers|E] được trang bị nỏ.\n\n$game_concept_archer_cavalry$ thường mạnh mẽ ở [terrain|E] bằng phẳng, đặc biệt là Thảo nguyên."
  game_concept_camel_cavalry:0 "Kỵ binh Lạc đà"
  game_concept_camel_cavalry_desc:0 "$game_concept_camel_cavalry$ là [men_at_arms|E] cưỡi thú, tương tự như [light_cavalry|E], xuất sắc trong việc trinh sát và truy kích kẻ thù.\n\nChúng thường [counter|E] $game_concept_light_cavalry$ và ngược lại bị Khắc chế bởi [spearmen|E].\n\n$game_concept_camel_cavalry$ thường mạnh mẽ ở [terrain|E] Sa mạc và Vùng đất Khô hạn."
  game_concept_elephant_cavalry:0 "Kỵ binh Voi chiến"
  game_concept_elephant_cavalry_desc:0 "$game_concept_elephant_cavalry$ thường là [men_at_arms|E] cưỡi thú và bọc giáp.\n\nMặc dù mỗi loại $game_concept_elephant_cavalry$ là duy nhất, nhưng chúng thường [counter|E] mạnh mẽ với các đơn vị bộ binh, và ngược lại bị Khắc chế bởi [spearmen|E].\n\n$game_concept_elephant_cavalry$ thường mạnh mẽ ở [terrain|E] Rừng rậm."
  game_concept_gunpowders:  "Handgunner"
  game_concept_gunpowder:  "Handgunner"
  game_concept_gunpowder_desc:  "Handgunners (Lính súng ngắn) là [men_at_arms|E] được trang bị vũ khí thuốc súng mạnh mẽ.\n\nMặc dù mỗi loại Handgunners đều độc đáo, nhưng nhìn chung họ [counter|E] [heavy_infantry|E], và lần lượt bị Khắc chế bởi [heavy_cavalry|E] và [light_cavalry|E]."
  game_concept_peasant_militia:  "Dân quân Nông dân"
  game_concept_peasant_militias:  "Dân quân Nông dân"
  game_concept_peasant_militia_desc:  "Peasant Militias are [men_at_arms|E] who are armed with pitchforks and spears.\n\nWhile each kind of Militia is unique, they generally [counter|E] [heavy_cavalry|E] and [light_cavalry|E], and are in turn Countered by [heavy_infantry|E].\n\nPeasant Militias are strong in mountainous and fertile [terrain|E]."
  game_concept_special_troops:0 "Binh lính Đặc biệt"
  game_concept_special_troops_desc:0 "$game_concept_special_troops$ không giống như [armies|E] thông thường, vì chúng không được tập hợp từ [holding|E]. $game_concept_special_troops$ có thể kiếm được thông qua Sự kiện và đại diện cho nhiều thứ khác nhau như tùy tùng, bộ lạc hung hãn và tầng lớp nông dân đầy tham vọng.\n\nThông thường chúng không tốn chi phí bảo trì và không tăng viện. Hãy sử dụng chúng một cách khôn ngoan nếu ngài có.\n\nMột số [rulers|E] trong lịch sử bắt đầu với $game_concept_special_troops$."
  game_concept_line:0 "Hàng"
  game_concept_line_of_succession:0 "Hàng Kế vị"
  game_concept_line_of_succession_desc:0 "Hàng Kế vị là thứ tự trong đó một số nhân vật kế thừa một số [titles|E] nhất định, được xác định bởi [succession_law|E]."
  game_concept_counter:0 "Khắc chế"
  game_concept_counters:0 "Khắc chế"
  game_concept_men_at_arms_counter:0 "Khắc chế Men-at-Arms"
  game_concept_men_at_arms_counter_desc:0 "Hầu hết [men_at_arms|E] đều có thể $game_concept_counter$ một loại $game_concept_men_at_arms$ khác.\n\nKhi [regiment|E] bị Khắc chế, hiệu quả của nó trong [battle|E] sẽ giảm đi. $game_concept_regiment$ càng đông hơn $game_concept_counter$ của nó, hình phạt càng cao."
  game_concept_intimidated:0 "Đe dọa"
  game_concept_intimidated_i:0 "@intimidated_icon!"
  game_concept_intimidated_desc:1 "Những nhân vật cực kỳ sợ hãi một nhân vật khác sẽ bị họ Đe dọa. Điều này thường do [dread|E] và/hoặc tính cách hèn nhát.\n\nNhân vật bị Đe dọa ít có khả năng thực hiện các hành động thù địch chống lại nhân vật mà họ sợ hãi, bao gồm cả việc tham gia hoặc bắt đầu [factions|E].\n\nNhững nhân vật thậm chí còn sợ hãi hơn bị đánh dấu là [cowed|E]."
  game_concept_cowed:1 "Khiếp sợ"
  game_concept_terrified_i:0 "@terrified_icon!"
  game_concept_cowed_desc:2 "Nhân vật Khiếp sợ bị tê liệt vì sợ hãi một nhân vật khác và sẽ hiếm khi có bất kỳ hành động thù địch nào chống lại nhân vật đó, kể cả việc bắt đầu một [factions|E].\n\nNhân vật bị Khiếp sợ hoặc [intimidated|E] bởi [dread|E] và/hoặc một tính cách hèn nhát."
  game_concept_provisions:  "Lương thảo"
  game_concept_provision:  "Lương thảo"
  game_concept_provisions_i:  "@provisions_icon!"
  game_concept_provisions_desc:  "$game_concept_provisions$ biểu thị tổng lượng lương thực, nước uống và nơi trú ẩn mà một [camp|E] có thể cung cấp.\n\n$game_concept_camps$ hao hụt $game_concept_provisions$ khi di chuyển [location|E]. Mức độ ảnh hưởng chính xác bị ảnh hưởng bởi quy mô [men_at_arms|E], [terrain|E] đã băng qua, và các [officers|E] hiện đang được thuê.\n\nNhững người đi theo $game_concept_camp$ sắp hết $game_concept_provisions$ sẽ bắt đầu gặp phải các sự kiện [privation|E]: bắt đầu với việc các [characters|E] nhanh chóng mất đi [opinion|E] về lãnh đạo của họ, nhanh chóng leo thang tới tình trạng chết đói.\n\n#WEAK $game_concept_provisions$ có thể được nạp lại khi đứng yên bằng cách yêu cầu chúng từ các [contact_list_contacts|E], ban hành [decision|E], hoặc dưới dạng phần thưởng [task_contract|E].#!"
  game_concept_privation:  "Thiếu hụt"
  game_concept_privation_desc:  "Khi một [camp|E] hạ trại cố định, họ có thể tự duy trì bằng cách trao đổi thức ăn để lấy những công việc lặt vặt, săn bắn, kiếm ăn hoặc đánh cá ở những nơi được phép và có thể, và nói chung là #EMP chỉ#! đủ để duy trì nguồn tiếp tế của nó.\n\nNgay khi họ phải bắt đầu [traveling|E], thì họ hoàn toàn phụ thuộc vào $game_concept_provisions$ của mình để tồn tại, vì họ không thể vừa di chuyển vừa kiếm đủ thức ăn. Khi $game_concept_provisions$ cạn kiệt (sau đó #EMP hết tiếp tế#!), thì tâm trạng sẽ bị rối loạn, và [followers|E] sẽ chết đói.\n\nKhi điều này xảy ra, các [characters|E] sẽ bắt đầu rời khỏi $game_concept_camp$, các [modifiers|E] tiêu cực dần dần có hiệu lực, và những người còn lại cuối cùng sẽ nổi loạn hoặc chết."
  game_concept_supply:0 "Tiếp tế"
  game_concept_supply_state:0 "Trạng thái Tiếp tế"
  game_concept_supply_desc:1 "$game_concept_supply$ là lượng lương thực và quân nhu mà [army|E] mang theo. Các đội quân sẽ bắt đầu mất $game_concept_supply$ khi kích thước của chúng vượt quá [supply_limit|E] của vị trí hiện tại.\n\nQuân đội sắp hết $game_concept_supplies$ sẽ phải chịu một hình phạt [advantage|E] trong [battle|E], và khi hết hoàn toàn, họ sẽ bắt đầu bị [attrition|E].\n\nNguồn cung cấp tăng dần theo thời gian miễn là Quân đội vẫn còn bên dưới $game_concept_supply_limit$ trong lãnh thổ thân thiện."
  game_concept_supplied:0 "Tiếp tế"
  game_concept_supplies:0 "Tiếp tế"
  game_concept_supply_limit_mult:0 "Hệ số Giới hạn Tiếp tế"
  game_concept_supply_limit:0 "Giới hạn Tiếp tế"
  game_concept_supply_limit_desc:0 "$game_concept_supply_limit$ quy định số lượng [soldiers|E] ngài có thể có trong [barony|E], được xác định bởi [terrain|E] và [development|E] của Nam quốc.\n\nNếu tổng quy mô [army|E] của ngài vượt quá $game_concept_supply_limit$, $game_concept_armies$ của ngài sẽ mất [supply|E] và cuối cùng bị [attrition|E]."
  game_concept_attrition:0 "Hao tổn"
  game_concept_attrition_desc:1 "[armies|E] có thể bị $game_concept_attrition$, đó là khi [soldiers|E] bị mất do đào ngũ, bệnh tật hoặc chết đói.\n\n$game_concept_attrition$ xảy ra khi Quân đội hết [supplies|E], bao vây [fortified_holding|E], hoặc di chuyển từ [county|E] thù địch này sang vùng thù địch khác nếu vị trí mục tiêu không giáp ranh với $game_concept_county$ đã được kiểm soát."
  game_concept_attrition_i:  "@attrition_icon!"
  game_concept_objectives:0 "Mục tiêu"
  game_concept_objectives_desc:1 "Một số bộ phận nhất định của [realm|E] kẻ thù (thường là [realm_capital|E] và [holdings|E] trong khu vực [war_target|E] của [war|E]) được coi là $game_concept_objectives$. Bởi vì [occupying|E] $game_concept_objectives$, ngài bắt đầu đạt được 'ticking' [war_score|E].\n\nĐối với Bên Phòng thủ, [war_score|E] bắt đầu tăng (sau một khoảng thời gian đầu tiên) nếu Bên Tấn công có thể bị ngăn chặn Chiếm đóng bất kỳ $game_concept_objectives$."
  game_concept_war_contribution:0 "Đóng góp Chiến tranh"
  game_concept_contribution:0 "Đóng góp"
  game_concept_contribute:0 "Đóng góp"
  game_concept_war_contribution_desc:1 "[rulers|E] người đang giúp [allies|E] trong [war|E] nhận được $game_concept_war_contribution$ tùy thuộc vào số lượng và quy mô của [battles|E] mà họ tham gia, cũng như số lượng [holdings|E] họ quản lý để [occupy|E].\n\nSau khi chiến tranh kết thúc, mỗi Cộng tác viên sẽ được thưởng tương ứng với Đóng góp của họ. Chiến lợi phẩm chính xác phụ thuộc vào [casus_belli|E] của cuộc chiến, nhưng thường là [gold|E], [prestige|E] hoặc [piety|E].\n\nLưu ý rằng Đóng góp tăng ngay cả khi thua trận."
  game_concept_scheme_speed:  "Chiều dài Giai đoạn Âm mưu"
  game_concept_scheme_speed_single:  "Chiều dài Giai đoạn"
  game_concept_scheme_speed_i:  "@scheme_phase_duration_icon!"
  game_concept_scheme_speed_desc:  "$game_concept_scheme_speed_single$ đề cập đến số ngày cần thiết để hoàn thành một [scheme_phase|e] duy nhất. Tốc độ bị ảnh hưởng [skill|E], [agents|E], và [spymaster|E] của ngài, cũng như bởi [councillor_task|E] '$task_support_schemes$' nếu Âm mưu là [scheme_hostile|E].\n\n#WEAK Một $game_concept_scheme_speed_single$ thấp hơn sẽ có lợi vì nó sẽ khiến [scheme|e] tiến triển nhanh hơn."
  game_concept_scheme_resistance:0 "Kháng cự Âm mưu"
  game_concept_scheme_resistance_single:0 "Kháng cự"
  game_concept_hostile_scheme_resistance:0 "Kháng cự Âm mưu Thù địch"
  game_concept_scheme_resistance_desc:1 "$game_concept_scheme_resistance$ của một [character|E] làm chậm các $game_concept_schemes$ nhắm vào họ.\n\n[scheme_speed|E] của [scheme_owner|E] bị giảm đi theo giá trị này, làm tăng thời gian cần thiết để $game_concept_scheme$ nhận được [scheme_opportunity_opportunities|E].\n\n#WEAK $game_concept_scheme_resistance$ được tăng lên theo [skill|E] tương ứng của [scheme_target|E] và [spymaster|E] của họ, cũng như theo [councillor_task|E] '$task_disrupt_schemes$' (nếu Âm mưu là [scheme_hostile|E]).#!"
  game_concept_scheme_success_chance:0 "Cơ hội Thành công Âm mưu"
  game_concept_success_chance:0 "Cơ hội Thành công"
  game_concept_success_chance_i:  "@scheme_success_icon!"
  game_concept_scheme_success_chance_desc:0 "$game_concept_success_chance$ của một [scheme|E] xác định khả năng nó thành công khi được thực thi.\n\n$game_concept_success_chance$ của $game_concept_scheme$ sẽ [scheme_growth_grow|E] theo thời gian và dựa trên các [agents|e] đã được chỉ định cũng như [skill|e] liên quan. $game_concept_success_chance$ bị giới hạn bởi [scheme_potential|e]. Không có $game_concept_scheme$ nào có thể vượt quá 95% $game_concept_success_chance$, ngoại trừ [contract_schemes|e].\n\n#WEAK [secret_schemes|e] có nguy cơ bị mục tiêu phát hiện. Nếu điều đó xảy ra $game_concept_success_chance$ của ngài sẽ suy giảm đáng kể. #!"
  game_concept_scheme_growth:  "Tăng trưởng Âm mưu"
  game_concept_success_chance_growth_i:  "@scheme_success_growth_icon!"
  game_concept_scheme_growth_growth:  "Tăng trưởng"
  game_concept_scheme_growth_desc:  "Ở mỗi [scheme_phase_phase|E], [success_chance|E] của một $game_concept_scheme$ tăng theo giá trị này, cho đến khi đạt đến [scheme_potential_potential|E] hiện tại tối đa.\n\n#WEAK Ví dụ, nếu $game_concept_scheme$ hiện có 50% $game_concept_success_chance$, $game_concept_scheme_potential_potential$ là 54%, và $game_concept_scheme_growth_growth$ là 3%, thì sau một $game_concept_scheme_phase_phase$ trôi qua, nó sẽ có 53% $game_concept_success_chance$.\n\nVì $game_concept_scheme_growth_growth$ vẫn bị giới hạn bởi $game_concept_scheme_potential_potential$, sau giai đoạn tiếp theo, $game_concept_scheme$ sẽ chỉ có 54% $game_concept_success_chance$.#!"
  game_concept_scheme_growth_grow:  "tăng trưởng"
  game_concept_scheme_growth_grow_desc:  "$game_concept_scheme_growth_desc$"
  game_concept_scheme_potential:  "Tiềm năng Âm mưu"
  game_concept_scheme_potential_potential:  "Tiềm năng"
  game_concept_success_chance_max_i:  "@scheme_success_max_icon!"
  game_concept_scheme_potential_desc:  "[scheme|e] có một [success_chance|e], giá trị phần trăm quyết định kết quả của nó, nhận được thông qua [scheme_growth|E]. Giá trị này bị giới hạn bởi $game_concept_scheme_potential$, đóng vai trò là giới hạn trên của $game_concept_scheme$.\n\n$game_concept_scheme_potential$ có thể được tăng lên bằng cách thuê các [agents|e] phù hợp, nhưng không bao giờ được vượt quá 95%, ngoại trừ [contract_schemes|e].\n\n#WEAK Các $game_concept_agents$ hài hòa có thể mang lại thêm [modifiers|E] phần thưởng thông qua các sự kiện.\n\n$game_concept_success_chance$ vượt quá $game_concept_scheme_potential_potential$ của $game_concept_scheme$ sẽ bị mất đi.#!"
  game_concept_secrecy:0 "Bí mật"
  game_concept_secrecy_i:  "@scheme_secrecy_icon!"
  game_concept_secrecy_desc:1 "$game_concept_secrecy$ của một [hostile_scheme|e] xác định khả năng nó không bị phát hiện từ mục tiêu [scheme|e].\n\n$game_concept_secrecy$ của một $game_concept_scheme$ sẽ có thời gian miễn nhiễm ban đầu, trong đó nó không thể bị phát hiện. Sau thời gian này, $game_concept_scheme$ sẽ có nguy cơ bị phát hiện hằng tháng thông qua [scheme_breach_short|e]. Các [agents|e] của ngài có thể ảnh hưởng lớn đến khả năng giữ bí mật của $game_concept_scheme$.\n\n#WEAK A $game_concept_scheme$ có $game_concept_secrecy$ là 80% sẽ có 20% khả năng bị phát hiện khi thực thi, và 2% khả năng bị phát hiện mỗi tháng nếu tiếp tục.#!"
  game_concept_secrecy_grace:  "Thời gian Gia hạn"
  game_concept_secrecy_grace_desc.boilerplate:  "Hầu hết các $game_concept_schemes$ đều có thời gian gia hạn khoảng ~[EmptyScope.ScriptValue('secrecy_grace_period_value')] tháng trước khi chúng có thể bị phát hiện hằng tháng."
  game_concept_secrecy_grace_desc:  "$game_concept_secrecy_grace_desc.boilerplate$\n\nSau khi thời gian gia hạn kết thúc, $game_concept_schemes$ có thể bị phát hiện hằng tháng, gây ra [scheme_breach_short|E]. Tỷ lệ này thấp hơn nhiều so với khi âm mưu được thực thi, nhưng được kiểm tra thường xuyên hơn đáng kể."
  game_concept_county_development:0 "Phát triển"
  game_concept_development_i:0 "@development_icon!"
  game_concept_development:0 "Phát triển"
  game_concept_county_development_desc:0 "$game_concept_county_development$ là thước đo cơ sở hạ tầng địa phương và tiến bộ công nghệ ở [county|E].\n\n$game_concept_county_development$ cao hơn làm tăng [levies|E], [taxes|E], và [supply_limit|E] thu được từ $game_concept_county$."
  game_concept_county_development_growth:0 "Tăng trưởng Phát triển"
  game_concept_development_growth:0 "Tăng trưởng Phát triển"
  game_concept_county_development_growth_desc:0 "$game_concept_county_development_growth$ đo lường mức độ [county|E] theo hướng tăng [development|E].\n\nTại 100 $game_concept_county_development_growth$, $game_concept_county_development$ tăng thêm 1."
  game_concept_existing_development:0 "Phát triển Hiện tại"
  game_concept_existing_development_desc:1 "Nhiệm vụ của người quản lý [develop_county|E] bị giảm dần. Càng có nhiều [development|E] [county], thì càng có thêm [development_growth|E] bị hình phạt.\n\nTheo mặc định, [counties] đạt đến mức phạt [existing_development] tối đa là 10 [development|E]. Mỗi [era|E] có một [innovation|E] làm tăng đáng kể giới hạn này, lên đến 90 [development|E] trong $culture_era_late_medieval$ [era].\n\nNhững đổi mới ảnh hưởng đến sửa đổi $game_concept_existing_development$:\n$EFFECT_LIST_BULLET$ $innovation_development_01$\n$EFFECT_LIST_BULLET$ $innovation_development_02$\n$EFFECT_LIST_BULLET$ $innovation_development_03$\n$EFFECT_LIST_BULLET$ $innovation_development_04$"
  game_concept_county_control:0 "Kiểm soát Bá quốc"
  game_concept_control:0 "Kiểm soát"
  game_concept_control_i:0 "@control_icon!"
  game_concept_county_control_desc:0 "$game_concept_county_control$ đo lường mức độ kiểm soát của chính phủ đối với dân số của một [county|E]. Điều này rất quan trọng, đặc biệt là để thu [taxes|E] từ các [holdings|E].\n\nKhi một Hạt đổi chủ thông qua [war|E], Kiểm soát sẽ giảm đáng kể, đây là lý do chính đáng để phong chư hầu cho [holder|E] hiện tại thay vào đó (nếu [casus_belli|E] cho phép). Kiểm soát Hạt cũng có thể bị hư hại bởi các cuộc [sieges|E] và [Concept( 'peasant_faction', 'Cuộc nổi dậy của Nông dân' )|E].\n\nKiểm soát thấp có thể dẫn đến [county_corruption|E], và cách chính để tăng Kiểm soát là [councillor_task|E] khả dụng cho [marshal|E] của bạn."
  game_concept_absolute_control:0 "Kiểm soát Tuyệt đối"
  game_concept_absolute_control_short:  "Tuyệt đối"
  game_concept_absolute_control_desc:1 "$game_concept_absolute_control$ là trạng thái đặc biệt của [control|E] được kích hoạt bởi [perk|E] $absolute_control_perk_name$, biểu thị rằng kẻ thống trị có một bàn tay sắt đối với dân chúng.\n\nBất cứ khi nào $game_concept_control$ ở mức #V 100#!, thay vào đó, nó sẽ hiển thị dưới dạng '$ABSOLUTE_COUNTY_CONTROL$' và cung cấp thêm tiền thưởng cho [taxes|E] và [levies|E]."
  game_concept_county_corruption:0 "Tham nhũng Bá quốc"
  game_concept_county_corruption_desc:0 "Khi [county|E] có [control|E] thấp hoặc [holder|E] của nó đang [debt|E], Bá quốc có thể nhận được $game_concept_county_corruption$. Đây là nhiều loại [county_modifiers|E].\n\n$game_concept_county_corruption$ sẽ phai mờ dần theo thời gian, nhưng nếu nguyên nhân gốc rễ vẫn còn ([debt|E] hoặc [control|E] thấp), nó có thể xuất hiện lại.\n\n$task_increase_control$ $game_concept_councillor_task$ của $councillor_marshal$ có thể xóa bỏ $game_concept_county_corruption$ nhanh hơn."
  game_concept_county_modifier:0 "Sửa đổi Bá quốc"
  game_concept_county_modifiers:0 "Sửa đổi Bá quốc"
  game_concept_county_modifier_desc:1 "$game_concept_county_modifiers$ là các sửa đổi ảnh hưởng đến các giá trị khác nhau của [county|E].\n\n[baronies|E] có thể có các sửa đổi của riêng mình và chúng có thể được xem trong [holdings|E] của $game_concept_county$."
  game_concept_fleet:0 "Hạm đội"
  game_concept_fleets:0 "Hạm đội"
  game_concept_fleet_desc:1 "[armies|E] di chuyển vào Vùng biển sẽ tự động [embark|E] lên $game_concept_fleet$. [embarking] tốn một khoản tiền [gold|E], tượng trưng cho việc mua sắm và đóng tàu.\n\nKhi ở trên $game_concept_fleet$, [armies] sẽ có thể băng qua mặt nước với tốc độ nhanh, mặc dù chúng sẽ có tốn thêm #V 25%#! bảo trì nhiều hơn và sẽ bắt đầu mất [supplies|E] sau #V [GetDefine('NFleet', 'ATTRITION_AFTER_DAYS')|0]#! ngày trên biển.\n\n$game_concept_fleets$ không tham gia lẫn nhau trong [battles|E].\n\nKhi $game_concept_army$ đổ bộ, $game_concept_fleet$ sẽ biến mất và $game_concept_army$ sẽ trở thành [recently_disembarked|E]."
  game_concept_domain_income:0 "Thu nhập Lãnh địa"
  game_concept_domain_taxes:0 "Thuế Lãnh địa"
  game_concept_domain_income_desc:1 "$game_concept_domain_income$ của ngài bao gồm [taxes|E] mà ngài thu từ [domain|E] của riêng ngài. Số tiền thu được tùy thuộc vào cấp độ [control|E] và [development|E] địa phương."
  game_concept_vassal_taxes:0 "Thuế Chư hầu"
  game_concept_vassal_taxes_desc:1 "$game_concept_vassal_taxes$ của ngài bao gồm [taxes|E] mà ngài nhận được từ [vassals|E] của ngài. Số tiền này tùy thuộc vào [obligations|E] của mỗi Chư hầu.\n\nTừ quan điểm của các Chư hầu của ngài, những loại thuế tương tự này được gọi là [liege_taxes|E] để phân biệt với bất kỳ $game_concept_vassal_taxes$ nào họ thu được từ $game_concept_vassals$ của riêng mình."
  game_concept_tributary_taxes:  "Thuế Triều cống"
  game_concept_tributary_taxes_desc:  "$game_concept_tributary_taxes$ của ngài bao gồm [taxes|E] mà ngài nhận được từ [tributaries|E] của mình. Số tiền phụ thuộc vào [obligations|E] của mỗi Chi nhánh.\n\nTheo quan điểm của các nhân vật Triều cống, những loại thuế tương tự này được gọi là [suzerain_taxes|E] để phân biệt chúng với bất kỳ $game_concept_tributary_taxes$ nào mà họ thu được từ $game_concept_tributaries$ của riêng mình."
  game_concept_liege_taxes:0 "Thuế Lãnh chúa"
  game_concept_liege_taxes_desc:1 "$game_concept_liege_taxes$ của ngài là [taxes|E] mà ngài phải trả cho [liege|E] của ngài như một phần của [obligations|E] của ngài. Ngài không phải trả bất kỳ $game_concept_liege_taxes$ nào nếu ngài [independent|E].\n\nTừ quan điểm của Lãnh chúa, những loại thuế tương tự này được gọi là [vassal_taxes|E] để phân biệt với bất kỳ khoản thuế nào mà họ có thể phải trả đối với $game_concept_liege$ của riêng mình."
  game_concept_suzerain_taxes:  "Thuế Bá chủ"
  game_concept_suzerain_taxes_desc:  "$game_concept_suzerain_taxes$ của ngài là [taxes|E] mà ngài phải trả cho [suzerain|E] của mình như là một phần trong [obligations|E].\n\nTheo quan điểm của [suzerain|E], những loại thuế tương tự này được gọi là [tributary_taxes|E] để phân biệt chúng với bất kỳ loại thuế nào mà họ có thể mắc nợ $game_concept_suzerain$ của riêng mình."
  game_concept_usurp_title:0 "Chiếm đoạt Tước vị"
  game_concept_usurp:0 "Chiếm đoạt"
  game_concept_usurped:0 "Chiếm đoạt"
  game_concept_usurpation:0 "Chiếm đoạt"
  game_concept_usurp_title_desc:1 "[title|E] nắm giữ bởi [ruler|E] ngoại quốc thường có thể bị chiếm đoạt nếu hơn #V 50%#! trong số [counties|E] [de_jure|E] của nó nằm trong [realm|E] của ngài. Quá trình này mang lại [title|E] cho ngài, điều này đặc biệt quan trọng để đảm bảo ngài là [rightful_liege|E] trong số [vassals|E] của ngài.\n\nViệc lật đổ khó khăn hơn nếu [faith|E] của chủ sở hữu hiện tại là thù địch với của ngài; trong trường hợp này chỉ có thể chiếm đoạt nếu người nắm giữ không còn sở hữu bất kỳ [counties|E] [de_jure|E] nào bên trong Quốc gia của mình."
  game_concept_close_family:0 "Gia đình Ruột thịt"
  game_concept_close_family_members:0 "Thành viên Gia đình Ruột thịt"
  game_concept_close_family_member:0 "Thành viên Gia đình Ruột thịt"
  game_concept_close_family_desc:0 "Gia đình Ruột thịt của nhân vật bao gồm:\n$BULLET_WITH_TAB$Cha mẹ\n$BULLET_WITH_TAB$Ông bà\n$BULLET_WITH_TAB$Con cái\n$BULLET_WITH_TAB$Cháu\n$BULLET_WITH_TAB$Anh chị em ruột"
  game_concept_extended_family:0 "Gia đình Mở rộng"
  game_concept_extended_family_members:0 "Thành viên Gia đình Mở rộng"
  game_concept_extended_family_desc:0 "Gia đình Mở rộng của nhân vật bao gồm:\n$BULLET_WITH_TAB$Anh chị em họ\n$BULLET_WITH_TAB$Chú\n$BULLET_WITH_TAB$Cô\n$BULLET_WITH_TAB$Cháu trai\n$BULLET_WITH_TAB$Cháu gái"
  game_concept_family:0 "Gia đình"
  game_concept_family_members:0 "Thành viên Gia đình"
  game_concept_family_member:0 "Thành viên Gia đình"
  game_concept_family_desc:0 "Gia đình của một nhân vật bao gồm [close_family_members|E] và [extended_family_members|E] của họ."
  game_concept_kinslayer:0 "Kẻ giết người thân"
  game_concept_kinslayers:0 "Kẻ giết người thân"
  game_concept_kinslaying:0 "Kinslaying"
  game_concept_kinslaying_desc:0 "Kinslayer là một Nhân vật được biết đến là đã giết [family_member|E]. Một số [faiths|E] xem kinslaying là [criminal|E].\n\nBa đặc điểm Kinslaying là:\n$BULLET_WITH_TAB$[GetTrait('kinslayer_3').GetName( GetNullCharacter )] — Dành cho những kẻ giết [close_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_2').GetName( GetNullCharacter )] — Dành cho những kẻ giết [extended_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_1').GetName( GetNullCharacter )] — Dành cho những kẻ giết thành viên [dynasty|E] của họ"
  game_concept_gender_law:0 "Luật Giới tính"
  game_concept_gender_laws:0 "Luật Giới tính"
  game_concept_gender_law_desc:0 "Mỗi [ruler|E] đều có Luật giới tính chính xác định [titles|E] của họ có thể truyền lại [succession|E]. Luật Giới tính cũng ảnh hưởng đến việc ai có thể chỉ huy [armies|E] và tính đủ điều kiện của việc có nhiều [spouses|E] hoặc [concubines|E].\n\nLuật Giới tính khả dụng phụ thuộc vào 'Quan điểm Giới tính' [doctrine|E] [faith|E]."
  game_concept_depose:0 "Phế truất"
  game_concept_deposed:0 "Phế truất"
  game_concept_depose_desc:0 "[rulers|E] có thể bị Phế truất do yêu cầu của [faction|E] hoặc các sự kiện đặc biệt. [heirs|E] của họ sẽ kế thừa [titles|E] của họ mặc dù nhà cai trị cũ vẫn còn sống."
  game_concept_virtue:0 "Đạo đức"
  game_concept_virtues:0 "Đạo đức"
  game_concept_virtuous:0 "Đạo đức"
  game_concept_virtue_desc:1 "Mỗi [faith|E] đều coi một số [traits|E] là Đạo đức. Nhân vật có những Đặc điểm này nhận được phần thưởng [opinion|E] từ tất cả các nhân vật coi những đặc điểm đó là Đạo đức, ngay cả khi họ không có cùng Đức tin. Ngoài ra , Những nhân vật có Đặc điểm mà Đức tin của họ cho là Đạo đức sẽ nhận được phần thưởng [piety|E] mỗi tháng.\n\nChính xác thì những đặc điểm nào được coi là Đạo đức thay đổi từ Đức tin sang Đức tin, nhưng thường được xác định bởi sự kết hợp của [core_tenets|E] của Đức tin đó và [religion|E] mà Đức tin thuộc về."
  game_concept_sin:0 "Tội lỗi"
  game_concept_sins:0 "Tội lỗi"
  game_concept_sinful:0 "Tội lỗi"
  game_concept_sin_desc:1 "Mỗi [faith|E] đều coi một số [traits|E] nhất định là Tội lỗi. Những nhân vật có những đặc điểm này phải chịu hình phạt [opinion|E] từ tất cả những nhân vật coi những đặc điểm đó là Tội lỗi, ngay cả khi họ không có cùng Đức tin. Ngoài ra , Những nhân vật có Đặc điểm mà Đức tin của chính họ coi là Tội lỗi sẽ mất [piety|E] mỗi tháng.\n\nChính xác thì những đặc điểm nào được coi là Tội lỗi thay đổi từ Đức tin sang Đức tin, nhưng thường được xác định bởi sự kết hợp của [core_tenets|E] và [religion|E] mà Đức tin thuộc về."
  game_concept_excommunicate:0 "Vạ Tuyệt Thông"
  game_concept_excommunicated:0 "Vạ Tuyệt Thông"
  game_concept_excommunication:0 "Vạ Tuyệt Thông"
  game_concept_excommunication_desc:0 "Các nhân vật bị [GetTrait('excommunicated').GetName( GetNullCharacter )] bởi [head_of_faith|E] của họ bị xem như là [criminals|E] bởi các nhân vật khác thuộc về [faith|E] của họ.\n\n[rulers|E] [independent|E] người đã bị [GetTrait('excommunicated').GetName( GetNullCharacter )] có thể bị tuyên bố [excommunication_war|E] đối với họ.\n\nVạ Tuyệt Thông có thể được xóa bỏ bằng cách cầu xin [head_of_faith|E] tha thứ hoặc bằng cách chuyển sang một [faith|E] khác."
  game_concept_legalism:0 "Chủ nghĩa Hợp pháp"
  game_concept_legalistic:0 "Chủ nghĩa Hợp pháp"
  game_concept_legalism_desc:1 "[core_tenet|E] nhấn mạnh thực hành pháp lý và truyền thống trong thần học và sự sùng đạo. Nó ảnh hưởng đến chi phí luật pháp và tư cách thành viên [faction|E] [vassal|E] dựa trên số lượng [sins|E] hoặc [virtues|E] [ruler|E] có."
  game_concept_dynasty_prestige_level_0:0 "Cội rễ"
  game_concept_dynasty_prestige_level_1:0 "Ít biết đến"
  game_concept_dynasty_prestige_level_2:0 "Tầm thường"
  game_concept_dynasty_prestige_level_3:0 "Đáng chú ý"
  game_concept_dynasty_prestige_level_4:0 "Đáng tin"
  game_concept_dynasty_prestige_level_5:0 "Nổi tiếng"
  game_concept_dynasty_prestige_level_6:0 "Đáng kể"
  game_concept_dynasty_prestige_level_7:0 "Nổi tiếng"
  game_concept_dynasty_prestige_level_8:0 "Vinh quang"
  game_concept_dynasty_prestige_level_9:0 "Hoang đường"
  game_concept_dynasty_prestige_level_10:0 "Huyền thoại"
  game_concept_dynasty_prestige_level_0_desc:0 "#T $game_concept_dynasty_prestige_level_0$#!\n[GetDynastyPrestigeLevelEffect('(int32)0')][GetDynastyPrestigeLevelNext('(int32)0')]"
  game_concept_dynasty_prestige_level_1_desc:0 "#T $game_concept_dynasty_prestige_level_1$#!\n[GetDynastyPrestigeLevelEffect('(int32)1')][GetDynastyPrestigeLevelNext('(int32)1')]"
  game_concept_dynasty_prestige_level_2_desc:0 "#T $game_concept_dynasty_prestige_level_2$#!\n[GetDynastyPrestigeLevelEffect('(int32)2')][GetDynastyPrestigeLevelNext('(int32)2')]"
  game_concept_dynasty_prestige_level_3_desc:0 "#T $game_concept_dynasty_prestige_level_3$#!\n[GetDynastyPrestigeLevelEffect('(int32)3')][GetDynastyPrestigeLevelNext('(int32)3')]"
  game_concept_dynasty_prestige_level_4_desc:0 "#T $game_concept_dynasty_prestige_level_4$#!\n[GetDynastyPrestigeLevelEffect('(int32)4')][GetDynastyPrestigeLevelNext('(int32)4')]"
  game_concept_dynasty_prestige_level_5_desc:0 "#T $game_concept_dynasty_prestige_level_5$#!\n[GetDynastyPrestigeLevelEffect('(int32)5')][GetDynastyPrestigeLevelNext('(int32)5')]"
  game_concept_dynasty_prestige_level_6_desc:0 "#T $game_concept_dynasty_prestige_level_6$#!\n[GetDynastyPrestigeLevelEffect('(int32)6')][GetDynastyPrestigeLevelNext('(int32)6')]"
  game_concept_dynasty_prestige_level_7_desc:0 "#T $game_concept_dynasty_prestige_level_7$#!\n[GetDynastyPrestigeLevelEffect('(int32)7')][GetDynastyPrestigeLevelNext('(int32)7')]"
  game_concept_dynasty_prestige_level_8_desc:0 "#T $game_concept_dynasty_prestige_level_8$#!\n[GetDynastyPrestigeLevelEffect('(int32)8')][GetDynastyPrestigeLevelNext('(int32)8')]"
  game_concept_dynasty_prestige_level_9_desc:0 "#T $game_concept_dynasty_prestige_level_9$#!\n[GetDynastyPrestigeLevelEffect('(int32)9')][GetDynastyPrestigeLevelNext('(int32)9')]"
  game_concept_dynasty_prestige_level_10_desc:0 "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\nĐây là Cấp độ Uy danh cao nhất."
  game_concept_excommunication_war:0 "Chiến tranh Vạ Tuyệt thông"
  game_concept_excommunicated_ruler:0 "Nhà cai trị Vạ tuyệt thông"
  game_concept_excommunicated_ruler_desc:1 "Trong Chiến tranh Vạ Tuyệt thông, những kẻ tấn công đang chiến đấu để loại bỏ một nhà cai trị [excommunicated|E] khỏi quyền lực.\n\nNếu chiến thắng, những kẻ tấn công sẽ nhận được một lượng lớn [piety|E] và sự chấp thuận của [head_of_faith|E] của họ, trong khi nhà cai trị bị Vạ Tuyệt Thông buộc phải thoái vị cho [heir|E].\n\nTuy nhiên, nếu người cai trị bị Vạ Tuyệt Thông chiến thắng, [head_of_faith|E] của họ buộc phải thu hồi Vạ Tuyệt Thông, vì họ đã chứng minh sự đúng đắn của mình trên chiến trường."
  game_concept_holy_site:0 "Thánh Địa"
  game_concept_holy_sites:0 "Thánh Địa"
  game_concept_holy_site_desc:1 "$game_concept_holy_site$ là [county|E] chứa một địa điểm có ý nghĩa tôn giáo đối với [faith|E]. $game_concept_holy_sites$ do một Nhân vật có đức tin chính xác nắm giữ sẽ mang lại hiệu quả cho tất cả mọi người theo Đức tin đó và có thể cũng cho phép tạo [special_buildings|E] hoặc [holy_orders|E]. Mỗi Đức tin có một nhóm $game_concept_holy_sites$ khác nhau."
  game_concept_cultural_acceptance_i:0 "@cultural_acceptance_icon!"
  game_concept_cultural_acceptance:0 "Chấp nhận Văn hóa"
  game_concept_cultural_acceptance_desc:2 "Chấp nhận Văn hóa đo lường mức độ chấp nhận hai [cultures|E] với nhau.\n\nVề cơ bản, nó ảnh hưởng đến mức độ giảm [opinion|E] giữa các Nhân vật thuộc các nền Văn hóa khác nhau. Nó cũng ảnh hưởng đến [county_opinion|E], và chi phí thành lập một [hybrid_culture|E].\n\nChấp nhận Văn hóa có thể thay đổi từ nhiều hành động, đáng chú ý nhất là [wars|E], ban và thu hồi [titles|E], và [councillor_task|E] [accept_culture|E].\n\nTheo thời gian, Chấp nhận Văn hóa sẽ trở về [cultural_acceptance_baseline|E] nếu vượt quá."
  game_concept_cultural_acceptance_baseline:0 "Giá trị Cơ sở Chấp nhận Văn hóa"
  game_concept_cultural_acceptance_baseline_desc:1 "[cultural_acceptance|E] có một giá trị cơ sở mà nó sẽ giảm dần nếu vượt quá. Giá trị cơ sở phụ thuộc vào:\n$EFFECT_LIST_BULLET$[heritage|E] chung\n$EFFECT_LIST_BULLET$[language|E] chung\n$EFFECT_LIST_BULLET$[faith|E] và [religion|E] chung, đặc biệt nếu là [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] hoặc [GetReligionFamily('rf_eastern').GetName]\n$EFFECT_LIST_BULLET$[ethos|E] chung trong cùng một [region|E]"
  game_concept_culture_pillar:0 "Trụ cột Văn hóa"
  game_concept_culture_pillars:0 "Trụ cột Văn hóa"
  game_concept_culture_pillar_desc:1 "[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_pillar_desc_REFORM_DLC', 'game_concept_culture_pillar_desc_NO_REFORM_DLC' )]"
  game_concept_culture_pillar_desc_REFORM_DLC:0 "Trụ cột là những phẩm chất phản ánh nguồn gốc của một [culture|E].\n\nCó 5 Trụ cột Văn hóa riêng biệt:\n$EFFECT_LIST_BULLET$[ethos|E]\n$EFFECT_LIST_BULLET$[heritage|E]\n$EFFECT_LIST_BULLET$[language|E]\n$EFFECT_LIST_BULLET$[martial_custom|E]\n$EFFECT_LIST_BULLET$Mỹ học\n\nTrong số này,[ethos|E] , [language|E] và [martial_custom|E] có thể được thay đổi bởi [culture_head|E] thông qua [reformation|E]."
  game_concept_culture_pillar_desc_NO_REFORM_DLC:0 "Trụ cột là những phẩm chất không thể thay đổi phản ánh nguồn gốc của một [culture|E].\n\nCó 5 Trụ cột Văn hóa riêng biệt:\n$EFFECT_LIST_BULLET$[ethos|E]\n$EFFECT_LIST_BULLET$[heritage|E]\n$EFFECT_LIST_BULLET$[language|E]\n$EFFECT_LIST_BULLET$[martial_custom|E]\n$EFFECT_LIST_BULLET$Mỹ học"
  game_concept_culture_tradition:0 "Truyền thống Văn hóa"
  game_concept_culture_traditions:0 "Truyền thống Văn hóa"
  game_concept_tradition:0 "Truyền thống"
  game_concept_traditions:0 "Truyền thống"
  game_concept_culture_tradition_desc:2 "Truyền thống đại diện cho các thực hành, thói quen, giá trị và đạo đức của mỗi nền [cultures|E] riêng biệt.\n\nMỗi Truyền thống đem lại một số loại phần thưởng hoặc khả năng đặc biệt cho [characters|E] hoặc [counties|E] của nền Văn hóa đó.\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_tradition_desc_REFORM_DLC', 'game_concept_culture_tradition_desc_NO_REFORM_DLC' )]\n\n$game_concept_cultures$ có thể có tối đa 6 Truyền thống, nhưng hầu hết có ít hơn."
  game_concept_culture_tradition_desc_REFORM_DLC:0 "[culture_head|E] có thể thiết lập các Truyền thống mới hoặc thay thế các Truyền thống hiện có cho một Văn hóa thông qua [reformation|E]."
  game_concept_culture_tradition_desc_NO_REFORM_DLC:0 "[culture_head|E] có thể thiết lập các Truyền thống mới cho một nền Văn hóa, với chi phí phải trả là [prestige|E]."

  game_concept_ethos:0 "Đặc tính"
  game_concept_ethos_desc:2 "Đặc tính của một [culture|E] xác định các giá trị cốt lõi, các nguyên tắc chỉ đạo và thái độ của các thành viên đối với đời sống nói chung.\n\nNgoài ra, các Đặc tính ảnh hưởng rất nhiều đến chi phí cho một [culture_head|E] thiết lập các [traditions|E] mới.[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_ethos_desc_REFORM_DLC', '' )]"
  game_concept_ethos_desc_REFORM_DLC:0 "\n\n[culture_head|E] có thể thay thế $game_concept_ethos$ thông qua [reformation|E]."
  game_concept_language:0 "Ngôn ngữ"
  game_concept_languages:0 "Ngôn ngữ"
  game_concept_language_desc:3 "Ngôn ngữ là [culture_pillar|E] xác định ngôn ngữ mà dân chúng nói chung của một nền [culture|E] nói. $game_concept_cultures$ nói cùng một ngôn ngữ sẽ nhận được phần thưởng vĩnh viễn với [cultural_acceptance_baseline|E] của họ.\n\nMột [character|E] có thể biết một hoặc nhiều Ngôn ngữ. Biết một ngôn ngữ sẽ cắt giảm hình phạt [opinion|E] [cultural_acceptance|E] còn một nửa đối với các Nhân vật và [counties|E] nói ngôn ngữ đó. Nó cũng ngăn cản [faction_independence|E] và [claimant_factions|E].\n\nCác Nhân vật có thể học thêm các ngôn ngữ khác bằng cách sử dụng [scheme|E] [GetScheme('learn_language').GetTypeName]. Các Nhân vật có thể thoải mái học ngôn ngữ tối đa [language_limit|E] của họ."
  game_concept_language_limit:1 "Giới hạn Ngoại ngữ"
  game_concept_language_limit_desc:1 "Ngài chỉ có thể ghi nhớ một cách thoải mái một số lượng [languages|E] nhất định. Nếu vượt quá giới hạn này, ngài sẽ phải quên đi một Ngôn ngữ hoặc bị [stress|E].\n\nNgôn ngữ được sử dụng bởi [culture|E] của ngài không được tính vào giới hạn này.\n\nGiới hạn được xác định bởi:\n$EFFECT_LIST_BULLET$Mọi người đều có Cơ sở #V 1#!\n$EFFECT_LIST_BULLET$Mỗi [EmptyScope.ScriptValue('language_learning_divide_value')|V0] điểm [learning_i][learning|E] tăng nó thêm #V 1#!\n$EFFECT_LIST_BULLET$[perk|E] [GetPerk('open_minded_perk').GetName(GetNullCharacter)] tăng nó thêm #V 2#!\n$EFFECT_LIST_BULLET$[perk|E] [GetPerk('smooth_operator_perk').GetName(GetNullCharacter)] tăng nó thêm #V 1#!\n$EFFECT_LIST_BULLET$[dynasty_perk|E] [GetDynastyPerk('ep1_culture_legacy_1').GetName] tăng nó thêm #V 1#!"
  game_concept_heritage:0 "Di sản"
  game_concept_heritage_desc:0 "Di sản là một [culture_pillar|E] đại diện cho tổ tiên chung của một số [cultures|E].\n\nCác nền văn hóa cùng Di sản thường có [Concept( 'cultural_acceptance', 'Chấp nhận' )|E] lẫn nhau cao."
  game_concept_martial_custom:0 "Tập quán Quân sự"
  game_concept_martial_custom_desc:1 "Tập quán Quân sự là một [culture_pillar|E] xác định giới tính nào có thể hoạt động như [commanders|E] hoặc [knights|E].\n\nMột số [traditions|E] và [doctrines|E] có thể sửa đổi các quy tắc này cho các [characters|E] nhất định."
  game_concept_culture_intermingling:0 "Giao thoa Văn hóa"
  game_concept_culture_intermingling_desc:1 "Càng có nhiều hơn hai [cultures|E] cùng tồn tại trong cùng một [realm|E], thì sự giao thoa sẽ xảy ra nhiều hơn và các Văn hóa sẽ gia tăng sự [cultural_acceptance|E] của họ."
  game_concept_cultural_head:0 "Lãnh đạo Văn hóa"
  game_concept_culture_head:1 "Lãnh đạo Văn hóa"
  game_concept_culture_head_desc:3 "$game_concept_culture_head$' là [ruler|E] có ảnh hưởng lớn nhất đối với [culture|E] chính của họ.\n\nCụ thể, nhà cai trị có tổng số [counties|E] cùng văn hóa lớn nhất trong [realm|E] sẽ trở thành $game_concept_cultural_head$, bất kể [domain|E] của họ ở đâu hoặc những Bá quốc có nền văn hóa khác mà họ có thể sở hữu.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\n$game_concept_cultural_head$ có thể ảnh hưởng đến việc [innovation|E] nào nên được ưu tiên khám phá bằng cách thiết lập [cultural_fascination|E].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
  game_concept_culture_head_desc_NOMAD_DLC:  "\n\n[rulers|E] [nomadic|E], tuy nhiên, sẽ chọn $game_concept_cultural_head$ của họ dựa trên người có [herd|E] lớn nhất, bất kể cấp bậc. Trong trường hợp những nhà cai trị định cư là một phần của cùng [culture|E] với những người du mục, [military_power|E] sẽ là yếu tố quyết định."
  game_concept_culture_head_desc_REFORM_DLC:0 "$game_concept_culture_head$ cũng có thể [reform|E] các phần trong Văn hóa của họ."
  game_concept_culture_head_desc_NO_REFORM_DLC:0 "$game_concept_culture_head$ cũng có thể thiết lập [traditions|E] mới cho Văn hóa của họ."
  game_concept_county_opinion:0 "Quan điểm Nhân dân"
  game_concept_county_opinion_desc:3 "Dân chúng nói chung của mỗi [county|E] có [opinion|E] về [character|E], người nắm giữ $game_concept_county$. Nếu dân chúng không hài lòng, họ có thể bắt đầu hoặc tham gia [peasant_faction|E] hoặc [popular_faction|E], một trong hai yếu tố này có thể sớm lan rộng ra toàn bộ [realm|E] vương quốc.\n\nCách dễ nhất để kiểm soát $game_concept_county_opinion$ là đảm bảo rằng [holder|E] $game_concept_county$ có cùng [culture|E] và [faith|E] với dân chúng.\n\n$game_concept_county_opinion$ từ việc có khác biệt [faith|E] đã được sửa đổi bởi cả [faith_hostility|E] và [fervor|E] của bá quốc, mở rộng quy mô tuyến tính $game_concept_fervor$ từ 0 đến 100."
  game_concept_core_tenet:1 "Nguyên lý"
  game_concept_core_tenet_desc:1 "Trong khi [doctrines|E] đại diện cho các vấn đề mà [faith|E] phải có lập trường, thì $game_concept_core_tenets$ đại diện cho các hành vi và nghi thức độc đáo của Đức tin."
  game_concept_core_tenets:1 "Nguyên lý"
  game_concept_holy_war:0 "Thánh Chiến"
  game_concept_holy_wars:0 "Thánh Chiến"
  game_concept_holy_war_holy:0 "Thần thánh"
  game_concept_holy_war_desc:4 "$game_concept_holy_war$ là một loại hình [war|E] đặc biệt được phát động bởi [ruler|E] của một [faith|E] chống lại một Nhà cai trị của một Đức tin khác.\n\n$game_concept_holy_war$ thường mang tính hủy diệt, với người chiến thắng Thánh Chiến thường chiếm giữ tất cả [counties|E] trong khu vực được nhắm mục tiêu cho mình. Tuy nhiên, nếu Đức tin bên tấn công là [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] hoặc bên phòng thủ có các [vassals|E] của Đức tin của chính bên tấn công trong khu vực được nhắm mục tiêu, một số hoặc tất cả các Nhà cai trị Chư hầu trong khu vực được nhắm mục tiêu thay vào đó có thể được chuyển giao cho bên tấn công.\n\nKhông giống như các cuộc chiến tranh khác, những Nhà cai trị cùng Đức tin mục tiêu có thể chọn tham gia phòng thủ của họ mà không cần [alliance|E].\n\nThánh Chiến có thể được cho phép hoặc hạn chế tùy thuộc vào [religious_families|E] khác nhau"
  game_concept_great_holy_war:0 "Đại Thánh Chiến"
  game_concept_great_holy_wars:0 "Đại Thánh Chiến"
  game_concept_great_holy_war_desc:3 "$game_concept_great_holy_war$ là một kiểu [war|E] đặc biệt mà chỉ [head_of_faith|E] của một số [faiths|E] mới có thể tuyên bố, với mục tiêu đưa toàn bộ [kingdom|E] dưới sự thống trị Đức tin của họ.\n\n$game_concept_great_holy_wars$ nhắm mục tiêu tất cả [rulers|E] của [religion|E] khác trong [kingdom|E] đã chọn, buộc họ phải cùng nhau bảo vệ. Nếu chiến thắng, tất cả [titles|E] trong Vương quốc mục tiêu sẽ bị chiếm giữ và phân chia giữa những kẻ tấn công.\n\nTùy thuộc vào [doctrines|E] của nó, một Đức tin có thể có quyền sử dụng [directed_great_holy_wars|E], [undirected_great_holy_wars|E] hoặc hoàn toàn không có $game_concept_great_holy_wars$:\n$EFFECT_LIST_BULLET$[core_tenets|E] [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName], hoặc [GetFaithDoctrine('tenet_warmonger').GetBaseName] có quyền sử dụng các cuộc Đại Thánh Chiến Vô hướng\n$EFFECT_LIST_BULLET$Đức tin với Lãnh đạo [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] chỉ có quyền sử dụng Đại Thánh Chiến Định hướng\n$EFFECT_LIST_BULLET$Đức tin với Lãnh đạo [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] chỉ có quyền sử dụng Đại Thánh Chiến Vô hướng\n$EFFECT_LIST_BULLET$Đức tin có Lãnh đạo Đức tin không thể tuyên bố bất kỳ cuộc Đại Thánh Chiến nào, ngay cả khi họ thường đủ điều kiện\n\nSMột số Đức tin có tên đặc biệt cho các cuộc Đại Thánh chiến của họ như 'Crusader' (Thập Tự Chinh) hoặc 'Jihad'. Những cuộc Đại Thánh Chiến này chỉ khác nhau về tên gọi và hoạt động như bất kỳ cuộc Đại Thánh Chiến nào khác."
  game_concept_directed_great_holy_war:0 "Đại Thánh Chiến Định hướng"
  game_concept_directed_great_holy_wars:0 "Đại Thánh Chiến Định hướng"
  game_concept_directed_great_holy_war_desc:0 "A $game_concept_directed_great_holy_war$ được tuyên bố bởi [head_of_faith|E] $doctrine_temporal_head_name$ với ý định đưa một [kingdom|E] dưới quyền cai trị của riêng họ.\n\n[rulers|E] [faith|E] của họ có thể chọn hỗ trợ Lãnh đạo Đức tin và có thể nhận được phần thưởng khi làm như vậy. Phần thưởng bao gồm [piety|E] và có khả năng [dynasty|E] của họ trở thành [landed|E] trong Vương quốc bị chinh phục.\n\nNhà cai trị [religion|E] mục tiêu có thể chọn chống lại cuộc chiến này mà không cần [alliance|E]."
  game_concept_undirected_great_holy_war:0 "Đại Thánh Chiến Vô hướng"
  game_concept_undirected_great_holy_wars:0 "Đại Thánh Chiến Vô hướng"
  game_concept_undirected_great_holy_war_desc:0 "$game_concept_undirected_great_holy_war$ được tuyên bố bởi [head_of_faith|E] $doctrine_spiritual_head_name$ với ý định mang một [kingdom|E] dưới sự cai trị của [faith|E] của họ.\n\n$game_concept_undirected_great_holy_wars$ không được bắt đầu ngay lập tức , thay vào đó, họ vào [preparation_phase|E].\n\nTrước và trong chiến tranh, những người cai trị Đức tin tấn công có thể chọn tặng [gold|E] cho [war_chest|E].\n\nNếu chiến thắng, Vương quốc mục tiêu sẽ bị chiếm đóng và trao cho một nhân vật của Đức tin tấn công. Phần thưởng cho những kẻ tấn công bao gồm [piety|E] và có khả năng [dynasty|E] của họ trở thành [landed|E] trong Vương quốc bị chinh phục."
  game_concept_preparation_phase:0 "Giai đoạn Chuẩn bị"
  game_concept_preparation_phase_desc:1 "$game_concept_preparation_phase$ là thời điểm trước khi [undirected_great_holy_war|E] được tuyên bố.\n\nTrong thời gian này, các [rulers|E] của [faith|E] tấn công có thể chọn cam kết hỗ trợ quân sự cho cuộc chiến và/hoặc quyên góp cho [war_chest|E].\n\nMột bộ đếm thời gian sẽ đếm ngược cho đến khi $game_concept_preparation_phase$ kết thúc, khi đó cuộc chiến sẽ được tuyên bố.\n\nNhững nhà cai trị [religions|E] bảo vệ có thể chọn chống lại quân đội của họ hỗ trợ trong thời gian này, đánh giá khái quát thế mạnh của hai bên."
  game_concept_war_chest:0 "Kho bạc Chiến tranh"
  game_concept_war_chest_desc:1 "$game_concept_war_chest$ là tập hợp [gold|E], [piety|E] và [prestige|E]. Nội dung chủ yếu được sử dụng làm phần thưởng khi giành chiến thắng thành công [undirected_great_holy_wars|E], nơi chúng được chia cho những kẻ tấn công dựa trên sự tham gia của họ vào [war|E].\n\nMột phần nhất định của $game_concept_war_chest$ cũng được chia cho những kẻ tấn công khi Chiến tranh được tuyên bố.\n\nNếu một [undirected_great_holy_war|E] bị đánh bại, những người bảo vệ sẽ chia phần Đạo đức và Uy tín của $game_concept_war_chest$ between them #weak (Vàng bị mất.)#!"
  game_concept_crusade:0 "Thập Tự Chinh"
  game_concept_great_holy_war_undirected:0 "Vô hướng"
  game_concept_crusades:0 "Thập Tự Chinh"
  game_concept_jihad:0 "Jihad"
  game_concept_great_holy_war_directed:0 "Chỉ đạo"
  game_concept_jihads:0 "Jihad"
  game_concept_title_tier:0 "Cấp bậc"
  game_concept_title_tiers:0 "Cấp bậc"
  game_concept_rank:0 "Xếp hạng"
  game_concept_title_rank:1 "Xếp hạng"
  game_concept_title_ranks:0 "Xếp hạng"
  game_concept_ranks:0 "Xếp hạng"
  game_concept_title_tier_desc:  "Đất đai tương đương với [rank|E] Tước vị, $game_concept_title_tier$ xác định vị trí của một [title|E] trong hệ thống phân cấp của trò chơi.\n\nTất cả các tước vị đều có một Cấp bậc, xác định Cấp bậc cao nhất có thể có của [vassals|E] và [holder|E] có thể có.\n\n[hegemony|E] > [empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]."
  game_concept_title_rank_desc:0 "Cá nhân tương đương của [title_tier|E] Tước vị, $game_concept_title_rank$ xác định vị trí của [ruler|E] trong hệ thống phân cấp của trò chơi.\n\nTất cả các tước vị đều có Xếp hạng, xác định Xếp hạng cao nhất có thể có của [vassals|E] mà [holder|E] có thể có.\n\n[hegemon|E] > [emperor|E] > [king|E] > [duke|E] > [count|E] > [baron|E]."
  game_concept_clergy:0 "Giáo sĩ"
  game_concept_clergy_desc:1 "[court_chaplains|E], [realm_priests|E], Nhà cai trị [theocratic|E], và bất kỳ ai có đặc điểm [GetTrait('devoted').GetName( GetNullCharacter )] được coi là thành viên Giáo sĩ.\n\n[doctrines|E] của [faith|E] xác định ai có thể là thành viên Giáo sĩ và liệu các thành viên Giáo sĩ có thể kết hôn, thừa kế đất đai, v.v.."
  game_concept_church_property:0 "Địa sản Giáo hội"
  game_concept_church_holdings:0 "Địa sản Giáo hội"
  game_concept_church_holding:0 "Địa sản Giáo hội"
  game_concept_church:  "Giáo hội"
  game_concept_church_property_desc:0 "Địa sản Giáo hội là [temples|E] nằm dưới sự kiểm soát của [realm_priest|E].\n\nTrong [faiths|E] với [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName], không có Địa sản Giáo hội và [temples|E] có thể được quản lý trực tiếp bởi [rulers|E] mà không bị phạt."

  game_concept_temple_citadel:  "Pháo đài Đền thờ"
  game_concept_temple_citadels:  "Pháo đài Đền thờ"
  game_concept_temple_citadel_holding:  "Địa sản Pháo đài Đền thờ"
  game_concept_temple_citadel_holdings:  "Địa sản Pháo đài Đền thờ"
  game_concept_temple_citadel_holding_desc:  "Pháo đài Đền thờ là sự kết hợp thực dụng giữa [castle|E] công sự và [temple|E] thờ cúng — đây là [holding_type|E] tiêu chuẩn cho các [rulers|E] [mandala|E]. Chúng cung cấp một lượng [levies|E], [piety|E] và [taxes|E]."

  game_concept_embarking:0 "Lên tàu"
  game_concept_embarked:0 "Lên tàu"
  game_concept_embarked_i:0 "@embarked_icon!"
  game_concept_embark:0 "Lên tàu"
  game_concept_embarkation:0 "Lên tàu"
  game_concept_embarking_desc:1 "[army|E] sẽ tự động $game_concept_embark$ tham gia [fleet|E] khi có lệnh di chuyển vào Vùng biển hoặc khi không có đường đất đến [barony|E] mục tiêu.\n\n$game_concept_embarking$ tiêu tốn một khoản [gold|E], tượng trưng cho việc mua sắm và đóng tàu. Đối với mỗi #V 100#! người Lên tàu, chi phí #V [GetDefine('NFleet', 'EMBARK_GOLD_COST_PER_HUNDRED')|0]#! [gold_i] được thanh toán."
  game_concept_era:0 "Thời đại"
  game_concept_eras:0 "Thời đại"
  game_concept_era_desc:1 "[innovations|E] chỉ có thể được khám phá nếu [culture|E] đã đạt đến Thời đại cần thiết. Thời đại tiếp theo chỉ có thể bắt đầu sau một năm nhất định và nếu có ít nhất #V 50%#! Đổi mới của Thời đại đã được khám phá trước đó.\n\nCác nhà cai trị với chính thể [tribal_government|E] và [nomadic_government|E] chỉ có thể sử dụng các Đổi mới ​​của Thời đại Bộ lạc."
  game_concept_innovation:0 "Đổi mới"
  game_concept_innovations:0 "Đổi mới"
  game_concept_innovation_desc:0 "Đổi mới công nghệ và những tiến bộ khác mang lại lợi ích cho tất cả các nhân vật của một [culture|E] nhất định. Các đổi mới được nhóm vào [eras|E] khi chúng có thể được khám phá.\n\nThông qua việc tiếp xúc với các nền Văn hóa lân cận, mỗi nền Văn hóa luôn [spread|E] với một Đổi mới cụ thể sẽ được khám phá nhanh hơn nhiều.\n\nNgoài ra, [culture_head|E] có thể thiết lập một Đổi mới khác (hoặc giống) với [cultural_fascination|E] để được thúc đẩy thêm."
  game_concept_cultural_fascination:0 "Say mê Văn hóa"
  game_concept_fascination:0 "Say mê"
  game_concept_cultural_fascination_desc:0 "Mỗi nền Văn hóa luôn bị Say mê bởi một [innovation|E] cụ thể, điều này làm tăng đáng kể tốc độ khám phá với tốc độ tùy thuộc vào [skills|E] của [culture_head|E] hiện tại. Mỗi sự đổi mới đều được hưởng lợi từ một Kỹ năng cụ thể.\n\nLãnh đạo Văn hóa có thể thay đổi Say mê Văn hóa một cách tự do."
  game_concept_cultural_spread:  "Lan tỏa Văn hóa"
  game_concept_spread:  "Lan tỏa"
  game_concept_cultural_spread_desc:  "Việc tiếp xúc với các [cultures|E] khác có [innovations|E] chưa được khám phá sẽ khiến một trong những $game_concept_innovations$ đó được khám phá nhanh hơn. Trong số các [cultures|E] đủ điều kiện, nền văn hóa có [cultural_acceptance|Ecao nhất sẽ được chọn để Lan tỏa tiến trình [innovation|E]."
  game_concept_congenital:0 "Bẩm sinh"
  game_concept_congenital_trait:0 "Đặc điểm Bẩm sinh"
  game_concept_congenital_traits:0 "Đặc điểm Bẩm sinh"
  game_concept_congenital_desc:0 "Một số [traits|E] là bẩm sinh và có thể được di truyền cho con cháu. Thông qua [breeding|E] thích hợp, ngài thậm chí có thể củng cố một số đặc điểm như vậy.\n\nVí dụ: nếu cả bố và mẹ đều [GetTrait('intellect_good_1').GetName( GetNullCharacter )], có khả năng con cái của họ sẽ nhận được Đặc điểm [GetTrait('intellect_good_2').GetName( GetNullCharacter )] tốt hơn.\n\n[skills|E] cơ bản không phải bẩm sinh."
  game_concept_breeding:0 "Lai giống"
  game_concept_bred:0 "Lai giống"
  game_concept_breed:0 "Lai giống"
  game_concept_breeding_desc:2 "Bằng cách dàn xếp [marriages|E] giữa các nhân vật có [traits|E] [congenital|E] tốt, có thể sinh ra những đứa trẻ có cùng Đặc điểm. Con cái may mắn thậm chí có thể nhận được phiên bản cải tiến của những Đặc điểm đó.\n\nTuy nhiên , điều này cũng đúng với những Đặc điểm bẩm sinh xấu như [GetTrait('beauty_bad_2').GetName( GetNullCharacter )].\n\nCó thể ngài muốn sắp xếp hôn nhân giữa những nhân vật có quan hệ họ hàng gần để tạo ra những Đặc điểm tốt hơn ở con ngài, nhưng điều này cũng có nguy cơ bị dị tật [inbreeding|E]."
  game_concept_inbreeding:0 "Cận huyết"
  game_concept_inbred:0 "Cận huyết"
  game_concept_inbreeding_desc:1 "[children|E] của hai [characters|E] có quan hệ họ hàng gần gũi có nguy cơ sinh ra với dị tật [congenital|E], trong đó nghiêm trọng nhất là [trait|E] [GetTrait('inbred').GetName( GetNullCharacter )].\n\nĐiều này hiếm khi xảy ra ở thế hệ đầu tiên, nhưng $game_concept_inbreeding$ liên tiếp làm tăng nguy cơ.\n\nTuy nhiên, các thế hệ $game_concept_inbreeding$ cũng có thể dẫn đến $game_concept_trait$ [GetTrait('pure_blooded').GetName( GetNullCharacter )] có lợi, (nếu cả cha và mẹ đều có chung) khiến con cái miễn nhiễm với các dị tật bẩm sinh do tất cả các sai sót đã được [bred|E] ngoài huyết thống."
  game_concept_cadet_branching:0 "Nhánh Con"
  game_concept_cadet_branch:0 "Nhánh Con"
  game_concept_cadet_branches:0 "Nhánh Con"
  game_concept_cadet_branching_desc:0 "Các [dynasties|E] luôn có một [house|E] sáng lập, nhưng để tự mình trở thành [house_heads|E], các thành viên [house|E] có thể chọn tạo lập Gia tộc mới của riêng mình — Nhánh Con.\n\nCác thành viên của các Gia tộc nhánh này có thể tự do làm điều tương tự, cuối cùng sẽ tạo nên một cây Gia tộc trong Triều đại lớn hơn."
  game_concept_house_head_interaction:0 "Tương tác Lãnh đạo Gia tộc"
  game_concept_house_head_interaction_desc:0 "[interactions|E] đặc biệt mà [house_head|E] có thể thực hiện với các thành viên trong [house|E] của họ."
  game_concept_demand_conversion:0 "Yêu cầu Cải đạo"
  game_concept_demanding_conversion:0 "Yêu cầu Cải đạo"
  game_concept_demand_conversion_desc:1 "Các [rulers|E] có thần dân thuộc [faith|E] khác có thể Yêu cầu Cải đạo để thay đổi Đức tin của thần dân sang Đức tin của chính mình. [learning|E] của Nhà cai trị và [opinion|E] của thần dân đối với lãnh chúa của họ là những yếu tố chính quyết định liệu thần dân có chấp nhận yêu cầu hay [Concept('refuse_conversion_crime','từ chối')|E] nó."
  game_concept_damage:0 "Tổn hại"
  game_concept_damage_desc:1 "Tổn hại của [soldier|E] xác định số lượng [casualties|E] mà họ có thể gây ra cho kẻ địch trong [battle|E].\n\nBinh lính [levy|E] gây ra [GetDefine('NCombat', 'LEVY_ATTACK')|0] Thiệt hai."
  game_concept_toughness:0 "Bền vững"
  game_concept_toughness_desc:1 "Bền vững của [soldier|E] xác định số lượng [damage|E] mà họ có thể nhận trong [battle|E] trước khi trở thành [casualty|E].\n\nBinh lính [levy|E] có [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] Bền vững."
  game_concept_pursuit:0 "Truy kích"
  game_concept_pursuit_desc:1 "[army|E] chiến thắng làm tăng số lượng [casualties|E] mà họ gây ra sau [aftermath|E] của [battle|E] bởi giá trị $game_concept_pursuit$ kết hơp của$game_concept_army$, chuyển đổi [routed_soldiers|E] thành [dead_soldiers|E]."
  game_concept_screen:0 "Yểm trợ"
  game_concept_screen_desc:0 "[army|E] bị đánh bại làm giảm số lượng [casualties|E] mà họ nhận được sau [aftermath|E] của [battle|E] bằng giá trị Yểm trợ kết hợp với Quân đội của họ."
  game_concept_siege_progress:0 "Tiến trình Vây hãm"
  game_concept_siege_progress_desc:1 "$game_concept_siege_progress$ cho biết mức độ gần hoàn thành của một cuộc [siege|E] và $game_concept_siege$ dự kiến ​​sẽ kéo dài trong bao lâu. Khi Tiến trình lấp đầy, [holding|E] sẽ trở thành [occupied|E].\n\nSố lượng $game_concept_siege_progress$ yêu cầu bị ảnh hưởng bởi [fort_level|E] và cách bó trí binh lính của [garrison|E].\n\nTiến trình nhận được hằng ngày và bị ảnh hưởng bởi Sự kiện Vây hãm. Nó cũng có thể được tăng lên bằng cách có [siege_weapons|E], hoặc [army|E] có lực lượng đông đảo hơn rất nhiều so với [garrison|E]."
  game_concept_siege_weapon:0 "Vũ khí Vây hãm"
  game_concept_siege_weapons:0 "Vũ khí Vây hãm"
  game_concept_siege_weapon_desc:0 "$game_concept_siege_weapons$ là [men_at_arms|E] tập trung hoàn toàn vào [sieges|E].\n\nChúng không ảnh hưởng đến [battles|E], nhưng sẽ giúp $game_concept_siege$ hoàn thành nhanh hơn nhiều bằng cách tăng [siege_progress|E].\n\nTuy nhiên, $game_concept_siege_weapons$ chỉ có hiệu quả trong việc bao vây [holdings|E] lên đến một [fort_level|E] nhất định."
  game_concept_completely_controls:0 "Kiểm soát Hoàn toàn"
  game_concept_completely_control:0 "Kiểm soát Hoàn toàn"
  game_concept_completely_controlled:0 "Kiểm soát Hoàn toàn"

  game_concept_complete_control:0 "Kiểm soát Hoàn toàn"
  game_concept_complete_control_desc:2 "Điều kiện này được đáp ứng khi tất cả [titles|E] chư hầu [de_jure|E] của tước vị mục tiêu được nắm giữ bởi [ruler|E] hoặc [vassals|E] của họ và không có Bá quốc nào của nó bị [occupied|E] bởi [armies|E] thù địch."
  game_concept_complete_control_region:0 "Kiểm soát Hoàn toàn"
  game_concept_completely_controls_region:0 "Kiểm soát Hoàn toàn"
  game_concept_completely_control_region:0 "Kiểm soát Hoàn toàn"
  game_concept_complete_control_region_desc:0 "Điều kiện này được thực hiện khi tất cả [counties|E] trong [region|E] mục tiêu được nắm giữ bởi nhà cai trị hoặc bởi các [vassals|E] của họ và không có Bá quốc nào của nó bị chiếm bởi quân đội thù địch."
  game_concept_region:0 "Vùng"
  game_concept_regions:0 "Vùng"
  game_concept_region_desc:0 "Một khu vực tạo thành một khu vực địa lý cụ thể trên bản đồ. Không giống như [de_jure|E], các khu vực không bao giờ có thể thay đổi."
  game_concept_recently_disembarked:0 "Đổ bộ Gần đây"
  game_concept_recently_disembarked_desc:0 "[army|E] sẽ trở thành '$game_concept_recently_disembarked$' bất cứ khi nào nó đổ bộ sau khi ở trên biển. Điều này sẽ khiến $game_concept_army$ phải chịu một hình phạt [advantage|E] trong [battles|E] trong một thời gian nhất định."
  game_concept_diplomatic_range:0 "Phạm vi Ngoại giao"
  game_concept_range:0 "Phạm vi"
  game_concept_diplomatic_range_desc:0 "Ngài chỉ có thể tương tác với những nhân vật nằm trong Phạm vi Ngoại giao. Tuy nhiên, [realms|E] lân cận luôn nằm trong phạm vi."
  game_concept_mongol_empire:0 "Đế quốc Mông Cổ"
  game_concept_mongol_empire_desc:0 "[title|E] [empire|E] có thể được tạo ra bởi một người cai trị bộ tộc quyền lực trên Thảo nguyên. Nó cho phép [mongol_invasion_casus_belli|E].\n\nTước vị được tạo bằng cách lấy [decision|E] #EMP $become_greatest_of_khans_decision$#!."
  game_concept_mongol_invasion_casus_belli:0 "Biện minh Mông Cổ Xâm lược"
  game_concept_mongol_invasion_casus_belli_desc:0 "[casus_belli|E] mạnh mẽ chỉ dành cho [ruler|E] của [mongol_empire|E].\n\nNó có thể nhắm mục tiêu toàn bộ [title|E] [kingdom|E] cùng một lúc và cho phép mở rộng trên những vùng đất rộng lớn."
  game_concept_hungarian_invasion_casus_belli:0 "Lý do $HUNGARIAN_INVASION_CB_NAME$"
  game_concept_hungarian_invasion:0 "$HUNGARIAN_INVASION_CB_NAME$"
  game_concept_hungarian_invasion_casus_belli_desc:0 "[casus_belli|E] mạnh mẽ chỉ có thể được sử dụng một lần trong mỗi chiến dịch, tổng cộng, để chinh phục tất cả các lãnh thổ do mục tiêu nắm giữ trong Pannonia.\n\nKhi chiến thắng, tất cả $mogyer_collective_noun$ trong [realm|E] của kẻ tấn công sẽ di chuyển cùng họ đến Pannonia, [counties|E] #EMP và#! [vassals|E], thay thế $avar$ $game_concept_counties$. Các chư hầu khác bên ngoài Pannonia bị bỏ hoang, trong khi $game_concept_counties$ trước đây do $mogyer_collective_noun$ chiếm giữ hoặc nắm giữ để lại cho các lãnh chúa nhỏ mọn địa phương và các bộ lạc thảo nguyên đối thủ."
  game_concept_pax_romana_invasion_casus_belli:  "Biện minh Chiến tranh Pax Romana"
  game_concept_pax_romana_invasion_casus_belli_desc:  "Một [casus_belli|E] mạnh mẽ chỉ dành cho [ruler|E] của Đế Quốc La Mã với mục đích mở ra một thời đại mới của [Glossary( 'Pax Romana', 'PAX_ROMANA_GLOSS' )].\n\nNó có thể nhắm mục tiêu vào toàn bộ [title|E] [empire|E] cùng một lúc, và cho phép mở rộng nhanh chóng trên những vùng đất rộng lớn."
  game_concept_eastern_roman_empire:  "Đế Quốc Đông La Mã"
  game_concept_eastern_roman_empire_desc:  "Một [title|E] [empire|E] có thể được tạo lập bởi người nắm giữ Đế Quốc La Mã.\n\nTước vị được tạo lập bằng cách thực hiện [decision|E] #EMP $split_roman_empire_decision$#!."
  game_concept_imperial_expedition_cb:  "Cuộc viễn chinh Đế quốc"
  game_concept_imperial_expedition_cb_expedition:  "Cuộc viễn chinh"
  game_concept_imperial_expedition_cb_desc:  "Một [casus_belli|E] cực kỳ mạnh mẽ có thể được sử dụng bởi các [co_emperors|E] trong $game_concept_duumvirates$.\n\nMột $game_concept_imperial_expedition_cb$ có thể được triển khai nhắm vào bất kỳ [realm|E] nào giáp với [empire|E] hoặc nắm giữ vùng đất mà theo [de_jure|E] thuộc về hoàng đế cấp trên.\n\nNó có thể (và thường sẽ) nhắm mục tiêu vào #BER tất cả#! các [duchies|E], theo thực tế giáp với $game_concept_empire$ hoặc theo $game_concept_de_jure$ là thuộc về nó.\n\nNgoài ra, mọi [governor|E] giáp với bên phòng thủ sẽ bị buộc phải tham gia [war|E] với tư cách là một [ally|E]. Các $game_concept_governors$ xa xôi có [province_administrations|E] quân sự có thể tùy ý tham gia xung đột.\n\nNếu $game_concept_war$ giành được chiến thắng, $game_concept_co_emperor$ phải quyết định giữa:\n$EFFECT_LIST_BULLET$Trao các vùng đất đã chinh phục cho hoàng đế cấp trên của họ để có được [influence|E] và [opinion|E]\n$EFFECT_LIST_BULLET$Giữ các vùng đất cho riêng mình (tiêu tốn $game_concept_opinion$)\n$EFFECT_LIST_BULLET$Giao nộp hầu hết các vùng đất trong khi vẫn giữ lại [duchy|E] tốt nhất (giảm nhẹ [influence|E] và [opinion|E])\n$EFFECT_LIST_BULLET$Việc bổ nhiệm $game_concept_governors$ tạm thời tại địa phương, những người sẽ mang ơn họ\n\n#WEAK Tất cả phần thưởng đều tỷ lệ thuận với vùng đất đã chiếm giữ: một cuộc chinh phạt lớn mang lại nhiều $game_concept_influence$ #EMP hơn đáng kể#! so với một cuộc chiến tranh biên giới nhỏ.#!"
  game_concept_knight:0 "Hiệp sỹ"
  game_concept_knights:0 "Hiệp sỹ"
  game_concept_knight_i:0 "@knight_icon!"
  game_concept_knights_possessive:  "Hiệp sỹ"
  game_concept_knight_desc:4 "$game_concept_knight$ là một [vassal|E], [courtier|E], hoặc [follower|E] chiến đấu trực tiếp trong [army|E] của ngài.\n\nTrong các [battles|E], $game_concept_knights$ sử dụng [prowess_skill|E] của họ để chiến đấu hiệu quả hơn. $game_concept_prowess$ cao có nghĩa là họ sẽ có thể gây ra nhiều sát thương hơn cho kẻ thù và có nhiều khả năng sống sót hoặc thậm chí rời khỏi $game_concept_battle$ mà không bị tổn thương nào.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Các Knight (Hiệp sĩ) có thể được gọi bằng nhiều cái tên khác nhau tùy thuộc vào [culture] hoặc [faith]. Ví dụ, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ hoặc $knight_baghatur_no_tooltip_plural$.\n\nCác Knight (Hiệp sĩ) đại diện cho cả nhân vật và đoàn tùy tùng của họ.#!"
  game_concept_knight_desc_TOTO_DLC:0 "Ngài nhận được [prestige|E] mỗi khi một trong các $game_concept_knights$ của ngài [contest_qualifies|E] thành công hoặc giành được [contest|E] [GetActivityType( 'activity_tournament' ).GetName].\n\n"
  game_concept_knight_desc_NO_TOTO_DLC:0 ""
  game_concept_knight_desc_ACCOLADE_DLC:0 "Các hiệp sĩ được trao [accolade|E] sẽ trở thành [acclaimed_knights|E].\n\n"


  game_concept_knight_effectiveness:0 "Hiệu quả Hiệp sĩ"
  game_concept_knight_effectiveness_desc:0 "Hiệu quả Hiệp sĩ của [ruler|E] xác định mức độ [knights|E] của họ chiến đấu trong [battle|E].\n\nTại 100%, Hiệp sĩ chiến đấu như bình thường, nhưng ở mức 200%, họ chiến đấu như thể [prowess|E] đã được nhân đôi."
  game_concept_short_reign:0 "Trị vì Ngắn ngủi"
  game_concept_short_reign_desc:0 "'Trị vì Ngắn ngủi' là một hình phạt [opinion|E] suy giảm mà tất cả các nhân vật trong [realm|E] vương quốc phải nhận đối với một [liege|E] mới.\n\nTheo cách tương tự, các nhân vật nhận được phần thưởng Quan điểm [long_reign|E] đối với Lãnh chúa, người đã cai trị họ trong một thời gian dài."
  game_concept_long_reign:0 "Trị vì Dài lâu"
  game_concept_long_reign_desc:0 "'Trị vì Dài lâu' là phần thưởng [opinion|E] ngày càng tăng mà tất cả các nhân vật trong [realm|E] vương quốc nhận được đối với một [liege|E], người đã cai trị họ trong một thời gian dài.\n\nTương tự, các nhân vật có hình phạt Quan điểm suy giảm do [short_reign|E] đối với Lãnh chúa mới."
  game_concept_troop_quality:0 "Chất lượng"
  game_concept_troop_quality_desc:0 "$game_concept_troop_quality$ đo lường sức mạnh của [army|E] so với số lượng [soldiers|E] của họ.\n\n$game_concept_army$ chỉ chứa [knights|E] và [men_at_arms|E] sẽ có $game_concept_troop_quality$ cao trong khi $game_concept_army$ chứa một số lượng lớn [levies|E] sẽ có giá trị $game_concept_troop_quality$ thấp hơn.\n\nĐiều này có nghĩa là $game_concept_army$ nhỏ hơn với $game_concept_troop_quality$ cao hơn nhiều sẽ có sức tấn công cao hơn quy mô của họ — hãy cân nhắc cẩn thận cả số lượng Binh lính #Emphasis và#! $game_concept_troop_quality$ trước khi giao tranh với kẻ thù!"
  game_concept_religious_family:0 "Gia đình Tôn giáo"
  game_concept_religious_families:0 "Gia đình Tôn giáo"
  game_concept_religious_family_desc:0 "$game_concept_religious_family$ là một nhóm [religions|E]. $game_concept_religious_family$ ảnh hưởng như đến các Tôn giáo khác nhau và [faiths|E] trong đó, xem như nhau.\n\nGia đình [GetReligionFamily('rf_abrahamic').GetName] bỏ qua [holy_wars|E] chống lại mọi người #weak (kể cả những người Abraham khác)#!. Các tôn giáo dễ bị thành [heresy|E].\n\nGia đình [GetReligionFamily('rf_eastern').GetName] chỉ bỏ qua Thánh chiến chống lại các Gia đình tôn giáo khác.\n\nGia đình [GetReligionFamily('rf_pagan').GetName] bỏ qua Thánh Chiến chống lại tất cả mọi người, nhưng các Đức tin trong các Tôn giáo phải cải cách để tiếp cận chúng."
  game_concept_debt:  "Nợ nần"
  game_concept_debt_desc:  "Nợ là trạng thái có số [gold_i][gold|E] âm. Điều này thường xảy ra khi một [ruler|E] trong chiến tranh thuê [mercenaries|E] mà không có đủ Vàng để trang trải toàn bộ chi phí hoặc khi họ đang chiến tranh quá lâu.\n\n Khi đang Nợ nần ngài không thể tuyên bố [wars|E] mới, các [men_at_arms|E] của ngài không tiếp viện, và kẻ thù của ngài sẽ có [advantage|E] hơn ngài trong trận chiến. Ngài càng lâm vào cảnh nợ nần chồng chất, ngài sẽ càng chịu nhiều hình phạt — ít [levies|E] hơn, giảm [county_opinion|E], và các [vassals|E] của ngài sẽ yêu ít thích ngài hơn.\n\nNgoài ra, nhiều các sự kiện gây mất ổn định nhỏ khác có thể xảy ra, chẳng hạn như nhận được [county_corruption|E] trong các [counties|E] [domain|E] của ngài. \n\n#help Nói chung, tấn công kẻ thù khi chúng đang nợ nần là một ý tưởng hay, vì chúng sẽ chiến đấu với [advantage|E] bị suy giảm!#!"
  game_concept_treasury_debt:  "Nợ Kho bạc"
  game_concept_treasury_debt_desc: "Nợ Ngân khố là trạng thái có số lượng [treasury_i][treasury|E] âm. Điều này thường xảy ra khi một [governor|E] trong chiến tranh thuê [mercenaries|E] mà không có đủ Ngân khố để trang trải toàn bộ chi phí, khi họ ở trong chiến tranh quá lâu, hoặc nếu họ trả quá nhiều [Concept( 'treasury_budgeting', 'Lương' )|E] so với những gì họ thu được từ các [vassals|E] của mình.\n\nTrong khi đang Nợ, bạn không thể tuyên bố [wars|E] mới, các [men_at_arms|E] phụ thuộc vào Ngân khố sẽ không hồi phục, và kẻ thù của bạn sẽ có [advantage|E] hơn bạn trong trận chiến. Càng nợ sâu, bạn càng nhận được nhiều hình phạt — ít [levies|E] hơn, [county_opinion|E] giảm, và các [vassals|E] của bạn sẽ thích bạn ít hơn.\n\nNgoài ra, các sự kiện gây bất ổn nhỏ khác có thể xảy ra, chẳng hạn như tăng [county_corruption|E] trong các [domain|E] [counties|E] của bạn. \n\n#help Nhìn chung, bạn nên tấn công kẻ thù khi chúng đang Nợ, vì chúng sẽ chiến đấu với [advantage|E] giảm!#!"
  game_concept_beneficiary:0 "Người thụ hưởng"
  game_concept_beneficiaries:0 "Người thụ hưởng"
  game_concept_beneficiary_desc:1 "Mọi người tham gia [great_holy_war|E] đều có thể chọn $game_concept_beneficiary$ từ [dynasty|E] của họ. Sau khi chiến thắng, $game_concept_beneficiary$ sẽ nhận được các vùng đất lãnh thổ mục tiêu tỷ lệ với [war_contribution|E] của người cai trị bảo hộ của họ.\n\nNgười đóng góp lớn nhất có thể buộc Người thụ hưởng của họ để nhận được tước vị chính đang bị tranh giành."
  game_concept_papal_recipient:0 "Ứng viên Yêu thích"
  game_concept_papal_recipient_desc:1 "Nếu mục tiêu chính của [great_holy_war|E] đã được nắm giữ hoặc tuyên bố bởi một thành viên của đức tin xâm lược, họ sẽ được coi là người thụ hưởng hợp pháp của danh hiệu đang tranh chấp, trừ khi [Concept( 'war_contribution', 'Người đóng góp' )|E] chính quyết định ưu tiên cho [beneficiary|E] của họ."
  game_concept_end_date:0 "Ngày kết thúc"
  game_concept_end_date_desc:0 "Năm 1453 AD là Ngày kết thúc, và khi tới ngày đó, trò chơi sẽ kết thúc."
 
  game_concept_realm_size:0 "Quy mô Quốc gia"
  game_concept_realm_size_desc:1 "$game_concept_realm_size$ của một nhân vật là số [counties|E] thuộc sở hữu của họ và [vassals|E] của họ."
  game_concept_voter_strength:0 "Sức mạnh Bỏ phiếu"
  game_concept_voting_strength:0 "Sức mạnh Bỏ phiếu"
  game_concept_voting_power:0 "Sức mạnh Biểu quyết"
  game_concept_voter_strength_desc:0 "Sức mạnh Bỏ phiếu đại diện cho mức độ ảnh hưởng mà một Tuyển hầu tước mang lại khi bỏ phiếu trong [succession_law|E] bầu cử. Giá trị này thường tăng lên tùy thuộc vào [rank|E] của nhà cai trị, nhưng các yếu tố khác có thể phát huy tác dụng tùy thuộc vào luật [titlepossessive|E]."
  game_concept_stress_level:0 "Cấp độ Căng thẳng"
  game_concept_stress_levels:0 "Cấp độ Căng thẳng"
  game_concept_stressed:0 "Căng thẳng"
  game_concept_stress_level_desc:1 "Mỗi 100 [stress|E] mà nhân vật tích lũy cũng khiến họ tăng Cấp độ Căng thẳng. Cấp độ Căng thẳng nằm trong khoảng từ 0 đến 3, với mỗi cấp độ sẽ áp dụng các hình phạt tăng dần đối với [fertility|E] và [health|E] của nhân vật.\n\nNgoài ra, miễn là một nhân vật có ít nhất 1 Cấp độ căng thẳng, họ sẽ dễ bị [mental_breaks|E]."
  game_concept_mental_break:0 "Suy sụp Tinh thần"
  game_concept_mental_breaks:0 "Suy sụp Tinh thần"
  game_concept_mental_break_desc:0 "Khi [stress|e] lấn át một nhân vật, họ sẽ trải qua Suy sụp Tinh thần — một cuộc khủng hoảng cá nhân trong đó họ cảm thấy rằng họ phải làm điều gì đó để giảm Căng thẳng của mình, bất kể giá nào.\n\nNhân vật bị Suy sụp Tinh thần sẽ có một số cách mà họ có thể đối phó với tình huống, mặc dù nhiều cách trong số đó sẽ gây ra hậu quả tiêu cực.\n\nTại [stress_levels|E] thấp, những hậu quả này là nhỏ và dễ dàng quản lý. Tuy nhiên, khi Cấp độ Căng thẳng tăng lên, những hậu quả này cuối cùng dẫn đến đến điên cuồng và thậm chí là cái chết."
  stress_icon_tooltip:0 "$game_concept_mental_break_desc$"
 
  game_concept_clergy_opinion:0 "Quan điểm Giáo sĩ"
  game_concept_clergy_opinion_desc:0 "Loại [opinion|E] này chỉ ảnh hưởng đến [clergy|E] của [faith|E] của ngài."
 
  game_concept_secular_opinion:0 "Quan điểm Thế tục"
  game_concept_secular_opinion_desc:0 "Loại [opinion|E] này ảnh hưởng đến tất cả các nhân vật #emphasis không phải#! [clergy|E]."

  game_concept_title_allegiance:0 "Trung thành với Tước vị"
  game_concept_title_allegiance_desc:0 "[vassals|E] có thể nợ Lòng trung thành với một [title|E] cụ thể hơn là người của [liege|E] của họ. Điều này chỉ có thể xảy ra nếu Tước vị đó có [succession_law|E] riêng. Về [succession|E], những Chư hầu như vậy sẽ trở thành chư hầu của Tước vị [holder|E] mới."
  game_concept_nominate:0 "Đề cử"
  game_concept_nominate_heir:0 "Đề cử Người thừa kế"
  game_concept_nomination:0 "Đề cử"
  game_concept_nominations:0 "Đề cử"
  game_concept_nominate_desc:1 "Theo [succession_laws|E] Bầu cử, mỗi [elector|E] có thể Đề cử [title_heir|E] ưa thích của họ. Ứng cử viên hợp lệ và tùy chọn bỏ phiếu của Tuyển hầu tước khác nhau tùy thuộc vào Luật cụ thể."
  game_concept_elector:0 "Tuyển hầu tước"
  game_concept_electors:0 "Tuyển hầu tước"
  game_concept_elector_desc:1 "Tuyển hầu tước là những nhân vật được bỏ phiếu cho [title_heir|E] ưa thích của họ trong [succession_laws|E] Bầu cử. Luật cụ thể xác định ai được coi là một Tuyển hầu tước."
  game_concept_attraction:0 "Hấp dẫn"
  game_concept_attracted:0 "Hấp dẫn"
  game_concept_attraction_desc:0 "Hấp dẫn là một loại [opinion|E] chỉ ảnh hưởng đến những nhân vật có [sexuality|E] phù hợp với giới tính của ngài.\n\nVí dụ: một người đàn ông [homosexual|E] sẽ trải nghiệm Quan điểm này đối với những người đàn ông khác, một nhân vật [asexual|E] sẽ không trải nghiệm điều đó đối với bất kỳ ai, và một người phụ nữ [heterosexual|E] sẽ trải nghiệm điều đó đối với nam giới.\n\nLoại Quan điểm này không còn ảnh hưởng đến phụ nữ ở trên [GetDefine('NCharacter', 'FEMALE_ATTRACTION_CUTOFF_AGE')] tuổi, và đối với nam trên [GetDefine('NCharacter', 'MALE_ATTRACTION_CUTOFF_AGE')] tuổi."
  game_concept_sexuality:1 "Xu hướng tình dục"
  game_concept_sexuality_desc:1 "Xu hướng tình dục của một nhân vật xác định những nhân vật khác mà họ có khả năng [attracted|E].\n\nXu hướng tình dục không ảnh hưởng đến việc họ có thể [marry|E], nhưng có thể làm giảm [fertility|E] của một cặp vợ chồng đã kết hôn nếu một trong hai người phối ngẫu không phù hợp với sở thích của người kia.\n\nCác khuynh hướng tình dục hạn chế được mô hình hóa trong #EMP Crusader Kings III#! bao gồm:\n$EFFECT_LIST_BULLET$[heterosexual|E]\n$EFFECT_LIST_BULLET$[homosexual|E]\n$EFFECT_LIST_BULLET$[bisexual|E]\n$EFFECT_LIST_BULLET$[asexual|E]"
  sexuality_ho:0 "[homosexual|E]"
  game_concept_homosexual:0 "Đồng tính Luyến ái"
  game_concept_homosexual_desc:2 "Trong #EMP Crusader Kings III#!, nhân vật này bị thu hút bởi các nhân vật cùng giới tính của họ."
  sexuality_he:0 "[heterosexual|E]"
  game_concept_heterosexual:0 "Dị tính Luyến ái"
  game_concept_heterosexual_desc:2 "Trong #EMP Crusader Kings III#!, nhân vật này bị thu hút bởi những nhân vật khác giới."
  sexuality_bi:0 "[bisexual|E]"
  game_concept_bisexual:0 "Song tính Luyến ái"
  game_concept_bisexual_desc:2 "Trong #EMP Crusader Kings III#!, nhân vật này bị thu hút bởi các nhân vật cùng giới hoặc khác giới."
  sexuality_as:0 "[asexual|E]"
  game_concept_asexual:0 "Vô tính Luyến ái"
  game_concept_asexual_desc:2 "Trong #EMP Crusader Kings III#!, nhân vật này ít hoặc không bị thu hút bởi các nhân vật khác bất kể giới tính."
  sexuality_none:0 "#V Không#!"
  game_concept_title_succession:  "Kế vị Tước vị"
  game_concept_title_specific_succession:  "Tước vị Cụ thể"
  game_concept_title_succession_desc:  "Một [title|E] có thể có [succession_law|E] riêng, khác với[realm|E] của [holder|E].\n\n[kingdoms|E] và [empires|E] rất có thể có $game_concept_title_succession$ truyền thống.\n\n$game_concept_holder$ của $game_concept_title$ có thể thêm hoặc xóa Luật Kế vị dành riêng cho Tước vị, và thường là phải trả giá bằng [prestige|E]\n\n[domiciles|E] cũng có $game_concept_title_succession$ riêng, không thể xóa bỏ."

  game_concept_designated_heir:1 "Người thừa kế được Chỉ định"
  game_concept_designated_heir_desc:3 "$game_concept_designated_heir$ được ưu tiên khi quyết định ai sẽ trở thành [realm_heir|E]."
  game_concept_incest:0 "Loạn luân"
  game_concept_incestuous:0 "Loạn luân"
  game_concept_incest_desc:0 "Loạn luân đề cập đến hoạt động tình dục giữa những người thân ruột thịt.\nNhững mối quan hệ loạn luân được xác định bởi [doctrine|E] $doctrine_consanguinity_name$ [faith|E] của một nhân vật."

  game_concept_relation:0 "Mối quan hệ Đặc biệt"
  game_concept_relations:0 "Mối quan hệ Đặc biệt"
  game_concept_relationship:0 "Mối quan hệ Đặc biệt"
  game_concept_relation_desc:3 "$game_concept_relations$ là các mối quan hệ mà một nhân vật có mà không bị ràng buộc bởi gia đình hoặc [vassalage|E]. $game_concept_relations$ này thuộc nhiều loại khác nhau, có thể mang [character_modifiers|E] cho nhân vật có liên quan và xác định những điều có thể xảy ra giữa họ.\n\nMối quan hệ Tiêu chuẩn:\n$EFFECT_LIST_BULLET$ [friend|E]\n$EFFECT_LIST_BULLET$ [lover|E]\n$EFFECT_LIST_BULLET$ [rival|E]\n$EFFECT_LIST_BULLET$ [guardian|E]\n$EFFECT_LIST_BULLET$ [ward|E]\n$EFFECT_LIST_BULLET$ [mentor|E]\n$EFFECT_LIST_BULLET$ [student|E]\n$EFFECT_LIST_BULLET$ [elder|E]\n$EFFECT_LIST_BULLET$ [disciple|E]\n\nMối quan hệ Nâng cấp:\n$EFFECT_LIST_BULLET$ [best_friend|E]\n$EFFECT_LIST_BULLET$ [soulmate|E]\n$EFFECT_LIST_BULLET$ [nemesis|E]\n\nMối quan hệ Thơ ấu:\n$EFFECT_LIST_BULLET$ [bully|E]\n$EFFECT_LIST_BULLET$ [victim|E]\n$EFFECT_LIST_BULLET$ [crush|E]"
 
  game_concept_lover:0 "Tình nhân"
  game_concept_lovers:0 "Tình nhân"
  game_concept_lover_possessive:0 "Tình nhân"
  game_concept_lovers_possessive:0 "Tình nhân"
  game_concept_lover_desc:3 "$game_concept_lover$ là $game_concept_relation$ cho biết mối quan hệ tình ái và tình dục đang diễn ra giữa hai [characters|E].\n\nVì chúng thường diễn ra bên ngoài mối ràng buộc [marriage|E] hoặc [concubinage|E], hầu hết $game_concept_lover$ $game_concept_relations$ bắt đầu là [secrets|E].\n\nNếu một người nam và một người nữ là $game_concept_lovers$, thì người nữ có thể mang thai con của người nam. Nếu họ không $game_concept_married$ (và một người thì không $game_concept_concubine$ của người kia), đứa trẻ sẽ là [bastard|E], bí mật hoặc cách khác.\n\n$game_concept_lovers$ trung thành và giàu tình cảm có thể trở thành [soulmates|E]."
  game_concept_soulmate:0 "Tâm giao"
  game_concept_soulmates:0 "Tâm giao"
  game_concept_soulmate_possessive:0 "Tâm giao"
  game_concept_soulmates_possessive:0 "Tâm giao"
  game_concept_soulmate_desc:0 "$game_concept_soulmate$ là $game_concept_relation$ biểu thị một tình yêu lãng mạn, sâu sắc. Nó là $game_concept_relation$ mạnh hơn [lover|E]. Một $game_concept_character$ chỉ có thể có một $game_concept_soulmate$."

  game_concept_friend:0 "Bằng hữu"
  game_concept_friends:0 "Bằng hữu"
  game_concept_friendships:  "Hữu nghị"
  game_concept_friend_possessive:0 "Bằng hữu"
  game_concept_friends_possessive:0 "Bằng hữu"
  game_concept_friendship:0 "Hữu nghị"
  game_concept_friend_desc:2 "$game_concept_friend$ là $game_concept_relation$ biểu thị tình bạn thân thiết và sự ủng hộ, cả [children|E] và [adults|E] đều có.\n\n$game_concept_friends$ có mối liên hệ sâu sắc có thể trở thành [best_friends|E]."

  game_concept_best_friend:0 "Bạn tốt"
  game_concept_best_friends:0 "Bạn tốt"
  game_concept_best_friend_possessive:0 "Bạn tốt"
  game_concept_best_friends_possessive:0 "Bạn tốt"
  game_concept_best_friend_desc:2 "$game_concept_best_friend$ là $game_concept_relation$ biểu thị sự cống hiến và ủng hộ suốt đời. Nó là $game_concept_relation$ mạnh hơn [friend|E]. Một [character|E] chỉ có thể có một $game_concept_best_friend$."

  game_concept_rival:0 "Đối thủ"
  game_concept_rivals:0 "Đối thủ"
  game_concept_rivalries:0 "Đối thủ"
  game_concept_rivalry:0 "Đối thủ"
  game_concept_rival_possessive:0 "Đối thủ"
  game_concept_rivals_possessive:0 "Đối thủ"
  game_concept_rival_desc:2 "$game_concept_rival$ là $game_concept_relation$ biểu thị sự oán hận suốt đời, nếu không phải là thù ghét.\n\n$game_concept_rivals$ người thực sự coi thường nhau có thể trở thành [nemeses|E]."

  game_concept_nemesis:0 "Tử địch"
  game_concept_nemeses:0 "Tử địch"
  game_concept_nemesis_possessive:0 "Tử địch"
  game_concept_nemeses_possessive:0 "Tử địch"
  game_concept_nemesis_desc:1 "$game_concept_nemesis$ là $game_concept_relation$ biểu thị sự khinh thường và thù hận hoàn toàn (và lẫn nhau). Nó là $game_concept_relation$ mạnh hơn [rival|E]. Một nhân vật chỉ có thể có một $game_concept_nemesis$."

  game_concept_grudge:  "Oán giận"
  game_concept_grudges:  "Oán giận"
  game_concept_grudge_possessive:  "Oán giận"
  game_concept_grudges_possessive:  "Oán giận"
  game_concept_grudge_desc:  "$game_concept_grudge$ là một $game_concept_relation$ biểu thị sự căm ghét và oán giận đơn phương. Mục tiêu của sự căm ghét không đáp lại tình cảm và thậm chí có thể không biết.\n\n#WEAK $game_concept_grudges$ thường được hình thành khi một [character|E] làm điều gì đó khủng khiếp với người khác mà thậm chí không nhận ra sự tồn tại của chúng — ví dụ, một vị vua tống một người nông dân vào trong [dungeon|E] trong bốn mươi năm.#!"

  game_concept_guardian:0 "Người giám hộ"
  game_concept_guardians:0 "Người giám hộ"
  game_concept_guardian_possessive:0 "Người giám hộ"
  game_concept_guardians_possessive:0 "Người giám hộ"
  game_concept_guardianship:1 "Quyền giám hộ"
  game_concept_guardian_desc:2 "$game_concept_guardian$ là một [character|E] được chỉ định cho việc [educate|E] [child|E] (được gọi là [ward|E] của họ).\n\n$game_concept_guardians$ có xu hướng truyền lại [personality_traits|E] của họ cho $game_concept_wards$, cũng như [culture|E] và/hoặc [faith|E] của họ, nếu được chỉ định như vậy trong $game_concept_education_focus$.\n\n$game_concept_guardian$ có thể cư trú tại một [court|E] khác. Giao phó [close_family_member|E] cho [ruler|E] khác theo cách này sẽ làm tăng thêm [opinion|E] của họ về ngài."

  game_concept_ward:0 "Người được giám hộ"
  game_concept_wards:0 "Người được giám hộ"
  game_concept_ward_possessive:0 "Người được giám hộ"
  game_concept_wards_possessive:0 "Người được giám hộ"
  game_concept_ward_desc:0 "$game_concept_ward$ là [child|E] được [educated|E] bởi [guardian|E]. Mỗi $game_concept_guardian$ có thể chịu trách nhiệm tối đa hai $game_concept_wards$."

  game_concept_mentor:0 "Cố vấn"
  game_concept_mentors:0 "Cố vấn"
  game_concept_mentor_possessive:0 "Cố vấn"
  game_concept_mentors_possessive:0 "Cố vấn"
  game_concept_mentor_desc:0 "$game_concept_mentors$ là [characters|E] giúp cải thiện [skills|E] của [student|E] của họ. Ngài có thể nhận được chúng thông qua các sự kiện khi [focus|E] [lifestyle|E] của ngài được đặt thành $game_concept_skill$ rõ ràng."

  game_concept_student:0 "Học sinh"
  game_concept_students:0 "Học sinh"
  game_concept_student_possessive:0 "Học sinh"
  game_concept_students_possessive:0 "Học sinh"
  game_concept_student_desc:0 "$game_concept_students$ là [characters|E] được hưởng lợi từ lời khuyên của [mentor|E], người đang giúp họ nâng cao một trong số những [skills|E] của họ. $game_concept_mentors$ có được thông qua các sự kiện khi [focus|E] [lifestyle|E] được đặt thành $game_concept_skill$ mà họ vượt trội."

  game_concept_bully:0 "Kẻ Bắt nạt"
  game_concept_bullies:0 "Kẻ Bắt nạt"
  game_concept_bully_possessive:0 "Kẻ Bắt nạt"
  game_concept_bullies_possessive:0 "Kẻ Bắt nạt"
  game_concept_bully_desc:0 "$game_concept_bully$ là một [child|E] hung ác, chọn một $game_concept_child$ ([victim|E] của họ), vì vui, vì lợi ích hoặc chỉ vì buồn chán. Khi đến [adulthood|E], $game_concept_bully$ có thể trở thành [rival|E], hoặc buông bỏ hận thù thời thơ ấu."

  game_concept_victim:0 "Nạn nhân"
  game_concept_victims:0 "Nạn nhân"
  game_concept_victim_possessive:0 "Nạn nhân"
  game_concept_victims_possessive:0 "Nạn nhân"
  game_concept_victim_desc:0 "$game_concept_victim$ là [child|E] người hiện đang bị $game_concept_child$, khác quấy rối, thường vì những lý do không rõ ràng với bất kỳ ai ngoài [bully|E] của họ. Khi đến [adulthood|E], họ có thể trở thành [rivals|E] với $game_concept_bully$ của họ, hoặc học cách buông bỏ phấn đấu của tuổi trẻ đằng sau họ."

  game_concept_crush:0 "Người Mến mộ"
  game_concept_crushes:0 "Người Mến mộ"
  game_concept_crush_possessive:0 "Người Mến mộ"
  game_concept_crushes_possessive:0 "Người Mến mộ"
  game_concept_crush_desc:0 "$game_concept_crush$ là một [child|E] khác mà $game_concept_child$ này đang phát triển cảm xúc đầu tiên (khá bối rối - lúng túng) của họ. Khi đến [adulthood|E], nếu $game_concept_crush$ là của nhau, nó có thể nảy nở trở thành [lovers|E], hoặc [character|E] có thể tiếp tục cuộc sống của họ."

  game_concept_blood_brother:  "Huynh đệ Kết nghĩa"
  game_concept_blood_brothers:  "Huynh đệ Kết nghĩa"
  game_concept_blood_brother_possessive:  "Bạn tốt"
  game_concept_blood_brothers_possessive:  "Bạn tốt"
  game_concept_blood_brother_desc:  "$game_concept_blood_brother$ là một dạng đặc biệt của [friend|E] và [ally|E]. Các [characters|E] chỉ có thể có một $game_concept_blood_brother$: $game_concept_blood_brother$ này trở thành thành viên tượng trưng của gia đình họ (và do đó, không được coi là [family|E]). Nếu lời kêu gọi [war|E] của $game_concept_blood_brother$ bị từ chối, thì [relation|E] sẽ bị phá vỡ và cả hai sẽ trở thành [rivals|E].\n\nHuynh đệ Kết nghĩa, [children|E], và Phối ngẫu Chính của họ đã tăng cường [opinion|E] chung và có thể thương lượng [alliances|E] với nhau.\n\nHuynh đệ Kết nghĩa có sẵn thông qua [nomadic_government|E], [trait|E] [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )], hoặc thông qua [tradition|E]."

  game_concept_modifier:0 "Sửa đổi"
  game_concept_modifiers:0 "Sửa đổi"
  game_concept_modifier_desc:0 "$game_concept_modifier$ là một ảnh hưởng thay đổi giá trị trong một khoảng thời gian dài hơn. Ví dụ: nó có thể thay đổi giá trị [skills|E] của nhân vật hoặc [success_chance|E] của [scheme|E].\n\nSửa đổi thường xuất hiện cho Nhân vật, Âm mưu hoặc [counties|E]."

  game_concept_character_modifier:0 "Sửa đổi Nhân vật"
  game_concept_character_modifiers:0 "Sửa đổi Nhân vật"
  game_concept_character_modifier_desc:2 "[modifiers|E] do một Nhân vật nắm giữ, ảnh hưởng đến tính cách, [skills|E], và thậm chí [income|E]. Không giống như [traits|E], $game_concept_character_modifiers$ có xu hướng đại diện cho các ảnh hưởng tạm thời."

  game_concept_critical_failure:0 "Thất bại Nghiêm trọng"
  game_concept_critically_fail:0 "Thất bại Nghiêm trọng"
  game_concept_critical_failure_desc:0 "Một số [schemes|E] có khả năng $game_concept_critical_failure$ trong quá trình thực thi.\n\nKết quả chính xác có thể khác nhau, bao gồm cả việc $game_concept_scheme$ phản tác dụng đối với [scheme_owner_owner|E], hoặc ngăn cản họ thực hiện cùng một $game_concept_scheme$ nhắm vào cùng một [scheme_target_target|E] trong một thời gian."

  game_concept_espionage:1 "$task_find_secrets$"
  game_concept_espionage_desc:1 "$game_concept_espionage$ là [councillor_task|E] được thực hiện bởi [spymaster|E].\n\nNó nhắm vào [court|E] của [ruler|E], và cố gắng khám phá [secrets|E] về nhân vật ở đó."

  game_concept_disrupt_schemes:0 "$task_disrupt_schemes$"
  game_concept_disrupt_schemes_desc:1 "$game_concept_disrupt_schemes$ là một [councillor_task|E] được thực hiện bởi [spymaster|E].\n\nNó làm tăng [scheme_discovery_chance|E] của một [ruler|E], và làm chậm các hành động $game_concept_spymaster$ thù địch của các $game_concept_ruler$ khác, chẳng hạn như [espionage|E]."

  game_concept_increase_control:0 "$task_increase_control$"
  game_concept_increase_control_desc:0 "$game_concept_increase_control$ là [councillor_task|E] được thực hiện bởi [marshal|E].\n\nNó nhắm vào [county|E], nơi nó tăng [control|E], và xòa bỏ [county_corruption|E] theo thời gian."

  game_concept_manage_guards:0 "$task_manage_guards$"
  game_concept_manage_guards_desc:0 "$game_concept_increase_control$ là một [councillor_task|E] được thực hiện bởi [marshal|E].\n\nNó làm tăng [knight_effectiveness|E] và làm giảm [success_chance|E] [hostile_scheme|E] chống lại [liege|E] của thành viên nội các."

  game_concept_collect_taxes:0 "$task_collect_taxes$"
  game_concept_collect_taxes_desc:0 "$game_concept_collect_taxes$ là [councillor_task|E] được thực hiện bởi [steward|E].\n\nNó làm tăng tất cả các loại thuế trong [domain|E] cá nhân của nhân vật."

  game_concept_promote_culture:0 "$task_promote_culture$"
  game_concept_promote_culture_desc:1 "$game_concept_promote_culture$ là [councillor_task|E] được thực hiện bởi [steward|E].\n\nNó thay đổi [culture|E] của [county|E] để phù hợp với $game_concept_culture$ của nhà cai trị."
 
  game_concept_accept_culture:0 "$task_accept_culture$"
  game_concept_promoting_cultural_acceptance:0 "Thúc đẩy Chấp nhận"
  game_concept_accept_culture_desc:0 "$game_concept_accept_culture$ là một [councillor_task|E] được thực hiện bởi [steward|E].\n\nNó làm tăng [cultural_acceptance|E] giữa [culture|E] mục tiêu và $game_concept_culture$ của [rulerpossessive|E]."

  game_concept_theocratic_vassal:0 "Chư hầu Thần quyền"
  game_concept_theocratic_vassals:0 "Chư hầu Thần quyền"
  game_concept_theocratic_vassal_desc:0 "Các chư hầu có hình thái [theocratic_government|E].\n\nCách thức hoạt động của họ được xác định bởi các [doctrines|E] của [faithpossessive|E]."

  game_concept_ducal_conquest_casus_belli:0 "Biện minh Chiến tranh Chinh phục Công quốc"
  game_concept_ducal_conquest:0 "Chinh phục Công quốc"
  game_concept_ducal_conquest_casus_belli_desc:0 "[casus_belli|E] cho phép chiếm giữ lấy [counties|E] cần thiết để tạo ra một [uncreated_title|E] của hạng [duchy|E]."

  game_concept_vassalize_casus_belli:0 "Biện minh Chiến tranh Cưỡng bách Chư hầu hóa"
  game_concept_vassalization_casus_belli:0 "Cưỡng bách Chư hầu"
  game_concept_vassalized_casus_belli:0 "Cưỡng bách Chư hầu"
  game_concept_vassalize_casus_belli_desc:3 "[casus_belli|E] cho phép cưỡng bách [vassalization|E] một [ruler|E] láng giềng độc lập có xếp hạng thấp hơn. Được mở khóa bởi [perk|E] [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )].\n\nNgài có thể Chư hầu hóa bất kỳ Nhà cai trị nào không có nhiều hơn #V [EmptyScope.ScriptValue('vassalize_default_size')|0]#! [counties|E] trong [realm|E] của họ.\n\nGiới hạn này được tăng thêm bởi #P +[EmptyScope.ScriptValue('vassalize_growth_per_innovation')|0]#! cho mỗi đổi mới sau:\n$EFFECT_LIST_BULLET$#V $innovation_casus_belli$#!\n$EFFECT_LIST_BULLET$#V $innovation_chronicle_writing$#!\n$EFFECT_LIST_BULLET$#V $innovation_divine_right$#!\n$EFFECT_LIST_BULLET$#V $innovation_rightful_ownership$#!"

  game_concept_title_creation:0 "Tạo lập Tước vị"
  game_concept_create:0 "Tạo lập"
  game_concept_created:0 "Tạo lập"
  game_concept_create_title:0 "Tạo lập Tước vị"
  game_concept_created_title:0 "Tạo lập Tước vị"
  game_concept_uncreated_title:0 "Tước vị Chưa tạo lập"
  game_concept_title_creation_desc:2 "[ruler|E] kiểm soát phần lớn vùng đất [de_jure|E] của [titlepossessive|E] chưa được tạo sẽ có thể tạo Tước vị liên quan của nó. Tạo Tước vị tốn [gold|E], nhưng mang lại [prestige|E].\n\nChỉ có cấp bậc Tước vị [duchy|E], [kingdom|E] hoặc [empire|E] mới có thể được tạo.\n\nCửa sổ Vấn đề chứa danh sách tất cả Tước vị mà ngài hiện có thể tạo."

  game_concept_foreign_affairs:0 "$task_foreign_affairs$"
  game_concept_foreign_affairs_desc:0 "[councillor_task|E] được thực hiện bởi một [chancellor|E].\nĐối với [ruler|E] [independent|E], nó làm tăng quan điểm của những nhà cai trị độc lập khác về họ. Đối với một chư hầu, nó làm tăng quan điểm của các chư hầu khác cùng [liege|E] về họ."

  game_concept_domestic_affairs:0 "$task_domestic_affairs$"
  game_concept_domestic_affairs_desc:0 "[councillor_task|E] được thực hiện bởi [chancellor|E], làm tăng quan điểm của [vassals|E] trong [realm|E] đối với [liege|E]."

  game_concept_bestow_royal_favor:0 "$task_bestow_royal_favor$"
  game_concept_bestow_royal_favor_desc:0 "[councillor_task|E] được thực hiện bởi [chancellor|E], làm tăng quan điểm của các [vassals|E] trong [realm|E] đối với [liege|E] của họ."

  game_concept_integrate_title:  "$task_integrate_title$"
  game_concept_integrate_title_desc:  "Một [councillor_task|E] do [chancellor|E] thực hiện, giúp đẩy nhanh quá trình [de_jure_drift|E] của một [title|E]."

  game_concept_fabricate_claim:0 "$task_fabricate_claim$"
  game_concept_fabricate_claim_short:0 "Ngụy tạo Yêu sách"
  game_concept_fabricated_claims_short:0 "Ngụy tạo Yêu sách"
  game_concept_fabricating_claims:0 "Ngụy tạo Yêu sách"
  game_concept_fabricate_claim_desc:0 "[councillor_task|E] được thực hiện bởi [court_chaplain|E].\nNhắm mục tiêu một [county|E], và xây dựng tiến trình theo thời gian. Ở mức Tiến trình 100%, một [claim|E] có thể được ngụy tạo ra với chi phí là [gold|E]."

  game_concept_religious_relations:0 "$task_religious_relations$"
  game_concept_religious_relations_desc:0 "[councillor_task|E] được thực hiện bởi [court_chaplain|E].\nGia tăng quan điểm của những người cai trị cùng [faith|E] [theocratic|E] về nhân vật, và gia tăng [piety|E] nhận được hằng tháng."

  game_concept_interaction:0 "Tương tác"
  game_concept_interactions:0 "Tương tác"
  game_concept_interacting:  "Tương tác"
  game_concept_character_interaction:0 "Tương tác Nhân vật"
  game_concept_interaction_desc:0 "Các hành động được thực hiện bởi một nhân vật đối với một nhân vật khác. Chúng có thể có nhiều mục đích và tác dụng.\n\nMột số tương tác yêu cầu sự chấp thuận của nhân vật mục tiêu, trong khi một số tương tác có thể được thực hiện mà không cần nó.\n\nThông thường chúng được truy cập bằng cách click chuột phải trên một nhân vật để truy cập Menu Tương tác cho nhân vật mục tiêu, nhưng đôi khi chúng có sẵn thông qua các giao diện đặc biệt."

  game_concept_offer_vassalization:0 "Đề xuất Chư hầu"
  game_concept_offer_vassalization_interaction:0 "Tương tác Đề xuất Chư hầu"
  game_concept_offer_vassalization_desc:0 "Tương tác đề nghị [vassalage|E] với [ruler|E] [independent|E] của [title_rank|E] thấp hơn, thêm họ một cách hòa bình vào quốc gia."

  game_concept_extort_subjects_decision:0 "Quyết nghị Cưỡng đoạt Thần dân"
  game_concept_extort_subjects:0 "Tống tiền Thần dân"
  game_concept_extort_subjects_decision_desc:0 "[decision|E] đưa ra các cơ hội khác nhau để yêu cầu thêm [gold|E] từ các thần dân, với một mức giá khác..."

  game_concept_sell_titles_decision:0 "Quyết nghị Bán Tước vị"
  game_concept_sell_titles:0 "Bán Tước vị"
  game_concept_sell_titles_decision_desc:1 "Một [decision|E] cho phép bán những tước vị tầm thường — những tước vị có tầm quan trọng thuần túy mang tính biểu tượng. Chấp nhận lấy [gold|E] để đổi lấy [prestige|E]."

  game_concept_embrace_celibacy:0 "Chấp nhận Độc thân"
  game_concept_embrace_celibacy_decision:0 "Quyết nghị Chấp nhận Độc thân"
  game_concept_embrace_celibacy_desc:0 "Một [decision|E] cho phép một nhân vật có được [trait|E] [GetTrait('celibate').GetName( GetNullCharacter )] theo ý muốn."

  game_concept_abandon_celibacy:0 "Từ bỏ độc thân"
  game_concept_abandon_celibacy_decision:0 "Quyết định từ bỏ độc thân"
  game_concept_abandon_celibacy_desc:0 "Một [decision|E] cho phép một nhân vật mất [trait|E] [GetTrait('celibate').GetName( GetNullCharacter )] theo ý muốn."
 
  game_concept_convert_county:0 "$task_conversion$"
  game_concept_convert_county_desc:0 "[councillor_task|E] được thực hiện bởi [court_chaplain|E] nhắm vào [county|E] có đức tin khác với [liege|E].\nTiến trình tăng lên mỗi tháng và ở mức 100%, phần lớn Bá quốc Mục tiêu đã thay đổi từ Đức tin trước đây của họ thành Đức tin của Lãnh chúa.\n\nTốc độ chuyển đổi bị ảnh hưởng bởi nhiều yếu tố, bao gồm [learning_skill|E] của [councillor|E] và [fervor|E] của hai Đức tin."
  game_concept_convert:  "Chuyển đổi"
  game_concept_converted:  "Chuyển đổi"
  game_concept_converting:  "Chuyển đổi"
 
  game_concept_commission_epic:0 "$commission_epic_decision$"
  game_concept_commission_epic_decision:0 "Quyết nghị $commission_epic_decision$"
  game_concept_commission_epic_desc:0 "Một [decision|E] cho phép nhân vật trao đổi [gold|E] để lấy [artifact|E], bằng cách ủy thác thông qua một sử thi gia tộc.\nSử thi sẽ mang lại [dynasty_prestige|E] và cũng có thể trao tặng các phần thưởng khác tùy thuộc vào lựa chọn của ngài."

  game_concept_draw_up_new_charts:0 "$draw_up_new_charts_decision$"
  game_concept_draw_up_new_charts_decision:0 "Quyết nghị $draw_up_new_charts_decision$"
  game_concept_draw_up_new_charts_desc:0 "Một [decision|E] cho phép nhân vật trao đổi [gold|E] để lấy [artifact|E], bằng cách ủy thác thông qua một hành trình lữ hành mô tả những địa điểm họ đã đến thăm.\n[artifact|E] Hành trình sẽ mang lại những ảnh hưởng khác nhau tùy thuộc vào nơi ngài đã đến và những lựa chọn ngài đưa ra."

  game_concept_local_arbitration:0 "$local_arbitration_decision$"
  game_concept_local_arbitration_decision:0 "Quyết nghị $local_arbitration_decision$"
  game_concept_local_arbitration_desc:0 "Một [decision|E] cho phép một nhân vật cải thiện [county|E] ở vị trí hiện tại của họ."

  game_concept_exceptional_epic:0 "Sử thi Kệt xuất"
  game_concept_exceptional_epic_desc:0 "Sử thi Gia đình được viết thông qua Quyết nghị $commission_epic_decision$ có cơ hội trở thành Sử thi Kệt xuất, mang lại tiền thưởng lớn hơn sử thi bình thường.\n\nXác suất Sử thi Kệt xuất có thể bị ảnh hưởng bởi các lựa chọn sự kiện."

  game_concept_demand_payment:0 "Yêu cầu Thanh toán"
  game_concept_demand_payment_decision:0 "Tương tác Yêu cầu Thanh toán"
  game_concept_demand_payment_desc:0 "Tương tác ngoại giao cho phép một nhân vật yêu cầu thanh toán [gold|E] để đổi lấy bất kỳ [hooks|E] nào mà họ có."

  game_concept_independence_faction:0 "Phe phái Độc lập"
  game_concept_independence_factions:0 "Phe phái Độc lập"
  game_concept_faction_independence:0 "Độc lập"
  game_concept_independence_faction_desc:1 "$game_concept_independence_faction$ tìm kiếm sự độc lập cho tất cả các thành viên. Nếu thành công, họ sẽ [independent|E] khỏi [liege|E] của họ."

  game_concept_liberty_faction:0 "$liberty_faction$"
  game_concept_faction_liberty:0 "Tự do"
  game_concept_liberty_factions:0 "Phe phái Tự do"
  game_concept_liberty_faction_desc:1 "$game_concept_liberty_faction$ tìm cách hạ thấp [crown_authority|E], và nếu có thể, là cả [vassal_contracts|E] của chính họ. Nếu thành công, [liege|E] của họ sẽ không thể thay đổi Uy quyền Quân chủ của [realm|E] trong một thời gian."

  game_concept_claimant_faction:0 "$claimant_faction$"
  game_concept_claimant_factions:0 "Phe phái Kẻ đoạt quyền"
  game_concept_claimant_faction_desc:1 "$game_concept_claimant_faction$ tìm cách sắp đặt một [claimant|E] cụ thể lên ngai vàng của [title|E] nắm giữ bởi [liege|E] của họ. Nếu thành công, Lãnh chúa sẽ phải từ bỏ Tước vị cho Kẻ đoạt quyền và cấu trúc [vassal|E] sẽ được cập nhật cho phù hợp. Tất cả thành viên [faction|E] sẽ có được [hook|E] với Kẻ đoạt quyền."

  game_concept_peasant_faction:0 "$peasant_faction$"
  game_concept_peasant_factions:0 "Phe phái Nông dân"
  game_concept_peasant_faction_desc:2 "$game_concept_peasant_faction$ thuộc về [counties|E] với [county_opinion|E] thấp. Không giống như các [factions|E] khác, phe này sẽ luôn nổi dậy ngay cả khi [faction_military_power|E] thấp, vì nông dân nói chung đều lạc quan và mù chữ... Các cuộc nổi dậy của Nông dân thành công sẽ làm giảm đáng kể Kiểm soát trong [realm|E] vương quốc của ngài."

  game_concept_escalated_peasant_faction:  "$peasant_faction$ Leo thang"
  game_concept_escalated_peasant_factions:  "Phe phái Nông dân Leo thang"
  game_concept_escalated_peasant_faction_desc:  "$game_concept_escalated_peasant_faction$ được tạo thành từ các [counties|E] có [county_opinion|E] thấp, vốn đã áp đặt yêu cầu của [peasant_faction|E] lên một trong những [vassals|E] của ngài. Được lãnh đạo bởi một thủ lĩnh khét tiếng, phe phái này rất nguy hiểm và có khả năng tách khỏi [realm|E] của ngài."

  game_concept_popular_faction:0 "$populist_faction$"
  game_concept_popular_factions:0 "Phe phái Dân túy"
  game_concept_popular_faction_desc:0 "$game_concept_popular_faction$ thuộc về [counties|E] với [county_opinion|E] thấp có chung một yếu tố, chẳng hạn như [culture|E] hoặc [faith|E]. Họ tìm cách giải phóng và chọn [ruler|E] mới dựa trên Văn hóa hoặc Đức tin của họ. Kiểu khởi nghĩa này thường rất nguy hiểm."

  game_concept_buy_claim:0 "$buy_claim_interaction$"
  game_concept_buy_claim_interaction:0 "Tương tác $buy_claim_interaction$"
  game_concept_buy_claim_desc:2 "Một Tương tác cho phép một nhân vật mua [unpressed_claims|E] để đổi lấy [piety|E].\n\n$EFFECT_LIST_BULLET$[vassal|E] không được mua yêu sách đối với bất kỳ [title|E] [liege|E] nào, và một Lãnh chứ không được mua yêu sách đối với bất kỳ Tước vị của chư hầu nào\n$EFFECT_LIST_BULLET$[king|E] hoặc [emperor|E] không được mua yêu sách về Tước vị Vương quốc, và Hoàng đế không được mua yêu sách các đế quốc khác\n$EFFECT_LIST_BULLET$Không ai có thể mua yêu sách đối với [head_of_faith|E] của họ"

  game_concept_develop_county:0 "$task_develop_county$"
  game_concept_develop_county_desc:0 "[councillor_task|E] được thực hiện bởi [steward|E]. Nó nhắm vào một [county|E], nơi nó tăng tốc độ [development_growth|E] và giảm thời gian xây dựng cho [buildings|E]."
 
  game_concept_convince_dejure:0 "$task_convince_dejure$"
  game_concept_convince_dejure_desc:0 "[councillor_task|E] được thực hiện bởi [steward|E]. Nó nhắm vào [county|E] [de_jure|E] của [liege|E] của thành viên nội các được sở hữu bởi một [ruler|E] [independent|E]. Khi bá quốc bị thuyết phục, họ sẽ yêu cầu [ruler|E] trao trả chúng trở về với [liege|E] [de_jure|E] của họ."

  game_concept_organize_levies:  "$task_organize_levies$"
  game_concept_organize_levies_desc:  "Một [councillor_task|E] do [marshal|E] thực hiện. Nhiệm vụ này làm tăng Quy mô [garrison|E] và Tỷ lệ Tăng viện [levy|E] trong [realm|E] của [liege|E] của thành viên nội các."

  game_concept_hostile_army:0 "Thù địch"
  game_concept_hostile_army_desc:0 "[army|E] $game_concept_hostile_army$ có thể được tham gia giống như khi ngài tham gia [war|E] với chủ sở hữu, mặc dù sẽ không có [war_score|E] nào được đưa ra.\n\nSự thù địch là do ngài có lợi ích xung đột, bao gồm:\n$BULLET_WITH_TAB$Kẻ thù của [liege|E] của ngài\n$BULLET_WITH_TAB$[vassals|E] của kẻ thù của ngài\n$BULLET_WITH_TAB$Nhà cai trị #emphasis tấn công#! cùng một kẻ thù"

  game_concept_war_leaders:0 "Lãnh đạo Chiến tranh"
  game_concept_war_leader:0 "Lãnh đạo Chiến tranh"
  game_concept_war_leaders_desc:0 "Bên Tấn công chính và bên phòng thủ của [war|E]. Thông thường đây là nhân vật đã kích động chiến tranh và [top_liege|E] của nhân vật nắm giữ [war_target|E].\n\nCó nhiều loại [casus_belli|E] cho nhiều loại chiến tranh khác nhau, một số có các nhân vật khác nhau như $game_concept_war_leaders$."

  game_concept_offensive_war_opinion:0 "Quan điểm Chiến tranh Tấn công"
  game_concept_offensive_war_opinion_short:0 "Chiến tranh Tấn công"
  game_concept_offensive_war_opinion_desc:0 "Việc trở thành kẻ tấn công chính trong một cuộc chiến sẽ dần dần khiến [vassals|E] không thích ngài sau [GetDefine('NCharacterOpinion', 'OFFENSIVE_WAR_PENALTY_GRACE_PERIOD')] tháng. [civil_wars|E] và [great_holy_wars|E] bị loại khỏi điều này. Một khi không còn trong một cuộc chiến như vậy, hình phạt sẽ từ từ giảm xuống."
 
  game_concept_at_peace_opinion:0 "Quan điểm Hòa bình"
  game_concept_at_peace_opinion_short:0 "Hòa bình"
  game_concept_at_peace_opinion_desc:1 "Những nhân vật có [core_tenet|E] [GetFaithDoctrine('tenet_warmonger').GetBaseName] như một phần của [faith|E] của họ sẽ có '$game_concept_at_peace_opinion$' thay vì hình phạt [offensive_war_opinion|E].\n\nNếu ngài yên ổn quá lâu, [vassals|E] của ngài sẽ ít nghĩ về ngài #weak ((nếu họ có chung Đức tin với ngài).#!"

  game_concept_character:0 "Nhân vật"
  game_concept_characters:0 "Nhân vật"
  game_concept_character_possessive:0 "Nhân vật"
  game_concept_characters_possessive:0 "Nhân vật"
  game_concept_character_desc:0 "Các nhân vật là [noble|E] hoặc [lowborn|E], [landed|E] hoặc [unlanded|E], mỗi nhân vật có bộ [skills|E] hoặc [traits|E], mục tiêu và nguyện vọng. Họ có dạng [rulers|E], [courtiers|E] và [guests|E]. Miễn là họ ở trong [diplomatic_range|E], họ có thể được tương tác."

  game_concept_highlighted_text:0 "Văn bản Đánh dấu"
  game_concept_highlighted_text_desc:0 "Thông tin này dành cho ngài, bất cứ khi nào ngài không chắc chắn về khái niệm trò chơi.\n\n#TUT Ngài có thể di chuyển con trỏ của mình vào chú giải #EMP này#! để biết thêm thông tin! [highlighted_text_example|E]#!"
  game_concept_highlighted_text_example:0 "Tuyệt vời!"
  game_concept_highlighted_text_example_desc:0 "Tốt lắm!"
 
  game_concept_detail_zoom:1 "$ZOOM_LEVEL_DETAILS$"
  game_concept_detail_zoom_desc:1 "$ZOOM_LEVEL_DETAILS_TOOLTIP$"
  game_concept_political_zoom:0 "$ZOOM_LEVEL_POLITICAL$"
  game_concept_political_zoom_desc:0 "$ZOOM_LEVEL_POLITICAL_TOOLTIP$"
  game_concept_paper_zoom:0 "$ZOOM_LEVEL_PAPER_MAP$"
  game_concept_paper_zoom_desc:0 "$ZOOM_LEVEL_PAPER_MAP_TOOLTIP$"

  game_concept_tutorial_education_trait:0 "Đặc điểm Giáo dục"
  game_concept_tutorial_education_trait_i:0 "@tutorial_education_trait_icon!"
  game_concept_tutorial_education_trait_desc:0 "Petty King Murchad ([character|E] của ngài) theo [education|E] [martial|E]. Khi đến tuổi trưởng thành, anh ấy nhận được đặc điểm Kĩ năng Chiến thuật gia."

  game_concept_organized:0 "Có Tổ chức"
  game_concept_organized_desc:0 "[faith|E] có tổ chức có hệ thống phân cấp tôn giáo. Việc thờ cúng và thực hành có tổ chức hơn và kinh sách được chính thức hóa.\n\nĐức tin [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] và đức tin [GetReligionFamily('rf_pagan').GetName] có thể trở thành Có tổ chức bằng cách cải cách, trong khi các Đức tin khác luôn được coi là Có tổ chức."

  game_concept_flowery_war:0 "Cướp bóc Tù nhân"
  game_concept_flowery_wars:0 "Cướp bóc Tù nhân"
  game_concept_flowery_warring:0 "Cướp bóc Tù nhân"
  game_concept_flowery_war_desc:1 "Đây là một loại [war|E] đặc biệt, bắt đầu bởi một [ruler|E] có [faith|E] thực hành hiến tế con người. Mục tiêu chính của $game_concept_flowery_warring$ là chiến đấu và bắt giữ [prisoners|E] cho cúng tế, với một trong hai bên có thể đạt đủ [war_score|E] thông qua chiến đấu để giành chiến thắng mà không cần phải [siege|E].\n\nKết thúc $game_concept_war$, nếu bên chiến thắng (bao gồm cả bên phòng thủ) theo $game_concept_faith$ thực hành hiến tế con người, sau đó họ sẽ lấy vài $game_concept_prisoners$ từ [court|E] của kẻ thua cuộc. Nếu cả hai chiến binh chính trong $game_concept_flowery_war$ đều theo cùng một đức tin, thì cuộc chiến được coi là thiêng liêng, nghĩa là kẻ thua cuộc vẫn nhận được (giảm) [piety|E] ngay cả khi bị đánh bại.\n\nNgài không thể tiến hành hoặc tiếp tục $game_concept_flowery_war$ nếu ngài có bất kỳ $game_concept_prisoners$ nào có được khi thắng $game_concept_flowery_war$ trong [dungeon|E] của ngài."

  game_concept_partition_share:0 "Chia sẻ"
  game_concept_partition_share_desc:1 "Theo bất kỳ [succession_law|E] nào có nhiều [realm_heirs|E], [character_possessive|E] $game_concept_partition_share$ là [titles|E] mà $game_concept_heir$ cụ thể đó sẽ kế thừa [succession|E]. Thông thường, điều này có nghĩa là chia sẽ cho các con của [ruler|E], hoặc, hiếm hơn là anh chị em của họ.\n\nThông thường, tùy thuộc vào loại $game_concept_succession$ được sử dụng, $game_concept_titles$ có thể được chia đều giữa các [realms|E] đồng đều, trong cùng một $game_concept_realm$, hoặc được chia phần lớn cho $game_concept_heir$ chính trong khi chia đều phần còn lại cho bất kỳ $game_concept_heirs$ khác."

  game_concept_banish_reason:0 "Lý do Trục xuất"
  game_concept_banish_reasons:0 "Lý do Trục xuất"
  game_concept_banish_reason_desc:0 "$game_concept_banish_reason$ cho [liege|E] cơ hội tự do để [banish|E] bất kỳ đối tượng nào mà họ có trong [dungeon|E] của mình. Họ thường có được khi đối tượng là [criminal|E]."

  game_concept_imprisonment_reason:0 "Lý do Cầm tù"
  game_concept_imprisonment_reasons:0 "Lý do Cầm tù"
  game_concept_imprisonment_reason_desc:0 "$game_concept_imprisonment_reason$ cho [liege|E] cơ hội tự do để [imprison|E] một đối tượng. Họ thường có được khi đối tượng là [criminal|E]."

  game_concept_revoke_title_reason:0 "Lý do Tước đoạt Tước vị"
  game_concept_revoke_title_reasons:0 "Lý do Tước đoạt Tước vị"
  game_concept_revoke_title_reason_desc:0 "$game_concept_revoke_title_reason$ cho [liege|E] cơ hội tự do để [revoke|E] [title|E] khỏi một đối tượng. Họ thường có được khi đối tượng là [criminal|E]."

  game_concept_execute_reason:0 "Lý do Hành hình"
  game_concept_execute_reasons:0 "Lý do Hành hình"
  game_concept_execute_reason_desc:1 "$game_concept_execute_reason$ cho [liege|E] cơ hội tự do để [execute|E] đối tượng mà họ có trong [dungeon|E] của họ. Họ thường có được khi đối tượng là [criminal|E]."

  game_concept_movement_lock:0 "Khóa di Chuyển"
  game_concept_movement_locked:0 "Khóa di Chuyển"
  game_concept_movement_locked_desc:0 "Sau khi [army|E] đã hoàn thành hơn một nửa lệnh di chuyển, sẽ không thể thay đổi lệnh đó cho đến khi họ đến đích."
 
  game_concept_extramarital_sex:0 "Ngoại tình"
  game_concept_extramarital_sex_sleeping_with:0 "ngủ với"
  game_concept_extramarital_sex_desc:1 "Nếu bị phát hiện, hai nhân vật có quan hệ tình dục ngoài hôn nhân sẽ phải chịu hậu quả tùy thuộc vào [doctrines|E] của [faithpossessive|E] của họ.\n\n$EFFECT_LIST_BULLET$Mỗi nhân vật sẽ bị gọi là [GetTrait('fornicator').GetName( GetNullCharacter )] hoặc [GetTrait('adulterer').GetName( GetNullCharacter )], tùy thuộc vào tình trạng hôn nhân của họ\n$EFFECT_LIST_BULLET$Nếu một người nam và một người nữ ngủ cùng nhau, điều đó có thể dẫn đến mang thai [bastard|E]\n$EFFECT_LIST_BULLET$Nếu các nhân vật có cùng giới tính, hậu quả sẽ được xác định bởi [doctrine|E] $doctrine_homosexuality_name$ của [faithpossessive|E]\n$EFFECT_LIST_BULLET$Bất kỳ [diseases|E] lây truyền qua đường tình dục nào do một nhân vật mắc phải đều có thể lây nhiễm cho nhân vật kia"

  game_concept_titular_title:0 "Tước vị Danh dự"
  game_concept_titular_title_desc:0 "$game_concept_titular_title$ là [title|E] không có [de_jure|E] đất trên bản đồ. Các Tước vị phi Danh dự có thể trở thành Tước vị Danh dự thông qua [de_jure_drift|E].\n\n[mercenary|E], [head_of_faith|E] và Tước vị [holy_order|E] thường là Tước vị Danh dự."

  game_concept_pilgrimage:0 "Hành hương"
  game_concept_pilgrimages:0 "Hành hương"
  game_concept_pilgrimage_desc:2 "Nhân vật của hầu hết [faiths|E] có thể chọn thực hiện một [activity|E] để tiếp tục $game_concept_pilgrimage$ tới một [holy_site|E]. Mỗi [holy_site|E] có một khoảng thời gian riêng trước khi ngài có thể tiếp cận lại một lần nữa.\n\nMột hành trình như vậy có thể chứa đầy cơ hội và nguy hiểm, nhưng khi đến đích, các nhân vật sẽ nhận được [piety|E] và có thể nhận được các phần thưởng khác."

  game_concept_hajj:0 "Hajj"
  game_concept_hajjes:0 "Hajj"
  game_concept_hajj_desc:1 "Các nhân vật của hầu hết [faiths|E] Hồi Giáo có thể chọn thực hiện một [activity|E] để tham gia $game_concept_hajj$ đến Mecca như một phần trong các [doctrine|E] $game_concept_pilgrimage$ của họ mỗi năm một lần.\n\nNhư vậy cuộc hành trình có thể chứa đầy cả cơ hội và nguy hiểm, nhưng khi đến thành phố thần thánh, các nhân vật sẽ nhận được [piety|E] và có thể nhận được các phần thưởng khác."

  game_concept_faith_righteous:0 "Đúng đắn"
  game_concept_faith_righteous_desc:0 "[faith|E] này được coi là hợp pháp.\nViệc kết hôn là phổ biến.\n\n#S Ảnh hưởng:\n#![GetHostilityDescription( '(int32)0' )]"

  game_concept_faith_astray:0 "Lạc lối"
  game_concept_faith_astray_desc:0 "[faith|E] này khác ở những khía cạnh không đặc biệt quan trọng.\nViệc kết hôn vẫn có thể xảy ra.\n\n#S Ảnh hưởng:\n#![GetHostilityDescription( '(int32)1' )]"

  game_concept_faith_hostile:0 "Thù địch"
  game_concept_faith_hostile_desc:0 "[faith|E] này lầm đường lạc lối.\nViệc kết hôn vẫn có thể xảy ra, có thể phát động [holy_wars|E].\n\n#S Ảnh hưởng:\n#![GetHostilityDescription( '(int32)2' )]"

  game_concept_faith_evil:0 "Tà ác"
  game_concept_faith_evil_desc:0 "[faith|E] này bị nguyền rủa.\nViệc kết hôn hiếm khi xảy ra, có thể phát động [holy_wars|E].\n\n#S Ảnh hưởng:\n#![GetHostilityDescription( '(int32)3' )]"

  game_concept_faith_hostility:0 "Đức tin Thù địch"
  game_concept_faith_hostility_desc:1 "Tất cả [faiths|E] đều có mối quan hệ với nhau $game_concept_faith$ được xác định bởi mức độ liên quan chặt chẽ giữa chúng.\n\nSự gần gũi được quyết định bởi một số yếu tố, chẳng hạn như nếu chúng có chung [religion|E], [religious_family|E], hoặc nếu Đức tin có [doctrines|E] đặc biệt.\n\nNếu hai Đức tin ở xa nhau, họ thường có thể [holy_war|E] với nhau.\n\nTồn tại các mối quan hệ: [faith_righteous|L], [faith_astray|L], [faith_hostile|L], và [faith_evil|L]."
 
  game_concept_command_modifier:0 "Sửa đổi Chỉ huy"
  game_concept_command_modifier_desc:0 "[modifier|E] này chỉ hoạt động đối với [commanders|E].\n\nNếu một nhân vật có Sửa đổi Chỉ huy điều quản lý [army|E], nó sẽ có ảnh hưởng này."
  game_concept_command_modifier_i:0 "@command_modifier_icon!"
  game_concept_command_modifiers:  "Command Modifiers"

 #game_concept_pic: "@test_flower!"

  game_concept_nickname:0 "Biệt hiệu"
  game_concept_epithet:0 "Tôn hiệu"
  game_concept_cognomen:0 "Danh hiệu"
  game_concept_nicknames:0 "Biệt hiệu"
  game_concept_epithets:0 "Tôn hiệu"
  game_concept_cognomens:0 "Danh hiệu"
  game_concept_nickname_desc:1 "$game_concept_nicknames$, $game_concept_epithets$, và $game_concept_cognomens$ là tất cả các tên phụ được lấy hoặc gán cho [characters|E] (ví dụ. Charles 'Hói'). $game_concept_nicknames$ hoàn toàn mang tính thẩm mỹ, mặc dù hoàn cảnh xung quanh việc giành được chúng thường là những vấn đề kịch tính hoặc đáng chú ý.\n\n$game_concept_nicknames$ xấu đôi khi sẽ được thay thế bởi những điều tốt (chẳng hạn như William 'Con hoang' trở thành William 'Nhà Chinh Phạt')."

  game_concept_main_phase:0 "Giai đoạn Chính"
  game_concept_main_phase_desc:0 "Trong Giai đoạn Chính của [battle|E], [soldiers|E] và [knights|E] từ hai bên giao chiến với nhau.\n\nGiai đoạn Chính kết thúc khi tất cả quân của một bên đã [casualties|E] hoặc một bên đã quyết định [retreat|E].\n\nSau Giai đoạn Chính, trận chiến bước vào [aftermath|E]."

  game_concept_personality_trait:0 "Đặc điểm Tính cách"
  game_concept_personality_traits:0 "Đặc điểm Tính cách"
  game_concept_personality_trait_desc:1 "$game_concept_personality_trait$ là một [trait|E] xác định thế giới quan của một người và những hành động họ có nhiều khả năng thực hiện nhất. Chúng cũng ảnh hưởng đến [opinion|E] của người khác. Một người có thể mất và nhận được những đặc điểm mới trong suốt cuộc đời của mình. Hành động chống lại Tính cách của chính ngài gây ra [stress|E]."

  game_concept_lifestyle_trait:0 "Đặc điểm Lối sống"
  game_concept_lifestyle_traits:0 "Đặc điểm Lối sống"
  game_concept_lifestyle_trait_desc:1 "$game_concept_lifestyle_trait$ là kết quả của việc chọn một số perks [lifestyle|E], [decisions|E], hoặc [interactions|E].\n\nMột số đặc điểm Lối sống có thể nâng cấp khi nhân vật cải thiện khả năng thành thạo kỹ năng. cấp độ nằm trong khoảng từ 1-3, và các ngôi sao trên biểu tượng đặc điểm cho biết cấp độ hiện tại."

  game_concept_physical_trait:0 "Đặc điểm Thể chất"
  game_concept_physical_traits:0 "Đặc điểm Thể chất"
  game_concept_physical_trait_desc:1 "$game_concept_physical_trait$ là một mô tả [trait|E] thể chất gắn liền với ngoại hình hoặc hành vi của họ, và mức độ trí tuệ của một nhân vật. Nhiều đặc điểm ngoại hình ảnh hưởng đến mức độ [attracted|E] người khác đối với họ.\n\nChúng thường là [congenital|E], do đó có được khi sinh ra và vĩnh viễn."

  game_concept_fame_trait:0 "Đặc điểm Danh tiếng"
  game_concept_fame_traits:0 "Fame Traits"
  game_concept_fame_trait_desc:1 "$game_concept_fame_trait$ là một [trait|E] đặc biệt có được từ những hoàn cảnh cụ thể và ảnh hưởng đến [opinion|E] của người khác về họ. Một người có thể nhận được những đặc điểm này khi hoàn thành một hành động tích cực hoặc khi [secrets|E] bị phơi bày. Với những người khác là kết quả của hoàn cảnh của một người khi sinh ra."

  game_concept_health_trait:0 "Đặc điểm Sức khỏe"
  game_concept_health_trait_desc:1 "$game_concept_health_trait$ là một [trait|E] ảnh hưởng trực tiếp đến [health|E] thể chất và tinh thần, chẳng hạn như [diseases|E]. Các đặc điểm tạm thời ảnh hưởng đến khả năng cơ thể, chẳng hạn như mang thai và vết thương cũng thuộc loại này.\n\nCác [characters|E] già có thể nhận được [Concept( 'elder_traits', 'Đặc điểm Người cao tuổi' )|E]."

  game_concept_modifier_contribution:0 "Đóng góp"
  game_concept_modifier_contributions:0 "Đóng góp"
  game_concept_modifier_contributes:0 "Đóng góp"
  game_concept_modifier_contribution_desc:0 "[modifier|E] có thể thay đổi $game_concept_modifier_contribution$ của [obligations|E] [vassals|E] của ngài. Điều này không giống với [modifier_base_contribution|E].\n\nNếu ngài có [vassal] trả cho ngài #V 1#! [gold|E] mỗi tháng, và ngài nhận được [modifier] giúp tăng $game_concept_modifier_contribution$ #V 10%#!, thì sau đó [vassal] sẽ trả cho ngài #V 1.1#! [gold]."
 
  game_concept_modifier_base_contribution:0 "Đóng góp Cơ bản"
  game_concept_modifier_base_contributions:0 "Đóng góp Cơ bản"
  game_concept_modifier_base_contributes:0 "Đóng góp Cơ bản"
  game_concept_modifier_base_contribution_desc:0 "[modifier|E] có thể thay đổi $game_concept_modifier_base_contribution$ của [obligations|E] [vassals|E] của ngài. Điều này không giống với [modifier_contribution|E].\n\nNếu ngài có [vassal] mà có tổng [income|E] là #V 10#! [gold|E] và trả cho ngài #V 1#! [gold] mỗi tháng, và ngài nhận được [modifier] giúp tăng $game_concept_modifier_base_contribution$ #V 10%#!, thì sau đó [vassal] sẽ trả cho ngài #V 2#! [gold]."
 
  game_concept_maneuver:0 "Điều động"
  game_concept_maneuver_desc:0 "Giai đoạn $game_concept_maneuver$ xảy ra khi bắt đầu [battle|E] và cho biết thời gian cần thiết trước khi [main_phase|E] bắt đầu, và [armies|E] giao chiến với nhau."
 
  game_concept_combat_phase:0 "Giai đoạn Chiến đấu"
  game_concept_combat_phase_desc:0 "$game_concept_combat_phase$ là một phần của [battle|E]. Các trận chiến có ba giai đoạn riêng biệt; [maneuver|E], [main_phase|E], và [aftermath|E]."

  game_concept_unreformed_pagan_combat_bonus:1 "Lợi thế Chiến đấu Ngoại giáo Chưa cải cách"
  game_concept_unreformed_pagan_combat_bonus_desc:1 "[faiths|E] [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] [GetReligionFamily('rf_pagan').GetName] nhận được [advantage|E] [battle|E] ở [counties|E] của đức tin của họ."
 
  game_concept_personality:0 "Tính cách"
  game_concept_character_personality:0 "Tính cách Nhân vật"
  game_concept_personalities:0 "Tính cách"
  game_concept_personality_desc:1 "Các nhân vật sẽ hành động đối xử với ngài và những người khác theo Tính cách của họ, điều này chủ yếu được xác định bởi [personality_traits|E] của họ."
 
  game_concept_economical_archetype:0 "Nguyên mẫu Kinh tế"
  game_concept_economical_archetype_desc:0 "Nguyên mẫu Kinh tế của một [rulerpossessive|E] ảnh hưởng đến cách họ quyết định chi tiêu [gold_i][gold|E] của mình. Điều này phần lớn dựa trên các [traits|E] của họ.\n\n#low Nguyên mẫu Kinh tế gồm:#!\n$EFFECT_LIST_BULLET$[ai_warlike_personality|E]\n$EFFECT_LIST_BULLET$[ai_cautious_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_boom_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_unpredictable_personality|E]\n$EFFECT_LIST_BULLET$[ai_conqueror_personality|E]"
 
  game_concept_gift:0 "Quà tặng"
  game_concept_gifts:0 "Quà tặng"
  game_concept_send_gift:0 "Gửi Quà tặng"
  game_concept_gift_desc:0 "Gửi Quà tặng cho nhân vật khác sẽ tăng [opinion|E] của họ về ngài để đổi lấy [gold|E][gold_i].\n\nNgười nhận càng tham lam thì ngài càng phải gửi nhiều Vàng và càng có nhiều Quan điểm ngài sẽ nhận được.\n\n[diplomacy|E] của ngài càng cao, càng nhiều Quan điểm ngài nhận được."

  game_concept_vote_strength:0 "Sức mạnh Lá phiếu"

  game_concept_valuable_prisoner:  "Tù nhân Có giá trị"
  game_concept_valuable_prisoners:  "Tù nhân Có giá trị"
  game_concept_valuable_prisoner_desc:0 "$game_concept_valuable_prisoner$ là một [prisoner|E] mang lại [war_score|E] khi bị bắt trong [war|E].\n\nĐể một người được coi là $game_concept_valuable_prisoner$, họ phải đứn thứ ba trở lên trong hàng kế vị trước vị chính của nhà lãnh đạo cuộc chiến của họ.\n\n$game_concept_valuable_prisoners$ được phóng thích khi chiến tranh kết thúc, không giống như [prisoners_of_war|E]."
  game_concept_prisoner_of_war:0 "Tù nhân Chiến tranh"
  game_concept_prisoners_of_war:0 "Tù nhân Chiến tranh"
  game_concept_prisoner_of_war_desc:1 "$game_concept_prisoner_of_war$ là một [prisoner|E], người bị bắt trong [war|E], nhưng nó không mang lại [war_score|E] quan trọng nào cho những kẻ bắt giữ.\n\n[valuable_prisoners|E] được phóng thích khi chiến tranh kết thúc, không giống như tù nhân chiến tranh, nhưng vẫn có thể được đòi tiền chuộc để được tự do."

  game_concept_single_combat_fight:0 "Giao đấu Tay đôi"
  game_concept_single_combat_duel:0 "Quyết đấu"
  game_concept_single_combat_fight_plural:0 "Giao đấu Tay đôi"
  game_concept_single_combat_duel_plural:0 "Quyết đấu"
  game_concept_single_combat_fight_sudden_death:0 "Đột tử"
  game_concept_single_combat_fight_desc:0 "Trong trận $game_concept_single_combat_fight$, hai [characters|E] chiến đấu, hoặc [character_death_death|E] hoặc đến giọt máu đầu tiên. Mỗi hiệp, cả hai $game_concept_characters$ chọn một tùy chọn được cuộn xúc xắc nhiên từ danh sách, tung ra các đòn cho đến khi một $game_concept_character$ đạt được thành công vững chắc, với các tùy chọn có sẵn tùy thuộc vào [prowess|E] và [traits|E] của ngài.\n\nMột số tùy chọn có thể mang lại ảnh hưởng đặc biệt và hầu hết sẽ làm tăng [single_combat_success_chance|E] và [single_combat_injury_chance|E] của ngài. Khi $game_concept_single_combat_duel_plural$ tiếp tục, họ trở nên nguy hiểm và không vững chắn, đồng thời chiến thắng hoặc tự làm tổn thương bản thân trở nên dễ dàng hơn. Sau vài hiệp, $game_concept_single_combat_duel_plural$ đột tử, kết thúc ngay lập tức với chiến thắng $game_concept_prowess$ cao hơn.\n\nKhi chiến đấu với $game_concept_single_combat_duel_plural$, ngài có thể tăng tạm thời [single_combat_prowess_bonus|E] hoặc [character_modifiers|E] [single_combat_prowess_malus|E], tăng hoặc giảm $game_concept_prowess$ của ngài cho đến khi trận $game_concept_single_combat_duel$ kết thúc."
  game_concept_single_combat_success_chance:0 "Khả năng Thành công"
  game_concept_single_combat_success_chance_skill:0 "Quyết đấu Thành công"
  game_concept_single_combat_success_chance_desc:0 "Khi diễn ra $game_concept_single_combat_fight$, $game_concept_single_combat_success_chance$ của ngài thể hiện mức độ ngài thể hiện trong $game_concept_single_combat_duel$. Để giành chiến thắng, ngài phải giành được $game_concept_single_combat_success_chance$ của mình để vượt xa đối thủ.\n\nKhi các hiệp tiếp tục diễn ra, việc giành chiến thắng trở nên dễ dàng hơn, nghĩa là ngài cần ít bị đối thủ dẫn trước hơn.\n\nĐối ngược của $game_concept_single_combat_success_chance$ là [single_combat_injury_chance|E]."
  game_concept_single_combat_injury_chance:0 "Rủi ro Thương tật"
  game_concept_single_combat_injury_chance_injure:0 "Thương tật"
  game_concept_single_combat_injury_chance_injury_risk:0 "Rủi ro Thương tật"
  game_concept_single_combat_injury_chance_desc:0 "[characters|E] trong trận $game_concept_single_combat_fight_plural$ có nguy cơ tự làm tổn thương bản thân, do vô tình để mở sơ hở với đối thủ hoặc đơn giản là tự gây thương tích bằng chính vũ khí của mình. Khi chiến đấu, họ cũng tạo ra $game_concept_single_combat_injury_chance$.\n\n$game_concept_single_combat_duel_plural$ càng lâu càng dễ tự làm tổn thương bản thân.\n\nĐối ngược của $game_concept_single_combat_injury_chance$ là [single_combat_success_chance|E]."
  game_concept_single_combat_prowess_bonus:0 "Phần thưởng Lợi thế Quyết đấu"
  game_concept_single_combat_prowess_bonus_desc:0 "Với [characters|E] $game_concept_single_combat_duel$, họ có thể đạt được lợi thế tạm thời, chẳng hạn như bằng cách tận dụng [terrain|E] hoặc [traits|E] đặc biệt. Điều này làm tăng [prowess|E] của họ trong thời gian diễn ra trận đấu hiện tại, và bị mất ngay sau đó.\n\nĐiều ngược lại với $game_concept_single_combat_prowess_bonus$ là [single_combat_prowess_malus|E]."
  game_concept_single_combat_prowess_malus:1 "Hình phạt Lợi thế Quyết đấu"
  game_concept_single_combat_prowess_malus_desc:1 "Với [characters|E] $game_concept_single_combat_duel$, họ có thể bị bất lợi tạm thời, thường là do đối thủ của họ làm tổn thương hoặc đe dọa họ. Điều này làm giảm [prowess|E] của họ trong thời gian diễn ra trận đấu hiện tại, nhưng sẽ lấy lại ngay lập tức sau đó.\n\nĐiều ngược lại với $game_concept_single_combat_prowess_malus$ là [single_combat_prowess_bonus|E]."

  game_concept_game_over:0 "Kết thúc Trò chơi"
  game_concept_game_over_desc:0 "Trò chơi kết thúc khi dòng dõi hiện tại của ngài đã chết hết.\n\nTuy nhiên, ngay cả khi trò chơi kết thúc đối với dòng dõi của ngài, ngài vẫn có thể chọn chơi với tư cách một [ruler|E] khác ở bất kỳ đâu trên thế giới.\n\nTrò chơi có thể kết thúc theo hai cách:\n$BULLET_WITH_TAB$Ngài chết mà không có [player_heir|E]\n$BULLET_WITH_TAB$Ngài đạt đến năm 1453"

  game_concept_de_jure_partition:0 "Phân chia De Jure"
  game_concept_de_jure_partitioned:0 "Phân chia De Jure"
  game_concept_de_jure_partition_desc:0 "[realms|E] đã được $game_concept_de_jure_partitioned$ chia thành hai [titles|E] [title_tier|E] giống nhau, nhưng vẫn có thể được tái hợp dễ dàng.\n\n$game_concept_title$ có thể [de_jure_drift_drift|E] các [duchies|E] [completely_controlled|E] từ $game_concept_title$ khác vào [de_jure|E] của nó ngay lập tức thông qua [decision|E].\n\nNếu $game_concept_title$ đã từng bị hủy hoại hoặc mất đi các [counties|E] $game_concept_de_jure$ cuối cùng của nó, thì $game_concept_title$ còn lại sẽ hấp thụ tất cả $game_concept_de_jure$ của nó."

  game_concept_hybrid_culture:0 "Văn hóa Dung hợp"
  game_concept_hybrid_cultures:0 "Văn hóa Dung hợp"
  game_concept_hybridize:0 "Dung hợp"
  game_concept_hybridized:0 "Dung hợp"
  game_concept_hybridizing:0 "Dung hợp"
  game_concept_hybridizes:0 "Dung hợp"
  game_concept_hybrid_culture_desc:0 "[SelectLocalization( HasDlcFeature( 'hybridize_culture' ), 'game_concept_hybrid_culture_desc_DLC', 'game_concept_hybrid_culture_desc_NO_DLC' )]"
  game_concept_hybrid_culture_desc_DLC:1 "$game_concept_hybrid_culture$ là một [culture|E] được tạo ra bởi một [ruler|E] là sự kết hợp của hai Văn hóa hiện có.\n\n$game_concept_hybrid_culture$ là sự pha trộn của hai [traditions|E] Văn hóa, [culture_pillars|E], và Thẩm mỹ.\n\nChỉ những nền Văn hóa thuộc về [heritage|E] khác nhau mới có thể tạo thành một Văn hóa Dung hợp và chi phí [prestige|E] để thực hiện dựa trên [cultural_acceptance|E] của chúng với nhau.\n\nMức độ Chấp nhận Văn hóa càng cao, thì càng nhiều [counties|E] sẽ chuyển đổi khi hình thành Văn hóa Dung hợp. Các nhà cai trị của một nền Văn hóa Dung hợp [promote_culture|E] nhanh hơn nhiều ở các Bá quốc của nền văn hóa mẹ của nó trong #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! sau khi nó hình thành.\n\nVăn hóa mới cũng có thể xuất hiện dưới dạng [divergent_culture|E]."
  game_concept_hybrid_culture_desc_NO_DLC:0 "$game_concept_hybrid_culture$ là một [culture|E] được hình thành từ sự kết hợp của hai Văn hóa khác.\n\nVăn hóa mới cũng có thể xuất hiện dưới dạng [divergent_culture|E]."
  game_concept_divergent_culture:0 "Văn hóa Phân nhánh"
  game_concept_divergent_cultures:0 "Văn hóa Phân nhánh"
  game_concept_diverge:0 "Phân nhánh"
  game_concept_diverges:0 "Phân nhánh"
  game_concept_divergent_culture_desc:0 "[SelectLocalization( HasDlcFeature( 'diverge_culture' ), 'game_concept_divergent_culture_desc_DLC', 'game_concept_divergent_culture_desc_NO_DLC' )]"
  game_concept_divergent_culture_desc_DLC:1 "$game_concept_divergent_culture$ là một nhánh của [culture|E] hiện có, được tạo ra bởi một [ruler|E].\n\n$game_concept_divergent_culture$ giữ [heritage|E] của nó, nhưng các khía cạnh khác của Văn hóa gốc có thể được thay đổi.\n\nVăn hóa được phân nhánh từ phải có ít nhất [EmptyScope.ScriptValue('culture_divergence_cooldown')|0] năm tuổi, và chi phí [prestige|E] để phân nhánh dựa trên [realm_size|E] của Nhà cai trị tạo ra.\n\nVăn hóa mới cũng có thể xuất hiện dưới dạng là một [hybrid_culture|E]."
  game_concept_divergent_culture_desc_NO_DLC:0 "$game_concept_divergent_culture$ là một nhánh của [culture|E] hiện có.\n\nVăn hóa mới cũng có thể xuất hiện dưới dạng là một [hybrid_culture|E]."

  game_concept_winter:0 "Mức độ Khắc nghiệt Mùa đông"
  game_concept_winter_desc:0 "Mùa đông dần dần làm cạn kiệt [supply|E] theo thời gian, khiến quân đội mất Nguồn cung khi đứng trong một nam tước bị ảnh hưởng bởi Mùa đông. Hình phạt Nguồn cung tăng theo từng mức độ nghiêm trọng. Mùa đông có ba mức độ nghiêm trọng khác nhau; [Concept( 'winter_severity_mild', 'Nhẹ' )|E], [Concept( 'winter_severity_normal', 'Bình thường' )|E], và [Concept( 'winter_severity_harsh', 'Khắc nghiệt' )|E]."
  game_concept_winter_severity_mild:0 "Mùa đông Ôn hòa"
  game_concept_winter_severity_mild_desc:1 "[GetModifier( 'winter_mild_modifier' ).GetDescWithEffects]"
  game_concept_winter_severity_normal:0 "Mùa đông Bình thường"
  game_concept_winter_severity_normal_desc:1 "[GetModifier( 'winter_normal_modifier' ).GetDescWithEffects]"
  game_concept_winter_severity_harsh:0 "Mùa đông Khắc nghiệt"
  game_concept_winter_severity_harsh_desc:1 "[GetModifier( 'winter_harsh_modifier' ).GetDescWithEffects]"

  game_concept_deceitful_progress_hostile_schemes_decision:0 "Quyết nghị $deceitful_progress_hostile_schemes_decision$"
  game_concept_deceitful_progress_hostile_schemes_decision_desc:1 "Một [decision|E] cho phép ngài cải thiện [hostile_schemes|E] của mình. Nhận được [success_chance|E] và [scheme_speed|E] và đổi lại là [stress|E]."

  game_concept_diligent_development_focus_decision:0 "Quyết nghị $diligent_development_focus_decision$"
  game_concept_diligent_development_focus_decision_desc:0 "[decision|E] cho phép ngài cải thiện [capital|E] của mình. Chấp nhận [development|E] để đổi lấy [stress|E]."

  game_concept_impatient_rushing_all_schemes_decision:0 "Quyết nghị $impatient_rushing_all_schemes_decision$"
  game_concept_impatient_rushing_all_schemes_decision_desc:0 "Một [decision|E] cho phép ngài đẩy nhanh [scheme|E] của mình. Nhận được [scheme_opportunity_opportunities|E] và đổi lại là [stress|E]."

  game_concept_dismiss_strong_hook_interaction:0 "Tương tác $dismiss_strong_hook_interaction$"
  game_concept_dismiss_strong_hook_interaction_desc:0 "[interaction|E] cho phép ngài loại bỏ [hook|E] nhắm vào ngài để đổi lấy [prestige|E]."

  game_concept_abandon_hook_interaction:0 "Tương tác $abandon_hook_interaction$"
  game_concept_abandon_hook_interaction_desc:0 "[interaction|E] cho phép ngài từ bỏ [hook|E] mà ngài có để đổi lấy [stress_loss_i][stress|E] mấ đi."

  game_concept_force_duel_criminals_interaction:0 "Tương tác $force_duel_criminals_interaction$"
  game_concept_force_duel_criminals_interaction_desc:0 "[interaction|E] cho phép ngài tham gia trận [single_combat_duel|E] với bọn tội phạm khi ngài bị [stressed|E]."

  game_concept_force_duel_anyone_interaction:0 "Tương tác $force_duel_anyone_interaction$"
  game_concept_force_duel_anyone_interaction_desc:0 "[interaction|E] cho phép ngài tham gia trận [single_combat_duel|E] với bất kỳ ai khi ngài bị [stressed|E]."

  game_concept_artifact_rarity:0 "Bảo vật Hiếm có"
  game_concept_rarity:0 "Hiếm có"
  game_concept_artifact_rarity_desc:0 "Một số [artifacts|E] hiếm hơn những bảo vật khác, điều này được phản ánh ở độ Hiếm có của chúng.\n\nCác cấp độ, từ thấp nhất đến cao nhất:\n$BULLET_WITH_TAB$Phổ biến (không bao giờ được hiển thị vì nó là mặc định)\n$BULLET_WITH_TAB$$masterwork$\n$BULLET_WITH_TAB$$famed$\n$BULLET_WITH_TAB$$illustrious$"

  game_concept_promote_other_culture_development_decision:0 "Quyết nghị $promote_other_culture_development_decision_name$"
  game_concept_promote_other_culture_development_decision_desc:0 "Một [decision|E] cho phép ngài cải thiện [development|E], [control|E], chi phí [building|E], và [advantage|E] phòng thủ ở các [counties|E] từ các [cultures|E] khác nhau với [cultural_acceptance|E] là #V 75%#! trở lên.\n\nViệc đưa ra Quyết nghị cũng sẽ làm tăng [prestige|E] [prestige_i] và [levies|E].\n\nTất cả các Bá quốc trong [realm|E] đều bị ảnh hưởng. Chi phí [gold|E] thay đổi theo số lượng các Bá quốc bị ảnh hưởng."

  game_concept_reform:0 "Cải cách"
  game_concept_reformation:0 "Cải cách Tôn giáo"
  game_concept_reformation_desc:0 "[culture_head|E] có thể thay đổi một số phần nhất định trong [culture|E] của họ thông qua $game_concept_reformation$. Đây là một quá trình mất nhiều thời gian và không thể dừng lại sau khi bắt đầu.\n\nCác phần có thể cải cách là:\n$BULLET_WITH_TAB$[traditions|E]\n$BULLET_WITH_TAB$[ethos|E]\n$BULLET_WITH_TAB$[martial_custom|E]"

  game_concept_buy_artifact_claim:0 "$buy_artifact_claim_interaction$"
  game_concept_buy_artifact_claim_interaction:0 "Tương tác $buy_artifact_claim_interaction$"
  game_concept_buy_artifact_claim_desc:0 "Một Tương tác cho phép một nhân vật mua [personal_artifact_claims|E] để đổi lấy [piety|E] hoặc [prestige|E]."

  game_concept_vassal_contract:0 "Hợp đồng Chư hầu"
  game_concept_vassal_contracts:0 "Hợp đồng Chư hầu"
  game_concept_vassal_contract_desc:0 "$game_concept_vassal_contracts$ quy định các [obligations|E] giữa một [vassal|E] và [liege|E].\n\nCác chư hầu $game_concept_government_forms$ [feudal|E], [clan|E], [administrative|E] và [nomadic|E] có quyền truy cập vào các [obligations|E] khác nhau, được thương lượng riêng cho từng Chư hầu.\n\nTất cả các Chư hầu phải chi trả một tỷ lệ phần trăm tổng số [taxes|E] và [levies|E] cho Lãnh chúa, dựa trên [obligations|E] của họ. #EMP Các [modifier_contributions|E] này có thể được sửa đổi bằng các tùy chọn 'in nhỏ' chẳng hạn như [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\nMột số Hợp đồng Đặc biệt bị giới hạn ở một số Cấp bậc nhất định:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] và [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] trở lên\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] trở lên\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: Chỉ [count|E]\n\n#weak Lưu ý, các [obligations|E] của [governor|E] cũng được gọi là [province_administrations|E].#!"

  game_concept_vassal_directive:  "Chỉ thị Chư hầu"
  game_concept_vassal_directives:  "Chỉ thị Chư hầu"
  game_concept_directive:  "Chỉ thị"
  game_concept_directives:  "Chỉ thị"
  game_concept_vassal_directive_desc:  "Với vai trò là một [liege|E], ngài có thể ban hành Chỉ thị cho các [vassals|E] của mình, tác động đến [councillor_tasks|E] của họ, và các [buildings|E] mà họ xây dựng.\n\nĐể ban hành Chỉ thị, ngài cần phải kích hoạt nó, chẳng hạn như bằng cách có #P 50#! hoặc nhiều hơn [opinion|E] với Chư hầu. Các [government_forms|E] nâng cao không yêu cầu điều này."

  game_concept_tributary_contract:  "Hợp đồng Triều cống"
  game_concept_tributary_contracts:  "Hợp đồng Triều cống"
  game_concept_tributary_contract_desc:  "$game_concept_tributary_contract$ quy định các [obligations|E] giữa một [tributary|E] và [suzerain|E] của họ.\n\nTất cả các nhân vật Triều cống đều có quyền tiếp cận các [obligations|E], khác nhau, được thương lượng riêng cho từng nhân vật Triều cống.\n\nCác nhân vật Triều cống trả một tỷ lệ phần trăm tổng [taxes|E], [levies|E], [herd|E], [prestige|E] hoặc thậm chí là [piety|E] cho Bá chủ, dựa trên [obligations|E] của họ."

  game_concept_board_game_match:0 "Trận đấu"
  game_concept_board_game:0 "Trò chơi Bàn cờ"
  game_concept_board_games:0 "Trò chơi Bàn cờ"
  game_concept_board_game_game:0 "Trò chơi"
  game_concept_board_game_match_desc:0 "Một trò chơi trên bàn cờ bao gồm hai người chơi thử vận may và kỹ năng của họ với nhau trong một trò chơi trí tuệ và may rủi. Chúng có thể được chơi như một trận giao hữu hoặc với một số hình thức cá cược.\n\n#weak Có nhiều [board_game_types|E] khác nhau, mặc dù cách [board_game_win|E] và cách chơi mỗi loại vẫn giống nhau. Chỉ có các kỹ năng được sử dụng là khác nhau.#!"

  game_concept_board_game_winning:0 "Chiến thắng"
  game_concept_board_game_win:0 "Chiến thắng"
  game_concept_board_game_winning_sudden_death:0 "Cái chết Bất ngờ"
  game_concept_board_game_winning_desc:0 "Chiến thắng một $game_concept_board_game$ có thể đạt được bằng một trong hai cách:\n$EFFECT_LIST_BULLET$ Có được điểm số ấn tượng trước đối thủ.\n$EFFECT_LIST_BULLET$ Là người phòng thủ nếu không có người chiến thắng rõ ràng sau vòng [EmptyScope.ScriptValue('bg_round_cap_value')|0]."

  game_concept_board_game_type:0 "Loại Trò chơi Bàn cờ"
  game_concept_board_game_types:0 "Loại Trò chơi Bàn cờ"
  game_concept_board_game_type_counter:1 "Khắc chế"
  game_concept_board_game_type_counters:0 "Khắc chế"
  game_concept_board_game_type_desc_guts:0 "Khi chơi một $game_concept_board_game$, đối thủ của ngài có các phong cách chơi khác nhau trong $game_concept_board_game_type_counter$. Việc chống lại các nước đi của họ sẽ làm giảm đáng kể số điểm họ nhận được từ chúng, ngay cả khi thành công. Các đối thủ có kỹ năng có thể lưu ý đến kỹ năng của chính ngài và cố tình cố gắng $game_concept_board_game_type_counter$ #EMP ngài#!."
  game_concept_board_game_type_desc:2 "$game_concept_board_game_type_desc_guts$\n\nCác trò chơi có sẵn là:\n$EFFECT_LIST_BULLET$ [board_game_type_chess|E]\n$EFFECT_LIST_BULLET$ [board_game_type_pachisi|E]\n$EFFECT_LIST_BULLET$ [board_game_type_hnefatafl|E]\n$EFFECT_LIST_BULLET$ [board_game_type_tabula|E]\n$EFFECT_LIST_BULLET$ [board_game_type_go|E]\n$EFFECT_LIST_BULLET$ [board_game_type_fidchell|E]"
  game_concept_board_game_type_chess:0 "Chess"
  game_concept_board_game_type_chess_desc:1 "$game_concept_board_game_type_desc_guts$\n\nTrong $game_concept_board_game_type_chess$:\n$EFFECT_LIST_BULLET$ [martial|E] $game_concept_board_game_type_counters$ [learning|E]\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [martial|E]"
  game_concept_board_game_type_pachisi:0 "Pachisi"
  game_concept_board_game_type_pachisi_desc:1 "$game_concept_board_game_type_desc_guts$\n\nTrong $game_concept_board_game_type_pachisi$:\n$EFFECT_LIST_BULLET$ [diplomacy|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [stewardship|E]\n$EFFECT_LIST_BULLET$ [stewardship|E] $game_concept_board_game_type_counters$ [diplomacy|E]"
  game_concept_board_game_type_hnefatafl:0 "Hnefatafl"
  game_concept_board_game_type_hnefatafl_desc:1 "$game_concept_board_game_type_desc_guts$\n\nTrong $game_concept_board_game_type_hnefatafl$:\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [martial|E]\n$EFFECT_LIST_BULLET$ [martial|E] $game_concept_board_game_type_counters$ [prowess|E]\n$EFFECT_LIST_BULLET$ [prowess|E] $game_concept_board_game_type_counters$ [intrigue|E]"
  game_concept_board_game_type_tabula:0 "Tabula"
  game_concept_board_game_type_tabula_desc:1 "$game_concept_board_game_type_desc_guts$\n\nTrong $game_concept_board_game_type_tabula$:\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [learning|E]\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [stewardship|E]\n$EFFECT_LIST_BULLET$ [stewardship|E] $game_concept_board_game_type_counters$ [intrigue|E]"

  game_concept_house_unity:  "Thống nhất Gia tộc"
  game_concept_unity:  "Thống nhất"
  game_concept_house_unity_i:  "@dynasty_house_unity!"
  game_concept_house_unity_desc:  "$game_concept_house_unity$ thể hiện trạng thái các mối quan hệ nội bộ trong một [house|E] [clan|E], và thái độ của các thành viên đối với nhau.\n\nCó một số [house_unity_levels|E] mang lại cho các thành viên của một Gia tộc nhiều lợi ích và hình phạt khác nhau.\n\n$game_concept_house_unity$ thay đổi tùy thuộc vào hành động mà các thành viên trong Gia tộc thực hiện đối với nhau. [house_unity_unifying_actions|E] nhìn chung sẽ tăng $game_concept_house_unity$, trong khi [house_unity_devisive_actions|E] sẽ làm giảm nó. [house_head|E] nhìn chung có mức độ ảnh hưởng lớn hơn đối với $game_concept_unity$ của Gia tộc họ."
  game_concept_house_unity_level:  "Cấp độ Thống nhất Gia tộc"
  game_concept_house_unity_levels:  "Cấp độ Thống nhất Gia tộc"
  game_concept_house_unity_level_desc:  "$game_concept_house_unity_level$ là trạng thái hiện tại của [house_unity|E]. Cấp độ hoạt động thay đổi khi Thống nhất tăng thông qua [house_unity_unifying_actions|E] hoặc giảm thông qua [house_unity_devisive_actions|E] và mỗi cấp độ cung cấp cho các thành viên của [house|E] nhiều lợi ích và hình phạt khác nhau.\n\nCó năm cấp độ khác nhau:\n[GetCurrentHouseUnityStagesDescForLocalPlayer]\n\nMỗi cấp độ yêu cầu [succession_law|E] [house|E] riêng."
 
  game_concept_house_unity_unifying_actions:  "Hành động Thống nhất"
  game_concept_house_unity_unifying_actions_desc:  "Hành động Thống nhất nhắm vào các thành viên [house|E] sẽ làm tăng [house_unity|E] của ngài.\n\n[house_heads|E] có thể sử dụng [decision|E] #V $unity_steer_house_direction_decision$#! và [interaction|E] #V $extoll_virtuousness_interaction$#! để làm tăng đáng kể Thống nhất.\n\n#weak Một số ví dụ về hành động thống nhất là:$house_unity_increase_examples$#!"

  game_concept_house_unity_devisive_actions:  "Hành động Chia rẽ"
  game_concept_house_unity_devisive_actions_desc:  "Hành động Chia rẽ nhắm vào các thành viên [house|E] sẽ làm giảm [house_unity|E] của ngài.\n\n[house_heads|E] có thể sử dụng [decision|E] #V $unity_steer_house_direction_decision$#! và [interaction|E] #V $accuse_of_decandence_interaction$#! để làm giảm đáng kể Thống nhất.\n\n#weak Một số ví dụ về hành động chia rẽ là:$house_unity_decrease_examples$#!"

  game_concept_house_succession_law:  "Luật Kế vị Gia tộc"
  game_concept_house_succession_law_desc:  "Trong [realms|E] [GetGovernment('clan_government').GetName], [house_unity_level|E] hiện tại quy định [succession_law|E] nào sẽ được sử dụng.\n\nCác Thị tộc có thể chuyển sang Luật Kế vị $SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$, luật này sẽ ngăn [house_unity|E] thay đổi nó, nhưng làm như vậy khó hơn bình thường nhiều."

  house_unity_increase_examples:  "\n$EFFECT_LIST_BULLET$ $negotiate_alliance_interaction$\n$EFFECT_LIST_BULLET$ $join_war_interaction$\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $send_to_holy_order_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $stop_attacker_vassal_war_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
  house_unity_decrease_examples:  "\n$EFFECT_LIST_BULLET$ $revoke_title_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $force_join_faction_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$\n$EFFECT_LIST_BULLET$ $join_independence_faction_interaction$\n$EFFECT_LIST_BULLET$ $sumptuary_law_debate_interaction$\n$EFFECT_LIST_BULLET$ $vassal_claim_liege_title_interaction$"

  game_concept_dreams:  "Giấc mơ"
  game_concept_dreams_desc:  "Những nhân vật tin theo đức tin với nguyên lý bói toán đôi khi có thể trải qua những giấc mơ. Những giấc mơ này sau đó có thể được tiên đoán bởi một nhà thần bí và có thể dẫn tới nhiều kết quả khác nhau, cả tốt lẫn xấu."

  game_concept_board_game_type_go:0 "Go"
  game_concept_board_game_type_go_desc:0 "$game_concept_board_game_type_desc_guts$\n\nTrong $game_concept_board_game_type_go$:\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [martial|E]\n$EFFECT_LIST_BULLET$ [martial|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [learning|E]"
  game_concept_board_game_type_fidchell:0 "Fidchell"
  game_concept_board_game_type_fidchell_desc:0 "$game_concept_board_game_type_desc_guts$\n\nTrong $game_concept_board_game_type_fidchell$:\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [prowess|E]\n$EFFECT_LIST_BULLET$ [prowess|E] $game_concept_board_game_type_counters$ [diplomacy|E]\n$EFFECT_LIST_BULLET$ [diplomacy|E] $game_concept_board_game_type_counters$ [learning|E]"


#### DIARCHY/REGENCIES
  game_concept_strife:0 "Xung đột"
  game_concept_strife_opinion:0 "Quan điểm Xung đột"
  game_concept_strife_desc:2 "$game_concept_strife$ là một hình phạt [opinion|E] dành cho các [vassals|E] đồng cấp.\n\nTranh chấp xảy ra khi một chủ thể của [liege|E] thực hiện hành động nhắm vào một [vassal|E] khác. Ví dụ: $game_concept_diarch$ sử dụng [diarch_powers|E] của họ, hoặc trong các sự kiện [mandate|E], vì $game_concept_diarch$ không có cùng thẩm quyền đối với [liege|E] của họ"

  game_concept_diarchy:0 "Chia sẻ Quyền lực"
  game_concept_diarchies:0 "Chia sẻ Quyền lực"
  game_concept_share_power:  "Chia sẻ Quyền lực"
  game_concept_sharing_power:0 "Chia sẻ Quyền lực"
  game_concept_power_sharing:0 "Chia sẻ Quyền lực"
  game_concept_diarchy_desc:2 "Chia sẻ Quyền lực xảy ra khi một [ruler|E] chia sẻ một số quyền lực với một trong các [vassals|E] hoặc [courtiers|E] của họ, người này sẽ trở thành [diarch|E] của họ.\n\nNhà cai trị chia sẻ quyền lực có thể thiết lập [mandates|E] cho $game_concept_diarch$ của họ, trong khi $game_concept_diarch$ có thể sử dụng các [diarch_powers|E] đặc biệt.\n\n[scales_of_power|E] đo lường xem Nhà cai trị hay $game_concept_diarch$ có quyền lực cao nhất hay không."

  game_concept_diarch:0 "Nhà đồng trị"
  game_concept_diarchs:0 "Nhà đồng trị"
  game_concept_diarch_possessive:0 "Nhà đồng trị"
  game_concept_diarchs_possessive:0 "Nhà đồng trị"
  game_concept_diarch_desc:3 "Là đối tác cấp dưới trong thể chế [diarchy|E], $game_concept_diarch$ giúp đỡ [liege|E] của họ điều hành [realm|E].\n\n$game_concept_diarch$ có quyền truy cập vào các [diarch_powers|E], và nhận được nhiều quyền truy cập hơn trong số chúng, dựa theo mẹo [scales_of_power|E] trong ưu ái của họ."

  game_concept_regent:0 "Nhiếp chính"
  game_concept_regents:0 "Nhiếp chính"
  game_concept_regent_possessive:0 "Nhiếp chính"
  game_concept_regents_possessive:0 "Nhiếp chính"
  game_concept_regent_desc:0 "Nhiếp chính là tên của một [diarch|E] trong Chế độ [regency|E].\n\nMột [ruler|E] có thể chỉ định một Nhiếp chính trước khi một Chế độ Nhiếp chính diễn ra. Nếu không, ứng cử viên có [regent_succession_score|E] cao nhất được chọn tự động."

 # For stapling to the bottom of new diarchy types.
  variant_diarchs_replace_regents_boilerplate:  "#WEAK Vì một $game_concept_ruler$ chỉ có thể có một $game_concept_diarch$ tại một thời điểm, nên các sự kiện mà [regency|E] kích hoạt cũng sẽ được kích hoạt bởi họ.#!"

  game_concept_vizier:  "Vizier"
  game_concept_viziers:  "Vizier"
  game_concept_vizierate:  "Hệ thống Vizier"
  game_concept_vizier_desc:  "$game_concept_vizier$ là một loại [diarch|E] mà các [rulers|E] [clan|E] có thể tự nguyện chỉ định để giúp tăng [income|E] của họ. Họ có ít [diarch_powers|E] hơn, nhưng có thể rất khó để loại bỏ.\n\n$game_concept_viziers$ mang lại cho [liege|E] phần thưởng [tax_jurisdictions|E] theo tỷ lệ cho [stewardship|E] của họ, và tăng [aptitude|E] của [tax_collectors|E] theo cách mà [scales_of_power|E] ưu ái cho họ tớ mức nào.\n\nĐiều quan trọng là $game_concept_lieges$ có thể tiêu hao [gold_i][gold|E] của các $game_concept_viziers$ thông qua [interaction|E] $mulct_vizier_interaction$.\n\n#WEAK Dù là một công chức quyền lực, nhưng $game_concept_viziers$ không được coi là một vị trí có uy tín đối với các [nobles|E], bất chấp tầm ảnh hưởng của họ có lớn thế nào. Người kế nhiệm của họ được chọn theo [vizier_succession_score|E].#!\n\n$variant_diarchs_replace_regents_boilerplate$"
  game_concept_confidant:  "$councillor_vizier$"
  game_concept_confidant_desc:  "$councillor_vizier_desc$"

  game_concept_vizier_succession_score:  "Điểm Kế vị Vizier"
  game_concept_vizier_succession_score_desc:  "Trong [vizierate|E], $game_concept_vizier$ tiếp theo được chọn dựa trên ứng cử viên nào có $game_concept_vizier_succession_score$ cao nhất.\n\nCác ứng cử viên tiềm năng đôi khi có thể cố gắng thuyết phục [ruler|E] thay thế Vizier đương nhiệm để đổi lấy [gold|E].\n\n#WEAK Điều này chỉ cho phép các [characters|E] không có đất đai và [title_tier|E] [baron|E], ưu ái những nhân vật có [diplomacy|E], [stewardship|E], và [intrigue|E] mạnh, cũng như các [traits|E] tạo ra một công chức giỏi.\n\nCác [relations|E] với $game_concept_vizier$ đương nhiệm hoặc [spouses|E], [concubines|E] của [liege|E], và [adult|E] không có đất, [children|E] có thể ảnh hưởng đáng kể đến điểm số.#!"

  game_concept_vizier_extravagance:  "Sự xa hoa của Vizier"
  game_concept_vizier_extravagances:  "Sự xa hoa của Vizier"
  game_concept_vizier_extravagance_extravagance:  "Sự xa hoa"
  game_concept_vizier_extravagance_extravagances:  "Sự xa hoa"
  game_concept_vizier_extravagance_desc:  "Khi còn đương chức, các [viziers|E] sẽ sử dụng [gold|E] của họ cho [modifiers|E] $game_concept_vizier_extravagance_extravagance$, nuông chiều bản thân và tầng lớp thượng lưu xã hội khác ở [capital|E] của [liege|E].\n\n$game_concept_liege$ có thể cướp lấy những $game_concept_modifiers$ này bằng cách sử dụng [interaction|E] $mulct_vizier_interaction$, biến chúng thành $game_concept_gold$ mà $game_concept_vizier$ bị buộc phải giao nộp.\n\n#WEAK Khi một $game_concept_vizier$ chấm dứt [sharing_power|E], họ sẽ mất khả năng duy trì lối sống xa hoa của mình và mọi $game_concept_modifiers$ còn lại đều biến mất.\n\nCướp bóc càng nhiều cấp độ sau này sẽ cung cấp nhiều $game_concept_gold$ — bốn cấp độ của $game_concept_vizier_extravagance_extravagance$ là:\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t1_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t2_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t3_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t4_title$#!"

  game_concept_co_rulership:  "Đồng Cai trị"
  game_concept_co_rulerships:  "Đồng Cai trị"
  game_concept_co_ruler:  "Nhà Đồng Cai trị"
  game_concept_co_rulers:  "Nhà Đồng Cai trị"
  game_concept_co_rulership_desc:  "$game_concept_co_rulers$ là một hình thái [diarchies|E], trong đó [diarch|E] được coi là chính thức và vĩnh viễn chia sẻ quyền cai trị [realm|E].\n\nHọ luôn là [designated_heir|E] (mặc dù vẫn có thể thất bại trong cuộc bầu cử) và chỉ có thể bị cách chức bằng cách [execution|E] — trừ khi [liege|E] của họ có [culture_tradition|E] phù hợp, trong trường hợp đó, họ có thể được thay thế bằng cách làm cho tàn tật.\n\nĐặc biệt, khi một $game_concept_co_ruler$ hành quyết $game_concept_liege$ của họ, hoặc đánh bại họ trong một cuộc chiến tranh, họ sẽ [usurp|E] các [titles|E]. Trong các [cultures|E] nơi mà tàn tật là một cách chấp nhận được để loại bỏ một $game_concept_co_ruler$, thì $game_concept_co_ruler$ cũng có thể gây ra tàn tật cho $game_concept_liege$ của mình để $game_concept_usurp$ vị trí đó.\n\n#WEAK Các ví dụ về $game_concept_co_rulerships$ bao gồm:\n$EFFECT_LIST_BULLET$[duumvirates|E]\n$EFFECT_LIST_BULLET$[nominal_duumvirates|E]\n$EFFECT_LIST_BULLET$[co_monarchies|E]#!"

  game_concept_duumvirate:  "Chính trị Nhị hùng"
  game_concept_duumvirates:  "Chính trị Nhị hùng"
  game_concept_co_emperor:  "Đồng Hoàng đế"
  game_concept_co_emperors:  "Đồng Hoàng đế"
  game_concept_duumvirate_desc:  "$game_concept_duumvirate$ là sự cai trị của một [empire|E] bởi hai [characters|E]. Một hoàng đế cấp trên ([liege|E]), và một hoàng đế cấp dưới ($game_concept_co_emperor$).\n\nHọ tạo ra [influence|E] thụ động cho cả bản thân và hoàng đế cấp trên của mình. Giá trị cụ thể tăng lên sau mỗi [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] năm trong công việc, bao gồm bất kỳ thời gian nào mà họ giữ chức vụ [junior_emperor|E].\n\nTrên thực tế, hầu hết quyền lực vẫn nằm trong tay $game_concept_liege$, người thực sự nắm giữ tước vị đế quốc chứ không phải là [diarch|E], nhưng $game_concept_co_emperor$ có quyền truy cập vào một số cách mạnh mẽ để ảnh hưởng đến [realm|E] và là ứng cử viên rẻ hơn để thăng chức vào các chức vụ [administrative|E].\n\nĐiều đáng chú ý là $game_concept_co_emperors$ có thể sử dụng [casus_belli|E] [imperial_expedition_cb|E] ở các cấp độ xoay chuyển [scales_of_power|E] cao hơn.\n\n#WEAK $game_concept_co_emperors$ có thể [usurp|E] hoàng đế cấp trên của họ thông qua nghi lễ làm họ bị thương.#!"
 
  game_concept_nominal_duumvirate:  "Chính trị Nhị hùng Danh nghĩa"
  game_concept_nominal_duumvirates:  "Chính trị Nhị hùng Danh nghĩa"
  game_concept_junior_emperor:  "Đồng Hoàng đế Danh nghĩa"
  game_concept_junior_emperors:  "Đồng Hoàng đế Danh nghĩa"
  game_concept_nominal_duumvirate_desc:  "$game_concept_duumvirate$ là sự cai trị của một [empire|E] bởi hai [characters|E]. Một hoàng đế cấp trên ([liege|E]), và một hoàng đế cấp dưới ($game_concept_junior_emperor$).\n\nHọ được coi là $game_concept_nominal_duumvirates$ khi hoàng đế cấp dưới là [child|E], người không thể cai trị hiệu quả, và sẽ chuyển thành [duumvirates|E] đầy đủ khi đến tuổi trưởng thành.\n\n$game_concept_junior_emperors$ tạo ra [influence|E] thụ động cho cả bản thân họ và hoàng đế cấp trên của họ. Giá trị cụ thể tăng lên sau mỗi [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] năm trong công việc, sẽ được tích lũy sau khi trở thành $game_concept_co_emperor$ đầy đủ.\n\n#WEAK Việc chỉ định một $game_concept_junior_emperor$ $game_concept_child$ biểu thị rằng họ đang được đào tạo và một ngày nào đó có thể trở thành hoàng đế cấp trên. Càng luyện tập nhiều, họ sẽ càng được đào tạo nhiều hơn.\n\nĐiều này được biểu thị dưới dạng [skill|E] bổ sung được phân bổ cho họ khi họ trở thành [adult|E], tùy thuộc vào xoay chuyển [scales_of_power|E] của họ.\n\nTrẻ em không nhận được các sự kiện [mandate|E].#!"
 
  game_concept_co_monarchy:  "Đồng Quân chủ"
  game_concept_co_monarchies:  "Đồng Quân chủ"
  game_concept_co_monarch:  "Đồng Quân chủ"
  game_concept_co_monarchs:  "Đồng Quân chủ"
  game_concept_co_monarchy_desc:  "$game_concept_co_monarchies$ là một loại [diarchy|E] cung cấp cho các nhà cai trị [feudal|E] một cách để chọn một [designated_heir|E] ngay cả trong các [eras|E] trước đó.\n\nCái giá phải trả cho điều này là phải ký kết một thỏa thuận $game_concept_diarchy$ vĩnh viễn với họ, theo đó họ sẽ dễ dàng tiếp cận được nhiều quyền lực giống như một [entrenched_regent|E].\n\n#WEAK $game_concept_co_monarchs$ chỉ dành cho [kings|E] và [emperors|E].#!"

  game_concept_regency:0 "Nhiếp chính"
  game_concept_regencies:0 "Nhiếp chính"
  game_concept_regency_possessive:0 "Nhiếp chính"
  game_concept_regencies_possessive:0 "Nhiếp chính"
  game_concept_regency_desc:2 "Nhiếp chính là một dạng đặc biệt của [diarchy|E] trong khi [ruler|E] không thể tự mình cai trị [realm|E].\n\nNó thường xảy ra nếu Nhà cai trị là [child|E], bị [imprisoned|E], [GetTrait('incapable').GetName( GetNullCharacter )], hoặc tham dự một [activity|E] bên ngoài Quốc gia của mình.\n\nKhi một $game_concept_regency$ tồn tại quá lâu thì chúng có thể trở thành [entrenched_regency|E]."

  game_concept_regency_veto:0 "Phủ quyết Đồng trị"
  game_concept_veto:0 "Phủ quyết"
  game_concept_regency_veto_desc:0 "Khi một [diarch|E] sử dụng [diarch_powers|E] của mình, thì [liege|E] của họ có thể sử dụng quyền Phủ quyết Đồng trị để ngăn chặn họ, với cái giá phải trả là [prestige|E]"

  game_concept_regent_succession_score:0 "Điểm Kế vị Nhiếp chính"
  game_concept_regent_succession_score_desc:1 "Trong thời kỳ [regency|E], [regent|E] tiếp theo được chọn dựa trên ứng cử viên nào có $game_concept_regent_succession_score$ cao nhất.\n\nNếu [ruler|E] của [realm|E] chỉ định một Nhiếp chính, thì họ sẽ ghi đè thứ tự kế vị đã lựa chọn.\n\n#WEAK Điều này có lợi cho các [characters|E] có liên quan đến $game_concept_ruler$, đặc biệt là [family|E] không có đất tại [court|E] của họ và những người hiểu biết về chính trị.#!"

  game_concept_diarch_power:0 "Quyền lực Vay mượn"
  game_concept_diarch_powers:0 "Quyền lực Vay mượn"
  game_concept_diarch_power_power:0 "Quyền lực"
  game_concept_diarch_power_powers:0 "Quyền lực"
  game_concept_diarch_power_possessive:0 "Quyền lực Vay mượn"
  game_concept_diarch_powers_possessive:0 "Quyền lực Vay mượn"
  game_concept_diarch_power_power_possessive:0 "Quyền lực"
  game_concept_diarch_power_powers_possessive:0 "Quyền lực"
  game_concept_diarch_power_desc:2 "[diarch|E] trong quá trình [power_sharing|E] đang hoạt động có quyền tiếp cận vào các $game_concept_diarch_powers$ đặc biệt.\n\nĐây là những [character_interaction|E] đặc biệt bắt chước các [liege|E] của họ, hoặc là những hành vi lạm dụng quyền lực khác. Các ví dụ bao gồm [revoking|E] [titles|E] từ các [vassals|E] đồng liêu, hoặc bòn rút [gold|E] từ Lãnh chúa của mình.\n\nNhiều $game_concept_diarch_powers$ tạo cơ hội cho Lãnh chúa [veto|E] chúng."
  game_concept_trilateral_interaction:  "Tương tác Ba bên"
  game_concept_trilateral_interactions:  "Tương tác Ba bên"
  game_concept_trilateral_interaction_desc:  "$game_concept_trilateral_interactions$ không chỉ yêu cầu sự chấp thuận của người nhận mà còn của bên thứ ba.\n\nMột ví dụ là [diarch_powers|E], trong đó [liege|E] có thể sử dụng [regency_veto|E] của họ."

  game_concept_mandate:0 "Chỉ lệnh"
  game_concept_mandates:0 "Chỉ lệnh"
  game_concept_mandate_possessive:0 "Chỉ lệnh"
  game_concept_mandates_possessive:0 "Chỉ lệnh"
  game_concept_mandate_desc:2 "$game_concept_mandates$ là những nhiệm vụ hữu ích mà [liege|E] có thể đặt ra cho [diarch|E] của mình khi [sharing_power|E].\n\nTương tự như [councillor_tasks|E], $game_concept_liege$ lựa chọn một $game_concept_mandate$ và sau đó từ từ nhận được lợi ích từ nó.\n\nKhi một $game_concept_diarch$ thực hiện tốt công việc của mình, cả hai đều thu vén [scales_of_power|E] về phía bản thân mình #EMP và#! tạo ra [strife|E] với các [vassals|E] đồng liêu của họ.\n\nLượng lợi ích mà $game_concept_liege$ nhận được tùy thuộc vào [diarch_aptitude|E] và [diarch_loyalty|E] của $game_concept_diarch_possessive$."

  game_concept_diarch_aptitude:2 "Năng lực Đồng trị"
  game_concept_diarch_aptitude_desc:2 "$game_concept_diarch_aptitude$ chi phối mức độ mà một [diarch|E] nhận được mỗi [mandate|E] do [liege|E] đặt ra.\n\nCả [skills|E] và [personality_traits|E] đều đóng một vai trò. Ví dụ: $game_concept_diarch$ [GetTrait('greedy').GetName(GetNullCharacter)] được giao Chỉ lệnh '$fill_coffers_mandate$' không được gửi nhiều [gold|E] tới cho Lãnh chúa của họ.\n\n#WEAK Các [diarchs|E] rất phù hợp với $game_concept_mandate$ khi họ có khoảng hơn 40 $game_concept_aptitude$ cho nó.#!"

  game_concept_diarch_loyalty:0 "Trung thành"
  game_concept_diarch_loyalty_explicit:0 "Trung thành Đồng trị"
  game_concept_diarch_loyal:0 "Trung thành"
  game_concept_diarch_loyalty_desc:2 "$game_concept_diarch_loyalty$ của một [diarch|E] quyết định khả năng họ sẽ lạm dụng quyền lực của mình, với chi phí của [liege|E] hoặc của [realm|E].\n\n$DIARCHY_WINDOW_VISIBLY_LOYAL$ $game_concept_diarchs$ không sử dụng [diarch_powers|E], cố gắng thực hiện [mandate|E] một cách nghiêm túc và sẵn sàng từ bỏ quyền lực khi được yêu cầu.\n\n$game_concept_diarchs$ $DIARCHY_WINDOW_VISIBLY_DISLOYAL$ sử dụng $game_concept_diarch_powers$ một cách tự do, cố gắng hoàn thành $game_concept_mandate$ của họ để thu vén [scales_of_power|E] về phía họ, và có thể từ chối từ bỏ quyền lực nếu $game_concept_scales_of_power_scales$ nghiêng hẳn về phía họ.\n\n$game_concept_diarchs$ $DIARCHY_WINDOW_UNKNOWN_LOYALTY$ có thể sử dụng $game_concept_diarch_powers$, nói chung sẽ chia lợi ích của $game_concept_mandate$ với của $game_concept_liege$ của họ hoặc bỏ qua hoàn toàn $game_concept_mandate$ của họ, và có thể cần hối lộ để từ bỏ chức vụ của mình nếu $game_concept_scales_of_power$ phù hợp với họ."

  game_concept_diarch_succession:0 "Kế vị"
  game_concept_diarch_succession_explicit:0 "Kế vị Đồng trị"
  game_concept_diarch_succession_desc:0 "$game_concept_diarch_succession_explicit$ quản lý các [vassals|E] trực tiếp hoặc [courtiers|E] của [liege|E] được tự động tạo ra [diarch|E] khi cần thiết.\n\nĐiều này xảy ra vì $game_concept_liege$ bắt đầu [diarchy|E] hoặc vì $game_concept_diarch$ hiện tại qua đời hoặc bị cách chức.\n\n#weak Các loại $game_concept_power_sharing$ khác nhau có thể tính toán thứ tự kế vị khác nhau — trong thời kỳ [regency|E], các [characters|E] không có đất đai có các mối liên hệ cá nhân mạnh mẽ với $game_concept_liege$ của họ có xu hướng chiếm ưu thế.\n\nViệc nói [language|E] của $game_concept_liege$ (và [court_language|E], nếu họ có chúng) hầu như luôn luôn quan trọng.#!"

  game_concept_scales_of_power:0 "Cân bằng Quyền lực"
  game_concept_scales_of_power_scales:0 "Cân bằng"
  game_concept_scales_of_power_desc:2 "Trong thời kì [power_sharing|E], sự cân bằng quyền lực giữa [liege|E] và [diarch|E] của họ được đo lường dựa trên $game_concept_scales_of_power$.\n\nKhi $game_concept_scales_of_power_scales$ nghiêng về phía $game_concept_diarch$, chúng mở khóa [diarch_powers|E] và có thể thêm chi phí cho [diarch_affected_actions|E] của Lãnh chúa.\n\nThay vào đó, khi chúng nghiêng về phía $game_concept_liege$, điều này giúp Lãnh chúa kết thúc [diarchy|E] dễ dàng hơn.\n\n$game_concept_scales_of_power_scales$ có thể được xoay vần bằng cách:\n$EFFECT_LIST_BULLET$Sử dụng [character_interaction|E] $swing_scales_currency_interaction$ chống lại phe đối lập\n$EFFECT_LIST_BULLET$Với tư cách là $game_concept_diarch$, phục vụ cho $game_concept_liege$ của ngài (tuy nhiên có phần hoài nghi) trong các sự kiện [mandate|E]"


  game_concept_entrenched_regency:0 "Nhiếp chính Cố hữu"
  game_concept_entrenched_regency_entrenched:0 "Cố hữu"
  game_concept_entrenched_regency_regency:0 "Nhiếp chính"
  game_concept_entrenched_regent:0 "Nhiếp chính Cố hữu"
  game_concept_entrenched_regents:0 "Nhiếp chính Cố hữu"
  game_concept_entrenched_regency_entrench:0 "Cố hữu"
  game_concept_entrenched_regencies:0 "Nhiếp chính Cố hữu"
  game_concept_entrenched_regency_desc:3 "Nếu một thể chế [regency|E] tồn tại quá lâu, nó có thể trở thành Nhiếp chính Cố hữu, và [regent|E] thậm chí còn trở nên mạnh mẽ hơn so với [liege|E] của họ.\n\nNhững lợi ích mà [regent|E] nhận được từ việc [scales_of_power|E] trở nên mạnh mẽ hơn nhiều.\n\nĐể kết thúc $game_concept_entrenched_regency$, Nhiếp chính phải nhận một món quà từ Lãnh chúa của họ, hoặc Lãnh chúa phải nghiêng Cán cân theo hướng có lợi cho họ."

  game_concept_diarch_affected_actions:0 "Hành động Thế tục"
  game_concept_diarch_affected_actions_desc:3 "Khi [scales_of_power|E] ưu ái [diarch|E] trong thời kỳ [power_sharing|E], một số các [interactions|E] mà [liege|E] nắm giữ có thể bắt đầu tiêu tốn [prestige|E].\n\nCác hành động bị ảnh hưởng là:\n$EFFECT_LIST_BULLET$ [revoking|E] một [title|E]\n$EFFECT_LIST_BULLET$ [retracting|E] một [vassal|E]\n$EFFECT_LIST_BULLET$ [imprisoning|E] [characters|E]\n$EFFECT_LIST_BULLET$ [executing|E] $game_concept_characters$ #weak (trừ khi [faith|E] của $game_concept_liege$ thực hiện một số hình thức hiến tế con người)#!"


 ######## GRAND ACTIVITIES ETC

  game_concept_grand_activity:0 "Hoạt động Hoành tráng"
  game_concept_grand_activities:0 "Hoạt động Hoành tráng"
  game_concept_grand_activity_desc:0 "Những màn thể hiện lộng lẫy về sự giàu có và hoành tráng, các $game_concept_grand_activities$ về bản chất là lớn hơn và #EMP hoành tráng#! hơn các [activities|E] thông thường. Chúng có thể có nhiều [activity_phases|E] và mang lại nhiều cơ hội tùy chỉnh trong kế hoạch hơn.\n\nCác hành trình mang lại cơ hội đến viếng thăm nhiều [vassals|E] trong [realm|E] của ngài trong khi Giải đấu cung cấp nhiều [contests|E] khác nhau để tổ chức."

  game_concept_special_guest:0 "Khách mời Đặc biệt"
  game_concept_special_guests:0 "Khách mời Đặc biệt"
  game_concept_honorary_guest:0 "Khách mời Danh dự"
  game_concept_honorary_guest_desc:0 "$honorary_guest_desc$"
  game_concept_special_guest_desc:0 "Khách mời Đặc biệt giữ một vị trí danh dự đặc biệt tại các [grand_activities|E]. Tôn vinh ai đó tại [GetActivityType( 'activity_feast' ).GetName] của ngài hoặc chọn một $special_guest_champion$ để đại diện cho ngài tại [GetActivityType( 'activity_tournament' ).GetName] của ngài!\n\nHọ có nhiều khả năng chấp nhận lời mời của ngài hơn và mọi hoạt động mà họ được mời sẽ không bắt đầu cho đến khi họ tới nơi."

  game_concept_contest:0 "Cuộc thi"
  game_concept_contests:0 "Cuộc thi"
  game_concept_contest_desc:3 "[GetActivityType( 'activity_tournament' ).GetName] bao gồm một chuỗi các $game_concept_contests$, được lựa chọn bởi [activity_host|E], trong đó các [contestants|E] [contest_qualifying|E] có thể cạnh tranh để giành được [prizes|E] và các phần thưởng khác.\n\nMỗi $game_concept_contest$ sử dụng một trong bốn cách khác nhau để xác định người chiến thắng: [contest_category_versus|E], [contest_category_turn|E], [contest_category_team|E], và [contest_category_race|E].\n\nCơ hội chiến thắng một $game_concept_contest$ của ngài được xác định bởi các [skills|E], [traits|E], sự chuẩn bị và các yếu tố khác của ngài. Khả năng đủ điều kiện tư cách tham gia để tham gia $game_concept_contests$ thể chất được xác định bởi sức khỏe và giới tính, dựa trên [culture|E] và [faith|E] của [activity_host|E]."
  game_concept_prize:0 "Phần thưởng"
  game_concept_prizes:0 "Phần thưởng"
  game_concept_prize_desc:4 "$game_concept_prizes$ là các [artifacts|E] được trao cho những người chiến thắng [contests|E] [GetActivityType( 'activity_tournament' ).GetName] với một người chiến thắng duy nhất.\n\nChất lượng của $game_concept_prize$ tùy thuộc vào các tùy chọn đã chọn bởi [activity_host|E] và [era|E]."
  game_concept_contest_category_team:1 "Đồng đội"
  game_concept_contest_category_team_desc:1 "Trong [contests|E] $game_concept_contest_category_team$, tất cả các [contestants|E] [contest_qualifying|E] trong đội có tổng số điểm cao nhất khi kết thúc cuộc thi sẽ nhận được phần thưởng.\n\nCuộc thi $game_concept_contest_category_team$:\n$EFFECT_LIST_BULLET$Melee"
  game_concept_contest_category_versus:1 "Hạ đo ván"
  game_concept_contest_category_versus_desc:1 "Người chiến thắng của [contest|E] $game_concept_contest_category_versus$ là người cuối cùng còn lại sau ba [contest_rounds|E] giữa các [contestants|E] [contest_qualifying|E].\n\nCuộc thi $game_concept_contest_category_versus$:\n$EFFECT_LIST_BULLET$Wrestling\n$EFFECT_LIST_BULLET$Duel\n$EFFECT_LIST_BULLET$Joust\n$EFFECT_LIST_BULLET$Board Games"
  game_concept_contest_category_turn:1 "Luân phiên"
  game_concept_contest_category_turn_desc:1 "Người chiến thắng của [contests|E] $game_concept_contest_category_turn$ là [contestant|E] [contest_qualifying|E] có nhiều điểm nhất khi kết thúc cuộc thi.\n\nCuộc thi $game_concept_contest_category_turn$:\n$EFFECT_LIST_BULLET$Archery\n$EFFECT_LIST_BULLET$Recital"
  game_concept_contest_category_race:0 "Cuộc đua"
  game_concept_contest_category_race_desc:1 "Người chiến thắng của [contests|E] $game_concept_contest_category_race$ [contestant|E] [contest_qualifying|E] có con ngựa dự thi đã giành vị trí đầu tiên khi kết thúc cuộc đua.\n\nCuộc thi $game_concept_contest_category_race$:\n$EFFECT_LIST_BULLET$Horse Race"
  game_concept_contest_round:0 "Vòng Tranh tài"
  game_concept_contest_rounds:0 "Vòng Tranh tài"
  game_concept_contest_round_desc:0 "[contests|E] [contest_category_versus|E] xác định người chiến thắng bằng cách ghép tất cả [contestants|E] [contest_qualifying|E] thi đấu với nhau trong các trận đấu loại trực tiếp cho đến khi chỉ còn lại một người.\n\nCó ba vòng: tứ kết, bán kết và chung kết."
  game_concept_contest_qualification:0 "Tư cách Tham gia"
  game_concept_contest_qualify:0 "Tư cách Tham gia"
  game_concept_contest_qualifier:0 "Tư cách Tham gia"
  game_concept_contest_qualifiers:0 "Tư cách Tham gia"
  game_concept_contest_qualifying:0 "Tư cách Tham gia"
  game_concept_contest_qualifies:0 "Tư cách Tham gia"
  game_concept_contest_qualification_desc:0 "Mặc dù [GetActivityType( 'activity_tournament' ).GetName] sẽ thu hút nhiều [contestants|E], đủ điều kiện, nhưng chỉ một số ít sẽ đủ Tư cách Tham gia cho mỗi [contest|E], với cơ hội giành được vinh quang và [prize|E] của nó.\n\nĐể đảm bảo đủ Điều kiện Tư cách Tham gia, [progress_to_victory|E] của ngài phải cao hơn ngưỡng khi Cuộc thi bắt đầu."
  game_concept_contestant:0 "Thí sinh"
  game_concept_contestants:0 "Thí sinh"
  game_concept_contestant_desc:0 "Để cạnh tranh trong [contests|E] [GetActivityType( 'activity_tournament' ).GetName], ngài phải đáp ứng các yêu cầu của nó. Trò chơi trên bàn cho phép tất cả các nhân vật cạnh tranh, trong khi những nhân vật khác, như Đấu vật, phụ thuộc vào các quy tắc Võ thuật.\n\nCác nhân vật không tham gia cuộc thi sẽ là [spectators|E], và các [contestants|E] tiềm năng có thể từ chối tham gia nếu họ muốn xem chúng.\n\nTính đủ điều kiện tham gia Cuộc thi được xác định theo giới tính và sức khỏe, dựa trên [culture|E] và [religion|E] của người tổ chức."
  game_concept_spectator:0 "Khán giả"
  game_concept_spectators:0 "Khán giả"
  game_concept_spectating:0 "Xem"
  game_concept_spectate:0 "Xem"
  game_concept_spectator_desc:0 "Bất kỳ nhân vật nào không được phép tham gia một [contest|E], thay vào đó sẽ [spectate|E].\n\nCũng có thể khiến [contestants|E] chọn không tham gia thay vì cạnh tranh."

  game_concept_progress_to_victory:0 "Tiến trình Chiến thắng"
  game_concept_progress_to_victory_desc:1 "Sự trừu tượng hóa về khả năng mà ngài giành chiến thắng trong một [contest|E] nhất định so với các thí sinh khác, dựa trên các [skills|E], [health|E], và [traits|E] của ngài. Ví dụ, một [GetTrait('giant').GetName( GetNullCharacter )] có [prowess|E] cao có lợi thế trong các cuộc thi thể chất diễn ra trên đất liền, chẳng hạn như Đấu vật.\n\nCần có $game_concept_progress_to_victory$ tối thiểu để đảm bảo [contest_qualification|E] cho một [contest|E]. Ghé thăm các [locales|E] để có cơ hội cải thiện cơ hội của ngài hoặc phá hoại đối thủ của ngài.\n\n#V Bảng xếp hạng#! Giải đấu hiển thị $game_concept_progress_to_victory$ hiện tại của tất cả các thí sinh."
  game_concept_progress_to_victory_locale_tt:0 "Ghé thăm các [locales|E] để có cơ hội cải thiện cơ hội của ngài hoặc phá hoại đối thủ của ngài."
 
  game_concept_contest_aptitude:0 "Cuộc thi Tài năng"
  game_concept_contest_aptitude_desc:0 "Các [contests|E] khác nhau yêu cầu các tài năng khác nhau: Chân, Ngựa, Cung, Trí tuệ hoặc kết hợp tất cả.\n\nNăng lực của ngài bắt nguồn từ các [trait_level_track_xp|E] [skills|E], [health|E], [traits|E], và [GetTrait('tourney_participant').GetName( GetNullCharacter )].\n\nVí dụ: một [GetTrait('giant').GetName( GetNullCharacter )] có [prowess|E] cao thì có lợi thế tự nhiên trong một Cuộc thi Đấu vật."

  game_concept_locale:0 "Địa điểm"
  game_concept_locales:0 "Địa điểm"
  game_concept_locale_desc:3 "Ngài có thể lựa chọn cách khám phá [GetActivityType( 'activity_tournament').GetName] trong khi các [contests|E] đang được chuẩn bị.\n\nMỗi Địa điểm mang đến cơ hội giao lưu với các quan khách, cải thiện [progress_to_victory|E], hoặc phá hoại [contestants|E].\n\nNếu một Địa điểm không được chọn, thì ngài sẽ truy cập một Địa điểm một cách ngẫu nhiên sau một khoảng thời gian ngắn."

  game_concept_travel:0 "Lữ hành"
  game_concept_travels:0 "Di chuyển"
  game_concept_traveling:0 "Di chuyển"
  game_concept_traveled:  "Lữ hành"
  game_concept_travel_desc:0 "$game_concept_travel$ là cách mà một [character|E] di chuyển từ [location|E] này đến địa điểm khác, chủ yếu là để tham dự các [activities|E].\n\nCó nhiều cách để lên kế hoạch cho chuyến hành trình của ngài như chọn một [GetCourtPositionType('travel_leader_court_position').GetName()] và thuê mướn, chọn [travel_options|E], và tùy chỉnh tuyến hành trình của ngài. Ngài sẽ gặp nhiều nhân vật thú vị trên đường đi của mình, nhưng hãy cảnh giác với [travel_danger|E] có thể chờ đợi phía trước."
  game_concept_travel_option:0 "Tùy chọn Lữ hành"
  game_concept_travel_options:0 "Tùy chọn Lữ hành"
  game_concept_travel_option_desc:0 "Một tùy chọn mà ngài chọn khi lập kế hoạch cho chuyến [travel|E] của mình để nâng cao hoặc sửa đổi hành trình mà ngài sắp bắt đầu."
  game_concept_travel_danger:0 "Nguy hiểm"
  game_concept_travel_danger_i:  "@travel_danger_icon!"
  game_concept_travel_danger_desc:0 "Trong chuyến [travels|E] của mình, ngài có thể đi qua những vùng đất nguy hiểm, chẳng hạn như sa mạc hoặc đầm lầy, điều đó có thể cản trở hành trình của ngài.\n\nNgài có thể giảm thiểu rủi ro Nguy hiểm bằng cách cải thiện [travel_safety|E] của mình. Ngài thực hiện điều này bằng cách đầu tư vào [travel_options|E] hoặc bằng cách thuê mướn [GetCourtPositionType('travel_leader_court_position').GetName()].\n\n\nMột số [culture_traditions|E] giảm thiểu hoặc loại bỏ rủi ro của một số loại Nguy hiểm nhất định."
  game_concept_travel_safety:0 "An toàn"
  game_concept_travel_safety_desc:0 "Việc có giá trị An toàn cao sẽ giúp ngài tránh được [travel_danger|E] trong quá trình [travels|E]. Sự an toàn bị ảnh hưởng bởi các [skills|E] cũng như của [GetCourtPositionType('travel_leader_court_position').GetName()] của ngài.\n\n$min_travel_contribution$"
  game_concept_travel_speed:0 "Tốc độ"
  game_concept_travel_speed_desc:0 "Việc có Tốc độ cao trong khi [traveling|E] sẽ giúp ngài đến đích nhanh hơn. Tốc độ bị ảnh hưởng bởi các [skills|E] cũng như bởi [GetCourtPositionType('travel_leader_court_position').GetName()] của ngài.\n\n$min_travel_contribution$"
  game_concept_entourage:0 "Tùy tùng"
  game_concept_entourage_desc:0 "Đi một mình rất nguy hiểm, vì vậy ngài nên mang theo một số người bạn đồng hành trong Đoàn tùy tùng của mình. Những người mà [travels|E] cùng ngài đều là một phần trong Đoàn tùy tùng của ngài và chia sẻ những thử thách mà ngài có thể gặp phải trên hành trình của mình.\n\n[GetCourtPositionType('travel_leader_court_position').GetName()] của ngài là người lãnh đạo Đoàn tùy tùng và quản lý kế hoạch chuyến đi của ngài.\n\nMột số [characters|E] được thêm vào Đoàn tùy tùng của ngài theo mặc định khi lập kế hoạch chuyến đi. [travel_options|E] và [activity_options|E] cung cấp các cách bổ sung để thêm các nhân vật."
  min_travel_contribution:  "Đóng góp của [character_possessive|lE] không bao giờ có thể thấp hơn #HIGH 0#!."

  game_concept_point_of_interest:0 "Địa điểm Quan trọng"
  game_concept_points_of_interest:  "Địa điểm Quan trọng"
  game_concept_point_of_interest_desc:0 "$game_concept_point_of_interest$ là một địa điểm trên thế giới đáng ghé thăm. Khi ngài ghé thăm địa điểm đó lần đầu tiên, ngài sẽ nhận được những lợi ích liên quan đến nó."

  game_concept_vassal_stance:0 "Lập trường Chư hầu"
  game_concept_vassal_stances:0 "Lập trường Chư hầu"
  game_concept_preferred_heir:0 "Người thừa kế Đồng thuận"
  game_concept_unpreferred_heir:0 "Người thừa kế Bất thuận"
  game_concept_preferred_heirs:0 "Người thừa kế Đồng thuận"
  game_concept_unpreferred_heirs:0 "Người thừa kế Bất thuận"
  game_concept_vassal_stance_desc:1 "Mỗi [vassal|E] có một Thái độ Chư hầu ảnh hưởng đến [opinion|E] mà họ có với bạn với tư cách là [liege|E] của họ, và họ ưu tiên [heir|E] nào làm người kế vị [realm|E].\n\nCác chư hầu có cùng thái độ sẽ thích và ghét những thứ giống nhau. Ví dụ; tất cả các Chư hầu [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] đều không thích khi bạn thua [wars|E].\n\nMỗi Thái độ Chư hầu ưu tiên một Người thừa kế cụ thể. Khi kế vị, mỗi Người thừa kế được ưu tiên sẽ có [legitimacy_expectations|E] thấp hơn với các Chư hầu có thái độ đó.\n\n#low Các Thái độ Chư hầu là:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 
  game_concept_personality_i:0 "@personality_icon!"
  game_concept_warlike_i:0 "@warlike_icon!"
  game_concept_unpredictable_i:0 "@unpredictable_icon!"
  game_concept_cautious_i:0 "@cautious_icon!"
  game_concept_builder_i:0 "@builder_icon!"
  game_concept_conqueror_i:  "@conqueror_icon!"
  game_concept_pious_builder_i:  "@pious_builder_icon!"
  game_concept_ai_pious_builder_personality:0 "Bậc Kiến thiết Ngoan đạo"
  game_concept_ai_pious_builder_personality_desc:0 "Một $game_concept_ai_pious_builder_personality$ luôn muốn dồn tất thảy [gold|E] của mình để bồi đắp [piety|E].\n\nHọ sẽ dốc sạch quốc khố để tài trợ cho các [buildings|E] tôn giáo và nghi lễ, các [great_projects|E], [activities|E] và [decisions|E], đồng thời thường xuyên xây dựng thêm các [pious_buildings|E] cùng các [holding|E] [temple|E] hoặc [temple_citadel|E]. Họ chỉ tích trữ vàng bạc khi bị đe dọa trực tiếp, chẳng hạn như bởi một [faction|E] hùng mạnh.\n\nCác $game_concept_ai_pious_builder_personality$ có xu hướng thêu dệt và truyền bá những [legends|E] thánh khiết.\n\nNhững [rulers|E] cuồng tín [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )] có thiên hướng hướng thiện [virtue|E] và không mặn mà với [war|E], thường sẽ trở thành $game_concept_ai_pious_builder_personality$.\n\nCác đặc điểm tính cách phổ biến bao gồm [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], và [GetTrait('generous').GetName( GetNullCharacter )]. Những vị quân chủ tập trung vào [GetFocus('learning_theology_focus').GetName] cũng thường là những $game_concept_ai_pious_builder_personality$."
  game_concept_ai_pious_builder_personality_desc_or_mandala:  "hoặc [mandala|E] "
  game_concept_ai_warlike_personality:0 "Hiếu chiến"
  game_concept_ai_warlike_personality_desc:  "Một [ruler|E] $game_concept_ai_warlike_personality$ luôn muốn sẵn sàng tuyên bố [war|E]. Họ sẽ tích lũy [gold|E] cho [war|E] trước khi đầu tư vào việc phát triển [realm|E] của mình. Nếu một Nhà cai trị $game_concept_ai_warlike_personality$ hòa bình trong một thời gian dài, họ sẽ sử dụng Vàng trong ngân khố chiến tranh của mình để xây dựng các [buildings|E].\n\nNhững Nhà cai trị $game_concept_ai_warlike_personality$ có nhiều khả năng tạo ra và thúc đẩy [legends|E] anh hùng hơn.\n\nNhững Nhà cai trị Táo bạo và Tham lam có xu hướng hiếu chiến.\nCác đặc điểm chung bao gồm [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )], và [GetTrait('zealous').GetName( GetNullCharacter )]."
  game_concept_ai_cautious_personality:0 "Thận trọng"
  game_concept_ai_cautious_personality_desc:  "Một [ruler|E] $game_concept_ai_cautious_personality$ luôn muốn chuẩn bị cho [war|E] chống lại những nhà trị khác muốn tiến hành chống lại họ. Họ có phần miễn cưỡng khi tiến hành [war|E] Tấn công, thay vào đó họ muốn xây dựng từ từ. Họ sẽ tích lũy [gold|E] để bảo vệ bản thân, và đầu tư tiền của họ vào các [buildings|E] và [men_at_arms|E] để giúp họ cảm thấy an toàn.\n\nNhững Nhà cai trị $game_concept_ai_cautious_personality$ có ít khả năng tạo ra và thúc đẩy [legends|E] anh hùng hơn.\n\nNhững Nhà cai trị dè dặt và cẩn thận có xu hướng là $game_concept_ai_cautious_personality$.\nCác đặc điểm chung bao gồm [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], và [GetTrait('content').GetName( GetNullCharacter )]. Họ sẽ không bao giờ [GetTrait('fickle').GetName( GetNullCharacter )]."
  game_concept_ai_conqueror_personality:  "Kẻ Chinh phục"
  game_concept_ai_conquerors_personality:  "Kẻ Chinh phục"
  game_concept_ai_conqueror_personality_desc:  "Một $game_concept_ai_conqueror_personality$ muốn mở rộng [realm|E] của họ thông qua [war|E], bằng mọi giá. Họ sẽ đầu tư tất cả [gold|E] của mình vào [war_chest|E] hoặc mua [men_at_arms|E].\n\nHọ có xu hướng tuyên bố nhiều cuộc [wars|E] hơn bình thường, và là các [allies|E] không đáng tin cậy. Họ từ bỏ hầu hết những thú vui phù phiếm trong cuộc sống, chẳng hạn như tổ chức hoặc tham gia các [activities|E] và tài trợ [inspirations|E] — để tiết kiệm [gold|E] cho việc tiêu diệt kẻ thù của mình. Họ sẽ chỉ sử dụng các Hoạt động để có đủ [prestige|E] và [piety|E] cho [war|E].\n\nBất kỳ [ruler|E] không phải là [ai_cautious_personality|E] đều có tiềm năng trở thành một $game_concept_ai_conqueror_personality$, nhưng thông thường chỉ có một số ít Nhà cai trị trên toàn thế giới có kiểu mẫu này."
  game_concept_ai_economical_boom_personality:0 "Thợ xây"
  game_concept_ai_economical_boom_personality_desc:  "Một nhà cai trị $game_concept_ai_economical_boom_personality$ luôn muốn đầu tư tất cả [gold|E] của họ vào [realm|E]. Họ sẽ dùng hết ngân quỹ của mình để tài trợ cho các [buildings|E] và [men_at_arms|E], và thường xây dựng thêm các [economic_buildings|E] và [holdings|E]. Họ chỉ tiết kiệm vàng nếu bị đe dọa trực tiếp, chẳng hạn như bởi một [faction|E] mạnh mẽ.\n\nNhững nhà cai trị $game_concept_ai_economical_boom_personality$ ít có khả năng tạo ra và thúc đẩy [legends|E].\n\nCác Nhà cai trị Táo bạo có thiên hướng xây dựng và không có thiên hướng cụ thể nào về [war|E] có xu hướng là $game_concept_ai_economical_boom_personality$s.\nCác đặc điểm chung bao gồm [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], và [GetTrait('profligate').GetName( GetNullCharacter )]. Các Nhà cai trị có [GetFocus('stewardship_domain_focus').GetName] cũng có xu hướng là $game_concept_ai_economical_boom_personality$."
  game_concept_ai_economical_unpredictable_personality:0 "Khó lường"
  game_concept_ai_economical_unpredictable_personality_desc:  "Một [ruler|E] $game_concept_ai_economical_unpredictable_personality$ không có [traits|E] nào thúc đẩy họ hướng tới bất kỳ Nguyên mẫu Kinh tế cụ thể nào và có thể quyết định theo bất kỳ chiến lược nào.\n\nHọ có thể chọn tạm thời đầu tư mạnh vào các [buildings|E] giống như [ai_economical_boom_personality|E], hoặc xây dựng [realm|E] của họ một cách chậm rãi và tích lũy [gold|E]. Họ tiến tới con đường [war|E] với tốc độ đều đặn."

  game_concept_trait_level_track:1 "Con đường Đặc điểm"
  game_concept_trait_level_track_desc:1 "Một số [traits|E] đưa ra một số lộ trình, mỗi lộ trình sẽ cải thiện Đặc điểm theo những cách khác nhau.\n\nCần phải kiếm thêm [trait_level_track_xp|E] để tiến xa hơn trên con đường đó."
  game_concept_trait_level_track_xp:1 "Kinh nghiệm Đặc điểm"
  game_concept_trait_level_track_xp_desc:1 "Cần có kinh nghiệm để tiến xa hơn trên [trait_level_track|E] và cải thiện phần thưởng mà [trait|E] mang lại. "
 
  game_concept_hunt_sighting:0 "Quan sát Săn bắn"
  game_concept_hunt_sightings:0 "Quan sát Săn bắn"
  game_concept_hunt_sighting_no_prefix:0 "Quan sát"
  game_concept_hunt_sightings_no_prefix:0 "Quan sát"
  game_concept_hunt_sighting_desc:0 "$game_concept_hunt_sighting$ là báo cáo về việc phát hiện ra các loài động vật có giá trị ở một [county|E], có thể bị săn đuổi trong một [GetActivityType('activity_hunt').GetName] được tổ chức tại đó.\n\n[court_position|E] [GetCourtPositionType('master_of_hunt_court_position').GetName()] sẽ tìm kiếm $game_concept_hunt_sightings_no_prefix$."

 
  game_concept_stationed_regiment:0 "Trung đoàn Đóng quân"
  game_concept_stationed_regiment_desc:0 "Một [regiment|E] [men_at_arms|E] nhận được phần thưởng cho hiệu quả hoạt động của mình bằng cách Đóng quân tại một [holding|E].\n\nCác [buildings|E] có thể tăng thêm những phần thưởng này — đôi khi đối với bất kỳ loại Men-at-Arms nào, nhưng phổ biến nhất là dành cho một hoặc hai. Ví dụ, [GetBuilding('stables_01').GetName] mang lại phần thưởng cho [light_cavalry|E] và [heavy_cavalry|E] Đóng quân.\n\nNgài có thể Đóng quân ở bất kỳ nơi nào thời gian ngoại trừ trong thời kỳ [war|E], hoặc nếu Địa sản đó bị [occupied|E]. Nếu Địa sản mất, mọi Men-at-Arms Đóng quân sẽ không được đóng quân."
  game_concept_stationed:0 "Đóng quân"
  game_concept_station:0 "Đóng quân"
  game_concept_station_regiment:0 "Trung đoàn Đóng quân"
  game_concept_stationed_holding:0 "Địa sản Đóng quân"
 
  game_concept_tour:0 "Tuần du"
  game_concept_tour_desc:0 "Một [grand_activity|E] trong đó một [liege|E] đến thăm một nhóm các [vassals|E] của họ để gặt hái những phần thưởng như [gold|E], [dread|E], [opinion|E], [control|E], và [cultural_acceptance|E]."
  game_concept_tours:0 "Tuần du"
  game_concept_royal_tour:0 "Tuần du Hoàng gia"
  game_concept_royal_tours:0 "Tuần du Hoàng gia"
  game_concept_grand_tour:0 "Tuần du Hoành tráng"
  game_concept_grand_tours:0 "Tuần du Hoành tráng"
  game_concept_culture_festival:0 "Lễ hội Văn hóa"
  game_concept_cultural_festival_desc:0 "Một [activity_phase|E] trong [royal_tour|E] trong đó các [vassal|E] dự kiến sẽ chiêu đãi [liege|E] của mình, điều này thường dẫn đến sự gia tăng [county_opinion|E] và [cultural_acceptance|E]."
  game_concept_cultural_festival:0 "Lễ hội Văn hóa"
  game_concept_cultural_festivals:0 "Lễ hội Văn hóa"
  game_concept_culture_festivals:0 "Lễ hội Văn hóa"
  game_concept_hosted_dinner:0 "Tổ chức Bữa tối"
  game_concept_hosted_dinner_desc:0 "Một [activity_phase|E] trong thời kỳ [royal_tour|E] trong đó [vassal|E] dự kiến sẽ chiêu đãi [liege|E] của họ, điều này thường dẫn đến sự gia tăng hình thành các [hooks|E] và [relations|E]."
  game_concept_hosted_dinners:0 "Tổ chức Bữa tối"
  game_concept_host_a_dinner:0 "Tổ chức Bữa tối"
  game_concept_tour_the_grounds:0 "Tuần du Bãi đấu"
  game_concept_tour_the_grounds_desc:0 "Một [activity_phase|E] trong thời kỳ [royal_tour|E] trong đó [vassal|E] được [liege|E] của họ đến thăm, điều này thường dẫn đến sự gia tăng [control|E] ở các [counties|E] của họ."
  game_concept_touring_the_grounds:0 "Tuần du Bãi đấu"
  game_concept_tour_of_the_grounds:0 "Tuần du Bãi đấu"
  game_concept_tour_grounds:0 "Tuần du Bãi đấu"
  game_concept_tour_stop:0 "Điểm dừng Tuần du"
  game_concept_tour_stop_desc:0 "Một [activity_phase|E] trong thời kỳ [royal_tour|E] trong đó người đứng đầu có thể: tham dự [hosted_dinner|E], [tour_the_grounds|E] của [vassal|E] của họ, hoặc thưởng thức [cultural_festival|E]."
  game_concept_stop:0 "Điểm dừng"
  game_concept_stops:0 "Điểm dừng"
  game_concept_tour_stops:0 "Ngừng lại Tuần du"
  game_concept_tour_success:0 "Tuần du Thành công"
  game_concept_tour_success_desc:0 "Giá trị xác định phần thưởng mà ngài sẽ nhận được khi kết thúc [grand_tour|E] của mình. Ngài có thể nhận được và mất điểm bằng cách chọn một số tùy chọn nhất định khi bắt đầu chuyến hành trình và đưa ra quyết định phù hợp với [tour_type|E] của mình."
  game_concept_tour_success_points:0 "Điểm Tuần du Thành công"
  game_concept_tour_success_point:0 "Điểm Tuần du Thành công"
  game_concept_tour_type:0 "Loại Tuần du"
  game_concept_tour_type_desc:0 "Một tùy chọn xác định loại [tour|E] mà ngài đang tham gia và phần thưởng mà ngài nhận được. Các loại hành trình bao gồm [majesty_tour|E], [intimidation_tour|E], và [taxation_tour|E]."
  game_concept_majesty_tour:0 "Tuần du Hoành tráng"
  game_concept_majesty_tour_desc:0 "Một [tour_type|E] trong đó ngài cố gắng lôi kéo các [vassals|E] của mình bằng cách làm tăng [opinion|E] của họ."
  game_concept_intimidation_tour:0 "Tuần du Đe dọa"
  game_concept_intimidation_tour_desc:0 "Một [tour_type|E] trong đó ngài cố gắng đe dọa các [vassals|E] của mình, gây ra [dread|E] và buộc họ phải rời bỏ các [factions|E]."
  game_concept_taxation_tour:0 "Tuần du Thu thuế"
  game_concept_taxation_tour_desc:0 "Một [tour_type|E] trong đó ngài cố gắng bòn rút của cải từ [vassals|E] của mình, thu được [gold|E]."

  game_concept_accolade:0 "Huân hiệu"
  game_concept_accolade_possessive:0 "của Huân hiệu"
  game_concept_accolades:0 "Huân hiệu"
  game_concept_acclaimed:0 "Được phong Huân hiệu"
  game_concept_accolade_desc:5 "Huân hiệu là vinh dự tối cao được [liege|E] ban tặng cho những [knights|E] ưu tú.\n\nHiệp sĩ nắm giữ Huân hiệu sẽ trở thành [acclaimed_knight|E].\n\nKhi Hiệp sĩ Huân hiệu tích lũy được [glory|E], [accolade_rank|E] thuộc [accolade_types|E] của họ sẽ thăng cấp, mang lại những đặc lợi hùng mạnh hơn cho Lãnh chúa.\n\nKhi các Hiệp sĩ Huân hiệu qua đời, vị trí của họ sẽ được kế thừa thông qua [accolade_succession|E].\n\nCác [innovations|e] và [title_tiers|e] cao hơn sẽ cho phép [rulers|E] duy trì nhiều Huân hiệu cùng một lúc."

  game_concept_acclaimed_knight:0 "Hiệp sĩ Huân hiệu"
  game_concept_acclaimed_knights:0 "Hiệp sĩ Huân hiệu"
  game_concept_acclaimed_knight_possessive:0 "của Hiệp sĩ Huân hiệu"
  game_concept_acclaimed_knight_desc:1 "[knight|E] đang nắm giữ một [accolade|E].\n\nĐể trở thành một Hiệp sĩ Được ca ngợi, Hiệp sĩ phải là [unlanded|E] hoặc [baron|E], với ít nhất [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] [prowess|E] trở lên. Một Hiệp sĩ Được ca ngợi phải đủ điều kiện cho ít nhất một [accolade_type|E] mà chưa được nắm giữ bởi một Hiệp sĩ Được ca ngợi khác của [liege|E] họ.\n\nCác Hiệp sĩ Được ca ngợi ít có khả năng bị giết hoặc bị bắt làm tù binh trong trận chiến hơn. Họ có thể cải thiện [glory|E] của mình chủ yếu bằng cách chiến đấu trong các [wars|E] và tham dự các [activities|E] như [GetActivityType( 'activity_tournament' ).GetName].\n\nCác hiệp sĩ được ca ngợi đôi khi có thể nhận được [skills|E] và [traits|E] liên quan đến Thuộc tính của Accolade của họ."

  game_concept_accolade_type:0 "Thuộc tính Huân hiệu"
  game_concept_accolade_types:0 "Thuộc tính Huân hiệu"
  game_concept_accolade_type_desc:1 "Một [accolade|E] có tối đa #value 3#! Thuộc tính, cung cấp các phần thưởng mở rộng khi các cấp cao hơn của chúng được mở khóa. Mỗi Thuộc tính có #value 3#! Cấp độ. Khi một Accolade tăng [accolade_rank|E] của nó, chủ sở hữu của nó có thể tăng cấp độ của một Thuộc tính hiện có hoặc thêm một Thuộc tính mới vào Accolade. Tuy nhiên, [acclaimed_knight|E] phải đáp ứng các yêu cầu của Thuộc tính mới.\n\nMỗi [knight|E] chỉ đủ điều kiện cho một số Thuộc tính nhất định, có thể dựa trên [traits|E], [skills|E] hoặc các lần mở khóa kinh nghiệm trong khi phục vụ với tư cách là Hiệp sĩ.\n\nMỗi Accolade phải có các Thuộc tính độc đáo: Lãnh chúa #high không#! được phép trùng lặp các Thuộc tính giữa các Accolade. Mỗi Accolade cũng có thể chuyên về chỉ #value 1#! Thuộc tính kiểu [men_at_arms|E]."

  game_concept_accolade_succession:0 "Kế vị Huân hiệu"
  game_concept_accolade_succession_desc:1 "Sự kế vị Accolade xảy ra khi một [acclaimed_knight|e] [accolade_possessive|E] chết hoặc trở nên không hợp lệ.\n\nHiệp sĩ Được ca ngợi trước đó được thay thế ngay lập tức. Các [courtiers|E] và [knights|E] trẻ được đào tạo nhờ [accolade_squires|E] Năng khiếu của Accolade được ưu tiên trở thành Người kế vị; sau đó là các hiệp sĩ khác, các triều thần khác, lãng khách, và cuối cùng là các [characters|E] mới được tạo ra. Dựa trên Năng khiếu của [accolade_squires|E] của Accolade, Hiệp sĩ mới sẽ nhận được tăng [prowess_skill|E], [martial_skill|E], [GetTrait('tourney_participant').GetName( GetNullCharacter )] [trait_level_track_xp|E], và có thể là các [skills|E] khác.\n\nSau khi Kế vị Accolade, một lượng nhỏ [glory|E] có thể bị mất và Năng khiếu Giám mã của Accolade được thiết lập lại để phản ánh các kỹ năng và kinh nghiệm của Hiệp sĩ Được ca ngợi mới.\n\nHiệp sĩ Được ca ngợi chết trong trận chiến, đấu tay đôi hoặc một cách danh dự khác sẽ làm mất đi sự tổn thất Danh dự và cải thiện Giám mã của Accolade."

  game_concept_accolade_rank:0 "Xếp hạng Huân hiệu"
  game_concept_accolade_ranks:0 "Xếp hạng Huân hiệu"
  game_concept_accolade_rank_short:0 "Xếp hạng"
  game_concept_accolade_rank_desc:1 "Một [accolade|e] có #value 6#! cấp bậc lũy tiến giúp mở khóa các phần thưởng cụ thể cho các [accolade_types|e] của nó, chẳng hạn như [knight_army_modifiers|e].\n\nViệc giành được [glory|E] sẽ mở khóa từng Xếp hạng, trong khi mất đi Vinh quang có thể khiến chúng bị mất đi Xếp hạng.\n\nXếp hạng số lẻ được cung cấp bởi Thuộc tính chính của Huân hiệu và Xếp hạng chẵn được cung cấp bởi Thuộc tính phụ."

  game_concept_glory:0 "Vinh quang"
  game_concept_glory_desc:1 "Vinh quang của một [accolade|E] làm tăng [accolade_rank|E] của nó.\n\nVinh quang có được khi [acclaimed_knight|E] giành chiến thắng các [battles|E], đánh bại các chiến binh, thi đấu trong các [contests|E] [GetActivityType( 'activity_tournament' ).GetName], và tham dự các [activities|E].\n\nTuy nhiên, Vinh quang của Huân hiệu bị hạ thấp khi Hiệp sĩ Huân hiệu thua trận, vào lúc [accolade_succession|e], và khi Huân hiệu trở thành một [inactive_accolade|E]."

  game_concept_accolade_squires: "Cận vệ"
  game_concept_accolade_squire: "Cận vệ" 
  game_concept_accolade_squires_desc: "Mỗi [accolade|E] đều có chỉ số Năng lực Cận vệ, chỉ số này sẽ điều chỉnh các [traits|E] và [skills|E] (chủ yếu là [prowess_skill|E], [martial_skill|E] và [trait_level_track_xp|E] của [GetTrait('tourney_participant').GetName( GetNullCharacter )]) cho [acclaimed_knight|E] tiếp theo.\n\nCó 5 cấp độ Năng lực cho Cận vệ:\n$EFFECT_LIST_BULLET$Ưu tú (Accomplished)\n$EFFECT_LIST_BULLET$Thạo việc (Capable)\n$EFFECT_LIST_BULLET$Thiếu kinh nghiệm (Inexperienced)\n$EFFECT_LIST_BULLET$Yếu kém (Feckless)\n$EFFECT_LIST_BULLET$Tệ hại (Pathetic)\n\nKhi đạt mức Năng lực từ Thiếu kinh nghiệm trở lên, Hiệp sĩ Ưu tú sẽ thỉnh thoảng gây ảnh hưởng đến các [traits|E] và [skills|E] của những [courtiers|E] trẻ tuổi có giới tính phù hợp với quân đội, giúp họ được ưu tiên kế nhiệm Danh hiệu khi diễn ra [accolade_succession|E].\n\nNăng lực Cận vệ chủ yếu được cải thiện thông qua việc tăng [glory|E], nhưng cũng bao gồm:\n$EFFECT_LIST_BULLET$[prowess_skill|E] của Hiệp sĩ Ưu tú\n$EFFECT_LIST_BULLET$[martial_skill|E] của Hiệp sĩ Ưu tú\n$EFFECT_LIST_BULLET$Hiệp sĩ Ưu tú nhận được [trait_level_track_xp|E] của [GetTrait('tourney_participant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Hiệp sĩ Ưu tú nhận được [trait_level_track_xp|E] của [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[martial_skill|E] của [liege|E] sở hữu Danh hiệu\n$EFFECT_LIST_BULLET$[prowess_skill|E] của [liege|E] sở hữu Danh hiệu\n\nMỗi khi [accolade_succession|E] diễn ra, chỉ số Năng lực Cận vệ của Danh hiệu đó sẽ bị đặt lại."

  game_concept_tax_collector:  "Người thu thuế"
  game_concept_tax_collector_desc:  "$game_concept_tax_collector$ cho phép [tax_jurisdictions|E] vận hành hoạt động.\n\n[aptitude|E] của họ xác định số lượng [taxes|E] và [levies|E] mà họ thu được cho [liege|E] của mình."
  game_concept_tax_collectors:  "Người thu thuế"

  game_concept_tax_decree:  "Sắc lệnh Thuế"
  game_concept_tax_decree_desc:  "Mỗi [tax_jurisdiction|E] có thể có một $game_concept_tax_decree$ khác nhau, tác động sửa đổi [taxes|E] và [levies|E] do [taxpayers|E] đóng góp.\n\n$game_concept_tax_decrees$ thường sẽ thay đổi [obligations|E] để đổi lấy một hình phạt hoặc lợi ích khác."
  game_concept_tax_decrees:  "Sắc lệnh Thuế"

  game_concept_tax_jurisdiction:  "Khu vực Quản lý Thuế"
  game_concept_tax_jurisdictions:  "Khu vực Quản lý Thuế"
  game_concept_tax_jurisdiction_desc:  "$game_concept_tax_jurisdiction$ là một nhóm [taxpayers|E] được tạo thành từ các [vassals|E] [clan|E]. Mỗi $game_concept_tax_jurisdiction$ hỗ trợ tối đa #V 12#! $game_concept_taxpayers$.\n\nMỗi $game_concept_tax_jurisdiction$ có thể có một [tax_decree|E].\n\nSố lượng các $game_concept_tax_jurisdictions$ có sẵn được xác định bởi [rank|E], [traditions|E], và [innovations|E].\n\nMột $game_concept_tax_jurisdiction$ yêu cầu một [tax_collector|E] sẽ được bổ nhiệm."
 
  game_concept_untaxed_jurisdiction:  "Khu vực Quản lý Miễn Thuế"
  game_concept_untaxed_jurisdictions:  "Khu vực Quản lý Miễn Thuế"
  game_concept_untaxed_jurisdiction_short:  "Miễn Thuế"
  game_concept_untaxed_jurisdiction_desc:  "$game_concept_untaxed_jurisdiction$ là một [tax_jurisdiction|E] có [taxpayers|E], nhưng không có [tax_collector|E]. Điều này có nghĩa là $game_concept_taxpayers$ được chỉ định sẽ không mang lại bất kỳ [taxes|E] hay [levies|E] nào cho [liege|E] của họ."
 
  game_concept_taxpayer:  "Người đóng thuế"
  game_concept_taxpayers:  "Người đóng thuế"
  game_concept_taxpayer_desc:  "$game_concept_taxpayers$ là các [vassals|E] [clan|E] đã được chỉ định cho một [tax_jurisdiction|E], và sẽ đóng góp [tax|E] Thu nhập và [levies|E] hằng tháng, miễn là có [tax_collector|E] được bổ nhiệm."
  game_concept_taxpayer_i:  "@tax_collector_icon!"
 
  game_concept_unassigned_vassal:  "Chư hầu Miễn Thuế"
  game_concept_unassigned_vassals:  "Chư hầu Miễn Thuế"
  game_concept_unassigned_vassal_short:  "Miễn Thuế"
  game_concept_unassigned_vassal_desc:  "$game_concept_unassigned_vassals$ là các [vassals|E] [clan|E], người không được chỉ định vào một [tax_jurisdiction|E] với tư cách là [taxpayers|E], và do đó không đóng góp [taxes|E] hoặc [levies|E].\n\nSau khi được chỉ định cho một $game_concept_tax_jurisdiction$ với một [tax_collector|E], thì họ sẽ bắt đầu chi trả hằng tháng."

  game_concept_retinue_maa:0 "Tùy tùng Men-at-Arms"
  game_concept_retinue_maa_desc:0 "Một số [accolade_types|E] cấp quyền truy cập vào các [men_at_arms|E] đặc biệt. Chúng được mở khóa bằng cách có một [acclaimed_knight|E] với tiến bộ trong [trait_level_track|E] [GetTrait('tourney_participant').GetName( GetNullCharacter )] hoặc [commander_trait|E] có liên quan.\n\nTùy tùng $game_concept_men_at_arms$ bị giới hạn ở một [regiment|E] và có số lượng quân số giới hạn. Chúng có hiệu quả gấp đôi trong việc chống lại các $game_concept_men_at_arms$ khác và ngày càng trở nên tốt hơn theo từng thời đại."

  game_concept_knight_army_modifier:0 "Sửa đổi Quân đoàn Knight"
  game_concept_knight_army_modifiers:0 "Sửa đổi Quân đoàn Knight"
  game_concept_knight_army_modifier_desc:0 "Ảnh hưởng được áp dụng cho bất kỳ [army|e] nào mà #high có chứa#! [acclaimed_knight|e] thích hợp.\n\n[knight|e] #high không#! cần phải là [commander|e] Quân đội của họ để có thể áp dụng Sửa đổi Quân đoàn Knight."

  game_concept_piety_level_impact:0 "Tác động Cấp độ Hiến dâng"
  game_concept_piety_level_impact_desc:0 "Tác động Cấp độ Hiến dâng tăng hoặc giảm các [modifiers|E] nhận được từ [piety_level|E] hiện tại của ngài."

  game_concept_prestige_level_impact:0 "Tác động Cấp độ Danh tiếng"
  game_concept_prestige_level_impact_desc:0 "Tác động Cấp độ Danh tiếng làm tăng hoặc giảm các [modifiers|E] nhận được từ [prestige_level|E] hiện tại của ngài."

  game_concept_hostage:  "Con tin"
  game_concept_hostages:  "Con tin"
  game_concept_hostages_possessive:  "Con tin"
  game_concept_hostage_desc:  "[close_family_member|E] của một [ruler|E], bị buộc phải rời khỏi [home_court|E] của mình như một sự đảm bảo cho hòa bình hoặc sự tuân phục.\n\nDanh tiếng của $game_concept_rulers$, người tuyên bố [war|E], mặc dù đã rời đi hoặc nhận được $game_concept_hostage$ sẽ bị tổn hại nghiêm trọng, và $game_concept_wardens$ có thể tự do hành quyết $game_concept_hostages$ của kẻ thù của mình.\n\nCác $game_concept_hostages$ được đối xử tốt có khả năng dần trung thành với $game_concept_warden$ của mình, người có thể nhận được một [hook|E], hoặc thậm chí trở thành [friends|E].\n\nCác $game_concept_hostages$ phải là trẻ em, anh chị em, cháu gái, cháu trai hoặc cháu nội/ngoại không có đất đai trong $game_concept_ruler$ của $game_concept_home_courts_possessive$.\n\nCác $game_concept_wardens$ có cơ hội nhận được [perpetual_hook|E] đối với $game_concept_hostage$ khi chúng đủ tuổi trưởng thành, dựa trên tính cách, quan điểm và thời gian làm việc tại triều đình của $game_concept_wardens$."

  game_concept_home_court:  "Triều đình Nguyên Thuộc"
  game_concept_home_courts:  "Triều đình Nguyên Thuộc"
  game_concept_home_courts_possessive:  "Triều đình Nguyên Thuộc"
  game_concept_home_court_desc:  "Một [ruler|E], người là [close_family_member|E] của một [hostage|E] và đã gửi họ đến cho một [warden|E] như một sự đảm bảo cho hòa bình hoặc sự quy phục."

  game_concept_warden:  "Quản giáo"
  game_concept_wardens:  "Quản giáo"
  game_concept_wardens_possessive:  "Quản giáo"
  game_concept_warden_desc:  "Một [ruler|E], người đã bị gửi đi làm [hostage|E] ở một [home_court|E] ngoại bang như một sự đảm bảo cho hòa bình hoặc sự quy phục.\n\nMột [warden|E] sẽ tích lũy [prestige_i|E][prestige|E] theo thời gian cho mỗi [hostage|E] ở [court|E] cụa họ."
 
  game_concept_goliardic_shenanigans:  "Trò tai quái kiểu Goliard"
  game_concept_goliardic_shenanigans_desc:  "Một nhân vật trong [GetActivityType('activity_adult_education').GetName] có thể gặp đủ mọi trò nghịch ngợm khi trải qua thời học sinh. Hậu quả là những cuộc phiêu lưu của họ là không thể đoán trước, bao gồm điểm [skill|E], lối sống và các [traits|E] căng thẳng, kinh nghiệm sống, bệnh tật và vết thương."

  game_concept_adoption:  "Nhận nuôi"
  game_concept_adopt:  "Nhận nuôi"
  game_concept_adopts:  "Nhận nuôi"
  game_concept_adopting:  "Nhận nuôi"
  game_concept_adopted:  "Nhận nuôi"
  game_concept_adoption_desc:  "Nhận con nuôi là hành động đưa một [character|E] khác vào [house|E] và [dynasty|E] của ngài."

 
  game_concept_legitimacy:  "Tính hợp pháp"
  game_concept_legitimacy_desc:  "$game_concept_legitimacy$ là biểu thị cho quyền cai trị của một [ruler|E]. Các [vassals|E] cũng tạo ra [legitimacy_expectations|E] mà [liege|E] được cho là phải đáp ứng.\n\nChỉ các [rulers|E] mới có $game_concept_legitimacy$, được tính tại thời điểm họ trở thành nhà cai trị và dẫn đến [initial_legitimacy|E] của họ. Một phần $game_concept_legitimacy$ của nhà cai trị trước đó cũng được [heir|E] kế thừa.\n\n$game_concept_legitimacy$ ảnh hưởng đến nhiều hệ thống trò chơi, đưa ra các đề xuất [marriage|E], [vassalization|E] và [alliances|E] có nhiều khả năng được chấp nhận hơn, và các [claims|E] rẻ hơn, cũng như xoay chuyển [scales_of_power|E] trong thời kỳ [regency|E].\n\n$game_concept_legitimacy$ typically có 5 [legitimacy_levels|E] và một cấp độ #weak Bất hợp pháp#! bên dưới.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
  game_concept_legitimacy_i:  "[GetLocalPlayerLegitimacyTextIcon]"
  game_concept_legitimacy_desc_nomadic:  "\n\nCác [rulers|E] [GetGovernment( 'nomad_government' ).GetName] có một loại $game_concept_legitimacy$ đặc biệt, độc lập với [rank|E] của họ."
  game_concept_legitimacy_desc_mandala:  "\n\nCác [rulers|E] [GetGovernment( 'mandala_government' ).GetName] có một loại $game_concept_legitimacy$ đặc biệt, độc lập với [rank|E] của họ và có các cấp độ bổ sung."
 
  game_concept_legitimacy_level:  "Cấp độ Hợp pháp"
  game_concept_legitimacy_level_desc:  "$game_concept_legitimacy_levels$ có thể kiếm được thông qua nhiều cách: chiến thắng [wars|E], phóng thích [valuable_prisoners|E], tạo lập [legends|E], tổ chức [court|E], hoặc tham gia các [activities|E].\n\nTuy nhiên, chúng cũng có thể bị mất đi: [epidemics|E] tàn phá [capital|E], thất bại trước cuộc chiến tranh (đặc biệt là cuộc chiến tranh [faction|E]), mất [titles|E], hoặc một [hostile_scheme|E] bị vạch trần là một số nguyên nhân chính khiến cho $game_concept_legitimacy$ suy giảm.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_level_desc_nomadic' )]"
  game_concept_legitimacy_levels:  "Cấp độ Hợp pháp"
  game_concept_legitimacy_gain:  "Tính hợp pháp Nhận được"
  game_concept_legitimacy_level_desc_nomadic:  "\n\nCác nhà cai trị [GetGovernment( 'nomad_government' ).GetName] sẽ nhận được nhiều hơn #V 50%#! Tính hợp pháp khi giành chiến thắng trong các cuộc chiến, nhưng họ cũng mất gấp đôi khi bị đánh bại. Họ cũng sẽ nhận được Tính hợp pháp từ [single_combat_duel_plural|E] và kết hôn với các [courtiers|E] xuất thân từ dòng dõi quý tộc của một nhân vật có [dominance|E] ngang bằng hoặc cao hơn."
 
  game_concept_expected_legitimacy:  "Tính hợp pháp Kỳ vọng"
  game_concept_expected_legitimacy_desc:  "[legitimacy_level|E] mà các [vassals|E] mong đợi từ [ruler|E] của mình, dựa trên mối quan hệ lịch sử của họ. Một số yếu tố làm giảm Kỳ vọng là:\n$BULLET_WITH_TAB$Là [liege|E] [de_jure|E] của chư hầu\n$BULLET_WITH_TAB$Là một phần của [close_family|E] của chư hầu\n$BULLET_WITH_TAB$Là [preferred_heir|E] của chư hầu\n$BULLET_WITH_TAB$Là cùng một [dynasty|E] mà chư hầu đã phục vụ lâu hơn #color_white 50#! năm\n$BULLET_WITH_TAB$Chư hầu không phải là một [powerful_vassal|E]\n\nNếu Cấp độ thực tế thấp hơn Kỳ vọng của họ, thì họ có thể trở nên ngỗ ngược: [opinion|E] của họ sẽ thấp hơn và họ có thể tham gia các [factions|E] chống lại [liege|E] của mình.\n\nKỳ vọng tăng theo cấp độ của [primary_title|E] của họ, cũng như theo [era|E]."
  game_concept_legitimacy_expectations:  "Tính hợp pháp Kỳ vọng"
  game_concept_legitimacy_expectations_desc:  "$game_concept_expected_legitimacy_desc$"
 
  game_concept_initial_legitimacy:  "Tính hợp pháp Ban đầu"
  game_concept_initial_legitimacy_desc:  "$game_concept_legitimacy$ mà một [character|E] có được khi họ có đất đai.\n\nNó được tính toán dựa trên [dynasty_prestige_level|E], mối quan hệ với người tiền nhiệm của họ, [court_grandeur|E], giới tính, [bastardy|E], số năm nắm vai trò [ruler|E], [dynasty_perk|E] [legitimacy|E], [diplomacy|E], [virtues|E], [sins|E] và các [traits|E] đặc biệt khác, như [GetTrait('sayyid').GetName( GetNullCharacter )], [GetTrait('diplomat').GetName( GetNullCharacter )] và [GetTrait('just').GetName( GetNullCharacter )].\n\nCác [heirs|E] sẽ kế thừa [GetDefine( 'NCharacter', 'LEGITIMACY_INHERITED' )|V%^] $game_concept_legitimacy$ của nhà cai trị trước đó nếu kế thừa một [title|E] có [title_tier|E] cao hơn."
 
  game_concept_court_position_task_short:  "Nhiệm vụ"
  game_concept_court_position_task_short_desc:  "$game_concept_court_position_task_desc$"
  game_concept_court_position_tasks_short:  "Nhiệm vụ"
  game_concept_court_position_tasks_short_desc:  "$game_concept_court_position_task_desc$"
  game_concept_court_position_task:  "Nhiệm vụ Vị trí Triều đình"
  game_concept_court_position_tasks:  "Nhiệm vụ Vị trí Triều đình"
  game_concept_court_position_tasks_desc:  "$game_concept_court_position_task_desc$"
  game_concept_court_position_task_desc:  "Một số [court_positions|E] có thể thực hiện một nhiệm vụ bổ sung, thường mang lại nhiều lợi ích hơn đổi lại là một khoản chi phí thêm.\n\nMỗi lần chỉ có thể thực hiện một nhiệm vụ cho mỗi [court_position|E]."

  game_concept_fatalities:  "Người chết bệnh"
  game_concept_fatalities_desc:  "Các [characters|E] đã chết do hậu quả trực tiếp của [epidemic|E] hoặc [natural_disaster|E]."
  game_concept_funeral:  "Tang lễ"
  game_concept_funeral_desc:  "Một [activity|E] trong đó một [host|E] invitesmời nhiều [characters|E] khác nhau đến, và bày tỏ sự tôn trọng của họ sau khi một [character_death|E] gần đây. Tang lễ thường dẫn đến tăng [legitimacy|E], giảm [stress|E], và cơ hội thể hiện [piety|E]."
  game_concept_funerals:  "Tang lễ"

  game_concept_scheme_group_calculating:  "Tính toán"
  game_concept_calculating_schemes:  "Âm mưu Tính toán"
  game_concept_scheme_group_calculating_desc:  "$game_concept_calculating_schemes$ liên quan đến các hành động được tính toán trước, thường có một sự cố cuối cùng, trong đó những kẻ âm mưu tấn công.\n\nChúng bị ngăn chặn tốt nhất bởi các $game_concept_scheme_countermeasure_countermeasures$ có vũ trang như #V $scheme_countermeasure_type_redouble_guards$#!.\n\nCác ví dụ bao gồm:\n$EFFECT_LIST_BULLET$[GetScheme('abduct').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('murder').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('overthrow_regent').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('steal_back_artifact').GetTypeName]"

  game_concept_scheme_group_opportunistic:  "Linh hoạt"
  game_concept_opportunistic_schemes:  "Âm mưu Linh hoạt"
  game_concept_scheme_group_opportunistic_desc:  "$game_concept_opportunistic_schemes$ bao gồm các hành động ngẫu hứng, lặp đi lặp lại, giữa các [characters|E] gặp nhau một cách không chính thức.\n\nChúng bị ngăn chặn tốt nhất bởi các $game_concept_scheme_countermeasure_countermeasures$ cảnh giác như #V $scheme_countermeasure_type_strengthen_sentries$#!.\n\nVí dụ bao gồm:\n$EFFECT_LIST_BULLET$[GetScheme('seduce').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('befriend').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('convert_to_witchcraft').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('courting').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('elope').GetTypeName]"

  game_concept_scheme_group_indirect:  "Gián tiếp"
  game_concept_indirect_schemes:  "Âm mưu Gián tiếp"
  game_concept_scheme_group_indirect_desc:  "Các $game_concept_indirect_schemes$ thường không cần phải tương tác trực tiếp với [scheme_target|E] của chúng.\n\nVì lý do này, chúng không thể được khắc chế hiệu quả, nhưng một số $game_concept_scheme_countermeasure_countermeasures$ có thể khiến chúng trở nên tệ hơn.\n\nVí dụ bao gồm:\n$EFFECT_LIST_BULLET$[GetScheme('claim_throne').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('fabricate_hook').GetTypeName]"

  game_concept_scheme_opportunity:  "Lợi thế Âm mưu"
  game_concept_scheme_opportunities:  "Lợi thế Âm mưu"
  game_concept_scheme_opportunity_opportunity:  "Lợi thế"
  game_concept_scheme_opportunity_opportunities:  "Lợi thế"
  game_concept_scheme_opportunity_i:  "@scheme_opportunity_icon!"
  game_concept_scheme_opportunity_desc:  "$game_concept_scheme_opportunity_opportunities$ biểu thị tiến trình đạt được mục tiêu của một [scheme|e]. Chúng có thể được sử dụng để thuyết phục các [agents|e] tham gia hoặc thực hiện một $game_concept_scheme$, với [success_chance|e] tăng lên."

  game_concept_favorite_child:  "Đứa trẻ Yêu thích"
  game_concept_favorite_child_desc:  "$game_concept_favorite_child$ là hậu duệ trực hệ của cùng một [dynasty|E] mà nhà cai trị Người chơi có thể chọn dành sự ưu ái. Chúng sẽ có [opinion|E] cao hơn về ngài, và khi ngài chết, ngài có thể chọn tiếp tục di sản của mình thông qua chúng, thay vì người thừa kế của ngài.\n\nĐứa trẻ yêu thích của ngài có thể là bất kỳ đứa con, đứa cháu và đứa chắt nào, miễn là chúng thuộc về triều đại của ngài."

  game_concept_scheme_breach_short:  "Đột phá"
  game_concept_scheme_breaches_short:  "Đột phá"
  game_concept_scheme_breach:  "Đột phá Âm mưu"
  game_concept_scheme_breaches:  "Đột phá Âm mưu"
  game_concept_scheme_breach_desc:  "$game_concept_scheme_breach_short$ biểu thị biến chuyển trong một [secret_scheme|e]. Khi một [scheme|e] đạt tới đột phát, [success_chance|e] của nó sẽ giảm. Hình phạt đối với $game_concept_success_chance$ tăng lên cho mỗi $game_concept_scheme_breach_short$ tích lũy. Khi $game_concept_scheme$ đạt tới #V 5#! $game_concept_scheme_breaches_short$, nó sẽ tự động thất bại.\n\n#WEAK Các $game_concept_schemes$ cũng kiểm tra $game_concept_secrecy$ của chúng khi chúng cuối cùng được thực — đột phá không ảnh hưởng đến điều này theo cách này hay cách khác.#!"

  game_concept_influence_ward_personality:  "Ảnh hưởng Tính cách của Người được Giám hộ"
  game_concept_influence_ward_personality_desc:  "Một [interaction|E] mà ở đó một người có thể cố gắng tác động đến [ward|E] để họ có được [personality_trait|E] giống với mình. "

  game_concept_faction_commitment:  "Phe phái Trung thành"
  game_concept_faction_commitment_desc:  "Khả năng một [character|E] ủng hộ một [faction|E] chống lại [liege|E] của họ.\n\nKhả năng này có thể bị ảnh hưởng bởi nhiều lý do, phổ biến nhất là [personality|E], [opinion|E], và [culture|E]."

  game_concept_state_faith:  "Đức tin Quốc gia"
  game_concept_state_faith_desc:  "$game_concept_state_faith$ là [faith|E] được ủng hộ và chấp nhận bởi một [administrative_government|E]. Đức tin này gắn liền với [title|E] chứ không phải với bất kỳ [character|E] cụ thể nào. Việc cải đạo các nhân vật trong [realm|E] sang Đức tin Quốc gia dễ hơn, và rất khó để chuyển đổi họ khỏi đức tin đó.\n\nChỉ [ruler|E] của một Quốc gia Hành chính mới có thể thay đổi Đức tin Quốc gia, nhưng các [governors|E] có thể tự do chuyển đổi sang đức tin đó."

  game_concept_story_cycle: "Câu chuyện"
  game_concept_story_cycles: "Câu chuyện"
  game_concept_story_cycle_desc: "Một Câu chuyện là một tình huống cá nhân gắn liền với một [ruler|E].\n\nCó rất nhiều loại Câu chuyện — từ việc sở hữu một [GetModifier('dog_story_modifier').GetNameWithTooltip] cho đến việc trở thành một #V [GetTrait('conqueror').GetName( GetNullCharacter )]#!. Mỗi câu chuyện được xây dựng từ các yếu tố khác nhau, thường liên quan đến các [characters|E], [titles|E], hoặc [decisions|E] quan trọng."

  game_concept_story_generic_prefix:  "Câu chuyện của"
  game_concept_story_generic_desc_boilerplate:  "#WEAK Nội dung câu chuyện là tùy chọn. Ngài luôn có thể chọn không tham gia khi bắt đầu chơi."
  game_concept_story_content_hereward:  "$game_concept_story_generic_prefix$ $bookmark_laamps_hereweard_the_wake$"
  game_concept_story_content_hereward_desc:  "#tooltip_heading Kiểu Câu chuyện: Mở rộng#!\n\nVới tư cách là Hereward, chuyến lưu đày của ngài sẽ không kéo dài lâu. Với việc England nằm dưới ách thống trị của ngoại bang, ngài sẽ trở về quê hương để chiến đấu giành lấy tự do, gột sạch nỗi ô nhục của mình và giết chết người Norman.\n\nMột cơ chế đặc biệt sẽ hoạt động trong suốt thời gian đó, lập biểu đồ về cuộc kháng chiến của England chống lại sự cai trị của người Norman và các sự kiện trong câu chuyện được viết kịch bản sẽ diễn ra trong thời gian này. Câu chuyện của ngài sẽ đạt tới đỉnh điểm bằng cái chết: của ngài hoặc của kẻ thù.\n\n$game_concept_story_generic_desc_boilerplate$"
  game_concept_story_content_el_cid:  "$game_concept_story_generic_prefix$ $bookmark_laamps_el_cid$"
  game_concept_story_content_el_cid_desc:  "#tooltip_heading Kiểu Câu chuyện: Nhẹ nhàng#!\n\nVới vai trò là El Cid, ngài sẽ bị lãnh chúa của mình bỏ rơi một cách oan uổng. Khi lưu vong, ngài có thể lựa chọn trung thành hoặc tìm con đường riêng của mình, cuối cùng dẫn tới đỉnh điểm với việc trở lại triều đình, #EMP hoặc#! giành được giải thưởng cuối cùng — Valencia.\n\n$game_concept_story_generic_desc_boilerplate$"
  game_concept_story_content_wallada:  "$game_concept_story_generic_prefix$ $bookmark_laamps_wallada_bint_al_mustakfi$"
  game_concept_story_content_wallada_desc:  "#tooltip_heading Kiểu Câu chuyện: Trung bình#!\n\nVới tư cách là Wallada, ngài sẽ cải thiện đặc điểm [GetTrait('violet_poet').GetName( GetNullCharacter )] theo yêu cầu bằng cách viết thơ và thành lập các hội thảo thơ văn trữ tình trên khắp thế giới, đồng thời cải thiện một cuốn sách độc đáo khi ngài phát triển.\n\nKết thúc câu chuyện sẽ rất kịch tính tùy theo lựa chọn của ngài, và mặc dù không có con, nhưng ngài sẽ được cung cấp nhiều cách để tiếp tục chơi.\n\n$game_concept_story_generic_desc_boilerplate$"
  game_concept_story_content_hasan:  "$game_concept_story_generic_prefix$ $bookmark_laamps_hassan_sabbah$"
  game_concept_story_content_hasan_desc:  "#tooltip_heading Kiểu Câu chuyện: Trung bình#!\n\nVới tư cách là Hasan, ngài sẽ được dẫn dắt đi theo con đường cuồng tín tôn giáo, chọn một nơi để mang ánh sáng của Đức tin Chân chính đến và chuyển đổi các [counties|E] khỏi [rulers|E] của họ.\n\nCuối cùng, câu chuyện của ngài sẽ đạt tới đỉnh điểm bằng một cuộc nổi loạn tôn giáo lớn chống lại kẻ thù mà ngài đã chọn.\n\n$game_concept_story_generic_desc_boilerplate$"
 
  game_concept_harrying_widget_i:  "@harrying_widget!"
  game_concept_harrying_widget:  "@harrying_widget! Tiễu trừ Phương Bắc"
  game_concept_harrying_widget_desc:  "Các cai trị Norman và quý tộc Anglo-Saxon mới bị phế truất đang bị mắc kẹt trong một cuộc chiến khốc liệt giành quyền kiểm soát England. Một cuộc chiến như vậy sẽ không kết thúc cho đến khi một hoặc cả hai nhóm bị loại bỏ hoàn toàn khỏi quyền lực.\n\nKhi tình hình biến triển, các hành động của họ và các nhân vật khác sẽ chi phối các cấp độ [harrying_resistance|E] và [harrying_pacification|E] của khu vực.\n\n#TS #EMP Kháng cự#! cao hơn sẽ dẫn tới:#!\n$EFFECT_LIST_BULLET$Giảm [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Giảm [county_control|E]\n$EFFECT_LIST_BULLET$Cơ hội cao hơn cho [claimant_factions|E] hoặc thậm chí là [civil_war|E].\n\n#TS #EMP Bình định#! cao hơn sẽ dẫn tới:#!\n$EFFECT_LIST_BULLET$Tăng [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Tăng [dread|E] đối với nhà cai trị England\n$EFFECT_LIST_BULLET$Truy cập vào [decision|E] $embrace_english_culture_decision$."

  game_concept_harrying_resistance:  "Kháng cự"
  game_concept_harrying_resistance_desc:  "Kháng cự đo lường sự phản đối liên tục đối với chế độ cai trị của người Norman ở England từ người Anglo-Saxon hiện tại. Giả sử Kháng cự #BOL cao hơn#! [harrying_pacification|E], thì nó mang lại các ảnh hưởng ở các cấp độ sau:\n\n#S Kháng cự trên #V 7#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: [EmptyScope.ScriptValue('miniscule_cultural_acceptance_loss')|0V] mỗi tháng\n\n#S Kháng cự trên #V 10#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: [EmptyScope.ScriptValue('minor_cultural_acceptance_loss')|0V] mỗi tháng\n$EFFECT_LIST_BULLET$Tăng nhẹ xác suất các [claimant_factions|E] chống lại nhà cai trị England\n\n#S Kháng cự trên #V 13#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: [EmptyScope.ScriptValue('medium_cultural_acceptance_loss')|0V] mỗi tháng\n$EFFECT_LIST_BULLET$Tăng lên đôi chút xác suất các [claimant_factions|E] chống lại nhà cai trị England\n$EFFECT_LIST_BULLET$[county_control|E] ở tất cả các [counties|E] giảm [EmptyScope.ScriptValue('minor_discontent_loss')|0V] sau mỗi #V 3#! tháng đối với mọi chư hầu của England\n\n#S Kháng cự trên #V 16#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: [EmptyScope.ScriptValue('major_cultural_acceptance_loss')|0V] mỗi tháng\n$EFFECT_LIST_BULLET$Tăng đáng kể xác suất các [claimant_factions|E] chống lại nhà cai trị England\n$EFFECT_LIST_BULLET$[county_control|E] ở tất cả các [counties|E] giảm [EmptyScope.ScriptValue('medium_discontent_loss')|0V] sau mỗi #V 3#! tháng đối với mọi chư hầu của England"
  game_concept_harrying_pacification:  "Bình định"
  game_concept_harrying_pacification_desc:  "Bình định theo dõi mức độ hiệu quả của những nhà cai trị Norman mới của England trong việc chế ngự dân cư Anglo-Saxon đang phẫn nộ. Giả sử Bình định #BOL cao hơn#! so với [harrying_resistance|E], nó sẽ mang lại ảnh hưởng ở các cấp độ sau:\n\n#S Bình định trên #V 5#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: +[EmptyScope.ScriptValue('miniscule_cultural_acceptance_gain')|0V] mỗi tháng\n\n#S Bình định trên #V 8#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: +[EmptyScope.ScriptValue('minor_cultural_acceptance_gain')|0V] mỗi tháng\n$EFFECT_LIST_BULLET$Thêm [dread_i]#V 1#! [dread|E] cho nhà cai trị England mỗi tháng\n\n#S Bình định trên #V 11#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: +[EmptyScope.ScriptValue('medium_cultural_acceptance_gain')|0V] mỗi tháng\n$EFFECT_LIST_BULLET$Thêm [dread_i]#V 2#! [dread|E] cho nhà cai trị England mỗi tháng\n\n#S Bình định trên #V 14#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] Anglo-Saxon/Norman: +[EmptyScope.ScriptValue('major_cultural_acceptance_gain')|0V] mỗi tháng\n$EFFECT_LIST_BULLET$Thêm [dread_i]#V 3#! [dread|E] cho nhà cai trị England mỗi tháng\n$EFFECT_LIST_BULLET$Cho phép [decision|E] #V $embrace_english_culture_decision$#!"
 
  game_concept_game_rule_extreme_i:  "@warning_icon!"
  game_concept_game_rule_extreme:  "Luật chơi Cực đoan"
  game_concept_game_rule_extreme_desc:  "Luật chơi này làm cho trò chơi trở nên khó khăn #bold đáng kể#!."

  game_concept_game_rule_unique_i:  "@alert_icon!"
  game_concept_game_rule_unique:  "Luật chơi Độc đáo"
  game_concept_game_rule_unique_desc:  "Luật chơi này sẽ thay đổi #bold đáng kể#! trải nghiệm của trò chơi."

 ### BP3
  game_concept_swing_scales_of_power:  "$swing_scales_currency_interaction$"
  game_concept_swing_scales_of_power_interaction:  "$game_concept_swing_scales_of_power$"
  game_concept_swing_scales_of_power_desc:  "Với cái giá phải trả là [prestige|E], [piety|E], hoặc [gold|E], một [liege|E] hoặc một [diarch|E] có thể thay đổi [scales_of_power|E] theo hướng có lợi cho họ."

  game_concept_destination:  "Điểm đến"
  game_concept_travel_destination:  "Điểm đến Lữ hành"
  game_concept_destination_desc:  "Điểm đến là mục tiêu trong khi [traveling|E], hoặc một trong nhiều mục tiêu. Đối với [pilgrimage|E], nó sẽ là [holy_site|E] được Lữ hành đến, trong khi đối với [tour|E] mọi [vassal|E] được viếng thăm sẽ được coi là Điểm đến."

  game_concept_roaming_longer_length_travel:  "Đi bộ Đường dài"
  game_concept_roaming_longer_length_travel_desc:  "Đi bộ Đường dài là một [activity_option|E] đối với [activity|E] [GetActivityType('activity_roaming').GetName]. Nhân vật sẽ dành nhiều thời gian hơn đáng kể cho hoạt động này và sẽ được trao nhiều cơ hội hơn."
 
  game_concept_inspection_success_chance:  "Cơ hội Thị sát Thành công"
  game_concept_inspection_success_chance_no_prefix:  "Cơ hội Thành công"
  game_concept_inspection_success_chance_desc:  "Thành công không phải là điều hiển nhiên khi thực hiện [inspection|E]. Các yếu tố chính ảnh hưởng đến xác suất này là:\n$BULLET_WITH_TAB$@skill_learning_icon![skills|E]\n$BULLET_WITH_TAB$@control_icon![county_control|E]\n$BULLET_WITH_TAB$@county_icon!Giáp ranh giới [realm|E] Lân bang\n\nCơ hội Thị sát Thành công không bao giờ cao hơn #bold 95#!."

  game_concept_inspection:  "Thị sát"
  game_concept_inspections:  "Thị sát"
  game_concept_inspection_i:  "@activity_inspection!"
  game_concept_inspection_desc:  "Một hoạt động mà [liege|E] đi đến một [county|E] trong [realm|E] để giám sát các ông trùm và quý tộc địa phương.\n\nHọ sẽ có cơ hội có một trong các lĩnh vực trọng tâm sau: $rewards_inspection_tt$"

  game_concept_skill_challenges:  "Thử thách Kỹ năng"
  game_concept_skill_challenges_no_prefix:  "Thách thức"
  game_concept_skill_challenges_desc:  "Thử thách kỹ năng là những khoảnh khắc mà nhân vật có cơ hội sử dụng một trong những [skills|E] của mình để tác động đến kết quả của một sự kiện. Kỹ năng càng cao thì khả năng nhân vật đạt được ý chí hoặc kết quả có lợi sẽ càng cao."

  game_concept_hike:  "Đi bộ Đường dài"
  game_concept_hike_i:  "@activity_hike!"
  game_concept_hike_desc:  "Bắt đầu chuyến thám hiểm đơn độc để thoát khỏi áp lực của cuộc sống cung đình.\n\nPhần thưởng dự kiến:\n$activity_roaming_host_desc$"

  game_concept_monument_expedition:  "Thám hiểm Kỳ quan"
  game_concept_monument_expedition_i:  "@activity_monument_expedition!"
  game_concept_monument_expedition_desc:  "Một hoạt động trong đó nhân vật chọn du hành đến một kỳ quan hoặc địa danh nổi tiếng để cải thiện bản thân bằng cách nghiên cứu lịch sử, truyền thuyết và những điều bí ẩn của nó.\n\nPhần thưởng dự kiến:\n\t$BULLET_WITH_TAB$Điểm [skill|E] [intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E]\n$BULLET_WITH_TAB$[court_position_i][aptitude|E] [court_positions|E] Xuất sắc\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]"

  game_concept_designated_terrain:  "Địa hình Đã chọn"
  game_concept_designated_terrain_desc:  "Một [decision|E] được mở khóa từ cây [wanderer_lifestyle|E], nơi ngài có thể chọn một nhóm [terrain|E] để chuyên biệt hóa. Một số [perks|E] nhất định sẽ cung cấp các lợi ích khác nhau cho nhóm địa hình đã chọn.\n\nCác nhóm địa hình mà người ta có thể chọn:\n$BULLET_WITH_TAB$@forest! Rừng / @jungle! Rừng rậm / @taiga! Taiga / @wetlands! Đất ngập nước\n$BULLET_WITH_TAB$@mountains! Núi / @hills! Đồi / @desert_mountains! Dãy núi Sa mạc\n$BULLET_WITH_TAB$@plains! Bình nguyên / @steppe! Thảo nguyên / @farmlands! Đất nông nghiệp / @floodplains! Vùng ngập lũ\n$BULLET_WITH_TAB$@desert! Sa mạc / @drylands! Vùng đất Khô hạn / @oasis! Ốc đảo"

  game_concept_master_terrain:  "Địa hình Chính"
  game_concept_master_terrain_desc:  "Một [decision|E] được mở khóa từ cây [wanderer_lifestyle|E], nơi ngài có thể chọn một [terrain|E] để chuyên biệt hóa, dựa trên nhóm mà ngài đã chọn trong [designated_terrain|E].\n\nQuyết nghị này sẽ mang lại những lợi ích đáng kể cho địa hình đã chọn, mang lại các phần thưởng như tăng [advantage|E], cải thiện [combat_roll|E], giảm [attrition|E], và tăng [prestige|E] và [prestige_experience|E] từ [battle|E]."

  game_concept_story_content_temujin:  "$game_concept_story_generic_prefix$ $bookmark_nomads_temujin$"
  game_concept_story_content_temujin_desc:  "#tooltip_heading Phong cách Cốt truyện: Nhẹ nhàng#!\n\nVới tư cách là Temüjin (Thiết Mộc Chân), ngài sẽ tìm cách trả thù một bộ tộc đối thủ đã giam cầm người vợ của mình và thử thách lòng trung thành của chư hầu và người chiến hữu thân thiết nhất của mình — Jamukha (Trát Mộc Hợp).\n\n$game_concept_story_generic_desc_boilerplate$"
  game_concept_story_content_jamukha:  "$game_concept_story_generic_prefix$ $bookmark_nomads_temujin$"
  game_concept_story_content_jamukha_desc:  "#tooltip_heading Phong cách Cốt truyện: Nhẹ nhàng#!\n\nVới tư cách là Jamukha (Trát Mộc Hợp), ngài luôn sống dưới cái bóng của Temüjin (Thiết Mộc Chân), nhưng đã đến lúc chứng minh sức mạnh của chính mình. Ngài sẽ vẫn trung thành với anh ta, hay sẽ cắt cổ anh ta trong bóng tối?\n\n$game_concept_story_generic_desc_boilerplate$"

  game_concept_wanua: "Wanua"
  game_concept_wanua_government: "Chính thể Wanua"
  game_concept_wanua_i: "@government_type_wanua!"
  game_concept_wanua_desc: "[government|E] $wanua_government_adjective$ có những điểm yếu tương tự như [government|E] [GetGovernment('tribal_government').GetNameWithIcon], nhưng cũng bị giảm [domain_limit|E] và [vassal_limit|E]. Mặc dù họ sử dụng [gold|E] để xây dựng [buildings|E] và chiêu mộ [men_at_arms|E], nhưng họ thu được rất ít Vàng từ các Công trình.\n\nTuy nhiên, họ có khả năng [barter_goods_i][barter|E], [raid|E], và có sự cộng hưởng với Chính thể [GetGovernment('mandala_government').GetName] vì họ nhận được [legitimacy|E] khi trở thành một [tributary|E]."

  game_concept_bloc_supremacy_war: "Chiến tranh Tranh giành Quyền bá chủ Khối"
  game_concept_bloc_supremacy: "Quyền bá chủ Khối"
  game_concept_supremacy: "Quyền tối thượng"
  game_concept_bloc_supremacy_war_desc: "$game_concept_bloc_supremacy_war$ là một loại [war|E] đặc biệt được tiến hành giữa các [leading_houses|E] của hai [house_blocs|E] [soryo|E].\n\n#high Không giống như các $game_concept_wars$ khác, tất cả thành viên của cả hai $game_concept_blocs$ sẽ cùng tham chiến.#!\n\n$game_concept_bloc$ chiến thắng sẽ nhận được [cohesion|E], trong khi $game_concept_bloc$ thua cuộc sẽ mất một phần ba $game_concept_cohesion$.\n\nNgoài ra, bất kỳ [member_houses|E] [soryo|E] nào của khối thua cuộc mà có [house_head|E] không [GetTrait('loyal').GetName( GetNullCharacter )], không bị [hooked|E], không phải là [vassal|E] cấp dưới, không phải [ally|E], không là [friends|E] với, hoặc không bị [cowed|E] bởi $game_concept_house_head$ của $game_concept_leading_house_possessive$ bên thua cuộc, sẽ gia nhập $game_concept_bloc$ chiến thắng."\

  game_concept_bloc_expansion_war:  "Chiến tranh Mở rộng Khối"
  game_concept_bloc_expansion:  "Mở rộng Khối"
  game_concept_bloc_expansion_war_desc:  "$game_concept_bloc_expansion_war$ là một loại [war|E] đặc biệt do một thành viên [bloc|E] tiến hành.\n\nNếu giành chiến thắng, người chiến thắng có thể chỉ định một [ruler|E] cho các [titles|E] tranh đoạt, hoặc giữ chúng cho riêng mình.\n\nViệc chỉ định một $game_concept_ruler$ theo cách này sẽ thêm một [hook|E] đối với người nhận, thêm họ vào $game_concept_bloc$ của người chiến thắng, và tìm thấy một [house|E] mới nếu người nhận không phải là [house_head|E]."

  game_concept_retirement_age: "$celestial_retirement_law$"
  game_concept_retirement_age_desc: "[law|E] $celestial_retirement_law$ quy định độ tuổi do [top_liege|E] của [realm|E] ấn định, mà sau ngưỡng đó, các [governors|E] và [ministers|E] có thể lựa chọn từ quan thông qua [decision|E] hoặc bị buộc phải làm vậy bằng một [character_interaction|E], với lý do sức khỏe suy giảm và năng lực phục vụ không còn đảm bảo do tuổi già."
