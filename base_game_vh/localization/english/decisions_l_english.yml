  restore_dumnonia_decision:0 "Khôi phục Vương quốc Cornwall"
  restore_dumnonia_decision_desc:0 "Tinh thần Dumnonia cổ đại đã cháy bỏng trong tim ta từ khi Brutus đặt chân lên bờ sương mù của Britannia. Nó sẽ còn cháy rực hơn nữa."
  restore_dumnonia_decision_tooltip:0 "Cornwall trở thành một [de_jure|E] [kingdom|E]."
  restore_dumnonia_decision_effects_de_jure_tt:0 "Nếu sở hữu, các [duchies|E] của [cornwall_somerset.GetNameNoTier] và [cornwall_gloucester.GetNameNoTier] sẽ trở thành [de_jure|E] của Cornwall."
  restore_dumnonia_decision_confirm:0 "Onen hag oll! (Vạn người như một!)"

  form_cumbria_decision: "Thành lập Vương quốc Cumbria"
  form_cumbria_decision_desc: "Đã đến lúc người dân Cumbria phải quy phục dưới sự cai trị của chính dòng máu mình, thay vì những kẻ xâm lược từ phương Nam và phương Bắc."
  form_cumbria_decision_tooltip: "Thành lập một vương quốc đích thực cho người Cumbria"
  form_cumbria_decision_confirm: "Cumbria của người Cumbria"
  custom_cumbria: "Vùng đất Cumbrian"
  form_cumbria_decision_de_jure_duchy: "[GetTitleByKey('d_cumbria').GetName] trở thành lãnh chúa [de_jure|E] của [GetTitleByKey('c_westmorland').GetName], [GetTitleByKey('c_cumberland').GetName], và [GetTitleByKey('c_annandale').GetName]"
  cumbrian_loyalists: "Người trung thành Cumbria"
  cumbrian_opinion: "Cảm tình của người Cumbria"
  form_cumbria_decision_house_modifier: "Những kẻ cai trị Cumbria"
  form_cumbria_decision_house_modifier_desc: "Những nhà cai trị đã được chứng thực của người dân Cumbria, được toàn bộ khu vực tôn trọng và vinh danh.\n\n"
  custom_cumbria_development_growth: "$MOD_MONTHLY_DEVELOPMENT_GROWTH_FACTOR$ tại [region|E] [GetGeographicalRegion('custom_cumbria').GetName]"
  major_decisions.3500.t: "Vùng đất Cumbria"
  major_decisions.3500.desc: "Những ngọn đồi lộng gió của Cumbria giờ đây vang vọng tin tức: vùng đất này đã được tái sinh dưới bàn tay ta.\n\nĐã quá lâu rồi người dân chỉ thầm thì về những gì đã mất; giờ đây Gia tộc [ROOT.Char.GetHouse.GetName] sẽ một lần nữa mang lại tiếng nói cho vùng đất này. Hãy để những kẻ từng tuyên bố quyền thống trị trên chúng ta nhìn vào vương quốc này và hiểu rằng, vận mệnh của chúng ta đã nằm trong tay chúng ta."
  major_decisions.3500.a: "Vì nhân dân của ta, và vì Gia tộc [ROOT.Char.GetHouse.GetNameNoTooltip]!"

  found_the_empire_of_hindustan_decision:0 "Thành lập Đế quốc Hindustan"
  found_the_empire_of_hindustan_decision_desc:0 "Dù Hồi giáo đã đến vùng đất Hind từ hàng trăm năm trước, tiểu lục địa này vẫn bị các vương triều bản địa thống trị. Hãy đặt nền móng cho một di sản đế quốc mới — một quốc gia Hồi giáo bén rễ nơi đồng bằng rộng lớn miền bắc Ấn Độ!"
  found_the_empire_of_hindustan_decision_tooltip:0 "Hindustan trở thành một [de_jure|E] [empire|E]."
  found_empire_of_hindustan_decision_effects_de_jure_tt:0 "Mọi [kingdoms|E] Ngài sở hữu trong [GetTitleByKey('e_rajastan').GetName], [GetTitleByKey('e_bengal').GetName] và [GetTitleByKey('e_deccan').GetName] sẽ trở thành [de_jure|E] Hindustan."
  found_the_empire_of_hindustan_decision_confirm:0 "Sultan chính là bóng chiếu của Thượng đế trên mặt đất!"
  found_the_empire_of_hindustan_decision_effects_vassal_opinion.tt:0 "Tất cả chư hầu trực tiếp"
  found_the_empire_of_hindustan_opinion:0 "Đã thành lập Đế quốc $e_hindustan$"

  restore_roman_empire_decision:0 "Khôi phục Đế quốc La Mã"
  restore_roman_empire_decision_confirm:0 "Ta sẽ khôi phục Đế quốc"
  restore_roman_empire_decision_tooltip:0 "Đế quốc La Mã sẽ được khôi phục"
  restore_roman_empire_decision_desc:0 "Nếu Rome và các vùng lãnh thổ trọng yếu khác của đế quốc xưa được tái chiếm, Đế quốc Byzantine sẽ được phương Tây công nhận là sự tiếp nối chính thống và hợp pháp của Nhà nước La Mã."
  restore_roman_empire_decision_tt:0 "Tôn giáo của Ngài là Kitô giáo hoặc Hy-La, hoặc Văn hóa của Ngài là La Mã"
  restore_roman_empire_decision_effect_tooltip:0 "Đế quốc La Mã sẽ được khôi phục và giành [de_jure|E] của mọi Đế quốc hiện đang nắm giữ."
  restore_roman_empire_decision_religion_culture_tt:0 "[religion|E] của ngài thuộc [GetReligionFamily('rf_abrahamic').GetName] hoặc [GetReligionByKey('hellenism_religion').GetName], hoặc [heritage|E] từ [culture_possessive|E] của ngài là [GetCulturePillar('heritage_latin').GetName] hoặc [GetCulturePillar('heritage_byzantine').GetName]"

  restore_roman_empire_holy_decision:0 "Khôi phục Đế quốc La Mã"
  restore_roman_empire_holy_decision_tooltip:0 "Đế quốc La Mã sẽ được khôi phục"
  restore_roman_empire_holy_decision_desc:0 "Nếu đủ các tỉnh cũ của Đế quốc được tái chiếm, Đế chế La Mã Thần thánh sẽ được phương Đông công nhận là sự tiếp nối chính thống và hợp pháp của Nhà nước La Mã."
  restore_roman_empire_holy_decision_confirm:0 "Ta sẽ khôi phục Đế quốc"

  mend_the_great_schism_decision:0 "Hàn gắn Đại Ly giáo"
  mend_the_great_schism_decision_confirm:0 "Một Chúa, một Giáo hội!"
  mend_the_great_schism_decision_desc:1 "Đại Ly giáo đã chia rẽ Giáo hội Kitô, nhưng nếu cả năm Tòa Giám mục của Ngũ Thượng phụ được khôi phục dưới quyền một Đế quốc duy nhất do một vị quân vương thánh thiện và sáng suốt lãnh đạo, có lẽ Kitô giáo sẽ được tái thống nhất."
  mend_the_great_schism_decision_tooltip:0 "Ta sẽ tái thống nhất Kitô giáo"
  mend_the_great_schism_decision_effect_tooltip:0 "Giáo hội [THIS.Char.GetFaith.GetAdjective] sẽ hàn gắn Ly giáo và tự khẳng định là nhánh Kitô giáo hợp pháp duy nhất."
  every_ecumenical_christian_faith.tt:0 "$EFFECT_LIST_BULLET$ Mọi [faith|E] Kitô giáo có [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]"
 
  set_capital_constantinople_decision:0 "Tái chiếm Constantinople"
  set_capital_constantinople_decision_confirm:0 "Khôi phục ngai vàng đích thực của Đế quốc!"
  set_capital_constantinople_decision_desc:0 "Constantinople là kinh đô của Đế quốc Đông La Mã và vì thế chính đáng thuộc về ta."
  set_capital_constantinople_decision_tooltip:0 "Khôi phục Constantinople làm kinh đô Đế quốc của Ngài."

  set_capital_rome_decision:0 "Tái chiếm Rome"
  set_capital_rome_decision_confirm:0 "Khôi phục ngai vàng đích thực của Đế quốc!"
  set_capital_rome_decision_desc:0 "Rome là kinh đô tổ tiên của Đế quốc La Mã và vì thế chính đáng thuộc về ta."
  set_capital_rome_decision_tooltip:0 "Khôi phục Rome làm kinh đô Đế quốc của Ngài."

  establish_iconoclast_patriarchate_decision:0 "Thành lập Tòa Thượng phụ Bài tượng"
  establish_iconoclast_patriarchate_decision_confirm:0 "Vì một Giáo hội thuần khiết hơn!"
  establish_iconoclast_patriarchate_decision_desc:0 "Chỉ một vị quân vương mộ đạo và đầy thế lực kiểm soát Constantinople mới có thể thanh lọc Tòa Thượng phụ Đại kết và khôi phục nó về hình thái thuần khiết hơn, không còn thờ tượng và tham nhũng."
  establish_iconoclast_patriarchate_decision_tooltip:0 "Dùng ảnh hưởng của Ngài để tái lập Tòa Thượng phụ Bài tượng."
  establish_iconoclast_patriarchate_decision_effect_tooltip:0 "Tòa Thượng phụ Bài tượng sẽ thay thế Tòa Thượng phụ Đại kết"

  restore_ecumenical_patriarchate_decision:0 "Khôi phục Tòa Thượng phụ Đại kết"
  restore_ecumenical_patriarchate_decision_confirm:0 "Vì Giáo hội chân chính duy nhất!"
  restore_ecumenical_patriarchate_decision_desc:1 "Chỉ một vị quân vương mộ đạo và đầy thế lực kiểm soát Constantinople mới có thể thanh lọc Tòa Thượng phụ để khôi phục nó về hình thái thuần khiết hơn, không còn man rợ và bài tượng."
  restore_ecumenical_patriarchate_decision_tooltip:0 "Dùng ảnh hưởng của Ngài để tái lập Tòa Thượng phụ Đại kết."
  restore_ecumenical_patriarchate_decision_effect_tooltip:0 "Tòa Thượng phụ Đại kết sẽ thay thế Tòa Thượng phụ Bài tượng"

  restore_papacy_decision:0 "Khôi phục Giáo hoàng quốc"
  restore_papacy_decision_confirm:0 "Giáo hoàng quốc sẽ được khôi phục"
  restore_papacy_decision_desc:0 "Nếu một tín đồ Công giáo mộ đạo tái chiếm các lãnh thổ cốt lõi thuộc di sản của Thánh Phêrô, Tòa Thánh có thể được khôi phục về vị thế chính đáng của mình tại Vatican."
  restore_papacy_decision_tooltip:0 "Khôi phục Tòa Thánh"
  restore_papacy_decision_effect_tooltip:0 "Giáo hoàng quốc sẽ được khôi phục."

