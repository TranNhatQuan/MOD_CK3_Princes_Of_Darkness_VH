  borrow_from_holy_order_decision:0 "Vay Vàng từ Dòng Thánh"
  borrow_from_holy_order_decision_tooltip:0 "Ngài sẽ vay tiền từ một Dòng Thánh khả dụng"
  borrow_from_holy_order_decision_desc:0 "Ta đang cần tiền, và còn ai thích hợp hơn để cầu viện ngoài những người phụng sự [ROOT.Char.GetFaith.HighGodName]? Ta có thể gửi thư và hy vọng nhận được hồi đáp."
  borrow_from_holy_order_decision_confirm:0 "Viết thư thỉnh cầu!"
  borrow_from_holy_order_decision_effect_tooltip:1 "Ngài vay [SCOPE.ScriptValue('holy_order_gold_value')|P00] [gold|E][gold_i] từ một [holy_order|E]\n\n@warning_icon! [holy_order|E] sẽ bắt đầu đưa ra yêu sách nếu Ngài không hoàn trả khoản vay\n@warning_icon! Ngài không thể vay thêm cho đến khi hoàn trả xong khoản này"
  borrow_from_holy_order_gold_condition:3 "Không có Dòng Thánh [CHARACTER.GetFaith.GetAdjective] nào có đủ vàng"

  escape_from_prison_decision:0 "Vượt Ngục"
  escape_from_prison_decision_tooltip:0 "Cố gắng vượt ngục"
  escape_from_prison_decision_desc:0 "Những bức tường cũ kỹ, nhịp sống lặp lại, thức ăn đạm bạc – ngày nào cũng như ngày nào. Nhà tù này đang bào mòn ta, và ta sẽ không chịu đựng thêm nữa!"
  escape_from_prison_decision_success.tt:0 "Nỗ lực vượt ngục của Ngài thành công"
  escape_from_prison_decision_failure.tt:0 "Nỗ lực vượt ngục của Ngài thất bại"
  escape_from_prison_decision_failure_outcome.tt:0 "[imprisoner.GetTitledFirstName] có thể sẽ... không hài lòng"
  escape_from_prison_decision_confirm:0 "Không song sắt nào giữ nổi ta!"
  escape_from_prison_decision_effect_tooltip:1 "@warning_icon! Tỷ lệ thành công phụ thuộc vào [prowess|E], [traits|E] của Ngài và việc Ngài có bị giam trong [dungeon|E] hay không"

  tribal_challenge_ruler_decision:0 "Thách Đấu [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]"
  tribal_challenge_ruler_decision_desc:0 "[ROOT.Char.GetLiege.GetFirstName] mang tước hiệu [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] như thể đó hiển nhiên thuộc về [ROOT.Char.GetLiege.GetHersHis]; như thể không phải kỹ năng và sức mạnh mới quyết định ai là thủ lĩnh.\n\nTa, [ROOT.Char.GetFullNameNoTooltip], chất vấn quyền giữ tước vị của [ROOT.Char.GetLiege.GetHerHis], đối với toàn bộ [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier], và ta sẽ không còn im lặng!"
  tribal_challenge_ruler_decision_tooltip:0 "Thách đấu [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] để đoạt lấy tước hiệu và đất đai của [ROOT.Char.GetLiege.GetHerHis]"
  tribal_challenge_ruler_effect_tooltip:0 "[liege_to_challenge.GetTitledFirstNameNoTooltip] sẽ quyết định về lời thách đấu\n"
  tribal_challenge_ruler_desc_success:0 "Ngài thắng cuộc thách đấu"
  tribal_challenge_ruler_desc_failure:0 "Ngài thua cuộc thách đấu"
  recently_took_tribal_challenge_ruler_decision:0 "Gần đây đã thách thức quyền cai trị của ai đó"
  tribal_challenge_ruler_decision_confirm:0 "Thách đấu [ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]!"

  gain_weight_decision:0 "Tăng Cân"
  gain_weight_decision_desc:0 "Những khiếm khuyết của cơ thể ta ngày càng rõ rệt – ta hầu như không đủ sức vượt qua một ngày!\n\nMột chế độ ăn gồm nhiều sữa, bơ và chà là đã được đề xuất, và có lẽ đã đến lúc thử nghiệm."
  gain_weight_decision_tooltip:0 "Ngài sẽ chuyên tâm tăng cân"
  gain_weight_decision_confirm:0 "Mang bơ đến đây!"

  stop_gain_weight_decision:0 "Ngừng Tăng Cân"
  stop_gain_weight_decision_desc:0 "Dòng thức ăn béo ngậy bất tận đã phát huy tác dụng, và ta không thể chịu đựng thêm. Ta sẽ từ bỏ nỗ lực tăng cân."
  stop_gain_weight_decision_tooltip:0 "Ngài sẽ không còn cố gắng tăng cân nữa"
  stop_gain_weight_decision_confirm:0 "Ngừng Tăng Cân"

  lose_weight_decision:0 "Giảm Cân"
  lose_weight_decision_desc:0 "Cơ thể ta yếu dần theo từng ngày, và thân hình nặng nề đè nặng lên cả thể xác lẫn tinh thần.\n\nChạy bộ, tắm nước ấm, thậm chí một loại thuốc tẩy nhẹ... Ta sẽ tìm cách giảm bớt cân nặng."
  lose_weight_decision_tooltip:0 "Ngài sẽ chuyên tâm giảm cân"
  lose_weight_decision_confirm:0 "Mang scammony đến đây!"

  stop_lose_weight_decision:0 "Ngừng Giảm Cân"
  stop_lose_weight_decision_desc:0 "Ta đã thử mọi phương thuốc được khuyên dùng, và tiếp tục nữa sẽ là quá mức. Ta sẽ từ bỏ nỗ lực giảm cân."
  stop_lose_weight_decision_tooltip:0 "Ngài sẽ không còn cố gắng giảm cân nữa"
  stop_lose_weight_decision_confirm:0 "Ngừng Giảm Cân"

  commit_suicide_decision:1 "Tìm đến Cái chết"
  commit_suicide_decision_desc:0 "Chỉ còn lại bóng tối và đau đớn. Mọi người bảo ta rằng rồi mọi thứ sẽ tốt hơn, nhưng làm sao họ biết được? Và điều đó giúp gì cho ta ngay lúc này? Đã đến lúc trút bỏ những ràng buộc của cõi phàm trần này."
  commit_suicide_decision_desc_depressed:0 "$commit_suicide_decision_desc$"
  commit_suicide_decision_desc_incapable:0 "Ta tồn tại nhưng không thực sự sống. Tình trạng hiện tại khiến ta phải dựa vào người khác cho cả những việc đơn giản nhất. Ta không lựa chọn điều này, có lẽ sẽ dễ dàng hơn nếu ta kết thúc tất cả..."
  commit_suicide_decision_desc_cancer:0 "Ta cảm nhận bệnh tật đang lan rộng trong cơ thể. Thứ khởi đầu như một sự bất tiện nhỏ giờ đã trở thành cuộc vật lộn hằng ngày. Cái chết là điều không thể tránh khỏi. Ta chỉ muốn nỗi đau chấm dứt."
  commit_suicide_decision_desc_leper:0 "Sự mục rữa đã bám chặt lấy thân xác phàm tục của ta. Vài ngón chân đã rụng mất và mủ rỉ ra từ những vết thương. Ta còn phải chịu đựng số phận kinh hoàng này bao lâu nữa?"
  commit_suicide_decision_desc_great_pox:0 "Những mụn mủ giờ phủ kín cơ thể ta, mỗi vết loét lại lớn hơn và đau đớn hơn trước. Ta chỉ thấy sợ hãi và ghê tởm trong ánh mắt thần dân. Mọi thứ rồi sẽ chỉ tệ hơn..."
  commit_suicide_decision_desc_lunatic:0 "Ta không thể thoát khỏi những tiếng thì thầm đầy thù hận và thất vọng. Chúng bảo ta làm những điều không nên làm. Không gì còn hợp lý, thực tại tự mâu thuẫn với chính nó. Chỉ có cái chết mới giải thoát ta chăng?"
  commit_suicide_decision_desc_parent:0 "Không thể bước tiếp. Ta bị mắc kẹt trong nỗi đau mất con. [ROOT.Var('mourning_parent').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] là cả thế giới đối với ta. Sống để làm gì khi cuộc đời đã mất đi nguồn vui và tiếng cười duy nhất?"
  commit_suicide_decision_desc_soulmate:1 "Ta không thể chịu đựng thêm sự trống rỗng trong tâm hồn. Cuộc sống không có người, [ROOT.Var('mourning_soulmate').Char.GetFirstName] yêu dấu của ta, chỉ là gánh nặng. Nếu cách duy nhất để trở về trong vòng tay người là rời bỏ thế gian này, thì cứ như vậy."
  commit_suicide_decision_desc_friend:1 "Cuộc đời quá u ám nếu không thể sẻ chia cùng một người Ngài chân thành. Những khoảnh khắc từng khiến cả [ROOT.Var('mourning_friend').Char.GetFirstName] và ta cười hàng giờ giờ chỉ còn lại tuyệt vọng. Con đường cô độc này không dành cho ta."
  commit_suicide_decision_desc_demoted:0 "Ít ai phải chịu nhục nhã như ta. Ta, kẻ từng đứng trên đỉnh cao, giờ phải khúm núm như lũ ngu ngốc kia. Có lẽ ta nên tự quyết định kết cục của mình theo cách ta chọn."
  commit_suicide_decision_desc_divorce:0 "Ta sống trong dằn vặt và hối tiếc. Ta có thể làm gì để ngăn cuộc chia ly đau đớn này? Làm sao lấy lại tình yêu đã mất? Vô vọng. Không còn hôn nhân, ta chẳng là gì cả."
  commit_suicide_decision_desc_witch:0 "Niềm say mê huyền thuật đã đưa ta vào con đường cô độc và nguy hiểm. Sự tò mò ấy phải trả giá đắt. Ta bị ruồng bỏ vì niềm tin của mình. Ta sợ họ sẽ không bao giờ chấp nhận con người thật của ta."
  commit_suicide_decision_desc_cannibal:0 "Thật là một xã hội lạc hậu. Việc thưởng thức món đặc sản tuyệt hảo là thịt người lại là điều duy nhất mang đến cho ta niềm vui. Ta không muốn sống trong một thế giới cấm đoán điều đó!"
  commit_suicide_decision_desc_sodomite:0 "Số phận đã cho ta một lá bài tàn nhẫn. Tại sao ta phải bị bức hại vì khát vọng của trái tim mình? Ta không thể giúp việc mình sinh ra đã như vậy. Nếu họ kết tội ta khi còn sống, liệu cái chết có đem lại sự chấp nhận?"
  commit_suicide_decision_desc_deviant:0 "Họ là ai mà dám phán xét ta? Những cuộc khám phá dục vọng đã đưa ta qua nhiều con đường bất ngờ, nhưng tất cả đều dẫn đến khoái lạc mãnh liệt. Không có những thú vui xác thịt ấy, ta chẳng còn gì để sống."
  commit_suicide_decision_desc_criminal:0 "Ta không thể trốn khỏi quá khứ. Dù đi đâu, ta cũng cảm thấy ánh mắt phán xét dõi theo. Sao mọi chuyện lại thành ra thế này? Tại sao ta để mọi thứ đi quá xa? Ta hy vọng tội lỗi của mình sẽ được tha thứ khi ta rời đi."
  commit_suicide_decision_desc_stressed:0 "Ngày qua ngày, áp lực chồng chất. Dù ta ở đâu, làm gì, mọi thứ cũng sớm trở nên quá sức. Tất cả đang vượt khỏi tầm kiểm soát. Phải chấm dứt thôi!"
  commit_suicide_decision_tooltip:2 "Đã đến lúc rời khỏi thế gian này"
  commit_suicide_decision_effect_tooltip:0 "@warning_icon! Ngài sẽ cố gắng kết thúc mạng sống của mình, Ngài có chắc đây là điều Ngài muốn?"
  commit_suicide_decision_confirm:0 "Đã đến lúc của ta"

  pet_dog_decision:0 "Vuốt ve [ROOT.Char.Custom('DogStoryName')]"
  pet_dog_decision_desc:0 "Đã đến lúc hít một hơi thật sâu và tìm đến người Ngài bốn chân trung thành của ta, [ROOT.Char.Custom('DogStoryName')]. Có người nói chó chỉ là loài vật tầm thường, nhưng dù cuộc sống có khắc nghiệt thế nào ta biết [ROOT.Char.Custom('DogStorySheHe')] sẽ luôn ở bên ta!"
  pet_dog_decision_tooltip:0 "Vuốt ve chú chó của Ngài"
  pet_dog_decision_confirm:0 "Vuốt ve chú chó"
  pet_decision_effect_tooltip:0 "Ngài sẽ giảm bớt [stress|E]"

  pet_cat_decision:0 "Vuốt ve [ROOT.Char.Custom('CatStoryName')]"
  pet_cat_decision_desc:0 "Đã đến lúc hít một hơi thật sâu và tìm đến người Ngài bốn chân trung thành của ta, [ROOT.Char.Custom('CatStoryName')]. Có người nói mèo là loài sinh vật xấu xa và ích kỷ, nhưng dù cuộc sống có khắc nghiệt thế nào ta biết [ROOT.Char.Custom('CatStorySheHe')] sẽ luôn ở bên ta!"
  pet_cat_decision_tooltip:0 "Vuốt ve chú mèo của Ngài"
  pet_cat_decision_confirm:0 "Vuốt ve chú mèo"

  playdate_decision:0 "Gặp gỡ Đồng trang lứa"
  playdate_decision_desc:0 "#F Mời mọi tiểu lãnh chúa và tiểu thư trong lãnh địa cùng vui chơi với những đứa trẻ khác là một trải nghiệm vừa tự do vừa thú vị!#!"
  host_playdate_decision_desc_vassal_and_courtiers:0 "Có thể tăng [opinion|E] của chư hầu và cận thần đối với Ngài"
  start_playdate_decision:0 "Ngài gặp gỡ Bạn Bè đồng trang lứa tại [capital_province.GetName]"
  playdate_decision_tooltip:0 "Ngài sẽ mời trẻ em tham gia [GetActivityType('activity_playdate').GetName]"
  playdate_decision_confirm:0 "Gửi lời mời!"

  repay_loan_decision:0 "Trả Nợ"
  repay_loan_decision_decision_tooltip:0 "Ngài sẽ trả lại khoản mình nợ"
  repay_loan_decision_decision_desc:0 "Để món nợ treo lơ lửng trên đầu thật không xứng với một [ROOT.Char.GetTitleAsNameNoTooltip] – đã đến lúc ta hoàn trả số tiền mình vay."
  repay_loan_decision_confirm:0 "Gửi trả tiền!"
  ho_loan_inherited_title: "Khoản nợ thừa kế"
  ho_loan_inherited_tt: "Kế thừa món nợ [gold_i|E][loan_inheritor.MakeScope.Var('loan_amount_owed').GetValue|0] của [loan_passer_temp.GetShortUINamePossessive] cho [loan_inheritor.MakeScope.Var('loan_holder').Char.GetShortUIName]"
  ho_loan_inherited_debtor_tt: "Kế thừa món nợ [gold_i|E][loan_inheritor.MakeScope.Var('loan_amount_owed').GetValue|0] của [loan_passer.GetShortUINamePossessive] từ [loan_inheritor.MakeScope.Var('loan_holder').Char.GetShortUIName]"
  ho_loan_inherited_loaner_tt: "[loan_inheritor.GetShortUIName] đã kế thừa khoản vay của Ngài trị giá [gold_i|E][loan_inheritor.MakeScope.Var('loan_amount_owed').GetValue|0] cho [loan_passer.GetShortUIName]"

