 #UNITE THE WESTERN SLAVS
  unite_the_western_slavs_decision:1 "Thống nhất Tây Slav"
  unite_the_western_slavs_decision_tooltip:1 "Thống nhất người Tây Slav dưới một vị quân chủ"
  unite_the_western_slavs_decision_desc:0 "Chúng ta từng là một dân tộc khi lần đầu đặt chân đến vùng đất này. Qua năm tháng, chúng ta phân tán, tự chia mình thành nhiều bộ lạc. Khi các thế lực ngoại bang rình rập trước cửa, đã đến lúc chúng ta một lần nữa đứng chung hàng ngũ."
  unite_the_western_slavs_decision_tt_1:1 "Tước vị Chính của Ngài là Vương quốc Ba Lan, Pomerania, Sorbia, Bohemia hoặc Đại Moravia"
  unite_the_western_slavs_decision_tt_2:1 "Ngài là Hoàng đế, và nắm giữ Vương quốc Ba Lan, Pomerania, Sorbia, Bohemia hoặc Đại Moravia"
