  write_muwashshah_poem_decision: "Viết Thơ Muwashshah"
  write_muwashshah_poem_decision_desc: "Với những bộ óc kiệt xuất ta quy tụ quanh mình, việc sáng tác một bài thơ mới theo phong cách Muwashshah thịnh hành sẽ không quá khó khăn. Lại có biết bao người háo hức đọc tác phẩm của ta, nên ta cũng có nhiều lựa chọn cho điểm đến cuối cùng của nó."
  write_muwashshah_poem_decision_tooltip: "Sáng tác một bài thơ mới để bán lấy tiền, giữ lại cho riêng mình hoặc phát hành miễn phí.\n\n$EFFECT_LIST_BULLET$Bán bài thơ sẽ mang lại một khoản [gold_i][gold|E]\n$EFFECT_LIST_BULLET$Giữ lại bài thơ sẽ thêm một hiệu ứng cho [artifact|E] Double-Moon Tome\n$EFFECT_LIST_BULLET$Phát hành miễn phí sẽ mang lại thêm [prestige_i][prestige|E]"
