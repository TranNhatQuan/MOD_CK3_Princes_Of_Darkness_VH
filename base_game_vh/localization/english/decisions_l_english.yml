  major_decisions.3200.b: "Vì sự phồn thịnh của toàn thể [rightful_title.GetNameNoTierNoTooltip]."

  major_decisions.3300.t:0 "Carthage Trỗi Dậy"
  major_decisions.3300.desc:0 "Từ mảnh đất bị rắc muối năm xưa, một đế quốc mới đã trỗi dậy, khôi phục lại vinh quang thuở nào. Chẳng bao lâu nữa, những con tàu buôn sẽ lấp đầy bến cảng với vô vàn của cải, và quyền bá chủ vùng Địa Trung Hải sẽ thuộc về tay chúng ta.\n\nNơi vị vĩ nhân Hannibal từng ngã xuống trong thất bại cay đắng, ta sẽ đứng lên để đòi lại di sản của tổ tiên. Một lần nữa, cả thế giới sẽ phải khiếp sợ trước sức mạnh thực sự của Carthage.\n\nPhía trước vẫn còn nhiều việc phải làm, nhưng giờ đây, ta đứng đây với tư cách là người #EMP chiến thắng! #!"
  major_decisions.3300.a:0 "Ta sẽ kế thừa những tập tục cổ xưa."
  major_decisions.3300.b:0 "Ta sẽ nhào nặn đế quốc theo ý nguyện của mình."
 #Cossack kingdom creation decision
  major_decisions.3600.t:0 "Sự Trỗi Dậy Của Người Cossack"
  major_decisions.3600.desc:0 "Qua nhiều thế hệ, những người tự do — dù là kẻ phiêu lưu, kẻ lưu vong hay tội phạm — đã tìm đường đến vùng thảo nguyên Caspian.\n\nHọ được gọi là 'Kazak', sống theo luật lệ riêng của mình. Thế nhưng người Cuman đã kìm kẹp những con người tự do này dưới gót sắt, thống trị khắp thảo nguyên. Người [founder_culture.GetCollectiveNoun] dưới sự trị vì của ta coi những người Kazak này như máu mủ, và mỗi ngày chúng ta lại chào đón thêm nhiều người gia nhập.\n\nCó lẽ đã đến lúc chúng ta cùng nhau nắm lấy một vận mệnh mới?"
  major_decisions.3600.a:0 "Người Cossack chúng ta sẽ sống tự do dưới bầu trời bao la."
  major_decisions.3600.b:0 "Ta sẽ cai trị họ, nhưng vẫn giữ gìn những lề lối cũ."
  cossack_custom_de_jure:0 "Các [duchies|E] thuộc [GetTitleByKey('d_tana').GetBaseNameNoTier], [GetTitleByKey('d_red_levedia').GetBaseNameNoTier], [GetTitleByKey('d_levedia').GetBaseNameNoTier], [GetTitleByKey('d_don_valley').GetBaseNameNoTier], và [GetTitleByKey('d_itil').GetBaseNameNoTier] sẽ trở thành [vassals|E] [de_jure|E] của [GetTitleByKey('k_cossack').GetDefinitiveName]"
  cossack_custom_culture_hybrid:0 "Tạo ra một [hybrid_culture|E] #V Cossack#! với [GetCultureByKey('kazak').GetName]"
  cossack_custom_county_culture:0 "Mọi [county|E] [de_jure|E] đang nắm giữ thuộc [GetTitleByKey('k_cossack').GetDefinitiveName] sẽ tiếp nhận [culture|E] [new_culture.GetName]" 
  cossack_custom_county_culture_fallback:0 "Mọi [county|E] [de_jure|E] đang nắm giữ thuộc [GetTitleByKey('k_cossack').GetDefinitiveName] sẽ tiếp nhận [culture|E] #V Cossack#!"
