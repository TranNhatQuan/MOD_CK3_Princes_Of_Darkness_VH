  go_on_pilgrimage_decision_tooltip:1 "Thực hiện một chuyến [pilgrimage|E] để chứng minh lòng tận tụy của Ngài với [ROOT.Char.GetFaith.PantheonTerm]"
  go_on_pilgrimage_decision_desc:0 "#F Các thánh địa là những nơi trên thế giới này gần gũi nhất với [ROOT.Char.GetFaith.PantheonTerm]. Tận mắt chiêm bái chúng chính là cách chứng minh sự sùng kính của ta với tư cách một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip].#!"
