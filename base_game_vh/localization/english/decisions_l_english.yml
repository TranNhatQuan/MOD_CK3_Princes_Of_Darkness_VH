  mozarabic_break_with_rome_decision.tt.hof_and_ecumenism_warning:0 "Ngài sẽ tạo ra một [religious_leader.GetFaith.GetName] [head_of_faith|E], nhưng #X vĩnh viễn#! mất [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName]"
