  invite_claimants_decision:0 "Mời Người Có Yêu Sách"
  invite_claimants_decision_desc:0 "Để mở rộng lãnh địa, ta cần những yêu sách hợp pháp đối với đất đai ngoại quốc. May thay, có nhiều người mang yêu sách sẵn sàng trở thành chư hầu của ta để đổi lấy sự hỗ trợ quân sự."
  invite_claimants_decision.tt:0 "Khả năng [claimants|E] có [claims|E] phù hợp đến Triều đình với tư cách [guests|E] sẽ tăng mạnh trong #V 5#! năm"
  invite_claimants_decision_confirm:0 "Cử sứ giả"
  minor_decisions.0002.t:0 "Người Có Yêu Sách Đã Đến"
  minor_decisions.0002.desc:0 "[claimant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đáp lại lời triệu tập của ta và đến triều đình với tư cách khách mời của ta"
  invite_claimants_decision_tooltip:1 "[claimants|E] được triệu tập đến thăm triều đình của Ngài"


  scrape_the_barrel_decision:0 "Vét Cạn Thùng"
  scrape_the_barrel_decision_desc:0 "Triều đình Hoàng gia của ta thiếu thốn những cá nhân tài năng để lấp đầy nhiều chức vị cần thiết nhằm duy trì một [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] hưng thịnh!\n\nGia đình ta thiếu đi sự huy hoàng vốn có, nhưng có lẽ giải pháp lại nằm ở nơi không ai ngờ tới..."
  scrape_the_barrel_decision_tooltip:0 "Chúng ta sẽ tuyển một [lowborn|E] để lấp vào một [court_position|E] ngẫu nhiên"
  scrape_the_barrel_decision.tt:0 "$scrape_the_barrel_decision_tooltip$"
  scrape_the_barrel_decision_confirm:0 "Bắt đầu tìm kiếm!"
  minor_decisions.0003.t:0 "Vét Cạn Thùng"
  minor_decisions.0003.desc.opening:0 "Cuộc lục soát của ta tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] đã lôi [barrel_character.GetName] đến diện kiến ta!"
  minor_decisions.0003.desc.diseased:0 "Trước mặt ta là một nông dân bệnh tật, phủ đầy bùn đất, chất nôn khô và ánh mắt [barrel_character.GetHerHis] gần như vô hồn."
  minor_decisions.0003.desc.physical:0 "Trước mắt ta là một nông dân với ngoại hình hết sức khác thường, nhìn ta với vẻ kinh ngạc và sợ hãi như thể ta là [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]. Rõ ràng, hoàn cảnh xuất thân của [barrel_character.GetHerHis] đã khiến [barrel_character.GetHerHim] chịu nhiều đau khổ và bị dân chúng tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] xa lánh."
  minor_decisions.0003.desc.maimed:0 "[barrel_character.GetWomanMan] này dường như đã nếm trải đủ mọi xung đột và sự tàn khốc trên thế gian, và mang trên mình dấu vết của mọi nắm đấm cùng lưỡi kiếm từng giáng xuống và cắt xé [barrel_character.GetHerHim]."
  minor_decisions.0003.desc.criminal:0 "Kẻ khốn khổ này bị lôi lên từ ngục tối; bị giam vì những tội ác không thể dung thứ chống lại vương quyền, hy vọng được ân xá để đổi lấy kỹ năng của [barrel_character.GetHerHis]."
  minor_decisions.0003.desc.ewan:0 "Thứ ta buộc phải nhìn là một cơn ác mộng méo mó của một [barrel_character.GetWomanMan], gần như không còn giống con người. Sinh vật khốn khổ này đầy bệnh tật, dị dạng và thương tích đến mức việc [barrel_character.GetSheHe] còn có thể đứng vững quả là điều như ma thuật!"
  minor_decisions.0003.desc.criminal_bridge:0 "\n\nDù [barrel_character.GetSheHe] là một kẻ phản bội có tội,"
  minor_decisions.0003.desc.bridge_1:0 "\n\nBất chấp tình trạng của [barrel_character.GetHerHis],"
  minor_decisions.0003.desc.bride_2:0 "ta được biết rằng [barrel_character.GetSheHe] là một"
  minor_decisions.0003.desc.educated:0 "là một học giả, không rõ bằng cách nào đã được học hành chữ nghĩa bất chấp xuất thân thấp kém của [barrel_character.GetHerHis]. Ta cảm thấy [barrel_character.GetNameNoTooltip] sẽ cống hiến tốt cho triều đình trong các vấn đề tôn giáo, học thuật, hoặc y thuật."
  minor_decisions.0003.desc.cunning:0 "là một kẻ lừa đảo, kiếm chác tài sản của [barrel_character.GetHerHis] bằng cách lừa lọc lũ dân đen từng đồng cắc một. Sự xảo quyệt và ngón nghề móc túi của chúng sẽ rất hữu dụng nếu ở cạnh ta, lắng nghe những lời thầm thì lảng vảng chốn cung đình và giáng đòn trừng phạt lên những kẻ dám mạo phạm Vương Miện."
  minor_decisions.0003.desc.charismatic:1 "nhà ngoại giao với kỹ năng ngôn ngữ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] sánh ngang bất kỳ quý tộc nào! Sức hút ngầm và ngoại hình khác thường của [barrel_character.GetHerHis|U] chắc chắn sẽ thu hút sự chú ý của mọi quý tộc ngoại quốc đến thăm triều đình."
  minor_decisions.0003.desc.organised:0 "thương nhân với sự am hiểu tài chính và tổ chức vượt xa điều ta mong đợi từ một nông dân thấp kém. Chắc chắn [barrel_character.GetWomanMan] này không nên bị lãng phí với thân phận thấp hèn và đã được [ROOT.Char.GetFaith.HighGodName] chọn để nâng lên hàng quý tộc và phục vụ ta tại triều."
  minor_decisions.0003.desc.strong:0 "thủ lĩnh, giành chiến thắng trong vô số cuộc đụng độ và dẫn dắt băng nhóm của [barrel_character.GetHerHis] từ cuộc cướp bóc này sang cuộc khác. Không nghi ngờ gì, [barrel_character.GetSheHe] không nên lăn lộn trong bùn và máu với những vụ trộm vặt nơi thôn dã mà nên khoác lên mình phục sức hoàng gia và gia nhập triều đình của ta!"
  minor_decisions.0003.desc.outro:0 "Hội đồng của ta đã xác định vai trò phù hợp nhất cho [barrel_character.GetNameNoTooltip], câu hỏi duy nhất còn lại là liệu ta có thực sự chấp nhận điều này hay không."
  minor_decisions.0003.a:0 "Tất nhiên rồi! Chào mừng đến với hàng ngũ quý tộc, [barrel_character.GetNameNoTooltip]!"
  minor_decisions.0003.b:0 "Chỉ có cái chết mới xứng với sinh vật #EMP này#!."
  minor_decisions.0003.c:0 "[ROOT.Char.GetFaith.HighGodName], hãy mang đến cho ta kẻ khác!"
  minor_decisions.0003.d:0 "Ờm... chúng ta vẫn chưa tuyệt vọng đến thế..."
 
 #False Conversion decisions
  revoke_false_conversion_decision:0 "Công khai Đức tin Thật"
  revoke_false_conversion_decision.tt:0 "Công khai cải đạo trở lại [faith|E] cũ của Ngài"
  revoke_false_conversion_decision.desc:0 "#F Dù bề ngoài ta theo đức tin [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], ta không thể từ bỏ những nghi lễ cá nhân và niềm tin riêng của tổ tiên. Có lẽ con đường cũ thực sự tốt đẹp hơn?#!"
  revoke_false_conversion_decision.desc.tt:0 "Ngài công khai cải đạo trở lại [faith|E] trước đây. Các [vassals|E] và [close_family|E] của Ngài có thể cải đạo theo Ngài"
  revoke_false_conversion_decision.desc.tt_landless: "Ngài cải đạo trở lại [faith|E] trước đây. [close_family|E] của Ngài có thể cải đạo theo Ngài."
  revoke_false_conversion_decision.desc.tt_own_faith_counties:0 "Nếu Ngài là [independent|E], các [counties|E] trong [realm|E] của Ngài có [GetModifier('false_convert_modifier').GetNameWithTooltip] có thể cải đạo theo Ngài, nếu bí mật theo [faith|E] của Ngài"
  revoke_false_conversion_decision_confirm:0 "Ban bố tuyên cáo"
  encourage_confession_of_false_conversions_decision:0 "Ân xá cho Những Kẻ Cải Đạo Giả"
  encourage_confession_of_false_conversions_decision.tt:0 "Tín đồ bí mật có thể tiết lộ [faith|E] ẩn giấu của họ"
  encourage_confession_of_false_conversions_decision.desc:0 "#F Ai cũng ngầm biết rằng có những tín đồ bí mật trong lãnh địa của ta, thực hành đức tin trong bóng tối. Có lẽ một lệnh ân xá chính thức sẽ khiến họ từ bỏ vỏ bọc?#!"
  encourage_confession_of_false_conversions_decision.desc.tt_pluralist:0 "Những tín đồ bí mật trong lãnh địa có thể lộ diện, nếu [faith|E] của Ngài [tolerates|E] đức tin bí mật của họ hơn đức tin công khai"
  encourage_confession_of_false_conversions_decision.desc.tt_paranoia:0 "[characters|E] có đặc tính [GetTrait('deceitful').GetName( GetNullCharacter )] hoặc [GetTrait('paranoid').GetName( GetNullCharacter )] sẽ không tiết lộ [faith|E] bí mật trừ khi trùng với của Ngài"
  encourage_confession_of_false_conversions_decision.desc.tt_pluralist_counties:0 "Nếu Ngài là [independent|E], các [counties|E] trong [realm|E] của Ngài có [GetModifier('false_convert_modifier').GetNameWithTooltip] có thể công khai cải đạo, tùy thuộc vào mức độ thù địch của Ngài với [faith|E] mới của họ"
  encourage_confession_of_false_conversions_decision.desc.tt_coreligionist:0 "Những tín đồ bí mật trong lãnh địa có thể lộ diện, nếu [faith|E] riêng của họ trùng với đức tin công khai của Ngài"
  encourage_confession_of_false_conversions_decision_confirm:0 "Ban bố tuyên cáo"
  abandon_crypto_faith_decision: "Từ Bỏ Đức Tin Bí Mật"
  abandon_crypto_faith_decision.tt: "Ngừng thực hành đức tin cũ trong bí mật"
  abandon_crypto_faith_decision.desc: "#F Những buổi giảng đạo bí mật và lời cầu nguyện thì thầm này đã khiến ta mệt mỏi. Trong khi đó, ta đã quen với cuộc sống công khai theo [ROOT.Char.GetFaith.GetName]. Có lẽ đã đến lúc chôn vùi đức tin cũ mãi mãi.#!"
  abandon_crypto_faith_decision_confirm: "Từ bỏ #EMP đức tin bí mật#!"

 #Restore the Holy Roman Empire
  restore_holy_roman_empire_decision:0 "Khôi Phục Đế Chế La Mã Thần Thánh"
  restore_holy_roman_empire_decision_desc:0 "Đế chế chân chính ở phương Tây nay chỉ còn đổ nát, di sản của Charlemagne bị số phận tàn nhẫn xé nát. Chỉ một vị quân vương hùng mạnh và mộ đạo mới có thể khôi phục lại phẩm giá đế quốc của nước Đức."
  restore_holy_roman_empire_decision_confirm:0 "Khôi phục uy danh Đế chế La Mã!"
  restore_holy_roman_empire_decision_tooltip:0 "Phục hưng Đế chế La Mã tại phương Tây"
  decision_refound_hre_control_the_electors.tt:0 "Ngài phải kiểm soát hoặc nắm giữ các tước vị Tuyển hầu truyền thống: các Công quốc $d_ostmark$, $d_ostfalen$, $d_east_franconia$, và $d_bohemia$, cùng với các Bá quốc $c_trier$, $c_mainz$, và $c_cologne$"
  decision_refound_hre_own_three_kingdoms.tt:0 "Ngài phải kiểm soát ít nhất ba tước hiệu Vương quốc"
  restore_holy_roman_empire_decision_effects_de_jure.tt:0 "Mọi Vương quốc được kiểm soát hoàn toàn ngoài $e_italy$ sẽ trở thành lãnh thổ [de_jure|E] của $e_hre$"
  restore_holy_roman_empire_decision_effects_vassal_opinion.tt:0 "Tất cả chư hầu trực tiếp"
  reformed_holy_roman_empire_opinion:0 "Đã tái lập $e_hre$"
  hre_elector_list_creation_tt:0 "7 [electors|EU] Thân vương sẽ được chọn từ các Giám mục, Công tước và Vương công nổi bật thuộc lãnh thổ [de_jure|E] của Đế chế La Mã Thần Thánh"

 #Adopt Special Succession decision
  adopt_special_succession_decision:0 "Áp Dụng Kiểu Kế Vị Đặc Biệt"
  adopt_special_succession_decision_desc:0 "Chế độ phân chia thừa kế khiến chúng ta suy yếu và chia rẽ. Có lẽ giới quý tộc trong lãnh địa sẽ chấp nhận một phương án lịch sử khác..."
  adopt_special_succession_decision_confirm:0 "Suy xét vấn đề"
  adopt_special_succession_decision_tooltip:0 "Thay thế chế độ [succession|E] phân chia của Ta bằng một dạng $game_concept_succession$ tuyển cử địa phương"
  adopt_special_succession_decision_effects.tt:1 "Ngài có thể chọn một hình thức [succession|E] Tuyển cử truyền thống dựa trên [culture|E] của mình\n$EFFECT_LIST_BULLET$Nó sẽ được áp dụng cho mọi [titles|E] cấp cao nhất của Ngài đang dùng chế độ Phân chia [succession|E]"
