  host_feast_decision_desc_court_musician_opinion:1 "#P Vì Ngài bổ nhiệm $court_musician_court_position$, mức tăng thiện cảm sẽ đáng kể hơn#!"
  host_feast_decision_desc_shy:2 "#N Ngài sẽ không giảm [stress|E] vì Ngài là [GetTrait('shy').GetName( GetPlayer )] hoặc [GetTrait('reclusive').GetName( GetPlayer )]#!"
  host_feast_decision_desc_pensive:0 "#N Ngài sẽ không giảm [stress|E] vì Ngài là [GetTrait('pensive').GetName( GetPlayer )]#!"
