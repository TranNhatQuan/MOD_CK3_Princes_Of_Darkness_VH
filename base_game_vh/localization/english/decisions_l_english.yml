  isolating_modifier_desc: "Nhân vật này đang tự cách ly, ngăn cản hầu hết các phương thức liên lạc với thế giới bên ngoài và khiến bản thân không có quyền lực hay ảnh hưởng.\n\n[infection_chance|E]: #P -75%#!\nNguy cơ tử vong do [disasters|E]: #P -75%#!"
  epidemic_events.0100.t: "Cách Ly"
  epidemic_events.0100.desc: "Rời xa mùi hôi thối nơi trung tâm thủ đô trong đêm khuya, ta và gia đình có thể tạm thời tách biệt khỏi thần dân trong lãnh địa cho đến khi thích hợp để xuất hiện trở lại.\n\nLiên lạc sẽ bị hạn chế và ngai vàng sẽ trở nên trống vắng, nhưng chúng ta sẽ an toàn khỏi cái chết và sự mục rữa ngoài bốn bức tường khiêm nhường này."
  epidemic_events.0100.a: "Khóa cửa lại."
  epidemic_events.0101.t: "Ra Khỏi Lồng Giam"
  epidemic_events.0101.desc: "Ánh mặt trời trở nên xa lạ và gay gắt trên làn da ta, gió lạnh lẽo và như xâm phạm.\n\nLần cuối ta hít thở bầu không khí do [ROOT.Char.GetFaith.HighGodName|U] tạo ra là khi nào?"
  epidemic_events.0101.a: "Thật mừng khi được trở lại!"
  epidemic_events.0101.b: "Đóng cửa lại! Gió lùa quá!"
  natural_disaster.0110.t: "Cách Ly"
  natural_disaster.0110.desc: "Lặng lẽ rời khỏi trung tâm thủ đô trong đêm khuya, ta và gia đình có thể ở xa thần dân trong một địa điểm an toàn hơn cho đến khi trật tự tự nhiên được khôi phục.\n\nLiên lạc sẽ bị hạn chế và ngai vàng sẽ trở nên trống vắng, nhưng chúng ta sẽ an toàn khỏi cơn thịnh nộ của thiên nhiên."
  natural_disaster.0110.a: "Khóa cửa lại."
  natural_disaster.0111.t: "Ra Khỏi Lồng Giam"
