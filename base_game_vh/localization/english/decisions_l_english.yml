  convert_to_tribalism_decision:0 "Theo Chế Độ Bộ Lạc"
  convert_to_tribalism_decision_desc:0 "Sao ta có thể tự xưng là lãnh chúa khi điều đó chẳng mang ý nghĩa gì với dân ta? Nếu ta không thể cải hóa họ, chỉ còn một lựa chọn: ta phải trở thành một phần của họ."
  convert_to_tribalism_decision_confirm:0 "Đi theo con đường của dân ta"
  convert_to_tribalism_decision_tooltip:0 "Từ bỏ [government|E] hiện tại và trở thành [tribal|E]"
  recent_conversion_to_tribalism:0 "Ngài chưa chuyển sang [tribal|E] trong vòng 5 năm qua"
