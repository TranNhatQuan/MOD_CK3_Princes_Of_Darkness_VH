  restore_old_vasconia_decision_desc: "Quê hương cổ xưa của người Basque đã bị ngoại bang chèn ép quá lâu, đã đến lúc tuyên bố rõ ràng quyền thừa kế của chúng ta đối với vùng đất tổ tiên."
  restore_old_vasconia_decision_tooltip: "[GetTitleByKey('k_navarra').GetNameNoTier] trở thành Vương quốc Vasconia."
  restore_old_vasconia_decision_effects_de_jure_tt: "Nếu kiểm soát hoàn toàn, các [duchies|E] của [GetTitleByKey('d_gascogne').GetNameNoTier], [GetTitleByKey('d_armagnac').GetNameNoTier], [GetTitleByKey('d_languedoc').GetNameNoTier], [GetTitleByKey('d_barcelona').GetNameNoTier], [GetTitleByKey('d_aragon').GetNameNoTier], [GetTitleByKey('d_castilla').GetNameNoTier], và [GetTitleByKey('d_cantabria').GetNameNoTier] sẽ trở thành [de_jure|E] Vasconia"
  restore_old_vasconia_decision_confirm:0 "Đất đai của ta, đã trở về!"
  restore_old_vasconia_decision_navarra_tt: "Ngài nắm giữ [kingdom|E] của [GetTitleByKey('k_navarra').GetNameNoTier], hoặc nó không tồn tại"
