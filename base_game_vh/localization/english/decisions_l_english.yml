  unite_the_slavs_decision_confirm:0 "Thành lập Slavia"
  unite_the_slavs_decision_desc:0 "Nếu toàn thể các dân tộc Slav đoàn kết, sẽ không ai có thể ngăn cản chúng ta. Ta sẽ dựng nên đế chế hùng mạnh nhất mà thế giới từng biết!"
