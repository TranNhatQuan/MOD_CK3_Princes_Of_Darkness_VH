  go_on_hajj_decision_desc:0 "#F Hajj đến Mecca là một trong những trụ cột của đức tin ta. Đã đến lúc ta phải thực hiện nó và hoàn thành bổn phận của một người Hồi giáo.#!"
  go_on_hajj_decision_confirm:0 "$go_on_pilgrimage_decision_confirm$"

  reclaim_britannia_decision:0 "Tái chiếm Britannia"
  reclaim_britannia_decision_desc:1 "Những vùng đất này từng do người Celt cai trị, và tầm ảnh hưởng của văn hóa ấy một lần nữa đang lan rộng khắp nơi. Khi ngày càng nhiều nam nữ tiếp nhận ngôn ngữ và văn hóa Celt, đã đến lúc chính thức hóa điều đó!"
  reclaim_britannia_decision_tooltip:0 "Văn hóa [ROOT.Char.GetCulture.GetName] sẽ thống trị"
  reclaim_britannia_decision_custom:0 "Không được có quá 1 chư hầu mang văn hóa ngoài Celt"
  reclaim_britannia_decision_confirm:1 "Tái chiếm Britannia"
  HAS_NON_CELTIC_POWERFUL_VASSAL:2 "Tất cả [powerful_vassals|E] của Ngài phải có [culture|E] thuộc di sản Brythonic hoặc Goidelic [heritage|E]"

  restore_the_danelaw_decision:0 "Khôi phục Danelaw"
  restore_the_danelaw_decision_desc:0 "Luật pháp của người Đan Mạch từng cai trị vùng đất này — và sẽ lại một lần nữa!"
  restore_the_danelaw_decision_tooltip:0 "Cải tổ Vương quốc Danelaw"
  restore_the_danelaw_decision_confirm:0 "Khôi phục Danelaw"

  embrace_english_culture_decision:0 "Chấp nhận Văn hóa Anh"
  embrace_english_culture_decision_tooltip:1 "Ngài sẽ từ bỏ văn hóa [ROOT.Char.GetCulture.GetName]"
  embrace_english_culture_decision_desc:0 "Chư hầu, gia đình và ta đã sống cạnh người Saxon và Celt từ lâu. Khi ngôn ngữ và phong tục của chúng ta hòa quyện với họ, đã đến lúc thừa nhận rằng chúng ta đã trở thành một."
  embrace_english_culture_decision_get_innovations:0 "Văn hóa Anh nhận được nhiều sáng kiến Norman"
  embrace_english_culture_decision_vassals_custom:0 "Tất cả chư hầu tại Britannia"
  embrace_english_culture_decision_confirm:0 "Chấp nhận Văn hóa Anh"
  decision_embrace_english_culture_get_innovations:1 "Văn hóa Anh nhận toàn bộ [innovations|E] Norman và Anglo-Saxon"
  MY_CAPITAL_IS_IN_ENGLAND:1 "[realm_capital|E] của Ngài nằm ở Anh"
