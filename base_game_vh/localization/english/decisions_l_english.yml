 #UNITE THE SOUTHERN SLAVS
  unite_the_southern_slavs_decision:0 "Thống nhất người Slav phương Nam"
  unite_the_southern_slavs_decision_tooltip:0 "Thống nhất các dân tộc Slav phương Nam dưới một vị quân chủ"
  unite_the_southern_slavs_decision_confirm:0 "Thống nhất người Slav phương Nam"
  unite_the_southern_slavs_decision_desc:0 "Chúng ta từng là một dân tộc khi lần đầu đặt chân đến những vùng đất này. Qua năm tháng, chúng ta phân tán, chia rẽ thành nhiều bộ lạc.\n\nGiờ đây chúng ta bị bao quanh bởi những Đế chế hùng mạnh với phong tục xa lạ. Dưới ảnh hưởng của họ, lối sống của chúng ta đang dần mai một. Ta không thể để điều đó xảy ra — đã đến lúc đoàn kết một lần nữa."
  unite_the_southern_slavs_decision_titles_tt:1 "Mọi [kingdom|E] [title|E] Slav phương Nam mà Ngài sở hữu (trừ [primary_title|E]) sẽ bị hủy và lãnh thổ của chúng sẽ trở thành [de_jure|E] thuộc về Tước vị Chính của Ngài ([THIS.Char.GetPrimaryTitle.GetNameNoTier])"

