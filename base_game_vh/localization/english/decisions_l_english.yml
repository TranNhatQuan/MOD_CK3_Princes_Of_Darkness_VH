  unite_africa_decision_ancestors_desc:0 "Quá lâu rồi, quê hương tươi đẹp của chúng ta đã bị các kẻ xâm lược ngoại bang khai thác. Đã đến lúc đoàn kết các dân tộc Châu Phi và quay trở lại con đường của Tổ Tiên."
  unite_africa_decision_spirits_desc:0 "Quá lâu rồi, linh hồn của quê hương tươi đẹp của chúng ta đã bị những kẻ ngoại đạo xúc phạm. Đã đến lúc đoàn kết các dân tộc Châu Phi dưới danh nghĩa [ROOT.Char.GetFaith.HighGodName]."
  unite_africa_decision_generic_desc:0 "Các dân tộc Châu Phi đầy tự hào, dũng cảm và mạnh mẽ. Thế nhưng, nhiều người đã bị lầm lạc và thờ phụng các vị thần giả dối. Đã đến lúc đoàn kết tất cả họ dưới danh nghĩa [ROOT.Char.GetFaith.HighGodName]."
  every_non_root_faith_vassal_africa:0 "Mọi [vassal|E] không theo đức tin [THIS.Char.GetFaith.GetAdjective] hoặc thấp hơn tại Châu Phi"
