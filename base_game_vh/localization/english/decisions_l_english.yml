  rebuke_roman_revanchism_sicily: "Bác Bỏ Chủ Nghĩa Phục Thù La Mã tại Sicily"
  rebuke_roman_revanchism_sicily_desc: "Những kẻ phương Đông ấy có quyền gì với vùng đất trù phú ở miền nam bán đảo? Chúng chỉ mang đến tàn phá và bộ máy quan liêu bất tài, và việc trục xuất chúng chắc chắn chỉ đem lại điều tốt đẹp."
  rebuke_roman_revanchism_sicily_tooltip: "Loại bỏ [GetTitleByKey('k_sicily').GetNameNoTier] khỏi [GetTitleByKey('e_byzantium').GetDefinitiveName]"
  rebuke_roman_revanchism_sicily_confirm: "Đập Tan Ký Ức về Justinian!"
  rebuke_roman_revanchism_sicily.tt.requirements.lower_tally: "Ngài kiểm soát ít nhất [EmptyScope.ScriptValue('rebuke_roman_revanchism_sicily_requirements_no_ere_county_value')|V0] [counties|E] trong vùng [GetGeographicalRegion('custom_sicily').GetName]"
  rebuke_roman_revanchism_sicily.tt.requirements.ere_booted: "[GetTitleByKey('e_byzantium').GetDefinitiveName] kiểm soát #V 0#! [counties|E] trong vùng [GetGeographicalRegion('custom_sicily').GetName]"
  rebuke_roman_revanchism_sicily.tt.requirements.higher_tally: "Ngài kiểm soát ít nhất [EmptyScope.ScriptValue('rebuke_roman_revanchism_sicily_requirements_some_ere_county_value')|V0] [counties|E] trong vùng [GetGeographicalRegion('custom_sicily').GetName]"
  rebuke_roman_revanchism_sicily.tt.sicily_has_no_holder: "Không có [ruler|E] nào nắm giữ [GetTitleByKey('k_sicily').GetNameNoTier]"
  rebuke_roman_revanchism_sicily.tt.requirements.ere_cant_be_revanchising: "Hoặc [GetTitleByKey('e_byzantium').GetBaseNameNoTier] chưa thực hiện [GetDecisionWithKey('retake_eastern_provinces_decision').GetName] [decision|E], hoặc đế quốc đó không tồn tại"
  rebuke_roman_revanchism_sicily.tt.requirements.ere_not_in_italy: "[GetTitleByKey('e_byzantium').GetDefinitiveName] kiểm soát ít hơn [EmptyScope.ScriptValue('rebuke_roman_revanchism_sicily_requirements_no_ere_in_italy_county_value')|V0] [counties|E] trong vùng [GetGeographicalRegion('world_europe_south_italy').GetName]"
  rebuke_roman_revanchism_sicily.tt.effects.option.1: "Nếu Ngài tái hợp [GetTitleByKey('k_sicily').GetNameNoTier] với phương bắc"
  rebuke_roman_revanchism_sicily.tt.effects.option.2: "Nếu Ngài liên kết [GetTitleByKey('k_sicily').GetNameNoTier] với các láng giềng  Địa Trung Hải"
  rebuke_roman_revanchism_sicily.tt.effects.option.3: "Nếu Ngài chọn sáp nhập [GetTitleByKey('k_sicily').GetNameNoTier]"

  roman_restoration.1211.t: "Giấc Mộng của Justinian Tan Vỡ"
  roman_restoration.1211.desc.intro: "Suốt hàng trăm năm, người Byzantine đã bám víu vào những cứ điểm cuối cùng của họ trên bán đảo Ý, ghim những móng tay đẫm máu vào mảnh đất này và từ chối buông bỏ dù chúng ta có vùng vẫy đến đâu.\n\nKhông còn nữa. Hôm nay, sự kiểm soát của chúng cuối cùng đã đủ lỏng lẻo để bị xé toạc vĩnh viễn, và ta sẽ đảm bảo cả thế giới biết điều đó.\n\n"
  roman_restoration.1211.desc.body.emperor_exists: "[emperor.GetTitledFirstNameNicknamed] có thể nổi trận lôi đình và gầm gừ thỏa thích theo ý [emperor.GetSheHe] — nếu [emperor.GetSheHe] thậm chí bận tâm để mắt tới một tỉnh ly khai nằm xa cung điện tiện nghi của [emperor.GetHerHis] — nhưng [emperor.GetSheHe] chẳng thể làm gì để ngăn cản ta."
  roman_restoration.1211.desc.body.emperor_absent: "Thậm chí còn chẳng có hoàng đế nào để phản đối tuyên bố của ta. Thật thảm hại."
  roman_restoration.1211.desc.outro: "\n\nCâu hỏi duy nhất là... ta muốn thấy [GetTitleByKey('k_sicily').GetNameNoTier] xinh đẹp thuộc về đâu?"
  roman_restoration.1211.a: "Chúng ta mãi gắn bó với những người anh em phương bắc."
  roman_restoration.1211.b: "Định mệnh của Sicily, như xưa nay, nằm bên kia biển cả."
  roman_restoration.1211.c: "Vì sao lại không thuộc về [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] chứ!"

  roman_restoration.1212.t: "$roman_restoration.1211.t$"
  roman_restoration.1212.desc.intro: "Sau hàng trăm năm kháng cự ngoan cường trước những làn sóng man di tàn phá tàn tích cuối cùng của quê hương cổ đại, [taker.GetTitledFirstName] cuối cùng đã thành công nơi bao kẻ khác thất bại.\n\nTên khốn đó đã xóa sổ những tàn dư cuối cùng của quyền kiểm soát La Mã trên bán đảo phía tây,"
  roman_restoration.1212.desc.new_empire.italia: "thay vào đó gắn kết vùng đất này chặt chẽ với [GetTitleByKey('e_italy').GetNameNoTier]."
  roman_restoration.1212.desc.new_empire.maghreb: "đưa nó vào phạm vi châu Phi cùng với [GetTitleByKey('e_maghreb').GetNameNoTier]."
  roman_restoration.1212.desc.new_empire.own: "sáp nhập lãnh thổ vào lãnh địa của riêng [taker.GetHerHis] là [taker.GetPrimaryTitle.GetBaseNameNoTier]."
  roman_restoration.1212.desc.outro.territory_left: "\n\nNhững tiền đồn thưa thớt còn sót lại của chúng ta không đủ sức chống lại sự ô nhục này."
  roman_restoration.1212.desc.outro.no_territory_left: "\n\nKhông còn lấy một cảng nào ở phương nam thuộc về ta, chúng ta chẳng thể làm gì để chống lại bất công này."
  roman_restoration.1212.a: "Tên vô lại ngạo mạn!"

  roman_restoration.1213.t: "$roman_restoration.1211.t$"
  roman_restoration.1213.desc.intro: "Bất chấp việc đổ cả đại dương máu vì các lãnh thổ Ý qua nhiều thế kỷ, [taker.GetTitledFirstNameNicknamed] cuối cùng đã buộc người La Mã thừa nhận rằng [GetTitleByKey('k_sicily').GetNameNoTier] đã mất khỏi tay họ.\n\nThay vào đó, vùng đất nay hướng về"
  roman_restoration.1213.desc.new_empire.italia: "phần còn lại của bán đảo để tìm sự che chở."
  roman_restoration.1213.desc.new_empire.maghreb: "những láng giềng  châu Phi bên kia đại dương, xem mình là một phần của những người anh em cổ xưa bên kia [GetTitleByKey('e_maghreb').GetNameNoTier]."
  roman_restoration.1213.desc.new_empire.own: "[taker.GetHerHis] [taker.GetPrimaryTitle.GetBaseName] của riêng mình như một đế chế #EMP mới#!."
  roman_restoration.1213.desc.body.emperor_exists: "[emperor.GetTitledFirstName] phản đối ở mức có thể mong đợi trước việc mất một tỉnh nhỏ, nhưng cũng chỉ có thế."
  roman_restoration.1213.desc.body.emperor_absent: "Không còn lấy một hoàng đế để lên tiếng phản đối, La Mã tại Ý lụi tàn trong tiếng thở dài."
  roman_restoration.1213.desc.outro.territory_left: "\n\nNhững cứ điểm ít ỏi còn lại của đế chế bên kia Adriatic giờ trông mong manh hơn bao giờ hết."
  roman_restoration.1213.desc.outro.no_territory_left: "\n\nKhông còn lấy một thành phố La Mã nào trên vùng đất đã mất, chẳng còn ai để tiếc thương cái chết của giấc mộng Justinian."
  roman_restoration.1213.a: "Biến đi cho khuất mắt!"
  roman_restoration.1213.b: "Thời buổi đen tối làm sao..."

 # BP3
  local_arbitration_decision: "Phân Xử Địa Phương"
  local_arbitration_decision_desc: "Đôi khi cần phải gặp gỡ các quan chấp pháp và thị trưởng địa phương để đảm bảo mọi tầng lớp trong hệ thống vận hành đúng như mong muốn. Thần dân hẳn sẽ trân trọng cử chỉ này."
  local_arbitration_decision_tooltip: "Ngài cải thiện [county|E] tại vị trí hiện tại"
  local_arbitration_decision_confirm: "Bắt Đầu Phân Xử"
  inside_realm_trigger: "Phải đang ở trong [realm|E] của chính Ngài"
  local_arbitration_key: "[GetDecisionWithKey('local_arbitration_decision').GetName]"
  local_arbitration_modifier_1: "Tân Binh Hăng Hái"
