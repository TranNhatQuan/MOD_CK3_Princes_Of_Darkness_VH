  major_decisions.3200.t: "[rightful_title.GetNameNoTierNoTooltip] Hợp Nhất"
  major_decisions.3200.desc: "Với tư cách [rightful_liege.Custom('GetQueenKing')|l] của ngai vàng [rightful_title.GetNameNoTier] và [destroyed_title.GetNameNoTier], [rightful_liege.GetTitledFirstName] đã quyết định rằng đã đến lúc cai trị cả hai từ [rightful_liege.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nTừ nay, các chư hầu của [rightful_liege.GetHerHis] sẽ không còn bị xem là hai dân tộc dưới quyền một [rightful_liege.Custom('GetQueenKing')|l], mà là thần dân của một vương quốc thống nhất."
