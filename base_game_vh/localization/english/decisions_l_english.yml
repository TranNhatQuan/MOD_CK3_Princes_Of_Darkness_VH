  found_kingdom_decision_elective_succesion:0 "Không có luật Kế vị Tuyển cử"

 # Establish Norman Culture
  establish_norman_culture_decision:0 "Thiết Lập Văn Hóa Norman"
  establish_norman_culture_decision_desc:0 "Những truyền thống cũ không còn phù hợp với quê hương mới của chúng ta. Ta nên học hỏi người bản địa và xem có thể tiếp thu điều gì từ họ."
  establish_norman_culture_decision_confirm:0 "Normandy Trỗi Dậy!"
  establish_norman_culture_decision_tooltip:0 "Hợp nhất văn hóa Bắc Âu và văn hóa Pháp bản địa"
  establish_norman_culture_decision_effect.tt:0 "Tất cả các bá quốc và nhân vật thuộc [old_culture_1.GetName] và [old_culture_2.GetName] ở miền bắc nước Pháp trở thành [new_culture.GetName]"
  establish_norman_culture_decision_effect.tt.2:0 "[normandy_title.GetName] được đổi tên thành $d_normandy$"

 # Found the Kingdom of Aragon
  form_the_kingdom_of_aragon_decision:0 "Thành Lập Vương Quốc Aragon"
  form_the_kingdom_of_aragon_decision_desc:1 "Con cháu của dòng sông Ebro vĩ đại đã bị gạt ra bên lề suốt nhiều thế kỷ. Bởi người La Mã, người Visigoth, người Frank, rồi người Ả Rập. Chừng nào họ còn phục dịch cho những kẻ chinh phục ngoại bang và những kinh đô xa xôi, thì đất đai ấy chưa thực sự thuộc về họ, và dân chúng khao khát một vương quốc của riêng mình."
  form_the_kingdom_of_aragon_decision_confirm:0 "Quê hương ta, vương quốc ta!"
  form_the_kingdom_of_aragon_decision_tooltip:0 "Thành lập Vương quốc Aragon"
  form_the_kingdom_of_aragon_decision.tt.form_aragonese:0 "Ngài có thể chọn sao chép [culture_pillars|E] từ [founder_culture.GetName] sang [aragonese_culture.GetName]"
  form_the_kingdom_of_aragon_decision.tt.drift.d_valencia:0 "Nếu Ngài [completely_control|E] [d_valencia.GetDefinitiveName], nó sẽ [de_jure_drift_drifted|E] vào [k_aragon.GetDefinitiveName]."
  form_the_kingdom_of_aragon_decision.tt.drift.d_barcelona:0 "Nếu Ngài [completely_control|E] [d_barcelona.GetDefinitiveName], nó sẽ [de_jure_drift_drifted|E] vào [k_aragon.GetDefinitiveName]."
  form_the_kingdom_of_aragon_decision.tt.drift.d_navarra:0 "Nếu Ngài [completely_control|E] [d_navarra.GetDefinitiveName], nó sẽ [de_jure_drift_drifted|E] vào [k_aragon.GetDefinitiveName]."

 # Culture Conversion
  convert_to_local_culture_decision:0 "Chuyển Sang Văn Hóa Địa Phương"
  convert_to_local_culture_decision_desc:0 "Thành thật mà nói, truyền thống của ta chẳng khác mấy so với dân chúng tại kinh đô. Chúng ta cùng mừng những ngày thánh lễ giống nhau, những yến tiệc công cộng giống nhau, và ngôn ngữ cũng gần như hòa làm một."
  convert_to_local_culture_decision_confirm:1 "Ta thừa nhận con người mình"
  convert_to_local_culture_decision_tooltip:0 "Chuyển sang [culture|E] của [capital|E] của Ngài"
  converted_culture_msg_title:0 "[converting_character.GetShortUINameNoTooltip|U] đã chuyển [culture|E]"
  converted_from_old_culture_to_new_culture_tt:0 "Chuyển từ [old_culture.GetName] sang [new_culture.GetName]"
  every_old_culture_vassal_holding_new_culture_land:0 "Mọi [vassal|E] cùng [culture|E] với Ngài đang sở hữu [counties|E] thuộc Văn hóa mới"
  every_close_family_member_sharing_your_culture:1 "Mọi [close_family|E] cùng [culture|E] với Ngài"
  every_consort_sharing_your_culture:1 "Mọi phối ngẫu cùng [culture|E] với Ngài"

  assimilate_local_traditions_decision:0 "Để Lãnh Địa Tiếp Nhận Truyền Thống Địa Phương"
  assimilate_local_traditions_decision_desc:0 "Dù tinh thần phiêu lưu luôn chảy trong huyết quản, ta thừa nhận rằng mình đã ở rất xa quê hương Scandinavia băng giá. Truyền thống địa phương phù hợp với con người nơi đây; họ làm chủ mảnh đất này và thần linh của họ đầy quyền năng — ta tôn trọng điều đó. Rồi sẽ đến lúc chúng ta trở thành một phần của họ."
  assimilate_local_traditions_decision_confirm:0 "Chúng ta sẽ thích nghi"
  assimilate_local_traditions_decision_tooltip:0 "Chuyển Ngài và toàn bộ [vassals|E] Bắc Âu sang [culture|E] và [faith|E] của [capital|E]"
  every_norse_vassal:0 "Mọi [vassal|E] cùng [culture|E] với Ngài và [close_family|E] của họ"
  non_zealous_convert:0 "Cải đạo sang [new_faith.GetName] #weak (nếu không có đặc tính Sùng đạo)#!"

  secede_from_empire_decision:0 "Ly Khai Khỏi [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  secede_from_empire_decision_desc:0 "Sự bất tài của [ROOT.Char.GetLiege.GetTitledFirstNamePossessive] đã khiến [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTooltip] không thể bảo vệ thần dân khỏi kẻ thù, cả trong lẫn ngoài. Ngay cả một vị quân vương mới cũng khó lòng khắc phục hết những tổn hại mà [ROOT.Char.GetLiege.GetSheHe] đã gây ra.\n\nKhôn ngoan hơn cả là chúng ta tách ra và lập nên một lãnh địa mới, sống chết dựa vào thực lực của chính mình thay vì bị kéo chìm cùng phần còn lại của Đế chế."
  secede_from_empire_decision_tooltip:0 "Buông bỏ và giảm bớt căng thẳng"
  secede_from_empire_decision_effect_tooltip:0 "Một phần nợ của lãnh chúa cũ sẽ được xóa"
  secede_from_empire_decision_trigger_debt:0 "[CHARACTER.GetTitledFirstName] đã mắc nợ hơn 25 năm"
  secede_from_empire_decision_trigger_war:0 "[CHARACTER.GetTitledFirstName] đã tiến hành cùng một cuộc chiến tấn công hơn 25 năm"
  secede_from_empire_decision_confirm:0 "Chúc mừng!"
  secede_from_empire_decision_notification:0 "[ROOT.Char.GetTitledFirstName] đã giành Độc lập"
  secede_from_empire_decision_notification_tt:0 "Điều này xảy ra do khoản nợ quá mức của Ta"
  secede_from_empire_decision_debug:1 "[ROOT.Char.GetPrimaryTitle.GetName] đã ly khai khỏi [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTooltip], xóa [debt_cleared.GetValue] tiền nợ"

 #DECISIONS TO "USE" YOUR STRESS COPING TRAITS TO LOSE STRESS
  stress_loss_drunkard_decision:0 "Chìm Đắm Trong Rượu"
  stress_loss_drunkard_decision_desc:0 "Tình bằng hữu nơi quán rượu, sự bình yên trong làn men say mờ ảo... Đã đến lúc ta buông mình vào một cơn chè chén!"
  stress_loss_drunkard_decision_tooltip:0 "Buông thả và giảm bớt căng thẳng"
  stress_loss_drunkard_decision_effect_tooltip:1 "Ngài sẽ giảm một lượng [stress|E]"
  stress_loss_drunkard_decision_confirm:0 "Cạn chén!"

  stress_loss_hashishiyah_decision:1 "Dùng Bánh Hashish"
  stress_loss_hashishiyah_decision_desc:1 "Chỉ vài miếng thôi, căng thẳng dường như tan chảy khỏi cơ thể. Tâm trí dần mờ đi, và cảm giác bình yên bao trùm lấy ta. Không gì thư giãn bằng thứ hashish hảo hạng!"
  stress_loss_hashishiyah_decision_tooltip:1 "Để căng thẳng tan vào làn khói mê ảo"
  stress_loss_hashishiyah_decision_confirm:1 "Mang ra đây!"

  stress_loss_rakish_decision:0 "Ghé Thăm Lầu Xanh"
  stress_loss_rakish_decision_desc:0 "[ROOT.Char.Custom('AttractionWomanManIndef')|U] ngồi trong lòng ta, và mọi thứ — mọi người — nơi lầu xanh đều sẵn sàng theo ý ta..."
  stress_loss_rakish_decision_desc_woman_ending:0 "Không gì giải tỏa tâm trí bằng khoái lạc xác thịt."
  stress_loss_rakish_decision_desc_man_ending:0 "Không gì giải phóng tâm trí bằng một lần thỏa mãn trọn vẹn."
  stress_loss_rakish_decision_tooltip:0 "Xoa dịu tâm trí bằng cách nuông chiều dục vọng"
  stress_loss_rakish_decision_confirm:0 "Ta đến đây, [ROOT.Char.Custom('AttractionGirlBoyPlural')]!"

  stress_loss_reclusive_decision:0 "Tự Cô Lập"
  stress_loss_reclusive_decision_desc:1 "Để thực sự định tâm và gạt bỏ mọi lo toan, ta phải ở một mình. Trong cô độc, ta có thể tập trung và hồi phục."
  stress_loss_reclusive_decision_tooltip:0 "Tách biệt để thanh lọc tâm trí"
  stress_loss_reclusive_decision_confirm:0 "Tạm biệt."

  stress_loss_irritable_decision:1 "Trút Giận"
  stress_loss_irritable_decision_desc:1 "Giải phóng toàn bộ cơn giận và sự bực bội bị dồn nén bấy lâu... Không gì khiến đầu óc nhẹ nhõm hơn thế! Lần tới khi có cơ hội, ta sẽ không kìm lại."
  stress_loss_irritable_decision_effect_tooltip:0 "Ngài sẽ sỉ nhục một chư hầu ngẫu nhiên"
  stress_loss_irritable_decision_effect_courtier_tooltip: "Ngài sẽ sỉ nhục một [THIS.Char.Custom('GetCourtier')|l] ngẫu nhiên"
  stress_loss_irritable_decision_tooltip:0 "Buông lời cay nghiệt để xoa dịu tâm trí"
  stress_loss_irritable_decision_confirm:0 "Này! Ngươi đó!"

  stress_loss_flagellant_decision:0 "Tự Quất Roi"
  stress_loss_flagellant_exaltation_decision_desc:0 "Không gì thanh tẩy tâm trí bằng sự giải tỏa qua đau đớn. Việc cảm thấy gần gũi hơn với [ROOT.Char.GetFaith.HighGodName] chỉ là... một... #EMP ân huệ#! thiêng liêng."
  stress_loss_exaltation_decision_desc:0 "Thân xác tồn tại để làm phương tiện giao hòa với [ROOT.Char.GetFaith.HighGodName]. Hãy để ta hành xác thân này để đạt tới sự hòa hợp ấy."
  stress_loss_flagellant_decision_desc:0 "Không gì thanh tẩy tâm trí bằng sự giải tỏa qua đau đớn. Ta sẽ quất roi lên lưng mình cho đến khi tâm trí được thanh sạch."
  stress_loss_flaggelant_decision_effect_tooltip:0 "Ngài sẽ giảm căng thẳng"
  stress_loss_flagellant_decision_tooltip:0 "Thanh tẩy tâm trí bằng đau đớn"
  stress_loss_flagellant_decision_confirm:0 "Ugh–!"

  stress_loss_profligate_decision:0 "Ghé Thăm Khu Chợ"
  stress_loss_profligate_decision_desc:0 "Thứ gì đó mới mẻ, thứ gì đó lấp lánh, thứ gì đó hiếm có... Không gì khiến ta cân bằng lại như một món đồ mới, và khu chợ địa phương chứa đầy những báu vật!"
  stress_loss_profligate_decision_tooltip:0 "Tiêu vàng để tập trung tinh thần"
  stress_loss_profligate_decision_confirm:0 "Lấp đầy túi tiền của ta!"

  stress_loss_improvident_decision:0 "Quyên Góp Từ Thiện"
  stress_loss_improvident_decision_desc:0 "Có nhiều người cần vàng của ta hơn chính ta. Có thể nó không trực tiếp giải quyết vấn đề của ta, nhưng cho đi giúp tâm trí nhẹ nhõm hơn."
  stress_loss_improvident_decision_tooltip:0 "Cho đi để tâm trí được thanh thản"
  stress_loss_improvident_decision_confirm:0 "Vì mục đích tốt đẹp!"

  stress_loss_contrite_decision:0 "Thú Tội"
  stress_loss_contrite_decision_desc:0 "Ít điều gì mang lại sự giải tỏa và tự do như một lời thú tội. Bằng cách nói ra bí mật và lỗi lầm của mình, ta có thể làm dịu tâm trí."
  stress_loss_contrite_decision_tooltip:0 "Thú nhận lỗi lầm và giải phóng tâm trí"
  stress_loss_contrite_decision_expose_random_secret:0 "Một bí mật ngẫu nhiên của Ngài sẽ bị phơi bày"
  stress_loss_contrite_decision_confirm:0 "Ta có điều muốn nói!"

  stress_loss_comfort_eater_decision:0 "Ăn Uống Thỏa Thích"
  stress_loss_comfort_eater_decision_desc:0 "Khi mọi thứ dường như hơi #EMP quá sức#! Ta luôn có thể trông cậy vào đồ ăn để xoa dịu tâm trí – bụng no sẽ mang lại một tâm trí trống rỗng và bình yên."
  stress_loss_comfort_eater_decision_tooltip:0 "Ăn để tập trung tinh thần"
  stress_loss_comfort_eater_decision_confirm:0 "Dọn bàn lên!"
  lackluster_diet_hindrance_desc: "Ngài đang theo một Chế Độ Ăn Uống Nhạt Nhẽo"

  stress_loss_inappetetic_decision:0 "Tránh Xa Đồ Ăn"
  stress_loss_inappetetic_decision_desc: "Ta đã có quá nhiều thứ phải lo rồi, ngay cả khi không tính đến đĩa thức ăn trước mặt! Bỏ bữa sẽ giúp ta tập trung vào những vấn đề thực sự quan trọng."
  stress_loss_inappetetic_decision_tooltip:0 "Tránh ăn và tránh căng thẳng"
  stress_loss_inappetetic_decision_confirm:0 "Báo cho đầu bếp"

  stress_loss_journaller_decision:0 "Viết Ra Tâm Tư"
  stress_loss_journaller_decision_desc:0 "Ta sẽ đặt suy nghĩ và gánh nặng của mình xuống trang giấy. Không gì làm đầu óc thanh thản như mực và giấy!"
  stress_loss_journaller_decision_tooltip:0 "Viết suy nghĩ ra giấy để tâm trí được nhẹ nhõm"
  stress_loss_journaller_decision_confirm:0 "Mang nhật ký của ta lại đây!"

  stress_loss_confider_decision:0 "Tâm Sự Với Người Tri Kỷ"
  stress_loss_confider_decision_desc:0 "Được thực sự lắng nghe là một điều hiếm có. Không gì xoa dịu tâm trí bằng một cuộc trò chuyện chân thành với người Ngài tin tưởng, và nó thường khiến vấn đề trở nên nhỏ bé hơn nhiều!"
  stress_loss_confider_decision_tooltip:0 "Chia sẻ gánh nặng của Ngài với người khác"
  stress_loss_confider_decision_confirm:0 "Nghe ta nói đây..."

  stress_loss_athletic_decision:0 "Giải Tỏa Căng Thẳng"
  stress_loss_athletic_decision_desc:0 "Không gì xoa dịu tâm trí bằng nhịp tim tăng cao và một trận đổ mồ hôi sảng khoái! Ta sẽ rèn luyện cơ thể cho đến khi tâm trí được nhẹ nhõm hơn."
  stress_loss_athletic_decision_tooltip:0 "Cơ thể khỏe mạnh tạo nên tinh thần khỏe mạnh"
  stress_loss_athletic_decision_confirm:0 "Đi nào!"

  DECISION_COOLDOWN_WARNING:1 "@alert_icon! #alert_trial $DECISION_NAME$ sẽ không khả dụng trong $COOLDOWN$#!"
 
  all_courtiers_except_confidant:0 "Tất cả [courtiers|E] ngoại trừ người tri kỷ"

  found_kingdom_of_bosnia_decision:0 "Thành Lập Vương Quốc Bosnia"
  found_kingdom_of_bosnia_decision_desc:0 "Những ngọn núi và cánh rừng của miền trung Bosnia liên tục đổi chủ giữa các lãnh chúa phương bắc và phương nam. Nhưng có lẽ sẽ không còn lâu nữa..."
  found_kingdom_of_bosnia_decision_tooltip:0 "Bosnia trở thành một [de_jure|E] [kingdom|E]"
  found_kingdom_of_bosnia_decision_confirm:0 "[ROOT.Char.GetLadyLord|U] của toàn Bosnia!"

  accuse_krstjani_of_heresy_decision:0 "Tố Cáo $bosnian_church$ Là Dị Giáo"
  accuse_krstjani_of_heresy_decision_desc:0 "Vùng cao nguyên hoang dã của Bosnia trong nhiều năm qua đã che chở cho một giáo phái không thực sự thuộc về Đông hay Tây, vậy mà cả hai bên dường như đều làm ngơ trước sự lệch lạc ngày càng lớn này.\n\nKhông còn nữa! Chúng ta sẽ yêu cầu [ROOT.Char.GetFaith.ReligiousHeadName] chính thức tuyên bố họ là dị giáo, và họ sẽ không còn nơi ẩn náu!"
  accuse_krstjani_of_heresy_decision_tooltip:0 "Thế giới Cơ Đốc sẽ không còn dung thứ cho những kẻ ly giáo này!"
  accuse_krstjani_of_heresy_flavour_effect.tt:0 "Ngài gửi một bức thư tới [GetPlayer.GetFaith.ReligiousHeadName], khẩn cầu [GetPlayer.GetFaith.GetReligiousHead.GetHerHim] xem xét vấn đề về $bosnian_church$..."
  accuse_krstjani_of_heresy_decision_confirm:0 "Trước là bút mực, sau là gươm giáo!"
  cannot_be_atoned_krstjani_leader_flag:0 "Ngài không thể là một $bosnian_church_adherent$ đã được xá tội!"

  launch_hungarian_migration_decision:0 "Chuẩn Bị Vượt Dãy Carpathians"
  launch_hungarian_migration_decision_desc:0 "Các bộ lạc cạnh tranh trên thảo nguyên, đặc biệt là những toán chiến binh Pecheneg cướp bóc khắp lãnh thổ của ta, đang khiến cuộc sống ngày càng khó khăn. Bên kia dãy Carpathians là những thung lũng màu mỡ, rừng rậm và đồng bằng trù phú của Pannonia yếu ớt..."
  launch_hungarian_migration_decision_tooltip:0 "Rời bỏ thảo nguyên để định cư tại Pannonia"
  launch_hungarian_migration_decision_flavour_effect:0 "Ngài nhận được [hungarian_invasion_casus_belli|E] đặc biệt dùng một lần"
  launch_hungarian_migration_decision_confirm:0 "Gửi kỵ sĩ đến từng bộ lạc!"
  launch_hungarian_migration_decision_before_last_date:0 "Ngày là 911.1.1 hoặc sớm hơn"

  negotiate_the_danelaw_decision:0 "Đàm Phán Danelaw"
  negotiate_the_danelaw_decision_desc:0 "Sự cạnh tranh đất đai tại $k_england$ vô cùng khốc liệt, và chưa một vị cai trị nào thực sự chiếm ưu thế. Tuy nhiên, vẫn còn một con đường chưa ai thử qua. Có lẽ một thỏa thuận với Quỷ dữ có thể được thiết lập..."
  negotiate_the_danelaw_decision_confirm:0 "Quyền lực trước mắt, thống nhất sau?"
  negotiate_the_danelaw_decision_tooltip:0 "Cân nhắc chia đôi $k_england$ với đối thủ mạnh nhất của Ngài"
  negotiate_the_danelaw.valid_opponent.tt:0 "Ngài phải có một đối thủ hợp lệ để đàm phán"
  negotiate_the_danelaw.controlled_duchies.tt:0 "Ngài phải [completely_control|E] ít nhất hai [duchies|E] trong [de_jure|E] $k_england$"
  negotiate_the_danelaw.preview.tt:0 "Ngài suy ngẫm liệu việc chia cắt vương quốc có mang lại lợi ích..."
  negotiate_the_danelaw.clarification.tt:0 "Ngài có thể rút lại quyết định này trước khi xác nhận."

  negotiate_the_danelaw_integrate_duchies_decision:0 "Sáp Nhập Công Quốc $k_england_adj$"
  negotiate_the_danelaw_integrate_duchies_decision_desc:0 "Sự phân chia vương quốc này thật vô lý! Những vùng đất trong biên giới của ta đương nhiên thuộc về ta, và ta sẽ đảm bảo mọi người tôn trọng điều đó!"
  negotiate_the_danelaw_integrate_duchies_decision_confirm:0 "Một vương quốc, một [ROOT.Char.GetTitleAsNameNoTooltip]."
  negotiate_the_danelaw_integrate_duchies_decision_tooltip:0 "Sáp nhập các công quốc đã bị [de_jure_partitioned|E]"
  negotiate_the_danelaw_integrate_duchies_decision.duchies_within_danelaw.tt:0 "[completely_control|E] ít nhất một [duchy|E] trong $k_danelaw_article$$k_danelaw$"
  negotiate_the_danelaw_integrate_duchies_decision.duchies_within_england.tt:0 "[completely_control|E] ít nhất một [duchy|E] trong $k_england$"
  negotiate_the_danelaw_integrate_duchies_decision.danelaw_side.t:0 "$k_england$ sáp nhập các Công Quốc"
  negotiate_the_danelaw_integrate_duchies_decision.danelaw_side.desc:0 "Lãnh thổ de jure từ $k_danelaw$ đã được sáp nhập trực tiếp vào $k_england$."
  negotiate_the_danelaw_integrate_duchies_decision.england_side.t:0 "$k_danelaw$ sáp nhập các Công Quốc"
  negotiate_the_danelaw_integrate_duchies_decision.england_side.desc:0 "Lãnh thổ de jure từ $k_england$ đã được sáp nhập trực tiếp vào $k_danelaw$."
  negotiate_the_danelaw_integrate_duchies_decision.inform_minor_players.t:0 "Vương Quốc Được Sáp Nhập"
  negotiate_the_danelaw_integrate_duchies_decision.inform_minor_players.tt:0 "Một phần lãnh thổ của Ngài đã bị cưỡng ép sáp nhập vào một vương quốc khác"

  formalise_the_daneland_decision:0 "Hợp Thức Hóa Daneland"
  formalise_the_daneland_decision_desc:0 "Dân ta quan tâm gì đến $k_england$? Chúng ta không chỉ có luật lệ riêng, mà còn có phong tục, ngôn ngữ, truyền thống — có cả #EMP nền văn hóa#! của chính mình. Họ chẳng có quyền gì với đất đai của ta hơn việc ta có quyền với đất của họ."
  formalise_the_daneland_decision_confirm:0 "Mối thù này thật không xứng đáng."
  formalise_the_daneland_decision_tooltip:0 "Từ bỏ tham vọng thống nhất $k_england$"
  formalise_the_daneland_decision.must_be_after_1100.tt:0 "Thời điểm là ngày 1.1.1100 hoặc muộn hơn"
  admiring_birds_decision:0 "Ngắm Chim"
  admiring_birds_decision_tooltip:0 "Dành chút thời gian ngắm chim."
  admiring_birds_decision_desc:0 "#F Chim là những sinh vật tuyệt mỹ, ta có thể học hỏi rất nhiều khi quan sát chúng — và còn hơn thế nữa nếu có thể vuốt ve một con!#!"
  admiring_birds_decision_confirm:0 "Đi dạo"
  deceitful_progress_hostile_schemes_decision:0 "Nghiên Cứu Nghệ Thuật Mưu Kế"
  deceitful_progress_hostile_schemes_decision_desc:0 "'Ta phải cân nhắc mọi hướng mà kế hoạch của mình có thể rẽ sang. Như con nhện giăng tơ, ta phải bảo đảm có nhiều cách để con mồi sa lưới. Ta sẽ dành thời gian tính toán sự lừa dối của mình thật cẩn trọng.'"
  deceitful_progress_hostile_schemes_decision_tooltip:0 "Tinh chỉnh các [hostile_schemes|E] của Ngài."
  deceitful_progress_hostile_schemes_decision_confirm:0 "Cả một thế giới âm mưu đang chờ!"
  deceitful_progress_hostile_schemes_decision_missing_scheme:0 "Ngài cần có ít nhất #V 1 #! [hostile_scheme|E] đang hoạt động"
  deceitful_progress_hostile_schemes_decision_missing_scheme_effect:0 "Các [hostile_schemes|E] của Ngài sẽ có [success_chance|E] cao hơn"
  msg_deceitful_progress_hostile_schemes:0 "Các [hostile_schemes|E] của Ngài đã tiến triển!"

  diligent_development_focus_decision:0 "Phát Triển Thủ Phủ"
  diligent_development_focus_decision_desc:0 "Ta mơ rằng [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] một ngày nào đó sẽ trở thành niềm ganh tị của mọi quân vương dưới bầu trời. Ta phải trở thành người biến nơi ấy thành viên ngọc của thế gian. Chỉ cần ta nỗ lực thêm chút nữa...\n\nAi mà cần ngủ chứ?"
  diligent_development_focus_decision_tooltip:0 "Cải thiện mức phát triển của Thủ phủ"
  diligent_development_focus_decision_confirm:0 "Lập kế hoạch phát triển"
  msg_diligent_development_focus:0 "Sự chăm chỉ của Ngài đang mang lại kết quả!"

  impatient_rushing_all_schemes_decision:0 "Thúc Đẩy Âm Mưu"
  impatient_rushing_all_schemes_decision_desc:0 "Tại sao phải chờ đợi mãi khi ta đã sẵn sàng? Thử vận may ngay bây giờ!"
  impatient_rushing_all_schemes_decision_tooltip:0 "Mạo hiểm bằng cách kết thúc sớm các [schemes|E]"
  impatient_rushing_all_schemes_decision_confirm:0 "Bây giờ hoặc không bao giờ!"
  impatient_rushing_all_schemes_decision_missing_scheme:0 "Ngài cần có ít nhất #V 1 #! [scheme|E] đang hoạt động"
  impatient_rushing_all_schemes_decision_missing_scheme_effect:0 "Các [schemes|E] đang hoạt động sẽ tiến triển ngay lập tức"
  msg_impatient_rushing_all_schemes:0 "Các [schemes|E] của Ngài đã sẵn sàng!"
  found_kingdom_of_livonia_decision:0 "Tuyên Xưng Terra Mariana"
  found_kingdom_of_livonia_decision_desc:0 "Người Baltic suốt nhiều thế kỷ qua chưa từng có một vương quốc của riêng mình. Vùng đất khắc nghiệt, hoang dã của các bộ tộc và những tín ngưỡng ngoại giáo rời rạc này từ lâu đã thiếu một bản sắc chung — nhưng có lẽ ta sẽ thay đổi tất cả…"
  found_kingdom_of_livonia_decision_tooltip:0 "Livonia trở thành một [de_jure|E] [kingdom|E]"
  found_kingdom_of_livonia_decision_confirm:0 "[ROOT.Char.GetLadyLord|U] của toàn thể người Baltic!"

 # Introduce a Fashion at Court
  introduce_a_new_fashion_at_court_decision:0 "Giới Thiệu Thời Trang Mới Tại Triều Đình"
  introduce_a_new_fashion_at_court_decision_desc:0 "Không triều đình nào sành điệu bằng chúng ta! Triều đình là chiến trường của thời trang, và đã đến lúc ta phải tạo dựng một trào lưu mới trong giới quý tộc..."
  introduce_a_new_fashion_at_court_decision_tooltip:0 "Thử tạo một xu hướng thời trang mới tại triều đình để nhận [prestige|E]."
  introduce_new_fashion_duel_tooltip:0 "Một nhân vật trong triều có thể thách đấu Ngài bằng [diplomacy|E] nhằm ngăn phong cách của Ngài được chấp nhận."
  introduce_a_new_fashion_at_court_decision_confirm:0 "Vì phong cách và đẳng cấp mới!"
  court_already_has_a_fashion_tend_tt:0 "Triều đình đã có một xu hướng thời trang đang diễn ra."

  court_amenities_interactions.0010.b_turned_down:0 "Mọi người đều yêu thích phong cách mới!"
  court_amenities_interactions.0010.t:0 "Một Xu Hướng Mới Tại Triều Đình"
  court_amenities_interactions.0010.desc_intro:0 "[actor.GetNameNoTooltip|U] vội vã xông vào triều đình, thu hút ánh nhìn của tất thảy các lãnh chúa và phu nhân trong vương quốc bằng những bộ y phục kỳ dị nhất của [actor.GetHerHis]."
  court_amenities_interactions.0010.desc.flag_big_collar:0 "[actor.GetSheHe|U] khoác lên mình bộ y phục với chiếc cổ áo rộng bằng cả bánh xe ngựa"
  court_amenities_interactions.0010.desc.flag_head_dress:0 "[actor.GetSheHe|U] đã đội một chiếc mũ truyền thống nghếch sang một bên đầu của [actor.GetHerHis] như một sự chế nhạo đầy kệch cỡm đối với văn hóa [actor.GetCulture.GetName]"
  court_amenities_interactions.0010.desc.flag_gold_boots:0 "[actor.GetSheHe|U] lê những bước chân nặng nhọc ngang qua sảnh lớn của [debate_locale.GetNameNoTierNoTooltip], đôi hài bằng kim loại đặc khảm vàng của [actor.GetHerHis] gần như xé toạc cả mặt đất bởi trọng lượng khổng lồ của chúng"
  court_amenities_interactions.0010.desc.flag_sleeveless:0 "[actor.GetSheHe|U] đã xé bỏ ống tay khỏi y phục quý tộc của [actor.GetHerHis]"
  court_amenities_interactions.0010.desc.flag_commoner_clothes:0 "[actor.GetSheHe|U] bước vào [debate_locale.GetNameNoTierNoTooltip] trong trang phục của một nông dân hèn mọn"
  court_amenities_interactions.0010.desc_outro:0 "và còn dám tuyên bố đây là xu hướng mới nhất của vương quốc! Lũ ngốc trong triều dường như đang tin theo, nhưng ta có nên lên tiếng chấm dứt trò điên rồ này không?"
  court_amenities_interactions.0010.a_flag_big_collar:0 ""Trông ngươi như con chim nuốt cả cái đĩa!""
  court_amenities_interactions.0010.a:0 ""Ngươi #EMP đang#! mặc cái gì thế kia?""
  court_amenities_interactions.0010.b:0 "Cắn môi cố nhịn cười."
  court_amenities_interactions.0010.a.tt_success:0 "Ngài thuyết phục được đám đông rằng trang phục của [actor.GetNamePossessiveNoTooltip] thật lố bịch"
  court_amenities_interactions.0010.a.tt_failure:0 "Đám đông không đồng tình và cho rằng trang phục của [actor.GetNamePossessiveNoTooltip] là xu hướng mới"
  court_amenities_interactions.0011.t:0 "Thời Trang Và Thù Địch"
  court_amenities_interactions.0011.desc_intro:0 "Ta sải bước khắp triều đình, tự hào về tuyên ngôn thời trang táo bạo của mình,"
  court_amenities_interactions.0011.desc.flag_big_collar:0 "bộ y phục được tô điểm bằng chiếc cổ áo tròn khổng lồ để mọi người chiêm ngưỡng."
  court_amenities_interactions.0011.desc.flag_head_dress:0 "chiếc mũ quen thuộc lệch sang một bên đầu, mang lại hơi thở mới cho món đồ vốn cũ kỹ và tẻ nhạt."
  court_amenities_interactions.0011.desc.flag_gold_boots:0 "đôi ủng vàng nặng nề lấp lánh dưới ánh sáng đại sảnh [debate_locale.GetNameNoTierNoTooltip]."
  court_amenities_interactions.0011.desc.flag_sleeveless:0 "bộ trang phục không tay mới, phô bày cánh tay của ta cho tất cả chiêm ngưỡng!"
  court_amenities_interactions.0011.desc.flag_commoner_clothes:0 "tự hỏi vì sao quý tộc phải ăn mặc khác dân thường khi sự giản dị mới thực sự là đỉnh cao phong cách."
  court_amenities_interactions.0011.desc_bridge:0 "[recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] hét lớn từ phía bên kia đại sảnh.\n\nChúng ta ném qua lại những lời công kích, ta bảo vệ điều hiển nhiên là thời trang thượng thừa vượt xa đầu óc tầm thường."
  court_amenities_interactions.0011.desc_won:0 "Khi giới quý tộc địa phương tụ tập quanh ta, ta biết tuyên ngôn thời trang của mình đã thành công rực rỡ!"
  court_amenities_interactions.0011.desc_lost:0 "Khi quý tộc tại [debate_locale.GetNameNoTierNoTooltip] nhanh chóng hùa theo [recipient.GetNameNoTooltip] chế nhạo trang phục của ta, ta biết tuyên ngôn của mình đã không được thấu hiểu trong thời đại này."
  court_amenities_interactions.0011.a_won:0 "Ta luôn biết mình đúng!"
  court_amenities_interactions.0011.a_lost:0 "Họ просто không #EMP hiểu#! ta!"
  court_amenities_interactions.0012.desc_intro:0 ""Chà, vài kẻ trong chúng ta chỉ là bọn theo đuôi, còn những người khác là bậc quân vương." [actor.GetNameNoTooltip] kiên định với lòng say mê dành cho bộ y phục lố bịch của [actor.GetHerHis].\n\nTa dành vài canh giờ tiếp theo để tranh luận về bản chất của thời trang thượng lưu, với một đám nhỏ triều thần đứng xem ta buông lời nhục mạ không ngớt vào tên ngốc này."
  court_amenities_interactions.0012.desc_won:0 "Chẳng bao lâu, nhiều triều thần khác bắt đầu cùng ta chế giễu [actor.GetNameNoTooltip], và ta biết mình đã hoàn thành việc."
  court_amenities_interactions.0012.desc_lost:0 "Đáng tiếc, đám đông không bị thuyết phục, và chỉ trong vài ngày, ta là người duy nhất trong triều #EMP không#! ăn mặc như [actor.GetNameNoTooltip]."
  court_amenities_interactions.0012.desc_lost.kof:1 "Không chỉ vậy, nhiều người còn gọi [actor.GetHerHim] là ""[actor.GetTitleAsNameNoTooltip] của Thời Trang."""
  court_amenities_interactions.0012.a_lost:0 "Ta bị bao quanh bởi lũ nịnh thần và kẻ ngốc!"
  court_amenities_interactions.0013.desc:1 "Theo thời gian, nhiều người tại [debate_locale.GetNameNoTierNoTooltip] bắt đầu gọi ta là [actor.GetTitleAsNameNoTooltip] của Thời Trang!"
  court_amenities_interactions.0013.a:0 "Vạn tuế [actor.GetTitleAsNameNoTooltip]!"
 
