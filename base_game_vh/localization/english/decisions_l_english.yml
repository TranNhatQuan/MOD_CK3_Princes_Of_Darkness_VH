  start_hunt_decision.tt.servants_prestige.reduced:0 "#N Việc thiếu [Concept('court_amenities','Servants')|E] để lùa thú khiến cuộc săn khó khăn hơn và kém [prestigious|E] nếu kết quả không tốt#!"
