  found_witch_coven_house_member_percent_tt:0 "[SCOPE.ScriptValue('found_witch_coven_member_percent_display_value')|2]% thành viên [adult|E] của [house|E] Ngài là phù thủy"

  convert_whole_realm_to_feudalism_west_african_pagan_decision:0 "$convert_whole_realm_to_feudalism_decision$ #weak (Tà Giáo Tây Phi)#!"
  convert_whole_realm_to_feudalism_west_african_pagan_decision_desc:0 "Quản trị tốt chỉ đơn giản là vấn đề về quy mô. Một thị trấn có thể chỉ cần các bô lão, nhưng một đế chế đòi hỏi các quan lại — dân ta hiểu điều đó, và chúng ta có thể tận dụng những người học thức trong số họ để đảm nhiệm vai trò ấy."
  convert_whole_realm_to_feudalism_west_african_pagan_decision_confirm:0 "$convert_whole_realm_to_feudalism_decision_confirm$"
  convert_whole_realm_to_feudalism_west_african_pagan_decision_tooltip:0 "$convert_whole_realm_to_feudalism_decision_tooltip$"
  convert_whole_realm_to_feudalism_west_african_pagan_decision.tt.vassal_count:0 "Ngài có ít nhất [EmptyScope.ScriptValue('convert_whole_realm_to_feudalism_west_african_pagan_decision_vassal_count_value')|0] [vassals|E] với [rank|E] từ [count|E] trở lên"
  convert_whole_realm_to_feudalism_west_african_pagan_decision.tt.wa_capital_development:0 "[capital|E] của Ngài nằm trong [GetGeographicalRegion('world_africa_west').GetName] và có ít nhất [EmptyScope.ScriptValue('convert_whole_realm_to_feudalism_west_african_pagan_decision_wa_capital_development_value')|0] [development|E]"
  faith_qualifies_for_west_african_pagan_feudalisation_trigger.tt:0 "[faith|E] của Ngài là [GetFaithDoctrine('west_african_unreformed_faith_doctrine').GetBaseName]"

  appoint_a_righteous_caliph_decision:0 "Bổ Nhiệm Một Caliph Chính Trực"
  appoint_a_righteous_caliph_decision_desc:0 "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] là một nhân vật xa cách, không xứng đáng, và không đủ chuẩn bị để dẫn dắt Ummah. Với tư cách là người theo [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetAdjective], [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] đơn giản là không #EMP hiểu#! nhiều chân lý tinh tế trong tư tưởng [ROOT.Char.GetFaith.GetAdjective].\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U] có thể không hiểu, nhưng #EMP ta#! thì hiểu..."
  appoint_a_righteous_caliph_decision_confirm:0 "Ta được dẫn dắt bởi [ROOT.Char.GetFaith.PositiveAfterLife|U]!"
  appoint_a_righteous_caliph_decision_tooltip:0 "Dẫn dắt [ROOT.Char.GetFaith.GetNameNoTooltip] rời khỏi con đường [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetAdjectiveNoTooltip]"
  appoint_a_righteous_caliph_decision.tt.you_become_caliph:0 "Ngài trở thành [head_of_faith|E] mới"
  appoint_a_righteous_caliph_decision.need_at_least_ten_same_faith_counties:0 "Ngài có ít nhất [EmptyScope.ScriptValue('appoint_a_righteous_caliph_decision_same_faith_county_count')|0] [counties|E] theo [CHARACTER.GetFaith.GetAdjective]"
  appoint_a_righteous_caliph_decision.cant_be_caliphal_controller:0 "Ngài không phải là [liege|E] của [head_of_faith|E]"
  appoint_a_righteous_caliph_decision.no_more_than_x_sinful_traits:0 "Ngài không có quá [EmptyScope.ScriptValue('appoint_a_righteous_caliph_decision_own_max_sins')|0] [sinful|E] [traits|E]"
  appoint_a_righteous_caliph_decision.caliph_not_in_diplo_range:0 "[head_of_faith|E] của Ngài nằm ngoài [diplomatic_range|E]"
  appoint_a_righteous_caliph_decision.control_one_holy_site:0 "Ngài kiểm soát ít nhất 1 [holy_site|E]"
  appoint_a_righteous_caliph_decision.control_two_holy_sites:0 "Ngài kiểm soát ít nhất 2 [holy_sites|E]"
  appoint_a_righteous_caliph_decision.caliph_has_x_or_more_traits_sinful_to_your_faith:0 "[head_of_faith|E] của Ngài có [EmptyScope.ScriptValue('appoint_a_righteous_caliph_decision_hof_min_sins')|0] hoặc nhiều hơn [sinful|E] [traits|E]"
  appoint_a_righteous_caliph_decision.has_wishes_to_schism_caliphate_flag:0 "Ngài đã có ý định ly khai thêm khi [faith|E] của mình được thành lập"
  appoint_a_righteous_caliph_decision_mutazila_variant: "Khôi Phục Mu'tazila"
  appoint_a_righteous_caliph_decision_general_iranian_variant: "Đoạn Tuyệt Với Caliphate"
  appoint_a_righteous_caliph_decision_mutazila_variant_desc: "Kể từ khi Mihna kết thúc, những người ủng hộ quan điểm Qur'an được tạo thành đã bị các caliph tự xưng bức hại hoặc phớt lờ. Ta sẽ tự mình báo thù cho những sự xúc phạm chúng ta đã chịu đựng, và một lần nữa đưa học thuyết Mu'tazila trở lại vị trí trung tâm của tư tưởng Hồi giáo."
  appoint_a_righteous_caliph_decision_general_iranian_variant_desc: "Dù Hồi giáo được mang đến Ba Tư bằng vũ lực, giờ đây không ai có thể phủ nhận niềm tin của chúng ta vào Sự Duy Nhất của [ROOT.Char.GetFaith.HighGodNameAlternate]. Nhưng con đường của chúng ta và người Ả Rập đã dần tách biệt, và chúng ta phải đoạn tuyệt với [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] một lần và mãi mãi. Từ nay, ta sẽ đích thân dẫn dắt những người theo [ROOT.Char.GetFaith.GetAdjective]]."

  mozarabic_bind_the_faith_to_rome_decision:0 "Gắn Đức Tin Với Rome"
  mozarabic_bind_the_faith_to_rome_decision_desc:0 "Dù [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] vẫn là vị Giáo hoàng chân chính duy nhất của chúng ta, sự cô lập khỏi ý chí của Đại Diện Chúa Kitô đã đưa ta đi vào những con đường kỳ lạ. Đã qua rồi những ngày các công đồng vĩ đại của giáo sĩ châu Âu bước qua các đại sảnh Toledo.\n\nTuy vậy, điều đó không nhất thiết phải như thế... nếu đức tin của ta đã lạc lối, chẳng phải một mục tử mạnh mẽ có thể đưa nó trở lại đàn chiên sao?"
  mozarabic_bind_the_faith_to_rome_decision_tooltip:0 "Tái gắn kết [faith|E] [ROOT.Char.GetFaith.GetAdjective] lạc hướng với [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetName]"
  mozarabic_bind_the_faith_to_rome_decision_confirm:0 "Vị trí của chúng ta thuộc về cộng đồng Kitô giáo rộng lớn."
  mozarabic_bind_the_faith_to_rome_decision.tt.hof_and_ecumenism_warning:0 "Ngài sẽ giữ [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName], nhưng #X vĩnh viễn#! giữ [religious_leader.GetFaith.GetReligiousHead.GetFaith.GetAdjective] [head_of_faith|E]"
  mozarabic_bind_the_faith_to_rome_decision.path_righteous:0 "Nếu chúng ta cải tổ [faith|E] theo hướng $doctrine_pluralism_righteous_name$ hơn"
  mozarabic_bind_the_faith_to_rome_decision.path_fundamentalist:0 "Nếu chúng ta cải tổ [faith|E] theo hướng $doctrine_pluralism_fundamentalist_name$ hơn"
  mozarabic_bind_the_faith_to_rome_decision.path_pluralist:0 "Nếu chúng ta cải tổ [faith|E] theo hướng $doctrine_pluralism_pluralistic_name$ hơn nữa"
  mozarabic_fate_county_count.need_at_least_twenty_same_faith_counties:0 "Ngài phải nắm giữ ít nhất [EmptyScope.ScriptValue('mozarabic_fate_county_count')|0] [counties|E] cùng [faith|E]"
  mozarabic_bind_the_faith_to_rome_decision.threaten_pope:0 "@warning_icon! #warning Ngài ép buộc Giáo hoàng bằng một [strong_hook|E], họ sẽ không hài lòng!#!"

  mozarabic_break_with_rome_decision:0 "Đoạn Tuyệt Với Rome"
  mozarabic_break_with_rome_decision_desc:0 "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] biết gì về cuộc sống hay vùng đất của chúng ta? Rome là một thế lực thế tục xa xôi, không quan tâm cũng chẳng thấu hiểu nhu cầu tâm linh của chúng ta.\n\nChỉ bằng cách tự giải phóng khỏi xiềng xích của [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetBaseName] và thanh trừng những dối trá cuối cùng của nó thì [ROOT.Char.GetFaith.GetName] mới có thể đạt đến sự hoàn thiện."
  mozarabic_break_with_rome_decision_tooltip:0 "Dẫn dắt [ROOT.Char.GetFaith.GetName] ly khai khỏi [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetName]"
