  found_witch_coven_decision_desc:0 "Gia tộc tự hào của chúng ta được gắn kết bởi huyết thống, nhưng sự thật lại chia rẽ chúng ta. Ta mong đến ngày chúng ta không còn sống trong sợ hãi, mà hoàn toàn cởi mở với nhau. Con trai và con gái chúng ta sẽ được nuôi dạy để đón nhận sức mạnh của mình và ý chí của [ROOT.Char.GetFaith.WitchGodName]. Mong chúng ta phụng sự [ROOT.Char.GetFaith.WitchGodHerHim|U] thật tốt!"
