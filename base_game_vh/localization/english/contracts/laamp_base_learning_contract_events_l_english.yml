  laamp_base_4001_request: "Nhiệm vụ [task_contract|E] này yêu cầu Ngài sao chép một bản thảo thông qua #BOLD 3#! thử thách [skill|E] [learning|E]; hoặc có thể dựa vào [lifestyle_traits|E] để tạo ra một bản thảo còn xuất sắc hơn"
  laamp_base_learning_contract_events_prefix.4001: "Sao chép"
