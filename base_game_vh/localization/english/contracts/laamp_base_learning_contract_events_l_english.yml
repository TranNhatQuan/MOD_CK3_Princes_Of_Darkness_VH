 #Intro
  laamp_base_learning_contract_events.4100.desc.intro.first_time: "[child_to_educate.GetFirstName] nhìn Ta với ánh mắt tò mò nhưng đầy mong đợi khi chúng Ta gặp nhau trong buổi học đầu tiên."
  laamp_base_learning_contract_events.4100.desc.intro.stress: "Khi Ta bước lại gần, [child_to_educate.GetFirstName] theo bản năng lùi lại, đôi mắt [child_to_educate.GetHerHis] nheo lại đầy cảnh giác."
  laamp_base_learning_contract_events.4100.desc.intro.support_no_support: "Một thoáng bối rối lướt qua gương mặt của [child_to_educate.GetFirstNamePossessive] khi [child_to_educate.GetSheHe] tự hỏi trợ lý của Ta trong buổi học trước đã đi đâu."
  laamp_base_learning_contract_events.4100.desc.intro.support: "[child_to_educate.GetFirstName] quan sát [support_person.GetFirstName] với ánh mắt tò mò khi chúng Ta tiến lại gần."
  laamp_base_learning_contract_events.4100.desc.intro.learning: "[child_to_educate.GetFirstName] nhìn Ta bằng ánh mắt khó đoán khi chúng Ta gặp nhau trong buổi học tiếp theo."
  laamp_base_learning_contract_events.4100.desc.intro.topic: "Khi chúng ta gặp lại nhau, [child_to_educate.GetFirstName] nghiêng đầu trong lúc ta tóm tắt lại chủ đề của buổi học trước."
 #Surroundings
  laamp_base_learning_contract_events.4100.desc.surroundings.alley_day: "\n\nCon hẻm nhộn nhịp hoạt động, các thương nhân nhanh nhẹn di chuyển giữa các quảng trường, "
  laamp_base_learning_contract_events.4100.desc.surroundings.gallows: "\n\nĐám đông quanh giá treo cổ vừa tan đi, cơn khát máu của họ đã được thỏa mãn, "
  laamp_base_learning_contract_events.4100.desc.surroundings.market: "\n\nHàng hóa được trao tay và nhu cầu được đáp ứng tại khu chợ, "
  laamp_base_learning_contract_events.4100.desc.surroundings.docks: "\n\nNhững con thuyền đánh cá vừa cập bến và sản vật của biển đang được bốc dỡ, "
  laamp_base_learning_contract_events.4100.desc.surroundings.armory: "\n\nLò rèn gầm rú, vũ khí được xếp đầy các góc của kho binh khí, "
  laamp_base_learning_contract_events.4100.desc.surroundings.garden: "\n\nKhu vườn yên bình mang đến vô số cơ hội giảng dạy, "
  laamp_base_learning_contract_events.4100.desc.surroundings.tavern: "\n\nQuán rượu tụ tập đông đảo khách quen lẫn lữ khách, "
  laamp_base_learning_contract_events.4100.desc.surroundings.temple: "\n\nVài [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] thong thả dạo bước trong khuôn viên thánh địa, "
  laamp_base_learning_contract_events.4100.desc.surroundings.throneroom: "\n\nGia nhân đi lại tất bật trong đại sảnh ngai vàng, "
  laamp_base_learning_contract_events.4100.desc.surroundings.farmlands: "\n\nDòng người dân làng qua lại không ngớt trên những cánh đồng bằng phẳng, "
  laamp_base_learning_contract_events.4100.desc.surroundings.plains: "\n\nNhững cơn gió lang thang trên đồng bằng, ai đi qua cũng cảm nhận được hơi thở của chúng, "
  laamp_base_learning_contract_events.4100.desc.surroundings.steppe: "\n\nThảo nguyên dường như kéo dài vô tận khi chúng Ta đi dọc rìa khu định cư, "
  laamp_base_learning_contract_events.4100.desc.surroundings.desert: "\n\nCát, cát, và cát, trải dài đến tận tầm mắt. Chúng Ta đi quanh vùng ngoại vi khu định cư, "
  laamp_base_learning_contract_events.4100.desc.surroundings.drylands: "\n\nVùng đất khô cằn hiếm hoi nước ngọt, nhưng chúng Ta vẫn gặp vài đoàn lữ hành, "
  laamp_base_learning_contract_events.4100.desc.surroundings.oasis: "\n\nỐc đảo nằm ở rìa khu định cư thu hút đông đảo khách ghé thăm, "
  laamp_base_learning_contract_events.4100.desc.surroundings.hills: "\n\nNhững ngọn đồi nhấp nhô là nơi chăn thả nhiều [ROOT.Char.Custom('RegionalFarmAnimalPlural')], "
  laamp_base_learning_contract_events.4100.desc.surroundings.mountains: "\n\nSườn núi địa phương nhộn nhịp đủ loại lữ khách và hoạt động, "
  laamp_base_learning_contract_events.4100.desc.surroundings.wetlands: "\n\nĐầm lầy sình lầy là nơi cư ngụ của đủ loại sinh vật gây hại, điều mà lữ khách bất cẩn sớm nhận ra, "
  laamp_base_learning_contract_events.4100.desc.surroundings.foggy_forest: "\n\nLàn sương phát sáng bao trùm khu rừng, trong khi dân địa phương đang chuẩn bị bữa ăn gần đó, "
  laamp_base_learning_contract_events.4100.desc.surroundings.managed_forest: "\n\nTrại khai thác gỗ gần đó đang hoạt động hết công suất, "
  laamp_base_learning_contract_events.4100.desc.surroundings.pine_forest: "\n\nNhững người hái lượm lục lọi trong bụi rậm, thu hoạch các đặc sản địa phương, "
  laamp_base_learning_contract_events.4100.desc.surroundings.forest: "\n\nChúng Ta tình cờ bắt gặp một trại các nhà phiêu lưu thân thiện giữa rừng sâu, "
  laamp_base_learning_contract_events.4100.desc.surroundings.forest_cave: "\n\nVị hiền nhân địa phương [ROOT.Char.GetWomanMan] đang cư trú trong hang động thu hút khá đông người đến xem, "
  laamp_base_learning_contract_events.4100.desc.surroundings.snowy_forest: "\n\nDân làng đang lần theo dấu chân thú trên tuyết, "
 #Topic
  laamp_base_learning_contract_events.4100.desc.topic.diplomacy: "và Ta nhận ra một vài cơ hội để dạy cho [child_to_educate.GetFirstNameNoTooltip] thêm về sự duyên dáng trong giao tiếp xã hội."
  laamp_base_learning_contract_events.4100.desc.topic.martial: "và khi quan sát xung quanh, Ta nhanh chóng xác định được một vài điểm quan sát chiến lược mà Ta nên dạy cho [child_to_educate.GetFirstNameNoTooltip]."
  laamp_base_learning_contract_events.4100.desc.topic.stewardship: "và nhìn quanh, Ta nhận ra vô số cơ hội để cải thiện cách tổ chức hiện tại; điều mà [child_to_educate.GetFirstNameNoTooltip] nên được biết."
  laamp_base_learning_contract_events.4100.desc.topic.intrigue: "và khi chúng Ta tản bộ dọc theo con đường, Ta luôn để mắt quan sát xung quanh — một kỹ năng mà [child_to_educate.GetFirstNameNoTooltip] nên thành thạo."
  laamp_base_learning_contract_events.4100.desc.topic.learning: "và Ta xác định được [ROOT.Char.Custom('GetScientificObjects')] có thể mang lại lợi ích nếu [child_to_educate.GetFirstNameNoTooltip] được biết đến."
  laamp_base_learning_contract_events.4100.desc.topic.prowess: "và Ta lập tức bắt đầu nhận ra những góc nguy hiểm khác nhau mà từ đó chúng Ta có thể bị phục kích — điều mà Ta nên dạy cho [child_to_educate.GetFirstNameNoTooltip]."
 #Distraction
  laamp_base_learning_contract_events.4100.desc.distraction.stress: "\n\nĐứa trẻ bước đi phía sau Ta, cố tình ngoảnh mặt đi và phớt lờ Ta mỗi khi Ta liếc nhìn [child_to_educate.GetHerHim], như thể đang chuẩn bị cho cơn bộc phát mất kiên nhẫn tiếp theo của Ta. Cau mày lại, Ta suy ngẫm về tình huống này."
  laamp_base_learning_contract_events.4100.desc.distraction.hobbyhorse: "\n\nPhía sau Ta, cậu học trò nhỏ của mình lững thững bước đi, nhặt lấy con ngựa gỗ của [child_to_educate.GetHerHis] từ một quầy hàng gần đó. [child_to_educate.GetSheHe|U] bắt đầu cưỡi nó chạy vòng quanh, vui sướng chạy hết vòng này đến vòng khác."
  laamp_base_learning_contract_events.4100.desc.distraction.attention: "\n\nTuy nhiên, khi ta quay lại, [child_to_educate.Custom('GirlBoy')] đã đứng sững lại, chăm chú quan sát một chiếc gậy dài bằng cánh tay mà [child_to_educate.GetSheHe] tìm thấy trên mặt đất, hoàn toàn không phản ứng trước lời gọi của ta."
  laamp_base_learning_contract_events.4100.desc.distraction.dog: "\n\nRồi như từ hư không, một con [ROOT.Char.Custom('get_region_dog_type')] to lớn lao đến chỗ đứa trẻ, háo hức muốn chơi đùa. Cậu/cô bé [child_to_educate.Custom('GirlBoy')] ré lên vì sung sướng và lập tức bắt đầu chơi với con chó."
  laamp_base_learning_contract_events.4100.desc.distraction.running: "\n\nĐột nhiên, cậu/cô bé trẻ tuổi thuộc văn hóa [child_to_educate.GetCulture.GetNameNoTooltip] [child_to_educate.Custom('GirlBoy')] có ánh mắt tinh nghịch và bắt đầu hét lên: \"Bọn cướp đang đến!\" rồi gần như cười ngặt nghẽo khi [child_to_educate.GetSheHe] chạy tới chạy lui cùng người hầu của [child_to_educate.GetHerHis]."
  laamp_base_learning_contract_events.4100.desc.distraction.crushing: "\n\nỞ phía trước, một người nông dân [dummy_gender.Custom('GirlBoy')] có vẻ ngoài nổi bật dường như đã mê hoặc người học trò của ta. [child_to_educate.GetSheHe|U] lén lút đi theo, chăm chú quan sát [dummy_gender.Custom('GirlBoy')] đang mang theo lương thực và #EMP hoàn toàn#! phớt lờ sự hiện diện của ta."
  laamp_base_learning_contract_events.4100.desc.distraction.other_kids: "\n\nMột vài đứa trẻ khác đang chạy nhảy trong một trò chơi tự phát, thu hút sự chú ý của cậu/cô bé [child_to_educate.Custom('GirlBoy')]. [child_to_educate.GetSheHe|U] chạy tới chỗ chúng, nhập cuộc trước khi ta kịp ngăn [child_to_educate.GetHerHim]."
  laamp_base_learning_contract_events.4100.desc.distraction.friends: "\n\nHọc trò của ta dường như đã dẫn theo một nhóm bạn bè, điều đó cũng không sao, nhưng bọn trẻ dường như chẳng mấy quan tâm đến bài giảng của ta, khiến ta không khỏi chán nản. Ta kiềm chế không cau có khi chúng cãi vã và trêu chọc lẫn nhau."
  laamp_base_learning_contract_events.4100.desc.distraction.hiding: "\n\n[child_to_educate.Custom('GirlBoy')] dường như đang vô cùng ham chơi, khi [child_to_educate.GetSheHe] liên tục lẩn vào rồi lại xuất hiện từ những chỗ ẩn nấp, cố gắng trốn khỏi ta. Ta cố gắng kìm nén sự bực bội đang ngày càng dâng lên."
  laamp_base_learning_contract_events.4100.desc.distraction.unimpressed: "\n\nNgay khi sự lịch sự ban đầu qua đi, vì một lý do nào đó, đứa trẻ ngả người ra sau và bắt đầu phớt lờ ta, nhắm mắt lại và giả vờ ngủ ngay giữa bài giảng của ta."
 #Outro
  laamp_base_learning_contract_events.4100.desc.outro_body: "vẫy tay về phía Ta từ đằng xa, sẵn sàng hỗ trợ nếu cần thiết."
  laamp_base_learning_contract_events.4100.desc.outro: "\n\n[support_person.GetFirstName] $laamp_base_learning_contract_events.4100.desc.outro_body$"
