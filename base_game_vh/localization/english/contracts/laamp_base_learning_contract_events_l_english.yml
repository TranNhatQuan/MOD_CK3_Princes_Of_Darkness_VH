#Conclusion
  laamp_base_learning_contract_events.4027.t: "$laamp_base_learning_contract_events_prefix.4021$: Kết Luận"
  laamp_base_learning_contract_events.4027.desc.success.critical: "[employer.GetTitledFirstName] lật qua những trang của bản thảo, dừng lại để suy ngẫm về một đoạn trích trên mỗi trang. \"Ta phải nói rằng...\"\n\n[employer.GetSheHe|U] quay lại và nhẹ nhàng đưa bản thảo cho người hầu của [employer.GetHerHis]. \"Ngươi đã từng thấy thứ này chưa? Ta có lẽ sẽ đem nó #EMP trưng bày#!. Một tác phẩm kinh điển khiến người ta phải kinh ngạc đến khó tin.\"\n\nKhẽ vỗ tay tán thưởng, [employer.GetSheHe] cúi người lại gần với vẻ tinh nghịch. \"Đặc biệt ta rất thích #EMP phần#! ghi chú bên lề đó. Làm tốt lắm! Hãy tận hưởng phần thưởng của ngươi, và nhất định hãy cho ta biết nếu có ngày ngươi quay trở lại [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\"\n\nTa tự hào vươn người và gật đầu."
  laamp_base_learning_contract_events.4027.desc.success.standard: "Tò mò nhìn vào bản thảo, [employer.GetTitledFirstName] khẽ ngân nga và gật đầu. \"Nhìn chung, đây là một công việc hoàn thành tốt — ta sẽ cho đặt nó lên giá sách cùng với những tác phẩm khác.\"\n\n[employer.GetSheHe|U] đưa cho ta một chiếc túi có kích thước đáng kể. \"Ta tin rằng thứ này sẽ bù đắp xứng đáng cho thời gian của ngươi.\"\n\n\"Hãy cho ta biết nếu ngươi muốn thử lại vào một ngày nào đó,\" [employer.GetSheHe] nói thêm khi quay người rời đi.\n\nTa nhận lấy chiếc túi và lịch sự gật đầu."
  laamp_base_learning_contract_events.4027.desc.success.qualified: "\"Không... hoàn toàn như ta mong đợi. Chắc chắn đây là #EMP một tác phẩm#! nhưng...\" [employer.GetTitledFirstName] hơi nhăn mũi khi [employer.GetSheHe] đưa bản thảo cho người hầu của [employer.GetHerHis].\n\n\"...có lẽ ta sẽ đặt nó vào một trong những chồng sách. Ta tin rằng ngươi có thể tự tìm đường ra chứ?\" Không chờ câu trả lời của ta, [employer.GetSheHe] đã rời khỏi căn phòng.\n\nTa nhặt chiếc túi ít ỏi bên cạnh cửa và bắt đầu lang thang qua các hành lang để tìm lối ra."
  laamp_base_learning_contract_events.4027.desc.failure: "\"Đây là loại... gì vậy...\" [employer.GetTitledFirstName] dừng lại một lúc trước khi ném bản thảo cho người hầu của [employer.GetHerHis].\n\n\"Ngươi dám sử dụng số mực và giấy mà ta khó khăn lắm mới có được để tạo ra thứ... #EMP rác rưởi#! này sao!?\"\n\nGiờ đây đang đi đi lại lại trong những vòng tròn nhỏ đầy hoảng loạn, [employer.GetSheHe] xoa thái dương: \"Ta đã mời ngươi đến nhà ta. Phòng #EMP nghiên cứu#! của ta!! Và #EMP đây#! là thứ ngươi tạo ra sao? Ta gần như muốn gọi lính canh đến vì sự phản bội này!\""
  laamp_base_learning_contract_events.4027.a: ""Hãy nghĩ thế này: Ngài đang nắm trong tay một bản thảo độc nhất vô nhị.""
  laamp_base_learning_contract_events.4027.a.tt: "Nó #EMP đúng là#! một tác phẩm đáng giá."
  laamp_base_learning_contract_events.4027.a.success.tt: "$laamp_base_learning_contract_events.4017.a.success.tt$"
  laamp_base_learning_contract_events.4027.a.failure.tt: "$laamp_base_learning_contract_events.4017.a.failure.tt$"
  laamp_base_learning_contract_events.4027.b.success_critical: ""Thêm một kỳ quan nữa cho thế gian.""
  laamp_base_learning_contract_events.4027.b.success_standard: ""Ta sống là để phụng sự.""
  laamp_base_learning_contract_events.4027.b.success_qualified: ""Ừ thì, ta #EMP quả là#! hơi vội vàng.""
  laamp_base_learning_contract_events.4027.b.failure_standard: "$laamp_base_learning_contract_events.4005.a.failure_standard$"


