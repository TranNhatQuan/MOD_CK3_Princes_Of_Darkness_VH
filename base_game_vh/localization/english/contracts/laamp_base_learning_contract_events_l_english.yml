  laamp_base_learning_contract_events.4001.tt.current_total.sub_t3: "#TUT Ngài hiện có #V [task_contract.MakeScope.Var('score_tally').GetValue]#! trên #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! điểm, hướng tới một #P Thành công Xuất sắc#! #WEAK (hiện tại Ngài đã đạt Thành công)#!#!#!"
