  laamp_base_4100_contract: "Làm gia sư cho con của quân chủ"
  laamp_base_4100_contract_contract: "$laamp_base_4100_contract$"
  laamp_base_4100_desc_title: "Tìm kiếm học giả uyên bác,"
  laamp_base_4100_desc: "Những bậc học giả được [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] của [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] mời gọi nhằm hỗ trợ việc giáo dục con trẻ đang sinh sống tại triều đình của [TaskContract.GetEmployer.GetHerHis]. Thành tích xuất sắc sẽ được ghi nhận."
  laamp_base_4100_request: "[task_contract|E] này yêu cầu Ngài vượt qua #BOLD 3#! thử thách [skill|E] để giáo dục đứa trẻ được chỉ định."

