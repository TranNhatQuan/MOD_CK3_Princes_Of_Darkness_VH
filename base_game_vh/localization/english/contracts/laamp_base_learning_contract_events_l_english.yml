 #Go Big or Go Home
  laamp_base_learning_contract_events.4110.t: "$laamp_base_learning_contract_events_prefix.4100$: Nỗ lực cuối cùng"
  laamp_base_learning_contract_events.4110.desc: "Ta nhận ra thất bại đang cận kề khi ánh mắt của [child_to_educate.GetFirstNamePossessive] lại bắt đầu lang thang vào hư không.\n\nKhông hiểu sao đứa trẻ lại #EMP hoàn toàn không tiếp thu#!... Ta siết chặt nắm tay và hít sâu vài hơi. Có lẽ Ta đang tiếp cận sai hướng?\n\nThời gian của chúng Ta sắp cạn, và Ta cần phải thực hiện một nỗ lực #EMP cuối cùng#! để truyền dạy cho đứa trẻ #EMP điều gì đó#! thực sự có giá trị."
  laamp_base_learning_contract_events.4110.a: "\"Này, [child_to_educate.Custom('ChildPetName')], con đã từng trải nghiệm về... chưa?\""
  laamp_base_learning_contract_events.4110.b: "\"Con có biết từ [alternative_language_culture.GetLanguage.GetNameNoTooltip] để chỉ #EMP ghèn#! là gì không?\""
  laamp_base_learning_contract_events.4110.b.tt: "Ngài không biết nhiều hơn [child_to_educate.GetShortUIName] thêm một [language|E] nào"
  laamp_base_learning_contract_events.4110.c: "Thôi. [child_to_educate.GetSheHe|U] hết cứu rồi."
  laamp_base_learning_contract_events.4110.c.tt: "@alert_icon! #alert_trial [task_contract|E] sắp thất bại#!"
 #Conclusion
  laamp_base_learning_contract_events.4120.t: "$laamp_base_learning_contract_events_prefix.4100$: Khảo hạch"
  laamp_base_learning_contract_events.4120.desc.success: "[employer.GetTitledFirstName] mang vẻ mặt khó đoán, thoáng chút hài lòng:\n\n\"Phải nói là cách giáo dục của ngươi khá khác thường, và [child_to_educate.GetFirstName] quả thực đã tiếp nhận được một vài góc nhìn mới mẻ... Ta có thể sẽ liên lạc lại nếu cần đến dịch vụ của ngươi trong tương lai.\"\n\nTa gật đầu và cúi nhẹ, rồi quay người rời đi."
  laamp_base_learning_contract_events.4120.desc.success_critical: "[employer.GetTitledFirstName] cố gắng kìm nén sự phấn khích của [employer.GetHerHis]:\n\n\"Tuyệt vời! Những phương pháp khác thường của ngươi dường như đã đạt được thành công ngoài mong đợi! Tiểu [child_to_educate.GetFirstName] giờ đây đã bắt đầu thể hiện những dấu hiệu của tư duy và ý tưởng sâu sắc hơn!\"\n\n\"Góc độ tấn công, phép tắc xã giao, kinh tế học... thật tuyệt vời! Cảm ơn ngươi, và #EMP nhất định#! hãy cho ta biết lần tới khi ngươi đi ngang qua khu vực này!\" [employer.GetTitleAsNameNoTooltip] thốt lên và phấn khích ra hiệu.\n\nMột nụ cười thoáng qua hiện trên môi ta khi ta gật đầu."
  laamp_base_learning_contract_events.4120.desc.failure: "[employer.GetTitledFirstName] lắc đầu đầy hoài nghi:\n\n\"Ta sẽ không nói dối; ta đã mong đợi nhiều hơn từ ngươi. Đây là một màn dạy dỗ đáng thương — để [child_to_educate.GetFirstName] tự do lang thang ngoài hoang dã còn #EMP có tính giáo dục hơn#!. Giờ thì hãy biến đi và đừng bao giờ làm vấy bẩn ngưỡng cửa của ta nữa.\"\n\nTa cảm nhận sự xấu hổ vì nhiệm vụ thất bại bùng lên trên má khi ta quay người rời đi."
  laamp_base_learning_contract_events.4120.a.success_standard: "\"Đa tạ.\""
  laamp_base_learning_contract_events.4120.a.success_critical: "\"Tất cả là nhờ [child_to_educate.GetHerHim].\""
  laamp_base_learning_contract_events.4120.a.failure_standard: "Đứa trẻ này vô vọng... hay là chính ta?"
 
