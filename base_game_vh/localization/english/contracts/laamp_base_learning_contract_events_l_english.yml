  laamp_base_learning_contract_events.4015.tt.no_progress: "$laamp_base_learning_contract_events.4001.tt.no_progress$"

  laamp_base_learning_contract_events.4015.t: "$laamp_base_learning_contract_events_prefix.4011$: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
  laamp_base_learning_contract_events.4015.desc.surroundings.alley: "Ta bắt gặp [challenge_character.GetTitledFirstName] trong một con hẻm tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], khi đang tiến về nơi ở của [challenge_character.GetHerHis]. [challenge_character.GetSheHe|U] nheo mắt và bắt đầu tiến lại gần khi ta đến."
  laamp_base_learning_contract_events.4015.desc.surroundings.market: "Ở một góc chợ, ta thấy [challenge_character.GetTitledFirstName] đang chăm chú xem xét một món [challenge_character.Custom('GetTradeGoods')] do một thương nhân địa phương rao bán. [challenge_character.GetSheHe|U] ngẩng lên khi ta tiến lại."
  laamp_base_learning_contract_events.4015.desc.surroundings.outdoors_temple: "Một làn gió nhẹ đón chào ta khi bước vào khuôn viên linh thiêng của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. [challenge_character.GetTitledFirstName] đang thong thả đi phía trước, rồi chậm lại và quay về phía ta."
  laamp_base_learning_contract_events.4015.desc.surroundings.temple: "[challenge_character.GetTitledFirstName] vừa rời khỏi [challenge_character.GetFaith.HouseOfWorship] khi ta đến. [challenge_character.GetSheHe|U] nghiêng đầu khi [challenge_character.GetSheHe] nhận thấy ta đang tiến về phía [challenge_character.GetHerHim]."
  laamp_base_learning_contract_events.4015.desc.surroundings.study: "Khi ta đến nơi, ta thấy [challenge_character.GetTitledFirstName] đang chăm chú vào một tấm bản đồ trong phòng làm việc của [challenge_character.GetHerHis]. Không ngẩng đầu lên, [challenge_character.GetSheHe] khẽ gầm gừ, biểu thị rằng đã nhận ra sự hiện diện của ta."
  laamp_base_learning_contract_events.4015.desc.surroundings.physician: "Ta gặp [challenge_character.GetTitledFirstName] tại phòng của thầy thuốc, đang trò chuyện cùng hai thành viên thuộc [challenge_character.GetHerHis] [challenge_character.GetFaith.AltPriestTermPlural]. Cả ba lập tức im lặng khi ta đến gần, nhìn ta với vẻ tò mò."
  laamp_base_learning_contract_events.4015.desc.surroundings.council_chamber: "Khi ta đến, [challenge_character.GetTitledFirstName] đang ở phòng hội đồng, trầm tư nhìn ra ngoài cửa sổ. [challenge_character.GetSheHe|U] chậm rãi quay lại khi nghe thấy bước chân ta."
  laamp_base_learning_contract_events.4015.desc.surroundings.corridor: "Khi ta đến, [challenge_character.GetTitledFirstName] đang suy tư bước dọc một trong những hành lang dài. [challenge_character.GetSheHe|U] quay lại nhìn ta khi ta tiến tới."
  laamp_base_learning_contract_events.4015.desc.surroundings.relaxing_room: "[challenge_character.GetTitledFirstName] đang thoải mái ngả lưng trên một chiếc ghế đệm khi ta bước vào phòng nghỉ ngơi. [challenge_character.GetSheHe|U] ngẩng đầu lên khi ta tiến lại gần."
  laamp_base_learning_contract_events.4015.desc.local_mood.disapproval: "\"[employer.GetSheHe|U] vốn luôn hơi cứng đầu về vấn đề đó,\" [challenge_character.GetSheHe] thừa nhận khi ta giải thích lý do chuyến thăm. \"Ta chắc chắn không đồng tình với quan điểm của [employer.GetHerHis], và có lẽ cũng sẽ không bao giờ.\""
  laamp_base_learning_contract_events.4015.desc.local_mood.anger: "\"Ngươi đến đây, làm gián đoạn ta, chỉ vì #EMP chuyện đó#! sao? Một [employer.GetTitleAsName] nhỏ nhen như vậy, thật không thể tin được!\" [challenge_character.GetSheHe|U] siết chặt nắm đấm, hít thở sâu vài lần và cố gắng bình tĩnh lại. \"Không có điều gì ngươi có thể nói khiến ta đồng ý với tên #EMP [employer.Custom2('InsultNounClumsy', SCOPE.sC('challenge_character'))]#! đó!!\""
  laamp_base_learning_contract_events.4015.desc.local_mood.admiration: "\"Ta lấy làm tiếc vì [employer.GetSheHe] nghĩ như vậy. Nhưng lòng trung thành của ta trước hết thuộc về [challenge_character.GetFaith.GetNameNoTooltip]. E rằng ngươi không thể làm được nhiều điều ở đây,\" [challenge_character.GetSheHe] nói với vẻ áy náy."
  laamp_base_learning_contract_events.4015.desc.local_mood.indifferent: "\"Cái gì từ ai cơ? Ờ. Được thôi. Ta đoán là có thể nói chuyện một chút. Nhưng chắc cũng chẳng thay đổi gì đâu. Dù sao thì, nếu điều đó khiến ngươi cảm thấy dễ chịu hơn.\""
  laamp_base_learning_contract_events.4015.desc.local_mood.indifferent.02: "[challenge_character.GetHerHis|U] mở to mắt và chớp vài lần trước khi [challenge_character.GetSheHe] nhận ra ý của ta: \"Ta hiểu rồi. Thật đáng tiếc khi [employer.GetSheHe] lại cảm thấy như vậy, nhưng có lẽ chúng ta chỉ đành đồng ý rằng mình không đồng ý với nhau,\" [challenge_character.GetSheHe] cau mày."
  laamp_base_learning_contract_events.4015.desc.local_mood.thinking: "\"Ồ? Bất đồng nho nhỏ đó sao? Ta cũng không nghĩ nhiều lắm, nhưng nếu ngươi có thêm lập luận, cứ tự nhiên.\" [challenge_character.GetSheHe|U] nhún vai: \"Ta không có ý làm [employer.GetHerHim] tức giận, dù rằng chúng ta không nhất thiết đồng quan điểm.\""
  laamp_base_learning_contract_events.4015.desc.outro: "Ta khẽ ngâm nga đồng tình, cẩn trọng vạch ra con đường tốt nhất phía trước."
  laamp_base_learning_contract_events.4015.desc.outro_priest.intro: "Bên phải ta, vị linh mục trại của ta là [camp_priest.GetFirstName]"
  laamp_base_learning_contract_events.4015.desc.outro_priest: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ khẽ ngâm nga và gật đầu, âm thầm chuẩn bị những tín điều tinh thần của [camp_priest.GetHerHis]."
  laamp_base_learning_contract_events.4015.desc.outro_priest.wary: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ bắt đầu trông có phần mệt mỏi, khi đôi mắt [camp_priest.GetHerHis] nheo lại trong lúc cân nhắc các lập luận phản biện."
  laamp_base_learning_contract_events.4015.desc.outro_priest.exhausted: "$laamp_base_learning_contract_events.4015.desc.outro_priest.intro$ trông rõ ràng là tiều tụy, thỉnh thoảng ánh mắt lạc vào hư không. Ta nhẹ nhàng đặt tay lên vai [camp_priest.GetHerHis]."

  laamp_base_learning_contract_events.4015.a: "\"Hãy để ta chia sẻ cách hiểu của mình.\""
  laamp_base_learning_contract_events.4015.a.success.tt: "Ngài thuyết phục được [challenge_character.GetShortUIName]"
  laamp_base_learning_contract_events.4015.a.success.t: "[challenge_character.GetShortUIName] Đổi Ý"
  laamp_base_learning_contract_events.4015.a.failure.tt: "[challenge_character.GetShortUIName] vẫn tiếp tục bất đồng"
  laamp_base_learning_contract_events.4015.a.failure.t: "[challenge_character.GetShortUIName] Vẫn Không Bị Thuyết Phục"
  laamp_base_learning_contract_events.4015.b: "\"Hãy cùng tranh luận!\""
  laamp_base_learning_contract_events.4015.b.success.tt: "Ngài có một cuộc trao đổi hiệu quả về [challenge_character.GetFaith.GetName]"
  laamp_base_learning_contract_events.4015.b.success.t: "$laamp_base_learning_contract_events.4015.a.success.t$"
  laamp_base_learning_contract_events.4015.b.failure.tt: "Không thể lay chuyển được [challenge_character.GetShortUIName]"
  laamp_base_learning_contract_events.4015.b.failure.t: "$laamp_base_learning_contract_events.4015.a.failure.t$"
  laamp_base_learning_contract_events.4015.c: "\"Theo #EMP kinh nghiệm#! của ta...\""
  laamp_base_learning_contract_events.4015.d: "\"Thánh nhân [camp_priest.GetFirstNameNoTooltip], bằng hữu, #EMP ngài#! nghĩ sao?\""
  laamp_base_learning_contract_events.4015.d.success.tt: "[camp_priest.GetShortUIName] thuyết phục được [challenge_character.GetShortUIName]"
  laamp_base_learning_contract_events.4015.d.success.t: "$laamp_base_learning_contract_events.4015.a.success.t$"
  laamp_base_learning_contract_events.4015.d.failure.tt: "[challenge_character.GetShortUIName] sẽ không từ bỏ những niềm tin của [challenge_character.GetHerHis]."
  laamp_base_learning_contract_events.4015.d.failure.t: "$laamp_base_learning_contract_events.4015.a.failure.t$"
  laamp_base_learning_contract_events.4015.e: "Ta sẽ không nương tay khi thuyết phục [challenge_character.GetHerHim]."
  laamp_base_learning_contract_events.4015.e.flavor: "Nếu một số lập luận bị xem là gây tranh cãi thì... đành vậy."
 #Conclusion
  laamp_base_learning_contract_events.4017.t: "$laamp_base_learning_contract_events_prefix.4011$: Kết Cục"
  laamp_base_learning_contract_events.4017.desc.success.critical: "[employer.GetTitledFirstName] gần như nhảy múa khi ta trở lại: \"#EMP Tuyệt vời!#! Những con chiên lạc đã quay về đàn; tất cả. Kể cả kẻ phiền phức kia, [mentioned_disputee.GetFirstName]...\"\n\n[employer.GetSheHe|U] quay lại nhấc một túi tiền nặng trĩu và lập tức trao cho ta: \"Ngươi xứng đáng với từng đồng. Cảm tạ ngươi, và nếu con đường của ngươi một lần nữa đưa ngươi tới [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], hãy cho ta hay!\"\n\nTa mỉm cười và gật đầu."
  laamp_base_learning_contract_events.4017.desc.success.standard: "[employer.GetTitledFirstName] gật đầu đầy vẻ thông thái và mím môi: \"Làm tốt lắm. Hầu hết bọn họ đã gửi thư cho ta liên quan đến những tranh chấp của chúng ta, thừa nhận rằng ta mới là người đúng trong chuyện này.\"\n\n[employer.GetSheHe|U] do dự một lúc, rồi nói thêm: \"Ta không nghi ngờ gì rằng những người còn lại rồi cũng sẽ thay đổi suy nghĩ. Dù sao thì ta #EMP mới#! là người đúng.\"\n\nTa lịch sự gật đầu và quay người rời đi."
  laamp_base_learning_contract_events.4017.desc.success.qualified: "[employer.GetTitledFirstName] cau mày khi ta quay trở lại [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]: \"Hmm. Điều này có thể chấp nhận được, mặc dù ta đã kỳ vọng nhiều hơn một chút.\"\n\n[employer.GetSheHe|U] quay người lại, lẩm bẩm với chính mình: \"Có lẽ người tiếp theo sẽ làm tốt hơn...\"\n\nNhận ra ta vẫn còn ở đó, [employer.GetSheHe] ra hiệu về phía một chiếc túi nhỏ bên cạnh cửa: \"Được rồi, cứ tự nhiên lấy đi. Ta tin rằng ngươi sẽ tự tìm được đường ra.\""
  laamp_base_learning_contract_events.4017.desc.failure: "[employer.GetTitledFirstName] cười khinh khi ta bước vào phòng: \"Ồ, ngươi còn phiền quay lại sao? Sau màn thể hiện tệ hại như vậy à?\"\n\n[employer.GetSheHe|U] lắc đầu đầy khinh miệt: \"Ngươi thậm chí có biết điều cơ bản nhất về [employer.GetFaith.GetNameNoTooltip] không? Thật may là nó chẳng hề đề cập đến việc phải đối phó với #EMP những kẻ ngu ngốc#!.\"\n\n[employer.GetSheHe|U] quay người rời đi, còn ta đứng lại một lúc trước khi lang thang qua những hành lang, tìm kiếm lối ra."
  laamp_base_learning_contract_events.4017.a: "\"Hãy nghĩ thế này: ta đã gieo những hạt mầm nghi ngờ.\""
  laamp_base_learning_contract_events.4017.a.tt: "Rồi họ sẽ quay về với giáo lý. Ta #EMP biết#! điều đó."
  laamp_base_learning_contract_events.4017.a.success.tt: "[employer.GetShortUIName] bị lay chuyển"
  laamp_base_learning_contract_events.4017.a.failure.tt: "Ngài không thể thuyết phục được [employer.GetShortUIName]"
  laamp_base_learning_contract_events.4017.b.success_critical: "\"[employer.GetFaith.HighGodNameAlternate] đã dẫn lối cho ta.\""
  laamp_base_learning_contract_events.4017.b.success_standard: "\"Chỉ cần một cú hích nho nhỏ.\""
  laamp_base_learning_contract_events.4017.b.success_qualified: "\"Ta tin chắc họ rồi sẽ thông suốt.\""
  laamp_base_learning_contract_events.4017.b.failure_standard: "$laamp_base_learning_contract_events.4005.a.failure_standard$"

 #Create a work of learning for a ruler
  laamp_base_4021_request: "Nhiệm vụ [task_contract|E] này yêu cầu Ngài sáng tác một bản thảo dành cho [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] của [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier], chủ yếu thông qua các thử thách [learning|E] [skill|E], nhưng cũng có thể bao gồm các thử thách thuộc những [skills|E] liên quan khác, [lifestyle_traits|E] và kinh nghiệm [travel|E]."
  laamp_base_learning_contract_events_prefix.4021: "Bản Thảo"
  laamp_base_learning_contract_events.4021.t: "$laamp_base_learning_contract_events_prefix.4021$: Giá Trị Của Một Tác Phẩm"
  laamp_base_learning_contract_events.4021.desc: "Ta khẽ ngâm nga khi quan sát quanh thư phòng của [employer.GetTitledFirstNamePossessive]. Rất nhiều bản chép tay, bản thảo và truyện ngắn được xếp gọn gàng thành từng chồng trên kệ.\n\nMột tác phẩm chắc hẳn không chỉ được đánh giá qua độ dài? Ngay cả một từ đơn lẻ cũng có thể gợi lên những cảm xúc phức tạp.\n\nNhưng trước hết: ta có thể viết được một tác phẩm cỡ nào?"
  laamp_base_learning_contract_events.4021.a: "Tốt hơn là giữ mọi thứ đơn giản."
  laamp_base_learning_contract_events.4021.a.tt: "Chọn #V 3#! chương"
  laamp_base_learning_contract_events.4021.b: "Tác phẩm của ta sẽ #EMP toàn diện#!."
  laamp_base_learning_contract_events.4021.b.tt: "Nhắm tới #V 5#! chương\n$EFFECT_LIST_BULLET$Tăng cơ hội nhận thêm một điểm [skill|E] ở chương cuối"
  laamp_base_learning_contract_events.4021.tt.chapter_explanation: "#TUT Với nhiều chương hơn, Ngài sẽ phải đối mặt với nhiều thử thách hơn. Phần thưởng sẽ cộng dồn, nhưng độ khó cũng vậy.#!"
  laamp_base_learning_contract_events.4021.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành một thử thách [learning|E], một thử thách kết hợp ở một [skill|E] liên quan khác, hoặc tận dụng kinh nghiệm [traveling|E]\n$EFFECT_LIST_BULLET$Thắng một phần ba số thử thách để đạt #P Thành công Hạn chế#!\n$EFFECT_LIST_BULLET$Thắng hai phần ba số thử thách để đạt #P Thành công#!\n$EFFECT_LIST_BULLET$Thắng toàn bộ số thử thách để đạt #P Thành công Xuất sắc#!#!"

  laamp_base_learning_contract_events.4025.t.first: "$laamp_base_learning_contract_events_prefix.4021$: Khởi Đầu Khiêm Tốn"
  laamp_base_learning_contract_events.4025.t.last: "$laamp_base_learning_contract_events_prefix.4021$: Chương Cuối"
  laamp_base_learning_contract_events.4025.t: "$laamp_base_learning_contract_events_prefix.4021$: Chương Tiếp Theo"
 #Intro
  laamp_base_learning_contract_events.4025.desc.intro.first: "Ta cúi nhìn trang giấy trắng trước mặt. #EMP Từ ngữ.#! Sao lúc nào bắt đầu cũng khó đến vậy?"
  laamp_base_learning_contract_events.4025.desc.intro.final_shot: "Lau giọt mồ hôi trên trán, tâm trí ta vẫn quay cuồng. Tác phẩm sắp hoàn thành rồi — nhưng ta làm đến đâu? Thứ này có đủ ra hồn không? "
  laamp_base_learning_contract_events.4025.desc.intro.last: "Đọc lại những nét bút nguệch ngoạc của mình, ta khẽ khịt mũi đầy hài lòng. Liên quan và súc tích. Chừng này chắc chắn có thể làm [employer.GetTitledFirstName] hài lòng chứ?"
  laamp_base_learning_contract_events.4025.desc.intro.inspiration: "Bỗng một ý nghĩ lóe lên trong đầu. [SCOPE.Custom('GetInspirationTopic')|U]. Cũng đâu có khó đến thế, nhỉ? Càng nghĩ, ta càng thấy hứng khởi muốn chia sẻ hiểu biết của mình về chủ đề này."
  laamp_base_learning_contract_events.4025.desc.intro.01: "Một lúc sau, khi đã vào guồng, ta nhận ra mình viết không ngừng nghỉ, hết trang này đến trang khác, ghi lại những suy nghĩ và quan sát liên quan đến [SCOPE.Custom('GetLatestTopic')]."
  laamp_base_learning_contract_events.4025.desc.intro.02: "Khi ngồi viết, ta thưởng thức tiếng chim hót du dương, vọng vào từ khu vườn tuyệt mỹ của [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  laamp_base_learning_contract_events.4025.desc.intro.03: "Thời gian trôi nhanh khi ta ngồi bên bục viết, ghi chép tỉ mỉ những quan sát và góc nhìn của mình về [SCOPE.Custom('GetLatestTopic')]."
 #Mid
  laamp_base_learning_contract_events.4025.desc.first: "Cây [ROOT.Char.Custom('WritingInstrument')] khẽ chạm vào cằm, ta cẩn trọng suy nghĩ xem bản thảo này nên xoay quanh điều gì."
  laamp_base_learning_contract_events.4025.desc.final_shot: "Ánh sáng ban ngày nhạt dần bên ngoài khi ta ngồi dưới ánh nến, cảm thấy cái lạnh len lỏi và chỉ còn lại những suy nghĩ về sự kém cỏi của bản thân. Ngay cả những miếng thức ăn được mang tới thường xuyên cũng chẳng thể cải thiện tâm trạng."
  laamp_base_learning_contract_events.4025.desc.last: "Những chiếc đĩa cứ chồng lên nhau khi ta tận hưởng chút hiếu khách cuối cùng, giờ đây khi công việc sắp kết thúc. Hay là đám hầu cận keo kiệt hơn với đồ ăn rồi, hay ta chỉ đang tưởng tượng...?"
  laamp_base_learning_contract_events.4025.desc.01: "Ánh sáng bên ngoài nhạt dần và ta ngồi dưới ánh nến trong thư phòng của [employer.GetTitledFirstNamePossessive], tận hưởng sự tiếp đãi dành cho một thư lại đang làm việc."
  laamp_base_learning_contract_events.4025.desc.02: "Thỉnh thoảng, người hầu ghé qua, lặng lẽ dọn dẹp căn phòng hoặc mang đến vài món ăn nhẹ; luôn hết sức cẩn trọng để giữ im lặng và khẽ khàng khép cửa khi rời đi."
  laamp_base_learning_contract_events.4025.desc.03: "Thỉnh thoảng, khi không phải ra ngoài xử lý công việc, [employer.GetTitledFirstName] lại ghé đầu vào phòng học, nhìn qua những trang ghi chép tiến độ đầy vết mực lem nhem của ta. [employer.GetSheHe|U] khẽ ngân nga một tiếng rồi rời đi, dường như còn bận rộn với những việc quan trọng hơn."
 #Outro
  laamp_base_learning_contract_events.4025.desc.outro.first.has_topic: "[employer.GetTitledFirstName] muốn một bản kinh văn liên quan đến [SCOPE.Custom('GetPreferedTopic')]. Một điểm hợp lý để ta cân nhắc. Giờ thì, ta nên bắt đầu từ đâu đây..."
  laamp_base_learning_contract_events.4025.desc.outro.first.no_topic: "Để ánh mắt một lần nữa lướt quanh căn phòng, ta lục lọi trong đầu những chủ đề thích hợp để mở đầu chương sách..."
  laamp_base_learning_contract_events.4025.desc.outro.final_shot: "Ta suy ngẫm một lát, rồi hơi ưỡn lưng lên. Ta có hai lựa chọn — thừa nhận những thiếu sót của mình, hoặc — ta phồng ngực — thực hiện một nỗ lực #EMP đúng nghĩa#! cuối cùng!"
  laamp_base_learning_contract_events.4025.desc.outro.01: "Nhận thức được điều đó, ta chuyển sang câu hỏi then chốt hơn: liệu có nên tiếp tục viết về [SCOPE.Custom('GetLatestTopic')] hay sẽ khôn ngoan hơn nếu đa dạng hóa nội dung..."
  laamp_base_learning_contract_events.4025.desc.outro.02: "Ta suy xét điều này, đồng thời cân nhắc xem chương tiếp theo nên nói về điều gì..."
  laamp_base_learning_contract_events.4025.desc.outro.03: "Ý nghĩ còn vương vấn trong đầu, ta quay lại với trang giấy — liệu [SCOPE.Custom('GetLatestTopic')] vẫn còn thích hợp để tiếp tục viết chăng...?"

  laamp_base_learning_contract_events.4025.a: "Ta sẽ làm họ choáng ngợp bằng trí tuệ của mình!"
  laamp_base_learning_contract_events.4025.a.second: "Thêm chút lanh lợi nữa cũng chẳng hại gì."
  laamp_base_learning_contract_events.4025.b: "Một đoạn về kỹ năng xã hội sẽ rất hữu ích."
  laamp_base_learning_contract_events.4025.b.second: "Thêm một luận điểm về ngoại giao thì tốt."
  laamp_base_learning_contract_events.4025.c: "Kiến thức quân sự của ta chắc chắn áp dụng được."
  laamp_base_learning_contract_events.4025.c.second: "Có lẽ thêm một mục về các vị chỉ huy?"
  laamp_base_learning_contract_events.4025.d: "S là cho quản lý. Chủ đề tủ của ta."
  laamp_base_learning_contract_events.4025.d.second: "Lần này, hãy bàn đến hiệu suất."
  laamp_base_learning_contract_events.4025.e: "Một luận thuyết về mưu mẹo, tiện đường vậy."
  laamp_base_learning_contract_events.4025.e.second: "Thêm một chương về sự kín kẽ, có lẽ."
  laamp_base_learning_contract_events.4025.f: "Ta có không ít câu chuyện du hành để kể."
  laamp_base_learning_contract_events.4025.f.second: "Thêm một lượt giai thoại đường xa cũng được."
  laamp_base_learning_contract_events.4025.g: "Hành hương. Có gì #EMP thiêng liêng#! hơn thế?"
  laamp_base_learning_contract_events.4025.g.second: "Chúng ta có bao giờ thực sự xong với hành hương không?"
  laamp_base_learning_contract_events.4025.h: "Những #EMP kỳ quan#! ta từng thấy. Ta sẽ viết về chúng."
  laamp_base_learning_contract_events.4025.h.second: "Còn nhiều kỳ quan nữa để viết lắm!"
  laamp_base_learning_contract_events.4025.i: "Thôi thì cúi đầu làm tiếp vậy."
  laamp_base_learning_contract_events.4025.i.second: "Thêm một lần cúi đầu nữa."
  laamp_base_learning_contract_events.4025.i.flavor: "Đầu óc ta đau như búa bổ..."
  laamp_base_learning_contract_events.4025.j: "Một cú dốc sức #EMP cuối cùng#!..."
  laamp_base_learning_contract_events.4025.k: "Không. Không đáng."
 
  laamp_base_learning_contract_events.4025.success.tt: "Chương sách được viết rất tốt"
  laamp_base_learning_contract_events.4025.success.t: "Chương Tuyệt Vời"
  laamp_base_learning_contract_events.4025.failure.tt: "Ngài làm hỏng chương sách"
  laamp_base_learning_contract_events.4025.failure.t: "Chương Kém Chất Lượng"

