  laamp_base_learning_contract_events.4001.success.tt.embellishment: "Phần trang trí được hoàn thiện hoàn hảo"
  laamp_base_learning_contract_events.4001.success.tt: "Bản sao chép được hoàn thành tốt"
  laamp_base_learning_contract_events.4001.failure.tt: "Đoạn văn bị sao chép kém và Ngài buộc phải loại bỏ nó"
  laamp_base_learning_contract_events.4001.success.t: "Sao chép thành công"
  laamp_base_learning_contract_events.4001.failure.t: "Sao chép bị loại bỏ"

  laamp_base_learning_contract_events.4001.t: "$laamp_base_learning_contract_events_prefix.4001$: Nước rút cuối cùng"
  laamp_base_learning_contract_events.4001.t.diplomacy: "$laamp_base_learning_contract_events_prefix.4001$: Phòng kín nội tâm"
  laamp_base_learning_contract_events.4001.t.martial: "$laamp_base_learning_contract_events_prefix.4001$: Hòa bình qua chiến tranh"
  laamp_base_learning_contract_events.4001.t.stewardship: "$laamp_base_learning_contract_events_prefix.4001$: Khi vàng lên tiếng"
  laamp_base_learning_contract_events.4001.t.intrigue: "$laamp_base_learning_contract_events_prefix.4001$: Mọi cái lưỡi đều câm lặng"
  laamp_base_learning_contract_events.4001.t.learning: "$laamp_base_learning_contract_events_prefix.4001$: Lời thiêng liêng"
  laamp_base_learning_contract_events.4001.desc.01: "Ánh ngày dần tắt khi ta ngồi trong phòng của [employer.GetTitledFirstNamePossessive], dưới ánh nến, cuống cuồng chép lại những nét mực ngoằn ngoèo từ tờ này sang tờ khác.\n\nMi mắt ta bắt đầu trĩu xuống, ta gật gù trong khoảnh khắc rồi giật mình tỉnh lại. Theo như ta hiểu, đoạn văn này dường như liên quan đến [SCOPE.Custom('GetScriptTopic')] — nhưng nhân danh #EMP [ROOT.Char.GetFaith.HighGodName]#!, sao nó lại #EMP lê thê đến thế#!."
  laamp_base_learning_contract_events.4001.desc.02: "Vài ngày đã trôi qua, và ta đang dần tiến đến cuối bản sao chép. Tuy nhiên, đoạn hiện tại thì khô khan chẳng khác gì sỏi đá phơi dưới nắng...\n\nTâm trí ta bắt đầu trôi dạt sang chuyện khác, và ta phải chớp mắt vài lần để tự kéo mình trở lại thực tại. Đại ý của đoạn văn có vẻ liên quan đến [SCOPE.Custom('GetScriptTopic')], vốn tự thân nó cũng không hẳn là nhàm chán."
  laamp_base_learning_contract_events.4001.desc.03: "Ta đang tiến gần đến phần cuối của bản sao chép, cho đến giờ vẫn diễn ra [SCOPE.Custom('GetScoreAdjective')]. Một lần nữa, người chép bản thảo này lại chọn cách tiếp cận #EMP tẻ nhạt#! nhất có thể đối với chủ đề.\n\nÁnh mắt ta dán vào người hầu — một cảnh tượng thú vị hơn vô hạn — cho đến khi [attendant.GetSheHe] nhìn ta đầy ngờ vực, buộc ta quay lại với văn bản. Bản thân đoạn văn dường như liên quan đến [SCOPE.Custom('GetScriptTopic')], đủ sức hấp dẫn độc giả — nếu nó bớt cứng nhắc hơn."
  laamp_base_learning_contract_events.4001.desc.final_shot: "Những trang viết dở dang; vết mực loang lổ; lông ngỗng #EMP vương vãi khắp nơi#!. Ta xoa thái dương khi nghĩ đến mớ hỗn độn mà bản sao chép thất bại của mình gây ra.\n\nÁnh mắt của người hầu [employer.GetTitledFirstNamePossessive] như đốt cháy lưng ta, khi ta sợ hãi phải quay lại đối mặt với thất bại cận kề.\n\nNhưng rồi, khi quan sát [ROOT.Char.Custom('GetMarginalia')] được phác thảo bên lề trang, ta thẳng lưng lên trong một cơn bướng bỉnh đột ngột: #EMP Thất bại ư?#! Ta chỉ cần lao nhanh qua mấy trang cuối cùng này thôi!"
  laamp_base_learning_contract_events.4001.outro.01: "\n\nTa lần ngón tay lấm mực theo [ROOT.Char.Custom('GetMarginalia')] ở phần lề. Có lẽ ta nên cải biên văn bản một chút, để nó hấp dẫn hơn?"
  laamp_base_learning_contract_events.4001.outro.02: "\n\nTa hờ hững quan sát [ROOT.Char.Custom('GetMarginalia')] được nguệch ngoạc bên lề, trong khi cân nhắc tình thế."
  laamp_base_learning_contract_events.4001.outro.03: "\n\nTa suy xét con đường tốt nhất phía trước, vừa ngắm nhìn phần chú thích bên lề của [ROOT.Char.Custom('GetMarginalia')]."
  laamp_base_learning_contract_events.4001.outro.secret: "\n\nTrong lúc suy nghĩ, ta để ý thấy một nét bút khác nhắc đến [employer.GetTitleAsNameNoTooltip] ở phần lề — giá như ta có thời gian để giải nghĩa nó..."
  laamp_base_learning_contract_events.4001.a: "Hay là ta thêm thắt chút xíu nhỉ..."
  laamp_base_learning_contract_events.4001.b: "Ta có thể lấy cảm hứng từ chính trải nghiệm của mình!"
  laamp_base_learning_contract_events.4001.b.unavailable: "Giá như ta có nhiều kinh nghiệm hơn về chủ đề này."
  laamp_base_learning_contract_events.4001.b.tt.unavailable: "Ngài không có [lifestyle_traits|E] phù hợp nào cho đoạn văn này"
  laamp_base_learning_contract_events.4001.b.tt.used: "Ngài đã sử dụng [lifestyle_trait|E] này cho bản sao chép rồi"
  laamp_base_learning_contract_events.4001.b.flavor.unlearned: "Nhưng ta sẽ triển khai nó thế nào đây..."
  laamp_base_learning_contract_events.4001.c: "Hmm... ta nhận ra sự tương đồng với [additional_language_culture.GetLanguage.GetNameNoTooltip]"
  laamp_base_learning_contract_events.4001.c.tt.used: "Ngài đã vận dụng kiến thức [language|E] của mình cho bản sao chép này rồi"
  laamp_base_learning_contract_events.4001.c.unavailable: "Giá như ta uyên bác hơn."
  laamp_base_learning_contract_events.4001.c.tt.unavailable: "Ngài chỉ biết một [language|E]"
  laamp_base_learning_contract_events.4001.d: "Cứ bám sát nguyên bản là được."
  laamp_base_learning_contract_events.4001.d.secret: "Ta sẽ dành thêm thời gian để giải nghĩa."
  laamp_base_learning_contract_events.4001.d.flavor.unlearned: "Cái nét ngoằn ngoèo kia... có nghĩa là gì nhỉ..."
  laamp_base_learning_contract_events.4001.d.flavor.unwind: "Làm ít được thì việc gì phải làm nhiều."
  laamp_base_learning_contract_events.4001.d.secret.tt: "Ngài khám phá được [secret|E] của [employer.GetShortUINamePossessive]"
  laamp_base_learning_contract_events.4001.e: "Tốt hơn là tập trung toàn lực."
  laamp_base_learning_contract_events.4001.f: "Không. Thế là hết."
  laamp_base_learning_contract_events.4001.f.tt: "$laamp_base_learning_contract_events.4110.c.tt$"
 #Conclusion
  laamp_base_learning_contract_events.4005.t: "$laamp_base_learning_contract_events_prefix.4001$: Hoàn tất"
  laamp_base_learning_contract_events.4005.desc.success.critical: "[employer.GetTitledFirstName] cố gắng kìm nén sự phấn khích của [employer.GetHerHis]:\n\n\"Tuyệt vời! Những phương pháp khác thường của ngươi dường như đã đạt được thành công ngoài mong đợi! Tiểu [child_to_educate.GetFirstName] giờ đây đã bắt đầu thể hiện những dấu hiệu của tư duy và ý tưởng sâu sắc hơn!\"\n\n\"Góc độ tấn công, phép tắc xã giao, kinh tế học... thật tuyệt vời! Cảm ơn ngươi, và #EMP nhất định#! hãy cho ta biết lần tới khi ngươi đi ngang qua khu vực này!\" [employer.GetTitleAsNameNoTooltip] thốt lên đầy hào hứng và phấn khích ra hiệu.\n\nMột nụ cười thoáng qua hiện trên môi ta khi ta gật đầu."
  laamp_base_learning_contract_events.4005.desc.success: "[employer.GetTitledFirstName] lật qua những trang sách, vẻ mặt [employer.GetHerHis] đầy thích thú: \"Quả thật, bản thảo này thú vị hơn ta nhớ rất nhiều...\n\n[employer.GetSheHe|U] đưa bản thảo cho người hầu của [employer.GetHerHis]: \"Hãy nghiên cứu thứ này và chúng ta sẽ gặp lại vào buổi tối.\"\n\nQuay sang ta, [employer.GetTitledFirstNameNoTooltip] mỉm cười trong chốc lát, đưa cho ta một túi tiền nặng: \"Làm tốt lắm. Như đã thỏa thuận, đây là phần thưởng của ngươi.\""
  laamp_base_learning_contract_events.4005.desc.success.qualified: "[employer.GetTitledFirstName] mím môi khi [employer.GetSheHe] kiểm tra bản thảo: \"Quả thật đây là một bản sao của tác phẩm gốc. Cảm ơn vì đã giao đến một cách đáng tin cậy.\"\n\n[employer.GetSheHe|U] quay người định rời đi, nhưng dừng lại trong chốc lát để nói: \"Ồ. Ngươi có thể nhận phần thưởng của mình ở cửa. Hãy tự tìm đường ra ngoài.\"\n\nTa nhìn thấy chiếc túi bên cạnh cửa khi quay người rời đi."
  laamp_base_learning_contract_events.4005.desc.failure: "[employer.GetTitledFirstName] lắc đầu:\n\n\"Cái này là sao... đây là thứ gì... chuyện này không thể chấp nhận được. Ngươi đã phá hỏng phòng làm việc của ta #EMP và#! lãng phí những nguồn lực quý giá của người chép sách.\"\n\n[employer.GetSheHe|U] nghiến răng: \"Rời đi. Ngay lập tức. Trước khi ta cảm thấy #EMP bớt#! nhân từ hơn.\"\n\nTa vội vã chạy về phía cửa."
  laamp_base_learning_contract_events.4005.a.success_critical: "\"Chỉ là công việc hằng ngày thôi.\""
  laamp_base_learning_contract_events.4005.a.success_standard: "\"Vinh hạnh thay.\""
  laamp_base_learning_contract_events.4005.a.success_qualified: "\"Một bản sao, đã giao.\""
  laamp_base_learning_contract_events.4005.a.failure_standard: "\"Đã rõ.\""

 #Help settle theological arguments
  laamp_base_4011_request: "Nhiệm vụ [task_contract|E] này yêu cầu Ngài tới các lãnh thổ của [TaskContract.GetEmployer.GetTitledFirstNamePossessive] và giải quyết một số tranh chấp thần học địa phương, thông qua các thử thách [learning|E] [skill|E], [piety_level|E], các [traits|E] tôn giáo phù hợp, hoặc bằng [piety|E] hay [stress|E]."
  laamp_base_learning_contract_events_prefix.4011: "Vấn Đề Thần Học"

  laamp_base_learning_contract_events.4011.t: "$laamp_base_learning_contract_events_prefix.4011$: Lên Đường"
  laamp_base_learning_contract_events.4011.desc: "Bình minh đã đến, và ta đã tập hợp đoàn tùy tùng để cùng ta lên đường tới nơi ở của [employer.GetTitledFirstNamePossessive] tại [employer.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nNhững con ngựa bồn chồn dịch chuyển, và ta liếc nhìn trại lần cuối trước khi xuất phát."
  laamp_base_learning_contract_events.4011.a: "Hãy mau lên đường!"
  laamp_base_learning_contract_events.4011.a.tt: "@camp_travel_short_icon! Ngài [travel|E] mà không mang theo [domicile|E]"
  laamp_base_learning_contract_events.4011.tt.destination_list.5_destinations: "Ngài lập tức bắt đầu [traveling|E] tới [employer_location_destination.GetName], rồi tới [destination_1.GetNameNoTier], rồi [destination_2.GetNameNoTier], rồi [destination_3.GetNameNoTier], rồi [destination_4.GetNameNoTier], rồi [destination_5.GetNameNoTier] và cuối cùng quay lại [employer_location_destination.GetName]"
  laamp_base_learning_contract_events.4011.tt.destination_list.4_destinations: "Ngài lập tức bắt đầu [traveling|E] tới [employer_location_destination.GetName], rồi tới [destination_1.GetNameNoTier], rồi [destination_2.GetNameNoTier], rồi [destination_3.GetNameNoTier], rồi [destination_4.GetNameNoTier] và cuối cùng quay lại [employer_location_destination.GetName]"
  laamp_base_learning_contract_events.4011.tt.destination_list.3_destinations: "Ngài lập tức bắt đầu [traveling|E] tới [employer_location_destination.GetName], rồi tới [destination_1.GetNameNoTier], rồi [destination_2.GetNameNoTier], rồi [destination_3.GetNameNoTier] và cuối cùng quay lại [employer_location_destination.GetName]"
  laamp_base_learning_contract_events.4011.tt.explanation: "#TUT Để hoàn thành [task_contract|E]:\n$EFFECT_LIST_BULLET$Hoàn thành các thử thách [learning|E], tận dụng [piety_level|E], các [fame_traits|E] tôn giáo hoặc thuyết phục người nắm giữ điểm đến bằng những biện pháp #EMP bất kính#!\n$EFFECT_LIST_BULLET$Thắng một phần ba số thử thách để đạt #P Thành công Hạn chế#!\n$EFFECT_LIST_BULLET$Thắng hai phần ba số thử thách để đạt #P Thành công#!\n$EFFECT_LIST_BULLET$Thắng toàn bộ số thử thách để đạt #P Thành công Xuất sắc#!\n\n@alert_icon! #alert_trial Việc hủy [travel|E] sẽ khiến [task_contract|E] bị vô hiệu#!#!"
 
  laamp_base_learning_contract_events.4014.t: "$laamp_base_learning_contract_events_prefix.4011$: Bàn Tay Dẫn Lối"
  laamp_base_learning_contract_events.4014.desc: ""... và đó là lúc [dummy_gender.GetSheHe] bắt đầu #EMP cười khúc khích!#\" Cơn giận dữ đầy phẫn nộ của [employer.GetTitledFirstNamePossessive] hiện rõ không thể che giấu.\n\n\"Ta đã có #EMP rất nhiều#! cuộc thảo luận thần học trong đời, và [employer.GetFaith.HighGodNameAlternate|l] biết rằng ta luôn cố gắng giữ sự kiên nhẫn. Tuy nhiên, một số thần dân của ta có lẽ cần một #EMP sự thúc đẩy thêm#! để nhìn thấy ánh sáng chân lý. Có lẽ #EMP ngươi#! có thể trở thành người dẫn dắt tinh thần đó.\"\n\n[employer.GetSheHe|U] tự gật đầu với chính mình, dường như hài lòng với giải pháp [employer.GetHerHis] đưa ra: \"Cầu xin [employer.GetFaith.HighGodName] ban phước cho những chuyến hành trình của ngươi. Giờ thì đi đi.\""
  laamp_base_learning_contract_events.4014.a: ""Ta sẽ cố hết sức.""
  laamp_base_learning_contract_events.4014.a.tt: "Bắt đầu di chuyển tới [destination_1.GetNameNoTier]"

  laamp_base_learning_contract_events.4015.tt.current_total.sub_t1: "#TUT Ngài đang có #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! trên #V [task_contract.MakeScope.Var('win_t1_threshold').GetValue]#! hướng tới #P Thành công Hạn chế#!#!"
  laamp_base_learning_contract_events.4015.tt.current_total.sub_t2: "#TUT Ngài đang có #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! trên #V [task_contract.MakeScope.Var('win_t2_threshold').GetValue]#! hướng tới #P Thành công#! #WEAK (hiện tại Ngài đã đạt Thành công Hạn chế)#!#!"
  laamp_base_learning_contract_events.4015.tt.current_total.sub_t3: "#TUT Ngài đang có #V [task_contract.MakeScope.Var('wins_tally').GetValue]#! trên #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! hướng tới #P Thành công Xuất sắc#! #WEAK (hiện tại Ngài đã đạt Thành công)#!#!"
  laamp_base_learning_contract_events.4015.tt.disputes_left: "#TUT Ngài còn #V [task_contract.MakeScope.Var('opportunities_left_tally').GetValue]#! trên #V [task_contract.MakeScope.Var('win_t3_threshold').GetValue]#! tranh chấp#!"
