  laamp_base_5021_request: "$laamp_request_boilerplate_prowess_scheme$"
  laamp_base_5031_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới nhiều [location|E], trộm gia súc tại mỗi nơi thông qua một thử thách [prowess|E]. Ngài cũng có thể kiểm tra chỉ số cao hơn giữa [martial|E] hoặc [stewardship|E], hoặc sử dụng một số [officers|E] nhất định.\n$laamp_request_boilerplate_criminal$"
  laamp_base_5041_request: "$laamp_request_boilerplate_prowess_scheme$\n$laamp_request_boilerplate_criminal$"
