  ep3_contract_event.0070.t: "$contract_event_prefix$ $laamp_join_faction_contract_contract$"
  ep3_contract_event.0070.desc: "Một toán vũ trang, dưới ngọn cờ của [task_contract_employer.GetName], ghé thăm doanh trại của ta.\n\n“Chào ngài, [ROOT.Char.GetTitledFirstNameNoTooltip]! Người ta nói rằng ngài quan tâm đến chính nghĩa của chúng Ta, vì thế chúng Ta đến để nói về kẻ thù của mình — tên [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName]. "
  ep3_contract_event.0070.desc_fallback_faction: "$ep3_contract_event.0070.desc$Cách [task_contract_target.GetSheHe] len lỏi dưới da thịt của các thần dân [task_contract_target.GetHerHis], xé nát chúng ta từ bên trong! Chúng ta muốn phơi bày [task_contract_target.GetHerHim] ra ánh sáng, cho mọi người thấy [task_contract_target.GetSheHe] thực sự là một con sâu bọ đê tiện đến mức nào!"\n\n"Tệ hơn nữa..."
  ep3_contract_event.0070.desc_liberty_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] bóp nghẹt cổ họng vương quốc; [task_contract_target.GetSheHe] siết chặt giới quý tộc bằng quyền lực tích tụ!”\n\nThật không thể chịu đựng nổi! Và…"
  ep3_contract_event.0070.desc_independence_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] là một chúa tể bất tài — không xứng đáng! #EMP Không xứng đáng!#! Thần dân chúng ta thà tự đứng một mình còn hơn.\n\nHơn nữa…"
  ep3_contract_event.0070.desc_claimant_faction: "$ep3_contract_event.0070.desc$[task_contract_target.GetSheHe|U] là kẻ cai trị bất xứng và phi pháp của [task_contract_faction.GetSpecialTitle.GetName]. Hy vọng của chúng ta đặt vào [task_contract_faction.GetSpecialCharacter.GetName]: một nhà lãnh đạo chân chính, [task_contract_faction.GetSpecialCharacter.Custom('PersonalityGetPositiveTraitDesc')] như chính [task_contract_faction.GetSpecialCharacter.GetSheHe] vốn là [task_contract_faction.GetSpecialCharacter.Custom('DescriptorPositiveStandalone')]!”\n\nVà rồi, [task_contract_target.GetTitledFirstNameNoTooltip]…"
  ep3_contract_event.0070.desc_nation_fracturing_faction: "$ep3_contract_event.0070.desc$Không chỉ [task_contract_target.GetSheHe] không xứng với vương miện, mà toàn bộ [task_contract_faction.GetSpecialTitle.GetName] đã mục ruỗng tận gốc rễ! Chúng ta tin rằng không gì có thể cứu nổi vương quốc bị nguyền rủa này.”\n\n“Con đường duy nhất là phá hủy nó và tái sinh từ tro tàn!”"
  ep3_contract_event.0070.desc_liege_taxes: "Thuế khóa của [task_contract_target.GetHerHis] vắt kiệt từng đồng xu cuối cùng của ta và dân chúng!"
  ep3_contract_event.0070.desc_liege_levies: "Lệnh trưng binh của [task_contract_target.GetHerHis] kéo sạch mọi lao động khỏi ruộng đồng của ta!"
  ep3_contract_event.0070.desc_liege_culture: "[task_contract_target.GetSheHe] trắng trợn áp đặt văn hóa [task_contract_target.GetCulture.GetName]!"
  ep3_contract_event.0070.desc_liege_faith: "[task_contract_target.GetSheHe] là tín đồ [task_contract_target.GetFaith.GetAdherentName] thuần túy đến cực đoan!"
  ep3_contract_event.0070.desc_liege_fallback: "[task_contract_target.GetSheHe] là kẻ [task_contract_target.Custom('DescriptorNegativeStandalone')]!"
  ep3_contract_event.0070.desc_outro: "tên [task_contract_employer.Custom('KnightCultureNoTooltip')|l] khạc xuống đất, rồi chìa tay ra. “Ngài có gia nhập cùng chúng Ta không?”"
  ep3_contract_event.0070.a: "Ta muốn một phần lãnh thổ của [task_contract_target.GetFirstNamePossessiveNoTooltip]!"
  ep3_contract_event.0070.b: "Quả là một chính nghĩa cao cả!"
  ep3_contract_event.0080.t: "$contract_event_prefix$ $laamp_help_fabricate_claim_contract_contract$"
  ep3_contract_event.0080.desc: "Doanh trại của ta vinh dự được đón tiếp [task_contract_councillor.GetCouncilTitleFirstName] đến từ [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTier].\n\n\"Xin chào, [ROOT.Char.GetTitledFirstNameNoTooltip]. Ngài có vẻ là một [ROOT.Char.GetWomanMan] tinh tường... khi đã ngầm hiểu rõ chúng ta đang làm gì.\" [task_contract_councillor.GetFirstNameNoTooltip] đặt [task_contract_councillor.GetHerHis] tay lên vai ta. \"Ngài thấy đấy, [task_contract_target.GetName]... [task_contract_target.GetSheHe] là một kẻ tiếm quyền. Ta biết điều đó, [task_contract_employer.GetTitledFirstNameNoTooltip] cũng biết, và ngài cũng vậy.\" [task_contract_councillor.GetSheHe|U] vỗ nhẹ lên ngực ta.\n\n\"Giả sử ngài tình cờ #EMP tìm được#! bằng chứng về quyền thừa kế tổ tiên của chủ nhân ta? Khi đó, ngài có sẵn lòng để mọi người biết đến #EMP sự thật#! không?\""
  ep3_contract_event.0080.open_start_generate_claim_interaction: "Mở [character_interaction|E] để bắt đầu [GetScheme('generate_claim').GetTypeName] [scheme|E]"
  ep3_contract_event.0080.a: "Để ta xem mình có thể làm được gì."
  ep3_contract_event.0082.t: "$contract_event_prefix$ $laamp_fight_faith_conversion_contract_contract$"
  ep3_contract_event.0082.desc: "Một phái đoàn tín đồ [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] đến doanh trại của ta, mang theo lời thỉnh cầu đầy uất ức.\n\n\"Ôi, [ROOT.Char.GetTitledFirstNameNoTooltip] hùng mạnh!\" họ nói. \"Chúng Ta chỉ là những [task_contract_employer.GetFaith.DevoteeNeuterPlural] khốn khổ. Ngày đêm, chúng Ta bị các nhà truyền giáo do [task_contract_councillor_liege.GetTitledFirstName] phái từ [task_contract_councillor_liege.GetCapitalLocation.GetName] quấy nhiễu! Chúng Ta buộc phải chạy trốn đến đây — bởi tại quê nhà, [task_contract_councillor.GetCouncilTitleFirstName] [task_contract_councillor.GetHerselfHimself] gieo rắc tội ác! [task_contract_councillor.GetSheHe|U] cải đạo những kẻ [task_contract_councillor.GetSheHe] bắt được bằng vũ lực!\"\n\nNhững người tị nạn rách rưới quỳ sụp xuống trong tuyệt vọng.\n\n\"Nhân danh [task_contract_employer.GetTitledFirstNamePossessive] — nhân danh [task_contract_employer.GetFaith.HighGodNamePossessive] — xin hãy cứu lấy chúng Ta!\""
  ep3_contract_event.0082.a: "Ta sẽ cố gắng ngăn chặn [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]!"
  ep3_contract_event.0082.b: "Ta sẽ nói chuyện với [task_contract_councillor_liege.GetTitledFirstNameNoTooltip] tại [task_contract_councillor_liege.GetCapitalLocation.GetNameNoTooltip], kinh đô của [task_contract_councillor_liege.GetHerHis]."
  ep3_contract_event.0082.to_destination: "Ngài sẽ đến [task_contract_destination.GetName] để chấm dứt hoạt động truyền giáo của [task_contract_target.GetCouncilTitleFirstNamePossessive]"
  ep3_contract_event.0082.to_liege: "Ngài sẽ đến gặp [task_contract_councillor_liege.GetName] để thuyết phục [task_contract_councillor_liege.GetHerHim] triệu hồi [task_contract_councillor.GetCouncilTitleFirstName]"
  ep3_contract_event.0083.t: "$ep3_contract_event.0082.t$"
  ep3_contract_event.0083.desc: "Chúng ta đến [task_contract_destination.GetName]. Khi [task_contract_employer.GetName] bước vào [task_contract_destination.Custom('GetLocationFaithTemple')] của [task_contract_employer.GetHerHis], một tiếng thét đau buồn phát ra từ tận đáy lòng của [task_contract_employer.GetHerHis]!\n\n"#EMP Tất cả đã bị hủy hoại!#! [task_contract_employer.GetFaith.ReligiousSymbol] đã bị đánh cắp! [task_contract_employer.GetFaith.ReligiousSymbol2] đã bị giẫm nát dưới đất! Ta có thể hét lên từng lời trong [task_contract_employer.GetFaith.ReligiousText]! Kẻ nào lại có gan phá hoại nơi này và thiêu rụi nó? Còn ai khác ngoài [task_contract_councillor.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_councillor.GetTitledFirstName] chứ!"\n\n"Giờ thì ngươi đã hiểu rồi chứ, [ROOT.Char.GetTitledFirstNameNoTooltip]!" [task_contract_employer.GetFirstNameNoTooltip] chỉ vào [task_contract_employer.GetFaith.ReligiousSymbol3] đã bị xúc phạm. "Chúng ta không thể tiếp tục sống như thế này nữa!""
  ep3_contract_event.0083.a: "\"Hãy loại [task_contract_councillor.GetNameNoTooltip] khỏi cuộc chơi.\""
  ep3_contract_event.0083.b: "\"[task_contract_councillor.GetNameNoTooltip] chỉ hiểu sức mạnh.\""
  ep3_contract_event.0083.c: "\"Chắc hẳn ta có thể nói lý với vị [task_contract_councillor.GetFaith.GetAdjectiveNoTooltip] [task_contract_councillor.GetFaith.PriestNeuter] này.\""
  ep3_contract_event.0083.d: "Chạy đi, [task_contract_employer.GetFirstNameNoTooltip]! Ở bên ta, ngươi sẽ an toàn."
  ep3_contract_event.0083.a_win: "Ngài bắt giữ thành công [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
  ep3_contract_event.0083.a_lose: "Ngài không thể bắt được [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
  ep3_contract_event.0083.b_win: "Ngài đe dọa được [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
  ep3_contract_event.0083.b_lose: "Ngài không thể uy hiếp [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
  ep3_contract_event.0083.c_win: "Ngài đàm phán thành công sự chung sống hòa bình với [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
  ep3_contract_event.0083.c_lose: "Ngài thua trong cuộc tranh luận với [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip]"
  ep3_contract_event.0084.t: "$ep3_contract_event.0082.t$"
  ep3_contract_event.0084.desc: "Sau khi vận động hậu trường tại [task_contract_destination.GetName], ta có được buổi yết kiến với [task_contract_councillor_liege.GetName].\n\n\"[task_contract_councillor_liege.GetTitleAsNameNoTooltip]!\" ta nói. \"Thay mặt [task_contract_employer.GetTitledFirstName] và các [task_contract_employer.GetFaith.GetAdherentNamePlural] trong lãnh thổ của ngài, ta đến đây. [task_contract_councillor.GetCouncilTitleFirstName] của ngài đã gây ra những hành vi đáng khinh với cộng đồng của họ, và xứng đáng bị trừng phạt! Lẽ nào công lý đó không phải là con đường của [task_contract_councillor_liege.GetFaith.HighGodName] sao?\"\n\n[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] cau mày.\n\n\"Quả vậy. Ta không phải bạo chúa; ta sẽ lắng nghe đầy đủ thỉnh nguyện của ngươi. Và chỉ sau đó, ta mới quyết định số phận của [task_contract_councillor.GetCouncilTitle] và toàn thể [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] trong vương quốc của ta.\""
  ep3_contract_event.0084.a: "Các [task_contract_employer.GetFaith.GetAdherentNamePluralNoTooltip] nên được tự trị."
  ep3_contract_event.0084.a_win_rights: "Trao cho [task_contract_employer.GetFirstNameNoTooltip]: [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip] cùng quyền được bảo hộ"
  ep3_contract_event.0084.a_win_rights.tt: "Nhận [GetSubjectContractType( 'religious_rights' ).GetObligationName( 'religious_rights_protected' )] [obligation|E]"
  ep3_contract_event.0084.a_win: "[task_contract_employer.GetTitledFirstNameNoTooltip] giành được [task_contract_destination.GetCounty.GetTitle.GetNameNoTooltip]"
  ep3_contract_event.0084.a_lost: "Ngài không thuyết phục được [task_contract_councillor_liege.GetTitledFirstNameNoTooltip]"
  ep3_contract_event.0084.b: "Dân chúng của ngài nên học cách chung sống hòa thuận."
  ep3_contract_event.0084.b_win: "[task_contract_councillor_liege.GetTitledFirstNameNoTooltip] sẽ ngừng cải đạo [task_contract_destination.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
  ep3_contract_event.0084.b_lost: "$ep3_contract_event.0084.a_lost$"
  ep3_contract_event.0085.t: "$contract_event_prefix$ $laamp_help_faith_conversion_contract_contract$"
  ep3_contract_event.0085.desc: "[task_contract_destination.GetName] là"
  ep3_contract_event.0085.desc_good: "[task_contract_destination.GetName] có vẻ khá yên ắng kể từ khi ta đến. Ta bắt gặp [task_contract_councillor_liege.GetNamePossessive] [task_contract_councillor.GetCouncilTitleFirstName] đang đứng giữa một nhóm [task_contract_destination.County.GetFaith.GetAdherentNamePlural] địa phương.\n\n\"Chào mừng, lữ khách! Ta vừa định đọc một đoạn trong [task_contract_councillor.GetFaith.ReligiousText] cho các môn đồ của mình.\" [task_contract_councillor.GetSheHe|U] chỉ tay về phía dân làng. \"Có lẽ ngài có thể chia sẻ những dụ ngôn yêu thích của mình chăng?\""
  ep3_contract_event.0085.desc_bad: "Tại [task_contract_destination.GetName], [task_contract_destination.Custom('GetLocationFaithTemple')] địa phương đang bốc cháy dữ dội! Ta tìm thấy [task_contract_councillor.GetCouncilTitleFirstName] của [task_contract_councillor_liege.GetNamePossessive] ở vùng ngoại ô; những [task_contract_councillor.Custom('WomenMenPeople_GenderPreference')] thuộc quyền [task_contract_councillor.GetHerHis] đang treo những cái đầu của tín đồ [task_contract_destination.County.GetFaith.GetName] trên mũi kiếm của họ.\n\n\"Ồ, thật vừa đúng lúc! Những kẻ nông dân đó không chịu tôn trọng các nhà truyền giáo của chúng ta, vì vậy chúng ta quyết định cho chúng thấy sức mạnh thực sự của [task_contract_councillor.GetFaith.HighGodName].\" [task_contract_councillor.GetTitledFirstNameNoTooltip] rõ ràng đang tận hưởng khoảnh khắc này.\n\n\"Xin hãy thương xót!\" những người sống sót van xin. \"Chúng tôi chỉ là những [task_contract_destination.County.GetFaith.DevoteeNeuterPlural] bình thường. Chúng tôi không có ý làm hại ai: xin hãy để chúng tôi được sống trong bình yên!\""
  ep3_contract_event.0085.a: "Thật điên rồ. Phải chặn đứng [task_contract_councillor.GetTitledFirstNameNoTooltip]!"
  ep3_contract_event.0085.a_win_critical: "Ngài bắt giữ thành công [task_contract_councillor.GetTitledFirstNameNoTooltip]"
  ep3_contract_event.0085.a_win: "Ngài xua đuổi toàn bộ các nhà truyền giáo"
  ep3_contract_event.0085.a_lose: "Ngài không bắt được [task_contract_councillor.GetTitledFirstNameNoTooltip] và hợp đồng thất bại"
  ep3_contract_event.0085.b: "Ta nghĩ là ta sẽ #EMP tận hưởng#! công việc truyền giáo này."
  ep3_contract_event.0085.c: "Ta sẽ dạy họ về [task_contract_councillor.GetFaith.GoodGodNames]."
  ep3_contract_event.0085.c_win: "Họ hiểu được ẩn dụ"
  ep3_contract_event.0085.c_lose: "Họ không nắm được ý nghĩa câu chuyện"
  ep3_contract_event.0085.d: "Ta sẽ cảnh báo họ về [task_contract_councillor.GetFaith.EvilGodNames]!"
  ep3_contract_event.0085.d_win: "Họ hiểu được ẩn dụ"
  ep3_contract_event.0085.d_lose: "Họ bị dọa sợ bởi [task_contract_councillor.GetFaith.EvilGodName]"
  ep3_contract_event.0090.t: "$contract_event_prefix$ Người huấn luyện [task_contract_employer.Custom('KnightCulturePluralNoTooltip')]"
  ep3_contract_event.0090.desc: "Khi ta đến nơi, ta được [task_contract_councillor_liege.GetCouncilTitleFirstName] của [task_contract_councillor_liege.GetNamePossessive] nghênh đón.\n\n\"Ta rất vui vì ngươi đã đến. Chúng ta đang cần một chuyên gia về nghệ thuật chiến tranh, bởi các chỉ huy của chúng ta còn khá thiếu kinh nghiệm.\" [task_contract_councillor.GetCouncilTitleFirstNameNoTooltip] cúi đầu và nhanh chóng nói thêm: \"Ít nhất... theo lời của chủ nhân ta.\"\n\n\"Dù sao, ta rất muốn mời ngươi vào trong, nhưng [task_contract_councillor_liege.GetTitleAsNameNoTooltip] của ta mong ngươi bắt đầu huấn luyện ngay lập tức. Hãy chọn bất kỳ ai ngươi muốn và trang bị vũ khí cho họ.\""
  ep3_contract_event.0090.a: "Để ta xem những [task_contract_councillor_liege.Custom('WomenMenPeople_GenderPreference')] đó nào!"
  ep3_contract_event.0090.opens_task_contract_train_knight_interaction: "Mở $task_contract_train_knight_interaction$ [character_interaction|E]"
  ep3_contract_event.0091.t: "$ep3_contract_event.0090.t$"
  ep3_contract_event.0091.desc: "Để biết rõ mình đang đối mặt với điều gì, ta mời [knight.GetName] đấu tập với"
  ep3_contract_event.0091.desc_me: "ta.\n\n\"Chúng ta vào thế, chờ đợi sơ hở.\""
  ep3_contract_event.0091.desc_me_high_prowess: "[knight.GetFirstNameNoTooltip] ra tay trước, tung ra loạt đòn dữ dội với [knight.GetHerHis] [knight.Custom('signature_weapon')]. Ta bị bất ngờ, cố gắng lấy lại thế và phản công vài đòn. Tuy nhiên, [knight.GetSheHe] dễ dàng gạt được [ROOT.Char.Custom('signature_weapon')] của ta.\""
  ep3_contract_event.0091.desc_me_low_prowess: "Thế thủ của [knight.GetFirstNamePossessiveNoTooltip] sụp đổ trước, để lộ vài đòn chính xác từ [helper.Custom('signature_weapon')] của ta. Rõ ràng, [knight.GetSheHe] không phải đối thủ của ta.\""
  ep3_contract_event.0091.desc_helper: "[helper.GetName].\n\n\"Họ vào thế, chờ đợi sơ hở.\""
  ep3_contract_event.0091.desc_high_prowess: "[knight.GetNameNoTooltip] ra đòn trước, tung một loạt đòn tấn công nhằm vào [helper.GetFirstNameNoTooltip] bằng [knight.Custom('signature_weapon')] của [knight.GetHerHis]. [helper.GetFirstNameNoTooltip] trông hoàn toàn bất lực, rõ ràng bị đối thủ áp đảo."
  ep3_contract_event.0091.desc_low_prowess: "Thế thủ của [knight.GetFirstNamePossessiveNoTooltip] sụp đổ trước, để lộ vài đòn chính xác từ [helper.GetFirstNamePossessive] [helper.Custom('signature_weapon')]. [knight.GetSheHe|U] thậm chí còn khó mà đứng vững. Có vẻ đây sẽ là một buổi huấn luyện khá dài...\""
  ep3_contract_event.0091.desc_outro: "\n\nTa dừng trận đấu trước khi nó trở nên đẫm máu. \"Cảm ơn nỗ lực của ngươi, [knight.GetFirstNameNoTooltip]. Ta đã thấy đủ để biết nên tiếp tục việc huấn luyện thế nào.\""
  ep3_contract_event.0091.a: "Ta có thể dùng một người như thế này cho riêng mình!"
  ep3_contract_event.0091.b: "Dạy cho [knight.GetHerHim] [trait_to_teach.GetNameNoTooltip( ROOT.Char )] chắc sẽ dễ thôi!"
  ep3_contract_event.0091.c: "\"[helper.GetFirstNameNoTooltip], hãy cho [knight.GetHerHim] một buổi huấn luyện riêng.\""
  ep3_contract_event.0091.d: "[knight.GetFirstNameNoTooltip] cứ việc bắt chước động tác của ta."
  ep3_contract_event.0091_won: "[knight.GetFirstNameNoTooltip] học hỏi được rất nhiều từ Ngài"
  ep3_contract_event.0091_won_helper: "[knight.GetFirstNameNoTooltip] học hỏi được rất nhiều từ [helper.GetFirstNameNoTooltip]"
  ep3_contract_event.0091_won_trait: "[knight.GetFirstNameNoTooltip] lĩnh hội ngay lập tức"
  ep3_contract_event.0091_won_recruit: "[knight.GetFirstNameNoTooltip] háo hức gia nhập doanh trại của Ngài"
  ep3_contract_event.0091_lost: "[knight.GetFirstNameNoTooltip] không theo kịp"
  ep3_contract_event.0091_lost_recruit: "[knight.GetFirstNameNoTooltip] từ chối gia nhập doanh trại của Ngài"
  ep3_contract_event.0100.t: "$contract_event_prefix$ $laamp_help_find_secrets_contract_contract$"
  ep3_contract_event.0100.desc: "Ta được hẹn gặp [task_contract_councillor_liege.GetNamePossessive] [task_contract_councillor.GetCouncilTitleFirstName], nhưng khi đến [task_contract_destination.GetName], [task_contract_destination.GetHolding.GetType.GetName|l] trông hoàn toàn trống vắng... chẳng có ai ở đó?\n\n\"Ngươi có vẻ bối rối đấy, kẻ phiêu lưu,\" một giọng thì thầm vang lên từ trong bóng tối, \"Ngươi có thực sự phù hợp với nhiệm vụ này không? Chúng ta cần một người cảnh giác, thận trọng, tinh tế...\"\n\nTa hoảng hốt nhìn quanh: giọng nói dường như phát ra từ một hướng khác sau mỗi câu.\n\n\"Ngươi có vẻ chẳng có được những điều đó...\" giọng nói cất lên, khi [task_contract_councillor.GetNameNoTooltip] xuất hiện ngay sau lưng ta."
  ep3_contract_event.0100.a: "Ồ, [task_contract_councillor.GetSheHe] giỏi thật, nhưng ta còn giỏi hơn!"
  adventurer_not_famous_or_patron_trigger_tt: "$adventurer_not_famous_trigger_tt$ hoặc [TARGET_CHARACTER.GetShortUIName] phải là [CHARACTER.GetShortUINamePossessive] [contact_list_contact|E]"
  adventurer_not_famous_trigger_tt: "[prestige_level|E] của Ngài phải đạt ít nhất [GetPrestigeLevelName( '(int32)$VALUE|q$' )]"
  IS_CONTACT_OF: "[CHARACTER.GetShortUIName] là [TARGET_CHARACTER.GetShortUINamePossessive] [contact_list_contact|E]"
  NOT_IS_CONTACT_OF: "[CHARACTER.GetShortUIName] không phải là [TARGET_CHARACTER.GetShortUINamePossessive] [contact_list_contact|E]"
  laamp_peasant_revolt_every_county: "Mỗi [county|E] được ủng hộ"
  ep3_peasant_leader_modifier: "Lãnh tụ Nhân dân"
  ADVENTURER_PEASANT_LEADER_DUCHY_NAME: "Xứ [new_capital_duchy.GetNameNoTierNoTooltip] Tự Do"
  ADVENTURER_PEASANT_LEADER_DUCHY_NAME_adj: "[new_capital_duchy.GetAdjectiveNoTooltip] Tự Do"

  ep3_contract_event.0092.t: "$contract_event_prefix$ $laamp_help_increase_control_contract_contract$"
  ep3_contract_event.0092.desc: "[task_contract_councillor.GetName], [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTierPossessive] [task_contract_councillor.GetCouncilTitle], đến thăm doanh trại của ta trong ngày. Vừa khi chỉ còn lại hai người, [task_contract_councillor.GetSheHe] bắt đầu lẩm bẩm.\n\n“Thật khó thừa nhận… nhưng ta cần ngươi giúp xử lý đám nông dân bất tuân ở [task_contract_destination.GetName].” Vị [task_contract_councillor.GetCouncilTitle|l] hừ một tiếng, ánh mắt giận dữ.\n\n“Họ công khai coi thường thẩm quyền của [task_contract_councillor_liege.GetTitleAsNamePossessive]!”"
  ep3_contract_event.0092.desc_taxes: "Nhân viên thu thuế bị đóng sập cửa vào mặt và ném đá! Những khoản thuế và nghĩa vụ cổ xưa bị phớt lờ khắp nơi ta đi qua."
  ep3_contract_event.0092.desc_bandits: "Chúng tự tổ chức thành các đội dân binh, tuyên bố rằng mình bị bọn cướp hoành hành! Cả vùng đang trở thành một đạo quân bất tuân khổng lồ…"
  ep3_contract_event.0092.desc_riots: "Ta nghi ngờ có thế lực ngoại bang kích động đám dân quê làm những việc đê hèn… và điều đó phải chấm dứt ngay lập tức!"
  ep3_contract_event.0092.desc_low_control: "Ta không thể kiểm soát nổi chúng! Chúng đánh đập và làm nhục bất cứ ai ta phái đến, thách thức ta đem quân đàn áp — hành vi ấy là một vết nhơ làm hoen ố toàn cõi lãnh thổ!"
  ep3_contract_event.0092.a: "Để ta xử lý bọn chúng!"
  ep3_contract_event.0092.a_tt: "$ep3_contract_event.0094.travel_without_domicile$"
  ep3_contract_event.0092.b: "Ta sẽ chuyển doanh trại tới đó."
  ep3_contract_event.0092.b_tt: "$ep3_contract_event.0094.travel_with_domicile$"
  ep3_contract_event.0093.t: "$ep3_contract_event.0092.t$"
  ep3_contract_event.0093.desc: "Khi chúng ta đến [task_contract_destination.GetName], ta nhanh chóng tóm cổ những kẻ kích động tệ hại nhất và buộc chúng phải giải thích. [corrupt_province_peasant.GetName], một nông dân có tiếng tăm nhất định, đứng ra đại diện cho số còn lại.\n\n"
  ep3_contract_event.0093.desc_taxes: "“Thuế thì cao, nhưng chúng Ta vẫn nộp! Các khoản thu trên hàng hóa khiến chúng Ta chẳng còn gì dư dả! Chúng Ta gánh chịu tất cả — trong khi [task_contract_councillor_liege.GetTitledFirstName] vẫn đòi hỏi nhiều hơn nữa — còn bọn thu thuế thì ngày càng giàu có. Chính #EMP bọn chúng#! mới là kẻ ngài nên đối mặt!”"
  ep3_contract_event.0093.desc_bandits: "\"Chúng tôi lo sợ cho sự an toàn của con cái mình. Bảo vệ chúng tôi là nghĩa vụ của [task_contract_councillor_liege.GetTitledFirstNamePossessive], nhưng [task_contract_councillor_liege.GetSheHe] chỉ quan tâm đến việc kiểm soát chúng tôi! Nếu những thanh kiếm cao quý của [task_contract_councillor_liege.GetHerHis] không chịu chém hạ lũ cướp khốn kiếp đó, người dân của tôi sẽ đặt mạng sống của con cái mình vào chính những chiếc liềm, chùy và cung tên của họ!\""
  ep3_contract_event.0093.desc_riots: "“Chúng Ta có đầu óc của riêng mình! Như thể chúng Ta lại hoan nghênh sự can thiệp của kẻ ngoài — hừ! Chúng Ta cũng bác bỏ sự hiện diện của tay sai và đám côn đồ của [task_contract_councillor_liege.GetTitledFirstNamePossessive]! Chẳng lẽ chúng Ta không thể tự quản chuyện địa phương của mình sao?”"
  ep3_contract_event.0093.desc_low_control: "“Chúng Ta chấp nhận bị cai trị — nhưng [task_contract_councillor_liege.GetTitledFirstName] làm điều đó một cách bất công! Khi đất nước hỗn loạn, tài sản của chúng Ta chẳng giữ nổi, vậy mà [task_contract_councillor_liege.GetSheHe] vẫn bắt chúng Ta lao động cho [task_contract_councillor_liege.GetHerHim] như súc vật! Chúng Ta làm lụng mà chẳng có bất kỳ bảo đảm nào trước chiến tranh, bệnh tật và tai ương!”"
  ep3_contract_event.0093.a: "“Bảo dân của ngươi im miệng đi, nếu không thì #EMP chết#!, đồ nông dân!”"
  ep3_contract_event.0093.b: "Ta không thể chấp nhận kiểu bất công này."
  ep3_contract_event.0093.a_win: "Ngươi giúp củng cố sự hiện diện của [task_contract_councillor.GetCouncilTitleFirstNamePossessive]"
  ep3_contract_event.0093.a_lose: "Nhưng ngươi buộc phải để lại một vài [ROOT.Char.GetWomenMen]"
  every_lowborn_follower: "Mỗi [lowborn|E] [follower|E]"
  ep3_contract_event.0094.t: "$ep3_contract_event.0092.t$"
  ep3_contract_event.0094.desc: "Khi quá trình ồn ào nhằm khuất phục từng thủ lĩnh nông dân theo ý ta kết thúc, chúng ta lại lên đường. [task_contract_councillor.GetName] nói về điểm đến tiếp theo.\n\n“Chúng ta sẽ tới [corrupt_province.GetName], dù tốt hay xấu. Đám đông địa phương ở đó là mối lo lớn.”"
  ep3_contract_event.0094.desc_taxes: "$ep3_contract_event.0092.desc_taxes$"
  ep3_contract_event.0094.desc_bandits: "$ep3_contract_event.0092.desc_bandits$"
  ep3_contract_event.0094.desc_riots: "$ep3_contract_event.0092.desc_riots$"
  ep3_contract_event.0094.desc_low_control: "$ep3_contract_event.0092.desc_low_control$"
  ep3_contract_event.0094.a: "Đi ngay thôi!"
  ep3_contract_event.0094.b: "Ta sẽ chuyển doanh trại tới đó."
  ep3_contract_event.0094.c: "Ta không muốn dính dáng tới rắc rối của [task_contract_employer.GetFirstNamePossessiveNoTooltip] nữa."
  ep3_contract_event.0094_success: "Ngươi hoàn thành [task_contract.GetType.GetName] [task_contract|E]: ngươi giúp [task_contract_employer.GetShortUIName] nhiều hơn nông dân"
  ep3_contract_event.0094_fail: "Ngươi thất bại [task_contract.GetType.GetName] [task_contract|E]: ngươi giúp nông dân nhiều hơn [task_contract_employer.GetShortUIName]"
  ep3_contract_event.0095.t: "$ep3_contract_event.0092.t$"
  ep3_contract_event.0095.desc: "Tin tức truyền đến tai ta: việc ta ủng hộ mối quan tâm của dân thường đã khiến họ hành động! Những con người cứng cỏi tụ tập thành các toán kiêu hãnh, hô vang tên ta và lắc lư vũ khí thô sơ — sẵn sàng nổi dậy! Đáng tiếc thay, tin này cũng đã đến tai [task_contract_councillor.GetName].\n\n“Ta tưởng chúng ta đã có thỏa thuận chứ? Rằng ngươi chỉ gom lũ ngu đó lại để dọa cho chúng sợ! Chứ không phải, nhân danh [task_contract_councillor.GetFaith.GoodGodNames], là để #EMP khóc#! cho số phận của bọn khốn đó! Và giờ thì #EMP sao#! — ngươi còn định cùng đám dân đen nổi loạn ư!?”"
  ep3_contract_event.0095.a: "“Quyền lợi cho nông dân!”"
  ep3_contract_event.0095.a_2: "Ta sẽ chỉ dẫn dắt họ trong cuộc chiến này mà thôi."
  ep3_contract_event.0095.a_become_landed: "@warning_icon! #X Nếu giành chiến thắng, bạn sẽ trở thành [landed|E] (lãnh chúa hữu thổ)#!"
  ep3_contract_event.0095.a_remain_laamp: "@alert_icon! #alert_trial Nếu giành chiến thắng, bạn vẫn sẽ là một [adventurer|E] (nhà thám hiểm)#!"
  ep3_contract_event.0095.b: "Thực ra… họ tự lo lấy."
  ep3_contract_event.0095.c: "“Không, chờ đã: ta có thể giải thích mọi chuyện!”"
  ep3_contract_event.0095.a_win: "$ep3_contract_event.0083.a_win$"
  ep3_contract_event.0095.a_lose: "$ep3_contract_event.0083.a_lose$"
  ep3_contract_event.0095.c_win: "Ngươi thuyết phục được [task_contract_councillor.GetFirstNameNoTooltip] rằng bằng cách nào đó ngươi đã hoàn thành hợp đồng"
  ep3_contract_event.0095.c_tie: "Ngươi thuyết phục [task_contract_councillor.GetFirstNameNoTooltip] đơn giản là hủy bỏ hợp đồng"
  ep3_contract_event.0095.c_lose: "[task_contract_councillor.GetFirstNameNoTooltip] khăng khăng rằng ngươi đã thất bại hợp đồng"
