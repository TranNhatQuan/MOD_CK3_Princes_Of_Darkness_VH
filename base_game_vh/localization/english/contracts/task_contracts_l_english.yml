  ep3_contract_event.0012.opening_angry: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  ep3_contract_event.0012.opening: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ep3_contract_event.0012.desc_employer_dead_outro: "Ta hủy bỏ nghĩa vụ của ngươi: [ROOT.Char.Custom('GetInvalidatedContractType')]. Đừng lo; hãy nhận chút vàng làm bồi thường."
  ep3_contract_event.0012.desc_employer_dead: "Ta buộc phải báo cho ngươi biết rằng người tiền nhiệm của ta, [task_contract_employer.GetTitledFirstName], đã qua đời. Với tư cách là người thuê mới của ngươi, $ep3_contract_event.0012.desc_employer_dead_outro$"
  ep3_contract_event.0012.desc_unlanded_employer: "và vì vậy, [ROOT.Char.Custom('GetInvalidatedContractType')] của ngươi không còn cần thiết nữa."
  ep3_contract_event.0012.desc_unlanded_employer_is_imprisoned: "Ta phải thông báo rằng ta không còn là một [task_contract_employer.GetWomanMan] tự do nữa, $ep3_contract_event.0012.desc_unlanded_employer$"
  ep3_contract_event.0012.desc_target_dead: "Ta phải báo cho ngươi biết rằng [task_contract_employer.Custom2('RelationToMeShort',task_contract_target)] của ta, [task_contract_target.GetTitledFirstName], đã qua đời. Xét theo hoàn cảnh, $ep3_contract_event.0012.desc_employer_dead_outro$"
  ep3_contract_event.0012.desc_prisoner_free: "Ta phải báo cho ngươi biết rằng [task_contract_employer.Custom2('RelationToMeShort',task_contract_object)] của ta, [task_contract_object.GetFirstName], đã được thả khỏi ngục. Ta không thể chắc liệu ngươi có nhúng tay vào việc này hay không, nhưng $ep3_contract_event.0012.desc_employer_dead_outro$"
  ep3_contract_event.0012.desc_dead_intro: "Sự bất tài của ngươi khiến ta sững sờ và cơn phẫn nộ của ta là không thể đo đếm. Sao ngươi có thể để"
  ep3_contract_event.0012.desc_escortee_dead: "$ep3_contract_event.0012.desc_dead_intro$ [task_contract_object.GetFirstName] $ep3_contract_event.0012.desc_dead_outro$"
  ep3_contract_event.0012.desc_pet_dead: "$ep3_contract_event.0012.desc_dead_intro$ [ROOT.Char.Custom('CatOrDogStoryName')] $ep3_contract_event.0012.desc_dead_outro$"
  ep3_contract_event.0012.desc_dead_outro: "chết được chứ? Ngươi đã đồng ý [ROOT.Char.Custom('GetInvalidatedContractType')]! Ta mong sẽ không bao giờ còn gặp lại ngươi nữa, theo cách này hay #EMP cách khác#!."
  ep3_contract_event.0012.desc_not_vassal: "Hãy vui mừng đi, vì ta không còn là chư hầu của tên [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] nữa. $ep3_contract_event.0012.desc_employer_dead_outro$"
  ep3_contract_event.0012.desc_faction_disbanded: "Hoàn cảnh đã dẫn đến việc phe phái của chúng ta bị giải tán. $ep3_contract_event.0012.desc_employer_dead_outro$"
  ep3_contract_event.0012.a: "Tin buồn thật, nhưng có vài đồng còn hơn là chẳng có đồng nào."
  ep3_contract_event.0012.b: "Ta không thể làm gì hơn được."
  ep3_contract_event.0012.c: "Hãy tiếp tục tiến về [travel_destination.GetNameNoTooltip]."

  ep3_contract_event.0013.opening_success: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ep3_contract_event.0013.opening_failure: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  ep3_contract_event.0013.desc_success: "Những đóng góp của ngươi có ý nghĩa sống còn đối với chiến thắng trong cuộc chiến của ta, và lòng dũng cảm của đám lính đánh thuê dưới quyền ngươi được các chiến binh của ta vô cùng ngưỡng mộ.\n\nMong rằng khoản thù lao này sẽ giúp ngươi ăn mừng chiến thắng huy hoàng của chúng ta!"
  ep3_contract_event.0013.desc_failure: "Ngươi nên được biết đến với cái tên 'Kẻ Phản Bội Lời Thề' vì sự thất bại thảm hại khi không xuất hiện trên chiến trường!\n\nTa, kẻ lẽ ra đã chiến đấu kề vai sát cánh cùng ngươi, nay gọi ngươi là một tên [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] và là thủ lĩnh của bọn hèn nhát."
  ep3_contract_event.0013.a: "Được chiến đấu kề vai sát cánh cùng ngài là một vinh dự."
  ep3_contract_event.0013.b: "'Kẻ Phản Bội Lời Thề' nghe cũng không tệ lắm..."

  treasure_hunting_contract_decision: "Tìm kiếm Kho Báu"
  treasure_hunting_contract_decision_desc: "Một cuộc phiêu lưu đầy hứng khởi đang chờ đợi những kẻ đủ gan dạ dấn thân đến những miền đất xa xôi, tìm kiếm tin tức về vàng bạc, châu báu, kho tàng và danh tiếng. Ta sẽ sa ngã trước những cám dỗ tầm thường ư? Gục ngã trên hành trình chết chóc ư? Hay ta sẽ hoàn thành nghĩa vụ của mình?"
