  any_character_task_contract: "Bất kỳ [GetPlayer.Custom('GetContractOrIssue')]:"
  has_task_contract_type: "[TASK_CONTRACT_TYPE.GetName]"
  laamp_transport_vip_contract: "Hộ tống Sứ giả"
  laamp_transport_vip_desc_title: "Những chiến binh đánh thuê quả cảm,"
  laamp_transport_vip_desc: "Một đặc sứ cao quý của [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] cần được bảo vệ khỏi cướp bóc và tai nạn, và sẵn sàng tiếp nhận sự trợ giúp của những lữ khách dày dạn kinh nghiệm."
  laamp_transport_ward_contract: "Hộ tống Người giám hộ"
  laamp_transport_ward_desc_title: "Những lính đánh thuê có trách nhiệm,"
  laamp_transport_ward_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] sẽ hậu đãi bất kỳ ai sẵn sàng hộ tống đứa con của [TaskContract.GetEmployer.GetHerHis] trên hành trình đến triều đình của người giám hộ."
  laamp_transport_explorer_contract: "Nhà Thám hiểm Nhiệt huyết"
  laamp_transport_explorer_desc_title: "Những lính đánh thuê đáng tin cậy,"
  laamp_transport_explorer_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] hiếu kỳ tìm kiếm Ngài đồng hành và sự bảo vệ trong chuyến phiêu lưu sắp tới của [TaskContract.GetEmployer.GetHerHis]."
  laamp_transport_artifact_contract: "Vận chuyển Bảo vật"
  laamp_transport_artifact_desc_title: "Những lữ khách trung thực và sung túc,"
  laamp_transport_artifact_desc: "Một bảo vật gia truyền quý giá sắp được chuyển giao. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] cần ai đó đảm bảo món đồ được đưa đến nơi an toàn."
  laamp_transport_gold_contract: "Món Quà Vàng"
  laamp_transport_gold_desc_title: "Những ai vững vàng và cảnh giác,"
  laamp_transport_gold_desc: "Một đoàn xe quan trọng sắp rời khỏi [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip]. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] đưa ra phần thưởng hậu hĩnh cho bất kỳ ai sẵn sàng bảo vệ đoàn xe trên đường đi."
  laamp_transport_animal_contract: "Món Quà Sống"
  laamp_transport_animal_desc_title: "Những lữ khách nhân hậu,"
  laamp_transport_animal_desc: "Một thú cưng quý giá của [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] cần được bảo vệ trên đường."
  laamp_construction_contract_contract: "Công việc Xây dựng"
  laamp_construction_contract_desc_title: "Những nhà cung ứng dày dạn kinh nghiệm,"
  laamp_construction_contract_desc: "Một dự án xây dựng do [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] chỉ định đang thiếu vật tư. Một khoản tiền lớn được treo thưởng cho việc thu mua nguồn cung xây dựng mới."
  laamp_treasure_hunting_contract_contract: "Săn tìm Kho báu"
  laamp_treasure_hunting_contract_desc_title: "Những kẻ mạo hiểm lanh trí,"
  laamp_treasure_hunting_contract_desc: "Tin đồn về kho báu huyền thoại đã đến tai [TaskContract.GetEmployer.GetTitleAsNameNoTooltip]. [TaskContract.GetEmployer.GetSheHe|U] mong muốn một nhà thám hiểm đủ năng lực để xác minh những lời đồn này."
  laamp_join_war_contract_contract: "Cùng Chúng Ta Chiến Đấu"
  laamp_join_war_contract_desc_title: "Rút gươm vì chính nghĩa!"
  laamp_join_war_contract_desc: "Viện trợ quân sự đang rất cần thiết tại vùng chiến sự [TaskContract.GetEmployer.GetPrimaryTitle.GetBaseNameNoTier] trong vòng [TaskContract.MakeScope.Var('task_contract_war').War.MakeScope().ScriptValue('task_contract_war_duration_value')] ngày."
  laamp_raid_contract_contract: "Đột kích Bắt Tù binh"
  laamp_raid_contract_desc_title: "Những kẻ cướp biên giới tàn nhẫn,"
  laamp_raid_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] tìm kiếm một thủ lĩnh táo bạo, sở hữu kỹ năng bắt giữ con tin còn sống, để gửi một thông điệp đến kẻ thù của [TaskContract.GetEmployer.GetHerHis]..."
  laamp_help_claimant_contract_contract: "Ép Buộc Yêu sách"
  laamp_help_claimant_contract_desc_title: "Những người theo đuổi chính nghĩa cao cả,"
  laamp_help_claimant_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] tìm kiếm những người ủng hộ tính chính danh: những ai sẵn sàng thúc đẩy yêu sách hợp pháp của [TaskContract.GetEmployer.GetHerHis] lên [TaskContract.MakeScope.Var('task_contract_title').Title.GetName] chống lại [TaskContract.MakeScope.Var('task_contract_target').Char.GetTitledFirstName]."
  laamp_steal_artifact_contract_contract: "Thu hồi Bảo vật"
  laamp_steal_artifact_contract_desc_title: "Những kẻ trộm lọc lõi,"
  laamp_steal_artifact_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] sẽ thưởng cho bất kỳ ai sẵn sàng mang về thứ vốn thuộc về [TaskContract.GetEmployer.GetHerHis] — [TaskContract.MakeScope.Var('task_contract_object').Artifact.GetName]."
  laamp_cultural_minority_contract_contract: "Bảo vệ Di sản"
  laamp_cultural_minority_contract_desc_title: "Hãy lắng nghe nỗi khổ của chúng Ta!"
  laamp_cultural_minority_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] tìm kiếm sự trợ giúp của những người đồng tộc [TaskContract.GetEmployer.GetCulture.GetCollectiveNoun] — hoặc bất kỳ ai sẵn sàng lên tiếng bảo vệ quyền lợi của họ trước [TaskContract.GetEmployer.GetLiege.GetName]."
  laamp_religious_minority_contract_contract: "Bảo hộ Tín đồ"
  laamp_religious_minority_contract_desc_title: "Công lý dưới [TaskContract.GetEmployer.GetFaith.PositiveAfterLife]!"
  laamp_religious_minority_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] tìm kiếm các tín đồ [TaskContract.GetEmployer.GetFaith.GetAdherentNamePlural] hoặc những người cảm thông: bất kỳ ai sẵn sàng thương lượng với [TaskContract.GetEmployer.GetLiege.GetName] để bảo vệ tôn giáo của họ."
  laamp_prison_break_contract_contract: "Vượt ngục"
  laamp_prison_break_contract_desc_title: "Những kẻ hành động lén lút,"
  laamp_prison_break_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] đang tìm kiếm một kẻ trơn tuột khó nắm bắt. Có một người thân đang bị giam giữ mà [TaskContract.GetEmployer.GetSheHe] rất mong được giải cứu."
  laamp_join_faction_contract_contract: "Ủng hộ Phe phái"
  laamp_join_faction_contract_desc_title: "Những kẻ bất đồng mọi tầng lớp,"
  laamp_join_faction_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] đã chán ngán sự cai trị của [TaskContract.GetTarget.GetNamePossessive]. [TaskContract.GetEmployer.GetSheHe|U] gửi lời mời công khai đến tất cả những ai chống đối [TaskContract.GetTarget.GetTitledFirstNameNoTooltip] gia nhập [TaskContract.MakeScope.Var('task_contract_faction').Faction.GetName]."
  laamp_join_faction_contract_request: "[task_contract|E] này yêu cầu Ngài phải gia nhập một [faction|E]"
  laamp_help_faith_conversion_contract_contract: "Nhiệm vụ Truyền giáo"
  laamp_help_faith_conversion_contract_desc_title: "Những môn đồ nhiệt thành của [TaskContract.GetEmployer.GetFaith.CreatorName],"
  laamp_help_faith_conversion_contract_desc: "[SelectLocalization(ObjectsEqual(TaskContract.GetEmployer,TaskContract.GetTarget.GetLiege),'laamp_council_task_contract_desc_liege','laamp_council_task_contract_desc_councillor')] truyền bá lời dạy của [TaskContract.GetEmployer.GetFaith.HighGodName] tại [TaskContract.GetLocation.GetName]. Các tín đồ có năng lực được hoan nghênh góp tiếng nói."
  laamp_help_faith_conversion_contract_request: "[task_contract|E] này yêu cầu Ngài phải [travel|E] đến một [county|E] đang có [convert_county|E]"
  laamp_fight_faith_conversion_contract_contract: "Dập tắt Truyền giáo"
  laamp_fight_faith_conversion_contract_desc_title: "Tín đồ đang bị uy hiếp!"
  laamp_fight_faith_conversion_contract_desc: "Những nhà truyền giáo của [TaskContract.MakeScope.Var('task_contract_councillor').Char.GetFaith.GetAdjectiveNoTooltip] đang quấy nhiễu các cộng đồng [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip]. Chúng Ta tìm kiếm một nhà đàm phán lão luyện hoặc một kẻ đe dọa đáng sợ để xử lý bọn dị giáo này."
  laamp_fight_faith_conversion_contract_request: "[task_contract|E] này yêu cầu Ngài phải [travel|E] đến một [county|E] đang có [convert_county|E] hoặc [realm_priest_possessive|E] [liege|E]"
  laamp_help_train_commanders_contract_contract: "Huấn luyện Kỵ sĩ"
  laamp_help_train_commanders_contract_desc_title: "Cựu binh cho thuê,"
  laamp_help_train_commanders_contract_desc: "[SelectLocalization(ObjectsEqual(TaskContract.GetEmployer,TaskContract.GetTarget.GetLiege),'laamp_council_task_contract_desc_liege','laamp_council_task_contract_desc_councillor')] mong muốn giữ cho các [TaskContract.GetEmployer.Custom('KnightCulturePluralNoTooltip')|l] của [TaskContract.GetEmployer.GetHerHis] luôn trong trạng thái sẵn sàng chiến đấu. Một chỉ huy hoặc kiếm sĩ dày dạn kinh nghiệm được tìm kiếm để truyền đạt kiến thức."
  laamp_help_train_commanders_contract_request: "[task_contract|E] này yêu cầu Ngài sử dụng $task_contract_train_knight_interaction$ [character_interaction|E] lên [contractor_possessive|E] [knights|E]"
  task_contract_train_knight_interaction: "Huấn luyện Kỵ sĩ"
  task_contract_train_knight_interaction_desc: "Một buổi huấn luyện nhằm cải thiện [prowess|E] hoặc dạy [commander_trait|E] cho các [recipient.Custom('KnightCulturePlural')] của [recipient.GetFirstNamePossessive]"
  recipient_secondary_task_contract_train_knight_interaction: "Người được huấn luyện"
  task_contract_train_knight_interaction.tt: "Có cơ hội tăng [prowess|E] hoặc học được một [commander_trait|E]"
  laamp_help_find_secrets_contract_contract: "Những Con Mắt Trong Bóng Tối"
  laamp_help_find_secrets_contract_desc_title: "Suỵt!"
  laamp_help_find_secrets_contract_desc: "Cần một người quan sát tinh tường tại [TaskContract.GetLocation.GetName]. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] muốn theo dõi [TaskContract.GetEmployer.GetHerHis] các láng giềng  cùng những hành động của họ. [TaskContract.GetEmployer.GetSheHe|U] chỉ đơn thuần là tò mò... Ngài chỉ cần biết vậy thôi."
  laamp_help_find_secrets_contract_request: "[task_contract|E] này yêu cầu Ngài hoàn thành một [scheme|E] dạng [GetScheme('laamp_help_find_secrets_scheme').GetTypeName]"
  laamp_help_fabricate_claim_contract_contract: "Những Yêu Sách Bị Lãng Quên"
  laamp_help_fabricate_claim_contract_desc_title: "Các học giả uyên thâm,"
  laamp_help_fabricate_claim_contract_desc: "$laamp_council_task_contract_desc_liege$ là chủ sở hữu hợp pháp của [TaskContract.MakeScope.Var('task_contract_destination').Province.GetName]. [TaskContract.GetEmployer.GetSheHe|U] chỉ đơn giản là đã làm thất lạc bằng chứng! Hãy khôi phục những quyền lợi cổ xưa này, và Ngài sẽ được đền đáp bằng lòng biết ơn bất diệt."
  laamp_council_task_contract_desc_liege: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip]"
  laamp_council_task_contract_desc_councillor: "Thưa bệ hạ, [TaskContract.GetTarget.GetName],"
  laamp_help_fabricate_claim_contract_request: "[task_contract|E] này yêu cầu Ngài hoàn thành một [scheme|E] dạng [GetScheme('generate_claim').GetTypeName]"
  laamp_help_increase_control_contract_contract: "Chống Tham Nhũng"
  laamp_help_increase_control_contract_desc_title: "Những kẻ cầm dùi cui,"
  laamp_help_increase_control_contract_desc: "[TaskContract.GetTarget.GetPrimaryTitle.GetNameNoTierNoTooltip] đang bị hoành hành bởi thổ phỉ, quan lại cho vay nặng lãi và nông dân hoảng loạn. Bất kỳ ai sẵn sàng giữ cho tất cả bọn họ vào khuôn khổ đều sẽ được tưởng thưởng."
  laamp_help_increase_control_contract_request: "[task_contract|E] này yêu cầu Ngài phải [travel|E] đến các [counties|E] của [contractor_possessive|E] có [county_control|E] thấp"
  laamp_transport_contract.transport_failed: "Hợp Đồng Thất Bại"
  laamp_transport_contract.success: "Hợp Đồng Hoàn Thành"
  laamp_transport_contract.success_late: "Hợp Đồng Hoàn Thành Muộn"
  laamp_transport_contract.contract_completion_limit: "Hợp Đồng Quá Hạn"
  complete_task_contract_interaction: "Du Hành Để Hoàn Thành Hợp Đồng"
  complete_task_contract: "Du Hành Để Hoàn Thành Hợp Đồng"
  with_domicile: "Du Hành Cùng Doanh Trại"
  without_domicile: "Du Hành Không Có Doanh Trại"
  contract_event_prefix: "Hợp Đồng:"
  ep3_contract_event.0001.t: "Hợp Đồng Vận Chuyển:"
  ep3_contract_event.0001.t_vip: "$ep3_contract_event.0001.t$ $laamp_transport_vip_contract$"
  ep3_contract_event.0001.t_child: "$ep3_contract_event.0001.t$ $laamp_transport_ward_contract$"
  ep3_contract_event.0001.t_explorer: "$ep3_contract_event.0001.t$ $laamp_transport_explorer_contract$"
  ep3_contract_event.0001.t_artifact: "$ep3_contract_event.0001.t$ $laamp_transport_artifact_contract$"
  ep3_contract_event.0001.t_gold: "$ep3_contract_event.0001.t$ $laamp_transport_gold_contract$"
  ep3_contract_event.0001.t_animal: "$ep3_contract_event.0001.t$ $laamp_transport_animal_contract$"
  ep3_contract_event.0001.t_construction: "$ep3_contract_event.0001.t$ $laamp_construction_contract_contract$"
  ep3_contract_event.0001.desc: "Một phái đoàn từ [task_contract_employer.GetName] ung dung bước qua những tấm bạt của đại trướng ta.\n\n\"Chào ngài, nhà mạo hiểm!\" một sứ giả cất lời. \"Đường xá trên đời thì nhiều, mà hiểm nguy cũng lắm: nếu ngài chịu làm việc cho [task_contract_employer.GetPrimaryTitle.GetNameNoTier], chủ thượng của Ta sẵn sàng trả hậu hĩnh cho chuyên môn của ngài.\"\n\n"
  ep3_contract_event.0001.desc_intro_explorer: "Để mặc con la chở nặng của [task_contract_employer.GetHerHis] thở phì phò bên ngoài, [task_contract_employer.GetName] được mời vào trướng của ta.\n\n\"Xin chào! Người ta đồn rằng ngài là một [ROOT.Char.GetWomanMan] từng trải khắp thế gian: liệu có đủ gan dạ để cùng Ta chu du những miền xa xôi không?\"\n\n"
  ep3_contract_event.0001.desc_vip: "\"Ta, [task_contract_object.GetName], là  Bề Tôi trung thành của [task_contract_employer.GetTitleAsNameNoTooltip]. Chính lời nhắn của [task_contract_employer.GetHerHis] mà ta phải mang đến [task_contract_destination.GetTitle.GetNameNoTier], tới đại sảnh của [task_contract_target.GetTitledFirstName]. Hãy dẫn đường, bảo vệ ta, và bảo đảm bức thư này không rơi vào mắt kẻ tò mò!\""
  ep3_contract_event.0001.desc_artifact: "\"Bảo vật quý giá [escorted_artifact.GetName] của [task_contract_employer.GetHerHis|U] sẽ được giao cho ngươi. Hãy mang nó tới [task_contract_destination.GetTitle.GetName], nơi [task_contract_target.GetTitledFirstName] ngự trị, bởi [escorted_artifact.GetNameNoTooltip] đã được hứa làm một món quà vương giả. Và hãy nhớ! Nếu thánh vật này không đến nơi, hậu quả sẽ vô cùng nghiêm trọng.\""
  ep3_contract_event.0001.desc_child: "\"'Hãy bảo vệ [task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)]!' [task_contract_employer.GetTitleAsNameNoTooltip] ra lệnh. [task_contract_object.Custom('GirlBoy')] này sẽ nhận được một nền giáo dục không giống bất kỳ ai tại [task_contract_destination.GetTitle.GetNameNoTier], nơi vị hiền giả [task_contract_target.GetTitledFirstName] đang chờ đợi [task_contract_object.GetHerHim]. Hãy giữ đứa trẻ này luôn bên cạnh ngươi: số phận của [task_contract_object.GetHerHis] sẽ đóng vai trò quan trọng trong tương lai của [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip]!\""
  ep3_contract_event.0001.desc_gold: "\"Chúng Ta mang theo một rương lớn đầy châu báu, hương liệu và kim loại quý. Ngươi phải mang nó tới [task_contract_destination.GetTitle.GetNameNoTier] và long trọng dâng lên [task_contract_target.GetTitledFirstName]. Một món quà xa hoa như vậy sẽ khiến [task_contract_target.GetTitleAsNameNoTooltip] mắc nợ sâu sắc với chủ thượng của ta: nó phải được canh giữ cẩn mật.\""
  ep3_contract_event.0001.desc_explorer: "\"Làm ơn, hãy đưa ta đến [task_contract_destination.GetTitle.GetName]. Bảo vệ ta trên đường đi và ta sẽ hậu tạ ngươi bằng vàng bạc!\""
  ep3_contract_event.0001.desc_explorer_intro: "\"Ta nghe nói rằng [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName]"
  ep3_contract_event.0001.desc_capitals: "\"Khách lữ hành ca tụng [task_contract_destination.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetDefinitiveName] là nơi có một kinh đô nguy nga và mỹ lệ bậc nhất vùng.\""
  ep3_contract_event.0001.desc_special_buildings_martial: "$ep3_contract_event.0001.desc_explorer_intro$ là minh chứng hùng mạnh cho những vinh quang quân sự thuở trước."
  ep3_contract_event.0001.desc_special_buildings_learning: "$ep3_contract_event.0001.desc_explorer_intro$ là trung tâm học thuật vĩ đại và kho tàng tri thức."
  ep3_contract_event.0001.desc_special_buildings_religious: "$ep3_contract_event.0001.desc_explorer_intro$ là nơi hiếm hoi mà khách viếng thăm thực sự cảm nhận được sự hiện diện của thần linh."
  ep3_contract_event.0001.desc_special_buildings_diplomatic: "$ep3_contract_event.0001.desc_explorer_intro$ là chốn quyền lực lẫy lừng, chỉ nên tiếp cận bằng sự kính cẩn và lễ nghi."
  ep3_contract_event.0001.desc_special_buildings_economic: "$ep3_contract_event.0001.desc_explorer_intro$ là nguồn phú quý lớn lao, được thương nhân khắp nơi biết đến."
  ep3_contract_event.0001.desc_grand_city: "\"Ta mong được viếng thăm một đại đô thị, thiên đường phồn hoa với những công dân kiêu hãnh, đường phố rộng lớn và chợ búa nhộn nhịp.\""
  ep3_contract_event.0001.desc_special_buildings_wonder: "$ep3_contract_event.0001.desc_explorer_intro$ là một kỳ quan đích thực — cảnh tượng mà nhiều người cho là mang màu sắc huyền diệu."
  ep3_contract_event.0001.desc_mausoleum_at_halicarnassus: "\"Nghe nói $TRAVEL_POINT_OF_INTEREST_TT_poi_mausoleum_at_halicarnassus$ là bia mộ sừng sững của một vị quân vương thời cổ, không giống bất cứ công trình nào do người đời nay xây dựng...\""
  ep3_contract_event.0001.desc_lighthouse_of_alexandria: "\"Còn ngọn hải đăng nào tự hào hơn $TRAVEL_POINT_OF_INTEREST_TT_poi_lighthouse_of_alexandria$, soi sáng Địa Trung Hải? Ta muốn tận mắt ngắm nhìn ánh sáng cao vút ấy.\""
  ep3_contract_event.0001.desc_natural_feature: "$ep3_contract_event.0001.desc_explorer_intro$ là một trong những tạo tác tuyệt mỹ nhất của [task_contract_employer.GetFaith.HighGodNamePossessive], một cảnh tượng khiến người ta nghẹt thở."
  ep3_contract_event.0001.desc_animal: "\"[task_contract_employer.Custom('CatOrDogStoryName')], thú cưng được [task_contract_employer.GetTitleAsNameNoTooltip] vô cùng trân quý, đã khiến trái tim của [task_contract_target.GetTitledFirstName] rung động. Vì thế, chủ thượng của ta đã hào phóng đồng ý gửi sinh vật ấy tới [task_contract_destination.GetTitle.GetNameNoTier]. Ta có thể giao phó sự an toàn của bé [task_contract_employer.Custom('CatOrDogStoryName')] cho ngươi chứ?\""
  ep3_contract_event.0001.desc_construction: "\"[task_contract_employer.GetTitleAsNameNoTooltip] đang xây dựng một [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName] tại [task_contract_destination.GetTitle.GetNameNoTier] và đang chờ một chuyến hàng gỗ đá. Khi ngươi đến công trường, chúng ta có thể bàn thêm những nghĩa vụ khác.\""
  ep3_contract_event.0001.vip: "[task_contract_object.GetTitledFirstNameNoTooltip] sẽ được hộ tống an toàn và nhanh chóng!"
  ep3_contract_event.0001.child: "[task_contract_object.GetNameNoTooltip] sẽ được chăm sóc chu đáo."
  ep3_contract_event.0001.explorer: "[task_contract_destination.GetNameNoTooltip], thật huy hoàng! Lên đường thôi!"
  ep3_contract_event.0001.artifact: "Ta sẽ trông coi bảo vật này cẩn thận."
  ep3_contract_event.0001.gold: "Ta sẽ mang theo chiếc rương này luôn trong tầm mắt."
  ep3_contract_event.0001.animal: "[task_contract_employer.Custom('CatOrDogStoryName')] sẽ được đặt trên chiếc gối lụa."
  ep3_contract_event.0001.construction: "Ta sẽ giao vật liệu ngay lập tức."
  ep3_contract_event.0001.with_domicile: "Toàn bộ doanh trại của ta sẽ di chuyển đến [task_contract_destination.GetNameNoTooltip]."
  ep3_contract_event.0001.with_domicile.tt: "Di chuyển doanh trại tới [task_contract_destination.GetNameNoTooltip] sẽ tốn [provisions_i][provisions|E]"
  ep3_contract_event.0001.invalidate: "Ta không muốn nhận hợp đồng này."
  ep3_contract_event.0001.tt_vip: "Ngài sẽ hộ tống [task_contract_object.GetName] đến triều đình của [task_contract_target.GetName] tại [task_contract_destination.GetName]"
  ep3_contract_event.0001.tt_ward: "Ngài sẽ đưa [task_contract_object.GetName] tới [task_contract_destination.GetName] và đảm bảo [task_contract_object.GetHerHis] bắt đầu việc giáo dục."
  ep3_contract_event.0001.tt_explorer: "Ngài sẽ cùng nhà thám hiểm [task_contract_object.GetName] du hành tới [task_contract_destination.GetName]"
  ep3_contract_event.0001.tt_gold: "Ngài sẽ mang quà tặng của [task_contract_employer.GetNamePossessive] tới [task_contract_destination.GetName] và trao cho [task_contract_target.GetName]."
  ep3_contract_event.0001.tt_animal: "Ngài sẽ hộ tống [task_contract_employer.Custom('CatOrDogStoryName')] tới [task_contract_target.GetName]"
  ep3_contract_event.0001.tt_artifact: "Ngài sẽ mang [escorted_artifact.GetNameNoTooltip] của [task_contract_employer.GetNamePossessive] tới [task_contract_destination.GetName] và tặng cho [task_contract_target.GetName]"
  ep3_contract_event.0001.tt_construction: "Ngài sẽ mang vật liệu xây dựng tới [task_contract_destination.GetName] và giao cho [task_contract_employer.GetName]"
  ep3_contract_event.0001.tt_increase_control: "Ngài sẽ tới một [county|E] thuộc [task_contract_councillor_liege.GetPrimaryTitle.GetAdjective] có [county_corruption|E] hoặc [county_control|E] thấp"
  ep3_contract_event.0003.t: "$contract_event_prefix$ Đột Kích Bắt Tù Binh"
  ep3_contract_event.0003.desc: "$ep3_contract_event.0001.desc$ Kẻ thù không đội trời chung của [task_contract_employer.GetHerHis|U], [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName], gần đây đã trở thành một mối đe dọa. Chủ nhân của ta muốn ngươi khiến [task_contract_target.GetHerHim] bớt ngạo mạn hơn bằng cách bắt giữ binh lính của [task_contract_target.GetHerHis]."
  ep3_contract_event.0003.a: "Giương cao cờ hiệu! Lập tức xuất quân!"
  ep3_contract_event.0003.b: "$ep3_contract_event.0001.invalidate$"
  ep3_contract_event.0004.opening: "[task_contract_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ep3_contract_event.0004.opening_failure: "[task_contract_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  ep3_contract_event.0004.desc: "Những nỗ lực kiên cường của ngươi trong cuộc chiến của ta thật đáng trân trọng! Hãy tận hưởng số vàng xứng đáng này, hỡi [ROOT.Char.GetWomanMan] tốt bụng!"
  ep3_contract_event.0004.desc_failure: "Danh tiếng quân sự của ngươi đã bị thổi phồng quá mức. Ngươi đã phá vỡ hợp đồng với ta — thật đáng xấu hổ!"
  ep3_contract_event.0004.a: "Tốt hơn là ta không nên hỏi [task_contract_employer.GetSheHe] sẽ làm gì với họ."
  ep3_contract_event.0004.b: "Ta chỉ là không gặp may thôi..."
  ep3_contract_event.0004.success: "Các tù binh đã được chuyển tới [prison|E] của [task_contract_employer.GetNamePossessive]:"
  ep3_contract_event.0005.t: "$contract_event_prefix$ $laamp_treasure_hunting_contract_contract$"
  ep3_contract_event.0005.desc: "$ep3_contract_event.0001.desc$\"[task_contract_employer.GetNameNoTooltip] ấp ủ một tầm nhìn lớn về việc sưu tập các món đồ thủ công từ những miền đất xa lạ. Tuy nhiên, [task_contract_employer.GetHerHis] trách nhiệm không cho phép trì hoãn, vì vậy [task_contract_employer.GetSheHe] trao cho ngươi cơ hội chu du khắp thế gian để tìm một cổ vật phù hợp cho bộ sưu tập của [task_contract_employer.GetHerHis].\""
  ep3_contract_event.0005.a: "Ta nên chọn địa điểm ngay thôi!"
  ep3_contract_event.0005.a_tt: "Mở [decision|E] $treasure_hunting_contract_decision$"
  ep3_contract_event.0005.b: "$ep3_contract_event.0001.invalidate$"
  ep3_contract_event.0006.t: "$ep3_contract_event.0005.t$"
  ep3_contract_event.0006.desc: "Ta đến [task_contract_destination.GetName], ghé thăm [task_contract_destination.Custom('GetGuildType')] địa phương để dò hỏi về những món kỳ vật trong vùng... nhưng không thu được gì. Ta ghé qua"
  ep3_contract_event.0006.desc_locals: "quán rượu, nơi ta vô tình nghe được một cuộc trò chuyện đáng ngờ giữa hai kẻ nhiều chuyện.\n\n\"Ta nói cho ngươi nghe này, [local_2.GetFirstName]: [newly_created_artifact.GetName] được giấu trong [task_contract_destination.GetTerrain.GetNameNoTooltip|l] của chúng ta! Và ta biết nó ở đâu!\" một người trong số [local_1.GetCulture.GetCollectiveNounNoTooltip] thì thầm.\n\n\"Suỵt, [local_1.GetFirstName]. Có người đang nhìn kìa...\" kẻ kia rít lên, ra hiệu về phía ta."
  ep3_contract_event.0006.desc_locals_temple: "[task_contract_destination.Custom('GetLocationFaithTemple')].\n\n\"Chào mừng, lữ khách!\" vị [local_1.GetFaith.PriestNeuter] địa phương lên tiếng. \"Nghe nói ngươi đang tìm kiếm châu báu trần thế. Ừm... ta có thể biết chút ít về [newly_created_artifact.GetName].\"\n\n\"Nhưng chỉ khi ngươi nhận được ân sủng của [local_1.GetFaith.WealthGodName]...\""
  ep3_contract_event.0006.desc_locals_city: "khu chợ, nơi một tay buôn túm lấy ta ngay cổng vào.\n\n\"Chào ngài, lữ khách! Ôi, trông ngài đúng là một thương nhân sành sỏi. Tình cờ thay, ta có mọi thứ ngài cần, từ đầu tới chân! Ngài có hứng thú với một món hàng đặc biệt không... [newly_created_artifact.GetName]?\""
  ep3_contract_event.0006.desc_locals_castle: "cổng của [task_contract_destination.GetHolding.GetType.GetName|l], nơi ta để ý thấy hai người dân địa phương.\n\n\"Ta không lừa ngươi đâu, [local_2.GetFirstName]! Gia tộc [local_ruler.GetDynastyHouseName] đã có được [newly_created_artifact.GetName]! Ta vừa thấy họ mang nó vào [local_ruler.Custom('ResidenceBuilding')],\" người thứ nhất, thuộc [local_1.GetCulture.GetNameNoTooltip], nói.\n\n\"Sẽ không dễ đâu, [local_1.GetFirstName]... nhưng biết đâu #EMP chúng ta#! có thể lấy được,\" người kia đáp lại, ánh mắt [local_2.GetHerHis] lấp lánh."
  ep3_contract_event.0006.castle: "\"Xin lỗi, nhưng có lẽ chúng ta có thể hợp tác?\""
  ep3_contract_event.0006.castle_won: "Ngài đã thành công lấy được món đồ"
  ep3_contract_event.0006.castle_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] lừa Ngài và tẩu thoát cùng [newly_created_artifact.GetNameNoTooltip]"
  ep3_contract_event.0006.castle_lost: "[local_1.GetShortUIName] Giành Được Cổ Vật"
  ep3_contract_event.0006.church: "\"Ta xứng đáng, ta sẽ chứng minh điều đó!\""
  ep3_contract_event.0006.church_won: "Ngài chứng minh được lòng mộ đạo và lấy được món đồ"
  ep3_contract_event.0006.church_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] không tin rằng Ngài đủ mộ đạo"
  ep3_contract_event.0006.church_lost: "[local_1.GetShortUIName] Cho Rằng Ngài Bất Kính"
  ep3_contract_event.0006.city: ""Hạ giá xuống thì ta chốt!""
  ep3_contract_event.0006.city_won: "Ngài thuyết phục được [local_1.GetShortUIName] hạ giá"
  ep3_contract_event.0006.city_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] không còn muốn bán cho Ngài nữa"
  ep3_contract_event.0006.city_lost: "[local_1.GetShortUIName] Từ chối đề nghị"
  ep3_contract_event.0006.buy: ""Ta trả được, rất hậu hĩnh!""
  ep3_contract_event.0006.buy_won: "Ngài đưa ra một đề nghị thuyết phục và mua được món đồ"
  ep3_contract_event.0006.buy_lost_desc: "$ep3_contract_event.0006.city_lost_desc$"
  ep3_contract_event.0006.buy_lost: "$ep3_contract_event.0006.city_lost$"
  ep3_contract_event.0006.intimidate: ""Giao nó cho ta, #EMP NGAY!#!"
  ep3_contract_event.0006.intimidate_won: "Ngài uy hiếp [local_1.GetTitledFirstNameNoTooltip] buộc họ giao ra món đồ"
  ep3_contract_event.0006.intimidate_lost_desc: "[local_1.GetTitledFirstNameNoTooltip] vẫn giữ cổ vật"
  ep3_contract_event.0006.intimidate_lost: "[local_1.GetShortUIName] Không hề sợ Ngài"
  ep3_contract_event.0006.library: "Ta sẽ tìm chỗ khác. Chắc chắn phải có thứ gì đó!"
  ep3_contract_event.0006.library_won: "Ngài tìm kiếm một cổ vật khác"
  ep3_contract_event.0006.library_lost_desc: "Ngài không tìm thấy gì hữu ích và rời đi tay trắng."
  ep3_contract_event.0006.library_lost: "Ngài rời đi tay trắng"
  ep3_contract_event.0006.library.tt: "Ngài sẽ trở thành chủ sở hữu của một [artifact|E] khác"
  ep3_contract_event.0006.explore: "Tự mình làm còn hơn. Ít nhất giờ ta biết nơi này có kho báu."
  ep3_contract_event.0006.explore_won: "$ep3_contract_event.0006.library_won$"
  ep3_contract_event.0006.explore_lost_desc: "Ngài không tìm thấy bất kỳ dấu vết cổ vật nào và rời đi tay trắng"
  ep3_contract_event.0006.explore_lost: "Ngài không tìm thấy gì"
  ep3_contract_event.0006.explore.tt: "$ep3_contract_event.0006.library.tt$"
  ep3_contract_event.0007.t: "$ep3_contract_event.0005.t$"
  ep3_contract_event.0007.desc_castle_castle: "Chúng ta ra tay lúc nửa đêm. Dưới bầu trời đen kịt, chúng ta lẻn vào [task_contract_destination.GetHolding.GetType.GetName|l] mà không bị phát hiện. Nhờ sự chỉ dẫn của [local_1.GetFirstNamePossessive], chúng ta nhanh chóng tìm ra [newly_created_artifact.GetName]. Tuy nhiên — trên đường rút lui — lính gác đã phát hiện ra! Ta chộp lấy cổ vật và bỏ chạy khi quân lính từ khắp nơi đổ tới. Đồng bọn của Ta và Ta bị tách ra.\n\nSau một cuộc truy đuổi dài, Ta trốn được vào bóng tối phía sau tường thành. Từ xa, Ta nghe thấy giọng thở dốc của [local_2.GetFirstName]:\n\n\"[ROOT.Char.GetSheHe|U] đã đánh cắp thứ vốn thuộc về chúng ta. Đồ khốn kiếp!\""
  ep3_contract_event.0007.desc_church_church: "Ta quỳ xuống và bắt đầu đọc những câu kinh từ [local_1.GetFaith.ReligiousText].\n\n\"Ta đã thấy và nghe đủ rồi. Ngươi hẳn là một [ROOT.Char.GetWomanMan] của [local_1.GetFaith.HighGodName]!\" [local_1.GetName] ca ngợi, rõ ràng rất ấn tượng. \"Ngươi không cần tìm đâu xa nữa. Ta ban cho ngươi [newly_created_artifact.GetName]. Hãy gìn giữ nó cẩn thận, vì đây không chỉ là món quà của ta, mà còn của [local_1.GetFaith.HighGodName]!\""
  ep3_contract_event.0007.desc_city_city: "\"Giá của ngài quá cao... còn ta chỉ là một kẻ lữ hành nghèo khổ,\" ta cố gắng thương lượng. \"Ta còn phải trả tiền cho thuộc hạ của mình và cho ngựa ăn. Đây — là tất cả những gì ta có thể chi trả. Chúng ta có thể đạt được thỏa thuận chứ?\"\n\n[local_1.GetFirstName] dường như không tin lời ta, nhưng [local_1.GetSheHe] là một người buôn bán giàu kinh nghiệm, nên [local_1.GetSheHe] nhanh chóng đưa ra lời đề nghị ngược lại. \"Ta sẽ nhận từng đó, được thôi. Nhưng trước tiên ta cần cho ngài xem thứ này.\" [local_1.GetSheHe|U] lấy ra một [newly_created_artifact.GetName]. \"Hãy nhìn vẻ đẹp #EMP này#! Một lời đề nghị giới hạn, chỉ dành riêng cho ngài. Ta sẵn lòng bán cả hai với một mức giá hợp lý!\""
  ep3_contract_event.0007.desc_castle_buy: "[local_1.GetFirstName] và [local_2.GetFirstName] tranh luận với nhau một lúc.\n\n\"Đây là một rủi ro nghiêm trọng mà chúng ta phải gánh chịu... nhưng cũng là một lời đề nghị hào phóng. Ngài có thể lấy báu vật của chúng ta, #EMP nếu#! chúng ta lấy được nó.\"\n\nĐêm đó, ta đến điểm hẹn bên ngoài lâu đài, và nghe thấy một tiếng náo động lớn phía sau bức tường. [local_1.GetFirstNameNoTooltip] và [local_2.GetFirstNameNoTooltip] trượt xuống những phiến đá phía trên ta.\n\n\"Chạy đi! Chúng ta có khách rồi!\" [local_1.GetFirstNameNoTooltip] hét lên khi [local_1.GetSheHe] chạy ngang qua ta. Chúng ta lao vào [task_contract_destination.GetTerrain.GetName|l], cho đến khi tìm được một nơi an toàn.\n\n\"Ta nghĩ ngài nợ chúng ta gấp đôi,\" [local_2.GetFirstNameNoTooltip] nói, vẫn đang cố lấy lại hơi thở."
  ep3_contract_event.0007.desc_city_buy: "\"Thật là một đề nghị hào phóng! Xin hãy nhận lấy [newly_created_artifact.GetName]! Rất hân hạnh được làm ăn với ngài!\" [local_1.GetFirstName] dường như choáng ngợp trước lời đề nghị của ta.\n\nCó lẽ, ta đã có thể mặc cả được giá tốt hơn...? Lần sau, ta phải kiên nhẫn hơn..."
  ep3_contract_event.0007.desc_church_buy: "\"Ta là một [ROOT.Char.GetWomanMan] của [ROOT.Char.GetFaith.HighGodName] và chỉ có [ROOT.Char.GetFaith.HighGodName] mới có thể phán xét ta!\" ta hét lên, mạnh mẽ phản bác [local_1.GetFaith.PriestNeuter]. \"Nhưng ta đưa ra cho ngươi một lợi ích ngay lập tức: tiền bạc!\"\n\n\"Ngươi thực sự đang cố gắng hối lộ một người hầu của [local_1.GetFaith.HighGodName] sao...?\" [local_1.GetFirstName] trả lời, ban đầu cảm thấy bị xúc phạm, nhưng càng nhìn chằm chằm vào túi bạc, [local_1.GetSheHe] càng khó cưỡng lại.\n\n\"Chúng ta #EMP thực sự cần#! sửa chữa mái của [task_contract_destination.Custom('GetLocationFaithTemple')]. Hãy lấy [newly_created_artifact.GetName] và đừng bao giờ nhắc đến giao dịch của chúng ta!\""
  ep3_contract_event.0007.desc_castle_intimidate: ""Ngươi nghĩ mình là ai chứ?" [local_1.GetFirstName] cười khẩy đầy ngạo mạn. "Bọn ta đông gấp đôi các ngươi!"\n\n"Ngươi chắc chứ?" ta đáp, ra hiệu cho người của mình bao vây chúng. "Giờ thì, làm ơn... đưa cho ta [newly_created_artifact.GetName]."\n\nChúng ta gặp lại vào đêm hôm sau. [local_1.GetFirstNameNoTooltip] và [local_2.GetFirstName] trông mệt mỏi và bại trận.\n\n"Suýt nữa thì bọn ta bị bắt ở đó. Hy vọng món cổ vật này có ý nghĩa lớn với ngươi!" một kẻ nói, vừa nhăn nhó đau đớn vừa trao phần thưởng cho ta."
  ep3_contract_event.0007.desc_city_intimidate: "Ta ra hiệu cho thuộc hạ xông vào cửa tiệm của người bán, nhanh chóng áp đảo người chủ tiệm đơn độc.\n\n"Làm ơn, Ta chỉ là người làm công! Ta còn phải nuôi gia đình và đây là tất cả tài sản của Ta!" [local_1.GetFirstName] van xin.\n\n"[follower.GetFirstName], cho [local_1.GetHerHim] thấy là chúng ta không đùa đâu!" ta ra lệnh cho tên tay sai mình chọn, và [follower.GetSheHe] với tay về một chiếc kệ chênh vênh chất đầy hàng hóa mong manh. Ngay khi [follower.GetSheHe] sắp lật đổ quầy hàng, người bán lao [local_1.GetHerselfHimself] ra chắn đường.\n\n"Xin ngài, dừng lại đi! Cứ lấy thứ các ngài muốn rồi rời đi!""
  ep3_contract_event.0007.desc_church_intimidate: ""[follower.GetFirstName]! Ở đây có một kẻ cứng đầu!" ta gọi lớn với thuộc hạ. Chúng ùa vào [task_contract_destination.Custom('GetLocationFaithTemple')].\n\n"Làm ơn, hãy tôn trọng chốn thiêng liêng này! Tránh ra!" [local_1.GetFirstName] van nài. Nhưng đã quá muộn. Đồng bọn của ta được thả lỏng, vơ vét lễ vật, chỉ chực chờ cướp phá và tàn phá mọi thứ có thể. Hoàn toàn lép vế cả về số lượng lẫn thế lực, [local_1.GetNameNoTooltip] đành khuất phục.\n\n"Được rồi, được rồi! Lấy [newly_created_artifact.GetName] đi, lũ ngoại đạo! Nhưng hãy tha cho nơi linh thiêng này.""
  ep3_contract_event.0007.desc_library: ""Cảm ơn lời đề nghị, nhưng liệu ông có biết nơi nào có điền trang bị bỏ hoang hay một pháo đài không còn sử dụng không...?" ta hỏi, rồi sớm thuyết phục được [local_1.GetFirstName] miễn cưỡng chỉ đường đến một đại sảnh đổ nát.\n\nKhi bước vào bên trong, ta hoàn toàn sững sờ trước số lượng sách cổ rải rác khắp các căn phòng phủ đầy mạng nhện. Ta dành cả đêm để lục soát chúng. Rồi, chôn sâu dưới hầm rượu, ta phát hiện một tấm bản đồ viết tay — trên đó, một dấu 'X' đánh dấu một vị trí gần đó!\n\nTa và người của mình tới nơi lúc bình minh. Sau vài nhát xẻng, [follower.GetFirstName] gọi ta lại.\n\n"Một chiếc rương! Bên trong đầy tiền xu! Và đây là gì nữa? Một mảnh giấy gọi nó là '[newly_created_artifact.GetName].'"
  ep3_contract_event.0007.desc_explore: "Thay vì dựa vào cái miệng lẻo mép của [local_1.GetFirstName] và vài lời đồn kỳ quặc, ta quyết định quay lại một tòa nhà trông như đã bị bỏ hoang.\n\nĐầu tiên, chúng ta chặt phá khu vườn um tùm; rồi chịu đựng mùi ẩm mốc nồng nặc trong các gian phòng. Ít nhất thì có thể chắc chắn nơi này không có người ở. Để bao quát nhanh nhất có thể, đồng bọn của ta tản ra. Một lúc sau, [follower.GetFirstName] gọi ta vào phòng ngủ chính:\n\n"Cái này ở dưới gầm giường," [follower.GetSheHe] nói, chỉ vào một chiếc rương gỉ sét. "Đầy ắp tiền xu! Và chẳng lẽ đây là — [newly_created_artifact.GetName]?"
  ep3_contract_event.0007.a: "Tại sao ta lại không giữ nó cho riêng mình chứ?"
  ep3_contract_event.0007.b: "Hoàn hảo! Gửi nó cho [task_contract_employer.GetTitledFirstNameNoTooltip]."
  ep3_contract_event.0007.castle: ""Khoan, không phải như vậy. Ta vẫn đứng về phía ngươi!""
  ep3_contract_event.0007.castle_buy: ""Đồng ý, nhưng chỉ khi ngươi gia nhập cùng ta.""
  ep3_contract_event.0007.city_city: "Ta sẽ lấy tất cả."
  ep3_contract_event.0008.t: "$contract_event_prefix$ $laamp_join_war_contract_contract$"
  ep3_contract_event.0008.desc: "Một nhóm kỵ sĩ nhỏ với dáng vẻ mệt mỏi dừng lại trước trại của ta, và một trong số họ bước vào đại trướng.\n\n"Ta là đội trưởng của toán trinh sát [task_contract_employer.GetPrimaryTitle.GetAdjective], và ta đại diện cho [task_contract_employer.GetTitledFirstName]," người lính mở lời. "Chủ thượng của ta rất quan tâm đến nhóm chiến binh gan lì của ngươi."\n\n"Một [task_contract_war.Custom('WarCasusBelliShort')] khiến [task_contract_employer.GetTitleAsNameNoTooltip] mất ăn mất ngủ. Kẻ thù của chúng ta chống trả quyết liệt — vì vậy ta được phái đến để thuê kiếm của các ngươi! Các ngươi có sẵn sàng mang tinh thần chiến đấu của mình đến cho [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip] không?""
  ep3_contract_event.0008.a: "Nghe như một chính nghĩa! Ta sẽ trợ giúp [task_contract_employer.GetHerHim]."
  ep3_contract_event.0008.b: "$ep3_contract_event.0001.invalidate$"
  join_war_contract.employer_military_strength: "Sức mạnh quân sự của Đồng minh: [task_contract_employer.GetMilitaryStrengthText|P]"
  join_war_contract.target_military_strength: "Sức mạnh quân sự của Kẻ địch: [task_contract_target.GetMilitaryStrengthText|N]"
  ep3_contract_event.0009.t: "$contract_event_prefix$ $laamp_steal_artifact_contract_contract$"
  ep3_contract_event.0009.desc: "$ep3_contract_event.0001.desc$"[task_contract_employer.GetTitledFirstNameNoTooltip] là chủ nhân hợp pháp của [task_contract_object.GetName], hiện đang bị tên [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName] giữ làm con tin. Chủ thượng của ta muốn ngươi đoạt lại nó — bằng mọi giá!"" 
  ep3_contract_event.0009.a: "Khôn ngoan đấy! Sẽ không ai nghi ngờ #EMP ta#!."
  ep3_contract_event.0009.b: "$ep3_contract_event.0001.invalidate$"
  ep3_contract_event.0009.open_start_stealing_back_artifact: "Mở [character_interaction|E] để bắt đầu [scheme|E] [GetScheme('steal_back_artifact').GetTypeName]"
  ep3_contract_event.0011.t_vip: "$ep3_contract_event.0001.t_vip$"
  ep3_contract_event.0011.t_child: "$ep3_contract_event.0001.t_child$"
  ep3_contract_event.0011.t_explorer: "$ep3_contract_event.0001.t_explorer$"
  ep3_contract_event.0011.t_artifact: "$ep3_contract_event.0001.t_artifact$"
  ep3_contract_event.0011.t_gold: "$ep3_contract_event.0001.t_gold$"
  ep3_contract_event.0011.t_animal: "$ep3_contract_event.0001.t_animal$"
  ep3_contract_event.0011.t_construction: "$ep3_contract_event.0001.t_construction$"
  ep3_contract_event.0011.desc: "Ta được dẫn đến trước mặt [task_contract_target.GetTitledFirstName] [task_contract_target.GetHerselfHimself].\n\n"Ngươi đến theo yêu cầu của [task_contract_employer.GetTitledFirstNamePossessive], [task_contract_target.Custom2('RelationToMeShort',task_contract_employer)], phải không? Có việc gì?"\n\n"
  ep3_contract_event.0011.desc_vip: "$ep3_contract_event.0011.desc$[task_contract_object.GetName] bước lên phía trước. "Thưa [task_contract_target.GetTitledFirstNameNoTooltip] đáng kính, ta đại diện cho [task_contract_employer.GetNameNoTooltip]! Nhưng thông điệp ta mang theo chỉ dành riêng cho tai của ngài."\n\n"Đến đây," [task_contract_target.GetTitleAsNameNoTooltip] đáp bằng giọng trầm tối, "chúng ta sẽ nói chuyện trong tẩm thất của ta. [ROOT.Char.GetTitledFirstNameNoTooltip], công lao của ngươi đã được ghi nhận — ngươi có thể ở lại với tư cách khách tại [task_contract_destination.GetHolding.GetType.GetName|l] của ta!""
  ep3_contract_event.0011.desc_artifact: "$ep3_contract_event.0011.desc$Ta dâng lên [escorted_artifact.GetName], khiến cả triều đình trầm trồ.\n\n"Một món quà tuyệt vời!" [task_contract_target.GetTitleAsNameNoTooltip] reo lên. "Ngươi đã làm rất tốt, kẻ phiêu lưu. Ngươi có thể ở lại và tận hưởng những thú vui tại [task_contract_destination.GetName].""
  ep3_contract_event.0011.desc_ward: "$ep3_contract_event.0011.desc$Ta vỗ nhẹ lưng [task_contract_object.GetFirstNamePossessive] lần cuối, rồi thúc [task_contract_object.GetHerHim] bước lên. "Ta mang đến một thiếu niên quý tộc, xứng đáng được giáo dưỡng tinh tế."\n\n"
  ep3_contract_event.0011.desc_ward_accepted: "[task_contract_target.GetTitledFirstNameNoTooltip] chấp nhận lời bái kiến của [task_contract_object.Custom('GirlBoy')], nói rằng: "Từ nay về sau, [task_contract_object.Custom('GirlBoy')], ta sẽ là người dạy dỗ và giám hộ cho ngươi. Và nếu [ROOT.Char.GetSheHe] muốn, người Ngài đồng hành của ngươi cũng có thể lưu lại đây một thời gian.""
  ep3_contract_event.0011.desc_ward_too_old: "E rằng," [task_contract_target.GetTitleAsNameNoTooltip] đáp, liếc nhìn thanh niên trước mặt [task_contract_target.GetHerHim], "con đường đã khiến [task_contract_object.GetWomanMan] này trở thành người trưởng thành. Ta sẽ không hạ mình đối xử với [task_contract_object.GetHerHim] như một kẻ ngây thơ mắt tròn xoe.""
  ep3_contract_event.0011.desc_ward_limit: "E rằng," [task_contract_target.GetTitleAsNameNoTooltip] đáp, "ta đã quá tải bởi lũ trẻ con khóc nhè. Triều đình của ta không còn chỗ cho thêm một người được giám hộ nữa.""
  ep3_contract_event.0011.desc_gold: "\"Quý ngài [task_contract_target.GetName] cao quý!\" ta tuyên bố, \"Chiếc rương này chứa đầy vàng, bạc và châu báu, được lựa chọn dành riêng cho ngài từ kho bạc rộng lớn của [task_contract_employer.GetName]!\"\n\n[task_contract_target.GetTitledFirstNameNoTooltip] bật dậy khỏi ngai vàng của [task_contract_target.GetHerHis]: \"Hãy ca ngợi [task_contract_target.GetFaith.HighGodName] và ca ngợi [task_contract_employer.GetTitledFirstNameNoTooltip]! Hiếm có ai từng được biết đến sự hào phóng như vậy! Lời cảm tạ của ta, hỡi lữ khách. Ngươi rất được chào đón ở lại [task_contract_destination.GetName]... đặc biệt nếu có vài đồng tiền lẻ nào đó nằm rải rác quanh lều của ngươi...\""
  ep3_contract_event.0011.desc_explorer: "\n\n"Ta không chắc mình có sống sót tới nơi không!" [task_contract_object.GetName] thở gấp. "Nhưng ngươi đã luôn dẫn đường vững vàng qua mọi hiểm nguy! Cảm ơn ngươi. Thù lao của ngươi hoàn toàn xứng đáng. Và phải công nhận — [task_contract_destination.GetNameNoTooltip] thật đáng kinh ngạc!"
  ep3_contract_event.0011.desc_explorer_building: "Chúng ta đang ở [task_contract_destination.GetName] và cuối cùng, đích đến đã hiện ra trước mắt. Chúng ta tiến đến [task_contract_destination.GetHolding.GetSpecialBuildingType.GetName]$ep3_contract_event.0011.desc_explorer$""
  ep3_contract_event.0011.desc_explorer_other: "Cuối cùng chúng ta cũng đặt chân tới [task_contract_destination.GetTerrain.GetName] của [task_contract_destination.GetTitle.GetName]: điểm đến của [task_contract_object.GetNamePossessive].$ep3_contract_event.0011.desc_explorer$""
  ep3_contract_event.0011.desc_animal_dog: "$ep3_contract_event.0011.desc$Ta gần như không giữ nổi [task_contract_target.Custom('DogStoryName')]. Sổng khỏi dây xích, con chó lao vào [task_contract_target.GetTitledFirstNameNoTooltip], húc ngã [task_contract_target.GetHerHim] rồi liếm khắp mặt [task_contract_target.GetHerHis]."
  ep3_contract_event.0011.desc_animal_cat: "$ep3_contract_event.0011.desc$[task_contract_target.Custom('CatStoryName')] thò đầu ra khỏi chiếc rương. Nhận ra [task_contract_target.GetTitledFirstNameNoTooltip], con mèo bắt đầu rừ rừ."
  ep3_contract_event.0011.desc_animal_dog_hate: "$ep3_contract_event.0011.desc_animal_dog$\n\n"Cút con chó bẩn thỉu này khỏi ta! Mùi của nó — thật kinh tởm! Nguyền rủa [task_contract_employer.GetTitledFirstNameNoTooltip] vì đã làm ô uế đại sảnh của ta bằng con quái vật này!""
  ep3_contract_event.0011.desc_animal_dog_love: "$ep3_contract_event.0011.desc_animal_dog$\n\n"Niềm vui ngươi mang đến cho ta thật lớn lao! Cảm ơn ngươi, lữ khách. Ngươi đã ban phước cho lãnh địa của ta bằng sinh vật này, và được chào đón ở lại bao lâu tùy thích.""
  ep3_contract_event.0011.desc_animal_cat_hate: "$ep3_contract_event.0011.desc_animal_cat$\n\n"Một con mèo ư!? Tống cổ con quỷ gầy guộc đó ra ngoài! Ôi đầu ta đã đau nhức rồi! Mũi ta như sắp nổ tung!""
  ep3_contract_event.0011.desc_animal_cat_love: "$ep3_contract_event.0011.desc_animal_cat$\n\n"Ồ, có phải là [task_contract_target.Custom('CatStoryName')] không? [task_contract_employer.GetTitledFirstNameNoTooltip] thật quá hào phóng! Với phần việc của ngươi, lữ khách, ngươi có thể ở lại đây bao lâu cũng được.""
  ep3_contract_event.0011.desc_construction: "Ta phóng mắt nhìn công trường xây dựng tại [task_contract_destination.GetName]. Khi công nhân đang dỡ vật liệu ta mang tới, [task_contract_employer.GetName] [task_contract_employer.GetHerselfHimself] tiến lại gần.\n\n"Giao hàng thật đúng lúc, [ROOT.Char.GetTitleAsName]!" [task_contract_employer.GetTitleTierName] nói. "Tuy nhiên, như ngươi thấy đấy, vẫn sẽ cần khoảng [task_contract_destination.GetHolding.GetConstructionTimeLeft] nữa để hoàn thành [task_contract_destination.GetHolding.GetConstructingHoldingType.GetName]. Ta cần thêm nhân lực để xong việc."\n\n"Ngươi có ở lại [task_contract_destination.GetNameNoTooltip] và góp sức người của mình cho công việc của ta không?""
  ep3_contract_event.0011.a: "Ta sẵn sàng dời trại tới [task_contract_destination.GetNameNoTooltip]."
  ep3_contract_event.0011.b: "Ta rất mong [task_contract_object.GetTitledFirstNameNoTooltip] gia nhập cùng chúng ta vĩnh viễn."
