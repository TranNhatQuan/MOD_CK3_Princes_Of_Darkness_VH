  ep3_contract_event.0021.t: "$contract_event_prefix$ $laamp_religious_minority_contract_contract$"
  ep3_contract_event.0021.desc: "Một nhóm tín đồ [task_contract_employer.GetFaith.GetAdherentNamePlural] tiến vào trại của ta, mong được nói chuyện.\n\n\"Xin chào, nhà phiêu lưu!\" vị cao niên nhất trong nhóm cất lời. \"Chúng Ta đến từ [task_contract_destination.GetName], một vùng đất lân cận, nơi sự cai trị mộ đạo của [task_contract_employer.GetNamePossessive] tuân theo thánh điển [task_contract_employer.GetFaith.ReligiousText]!\" Vài tiếng reo rụt rè hô vang danh [task_contract_employer.GetFaith.HighGodNamePossessive] khiến ông lão chững lại, rồi tiếp tục:\n\n\"Tuy nhiên, chủ quân của [task_contract_employer.GetHerHis], [task_contract_target.GetName], lại là một [task_contract_employer.Custom2('GetUnbelieverTerm', task_contract_target)] chẳng mấy quan tâm đến lề lối của chúng Ta. Nhân danh [task_contract_employer.GetFaith.HighGodName], chúng Ta khẩn cầu; hãy giúp chúng Ta giành được sự bảo đảm về tự do tôn giáo dưới triều đại của [task_contract_target.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip]!\""
  ep3_contract_event.0021.a: "$ep3_contract_event.0020.a$"
  ep3_contract_event.0021.b: "Ta biết vài mánh khóe để lôi kéo [task_contract_target.GetFaith.GetAdherentNamePluralNoTooltip] về phía mình."
  ep3_contract_event.0021.c: "$ep3_contract_event.0020.c$"
  ep3_contract_event.0021.d: "Ta sẽ tìm thứ gì đó trong [task_contract_target.GetFaith.ReligiousText] để thuyết phục [task_contract_target.GetHerHim]."
  ep3_contract_event.0021.e: "$ep3_contract_event.0020.e$"
  ep3_contract_event.0021.tt: "[scheme|E] thành công sẽ khiến [task_contract_target.GetShortUIName] ban cho [task_contract_employer.GetShortUIName] [GetSubjectContractType( 'religious_rights' ).GetObligationName( 'religious_rights_protected' )] [obligation|E]"
  cultural_acceptance_laamp_cultural_minority_contract: "Nỗ lực của [adventurer|E] đã giúp giành được [GetSubjectContractType( 'title_revocation_rights' ).GetObligationName( 'title_revocation_rights_protected' )] [obligation|E] để chống lại một chủ quân ngoại bang"
  ep3_contract_event.0030.t: "$contract_event_prefix$ $laamp_prison_break_contract_contract$"
  ep3_contract_event.0030.desc: "\"Tên [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))] đó, [task_contract_target.GetName]!\" Những lời chửi rủa ầm ĩ bên ngoài lều đánh thức ta.\n\n\"Ai đó? Ai dám quấy rầy ta giữa đêm khuya, ngay trong trại của ta?\" ta hỏi, vẫn còn ngái ngủ.\n\n\"Là ta, [task_contract_employer.GetName]!\" kẻ xâm nhập lớn tiếng. \"Nhanh lên, không còn thời gian đâu! [task_contract_object.Custom2('MyCharacterIntroduction', task_contract_employer)|U] đã bị tên [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))], [task_contract_target.GetTitledFirstNameNoTooltip], tống giam.\" Thấy ta còn ngơ ngác, [task_contract_employer.GetSheHe] nói thêm:\n\n\"Ta sẽ trả hậu hĩnh nếu ngươi cứu được [task_contract_object.GetHerHim] ra ngoài!\""
  ep3_contract_event.0030.a: "$ep3_contract_event.0020.a$"
  ep3_contract_event.0030.b: "Ta sẽ lập tức lên kế hoạch vượt ngục!"
  ep3_contract_event.0030.c: "Chuyện này để sáng mai hẵng tính."
  ep3_contract_event.0030.c.tt: "Mở khóa $prison_break_contract_interaction$ [interaction|E]."
  ep3_contract_event.0030.agents: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thug' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_decoy' ).GetName]"

  treasure_map_prefix: "Bản Đồ Kho Báu"
  ep3_contract_event.0040.t: "$treasure_map_prefix$: Rách Toạc Bản Đồ"
  ep3_contract_event.0040.desc: "Khi ta rút tấm bản đồ kho báu ra để nhìn lại lần nữa trong cơn bối rối, nó mắc vào thứ gì đó trong túi ta với một tiếng #EMP \"RÉ-É-ÉT\"#! kinh khủng.\n\nTấm bản đồ giờ đã bị xé toạc ngang giữa, chỉ còn lại những mảnh vụn rơi lả tả xuống đất.\n\nTa đứng sững, choáng váng, cầm trong tay những mảnh — giờ gần như vô dụng — ấy."
  ep3_contract_event.0040.a: "Chủ thuê của ta chắc chắn sẽ không thích chuyện này."
  ep3_contract_event.0040.a_travel: "Nhưng — ta chỉ là... thôi vậy."
  ep3_contract_event.0040.b: "Ở lại đây cũng chẳng sao."

  ep3_contract_event.0041.t_dead: "$treasure_map_prefix$: Vĩnh Hằng Không Chờ Một [task_contract_employer.GetWomanMan|U] Nào"
  ep3_contract_event.0041.t_incapable: "$treasure_map_prefix$: Đêm Buông Xuống"
  ep3_contract_event.0041.desc_intro: "Người gác lửa chặn ta lại khi ta định bước vào lều của [task_contract_employer.GetTitledFirstNamePossessive]: \"[ROOT.Char.GetTitleAsNameNoTooltip|U], đừng... [task_contract_employer.GetSheHe] đã đi rồi, [ROOT.Char.Custom('MistressMaster')].\""
  ep3_contract_event.0041.desc_dead: "$ep3_contract_event.0041.desc_intro$\n\nTa bước vào lều và, trong thoáng chốc, [task_contract_employer.GetFirstNameNoTooltip] trông như chỉ đang ngủ — cho đến khi ta nhận ra khuôn mặt [task_contract_employer.GetHerHis] dần tái nhợt theo sắc chết.\n\nVẫn còn sững sờ, ta"
  ep3_contract_event.0041.desc_incapable: "$ep3_contract_event.0041.desc_intro$\n\nTa bước vào lều và thấy [task_contract_employer.GetFirstNameNoTooltip] nằm sõng soài trên đất, còn sống nhưng... chỉ là... #EMP không còn ở đây#!.\n\nVẫn còn sững sờ, ta đỡ [task_contract_employer.GetHerHim] ngồi tựa vào giường xếp, rồi"
  ep3_contract_event.0041.desc_outro: "đảo mắt nhìn quanh, cố tìm bản đồ kho báu, nhưng nhanh chóng nhận ra nó không hề có ở đây.\n\nGiờ thì ta không thể nào hoàn thành việc tìm kiếm kho báu cuối cùng..."
  ep3_contract_event.0041.a: "Chúng ta nên quay về."
  ep3_contract_event.0041.a.tt: "Di chuyển [camp|E] của Ngài tới [THIS.Char.GetCurrentLocation.GetNameNoTooltip]"
  ep3_contract_event.0041.a.flavor_dead: "Nguyện [task_contract_employer.GetFaith.HighGodName] cho linh hồn [task_contract_employer.GetHerHis] được yên nghỉ."
  ep3_contract_event.0041.a.flavor_incapable: "Thật là một trạng thái... tồn tại khủng khiếp."
  ep3_contract_event.0041.b: "Dù sao cũng chẳng còn gì để quay lại."
  treasure_map_employer_is_incapable.tt: "[task_contract_employer.GetShortUIName|U] nhận được [GetTrait('incapable').GetName( GetNullCharacter )] [trait|E]"
  treasure_map_disappeared.tt: "Bản đồ đã biến mất không dấu vết!"
 

  ep3_contract_event.0043.t: "$treasure_map_prefix$: Kẻ Vuột Mất Trong Gang Tấc"
  ep3_contract_event.0043.desc: "[task_contract_employer.GetTitledFirstName] bước tới, vỗ nhẹ lên vai ta: \"Một [ROOT.Char.Custom('GetLassLad')] thật tốt bụng! Ta thực sự cảm kích sự trợ giúp của ngươi trong chuyến đi cuối cùng này.\"\n\n[task_contract_employer.GetSheHe|U] trao cho ta một tấm [0043_treasure_map.GetName] nhàu nát, những nếp nhăn nơi khóe mắt [task_contract_employer.GetHerHis] dịu lại khi [task_contract_employer.GetSheHe] mỉm cười. \"Trông có lẽ chẳng ra gì, nhưng ta đã phải vật lộn với chính [task_contract_employer.GetFaith.DevilName] [task_contract_employer.GetFaith.DevilHerselfHimself] để có được nó. Hãy giữ gìn cẩn thận.\"\n\nDừng lại một lúc để lời nói ngấm vào, lão [task_contract_employer.GetWomanMan] bật cười khành khạch: \"Khi nào ngươi sẵn sàng — ta còn một kho báu cần đào lên đấy!\""
  ep3_contract_event.0043.a: "Lên đường thôi!"
  ep3_contract_event.0043.a.tt: "Mở giao diện [decision|E] [GetDecisionWithKey('treasure_map_contract_decision').GetName]"
  ep3_contract_event.0043.b: "Ta sẽ làm. Sớm thôi."

  ep3_contract_event.0045.t: "$treasure_map_prefix$: Chim Trong Tay..."
  ep3_contract_event.0045.desc_intro_artifact: "Lúc rạng đông, chúng ta đến [excavation_location.GetName] — nơi đáng lẽ chính là dấu mốc trên [0045_treasure_map.GetName]. Ta bắt đầu tìm kiếm những chỗ thích hợp để giấu kho báu.\n\nTrải dài hàng dặm chỉ là sự tĩnh lặng của [excavation_location.GetTerrain.GetNameNoTooltip|l]: một phông nền hùng vĩ cho cuộc tìm kiếm của ta."
  ep3_contract_event.0045.desc_artifact_historical: "$ep3_contract_event.0045.desc_intro_artifact$\n\nCuối cùng, ta phát hiện một mô đất dưới vài bụi cây được sắp xếp có phần #EMP quá#! ngay ngắn để là tự nhiên. Khi ta bắt đầu đào, xẻng chạm phải thứ gì đó, và ta cẩn thận moi lên để nhận ra đó là... [treasure_artifact_historical.GetName]!?"
  ep3_contract_event.0045.desc_artifact_jewelry: "$ep3_contract_event.0045.desc_intro_artifact$\n\nĐi sâu vào một cụm cây cổ thụ gần đó, ta thấy thứ gì đó nằm trong một hốc rỗng. Đưa tay vào thân cây, ta rút ra... [treasure_artifact_jewelry.GetName]."
  ep3_contract_event.0045.desc_intro_gold: "Chúng ta đến vùng quê [excavation_location.GetName] vào đầu giờ chiều và bắt đầu tìm manh mối xem dấu mốc trên [0045_treasure_map.GetName] chỉ về đâu.\n\nĐi dọc theo [excavation_location.GetTerrain.GetNameNoTooltip|l], ta nhận thấy một hốc đá được che giấu kỹ trong vách núi. Nó dẫn vào một hang nhỏ."
  ep3_contract_event.0045.desc_gold_great: "$ep3_contract_event.0045.desc_intro_gold$\n\nBên trong hang, với những bức vẽ trang trí mô tả đủ loại cảnh tượng kỳ lạ và u ám, một chiếc rương gỗ phủ bụi đang chờ sẵn.\n\nTa mở ra và phát hiện một kho vàng, trang sức và của cải đồ sộ!"
  ep3_contract_event.0045.desc_gold_mediocre: "$ep3_contract_event.0045.desc_intro_gold$\n\nBên trong hang, dường như đã bị lãng quên từ lâu, là nơi rải rác nhiều đồ vật.\n\nNhấc lên một chiếc bình trông có vẻ cổ xưa — và nặng một cách đáng ngạc nhiên — ta phát hiện bên trong là một lượng vàng xu khá kha khá."
  ep3_contract_event.0045.desc_gold_poor: "$ep3_contract_event.0045.desc_intro_gold$\n\nNội thất của hang dường như là một điện thờ bí mật của một vị thần xa lạ nào đó... và dưới ánh nhìn của những linh hồn không quen biết, ta chẳng tìm được gì giá trị ngoài một món đồ vàng nhỏ đặt trên mâm cúng."
  ep3_contract_event.0045.desc_intro_scenery: "Khi chúng ta đến vùng ven [excavation_location.GetName], ta lần theo dấu mốc trên [0045_treasure_map.GetName] xuyên qua vách đá và bụi rậm rồi..."
  ep3_contract_event.0045.desc_riches_in_scenery_dry: "$ep3_contract_event.0045.desc_intro_scenery$\n\n[excavation_location.GetTerrain.GetNameNoTooltip|l] mở ra một ốc đảo ngoạn mục. Làn nước mát mang lại sự giải tỏa trước cái nóng không ngơi nghỉ, và những gợn sóng lan tỏa trên mặt nước khi đàn cá sặc sỡ nhảy múa bên dưới.\n\nTa nghĩ về việc — ngay cả trong những thời khắc khắc nghiệt nhất — những bến đỗ thanh bình này vẫn không hề thay đổi: ở những nơi tĩnh lặng như thế, người ta cảm nhận được sự gần gũi với [ROOT.Char.GetFaith.HighGodName]..."
  ep3_contract_event.0045.desc_riches_in_scenery: "$ep3_contract_event.0045.desc_intro_scenery$\n\n[excavation_location.GetTerrain.GetNameNoTooltip|l] mở ra thành một mạch nguồn tráng lệ. Vô số chim chóc và thú ăn cỏ tụ tập nơi đây, hoàn toàn không bị thế giới bên ngoài quấy nhiễu.\n\nTa trầm ngâm trước vẻ đẹp của nơi này, và cách mọi sinh vật tồn tại trong một trật tự hài hòa: côn trùng, cá, chim, rồi đến muông thú.\n\nMột hơi ấm lan tỏa trong lồng ngực ta. Đây là một cảm giác thiêng liêng — không còn nghi ngờ gì nữa!"
  ep3_contract_event.0045.desc_pillaged: "$ep3_contract_event.0045.desc_intro_gold$\n\nSau hơn một giờ, ta tìm thấy một hố đất được che phủ một phần, bên trong có một chiếc rương gỗ nhỏ. Nó gần như trống rỗng... ngoài vài món đồ lặt vặt của người [excavation_location.GetCulture.GetNameNoTooltip]."

  ep3_contract_event.0045.a: "Tin tuyệt vời dành cho [task_contract_employer.GetTitledFirstNameNoTooltip]!"
  ep3_contract_event.0045.a_artifact_historical: "[task_contract_employer.GetTitledFirstNameNoTooltip] chắc chắn sẽ #EMP mừng rỡ!#!"
  ep3_contract_event.0045.a_pillaged: "Hừm. Ta đoán là vẫn nên báo cho chủ thuê..."
  ep3_contract_event.0045.b: "Người tìm được thì giữ."
  ep3_contract_event.0045.b_artifact_historical: "Thứ này thuộc về... #EMP ta.#!"
  ep3_contract_event.0045.b_pillaged: "Chẳng có gì để ăn mừng."
  ep3_contract_event.0045.b.flavor_reforged: "Ta sẽ rèn lại nó thành thứ gì đó hữu dụng."
  ep3_contract_event.0045.b.flavor: "Ta sẽ để dành cho sau."

  ep3_contract_event.0050.t: "$treasure_map_prefix$: ...Còn Hơn Hai Con Trong Bụi"
  ep3_contract_event.0050.desc_artifact_historical: "\"[treasure_artifact_historical.GetName]!\" [task_contract_employer.GetTitledFirstName] thốt lên kinh ngạc khi ta trao lại [treasure_artifact_historical.Custom('ArtifactType')].\n\n\"Cầu xin phước lành đến với ngươi, bằng hữu, vì đã mang thứ này đến cho ta. Ta hiểu rằng hẳn phải vô cùng khó khăn để từ bỏ một báu vật như vậy...\"\n\n[task_contract_employer.GetSheHe|U] mỉm cười đầy biết ơn. \"Ta cho rằng lời dạy của mẫu thân ta vẫn luôn đúng: quả thật con người có thể đặt niềm tin vào lòng tốt của những người xa lạ.\""
  ep3_contract_event.0045.desc_intro: "[task_contract_employer.GetFirstName] gần như không thể kìm nén sự phấn khích của [task_contract_employer.GetHerHis] khi ta quay trở lại lều của [task_contract_employer.GetHerHis]."
  ep3_contract_event.0050.desc_artifact_jewelry: "$ep3_contract_event.0045.desc_intro$ \"Tinh xảo thật! Nhìn lối chế tác kỳ lạ này xem!\"\n\n[task_contract_employer.GetSheHe|U] săm soi từng chi tiết nhỏ của [treasure_artifact_jewelry.GetName], gần như rừ rừ vì sung sướng, rồi mỉm cười với ta. \"Ngươi có được lòng biết ơn bất tận của ta vì món này.\""
  ep3_contract_event.0050.desc_gold: "$ep3_contract_event.0045.desc_intro$ \"Vàng, ngươi nói sao? Thế thì còn gì xứng đáng hơn cho kho báu cuối cùng!\"\n\nMột thoáng u sầu — hẳn là vì nghĩ đến hồi kết của cuộc phiêu lưu — lướt qua gương mặt [task_contract_employer.GetHerHis] khi [task_contract_employer.GetSheHe] khép lại chuyện này. \"Ta biết ơn món lợi vàng này, được mang đến đúng bổn phận. Hãy đi đi, cùng lời cảm tạ của ta.\""
  ep3_contract_event.0050.desc_scenic: "$ep3_contract_event.0045.desc_intro$ \"Nghe thật... ngoạn mục. Ta đã dành quá nhiều đời mình để tìm kiếm của cải, đồ trang sức, những thứ lấp lánh. Còn điều này...\"\n\n[task_contract_employer.GetSheHe|U] ngừng lại giây lát, chìm trong suy tư: \"...đây sẽ là nơi ta sống nốt những ngày cuối cùng, trong yên bình. Cảm ơn ngươi, Ngài hiền.\""
  ep3_contract_event.0050.desc_pillaged: "$ep3_contract_event.0045.desc_intro$ \"Đã bị cướp sạch rồi ư?\"\n\n[task_contract_employer.GetSheHe|U] thở dài nặng nề. \"Đời phiêu lưu không kết thúc bằng một tiếng nổ, mà là bằng một... tiếng thở dài thì phải. Thôi vậy. Ngươi đã chiều theo sự dại dột này của ta, và ta xin cảm tạ.\""
  ep3_contract_event.0050.a: "Rất hân hạnh được làm ăn cùng ngài."
  ep3_contract_event.0060.t: "$contract_event_prefix$ $laamp_help_claimant_contract_contract$"
  ep3_contract_event.0060.desc: "Một đoàn người [task_contract_employer.GetCulture.GetCollectiveNoun] đang du hành, với những ngọn giáo khoác trên mình các lá cờ mới may rực rỡ, dừng lại tại doanh trại của ta. Một trong số các [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l], [commander.GetName], mang đến cho ta lời thỉnh cầu từ chủ nhân của [commander.GetHerHis].\n\n\"[task_contract_employer.GetName] đang chuẩn bị đội quân của [task_contract_employer.GetHerHis] để tấn công [task_contract_target.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [task_contract_target.GetName], và — bằng những chiến công trên chiến trường — giành lại những gì vốn thuộc về [task_contract_employer.GetHersHis]!\"\n\n\"Và khi những lá cờ của chúng ta tung bay trên [task_contract.MakeScope.Var('task_contract_title').Title.GetNameNoTier], sẽ có những chiến lợi phẩm quý giá được phân chia cho tất cả những ai đã chiến đấu vì yêu sách của [task_contract_employer.GetTitleAsNamePossessiveNoTooltip]!\""
  ep3_contract_event.0060.a: "$ep3_contract_event.0008.a$"
  ep3_contract_event.0060.join_war: "[task_contract_taker.GetShortUIName|U] sẽ tham gia [war|E] với tư cách Kẻ Tấn Công"

