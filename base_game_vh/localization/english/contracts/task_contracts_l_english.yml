  ep3_support_peasants_effect_tt: "Tăng $event_window_widget_peasant_leader_support$ thêm #N 1#!"
  ep3_contract_event.0094.travel_without_domicile: "Bắt đầu một [travel|E] tới [corrupt_province.GetName] mà không di chuyển [camp|E]"
  ep3_contract_event.0094.travel_with_domicile: "Bắt đầu một [travel|E] tới [corrupt_province.GetName] và mang theo [camp|E]"
  msg_peasant_supported.title: "Nông dân nổi dậy"
  msg_peasant_supported.desc: "[task_contract_taker.GetShortUIName] đứng về phía nông dân"
  msg_peasant_controlled.title: "Nông dân bị kiểm soát"
  msg_peasant_controlled.desc: "[task_contract_taker.GetShortUIName] đã giúp chúng ta xử lý nông dân"

  laamp_boost_legitimacy_contract_contract: "Củng cố tính chính danh"
  laamp_boost_legitimacy_contract_desc_title: "Những lữ khách xuất thân cao quý,"
  laamp_boost_legitimacy_contract_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] cần một kẻ khéo ăn nói để giúp đám nông dân bất kham trong lãnh địa của [TaskContract.GetEmployer.GetHerHis] hiểu rằng [TaskContract.GetEmployer.GetSheHe] có quyền cai trị không thể tranh cãi. Cần phải xuất hiện trực tiếp tại địa phương."
  laamp_boost_legitimacy_contract_request: "Hợp đồng [task_contract|E] này yêu cầu ngươi [travel|E] tới [TaskContract.GetLocation.GetName]."

  ep3_contract_event.0510.t: "Quyền cai trị"
  ep3_contract_event.0510.desc: "Ta đến [location.GetName] và nhận thấy nơi đây đang trong tình trạng hỗn loạn. Những người dân thường rõ ràng đang vô cùng bất mãn, và kẻ cầm đầu của họ — một [peasant.GetWomanMan] tên [peasant.GetFirstName] — đang lớn tiếng kích động đám đông tụ tập.\n\n\"[task_contract_employer.GetTitledFirstName] ư? Một kẻ #EMP [task_contract_employer.GetTitleAsNameNoTooltip]#! nào đó thì có!\" [peasant.GetSheHe|U] gầm lên. \"Chúng ta từng có những người cai trị #EMP thực sự#!, được [peasant.GetFaith.FateGodName] bổ nhiệm!\"\n\nBài diễn thuyết đầy nhiệt huyết, nhưng phần lớn đám đông rõ ràng vẫn đang do dự, không chắc chắn về lòng trung thành của mình."
  ep3_contract_event.0510.a: "Nếu ta thuyết phục được Bạn ta, những kẻ khác sẽ noi theo."
  ep3_contract_event.0510.a.success: "Ngươi thuyết phục được [peasant.GetHerHim] và những người đang lắng nghe"
  ep3_contract_event.0510.a.failure: "Ngươi không đưa ra được lập luận đủ sức thuyết phục"
  ep3_contract_event.0510.a.critfailure: "Khả năng hùng biện của ngươi hoàn toàn sụp đổ"
  ep3_contract_event.0510.b: "Sức mạnh quyết định lẽ phải..."
  ep3_contract_event.0510.b.success: "Những lời đe dọa của ngươi phát huy tác dụng"
  ep3_contract_event.0510.b.failure: "[peasant.GetFirstNameNoTooltip] chế giễu lời đe dọa của ngươi"
  ep3_contract_event.0510.b.critfailure: "Ngươi đánh giá sai tình hình, và #EMP rắc rối thực sự#! bắt đầu nhen nhóm"
  ep3_contract_event.0510.c: "Có lẽ một túi vàng sẽ khiến tên nông dân này đổi phe..."

  ep3_contract_event.0520.t.success: "$ep3_contract_event.0510.t$: Thành công"
  ep3_contract_event.0520.t.failure: "$ep3_contract_event.0510.t$: Thất bại"
  ep3_contract_event.0520.t.critfailure: "$ep3_contract_event.0510.t$: Thất bại nghiêm trọng"
  ep3_contract_event.0520.desc.success: "Tên nông dân hung hăng ấy rất cứng đầu, nhưng sự quyết liệt của hắn đã tan biến trước niềm tin của ta. Đám đông, vốn đứng bên bờ bạo lực, dần dần lắng xuống.\n\nCuối cùng, họ giải tán, công khai thừa nhận vị thế chính đáng của [task_contract_employer.GetTitledFirstNamePossessive] với tư cách là người cai trị [location.GetName]. Đại diện của chủ hợp đồng hạ vũ khí, bày tỏ lòng biết ơn và trao cho ta phần thưởng xứng đáng."
  ep3_contract_event.0520.desc.failure: "Tình hình vượt khỏi tầm kiểm soát — rất nhanh. Ta không ngờ một tên nông dân lại có thể phun ra lửa và lời lẽ sắc bén đến vậy; những lời đáp trả như sấm sét của [peasant.GetFirstNamePossessive] khiến đám đông nổi cơn thịnh nộ.\n\nTa buộc phải rút lui trong vội vã! Đám dân ô hợp hô vang và ném đá, lặp lại mọi lời sỉ nhục mà thủ lĩnh của chúng đã thốt ra.\n\n[task_contract_employer.GetTitledFirstName] chắc chắn sẽ không hài lòng với kết cục này..."
  ep3_contract_event.0520.desc.critfailure: "Ta thực sự không ngờ phải đối mặt với một pháo đài phản kháng vững chắc đến vậy.\n\nNỗ lực dùng vũ lực ép buộc tên nông dân của ta chìm nghỉm như đá ném ao bèo, và tình hình nhanh chóng trở nên xấu xí một cách kinh hoàng. Khi ta quay đầu bỏ chạy, áo choàng bị nhổ đầy nước bọt và ta trúng cả loạt rau quả thối.\n\nRõ ràng, thanh danh của [task_contract_employer.GetTitledFirstNamePossessive] đang thay đổi theo một cách #EMP hoàn toàn khác#! so với những gì ta đã hứa với [task_contract_employer.GetHerHim]..."
  ep3_contract_event.0520.a: "Tuyệt vời."
  ep3_contract_event.0520.b: "Ừm… ta đã cố rồi."

  laamp_rid_councillor_contract_contract: "Thanh trừng kẻ gây rối"
  laamp_rid_councillor_contract_desc_title: "Cần những kẻ giải quyết vấn đề dứt khoát,"
  laamp_rid_councillor_contract_desc: "[TaskContract.GetEmployer.GetTitledFirstName] cần một lưỡi dao hiệu quả và kín đáo để loại bỏ một… #EMP nhân vật gây sóng gió#! khỏi tầm mắt của [TaskContract.GetEmployer.GetHerHim]. Thưởng thêm cho sự thận trọng và gọn gàng."
  laamp_rid_councillor_contract_request: "Hợp đồng [task_contract|E] này yêu cầu ngươi [travel|E] tới [TaskContract.GetLocation.GetName]."

  ep3_contract_event.0550.t: "Kẻ gây rối: Thư tín trong bóng tối"
  ep3_contract_event.0550.desc: "Ta đến địa điểm đã hẹn tại [location.GetName]. Xung quanh hầu như không có ai, nhưng ta phát hiện một bóng người đang tiến lại gần: quấn kín từ đầu đến chân trong áo choàng, kẻ bí ẩn ấy rít giọng với ta.\n\n“Ngươi là [ROOT.Char.GetFirstNameNoTooltip], đúng không?”\n\nTa gật đầu, và [messenger.GetSheHe] không nói một lời, nhét một bức thư vào tay ta. Vội vã rời đi, kẻ đưa tin nhanh chóng tan biến vào bóng tối.\n\nRõ ràng, [task_contract_employer.GetTitledFirstName] quyết tâm không để bất kỳ dấu vết nào của việc này dẫn ngược về phía [task_contract_employer.GetHerHim]..."
  ep3_contract_event.0550.a: "Xem nào, số phận đang chờ ta điều gì..."
  ep3_contract_event.0550.a.tt: "Mở bức thư."

  ep3_contract_event.0555.desc: "Ta mong ngươi hiểu sự cần thiết của việc giữ kín mọi chuyện. Sự tuyệt vọng đã đẩy ta đến bước này, và ta không thể để lộ bài của mình.\n\nMục tiêu của ngươi là [councillor.GetName]. [councillor.GetSheHe|U] phải bị loại bỏ… khỏi quyền lực, hoặc khỏi cõi đời này hoàn toàn: ta không quan tâm.\n\nĐêm nay, ngươi có thể tìm thấy [councillor.GetHerHim] tại một nơi gọi là [ROOT.Char.Custom('GetPubName')]. Hãy tiêu hủy bức thư này và đừng bao giờ nhắc đến nó nữa."
  ep3_contract_event.0555.a: "À… vậy là ta phải xử lý một [councillor.GetActiveCouncilTask.GetPositionName] khó bảo."

  ep3_contract_event.0560.t: "Kẻ Gây Rối: Một [councillor.GetActiveCouncilTask.GetPositionName] Đầy Sóng Gió"
  ep3_contract_event.0560.desc: "Quán rượu ở rất gần. Khi lặng lẽ quan sát qua cửa sau, ta thấy [task_contract_employer.GetTitleAsNamePossessiveNoTooltip] [councillor.GetActiveCouncilTask.GetPositionName] đang tận hưởng một đêm ồn ào, hoàn toàn không hay biết hiểm họa đang rình rập.\n\nĐây có thể là một việc đơn giản... cứ xông vào và chém [councillor.GetTitledFirstName] thành từng mảnh. Nhưng biết đâu một cách tiếp cận tinh tế hơn cũng đạt được mục đích?\n\nCó lẽ, thậm chí là... ta có thể để cho kẻ bất hạnh ấy — [councillor.GetWomanMan] — sống sót?"
  ep3_contract_event.0560.a: "#EMP Xông thẳng qua cửa trước!#!"
  ep3_contract_event.0560.a.success: "Trận chiến diễn ra chớp nhoáng, không để lại nhân chứng nào còn sống"
  ep3_contract_event.0560.a.neutral: "[councillor.GetFirstNameNoTooltip] chết trong lúc giằng co"
  ep3_contract_event.0560.a.failure: "Ngươi làm hỏng cuộc phục kích và buộc phải tháo chạy"
  ep3_contract_event.0560.a.critfailure: "Cuộc ẩu đả diễn biến vô cùng tồi tệ"
  ep3_contract_event.0560.b: "Một nhát dao trong nhà xí là đủ rồi."
  ep3_contract_event.0560.b.success: "Kế hoạch diễn ra hoàn hảo"
  ep3_contract_event.0560.b.neutral: "Có xô xát, và mọi người để ý đến cuộc đào thoát của ngươi"
  ep3_contract_event.0560.b.failure: "Chuông báo động vang lên, khiến ngươi thất bại"
  ep3_contract_event.0560.c: "Hay là bỏ độc vào đồ uống của [councillor.GetHerHis]?"
  ep3_contract_event.0560.c.critsuccess: "Chất độc không bao giờ bị phát hiện"
  ep3_contract_event.0560.c.success: "Khi người ta nhận ra có độc thì đã quá muộn"
  ep3_contract_event.0560.c.failure: "[councillor.GetFirstNameNoTooltip] chỉ bị lâm bệnh"
  ep3_contract_event.0560.c.critfailure: "Ngươi bị bắt quả tang khi đầu độc"
  ep3_contract_event.0560.d: "Một vụ bắt cóc hiệu quả cũng có thể đạt cùng mục đích..."
  ep3_contract_event.0560.d.critsuccess: "Ngươi bắt cóc thành công [councillor.GetFirstNameNoTooltip]"
  ep3_contract_event.0560.d.success: "Mục tiêu chống cự quyết liệt và buộc phải bị khống chế"
  ep3_contract_event.0560.d.failure: "[councillor.GetFirstNameNoTooltip] trốn thoát"
  ep3_contract_event.0560.contractcritsuccess: "[task_contract|E] của ngươi là một #P Thành Công Xuất Sắc#!"
  ep3_contract_event.0560.contractsuccess: "[task_contract|E] của ngươi là một #P Thành Công#!"
  ep3_contract_event.0560.contractfailure: "[task_contract|E] của ngươi là một #N Thất Bại#!"
  ep3_contract_event.0560.contractcritfailure: "[task_contract|E] của ngươi là một #N Thất Bại Thảm Hại#!"

  ep3_contract_event.0565.t.critsuccess: "Kẻ Gây Rối: Thành Công Xuất Sắc"
  ep3_contract_event.0565.t.success: "Kẻ Gây Rối: Thành Công"
  ep3_contract_event.0565.t.failure: "Kẻ Gây Rối: Thất Bại"
  ep3_contract_event.0565.t.critfailure: "Kẻ Gây Rối: Thất Bại Thảm Hại"
  ep3_contract_event.0565.desc.critsuccess: "Việc xử lý [councillor.GetTitledFirstName] diễn ra tàn bạo và chớp nhoáng; [councillor.GetWomanMan] ấy chết trong ô nhục, bị bịt miệng trước khi ngay cả đồng bọn của [councillor.GetHerHis] kịp kêu gào báo động.\n\nÁnh sáng lạnh lẽo của ban ngày gần như rửa sạch tội lỗi của ta; một lần tắm trong con suối địa phương hoàn tất nốt phần còn lại.\n\nMột mật sứ đang chờ trên bờ — có phải là kẻ trước đó hay không thì ta cũng không rõ — mang theo vài bao tải nặng trĩu.\n\n\"[task_contract_employer.GetTitleAsNameNoTooltip] gửi lời cảm tạ vì công việc của ngươi. [task_contract_employer.GetSheHe|U] còn kèm thêm một món quà như dấu hiệu cho lòng biết ơn của [task_contract_employer.GetHerHis].\""
  ep3_contract_event.0565.desc.success: "[councillor.GetTitledFirstFirstName] đã không còn nữa. Hành động bạo lực ấy không hoàn hảo tuyệt đối, nhưng sự thật thì không thay đổi: ta đã giết mục tiêu của mình.\n\nÁnh sáng lạnh lẽo của ban ngày gần như rửa sạch tội lỗi của ta; một lần tắm trong con suối địa phương hoàn tất nốt phần còn lại.\n\nMột mật sứ đang chờ trên bờ — có phải là kẻ trước đó hay không thì ta cũng không rõ — với một bao tải nặng trĩu treo trên yên ngựa của [messenger.GetHerHis].\n\n\"[task_contract_employer.GetTitleAsNameNoTooltip] gửi lời cảm tạ vì công việc của ngươi. Sự phục vụ của ngươi sẽ được ghi nhớ.\""
  ep3_contract_event.0565.desc.failure: "Tiếng hú hét, tiếng bát đĩa và ghế bị ném loảng xoảng, những cú đánh nặng nề vẫn vang vọng bên tai ta. Ta điên cuồng chà rửa đôi tay mình, nhưng dòng suối này không thể gột sạch dấu vết của thất bại.\n\nThật là một mớ hỗn độn. [councillor.GetTitledFirstName] vẫn sống, và khế ước của ta với [task_contract_employer.GetTitledFirstName] đã vô hiệu. Ta không nên nán lại nơi này lâu hơn, kẻo sự trả thù từ phía này hay phía khác sẽ tìm đến."
  ep3_contract_event.0565.desc.critfailure: "Một thảm họa hoàn toàn! Toàn bộ cơn thịnh nộ của đám người hung bạo trong quán trút cả lên ta, và ta thật may mắn mới giữ được mạng sống.\n\nRửa vết thương trong một khúc sông gần đó, ta trát bùn kín người rồi vật lộn để buộc lại hành lý.\n\nTa phải tiếp tục bỏ trốn... [councillor.GetTitledFirstName] vẫn sống, và [task_contract_employer.GetTitledFirstName] hẳn sẽ giận dữ khôn nguôi. Chỉ có một [ROOT.Char.GetWomanMan] ngu ngốc mới dám nán lại nơi này."
  ep3_contract_event.0565.a: "[councillor.GetSheHe|U] sẽ không bao giờ còn được nghe thấy nữa."
  ep3_contract_event.0565.b: "Khốn kiếp."

  laamp_gain_wanderer_contract_contract: "Trợ Giúp Kẻ Lãng Du"
  laamp_gain_wanderer_contract_desc_title: "Xin hãy lưu tâm!"
  laamp_gain_wanderer_contract_desc: "Cần cứu trợ tại [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip]! Phục vụ sẽ được trả công bằng vàng, cùng với mọi chiến lợi phẩm tìm được."
  laamp_gain_wanderer_contract_request: "[task_contract|E] này yêu cầu ngươi phải [travel|E] tới [TaskContract.GetLocation.GetName]."

  ep3_contract_event.0570.t: "Người Giải Cứu"
  ep3_contract_event.0570.desc: "Vừa đặt chân tới [location.GetName], vài lời dò hỏi đã chỉ ta đến đúng nơi cần tìm. Ta phát hiện [task_contract_employer.GetFirstName] đang trong tình trạng thảm hại, bị xích vào tường bên trong một tòa nhà canh gác lỏng lẻo.\n\nMột lính gác tuần tra theo lịch đều đặn, và ta nắm lấy cơ hội khi [prisonguard.GetSheHe] rời đi để lén tiếp cận xà lim của [task_contract_employer.GetFirstNamePossessiveNoTooltip].\n\n\"Ngài đến cứu Ta phải không?\" [task_contract_employer.GetSheHe] yếu ớt hỏi. \"Làm ơn, nhanh lên: ngài phải giải thoát cho Ta trước khi lũ khốn đã giam giữ Ta quay lại!\""
  ep3_contract_event.0570.a: "Đợi đến khi [prisonguard.GetSheHe] quay lại, sẵn sàng gươm giáo."
  ep3_contract_event.0570.a.tt: "#V Đấu Tay Đôi#! với [prisonguard.GetFirstNameNoTooltip].\nSức Chiến Đấu của ngươi: [prowess_i]#V [root_for_loc.GetProwess]#!\nSức Chiến Đấu của [prisonguard.GetFirstNamePossessive]: [prowess_i]#V [prisonguard.GetProwess]#!"
  ep3_contract_event.0570.b: "Có lẽ ta có thể đánh lạc hướng tên lính gác?"
  ep3_contract_event.0570.b.success: "Màn đánh lạc hướng của ngươi thành công"
  ep3_contract_event.0570.b.failure: "Tên lính gác không mắc lừa"
  ep3_contract_event.0570.b.failure.tt: "Ngươi bị thương khi tháo chạy"
  ep3_contract_event.0570.c: "Sát nút thật, nhưng ta #EMP có thể#! kịp mở khóa..."
  ep3_contract_event.0570.c.success: "Ngươi mở được ổ khóa"
  ep3_contract_event.0570.c.failure: "Ngươi hết thời gian và buộc phải rút lui"

  ep3_contract_event.0575.t.success: "$ep3_contract_event.0570.t$: Thành Công"
  ep3_contract_event.0575.t.failure: "$ep3_contract_event.0570.t$: Thất Bại"
  ep3_contract_event.0575.desc.duel: "Thân xác vô hồn của tên lính gác đổ sụp xuống sàn, và ta lập tức lục soát mọi túi tiền, chìa khóa cùng những thứ tương tự. Ta tìm được một ít tiền xu và một [newly_created_artifact.GetName], nhưng không còn thời gian để chần chừ.\n\n"
  ep3_contract_event.0575.desc.success: "Chúng ta phải rời đi thật nhanh. Xiềng xích được tháo ra, rơi xuống sàn với tiếng #EMP choang#! chói tai, rồi cả hai lập tức biến mất. Qua cửa ngục, qua lối ra, rẽ quanh góc tường, và hòa vào ánh sáng ban ngày trong lành. Tự do.\n\n\"Ta không biết phải cảm tạ ngài thế nào cho đủ!\" [task_contract_employer.GetFirstName] nói, hơi thở của [task_contract_employer.GetHerHis] vẫn gấp gáp vì gắng sức. \"Ta mang ơn ngài. Từ giờ, Ta xin phục vụ ngài.\""
  ep3_contract_event.0575.desc.failure: "Cuộc vượt ngục là một thảm họa. [task_contract_employer.GetFirstName] vẫn bị xích vào tường, và mọi hy vọng giành được sự phục vụ của [task_contract_employer.GetHerHis] như phần thưởng cho cuộc giải cứu đã tan thành mây khói.\n\nTất cả những gì ta có thể làm là lầm lũi quay về ngựa — thật kín đáo, vì ta có thể đang bị truy đuổi — và chuẩn bị trở về nơi mình đã xuất phát."
  ep3_contract_event.0575.a: "Thật vinh hạnh khi có ngươi!"
  ep3_contract_event.0575.b: "Đáng tiếc thật."
  ep3_pilfered_brooch: "Trâm Mạ Bạc"

  laamp_find_secret_contract_contract: "Phanh Phui Bí Mật"
  laamp_find_secret_contract_desc_title: "Chiều theo sự tò mò của ta..."
  laamp_find_secret_contract_desc: "Cần những đôi mắt tinh ranh và đôi tai nhạy bén tại [TaskContract.GetEmployer.GetCurrentLocation.GetNameNoTooltip] để khai thác các bí mật cá nhân. Người nhận việc phải thật kín đáo."
  laamp_find_secret_contract_request: "[task_contract|E] này yêu cầu ngươi phải [travel|E] tới [TaskContract.GetLocation.GetName]."

  ep3_contract_event.0580.t: "Thông Tin Mật"
  ep3_contract_event.0580.desc: "[task_contract_employer.GetTitledFirstNamePossessive] nghi ngờ [task_contract_employer.GetHerHis] [task_contract_employer.Custom2('RelationToMeShort', SCOPE.sC('secret_haver'))], [secret_haver.GetTitledFirstName], và vì thế ta thấy mình đang lén lút theo dõi [secret_haver.GetHerHim] qua những hành lang của [secret_haver.GetFaith.HouseOfWorship].\n\n[secret_haver.GetSheHe|U] rõ ràng đang chìm đắm trong những lời tự sự với chính bản thân mình. Ta tiến thêm vài bước, ẩn mình sau một bức tường nhô ra.\n\nTa #EMP gần như#! có thể nghe thấy những lời thì thầm của [secret_haver.GetHerHis]. Dù đó là lời thú nhận với [secret_haver.GetFaith.HighGodName] hay chỉ là những lời lẩm bẩm điên rồ, ta vẫn không thể nghe rõ..."
  ep3_contract_event.0580.a: "Lén tiến lại gần thêm chút nữa..."
  ep3_contract_event.0580.a.success: "Ngươi lén đủ gần để nghe thấy"
  ep3_contract_event.0580.a.failure: "Ngươi không thể nghe rõ"
  ep3_contract_event.0580.b: "Có lẽ nếu ta #EMP giả vờ#! như mình đã biết..."
  ep3_contract_event.0580.b.success: "[task_contract_employer.GetFirstNameNoTooltip] tin vào lời nói dối của ngươi"
  ep3_contract_event.0580.b.failure: "[task_contract_employer.GetFirstNameNoTooltip] hoàn toàn không tin ngươi"
  ep3_contract_event.0580.c: "Ta chán cảnh lén lút rồi."
  ep3_contract_event.0580.c.tt: "Những lời đe dọa công khai có thể thành công khi nghe lén thất bại."
  ep3_contract_event.0580.c.neutral.tt: "[secret_haver.GetFirstNameNoTooltip] nở một nụ cười kỳ lạ trên gương mặt của [secret_haver.GetHerHis]..."
  ep3_contract_event.0580.c.success: "Lời đe dọa của ngươi có tác dụng"
  ep3_contract_event.0580.c.failure: "[secret_haver.GetFirstNameNoTooltip] khinh thường lời đe dọa của ngươi"
  ep3_contract_event.0580.c.neutral: "[secret_haver.GetFirstNameNoTooltip] đề nghị một thỏa thuận"

  ep3_contract_event.0581.t: "$ep3_contract_event.0580.t$: Một Thỏa Thuận Mới"
  ep3_contract_event.0581.desc: "Khi ta tiến về phía [secret_haver.GetTitledFirstName] với vẻ đe dọa, [secret_haver.GetSheHe] giơ hai tay lên cầu xin.\n\n\"Khoan đã! Ta biết ngươi đã nghe đủ rồi. Ta biết ngươi sẽ moi được phần còn lại từ ta. Nhưng ta có một đề nghị.\"\n\n\"Ta biết chính xác ai đã sai khiến ngươi làm việc này. Chủ nhân của ngươi không hề không có bí mật như [task_contract_employer.GetSheHe] vẫn tỏ ra đâu.\"\n\n\"Nếu ta đưa cho ngươi những thứ này...\" [secret_haver.GetSheHe] đưa ra một túi vàng nhỏ, đồng thời tháo một chiếc nhẫn khỏi ngón tay [secret_haver.GetHerHis] của mình, \"...có lẽ ngươi sẽ bị thuyết phục nhận lấy chúng cùng với bí mật đó, mang theo tất cả rời đi, và giữ kín bí mật của ta chăng?\""
  ep3_contract_event.0581.a: "Ta có khế ước phải hoàn thành."
  ep3_contract_event.0581.b: "Đó là một lời đề nghị đầy cám dỗ..."

  ep3_contract_event.0585.t.success: "$ep3_contract_event.0580.t$: Thành Công"
  ep3_contract_event.0585.t.failure: "$ep3_contract_event.0580.t$: Thất Bại"
  ep3_contract_event.0585.desc.success: "\"Tuyệt vời! Tuyệt vời!\" [task_contract_employer.GetTitledFirstName] vang lên đầy phấn khởi khi ta mang tin tức đến cho [task_contract_employer.GetHerHim]. \"Dĩ nhiên ta đã có những nghi ngờ của riêng mình, nhưng để chúng được xác nhận...\"\n\n[task_contract_employer.GetSheHe|U] ra hiệu cho một lính canh mang phần thưởng của ta đến, đồng thời vuốt cằm suy tư.\n\n\"Phần thưởng của ngươi đây. Nếu trong tương lai ta cần sự giúp đỡ, đừng ngần ngại đáp lại lời kêu gọi của ta. Tạm biệt, [ROOT.Char.GetTitledFirstNameNoTooltip].\""
  ep3_contract_event.0585.desc.failure: "\"Đồ ngu. Ngươi đúng là một tên [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('task_contract_employer'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('task_contract_employer'))]!\" [task_contract_employer.GetTitledFirstName] chẳng hề ấn tượng với nỗ lực phanh phui bí mật của [secret_haver.GetFirstNamePossessive].\n\n\"Ta #EMP phải#! biết bí mật đó! Bất cứ kẻ nào ta sai đi cũng hoặc bất tài, hoặc là lũ dối trá tầm thường! Ta đã tưởng ngươi có thể chấm dứt chuỗi thất vọng ấy.\" [task_contract_employer.GetSheHe|U] ra hiệu về phía cửa, môi cong lên khinh bỉ.\n\n\"Cút đi. Mong rằng đường đời của chúng ta sẽ không bao giờ giao nhau nữa, [ROOT.Char.GetTitledFirstNameNoTooltip].\""
  ep3_contract_event.0585.desc.liedsuccessfully: "\"Thật sao?\" Ta nín thở chờ đợi khi [task_contract_employer.GetTitledFirstName] cân nhắc lời nói dối trắng trợn của ta. \"Phải... phải rồi! Điều đó #EMP hoàn toàn#! hợp lý!\"\n\nTa thở phào nhẹ nhõm khi [task_contract_employer.GetSheHe] ra hiệu cho lính gác mang phần thưởng đến.\n\n\"Dĩ nhiên nó không hoàn toàn như ta mong đợi, nhưng khi ngươi #EMP nghĩ#! kỹ lại thì...\" [task_contract_employer.GetSheHe] rõ ràng không còn nói với ta, mà là tự nói với chính [task_contract_employer.GetHerselfHimself].\n\nĐã đến lúc phải rút lui thật nhanh."
  ep3_contract_event.0585.a: "Tuyệt hảo."
  ep3_contract_event.0585.b: "Đáng nguyền rủa!"

  laamp_eliminate_heir_contract_contract: "Loại Bỏ Người Thừa Kế"
  laamp_eliminate_heir_contract_desc_title: "Những kẻ sát thủ đường dài,"
  laamp_eliminate_heir_contract_desc: "Cần một lưỡi dao lành nghề và kín tiếng cho việc... giải quyết mâu thuẫn gia tộc. Quan hệ then chốt cùng phần thưởng hậu hĩnh đang chờ."
  laamp_eliminate_heir_contract_request: "[task_contract|E] này yêu cầu ngươi phải [travel|E] tới [TaskContract.GetLocation.GetName]."

  ep3_contract_event.0590.t: "Việc Bẩn"
  ep3_contract_event.0590.desc: "Người thừa kế phiền phức của [task_contract_employer.GetTitledFirstNamePossessive], [heir.GetTitledFirstName], có phần lơ là trong việc bảo vệ bản thân. Một chuyến đi dạo đêm muộn có thể giúp [heir.GetTitledFirstName] thư giãn đôi chút, nhưng một lưỡi dao khác sắp tìm được đường đến...\n\nThế nhưng, có điều gì đó vẫn khiến tay ta dừng lại. Ta được thuê để hoàn thành một nhiệm vụ, nhưng cảm giác này... thật không ổn.\n\nCó lẽ vẫn còn một cách khác để giải quyết chuyện này?"
  ep3_contract_event.0590.a: "Đủ rồi. Đến lúc phải chết, [heir.GetFirstNameNoTooltip]."
  ep3_contract_event.0590.a.success: "[heir.GetFirstNameNoTooltip] chết trong im lặng"
  ep3_contract_event.0590.a.failure: "[heir.GetFirstNameNoTooltip] nghe thấy động tĩnh và bỏ chạy"
  ep3_contract_event.0590.b: "Có lẽ ta chỉ cần làm [heir.GetHerHim] bất tỉnh?"
  ep3_contract_event.0590.b.success: "[heir.GetFirstNameNoTooltip] gục xuống thành một đống"
  ep3_contract_event.0590.b.failure: "[heir.GetFirstNameNoTooltip] nghe thấy động tĩnh"
  ep3_contract_event.0590.b.fatalbonk: "Ngươi đánh [heir.GetHerHim] hơi #EMP quá#! tay"
  ep3_contract_event.0590.c: "Có lẽ nếu ta giải thích tình hình..."
  ep3_contract_event.0590.c.success: "[heir.GetFirstNameNoTooltip] đồng ý đi theo ngươi"
  ep3_contract_event.0590.c.failure: "[heir.GetFirstNameNoTooltip] chế giễu câu chuyện của ngươi"
  ep3_contract_event.0590.c.critfailure: "Ngươi lỡ miệng để lộ kẻ đứng sau vụ này"

  ep3_contract_event.0591.t: "$ep3_contract_event.0590.t$: Cơ Hội Thứ Hai"
  ep3_contract_event.0591.desc.knockedout: "Ta ngồi trên một tảng đá ở vùng ngoại ô [location.GetName], quan sát [heir.GetTitledFirstName] dần tỉnh lại. Cú đánh vào đầu [heir.GetHerHis] của ta rõ ràng đã được tính toán kỹ: [heir.GetSheHe] sẽ bị đau đầu trong một ngày, nhưng chắc chắn sẽ không để lại tổn thương lâu dài.\n\nTa mất vài phút để giải thích tình hình. Xét đến những biến động mà [heir.GetHerHis] cuộc đời phải đối mặt, [heir.GetFirstNameNoTooltip] tiếp nhận mọi chuyện một cách đáng kinh ngạc.\n\n\"Cảm ơn ngươi đã tha cho ta.\" [heir.GetSheHe|U] nói, buộc một chiếc túi vào con ngựa mà ta đã chuẩn bị cho [heir.GetSheHe]. \"Ta sẽ không quên điều này. Hy vọng chúng ta sẽ gặp lại nhau.\" Nói rồi, [heir.GetSheHe] bắt đầu thúc ngựa rời đi, giơ tay chào tạm biệt."
  ep3_contract_event.0591.desc.camewillingly: "Ta ngồi trên một tảng đá, nhìn [heir.GetTitledFirstName] buộc chặt túi đồ lên ngựa của [heir.GetHerHis]. Quãng đường đến rìa [location.GetName] là vừa đủ để ta giải thích tình hình, và [heir.GetFirstNameNoTooltip] vui vẻ đi theo không chút do dự.\n\n\"Cảm ơn ngài đã tha cho Ta.\" [heir.GetSheHe|U] nói, khi túi đồ đã được cố định xong. \"Ta sẽ không quên. Mong rằng rồi chúng ta sẽ còn gặp lại.\" Nói rồi, [heir.GetSheHe] thúc ngựa rời đi, tay giơ cao chào tạm biệt."
  ep3_contract_event.0591.a: "\"Chúc ngươi may mắn!\""

  ep3_contract_event.0595.t: "$ep3_contract_event.0590.t$: Việc Không Thành"
  ep3_contract_event.0595.desc: "Mọi nỗ lực nhằm thực hiện mong muốn của [task_contract_employer.GetFirstNamePossessive] đã tan thành mây khói.\n\n[heir.GetFirstName|U] vẫn sống, như một cái gai trong mắt [task_contract_employer.GetFirstNamePossessiveNoTooltip]. Về phần mình, ta phải nhanh chóng rời khỏi [location.GetName], kẻo cơn thịnh nộ của chủ thuê sẽ tìm đến."
  ep3_contract_event.0595.a: "Trở lại con đường..."
