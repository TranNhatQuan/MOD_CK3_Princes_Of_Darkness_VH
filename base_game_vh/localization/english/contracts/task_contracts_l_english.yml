  laamp_base_1021_request: "$laamp_request_boilerplate_martial_scheme$"
  laamp_base_1031_request: "$laamp_request_boilerplate_martial_scheme$"
  laamp_base_1041_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới một [holding|E] xa xôi, phục kích các [characters|E] để cướp [gold|E] của họ thông qua các thử thách [prowess|E], [martial|E] hoặc [intrigue|E].\n$laamp_request_boilerplate_criminal$"
  laamp_base_2001_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới một [holding|E] [city|E] và điều tra thông qua các sự kiện. Phần thưởng cuối cùng phụ thuộc vào việc chứng minh rằng các [characters|E] ở đó không nộp đủ thuế, bằng cách hoàn thành các thử thách [skill|E] [stewardship|E] hoặc thử thách [aptitude|E] của [GetCourtPositionType('quartermaster_camp_officer').GetName()]."
  laamp_base_2011_request: "[task_contract|E] này yêu cầu Ngài [travel|E] qua nhiều [holdings|E] trong [realm|E] của [contractor_possessive|E], vượt qua một thử thách [skill|E] [stewardship|E], [intrigue|E], hoặc một bài kiểm tra [aptitude|E] của [GetCourtPositionType('quartermaster_camp_officer').GetName()]."
  laamp_base_2021_request: "$laamp_request_boilerplate_stewardship_scheme$"
  laamp_base_2031_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới [holding|E] của một [baron|E] và hoàn thành một thử thách. Ngài chắc chắn sẽ được kiểm tra [stewardship|E], nhưng các lựa chọn khác phụ thuộc vào vấn đề gặp phải, [camp_purpose|E] của Ngài, [followers|E], và [officers|E]."
  laamp_base_2041_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới tối đa #BOL [TaskContract.GetEmployer.MakeScope.ScriptValue('laamp_base_2041_num_counties_to_rob_sans_capital_value')|0]#! [counties|E] trong lãnh thổ của [TaskContract.GetEmployer.GetTitledFirstNamePossessive], hoàn thành các thử thách [stewardship|E], [intrigue|E], hoặc [aptitude|E] của [GetCourtPositionType('master_bard_camp_officer').GetName()] với độ khó tăng dần để lừa các thần dân của [TaskContract.GetEmployer.GetHerHis] giao nộp số thuế lẽ ra thuộc về [TaskContract.GetEmployer.GetTitleAsNameNoTooltip]\n$laamp_request_boilerplate_criminal$"
  laamp_base_3001_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới ba [counties|E], thực hiện các thử thách [intrigue|E] hoặc [diplomacy|E] tại mỗi nơi — hoặc đơn giản là tiêu hao [prestige|E] và [opinion|E]"
  laamp_base_3011_request: "$laamp_request_boilerplate_intrigue_scheme$\n$laamp_request_boilerplate_criminal$"
  laamp_base_3021_request: "$laamp_request_boilerplate_intrigue_scheme$\n$laamp_request_boilerplate_criminal$"
  laamp_base_3031_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới một [location|E] và phóng hỏa thông qua một thử thách [intrigue|E]. [martial|E], [prowess|E], và [officers|E] của Ngài cũng có thể được sử dụng thay thế.\n$laamp_request_boilerplate_criminal$"
  laamp_base_3041_request: "$laamp_request_boilerplate_intrigue_scheme$; nếu thành công, Ngài sẽ có thể kiểm tra [intrigue|E], [agents|E], và [officers|E] để đánh cắp thêm [gold|E]\n$laamp_request_boilerplate_criminal$"
  laamp_base_4031_request: "$laamp_request_boilerplate_learning_scheme$"
  laamp_base_4041_request: "$laamp_request_boilerplate_learning_scheme$\n$laamp_request_boilerplate_criminal$"
