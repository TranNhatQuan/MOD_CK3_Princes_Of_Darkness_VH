  laamp_join_war_contract_request: "$laamp_request_boilerplate_warfare$. Chủ thuê, [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip], đang [SelectLocalization( ObjectsEqual(TaskContract.MakeScope.Var('task_contract_war').War.GetActiveCB.GetDefender.GetName ,TaskContract.GetEmployer.GetName ), 'laamp_join_war_contract_defender', 'laamp_join_war_contract_attacker' )] trong [TaskContract.MakeScope.Var('task_contract_war').War.GetName]. Phe của [TaskContract.GetEmployer.GetFirstNamePossessiveNoTooltip] có [TaskContract.GetEmployer.GetMilitaryStrengthText|V] binh sĩ trong khi phe đối địch có [TaskContract.MakeScope.Var('task_contract_target').Char.GetMilitaryStrengthText|V] binh sĩ."
