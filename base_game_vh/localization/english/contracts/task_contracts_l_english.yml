  laamp_base_0031_request: "[task_contract|E] này yêu cầu Ngài [travel|E] tới #BOLD 3#! [counties|E] trong lãnh thổ của [TaskContract.GetEmployer.GetTitledFirstNamePossessive], sử dụng một [skill|E] khác nhau tại mỗi nơi để giúp [TaskContract.GetEmployer.GetHerHim] loại bỏ một [modifier|E] tiêu cực."
  laamp_base_0041_request: "$laamp_request_boilerplate_diplomacy_scheme$\n$laamp_request_boilerplate_criminal$"
  laamp_base_1001_request: "[task_contract|E] này yêu cầu Ngài giết một [character|E] cụ thể, bằng cách [single_combat_duel|E], hoàn thành một thử thách [skill|E] [martial|E], hoặc ném [men_at_arms|E] của Ngài vào và chấp nhận tổn thất."
