  AI_PERSONALITY_TOOLTIP:0 "#T Tính cách\n#!Tính cách của một nhân vật ảnh hưởng đến các quyết định họ đưa ra. Tính cách chủ yếu được quyết định bởi [traits|E].\n\nNhững nhân vật do người chơi điều khiển không có Tính cách, vì hành vi của họ do người chơi quyết định."
