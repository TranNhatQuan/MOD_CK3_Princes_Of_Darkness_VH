l_english:
 hold_court.7000.t: "Phân Chia Công Bằng"
 hold_court.7000.desc: "[local_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bước vào triều đình, đôi mắt [local_leader.GetHerHis] đầy kinh ngạc khi chiêm ngưỡng sự giàu có mà kinh đô có thể phô bày.\n\n"Không ai không biết rằng [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] là niềm ghen tị của cả thế gian, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng không phải mọi nơi trong lãnh địa của ngài đều may mắn như vậy. Chẳng hạn ở [low_dev_county.GetNameNoTier], những cánh đồng hoang vu đến mức hiếm thấy bóng người canh tác. Nếu toàn bộ lãnh địa đều huy hoàng như [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U], há chẳng phải tuyệt vời sao?""
 hold_court.7000.a: ""Quả đúng là vậy.""
 hold_court.7000.b: ""Thần dân của ngươi đã thử sống ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] chưa?""
 hold_court.7000.c: ""Chuyện này đáng để ta bận tâm sao? Không hề.""
 hold_court.7010.t: "Hai Đức Tin, Một Gia Tộc"
 hold_court.7010.desc: "[friendly_neighbour.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sải bước vào sảnh với sự tự tin không xứng đáng với [friendly_neighbour.GetHerHim], như thể [friendly_neighbour.GetSheHe] là bất cứ ai ngoài một kẻ xâm nhập vào triều đình [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] nhân từ của ta.\n\n\"Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstName] tốt bụng, không có gì bí mật khi ngài là một [ROOT.Char.GetWomanMan] có nhiều kẻ thù ở biên giới, nhưng nếu tôi may mắn, tôi ước không nằm trong số đó. Nhiều người muốn thấy tất cả [ROOT.Char.GetFaith.GetAdherentNamePlural] bị xóa sổ khỏi khu vực, nhưng tôi đề nghị ngài và tôi mang lại hòa bình. Vấn đề khá đơn giản, ngài có một [potential_prince.Custom('GetDaughterSon')], tôi có một [foreign_princess.Custom('GetDaughterSon')]. Hãy để hai người kết hôn và kết thúc những cuộc cãi vã.\""
 hold_court.7010.a.jewish: ""Mazel tov!""
 hold_court.7010.a: ""Vậy thì hãy tổ chức hôn lễ!""
 hold_court.7010.b: ""Lưỡi kiếm của ta khát máu của bọn [friendly_neighbour.GetFaith.GetAdherentNameNoTooltip]!""
 hold_court.7010.c: ""Một cuộc hôn nhân như vậy là dị giáo.""
 every_county_10_dev_below_capital: "Mọi [county|E] có mức [development|E] thấp hơn [capital|E] của ngươi ít nhất 10 cấp"
 hc_7000_dev_boost: "Phát Triển Hưng Thịnh"
 hc_7000_dev_boost_desc: "Nguồn lực gần đây đã được điều chuyển để hỗ trợ sự phát triển của quận này."
 hc_7000_dev_reduction: "Phát Triển Bị Kìm Hãm"
 hc_7000_dev_reduction_desc: "Nguồn lực của quận này đang bị điều chuyển đến những vùng xa xôi khác trong lãnh địa, làm suy giảm chất lượng cuộc sống tại đây."
 hc_7010_holy_war: "Chuẩn Bị Thánh Chiến"
 hc_7010_holy_war_desc: "Nhân vật này gần đây đã ra lệnh rằng mọi kẻ ngoại đạo trong và quanh lãnh thổ của mình phải bị tiêu diệt."
 hc_7010_tolerance: "Hôn Nhân Khoan Dung"
 hc_7010_tolerance_desc: "Nhân vật này gần đây đã gả một người thân của mình cho một thành viên thuộc đức tin khác, lan truyền tinh thần khoan dung khắp lãnh địa."
 hold_court.7020.t: "Tấm Khiên của [ROOT.Char.GetFaith.GetNameNoTooltip]"
 hold_court.7020.desc.intro: "[same_faith_friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hôm nay bước vào triều đình ta cùng một đoàn [ROOT.Char.GetFaith.PriestNeuterPlural] trang nghiêm đi theo sau, vừa tiến vừa tụng những lời cầu nguyện truyền thống của [ROOT.Char.GetFaith.GetAdjective].\n\n"[ROOT.Char.GetTitleAsNameNoTooltip|U], ngài và ta đều biết rằng những truyền thống cổ xưa đang bị đe dọa.""
 hold_court.7020.desc.mid.oppression: "Vô số tín đồ của [ROOT.Char.GetFaith.HighGodName|U] đã bị khuất phục dưới quyền [threatening_ruler.GetName], và nguy cơ bị cưỡng ép cải đạo ngày càng lớn."
 hold_court.7020.desc.mid.recent_war: "Lãnh thổ của ngài đã bị bàn tay [threatening_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip|U] xâm phạm, và những đền thờ của [ROOT.Char.GetFaith.HighGodNamePossessive|U] đã bị thiêu rụi."
 hold_court.7020.desc.mid.holy_site: "Những vùng thánh địa của chúng ta vẫn nằm ngoài tầm tay, và ta e rằng các tín đồ sẽ không bao giờ có thể hành hương đến những nơi được [ROOT.Char.GetFaith.HighGodNamePossessive|U] chọn lựa trên cõi trần này."
 hold_court.7020.desc.outro: "Rõ ràng rằng chúng ta phải tổ chức lại đức tin, để những truyền thống cổ xưa có thể sống sót trước làn sóng tấn công của [threatening_ruler.GetFaith.GetReligion.GetName].""
 hold_court.7020.a: ""Muốn tồn tại, chúng ta phải thay đổi.""
 hold_court.7020.b: ""Hãy vững lòng, chúng ta không được hy sinh truyền thống.""
 hold_court.7020.c: ""Cùng nhau, chúng ta có thể gìn giữ những truyền thống cổ xưa mãi mãi.""
 rival_planning_holy_war: "[CHARACTER.GetShortUIName|U] đã bác bỏ lời cầu xin hòa bình tôn giáo của [TARGET_CHARACTER.GetShortUINamePossessive]"
 rival_planning_holy_war_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] đã bác bỏ lời cầu xin hòa bình tôn giáo của [CHARACTER.GetShortUINamePossessive]"
 friend_beyond_faith: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã gác lại mọi khác biệt tôn giáo vì gia tộc và liên minh"
 friend_united_by_faith: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] đã trở nên gắn kết bởi cùng một đức tin"
 ignore_3_site_rule_tt: "Ngươi có thể cải cách [faith|E] của mình mà không cần yêu cầu thông thường là phải nắm giữ các [holy_sites|E]"
 friend_will_convert_tt: "[same_faith_friend.GetFirstName|U] sẽ cải đạo sang đức tin đã được cải cách cùng với ngươi."
 truce_religious_tolerance: "Khoan Dung Tôn Giáo"
 hc_7020_guardian_of_the_old_ways: "Hộ Vệ Cổ Đạo"
 hc_7020_guardian_of_the_old_ways_desc: "Nhân vật này đã hiến mình cho việc bảo vệ và gìn giữ đức tin của mình."
