l_english:

 #### Your Heir is a Jerk, by Isabella Welch
 hold_court.4001.t:0 "Tai Họa"
 hold_court.4001.desc.intro:0 "[annoyed_vassal.GetTitledFirstName] xông thẳng lên phía trước phòng ngai vàng của ta. "[ROOT.Char.Custom2('RelationToMeAddress', annoyed_vassal)|U], nhiều người cho rằng [preferred_heir.GetTitledFirstName] nên trở thành người kế vị của ngài thay vì [annoying_heir.GetTitledFirstName]. Khắp [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] đều biết rằng người thừa kế của ngài, [annoying_heir.GetTitledFirstNameNoTooltip], xúc phạm người khác đến mức biến sự xúc phạm thành một kỹ năng!"
 hold_court.4001.heir_street_fight:0 "Tên vô lại khát máu đó lảng vảng ngoài các quán rượu và khiêu khích những nông dân say xỉn đánh nhau. Đã có vài kẻ chết trong những trận ẩu đả ấy khi [annoying_heir.GetSheHe] giết người chỉ để mua vui!""
 hold_court.4001.heir_robbery: "Trong hành trình đến đây, tôi đã bị một tên cướp ăn mặc lòe loẹt cướp bóc. [annoying_heir.GetSheHe|U] lột sạch đồ và trói tôi vào một cái cây, trước khi tháo mặt nạ [annoying_heir.GetHerHis] của ngài và đắc chí nói rằng [annoying_heir.GetSheHe] thực sự là [annoying_heir.GetTitledFirstNameNoTooltip]!\""
 hold_court.4001.heir_tavern: "[annoying_heir.GetSheHe|U] thực tế sống trong quán rượu, và một khi [annoying_heir.GetSheHe] đã tiêu xài hết phụ cấp [annoying_heir.GetHerHis] của ngài, những người khác mua đồ uống cho [annoying_heir.GetHerHim] để đổi lấy việc thực hiện những ấn tượng tục tĩu về ngài!\""
 hold_court.4001.heir_diplomacy_failure: "[annoying_heir.GetSheHe|U] từ chối tham dự một cuộc họp nào, và khi tôi hỏi [annoying_heir.GetHerHim] tại sao, [annoying_heir.GetSheHe] nói với tôi 'chúng quá buồn tẻ, chúng ta sẽ có nhiều niềm vui hơn khi giết nhau.'\""
 hold_court.4001.heir_hated:0 "[annoying_heir.GetSheHe|U] là một kẻ khoác lác đáng ghét và còn khoe với ta rằng [annoying_heir.GetSheHe] chẳng quan tâm liệu có ai trong chúng ta thích [annoying_heir.GetHerHim] hay không."" 
 hold_court.4001.protective_parent:0 "\n\n[protective_parent.GetTitledFirstNameNoTooltip] tặc lưỡi, kinh hãi. "Đứa [annoying_heir.Custom('PetName')] của ta sẽ không bao giờ làm chuyện như vậy!"" 
 hold_court.4001.accusation_default:0 "\n\n[annoyed_vassal.GetSheHe|U] thở dài. "Nhưng ta chắc rằng [annoying_heir.GetSheHe] sẽ phủ nhận đã làm chuyện này."" 
 hold_court.4001.heir_admission:0 "\n\nMột nụ cười như sói lan rộng trên gương mặt của [annoying_heir.GetTitledFirstNamePossessiveNoTooltip]. "Ồ, ta đúng là đã làm vậy.""
 hold_court.4001.a:0 "Thật đáng yêu, [annoying_heir.GetSheHe] giống hệt [annoying_heir.GetHerHis] [ROOT.Char.GetMotherFather]!"
 hold_court.4001.b:0 "Đây là giọt nước tràn ly! Người kế vị sẽ là [preferred_heir.GetTitledFirstNameNoTooltip]."
 hold_court.4001.c:0 "Theo kinh nghiệm của ta, [preferred_heir.GetTitledFirstNameNoTooltip] cũng khó chịu chẳng kém!"
 hold_court.4001.d:0 "Không hoàn hảo khiến binh lính thấy [annoying_heir.GetHerHim] giống họ!"

 disabled_fallback:0 "bị vô hiệu hóa"

 ## Inspired Poet appears at court and makes demands by Isabella Welch

 hold_court.4500.t:0 "Thi Ca Bất Tận"
 hold_court.4500.desc: "Một nhân vật lộng lẫy với tia sáng mặc khải về [demanding_poet.GetHerHim] của hắn tiến lại gần. \"Tôi là một nhà thơ vĩ đại và tôi đã đi xa chỉ để phục vụ ngài. Tôi đã soạn ra bản ballad vĩ đại nhất của vũ trụ, về vinh quang của ngài và sự tráng lệ của triều đình [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip].\""
 hold_court.4500.a:1 "Ta không cần một nhà thơ."
 hold_court.4500.b:1 "Những vần thơ của ngươi thật duyên dáng, hãy đến viết cho triều đình của ta."

### Peasants are convinced you're a literal monster by Isabella Welch 
 hold_court.4600.t: "[ROOT.GetCharacter.GetSheHe|U] Người tạo ra con quái vật từ [ROOT.GetCharacter.GetHerselfHimself|U]..."
 hold_court.4600.desc:1 "Một đám nông dân nhếch nhác xuất hiện trước ngai vàng của ta. Chúng cầm những nông cụ đang cháy rực hung dữ nhất mà ta từng thấy trong suốt sự nghiệp dẹp loạn của mình.\n\n"Sinh vật đang cai trị chúng ta là một con quỷ thực sự. Không một [ROOT.GetCharacter.GetWomanMan] bình thường nào có thể làm ra những hành động bạo lực cực đoan và thô tục như vậy. Chúng ta yêu cầu chấm dứt sự bạo ngược quái vật của ngươi!""
 hold_court.4600.a:0 "Ta không phải quỷ, ta là một [ROOT.Char.GetTitleAsNameNoTooltip], mà điều đó còn #EMP tệ hơn#! nhiều."
 hold_court.4600.b:0 "Một ý tưởng đáng yêu! [chancellor.GetCouncilTitle]! Hãy truyền tin rằng ta là quỷ."
 hold_court.4600.c:0 "Ta thực sự đã trở nên ghê tởm đến vậy sao?"
 hold_court.4600.c.tt:1 "Vẫn chưa quá muộn để thay đổi."
 hold_court.4600.d:1 "Tống đám hỗn láo này ra khỏi tầm mắt ta."
### Vassal invites you to a suspicious dinner by Isabella Welch
 hold_court.4601.t:0 "Kính gửi [ROOT.GetCharacter.GetLadyLord|U] đáng kính của ta,"
 hold_court.4601.d:0 "Trái tim ta vẫn chưa ngừng rung động kể từ khi ta nghe dân thị trấn kể rằng ngài mang linh hồn của một con quỷ thực thụ. Ta luôn hối tiếc vì chưa được quen biết sâu hơn với con người đáng sợ ấy.\n\nHãy ghé thăm lâu đài của ta, và chúng ta sẽ dùng bữa với những món ngon sống nhất mà [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] từng biết!"
 hold_court.4601.a:0 "Nghe thật tuyệt vời!"
 hold_court.4601.b:0 "Chúng ta có những yến tiệc ngon hơn ở nhà..."

### Sophisticated Cannibal dinner by Isabella Welch
 hold_court.4602.t:0 "[ROOT.GetCharacter.GetLadyLord|U] Ngon Miệng Của Ta"
 hold_court.4602.desc: "[cannibal_vassal.GetTitledFirstNamePossessiveNoTooltip] [cannibal_vassal.Custom('FortifiedBuilding')] chỉ được chiếu sáng bởi vài ngọn nến lay lắt. [cannibal_vassal.GetSheHe|U] cho ta ngồi xuống trước một bàn tiệc không có món ăn nào khác ngoài vô vàn những miếng thịt tái.\n\n[cannibal_vassal.GetSheHe|U] lẩn khuất sau ghế của ta, chờ ta chọn thức ăn. Sau một lúc, [cannibal_vassal.GetSheHe] nghiêng đầu sát cạnh ta, để lộ hàm răng [cannibal_vassal.GetHerHis] của ngài.\n\n\"Có rất nhiều [ROOT.GetCharacter.GetWomenMen] tuyệt vời được nấu chín trước mặt chúng ta đêm nay, nhưng không ai ngon bằng ngài!\""
 hold_court.4602.a:0 "Ta nên ăn ai cho món khai vị?"
 hold_court.4602.b:0 "Được thôi, ngươi có thể cắn một miếng."
 hold_court.4602.c:0 "Ta sẽ rời đi! Chuyện này thật ghê tởm!"

## Shady genealogist offers to prove you are descended from mythical heroes by Isabella Welch

 hold_court.4900.t:0 "Vào Thời Cổ Đại..."
 hold_court.4900.desc:1 "Một nhân vật cổ xưa tiến lại gần ngai vàng của ta, với tiếng lách cách và tiếng gõ của cây gậy [suspicious_genealogist.GetHerHis] của ngài kèm theo mỗi bước đi.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tôi là một nhà phả hệ, và ngài biết mình có nguồn gốc quý tộc. Tuy nhiên, quý tộc không hoàn toàn giống với thần thánh hay thần thoại. Tôi mong muốn viết một cuộn giấy truy tìm toàn bộ dòng dõi của ngài trở về buổi bình minh của lịch sử. Chỉ với một ít vàng, tôi có thể tiết lộ sự thật cho ngài và thế giới: ngài là hậu duệ thực sự của [ROOT.GetCharacter.Custom('GetMythicalFounder')]!\""
 hold_court.4900.a:1 ""Ta không cần một mảnh giấy để nói điều đó!""
 hold_court.4900.b:1 ""Tuyệt vời! Hãy đảm bảo danh sách dài vô tận!""
 hold_court.4900.c:1 ""[ROOT.GetCharacter.Custom('GetMythicalFounder')] ư? Chẳng là gì so với ta!""
 hold_court.4900.d:1 ""Triều đại của ta có thể còn nhỏ, nhưng chúng ta không phải kẻ ngốc!""
 hold_court.4900.e: ""Một tiền đề hoàn hảo để củng cố địa vị huyền thoại của ta!""

 hold_court.4901.desc.intro: "Sau vài ngày, nhà phả hệ [suspicious_genealogist.GetTitledFirstName] quay trở lại. [suspicious_genealogist.GetSheHe|U] mở ra một cuộn giấy đủ dài để bao quanh một trong các hạt của ta. [chaplain.GetCouncilTitle] của ta vấp phải nó một chút khi đầu được mở ra lăn đến chân ngai vàng của ta.\n\n\"Tôi có ở đây sự thật về nguồn gốc của ngài, thưa [ROOT.Char.Custom('FormOfAddressForLiege')],\" [suspicious_genealogist.GetSheHe] hắng giọng [suspicious_genealogist.GetHerHis] của ngài và bắt đầu đọc, \"hôm nay chúng ta công bố một lịch sử vĩ đại. Đứng trước chúng ta là [ROOT.GetCharacter.GetTitledFirstNameNoTooltip],\""
 hold_court.4901.mothers:0 "con gái của [mother_1.GetFullNameNicknamedNoTooltip], sinh ra bởi [mother_2.GetFullNameNicknamedNoTooltip] đáng sợ, kết quả từ huyết mạch của [mother_3.GetFullNameNicknamedNoTooltip], bước ra từ dạ con của [mother_4.GetFullNameNicknamedNoTooltip], con của [mother_5.GetFullNameNicknamedNoTooltip] xinh đẹp..."
 hold_court.4901.fathers:0 "con trai của [father_1.GetFullNameNicknamedNoTooltip], sinh ra bởi [father_2.GetFullNameNicknamedNoTooltip] đáng sợ, kết quả từ huyết mạch của [father_3.GetFullNameNicknamedNoTooltip], con trai của [father_4.GetFullNameNicknamedNoTooltip] đáng kính, con của [father_5.GetFullNameNicknamedNoTooltip]...""
 hold_court.4901.desc.outro:0 "\n\nVài mí mắt trong triều đình bắt đầu trĩu xuống."
 hold_court.4901.a:0 "Đã đến lúc ngủ trưa. Ta sẽ mơ về vinh quang của chính mình."
 hold_court.4901.a.tt:0 "Ngươi để phần còn lại của triều đình chăm chú lắng nghe"
 hold_court.4901.b:0 "Điều này còn kích thích hơn bất kỳ khúc ca nào! Ta đang ngồi trên mép ngai!"
 hold_court.4901.c:0 ""Đủ rồi! [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTooltip] nợ ngươi vì công sức này."" 
