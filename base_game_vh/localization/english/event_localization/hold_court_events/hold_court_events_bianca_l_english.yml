l_english:
 # 
  hold_court.3000.t:0 "Một Yến Tiệc Dưới Danh Nghĩa Của Ngài"
  hold_court.3000.desc.opening:0 "[feast_vassal.GetTitledFirstName] tiến đến gần ta với tư thế thẳng thắn hơn thường lệ và rõ ràng rất hào hứng với điều [feast_vassal.GetSheHe] sắp nói.\n\n"
  hold_court.3000.desc.opening.blind:0 "Ta nghe tiếng bước chân của [feast_vassal.GetTitledFirstName] tiến đến gần. Khi họ dừng lại, một tiếng hắng giọng rõ ràng đã được luyện tập vang lên từ cổ họng của [feast_vassal.GetHerHis]. Có lẽ để thu hút sự chú ý của ta. Ta có thể nghe thấy rằng [feast_vassal.GetSheHe] có vẻ rất hài lòng với điều [feast_vassal.GetSheHe] sắp nói.\n\n"
  hold_court.3000.desc.likes:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')], dưới sự cai trị của ngài có rất nhiều điều đáng ăn mừng! Xin hãy cho phép ta chi trả toàn bộ chi phí cho yến tiệc sắp tới của ngài! Có lẽ đổi lại, ngài sẽ ban cho ta một ân huệ trong tương lai?""
  hold_court.3000.desc.dislikes:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')]. Người dân trong lãnh địa của ngài đôi khi cũng cần những buổi tụ họp vui vẻ để quên đi lo toan. Ta sẵn lòng tài trợ cho một yến tiệc, dù được tổ chức dưới danh nghĩa của ngài, miễn là vì lợi ích của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Tuy nhiên, ta cũng mong đợi một ân huệ để đáp lại.""
  hold_court.3000.a:1 "Rất tốt, ta chấp nhận."
  hold_court.3000.a.tt:0 "Tổ chức một yến tiệc trong thời gian gần sẽ mang lại phần thưởng [court_grandeur_value|E]."
  hold_court.3000.b:1 "Không kèm điều kiện! Lãnh chúa của ngươi ra lệnh!"
  hold_court.3000.c:1 "Có lẽ chúng ta có thể sắp xếp điều gì đó dễ chịu hơn?"
  hold_court.3000.c.success:0 "[feast_vassal.GetTitledFirstNameNoTooltip] đồng ý từ bỏ yêu cầu về một ân huệ"
  hold_court.3000.c.failure:0 "[feast_vassal.GetTitledFirstNameNoTooltip] không đồng ý và rút lại đề nghị chi trả"
  hold_court.3000.d:1 "Ta e rằng không thể chấp nhận."

  hold_court.3001.desc:0 "Quả là một yến tiệc tuyệt vời! Với lời hứa về bữa tiệc dành cho [feast_vassal.GetTitledFirstName] vẫn còn mới mẻ trong ký ức của những người tham dự ngày hôm đó, các khách mời tại yến tiệc của ta đã hân hoan ca ngợi ta không ngớt. Ta gần như say trong niềm hạnh phúc khi mọi người reo hò và tôn vinh dưới chân ta! Một lợi ích nữa từ việc giữ lời hứa với [feast_vassal.GetFirstNameNoTooltip] là tất cả những người tham dự đều nói tốt về triều đình của ta!"
  hold_court.3001.desc.dead:0 "Ôi, thật là một yến tiệc huy hoàng! Thật đáng tiếc khi [feast_vassal.GetTitledFirstName] không thể chứng kiến. Một vài khách mời nhớ lại lời hứa yến tiệc của ta dành cho [feast_vassal.GetHerHim], và nói đầy thiện cảm về sự tận tâm của ta đối với việc giải trí của triều đình. Một số còn cho rằng buổi lễ này cũng được tổ chức để tưởng nhớ [feast_vassal.GetFirstNameNoTooltip]. Dù thế nào đi nữa, việc giữ lời hứa cũng mang lại lợi ích khi tất cả những người tham dự đều nói tốt về triều đình của ta!"
  hold_court.3001.a:0 "Ta chắc rằng yến tiệc tiếp theo sẽ còn tuyệt hơn!"
  hold_court.3001.b:0 "Một chén nữa nhân danh [feast_vassal.GetHerHis]!"

  hold_court.3010.t:0 "Một Nhà Giảng Đạo Khác Thường"
  hold_court.3010.desc.opening:0 ""[ROOT.Char.Custom2('RelationToMeAddress', religious_vassal)|U]," giọng nói của [religious_vassal.GetTitledFirstNamePossessive] nghiêm nghị. "Ta yêu cầu mở một cuộc điều tra về một nhà giảng đạo tai tiếng ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Ngài thấy đấy, nhà giảng đạo này... ừm... "
  hold_court.3010.desc.preacher_gender:0 "[unconventional_preacher.GetSheHe] là một #EMP [unconventional_preacher.GetWomanMan]!#! "
 #hold_court.3010.desc.preacher_marriage: "The problem with this preacher is that [unconventional_preacher.GetSheHe] married to someone else than [ROOT.Char.GetFaith.HighGodName]!" 
  hold_court.3010.desc.closing:0 "Điều này không phù hợp với đức tin của chúng ta!\"\n\n[tolerant_vassal.GetTitledFirstName] ngắt lời bài phát biểu [religious_vassal.GetFirstNamePossessiveNoTooltip] bằng cách giơ tay [tolerant_vassal.GetHerHis] của ngài lên và bước tới. \"[ROOT.Char.Custom2('RelationToMeAddress', tolerant_vassal)|U], trong khi [religious_vassal.GetFirstNameNoTooltip] đúng trong đánh giá [religious_vassal.GetHerHis] của hắn, đó là khuyết điểm #EMP duy nhất#! của nhà truyền giáo. Tất cả những gì [unconventional_preacher.GetSheHe] giảng dạy đều phù hợp với đức tin của chúng ta.\""
  hold_court.3010.a:1 "Nhà giảng đạo này phải gia nhập triều đình của ta!"
  hold_court.3010.b:1 "Đuổi nhà giảng đạo này khỏi tầm mắt ta!"
  hold_court.3010.c:1 "Ta muốn bổ nhiệm người này làm $high_almoner_court_position$."
  hold_court.3010.d:0 "Nếu [unconventional_preacher.GetSheHe] có thể dạy dân thường, thì [unconventional_preacher.GetSheHe] sẽ là một $court_tutor_court_position$ tốt..."

  hold_court.3020.t:0 "Một Tượng Đài Gây Xúc Phạm"
  hold_court.3020.desc:0 "Một nông dân bước lên phía trước, cầm theo một bản kiến nghị. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], tôi đến đây với tư cách đại diện cho người [village.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] từ [village.GetName]." Người nông dân tạm dừng bài phát biểu đã luyện sẵn của [different_culture_peasant.GetHerHis].\n\n"Thỉnh cầu của chúng tôi về việc khôi phục một tượng đài quan trọng của văn hóa mình đã bị [holder_of_area.GetTitleTierName] phớt lờ. [holder_of_area.GetSheHe|U] đang tích cực ngăn cản chúng tôi xây dựng lại!"\n\n"[ROOT.Char.Custom2('RelationToMeAddress', holder_of_area)|U], xin cho phép tôi giải thích!" [holder_of_area.GetFirstNameNoTooltip] vội vàng chen vào. "Tượng đài đó chế nhạo văn hóa của chúng ta! Nó khắc họa người [holder_of_area.GetCulture.GetCollectiveNounNoTooltip] như quái vật! Chắc hẳn ngài hiểu vì sao tôi phản đối việc khôi phục một tượng đài đầy thù hằn như vậy!""
  hold_court.3020.a:1 ""Phá nó đi!""
  hold_court.3020.b:0 "Ban phê chuẩn chính thức cho việc khôi phục."
  hold_court.3020.c:1 "Hãy xây một tượng đài khác — đại diện cho cả hai nền văn hóa."
  every_county_of_culture: "Mọi [county|E] trong [realm|E] có văn hóa [village.GetCountyData.GetCulture.GetName]"
  3020_MONUMENT_VALUE: "Tượng Đài Được Khôi Phục"
  3020_multicultural_monument: "Tượng Đài Đa Văn Hóa"
  3020_multicultural_monument_desc: "Một tượng đài văn hóa quan trọng gần đây được tu sửa để bao gồm yếu tố của một nền văn hóa khác, làm mờ ranh giới giữa hai nền văn hóa.\n\n#P +10%#! Tốc độ Chuyển Đổi Văn Hóa"
  3020_own_culture_monument: "Tượng Đài Áp Đặt"
  3020_own_culture_monument_desc: "Một tượng đài văn hóa quan trọng gần đây đã bị phá bỏ và thay bằng tượng đài của một nền văn hóa khác, khiến dân địa phương bất mãn và thách thức bản sắc văn hóa của họ.\n\n#P +10%#! Tốc độ Chuyển Đổi Văn Hóa"

  hold_court.3030.t:0 "Khôi Phục Công Trình Tưởng Niệm"
  hold_court.3030.desc:0 "Một [different_culture_peasant.GetWomanMan] nông dân đứng trước mặt ta, trình bày trước triều đình lời thỉnh cầu của [different_culture_peasant.GetHerHis].\n\n"Cuộc chiến gần đây đã tàn phá vùng nông thôn, và chúng tôi không rõ thủ phạm là ai, nhưng họ đã cướp phá một địa điểm văn hóa quan trọng đối với chúng tôi — người [different_culture_peasant.GetCulture.GetCollectiveNounNoTooltip] ở [province.GetName]. Xin ngài, chúng tôi khẩn cầu ngài hãy dành ra chút tài nguyên để chúng tôi có thể khôi phục lại nơi ấy!"\n\nNgười nông dân kết thúc lời thỉnh cầu của [different_culture_peasant.GetHerHis] bằng một cái cúi đầu vụng về — dấu hiệu rõ ràng của thân phận thấp kém."
  hold_court.3030.a:0 ""Ngươi sẽ nhận được ngân quỹ cần thiết cho việc khôi phục.""
  hold_court.3030.b:0 "Hãy dùng số vật liệu còn lại cho các công trình khác."
  hold_court.3030.c:0 ""Chúng ta không thể tiêu vàng cho việc này.""

  hold_court.3040.t:0 "Yêu Cầu Tiếng Cười"
  hold_court.3040.desc:0 "Trong một khoảnh khắc im lặng ngắn ngủi, ta thấy [jester_requester.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('jester_requester'))] trước khi nhận ra rằng đã đến lượt [jester_requester.GetHerHis] của ngài lên tiếng. \"[ROOT.Char.Custom2('RelationToMeAddress', jester_requester)|U]!\" [jester_requester.GetSheHe|U] nói, cho [jester_requester.GetHerHim] một chút thời gian quý giá để hoàn thiện suy nghĩ [jester_requester.GetHerHis] của ngài trước khi tiếp tục.\n\n\"Những nụ cười và tiếng cười là một chỉ báo tuyệt vời cho một triều đình sôi động! Vì vậy, tôi có một gợi ý cho ai đó sẽ là một gã hề tuyệt vời để giải trí cho chúng ta, những người có thể đến thăm!\"\n\n\"[ROOT.Char.Custom2('RelationToMeAddress', kill_joy)|U], nếu tôi được phép.\" [kill_joy.GetTitledFirstName] lên tiếng từ bên lề, \"Một gã hề sẽ phá hỏng bầu không khí tinh tế của triều đình này, và thay thế sự tinh tế của nó bằng sự hài hước thô thiển, trẻ con.\""
  hold_court.3040.a:0 "Ta sẽ tuyển dụng tên hề này!"
  hold_court.3040.b:0 "Một vai trò hoàn hảo cho [jester_requester.GetTitledFirstNameNoTooltip], bậc thầy trong việc tỏ ra như kẻ ngốc."
  hold_court.3040.c:0 "Nếu [kill_joy.GetTitledFirstNameNoTooltip] không thích cười, chúng ta nên biến [kill_joy.GetHerHim] thành trò cười!"
  hold_court.3040.d:0 "Đây KHÔNG phải là cái chợ của nông dân! Triều đình này không có chỗ cho hề!"
  hold_court.3040.e:0 "Có lẽ ta sẽ xem xét chuyện này vào lúc khác."
  generic_cp_discount_tt: "Chức vị [court_position|E] này sẽ rẻ hơn #P 50%#! khi tuyển dụng"

  hold_court.3060.t:0 "Giải Quyết Nạn Tham Nhũng"
  hold_court.3060.desc.opening:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('county_petitioner'))] của ta, [county_petitioner.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('county_petitioner'))] trước khi bước lên trình bày thỉnh cầu. "[ROOT.Char.Custom2('RelationToMeAddress', county_petitioner)|U], thần tìm đến ngài để xin trợ giúp nhằm đối phó với vấn đề "
  hold_court.3060.desc.thieves:0 "bọn trộm cắp đang cướp bóc [corrupt_county.GetNameNoTier] và dân chúng của nó!"
  hold_court.3060.desc.bandits:0 "bọn cướp đang quấy nhiễu những người dân lương thiện ở [corrupt_county.GetNameNoTier]!"
  hold_court.3060.desc.tax:0 "việc thu thuế không còn hiệu quả tại [corrupt_county.GetNameNoTier]!"
  hold_court.3060.desc.sheriffs:0 "sự thiếu vắng quan trị an tại [corrupt_county.GetNameNoTier]!"
  hold_court.3060.desc.guilds:0 "sự thiếu hợp tác từ các phường hội tại [corrupt_county.GetNameNoTier]!"
  hold_court.3060.desc.levies:0 "việc khôi phục quân dịch diễn ra quá chậm tại [corrupt_county.GetNameNoTier]!"
  hold_court.3060.desc.courts:0 "sự thiếu vắng các tòa án xét xử tại [corrupt_county.GetNameNoTier]!"
  hold_court.3060.desc.rulers:0 "sự quản trị yếu kém tại [corrupt_county.GetNameNoTier]!"
  hold_court.3060.desc.closing:1 "\n\n[county_petitioner.GetSheHe|U] dừng lại và thở dài. "Lãnh địa của thần chỉ là một trong nhiều vùng trong vương quốc đang chịu cảnh thiếu kiểm soát. Thần cầu xin bất cứ sự trợ giúp nào mà ngài có thể ban cho.""
  hold_court.3060.a:1 "Chúng ta phải đầu tư vào những vùng đất hoang dã này."
  hold_court.3060.b:0 "Quản gia của ta có thể cho ngươi vài lời khuyên."
  hold_court.3060.c:1 "Than ôi, quốc khố đang cạn."
  hold_court.3060.d:0 "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cp_steward_replacement'))] của ta, [cp_steward_replacement.GetFirstNameNoTooltip], sẽ là một Quản gia tốt hơn."
  every_low_county_control: "Mọi [county|E] trong [realm|E] có [control|E] từ 33 trở xuống"

  hold_court.3080.t:0 "Triển Lãm Bộ Sưu Tập Của [ROOT.GetCharacter.GetTitledFirstNamePossessive]"
  hold_court.3080.desc: "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('antiquarian'))] [antiquarian.GetTitledFirstName] của ta tiếp cận ta với bước chân đầy sức sống [antiquarian.GetHerHis] của ngài.\n\n\"[ROOT.Char.Custom2('RelationToMeAddress', antiquarian)|U]!\" [antiquarian.GetFirstNameNoTooltip] nói, đầy phấn khích. \"Tôi có một ý tưởng tuyệt vời có thể mang lại cho ngài tiền bạc hoặc danh tiếng! Ngài đã sưu tập được khá nhiều cổ vật, thưa [ROOT.Char.Custom('FormOfAddressForLiege')], vậy tại sao không trưng bày chúng? Ngài có thể thu phí để xem bộ sưu tập của mình, hoặc miễn phí để nhiều người xem hơn.\"\n\n[antiquarian.GetSheHe|U] hắng giọng [antiquarian.GetHerHis] của ngài trước khi tiếp tục, \"Mọi người có xu hướng muốn những thứ họ thấy, vì vậy nhược điểm có thể là nhiều người sẽ cố gắng đòi hỏi cổ vật của ngài.\""
  hold_court.3080.a:0 "Ta muốn họ phải trả tiền chỉ để thoáng thấy vinh quang của ta!"
  hold_court.3080.a.tt:0 "Các âm mưu đánh cắp Cổ vật thù địch sẽ xảy ra thường xuyên hơn."
  hold_court.3080.b:0 "Có những người phải tận mắt chứng kiến mới tin, kể cả những kẻ kém may mắn."
  hold_court.3080.c:0 "Không đáng để mời gọi những rủi ro đó."

  hold_court.3090.t:0 "Tôn Vinh Một Nền Văn Hóa Khác"
  hold_court.3090.desc: "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('different_culture_vassal'))] [different_culture_vassal.GetTitledFirstName] của ta tiếp cận ta, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('different_culture_vassal'))], như [different_culture_vassal.GetSheHe] thường làm.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], tôi có một ý tưởng tuyệt vời! Làm thế nào để chúng ta tổ chức một hội chợ, hoặc có lẽ là một lễ hội cho dân thường để cho họ tiếp xúc với một trong những nền văn hóa khác nhau trong [ROOT.Char.Custom('RealmType')] xinh đẹp của chúng ta.\" [different_culture_vassal.GetFirstNameNoTooltip] giải thích thêm ý tưởng [different_culture_vassal.GetHerHis] của ngài, cho đến khi [different_culture_vassal.GetSheHe] nhận ra rằng mình sắp giải thích quá mức.\n\n\"Nó sẽ tốn tiền, nhưng tôi chắc chắn rằng nó sẽ giúp thúc đẩy mối quan hệ tích cực hơn giữa người dân của chúng ta!\""
  hold_court.3090.a:0 "Chúng ta sẽ tổ chức một lễ hội lớn, tôn vinh cả hai nền văn hóa!"
  hold_court.3090.b:0 "Chúng ta có thể tổ chức một hội chợ nhỏ của người [different_culture_vassal.GetCulture.GetNameNoTooltip] tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
  hold_court.3090.c:0 "Hãy tổ chức một cuộc triển lãm tại vùng đất của người [different_culture_vassal.GetCulture.GetCollectiveNounNoTooltip] để cho họ thấy sự vĩ đại của [ROOT.GetCharacter.GetCulture.GetNameNoTooltip]!"
  hold_court.3090.d:0 "Ta không thể tiêu tài nguyên cho việc này."

  hold_court.3091.t:0 "Sự Hòa Trộn Bản Sắc Văn Hóa"
  hold_court.3091.desc:0 "Bầu không khí dày đặc sự mong chờ khi [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('same_culture_vassal'))] của ta, [same_culture_vassal.GetTitledFirstName], tiến đến gần.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần mang đến tin nghiêm trọng, nhưng cũng có giải pháp cho vấn đề này. Ngày càng rõ ràng rằng người [different_culture_vassal.GetCulture.GetCollectiveNoun] và người [same_culture_vassal.GetCulture.GetCollectiveNoun] đang trở nên ngày càng, có lẽ thậm chí #EMP quá#! giống nhau. Điều tối quan trọng là chúng ta phải cho họ thấy rằng chính chúng ta, người [same_culture_vassal.GetCulture.GetCollectiveNounNoTooltip], mới là những người dẫn đầu về đổi mới!""
  hold_court.3091.a:0 "Hãy tổ chức một lễ hội để tôn vinh nền văn hóa [same_culture_vassal.GetCulture.GetNameNoTooltip] phong phú của chúng ta!"
  hold_court.3091.b:0 "Sắp xếp một cuộc triển lãm để phô bày những thành tựu vĩ đại nhất của chúng ta."
  hold_court.3091.c:0 "Chúng ta không cần phải thể hiện sự vượt trội trước các nền văn hóa khác."


