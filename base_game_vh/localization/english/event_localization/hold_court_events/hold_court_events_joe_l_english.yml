 # # Evangelical Backlash
  hold_court.8120.t:0 "Phản Ứng Tôn Giáo"
  hold_court.8120.desc:0 "Trước mặt ta là một [peasant.GetFaith.GetAdherentName] nghèo khổ, hiện thân của sự khiêm nhường và cầu khẩn.\n\n"Vinh hiển thay [ROOT.Char.GetTitleAsNameNoTooltip], tôi đến để khẩn cầu ngài hãy ngăn những giáo sĩ đang quấy nhiễu dân chúng của [conversion_target.GetNameNoTierPossessive] và ép họ cải sang [ROOT.Char.GetFaith.GetName]."\n\n"
  hold_court.8120.desc.same_religion:1 ""Chúng tôi đều noi theo lời dạy của [peasant.GetFaith.CreatorName] và tìm đến [peasant.GetFaith.CreatorHerHim|U] để xin chỉ dẫn và lòng từ bi! Thưa [ROOT.Char.GetLadyLord], xin hãy cho chúng tôi giữ lại nghi lễ địa phương và sống mà không phải sợ hãi bạo lực hay sự trừng phạt.""
  hold_court.8120.desc.same_culture:0 "Dù niềm tin khác nhau, cuối cùng chúng ta vẫn là anh chị em [peasant.GetCulture.GetName]. Dù chúng tôi tôn thờ [peasant.GetFaith.HighGodName] hay [ROOT.Char.GetFaith.HighGodName], lẽ nào chúng ta không thể cùng sống trong hòa bình?"
  hold_court.8120.desc.other:0 ""Chúng tôi là người [peasant.GetCulture.GetName], truyền thống của chúng tôi khác với dân tộc vĩ đại [ROOT.Char.GetCulture.GetName]. Xin hãy để chúng tôi giữ phong tục tổ tiên và thờ phụng [peasant.GetFaith.CreatorName] trong yên bình. Xin ngài rộng lòng, [ROOT.Char.Custom('FormOfAddressForLiege')].""
  hold_court.8120.a:0 "Các giáo sĩ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] sẽ để yên cho người [peasant.GetFaith.GetAdherentNamePluralNoTooltip]."
  hold_court.8120.a.tt_conversion:0 "Các lãnh địa theo [peasant.GetFaith.GetAdjective] không thể bị cải đạo trong 15 năm"
  hold_court_8120_conversion_tt:0 "Đức tin này được ngươi dung thứ"
  hold_court.8120.b:0 "Chúng ta có nhiều điều cần học từ người [peasant.GetFaith.GetAdherentNamePluralNoTooltip]."
  hold_court.8120.b.tt_eastern:0 "[THIS.Char.GetFaith.GetName] có [core_tenet|E] $tenet_eastern_syncretism_name$"
  hold_court.8120.b.tt_pagan:0 "[THIS.Char.GetFaith.GetName] có [core_tenet|E] $tenet_unreformed_syncretism_name$"
  hold_court.8120.b.tt_christianity:0 "[THIS.Char.GetFaith.GetName] có [core_tenet|E] $tenet_christian_syncretism_name$"
  hold_court.8120.b.tt_islam:0 "[THIS.Char.GetFaith.GetName] có [core_tenet|E] $tenet_islamic_syncretism_name$"
  hold_court.8120.b.tt_judaism:0 "[THIS.Char.GetFaith.GetName] có [core_tenet|E] $tenet_jewish_syncretism_name$"
  hold_court.8120.c:0 "[ROOT.Char.GetFaith.CreatorName] đòi hỏi cống nạp từ kẻ ngoại đạo."
  hold_court.8120.c.tt_tenet:0 "[THIS.Char.GetFaith.GetName] không có [core_tenet|E] $tenet_tax_nonbelievers_name$"
  hold_court.8120.d:0 "[ROOT.Char.GetFaith.DevilName] đang chờ ngươi, [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('peasant'))]."
  hold_court.8120.e:0 "Không."
 # Modifiers
  hold_court_8120_stopped_modifier:0 "Ngừng Đồng Hóa"
  hold_court_8120_stopped_modifier_desc:0 "Theo yêu cầu của dân chúng, việc cải đạo và đồng hóa đã bị chấm dứt tại đây."
  hold_court_8120_tax_modifier:0 "Thuế Tôn Giáo"
  hold_court_8120_tax_modifier_desc:0 "Một khoản thuế đặc biệt được áp lên những kẻ ngoại đạo sống tại đây."
  hold_court_8120_terror_modifier:0 "Nhiệt Tâm Tôn Giáo"
  hold_court_8120_terror_modifier_desc:0 "Niềm tin mãnh liệt của nhân vật này hầu như không chừa chỗ cho nghi ngờ."
  hold_court_8120_tolerance_modifier:0 "Khoan Dung Tôn Giáo"
  hold_court_8120_tolerance_modifier_desc:0 "Sự khoan dung với các đức tin khác giúp nhân vật này mở ra nhiều con đường."
  hold_court_8120_refused_modifier:0 "Tiếp Tục Đồng Hóa"
  hold_court_8120_refused_modifier_desc:0 "Dân địa phương bất mãn vì yêu cầu khoan dung của họ bị từ chối."
 # # Cultural Pride
  hold_court.8130.t:0 "Niềm Tự Hào Văn Hóa"
  hold_court.8130.desc:0 "Cúi đầu trước ta là một nông dân thuộc văn hóa [peasant.GetCulture.GetName], hai tay [peasant.GetHerHis] xoắn vào nhau đầy lo lắng. \n\n"Hùng vĩ thay [ROOT.Char.GetTitleAsNameNoTooltip], tại quê hương tươi đẹp của tôi ở [conversion_target.GetNameNoTier], chúng tôi đang bị khuyến khích từ bỏ phong tục của mình để theo lối sống [ROOT.Char.GetCulture.GetName]." \n\n"
  hold_court.8130.desc.same_language:1 ""Hai dân tộc chúng ta đã cùng chung tiếng mẹ đẻ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] cao quý — xin hãy để chúng tôi giữ tập tục địa phương và trung thành với tổ tiên.""
  hold_court.8130.desc.same_heritage:1 ""Chúng ta vốn đã chia sẻ nhiều điều trong truyền thống [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip], nhưng những tập tục địa phương rất quý giá với chúng tôi. Xin hãy để chúng tôi trung thành với tổ tiên.""
  hold_court.8130.desc.same_ethos:1 ""Dân tộc chúng ta vốn đã gần gũi; chúng tôi cũng là một dân tộc [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l]. Xin hãy để chúng tôi giữ truyền thống và sống cạnh nhau trong hòa bình.""
  hold_court.8130.desc.other:1 ""Phong tục [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip] xa lạ với chúng tôi, và chúng tôi mong tiếp tục truyền thống của tổ tiên trong yên bình. Xin hãy để chúng tôi yên, thưa [ROOT.Char.GetLadyLord].""
  hold_court.8130.a:0 "Niềm tự hào như vậy thật đáng kính."
  hold_court.8130.a.tt_conversion:1 "Các lãnh địa [peasant.GetCulture.GetName] không thể bị đồng hóa trong 15 năm"
  hold_court_8130_conversion_tt:0 "Nền văn hóa này được ngươi dung thứ"
  hold_court.8130.b:0 "Hai dân tộc chúng ta có thể cùng tồn tại."
  hold_court.8130.c:0 "[conversion_target.GetNameNoTierNoTooltip] phải xứng đáng với đặc ân này."
  hold_court.8130.c.tt_service:0 "Một [knight|E] [peasant.GetCulture.GetName] gia nhập [court|E] của ngươi."
  hold_court.8130.c.tt_service_title:0 "[conversion_target.GetAdjectiveNoTooltip] [peasant.Custom('MountedWarriorTerm')|U]"
  hold_court.8130.d:0 "Ngươi sẽ là tấm gương cho mọi dân tộc lạc hậu."
  hold_court.8130.e:0 "Người [peasant.GetCulture.GetNameNoTooltip] rồi sẽ thích nghi."
 # Modifiers
  hold_court_8130_terror_modifier:0 "Thượng Đẳng Văn Hóa"
