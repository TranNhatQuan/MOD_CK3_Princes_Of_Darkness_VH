 # # Puppy Patronage
  hold_court.8140.t:0 "Bảo Trợ Cún Con"
  hold_court.8140.desc:1 "Thợ săn trưởng của ta, [huntmaster.GetTitledFirstName], tiến đến cẩn trọng, bế trên tay một gói len nhỏ. \n\nMỉm cười, [huntmaster.GetSheHe] vén tấm vải ra, để lộ đôi mắt nheo nheo phía trên chiếc lưỡi thè ra — một chú cún con! [huntmaster.GetSheHe|U] gần như không giữ nổi cục lông đang quẫy đạp trong vòng tay [huntmaster.GetHerHis]. \n\n"Món quà từ lứa [ROOT.Char.Custom('get_region_dog_type')] tuyệt hảo nhất mà thần từng thấy!" [huntmaster.GetSheHe] nói giữa những cái liếm mặt, "Ngài nên tận dụng cơ hội này để mở rộng chuồng chó của mình, thưa [ROOT.Char.GetLadyLord]!""
  hold_court.8140.a:0 "Chuồng chó của chúng ta sẽ không có đối thủ!"
  hold_court.8140.a.tt:0 "Tất cả thành viên có thể thực hiện [decision|E] Nhận Nuôi Cún"
  hold_court.8140.b:0 "Ai là cún ngoan nào? Chính là ngươi!"
  hold_court.8140.c:0 "Mèo mới là bạn đồng hành thượng hạng."
  hold_court.8140.d:0 "Ngươi đang làm chậm những người thỉnh cầu nghiêm túc, [huntmaster.GetFirstNameNoTooltip]."
 # Puppy Patronage ping
  hold_court.8141.desc:0 "[ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))] của ta, [pup_house_ruler.GetTitledFirstNameRegnal], đã mở rộng khu cũi chó của [pup_house_ruler.GetHerHis] dưới sự chỉ đạo của người huấn luyện săn bắn [pup_house_ruler.GetHerHis], [huntmaster.GetTitledFirstNameRegnal]. \n\n[pup_house_ruler.GetSheHe|U] đã mời tất cả người thân của [pup_house_ruler.GetHerHis] đến để cùng chia sẻ thành quả của nỗ lực này!"
  hold_court.8141.a:0 "Cún con sao?"
 # Puppy Patronage decision event
  hold_court.8142.t:0 "$hold_court.8140.t$: Bạn Đồng Hành Mới"
  hold_court.8142.desc:0 "Người hầu mang đến cho ta một chú cún [ROOT.Char.Custom('get_region_dog_type')] mới sinh, vừa rời khỏi chuồng chó danh tiếng của nhà [ROOT.Char.GetHouse.GetNameNoTooltip] do [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))] của ta, [pup_house_ruler.GetTitledFirstNameRegnal], lập nên. \n\nTừ trong chăn ló ra một chiếc mũi nhỏ, tò mò ngửi mùi hương của ngôi nhà mới!"
  hold_court.8142.desc_alternative: "Người hầu mang đến cho ta một chú cún [ROOT.Char.Custom('get_region_dog_type')] mới sinh, vừa rời khỏi chuồng chó của chính ta. \n\nTừ trong chăn ló ra một chiếc mũi nhỏ, tò mò ngửi mùi hương của ngôi nhà mới!"
  hold_court.8142.a:0 "Ngươi sẽ phục vụ ta thật tốt, nhóc con!"
  hold_court.8142.b:0 "Ta đã đổi ý."
 # Modifiers
  hold_court_8140_house_modifier:0 "Nhà Yêu Chó"
  hold_court_8140_house_modifier_desc:0 "Tình cảm của gia tộc này dành cho loài chó đã trở thành điều ai cũng biết."
 # Decision
  adopt_puppy_decision_name:0 "Nhận Nuôi Cún"
  adopt_puppy_decision_desc:0 "Gia tộc ta nổi danh vì tài năng và niềm đam mê trong việc gây giống chó đồng hành. Một chú cún mới sinh đang chờ ta nếu ta sẵn sàng đón nhận thử thách!"
  adopt_puppy_decision_already_pet_tt:0 "Chưa có thú cưng"
  adopt_puppy_decision_confirm:0 "Nhận nuôi cún từ chuồng"
  adopt_puppy_decision_tooltip:0 "$adopt_puppy_decision_confirm$"
 # # Contractual Compromise
  hold_court.8150.t:0 "Thỏa Hiệp Khế Ước"
  hold_court.8150.desc.intro:0 "[target_faction.GetLeader.GetTitledFirstName] mạnh dạn bước tới, và không cần đưa ra bất kỳ bối cảnh nào, tiếp tục nói bằng giọng thầm thì: \n\n"
  hold_court.8150.desc.alone:0 ""Ta sẵn lòng bỏ qua mọi bất mãn... nếu ngài điều chỉnh lại nghĩa vụ khế ước của ta với vương quyền...""
  hold_court.8150.desc.few:0 ""Ta có thể thuyết phục những kẻ bất mãn lùi bước nếu ngài giảm nhẹ gánh nặng khế ước của chúng ta...""
  hold_court.8150.desc.group:0 ""Ta có tiếng nói với những kẻ bất mãn khác, và chắc chắn có thể khiến họ lùi bước nếu đổi lại có vài sửa đổi trong khế ước...""
  hold_court.8150.desc.body:0 "\n\nDù đang bị đồn rằng"
  hold_court.8150.desc.independence:0 "đang tập hợp chư hầu của ta để ly khai khỏi [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
  hold_court.8150.desc.liberty:0 "đang kích động những mong muốn phản nghịch về quyền tự trị lớn hơn trong [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
  hold_court.8150.desc.claimant_self:0 "đang tìm kiếm sự ủng hộ cho yêu sách giả dối của [target_faction.GetLeader.GetHerHis] đối với [target_faction.GetSpecialTitle.GetNameNoTier],"
  hold_court.8150.desc.claimant:0 "ủng hộ yêu sách giả dối của [target_faction.GetSpecialCharacter.GetTitledFirstNamePossessive] đối với [target_faction.GetSpecialTitle.GetNameNoTier],"
  hold_court.8150.desc.outro:0 "chắc hẳn đây là điều mà [target_faction.GetLeader.GetFirstNameNoTooltip] sẽ không bao giờ dám công khai thừa nhận..."
  hold_court.8150.a:0 "Ta chấp thuận, dù điều đó khiến ta đau lòng."
  hold_court.8150.a.tt_shared:0 "Thuế $hold_court.8150.a.tt_contract_reduction$ và sẽ $hold_court.8150.a.tt_faction_cooldown$"
  hold_court.8150.a.tt_single_all:0 "Thuế của [target_faction.GetLeader.GetTitledFirstNamePossessive] $hold_court.8150.a.tt_contract_reduction$ và [target_faction.GetLeader.GetSheHe] sẽ $hold_court.8150.a.tt_faction_cooldown$"
  hold_court.8150.a.tt_single_cooldown:0 "Sẽ $hold_court.8150.a.tt_faction_cooldown$"
  hold_court.8150.a.tt_contract_reduction:0 "hoặc nghĩa vụ quân dịch sẽ giảm một bậc"
  hold_court.8150.a.tt_faction_cooldown:0 "không thể tham gia bất kỳ phe phái nào trong 5 năm"
  hold_court.8150.a.tt_multiple_feudal_intro:0 "Mọi thành viên phong kiến của [target_faction.GetName]"
  hold_court.8150.a.tt_multiple_intro:0 "Mọi thành viên của [target_faction.GetName]"
  hold_court.8150.b:0 "Vậy ra ngươi #EMP ĐANG#! âm mưu chống lại ta?! Bắt lấy [target_faction.GetLeader.GetHerHim]!"
  hold_court.8150.c:0 "Lại đây nào [target_faction.GetLeader.GetFirstNameNoTooltip], quên những kẻ khác đi."
  hold_court.8150.c.tt_success:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] chấp nhận hối lộ"
  hold_court.8150.c.tt_failure:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] từ chối hối lộ"
  hold_court.8150.d:0 "Hãy tỉnh táo! Gian trá sẽ chẳng mang lại lợi ích cho ngươi."
  hold_court.8150.d.tt_accept:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] bị thuyết phục"
  hold_court.8150.d.tt_reject:0 "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] nổi giận"
  hold_court.8150.e:0 "Ngươi đang chơi một trò nguy hiểm đấy, [target_faction.GetLeader.GetTitleAsNameNoTooltip]."
 # # Public Accusation
  hold_court.8160.t:0 "Cáo Buộc Công Khai"
  hold_court.8160.desc.intro_child:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('concerned'))] của ta, [concerned.GetTitledFirstName], dẫn theo [victim.GetTitledFirstNameRegnal] trẻ tuổi đến bên ta, rõ ràng đang vô cùng lo lắng. \n\n"
  hold_court.8160.desc.intro_spouse:0 "[concerned.GetTitledFirstNameRegnal] cùng [concerned.GetHerHis] [concerned.Custom2('RelationToMeShort', SCOPE.sC('victim'))] tiến lại gần một cách dè dặt, e ngại trước triều đình đang tụ họp. \n\n"
  hold_court.8160.desc.intro_alone:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] của ta, [victim.GetTitledFirstNameRegnal], vội vã đến bên ta, đôi mắt đỏ ngầu của [victim.GetHerHis] quét qua triều đình đang tụ họp. \n\n"
  hold_court.8160.desc.intro_me:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần tin chắc có kẻ trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] muốn hại thần!"
  hold_court.8160.desc.intro_other:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần tin chắc có kẻ trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] muốn hãm hại [concerned.Custom2('RelationToMeShort', SCOPE.sC('victim'))] của thần!"
  hold_court.8160.desc.exposed:0 "Hãy nhìn đây, thần có bằng chứng chính là [accused.GetTitledFirstName]"
  hold_court.8160.desc.suspicion:0 "Thần chưa có bằng chứng, nhưng nghi ngờ [accused.GetTitledFirstName]"
  hold_court.8160.desc.nemesis:2 "một [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] sẽ không từ thủ đoạn nào, kể cả giết người, để kết liễu mạng sống của [victim.Custom('GetVictimOrMy')]!"
  hold_court.8160.desc.rival:2 "– một [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] muốn kết thúc mối thù riêng bằng cách sát hại [victim.Custom('GetVictimOrMy')]!""
  hold_court.8160.desc.my_claimant:2 "– [accused.GetSheHe] muốn thúc đẩy yêu sách của [accused.GetHerHis] đối với [relevant_title.GetName] bằng cái giá là mạng sống của [victim.Custom('GetVictimOrMy')]!""
  hold_court.8160.desc.their_claimant:2 "– [accused.GetSheHe] căm ghét những kẻ cũng tuyên bố yêu sách với [accused.GetHerHis] [relevant_title.GetName], bao gồm cả [victim.Custom('GetVictimOrMy')]!""
  hold_court.8160.desc.joint_claimant:2 "– [accused.GetSheHe] không muốn bất kỳ đối thủ nào trong yêu sách của [accused.GetHerHis] đối với [relevant_title.GetName], kể cả [victim.Custom('GetVictimOrMy')]!""
  hold_court.8160.desc.their_dislike:2 "– [accused.GetSheHe] luôn tự đặt mình vào vị trí kẻ thù của [victim.Custom('GetVictimOrMy')]!"
  hold_court.8160.desc.my_dislike:2 "– [accused.GetSheHe] căm ghét việc [victim.Custom('GetVictimOrMy')] khinh thường [accused.GetHerHim] và muốn trả thù!""
  hold_court.8160.desc.intrigue:2 "– với danh tiếng về sự đê hèn của [accused.GetHerHis] – đang nhắm vào cổ họng của [victim.Custom('GetVictimOrMy')]!"
  hold_court.8160.desc.fallback:1 "– chắc chắn không ai khác muốn hại [victim.GetTitledFirstNameOrMe]!""
  hold_court.8160.desc.outro:0 "\n\n"Xin ngài! Hãy tống giam [accused.GetFirstNameNoTooltip], và chấm dứt cơn điên loạn này!""
  hold_court.8160.a:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName]! [accused.GetSheHe|U] phải bị ngăn lại!"
  hold_court.8160.b.torturer:0 "Ngươi không thể giấu sự thật khỏi #EMP TA#!!"
  hold_court.8160.b.executioner:0 "[executioner.GetFirstNameNoTooltip] sẽ moi ra sự thật."
  hold_court.8160.b.tt_confession:0 "[accused.GetTitledFirstNameNoTooltip] thú nhận âm mưu"
  hold_court.8160.b.tt_silence:0 "[accused.GetTitledFirstNameNoTooltip] không thú nhận"
  hold_court.8160.c:0 "Ta sẽ thẩm vấn [accused.GetTitledFirstNameNoTooltip]."
  hold_court.8160.c.tt_success:0 "[accused.GetTitledFirstNameNoTooltip] bị phát hiện nói dối"
  hold_court.8160.c.tt_failure:0 "[accused.GetTitledFirstNameNoTooltip] phủ nhận mọi liên quan"
  hold_court.8160.d.involved:0 "Bình tĩnh đi, không có gì phải lo."
  hold_court.8160.d.proof:0 ""Bằng chứng" này có vẻ khá yếu."
  hold_court.8160.d.fallback:0 "Ác ý tự nó không phải là tội, [victim.GetFirstNameNoTooltip]."
 # Custom loc, root is the character it is used on
  get_victim:0 "[ROOT.Char.GetTitledFirstNamePossessive]"
 # # Personal Matter
  hold_court.8161.t:0 "Chuyện Riêng Tư"
  hold_court.8161.desc.intro:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] của ta, [victim.GetTitledFirstName], tiến lên, được [victim.GetHerHis] [victim.GetPrimarySpouse.GetWifeHusband], [victim.GetPrimarySpouse.GetFirstName], hộ tống với vẻ đầy bực tức. \n\n[victim.GetPrimarySpouse.GetSheHe|U] bật lên, "[ROOT.Char.Custom('FormOfAddressForLiege')|U], [accused.GetTitledFirstName] đang cố quyến rũ [victim.GetWifeHusband] của tôi – một sự xúc phạm đối với [victim.GetPrimarySpouse.GetFaith.HighGodName]!"
  hold_court.8161.desc.nemesis:0 "Tên [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] đó sẽ không từ thủ đoạn nào để hủy hoại đời tôi!""
  hold_court.8161.desc.rival:0 "Kẻ đáng ghét [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] đang lợi dụng mối thâm thù của [accused.GetHerHis] và muốn làm nhục ta!"
  hold_court.8161.desc.quarry:0 "[accused.GetSheHe|U] rõ ràng đang khao khát người phối ngẫu xinh đẹp của ta và không thể kiềm chế được [accused.GetHerselfHimself]!"
  hold_court.8161.desc.their_dislike:0 "[accused.GetSheHe|U] chưa bao giờ ưa tôi! Chắc chắn là [accused.GetHerHim]!""
  hold_court.8161.desc.my_dislike:0 "Tôi chưa bao giờ ưa [accused.GetHerHim], và giờ thì rõ là có lý do!""
  hold_court.8161.desc.intrigue:0 "Ai cũng biết [accused.GetSheHe] là kẻ âm mưu khốn khổ, giăng bẫy và đùa cợt với sinh mạng người khác!""
  hold_court.8161.desc.fallback:0 "Tôi không thể nghĩ ra ai khác!""
  hold_court.8161.desc.body:0 "\n\n[victim.GetFirstName] rõ ràng cảm thấy xấu hổ khi chuyện này bị phơi bày công khai như vậy, và gần như không thể đối diện với ánh mắt của ta."
  hold_court.8161.a.homosexual:0 "Những sự xúc phạm như vậy sẽ không được dung thứ!"
  hold_court.8161.a.adultery:0 "Ta sẽ không dung thứ cho kẻ ngoại tình trong triều đình!"
  hold_court.8161.c:0 "Chúng ta sẽ xem liệu có chút sự thật nào trong chuyện này."
  hold_court.8161.d.involved:0 "Những nghi ngờ này hẳn là vô căn cứ."
  hold_court.8161.d.permitted:0 "Thì đã sao, [victim.GetPrimarySpouse.GetFaith.GetAdherentNameNoTooltip]?"
  hold_court.8161.d.fallback:0 "Không có bằng chứng sao?"
 # # Noble Privileges
  hold_court.8180.t:0 "Đặc Quyền Quý Tộc"
  hold_court.8180.desc.intro:0 "[contract_lord.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_lord'))] của ta, bước lên phía trước, rõ ràng nóng lòng muốn nghe phản hồi của ta đối với thỉnh cầu của [contract_lord.GetHerHis]. \n\n\"[contract_lord.Custom2('RelationToMeShort', ROOT.Char)] của ngài,\"
  hold_court.8180.desc.religious:0 "ngài không bao giờ cần nghi ngờ lòng trung thành của gia tộc [contract_lord.GetHouse.GetBaseName], nhưng mối quan hệ của chúng ta sẽ vững mạnh hơn nếu không có mối đe dọa bị bức hại vì tín ngưỡng của chúng tôi.\""
  hold_court.8180.desc.fortification:0 "nếu gia tộc [contract_lord.GetHouse.GetBaseName] phải tự bảo vệ mình và [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], thì [contract_lord.GetPrimaryTitle.GetNameNoTier] cần được cho phép và hỗ trợ để củng cố các công sự của mình.\""
  hold_court.8180.desc.coinage:0 "thương mại của [contract_lord.GetPrimaryTitle.GetAdjective] đang bị bóp nghẹt vì thiếu tiền tệ, hãy cho phép gia tộc [contract_lord.GetHouse.GetBaseName] lập xưởng đúc tiền riêng với sự chuẩn thuận của hoàng gia, vì lợi ích của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
  hold_court.8180.desc.war_declaration:0 "gia tộc [contract_lord.GetHouse.GetBaseName] là một gia tộc vinh hiển và cao quý, hãy để [contract_lord.GetPrimaryTitle.GetNameNoTier] một lần nữa bảo vệ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] và chính mình trên chiến trường.\""
  hold_court.8180.desc.council:0 "gia tộc [contract_lord.GetHouse.GetBaseName] là một trong những gia tộc vĩ đại nhất của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]; lời khuyên của [contract_lord.GetPrimaryTitle.GetAdjective] nên luôn được [ROOT.Char.GetTitleAsNameNoTooltip] lắng nghe!\""
  hold_court.8180.desc.title_revocation:0 "thật nhục nhã cho một gia tộc lớn như [contract_lord.GetHouse.GetBaseName] khi luôn phải sống dưới mối đe dọa bị tước tước vị như những nam tước hay tá điền tầm thường.\""
  hold_court.8180.desc.scutage:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] đang rất thiếu binh lính, hãy để gia tộc [contract_lord.GetHouse.GetBaseName] trả [ROOT.Char.GetTitleAsNameNoTooltip] thay cho người cho [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  hold_court.8180.desc.march:0 "gia tộc [contract_lord.GetHouse.GetBaseName] có thể phục vụ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] tốt hơn nếu [contract_lord.GetPrimaryTitle.GetNameNoTier] được ban địa vị và đặc quyền của một phiên trấn biên cương.\""
  hold_court.8180.desc.palatinate:0 "gia tộc vĩ đại [contract_lord.GetHouse.GetBaseName] cùng với [contract_lord.GetPrimaryTitle.GetName] của họ là những tôi trung trung thành của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]; chúng tôi xứng đáng được công nhận nhiều hơn cho phẩm giá của mình."
  hold_court.8180.desc.family_entrepeneurship:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] có thể khiến [ROOT.Char.GetDynasty.GetName] trở nên giàu có nếu được phát triển, chúng tôi chỉ cần giữ lại nhân lực cho các dự án địa phương và phòng thủ.\""
  hold_court.8180.desc.centralized_power:0 "[contract_lord.GetPrimaryTitle.GetNameNoTier] đang oằn mình dưới gánh thuế của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] nhưng lại có nhiều binh lính dư dả; hãy để chúng tôi cân bằng sự bất hợp lý này vì lợi ích của cả hai bên."
  hold_court.8180.desc.religious_heretic:0 "\n\n\"Chỉ mình [contract_lord.GetFaith.HighGodName] mới có quyền phán xét ai trong số các tín đồ của [contract_lord.GetHerHis] là chính trực.\""
  hold_court.8180.desc.religious_heathen:0 "\n\n\"[contract_lord.GetFaith.HighGodName] sẽ bảo vệ ta và gia tộc ta, và có lẽ rồi cũng sẽ dõi theo ngài.\""
  hold_court.8180.desc.martial_defensive:0 "\n\n\"Hãy để chúng tôi đảm bảo phòng thủ cho vương quốc thay ngài, để cả hai cùng hưởng lợi từ hòa bình.\""
  hold_court.8180.desc.martial_offensive:0 "\n\n\"Chỉ bằng lưỡi gươm mà đặc quyền của chúng ta được bảo vệ – và nó phải luôn sắc bén.\""
  hold_court.8180.desc.stewardship:0 "\n\n\"Đừng kìm hãm tiềm năng phồn vinh của thần dân ngài, và tất cả chúng ta sẽ cùng giàu có!\""
  hold_court.8180.desc.status:0 "\n\n\"Gạt bỏ những người trung thành ưu tú và xứng đáng nhất của ngài chỉ gieo rắc chia rẽ và nghi kỵ.\""
  hold_court.8180.desc.family:0 "\n\n\"Hãy để những quý tộc xuất thân cao quý nhất của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] hưởng những lợi ích lớn nhất."
  hold_court.8180.desc.fallback:0 "\n\n\"Hãy đảm bảo sự ổn định của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] không bị đe dọa bởi những bất đồng tầm thường."
  hold_court.8180.a.religious:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ không còn phải sợ hãi các [ROOT.Char.GetFaith.BishopNeuterPlural] của ta."
  hold_court.8180.a.fortification:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ trở thành pháo đài của vương quốc."
  hold_court.8180.a.coinage:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] có thể tự đúc tiền."
  hold_court.8180.a.war_declaration:0 "Kẻ thù của [contract_lord.GetPrimaryTitle.GetNamePossessiveNoTooltip] sẽ lại run sợ!"
  hold_court.8180.a.council:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ luôn được ta lắng nghe."
  hold_court.8180.a.title_revocation:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ bất khả xâm phạm."
  hold_court.8180.a.scutage:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] có thể giữ lại chiến binh của mình."
  hold_court.8180.a.march:0 "Vương quốc sẽ trông cậy vào [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] để phòng thủ."
  hold_court.8180.a.palatinate:0 "Địa vị của [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ không còn bị nghi ngờ."
  hold_court.8180.a.family_entrepeneurship:0 "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ ngày càng lớn mạnh."
  hold_court.8180.a.centralized_power:0 "Binh sĩ của [contract_lord.GetPrimaryTitle.GetAdjectiveNoTooltip] sẽ phục vụ vương quốc."
  hold_court.8180.b:0 "Hãy chứng minh cho ta thấy ngươi hiểu #EMP giá trị#! của tự do."
  hold_court.8180.b.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] đồng ý trả tiền"
  hold_court.8180.b.tt.failure:0 "[contract_lord.GetTitledFirstNameNoTooltip] khó chịu trước yêu cầu"
  hold_court.8180.c:0 "Ta nghe nói ngươi có một bộ sưu tập khá đẹp..."
  hold_court.8180.c.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] giao nộp [vassal_artifact.GetName]"
  hold_court.8180.d:0 "Những đặc quyền như vậy cũng đòi hỏi hy sinh tương xứng."
  hold_court.8180.d.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] giao nộp [vassal_title.GetNameNoTierNoTooltip]"
  hold_court.8180.e:0 "Chỉ khi biên giới của [contract_lord.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] không bao giờ bị thay đổi."
  hold_court.8180.e.tt.success:0 "[contract_lord.GetTitledFirstNameNoTooltip] đồng ý phân chia"
  hold_court.8180.f:0 "Đổi lại những cam kết lớn hơn, dĩ nhiên."
  hold_court.8180.g:0 "Là một [contract_lord.GetTitleAsNameNoTooltip] chẳng lẽ vẫn chưa đủ sao?"
 # # The Enemy Within
  hold_court.8190.t:0 "Kẻ Thù Trong Nội Bộ"
  hold_court.8190.desc.intro:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))] của ta [aggressor_vassal.GetTitledFirstName] gần như không thể kìm nén cơn thịnh nộ của [aggressor_vassal.GetHerHis].\n\n"Phải làm gì đó với tên ngoại tộc [other_vassal.GetCulture.GetName] đó mới được!" \n\n[aggressor_vassal.GetSheHe|U] khoa tay múa chân dữ dội, "Ta đã quá chán ngấy [other_vassal.GetTitledFirstName] và những phong tục nực cười của [other_vassal.GetHerHis] rồi –"
  hold_court.8190.desc.ethos:0 "[other_vassal.Custom('get_hold_court_8190_ethos')]\""
  hold_court.8190.desc.heritage:1 "mọi thứ ở bọn chúng đều xa lạ với những đức tính của [aggressor_vassal.GetCulture.GetHeritage.GetNameNoTooltip]!\""
  hold_court.8190.desc.language:1 "và cái thứ gọi là tiếng [other_vassal.GetCulture.GetLanguage.GetNameNoTooltip] kia chỉ là thứ âm thanh hỗn xược!\""
  hold_court.8190.desc.fallback:0 "Ý ta là ngài đã thấy bọn man rợ ấy #EMP ăn uống#! thế nào chưa?!\""
  hold_court.8190.desc.body:0 "\n\n\"Đã đến lúc các thần dân ngoại lai của ngài phải học theo #EMP phong tục#! của những kẻ ưu việt hơn!\""
  hold_court.8190.a:0 "Giới quý tộc của ta phải là người [aggressor_vassal.GetCulture.GetNameNoTooltip]!"
  hold_court.8190.a.tt_accept:0 "[other_vassal.GetTitledFirstName] đồng ý"
  hold_court.8190.a.tt_refuse:0 "[other_vassal.GetTitledFirstName] từ chối"
  hold_court.8190.a.tt.vassals:0 "Mọi chư hầu không phải người [THIS.Char.GetCulture.GetName]"
  hold_court.8190.a.tt.promote:1 "Mọi quận [other_vassal.GetCulture.GetName] trong [THIS.Char.GetPrimaryTitle.GetBaseNameNoTier] ([SCOPE.ScriptValue('court_8190_county_value')|0X]) sẽ khó đồng hóa hơn"
  hold_court.8190.b:0 "Ngươi có thể học được nhiều điều từ truyền thống của người khác."
  hold_court.8190.b.tt.vassals:0 "Mọi chư hầu khác thuộc văn hóa [other_vassal.GetCulture.GetName]"
  hold_court.8190.b.tt_success:0 "Căng thẳng văn hóa được xoa dịu"
  hold_court.8190.b.tt_failure:0 "Lời nói của ngài bị phớt lờ"
  hold_court.8190.c:0 "Dù là [aggressor_vassal.GetCulture.GetNameNoTooltip] hay không, [other_vassal.GetFirstNameNoTooltip] vẫn là chư hầu trung thành."
  hold_court.8190.d:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] là vùng đất của nhiều dân tộc."
 #Modifiers
  hold_court_8190_vassal_modifier:0 "Văn Hóa Không Được Mong Muốn"
 # Custom
  hold_court_8190_bellicose:0 "lúc nào cũng gây hấn đánh nhau, lũ man rợ!"
  hold_court_8190_stoic:0 "'cao quý' chịu đựng mọi thứ! Ôi #EMP làm ơn đi#!"
  hold_court_8190_bureaucratic:0 "không tôn trọng những phương pháp đã được tổ tiên chứng thực."
  hold_court_8190_spiritual:0 "#EMP quá ám ảnh#! với việc làm hài lòng [ROOT.Char.GetFaith.HighGodName] và các [ROOT.Char.GetFaith.AltPriestTermPlural]."
  hold_court_8190_courtly:0 "lúc nào cũng nịnh bợ kẻ thống trị như mèo!"
  hold_court_8190_egalitarian:0 "đối xử với người ngoại bang như ngang hàng! Hừ!"
  hold_court_8190_communal:0 "chẳng có chút chủ động hay tự lực nào!"
 # # Servant of God
  hold_court.8200.t:0 "Tôi Tớ của [ROOT.Char.GetFaith.HighGodName]"
  hold_court.8200.desc.intro:1 "Có vẻ như [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))] của ta, [aggressor_vassal.GetTitledFirstName], đã ôm cơn giận trong lòng khi chờ được yết kiến. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\""
  hold_court.8200.desc.vassal:0 "thần không thể chịu đựng sự khoan dung của ngài đối với những [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))] như [infidel_vassal.GetTitledFirstName] trong lãnh thổ – thậm chí còn giữa hàng ngũ quý tộc!\""
  hold_court.8200.desc.pope:0 "những kẻ [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))] đang tụ tập quanh tên [ROOT.Char.GetFaith.BishopNeuter] giả dối [infidel_vassal.GetTitledFirstName], tất cả đều dưới sự bảo hộ của ngài!\""
  hold_court.8200.desc.body:1 "\n\n\"[ROOT.Char.GetFaith.HighGodName] đã nói rõ yêu cầu của [ROOT.Char.GetFaith.HighGodHerHis] với chúng ta – [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] phải là vùng đất của những tín đồ! Hãy tống cổ lũ chó '[infidel_vassal.GetFaith.GetAdjective]' này ra ngoài!\""
  hold_court.8200.a:0 "Ngươi nói đúng, [infidel_vassal.GetTitledFirstNameNoTooltip] phải cải đạo!"
  hold_court.8200.a.tt_accept:0 "[infidel_vassal.GetTitledFirstName] đồng ý cải đạo"
  hold_court.8200.a.tt_refuse:0 "[infidel_vassal.GetTitledFirstName] từ chối cải đạo"
  hold_court.8200.a.tt.vassals:0 "Mọi chư hầu không theo [THIS.Char.GetFaith.GetAdjective]"
  hold_court.8200.a.tt.convert:1 "Mọi quận [infidel_vassal.GetFaith.GetAdjective] trong [THIS.Char.GetPrimaryTitle.GetBaseNameNoTier] ([SCOPE.ScriptValue('court_8200_county_value')|0X]) sẽ khó cải đạo hơn"
  hold_court.8200.c:0 "Nhân danh [infidel_vassal.GetFaith.HighGodName], giờ ta đã thấy chân lý!"
  hold_court.8200.c.tt.vassals:0 "Mọi chư hầu theo [infidel_vassal.GetFaith.GetAdjective]"
  hold_court.8200.d:0 "Ta đánh giá một [infidel_vassal.GetWomanMan] qua phẩm chất, không phải tín ngưỡng."
  hold_court.8200.e:0 "Mọi đức tin đều được chào đón trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta."
  cultural_benevolence_tt:0 "Khoan Dung Văn Hóa"
  cultural_intolerance_tt:0 "Bất Dung Văn Hóa"
 # Modifiers
  hold_court_8200_vassal_modifier:0 "Tín Ngưỡng Không Được Mong Muốn"
 # # Rightful Lord
  hold_court.8210.t:0 "Lãnh Địa Chính Đáng"
  hold_court.8210.desc.intro:0 "[aggressor_vassal.GetTitledFirstName] với vẻ mặt vô cùng bất mãn vội vã tiến đến ngai vàng của ta... \n\n\"[aggressor_vassal.Custom2('RelationToMeShort', ROOT.Char)|U], "
  hold_court.8210.desc.de_jure:0 "quyền hợp pháp của ta đối với [vassal_claim.GetName] đã được chứng thực rõ ràng; những vùng đất đó từ lâu đã được xem là một phần không thể tách rời của [vassal_claim.GetDeJureLiege.GetName] của ta.\""
  hold_court.8210.desc.strong:0 "quyền chính đáng của ta đối với [vassal_claim.GetName] là điều không thể nghi ngờ; được cả sứ giả của ngài lẫn các [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.AltPriestTermPlural] công nhận.\""
  hold_court.8210.desc.weak:0 "ta có quyền đối với [vassal_claim.GetName], bất kể kẻ khác nói gì!"
  hold_court.8210.desc.other:0 "\n\n\"Ngài có ủng hộ yêu sách của ta, và buộc [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender_vassal'))] của ngài là [defender_vassal.GetTitledFirstName] từ bỏ thứ không thuộc về [defender_vassal.GetHerHim] hay không?\""
  hold_court.8210.desc.self:0 "\n\n\"Ngài có chịu từ bỏ thứ không thuộc về mình để ủng hộ yêu sách của ta không?\""
  hold_court.8210.a:0 "Sự bất công này sẽ chấm dứt ngay."
  hold_court.8210.b:0 "Những việc như thế vốn được giải quyết bằng sức mạnh."
  hold_court.8210.b.tt_aggressor:0 "[aggressor_vassal.GetTitledFirstNameNoTooltip] thắng trận đấu tay đôi"
  hold_court.8210.b.tt_defender:1 "Tước vị vẫn thuộc về [defender_vassal.GetNameOrMeNoTooltip]"
  hold_court.8210.c.none:0 "Ngươi chẳng có yêu sách gì cả, [aggressor_vassal.Custom2('InsultNoun', ROOT.Char)]."
  hold_court.8210.c.other:0 "Yêu sách của [defender_vassal.GetFirstNamePossessiveNoTooltip] mới là chính đáng."
  hold_court.8210.c.self:0 "Yêu sách của ta mới là chính đáng."
  hold_court.8210.d:0 "Ta không can thiệp vào chuyện này."
  hold_court.8210.e:0 "[defender_vassal.GetTitleAsNameNoTooltip] sẽ tuyên thệ trung thành với ngươi."
  hold_court.8210.f.other:0 "Hai ngươi hãy giải quyết bằng gươm."
  hold_court.8210.f.self:0 "Ngươi phải giành lấy bằng lưỡi kiếm."
  hold_court.8210.duel_tt:0 "[defender_vassal.GetNameOrMeNoTooltip|U] sẽ đấu tay đôi với [aggressor_vassal.GetTitledFirstName] để tranh [vassal_claim.GetName]"
 # # The King's Peace
  hold_court.8260.t:0 "Hòa Bình của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  hold_court.8260.desc.intro:1 "[vassal_faction_target.GetFullName] tiến đến với vẻ mặt khó chịu, nóng lòng trình bày lời thỉnh cầu của [vassal_faction_target.GetHerHis]. \n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_faction_leader'))] của thần là [vassal_faction_leader.GetTitledFirstName], đang tìm cách thách thức vị thế chính đáng của thần,"
  hold_court.8220.desc.claimant:0 "và đưa [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_claimant'))] của thần, [vassal_claimant.GetTitledFirstName], lên làm kẻ tiếm vị tại [vassal_faction.GetSpecialTitle.GetNameNoTier]!\""
  hold_court.8220.desc.claimant_self:1 "và đưa chính [vassal_faction.GetSpecialCharacter.GetHerselfHimself] lên làm [vassal_faction.GetSpecialCharacter.GetLadyLord] của [vassal_faction.GetSpecialTitle.GetNameNoTier]!\""
  hold_court.8220.desc.liberty:0 "làm suy yếu quyền lực của thần và phủ nhận những phán quyết hợp pháp của thần với tư cách [vassal_faction.GetLeader.GetHerHis] [vassal_faction_target.GetTitleAsNameNoTooltip]!\""
  hold_court.8260.desc.body:0 "\n\n\"[vassal_faction.GetLeader.GetSheHe|U] đang tập hợp những kẻ bất mãn ngay lúc này; #EMP ngài#! phải nhắc cho chúng nhớ quyền lực thật sự nằm ở đâu trong vương quốc này!\""
  hold_court.8260.a.peace:0 "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] sẽ chấm dứt trò này."
  hold_court.8260.a.war:0 "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] phải đầu hàng ngay!"
  hold_court_8260_faction_member_tt:0 "Mọi thành viên của [vassal_faction.GetName] ([SCOPE.ScriptValue('court_8260_faction_value')|0]) nhắm vào [vassal_faction_target.GetTitledFirstName]"
  hold_court.8260.b:0 "Những kẻ kích động sẽ không được dung thứ."
  hold_court.8260.c:0 "Sẽ có hòa bình trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] của ta!"
  hold_court.8260.d:0 "Nhưng lời họ nói cũng có lý, phải không?"
  hold_court.8260.e:0 "Ồ, #EMP ta phải#! làm vậy sao?"
 # # Oath of Fealty
  hold_court.8270.t:0 "Lời Thề Trung Thành"
  hold_court.8270.desc:1 "Các sứ giả của ta thông báo sự xuất hiện của một tiểu vương láng giềng; [neighbor.GetTitledFirstName] của [neighbor.GetPrimaryTitle.GetNameNoTier]. \n\n[neighbor.GetSheHe|U] bước vào đại sảnh với vẻ trang nghiêm rồi cúi sâu, \"Thưa bệ hạ, ta đến đây để khiêm nhường dâng lãnh địa của mình dưới quyền ngài — nếu ngài chấp nhận các điều khoản.\" \n\n\"Ta sẽ phục vụ ngài như một chư hầu trung thành của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] để đổi lấy sự bảo hộ của ngài; mong rằng hai gia tộc vĩ đại của chúng ta đều sẽ thịnh vượng nhờ thỏa thuận này!\""
  hold_court.8270.a:0 "Ta chấp nhận, [neighbor.GetTitledFirstNameNoTooltip]."
  hold_court.8270.b:0 "Ta thấy các điều khoản này hơi thiên lệch..."
  hold_court.8270.b.accept:0 "[neighbor.GetTitledFirstNameNoTooltip] chấp nhận thay đổi của ngươi"
  hold_court.8270.b.refuse:0 "[neighbor.GetTitledFirstNameNoTooltip] từ chối"
  hold_court.8270.d:0 "Ta không nghĩ vậy."
 # # Nomadic Neighbors
  hold_court.8280.t:0 "Những Người Du Mục Láng Giềng"
  hold_court.8280.desc.foreign:0 "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xin yết kiến, có vẻ bị phân tâm bởi những rắc rối của [feudal_vassal.GetHerHis].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [feudal_vassal.GetSheHe] nói, \"những [nomad_culture.GetCollectiveNoun] du mục ở biên giới của thần đang bất ổn, và mỗi ngày lại có thêm người từ [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTier] tràn vào [feudal_county.GetName] của thần.\" \n\n\"Thần e rằng — nếu không bị đuổi đi — họ sẽ sớm định cư khắp cả [feudal_county.GetTierAsNameNoTooltip]!\""
  hold_court.8280.desc.local:0 "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] yêu cầu một buổi yết kiến với ta cùng [nomad.Custom2('MyCharacterIntroduction', ROOT.Char)] — chuyện này hẳn sẽ thú vị...\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]!\" [feudal_vassal.GetFirstNameNoTooltip] than vãn, \"những kỵ sĩ du mục từ đất của [nomad.GetFirstNamePossessiveNoTooltip] đang tràn vào [feudal_county.GetName] của thần — họ phải quay về!\" \n\n[nomad.GetFirstNameNoTooltip] nhún vai, \"Dân ta là những kẻ lang bạt, họ chỉ muốn tìm đồng cỏ tốt cho đàn gia súc của mình...\""
  hold_court.8280.a.foreign:0 "Họ phải bị gửi trở lại [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]."
  hold_court.8280.a.local:0 "[nomad.GetTitledFirstNameNoTooltip], hãy kiểm soát đám kỵ sĩ của ngươi!"
  hold_court.8280.b:0 "Ta luôn cần những kỵ sĩ thiện chiến."
  hold_court.8280.c:0 "Ngươi rõ ràng đang phóng đại, [feudal_vassal.GetFirstNameNoTooltip]."
 # 
  hold_court.8290.t: "Hiến Chương [city_province.GetTitle.GetAdjectiveNoTooltip]"
  hold_court.8290.desc: "Trước mặt ta đứng một [city_mayor.GetWomanMan] lạ mặt: hình như [city_mayor.GetSheHe] là [city_mayor.GetFirstName], một [city_mayor.GetTitleAsNameNoTooltip] trong vùng đất [ROOT.Char.Custom2('RelationToMeShort', city_vassal)], [city_vassal.GetTitledFirstNamePossessive], của ta.\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], tôi đến đây mà không có sự cho phép của [ROOT.Char.GetLadyLord], để xin ngài ban cho thành phố của tôi, [city_province.GetTitle.GetNameNoTier], những vùng đất xung quanh để tự cai quản tùy ý."\n\n"Chúng tôi có thể tự quản lý công việc của mình và mang lại sự thịnh vượng to lớn cho [ROOT.Char.GetPrimaryTitle.Custom('GetTierBase')], nếu chúng tôi thoát khỏi những khoản thuế và trách nhiệm ngột ngạt do [city_vassal.GetTitleAsNameNoTooltip] của [city_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip] áp đặt.""
  hold_court.8290.a: "Ta tin thành phố của ngươi sẽ nhớ đến ân huệ của ta."
  hold_court.8290.b: "Một chút hương vị của lợi lộc tương lai có lẽ sẽ khiến ta đổi ý."
  hold_court.8290.c: "Điều ngươi yêu cầu là vượt quá giới hạn."
  every_glory_hound_and_owner_actor: "[city_vassal.GetTitledFirstName] và mọi $glory_hound_vassals$ ([actor.MakeScope.ScriptValue('number_of_glory_hound_vassals')|V0])"
  hold_court_8290_grant_tooltip: "[city_county.GetName] bị tước khỏi [city_vassal.GetTitledFirstName] và trở thành một [republic|E] dưới quyền [city_mayor.GetTitledFirstName]"
  hold_court.8300.t: "Từ Bỏ Quyền Lợi"
  hold_court.8300.desc: "[ROOT.Char.Custom2('RelationToMeShort', city_vassal)] của ta, [city_vassal.GetTitledFirstName], là một gương mặt chào đón trong triều đình, mặc dù [city_vassal.GetSheHe] có vẻ không chắc chắn làm thế nào để đưa ra yêu cầu của [city_vassal.GetHerHis].\n\nCuối cùng [city_vassal.GetSheHe] cũng tìm được lời nói: "[ROOT.Char.Custom('FormOfAddressForLiege')|U], tôi chỉ là một [city_vassal.GetTitleAsNameNoTooltip] khiêm nhường, hài lòng với những lãnh địa nhỏ bé của mình. Tôi chỉ quan tâm đến lợi ích của người dân ở [city_vassal.GetPrimaryTitle.GetNameNoTier], đặc biệt là lợi ích cho linh hồn của [city_province.GetTitle.GetNameNoTier] — và tất nhiên là của #EMP tất cả#! [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."\n\n"Tôi xin ngài hãy cho phép tôi từ bỏ các quyền cha truyền con nối đối với đất đai của gia đình, để thay vào đó cai trị nó một cách cộng đồng, như các thị trưởng thành phố làm.""
  hold_court.8300.a: "Một ý tưởng thật đáng suy ngẫm."
  hold_court.8300.b: "Nếu #EMP ngươi#! không muốn đặc quyền ấy, kẻ khác sẽ nhận lấy."
  hold_court.8300.c: "Quyền lợi của ngươi là bất khả xâm phạm, [city_vassal.GetFirstNameNoTooltip]!"
  hold_court.8310.t: "Củng Cố Vương Quốc"
  hold_court.8310.desc: "Ta khá ngạc nhiên khi thấy [ROOT.Char.Custom2('RelationToMeShort', drifting_vassal)] của ta, [drifting_vassal.GetTitledFirstName], một [drifting_vassal.GetLadyLord] của vùng [drifting_duchy.GetAdjectiveNoTooltip]"
  hold_court.8310.faith_culture: "[drifting_vassal.GetCulture.GetCollectiveNoun] — lại còn là một tín đồ [drifting_vassal.GetFaith.GetAdherentName] nữa — "
  hold_court.8310.culture: "[drifting_vassal.GetCulture.GetCollectiveNoun],"
  hold_court.8310.faith: "[drifting_vassal.GetFaith.GetAdherentNamePlural],"
  hold_court.8310.fallback: "lãnh địa,"
  hold_court.8310.body: "đang quỳ trước mặt ta hôm nay.\n\n[drifting_vassal.GetSheHe|U] bắt đầu: \"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], tất cả chúng ta đều biết thời thế đã thay đổi. Những luật lệ và phong tục cũ của [drifting_duchy.GetDeJureLiege.GetAdjectiveNoTooltip] phải bị quét sạch nếu [drifting_duchy.GetNameNoTierNoTooltip] muốn được công nhận đúng đắn là một phần không thể tách rời của [drifting_kingdom.GetNameNoTierNoTooltip].\"\n\n\"Việc nhổ bỏ những tàn dư còn sót lại này trong dân chúng không phải việc dễ dàng, nhưng với đúng... #EMP động lực#!...\""
  hold_court.8310.a: "#EMP Động lực#!?! Thứ phản nghịch như vậy phải bị nhổ tận gốc!"
  hold_court.8310.b: "Ý của ngươi ta hiểu rõ, [drifting_vassal.GetFirstNameNoTooltip]."
  hold_court.8310.c: "Ồ? Ta sẽ xem xét các điều lệ của [drifting_duchy.GetAdjectiveNoTooltip]."
  hold_court.8310.c.success: "Những thay đổi của ngươi được hoan nghênh"
  hold_court.8310.c.failure: "Ngươi khiến mọi thứ rối rắm hơn"
  hold_court.8310.d: "Những việc như vậy cần thời gian."
  hold_court.8310.county_tooltip: "Mọi [counties|E] [drifting_duchy.GetAdjective] [de_jure|E] trong [realm|E] của ngươi"
  hold_court.8320.t: "Tranh Chấp Thừa Kế"
  hold_court.8320.self: "[ROOT.Char.Custom2('RelationToMeShort', probate_vassal)] của ta, [probate_vassal.GetName], bước lên trước mặt ta, cùng với"
  hold_court.8320.regent: "[probate_rep.GetTitledFirstName], [probate_vassal.GetTitleAsName] của [probate_vassal.GetPrimaryTitle.GetNameNoTierPossessive] [probate_vassal.Custom2('RelationToMeShort', probate_rep)], bước lên trước mặt ta, cùng với"
  hold_court.8320.monk: "một tu sĩ [probate_priest.GetFaith.GetAdjectiveNoTooltip]."
  hold_court.8320.priest: "một [probate_priest.Custom('PriestTitle')] [probate_priest.GetFaith.GetAdjectiveNoTooltip]."
  hold_court.8320.desc: "Những ký ức mơ hồ về vụ việc này hiện lên trong tâm trí ta — một tranh chấp nào đó về di nguyện của [probate_dead.GetTitledFirstNamePossessive] quá cố...\n\n[probate_vassal.GetFirstNameNoTooltip] bùng nổ: \"[ROOT.Char.GetTitleAsNameNoTooltip], xin hãy tin rằng những lời hứa về đất đai này hoàn toàn là dối trá! [probate_vassal.Custom2('RelationToMeShort', probate_dead)] của thần có thể đã bố thí đây đó, nhưng cả #EMP vùng [probate_county.GetName|l]#! ư?! Thật quá vô lý!\"\n\n"
  hold_court.8320.monk_2: "Vị tu sĩ hắng giọng [probate_priest.GetHerHis]:"
  hold_court.8320.priest_2: "Vị linh mục hắng giọng [probate_priest.GetHerHis]:"
  hold_court.8320.body: ""Tên tôi là [probate_priest.GetFirstName], thưa ngài, từ [probate_dead.GetFaith.HouseOfWorship] của [probate_province.GetTitle.GetNameNoTier]. Chúng tôi nói lời chân thật! [probate_dead.GetFirstNameNoTooltip] là một [probate_dead.GetWomanMan] mộ đạo. [probate_dead.GetSheHe|U] đã dành nhiều thời gian với chúng tôi trước khi [probate_dead.GetSheHe] tìm thấy sự bình yên của [probate_dead.GetFaith.HighGodNameAlternate] tại [probate_dead.GetFaith.PositiveAfterLife]..."\n\n[probate_vassal.GetTitledFirstNameNoTooltip] đảo mắt [probate_vassal.GetHerHis], mặt đỏ bừng vì giận dữ."
  hold_court.8320.a: "Mảnh đất này thuộc về những tín đồ của [probate_priest.GetFaith.HighGodNamePossessive]."
  hold_court.8320.b: "Giữ tước vị của ngươi đi [probate_vassal.GetFirstNameNoTooltip], nhưng hãy bồi thường cho các [probate_priest.GetFaith.AltPriestTermPlural]."
  hold_court.8320.c: "Thật rắc rối... có vẻ như hai bên yêu sách triệt tiêu lẫn nhau..."
  hold_court.8320.d: "Không gì vượt qua quyền thừa kế của [probate_dead.Custom2('RelationToMePossessive', probate_vassal)]."
  every_close_family_hold_court_8320_tooltip: "[close_family|E] của [probate_vassal.GetHerHis|U]"
  hold_court_8320_grant_tooltip: "[probate_county.GetName] bị tước khỏi [probate_vassal.GetTitledFirstName] và trở thành một [theocracy|E] dưới quyền [probate_priest.GetTitledFirstName]"
  hold_court.8330.t: "Rạn Nứt Tại [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
  hold_court.8330.desc: "Hai chư hầu của ta, [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName], được đưa đến trước mặt ta — cả hai đều là những tiếng nói có ảnh hưởng trong triều đình đôi khi đầy căng thẳng của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip]. Tiếc thay hôm nay tiếng nói của họ không hòa hợp.\n\n[vassal_1.GetFirstNameNoTooltip] bước lên: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần đến đây trước mặt các bậc quyền quý để vạch rõ sai trái của [vassal_2.GetFirstNameNoTooltip]!\"\n\n"
  hold_court.8330.intro.courtly: "\"Các gia tộc quý tộc cổ xưa của [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] đang ngày càng mở rộng đặc quyền của mình,\" 
  hold_court.8330.intro.glory_hound: "\"Những kẻ hiếu chiến đang tìm cách kéo [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] vào chiến tranh vì lợi ích nhỏ nhen của họ,\" 
  hold_court.8330.intro.parochial: "Những lãnh chúa lười biếng chỉ muốn cuộc sống yên ổn đang làm suy yếu sức mạnh của chúng ta khi họ tích lũy của cải," 
  hold_court.8330.intro.zealot: "\"Rõ ràng các [ROOT.Char.GetFaith.AltPriestTermPlural] đã giành được quá nhiều ảnh hưởng trong [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip],\"" 
  hold_court.8330.intro.minority: "Những [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] cười nhạo lòng rộng lượng của ngài khi họ âm mưu cùng kẻ thù của ngài," 
  hold_court.8330.outro.courtly: "chúng đe dọa địa vị của các đại gia tộc trong vương quốc: [vassal_1.GetHouse.GetBaseNameNoTooltip], thậm chí cả #EMP [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!#!" 
  hold_court.8330.outro.glory_hound: "trong khi chúng ta trở nên mềm yếu và chín muồi cho âm mưu của kẻ thù luôn rình rập." 
  hold_court.8330.outro.parochial: "chúng ta phải cẩn trọng nếu muốn giữ sự cân bằng mong manh của lợi ích trong vương quốc." 
  hold_court.8330.outro.zealot: "phớt lờ giáo lý của [ROOT.Char.GetFaith.ReligiousText] và ý chí của [ROOT.Char.GetFaith.HighGodName]." 
  hold_court.8330.outro.minority: "phớt lờ những cộng đồng hợp tác hòa bình vốn là chìa khóa cho sức mạnh của chúng ta." 
  hold_court.8330.end: "Tôi chắc rằng ngài đồng ý với tôi, thưa lãnh chúa của tôi."\n\n[vassal_2.GetFirstNameNoTooltip] chỉ lắc đầu [vassal_2.GetHerHis], nhìn ta đầy mong đợi, cùng với toàn thể triều đình..."
  hold_court.8330.a.courtly: "Quyền cổ xưa của quý tộc phải được đặt lên trên hết." 
  hold_court.8330.a.glory_hound: "Dù làm gì, nó cũng phải khiến [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] mạnh hơn." 
  hold_court.8330.a.parochial: "Ta ở đây để mang lại sự lãnh đạo vững chắc và ổn định." 
  hold_court.8330.a.zealot: "Tất cả chúng ta — #EMP kể cả ta#! — chỉ là công cụ của [ROOT.Char.GetFaith.HighGodName]." 
  hold_court.8330.a.minority: "Sự đa dạng mang lại nhiều lợi ích." 
  hold_court.8330.c: "Cả hai ngươi đều là thần dân vô giá của vương quốc." 
  hold_court.8330.c.success: "Ngươi khiến cả hai hài lòng" 
  hold_court.8330.c.failure: "Những người ủng hộ họ không hài lòng" 
  hold_court.8330.d: "Sự phù phiếm như vậy chỉ xúc phạm các chư hầu khác." 
  every_other_non_minor_vassal_actor: "Mọi chư hầu khác không phải $barons_and_minor_landholders_vassal$ ([actor.MakeScope.ScriptValue('hold_court_8330_other_vassals_count')|V0])" 
  hold_court.8340.t: "Tìm Việc" 
  hold_court.8340.desc: "Một [candidate.Custom('GetYoungMiddleAgedOld')] [candidate.GetWomanMan] bước lên trước mặt ta với vẻ điềm tĩnh, rồi cúi sâu: \"Kính chào bệ hạ, thần là [candidate.GetFirstName], kẻ bề tôi trung thành của ngài. Hôm nay thần đến trước mặt ngài để xin được phục vụ trong triều đình của ngài.\"\n\n" 
  hold_court.8340.diplomacy: "\"Thần đã từng qua nhiều triều đình, tiếp đón các lãnh chúa địa phương của [birthplace.GetNameNoTierNoTooltip], quê hương của thần, cùng vô số vị khách của họ.\""
  hold_court.8340.stewardship: "\"Thần là một người quản lý giỏi, từng phục vụ nhiều lãnh chúa và triều đình tại [birthplace.GetNameNoTierNoTooltip], quê hương của thần.\""
  hold_court.8340.intrigue: "\"Thần có rất nhiều... #EMP kinh nghiệm#! đa dạng, tích lũy tại các thị trấn của [birthplace.GetNameNoTierNoTooltip], quê hương của thần.\""
  hold_court.8340.learning: ""Tôi là một [candidate.GetWomanMan] của những con chữ, từng là người chép thuê cho các lãnh chúa địa phương và [birthplace.GetCountyData.GetFaith.AltPriestTermPlural] của [birthplace.GetNameNoTierNoTooltip], quê hương tôi.""
  hold_court.8340.prowess: "\"Thần là một chiến binh dày dạn kinh nghiệm, từng phục vụ các lãnh chúa địa phương và các đội quân đồn trú tại [birthplace.GetNameNoTierNoTooltip], quê hương của thần.\""
  hold_court.8340.outro: "\"Được đem tài năng của mình phục vụ một mục tiêu lớn hơn, dưới trướng [ROOT.Char.GetTitleAsNameNoTooltip] và toàn thể [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], sẽ là vinh dự lớn lao của thần.\""
  hold_court.8340.a: "Ta #EMP vừa hay#! có công việc phù hợp."
  hold_court.8340.b: "Được thôi, ta có việc cho ngươi."
  hold_court.8340.c: "À, cuối cùng cũng có một [candidate.GetWomanMan] hữu dụng!"
  hold_court.8340.d: "Hiện tại không có chỗ trống..."
 # Modifiers
