l_english:
 # # Stifled Commerce
  hold_court.8001.t:0 "Thương Mại Bị Kìm Hãm"
  hold_court.8001.desc:0 "Một thương nhân tỉnh lẻ bước lên phía trước, rõ ràng [merchant.GetHerHis] không quen thuộc với những đại sảnh xa hoa của ta. Ta vẫy gọi, "Lại đây [merchant.GetWomanMan], chúng ta không có cả ngày." \n\n"D-dạ vâng thưa [ROOT.Char.GetLadyLord]!" [merchant.GetSheHe] lắp bắp, "Tôi là [merchant.GetFirstName], đại diện cho các thương nhân và dân tự do bất mãn của [town.GetNameNoTier], [town.GetDeJureLiege.GetNameNoTierPossessive] [town.GetTierAsNameNoTooltip] lớn nhất." \n\n"[mayor.GetFirstName], [mayor.GetTitleTierName] của chúng tôi, [mayor.Custom('get_hold_court_8001_flaw')]–chúng tôi khiêm nhường cầu xin rằng [mayor.GetSheHe] được thay thế bởi người khác...""
  hold_court.8001.a:0 "Cuộc bầu cử của [town.GetBaseNameNoTierPossessiveNoTooltip] sẽ diễn ra sớm."
  hold_court.8001.b:0 "Được thôi, #EMP NGƯƠI#! sẽ là [mayor.GetTitleTierName] mới!"
  hold_court.8001.b.tt_success:0 "[merchant.GetFirstNameNoTooltip] sắp xếp lại [town.GetBaseNameNoTierNoTooltip]"
  hold_court.8001.b.tt_failure:0 "[merchant.GetFirstNameNoTooltip] còn tệ hơn nữa"
  hold_court.8001.c:0 "Vậy [mayor.GetFirstNameNoTooltip] nói gì về chuyện này?"
  hold_court.8001.c.tt_success:0 "Tìm thấy bằng chứng về sự bất tài của [mayor.GetFirstNamePossessiveNoTooltip]"
  hold_court.8001.c.tt_failure:0 "Không chứng minh được sai phạm của [mayor.GetFirstNamePossessiveNoTooltip]"
  hold_court.8001.d:0 "Hoàng gia sẽ bồi thường cho các thương nhân của thị trấn."
  hold_court.8001.e:1 "Ngươi dám chất vấn #EMP [ROOT.Char.GetTitleTierNamePossessive] [mayor.GetTitleTierName] sao?!#!"
 # Custom
  hold_court_8001.desc_lazy:0 "trốn tránh mọi bổn phận và hiếm khi thi hành luật trừ khi bị ép buộc"
  hold_court_8001.desc_greedy:0 "áp đặt thuế quan vô lý và những khoản phạt nặng nề để làm đầy túi riêng của [mayor.GetHerHis]"
  hold_court_8001.desc_arbitrary:0 "xử sự bất công, tùy tiện bịa ra tội lỗi như thể để gây khó dễ cho chúng tôi"
  hold_court_8001.desc_deceitful:0 "buôn bán bí mật và nói dối trước mặt chúng tôi ngay cả trong những chuyện nhỏ nhặt nhất"
  hold_court_8001.desc_young:0 "quá thiếu kinh nghiệm để hiểu đầy đủ luật pháp"
  hold_court_8001.desc_incompetent:0 "không thể duy trì ngay cả những sổ sách cơ bản nhất"
  hold_court_8001.desc_infirm:0 "hầu như không thể rời khỏi giường của [mayor.GetHerHis], chứ đừng nói giải quyết việc của thị trấn"
  hold_court_8001.desc_incapable:0 "đã nhiều tuần không nói một lời, khiến công việc của [mayor.GetHerHis] chồng chất"
  hold_court_8001.desc_old:0 "đã trải qua quá nhiều mùa đông và đang mất dần sức lực mà công việc đòi hỏi"
  hold_court_8001.desc_fallback:0 "là trở ngại cho thương mại và lợi ích của thị trấn"
 # Modifiers
  hold_court_8001_deposed_modifier:0 "Can Thiệp Dân Sự"
  hold_court_8001_ignored_modifier:0 "Thương Mại Bị Kìm Hãm"
  hold_court_8001_compensated_modifier:0 "Thương Nhân Được Bồi Thường"
  hold_court_8001_merchant_boon_modifier:0 "Bàn Tay Thương Nhân"
  hold_court_8001_merchant_bust_modifier:0 "$hold_court_8001_merchant_boon_modifier$"
  hold_court_8001_imprisoned_modifier:0 "Đại Diện Bị Giam"
 # # Frontier Lord
  hold_court.8010.t:0 "Biên Cương [neighboring_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip]"
  hold_court.8010.desc:0 "[frontier_lord.GetTitledFirstName] đứng trước mặt ngài, gương mặt [frontier_lord.GetHerHis] đầy lo âu. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], mối đe dọa từ [neighboring_enemy.GetPrimaryTitle.GetNameNoTier] luôn đè nặng trong tâm trí tôi." \n\n"[neighboring_enemy.GetTitledFirstName] đang rình rập bên kia biên giới," [frontier_lord.GetSheHe] chỉ tay, "chỉ cách cổng [frontier_barony.GetNameNoTierNoTooltip] và [frontier_lord.Custom('get_hold_court_8010_stake')] vài ngày đường." \n\n"Ngài phải giúp củng cố lãnh địa của tôi – binh lính và công sự của [frontier_lord.GetPrimaryTitle.GetAdjectiveNoTooltip] là bức tường duy nhất ngăn cách [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] với diệt vong!""
  hold_court.8010.a:0 "Trách nhiệm của ngươi quả thật có thể biện minh cho đặc quyền..."
  hold_court.8010.b:0 "Ngươi nói đúng, [frontier_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] phải được củng cố."
  hold_court.8010.c:0 "#EMP Chỉ vài ngày?!#! Chúng ta phải củng cố kinh đô!"
  hold_court.8010.d:0 "Vớ vẩn, [neighboring_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] không phải mối đe dọa."
  hold_court.8010.d.tt_success:0 "[frontier_lord.GetFirstNameNoTooltip] được trấn an"
  hold_court.8010.d.tt_failure:0 "[frontier_lord.GetFirstNameNoTooltip] đưa ra lập luận thuyết phục hơn"
  hold_court.8010.e:0 "Tất cả chúng ta đều phải gánh chịu nguy cơ chiến tranh."
 # Custom
  hold_court_8010.desc_family:0 "những mái nhà của gia tộc [ROOT.Char.GetDynastyHouseNameNoTooltip]"
  hold_court_8010.desc_republic:0 "những người vô tội trong thành"
  hold_court_8010.desc_theocratic:0 "những tín đồ khiêm nhường của [ROOT.Char.GetFaith.HighGodNamePossessive]"
 # Modifiers
  hold_court_8010_fortifications_modifier:0 "Tường Thành Biên Cương"
  hold_court_8010_vassal_modifier:0 "Gánh Nặng Chung"
 # # Sacred Claims
  hold_court.8020.t:0 "Yêu Sách Thánh Thiêng"
  hold_court.8020.desc.intro:0 "[bishop.GetCouncilTitle] [bishop.GetFirstName] bước lên trang nghiêm. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.Custom('get_hold_court_8020_holiness_1')]"" 
  hold_court.8020.desc.body_pope: "\n\n\"Đức thánh [pope.GetHerHis|U] [pope.GetTitledFirstNameRegnal] đồng ý\""
  hold_court.8020.desc.body_fallback:0 "\n\n"Đã có sự đồng thuận"
  hold_court.8020.desc.body_1:0 "rằng [ROOT.Char.Custom('get_hold_court_8020_holiness_2')] nên được quản lý hoàn toàn bởi [ROOT.Char.GetFaith.AltPriestTermPlural] thay vì người thế tục.""
  hold_court.8020.desc.body_personal:0 "\n\n"Hãy giao vùng đất này cho"
  hold_court.8020.desc.body_vassal:0 "\n\n"[vassal.GetTitledFirstName] phải nhường lại tài sản của [owner.GetHerHis] cho"
  hold_court.8020.desc.body_2:0 "sự chăm sóc của [ROOT.Char.GetFaith.BishopNeuter] [candidate.GetFirstNamePossessive], vì lợi ích của đức tin và vinh quang của [ROOT.Char.GetFaith.HighGodName]!"" 
  hold_court.8020.a:0 "[ROOT.Char.Custom('get_hold_court_8020_holiness_3')]"
  hold_court.8020.b:0 "Trong [ROOT.Char.GetFaith.ReligiousText] có yêu cầu điều này sao?"
  hold_court.8020.b.tt_success:0 "Ngươi chứng minh rằng không có yêu cầu tôn giáo nào"
  hold_court.8020.b.tt_failure:0 "Lập luận của ngươi không thuyết phục"
  hold_court.8020.c:0 "Thật thú vị, nhưng dường như chỉ có ngươi được lợi?"
  hold_court.8020.d:0 "Ta không thấy lý do phải thay đổi."
  hold_court.8020.e:0 "[pope.GetTitledFirstNameNoTooltip] chắc chắn đứng trên những chuyện can thiệp như thế này."
 # Custom
  holiness_cathedral_1:0 "Những người hành hương [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] đổ về [ROOT.Var('holy_site_var').Title.GetNameNoTierPossessive] [ROOT.Char.Custom('GetFaithGrandTemple')] để đến gần hơn với [ROOT.Char.GetFaith.HighGodNameAlternate]."
  holiness_holy_site_1:0 "[ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] là trung tâm hành hương và thờ phụng quan trọng của [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
  holiness_fallback_1:0 "các tín đồ tại [ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] kêu gọi sự dẫn dắt tôn giáo và sự cứu rỗi khỏi [ROOT.Var('holy_site_var').Title.GetCountyData.GetFaith.DevilName]."
  holiness_cathedral_2:0 "một [ROOT.Char.GetFaith.HouseOfWorship] quan trọng như vậy"
  holiness_holy_site_2:0 "một thánh địa thiêng liêng như vậy"
  holiness_fallback_2:0 "nhiều hơn nữa của [ROOT.Var('holy_site_var').Title.GetDeFactoTopLiege.GetNameNoTierNoTooltip]"
  holiness_cathedral_3:0 "[ROOT.Char.Custom('GetFaithGrandTemple')] thuộc về [ROOT.Char.GetFaith.HighGodName]."
  holiness_holy_site_3:0 "[ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] nên nằm trong tay các [ROOT.Char.GetFaith.PriestNeuterPlural]."
  holiness_fallback_3:0 "Ta sẽ không từ chối các [ROOT.Char.GetFaith.PriestNeuterPlural] của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
  hold_court.8031.t:0 "[sc_victor.GetTitledFirstNameNoTooltip] thắng trong trận đấu tay đôi"
  hold_court.8221.imprison_alone:0 "[assassin.GetTitledFirstName] bị giam cầm"
 # # Special Treatment
  hold_court.8040.t:0 "Đặc Quyền Tôn Giáo"
  hold_court.8040.desc: "Kẻ không biết hối cải [infidel_vassal.GetTitledFirstName] ban ơn cho ngài với sự hiện diện [infidel_vassal.GetHerHis] của ngài. \n\nNgập ngừng, [infidel_vassal.GetSheHe] bắt đầu: \"Thưa [ROOT.Char.GetTitleTierName], tôi là một thần dân trung thành và sẵn lòng – hãy để tôi thực hành đức tin của mình trong hòa bình.\" \n\n"
  hold_court.8040.desc.intro_same_religion:0 ""Chúng tôi, những [infidel_vassal.GetFaith.GetAdherentNamePlural], thờ phụng [infidel_vassal.GetFaith.CreatorName] cũng như các [ROOT.Char.GetFaith.GetAdherentNamePlural] vậy. Hãy để những [ROOT.Char.GetFaith.GetReligion.GetAdjective] [ROOT.Char.Custom('SisterBrother')] của ngài thờ phụng theo ý mình, và cùng nhau chống lại lũ [ROOT.Char.Custom('GetUnbelieverNamePlural')] tà ác theo các ác quỷ giả dối và để [infidel_vassal.GetFaith.DevilName] làm băng hoại trái tim họ.""
  hold_court.8040.desc.intro_fallback:0 ""Tại sao một người theo [ROOT.Char.GetFaith.GetReligion.GetAdjective] và một người theo [infidel_vassal.GetFaith.GetReligion.GetAdjective] không thể sống hòa thuận? Chúng ta có thể khác nhau trong giáo lý của [ROOT.Char.GetFaith.HighGodName] và [infidel_vassal.GetFaith.HighGodName], nhưng vẫn thống nhất trong lòng mộ đạo. Hãy để chúng tôi theo [infidel_vassal.GetFaith.ReligiousText] của mình và ngài theo [ROOT.Char.GetFaith.ReligiousText] của ngài, song hành cùng nhau.""
  hold_court.8040.a:0 "Sự phán xét thuộc về riêng [ROOT.Char.GetFaith.HighGodName]."
  hold_court.8040.b:0 "Lại đây, để ta chỉ cho ngươi lời dạy của [ROOT.Char.GetFaith.KnowledgeGodName]."
  hold_court.8040.c.religion:0 "Đã đến lúc từ bỏ [infidel_vassal.GetFaith.CreatorName] và mọi lời dối trá của [infidel_vassal.GetFaith.GetReligion.GetAdjectiveNoTooltip]!"
  hold_court.8040.c.faith:0 "Ngươi cần đọc lại [ROOT.Char.GetFaith.ReligiousText]!"
  hold_court.8040.c.tt_accept:0 "[infidel_vassal.GetTitledFirstNameNoTooltip] cải đạo"
  hold_court.8040.c.tt_refuse:0 "[infidel_vassal.GetTitledFirstNameNoTooltip] từ chối cải đạo"
  hold_court.8040.d:0 "Niềm tin của ngươi được dung thứ, không phải được công nhận."
  demand_conversion_tt:0 "[recipient.GetTitledFirstName] và gia đình thân cận sẽ cải sang tôn giáo của ngươi"
 # # Royal Service
  hold_court.8050.t:0 "Phục Vụ Hoàng Gia"
  hold_court.8050.desc: "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến lại gần ngai vàng cùng với một [knight.Custom('GetYoungMiddleAgedOld')] [knight.GetWomanMan] đi kèm. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')]!\" [vassal.GetSheHe] thốt lên, \"[vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] của tôi, [knight.GetFullName], tìm kiếm vinh dự được phục vụ trong đội ngũ [ROOT.Char.Custom('MountedWarriorTermPlural')] của ngài — hãy cho [knight.GetHerHim] cơ hội chứng minh phẩm chất [knight.GetHerHis] của hắn!\" \n\n"
  hold_court.8050.desc_talented:0 ""[knight.GetSheHe|U] đã là một trong những đấu sĩ nổi danh nhất của [vassal.GetTitleAsNamePossessive], và sẽ mang lại nhiều vinh quang cho ngài trên chiến trường!" Quả thật, ngài đã từng nghe về kỹ năng của [knight.GetHerHis]..."
  hold_court.8050.desc_suitable: "\"Người này [knight.GetWomanMan] biết cách sử dụng [knight.Custom('SignatureWeaponArticle')] [knight.Custom('signature_weapon')], và sẽ không làm ngài thất vọng khi cần thiết!\""
  hold_court.8050.desc_passing: "[knight.GetFirstNameNoTooltip] mỉm cười yếu ớt. \"Mặc dù tôi chỉ là một kiếm [knight.GetWomanMan] tầm trung, tôi hy vọng sẽ học hỏi được nhiều điều khi phục vụ ngài.\""
  hold_court.8050.desc_unsuitable:0 "Kéo ta sang một bên, [vassal.GetFirstNameNoTooltip] lẩm bẩm, "[knight.GetSheHe|U] không nổi danh với lưỡi kiếm, nhưng nhiệt huyết của [knight.GetHerHis] có lẽ sẽ bù đắp được...""
  hold_court.8050.a:0 "Được thôi, ngươi có thể theo hầu ta, [knight.GetFirstNameNoTooltip]."
  hold_court.8050.a.tt_knight:0 "[knight.GetFirstName] sẽ chuyển đến triều đình của ngươi và trở thành một [knight|E]. \nViệc loại bỏ [knight.GetHerHim] có thể khiến [vassal.GetTitledFirstName] khó chịu."
  hold_court.8050.a.tt_toast:0 "[ROOT.Char.Custom('MountedWarriorTerm')|U] [knight.GetNameNoTooltip]"
  hold_court.8050.a.tt_hook:0 "Bởi vì [vassal.GetTitledFirstName] có móc nối với ngươi:"
  hold_court.8050.b:0 "Để nhận - #EMP [knight.GetHerHim]#! - ta cần thứ gì đó đổi lại."
  hold_court.8050.c:0 "[grandmaster.GetTitledFirstNameNoTooltip] luôn cần [knight.GetWomenMen]!"
  hold_court.8050.d:0 "Ta đã tìm được Vệ Sĩ của mình!"
  hold_court.8050.d.tt_bodyguard:0 "[knight.GetFirstName] sẽ chuyển đến triều đình của ngươi với vai trò Vệ Sĩ. \nViệc loại bỏ [knight.GetHerHim] có thể khiến [vassal.GetTitledFirstName] khó chịu"
  hold_court.8050.e.talented:0 "Ngươi nên giữ nhân tài như vậy bên mình, [vassal.GetFirstNameNoTooltip]."
  hold_court.8050.e.suitable:0 "Có kỹ năng, đúng. Nhưng không cần."
  hold_court.8050.e.passing: "Các nghĩa trang đầy rẫy những kiếm [knight.GetWomenMen] tầm trung."
  hold_court.8050.e.unsuitable:0 "Một con la bọc giáp còn hữu ích hơn..."
 # # A Knight Spurned
  hold_court.8051.t:0 "$hold_court.8050.t$: Một [ROOT.Char.Custom('MountedWarriorTerm')|U] Bị Khước Từ"
  hold_court.8051.desc: "Có vẻ như tin tức cuối cùng đã đến tai [vassal.GetTitledFirstName] rằng [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] [vassal.GetHerHis] của ngài không còn được hưởng vị trí trong số các [ROOT.Char.Custom('MountedWarriorTermPlural')] của ta nữa. \n\nCố gắng kiềm chế cơn giận [vassal.GetHerHis] của ngài, [vassal.GetSheHe] yêu cầu ta giữ lời hứa và khôi phục vị trí [knight.GetFirstNamePossessive] của hắn!\""
  hold_court.8051.a:0 "Bình tĩnh, ta sẽ phục chức cho [knight.GetHerHim], [vassal.GetFirstNameNoTooltip]!"
  hold_court.8051.a.tt_knight:1 "[knight.GetFirstName] sẽ trở lại làm [knight|E]"
  hold_court.8051.b:0 "[knight.GetSheHe|U] cũng chẳng phải tổn thất lớn."
  hold_court.8051.b.tt_return:0 "[knight.GetFirstNameNoTooltip] sẽ trở về triều đình của [vassal.GetTitledFirstNamePossessiveNoTooltip]"
 # # The Last Straw
  hold_court.8052.t:0 "$hold_court.8050.t$: Giọt Nước Tràn Ly"
  hold_court.8052.desc.intro:0 "[vassal.GetTitledFirstName] lập tức yêu cầu diện kiến khi nghe tin [knight.GetFirstName] lại bị loại khỏi đội [ROOT.Char.Custom('MountedWarriorAdjective')] của ta một lần nữa. \n\n"
  hold_court.8052.desc.wrath:0 "Giận dữ tột độ, [vassal.GetSheHe] bùng nổ, "Người [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] của ta đã bị đối xử tệ bạc, và niềm tin của ta vào lời hứa của ngươi đã bị phá hủy!" rồi bỏ đi."
  hold_court.8052.desc.fallback: "[vassal.GetSheHe|U] thể hiện rõ sự thất vọng [vassal.GetHerHis] của ngài, rõ ràng là bị kích động bởi sự xấu hổ mà hành động của ta gây ra cho [vassal.GetHerHim]..."
  hold_court.8052.a:0 "Ôi–thật là kịch tính!"
  hold_court.8052.b:0 "Lính gác, bắt giữ tên [vassal.Custom2('InsultNoun', ROOT.Char)] kia!"
 # # Perils of Glory
  hold_court.8053.t:0 "$hold_court.8050.t$: Hiểm Họa Của Danh Vọng"
  hold_court.8053.desc.intro:0 "Tin tức truyền đến từ vùng [battle_location.Custom('TerrainTypeProvince')] của [battle_location.GetName], nơi [knight.GetFirstNameNicknamed] được báo rằng đã bị hạ gục"
  hold_court.8053.killer:0 "bởi [knight.GetKiller.GetName]"
  hold_court.8053.battle:0 "giữa vòng hỗn chiến hỗn loạn"
  hold_court.8053.desc_talented:0 "trong ánh hào quang rực rỡ, xung quanh là thi thể của những [knight.GetWomenMen] kém cỏi hơn."
  hold_court.8053.desc_suitable:0 "sau một trận chiến sát nút, hạ gục nhiều kẻ thù và chịu nhiều vết thương."
  hold_court.8053.desc_passing: "sau một cuộc đấu tay đôi bền bỉ, anh hùng bảo vệ các đồng đội [knight.GetHerHis] của hắn."
  hold_court.8053.desc_unsuitable: "trong khi vung kiếm [knight.GetHerHis] của hắn như một con cá trên cạn."
  hold_court.8053.desc_coward:0 "khi đang tìm cách tháo chạy khỏi chiến trường."
  hold_court.8053.desc.body:0 "\n\nHẳn giờ đây ngươi đã được giải thoát khỏi nghĩa vụ với [vassal.GetTitledFirstName]..."
  hold_court.8053.a:0 "Đó là hiểm nguy của chiến trận..."
 # # A Temple for County
  hold_court.8060.t:0 "Một [ROOT.Char.GetFaith.HouseOfWorship|U] cho [target_county.GetNameNoTierNoTooltip]"
  hold_court.8060.desc:0 "Vị [bishop.GetCouncilTitle] của ta, [bishop.GetFirstName], đang cúi mình trước mặt ta, nóng lòng muốn bắt đầu đề xuất của [bishop.GetHerHis].\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]","
  hold_court.8060.desc.owned:0 "[target_county.GetTierAsNameNoTooltip] của ngài tại [target_county.GetNameNoTier]"
  hold_court.8060.desc.vassal:0 "[target_county.GetTierAsNameNoTooltip] của [vassal.GetTitledFirstNamePossessive] tại [target_county.GetNameNoTier]"
  hold_court.8060.desc.subvassal:0 "[target_county.GetTierAsNameNoTooltip] của [target_county.GetNameNoTier], do chư hầu của [vassal.GetTitledFirstNamePossessive] là [subvassal.GetTitledFirstName] cai trị,"
  hold_court.8060.desc.existing:0 "có thể nâng đỡ thêm một [ROOT.Char.GetFaith.HouseOfWorship] lớn nữa, minh chứng cho quyền năng của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] và lòng sùng đạo của [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip].""
  hold_court.8060.desc.first:0 "hiện thiếu một [ROOT.Char.GetFaith.HouseOfWorship|U] xứng đáng để dân chúng cầu nguyện và tôn vinh [ROOT.Char.GetFaith.HighGodNameAlternate].""
  hold_court.8060.desc.end:0 "\n\n"Ngài phải giúp tài trợ việc xây dựng một nơi thờ phụng mới tại [target_province.GetName], vì lợi ích của đức tin [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!"" 
  hold_court.8060.a:0 "Vì vinh quang của [ROOT.Char.GetFaith.HighGodName]!"
  hold_court.8060.a.tt:0 "Khi [temple|E] hoàn thành:"
  hold_court.8060.b:0 "[vassal.GetTitledFirstNameNoTooltip] có thể đóng góp."
  hold_court.8060.c:0 "Thần dân của ta phải đóng góp."
  hold_court.8060.d:0 "Việc này hợp với [royal_architect.GetTitledFirstNameNoTooltip]."
  hold_court.8060.d.tt_success:0 "[royal_architect.GetTitledFirstName] làm rất tốt"
  hold_court.8060.d.tt_normal:0 "[royal_architect.GetTitledFirstName] làm tròn bổn phận"
  hold_court.8060.d.tt_failure:0 "[royal_architect.GetTitledFirstName] làm việc tệ hại"
  hold_court.8060.e.own:0 "Ta có kế hoạch khác cho vùng đất đó."
  hold_court.8060.e.vassal:0 "Chư hầu nên tự lo lãnh địa của mình."
