 # # The Consecration of Province
  hold_court.8061.t:0 "Lễ Thánh Hiến Của [target_province.GetNameNoTooltip] "
  hold_court.8061.desc.bishop:0 "[bishop.GetCouncilTitleFirstName] hớn hở bước vào đại sảnh, "[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta mang tin rằng [target_province.GetTitle.GetNameNoTierPossessive] [ROOT.Char.GetFaith.HouseOfWorship|U] mới đã hoàn thành!" \n\n"
  hold_court.8061.desc.fallback:0 "[ROOT.Char.GetFaith.HouseOfWorship] mà ta cho xây dựng cho dân chúng tại [target_province.GetTitle.GetNameNoTier] nay đã hoàn thành sau nhiều công sức."\n\n"
  hold_court.8061.desc.owned:0 ""Những tín đồ tại [target_county.GetNameNoTier]"
  hold_court.8061.desc.vassal:0 ""Thần dân của [vassal.GetTitledFirstNamePossessive] tại [target_county.GetNameNoTier]"
  hold_court.8061.desc.existing:0 "đều hoan hỉ trước lòng sùng đạo trong hành động của ngài, và vinh danh [ROOT.Char.GetFaith.HighGodName]!"" 
  hold_court.8061.desc.first:0 "có thể tôn vinh [ROOT.Char.GetFaith.HighGodName] tại một nơi xứng đáng với sự thần thánh của [ROOT.Char.GetFaith.HighGodHerHis]!"
  hold_court.8061.a:0 "Nguyện [ROOT.Char.GetFaith.HighGodNameAlternate] ban phúc cho tất cả chúng ta!"
 # # The Growth of County
  hold_court.8070.t:0 "Sự Phát Triển Của [target_county.GetNameNoTierNoTooltip]"
  hold_court.8070.desc.intro:0 "[steward.GetCouncilTitleFirstName] tỏ ra đầy nhiệt huyết với một đề xuất lớn.\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại! Có rất nhiều tiềm năng tại"
  hold_court.8070.desc.body:0 "để trở thành trung tâm thương mại và thủ công của vùng." \n\n"Nếu có ngân quỹ xây dựng, nền móng cho"
  hold_court.8070.desc.existing:0 "một"
  hold_court.8070.desc.first:0 "thành phố đầu tiên của vùng"
  hold_court.8070.desc.end:0 "thuộc [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] có thể được đặt tại [target_province.GetName] bằng cách hợp nhất các ngôi làng."" 
  hold_court.8070.a:0 "Thương mại cần được khuyến khích."
  hold_court.8070.a.tt:0 "Khi [city|E] hoàn thành:"
  hold_court.8070.b:0 "Ta chỉ có thể giúp [vassal.GetTitledFirstNameNoTooltip]."
  hold_court.8070.c:0 "Hãy để các lãnh chúa địa phương gánh trách nhiệm."
  hold_court.8070.d:0 "Cuối cùng cũng có việc cho [royal_architect.GetTitledFirstNameNoTooltip]."
  hold_court.8070.e:0 "Còn nhiều việc quan trọng hơn."
 # # Bustling County
  hold_court.8071.t:0 "$hold_court.8070.t$: [target_province.GetNameNoTooltip] Nhộn Nhịp"
  hold_court.8071.desc.steward:0 "[steward.GetCouncilTitleFirstName] tự hào mang đến tin tức rằng những công trình biến [target_province.GetName] thành một trung tâm thương mại đang, theo lời của [steward.GetHerHis], "Dần hoàn thiện!" \n\n"
  hold_court.8071.desc.fallback:0 "Sự phát triển của [target_province.GetName] đang sinh hoa kết quả; chẳng bao lâu thị trấn sẽ đứng vững. \n\n"
  hold_court.8071.desc.owned:0 "Dân thường tại [target_county.GetNameNoTier]"
  hold_court.8071.desc.vassal:0 "Thần dân của [vassal.GetTitledFirstNamePossessive] tại [target_county.GetNameNoTier]"
  hold_court.8071.desc.existing:0 "đều hoan nghênh những khoản đầu tư này và sự thịnh vượng chúng mang lại cho vùng."
  hold_court.8071.desc.first:0 "nay có thể dễ dàng hành nghề và buôn bán tại trung tâm vùng này."
  hold_court.8071.a:0 "Một ngày nào đó, [target_province.GetNameNoTooltip] sẽ trở thành một thành phố vĩ đại."
 # Modifiers
  hold_court_8070_built_modifier:0 "Được Tài Trợ Thành Phố"
 # # The Republic of X
  hold_court.8080.t:0 "Cộng Hòa [mayor.GetPrimaryTitle.GetDeJureLiege.GetNameNoTierNoTooltip]"
  hold_court.8080.desc.intro:0 "[mayor.GetTitledFirstName] bước tới, tỏ ra rất cẩn trọng. \n\n"Thưa ngài, [mayor.GetPrimaryTitle.GetTierAsNameNoTooltip] của tôi tại [mayor.GetPrimaryTitle.GetNameNoTier] ngày càng giàu có nhờ các thị dân của chúng tôi giao thương với"
  hold_court.8080.desc.body_sea:0 "những con tàu buôn qua lại tại các hải cảng dọc bờ biển của [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip].""
  hold_court.8080.desc.body_fallback:0 "những thương nhân và lữ khách qua lại mỗi ngày tại [target_county.GetDeJureLiege.GetNameNoTier] và cổng thành của chúng tôi.""
  hold_court.8080.desc.body:0 "\n\n"Chúng tôi đã khiến thị trấn – và cả ngài – trở nên thịnh vượng, vì vậy chúng tôi xứng đáng có ảnh hưởng lớn hơn tại [target_county.GetNameNoTier].""
  hold_court.8080.a:0 "[target_county.GetNameNoTierNoTooltip] nay giao cho ngươi cai trị."
  hold_court.8080.b:0 "Những đặc quyền như vậy cần được chứng minh xứng đáng."
  hold_court.8080.c:0 "Ngươi đòi hỏi quá nhiều, hẳn phải có cách khác."
  hold_court.8080.c.tt_success:0 "Ngươi đạt được thỏa hiệp"
  hold_court.8080.c.tt_failure:0 "Ngươi không đạt được tiến triển"
  hold_court.8080.d:0 "Hãy hài lòng với những tự do hiện tại của ngươi, [mayor.GetTitleAsNameNoTooltip]."
  hold_court.8080.e:0 "Có vẻ các thị dân đã quên vị trí của mình."
