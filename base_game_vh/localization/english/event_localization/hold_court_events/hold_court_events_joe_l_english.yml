 # # A Place at Court
  hold_court.8090.t:0 "Một Vị Trí Tại Triều Đình"
  hold_court.8090.desc.intro:3 "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] của ta, [vassal.GetTitledFirstName], tiến lên thì thầm bên tai ta trước triều đình đông đủ. \n\n\"Ôi [vassal.Custom2('RelationToMeShort', ROOT.Char)] vinh quang, hãy ban cho ta vinh dự được [vassal.Custom('GetTargetCourtPositionDesc')]\""
  hold_court.8090.desc.intro_advocate:3 "Người [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal_advocate'))] của ta, [vassal_advocate.GetTitledFirstName], dẫn một [vassal.Custom('GetYoungMiddleAgedOld')] [vassal.GetWomanMan] tới trước triều đình. \n\n\"Ôi [ROOT.Char.GetTitleAsNameNoTooltip] vinh quang, hãy ban cho người [vassal_advocate.Custom('ComplimentAdjective')] [vassal_advocate.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] của tôi, [vassal.GetTitledFirstName], vinh dự được [vassal.Custom('GetTargetCourtPositionDesc')]\""
  hold_court.8090.desc.rival:2 "— và hãy loại bỏ [old_holder.GetTitledFirstName], cái [old_holder.Custom2('InsultAdjective', SCOPE.sC('vassal_advocate'))] [old_holder.Custom2('InsultNoun', SCOPE.sC('vassal_advocate'))] đó"
  hold_court.8090.desc.arrogant:2 "— một vai trò xứng đáng với địa vị của ta"
  hold_court.8090.desc.ambitious:2 " — một trách nhiệm xứng đáng với tài năng của ta"
  hold_court.8090.desc.superior:3 "— một công việc mà [old_holder.GetTitledFirstName] không làm tròn"
  hold_court.8090.desc.other_advocate:2 "— một vị trí mà [vassal.GetFirstName] xứng đáng hơn nhiều so với [old_holder.GetTitledFirstName]"
  hold_court.8090.desc.other:2 "— một vị trí mà ta phù hợp hơn nhiều so với [old_holder.GetTitledFirstName]"
  hold_court.8090.desc.empty_advocate:1 "— [vassal.GetSheHe] sẽ không làm ngài thất vọng.""
  hold_court.8090.desc.empty:2 "— ta sẽ không làm ngài thất vọng.""
  hold_court.8090.a.lady_in_waiting_lover:0 "À hem, được thôi, ngươi có thể hầu cận ta."
  hold_court.8090.a.lady_in_waiting_soulmate:0 "Chúng ta sẽ là một cặp tuyệt vời!"
  hold_court.8090.a.bodyguard_lover:0 ""Ngươi không được rời khỏi ta nửa bước, [vassal.GetFirstName].""
  hold_court.8090.a.bodyguard_soulmate:0 "#EMP Ôi, hiệp sĩ Patroclus dũng cảm của ta...#!"
  hold_court.8090.a:0 "Công việc này là của ngươi, [vassal.GetFirstNameNoTooltip]."
  hold_court.8090.b:0 "[old_holder.GetFirstNameNoTooltip] sẽ phải nhường chỗ."
  hold_court.8090.c:0 "Hiện tại ta cần những tài năng khác."
  move_and_grant_court_position_effect_tooltip:1 "[candidate.GetFirstNameNoTooltip] nhận một chức vụ"
  hold_court.8090.d.advocate:0 "Không, ta có điều gì đó #EMP đặc biệt#! dành cho [vassal.GetHerHim]..."
  hold_court.8090.d:0 "Không, ta có điều gì đó #EMP đặc biệt#! dành cho ngươi..."
  hold_court.8090.e.advocate:0 "[vassal.GetSheHe|U] không phù hợp với vị trí này."
  hold_court.8090.e:0 "Ngươi không phù hợp với chức vụ như vậy."
  court_position_desc_architect:0 "quản lý việc bảo trì và mở rộng các lãnh địa tráng lệ của ngài"
  court_position_desc_seneschal:0 "trông coi việc sắp xếp và vận hành gia thất hùng mạnh của ngài"
  court_position_desc_tutor:0 "đảm bảo con cái của ngài được giáo dục xứng đáng với địa vị"
  court_position_desc_almoner:0 "phân phát những khoản bố thí hào phóng của ngài cho người nghèo"
  court_position_desc_physician:0 "tìm kiếm và chữa trị bệnh tật cho gia đình ngài"
  court_position_desc_antiquarian:0 "chăm sóc các vật phẩm trong kho báu và kho vũ khí"
  court_position_desc_horse:0 "duy trì kỵ binh và chăm sóc chiến mã của ngài"
  court_position_desc_bodyguard:0 "bảo vệ ngài khỏi kẻ thù và luôn ở bên cạnh ngài"
  court_position_desc_champion:0 "đại diện cho ngài trong các vấn đề danh dự"
  court_position_desc_hunt:0 "tổ chức các cuộc săn và bảo vệ thú săn"
  court_position_desc_poet:0 "sáng tác những khúc ca và bài thơ xứng đáng với uy danh của ngài"
  court_position_desc_musician:0 "mang lại âm nhạc giải trí và tổ chức các trò tiêu khiển"
  court_position_desc_cupbearer:0 "rót đồ uống cho ngài và đảm bảo chúng an toàn"
  court_position_desc_lady:0 "đích thân hầu cận ngài như một người bạn đồng hành trung thành"
  court_position_desc_eunuch:1 "đảm bảo triều đình của ngài vận hành trôi chảy"
  court_position_desc_gardener:0 "chăm sóc khu vườn và đài phun nước"
  court_position_desc_artificer:0 "tạo ra những bảo vật tuyệt mỹ cho ngài và triều đình"
  court_position_desc_emissary:0 "cải thiện quan hệ với các nền văn hóa khác nhau trong lãnh thổ"
  court_position_desc_qadi:0 "đảm bảo các phán quyết thiêng liêng của Allah được tuân theo trong lãnh địa của ngài"
  court_position_desc_garuda:1 "trung thành phục vụ ngài, gươm trong tay dù hiểm nguy đến đâu"
  court_position_desc_keeper_of_swans:0 "chăm sóc đàn chim nước, biểu tượng thanh nhã của ngài"
  court_position_desc_travel_leader:1 "dẫn dắt ngài trong mọi chuyến hành trình"
  court_position_desc_akolouthos: "chỉ huy cận vệ hoàng gia, đặc biệt là đội Varangian hùng mạnh."
  court_position_desc_chronicler: "ghi chép mọi chiến công và sự kiện của ngài"
  court_position_desc_charioteer: "luyện tập ngày đêm để trở thành tay đua xe ngựa giỏi nhất"
  court_position_desc_bookmaker: "giám sát việc ghi sổ cho các cuộc cá cược đua xe"
  court_position_desc_executioner: "thi hành công lý chính đáng đối với tội phạm và kẻ phản bội"
  court_position_desc_food_taster: "đảm bảo bữa ăn của ngài ngon miệng và không bị đầu độc"
  court_position_desc_court_jester: "mua vui cho triều đình bằng những trò đùa xứng với uy danh của ngài"
  court_position_desc_court_astrologer: "quan sát bầu trời và các vì sao"
  court_position_desc_wet_nurse: "đảm bảo con cái của ngài được chăm sóc"
  court_position_desc_cave_hermit: "khiến triều đình say mê bằng những câu chuyện và bí ẩn"
  court_position_desc_master_assassin: "lan tỏa ảnh hưởng của ngài trong bóng tối"
  court_position_desc_court_scholar: "thúc đẩy tri thức trong lãnh địa của ngài"
  court_position_desc_boyan: "dẫn dắt quân đội của ngài tới chiến thắng"
  court_position_desc_siege_engineer: "giám sát việc chế tạo vũ khí công thành"
  court_position_desc_yurtchi: "chuẩn bị binh sĩ của ngài cho chiến tranh"
  court_position_desc_cherbi: "bảo vệ ngài bằng chính mạng sống của ta"
  court_position_desc_yeke_jarquchi: "đảm bảo luật pháp của ngài được tuân theo"
  court_position_desc_foreign_emissary: "là tiếng nói của ngài tại các vùng đất ngoại bang"
  court_position_desc_keeper_of_the_horses: "duy trì chất lượng chiến mã của ngài"
 # Interest
  hold_court_8090_interest_architect:0 "\n\n\"Đừng lo, việc xây dựng những công trình vĩ đại là niềm đam mê của ta.\""
  hold_court_8090_interest_seneschal_administrator:0 "\n\n\"Xin yên tâm, không ai nhiệt huyết hơn ta trong việc quản lý công việc của ngài.\""
  hold_court_8090_interest_seneschal_eunuch:0 "\n\n\"Không có điều gì khiến ta xao nhãng khỏi việc quản lý công việc của ngài, ta xin đảm bảo.\""
  hold_court_8090_interest_almoner:0 "\n\n\"Chỉ bằng cách chia sẻ của cải trần thế, chúng ta mới có thể cân bằng cái ác trên đời...\""
  hold_court_8090_interest_physician_experience:0 "\n\n\"Ngài có thể tin rằng ta đã chữa trị nhiều bệnh tật và vết thương — ta không phải kẻ lang băm.\""
  hold_court_8090_interest_physician_mystic:0 "\n\n\"Giữ gìn sức khỏe đòi hỏi sự giao hòa với những quyền năng vượt khỏi thế tục, hãy để ta chứng minh...\""
  hold_court_8090_interest_physician_herbalist:0 "\n\n\"Kiến thức của ta về dược dược và thuốc mỡ đã được biết đến rộng rãi, hãy để ta cống hiến tài năng của mình.\""
  hold_court_8090_interest_antiquarian:0 "\n\n\"Ta rất yêu thích lịch sử, và sẽ bảo đảm di sản của những bảo vật của ngài.\""
  hold_court_8090_interest_horse:0 "\n\n\"Đừng lo, ngay cả bước khập khiễng nhỏ nhất của chiến mã yêu thích của ngài cũng không qua mắt ta!\""
  hold_court_8090_interest_bodyguard_soulmate:0 "\n\nÁnh mắt của [ROOT.Char.GetHerHis|U] chứa đựng cảm xúc mãnh liệt khiến tim ta rung động..."
  hold_court_8090_interest_bodyguard_lover:0 "\n\nThật khó mà không say mê dưới ánh nhìn cháy bỏng của [ROOT.Char.GetHerHis]..."
  hold_court_8090_interest_bodyguard_bestie:0 "\n\nNếu có ai ta có thể tin tưởng giao việc này, thì đó là [ROOT.Char.GetFirstNameNoTooltip]..."
  hold_court_8090_interest_bodyguard_friend:0 "\n\nMột đồng minh thân cận như vậy sẽ phục vụ ta rất tốt và bầu bạn cùng ta..."
  hold_court_8090_interest_champion:2 "\n\n\"Xin yên tâm, tài kiếm của ta đã nổi danh khắp [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
  hold_court_8090_interest_hunt:3 "\n\n\"Ta không thích gì hơn một cuộc săn đầy kịch tính — điều này ai cũng biết khắp [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
  hold_court_8090_interest_poet:0 "\n\n\"Ta là một thi sĩ nổi danh; đại sảnh của ngài sẽ vang vọng những câu chuyện về uy danh của ngài!\""
  hold_court_8090_interest_musician_gregarious:0 "\n\n\"Hãy tin ta, ta sẽ khiến những buổi yến tiệc của ngài càng khó quên hơn nữa!\""
  hold_court_8090_interest_musician_culture:0 "\n\n\"Người [ROOT.Char.GetCulture.GetNameNoTooltip] có nhiều điều để dạy dân chúng của ngài về nghệ thuật âm nhạc.\""
  hold_court_8090_interest_cupbearer:2 "\n\n\"Đừng lo thưa bệ hạ, chén rượu của ngài sẽ luôn đầy dưới sự chăm sóc của ta!\""
  hold_court_8090_interest_lady_lover:0 "\n\nNàng ranh mãnh nháy mắt với ta, và ta khó mà không đỏ mặt khi nghĩ đến những cơ hội điều này mang lại..."
  hold_court_8090_interest_lady_soulmate:0 "\n\nKhông có ai ta muốn ở bên cạnh hơn..."
  hold_court_8090_interest_lady_bestie:0 "\n\nCó vẻ ta sẽ không bao giờ phải xa người bạn thân nhất của mình!"
  hold_court_8090_interest_lady_friend:0 "\n\nMột người bạn đồng hành dễ chịu như vậy hẳn sẽ làm cuộc sống triều đình bớt nhàm chán..."
  hold_court_8090_interest_eunuch:0 "\n\n\"Hãy tin ta, ta sẽ không để bất cứ điều gì làm xao nhãng công việc.\""
  hold_court_8090_interest_gardener:0 "\n\n\"Ta rất yêu cây cỏ; tìm hiểu công dụng của chúng và chăm sóc chúng thật tốt!\""
  hold_court_8090_interest_artificer:0 "\n\n\"Tác phẩm của ta được đánh giá cao khắp [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
  hold_court_8090_interest_emissary:0 "\n\n\"Thành tích của ta trong đàm phán và hòa giải đã được chứng minh.\""
  hold_court_8090_interest_qadi:0 "\n\n\"Ngài không cần lo lắng, ta am hiểu tường tận mọi vấn đề liên quan.\""
  hold_court_8090_interest_garuda:0 "\n\n\"Ta tin rằng danh tiếng của ta trong các cuộc đấu tay đôi hẳn đã đến tai ngài.\""
  hold_court_8090_interest_keeper_of_swans:0 "\n\n\"Ta có nhiều kinh nghiệm với chim nước, rõ ràng ta là lựa chọn thích hợp.\""
  hold_court_8090_interest_friend:0 "\n\nỒ, làm sao ta có thể từ chối một người bạn như [ROOT.Char.GetFirstNameNoTooltip]?"
  hold_court_8090_interest_bestie:0 "\n\n[ROOT.Char.GetFirstNameNoTooltip] luôn là người bạn trung thành và tốt bụng với ta..."
  hold_court_8090_interest_lover:0 "\n\nThật khó cưỡng lại cơ hội giữ [ROOT.Char.GetFirstNameNoTooltip] ở gần..."
  hold_court_8090_interest_soulmate:0 "\n\nTa thật khó lòng từ chối [ROOT.Char.GetFirstNameNoTooltip], ngay cả trong những lúc bình thường..."
  hold_court_8090_interest_other:0 "\n\nCó lẽ [vassal.GetSheHe] #EMP thực sự#! sẽ phù hợp hơn..."
  hold_court_8090_interest_fallback:0 "\n\nTa đoán những công việc này cuối cùng cũng phải có #EMP ai đó#! làm..."
 # Modifiers
  hold_court_8090_favorites_modifier:0 "Thiên Vị"
 # # A Child of the Court
  hold_court.8100.t:0 "Một Đứa Trẻ Của Triều Đình"
  hold_court.8100.desc.intro:1 "Ta đối diện với đôi mắt buồn bã của [ward.GetFullNameNicknamedPossessive], đôi mắt ấy càng mở to và đáng thương hơn khi [ward.GetHerHis] [ward.Custom2('RelationToMeShort', SCOPE.sC('advocate'))] [advocate.GetTitledFirstName] nhẹ nhàng dẫn [ward.GetHerHim] về phía ngai vàng của ta. \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')]", [advocate.GetSheHe] than thở, "[ward.Custom('GirlBoy')] đã ở"
  hold_court.8100.desc.vassal:0 "[ward.GetLiege.GetFirstNamePossessive]"
  hold_court.8100.desc.court:0 "triều đình của ngài"
  hold_court.8100.desc.body:0 "triều đình mà không có ai trông nom [ward.GetHerHim] kể từ [ward.Custom('get_hold_court_8100_situation')] của [ward.GetHerHis] người thân yêu [ward.Custom('get_hold_court_8100_parent')] – xin hãy chăm lo cho tương lai của [ward.GetHerHis]." \n\n"
  hold_court.8100.desc.interest_family:0 "[ward.GetSheHe|U] dù sao cũng là máu mủ của ta..."
  hold_court.8100.desc.interest_marriage:0 "Đứa trẻ này có thể là một mối hôn sự tốt cho gia đình ta..."
  hold_court.8100.desc.interest_alliance:0 "Có lẽ khi trưởng thành [ward.GetSheHe] sẽ trở thành một đồng minh hữu ích..."
  hold_court.8100.desc.interest_fallback:0 "Có thể làm gì với một đứa trẻ như vậy?"
  hold_court.8100.a:0 "Đừng lo, ta sẽ tự mình nuôi dạy đứa [ward.Custom('GirlBoy')] này."
  hold_court.8100.b:0 "Ta đã quá bận, nhưng ta sẽ tìm cho [ward.GetHerHim] một mái nhà."
  hold_court.8100.c:0 "[ward.GetFirstNameNoTooltip] sẽ trở thành người của nhà [ROOT.Char.GetDynastyHouseNameNoTooltip]!"
  hold_court.8100.c.tt_child:0 "Mọi đứa trẻ"
  hold_court.8100.d:0 "Nuôi dạy một đứa trẻ không hề rẻ..."
  hold_court.8100.e:0 "Thật đáng tiếc, nhưng đây không phải việc của vương miện."
  hold_court.8100.hook.tt:0 "[ward.GetName] sẽ nợ ngươi một [hook|E] Mạnh nếu họ vẫn là [ward|E] của ngươi cho đến khi trưởng thành."
 # Modifiers
  hold_court_8100_adopted_modifier:0 "Thường Dân Được Nhận Nuôi"
  hold_court_8100_adopted_modifier_desc:0 "Nhân vật này đã được nhận vào tầng lớp quý tộc từ xuất thân bình dân"
 # Custom
  hold_court_8100_parent_general:0 "cha mẹ"
  hold_court_8100_situation_dead:0 "cái chết"
  hold_court_8100_situation_jailed:0 "bị bắt giam"
  hold_court_8100_situation_unknown:0 "mất tích"
 # # Serious Business
  hold_court.8110.t:0 "Chuyện Hệ Trọng"
  hold_court.8110.desc:0 "Một nông dân kỳ quặc tiến lại quá gần trước khi lính gác bước ra chặn giữa chúng ta. "Ồ!" [peasant.GetSheHe] lùi lại với một cái nháy mắt, cười khanh khách với hàm răng thưa.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], tôi đến từ [peasant_holding.GetNameNoTooltip] với một chuyện cực kỳ quan trọng!" Lông mày của [peasant.GetHerHis|U] nhấp nhô.\n\n"Ngài thấy đấy, [ROOT.Char.Custom('FormOfAddressForLiege')],"
  hold_court.8110.desc.affair:1 "gã [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] của làng chúng tôi đã lén lút với chị em họ của nhà [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)], và cả làng náo loạn! Chuyện này đã bảy trăng rồi! Hay là tám... nhỉ?" [peasant.GetSheHe|U] vuốt cằm [peasant.GetHerHis]."
  hold_court.8110.desc.fence:1 "từ thời ông nội tôi, gã [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] đã dựng hàng rào dọc theo cánh đồng của cha nhà [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)], nhưng giờ nó mục nát hết rồi, và dĩ nhiên thằng cháu chẳng muốn sửa!"" 
  hold_court.8110.desc.goat:1 "mọi chuyện bắt đầu từ vụ mùa trước. Con dê của nhà [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)|U] lạc vào túp lều của cháu gái nhà [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)], và gây ra một mớ hỗn độn khủng khiếp!" [peasant.GetSheHe|U] vỗ đùi [peasant.GetHerHis]. "Ôi ngài phải thấy mới tin!""
  hold_court.8110.desc.veg:1 "con lợn nái của nhà [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] chui qua hàng rào một đêm nọ, và r-rồi... nó xông vào vườn rau của lão [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)]! Niềm tự hào của lão đấy!" Nước mắt cười chảy dài trên khuôn mặt gã nông dân đang co giật vì cười."
  hold_court.8110.desc.drink:1 "chị gái của nhà [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] thề rằng cô ta nấu [ROOT.Char.Custom('RegionalDrink')] ngon hơn vợ của nhà [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)], và dĩ nhiên họ hòa nhau, rồi các ông chồng cũng nhảy vào!"" 
  hold_court.8110.a:0 "Thật vậy sao? Nói tiếp đi."
  hold_court.8110.b:0 "[steward.GetCouncilTitleFirstNameNoTooltip], đi giải quyết chuyện này."
  hold_court.8110.c:0 "Dám cười nhạo #EMP TA#! sao? Treo cổ hắn!"
  hold_court.8110.d:0 "Ngươi là đồ ngốc. Nhưng là #EMP tên hề#! của ta."
  hold_court.8110.e:0 "Cái gì? Sao [peasant.GetWomanMan] này lại vào được đây? Có ai không?"
 # Modifiers
  hold_court_8110_common_modifier:0 "Thân Thiện Với Dân"
  hold_court_8110_haughty_modifier:0 "Kiêu Ngạo"
  hold_court_8110_steward_modifier:0 "Tranh Chấp Được Giải Quyết"
  hold_court_8110_execute_modifier:0 "Xử Tử Kẻ Lắm Mồm"
