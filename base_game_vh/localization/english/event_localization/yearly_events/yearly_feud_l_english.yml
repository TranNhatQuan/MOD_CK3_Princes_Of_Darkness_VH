l_english:
  bp1_yearly.6000.t:0 "Vì Tội Lỗi của [my_rival.GetMotherFather|U]"
  bp1_yearly.6000.desc:0 "Một tiếng thét lớn xé toạc sự nhộn nhịp bên ngoài vùng [ROOT.Char.Custom('ResidenceBuilding')] của ta.\n\n"Tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rivals_child'))] đáng ghét! Ta là đứa [rivals_child.Custom('GetDaughterSon')] của [my_rival.GetTitledFirstName] và thời khắc đã đến để ngươi phải trả giá cho những hành vi đê hèn của mình.\nHãy đối mặt với ta, bằng không cả thế giới sẽ biết rằng ngươi là kẻ không sẵn lòng bảo vệ danh dự của chính mình!"\n\nKhi quay lại, ta bắt gặp ánh mắt rực lửa của một kẻ [rivals_child.GetWomanMan] đang bị thiêu đốt bởi khao khát bảo vệ danh dự của [my_rival.GetMotherFather] của [rivals_child.GetHerHis].\n\nLính gác của ta vẫn ở gần đây - nếu muốn, ta có thể tống cổ kẻ nóng đầu này ra ngoài, khiến hắn nhục nhã và bất lực."
  bp1_yearly.6000.a:0 "Mối hận của ta là với [my_rival.GetMotherFather], không phải với ngươi."
  bp1_yearly.6000.b:0 "Ta chấp nhận thử thách!"
  bp1_yearly.6000.c:0 "Bảo vệ! Đuổi tên #EMP trẻ con#! này ra ngoài."
  bp1_yearly.6000.a.tt:0 "Cố gắng thuyết phục [rivals_child.GetFirstNameNoTooltip] rút lui"
  bp1_yearly.6000.a.success:0 "Ngươi thuyết phục [rivals_child.GetFirstName] chịu lui"
  bp1_yearly.6000.a.failure:0 "[rivals_child.GetFirstName] cảm thấy sự khinh miệt của ngươi thật nhục nhã"
  bp1_yearly.6000.b.tt:0 "#V Đấu#! [rivals_child.GetFirstNameNoTooltip] để dạy [rivals_child.GetHerHim] vị trí của [rivals_child.GetHerHis]!\n#weak Cuộc đấu này có thể dẫn tới tử vong.#!\nNếu thắng, ngươi sẽ nhận [prestige_i] [prestige|E]\n\n[prowess|E] của ngươi: [prowess_i]#V [SCOPE.GetRootScope.GetCharacter.GetProwess]#!\n[prowess|E] của [rivals_child.GetFirstNamePossessive]: [prowess_i]#V [rivals_child.GetProwess]#!"
  bp1_yearly.6001.victory_toast:0 "[rivals_child.GetFirstName] đã bị đánh bại và trở về đường của [rivals_child.GetHerHis]"
  bp1_yearly.6002.trigger_failure:0 "Cuộc đấu của ta với [rivals_child.GetFirstNameNoTooltip] đã bị vô hiệu"
  defused_feud_escalation_opinion:0 "Ngăn chặn leo thang xung đột"
  bp1_yearly.6003.t:0 "Một Hành Động Nông Nổi"
  bp1_yearly.6003.desc:0 ""Con chỉ làm những gì phải làm để bảo vệ danh dự của người mà thôi!"\n\n[rivals_child.GetFirstNameNoTooltip] đang thể hiện một sự pha trộn kỳ lạ giữa xấu hổ và kiêu hãnh khi [rivals_child.GetSheHe] giải thích những gì đã xảy ra với ta. Có vẻ như trong sự hăng hái bảo vệ danh tiếng gia tộc của [rivals_child.GetHerHis], [rivals_child.GetSheHe] đã phục kích kẻ thù của ta, [attacked_rival.GetTitledFirstName] ngay tại nhà của [attacked_rival.GetHerHis].\n\n[rivals_child.GetFirstNameNoTooltip] đã nhanh chóng bị bêu rếu nhục nhã bởi [attacked_rival.GetFirstNameNoTooltip] và hiện đã được gửi trả về nhà cho ta."
  bp1_yearly.6003.a:0 "Ngươi đã làm tốt, [rivals_child.Custom('GetDaughterSon')]!"
  not_controlling_child_tooltip:0 "Ngươi sẽ mất uy tín vì không kiểm soát được [rivals_child.Custom('GetDaughterSon')]"
  bp1_yearly.6003.b:0 "Sao ngươi lại làm vậy? Chúng ta phải bồi thường cho [attacked_rival.GetTitledFirstNameNoTooltip]"
  child_let_down_tooltip:0 "[rivals_child.GetFirstNameNoTooltip] sẽ thất vọng vì thiếu sự ủng hộ của ngươi"
  bp1_yearly.6004.t:1 "Giết Một [rivals_child.Custom('GetDaughterSon')|U]"
  bp1_yearly.6004.desc:0 "Khi nhìn xuống thi thể của [rivals_child.GetFirstName], Ta càng nhận ra rằng cuộc đấu này sẽ có hậu quả. Ta đã giết [rivals_child.Custom('GetDaughterSon')] của một [my_rival.GetWomanMan] mà Ta coi là kẻ thù, và sớm thôi thế giới sẽ biết những gì Ta đã làm."
  bp1_yearly.6004.a:1 "Ta phải gửi lời chia buồn tới [my_rival.GetTitledFirstNameNoTooltip]."
  bp1_yearly.6004.b:1 "[my_rival.GetFirstNameNoTooltip] chỉ nhận lại những gì [my_rival.GetSheHe] đã gieo!"
  killed_my_child:0 "Kẻ sát hại con ta"
  bp1_yearly.6005.t:0 "Trở Về Chiến Thắng?"
  bp1_yearly.6005.desc:0 ""Con đã làm những gì phải làm để bảo vệ danh dự của người!"\n\n[rivals_child.GetFirstNameNoTooltip] đang thể hiện một sự pha trộn kỳ lạ giữa lòng kiêu hãnh mạnh mẽ và một chút e ngại khi [rivals_child.GetSheHe] giải thích những gì đã xảy ra với ta. Có vẻ như trong sự hăng hái bảo vệ danh tiếng gia tộc của [rivals_child.GetHerHis], [rivals_child.GetSheHe] đã phục kích kẻ thù của ta, [attacked_rival.GetTitledFirstName] ngay tại nhà của [attacked_rival.GetHerHis].\n\n[rivals_child.GetFirstNameNoTooltip] đã có thể vượt qua [attacked_rival.GetFirstNameNoTooltip], đánh bại [attacked_rival.GetHerHim] trong một trận quyết đấu tay đôi."
  bp1_yearly.6005.a:0 "Bài học quý giá cho [attacked_rival.GetFirstNameNoTooltip]"
  rewarding_success_in_child_tooltip:0 "[rivals_child.GetFirstName] sẽ được thưởng"
  bp1_yearly.6005.b:0 "Điều này hoàn toàn sai! Chúng ta phải bồi thường cho [attacked_rival.GetTitledFirstNameNoTooltip]"
  bp1_yearly.6005.outcome_toast:0 "[rivals_child.GetFirstName] đã chiến thắng và danh tiếng tốt của chúng ta bị nhục nhã"
  bp1_yearly.6006.t:0 "Một Anh Hùng Trở Về?"
  bp1_yearly.6006.desc:0 ""Con đã làm những gì phải làm để bảo vệ danh dự của người!"\n\n[rivals_child.GetFirstNameNoTooltip] đang thể hiện một sự pha trộn kỳ lạ giữa lòng kiêu hãnh mạnh mẽ và một chút e ngại khi [rivals_child.GetSheHe] giải thích những gì đã xảy ra với ta. Có vẻ như trong sự hăng hái bảo vệ danh tiếng gia tộc của [rivals_child.GetHerHis], [rivals_child.GetSheHe] đã phục kích kẻ thù của ta, [attacked_rival.GetTitledFirstName] ngay tại nhà của [attacked_rival.GetHerHis].\n\n[rivals_child.GetFirstNameNoTooltip] đã có thể vượt qua [attacked_rival.GetFirstNameNoTooltip], kết liễu [attacked_rival.GetHerHim] trong một trận quyết đấu tay đôi."
  bp1_yearly.6006.a:0 "Ngươi làm ta tự hào, [rivals_child.Custom('GetDaughterSon')]"
  bp1_yearly.6006.outcome_toast:0 "[rivals_child.GetFirstName] đã đánh bại và giết [my_rival.GetFirstName]"
  murdered_my_vassal_crime:0 "Sát nhân"
  bp1_yearly.6006.b:0 "Sao ngươi lại làm vậy? Chúng ta phải bồi thường cho [rivals_beneficiary.GetTitledFirstNameNoTooltip]"
  bp1_yearly.6006.c:0 "Một khoản từ thiện sẽ bù đắp cho việc xấu này"
  bp1_yearly.6006.c.tt:0 "[rivals_child.GetFirstNameNoTooltip] sẽ thất vọng vì thiếu sự ủng hộ của ngươi"
  defended_family_honor_opinion:0 "Bảo vệ danh dự gia đình"
  attacked_by_rivals_child:0 "Gia tộc xung đột"
  bp1_yearly.6010.t:0 "Mất Một [rivals_child.Custom('GetDaughterSon')]"
  bp1_yearly.6010.desc:0 "Có vẻ như đứa [rivals_child.Custom('GetDaughterSon')] của ta, [rivals_child.GetTitledFirstName], đã được truyền cảm hứng từ mối thâm thù của ta dành cho kẻ thù của mình là [attacked_rival.GetTitledFirstName], và đã tự mình đứng ra để kết thúc mối hiềm khích của chúng ta.\n\nBị thúc đẩy bởi sự hăng hái của tuổi trẻ, [rivals_child.GetFirstNameNoTooltip] đã phục kích [attacked_rival.GetFirstNameNoTooltip] and bị giết một cách không thương tiếc trong trận chiến diễn ra sau đó."
  bp1_yearly.6010.desc.apology:0 "\n\nTin tức này được gửi kèm cùng một bức thư từ chính [attacked_rival.GetTitledFirstNameNoTooltip] [attacked_rival.GetHerselfHimself], tuyên bố rằng mặc dù [rivals_child.GetFirstNameNoTooltip] đã phải nhận một kết cục thích đáng vì tội tấn công ai đó ngay tại nhà của họ, nhưng [rivals_child.GetSheHe] vô cùng lấy làm tiếc về những gì đã xảy ra và [rivals_child.GetSheHe] sẽ bồi thường tài chính cho ta vì sự tổn thất này."
  bp1_yearly.6010.a:0 "[attacked_rival.GetFirstNameNoTooltip] sẽ phải hối tiếc ngày hôm nay!"
  bp1_yearly.6010.a.flavor:0 "Thề sẽ trả thù [attacked_rival.GetFirstNameNoTooltip]"
  bp1_yearly.6010.b:0 "Ta đã làm gì vậy!?"
  bp1_yearly.6010.b.flavor:0 "Cố gắng tránh thêm đổ máu"
  bp1_yearly.6010.vengeance.outcome_toast:0 "[my_rival.GetFirstName] đã thề trả thù [rivals_child.GetFirstNameNoTooltip]"
  bp1_yearly.6010.deescalation.outcome_toast:0 "[my_rival.GetFirstName] đã biết về cái chết của [rivals_child.GetFirstNameNoTooltip]"
  every_child_6010:0 "Tất cả anh chị em của [rivals_child.GetFirstNameNoTooltip]"
  culture_tradition_events.2000.t:0 "Lãnh Đạo Truyền Cảm Hứng"
  culture_tradition_events.2000.desc:0 "Khi Ta xem xét lời cầu viện từ thần tử [inspiring_vassal.GetTitledFirstName], Ta chợt nhận ra mối quan hệ tốt với chúa tể của Ta, [ROOT.Char.GetLiege.GetTitledFirstName], luôn vững bền.\n\nTa nhận ra rằng mình nên noi gương cách cư xử tận tâm của [ROOT.Char.GetLiege.GetFirstNameNoTooltip] trong quan hệ với tất cả những người thuộc quyền. Bằng cách đó, Ta có thể truyền cảm hứng tương tự về bổn phận cho những người dưới quyền Ta."
  culture_tradition_events.2000.a:0 "Nhận lấy điều này [inspiring_vassal.GetTitledFirstNameNoTooltip], và cho ta biết nếu cần thêm."
  culture_tradition_events.2000.b:0 "Trung thành chỉ là từ khác của yếu đuối."
  culture_tradition_events.2001.t:0 "Dẫn Dắt Bằng Gương Mẫu?"
  culture_tradition_events.2001.desc:0 "Một cuộc xung đột gần đây giữa chư hầu của ta, [targeted_vassal.GetTitledFirstName] cùng những thần dân của chính [targeted_vassal.GetHerHis] đã đòi hỏi một chuyến viếng thăm đột xuất tới vùng [targeted_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Sự hiện diện đơn thuần của ta dường như đã giải quyết ổn thỏa vấn đề và giới tá điền địa phương có vẻ hài lòng khi những lời phàn nàn của họ đã được ta lắng nghe.\n\nKhi ta lang thang dọc theo những hành lang trống trải vào đêm muộn, ta suy ngẫm về mối quan hệ đầy thất vọng với chính minh chủ của mình, [ROOT.Char.GetLiege.GetTitledFirstName]. [ROOT.Char.GetLiege.GetSheHe|U] luôn nhanh chóng yêu cầu sự phục tùng của ta nhưng hiếm khi [ROOT.Char.GetLiege.GetSheHe] đến ứng cứu ta giống như những gì ta vừa làm cho [targeted_vassal.GetTitledFirstNameNoTooltip]."
  culture_tradition_events.2001.a:0 "Đền đáp mới là điều làm chuyển động thế giới, không phải bổn phận."
  culture_tradition_events.2001.b:0 "Ta phải cố gắng tốt hơn [ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]."
