l_english:
 #[Faith] Traders in [County]
  yearly_saharan.0001.t:0 "[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip] Thương nhân tại [target_county.GetNameNoTierNoTooltip]"
  yearly_saharan.0001.desc:0 "Thương mại xuyên Sahara từ lâu đã đi qua vùng đất này, mang lại của cải, ý tưởng và học thuyết. Thông thường, một người cai trị như Ta chỉ cần hưởng phần công bằng của mình, các tuyến đường còn lại tự vận hành.\n\nGần đây, ngày càng nhiều thương nhân [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip] đi qua [target_county.GetNameNoTier], mang theo đức tin và tiền bạc.\n\nMột tập đoàn đang xin phép Ta được định cư và mua tài sản, đồng thời đã chuẩn bị một món quà hậu hĩnh để lấy lòng Ta."
  yearly_saharan.0001.a:0 "Ta vui vẻ nhận khoản cống phẩm này."
  yearly_saharan.0001.a.tt:0 "#WEAK Điều này có thể ảnh hưởng đến dân địa phương sau này...#!"
  yearly_saharan.0001.b:0 "Ngươi có thể tiếp tục đi qua, nhưng chỉ đến vậy thôi."
  yearly_saharan.0001.c:0 "[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] bị cấm vào [target_county.GetNameNoTierNoTooltip], hàng hóa của họ #EMP bị tịch thu#!!"
  yearly_saharan.0001.c.list:0 "Tất cả [counties|E] cùng [realm|E] liền kề [target_county.GetNameNoTierNoTooltip]"
 
  yearly_saharan.0003.t:0 "$yearly_saharan.0001.t$: Hội Nhập"
  yearly_saharan.0003.desc_initial:0 "Những thương nhân [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip] mà Ta cho phép định cư tại [target_county.GetNameNoTier] đã ở đây vài năm nay,"
  yearly_saharan.0003.desc_current:0 "Trong vài năm, [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] từ [source_county.GetNameNoTier] đã sống tại [target_county.GetNameNoTier],"
  yearly_saharan.0003.desc:0 "và dường như họ đã hòa nhập khá tốt với cộng đồng hiện có.\n\nKết quả là thương mại tràn ngập khu vực, doanh thu đạt mức cao nhất từ trước tới nay, và ngay cả dân thường cũng quen với âm thanh của vàng ngân nga!"
  yearly_saharan.0003.a:0 "Một món lợi tuyệt vời!"
  yearly_saharan.0003.b:0 "Đánh thuế họ đến mức kiệt quệ."
 
  yearly_saharan.0004.t:0 "$yearly_saharan.0001.t$: Bùng Nổ Thương Mại"
  yearly_saharan.0004.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
  yearly_saharan.0004.desc_current:0 "$yearly_saharan.0003.desc_current$"
  yearly_saharan.0004.desc:0 "và thương mại cùng sức sống họ mang đến dường như vô hạn!\n\nMọi người đổ xô đến các chợ: xe chở đầy vàng đi về phía bắc, xe chở muối tràn về phía nam, và tất cả đều đóng thuế khi đi lại! Thật sự, đây là một góc thịnh vượng của vương quốc!"
  yearly_saharan.0004.a.tt:0 "Ngươi cố gắng cải thiện [stewardship|E]"
  yearly_saharan.0004.a:0 "Ta nghĩ mình có thể học hỏi một vài điều từ những thương nhân này!"
  yearly_saharan.0004.a.tt.outcome_1:0 "Quản lý tăng"
  yearly_saharan.0004.a.tt.outcome_2:0 "$yearly_saharan.0004.a.tt.outcome_1$"
  yearly_saharan.0004.a.tt.outcome_3:0 "$yearly_saharan.0004.a.tt.outcome_1$"
  yearly_saharan.0004.b:0 "Nghe có tiếng thuế tăng phải không?"
  yearly_saharan.0004.c:0 "Tất nhiên, chúng ta sẽ phải thu một số thuế nợ..."
 
  yearly_saharan.0005.t:0 "$yearly_saharan.0001.t$: Thay Đổi Đức Tin"
  yearly_saharan.0005.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
  yearly_saharan.0005.desc_current:0 "$yearly_saharan.0003.desc_current$"
  yearly_saharan.0005.desc:0 "và đức tin của họ đã bén rễ vững chắc trong lòng dân địa phương. Đến mức hiện nay nhiều người theo [target_county.GetProvince.GetCounty.GetFaith.HighGodName] hơn là cầu nguyện [target_county_old_faith.HighGodName]!\n\nViệc cải đạo diễn ra hòa bình, dân chúng tỏ ra hiền hòa và hài lòng với niềm tin mới, nhưng những tín ngưỡng cũ gần như đã biến mất."
  yearly_saharan.0005.a:0 "Chào mừng đến ánh sáng của [ROOT.GetCharacter.GetFaith.HighGodName]!"
  yearly_saharan.0005.b:0 "Hừ. Ít nhất họ hạnh phúc vì điều đó."
  yearly_saharan.0005.c:0 "Chưa khi nào khi ta còn là [ROOT.GetCharacter.GetTitleAsNameNoTooltip]!"

 #[Culture] Nomads Flock to [County]
  yearly_saharan.0021.t:0 "Du Mục [nomad_leader.GetCulture.GetNameNoTooltip] Tập Trung tại [target_county.GetNameNoTierNoTooltip]"
  yearly_saharan.0021.desc:0 "Mặc dù ta là một [ROOT.GetCharacter.GetTitleAsNameNoTooltip] quý tộc, nhưng có những nơi quá xa xôi hẻo lánh đến mức ngay cả danh tiếng của ta cũng chẳng có mấy thế lực. Những nơi mà ta không bao giờ có thể thực sự hy vọng cai trị được.\n\nXuất hiện từ những nơi sâu thẳm như vậy ở Sahara, các bộ lạc du mục [nomad_leader.GetCulture.GetCollectiveNounNoTooltip] dạo gần đây đã tràn vào vùng [target_county.GetNameNoTier], dễ dàng chiếm đóng các khoảng trống và vùng lãnh thổ mà những người định cư [target_county.GetProvince.GetCounty.GetCulture.GetNameNoTooltip] địa phương bỏ lại.\n\nMột trong những thủ lĩnh của họ thậm chí đã đến gặp ta để xin phép đưa liên minh rộng lớn hơn của [nomad_leader.GetHerHis] vào nhằm nắm giữ khu vực này nhân danh ta."
  yearly_saharan.0021.a:0 "Ta sẽ để ngươi quản lý luôn!"
  yearly_saharan.0021.b:0 "Người [nomad_leader.GetCulture.GetNameNoTooltip] luôn được chào đón trong vương quốc ta."
  yearly_saharan.0021.c:0 "Có lẽ ngươi nên gia nhập làm thần tử của ta?"
  yearly_saharan.0021.d:0 "Vô lý! Biến đi!"

 #Slave Raid against [Realm] Escalates
  yearly_saharan.0031.t:0 "Cướp Nô Lệ Tại [affected_sub_realm.GetNameNoTierNoTooltip] Leo Thang"
  yearly_saharan.0031.desc:0 "Các vụ cướp nô lệ, cùng hoạt động buôn bán người phát sinh, thường là hiện thực tàn nhẫn đối với những ai ở hoặc gần Sahel. Tiền kiếm được từ các vụ cướp này đôi khi quá hấp dẫn để bỏ qua, và nhiều khu định cư thi thoảng cướp lẫn nhau.\n\nGần đây, nô lệ từ [slave_raider_county.GetNameNoTier] đã nhắm vào [raided_county.GetNameNoTier] lân cận, và nhiều thương nhân nổi bật đang lên kế hoạch một cuộc tấn công lớn, bị phản đối bởi [raided_character_marshal.GetCouncilTitle] [raided_character_marshal.GetFirstName]."
  yearly_saharan.0031.a:0 "Quá lợi nhuận! Gửi lính tham gia!!"
  yearly_saharan.0031.a.tt_success:0 "[raided_county.GetNameNoTierNoTooltip] bị cướp nô lệ nặng nề"
  yearly_saharan.0031.a.tt_fail:0 "[raided_character_marshal.GetTitledFirstNameNoTooltip] đánh bật bọn cướp nô lệ"
  yearly_saharan.0031.b:0 "Ngăn chặn hành vi man rợ này!"
  yearly_saharan.0031.c:0 "Thật sự chuyện này không liên quan đến ta."
  yearly_saharan.0031.c.raided_hurt:0 "[raided_county.GetNameNoTierNoTooltip] bị cướp phá"
  yearly_saharan.0031.c.raiders_hurt:0 "Nhiều tay cướp [slave_raider_county.GetAdjectiveNoTooltip] bị thương"

 #Marauding Slavers from [Realm]
  yearly_saharan.0032.t:0 "Bọn Nô Lệ Cướp bóc từ [hostile_sub_realm.GetNameNoTierNoTooltip]"
  yearly_saharan.0032.desc:0 "Các bọn cướp nô lệ ở Sahel, thật không may, là mối đe dọa mà nhiều người phải đối mặt. Sức hấp dẫn của của cải đổi lấy việc vận chuyển đồng loại đi khắp nơi là quá lớn với một số người.\n\nThường thì các vụ cướp này rải rác và lẻ tẻ, nhưng bọn cướp từ [slave_raider_county.GetNameNoTier] đã bắt đầu tấn công có tổ chức vào [raided_county.GetNameNoTier]. Bọn cướp xiềng cả làng, do binh lính của [slave_raider_county.GetHolder.GetTitledFirstName] [slave_raider_county.GetHolder.GetHerHim] dẫn đầu!"
  yearly_saharan.0032.a:0 "Chuẩn bị chiến đấu chống lại bọn cặn bã này!"
  yearly_saharan.0032.a.tt_success:0 "Ngươi đánh bại và cướp bọn nô lệ"
  yearly_saharan.0032.a.tt_fail:0 "Bọn cướp của [slave_raider_county.GetHolder.GetFirstNamePossessiveNoTooltip] tàn phá [raided_county.GetNameNoTierNoTooltip]"
  yearly_saharan.0032.b:0 "Nghe này, lẽ ra chúng phải đóng thuế về chuyện này..."
  yearly_saharan.0032.c:0 "Ta chẳng quan tâm."

 #Modifiers
  foreign_trader_enclaves_saharan_modifier:0 "Khu Thương Nhân Ngoại Giáo"
  foreign_trader_enclaves_saharan_modifier_desc:0 "Các thương nhân ngoại giáo đã lập nơi cư trú tại đây."
  respects_local_traditions_saharan_modifier:0 "Tôn Trọng Truyền Thống Địa Phương"
  respects_local_traditions_saharan_modifier_desc:0 "Nhân vật này được biết đến vì coi trọng truyền thống tổ tiên hơn vàng ngoại bang."
  foreign_traders_unable_to_root_saharan_modifier:0 "Thương Nhân Ngoại Giáo Lưu Lạc"
  foreign_traders_unable_to_root_saharan_modifier_desc:0 "Các thương nhân ngoại giáo bị cấm sở hữu tài sản hoặc lưu trú lâu dài ở đây."
  local_recession_epicentre_saharan_modifier:0 "Trung Tâm Suy Thoái Địa Phương"
  local_recession_epicentre_saharan_modifier_desc:0 "Việc trục xuất thương nhân ngoại giáo đã làm tê liệt kinh tế địa phương."
  local_recession_ripple_saharan_modifier:0 "Suy Thoái Lan Tỏa"
  local_recession_ripple_saharan_modifier_desc:0 "Việc bãi bỏ một tuyến thương mại gần đó đã làm tổn hại nền kinh tế của hạt này."
  integrated_foreign_trader_enclaves_saharan_modifier:0 "Thương Nhân Ngoại Giáo Hòa Nhập"
  integrated_foreign_trader_enclaves_saharan_modifier_desc:0 "Các thương nhân ngoại giáo đã trở thành một phần của xã hội địa phương."
  overtaxed_merchant_enclaves_saharan_modifier:0 "Thương Nhân Ngoại Giáo Bị Đánh Thuế Nặng"
  overtaxed_merchant_enclaves_saharan_modifier_desc:0 "Các thương nhân ngoại giáo bị đánh thuế tàn nhẫn ở hạt này, làm phiền đối tác của họ."
  ecstatic_converts_saharan_modifier:0 "Người Cải Đạo Hân Hoan"
  ecstatic_converts_saharan_modifier_desc:0 "Đám đông hân hoan trong hạt này vui mừng với sự cứu rỗi của họ."
  persecuted_converts_saharan_modifier:0 "Người Cải Đạo Bị Ngược Đãi"
  persecuted_converts_saharan_modifier_desc:0 "Đám đông chống đối trong hạt này âm mưu trốn thoát khỏi chủ nhân hà khắc."
  enthusiastic_nomad_settlement_saharan_modifier:0 "Định Cư Du Mục Nhiệt Huyết"
  enthusiastic_nomad_settlement_saharan_modifier_desc:0 "Các bộ lạc sa mạc đang đổ xô đến hạt này."
  nomad_settlement_saharan_modifier:0 "Định Cư Du Mục"
  nomad_settlement_saharan_modifier_desc:0 "Các bộ lạc sa mạc đang đổ xô định cư tại hạt này."
  upset_local_nomads_saharan_modifier:0 "Du Mục Bất Khả Khuất Phục"
  upset_local_nomads_saharan_modifier_desc:0 "Các bộ lạc sa mạc địa phương đang cướp đường và gây rối lớn."
  lord_defeated_slavers_modifier:0 "Chúa Địa Phủ Đánh Bại Bọn Nô Lệ"
  lord_defeated_slavers_modifier_desc:0 "Chúa anh hùng của hạt này đã đánh bại bọn nô lệ cướp bóc!"
  lord_complicit_with_slavers_modifier:0 "Chúa Địa Phủ Hợp Tác Với Bọn Nô Lệ"
  lord_complicit_with_slavers_modifier_desc:0 "Chúa tham lam của hạt này đã bán đứng dân địa phương cho bọn nô lệ cướp bóc."
  utterly_unphased_modifier:0 "Hoàn Toàn Không Bận Tâm"
  utterly_unphased_modifier_desc:0 "Dù chuyện gì tồi tệ xảy đến với thần dân, nhân vật này cũng không bận tâm."
