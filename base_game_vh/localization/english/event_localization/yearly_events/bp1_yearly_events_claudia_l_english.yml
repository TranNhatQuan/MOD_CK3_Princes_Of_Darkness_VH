l_english:
 #A New Hobby
  bp1_yearly.1000.t:0 "Sở Thích Mới"
  bp1_yearly.1000.desc:0 "Người bạn thân nhất của ta, [friend.GetTitledFirstName], tiến lại gần ta với một nụ cười rạng rỡ trên khuôn mặt của [friend.GetHerHis].\n\n"Người bạn chí cốt của ta, cuối cùng chúng ta cũng gặp được nhau! Ta cảm thấy dạo này chúng ta chẳng bao giờ dành thời gian chất lượng cho nhau cả... Có lẽ, ngươi sẽ sẵn lòng thử điều gì đó mới mẻ cùng ta chứ? Ta biết một thứ có thể giúp ngươi thư giãn tâm trí, phục hồi cơ thể và vực dậy tinh thần của ngươi đấy!""
  bp1_yearly.1000.desc_cannibal:0 "\n\n"Sao ngươi không đến nhà ta dùng bữa? Ta có một mẻ thịt #EMP đặc biệt#! tươi như ngươi chưa từng nếm — thịt #EMP cấm#!, nếu ngươi hiểu ý ta...""
  bp1_yearly.1000.desc_deviant:0 "\n\n"Ngươi nên cùng ta tham gia #EMP những cuộc thám hiểm#! vào một đêm nào đó! Không gì sảng khoái hơn việc tìm niềm vui trong những điều nhỏ nhặt... Hoặc #EMP lớn lao#! nếu ngươi thích... Ngươi thấy sao về #EMP [friend.Custom('DeviantObjectPlural')]#!?""
  bp1_yearly.1000.desc_witch:0 "\n\n"Sao ngươi không cùng ta đi dạo đêm? Ta biết mọi phép bí mật để thu hút vận may, bẫy cái chết, kiểm soát tình yêu, và hút vàng; ta rất #EMP mong muốn#! dạy tất cả cho ngươi!""
  bp1_yearly.1000.desc_hashish:0 "\n\n"Khi căng thẳng và trách nhiệm đè nặng, ta có công thức hoàn hảo để bỏ lại tất cả phiền muộn! Ngươi đã từng thử #EMP bánh đặc biệt#! của ta chưa?""
  bp1_yearly.1000.desc_drunkard:0 "\n\n"#EMP [ROOT.Char.Custom('RegionalAlcoholicDrink')|U]#!!! Bạn ta, hãy cùng uống xua đi nỗi buồn! Ly này nối tiếp ly khác là liều thuốc tốt nhất!""
  bp1_yearly.1000.desc_reveler:0 "\n\n"Một đêm vui chơi trọn vẹn! Ăn, uống, hát, nhảy múa, và vui vẻ; đó là thứ ngươi cần! Đi cùng ta!""
  bp1_yearly.1000.desc_hunter:0 "\n\n"Yên lặng của rừng và sự hứng khởi của săn bắn chắc chắn khiến ngươi cảm thấy tốt hơn! Chúng chưa bao giờ làm ta thất vọng, và ta thực sự muốn chia sẻ niềm đam mê này với ngươi.""
  bp1_yearly.1000.desc_confider:0 "\n\n"Theo kinh nghiệm của ta, không gì đem lại an ủi hơn việc chia sẻ nỗi buồn với người thân. Nếu ngươi cảm thấy quá tải, hãy nhớ rằng luôn có thể nói chuyện với ta. Ngươi sẽ cảm thấy tốt hơn — ta hứa!""
  bp1_yearly.1000.desc_athletic:0 "\n\n"Hoạt động thể chất luôn là câu trả lời! Ra mồ hôi để xua tan nỗi đau! Khiến cơ bắp kêu lên thật lớn để ngươi chẳng nghe thấy suy nghĩ mình! #EMP TRÀN ĐẦY GIẬN DỮ#! Gặp ta trong sân, ta sẽ chỉ ngươi!""
  bp1_yearly.1000.desc_fallback_1:0 "\n\n"Câu cá thì sao? Sự tĩnh lặng của thiên nhiên xung quanh, chỉ có ngươi, con mồi, đồ uống ngon, và Bạn Bè tốt...""
  bp1_yearly.1000.desc_fallback_2:0 "\n\n"Đi chợ địa phương thì sao? Nhìn mọi người bận rộn trong khi ngươi thong thả dạo chơi khá dễ chịu, và ngươi có thể tìm được thứ gì đó thú vị để mua!""
  bp1_yearly.1000.desc_fallback_3:0 "\n\n"Có một nhạc sĩ lang thang nổi tiếng trong thị trấn, sao không đi xem biểu diễn? Ta chắc chắn sẽ thú vị!""
  bp1_yearly.1000.a1:0 "Chúng ta đang nghĩ đến cùng một loại thịt #EMP đặc biệt#! chứ?"
  bp1_yearly.1000.a:0 "Tất nhiên, ta sẽ thử vì ngươi!"
  bp1_yearly.1000.a.tt:0 "[friend.GetShortUIName] dạy ngươi tất cả mẹo vặt"
  bp1_yearly.1000.a.tt.2:0 "Đã học mẹo!"
  bp1_yearly.1000.a.tt.3:0 "Ngươi bắt đầu hình thành thói quen"
  bp1_yearly.1000.b:0 "Nghe không #EMP hấp dẫn#! lắm với ta..."
  bp1_yearly.1000.b.tt:0 "Ngươi thà tập trung vào nhiệm vụ của mình."
  bp1_yearly.1000.c:0 "Ngươi #EMP dám#! sao!"
 #Holy Mediation
  bp1_yearly.1010.t:0 "Thiền Pháp Thánh"
  bp1_yearly.1010.desc:0 "Khi gặp Bạn ta, [friend.GetTitledFirstName], rời khỏi [friend.GetFaith.HouseOfWorship], rõ ràng ngay rằng [friend.GetSheHe] có điều gì muốn nói với Ta.\n\n"Người  Bạn củaTa! Ta đã cầu nguyện cho ngươi từ ngày ngươi bị loại khỏi cộng đồng tín hữu! Ta không thể ngừng lo lắng cho linh hồn ngươi... Ta thật sự muốn giúp ngươi nhiều hơn!\n\n"Ngươi có cho phép ta cầu xin [ROOT.Char.GetFaith.ReligiousHeadName] vì ngươi không? [pope.GetSheHe|U] có thể sẽ tha thứ cho những sai lầm trước đây của ngươi!""
  bp1_yearly.1010.a:0 "Làm ơn, thử đi, vì ta..."
  bp1_yearly.1010.a.success:0 "[friend.GetShortUIName] thuyết phục [pope.GetTitledFirstNameNoTooltip] bãi bỏ án trục xuất của ngươi"
  bp1_yearly.1010.a.success.tt:0 "Đã bãi bỏ trục xuất!"
  bp1_yearly.1010.a.failure:0 "[pope.GetTitledFirstNameNoTooltip|U] không bị thuyết phục"
  bp1_yearly.1010.a.failure.tt:0 "[ROOT.Char.GetFaith.ReligiousHeadName|U] không bị thuyết phục"
  bp1_yearly.1010.a.horrible_failure:0 "[pope.GetTitledFirstNameNoTooltip|U] cảm thấy bị xúc phạm"
  bp1_yearly.1010.a.horrible_failure.tt:0 "[ROOT.Char.GetFaith.ReligiousHeadName|U] Bị xúc phạm!"
  bp1_yearly.1010.b:0 "Không cần thiết làm vậy."
 #A Friend till the End
  bp1_yearly.1020.t:0 "Bạn Thân Đến Cuối"
  bp1_yearly.1020.desc_intro:0 "Khi Ta nằm trên giường, nguyền rủa cơ thể yếu đuối, suy nhược, Ta chỉ mơ hồ thấy bóng người tiến đến. Bước đi chậm và im lặng nặng nề của họ bắt đầu làm Ta sợ hãi."
  bp1_yearly.1020.desc:0 "Họ phải đoán được sự lo lắng của Ta từ những âm thanh nhỏ thoát ra từ miệng và cử động giật giật của tay Ta, bởi bước chân họ vội vã, và sớm một bàn tay ấm nắm lấy tay Ta, khuôn mặt quen thuộc xuất hiện trong tầm nhìn.\n\n"Im đi, [ROOT.Char.GetFirstNameNoTooltip], chỉ là ta đây, [friend.GetFirstName]. Ôi, đau lòng làm sao khi thấy ngươi thế này... Ta ước mình có thể làm gì đó, #EMP bất cứ điều gì#!, để giảm bớt khó chịu của ngươi.""
  bp1_yearly.1020.a:0 "Xin hãy ở bên ta..."
  bp1_yearly.1020.b:0 "Ta không muốn ngươi thấy ta như thế này."
  bp1_yearly.1021.desc:1 "Ta vẫn thấy tất cả những khoảnh khắc vui vẻ đã chia sẻ với [friend.GetFirstName]. Giờ, khi bước vào căn phòng ánh sáng mờ và thấy thân hình yếu ớt của [friend.GetHerHis] nằm trên giường, gần như bất động, Ta biết chắc những ngày đó sẽ không trở lại, và cảm thấy nỗi buồn sâu sắc.\n\n[friend.GetSheHe|U] nghe thấy Ta bước vào và dường như bối rối, nên Ta nhanh chóng đến bên [friend.GetHerHis].\n\n"Ta đây, người Bạn Thân [ROOT.Char.GetFirstNameNoTooltip]! Ta đến rồi.""
  bp1_yearly.1021.desc_bestie:0 "Trong chốc lát, [friend.GetFirstNameNoTooltip] dường như nhận ra Ta, và ra hiệu để Ta tiến gần hơn."
  bp1_yearly.1021.desc_token:0 ""Cầm lấy... cái này..." [friend.GetSheHe] thì thầm. Ta gật đầu và cầm lấy thứ [friend.GetSheHe] đưa. Ta tự hứa sẽ trân trọng nó như kỷ niệm về [friend.GetFirstNamePossessiveNoTooltip]."
  1021_trinket_desc:0 "[new_trinket.GetDesc]\n\n[bestie.GetTitledFirstNameNoTooltip|U] đã truyền lại nó cho người bạn thân nhất của [bestie.GetHerHis] là [ROOT.Char.GetTitledFirstNameNoTooltip] trên giường bệnh lâm chung của [bestie.GetHerHis]."
  bp1_yearly.1021.desc_secret:0 ""Có một điều... ta chưa từng nói với ngươi..." [friend.GetSheHe] thì thầm vào tai Ta. Mắt Ta mở to khi nghe sự thật."
  bp1_yearly.1021.desc_misery:0 ""Xin hãy, buông ta ra..." [friend.GetSheHe] thì thầm."
  bp1_yearly.1021.desc_end:0 "Chỉ là khoảnh khắc thoáng qua; sau đó, mắt [friend.GetFirstNamePossessiveNoTooltip] lại mờ đục."
  bp1_yearly.1021.a:0 "Ta sẽ ở bên ngươi."
  bp1_yearly.1021.b:0 "Ta không thể nhìn ngươi thế này. Xin tha lỗi."
  bp1_yearly.1021.c:0 "An nghỉ, người Bạn Thân [friend.GetFirstNameNoTooltip]."
 #Till the Bitter End
  bp1_yearly.1030.t:0 "Đến Cuối Đắng Cay"
  bp1_yearly.1030.desc:1 "\n\n"HA! Nhìn lại ngươi bây giờ đi! Chẳng còn đáng sợ như xưa nữa rồi, phải không? Ngươi thậm chí có nhận ra ta không, đồ [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] kia? Chính là ta, [rival.GetFirstName] đây! Ôi, ta đã khao khát được chứng kiến ngươi bị hạ thấp đến mức này biết bao!""
  bp1_yearly.1030.desc_nemesis:0 "\n\n"Không, ta không hề" [nemesis.GetSheHe] đáp lời. Ta thậm chí còn chưa kịp nhận ra tia sáng nguy hiểm trong đôi mắt của [nemesis.GetHerHis] trước khi [nemesis.GetFirstNameNoTooltip] đã ở bên giường bệnh của ta, một nụ cười lạnh tanh hiện rõ trên khuôn mặt của [nemesis.GetHerHis]."
  bp1_yearly.1030.desc_nemesis_guard:0 "Ta đã mất hết hy vọng khi [GetCourtPositionType('bodyguard_court_position').GetName()] của Ta, [guard.GetFirstName], lao vào phòng!"
  bp1_yearly.1030.desc_nemesis_no_guard:0 "Ta cố gắng di chuyển, trốn, la hét, #EMP bất cứ điều gì#!, nhưng cơ thể yếu ớt đã ngừng nghe Ta từ lâu..."
  bp1_yearly.1030.desc_rival:1 "[rival.GetHerHis|U] tiếng cười cay đắng gợi lại vài ký ức khó chịu trong tâm trí Ta, nhưng sương mù nhanh chóng bao phủ chúng trở lại. Ta không nhớ nổi tại sao chúng Ta ghét nhau đến vậy."
  bp1_yearly.1030.a:0 "Ngươi biết không? #EMP Ta tha thứ cho ngươi#!."
  bp1_yearly.1030.b:0 "#EMP RỜI ĐI NGAY!#!"
  bp1_yearly.1030.c:0 "...#EMP giúp đỡ#!..."
  bp1_yearly.1030.c_saved_guard:0 "[guard.GetShortUIName] giết kẻ mưu sát"
  bp1_yearly.1030.c_saved_guard.tt:0 "[guard.GetShortUIName] đã cứu ngươi!"
  bp1_yearly.1030.c_barely_saved_guard:0 "[guard.GetShortUIName] vừa kịp cứu ngươi"
  bp1_yearly.1030.c_barely_saved_guard.tt:0 "[guard.GetShortUIName] vừa cứu ngươi!"
  bp1_yearly.1030.c_killed_guard:0 "[guard.GetShortUIName] cứu ngươi nhưng tử trận"
  bp1_yearly.1030.c_killed_guard.tt:0 "[guard.GetShortUIName] cứu ngươi nhưng đã chết!"
  bp1_yearly.1030.c_killed_all:0 "Ngươi và [GetCourtPositionType('bodyguard_court_position').GetName()] của ngươi đều tử trận"
  bp1_yearly.1030.c_saved:0 "Ngươi thành công đẩy lùi kẻ tấn công"
  bp1_yearly.1030.c_saved.tt:0 "Ngươi đã đẩy lùi kẻ tấn công!"
  bp1_yearly.1030.c_killed:0 "Ngươi đã tử trận"
  bp1_yearly.1031.desc:0 "Kể từ khi nghe tin về bệnh tật của [rival.GetTitledFirstNamePossessive], Ta không tìm thấy bình yên. Ta chỉ cần nhìn tận mắt. Giờ đây, chứng kiến cơ thể yếu ớt của [rival.GetHerHis] nằm gần như bất động trên giường, bám víu mạng sống bằng chút sức lực còn lại, Ta cảm thấy bùng lên nhiều cảm xúc trái ngược."
  bp1_yearly.1031.desc_nemesis:0 "Liệu dễ hơn nếu buông bỏ tất cả nỗi đau và giận dữ không? Nhưng [nemesis.GetFirstNameNoTooltip] chưa bao giờ yếu ớt hay phơi bày như vậy... Yếu ớt đến mức Ta có thể #EMP bẻ gãy#! [nemesis.GetHerHim] bằng tay trần..."
  bp1_yearly.1031.desc_rival:0 "\n\n"Ngươi thậm chí có nhận ra ta không, đồ [rival.Custom2('InsultNoun', ROOT.Char)] [rival.Custom2('InsultAdjective', ROOT.Char)]?" Khuôn mặt của [rival.GetHerHis|U] dường như co rúm lại trong chốc lát, và đôi mắt của [rival.GetHerHis] đảo quanh như đang tìm kiếm điều gì đó nhưng chưa bao giờ tập trung vào ta."
  bp1_yearly.1031.desc_guard:0 "Trong khi Ta đang mải suy tư, Ta chú ý thận trọng vào ánh mắt lạnh lùng của [nemesis.GetFirstNamePossessiveNoTooltip] [GetCourtPositionType('bodyguard_court_position').GetName()], [guard.GetTitledFirstName], nhìn Ta từ góc phòng."
  bp1_yearly.1031.a:0 "Mọi thứ giờ có vẻ vô nghĩa quá phải không?"
  bp1_yearly.1031.b:0 "Ngươi nhận được những gì đáng lẽ."
  bp1_yearly.1031.c:0 "#EMP Yếu ớt... quá...#!"
  bp1_yearly.1031.c.tt:0 "Nhưng trước hết phải loại bỏ vệ sĩ!"
  bp1_yearly.1031.c_killed_all:0 "Ngươi giết cả [nemesis.GetShortUIName] và [nemesis.GetHerHis] [GetCourtPositionType('bodyguard_court_position').GetName()] [guard.GetShortUIName]"
  bp1_yearly.1031.c_killed_all.tt:0 "Ngươi thành công!"
  bp1_yearly.1031.c_killed_guard:0 "Ngươi chỉ làm [nemesis.GetShortUIName] bị thương nhưng giết [guard.GetShortUIName]"
  bp1_yearly.1031.c_failed.tt:0 "Ngươi thất bại trong vụ ám sát!"
  bp1_yearly.1031.c_barely_saved_guard:0 "Ngươi chỉ làm [nemesis.GetShortUIName] và [guard.GetShortUIName] bị thương"
  bp1_yearly.1031.c_saved_guard:0 "[guard.GetShortUIName] giết ngươi"
  bp1_yearly.1031.c_killed:0 "Ngươi giết [nemesis.GetShortUIName]"
  bp1_yearly.1031.c_saved:0 "[nemesis.GetShortUIName] đẩy lùi được ngươi"
 # Something in Common
  bp1_yearly.1040.t:0 "Điều Chung"
  bp1_yearly.1040.desc:0 "Ta đang thư giãn vui vẻ tại nhà tắm, chia sẻ những suy nghĩ sâu sắc và trò đùa trêu ghẹo với [new_friend.GetTitledFirstName]. Khi cảm nhận mọi căng thẳng rời khỏi cơ thể, Ta nhận ra rằng không chỉ là nước ấm giúp cơ bắp Ta thư giãn.\n\nTa thực sự đang tận hưởng! Và tất cả là nhờ có sự đồng hành của [new_friend.GetFirstNamePossessiveNoTooltip]."
  bp1_yearly.1040.desc_best_friend:0 "Ta đã coi [new_friend.GetHerHim] là một trong những người  Bạn củamình, nhưng Ta nhận ra rằng Ta thực sự mong đợi bất cứ lúc nào chúng Ta có thể ở bên nhau, Ta trân trọng ý kiến của [new_friend.GetHerHis] hơn tất cả, và mỗi khoảnh khắc với [new_friend.GetHerHim] đều tràn ngập tiếng cười và sự ấm áp.\n\nLiệu [new_friend.GetFirstNameNoTooltip] đã trở thành #EMP Bạn Thân nhất#! của Ta chưa?"
  bp1_yearly.1040.desc_friend:0 "Cho đến khi chúng Ta khám phá ra niềm đam mê chung với nhà tắm, chúng Ta chưa có cơ hội thực sự tương tác hay hiểu nhau. Giờ đây, Ta thực sự mong chờ những cuộc hẹn thường xuyên ở đó, vì chúng luôn tràn ngập tiếng cười và niềm vui!\n\nChúng Ta thực sự đã trở thành #EMP Bạn Bè#! chưa?"
  bp1_yearly.1040.a:0 "Chính xác! Nâng ly cho [new_friend.GetFirstNameNoTooltip]!"
  bp1_yearly.1040.b:0 "Hay là thử một điều #EMP gì đó lớn hơn#!?"
  bp1_yearly.1040.b.tt:0 "Ai cũng biết rằng mối quan hệ tốt nhất dựa trên Tình bạn thật sự!"
  bp1_yearly.1040.c:0 "Ta không thực sự thích [new_friend.GetHerHim] #EMP đến mức đó#!..."
 # Annoying Company
  bp1_yearly.1050.t:0 "Công Ty Phiền Phức"
  bp1_yearly.1050.desc:0 "Ta đang ngâm mình thoải mái tại nhà tắm, cuối cùng cũng có chút thời gian nghỉ ngơi xứng đáng, thì một giọng nói chói tai từ đâu đó làm gián đoạn suy nghĩ yên bình của Ta.\n\n"Ngươi có thấy [ROOT.Char.GetHerHis]…? Và cái #EMP nhỏ xíu lố bịch…?" Ở xa hơn trong phòng, Ta nhìn thấy [new_rival.GetTitledFirstName] làm những cử chỉ khiếm nhã, xung quanh là đám kẻ nịnh nọt cười vang. Thật khó mà bỏ qua việc tất cả đều nhìn chằm chằm vào Ta."
  bp1_yearly.1050.desc_nemesis:0 "\n\nĐỦ RỒI!! Ta phát ớn với những trò vô lý của [new_rival.GetHerHis]! [new_rival.GetFirstNameNoTooltip] đã gây hấn với Ta quá lâu, và giờ [new_rival.GetSheHe] còn cố phá hỏng thời gian tắm của Ta?! Ta chưa từng gặp [new_rival.GetHerHim] nào như [new_rival.Custom2('InsultAdjective', ROOT.Char)] [new_rival.Custom2('InsultNoun', ROOT.Char)]! NGUYỀN RỦA NGƯƠI, [new_rival.GetFirstNameNoTooltip]!"
  bp1_yearly.1050.desc_rival:0 "\n\nTa gần như chưa biết [new_rival.GetHerHim], nhưng đã cảm thấy ghét [new_rival.GetHerHim]. Làm sao #EMP dám#! [new_rival.GetFirstNameNoTooltip] chế giễu Ta trước công chúng?! Ta sẽ không quên sự sỉ nhục này..."
  bp1_yearly.1050.a:0 "[new_rival.GetSheHe|U] sẽ phải trả giá cho chuyện này."
  bp1_yearly.1050.b:0 "Ta muốn [new_rival.GetHerHim] chết. #EMP NGAY BÂY GIỜ#!."
  bp1_yearly.1050.c:0 "Có lẽ Ta đang phản ứng quá mức..."
 # A Superstitious Mind
  bp1_yearly.1060.t:0 "Tâm Trí Mê Tín"
  bp1_yearly.1060.desc:0 "Lần cuối cùng ta nhìn thấy [friend.GetTitledFirstName], [friend.GetSheHe] đang lén lút vứt bỏ chiếc mũ màu vàng của ta vì "màu vàng là một màu xui xẻo đối với những người có xuất thân như ta". Lần trước đó, ta đã phải tháp tùng [friend.GetHerHim] đi một đường vòng dài đến lố bịch chỉ để né tránh một con mèo đen đang ngủ. "Nó xui xẻo lắm!" [friend.GetSheHe] bảo vậy. Ta thậm chí còn chẳng muốn nhớ lại cái lần [friend.GetSheHe] #EMP cứ ngỡ#! [friend.GetSheHe] đã đánh mất chiếc bùa may mắn của [friend.GetHerHis] nữa!\n\nTuy nhiên, khi ta bắt quả tang [friend.GetHerHim] đang vứt bỏ một nửa số muối quý giá của ta chỉ vì nó lỡ bị đổ ra ngoài, ta cảm thấy sự kiên nhẫn của mình đã cạn kiệt..."
  bp1_yearly.1060.a:0 "Nhưng nếu tất cả là #EMP thật#! thì sao?"
  bp1_yearly.1060.b:0 "Để ta chỉ cho ngươi thấy sai lầm."
  bp1_yearly.1060.b_persuaded:0 "Bạn thuyết phục [friend.GetShortUIName] từ bỏ những mê tín dị đoan của [friend.GetHerHis]"
  bp1_yearly.1060.b_persuaded.tt:0 "[friend.GetShortUIName] đã bị thuyết phục!"
  bp1_yearly.1060.b_not_persuaded:0 "[friend.GetShortUIName] không ấn tượng với lập luận của ngươi"
  bp1_yearly.1060.b_not_persuaded.tt:0 "[friend.GetShortUIName] Không bị thuyết phục!"
  bp1_yearly.1060.b_you_persuaded:0 "[friend.GetShortUIName] xoay ngược tình thế và thuyết phục ngươi"
  bp1_yearly.1060.b_you_persuaded.tt:0 "[friend.GetShortUIName] làm ngươi đổi ý!"
  bp1_yearly.1060.c:0 "#EMP Niềm tin báng bổ#!"
  bp1_yearly.1060.d:0 "Vớ vẩn!"
 # Bad Luck, X!
  bp1_yearly.1070.t:0 "Xui Xẻo, [rival.GetFirstNameNoTooltip]!"
  bp1_yearly.1070.desc:0 "Ta không thể không nhận thấy rằng tên [rival.GetTitledFirstName] đáng khinh bỉ là một kẻ [rival.GetWomanMan] vô cùng mê tín dị đoan. [rival.GetSheHe|U] sợ hãi những ngày xui xẻo, màu sắc xui xẻo, động vật xui xẻo, và thậm chí cả những cái cây xui xẻo! Vô tình nhìn thấy bóng của một con chim không đúng loại vào không đúng thời điểm có thể khiến [rival.GetHerHim] rơi vào trạng thái hoảng loạn tột độ suốt nhiều ngày liền.\n\nMặc dù việc tuân thủ nghiêm ngặt các nghi thức của [rival.GetHerHis] dường như mang lại cho [rival.GetHerHim] một cảm giác an toàn vô bờ bến, nhưng một sự sai lệch tối thiểu so với nó có thể gây ra những tác động lớn không thể lường trước đối với sự bình yên trong tâm trí của [rival.GetHerHis] — những tác động mà ta hoàn toàn có thể lợi dụng..."
  bp1_yearly.1070.a:0 "Khả năng thật sự vô tận..."
  bp1_yearly.1070.a.tt:0 "Kế hoạch này có thêm cơ hội thành công."
  bp1_yearly.1070.c:0 "Ta sẽ làm rối trí [rival.GetHerHis]!"
  bp1_yearly.1070.d:0 "Ta sẽ không hạ mình tới mức đó."
 # Dear Father, ...
  bp1_yearly.1080.opening:0 "[relative.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp1_yearly.1080.desc:0 "Kể từ khi Ta bị gả cho [spouse.GetTitledFirstName] độc ác, những ngày của Ta chỉ toàn khổ cực."
  bp1_yearly.1080.intoxicated:1 "[spouse.GetSheHe|U] lúc nào cũng say và gần như không hiện diện với chính [spouse.GetHerselfHimself]."
  bp1_yearly.1080.sexuality:1 "[spouse.GetSheHe|U] không hề che giấu nhu cầu tình dục không thể thỏa mãn của [spouse.GetHerHis] — ta đỏ mặt ngay khi vừa nghĩ đến những cuộc phiêu lưu tình ái dày đặc của [spouse.GetHerHis]!"
  bp1_yearly.1080.violence:1 "[spouse.GetSheHe|U] dường như thích thú khi thấy người khác đau khổ. Ngay cả thần dân của [spouse.GetHerHis] cũng bị khủng bố. Ta lo cho sự an toàn của mình."
  bp1_yearly.1080.reclusive:1 "[spouse.GetSheHe|U] ghê tởm việc giao du với con người, trốn tránh các trách nhiệm của [spouse.GetHerHis], và cũng ruồng bỏ luôn cả ta. Ta cảm thấy như thể mình đang kết hôn với một bóng ma vậy."
  bp1_yearly.1080.profligate:1 "Thói tiêu xài của [spouse.GetHerHis|U] vô độ và không hợp lý, vương quốc liên tục gần phá sản, và chúng Ta sống trong cảnh nghèo hèn!"
  bp1_yearly.1080.fallback:0 "Ta lo rằng mình không thể chịu đựng tính cách khó chịu và thói quen kinh tởm của [spouse.GetHerHis] lâu hơn..."
  bp1_yearly.1080.ending:0 "Xin đừng quên người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))] tận tụy của ngươi."
  bp1_yearly.1080.a:0 "Thật là #EMP quá đáng#!!"
  bp1_yearly.1080.a.success:0 "Ngươi thành công lén đưa [relative.GetShortUIName] về nhà"
  bp1_yearly.1080.a.failure:0 "[relative.GetShortUIName] thất bại trong việc thoát"
  bp1_yearly.1080.a.failure.tt:0 "Thoát của [relative.GetFirstNamePossessiveNoTooltip] thất bại"
  bp1_yearly.1080.b:0 "Chúng ta không thể phá vỡ liên minh vì chuyện này."
  bp1_yearly.1080.c:0 "Xin hãy kiên nhẫn..."
  bp1_yearly.1080.d:0 "KHÔNG THỂ THA THỨ!"
  bp1_yearly.1080.d.success:0 "Ngươi thuyết phục [spouse.GetShortUIName] để [relative.GetShortUIName] ra đi"
  bp1_yearly.1080.d.failure:0 "[spouse.GetShortUIName] phớt lờ yêu cầu của ngươi"
  bp1_yearly.1080.d.failure.tt:0 "[relative.GetFirstNameNoTooltip] không được thả"
  bp1_yearly.1081.t:0 "Chào Mừng Về Nhà!"
  bp1_yearly.1081.desc:0 "Ta gần như không tin vào mắt mình khi [relative.GetTitledFirstName], người [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))] thân yêu của Ta, cuối cùng được đưa trở về [ROOT.Char.Custom('GetRoom')]. Kế hoạch của Ta thành công, và [relative.GetSheHe] cuối cùng cũng thoát khỏi tay [spouse.Custom2('InsultAdjective', ROOT.Char)] [spouse.Custom2('InsultNoun', ROOT.Char)], [spouse.GetTitledFirstName]!\n\nKhi Ta ra hiệu cho [relative.GetHerHim] ngồi bên lò sưởi, Ta nhận ra họ vẫn còn kết hôn... Ta tự hỏi liệu còn điều gì khác Ta có thể làm, hay chỉ cần thấy [relative.GetHerHim] an toàn và bình yên bên Ta."
  bp1_yearly.1081.a:0 "Hãy ly hôn ngay, #EMP bây giờ#!."
  bp1_yearly.1081.b:0 "Kể cho ta nghe mọi khổ đau của ngươi..."
  bp1_yearly.1081.c:0 "#EMP Cho đến khi cái chết chia lìa#!, ngươi đã nói...?"
  bp1_yearly.1082.desc:0 "Gần đây, Ta phát hiện rằng [spouse.GetWifeHusband] [spouse.GetFirstName] — [spouse.Custom2('InsultAdjective', SCOPE.sC('relative'))] [spouse.Custom2('InsultNoun', SCOPE.sC('relative'))] — còn một bí mật bẩn thỉu khác! Ta chưa quên ngươi đã giúp Ta thoát khỏi cuộc hôn nhân bất hạnh; như một dấu hiệu biết ơn, Ta quyết định chia sẻ điều này với ngươi. Không nhiều, nhưng hy vọng hữu ích."
  bp1_yearly.1082.a:0 "Tuyệt vời..."
