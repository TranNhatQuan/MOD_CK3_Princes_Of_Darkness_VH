l_english:
  varangian_arrived.title:0 "Một Varangian Mới"
  varangian_arrived.desc:0 "[varangian_candidate.GetShortUIName|U] đã gia nhập Đội Vệ binh Varangian"

  varangian.0002.t:0 "Đội Vệ binh Varangian"
  varangian.0002.opening:0 "Khi [varangian_candidate.Custom2('MyCharacterIntroduction', ROOT.Char )] đến gặp ta với kế hoạch của [varangian_candidate.GetHerHis], [varangian_candidate.GetSheHe] dường như đã hạ quyết tâm từ trước rồi.\n\n"Phục vụ cùng ngự lâm quân Varangian ở"
  varangian.0002.miklagard:0 "Miklagard"
  varangian.0002.elsewhere:0 "vệ binh Hoàng đế"
  varangian.0002.end:0 "sẽ mang lại cả của cải lẫn vinh quang!"\n\nTa không thể phủ nhận phần này, nhưng ta có thể từ chối yêu cầu của [varangian_candidate.GetHerHis]. Mặt khác, có đúng không nếu cản trở ai đó trong hành trình tìm kiếm vinh quang?"
  varangian.0002.a:0 "Đi đi, với phước lành của [ROOT.Char.GetFaith.WarGodNamePossessive]!"
  varangian.0002.b:0 "Không, ta cấm! Ngươi cần ở lại đây."

  varangian.1002.t:0 "Trở về từ Đội Vệ binh Varangian"
  varangian.1002.opening:0 "Ta suýt chút nữa đã không nhận ra [returning_varangian.Custom2('MyCharacterIntroduction', ROOT.Char )] khi [returning_varangian.GetSheHe] xuất hiện tại [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'great_hall')] của ta."
  varangian.1002.new_partner:0 "Và chắc chắn ta cũng không nhận ra [partner.GetWomanMan] bên cạnh [returning_varangian.GetHerHis]!"
  varangian.1002.ending:0 "\n\n"Ta đã trở lại rồi đây, [returning_varangian.Custom2('RelationToMeShort', ROOT.Char )]!" [returning_varangian.GetFirstNameNoTooltip] hét lớn. "Đã có rất nhiều lần ta ngỡ mình sẽ không bao giờ được nhìn thấy những người như ngươi nữa, nhưng cuối cùng ta đã trở về rồi."\n\nMặc dù thật kỳ lạ khi được gặp lại [ROOT.Char.Custom2('RelationToMeShort', returning_varangian )] của ta sau ngần ấy năm, ta không thể phủ nhận rằng mình bị ấn tượng bởi trang phục [emperor.GetCulture.GetNameNoTooltip] của [returning_varangian.GetHerHis], trang sức ngoại quốc của [returning_varangian.GetHerHis], cùng chiếc rương nặng trịch mà [returning_varangian.GetSheHe] đã mang theo cùng [returning_varangian.GetHerHim]."
  varangian.1002.a:0 "Chào mừng về nhà, [returning_varangian.GetFirstNameNoTooltip]!"

  varangian.3001.t:0 "Đội Vệ binh Varangian: Cái Chết Danh Dự"
  varangian.3001.desc:0 "[varangian.Custom2('MyCharacterIntroduction', ROOT.Char)] đã hy sinh khi phục vụ trong Đội Vệ binh Varangian!\n\nTa đã nhận được bức thư từ [emperor.GetTitledFirstName] ca ngợi tên tuổi [varangian.GetHerHis], và mô tả cách [varangian.GetSheHe] chiến đấu dũng cảm để cứu mạng [emperor.GetTitleAsNameNoTooltip] khỏi những kẻ ám sát tàn nhẫn.\n\nKhông gì có thể đem [varangian.GetFirstNameNoTooltip] trở lại, nhưng phần thưởng hậu tử bằng vàng từ [emperor.GetTitleAsNameNoTooltip] phần nào làm dịu nỗi buồn."
  varangian.3001.a:0 "Dũng cảm đến phút cuối, [varangian.GetFirstNameNoTooltip]..."
