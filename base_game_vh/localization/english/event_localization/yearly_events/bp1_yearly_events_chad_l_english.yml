l_english:

 # bp1_yearly_events_chad
  bp1_yearly.3001.t:0 "Một Người Ngài Thật Sự"
  bp1_yearly.3001.desc:0 "Tình hình tài chính quanh vùng [ROOT.Char.Custom( 'FortifiedBuilding' )] dạo gần đây có chút eo hẹp. Bất kể ta có thu bao nhiêu thuế đi chăng nữa, ta vẫn không tài nào thu chi cân đối nổi!\n\n[friend.GetTitledFirstNameNoTooltip], một [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] luôn làm tròn bổn phận, đã đến thăm ta trong chuỗi ngày đen đủi này. Khi chúng ta thảo luận về những rắc rối hiện tại của ta, [friend.GetSheHe] đề nghị tiếp tế cho ngân khố của ta bằng một khoản trợ cấp hậu hĩnh.\n\n[friend.GetFirstNameNoTooltip] nắm lấy tay ta và khẽ nói: "Hãy để ta giúp ngươi, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] của ta. Ta biết ngươi cũng sẽ làm điều tương tự cho ta mà thôi.""
  bp1_yearly.3001.a:0 "Hãy tán tụng [ROOT.Char.GetFaith.WealthGodName] cho bất ngờ vinh quang này!"
  bp1_yearly.3001.b:0 "Ta không thể bắt Ngài phải chịu khó."
  bp1_yearly.3001.c:0 "Điều Ta thực sự cần là vài ly rượu..."
  bp1_yearly.3001.c.tt:0 "Ngài và [friend.GetFirstNameNoTooltip] tiêu tiền cho Tình bạn và niềm vui"
  bp1_yearly.3001.d:0 "\"Ngươi không thể dư thêm chút nào sao?\""

  bp1_yearly.3002.t:0 "Ngài Trong Hoạn Nạn"
  bp1_yearly.3002.desc:0 "Khi Ta đến thăm [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], [friend.GetTitledFirstNameNoTooltip], Ta nhận thấy mọi thứ khác hẳn lần trước tại [friend.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\n[friend.GetSheHe|U] thường bày [friend.Custom('GetExpensiveDrink')] và [friend.Custom('GetExpensiveDessert')] khi Ta đến, nhưng hôm nay gần như chẳng còn gì, chỉ có nước trên bàn.\n\nTa hỏi [friend.GetFirstNameNoTooltip] liệu có đang khó khăn. [friend.GetSheHe] buồn bã trả lời: \"Ngươi chưa biết nửa thôi...\""
  bp1_yearly.3002.a:0 "Ta nên giúp nếu có thể."
  bp1_yearly.3002.b:0 "\"Vậy Ta nên đi thôi...\""
  bp1_yearly.3002.b.tt:0 "Bạn phớt lờ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] của mình trong lúc [friend.GetHerHis] hoạn nạn"
  bp1_yearly.3002.c:0 "Một đêm vui vẻ sẽ giúp [friend.GetHerHim] rất nhiều!"
  bp1_yearly.3002.c.tt:0 "Ngài và [friend.GetFirstNameNoTooltip] tham gia vào một buổi tối ăn chơi"
  bp1_yearly.3002.d:0 "Hãy xem sổ sách của ngươi..."
  bp1_yearly.3002.d.tt:0 "Hồ sơ tài chính được đưa ra để Ngài điều tra"

  bp1_yearly.3003.desc:0 "Ta bắt đầu rà soát các khoản chi tiêu gần đây của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] của ta là [friend.GetFirstNamePossessiveNoTooltip], cố gắng hết sức để xem điều gì có thể đã dẫn [friend.GetHerHim] vào tình cảnh tồi tệ như vậy. Ta lập tức phát hiện ra vấn đề:\n\nBinh lính: -1.8\nNhu yếu phẩm [friend.Custom('GetCourt')]: -3.2\n$court_physician_court_position$ Mới: -50\n#difficulty_hard Nến: -360 #!\nQuà cáp cho [friend.Custom('GetCourtierPlural')|U]: -15\n\n"Nến sao? Ngươi mắc nợ chỉ vì #EMP nến thôi sao?!#!"\n\n[friend.GetSheHe|U] ngượng ngùng đáp lời, "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] của ta, ngươi vốn là kẻ thông tuệ trong các vấn đề quản lý lãnh địa. Xin hãy giúp đỡ ta!""
  bp1_yearly.3003.a:0 "\"Ta sẽ giúp ngươi, nhưng chỉ lần này thôi...\""
  bp1_yearly.3003.b:0 "\"Tiêu ít cho nến đi.\""
 
  bp1_yearly.3004.t:0 "Tiếng Ồn Lạ"
  bp1_yearly.3004.desc:0 "Ta trở về [ROOT.Char.Custom('FortifiedBuilding')] sau một cuộc đi bộ dài, cô đơn. Một năm nữa trôi qua, một tuổi nữa lớn lên...\n\nHôm nay là sinh nhật Ta, [ROOT.Char.GetAge] tuổi. Càng lớn, Ta càng trân trọng các mối quan hệ đã vun đắp..."
  bp1_yearly.3004.spouse:0 "Thật buồn khi hôm nay Ta không nghe tin từ [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetPrimarySpouse)], [ROOT.Char.GetPrimarySpouse.GetFirstName], hay bất kỳ người Ngài nào.\n\n"
  bp1_yearly.3004.friends:0 "Thật buồn khi hôm nay Ta không nghe tin từ [friend1.GetTitledFirstName], [friend2.GetTitledFirstName], hay bất kỳ người Ngài nào khác.\n\n"
  bp1_yearly.3004.end:0 "Ta lê bước vào phòng, cô đơn khiến chân thêm nặng nề, khi nghe #EMP tiếng va chạm#! và tiếng thì thầm vang từ cuối hành lang."
  bp1_yearly.3004.a:0 "\"Đó là gì vào giờ này?\""
  bp1_yearly.3004.b:0 "\"Thoát nhanh nhất là gì? Leo ra cửa sổ!\""

  bp1_yearly.3005.t:0 "Chúc Mừng Sinh Nhật!"
  bp1_yearly.3005.desc:1 "Thật bất ngờ! Tất cả Bạn Bè thân thiết nhất tụ họp chúc Ta tốt lành khi bước sang tuổi mới. Cả một bàn đầy [ROOT.Char.Custom('GetExpensiveDessert')], #EMP món yêu thích của Ta!#! Ta đã nghĩ mọi người quên Ta.\n\nTa không thể tin [party_host.GetFirstName] bí mật sắp xếp điều này. Ta chẳng hề biết về một bất ngờ chu đáo như vậy.\n\nBạn ta [friend2.GetFirstName] đến, vất vả mang theo ba món quà gói đẹp. Luôn tinh nghịch, [friend2.GetSheHe] nói: \"Ta có ba món quà để lựa. Một sẽ là của ngươi, nhưng chọn món nào?\""
  bp1_yearly.3005.a:0 "\"Ta sẽ lấy món lớn nhất!\""
  bp1_yearly.3005.b:0 "\"Món vừa sẽ hoàn hảo.\""
  bp1_yearly.3005.c:0 "\"Cái tốt thường ở những gói nhỏ.\""
  bp1_yearly.3005.a.tt:0 "Ngài nhận được món quà lớn"
  bp1_yearly.3005.b.tt:0 "Ngài nhận được món quà vừa"
  bp1_yearly.3005.c.tt:0 "Ngài nhận được món quà nhỏ"
  bp1_yearly.3005.t.gift:0 "Nhận quà sinh nhật"
  bp1_yearly.3005.opinion.tt:0 "Ngài nhận #P 30#! [opinion|E] của mỗi [friend|E]"

  bp1_yearly.3006.t:0 "Nhớ Những Sinh Nhật Qua"
  bp1_yearly.3006.desc:0 "Khi bước sang tuổi mới hôm nay, Ta nhớ bữa tiệc sinh nhật tuyệt vời Bạn Bè [friend1.GetFirstName] và [friend2.GetFirstName] tổ chức vài năm trước. Thật vui khi cảm nhận sự ấm áp và Tình bạn hiện rõ!\n\n"
  bp1_yearly.3006.desc.friend1_dead:0 "[friend1.GetFirstName] đã qua đời và Ta tiếc nuối người Ngài tuyệt vời. [friend1.GetSheHe|U] luôn bên cạnh qua mọi khó khăn, không bao giờ thiếu nụ cười khi Ta buồn.\n\n"
  bp1_yearly.3006.desc.friend2_dead:0 "[friend2.GetFirstNameNoTooltip] đã qua đời và Ta tiếc nuối người Ngài tuyệt vời. [friend2.GetSheHe|U] luôn bên cạnh qua lúc vui buồn, mang lại nụ cười khi Ta buồn. Dù [friend2.GetFirstNameNoTooltip] đã mất, Ta trân trọng kỷ niệm về [friend2.GetHerHim].\n\n"
  bp1_yearly.3006.desc.artifact_positive:0 "Ta nhớ như mới hôm qua: chúng Ta ăn uống, nhảy múa và còn tặng Ta món quà tuyệt vời!\n\n"
  bp1_yearly.3006.desc.artifact_negative:0 "Ta nhớ như mới hôm qua: chúng Ta ăn uống, nhảy múa và tặng Ta quà. Nhưng sau đó mọi thứ trở nên tồi tệ giữa chúng Ta. Ký ức bị nhuốm bởi sự phản bội của [friend2.GetFirstNamePossessive].\n\n"
  bp1_yearly.3006.desc.artifact_exists:0 "Ta nghĩ vẫn còn giữ [old_bday_gift.GetName] đâu đó.."
  bp1_yearly.3006.a:0 "Thật ngọt ngào khi hồi tưởng kỷ niệm xưa."
  bp1_yearly.3006.b:0 "Ta sẽ không quên ngươi, Bạn ta."
  bp1_yearly.3006.c:0 "Đốt món quà đi và để Ta quên kẻ xấu xa đó!"
  bp1_yearly.3006.d:0 "Nguyền rủa hắn. Hy vọng hắn thối rữa dưới địa ngục."

  bp1_yearly.3007.t:0 "Nghệ Thuật Gia Đình"
  bp1_yearly.3007.desc:0 "Ta vừa hoàn tất công việc trong ngày tại [ROOT.Char.Custom('GetChamber')] của mình thì [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] của ta, [spouse.GetTitledFirstName], thong thả bước vào với đứa [spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] của [spouse.GetHerHis] là [inspired_family_member.GetFirstName] đang háo hức bám gót theo sau [spouse.GetHerHis]. Ta đặt cuốn sổ cái vừa đọc xuống, biết rõ chẳng có điều gì tốt đẹp có thể đến từ chuyến viếng thăm bất ngờ này.\n\n"
  bp1_yearly.3007.desc.tapestry:0 "[spouse.GetFirstNameNoTooltip] e dè nhận xét về đồ đạc [ROOT.Char.Custom('GetRoom')].\n\"Những bức tường trống rỗng này không khiến ngươi phát điên sao? Ta biết [ROOT.Char.Custom('GetRoom')] này cần gì: #EMP Tranh thêu!#\"\n\n\"[spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] #EMP tuyệt vời#! với kim chỉ.\""
  bp1_yearly.3007.desc.regalia:0 "[spouse.GetFirstNameNoTooltip] e dè nhận xét về diện mạo Ta.\n\"[spouse.Custom2('RelationToMeShort', ROOT.Char)], ngươi là [ROOT.GetCharacter.GetTitleAsNameNoTooltip|l] hùng mạnh, nhưng một số người chưa tôn trọng ngươi. Ngươi cần thứ gì đó để thể hiện quyền lực!\"\n\n\"[spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] có thể chế tác #EMP bộ regalia tuyệt vời#! phản ánh địa vị ngươi.\""
  bp1_yearly.3007.desc.conc:0 "Bảo trợ [inspired_family_member.GetHerHim] và xem tác phẩm của [inspired_family_member.GetHerHis] sẽ cải thiện tâm trạng ngươi!"
  bp1_yearly.3007.a.tapestry:0 "\"Ta cũng đang nghĩ vậy! Chỗ này thật tệ!\""
  bp1_yearly.3007.a.regalia:0 "\"Đã đến lúc Ta được tôn trọng!\""
  bp1_yearly.3007.b:0 "\"Chúng ta không có xu nào để chi cho xa xỉ phẩm...\""

  bp1_yearly.3100.t:0 "Một Thần Tử Giữa Bạn Bè"
  bp1_yearly.3100.desc:0 "Ngài [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('3100_courtier_liege'))] [3100_courtier_liege.GetTitledFirstName] đến thăm và mang theo một trong [3100_courtier_liege.GetHerHis] [3100_courtier_liege.Custom('GetCourtierPlural')]. [3100_courtier_liege.GetFirstNameNoTooltip] hớn hở nói:\n\"Chào [ROOT.Char.GetTitledFirstNameNoTooltip]! Thật vui khi thấy ngươi thịnh vượng ở [ROOT.Char.GetCapitalLocation.GetName]. Ta nghĩ [3100_target_courtier.GetFirstName] có thể giúp ích trong [ROOT.Char.Custom('GetCourt')].\""
  bp1_yearly.3100.desc.diplomacy:0 "[3100_target_courtier.GetSheHe|U] là nhà ngoại giao cực kỳ tài năng — ngôn từ mượt mà nhất!"
  bp1_yearly.3100.desc.intrigue:0 "[3100_target_courtier.GetSheHe|U] có nhiều mối quan hệ và cách giải quyết mọi việc... #EMP âm thầm#!"
  bp1_yearly.3100.desc.martial:0 "[3100_target_courtier.GetSheHe|U] là chiến lược gia cực kỳ tài năng! [3100_target_courtier.GetHerHis|U] luôn suy tính các chiến thuật."
  bp1_yearly.3100.desc.stewardship:0 "[3100_target_courtier.GetSheHe|U] là quản lý cực kỳ tài năng!"
  bp1_yearly.3100.desc.learning:0 "[3100_target_courtier.GetSheHe|U] là học giả cực kỳ tài năng — sáng nhất mà Ta từng học từ!"
  bp1_yearly.3100.desc.prowess:0 "[3100_target_courtier.GetSheHe|U] to khỏe như gấu và còn mạnh hơn nữa!"
  bp1_yearly.3100.desc.conc:0 "Bản thân ta cũng muốn trọng dụng [3100_target_courtier.GetHerHim], nhưng than ôi điều đó dường như bất khả thi.\n\nTa rất ghét phải nhìn thấy tài năng tuyệt vời của [3100_target_courtier.GetHerHis] bị lãng phí. Ngươi sẽ thu nhận [3100_target_courtier.GetHerHim] và khai phá tiềm năng của [3100_target_courtier.GetHerHis] chứ?""
  bp1_yearly.3100.a:0 "Ta biết chỗ thích hợp cho [3100_target_courtier.GetHerHim]!"
  bp1_yearly.3100.b:0 "Ta phải từ chối lịch sự."
  bp1_yearly_3100_courtier_gained:0 "[ROOT.Char.Custom('GetCourtier')] tài năng đã được chiêu mộ"

  bp1_yearly.3101.t:0 "Một Quận Giữa Bạn Bè"
  bp1_yearly.3101.desc:0 "[target_title_holder.GetTitledFirstName] đã đến gặp ta với một lời đề nghị to lớn. [target_title_holder.GetSheHe|U] biết rõ rằng ta sở hữu yêu sách chính đáng đối với vùng [target_title.GetName] và cuối cùng đã quyết định công nhận điều đó.\n\n"Người bạn của ta," ông ấy cất lời, "ta vô cùng mong muốn trao lại [target_title.GetNameNoTierNoTooltip] cho ngươi vì nó thuộc về ngươi. Tuy nhiên, ta không thể làm vậy mà không nhận lại được bất cứ thứ gì, bằng không ta sẽ phải trở về với bách tính của mình với đôi bàn tay trắng."\n\n"Hãy ban cho ta thứ gì đó để chứng minh với bách tính của ta khi ta trở về [target_title_holder.GetCapitalLocation.GetName], và vùng [target_title.GetNameNoTierNoTooltip] sẽ thuộc về ngươi.""
  bp1_yearly.3101.a:0 "\"Ta vui lòng nhận! Đủ rồi...\""
  bp1_yearly.3101.b:0 "\"Không thể nhận [target_title.GetNameNoTierNoTooltip] theo cách này.\""

  bp1_yearly.3201.opening:0 "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
  bp1_yearly.3201.desc:0 "Ta trân trọng mời ngươi dự tiệc tại [host.GetCapitalLocation.GetTitle.GetNameNoTier]! Sẽ là bữa tiệc hoành tráng với đồ ăn và giải trí thú vị."

  bp1_yearly.3202.t:0 "Bữa Tiệc Kẻ Ngốc"
  bp1_yearly.3202.desc:0 "Ta bước vào vùng [host.Custom( 'FortifiedBuilding' )] của [host.GetTitledFirstNamePossessiveNoTooltip] với kỳ vọng về một bữa tiệc linh đình, vui vẻ mà ta đã nhận được thư mời, nhưng ở đây chẳng có một ai cả! Sau một hồi tìm kiếm, ta thấy [host.GetFirstNameNoTooltip] cùng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enemy'))] của ta là [enemy.GetFirstNameNoTooltip] đang tán gẫu về chuyện gì đó mà có trời mới biết được.\n\nKinh ngạc trước sự xuất hiện đột ngột của ta, [host.GetFirstNameNoTooltip] quay về phía ta và chất vấn tại sao ta lại xuất hiện mà không báo trước.\n\n"Ta tưởng... ngài đã mời ta đến dự một bữa tiệc vào hôm nay... ?"\n\n[host.GetSheHe|U] giải thích rằng ta đã lầm và bắt đầu lên lớp giảng giải cho ta về lễ nghi cung đình. Trong khi đó, [enemy.GetFirstNameNoTooltip] không thể ngừng cười thầm một mình [enemy.GetHerselfHimself] khi ta hoàn toàn bị bêu rếu nhục nhã bởi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]."
  bp1_yearly.3202.a:0 "\"Xin lỗi, [host.GetTitledFirstNameNoTooltip]...\""
  bp1_yearly.3202.a.liege:0 "\"Xin lỗi, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]...\""
  bp1_yearly.3202.b:0 "\"Chắc [enemy.GetFirstNameNoTooltip] bày đặt!\""
  bp1_yearly.3202.b.success:0 "Ngài thuyết phục [host.GetTitledFirstNameNoTooltip] về trò gian xảo của [enemy.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.3202.b.failure:0 "Ngài thất bại trong việc thuyết phục [host.GetTitledFirstNameNoTooltip] về trò gian xảo của [enemy.GetFirstNamePossessiveNoTooltip]"
  bp1_yearly.3202.c:0 "\"Đã đến lúc chấm dứt trò chơi, [enemy.GetFirstNameNoTooltip].\""
  bp1_yearly.3202.c.tt:0 "#V Đấu#! [enemy.GetFirstName].\n#weak Cuộc đấu này KHÔNG tử chiến. Tuy có thể tử vong.#!\nNếu thắng, sự thật sẽ được hé lộ. Nếu thua, [enemy.GetFirstNameNoTooltip] thắng thật.\n\n[prowess|E] của Ngài: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] của [enemy.GetFirstNamePossessive]: [prowess_i]#V [enemy.GetProwess]#!"
  bp1_yearly.3203.sc_result_won:0 "Ngài thắng trong cuộc đấu với [sc_loser.GetTitledFirstNameNoTooltip]"
  bp1_yearly.3203.sc_result_lost:1 "Ngài thua trong cuộc đấu với [sc_victor.GetTitledFirstNameNoTooltip]"
  bp1_yearly.3204.sc_invalid:0 "Cuộc đấu với [enemy.GetTitledFirstNameNoTooltip] đã bị vô hiệu"

  bp1_yearly.3300.t:0 "Suy Ngẫm Về [ROOT.Char.GetFaith.HighGodName]"
  bp1_yearly.3300.desc:0 "Khi ngồi thiền về [ROOT.Char.GetFaith.GetName], Ta nhớ lại chuyến đi khi [pilgrimage_memory.GetDescription]. Chuyến đi xa lạ so với tiện nghi đời sống [ROOT.Char.GetTitleAsNameNoTooltip|l], nhưng niềm an ủi khi đến [pilgrimage_destination.GetName] khiến tất cả xứng đáng."
  bp1_yearly.3300.a:0 "Ta tin rằng sẽ mãi gần gũi [ROOT.Char.GetFaith.HighGodName]."

  bp1_yearly.3301.desc:0 "Khi ngồi thiền về [ROOT.Char.GetFaith.GetName], Ta nhớ lại chuyến đi khi [pilgrimage_memory.GetDescription]. Chuyến đi xa lạ so với tiện nghi đời sống [ROOT.Char.GetTitleAsNameNoTooltip|l], nhưng niềm an ủi khi đến [pilgrimage_destination.GetName] khiến tất cả xứng đáng.\n\nGần gũi [pilgrimage_friend.GetFirstName] là lợi ích thêm. Chúng Ta thực sự có thời gian quý giá bên nhau trong hành hương."
