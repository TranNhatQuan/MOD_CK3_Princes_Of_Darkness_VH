l_english:
  bp1_yearly.7000.t:0 "Bữa Sáng Với Người Ngài"
  bp1_yearly.7000.desc:1 "Ta đang đi đến [ROOT.Char.GetFaith.HouseOfWorship] thì gặp [ROOT.Char.Custom2('RelationToMeShort', distraction_friend)] [distraction_friend.GetTitledFirstName], người đang cầm một túi nhỏ. Liếc quanh, [distraction_friend.GetSheHe] bí mật mở túi ra, bên trong là đủ loại thức ăn và đồ uống.\n\n"Trời đẹp quá, ra ngoài cùng Ta cho một bữa sáng picnic nhé." [distraction_friend.GetSheHe|U] nói.\n\nKhi Ta bắt đầu phản đối rằng Ta đang đi đến [ROOT.Char.GetFaith.HouseOfWorship], [distraction_friend.GetFirstNameNoTooltip] ngắt lời Ta: \n\n"[ROOT.Char.GetFaith.HighGodName] sẽ còn đó sau, nhưng những [ROOT.Char.Custom('GetExpensiveDessert')] này thì không." "
  bp1_yearly.7000.a:0 "[ROOT.Char.GetFaith.HighGodName] quan trọng hơn bữa sáng."
  bp1_yearly.7000.b:0 "Tội thật sự là để cơ hội này trôi qua."
 
  lovely_picnic_modifier:0 "Picnic Dễ Thương"
  lovely_picnic_modifier_desc:0 "Đã đi picnic dễ thương."
 
  bp1_yearly.7001.t:0 "Đi Câu Cá"
  bp1_yearly.7001.desc:1 "[ROOT.Char.Custom2('RelationToMeShort', fishing_friend)] [fishing_friend.GetFirstName] chặn đường Ta, cười toe toét. Trong tay [fishing_friend.GetHerHis] là hai cần câu. \n\n"Hôm nay đi câu cùng Ta nhé, [fishing_friend.Custom2('RelationToMeShort', ROOT.Char)] thân mến. Ta hứa Ngài sẽ thích!" [fishing_friend.GetSheHe|U] reo lên.\n\nĐã lâu Ta chưa nghỉ ngơi và thoát khỏi nhịp sống nhộn nhịp của [ROOT.Char.Custom('FortifiedBuilding')]..."
  bp1_yearly.7001.a:0 "Ta sẽ bắt được cá chép trắng huyền thoại!"
  bp1_yearly.7001.b:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip] không #EMP 'câu cá'#!."
 
  bp1_yearly_7001.a.tt:1 "Ngài đi câu cá"
 
  bp1_yearly.7001.a.toast.good_time:1 "Ngài có một chuyến đi tuyệt vời"
  bp1_yearly.7001.a.toast.bad_time:1 "Ngài có một chuyến đi tệ"
  bp1_yearly.7001.a.toast.caught_fish:1 "Ngài bắt được một con cá khổng lồ"
  bp1_yearly.7001.a.toast.white_carp:1 "Ngài bắt được cá chép trắng huyền thoại"
 
 
  bp1_yearly.7002.t:0 "Tranh Cãi Phòng Riêng"
  bp1_yearly.7002.desc:1 "Vừa giải quyết xong nỗi buồn, ta thong thả tiến về phía cửa sổ và quan sát khoảng sân bên dưới.\n\nTâm trạng của ta trở nên tồi tệ khi thấy kẻ thù của mình, [chamberpot_rival.GetFirstName], đang rảo bước qua sân với một vẻ mặt tươi vui đầy tức mắt của [chamberpot_rival.GetHerHis]. Đôi mắt ta chợt đảo qua chiếc bô đầy bên cạnh giường, có lẽ ta có thể làm gì đó với tâm trạng tốt đẹp kia..."
  bp1_yearly.7002.a:0 "Coi chừng dưới kia!"
  bp1_yearly.7002.b:0 "Ta là người lớn, chuyện này dưới tầm Ta."
 
  bp1_yearly.7002.a.tt:0 "Ngài cố gắng đổ chậu nước lên họ"
 
  drenched_in_excrement_opinion:0 "Ngập trong phân"
  threw_excrement_opinion:1 "Gần như ngập trong phân"
 
  bp1_yearly.7002.a.toast.perfect_hit:0 "Trúng đích!"
  bp1_yearly.7002.a.toast.miss:0 "Trượt hoàn toàn!"
  bp1_yearly.7002.a.toast.chamberpot:0 "Ngài làm rơi chậu!"
  bp1_yearly.7002.a.toast.tripped:0 "Ngài trượt và tự phủ phân lên người!"
 
  bp1_yearly.7003.t:0 "Tấm Thảm"
  bp1_yearly.7003.desc:1 "Ta đang tìm kiếm [orgy_tapestry_maker.Custom2('MyCharacterIntroduction', ROOT.Char)], nhưng chẳng thấy [orgy_tapestry_maker.GetSheHe] đâu cả. Cuối cùng, ta xông vào phòng của [orgy_tapestry_maker.GetHerHis], nơi ta không tìm thấy #EMP [orgy_tapestry_maker.GetHerHim]#!... nhưng lại phát hiện ra một thứ vô cùng thú vị.\n\nCó vẻ như [orgy_tapestry_maker.GetSheHe] đang thêu một bức thảm mô tả một cuộc trác táng khá trần trụi. Ta ở đó, bị kẹp giữa [ROOT.Char.Custom2('RelationToMeShort', orgy_participant_1)] [orgy_participant_1.GetFirstName] của ta và [ROOT.Char.Custom2('RelationToMeShort', orgy_participant_2)] [orgy_participant_2.GetFirstName] của ta. Trong khi đó, [ROOT.Char.Custom2('RelationToMeShort', orgy_tapestry_maker)] của ta là [orgy_tapestry_maker.GetFirstNameNoTooltip] dường như đang có một khoảng thời gian tuyệt vời với [ROOT.Char.GetFaith.DevilName]. Ở một góc của bức thảm, [ROOT.Char.Custom2('RelationToMeShort', orgy_participant_3)] [orgy_participant_3.GetFirstName] của ta đang ngồi với một nụ cười đầy mê mẩn.\n\nTa hoàn toàn câm nín."
  bp1_yearly.7003.a:0 "Thật kinh tởm!"
  bp1_yearly.7003.b:0 "Ta #EMP phải#! treo cái này lên tường."
  bp1_yearly.7003.c:0 "Ta đi, ừ, nhầm đường."
 
  bp1_orgy_tapestry:0 "Tấm Thảm Ái Ân"
  bp1_orgy_tapestry_desc:0 "Tấm thảm này mô tả [orgy_participant_1.GetFirstName], [ROOT.Char.GetName], [orgy_participant_2.GetName], [orgy_participant_3.GetName] và [orgy_tapestry_maker.GetName] tham gia vào một cuộc ái ân. [ROOT.Char.GetFaith.DevilName] cũng tham gia."
 
  bp1_yearly.7004.t:0 "An Ủi Của Người Ngài"
  bp1_yearly.7004.desc:1 "Người Ngài [ROOT.Char.Custom2('RelationToMeShort', concerned_friend)] [concerned_friend.GetFirstName] tới khi Ta đang ngồi nhìn ra ngoài: "Ngài đã khác từ khi... từ khi chuyện đó xảy ra."\n\n[concerned_friend.GetSheHe|U] không nói ra nhưng Ta biết [concerned_friend.GetSheHe] ám chỉ khi [bad_memory.GetDescription].\n\n"Có lẽ Ngài cần ai đó để nói chuyện? Ta có thể là người đó," [concerned_friend.GetSheHe] tiếp tục nhẹ nhàng."
  bp1_yearly.7004.a:0 "Nghe hay đấy."
  bp1_yearly.7004.b:0 "Khó khăn của Ta là của riêng Ta."
 
  bp1_yearly.7005.t:0 "Một Lợi Ích Cho Ngài"
  bp1_yearly.7005.desc:0 "Người Ngài [borrowing_friend.GetName] tới rõ ràng muốn mượn gì đó. Cuối cùng Ta mệt mỏi với việc [borrowing_friend.GetHerHim] vòng vo và bắt buộc [borrowing_friend.GetSheHe] nói ra.\n\n"Ta hy vọng mượn [borrowed_artifact.GetName] của Ngài một tối, nhưng Ngài không được hỏi lý do..."\n\n[borrowing_friend.GetSheHe|U] rõ ràng xấu hổ với yêu cầu này. Không biết [borrowing_friend.GetSheHe] muốn dùng nó làm gì?"
  bp1_yearly.7005.a:0 "Có lẽ được."
  bp1_yearly.7005.b:0 "Không đời nào."
 
  bp1_yearly.7005.a.returned_artifact:0 "Đã trả đồ mượn."
 
  bp1_yearly.7006.t:0 "$bp1_yearly.7005.t$"
  bp1_yearly.7006.desc:0 "[borrowing_friend.GetName] tới với ánh mắt xuống. "Xin đừng giận".\n\nHọ dẫn Ta tới [borrowed_artifact.GetName] và Ta thấy nó hỏng nặng. \n\n"Xin lỗi, đó là tai nạn..." [borrowing_friend.GetFirstNameNoTooltip] trông thực sự buồn bã."
  bp1_yearly.7006.a:0 "Đúng là [borrowing_friend.Custom2('InsultNoun', ROOT.Char)]!"
  bp1_yearly.7006.b:0 "Tai nạn mà."
 
  bp1_yearly.7005.a.tt:0 "Đồ của Ngài có thể bị hỏng."
 
  bp1_yearly.7007.t:0 "$bp1_yearly.7005.t$"
  bp1_yearly.7007.desc:0 "[borrowing_friend.GetName] đã trả [borrowed_artifact.GetName]. Ta không chắc họ chỉ dọn sạch hay thực sự sửa, nhưng trông nó ấn tượng hơn bao giờ hết.\n\n"Hy vọng Ngài thích, Ta đã làm cả tối." [borrowing_friend.GetSheHe] nói, trông lo lắng."
  bp1_yearly.7007.a:0 "Tuyệt vời quá!"
  bp1_yearly.7007.b:0 "Ngài đã sửa [borrowed_artifact.GetNameNoTooltip] CỦA Ta?"
 
  didnt_trust_friend_opinion:0 "Không tin Ta."
  trusted_friend_opinion:0 "Tin Ta."
  forgave_me_opinion:0 "Tha thứ cho Ta."
  improved_artifact_opinion:0 "Cải thiện đồ của Ta."
  messed_with_artifact_opinion:0 "Đùa với đồ của Ta."
 
  bp1_yearly.7010.t:1 "Thử Thách Lòng Trung Thành"
  bp1_yearly.7010.desc:2 "Ta không thể ngừng nghĩ nơi [tested_friend.GetFirstNamePossessive] trung thành. Liệu [tested_friend.GetSheHe] là Ngài thật sự hay chỉ là kẻ xu nịnh?\n\nCó lẽ một thử nghiệm nhỏ sẽ làm Ta yên tâm...\n\nMột trong các đặc vụ của Ta, một bí mật giả, và một món quà giấu tên. Điều gì khiến [tested_friend.GetHerHim] phản bội niềm tin của Ta?"
  bp1_yearly.7010.a:1 "Ba mươi đồng bạc."
  bp1_yearly.7010.b:1 "Hai... không, #EMP ba#! người đẹp [tested_friend.Custom('AttractionWomanManMultiple')], sẵn sàng và tự nguyện."
  bp1_yearly.7010.c:1 "Hứa hẹn sự giàu có cho #EMP Ngài khác#! của [tested_friend.GetHerHis], [friends_friend.GetFirstNameNoTooltip]."
  bp1_yearly.7010.d:0 "Chuyện này dưới tầm Ta."
 
  bp1_yearly.7010.toast.betrayed:1 "[tested_friend.GetSheHe|U] phản bội Ngài"
 
  bp1_yearly.7010.toast.not_betrayed:1 "[tested_friend.GetSheHe|U] chứng minh lòng trung thành của [tested_friend.GetHerHis]"
 
  bp1_yearly.7010.a.tt:1 "Ngài nghĩ trung thành của [tested_friend.GetFirstNamePossessive] có thể mua được bằng vàng"
  bp1_yearly.7010.b.tt:1 "Ngài nghĩ [tested_friend.GetFirstName] sẽ chọn dục vọng hơn Tình bạn"
  bp1_yearly.7010.c.tt:1 "Ngài nghĩ [tested_friend.GetFirstName] quan tâm Tình bạn với [friends_friend.GetFirstNamePossessive] hơn Tình bạn với Ngài"
 
  bp1_yearly.7050.t:0 "Kẻ Thù Xưa"
  bp1_yearly.7050.desc:0 "Ta trở lại chiến trường, bùn dính vào ủng, mùi xác chết nồng nặc tấn công mũi, một lần nữa Ta sống lại ngày [war_memory.GetDescription].\n\nTa tỉnh dậy thở hổn hển, mồ hôi lạnh bám trên mặt."
  bp1_yearly.7050.desc.married:0 "[sleeping_spouse.GetFirstName] cựa quậy bên cạnh nhưng không tỉnh. Ta phải đối mặt với nỗi đau một mình."
  bp1_yearly.7050.desc.not_married:0 "Một mình trong phòng, Ta phải tự đối mặt với nỗi đau."
  bp1_yearly.7050.a:0 "Ta nên cố quên đi."
  bp1_yearly.7050.b:0 "Ta sẽ KHÔNG BAO GIỜ thua lần nữa!"
 
  vengeance_obsessed_modifier:0 "Ám Ảnh Trả Thù"
 
  bp1_yearly.7051.t:0 "Trận Chiến [battle_area.GetNameNoTooltip]"
  bp1_yearly.7051.desc:1 "Ta nhớ rõ ràng khi [battle_memory.GetDescription]. Đó là một trận chiến diễn ra ở [battle_area.GetTerrain.GetNameNoTooltip], một địa hình mà Ta hoàn toàn không chuẩn bị.\n\nKể từ đó Ta đã suy nghĩ lại, Ta tự tin rằng nếu trận chiến xảy ra hôm nay, Ta sẽ là một thủ lĩnh có năng lực hơn nhiều."
  bp1_yearly.7051.a:0 "Ta sẽ không để chuyện đó xảy ra lần nữa."
  bp1_yearly.7051.b:0 "Ta nên học cách linh hoạt."
 
  bp1_yearly.7052.t:0 "Một Câu Chuyện Về..."
  bp1_yearly.7052.desc:0 "Lửa rực sáng, đồ uống đã được dùng, và [story_friend.GetFirstName] đang gọi Ta kể chuyện.\n\nSuy nghĩ đầu tiên của Ta là một câu chuyện dân gian [ROOT.Char.GetCulture.GetNameNoTooltip] nổi tiếng, một tác phẩm kinh điển luôn làm người nghe thích thú.\n\nMặt khác, nếu Ta kể câu chuyện về chính đời mình, có lẽ về lần [story_memory.GetDescription]."
  bp1_yearly.7052.a:0 "Giữ nguyên truyền thống."
  bp1_yearly.7052.b:0 "Câu chuyện của riêng Ta!"
  bp1_yearly.7052.c:0 "Sao không cả hai nhỉ!"
 
  bp1_yearly.7053.t:0 "Ký Ức Trả Thù"
  bp1_yearly.7053.desc:0 "Khi đi qua thị trấn, cơn giận lại trỗi dậy, gần đây trong đầu Ta chỉ còn suy nghĩ về khi [bad_memory.GetDescription].\n\nTa phải trả thù [bad_memory_participant.GetFirstNameNoTooltip] bằng cách nào đó. Ta nhìn lên giá treo cổ trước mặt. Có lẽ nếu Ta hành động cẩn thận, [bad_memory_participant.GetSheHe] sẽ sớm treo ở đó."
  bp1_yearly.7053.a:0 "Ta sẽ trả thù."
  bp1_yearly.7053.b:0 "Ta phải cố quên đi."
 
  murder_memory_modifier:0 "Ký Ức Trả Thù"
  sex_memory_modifier:0 "Ký Ức Dục Vọng"
 
  bp1_yearly.7053.a.1:0 "Kế hoạch này sẽ có thêm cơ hội thành công."
 
  bp1_yearly.7054.t:0 "Quên Nhớ"
  bp1_yearly.7054.desc:0 ""[forgotten_memory.GetDescription]?" Ta hỏi đầy bối rối.\n\nĐứa [memory_child.Custom('GetDaughterSon')] [memory_child.GetFirstName] của ta đang nhìn ta đầy lo lắng. "Dĩ nhiên rồi! Người đã kể câu chuyện này rất nhiều lần rồi, người không nhớ sao?"\n\nSự thật là ta không nhớ. Các chi tiết gần đây ngày càng mờ nhạt, nhưng có lẽ thú nhận điều đó sẽ là một sự yếu đuối."
  bp1_yearly.7054.a:0 "À vâng, lỗi của Ta."
  bp1_yearly.7054.b:0 "Gần đây Ta quên nhiều quá."
 
  bp1_yearly.7055.t:0 "Ghi Lại Ký Ức"
  bp1_yearly.7055.desc.positive:0 "Một số khoảnh khắc phải được lưu giữ mãi mãi. Lần mà [recorded_memory.GetDescription] là một trong số đó. Một ký ức tuyệt vời như vậy phải được bảo tồn cho muôn đời."
  bp1_yearly.7055.desc.negative:0 "Một số khoảnh khắc phải được lưu giữ mãi mãi. Lần mà [recorded_memory.GetDescription] là một trong số đó. Có thể là ký ức đau đớn, nhưng ai đó phải truyền lại cho thế hệ sau."
  bp1_yearly.7055.desc.neutral:1 "Một số khoảnh khắc phải được lưu giữ mãi mãi. Lần mà [recorded_memory.GetDescription] là một trong số đó."
  bp1_yearly.7055.desc.alone_poor_skill:0 "Ta có thể không giỏi viết, nhưng với thời gian và nỗ lực, chắc chắn Ta có thể tự viết.\n\n"
  bp1_yearly.7055.desc.alone_good_skill:0 "Sự thành thạo ngôn ngữ [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] của Ta sẽ biến việc viết thành chuyện nhỏ.\n\n"
  bp1_yearly.7055.desc.blind:0 "Thật không may, sự mù lòa của Ta ngăn Ta tự viết được...\n\n"
  bp1_yearly.7055.desc.poet:0 "Nhà thơ triều đình của Ta, [poet.GetFirstName], có thể rất hữu ích. Sự thành thạo văn chương của [poet.GetHerHis|U] sẽ biến những lời thường thành nghệ thuật."
  bp1_yearly.7055.desc.friend:0 "Nhưng Bạn Thân Ta [friend.GetFirstName] viết tốt hơn Ta nhiều. Chắc chắn [friend.GetSheHe] sẽ giúp nếu Ta nhờ?"
 
  bp1_yearly.7055.desc.ending:1 "Tuy nhiên, việc tập hợp và minh họa một tập sách có thể nhanh chóng tốn kém..."
  bp1_yearly.7055.poet:0 "Nhà thơ [poet.GetFirstNameNoTooltip] sẽ viết lại!"
  bp1_yearly.7055.friend:0 "[friend.GetFirstNameNoTooltip] là một người Ngài thật sự."
  bp1_yearly.7055.high_skill:0 "Ta sẽ tự ghi lại."
  bp1_yearly.7055.a:1 "Ta sẽ tự ghi lại, nếu [ROOT.Char.GetFaith.HighGodName] phù hộ."
  bp1_yearly.7055.b:1 "Không còn thời gian cho việc này..."
 
  recorded_memory_character:0 "Ký Ức của [memory_participant.GetTitledFirstNameNoTooltip]"
  recorded_memory:1 "Ký Ức của [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]"
  recorded_memory_desc:1 "Cuốn sách này kể lại câu chuyện khi [recorded_memory.GetThirdPerspectiveDescription].\n\nSoạn bởi [ROOT.Char.GetFirstName]."
 
  bp1_yearly.7056.t:0 "Chiêu Thức Hăm Dọa"
  bp1_yearly.7056.desc:1 "Ta đưa [intimidation_target.GetFirstName] đến [ROOT.Char.Custom('GetDungeonPlural')] của mình, nơi ta bắt đầu kể cho [intimidation_target.GetHerHim] nghe những câu chuyện về những điều khủng khiếp ta đã làm với những kẻ dám ngáng đường ta.\n\n"Ta chắc rằng ngươi đã nghe về việc [intimidation_memory.GetDescription] rồi chứ." Ta nói với [intimidation_target.GetHerHim] đầy thích thú. "Đó mới chỉ là #EMP sự bắt đầu#! mà thôi."\n\nKhi ta cười thầm, đôi mắt của [intimidation_target.GetFirstNamePossessiveNoTooltip] mở to vì sợ hãi."
  bp1_yearly.7056.a:1 "Đừng lo, chỉ cần làm theo Ta và Ngài sẽ ổn..."
  bp1_yearly.7056.b:0 "Kể #EMP tất cả mọi người#! về Ta!"
 
  bp1_yearly.7057.t:0 "Sự Sướng Khoái Tôn Giáo"
  bp1_yearly.7057.desc:1 "Ta ngồi trong [ROOT.Char.GetFaith.HouseOfWorship], suy nghĩ bỏ qua lời [realm_priest.GetCouncilTitleFirstName] để nhớ về lần [sex_memory.GetDescription]. Kể từ đó, Ta nghĩ đến [sex_partner.GetHerHim] gần như hàng ngày."
 
  bp1_yearly.7057.desc.male:1 "\n\nThật không may, điều này gây ra một số tác dụng phụ khá rõ rệt. Có lẽ nếu Ta đặt [ROOT.Char.GetFaith.ReligiousText] đúng vị trí, Ta có thể che giấu vấn đề ngày càng lớn mà không ai phát hiện..."
 
  bp1_yearly.7057.desc.female:0 "\n\nThật không may, điều này gây ra một số tác dụng phụ... khá phiền phức."
  bp1_yearly.7057.a:1 "[sex_partner.GetNameNoTooltip] #EMP phải#! là của Ta..."
  bp1_yearly.7057.b:1 "Xua tan những suy nghĩ này!"
  bp1_yearly.7057.c:0 "Ở đâu tốt hơn để giải tỏa căng thẳng ngoài [ROOT.Char.GetFaith.HouseOfWorship]?"
 
  bp1_yearly.7057.a.tt:0 "Kế hoạch này sẽ có thêm cơ hội thành công."
 
  bp1_yearly.7058.t:0 "Thảm Họa Tạm Thời"
  bp1_yearly.7058.desc:1 "Tiếng chim hót buổi sáng đưa Ta tới cửa hàng, ánh sáng bình minh nhường chỗ cho bóng tối u ám của [ROOT.Char.Custom('GetRoom')]. Ta ngáp và duỗi người, bước chân trên sàn.\n\nKhi mắt Ta quen với bóng tối, một thảm họa ẩm thực hiện ra: lõi táo, vụn bánh rải rác, xương đã lọc sạch thịt. Mắt Ta sững sờ quét khắp [ROOT.Char.Custom('GetRoom')], nhưng đâu đâu cũng thấy dấu vết.\n\nĐột nhiên, ở góc, một #EMP ợ nhẹ# đầy thỏa mãn..."
  bp1_yearly.7058.glutton:0 "Ta còn thức ăn! Mở #EMP kho bí mật!#!"
  bp1_yearly.7058.a:1 "Ôi, cậu sẽ trả giá. Và nhiều hơn nếu cậu có."
  bp1_yearly.7058.b:0 "Nếu thích cửa hàng, Ngài sẽ #EMP thích#! [ROOT.Char.Custom('GetDungeon')]!"
  bp1_yearly.7058.c:1 "#EMP *Thở dài*#! Ta đãi... có lẽ vậy..."
  bp1_yearly.7030.t:0 "Niềm Vui Thể Xác"
  bp1_yearly.7030.desc:0 "[dead_friend_spouse.GetFirstName] đã suy sụp hoàn toàn kể từ khi [dead_friend.Custom('WifeHusband')] của [dead_friend_spouse.GetHerHis] là [dead_friend.GetFirstName] qua đời. [dead_friend_spouse.GetSheHe|U] đến thăm ta vào một buổi tối.\n\n"Ta cảm thấy thật cô đơn." [dead_friend_spouse.GetSheHe] nói, nhìn ta đầy khao khát. Ta tự nhắc nhở bản thân rằng [dead_friend.GetFirstNameNoTooltip] từng là một người bạn tốt của ta. \n\n"Người đã luôn an ủi ta rất nhiều." [dead_friend_spouse.GetSheHe] nói, khẽ cắn môi của [dead_friend_spouse.GetHerHis] một cách đầy khiêu gợi. [dead_friend.GetFirstNameNoTooltip] là bạn của ta.\n\n"Ta chỉ muốn cảm nhận một điều gì đó." [dead_friend_spouse.GetSheHe] thì thầm, nới lỏng các nút thắt ở phía trước y phục [dead_friend_spouse.Custom('GetUpperClothingArticle')] của [dead_friend_spouse.GetHerHis]. [dead_friend.GetFirstNameNoTooltip] #EMP đã từng#! là bạn của ta..."
  bp1_yearly.7030.a:1 "Chắc chắn [dead_friend.GetFirstNameNoTooltip] sẽ đồng ý..."
  bp1_yearly.7030.b:1 "Tỉnh lại đi, [dead_friend_spouse.GetFirstNameNoTooltip]!"
  
  bp1_yearly.7100.t:0 "Ghét Thành Thù"
  bp1_yearly.7100.desc:0 "Mới khoảnh khắc trước ta còn đang tận hưởng một chuyến đi dạo thú vị dưới ánh nắng quanh vùng [owned_county.GetName] thì khoảnh khắc sau ta đã lấm lem đầy chất thải và lăn lộn trong vũng bùn. Sau khi giận dữ lau sạch chất bẩn khỏi [ROOT.Char.Custom('EyeEyes')] của mình, ta dễ dàng tìm thấy thủ phạm.\n\n"[potential_nemesis.GetTitledFirstName] gửi lời chào đến ngài!" Tên tá điền thò đầu ra ngoài cửa sổ hét lớn trước khi tháo chạy khỏi hiện trường.\n\nĐầy thảm hại, ta cố gắng giặt một món y phục mà mình đặc biệt trân trọng ở một dòng suối gần đó, nhưng rõ ràng là nó đã không thể cứu vãn được nữa rồi."
  bp1_yearly.7100.a:0 "Giờ thì #EMP cá nhân...#!"
  bp1_yearly.7100.b:0 "Ta sẽ rửa sạch bằng máu [potential_nemesis.GetHerHis]!"
  bp1_yearly.7100.c:0 "Nhớ lời Ta, [potential_nemesis.GetFirstNameNoTooltip]: chuyện này sẽ trả giá."
  bp1_yearly.7100.d:0 "Trả thù là dưới tầm Ta..."
  bp1_yearly.7100.c.tt:0 "Con mèo yêu thích của [potential_nemesis.GetFirstNamePossessiveNoTooltip] đã đi quanh đây trước đó..."
  bp1_yearly.7100.e:0 "Ta sẽ để dành quần áo này cho... sau."
  focused_on_revenge_modifier:0 "Tập Trung Trả Thù"
  focused_on_revenge_modifier_desc:0 "Nhân vật này chỉ tập trung vào việc tiêu diệt kẻ thù, bỏ qua nhiều trách nhiệm khác."
  vengeful_opinion:0 "Thù Hận"
