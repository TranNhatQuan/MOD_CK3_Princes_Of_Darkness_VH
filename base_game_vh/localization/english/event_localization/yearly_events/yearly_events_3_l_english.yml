l_english:
  yearly.3001.t:0 "Một Cảnh Báo Hữu Ích"
  yearly.3001.desc:0 "Ta nhận được một bức thư từ [neighbor.GetName]. Nó nói rằng [vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] của Ta, đã xin hỗ trợ trong một mưu đồ chống lại Ta!\n\n'Không gì Ta trân trọng hơn lòng trung thành,' bức thư của [neighbor.GetFirstNamePossessive] viết, 'vì vậy Ta chia sẻ điều này với ngài.'"
  yearly.3001.friend_backs_neighbor:0 "\n\nMay mắn thay, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] của Ta, [friend.GetFirstName], có mặt để khuyên Ta. 'Ta đã nghi ngờ [vassal.GetFirstNameNoTooltip] từ lâu. Điều này càng củng cố nghi ngờ đó.'"
  yearly.3001.friend_backs_vassal:0 "\n\nMay mắn thay, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] của Ta, [friend.GetFirstName], có mặt để khuyên Ta. 'Ta từ chối tin rằng [vassal.GetFirstNameNoTooltip] sẽ hạ mình đến mức đó.'"
  yearly.3001.a:0 "Ta sẽ trực tiếp đối chất với [vassal.GetFirstNameNoTooltip]."
  yearly.3001.confront:0 "[vassal.GetSheHe|U] biết về sự nghi ngờ của Ta"
  yearly.3001.true_tt:0 "Lời buộc tội của Ta là đúng"
  yearly.3001.false_tt:0 "Sự nghi ngờ của Ta là vô căn cứ"
  yearly.3001.false_use_tt:0 "[vassal.GetTitledFirstNameNoTooltip] sẽ sử dụng lời sỉ nhục này để mang lại lợi thế cho [vassal.GetHerHis]"
  yearly.3001.b:0 "[vassal.GetSheHe|U] có tội, và Ta sẽ công khai buộc tội [vassal.GetHerHim]!"
  yearly.3001.c:0 "[neighbor.GetTitleAsNameNoTooltip] không đáng tin. Các chư hầu của Ta có sự ủng hộ của Ta!"
  yearly.3001.c.if_wrong_tt:0 "Nếu [vassal.GetFirstNameNoTooltip] không trung thành"
  yearly.3001.c.if_right:0 "Nếu [vassal.GetFirstNameNoTooltip] trung thành"
  yearly.3001.vassal_gains_strength:0 "Âm mưu của [vassal.GetTitledFirstNamePossessiveNoTooltip] càng mạnh hơn"
  yearly.3001.d:0 "Ta #EMP đã biết#! [vassal.GetFirstNameNoTooltip] sẽ trả giá!"

  yearly.3002.t:0 "Lời Thú Nhận"
  yearly.3002.desc:0 "[vassal.GetTitledFirstName] không thể làm gì khác ngoài thú nhận khi [vassal.GetSheHe] bị đối chất với bức thư của [neighbor.GetTitledFirstNamePossessive].\n\n"Chuyện đó chưa bao giờ... Đó không phải... Làm sao thần có thể sửa chữa sai lỗi này đây?" [vassal.GetSheHe|U] [vassal.Custom('quirk_neg_present')], nhưng ta có thể thấy rõ nỗi sợ hãi hiện rõ trên khuôn mặt của [vassal.GetHerHis]."
  yearly.3002.a:0 "Làm mọi điều Ta nói, và ngươi sẽ được tha."
  yearly.3002.b:0 "Ta tha thứ nếu ngươi để mọi người biết về sự hào phóng của Ta."

  yearly.3003.t:0 "Một Lời Buộc Tội Xúc Phạm"
  yearly.3003.desc:2 "Khi ta đưa bức thư của [neighbor.GetTitledFirstNamePossessiveNoTooltip] cho [vassal.GetTitledFirstName], ban đầu nó vấp phải sự bối rối, sau đó là tức giận. "Ngài tin lời của [neighbor.GetHerHis] hơn lời của thần sao? Chẳng phải thần luôn là một bề tôi trung thành hay sao!"\n\nSự phẫn nộ của [vassal.GetHerHis|U] đã gieo một hạt giống hoài nghi vào tâm trí ta. Có lẽ ta đã hành động quá hấp tấp. Ta nên sửa chữa sai lầm trước khi hủy hoại mối quan hệ này thêm nữa!"
  yearly.3003.friend:0 "\nMay mắn thay, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] can thiệp. 'Chỉ là để cảnh báo ngài về sự vu khống của [neighbor.GetTitledFirstNamePossessive],' [friend.GetTitledFirstName] nói."
  yearly.3003.a:0 "Vâng. Thật ra Ta muốn thưởng cho ngươi vì lòng trung thành!"
  yearly.3003.b:0 "Ngươi luôn là Bạn Bè tốt mà."
  yearly.3003.public_expression_of_gratitude:0 "Bày tỏ Lòng Biết Ơn Công Khai"
  yearly.3003.vassal_loss_of_faith:0 "Lời Xin Lỗi Không Chân Thành"
  yearly.3003.c:0 "Vâng, nghe theo lời [friend.GetFirstNameNoTooltip]!"
  yearly.3003.c.enable:0 "Lựa chọn này khả dụng nhờ [friend.GetTitledFirstNamePossessiveNoTooltip] có chỉ số Ngoại Giao cao"

  yearly.3004.t:0 "Công Khai Trước Mặt Mọi Người"
  yearly.3004.desc:0 "Trong một cuộc họp mặt nhiều chư hầu, Ta tuyên bố rằng Ta biết về sự phản bội của [vassal.GetTitledFirstNamePossessive].\n\nNhiều chư hầu khác đứng lên ủng hộ. 'Chúng Ta đều biết điều đó là sự thật. [vassal.GetHerHim] sẽ ra sao?'"
  yearly.3004.a:0 "[vassal.GetFirstNameNoTooltip] sẽ sửa chữa những sai lầm của [vassal.GetHerHis]."
 
  yearly.3004.b:0 "Ta sẽ chắc chắn rằng [vassal.GetSheHe] không thể hại Ta."
  yearly.3004.c:0 "Ta sẽ #EMP chắc chắn#! rằng [vassal.GetSheHe] không thể hại Ta."

  yearly.3005.desc:0 "Trong một cuộc họp nhiều chư hầu, Ta tuyên bố rằng Ta biết về sự phản bội của [vassal.GetTitledFirstNamePossessive]. Tuy nhiên, các chư hầu đồng minh của [vassal.GetHerHis] không hài lòng với bức thư của [neighbor.GetLadyLord] ngoại quốc.\n\n[vassal.GetFirstName] nói thay cho tất cả. 'Bằng chứng đâu? Nếu một bức thư là đủ, chẳng phải tất cả chúng ta #EMP đều#! sẽ có tội sao?' Cuộc họp xì xầm đồng tình. Việc này đang vượt tầm kiểm soát!"
  yearly.3005.a:0 "Ta tốt hơn nên chủ động!"
  yearly.3005.a.rousing_speech:0 "Bài Diễn Văn Khích Lệ về Lòng Trung Thành"
  yearly.3005.a.stumbling_apology:0 "Lời Xin Lỗi Lúng Túng"
  yearly.3005.b:0 "Ta đã tuyên bố [vassal.GetHerHim] là kẻ phản bội, và [vassal.GetSheHe] sẽ bị xử lý như vậy!"

  yearly.3011.t:0 "Ấn Tượng Hai Lần"
  yearly.3011.desc:0 "Trước một bữa tiệc khác nhân danh [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege'))], [liege.GetTitledFirstName], [vassal.GetTitledFirstName] đến thăm Ta.\n\n'Chúng ta đều không được [liege.GetTitleAsNamePossessiveNoTooltip] ưu ái,' [vassal.GetSheHe] chỉ ra, 'nhưng nếu chúng ta tổ chức một màn trình diễn hoành tráng trong bữa tiệc, chúng ta có thể cải thiện vị thế với [liege.GetHerHim].'"
  yearly.3011.a:0 "Ta sẽ cung cấp vàng cho việc này!"
  yearly.3011.a.success:0 "Màn Trình Diễn Vinh Quang"
  yearly.3011.a.failure:0 "Vui Như Mong Đợi"
  yearly.3011.b:0 "Ta có thể tìm những nghệ sĩ cần thiết."
  yearly.3011.c:0 "Ta nghĩ nên tập trung vào những điều nhỏ nhặt."
  yearly.3011.d:0 "Ta biết chính xác cách trình diễn một màn biểu diễn."

  yearly.3012.desc:0 "Những bước nhảy uốn lượn và xoay người của các vũ công mà [vassal.GetTitledFirstName] và Ta thuê khiến mọi người kinh ngạc. Sau bữa ăn, [liege.GetTitledFirstName] [liege.GetHerselfHimself] tiến đến Ta. 'Thật là tuyệt vời, [ROOT.Char.GetFirstNameNoTooltip].'\n\n[vassal.GetFirstName] và Ta không thể không trao nhau một nụ cười."
  yearly.3012.a:0 "Ta tự hỏi chúng ta nên làm gì tiếp theo..."
  yearly.3012.b:0 "Đây là một ý tưởng rất hay, [vassal.GetFirstNameNoTooltip]."

  yearly.3013.desc:0 "Bất chấp những cái quét chân và những cánh tay xoay tròn, [liege.GetTitledFirstName] dường như không quá ấn tượng với những vũ công mà [vassal.GetTitledFirstName] và ta đã thuê cho bữa tiệc. Vị [liege.GetTitleAsNameNoTooltip] lắng nghe lời tri ân của họ dành cho chúng ta với một nụ cười, nhưng rồi nhanh chóng chuyển sự chú ý của [liege.GetHerHis] trở lại món ăn.\n\n[vassal.GetFirstName] trao cho ta một cái nhìn không chắc chắn, nhưng [liege.GetFirstName] có vẻ đủ hài lòng."
  yearly.3013.a:0 "Dù sao, chúng ta sẽ chăm sóc nhau."
  yearly.3013.b:0 "Ít nhất chúng ta đã cố gắng hết sức."

  yearly.3014.desc:0 "Những vũ công mà [vassal.GetTitledFirstName] and ta thuê quả là một thảm họa. Quờ quạng và nhảy nhót lung tung, họ trông giống một gánh hài hơn là màn trình diễn thanh lịch đã được hứa hẹn. [liege.GetTitledFirstName] dường như cũng không vui khi bị làm phiền ở giữa bữa tối của [liege.GetHerHis].\n\nChỉ đến khi có những lời tri ân dành cho chúng ta, ta mới nhận ra đây không phải là nhóm người mà chúng ta đã thương lượng cùng! Ai có thể làm vậy-\n[nemesis.GetTitledFirstName]!"
  yearly.3014.a:0 "Hãy để Ta kể cho ngươi nghe về kẻ phá bĩnh này, [vassal.GetFirstNameNoTooltip]."
  yearly.3014.b:0 "Đây không phải lỗi của chúng ta, [vassal.GetFirstNameNoTooltip]."
 
  yearly.3021.t:0 "Trên Giường Chết của [deathbed_character.GetHerHis|U]"
  yearly.3021.desc:0 "Giờ rõ ràng rằng [deathbed_character.GetTitledFirstName], người Ngài già [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('deathbed_character'))] của Ta, không còn sống lâu nữa.\n\nKhi Ta đến giường bệnh của [deathbed_character.GetHerHis], Ta biết [deathbed_character.GetSheHe] đã sống một đời dài. Nhưng chẳng bao giờ đủ thời gian để nói lời tạm biệt, phải không? Ta nắm tay [deathbed_character.GetHerHis] cho đến khi nó lạnh và hơi thở ngừng lại."
  yearly.3021.a:0 "Nguyện ngươi tìm được bình yên ở đời sau, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deathbed_character'))]."

  yearly.3031.t:0 "Tiến Lên Trước"
  yearly.3031.desc:0 "Cả Ta và [fellow_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] đều được [liege.GetTitledFirstName] kính trọng. Tuy nhiên, khi trao tặng danh hiệu, vinh dự và của cải, một trong chúng Ta luôn đứng đầu trong số những người ngang hàng.\n\nCuộc tụ họp sắp tới tại [capital.GetNameNoTierNoTooltip] [liege.Custom('ResidenceBuilding')|U] là cơ hội để Ta đảm bảo rằng Ta là người nhận được thiện cảm của [liege.GetTitleAsNamePossessiveNoTooltip]."
  yearly.3031.friend:0 "Có [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('best_friend'))] của Ta, [best_friend.GetTitledFirstName], bên cạnh chắc chắn sẽ giúp đỡ."
  yearly.3031.rival:0 "Tuy nhiên, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nemesis'))] của ta là [nemesis.GetTitledFirstName] không hề che giấu sự thật rằng [nemesis.GetSheHe] có ý định phá hoại những nỗ lực của ta!"
  yearly.3031.a:0 "Với khả năng ăn nói khéo léo, chuyện này sẽ dễ dàng."
  yearly.3031.a.best_friend_success:0 "[best_friend.GetFirstNameNoTooltip] làm [fellow_vassal.GetFirstNameNoTooltip] phân tâm"
  yearly.3031.a.success:0 "Ta trở nên thân thiện với [liege.GetTitleAsNameNoTooltip]"
  yearly.3031.a.failure:0 "[fellow_vassal.GetFirstNameNoTooltip] kết thân với [liege.GetTitleAsNameNoTooltip]"
  yearly.3031.a.nemesis_failure:0 "[nemesis.GetFirstNameNoTooltip] vu khống Ta"
  yearly.3031.b:0 "Ta sẽ chứng minh rằng [ROOT.Char.GetFaith.HighGodName] đã ưu ái Ta."
  yearly.3031.b.success:0 "Ta gây ấn tượng với [liege.GetTitleAsNameNoTooltip]"
  yearly.3031.b.failure:0 "[liege.GetTitleAsNameNoTooltip] ấn tượng hơn với [fellow_vassal.GetFirstNameNoTooltip]"
  yearly.3031.c:0 "Ta biết cách thu hút sự chú ý của [liege.GetFirstNamePossessiveNoTooltip]..."
  yearly.3031.c.unlock_tt:0 "Lựa chọn này khả dụng nhờ sự hấp dẫn của Ta với [liege.GetTitledFirstNameNoTooltip]"
  yearly.3031.c.consequence:0 "[liege.GetFirstNameNoTooltip] có thể sẽ theo đuổi Ta nhiều hơn"
  yearly.3031.c.success:0 "Thu Hút Sự Chú Ý"
  yearly.3031.d:0 "Chúng ta, những chư hầu, nên hợp tác, không chống lại nhau!"

  yearly.3040.t:0 "Một [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U] Tốt"
  yearly.3040.desc:1 "Ta được biết đến như một [ROOT.Char.GetWomanMan] cực kỳ sùng đạo. Chắc chắn lòng tận hiến với [ROOT.Char.GetFaith.HighGodName] cũng nên mang lại lợi ích trong đời này, không chỉ ở đời sau?\n\nCó nhiều người nên được nhắc rằng Ta đang được [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] ưu ái."
  yearly.3040.a:0 "Sự tận tâm của Ta nên được hô vang từ các tháp!"
  yearly.3040.b:0 "Năm nay Ta quá khoan dung với [ROOT.Char.GetFaith.HouseOfWorship]..."
  yearly.3040.c:0 "[religious_head.GetTitleAsNameNoTooltip] chắc chắn đánh giá cao một [ROOT.Char.GetLadyLord] sùng đạo!"
  yearly.3040.d:0 "[ROOT.Char.Custom('DefaultPriestTitlePlural')] đã kinh ngạc trước Ta."

  yearly.3041.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.3041.desc:0 "Ta biết ngài là một Bạn Bè tận tụy của [ROOT.Char.GetFaith.HighGodNameAlternate]. Vì vậy, Ta hy vọng ngài thông cảm rằng nghĩa vụ của chúng Ta với ngài làm hạn chế khả năng thực hiện công việc của [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nCó lẽ một số nghĩa vụ nặng nề của chúng Ta có thể được miễn?"
  yearly.3041.a:1 "Vàng của Ta là vàng của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  yearly.3041.b:1 "Hãy tập trung nhân lực vào nơi khác."
  yearly.3041.c:0 "#EMP Ta#! là người thực hiện công việc của [ROOT.Char.GetFaith.HighGodNamePossessive]!"

  yearly.3051.t:0 "Theo Quyền Lợi"
  yearly.3051.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] của Ta đã thông báo cho Ta về một luật hiếm ở [county.GetName], theo đó chỉ có [ROOT.Char.GetTitleAsNameNoTooltip] mới có thể là người bảo vệ của nó.\n\nThường thì luật cổ xưa như vậy sẽ bị bỏ qua, nhưng nó mang lại cơ hội duy nhất để đặt [vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] của Ta và hiện là người cai trị [county.GetNameNoTooltip], vào vị trí của [vassal.GetHerHis]."
  yearly.3051.a:0 "Luật rõ ràng, [ROOT.Char.GetTitleAsNameNoTooltip] có toàn quyền!"
  yearly.3051.b:0 "[vassal.GetFirstNameNoTooltip] có thể giữ danh hiệu, nhờ ân điển của Ta."

  yearly.3061.t:0 "Đối Phó Với Người Cagot"
  yearly.3061.desc:0 "Chỉ nghĩ thôi là Ta đã tức giận! Ở [county.GetName], người Cagot sống tự do bên cạnh người bình thường, hầu như không bị xa lánh vì lỗi lầm! Và tất cả diễn ra ngay trên Con Đường Thánh James!\n\nDĩ nhiên họ không được đi chân trần, chạm tay vào thành cầu, hay nhận lễ trực tiếp từ tay [ROOT.Char.GetFaith.PriestNeuter], nhưng ngoài ra chúng ta #EMP chẳng làm gì cả!#!\n\nTình trạng không thể chịu đựng được này không thể kéo dài. Nếu họ đang lên kế hoạch gì đó thì sao?!"
  yearly.3061.a:0 "Ta sẽ áp thuế nặng lên người Cagot, giữ họ trong cảnh khốn khó!"
  yearly.3061.b:0 "Họ phải bị tách khỏi xã hội tốt!"
  yearly.3061.b.flavor:0 "Tách các khu Cagot, đánh dấu bằng bàn chân đỏ có màng, xây thêm cửa nhà thờ nhỏ riêng cho họ... Vâng, như vậy là đủ."
  yearly.3061.c:0 "Chẳng lẽ chúng ta không thể sống hòa hợp với họ sao?"
  yearly.3061.d:0 "Những kẻ vô thần đáng ghét! Đuổi họ đi và chiếm đoạt tài sản!"

  yearly.3071.t:0 "Chỉ Là Cơn Ác Mộng"
  yearly.3071.desc:0 "Ta tỉnh dậy trong tiếng thét, tim đập nhanh.\n\nTa đã bị xích trần — hay bị đeo vòng cổ? — trong khi một tá người đàn ông và phụ nữ có đầu dê tấn công Ta, cắn xé làn da Ta...\n\nRồi đột nhiên Ta trở thành một trong số họ, xé thịt mình bằng răng nhọn, nuốt mảnh vụn, uống máu... #EMP nhai sột soạt...#! Ta chưa từng cảm thấy điều gì kinh hoàng như khi nhìn thấy sinh lực rời khỏi đôi mắt cơ thể bị tàn phá của mình.\n\nNhưng chỉ là một giấc mơ. Chỉ là giấc mơ."
  yearly.3071.a:0 "Cầu nguyện để được [ROOT.Char.GetFaith.HighGodNamePossessive] bảo vệ sẽ làm Ta bình tĩnh."
  yearly.3071.b:0 "Tại sao ký ức về mùi vị đó không rời khỏi tâm trí Ta?!"
