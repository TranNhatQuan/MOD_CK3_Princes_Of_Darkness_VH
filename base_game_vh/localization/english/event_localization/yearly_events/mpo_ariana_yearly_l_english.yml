l_english:
  mpo_events_ariana.0001.t: "Phát Hiện Tổ Chim"
  mpo_events_ariana.0001.desc: "Trên đường trở về trại, Ta phát hiện một tổ chim nhỏ, mặc dù không có con chim nào trong tầm mắt. Nó được làm từ cành cây và cỏ, và có vẻ còn rất nguyên vẹn.\n\nKhi quan sát kỹ hơn, có hai con chim non bên trong, đủ lớn để sống mà không cần mẹ trong một thời gian, nhưng vẫn còn quá nhỏ để bay xa. Cơ hội để"
  mpo_events_ariana.0001.desc_had_story: "có một người Ngài đại bàng một lần nữa thật hấp dẫn, nhưng Ta phải thận trọng, vì Ta biết những sinh vật này khó lường đến mức nào."
  mpo_events_ariana.0001.desc_has_eagle: "bắt một con, có thể như một món quà, xuất hiện."
  mpo_events_ariana.0001.desc_ending: "lấy một con làm Ngài đồng hành là cơ hội quá tốt để bỏ qua."
  mpo_events_ariana.0001.a: "Một con đại bàng tốt đáng để chinh phục núi cao."
  mpo_events_ariana.0001.a_tt: "Ngài trèo lên núi và cố gắng bắt những con chim non bằng sức mạnh"
  mpo_events_ariana.0001.a_win: "Ngài bắt thành công một con, hoặc cả hai"
  mpo_events_ariana.0001.a_win_desc: "Số phận của một con chim non, hoặc cả hai, nằm trong tay Ngài"
  mpo_events_ariana.0001.a_lose_ok: "Ngài không bắt được chim non, nhưng không hề hấn gì"
  mpo_events_ariana.0001.a_lose_bad: "Ngài không bắt được chim non, và bị ngã một đoạn ngắn xuống núi"
  mpo_events_ariana.0001.b: "Nếu là duyên số, chúng sẽ đến với Ta."
  mpo_events_ariana.0001.b_win_desc: "Một con chim non, hoặc cả hai, bay đến bên Ngài"
  mpo_events_ariana.0001.c: "Một dấu hiệu chắc chắn."

  mpo_daydreaming_birds_modifier: "Mơ Mộng Về Chim"
  mpo_daydreaming_birds_modifier_desc: "Nhân vật này không xa lạ với hình ảnh những sinh vật có cánh duyên dáng.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +5%#!"
  hunt_success_chance.mpo_daydreaming_birds_modifier: "[GetModifier('mpo_daydreaming_birds_modifier').GetNameWithTooltip]"

  mpo_events_ariana.0002.desc_intro: "Những con chim non trở nên bồn chồn. Chúng sẽ rời tổ cùng Ta, hoặc một kẻ săn mồi khác.\n\n"
  mpo_events_ariana.0002.desc_standard: "Theo dấu tổ, Ta hạ xuống chậm rãi và cẩn thận. Những con chim non này vẫn còn quá nhỏ để bay xa, nhưng không quá nhỏ để trở nên nguy hiểm.\n\n"
  mpo_events_ariana.0002.desc_one_standard: "Chân Ta trượt trên cỏ, nhưng Ta giữ được thăng bằng. Một con chim non nhận ra sự vật lộn của Ta, và bắt đầu kêu ré lên, làm chính nó giật mình và bay đi. [ROOT.Char.Custom('CulturalCurse')|U]! Dù Ta không lấy được cả hai, một con cũng hơn không."
  mpo_events_ariana.0002.desc_both_standard: "Lấy chúng ra khỏi tổ, Ta gói cả hai con chim non, che mắt chúng bằng một tấm vải. Chúng làm Ta nặng hơn, nhưng chẳng ai là thợ săn đại bàng huyền thoại mà không mang gánh nặng."
  mpo_events_ariana.0002.desc_lure: "Cầm một miếng thịt trên tay, Ta dụ những con chim non đến. Chúng kêu lên đáp lại, và Ta thấy chúng đầy tò mò, dù từ xa.\n\n"
  mpo_events_ariana.0002.desc_one_lure: "Chỉ một con đến bên Ta, con còn lại có lẽ thích ở lại tổ. Ta ôm con chim non, và với cơn đói dữ dội, nó bắt đầu ăn phần đồ Ta dâng."
  mpo_events_ariana.0002.desc_both_lure: "Ta chia đôi miếng thịt, dâng cho mỗi con. Chúng kêu đồng thanh, và Ta không khỏi mỉm cười nhìn cảnh tượng đó."
  mpo_events_ariana.0002.a: "Nó thật đẹp, và là của Ta."
  mpo_events_ariana.0002.b: "[eagle_first_recipient.GetFirstNameNoTooltip] có lẽ sẽ thích một sinh vật như vậy."
  mpo_events_ariana.0002.c: "Ta nghĩ [eagle_second_recipient.GetFirstNameNoTooltip] sẽ muốn nó hơn."
  mpo_events_ariana.0002.b_two: "Ta sẽ giữ một con, và tặng con còn lại cho [eagle_first_recipient.GetFirstNameNoTooltip]."
  mpo_events_ariana.0002.c_two: "Một con là của Ta, và có lẽ [eagle_second_recipient.GetFirstNameNoTooltip] muốn con còn lại?"
  mpo_events_ariana.0002.d: "[eagle_first_recipient.GetFirstNameNoTooltip] và [eagle_second_recipient.GetFirstNameNoTooltip] đều xứng đáng nhận món quà này."
  mpo_events_ariana.0002.e: "Một sẽ là Ngài đồng hành của Ta, con còn lại sẽ đem lại chút tiền."
  mpo_events_ariana.0002.e_sell_first: "[eagle_first_recipient.GetFirstNameNoTooltip] sẽ thích một con, và Ta lấy con còn lại."
  mpo_events_ariana.0002.e_sell_second: "Một con bán ra chợ, và một con dành cho [eagle_second_recipient.GetFirstNameNoTooltip]."
  mpo_events_ariana.0002.e_tt: "Ngài trao đổi con chim non còn lại"
  mpo_events_ariana.0002.f_tt: "Ngài trao đổi con chim non"
  mpo_events_ariana.0002.f_tt_two: "Ngài trao đổi cả hai con chim non"
  mpo_events_ariana.0002.f_one: "Nó sẽ bán được giá tốt."
  mpo_events_ariana.0002.f_two: "Chúng sẽ bán được giá tốt."
 
  mpo_events_ariana.0010.t: "Ngọn Lửa Bên Trong"
  mpo_events_ariana.0010.desc: ""[converting_heir.Custom2('RelationToMe', ROOT.Char)|U]," [ROOT.Char.Custom2('RelationToMeShort', converting_heir)] của ta, [converting_heir.GetName] thầm thì, ra hiệu bảo ta tiến lại gần. "[new_faith.HighGodName|U] đã chỉ lối đưa đường cho ta," [converting_heir.GetSheHe] tiếp lời. \n\n"And giờ đây ta đi theo đức tin [new_faith.GetName]. Ta đã cảm thấy như vậy từ rất lâu rồi, và ta không thể để nó tiếp tục kìm nén nữa. Ta biết ngươi vẫn còn những hoài nghi của mình, nhưng ta khẩn thiết kêu gọi ngươi hãy gia nhập cùng ta và nhiều tín đồ [new_faith.GetAdherentNamePluralNoTooltip] khác trong vùng [ROOT.Char.GetPrimaryTitle.GetTierAsName]. Ta sẽ hỗ trợ ngươi học cách sống cuộc đời của một tín đồ [new_faith.GetAdherentNameNoTooltip] chân chính, và cùng nhau chúng ta sẽ đến được cõi [new_faith.PositiveAfterLife]."\n\n[converting_heir.GetSheHe|U] dõi mắt nhìn ta với một sự nhiệt thành to lớn trong đôi mắt của [converting_heir.GetHerHis], và nắm chặt lấy tay ta, chờ đợi câu trả lời của ta."
  mpo_events_ariana.0010.desc_zealous: "[converting_heir.GetFirstNameNoTooltip] chế nhạo ta sao? Làm sao [converting_heir.GetSheHe] có thể tin rằng ta sẽ trở thành một [new_faith.GetAdherentNameNoTooltip]?!"
  mpo_events_ariana.0010.a: "Ngươi sẽ không đơn độc, [converting_heir.GetFirstNameNoTooltip]."
  mpo_events_ariana.0010.a_zealous: "Có lẽ ta quá nghiêm khắc, và [converting_heir.GetSheHe] đúng."
  mpo_events_ariana.0010.b: "Ngoại trừ danh nghĩa, ta vẫn là [old_faith.GetAdherentNameNoTooltip]."
  mpo_events_ariana.0010.b_zealous: "Lần này ta sẽ chiều ngươi, [converting_heir.GetFirstNameNoTooltip]."
  mpo_events_ariana.0010.b.tt: "Ngươi theo [new_faith.GetName], nhưng thầm tiếp tục thực hành [old_faith.GetName]."
  mpo_events_ariana.0010.c: "Xin lỗi, nhưng ta không thể làm điều này."
  mpo_events_ariana.0010.c_cynical: "Tôn giáo là vấn đề cá nhân, [converting_heir.GetFirstNameNoTooltip]."
  mpo_events_ariana.0010.c_zealous: "Ta không thể bỏ rơi [old_faith.GetName]!"
  mpo_events_ariana.0010.d: "Không [new_faith.GetAdherentNameNoTooltip|U] nào sẽ thấy [old_faith.PositiveAfterLife|U]."
  mpo_events_ariana.0010.d_tt: "Ngài cố thuyết phục [converting_heir.GetNameNoTooltip] ở lại với [old_faith.GetAdjective]."
  mpo_events_ariana.0010.d_success: "[converting_heir.GetFirstNameNoTooltip] suy nghĩ lại về việc chuyển đạo"
  mpo_events_ariana.0010.d_failure: "[converting_heir.GetFirstNameNoTooltip] kiên quyết theo [new_faith.GetAdjectiveNoTooltip]"

  mpo_events_ariana.0020.t: "Không Đáng Tin"
  mpo_events_ariana.0020.desc_intro: "[worried_spouse.GetName] xông vào phòng Ta và thốt lên, \"Ngươi có biết rằng [sus_councillor.GetName] là [councillor_culture.GetName] không?\"\n\nTrước khi Ta kịp đáp lời, [worried_spouse.GetSheHe] chen vào, \"Ta không thể tưởng tượng"
  mpo_events_ariana.0020.desc_marshal: "bất kỳ đội quân nào của ta lại do một [councillor_culture.GetNameNoTooltip] chỉ huy, vì ta thà đứng ở phe đối phương còn hơn. Thế mà, [sus_councillor.GetSheHe] lại lang thang trên khu huấn luyện của ta?""
  mpo_events_ariana.0020.desc_spymaster: "cho phép bất kỳ [councillor_culture.GetNameNoTooltip] âm mưu nào xuất hiện trong vòng thân cận, huống hồ là nắm được các hoạt động gián điệp. Ta thà tin vào rắn còn hơn [sus_councillor.GetHerHim].""
  mpo_events_ariana.0020.desc_end: "Mặc dù những trò hề của [worried_spouse.GetFirstNamePossessiveNoTooltip] có vẻ khá thái quá, nhưng ai cũng biết rằng một vài tộc người [councillor_culture.GetCollectiveNounNoTooltip] vốn mang đặc tính [sus_councillor.Custom('mpo_yearly_ethos')]\n\n"Xin ngài..." [worried_spouse.GetSheHe] than vãn, "thần van xin ngài, đừng cho phép [sus_councillor.GetHerHim] tiếp tục những hành vi [sus_councillor.Custom2('InsultBehavior', SCOPE.sC('worried_spouse'))] của [sus_councillor.GetHerHis] trong các đại sảnh của chúng ta nữa. Không thể nói trước được [sus_councillor.GetSheHe] có thể làm ra những chuyện gì đâu.""
  mpo_yearly_bellicose: "quá liều lĩnh, cho một mối hận thù có thể chưa tồn tại."
  mpo_yearly_stoic: "sẽ không rơi nước mắt, dù cho là cái chết của chính người thân."
  mpo_yearly_bureaucratic: "quan tâm nhiều hơn đến giấy tờ hay sách vở hơn là mạng sống đồng loại [sus_councillor.GetCulture.GetCollectiveNounNoTooltip]."
  mpo_yearly_spiritual: "có thể hành động bất chấp người khác, miễn là vì [sus_councillor.GetFaith.HighGodName]."
  mpo_yearly_courtly: "thường ngẩng đầu dòm ngón dưới hơn là ra đồng và núi non bảo vệ sự sống."
  mpo_yearly_egalitarian: "không ngần ngại đón nhận người ngoài, và văn hóa của họ có thể bị xóa trong vài thiên niên kỷ."
  mpo_yearly_communal: "hoạt động theo tư duy tập thể, và khả năng không thể hành động cá nhân khiến ta lo ngại."
  mpo_events_ariana.0020.a: "Ngươi đúng, [worried_spouse.GetFirstNameNoTooltip]. [sus_councillor.GetSheHe|U] sẽ ra đi vào ngày mai!"
  mpo_events_ariana.0020.a_tt: "Tất cả [councillor_culture.GetName] [vassals|E]:\n$EFFECT_LIST_BULLET$Sẽ mất #n 10#! [opinion|E] của #V Ngài#!"
  mpo_events_ariana.0020.b: "Ta nghĩ ta nên cẩn thận hơn quanh những [councillor_culture.GetCollectiveNounNoTooltip] này."
  mpo_events_ariana.0020.c: "Không có gì bất thường về [sus_councillor.GetHerHim] hoặc bất kỳ [councillor_culture.GetNameNoTooltip] nào."
  mpo_events_ariana.0020.c_paranoid: "Ta sẽ không bị thuyết phục bởi sự hoang tưởng của ngươi."
  mpo_events_ariana.0020.c_tt: "Tất cả [councillor_culture.GetName] [vassals|E]:\n$EFFECT_LIST_BULLET$Sẽ nhận #p 10#! [opinion|E] của #V Ngài#!"
  cultural_suspicion_modifier: "Nghi Ngờ Văn Hóa"
  cultural_suspicion_modifier_desc: "Nhân vật này không mấy ưa thích người ngoại quốc trong vương quốc của họ."

  mpo_events_ariana.0030.t: "Đồ Uống Cấm Kỵ"
  mpo_events_ariana.0030.desc: ""Những bát rượu [Glossary( 'kumis', 'KUMIS_GLOSS')] tại buổi tụ họp của chúng ta đã cạn khô hoàn toàn rồi, thưa [ROOT.Char.GetTitleAsNameNoTooltip] của thần..." [spymaster.GetName] phàn nàn. "But ít nhất thần biết kẻ chịu trách nhiệm cho sự khan hiếm này." [spymaster.GetSheHe|U] chỉ tay về phía [bartender.GetName], người đang được nhìn thấy đang đổi một chén sữa ngựa lên men lấy thứ khác với một kẻ hạ dân khác.\n\n"Chắc chắn ngài sẽ không để các vị khách của chúng ta bị tước mất đồ uống của họ chứ? Suy cho cùng, chúng đã được chuẩn bị đặc biệt cho các bậc chúa tể và phu nhân tôn kính của vùng [ROOT.Char.GetPrimaryTitle.GetNameNoTier]." [spymaster.GetSheHe] hỏi, một nụ cười ranh mãnh hiện rõ trên khuôn mặt của [spymaster.GetHerHis]."
  mpo_events_ariana.0030.jail: "Hãy xem [bartender.GetSheHe] kiếm được bao nhiêu từ một ô giam."
  mpo_events_ariana.0030.jail_tt: "Mỗi [Concept('activity_attending', 'Attending Guest')|E] từ [Concept('dynasty', 'Noble Dynasty')|E]:\n$EFFECT_LIST_BULLET$Sẽ nhận #p 10#! [opinion|E] của #V Ngài#!"
  mpo_events_ariana.0030.jail_effect: "Bạn trừng phạt [bartender.GetNameNoTooltip] vì sự vi phạm của [bartender.GetHerHis]"
  mpo_events_ariana.0030.ignore: "Để dân uống đi!"
  mpo_events_ariana.0030.ignore_tt: "Mỗi [Concept('activity_attending', 'Attending Guest')|E] từ [Concept('dynasty', 'Noble Dynasty')|E]:\n$EFFECT_LIST_BULLET$Sẽ mất #n 10#! [opinion|E] của #V Ngài#!"
  mpo_events_ariana.0030.ignore_effect: "Ngài để [bartender.GetNameNoTooltip] tiếp tục phục vụ hạ dân"
  mpo_events_ariana.0030.ignore_tt_lowborn: "Mỗi [lowborn|E] [Concept('activity_attending', 'Attending Guest')|E]:\n$EFFECT_LIST_BULLET$Sẽ nhận #p 10#! [opinion|E] của #V Ngài#!"
  mpo_events_ariana.0030.greedy: "Khách à? Họ có thể uống nước."
  mpo_events_ariana.0030.greedy_tt: "Ngài lấy phần trăm lợi nhuận từ [bartender.GetNameNoTooltip] cho riêng mình"
  kumi_tax_modifier: "Thuế Đồ Uống"
  kumi_tax_modifier_desc: "Nhân vật này đã tận dụng cơ hội kinh doanh sinh lợi tại một buổi tiệc gần đây."
  buzzed_peasants_county_modifier: "Dân Hạ Lạc Vui Mừng"
  buzzed_peasants_county_modifier_desc: "Dân hạ cấp của hạt này rất hài lòng với lễ hội gần đây."

  mpo_events_ariana.0040.title_feast: "Bữa Tiệc Đáng Nhớ"
  mpo_events_ariana.0040.title_wedding: "Mặt Nạ Hôn Nhân"
  mpo_events_ariana.0040.title_camp_party: "Đằng Sau Lều"
  mpo_events_ariana.0040.desc_wedding_feast: "Đại sảnh mờ ảo ánh đèn, không khí ngập tràn tiếng cười cùng hương vị của món [ROOT.Char.Custom('GetExpensiveMeal')]. Phần tiếp theo của buổi lễ yêu cầu cả khách lẫn chủ nhà đều phải che giấu thân phận, mang lại cảm giác thần bí và phấn khích. Ta cẩn thận đeo một chiếc mặt nạ vào, đảm bảo đã che khuất diện mạo của mình, rồi hòa vào cùng các vị khách khác trong vũ điệu và niềm vui hoan hỉ. Khi lễ hội tiếp diễn, ta thấy mình bị thu hút bởi một bóng hình bí ẩn. [masked_guest.GetSheHe|U] đang khoác trên mình chiếc mặt nạ tinh xảo mô tả một con [ROOT.Char.Custom('GetRandomRegionalBird')]. [masked_guest.GetSheHe|U] vẫy tay ra hiệu bảo ta tiến lại gần, và ta nhận thấy mình không thể cưỡng lại sức hút đó.\n\nChẳng mấy chốc, cuộc trò chuyện của chúng ta trở nên gợi cảm hơn, và ta không thể không cảm nhận được một mối liên kết vượt ra ngoài chiếc mặt nạ. [masked_guest.GetSheHe|U] ôm chặt ta vào một cái ôm ấm áp, và ra hiệu cho chúng ta di chuyển đến một khu vực riêng tư hơn."
  mpo_events_ariana.0040.desc_camp_party: "Trại nhộn nhịp với âm thanh nhạc và tiếng cười, [talker.GetName] gợi ý chơi trò trốn tìm. Gần như bật cười, Ta nhận ra [talker.GetSheHe] nghiêm túc. Chẳng mấy chốc, Ta núp sau lều. Khi bước chân tới gần, Ta lao ra khỏi chỗ trốn, sâu hơn vào rừng. Có lẽ say rượu khiến Ta lạc đường, và đêm tối mịt. Chẳng mấy chốc, Ta va vào người khác, và nghe tiếng thở phào. \"Ôi, Ta tưởng chỉ mình Ta lạc đường,\" [masked_guest.GetSheHe] thở, \"Chúng ta nên đi cùng nhau, đúng không?\"\n\nSau một thời gian lang thang, chúng Ta trò chuyện vượt ra ngoài những câu xã giao thường nhật. Điều gì đó kéo Ta đến [masked_guest.Custom('WomanManGirlBoy')], dù khuôn mặt [masked_guest.GetHerHis] bị che khuất. [masked_guest.GetSheHe|U] kéo Ta lại gần và gợi ý tiếp tục phiêu lưu khi trở về trại."
  mpo_events_ariana.0040.a: "Ta cảm thấy phiêu lưu..."
  mpo_events_ariana.0040.a_tt: "Ngài chấp nhận lời mời của [masked_guest.GetHerHis]"
  mpo_events_ariana.0040.b: "Ta sẽ bỏ qua lần này."

  mpo_events_ariana.0041.title: "Rút Kiếm"
  mpo_events_ariana.0041.desc_wedding_feast: "Kẻ [masked_guest.Custom('WomanManGirlBoy')] và ta lén lút rời khỏi bữa tiệc, và [masked_guest.GetSheHe] ném chiếc mặt nạ của [masked_guest.GetHerHim] xuống đất. Ánh trăng len lỏi qua ô cửa sổ, tỏa ra một vầng sáng dịu nhẹ lên khuôn mặt của [masked_guest.GetHerHis],"
  mpo_events_ariana.0041.desc_camp_party: "Người [masked_guest.Custom('WomanManGirlBoy')] và Ta trở lại trại, dường như mọi người đã nghỉ ngơi từ lâu. Lửa trại đã tàn do sự vắng mặt của chúng Ta, và bóng tối bao trùm. Ta lấy một nhúm củi ném vào lửa, và ánh sáng lóe lên trên khuôn mặt [masked_guest.GetHerHis]."
  mpo_events_ariana.0041.desc_middle: "\n\nNhững gì từng nhẹ nhàng và ngọt ngào nay đã bị căng thẳng lấn át, khi Ta nhận ra người đang đứng ngay trước mặt Ta là"
  mpo_events_ariana.0041.desc_rival: "kẻ thù không đội trời chung, [masked_guest.GetName]!"
  mpo_events_ariana.0041.desc_family: "người thân của Ta, [masked_guest.GetName]..."
  mpo_events_ariana.0041.desc_family_spouse:0 "phối ngẫu của người thân ta, [masked_guest.GetName]..."
  mpo_events_ariana.0041.desc_rival_spouse:0 "phối ngẫu của kẻ thù ta, [masked_guest_spouse.GetName], [masked_guest.GetName]!"
  mpo_events_ariana.0041.desc_outro: "Mặc dù [masked_guest.GetSheHe] dường như cũng ngạc nhiên như ta, nhưng [masked_guest.GetSheHe] nhanh chóng lấy lại sự bình tĩnh của [masked_guest.GetHerHis]. [masked_guest.GetSheHe|U] cười thầm, và thì thầm: "Ta đã chờ đợi khoảnh khắc này từ lâu rồi, [ROOT.Char.GetFirstNameNoTooltip].""
  mpo_events_ariana.0041.desc_family_outro: "Nghe những lời đó từ chính [ROOT.Char.Custom2('RelationToMeShort', masked_guest)] của mình..."
  mpo_events_ariana.0041.a_rival: "Trò chơi nguy hiểm, nhưng ta sẽ tham gia."
  mpo_events_ariana.0041.a_family: "Không có gì sai khi tìm hiểu thêm về người thân."
  mpo_events_ariana.0041.a_rival_spouse: "Chỉ để làm [masked_guest_spouse.GetFirstName] tức giận..."
  mpo_events_ariana.0041.a: "Ta chấp nhận lời đề nghị của ngươi..."
  mpo_events_ariana.0041.b_rival: "Đoàn kết trong hận thù, giờ cả trong tim!"
  mpo_events_ariana.0041.b_family: "Sợi dây giữa chúng ta không thể phá vỡ!"
  mpo_events_ariana.0041.b_rival_spouse: "Ta sẽ lấy mọi thứ từ [masked_guest_spouse.GetFirstName]!"
  mpo_events_ariana.0041.b: "Đến bên ta, [masked_guest.GetFirstNameNoTooltip]!"
  mpo_events_ariana.0041.c_rival: "Điều này không thay đổi gì giữa chúng ta!"
  mpo_events_ariana.0041.c_family: "[ROOT.Char.Custom2('RelationToMeShort', masked_guest)|U], quên chuyện này đi!"
  mpo_events_ariana.0041.c_spouse: "Người Ngài đời thân yêu [ROOT.Char.GetPrimarySpouse.GetFirstName] sẽ nghĩ gì?"
  mpo_events_ariana.0041.c_family_spouse: "Ta không thể làm vậy với [masked_guest_spouse.GetFirstName]!"
  mpo_events_ariana.0041.c: "Ta phải từ chối..."
  mpo_events_ariana.0041.c_tt: "Ngài từ chối những ý định của [masked_guest.GetFirstNamePossessiveNoTooltip]"
  mpo_events_ariana.0041.d: "Có lẽ ta nên tạm hòa..."
  mpo_events_ariana.0041.d_tt: "Ngài dùng cơ hội này để cố gắng làm hòa với [masked_guest.GetFirstNameNoTooltip]"
  mpo_events_ariana.0041.d_success: "Ngài và [masked_guest.GetFirstName] đồng ý gác lại khác biệt"
  mpo_events_ariana.0041.d_failure: "Ngài và [masked_guest.GetFirstName] vẫn không hòa thuận"

  lover_masked_activity: "[CHARACTER.GetShortUIName|U] và [TARGET_CHARACTER.GetShortUIName] trở thành tình nhân sau một diễn biến bất ngờ trong một hoạt động."
  lover_masked_activity_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] và [CHARACTER.GetShortUIName] trở thành tình nhân sau một diễn biến bất ngờ trong một hoạt động."

  mpo_events_ariana.0050.t: "Bị Dán Nhãn"
  mpo_events_ariana.0050.desc: "Những lời bàn tán xôn xao cùng các cáo buộc xung quanh [ROOT.Char.Custom2('RelationToMeShort', criminal_family)] của ta là [criminal_family.GetName] ngày càng trở nên rắc rối. Đã có những cuộc thảo luận về việc [criminal_family.GetHerHis] có liên quan đến một loạt vụ trộm cắp gần đây, và bách tính đang bắt đầu lo sợ cho sự an toàn của họ. Cho dù [criminal_family.GetSheHe] bị bắt quả tang, hay đơn giản là phải đối mặt với nguy cơ bị tẩy chay do bản tính [criminal_family.Custom('mpo_ariana_0050_description')] của [criminal_family.GetHerHis], bách tính vẫn đang kêu gọi trừng phạt [criminal_family.GetHerHis].\n\nNếu điều này xảy ra, [criminal_family.GetFirstNameNoTooltip] sẽ bị tước đoạt toàn bộ đất đai, tước hiệu và tôn nghiêm của [criminal_family.GetHerHis], bị bỏ mặc sống trong nỗi tủi nhục, để lại một vết nhơ lớn lên gia tộc [ROOT.Char.GetDynasty.GetName]."
  mpo_ariana_0050_scheming: "mưu mô"
  mpo_ariana_0050_greedy: "tham lam"
  mpo_events_ariana.0050.a: "Ta không thể để danh tiếng gia đình bị hoen ố."
  mpo_events_ariana.0050.a_tt: "Ngài chi tiền để làm trong sạch tên tuổi [criminal_family.GetFirstNamePossessiveNoTooltip]"
  mpo_events_ariana.0050.b: "[criminal_family.GetSheHe|U] sẽ bị trừng phạt, chuyện này không nằm trong tay ta."
  mpo_events_ariana.0050.b_broke: "Có vẻ Ta không đủ tiền để làm sạch tên [criminal_family.GetHerHis]."
  mpo_events_ariana.0050.c: "Vớ vẩn, Ta có thể tự mình dập tắt những tin đồn này."
  mpo_events_ariana.0050.c_tt: "Ngài cố gắng làm trong sạch tên [criminal_family.GetFirstNamePossessiveNoTooltip]"
  mpo_events_ariana_0050_lose_effect_tt: "Mất tất cả các [titles|E] của [criminal_family.GetHerHis]"
  mpo_events_ariana.0050.lose: "[criminal_family.GetFirstNameNoTooltip] bị hổ thẹn"
  mpo_events_ariana.0050.win: "[criminal_family.GetFirstNameNoTooltip] được minh oan"
  criminal_family_dynasty_modifier: "Gia Tộc Ô Danh"
  criminal_family_dynasty_modifier_desc: "Gia tộc này bị hoen ố bởi hành động của một thành viên."

  mpo_events_ariana.0060.t: "Tổ Kho Báu"
  mpo_events_ariana.0060.desc: "[ROOT.Char.Custom2('RelationToMeShort', appropriate_child)] của ta, [appropriate_child.GetName], háo hức lao về phía ta, và trước khi ta kịp hỏi điều gì khiến [appropriate_child.GetHerHim] phấn khích đến vậy, [appropriate_child.GetSheHe] đã đặt một vật nhỏ lấp lánh vào tay ta. "Nhìn xem con tìm thấy gì này!" [appropriate_child.GetSheHe] thốt lên. "Nó rơi ra từ tổ của một con đại bàng, và con nghĩ đó là một kho báu!" \n\nTa kiểm tra vật thể đó, và quả thực đó là một món bảo vật nhỏ bằng vàng. Nó không đáng giá bao nhiêu, nhưng rõ ràng là [appropriate_child.GetSheHe] đang rất tự hào về bản thân [appropriate_child.GetHerHim]self.\n\n"Người có muốn con dẫn người đến cái tổ đó không?" [appropriate_child.GetSheHe] hỏi. "Có thể sẽ còn nhiều hơn nữa đấy""
  mpo_events_ariana.0060.a: "Ta chắc có thể trèo lên đó."
  mpo_events_ariana.0060.a_tt: "Ngài cố gắng leo lên tổ để tìm thêm kho báu"
  mpo_events_ariana.0060.success: "Ngài leo lên tổ thành công"
  mpo_events_ariana.0060.success_tt: "Ngài tìm thấy một kho báu bên trong"
  mpo_events_ariana.0010.failure: "Ngài không thể leo lên tổ"
  mpo_events_ariana.0010.a_failure: "Ngài trượt ngã và không thể lên tổ"
  mpo_events_ariana.0060.b: "Ta sẽ đi, nhưng ngươi phải im lặng."
  mpo_events_ariana.0060.b_tt: "Ngài cố gắng đến tổ mà không làm đại bàng sợ"
  mpo_events_ariana.0010.b_failure: "Ngài làm đại bàng hoảng và không thể lên tổ"
  mpo_events_ariana.0060.d: "Tốt lắm, [appropriate_child.GetFirstNameNoTooltip]."
 
  mpo_events_ariana.0070.desc: "Ta đến tổ và thấy một con chim non bên trong, cùng với một chiếc túi nhỏ. \"À, đây là nơi kho báu đến.\" [appropriate_child.GetFirstName] thì thầm. [appropriate_child.GetFirstNameNoTooltip] nhìn Ta với đôi mắt mở to, và Ta thấy suy nghĩ [appropriate_child.GetHerHis] đang hoạt động.\n\n\"Mẹ của đại bàng đâu?\" [appropriate_child.GetSheHe] hỏi. \"Chúng ta nên đi trước khi mẹ nó trở lại.\" Ta gật đầu đồng ý, nhưng trước khi rời đi, Ta sẽ xem có thể mang theo gì."
  mpo_events_ariana.0070.a: "Ta sẽ lấy kho báu mình đến để tìm."
  mpo_events_ariana.0070.a_tt: "Ngài mở chiếc túi"
  mpo_events_ariana.0070.a_trinket: "Ngài tìm thấy một món đồ bí ẩn"
  mpo_events_ariana.0070.a_none: "Ngài không tìm thấy gì có giá trị"
  mpo_events_ariana.0070.a_great: "Chiếc túi đầy vàng và đá quý"
  mpo_events_ariana.0070.a_good: "Chiếc túi có vài đồng xu và đồ trang sức nhỏ"
  mpo_events_ariana.0070.b: "Con chim non này sẽ là phần thưởng."
  mpo_events_ariana.0070.b_self: "Ngài mang chim non theo"
  mpo_events_ariana.0070.b_child: "Ngài trao chim non cho [appropriate_child.GetFirstNameNoTooltip]"
  mpo_events_ariana.0070.c: "Cũng là của ngươi, [appropriate_child.GetFirstNameNoTooltip]."
  mpo_events_ariana.0070.c_tt: "Ngài mở túi và chia phần với [appropriate_child.GetFirstNameNoTooltip]"
  mpo_events_ariana.0070.c_none_tt: "Ngài trả lại kho báu gốc cho [appropriate_child.GetFirstNamePossessive]"
  mpo_events_ariana.0070.d: "Chúng ta phải tôn trọng tổ đại bàng."
  mpo_events_ariana.0070.d_tt: "Ngài rời đi tay không"

  mpo_events_ariana.0080.t: "Cây Phép Thuật"
  mpo_events_ariana.0080.desc: "\"[ROOT.Char.GetTitledFirstName], [tree_lover.Custom2('RelationToMeShort', ROOT.Char)] của ta, ngươi phải nghe chuyện này!\" [tree_lover.GetName] reo lên, ra hiệu cho Ta lại gần.\n\n\"Ta nghe nói về một cây khác thường. Nó được cho là có những đặc tính đặc biệt, thậm chí được [ROOT.Char.GetFaith.HighGodName] ban phước để thực hiện điều ước. Ta tin đã đến lúc chúng ta đi tìm, xem liệu truyền thuyết có đúng. Nó nằm ở [tree_barony.GetName], nếu ngươi quan tâm.\" \n\n[tree_barony.GetNameNoTooltip]? Quả là một chuyến đi dài, nhưng nếu cây này thật sự tồn tại, Ta phải biết."
  mpo_events_ariana.0080.a: "Mang cây đó đến cho ta."
  mpo_events_ariana.0080.a_tt: "Ngài sai khiến [tree_lover.GetFirstNameNoTooltip] tìm cây phép thuật và mang về"
  mpo_events_ariana.0080.b: "Ta sẽ tự mình xem."
  mpo_events_ariana.0080.b_arrogant: "Ta không cần ai mang một cái cây nhỏ cho ta."
  mpo_events_ariana.0080.b_tt: "Ngài đi đến [tree_barony.GetName] để tìm cây phép thuật"
  mpo_events_ariana.0080.c_sus: "[tree_lover.GetFirstNameNoTooltip] đang cố lừa ta!"
  mpo_events_ariana.0080.c: "Tại sao lại phí thời gian với chuyện cổ tích?"
  mpo_events_ariana.0080.c_flavor: "Ngài không để tâm đến những lời lảm nhảm của [tree_lover.GetFirstNamePossessive]"

  mpo_events_ariana.0081.desc_self: "Ta đã đến [tree_barony.GetName], nơi [tree_lover.GetFirstName] từng nói. Ta đứng trong một khoảng trống, nơi một cây tỏa ra ánh sáng vàng ấm áp nhẹ nhàng."
  mpo_events_ariana.0081.desc_guy: "Đã lâu rồi kể từ lần cuối ta nói chuyện với [tree_lover.GetName]. Ta thường nghĩ về [tree_lover.GetHerHim], và tự hỏi liệu [tree_lover.GetSheHe] có tìm thấy cây mà [tree_lover.GetSheHe] từng nhắc đến. Ngay khi ta chuẩn bị gạt ý nghĩ đó sang một bên,"
  mpo_events_ariana.0081.desc: "[tree_lover.GetSheHe|U] xuất hiện trước mặt ta với một nụ cười rạng rỡ trên khuôn mặt của [tree_lover.GetHerHis]. [tree_lover.GetSheHe|U] dẫn ta đến khoảng sân của mình, nơi một cái cây vừa mới được trồng đang đứng cao lớn và kiêu hãnh.\n\n"
  mpo_events_ariana.0081.desc_dead: "[tree_giver.GetName] xuất hiện trước mặt ta với một biểu cảm nghiêm nghị. [tree_giver.GetSheHe|U] dẫn ta đến khoảng sân của mình, nơi một cái cây vừa mới được trồng đang đứng cao lớn và kiêu hãnh. "[tree_lover.GetName] đã đúng," [tree_giver.GetSheHe] cất lời, "nhưng thảo dân ước giá như [tree_lover.GetSheHe] có thể tự tay trao nó cho ngài [tree_lover.GetHerHim]self."\n\n"
  mpo_events_ariana.0081.desc_outro: "Ta kinh ngạc trước cảnh tượng này, bởi vì truyền thuyết hóa ra là thật. Lá cây lấp lánh dưới ánh mặt trời, rơi xuống đất một cách uyển chuyển. Ánh sáng xuyên qua cành cây chiếu lên da ta, và giữa sự ngưỡng mộ, ta lại nghĩ đến [tree_lover.GetFirstNameNoTooltip], nhớ đến khả năng thực hiện điều ước của cây. Ta nhắm mắt và cầu nguyện thầm."
  mpo_events_ariana.0081.a: "Ta ước cho đất đai và dòng dõi phồn thịnh."
  mpo_events_ariana.0081.b: "Ta ước cho sức mạnh để vượt qua kẻ thù."
  mpo_events_ariana.0081.c: "Ta ước cho trí tuệ sáng suốt và tâm trí minh mẫn."
  mpo_events_ariana.0081.wish: "Ngài thực hiện điều ước của mình"
  mpo_events_ariana.0081.success: "Điều ước của Ngài được ban cho"
  mpo_events_ariana.0081.failure: "Điều ước của Ngài không được đáp lại"

  mpo_magical_tree_fertility_modifier: "Phúc Lành Sinh Sản"
  mpo_magical_tree_fertility_modifier_desc: "Nhân vật này được cây phép thuật ban phước, khiến đất đai phì nhiêu và con cái đông đúc."

  mpo_magical_tree_power_modifier: "Phúc Lành Quyền Năng"
  mpo_magical_tree_power_modifier_desc: "Nhân vật này được cây phép thuật ban phước, khiến họ mạnh mẽ hơn trong chiến đấu."

  mpo_magical_tree_wisdom_modifier: "Phúc Lành Trí Tuệ"
  mpo_magical_tree_wisdom_modifier_desc: "Nhân vật này được cây phép thuật ban phước, khiến họ thông thái hơn tuổi."

  mpo_magical_tree_modifier: "Bình Thản"
  mpo_magical_tree_modifier_desc: "Nhân vật này đã chứng kiến cây phép thuật, và cảm thấy bình thản trước sự hiện diện của nó."

  mpo_events_ariana.0090.t: "Tham Vọng Len Lông"
  mpo_events_ariana.0090.desc: "Sau khi dành một khoảng thời gian trên các đồng cỏ cùng giới mục đồng, [child.GetFirstName] trở về lều du mục với một nụ cười rạng rỡ trên khuôn mặt của [child.GetHerHis].\n\n"
  mpo_events_ariana.0090.desc_younger: "\"Con muốn trở thành một người chăn cừu, [child.Custom2('RelationToMeShort', ROOT.Char)]!\" [child.GetSheHe] reo lên. \"Họ được cả ngày bên đàn cừu, và nhìn họ hạnh phúc thế nào. Là một [ROOT.Char.GetTitleAsNameNoTooltip] nghe thật nhàm chán!\"\n\n[child.GetSheHe|U] trao Ta một bó len mới cắt, dù thô ráp và bẩn, nhưng Ta thấy niềm tự hào trong mắt [child.GetHerHis]."
  mpo_events_ariana.0090.desc_older: "\"Con muốn là người chăn cừu, chứ không phải một [ROOT.Char.GetTitleAsNameNoTooltip] như ngươi, [child.Custom2('RelationToMeShort', ROOT.Char)],\" [child.GetSheHe] nói. \"Cuộc sống họ có vẻ đơn giản, không lo lắng về chiến đấu hay cai trị.\"\n\n[child.GetSheHe|U] trao Ta một bó len mới cắt, dù thô và bẩn, nhưng Ta cảm nhận được niềm đam mê trong lời nói [child.GetHerHis]."
  mpo_events_ariana.0090.a: "Biết cách của người chăn cừu thật khôn ngoan."
  mpo_events_ariana.0090.a_flavor: "Giấc mơ của [child.GetFirstNamePossessiveNoTooltip] thật tuyệt, dù giản dị."
  mpo_events_ariana.0090.b: "Di sản của ngươi phải lớn hơn một người chăn cừu!"
  mpo_events_ariana.0090.c: "Cuộc sống của họ không đơn giản như vẻ bề ngoài, con à."
  mpo_events_ariana.0090.c_duel: "[child.GetFirstNameNoTooltip] được gửi đi làm việc ở đồng cỏ"
  mpo_events_ariana.0090.c_1: "[child.GetFirstNameNoTooltip] học được giá trị của lao động chăm chỉ"
  mpo_events_ariana.0090.c_2: "[child.GetFirstNameNoTooltip] tăng thêm thể lực cơ bắp trong quá trình làm việc của [child.GetHerHis]"
  mpo_child_herder_modifier: "Người Chăn Cừu Định Mệnh"
  mpo_child_herder_modifier_desc: "Nhân vật này đã dành thời gian ở đồng cỏ và học được kỹ năng từ một người chăn cừu."

  mpo_events_ariana.0100.t: "Sức Mạnh Nơi Không Ngờ"
  mpo_events_ariana.0100.desc: "Một làn bụi bay lên khi hai [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] tranh tài vật lộn. Cả trại reo hò, khi nhà vô địch của ngày hôm nay quật đối thủ [ROOT.Char.Custom('GetMartialHerHis')] xuống đất.\n\nTa nhìn kỹ đám đông để nhận diện chiến binh xuất sắc này. Ngạc nhiên thay, Ta thấy [ROOT.Char.Custom2('RelationToMeShort', warrior)], [warrior.GetFirstName]! Ta không ngờ [warrior.GetHerHim] lại dũng cảm đến vậy, và nhiều người còn không nhận ra một [warrior.GetWomanMan] lại tài giỏi đến thế!"
  mpo_events_ariana.0100.a: "Một chiến binh như thế xứng đáng lãnh đạo!"
  mpo_events_ariana.0100.b: "[warrior.GetFirstNameNoTooltip] có thể tham gia trận chiến với chúng ta."
  mpo_events_ariana.0100.c: "Có lẽ [warrior.GetSheHe] không phải là [warrior.GetWomanMan] duy nhất với kỹ năng như vậy."
  mpo_events_ariana.0100.d: "Ấn tượng đấy, nhưng [warrior.GetSheHe] nên tập trung vào các nghĩa vụ của [warrior.GetHerHis]."
  mpo_diverse_warriors_modifier: "Chiến Binh Đa Dạng"
  mpo_diverse_warriors_modifier_desc: "Nhân vật này cho thấy chiến binh có đủ hình dạng và kích cỡ.\n[martial_custom|E] Chi phí cải tổ: #p -50%#!"
  mpo_diverse_warriors_modifier_value_desc: "[GetModifier('mpo_diverse_warriors_modifier').GetNameWithTooltip]"

  mpo_events_ariana.0110.t: "Đất Nổi Loạn"
  mpo_events_ariana.0110.desc: "\"[ROOT.Char.GetTitleAsNameNoTooltip], ta nghe các linh hồn thì thầm với ta,\" nhà chiêm tinh của ta, [astrologer.GetFirstName] nói. \"[ROOT.Char.GetFaith.HighGodNameSheHe|U] cảnh báo nguy hiểm nếu ngươi không giữ người thân ở [current_capital.GetNameNoTier].\"\n\n"
  mpo_events_ariana.0110.desc_fertility: "\"Khi đàn gia súc không thể gặm cỏ ở đây, sẽ là điều không may nếu thưởng thức bữa ăn ở nơi này.\""
  mpo_events_ariana.0110.desc_opinion: "\"Người dân nơi đây không còn mến mộ ngươi như trước, sự ác ý của họ làm đất đai nhiễm độc.\""
  mpo_events_ariana.0110.desc_ending: "Ta gợi ý chuyển lều tới [new_capital.GetNameNoTier], nơi đó ngươi có thể tìm thấy sự thịnh vượng."
  mpo_events_ariana.0110.a: "[ROOT.Char.GetFaith.HighGodName] không nói dối. Chúng ta phải dời đi."
  mpo_events_ariana.0110.b: "Vớ vẩn, [current_capital.GetNameNoTierNoTooltip] là nhà của ta."
  mpo_events_ariana.0110.c_cynical: "[ROOT.Char.GetFaith.HighGodName] không phải là [ROOT.Char.GetTitleAsNameNoTooltip]. Ta mới là!"
  mpo_events_ariana.0110.c: "Đủ rồi, [astrologer.GetFirstNameNoTooltip]."

  mpo_home_sweet_home_modifier: "Lều Thân Yêu"
  mpo_home_sweet_home_modifier_desc: "Nhân vật này đã rất gắn bó với lều và vị trí của nó."

  mpo_events_ariana.0111.t: "Ngôi Nhà Mới"
  mpo_events_ariana.0111.desc: "Đã khá lâu kể từ khi Ta dời từ [current_capital.GetNameNoTier] tới [new_capital.GetNameNoTier], nghe lời cảnh báo từ nhà chiêm tinh, [astrologer.GetFirstName].\n\nNhư một phước lành từ [ROOT.Char.GetFaith.FertilityGodName], đất đai trở nên màu mỡ hơn, và người dân vui vẻ."
  mpo_events_ariana.0111.a: "Chúng ta đã tìm thấy sự thịnh vượng ở đây."

  mpo_destined_leader_modifier: "Lãnh Đạo Định Mệnh"
  mpo_destined_leader_modifier_desc: "Vượt qua chuẩn mực giới tính của văn hóa, nhân vật này chứng tỏ mình là một lãnh đạo tài năng."
