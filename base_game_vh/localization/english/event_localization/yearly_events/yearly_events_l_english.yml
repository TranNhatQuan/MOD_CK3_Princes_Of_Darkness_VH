l_english:
  yearly.0001.opening:0 "[mentor.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.0001.desc.default:0 "Nhiều năm qua, kỹ năng của ta trong [ROOT.Char.Custom('YearlyEvent0001Skill')] đã phục vụ ta rất tốt, và ta nhận ra rằng kiến thức này cũng có thể hữu ích cho ngươi. Ta sẵn lòng chia sẻ những gì ta biết."
  yearly.0001.desc.arrogant:0 "Như ngươi chắc cũng đã nhận thấy, ta rất thành thạo trong các vấn đề về [ROOT.Char.Custom('YearlyEvent0001Skill')]. Ta sẵn lòng chia sẻ kiến thức của mình về những chủ đề này với ngươi."
  yearly.0001.desc.councillor:0 "Khi phục vụ như [mentor.Custom('CouncilPosition')] của ngươi, ta đã học được nhiều về [ROOT.Char.Custom('YearlyEvent0001Skill')]. Ta sẵn sàng dạy ngươi về những chủ đề này."
  yearly.0001.desc.nofavor:0 "nhằm chiếm được thiện cảm của ngươi."
  yearly.0001.desc.favor:0 "để đền đáp sự giúp đỡ mà ngươi đã dành cho ta trước đây."
  yearly.0001.desc.friend:0 "[ROOT.Char.Custom('YearlyEvent0001Skill')|U] luôn là điểm mạnh của ta, và ta muốn chia sẻ chuyên môn của mình về những chủ đề này với ngươi. Nếu ngươi có thời gian cho vài buổi học, ta sẵn lòng dạy ngươi những gì ta biết."
  yearly.0001.a:0 "Sự giúp đỡ của ngươi thật đáng quý."
  yearly.0001.a.success:0 "Ta tiếp thu bài học từ [mentor.GetFirstNamePossessiveNoTooltip] một cách nghiêm túc."
  yearly.0001.a.failure:0 "[mentor.GetFirstNameNoTooltip] khuyên ta về tình hình hiện tại."
  yearly.0001.b:0 "Một lời đề nghị hào phóng, nhưng nếu ta giúp ngươi thay thì sao?"
  yearly.0001.b.success:0 "[mentor.GetFirstNameNoTooltip] tiếp thu bài học của ta."
  yearly.0001.b.failure:0 "Ta khuyên [mentor.GetFirstNameNoTooltip] về tình hình hiện tại của [mentor.GetHerHis]."
  yearly.0001.c:0 "Cả hai chúng ta đều có lợi nếu kết hợp kiến thức lại!"
  yearly.0001.d:0 "Ta có thể tự lo liệu mà không cần ai giúp."

  yearly.0002.t:0 "Cố Vấn Thiếu Thận Trọng"
  yearly.0002.desc:0 "Vì đã phụng sự ta một cách trung thành trên cương vị là [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('councillor') )] của ta, ta đã tin tưởng giao cho [councillor.GetTitledFirstName] quyền được tự do đi lại trong vùng [ROOT.Char.Custom('GetCourt')] của mình.\n\nTuy nhiên, giờ đây ta được biết [councillor.GetSheHe] đã lợi dụng lòng hiếu khách của ta bằng cách có hành vi thiếu kín đáo với đứa [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child') )] của ta là [child.GetFirstName]!"
  yearly.0002.a:0 "Họ phải kết hôn để chuộc lỗi."
  yearly.0002.c:0 "Ta sẽ nhốt [councillor.GetFirstNameNoTooltip] trong ngục vì dám chống đối ta!"
  yearly.0002.d:0 "Thật đáng tiếc nếu chuyện này bị lộ..."

  yearly.0003.t:0 "Tình Yêu Cấm Kỵ"
  yearly.0003.start.desc:0 "Ban đầu, ta nghĩ đó là một trò đùa — sao có thể [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] của ta và [relative.Custom2('HerHisCharacterIntroductionNoComma', SCOPE.sC('child'))] lại là tình nhân?! Nhưng bức thư mà gián điệp của ta chặn được"
  yearly.0003.dislikes_incest.desc:0 "miêu tả những cuộc gặp gỡ mà không một [child.GetWomanMan] nào nên có với [child.GetHerHis] [child.Custom2('RelationToMeShort', SCOPE.sC('relative'))]..."
  yearly.0003.likes_incest.desc:0 "đi sâu vào những chi tiết #EMP hấp dẫn#! về mối quan hệ xác thịt của họ..."
  yearly.0003.b:0 "Cố gắng che đậy mối quan hệ của họ."
  yearly.0003.a:0 "Cả thế giới sẽ biết về tội lỗi của họ chống lại [ROOT.Char.GetFaith.PantheonTerm]!"
  yearly.0003.c:0 "Giam họ vì làm nhục Nhà [ROOT.Char.GetHouse.GetNameNoTooltip]!"
  yearly.0003.d:0 "Mời họ đến [ROOT.Char.Custom('GetChamber')] của ta để có chút thời gian 'gia đình'."

  yearly.0011.t:0 "Sao Chổi Xuất Hiện!"
  yearly.0011.desc:0 "Sự xuất hiện của một sao chổi trên bầu trời khiến mọi người trần gian đều phải ngừng lại. Hiện tượng kỳ lạ này có ý nghĩa gì, lang thang trên bầu trời chúng ta một cách bất ngờ?\n\nNhững [ROOT.Char.GetWomenMen] khôn ngoan hơn ta đã dành cả đời để suy ngẫm ít hơn, nhưng mọi nông dân kiêu căng ở [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] dường như đều có lý thuyết riêng chưa được suy nghĩ kỹ..."
  yearly.0011.gain_stress:0 "Sao chổi gây hoang mang vô số thần dân."
  yearly.0011.lose_stress:0 "Sao chổi làm nhiều kẻ gây rối sợ hãi."
  gain_rock_artifact_tt: "Ngươi nhận được $artifact_pedestal_rock_name$ [artifact|e]"
  yearly.0011.new_friends:0 "Có lẽ nó mang đến những người Ngài mới?"
  yearly.0011.lustful:0 "Nhanh lên, ai đó hãy ôm ta thật chặt!"
  yearly.0011.chaste:0 "Bọn ngoại tình đã gây ra chuyện này cho chúng ta!"
  yearly.0011.gluttonous:0 "Tử thần đến! Hãy chất đầy kho hàng!"
  yearly.0011.temperate:0 "Đây là sự trừng phạt cho những sự thái quá của chúng ta!"
  yearly.0011.greedy:1 "Ta tự hỏi những kho báu kỳ lạ nào đến từ sao chổi..."
  yearly.0011.generous:0 "Điều này #EMP chứng minh#! rằng chúng ta quá ích kỷ!"
  yearly.0011.lazy:0 "Thôi bỏ đi, ta sẽ quay lại giường."
  yearly.0011.diligent:0 "Sẽ bớt phiền nếu chúng ta đang làm việc."
  yearly.0011.wrathful:0 "Ta sẽ xé con sao chết tiệt khỏi bầu trời!"
  yearly.0011.calm:0 "Chuyện này cũng sẽ qua thôi."
  yearly.0011.patient:0 "Ta sẽ giải mã điềm báo này, theo thời gian."
  yearly.0011.impatient:0 "Điều quái gì [ROOT.Char.GetFaith.NegativeAfterLife] nghĩa là thế này?!"
  yearly.0011.arrogant:0 "Một điềm lành cho gia đình ta, ta nghĩ vậy."
  yearly.0011.humble:0 "Tất cả chúng ta chỉ là hạt bụi trước Sáng Thế."
  yearly.0011.deceitful:0 "Ta tự hỏi giải thích nào sẽ có lợi nhất cho ta..."
  yearly.0011.honest:0 "Nhìn nó chỉ giống một tảng đá thôi mà?"
  yearly.0011.craven:0 "#EMP MỌI NGƯỜI HOẢNG SỢ!#!"
  yearly.0011.brave:0 "Dù nghĩa là gì, chúng ta sẽ đối mặt trực diện!"
  yearly.0011.shy:0 "Có lẽ ta sẽ an toàn hơn trong tháp của mình..."
  yearly.0011.gregarious:0 "Nếu đây là kết thúc, hãy cùng Bạn Bè ăn mừng!"
  yearly.0011.ambitious:0 "Sao chổi báo hiệu những việc vĩ đại và những [ROOT.Char.GetWomenMen] vĩ đại!"
  yearly.0011.content:0 "Dù nghĩa gì, cũng là điều định mệnh."
  yearly.0011.arbitrary:0 "Nó có nghĩa như ta nói!"
  yearly.0011.just:0 "Ôi sao chổi, tiên tri của sự công bằng thần thánh!"
  yearly.0011.cynical:0 "Chắc chỉ là khí nông dân đông đặc thôi."
  yearly.0011.zealous:0 "Ngày tận thế đến gần! Hãy ăn năn!"
  yearly.0011.paranoid:0 "Kẻ thù của ta đang biến Trời thành chống lại ta!"
  yearly.0011.trusting:0 "C-có lẽ nó chẳng có nghĩa gì cả?"
  yearly.0011.compassionate:0 "Ta hy vọng nó không rơi trúng ai..."
  yearly.0011.callous:0 "Chỉ cần nó không rơi trúng ta, thì ai mà quan tâm?"
  yearly.0011.sadistic:0 "Hy vọng nó rơi trúng kẻ thù!"
  yearly.0011.stubborn:0 "Ta không động đậy vì bất cứ điều gì thấp hơn Trời #EMP và#! Đất."
  yearly.0011.fickle:0 "Ta không thể quyết định về chuyện này..."
  yearly.0011.vengeful:0 "Hah, ai đó sẽ nhận hậu quả thích đáng!"
  yearly.0011.forgiving:0 "Đại [ROOT.GetCharacter.GetFaith.HighGodName], xin tha tội cho chúng ta!"

#Abandoned inn
  yearly.0025.t.chain_title: "Quản Lý Quán Trọ"
  yearly.0025.t: "$yearly.0025.t.chain_title$: Cũ Kỹ & Bị Lãng Quên"
  yearly.0025.desc: "Đi dạo trên một con đường vắng vẻ ở [county.GetBaseNameNoTier] cùng đoàn tùy tùng, Ta thấy một bóng tối hiện ra xa xa, tiến chậm theo nhịp bước chân của Ta.\n\nCàng đi gần, càng thấy rõ — đây là một quán rượu cũ, bỏ hoang và bị lãng quên. Với một chút tình yêu và chăm sóc cho mặt tiền cũ kỹ này, nó hoàn toàn có thể trở thành một quán trọ nhỏ đáng yêu.\n\nTa không thể hiểu vì sao nơi này lại xuống cấp đến vậy. Vị trí gần nhiều làng mạc, cửa quán trông rất mời gọi. Dường như, trên toàn thế giới, nơi này đáng lẽ phải kiếm được nhiều tiền.\n\nVới đất đai phù hợp [ROOT.Char.GetLadyLord]."
  yearly.0025.a: "Ta sẽ làm nơi này phát đạt!"
  yearly.0025.a.tt.progress: "Đầu tư tài nguyên để tu sửa quán trọ, có thể đạt kết quả #N xấu#!, #M trung bình#! hoặc #P tốt#! cùng phần thưởng tương ứng."
  yearly.0025.b: "Đi tiếp đi, rủi ro quá lớn."

#Refurbishment
  yearly.0026.t: "$yearly.0025.t.chain_title$: Tu Sửa"
  yearly.0026.desc: "Khi bước vào tòa nhà trơ trọi này, Ta nhanh chóng nhận ra vì sao nó bị bỏ hoang ngay từ đầu.\n\nCó mùi lạ mà Ta không nhận ra, kết hợp với những lỗ rò rỉ trên trần nhỏ giọt xuống sàn bùn bên trong.\n\nSửa chữa nó sẽ không #EMP quá#! khó, nhưng có vẻ phiền phức và tốn kém. Dù sao, người dân [county.GetNameNoTier] chắc chắn sẽ đổ về đây — một doanh nghiệp mới được [ROOT.Char.GetTitleAsNameNoTooltip] chứng nhận sẽ gây sự tò mò nhất định."
  yearly.0026.a: "Chỉ cần... rải rơm lên bùn là đủ"
  yearly.0026.a.tt.success: "Ta tạm ứng dụng những gì có sẵn"
  yearly.0026.a.tt.failure: "Ta không tìm ra giải pháp tốt"
  yearly.0026.b: "Một phần có thể sửa, nhưng cần nhớ hạn chót"
  yearly.0026.c: "Ta sẽ #EMP tân trang mọi thứ!#!"

  yearly.0026.tt.bad: "Quán trọ trở nên #N hơi#! tốt hơn."
  yearly.0026.tt.average: "Quán trọ trở nên #M kha#! tốt hơn."
  yearly.0026.tt.good: "Quán trọ trở nên #P rất#! tốt hơn."

#Edibles
  yearly.0027.t: "$yearly.0025.t.chain_title$: Tiệc Như [ROOT.Char.Custom('GetQueenKing')|U]"
  yearly.0027.desc: "Ta bắt đầu mơ mộng, nghĩ về tiềm năng của nơi này và những kỷ niệm sẽ có trong đó.\n\nTất nhiên, ít gì làm một đêm trở nên tuyệt hơn một bữa ăn no nê, và không gì xua tan buồn phiền nhanh hơn một cốc bia ngon. Một miếng thịt béo, một người say ngủ gục trên ghế, Ngài mới với gương mặt mờ ảo — tất cả là công thức của một đêm vui!\n\nCâu hỏi thật sự là, Ta nên để khách thưởng thức gì: bia, rượu vang, rượu mạnh..."
  yearly.0027.a: "Ai quan tâm đến #EMP đồ uống#!, Ta sẽ tham gia!"
  yearly.0027.a.tt.success: "Sự quyến rũ của Ta thuyết phục được họ"
  yearly.0027.tt.good: "$yearly.0026.tt.good$"
  yearly.0027.a.tt.failure: "Ta không quyến rũ như Ta tưởng"
  yearly.0027.tt.bad: "$yearly.0026.tt.bad$"
  yearly.0027.b: "Củ cải muối cho mọi người"
  yearly.0027.c: "Ta sẽ khiến bọn nông dân này cảm thấy như vua và hoàng hậu"

  innkeeper_bad_edibles_char_modifier: "Chủ Quán Tiết Kiệm"
  innkeeper_bad_edibles_char_modifier_desc: "Thực đơn ở quán trọ của nhân vật này có nhiều mốc hơn thịt."
  innkeeper_neutral_edibles_char_modifier: "Chế Độ Ăn Cân Bằng"
  innkeeper_neutral_edibles_char_modifier_desc: "Nhân vật này có ít lựa chọn vào đêm khai trương quán trọ mới."
  innkeeper_fancy_edibles_char_modifier: "Ăn Quá Chén"
  innkeeper_fancy_edibles_char_modifier_desc: "Có một loạt thực phẩm và đồ uống xa xỉ vào đêm khai trương quán trọ."

#Entertainment
  yearly.0028.t: "$yearly.0025.t.chain_title$: Buổi Biểu Diễn"
  yearly.0028.desc: "Một quán trọ chắc chắn sẽ không hoàn chỉnh nếu thiếu giải trí cho đám đông.\n\nMột nghệ sĩ ca hát, kể về tình yêu và chiến tranh? Hoặc một nhà thơ, truyền cảm hứng về sức nặng của lời nói? Tại sao không một chú hề linh hoạt, khiến người ta vừa cười vừa quên buồn phiền — dù chỉ trong một đêm?\n\nTa phải cân nhắc loại biểu diễn nào sẽ giữ khách bị mê hoặc. Họ ở lâu hơn, họ sẽ uống nhiều hơn."
  yearly.0028.a: "Thuê một nghệ sĩ ca hát tài hoa"
  yearly.0028.b: "Tìm một nhà thơ tài năng"
  yearly.0028.c: "Mang cho ta một chú hề linh hoạt"
  yearly.0028.a.gain.bard: "Có cơ hội #P nhận#! một nghệ sĩ ca hát cho triều đình."
  yearly.0028.b.gain.poet: "Có cơ hội #P nhận#! một nhà thơ cho triều đình."
  yearly.0028.c.gain.jester: "Có cơ hội #P nhận#! một chú hề cho triều đình."
  yearly.0028.tt.minor_xp_gain: "Kỹ năng thương lượng của ngươi phần nào có ích"
  yearly.0028.tt.major_xp_gain: "Kỹ năng thương lượng của ngươi rất có ích"

#Conclusion
  yearly.0029.t: "$yearly.0025.t.chain_title$: Đêm Khai Trương"
  yearly.0029.conclusion_intro: "Một buổi tối dài mệt mỏi cho lần xuất hiện đầu tiên của quán — đầy thăng trầm. Dự đoán được, nhưng vẫn kiệt sức."
  yearly.0029.refurbishment_bad.1: "Quán trọ mới của ta chắc chắn đã từng có những ngày tốt hơn. Hôm nay không phải một trong số đó.\n\n"
  yearly.0029.refurbishment_bad.2: "Ta hy vọng vết rò có thể giữ được. Thật tiếc, có nhiều mưa trên quầy hơn là bia.\n\n"
  yearly.0029.refurbishment_bad.3: "Mùi hương khó chịu vẫn không tan. Ta e rằng nó sẽ ám ảnh giấc mơ của ta mãi mãi.\n\n"
  yearly.0029.refurbishment_average.1: "Một vài ghế bị mất, nhưng cũng là lý do để đầu tư thêm.\n\n"
  yearly.0029.refurbishment_average.2: "Một vài khắc thô sơ trên bàn, không đáng kể.\n\n"
  yearly.0029.refurbishment_average.3: "May mắn thay, các sửa chữa vẫn ổn, dù trần kêu kẽo kẹt đáng ngại.\n\n"
  yearly.0029.refurbishment_good.1: "Đầu tư cho việc sửa chữa thật xứng đáng.\n\n"
  yearly.0029.refurbishment_good.2: "Một vài chỗ ngồi thêm cũng không hại gì.\n\n"
  yearly.0029.refurbishment_good.3: "May mắn thay, vị khách cuối cùng rời đi với nụ cười trên mặt.\n\n"
  yearly.0029.edibles_bad.1: "Thức ăn không được đánh giá cao... phần lớn thấm xuống sàn.\n\n"
  yearly.0029.edibles_bad.2: "Vài khách dám gọi món còn chẳng dám cắn một miếng.\n\n"
  yearly.0029.edibles_bad.3: "Mọi đĩa bỏ không là bữa tiệc nhỏ cho những con chuột địa phương. Hàng đàn, hàng đàn #EMP chuột.#!\n\n"
  yearly.0029.edibles_average.1: "Khách dường như thưởng thức phần lớn thức ăn, dù phải đuổi vài con chuột dũng cảm.\n\n"
  yearly.0029.edibles_average.2: "Một vài khách nghi ngờ bia được phục vụ, nhíu mày khi ngửi, nhưng rồi vẫn uống.\n\n"
  yearly.0029.edibles_average.3: "Dù thức ăn hay bia không tuyệt vời, khách vẫn vui vẻ. Thậm chí nhiều người say.\n\n"
  yearly.0029.edibles_good.1: "Chủ quán vất vả để đáp ứng nhu cầu, khách vừa ngồi xuống đã gọi thêm vòng khác.\n\n"
  yearly.0029.edibles_good.2: "Tiếng hò reo gần như làm ta điếc, kéo dài và vang vọng.\n\n"
  yearly.0029.edibles_good.3: "Không một đĩa nào được trả lại, dù chỉ còn một mẩu.\n\n"
  yearly.0029.entertainment_bard_bad: "Khi người hát rong bước lên vị trí trung tâm sân khấu, [entertainer.GetSheHe] có vẻ... lo lắng, như thể [entertainer.GetSheHe] chưa từng biểu diễn trước đám đông bao giờ. Ánh mắt sợ hãi như thể [entertainer.GetSheHe] vừa bước ra chiến trường, [entertainer.GetSheHe] hét lên một tiếng nhói tai duy nhất — rồi tháo chạy.\n\n"
  yearly.0029.entertainment_bard_average: "Người hát rong bước lên sân khấu với một dáng điệu có phần tự tin, kéo một chiếc ghế đẩu từ dưới đất lên rồi giẫm mạnh một trong những chiếc ủng nặng trịch của [entertainer.GetHerHis] lên trên đó. Ngay khi [entertainer.GetSheHe] mang cây đàn công hầu của [entertainer.GetHerHis] ra phía trước, sự tự tin trước đó trong tư thế của [entertainer.GetHerHis] liền biến mất. Đám đông phải đón nhận một bản ba-lát run rẩy, chói tai mà ngay cả một người ông người bà điếc lác đang hấp hối cũng chẳng thể nào thưởng thức nổi.\n\n"
  yearly.0029.entertainment_bard_good: "Lúc đầu, một giai điệu nhẹ vang từ bóng tối bên ngoài, thu hút mọi người say. Đám đông lặng đi, mắt hướng về cửa. Bài hát lớn dần, cửa mở ra, một nghệ sĩ đẹp trai bước vào. [entertainer.GetHerHis|U] cao trào rồi trở thành giai điệu vui tươi với tiếng reo hò — mở đầu cho nhiều màn biểu diễn sau.\n\n"
  yearly.0029.entertainment_poet_bad: "Nhà thơ bước lên sân khấu với một mảnh giấy da trên tay của [entertainer.GetHerHis], cố gắng hết sức để thu hút sự chú ý của đám đông trước khi bắt đầu, nhưng chẳng có mấy tác dụng. [entertainer.GetSheHe] nhìn kỹ hơn vào những ghi chép của [entertainer.GetHerHis], cố gắng ngâm nga trực tiếp vài dòng thơ — chỉ để rồi bị nhấn chìm trong một dàn tiếng la ó phản đối, và khóc lóc tháo chạy vào màn đêm.\n\n"
  yearly.0029.entertainment_poet_average: "Hào quang rạng ngời của nhà thơ đã thu hút mọi ánh nhìn ngay khi [entertainer.GetSheHe] bước vào, khiến ngay cả những vị khách đần độn nhất cũng phải ngước lên khỏi cốc bia của họ trước sự ồn ào đó. Ngay khi nhà thơ bắt đầu ngâm vịnh, phép màu liền tan biến: chẳng có gì ngoài một bài điếu ca để lôi cuốn họ, đám đông khờ khạo nhanh chóng mất đi sự hứng thú và quay trở lại với ly bia ale của mình.\n\n"
  yearly.0029.entertainment_poet_good: "Nhà thơ sải bước lên sân khấu một cách đầy kịch tính, ngâm những dòng thơ của [entertainer.GetHerHis] với một niềm đam mê mãnh liệt đến mức không một con tim nào có mặt ở đó không bị lay động. Những lời nói của [entertainer.GetHerHis|U] vang vọng một cách nặng nề đối với chúng ta, khiến mọi cảm xúc trước đó dường như... trở nên nhẹ bẫng khi so sánh. Không một linh hồn nào rời khỏi tửu quán ngày hôm đó mà không có giọt nước mắt lăn dài trên mắt — cho dù đó là niềm vui hay nỗi buồn.\n\n"
  yearly.0029.entertainment_jester_bad: "Ta đã bị gã hề chơi xỏ vì tin rằng [entertainer.GetSheHe] sẽ xuất hiện vào buổi tối, trong khi trên thực tế chẳng có dấu vết nào dẫn lại được hành tung của [entertainer.GetHerHim]. Sự kỳ vọng về buổi biểu diễn giải trí đêm nay nhanh chóng trở nên tồi tệ, khi đám đông khó tính cằn nhằn trong sự hoài nghi trước những lời bào chữa bủn xỉn của ta.\n\n"
  yearly.0029.entertainment_jester_average: "Chú hề làm không khí nhẹ nhàng hơn, nhưng kèm theo vài khoảng lặng và trò đùa không trúng đích với nông dân đơn giản và say rượu.\n\n"
  yearly.0029.entertainment_jester_good: "Chú hề lao lên sân khấu với tiếng hét và một cú nhào lộn. Quán nổ tung trong tiếng reo hò khi [entertainer.GetSheHe] xoay tròn, nhảy qua bàn ghế và khách. Mỗi pha đều kèm lời nói hóm hỉnh. Kết thúc một buổi tối tuyệt vời.\n\n"
  yearly.0029.conclusion_outro: "Công việc của ta ở đây đã xong."
  yearly.0029.a: "Một đêm thật tuyệt vời!"
 
