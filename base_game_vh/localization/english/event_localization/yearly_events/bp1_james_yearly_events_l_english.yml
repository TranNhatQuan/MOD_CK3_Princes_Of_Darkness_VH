l_english:
  bp1_yearly.9001.t:0 "Một Người Ngài Bằng Gỗ"
  bp1_yearly.9001.opening:0 "Bạn Bè thường thay đổi thất thường và hay phản bội, nhưng người Bạn Thân nhất của Ta chưa bao giờ phản bội Ta. Đồ chơi yêu thích của Ta không chỉ là đồ chơi, [ROOT.Char.GetSheHe] là người Bạn Thân nhất của Ta.\n\n"
  bp1_yearly.9001.desc.bully:0 "Tuy nhiên, [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] liên tục trêu chọc Ta trước mặt những đứa trẻ khác, nói rằng Ta thật đáng thương đến mức không thể có Ngài thật. Ta có thể vứt đồ chơi yêu thích sang một bên và những lời bắt nạt sẽ chấm dứt, nhưng điều đó có nghĩa là bỏ rơi người Bạn Thân nhất của Ta!"
  bp1_yearly.9001.desc.mentor:0 "Tuy nhiên, [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] vẫn khăng khăng rằng Ta hãy gạt Bạn Thân sang một bên và chơi với những đứa trẻ 'thật sự', nhưng [bp1_yearly_9001_toy_hater.GetSheHe] không hiểu được món đồ chơi ngọt ngào ấy có ý nghĩa thế nào với Ta!"
  bp1_yearly.9001.a:0 "Có lẽ Ta đã quá lớn để chơi với [ROOT.Char.GetHerHim] rồi."
  bp1_yearly.9001.b:0 "Ta sẽ không bao giờ bỏ rơi Bạn Thân của mình!"

  bp1_yearly.9002.desc.opening:0 "Mỗi ngày ta đều thấy [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)] chạy nhảy quanh [ROOT.Char.Custom('GetCourt')] với món đồ chơi yêu thích của [bp1_yearly_9001_shy_kid.GetHerHis] trên tay. Ta thậm chí đôi khi còn thấy [bp1_yearly_9001_shy_kid.GetHerHim] trốn vào một góc, trò chuyện với nó như thể đó là người bạn thân nhất của [bp1_yearly_9001_shy_kid.GetHerHis] vậy!\n\n"
  bp1_yearly.9002.desc.bully:0 "Thật đáng thương và Ta nghĩ đã đến lúc [bp1_yearly_9001_shy_kid.GetSheHe] phải học xem loại Tình bạn này mong manh thế nào."
  bp1_yearly.9002.desc.mentor:0 "Ta thấy điều này khá lạ, và Ta lo rằng nếu Ta không can thiệp, [bp1_yearly_9001_shy_kid.GetSheHe] sẽ lớn lên thành một đứa trẻ kém cảm xúc trong cơ thể [bp1_yearly_9001_shy_kid.GetWomanMan], nhưng [bp1_yearly_9001_shy_kid.GetSheHe] đã từ chối mọi yêu cầu hợp lý để đặt đồ chơi sang một bên."
  bp1_yearly.9002.a:0 "Ta sẽ phá hủy nó!"
  bp1_yearly.9002.b:0 "Có lẽ Ta nên để [bp1_yearly_9001_shy_kid.GetHerHim] yên."
  bp1_yearly.9002.c:0 "Ta sẽ phá nó và cầu xin [bp1_yearly_9001_shy_kid.GetSheHe] tha thứ cho Ta."
 
  bp1_yearly.9003.desc.child:0 "May mắn thay, [bp1_yearly_9001_toy_hater.GetName] đã quyết định tha cho Bạn Thân của Ta và để Ta chơi và trò chuyện với [ROOT.Char.GetHerHim] cả ngày!\n\nCó lúc trông như [bp1_yearly_9001_toy_hater.GetSheHe] định giết Bạn Thân của Ta, nhưng có vẻ Bạn ta vẫn sống sót để thấy một ngày khác."
  bp1_yearly.9003.desc.mentor:0 "Đứa trẻ ngọt ngào [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)] hôm nay đã đến gặp ta với những giọt nước mắt hạnh phúc trong đôi mắt của [bp1_yearly_9001_shy_kid.GetHerHis], kể với ta rằng món đồ chơi yêu thích của [bp1_yearly_9001_shy_kid.GetHerHis] suýt chút nữa đã bị [bp1_yearly_9001_toy_hater.GetName] phá hủy, nhưng may mắn được tha bổng.\n\nPhản ứng này có phần hơi thái quá đối với một thứ thực chất chỉ là một khúc gỗ không bị một đứa trẻ khác đập phá, nhưng dù sao thì đây cũng là một cơ hội để dạy dỗ."
  bp1_yearly.9003.a.child:0 "Hóa ra [bp1_yearly_9001_toy_hater.GetSheHe] không tệ đến vậy."
  bp1_yearly.9003.a.mentor:0 "Thấy chưa, ngay cả kẻ bắt nạt cũng có lúc tốt."
  bp1_yearly.9003.b.child:0 "Giờ Ta không cần ai khác nữa!"
  bp1_yearly.9003.b.mentor:0 "Nhưng [bp1_yearly_9001_toy_hater.GetSheHe] #EMP có thể đã #! phá nó!"
 
  bp1_yearly.9004.t:0 "Tình Bạn tan Vỡ"
  bp1_yearly.9004.desc:0 "Tôi không thể tin vào điều đó nữa. Một phút trước, người bạn thân nhất của tôi vẫn được ôm ấp an toàn trong vòng tay tôi, phút tiếp theo [ROOT.Char.GetSheHe] đã bị giằng lấy bởi đôi bàn tay cục súc của [bp1_yearly_9001_toy_hater.GetNamePossessive]! Giống như [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself], [bp1_yearly_9001_toy_hater.GetSheHe] cười phá lên và nhấc bổng [ROOT.Char.GetHerHim] lên không trung trước khi quật mạnh [ROOT.Char.GetHerHim] xuống đất, khiến [ROOT.Char.GetHerHim] chẳng còn lại gì ngoài một đống gỗ vụn nát trên sàn nhà. Tôi đã khóc thương cho người bạn yêu quý của mình, điên cuồng cố gắng ghép [ROOT.Char.GetHerHim] lại với nhau, nhưng vô ích. Tôi vừa chứng kiến một vụ giết người."
  bp1_yearly.9004.a:0 "Một ngày nào đó, Ta sẽ làm y hệt với [bp1_yearly_9001_toy_hater.GetHerHim]!"
  bp1_yearly.9004.b:0 "Khó khăn, nhưng Ta phải tha thứ cho [bp1_yearly_9001_toy_hater.GetHerHim]"
  bp1_yearly.9004.c:0 "Ta sẽ không bao giờ ra ngoài nữa!"
 
  bp1_yearly.9005.t:0 "Không Bao Giờ Tha Thứ"
  bp1_yearly.9005.desc.imprisoned:0 "Cuối cùng Ta đã nhốt [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] vào ngục nơi [bp1_yearly_9001_toy_hater.GetSheHe] thuộc về! [bp1_yearly_9001_toy_hater.SheHe|U] có lẽ đã quên rằng [bp1_yearly_9001_toy_hater.GetSheHe] đã phá hủy món đồ chơi quý giá của Ta, người Bạn Thân nhất, từ bao năm trước, nhưng Ta không quên. Ta không bao giờ quên và khó mà tha thứ.\n\n"
  bp1_yearly.9005.desc.guest:0 "Khi Ta tưởng sẽ có khoảnh khắc bình yên, Ta thấy [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] xuất hiện với tư cách khách tại triều đình! Ta thấy [bp1_yearly_9001_toy_hater.GetHerHim] mỗi ngày, ăn đồ của Ta và ngủ trên giường Ta như thể [bp1_yearly_9001_toy_hater.GetSheHe] sở hữu nơi này và Ta không thể chịu nổi nữa!\n\n"
  bp1_yearly.9005.desc.outro:0 "Câu hỏi còn lại, bây giờ [bp1_yearly_9001_toy_hater.GetSheHe] ở dưới quyền Ta, Ta phải làm gì với [bp1_yearly_9001_toy_hater.GetHerHim]? Làm thế nào để đạt được công lý cho một tội ác nghiêm trọng đến vậy?"
  bp1_yearly.9005.a:0 "Thời gian trả thù!"
  bp1_yearly.9005.b:0 "Thời gian giết chóc!"
  bp1_yearly.9005.c:0 "Thời gian để tha thứ."
  may_lead_to_vengeful:0 "Có thể dẫn đến [trait|E] [GetTrait('vengeful').GetName( GetNullCharacter )|LV]"
  may_lead_to_forgiving:0 "Có thể dẫn đến [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )|LV]"
  may_lead_to_shy:0 "Có thể dẫn đến [trait|E] [GetTrait('shy').GetName( GetNullCharacter )|LV]"
  bp1_living_as_peasant_modifier:0 "Sống Như Một Nông Dân"
  bp1_living_as_peasant_modifier_desc:0 "Nhân vật này dành nhiều thời gian sống cùng tầng lớp nông dân để tránh áp lực cai trị."
 
  bp1_yearly.9006.t:0 "Một Suy Nghĩ Đen Tối"
  bp1_yearly.9006.desc.intro:0 "Khi Ta đang trở về từ [ROOT.Char.GetFaith.HouseOfWorship], [bp1_yearly_9006_sinful_courtier.GetNameNoTooltip] tiến tới Ta với một nụ cười dâm đãng.\n\n"[ROOT.Char.GetFirstNameNoTooltip], Ta biết cả hai chúng ta đều"
  bp1_yearly.9006.desc.lustful:0 "tham gia vào những thú vui xác thịt mà [ROOT.Char.GetFaith.PriestNeuterPlural] muốn chúng ta từ chối!"
  bp1_yearly.9006.desc.gluttonous:0 "chia sẻ niềm đam mê với vô số hương vị và kết cấu mà thế giới này ban tặng trong nghệ thuật nấu ăn kỳ diệu. Thế giới được tạo ra với quá nhiều món ngon tuyệt vời, tội lỗi thực sự là không thưởng thức tất cả!"
  bp1_yearly.9006.desc.vengeful:0 "hưởng thụ việc kẻ thù nhận lấy hậu quả xứng đáng. Dù [ROOT.Char.GetFaith.PriestNeuterPlural] coi niềm vui khi kẻ thù đau khổ là 'tội lỗi', Ta tin rằng chúng ta chỉ là những người thực thi công lý thần thánh."
  bp1_yearly.9006.desc.sadistic:0 "phát cuồng trước những tiếng thét đau khổ của kẻ vô tội và bị nguyền rủa! Nếu họ sắp chết, sao không tận hưởng chút trò vui trước khi ra đi?"
  bp1_yearly.9006.desc.craven:0 "mệt mỏi trước những lời tuyên bố không ngừng về 'dũng cảm' mà những kẻ hung bạo này khoe khoang. Giết một [ROOT.Char.Custom('GetAnimalType')] thì có sao? Chỉ là rủi ro không cần thiết!"
  bp1_yearly.9006.desc.arbitrary:0 "biết rằng công lý chỉ là từ ngữ để biện minh cho những ý thích của người khác, và thực sự không ai biết công lý là gì. Điều gì khiến ý chí của ta là tùy tiện, nhưng ý chí của [ROOT.Char.GetFaith.PriestNeuterPlural] lại công bằng?"
  bp1_yearly.9006.desc.deceitful:0 "biết rằng 'sự thật' có thể uốn nắn theo cách giải trí, và những kẻ ngốc đủ ngu dại để tin vào sự dối trá thì đáng nhận hậu quả."
  bp1_yearly.9006.desc.chaste:0 "mệt mỏi với những thú vui xác thịt mà người khác tham gia như những loài vật thấp kém. Một đêm yên tĩnh giải trí và tự chiêm nghiệm có phải thanh bình hơn không, so với việc tham gia vào đống cơ thể mồ hôi hôi thối khác?"
  bp1_yearly.9006.desc.greedy:0 "biết rằng chúng ta phải giữ những gì thuộc về mình, và không cho gì cả cho kẻ nghèo và 'cần cù'! Nếu họ muốn của cải của chúng ta, có lẽ họ không nên phung phí của cải của chính mình."
  bp1_yearly.9006.desc.wrathful:0 "không giấu cảm xúc, để thù hận và giận dữ chảy tự do trong cơ thể. Họ bảo ta không được cảm nhận cảm xúc và kìm nén những gì bên trong, và gọi đó là đức hạnh."
  bp1_yearly.9006.desc.cynical:0 "thắc mắc quyền lực của nhà thờ trần thế trong các vấn đề tâm linh. Một [ROOT.Char.GetFaith.PriestNeuter] thực sự biết gì về [ROOT.Char.GetFaith.DivineRealm] mà ta không biết?"
  bp1_yearly.9006.desc.ambitious:0 "khát khao nhiều hơn những gì được [ROOT.Char.GetFaith.PantheonTerm] ban cho khi sinh ra. Chúng ta không thể hài lòng với những gì được trao khi biết mình định mệnh được nhiều hơn thế!"
  bp1_yearly.9006.desc.shy:0 "thấy việc giao tiếp với người khác hoàn toàn mệt mỏi. Chúng ta phải nói chuyện với quá nhiều người, nhưng họ chẳng có gì thú vị để nói và ta cũng không có gì thú vị để đáp lại. Sao phải tốn thời gian với họ khi ta có thể hạnh phúc hơn một mình?"
  bp1_yearly.9006.desc.callous:0 "không quan tâm chút nào đến nỗi đau của người khác. Làm sao ta có thể quan tâm đến cảm xúc thoáng qua của người khác khi hạnh phúc liên tục của chính ta đang bị đe dọa?"
  bp1_yearly.9006.desc.generic:0 "trung thực với bản thân, bất chấp những điều vô nghĩa mà [ROOT.Char.GetFaith.PriestNeuterPlural] tuyên truyền."
  bp1_yearly.9006.desc.outro:0 "Rốt cuộc, ai có thể nói chúng ta nên sống như thế nào theo ý [ROOT.Char.GetFaith.HighGodName]?\n\n"Rõ ràng chúng ta có nhiều điểm chung hơn khác biệt, và Ta nghĩ Ngài và Ta nên dành nhiều thời gian bên nhau, tránh xa bộ óc mục nát của những người đơn giản. Ngài thấy sao?""
  bp1_yearly.9006.a:0 "Ý kiến tuyệt vời, Ta đồng ý!"
  bp1_yearly.9006.b:0 "Những suy nghĩ tội lỗi của Ta không phải điều để tự hào!"
 
  bp1_yearly.9007.t:0 "Tấm Gương Trong Bùn"
  bp1_yearly.9007.desc:0 "Khi ta đi tuần du qua các con phố của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], xung quanh là đoàn tùy tùng gồm lính gác và cận thần như thường lệ, ta nhìn thấy một thứ khiến ta phải dừng lại và kinh ngạc.\n\nMột tên tá điền ăn xin không có gì ngoài bùn đất và giẻ rách để bảo vệ [bp1_yearly_9007_doppelganger.GetHerselfHimself] khỏi thời tiết khắc nghiệt đang nhìn chằm chằm vào ta với đôi mắt cầu xin tuyệt vọng. Ta đáng lẽ đã bỏ đi, nhưng có điều gì đó gần như quen thuộc ở kẻ hạ dân này.\n\nChính lúc đó, một thành viên trong đoàn tùy tùng của ta đã chỉ ra rằng [bp1_yearly_9007_doppelganger.GetSheHe] giống ta như đúc! Thật đau lòng khi thấy hình ảnh phản chiếu của chính mình đang lăn lộn trong vũng bùn nhơ bẩn, nhưng có lẽ ta có thể làm điều gì đó để sửa chữa sự bất công mang tính tạo hóa này."
  bp1_yearly.9007.a:0 "[bp1_yearly_9007_doppelganger.GetSheHe|U] sẽ gia nhập triều đình!"
  bp1_yearly.9007.b:0 "Hủy bỏ kẻ kép đáng ghét này."
  bp1_yearly.9007.c:0 "Bỏ qua và quên sinh vật kỳ lạ này."
 
  bp1_yearly.9008.t:0 "Sống Như Một Nửa Của Ta"
  bp1_yearly.9008.desc:0 "Đã một thời gian trôi qua kể từ khi ta đưa [bp1_yearly_9007_doppelganger.GetName] vào triều đình và thật dễ chịu khi chứng kiến kẻ thế thân của mình tham gia vào lối sống quý tộc, không còn phải lăn lộn trong vũng bùn nhơ bẩn và nghèo đói nữa.\n\n[bp1_yearly_9007_doppelganger.GetSheHe|U] tiếp cận ta với một tia sáng trong đôi mắt của [bp1_yearly_9007_doppelganger.GetHerHis] và đưa ra một lời đề nghị đầy thú vị. "Không một ai ở quê nhà biết tôi đang sống với giới quý tộc cả. Tôi đang nghĩ chúng ta nên thực hiện một cuộc tráo đổi, thưa [ROOT.Char.GetLadyLord] của tôi, tôi sẽ đóng giả ngài làm [ROOT.Char.GetTitleAsNameNoTooltip], and ngài có thể có một ngày sống như một thường dân như chúng tôi!""
  bp1_yearly.9008.a:0 "Người cai trị sẽ trở thành người bị cai trị trong một ngày!"
  bp1_yearly.9008.b:0 "Một đề nghị thật xúc phạm."
 
  bp1_yearly.9009.t:0 "Một Người Tình Khác"
  bp1_yearly.9009.desc.intro:0 "Ta tiến về phòng ngủ nghe tiếng động như một cuộc vật lộn điên rồ! Tiếng đập mạnh, lộn nhào và… tiếng thét của [bp1_yearly_9009_lover.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nKhi Ta xông vào phòng, Ta thấy bản sao của mình [bp1_yearly_9007_doppelganger.GetNameNoTooltip] hoàn toàn nude với [bp1_yearly_9009_lover.GetNameNoTooltip] làm những việc không thể tả!"
  bp1_yearly.9009.desc.lustful:0 "[bp1_yearly_9009_lover.GetSheHe|U] khóc. "Xin lỗi tình yêu của anh, chỉ là [bp1_yearly_9007_doppelganger.GetNameNoTooltip] là phiên bản hơi đẹp hơn của anh! Ngực Ta thổn thức vì [bp1_yearly_9007_doppelganger.GetHerHim]!""
  bp1_yearly.9009.desc:0 "[bp1_yearly_9009_lover.GetSheHe|U] khẳng định [bp1_yearly_9009_lover.GetSheHe] không biết đó không phải là Ta, nhưng Ta không chắc tin [bp1_yearly_9009_lover.GetHerHim]."
  bp1_yearly.9009.a:0 "Ra khỏi tầm mắt Ta, cả hai người!"
  bp1_yearly.9009.b:0 "Bắt kẻ xấu trai này vào tù."
  bp1_yearly.9009.c:0 "Ta không thể ngăn cản tình yêu thật sự."
  bp1_yearly.9009.d:0 "Bây giờ Ta nhận ra, Ta quan tâm cả hai!"
 
  bp1_yearly.9010.t:0 "Hai [ROOT.Char.GetTitleAsNameNoTooltip]s"
  bp1_yearly.9010.desc.intro:0 "[bp1_yearly_9007_doppelganger.GetName] xông vào phòng ngai của Ta,"
  bp1_yearly.9010.desc.drunk:0 "mùi hôi thối của [ROOT.Char.Custom('RegionalDrink')] nồng nặc bốc ra từ cơ thể của [bp1_yearly_9007_doppelganger.GetHerHis]. [bp1_yearly_9007_doppelganger.GetSheHe|U] lảo đảo tiến về phía ta với sự giận dữ trong đôi mắt của [bp1_yearly_9007_doppelganger.GetHerHis].\n\n"Kẻ mạo danh! Tên *#EMP nấc#!*"
  bp1_yearly.9010.desc.stoner:0 "bốc mùi khói cần sa và mồ hôi. Đôi mắt đẫm máu [bp1_yearly_9007_doppelganger.GetHerHis|U] nhăn nhó nhìn quanh đầu Ta khi [bp1_yearly_9007_doppelganger.GetSheHe] lảo đảo tiến tới, cười như một kẻ điên [bp1_yearly_9007_doppelganger.GetWomanMan] suốt đường.\n\n"Giả mạo! Cái *#EMP cough#!*"
  bp1_yearly.9010.desc.outro:0 "tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9007_doppelganger'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9007_doppelganger'))] kia không phải là [ROOT.Char.GetNameNoTooltip]! Ta mới là [ROOT.Char.GetNameNoTooltip] thực sự!\"\n\nMặc dù đó là một lời nói dối trắng trợn, triều đình của ta bằng cách nào đó dường như bị thuyết phục rằng thân phận thực sự của ta đang bị đem ra tranh chấp! Khi [bp1_yearly_9007_doppelganger.GetNameNoTooltip] rút vũ khí của [bp1_yearly_9007_doppelganger.GetHerHis] ra, rõ ràng bạo lực là câu trả lời duy nhất."
  bp1_yearly.9010.a:0 "Chỉ có thể là một người!"
  bp1_yearly.9010.a_tt: "Bắt đầu [single_combat_duel|E] với [bp1_yearly_9007_doppelganger.GetShortUIName]"
  bp1_yearly.9010.b:0 "Cận vệ, bắt kẻ giả mạo này!"
 
  bp1_yearly.9012.t:0 "Rắc Rối Nhân Đôi"
  bp1_yearly.9012.desc:0 ""Chiến thắng! Thấy chưa, chỉ có [ROOT.Char.GetNameNoTooltip] thật mới thắng được trong trận đấu công bằng!"\n\nBản sao của Ta tuyên bố chiến thắng và mặc dù nhiều người vẫn chưa tin, nhưng một số đã bị thuyết phục bởi màn trình diễn và bắt đầu nghi ngờ Ta. Một cuộc bỏ phiếu nhỏ được tổ chức trong giới quý tộc và Ta vẫn được công nhận là [ROOT.Char.GetNameNoTooltip] thật, dù chỉ với một tỷ lệ sít sao.\n\nDù phần lớn vẫn tin Ta là chính mình, nhưng đủ người đã bị thuyết phục rằng [bp1_yearly_9007_doppelganger.GetNameNoTooltip] mới thực sự là [ROOT.Char.GetNameNoTooltip] thật, khiến [bp1_yearly_9007_doppelganger.GetSheHe] rời đi với tuyên bố chiếm đoạt danh hiệu và một nhóm người tin rằng [bp1_yearly_9007_doppelganger.GetSheHe] chính là Ta!"
  bp1_yearly.9012.a:0 "Ta đang mất trí hay mọi người vậy?"
 
  bp1_yearly.9013.desc:0 "Khi chiến thắng của ta trước kẻ mạo danh được tuyên bố, bất kỳ ai từng hoài nghi về thân phận thực sự của ta dường như đều đã bị dập tắt. Binh lính của ta bắt giữ [bp1_yearly_9007_doppelganger.GetNameNoTooltip], kẻ vẫn đang rít lên và chế giễu ta, gào thét về vương quốc mà hắn đã bị từ chối.\n\nMặc dù [bp1_yearly_9007_doppelganger.GetNameNoTooltip] vẫn khẳng định mình là ta thực sự, nhưng sẽ có rất ít người lắng nghe [bp1_yearly_9007_doppelganger.GetHerHim] từ nơi giam cầm trong ngục tối của ta."
  bp1_yearly.9013.a:0 "Ta mừng vì mọi chuyện đã kết thúc."
 
  bp1_yearly.9014.t:0 "Hơn Cả Một Gương Mặt Xinh"
  bp1_yearly.9014.desc.soulmate:0 "Khi Ta nằm trên giường với người tình xinh đẹp [bp1_yearly_9007_doppelganger.GetNameNoTooltip], Ta nhận ra chúng Ta có nhiều điểm chung hơn cả ngoại hình. [bp1_yearly_9007_doppelganger.GetSheHe|U] là thiên tài và học giả, thường lặp lại những suy nghĩ mà Ta cũng từng nghĩ nhưng chưa tìm ra lời diễn đạt! Như thể tâm trí chúng Ta là một và có thể hoàn thiện ý nghĩ của nhau. Một mối quan hệ như vậy chỉ có thể là: tình yêu!\n\nNhưng liệu Ta có quá tự yêu mình đến mức gọi bản sao của Ta là hơn cả người tình mà là... tri kỷ?"
  bp1_yearly.9014.desc.lover:0 "Ta thấy mình dành nhiều thời gian hơn với [bp1_yearly_9007_doppelganger.GetName] ngọt ngào và xinh đẹp. Dù trước đây Ta chỉ xem [bp1_yearly_9007_doppelganger.GetHerHim] như phản chiếu nghiêm nghị của bản thân, Ta đã thấy công ty của [bp1_yearly_9007_doppelganger.GetHerHis] thật dễ chịu và an ủi. Khi chúng Ta đi dạo quanh triều đình cùng nhau, cả hai đông cứng khi tay chạm nhau.\n\nKhoảnh khắc ngắn ngủi ấy, da chạm da, làm má Ta nóng bừng và khi Ta lo lắng nhìn [bp1_yearly_9007_doppelganger.GetNameNoTooltip], dường như [bp1_yearly_9007_doppelganger.GetSheHe] cũng cảm thấy vậy.\n\nLiệu Ta có quá tự luyến đến mức xem bản sao của mình là... người tình?"
  bp1_yearly.9014.a:0 "Tất nhiên là có!"
  bp1_yearly.9014.a.arrogant:0 "Ta yêu Ta- ý Ta là Ngài, rất nhiều!"
  bp1_yearly.9014.b:0 "K-không! Chúng ta không thể!"
 
  bp1_yearly.9015.t:0 "Cần Có Hai Người"
  bp1_yearly.9015.desc:0 "Kể từ khi Ta bắt đầu dành thời gian với [bp1_yearly_9007_doppelganger.GetName] quyến rũ và xinh đẹp, [bp1_yearly_9015_living_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] có vẻ trầm ngâm và bực bội, có lẽ [bp1_yearly_9015_living_parent.GetSheHe] không tán thành mối quan hệ của chúng Ta?\n\nVới chút áp lực, [bp1_yearly_9015_living_parent.GetNameNoTooltip] bật ra một lời thú nhận đầy nước mắt. "Con là sinh đôi, [ROOT.Char.GetFirstNameNoTooltip]! Khi con ra đời, ta không muốn quyền kế vị của con bị thách thức nên đã tách hai con ra. Ta chưa bao giờ nghĩ các con sẽ tìm thấy nhau!"\n\nMột lời thú nhận gây sốc, nhưng Ta phải làm gì với thông tin này?"
  bp1_yearly.9015.a:0 "Ôm Ta đi, [bp1_yearly_9007_doppelganger.Custom('SisterBrother')]!"
  bp1_yearly.9015.b:0 "Không ai được biết."
 
  bp1_yearly.9016.t:0 "Kẻ [bp1_yearly_9016_uppity_child.GetWomanMan|U] Ngạo Mạn Muốn Làm [ROOT.Char.GetTitleAsNameNoTooltip]"
  bp1_yearly.9016.desc.intro:0 "Một buổi tụ họp gia đình bình thường tại đại sảnh [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] nhanh chóng biến thành cuộc cãi vã nảy lửa giữa [bp1_yearly_9016_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] và [bp1_yearly_9016_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\n[bp1_yearly_9016_uppity_child.GetSheHe|U] khẳng định rằng [bp1_yearly_9016_heir.GetNameNoTooltip] hoàn toàn không xứng làm người thừa kế của Ta."
  bp1_yearly.9016.desc.not_a_child:0 ""[bp1_yearly_9016_heir.GetSheHe|U] còn chẳng phải [bp1_yearly_9016_heir.Custom('GetDaughterSon')] của Ngài! [bp1_yearly_9016_heir.GetSheHe] có quyền gì để kế thừa khi Ngài ra đi đến [ROOT.Char.GetFaith.PositiveAfterLife]?"
  bp1_yearly.9016.desc.bastard:0 "[bp1_yearly_9016_heir.GetSheHe|U] không phải là đứa [bp1_yearly_9016_heir.Custom('GetDaughterSon')] hợp pháp của gia tộc này. Ta được sinh ra một cách danh chính ngôn thuận trong sự kết hợp của cả cha lẫn mẹ ta, tại sao đứa con hoang này lại được lên ngôi?"
  bp1_yearly.9016.desc.child_of_concubine:0 ""[bp1_yearly_9016_heir.GetSheHe|U] sinh ra từ một phi tần hèn hạ! Ta là kết quả của [bp1_yearly_9016_uppity_child.Custom('GetCulturallyAppropriateMarriageReference')] giữa Ngài và [bp1_yearly_9016_uppity_child.GetMother.GetName] và ngai vàng thuộc về Ta theo quyền sinh ra!"
  bp1_yearly.9016.desc.rival:0 ""[bp1_yearly_9016_heir.GetSheHe|U] phản bội Ngài hàng ngàn lần trong khi Ta vẫn trung thành! Làm sao chúng ta tin đứa thú dâm đãng này sẽ chăm lo [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] khi Ngài ra đi khi mà [bp1_yearly_9016_heir.GetSheHe] còn không chăm lo Ngài lúc Ngài vẫn còn đây?"
  bp1_yearly.9016.desc.fallback:0 ""[bp1_yearly_9016_heir.GetSheHe|U] hoàn toàn không xứng ngai vàng và chỉ xứng làm hề của Ta sau khi kế vị! Bạn ta đứng đầu trong cuộc đua ngai vàng quá lâu và nên bị đặt lại đúng vị trí của [bp1_yearly_9016_heir.GetHerHis]."
  bp1_yearly.9016.desc.outro:0 "Ta thách đấu với ngươi, [bp1_yearly_9016_heir.GetNameNoTooltip]! Một trận đấu cho ngai vàng!" 
  bp1_yearly.9016.a:0 "Ồ, chuyện này sẽ hay đây."
  bp1_yearly.9016.b:0 "Ngồi xuống đi, kẻ ngốc!"
  9016_uppity_child_wins:0 "[bp1_yearly_9016_uppity_child.GetName] thắng trận đấu"
  9016_heir_wins:0 "[bp1_yearly_9016_heir.GetName] thắng trận đấu"
 
  bp1_yearly.9017.t.culture:0 "Người Ngoại Lạ [bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')]"
  bp1_yearly.9017.t.faith:0 "Kẻ Ngoại Đạo [bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')]"
  bp1_yearly.9017.desc.intro:0 "Bên lửa đêm, Ta thấy [bp1_yearly_9017_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)] suy tư với cường độ của [ROOT.Char.GetFaith.KnowledgeGodName]. Ta hỏi [bp1_yearly_9017_uppity_child.GetHerHim] điều gì khiến [bp1_yearly_9017_uppity_child.GetHerHim] phiền lòng, và [bp1_yearly_9017_uppity_child.GetSheHe] quay sang Ta với cơn giận và sự xấu hổ cháy trong mắt [bp1_yearly_9017_uppity_child.GetHerHis].\n\n"
  bp1_yearly.9017.desc.culture:0 "\"Ta khác với các người! Ta không biết phong tục và truyền thống của [ROOT.Char.GetCulture.GetName]. Ta cảm thấy cô đơn ở đây, một [bp1_yearly_9017_uppity_child.GetCulture.GetName] [bp1_yearly_9017_uppity_child.GetWomanMan] sống giữa [ROOT.Char.GetCulture.GetCollectiveNoun] trong triều đình như thể Ta có quyền tự gọi mình là một trong số họ.\""
  bp1_yearly.9017.desc.faith:0 "\"Ta không giống họ! Ta không cầu nguyện và thờ phượng như các [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] của các ngươi! Ta là một [bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip] sắp kế thừa một [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] của kẻ ngoại đạo.\""
  bp1_yearly.9017.desc.outro:0 "\"Ta là kẻ giả mạo và Ta không thể là người thừa kế của các ngươi nữa!\""
  bp1_yearly.9017.a:0 "Khác biệt của chúng ta nên được tôn vinh, [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)] của ta!"
  bp1_yearly.9017.b.culture:0 "[bp1_yearly_9017_uppity_child.GetCulture.GetName] hay [ROOT.Char.GetCulture.GetName], ngươi vẫn là [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)] của ta."
  bp1_yearly.9017.b.faith:0 "[bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip] hay [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], ngươi vẫn là [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)] của ta."
  bp1_yearly.9017.c:0 "Ý hay đấy, ngươi bị truất quyền thừa kế!"
  cultural_acceptance_embraced_child:0 "Đón nhận văn hóa"
  cultural_acceptance_rejected_child:0 "Bị loại khỏi văn hóa"
 
  bp1_yearly.9018.t:0 "Đam Mê hay Thanh Khiết"
  bp1_yearly.9018.desc.intro:0 "Trong khoảnh khắc yếu đuối, [bp1_yearly_9018_illegitimate_child.Custom2('MyCharacterIntroduction', ROOT.Char)] lao đến Ta, vòng tay [bp1_yearly_9018_illegitimate_child.GetHerHis] ôm quanh chân Ta, làm Ta dính đầy nước mắt và chất nhờn của [bp1_yearly_9018_illegitimate_child.GetHerHis].\n\n"
  bp1_yearly.9018.desc.bastard:0 "\"[ROOT.Char.GetMotherFather|U]! Thật *#EMP sniff#!* kinh khủng, Ta không chịu nổi nữa! [bp1_yearly_9018_bully.GetName|U] đã liên tục trêu chọc Ta, nói rằng Ta sinh ra không có đạo đức và không xứng đáng được yêu thương. Hãy nói với Ta rằng điều đó không đúng!\"\n\n"
  bp1_yearly.9018.desc.child_of_concubine:0 ""[ROOT.Char.GetMotherFather|U] ơi! [bp1_yearly_9018_bully.GetName|U] nói rằng con cái của vợ lẽ là thứ không thuần khiết! [bp1_yearly_9018_bully.GetSheHe|U] cứ bịt mũi của [bp1_yearly_9018_bully.GetHerHis] lại và bảo con nồng nặc dòng máu của một người thiếp. Hãy nói là người yêu con đi, [ROOT.Char.GetMotherFather]!"\n\n"
  bp1_yearly.9018.desc.outro.callous:0 "Lúc này Ta có thể nói bất cứ điều gì để đứa nhóc này buông ra, nhưng Ta nên nói gì đây?"
  bp1_yearly.9018.desc.outro:0 "Rõ ràng đây là một khoảnh khắc rất nhạy cảm với [bp1_yearly_9018_illegitimate_child.Custom('GirlBoy')], nhưng nên nói gì?"
  bp1_yearly.9018.a:0 "Có lẽ đã đến lúc ba chúng ta cần nói chuyện."
  bp1_yearly.9018.b:0 "[bp1_yearly_9018_bully.Custom('GirlBoyPlural')|U] sẽ là [bp1_yearly_9018_bully.Custom('GirlBoyPlural')]!"
  bp1_yearly.9018.c:0 "Tại sao lại khóc? Điều này rõ ràng có thể giải quyết bằng bạo lực."
  9018_uppity_child_wins:0 "[bp1_yearly_9018_illegitimate_child.GetName] thắng cuộc đấu"
  9018_bully_child_wins:0 "[bp1_yearly_9018_bully.GetName] thắng cuộc đấu"
 
  bp1_yearly.9019.t:0 "Một [bp1_yearly_9019_lover.GetWomanMan|U] Trong Giường Chúng Ta"
  bp1_yearly.9019.desc.intro.gay:0 "Thời khắc Ta e ngại đã đến. Ta khẽ rùng mình và đi nhón chân vào [ROOT.Char.Custom('GetChamber')], biết rằng [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] đang chờ bên trong, mong đợi một buổi tối làm tình không đam mê."
  bp1_yearly.9019.desc.intro.bi:0 "Thời khắc đã đến để một lần nữa vào [ROOT.Char.Custom('GetChamber')] và cố gắng sinh con với [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]."
  bp1_yearly.9019.desc.bridge:1 "Nhưng thật bất ngờ, Ta thấy [bp1_yearly_9019_spouse.GetHerHim] mặc quần áo đầy đủ bên cạnh một [bp1_yearly_9019_lover.GetWomanMan] khỏa thân! Ta yêu cầu giải thích, khiến một nụ cười hiểu chuyện xuất hiện trên mặt [bp1_yearly_9019_spouse.GetHerHis].\n\n"
  bp1_yearly.9019.desc.bridge.gay:0 "\"Ta đã biết từ lâu rằng sự chạm vào một [bp1_yearly_9019_spouse.GetWomanMan] chưa bao giờ thắp lên lửa ham muốn trong cơ thể ngươi.\""
  bp1_yearly.9019.desc.bridge.bi:0 "\"Ta đã biết từ lâu rằng ngươi khao khát sự chạm vào một [bp1_yearly_9019_lover.GetWomanMan].\""
  bp1_yearly.9019.desc.compassionate:0 "Ta không hằn học hay ghen tị, Ta chỉ muốn ngươi hạnh phúc, vì vậy có lẽ cuộc yêu của chúng ta sẽ đầy yêu thương nếu chúng ta thêm [bp1_yearly_9019_lover.GetWomanMan] của ngươi vào!\""
  bp1_yearly.9019.desc.lustful:0 "Điều đó không quan trọng với Ta, Ta chỉ muốn một đêm nồng nàn! Có lẽ sẽ vui hơn cho cả hai nếu chúng ta thêm  Bạn củachúng ta vào cuộc yêu."
  bp1_yearly.9019.desc.cynical:0 "Thành thật mà nói, Ta không quan tâm ngươi muốn làm tình với ai hay gì, Ta chỉ muốn một đứa con thật sự của riêng mình từ cuộc hôn nhân của chúng ta."
  bp1_yearly.9019.desc.lover:0 "\n\nTa tự hỏi [bp1_yearly_9019_spouse.GetSheHe] có biết rằng [bp1_yearly_9019_lover.GetName] và Ta đã quá quen thuộc với cơ thể nhau, nhưng dù sao đây cũng là một bất ngờ không ngờ tới!"
  bp1_yearly.9019.desc.friend:0 "\n\nMặc dù Ta không bao giờ ngờ thấy Bạn Thân mình trong tư thế này, Ta không thể nói thật rằng Ta không thích những gì thấy."
  bp1_yearly.9019.desc.stranger:0 "\n\nTa tự hỏi [bp1_yearly_9019_spouse.GetSheHe] đã tìm thấy [bp1_yearly_9019_lover.GetWomanMan] tội nghiệp này ở đâu, nhưng [bp1_yearly_9019_lover.GetSheHe] trông rõ ràng rất hứng thú."
  bp1_yearly.9019.desc.outro:0 ""
  bp1_yearly.9019.a:0 "Nhờ [ROOT.Char.GetFaith.FertilityGodName], tất cả điều ước của Ta đã thành hiện thực?"
  bp1_yearly.9019.b:0 "Im lặng, [bp1_yearly_9019_spouse.Custom2('InsultNoun', ROOT.Char)]! Ta sẽ nằm với [bp1_yearly_9019_lover.GetHerHim] một mình!"
  bp1_yearly.9019.c:0 "Gì cơ? Không, Ta không thể làm thế!"
 
  bp1_yearly.9020.t:0 "Một Yêu Cầu Kỳ Lạ"
  bp1_yearly.9020.desc.intro:0 "Thời khắc lại đến để Ta cố gắng sinh con với [bp1_yearly_9020_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)], nhưng khi Ta chuẩn bị cho một đêm làm tình không đam mê nữa, [bp1_yearly_9020_spouse.GetSheHe] nhìn Ta với ánh mắt đáng sợ trong mắt [bp1_yearly_9020_spouse.GetHerHis].\n\n\"Làm tình theo cách thông thường thật là vất vả, ngươi không đồng ý sao? Ngươi đã bao giờ nghĩ tới"
  bp1_yearly.9020.desc.goat:0 "việc làm với một con dê chưa? Những cái sừng, bộ râu xồm xoàm, cách chúng chẳng quan tâm ăn gì. Nếu ta đưa một con vào [ROOT.Char.Custom('GetChamber')], mùi hăng của nó thôi cũng đủ thắp lửa trong tim ta!\""
  bp1_yearly.9020.desc.vegetable:0 "sự gợi dục tự nhiên của rau củ sao? Hãy tưởng tượng cảm giác khi có một trong những món quà của [ROOT.Char.GetFaith.CreatorNamePossessive] từ đất áp vào da ngươi ở những nơi nhạy cảm nhất?\""
  bp1_yearly.9020.desc.bondage:0 "cảm giác bị giam giữ ra sao? Bị trói trong xích, phó mặc cho những ý muốn tàn nhẫn của cai ngục thích nghe tiếng la hét. Chỉ cần nghĩ tới việc lấy một ít xích và... thiết bị từ [ROOT.Char.Custom('GetDungeon')] cũng đủ thấy kinh ngạc.\""
  bp1_yearly.9020.desc.feet:0 "cảm giác khi trở thành mặt đất trong [ROOT.Char.Custom('GetChamber')] sao? Những bàn chân trần đè lên cơ thể ngươi, chỉ là vật bị người khác dùng và giẫm lên. Chỉ nghĩ thôi cũng làm ham muốn của Ta bùng cháy!\""
  bp1_yearly.9020.desc.hof:0 "cảm giác khi nằm với [ROOT.Char.ReligiousHeadTitleName] ra sao? Tất cả thời gian, những ngón tay của [ROOT.Char.ReligiousHeadTitleName] lướt qua sách thánh, sao không tưởng tượng xem sẽ ra sao! Hãy là [ROOT.Char.ReligiousHeadTitle] của ta và biến ta thành [ROOT.Char.GetFaith.ReligiousText] của ngươi!\""
  bp1_yearly.9020.desc.outro:0 "\n\nTa không tìm ra lời để mô tả những gì vừa được nói, nhưng với tư cách là một [ROOT.Char.GetTitleAsNameNoTooltip], nghĩa vụ của Ta là làm vừa lòng [bp1_yearly_9020_spouse.GetTitleAsNameNoTooltip] và đem thêm con đẻ thật sự vào thế giới này, bất kể giá nào. Biết đâu, Ta sẽ thích nó."
  bp1_yearly.9020.a:0 "Bất cứ điều gì để làm ngươi vui."
  bp1_yearly.9020.b:0 "Không! Chỉ trừ điều đó ra!"
  bp1_yearly.9020.c:0 "Mọi người sẽ biết sự biến thái tởm lợm của ngươi."
 
  bp1_yearly.9021.t:0 "Kẻ [ROOT.Char.GetFaith.DevilName|U] Trong Giường Ta"
  bp1_yearly.9021.desc:0 "Ngôn từ thậm chí không thể bắt đầu mô tả sự căm ghét thuần túy trong lòng ta dành cho [bp1_yearly_9021_rival_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)], nhưng than ôi, nghĩa vụ của một [ROOT.Char.GetTitleAsNameNoTooltip] đòi hỏi ta phải gạt bỏ cảm xúc cá nhân sang một bên để "ân ái" với tên [bp1_yearly_9021_rival_spouse.Custom2('InsultNoun', ROOT.Char)] [bp1_yearly_9021_rival_spouse.Custom2('InsultAdjective', ROOT.Char)] này.\n\nTa cứ ngỡ mình sẽ ghê tởm từng khoảnh khắc ấy, nhưng khi chúng ta bắt đầu cuộc mây mưa tẻ nhạt, ta cảm thấy một ngọn lửa bùng lên khắp cơ thể mà ta chưa từng trải qua bao giờ. Nhìn vào sự hằn học và căm thù thuần túy trong đôi mắt của [bp1_yearly_9021_rival_spouse.GetHerHis], ta cảm thấy tim mình đập loạn nhịp và dục vọng trỗi dậy mạnh mẽ. Ta có thể nhận ra [bp1_yearly_9021_rival_spouse.GetSheHe] cũng cảm thấy như vậy qua cái cách [bp1_yearly_9021_rival_spouse.GetSheHe] ghì chặt ta xuống và mơn trớn đôi bàn tay của [bp1_yearly_9021_rival_spouse.GetHerHis] khắp cơ thể ta với sự khinh miệt và đam mê hòa quyện ngang nhau. Cảm xúc này là gì đây? Tình yêu? Sự thù hận? Hay một sự kết hợp đê hèn của cả hai?\n\nBất kể cảm xúc này là gì, nó có lẽ là một tội lỗi, nhưng liệu sự ân ái nồng nhiệt giữa những người phối ngẫu được kết hôn trước sự chứng giám của [ROOT.Char.GetFaith.HighGodName] có thể là một tội lỗi sao? Ngay cả khi chúng ta căm ghét lẫn nhau, điều đó có nghĩa là chúng ta không được phép tận hưởng nghĩa vụ giao hoan của mình sao?"
  bp1_yearly.9021.a:0 "Ta ghét ngươi, cưng! Ôm Ta gần hơn."
  bp1_yearly.9021.b:0 "Chắc Ta đã tưởng tượng một lưỡi dao trên cổ mềm mại đó."
 
  bp1_yearly.9022.t:0 "Một Sự Can Thiệp Thân Thiện"
  bp1_yearly.9022.desc.intro:0 "Ta trở về [ROOT.Char.Custom('GetChamber')] của mình sau một ngày khó khăn khác khi gánh vác cương vị [ROOT.Char.GetTitleAsNameNoTooltip], but ta nhanh chóng nhận ra mình không hề cô độc. Ta thấy [bp1_yearly_9022_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] đang đứng đó với một vẻ mặt không mấy vui vẻ hiện rõ trên khuôn mặt của [bp1_yearly_9022_friend.GetHerHis].\n\n"[ROOT.Char.GetFirstNameNoTooltip],""
  bp1_yearly.9022.desc.hashishiyah:0 "chúng ta đều thỉnh thoảng thích một miếng bánh hashish, nhưng khi Ta nói với ngươi, dường như Ta chỉ nói với hashish. Hầu như không còn [ROOT.Char.GetFirstNameNoTooltip] mà Ta từng biết trong trạng thái gần như mê man của ngươi, Ta khao khát những cuộc trò chuyện có ý nghĩa."
  bp1_yearly.9022.desc.drunkard:0 "mỗi lần nói chuyện, Ta chỉ ngửi thấy mùi [ROOT.Char.Custom('RegionalDrink')] trên hơi thở và lời nói lắp bắp của kẻ say rượu thiếu não từ miệng ngươi. Uống rượu đôi khi cũng vui, nhưng thật lòng, Ta khó nhớ lần cuối thấy ngươi tỉnh táo là khi nào."
  bp1_yearly.9022.desc.rakish:0 "sự nghiện bất lực với gái điếm và nhà thổ đang mang một căn bệnh lớn lên thân xác và linh hồn ngươi. Ngươi đã có quá nhiều người tình ẩn danh đến mức nếu ngươi là gia súc, Ta sẽ giết ngươi như một biện pháp phòng ngừa và nhân đạo."
  bp1_yearly.9022.desc.comfort_eater:0 "có lúc nào ngươi không nhai cái gì đó không? Thức ăn là món quà tự nhiên của [ROOT.Char.GetFaith.CreatorName], nhưng khi thấy ngươi ăn, rõ ràng không có niềm vui. Cần bao nhiêu thức ăn để lấp đầy khoảng trống trong linh hồn ngươi?"
  bp1_yearly.9022.desc.inappetetic:0 "lần cuối ngươi ăn khi nào? Ngươi trông như xác chết, làn da như túi trùm trên tháp xương run rẩy. Khi nhìn ngươi, bản năng chăm sóc nổi lên và Ta chỉ muốn thấy ngươi ăn uống đầy đủ, giàu dinh dưỡng. Bao lâu nữa trước khi ngươi tiêu tan thành bụi?"
  bp1_yearly.9022.desc.flagellant:0 "tại sao ngươi lại tự làm đau mình vậy? Khi gây thương tích cho bản thân, đó thật sự vì [ROOT.Char.GetFaith.HighGodName] hay là cầu xin ai đó nhận ra nỗi đau trong tâm hồn? Nào, nói chuyện với Ta, Ta không chịu được nhìn thấy thêm một vết sẹo trên cơ thể người Bạn Thân."
  bp1_yearly.9022.desc.reclusive:0 "Ta phải rình ngươi để được nói một lời sao? Lần cuối ngươi gặp ai ngoài nhiệm vụ là khi nào? Ta không chịu được ngồi nhìn bên lề, van xin chỉ một chút sự chú ý từ ngươi."
  bp1_yearly.9022.desc.outro:0 "Để Ta giúp ngươi, [ROOT.Char.GetFirstNameNoTooltip].\"\n\nTa hoàn toàn kinh ngạc, ai mà [bp1_yearly_9022_friend.GetSheHe] để phán xét cách Ta sống?\n\n\"Cứ từ từ. Ta không đi đâu đâu.\""
  bp1_yearly.9022.a:0 "Ngươi đúng. Ta cần giúp đỡ."
  bp1_yearly.9022.b:0 "Ra ngoài! Ngay bây giờ!"
 
  bp1_yearly.9023.t:0 "Rào Cản Ngôn Ngữ"
  bp1_yearly.9023.desc:0 "Ta rất thích dành thời gian với [bp1_yearly_9023_friend.Custom2('MyCharacterIntroduction', ROOT.Char)], dù thường cần thông dịch viên. Thường thì rào cản ngôn ngữ không phải vấn đề, nhưng hôm nay dường như Ta làm người Bạn Thân buồn với điều gì đó Ta nói.\n\n[bp1_yearly_9023_friend.GetSheHe|U] nói điều gì đó nghe như một trò đùa, Ta cười để lễ phép, nhưng rồi [bp1_yearly_9023_friend.GetSheHe] nhìn Ta với ánh mắt nói lên cả nghìn lời. Khi ánh mắt đó xuyên thấu tâm hồn, Ta thấy Tình bạn vượt ngôn ngữ dường như đang rạn nứt.\n\nTa phải làm gì để sửa tình huống này và giữ gìn Tình bạn?"
  bp1_yearly.9023.a:0 "Lầm bầm gì đó nghe giống [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip] và hy vọng mọi chuyện ổn."
  bp1_yearly.9023.b:0 "Có lẽ Ta nên học [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip]."
  bp1_yearly.9023.c:0 "[bp1_yearly_9023_friend.GetNameNoTooltip] nên học [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!"
 
  bp1_yearly.9024.t:0 "Một Bàn Tay Quan Tâm"
  bp1_yearly.9024.desc:0 "Cơn bệnh đang rút cạn sinh lực Ta, nhưng may mắn Ta có [bp1_yearly_9024_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] chăm sóc tận tình khi Ta hồi phục.\n\n[bp1_yearly_9024_friend.GetSheHe|U] thực sự làm Ta cảm thấy được nâng niu dù tình trạng của Ta; nấu ăn, giặt quần áo, chăm sóc Ta như thể [bp1_yearly_9024_friend.GetSheHe] chỉ là một kẻ hầu hèn mọn!"
  bp1_yearly.9024.a:0 "Thật vui khi có những người Ngài quan tâm như vậy."
  bp1_yearly.9024.b:0 "Ta tự chăm sóc được!"
  bp1_sickness_being_doted_on:0 "Được chăm sóc tận tình"
  bp1_sickness_being_doted_on_desc:0 "Nhân vật này được chăm sóc mọi nhu cầu khi đang ốm."
 
  bp1_yearly.9025.t:0 "Ta Đã Biết Ngươi"
  bp1_yearly.9025.desc:0 "Cuối cùng, Ta và [bp1_yearly_9025_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] đã cùng chung ngôn ngữ và trò chuyện qua lại khá lâu.\n\nVấn đề duy nhất là, Ta nhanh chóng nhận ra rằng Ta hoàn toàn ghét từng lời rác rưởi rơi ra từ miệng [bp1_yearly_9025_friend.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9025_friend.Custom2('InsultNoun', ROOT.Char)]. Nếu không có sự hiểu lầm, Ta tự hỏi làm sao ai đó có thể gọi [bp1_yearly_9025_friend.GetWomanMan] này là Ngài một cách chân thành.\n\nThật là thảm họa và Ta nhớ những ngày chỉ ngồi yên trong sự hiện diện an ủi của [bp1_yearly_9025_friend.GetHerHis], không biết gì về sự hư hỏng trong trái tim [bp1_yearly_9025_friend.GetHerHis]."
  bp1_yearly.9025.a:0 "Ra khỏi mắt Ta ngay bây giờ."
  bp1_yearly.9025.b:0 "Có lẽ Ta vẫn có thể làm chuyện này ổn."
 
  bp1_yearly.9026.t:0 "Gương Mặt Từ Ngày Xưa"
  bp1_yearly.9026.desc.intro:0 "Ta nằm xuống giường, êm ái như một trẻ sơ sinh bên bầu sữa mẹ, nhưng ngay khi mắt nặng nhắm lại để nghỉ ngơi, Ta bật dậy khi thấy một hình bóng ngồi bên cạnh!\n\nKinh hoàng thay, đó không ai khác là người Ngài đã mất của Ta, [bp1_yearly_9026_dead_friend.GetFullName]! [bp1_yearly_9026_dead_friend.GetSheHe|U] cười khinh khỉnh khi Ta hét lên trong sợ hãi.\n\n\"Nào [ROOT.Char.GetFirstNameNoTooltip], đó có phải cách chào Ngài cũ sao? Ta đến với ngươi mang lời cảnh báo,\""
  bp1_yearly.9026.desc.secret_murderer:0 "chúng ta biết ngươi đã làm gì với [bp1_yearly_9026_murder_victim.GetName], Bạn ta."
  bp1_yearly.9026.desc.murderer:0 "ngươi có thể sẽ không bao giờ được tha thứ cho vụ giết [bp1_yearly_9026_murder_victim.GetName]."
  bp1_yearly.9026.desc.killer:0 "ngươi là lý do [bp1_yearly_9026_murder_victim.GetFullName] hiện ở [ROOT.Char.GetFaith.PositiveAfterLife|U]."
  bp1_yearly.9026.desc.greedy:0 "người phụ thuộc của ngươi đang gánh chịu gánh nặng của lòng tham không hối lỗi của ngươi."
  bp1_yearly.9026.desc.wrathful:0 "không có ai không sợ cơn giận khủng khiếp của ngươi."
  bp1_yearly.9026.desc.torturer:0 "nỗi đau mà ngươi vui mừng gây ra cho đồng loại [ROOT.Char.GetWomanMan] là một tội với phẩm giá con người, và mỗi lỗ khoan trên da nạn nhân lại khoan sâu hơn vào trái tim ngươi."
  bp1_yearly.9026.desc.arbitrary:0 "sự không hiểu khái niệm công lý và đạo đức khiến mọi người run sợ trước phán xét của ngươi."
  bp1_yearly.9026.desc.callous:0 "sự thiếu quan tâm và lòng trắc ẩn cơ bản với nỗi đau của người khác làm phán xét của ngươi trở nên nhẹ như lông hồng, nhưng trái tim ngươi nặng như gạch từ mỗi việc xấu ngươi gây ra."
  bp1_yearly.9026.desc.sadistic:0 "mỗi lần ngươi vui mừng gây đau cho người khác, ngươi siết chặt sợi dây quanh cổ linh hồn mình."
  bp1_yearly.9026.desc.vengeful:0 "mỗi lần trả thù những kẻ đã làm hại ngươi, ngươi lại xa [ROOT.Char.GetFaith.HighGodName|U] thêm một bước. Chúng có đáng không?"
  bp1_yearly.9026.desc.deceitful:0 "những mưu mô và dối trá vô tận để đạt mục đích sẽ giết ngươi cuối cùng. Khi nào sự thật sẽ đủ? Ngươi có biết thực là gì không?"
  bp1_yearly.9026.desc.impatient:0 "sự thiếu kiên nhẫn biến ngươi thành quái vật, luôn chuyển sang việc tiếp theo mà không chừa chỗ cho ai 'lãng phí thời gian'."
  bp1_yearly.9026.desc.arrogant:0 "tình yêu ngươi dành cho bản thân khiến ngươi tê liệt trước tình yêu đồng loại. Tình yêu chỉ ở trong lòng có ích gì?"
  bp1_yearly.9026.desc.craven:0 "sự hèn nhát để lại vết nhơ trên lương tâm ngươi lớn hơn máu trận. Bao nhiêu chiến binh dũng cảm đã chết thay ngươi?"
  bp1_yearly.9026.desc.ambitious:0 "tham vọng vô tận khiến ngươi nhẫn tâm với nỗi đau của tất cả kẻ cản đường. Bao nhiêu tước vị phải nắm? Bao nhiêu trận chiến phải thắng mới bằng lòng?"
  bp1_yearly.9026.desc.lazy:0 "sự lười biếng cho phép ý chí của [ROOT.Char.GetFaith.DevilName|U] diễn ra không kiểm soát. Ngươi có nghĩ mình trên cả bổn phận với tư cách [ROOT.Char.GetTitleAsNameNoTooltip]? Còn bổn phận với đồng loại [ROOT.Char.GetWomanMan] thì sao?"
  bp1_yearly.9026.desc.cynical:0 "sự nghi ngờ ý chí [ROOT.Char.GetFaith.HighGodName|U] biến ngươi thành nô lệ của [ROOT.Char.GetFaith.DevilName|U]!"
  bp1_yearly.9026.desc.shy:0 "sự từ chối giao tiếp với đồng hành trong đời làm ngươi ngày càng mất tính người. Ngươi có nghĩ mình cao hơn họ?"
  bp1_yearly.9026.desc.gluttonous:0 "tham ăn trong khi người khác không có gì là một sự phỉ báng. Tại sao ăn thêm phần hai khi có người không có phần đầu tiên?"
  bp1_yearly.9026.desc.lustful:0 "ham muốn xác thịt làm ngươi sao lãng con đường hướng tới [ROOT.Char.GetFaith.PositiveAfterLife|U]. Không quan hệ nào so sánh được tình yêu thần thánh!"
  bp1_yearly.9026.desc.temperate:0 "[ROOT.Char.GetFaith.CreatorName|U] tạo ra thế giới và thức ăn để ngươi thưởng thức, nhưng ngươi từ chối quà của [ROOT.Char.GetFaith.CreatorHerHis|U]."
  bp1_yearly.9026.desc.chaste:0 "[ROOT.Char.GetFaith.CreatorName|U] tạo ra nhân loại để giao hợp, nhưng ngươi vẫn còn trinh trắng với nhiều khoái lạc và ham muốn."
  bp1_yearly.9026.desc.honest:0 "ngươi nghĩ sự thật sẽ giải phóng, nhưng dối trá thường là cách duy nhất bảo vệ những người ta yêu."
  bp1_yearly.9026.desc.fallback:0 "mọi tội lỗi ngươi phạm trong đời đều được [ROOT.Char.GetFaith.PantheonTerm] chứng kiến, và không gì bị quên."
  bp1_yearly.9026.desc.outro:0 "Ngươi phải sám hối vì những gì mình đã làm. Ta đã học được một bài học xương máu rằng mỗi tội lỗi chúng ta phạm phải đều tạo nên một món nợ với [ROOT.Char.GetFaith.HighGodName|U], người bạn của ta ạ, và [ROOT.Char.GetFaith.HighGodNameSheHe|U] không hề khoan dung với những con nợ của [ROOT.Char.GetFaith.HighGodHerHis|U] đâu.""
  bp1_yearly.9026.a:0 "Ta sám hối! Dù giá nào, Ta sám hối!"
  bp1_yearly.9026.b:0 "Chắc Ta đang ảo giác! Biến đi, linh hồn!"
 
  bp1_yearly.9027.t:0 "Những Nông Dân Bất Hạnh"
  bp1_yearly.9027.desc.intro:0 "Đã lâu rồi kể từ lần Ta được hồn ma người Ngài cũ [bp1_yearly_9027_dead_friend.GetName] ghé thăm, nhưng bây giờ con đường chuộc tội của Ta bắt đầu. Là một [ROOT.Char.GetTitleAsNameNoTooltip], Ta nhận ra nhiệm vụ của mình là đối với nhân dân, nên Ta đi giữa họ và hỏi họ mong muốn gì từ Ta.\n\nMột [bp1_yearly_9027_peasant_begger.GetWomanMan] nghèo rách rưới tiến đến van xin Ta giúp đỡ người nghèo và ốm đau ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], những người không có khả năng tự chăm sóc bản thân."
  bp1_yearly.9027.desc.greedy:0 "Điều [bp1_yearly_9027_peasant_begger.GetSheHe] yêu cầu thật là một khoản quá lớn,"
  bp1_yearly.9027.desc.fallback:0 "[bp1_yearly_9027_peasant_begger.GetSheHe|U] chỉ xin đủ để [bp1_yearly_9027_peasant_begger.GetHerHis] người sống qua ngày,"
  bp1_yearly.9027.desc.outro:0 "nhưng liệu thực sự có giá nào cho việc được vào [ROOT.Char.GetFaith.PositiveAfterLife|U] không?"
  bp1_yearly.9027.a:0 "Ngươi sẽ có mọi thứ cần."
  bp1_yearly.9027.b:0 "Những người này quá nghèo, họ sẽ chấp nhận bất cứ đề nghị nào của ta!"
  bp1_yearly.9027.c:0 "Ngươi muốn bao nhiêu?"
 
  bp1_yearly.9028.t:0 "Hồn Ma Của Tranh Cãi Quá Khứ"
  bp1_yearly.9028.desc.intro:0 "Ta thức dậy với cảm giác lạnh lẽo quen thuộc chạy dọc cơ thể. Nhìn quanh như trước, lần này Ta thấy kẻ thù đã khuất lâu của mình [bp1_yearly_9028_dead_rival.GetFullName]!\n\n"
  bp1_yearly.9028.desc.murderer:0 "\"Kẻ sát nhân!\""
  bp1_yearly.9028.desc.murderer.fallback:0 "\"[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9028_dead_rival'))]!\""
  bp1_yearly.9028.desc.bridge:0 "[bp1_yearly_9028_dead_rival.GetSheHe|U] rên rỉ. \"Ta đã bị [bp1_yearly_9028_dead_rival.GetDeathReason] và bây giờ linh hồn ta lang thang trên đời tìm ngươi! Những gì ngươi làm với ta để lại vết nhơ trên linh hồn, và ngươi phải van xin gia đình ta đã khuất để được tha thứ!\"\n\n"
  bp1_yearly.9028.desc.callous:0 "Thật ra, Ta cảm thấy không có gì phải sám hối, [bp1_yearly_9028_dead_rival.Custom2('InsultNoun', ROOT.Char)] đáng đời mà thôi."
  bp1_yearly.9028.desc.fallback:0 "Ta cảm nhận vết nhơ đó chìm sâu vào linh hồn, liệu có đủ sự sám hối nào không?"
  bp1_yearly.9028.desc.outro:0 "Ta đã nhận chỉ dẫn từ cõi bên kia, giờ Ta phải làm gì tiếp theo?"
  bp1_yearly.9028.a:0 "Ta sẽ làm mọi thứ để chuộc tội!"
  bp1_yearly.9028.b:0 "Ta sẽ không bao giờ quỳ lạy."
 
  bp1_yearly.9029.t:0 "[bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)|U]!"
  bp1_yearly.9029.desc.intro:0 "Đã lâu kể từ lần ma đầu tiên ghé thăm, và Ta đã hoàn toàn chuẩn bị cho những lần tiếp theo. Điều Ta không chuẩn bị là khuôn mặt khinh bỉ của [bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)] chỉ cách mặt Ta vài inch!\n\n\"Đứa trẻ độc ác!\""
  bp1_yearly.9029.desc.rival_sibling:0 "Ngươi không thấy mối thù giữa huyết thống của ta làm cả gia đình tiến gần hơn tới [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife] sao?"
  bp1_yearly.9029.desc.rival_sibling_unrelated:0 "Dù [bp1_yearly_9029_rival.GetName] không phải là [bp1_yearly_9029_rival.Custom('GetDaughterSon')] của ta, [bp1_yearly_9029_rival.GetSheHe] vẫn là [bp1_yearly_9029_rival.Custom('SisterBrother')] của ngươi, và sự thù ghét này khiến cả gia đình tiến gần tới [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife]!"
  bp1_yearly.9029.desc.rival:0 "Hận thù là con đường chắc chắn dẫn tới [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife], [ROOT.Char.Custom('GetDaughterSon')] của ta, và ngươi phải chấm dứt thù ghét nếu muốn thay đổi số phận."
  bp1_yearly.9029.desc.outro:0 "Ngươi phải cố gắng chấm dứt thù hận với [bp1_yearly_9029_rival.GetName], quỳ lạy và phục vụ [bp1_yearly_9029_rival.GetHerHim] nếu cần!"
  bp1_yearly.9029.a:0 "Vậy Ta sẽ quỳ lạy và phục vụ."
  bp1_yearly.9029.b:0 "Xoáy [ROOT.Char.GetFaith.NegativeAfterLife] với [bp1_yearly_9029_rival.GetFirstNameNoTooltip]!"
 
  bp1_yearly.9030.t:0 "Chuyến Thăm Lần Hai Của [bp1_yearly_9026_dead_friend.GetNamePossessive]"
  bp1_yearly.9030.desc.intro:0 "Ta cảm thấy tê liệt tràn khắp cơ thể khi [bp1_yearly_9026_dead_friend.GetFullName] xuất hiện lần nữa.\n\n\"Nói cho ta biết, hồn ma, Ta phải làm gì thêm để chắc chắn được vào [ROOT.Char.GetFaith.PositiveAfterLife]?\"\n\n\"Tốt quá khi ngươi hỏi, Ngài cũ của ta.\""
  bp1_yearly.9030.desc.pilgrimage:0 "Hãy hành hương tới vùng đất thánh, nơi ngươi sẽ tìm thấy sự chuộc tội mong đợi. Đừng trì hoãn, [ROOT.Char.GetFaith.HighGodName] đang chờ ngươi ở đó.\""
  bp1_yearly.9030.desc.fallback:0 "Lòng từ thiện! Ta phải nhắc bao nhiêu lần nữa? Một hành động đơn lẻ không đủ, ngươi phải thường xuyên ban phát sự giàu sang của mình!"
  bp1_yearly.9030.a:0 "Ta sẽ làm những gì cần."
  bp1_yearly.9030.a.tt_pilgrimage:0 "Hành trình tiếp theo của ngươi sẽ rẻ hơn"
  bp1_yearly.9030.b:0 "Ta không thể làm gì thêm."
 
  bp1_yearly.9031.t:0 "Xin Tha Thứ"
  bp1_yearly.9031.desc.intro:0 "Cuối cùng, Ta bắt gặp [bp1_yearly_9031_rival_family.Custom2('MyCharacterIntroduction', bp1_yearly_9031_rival)] trong lúc rảnh rỗi. Trong cơn tuyệt vọng cầu xin tha thứ, Ta quỳ xuống van xin được xóa tội với [bp1_yearly_9031_rival.GetFirstNameNoTooltip]."
  bp1_yearly.9031.desc.flagellant:0 "Một nụ cười ghê tởm hiện trên mặt [bp1_yearly_9031_rival_family.GetHerHis].\n\n\"Chúng ta đều biết ngươi cầu xin sự tha thứ của [bp1_yearly_9031_rival_family.GetFaith.HighGodNamePossessive], và tự trừng phạt bản thân là cách duy nhất để đạt được điều đó. Hãy làm thật mạnh, và ta sẽ tha thứ, ngươi cũng hy vọng [bp1_yearly_9031_rival_family.GetFaith.HighGodNameSheHe|U] cũng làm vậy.\""
  bp1_yearly.9031.desc.debate:0 "[bp1_yearly_9031_rival_family.GetNameNoTooltip] nhướng mũi khinh miệt nhìn xuống ta.\n\n"Thật tốt khi ngươi đã nhận ra những con đường tội lỗi của mình lúc này, nhưng ta e rằng mình không thể tha thứ cho ngươi vì những tội ác chống lại [bp1_yearly_9031_rival_family.GetFaith.ReligiousText], trừ khi ngươi có thể thuyết phục được ta trong một cuộc tranh biện.""
  bp1_yearly.9031.desc.cleanup:0 "Ta thấy một ý tưởng lóe lên trong đầu [bp1_yearly_9031_rival_family.GetNamePossessiveNoTooltip].\n\n\"Kể từ khi [bp1_yearly_9031_rival.GetFirstNameNoTooltip] rời đi, Ta phải giảm số người giúp việc. Nếu ai đó giúp dọn dẹp nhà Ta, chắc chắn sẽ được tha thứ.\""
  bp1_yearly.9031.desc.unconditional:0 "[bp1_yearly_9031_rival_family.GetSheHe|U] mỉm cười và hạ thấp [bp1_yearly_9031_rival_family.GetHerselfHimself] xuống để đối mặt với ta.\n\n"Hãy đứng lên đi, người bạn của ta. Tất cả những gì ta cần nghe chỉ là ngươi đã hối hận về điều đó, suy cho cùng tất cả chúng ta chỉ là những đứa trẻ trước mắt của [bp1_yearly_9031_rival_family.GetFaith.HighGodName] mà thôi, ai mà chẳng có lúc phạm sai lầm.""
  bp1_yearly.9031.desc.fallback:0 "[bp1_yearly_9031_rival_family.GetSheHe|U] nhìn Ta với ánh mắt nhòe nước.\n\n\"Tha thứ sao? Không, ta #EMP sẽ không bao giờ#! tha thứ. Thật kinh tởm khi nghe ngươi nhắc tên [bp1_yearly_9031_rival.GetHerHis]! Ta phải yêu cầu hành động nào để chuộc lỗi?\""
  bp1_yearly.9031.a.forgiven:0 "Ta thật khiêm tốn."
  bp1_yearly.9031.a:0 "Ta sẽ làm mọi điều ngươi yêu cầu."
  bp1_yearly.9031.b.forgiven:0 "Ta xin rút lại tất cả!"
  bp1_yearly.9031.b:0 "Ta sẽ không bị hạ thấp."
 
  bp1_yearly.9032.t:0 "Chuộc Lỗi"
  bp1_yearly.9032.desc:0 "Đúng như những gì được yêu cầu, ta đã lần theo dấu vết của [bp1_yearly_9032_rival.GetName] và lập tức quỳ sụp xuống, van xin lòng vị tha của [bp1_yearly_9032_rival.GetHerHis].\n\n"Thề có [bp1_yearly_9032_rival.GetFaith.PantheonTerm|U], điều này thật quá tuyệt vời! Ngươi đang quỳ phục dưới chân ta, ha! Ta đã mơ về ngày này biết bao."\n\nKhi biểu cảm trên khuôn mặt của ta vẫn bất biến như đá tảng, giọng điệu của [bp1_yearly_9032_rival.GetHerHis] bắt đầu thay đổi.\n\n"Ngươi nghiêm túc đấy chứ? Chà, ta đoán là có một vài điều ngươi có thể làm để nhận được sự tha thứ của ta...""
  bp1_yearly.9032.a:0 "Ta sẽ làm bất cứ điều gì."
  bp1_yearly.9032.b:0 "Tận dụng lúc này để vấp ngã [bp1_yearly_9032_rival.GetHerHim]!"
 
  bp1_yearly.9033.t:0 "Đêm Cuối Cùng"
  bp1_yearly.9033.desc.intro:0 "Cuối cùng, [bp1_yearly_9026_dead_friend.GetFullName] lại đến với Ta, hy vọng là lần cuối cùng. Ta thức dậy và hỏi xem mình đã làm tốt thế nào để tránh số phận.\n\n"
  bp1_yearly.9033.desc.did_well:0 "\"Ôi Ngài, ngươi đã làm việc tuyệt vời! Dù tương lai vẫn chưa chắc chắn, nhưng đã tốt hơn nhiều so với lần đầu ta ghé thăm! Gánh nặng trên linh hồn ngươi đã được gỡ bỏ, và ta có thể quay về hình phạt vĩnh hằng của mình, yên tâm rằng đã làm tất cả để cứu ngươi khỏi cùng số phận.\""
  bp1_yearly.9033.desc.did_bad:0 "\"Thế nào tốt? Thế nào tốt? Bi thảm, [ROOT.Char.GetFirstNameNoTooltip]! Ngươi bị định mệnh đưa đến [ROOT.Char.GetFaith.NegativeAfterLife] vĩnh viễn! Tương lai ngươi là bức tranh kinh hoàng do chính tay ngươi dệt! Ta trở lại nghỉ ngơi, đã làm tất cả để cứu linh hồn ngươi.\""
  bp1_yearly.9033.desc.did_okay:0 "\"Ừ, nói sao đây? Ngươi có cơ hội chuộc lỗi nhưng lại ném đi. Dù đã tiến một vài bước, ngươi lại lùi nhiều bước hơn. Hy vọng ngươi có thể thay đổi, Bạn ta. Bây giờ, ta phải quay về hình phạt vĩnh hằng, mong rằng không thấy ngươi cùng ta.\""
  bp1_yearly.9033.desc.outro:0 "\n\n[bp1_yearly_9026_dead_friend.GetFirstNameNoTooltip] lại biến mất và lần này Ta nghi ngờ sẽ không gặp [bp1_yearly_9026_dead_friend.GetHerHim] nữa."
  bp1_yearly.9033.a:0 "Ta được cứu!"
  bp1_yearly.9033.b:0 "Có lẽ [ROOT.Char.GetFaith.NegativeAfterLife] không tệ lắm."
  bp1_yearly.9033.c:0 "Ta đã trở thành [ROOT.Char.GetWomanMan] khác."
  end_marley_ghost_story_tt:0 "Ngươi sẽ không bị hồn ma ghé thăm nữa."
  bp1_increase_good_deeds_tt:0 "#EMP Các linh hồn sẽ vui mừng#!"
  bp1_decrease_good_deeds_tt:0 "#EMP Các linh hồn sẽ rất giận#!"
 
  bp1_yearly.9034.t:0 "Phù Thủy Nước"
  bp1_yearly.9034.desc.intro:0 "Ta đang vui đùa ở đầm lầy [bp1_yearly_9034_swampy_location.GetNameNoTooltip] cùng người Ngài [bp1_yearly_9034_friend.GetName]. Chúng Ta chơi quá say mê đến mức không nhận ra đã tách khỏi [bp1_yearly_9034_guardian.GetName]!\n\nĐột nhiên, chúng Ta thấy một phù thủy đầm lầy nổi lên từ bùn lầy, phủ đầy bùn. [bp1_yearly_9034_witch.GetSheHe|U] nhìn chúng Ta trừng trừng, và trước khi Ta kịp phản ứng, [bp1_yearly_9034_friend.GetName] đã chạy mất!"
  bp1_yearly.9034.desc.giant:0 "[bp1_yearly_9034_witch.GetSheHe|U] nặng nề tiến về phía ta, thân hình cao lớn của [bp1_yearly_9034_witch.GetHerHis] khiến [bp1_yearly_9034_witch.GetHerHim] bị vấp và ngã nhào dưới chính trọng lượng của [bp1_yearly_9034_witch.GetHerHis]!"
  bp1_yearly.9034.desc.hunchbacked:0 "[bp1_yearly_9034_witch.GetSheHe|U] nặng nề tiến về phía ta, toàn bộ thân hình của [bp1_yearly_9034_witch.GetHerHis] gù xuống một cách dị thường như thể cơ thể của [bp1_yearly_9034_witch.GetHerHis] đang bị thắt nút lại."
  bp1_yearly.9034.desc.beauty_bad:0 "Ta chưa từng thấy sinh vật nào xấu xí đến vậy, ngay cả từ xa. Trước khi Ta kịp nhìn rõ, [bp1_yearly_9034_witch.GetSheHe] lao tới Ta!"
  bp1_yearly.9034.desc.albino:0 "Qua lớp bùn, Ta thấy da và tóc [bp1_yearly_9034_witch.GetHerHis] trắng như sữa, đôi mắt đỏ ngập giận dữ. Trước khi Ta kịp phản ứng, [bp1_yearly_9034_witch.GetSheHe] lao tới!"
  bp1_yearly.9034.desc.scaly:0 "Da [bp1_yearly_9034_witch.GetHerHis|U] như da thằn lằn, đầy u nhú và nếp gấp. Trước khi Ta kịp nhìn rõ, [bp1_yearly_9034_witch.GetSheHe] lao tới!"
  bp1_yearly.9034.desc.outro:0 "\n\nNgài và người bảo vệ đang ở xa, chỉ còn Ta và phù thủy, nhưng Ta phải làm gì đây?"
  bp1_yearly.9034.a:0 "Chạy!"
  bp1_yearly.9034.b:0 "Xem [bp1_yearly_9034_witch.GetSheHe] muốn gì."
  9034_escaped_witch:0 "Ngài đã thoát khỏi phù thủy!"
  9034_failed_to_escape:0 "Ngài bị thương khi chạy trốn."
 
  bp1_yearly.9035.t:0 "Phù Thủy Tốt Của Đầm Lầy"
  bp1_yearly.9035.desc:0 "Khi phù thủy cuối cùng cũng hoàn tất việc tiếp cận của [bp1_yearly_9034_witch.GetHerHis], [bp1_yearly_9034_witch.GetSheHe] đập một con côn trùng trên mặt ta rồi quệt nó vào chiếc áo tu-nic của [bp1_yearly_9034_witch.GetHerHis].\n\n"Hãy cẩn thiện quanh những vùng này, này nhóc. Ngay cả lũ sinh vật nhỏ bé cũng sẽ cắn con nếu con không cẩn thận đấy. Ta biết rõ mà, ta đã chữa trị cho đủ vết má sưng tấy của những lữ khách lạc lối rồi."\n\nRõ ràng không phải là con quái vật như ta nghĩ ban đầu, [bp1_yearly_9034_witch.GetSheHe] tự giới thiệu [bp1_yearly_9034_witch.GetHerselfHimself] là một thầy lang kiêm pháp sư địa phương, am tường về thảo dược và các nghi lễ trục xuất tà ma khỏi con người cũng như đồ vật. Có lẽ kẻ [bp1_yearly_9034_witch.GetWomanMan] này có thể phục vụ cho một mục đích cao cả hơn."
  bp1_yearly.9035.a:0 "Một thầy thuốc? Ta cần một bác sĩ mới..."
  bp1_yearly.9035.b:0 "Dạy Ta cách của ngươi, ôi [bp1_yearly_9034_witch.GetWomanMan] khôn ngoan."
  bp1_yearly.9035.c:0 "Ai đã hỏi?"
 
  bp1_yearly.9036.t:0 "Phù Thủy Xấu Của Đầm Lầy"
  bp1_yearly.9036.desc:0 "Mụ phù thủy [bp1_yearly_9034_witch.Custom2('InsultAdjective', ROOT.Char)] chộp lấy ta bằng những ngón tay dài khẳng khiu của [bp1_yearly_9034_witch.GetHerHis], bóp chặt ta đến mức ta có thể cảm thấy máu trong hai cánh tay mình ngừng chảy.\n\n"Nhân danh [bp1_yearly_9034_witch.GetFaith.WitchGodName], ngươi đang làm cái quái gì trong đầm lầy của ta hả, đồ [bp1_yearly_9034_witch.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9034_witch'))] [bp1_yearly_9034_witch.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9034_witch'))] kia? Ngươi có biết gì về những linh hồn tà ác ở nơi này không? Đứa trẻ ngỗ ngược!"\n\nTa cố gắng giải thích với [bp1_yearly_9034_witch.GetHerHim] rằng ta là [ROOT.Char.GetTitleAsNameNoTooltip|U] nhưng [bp1_yearly_9034_witch.GetSheHe] tại thời điểm này hoàn toàn không còn lý trí nữa. Ta cảm thấy cơ thể mình dần mềm nhũn và làn da bắt đầu nứt nẻ thì bỗng thấy [bp1_yearly_9034_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] xuất hiện."
  bp1_yearly.9036.a:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip], cứu Ta!"
  bp1_yearly.9036.guardian_wins:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip] chiến thắng"
  bp1_yearly.9036.guardian_loses:0 "[bp1_yearly_9034_guardian.GetNameNoTooltip] không cứu được Ta khỏi thương tích"
  bp1_yearly_9034_witchy_goodbad_tt:0 "#EMP Phù thủy có thể khác với những gì Ngài nghĩ...#!"
 
  bp1_yearly.9037.t:0 "Xác Trong Đầm Lầy"
  bp1_yearly.9037.desc:1 "Ta được dẫn ra đầm lầy [bp1_yearly_9037_swampy_location.GetNameNoTierNoTooltip] bởi [bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)], và thật sự nơi này tuyệt vời!\n\nTa chạy nhảy, tung nước bẩn và ném đá vào bùn, sống cuộc đời tuyệt nhất của [ROOT.Char.GetTitleAsNameNoTooltip] khi thấy thứ gì đó chậm rãi bò về phía mình.\n\nRẽ qua lau sậy, là khuôn mặt của một xác lạ, [bp1_yearly_9037_corpse.GetHerHis] kinh hoàng được bảo quản hoàn hảo nhờ khoáng chất trong nước đầm lầy."
  bp1_yearly.9037.a:0 "[bp1_yearly_9037_guardian.GetNameNoTooltip], nhìn Ta tìm thấy gì này!"
  bp1_yearly.9037.custom:0 "Người bảo vệ Ta [bp1_yearly_9037_guardian.GetName] sẽ biết phải làm gì..."
  bp1_yearly.9037.b:0 "Chạy và la hét!"
 
  bp1_yearly.9038.t:0 "Một Bí Mật Được Tiết Lộ"
  bp1_yearly.9038.desc.intro:0 "Khi [bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến đến, khuôn mặt [bp1_yearly_9037_guardian.GetHerHis] biến sắc kinh hoàng khi thấy xác trong đầm.\n\n\"Đây là [bp1_yearly_9037_corpse.GetNameNoTooltip]... Ta đã giết [bp1_yearly_9037_corpse.GetHerHim].\""
  bp1_yearly.9038.desc.killer:0 "Ngươi hiểu không, [ROOT.Char.GetTitleAsNameNoTooltip] trẻ tuổi, ta không thể để ngươi chạy loanh quanh kể chuyện này. Vấn đề là nơi này quá hẻo lánh và nguy hiểm, không ai nghĩ tìm ngươi ở đây. Ngươi bơi giỏi chứ, [ROOT.Char.GetTitleAsNameNoTooltip]?"
  bp1_yearly.9038.desc.not_killer:0 "Ta chưa từng định nói với ai, nhưng giờ giấu cũng vô ích. Ta không tự hào về những gì đã làm, [ROOT.Char.GetFirstNameNoTooltip], chỉ hy vọng ngươi tha thứ cho ta như người thầy yêu thương."
  bp1_yearly.9038.a:0 "Ta không biết nói gì."
  bp1_yearly.9038.b:0 "Chạy và kể mọi người!"
  bp1_yearly.9038.c:0 "Đẩy [bp1_yearly_9037_guardian.GetHerHim] xuống đầm."
  9038_killed_guardian:0 "Ngài đã đẩy thành công [bp1_yearly_9037_guardian.GetName] xuống đầm."
  9038_guardian_kills_you:0 "Ngài bị [bp1_yearly_9037_guardian.GetName] áp đảo."
 
  bp1_yearly.9039.t:0 "Xác Hoàn Hảo"
  bp1_yearly.9039.desc:0 "[bp1_yearly_9037_guardian.GetName] dường như cũng bàng hoàng và kinh sợ như ta khi nhìn thấy cái xác này trong đầm lầy, nhưng vẻ kinh hoàng của [bp1_yearly_9037_guardian.GetHerHis] sớm chuyển thành một sự mê mẩn.\n\n"Đứa [ROOT.Char.Custom('GirlBoy')] của ta, con có nhận ra những bộ y phục này không? Đây chắc chắn là phục trang của giới tá điền từ ba trăm năm trước! Không còn nghi ngờ gì nữa, cái xác này đã được bảo quản theo cách chưa từng thấy trước đây! Ôi, đây chính là một phép màu từ [bp1_yearly_9037_guardian.GetFaith.HighGodName|U]! Về điều đó thì không phải bàn cãi! Hãy để ta thu lượm những khúc xương này và làm một món quà tuyệt hảo cho con."\n\n[bp1_yearly_9037_guardian.GetFaith.HighGodName|U] dường như có một cách kỳ lạ để hiển linh 'phép màu', nhưng nếu [bp1_yearly_9037_guardian.GetNameNoTooltip] đã nói vậy, thì hẳn phải là như thế rồi."
  bp1_yearly.9039.a:0 "Một... món quà kỳ lạ."
  bp1_yearly.9039.b:0 "Không, Ta chắc đây là hồn ma xấu."
  ghost_stories_modifier:0 "Truyện Ma"
  ghost_stories_modifier_desc:0 "Quận này được cho là có hồn ác."
  box_of_boggy_bones:0 "Hộp Xương Đầm Lầy"
  box_of_boggy_bones_desc:0 "Xương của xác vài trăm năm được bảo quản hoàn hảo trong nước đầm, giờ được đặt trong hộp tiện lợi."
  bp1_withholding_ghost_sex:0 "Chống Lại Giấc Mơ Dục Vọng"
  bp1_withholding_ghost_sex_desc:0 "Nhân vật mơ về người yêu đã khuất, nhưng từ chối các cử chỉ tình dục."
  bp1_indulging_ghost_sex:0 "Giấc Mơ Dục Vọng"
  bp1_indulging_ghost_sex_desc:0 "Nhân vật mơ về người yêu đã khuất, và hoàn toàn đón nhận trải nghiệm tình dục siêu nhiên."
 
  bp1_yearly.9040.t:0 "Chuyến Thăm Của Người Yêu"
  bp1_yearly.9040.desc:0 "Ta nằm êm trong giường khi cảm nhận một bàn tay quen thuộc chạm lên ngực trần. Ban đầu Ta không nghĩ gì, nhưng khi mở mắt, Ta thấy [bp1_yearly_9040_dead_lover.GetName] người yêu đã khuất đang ngồi bên cạnh!\n\n\"Ôi [ROOT.Char.Custom('LoverPetName')], đã lâu quá nhỉ? Nhưng khi ta ôm và hôn ngươi, tình yêu có trở lại trái tim ngươi như vừa hôm qua? Ôm ta, [ROOT.Char.Custom('LoverPetName')], yêu ta lần nữa!\"\n\nTa không thể tin, nhưng nhìn thấy [bp1_yearly_9040_dead_lover.GetHerHim] và cảm nhận [bp1_yearly_9040_dead_lover.GetHerHim]! Dù biết là mơ, nhưng sống động đến mức Ta không thể cưỡng lại."
  bp1_yearly.9040.a:0 "Ôm ta như thuở xưa!"
  bp1_yearly.9040.b:0 "Biến đi, hồn ma."
 
  bp1_yearly.9041.t:0 "Kỷ Niệm Về [bp1_yearly_9041_parent.GetMotherFather|U]"
  bp1_yearly.9041.desc:0 "Ta tìm thấy [bp1_yearly_9041_sibling.Custom2('MyCharacterIntroduction', ROOT.Char)] đang gục ngã ở một góc xa xôi của [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], khóc lóc thút thít. Khi [bp1_yearly_9041_sibling.GetSheHe] nhận thấy ta tiến lại gần, [bp1_yearly_9041_sibling.GetSheHe] đứng dậy và cố gắng lau đi đôi mắt của [bp1_yearly_9041_sibling.GetHerHis] trong vô vọng.\n\n"Ôi, [ROOT.Char.Custom('SisterBrother')], ta xin lỗi, ta không nên khóc. Suy cho cùng, ngươi có nhiều lý do để nhớ thương [bp1_yearly_9041_parent.GetMotherFather] của chúng ta hơn ta. Ta sẽ tránh đường cho ngươi."\n\nSự thật là ta còn chưa có thời gian để nghĩ về [bp1_yearly_9041_parent.GetMotherFather] kể từ khi lên ngôi, nhưng [bp1_yearly_9041_sibling.GetNameNoTooltip] có vẻ vô cùng đau buồn."
  bp1_yearly.9041.a:0 "Khóc đi, Ta ở đây."
  bp1_yearly.9041.b:0 "Haha! Nhóc to thật!"
 
  bp1_yearly.9042.t:0 "Khuôn Mặt Của [ROOT.Char.GetFaith.HealthGodName]"
  bp1_yearly.9042.desc:0 "Lại một ngày nữa lãnh đạo vùng [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] của ta trôi qua mà không có mấy sự bất ngờ, ngoại trừ việc [bp1_yearly_9042_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] xông vào phòng thiết triều của ta, háo hức khua khua một túi đồ ngọt trước mặt ta.\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của thần! Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của thần! Ôi quả là một phép màu! Thần đang kiểm tra bữa ăn của ngự đầu bếp chuẩn bị cho ngài tối nay thì chợt nhận ra những món ăn cụ thể này trông giống hệt khuôn mặt của không ai khác ngoài [ROOT.Char.GetFaith.HealthGodName]!"\n\nKhi kiểm tra kỹ lưỡng, ta phải thừa nhận sự giống nhau đến kỳ lạ, nhưng điều này chắc chắn phải là dị giáo rồi."
  bp1_yearly.9042.a:0 "Đúng vậy!"
  bp1_yearly.9042.b:0 "Chắc chắn đây là sự báng bổ."
  bp1_yearly.9042.c:0 "Phép màu! Ta phải ăn thử!"
  9042_you_win:0 "Ngài thắng cuộc tranh luận"
  9042_you_lose:0 "Ngài thua cuộc tranh luận"
  dessert_looks_like_god:0 "Khuôn Mặt Thần [ROOT.Char.GetFaith.HealthGodName]"
  dessert_looks_like_god_desc:0 "Bộ [ROOT.Char.Custom('GetExpensiveDessert')] có hình giống [ROOT.Char.GetFaith.HealthGodName]"
  full_of_jesus_modifier:0 "Tràn đầy Tinh Thần"
  full_of_jesus_modifier_desc:0 "Nhân vật này ăn món bánh ngọt có hình giống [ROOT.Char.GetFaith.HealthGodName]"
 
  bp1_yearly.9043.t:0 "Đứa Trẻ Ăn [ROOT.Char.GetFaith.BishopNeuter|U]"
  bp1_yearly.9043.desc:0 "Lại là một ngày tuyệt vời của sự cầu nguyện và phụng sự từ vị [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] tuyệt vời của ta, và khi ta chuẩn bị rời đi, [bp1_yearly_9043_chaplain.GetName] chặn đường ta lại. [bp1_yearly_9043_chaplain.GetSheHe|U] chờ cho đến khi mọi người khác đã rời đi hết rồi ghé sát vào tai ta.\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip] của thần, thần phải nói với ngài điều này, thần không hề xa lạ với những thú vui của cuộc sống. Không có hình thức biến thái nào là quá đồi bại đối với thần: cho dù là động vật, thực vật hay khoáng vật. Nói thẳng ra, thần có thể làm bất cứ điều gì với bất cứ thứ gì, và không có niềm vui nào trên đời này tuyệt diệu hơn việc ăn thịt của lũ trẻ nhỏ. Ngài chưa thực sự sống nếu chưa từng nếm qua thịt người, thưa [ROOT.Char.GetTitleAsNameNoTooltip] của thần, và thần không mong muốn điều gì hơn là biến ngài thành bữa tối vào tối nay!"\n\nKinh ngạc thậm chí không đủ để mô tả những gì ta cảm thấy khi nghe điều này, nhưng ta biết phải nói cái quái gì bây giờ?"
  bp1_yearly.9043.a:0 "Ngươi ăn trẻ sao? Nghe vui đấy!"
  bp1_yearly.9043.b:0 "#EMP Vệ binh!#!"
  bp1_yearly.9043.c:0 "Chỉ mỉm cười và đi tiếp."
 
  bp1_yearly.9044.t:0 "Cuộc Thi Hành"
  bp1_yearly.9044.desc:0 "Ta từng hy vọng mình có thể kiềm chế bản thân để tránh xa buổi hành hình của [recipient.GetNamePossessive], nhưng rõ ràng là ta không thể cưỡng lại việc nói lời từ biệt.\n\nTa đã thực sự quan tâm đến [recipient.GetHerHim] theo cách mà không ai có thể hiểu được, nhưng những sự kiện dẫn đến việc tống giam [recipient.GetHerHis] là do chính [recipient.GetHerHis] tự chuốc lấy, và ta không thể tạo ra ngoại lệ cho công lý.\n\n[recipient.GetFirstNameNoTooltip] đã dành những khoảnh khắc cuối cùng của [recipient.GetHerHis] để nhìn chằm chằm vào ta với sự phản bội trong đôi mắt đẫm lệ của [recipient.GetHerHis] trước khi một tiếng #EMP rắc#! cuối cùng vang lên và [recipient.GetSheHe] không còn nữa. Ta ở lại bên thi thể không còn sự sống của [recipient.GetHerHis] một lúc, và hồi tưởng lại tất cả những khoảng thời gian tốt đẹp chúng ta từng có với nhau trong đời."
  bp1_yearly.9044.desc.outro.memory:0 "Ta đặc biệt yêu thích khoảng thời gian [bp1_yearly_9044_memory_scope.GetDescription], và Ta tiếc rằng chúng Ta sẽ không còn chia sẻ những khoảnh khắc tuyệt vời như thế nữa."
  bp1_yearly.9044.desc.outro.no_memory:0 "Ta chỉ có thể hy vọng gặp lại [recipient.GetHerHim] trong [ROOT.Char.GetFaith.PositiveAfterLife], nếu [recipient.GetSheHe] tha thứ cho Ta."
  bp1_yearly.9044.a.indifferent:0 "Chuyện đó không phải chuyện cá nhân."
  bp1_yearly.9044.a.guilty:0 "Ta xin lỗi vì mọi chuyện phải kết thúc thế này."
 
  bp1_yearly.9045.t:0 "Cuộc Thi Hành"
  bp1_yearly.9045.desc.intro:0 "Một thời gian sau khi Ta ra lệnh hành quyết [recipient.GetName], [bp1_yearly_9045_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] dẫn Ta đến giá treo cổ, hứa rằng những gì Ta sẽ thấy là một cơ hội học hỏi quý giá.\n\n"
  bp1_yearly.9045.desc.zealous:0 "Ta thấy [recipient.GetName] tiến về phía đao phủ với đôi mắt nhắm nghiền. Trong sự tĩnh lặng của khoảng sân, ta có thể nghe thấy [recipient.GetHerHim] lẩm bẩm những lời cầu nguyện và mật chú không thể hiểu nổi vào lòng bàn tay của [recipient.GetHerHis], như thể vẫn còn hy vọng rằng [recipient.GetFaith.HighGodName|U] sẽ sẵn lòng hiển linh và ngăn chặn cái chết bất đắc kỳ tử của [recipient.GetHerHis]."
  bp1_yearly.9045.desc.brave:0 "[recipient.GetFirstNameNoTooltip] nhìn thẳng vào mặt người hành quyết và trông như sắp nhổ, khi cuối cùng [recipient.GetSheHe] nhận ra Ta đang quan sát. Đôi mắt [recipient.GetHerHis|U] không rời mắt Ta, không một khoảnh khắc nào, nhăn nhó sâu vào linh hồn Ta với chỉ căm ghét và khinh miệt thuần túy."
  bp1_yearly.9045.desc.fallback:0 "Đôi mắt của [recipient.GetNamePossessiveNoTooltip] đỏ hoe vì những giọt nước mắt của [recipient.GetHerHis]. Khi [recipient.GetSheHe] bước về phía đao phủ, [recipient.GetSheHe] cố gắng giữ im lặng, nhưng không thể kìm được tiếng thút thít nghẹn ngào và nấc nghẹn khi [recipient.GetSheHe] nghĩ về cái chết sắp sửa ập đến của [recipient.GetHerHis]."
  bp1_yearly.9045.desc.outro:0 "\n\nDù cảnh tượng này khiến Ta cảm thấy thế nào, mọi thứ kết thúc quá nhanh đến mức Ta không kịp ngăn chặn. Khi việc đã xong và trái tim [recipient.GetNamePossessiveNoTooltip] ngừng đập, [bp1_yearly_9045_guardian.GetNameNoTooltip] rời đi, để Ta một mình với thi thể để suy ngẫm về những gì mình đã làm."
  bp1_yearly.9045.a.indifferent:0 "Giờ Ta có thể về không?"
  bp1_yearly.9045.a.sadistic:0 "Thật một màn trình diễn tuyệt vời!"
  bp1_yearly.9045.a.guilty:0 "Tại sao lại cho Ta xem chuyện đó?"
 
  bp1_yearly.9046.t:0 "Đặt Tên Màu Nâu"
  bp1_yearly.9046.desc.intro:0 "Thời khắc cuối cùng cũng đã đến để đứa con đỏ hớn mới sinh kính yêu [bp1_yearly_9046_poopy_child.GetName] của ta được ban danh xưng trước sự chứng giám của [ROOT.Char.GetFaith.HighGodName], và tất cả những bậc chức sắc quan trọng của vùng [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] đã tụ họp để chứng kiến ngày linh thiêng này. Khi [bp1_yearly_9046_chaplain.GetName] đang thực hiện thánh chức của [bp1_yearly_9046_chaplain.GetHerHis], ta bỗng ngửi thấy một mùi hôi thối xộc vào mũi mình.\n\n"
  bp1_yearly.9046.desc.christian:1 "Bồn rửa tội giờ đầy màu nâu do chất thải của trẻ. Đầu [bp1_yearly_9046_poopy_child.GetHerHis|U] đã được nhúng vào nước thánh cho Cha, và Ta chỉ có thể nhìn khi nhúng thêm hai lần nữa cho Con và Chúa Thánh Thần."
  bp1_yearly.9046.desc.not_christian:0 "Qua chất lỏng nâu nhỏ giọt giữa tay [bp1_yearly_9046_chaplain.GetNamePossessiveNoTooltip], rõ ràng [bp1_yearly_9046_poopy_child.GetNameNoTooltip] không thể nhịn cho [ROOT.Char.GetFaith.HighGodName]."
  bp1_yearly.9046.desc.outro:0 "Bất chấp mùi hôi thối cùng những tiếng chế nhạo của giáo đoàn, [bp1_yearly_9046_chaplain.GetNameNoTooltip] vẫn giữ vững phong thái chuyên nghiệp.\n\nTa có cảm giác sự kiện này có thể sẽ ám ảnh đứa con mới sinh của ta suốt phần đời còn lại của [bp1_yearly_9046_poopy_child.GetHerHis], và cái tên [bp1_yearly_9046_poopy_child.GetFirstNameNoTooltip] có thể sẽ mãi mãi gắn liền với chất thải của trẻ con."
  bp1_yearly.9046.a.indifferent:0 "Ha! Thật một cảnh tượng!"
  bp1_yearly.9046.a:0 "Chà, Ta chẳng thể làm gì."
  bp1_yearly.9046.b:0 "Sự kiện này không rời phòng này."
 
  bp1_yearly.9047.t:0 "Một Lọn Tóc Yêu Thương"
  bp1_yearly.9047.desc:0 "Ta đang cùng người tình kính yêu [bp1_yearly_9047_lover.GetName] thủ thỉ những lời đầu ấp tay gối như thường lệ, quấn làn tóc mây tuyệt đẹp của [bp1_yearly_9047_lover.GetHerHis] quanh những ngón tay của mình.\n\n"Chàng/Nàng có yêu mái tóc của thiếp/ta đến thế không, [ROOT.Char.Custom('LoverPetName')] của lòng ta? Có lẽ chàng/nàng nên luôn mang theo nó bên mình khi thực hiện các nghĩa vụ của một [ROOT.Char.GetTitleAsNameNoTooltip], để rồi mọi người sẽ thấy chàng/nàng và thiếp/ta là một."\n\nBan đầu ta cứ ngỡ [bp1_yearly_9047_lover.GetSheHe] chỉ đang đùa vui, nhưng nhanh chóng nhận ra rõ ràng rằng [bp1_yearly_9047_lover.GetSheHe] thực sự muốn ta diện mái tóc của [bp1_yearly_9047_lover.GetHerHis] như một món phụ kiện cho bách tính cùng chiêm ngưỡng!"
  bp1_yearly.9047.a:0 "Ta sẽ đeo nó đến khi chết."
  bp1_yearly.9047.b:0 "Gì cơ? Kinh quá!"
 
  bp1_yearly.9048.t:0 "Vật Lộn Với Quỷ"
  bp1_yearly.9048.desc:0 "[bp1_yearly_9048_nemesis.GetName] chưa từng thất bại trong việc để lộ khuôn mặt gớm ghiếc của [bp1_yearly_9048_nemesis.GetHerHis] vào chính xác thời điểm thích hợp để phá hỏng hoàn toàn ngày vui của ta. Lần này, [bp1_yearly_9048_nemesis.GetSheHe] có vẻ đặc biệt tràn đầy ác ý khi [bp1_yearly_9048_nemesis.GetSheHe] tiếp cận ta tại [ROOT.Char.Custom('GetCourt')] của ta với ngọn lửa cuồng nộ trong đôi mắt của [bp1_yearly_9048_nemesis.GetHerHis].\n\n"Ngươi hoàn toàn là một tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! Một tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))] tột cùng! Một tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9048_nemesis'))]! Mỗi hơi thở trong lồng ngực ngươi chỉ là sự lãng phí và một sự sỉ nhục đối với muôn loài chúng sinh. Ta đã quá mệt mỏi khi phải nhìn vào một tạo vật biến thái méo mó từ sự sáng tạo của [bp1_yearly_9048_nemesis.GetFaith.CreatorNamePossessive] rồi, và ta yêu cầu một sự thỏa đáng. Mối thâm thù giữa chúng ta sẽ kết thúc tại đây! Hãy đấu với ta!"\n\nTrước khi ta kịp phản ứng, [bp1_yearly_9048_nemesis.GetName] đã thủ sẵn thế để lao vào vật lộn với ta rồi!"
  bp1_yearly.9048.a:0 "Thế giới sẽ bớt đi một [bp1_yearly_9048_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)] khi Ta xong việc!"
  bp1_yearly.9048.b:0 "Biến đi, [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)]."
  9048_you_lose:0 "Ngài đã thua trong trận đấu"
 
  bp1_yearly.9049.t:0 "Trả Đũa?"
  bp1_yearly.9049.desc:0 "[bp1_yearly_9048_nemesis.GetName] gục ngã dưới chân ta, máu me đầm đìa và tan nát sau nỗ lực thảm hại của [bp1_yearly_9048_nemesis.GetHerHis] nhằm hạ gục ta. Trận chiến đã kết thúc và ta là người chiến thắng rõ ràng, nhưng ta vẫn cảm thấy một ngọn lửa rực cháy trong tim mình. Nắm đấm của ta không muốn gì hơn là giã nát tên [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)] [bp1_yearly_9048_nemesis.Custom2('InsultAdjective', ROOT.Char)] này xuống đất cho đến khi chẳng còn lại gì ngoài một vũng máu loang lổ.\n\n[bp1_yearly_9048_nemesis.GetNameNoTooltip] yếu ớt giơ đôi bàn tay của [bp1_yearly_9048_nemesis.GetHerHis] lên che mặt, đôi mắt ngập trạng nỗi sợ hãi của một con [ROOT.Char.Custom('GetAnimalType')] biết rõ cuộc săn đuổi đã đến hồi kết."
  bp1_yearly.9049.a:0 "Ta sẽ cắn một miếng từ ngươi!"
  bp1_yearly.9049.b:0 "Xong rồi."
  bp1_yearly.9049.c:0 "$bp1_yearly.9049.b$... cho ngươi!"
 
  bp1_yearly.9050.t:0 "Truyện Chiến Tranh"
  bp1_yearly.9050.desc:0 "Một trong những điều yêu thích nhất mà [bp1_yearly_9050_friend.GetNamePossessive] thường làm cùng ta là ngồi bên đống lửa và chia sẻ những câu chuyện chiến trường vào một đêm đẹp trời, và đêm nay chúng ta đã ôn lại kỷ niệm từ lúc mặt trời mọc cho đến lúc trăng lên rồi lại đến khi bình minh ló rạng!\n\nTa bắt đầu bằng việc kể về khoảng thời gian khi [bp1_yearly_9050_my_memory.GetDescription], khiến [bp1_yearly_9050_friend.GetFirstNameNoTooltip] vỗ tay của [bp1_yearly_9050_friend.GetHerHis] và cười lớn.\n\n"Một giai thoại tuyệt vời! Dù thực sự, ta nói cho ngươi nghe này người bạn của ta, không có sự kiện nào huy hoàng hơn trong toàn bộ lịch sử bằng lúc [bp1_yearly_9050_friend_memory.GetDescription]! Ha! Chúng ta đã có những ngày tháng thật vinh quang biết bao, và ta cầu nguyện sẽ còn nhiều vinh quang hơn nữa đang đón chờ phía trước!""
  bp1_yearly.9050.a:0 "Không ai kể chuyện hay bằng [bp1_yearly_9050_friend.GetFirstNameNoTooltip]!"
  bp1_yearly.9050.b:0 "#EMP Câu chuyện của Ta rõ ràng hay hơn!"
  exploitative_lord_modifier:0 "Lãnh Chúa Lợi Dụng"
  exploitative_lord_modifier_desc:0 "Nhân vật này lợi dụng cả những tá điền nghèo khổ nhất, miễn là có thể kiếm được tiền."
