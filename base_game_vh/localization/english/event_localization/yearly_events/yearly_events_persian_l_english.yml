l_english:
  yearly_persian.1002.t:0 "Nowruz"
  yearly_persian.1002.desc:1 "Trong khi triều đình Ta hằng năm đều tổ chức lễ hội Nowruz của [iranian.GetName], trách nhiệm của Ta với vai trò [ROOT.Char.GetTitleAsNameNoTooltip] thường khiến Ta khó tham gia các nghi lễ ăn mừng.\n\nVới tiết phân năm sắp đến và vương quốc Ta đang trong trạng thái thịnh vượng và ổn định, Ta tự hỏi liệu năm nay có nên dành chút thời gian để rời khỏi [ROOT.Char.Custom('ResidenceBuilding')] và hòa mình vào không khí lễ hội không?"
  yearly_persian.1002.a:0 "Ta sẽ tôn vinh Jamshid bằng những món quà hào phóng gồm đá quý và vàng!"
  yearly_persian.1002.b:0 "Đây là dịp vui, nên dành thời gian thăm hỏi mọi người!"
  yearly_persian.1002.c:0 "Tập trung thực hiện nghi lễ Haft-sin truyền thống cùng gia đình."
  yearly_persian.1002.d:0 "Ta không thể nghỉ, còn quá nhiều việc phải làm!"
  yearly_persian.1002.every_iranian_character:2 "Mọi [iranian.GetName] [heritage|E] chư hầu và quan lại"
  yearly_persian.1002.every_friend_and_neighboring_ruler:0 "Mọi [friend|E] và [ruler|E] lân cận"
  yearly_persian.1002.every_spouse_and_close_family_member:0 "Mọi [spouse|E] và [close_family_member|E]"
  yearly_persian.1101.t:0 "Shu'ubiyya"
  yearly_persian.1101.desc.arabic:0 "Cùng với sự lan rộng của Hồi giáo, văn hóa Ả Rập cũng đã lan tỏa ra khỏi bán đảo Ả Rập."
  yearly_persian.1101.desc.seljuk:0 "Kể từ cuộc chinh phục vĩ đại của Seljuk, lịch sử và văn hóa của chúng ta đã lan truyền đến các thần dân mới."
  yearly_persian.1101.desc.ending:0 "\n\nNhiều bộ tộc và nền văn hóa đã tiếp nhận ngôn ngữ và truyền thống [ROOT.Char.GetCulture.GetName] của chúng ta, nhưng người Ba Tư sinh sống trên Cao nguyên Iran đã chống lại sự lan rộng này một cách quyết liệt.\n\nHọ rút ra truyền thống văn hóa riêng từ di sản của các Đế chế Achaemenid và Sasanid vĩ đại, tự hào dữ dội về tổ tiên và muốn bảo tồn lịch sử của mình, ngay cả dưới sự cai trị của người nước ngoài."
  yearly_persian.1101.every_county:0 "Mọi hạt [persian.GetName]"
  yearly_persian.1101.every_family:0 "Mọi [close_family_member|E]"
  yearly_persian.1101.a:0 "Ta sẽ buộc tất cả họ phải chịu sự thống trị của [ROOT.Char.GetCulture.GetNameNoTooltip]!"
  yearly_persian.1101.b.seljuk:0 "Nếu ta tiếp nhận #EMP phong tục#! của họ, ta có thể sáng lập Đế chế Ba Tư thứ ba!"
  yearly_persian.1101.c:0 "Chúng ta thật may mắn khi có thần dân với xuất thân đa dạng như vậy!"
  yearly_persian.1101.c.warning:0 "$stewardship_domain.1073.c.warning$"
