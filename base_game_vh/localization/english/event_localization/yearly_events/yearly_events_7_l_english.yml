l_english:
 ## Desperate faction vassals attempt a coup by Isabella Welch
  yearly.7001.t:0 "Ngày Cuối Cùng"
  yearly.7001.desc:0 "Người [marshal.GetCouncilTitle] của Ta, [marshal.GetTitledFirstNameNoTooltip], trao cho Ta vũ khí yêu thích [ROOT.Char.Custom('signature_weapon')]. Nó được mài sắc và đánh bóng, đến nỗi Ta thấy phản chiếu một phần khuôn mặt mình trên đó.\n\n“Ngươi nên mang vũ khí này vì chính bản thân mình. Những kẻ chống đối lảng vảng trong bóng tối như những con chuột bệnh, và mỗi lần ta tham dự một sự kiện công khai, Ta tự hỏi liệu đó có phải lần cuối cùng chúng ta xuất hiện không.”\n\n[marshal.GetSheHe|U] nhìn ra ngoài cửa sổ. “Có lẽ chúng ta nên tăng tuần tra bảo vệ... Không khí sáng nay có mùi bệnh tật, và ta cảm thấy lo lắng.”"
  yearly.7001.a:0 "Điều đó sẽ làm khách sợ hãi! Chỉ là hoang tưởng thôi."
  yearly.7001.b:0 "Thêm vài nhóm tuần tra cho yên tâm."
  yearly.7001.c:0 "Ngươi #EMP biết#! điều gì sao, [marshal.GetTitledFirstNameNoTooltip]?"
  yearly.7001.c.tt:0 "[marshal.GetTitledFirstNameNoTooltip] kể thêm cho Ngài về những nghi ngờ của [marshal.GetHerHis]"
  yearly.7001.tt:0 "[marshal.GetTitledFirstNameNoTooltip] gạt qua câu hỏi của Ngài"
  yearly.7001.d:0 "Điều quân canh [ROOT.GetCharacter.Custom('FortifiedBuilding')]. Không để phòng nào trống mắt!"
  yearly.7001.d.tt:0 "Ngươi làm mọi người sợ hãi khi đến triều đình"
  yearly.7001.d.win.tt:0 "Ngươi làm các phe phái nhắm vào ngươi phải khiếp sợ"
## Letter of warning from your marshal who is a sympathizer
  yearly.7002:0 "Ngươi đang gặp nguy hiểm ngay lập tức, [ROOT.Char.Custom('FormOfAddressForLiege')]"
  yearly.7002.d:0 "Ta chỉ cảm thấy xấu hổ khi viết những lời này. [coup_leader.GetTitledFirstName] đã mất nhiều tháng hối lộ vệ binh của ngươi. [coup_leader.GetSheHe|U] định tiến hành một cuộc tấn công mạng sống của ngươi trước mặt triều đình... Ta mong ngươi được an toàn, nhưng dù cố gắng thế nào, Ta cũng không thể ngăn trái tim mình đau cho lý tưởng của [coup_faction.GetName].\n\nTa đã chạy vào lưu vong. Chúng ta sẽ không gặp lại."
  yearly.7002.a:0 "Ta không thể tin ai!"
  yearly.7002.b:0 "Ta phải tin vài [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] thân cận để bảo vệ Ta!"
  yearly.7002.b.tt:0 "[knight_1.GetTitledFirstName] và [knight_2.GetTitledFirstName] là những chiến binh xuất sắc. Ta phải hy vọng họ sẽ bảo vệ Ta."
  yearly.7002.c:0 "Ta có thể tự bảo vệ bản thân!"
  yearly.7002.b.tt.2:0 "Ngươi tâm sự với hai vệ sĩ"
  yearly.7002.c.tt:0 "Ngươi giữ bí mật này"
#### Traitor knights carry you off in a sack
  yearly.7004.desc:0 "“Nhanh lên! [ROOT.GetCharacter.GetSheHe|U] đang tỉnh dậy!”\n\nKhi tỉnh dậy, gối của Ta thô ráp hơn thường lệ. Đầu quay cuồng, cả cơ thể di chuyển theo và mọi thứ vẫn tối đen. Ta không nằm trên giường, mà đang bị kéo theo mặt đất trong một bao tải.\n\n“[ROOT.GetCharacter.GetSheHe|U] vùng vẫy quá! Ta liên tục mất tay cầm.”\n\nKhi các giọng nói cãi nhau, Ta đấu tranh đủ để họ thả bao. Khi bò ra ngoài, Ta nhận ra họ mới đi được vài bước khỏi vườn [ROOT.GetCharacter.Custom('FortifiedBuilding')]."
  yearly.7004.tt:0 "Âm mưu của phe đã bị phá vỡ"
  yearly.7004.a:0 "Ngươi gọi đây là bắt cóc? Ít ra Ta cũng mong ngươi đến được [neighbor_county.GetNameNoTier]."
  yearly.7004.b:0 "Kẻ phản bội! Hai ngươi sẽ bị nhốt trong bao tại ngục của Ta!"
  yearly.7004.c:0 "Mang ta trở lại giường ngay lập tức!"
  yearly.7004.c.tt:0 "Ngươi được đưa lại vào bao và vận chuyển về phòng"
#### Assassination attempt
  yearly.7005.preparation:0 "Thật hồi hộp khi ngồi chờ [coup_faction.GetName] ra tay."
  yearly.7005.preparation_poor:1 "Ta quyết định chỉ tin vào [ROOT.Char.Custom('SignatureWeaponNameOrType')] của mình, và nếu cần, chúng Ta sẽ cùng tới [ROOT.Char.Custom('GetAfterLifeDestination')]."
  yearly.7005.preparation_good:0 "Thật buồn cười khi họ nghĩ vài sát thủ có thể giết Ta."
  yearly.7005.knight_support:0 "[knight_1.GetTitledFirstName] và [knight_2.GetTitledFirstName] sẵn sàng hy sinh vì Ta, nhưng Ta thương những ai đối mặt với lưỡi gươm của họ."
  yearly.7005.single_knight_support:0 "Sau cùng, Ta tin [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] sẽ hỗ trợ Ta."
  yearly.7005.decreased_security:1 "Mọi khách trong [ROOT.GetCharacter.Custom('FortifiedBuilding')] nhâm nhi [ROOT.Char.Custom('RegionalDrink')] và bàn tán vô tư."
  yearly.7005.increased_security:1 "[ROOT.GetCharacter.Custom('FortifiedBuilding')] yên tĩnh, vài nhóm thì thầm. Ai cũng căng thẳng khi thấy phòng ngai vàng được canh gác."
  yearly.7005.throne_approach:0 "[coup_leader.GetTitledFirstName] tiến về ngai vàng của Ta."
  yearly.7005.liberty_faction:0 "“Có lẽ cách duy nhất để phá xiềng là tự cắt cổ ta và ngươi.”"
  yearly.7005.independence_faction:0 "\n\n“Nếu ta không có quốc gia riêng, ít nhất ta phải là anh hùng của bi kịch riêng.”"
  yearly.7005.claimant_faction:1 "“Ngươi không có quyền ngồi trên ngai đó. Ta thà chết còn hơn thấy ngươi ra thêm một mệnh lệnh giả dối.”"
  yearly.7005.populist_faction:0 "“Ta đau lòng, thề rằng không thể ban cho ngươi cái chết công bằng hơn so với đau khổ của những ai bị dẫm dưới chân ngươi. Ít ra kết thúc của ta sẽ là của một anh hùng.”"
  yearly.7005.weapon:1 "\n\n[coup_leader.GetSheHe|U] rút dao giấu sẵn và lao tới."
  yearly.7005.single_death:0 "Trong một khoảnh khắc kinh hoàng, [coup_leader.GetSheHe] trúng [first_character_kill.GetTitledFirstName]"
  yearly.7005.double_death:0 "Trong vụ đôi, [coup_leader.GetSheHe] đánh trúng [first_character_kill.GetTitledFirstName] và [second_character_kill.GetTitledFirstName]"
  yearly.7005.triple_death:0 "Trước kinh hãi của tất cả, [coup_leader.GetSheHe] tấn công [first_character_kill.GetTitledFirstName], [second_character_kill.GetTitledFirstName] và [third_character_kill.GetTitledFirstName]."
  yearly.7005.coup_ruler_strike:0 "trước khi lao tới đánh Ta."
  yearly.7005.no_death:0 "Điên rồ ấy kết thúc nhanh chóng khi [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] nhanh chóng bao quanh [coup_leader.GetHerHim]."
  yearly.7005.failure:0 "Khi lính gác khống chế [coup_leader.GetHerHim], ta nhận ra [coup_leader.GetSheHe] đang điên cuồng cố gắng đâm lưỡi kiếm vào chính trái tim của [coup_leader.GetHerHis] thà chết chứ không chịu để bị bắt."
  yearly.7005.ruler_death:1 "Máu họ sớm hòa vào máu Ta khi [coup_leader.Custom('SignatureWeaponNameOrType')] chém vào ngực Ta."
  yearly.7005.success:1 "Thật ngu ngốc khi nghĩ rằng [coup_leader.GetSheHe] có thể đoạt lấy ngai vàng của ta bằng cuộc đảo chính nhỏ nhoi này, nhưng khi [coup_leader.GetSheHe] kề lưỡi kiếm vào chính cổ họng của [coup_leader.GetHerHis], ta nhận ra đây chưa bao giờ là điều [coup_leader.GetSheHe] thực sự mong muốn."
  yearly.7005.a:0 "Vệ binh, trói [coup_leader.GetHerHim], [coup_leader.GetSheHe] không được trở thành tử vì đạo cho kẻ chống đối."
  yearly.7005.b:0 "Để [coup_leader.GetHerHim] tự làm."
  yearly.7005.c:0 "Ngươi đáng phải chịu số phận tệ hơn cái chết ở đây!"
  yearly.7005.c.tt:0 "Ngươi bịt mắt và nhốt [coup_leader.GetTitledFirstName]"
  yearly.7005.d:0 "Lưu đày [coup_leader.GetHerHim], kể lại câu chuyện về việc khó mà giết được ta."
  yearly.7005.d.tt:0 "Ngươi sẽ nhận tất cả tước hiệu và chư hầu của [coup_leader.GetTitledFirstNamePossessive]"
  yearly.7005.devout.e:0 "Ngươi sẽ không bao giờ cùng ta ở [ROOT.Char.GetFaith.PositiveAfterLife], đồ tồi tệ!"
  yearly.7005.e:0 "Ta sẽ giết ngươi ở [ROOT.Char.GetFaith.NegativeAfterLife], đồ khốn!"
 ##Participate in a football game,
 #Set up event
  yearly.7010.t:0 "Trò Chơi Đẹp"
  yearly.7010.desc:0 "Một chuyến đi đến làng trong lãnh địa dẫn Ta vào một tình huống thú vị. Hầu hết dân làng đều ra quảng trường, chia thành hai nhóm lộn xộn.\n\nCân đối với cả hai nhóm – chỉ thấy từ vị trí Ta nhờ một dân làng lo lắng giữ – là một bàng heo bơm phồng.\n\nCó lẽ nhận thấy vẻ mặt thắc mắc của Ta, một Bạn Bè nhanh chóng giải thích: hóa ra đây là một trò chơi phổ biến!"
  yearly.7010.a:0 "Thật thú vị! Luật chơi là gì?"
  yearly.7010.b:0 "Thôi, tốt hơn để họ tự chơi."
  yearly.7010.tt.yes:0 "Điều tra sự việc."
  yearly.7010.tt.win:0 "Điều này có thể giúp Ngài chiến thắng!"
  yearly.7010.tt.lose:0 "Chọn điều này có thể giảm cơ hội thắng!"
 #Valet explains game
  yearly.7011.t:0 "Trò Chơi Đẹp: Đánh Giá Rủi Ro"
  yearly.7011.desc:0 "Bạn Bè trung thành lo lắng giải thích luật chơi. Trò #EMP 'bóng đá'#! được chơi rộng rãi, với đủ loại người tham gia.\n\nCả hai bên đều cố đưa 'bóng' – bàng heo – sang phía làng mà nhóm họ không bảo vệ bằng mọi cách.\n\nPhần cuối được nhấn mạnh nghiêm trọng, giải thích nhanh: chết hiếm, nhưng bị thương thì không."
  yearly.7011.a:0 "Ngươi nghĩ còn chỗ cho ta không?"
  yearly.7011.b:0 "Hoạt động phổ biến của dân thường. Thôi để họ."
  yearly.7011.tt:0 "Mang giày cho ta!"
 #Pre-game: Literal Under Armour
  yearly.7012.t:0 "Trò Chơi Đẹp: Trang Bị Toàn Diện..."
  yearly.7012.desc:0 "Khi ta đứng giữa đám đông bách tính, ta bắt gặp một kẻ [dummy_gender.GetWomanMan] trung niên đang điều chỉnh vài sợi dây da bên dưới chiếc áo tu-nic của [dummy_gender.GetHerHis]. Giờ ta mới chú ý thấy, trên thực tế, toàn bộ phần bụng của [dummy_gender.GetHerHis] trông quá đỗi cồng kềnh đối với một người có vóc dáng tương đối gầy gò như [dummy_gender.GetHerHis], ngực và bụng của [dummy_gender.GetHerHis] hơi căng ra dưới lớp quần áo chật chội của [dummy_gender.GetHerHis]. Nhận thấy sự quan tâm của ta, người đó mỉm cười rạng rỡ, ra hiệu bảo ta lại gần hơn rồi vén lớp vải lên.\n\nBên dưới chiếc áo tu-nic của [dummy_gender.GetHerHis], quấn quanh cơ thể của [dummy_gender.GetHerHis] là những lớp thanh gỗ thô sơ được xếp lại mô phỏng theo một bộ giáp.\n\n“Ta gọi nó là #EMP 'áo giáp lót bên trong'#!!” [dummy_gender.GetSheHe] tự hào cất lời cùng một cái nháy mắt kèm theo."
  yearly.7012.a:0 "Ngươi muốn bao nhiêu cho nó?"
  yearly.7012.b:0 "Thật nực cười."
 #Pre-game: Wealthy merchant buys your best player
  yearly.7013.t:0 "Trò Chơi Đẹp: Một Chuyển Nhượng Lớn"
  yearly.7013.desc:0 "Quan sát đám đông bách tính, ta có thể thấy một kẻ [dummy_gender.GetWomanMan] trông lạc lõng một cách kỳ lạ. Ăn vận những bộ lông thú đắt tiền cùng một đoàn tùy tùng nhỏ, [dummy_gender.GetSheHe] đang say sưa trò chuyện với một kẻ [dummy_gender.GetWomanMan] khác to lớn hơn đáng kể. Len lỏi qua đám đông, ta tiến lại gần khu vực của họ vừa kịp lúc để chứng kiến tên thương nhân giàu có thả một túi tiền nhỏ vào tay kẻ kia.\n\n”...rất hân hạnh được giao dịch với ngươi. Giờ thì hãy đảm bảo rằng ván cược của ta là một ván cược an toàn!” tên thương nhân nọng cằm cười ranh mãnh.\n\nKhi kẻ [dummy_gender.GetWomanMan] to lớn bắt đầu tiến về phía nhóm của đội đối thủ, có vẻ như một số kẻ chẳng hề bận tâm đến tính thiêng liêng của trò chơi này…"
  yearly.7013.a:0 "Chờ đã! Bất cứ thứ gì [dummy_gender.GetSheHe] trả, Ta sẽ gấp đôi!"
  yearly.7013.b:0 "Kinh tởm. Ngày xưa chưa từng xảy ra!"
  yearly.7013.c:0 "Có vẻ ta phải thắng mà không có [dummy_gender.GetHerHim]!"
 #Pre-game: Messing with pies
  yearly.7014.t:0 "Trò Chơi Vẹn Toàn: Mắt Hướng Vào Bánh"
  yearly.7014.desc:1 "Một thợ bánh địa phương nhanh trí rõ ràng đã nhận thấy đám đông tụ họp, và hai chiếc xe chở bánh nướng thơm lừng của [dummy_gender.GetHerHis] đang được săn đón.\n\nTa thong thả tiến tới chiếc xe mà đội đối phương đang vây quanh, nhận thấy nan hoa của một bánh xe gần như nứt vụn. Nghĩ đến điều đó chưa lâu thì cơ hội đã hiện ra, khi tiếng va chạm vang dội từ một vật rơi ở phía xa quảng trường khiến mọi người quay sang trố mắt.\n\nChỉ một cú đá nhanh vào nan hoa đó, và…"
  yearly.7014.desc.1:0 "Một thợ bánh địa phương nhanh trí rõ ràng đã nhận thấy đám đông tụ họp, và hai chiếc xe ọp ẹp chất đầy bánh thịt nóng hổi của [dummy_gender.GetHerHis] đang rất được ưa chuộng.\n\nTa thong thả tiến tới chiếc xe mà đội đối phương đang vây quanh, liếc nhìn qua những khay bánh nóng hổi. Nghĩ đến điều đó chưa lâu thì cơ hội đã hiện ra, khi tiếng va chạm vang dội từ một vật rơi ở phía xa quảng trường khiến mọi người quay sang trố mắt.\n\nBàn tay ta chạm tới chiếc túi nhỏ chứa độc thạch tại thắt lưng…"
  yearly.7014.a:0 "Xem ngươi chơi ra sao đây…"
  yearly.7014.b:0 "Ôi không, tất cả bánh rơi xuống bùn rồi!"
  yearly.7014.c:0 "Tốt hơn là ta không nên."
  yearly.7014.hemlock:0 "Rắc thêm một chút nguyên liệu đặc biệt lên bánh..."
 #Pre-game: Performance-Enhancing Draughts
  yearly.7015.t:0 "Trò Chơi Đẹp: Thức Uống Tăng Sức Mạnh"
  yearly.7015.desc:0 "Khi ta đang chuẩn bị sẵn sàng cho nỗ lực sắp tới, ta bắt gặp một kẻ [dummy_gender.GetWomanMan] ở rìa đám đông đang tu từng ngụm lớn từ một chiếc bình, đôi mắt của [dummy_gender.GetHerHis] đảo liên hồi giữa những ngụm uống. Bình thường thì điều này sẽ không quá đáng nghi, nhưng sự lén lút của [dummy_gender.GetHerHis] thì có, và thậm chí còn đáng nghi hơn khi [dummy_gender.GetSheHe] rụt rè lo sợ trước cái vỗ vai dò hỏi của ta.\n\nBất kể thứ [dummy_gender.GetSheHe] đang uống là gì thì nó không phải là nước: thứ chất lỏng này hơi đục, và rõ ràng từ cái nhăn mặt của [dummy_gender.GetHerHis] mỗi khi môi của [dummy_gender.GetHerHis] chạm vào nó chứng minh rằng nó chắc chắn không hề dễ nếm chút nào. May mắn thay, [dummy_gender.GetSheHe] gần như háo hức muốn tiết lộ những bí mật của [dummy_gender.GetHerHis] khi bị thúc nhẹ.\n\n'Tăng cường hiệu suất', ngươi nói vậy sao?"
  yearly.7015.a:0 "...Ngươi muốn bao nhiêu cho nó?"
  yearly.7015.b:0 "Ngươi nên xấu hổ!"
 #Game starts!
  yearly.7020.t:0 "Trò Chơi Đẹp: Bắt Đầu"
  yearly.7020.desc:0 "Sau mọi chuẩn bị, chỉ còn khởi động sự kiện. Người báo tin, nghiêng ra ngoài cửa sổ tầng một, tung bàng heo qua khung cửa.\n\nĐám đông nhìn lên mong đợi, một lúc sau, 'bóng' cất cánh.\n\nCuộc hỗn loạn bắt đầu."
  yearly.7020.a:0 "Theo Ta, đội ơi!"
  yearly.7020.b:0 "AAAAAAAAAAARGGGHHHH!"
 #First half: A villager comes at you with a rock!
  yearly.7021.t:0 "Trò Chơi Đẹp: Đá Tới"
  yearly.7021.desc:0 "Trò chơi này còn dữ dội hơn tưởng tượng. Danh tiếng bạo lực không vô lý.\n\nBên trái, một [dummy_gender.GetWomanMan] giữ một người khác, cả hai đi qua trận đánh tay đôi bốn người.\n\nKhi Ta tránh xa cuộc ẩu đả, một dân làng khác — mắt trợn, máu chảy từ trán — tiến tới với một hòn đá."
  yearly.7021.a:0 "Này! Trò này bất hợp pháp!"
  yearly.7021.b:0 "TA SẼ LÀM NGƯƠI ĂN HÒN ĐÁ NÀY!"
  yearly.7021.c:0 "Phải chạy thôi!"
  yearly.7021.a.tt.win:0 "Ngươi đẩy hòn đá đi!"
  yearly.7021.a.tt.lose:0 "Ngươi không thể tự vệ"
  yearly.7021.c.tt.escape:0 "Ngươi thoát an toàn"
  yearly.7021.c.tt.escapefail:0 "Ngươi không thể thoát"
 #First half: Player is getting seduced by a winsome lad/lass
  yearly.7022.t:0 "Trò Chơi Đẹp: Cú Nhìn Say Đắm"
  yearly.7022.desc:0 "Đội đối phương đang giữ bóng! Kẻ dẫn bóng là một [dummy_gender.GetWomanMan] trẻ tuổi có ngoại hình ưa nhìn, và rõ ràng cũng là một kẻ vô cùng khôn ngoan; sau khi chiếm được bóng, [dummy_gender.GetSheHe] đang trong quá trình trèo lên một ngôi nhà để trốn thoát khỏi đám đông đang gào thét bên dưới.\n\nMặc dù kế hoạch của [dummy_gender.GetHerHis] ban đầu có vẻ hoàn hảo không tỳ vết, nhưng dường như [dummy_gender.GetSheHe] đã không lường trước được những dục vọng tầm thường của [dummy_gender.GetHerHis]: khi ta tự mình trèo lên ngang tầm với [dummy_gender.GetHerHis] trên mặt tiền của ngôi nhà, [dummy_gender.GetSheHe] rõ ràng đang bị xao nhãng bởi một kẻ [same_gender.GetWomanMan] đặc biệt quyến rũ ở ô cửa sổ.\n\nHai người bọn họ dường như hoàn toàn say đắm lẫn nhau. Ta chỉ còn cách một tầm tay..."
  yearly.7022.a:0 "Trộm!"
  yearly.7022.b:0 "À, tình yêu tuổi trẻ!"
  yearly.7022.c:0 "Ha! Ta sẽ cho ngươi thấy [ROOT.Char.GetWomanMan] thực thụ!"
 #First half: Punching a priest
  yearly.7023.t:0 "Trận Đấu Tuyệt Vời: Bàn Tay Của [ROOT.Char.GetFaith.HighGodName]"
  yearly.7023.desc:0 "Bóng bàng quang lợn bị lỏng! Một đôi tay lo lắng vụng về, và nó nảy lên một lần trước khi bị… một thành viên của [ROOT.Char.GetFaith.AltPriestTermPlural] chộp lấy?\n\n[dummy_clergy_gender.GetSheHe|U] cười toe toét và loạng choạng tiến tới, đám đông tách ra một cách bối rối trước [dummy_clergy_gender.GetHerHim]. Không ai thực sự biết phải nghĩ gì về người linh thiêng này khi chơi một trò bạo lực như vậy và hơn nữa, dường như còn thoát được!\n\nTa bước tới một cách ngờ vực..."
  yearly.7023.a:0 "...và đấm thẳng vào mặt [dummy_clergy_gender.GetHerHim]."
  yearly.7023.b:0 "...và đứng sang một bên. Để người khác xử lý [dummy_clergy_gender.GetHerHim]."
 #First half: Damaging a local building
  yearly.7024.t:0 "Trận Đấu Tuyệt Vời: Mái Rơm"
  yearly.7024.desc:0 "Đám đông ập tới và đập vào tường của một ngôi nhà gần đó như một cơn sóng. Khi nhóm rút lui khỏi tường, vài người bám vào bất cứ chỗ nhô ra nào trong khi người khác cố gắng kéo họ ra để tiếp cận người cầm bóng.\n\nTiếng gỗ vỡ và mái tranh sập vang quanh quảng trường, và khi đám đông rút lui, vài phần của mái rơm ngôi nhà rơi xuống đất."
  yearly.7024.a:0 "Ta sẽ trả tiền sửa chữa!"
  yearly.7024.b:0 "Trong tình yêu và bóng đá, mọi thứ đều công bằng!"
 #Second half: Diving scum
  yearly.7030.t:0 "Trận Đấu Tuyệt Vời: Không Một Phạt Đền"
  yearly.7030.desc:0 "Khi trận đấu kéo dài, càng nhiều người dân làng phải rút lui. Một người loạng choạng đi ngang qua Ta, vết bầm trên đầu đã hiện rõ.\n\nĐột nhiên, thêm một người từ nhóm ngã xuống chân Ta với tiếng hét chói tai. Tiếng ồn đủ để làm phân tâm các người tham gia, và cả đám đông lẫn Ta đều lùi lại khỏi người đang quằn quại - mặc dù Ta chắc chắn #EMP thề#! Ta đã thấy một mắt mở ra...\n\nNgay khi ánh sáng đủ xuyên qua đám đông, người 'bị thương' bật dậy và nhặt bóng, lao về phía Ta trên quảng trường!"
  yearly.7030.a:0 "Ta-... ừh-... #EMP trọng tài!#!"
  yearly.7030.b:0 "Kẻ gian! Ta sẽ bắt hắn!"
  yearly.7030.c:0 "Ồ, may quá, hắn hồi phục nhanh!"
  yearly.7030.b.win:0 "Ngài bắt được kẻ lừa đảo"
  yearly.7030.b.lose:0 "Ngài bỏ lỡ kẻ gian"
 #Second half: Bladed boots
  yearly.7031.t:0 "Trận Đấu Tuyệt Vời: Cắn Mắt Cá Chân"
  yearly.7031.desc:0 "Trận đấu tiếp diễn, và Ta nhận thấy đội của mình bắt đầu thưa dần. Một vài người tham gia nằm rải rác trên quảng trường, tất cả đều bị thương mắt cá chân. #EMP Thương nặng#! mắt cá chân, nhìn vậy mà rõ. Khi Ta chiến đấu với những người xung quanh, một tia sáng gần sàn thu hút ánh mắt Ta, và Ta nhận ra kinh hoàng số phận của đồng đội.\n\nMột vài người dân khát máu đã may lưỡi dao nhỏ vào giày, và ngay cả khi Ta nhìn, họ đã cào vào bắp chân người khác. Ta cân nhắc tiến lên đối đầu."
  yearly.7031.a:0 "Cởi giày của họ ra!"
  yearly.7031.b:0 "Ta thích bắp chân mình như thế này!"
  yearly.7031.c:0 "Ý tưởng mới lạ thật…"
  yearly.7031.a.win:0 "Ngài giật giày ra khỏi họ"
  yearly.7031.a.lose:0 "Họ đá vào bắp chân Ngài!"
 #Second half: Drinks break
  yearly.7032.t:0 "Trận Đấu Tuyệt Vời: Giải Lao"
  yearly.7032.desc:0 "Đám đông lắc qua bên, đẩy Ta ra khỏi giữa với một lực đáng kể. Loạng choạng tiến đến một bức tường để lấy lại định hướng và thở, Ta thấy vài thương nhân mang đầy thức uống. Họ hẳn làm ăn tốt, vì công việc này vất vả!\n\nTa cũng cần chút gì đó để nạp năng lượng. Ta tự hỏi họ bán gì nhỉ?"
  yearly.7032.a:0 "Nước mát! Tuyệt vời!"
  yearly.7032.b:0 "Một ly bia cũng ổn!"
  yearly.7032.c:0 "Ngài không có chút [ROOT.Char.Custom('RegionalDrink')] nào chứ?"
  yearly.7032.d:0 "Có bán bánh cần sa không?"
 #Second half: Bowyer and dyer fight
  yearly.7033.t:0 "Trận Đấu Tuyệt Vời: Tranh Sắc"
  yearly.7033.desc:0 "Đánh nhau với đối thủ trong những trận đấu này rất phổ biến, nhưng Ta khá bối rối khi thấy hai đồng đội dường như đang đánh nhau #EMP! với nhau#!. Ngài nhận ra mỗi người; một là thợ cung địa phương, người kia là thợ nhuộm vải. Hai người kịch chiến dữ dội, đến mức đồng đội họ bắt đầu chú ý.\n\nTranh chấp nhỏ nhặt này bắt đầu chiếm một phần đáng kể đội Ta, và đám đông tiến về phía làng chúng Ta bảo vệ..."
  yearly.7033.a:0 "Được rồi, giải tán!"
  yearly.7033.b:0 "Ta không bận tâm giải quyết những cãi vặt."
  yearly.7033.a.win:0 "Ngài tách các kẻ đánh nhau thành công"
  yearly.7033.a.lose:0 "Trận cãi vặt leo thang"
 #Match resolution holding event
  yearly.7040.t:0 "Trận Đấu Tuyệt Vời: Kết Quả Cuối"
  yearly.7040.desc:0 "Khi ngày trôi qua, nhịp điệu trận đấu đạt đỉnh điểm. Hai bên lao về phía bóng, và Ta bị cuốn vào một xoáy trong dòng người.\n\nTa ngã xuống, bảo vệ đầu khỏi bàn chân giẫm, rồi đứng dậy thấy quảng trường bất thường yên ắng.\n\nCó vẻ như trận đấu kết thúc."
  yearly.7040.a:0 "Chúng ta… thắng chứ?"
 #Glorious victory
  yearly.7041.t:0 "Trận Đấu Tuyệt Vời: Chiến Thắng Vinh Quang!"
  yearly.7041.desc:0 "Đội Ta nâng Ta đứng lên, và tiếng hò reo làm tim Ta phấn khích đến mức tràn đầy! Không chỉ là chiến thắng; đó là #EMP một trận đòn#!, và Ngài góp phần không nhỏ!\n\nĐối thủ bắt đầu "
  yearly.7041.a:0 "Trận đấu thật tuyệt vời!"
  yearly.7041.b:0 "Ta sẽ đặt một kỷ vật!"
  yearly.7041.desc.ending:0 "trôi đi một cách ủ rũ, nhưng bữa tiệc mới chỉ bắt đầu cho người chiến thắng. Một thùng lớn [ROOT.Char.Custom('RegionalDrink')] đã chiếm vị trí trung tâm, và đồ uống đang chảy tự do cho lễ ăn mừng chắc chắn kéo dài đến tối."
 #Victory
  yearly.7042.t:0 "Trận Đấu Tuyệt Vời: Chiến Thắng!"
  yearly.7042.desc:0 "Ta loạng choạng đứng dậy, cố tập trung khi mọi người đi qua. Ở giữa quảng trường, một nhóm đang ăn mừng; Ta mất vài giây mới nhận ra đó thực ra là đội mình!\n\nĐối thủ bắt đầu "
  yearly.7042.a:0 "Trận đấu thật tuyệt vời!"
  yearly.7042.b:0 "Ta sẽ đặt một kỷ vật!"
 #Draw
  yearly.7043.t:0 "Trận Đấu Tuyệt Vời: Hòa"
  yearly.7043.desc:0 "Loạng choạng đứng dậy, Ta vẫn bị bao quanh bởi đám đông. Sự khác biệt là tốc độ di chuyển gấp gáp hơn, các cầu thủ dường như rút lui một cách thờ ơ.\n\nMặt trời lặn dần, có vẻ như trận đấu kết thúc mà không có kết quả quyết định."
  yearly.7043.a:0 "Thôi được. Lần sau chúng ta sẽ thắng!"
 #Defeat
  yearly.7044.t:0 "Trận Đấu Tuyệt Vời: Thua!"
  yearly.7044.desc:0 "Ta loạng choạng đứng dậy, cố tập trung khi mọi người đi qua. Ở giữa quảng trường, một nhóm ăn mừng; Ta mất vài giây mới nhận ra… đó là đội đối thủ.\n\nĐội Ta bắt đầu "
  yearly.7044.a:0 "Chúc mừng người chiến thắng!"
  yearly.7044.b:0 "Chết! Chúng ta đáng ra thắng!"
  yearly.7044.c:0 "Dù sao Ta cũng xứng đáng có cúp!"
 #Heavy Defeat
  yearly.7045.t:0 "Trận Đấu Tuyệt Vời: Thảm Bại!"
  yearly.7045.desc:0 "Bàn chân giẫm vang rền, Ta loạng choạng đứng dậy để xác định lý do. Cách đó không xa, đội đối thủ giơ bóng lên và reo hò chiến thắng. Không chỉ thua; đó là một trận phá hủy hoàn toàn.\n\nĐội Ta bắt đầu "
  yearly.7045.a:0 "Chúc mừng người chiến thắng!"
  yearly.7045.b:0 "Chết! Chúng ta đáng ra thắng!"
  yearly.7045.c:0 "Dù sao Ta cũng xứng đáng có cúp!"
 ##Foggy Hill
 #There used to be a hole here
  yearly.7050.t: "Có Hố Ở Đây?"
  yearly.7050.desc: "Ta gặp [unfortunate_soul.GetTitledFirstName] trong hành lang, chăm chú nhìn bức tường. Ta tò mò hỏi [unfortunate_soul.GetSheHe] đang làm gì.\n\n[unfortunate_soul.GetHerHis|U] nhìn Ta với một nháy mắt đáng ngại: 'Trước đây có một cái hố ở đây, Ngài biết không,' [unfortunate_soul.GetTitledFirstNameNoTooltip] nói với sự chắc chắn.\n\nTa nhìn bức tường trước mặt [unfortunate_soul.GetHerHim] — không thể tìm thấy dấu vết nào của cái hố được nhắc đến."
  yearly.7050.a: "Cái… hố đâu?"
  yearly.7050.a_paranoid: "Ta phải tìm hiểu thêm."
  yearly.7050.a.flavor: "Thật là một ý tưởng thú vị."
  yearly.7050.b: "Nonsense."
  yearly.7050.b.flavor: "[unfortunate_soul.GetShortUIName] hẳn là mê sảng."
  yearly.7050.c: "Đừng lãng phí thời gian của Ta!"
 #A bad dream?
  yearly.7051.t: "Đồi Sương Mù"
  yearly.7051.desc:0 "Sương dày đến mức có thể cắt bằng dao, Ta nhìn quanh để định hướng. Ta đã từng ở đây? Đây có phải… chiến trường?\n\nTay Ta run khi cố gắng hiểu tình hình, Ta bước vài bước. Nghe thấy tiếng gọi ở xa: 'Ngài có thấy một cậu bé không?'\n\nĐột nhiên Ta bắt đầu thấy khuôn mặt trong sương mù. Có phải… những người Ta đã giết? Họ dường như đông cứng trong vẻ mặt kinh hoàng."
  yearly.7051.a: "Tất cả là lỗi của Ta..."
  yearly.7051.a.flavor: "Ngài chấp nhận trách nhiệm."
  yearly.7051.b: "Họ đáng bị như vậy. TẤT CẢ."
  yearly.7051.b_conviction.desc: "Ngài thuyết phục được bản thân"
  yearly.7051.b_unconvinced.desc: "Ngài sụp đổ tinh thần"
 #Waking up
  yearly.7052.t: "Như Một Giấc Mơ"
  yearly.7052.desc_unconvinced: "Ta tỉnh dậy, toàn thân ướt đẫm mồ hôi. Đó nếu không phải là — giấc mơ — kinh khủng nhất, thì chắc chắn là một trong những giấc mơ tồi tệ nhất mà Ta nhớ gần đây.\n\nTay Ta vẫn run rẩy vì căng thẳng do giấc mơ gây ra, khi Ta hồi tưởng lại nội dung của nó. 'Chắc chắn mọi chuyện không thể tệ hơn thế này được,' Ta lẩm bẩm, khi lăn mình trong một nỗ lực thảm hại để ngủ lại."
  yearly.7052.desc: "Ta tỉnh dậy, bất ngờ bình thản. Đó là một giấc mơ thú vị — mặc dù không hoàn toàn dễ chịu, nhưng Ta đã từng có những giấc mơ tệ hơn trong đời.\n\nTa cẩn thận suy ngẫm về nội dung của nó rồi lăn sang bên kia, và sớm chìm lại vào giấc ngủ thư giãn."
  yearly.7052.a: "Tất cả chỉ là một cơn ác mộng."
  yearly.7052.a_positive: "Một giấc mơ thật kỳ lạ."
 #Denial
  yearly.7053.t: "Cái Hố Gì Thế?"
  yearly.7053.desc: "Hành lang ngập ánh sáng ban ngày, khi Ta tiến về phía bếp. Bất chợt, ở góc mắt — có một #EMP cái hố#! trên tường.\n\nTa đứng im, nhìn vào cái hố với ánh mắt tò mò nhưng sắc sảo. Nó không lớn, cỡ bằng một cánh tay. Nhưng bên trong thì đen kịt.\n\nTa cẩn thận tiến lại gần và cố nhìn vào trong, bối rối không hiểu nguồn gốc và mục đích của nó."
  yearly.7053.a: "Người trông coi sân có lẽ biết nhiều hơn về chuyện này."
  yearly.7053.b: "Ta nghĩ Ta thấy gì đó..."
  yearly.7053.b_pouch.desc: "Ngài rút một túi vàng từ cái hố"
  yearly.7053.b_scratch.desc: "Một vật gì đó cào vào tay Ngài"
 #Coming to
  yearly.7054.t: "Một Sự Tỉnh Giấc Nhanh"
  yearly.7054.intro: "Một trong những người hầu cẩn thận lay Ta tỉnh. [7054_servant.GetSheHe|U] nhìn Ta lo lắng và thốt lên: '[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ngài ổn chứ?' khi Ta nhìn quanh hành lang, ngơ ngác.\n\nTa đã ngất sao?"
  yearly.7054.desc_pouch: "Vẫn trong tay, Ta nắm chặt túi vàng mà Ta vừa rút từ… cái hố?"
  yearly.7054.desc_scratch: "Cánh tay Ta rát bỏng; chính tay Ta đưa vào… cái hố sao?"
  yearly.7054.desc: "Ta mơ hồ nhớ về một cuộc trò chuyện Ta phải có với người trông coi sân… về một cái hố?"
  yearly.7054.outro: "\n\nVội vã đứng dậy, Ta nhìn vào tường. 'Ở đây có một cái hố,' Ta lẩm bẩm khi ánh mắt quét qua các bức tường sáng của hành lang."
  yearly.7054.a: "... Chắc Ta đã tưởng tượng thôi."
  yearly.7054.a.flavor_pouch: "Ta siết chặt túi vàng."
  yearly.7054.a.flavor_scratch: "Cơn rát từ vết cào trên tay càng dữ dội hơn."
  yearly.7054.a.flavor: "Ta nhận thấy người hầu, giờ thận trọng, đang quan sát Ta."
 #It was the dog all along
  yearly.7055.t: "Một Chỗ Dành Cho Chó"
  yearly.7055.desc: "Khi Ta băng qua sân, một con chó hoang xuất hiện từ đâu và dừng ngay trước mặt Ta. Có vài mảnh kim loại lạ gắn trên vòng cổ nó.\n\nCon chó nhìn Ta đầy mong đợi khi Ta cúi xuống nhìn vào mắt nâu của nó, hơi khó chịu vì bị gián đoạn. Nhưng sự khó chịu nhanh chóng tan biến, và Ta có cảm giác kỳ lạ rằng con chó đang kiểm soát… mọi thứ?\n\nTa thực sự đang mất trí, Ta nghĩ, khi nắm lấy vòng cổ và tháo những mảnh kim loại lố bịch. Khi quay đi, con chó nhìn Ta nghiêm nghị. Có lẽ… giờ nó thuộc về Ta rồi?"
  yearly.7055.a: "Đây, chó."
  yearly.7055.b: "Biến đi #EMP!#, chó hoang bẩn thỉu!"
  yearly.7055.b.flavor: "Con chó nhìn Ngài với ánh mắt buồn bã."
