l_english:
#Shelter from the Storm
  bp1_yearly.0100.t:0 "Nơi Ẩn Nấp Tránh Bão"
  bp1_yearly.0100.desc:0 "Bầu trời báo điềm xấu, gió rít lên: một cơn lốc sắp đến!"

  bp1_yearly.0100.sedentary_traveller:0 "\n\nNhững túp lều tồi tàn chiếm ưu thế ở góc đất lạ này, bẩn thỉu và nhỏ bé."
  bp1_yearly.0100.nomadic_traveller:0 "\n\nKhông còn thời gian dựng trại trước khi cơn bão đến."
  bp1_yearly.0100.sedentary_host:0 "Chúng Ta gặp một ngôi nhà nông thôn tạm được... nhưng nơi này thuộc về [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('host'))] xấu xa [host.GetFirstName].\n\nTa bị mưa gió tạt dữ dội."
  bp1_yearly.0100.nomadic_host:0 "May mắn thay, chúng Ta tìm thấy một trại đúng nghĩa. Không may... những người bên trong là bộ tộc của [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('host'))] xấu xa [host.GetFirstName].\n\nTa bị mưa gió tạt dữ dội."

  bp1_yearly.0100.lover_welcome:0 "Có thể [host.GetFirstNameNoTooltip] đang xa? Có lẽ vận may mỉm cười — và [host.GetHerHis] quyến rũ [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))] [lover.GetFirstName] đang ở đây chào đón Ta?"
  bp1_yearly.0100.friend_welcome:0 "Có thể [host.GetFirstNameNoTooltip] đang xa? Có lẽ vận may mỉm cười — và [host.GetHerHis] [befriend.Custom('ComplimentAdjective')] [host.Custom2('RelationToMeShort', SCOPE.sC('befriend'))] [befriend.GetFirstName] đang ở đây chào đón Ta?"

  bp1_yearly.0100.close:0 "Dù thế nào đi nữa... đây sẽ là một đêm dài."

  bp1_yearly.0100.a:0 "Cười lên, các ngươi!"
  bp1_yearly.0100.a.tt:0 "Một sự tiếp đón thảm hại đang chờ..."
  bp1_yearly.0100.a_title:0 "Một đêm tồi tệ và đầy nghi ngờ"
  bp1_yearly.0100.a.success_chance:0 "Bất kỳ [schemes|E] nào [host.GetShortUINameNoTooltip] có chống lại Ngài sẽ tăng 15 [success_chance|E]"

  bp1_yearly.0100.b:0 "Có lẽ đây là nơi giữ bí mật gia đình..."
  bp1_yearly.0100.b.tt:0 "Ngài tìm nơi trú ẩn... và cơ hội để dò xét xung quanh"
  bp1_yearly.0100.b.tt_success:0 "Đêm này đem lại kết quả"
  bp1_yearly.0100.b.secrets:0 "Ngài học được một [secret|E] của [host.GetFirstName] hoặc [host.GetHerHis] [family|E]"
  bp1_yearly.0100.b.tt_failure:0 "Ngài không tìm thấy tủ chứa bí mật nào"
  bp1_yearly.0100.b.tt_crit_failure:0 "Ngài bị bắt vì xâm nhập trái phép"

  bp1_yearly.0100.c:0 "Tại sao lại thù ghét [befriend.GetFirstNameNoTooltip]...?"
  bp1_yearly.0100.c.tt:0 "Với [befriend.GetTitledFirstName], Ngài có thể tạo niềm vui"
  bp1_yearly.0100.c.tt_success:0 "Ngài kết thân với [host.Custom2('RelationToMeShort', SCOPE.sC('befriend'))] của kẻ thù"
  bp1_yearly.0100.c.tt_failure:0 "Sự duyên dáng của Ngài được đánh giá cao"
  bp1_yearly.0100.c.tt_crit_failure:0 "Ngài trải qua một đêm tranh cãi khủng khiếp"

  bp1_yearly.0100.d:0 "Không gì bằng một cuộc gặp bí mật..."
  bp1_yearly.0100.d.tt:0 "[host.GetFirstNamePossessiveNoTooltip] [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))] có thể đang ở bên trong, háo hức giải thoát Ngài khỏi quần áo lấm bẩn..."
  bp1_yearly.0100.d.tt.success:0 "[lover.GetSheHe|U] đang chờ Ngài"
  bp1_yearly.0100.d.tt.sex:0 "Ngài ngủ với [lover.GetShortUINameNoTooltip]"
  bp1_yearly.0100.d.tt_failure:0 "Một đêm một mình"
  bp1_yearly.0100.d.tt_no_sex:0 "Không thấy dấu vết của [lover.GetShortUINameNoTooltip] quyến rũ"

  bp1_yearly.0100.e:0 "Kiếm của chúng ta sẽ bảo vệ nơi trú ẩn."
  bp1_yearly.0100.e.tt:0 "Giả vờ mỉm cười? Không, Ngài thà trói chủ nhà còn hơn"
  bp1_yearly.0100.e.wounded_chance:0 "Sức [prowess|E] của Ngài quyết định liệu Ngài có bị thương hay không"
  bp1_yearly.0100.e.tt_success:0 "Dưới màn bão, Ngài bất khả chiến bại"
  bp1_yearly.0100.e.tt_failure:0 "Ngài bị đẩy ra ngoài giữa thiên nhiên"

  bp1_yearly.0100.f:0 "Một cái hố trên đất còn tốt hơn."
  bp1_yearly.0100.f.tt_success:0 "Ngài chịu đựng thiên nhiên... vừa đủ"
  bp1_yearly.0100.f.sick:0 "Ngài có thể bị [GetTrait('ill').GetName( GetNullCharacter )]"
  bp1_yearly.0100.f.tt_failure:0 "Đêm dài. Cơn bão tàn nhẫn"
  bp1_yearly.0100.f.very_sick:0 "Ngài có thể mắc [GetTrait('pneumonic').GetName( GetNullCharacter )]"

  bp1_yearly.0101.t:0 "Bão Trong Hoang Dã"
  bp1_yearly.0101.desc:0 "Thầm cảm ơn [ROOT.Char.GetFaith.FertilityGodName] vì giữ [lover.GetTitledFirstNamePossessive] ghê tởm [lover.Custom2('RelationToMeShort', SCOPE.sC('host'))] tránh xa nơi khiêm tốn này.\n\nKhi bão nổi lên, tranh đấu với trời, cơn giận dữ vang vọng xung quanh,"

  bp1_yearly.0101.gentle_flirt:0 "[lover.GetFirstNameNoTooltip] khẽ run rẩy tiến lại gần hơn theo từng khoảnh khắc. Nỗi sợ hãi này phải chăng chỉ là một màn kịch? Có thứ gì đó đang lay động trong đôi mắt của [lover.GetHerHis], ngay sau nụ cười trang trọng của [lover.GetHerHis]. Đôi mắt của [lover.GetHerHis|U] nói với ta rằng... đúng vậy."
  bp1_yearly.0101.protective_flirt:0 "[lover.GetFirstNameNoTooltip] tỏ ra tự tin, bảo vệ. Ta mỉm cười với [lover.GetHerHim] biết ơn — miễn cưỡng — và chẳng mấy chốc... [lover.GetSheHe] lặng im đầy say mê. [lover.GetSheHe|U] là của Ta."

  bp1_yearly.0101.finish:0 "\n\nGóc nơi chúng Ta đến bên nhau tối om. Rất tối. Và không gì chúng Ta làm, với thân hình thèm muốn của [lover.GetHerHis], dưới quần áo lấm bùn của Ta, có thể bị nghe thấy qua cơn giông thiên nhiên.\n\nÂm thanh duy nhất chạm môi Ta là một lời nguyền về tên [lover.GetHerHis] [lover.Custom2('RelationToMeShort', SCOPE.sC('host'))]. Và ngay khoảnh khắc đó, Ta hoàn tất chiến thắng của mình."

  bp1_yearly.0101.a:0 "Nhưng là #EMP ngươi#! Ta mơ thấy, [lover.GetFirstNameNoTooltip]!"
  bp1_yearly.0101.b:0 "Một lời lăng mạ ngọt ngào."

  bp1_yearly.0102.opening:0 "[host.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  bp1_yearly.0102.desc:0 "Ngươi ngủ ngon chứ? Thưởng thức đêm tiếp đón của dân ta,"

  bp1_yearly.0102.desc_weak:0 "nghỉ ngơi đôi chân huy hoàng của ngươi?"
  bp1_yearly.0102.desc_powerful:0 "mơ rằng ngươi có thể là ta?"

  bp1_yearly.0102.uneventful_night:0 "\n\nNghe nói ngươi xuất sắc trong việc làm kẻ ăn mày vô duyên, xía vào việc người khác và lấm bùn."
  bp1_yearly.0102.failed_snoop:0 "\n\nQuyền hạn của ngươi với tư cách bề trên có giới hạn. Ta đã bảo đảm mọi người đều biết ngươi phớt lờ chúng."
  bp1_yearly.0102.warm_welcome:0 "\n\nGiá mà ta có mặt để đuổi ngươi đi. [befriend.GetTitledFirstName] luôn có gu tệ hại."
  bp1_yearly.0102.cold_welcome:0 "\n\nChủ nhà ngươi [befriend.GetTitledFirstName] giờ đã học cách ghét ngươi như ta. Tim ta tràn đầy vui sướng."
  bp1_yearly.0102.erotic_welcome:0 "\n\nNếu ta có mặt, ngươi đã bị đuổi ra ngay với lời đầu tiên ngươi thốt ra với [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))], ngươi rắn độc."
  bp1_yearly.0102.attack_success:0 "\n\nNgươi tấn công lính ta như một con thú sợ hãi. Ngươi tấn công không danh dự hay lịch sự, như thường lệ."
  bp1_yearly.0102.attack_fail:0 "\n\nKhông sao? Đúng rồi. Ngươi #EMP đã cố#! tấn công ta, nhưng bị đẩy trở lại hoang dã như con thú ngươi vốn là. Nỗ lực của ngươi thật thảm hại."

  bp1_yearly.0102.close:0 "\n\nMong cơn bão tiếp theo quét ngươi khỏi mặt đất."

  bp1_yearly.0102.a:0 "Đầu tư giường êm đi, ngươi kẻ thô lỗ!"
  bp1_yearly.0102.b:0 "Ngươi không nên sợ trời, [host.GetFirstNameNoTooltip]..."
