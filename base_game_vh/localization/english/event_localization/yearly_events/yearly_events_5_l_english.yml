  yearly.5021.deceitfulcouncillor.desc:0 "Ta đã đúng khi nghi ngờ ý đồ của [helpful_councillor.GetFirstNamePossessive]! Sau khi đặt [helpful_councillor.GetHerHim] dưới sự giám sát trong vài ngày, rõ ràng là [helpful_councillor.GetSheHe] chỉ quan tâm đến việc kích bác đứa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] của riêng ta chống lại ta."
  yearly.5021.honestcouncillor.desc:0 "Bất chấp sự giám sát nghiêm ngặt đối với [helpful_councillor.GetFirstName], gián điệp của ta đã không thể tìm thấy bất cứ điều gì có thể thuyết phục ta tin rằng ý đồ của [helpful_councillor.GetHerHis] là bất cứ thứ gì khác ngoài sự thuần khiết.\n\n[helpful_councillor.GetSheHe|U] thực sự dường như chỉ quan tâm đến việc giúp đỡ đứa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] của ta trở thành một nhà cai trị tốt hơn."
  yearly.5021.a:0 "Không sao khi để [helpful_councillor.GetHerHim] dạy [scoped_heir.GetFirstNameNoTooltip]!"
  yearly.5021.b.a:0 "Ta không thể để [helpful_councillor.GetHerHim] gần [scoped_heir.GetFirstNameNoTooltip] thêm nữa."
  yearly.5021.b.b:0 "Nhưng Ta vẫn không tin [helpful_councillor.GetHerHim]!"
  yearly.5021.c:0 "Ta muốn [helpful_councillor.GetHerHim] ra khỏi Hội Đồng!"
  yearly.5022.a:0 "Vậy để [helpful_councillor.GetHerHim] tiếp tục thì không sao!"

  yearly.5023.desc:0 "Tên gián điệp vô dụng mà ta phái đi để mắt đến vị [helpful_councillor.Custom('CouncilPosition')] [helpful_councillor.GetTitledFirstName] của ta đã tự mình làm lộ và bị bắt! [helpful_councillor.GetFirstNameNoTooltip] đã vô cùng tức giận khi biết được sự thiếu tin tưởng của ta và đã rút lại lời đề nghị kèm cặp của [helpful_councillor.GetHerHis]."
  yearly.5023.a:0 "Làm sao Ta có thể cho rằng [helpful_councillor.GetSheHe] thật lòng?"
  yearly.5024.deceitfulcouncillor.desc:0 "Có điều gì đó không đúng. Ta đã cho phép vị [helpful_councillor.Custom('CouncilPosition')] [helpful_councillor.GetFirstName] của mình hỗ trợ dạy dỗ đứa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] của ta để [scoped_heir.GetFirstName] có thể học hỏi được điều gì đó về cách cai trị. Tuy nhiên, có vẻ như [helpful_councillor.GetSheHe] lại quan tâm hơn đến việc dạy cho [scoped_heir.GetHerHim] cách nghi ngờ và phản đối mọi quyết định của ta."
  yearly.5024.deadlycouncillor.desc:0 "Vị [helpful_councillor.Custom('CouncilPosition')] [helpful_councillor.GetFirstName] của ta xông vào chính sảnh, một vẻ mặt kinh hoàng hiện rõ trên khuôn mặt của [helpful_councillor.GetHerHis] và quần áo của [helpful_councillor.GetHerHis] đẫm máu. \n\n"Có toán cướp, thưa [ROOT.Char.GetTitleTierName] của thần!" [helpful_councillor.GetSheHe] thốt lên, gần như hụt hơi. [helpful_councillor.GetFirstNameNoTooltip] đã rời [ROOT.Char.Custom('ResidenceBuilding')] cùng [scoped_heir.GetFirstName] mới sáng sớm nay để đi khảo sát vùng nông thôn. "Thần đã mang thi thể của vị [scoped_heir.GetTitleTierNamePossessive] đi xa nhất có thể, nhưng...""
  yearly.5024.honestcouncillor.desc:0 "Sự dạy dỗ của [helpful_councillor.GetCouncilTitle] [helpful_councillor.GetFirstNamePossessive] đối với đứa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] của ta đã bắt đầu đơm hoa kết trái. \n\n[scoped_heir.GetFirstName] đã học hỏi được nhiều hơn những gì ta dám hy vọng, và [scoped_heir.GetSheHe] đang thực hiện một vài trách nhiệm tương lai của [scoped_heir.GetHerHis] một cách nghiêm túc hơn rất nhiều so với trước đây."
  yearly.5024.a.a:0 "Tuyệt vời! Ta biết Ta có thể tin [helpful_councillor.GetHerHim]!"
  yearly.5024.a.b:0 "Làm sao [helpful_councillor.GetSheHe] có thể làm điều này với Ta?!"
  yearly.5024.a.c:0 "Không thể tin được!"
  yearly.5024.b:0 "Ta không thể tin. Ngươi đứng sau tất cả chuyện này!"
 
  tooltip_yearly_5022_a:0 "Cho phép [helpful_councillor.GetFirstName] tiếp tục việc dạy dỗ của [helpful_councillor.GetHerHis]."

  yearly.5030.opening:0 "[squealing_vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.5030.earnestvassal.desc:0 "Ta phát hiện ra sự thật kinh hoàng về [blackmailed_vassal.GetTitledFirstName]. Dù Ta ghét phải báo tin này, Ta phải nói rằng [blackmailed_vassal.GetWomanMan] này đang giấu những bí mật vô cùng nghiêm trọng với ngài."
  yearly.5030.selfishvassal.desc:0 "Ta viết để báo cho ngài về phát hiện kinh hoàng của Ta về [blackmailed_vassal.GetTitledFirstName]. [blackmailed_vassal.GetWomanMan] này đang tham gia các hoạt động phi đạo đức và không danh dự sau lưng ngài.\n\nTa hy vọng việc cung cấp thông tin nhạy cảm này chứng tỏ lòng trung thành không lay chuyển của Ta với ngài, [ROOT.Char.GetTitleTierName]."
  yearly.5030.a.a:0 "Ta rất trân trọng mối quan tâm của ngươi, [squealing_vassal.GetFirstNameNoTooltip]."
  yearly.5030.a.b:0 "Ta sẽ không quên cử chỉ của ngươi, [squealing_vassal.GetFirstNameNoTooltip]."
  yearly.5030.a.tt:0 "[squealing_vassal.GetTitledFirstName] sẽ tiết lộ bí mật của [blackmailed_vassal.GetTitledFirstNamePossessive] cho Ta."
  yearly.5030.secret.desc:0 "Được thông báo về bí mật"
  yearly.5030.c:0 "Tốt hơn là ngươi quên hết chuyện này đi, [squealing_vassal.GetFirstNameNoTooltip]."
  yearly.5030.c.tt:0 "Sẽ không dùng bí mật của [blackmailed_vassal.GetFirstNamePossessive] chống lại [blackmailed_vassal.GetHerHim]"

  yearly.5025.desc.a:0 "Nhờ có sự dạy dỗ gần đây của ta, [scoped_heir.GetFirstName] đã có thể lấp đầy một số khoảng trống trong nền giáo dục của [scoped_heir.GetHerHis].\n\nYêu cầu của [helpful_councillor.GetTitledFirstNamePossessive] chính xác là động lực ta cần để giúp đứa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] của ta khai phá một số tiềm năng chưa được khai thác của [scoped_heir.GetHerHis]."
  yearly.5025.desc.b:0 "Thật không may, những nỗ lực gần đây của ta nhằm dạy dỗ [scoped_heir.GetFirstName] để lấp đầy một số khoảng trống trong nền giáo dục của [scoped_heir.GetHerHis] đã không mang lại kết quả.\n\nCó lẽ ta không nên từ chối lời đề nghị của [helpful_councillor.GetTitledFirstNamePossessive]..."
  yearly.5025.a:0 "Ta tự hào về thành tích của [scoped_heir.GetHerHis]."
  yearly.5025.b:0 "[scoped_heir.Custom('GirlBoy')] chỉ hơi chậm một chút."

  yearly.5040.t:0 "Cuộc Trao Đổi Bí Ẩn"
  yearly.5040.desc:0 "Ta đang đi qua vườn [ROOT.Char.Custom('ResidenceBuilding')] để dạo buổi sáng thì một cơn gió nhẹ mang tiếng nói của [whisperer_1.GetFirstName] và [whisperer_2.GetFirstName] đến tai Ta.\n\nHai vị triều thần đang nói chuyện ở một nơi kín đáo gần đó, thường xuyên liếc quanh để chắc chắn không ai nghe lén. Dù khó mà nghe rõ từng lời từ xa, rõ ràng cuộc trò chuyện của họ liên quan đến [scoped_vassal.GetTitledFirstName]."
  yearly.5040.a.a:0 "Ta sẽ bắt họ trói và đưa đến cho [scoped_vassal.GetFirstNameNoTooltip]."
  yearly.5040.a.b:0 "Ta phải cảnh báo [scoped_vassal.GetFirstNameNoTooltip]!"
  yearly.5040.b:0 "Giá mà Ta có thể tiến gần hơn chút..."
  yearly.5040.b.success.desc.tt:0 "Ta tránh bị phát hiện"
  yearly.5040.b.success.effect.tt:0 "Ta biết được chủ đề cuộc trò chuyện"
  yearly.5040.b.failure.desc.tt:0 "[whisperer_1.GetFirstNameNoTooltip] và [whisperer_2.GetFirstNameNoTooltip] phát hiện Ta"
  yearly.5040.b.failure.effect.tt:0 "Câu hỏi không đem lại kết quả"
  yearly.5040.c.a:0 "Ngươi sẽ không giấu điều gì với [ROOT.Char.GetTitleTierName] yêu dấu của ngươi, phải không?"
  yearly.5040.c.b:0 "Ta phải biết họ đang giấu gì, dù giá nào đi nữa!"
  yearly.5040.c.success.tt:0 "Ta tra khảo [whisperer_1.GetFirstNameNoTooltip] và [whisperer_2.GetFirstNameNoTooltip] để moi thông tin"
  yearly.5040.c.failure.tt:0 "[whisperer_1.GetFirstName] và [whisperer_2.GetFirstNameNoTooltip] không hợp tác"
  yearly.5040.d:0 "À, chắc cũng chẳng có gì quan trọng đâu…"

  yearly.5041.desc.a:0 "Ta tiến gần hai triều thần mà họ không hay biết.\n\nHọ đang bàn về một âm mưu do [scoped_vassal.GetTitledFirstName] giăng ra chống lại Ta!"
  yearly.5041.desc.b:0 "Ta tiến gần hai triều thần mà họ không hay biết.\n\nHọ đang bàn về một âm mưu do [scoped_vassal.GetTitledFirstName] giăng ra ngay tại triều đình của Ta!"
  yearly.5041.desc.c:0 "Ta xoay sở để tiếp cận gần hơn với hai cận thần mà không để họ chú ý đến ta.\n\nHọ dường như đang thảo luận về đời sống riêng tư của [scoped_vassal.GetTitledFirstNamePossessive] cùng một số thói quen không mấy tốt đẹp của [scoped_vassal.GetHersHis]."
  yearly.5041.a:0 "Thật thú vị…"

  yearly.5042.desc.safetorture:1 "Mất khá lâu mới moi được lời thú tội từ hai tù nhân, nhưng cai ngục của Ta là [dummy_jailor_gender.GetWomanMan] kiên nhẫn. Sau nhiều giờ tra khảo, hai kẻ âm mưu đã sẵn sàng thú nhận bí mật."
  yearly.5042.desc.deadlytorture:1 "Môi hai tù nhân kín như bưng hơn Ta tưởng. Sau một đêm tra khảo dài, sự thất vọng của cai ngục khiến [dummy_jailor_gender.GetHerHim] mất kiềm chế, và hai triều thần chết vào sáng hôm sau, nhưng trước đó họ đã tiết lộ bí mật."
  yearly.5042.desc.a:0 "\n\nHóa ra [scoped_vassal.GetTitledFirstName] đang âm mưu chống lại Ta!"
  yearly.5042.desc.b:0 "\n\nHóa ra [scoped_vassal.GetTitledFirstName] đang âm mưu ngay tại triều đình của Ta!"
  yearly.5042.desc.c:0 "\n\nChủ đề họ bàn là thói quen xấu của [scoped_vassal.GetTitledFirstNamePossessive] mà Ta hoàn toàn không biết."
  yearly.5042.a.a:0 "Phát hiện may mắn và thú vị!"
  yearly.5042.a.b:0 "Giá phải trả cho thông tin quan trọng thật đắt."
  yearly.5040.torturefail.desc:0 "Câu hỏi không đem lại kết quả, thật đáng tiếc"
  yearly.5040.deceitfail.desc:0 "[whisperer_1.GetFirstName] và [whisperer_2.GetFirstName] phát hiện Ta và chạy về [ROOT.Char.Custom('ResidenceBuilding')]"
  yearly.5043.torturedeadlyfail.desc:0 "Cuộc tra khảo quá sức với hai tù nhân.\n\nHọ đã thở hơi cuối cùng trước khi tiết lộ bí mật."
  yearly.5043.a.a:0 "Thật lãng phí thời gian…"
  yearly.5043.a.b:0 "Tại sao họ không nói gì?"
 
  yearly.5050.t:0 "Cãi Vã Về Hôn Nhân"
  yearly.5050.desc.a:0 "“Hoàn toàn không thể chấp nhận được!” \n\n[scoped_spouse.GetFirstName] xông vào [ROOT.Char.Custom('GetChamber')] của ta, khuôn mặt của [scoped_spouse.GetHerHis] đỏ bừng vì giận dữ, hét lớn đủ để toàn bộ vùng [ROOT.Char.Custom('ResidenceBuilding')] nghe thấy [scoped_spouse.GetHerHim]. \n\n"[slighting_courtier.GetTitledFirstName] vừa mới sỉ nhục danh dự của ta! Ta yêu cầu ngài phải trục xuất tên [slighting_courtier.Custom2('InsultNoun', SCOPE.sC('scoped_spouse'))] [slighting_courtier.Custom2('InsultAdjective', SCOPE.sC('scoped_spouse'))] đó ra khỏi [ROOT.Char.Custom('GetCourt')] của chúng ta!""
  yearly.5050.desc.b:0 "Ta rất ngạc nhiên khi thấy [scoped_spouse.GetWifeHusband] của mình đang lảng vảng trong phòng làm việc của ta. Nhìn vào biểu cảm trên khuôn mặt của [scoped_spouse.GetHerHis], có điều gì đó rõ ràng đang làm [scoped_spouse.GetFirstName] phiền lòng, nhưng phải mất một lúc ta mới thuyết phục được [scoped_spouse.GetHerHim] chia sẻ những lo ngại của [scoped_spouse.GetHerHis] với ta. \n\n"Bác ái của ta, ta phải thú nhận với ngài rằng [slighting_courtier.GetFirstName] đã sỉ nhục ta một cách nghiêm trọng. Ta không thể chịu đựng nổi ý nghĩ phải ở gần kẻ [slighting_courtier.GetWomanMan] thô lỗ đó thêm nữa.""
  yearly.5050.a.a:0 "[slighting_courtier.GetSheHe|U] sẽ biến mất trước ngày mai!"
  yearly.5050.b.a:0 "Đừng làm phiền Ta với chuyện vớ vẩn này."
  yearly.5050.b.b:0 "Không thể! [slighting_courtier.GetFirstNameNoTooltip] là [slighting_courtier.GetWomanMan] tốt mà!"
  yearly.5050.b.c:0 "Ta nghĩ ngươi có thể hơi phản ứng thái quá, thân yêu."
  yearly.5050.c:0 "Tại sao không kể hết từ đầu?"
  yearly.5050.c.success.desc.tt:0 "Ta thảo luận chi tiết sự việc với [scoped_spouse.GetFirstNameNoTooltip]"
  yearly.5050.c.success.effect.tt:0 "Ta biết được [scoped_spouse.GetFirstNameNoTooltip] có thành thật hay không"
  yearly.5050.c.failure.desc.tt:0 "[scoped_spouse.GetFirstNameNoTooltip] từ chối nghe lý lẽ"
  yearly.5050.c.failure.effect.tt:0 "[scoped_spouse.GetWifeHusband] yêu cầu Ta phải hành động"

  yearly.5051.desc.a.a:0 "Càng nghe về chuyện này, Ta càng tin rằng [scoped_spouse.GetWifeHusband] không nói thật. Kết thúc cuộc thảo luận, Ta có ấn tượng rõ ràng rằng [scoped_spouse.GetFirstName] bịa ra toàn bộ để hạ uy tín [slighting_courtier.GetTitledFirstName]."
  yearly.5051.desc.a.b:0 "Sau khi xem xét cẩn thận lời của [scoped_spouse.GetWifeHusband], Ta kết luận rằng [scoped_spouse.GetFirstName] nói thật.\n\n[slighting_courtier.GetTitledFirstName] đã xúc phạm nghiêm trọng danh dự của [scoped_spouse.GetHerHis] và qua đó, [slighting_courtier.GetSheHe] đã coi thường lòng hiếu khách của Ta."
  yearly.5051.z:0 "Nếu thế giới biết về lời buộc tội sai trái của ngươi…"
  yearly.5051.a:0 "Ta mong ngươi xin lỗi [slighting_courtier.GetFirstNameNoTooltip] vì cáo buộc vô căn cứ này."
  yearly.5051.b:0 "Đừng lo, Ta sẽ luôn ủng hộ ngươi."
  yearly.5051.c:0 "Bây giờ Ta biết chắc, Ta có thể đối mặt [slighting_courtier.GetFirstNameNoTooltip]."
  yearly.5051.d:0 "Ta nghĩ ngươi nên cố tha thứ cho [slighting_courtier.GetFirstNameNoTooltip]."

  yearly.5052.desc.a:0 "Ngay cả sau khi thảo luận chi tiết với [scoped_spouse.GetFirstName], Ta vẫn chưa chắc nên nghĩ gì về toàn bộ vụ việc."
  yearly.5052.desc.b.a:0 "\n\nMột [ROOT.Char.GetTitleTierName] tốt nên ủng hộ [ROOT.Char.GetHerHis] [scoped_spouse.GetTitleTierName], nhưng Ta vẫn cảm thấy [scoped_spouse.GetFirstNameNoTooltip] có thể không nói hết sự thật…"
  yearly.5052.desc.b.b:0 "\n\nNgược lại, một [ROOT.Char.GetTitleTierName] tốt nên ủng hộ [ROOT.Char.GetHerHis] [scoped_spouse.GetTitleTierName], và [scoped_spouse.GetFirstName] trông thật sự đau khổ vì sự việc."
  yearly.5052.a:0 "Ta sẽ nói chuyện với [slighting_courtier.GetTitledFirstNameNoTooltip]."
  yearly.5052.b:0 "Ta nghĩ ngươi nên quên hết chuyện này, [scoped_spouse.GetFirstNameNoTooltip]."

  yearly.5053.desc.a:0 "[scoped_spouse.GetWifeHusband] của Ta lại đang than phiền về việc ai đó thiếu tôn trọng [scoped_spouse.GetHerHim]. Lần này, dường như là [slighting_courtier.GetTitledFirstName] làm [scoped_spouse.GetHerHis] tức giận. [scoped_spouse.GetSheHe|U] đang yêu cầu Ta phải làm gì đó."
  yearly.5053.desc.b:0 "Ta không ngạc nhiên khi [scoped_spouse.GetWifeHusband] yêu cầu Ta trừng phạt thêm một thành viên triều đình nữa mà theo [scoped_spouse.GetHerHim] đã xúc phạm danh dự [scoped_spouse.GetHerHis]. Điều này xảy ra quá thường xuyên khiến Ta hầu như không còn chú ý tới danh sách các khiếu nại [scoped_spouse.GetFirstName] liệt kê chống lại [slighting_courtier.GetTitledFirstName]."
  yearly.5053.desc.b.a:0 "\n\nTa không hiểu tại sao nhiều người lại quấy rầy [scoped_spouse.GetHerHim] đến vậy…"
  yearly.5053.desc.b.b:0 "\n\nMột [ROOT.Char.GetWifeHusband] nghi ngờ hơn có thể nghĩ rằng [scoped_spouse.GetSheHe] lợi dụng thiện chí của Ta để loại bỏ bất kỳ ai [scoped_spouse.GetSheHe] không thích…"
  yearly.5053.a:0 "Đủ rồi. Ta sẽ làm gương với người này."
  yearly.5053.b:0 "Đừng lo, Ta sẽ xử lý [slighting_courtier.GetTitledFirstNameNoTooltip]."
  yearly.5053.c:0 "Đủ rồi với những chuyện vặt vãnh này, [scoped_spouse.GetFirstNameNoTooltip]."
 
  yearly.5054.desc.a:0 "Kể từ khi Ta hành quyết [slighting_courtier.GetTitledFirstName] một cách kinh hoàng, [scoped_spouse.GetWifeHusband] của Ta đã cư xử lạ thường. Không còn triều thần quấy rầy [scoped_spouse.GetHerHim], cũng chẳng ai dám đến gần [scoped_spouse.GetHerHim] nếu không được mời, nhưng [scoped_spouse.GetSheHe] vẫn không thấy vui vẻ.\n\nThực ra, [scoped_spouse.GetSheHe] trông u sầu hơn trước rất nhiều."
  yearly.5054.desc.b:0 "Đúng như ta kỳ vọng, việc xử tử [slighting_courtier.GetTitledFirstName] theo cách đau đớn và công khai nhất vì tội xúc phạm [scoped_spouse.GetWifeHusband] của ta chính là thông điệp chính xác ta cần gửi đến triều đình.\n\nKhông một ai dám nói năng lỗ mãng hay thậm chí chỉ là tiếp cận [scoped_spouse.GetFirstName] mà không có sự cho phép của [scoped_spouse.GetHerHis]. Ta sẽ không còn phải lo lắng về những lời phàn nàn không ngớt của [scoped_spouse.GetHerHis] nữa."
  yearly.5054.a.a:0 "Ta nghĩ nên cảm ơn, thân yêu."
  yearly.5054.a.b:0 "Cuối cùng cũng yên bình."

  yearly.9020.t:0 "Một Con Voi Khổng Lồ"
  yearly.9020.desc:1 "[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến tới Ta với nụ cười trên mặt [marshal.GetHerHis]. [marshal.GetSheHe|U] giải thích rằng Ta vừa nhận được một món quà ấn tượng từ một quan giám sát ở [county.GetNameNoTooltip], và ra hiệu Ta đi cùng [marshal.GetHerHim].\n\nVà thật sự ấn tượng! Khi Ta bước ra ngoài, Ta thấy một con voi #emphasis khổng lồ#! chào đón. Lớn hơn bất kỳ con nào Ta từng thấy. Con vật chắc chắn sẽ đem lại sự hủy diệt cho bất kỳ kẻ thù nào."
  yearly.9020.a:0 "Ta sẽ cưỡi con quái vật hùng mạnh này vào trận. Tự mình."
  yearly.9020.b:1 "[marshal.GetCouncilTitle]. Sinh vật này thuộc về ngài."
  yearly.9020.c:2 "$knight_culture_player_no_tooltip_lowercase$ [knight.GetTitledFirstNameNoTooltip] của Ta chắc chắn sẽ sử dụng tốt nó."
  yearly.9020.d1:1 "Hãy tôn kính [ROOT.Char.GetFaith.KnowledgeGodName] và thả nó đi."
  yearly.9020.d2:0 "Một con vật như vậy nên được tự do. Hãy thả nó."
 yearly_9020_personal_war_elephant:0 "Personal War Elephant"

# Oltner
  yearly.8000.t:0 "Bày Tỏ Sự Tôn Kính"
  yearly.8000.desc:1 "Chư hầu của ta, [vassal.GetTitledFirstName], đã đến bên ngoài vùng [ROOT.Char.Custom('ResidenceBuilding')] của ta với một đoàn rước hoành tráng gồm các nhà ngoại giao ăn vận chỉnh tề, các $knight_culture_player_plural_no_tooltip_lowercase$, cùng những nghệ nhân mua vui ngoại quốc. Tộc hội này trông giống như một cuộc diễu hành, dẫn đầu bởi chính [vassal.GetFirstNameNoTooltip] [vassal.GetHerselfHimself].\n\nBằng một giọng nói vang dội, [vassal.GetFirstNameNoTooltip] tuyên bố rằng [vassal.GetSheHe] đến đây để bày tỏ lòng tôn kính và rằng [vassal.GetSheHe] mang theo những món quà bằng #emphasis vàng!#!"
  yearly.8000.desc.paranoid:0 "\n\n...[vassal.GetSheHe] rõ ràng đến để #emphasis giết Ta!#!"
  yearly.8000.desc.lunatic:0 "\n\nNgười #emphasis trên Mặt Trăng#! chắc hẳn đã nghe lời cầu xin nửa đêm của Ta cho một Ngài chơi mới!"
  yearly.8000.desc.default:0 "\n\nSự hào phóng như vậy khó tìm thấy nơi thần dân. Lòng trung thành của [vassal.GetFirstNamePossessiveNoTooltip] thật sự là điều quý giá!"
  yearly.8000.desc.cannibal:0 "\n\nSự hào phóng ngon lành như vậy khó tìm thấy nơi thần dân non nớt. Lòng trung thành thơm ngon của [vassal.GetFirstNamePossessiveNoTooltip] thật sự là điều nên thưởng thức!"
  yearly.8000.a:0 "Xin mời, vào đi! Đặt vàng bên trái của ngươi..."
  yearly.8000.b:0 "Tại sao... #emphasis chắc chắn#! ngươi còn nhiều để tặng hơn?"
  yearly.8000.c:0 "Giữ vàng đi, tình  Bạn củangươi đã đủ!"
  yearly.8000.d:0 "#emphasis Không#! được cho [vassal.GetHerHim] vào trong [ROOT.Char.Custom('ResidenceBuilding')]!"
  yearly.8000.e:0 "Tại sao ngươi không... ở lại dùng bữa tối?"
  yearly.8000.e.tt_eat_vassal:0 "Được ngươi ăn"
  yearly.8000.e.tt_secret:0 "Ngươi nhận được Bí mật Giết người"
  yearly.8100.t:0 "Nông Dân Vui Mừng"
  yearly.8100.desc:0 "Nông dân ở [county.GetName] đang rất vui. Vụ mùa bội thu, đường sá an toàn, và các trưởng lão kể những câu chuyện phi lý về bò cho sữa ngọt mật ong và ngỗng đẻ trứng vàng.\n\nNông dân ca ngợi #emphasis Ta#! vì may mắn của họ, và đã gửi một phái đoàn mang quà!"
  yearly.8100.a:0 "Ta vui vẻ nhận những món quà của họ!"
  yearly.8100.b:0 "Thú vị... hãy gửi lính đi thu thêm 'quà'!"
  yearly.8100.c:0 "Không, họ cần số dư nhiều hơn Ta."
  yearly.8200.t:0 "Một Khoản Đóng Góp Tốt Lòng"
  yearly.8200.desc:0 "[realm_priest.GetCouncilTitle], [realm_priest.GetFirstName], đã nhận được một khoản vàng đáng kể từ tài sản của một chủ đất giàu có nhưng không có con, nay đã qua đời. [realm_priest.GetSheHe|U] khẳng định người quá cố sống rất tiết kiệm và sùng đạo, mong vàng được dùng nơi hữu ích.\n\n[realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] khăng khăng rằng Ta nhận một phần khoản đóng góp, vì Ta là 'tấm gương của [ROOT.Char.GetFaith.GetNameNoTooltip] tại [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].'"
  yearly.8200.a:0 "Cho đi #emphasis tài sản của [ROOT.Char.GetFaith.HighGodNamePossessive]#!? #emphasis Kẻ dị giáo!#!"
  yearly.8200.b:0 "Ta hứa, vàng sẽ phục vụ vương quốc."
  yearly.8200.c:0 "Người 'tấm gương' này xứng đáng nhận toàn bộ khoản đóng góp!"
  yearly.8200.d:0 "Xin hãy trao cho người nghèo nhân danh Ta."
  yearly.8200.desc.zealous:0 "\n\n...[realm_priest.GetSheHe] chắc chắn đã bị [ROOT.Char.GetFaith.DevilName] tha hóa!"
  yearly.8200.desc.generous:0 "\n\nTrái tim Ta đập vì tất cả những linh hồn có thể cứu bằng số vàng đó!"
  yearly.8200.desc.greedy:0 "\n\n...Tất nhiên, Ta dự định bỏ túi số vàng này!"
  yearly.8200.desc.default:0 "\n\nMột lời đề nghị thật hấp dẫn."
  yearly.8300.t:0 "Đóng Góp Cho Kho Chiến Tranh"
  yearly.8300.desc:0 "Khi Ta nhìn vào kho gần như trống rỗng, truyền tin báo rằng bốn thần dân của Ta đã tới.\n\n'Chúng Ta mang vàng đến, bệ hạ, để giúp đánh bại kẻ thù!' [vassal_1.GetTitledFirstName] tuyên bố.\n\n'Cùng Ta, Ta mang [vassal_2.Custom('FormalComplimentAdjective')] [vassal_2.GetTitledFirstName], [vassal_3.Custom('FormalComplimentAdjective')] [vassal_3.GetTitledFirstName], và [vassal_4.Custom('FormalComplimentAdjective')] [vassal_4.GetTitledFirstName] — chúng Ta chỉ mong ngài dẫn dắt tới chiến thắng!'"
  yearly.8300.a:0 "Ta hoan nghênh lòng hào phóng của các ngươi!"
  yearly.8300.b:0 "#emphasis Vàng#!, ngươi nói sao? Vệ binh, #emphasis tịch thu hết!#!"
  yearly.8300.c:0 "Ngươi quá hào phóng, Ta không thể nhận."
  yearly.8300.d:0 "Vàng? Ta thà #emphasis tịch thu quần áo các ngươi!#!"
  yearly.8400.t:0 "Kẻ Lệch Lạc Bị Thả Rông"
  yearly.8400.desc:0 "Khi Ta rút vào [ROOT.Char.Custom('GetChamber')] nghỉ đêm, Ta vô tình gặp một vị khách, [deviant_guest.GetTitledFirstName], trong nơi thâm sâu nhất — làm sao [deviant_guest.GetSheHe] vào đây!?\n\n'Không phải như vẻ ngoài đâu, [ROOT.Char.Custom('FormOfAddressForLiege')]!' [deviant_guest.GetSheHe] giải thích.\n\nViệc [deviant_guest.GetSheHe] nửa khỏa thân và đang làm nhơ bẩn #emphasis [ROOT.Char.Custom('RandomPrivateObject')]#! của Ta, nói lên rằng đúng như vẻ ngoài."
  yearly.8400.a:0 "Gì... Nhưng... #emphasis ra khỏi [ROOT.Char.Custom('GetRealmOrDomicile')] của Ta!#!"
  yearly.8400.special:0 "Nghe này, Ta biết #emphasis chính xác#! ngươi nên đi đâu."
  yearly.8400.b:0 "Ngươi làm sao thế!? Vào [ROOT.Char.Custom('GetDungeon')] ngay!"
  yearly.8400.c:0 "Chuyện này sẽ không xảy ra lần nữa. Hiểu chứ?"
  yearly.8400.d:0 "Ta không ngờ ngươi có thể #emphasis làm thế đó#!. Thật cám dỗ..."
  yearly.8400.a.tt:0 "Ta đưa [deviant_guest.GetTitledFirstName] tới [appropriate_court_target_owner.Custom('GetCourt')] của [appropriate_court_target_owner.GetTitledFirstName], nơi [deviant_guest.GetSheHe] sẽ trở thành một đặc vụ xuất sắc..."
 
  yearly.8500.opening:0 "[current_head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.8500.desc.a:0 "Tình hình ngươi đang gặp thật đáng tiếc. Dẫu vậy, ta tặng ngươi món quà này để ngươi vượt qua thời điểm hiểm nguy.\n\nTa cầu cho [current_head_of_faith.GetFaith.HighGodName] luôn bên ngươi."
  yearly.8500.desc.b:0 "Cuộc chiến chính nghĩa của ngươi chống kẻ ngoại đạo không bị bỏ qua. Ta đã cử một sứ giả mang đủ tiền để giúp ngươi qua thời gian hỗn loạn này.\n\nNguyện [current_head_of_faith.GetFaith.HighGodName] bảo vệ ngươi."
  yearly.8500.a:0 "Ta quỳ xuống, ca ngợi [current_head_of_faith.GetFaith.HighGodName]!"
  yearly.8500.b:0 "Ta không thể nhận món quà này, nó quá nhiều."
