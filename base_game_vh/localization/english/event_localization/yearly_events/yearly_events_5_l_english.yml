l_english:
  yearly.5001.t:0 "Cuộc Gặp Gỡ Đen Đủi"
  yearly.5001.duelling.desc:1 "Tiếng vang đột ngột từ hai giọng nói quen thuộc đã thu hút sự chú ý của ta, dẫn ta đến phòng riêng của [bickering_spouse.GetWifeHusband] của mình.\n\nKhi đến nơi, ta bàng hoàng phát hiện ra [bickering_spouse.GetWifeHusband] của ta là [bickering_spouse.GetFirstName] đang vướng vào một cuộc tranh cãi nảy lửa với người tình của ta, [bickering_lover.GetFirstName]. Phát hiện ra ta, [bickering_attacker.GetFirstNameNoTooltip] nhanh chóng rút vũ khí của [bickering_attacker.GetHerHis] ra và vung nó về phía [bickering_defender.GetFirstNameNoTooltip],"
  yearly.5001.backstabbing.desc:0 "Ta sắp rời phòng ăn và trở về phòng mình thì thấy người tình [bickering_lover.GetFirstNameNoTooltip] đang trò chuyện với [bickering_spouse.GetWifeHusband] của Ta ở một góc khuất. [bickering_defender.GetFirstName] quay lại chào Ta, vô tình để lộ [bickering_defender.GetHerselfHimself] trước mặt [bickering_attacker.GetFirstName],"
  yearly.5001.duelling.attackerwins.desc:0 "hạ gục [bickering_loser.GetHerHim] và để [bickering_loser.GetHerHim] chảy máu trên sàn, chết."
  yearly.5001.backstabbing.attackerwins.desc:0 "kẻ nhanh chóng lợi dụng sự mất tập trung của đối thủ của [bickering_winner.GetHerHis] để đâm một nhát dao găm xuyên qua phổi của [bickering_loser.GetHerHis]."
  yearly.5001.duelling.defenderwins.desc:0 "nhưng đòn đánh của [bickering_loser.GetHerHis] đã bị chặn lại vào khoảnh khắc cuối cùng bởi đối thủ của [bickering_loser.GetHerHis], kẻ đã dùng sức đẩy mạnh [bickering_loser.GetHerHim] ra rồi xiên qua [bickering_loser.GetHerHim] bằng chính vũ khí của [bickering_loser.GetHerHis]."
  yearly.5001.backstabbing.defenderwins.desc:0 "tuy nhiên, có lẽ nhận ra nguy hiểm đang tới, [bickering_winner.GetFirstNameNoTooltip] ngay lập tức quay lại đối mặt [bickering_loser.GetFirstNameNoTooltip], vặn cổ tay [bickering_loser.GetHerHis] và đâm [bickering_loser.GetHerHim] bằng chính dao của [bickering_loser.GetHerHis]."
  yearly.5001.lover.epilogue.desc:0 "\n\n'Ta làm tất cả vì chúng ta,' [bickering_winner.GetFirstNameNoTooltip] nói, nhìn Ta với chút hối tiếc. 'Để chúng ta có thể bên nhau.'"
  yearly.5001.spouse.epilogue.desc:0 "\n\n'Điều đó cần phải xảy ra,' [bickering_winner.GetFirstNameNoTooltip] nói, liếc Ta với chút hối tiếc. 'Ngươi đã mang điều này đến cho chúng ta.'"
  yearly.5001.a.a.spouse:0 "Ta thật lòng xin lỗi... Ngươi hoàn toàn có lý."
  yearly.5001.a.a.lover:0 "Nhưng Ta ước rằng mọi chuyện không đến mức này..."
  yearly.5001.a.b.spouse:0 "Ngươi đã nói rõ quan điểm, [bickering_spouse.GetWifeHusband]. Giờ hãy để chuyện này qua đi."
  yearly.5001.a.b.lover:0 "Ngươi đã nói rõ. Giờ hãy để chuyện này qua đi."
  yearly.5001.a.c.spouse:0 "Ta chỉ hy vọng Ta có thể tìm thấy lòng để tha thứ cho ngươi."
  yearly.5001.a.c.lover:0 "Có lẽ đây thực sự là cách duy nhất..."
  yearly.5001.b:0 "Ngươi sao?! Biến đi, trước khi ta ném ngươi vào ngục."
  yearly.5001.c:0 "Ta sẽ không quên chuyện này, [bickering_winner.GetFirstNameNoTooltip]."
  yearly.5001.d:0 "Không. Cả vương quốc sẽ biết tội ác phản bội của ngươi!"
  yearly.5001.e:0 "Ngươi đúng! Không gì ngăn chúng ta nữa!"
  yearly.5001.f:0 "Tòa án sẽ biết [bickering_loser.GetFirstNameNoTooltip] đã định làm gì với ngươi."
  yearly.5001.g:0 "Ta không thể để tội ác này chưa bị trừng phạt. Vệ binh!"
  yearly.5001.i:0 "Ta chưa bao giờ biết ngươi có thể tàn nhẫn đến thế... Ta thích điều đó!"
  yearly.5002.t:0 "Hối Hận Xưa"
  yearly.5002.spouse.desc:0 "Đã nhiều tháng kể từ khi Ta đưa [bickering_loser.GetFirstName] ra trước phán xét của [ROOT.Char.GetFaith.HighGodNamePossessive], thanh tẩy danh tiếng gia đình và sửa chữa những khuynh hướng ngoại tình của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_ruler'))]. Thế nhưng, hình ảnh ma quái của đối thủ vẫn ám ảnh đêm Ta, lấy đi giấc ngủ công chính..."
  yearly.5002.lover.desc:0 "Đã nhiều tháng kể từ khi Ta loại bỏ kẻ cai ngục tàn nhẫn của người Ta yêu để chúng Ta được sống tự do khỏi sự bạo ngược hôn nhân của [bickering_loser.GetHerHis]. Thế nhưng, hình ảnh ma quái của đối thủ vẫn ám ảnh đêm Ta, tra tấn Ta từ cõi âm..."
  yearly.5002.forgiven.desc:0 "\n\nDù [scoped_ruler.GetFirstNamePossessive] liên tục đảm bảo rằng [scoped_ruler.GetSheHe] không hận Ta vì hành động này, Ta vẫn cảm thấy tội lỗi tràn ngập."
  yearly.5002.unforgiven.desc:0 "\n\nSự lạnh lùng thờ ơ của [scoped_ruler.GetFirstNamePossessive] chỉ làm mọi chuyện tồi tệ hơn, lấp đầy trái tim Ta sự hối hận cho hành động bạo lực của mình."
  yearly.5002.a:0 "Giá mà [scoped_ruler.GetFirstNameNoTooltip] có thể giúp Ta..."
  yearly.5002.b:0 "Chỉ có [ROOT.GetCharacter.GetFaith.HighGodName] mới ban cho Ta bình yên!"
  yearly.5002.c:0 "[bickering_loser.GetSheHe|U] chỉ thôi tra tấn Ta khi Ta cùng [bickering_loser.GetHerHim]."
  yearly.5003.spouse.desc:0 "[bickering_spouse.GetWifeHusband] [bickering_winner.GetFirstName] của ta đã không còn như trước kể từ cuộc chạm trán xui xẻo cuối cùng của [bickering_winner.GetHerHis] với người ta yêu thương. [bickering_winner.GetSheHe|U] khẳng định mình đã bị ám ảnh bởi linh hồn báo thù của [bickering_loser.GetFirstName] kể từ ngày định mệnh đó."
  yearly.5003.lover.desc:0 "[bickering_winner.GetFirstName] đã không còn như trước kể từ cuộc chạm trán xui xẻo cuối cùng của [bickering_winner.GetHerHis] với [bickering_loser.GetFirstName]. [bickering_winner.GetSheHe|U] khẳng định mình đã bị ám ảnh bởi linh hồn báo thù của [bickering_loser.GetFirstNameNoTooltip] kể từ ngày định mệnh đó."
  yearly.5003.forgiven.desc:0 "\n\n[bickering_winner.GetSheHe|U] sợ rằng ký ức kinh hoàng về tội lỗi bí mật của [bickering_winner.GetHerHis] đang tiêu hao tâm trí và linh hồn [bickering_winner.GetHerHis]."
  yearly.5003.unforgiven.desc:0 "\n\n[bickering_winner.GetSheHe|U] đang van xin ta tha thứ cho [bickering_winner.GetHerHim] vì tội ác khủng khiếp mà [bickering_winner.GetSheHe] đã nhân danh ta mà phạm phải, tin chắc rằng sự xá tội của ta là thứ duy nhất có thể cứu rỗi tâm trí và linh hồn của [bickering_winner.GetHerHis]."
  yearly.5003.a:0 "Được rồi, [bickering_winner.GetFirstNameNoTooltip]. Ta tha thứ cho ngươi."
  yearly.5003.b.forgiven:0 "Ta e rằng không còn gì có thể làm cho ngươi."
  yearly.5003.b.forgotten:0 "Xin lỗi, nhưng Ta không thể làm thế."
  yearly.5003.b.callous:0 "Ngươi có thể ngưng lãng phí thời gian của ta với ảo tưởng của ngươi không?"
  yearly.5003.c:0 "Chỉ là những gì kẻ sát nhân đê hèn như ngươi đáng nhận."
  yearly.5004.desc:0 "[scoped_ruler.GetFirstName] cuối cùng đã ban cho ta sự tha thứ của [scoped_ruler.GetHerHis], và cùng với đó, ta đã tìm lại được sự bình yên một lần nữa. Hồn ma của [bickering_loser.GetFirstName] đã bị trục xuất khỏi những giấc mơ của ta một lần và mãi mãi."
  yearly.5004.a:0 "Ký ức về [bickering_loser.GetHerHis|U] cũng sẽ dần phai nhạt..."
  yearly.5005.desc:0 "Ta thật ngớ ngẩn khi hy vọng [scoped_ruler.GetFirstName] sẽ giúp Ta. [scoped_ruler.GetSheHe|U] luôn là một [scoped_ruler.GetWomanMan] nhỏ nhen và độc ác. [scoped_ruler.GetSheHe|U] coi thường hoàn cảnh của Ta và chế nhạo Ta vì sự yếu đuối, nói rằng Ta xứng đáng với tất cả những gì đang xảy ra."
  yearly.5005.a:0 "Tại sao Ta lại quan tâm đến quái vật này?"
  yearly.5006.epilogue.desc:0 "Không thể đối mặt với tội lỗi từ những hành động của [bickering_winner.GetHerHis], [bickering_winner.GetSheHe] đã quyết định từ bỏ các sự vụ hồng trần và cống hiến cuộc đời của [bickering_winner.GetHerHis] cho [bickering_winner.GetFaith.HighGodNamePossessive]."
  yearly.5006.b.forgiven:0 "Vậy hãy đi bình an, nếu đó là điều ngươi mong muốn."
  yearly.5006.b.upset:0 "Ngươi có thể làm vậy với ta sao?!"
  yearly.5006.b.default:0 "Ta hiểu rồi..."
  yearly.5007.t:0 "Những Đêm Buồn Tẻ"
  yearly.5007.desc:0 "Trong vài tuần gần đây, Ta thường nghĩ về lần gặp gỡ cuối cùng với [bickering_loser.GetFirstName]. Đã lâu lắm rồi cuộc sống mới có ý nghĩa như khi Ta cảm nhận máu [bickering_loser.GetHerHis] ấm trên da mình.\n\n[scoped_ruler.GetFirstName] cũng dường như cảm nhận điều tương tự: chúng Ta chưa bao giờ gần gũi như khi chia sẻ cảm giác thăng hoa của việc giết người, nhưng giờ chúng Ta đang dần xa cách..."
  yearly.5007.a:0 "Có lẽ đã đến lúc thổi bùng ngọn lửa."
  yearly.5007.a.tt:0 "[bickering_winner.GetFirstName] sẽ có xu hướng tham gia Kế Hoạch Giết Người của Ta hơn."
  yearly.5007.b:0 "Ta nghĩ Ta đã làm đủ rồi."
  yearly.5008.desc:0 "Trong vài tuần gần đây, Ta thường nghĩ về [bickering_loser.GetFirstName] yêu dấu và cái chết sớm của [bickering_loser.GetHerHis] bởi tay [bickering_winner.GetFirstName]. Ta chưa bao giờ cảm thấy gần gũi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bickering_winner'))] như khi chia sẻ khoảnh khắc giết người thăng hoa đó. Thậm chí, [bickering_winner.GetSheHe] cũng hứng thú như Ta để tái trải nghiệm khoảnh khắc không thể quên đó và thổi bùng lại ngọn lửa tình yêu."
  yearly.5008.a:0 "Nhưng lần này, Ta sẽ chọn nạn nhân!"
  yearly.5008.b:0 "Không, Ta đã chán trò này rồi."
  yearly.5009.desc:0 "Đề Nghị Bị Từ Chối"
  yearly.5010.t:0 "Bất Đồng Thương Xót"
  yearly.5010.desc:0 "Cảm động trước những gian truân của ta, [bickering_vassal_1.GetTitledFirstName] đã đưa ra những lời khuyên và sự giúp đỡ của [bickering_vassal_1.GetHerHis] cho ta trong nhiều dịp, hy vọng sẽ giảm bớt gánh nặng từ các nghĩa vụ của ta.\n\nTuy nhiên, sự chú ý của [bickering_vassal_1.GetFirstNamePossessiveNoTooltip] đã chuốc lấy cơn thịnh nộ của [bickering_vassal_2.GetTitledFirstName]. "Không thể tin tưởng [bickering_vassal_1.GetFirstNameNoTooltip] được! Đây chỉ đơn thuần là một mưu đồ để lợi dụng ngài mà thôi, thưa minh chủ.""
  yearly.5010.a:0 "Ta chỉ đặt niềm tin vào những người xứng đáng."
  yearly.5010.b:0 "Chúng ta ba người không thể tìm được điểm chung sao?"
  yearly.5010.midwaysuccess.desc:0 "Ta đã hòa giải được một phần bất đồng giữa [bickering_vassal_1.GetTitledFirstName] và [bickering_vassal_2.GetTitledFirstName]."
  yearly.5010.midwayfail.desc:0 "Ta không thể hóa giải mâu thuẫn giữa [bickering_vassal_1.GetTitledFirstName] và [bickering_vassal_2.GetTitledFirstName]."
  yearly.5010.midwaycritfail.desc:0 "Nỗ lực khiến [bickering_vassal_1.GetTitledFirstName] và [bickering_vassal_2.GetTitledFirstName] gác lại khác biệt chỉ khiến cả hai giận dữ với Ta."
  yearly.5010.c:0 "Ta sẽ nghe lời cảnh báo của ngươi, [bickering_vassal_2.GetFirstNameNoTooltip]."
  yearly.5010.d:0 "Vậy hãy bảo vệ danh dự của [ROOT.Char.GetTitleTierName] ngươi!"
  yearly.5010.deceitfail.desc:0 "Ta không thể lừa [bickering_vassal_2.GetTitledFirstName] đấu với [bickering_vassal_1.GetTitledFirstName]."
  yearly.5011.desc:0 "Chẳng cần nhiều để thổi bùng hận thù giữa [bickering_vassal_1.GetFirstNamePossessive] và [bickering_vassal_2.GetFirstNamePossessive] thành đối đầu trực tiếp. Những lời lẽ thô tục được trao đổi trước khi [bickering_vassal_2.GetFirstNameNoTooltip] cuối cùng rút [bickering_vassal_2.GetHerHis] [bickering_vassal_2.Custom('signature_weapon')] chống lại [bickering_vassal_1.GetFirstNameNoTooltip], người đáp trả tương tự.\n\nSau vài cú đánh dữ dội, [bickering_vassal_winner.GetTitledFirstNameNoTooltip] chiến thắng, trong khi đối thủ [bickering_vassal_winner.GetHerHis] bị thương chảy máu trên sàn."
  yearly.5011.a.new:0 "Ta chưa bao giờ nhận ra ngươi tận tụy với ta đến thế, [bickering_vassal_winner.GetFirstNameNoTooltip]..."
  yearly.5011.b.new:0 "Hành động còn nói lên nhiều hơn lời nói, thật vậy."
  yearly.5011.b.old:0 "Nếu không có ngươi, Ta biết phải làm gì, [bickering_vassal_winner.GetFirstNameNoTooltip]?"
  yearly.5011.c:0 "Tại sao ngươi lại làm phiền Ta với tất cả rắc rối này, [bickering_vassal_winner.GetFirstNameNoTooltip]?"
  tooltip.5010.d.vassalsfight:0 "Ta thành công khi kích hai cận thần đánh nhau"
  tooltip.5010.d.vassalsfightfail:0 "[bickering_vassal_2.GetFirstName] từ chối tham gia đánh nhau"
  tooltip.5010.b.success:0 "Ta đã hòa giải được hai cận thần"
  tooltip.5010.b.fail:0 "Ta thất bại trong việc hòa giải hai cận thần"
  tooltip.5010.b.critfail:0 "Ta khiến hai cận thần giận dữ với mình"
  tooltip.5010.d.vassalsfight.effect:0 "[bickering_vassal_2.GetFirstName] thách thức [bickering_vassal_1.GetFirstName] đấu tay đôi đến chết!"

  yearly.5020.t:0 "Về Việc Dạy Dỗ"
  yearly.5020.opening:0 "[helpful_councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.5020.intro.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] của ngài, [scoped_heir.GetFirstName], gần đây rất quan tâm đến công việc của Ta với tư cách [helpful_councillor.Custom('CouncilPosition')]. Nếu ngài rộng lượng cho phép Ta dành chút thời gian với"
  yearly.5020.older.desc:0 "người [scoped_heir.GetWomanMan] lớn tuổi, [scoped_heir.GetSheHe] chắc chắn sẽ học được nhiều điều"
  yearly.5020.younger.desc:0 "[scoped_heir.GetHerHim], [scoped_heir.GetSheHe] chắc chắn sẽ học được nhiều điều"
  yearly.5020.chancellor.desc:0 "về chính trị, nghi lễ và ngoại giao."
  yearly.5020.marshal.desc:0 "về huấn luyện quân, lập kế hoạch bao vây, và các vấn đề chiến tranh khác."
  yearly.5020.steward.desc:0 "về làm toán và quản lý đất đai, tài sản."
  yearly.5020.spymaster.desc:0 "về sự kín đáo và thu thập thông tin ít người biết."
  yearly.5020.court_chaplain.desc:0 "về lịch sử vương quốc và truyền thống của nhân dân chúng ta."
  yearly.5020.kurultai.desc:0 "về kỹ năng bắn cung trên lưng ngựa và cách chăn nuôi du mục ở thảo nguyên."
  yearly.5020.a:0 "Miễn là ngươi biết mình đang làm gì..."
  yearly.5020.a.e.tt:0 "[helpful_councillor.GetFirstNameNoTooltip] sẽ dạy [scoped_heir.GetFirstNameNoTooltip] về trách nhiệm của [helpful_councillor.GetHerHis] với tư cách [helpful_councillor.GetCouncilTitle]"
  yearly.5020.b.a:0 "Tương lai của [scoped_heir.GetFirstNamePossessiveNoTooltip] không liên quan đến ngươi."
  yearly.5020.b.b:0 "Ta muốn tự mình dạy [scoped_heir.GetHerHim]!"
  yearly.5020.c:0 "Chúng ta sẽ xem ngươi có nói thật không đã!"
  tooltip.5020.c.success:0 "Ta tìm thấy lý do để [helpful_councillor.GetFirstNamePossessiveNoTooltip] giáo dục [scoped_heir.GetFirstNameNoTooltip]"
  tooltip.5020.c.success.effect:0 "Việc dạy dỗ tiếp tục không gián đoạn"
  tooltip.5020.c.fail:0 "Ta không hiểu lý do [helpful_councillor.GetFirstNamePossessiveNoTooltip] muốn giáo dục [scoped_heir.GetFirstNameNoTooltip]"
  tooltip.5020.c.fail.effect:0 "Ta có thể phải can thiệp"
  tooltip.5020.c.critfail:0 "[helpful_councillor.GetFirstNameNoTooltip] phát hiện Ta đang do thám [helpful_councillor.GetHerHim]"
  tooltip.5020.c.critfail.effect:0 "[helpful_councillor.GetFirstName] bị xúc phạm và ngừng dạy [scoped_heir.GetFirstName]"
  yearly.5020.ruler.diplomacy.tt:1 "Ngươi cố gắng cải thiện [scoped_heir.GetFirstNamePossessive] [diplomacy|E]"
