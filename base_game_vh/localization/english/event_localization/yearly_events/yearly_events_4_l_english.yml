l_english:
  yearly.4001.opening:0 "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.4001.desc:0 "[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U], "
  yearly.4001.desc_opinion:0 "đã xúc phạm Ta nghiêm trọng. [vassal.GetSheHe|U] đã liều lĩnh gọi Ta là [neighboring_ruler.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal'))] [neighboring_ruler.Custom2('InsultNoun', SCOPE.sC('vassal'))] ngay trước mặt triều đình của Ta."
  yearly.4001.desc_lover:0 "dám dẫn [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))] [neighboring_ruler_secondary.GetTitledFirstName] của Ta vào tội lỗi xác thịt."
  yearly.4001.desc_murder:0 "đã giết [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))] [neighboring_ruler_secondary.GetTitledFirstName] của Ta trong một trận ẩu đả gian xảo."
  yearly.4001.desc_rival:1 "Ta không nên mong gì hơn từ một người liên quan đến #EMP ngươi#!, nhưng điều này không thể chấp nhận được!"
  yearly.4001.desc_end:0 "Ta đòi phải được chuộc lỗi vì sự xúc phạm này!"
  yearly.4001.a:0 "Bất cứ giá nào cũng phải chuộc được lỗi này!"
  yearly.4001.b:0 "[vassal.GetFirstNameNoTooltip] sẽ công khai xin tha thứ cho ngươi."
  yearly.4001.c:0 "Ha, tuyệt lắm [vassal.GetFirstNameNoTooltip]!"

  yearly.4011.t:0 "Kết Chặt Như Kẻ Trộm"
  yearly.4011.desc:0 "Gần đây Ta thường thấy [heir.Custom2('MyCharacterIntroduction', ROOT.Char)] và [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] quanh [ROOT.Char.Custom('ResidenceBuilding')], trò chuyện say sưa. Họ thực sự đã tìm thấy tiếng nói chung!"
  yearly.4011.a:0 "Nhìn thấy Tình bạn nảy nở... Ta sẽ giúp nó phát triển!"
  yearly.4011.b:0 "Họ không có ý tốt gì đâu; việc này phải chấm dứt ngay."
  yearly.4011.c:0 "Vậy... các ngươi đang nói về chuyện gì?"
  yearly.4011.c.success:0 "Sự hiện diện của Ta được đánh giá cao"
  yearly.4011.c.toast.success:0 "Sự hiện diện của Ta đã được đánh giá cao"
  yearly.4011.c.failure:0 "Ta trông như người hay tò mò"
  yearly.4011.c.toast.failure:0 "Ta trông như người hay tò mò"

  yearly.4021.t:0 "Chơi Đùa Thô Bạo"
  yearly.4021.desc:0 "Ôi, thảm họa! Buổi chơi giữa [child.Custom2('MyCharacterIntroduction', ROOT.Char)] và [vassal.GetTitledFirstNamePossessive] [vassal.Custom2('RelationToMeShort', SCOPE.sC('vassal_kid'))] [vassal_kid.GetTitledFirstName] kết thúc đột ngột khi [vassal_kid.GetFirstNameNoTooltip] gặp tai nạn chết người!\n\n'Ta thề [child.Custom2('RelationToMeShort', ROOT.Char)]. Chỉ là trò chơi thôi mà!' [child.GetTitledFirstNameNoTooltip] trấn an Ta khi [vassal.GetTitleAsNameNoTooltip] đòi công lý."
  yearly.4021.a:0 "Ngươi sẽ không được chạm vào con Ta!"
  yearly.4021.b:0 "Không ai có thể tránh hậu quả của hành động mình."
  yearly.4021.c:0 "Ta hứa sẽ kỷ luật [child.GetHerHim]!"
  yearly.4021.c_success:0 "[child.GetTitledFirstNameNoTooltip] nghe lời và học hỏi"
  yearly.4021.c_failure:0 "[child.GetTitledFirstNameNoTooltip] học rằng hành động của [child.GetHerHis] không có hậu quả"
  yearly.4021.d:0 "Ngươi phải tha thứ cho [child.GetHerHim]! Xin, Ta sẽ làm bất cứ điều gì..."

  yearly.4022.t:0 "Người Trở Về"
  yearly.4022.desc:0 ""Chào [child.Custom2('RelationToMeShort', ROOT.Char)]." [ROOT.Char.Custom2('MyCharacterIntroduction', SCOPE.sC('child'))] trông hơi hốc hác sau thời gian ở trong ngục tối của [actor.GetTitledFirstNamePossessive], nhưng nụ cười [child.Custom('quirk_neg_adjective')] nở trên khuôn mặt của [child.GetHerHis] khiến [child.GetHerHim] trông có sức sống hơn bao giờ hết.\n\n"Con không thể chờ đợi để cảm ơn người vì bài học người đã dạy con về việc hoàn trả các nghĩa vụ của mình.""
  yearly.4022.a:0 "Chào mừng về nhà, [child.GetFirstNameNoTooltip]."

  yearly.4031.t:0 "Kẻ Sát Nhân Giữa Chúng Ta"
  yearly.4031.desc_opening:0 "Mùi hương đánh Ta trước khi mở cửa; một mùi nặng và hôi của thịt mới chết lan khắp nơi. Đó là mùi tử thi mới.\n\n"
  yearly.4031.desc_physician:0 ""Lại một vụ án mạng nữa, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]." [physician.GetTitledFirstName] lau đôi bàn tay đẫm máu của [physician.GetHerHis] vào một chiếc tạp dề khi [physician.GetSheHe] đứng dậy sau khi xem xét thi thể. "Chúng ta phải ngăn chặn kẻ sát nhân vô tri này!""
  yearly.4031.desc:0 "Lại có thêm một thi thể được tìm thấy... Tất cả đều là người ít quan trọng, cảm ơn [ROOT.Char.GetFaith.HighGodName], nhưng các nhân vật nổi bật đang lo lắng."
  yearly.4031.a:0 "Ta sẽ lùng sục [ROOT.Char.Custom('ResidenceBuilding')] để tìm Xóa Bạn người này!"
  yearly.4031.tt:0 "Cuộc điều tra bắt đầu"
  yearly.4031.b:0 "Hãy chôn xác và quên đi sự thảm khốc này."
  yearly.4031.b_every_courtier:0 "Mọi quan lại"
  yearly.4031.c:0 "Với vai trò là bác sĩ, ngươi nên nghiên cứu các thi thể."

  yearly.4061.t:0 "Kẻ Khôn Ngoan Điên Rồ"
  yearly.4061.desc_opening:0 "'Tên Ta là [hodja.GetTitledFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Ta đến trước mặt ngài để truyền đạt trí tuệ của Ta.'\n\n"
  yearly.4061.desc_guard:0 "[guard.Custom2('MyCharacterIntroduction', ROOT.Char)|U], người đã dẫn người này đến trước mặt Ta, trông nghi ngờ."
  yearly.4061.desc:0 "Người lính dẫn người đàn ông đến trước mặt Ta trông nghi ngờ."
  yearly.4061.desc_ending:0 "'Ông ấy đến [ROOT.Char.Custom('ResidenceBuilding')] cưỡi một con lừa, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ngược lưng.'"
  yearly.4061.a:0 "Xin hãy chia sẻ trí tuệ của ngươi với Ta."
  yearly.4061.a_success:0 "Ngài thu nhận được một vài hiểu biết"
  yearly.4061.a_failure:0 "Những câu chuyện của ông ấy chỉ làm Ngài rối hơn"
  yearly.4061.b:0 "Hãy để kiến thức của ngươi ban phước cho toàn triều đình!"
  yearly.4061.c:0 "Ta không có thời gian cho kẻ ngốc."
  yearly.4061.c.tt:0 "Ngài từ chối người này"
  yearly.4061.d:0 "Thật thú vị! Hãy để ông ấy cũng làm vui dân chúng."
  yearly.4061.d.tt:0 "Diễu hành ông ấy trên phố như một kẻ ngốc"

  yearly.4071.t:0 "Tìm Kiếm Kiến Thức"
  yearly.4071.desc:0 "[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiếp cận ta với một chồng sách trên tay của [councillor.GetHerHis].\n\n"Thần đã nhận thấy sự khao khát kiến thức của ngài, thưa [councillor.Custom2('RelationToMe', ROOT.Char)] của thần.""
  yearly.4071.desc_focus:0 "Đặc biệt là những nỗ lực gần đây của ngài liên quan đến [ROOT.Char.Custom('LifestyleFocus')]!"
  yearly.4071.desc_no_focus:0 "Chưa kể những nghiên cứu trước đây của ngài về [ROOT.Char.Custom('education_conversation_subject')]!"
  yearly.4071.desc_ending:0 "Có lẽ những cuốn sách này sẽ làm ngài hứng thú?"
  yearly.4071.a:0 "Ta sẽ học tất cả, nhân danh [ROOT.Char.GetFaith.ReligiousText]!"
  yearly.4071.b:0 "Phân phát chúng cho các [ROOT.Char.Custom('GetCourtierPlural')] của Ta."

  yearly.4081.t:0 "Phiên Dịch"
  yearly.4081.desc:0 "'Các học giả địa phương cần tài trợ trong nỗ lực dịch sách từ Hy Lạp sang Ả Rập, [ROOT.Char.Custom('FormOfAddressForLiege')] – nỗ lực này mang lợi ích cho toàn thế giới Ả Rập!' \n\n[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mang đến cho Ta danh sách học giả Ta có thể tài trợ và các sách họ đang dịch."
  yearly.4081.a:0 "#EMP De materia Medica#!... Nghe thú vị!"
  yearly.4081.a.tt:0 "Ngươi tài trợ dịch một cuốn sách về y học"
  yearly.4081.b:0 "Ồ, cuốn này! #EMP On Ascensions#!."
  yearly.4081.b.tt:0 "Ngươi tài trợ dịch một cuốn sách về thiên văn học"
  yearly.4081.c:0 "#EMP Elements#! nghe thật bổ ích."
  yearly.4081.c.tt:0 "Ngươi tài trợ dịch một cuốn sách về toán học"
  yearly.4081.d:0 "Ta có việc quan trọng hơn để tiêu tiền."
  yearly.4081.d.tt:0 "Ngươi không tài trợ học giả nào"
  yearly.4081.toast:0 "Cuốn sách đã được dịch"
  yearly.4081.e:0 "#EMP On the Soul#!? Thú vị..."
  yearly.4081.e.tt:0 "Ngươi tài trợ dịch một cuốn sách về động lực"
  yearly.4081.f:0 "Cái gì đây... #EMP Thucydides#!?"
  yearly.4081.f.tt:0 "Ngươi tài trợ dịch một cuốn sách về lịch sử quân sự"
  yearly.4081.g:0 "Cuốn #EMP Plutarch#! này làm Ta tò mò."
  yearly.4081.g.tt:0 "Ngươi tài trợ dịch một cuốn sách tiểu sử"
  yearly.4081.tt:0 "Ngươi sẽ nhận được cuốn sách"

  yearly.4091.t:0 "Các Học Giả Baghdad"
  yearly.4091.desc_opening:0 "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và Ta đang đi dạo ở Baghdad thì bắt gặp"
  yearly.4091.desc_house:0 "Nhà của Trí Tuệ."
  yearly.4091.desc_no_house:0 "một số học giả địa phương."
  yearly.4091.desc:0 "\n\n'Chào ngài, [ROOT.Char.GetTitledFirstNameNoTooltip]. Chào ngươi, [ward.GetLadyLord] trẻ tuổi. Có một chỗ trống trong cuộc thảo luận đang diễn ra, các ngươi có muốn tham gia không?'"
  yearly.4091.a:0 "Đi đi [ward.GetFirstNameNoTooltip]."
  yearly.4091.a.tt:0 "Điều này sẽ thúc đẩy học vấn của [ward.GetFirstNamePossessiveNoTooltip]"
  yearly.4091.b:0 "Ta muốn tham gia, vâng."
