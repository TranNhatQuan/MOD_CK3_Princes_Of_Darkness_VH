l_english:
  yearly.1001.t:0 "Qua Đôi Mi Buồn"
  yearly.1001.start.desc:0 "Khi ánh mắt Ta gặp [married_seducer.GetTitledFirstNamePossessive] dường như là lần thứ hai mươi tối nay, Ta biết mình không tưởng tượng. Ngay cả từ đầu bàn bên kia, ánh nhìn của [married_seducer.GetHerHis] cũng dữ dội như mặt trời giữa trưa.\n\n[married_seducer.GetSheHe|U] muốn Ta,"
  yearly.1001.end_hesitation.desc:0 "và Ta cảm nhận cơ thể mình phản ứng, thức tỉnh. Nhưng [seducer_spouse.GetTitledFirstName] – [married_seducer.GetHerHis] [seducer_spouse.GetWifeHusband], và là [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('seducer_spouse'))] của Ta – cũng có mặt tối nay..."
  yearly.1001.end_intimidated.desc:0 "và Ta sợ hãi. Sợ [married_seducer.GetHerHim]? Sợ [married_seducer.GetHerHis] [seducer_spouse.GetWifeHusband] [seducer_spouse.GetTitledFirstName]? Hay... sợ chính những gì Ta có thể làm? Ta không thể nói."

  yearly.1001.end_spiteful.desc:0 "và Ta không thể dối lòng, Ta cũng muốn [married_seducer.GetHerHim]... Hay thật ra điều Ta khao khát là trừng phạt [married_seducer.GetHerHis] [seducer_spouse.GetWifeHusband], [seducer_spouse.GetTitledFirstName]? Liệu có quan trọng không?"
  yearly.1001.a:0 "Ta sẽ cho [married_seducer.GetHerHim] một trận mê mẩn!"
  yearly.1001.a.tt:0 "Ta sẽ tìm [married_seducer.GetTitledFirstName] khi mọi người đã ngủ"
  yearly.1001.b:0 "Mọi người sẽ biết về những suy nghĩ tội lỗi của [married_seducer.GetHerHis]!"
  yearly.1001.c:0 "Không! Trái tim Ta vẫn trong sáng."
 
  yearly.1002.desc:0 "Sau đó, [married_seducer.GetFirstName] ngã phịch xuống tấm nệm, hơi thở của [married_seducer.GetHerHis] dồn dập và đôi mắt khép hờ. Một cách uể oải, ta dịu dàng lau đi những giọt mồ hôi trên [married_seducer.Custom('ObjectifiedFeature')] của [married_seducer.GetHerHis] bằng những ngón tay nhẹ nhàng.\n\nChỉ một khoảnh khắc sau, [married_seducer.GetFirstNameNoTooltip] đẩy tay ta ra với một nụ cười tạ lỗi. "Trời sắp sáng rồi. Ta nên rời đi thì hơn.""
  yearly.1002.a:0 "'Ngài có thể ở lại thêm một chút được không? Làm ơn?'"
  yearly.1002.a.success:0 "[married_seducer.GetFirstNameNoTooltip] ở lại"
  yearly.1002.a.success.message:0 "[married_seducer.GetFirstName] và Ta làm tình cho đến khi mặt trời mọc."
  yearly.1002.a.failure:0 "[married_seducer.GetFirstNameNoTooltip] nghĩ Ta quá bám dính"
  yearly.1002.a.failure.message:0 "[married_seducer.GetFirstName] cười khẩy Ta rồi bỏ đi."
  yearly.1002.b:0 "'Quả thật, Ngài nên nhanh chóng.'"
  yearly.1002.b.success:0 "[married_seducer.GetFirstNameNoTooltip] đánh giá sự thoải mái của Ta"
  yearly.1002.b.success.message:0 "[married_seducer.GetFirstName] đánh giá sự thoải mái của Ta."
  yearly.1002.b.failure:0 "[married_seducer.GetFirstNameNoTooltip] mong đợi nhiều hơn"
  yearly.1002.b.failure.message:0 "[married_seducer.GetFirstName] buồn, như thể [married_seducer.GetSheHe] mong đợi điều gì đó nhiều hơn."

  yearly.1003.t:0 "Lẽ Ra Ta Phải Biết"
  yearly.1003.start.desc:0 "Khi đã chắc chắn rằng mình không bị theo dõi, ta hé mở cánh cửa của [married_seducer.GetFirstNamePossessive] và nhìn trộm vào bên trong. Đối tượng khao khát của ta đang đứng quay lưng về phía ta, trần truồng như ngày [married_seducer.GetSheHe] mới lọt lòng."
  yearly.1003.end.desc:0 "Ta đẩy cửa, nghiêng người lại gần...\n\nĐột nhiên, với một tiếng nổ lớn và cơn đau dữ dội, Ta ngã ra sau, đập mạnh xuống sàn. Tiếng thét vang lên, rất nhiều tiếng thét. Và những bước chân. Đầu Ta quay cuồng...\n\n'Như một con chuột trong bẫy,' một giọng quen thuộc thì thầm vào tai Ta. [seducer_spouse.GetTitledFirstName]. Chết tiệt."
  yearly.1003.a:0 "Ta... Ta chỉ định tìm nhà vệ sinh thôi!"

  yearly.1010.t:0 "Biến Mất Trong Đêm"
  yearly.1010.start.desc:0 "Khi Ta bước vào [abductee.GetTitledFirstNamePossessive] [ROOT.Char.Custom('GetChamberPlural')], thứ đầu tiên Ta thấy là lính canh gục xuống ở góc. Thứ hai là vết rạch đỏ tươi trên cổ [dummy_gender.GetHerHis]. Tuy nhiên, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))] của Ta không thấy đâu!"
  yearly.1010.friend.desc:0 "[hunter.GetTitledFirstName] bước vào [ROOT.Char.Custom('GetRoom')], một cây cung đeo trên vai của [hunter.GetHerHis]. "Ta xin lỗi, người bạn già. Chính [abductor.GetTitledFirstName] đã bắt đi [abductee.GetHerHim].""
  yearly.1010.marshal.desc:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hunter'))] của ta bước vào [ROOT.Char.Custom('GetRoom')], một cây cung đeo trên vai của [hunter.GetHerHis]. "Lính gác còn sống sót khẳng định chính [abductor.GetTitledFirstName] đã bắt đi [abductee.GetHerHim], thưa [ROOT.Char.Custom('GetCourtOwner')] của thần.""
  yearly.1010.end.desc:0 "Các chó săn và [dummy_gender.GetWomenMen] đã sẵn sàng. Lệnh của ngài là gì?"
  yearly.1010.abduction.tt:0 "[abductee.GetTitledFirstName] bị [abductor.GetTitledFirstName] bắt đi"
  yearly.1010.friend.tt:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hunter'))] của Ta, [hunter.GetTitledFirstName], ở đây để giúp."
  yearly.1010.a:0 "Bắt sống [abductor.GetTitledFirstNameNoTooltip]."
  yearly.1010.a.tt:0 "Ta sẽ quyết định sau xem muốn [abductee.GetTitledFirstName] được cứu, bị bắt hay bị giết."
  yearly.1010.b:0 "Ta muốn [abductor.Custom2('InsultNoun', ROOT.Char)] đó chết."
  yearly.1010.c:0 "Tất cả những gì Ta quan tâm là [abductee.GetFirstNamePossessiveNoTooltip] trở về an toàn."
  yearly.1010.d:0 "Ta không quan tâm. Thả họ đi."
  yearly_1010_save_abductee_random_list_effect.success.tt:0 "[abductee.GetShortUIName|U] được cứu"
  yearly_1010_save_abductee_random_list_effect.failure.tt:0 "[abductee.GetShortUIName|U] bị [abductor.GetShortUIName] bắt đi"
 
  yearly.1011.desc:0 "'Còn [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))] của ngài?' hỏi [hunter.GetFirstName]. 'Không ai ngoài lính canh của [abductee.GetHerHis] thấy hay nghe gì cả. Ta chắc là có lời giải thích hợp lý, nhưng ngài nên biết — một số [dummy_gender.GetWomenMen] nghi ngờ [abductee.GetSheHe] đi theo ý muốn…'"
  yearly.1011.a:0 "Vớ vẩn. Bảo vệ [abductee.GetFirstNameNoTooltip] bằng cả mạng sống."
  yearly.1011.b:0 "Ta muốn [abductee.GetHerHim] trong xiềng."
  yearly.1011.c:0 "Xẻy cổ [abductee.GetHerHis] và chôn xác."

  yearly_1010_outcome_effect_escape.tt:0 "[THIS.Char.GetTitledFirstName] đã trốn thoát"
  yearly_1010_outcome_effect_abductee_save.tt:0 "[abductee.GetTitledFirstName] được cứu và trở về với Ta"
  yearly_1010_outcome_effect_abductee_lost.tt:0 "[abductee.GetTitledFirstName] bị [abductor.GetTitledFirstName] bắt đi"
  yearly_1010.target_imprison.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip] bị bắt"
  yearly_1010.target_wounded.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip] bị thương nhưng trốn thoát"
  yearly_1010.hunter_killed.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip] giết [hunter.GetTitledFirstNameNoTooltip] và trốn thoát"
  yearly_1010.target_killed.desc:0 "[THIS.Char.GetTitledFirstNameNoTooltip] bị giết"
 yearly_1010.abductee_saved.desc:0 "[abductee.GetTitledFirstNameNoTooltip] is saved"
 yearly_1010.abductee_saved.tt:0 "[abductee.GetTitledFirstName] is brought back to me, safe and sound."
 yearly_1010.abductee_lost.desc:0 "[abductor.GetTitledFirstNameNoTooltip] gets away with [abductee.GetTitledFirstNameNoTooltip]"
 yearly_1010.abductee_lose.tt:0 "[abductee.GetTitledFirstName] is taken from my lands"
 yearly_1010_kill_target_effect.tt:0 "[hunter.GetTitledFirstName] will know my Secret"
  yearly.1013.start.desc:0 "Sự bất định thật không chịu nổi. Một giờ trôi qua, hai, ba... Ta chuẩn bị gọi ngựa thì nghe tiếng la hét từ phía cổng."
  yearly.1013.hunter_dead_start.desc:0 "Khi Ta bước vào [ROOT.Char.Custom('GetCourtyard')], chỉ gặp những khuôn mặt u ám và thân thể [hunter.GetFirstNamePossessive] trên cáng tạm."
  yearly.1013.hunter_alive_start.desc:0 "Ta chạy vào [ROOT.Char.Custom('GetCourtyard')], ngay lập tức nhìn thấy khuôn mặt [hunter.GetFirstNamePossessive] buồn bã."
  yearly.1013.hunter_dead_abductee_lost.desc:0 "Ta nhìn quanh, nhưng không còn hy vọng nào. Chỉ còn những gương mặt đầy cay đắng.\n\n'[abductor.GetTitledFirstName] đã bắt [abductee.GetHerHim], [ROOT.Char.Custom('GetCourtOwner')] của Ta. Chúng ta thất bại rồi...'"
  yearly.1013.hunter_dead_both_escaped.desc:0 "[abductor.GetTitledFirstName] và [abductee.GetTitledFirstName] đã trượt khỏi tay Ta."
  yearly.1013.abductee_lost.desc:0 "Ta tiến về cổng, cầu nguyện để thấy [abductee.GetTitledFirstNamePossessive] quanh góc. Nhưng mọi khuôn mặt Ta thấy đều đầy cay đắng, không ai là [abductee.GetHersHis]."
  yearly.1013.abductor_escaped_abductee_killed.desc:0 "Tuy nhiên, cuộc việc không hoàn toàn thất bại. Trong khi [abductor.GetTitledFirstName] trốn thoát, [hunter.GetFirstName] âm thầm bảo Ta rằng [abductee.GetFirstName] đã được chôn trong mộ nông."
  yearly.1013.abductor_escaped_abductee_imprisoned.desc:0 "Tuy nhiên, cuộc việc không hoàn toàn thất bại. Khi Ta được báo [abductor.GetTitledFirstName] trốn thoát, [abductee.GetFirstName] lại không may mắn..."

  yearly.1013.a1:0 "Ta sẽ xử lý ngươi sớm thôi, [abductee.GetFirstNameNoTooltip]..."
  yearly.1013.a2:0 "Ít ra [abductee.GetFirstNameNoTooltip] vẫn an toàn..."
  yearly.1013.a3:0 "Ngươi sẽ trả giá cho việc này, [abductor.GetFirstNameNoTooltip]..."

  yearly.1014.t:0 "Một Cuộc Săn Thành Công"
  yearly.1014.safe_hunter_start.desc:0 "Khi Ta bước vào [ROOT.Char.Custom('GetCourtyard')], Ta được chào đón bởi nụ cười rộng của [hunter.GetFirstNamePossessive]."
  yearly.1014.abductee_saved_abductor_killed.desc:0 "Quấn trong chăn, ngồi trên lưng ngựa của [hunter.GetHerHis], là [abductee.GetFirstName]. Không hề hấn gì.\n\nKhi Ta giúp [abductee.GetHerHim] xuống, Ta liếc [hunter.GetFirstName]. [hunter.GetSheHe|U] gật đầu. [abductor.GetTitledFirstName] đã được xử lý."
  yearly.1014.abductee_saved_abductor_imprisoned.desc:0 "Quấn trong chăn, ngồi trên lưng ngựa của [hunter.GetHerHis], là [abductee.GetFirstName]. Cảnh tượng làm trái tim Ta phấn chấn.\n\nRồi Ta nhìn thấy một gương mặt quen khác: [abductor.GetTitledFirstName], trong xiềng, bị kéo theo một con ngựa khác. Tuyệt."
  yearly.1014.abductee_saved_abductor_escaped.desc:0 "Được quấn trong một chiếc chăn, ngồi trên lưng ngựa của [hunter.GetHerHis], là [abductee.GetFirstName]. Không hề hấn gì.\n\nKhi ta đỡ [abductee.GetHerHim] xuống, ta liếc nhìn [hunter.GetFirstName]. [hunter.GetSheHe|U] lắc đầu của [hunter.GetHerHis]. Điều đó không quan trọng, ít nhất là lúc này. Chúng ta sẽ giải quyết [abductor.GetTitledFirstName] sau."
  yearly.1014.both_killed.desc:0 "[hunter.GetSheHe|U] ra dấu cho Ta theo.\n\nKhi ra khỏi tầm nghe, [hunter.GetFirstName] kể mọi chuyện. Khi [hunter.GetSheHe] mô tả cách họ chết, nơi chôn và như thế nào, căng thẳng của Ta từ từ tan biến. Không ai sẽ biết."
  yearly.1014.both_imprisoned.desc:0 "[hunter.GetSheHe|U] có một sợi dây thừng trong tay của [hunter.GetHerHis], và [hunter.GetSheHe] giật mạnh nó. Hai người loạng choạng bước về phía trước.\n\n[abductee.GetFirstName] và [abductor.GetFirstName] – đều bị trói và bịt mắt."
  yearly.1014.abductee_killed_abductor_imprison.desc:0 "Bên cạnh [hunter.GetHerHim], bịt mắt và xiềng xích, là [abductor.GetTitledFirstName].\n\nCòn [abductee.GetTitledFirstName]... sự vắng mặt của [abductee.GetHerHis|U] và ánh mắt của [hunter.GetFirstNamePossessive] nói lên mọi thứ đã theo kế hoạch."
  yearly.1014.abductee_imprisoneid_abductor_killed.desc:0 "Bên cạnh [hunter.GetHerHim], bịt mắt và xiềng xích, là [abductee.GetTitledFirstName].\n\nCòn [abductor.GetTitledFirstName]... sự vắng mặt của [abductor.GetHerHis|U] và ánh mắt của [hunter.GetFirstNamePossessive] nói lên mọi thứ đã theo kế hoạch."
  yearly.1014.a:0 "Đây là số phận dành cho tất cả những ai chống lại ta!"

  yearly.1015.t:0 "Chiên Lạc Của Ta"
  yearly.1015.start.desc:0 "Khi [abductee.GetFirstName] xuất hiện tại các cổng thành đêm qua, ta cứ ngỡ hồn ma của [abductee.GetHerHis] đã quay về để ám ảnh ta. Ta đã bắt đầu tin rằng mình sẽ không bao giờ được gặp lại [abductee.GetHerHim] nữa, vậy mà [abductee.GetSheHe] đã ở đó, chân thực như mặt đất dưới chân ta vậy.\n\n[abductee.GetFirstNameNoTooltip] không nói nhiều lời kể từ khi [abductee.GetHerHis] trở về, chỉ bảo rằng"
  yearly.1015.released.desc:0 "[abductor.GetTitledFirstName] đã quyết định thả [abductee.GetHerHim] đi. Ta từng không nghĩ [abductor.GetTitledFirstNameNoTooltip] sở hữu một chút danh tự nào trong cơ thể của [abductor.GetHerHis], thế nhưng [abductee.GetFirstNameNoTooltip] hiện đã được tự do, chẳng phải vậy sao...?"
  yearly.1015.escaped.desc:0 "[abductee.GetSheHe] thấy cơ hội và trốn thoát. Nghe có vẻ khó tin, nhưng những chuyện lạ hơn còn xảy ra, chắc chắn…?"
  yearly.1015.immediate.tt:0 "[abductee.GetTitledFirstName] đã trở về triều đình Ta"
  yearly.1015.a.trusting:0 "Cảm ơn [ROOT.Char.GetFaith.HighGodName] vì [abductee.GetFirstNamePossessiveNoTooltip] trở về an toàn!"
  yearly.1015.a.paranoid:0 "[abductee.GetFirstNameNoTooltip] đang giấu điều gì đó, Ta chắc chắn..."
  yearly.1015.a:0 "Ta không biết nên tin điều gì..."
 
  yearly.1020.opening:0 "[vip.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.1020.desc:1 "Trong vài ngày tới, tên [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))] [vip.Custom2('RelationToMeShort', SCOPE.sC('enemy'))] của ta là [enemy.GetTitledFirstName] sẽ di chuyển qua vùng [my_county.GetNameNoTierNoTooltip]. Nếu ngươi dàn dựng một cuộc phục kích và bắt sống [enemy.GetHerHim], ta sẽ trọng thưởng cho ngươi một cách hậu hĩnh.\n\nNếu ngươi chấp nhận lời đề nghị của ta, ngươi sẽ nhận được một nửa số tiền ngay bây giờ, và nửa còn lại khi ngươi bàn giao [enemy.GetTitledFirstNameNoTooltip]. Nếu [enemy.GetSheHe] có mạng vong trong cuộc hỗn chiến, ta sẽ không nhỏ một giọt lệ nào, nhưng ta cũng sẽ không trả tiền cho cái xác của [enemy.GetHerHis].\n\nTa tin rằng những lời lẽ trên mảnh giấy da này sẽ chỉ có hai chúng ta biết. Ta rất mong nhận được phản hồi từ ngươi."
  yearly.1020.a:0 "Ta biết một chỗ lý tưởng để phục kích..."
  yearly.1020.a.rl.t:0 "Chỉ vài ngày nữa"
  yearly.1020.a.capture.desc:0 "Ta bắt được [enemy.GetTitledFirstNameNoTooltip]"
  yearly.1020.a.capture.tt:0 "[vip.GetTitledFirstName] sẽ giao phần còn lại khi [vip.GetSheHe] nhận [enemy.GetTitledFirstName]"
  yearly.1020.a.escape.desc:0 "[enemy.GetTitledFirstNameNoTooltip] trốn thoát"
  yearly.1020.b:0 "Ta sẽ giả vờ chấp nhận, nhưng bí mật cảnh báo [enemy.GetFirstNameNoTooltip]."
  yearly.1020.a.kill.desc:0 "[enemy.GetTitledFirstNameNoTooltip] bị giết trong phục kích"
  yearly.1020.a.kill.message:0 "[enemy.GetTitledFirstName] đã bị giết trong phục kích."
  yearly.1020.b.success.desc:0 "[vip.GetTitledFirstNameNoTooltip] tin rằng ta đã phục kích [enemy.GetTitledFirstNameNoTooltip]"
  yearly.1020.b.success.tt:0 "[vip.GetTitledFirstName] sẽ không bao giờ biết ta đã làm sau lưng [vip.GetHerHis]"
  yearly.1020.b.failure.desc:0 "[vip.GetTitledFirstNameNoTooltip] phát hiện ta đã cảnh báo [enemy.GetTitledFirstNameNoTooltip]"
  yearly.1020.c:0 "Thỏa thuận này có vẻ quá nguy hiểm."

  yearly.1021.desc:0 "Tên gián điệp ta cài vào đoàn tùy tùng của [enemy.GetTitledFirstNamePossessive] đã gửi báo cáo cho ta. Ôi trời đất ơi, thật là một nội dung ly kỳ! Chắc chắn vẻ mặt tự mãn đó hiện đã biến mất khỏi khuôn mặt của [enemy.GetFirstNamePossessiveNoTooltip] then!\n\nNhững binh lính chịu trách nhiệm thu gom tên [enemy.Custom2('InsultNoun', SCOPE.sC('vip'))] [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))] đó đã lên đường, và đúng vậy, họ có mang theo vàng.\n\nThật là một niềm vinh hạnh khi được giao dịch với ngài, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip]. Hy vọng đường đời của chúng ta sẽ còn giao nhau lần nữa."
  yearly.1021.a:0 "Ồ, vinh dự là của ta."
  yearly.1021.b:0 "Thật ra, ta nghĩ ta sẽ giữ [enemy.GetHerHim]!"
  yearly.1021.b.tt:0 "[enemy.GetTitledFirstName] sẽ vẫn là tù binh của ta"

  yearly.1022.opening:0 "[enemy.Custom2('AppropriateGreeting', ROOT.Char)]"
  yearly.1022.desc:0 "Ngài quả là một kẻ [ROOT.Char.GetWomanMan] vô cùng danh giá, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip]. Ta nợ ngài sự tự do của mình — thậm chí có thể là cả mạng sống này. Ai mà biết được tên [vip.Custom2('InsultNoun', SCOPE.sC('enemy'))] [vip.Custom2('InsultAdjective', SCOPE.sC('enemy'))] [vip.GetTitledFirstName] đó sẽ làm gì với ta, nếu ta có kết cục trong ngục tối của [vip.GetHerHis]?\n\nTa sẽ báo đáp ơn huệ này, ta thề đấy. Từ giờ cho đến lúc đó, xin hãy bảo trọng."
  yearly.1022.a:0 "Và ngươi, [enemy.GetLadyLord] [enemy.GetFirstNameNoTooltip]."

  yearly.1023.opening:0 "[vip.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  yearly.1023.desc:0 "Ngươi thật sự nghĩ mình có thể thoát khỏi âm mưu nhỏ đó sao? Ta có mắt khắp nơi, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip], và từ giờ chúng sẽ theo sát ngươi.\n\nTa thề bằng mạng sống mình — ngươi sẽ hối hận ngày quyết định chống lại ta."
  yearly.1023.a:0 "Lẽ ra việc này có thể tốt hơn..."

  yearly.1030.t:0 "Mọi [hooked.GetWomanMan|U] cho [hooked.GetHerselfHimself|U]"
  yearly.1030.nervous.desc:0 "[hooked.GetTitledFirstName] đang bồn chồn nghịch nghịch ống tay áo của [hooked.GetHerHis] khi ta bước vào [ROOT.Char.Custom('GetChamber')] của mình. [hooked.GetSheHe] đang làm gì ở đây vào giờ này chứ?\n\n"Thần vô cùng xin lỗi, nhưng thần phải nói chuyện riêng với ngài. Thần đã phát hiện ra một điều #emp vô cùng#! thú vị.""
  yearly.1030.confident.desc:0 "Thông báo của lính gác về khách khiến mọi buồn ngủ tan biến. Ai mà dám làm phiền ta giờ này?\n\nVị khách đêm khuya không ai khác là [hooked.GetTitledFirstName]. "Ta cần nói riêng với ngươi, tránh tai nghe. Ta phát hiện điều gì đó #EMP rất thú vị#!.""
  yearly.1030.end.desc:0 "\n\n[hooked.GetTitledFirstNameNoTooltip] đã phát hiện bí mật của [secret_character.GetTitledFirstNamePossessive]. [hooked.GetSheHe|U] sẵn sàng chia sẻ nếu ta tha cho [hooked.GetHerHim]."
  yearly.1030.a:0 "Ta thề, sau việc này, ngươi sẽ không còn nợ ta nữa."
  yearly.1030.a.tt:1 "[hooked.GetTitledFirstName] sẽ kể cho ta một [secret|E] về [secret_character.GetTitledFirstName]"
  yearly.1030.b:0 "Ngươi nghĩ mình có thể ra lệnh? Nói đi, nếu không!"
  yearly.1030.b.tt:1 "Ta ép [hooked.GetTitledFirstName] kể một [secret|E] về [secret_character.GetTitledFirstName]"
  yearly.1030.c:0 "Ta thà có ngươi trong tay còn hơn [secret_character.GetHerHim]."
  yearly.1030.a.start.desc:0 "Bí mật được khám phá"
  yearly.1030.a.secret_deviant.desc:0 "về sự biến thái của [secret_character.GetTitledFirstNamePossessive]!"
  yearly.1030.a.secret_homosexual.desc:0 "về dục vọng của [secret_character.GetTitledFirstNamePossessive] đối với [secret_character.GetWomenMen]!"
  yearly.1030.a.secret_murder_attempt.desc:0 "về âm mưu giết người thất bại của [secret_character.GetTitledFirstNamePossessive] nhằm vào [secret_target.GetTitledFirstNameOrMe]!"
  yearly.1030.a.secret_cannibal.desc:0 "về cơn đói thịt người của [secret_character.GetTitledFirstNamePossessive]!"
  yearly.1030.a.secret_lover.desc:0 "về mối quan hệ tình ái bí mật giữa [secret_character.GetTitledFirstName] và [secret_target.GetTitledFirstName]!"
  yearly.1030.a.secret_murder.desc:0 "[secret_character.GetTitledFirstName] là kẻ đứng sau cái chết không đúng lúc của [secret_target.GetTitledFirstNamePossessive]!"
  yearly.1030.a.secret_heretic.desc:0 "về những hành vi dị giáo của [secret_character.GetTitledFirstNamePossessive]!"
  yearly.1030.a.secret_incest.desc:0 "về mối quan hệ loạn luân giữa [secret_character.GetTitledFirstName] và một người thân gần của [secret_character.GetHerHis]!"
  yearly.1030.a.secret_witch.desc:0 "rằng [secret_character.GetTitledFirstName] là một phù thủy!"

  yearly.1040.t:0 "Một Cuộc Viếng Thăm Bất Ngờ"
  yearly.1040.tumble.desc:0 "Ta đã đến [suspicious.GetFirstNamePossessive] [suspicious.Custom('GetChamber')] yêu dấu, không ai hay biết. Trong lòng đầy khao khát — và nhục cảm — ta từ từ bước vào.\n\n"
  yearly.1040.dinner.desc:0 "Với ý định tận hưởng một buổi tối thư giãn, ta tiến về [ROOT.Char.Custom2('RelationToMeShort', suspicious)] [suspicious.GetFirstNamePossessive] [suspicious.Custom('GetChamber')] mang theo [ROOT.Char.Custom('RegionalDrink')] và một [ROOT.Char.Custom('RegionalGameObject')]. Không gõ cửa, ta bước vào.\n\n"
  yearly.1040.council_meeting.desc:0 "Lại một lần nữa, [suspicious.GetTitledFirstName] đến trễ cuộc họp hội đồng. Lần này, ta sẽ không bỏ qua! Khi ta tới [suspicious.GetFirstNamePossessiveNoTooltip] [suspicious.Custom('GetChamber')], ta không cho [suspicious.GetHerHim] cơ hội thông báo.\n\n"
  yearly.1040.vassal_talk.desc:0 "Kể từ khi chư hầu [suspicious.GetTitledFirstName] tới triều, theo lời mời hào phóng của ta, [suspicious.GetSheHe] hầu như không rời [suspicious.GetHerHis] [suspicious.Custom('GetChamber')]. Ta đòi lời giải thích!\n\nKhi ta bước vào,"
  yearly.1040.end.desc:0 "[suspicious.GetTitledFirstNameNoTooltip] đang ngồi đó, viết lách một cách điên cuồng. Khi ta đằng hắng giọng, [suspicious.GetSheHe] giật bắn cả mình. [suspicious.GetSheHe|U] nhanh chóng nhét một cuộn giấy da vào túi của [suspicious.GetHerHis] và quay lại phía ta với một vẻ mặt bất an hiện rõ trên khuôn mặt của [suspicious.GetHerHis]."
  yearly.1040.a:0 ""Ngươi đang giấu gì? Cho ta xem ngay!""
  yearly.1040.a.tt:0 "Ta sẽ khám phá những gì [suspicious.GetTitledFirstName] đang giấu, dù tốt hay xấu"
  yearly.1040.b:0 "Quay lại sau và lục tìm [suspicious.GetHerHis] [suspicious.Custom('GetChamber')] một cách bí mật."
  yearly.1040.b.success.desc:0 "Ta tìm thấy cuộn giấy"
  yearly.1040.b.failure.desc:0 "Ta bị [suspicious.GetTitledFirstNameNoTooltip] phát hiện"
  yearly.1040.c:0 "Tôn trọng quyền riêng tư của [suspicious.GetHerHis]."

  yearly.1041.start.desc:0 "[suspicious.GetSheHe] thật sự nghĩ ta không thấy sao? 'Đưa cho ta! Ngay lập tức!'"
  yearly.1041.cross_arm.desc:0 "[suspicious.GetFirstNameNoTooltip] đưa cho ta mảnh giấy da nhàu nát rồi khoanh tay của [suspicious.GetHerHis] lại."
  yearly.1041.shivering_hand.desc:0 "Với bàn tay run rẩy, [suspicious.GetFirstNameNoTooltip] đưa cho ta cuộn giấy."
  yearly.1041.middle.desc:0 "\n\n"
  yearly.1041.friend.desc:0 "Có ai đó đang nhận lời mời, vui mừng được dành thời gian với... ta! Người viết thư là Bạn ta, [secret_friend.GetTitledFirstName]!\n\n'Lẽ ra đây phải là một bất ngờ, một chuyến đi vui vẻ và thư giãn cho hai người... Giờ thì tan tành rồi!'"
  yearly.1041.gift.desc:0 "Đó là một bức thư. Nói về một giao dịch tiền bạc, và yêu cầu chế tác [ROOT.Char.Custom('SuitableGiftItem')] với huy hiệu [ROOT.Char.GetDynastyNameNoTooltip]...\n\n'Ta muốn làm ngươi bất ngờ, tặng một món để bày tỏ lòng cảm ơn. Giờ thì tất cả vô ích!'"
  yearly.1041.feast.desc:0 "Đó là danh sách đồ ăn và thức uống, nhiều tên quen thuộc, bao gồm cả [ROOT.Char.Custom('MusicalPerformer')] yêu thích...\n\n'Lẽ ra là một bất ngờ. Ta nghĩ sẽ là cử chỉ đẹp để tổ chức yến tiệc vinh danh ngươi, vậy mà ngươi lại đáp lại thế này...'"
  yearly.1041.hostile_scheme_agent_other.desc:0 "Đó là danh sách thời gian và địa điểm, những gì nghe thấy và thấy được. Những việc riêng tư... [suspicious.GetFirstNameNoTooltip] đang giúp ai đó âm mưu chống lại [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scheme_target'))] [scheme_target.GetFirstName] của ta!"
  yearly.1041.hostile_scheme_agent_me.desc:0 "Đó là danh sách thời gian và địa điểm, những gì ta đã nói và làm! [suspicious.GetFirstNameNoTooltip] đã báo cáo hoạt động của ta, giúp ai đó âm mưu chống lại ta!"
  yearly.1041.secret_wicked.desc:0 "Ôi chao, thật là gian xảo thú vị. Theo bức thư tống tiền này, [suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
  yearly.1041.secret_angry.desc:0 "Ta lướt qua bức thư, kinh hãi. Đó là một cáo buộc thuyết phục, nói rằng [suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
 
  yearly.1041.a.good:0 "Ta... xin lỗi. Ta không hề hay biết!"
  yearly.1041.a.bad:0 "Bằng chứng bằng văn bản. Thật là chu đáo."
  yearly.1041.friend.tt:0 "Nếu ta không phá hỏng bất ngờ của [suspicious.GetTitledFirstNamePossessive], ta sẽ giảm [stress|E] và tăng [opinion|E] với [secret_friend.GetTitledFirstName]"
  yearly.1041.gift.tt:0 "Nếu ta không phá hỏng bất ngờ của [suspicious.GetTitledFirstNamePossessive], ta sẽ nhận được [gold|E]"
  yearly.1041.feast.tt:0 "Nếu ta không phá hỏng bất ngờ của [suspicious.GetTitledFirstNamePossessive], ta sẽ nhận được [prestige|E]"

  yearly.1042.start.desc:0 "Khi ta lục tìm đồ của [suspicious.GetHerHis], [suspicious.GetTitledFirstName] ngủ như một đứa trẻ. Thuốc an thần trong [suspicious.GetHerHis] [suspicious.Custom('RegionalDrink')] thật sự hiệu quả! Chỉ trong vài phút, ta đã tìm thấy cuộn giấy mà [suspicious.GetSheHe] giấu..."
  yearly.1042.friend.desc:0 "Có ai đó đang nhận lời mời, vui mừng được dành thời gian với... ta! Người viết là Bạn ta, [secret_friend.GetTitledFirstName]!\n\nCó vẻ như [suspicious.GetFirstNameNoTooltip] định làm ngạc nhiên ta bằng một chuyến đi cùng [secret_friend.GetFirstNameNoTooltip]!"
  yearly.1042.gift.desc:0 "Đó là một bức thư. Nói về giao dịch tiền bạc và yêu cầu chế tác [ROOT.Char.Custom('SuitableGiftItem')] với huy hiệu [ROOT.Char.GetDynastyNameNoTooltip]...\n\nCó vẻ như [suspicious.GetFirstNameNoTooltip] định làm ta bất ngờ bằng một món quà!"
  yearly.1042.feast.desc:0 "Đó là danh sách đồ ăn và thức uống, nhiều tên quen thuộc, bao gồm cả [ROOT.Char.Custom('MusicalPerformer')] yêu thích...\n\nCó vẻ như [suspicious.GetFirstNameNoTooltip] định làm ta bất ngờ bằng một yến tiệc vinh danh!"
  yearly.1042.a.good:0 "Điều này không phải điều ta mong đợi."
  yearly.1042.good.tt:0 "Ta sẽ giả vờ không biết khi [suspicious.GetTitledFirstName] tiết lộ bất ngờ"

  yearly.1043.t:0 "Bắt Quả Tang"
  yearly.1043.desc:0 "Ta lục tìm đồ của [suspicious.GetTitledFirstNamePossessive], tim đập nhanh. Cuộn giấy chết tiệt đâu rồi?\n\n'Ơ... [ROOT.Char.GetFirstNameNoTooltip]? Ngươi làm gì ở đây?!'\n\nTa quay lại thấy [suspicious.GetFirstNameNoTooltip] lảo đảo ra khỏi giường, mệt mỏi nhưng rõ ràng tức giận. Có vẻ thuốc an thần trong [suspicious.GetHerHis] [suspicious.Custom('RegionalDrink')] tối qua không hiệu quả..."
  yearly.1043.a:0 "Ta... vừa định đi thôi."
  yearly.1043.a.tt:0 "Ta không phát hiện ra [suspicious.GetTitledFirstName] giấu gì"

  yearly.1044.t:0 "Một Cử Chỉ Tri Ân"
  yearly.1044.start.desc:0 "Một nụ cười tinh nghịch trên môi [suspicious.GetTitledFirstNamePossessive]. 'Ta biết gần đây mình cư xử lạ, xin lỗi về điều đó. Nhưng ta có lý do chính đáng!'\n\n"
  yearly.1044.friend.desc:0 "[suspicious.GetFirstNameNoTooltip] ra hiệu cho ta theo và dẫn ra ngoài. Trên lưng [secret_friend.GetHerHis] ngồi, chuẩn bị cho chuyến đi là [secret_friend.GetTitledFirstName]!\n\n'Ta đã sắp xếp một chuyến đi nhỏ cho hai người!' [suspicious.GetFirstNameNoTooltip] nói hớn hở. 'Ta nghĩ các ngươi cần thời gian chất lượng bên nhau!'"
  yearly.1044.gift.desc:0 "[suspicious.GetFirstNameNoTooltip] đưa cho ta món quà gói cẩn thận, trang trí bằng ruy băng nhiều màu. 'Ta muốn làm ngươi bất ngờ. Ta đặt làm riêng, chỉ có một món duy nhất. Mở đi!'"
  yearly.1044.feast.desc:0 "[suspicious.GetFirstNameNoTooltip] ra hiệu cho ta theo và dẫn đến đại sảnh. Khi [suspicious.GetSheHe] mở cửa, một giai điệu vui tươi vang lên. Ôi trời... trang trí, mùi vị! Và tất cả đều có mặt!\n\n'Đây là yến tiệc vinh danh ngươi! Để ta lấy cho ngươi một cốc [ROOT.Char.Custom('RegionalDrink')]!'"
  yearly.1044.a:0 "Cảm ơn ngươi, [suspicious.GetFirstNameNoTooltip]!"

  yearly.1050.t:0 "Võ Sĩ Đại Tài"
  yearly.1050.angry.desc:0 "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đến với một cánh tay băng bó cùng một khát khao báo thù rực cháy. [angry_vassal.GetSheHe|U] nói với ta rằng đứa [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] của ta, [heir.GetTitledFirstName], đã "lộng hành quấy phá" khắp vùng [title.GetNameNoTierNoTooltip].\n\n"Đứa [heir.Custom('GirlBoy')] của ngài tự huyễn hoặc [heir.GetHerselfHimself] là một đấu sĩ – [heir.GetSheHe] xuất hiện ngay trước cửa nhà thần và thách đấu thần trước mặt bàn dân thiên hạ! Thần không còn lựa chọn nào khác ngoài việc chấp nhận. Đây cũng không phải lần đầu tiên đâu. Thần chỉ là nạn nhân mới nhất trong một danh sách dài các nạn nhân mà thôi!""
  yearly.1050.scared.desc:0 "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đến triều đình với một cánh tay băng bó cùng nỗi sợ hãi trong đôi mắt của [angry_vassal.GetHerHis]. [angry_vassal.GetSheHe|U] nói với ta rằng đứa [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] của ta, [heir.GetTitledFirstName], đã đi thách đấu mọi người khắp vùng [title.GetNameNoTierNoTooltip].\n\n"Xin hãy tha thứ cho thần, thưa [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng việc này phải chấm dứt thôi. [heir.GetTitledFirstNameNoTooltip] xuất hiện ngay trước cửa nhà thần và thách đấu thần, thần không còn lựa chọn nào khác ngoài việc chấp nhận. Đây cũng không phải lần đầu tiên đâu. Thần chỉ là nạn nhân mới nhất trong một danh sách dài các nạn nhân mà thôi!""

  yearly.1050.a:0 "Những cuộc đấu này sẽ dừng ngay lập tức."
  yearly.1050.b:0 "Một thú vui nguy hiểm. Ngươi cần một người hướng dẫn."
  yearly.1050.c.failure.tt:0 "[heir.GetTitledFirstName] sẽ tiếp tục thách đấu mọi người"
  yearly.1050.c.success.tt:0 "[heir.GetTitledFirstName] sẽ không đấu nữa"
  yearly.1050.c.success.wounded.tt:0 "[heir.GetTitledFirstName] có thể bị thương"
  yearly.1050.c.failure.wounded.tt:0 "Ta có thể bị thương"
  yearly.1050.c:0 "Phah! [heir.Custom2('RelationToMeShort', ROOT.Char)] của ngươi sẽ cho ngươi thấy cách làm!"
  yearly.1050.critical_success.desc:0 "Ta đánh bại [heir.GetFirstNameNoTooltip]"
  yearly.1050.failure.desc:0 "Ta thua trong trận đấu"

  yearly.1051.t:0 "Kẻ Đấu Sĩ Trở Lại"
  yearly.1051.victory.desc:0 "Khi [heir.GetTitledFirstName] trở về từ chuyến phiêu lưu của [heir.GetHerHis], mọi cận thần đều có mặt ở đó để chiêm ngưỡng [heir.GetHerHim]. Một vài người trong số họ reo hò và hô vang sự ngưỡng mộ của họ, trong khi những người khác thì... ít ấn tượng hơn.\n\nNhưng không một ai có thể phủ nhận rằng [heir.GetFirstNameNoTooltip] đã chứng minh [heir.GetHerselfHimself] là một đấu sĩ cừ khôi sau khi đánh bại hết vị chúa tể này đến vị chúa tể khác."
  yearly.1051.murder.desc:0 "Trước khi [heir.GetTitledFirstName] kịp mở miệng của [heir.GetHerHis], ta đã có thể nhận ra tình hình sẽ rất tồi tệ. Sự hoảng loạn trong đôi mắt của [heir.GetHerHis] là điều vô cùng khác lạ ở [heir.GetHerHim].\n\n"Xin người, [heir.Custom2('RelationToMeShort', ROOT.Char)], người phải giúp con. Con không cố ý... [angry_vassal_2.GetSheHe|U] đáng lẽ không phải chết!""
  yearly.1051.decent.desc:0 "[heir.GetTitledFirstName] đã trở về từ những chuyến phiêu lưu của [heir.GetHerHis] như một kẻ [heir.GetWomanMan] mạnh mẽ hơn. Dù [heir.GetSheHe] đã thua một vài trận đấu và làm phật lòng thêm một số chư hầu của ta, [heir.GetSheHe] cũng đã có phần thắng của riêng [heir.GetHerHis] và tích lũy được những kinh nghiệm quý báu.\n\nGiờ đây, có lẽ đã đến lúc phải xoa dịu [angry_vassal_2.GetTitledFirstName]. [heir.GetFirstNameNoTooltip] đáng lẽ đã có thể nhẹ tay hơn với [angry_vassal_2.GetHerHim]..."
  yearly.1051.defeat.desc:0 "[heir.GetTitledFirstName] cuối cùng đã trở về với cái đuôi cụp giữa hai chân của [heir.GetHerHis]. Đứa [heir.Custom('GirlBoy')] vô tâm đã đi khắp vương quốc và thách đấu hết chư hầu này đến chư hầu khác, chỉ để rồi chuốc lấy thất bại trong mọi trận đấu.\n\nSau một thất bại ê chề dưới tay của [angry_vassal_2.GetTitledFirstName], [heir.GetSheHe] cuối cùng dường như đã học được một bài học."
  yearly.1051.great_victory_end.desc:0 "[heir.GetFirstNameNoTooltip] thậm chí đã đánh bại nhà vô địch vĩ đại [angry_vassal_2.GetTitledFirstName]!"
  yearly.1051.regular_victory_end.desc:0 "Chiến thắng của [heir.GetHerHis|U] trước [angry_vassal_2.GetTitledFirstName] được cho là đặc biệt ấn tượng."
  yearly.1051.victorious.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))|U], ngươi khiến ta tự hào."
  yearly.1051.murder.a:0 "Ngươi giết [angry_vassal_2.GetTitledFirstNameNoTooltip]?!"
  yearly.1051.decent.a:0 "Ngươi sẽ nghỉ ngơi bây giờ chứ, [heir.GetFirstNameNoTooltip]?"
  yearly.1051.defeat.a:0 "Ngươi làm ta xấu hổ."

  yearly.1060.t:0 "Trò Đùa Cũ Rích"
  yearly.1060.bed.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tựa người trên khuỷu tay, môi nở nụ cười tinh nghịch."
  yearly.1060.dance.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nhảy múa uyển chuyển theo nhạc, mắt [joker.GetHerHis] lấp lánh vui thích. Khi điệu nhảy đưa chúng ta gần nhau, [joker.GetSheHe] nghiêng sát và thì thầm vào tai ta."
  yearly.1060.dinner.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lắc nhẹ chén rượu [joker.Custom('RegionalDrink')] của [joker.GetHerHis] và ghé sát về phía ta với một nụ cười tinh quái."
  yearly.1060.garden.desc:0 "Khi dạo qua vườn, [joker.Custom2('MyCharacterIntroduction', ROOT.Char)] nghiêng về phía ta với nụ cười tinh nghịch."
  yearly.1060.ride.desc:0 "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ghìm cương con ngựa của [joker.GetHerHis] lại và vỗ nhẹ vào cổ nó. Khi [joker.GetSheHe] ngước nhìn ta, ta có thể thấy vẻ ửng hồng trên đôi má của [joker.GetHerHis] cùng ánh nhìn tinh quái trong đôi mắt của [joker.GetHerHis]."
  yearly.1060.joke.desc:0 "\n\n'Vậy, [ROOT.Char.GetFirstNameNoTooltip]... Cái gì treo ở đùi đàn ông và muốn chọc vào lỗ mà nó thường chọc trước đây?'"
  yearly.1060.a.tt:0 "Ta tự hỏi [joker.GetFirstNameNoTooltip] muốn nghe gì?\n"
  yearly.1060.a:0 "Một chiếc chìa khóa."
  yearly.1060.charmed.message:0 "[joker.GetFirstNameNoTooltip] bị quyến rũ"
  yearly.1060.amused.message:0 "[joker.GetFirstNameNoTooltip] thích thú"
  yearly.1060.disappointed.message:0 "[joker.GetFirstNameNoTooltip] thất vọng"
  yearly.1060.b:0 "Một thanh kiếm."
  yearly.1060.c.male:0 "Ngươi muốn ta cho xem chăng?"
  yearly.1060.c.female:0 "Có lẽ ngươi muốn cho ta xem?"
  yearly.1060.very_charmed.message:0 "[joker.GetFirstNameNoTooltip] cực kỳ bị quyến rũ"
  yearly.1060.reveal_secret.tt:0 "[joker.GetTitledFirstName] sẽ biết bí mật của ta"
  yearly.1060.sex_and_maybe_lover.tt:0 "[joker.GetFirstNameNoTooltip] và ta qua đêm cùng nhau..."
  yearly.1060.sex.tt:0 "[joker.GetFirstNameNoTooltip] và ta có một cuộc ân ái nồng nhiệt"
  yearly.1060.crude.message:0 "[joker.GetFirstNameNoTooltip] cho rằng ta thô lỗ"
  yearly.1060.d:0 "Ta không biết ngươi đang nói gì..."
  yearly.1060.e:0 "Thật thô tục!"

  yearly.1070.t:0 "Bị Hút Vào Ngọn Lửa"
  yearly.1070.start.desc:0 "Có điều gì đó đặc biệt ở [potential_soulmate.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Có phải là nụ cười của [potential_soulmate.GetSheHe]? Rõ ràng..."
  yearly.1070.peal.desc:0 "tiếng vang"
  yearly.1070.rumble.desc:0 "rền rĩ"
  yearly.1070.middle.desc:0 "của tiếng cười [potential_soulmate.GetHerHis], hay có lẽ"
  yearly.1070.benevolent.desc:0 "cách tử tế mà [potential_soulmate.GetSheHe] đối xử với mọi người, quý tộc và thường dân?"
  yearly.1070.dominant.desc:0 "ý chí sắt đá, kiên định của [potential_soulmate.GetHerHis]?"
  yearly.1070.submissive.desc:0 "tính cách dịu dàng của [potential_soulmate.GetHerHis]?"
  yearly.1070.extroverted.desc:0 "cách [potential_soulmate.GetSheHe] làm mọi cuộc trò chuyện trở nên dễ chịu?"
  yearly.1070.introverted.desc:0 "ánh mắt [potential_soulmate.GetHerHis] biểu đạt nhiều điều, ngay cả khi không nói gì?"
  yearly.1070.emotional.desc:0 "bản năng cảm xúc hoang dã?"
  yearly.1070.levelheaded.desc:0 "sự điềm tĩnh và kiên định của [potential_soulmate.GetHerHis]?"
  yearly.1070.intelligent.desc:0 "sự sắc bén trong trí tuệ của [potential_soulmate.GetHerHis]?"
  yearly.1070.fair.desc:0 "nét mặt cân đối của [potential_soulmate.GetHerHis]?"
  yearly.1070.handsome.desc:0 "nét mặt oai phong của [potential_soulmate.GetHerHis]?"
  yearly.1070.zealous.desc:0 "sự tận tâm kiên định của [potential_soulmate.GetHerHis] với [ROOT.Char.GetFaith.HighGodName]?"
  yearly.1070.fallback.desc:0 "đôi mắt tuyệt đẹp của [potential_soulmate.GetHerHis]?"
  yearly.1070.end.desc:0 "\n\nTa không thể chỉ rõ điều gì, nhưng ít nhất biết chắc một điều: khi ở bên [potential_soulmate.GetHerHis], ta khó lòng tập trung vào điều khác."
  yearly.1070.a:0 "Ta sẽ bày tỏ tình yêu bất diệt với [potential_soulmate.GetHerHim]!"
  yearly.1070.b:0 "Khát khao này không xuất phát từ trái tim..."
  yearly.1070.c:0 "Ta sẽ viết cho [potential_soulmate.GetHerHim] một bài thơ nhỏ."
  yearly.1070.d:0 "Ta từ chối bị phân tâm bởi bất kỳ [potential_soulmate.GetWomanMan] nào!"
  yearly.1070.scheme.tt:0 "[scheme|E] sẽ có [success_chance|E] cộng thêm"

 ### YOU ARE BEING PARANOID ###
  yearly.1080.t:0 "Một Nghi Ngờ Kéo Dài"
  yearly.1080.normal.desc:0 "Có điều gì đó lạ ở [suspicious.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], nhưng ta không thể nhận ra. Có lẽ chỉ là tưởng tượng — nhưng cảm giác báo hiệu xấu này khiến ta mất ngủ."
  yearly.1080.paranoid.desc:0 "[suspicious.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suspicious'))] [suspicious.GetTitledFirstName] đang toan tính gì đó, ta biết! Nếu không sao [suspicious.GetSheHe] lén lút, nhìn ta một cách kỳ lạ? Và đồ đạc không còn nơi ta để! [suspicious.GetSheHe] đã vào [ROOT.Char.Custom('GetChamber')] của ta?!\n\n[suspicious.GetSheHe|U] cười thật ngọt, nhưng ta biết gì đang ẩn sau!"
  yearly.1080.a.friend:0 "Người Ngài đáng tin cậy [investigator.GetFirstNameNoTooltip] phải điều tra."
  yearly.1080.a.spymaster:0 "Trưởng tình báo [investigator.GetFirstNameNoTooltip] phải điều tra."
  yearly.1080.a.success:0 "Cuộc điều tra của [investigator.GetTitledFirstNamePossessiveNoTooltip] thành công"
  yearly.1080.a.success.tt:0 "Nếu [suspicious.GetShortUIName] giấu điều gì, nó sẽ được phát hiện"
  yearly.1080.a.failure:0 "Cuộc điều tra của [investigator.GetTitledFirstNamePossessiveNoTooltip] thất bại"
  yearly.1080.b:0 "Ta sẽ xem xét ngay."
  yearly.1080.b.success:0 "Cuộc điều tra của ngươi thành công"
  yearly.1080.b.failure:0 "Cuộc điều tra của ngươi thất bại"
  yearly.1080.c:0 ""Chuyện gì đang xảy ra, [suspicious.GetFirstNameNoTooltip]? Nói sự thật!""
  yearly.1080.c.success:0 "[suspicious.GetFirstNameNoTooltip] nói thật"
  yearly.1080.c.failure:0 "[suspicious.GetFirstNameNoTooltip] chối mọi thứ"
  yearly.1080.d:0 "Ta đang hoang tưởng..."
  yearly.1080.c.lunatic:0 "[suspicious.GetFirstNameNoTooltip] xoa dịu nỗi sợ của ngươi"

 # Paranoid investigation: discovery
  yearly.1081.investigator_start.desc:0 "[investigator.GetTitledFirstName] đã phát hiện bằng chứng không thể chối cãi về tội lỗi của [suspicious.GetTitledFirstNamePossessive]."
  yearly.1081.you_start.desc:0 "Trong quá trình điều tra, ta đã phát hiện bằng chứng không thể chối cãi về tội lỗi của [suspicious.GetTitledFirstNamePossessive]."
  yearly.1081.murder.desc:0 "[suspicious.GetSheHe|U] đã âm mưu giết người"
  yearly.1081.abduct.desc:0 "[suspicious.GetSheHe|U] đã âm mưu bắt cóc"
  yearly.1081.seduce.desc:0 "[suspicious.GetSheHe|U] đã âm mưu quyến rũ"
  yearly.1081.elope.desc:0 "[suspicious.GetSheHe|U] đã âm mưu bỏ trốn cùng"
  yearly.1081.scheme_type_fallback.desc:0 "[suspicious.GetSheHe|U] đã âm mưu chống lại"
  yearly.1081.me.desc:0 "ta!"
  yearly.1081.my_introduction.desc:0 "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"

  yearly.1081.agent_murder.desc:0 "[suspicious.GetSheHe|U] đang làm việc cho người âm mưu giết"
  yearly.1081.agent_abduct.desc:0 "[suspicious.GetSheHe|U] đang làm việc cho người âm mưu bắt cóc"
  yearly.1081.agent_seduce.desc:0 "[suspicious.GetSheHe|U] đang làm việc cho người âm mưu quyến rũ"
  yearly.1081.agent_elope.desc:0 "[suspicious.GetSheHe|U] đang làm việc cho người âm mưu bỏ trốn cùng"
  yearly.1081.agent_scheme_type_fallback.desc:0 "[suspicious.GetSheHe|U] đang làm việc cho người âm mưu chống lại"

  yearly.1081.traitor_end.desc:0 "\n\nTên phản tặc [suspicious.Custom2('InsultAdjective', ROOT.Char)] đó sẽ phải nhận những gì [suspicious.GetSheHe] đáng phải nhận!"
  yearly.1081.useful_end.desc:0 "\n\nTên [suspicious.Custom2('InsultNoun', ROOT.Char)] ranh mãnh đó! Thông tin này chắc chắn sẽ hữu ích."
  yearly.1081.secret.desc:0 "[suspicious.GetSheHe|U] [guilty_owned_secret.Custom('SecretDescriptionThirdPerson')]!"
  yearly.1081.a:0 "Ta biết rồi!"

 # Paranoid investigation: innocent
  yearly.1082.investigator_start.desc:0 "[investigator.GetTitledFirstName] đã kết thúc cuộc điều tra của [investigator.GetHerHis] về các hoạt động của [suspicious.GetTitledFirstNamePossessive] với đôi bàn tay trắng. [investigator.GetSheHe|U] không tìm thấy bằng chứng nào về hoạt động tội phạm hay các hành vi đen tối khác — thậm chí không có cả những tin đồn đáng nghi."
  yearly.1082.you_start.desc:0 "Ta đã ẩn mình trong bóng tối, đến những quán rượu mờ ám và lật từng tảng đá — nhưng không tìm thấy bằng chứng kết tội [suspicious.GetTitledFirstName]. Thậm chí không có tin đồn khả nghi nào!"
  yearly.1082.normal.desc:0 "\n\nDường như lần này ta đã nhầm, nhưng không phí công. Đêm nay, ta sẽ ngủ như trẻ thơ."
  yearly.1082.paranoid.desc:0 "\n\n[suspicious.GetFirstNameNoTooltip] có thể vô tội lần này, nhưng vẫn có điều gì đó ở [suspicious.GetHerHim] khiến ta cảm thấy không thoải mái. Ta sẽ tiếp tục để mắt đến [suspicious.GetHerHim], chắc chắn là như vậy rồi."
  yearly.1082.a:0 "Thà cẩn thận còn hơn hối hận!"
  yearly.1082.a.tt:0 "[suspicious.GetShortUIName|U] dường như vô tội"

 # Paranoid investigation: failure
  yearly.1083.investigator_start.desc:0 "[investigator.GetTitledFirstName] trở về tay trắng. 'Ta không tìm thấy bằng chứng nào kết tội [suspicious.GetTitledFirstName], và có lẽ [suspicious.GetSheHe] thực sự vô tội. Nhưng ta không thể đảm bảo — [suspicious.GetSheHe] là một [suspicious.GetWomanMan] cẩn trọng. [investigator.GetFaith.HighGodName|U] biết [suspicious.GetSheHe] có thể đang giấu gì.'"
  yearly.1083.you_start.desc:0 "Cuộc điều tra của ta về [suspicious.GetTitledFirstName] không phát hiện điều gì đáng kể, ngoại trừ việc [suspicious.GetSheHe] là một [suspicious.GetWomanMan] cực kỳ cẩn trọng. [ROOT.Char.GetFaith.HighGodName|U] biết [suspicious.GetSheHe] có thể đang giấu gì."
  yearly.1083.a:0 "Ta sẽ để mắt tới [suspicious.GetHerHim], chắc chắn rồi."
  yearly.1083.a.tt:0 "Cuộc điều tra về [suspicious.GetShortUIName] thất bại"

 # Paranoid confrontation: confession
  yearly.1084.start.desc:0 "Các lính canh giữ khoảng cách với [suspicious.GetTitledFirstName], nhưng sẵn sàng trấn áp [suspicious.GetHerHim] bất cứ lúc nào. [suspicious.GetSheHe|U] dường như biết rõ; ánh mắt [suspicious.GetHerHis] liếc quanh [ROOT.Char.Custom('GetRoom')] một cách lo lắng. Có lẽ đang tìm lối thoát?\n\nTa không cần phải cố gắng nhiều để có lời thú tội."
  yearly.1084.a:0 "Quẳng [suspicious.GetHerHim] vào [ROOT.Char.Custom('GetDungeon')]!"
  yearly.1084.b:0 "Biến khỏi mắt ta, tên [suspicious.Custom2('InsultNoun', ROOT.Char)] phản bội!"

 # Paranoid confrontation: denial
  yearly.1085.start.desc:1 "Các lính canh giữ khoảng cách với [suspicious.GetTitledFirstName], nhưng sẵn sàng trấn áp [suspicious.GetHerHim] bất cứ lúc nào. [suspicious.GetSheHe|U] tỏ ra cảnh giác; có một căng thẳng bất thường ở vai [suspicious.GetHerHis].\n\n'Ngươi triệu ta đến đây vì lý do gì, [ROOT.Char.Custom2('RelationToMeAddress', suspicious)]? Có điều gì muốn hỏi ta sao?'\n\nLời buộc tội trào ra khỏi miệng ta như nọc độc, nhưng khi nhìn gương mặt [suspicious.GetFirstNamePossessiveNoTooltip], ta nghi ngờ. Đây không phải là tội lỗi,"
  yearly.1085.angry.desc:0 "mà là cơn giận.\n\n'Ngươi dám buộc tội ta như vậy sao? Sau tất cả những gì ta đã làm cho ngươi!'"
  yearly.1085.sad.desc:0 "mà là nỗi buồn.\n\n'Ta luôn là người hầu trung thành của ngươi,' [suspicious.GetSheHe] khóc. 'Ta sẽ không bao giờ phản bội ngươi!'"
  yearly.1085.a:0 "Ngươi có thể đi."
  yearly.1085.b:0 "Ta đã nhầm. Ngươi nhận được lời xin lỗi chân thành của ta, [suspicious.GetFirstNameNoTooltip]."
  yearly.1085.c:0 "#EMP Dối trá!#! Lính canh, quẳng [suspicious.GetHerHim] vào [ROOT.Char.Custom('GetDungeon')]!"

 # Paranoid confrontation: soothe
  yearly.1086.desc:0 "Ta đã có một kế hoạch, một bài diễn thuyết chuẩn bị kỹ lưỡng. Nhưng khi thấy [suspicious.GetTitledFirstName], máu ta sôi lên, và lời buộc tội trào ra khỏi miệng như nọc độc. Ngạc nhiên thay, [suspicious.GetFirstNameNoTooltip] không phản ứng bằng giận dữ hay nước mắt.\n\n'Ôi, [ROOT.Char.Custom('ComplimentAdjective')] [suspicious.Custom2('RelationToMeShort', ROOT.Char)], ta biết ngươi đang chịu đựng. Những lời cay nghiệt này không phải của ngươi. Ta sẽ trả lời mọi câu hỏi, và ngươi sẽ thấy không có gì phải sợ ta.'"
  yearly.1086.a:0 "Ta… ta không biết phải nói gì."

  yearly.1090.t:0 "Xa Nhà"
  yearly.1090.start.desc:0 "Một người lạ được dẫn đến trước mặt ta. "Kẻ [traveler.GetSheHe|U] này đã chờ đợi bên ngoài cổng vùng [ROOT.Char.Custom('ResidenceBuilding')] suốt một tuần rồi, thưa minh chủ," lính gác báo cáo với ta.\n\nKẻ [traveler.GetWomanMan] cúi đầu cung kính. "Tên thảo dân là [traveler.GetFirstName], thưa [ROOT.Char.Custom('FormOfAddressForLiege')]. Thảo dân đã đi đây đi đó bôn ba khắp nơi, và chứng kiến nhiều điều, nhưng"
  yearly.1090.family_member.desc:0 "Người [traveler.Custom2('RelationToMeShort', SCOPE.sC('traveler_family_1'))] của ta [traveler_family_1.GetFistName] và ta đều mệt mỏi với chuyến đi."
  yearly.1090.family.desc:0 "Gia đình ta và ta đều mệt mỏi với chuyến đi."
  yearly.1090.alone.desc:0 "Ta mệt mỏi với chuyến đi."
  yearly.1090.family_stay.desc:0 "Nếu ngươi cho phép chúng ta ở lại, ta sẽ vui lòng chia sẻ kiến thức về thế giới và làm người hầu trung thành của ngươi."
  yearly.1090.alone_stay.desc:0 "Nếu ngươi cho phép ta ở lại, ta sẽ vui lòng chia sẻ kiến thức về thế giới và làm người hầu trung thành của ngươi."
  yearly.1090.a:0 "Hãy đón nhận [ROOT.Char.GetFaith.HighGodName], và nơi này sẽ là nhà ngươi."
  yearly.1090.b:0 "Càng đông càng vui!"
  yearly.1090.c:0 "Chúng ta không có chỗ cho kẻ như ngươi."
  yearly.1090.travelers_family:0 "[traveler.GetShortUIName|U] và gia đình [traveler.GetHerHis]"
  yearly_1090_add_courtier_effect.tt:0 "Trở thành [courtier|E] của ngươi"
