l_english:
  yearly.9100.t:0 "Rắc Rối Trong Vườn"
  yearly.9100.desc:0 "Ngay khi ta vừa bước vào ngự uyển, ta còn chưa kịp tiến một bước nào thì đã nghe thấy tiếng ai đó đang chửi thề tục tĩu. "#EMP [gardener.Custom('CulturalCurse')|U]!#!"\n\nTa đi vòng qua một bờ giậu để tìm kiếm nguồn gốc âm thanh và bắt gặp người làm vườn của mình, [gardener.GetTitledFirstName], đang cặm cụi làm việc dưới đất với một vẻ mặt cau có hiện rõ trên khuôn mặt của [gardener.GetHerHis]. [gardener.GetSheHe|U] nhận thấy ta tiến lại gần và nhanh chóng đứng thẳng dậy trên đôi chân của [gardener.GetHerHis].\n\n"Oh! Forgive me, [ROOT.Char.Custom('FormOfAddressForLiege')]. I did not expect anyone else to be out here... Some stupid animal, a [gardener.Custom('GetAnimalType')] no doubt, has ruined #EMP all#! of my recent work! I planted these herbs only the day before yesterday!""
  yearly.9100.a:0 "Để Ta giúp!"
  yearly.9100.b:0 "Đây là chút quà cho công sức của Ngài!"
  yearly.9100.c:0 "Thật #EMP không may#! … Nhưng đừng dừng lại vì Ta!"
  yearly.9100.a.tooltip_a:0 "Ngài học được nhiều về làm vườn"
  yearly.9100.a.tooltip_b:0 "Ngài làm tình huống còn tệ hơn"
  yearly.9100.a.success:0 "Ta đã học được về làm vườn!"
  yearly.9100.a.failure:0 "Làm vườn thật lãng phí thời gian!"
 
  yearly.9110.t:0 "Kẻ Trộm Hoa"
  yearly.9110.desc:1 "Người làm vườn của Ta, [gardener.GetTitledFirstName], lao vào phòng hội đồng và tiến thẳng tới [romantic_councillor.GetCouncilTitle] của Ta, [romantic_councillor.GetTitledFirstName], đầy giận dữ.\n\n'Ngươi #EMP dám#! phá vườn của [ROOT.Char.GetTitleTierNamePossessive] sao?! Bằng cách #EMP lấy trộm#! những bông hoa quý hiếm nữa chứ!'\n\n[romantic_councillor.GetFirstNameNoTooltip] rõ ràng không bận tâm tới cơn giận của người làm vườn. 'Ta nghĩ chúng sẽ là món quà hoàn hảo cho [councillor_spouse.GetWifeHusband] của Ta. Là một người lãng mạn thì có tội sao?'"
  yearly.9110.a:0 "Nhưng phá vườn của Ta thì có. Ngươi sẽ phải bồi thường. Ngay bây giờ."
  yearly.9110.b:0 "Ngươi hành xử quá đáng, [gardener.GetFirstNameNoTooltip]!"
  yearly.9110.c:0 "Những bông hoa đó thực sự là món quà tuyệt vời… Cho #EMP Ta#! [spouse.GetWifeHusband]."
  yearly.9110.d:0 "Ta #EMP không#! muốn dính líu! Tự giải quyết đi."
 
  yearly.9120.t:0 "Người Buôn Hạt Giống"
  yearly.9120.desc:0 "Chợ ở [barony_market.GetName] khá đông, và một thương nhân đặc biệt thu hút ánh nhìn của Ta. [seed_merchant.GetSheHe|U] dường như chỉ bán những hộp nhỏ xíu. Nhận thấy sự tò mò của Ta, [seed_merchant.GetSheHe] ra hiệu mời Ta lại gần.\n\n'Quan tâm tới thứ gì đặc biệt, [ROOT.Char.Custom('FormOfAddressForLiege')]? Nhìn này, tất cả những hộp nhỏ này đều chứa các loại hạt khác nhau. Một số sẽ mọc thành hoa rực rỡ, số khác thành thảo dược. Ta thậm chí còn có loại độc hiếm nếu Ngài muốn thử?'"
  yearly.9120.a:0 "Cho Ta loại độc… Dĩ nhiên là để nghiên cứu."
  yearly.9120.b:0 "Hoa kỳ lạ chắc chắn sẽ làm vườn của Ta thật ấn tượng!"
  yearly.9120.c:0 "Thảo dược luôn hữu dụng. Ta lấy những cái này."
  yearly.9120.d:0 "Cho #EMP những#! giá cắt cổ này à?! Không đời nào!"
