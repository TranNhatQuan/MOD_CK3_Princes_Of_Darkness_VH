l_english:
  death_management.1000.killed.tt:1 "[dead_character.GetTitledFirstName] đã bị [killer.GetTitledFirstName] giết."
  death_management.1000.t:0 "Cho Đến Khi Cái Chết Chia Lìa Chúng Ta"
  death_management.1000.murder:0 "[dead_character.GetTitledFirstName] đã bị sát hại!\n\n"
  death_management.1000.plaguestart: "Bệnh tật và dịch họa tiếp tục cuộc hành trình kinh hoàng của chúng qua [realm.GetNameNoTier], quật ngã cả kẻ quyền quý lẫn thường dân. Sự thật tàn nhẫn và vô tình ấy hiếm khi phơi bày rõ ràng, trừ những lúc như thế này.\n\n"
  death_management.1000.plaguespouse: "Ta chỉ có thể lặng lẽ đứng nhìn khi các thầy thuốc rời khỏi thi thể của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] của ta. Ta tiến lại gần, đưa tay nắm lấy tay [dead_character.GetHerHis]. Nó vẫn còn ấm.\n\n"
  death_management.1000.like:0 "Làm sao trái tim có thể chịu đựng nỗi đau này mà không vỡ tan? Điều đó không thể nào! Vậy mà ta vẫn ở đây, tim ta vẫn đập trong khi tim ngươi đã lặng im. Ôi, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] của ta. Cuộc đời sẽ không còn như trước nếu thiếu ngươi."
  death_management.1000.neutral:0 "[dead_character.GetFirstName] thân mến của ta. Có lẽ ta chưa từng yêu ngươi, nhưng cái chết của ngươi khiến ta đau lòng hơn ta từng nghĩ. Ngươi luôn ở đó, người bạn đồng hành quen thuộc của ta. Phải chăng ta đã coi điều đó là hiển nhiên? Có quá nhiều điều ta chưa từng nói..."
  death_management.1000.dislike:0 "[dead_character.GetFirstName|U], khi ngươi trút hơi thở cuối cùng, ta cảm thấy nhẹ nhõm tràn ngập. Có lẽ ta nên xấu hổ, nhưng sự thật là giữa chúng ta chẳng có chút tình cảm nào. Cuối cùng ta cũng được tự do bắt đầu lại cuộc đời!"
  death_management.1000.murder_wedding:0 "À, một cái chết hoàn toàn bất ngờ. Hoàn toàn không hề được sắp đặt. Không ai có thể đoán trước!"
  death_management.1000.a:0 "Ít ra ký ức vẫn còn."
  death_management.1000.b:0 "Ta mong ngươi tìm được yên nghỉ, [dead_character.GetFirstNameNoTooltip]."
  death_management.1000.c:0 "Không sớm hơn một ngày nào!"
  death_management.1000.tt:1 "Phối ngẫu của ngươi, [dead_character.GetTitledFirstName], đã [dead_character.GetDeathReasonHideKiller]."

  death_management.1001.t:0 "Sống Lâu Hơn Con Mình"
  death_management.1001.murder:0 "[dead_character.GetTitledFirstName] đã bị sát hại!\n\n"
  death_management.1001.tt:1 "[THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] của ngươi, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
  death_management.1001.plaguechild: "Dạ dày ta quặn thắt trong nỗi đau câm lặng khi thi thể của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] của ta, [dead_character.GetFirstName], được khiêng đi ngang qua. Các thầy thuốc và lương y đã làm việc từ bình minh đến hoàng hôn để cứu [dead_character.GetHerHim], nhưng vẻ mặt ảm đạm của họ đã nói lên tất cả.\n\nCòn quá trẻ, đầy hứa hẹn. Vậy mà vẫn phải chết như thế.\n\n[ROOT.Char.GetFaith.HighGodName] xin hãy cứu rỗi chúng con."
  death_management.1001.child:0 "Ta đã đặt biết bao hy vọng nơi con, đứa con yêu dấu nhất của ta. Bao điều con sẽ học, sẽ trải nghiệm và sẽ làm. Một cuộc đời dài với vô vàn khả năng. Có lẽ một ngày nào đó con cũng sẽ có con cái của riêng mình. Nhưng giờ đây, tất cả sẽ không bao giờ xảy ra nữa..."
  death_management.1001.like:0 "Ôi [ROOT.Char.GetFaith.HighGodName], sao ngài có thể làm điều này với [dead_character.GetFirstName]? Nếu ta đã phạm tội, sao ngài không trừng phạt ta thay vì vậy? [dead_character.GetSheHe|U] vô tội, [dead_character.Custom('GetDaughterSon')] hoàn hảo của ta! Cuộc đời vẫn còn quá nhiều điều dành cho [dead_character.GetHerHim]..."
  death_management.1001.neutral:0 "Ta tưởng mình đã quá già để còn ngạc nhiên trước sự tàn nhẫn của thế gian này, vậy mà ta chưa từng nghĩ mình sẽ phải chứng kiến cái chết của chính [dead_character.Custom('GetDaughterSon')] của mình. Ta chỉ hy vọng rằng giờ đây [dead_character.GetSheHe] đã được giải thoát khỏi những đau khổ mà ta phải chịu đựng..."
  death_management.1001.dislike:0 "Chẳng phải là bổn phận của một [ROOT.Char.Custom('MotherFather')] khi yêu thương những đứa con [ROOT.Char.GetHerHis] của mình sao? Tuy nhiên, ta không thể tự mình khóc thương cho sự ra đi [dead_character.GetFirstNamePossessive] của nó. Đâu đó trên đường đời, ta đã sai lầm, buộc [dead_character.GetHerHim] phải đi theo một con đường mà ta không bao giờ có thể chấp nhận. Dù ta có thể đáng trách vì người mà [dead_character.GetSheHe] đã trở thành, nhưng giờ mọi thứ đã là quá khứ. Cuối cùng thì cũng xong."
  death_management.1001.a:0 "[dead_character.GetSheHe|U] không đáng phải chịu điều này."
  death_management.1001.c:0 "Hối hận cũng đã quá muộn."
  death_management.1001.d:0 "Hãy yên nghỉ, [dead_character.GetFirstNameNoTooltip] bé nhỏ."

  death_management.1004.t:0 "Khoảng Trống Bỏ Lại"
  death_management.1004.desc:0 "Có một sự hiện diện trên giường của ta, rõ rệt như khi thân thể ngươi từng ôm lấy ta. Nhưng sự hiện diện ấy không phải là ngươi, [dead_character.GetFirstName], mà là tất cả nỗi khát khao và đau đớn ngươi để lại. Ban ngày ta khiến mình bận rộn, nhưng ở đây, nơi ký ức sống động đến vậy, ta không thể trốn tránh."
  death_management.1004.a:0 "Liệu nỗi đau này có bao giờ phai nhạt?"
  death_management.1004.a.tt:1 "Người tình của ngươi, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
  death_management.lover.desc:1 "Người tình của ngươi, [dead_character.GetTitledFirstName], đã qua đời."

  death_management.1005.t:0 "Ký Ức Vẫn Còn"
  death_management.1005.desc:0 "Ôi, [dead_character.GetFirstName]. Nếu ngươi còn ở đây, ta biết ngươi sẽ bảo ta phải mạnh mẽ. Rằng mọi chuyện rồi sẽ tốt hơn. Và ngươi sẽ đúng, như mọi khi, nhưng trước hết ta phải nguyền rủa và khóc than. Làm sao ta có thể không làm vậy khi ngươi đã rời khỏi thế gian này?"
  death_management.1005.desc.ritual_best_friend:0 "[dead_character.GetFirstName] đã chết! Người bạn thân thiết nhất và chân thật nhất của ta đã bị hạ gục, bị cái ôm lạnh lẽo của [ROOT.Char.GetFaith.DeathDeityName] tước đi trước thời hạn [dead_character.GetHerHis] của ngài. Ta khóc, ta than vãn, ta bứt tóc và xé áo, nhưng ta biết ta sẽ không bao giờ được nhìn thấy [dead_character.GetHerHim] nữa.\n\nLàm thế nào... làm sao ta có thể tiếp tục sống đây?\n\n[dead_character.GetFirstNameNoTooltip], người bạn thân yêu, [dead_character.GetFirstNameNoTooltip] ngọt ngào sẽ muốn ta tiếp tục, và ta phải hy vọng rằng ký ức về [dead_character.GetHerHis] sẽ duy trì ta qua những thời điểm đen tối này, nhưng cuộc sống dường như giống như một cây nến không có ngọn lửa khi thiếu [dead_character.GetHerHim]."
  death_management.1005.a:0 "Ngươi sẽ không bao giờ bị lãng quên, bằng hữu cũ."
  death_management.1005.a.tt:3 "Bằng hữu của ngươi, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
  death_management.friend.desc:4 "Bằng hữu của ngươi, [dead_character.GetTitledFirstName], đã qua đời."

  death_management.1007.t:0 "Bước Ngoặt Của Số Mệnh"
  death_management.1007.start_murder:1 "[dead_character.GetTitledFirstName] đã bị sát hại!"
  death_management.1007.start:3 "Hôm nay, với cái chết của [dead_character.GetTitledFirstName], tương lai của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] đã rẽ sang một hướng khác."
  death_management.1007.same_or_higher_tier:0 "Chúng ta sẽ không bao giờ biết liệu triều đại của [dead_character.GetHerHis] có thể thống nhất các vùng đất của chúng ta hay không,"
  death_management.1007.mytitle:2 "Chúng ta sẽ không bao giờ biết [dead_character.GetSheHe] sẽ trở thành một [ROOT.Char.GetTitleTierName] như thế nào,"
  death_management.1007.ruler:1 "Chúng ta sẽ không bao giờ biết [dead_character.GetSheHe] sẽ trở thành một vị quân chủ như thế nào,"
  death_management.1007.end:4 "hay cái chết của [dead_character.GetHerHis] là phúc lành hay tai họa đối với [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] này."
  death_management.1007.a:0 "Một câu chuyện kết thúc, và câu chuyện khác bắt đầu."
  death_management.1007.a.tt:1 "Người thừa kế của ngươi, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."

  death_management.1006.t:0 "Lời Nguyền Đã Tan"
  death_management.1006.desc:0 "Những bước ngoặt của số phận không phải lúc nào cũng có lợi cho ta – [ROOT.Char.GetFaith.HighGodName] biết rằng ta đã bị nguyền rủa vào ngày ta gặp [dead_character.GetTitledFirstName].\n\nTuy nhiên, hôm nay, lời nguyền đó đã được dỡ bỏ! Số phận đã mỉm cười với ta và đưa kẻ [dead_character.Custom2('InsultAdjective', ROOT.Char)] [dead_character.Custom2('InsultNoun', ROOT.Char)] đó vào nấm mồ [dead_character.GetHerHis] của hắn!"
  death_management.1006.a.tt:1 "[rival|E] của ngươi, [dead_character.GetFullName], [dead_character.GetDeathReasonHideKiller]."

  death_management.parent.desc:2 "[dead_character.Custom('MotherFather')] của ngài, [dead_character.GetFullName], [dead_character.GetDeathReason]."

  death_management.sibling.desc:2 "[dead_character.Custom('SisterBrother')] của ngài, [dead_character.GetFullName], [dead_character.GetDeathReason]."

  death_management.betrothed.desc:2 "Hôn ước của ngài, [dead_character.GetFullName], [dead_character.GetDeathReason]."

  death_management.liege_councillor.desc:2 "Cố vấn của ngài, [dead_character.GetFullName], [dead_character.GetDeathReason]."

  death_management.liege.desc:2 "Chư hầu của ngài, [dead_character.GetFullName], [dead_character.GetDeathReason]."

  death_management.pinned.desc:2 "Người mà ngài lưu tâm, [dead_character.GetFullName], [dead_character.GetDeathReason]."

  death_management.elder.desc:0 "Trưởng bối của ngài, [deceased_elder.GetFullName], [deceased_elder.GetDeathReason]."

  death_management.1008.desc:0 "[dead_character.GetTitledFirstName], phối ngẫu của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse_of_dead_character'))] của ta là [spouse_of_dead_character.GetFirstName], đã qua đời. Mọi kế hoạch được chuẩn bị cẩn thận đều đã bị ý muốn thất thường của [ROOT.Char.GetFaith.DeathDeityNamePossessive] nghiền nát, dù những lời than phiền như vậy có vẻ nhỏ nhoi so với nỗi đau của gia đình [dead_character.GetHerHis]..."
  death_management.1008.a:0 "Hãy yên nghỉ."
  death_management.1008.a.tt:1 "Phối ngẫu của [spouse_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."
  death_management.spouse_child.desc:1 "Phối ngẫu của người thừa kế của ngươi là [spouse_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."

  death_management.1009.t:0 "Bi Kịch Không Lường Trước"
  death_management.1009.desc:1 "[dead_character.GetTitledFirstName], người đã đính hôn với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('betrothed_of_dead_character'))] của ta là [betrothed_of_dead_character.GetFirstName], đã qua đời. Mọi kế hoạch được chuẩn bị cẩn thận đều đã bị ý muốn thất thường của [ROOT.Char.GetFaith.DeathDeityNamePossessive] nghiền nát, dù những lời than phiền như vậy có vẻ nhỏ nhoi so với nỗi đau của gia đình [dead_character.GetHerHis]..."
  death_management.1009.a:0 "Hãy yên nghỉ, đứa trẻ."
  death_management.1009.a.tt:0 "Người đã đính hôn với [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], đã [THIS.Char.Custom('DiedHouse_arrest')] và hôn ước bị hủy bỏ."
  death_management.betrothed_child.desc:2 "Người đã đính hôn với [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."

  death_management.1010.t:0 "Không Còn Bài Học Nào Nữa"
  death_management.1010.murderer:0 "Khi tin [dead_character.GetTitledFirstName] đã qua đời lan khắp hành lang, ta phải cố gắng giữ cho gương mặt mình không lộ cảm xúc.\n\nChỉ khi ta ngồi trong cỗ xe trở về nhà, mọi thứ mới thật sự thấm vào tâm trí... [dead_character.GetSheHe] đã ra đi."
  death_management.1010.under_12:0 "Mọi chuyện diễn ra như trong sương mù — từ việc [dead_character.GetTitledFirstName] không gọi ta đến học như thường lệ vào một buổi sáng, cho đến giờ đây, khi ta ngồi trong cỗ xe trở về nhà.\n\nKhi ta hỏi vì sao [dead_character.GetFirstName] không ra tiễn, những lời thì thầm xung quanh dần khiến ta hiểu rằng ta sẽ không bao giờ gặp lại [dead_character.GetHerHim] nữa."
  death_management.1010.12_or_over:0 "Họ báo tin cho ta khi ta đang chuẩn bị cho buổi học, và ta không còn biết phải làm gì với bản thân nữa. Thầy của ta, [dead_character.GetTitledFirstName], đã qua đời.\n\nNgay cả khi ta đang trên đường trở về, cảm giác thật kỳ lạ khi biết rằng ta sẽ không bao giờ gặp lại [dead_character.GetHerHim] nữa."
  death_management.1010.under_12_liked_educator:0 "Ta ước gì [dead_character.GetSheHe] ít nhất cũng nói lời tạm biệt."
  death_management.1010.under_12_disliked_educator:0 "Dù sao ta cũng muốn một người thầy mới!"
  death_management.1010.over_12_liked_educator:0 "Ngài đã dạy ta rất nhiều, [dead_character.GetFirstName]."
  death_management.1010.over_12_disliked_educator:0 "Cuối cùng cũng xong chuyện."
  death_management.1010.a.tt:1 "Với cái chết của [dead_character.GetTitledFirstName], ngươi không còn được dạy dỗ nữa."

  death_management.educator.desc:2 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ward_of_dead_character'))] của ngươi là [ward_of_dead_character.GetTitledFirstNamePossessive], người thầy [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."

  death_management.2000.t:0 "Cho Đến Khi [prison_holder.GetFirstNameNoTooltip] Chia Lìa Chúng Ta"
  death_management.2000.t.root_killer:0 "Cho Đến Khi Ta Chia Lìa Chúng Ta"
  death_management.2000.t.no_killer:0 "Bị Xé Lìa"
  death_management.2000.murderer:0 "Ôi, [dead_character.GetFirstName], cuộc đời lẽ ra có thể còn dài hơn bên nhau, nhưng mọi chuyện phải kết thúc như thế này.\n\nTa không vui vẻ gì khi tay mình nhuốm máu ngươi, nhưng ta biết rằng nếu ngươi có thể nói, ngươi hẳn sẽ muốn ta tiếp tục sống và tìm lấy hạnh phúc."
  death_management.2000.like:0 "Làm sao trái tim có thể chịu đựng nỗi đau này mà không vỡ tan? Điều đó không thể nào! Vậy mà ta vẫn ở đây, tim ta vẫn đập trong khi tim ngươi đã lặng im.\n\nÔi, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] của ta."
  death_management.2000.like_end_killer:0 "Ta không thể xóa khỏi đầu hình ảnh [prison_holder.GetTitledFirstName] kết liễu mạng sống của ngươi."
  death_management.2000.like_end:0 "Ta không thể xóa khỏi đầu hình ảnh ngươi dần lụi tàn, bị giam cầm trong ngục tối của [prison_holder.GetTitledFirstNamePossessive]."
  death_management.2000.neutral:0 "[dead_character.GetFirstName] thân mến của ta. Có lẽ ta chưa từng yêu ngươi, nhưng cái chết của ngươi khiến ta đau lòng hơn ta từng nghĩ. Ngươi luôn ở đó, người bạn đồng hành quen thuộc của ta."
  death_management.2000.neutral_end_killer:0 "Chỉ nghĩ rằng [prison_holder.GetTitledFirstName] lại có thể cướp ngươi khỏi ta theo cách bạo lực như vậy..."
  death_management.2000.neutral_end:0 "Chỉ nghĩ rằng ngươi lại chết trong ngục tối của [prison_holder.GetTitledFirstNamePossessive]..."
  death_management.2000.dislike:0 "[dead_character.GetWifeHusband|U], khi ngươi trút hơi thở cuối cùng, sự nhẹ nhõm cùng cơn giận dâng lên trong ta. Có lẽ ta nên xấu hổ, nhưng sự thật là giữa chúng ta chẳng có chút tình cảm nào."
  death_management.2000.dislike_end_killer:0 "Tuy nhiên, việc ngươi chết dưới tay một [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] như [prison_holder.GetTitledFirstName] thật là một sự sỉ nhục..."
  death_management.2000.dislike_end_unknown_killer:1 "Tuy nhiên, việc ngươi chết dưới tay một kẻ sát nhân..."
  death_management.2000.dislike_end_no_killer:0 "$death_management.2000.dislike_end$"
  death_management.2000.dislike_end:0 "Tuy nhiên, việc ngươi chết trong ngục tối của một [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] như [prison_holder.GetFirstName] thật là một sự sỉ nhục..."
  death_management.2000.a:0 "Một [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] như vậy mà lại có thể cướp ngươi khỏi ta..."
  death_management.2000.b:0 "Đó là một tội ác không thể tha thứ!"
  death_management.2000.c:0 "Không thể tha thứ!"
  death_management.2000.d:0 "Một cái chết thật thê thảm..."
  death_management.2000.tt:1 "Phối ngẫu của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của [prison_holder.GetTitledFirstName]."

  death_management.2007.t:0 "Bước Ngoặt Của Số Mệnh"
  death_management.2007.start:1 "Hôm nay, với cái chết của [dead_character.GetTitledFirstName] trong ngục tối của [prison_holder.GetTitledFirstName], tương lai của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] đã rẽ sang một hướng khác. Chúng ta sẽ không bao giờ biết"
  death_management.2007.mytitle:1 "[ROOT.Char.GetTitleTierName]"
  death_management.2007.ruler:0 "vị quân chủ"
  death_management.2007.end:1 "[dead_character.GetSheHe] sẽ trở thành như thế nào, hay cái chết của [dead_character.GetHerHis] là phúc lành hay tai họa đối với [ROOT.Char.GetPrimaryTitle.GetType.GetName] này.\n\nĐiều ta biết là [prison_holder.GetFirstName] sẽ phải trả giá cho tội ác của [prison_holder.GetHerHis]."
  death_management.2007.a:0 "[prison_holder.GetSheHe|U] đã phạm phải một tội lỗi không thể tha thứ."
  death_management.2007.a.tt:1 "Người thừa kế của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của [prison_holder.GetTitledFirstName]"
  death_management.2007.a.new_heir.tt:1 "[new_heir.GetTitledFirstName] là người thừa kế mới của ngươi"

  death_management.2001.t:0 "Sống Lâu Hơn Con Mình"
  death_management.2001.opening:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))] của ta, [dead_character.GetTitledFirstName], đã chết!\n\n"
  death_management.2001.child:0 "Ta đã đặt biết bao hy vọng nơi con, đứa con yêu dấu của ta. Bao điều con sẽ học, sẽ trải nghiệm, và sẽ làm. Có vô vàn khả năng, cả một cuộc đời phía trước. Có lẽ một ngày nào đó con cũng sẽ có con cái của riêng mình. Nhưng giờ đây, tất cả sẽ không bao giờ xảy ra nữa, tất cả là vì [prison_holder.GetTitledFirstName]..."
  death_management.2001.like:0 "Ôi [ROOT.Char.GetFaith.HighGodName], sao ngài có thể để [prison_holder.GetTitledFirstName] làm điều này với [dead_character.GetFirstName]?"
  death_management.2001.like_end_killer:0 "Ta cầu nguyện rằng tên [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.GetFirstName] sẽ không bao giờ có được nghỉ ngơi, không bình yên, không #EMP tình yêu#!, như cái giá cho việc kết liễu mạng sống của [dead_character.Custom('GetDaughterSon')] của ta."
  death_management.2001.like_end:0 "Ta cầu nguyện rằng tên [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.GetFirstName] sẽ không bao giờ có được nghỉ ngơi, không bình yên, không #EMP tình yêu#!, như cái giá cho việc để [dead_character.Custom('GetDaughterSon')] của ta lụi tàn trong ngục tối của [prison_holder.GetHerHis]."
  death_management.2001.neutral:0 "Ta tưởng mình đã quá già để còn ngạc nhiên trước sự tàn nhẫn của thế gian này, nhưng ta chưa từng nghĩ mình sẽ phải chứng kiến cái chết của chính [dead_character.Custom('GetDaughterSon')] của mình dưới tay [prison_holder.GetTitledFirstName]. Ta chỉ hy vọng rằng giờ đây [dead_character.GetSheHe] đã được giải thoát khỏi những đau đớn mà [dead_character.GetSheHe] hẳn đã phải chịu..."
  death_management.2001.dislike:0 "Chẳng phải là bổn phận của một [ROOT.Char.Custom('MotherFather')] khi yêu thương những đứa con [ROOT.Char.GetHerHis] của mình sao? Tuy nhiên, ta không thể tự mình khóc thương cho sự ra đi [dead_character.GetFirstNamePossessive] của nó."
  death_management.2001.dislike_end_killer:0 "Ta chỉ cảm thấy tức giận trước sự sỉ nhục mà [prison_holder.GetTitleTierName] đã giáng lên ta khi để [dead_character.Custom('GetDaughterSon')] của ta chết dưới tay [prison_holder.GetHerHis]."
  death_management.2001.dislike_end:0 "Ta chỉ cảm thấy tức giận trước sự sỉ nhục mà [prison_holder.GetTitleTierName] đã giáng lên ta khi để [dead_character.Custom('GetDaughterSon')] của ta chết trong ngục tối của [prison_holder.GetHerHis]."
  death_management.2001.a:0 "[dead_character.GetSheHe|U] không đáng phải chịu điều này."
  death_management.2001.c:0 "Hối hận cũng đã quá muộn."
  death_management.2001.d:0 "Hãy yên nghỉ, [dead_character.GetFirstNameNoTooltip] bé nhỏ."
  death_management.2001.tt:1 "[dead_character.Custom('GetDaughterSon')] của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của [prison_holder.GetTitledFirstName]."

  death_management.2002.t:0 "Giấc Nghỉ Dài"
  death_management.2002.child:0 "[dead_character.Custom('MotherFather')|U]? Vì sao ngươi rời đi? Họ nói ngươi không thể làm khác, rằng [prison_holder.GetTitledFirstName] là lý do ngươi phải ra đi. Nhưng tại sao [prison_holder.GetSheHe] lại cướp ngươi khỏi ta, [dead_character.Custom('MotherFather')]?"
  death_management.2002.like:0 "Ôi, [dead_character.Custom('MotherFather')]. Ta có thể đã trưởng thành, nhưng ta mãi là đứa con của ngươi. Giờ ta phải làm gì đây, khi [prison_holder.GetTitledFirstName] đã cướp ngươi khỏi ta và khỏi thế gian này? Ai sẽ ôm lấy ta khi nước mắt làm mờ đôi mắt ta?"
  death_management.2002.neutral:0 "Chúng ta có thể không thân thiết, [dead_character.GetFirstName], nhưng ngươi vẫn luôn là [dead_character.Custom('MotherFather')] của ta. Chỉ nghĩ rằng [prison_holder.GetTitledFirstName] lại có thể cướp ngươi khỏi ta theo cách tàn nhẫn như vậy, để lại cho ta vô vàn câu hỏi. Điều gì đã khiến [prison_holder.GetTitleTierName] phạm phải tội ác ghê tởm ấy? Ta đã coi ngươi là điều hiển nhiên sao? [dead_character.Custom('MotherFather')|U]... Ngươi thật sự yêu ta chứ?"
  death_management.2002.dislike:0 "Máu của ngươi có thể chảy trong huyết quản ta, nhưng ngươi chưa bao giờ là [dead_character.Custom('MotherFather')] thật sự của ta. Nếu cái chết của ngươi dưới tay [prison_holder.GetTitledFirstName] không phải là một sự sỉ nhục như vậy, ta hẳn chỉ cảm thấy nhẹ nhõm khi ngươi ra đi."
  death_management.2002.a:0 "Ta sẽ luôn yêu ngươi, [dead_character.Custom('MotherFather')]."
  death_management.2002.b:0 "Có lẽ ta sẽ không bao giờ biết..."
  death_management.2002.c:0 "Ta sẽ khiến [prison_holder.GetSheHe] phải trả giá."
  death_management.2002.d:0 "Ta... ta muốn [dead_character.Custom('MotherFather')] của ta!"
  death_management.2002.tt:1 "[dead_character.Custom('MotherFather')] của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của [prison_holder.GetTitledFirstName]."

  death_management.2008.t:0 "Tất Cả Những Gì Có Thể Đã Xảy Ra"
  death_management.2008.desc.like:0 "Ta đã bắt đầu tưởng tượng về tương lai của ta và [dead_character.GetTitledFirstNamePossessive] — những điều chúng ta sẽ cùng đạt được và gia đình mà chúng ta sẽ xây dựng."
  death_management.2008.like_end_killer:0 "Tất cả những giấc mơ ấy đã sụp đổ nhờ [prison_holder.GetTitledFirstName], kẻ đã sát hại người đã đính hôn với ta, kết thúc giấc mơ trước khi nó bắt đầu."
  death_management.2008.like_end:0 "Tất cả những giấc mơ ấy đã sụp đổ nhờ [prison_holder.GetTitledFirstName], kẻ đã để người đã đính hôn với ta chết trong ngục tối của [prison_holder.GetHerHis]."
  death_management.2008.dislike_killer:0 "Khi ta được báo rằng người đã đính hôn với ta là [dead_character.GetTitledFirstName] đã chết dưới tay [prison_holder.GetTitledFirstName], ta không thể phủ nhận rằng mình cảm thấy nhẹ nhõm. Dĩ nhiên ta vẫn giận dữ với [prison_holder.GetTitleTierName] đã kết liễu mạng sống của vị hôn phu theo cách bạo lực như vậy, nhưng ta cũng mừng vì giờ ta không còn phải cưới [dead_character.GetHerHim] nữa."
  death_management.2008.dislike:0 "Khi ta được báo rằng người đã đính hôn với ta là [dead_character.GetTitledFirstName] đã chết trong ngục tối của [prison_holder.GetTitledFirstName], ta không thể phủ nhận rằng mình cảm thấy nhẹ nhõm. Dĩ nhiên ta vẫn giận dữ với [prison_holder.GetTitleTierName] đã để vị hôn phu của ta chết trong sự giam giữ của [prison_holder.GetHerHis], nhưng ta cũng mừng vì giờ ta không còn phải cưới [dead_character.GetHerHim] nữa."
  death_management.2008.desc.neutral:0 "Kể từ khi việc đính hôn giữa ta và [dead_character.GetTitledFirstName] được chính thức hóa, ta đã vừa háo hức vừa lo sợ trước cuộc hôn nhân sắp tới. Giờ khi [prison_holder.GetTitledFirstName] đã gây ra cái chết của người đã đính hôn với ta, ta lại nhớ [dead_character.GetHerHim], dù ta chưa từng thật sự hiểu rõ [dead_character.GetHerHim]. Ai biết được chúng ta có thể đã có gì cùng nhau?"
  death_management.2008.a.tt:1 "Người đã đính hôn của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của [prison_holder.GetTitledFirstName] và hôn ước bị hủy bỏ."
  death_management.2008.a:0 "Hãy yên nghỉ, [dead_character.GetFirstNameNoTooltip]."
  death_management.2008.b:0 "Chúng ta đã đi thẳng đến #EMP Cho đến khi cái chết chia lìa#!!"

  death_management.3000.t:0 "Cho Đến Khi Ta Chia Lìa Chúng Ta"
  death_management.3000.like:0 "Ồ, [dead_character.GetFirstName], người tình [dead_character.Custom('LoverPetName')] của ta. Nghĩ đến việc người đã ra đi trong ngục tối của ta... Ta tự hỏi liệu [dead_character.GetSheHe] có tin ta không nếu ta nói với [dead_character.GetHerHim] rằng ta vẫn yêu [dead_character.GetHerHim], ngay cả lúc này."
  death_management.3000.neutral:0 "[dead_character.GetFirstName] thân mến của ta. Có lẽ ta chưa từng yêu ngươi, và có lẽ chính ta là nguyên nhân khiến ngươi chết, nhưng cái chết của ngươi khiến ta đau lòng hơn ta từng nghĩ. Ngươi luôn ở đó, người bạn đồng hành quen thuộc của ta. Không ngờ rằng ngục tối của ta lại trở thành nơi kết liễu ngươi..."
  death_management.3000.dislike:0 "[dead_character.GetWifeHusband] quá cố của ta, sự nhẹ nhõm tràn ngập khi ngươi trút hơi thở cuối cùng trong ngục tối của ta. Có lẽ ta nên xấu hổ, nhưng sự thật là giữa chúng ta chẳng có chút tình cảm nào."
  death_management.3000.a:0 "Mong [dead_character.GetSheHe] được yên nghỉ."
  death_management.3000.b:0 "Ai mà đoán được?"
  death_management.3000.c:0 "Cuối cùng cũng xong!"
  death_management.3000.tt:1 "Phối ngẫu của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của ngươi."

  death_management.3007.t:0 "Bước Ngoặt Của Số Mệnh"
  death_management.3007.start:1 "Hôm nay, với cái chết của [dead_character.GetTitledFirstName] trong ngục tối của ta, tương lai của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] đã rẽ sang một hướng khác. Chúng ta sẽ không bao giờ biết"
  death_management.3007.mytitle:1 "[ROOT.Char.GetTitleTierName]"
  death_management.3007.ruler:0 "vị quân chủ"
  death_management.3007.end:1 "[dead_character.GetSheHe] sẽ trở thành như thế nào, hay cái chết của [dead_character.GetHerHis] là phúc lành hay tai họa đối với [ROOT.Char.GetPrimaryTitle.GetType.GetName] này.\n\nĐiều ta biết là chuyện đã xảy ra thì đã xảy ra, và câu chuyện của [dead_character.GetFirstNamePossessive] đã kết thúc."
  death_management.3007.a:0 "Một câu chuyện kết thúc, và câu chuyện khác bắt đầu."
  death_management.3007.a.tt:1 "Người thừa kế của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của ngươi.\n[new_heir.GetTitledFirstName] là người thừa kế mới của ngươi."
 
  death_management.3001.t:0 "Sống Lâu Hơn Con Mình"
  death_management.3001.tt:1 "[dead_character.Custom('GetDaughterSon')] của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của ngươi."
  death_management.3001.child:0 "Ta đã đặt biết bao hy vọng nơi con, đứa con yêu dấu của ta. Bao điều con sẽ học, sẽ trải nghiệm, và sẽ làm. Có vô vàn khả năng, cả một cuộc đời phía trước. Có lẽ một ngày nào đó con cũng sẽ có con cái của riêng mình. Nhưng giờ đây, tất cả sẽ không bao giờ xảy ra nữa, tất cả là do hành động của ta..."
  death_management.3001.like:0 "Ôi [ROOT.Char.GetFaith.HighGodName], sao ngài lại để [dead_character.GetFirstName] ra đi?\n\nTa cầu mong [dead_character.GetSheHe] tìm được yên nghỉ nơi thế giới bên kia, và [ROOT.Char.GetFaith.HighGodName] sẽ tha thứ cho tội lỗi của ta."
  death_management.3001.neutral:0 "Ta tưởng mình đã quá già để còn ngạc nhiên trước sự tàn nhẫn của thế gian này, nhưng ta chưa từng nghĩ mình sẽ phải chịu nỗi đau khi chứng kiến cái chết của chính [dead_character.Custom('GetDaughterSon')] của mình. Ta chỉ hy vọng rằng giờ đây [dead_character.GetSheHe] đã được giải thoát khỏi những đau đớn mà giờ đây ta phải chịu..."
  death_management.3001.dislike:0 "Chẳng phải là bổn phận của một [ROOT.Char.Custom('MotherFather')] khi yêu thương những đứa con [ROOT.Char.GetHerHis] của mình sao? Tuy nhiên, ta không thể tự mình khóc thương cho sự ra đi [dead_character.GetFirstNamePossessive] của nó bởi chính tay ta."
  death_management.3001.a:0 "[dead_character.GetSheHe|U] không đáng phải chịu điều này."
  death_management.3001.c:0 "Hối hận cũng đã quá muộn."
  death_management.3001.d:0 "Hãy yên nghỉ, [dead_character.GetFirstNameNoTooltip] bé nhỏ."

  death_management.3002.t:0 "Giấc Nghỉ Dài"
  death_management.3002.child:0 "[dead_character.Custom('MotherFather')|U]? Vì sao ngươi rời đi? Họ nói ngươi không thể làm khác, rằng ta là lý do khiến ngươi phải ra đi. Nhưng điều đó chẳng có ý nghĩa gì cả. Đúng không, [dead_character.Custom('MotherFather')]?"
  death_management.3002.like:0 "Ôi, [dead_character.Custom('MotherFather')]. Ta có thể đã trưởng thành, nhưng ta mãi là đứa con của ngươi. Giờ ta phải làm gì đây, khi chính ta đã gây ra cái chết của ngươi? Ai sẽ ôm lấy ta khi nước mắt làm mờ đôi mắt ta?"
  death_management.3002.neutral:0 "Chúng ta có thể không thân thiết, và có lẽ chính ta đã gây ra cái chết của ngươi, [dead_character.GetFirstName], nhưng ngươi vẫn luôn là [dead_character.Custom('MotherFather')] của ta.\n\nKhi ngươi rời khỏi thế gian này, hàng ngàn câu hỏi tràn ngập tâm trí ta. Ta đã coi ngươi là điều hiển nhiên sao? Cái chết của ngươi có phải là sai lầm mà ta lẽ ra phải tránh không? [dead_character.Custom('MotherFather')|U]... Ngươi thật sự yêu ta chứ?"
  death_management.3002.dislike:0 "Máu của ngươi có thể chảy trong huyết quản ta, nhưng ngươi chưa bao giờ là [dead_character.Custom('MotherFather')] thật sự của ta. Ta không cảm thấy gì ngoài sự nhẹ nhõm khi ngươi ra đi, thậm chí không có cả cảm giác tội lỗi vì đã gây ra điều đó. Cuối cùng, cái bóng của ngươi cũng không còn đè nặng lên vai ta."
  death_management.3002.a:0 "Ta sẽ luôn yêu ngươi, [dead_character.Custom('MotherFather')]."
  death_management.3002.b:0 "Có lẽ ta sẽ không bao giờ biết..."
  death_management.3002.c:0 "Cuối cùng cũng xong!"
  death_management.3002.d:0 "Ta... ta muốn [dead_character.Custom('MotherFather')] của ta!"
  death_management.3002.tt:1 "[dead_character.Custom('MotherFather')] của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của ngươi."

  death_management.3006.t:0 "Sống Lâu Hơn Kẻ Thù"
  death_management.3006.desc:1 "Khi tên cai ngục mang đến tin vui ấy, ta gần như không thể tin nổi! Kẻ thù của ta, [dead_character.GetTitledFirstName], cuối cùng đã chết trong ngục tối của ta.\n\nChỉ nghĩ rằng ta sẽ sống trong một thế giới không còn tên [dead_character.Custom2('InsultNoun', ROOT.Char)] ấy, và chính ta là người đã khiến điều đó xảy ra. Ta vui đến mức có thể nhảy múa!"
  death_management.3006.a:0 "Ngay trên nấm mồ nông của [dead_character.GetHerHis]!"
  death_management.3006.a.tt:2 "[rival|E] của ngươi [dead_character.GetFirstNameNoTooltip] đã chết!"

  death_management.3008.t:0 "Tất Cả Những Gì Đáng Lẽ Có Thể"
  death_management.3008.desc.like:0 "Ta đã bắt đầu hình dung về tương lai của ta và [dead_character.GetTitledFirstNamePossessive] — những điều chúng ta sẽ cùng đạt được và gia đình mà chúng ta sẽ xây dựng. Tất cả những giấc mơ ấy đã sụp đổ bởi chính hành động của ta khi ta để vị hôn phu của mình chết trong ngục tối của ta."
  death_management.3008.desc.dislike:0 "Khi ta được báo rằng vị hôn phu của ta là [dead_character.GetTitledFirstName] đã chết trong ngục tối của ta, ta không thể phủ nhận rằng mình cảm thấy nhẹ nhõm. Ta mừng vì giờ ta sẽ không phải cưới [dead_character.GetHerHim] nữa!"
  death_management.3008.desc.neutral:0 "Kể từ khi hôn ước giữa ta và [dead_character.GetTitledFirstName] được chính thức lập nên, ta vừa háo hức vừa lo sợ trước cuộc hôn nhân sắp tới. Giờ khi người đã đính ước với ta đã chết trong ngục tối của ta, ta lại nhớ [dead_character.GetHerHim], dù ta chưa từng thật sự hiểu rõ [dead_character.GetHerHim]. Ai biết được chúng ta có thể đã có gì cùng nhau?"
  death_management.3008.a.tt:1 "Người đã đính hôn của ngươi, [dead_character.GetTitledFirstName], đã chết trong ngục tối của ngươi và hôn ước bị hủy bỏ."
  death_management.3008.a:0 "Hãy yên nghỉ, [dead_character.GetFirstNameNoTooltip]."
  death_management.3008.b:0 "Chúng ta đã đi thẳng đến #EMP Cho đến khi cái chết chia lìa#!."

  death_management.prisoner.desc:0 "Tù nhân của ta, [dead_character.GetTitledFirstName], đã chết trong ngục tối của ta."

  death_management.4000.t:0 "Cho Đến Khi Cái Chết Chia Lìa Chúng Ta"
  death_management.4000.like_opening:0 "Làm sao trái tim có thể chịu đựng nỗi đau này mà không vỡ tan? Điều đó không thể nào! Vậy mà ta vẫn ở đây, tim ta vẫn đập trong khi tim ngươi đã lặng im.\n\n"
  death_management.4000.like_my_prison:0 "Ôi, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] của ta. Ngươi có tin ta không nếu ta nói rằng ta vẫn trân trọng ngươi? Ngay cả sau tất cả những gì ta đã làm?"
  death_management.4000.like:0 "Ôi, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] của ta. Ta không thể xóa khỏi đầu hình ảnh ngươi dần lụi tàn, bị giam cầm bởi [house_arrest_holder.GetTitledFirstName]."
  death_management.4000.neutral_opening:0 "[dead_character.GetFirstName] thân mến của ta. Có lẽ ta chưa từng yêu ngươi, nhưng cái chết của ngươi khiến ta đau lòng hơn ta từng nghĩ.\n\n"
  death_management.4000.neutral_my_prison:0 "Ta hy vọng ngươi có thể tha thứ cho tội lỗi của ta. Cả những điều ta đã làm với ngươi và tất cả những điều ta chưa từng nói ra."
  death_management.4000.neutral:0 "Ngươi luôn ở đó, người bạn đồng hành quen thuộc của ta. Không ngờ rằng ngươi lại chết khi là tù nhân của [house_arrest_holder.GetTitledFirstName]... Có quá nhiều điều ta chưa từng nói!"
  death_management.4000.dislike_my_prison:0 "[dead_character.GetWifeHusband|U], khi ngươi trút hơi thở cuối cùng với tư cách tù nhân của ta, sự nhẹ nhõm tràn ngập trong lòng ta. Có lẽ ta nên xấu hổ, nhưng sự thật là giữa chúng ta chẳng có chút tình cảm nào. Cuối cùng ta cũng tự do để bắt đầu cuộc đời mới!"
  death_management.4000.dislike:0 "[dead_character.GetWifeHusband|U], khi ngươi trút hơi thở cuối cùng với tư cách tù nhân của [house_arrest_holder.GetTitledFirstName], sự nhẹ nhõm tràn ngập trong lòng ta. Có lẽ ta nên xấu hổ, nhưng sự thật là giữa chúng ta chẳng có chút tình cảm nào. Cuối cùng ta cũng tự do để bắt đầu cuộc đời mới!"
  death_management.4000.a:0 "Ít nhất ký ức vẫn còn."
  death_management.4000.b:0 "Ta hy vọng ngươi tìm được bình yên, [dead_character.GetFirstNameNoTooltip]."
  death_management.4000.c:0 "Cuối cùng cũng đến!"
  death_management.4000.tt:1 "Phối ngẫu của ngươi, [dead_character.GetTitledFirstName], đã chết trong thời gian bị quản thúc tại gia."

  death_management.4007.t:0 "Bước Ngoặt Của Số Mệnh"
  death_management.4007.start_my_prison:1 "Hôm nay, với cái chết của tù nhân của ta là [dead_character.GetTitledFirstName], tương lai của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] đã rẽ sang một hướng khác. Chúng ta sẽ không bao giờ biết"
  death_management.4007.start:1 "Hôm nay, với cái chết của [dead_character.GetTitledFirstName] khi là tù nhân của [house_arrest_holder.GetTitledFirstName], tương lai của [ROOT.Char.GetPrimaryTitle.GetNameNoTier] đã rẽ sang một hướng khác. Chúng ta sẽ không bao giờ biết"
  death_management.4007.mytitle:1 "[ROOT.Char.GetTitleTierName]"
  death_management.4007.ruler:0 "vị quân chủ"
  death_management.4007.end_adventurer: "[dead_character.GetSheHe] sẽ trở thành như thế nào, hay cái chết của [dead_character.GetHerHis] là phúc lành hay tai họa đối với những kẻ theo [dead_character.GetHerHis]."
  death_management.4007.end:1 "[dead_character.GetSheHe] sẽ trở thành như thế nào, hay cái chết của [dead_character.GetHerHis] là phúc lành hay tai họa đối với [ROOT.Char.GetPrimaryTitle.GetType.GetName] này."
  death_management.4007.end.heir:0 "\n\nHy vọng duy nhất của ta là người thừa kế mới của ta [new_heir.GetTitledFirstName] đủ khả năng gánh vác trách nhiệm."
  death_management.4007.a:0 "Một câu chuyện kết thúc, và câu chuyện khác bắt đầu."
  death_management.4007.b:0 "Ta hy vọng hành động của ta là đúng."
  death_management.4007.a.tt:1 "Người thừa kế của ngươi, [dead_character.GetTitledFirstName], đã chết trong thời gian bị quản thúc tại gia."
  death_management.4007.a.tt.heir:1 "[new_heir.GetTitledFirstName] là người thừa kế mới của ngươi."

  death_management.4001.t:0 "Sống Lâu Hơn Con Mình"
  death_management.4001.tt:1 "[dead_character.Custom('GetDaughterSon')] của ngươi, [dead_character.GetTitledFirstName], đã chết trong thời gian bị quản thúc tại gia."
  death_management.4001.child_my_prison:0 "Ôi, [dead_character.GetTitledFirstName] yêu dấu của ta! Ta hy vọng mình đã đưa ra quyết định đúng khi ép con phải sống những ngày cuối đời bị giam giữ.\n\nBao điều con sẽ không bao giờ học được, trải nghiệm, hay thực hiện..."
  death_management.4001.child:0 "Ôi, [dead_character.GetTitledFirstName] yêu dấu của ta! Quá ngây thơ, quá trẻ tuổi, vậy mà lại phải trải qua những ngày cuối đời trong ngục của [house_arrest_holder.GetTitledFirstNamePossessive]?\n\nThế gian này quả thật tàn nhẫn... nhưng ít nhất giờ ta biết con sẽ không bao giờ phải trải qua những kinh hoàng tồi tệ nhất của nó."
  death_management.4001.like:0 "Lạy [ROOT.Char.GetFaith.HighGodName], làm sao người có thể để [dead_character.Custom('GetDaughterSon')] thân yêu [dead_character.GetFirstName] của ta ra đi trong nhà tù [house_arrest_holder.GetTitledFirstNamePossessive] chứ? [dead_character.GetSheHe|U] là người vô tội, [dead_character.Custom('GetDaughterSon')] hoàn hảo của ta!\n\nTa cầu nguyện rằng [dead_character.GetFirstName] tìm thấy cả sự bình yên và tự do ở thế giới bên kia."
  death_management.4001.like_my_prison:0 "Ôi [ROOT.Char.GetFaith.HighGodName], sao ngài lại để [dead_character.Custom('GetDaughterSon')] yêu dấu của ta là [dead_character.GetFirstName] qua đời? Ta cầu nguyện rằng [dead_character.GetSheHe] sẽ tìm được cả bình yên lẫn sức mạnh để tha thứ cho ta ở thế giới bên kia."
  death_management.4001.neutral_opening:0 "Ta tưởng mình đã quá già để còn ngạc nhiên trước sự tàn nhẫn của thế gian này, nhưng ta chưa từng nghĩ mình sẽ phải chứng kiến cái chết của chính [dead_character.Custom('GetDaughterSon')] của mình.\n\n"
  death_management.4001.neutral_my_prison:0 "Ngay cả khi [dead_character.GetSheHe] đã phải dành những khoảnh khắc cuối cùng trên trái đất này với tư cách là tù nhân của ta, ta hy vọng rằng bây giờ [dead_character.GetSheHe] có thể tìm thấy sự bình yên."
  death_management.4001.neutral:0 "Ta đau lòng khi [dead_character.GetSheHe] đã phải dành những khoảnh khắc cuối cùng trên trái đất này với tư cách là tù nhân của [house_arrest_holder.GetTitledFirstName], nhưng ta hy vọng rằng bây giờ [dead_character.GetSheHe] có thể tìm thấy sự bình yên."
  death_management.4001.dislike_opening:0 "Chẳng phải là bổn phận của một [ROOT.Char.Custom('MotherFather')] khi yêu thương những đứa con [ROOT.Char.GetHerHis] của mình sao?"
  death_management.4001.dislike_my_prison:0 "Thế nhưng ta lại không thể rơi nước mắt trước cái chết của [dead_character.GetFirstNamePossessive] khi bị giam cầm bởi chính ta."
  death_management.4001.dislike:0 "Thế nhưng ta lại không thể rơi nước mắt trước cái chết của [dead_character.GetFirstNamePossessive] khi bị giam cầm bởi [house_arrest_holder.GetTitledFirstName]."
  death_management.4001.dislike_end:0 "\n\nỞ đâu đó trên đường đời ta hẳn đã sai lầm, đẩy [dead_character.Custom('GetDaughterSon')] của ta đi theo con đường mà ta không bao giờ chấp nhận. Dù có lẽ ta phải chịu trách nhiệm cho con người mà [dead_character.GetSheHe] đã trở thành, tất cả giờ cũng đã qua rồi. Cuối cùng."
  death_management.4001.a:0 "[dead_character.GetSheHe|U] không đáng phải chịu điều này."
  death_management.4001.c:0 "Hối hận cũng đã quá muộn."
  death_management.4001.d:0 "Hãy yên nghỉ, [dead_character.GetFirstNameNoTooltip] bé nhỏ."

  death_management.4002.t:0 "Giấc Nghỉ Dài"
  death_management.4002.child:0 "[dead_character.Custom('MotherFather')|U]? Vì sao ngươi rời đi? Họ nói ngươi không thể làm khác, và rằng ta không nên khóc vì giờ ngươi đang ở nơi tốt đẹp hơn ngục của [house_arrest_holder.GetTitledFirstNamePossessive]. Nhưng tại sao ta không thể đi cùng ngươi, [dead_character.Custom('MotherFather')]? Ngươi không còn yêu ta nữa sao? Ngươi đã nói rằng ngươi sẽ luôn yêu ta..."
  death_management.4002.like_opening:0 "Ôi, [dead_character.Custom('MotherFather')]. Ta có thể đã trưởng thành, nhưng ta mãi là đứa con của ngươi."
  death_management.4002.like_my_prison:0 "Giờ ta phải làm gì đây, khi ngươi đã chết khi là tù nhân của ta? Ai sẽ ôm lấy ta khi nước mắt làm mờ đôi mắt ta? Ngươi có bao giờ tha thứ cho ta không?"
  death_management.4002.like:0 "Giờ ta phải làm gì đây, khi ngươi đã chết khi là tù nhân của [house_arrest_holder.GetTitledFirstNamePossessive]? Ai sẽ ôm lấy ta khi nước mắt làm mờ đôi mắt ta?"
  death_management.4002.neutral_opening:0 "Chúng ta có thể không thân thiết, [dead_character.GetFirstName], nhưng ngươi vẫn luôn là [dead_character.Custom('MotherFather')] của ta."
  death_management.4002.neutral_my_prison:0 "Chỉ nghĩ rằng ngươi lại chết khi là tù nhân của ta, để lại cho ta vô vàn câu hỏi... Ta đã coi ngươi là điều hiển nhiên sao? Ngươi có tự hào về ta không? [dead_character.Custom('MotherFather')|U]... Ngươi thật sự yêu ta chứ?"
  death_management.4002.neutral:0 "Chỉ nghĩ rằng ngươi lại chết khi là tù nhân của [house_arrest_holder.GetTitledFirstName], để lại cho ta vô vàn câu hỏi... Ta đã coi ngươi là điều hiển nhiên sao? Ngươi có tự hào về ta không? [dead_character.Custom('MotherFather')|U]... Ngươi thật sự yêu ta chứ?"
  death_management.4002.dislike_opening:0 "Máu của ngươi có thể chảy trong huyết quản ta, nhưng ngươi chưa bao giờ là [dead_character.Custom('MotherFather')] thật sự của ta."
  death_management.4002.dislike_my_prison:0 "Ta chỉ cảm thấy nhẹ nhõm khi ngươi chết với tư cách tù nhân của ta. Cuối cùng cái bóng của ngươi cũng không còn đè nặng lên vai ta."
  death_management.4002.dislike:0 "Ta không cảm thấy gì ngoài sự nhẹ nhõm khi ngươi chết với tư cách tù nhân của [house_arrest_holder.GetTitledFirstName]. Cuối cùng cái bóng của ngươi cũng không còn đè nặng lên vai ta."
  death_management.4002.a:0 "Ta sẽ luôn yêu ngươi, [dead_character.Custom('MotherFather')]."
  death_management.4002.b:0 "Có lẽ ta sẽ không bao giờ biết..."
  death_management.4002.c:0 "Hãy yên nghỉ, [dead_character.Custom('MotherFather')]."
  death_management.4002.d:0 "Ta... ta muốn [dead_character.Custom('MotherFather')] của ta!"
  death_management.4002.tt:1 "[dead_character.Custom('MotherFather')] của ngươi, [dead_character.GetTitledFirstName], đã chết trong thời gian bị quản thúc tại gia."

  death_management.4008.t:0 "Tất Cả Những Gì Đáng Lẽ Có Thể"
  death_management.4008.desc.like_my_prison:0 "Dù hành động của ta như vậy, ta chưa từng thật sự ghét [dead_character.GetTitledFirstName]. Thậm chí đôi khi ta còn tưởng tượng về tương lai của chúng ta — những điều chúng ta sẽ đạt được và gia đình mà chúng ta sẽ xây dựng. Tất cả những giấc mơ ấy sụp đổ khi ta được báo rằng vị hôn phu của ta đã chết khi là tù nhân của ta. Mọi chuyện không đáng lẽ phải xảy ra như vậy!"
  death_management.4008.desc.like:0 "Khi ta được báo rằng vị hôn phu của ta là [dead_character.GetTitledFirstName] đã chết khi là tù nhân của [house_arrest_holder.GetTitledFirstName], mọi giấc mơ về cuộc đời cùng [dead_character.GetTitledFirstName] của ta đều sụp đổ. Giờ đây không điều nào ta từng tưởng tượng sẽ xảy ra nữa. Hy vọng, ước mơ, và gia đình chúng ta có thể đã xây dựng... tất cả đều biến mất."
  death_management.4008.desc.dislike:0 "Khi ta được báo rằng vị hôn phu của ta là [dead_character.GetTitledFirstName] đã chết khi là tù nhân của [house_arrest_holder.GetTitledFirstName], ta không thể phủ nhận rằng mình cảm thấy nhẹ nhõm. Dĩ nhiên ta không vui khi [dead_character.GetSheHe] đã chết, nhưng ta mừng vì giờ ta sẽ không phải cưới [dead_character.GetHerHim]. Ta hẳn sẽ khổ sở, và 'cho đến khi cái chết chia lìa chúng ta' là một khoảng thời gian rất dài..."
  death_management.4008.desc.dislike_my_prison:0 "Khi ta được báo rằng vị hôn phu của ta là [dead_character.GetTitledFirstName] đã chết khi là tù nhân của ta, ta không thể phủ nhận rằng mình cảm thấy nhẹ nhõm. Dĩ nhiên ta không vui khi [dead_character.GetSheHe] đã chết, nhưng ta mừng vì giờ ta sẽ không phải cưới [dead_character.GetHerHim]. Ta hẳn sẽ khổ sở, và 'cho đến khi cái chết chia lìa chúng ta' dường như là một điều quá xa vời..."
  death_management.4008.desc.neutral_my_prison:0 "Kể từ khi hôn ước giữa ta và [dead_character.GetTitledFirstName] được chính thức lập nên, ta vừa háo hức vừa lo sợ trước cuộc hôn nhân sắp tới. Giờ khi [dead_character.GetSheHe] đã chết khi là tù nhân của ta, ta lại nhớ [dead_character.GetHerHim], dù ta chưa từng thật sự hiểu rõ [dead_character.GetHerHim]. Ai biết được chúng ta có thể đã có gì cùng nhau?"
  death_management.4008.desc.neutral:0 "Kể từ khi hôn ước giữa ta và [dead_character.GetTitledFirstName] được chính thức lập nên, ta vừa háo hức vừa lo sợ trước cuộc hôn nhân sắp tới. Giờ khi [dead_character.GetSheHe] đã chết khi là tù nhân của [house_arrest_holder.GetTitledFirstName], ta lại nhớ [dead_character.GetHerHim], dù ta chưa từng thật sự hiểu rõ [dead_character.GetHerHim]. Ai biết được chúng ta có thể đã có gì cùng nhau?"
  death_management.4008.a.tt:1 "Người đã đính hôn của ngươi, [dead_character.GetTitledFirstName], đã chết trong thời gian bị quản thúc tại gia và hôn ước bị hủy bỏ."
  death_management.4008.a:0 "Hãy yên nghỉ, [dead_character.GetFirstNameNoTooltip]."
  death_management.4008.b:0 "Chúng ta đã đi thẳng đến #EMP Cho đến khi cái chết chia lìa#!"

  death_management.9998.t:0 "Biết Mình: Gần Kề Hồi Kết"
  death_management.9998.desc:0 "Ta có thể cảm nhận điều đó tận trong xương tủy. [ROOT.Char.GetFaith.DeathDeityName] sẽ sớm đến đón ta. Như một người bạn cũ, [ROOT.Char.GetFaith.DeathDeitySheHe] kiên nhẫn chờ đợi để tiếp nhận ta."
  death_management.9998.a:0 "Trong vòng một năm nữa ta sẽ chết."
  death_management.9998.a.tt:1 "Ngươi nên sắp xếp ổn thỏa mọi việc của mình."
 
 #### Battle Death Events ####
 # Intro 1
 death_management.intro.witnessed:0 "Giữa cơn hỗn loạn bao trùm vùng [battle_death_location.GetTerrain.GetNameNoTooltip|l] của [battle_death_location.GetNameNoTooltip], ta cố gắng trấn tĩnh lại bản thân."
 death_management.intro.war:0 "Tin tức từ vùng [battle_death_location.GetTerrain.GetNameNoTooltip|l] của [battle_death_location.GetNameNoTooltip] cuối cùng cũng được một sứ giả kiệt sức mang đến."
 death_management.intro:0 "Cuộc xung đột giữa [battle_death_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] và [battle_death_leader.GetPrimaryTitle.GetNameNoTierNoTooltip] vốn chẳng khiến ta quan tâm mấy, cho đến khi bản tóm lược trận chiến tại [battle_death_location.GetNameNoTooltip] được hội đồng của ta trình lên."
 # Intro 2
 death_management.intro.enemy:0 "Phía trước ta, [dead_character.GetFirstName] lao thẳng về phía quân thù.\n\n"
 death_management.intro.friendly:0 "Băng qua chiến trường, ta nhìn thấy [dead_character.GetFirstName] đang tuyệt vọng chiến đấu.\n\n"
 death_management.intro.letter.lover:0 "Dạ dày ta thắt lại vì lo sợ cho người tình của mình khi ta nhận lấy cuộn thư.\n\n$death_management.intro.letter$"
 death_management.intro.letter.spouse:0 "Ta chộp lấy mảnh thư, vội vã tìm tin tức về [dead_character.GetWifeHusband] của ta.\n\n$death_management.intro.letter$"
 death_management.intro.letter.family:0 "Ta lập tức biết rằng điều khủng khiếp đã xảy ra với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))] của ta.\n\n$death_management.intro.letter$"
 death_management.intro.letter.friend:0 "Ta không khỏi lo lắng cho số phận của người bạn thân thiết nhất của mình.\n\n$death_management.intro.letter$"
 death_management.intro.letter.rival:0 "Không hiểu sao ta biết, ngay cả trước khi mở thư, rằng bên trong chắc hẳn là tin tốt.\n\n$death_management.intro.letter$"
 death_management.intro.letter.heir:0 "Ta hít sâu một hơi; quá nhiều thứ phụ thuộc vào số phận của người thừa kế của ta.\n\n$death_management.intro.letter$"
 death_management.intro.letter:0 "Trong số những bản báo cáo, dòng chữ ghi rõ:\n"
 # Death flavor
 death_management.death.witnessed.enemy:0 "Đội [battle_death_leader.Custom('GetRandomEmployedMAA')] của ta truy đuổi [dead_character.GetHerHim] không ngừng, và rõ ràng [dead_character.GetSheHe] đã kiệt sức khi những [dead_character.GetWomenMen] khác gục ngã như ruồi quanh [dead_character.GetHerHim]."
 death_management.death.witnessed.friendly:0 "Những [battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')] dần bao vây [dead_character.GetHerHim], sự kiệt quệ của [dead_character.GetHerHis] quá rõ ràng."
 death_management.death.war.enemy:0 "'#EMP Chúng tôi xác nhận [dead_character.GetTitledFirstName] đã tử trận khi ngoan cường chống lại lực lượng [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')]."
 death_management.death.war.friendly:0 "'#EMP Dũng sĩ [dead_character.GetTitledFirstName] của chúng ta đã tử trận khi dẫn đầu một cuộc tấn công chống lại lực lượng [battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')]."
 death_management.death.uninvolved:0 "'#EMP Chúng tôi xác nhận [dead_character.GetTitledFirstName] đã tử trận khi ngoan cường chống lại lực lượng [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')]."
 # Killer
 death_management.killer.witnessed.enemy:0 "Chỉ trong khoảnh khắc, [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] của [battle_death_killer.GetLiege.GetTitledFirstName], lao tới đầy quyết tâm, giơ cao [battle_death_killer.GetHerHis] [battle_death_killer.Custom('signature_weapon')], dễ dàng vượt qua chút sức lực còn lại của [dead_character.GetFirstNameNoTooltip] và tung ra đòn kết liễu. "
 death_management.killer.witnessed.friendly:0 "Ánh lóe của một [battle_death_killer.Custom('signature_weapon')] bất chợt lọt vào mắt ta, và ta nhìn thấy [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] của [battle_death_killer.GetLiege.GetTitledFirstName], giáng xuống đòn chí mạng tàn bạo."
 death_management.killer:0 "[dead_character.GetSheHe|U] bị giết bởi [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] của [battle_death_killer.GetLiege.GetTitledFirstName], trong một cuộc giao chiến dữ dội.'#!"
 death_management.no_killer:0 "[dead_character.GetSheHe|U] bị trúng một mũi tên lạc trong lúc giao tranh ác liệt.'#!"
 # Spouse
 death_management.1200.t:0 "Phối Ngẫu Ngã Xuống"
 death_management.1200.desc_sad: "\n\nTa lẽ ra không nên để [dead_character.GetHerHim] ra đi... không phải theo cách này..."
 death_management.1200.desc_happy: "\n\nCuối cùng thì tên [dead_character.Custom2('InsultNoun', ROOT.Char)] đó cũng chết!"
 death_management.1200.a:0 "[battle_death_killer.GetFirstNameNoTooltip] là một [battle_death_killer.GetWomanMan] chết tiệt! Chết tiệt!"
 death_management.1200.b:0 "Ta sẽ không bao giờ quên ngươi..."
 death_management.1200.c:0 "Ngươi đã chứng minh lòng dũng cảm của mình, tình yêu của ta..."
 death_management.1200.d:0 "Cuối cùng ta cũng được tự do!"
 # Child
 death_management.1201.t:0 " [dead_character.Custom('GetDaughterSon')|U] Ngã Xuống"
 death_management.1201.desc:0 "\n\nTa không thể cứu được [dead_character.GetHerHim]... nhưng không bậc cha mẹ nào nên sống lâu hơn con mình..."
 death_management.1201.a:0 "[battle_death_killer.GetFirstNameNoTooltip] sẽ không thoát khỏi chuyện này!"
 death_management.1201.b:0 "#EMP [dead_character.Custom('GetDaughterSon')] dũng cảm của ta...#!"
 death_management.1201.c:0 "Đây chưa phải lúc của con, con ta..."
 death_management.1201.d:0 "Hãy yên nghỉ, con."
 # Parent
 death_management.1202.t:0 "Đấng Sinh Thành Ngã Xuống"
 death_management.1202.desc:0 "\n\nĐã quá muộn để thay đổi mọi thứ, ta chỉ hy vọng [dead_character.GetSheHe] tìm được bình yên nơi [dead_character.GetFaith.PositiveAfterLife]."
 death_management.1202.a:0 "#EMP Vì sao lại là ngươi, [dead_character.Custom('GetMamaPapa')]?#!"
 death_management.1202.b:0 "[battle_death_killer.GetFirstNameNoTooltip] sẽ phải trả giá."
 # Lover
 death_management.1204.t:0 "Tình Nhân Ngã Xuống"
 death_management.1204.desc:0 "\n\nTrái tim ta hóa thành băng giá khi nhận ra ta sẽ không bao giờ còn cảm nhận được hơi ấm từ vòng tay người yêu nữa..."
 death_management.1204.a:0 "#EMP [dead_character.GetFirstNameNoTooltip] dũng cảm của ta#!..."
 death_management.1204.b:0 "...ngươi sẽ được báo thù!"
 # Best Friend
 death_management.1205.t:0 "Bằng Hữu Ngã Xuống"
 death_management.1205.desc:0 "\n\nTa sẽ không bao giờ còn được chia sẻ những khoảnh khắc quý giá bên [dead_character.GetHerHis] nữa..."
 death_management.1205.a:0 "Không thể là [dead_character.GetFirstNameNoTooltip]!"
 death_management.1205.b:0 "[battle_death_killer.GetFirstNameNoTooltip] sẽ phải trả giá cho việc này!"
 # Rival
 death_management.1206.t:0 "Kẻ Thù Ngã Xuống"
 death_management.1206.desc:0 "\n\nTa không khỏi nở nụ cười khi nghĩ rằng [dead_character.GetFirstNameNoTooltip] đã chết khi chiến đấu trong #EMP cuộc chiến của ta#! — điều này sẽ khiến tinh thần ta phấn chấn nhiều ngày!"
 death_management.1206.a:0 "Đáng đời."
 death_management.1206.b:0 "[dead_character.GetFirstNameNoTooltip] lẽ ra phải thuộc về tay ta!"
 death_management.1206.c:2 "Anh hùng #EMP của ta!#! Ta sẽ gửi cho [battle_death_killer.GetFirstNameNoTooltip] một [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]!"
 # Heir
 death_management.1207.t:0 "Người Thừa Kế Ngã Xuống"
 death_management.1207.desc:0 "\n\nViệc kế vị của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] lại phải được xem xét một lần nữa..."
 death_management.1207.a:0 "Ngươi vẫn chưa sẵn sàng..."
 death_management.1207.b:0 "...nhưng [battle_death_killer.GetFirstNameNoTooltip] cũng vậy!"
 death_battle_new_rivalry_title:0 "[avenger.GetTitledFirstNameNoTooltip] tìm cách báo thù"
 # Family Feud
 death_management.3006.b:0 "Thật đáng tiếc, ta đã hy vọng [dead_character.GetSheHe] sống lâu hơn."
 death_management.3006.c:0 "$death_management.1006.e$"
 death_management.3006.d:0 "$death_management.1006.f$"
 death_management.1006.d:0 "Bớt đi một kẻ của gia tộc [dead_character.GetHouse.GetBaseNameNoTooltip] để phải bận tâm!"
 death_management.1006.e:0 "Cuối cùng, ta nghĩ mình có thể bỏ chuyện này lại phía sau."
 death_management.1006.f:0 "Đừng bao giờ đối đầu với gia tộc [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."

