l_english:
  clan.1001.t:0 "Đính Ước Hài Tử"
  clan.1001.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cùng [vassal.GetHerHis] [vassal_child.Custom('GetDaughterSon')] là [vassal_child.GetTitledFirstName] tiến đến trước mặt ta.\n\n"Việc giữa chúng ta không có liên minh thật đáng xấu hổ, [ROOT.Char.Custom('FormOfAddressForLiege')]. Hãy để [child.GetTitledFirstName] kết hôn với [vassal_child.Custom('GetDaughterSon')] của ta và sửa chữa chuyện này!""
  clan.1001.a:0 "Ngươi nói đúng – chúng sẽ thành hôn!"
  clan.1001.b:0 "Điều đó sẽ không xảy ra."

  clan.1002.desc:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip], chuyện này nghĩa là sao?!"\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] xông vào phòng, kéo theo [vassal.GetHerHis] [vassal_child.Custom('GetDaughterSon')] là [vassal_child.GetTitledFirstName].\n\n"Tại sao ngài lại phá bỏ hôn ước giữa [child.Custom('GetDaughterSon')] của ngài và [vassal_child.GetTitledFirstNameNoTooltip]?"" 
  clan.1002.a:0 "Đó là một sai lầm, ta thề!"
  clan.1002.b:0 "Không phải chuyện của ngươi."

  clan.1011.t:0 "Không Có Liên Minh"
  clan.1011.desc_opening:0 ""Thần không thể không nhận ra sự thiên vị mà ngài dành cho [allied_vassal.Custom2('YourCharacterIntroduction', ROOT.Char)], thưa bệ hạ."\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã tìm đến ta để giải quyết điều mà [vassal.GetSheHe] cho là sự coi thường; việc ta không có liên minh với [vassal.GetHerHim].\n\n"Một sự nhượng bộ từ ngài sẽ làm dịu cơn giận của thần. Chẳng hạn như..."
  clan.1011.desc_army:0 "kinh nghiệm của [councillor.GetCouncilTitle] là [councillor.GetTitledFirstName] của ngài trong vài năm!""
  clan.1011.desc_prestige:0 "vài lời tốt đẹp vào đúng tai người cần nghe.""
  clan.1011.desc_diplomacy:0 "những bài học về nghệ thuật ngoại giao.""
  clan.1011.desc_prowess:0 "chỉ dẫn về chiến đấu!""
  clan.1011.desc_fallback:0 "vàng.""
  clan.1011.army:0 "[councillor.GetCouncilTitle] của ta, [councillor.GetFirstNameNoTooltip], sẽ dạy dỗ ngươi."
  clan.1011.tt:0 "#F Nhận lấy hoặc rời đi#!"
  clan.1011.prestige:0 "Ta sẽ nói tốt về ngươi."
  clan.1011.diplomacy:0 "Tốt hơn ngươi nên mài giũa chiếc lưỡi bạc của mình!"
  clan.1011.prowess:0 "Vậy thì chúng ta hãy đấu với nhau, ta sẽ dạy ngươi."
  clan.1011.fallback:0 "Cầm lấy cái này rồi để ta yên."
  clan.1011.b:0 "Ngươi sẽ không nhận được gì cả."

  clan.1101.t:0 "Cân Bằng Quyền Lực"
  clan.1101.desc:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đến gặp ta với một lời phàn nàn. "Những thành viên gia đình của ngài có quá nhiều quyền lực trong [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Dù những chư hầu như thần có cố gắng đến đâu, chúng thần cũng không bao giờ có thể sánh bằng họ!\n\nThần khẩn cầu ngài hãy sửa chữa sự bất công này. Dù sao thì, ngay cả vẻ ngoài của sự thiên vị cũng có thể gieo rắc oán hận trong lòng các chư hầu...""
  clan.1101.a:0 "Ta đã nghe những lo ngại của ngươi và sẽ cân nhắc chúng."
  clan.1101.a.flavor: "Ngươi dùng lời lẽ khéo léo để tránh phải thực hiện bất kỳ hành động thực chất nào trong khi vẫn khiến [vassal.GetFirstNameNoTooltip] yên tâm"
  clan.1101.b:0 "Ngươi nói đúng. Ta sẽ lập tức có biện pháp sửa chữa!"
  clan.1101.b.custom:0 "Mọi thành viên [dynasty|E] là [vassal|E]"
  clan.1101.b.tt:0 "Nhận được một [revoke_title_reason|E]"
  clan.1101.c:0 "Ồ, ta sẽ cho ngươi thứ gì đó để nuôi dưỡng sự oán hận..."
  clan.1101.d:0 "Không phải lỗi của ta khi ngươi không sinh ra trong gia đình ta!"
  clan.1101.d.custom:0 "Mọi [vassal|E] không phải thành viên [dynasty|E]"

  clan.1201.t:0 "Không Có Đại Diện"
  clan.1201.desc:0 "Một [culture.GetNameNoTooltip] [petitioner.GetWomanMan] từ [target_title.GetNameNoTier] đã đến kiến nghị với ta để được đại diện nhiều hơn trong chính quyền của ta.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng thần là những thần dân trung thành của ngài, vậy mà chúng thần lại không có tiếng nói trong cách cộng đồng của mình được cai quản. Liệu có quá đáng khi xin một người trong dân chúng thần có một vị trí trong chính quyền của ngài không?""
  clan.1201.a:0 "Được thôi. Từ giờ ngươi sẽ cai trị [target_title.GetNameNoTierNoTooltip]!"
  clan.1201.b:0 "Ta có thể nới lỏng quyền kiểm soát... đổi lại là sự phục vụ của ngươi..."
  clan.1201.c:0 "Không đời nào."
