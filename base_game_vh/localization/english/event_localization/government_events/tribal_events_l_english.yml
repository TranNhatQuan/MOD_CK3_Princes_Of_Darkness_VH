l_english:
  tribal.1001.t:0 "Kẻ Thách Đấu"
  tribal.1001.desc_old:0 ""Ngươi đã già yếu rồi, [ROOT.Char.GetTitledFirstNameNoTooltip];"
  tribal.1001.desc_weak:0 ""Ngươi thật #EMP yếu đuối#!, [ROOT.Char.GetTitledFirstNameNoTooltip];"
  tribal.1001.desc_meak:0 ""Ngươi hèn nhát như một con lươn, [ROOT.Char.GetTitledFirstNameNoTooltip];"
  tribal.1001.desc_fallback:0 ""Ngươi không xứng đáng cai trị, [ROOT.Char.GetTitledFirstNameNoTooltip];"
  tribal.1001.desc:0 "đã đến lúc ngươi phải thoái vị!"\n\n[challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến trước mặt ta trước toàn thể bộ tộc, công khai lời thách đấu của [challenger.GetHerHis] cho mọi người cùng nghe.\n\n"Từ hôm nay trở đi, ta sẽ cai trị [ROOT.Char.GetPrimaryTitle.GetName].""
  tribal.1001.a_child:0 "Nói thì phải có kiếm làm chứng, [challenger.Custom('GirlBoy')]!"
  tribal.1001.a:0 "Nói thì phải có kiếm làm chứng!"
  tribal.1001.a_champion:0 "[liege_champion.GetTitledFirstName] sẽ chiến đấu thay ta\n"
  tribal.1001.a_success:0 "Ta thắng trận"
  tribal.1001.a_failure:0 "Ta thua trận"
  tribal.1001.a_champion_success:0 "[liege_champion.GetFirstNameNoTooltip] thắng trận"
  tribal.1001.a_champion_failure:0 "[liege_champion.GetFirstNameNoTooltip] thua trận"
  tribal.1001.b:0 "Chỉ khi ngươi thắng ta trong cuộc đấu khẩu!"
  tribal.1001.b_success:0 "Lời sỉ nhục của ta sắc bén hơn"
  tribal.1001.b_failure:0 "[challenger.GetSheHe|U] vượt qua ta"
  tribal.1001.c:0 "Ta sẽ không chiến đấu với ngươi vì chuyện này..."

  tribal.1002.desc:0 "Ta đã sợ ngày này sẽ đến; ta không thể chống lại ngươi trong chuyện này, [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] của ta."\n\n[liege_to_challenge.GetFirstName] trao lại quyền cai trị của [liege_to_challenge.GetHerHis] cho ta mà không hề chống cự, và sau khoảnh khắc bối rối ngắn ngủi, cả bộ tộc bắt đầu ăn mừng chiến thắng của ta."
  tribal.1002.a:0 "Ta... À... Cảm ơn."

  tribal.1003.desc_opening:0 ""Ngươi dám thách thức quyền cai trị của ta sao?!"
  tribal.1003.desc_old:0 "Tốt hơn ngươi nên chứng minh lời nói của mình bằng thép, [challenger.Custom('GirlBoy')]!""
  tribal.1003.desc_young:0 "Tốt hơn ngươi nên chứng minh lời nói của mình bằng thép!""
  tribal.1003.desc:0 "\n\n[liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [liege_to_challenge.Custom('SignatureWeaponActionThirdPerson')] [liege_to_challenge.GetHerHis] [liege_to_challenge.Custom('signature_weapon')] và bước về phía ta. Cả bộ tộc tụ tập quanh chúng ta, không khí nặng nề bởi sự phấn khích và sợ hãi, khi ta hạ thấp trọng tâm và..."
  tribal.1003.desc_liege_champion:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liege_to_challenge'))] của ta, [liege_to_challenge.GetTitledFirstNamePossessive], đã chọn nhà vô địch là [liege_champion.GetTitledFirstName]; [liege_champion.Custom('SignatureWeaponActionThirdPerson')] [liege_champion.GetHerHis] [liege_champion.Custom('signature_weapon')] và bước về phía ta. Cả bộ tộc tụ tập quanh chúng ta, không khí nặng nề bởi sự phấn khích và sợ hãi, khi ta hạ thấp trọng tâm và..."
  tribal.1003.a:0 "...giơ cao [ROOT.Char.Custom('signature_weapon')] của ta."
  tribal.1003.b:0 "...giơ tay lên và cười gượng."

  tribal.1004.desc_opening:0 "[liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] của ta, [challenger.GetFirstName], [challenger.Custom('SignatureWeaponActionThirdPerson')] [challenger.GetHerHis] [challenger.Custom('signature_weapon')] và bước về phía ta. Cả bộ tộc tụ tập quanh chúng ta, không khí nặng nề bởi sự phấn khích và sợ hãi.\n\n"
  tribal.1004.desc:0 "Ta giơ [ROOT.Char.Custom('signature_weapon')] lên và tấn công. #EMP Né tránh, áp sát, đánh lừa— Ugh!#! Với [challenger.Custom('SignatureWeaponActionReaction')] [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] vào chân ta, và khi ta loạng choạng, ta nhận ra mọi thứ đã kết thúc. Bộ tộc không còn cổ vũ cho ta nữa."
  tribal.1004.a:0 "Nguyền rủa ngươi!"

  tribal.1005.desc:0 "Ta giơ [ROOT.Char.Custom('signature_weapon')] lên và tấn công.\n\n#EMP Né tránh, áp sát, đánh lừa...#! Với [ROOT.Char.Custom('SignatureWeaponActionReaction')] ta [ROOT.Char.Custom('SignatureWeaponCritical')] vào chân [challenger.GetHerHis], và khi [challenger.GetSheHe] loạng choạng ta biết mọi chuyện đã kết thúc."
  tribal.1005.a:0 "Hy vọng ngươi đã học được bài học!"

  tribal.1014.desc_opening:0 "[liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] của ta, [challenger.GetFirstName], [challenger.Custom('SignatureWeaponActionThirdPerson')] [challenger.GetHerHis] [challenger.Custom('signature_weapon')] và bước về phía [liege_champion.GetTitledFirstName]. Cả bộ tộc tụ tập quanh chúng ta, không khí nặng nề bởi sự phấn khích và sợ hãi.\n\n"
  tribal.1014.desc:0 "[liege_champion.GetTitledFirstName] giơ [liege_champion.GetHerHis] [liege_champion.Custom('signature_weapon')] lên và tấn công. #EMP Né tránh, áp sát, đánh lừa— Ugh!#! Với [challenger.Custom('SignatureWeaponActionReaction')] [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] vào chân [liege_champion.GetFirstNamePossessive], và khi [liege_champion.GetSheHe] loạng choạng ta nhận ra mọi thứ đã kết thúc. Bộ tộc không còn cổ vũ cho ta nữa."
  tribal.1014.a:0 "Nguyền rủa ngươi!"

  tribal.1015.desc:0 "[liege_champion.GetTitledFirstName] giơ [liege_champion.GetHerHis] [liege_champion.Custom('signature_weapon')] lên và tấn công.\n\n#EMP Né tránh, áp sát, đánh lừa...#! Với [liege_champion.Custom('SignatureWeaponActionReaction')] [liege_champion.GetSheHe] [liege_champion.Custom('SignatureWeaponCriticalPresent')] vào chân [challenger.GetTitledFirstNamePossessive], và khi [challenger.GetSheHe] loạng choạng ta biết mọi chuyện đã kết thúc."
  tribal.1015.a:0 "Hy vọng ngươi đã học được bài học!"

  tribal.1006.desc_old:0 "Tốt hơn ngươi nên chứng minh quyền thách thức của mình bằng kỹ năng, [challenger.Custom('GirlBoy')]!""
  tribal.1006.desc_young:0 "Tốt hơn ngươi nên chứng minh quyền thách thức của mình bằng kỹ năng!""
  tribal.1006.desc:1 "Ngay khi [liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tuyên bố cuộc tranh tài đối đáp, cả bộ lạc kéo lại gần để chứng kiến cuộc thi.\n\nSự im lặng bao trùm khi [liege_to_challenge.GetFirstNameNoTooltip] bước tới và hắng giọng [liege_to_challenge.GetHerHis] của ngài.\n"
  tribal.1006.a:0 "Ngươi gọi đó là lời sỉ nhục sao? Để ta cho ngươi thấy!"
  tribal.1006.a_success:0 "Ngươi thắng cuộc đấu khẩu"
  tribal.1006.a_failure:0 "Ngươi thua cuộc đấu khẩu"
  tribal.1006.b:0 "Chuyện này... Đây là một sai lầm."

  tribal.1007.desc_ending:1 "\n\nTiếng ồn ào sau đó vang dội đến chói tai, và ta biết mình đã thua."
  tribal.1007.a:0 "Chết tiệt!"

  tribal.1008.desc:1 "Bộ lạc đã tụ tập để chứng kiến cuộc đối đáp giữa ta và [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] [challenger.GetFirstName] của ta. Những tiếng xì xào phấn khích có thể nghe thấy khi [challenger.GetFirstNameNoTooltip] bước tới và hắng giọng [challenger.GetHerHis] của ngài.\n"
  tribal.1008.desc_ending:1 "\n\nSau đó là một sự im lặng đầy sửng sốt và lúng túng."
  tribal.1008.a:0 "Ngươi gọi đó là lời sỉ nhục sao? Cút khỏi đây."

  tribal.1010.desc:0 "Cả bộ tộc tụ tập để chứng kiến cuộc đấu tay đôi giữa ta và [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))] của ta là [challenger.GetFirstName], nhưng ngay khi [challenger.GetSheHe] xuất hiện thì [challenger.GetSheHe] bắt đầu viện cớ.\n\n"Nó... Nó chỉ là một sai lầm, ta đâu dám thách đấu ngài. Xin hãy tha thứ cho ta.""
  tribal.1010.a:0 "Đồ hèn."

  tribal.1022.trigger_failure.challenger:0 "[single_combat_duel|E] của ta với [liege_to_challenge.GetFirstNameNoTooltip] đã bị vô hiệu"
  tribal.1022.trigger_failure.liege_to_challenge:0 "[single_combat_duel|E] của ta với [challenger.GetFirstNameNoTooltip] đã bị vô hiệu"

  tribal.1101.t:0 "Holmgang"
  tribal.1101.desc:0 "Kẻ thù của ta là [rival.GetTitledFirstName] ngẩng lên khi ta bước vào hành lang. [victim.GetTitledFirstName] – chính #EMP [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))]#! của ta – nằm bê bết máu dưới chân [rival.GetHerHis].\n\n"À, [ROOT.Char.GetFirstNameNoTooltip]. Ta chỉ đang để lại cho ngươi một thông điệp!"\n\n[victim.GetFirstNameNoTooltip] vẫn còn sống, nếu những tiếng rên đau đớn của [victim.GetHerHis] là đúng, nhưng ai biết [rival.GetFirstNameNoTooltip] sẽ còn làm gì nữa nếu ta không đến kịp?"
  tribal.1101.a:0 "Đồ [rival.Custom2('InsultNoun', ROOT.Char)] hèn hạ! Ta thách ngươi holmgang!"
  tribal.1101.a_success:0 "Ngươi thắng"
  tribal.1101.a_failure:0 "[rival.GetSheHe|U] thắng"
  tribal.1101.b:0 "Ngươi sẽ đối mặt với [friend.GetFirstNameNoTooltip] trong holmgang!"
  tribal.1101.b_success:0 "[friend.GetFirstNameNoTooltip] thắng"
  tribal.1101.b_failure:0 "[rival.GetFirstNameNoTooltip] thắng"
  tribal.1101.c:0 "Thôi thì... bỏ qua chuyện cũ đi, được chứ?"

  tribal.1102.desc_opening:0 "Một đám đông tụ tập để xem trận holmgang giữa ta và [rival.GetTitledFirstName]; họ bao quanh chúng ta thành một biển người ồn ào với những tiếng hò hét và nắm đấm giơ cao.\n\nTa siết chặt [ROOT.Char.Custom('signature_weapon')] của mình và lao lên — chẳng mấy chốc chúng ta bị cuốn vào một cơn lốc thép và máu.\n\n"
  tribal.1102.desc:0 "Nhưng kia! Một sơ hở trong khả năng phòng ngự [rival.GetTitledFirstNamePossessiveNoTooltip] của hắn. Ta [ROOT.Char.Custom('SignatureWeaponAction')] [ROOT.Char.Custom('signature_weapon')] của ta, nghiến răng, và với [ROOT.Char.Custom('SignatureWeaponActionReaction')] ta [ROOT.Char.Custom('SignatureWeaponCritical')] lồng ngực [rival.GetHerHis] của hắn. [rival.GetSheHe|U] đã chết trước khi [rival.GetSheHe] kịp chạm đất."
  tribal.1102.a:0 "Đây là kết cục cho bất kỳ kẻ nào dám thách thức ta!"

  tribal.1103.desc_opening:0 "Một đám đông đã tụ tập để xem trận holmgang giữa [rival.GetTitledFirstName] và [friend.GetTitledFirstName]. Trong biển người hò hét và những nắm đấm giơ cao, ta là kẻ gào to nhất.\n\n[friend.GetTitledFirstNameNoTooltip] siết chặt [friend.GetHerHis] [friend.Custom('signature_weapon')] và lao lên – chẳng mấy chốc họ bị cuốn vào cơn lốc thép và máu.\n\n"
  tribal.1103.desc:0 "Đột nhiên [friend.GetFirstNameNoTooltip] [friend.Custom('SignatureWeaponActionThirdPerson')] [friend.GetHerHis] [friend.Custom('signature_weapon')] và, với [friend.Custom('SignatureWeaponActionReaction')], [friend.Custom('SignatureWeaponCriticalPresent')] lồng ngực của [rival.GetTitledFirstNamePossessiveNoTooltip]. [rival.GetSheHe|U] chết trước khi [rival.GetSheHe] chạm đất."

  tribal.1104.desc:0 "Đột nhiên [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] [rival.GetHerHis] [rival.Custom('signature_weapon')] và, trước khi ta kịp đỡ, [rival.GetSheHe] [rival.Custom('SignatureWeaponCriticalPresent')] vào vai ta. Cơn đau... ta hẳn đã ngất đi, vì khi ta nhận ra thì [rival.GetSheHe] đã đứng sừng sững trước mặt.\n\n\"Hãy đầu hàng.\""
  tribal.1104.a:0 "Ta... ta đầu hàng."

  tribal.1105.desc:0 "Đột nhiên [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] [rival.GetHerHis] [rival.Custom('signature_weapon')] và, trước khi [friend.GetFirstNameNoTooltip] kịp đỡ, [rival.GetSheHe] [rival.Custom('SignatureWeaponCriticalPresent')] vào vai của [friend.GetFirstNamePossessiveNoTooltip]. Người bạn của ta ngã xuống đất, gào lên vì đau đớn, và [rival.GetFirstNameNoTooltip] nhìn thẳng vào mắt ta.\n\n\"Hãy đầu hàng.\""
  tribal.1105.a:0 "Chúng... chúng ta đầu hàng."

  tribal.1201.t:0 "Cuộc Đua"
  tribal.1201.desc_opening:0 "Công tác chuẩn bị cho một cuộc đua lớn đã diễn ra suốt nhiều tuần, và cuối cùng thời khắc tranh tài cũng đã đến!\n\n"
  tribal.1201.desc_warhorse:0 "Ta đến trên con [ROOT.Char.Custom('HorseStoryMareStallion')] trung thành của mình là [ROOT.Char.Custom('WarhorseStoryName')],"
  tribal.1201.desc:0 "Ta đến trên một trong những con ngựa nhanh nhất của mình,"
  tribal.1201.desc_ending:0 "và nhận ra rằng cả [racer.Custom2('MyCharacterIntroduction', ROOT.Char)] lẫn [villain_racer.Custom2('MyCharacterIntroduction', ROOT.Char)] đều sẽ tham gia cuộc đua."
  tribal.1201.a:0 "Dĩ nhiên ta cũng sẽ tham gia!"
  tribal.1201.a.tt:0 "Một cuộc đua mang lại danh tiếng, nhưng cũng đầy rủi ro!"
  tribal.1201.b:0 "Ta chỉ đứng xem cho vui."

  tribal.1202.desc:0 "Nhảy múa, ca hát, cổ vũ... Đám đông đang phấn khích trước cả khi cuộc đua bắt đầu!\n\nTa di chuyển qua đám đông, chỉ còn vài phút trước khi những tay đua chúng ta phải lên ngựa, khi ta phát hiện [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] [villain_racer.GetTitledFirstName] của ta cạnh những con ngựa với thứ gì đó sắc nhọn trong tay [villain_racer.GetHerHis] của ngài..."
  tribal.1202.a:0 "\"Này! Ngươi đang làm gì vậy?!\""
  tribal.1202.b:0 "Không phải chuyện của ta."
  tribal.1202.b.tt:0 "Chuyện gì đến sẽ đến..."
  tribal.1202.c:0 "Thì ra [villain_racer.GetFirstNameNoTooltip] đã để con ngựa của [villain_racer.GetHerHis] không được canh giữ..."
  tribal.1202.c.success:0 "Ta để dây cương của [villain_racer.GetHerHis] chỉ còn vừa đủ giữ"
  tribal.1202.c.tt:0 "Sẽ thật đáng tiếc nếu có thứ gì đó #EMP đứt#! trong lúc đua..."
  tribal.1202.c.failure:0 "[villain_racer.GetSheHe|U] nhận ra có ai đó đã động vào dây cương của [villain_racer.GetHerHis]"

  tribal.1203.desc_opening:0 "Ta phi nước đại qua thảo nguyên, giữ nhịp cùng những đám mây trên đầu và các kỵ sĩ bên cạnh.\n\n"
  tribal.1203.desc_sabotaged_you:0 "#EMP *Rắc!*#!\n\nĐột nhiên mọi thứ đảo lộn; mặt đất ở trên còn bầu trời ở dưới. Ta cố giữ thăng bằng khi nhận ra yên ngựa đã trượt xuống dưới bụng con ngựa! Nhưng chân ta mất chỗ bám... Ta đập mạnh xuống đất – đến cả hơi thở cũng không đủ để kêu lên."
  tribal.1203.desc_sabotaged_racer:0 "Khi ta vừa sánh ngang [villain_racer.GetTitledFirstName], [villain_racer.GetSheHe] bất ngờ ép về phía ta, và cùng lúc đó ta nghe [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))] của ta là [racer.GetTitledFirstName] hét lên đau đớn. Ta quay lại trong yên ngựa và thấy [racer.GetHerHim] nằm trên đất, đầy máu, còn con ngựa của [racer.GetHerHis] đang hoảng loạn chống lại chiếc yên không còn trên lưng mà treo lủng lẳng dưới bụng."
  tribal.1203.desc_sabotaged_villain:0 "Đột nhiên ta nghe thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] [villain_racer.GetTitledFirstName] của ta thét lên đau đớn. Ta quay trên yên ngựa để thấy [villain_racer.GetHerHim] trên mặt đất, đầy máu, mảnh vỡ dây cương [villain_racer.GetHerHis] của hắn trong tay."
  tribal.1203.desc:0 "Không gì sánh bằng cảm giác này! Gió lướt qua, tiếng vó ngựa dồn dập, và— Khi ta sánh ngang [villain_racer.GetTitledFirstName], [villain_racer.GetSheHe] bất ngờ ép sát vào ta, suýt khiến ngựa của ta mất thăng bằng!"
  tribal.1203.a:1 "Ta phải quay lại giúp [villain_racer.GetHerHim]!"
  tribal.1203.b_nothing_sabotaged:0 "Chỉ là vài chuyện vặt."
  tribal.1203.b:0 "Tốt! Bớt đi một đối thủ."
  tribal.1203.b.tt:0 "Ngươi tập trung vào cuộc đua"
  tribal.1203.c:0 "Ít ra con ngựa không đè lên ta..."
  tribal.1203.d:0 "Giờ thì tới lượt ngươi rồi, [villain_racer.GetFirstNameNoTooltip]!"
  tribal.1203.d.success:0 "Ta #EMP vô tình#! húc ngựa của [villain_racer.GetHerHis] hơi quá mạnh"
  tribal.1203.d.failure:0 "Ta bị chậm lại trong chốc lát"
  tribal.1203.d.failure.tt:0 "Ta có thể sẽ xếp hạng thấp hơn"
  tribal.1203.e:0 "Ta nghĩ mình đủ gần để nhảy qua..."
  tribal.1203.success:0 "Ta xoay sở để hất [villain_racer.GetHerHim] khỏi con ngựa [villain_racer.GetHerHis] của hắn"
  tribal.1203.failure:0 "Chính ta mới là kẻ bị hất văng"

  tribal.1204.desc_slow:0 "Mất rất nhiều phút dài đằng đẵng, cuối cùng ta cũng vượt qua vạch đích.\n\n"
  tribal.1204.desc_fast:0 "Ta được chào đón bằng tiếng gầm vang của đám đông khi phi qua vạch đích.\n\n"
  tribal.1204.desc_racer:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))] [racer.GetTitledFirstName] của ta đã ăn mừng chiến thắng [racer.GetHerHis] của ngài, được bao quanh bởi mọi người và được tắm trong những món quà, và [racer.GetSheHe] vẫy tay chào ta một cách hạnh phúc."
  tribal.1204.desc_villain:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] [villain_racer.GetTitledFirstName] của ta đã ăn mừng chiến thắng [villain_racer.GetHerHis] của ngài, được bao quanh bởi mọi người và được tắm trong những món quà, và [villain_racer.GetSheHe] cười nhếch mép và vẫy tay ngay khi [villain_racer.GetSheHe] nhìn thấy ta."
  tribal.1204.desc_you:0 "Mọi người nhanh chóng kéo đến chúc mừng ta, cố chạm vào con ngựa của ta, nhảy múa... Hầu như không ai để ý khi [racer.GetTitledFirstName] và [villain_racer.GetTitledFirstName] về đích; đám đông quá bận ăn mừng cùng ta!"
  tribal.1204.desc_you_jumped_horses:0 "Mọi người đến chúc mừng ta, nhưng sự bối rối nảy sinh khi họ thấy ta đang cưỡi ngựa của [villain_racer.GetTitledFirstNamePossessive] và dắt theo con ngựa của mình. Dù vậy vẫn có nhảy múa và ăn mừng, và hầu như không ai chú ý khi [racer.GetTitledFirstName] và [villain_racer.GetTitledFirstNameNoTooltip] về đích, người sau thì chạy bộ."
  tribal.1204.a:0 "Đúng vậy, ta rất nhanh, cảm ơn!"
  tribal.1204.b:0 "Lần sau ta sẽ thắng!"

  tribal.1301.t:0 "Cuộc Chạm Trán Chết Người"
  tribal.1301.desc:0 "Ta đang thăm một trong những con sông nhỏ gần [capital.GetName]. Khi ta chuẩn bị làm dịu cơn khát của mình, một [peasant.GetWomanMan] địa phương kiên quyết đứng chắn [peasant.GetHerselfHimself] giữa ta và con sông — thật quá đáng!\n\nNgay khi ta chuẩn bị ra lệnh đuổi [peasant.GetHerHim] đi, [peasant.GetSheHe] lên tiếng: \"Có một con cá sấu trong nước, thưa [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\n[peasant.GetSheHe|U]... [peasant.GetSheHe|U] đã #EMP bảo vệ#! ta sao?"
  tribal.1301.a:0 "Cảm ơn! Đây, cho ngôi làng của ngươi."
  tribal.1301.b:0 "Ta có thể dùng một [peasant.GetWomanMan] như ngươi."
  tribal.1301.c:0 "Cá sấu à? Hừ! Ta chẳng thấy con nào cả."
  tribal.1301.d:0 "À... Cảm ơn. Giờ thì đi đi."
  tribal.1301.d.tt:0 "Ta nghe theo lời cảnh báo của [peasant.GetHerHis]"

  tribal.1302.desc:0 "Ta tiến đến mép nước, phớt lờ [peasant.GetWomanMan], rồi cúi xuống hứng làn nước mát vào tay. Không có dấu hiệu của sinh vật nào ngoài lũ côn trùng!\n\nKhi ta định uống thêm một ngụm nữa, ta nghe thấy mặt nước động đậy, và rồi... #EMP Đau đớn#!. Đau đớn khủng khiếp. Ta nhìn xuống, và thấy một cái hàm khổng lồ đang kẹp chặt chân ta, máu rỉ ra giữa những chiếc răng sắc nhọn."
  tribal.1302.a:0 "AAAAH!! BỎ RA!!"

  tribal.1303.t:0 "Ốc Đảo"
  tribal.1303.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến lại gần ta. \"Một ốc đảo vừa được phát hiện gần [capital.GetName]. Ngài muốn ta làm gì?\"\n\nMột ốc đảo! Nguồn nước và sự sống... hoặc tiền bạc."
  tribal.1303.a:0 "Nó sẽ mang lại phồn thịnh – hãy làm hệ thống tưới tiêu!"
  tribal.1303.b:0 "Dùng cho tưới tiêu, nhưng không miễn phí."
  tribal.1303.c:0 "Cứ để dân chúng tự sử dụng theo cách tốt nhất."
