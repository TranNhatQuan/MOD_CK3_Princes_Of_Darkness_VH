l_english:
 # Missionary, console a local
 pilgrimage_intent.1000.t:0 "$zealotry_intent_header$ Khủng Hoảng Đức Tin"
 pilgrimage_intent.1000.desc:0 "Khi ta tiếp tục hành trình thiêng liêng của mình, ta gặp một [sad_peasant.GetWomanMan] bên vệ đường, người lấm đầy bùn đất và ướt đẫm nước mắt của [sad_peasant.GetHerHis].\n\n"Giờ ngươi hài lòng chưa? Ngươi đã lấy đi tất cả của ta! Làm sao ta có thể tiếp tục sống trong một thế giới bị cai trị bởi một kẻ tàn nhẫn như [sad_peasant.GetFaith.HighGodName|U]?"\n\nRõ ràng, [sad_peasant.GetSheHe] đang tuyệt vọng và rơi vào một cuộc khủng hoảng đức tin."
 pilgrimage_intent.1000.a:0 ""Câu trả lời nằm ở [ROOT.Char.GetFaith.HealthGodName|U].""
 pilgrimage_intent.1000.a.alternate:0 ""Ta có thể đưa ra một góc nhìn khác chăng?""
 pilgrimage_intent.1000.a.conversion_succesful.t:0 "Cải Đạo Thành Công"
 pilgrimage_intent.1000.a.conversion_succesful.desc:0 "Ngươi cải đạo cho [sad_peasant.GetHerHim]"
 pilgrimage_intent.1000.a.conversion_failed.t:0 "Cải Đạo Thất Bại"
 pilgrimage_intent.1000.a.conversion_failed.desc:0 "Ngươi không thể cải đạo cho [sad_peasant.GetHerHim]"
 pilgrimage_intent.1000.b:0 ""Chúng ta đang trên hành trình thiêng liêng. Hãy đi cùng chúng ta.""
 pilgrimage_intent.1000.b.joined.t:0 "Gia Nhập Cuộc Hành Hương"
 pilgrimage_intent.1000.b.joined.desc:0 "[sad_peasant.GetSheHe|U] gia nhập cuộc hành hương của ngươi"
 pilgrimage_intent.1000.b.not_joined.t:0 "Lời Mời Bị Từ Chối"
 pilgrimage_intent.1000.b.not_joined.desc:0 "[sad_peasant.GetSheHe|U] không bị thuyết phục"
 pilgrimage_intent.1000.c:0 "Đây là những giọt nước mắt của [ROOT.Char.GetFaith.TricksterGodNamePossessive|U]."
 # Missionary, convert a child
 pilgrimage_intent.1001.t:0 "$zealotry_intent_header$ Tuổi Trẻ Dễ Uốn Nắn"
 pilgrimage_intent.1001.desc:0 "Chúng ta đã thấy không ít đức tin kỳ lạ trên hành trình đến thánh địa, và khi đi qua [ROOT.Char.GetCurrentLocation.GetName], ta thấy một nhóm trẻ con đang nô đùa bên vệ đường.\n\nChúng lập tức dừng lại và nhìn chúng ta với ánh mắt đầy kinh ngạc, như thể chúng ta chỉ là những thứ kỳ lạ hiếm thấy. Chúng chưa từng thấy các tín đồ hành hương [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] trước đây sao? Một đứa trẻ trong số đó đặc biệt mang phong thái quý tộc! Có lẽ đứa trẻ ấy sẽ thích nghe vài câu chuyện từ [ROOT.Char.GetFaith.ReligiousText]."
 pilgrimage_intent.1001.a:0 ""Ta sẽ dạy ngươi.""
 pilgrimage_intent.1001.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.b.joined.t$"
 pilgrimage_intent.1001.a.conversion_succesful.desc:0 "Ngươi cải đạo cho đứa trẻ"
 pilgrimage_intent.1001.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1001.a.conversion_failed.desc:0 "Ngươi không thể cải đạo cho đứa trẻ"
 pilgrimage_intent.1001.b:0 "Chúng ta tiếp tục lên đường."
 # Local courtier is passing by, convert them and bring them on your pilgrimage!
 pilgrimage_intent.1010.t:0 "$zealotry_intent_header$ Lữ Khách Đi Ngang"
 pilgrimage_intent.1010.desc:0 "Chúng ta tiếp tục hành trình qua [ROOT.Char.GetCurrentLocation.GetName], đôi chân ngày càng đau nhức và mệt mỏi.\n\nChúng ta nhìn thấy một quý tộc từ triều đình địa phương ngay phía trước và [convertable_courtier.GetSheHe] cưỡi ngựa tiến đến gặp đoàn của chúng ta.\n\n"Rõ ràng các ngươi đã lạc đường, bằng hữu. Điều gì đưa một kẻ hèn mọn [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]?""
 pilgrimage_intent.1010.a:0 ""Chúng ta đang trên một hành trình thiêng liêng. Hãy gia nhập cùng chúng ta.""
 pilgrimage_intent.1010.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1010.a.conversion_succesful.desc:0 "Ngươi cải đạo cho [convertable_courtier.GetHerHim]"
 pilgrimage_intent.1010.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1010.a.conversion_failed.desc:0 "Ngươi không thể cải đạo cho [convertable_courtier.GetHerHim]"
 pilgrimage_intent.1010.b:0 ""Chuyện đó không liên quan gì đến ngươi!""
 # Fellow pilgrims of a different faith are on your path
 pilgrimage_intent.1020.t:0 "$zealotry_intent_header$ Những Người Hành Hương Xa Lạ"
 pilgrimage_intent.1020.desc:0 "Cho đến nay, chúng ta đã gặp nhiều người hành hương [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] trên tuyến đường này, và tất cả đều mộ đạo và tận tâm với ý chí của [ROOT.Char.GetFaith.HighGodNamePossessive|U].\n\nTuy nhiên, chẳng bao lâu sau chúng ta lại đồng hành cùng một nhóm lữ khách kỳ lạ từ những vùng đất xa xôi. Họ tự giới thiệu mình là [pilgrim_character.GetFaith.GetAdherentNamePlural], và nói rằng con đường này cũng linh thiêng đối với dân tộc của họ."
 pilgrimage_intent.1020.a:0 ""Chỉ có [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] mới được đi trên hành trình này.""
 pilgrimage_intent.1020.a.conversion_succesful.t:0 "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1020.a.conversion_succesful.desc:0 "Ngươi cải đạo cho những người hành hương"
 pilgrimage_intent.1020.a.conversion_failed.t:0 "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1020.a.conversion_failed.desc:0 "Ngươi không thể cải đạo cho những người hành hương"
 pilgrimage_intent.1020.b:0 ""Hãy kể cho ta nghe các ngươi thờ phụng [pilgrim_character.GetFaith.HighGodName|U] như thế nào.""
 pilgrimage_intent.1020.c:0 "Chúng ta thật giống nhau, họ nên đi cùng chúng ta!"
 cheaper_to_convert_to_pilgrim_faith_tt:0 "Ngươi nhận được giảm giá #P 50%#! khi cải đạo sang [THIS.Char.GetFaith.GetName]"
 # You see a particularly calming clearing along your way and stop to meditate
 pilgrimage_intent.1030.t:0 "$reflections_intent_header$ Khoảng Trống Yên Bình"
 pilgrimage_intent.1030.desc:0 "Tại nơi yên tĩnh bên đường của [ROOT.Char.GetCurrentLocation.GetName], ta cảm thấy một cảm giác bình yên và tĩnh lặng tràn ngập trong lòng, như chưa từng trải qua trước đây.\n\nNgay sau một gờ đất nhỏ, ta thấy một khoảng trống bên lối mòn nơi dường như không người hay thú nào đặt chân đến suốt nhiều thập kỷ. Ta có thể cảm nhận được sự hiện diện của [ROOT.Char.GetFaith.HighGodNamePossessive|U] nơi đây, và có lẽ ta nên nán lại trong sự chiêm nghiệm tĩnh lặng một lúc."
 pilgrimage_intent.1030.desc_sea:0 "Ngoài khơi xa này, khi thời tiết yên bình và không một con tàu nào xuất hiện nơi chân trời, sự tĩnh lặng thật bao trùm. Sự hiện diện của [ROOT.Char.GetFaith.HighGodNamePossessive|U] nơi đây đặc biệt mạnh mẽ, và nó khiến tâm hồn ta tràn đầy.\n\nCó lẽ chúng ta nên tận dụng cơ hội để chiêm nghiệm trong yên lặng bằng cách nán lại vịnh này thêm một lúc?"
 pilgrimage_intent.1030.a:0 "Đây là ý chỉ của [ROOT.Char.GetFaith.HighGodNamePossessive|U]."
 pilgrimage_intent.1030.b:0 "Chúng ta không được chậm trễ!"
 
 # You spot an animal, follow it for an omen?
 pilgrimage_intent.1040.t:0 "$reflections_intent_header$ Điềm Báo Từ Dã Thú"
 pilgrimage_intent.1040.desc.intro:0 "Khi chúng ta tiến bước trên con đường thiêng liêng này, đoàn bất chợt phải dừng lại khi một con thú bước ra ngay giữa lối đi của chúng ta.\n\n"
 pilgrimage_intent.1040.desc.mid.pred:0 "Một con [ROOT.Char.Custom('GetAnimalType')] hùng mạnh đứng giữa ta và thánh địa."
 pilgrimage_intent.1040.desc.mid.prey:0 "Một con [ROOT.Char.Custom('GetAnimalType')] nhỏ bé nhìn chằm chằm vào đoàn hành hương của chúng ta."
 pilgrimage_intent.1040.desc.outro:0 "\n\nCó một vẻ mặt hiểu biết trên khuôn mặt của con thú. Như thể tâm trí của một [ROOT.Char.GetWomanMan] già thông thái đang trú ngụ đằng sau đôi mắt hoang dã đó. [ROOT.Char.GetSheHe|U] chớp mắt rồi tiếp tục con đường của [ROOT.Char.GetHerHis]."
 pilgrimage_intent.1040.a:0 "Con [ROOT.Char.Custom('GetAnimalType')] ấy là sứ giả của [ROOT.Char.GetFaith.HighGodName]! Theo [ROOT.Char.GetHerHim]!"
 pilgrimage.you_lose_the_animal.t:0 "Mất Dấu Con Vật"
 pilgrimage.you_lose_the_animal.desc:0 "Ngươi đã mất dấu con [ROOT.Char.Custom('GetAnimalType')]"
 pilgrimage_intent.1040.b:0 "Chúng ta không thể để bị phân tâm."
 # Good omen (predator)
 pilgrimage_intent.1041.t:0 "Điềm Báo: Cuộc Săn Thành Công"
 pilgrimage_intent.1041.desc.intro:0 "Ta cẩn thận bám theo con [ROOT.Char.Custom('GetAnimalType')], chú ý để [ROOT.Char.GetSheHe] không phát hiện ra ta.\n\nCuối cùng, [ROOT.Char.GetSheHe] cũng gặp con mồi của [ROOT.Char.GetHerHis]: một con chim nhỏ."
 pilgrimage_intent.1041.desc.mid:0 "[ROOT.Char.Custom('GetAnimalType')] thực hiện di chuyển của [ROOT.Char.GetHerHis], và khi con chim cố gắng trốn thoát một cách yếu ớt, nó nhanh chóng bị xé thành lông vũ và máu me."
 pilgrimage_intent.1041.desc.outro:0 "\n\nKhông biết [ROOT.Char.GetFaith.HighGodName|U] muốn ngụ ý điều gì qua việc này?"
 pilgrimage_intent.1041.a:0 "Những cuộc chiến của ta sẽ thắng lợi!"
 pilgrimage_intent.1041.b:0 "Kẻ thù của ta sẽ gục ngã khi ta vồ lấy chúng!"
 # Bad omen (predator)
 pilgrimage_intent.1042.t:0 "Điềm Báo: Cuộc Săn Thất Bại"
 pilgrimage_intent.1042.desc.mid:0 "[ROOT.Char.Custom('GetAnimalType')] chờ đợi và chờ đợi cơ hội của [ROOT.Char.GetHerHis], và cuối cùng tấn công con chim chỉ để nó thoát ra và bay đi vào bầu trời rộng mở."
 pilgrimage_intent.1042.a:0 "Ta chính là con [ROOT.Char.Custom('GetAnimalType')], và kẻ thù sẽ đánh bại ta."
 pilgrimage_intent.1042.b:0 "Ta là con chim, và ta sẽ thoát khỏi số phận xấu!"
 # Good omen (prey)
 pilgrimage_intent.1043.t:0 "Điềm Báo: Gia Đình Hạnh Phúc"
 pilgrimage_intent.1043.desc.intro:0 "Ta bám theo con [ROOT.Char.Custom('GetAnimalType')], giữ khoảng cách để không làm [ROOT.Char.GetHerHim] hoảng sợ. Cuối cùng, [ROOT.Char.GetSheHe] gặp một con [ROOT.Char.Custom('GetAnimalType')] khác trong khoảng trống phía trước, có lẽ là bạn đời của [ROOT.Char.GetHerHis]?\n\n"
 pilgrimage_intent.1043.desc.mid:0 "Hai con khẽ húc đầu vào nhau, nhưng rồi lại cọ đầu thân mật trước khi cùng nhau biến mất vào vùng hoang dã."
 pilgrimage_intent.1043.a:0 "Chẳng bao lâu nữa ta sẽ có con!"
 pilgrimage_intent.1043.b:0 "Ta phải biến kẻ thù thành bằng hữu."
 pilgrimage_intent.1043.c:0 "Ta nên đặt gia đình lên trước hết."
 # Bad omen (prey)
 pilgrimage_intent.1044.t:0 "Điềm Báo: Cảnh Tượng Kinh Hoàng"
 pilgrimage_intent.1044.desc.mid:0 "Hai con tiến lại gần nhau, nhưng trước khi kịp gặp gỡ, một bóng đen mờ ảo lao ra từ hư không và biến con vật tội nghiệp thành một vệt máu ngay trước mắt đồng loại của nó."
 pilgrimage_intent.1044.a:0 "Có thứ gì đó đang đến tìm ta!"
 pilgrimage_intent.1044.b:0 "Ta sẽ tiêu diệt kẻ thù mà không để chúng kịp nhận ra!"
 you_follow_the_animal_tt:0 "Ngươi theo con vật đi sâu hơn..."
 # You stop to contemplate on your age
 pilgrimage_intent.1050.t:0 "$reflections_intent_header$ Suy Ngẫm Về Cuộc Đời"
 pilgrimage_intent.1050.desc.intro:0 "Trên con đường đến thánh địa, ta đã gặp đủ loại người hành hương già trẻ khác nhau. Như thể ta đang nhìn thấy tấm thảm cuộc đời của chính mình trải ra trước mắt.\n\n"
 pilgrimage_intent.1050.desc.mid.old:0 "Tóc bạc và làn da nhăn nheo từng có vẻ xa vời, cho đến khi chúng đến với ta. Ta không khỏi cảm thấy rằng chuyến hành hương này có lẽ là lần cuối của mình, trước khi bước vào hành trình cuối cùng đến [ROOT.Char.GetFaith.PositiveAfterLife|U]."
 pilgrimage_intent.1050.desc.mid.young_and_dying:0 "Với sức khỏe yếu ớt của mình, cuộc đời ta có lẽ sẽ không dài như nhiều người khác. Khi nhìn thấy những gương mặt mỉm cười của những người may mắn được già đi, ta không khỏi cảm thấy ghen tị với cuộc sống dài lâu của họ."
 pilgrimage_intent.1050.desc.mid.young:0 "Ta vẫn còn nhiều năm tháng phía trước, vậy mà khi đối diện với khái niệm vĩnh hằng, mọi thứ dường như thật ngắn ngủi."
 pilgrimage_intent.1050.desc.outro:0 "\n\nCó lẽ ta nên dừng lại một lúc để suy ngẫm về sự ngắn ngủi của đời người."
 pilgrimage_intent.1050.a:0 "Ta sẽ tận dụng tối đa thời gian của mình."
 pilgrimage_intent.1050.b:0 "Ta vẫn còn rất nhiều cuộc đời để sống!"
 pilgrimage_intent.1050.c:0 "Những ý nghĩ này khiến lòng ta đau nhói."
 # You stop to contemplate ancient civilizations
 pilgrimage_intent.1060.t:0 "$reflections_intent_header$ Những Đế Chế Đã Qua"
 pilgrimage_intent.1060.desc.intro:0 "Trên con đường này, ta đã gặp vô số dấu tích của những người đi trước.\n\nTại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip],"
 pilgrimage_intent.1060.desc.mid.rome:0 "ta bắt gặp tàn tích đổ nát của một ngôi đền thờ các vị thần La Mã cổ đại. [GetFaithByKey('hellenic_pagan').FertilityGodName|U] trong vẻ đẹp của [GetFaithByKey('hellenic_pagan').FertilityGodHerHis] mỉm cười với ta bằng một khuôn miệng nứt vỡ, còn gương mặt của [GetFaithByKey('hellenic_pagan').HighGodNamePossessive] đã bị bào mòn gần như không thể nhận ra."
 pilgrimage_intent.1060.desc.mid.israel:0 "ta thấy vô số dấu tích của người Hebrew cổ xưa từng đến nơi này như miền đất hứa. Những ngôi đền cổ từng thờ phụng [GetFaithByKey('rabbinism').HighGodName|U] nay đã mục nát sau khi họ một lần nữa bị buộc phải lưu vong."
 pilgrimage_intent.1060.desc.mid.egypt:0 "ta thấy những công trình vĩ đại của các pharaoh cổ đại. Họ đã dành cả đời để dựng nên những cống phẩm khổng lồ bằng thạch cao và vàng cho các vị thần của mình, chỉ để giờ đây chúng phủ đầy cát bụi và mục nát theo thời gian."
 pilgrimage_intent.1060.desc.mid.persia:0 "ta liên tục thấy dấu tích của các đế chế Sassanid, Parthia và Seleucid cổ xưa. Vô số đế chế đã hưng thịnh rồi suy vong tại Ba Tư, nhưng chính Ba Tư vẫn còn đó. Những ngôi đền Hỏa giáo cổ nằm hoang phế khắp nơi, và có lẽ một ngày nào đó ngay cả các thánh địa của chúng ta cũng sẽ thành bụi."
 pilgrimage_intent.1060.desc.mid.ashokas_pillars:0 "ta lại thấy thêm một cột trụ của Ashoka, được dựng lên từ rất lâu. Mỗi cột đều khắc các chiếu chỉ do Hoàng đế Ashoka ban hành hàng thế kỷ trước. Những tượng đài Dharmic này trải khắp vùng đất từng thuộc Đế quốc Maurya, nhưng bản thân đế quốc ấy nay chỉ còn là tro bụi."
 pilgrimage_intent.1060.desc.mid.kush:0 "ta thấy dấu tích của nhiều đế chế từng hưng thịnh rồi suy tàn dọc sông Nile. Kim tự tháp Kush, đền đài Aksumite — khó mà đi đâu mà không nhìn thấy một di tích đổ nát của quá khứ."
 pilgrimage_intent.1060.desc.mid.fallback:0 "ta thấy dấu tích của những người từng sống nơi đây rất lâu trước chúng ta. Những ngôi đền cổ, vũ khí gãy nát, những mảnh vỡ không còn nhận ra được. Thời gian sẽ cuốn đi tất cả, và các vị thần chúng ta thờ phụng cùng cách chúng ta thờ phụng họ luôn thay đổi."
 pilgrimage_intent.1060.desc.outro:0 "\n\nCó lẽ một ngày nào đó, một [ROOT.Char.GetWomanMan] khác sẽ bước trên con đường này và suy ngẫm về sự sụp đổ của [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] cùng đức tin [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] của vị [ROOT.Char.GetTitleAsNameNoTooltip|U] từng cai trị nơi đây."
 pilgrimage_intent.1060.a:0 "Ta nên suy ngẫm về các đế chế xưa."
 pilgrimage_intent.1060.b:0 "Ta nên suy ngẫm về những đức tin cổ đại."
 pilgrimage_intent.1060.c:0 "Vớ vẩn, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sẽ tồn tại mãi mãi!"
 pilgrimage.drive_to_succeed.t:0 "Khát Vọng Thành Công"
 pilgrimage.existential_dread.t:0 "Nỗi Sợ Hiện Sinh"
 pilgrimage.existential_dread.desc:0 "Ngươi tràn ngập nỗi sợ về sự tồn tại"
 pilgrimage.drive_to_survive.t:0 "Ý Chí Sinh Tồn"
 pilgrimage.drive_to_survive.desc:0 "Ngươi quyết tâm sống sót"
 pilgrimage.imperial_contemplation.t:0 "Suy Ngẫm Về Đế Chế"
