 #Personal reflections
 pilgrimage_intent.1100.t:0 "$reflections_intent_header$ Bầu Trời Sao"
 pilgrimage_intent.1100.desc:0 "Ngoài kia, vào đêm khuya, ta đôi khi ngước nhìn các vì sao và tự hỏi. Mục đích của cuộc đời chúng ta là gì?\n\nLiệu [ROOT.Char.GetFaith.PantheonTerm] có thể nhìn thấy ta, khi ta ở xa quê nhà đến vậy? Ta đang làm tất cả điều này vì điều gì?"
 pilgrimage_intent.1100.a:0 "Đó là nghĩa vụ thiêng liêng của ta, dĩ nhiên!"
 pilgrimage_intent.1100.b:0 "Điều ta thực sự muốn là trải nghiệm và tận hưởng các nền văn hóa khác."
 pilgrimage_intent.1100.c:0 "Ta chỉ làm những gì vị trí của ta đòi hỏi."
 #Sea legs
 pilgrimage_intent.1110.t:0 "Chân Biển"
 pilgrimage_intent.1110.t_altruism:0 "$altruism_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_reflection:0 "$reflections_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_zealot:1 "$zealotry_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.desc:0 "Khi đi lại trên con tàu trong hành trình đến [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], ta thấy một người hành hương khác dường như không được khỏe. Rõ ràng [affected_pilgrim.GetHerHis] chưa từng quen với việc đi biển.\n\n[affected_pilgrim.GetSheHe|U] rên rỉ khe khẽ, ngồi thụp bên lan can và bám chặt lấy nó như bám lấy sinh mạng, gương mặt tái nhợt từng cơn."
 pilgrimage_intent.1110.desc.outro_altruism:0 "\n\nTa nên tìm cách an ủi [affected_pilgrim.GetHerHim]. Có lẽ ta nên cho [affected_pilgrim.GetHerHim] một ít nước của mình?"
 pilgrimage_intent.1110.desc.outro_reflection:0 "\n\nTa chỉ có thể cảm thông với [affected_pilgrim.GetHerHim]. Vì sao #EMP chúng ta lại#! tự đặt mình vào những hiểm nguy, đôi khi đe dọa cả tính mạng, như thế này?"
 pilgrimage_intent.1110.desc.outro_zealot:0 "\n\nTa tin rằng [ROOT.Char.GetFaith.PantheonTerm] sẽ trợ giúp chúng ta. Có lẽ chúng ta nên cầu nguyện để mọi chuyện qua nhanh?"
 pilgrimage_intent.1110.a:0 "Mọi thứ rồi sẽ ổn thôi, cứ cố gắng lên."
 pilgrimage_intent.1110.b:0 "Thử thách và gian truân #EMP vốn#! là một phần của hành trình..."
 pilgrimage_intent.1110.c:0 "Hãy cầu nguyện cho sự hồi phục của ngươi."
 pilgrimage_intent.1110.d:0 "Ta có vài loại thảo dược cho việc này."
 pilgrimage_intent.1110.e:0 "May mà không phải ta."
 #A local heathen is smitten with one of your entourage members and asks to marry them
 pilgrimage_intent.9000.t:0 "$zealotry_intent_header$ Một [ROOT.Char.Custom('GetDerogatoryNonbeliever')|U] Si Tình"
 pilgrimage_intent.9000.desc:0 "Trong khu chợ của [background_market_scope.GetName], một [smitten_heathen.GetWomanMan] quen thuộc xuất hiện. Như một con cún con, [smitten_heathen.GetSheHe] đã theo chúng ta suốt nhiều ngày.\n\nVới ánh mắt khẩn cầu, [smitten_heathen.GetSheHe] thốt lên: "Thưa [ROOT.Char.GetLadyLord|U] — [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_to_marry_2'))] của ngài, [entourage_to_marry_2.GetFirstName], liệu [entourage_to_marry_2.GetSheHe] có bao giờ yêu ta không? Bởi [entourage_to_marry_2.GetSheHe] là một [entourage_to_marry_2.GetFaith.GetAdherentName], còn ta thuộc đức tin [smitten_heathen.GetFaith.GetAdjective]... nhưng, liệu có hy vọng nào chăng?"\n\n[smitten_heathen.GetSheHe|U] dường như say mê đến mê muội, nhưng [entourage_to_marry_2.GetFirstNameNoTooltip] lại trông không chắc chắn. Liệu [ROOT.Char.GetFaith.HighGodName] có chấp thuận cuộc hôn nhân này?"
 pilgrimage_intent.9000.seducer:0 "Để ta chỉ cho ngươi cách làm!"
 pilgrimage_intent.9000.seducer.flavor:0 "Dạy cho [smitten_heathen.GetWomanMan] vài mánh khóe để khiến [entourage_to_marry_2.GetFirstName] nằm gọn trong tay [smitten_heathen.GetHerHis]."
 pilgrimage_intent.9000.a.flavor:0 "Trong cuộc hôn nhân của họ, [ROOT.Char.GetFaith.HighGodName] sẽ có thêm một tín đồ mới!"
 pilgrimage_intent.9000.b.flavor:0 "[smitten_heathen.GetFaith.GetAdherentNamePlural] hẳn có những nghi thức tán tỉnh thú vị, ta phải quan sát mới được."
 pilgrimage_intent.9000.a:0 "Hãy chấp nhận [ROOT.Char.GetFaith.HighGodName], rồi [entourage_to_marry_2.GetSheHe] sẽ là của ngươi."
 pilgrimage_intent.9000.b:0 "Ôi người bạn thân mến, ngươi nên nói chuyện với #EMP [entourage_to_marry_2.GetHerHim]#!, không phải với ta!"
 pilgrimage_intent.9000.c:0 "Chúng ta không có thời gian cho chuyện này..."
 hit_it_off_tt:0 "Họ hợp ý nhau"
 they_fight_publicly_tt:0 "Họ gây náo loạn trước công chúng"
