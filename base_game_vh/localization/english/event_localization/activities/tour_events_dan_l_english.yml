l_english:
  tour_travel.3000.t:0 "Không Có [ROOT.Char.GetFaith.HouseOfWorshipPlural|U]?"
  tour_travel.3000.desc:0 "Khi đi ngang qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ta ghé thăm một ngôi làng và dành chút thời gian bàn chuyện tín ngưỡng địa phương với một nông dân đặc biệt sùng đạo tên là [pious_peasant.GetName].\n\n"Ở đây chúng tôi thậm chí còn không có nổi một [ROOT.Char.GetFaith.HouseOfWorship]. Nếu muốn đặt chân vào một nơi thờ phụng [ROOT.Char.GetFaith.HighGodName|U], chúng tôi phải đi đường mấy ngày liền.""
  tour_travel.3000.a:0 "Chúng ta có thể giúp dựng một [ROOT.Char.GetFaith.HouseOfWorship] đơn sơ."
  tour_travel.3000.b:0 "Ta sẽ xây dựng một [ROOT.Char.GetFaith.HouseOfWorship] vĩ đại tại đây."
  tour_travel.3000.c:0 ""Vậy thì các ngươi cứ đi bộ thôi.""

  tour_travel.3001.t:0 "Nghi Lễ Bất Ngờ"
  tour_travel.3001.desc:0 "Chúng ta dừng chân tại một ngôi làng nhỏ ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Ta gần như đã ngồi hết bữa tiệc thì mới nhận ra có điều gì đó không ổn.\n\nTa nhận ra [marriage_mother.GetName], người liên tục nói về [marriage_candidate.Custom('GetDaughterSon')] của mình là [marriage_candidate.GetName], không chỉ đang khoe khoang — bà ta đang #EMP rao bán#!.\n\n"Khi hai người kết hôn, mọi thứ sẽ trở nên hoàn hảo!" [marriage_mother.GetNameNoTooltip] nói với ánh mắt đầy tự hào."
  tour_travel.3001.desc.drunkard:0 "Ta tỉnh dậy trong cơn mơ hồ, đầu đau như búa bổ, tai ù đi và ánh sáng xuyên vào tâm trí ta như dao găm. Miệng ta khô khốc như sa mạc, và trước khi ta kịp lẩm bẩm xin nước, ta thấy một người đàn bà nông dân lạ đứng cạnh giường với một bình nước.\n\n"Đây, thưa [ROOT.Char.Custom('FormOfAddressForLiege')], ngài sẽ cần nó sau đêm qua!"\n\nTa lăn người sang và thấy một người xa lạ đang ngủ ngon lành bên cạnh.\n\n"Suy cho cùng, đâu phải ngày nào [marriage_candidate.Custom('DaughterSon')] của ta cũng kết hôn với [ROOT.Char.GetTitleAsNameNoTooltip|U]!"" 
  tour_travel.3001.a:0 "Quả là một ý tưởng tuyệt vời."
  tour_travel.3001.a.drunkard:0 "#EMP Ta đã làm gì thế này?#!"
  tour_travel.3001.b:0 "Không, ta không cưới những nông dân bẩn thỉu."

  tour_travel.3002.t:0 "Cái Giá Của Chiến Tranh"
  tour_travel.3002.desc:0 "\"[widow_peasant.Custom2( 'RelationToMeShort', widow_father )], [widow_peasant.Custom2( 'RelationToMeShort', widow_husband )], rồi [widow_peasant.Custom2( 'RelationToMeShort', widow_son )] của tôi đều chết cả trong #EMP cuộc chiến của ngài#!.\" Một người nông dân đang gào thét vào mặt ta giữa quảng trường làng.\n\n\"Khi [battle_memory.GetSecondPerspectiveDescription], đó là chiến thắng của ngài, nhưng với tôi, đó là ngày mà ba thế hệ gia đình tôi đều tan nát.\"\n\nSự phẫn nộ của [widow_peasant.GetHerHis|U] dần chuyển thành những giọt nước mắt, và những lời cuối của [widow_peasant.GetSheHe] gần như không lọt vào tai ta.\n\n\"Ngài chẳng phải là [ROOT.Char.GetTitleAsNameNoTooltip|l] của tôi.\""
  tour_travel.3002.a:0 ""Ta không thể đưa họ trở lại, nhưng có lẽ chút vàng sẽ giúp ích.""
  tour_travel.3002.b:0 ""Đó là cái giá ta sẵn sàng trả.""

  tour_travel.3003.t:0 "Những Sinh Vật Ghê Tởm"
  tour_travel.3003.desc:0 "Tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], chúng ta dừng lại nói chuyện với người nông dân thứ một trăm trong ngày, và dạ dày ta quặn lại chỉ vì nhìn những sinh vật khốn khổ này.\n\nRăng vàng úa và gãy nát, đôi mắt đờ đẫn trống rỗng che giấu bộ não mục nát thất học. Mỗi kẻ mang theo những căn bệnh vô danh khiến gương mặt chúng đầy những mụn nhọt và vết lở loét.\n\nTa thật sự không thể quan tâm nổi đến bất kỳ lời nào chúng nói."
  tour_travel.3003.a:0 "Giả vờ quan tâm đến họ là nghĩa vụ của ta."
  tour_travel.3003.b:0 "Ta sẽ nói cho chúng biết ta nghĩ gì về chúng."

  tour_travel.3004.t:0 "Bức Tượng Xấu Xí"
  tour_travel.3004.desc:0 "Ta đã được báo trước rằng dân làng ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] đã cùng nhau dựng một bức tượng của ta.\n\nNhưng khi đến nơi và nhìn thấy nó, ta thực sự không biết mình đang nhìn cái gì. Không những đó là thứ xấu xí nhất ta từng thấy, mà nó còn chẳng giống ta chút nào!\n\nTuy nhiên khi nhìn quanh, ta chỉ thấy những gương mặt đầy tự hào đang nhìn lên ta. Không ai khác thấy nó tệ đến mức nào sao?"
  tour_travel.3004.a:0 "Thật là... tuyệt vời"
  tour_travel.3004.b:0 "Đây là một #EMP trò đùa#! sao? Phá nó đi!"
  tour_travel.3004.c:0 "Thực ra... nó khá giống đấy."

  tour_travel.3005.t:0 "Tội Danh Quen Thuộc"
  tour_travel.3005.desc:0 "Khi đi ngang qua [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ta thấy một tù nhân khốn khổ bị xích vào cọc như một con chó. [criminal_peasant.GetSheHe] gọi với theo ta, cầu xin lòng thương xót.\n\n"Tội của ngươi là gì?" ta hỏi với vẻ uy quyền xứng với một [ROOT.Char.GetTitleAsNameNoTooltip].\n\n"Tôi bị buộc tội là một [criminal_secret.GetNameNoTooltip]: một cáo buộc mà đáng tiếc là tôi không thể chối cãi."\n\nVài giọt mồ hôi lấm tấm trên trán ta, bởi suy cho cùng #EMP ta#! cũng là một [criminal_secret.GetNameNoTooltip]."
  tour_travel.3005.a:0 "Thả [criminal_peasant.GetHerHim] ra!"
  tour_travel.3005.b:0 "Quả là một tội ác khủng khiếp..."

  tour_travel.3006.t:0 "Cuộc Đời Của Kẻ Cai Trị"
  tour_travel.3006.desc:0 "Vài người nông dân tụ tập quanh ta, xin nghe những câu chuyện từ cuộc đời ta. Ta nghĩ xem nên kể điều gì cho họ, và hai câu chuyện hiện lên trong đầu. Một là khi [positive_memory.GetDescription], đó là một ký ức đẹp.\n\nMặt khác, khi [war_memory.GetDescription] lại là một câu chuyện hùng tráng hơn, có lẽ sẽ khơi dậy lòng trung thành và nhiệt huyết."
  tour_travel.3006.a:0 "Ta sẽ kể câu chuyện đầu tiên."
  tour_travel.3006.b:0 "Ai cũng thích chuyện chiến tranh."

  tour_travel.3007.t:0 "Nhà Khoái Lạc"
  tour_travel.3007.desc:0 "Khi chúng ta dừng lại nghỉ đêm nay, một người địa phương đề nghị dẫn chúng ta đi tham quan thị trấn.\n\nTa chỉ thực sự hiểu ý nghĩa của lời đó khi nhận ra mình đang ở sâu trong một ổ khoái lạc.\n\nBên trái ta, người ta đang ân ái như thể tận thế sắp đến. Bên phải ta, một người biểu diễn đang cố thực hiện thứ trông giống như #EMP [ROOT.Char.Custom('GetDescriptorManeuver')] [random_event_culture.GetNameNoTooltip] [ROOT.Char.Custom('GetManeuver')].#!"
  tour_travel.3007.a:0 "Ta phải rời khỏi đây ngay."
  tour_travel.3007.b:0 "Có lẽ ta cũng nên tham gia."

  tour_travel.3010.t:0 "Anh Hùng Địa Phương"
  tour_travel.3010.desc:0 "Khi băng qua những [shrine_province.Custom('GetTerrainTypePlural')], lê bước qua [shrine_province.Custom('GetProvinceGroundDesc')], chúng ta bắt gặp một ngôi đền thờ nhỏ đơn sơ. Ngôi đền được chạm khắc thô sơ, trên đỉnh có gắn hình [shrine_province.GetCounty.GetFaith.ReligiousSymbol], bên dưới là dòng chữ đã bạc màu:\n\n#EMP 'Nơi an nghỉ của Thánh [saint_name.GetFirstNameNoTooltip] xứ [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip], [saint_name.Custom('GetDaughterSon')] được ban phước của [shrine_province.GetNameNoTooltip]'#!\n\nThánh [saint_name.GetFirstNameNoTooltip]? Xứ [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip]? Có vẻ như người dân nơi đây đang tôn thờ một nhân vật tinh thần địa phương; một vị không được các [ROOT.Char.GetFaith.AltPriestTermPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] công nhận..."
  tour_travel.3010.a:0 "Đập tan dị giáo này!"
  tour_travel.3010.b:0 "'Thánh [saint_name.GetFirstNameNoTooltip]'... nghe cũng hay đấy."
  tour_travel.3010.c:0 "Tốt hơn là chúng ta nên đi tiếp."
  cultural_acceptance_local_saint:0 "Thánh địa phương"

  tour_travel.3020.t:0 "Một Mình Trong Bóng Tối"
  tour_travel.3020.desc:0 "Chúng ta trú ẩn khỏi buổi chiều [ROOT.Char.GetCurrentLocation.Custom('GetBadWeatherDesc')] trong một quán trọ chật hẹp, nhâm nhi đồ uống khi gió rít gào bên ngoài. Từng người một, các thành viên trong đoàn đều lui về phòng ngủ.\n\nTa đang đắm chìm trong suy nghĩ thì nhận ra cây nến đã gần tàn, trong phòng chỉ còn lại ta với [love_professor.GetFirstName] – [ROOT.Char.Custom2('RelationToMeShort', love_professor)] của ta. Ánh mắt [love_professor.GetHerHis] có điều gì đó thật khác lạ.\n\nMột thoáng lặng im giữa đôi ta trước khi [love_professor.GetSheHe] cau mày, cẩn trọng lựa lời. \"Ngài biết không, tôi ngưỡng mộ ngài #EMP vô cùng#!, [ROOT.Char.GetFirstNameNoTooltip] — ý tôi là [ROOT.Char.GetTitleAsNameNoTooltip]...\" Một nụ cười e ấp thoáng qua trên môi [love_professor.GetHerHis]."
  tour_travel.3020.a:0 "Lại đây, mọi người đều đã ngủ cả rồi."
  tour_travel.3020.c:0 "Ha! Ngươi nghĩ mình là ai?!"
  tour_travel.3020.d:0 "Ta nên đi nghỉ..."

  tour_travel.3030.t:0 "Sự Thật"
  tour_travel.3030.desc:1 "Chúng ta tiến đến một thôn nhỏ nơi một [wrongfully_accused.GetWomanMan] tội nghiệp bị trói trên giá treo cổ, đám đông tụ tập bên dưới.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! Là [ROOT.Char.GetTitleAsNameNoTooltip]!" Một nông dân chen qua đám đông, khóc lóc: "Xin hãy giúp! [wrongfully_accused.Custom('WifeHusband')] của tôi vô tội!""
  tour_travel.3030.framed:1 "[wrongfully_accused.GetSheHe|U] không làm chuyện đó, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]! Tôi biết mà!""
  tour_travel.3030.pinned:1 "Bọn khốn này đổ tội của chúng lên người khác!""
  tour_travel.3030.wrongful:1 "Đó là lời dối trá! Không ai thấy cả!""
  tour_travel.3030.outro:0 "Họ kéo [accused_partner.GetHerHim] đi, tiếng khóc vang lên: "Không! #EMP [wrongfully_accused.GetFirstName]...!#!" khi [accused_partner.GetSheHe] bị lôi dọc con phố.\n\nViên chức cúi đầu bối rối: "Xin lỗi thưa [ROOT.Char.GetLadyLord]! Đừng để ý [accused_partner.GetHerHim], [wrongfully_accused.GetWomanMan] #EMP chắc chắn#! có tội — ngài đừng bận tâm...""
  tour_travel.3030.a:0 "Ta muốn nghe cáo trạng..."
  tour_travel.3030.b.sadistic:0 "À, ta rất thích xem treo cổ!"
  tour_travel.3030.b:0 "Tiếp tục đi."
  tour_travel.3030.c:0 "Ngươi gặp may đấy, chúng ta có đao phủ giỏi nhất của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] ở đây!"
  tour_travel.3030.d:0 "Ta... đến để ân xá cho [wrongfully_accused.GetHerHim]! Và cả [accused_partner.GetHerHim]!"

 tour_travel.3040.t:0 "Một Ngôi Làng Bất Hạnh"
 tour_travel.3040.desc:0 "Khi chúng ta phi ngựa ngang qua rìa một ngôi làng nhỏ nằm tại ngã tư đường, một thường dân hoảng hốt tiến lại gần, đôi mắt [bandit_mayor.GetHerHis] mở to vì nhẹ nhõm.\n\n"Tạ ơn trời! Ngài phải giúp chúng tôi, thưa [ROOT.Char.GetLadyLord] tốt bụng!" Ta và đoàn tùy tùng trao nhau những ánh nhìn nghi ngờ. "Những kẻ cướp đào ngũ đã cướp bóc làng chúng tôi suốt nhiều ngày, chúng đã lấy gần như mọi thứ!"\n\n"
 tour_travel.3040.own:0 "Đây là một nơi nhỏ bé, nhưng vô pháp vô thiên trong lãnh địa của ta là điều không thể chấp nhận."
 tour_travel.3040.liege:0 "Vậy ra, [ROOT.Char.GetTopLiege.GetTitledFirstName] không giữ được trật tự tại..."
 tour_travel.3040.realm:0 "Có vẻ như lãnh địa của [ROOT.Char.GetLiege.GetTitledFirstNamePossessive] gần như vô pháp vô thiên..."
 tour_travel.3040.foreign:0 "Xem ra trật tự của [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] lỏng lẻo hơn so với [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
 tour_travel.3040.a.martial:0 "Theo ta, lính canh! Hãy bất ngờ tập kích bọn vô lại đó!"
 tour_travel.3040.a:0 "Lính canh, theo ta, đi bất ngờ tập kích bọn vô lại đó!"
 tour_travel.3040.b:0 "#EMP Gần như#! mọi thứ sao?"
 tour_travel.3040.c:0 "Ta e rằng ta còn việc tốt hơn để làm, nông dân."
 tour_travel.3040.c.foreign:1 "Đây là chuyện dành cho [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTitleAsNameNoTooltip] của ngươi, nông dân."
