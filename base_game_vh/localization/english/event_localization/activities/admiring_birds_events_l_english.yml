l_english:
 admiring_birds.1001.t:0 "Ồ! Một con chim!"
 admiring_birds.1001.common_raven.desc:0 "Giai điệu vang đến tai ta không thể nhầm lẫn: tiếng hót của một con quạ. Đậu trên một cành cây, con chim dường như đang đuổi theo thứ gì đó."
 admiring_birds.1001.common_merganser.desc:0 "Chiếc mào này khá dễ nhận ra. Làm tổ trong một hốc cây, con vịt merganser cẩn thận bảo vệ trứng của nó. Bạn đời của nó không thấy đâu, có lẽ đang đi bắt cá."
 admiring_birds.1001.common_loon.desc:0 "Bộ lông đen trắng, màng nối giữa các ngón chân, cú cất cánh vụng về. Hmm... Khá khó để xác định, nhưng hẳn đó là một con loon."
 admiring_birds.1001.golden_eagle.desc:0 "Thật là một sinh vật hùng vĩ! Ta thật may mắn khi được chứng kiến màn săn mồi của con đại bàng vàng này. Con gặm nhấm tội nghiệp thậm chí còn không kịp nhận ra cái chết đang đến. Màu nâu sẫm chủ đạo của bộ lông hẳn là lớp ngụy trang tuyệt vời."
 admiring_birds.1001.red_crossbill.desc:0 "Một giai điệu yên tĩnh và thanh bình lọt vào tai ta. Ban đầu ta không thể xác định nguồn gốc khi âm thanh vang vọng giữa những tán cây. Rồi đột nhiên ta thấy vài bóng dáng màu cam đậu trên ngọn cây. Một vài con sẻ mỏ chéo đỏ đang kiếm ăn trong rừng thông."
 admiring_birds.1001.northern_harrier.desc:0 "Dù có thể bị nhầm với cú mèo, con diều Bắc Mỹ kiêu hãnh này lại phân biệt bằng việc săn mồi giữa ban ngày."
 admiring_birds.1001.great_egret.desc:0 "Bộ lông trắng tinh khôi trông như một đám mây trên mặt hồ. Đôi chân dài mảnh của con cò trắng lớn dường như tan vào ánh sáng, khiến phần thân trên của nó trông như đang lơ lửng."
 admiring_birds.1001.black_tern.desc:0 "Khi đi dọc mép một đồng cỏ, ta bắt gặp một đàn nhạn đen đang đuổi nhau, vút lên nhanh chóng với những nhịp đập cánh mạnh mẽ và kêu gọi đầy phấn khích. Có lẽ đang vào mùa sinh sản?"
 admiring_birds.1001.osprey.desc:0 "Khi đi ngang qua một cái hồ, một con chim lao vọt khỏi mặt nước, một con cá trong chiếc mỏ đen của nó. Con đại bàng cá nhanh chóng bay đi."
 admiring_birds.1001.northern_shoveler.desc:0 "Đó là một tảng đá!... một đỉnh núi!... một mũi đất! Quả đúng là một mũi đất! À không, là một bán đảo! Con vịt mỏ thìa phương Bắc có chiếc mỏ thật độc đáo."
 admiring_birds.1001.atlantic_puffin.desc:0 "Thật là một cảnh tượng buồn cười! Con hải âu mỏ sặc sỡ Đại Tây Dương thật thú vị khi quan sát, theo một cách nào đó nó khiến ta nhớ đến một gã hề đầy màu sắc."
 admiring_birds.1001.mallard.desc:0 "Những chiếc lông cánh ánh tím xanh lấp lánh của đàn chim đang bay thu hút sự chú ý của ta khi ta đang dạo bước. Con vịt trời hạ cánh cách đó không xa, trong một đồng cỏ gần đó."

 admiring_birds.1001.horned_lark.desc:0 "Một đàn sơn ca sừng khổng lồ đang dò tìm trên mặt đất, tìm kiếm giun và ríu rít trò chuyện với nhau. Ta lập tức dừng lại để không làm chúng hoảng sợ."
 admiring_birds.1001.barrow_goldeneye.desc:0 "Con vịt mắt vàng đang nhìn chằm chằm vào ta từ giữa hồ. Nó bơi lặng lẽ, chắc hẳn đang tìm kiếm thức ăn."

 admiring_birds.1001.gold_gain.desc:0 "Ta thật may mắn! Cuộc gặp gỡ này là điềm lành và thu nhập của ta hẳn sẽ được cải thiện."
 admiring_birds.1001.prowess_gain.desc:0 "Quan sát cách nó săn mồi thật truyền cảm hứng! Ta sẽ có thể áp dụng điều đó trên chiến trường."
 admiring_birds.1001.piety_gain.desc:0 "Ta được ban phước! Nó đánh thức điều gì đó sâu thẳm bên trong ta."
 admiring_birds.1001.prestige_gain.desc:0 "Thật là một cuộc gặp gỡ hiếm có! Ai cũng sẽ phải ghen tị với ta."
 admiring_birds.1001.dynasty_prestige_gain.desc:0 "Việc gặp được loài chim này chứng tỏ Triều đại của ta được định sẵn cho sự vĩ đại!"
 admiring_birds.1001.stress_loss_gain.desc:0 "Không gì thư giãn hơn việc ngắm nhìn con chim này bay lượn."


 admiring_birds.1001.a:0 "Giá như ta hiểu biết nhiều hơn về các loài chim..."
 admiring_birds.1001.b:0 "Một cuộc gặp gỡ thật có lợi!"
 admiring_birds.1001.c:0 "Một bổ sung tuyệt vời cho bộ sưu tập chiến lợi phẩm của ta"
