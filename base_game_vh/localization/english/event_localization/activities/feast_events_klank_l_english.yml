l_english:
 feast_events_klank.1001.t: "Những Cách Tra Tấn"
 feast_events_klank.1001.desc: "\"Đâu là nơi tốt nhất để bắt đầu cắt?\" [fellow_torturer.GetName] - [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fellow_torturer'))] của ta hỏi, với một con dao găm trên tay [fellow_torturer.GetHerHis], giọng điệu đầy kinh ngạc. Đúng là một [fellow_torturer.GetWomanMan] tâm đầu ý hợp với ta. Một bữa tiệc có thể là nơi gặp gỡ của những trí tuệ, một cơ hội để hoàn thiện kỹ năng, chứ không chỉ là cơ hội nhàm chán để phàm ăn. \n\n\"Theo kinh nghiệm của ta, họ hét to nhất nếu ngươi loại bỏ [ROOT.Char.Custom('GetRandomBodyPart')] trước. Ta tin chắc về điều đó... đây là cách ngon lành nhất để bắt đầu.\"\n\n[terrified_onlooker.GetName] đứng lặng lẽ nhìn trong góc."
 feast_events_klank.1001.a: "Trước hết, lắc lư [ROOT.Char.Custom('DeviantObjectArticle')] trước mặt chúng."
 feast_events_klank.1001.b: "Ngươi nói rất đúng!"
 feast_events_klank.1001.c: "Một cuốn sách như #EMP [SCOPE.Custom('RandomEntertainmentTextName')]#! thật truyền cảm hứng."
