l_english: 
  feast_default_joe.1010.t: "Giăng Tơ"
  feast_default_joe.1010.desc: "Với quá nhiều kẻ quyền thế tụ họp tại một nơi, vài lời rải rác cũng có thể mang theo những hệ quả lan xa...\n\nTa nhận thấy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('agent'))] của ta, [agent.GetTitledFirstName], dường như đặc biệt cảm thông với đại nghĩa của ta."
  feast_default_joe.1010.a: "Vô số hạt giống có thể kết trái, nếu được vun trồng đúng cách..."
  feast_default_joe.1010.a.trigger: "Ngươi là một [GetTrait('schemer').GetName( GetNullCharacter )] hoặc có ít nhất [SCOPE.ScriptValue('decent_skill_rating')|0V] [intrigue|E]"
  feast_default_joe.1010.b: "[agent.GetTitledFirstNameNoTooltip] sẽ dễ dàng bị kéo về phe ta."
  feast_default_joe.1010.c: "Nơi người ta tụ họp, cơ hội cũng nhiều vô kể."
  feast_default_joe.1010.d: "Kế hoạch của ta đang dần thành hình, ta chỉ cần kiên nhẫn."
  agent_more_likely_join_scheme_tt: "Trong 6 tháng, khả năng [agent.GetShortUINamePossessive|E] sẵn sàng tham gia [scheme.GetName|V] [scheme|E] của ngươi chống lại [scheme.GetTargetCharacter.GetShortUIName]: #P +25#!"
  all_guests_agent_more_likely_join_scheme_tt: "Trong 6 tháng, tất cả những người tham dự hợp lệ của [activity.GetName] sẽ sẵn lòng tham gia [scheme.GetName|V] [scheme|E] của ngươi chống lại [scheme.GetTargetCharacter.GetShortUIName]: #P +25#!"
  agent_more_likely_join_scheme_reason: "Sự kiện: $VALUE|=+0$"
