l_english:
  
 ### OPTIONS
 feast_option_type:0 "Lý Do Tổ Chức Yến Tiệc"
 feast_type_generic:0 "Yến Tiệc"
 feast_type_generic_desc:1 "$EFFECT_LIST_BULLET$ Các sự kiện sẽ dẫn đến cơ hội tăng [opinion|E]\n$EFFECT_LIST_BULLET$ Một số lựa chọn cho phép giảm [stress|E]\n\n#weak Một yến tiệc #EMP cần#! lý do sao?#!"
 feast_type_murder:0 "Yến Tiệc Sát Nhân"
 feast_type_murder_desc:3 "$EFFECT_LIST_BULLET$ Ngươi sẽ chọn cách ám sát Vị Khách Danh Dự và đoàn tùy tùng của họ\n\n#weak Ngươi không mời khách. Ngươi đang dụ con mồi.#!\n\n@warning_icon! #X Ngươi sẽ không thể tổ chức một Yến Tiệc Sát Nhân [GetActivityType('activity_feast').GetName] trong 15 năm#!\n@warning_icon! #X Nhắm vào [liege|E] hoặc [head_of_faith|E] của ngươi sẽ mang lại hình phạt lớn hơn#!\n\n@alert_icon! #alert_trial Những nhân vật có đặc tính [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] và [GetTrait('calm').GetName( GetNullCharacter )] sẽ nhận [stress|E]#!"
 feast_option_food:1 "Độ Cầu Kỳ Của Món Ăn"
 feast_food_bad:1 "Món Ăn Đơn Giản"
 feast_food_bad_desc:2 "$EFFECT_LIST_BULLET$ Giảm lượng [prestige|E] nhận được\n\n#weak Mọi quý tộc hẳn đều trân trọng những món ăn ngon, đơn giản với số lượng lớn hơn là mấy thứ cầu kỳ rườm rà kia. Phải không?#!"
 feast_food_normal:1 "Mỹ Vị Dị Quốc"
 feast_food_normal_desc:2 "$EFFECT_LIST_BULLET$ Tăng [prestige|E] ở mức vừa phải\n\n#weak Một yến tiệc đáng nhớ phải kết hợp những xa xỉ quen thuộc mà giới quý tộc mong đợi với các món ăn lạ lẫm, phong phú hơn.#!"
 feast_food_good:1 "Tác Phẩm Nghệ Thuật Ẩm Thực"
 feast_food_good_desc:2 "$EFFECT_LIST_BULLET$ Tăng mạnh [prestige|E]\n\n#weak Nhét #EMP cái này#! vào #EMP cái kia#! rồi ghim lại cho nó trông như một con chim ưng đang bay! Một món ăn không có câu chuyện thì chẳng khác gì #EMP đồ cặn bã#!.#!"

 feast_option_courses:0 "Số Lượt Món"
 feast_courses_bad:0 "Tạm Đủ"
 feast_courses_bad_desc:2 "$EFFECT_LIST_BULLET$ Tăng nhỏ [opinion|E]\n$EFFECT_LIST_BULLET$ Tăng rất nhỏ [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] [vassal|E] [opinion|E]\n\n#weak Với nửa tá món hoặc ít hơn, khách khứa ở đây chắc chắn sẽ no bụng. Dù không hẳn là ấn tượng.#!"
 feast_courses_normal:0 "Hợp Lý"
 feast_courses_normal_desc:3 "$EFFECT_LIST_BULLET$ Tăng vừa phải [opinion|E]\n$EFFECT_LIST_BULLET$ Tăng vừa phải [GetVassalStance( 'courtly' ).GetTextIcon] [GetVassalStance( 'courtly' ).GetName] [vassal|E] [opinion|E]\n\n#weak Một yến tiệc đòi hỏi mức độ dư dả nhất định, và số món này sẽ đáp ứng kỳ vọng đó.#!"
 feast_courses_good:0 "Xa Hoa Tột Bậc"
 feast_courses_good_desc:2 "$EFFECT_LIST_BULLET$ Tăng lớn [opinion|E]\n$EFFECT_LIST_BULLET$ Tăng mạnh [GetVassalStance( 'courtly' ).GetTextIcon] [GetVassalStance( 'courtly' ).GetName] [vassal|E] [opinion|E]\n\n#weak Hơn hai chục món từ khắp nơi xa gần! Món truyền thống! Món mới lạ! Súp! Món làm sạch vị giác! Tráng miệng, món chính, và còn nhiều nữa!#!"

 ### PHASES
 feast_phase_meal:0 "Yến Tiệc"
 feast_phase_toast:0 "Chén Chúc Cuối"

 ### INTENTS

 every_guest_scope_tt:0 "Mọi khách mời"

 feast.0010.desc:0 "Ta không hiểu vì sao ngươi lại nhận lời mời của ta chỉ để tham dự yến tiệc của [other_host.GetTitledFirstNamePossessive], nhưng hãy biết rằng ta sẽ ghi nhớ chuyện này."
 feast.0010.a:0 "Thật đáng tiếc."

 feast.1501.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.1501.opening_desc:0 "Ta trân trọng mời ngươi đến dự yến tiệc của ta tại [barony.GetNameNoTier]!"
 feast.1501.host_likes_me:0 "Ta hy vọng ngươi sẽ đến, bởi sự vắng mặt của ngươi sẽ khiến ta vô cùng tiếc nuối."
 feast.1501.host_gets_along_with_me:0 "Với tư cách một [ROOT.Char.GetTitleTierName] đáng kính, sự hiện diện của ngươi sẽ là vinh dự cho ta."
 feast.1501.host_dislikes_me:0 "Ta mong mọi nhân vật đáng chú ý đều có mặt, điều này đáng tiếc cũng bao gồm cả ngươi."
 feast.1501.a:0 "Dĩ nhiên ta sẽ tham dự."
 feast.1501.b:0 "Ta sẽ đến. Dù miễn cưỡng."
 feast.1501.c:0 "Ta rất tiếc phải nói rằng ta đang bận."
 feast.1501.d:0 "Không, ta từ chối!"

 feast.1502.desc:0 "Ta trân trọng mời ngươi đến dự yến tiệc của ta tại [barony.GetNameNoTier]! Đây sẽ là một buổi yến tiệc trọng thể, xứng đáng với sự hiện diện cao quý của ngươi."
 feast.1502.a:0 "Đó sẽ là niềm vinh hạnh của ta."
 feast.1502.b:0 "Ta có việc quan trọng hơn phải lo."

 feast.1503.desc:0 "Ta trân trọng mời ngươi đến dự yến tiệc của ta tại [barony.GetNameNoTier]! Đây sẽ là một buổi yến tiệc trọng thể, với thức ăn ngon và trò tiêu khiển thú vị."
 feast.1503.a:0 "Đó sẽ là niềm vinh hạnh của ta."
 feast.1503.b:0 "Ta có việc quan trọng hơn phải lo."

 feast.2001.t:0 "Một Cuộc Tụ Họp Vui Vẻ"
 feast.2001.t_murder:0 "Cuộc Tụ Họp Tàn Bạo"
 feast.2001.desc_intro:0 "Khách khứa tụ tập trong đại sảnh, lãnh chúa và quý bà từ khắp nơi trong lãnh địa."
 feast.2001.desc_fallback:0 "$feast.2001.desc_intro$$feast.2001.desc_outro$"
 feast.2001.desc_gregarious:0 "$feast.2001.desc_intro$ Ta đã #EMP mong chờ#! một dịp như thế này.$feast.2001.desc_outro$"
 feast.2001.desc_shy:0 "$feast.2001.desc_intro$ Ta chỉnh lại y phục. Đây không #EMP hẳn#! là buổi tối lý tưởng của ta, nhưng đành vậy.$feast.2001.desc_outro$"
 feast.2001.desc_ambitious:0 "$feast.2001.desc_intro$ Ah, một trong những điều ta thích nhất là nhìn người ta say rượu... và nghe họ nói nhiều hơn mức nên nói.$feast.2001.desc_outro$"
 feast.2001.desc_nerd:0 "$feast.2001.desc_intro$ Ta thường thích ở cùng sách hơn là con người, nhưng bổn phận vẫn là bổn phận.$feast.2001.desc_outro$"
 feast.2001.desc_martial:0 "$feast.2001.desc_intro$ Ta phải thừa nhận rằng việc không được mang vũ khí khiến buổi tiệc kém hấp dẫn đôi chút.$feast.2001.desc_outro$"
 feast.2001.desc_lustful:0 "$feast.2001.desc_intro$ Biết bao... #EMP miếng ngon#! để lựa chọn.$feast.2001.desc_outro$"
 feast.2001.desc_outro:0 "\n\nKhông khí rộn ràng, tinh thần dâng cao khi yến tiệc bắt đầu!"
 feast.2001.desc_murder_feast:1 "Khi khách khứa lần lượt bước vào đại sảnh, ta nhận ra từng kẻ một. [honorary_guest.GetTitledFirstName]... sao [honorary_guest.GetSheHe] dám bước vào nhà ta? Và đoàn tùy tùng của [honorary_guest.GetHerHis]... toàn là kẻ thù của ta — kẻ thù của cả vương quốc!\n\nKhi gia nhân nhóm lên lò lửa lớn, một ý nghĩ chợt lóe lên trong đầu ta; nếu tai họa của sự tồn tại của chúng có thể được quét sạch cùng một lúc thì sao?"
 feast.2001.a:0 "Chào mừng, bằng hữu!"
 feast.2001.a.tt:0 "Yến Tiệc bắt đầu"
 feast.2001.b:1 "[honorary_guest.GetFirstNameNoTooltip] và đoàn tùy tùng của [honorary_guest.GetHerHis]. Ta muốn tất cả chúng biến mất."
 feast.2001.c:1 "Ta chỉ muốn [honorary_guest.GetFirstNameNoTooltip] chết."
 feast.2001.d:2 "[honorary_guest.GetFirstNameNoTooltip] phải chết, nhưng #EMP không ai#! được nghi ngờ ta."
 feast.2001.d.tt:1 "Âm mưu ám sát có thể thất bại"
 feast.2001.e:0 "Tất cả đều là khách trong nhà ta. Không ai bị tổn hại."
 feast.2001.c.people_to_spare:0 "Những người thân cận với ta sẽ được cảnh báo"
 feast.2001.e.tt:0 "Yến Tiệc bắt đầu — và không ai bị hại"

 feast.2002.t:0 "$feast_header$ Bỏ Bê Bổn Phận"
 feast.2002.desc:1 "Thật là thảm họa!\n\nSau bao chuẩn bị của ta, khách khứa đã đến dự một yến tiệc mà không có chủ nhà! Họ đã về hết, và ta đã để lại cho họ một ấn tượng vô cùng tệ hại."
 feast.2002.a:0 "Ta có lẽ sẽ phải hối hận vì chuyện này."
 
 feast.2003.t:0 "$feast_header$ Một Buổi Tiệc Tồi Tệ"
 feast.2003.desc:0 "Ta không thể tin được. Dù đã gửi lời mời và chuẩn bị mọi thứ, không một vị khách nào đến dự yến tiệc của ta.\n\nKhông sao! Ta sẽ tự mình thưởng thức toàn bộ thức ăn và rượu này, và tiếng vang của bước chân trong đại sảnh rộng lớn của ta là tất cả bầu bạn ta cần!"
 feast.2003.a:0 "Ta thực sự cô độc đến vậy sao?"
 feast.2003.b:0 "Ta cảm thấy nhẹ nhõm đôi chút."
 
 feast.2010.t:0 "$feast_header$ Vận May Bất Ngờ?"
 feast.2010.desc:0 "Tin tức vừa đến tai ta rằng vị khách #EMP vô cùng đặc biệt#! của ta, [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName], đã gặp kết cục của [ROOT.Var('murder_guest_host_var').GetCharacter.GetHerHis] sớm hơn đôi chút so với dự kiến. Tất cả chúng ta sẽ cùng thương tiếc cái chết của [ROOT.Var('murder_guest_host_var').GetCharacter.GetHerHis], và hủy bỏ yến tiệc để tôn trọng ký ức của [ROOT.Var('murder_guest_host_var').GetCharacter.GetHerHis].\n\n#EMP Chỉ tiếc là giá như việc đó do chính tay ta làm.#!"
 feast.2010.a:0 "Thật đáng tiếc."
 feast.2010.a.tt:0 "Yến Tiệc Sát Nhân bị hủy"
 
 feast.2011.t:0 "$feast_header$ Cái Chết Bất Ngờ"
 feast.2011.desc:0 "Cái chết đột ngột của [host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] đã khiến tất cả chúng ta bất ngờ, và [host.GetTitledFirstName] đã quyết định hủy bỏ yến tiệc để tôn trọng ký ức của [host.Var('murder_guest_host_var').GetCharacter.GetHerHis]. Dù sao thì buổi tiệc này cũng được tổ chức để vinh danh [host.Var('murder_guest_host_var').GetCharacter.GetHerHis]."
 feast.2011.a:0 "$feast.2010.a$"
 feast.2011.a.tt:0 "Yến tiệc bị hủy"
 
 feast.2020.t:0 "$feast_header$ Lời Mời Bị Từ Chối"
 feast.2020.desc:0 "Ta không thể tin nổi! [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] đã từ chối lời mời hoàn toàn không đáng ngờ của ta đến dự yến tiệc! Ngay cả khi là vị khách #EMP vô cùng đặc biệt#! của ta. Thật không thể chấp nhận!"
 feast.2020.a:0 "Sớm muộn gì ta cũng sẽ tóm được ngươi, [ROOT.Var('murder_guest_host_var').GetCharacter.GetFirstNameNoTooltip]..."
 feast.2020.a.tt:0 "$feast.2010.a.tt$"
 
 feast.2021.t:0 "$feast.2020.t$"
 feast.2021.desc:0 "Thật nhục nhã! [host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] đã từ chối lời mời của [host.GetTitledFirstNamePossessive] với tư cách là vị khách đặc biệt của buổi tiệc! Và giờ [host.GetSheHe] đang gửi tất cả chúng ta về nhà! Nếu là ta, ta sẽ #EMP không bao giờ#! hồi phục nổi sau chuyện như vậy..."
 feast.2021.a:0 "$feast.2010.a$"
 feast.2021.a.tt:0 "$feast.2011.a.tt$"
 
 feast.2501.t:0 "Lời Chào Nồng Nhiệt"
 feast.2501.likes_host:0 "Mọi vị khách đã tụ họp trong đại sảnh, và chủ tiệc hào phóng của chúng ta, [host.GetTitledFirstName], đã chào đón tất cả đến với yến tiệc!"
 feast.2501.dislikes_host:0 "Mọi vị khách đã tụ họp trong đại sảnh, và chủ tiệc [host.Custom2('InsultAdjective', ROOT.Char)] của chúng ta, [host.GetTitledFirstName], cuối cùng cũng đã chào đón tất cả đến với yến tiệc."
 feast.2501.a.gluttonous:0 "Ta có thể ngửi thấy mùi nhà bếp từ đây!"
 feast.2501.a.drunkard:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')] ở đâu rồi!"
 feast.2501.a.gregarious:0 "Ta nóng lòng được trò chuyện với mọi người!"
 feast.2501.a.shy:0 "Có quá nhiều người ở đây..."
 feast.2501.a:0 "Ta mong chờ buổi tiệc này!"
 feast.2501.b:0 "Hy vọng chuyện này đáng với thời gian của ta."

 feast.5003.t:0 "Kết Thúc Lễ Hội"
 feast.3601.desc:1 "Với sự ra đi của [host.Custom2('MyCharacterIntroduction', ROOT.Char)], yến tiệc của [host.GetHerHis] cũng đi đến hồi kết.\n\nKhi những vị khách lặng lẽ rời đi, ta cầu nguyện rằng [ROOT.Char.GetFaith.HighGodNameAlternate] sẽ chào đón [host.GetFirstName] tại [ROOT.Char.GetFaith.PositiveAfterLife] nồng nhiệt như cách [host.GetSheHe] đã chào đón chúng ta đến đại sảnh của [host.GetHerHis]."
 feast.3601.a:0 "Đó thật là một buổi tiệc vui!"
 feast.3601.a.tt:1 "#F Ý ta là... cho đến khi [host.GetSheHe] chết.#!"

 feast.5004.desc:0 "Vì giờ ta đang bị nhốt sau song sắt nên yến tiệc hoành tráng của ta sẽ bị hủy. Ôi, tất cả những giờ ta đã dành để chuẩn bị nó... Thật lãng phí!"
 feast.5002.a:1 "Không có chủ tiệc, không có yến tiệc."

 feast.5005.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị giam cầm, và yến tiệc lớn của [host.GetHerHis] đã kết thúc. Thật là thời điểm xui xẻo!"

 feast.0050.t:0 "Nghệ Thuật Tiệc Tùng"
 feast.0050.desc:0 "Rượu vang, bia, và những món ăn hảo hạng! Còn cách nào tốt hơn để giải tỏa những rắc rối của thế gian ngoài một đêm vui chơi yến tiệc?\n\nMỗi khi một bữa tiệc kết thúc ta lại thấy mình bắt đầu lên kế hoạch cho bữa tiếp theo!"
 feast.0050.a:0 "Không biết ai sẽ đến!"
 feast.0050.b:0 "Nhưng ta còn những mục tiêu khác..."
 
 feast.7002.t:0 "Chuẩn Bị Thời Gian"
 feast.7002.desc_intro:0 "Những người hầu chạy qua lại khắp đại sảnh, mang đến những món trang trí cuối cùng. Một số vị khách vẫn chưa đến, và ta tự thưởng cho mình một ly đồ uống ngon lành bên lò sưởi."
 feast.7002.dislikes_host:0 "Ta không thể chờ đợi để thấy [host.Custom2('InsultNoun', ROOT.Char)] đó tự biến mình thành kẻ ngốc."
 feast.7002.likes_host:0 "Không nơi nào ta muốn ở hơn nơi này."
 feast.7002.neutral:0 "#EMP Ồ.#! Có vẻ ta đã nhìn thấy vài món [ROOT.Char.Custom('GetExpensiveMeal')] rồi..."
 feast.7002.intent_arrived:0 "\n\nTa nhìn thấy [ROOT.Char.GetIntentTarget.GetTitledFirstName] giữa đám đông, hoàn toàn không biết gì về kế hoạch của ta nhằm [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim]."
 feast.7002.intent:0 "\n\nTa vẫn chưa thấy [ROOT.Char.GetIntentTarget.GetTitledFirstName] đâu cả. Ta nóng lòng chờ [ROOT.Char.GetIntentTarget.GetHerHim] đến để kế hoạch [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim] của ta cuối cùng có thể bắt đầu."
 feast.7002.a.good:0 "Một khoảng thời gian tuyệt vời đang chờ phía trước!"
 feast.7002.a.bad:0 "Ta nóng lòng muốn về nhà."
 
 feast.7101.t:0 "Kết Thúc Buổi Lễ"
 feast.7101.desc:0 "Chỉ còn vài cây nến còn cháy sau khi vị khách cuối cùng rời đi. Ta nghe thấy hai người hầu thở phào nhẹ nhõm khi cánh cửa đóng lại. Thức ăn vẫn còn ấm trên đĩa.\n\nChẳng bao lâu nữa, tin tức sẽ lan khắp vương quốc và mọi quý tộc đáng mặt đều sẽ biết rằng sự huy hoàng của ta là vô song."
 feast.7101.a:0 "Vậy là mọi chuyện kết thúc."
 
 feast.7110.t:0 "Một Kết Thúc Tốt Đẹp"
 feast.7110.desc.entourage:2 "Ánh nến khiến máu trông như một tấm thảm nhung trải dài trên sàn. Ta thở phào khi thấy $knight_culture_player_plural_no_tooltip$ cuối cùng của ta lau sạch thanh kiếm của [my_knight.GetHerHis] — [my_knight.GetSheHe] khẽ gật đầu với ta.\n\nTa ra hiệu cho một trong những [my_knight.GetWomenMen] đóng cửa. Ta tiễn các vị khách của mình, \"Thật đáng tiếc...\""
 feast.7110.a:0 "Công việc hoàn thành tốt."
 feast.7110.a.failure:0 "Lần sau ta sẽ tóm được [honorary_guest.GetHerHim]..."
 feast.7110.desc.target_intro:0 ""Thật là một sự cố đáng tiếc!" ta than thở thành tiếng khi tiễn các vị khách. "Thật đáng buồn," một người khác đồng tình khi cô ta rời đi. "Thật bất hạnh," ta nghe thấy khi người bạn đời của cô ta theo sau.\n\n"
 feast.7110.desc.target:0 "$feast.7110.desc.target_intro$"Ai có thể làm ra chuyện này? Phá hỏng một buổi tiệc như vậy... bọn âm mưu ở khắp nơi," một cận thần lẩm bẩm và ta quay sang đám người hầu với một cử động nhanh. "Đã đến lúc đóng cửa lại.""
 feast.7110.desc.sneaky:0 "$feast.7110.desc.target_intro$ "Thật là cách chết khủng khiếp!" người cuối cùng nói, gọi người hầu đến giúp, "Ngạt thở!" "Không phải người đầu tiên chết kiểu đó — và chắc chắn cũng không phải người cuối cùng," người hầu lẩm bẩm khi các cận thần rời đi. Cửa đóng lại sau lưng họ."
 feast.7110.desc.failed:0 ""Cảm ơn vì bữa tiệc tuyệt vời!" Một vài vị khách vây quanh ta và muốn bày tỏ lòng biết ơn trước khi rời đi. "Thật là khoảng thời gian tuyệt vời!" Ta thậm chí không thể phân biệt ai đang nói, bởi tâm trí ta chỉ chú ý đến một người.\n\nTa tìm thấy [honorary_guest.GetTitledFirstName] gần lối ra. Nụ cười của [honorary_guest.GetHerHis|U] chỉ khiến ta càng thêm tức giận khi [honorary_guest.GetSheHe] vẫy tay chào tạm biệt."
 murder_feast_family_opinion:0 "Giết Thành Viên Gia Đình Trong Yến Tiệc"
 bloody_wedding_family_opinion:0 "Gia Đình Chết Trong Đám Cưới Đẫm Máu"
 murder_feast_murderer_modifier:0 "Chủ Tiệc Mưu Mô"
 murder_feast_great_murderer_modifier:1 "Bữa Tiệc Đẫm Máu"
 murder_feast_murderer_modifier_desc:1 "Nhân vật này đã thất bại trong việc bảo vệ $honorary_guest$ tại yến tiệc của mình."
 murder_feast_great_murderer_modifier_desc:0 "$murder_feast_murderer_modifier_desc$"
 feast_every_guest:0 "Mọi vị khách"
 
 feast.7102.opening:0 "[avenging_family.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.7102.desc:0 "Ta biết ngươi đã làm gì."
 feast.7102.a:0 "Hãy coi mình may mắn vì ngươi không ở đó."
 feast.7102.a.tt:0 "Mọi thành viên gia đình thân cận của [murder_guest.GetShortUIName]"

 feast.7151.t:0 "Đã Đến Lúc Rời Đi"
 feast.7151.desc:0 "Ánh ban ngày tràn qua cửa sổ và chỉ trong khoảnh khắc cả đại sảnh bừng sáng. Hầu hết các ghế giờ đã trống. Một vài người hầu vui vẻ chào tạm biệt rồi rời đi.\n\n[host.GetTitledFirstName] mỉm cười với ta."
 feast.7151.desc.desc_roughed_up: "Ánh ban ngày tràn qua cửa sổ và chỉ trong khoảnh khắc cả đại sảnh bừng sáng. Hầu hết các ghế giờ đã trống. Có lẽ cũng không có gì lạ sau những gì ta đã làm với nơi này!\n\n"Ta ghét ngươi vô cùng, nhìn xem ngươi đã làm gì với nhà ta!" [host.GetTitledFirstName] trừng mắt nhìn ta."
 feast.7151.a:0 "Nhưng giờ ta sẽ rời đi."

 feast.7201.t:0 "Nâng Ly Vì..."
 feast.7201.desc:0 "Bữa tiệc đang dần đi đến hồi kết, và các vị khách của ta hẳn đang mong ta dành đôi lời tôn vinh cho [goh.GetTitledFirstName], vị khách danh dự đáng kính của chúng ta.\n\nTheo truyền thống, một lời chúc tụng kèm theo một ngụm lớn [host.Custom('RegionalDrink')] là đủ. Nhưng nghĩ lại thì, [goh.GetFirstNameNoTooltip] chỉ đơn giản là xuất hiện. Chính ta là người nghĩ ra bữa tiệc này, ta trả tiền cho mọi thứ, và ta là người tiếp đãi tất cả. Hừm."
 feast.7201.a:0 "Và bây giờ, nâng ly! Vì [goh.GetTitledFirstNameNoTooltip]!"
 feast.7201.b:0 "Hãy nói về #EMP [goh.Custom2('InsultNoun', ROOT.Char)]#! của buổi tối..."
 feast.7201.b.tt:0 "Bạn xúc phạm [goh.GetFirstNameNoTooltip] thay vì tôn vinh [goh.GetHerHim]"
 feast.7201.c:0 "Và tất cả các ngươi #EMP rất#! nên cảm ơn lòng hiếu khách của ta."
 feast.7201.d: "Nâng ly vì triều đại của ta!"

 feast.7202.t:0 "$feast.7201.t$"
 feast.7202.desc.intro:0 "Khi bữa tiệc dần đi đến hồi kết tất yếu, vẫn còn một sự kiện cuối cùng mà ai cũng mong đợi, đó là lời chúc rượu của [host.GetTitledFirstNamePossessive] dành cho khách mời danh dự:"
 feast.7202.desc.honoured:0 "ta.\n\nĐó là một khoảnh khắc tuyệt vời, điều mà ta đã khá mong chờ suốt cả buổi tối, nhưng nó đến rồi lại trôi qua quá nhanh."
 feast.7202.desc.slagged_off:0 "là ta.\n\nTuy nhiên, thay vì ca ngợi ta như [host.GetSheHe] đã hứa trong lời mời, [host.GetFirstNameNoTooltip] bắt đầu một bài diễn văn cay nghiệt, nghi ngờ nhân cách, trí tuệ và vệ sinh cá nhân của ta. Với độ #EMP dài#! lê thê."
 feast.7202.desc.bragged:0 "là ta.\n\nThật không may, tên khoác lác như [host.GetSheHe], [host.GetFirstNameNoTooltip] bỏ qua ta và chọn cách tuôn ra những lời khen ngợi dành cho #EMP chính mình#! vì đã tổ chức bữa tiệc khốn kiếp này. Ta đáng lẽ phải biết điều đó."
 feast.7202.a:0 "Thật приятно khi được trân trọng."
 feast.7202.b:0 "Sao ngươi có thể làm vậy với ta?"
 feast.7202.c:0 "Ta sẽ nhớ chuyện này."
 feast.7202.adventurer_loot: "Cái quái..? #EMP Đánh cho [host.GetHerHim] một trận rồi cướp [host.Custom('GetExpensiveMeal')]!#!"
 feast.7202.c.tt:0 "[goh.GetFirstNameNoTooltip] coi đó là chuyện cá nhân"

 feast.7203.t:0 "$feast.7201.t$"
 feast.7203.desc.intro:0 "$feast.7202.desc.intro$"
 feast.7203.desc.honoured:0 "[goh.GetTitledFirstName]\n\nĐó là một bài phát biểu tử tế, dù hơi dài dòng, nhưng mấy chuyện này thường vẫn vậy. Các vị khách tụ họp vỗ tay và reo hò lịch sự khi nó kết thúc, người thì nhiệt tình hơn kẻ khác."
 feast.7203.desc.slagged_off: "[goh.GetTitledFirstName]\n\nThật sốc, khi [host.GetFirstNameNoTooltip] quay sang khách mời của [host.GetHerHis], thay vì khen ngợi [goh.GetHerHim], [host.GetSheHe] ngay lập tức bắt đầu một bài thuyết trình ồn ào và thẳng thắn khá cảm hứng, nghi ngờ trí tuệ, nhân cách đạo đức và mùi cơ thể nói chung của [goh.GetFirstNamePossessiveNoTooltip]. Chúng ta trong khán giả gần như câm lặng."
 feast.7203.desc.bragged:0 "[goh.GetTitledFirstName]\n\nMột cách đáng ngạc nhiên nhưng cũng không quá bất ngờ, [host.GetFirstNameNoTooltip] hầu như lướt qua vị khách của [host.GetHerHis] và thay vào đó ca ngợi chính [host.GetHerselfHimself] vì chất lượng của bữa tiệc đã tổ chức. Ít nhất cũng hơi thô lỗ, và lượng tiếng vỗ tay phản ánh điều đó."
 feast.7203.a:0 "Hay lắm! Hay lắm!"
 feast.7203.b.goh_honoured:0 "Thành thật mà nói ta chưa bao giờ thực sự thích [goh.GetFirstNameNoTooltip]."
 feast.7203.b.goh_dishonoured:0 "Thật không ra thể thống gì."
 
 feast.0800.t:1 "$feast_header$ Một Bữa Tiệc Bị Cắt Ngắn"
 feast.0800.desc:0 "Người tiền nhiệm của ta, [host.GetNameRegnal], đã từ bỏ cõi trần trong khi đang tổ chức một bữa tiệc. Thật bi thảm, [host.GetSheHe] [host.GetDeathReason].\n\n"
 feast.0800.desc.entourage:0 "$activity_system.1010.desc.entourage$"
 feast.0800.desc.ruler:0 "[host.GetTitleAsName] quá cố không đáng phải chết như thế này."
 feast.0800.a:0 "$activity_system.1010.a$"
 feast.0800.tt:0 "[host.GetShortUINamePossessiveNoTooltip] [GetActivityType('activity_feast').GetName] đã bị hủy"
 
 feast_events_flavor.0001.t: "Ta Đã Nghe Về Ngươi"
 feast_events_flavor.0001.desc.intro: ""[ROOT.Char.GetTitledFirstName]!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guest'))] của ta, [guest.GetTitledFirstName|U], gọi tên ta.\n\n"
 feast_events_flavor.0001.desc.good: ""Người [guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))] thân yêu của ta, [relation_target.GetFirstName], thường nói tốt về ngươi." [guest.GetSheHe|U] tự hào nói, nhấp một ngụm [guest.GetHerHis] [guest.Custom('RegionalDrink')]. "Ta đã mong chờ được cùng ngươi dự tiệc.""
 feast_events_flavor.0001.desc.bad: ""Người [guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))] thân yêu của ta, [relation_target.GetFirstName], nói với ta rằng ngươi là một #EMP [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('relation_target'))]#! [ROOT.Char.GetWomanMan]. Ta thực sự hy vọng những tin đồn đó là sai và chỉ là một sự hiểu lầm đơn giản.""
 feast_events_flavor.0001.aa: ""Cầu mong gia tộc [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] và [guest.GetDynasty.GetBaseNameNoTooltip] kết thành đồng minh!""
 feast_alliance_effect_tooltip: "[guest.GetTitledFirstName] và ta lập nên một [alliance|E] chung"
 feast_events_flavor.0001.a: ""Hãy nâng ly vì [relation_target.GetFirstNameNoTooltip]! Và vì gia tộc [guest.GetDynasty.GetBaseNameNoTooltip]!""
 feast_events_flavor.0001.b: ""Và ta cũng chỉ có những lời tốt đẹp tương tự dành cho [relation_target.GetHerHim].""
 feast_events_flavor.0001.c: ""Ta sẽ không bao giờ tin một người thuộc gia tộc [guest.GetDynasty.GetBaseNameNoTooltip].""
 feast_events_flavor.0001.d: ""Ta xin lỗi vì những sai lầm trong quá khứ của mình.""
 feast_events_flavor.0001.e: ""Ta không đến đây để nói về [relation_target.GetHerHim]!""

 feast_events_flavor.0002.t: "Tha Thứ Là Điều Thiêng Liêng"
 feast_events_flavor.0002.desc: "[former_rival.GetTitledFirstName] - [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_rival'))] và là [Concept('rival','đối thủ cũ')|E] của ta, bước đến bàn của ta, hai chiếc cốc trên tay, [former_rival.Custom('quirk_pos_pp')] trước khi [former_rival.GetSheHe] [former_rival.Custom('quirk_pos_adverb')] ngồi xuống chiếc ghế trống bên cạnh ta. Chẳng bao lâu sau, cả hai chúng ta chìm sâu vào cuộc trò chuyện, kể lại những mối thù trong quá khứ."
 feast_events_flavor.0002.a: "Ta không hẳn là nhớ những lời khiêu khích của ngươi đâu, [former_rival.GetTitledFirstName] thân mến..."
 feast_events_flavor.0002.b: "Từng đối đầu, giờ hãy trở nên thân thiết hơn bao giờ hết!"
 feast_events_flavor.0002.c: "Cảm ơn vì đã nhắc ta — biến đi, đồ [former_rival.Custom2('InsultAdjective', ROOT.Char)] [former_rival.Custom2('InsultNoun', ROOT.Char)]!"
 feast_events_flavor.0002.c.vengeful_sinful.tt: "Bạn sẽ mất [piety|E] vì [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] của bạn coi [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )] là [virtuous|E] hoặc [GetTrait('vengeful').GetName( GetNullCharacter )] là [sinful|E]"
 feast_events_flavor.0002.c.forgiving_sinful.tt: "Bạn sẽ nhận [piety|E] vì [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] của bạn coi [trait|E] [GetTrait('vengeful').GetName( GetNullCharacter )] là [virtuous|E] hoặc [GetTrait('forgiving').GetName( GetNullCharacter )] là [sinful|E]"
 feast_events_flavor.0002.d: "Thêm [former_rival.Custom('RegionalAlcoholicDrink')] cho tên [former_rival.Custom('ComplimentAdjective')] [former_rival.Custom2('InsultNoun', ROOT.Char)] này!"
 feast_events_flavor.0002.d.virtuous: "Quả thật rất [ROOT.Char.GetFaith.GetReligion.GetAdjective] khi quay má kia cho người ta đánh!"
 feast_events_flavor.0002.d.virtuous.tt: "Tùy chọn này có sẵn vì [faith|E] [THIS.GetCharacter.GetFaith.GetAdjective] của bạn coi [trait|E] [GetTrait('forgiving').GetName( GetNullCharacter )] là [virtuous|E] hoặc [GetTrait('vengeful').GetName( GetNullCharacter )] là [sinful|E]"
 feast_turning_the_other_cheek_modifier: "Quay Má Kia"
 feast_turning_the_other_cheek_modifier_desc: "Nhân vật này nổi tiếng vì khả năng bỏ qua những hận thù trong quá khứ"
 
