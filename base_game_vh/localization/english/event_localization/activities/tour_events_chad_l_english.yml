l_english:
 
  tour_grounds_events.6000.t:0 "Một Cuộc Gặp Tình Cờ"
  tour_grounds_events.6000.desc:0 "Ở lại cùng các chư hầu và thay đổi khung cảnh quả là dễ chịu, nhưng cách bố trí luôn thay đổi khiến mọi thứ ngày càng khó hiểu. Khi chỉ có một mình, ta hiếm khi biết phải tìm những thứ cần thiết ở đâu... như nơi ta có thể kiếm một món ăn khuya.\n\nLóng ngóng bước qua [stop_host_scope.GetTitledFirstNamePossessive] [stop_host_scope.Custom('FortifiedBuilding')], ta vô tình mở một cánh cửa và bắt gặp "
  tour_grounds_events.6000.desc.three_consorts:0 "[stop_host_scope.GetFirstNameNoTooltip] cùng các phi tần của [stop_host_scope.GetHerHis], [orgy_consort_1.GetFirstNameNoTooltip], [orgy_consort_2.GetFirstNameNoTooltip], và [orgy_consort_3.GetFirstNameNoTooltip], đang đứng sát nhau đầy nguy hiểm, dường như sắp sửa làm điều gì đó #EMP thân mật.#!\n\n"
  tour_grounds_events.6000.desc.one_consort:0 "[stop_host_scope.GetFirstNameNoTooltip] và [stop_host_scope.GetHerHis] [stop_host_scope.Custom2('RelationToMeShort',orgy_consort_1)] đứng sát nhau đầy nguy hiểm, dường như sắp sửa làm điều gì đó #EMP thân mật.#! Ánh nến dịu dàng thắp sáng căn phòng và mùi oải hương ngọt ngào lan tỏa trong không khí.\n\n"
  tour_grounds_events.6000.desc.outro:0 "Chư hầu của ta nở một nụ cười ranh mãnh và beckons ta tiến lại gần."
  tour_grounds_events.6000.a:0 "Cám dỗ này quá lớn..."
  tour_grounds_events.6000.b:0 ""Ta cứ tưởng ngươi sẽ không bao giờ hỏi!""
  tour_grounds_events.6000.c:0 "Ta sẽ không làm bẩn bản thân trong thứ dơ bẩn này!"

  tour_grounds_events.6100.t:0 "[tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]"
  tour_grounds_events.6100.desc.intro:0 ""Và đây, thưa ngài, là [tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]!" [stop_host_scope.GetTitledFirstName] thốt lên khi chúng ta tiến đến trước [stop_host_scope.Custom('GetFaithGrandTemple')] đầy ấn tượng.\n\n"
  tour_grounds_events.6100.desc.cynical:0 "Suốt thời gian ở lại tại [tour_grounds_event_location.GetName], ta đã lo sợ chuyến tham quan được sắp đặt này. Ta không có mối quan hệ gần gũi với [ROOT.Char.GetFaith.HighGodName], và ta cũng không định bắt đầu bây giờ. Tuy vậy, nó trông #EMP thật ấn tượng#!.\n\nCó lẽ ta có thể học được điều gì đó từ đây, nhưng ta phải nghĩ ra điều gì đó để nói..."
  tour_grounds_events.6100.desc.zealous:0 "Ta đứng sững trong kinh ngạc trước những kỳ công của [ROOT.Char.faith.HighGodNamePossessive] trên thế gian. Công trình này là sự thiêng liêng được hiện thân."
  tour_grounds_events.6100.desc:0 "Ta đứng ngỡ ngàng trước một công trình kỳ diệu như vậy. Những chi tiết chạm khắc ở từng góc nhỏ tạo nên sự tương phản tuyệt đẹp với sự bình yên trong tâm hồn mỗi người. Đây quả thực là một nơi đặc biệt để thờ phụng [ROOT.Char.GetFaith.HighGodName]."
  tour_grounds_events.6100.a:0 "Ta nên thắp một ngọn nến cho người ta yêu quý, [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)], [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]."
  tour_grounds_events.6100.a.tt:0 "Ngươi thành kính tưởng nhớ [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)] của mình bằng cách thắp một ngọn nến."
  tour_grounds_events.6100.b:0 "Ta nên cầu nguyện cho người ta yêu quý, [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)], [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]."
  tour_grounds_events.6100.b.tt:0 "Ngươi tưởng nhớ [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)] của mình qua lời cầu nguyện."
  tour_grounds_events.6100.c:0 ""Kỳ quan này được xây dựng như thế nào?""
  tour_grounds_events.6100.d:0 "Ta phải giả vờ hứng thú càng lâu càng tốt."
  tour_grounds_events.6100.d.success:0 "[stop_host_scope.GetFirstNameNoTooltip] không nhận ra sự hoài nghi của ngươi"
  tour_grounds_events.6100.d.failure:0 "[stop_host_scope.GetFirstNameNoTooltip] không tán thành sự hoài nghi của ngươi"

  tour_grounds_events.6200.t:0 "Vụ Mùa Bội Thu"
  tour_grounds_events.6200.desc:0 "Chư hầu của ta, [stop_host_scope.GetTitledFirstName] đã đưa ta đi tham quan "
  tour_grounds_events.6200.desc.pastures:0 "những đồng cỏ được chăm sóc kỹ lưỡng của lão. Gia súc đầy rẫy lang thang khắp những vùng đất này. \"Lũ gia súc này sinh sôi nhanh đến mức chúng thần chẳng biết phải làm gì với chúng nữa!\""
  tour_grounds_events.6200.desc.orchard:0 "những vườn cây ăn trái. "Cây của chúng ta mỗi mùa đều cho từng giạ trái cây mọng nước."
  tour_grounds_events.6200.desc.cereal_fields:0 "những cánh đồng lúa. "Người dân của chúng ta từ lâu đã không còn lo sợ nạn đói hay chết đói nữa."
  tour_grounds_events.6200.desc.hill_farms:0 "những nông trại sườn đồi. "Chúng ta đã cố gắng hết sức để tận dụng tối đa không gian canh tác hạn chế trên những ngọn đồi này — và ta dám nói rằng rất hiệu quả."
  tour_grounds_events.6200.desc.plantations:0 "những đồn điền. "Chà là chúng ta trồng ở đây là niềm tự hào lớn nhất. Chúng cũng #EMP cực kỳ#! được thương nhân săn đón."
  tour_grounds_events.6200.outro:0 ""Chúng ta thực sự được ban phước tại [tour_grounds_event_location.GetName]," [stop_host_scope.GetSheHe] nói với nụ cười mãn nguyện.\n\nCó vẻ như chư hầu thân mến của ta đã giữ bí quyết thành công của mình không cho ta biết."
  tour_grounds_events.6200.a:0 "[stop_host_scope.GetSheHe|U] nên cống hiến nhiều hơn cho vương quốc!"
  tour_grounds_events.6200.a.tt:0 "Ngươi cố gắng tăng phần đóng góp của [stop_host_scope.GetTitledFirstNamePossessiveNoTooltip] cho vương quốc"
  tour_grounds_events.6200.b:0 ""Ta phải mang kiến thức này về [root_capital_scope.GetNameNoTooltip].""
  tour_grounds_events.6200.c:0 ""Thật ấm lòng khi thấy dân của ta hưng thịnh.""

  tour_grounds_events.6201.t:0 "$tour_grounds_events.6200.t$"
  tour_grounds_events.6201.desc:1 "Khi ta đang dẫn [visiting_liege.GetTitledFirstName] đi quanh [tour_grounds_event_location.GetName] và khoe về sự sung túc tuyệt vời mà chúng ta tự hào tạo ra nơi đây, [visiting_liege.GetSheHe] bắt đầu tỏ ra xa cách. Sau vài phút im lặng, cuối cùng [visiting_liege.GetSheHe] lên tiếng:\n\n"Ta thấy ngươi đang phát đạt nơi đây và chăm sóc tốt cho [tour_grounds_event_location.GetNameNoTooltip]. Ta tin rằng đã đến lúc xem xét lại các thỏa thuận của chúng ta. Vì danh dự của ngươi, một phần lợi nhuận từ các cơ nghiệp của ngươi vốn thuộc về vương quyền.""
  tour_grounds_events.6201.a:0 "Tăng thuế một chút nghe cũng hợp lý..."
  tour_grounds_events.6201.a.tt:0 "Chư hầu đồng ý tăng thuế"
  tour_grounds_events.6201.b:0 "Một lần chia lợi nhuận là đủ."
  tour_grounds_events.6201.b.tt:0 "Chư hầu chia lợi nhuận"
  tour_grounds_events.6201.c:0 "Thành quả lao động của ta chỉ thuộc về ta!"
  tour_grounds_events.6201.c.tt:0 "Chư hầu từ chối chia lợi nhuận"

  tour_grounds_events.6202.t:0 "Bàn Tay Dính Nhựa"
  tour_grounds_events.6202.desc:0 "[stop_host_scope.GetTitledFirstName] và ta đang thong thả dạo bước qua cảng thương mại của [event_location.GetName]. Chư hầu của ta chỉ cho ta thấy nhiều thương nhân khác nhau mà [stop_host_scope.GetSheHe] đã đưa tới cảng, cùng những món hàng tinh xảo được bán tại đây. Khi chúng ta đang trò chuyện sôi nổi về thương mại hàng hải, một đứa trẻ lướt qua ta rồi chạy vào đám đông thương nhân và thủy thủ.\n\nBan đầu ta nghĩ đó chỉ là một đứa trẻ chưa học được phép tắc, nhưng ta sớm nhận ra rằng túi vàng của ta... #EMP đã biến mất!#!"
  tour_grounds_events.6202.a:0 ""[stop_host_scope.GetFirstNameNoTooltip]! #EMP Làm gì đó đi!#!""
  tour_grounds_events.6202.a.tt:0 "Ngươi ra lệnh cho chư hầu của mình bắt tên trộm"
  tour_grounds_events.6202.a.success:0 "[stop_host_scope.GetFirstNameNoTooltip] thành công"
  tour_grounds_events.6202.a.failure:0 "[stop_host_scope.GetFirstNameNoTooltip] thất bại"
  tour_grounds_events.6202.b:0 "Không ai được phép trộm của ta!"
  tour_grounds_events.6202.b.success:0 "Đứa trẻ trộm cắp bị bắt"
  tour_grounds_events.6202.b.failure:0 "Đứa trẻ trộm cắp biến mất trong đám đông"
  tour_grounds_events.6202.c:0 "Có lẽ đứa trẻ đó cần nó hơn ta..."

  tour_grounds_events.6203.t:1 "$tour_grounds_events.6202.t$"
  tour_grounds_events.6203.desc:0 "[visiting_liege.GetTitledFirstName] và ta đang thong thả dạo bước qua cảng thương mại của [event_location.GetName]. Ta chỉ cho ngài thấy nhiều thương nhân khác nhau mà ta đã đưa tới cảng, cùng những món hàng tinh xảo được buôn bán nơi đây. Khi chúng ta đang trò chuyện sôi nổi về thương mại hàng hải, một đứa trẻ lướt qua lãnh chúa của ta rồi chạy thẳng vào đám đông thương nhân và thủy thủ.\n\nBan đầu, [visiting_liege.GetTitledFirstNameNoTooltip] xem đó chẳng có gì đáng kể, nhưng chẳng bao lâu [visiting_liege.GetSheHe] nhận ra rằng đứa trẻ đã trộm mất vàng của [visiting_liege.GetHerHis]!\n\n"Làm gì đó về chuyện này #EMP ngay lập tức#!, [ROOT.Char.GetFirstNameNoTooltip]!" ngài gầm lên đầy tức giận..."
  tour_grounds_events.6203.a:0 "Đền lại số vàng bị trộm là cách dễ nhất."
  tour_grounds_events.6203.toast:0 "[stop_host_scope.GetShortUINameNoTooltip] bù lại số vàng bị trộm"
  tour_grounds_events.6203.b:0 ""Đuổi theo tên nhóc trộm cắp đó!""
  tour_grounds_events.6203.c:0 "Đây không phải chuyện của ta."

  tour_grounds_events.6204.t:1 "$tour_grounds_events.6202.t$: Bị Bắt"
  tour_grounds_events.6204.desc.caught_by_liege:0 "Ta lập tức lao đi truy đuổi tên trộm bé nhỏ, hất đổ xe hàng và xô ngã bất cứ ai cản đường. Ta quyết tâm lấy lại số vàng bị đánh cắp của mình, dù có phải trả giá thế nào.\n\nGiữ [tiny_thief.Custom('GirlBoy')] trong tầm mắt, ta nhanh chóng rút ngắn khoảng cách với [tiny_thief.GetHerHim], dù [tiny_thief.GetSheHe] liên tục lách dưới những bàn hàng của thương nhân và luồn lách giữa đám đông.\n\nNhưng chẳng bao lâu sau, ta dồn được tên trộm nhỏ vào mép cầu cảng. Cuộc rượt đuổi kết thúc."
  tour_grounds_events.6204.desc.caught_by_vassal:0 "Sau khi quát tháo [stop_host_scope.GetFirstName] phải làm gì đó với tên khốn nhỏ tuổi đã đánh cắp vàng của ta, [stop_host_scope.GetSheHe] liền lao đi đuổi theo [tiny_thief.GetHerHim].\n\nTa thấy [stop_host_scope.GetFirstNameNoTooltip] đắc thắng trở về, tay nắm chặt cổ áo tên trộm nhỏ đang lủng lẳng.\n\n\"Thứ lỗi cho thần, thưa bệ hạ. Thần vô cùng xấu hổ khi chuyện này lại xảy ra dưới quyền bảo hộ của thần. Thần đã bắt được tên [tiny_thief.Custom('GirlBoy')] này cùng số vàng của người. Thần xin dâng cả hai lại để người tùy ý xử trí.\""
  tour_grounds_events.6204.a:0 ""Ta lấy lại vàng rồi rời đi.""
  tour_grounds_events.6204.b:0 ""Ta có những kế hoạch lớn cho #EMP tài năng#! của ngươi...""

  tour_grounds_events.6205.t:1 "$tour_grounds_events.6202.t$: Mất Dấu"
  tour_grounds_events.6205.desc:0 "Sau khi quát tháo [stop_host_scope.GetFirstName] phải làm gì đó với tên khốn nhỏ tuổi đã đánh cắp vàng của ta, [stop_host_scope.GetSheHe] liền lao đi đuổi theo [tiny_thief.GetHerHim].\n\nTa thấy [stop_host_scope.GetFirstNameNoTooltip] lầm lũi trở về một mình, tên trộm đã cao chạy xa bay. Với nỗi sợ hãi trong ánh mắt và đôi tay run rẩy, chư hầu của ta lắp bắp:\n\n\"Thần vô cùng xin lỗi, thưa bệ hạ, nhưng đứa trẻ đã mất dấu rồi. Cả lính canh và thần đều không thể tìm thấy [tiny_thief.GetHerHim]. Thần e rằng số vàng của người đã mất rồi.\""
  tour_grounds_events.6205.a:0 "Ta sẽ không rời đi khi chưa lấy lại vàng của mình."
  tour_grounds_events.6205.a.success:1 "[stop_host_scope.GetShortUINameNoTooltip|U] bù lại số vàng bị trộm"
  tour_grounds_events.6205.a.failure:0 "Số vàng bị trộm mất vĩnh viễn"
  tour_grounds_events.6205.b:0 "Phải có kẻ trả giá..."
  tour_grounds_events.6205.b.flavor:0 "Ngươi đánh [stop_host_scope.GetFirstNameNoTooltip] vì sự vô dụng của [stop_host_scope.GetHerHis]."
  tour_grounds_events.6205.c:0 "Ngươi may mắn vì ta là người biết khoan dung."

  tour_grounds_events.6300.t:0 "Một Cơ Hội Trổ Tài"
  tour_grounds_events.6300.desc:0 "Khi [stop_host_scope.GetTitledFirstName] đang dẫn ta tham quan [event_location.GetName], chúng ta đến khu huấn luyện quân sự. Toàn bộ quân sĩ của [stop_host_scope.GetHerHis] đã tập hợp, và bầu không khí tràn ngập sự háo hức. [stop_host_scope.GetFirstNameNoTooltip] nở một nụ cười đầy hào hứng.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng thần đã nghe quá nhiều câu chuyện về bản lĩnh phi thường của ngài. Thần sẽ thật thiếu sót nếu bỏ qua cơ hội cho các binh sĩ này thấy một buổi đấu tập #EMP thực sự#! trông như thế nào! Ngài có muốn đấu tập với [target_knight.GetFirstName] vì lợi ích của vương quốc không?""
  tour_grounds_events.6300.a:0 "Ta sẽ cho họ thấy cách làm."
  tour_grounds_events.6300.a.success:0 "Ngươi thắng trận đấu tập"
  tour_grounds_events.6300.a.failure:0 "Ngươi thua trận đấu tập"
  tour_grounds_events.6300.flavor:0 "Ngươi đấu tập tay đôi với [target_knight.GetFirstNameNoTooltip]."
  tour_grounds_events.6300.b:0 "Chắc hẳn [tg_6300_stand_in.GetFirstNameNoTooltip] sẽ dạy họ tốt hơn!"
  tour_grounds_events.6300.b.success:1 "[tg_6300_stand_in.GetShortUINameNoTooltip|U] thắng trận đấu tập"
  tour_grounds_events.6300.b.failure:1 "[tg_6300_stand_in.GetShortUINameNoTooltip|U] thua trận đấu tập"
  tour_grounds_events.6300.c:0 "Ta phải lịch sự từ chối."
