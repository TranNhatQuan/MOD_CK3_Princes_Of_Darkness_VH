 #Your capital is now Mecca and you don't have the Hajjaj trait
 hajj.0011.t:0 "Bên Trong Những Bức Tường Rực Sáng"
 hajj.0011.desc:0 "Nay thủ đô của ta là lãnh địa huy hoàng [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], ta đã nhân cơ hội này hoàn thành các nghi thức để nhận phúc lành của Hajj."
 hajj.0011.a:0 "Ta đã cảm thấy gần gũi với [ROOT.Char.GetFaith.HighGodName] hơn rồi."
 hajj.0011.a_cynical:0 "Dù sao cũng phải làm."
 #Promise your Hajjaj relative to go on the Hajj
 hajj.0500.t:0 "Những Bức Tường Rực Sáng"
 hajj.0500.desc:0 ""#EMP Những bức tường rực sáng, những bức tường rực sáng... #!," [hajj_dying_relative.GetTitledFirstName] thì thầm khi ta bước vào [hajj_dying_relative.GetHerHis] [ROOT.Char.Custom('GetChamber')]. Hơi thở của [hajj_dying_relative.GetHerHis|U] nặng nhọc, như thể không khí cũng ngại chui vào lá phổi bệnh tật của vị [hajj_dying_relative.GetWomanMan] từng vĩ đại.\n\nTa khẽ hắng giọng, và đôi mắt mờ đục của [hajj_dying_relative.GetFirstNamePossessiveNoTooltip] cố gắng tập trung vào ta: "[ROOT.Char.GetFirstNameNoTooltip]? ... là ngươi sao?" [hajj_dying_relative.GetSheHe] thì thầm. Rồi ánh mắt [hajj_dying_relative.GetHerHis] bỗng sáng lên trong chốc lát: "Những bức tường rực sáng. Mecca."\n\n"Ngươi phải thực hiện Hajj, [hajj_dying_relative.Custom2('RelationToMe' , ROOT.Char)]. Ngươi #EMP nhất định phải#! nhìn thấy những bức tường rực sáng ấy!" [hajj_dying_relative.GetFirstNameNoTooltip] bắt đầu ho sặc vì gắng sức đột ngột và khẽ rên lên. Thật đáng thương."
 hajj.0500.a:0 "Ta sẽ làm điều đó."
 hajj.0500.a.flavor:0 "Di nguyện của người sắp chết vẫn là di nguyện."
 hajj.0500.a.tt_hajj:0 "Chuyến [hajj|E] [pilgrimage|E] tiếp theo của ngươi sẽ rẻ hơn"
 hajj.0500.b:0 "Ta... không thể hứa điều gì đâu, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('hajj_dying_relative'))]."
 hajj.0500.b.flavor:0 "Thật lòng ta chẳng muốn đi chút nào."

 ###Hajj Destination Events
 #Pray at the Place of Abraham
 hajj.3010.t:1 "Nơi của Abraham"
 hajj.3010.desc:0 "Khi đã bước vào Mecca, việc đầu tiên của ta là đến thăm Nơi của Abraham. Tảng đá thiêng này được xem là bệ bước mà Abraham đã dùng khi xây dựng Kaaba cùng với Ismail, từ nhiều thế kỷ trước.\n\nNhững người hành hương Hajj quanh ta tiến đến thánh tích và cúi đầu cầu nguyện trong suy niệm. Ta cũng nên làm như vậy."
 hajj.3010.a:0 "Ta nên cầu nguyện cho điều gì thiết thực hơn..."
 hajj.3010.a.wealth.t:0 "Sự Giàu Có"
 hajj.3010.a.wealth.desc:0 "Ngươi nảy ra ý tưởng về cách gia tăng tài sản"
 hajj.3010.a.opinion.t:0 "Phép Tắc Xã Giao"
 hajj.3010.a.opinion.desc:0 "Ngươi hiểu ra cách khiến bản thân trở nên được yêu mến hơn"
 hajj.3010.a.prestige.t:0 "Thanh Danh"
 hajj.3010.a.prestige.desc:0 "Ngươi hiểu ra cách khiến bản thân trở nên danh giá hơn"
 hajj.3010.a.bad.t:0 "Mê Tín"
 hajj.3010.a.bad.desc:0 "Ngươi nuôi dưỡng sự mê tín của mình"
 hajj.3010.b:0 "Hãy cúi xuống và suy niệm."
 hajj.3010.b.flavor_cynical:0 "Tốt nhất là làm cho xong."
 #Walk between Safa and Marwah
 hajj.3020.t:1 "Safa và Marwah"
 hajj.3020.desc:0 "Nghi thức tiếp theo của ta là đi bộ bảy lần giữa hai địa điểm linh thiêng Safa và Marwah để tưởng niệm nỗi tuyệt vọng cùng nỗ lực của Hajar khi tìm nước cho con trai mình là Ismail.\n\nIsmail, người sau này trở thành tổ tiên của vị Tiên Tri được ban phúc.\n\nKhi chuẩn bị cho nghi thức, ta ngắm nhìn Safa và Marwah và nhận ra vô số người hành hương đã bắt đầu đi lại giữa hai ngọn đồi từ khắp mọi tầng lớp."
 hajj.3020.a:0 "Sao phải chỉ bảy lần!"
 hajj.3020.b:0 "Bảy vòng cẩn thận là đủ."
 hajj.3020.c:0 "Liệu có ai để ý nếu ta đi ít hơn không?"
 hajj.3020.c.success.t:0 "Lười Biếng Thành Công"
 hajj.3020.c.success.desc:0 "Ngươi đã khéo léo bớt đi số vòng phải đi"
 hajj.3020.c.failure.desc:0 "Ngươi bị phát hiện và chịu phạt"
 #Safa and Marwah penalization
 hajj.3021.t:1 "Bị Phát Hiện!"
 hajj.3021.desc:0 "Khi ta bắt đầu quay lại từ hai ngọn đồi, một vị giáo sĩ địa phương nhìn ta với vẻ nghiêm nghị: \"Ta #EMP tin rằng#! ngươi đã không hoàn thành nghi thức Safa và Marwah cho đúng, Hajji.\"\n\n[penalizer.GetSheHe|U] tiếp tục: \"Hình phạt cho việc này là hoặc Damm hoặc Sadaqah al-Fitr. Hoặc tất nhiên, ngươi cũng có thể thực hiện lại các vòng cho đúng,\" gương mặt [penalizer.GetHerHis] dịu đi trong chốc lát.\n\n\"Hajj sẽ không trọn vẹn nếu ngươi từ chối, vậy ngươi chọn thế nào, Hajji?\""
 hajj.3021.a:0 "Vậy thì hiến tế súc vật."
 hajj.3021.a.flavor:0 "Damm. $hajj.3040.c.flavor$"
 hajj.3021.b:0 "Ta sẽ quyên góp."
 hajj.3021.b.flavor:0 "Sadaqah al-Fitr. Hiến tặng ngũ cốc và chà là cho người nghèo cũng đáng."
 hajj.3021.c:0 "Vậy ta sẽ đi lại đủ bảy vòng cho đúng."
 hajj.3021.c.flavor_zealous:0 "Ta #EMP biết#! là mình nên nghiêm túc hơn..."
 hajj.3021.c.flavor:0 "Thật phiền phức."
 #Drink water from the Zamzam well
 hajj.3030.t:1 "Giếng Zamzam"
 hajj.3030.desc:0 "Ta đang đứng trước giếng Zamzam huyền bí, nơi được tìm thấy qua những giấc mơ về mạch nước vĩnh cửu giữa sa mạc. Uống nước từ đây là một trong những nghi thức cổ xưa của Hajj, và cũng là việc tiếp theo của ta.\n\nChiếc giếng, dù được xây dựng bằng những khối đá tinh xảo, vẫn chật kín người hành hương Hajj xung quanh ta; ta phải chen qua đám đông để tiến đến dòng nước thiêng được nhiều người chia sẻ."
 hajj.3030.a:0 "Ta nên để người khác đi trước."
 hajj.3030.a.flavor:0 "Ta không vội."
 hajj.3030.b:0 "Giải khát cho linh hồn ta!"
 hajj.3030.b.flavor:0 "Thật ngon. Lại còn được nói là có phép màu!"
 hajj.3030.c:0 "Có lẽ ta chỉ nhúng tay một chút."
 hajj.3030.c.flavor:0 "Điều này #EMP chẳng#! có vẻ vệ sinh chút nào!"
 #Sacrifice to Allah
 hajj.3040.t:1 "Hiến tế cho Allah"
 hajj.3040.desc:0 "Đã đến lúc cho nghi thức tiếp theo: hiến tế cho [ROOT.Char.GetFaith.HighGodName]. Một khu vực đặc biệt của bãi lễ đã được chuẩn bị cho dịp này, và mùi xạ nồng nặc càng rõ hơn khi ta tiến gần đến những quầy cung cấp đủ loại súc vật.\n\nTa cân nhắc kỹ lưỡng; hiến tế một con vật lớn như lạc đà chắc chắn sẽ thể hiện lòng sùng kính hơn — còn hiến tế một con vật nhỏ hơn hay một con cừu cũng đủ để hoàn thành Hajj.\n\nỞ một góc khác, vài người hành hương dường như đã góp tiền chung để chia sẻ chi phí hiến tế một con bò lớn."
 hajj.3040.a:0 "Sáu mươi ba con lạc đà!"
 hajj.3040.a.flavor:0 "Ta không thể kém hơn vị Đại Tiên Tri!"
 hajj.3040.b:0 "Một con lạc đà là đủ."
 hajj.3040.b.flavor:0 "Lạc đà biết một bí mật duy nhất..."
 hajj.3040.c:0 "Ta sẽ chọn một con cừu."
 hajj.3040.c.flavor:0 "Ta vốn chẳng thích đôi mắt láo liên của chúng."
 hajj.3040.d:0 "Ta sẽ góp phần vào lễ hiến tế con bò kia."
 hajj.3040.d.flavor:0 "Sao phải tước đi nhiều sinh mạng hơn cần thiết?"
 #Performing the Halq
 hajj.3001.t:2 "Halq"
 hajj.3001.desc:2 "Sau khi đã cầu nguyện tại Nơi của Abraham, đi giữa Safa và Marwah, uống nước từ giếng Zamzam và hiến tế cho [ROOT.Char.GetFaith.HighGodName], ta nay đã sẵn sàng hoàn tất Hajj. Nghi thức tiếp theo ta phải thực hiện là cắt tóc.\n\n"
 hajj.3001.desc.male_dominated:0 "Theo truyền thống nam nhân cạo sạch toàn bộ, nhưng đôi khi cũng được cho phép chỉ cắt một phần, còn nữ nhân thì chỉ được cắt một lọn."
 hajj.3001.desc.female_dominated:0 "Theo truyền thống nữ nhân cạo sạch toàn bộ, nhưng đôi khi cũng được cho phép chỉ cắt một phần, còn nam nhân thì chỉ được cắt một lọn."
 hajj.3001.desc.equal:0 "Theo truyền thống sẽ cạo sạch toàn bộ, nhưng đôi khi cũng được cho phép chỉ cắt một phần."
 hajj.3001.a:0 "Cạo sạch hết!"
 hajj.3001.b:0 "Chỉ cắt một lọn tóc."
