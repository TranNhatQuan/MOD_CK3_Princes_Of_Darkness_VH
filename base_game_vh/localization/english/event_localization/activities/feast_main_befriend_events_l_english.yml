l_english:
 #Host Main Event
  feast_main_befriend.1001.t:2 "Bàn Cao Sập Xuống"
  feast_main_befriend.1001.opening:1 "Chiếc bàn lớn dành cho giới quý tộc thượng lưu trên bục phát ra một tiếng rắc lớn, rồi ngay sau đó sụp xuống dưới sức nặng của thức ăn và đồ trang trí mạ vàng!\n\n"
  feast_main_befriend.1001.getting_close:1 "Khi ta cùng các vị khách danh giá nhất phải ngồi chen giữa hàng quý tộc thấp hơn, ta lại ngồi gần [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_friend'))] của ta, [potential_friend.GetTitledFirstName]!"
  feast_main_befriend.1001.arrogant_guest:0 "Tuy nhiên, [arrogant_guest.GetTitledFirstName] lại tỏ ra khó chịu, nói với mọi người rằng thật là một sự sỉ nhục lớn khi phải ngồi cùng những lãnh chúa và phu nhân chỉ khá hơn thường dân đôi chút."
  feast_main_befriend.1001.arrogant_kind_link:0 "Ngược lại hẳn,"
  feast_main_befriend.1001.kind_to_lower_nobility:0 "[kind_to_lower_nobility.GetTitledFirstName] lại tỏ ra đầy phong thái và khiêm nhường giữa những kẻ thấp hơn [kind_to_lower_nobility.GetHerHis]."
  feast_main_befriend.1001.really_hungry:0 "[kind_to_lower_nobility.GetSheHe|U] còn liên tục bảo những vị khách đói nhất rằng họ nên đến thăm nhà [kind_to_lower_nobility.GetHerHis] sớm nhất có thể."
  feast_main_befriend.1001.no_kind_target:0 "Khi các quý tộc cao sang hòa lẫn với những người thấp hơn, cả lời kết bạn lẫn thù ghét đều được trao đổi giữa những người hiếm khi qua lại."
  feast_main_befriend.1001.friendship:0 "\n\n[potential_friend.GetFirstNameNoTooltip] và ta đã trò chuyện suốt cả buổi tối, và chúng ta đều đồng ý rằng đây không phải lần cuối chúng ta cùng nhau yến tiệc và cười đùa!"
  feast_main_befriend.1001.a:0 "Thật là một đêm tuyệt vời!"
 #Potential Friend Main Event
  feast_main_befriend.2001.t:2 "Bàn Cao Sập Xuống"
  feast_main_befriend.2001.opening:1 "$feast_main_befriend.1001.opening$"
  feast_main_befriend.2001.getting_close:0 "Điều tưởng như tai họa lại hóa thành may mắn, khi ta lại ngồi gần chủ tiệc của chúng ta, [activity.GetOwner.GetTitledFirstName]!"
  feast_main_befriend.2001.arrogant_guest:0 "Tuy nhiên, [arrogant_guest.GetTitledFirstName] lại tỏ ra khó chịu với chỗ ngồi mới của [arrogant_guest.GetHerHis], và nói với mọi người rằng thật là một sự sỉ nhục lớn khi phải ngồi giữa những kẻ chỉ khá hơn thường dân đôi chút."
  feast_main_befriend.2001.arrogant_kind_link:0 "Ngược lại hẳn,"
  feast_main_befriend.2001.kind_to_lower_nobility:0 "[kind_to_lower_nobility.GetTitledFirstName] lại tỏ ra đầy phong thái và khiêm nhường giữa những kẻ thấp hơn [kind_to_lower_nobility.GetHerHis]."
  feast_main_befriend.2001.really_hungry:0 "[kind_to_lower_nobility.GetFirstName] còn nói với các vị khách rằng [kind_to_lower_nobility.GetSheHe] luôn cố gắng tử tế với những người gần đói như chính [kind_to_lower_nobility.GetSheHe]."
  feast_main_befriend.2001.no_kind_target:0 "\n\nKhi các quý tộc cao sang hòa lẫn với những người thấp hơn, cả lời kết bạn lẫn thù ghét đều được trao đổi giữa những người hiếm khi qua lại."
  feast_main_befriend.2001.friendship:0 "\n\nTừ chỗ ngồi nơi bàn thấp của ta, bữa tiệc đã thành công tốt đẹp, không ít là vì [activity.GetOwner.GetFirstNameNoTooltip] đồng ý rằng đây không phải lần cuối chúng ta cùng ngồi xuống yến tiệc, trò chuyện và cười đùa."
  feast_main_befriend.2001.a:0 "Thật là một buổi tối tuyệt vời!"
 #Arrogant Guest Main Event
  feast_main_befriend.2002.t:2 "Bàn Cao Sập Xuống"
  feast_main_befriend.2002.arrogant_guest:1 "Ta không thể tin nổi khi toàn bộ quý tộc thượng lưu bị dời khỏi bục cao xuống sàn giữa những nam tước và $knight_culture_player_plural_no_tooltip_lowercase$. [activity.GetOwner.GetTitledFirstName] coi ta là gì chứ? Một kẻ thường dân ư?! Ta đã để càng nhiều người càng tốt biết rõ ta nghĩ gì, nhất là đám quý tộc giả hiệu quanh ta!"
  feast_main_befriend.2002.disgusted_by_kindness:0 "\n\nNhư thể xát muối vào vết thương của ta, [kind_to_lower_nobility.GetTitledFirstName] lại được ca ngợi suốt đêm vì tỏ ra \"tử tế\" và \"khiêm nhường\" giữa đám người này. [kind_to_lower_nobility.GetSheHe] không còn chút tự trọng nào sao?"
  feast_main_befriend.2002.a:0 "Chi bằng so ta với nông dân luôn đi."
  feast_main_befriend.2002.because_of_hospitality_tenet:1 "Bởi vì [faith|E] của ngươi vốn dạy phải tôn trọng khách:"
 #Kind to Nobility Main Event
  feast_main_befriend.2003.t:2 "Bàn Cao Sập Xuống"
  feast_main_befriend.2003.opening:0 "Chiếc Bàn Cao dành cho giới quý tộc thượng lưu trên bục phát ra một tiếng rắc lớn, rồi ngay sau đó sụp xuống dưới sức nặng của thức ăn và đồ trang trí mạ vàng! Tất cả chúng ta phải chuyển xuống ngồi giữa tầng quý tộc thấp hơn trên sàn Đại Sảnh."
  feast_main_befriend.2003.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] tỏ ra rất khó chịu với chỗ ngồi mới của [arrogant_guest.GetHerHis], và nói với mọi người rằng thật là một sự sỉ nhục lớn khi phải ngồi cùng những lãnh chúa và phu nhân chỉ khá hơn thường dân đôi chút."
  feast_main_befriend.2003.kind_to_glutton:0 "\n\nCòn ta thì đặc biệt chú ý đến [glutton_target.GetTitledFirstName] và cơn thèm ăn khủng khiếp của [glutton_target.GetHerHis]. [glutton_target.GetSheHe|U] tham lam xé từng miếng thịt, nước thịt chảy dọc má [glutton_target.GetHerHis], trong khi cơn đói quen thuộc bắt đầu cồn cào trong bụng ta khi ta tiếp tục chuyền thức ăn cho [glutton_target.GetHerHim]."
  feast_main_befriend.2003.cannibal_kindness:1 "\n\nTừ chỗ ngồi mới, ta nhìn các nam tước và $knight_culture_player_plural_no_tooltip_lowercase$ nhồi nhét thức ăn vào miệng há hốc, và khi cơn đói dâng lên trong ta, ta đề nghị lau mỡ trên cằm ai đó, chỉ để có thể chạm vào chiếc cổ mềm mại, đầy đặn ấy..."
  feast_main_befriend.2003.kind_to_lower_nobility:1 "\n\nTa nhìn những lãnh chúa, phu nhân và $knight_culture_player_plural_no_tooltip_lowercase$ ấy mà không hề khinh miệt. Khi trò chuyện với họ, ta nhận ra họ cũng có nhiều nỗi lo, khó khăn và niềm vui giống như ta ở vị thế cao hơn. Khi buổi tối trôi qua, ta chia sẻ thức ăn từ đĩa của mình và kể vài câu chuyện để đáp lại."
  feast_main_befriend.2003.ending:0 "\n\nSau đó, [activity.GetOwner.GetTitledFirstName] nói với ta rằng tất cả khách khứa đều nhận ra sự khiêm nhường và lòng tốt mà ta đã thể hiện giữa những người thấp hơn mình."
  feast_main_befriend.2003.a:0 "Ta rất vui vì đã gặp những người này."
 #Glutton Target Main Event
  feast_main_befriend.2004.t:2 "Bàn Cao Sập Xuống"
  feast_main_befriend.2004.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] tỏ ra rất khó chịu với chỗ ngồi mới của [arrogant_guest.GetHerHis], và nói với mọi người rằng thật là một sự sỉ nhục lớn khi phải ngồi cùng những lãnh chúa và phu nhân chỉ khá hơn thường dân đôi chút."
  feast_main_befriend.2004.kindness_from_other:0 "\n\nTuy nhiên ta lại may mắn được ngồi cạnh [kind_to_lower_nobility.GetTitledFirstName], và chúng ta nói chuyện hàng giờ về niềm vui của thức ăn và việc ăn uống. Dĩ nhiên là chỉ khi ta không đang nhồi thịt vào miệng! Ta có thể thấy chỉ cần nhìn ta thôi cũng khiến [kind_to_lower_nobility.GetFirstName] đói hơn!"
  feast_main_befriend.2004.a:0 "Rốt cuộc mọi thứ đều ổn thỏa."
 #General Guest Main Event
  feast_main_befriend.3001.t:2 "Bàn Cao Sập Xuống"
  feast_main_befriend.3001.arrogant_guest:0 "\n\n[arrogant_guest.GetTitledFirstName] tỏ ra rất khó chịu với chỗ ngồi mới của [arrogant_guest.GetHerHis], và nói với mọi người rằng thật là một sự sỉ nhục lớn khi phải ngồi cùng những lãnh chúa và phu nhân chỉ khá hơn thường dân đôi chút."
  feast_main_befriend.3001.kind_to_lower_nobility:0 "\n\n[kind_to_lower_nobility.GetTitledFirstName] đã thể hiện phong thái và sự khiêm nhường giữa những kẻ thấp hơn [kind_to_lower_nobility.GetHerHis]. Hành xử của [kind_to_lower_nobility.GetHerHis|U] là điều mà tất cả chúng ta nên noi theo."
  feast_main_befriend.3001.really_hungry:0 "[kind_to_lower_nobility.GetSheHe|U] cũng chia sẻ thức ăn của [kind_to_lower_nobility.GetHerHis] cho người khác, chúc họ có sức khỏe dồi dào và thân thể cường tráng."
  feast_main_befriend.3001.ending:0 "\n\nKhi các quý tộc cao sang hòa lẫn với những người thấp hơn, cả lời kết bạn lẫn thù ghét đều được trao đổi giữa những người hiếm khi qua lại."
  feast_main_befriend.3001.a:0 "Ta cảm thấy mình đã học được điều gì đó."
 #Host End Event
  feast_main_befriend.5002.t:2 "Một Tình Bằng Hữu"
  feast_main_befriend.5002.desc:0 "Khi các vị khách rời đi, dường như ai cũng mang tâm trạng vui vẻ. Ta cũng nhẹ nhõm khi thấy [potential_friend.GetTitledFirstName] không rời đi mà không nói lời từ biệt.\n\nCả hai chúng ta đều biết rằng chúng ta sẽ sớm gặp lại nhau."
  feast_main_befriend.5002.a:0 "Thật là một [potential_friend.GetWomanMan]."
 #Potential Friend End Event
  feast_main_befriend.5003.t:2 "Một Tình Bằng Hữu"
  feast_main_befriend.5003.desc:0 "Trước khi rời bữa tiệc, ta phải nói với [host_saying_goodbye.GetTitledFirstName] rằng ta đã có một khoảng thời gian tuyệt vời. [host_saying_goodbye.GetSheHe|U] bảo ta đứng dậy khỏi tư thế quỳ, rồi đặt một bàn tay vững chãi lên vai ta.\n\nTa tin rằng sẽ không lâu nữa chúng ta sẽ lại gặp nhau."
  feast_main_befriend.5003.a:0 "Đây thật sự là điều đặc biệt."
 #General Guest End Event
  feast_main_befriend.5004.t:2 "Một Tai Nạn Đáng Nhớ"
  feast_main_befriend.5004.desc:0 "Khi ta chuẩn bị rời đi cùng những vị khách khác, ta không khỏi mỉm cười khi nhớ lại những ngày vừa qua.\n\nHóa ra đó là một bữa tiệc tuyệt vời, và việc giao lưu với những vị khách khác tầng lớp thậm chí còn cho ta vài góc nhìn mới."
  feast_main_befriend.5004.a:1 "Hẹn gặp lại lần sau, [ROOT.Char.Custom2('RelationToMe', activity.GetOwner)] của ta!"
