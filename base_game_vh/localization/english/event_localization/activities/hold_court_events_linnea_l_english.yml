l_english:
 hold_court.5010.t:0 "[county.GetNameNoTierNoTooltip|U] Mất Kiểm Soát"
 hold_court.5010.desc_marshal:0 "[marshal.GetCouncilTitle] [marshal.GetTitledFirstName] tiến đến trước ngai.\n\n"
 hold_court.5010.desc:0 "Một [peasant.GetWomanMan] nông dân rụt rè tiến đến trước ngai của ta, tay nắm chặt chiếc mũ của [peasant.GetHerHis].\n\n"
 hold_court.5010.desc.outro:0 "\"[county.GetName|U] đang tràn lan bất ổn và thảo khấu, [ROOT.Char.Custom('FormOfAddressForLiege')]. Chỉ cần ban cho vùng này chút ngân quỹ, trật tự có thể được khôi phục.\""
 hold_court.5010.a:0 "Ý kiến thú vị, hãy thử xem."
 hold_court.5010.b:0 "Ngươi nói đúng, điều chúng ta cần là #EMP đổ máu thật nhiều#!!"
 hold_court.5010.c:1 "Ta không có thời gian cho chuyện này."

 hold_court.5030.t:0 "Ngôn Ngữ Viết"
 hold_court.5030.desc:1 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đưa cho ta một trang giấy đầy những ký hiệu xa lạ, khăng khăng rằng nó hoàn toàn có thể đọc được.\n\n\"Ta đã phát triển một hệ chữ viết dành riêng cho các [courtier.GetWomenMen] trong triều, bởi chữ viết hiện nay phần lớn chỉ được dạy cho [courtier.Custom('WomenMenOpp')]. Nếu ngài cho phép, ta sẽ bắt đầu dạy các [courtier.Custom('LadiesLords')] ngay lập tức!\"\n\nTa không khỏi tưởng tượng sự tự do mà loại chữ viết ấy có thể mang lại!"
 hold_court.5030.a:0 "Thật là một ý tưởng tuyệt vời!"
 hold_court.5030.courtiers:0 "Tất cả Cận Thần [courtier.Custom('FemaleMale')|U]"
 hold_court.5030.b:0 "Thầy dạy triều đình [court_tutor.GetFirstNameNoTooltip] sẽ giúp ngươi truyền dạy nó."
 hold_court.5030.c:0 "Tài năng của ngươi có thể dùng vào việc tốt hơn!"
