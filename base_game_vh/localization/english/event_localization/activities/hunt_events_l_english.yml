l_english:
 hunt.0050.t:0 "Tiếng Gọi Hoang Dã"
 hunt.0050.desc:0 "Hươu, nai, thỏ rừng, hang ổ! Cuộc săn mang đến biết bao điều để học hỏi và tận hưởng: chinh phục thiên nhiên, tình bằng hữu và nghi lễ, và dĩ nhiên, cảm giác phấn khích!\n\nNhiều người trước ta đã dấn thân vào những thú vui cao quý — dù đẫm máu — này. Giờ ta bắt đầu hiểu vì sao..."
 hunt.0050.a:0 "Ta không thể chờ đến cuộc săn tiếp theo!"
 hunt.0050.b:0 "Chỉ là trò tiêu khiển tầm thường..."
 # Maintenance Events
 hunt.0080.t:1 "Kết Thúc Quá Sớm"
 hunt.0080.t.inheritor:1 "Nạn Nhân Của Hoang Dã"
 hunt.0080.imprisoned_self:1 "Bị [ROOT.Char.GetImprisonedBy.GetTitledFirstNamePossessive] giam giữ an toàn, cuộc săn của ta xem như đã chấm dứt..."
 hunt.0080.imprisoned:0 "Vì [host.GetTitledFirstName] đã bị [ROOT.Char.GetImprisonedBy.GetTitledFirstNamePossessive] giam giữ, xem ra chúng ta đành trở về tay trắng..."
 hunt.0080.wounded_self:0 "Do vết thương của ta, người ta đã quyết định hủy bỏ cuộc săn và đoàn người sẽ trở về."
 hunt.0080.wounded:0 "Do những thương tích mà [invalidated_flavor.GetTitledFirstName] phải chịu, người ta quyết định hủy bỏ cuộc săn và đoàn người sẽ trở về."
 hunt.0080.assassination:1 "Ngày hôm đó đang diễn ra suôn sẻ cho đến khi [invalidated_flavor.GetTitledFirstName] đột ngột khăng khăng hủy bỏ cuộc đi săn, tuyên bố [invalidated_flavor.GetSheHe] sợ hãi cho mạng sống của [invalidated_flavor.GetHerHis] sau một lần suýt chết. Những tin đồn về một âm mưu ám sát tràn ngập."
 hunt.0080.abduction_attempt:1 "Khi đoàn săn tiến gần con mồi, tiếng hét chói tai của một [invalidated_flavor.GetWomanMan] vang lên át cả tiếng chó sủa không ngừng.\n\nMột [invalidated_flavor.GetTitledFirstName] rối bời lao ra khỏi [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] kêu cứu, khóc lóc rằng có kẻ đã định bắt cóc [invalidated_flavor.GetHerHim]!\n\n"
 hunt.0080.abduction:0 "Cuộc đi săn dường như đang diễn ra suôn sẻ, cho đến khi có ai đó nhận thấy rằng [invalidated_flavor.GetTitledFirstName] không còn trong đoàn nữa, và sau đó không thể tìm thấy [invalidated_flavor.GetHerHim].\n\nKhi chúng ta rà soát [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')], chúng ta bắt gặp những dấu vết của một cuộc vật lộn tại [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.0080.assassination_culprit:1 "Chúng ta gần như đã đuổi kịp con mồi thì một [invalidated_flavor.GetTitledFirstName] trông có vẻ sợ hãi lao vào tầm nhìn — sự vắng mặt của [invalidated_flavor.GetHerHis] cho đến nay vẫn không bị chú ý.\n\nGiữa những hơi thở hổn hển, [invalidated_flavor.GetSheHe] tuyên bố đã thoát chết trong gang tấc khỏi một âm mưu sát hại [invalidated_flavor.GetHerHis]! Thậm chí gây sốc hơn là mục tiêu trong lời cáo buộc của [invalidated_flavor.GetHerHis]: [invalidated_culprit.GetTitledFirstName]!\n\n[invalidated_culprit.GetWomanMan] đó không thấy đâu cả, dường như đã chạy trốn khỏi hiện trường..."
 hunt.0080.abduction_attempt_culprit:0 "\n\n[invalidated_flavor.GetSheHe|U] khiến mọi người ngạc nhiên khi chỉ thẳng vào [invalidated_culprit.GetTitledFirstName], và việc [invalidated_culprit.GetHerHis] biến mất đột ngột càng khiến lời buộc tội thêm phần đáng tin..."
 hunt.0080.abduction_culprit:0 "\n\nVì [invalidated_culprit.GetTitledFirstName] cũng vắng mặt một cách đáng ngờ, nhiều kết luận hiển nhiên đã được đưa ra..."
 hunt.0080.death_inheritor:1 "Ta vừa được báo rằng [host.GetTitledFirstName] đã chết! Hình như [host.GetSheHe] đã [host.GetDeathReason] khi đang săn bắn."
 hunt.0080.death_inheritor_killer:1 "Cuối cùng tên [host.Custom2('InsultNoun', ROOT.Char)] khốn kiếp ấy, [host.GetTitledFirstName], đã bị loại bỏ — và chính tay ta làm điều đó."
 hunt.0080.death:0 "Sau cái chết bi thảm của [invalidated_flavor.GetTitledFirstName], người đã [invalidated_flavor.GetDeathReasonHideKiller], người ta quyết định hủy bỏ cuộc săn và đoàn người sẽ trở về."
 hunt.0080.desc_inheritor:0 "\n\nVới tư cách [ROOT.Char.GetTitleAsNameNoTooltip] mới của [ROOT.Char.GetPrimaryTitle.GetNameNoTier], có rất nhiều việc phải sắp xếp sau biến cố bất ngờ này..."
 hunt.0080.desc:0 "\n\nĐành phải chờ đến lần săn tiếp theo..."
 hunt.0080.a:0 "Đây quả là thú tiêu khiển nguy hiểm."
 hunt.0080.b:0 "Ta muốn cái đầu con thú đó treo trên tường!"
 hunt.0081.t:1 "Thay Đổi Kế Hoạch"
 hunt.0081.sick:1 "Với tình trạng hiện tại của ta, có lẽ tốt hơn là nên trở về nhà, bên lò sưởi và chiếc giường ấm."
 hunt.0081.wounded:1 "Cơn đau khiến việc cưỡi ngựa trở nên khó khăn, mà cố gắng trong tình trạng này chắc chắn sẽ trả giá."
 hunt.0081.host:0 "\n\nTa không muốn làm mọi người thất vọng, nhưng sức khỏe vẫn phải đặt lên trước..."
 hunt.0081.guest:0 "\n\nThật đáng tiếc nếu bỏ lỡ phần còn lại của cuộc săn của [host.GetTitledFirstNamePossessive], nhưng liệu có đáng mạo hiểm không?"
 hunt.0081.a:0 "Có lẽ ta nên dừng lại."
 hunt.0081.b:0 "Ta vẫn ổn..."
 hunt.0082.t:0 "Bị Cắt Ngắn"
 hunt.0082.a:0 "Thật kinh khủng!"
 hunt_wounded_guest_leaves_toast:0 "Khách Bị Thương"
 # Invitation Events
 hunt.0100.opening_desc:0 "Ta trân trọng mời ngươi đến dự một cuộc săn lớn tại [barony.GetNameNoTier]!"
 hunt.0101.desc:0 "Ta trân trọng mời ngươi đến một cuộc săn tại [barony.GetNameNoTier]! Đây sẽ là một sự kiện lớn, xứng đáng với sự hiện diện cao quý của ngươi."
 hunt.0102.desc:0 "Ta trân trọng mời ngươi đến một cuộc săn tại [barony.GetNameNoTier]! Sẽ có những cuộc săn thú tuyệt vời cùng bạn hữu đồng hành."
 hunt.0110.t:0 "Sự Tham Dự Thảm Hại"
 hunt.0110.desc:0 "Thật khó tin. Dù ta đã gửi lời mời và chuẩn bị chu đáo, không một vị khách nào đến dự cuộc săn của ta.\n\nKhông sao! Ta sẽ tự mình tận hưởng cuộc săn — càng nhiều vinh quang cho ta!"
 hunt.0120.desc:0 "Ngươi nhận lời mời của ta rồi lại đi dự cuộc săn của [other_host.GetTitledFirstNamePossessive] — ta không hiểu nổi, nhưng hãy biết rằng ta sẽ nhớ chuyện này."
 # Start Events
 hunt.0500.t.sighting:2 "Rình Theo [activity.Custom('GetAnimalType')|U]"
 hunt.0500.t.boar:1 "Heo Rừng Hùng Mạnh"
 hunt.0500.t.hart:1 "Con Mồi Cao Quý"
 hunt.0500.t.large:1 "Triển Vọng Tốt"
 hunt.0500.t.small:1 "Con Mồi Ít Ỏi"
 hunt_start_tt:1 "[host.GetShortUIName|U] sẽ truy tìm #V [activity.Custom('GetAnimalType')]#!"
 hunt_opening_master_of_hunt:0 "[hunt_participant.GetTitledFirstName], [host.GetShortUINamePossessiveNoFormat] [ROOT.Char.Custom('GetHuntMasterDesc')], triệu tập đoàn săn khi ánh sáng chiếu tới"
 hunt_opening_hunt_leader:1 "[hunt_participant.GetTitledFirstName] tập hợp đoàn săn khi mặt trời mọc trên"
 hunt_opening:0 "Đoàn săn được gọi tập hợp khi bình minh ló rạng trên"
 hunt_opening_rural:1 "trại săn trong vùng [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] gần [host.GetCurrentLocation.GetNameNoTooltip]."
 hunt_opening_hunting_grounds:1 "khu săn nằm trong [activity.GetCurrentPhase.GetLocation.GetTitle.GetBaseNameNoTierPossessiveNoTooltip] [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
 hunt_opening_royal_reserves:1 "khu săn hoàng gia giữa [activity.GetCurrentPhase.GetLocation.GetTitle.GetBaseNameNoTierPossessiveNoTooltip] [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
 hunt_opening_entourage_few:1 "Sau khi hỏi vài người giữ rừng địa phương, có vài lời bàn về dấu vết và mùi của thú quanh đây."
 hunt_opening_entourage_normal:1 "Những người giữ rừng địa phương đã rà soát khu vực tìm dấu vết mới."
 hunt_opening_entourage_many:1 "Nhiều người giữ rừng và xua thú của ta đã tìm kiếm dấu vết khắp khu vực."
 hunt.0500.boar:0 "Rõ ràng có một con heo rừng to lớn trong vùng — nguy hiểm nhưng xứng đáng."
 hunt.0500.hart:0 "Có vẻ một con hươu lớn chắc chắn đang ở quanh đây — một con mồi đáng giá!"
 hunt.0500.roe:1 "Rõ ràng có một con [activity.Custom('GetAnimalType')] đực nhỏ gần đây, nhưng không thấy dấu vết thú lớn hơn."
 hunt.0500.buck:0 "Một con hươu đực chắc chắn đang ở đây, và điều kiện săn bắn khó có thể tốt hơn!"
 hunt.0500.bison:1 "Một đàn [activity.Custom('GetAnimalType')] ở gần, và trong đó có một con bò đực khổng lồ!"
 hunt.0500.no_bison:1 "Người ta nói không có dấu vết hươu hay bò rừng nào gần đây, dù vùng đất này #EMP rất#! thích hợp để săn [activity.Custom('GetAnimalType')]."
 hunt.0500.no_deer:1 "Dù tiếc là không thấy dấu vết hươu đực, nhưng rõ ràng có rất nhiều [activity.Custom('GetAnimalPlural')]."
 hunt.0500.desc_prestigious:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] rạng rỡ. \"Chúng ta sắp có một cuộc săn tuyệt vời!\""
 hunt.0500.desc_large:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] cười lớn. \"Chắc sẽ rất thú vị!\""
 hunt.0500.desc_small:1 "\n\n[hunt_participant.GetFirstNameNoTooltip] nhún vai. \"Không sao, một con [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')] vẫn có thể đem lại cuộc săn tuyệt vời!\""
 hunt_opening_sighting:1 "\n\nHãy xem lời đồn có đúng không..."
 hunt.0500.guest:1 "\n\nCuối cùng, [host.GetTitledFirstName] quyết định hôm nay [host.GetSheHe] muốn săn một con [activity.Custom('GetAnimalType')]."
 hunt.0500.a:0 "Đi thôi!"
 hunt.0500.b:0 "Ta muốn lùa cáo ra."
 hunt.0500.c:0 "Thay vào đó ta sẽ dồn bắt thỏ rừng."
 hunt.0500.d:2 "Ta đến đây để săn [host.Custom('GetRegionalDeerType')]!"
 hunt.0500.f:0 "Ta muốn săn thứ gì đó thật hăng máu!"

 hunt.0510.t:0 "[activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] Huyền Thoại"
 hunt.0510.desc:0 "\n\nHọ vẫn chưa tìm thấy gì, nhưng ta cảm nhận được: sinh vật lẩn tránh kia đang ở đâu đó gần đây..."
 hunt.0510.a:0 "Con thú đó sẽ là của ta!"

 hunt.0520.t.sighting:0 "[activity.Custom('GetAnimalType')|U] Phiền Toái"
 hunt.0520.t.tiger:0 "Felis Horribilis"
 hunt.0520.t.lion:0 "Bờm Vàng"
 hunt.0520.t.leopard:0 "Con Mồi Đốm"
 hunt.0520.t.lynx:0 "Con Mồi Thanh Nhã"
 hunt.0520.t.bear:0 "Định Hướng Lại"
 hunt.0520.t.hyena:0 "Ai Đang Cười?"
 hunt.0520.t.wolf:0 "Bầy Sói Phiền Phức"
 hunt.0520.b:0 "Mang [ROOT.Char.Custom('GetAnimalTypeCaptive')] của ta ra! Chúng ta săn!"
 hunt.0520.c:0 "Chắc hẳn quanh đây có vài con [ROOT.Char.Custom('GetRegionalWolfPlural')]."

 hunt.0530.t.sighting:0 "Truy Đuổi [activity.Custom('GetAnimalPlural')|U]"
 hunt.0530.t.rare:0 "Những Loài Chim Dị Quốc"
 hunt.0530.t.common:0 "Theo Cánh Chim"
 hunt.0530.b:0 "Ta nghĩ một con [activity.Custom('GetAnimalTypeWaterfowl')] là đủ rồi."
 hunt.0530.c:0 "Lúc nào cũng có một con [activity.Custom('GetAnimalTypeGamebird')] để bắt."
 hunt.0530.d:0 "Ta muốn xem [activity.Custom('GetRaptorType')] của ta bắt một con thỏ."

 hunt_opening_falconry_sighting:0 "\n\nMong rằng những báo cáo kia là đáng tin."
 hunt_opening_falconry:1 "Nếu may mắn, chúng ta sẽ tìm thấy một đàn [activity.Custom('GetAnimalPlural')] thuộc nhóm [activity.Custom('GetAnimalGroup')], và những con [activity.Custom('GetRaptorPlural')] của chúng ta sẽ có một cuộc săn thật sôi nổi."
 hunt_opening_entourage_few_falconry:0 "\n\nNhững người dồn thú ít ỏi chúng ta mang theo đã sẵn sàng cùng bầy chó của họ, và đã tìm ra một lộ trình thích hợp."
 hunt_opening_entourage_normal_falconry:0 "\n\nCác đội dồn thú đã sẵn sàng với những con chó săn của họ, và một vị trí thuận lợi đã được chọn."
 hunt_opening_entourage_many_falconry:0 "\n\nNhững người dồn thú của ta hẳn sẽ không gặp khó khăn gì khi buộc lũ chim phải lộ diện, và họ đã ghi nhận vài nơi hứa hẹn sẽ có kết quả."
 
 hunt_opening_standard_sighting:1 "\n\nNgười của ta đã thu thập những lần trông thấy [activity.Custom('GetAnimalType')] đang lang thang quanh vùng."
 hunt_opening_dangerous_sighting:0 "\n\nNgười của ta đã thu thập những lần trông thấy con [activity.Custom('GetAnimalType')] đang gieo rắc kinh hoàng trong vùng."
 hunt_opening_dangerous:0 "\n\nTrùng hợp thay, gần đây một con [activity.Custom('GetAnimalType')] hung hãn đã khiến cả vùng khiếp sợ."

 hunt.0520.cat:0 "Con quái vật ấy đã cướp đi mạng sống của vài người dân địa phương, và ngày càng táo tợn khi được tự do lang thang."
 hunt.0520.bear:0 "Nó rình rập giữa những [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')], cướp gia súc từ các ngôi làng gần đó và khiến những người đi hái lượm khiếp đảm."
 hunt.0520.wolf:0 "Đàn [activity.Custom('GetAnimalGroup')] này là một tai họa, bới phá các trang trại rồi rút sâu vào những [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')]."

 hunt_opening_entourage_few_dangerous:0 "Với ít người thế này có thể sẽ khó khăn, nhưng nếu may mắn chúng ta sẽ tìm được con thú và chấm dứt nỗi kinh hoàng của nó."
 hunt_opening_entourage_normal_dangerous:0 "Chúng ta #EMP hẳn là#! có đủ người để tìm và dồn con thú vào góc mà không quá vất vả."
 hunt_opening_entourage_many_dangerous:0 "Chúng ta có vô số cặp mắt, chưa kể giáo mác — triều đại gieo rắc kinh hoàng của con thú sẽ chấm dứt hôm nay!"

 hunt.0520.a:0 "Không còn thời gian để lãng phí."

 hunt_header: "[ROOT.Char.Custom('HuntHeader')]:"
 hunt.1001.t:4 "Dồn [activity.Custom('GetAnimalType')|U] Vào Góc"
 hunt.1001.desc_opening_courtier:1 "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, là người đầu tiên trông thấy [activity.Custom('GetAnimalFeature')] của nó."
 hunt.1001.desc_opening:1 "Phóng mắt khắp vùng đất, ta bỗng giật mình. Nó kia rồi, với [activity.Custom('GetAnimalFeature')] rõ ràng!"
 hunt.1001.desc_opening_courtier_plural:1 "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, là người đầu tiên phát hiện cả [activity.Custom('GetAnimalGroup')]."
 hunt.1001.desc_opening_plural:1 "Phóng mắt khắp vùng đất, ta bỗng giật mình. Kia rồi, cả một [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.bison:1 "\n\nCẩn thận đưa đoàn săn vào vị trí, chúng ta lao xuống đàn thú đang [activity.Custom('GetAnimalSoundParticiple')], tách một con [activity.Custom('GetAnimalMale')] xứng đáng khỏi đám đông hoảng loạn.\n\n"
 hunt.1001.desc:2 "\n\nCon [activity.Custom('GetAnimalMale')] [activity.Custom('GetAnimalAdjective')] khó mà nhìn rõ, nhưng chắc chắn nó đang ở đó, quan sát chúng ta từ giữa [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\n"
 hunt.1001.closing_chase:0 "[host.GetTitledFirstName] thúc ngựa đuổi theo con thú, hét lên: "Mau lên, nó chạy mất rồi!""
 hunt.1001.closing_ambush:0 "[host.GetTitledFirstName] suy nghĩ một lát rồi ra hiệu sang trái, "Mau lên, chúng ta sẽ chặn đầu nó!""
 hunt.1001.closing_herd:1 "Chúng ta đứng giữa con [activity.Custom('GetAnimalType')] đơn độc và đàn [activity.Custom('GetAnimalGroup')] đang bỏ chạy. Cuộc truy đuổi thực sự bắt đầu!"
 hunt.1001.closing:1 "Nó nhìn thẳng vào mắt ta và — như thể cảm nhận được ý định của ta — bỗng lao đi trong chớp mắt với bộ lông [activity.Custom('GetAnimalColor')]!"
 hunt.1001.desc_opening_courtier_dangerous:0 "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, phát hiện con [activity.Custom('GetAnimalType')] đang quan sát chúng ta từ xa, thân mình căng cứng — sẵn sàng bỏ chạy."
 hunt.1001.desc_opening_dangerous:0 "Quan sát [host.GetCurrentLocation.Custom('GetTerrainType')], ta bỗng nhìn thấy nó, như thể nó luôn ở đó: con [activity.Custom('GetAnimalType')]!"
 hunt.1001.desc_opening_courtier_plural_dangerous:0 "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, ra hiệu qua vùng [host.GetCurrentLocation.Custom('GetTerrainType')] — cả đàn [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalGroup')] đang nấp trong một hõm đất gần đó."
 hunt.1001.desc_opening_plural_dangerous:0 "Quan sát [host.GetCurrentLocation.Custom('GetTerrainType')], ta bỗng nhìn thấy chúng, như thể chúng đã ở đó từ lâu: cả [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.wolf:0 "\n\nNhững con thú bật dậy khi chúng ta tiến gần, [activity.Custom('GetAnimalSoundParticiple')] báo động khi rút vào [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], [activity.Custom('GetAnimalDanger')] gầm gừ.\n\n"
 hunt.1001.desc_dangerous:0 "\n\nCon thú [activity.Custom('GetAnimalAdjective')] là một cảnh tượng đáng sợ. Những con ngựa bắt đầu hoảng loạn khi nhìn thấy [activity.Custom('GetAnimalFeature')] của nó giữa [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\n"
 hunt.1001.closing_plural_dangerous:0 "Chúng ta đuổi theo lũ thú [activity.Custom('GetAnimalColor')] đang tháo chạy, tập trung vào con lớn nhất trong đàn. Cuộc săn thực sự bắt đầu!"
 hunt.1001.closing_dangerous:0 "Không báo trước, nó [activity.Custom('GetAnimalChargePresent')] lao đi trong chớp mắt với bộ lông [activity.Custom('GetAnimalColor')], biến mất sau một gò đất!"
 hunt.1001.a:1 "Đuổi theo! Lên ngựa!"
 hunt.1001.a.flavor_1:0 "#EMP Tiến lên!#!"
 hunt.1001.a.flavor_2:0 "#EMP Theo dấu!#!"
 hunt.1001.a.flavor_3:0 "#EMP Mau lên!#!"
 hunt.1001.a.flavor_4:0 "#EMP Xông lên!#!"
 hunt.1001.a.tt:0 "Tai nạn sẽ dễ xảy ra hơn"
 hunt.1001.b:1 "Bình tĩnh! Coi chừng [host.GetCurrentLocation.Custom('GetRandomRegionalDanger')]!"
 hunt.1001.b.flavor:0 "#EMP An toàn trước hết!#!"
 hunt.1001.c:1 "Lối này, chặn đầu nó!"
 hunt.1001.c.flavor:1 "#EMP Thợ săn, dồn nó về phía hàng cung của chúng ta!#!"
 hunt.1001.d:0 "Đi thôi!"

 hunt.1002.desc:2 "Thế giới của ta thu hẹp lại vào thiên nhiên quanh mình khi chúng ta theo lũ chó vượt địa hình gồ ghề, lần theo mùi của con [activity.Custom('GetAnimalType')] đang bỏ chạy.\n\n"
 hunt.1002.courtier:0 "Cưỡi ngựa song song với [hunt_participant.GetTitledFirstName], ta chỉ nghe thấy tiếng vó ngựa dồn dập, chó sủa, người hét...\n\nNiềm phấn khích dâng trào khi chúng ta dần áp sát con mồi!"
 hunt.1002.alone:0 "Bám sát dấu vết, ta chỉ nghe thấy tiếng vó ngựa dồn dập, chó sủa, người hét...\n\nNiềm phấn khích dâng trào khi ta dần áp sát con mồi!"
 hunt.1002.a:1 "Nhanh lên [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.1002.a.alone:0 "Gần rồi, ta bắt được ngươi rồi!"

 hunt.1003.desc:1 "Sau nhiều giờ cưỡi ngựa, cuối cùng chúng ta cũng dồn con thú ranh mãnh vào góc — cuộc truy đuổi không hề vô ích!\n\n"
 hunt.1003.bay:1 "Con vật kiệt sức và hoảng loạn quay lại chống cự, chật vật đứng vững và [activity.Custom('GetAnimalSoundParticiple')] trong tuyệt vọng."
 hunt.1003.dogs:1 "Con [activity.Custom('GetAnimalMale')] mệt mỏi đã kiệt sức: bị chó cắn rồi, nó co rúm trong sợ hãi khi bầy chó tiến lại, được những người giữ dây kìm lại."
 hunt.1003.dangerous:0 "Dù mệt mỏi hay thách thức, con [activity.Custom('GetAnimalType')] cuối cùng cũng dừng lại, quay về phía chúng ta và gầm lên một tiếng [activity.Custom('GetAnimalSound')] kinh thiên."
 hunt.1003.injured:1 "\n\n[wounded_courtier.GetTitledFirstName] hẳn sẽ nổi giận khi [wounded_courtier.GetSheHe] bỏ lỡ khoảnh khắc này!"
 hunt.1003.bison:1 "\n\nĐối mặt với một con [activity.Custom('GetAnimalType')] khổng lồ ở khoảng cách gần như vậy, nhất là khi nó đang [activity.Custom('GetAnimalStrikeParticiple')] dữ dội, đủ khiến ngay cả [ROOT.Char.GetWomanMan] dũng cảm nhất cũng phải rùng mình, nhưng lũ chó và thợ săn đã bao vây nó."
 hunt.1003.boar:1 "\n\nCon [activity.Custom('GetAnimalType')] kiêu hãnh rít lên ghê rợn, cặp nanh sắc bén sẵn sàng xé toạc bất kỳ ai đến gần, khi nó bị bao vây bởi lũ chó săn và các thợ săn."
 hunt.1003.hart:1 "\n\nCon [activity.Custom('GetAnimalType')] hùng vĩ, cặp gạc dựng đứng, vẫn còn sức phản kháng, [activity.Custom('GetAnimalSoundParticiple')] khi chó săn và giáo mác vây quanh."
 hunt.1003.deer:1 "\n\nKhông khí vang dội tiếng tù và, tiếng chó sủa và tiếng hò reo của đoàn săn khi vòng vây khép lại quanh con [activity.Custom('GetAnimalMale')] ngoan cố."
 hunt.1003.fox:1 "\n\nCon [activity.Custom('GetAnimalType')] kinh hãi nhận ra nó không còn đường thoát khi chó săn và thợ săn dàn hàng quanh nó."
 hunt.1003.hare:1 "\n\nNó đã cho chúng ta, và đặc biệt là lũ chó, một cuộc rượt đuổi tuyệt vời, lao đi, đánh lạc hướng và ẩn nấp giữa từng bụi cây và hốc đất của [host.GetCurrentLocation.Custom('GetTerrainType')] — nhưng cuối cùng chúng ta vẫn bắt được nó!"
 hunt.1003.claws:1 "\n\nCác thợ săn dè dặt bao vây nó bằng giáo khi nó vung những móng vuốt chết chóc."
 hunt.1003.fangs:0 "\n\nCác thợ săn nhanh chóng bao vây con thú đang gầm gừ, nó trừng mắt nhìn ta, hàm răng nhe ra sủi bọt và nhỏ dãi."
 hunt.1003.a:1 "Ta sẽ bắn nó."
 hunt.1003.a.small:0 "Khoan đã! Ta muốn luyện tập khả năng ngắm bắn."
 hunt.1003.a.flavor:0 "$hunt.1012.a.tt$"
 hunt.1003.b:2 "Chính tay ta sẽ hạ nó!"
 hunt.1003.b.small:1 "Ta sẽ kết liễu nó."
 hunt.1003.b.flavor:0 "#EMP Nhận lấy này, súc sinh!#!"
 hunt.1003.c:0 "[hunt_participant.GetFirstNameNoTooltip], phát bắn này là của ngươi."
 hunt.1003.d:0 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)|U], hãy để ta xem ngươi hạ nó!"
 hunt.1003.d.good:0 "Ta ban vinh dự này cho [intentee.GetFirstNameNoTooltip]."
 hunt.1003.d.bad:0 "[intentee.GetFirstNameNoTooltip]! Nó là của ngươi!"
 hunt.1003.d.small:0 "Cẩn thận con này đấy, [ROOT.Char.Custom2('RelationToMe', hunt_participant)]!"
 hunt.1003.e:0 "Chuẩn bị giáo! Tiến lên!"
 hunt.1003.e.flavor:1 "#EMP Hai người bên trái, hai người bên phải!#!"
 hunt.1003.f:1 "Thả chó săn!"
 hunt.1003.f.flavor:0 "#EMP Chúng xứng đáng với con mồi này!#!"
 hunt.1003.f.success:0 "Bầy chó hạ gục nó"
 hunt.1003.f.killed:0 "...nhưng bị nó cào xé"
 hunt.1003.g:0 "Dừng lại! Thả con vật tội nghiệp đó đi."
 hunt.1003.g.flavor:0 "#EMP Chúng ta đã săn nó rồi, không cần phải đổ máu...#!"
 hunt.1003.h:0 "Tiến lên, thợ săn! Giết nó!"
 hunt.1003.h.flavor:0 "#EMP Ta sẽ... đảm bảo nó không vượt qua được các ngươi...#!"
 hunt.1003.i:1 "Nhanh lên [murder_target.GetFirstNameNoTooltip], theo ta, trước khi nó thoát!"
 hunt.1003.i.flavor:0 "#EMP Sẽ thật đáng tiếc nếu cây giáo của ta trượt tay...#!"
 hunt.1003.j:0 "Ta muốn bắt sống nó #EMP sống#!!"

 hunt.1004.desc:1 "Chúng ta gần như không thể theo kịp con thú chết tiệt khi nó lao vút và lạng lách qua [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], [activity.Custom('GetAnimalSoundParticiple')] một cách điên cuồng.\n\nLeo qua một gò đất rồi biến mất vào bụi rậm dày đặc, con [activity.Custom('GetAnimalType')] biến mất nhanh như khi nó xuất hiện, chỉ để lại những con chó thở hồng hộc và lũ ngựa đẫm mồ hôi làm bằng chứng."
 hunt.1004.wounded:0 "\n\n"Có lẽ chờ [hunt_participant.GetTitledFirstName] không phải là ý hay..."
 hunt.1004.wounded_host:0 "\n\nThật là vận rủi khốn kiếp— *argh*... Có lẽ ta nên quay về trại..."
 hunt.1004.a:0 "Con khốn đó biến mất rồi!"
 hunt.1004.a.tt:0 "Cứ chờ đó!"
 hunt.1004.b:1 "[wounded_guest.GetFirstNameNoTooltip] làm chậm chúng ta, đồ ngu!"

 hunt.1005.t:1 "Một Mũi Giáo Cho [murder_target.GetFirstNameNoTooltip]"
 hunt.1005.opening:1 "Chúng ta vây quanh con [activity.Custom('GetAnimalSoundParticiple')] [activity.Custom('GetAnimalType')], giáo chĩa tua tủa, nhưng mắt ta lại dõi theo [ROOT.Char.Custom2('RelationToMe', murder_target)] của ta, [murder_target.GetFirstName], chờ đợi một cơ hội...\n\n"
 hunt.1005.opportunity:1 "Khi con [activity.Custom('GetAnimalMale')] hoảng loạn đột ngột [activity.Custom('GetAnimalStrikePresent')],"
 hunt.1005.desc:1 "Ta khéo léo ngã xuống [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')], ngọn giáo “mất kiểm soát” của ta lia ngang cổ [murder_target.GetFirstNamePossessiveNoTooltip] nhanh đến mức không thể né — gần như không kịp nhìn thấy.\n\nCả đoàn sững lại khi [hunt_participant.GetFirstNameNoTooltip] ôm lấy vết thương của [hunt_participant.GetHerHis] trong kinh hoàng. "Cứu!" ta kêu lên, "[murder_target.GetFirstNameNoTooltip] bị thương rồi!", trước khi bước chắn giữa [murder_target.GetHerHim] và con [activity.Custom('GetAnimalType')].\n\nKhi bụi đất lắng xuống, tất cả đều tin rằng đó chỉ là một tai nạn bi thảm..."
 hunt.1005.a:0 "#EMP Sao#! chuyện này có thể xảy ra...?"
 hunt.1006.desc:2 "Ta giả vờ loạng choạng sang bên, né khỏi đường của nó, khiến ngọn giáo của ta cắm thẳng vào hông [murder_target.GetFirstNamePossessive] đang tru lên!\n\nDù không chí mạng như ta mong đợi, nhưng với chút may mắn vết thương đó rồi cũng sẽ lấy mạng hắn. Chúng ta hạ gục con [activity.Custom('GetAnimalMale')] khi [murder_target.GetSheHe] bị kéo đi..."
 hunt.1006.a:1 "Đồ chó may mắn! Lẽ ra ngươi phải chết!"
 hunt.1006.b:1 "Xin lỗi! [participant_to_blame.GetFirstNameNoTooltip] đẩy ta!"
 hunt.1006.c:0 "Lần sau tránh đường ta ra, đồ ngu!"
 hunt.1007.desc:2 "Ta giả vờ mất thăng bằng, khiến ngọn giáo kéo xước ngang hông [murder_target.GetHerHis] khi [murder_target.GetSheHe] đau đớn.\n\nRõ ràng ta chỉ làm xước nhẹ [murder_target.GetHerHim], nhưng ánh mắt kinh ngạc của [murder_target.GetHerHis] cùng hàng lông mày nhướng lên của những thợ săn khác buộc ta phải nói gì đó khi chúng ta đã hạ gục con [activity.Custom('GetAnimalMale')]..."
 hunt.1007.a:0 "Ối! #weak *nhún vai*#!"
 hunt.1007.a.success:1 "[murder_target.GetFirstNameNoTooltip] nghi ngờ ngươi"
 hunt.1007.a.failure:1 "[murder_target.GetFirstNameNoTooltip] tin tưởng ngươi"
 hunt.1007.b:0 "Coi như ngươi may mắn vì chưa tệ hơn."
 hunt.1007.c:0 "Khốn kiếp, thử né #EMP cái này#! đi đồ chó!"
 hunt.1007.d:1 "Ta thật sự xin lỗi [murder_target.GetFirstNameNoTooltip]!"
 hunt.1007.e:0 "Có lẽ giờ ngươi không còn nợ ta nữa."
 hunt.1008.desc:1 "Ta cố xoay xở vào vị trí để tung một cú đâm “tình cờ”, nhưng [murder_target.GetFirstNameNoTooltip] cứ không chịu đứng yên...\n\nTrước khi ta kịp nhận ra, cả đoàn đã gây vết thương chí mạng cho con [activity.Custom('GetAnimalMale')], và một “tai nạn” lúc này sẽ quá lố bịch để ai tin..."
 hunt.1008.a:0 "Chết tiệt..."

 hunt.1009.desc:3 "Khi con [activity.Custom('GetAnimalType')] biến mất vào vùng [host.GetCurrentLocation.Custom('GetTerrainType')], ta biết con mồi đã thoát."
 hunt.1009.desc_injured:2 "\n\nThật đáng tiếc khi [hunt_participant.GetTitledFirstName] phải bị thương vì một con [activity.Custom('GetAnimalType')] trốn thoát, nhưng những rủi ro như vậy chính là một phần của sự kích thích."
 hunt.1009.desc_uninjured:1 "\n\nChúng ta xuống ngựa để cho lũ ngựa nghỉ ngơi, và [hunt_participant.GetTitledFirstName] gật đầu [hunt_participant.GetHerHis] thông cảm."

 hunt.1011.t:2 "Chư Hầu Vô Lễ"
 hunt.1011.desc_horse:2 "Ngay khi [ROOT.Char.Custom2('RelationToMe', nice_courtier)] của ta, [nice_courtier.GetTitledFirstName], vừa bắt đầu xuống ngựa, chân còn lủng lẳng trên yên, thì [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)] của ta, [murder_target.GetTitledFirstName], cố tình húc vào ngựa của [nice_courtier.GetHerHis], khiến [nice_courtier.GetHerHim] ngã lăn xuống đất."
 hunt.1011.desc_talk:2 "Khi cả đoàn thong thả tiến bước, ta nghe thấy [murder_target.GetTitledFirstName] phía sau ta, rít lên từ lưng ngựa săn của [murder_target.GetHerHis]:\n\n"Nhìn cái [nice_courtier.Custom2('InsultAdjective', SCOPE.sC('murder_target'))] [nice_courtier.Custom2('InsultNoun', SCOPE.sC('murder_target'))] kia kìa!"\n\n[murder_target.GetSheHe|U] chỉ vào [ROOT.Char.Custom2('RelationToMe', nice_courtier)] của ta, [nice_courtier.GetTitledFirstName], người dường như đang rất khó chịu trước những lời sỉ nhục."
 hunt.1011.a:1 "Ngươi hành xử như một đứa trẻ, và sẽ bị trừng phạt như một đứa trẻ."
 hunt.1011.b:1 "Đây không phải cách một [murder_target.GetTitleTierName] nên hành xử."
 hunt.1011.c:0 "Ha, [nice_courtier.GetFirstNameNoTooltip] đỏ mặt như củ cải rồi!"

 hunt.1012.t:1 "Một Mũi Tên Cho [murder_target.GetFirstNameNoTooltip]"
 hunt.1012.opening:1 "Cung trong tay, bước chân lặng lẽ, mắt dõi theo [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] khi ta chờ con [activity.Custom('GetAnimalType')]... Hít sâu một hơi — đó là [murder_target.GetTitledFirstName] sao?\n\n"
 hunt.1012.desc:2 "[ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)] của ta đang rạp mình trong [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] phía trước, toàn tâm chú ý vào con [activity.Custom('GetAnimalMale')] đang tiến lại gần.\n\n"
 hunt.1012.accomplice:0 "Ta liếc sang [accomplice.GetFirstName], kẻ khẽ gật đầu gần như không thể nhận ra, chân mày nhíu lại đầy quyết tâm, chờ tín hiệu của ta."
 hunt.1012.alone:1 "Ta lén nhìn quanh — đây có lẽ là cơ hội tốt nhất ta có..."
 hunt.1012.closing:1 "Con [activity.Custom('GetAnimalMale')] tiến lại gần, gần như đã ở ngay trước mắt..."
 hunt.1012.a:2 "Thật đáng tiếc ta đã không thấy [murder_target.GetHerHim]..."
 hunt.1012.a.accomplice:1 "Thật đáng tiếc chúng ta đã không thấy [murder_target.GetHerHim]..."
 hunt.1012.a.tt:0 "#EMP Vút!#!"
 hunt.1012.b:1 "Không, giờ chưa phải lúc..."
 hunt.1012.b.flavor:1 "#EMP Thời khắc của [murder_target.GetHerHis|U] rồi sẽ đến...#!"

 hunt.1013.desc:2 ""Ta #EMP đã cố#! can thiệp, nhưng trước khi ta kịp hiểu chuyện gì xảy ra, con [activity.Custom('GetAnimalType')] đã giẫm lên [murder_target.GetHerHim]! Ít nhất thì [murder_target.GetSheHe] cũng không phải chết một mình..."\n\nNhững người khác may thay không hỏi han gì nhiều về lời tường thuật của ta về cái chết bi thảm của [murder_target.GetTitledFirstNamePossessive].\n\n"Ta chỉ ước mình có thể làm được nhiều hơn...""
 hunt.1013.a:1 "Không thể tin nổi! Cuộc săn này kết thúc!"
 hunt.1013.b:1 "Thật là bi kịch. Giờ thì con [activity.Custom('GetAnimalType')] đó đâu rồi?"

 hunt.1014.desc:2 "Khi [murder_target.GetTitledFirstName] loạng choạng bước ra khỏi [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], tay ôm cánh tay đang chảy máu của [murder_target.GetHerHis], ta ngẩng lên khỏi túi nước của mình và thốt lên một tiếng kinh ngạc rất thuyết phục.\n\n"#EMP Ai#! vẫn còn chưa hiểu rằng thứ chúng ta phải bắn là #EMP con thú kia#!?!" [murder_target.GetSheHe] tức giận quát lên khi [murder_target.GetSheHe] tiến lại gần."
 hunt.1014.a:1 "Vậy thì đó chẳng phải là một cú bắn hoàn hảo sao?"
 hunt.1014.all_honorable_hunt_participants:3 "Những người tham dự [activity.GetShortName] danh dự:"
 hunt.1014.all_who_dislike_or_are_evil:3 "Những người tham dự [activity.GetShortName] ghét [murder_target.GetShortUIName] hoặc thích nhìn kẻ khác đau khổ:"
 hunt.1014.b:2 "[participant_to_blame.GetFirstNameNoTooltip] chẳng phải vừa ở ngay sau lưng ngươi sao...?"
 hunt.1014.c:1 "Ngươi định đổ lỗi cho sự vụng về của chính mình lên chúng ta sao?"

 hunt.1015.desc:2 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]?! Argh! Có phải là người không, [ROOT.Char.Custom('FormOfAddressForLiege')]?\"\n\n[murder_target.GetTitledFirstName] nhìn trân trân giữa cây cung trong tay ta và mũi tên cắm trên cánh tay của [murder_target.GetHerHis].\n\n\"Người đã nghĩ gì vậy?!\""
 hunt.1015.a:2 "Ôi trời, để ta xem lại cánh tay đó!"
 hunt.1015.b:2 "Ngươi tốt hơn hết nên #EMP quên#! chuyện này đi."
 hunt.1015.c:0 "Ta không bao giờ bắn trượt hai lần."
 hunt.1015.d:1 "Đây là một... tai nạn đáng tiếc."
 hunt.1015.e:2 "Ta có cách khiến [murder_target.GetHerHim] quên đi."

 hunt.1016.desc:2 ""[ROOT.Char.GetTitledFirstNameNoTooltip], đó là #EMP ngài#! sao?!"\n\n[murder_target.GetTitledFirstName] nhìn từ cây cung của ta sang mũi tên cắm dưới đất ngay chân [murder_target.GetHerHis] rồi lại nhìn ta.\n\n"Ha! Lại bắn trượt như thường lệ phải không, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 hunt.1016.a:1 "Cứ chờ đó đi, [murder_target.GetFirstNameNoTooltip]..."

 hunt.1021.t:3 "Xa Chốn Người"
 hunt.1021.desc:1 "Rời xa những người khác, ta tình cờ bắt gặp một túp lều nhỏ nơi ở của một trong những người đẹp nhất mà ta từng nhìn thấy.\n\n[beautiful_peasant.GetSheHe|U] mời ta ở lại nghỉ ngơi, và ta ngạc nhiên khi nhận ra mình có nhiều điểm chung với một nông dân bình thường đến vậy.\n\n"Ngài phải quay lại cuộc săn sớm thế sao, [ROOT.Char.Custom('FormOfAddressForLiege')]? Ta chưa từng gặp một [ROOT.Char.GetWomanMan] nào như ngài trước đây...""
 hunt.1021.a:2 "Có lẽ ta có thể ở lại thêm #EMP một chút#!..."
 hunt.1021.b.thrill:0 "Ngoài kia còn con mồi thú vị hơn đang chờ ta!"
 hunt.1021.b.purpose:0 "Ta đến đây để săn bắn, không hơn."
 hunt.1021.b.appropriate:0 "Như vậy thật không thích hợp!"
 hunt.1021.b.cruel:0 "Ở lại với ngươi, một nông dân bẩn thỉu sao?!"
 hunt.1021.c:1 "Xin hãy để ta sắp xếp cho ngươi đến sống tại [ROOT.Char.Custom('GetCourt')], [beautiful_peasant.GetFirstNameNoTooltip]."
 hunt.1021.c.success:0 "Một Cuộc Sống tại [ROOT.Char.Custom('GetCourt')|U]"
 hunt.1021.c.failure:0 "Một Cuộc Sống Bình Dị"
 hunt.1021.c.failure_tt:0 "[beautiful_peasant.GetFirstNameNoTooltip] ở lại trong rừng"
 hunt.1021.d:1 "Xin hãy để ta sắp xếp cho ngươi đến sống tại [ROOT.Char.Custom('GetCourt')], [beautiful_peasant.GetFirstNameNoTooltip]."
 every_consort_tt:0 "Mọi [spouse|E] và [lover|E]"

 hunt.1022.t:2 "Bình Minh Nơi Ẩn Dật"
 hunt.1022.desc:1 "Khi ta chuẩn bị rời đi, ký ức về khuôn mặt xinh đẹp của [beautiful_peasant.GetHerHis], vặn vẹo trong đam mê, vẫn còn vương vấn trong tâm trí ta. [beautiful_peasant.GetSheHe|U] vuốt ve tấm da lông chúng ta nằm lên khi [beautiful_peasant.GetSheHe] nhìn ta.\n\n"Điều này không nhất thiết phải là đêm duy nhất chúng ta ở bên nhau," [beautiful_peasant.GetSheHe] rì rầm."
 hunt.1022.a:1 "Ta e rằng đúng là như vậy..."
 hunt.1022.a.tt:2 "#EMP Có lẽ ta sẽ không bao giờ gặp lại [beautiful_peasant.GetHerHim] nữa...#!"
 hunt.1022.b:1 "Hãy đến sống cùng ta, tại [ROOT.Char.Custom('GetCourt')]."

 hunt.1023.t:2 "Chó Săn"
 hunt.1023.desc:2 "[ROOT.Char.Custom('DogStoryName')] chạy lon ton bên cạnh ta, rõ ràng đang rất thích thú với thời gian ở ngoài trời của [ROOT.Char.Custom('DogStoryHerHis')].\n\nĐột nhiên [ROOT.Char.Custom('DogStorySheHe')] khựng lại và bắt đầu sủa, và chỉ vài giây sau có thể nghe thấy thứ gì đó đang di chuyển trong bụi rậm. Một thứ gì đó rất lớn.\n\nTiếng sủa của [ROOT.Char.Custom('DogStoryHerHis')|U] chuyển thành tiếng gầm gừ đúng lúc con [host.Custom('GetAnimalType')|l] lao thẳng vào đường chúng ta!"
 hunt.1023.a:0 "Tiến lên [ROOT.Char.Custom('DogStoryName')], bắt nó!"
 hunt.1023.a.good:2 "[ROOT.Char.Custom('DogStoryName')] hạ gục con [host.Custom('GetAnimalType')|l]"
 hunt.1023.a.bad:0 "[ROOT.Char.Custom('DogStoryName')] chết trong cuộc vật lộn"
 hunt.1023.b:2 "Ta sẽ hạ nó, [ROOT.Char.GetWomanMan] đối đầu với [host.Custom('GetAnimalType')|l]."

 hunt.1030.t:1 "Phục Kích Chờ Thời"
 hunt.1030.desc:1 "Những thợ săn của ta đã chỉ ra một khoảng trống hẻo lánh ở phía khuất gió của nơi ẩn náu của con thú, một nơi hoàn hảo để chúng ta dàn hàng cung và chờ con [activity.Custom('GetAnimalType')] bị lũ chó săn dồn về đó.\n\nĐây sẽ là cơ hội tốt để luyện tập bắn cung vào một mục tiêu đang di chuyển thật sự."
 hunt.1030.guest:0 "Những thợ săn của [host.GetTitledFirstNamePossessive] đã chỉ ra một khoảng trống hẻo lánh ở phía khuất gió của nơi ẩn náu của con thú, một nơi hoàn hảo để chúng ta dàn hàng cung và chờ con [activity.Custom('GetAnimalType')] bị lũ chó săn dồn về đó.\n\n"
 hunt.1030.ambush:0 "Chủ nhân của chúng ta suy nghĩ một lúc rồi gật đầu, "Được, chúng ta sẽ giăng một cuộc phục kích nhỏ!""
 hunt.1030.a:0 "Một đề nghị tuyệt vời."
 hunt.1030.b:0 "Không, ta muốn dồn nó vào góc!"
 hunt.1030.c:0 "Đi thôi!"

 hunt.1032.opening:1 "Chúng ta quan sát con [activity.Custom('GetAnimalType')] từ hàng cung ẩn nấp của mình, căng thẳng chờ đợi khi tiếng hò hét của người xua thú và tiếng chó săn sủa vang ngày càng gần.\n\n"
 hunt.1032.desc:1 "Con [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalMale')] bất ngờ nhảy vào khoảng trống phía trước, [activity.Custom('GetAnimalDanger')] vung vẩy, [activity.Custom('GetAnimalChargeParticiple')] lao thẳng về phía chúng ta trong hoảng loạn."
 hunt.1032.a:0 "Khoan! Hắn là #EMP của ta#!!"
 hunt.1032.b:0 "Dừng lại, đó là [hunt_participant.GetFirstNamePossessiveNoTooltip]!"
 hunt.1032.e:0 "Bây giờ! Tất cả! #EMP BẮN!!#!"
 hunt.1032.e.tt:1 "Con [activity.Custom('GetAnimalType')] tái mét dưới cơn mưa tên"
 hunt.1032.f:0 "#EMP Chạy đi!!!#!"

 hunt.1033.desc:1 "Kế hoạch của chúng ta trở nên vô ích, con thú đã ngửi thấy bẫy của chúng ta nhờ gió hoặc linh cảm, và từ chối bị những kẻ xua thú dồn vào cuộc phục kích.\n\nCuối cùng nó hoàn toàn thoát khỏi sự truy đuổi, biến mất vào [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]..."
 hunt.1033.a:0 "Thật là con vật khôn ngoan..."
 hunt.1033.b:0 "Tất cả là lỗi của [hunt_participant.GetFirstNamePossessiveNoTooltip]!"

 hunt.1040.t:1 "Nhẹ Nhàng, Lặng Lẽ"
 hunt.1040.desc:0 "Những thợ săn của ta nói rằng họ biết nơi ẩn náu của con thú, cũng như những hố nước và bãi cỏ gần đó mà con [activity.Custom('GetAnimalType')] thường lui tới.\n\nDù đây không phải chuyện dễ dàng, nhưng nếu chúng ta cẩn thận lén tiếp cận con [activity.Custom('GetAnimalMale')], có lẽ chúng ta có thể bất ngờ bắn nó bằng cung."
 hunt.1040.guest:0 "Những thợ săn của [host.GetTitledFirstNamePossessive] nói rằng họ biết nơi ẩn náu của con thú, cũng như những hố nước và bãi cỏ gần đó mà con [activity.Custom('GetAnimalType')] thường lui tới.\n\n"
 hunt.1040.stealth:0 "Chủ nhân của chúng ta suy nghĩ một lúc rồi đồng ý rằng chúng ta nên lén tiếp cận những con thú không hề hay biết."
 hunt.1040.chase:0 "Chủ nhân của chúng ta suy nghĩ một lúc rồi khịt mũi, "Ta đến đây để săn thật sự! Chúng ta sẽ săn bằng sức mạnh, không phải lén lút!""
 hunt.1040.a:0 "Chúng ta sẽ tiến hành lén lút!"
 hunt.1040.a.flavor:0 "#EMP Giữ chó im lặng! Suỵt!#!"
 hunt.1040.b:0 "Hừ, thợ săn thực thụ sẽ dồn con mồi vào góc!"
 hunt.1040.b.flavor:0 "#EMP Ai đến sau phải dọn chuồng chó!#!"
 hunt.1040.c:0 "Vậy thì cứ thế."

 hunt.1043.desc:1 "Dù đã cố gắng hết sức, chúng ta vẫn không thể tiếp cận gần đàn [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalGroup')]: mỗi lần chúng ta đến gần chúng đều cảm nhận được và bỏ chạy.\n\nTrời gần tối để tiếp tục, chúng ta đành phải chấp nhận thất bại trước những con [activity.Custom('GetAnimalPlural')]..."
 hunt.1043.a:0 "Không thể thắng tất cả..."
 hunt.1043.b:0 "Thật là hỗn loạn, [hunt_participant.GetFirstNameNoTooltip]!"

 hunt.1060.t:0 "Cất Cánh"
 hunt.1060.desc_opening_courtier:0 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, [hunt_participant.GetTitledFirstName], ra hiệu cho cả đoàn im lặng: chúng ta đã đến điểm thả chim do những người quản trò săn bắn chuẩn bị."
 hunt.1060.desc_opening:0 "Những người quản trò săn bắn của ta ra hiệu cho cả đoàn im lặng: chúng ta đã đến điểm thả chim."
 hunt.1060.desc_guest:0 "Những người quản trò săn bắn của [host.GetTitledFirstNamePossessive] ra hiệu cho cả đoàn im lặng: chúng ta đã đến điểm thả chim."
 hunt.1060.exotic:0 "\n\nKhông xa phía trước, một đàn [activity.Custom('GetAnimalGroup')] gồm những con [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')] bay ngang bầu trời, tiếng [activity.Custom('GetAnimalSoundParticiple')] xa xa của chúng báo hiệu cuộc vui săn bắn của chúng ta!"
 hunt.1060.water:0 "\n\nTừ đây có thể nhìn rõ một đàn [activity.Custom('GetAnimalGroup')] gồm những con [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')] đang uống nước tại một cái ao phía trước."
 hunt.1060.ground:0 "\n\nTừ vị trí của mình, chúng ta có thể thấy vài con [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')] đang đi lại trong [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] phía trước."
 hunt.1060.hare:0 "\n\nTừ vị trí của mình, chúng ta có thể thấy vài con [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')] trong vùng [host.GetCurrentLocation.Custom('GetTerrainType')] phía trước."
 hunt.1060.closing:0 "\n\nCả đoàn dừng lại khi chúng ta chuẩn bị tháo mũ trùm đầu của những con chim và lần lượt thả chúng đi săn!"
 hunt.1060.beaters:0 "Những người xua thú sẽ sớm vào vị trí, sẵn sàng làm bầy thú hoảng sợ bay lên."
 hunt.1060.a:0 "Bay chuẩn nhé, nhóc."
 hunt.1060.b:0 "Ta chỉ muốn đứng xem."
 hunt.1060.b.flavor:0 "#EMP An toàn là trên hết!#!"
 hunt.1060.d:0 "Đến lúc rồi!"

 hunt.1062.t.hare:0 "Thỏ trong tay"
 hunt.1062.t:0 "Chim trong tay"
 hunt.1062.desc:0 "Ta háo hức theo dõi khi [activity.Custom('GetRaptorType')] của ta phát hiện mục tiêu và rời chỗ đậu, vút cao lên bầu trời."
 hunt.1062.guest:0 "[host.GetTitledFirstName] háo hức theo dõi khi [host.GetHerHis] [activity.Custom('GetRaptorType')] phát hiện mục tiêu và rời chỗ đậu, vút cao lên bầu trời."
 hunt.1062.exotic:0 "\n\nLeo lên vị trí truy đuổi con [activity.Custom('GetAnimalType')] thuộc đàn [activity.Custom('GetAnimalGroup')], [activity.Custom('GetRaptorType')] đang làm mọi thứ hoàn hảo! Con mồi hoảng loạn tản ra, [activity.Custom('GetAnimalSoundParticiple')] báo động, nhưng đã quá muộn!"
 hunt.1062.water:0 "\n\nNhững người xua thú đã làm bầy [activity.Custom('GetAnimalSoundParticiple')] [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')] tán loạn, giờ đây chúng lấp đầy không trung bằng tiếng đập cánh hỗn loạn."
 hunt.1062.ground:0 "\n\nBầy [activity.Custom('GetAnimalPlural')] hoàn toàn không hay biết gì khi [activity.Custom('GetRaptorType')] của ta quét nhìn mặt đất từ trên cao."
 hunt.1062.sky:0 "\n\nNó lao xuống như tia chớp: tiếng va chạm vang như sấm đến tai chúng ta chỉ khoảnh khắc sau khi con mồi rơi khỏi bầu trời!"
 hunt.1062.floor:0 "\n\nNó lao xuống như tia chớp: con mồi cuống cuồng tìm chỗ ẩn nấp, nhưng đã quá muộn!!"
 hunt.1062.a:0 "#EMP ĐÚNG RỒI!!#!"
 hunt.1062.a.flavor:0 "[activity.Custom('GetRaptorType')] của ta hôm nay sẽ được no bụng!"
 hunt.1062.b:0 "Làm tốt lắm!"

 hunt.1063.t:0 "Hai con trong bụi"
 hunt.1063.desc:0 "Hết lần này đến lần khác [activity.Custom('GetRaptorType')] của ta lao xuống để kết liễu con mồi, nhưng lại trượt, rút lui, hoặc chỉ sượt qua mục tiêu."
 hunt.1063.desc_guest:0 "Hết lần này đến lần khác [host.GetTitledFirstNamePossessive] [activity.Custom('GetRaptorType')] lao xuống để kết liễu con mồi, nhưng lại trượt, rút lui, hoặc chỉ sượt qua mục tiêu."
 hunt.1063.closing:0 "\n\nSau hàng giờ cố gắng, thú săn gần như đã biến mất hết, [activity.Custom('GetRaptorType')] gần kiệt sức, và ánh sáng đang tắt dần..."
 hunt.1063.a:0 "Luôn có lần sau."
 hunt.1063.a.flavor:0 "Con chim chết tiệt..."
 hunt.1063.d:0 "Thật đáng tiếc."

 hunt.1080.t.bodyguard:0 "Không hẳn là một mình"
 hunt.1080.t:0 "Hoàn toàn một mình"
 hunt.1080.opening_lone:0 "[ROOT.Char.Custom2('RelationToMeShort', murderer)] của ta, [murderer.GetTitledFirstName], và ta đi trước những người khác,"
 hunt.1080.opening_accomplice:0 "[ROOT.Char.Custom2('RelationToMeShort', murderer)] của ta, [murderer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', accomplice)], [accomplice.GetTitledFirstName], và ta đi trước những người khác,"
 
 hunt.1080.chase:0 "bị thúc đẩy bởi những tiếng gọi liên tục của [murderer.GetFirstNamePossessiveNoTooltip] thúc giục đuổi theo con [activity.Custom('GetAnimalType')] đang chạy trốn.\n\nLúc này ta mới nhận ra con đường đã trở nên yên tĩnh và biệt lập — tiếng của đoàn săn phía sau ngày càng xa dần, và không thấy họ đâu nữa.\n\n"
 hunt.1080.bow:0 "bị thúc đẩy bởi những tiếng gọi liên tục của [murderer.GetHerHis] giục ta đuổi theo con [activity.Custom('GetAnimalType')] đang chạy trốn.\n\nCon đường yên tĩnh và biệt lập, và ta nhận ra: đoàn săn phía sau đã mờ dần — không thấy ai nữa.\n\n"

 hunt.1080.falconry:0 "bị [murderer.GetFirstNamePossessiveNoTooltip] lớn tiếng khuyến khích rẽ khỏi đường theo những dấu vết đáng ngờ nhưng đầy khẳng định của [activity.Custom('GetAnimalPlural')].\n\nLúc này ta mới nhận ra con đường đã trở nên yên tĩnh và biệt lập — tiếng đoàn săn phía sau ngày càng xa dần, và không thấy ai nữa.\n\n"

 hunt.1080.closing_lone:0 "Quay trở lại, ta thấy [murderer.GetFirstNameNoTooltip] đang tiến đến nhanh chóng, con dao của [murderer.GetHerHis] được rút ra, một tia sáng kinh hoàng trong mắt của [murderer.GetHerHis]."
 hunt.1080.closing_accomplice:0 "Quay lại, ta thấy [murderer.GetFirstNameNoTooltip] và [accomplice.GetFirstNameNoTooltip] đang nhanh chóng tiến tới, dao rút sẵn, ánh mắt lóe lên."
 hunt.1080.closing_bow:0 "Quay lại con đường, ta thấy [murderer.GetFirstNameNoTooltip] tiến đến nhanh chóng, con dao của [murderer.GetHerHis] được rút ra, một tia sáng kinh hoàng trong mắt của [murderer.GetHerHis]."
 hunt.1080.closing_bow_accomplice:0 "Quay lại con đường, ta thấy [murderer.GetFirstNameNoTooltip] và [accomplice.GetFirstNameNoTooltip] đang nhanh chóng tiến tới, dao rút sẵn, ánh mắt lóe lên đáng sợ."

 hunt.1080.desc:0 "Ít nhất ta đã nghĩ vậy. Khi quay lại, cả đoàn săn của ta không thấy đâu nữa."
 hunt.1080.bodyguard_betray:0 "\n\n[bodyguard_betray.GetFirstNameNoTooltip], ngươi đang làm gì vậy?! Dừng lại!"
 hunt.1080.bodyguard_appears:0 "\n\nTa nghe tiếng hét phía sau: cận vệ của ta [bodyguard.GetFirstName] đang chạy dọc con đường, "#EMP [ROOT.Char.GetTitleAsNameNoTooltip], coi chừng!#!"" 
 hunt.1080.bodyguard:0 "\n\nCận vệ của ta đâu rồi, [bodyguard.GetFirstName], khi ta cần [bodyguard.GetHerHim]? Đồ ngu!"
 hunt.1080.dog_appears:0 "\n\nMột tiếng sủa lớn vang lên: ta quay lại và thấy con chó thân yêu của ta, [ROOT.Char.Custom('DogStoryName')] lao về phía ta bảo vệ, lớn tiếng báo hiệu [ROOT.Char.Custom('DogStorHerHis')] sự xuất hiện."
 hunt.1080.a.bodyguard:0 "[bodyguard.GetFirstNameNoTooltip]! Mau lên!"
 hunt.1080.a.dog:0 "[ROOT.Char.Custom('DogStoryName')]! Đúng rồi, [ROOT.Char.Custom('DogStoryGirlBoy')]!"
 hunt.1080.a.accomplice:0 "Ơ, [murderer.GetFirstNameNoTooltip]? [accomplice.GetFirstNameNoTooltip]?!"
 hunt.1080.a:0 "Ơ, [murderer.GetFirstNameNoTooltip]?"
 hunt.1080.a.duel_success_accomplice:0 "Bạn áp đảo [murderer.GetFirstNameNoTooltip] và [accomplice.GetFirstNameNoTooltip]"
 hunt.1080.a.duel_failure_accomplice:0 "[murderer.GetFirstNameNoTooltip] và [accomplice.GetFirstNameNoTooltip] áp đảo bạn"
 hunt.1080.a.duel_success:0 "Bạn áp đảo [murderer.GetFirstNameNoTooltip]"
 hunt.1080.a.duel_failure:0 "[murderer.GetFirstNameNoTooltip] áp đảo bạn"
 hunt.1080.a.success_tt:0 "[murderer.GetShortUIName|U] bị giết hoặc bị khống chế"
 hunt.1080.a.success_accomplice_tt:0 "[accomplice.GetShortUIName|U] bị giết hoặc bị khống chế"

 hunt.1081.desc:0 "Ta rút dao đi săn, kêu cứu khi [murderer.GetFirstName] tăng tốc [murderer.GetHerHis], được thúc đẩy bởi một ý định hung dữ đáng sợ. Những khoảnh khắc tiếp theo là một sự mờ nhạt...\n\n\""
 hunt.1081.desc_accomplice:0 "Ta rút dao săn của mình, kêu cứu khi [murderer.GetFirstName] và [accomplice.GetFirstName] lao về phía ta với ý định hung ác đáng sợ. Những khoảnh khắc tiếp theo trở nên mờ nhạt...\n\n"
 hunt.1081.killed:0 "Ta bất ngờ ngã ngửa xuống [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')] tay ôm ngực: chuôi dao găm nhô ra từ vết đen trên áo.\n\n"
 hunt.1081.failure_accomplice:0 "Khi ta lấy lại bình tĩnh, tim đập dồn dập, những kẻ tấn công ta đang quằn quại trên mặt đất, dao găm của chúng đã nằm ngoài tầm với"
 hunt.1081.failure:0 "Khi ta lấy lại bình tĩnh, tim đập dồn dập, kẻ tấn công ta đang quằn quại trên mặt đất, dao găm của [murderer.GetHerHis] đã nằm ngoài tầm với"
 hunt.1081.wounded_accomplice:0 "$hunt.1081.failure_accomplice$, máu đỏ sẫm nhỏ xuống từ cánh tay [accomplice.GetHerHis].\n\n"
 hunt.1081.wounded:0 "$hunt.1081.failure$, máu đỏ sẫm nhỏ xuống từ cánh tay [murderer.GetHerHis].\n\n"
 hunt.1081.escaped_accomplice:0 "$hunt.1081.failure_accomplice$.\n\n"
 hunt.1081.escaped:0 "$hunt.1081.failure$.\n\n"
 hunt.1081.murderer_killed:0 "[murderer.GetFirstNameNoTooltip] trông như thể [murderer.GetSheHe] sắp nguyền rủa ta trước khi ánh sáng mờ dần khỏi đôi mắt của [murderer.GetHerHis]."
 hunt.1081.murderer_wounded:0 "[murderer.GetFirstNameNoTooltip] nhăn mặt, rên rỉ đau đớn và ôm lấy vết thương hở."
 hunt.1081.murderer_arrested:0 "Ta giữ dao găm kề vào cổ [murderer.GetFirstNamePossessiveNoTooltip] đang choáng váng."
 hunt.1081.murderer:0 "[murderer.GetFirstNameNoTooltip] trông đầy đắc thắng khi [murderer.GetSheHe] bỏ chạy vào [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]."
 hunt.1081.accomplice_killed:0 "[accomplice.GetFirstNameNoTooltip] nằm bất động, vết thương kinh khủng chứng thực số phận [accomplice.GetHerHis].\n\n"
 hunt.1081.accomplice_wounded:0 "[accomplice.GetFirstNameNoTooltip] chỉ bị sượt qua nhưng gào lên đau đớn, mắt mở to hoảng loạn.\n\n"
 hunt.1081.accomplice_arrested:0 "[accomplice.GetFirstNameNoTooltip] hoàn toàn không bị thương, và cầu xin ta khoan hồng với đôi mắt mở to của [accomplice.GetHerHis].\n\n\""
 hunt.1081.accomplice:0 "[accomplice.GetFirstNameNoTooltip] đã chạy biến đi, tiếng cười khoái trá của [accomplice.GetHerHis] dần mất hút.\n\n"
 hunt.1081.bodyguard_wounded:0 "[bodyguard.GetFirstName] quỳ gần đó, siết chặt vết thương đang chảy máu."
 hunt.1081.bodyguard_killed:0 "[bodyguard.GetFirstName] nằm dài giữa chúng ta, dường như đã chết."
 hunt.1081.bodyguard_saved:0 "[bodyguard.GetFirstName] cầm lưỡi kiếm của [bodyguard.GetHerHis] chỉ vào từng người trong số họ, theo dõi những cái cây để tìm kiếm bất kỳ mối đe dọa nào khác."
 hunt.1081.dog_killed:0 "\n\nCon chó dũng cảm của ta, [ROOT.Char.Custom('DogStoryName')], nằm cuộn dưới chân, bất động như đang ngủ..."
 hunt.1081.dog:0 "\n\nCon chó dũng cảm của ta, [ROOT.Char.Custom('DogStoryName')], ở bên cạnh ta..."
 hunt.1081.closing_massacre:0 "Thật là một mớ hỗn độn..."
 hunt.1081.closing_success_bodyguard_dead:0 "Ngươi đã phục vụ ta rất tốt... [bodyguard.GetFirstNameNoTooltip]..."
 hunt.1081.closing_success_bodyguard_apology:0 "Ta nghe [bodyguard.GetFirstNameNoTooltip] nói, "Xin lỗi, [ROOT.Char.Custom('FormOfAddressForLiege')]..."
 hunt.1081.closing_success:0 "\n\nTa bị bỏ lại một mình, lắng nghe tiếng chim, yếu ớt kêu gọi giúp đỡ..."
 hunt.1081.a:0 "Không khoan nhượng với lũ sâu bọ!"
 hunt.1081.b:0 "Lính đâu! #EMP LÍNH ĐÂU!#! Bắt [murderer.GetHerHim]!"
 hunt.1081.b.pair:0 "Lính đâu! #EMP LÍNH ĐÂU!#! Bắt chúng!"
 hunt.1081.b.accomplice:0 "Lính đâu! #EMP LÍNH ĐÂU!#! Bắt [accomplice.GetHerHim]!"
 hunt.1081.c.rival:0 "Tên... [murderer.Custom2('InsultNoun', ROOT.Char)]..."
 hunt.1081.c.family:0 "[ROOT.Char.Custom2('RelationToMeShort', murderer)]..."
 hunt.1081.c:0 "T-tại sao...?"
 hunt.1081.d:0 "C-cái quái gì vậy..."

 hunt.1090.desc:0 "Sau nhiều giờ cưỡi ngựa lục soát khắp mọi ngóc ngách của [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], ta buộc phải thừa nhận thất bại trước ánh sáng đang tàn.\n\nCon [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] biến mất như linh hồn ngay khi chúng ta nhìn thấy nó, dường như không để lại bất kỳ dấu vết mùi hay dấu chân nào...\n\nKhi ta quay về trại, tiếng kêu xa xa của một con [activity.Custom('GetAnimalType')] chế giễu ta giữa cảnh vật đang tối dần."
 hunt.1090.guest:0 "Sau nhiều giờ cưỡi ngựa lục soát khắp mọi ngóc ngách của [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], [host.GetTitledFirstName] buộc phải thừa nhận thất bại trước ánh sáng đang tàn.\n\nCon [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] biến mất như linh hồn ngay khi chúng ta nhìn thấy nó, dường như không để lại bất kỳ dấu vết mùi hay dấu chân nào...\n\nKhi chúng ta quay về trại, tiếng kêu xa xa của một con [activity.Custom('GetAnimalType')] chế giễu [host.GetFirstNameNoTooltip] giữa cảnh vật đang tối dần."
 hunt.1090.a:0 "Ta #EMP sẽ#! tìm ra ngươi, con thú..."
 hunt.1090.a.tt:0 "Cứ chờ đó!"
 hunt.1090.b:0 "Đúng là một trải nghiệm."

 hunt.1200.t:0 "Đòn Kết Liễu"
 hunt.1200.chase_self:0 "Ta ngắm bắn khi mọi người giữ con thú kiệt sức tại chỗ, thở ra, rồi bắn!"
 hunt.1200.chase:0 "[animal_slayer.GetTitledFirstName] ngắm bắn khi mọi người giữ con [activity.Custom('GetAnimalType')] kiệt sức tại chỗ, thở ra, rồi bắn!"
 hunt.1200.ambush_self:0 "Ta cẩn thận ngắm bắn khi con [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalChargePresent')] về phía chúng ta, [activity.Custom('GetAnimalTrackPlural')] nện xuống [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.1200.ambush:0 "[animal_slayer.GetTitledFirstName] cẩn thận ngắm bắn khi con [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalChargePresent')] về phía chúng ta, [activity.Custom('GetAnimalTrackPlural')] nện xuống [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.1200.stealth_self:0 "Ta chậm rãi ngắm bắn, con [activity.Custom('GetAnimalType')] nghiêng đầu như thể đang chờ đợi."
 hunt.1200.stealth:0 "[animal_slayer.GetTitledFirstName] chậm rãi ngắm bắn, con [activity.Custom('GetAnimalType')] nghiêng đầu như thể đang chờ đợi."
 hunt.1200.slayer_fled:0 "[host.GetTitledFirstName] đột nhiên hét lên, vội vàng rút lui khỏi con thú."
 hunt.1200.slayer_group:0 "[host.GetTitledFirstName] hét lên, "#EMP BẮN!#! Hạ nó xuống!"
 hunt.1200.slayer_self_stealth:0 "[host.GetTitledFirstName] ra hiệu rằng ta nên bắn!"
 hunt.1200.slayer_self:0 "[host.GetTitledFirstName] ra hiệu rằng ta nên bắn!"
 hunt.1200.slayer_stealth:0 "Ta nghe [host.GetTitledFirstName] hét, "Nhanh lên [ROOT.Char.GetFirstNameNoTooltip], bắn đi!""
 hunt.1200.slayer:0 "[host.GetTitledFirstName] hét, "Nhanh lên [animal_slayer.GetTitledFirstName], bắn đi!""
 hunt.1200.success:1 "\n\nMũi tên cắm trúng đích, xuyên thẳng vào tim con thú!"
 hunt.1200.failure:0 "\n\nMũi tên bay sượt qua vào [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], khi con [activity.Custom('GetAnimalType')] tung một đòn [activity.Custom('GetAnimalStrike')] vào [injury_target.GetFirstName]!"
 hunt.1200.critical:0 "\n\nMũi tên bay sượt qua, con [activity.Custom('GetAnimalType')] nhanh chóng quay đầu và biến mất vào [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]!"
 hunt.1200.fled:0 "\n\nNhững người còn lại đứng đó không biết phải làm gì tiếp theo khi chúng ta tránh đường con thú."
 hunt.1200.group:0 "\n\nDây cung bật lên khi hàng chục mũi tên rít về phía con thú; nó trượt về phía chúng ta [activity.Custom('GetAnimalSoundPresent')], thân thể cắm đầy mũi tên."
 hunt.1200.a.self:0 "Đấy, bắn là phải thế!"
 hunt.1200.a:0 "Phát bắn đẹp!"
 hunt.1200.b.self:0 "Ôi, xin lỗi! Coi chừng!"
 hunt.1200.b:0 "Giúp [injury_target.GetHerHim]!"
 hunt.1200.c.self:0 "Con khốn di chuyển rồi..."
 hunt.1200.c:0 "Xui thật."
 hunt.1200.d:0 "Nó không có cơ hội nào."
 hunt.1200.e:0 "Đúng là một thợ săn!"

 hunt.1201.self:0 "Ta nâng cây giáo lên và cẩn trọng tiến về phía con thú đã kiệt sức."
 hunt.1201:0 "[animal_slayer.GetTitledFirstName] nâng [animal_slayer.GetHerHis] cây giáo lên và cẩn trọng tiến về phía con thú đã kiệt sức."
 hunt.1201.slayer_dogs:0 "[host.GetTitledFirstName] quay sang những người giữ chó và hét lên, "Thả chó săn!""
 hunt.1201.slayer_self:0 "[host.GetTitledFirstName] quay sang ta, "[ROOT.Char.GetTitledFirstName], cú kết liễu là của ngươi!""
 hunt.1201.slayer:0 "[host.GetTitledFirstName] quay sang chúng ta và hét lên, "[animal_slayer.GetTitledFirstName], cú kết liễu là của ngươi!""
 hunt.1201.success_self:0 "\n\nTa chọn đúng khoảnh khắc, đâm lưỡi dao sâu vào tim nó!"
 hunt.1201.success:0 "\n\n[animal_slayer.GetTitledFirstNameNoTooltip] chọn khoảnh khắc của [animal_slayer.GetHerHis] một cách cẩn thận, đâm lưỡi dao của [animal_slayer.GetHerHis] sâu vào tim nó!"
 hunt.1201.failure_self:0 "\n\nKhi ta đâm lưỡi dao vào nó, con thú tung một cú [activity.Custom('GetAnimalStrike')] trúng ta. Ta bị kéo ra khi nó [activity.Custom('GetAnimalSoundPresent')] trong cơn hấp hối."
 hunt.1201.failure:0 "\n\nKhi [animal_slayer.GetTitledFirstNameNoTooltip] đâm lưỡi dao của [animal_slayer.GetHerHis] vào nó, con thú tung một cú [activity.Custom('GetAnimalStrike')] trúng [animal_slayer.GetHerHim]. [animal_slayer.GetSheHe|U] bị kéo ra khi nó [activity.Custom('GetAnimalSoundPresent')] trong cơn hấp hối."
 hunt.1201.critical:0 "\n\nKhi [animal_slayer.GetTitledFirstNameNoTooltip] đâm lưỡi dao của [animal_slayer.GetHerHis] vào nó, con thú tung ra một cú [activity.Custom('GetAnimalStrike')] hung bạo, khiến [animal_slayer.GetHerHim] quằn quại với vết thương khủng khiếp!"
 hunt.1201.dogs_success:0 "\n\nBầy chó lập tức lao vào, sủa vang khi bao vây con thú, từng con một cắn xé nó bằng hàm răng..."
 hunt.1201.dogs_failure:0 "\n\nBầy chó lao vào sủa vang khi bao vây con thú, nhưng từng con một bị hạ gục giữa những tiếng tru và rên..."
 hunt.1201.animal_spared_dharmic:0 "\n\n[host.GetTitledFirstName] ra lệnh dừng cuộc săn, "Cuộc săn đã xong, theo dharma thì không nên gây thêm đau đớn vô ích.""
 hunt.1201.animal_spared:0 "\n\n[host.GetTitledFirstName] ra lệnh dừng cuộc săn, "Thế là đủ rồi. Đi thôi, hãy để con thú khốn khổ này được yên.""
 hunt.1201.a.self:0 "Nhận lấy này!"
 hunt.1201.a:0 "Một cú kết liễu đẹp!"
 hunt.1201.b.self:0 "#EMP Á!#! Con quái vật chết tiệt..."
 hunt.1201.b:0 "Nhanh lên, [injury_target.GetSheHe] cần giúp!"
 hunt.1201.c:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName]!"
 hunt.1201.d.self:0 "Ha! Đêm nay bầy chó sẽ được ăn no!"
 hunt.1201.d:0 "Hung dữ thật."
 hunt.1201.e.critical:0 "KHÔNG! Không phải con chó con của ta!"
 hunt.1201.e.self:0 "Không! Lũ thú ngu ngốc..."
 hunt.1201.e:0 "Khó mà nhìn nổi."
 hunt.1201.f.dharmic:0 "Thật xui xẻo."
 hunt.1201.f.compassionate:0 "Thật nhân từ."
 hunt.1201.f:0 "Thật vô nghĩa..."

 hunt.1202.self:0 "Ta nâng cây giáo lên và cẩn trọng tiến về phía con thú đã kiệt sức."
 hunt.1202:0 "[animal_slayer.GetTitledFirstName] nâng [animal_slayer.GetHerHis] cây giáo lên và cẩn trọng tiến về phía con thú đã kiệt sức."
 hunt.1202.slayer:0 "[host.GetTitledFirstName] quay sang chúng ta và hét lên, "Tiến lên! Kết liễu nó đi!""
 hunt.1202.slayer_self:0 "Cả nhóm lao tới, tản ra bao vây con thú đang hoảng loạn."
 hunt.1202.capture:0 "[host.GetTitledFirstName] quay sang chúng ta và hét lên, "Lấy dây thừng! Bắt sống nó!""
 hunt.1202.capture_self:0 "Những người khác đi lấy dây trong khi chúng ta tìm cách khống chế con thú."
 hunt.1202.craven:0 "[host.GetTitledFirstName] quay sang chúng ta và hét lên, "Đi đi! Các ngươi còn chờ gì nữa! Kết liễu nó!""
 hunt.1202.craven_self:0 "Những người khác lao lên trong khi ta đứng lại phía sau, siết chặt vũ khí trong tay."
 hunt.1202.capture_success:0 "Sau nhiều phút vật lộn và [activity.Custom('GetAnimalSoundParticiple')], con [activity.Custom('GetAnimalType')] cuối cùng cũng bị khống chế, bị trói chặt không thể cử động."
 hunt.1202.capture_injury:0 "Sau nhiều phút vật lộn và [activity.Custom('GetAnimalSoundParticiple')], con [activity.Custom('GetAnimalType')] bị khống chế, nhưng ta bị thương nặng trong quá trình đó."
 hunt.1202.capture_failure:0 "Sau nhiều phút vật lộn và [activity.Custom('GetAnimalSoundParticiple')], con [activity.Custom('GetAnimalType')] bị khống chế, nhưng [injury_target.GetFirstName] phải nhận một cú [activity.Custom('GetAnimalStrike')] dữ dội."
 hunt.1202.capture_critical:0 "Sau nhiều phút vật lộn và [activity.Custom('GetAnimalSoundParticiple')], con [activity.Custom('GetAnimalType')] bị khống chế, nhưng không trước khi hạ gục [injury_target.GetFirstName]."
 hunt.1202.success_self:0 "\n\nChúng ta từ từ bao vây nó, giáo chĩa ra tứ phía, rồi kết liễu con thú [activity.Custom('GetAnimalSoundParticiple')] khỏi nỗi đau của nó."
 hunt.1202.success:0 "\n\nNhững thợ săn từ từ bao vây nó, giáo chĩa ra tứ phía, rồi kết liễu con thú [activity.Custom('GetAnimalSoundParticiple')] khỏi nỗi đau của nó."
 hunt.1202.failure_injury:0 "\n\nChúng ta từ từ bao vây nó, giáo chĩa ra tứ phía, nhưng ta phải nhận một cú [activity.Custom('GetAnimalStrike')] trước khi kết liễu con thú [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202.failure_self:0 "\n\nChúng ta từ từ bao vây nó, giáo chĩa ra tứ phía, nhưng [injury_target.GetFirstName] phải nhận một cú [activity.Custom('GetAnimalStrike')] trước khi kết liễu con thú [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202.failure:0 "\n\nNhững thợ săn từ từ bao vây nó, giáo chĩa ra tứ phía, nhưng [injury_target.GetFirstName] phải nhận một cú [activity.Custom('GetAnimalStrike')] trước khi kết liễu con thú [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1202.critical_self:0 "\n\nChúng ta từ từ bao vây nó, giáo chĩa ra tứ phía, nhưng [injury_target.GetFirstName] phải nhận một cú [activity.Custom('GetAnimalStrike')] khủng khiếp trước khi chúng ta kết liễu con thú [activity.Custom('GetAnimalSoundParticiple')]!"
 hunt.1202.critical:0 "\n\nNhững thợ săn từ từ bao vây nó, giáo chĩa ra tứ phía, nhưng [injury_target.GetFirstName] phải nhận một cú [activity.Custom('GetAnimalStrike')] khủng khiếp trước khi họ kết liễu con thú [activity.Custom('GetAnimalSoundParticiple')]!"
 hunt.1202.a.self:0 "Nhận lấy này!"
 hunt.1202.a:0 "Một cú kết liễu đẹp!"
 hunt.1202.b.self:0 "#EMP Á!#! Con quái vật chết tiệt..."
 hunt.1202.b:0 "Nhanh lên, [injury_target.GetSheHe] cần giúp!"
 hunt.1202.c:0 "Thật là bi kịch..."

 hunt.2000.t:0 "Kẻ Buôn Chó Săn"
 hunt.2000.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] của ta, [m_hunt.GetTitledFirstName], đã đưa đến cho ta một [dog_salesman.GetWomanMan] tự xưng bán chó săn hạng nhất.\n\n"
 hunt.2000.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', m_hunt)] của ta, [m_hunt.GetTitledFirstName], một thợ săn nhiệt thành, đã đưa đến cho ta một [dog_salesman.GetWomanMan] bán chó săn hạng nhất.\n\n"
 hunt.2000.opening:0 "Một [dog_salesman.GetWomanMan] bán chó săn hạng nhất đã đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], dường như hy vọng tìm được khách hàng mới.\n\n"
 hunt.2000.desc:0 ""Ta chỉ bán những con chó săn tốt nhất, đã được huấn luyện và sẵn sàng tham gia bất kỳ đội săn nào. Ngài sẽ không tìm được con nào tốt hơn trong toàn bộ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip], [ROOT.Char.GetTitleAsNameNoTooltip]!"\n\nTrước mặt ta là một hàng chó săn đủ kích cỡ và giống loài, bị xích lại và ngồi yên chờ ta đánh giá."
 hunt.2000.a:0 "Một con chó săn đánh hơi tốt đáng giá ngang vàng."
 hunt.2000.b:0 "Con này có thể hạ cả lợn rừng một mình!"
 hunt.2000.b.tt:0 "Bạn sẽ không nhận sự kiện [hunt_sighting_no_prefix|E] cho đến khi tổ chức một [GetActivityType('activity_hunt').GetName]"
 hunt.2000.c:1 "Ấn tượng đấy, [dog_salesman.GetFirstNameNoTooltip]. Ngươi có muốn quản lý chuồng chó của ta không?"
 hunt.2000.d:0 "Ta không cần thêm chó."
 
 hunt.2001.t:0 "Kẻ Buôn Chim Săn"
 hunt.2001.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] của ta, [m_hunt.GetTitledFirstName], đã đưa đến cho ta một [falcon_salesman.GetWomanMan] tự xưng bán chim săn đã huấn luyện.\n\n"
 hunt.2001.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', m_hunt)] của ta, [m_hunt.GetTitledFirstName], một thợ săn nhiệt thành, đã đưa đến cho ta một [falcon_salesman.GetWomanMan] bán chim săn đã huấn luyện.\n\n"
 hunt.2001.opening:0 "Một [falcon_salesman.GetWomanMan] bán chim săn đã huấn luyện đã đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], dường như hy vọng tìm được khách hàng mới.\n\n"
 hunt.2001.desc:0 ""Đây là những con chim tốt nhất; ta đã nuôi chúng từ khi còn non; chúng sẽ không làm ngài thất vọng đâu, [ROOT.Char.GetTitleAsNameNoTooltip]!"\n\nNhiều con diều hâu và chim ưng đủ kích cỡ đang bình thản đậu trên giá trước mặt ta."
 hunt.2001.a:0 "Đây đúng là một cá thể đẹp!"
 hunt.2001.a.flavor:0 "Ta lấy nó!"
 hunt.2001.c:0 "Cuối cùng cũng gặp ngươi, [falcon_salesman.GetFirstNameNoTooltip]! Người quản lý chuồng chim của ta!"
 hunt.2001.d:0 "Rất tốt, nhưng ta không hứng thú..."

 hunt.2500.t:1 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] của [sighting_province.GetNameNoTooltip]"
 hunt.2500.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] của ta, [sighting_character.GetTitledFirstName], mang đến tin về những con thú đã được nhìn thấy trong lãnh địa của ta.\n\n"
 hunt.2500.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] của ta, [sighting_character.GetTitledFirstName], nổi tiếng vì niềm đam mê săn bắn của [sighting_character.GetHerHis], mang đến tin đồn về những con thú đã được nhìn thấy trong lãnh địa của ta.\n\n"
 hunt.2500.opening_fallback:0 Người ta nghe đủ loại tin đồn trên những con đường rộng lớn của [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip], và hôm nay, một thợ săn đặc biệt lắm lời đã nói không ngừng bên tai ta.\n\n
 hunt.2500.opening:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] của ta, [sighting_character.GetTitledFirstName], đã líu lo báo tin về những con thú được nhìn thấy trong lãnh địa của ta.\n\n"
 hunt.2500.desc:1 ""Ta nghe rất nhiều lời bàn tán từ [sighting_county.GetName]: người ta nói nơi đó có triển vọng săn bắn tuyệt vời, với nhiều con [sighting_county.Custom('GetAnimalType')] đáng giá được thấy đang lang thang trong các [sighting_province.Custom('GetTerrainTypePlural')]!""
 hunt.2500.a:0 "Thú vị..."
 hunt.2500.b:0 "Đừng làm phiền ta với chuyện này."
 hunt.2500.c: "Ta có thể dùng một thợ săn giỏi."
 
 hunt.2510.t:0 "[sighting_county.Custom('GetLegendaryColor')|U] [sighting_county.Custom('GetAnimalType')|U]"
 hunt.2510.opening_master:0 "[ROOT.Char.Custom('GetHuntMasterDesc')] của ta, [sighting_character.GetTitledFirstName], bước vào phòng ta với vẻ đầy phấn khích.\n\n"
 hunt.2510.opening_hunter:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] của ta, [sighting_character.GetTitledFirstName], nổi tiếng vì niềm đam mê săn bắn của [sighting_character.GetHerHis], bước vào phòng ta với vẻ đầy phấn khích.\n\n"
 hunt.2510.opening:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] của ta, [sighting_character.GetTitledFirstName], bước vào phòng ta với vẻ đầy phấn khích.\n\n"
 hunt.2510.desc:0 ""Ta nghe những chuyện kỳ lạ từ các kiểm lâm của [sighting_county.GetNameNoTier]: họ nói đã thoáng thấy một con [sighting_county.Custom('GetAnimalType')] với"
 hunt.2510.desc.knight_errant: ""Ta nghe những chuyện kỳ lạ từ các kiểm lâm của [sighting_county.GetName]: họ nói đã thoáng thấy một con [sighting_county.Custom('GetAnimalType')] với"
 hunt.2510.story:0 ""Các kiểm lâm của [sighting_county.GetNameNoTier] gửi báo cáo rất thuyết phục: dường như con [sighting_county.Custom('GetAnimalType')] của ngài đã được nhìn thấy ở đó, một con thú với"
 hunt.2510.black:0 "bộ lông đen tuyền.""
 hunt.2510.white:0 "bộ lông trắng như tuyết.""
 hunt.2510.closing:0 "\n\n"Nó được nói là đang lang thang trong các [sighting_province.Custom('GetTerrainTypePlural')], dù chưa ai tiếp cận được nó. Quả thực có truyền thuyết về những con thú như vậy...""
 hunt.2510.knight_errant_closing: "\n\n"Chỉ một $knight_culture_player_no_tooltip$ lừng danh như ngài mới có thể chế ngự nó, [ROOT.Char.Custom('FormOfAddressForLiege')].""
 hunt.2510.a:0 "#EMP [sighting_county.Custom('GetLegendaryColor')|U]#! sao?"
 hunt.2510.a.existing:0 "Một ngày nào đó ta #EMP sẽ#! tìm ra nó!"
 hunt.2510.b:0 "Đừng làm phiền ta với những chuyện tưởng tượng trẻ con này."
 hunt.2510.c: "Take the camp to [sighting_county.GetNameNoTierNoTooltip] — at once."

 hunt.2520.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalAdjective')|U] [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] của [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2520.desc:1 ""Ta nghe rất nhiều lời bàn tán từ [sighting_county.GetNameNoTier]: người ta nói một con [sighting_county.Custom('GetAnimalType')] hung dữ đang khủng bố các ngôi làng địa phương, bắt gia súc rồi biến mất vào các [sighting_province.Custom('GetTerrainTypePlural')]!""

 hunt.2530.t:0 "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] của [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2530.opening_master:0 Đại sư huấn luyện chim săn của ta, [sighting_character.GetTitledFirstName], bước vào phòng ta với vẻ đầy phấn khích.\n\n
 hunt.2530.opening_falconer:0 "[ROOT.Char.Custom2('RelationToMe', sighting_character)] của ta, [sighting_character.GetTitledFirstName], nổi tiếng vì niềm đam mê huấn luyện chim săn của [sighting_character.GetHerHis], bước vào phòng ta với vẻ đầy phấn khích.\n\n"
 hunt.2530.desc:0 ""Ta nghe rất nhiều lời bàn tán từ [sighting_county.GetNameNoTier]: người ta nói nơi đó có triển vọng săn bắn tuyệt vời, với nhiều con [sighting_county.Custom('GetAnimalType')] đáng giá được thấy đang lang thang trong các [sighting_province.Custom('GetTerrainTypePlural')]!""

 hunt.2540.t:0 "Từ Đây Sang Kia"
 hunt.2540.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], các kiểm lâm của ngài báo rằng số lượng [sighting_county.Custom('GetAnimalPlural')] dồi dào ở [old_sighting_county.GetBaseNameNoTier] dường như đã rời khỏi khu vực đó và di chuyển đến [sighting_county.GetName]!""
 hunt.2540.legendary:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], các kiểm lâm của ngài báo rằng con [sighting_county.Custom('GetLegendaryColor')] [sighting_county.Custom('GetAnimalType')] của [old_sighting_county.GetBaseNameNoTier] đã biến mất một thời gian trước khi được nhìn thấy ở vùng lân cận [sighting_county.GetBaseNameNoTier]!"
 hunt.2540.closing:1 "\n\n"Có lẽ ngài nên tổ chức một cuộc săn trước khi quá muộn.""
 hunt.2540.white:0 "Người ta nói nó tỏa sáng như ánh sáng thần thánh trong làn sương buổi sáng...""
 hunt.2540.black:0 "Người ta nói nó xuất hiện như sứ giả của hoàng hôn, một hố đen giữa khung cảnh...""
 hunt.2540.a:0 "Chúng có thể chạy, nhưng không thể trốn."
 hunt.2540.a.legendary:0 "Nó đang cố đánh lừa ta!"
 hunt.2540.b:0 "Ta đã chán những bản tin này rồi, [sighting_character.GetFirstNameNoTooltip]..."

 hunt.3020.t:1 "Con Mồi Gian Trá"
 hunt.3020.t.deer:0 "Không Biết"
 hunt.3020.opening:0 "Như mọi con mồi khác, con [activity.Custom('GetAnimalType')] trơn tuột có nhiều mưu mẹo, động tác né tránh và thủ đoạn có thể đánh lừa cả những thợ săn lão luyện.\n\n"
 hunt.3020.doubling:0 "con [activity.Custom('GetAnimalType')] xảo quyệt đã chạy tới lui, quay lại dấu chân của mình và tạo đường mòn giả để đánh lạc hướng chúng ta."
 hunt.3020.beating:1 "con [activity.Custom('GetAnimalMale')] đã lội dọc theo các con suối của vùng [host.GetCurrentLocation.Custom('GetTerrainType')], cố gắng làm mất dấu mùi của nó."
 hunt.3020.squatting:0 "con [activity.Custom('GetAnimalMale')] đã đứng bất động hoàn toàn trong [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], lặng lẽ ở phía sau chúng ta, thậm chí ngay dưới mũi bầy chó"
 hunt.3020.rusing:0 "con [activity.Custom('GetAnimalMale')] liên tục dùng mưu, chạy tới chạy lui theo những đường điên loạn để làm rối mùi và phá hỏng mọi nỗ lực lần theo nó"
 hunt.3020.desc_courtier:0 "[ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta, [hunt_participant.GetTitledFirstName], đã ra hiệu dừng đoàn:"
 hunt.3020.desc_fallback:0 "Các [ROOT.Char.Custom('GetGameKeepers')] của ta đã dừng lại phía trước:"
 hunt.3020.desc:1 "Dấu vết trở nên rối rắm: con [activity.Custom('GetAnimalType')] xảo quyệt đã chạy tới lui, quay lại dấu chân của mình để đánh lạc hướng chúng ta."
 hunt.3020.closing:0 "\n\nKhông ai đồng ý nên đi theo hướng nào, và mỗi khoảnh khắc chần chừ khiến chúng ta xa con mồi hơn."
 hunt.3020.a:0 "Kiên nhẫn, chuyện này dễ giải thôi."
 hunt.3020.a.perfect:0 "Bạn nhanh chóng tìm ra dấu mùi"
 hunt.3020.a.success:0 "Bạn sớm tìm ra dấu mùi"
 hunt.3020.a.failure:0 "Bạn nghĩ rằng mình tìm ra dấu mùi"
 hunt.3020.b:0 "À, ta đã nghe về mánh này."
 hunt.3020.b.success:0 "Lời khuyên của bạn có tác dụng"
 hunt.3020.b.failure:0 "Lời khuyên của bạn vô ích"
 hunt.3020.c:0 "Ta tin [hunt_participant.GetFirstNameNoTooltip] trong chuyện này."
 hunt.3020.c.perfect:0 "[hunt_participant.GetFirstNameNoTooltip] nhanh chóng tìm ra dấu mùi"
 hunt.3020.c.success:0 "[hunt_participant.GetFirstNameNoTooltip] sớm tìm ra dấu mùi"
 hunt.3020.c.failure:0 "[hunt_participant.GetFirstNameNoTooltip] dẫn chúng ta đi sai hướng"
 hunt.3020.d:0 "Nếu ta là nó, ta đã đi hướng này..."
 hunt.3020.e:0 "Hướng này. Không! Hướng kia!"
 hunt.3020.e.success:0 "Bạn đi đúng hướng"
 hunt.3020.e.failure:0 "Bạn đi sai hướng"
 hunt.3020.f:0 "Người giữ rừng địa phương nghĩ sao?"
 hunt.3020.f.flavor:0 "#EMP Hãy hỏi chuyên gia...#!"
 hunt.4001.t:2 "Phát Bắn"
 hunt.4001.opening:1 "Có điều gì đó thật uy nghi trong cách con [activity.Custom('GetAnimalType')] nhìn ra khắp phong cảnh. Ẩn mình trong [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], ta giương cung.\n\n"
 hunt.4001.desc_1:1 "Ta lặng lẽ nhìn sang [ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta, [hunt_participant.GetTitledFirstName], đang cúi mình tại [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')], người cũng làm điều tương tự."
 hunt.4001.desc_2:2 "Cẩn thận ước lượng khoảng cách tới con [activity.Custom('GetAnimalType')], với cây lao cân bằng hoàn hảo trong tay ta...\n\n[ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta, [hunt_participant.GetTitledFirstName], đang cúi bên cạnh ta, nhấc cây giáo của [hunt_participant.GetHerHis]."
 hunt.4001.desc_3:0 "Hít thở... ngắm... "
 hunt.4001.a:1 "#EMP Không! Nó là của ta!#!"
 hunt.4001.a.kill:1 "Bạn hạ gục con [activity.Custom('GetAnimalType')]"
 hunt.4001.a.stolen:1 "[hunt_participant.GetFirstNameNoTooltip] hạ gục con [activity.Custom('GetAnimalType')]"
 hunt.4001.a.both:1 "Bạn làm con [activity.Custom('GetAnimalType')] hoảng sợ bỏ chạy"
 hunt.4001.b:1 "Bắn trúng đi, [hunt_participant.GetFirstNameNoTooltip]."
 hunt.4001.c:2 "Ngay bây giờ, [hunt_participant.GetFirstNameNoTooltip], trước khi con [activity.Custom('GetAnimalType')] phát hiện chúng ta!"
 hunt.4001.c.tt:3 "Nếu ta giẫm lên cành cây này, con [activity.Custom('GetAnimalType')] chắc chắn sẽ giật mình..."
 hunt.4001.d:0 "Nhìn đây."

 hunt.4002.t:2 "Tin Đồn"
 hunt.4002.desc:3 "Âm thanh của những người khác đã dần xa khi [ROOT.Char.Custom2('RelationToMe', secret_sharer)] của ta, [secret_sharer.GetTitledFirstName], và ta lặng lẽ tiến gần con [activity.Custom('GetAnimalType')].\n\nChúng ta gần như đã ở trong tầm ra đòn thì [secret_sharer.GetFirstNameNoTooltip] thì thầm: "Giờ cuối cùng chúng ta cũng ở một mình, ta có điều phải nói với ngài — về [secret_owner.GetTitledFirstName]...""
 hunt.4002.a:1 "Để sau đi, [ROOT.Char.Custom2('RelationToMe', secret_sharer)]!"
 hunt.4002.a.flavor:1 "Con [activity.Custom('GetAnimalType')] đó là của ta!"
 hunt.4002.b:1 "Gì cơ? Nói đi..."
 hunt.4002.b.tt:3 "Con [activity.Custom('GetAnimalType')] bỏ chạy"
 hunt.4002.b.reveal:0 "Ta biết được bí mật của [secret_owner.GetFirstNamePossessiveNoTooltip]"

 hunt.4003.t:2 "Con Mồi Bất Hợp Pháp"
 hunt.4003.desc:2 "Những kẻ săn trộm, ở ngay trong [land_owner.GetTitleTierName] [host.GetCurrentLocation.Custom('GetTerrainType')] sao? Chúng tụ lại khi ta cưỡi ngựa tới cùng lính canh, vụng về cố giấu xác con [host.Custom('GetRegionalDeerType')] phía sau.\n\n"Chúng tôi không làm chuyện này! Xin hãy tha mạng, vinh quang thay [ROOT.Char.GetTitleAsNameNoTooltip]!" Nhưng dao và cung của chúng phản bội lời nói ấy."
 hunt.4003.adventurer: "Gia nhập trại của ta đi. [land_owner.GetTitleTierName] sẽ không bao giờ tìm thấy các ngươi."
 hunt.4003.a:0 "Chúng sẽ bị treo cổ, và gia đình chúng sẽ phải trả giá."
 hunt.4003.b:0 ""Các ngươi dường như đều là cung thủ rất giỏi...""
 hunt.4003.c:0 "Con thú là của ta, cùng với tiền phạt để giữ mạng chúng."
 hunt.4003.c.tt_success:0 "Quan địa phương chấp thuận"
 hunt.4003.c.tt_failure:0 "Dân chúng phẫn nộ"
 hunt.4003.d:0 ""Ta quan tâm gì đến thú săn của [land_owner.GetTitledFirstNamePossessiveNoTooltip]?"" 
 hunt.4003.d.own:0 "Cút khỏi [host.GetCurrentLocation.Custom('GetTerrainType')] của ta!"
 hunt.4003.d.vassal:0 "Cút khỏi [land_owner.GetTitledFirstNamePossessiveNoTooltip] [host.GetCurrentLocation.Custom('GetTerrainType')]!"
 hunt.4003.d.rival:0 "Cứ lấy bao nhiêu tùy thích từ [land_owner.GetTitledFirstNameNoTooltip]."
 hunt.4003.e:0 "Cuối cùng cũng gặp được thợ săn tử tế!"

 hunt.4004.t:2 "Hạ Gục Con Thú"
 hunt.4004.desc:2 "Người ta có thể tưởng nó là sinh vật trong truyền thuyết, có lẽ là một vị thần khoác hình thú. Đó là con [activity.Custom('GetAnimalType')] lớn nhất ta từng thấy.\n\nNgay cả sau khi bị thương, cuộc truy đuổi vẫn kéo dài nửa ngày.\n\nNgay cả lúc này, nó vẫn là cảnh tượng đầy uy lực khi nằm chết trước mặt ta."
 hunt.4004.credit_receiver:1 "[credit_taker.GetTitledFirstName] cũng kinh ngạc không kém. "Ta chưa từng thấy thứ gì như vậy, [ROOT.Char.Custom('FormOfAddressForLiege')].""
 hunt.4004.a:0 "Đầu của nó sẽ trông tuyệt đẹp trong đại sảnh của ta!"
 hunt.4004.b:1 "Nó sẽ là chiến lợi phẩm cho [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] của ta."
 hunt.4004.c:0 "Nó sẽ thành một chiếc áo choàng tuyệt vời!"
 hunt.4004.c.tt:0 "Không, nó #EMP KHÔNG#! lòe loẹt!"
 hunt.4004.every_arrogant_vassal:0 "Mọi chư hầu kiêu ngạo"
 hunt.4004.every_restrained_vassal:0 "Mọi chư hầu cực kỳ kiềm chế"
 hunt.4004.every_other_vassal:0 "Các chư hầu khác"
 hunt.4004.d:1 "Ta nghĩ [credit_taker.GetTitledFirstNameNoTooltip] xứng đáng nhận công này."
 hunt.4004.e:0 "Chúng ta ăn nó ngay tại đây!"
 hunt.4004.f:0 "Hộp sọ của nó sẽ làm nên một chiếc vương miện đẹp."

 hunt.4005.t:2 "Hạ Gục Con Thú"
 hunt.4005.a:0 "Con này sẽ bán được giá tốt."
 hunt.4005.b:1 "Ta sẽ làm một chiến lợi phẩm tuyệt đẹp cho [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] của ta."
 hunt.4005.c:0 "Nó sẽ được nhồi xác và gửi tới [ROOT.Char.GetFaith.ReligiousHeadName]!"

 hunt.4006.t:2 "Những Người Hái Lượm"
 hunt.4006.desc:2 "[host.GetCurrentLocation.Custom('GetTerrainTree')] thực sự là 'tấm áo cho người nghèo', nhưng khi con [activity.Custom('GetAnimalType')] hoảng loạn bỏ chạy khỏi những nông dân đang hái lượm, ta bắt đầu mất kiên nhẫn.\n\nChắc hẳn hôm nay ở [host.GetCurrentLocation.GetNameNoTooltip] còn nhiều việc tốt hơn là đào rễ và hái nấm!"
 hunt.4006.adventurer: "Đào rễ và hái nấm... cũng là một ý hay."
 hunt.4006.a:1 "Đuổi lũ này khỏi bãi săn #EMP của ta#!!"
 hunt.4006.b:0 "Chúng ta đến đây để săn bắn, phải không?"
 hunt.4006.special_interest:0 "Do sở thích khác thường của [county_owner.GetHerHis]:"
 hunt.4006.c:0 "Ồ, con mồi này cũng được đấy..."
 hunt.4006.d:0 "Một khoản quyên góp hào phóng sẽ khiến họ tránh xa đủ lâu."
 hunt.4006.e:0 "Đây #EMP là#! quyền cổ xưa của họ, ta cho là vậy..."

 hunt.4007.t:3 "[host.Custom('GetAnimalType')|U] Điên Loạn"
 hunt.4007.desc_befriend:0 "Một làn gió nhẹ thổi qua, và [ROOT.Char.Custom2('RelationToMeShort', similar_participant)] của ta, [similar_participant.GetTitledFirstName], cùng ta đang thiếp đi trong khoảng rừng yên tĩnh thì chúng ta nghe thấy nó."
 hunt.4007.desc_lazy:1 "Một làn gió nhẹ thổi qua, và [ROOT.Char.Custom2('RelationToMeShort', similar_participant)] của ta, [similar_participant.GetTitledFirstName], cùng ta đang thiếp đi trong khoảng rừng yên tĩnh thì chúng ta nghe thấy nó."
 hunt.4007.desc_lustful:1 "[ROOT.Char.Custom2('RelationToMeShort', similar_participant)] của ta, [similar_participant.GetTitledFirstName], tạo nên một vóc dáng nổi bật trong trang phục đi săn của [similar_participant.GetHerHis], và ta nguyền rủa sự xáo trộn đã kéo sự chú ý của ta ra khỏi [similar_participant.GetHerHim]."
 hunt.4007.desc_fallback:1 "Khi [ROOT.Char.Custom2('RelationToMeShort', similar_participant)] của ta, [similar_participant.GetTitledFirstName], và ta vượt qua một ngọn đồi, chúng ta nghe thấy nó."
 hunt.4007.desc_ending:2 "\n\nCành cây gãy răng rắc, lá xào xạc, chim kêu thét vì sợ hãi báo hiệu sự xuất hiện của một con [host.Custom('GetAnimalType')|l] hung dữ, và nó đang lao thẳng về phía chúng ta!\n\n[similar_participant.GetSheHe|U] thốt lên: "Nhìn kích thước của #EMP [host.Custom('GetAnimalDanger')]# kia kìa!!""
 hunt.4007.a:0 "Con đường của nó kết thúc ở đây, với ta."
 hunt.4007.a.non_martial:0 "Nhanh! Nấp sau ta, [similar_participant.GetFirstNameNoTooltip]!"
 hunt.4007.a.non_martial_self:0 "Đưa dao cho ta! Ta tự làm!"
 hunt.4007.a.success:0 "Ta giết con thú"
 hunt.4007.a.failure:0 "Ta bị thương"
 hunt.4007.a.critical_failure:0 "Ta bị giết"
 hunt.4007.b:1 "[similar_participant.GetFirstNameNoTooltip], làm gì đó đi!"
 hunt.4007.b.non_martial:0 "Cứu với! Có ai không!"
 hunt.4007.b.success:0 "[THIS.Char.GetTitledFirstNameNoTooltip] giết con thú"
 hunt.4007.b.failure:0 "[THIS.Char.GetTitledFirstNameNoTooltip] bị thương"
 hunt.4007.b.critical_failure:0 "[THIS.Char.GetTitledFirstNameNoTooltip] bị giết"
 hunt.4007.c:0 "Còn dễ xử lý hơn một cận thần bị ruồng bỏ!"
 hunt.4007.d:0 "[bodyguard.GetFirstNameNoTooltip]! Lại đây!"
 hunt.4007.e:0 "#EMP BIẾN ĐI, ĐỒ QUÁI VẬT HÔI HÁM!#!"
 hunt.4007.f:0 "#EMP Chạy đi!#!"
 
  hunt.4900.t:1 "[activity.Custom('GetAnimalTypeKill')|U] Điên Loạn"
  hunt.4900.desc:1 "Con thú khổng lồ dừng lại ngay trước khi chạm tới chúng ta, [activity.Custom('GetAnimalSoundParticipleKill')] và [activity.Custom('GetAnimalStrikeParticipleKill')] điên cuồng."
  hunt.4900.hunter:1 "\n\nTa rút dao khỏi thắt lưng và đứng chắn giữa con [activity.Custom('GetAnimalTypeKill')] và [similar_participant.GetFirstName] ngay trước khi con vật bất ngờ [activity.Custom('GetAnimalChargePresentKill')] lao tới.\n\nLưỡi dao của ta tìm thấy trái tim nó,"
  hunt.4900.hunter_wound:1 "nhưng không trước khi ta bị hất văng sang một bên, suýt nữa trúng phải [activity.Custom('GetAnimalDangerKill')] của nó..."
  hunt.4900.hunter_dead:1 "nhưng khi nhìn xuống, [activity.Custom('GetAnimalDangerKill')] của nó đã tìm thấy ta.\n\nÁnh sáng mờ dần khi ta nằm giữa mớ lông, thịt nóng và máu, với [similar_participant.GetFirstNameNoTooltip] đang gọi tên ta..."
  hunt.4900.hunter_kill:1 "[activity.Custom('GetAnimalDangerKill')] của nó suýt trượt qua ta, rồi nó đổ sập xuống đất thành một đống..."
  hunt.4900.assist:1 "\n\n[similar_participant.GetFirstName] rút con dao của [similar_participant.GetHerHis] khỏi thắt lưng, lao vào hành động giữa ta và [activity.Custom('GetAnimalTypeKill')]. Hắn hét lên \"Lùi lại, [ROOT.Char.GetTitleAsNameNoTooltip]!\" khi con vật đột ngột [activity.Custom('GetAnimalChargePresentKill')] về phía trước.\n\nThời gian dường như gần như đứng yên khi [similar_participant.GetSheHe] đánh chặn vệt mờ của [activity.Custom('GetAnimalFeatureKill')].\n\nKhi bụi lắng xuống, con [activity.Custom('GetAnimalTypeKill')] nằm chết,"
  hunt.4900.assist_wound:0 "nhưng [similar_participant.GetFirstNameNoTooltip] rõ ràng đã bị thương..."
  hunt.4900.assist_dead:0 "nhưng [similar_participant.GetFirstNameNoTooltip] cũng vậy..."
  hunt.4900.assist_kill:0 "và [similar_participant.GetFirstNameNoTooltip] đứng phía trên nó tự mãn lau lưỡi dao của [similar_participant.GetHerHis]..."
  hunt.4900.befriend:2 "\n\nTa bình tĩnh đưa tay ra. Con [activity.Custom('GetAnimalTypeKill')] thả lỏng, bối rối, rồi dè dặt dừng lại ngoài tầm với, nghi ngờ đánh hơi các ngón tay ta."
  hunt.4900.befriend_success:1 "\n\nCó vẻ hài lòng, nó ngáp rộng rồi nằm xuống dưới chân ta như thể chuẩn bị ngủ."
  hunt.4900.befriend_wound:1 "\n\nKhông báo trước, nó lại lao tới lần nữa, hất ta ngã mạnh xuống đất rồi phóng đi mất hút."
  hunt.4900.befriend_dead:1 "\n\nCon thú bỗng căng người, gần như nhăn mặt. Ta đứng chết lặng, nhắm mắt lại khi con thú lao tới, [activity.Custom('GetAnimalSoundParticipleKill')] một cách kinh hoàng."
  hunt.4900.bodyguard:1 "\n\nVệ sĩ của ta, [bodyguard.GetFirstName], lao vào hành động, kiếm tuốt trần khi [bodyguard.GetSheHe] ra hiệu cho ta đứng sau [bodyguard.GetHerHim] bằng cánh tay kia của [bodyguard.GetHerHis]. \"Lùi lại, [ROOT.Char.Custom('FormOfAddressForLiege')]!\n\nCon vật lao tới,\""
  hunt.4900.bodyguard_wound:1 "và ta gần như không dám nhìn khi [bodyguard.GetSheHe] bị con thú xé toạc, dù [bodyguard.GetFirstNameNoTooltip] cũng hạ được nó trong quá trình đó..."
  hunt.4900.bodyguard_dead:1 "và ta gần như không dám nhìn khi [bodyguard.GetSheHe] bị hất văng như một con búp bê rách, dù đã làm con thú bị thương. Con vật bị thương bỏ chạy khỏi tầm mắt khi [bodyguard.GetFirstNameNoTooltip] gục xuống [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')]!"
  hunt.4900.bodyguard_saved:0 "và ta gần như không dám nhìn khi nó bị xuyên thủng bởi lưỡi kiếm điêu luyện của [bodyguard.GetFirstNamePossessiveNoTooltip]!"
  hunt.4900.scare:1 "\n\nNó nhanh chóng đổi ý, lùi lại khi ta chậm rãi bước tới, vung tay và quát tháo. Cuối cùng nó quay đuôi bỏ chạy khỏi tầm mắt."
  hunt.4900.flee:1 "\n\nTa quay lưng và chạy hết sức, tiếng thở dốc hoảng loạn của [similar_participant.GetFirstNamePossessive] ngay phía sau.\n\nChúng ta sớm gặp lại những người khác, vừa thở dốc vừa thốt ra "#EMP [ROOT.Char.Custom('GetAnimalType')]#!" và "#EMP [ROOT.Char.Custom('GetAnimalDanger')]#!". Con thú đã biến mất."
  hunt.4900.a.hunter:1 "#EMP Đó#! là cách hạ một con [ROOT.Char.Custom('GetAnimalType')]."
  hunt.4900.a.dead:0 "#EMP [portrait.GetFirstNameNoTooltip]...#! ngươi đã chết rất dũng cảm..."
  hunt.4900.a.scare:0 "Và đừng quay lại!"
  hunt.4900.a.flee:0 "Ngươi #EMP không ở đó#!! Nó #EMP KHỔNG LỒ#!!"
  hunt.4900.b:0 "Ta sẽ giữ lại thứ gì đó để nhớ chuyện này."
  hunt.4900.c:0 "#weak Đồ khốn xảo quyệt...#!"
  hunt.4900.d:0 "Thế là đủ, chúng ta về nhà!"

  hunt.4008.t:2 "Kẻ Thừa Kế Lạc Lối"
  hunt.4008.t_2:0 "Một Sai Lầm Thành Thật"
  hunt.4008.desc:2 "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, [hunt_participant.GetTitledFirstName] đã đi trước nhóm, truy đuổi con [activity.Custom('GetAnimalType')] một mình. Khi ta đuổi kịp, ta thấy [hunt_participant.GetHerHim] đứng trên một [peasant.GetWomanMan], đang kéo một mũi tên từ ngực của người dân thường tội nghiệp.\n\n[hunt_participant.GetSheHe|U] giấu mũi tên sau lưng của [hunt_participant.GetHerHis] khi [hunt_participant.GetSheHe] phát hiện ra ta. \"[ROOT.Char.GetTitleAsNameNoTooltip]! Ta... nó...\""
  hunt.4008.animal:1 "c-con [activity.Custom('GetAnimalMale')] đã làm! Ta thề!"\n\n"
  hunt.4008.fallback:0 "k-không phải lỗi của ta! Ta thề!"\n\n"
  hunt.4008.closing:0 "Chẳng bao lâu nữa những người còn lại sẽ tới và đòi lời giải thích."
  hunt.4008.a:1 "[hunt_participant.GetSheHe|U] đã chiến đấu dũng cảm để cứu [peasant.GetHerHim], ta đã thấy!"
  hunt.4008.a.success:0 "Mọi người tin ta"
  hunt.4008.a.failure:0 "Không ai tin lời nói dối"
  hunt.4008.b:2 "Nhanh lên, giúp ta giấu xác!"
  hunt.4008.b.failure_tt:1 "[hunt_participant.GetTitledFirstNamePossessive] [secret.GetName] [secret|E] bị lộ"
  hunt.4008.b.success:0 "Chúng ta giấu được xác"
  hunt.4008.b.failure:0 "Xác bị phát hiện"
  hunt.4008.b.success_tt:0 "Xác vẫn được giấu kín"
  hunt.4008.c:2 "Ngươi #EMP phải#! trả lời chuyện này, [hunt_participant.GetFirstNameNoTooltip]!"
  hunt.4008.c.flavor:0 "Dù đó chỉ là một nông dân..."
  hunt.4008.d:1 "Tiếc thật khi 'con thú' cũng giết #EMP ngươi#!..."

  hunt.4009.t:2 "Bị Săn Đuổi"
  hunt.4009.desc:2 "#EMP Rắc—!#!\nKhi con [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')] mà ta đang tiến lại gần biến mất vào [host.GetCurrentLocation.Custom('GetTerrainType')], ta quay về phía nguồn âm thanh.\n\n[schemer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', schemer)] của ta, đang đứng sau ta với con dao được rút ra và quyết tâm giết người trong mắt của [schemer.GetHerHis]."
  hunt.4009.a:0 "Ngươi không có cơ hội chống lại ta!"
  hunt.4009.a.success:0 "Ta thoát khỏi [schemer.GetTitledFirstNameNoTooltip]"
  hunt.4009.a.failure:0 "Ta bị thương nhưng thoát khỏi [schemer.GetTitledFirstNameNoTooltip]"
  hunt.4009.a.critical_failure:0 "[schemer.GetTitledFirstNameNoTooltip] đánh bại ta"
  hunt.4009.b:0 "Cứu với! Cứu với! [saving_participant.GetFirstNameNoTooltip]!"
  hunt.4009.b.critical_success:0 "[saving_participant.GetTitledFirstNameNoTooltip] làm bị thương [schemer.GetTitledFirstNameNoTooltip] và chúng ta thoát"
  hunt.4009.b.failure:1 "[saving_participant.GetTitledFirstNameNoTooltip] bị thương nhưng chúng ta thoát khỏi [schemer.GetTitledFirstNameNoTooltip]"
  hunt.4009.b.critial_failure:0 "[saving_participant.GetTitledFirstNameNoTooltip] không bảo vệ được ta"
  hunt.4009.c:0 "Chỉ cần ta kịp về trại!"
  hunt.4009.c.failure:0 "[schemer.GetTitledFirstNameNoTooltip] bắt được ta"

  hunt.4010.desc:2 "#EMP Rắc—!#!\nKhi con [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')] mà [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)] của ta và ta đang tiếp cận biến mất vào [host.GetCurrentLocation.Custom('GetTerrainType')], chúng ta quay về phía nguồn âm thanh.\n\n[schemer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', schemer)] của ta, đang đứng sau chúng ta với con dao của [schemer.GetHerHis] được rút ra, chỉ về phía [targeted_participant.GetFirstName]."
  hunt.4010.a:1 "Đừng sợ, [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)] của ta!"
  hunt.4010.a.critical_success:1 "Ta làm bị thương [schemer.GetFirstNameNoTooltip] và đẩy lùi [schemer.GetHerHim]"
  hunt.4010.a.failure:1 "[schemer.GetFirstNameNoTooltip] làm ta bị thương nhưng cả hai chúng ta đều thoát"
  hunt.4010.a.critical_failure:0 "Ta không bảo vệ được [targeted_participant.GetFirstNameNoTooltip]"
  hunt.4010.b:0 "Chúc may mắn, [targeted_participant.GetFirstNameNoTooltip]."
  hunt.4010.b.critical_success:1 "[targeted_participant.GetFirstNameNoTooltip] làm bị thương [schemer.GetFirstNameNoTooltip] và đẩy lùi [schemer.GetHerHim]"
  hunt.4010.b.failure:1 "[targeted_participant.GetFirstNameNoTooltip] bị thương nhưng thoát được"
  hunt.4010.b.critical_failure:1 "[schemer.GetFirstNameNoTooltip] đánh bại [targeted_participant.GetFirstNameNoTooltip] và loại bỏ mọi nhân chứng"
  hunt.4010.failure.murder_secret_tooltip:0 "Ta biết được Bí Mật Giết Người"
  hunt.4010.c:1 "Cứu với! [schemer.GetFirstNameNoTooltip] đang tấn công [ROOT.Char.Custom2('RelationToMeShort', targeted_participant)] của ta!"
  hunt.4010.d:0 "#EMP Khôngoo—!#!"
  hunt.4010.d.tt:1 "Lựa chọn này khả dụng vì bạn là Người Danh Dự"
  hunt.4010.d.flavor:0 "#EMP Hãy lấy ta thay thế!#!"

  hunt.4011.t:2 "Khoảnh Khắc Riêng Tư"
  hunt.4011.desc:3 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], kia là con [activity.Custom('GetAnimalType')]!" [ROOT.Char.Custom2('RelationToMe', lover_participant)] của ta, [lover_participant.GetTitledFirstName], ra hiệu cho ta theo [lover_participant.GetHerHim] vào [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]. Khi chúng ta đã ẩn trong [host.GetCurrentLocation.Custom('GetTerrainType')], [lover_participant.GetSheHe] quay lại và kéo [ROOT.Char.Custom('GetUpperClothingArticle')] của ta qua đầu.\n\n"Cuối cùng cũng có chút thời gian riêng, [ROOT.Char.Custom('LoverPetName')] của ta!""
  hunt.4011.a:0 "Ôi [lover_participant.GetFirstNameNoTooltip]!"
  hunt.4011.a.tt:0 "Hãy làm như trong Bestiarum Vocabulum!"
  hunt.4011.b:2 "Nhưng còn con [activity.Custom('GetAnimalType')] thì sao...?"

  hunt.4012.t:3 "[host.Custom('GetLegendaryColor')|U] [host.Custom('GetAnimalType')|U]"
  hunt.4012.desc:4 "Ta đang cưỡi ngựa đi trước đoàn thì [host.GetCurrentLocation.Custom('GetTerrainType')] bỗng trở nên tĩnh lặng.\n\nSự im lặng gần như có thể chạm vào được, ngay cả tiếng vó ngựa của ta cũng dường như tan biến.\n\nNgay khi ta chuẩn bị quay lại tìm những người khác, ta thoáng thấy nó phía trước, mờ ảo như trong mơ — một con [host.Custom('GetAnimalType')|l]"
  hunt.4012.black:1 "đen như than."
  hunt.4012.white:1 "trắng như tuyết."
  hunt.4012.a:1 "Như thứ bước ra từ truyền thuyết..."
  hunt.4012.a.tt:3 "#EMP Ta phải có con [host.Custom('GetAnimalType')] đó!#!"
  hunt.4012.a.sighting:0 "Tin đồn #EMP là thật#!...!"
  hunt.4012.b:2 "Chỉ là một con [host.Custom('GetAnimalType')] thôi."

  hunt.4013.desc:1 "Ta lần theo dấu vết con thú vào [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] như trong cơn mê, một sự im lặng kỳ lạ đè nặng lên thế giới.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! Ngài ở đây rồi!" Tiếng hét bất ngờ khiến ta giật mình.\n\n"
  hunt.4013.guest:0 "[host.GetTitledFirstName] lần theo dấu vết con thú vào [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] như trong cơn mê, một sự im lặng kỳ lạ đè nặng lên thế giới.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]! Ngài ở đây rồi!" Tiếng hét bất ngờ khiến [host.GetHerHim] giật mình.\n\n"
  hunt.4013.participant:0 "[hunt_participant.GetFirstName] và những người còn lại đã bắt kịp ta. "
  hunt.4013.closing:1 "Khi ta nhìn lại, con [activity.Custom('GetAnimalType')|l] đã biến mất."
  hunt.4013.a:1 "Nó đã thoát, #EMP lần này#!."
  hunt.4013.a.tt:1 "Bạn sẽ nhận [stress|E] mỗi năm khi con thú tiếp tục trốn thoát"
  hunt.4013.a_modifier:0 "Người dân ở [activity_place.GetNameNoTier] cảm thấy bất an"
  hunt.4013.b:2 "Ta chỉ... đi trinh sát trước."
  hunt.4013.c:0 "Lũ ngốc! Ta suýt bắt được nó!"
  hunt.4013.d:0 "Ta sẽ không phí thời gian cho chuyện ngu ngốc này."

  hunt.4014.t:3 "Địa Hình Nguy Hiểm"
  hunt.4014.desc:2 "Phóng qua [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceFoliageDesc')], chúng ta gần như đã bắt kịp con mồi kiệt sức; chúng ta đã truy đuổi con [activity.Custom('GetAnimalType')] này suốt nhiều giờ!\n\n"
  hunt.4014.fall:0 "Bên cạnh ta, con ngựa của [hunt_participant.GetTitledFirstNamePossessive] đột nhiên trượt chân, khiến [hunt_participant.GetHerHim] rơi mạnh xuống đất cùng một tiếng kêu.\n\n"
  hunt.4014.branch:0 "[hunt_participant.GetTitledFirstName] quay sang hét gì đó với ta, không nhận ra một cành [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] thấp ngay phía trước!\n\n"
  hunt.4014.cry:0 "Ta không kìm được mà bật kêu lên, "[hunt_participant.GetFirstNameNoTooltip]!"\n\n"
  hunt.4014.dead_care:0 "Ta xuống ngựa, chạy tới chỗ [hunt_participant.GetWomanMan] đang nằm gục, nhưng nỗi sợ tồi tệ nhất của ta nhanh chóng được xác nhận..."
  hunt.4014.dead:0 "[ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta nằm bất động, cơ thể vặn vẹo trong tư thế không tự nhiên nhưng kỳ lạ thay lại rất thanh thản."
  hunt.4014.wounded:0 "Không phải vết thương chí mạng, nhưng [hunt_participant.GetWomanMan] đang quằn quại vì đau."
  hunt.4014.fall_host:1 "Một sự căng nhẹ của con ngựa là cảnh báo duy nhất trước khi ta bị hất tung lên không trung, mặt đất lao tới đón ta."
  hunt.4014.branch_host:0 "Ta quay sang hét gì đó với [hunt_participant.GetFirstName], người đang nhìn phía trước với gương mặt méo mó vì hoảng hốt. Quá muộn ta mới thấy nó: ngay trước mắt ta, một cành [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] khổng lồ."
  hunt.4014.dead_host:1 "Ta không cảm thấy mặt đất chạm vào mình. Thời gian dường như chậm lại. Bầu trời phía trên tối sầm, nơi những bóng người di chuyển hỗn loạn, tiếng hét nghẹt lại trôi qua lớp sương mù hỗn độn."
  hunt.4014.wounded_host:0 "\n\nTa tỉnh lại trên [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceGroundDesc')], nằm sõng soài thành một đống, cơn đau chạy dọc khắp cơ thể."
  hunt.4014.dead_host_courtier:1 "Ta thấy gương mặt của [hunt_participant.GetTitledFirstNamePossessive] đang nói gì đó với ta, trắng bệch như ma, và ta nhớ lại những con ngựa..."
  hunt.4014.wounded_host_courtier:1 ""[host.GetTitleAsNameNoTooltip]! Ngài có bị thương không?!" [hunt_participant.GetTitledFirstName] kêu lên, xuống ngựa từ [hunt_participant.GetHerHis] con ngựa."
  hunt.4014.a:0 "Ta sẽ chăm sóc cho [hunt_participant.GetHerHim]."
  hunt.4014.a.physician:0 "Nằm yên, ta được đào tạo y thuật!"
  hunt.4014.a.learning:0 "Chờ đã, ta biết phải làm gì!"
  hunt.4014.a.success:0 "Bạn băng bó vết thương của [hunt_participant.GetFirstNamePossessiveNoTooltip]"
  hunt.4014.a.failure:0 "Bạn băng bó hỏng"
  hunt.4014.b:1 "Hãy cho [hunt_participant.GetFirstNameNoTooltip] chút thời gian..."
  hunt.4014.b.physician:0 "Hãy nói ta cách chữa cho ngươi, thầy thuốc."
  hunt.4014.c:2 "[physician.GetFirstNameNoTooltip]! #EMP [physician.GetFirstNameNoTooltip] đâu rồi?!#!"
  hunt.4014.c.host:0 "Sao? Đừng chỉ đứng nhìn nữa [physician.GetFirstNameNoTooltip]!"
  hunt.4014.c.success:0 "[physician.GetFirstNameNoTooltip] băng bó vết thương"
  hunt.4014.c.failure:0 "[physician.GetFirstNameNoTooltip] băng bó hỏng"
  hunt.4014.d:1 "Ta phải tiếp tục! Con [activity.Custom('GetAnimalType')] đang chạy thoát!"
  hunt.4014.e:0 "Đã đến lúc kết thúc ngày hôm nay..."
  hunt.4014.f:0 "Ta k-không— *a!* #EMP Ta ổn!#! Nó đang chạy thoát!"
  hunt.4014.f.flavor:0 "#EMP Mau lên! Ngựa của ta!#!"
  hunt.4014.g:0 "Đ-đưa ta về trại..."
  hunt.4014.g.flavor:0 "#EMP Ta cần nằm xuống...#!"
  hunt.4014.h.physician:0 "#weak [physician.GetFirstNameNoTooltip]... M-mau...!#!"
  hunt.4014.h:1 "#weak Con... [activity.Custom('GetAnimalType')]...!#!"

  hunt.4015.t:2 "Những Người Tình"
  hunt.4015.desc:2 "Chúng ta lần theo con mồi vào [host.GetCurrentLocation.Custom('GetTerrainType')], chậm nhưng chắc chắn áp sát con [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')].\n\nNó đột nhiên hoảng sợ, [activity.Custom('GetAnimalChargeParticiple')] chạy theo hướng khác, và khi ta tiến tới xem điều gì đã làm nó hoảng sợ, ta gần như không tin vào mắt mình — [lover_participant.GetTitledFirstName] và [second_lover_participant.GetTitledFirstName] đang quấn lấy nhau trên mặt đất trong một cái ôm cuồng nhiệt!"
  hunt.4015.a:0 "Lùi lại từ từ... Ta không thấy gì cả."
  hunt.4015.b:0 ""Thật ô nhục! Dừng ngay việc này lại!""
  hunt.4015.c_4:0 ""[lover_participant.GetFirstNameNoTooltip]! [second_lover_participant.GetFirstNameNoTooltip]! Thế còn #EMP ta#! thì sao?""
  hunt.4015.c_1:1 ""[lover_participant.GetFirstNameNoTooltip], hóa ra ngươi còn giấu ta!""
  hunt.4015.c_2:1 ""[second_lover_participant.GetFirstNameNoTooltip], hóa ra ngươi còn giấu ta!""
  hunt.4015.c_3:0 ""Ồ hoho, bữa tiệc này ta cũng muốn tham gia!""
  hunt.4015.d:0 ""[second_lover_participant.GetTitledFirstNameNoTooltip], sao ngươi dám làm vậy?!""
  hunt.4015.d_2:0 ""[lover_participant.GetTitledFirstNameNoTooltip], sao ngươi dám làm vậy?!""
  hunt.4015.e:0 ""Đứng dậy, ta cảm thấy con thú ở gần đây!""

  hunt.4016.t:2 "Chiến Lợi Phẩm"
  hunt.4016.desc:2 "Chúng ta hẳn đã đuổi theo nó khắp [ROOT.Char.Custom('TerrainType')] này đến hai vòng rồi, vậy mà vẫn chưa tiến gần hơn chút nào tới việc dồn con [activity.Custom('GetAnimalType')] vào đường cùng...\n\nMọi người đều mong ta trở về trong vinh quang, mang theo chiến lợi phẩm, nhưng với tình hình này ta chỉ có thể trở về nhà cùng nỗi nhục."
  hunt.4016.a:2 "Chợ gần nhất hẳn sẽ có một con [activity.Custom('GetAnimalType')]..."
  hunt.4016.b.success:0 "Mọi người tin vào kế của ta"
  hunt.4016.b.failure:0 "Sự lừa dối của ta bị vạch trần"
  hunt.4016.b.tt:0 "[activity.GetShortName] sẽ thành công — theo một nghĩa nào đó"
  hunt.4016.c:0 "Ta sẽ không hạ mình đến mức đó, thà trở về tay trắng!"

  hunt.4017.desc:2 "Ta bỏ lại đoàn tùy tùng phía sau, lùng sục khắp [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] để tìm con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] đã ám ảnh ta.\n\nĐột nhiên mọi thứ như thể chìm dưới nước — âm thanh bị bóp nghẹt, ánh sáng trở nên hư ảo. Kia rồi!\n\nTrước mặt ta nó đứng đó, [host.GetCurrentLocation.Custom('GetTerrainType')] quanh nó dường như đông cứng — như thể nó đang nhìn thẳng vào #EMP linh hồn#! của ta."
  hunt.4017.a:1 "Đây chính là khoảnh khắc của ta!"
  hunt.4017.a.tt:1 "#EMP Nó thậm chí còn không định bỏ chạy...#!"

  hunt.4018.desc:2 "Một sự tĩnh lặng đột ngột bao trùm [host.GetCurrentLocation.Custom('GetTerrainType')]. Quay người trên yên ngựa, ta thấy rõ ràng — con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')].\n\nTrước khi ta kịp gọi những người khác, nó đã biến mất vào [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] như một ảo ảnh..."
  hunt.4018.a:1 "Lục soát khu vực! #EMP Tìm cho ra con [activity.Custom('GetAnimalType')] đó!#!"
  hunt.4018.a.tt:1 "#EMP Nó phải ở đâu đó quanh đây! Ở đâu đó...#!"
  hunt.4018.b:1 "Quên đi. Nó đi mất rồi..."
  hunt.4018.a.success:0 "Bạn tìm thấy con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')]"
  hunt.4018.a.animal:0 "Bạn tìm thấy một con thú khác"
  hunt.4018.a.failure:0 "Con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] trốn thoát"

  hunt.4019.courtier:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta, [hunt_participant.GetFirstName], thì thầm, ra hiệu gọi ta lại, chỉ tay qua [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
  hunt.4019.fallback:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" Người quản săn thì thầm, ra hiệu gọi ta lại, chỉ tay qua [host.GetCurrentLocation.Custom('GetTerrainType')]."
  hunt.4019.desc:2 "\n\n"Kìa! Thấy con [activity.Custom('GetAnimalType')] không? Có phải con ngài đang tìm không?"\n\nTrước mặt chúng ta là một con [activity.Custom('GetAnimalType')] hoàn toàn bình thường, thậm chí không có lấy một túm lông [activity.Custom('GetLegendaryColor')] nào."
  hunt.4019.a:1 "...phải, nhìn tốt đấy."
  hunt.4019.a.tt:1 "Đành phải thế thôi... #EMP tạm thời#!."
  hunt.4019.b:0 "Thứ đó mà #EMP giống#! [activity.Custom('GetLegendaryColor')] sao?!"

  hunt.5001.t:1 "Hoa Dại"
  hunt.5001.desc:0 "Đây là một ngày tuyệt vời để đi săn, cũng có nghĩa là một ngày tuyệt vời để ở ngoài trời. Khi ta hít đầy lồng ngực bầu không khí trong lành của vùng hoang dã, "
  hunt.5001.desc.witch:0 "ta nhìn thấy cả một kho tàng quà tặng từ mẹ thiên nhiên."
  hunt.5001.desc.religious:0 "ta nhìn thấy từ xa thứ chỉ có thể là món quà từ, hoặc sự dâng hiến của thiên nhiên dành cho [ROOT.Char.GetFaith.HealthGodName]."
  hunt.5001.desc.ending:1 "\n\nBiết bao thảo dược hữu ích và những bông hoa xinh đẹp! Cả để chữa bệnh lẫn những mục đích hiểm độc — nhưng ta đến đây để săn! Hái [host.GetCurrentLocation.Custom('get_region_flower_type_plural')] có thể khiến người khác dòm ngó..."
  hunt.5001.a:0 "Ta phải giữ thể diện."
  hunt.5001.b:0 "Sao ta phải quan tâm người khác nghĩ gì?"
  hunt.5001.c:0 ""Này, kia là cái gì vậy?!""
  hunt.5001.c.success:1 "[hunt_participant.GetTitledFirstNameNoTooltip] mắc lừa trò cũ rích"
  hunt.5001.d:0 "Quên hoa đi: nhìn mấy loại thảo dược này!"
  hunt.5001.d.poisonous:0 "#EMP Món quà từ [ROOT.Char.GetFaith.DeathDeityName]...#!"
  hunt.5001.d.medicinal:0 "#EMP Món quà từ [ROOT.Char.GetFaith.HealthGodName]...#!"

  hunt.5002.opening_position:1 "[hunt_participant.GetHeldCourtPositionsString] của ta, [hunt_participant.GetFirstName], đã xuống ngựa và ngồi xổm trên [hunt_participant.GetCurrentLocation.Custom('GetProvinceGroundDesc')], cẩn thận quan sát một bông [host.GetCurrentLocation.Custom('get_region_flower_type')]."
  hunt.5002.opening:0 "[ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta, [hunt_participant.GetFirstName], đang ngồi xổm dưới đất, vui vẻ ngân nga, hái [host.GetCurrentLocation.Custom('get_region_flower_type_plural')]."
  hunt.5002.second_position:0 "Bên cạnh [hunt_participant.GetHerHim], [hunt_participant_2.GetHeldCourtPositionsString] của ta, [hunt_participant_2.GetFirstName], nói chuyện đầy phấn khích, chỉ vào những cánh hoa."
  hunt.5002.second:1 "[hunt_participant_2.GetFirstName], [ROOT.Char.Custom2('RelationToMe', hunt_participant_2)] của ta, ghé nhìn qua vai [hunt_participant.GetHerHis], lắng nghe chăm chú.\n\n"
  hunt.5002.alone:0 "[hunt_participant.GetSheHe|U] dường như đã mất hết hứng thú với cuộc săn.\n\n"
  hunt.5002.gardener:0 ""À, [ROOT.Char.GetTitleAsNameNoTooltip], những bông hoa tuyệt mỹ này khiến ta nảy ra ý tưởng cho vài cách sắp xếp mới — #EMP chúng#! sẽ hoàn hảo để viền lối đi trong cung điện...""
  hunt.5002.physician:0 ""[ROOT.Char.GetTitleAsNameNoTooltip], nhìn tất cả các loại thảo dược và hoa hữu ích ở đây kìa! Loại này có thể xoa dịu cơn đau! Loại này giúp chữa xương [hunt_participant.Custom('RandomSaintBone')|l] gãy! Loại này xua đuổi [hunt_participant.Custom('RandomDisease')|l]..""
  hunt.5002.desc:2 ""[ROOT.Char.GetTitleAsNameNoTooltip], thật là ân huệ của thiên nhiên! Hãy nhìn những loài cây này! Thật vậy, sự giàu có của đất trời là vô hạn — chúng ta không trân trọng đủ những kho báu giản dị này.""
  hunt.5002.a:1 "Lên #EMP lại#! ngựa ngay!"
  hunt.5002.a.second:0 "Lên #EMP lại#! ngựa ngay!"
  hunt.5002.a.flavor:1 "#EMP Chúng ta ở đây vì con [activity.Custom('GetAnimalType')]!#!"
  hunt.5002.b:1 "Thật thú vị! Hoa #EMP kia#! là hoa gì?"
  hunt.5002.c:1 "N-ngươi đang luyện #EMP phù thủy thuật#! sao...?"
  hunt.5002.c.known:0 "Dừng ngay thứ tà thuật này lại, pháp sư bẩn thỉu!"
  hunt.5002.c.flavor:0 "#EMP Ma thuật đen! Chất độc!#!"
  hunt.5002.d:0 "...ngươi đang gây chú ý đấy, [hunt_participant.Custom('SisterBrother')]."
  hunt.5002.d.flavor:0 "#EMP Chúng ta phải bảo vệ con đường của [ROOT.Char.GetFaith.WitchGodName]...#!"
  hunt.5002.e:0 "Quả thật ngươi có con mắt tinh tường!"
  hunt.5002.e.flavor:0 "#EMP Để ta kể cho ngươi nghe về chúng...#!"
  hunt.5002.e.gardener:0 "Ta đang #EMP tìm#! thêm những bông như thế này!"
  hunt.5002.e.herbalist:0 "Đúng vậy, và #EMP đây#! có lẽ là loại thảo dược hữu ích nhất!"
  hunt.5002.g:0 "Ta nghĩ hoa mới #EMP cũng#! không tệ..."
  hunt.5002.g.present:0 "[gardener.GetFirstNameNoTooltip], lại đây!"
  hunt.5002.g.elsewhere:0 "[gardener.GetFirstNameNoTooltip] #EMP sẽ#! thích những bông hoa này..."
  hunt.5002.h:0 "Thầy thuốc của ta sẽ có thứ [physician.GetSheHe] cần."
  hunt.5002.h.present:0 "[physician.GetFirstNameNoTooltip], lại đây!"
  hunt.5002.h.elsewhere:0 "[physician.GetFirstNameNoTooltip] có thể dùng những thảo dược này..."
  hunt.5002.cp_flavor:0 "#EMP ...nhưng chúng ta vẫn tiếp tục!#!"
  hunt.5002.cp_present_flavor:1 "#EMP [hunt_participant.GetFirstNameNoTooltip] có việc cho ngươi, thầy thuốc!#!"
  hunt.5002.cp_elsewhere_flavor:0 "#EMP Ngươi không phiền ở lại thu thập chứ?#!"
  hunt.5003.opening:0 "Trong một khoảnh khắc hiếm hoi được nghỉ ngơi, ta dành chút thời gian trong im lặng, tận hưởng vẻ đẹp của thiên nhiên."
  hunt.5003.desc_woo:0 "Ta đột nhiên giật mình khi [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, [hunt_participant.GetFirstName], cười và nói: "Một món quà cho [ROOT.Char.GetTitleAsNameNoTooltip] của ta."\n\n"
  hunt.5003.desc:1 "Khi căng thẳng tan biến, ta nghe [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)] của ta, [hunt_participant.GetFirstName], khẽ cười: "#EMP Tình yêu của ta.#!"\n\n"
  hunt.5003.desc.flower:1 "[hunt_participant.GetSheHe|U] đặt thứ gì đó sau tai ta. "Dù chẳng thể sánh với vẻ đẹp của ngài, nhưng bông [newly_created_artifact.Custom('ArtifactVariableFlowerSpecies')] này khiến ta nhớ đến ngài.""
  hunt.5003.desc.animal:1 "[hunt_participant.GetSheHe|U] giơ lên xác đầy máu của một con thỏ rừng. "Ta giết con vật nhỏ này để tôn vinh ngài, như một minh chứng rằng ta sẽ mãi chiến đấu bên cạnh ngài.""
  hunt.5003.ending:0 "\n\n[hunt_participant.GetFirstNameNoTooltip] mỉm cười, chiêm ngưỡng tác phẩm của [hunt_participant.GetHerHis]."
  hunt.5003.ending_lover:0 ""Ngài trông thật bình yên. Ta rất vui." [hunt_participant.GetSheHe|U] vội đặt một nụ hôn nhẹ lên má ta, như thể chỉ còn hai chúng ta trên thế giới."
  hunt.5003.ending_woo:0 ""Ta rất vui khi bắt gặp ngài ở một mình." [hunt_participant.GetSheHe|U] hơi đỏ mặt, ánh mắt [hunt_participant.GetHerHis] truyền đạt điều gì đó... chưa nói thành lời."
  hunt.5003.a:1 "Ngươi #EMP muốn#! bị bắt gặp sao?!"
  hunt.5003.b:1 "Ta sẽ #EMP trân trọng#! nó, người thân yêu."
  hunt.5003.b.woo:0 "Cảm ơn, nó rất đẹp."
  hunt.5003.b.tt:0 "Ai đó có thể biết về mối quan hệ [secret|E] của bạn"
  hunt.5003.c:0 "Ta không cần thứ này."
  hunt.5003.d:0 "Lại đây, tình yêu của ta."
  hunt.5003.d.woo:0 "Lại đây, chúng ta đang ở một mình..."

  hunt.5010.t:0 "Một Con [activity.Custom('GetAnimalFemale')|U] Và Con Non"
  hunt.5010.desc:0 "Khi chúng ta lướt qua [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], bám sát dấu vết con [activity.Custom('GetAnimalType')], chúng ta bước vào một khoảng trống cụt dưới vách đá nhỏ.\n\nMột tiếng rên thất vọng vang lên từ đoàn: một con cái hoảng sợ và con non của nó đang co rúm trên [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] — có lẽ chúng ta đã vô tình lần theo dấu của chúng trong lúc vội vã...\n\nKhông có lý do gì để săn chúng: chúng ta sẽ phải quay lại và lần theo con [activity.Custom('GetAnimalMale')] trước khi quá muộn."
  hunt.5010.a:0 "Con mồi vẫn là con mồi, kết thúc nó đi."
  hunt.5010.b:0 "Bắt con [activity.Custom('GetAnimalChild')] để thuần hóa!"
  hunt.5010.c:0 "Tìm cho ra con [activity.Custom('GetAnimalMale')]!"

  hunt.5050.t:0 "Bị Cướp Khỏi Bầu Trời"
  hunt.5050.desc:0 "[activity.Custom('GetRaptorType')] của ta cất cánh khỏi điểm đậu một cách uy nghi, lao thẳng về phía một con [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalType')] đang ẩn trong [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\nKhi nó đạt đến đỉnh cao, một tiếng kêu chói tai vang lên trên đầu chúng ta, quá lớn và the thé để có thể thuộc về bất kỳ con chim nào của #EMP chúng ta#!.\n\nNgay khi [activity.Custom('GetRaptorType')] của ta bắt đầu lao xuống, chính nó lại bị một con [host.Custom('GetRegionalEagleType')] khổng lồ lao tới — bị chộp lấy khỏi không trung trong một cơn mưa lông vũ dữ dội!"
  hunt.5050.a:0 "Tên khốn chết tiệt! Đuổi theo nó!"
  hunt.5050.a.success:0 "Bạn báo thù cho [activity.Custom('GetRaptorType')] của mình"
  hunt.5050.a.failure:0 "Con chim trốn thoát"
  hunt.5050.b:0 "Có vẻ ta sẽ cần #EMP con#! [activity.Custom('GetRaptorType')] của ngươi rồi, [hunt_participant.GetFirstNameNoTooltip]."
  hunt.5050.c:0 "À, một chiếc lông của nó."
  hunt.5050.c.tt:0 "Bạn sẽ nhận được một món trang sức lông vũ [artifact|E]"
  hunt.5050.d:0 "Thiên nhiên thật tàn nhẫn..."

  hunt.5060.t:0 "Dưới Đôi Cánh Ta"
  hunt.5060.desc:1 "Ta và đoàn săn lặng lẽ tiến qua một lùm cây, mắt dò tìm bất kỳ dấu hiệu nào của một con [activity.Custom('GetAnimalType')]. Từ tán cây phía trên, tiếng chim ríu rít nhẹ nhàng vang xuống, ngày càng lớn khi chúng ta tiến lên.\n\nĐó là một con chim non đang kêu ré lên gọi mẹ!\n\nMột thợ săn nhanh nhẹn kéo xuống một con chim ưng con lông tơ, chưa mọc đủ lông bay, từ [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]! Thật may mắn! Chỉ những con chim non bắt trong tự nhiên mới có thể được huấn luyện đúng cách để săn mồi."
  hunt.5060.a:0 "Mang nó về chuồng chim săn của ta."
  hunt.5060.b:0 "Đây, [hunt_participant.GetFirstNameNoTooltip], một món quà!"
  hunt.5060.c:0 "Đặt nó trở lại."

  hunt.7001.t:3 "Cuộc Chạm Trán Ở Đầm Lầy"
  hunt.7001.desc:1 "Mặt đất trở nên ướt hơn, và không khí nặng nề hơn, khi chúng ta cưỡi ngựa tiến sâu vào vùng hoang dã của [host.GetCurrentLocation.GetNameNoTooltip].\n\nĐột nhiên, từ đám cây cối xung quanh, một gã đàn ông khổng lồ xuất hiện — thân hình đồ sộ trong nhiều lớp quần áo bẩn thỉu.\n\nHắn hét lên, "Giải thích đi! Các ngươi đang làm gì trong đầm lầy #EMP của ta#!?""
  hunt.7001.adventurer: "Chẳng phải ngươi muốn cùng chúng ta đi xem thế giới sao?"
  hunt.7001.a:0 "Đầm lầy #EMP của ngươi#! sao? Vậy thì dẫn chúng ta đi quanh đây."
  hunt.7001.b:0 "Hãy nói chuyện cho ra lẽ."
  hunt.7001.b_success:0 "Người đàn ông hiểu lập luận của ta... có lẽ vậy"
  hunt.7001.b_failure:0 "Tên điên này không thể dùng lý lẽ"
  hunt.7001.c:1 "Cuối cùng! Thứ để săn!"
  hunt.7001.d:0 "Tránh đường ra, đồ nhà quê hôi hám!"

  hunt.7011.t:1 "Mắc Bẫy"
  hunt.7011.desc:0 "Khi [hunt_participant.GetTitledFirstName] và ta đi bộ qua vùng đất khó khăn, ta gần như nhảy dựng lên vì tiếng kêu thảm thiết vang lên.\n\n"
  hunt.7011.snare:1 "Ta quay lại thấy [ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta nằm sõng soài trên mặt đất, một chiếc bẫy thòng lọng siết chặt bắp chân [hunt_participant.GetHerHis]."
  hunt.7011.bear:0 "Ta quay lại thấy bàn chân của [ROOT.Char.Custom2('RelationToMePossessive', hunt_participant)] bị kẹp trong chiếc bẫy gấu thò ra đầy đe dọa từ bụi gai."
  hunt.7011.pit:0 "Ta quay lại thấy [ROOT.Char.Custom2('RelationToMe', hunt_participant)] của ta đã rơi vào một hố bẫy được ngụy trang, giờ đang giữ chặt chân [hunt_participant.GetHerHis]."
  hunt.7011.alive:1 "\n\n[hunt_participant.GetSheHe|U] tru lên đau đớn,"
  hunt.7011.noble:0 ""Argh! Lũ dân đen chết tiệt! Sao chúng không săn bắn như những [hunt_participant.GetWomenMen] thực thụ chứ?!""
  hunt.7011.lowborn:0 ""Chân tôi! Argh! Tôi không thấy cái thứ chết tiệt đó! #EMP Argh!#!"" 
  hunt.7011.dead:1 "\n\nChúng ta phải tiếp tục, nếu không sẽ mất dấu con [activity.Custom('GetAnimalType')]!"
  hunt.7011.a:1 "Ta phải tiếp tục, nếu không sẽ mất dấu con [activity.Custom('GetAnimalType')]!"
  hunt.7011.b:0 "[physician.GetFirstNameNoTooltip]! [physician.GetFirstNameNoTooltip] đâu rồi?"
  hunt.7011.c:0 "Người của ta sẽ đưa ngươi trở về."
  hunt.7011.d:0 "Thật đáng tiếc ngươi đã ngã rất mạnh..."
  hunt.7011.d.success:0 "Không ai nhận ra"
  hunt.7011.d.failure:0 "Có người nghi ngờ"
  hunt.7011.d.flavor:0 "#EMP ...và đập đầu vào tảng đá này...#!"
  hunt.7011.e:0 "Tìm những kẻ đặt bẫy, và chặt tay chúng."
  hunt.7011.e.flavor:0 "#EMP Không ai được phép trộm từ [ROOT.Char.GetTitleAsNameNoTooltip]!#!"
  hunt.7011.e.hunting_grounds:0 "Tùy chọn này khả dụng nhờ $building_type_hunting_grounds_01$ [building|E] của [host.GetCurrentLocation.GetTitle.GetBaseNameNoTierPossessive]"
  hunt.7011.e.royal_forests:0 "Tùy chọn này khả dụng nhờ $building_type_royal_forest_01$ [building|E] của [host.GetCurrentLocation.GetTitle.GetBaseNameNoTierPossessive]"
  hunt.7020.t:1 "Thách Thức Trọng Lực"
  hunt.7020.desc:0 "Đoàn săn dừng lại, bị thu hút bởi một mỏm đá với những tảng đá tròn nằm trên sườn dốc. [onlooker.GetTitledFirstName] đẩy một tảng đá lỏng.\n\nMọi người chăm chú nhìn khi tảng đá lăn xuống, tăng dần tốc độ, rồi chạm đáy đồi với một tiếng "bụp" đầy thỏa mãn.\n\n"
  hunt.7020.murder:0 "Ta tự hỏi... liệu [pertinent.GetFirstNameNoTooltip] có đủ kiêu ngạo để mắc bẫy không..."
  hunt.7020.woo:0 "Còn cách nào tốt hơn để chứng minh giá trị của ta với [pertinent.GetFirstNameNoTooltip], hơn là nhảy qua tảng đá?"
  hunt.7020.befriend:0 "Đây có thể là cơ hội để kết thân với [pertinent.GetFirstNameNoTooltip] mà ta chờ đợi."
  hunt.7020.bravado:0 "Này, đây có thể là cơ hội gây ấn tượng với mọi người..."
  hunt.7020.a.intent:0 "Xem đây, [pertinent.GetFirstNameNoTooltip]!"
  hunt.7020.a:0 "Mọi người, giúp [onlooker.GetFirstNameNoTooltip] lăn tảng đá lớn kia cho ta!"
  hunt.7020.a.flavor:0 "#EMP Chỉ là viên sỏi thôi!#!"
  hunt.7020.b:0 "Đẩy thêm tảng nữa, ta sẽ nhảy qua!"
  hunt.7020.b.flavor:0 "#EMP Ta sẽ vượt qua dễ dàng!#!"
  hunt.7020.c.rival:0 "Không dám nhảy à, [pertinent.GetFirstNameNoTooltip]?"
  hunt.7020.c:0 "[pertinent.GetFirstNameNoTooltip], ngươi có nhảy qua được không?"
  hunt.7020.c.flavor:0 "#EMP Có thể xảy ra chuyện gì chứ?#!"
  hunt.7020.d:0 "Nào [pertinent.GetFirstNameNoTooltip], xem ai nhảy qua được nhiều nhất!"
  hunt.7020.d.flavor:0 "#EMP Cẩn thận đấy!#!"
  hunt_boulder_jump_success_both:0 "Cả hai bạn đều vượt qua tảng đá"
  hunt_boulder_jump_success_self:0 "Bạn vượt qua tảng đá"
  hunt_boulder_jump_success_pertinent:0 "[pertinent.GetFirstNameNoTooltip] vượt qua tảng đá"
  hunt_boulder_jump_failure_self:0 "Bạn bị #negative_value thương#!"
  hunt_boulder_jump_failure_pertinent:0 "[pertinent.GetFirstNameNoTooltip] bị #negative_value thương#!"
  hunt_boulder_jump_failure_both:0 "Cả hai bạn đều bị #negative_value thương#!"
  hunt_boulder_jump_refusal:0 "[pertinent.GetFirstNameNoTooltip] từ chối lời thách đấu"
  hunt_boulder_impressed_title:0 "Cú nhảy ấn tượng"
  hunt.7020.e:0 "Rất tốt, chúng ta tiếp tục."
  hunt.7020.e.flavor:0 "#EMP Làm khác đi thì thật ngốc...#!"

 hunt.7100.t:1 "Một Khoảnh Khắc Trò Chuyện"
 hunt.7100.opening:0 "Trong lúc chờ đàn chó tìm ra dấu mùi, đoàn săn nghỉ ngơi dưới bóng râm. [woo_target.GetFirstName] nghỉ gần đó: đây sẽ là thời điểm hoàn hảo cho một cuộc trò chuyện vô hại."
 hunt.7100.married:0 "Ta tiến lại khi [woo_target.GetHerHis] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], đang bị phân tâm."
 hunt.7100.married_absent:0 "[woo_target.GetHerHis|U] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], đang ở rất xa..."
 hunt.7100.currentspouse:0 "Có lẽ hôm nay ta sẽ chinh phục được [woo_target.GetWomanMan] của ta!"
 hunt.7100.desc:0 "\n\n"Ah [woo_target.GetTitledFirstName], hôm nay là một ngày tuyệt vời cho việc này, ta tin rằng ngài đang tận hưởng chứ?" Ta mở lời một cách thản nhiên.\n\nTa gần như chắc chắn nụ cười của [woo_target.GetHerHis] không chỉ đơn thuần là phép lịch sự."
 hunt.7100.a:0 "Không gì tuyệt hơn một cuộc săn thú ra trò!"
 hunt.7100.a.tt:0 "#F Khơi gợi khía cạnh năng động của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
 hunt.7100.b:1 "Thuần hóa và điều khiển một con [activity.Custom('GetRaptorType')] mới thật sự là sống."
 hunt.7100.b.tt:0 "#F Khơi gợi khía cạnh xã giao của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
 hunt.7100.c:0 "Đôi khi ta cũng thương hại những con vật tội nghiệp."
 hunt.7100.c.tt:0 "#F Khơi gợi khía cạnh trắc ẩn của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
 hunt.7100.d:0 "Dĩ nhiên ta thà làm điều gì đó hữu ích hơn."
 hunt.7100.d.tt:0 "#F Khơi gợi khía cạnh chăm chỉ của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
 hunt.7100.e:0 "Một khu rừng được quản lý tốt sẽ tuôn ra những món quà của [ROOT.Char.GetFaith.HighGodNamePossessive]."
 hunt.7100.e.tt:0 "#F Khơi gợi khía cạnh quản trị của [woo_target.GetFirstNamePossessiveNoTooltip].#!"
 hunt.7101.reply_hunter:0 ""$hunt.7100.a$"\n\n"
 hunt.7101.reply_falconer:0 ""$hunt.7100.b$"\n\n"
 hunt.7101.reply_pity:0 ""$hunt.7100.c$"\n\n"
 hunt.7101.reply_wastrel:0 ""$hunt.7100.d$"\n\n"
 hunt.7101.reply_steward:0 ""$hunt.7100.e$"\n\n"
 hunt.7101.opening:0 "[woo_actor.GetTitledFirstName] tiến lại gần ta khi đoàn săn nghỉ dưới bóng râm chờ đàn chó tìm được dấu mùi.\n\n[woo_actor.GetSheHe|U] suy nghĩ một lúc trước khi nói:"
 hunt.7101.hunter:0 "$hunt.7101.reply_hunter$Ta không thể phủ nhận cảm giác hồi hộp ấy, sự hành động đó thật thú vị."
 hunt.7101.falconer:0 "$hunt.7101.reply_falconer$Ta hiểu ý nghĩa biểu tượng mà [woo_actor.GetSheHe] đang ám chỉ."
 hunt.7101.pity:0 "$hunt.7101.reply_pity$Có lẽ [woo_actor.GetSheHe] khác với những người khác."
 hunt.7101.wastrel:0 "$hunt.7101.reply_wastrel$Đây là một [woo_actor.GetWomanMan] sẽ còn tiến xa."
 hunt.7101.steward:0 "$hunt.7101.reply_steward$Quả thật có vẻ đẹp trong thiên nhiên được sắp đặt."
 hunt.7101.fallback:0 "Ta thấy khó nghĩ ra câu trả lời."
 hunt.7101.a:0 "Ta không thể phủ nhận [woo_actor.GetSheHe] có một sức hút nhất định..."

 hunt.7102.hunter:0 "$hunt.7101.reply_hunter$\n\nTa không khỏi rùng mình trong lòng..."
 hunt.7102.falconer:0 "$hunt.7101.reply_falconer$\n\nThật kiêu ngạo..."
 hunt.7102.pity:0 "$hunt.7101.reply_pity$\n\nHãy học cách nhận lời khen đi!"
 hunt.7102.wastrel:0 "$hunt.7101.reply_wastrel$\n\n"
 hunt.7102.steward:0 "$hunt.7101.reply_steward$\n\n"
 hunt.7102.fallback:0 "[woo_actor.GetSheHe|U] chỉ mỉm cười đầy ẩn ý với ta, khiến ta #EMP vô cùng#! khó chịu."
 hunt.7102.a:0 "Thật là một [woo_actor.GetWomanMan] lố bịch."
 hunt.7103.reply:0 "[woo_target.GetTitledFirstName] dường như đã phản ứng khá ấm áp với lời thử của ta"
 hunt.7103.hunter:0 "$hunt.7103.reply$, đôi mắt rực sáng khi [woo_target.GetSheHe] gật đầu mạnh mẽ."
 hunt.7103.falconer:0 "$hunt.7103.reply$, gần như nhìn ta bằng một ánh mắt hoàn toàn mới."
 hunt.7103.pity:1 "$hunt.7103.reply$, than thở về những môn thể thao bạo lực của thời đại và tầng lớp chúng ta."
 hunt.7103.wastrel:1 "$hunt.7103.reply$, rõ ràng ngạc nhiên khi tìm thấy một tâm hồn đồng điệu."
 hunt.7103.steward:1 "$hunt.7103.reply$, vui mừng khi tìm thấy người cũng thấy niềm vui trong những điều như vậy."
 hunt.7103.fallback:0 "$hunt.7103.reply$, nhìn sâu vào mắt ta thật lâu."
 hunt.7103.desc:0 "\n\nKhi [woo_target.GetSheHe] rời đi, sự căng thẳng hiện rõ trong từng lời xã giao — ta biết mình đã tìm đúng lời để chinh phục [woo_target.GetHerHim]!"
 hunt.7103.a:0 "Ta nghĩ [woo_target.GetSheHe] đã mắc câu..."
 hunt.7104.reply:0 "Phản hồi của ta dường như không gây ấn tượng với [woo_target.GetTitledFirstName]"
 hunt.7104.hunter:0 "$hunt.7104.reply$, vì [woo_target.GetSheHe] tránh ánh mắt của ta khi [woo_target.GetSheHe] cảm ơn ta và nhanh chóng cáo từ [woo_target.GetHerHis]."
 hunt.7104.falconer:0 "$hunt.7104.reply$, vì [woo_target.GetSheHe] đảo mắt một cách xem thường [woo_target.GetHerHis]."
 hunt.7104.pity:0 "$hunt.7104.reply$, vì [woo_target.GetSheHe] nhanh chóng mất hứng thú, bị lời nói của ta làm hụt hẫng."
 hunt.7104.wastrel:0 "$hunt.7104.reply$, vì [woo_target.GetSheHe] nhìn lơ đãng, dường như chỉ nghe nửa vời."
 hunt.7104.steward:0 "$hunt.7104.reply$, vì [woo_target.GetSheHe] nhìn lơ đãng, dường như chỉ nghe nửa vời."
 hunt.7104.fallback:1 "$hunt.7104.reply$, vì [woo_target.GetSheHe] không thể rời khỏi sự hiện diện của ta sớm hơn."
 hunt.7104.desc:0 "\n\nĐứng một mình sau khi [woo_target.GetHerHis] đã nói lời từ biệt, ta không thể không cảm thấy mình là một kẻ ngốc vì một bước đi sai lầm hoàn toàn như vậy..."
 hunt.7104.a:0 "Ta đã nghĩ gì vậy...?"

 hunt.7200.t:1 "Con Mồi Thật Sự"
 hunt.7200.desc:1 "Khi chúng ta rời trại và tiến sâu hơn vào [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], ta để mắt đến [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [murder_target.GetTitledFirstName], đang lầm lũi bước đi mà không hề biết mình bị quan sát.\n\n"
 hunt.7200.agent:0 "[murder_schemer.GetTitledFirstName] không có ở đây, nhưng đây có thể là cơ hội chúng ta chờ đợi.\n\n"
 hunt.7200.accomplice_2:1 "[accomplice.GetTitledFirstName] và [accomplice_2.GetTitledFirstName] cũng đang theo dõi [murder_target.GetHerHim] sát sao... chúng ta có thể sẽ không bao giờ có cơ hội tốt hơn..."
 hunt.7200.accomplice:1 "Với sự giúp đỡ của [accomplice.GetTitledFirstName], cuối cùng ta có thể loại bỏ [murder_target.GetWomanMan] đáng ghét này."
 hunt.7200.alone:0 "Ta có thể không có đồng minh trong đoàn săn, nhưng nếu tìm đúng thời điểm, không có vỏ bọc nào tốt hơn một cuộc săn cho hành động này."
 hunt.7200.a:0 "Hôm nay là ngày đó."
 hunt.7200.b:0 "[accomplice.GetFirstNameNoTooltip] sẽ xử lý."
 hunt.7200.c:0 "Ta tin tưởng [accomplice_2.GetFirstNameNoTooltip] với chuyện tinh tế này."
 hunt.7200.d:0 "Ta phải kiên nhẫn."
 hunt_murder_accomplice_tt:1 "[THIS.Char.GetShortUIName|U] sẽ cố gắng ám sát [murder_target.GetShortUIName]"

 hunt.7210.opening:0 "Phi nước đại qua [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], theo tiếng tù và và tiếng sủa của đàn chó, [murder_target.GetTitledFirstName] cuối cùng tách [murder_target.GetHerselfHimself] khỏi phần còn lại của đoàn săn.\n\n"
 hunt.7210.desc:0 "[murder_target.GetSheHe|U] dừng lại một lúc, suy nghĩ nên đi hướng nào."
 hunt.7210.accomplice:0 "Ta liếc sang [accomplice.GetFirstName], người gật đầu grimly, lông mày nhíu lại đầy quyết tâm, chờ động thái của ta."
 hunt.7210.a:0 "Và đó sẽ là một tai nạn bi thảm."
 hunt.7210.a.tt:0 "#EMP Hyah!#!"
 hunt.7210.b:0 "Không, ta phải chờ thời cơ..."

 hunt.7211.desc:0 "Ta hành động nhanh nhất có thể, lao vào [murder_target.GetTitledFirstName] từ bên hông với ý định hất [murder_target.GetHerHim] khỏi yên ngựa."
 hunt.7211.agent:0 "Ta không muốn làm [abduct_schemer.GetFirstName] thất vọng..."
 hunt.7211.accomplice:0 "[accomplice_2.GetFirstName] và [accomplice.GetFirstName] nhanh chóng xông vào."
 hunt.7211.accomplice_2:0 "[accomplice.GetFirstName] lập tức nhập cuộc từ phía bên kia."
 hunt.7211.success:0 "\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]?! Argh! Cái gì đang y-\" [murder_target.GetFirstNameNoTooltip] ngã khỏi con ngựa của [murder_target.GetHerHis], xuống [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')], khi ta nhanh chóng xuống ngựa.\n\nHành động đã xong trước khi [murder_target.GetSheHe] có thể thu xếp bản thân, và bất kỳ người xem nào cũng khó có thể xác định được nguyên nhân của mớ hỗn độn."
 hunt.7211.failure:0 "\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]?! Cái quái gì vậy!\" [murder_target.GetFirstNameNoTooltip] ngã khỏi con ngựa của [murder_target.GetHerHis] một cách nặng nề, nhưng vội vã đứng dậy. [murder_target.GetSheHe|U] lao về phía phần còn lại của nhóm khi ta cố gắng kiểm soát lại con ngựa của mình, nhìn qua vai [murder_target.GetHerHis] đầy sợ hãi, hét lên hết hơi. Ta sẽ không đuổi kịp [murder_target.GetHerHim] kịp lúc..."

 hunt.7212.desc:0 "Ta dừng lại một lúc để chỉnh lại trang bị. Tiếng cành cây gãy bất ngờ phá vỡ sự yên lặng, và ta thấy [abduct_actor.GetTitledFirstName] đang nhanh chóng tiến về phía mình."
 hunt.7212.accomplice_2:0 "[accomplice_2.GetFirstName] và [accomplice.GetFirstName] ở ngay phía sau"
 hunt.7212.accomplice:0 "[accomplice.GetFirstName] bám sát gót [abduct_actor.GetHerHis]."
 hunt.7212.success:0 "\n\nTa thấy sự quyết tâm trong đôi mắt của [murder_actor.GetFirstNamePossessiveNoTooltip] quá muộn, không thể né tránh cú vật của [murder_actor.GetHerHis], và bị ném xuống [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] với một tiếng thịch.\n\nKhi ta lấy lại sự tỉnh táo và quay lại, [murder_actor.GetSheHe] đang đứng phía trên ta, cầm một tảng đá lớn trên đầu của [murder_actor.GetHerHis]! \"Tạm biệt, [ROOT.Char.GetFirstNameNoTooltip].\""
 hunt.7212.failure:0 "\n\nRõ ràng có điều gì đó không ổn ở đây. [murder_actor.GetFirstNameNoTooltip] đột nhiên lao vào ta, và ta ngã xuống đất một cách vụng về, nhưng xoay xở để đứng dậy khi [murder_actor.GetSheHe] mất thăng bằng tại [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')], nguyền rủa.\n\nTa chạy nước rút vào [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], la hét cầu cứu. Nhóm không thể ở xa được!"
 hunt.7212.a:0 ""Cái-! Khô-...""
 hunt.7212.b:0 "Cứ chạy thôi!"

 hunt.7300.t:1 "Một Khoảnh Khắc Trò Chuyện"
 hunt.7300.desc:0 "Trong lúc chờ tin từ lũ chó săn đánh hơi, đoàn săn nghỉ chân dưới một lùm cây râm mát. [befriend_target.GetFirstName] đứng cách đó không xa: đây là cơ hội của ta để gây ấn tượng với [befriend_target.GetHerHim].\n\n"[befriend_target.GetTitledFirstNameNoTooltip]! Dạo này thế nào? Không phải lúc nào chúng ta cũng có dịp trò chuyện." Ta mở lời một cách thân mật.\n\n[befriend_target.GetSheHe|U] có vẻ ngạc nhiên, nhưng không hề tỏ ra khó chịu trước cuộc trò chuyện của ta."
 hunt.7301.reply_hunter:0 ""$hunt.7100.a$"\n\n"
 hunt.7301.reply_falconer:0 ""$hunt.7100.b$"\n\n"
 hunt.7301.reply_pity:0 ""$hunt.7100.c$"\n\n"
 hunt.7301.reply_wastrel:0 ""$hunt.7100.d$"\n\n"
 hunt.7301.reply_steward:0 ""$hunt.7100.e$"\n\n"
 hunt.7301.opening:0 "[befriend_actor.GetTitledFirstName] lặng lẽ tiến lại khi đoàn săn đang chờ tin từ lũ chó săn.\n\n[befriend_actor.GetSheHe|U] mỉm cười thân thiện và mở lời:"
 hunt.7301.hunter:0 "$hunt.7301.reply_hunter$Đó là điều ta không thể phản đối."
 hunt.7301.falconer:0 "$hunt.7301.reply_falconer$Nói thẳng vào trọng tâm, ta hiểu chính xác [befriend_actor.GetSheHe] muốn nói gì."
 hunt.7301.pity:0 "$hunt.7301.reply_pity$Ta không thể phủ nhận sự thật trong lời [befriend_actor.GetHerHis]; đây là một trò tiêu khiển tàn nhẫn."
 hunt.7301.wastrel:0 "$hunt.7301.reply_wastrel$Quả thật nghe rất đúng; bao nhiêu việc hữu ích ta có thể làm thay vì thế..."
 hunt.7301.steward:0 "$hunt.7301.reply_steward$Sắp đặt trật tự cho thiên nhiên quả là điều ta cũng thấy vui thích."
 hunt.7301.fallback:0 "Ta không chắc nên nói gì."
 hunt.7301.a:0 "Có lẽ chúng ta có nhiều điểm chung hơn ta tưởng."

 hunt.7302.hunter:0 "$hunt.7301.reply_hunter$\n\nTa hoàn toàn không đồng ý..."
 hunt.7302.falconer:0 "$hunt.7301.reply_falconer$\n\nChỉ là một trò tiêu khiển tầm thường..."
 hunt.7302.pity:0 "$hunt.7301.reply_pity$\n\nYếu đuối quá, thế giới vốn tàn nhẫn."
 hunt.7302.wastrel:0 "$hunt.7301.reply_wastrel$\n\nAi cũng cần dành thời gian cho vài thú tiêu khiển."
 hunt.7302.steward:0 "$hunt.7301.reply_steward$\n\nThật nhàm chán..."
 hunt.7302.fallback:0 "[befriend_actor.GetSheHe|U] cười đầy hy vọng, rõ ràng mong chờ một sự đồng cảm đáp lại."
 hunt.7302.a:0 "Này, kia là cái gì thế?"
 hunt.7303.reply:0 "[befriend_target.GetTitledFirstName] dường như có rất nhiều điểm chung với ta"
 hunt.7303.hunter:0 "$hunt.7303.reply$, hào hứng lao vào những chi tiết vụn vặt về dây cung và bẫy."
 hunt.7303.falconer:0 "$hunt.7303.reply$, gần như không kiềm chế được niềm đam mê săn chim ưng của [befriend_target.GetHerHis]."
 hunt.7303.pity:0 "$hunt.7303.reply$, ."
 hunt.7303.wastrel:0 "$hunt.7303.reply$, than phiền về việc phải giải trí cho triều đình bằng những chuyện vặt vãnh."
 hunt.7303.steward:0 "$hunt.7303.reply$, hăng hái chia sẻ các phương pháp quản lý rừng và thú săn."
 hunt.7303.fallback:0 "$hunt.7303.reply$, thái độ [befriend_target.GetHerHis] trở nên thoải mái khi ở cạnh ta."
 hunt.7303.desc:0 "\n\nKhi chúng ta tiếp tục lên đường, gần như không thể tách rời — ta biết mình đã tìm được những lời đúng để chinh phục [befriend_target.GetHerHim]!"
 hunt.7303.a:0 "Ta nghĩ mình đã chinh phục được [befriend_target.GetHerHim]..."
 hunt.7304.reply:0 "Những lời của ta dường như không tạo được nhiều ấn tượng với [befriend_target.GetTitledFirstName]"
 hunt.7304.hunter:0 "$hunt.7304.reply$, chỉ mỉm cười lịch sự, hắng giọng [befriend_target.GetHerHis], tai hướng về phía vùng hoang dã."
 hunt.7304.falconer:0 "$hunt.7304.reply$, vì [befriend_target.GetSheHe] chỉ gật đầu cho có lệ rồi bước đi."
 hunt.7304.pity:0 "$hunt.7304.reply$, vì [befriend_target.GetSheHe] nhìn ta một cách kỳ lạ, và gãi đầu của [befriend_target.GetHerHis]."
 hunt.7304.wastrel:0 "$hunt.7304.reply$, vì [befriend_target.GetSheHe] trông hoàn toàn kinh hãi trước lời ta nói."
 hunt.7304.steward:0 "$hunt.7304.reply$, vì [befriend_target.GetSheHe] nhanh chóng mất hứng thú, rõ ràng không quan tâm đến quản lý."
 hunt.7304.fallback:0 "$hunt.7304.reply$, vì [befriend_target.GetSheHe] không nói gì."
 hunt.7304.desc:0 "\n\nĐứng một mình sau khi [befriend_target.GetSheHe] đã đi trò chuyện với người khác, ta cảm thấy thật ngốc..."
 hunt.7304.a:0 "Làm tốt lắm, [ROOT.Char.GetFirstNameNoTooltip]."

 hunt.7400.t:0 "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')|U] Của Cơ Hội"
 hunt.7400.desc:0 "Chúng ta rời trại, tiến vào [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] theo hàng dọc. Ta theo dõi chặt chẽ tên [ROOT.Char.Custom2('DescriptorNegative', abduct_target)] [abduct_target.GetTitledFirstName]; [abduct_target.GetSheHe] hoàn toàn không hay biết ý định của ta, mải mê với cuộc săn.\n\n"
 hunt.7400.agent:0 "[abduct_schemer.GetTitledFirstName] không ở cùng chúng ta, nhưng có lẽ ta phải nắm lấy cơ hội này nếu muốn đạt được mục tiêu.\n\n"
 hunt.7400.accomplice_2:0 "[accomplice.GetTitledFirstName] và [accomplice_2.GetTitledFirstName] đi theo, nhìn chúng ta với sự thấu hiểu thầm lặng..."
 hunt.7400.accomplice:0 "Ta có sự giúp đỡ của [accomplice.GetTitledFirstNamePossessive]; chỉ cần tìm đúng thời cơ..."
 hunt.7400.alone:0 "Ta sẽ phải hành động một mình, nhưng với sự chuẩn bị đúng đắn và yếu tố bất ngờ, một [ROOT.Char.GetWomanMan] cũng có thể làm được rất nhiều."
 hunt.7400.a:0 "Thời khắc hành động đã đến."
 hunt.7400.b:0 "Ta giao việc này cho [accomplice.GetFirstNameNoTooltip]."
 hunt.7400.c:0 "[accomplice_2.GetFirstNameNoTooltip] có thể được tin cậy trong việc này."
 hunt.7400.d:0 "Đây không phải là lúc."
 hunt_abduct_accomplice_tt:0 "[THIS.Char.GetShortUIName|U] sẽ cố gắng bắt cóc [abduct_target.GetShortUIName]"

 hunt.7410.desc:0 "Cuối cùng ta cũng tìm được khoảnh khắc khi ta và [abduct_target.GetTitledFirstName] gần như chỉ có hai người! Giờ chỉ còn việc thực hiện kế hoạch!\n\n"
 hunt.7410.accomplice_2:0 "[accomplice.GetTitledFirstName] và [accomplice_2.GetTitledFirstName] nhìn ta, chờ ta ra tay trước..."
 hunt.7410.accomplice:0 "[accomplice.GetTitledFirstName] đứng sẵn sàng, lo lắng nhìn ta..."
 hunt.7410.alone:0 "Ta làm được..."
 hunt.7410.a:0 "Đến lúc rồi!"
 hunt.7410.a.success:0 "Ngươi bắt cóc [abduct_target.GetFirstNameNoTooltip]"
 hunt.7410.a.failure:0 "[abduct_target.GetFirstNameNoTooltip] trốn thoát"
 hunt.7410.b:0 "#EMP Ôi...#! Ta không làm được..."

 hunt.7411.desc:0 "Ta chậm rãi tiếp cận [abduct_target.GetTitledFirstName] từ phía sau, cẩn thận chọn khoảnh khắc thích hợp để lao vào."
 hunt.7411.agent:0 "$hunt.7211.agent$"
 hunt.7411.accomplice_2:0 "Cùng lúc đó, [accomplice_2.GetFirstName] và [accomplice.GetFirstName] tiến tới từ hai phía."
 hunt.7411.accomplice:0 "[accomplice.GetFirstName] cố gắng tìm một góc khác để tiếp cận [abduct_target.GetHerHim]."
 hunt.7411.success:0 "\n\nTa bắt [abduct_target.GetHerHim] hoàn toàn bất ngờ, quật mạnh [abduct_target.GetHerHim] xuống [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]. Khi [abduct_target.GetSheHe] còn đang choáng váng nằm đó, ta trói tay [abduct_target.GetHerHis] bằng dây thừng.\n\n[abduct_target.GetSheHe|U] lăn người lại, đôi mắt đầy sợ hãi và hoang mang."
 hunt.7411.failure:0 "\n\n[abduct_target.GetSheHe|U] suýt bị bắt bất ngờ, nhưng lại khỏe hơn vẻ ngoài của [abduct_target.GetSheHe]! [abduct_target.GetSheHe|U] nhanh chóng nhận ra chuyện gì đang xảy ra, nhìn chằm chằm sợi dây trong tay ta, rồi lao vào [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], kêu cứu những người khác..."
 hunt.7411.a:0 "Ta bắt được ngươi rồi, con sâu nhỏ!"
 hunt.7411.b:0 "Con sâu trơn tuột đáng nguyền rủa!"
 
 hunt.7412.success:0 "\n\nTrước khi ta có cơ hội hỏi, [abduct_actor.GetFirstNameNoTooltip] xô vào ta bằng tất cả sức mạnh của [abduct_actor.GetHerHis], khiến ta nằm sấp trên [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')].\n\nKhi ta nằm đó, choáng váng, ta cảm thấy tay mình bị buộc bằng dây! Một vụ bắt cóc?!"
 hunt.7412.failure:0 "\n\nTa cảm thấy có điều gì đó không ổn; đôi mắt của [abduct_actor.GetFirstNameNoTooltip] ánh lên sự quyết tâm không yên. [abduct_actor.GetSheHe|U] di chuyển để xô ta, nhưng chỉ sượt qua ta, mất thăng bằng và ngã xuống sàn, một cuộn dây tại [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] bên cạnh [abduct_actor.GetHerHim]!\n\nTa phi vào [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] khi [abduct_actor.GetSheHe] nằm rên rỉ, cầu xin những người khác..."
 hunt.7412.a:0 ""[abduct_actor.GetFirstNameNoTooltip]! Cái-...""

 hunt.7800.t:0 "Từ Hư Không"
 hunt.7800.desc:0 "Ta dừng lại uống một ngụm từ túi nước, tận hưởng chút mát lạnh giữa mồ hôi và hỗn loạn của cuộc truy đuổi. Khi ta buộc nó lại bên hông, ta nghe thấy một tiếng huýt gió khe khẽ.\n\n"
 hunt.7800.tree:0 "Một mũi tên cắm phập vào [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] bên cạnh ta với tiếng #EMP RẦM#!!"
 hunt.7800.ground:1 "Một mũi tên cắm phập xuống [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ngay dưới chân ta, ghim sâu xuống đất."
 hunt.7800.closing:0 "\n\nTa và những người gần nhất quay phắt lại, nhưng chẳng thấy ai cả, chỉ có gió xào xạc qua [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]..."
 hunt.7800.a:0 "#EMP Này!#! Cẩn thận hơn đi!"
 hunt.7800.b:0 "Chắc hẳn thứ này thuộc về #EMP ai đó#!..."
 hunt.7800.b.success:0 "Ngươi tìm ra chủ nhân của nó"
 hunt.7800.b.failure:0 "Không có manh mối nào"
 hunt.7800.b.tt:0 "Ngươi đối chất với kẻ bắn"
 hunt.7800.c:0 "#EMP Sát thủ!#! Mau! Đưa ta ra khỏi đây!"

 hunt.7801.t:0 "Từ Hư Không"
 hunt.7801.desc:0 "Quan sát kỹ mũi tên, ta nhận ra phần lông đuôi được chế tác khá lạ, chắc chắn sẽ khác biệt so với của những thành viên khác trong đoàn săn.\n\nLén quan sát ống tên của những thợ săn khác, ta nhanh chóng tìm ra thủ phạm...\n\n"Không, xin đừng! Thưa [ROOT.Char.GetLadyLord]! Có lẽ tôi quá hăng hái khi bắn vào bụi rậm, nhưng hoàn toàn không có ác ý! Xin ngài tha cho!"
 hunt.7801.a:0 "Ta sẽ tha cho ngươi, #EMP lần#! này."
 hunt.7801.b:0 "Thật lố bịch. Tống giam [culprit.GetHerHim], chúng ta rời khỏi đây."

 hunt.8001.t:1 "Một Cá Thể Tuyệt Đẹp"
 hunt.8001.desc:2 "Khi chúng ta trở về từ [host.GetCurrentLocation.GetName] với con [activity.Custom('GetAnimalType')] đã bị hạ gục kéo theo sau, ta không khỏi chiêm ngưỡng nó ngay cả khi đã chết. Một cá thể tuyệt đẹp – ta hoàn toàn có thể tưởng tượng bộ da hoặc chiếc sọ của nó trang trí trên tường đại sảnh của mình! Ôi, nhưng nên chọn cách nào?"
 hunt.8001.a:1 "Bộ lông tuyệt đẹp của nó sẽ là chủ đề trò chuyện hoàn hảo."
 hunt.8001.b:1 "Treo đầu nó lên, khách của ta sẽ thấy được vẻ uy nghi!"
 hunt.8001.c:0 "Hãy tập trung vào bữa tiệc ngon lành thay vì chiến lợi phẩm xác chết!"
  
 hunt.8200.t: "Luyện Tập Săn Chim Ưng"
 hunt.8200.desc: "Ta nhìn ra đường chân trời trước mắt, nắng sớm báo hiệu một ngày đầy hứa hẹn. [ROOT.Char.Custom('GetHuntMasterDesc')] của ta, [master_hunter.GetName], tiến lại gần với [ROOT.Char.Custom('GetRaptorType')] trong tay và một tia sáng trong mắt của [master_hunter.GetHerHis].\n\n“Ta biết chúng ta có một cuộc đi săn phải đi, nhưng quả là một buổi sáng trong lành! Với cơn đói trong bụng chim của người và sương lạnh mặt đất, con mồi sẽ chín muồi để bị bắt.”\n\nNhững móng vuốt của [ROOT.Char.Custom('GetRaptorTypePossessive')] sẽ càng được rèn giũa tốt hơn cho môn thể thao sắp tới..."
 hunt.8200.a: "Ta sẽ không bước vào trận chiến với một lưỡi kiếm cùn."
 hunt.8200.a.flavor: "Ta thích thú với việc luyện tập trước ngày trọng đại."
 hunt.8200.b: "Nhưng ai ở đây để chứng kiến chiến thắng của ta!?"
 hunt.8200.b.flavor: "Ta khăng khăng rằng chúng ta phải nhanh chóng bắt đầu cuộc săn."

 hunt.8210.t: "Săn Khi Đang Thả Ưng"
 hunt.8210.desc: "Để chuẩn bị cho cuộc săn sắp tới, ta tắm dưới ánh trăng, thanh tẩy bản thân và con [hunted_hawker.Custom('GetRaptorType')] của mình.\n\nĐột nhiên phía sau, ta nghe thấy tiếng xào xạc, rồi cảm nhận hơi thở của ai đó trên cổ mình.\n\n“Có lẽ tối nay ngài sẽ là con mồi của ta chăng? Ta hiếm khi được thưởng thức một miếng ngon, vì luôn bị ràng buộc bởi bổn phận.”\n\nMùi hương nhang trầm say đắm từ [local_temple.Custom('GetLocationFaithTemple')] gần đó ở [local_temple.GetBaronyNameExplicitlyNoTooltip] khiến đầu óc ta choáng váng. Chẳng lẽ đây là [shrine_maiden.Custom('PriestTitle')] địa phương?"
 hunt.8210.a: "Ta là ai mà dám từ chối cơn đói của thần linh?"
 hunt.8210.a.flavor: "Đêm đam mê của ngươi nuôi dưỡng tài thơ ca của ngươi."
 hunt.8210.b: "Buông ta ra, ta phải giữ sức lực cho cuộc săn!"
 hunt.8210.b.flavor: "Ngươi từ chối nàng thơ."
 
 hunt.8211.opening: "[shrine_maiden.Custom2('AppropriateGreeting', ROOT.Char)]"
 hunt.8211.desc: "$love_artifact_poetry_name$\n\n#EMP “Đêm qua có phải ngài đã đến tìm ta, hay chính ta đã tìm đến ngài?\n\nTa không nhớ rõ.\n\nTa cũng không biết liệu mình đã chìm trong niềm hạnh phúc chỉ tồn tại trong giấc mơ,\n\nHay khoái lạc ấy thật sự đã xảy ra?”#!"
 hunt.8211.a: "[ROOT.Char.Custom('GetCourt')] sẽ nghe về sự ngây ngất chung của chúng ta!"
 hunt.8211.b: "Ta sẽ trân trọng sự bất tử hóa niềm đam mê của chúng ta."
 love_artifact_poetry_name: "Ta Bước Qua Cây Cầu Khoái Lạc"
 love_artifact_poetry_description:1 "Một bài thơ dành tặng [ROOT.Char.GetTitledFirstName] để kỷ niệm khi [sex_memory.GetDescription], được viết bởi người tình của [ROOT.Char.GetFirstNamePossessiveOrMyNoTooltip] là [shrine_maiden.GetTitledFirstName].\n\n#EMP $hunt.8211.desc$#!"
 love_poetry_artifact_appended_desc: "Một bài thơ dành tặng [ROOT.Char.GetTitledFirstName] để kỷ niệm khi [sex_memory.GetDescription], được viết bởi người tình của [ROOT.Char.GetFirstNamePossessiveOrMyNoTooltip] là [shrine_maiden.GetTitledFirstName].\n\nNó viết:\n#EMP $hunt.8211.desc$#!"
 hunt.8211.a_effect: "[newly_created_artifact.GetName] trở thành một [court_artifact|E] và sẽ nhận một modifier [grandeur|E]"
 hunt.8211.b_effect: "Ngươi nhận được [artifact|E] [newly_created_artifact.GetName]"
 hunt.9001.t: "Chiến Lợi Phẩm Từ Hoang Dã"
 hunt.9001.opening_falconry_self: "Ta gom lại những con chim bị hạ bởi các [activity.Custom('GetRaptorPlural')] của chúng ta,"
 hunt.9001.opening_falconry_master_of_hunt:1 "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], gom lại những con chim bị hạ bởi các [activity.Custom('GetRaptorPlural')] của chúng ta,"
 hunt.9001.opening_falconry_courtier:1 "[hunt_participant.GetTitledFirstName], gom lại những con chim bị hạ bởi các [activity.Custom('GetRaptorPlural')] của chúng ta,"
 hunt.9001.opening_captive_master_of_hunt:0 "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], kiểm tra dây trói của con thú,"
 hunt.9001.opening_captive_courtier:0 "[hunt_participant.GetShortUINameNoFormat] kiểm tra dây trói của con thú,"
 hunt.9001.opening_captive_self:0 "Ta kiểm tra dây trói của con thú,"
 hunt.9001.opening_master_of_hunt:1 "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], chỉ đạo việc mổ xẻ,"
 hunt.9001.opening_courtier:0 "[hunt_participant.GetShortUINameNoFormat] chỉ đạo việc mổ xẻ,"
 hunt.9001.opening_self:0 "Ta chỉ đạo việc mổ xẻ,"
 hunt.9001.opening_captive:0 " quan sát con [host.Custom('GetAnimalTypeCaptive')] bị trói, và chỉ đạo những người hầu cẩn thận khiêng nó."
 hunt.9001.opening_master:1 " lột da xác thú một cách điêu luyện mà không dính dù chỉ một giọt máu."
 hunt.9001.opening_skilled:1 " khéo léo lột da xác thú với độ chính xác và tốc độ."
 hunt.9001.opening_beginner:0 " cẩn thận lột da xác thú dưới sự hướng dẫn của các quản săn."
 hunt.9001.opening_novice:0 " vụng về lột da xác thú trước khi để các quản săn tiếp quản."
 hunt.9001.opening:0 "Ta chỉ đạo việc xẻ thịt, thưởng cho lũ chó săn phần chiến lợi phẩm của chúng."
 hunt.9001.opening_falconry:0 " một chiến lợi phẩm phong phú, và minh chứng cho sự huấn luyện tốt của những con chim săn của chúng ta."

 hunt.9001.credit_self:0 "Con thú này không lớn lắm, nhưng chính tay ta đã hạ nó.\n\n"
 hunt.9001.credit_self_big:0 "Đứng đây lúc này, thật khó tin rằng chính tay ta đã hạ gục con thú đó.\n\n"
 hunt.9001.credit_other:0 "[credit_taker.GetFirstName] đặc biệt hài lòng với chiến tích của [credit_taker.GetHerHis].\n\n"
 hunt.9001.credit_other_big:0 "[credit_taker.GetFirstName] đã làm rất tốt khi hạ gục một con thú hùng mạnh như vậy.\n\n"
 hunt.9001.credit_shared:0 "Dù con mồi có thể nhỏ bé, cả đoàn săn vẫn hân hoan với sự thỏa mãn của một cuộc săn thành công.\n\n"
 hunt.9001.credit_shared_big:0 "Không có gì sánh được với cảm giác phấn khích khi hạ gục một con thú hùng mạnh.\n\n"
 hunt.9001.opening_compassionate:1 "Ta không khỏi ngưỡng mộ con [activity.Custom('GetAnimalType')], ngay cả khi nó đã chết.\n\n"
 hunt.9001.opening_callous:1 "Con [activity.Custom('GetAnimalType')] ngu ngốc đó chẳng có cơ hội nào trước chúng ta...\n\n"
 hunt.9001.opening_ambitious:0 "Ta chỉ có thể tưởng tượng những con thú kiêu hãnh khác, đang chờ được săn...\n\n"
 hunt.9001.opening_content:1 "Đây là những khoảnh khắc đáng trân trọng: bằng hữu tốt và một con [activity.Custom('GetAnimalType')] tuyệt vời.\n\n"
 hunt.9001.opening_martial:1 "Một chuyến đi tuyệt vời, con [activity.Custom('GetAnimalType')] mang lại chút hương vị của sự biến động nơi chiến trường.\n\n"
 hunt.9001.opening_learning:1 "Ta nhìn xác con [activity.Custom('GetAnimalType')], suy ngẫm về giải phẫu và trí tuệ đáng kinh ngạc của nó...\n\n"
 hunt.9001.desc_court_artifact:0 "Ta hình dung bộ da hoặc chiếc sọ của nó trang trí trên tường triều đình của ta.\n\n"
 hunt.9001.desc_trinket:0 "một kỷ vật của ngày hôm nay sẽ giữ ký ức này sống mãi.\n\n"
 hunt.9001.desc_hunter_1:1 "Ta đã tổ chức không ít cuộc săn, và mọi người xung quanh bắt đầu chú ý – danh tiếng về những chuyến săn của ta đang lan truyền!"
 hunt.9001.desc_hunter_2:1 "[ROOT.Char.Custom('TerrainType')] giống như ngôi nhà thứ hai của ta – cảm nhận gió trong tóc, dành thời gian với các cận thần, cảm nhận sự phấn khích khi tiến gần con mồi... Ta cầu mong điều này sẽ không bao giờ kết thúc!"
 hunt.9001.desc_hunter_3:0 "Dù con mồi nhanh, mạnh hay xảo quyệt đến đâu, nó cũng không có cơ hội trước ta! Tài săn bắn của ta là chủ đề bàn tán khắp vương quốc. Tuy nhiên, phần thưởng thật sự là sự tự do mà [ROOT.Char.Custom('TerrainType')] mang lại."
 hunt.9001.falconry:0 "Thật đáng tiếc khi phải quay về sớm như vậy, ta có thể làm việc này cả ngày! Nhưng lũ chim cũng cần nghỉ ngơi."
 hunt.9001.desc_good_bad:1 "Dù gặp vài khó khăn trên đường, cuộc săn đã diễn ra rất tốt!"
 hunt.9001.desc_good:1 "Những cuộc săn như thế này thật thuần túy là niềm vui, ta không thể chờ đến năm sau!"
 hunt.9001.desc_bad_good:1 "Mọi thứ có thể sai dường như đều đã sai, nhưng vẫn có những tia hy vọng."
 hunt.9001.desc_bad:1 "Đoàn săn của chúng ta dường như bị vây quanh bởi vô vàn khổ sở, và ta gần như nhẹ nhõm khi rời khỏi [ROOT.Char.Custom('TerrainType')]."
 hunt.9001.desc_same:1 "Lắng nghe tiếng gọi hoang dã luôn là một cuộc phiêu lưu, và chuyến đi này mang đến cả điều tốt lẫn điều xấu dồi dào!"
 hunt.9001.desc_fallback:1 "Lắng nghe tiếng gọi hoang dã thường là một cuộc phiêu lưu, nhưng ta phải thừa nhận chuyến đi này khá đáng quên."
 hunt.9001.spoils_captive:0 "\n\nHạ gục một con thú hoang là một chuyện, nhưng bắt sống nó nguyên vẹn lại là một kỳ công hoàn toàn khác!"
 hunt.9001.spoils:0 "\n\nChúng ta đặt phần chiến lợi phẩm dành cho lũ chó săn lên tấm da căng, trước khi rời về trại và trở về nhà."
 hunt.9001.spoils_falconry:0 "\n\nCon [activity.Custom('GetRaptorType')] của ta vui vẻ ăn những miếng thịt nhỏ, phần thưởng cho màn thể hiện tuyệt vời hôm nay, trước khi chúng ta rời về trại và trở về nhà."
 hunt.9001.murder_secret:1 "[ROOT.Char.GetIntentTarget.GetFirstName] đã chết, và không ai có chút ý niệm nào rằng chính ta đứng sau chuyện đó...\n\n"
 hunt.9001.murder_public:1 "[ROOT.Char.GetIntentTarget.GetFirstName] đã chết, dù mọi người đều biết ta là kẻ chịu trách nhiệm...\n\n"
 hunt.9001.murder_dead:1 "[ROOT.Char.GetIntentTarget.GetFirstName] đã chết, dù không phải do tay ta gây ra...\n\n"
 hunt.9001.murder_fail:1 "Quả thật đáng tiếc khi [ROOT.Char.GetIntentTarget.GetFirstName] vẫn còn sống...\n\n"
 hunt.9001.woo_soulmate:1 "[ROOT.Char.GetIntentTarget.GetFirstName] và ta đã tạo nên một mối liên kết đặc biệt, sức mạnh của nó khiến ngay cả ta cũng bất ngờ...\n\n"
 hunt.9001.woo_lover:1 "[ROOT.Char.GetIntentTarget.GetFirstName] hoàn toàn không thể chống lại sự quyến rũ của ta...\n\n"
 hunt.9001.woo_potential:1 "Ta đã thu hút được sự chú ý của [ROOT.Char.GetIntentTarget.GetFirstName], nhưng cần thêm nỗ lực nếu muốn chinh phục trái tim [woo_target.GetHerHis]...\n\n"
 hunt.9001.woo_fail:1 "[ROOT.Char.GetIntentTarget.GetFirstName] không hề ấn tượng với những lời tán tỉnh của ta... Ta sẽ phải thử đổi cách tiếp cận...\n\n"
 hunt.9001.befriend_best:1 "[ROOT.Char.GetIntentTarget.GetFirstName] và ta nhanh chóng trở thành bằng hữu thân thiết, vượt xa mọi kỳ vọng của ta...\n\n"
 hunt.9001.befriend_friend:1 "[ROOT.Char.GetIntentTarget.GetFirstName] rất dễ chịu khi ở cạnh ta, ta nghĩ mình có thể tin cậy [befriend_target.GetHerHim]...\n\n"
 hunt.9001.befriend_potential:1 "Dù vẫn còn vài nghi thức giữa ta và [ROOT.Char.GetIntentTarget.GetFirstName], chúng ta đã gần gũi hơn trước...\n\n"
 hunt.9001.befriend_fail:1 "Ta vẫn chưa tiến gần hơn đến việc giành được sự tin tưởng của [ROOT.Char.GetIntentTarget.GetFirstName], hẳn ta đang làm sai điều gì đó...\n\n"
 hunt.9001.a:1 "Chúng ta trở về, tràn đầy sinh lực!"
 hunt.9001.b:2 "Chúng ta đã làm hết sức..."
 hunt.9001.c:0 "Hãy tạm gác cuộc phiêu lưu này lại."
 hunt.9001.d.choice:0 "Ta sẽ chỉ giữ một kỷ vật."
 hunt.9001.d:1 "Ta sẽ giữ một kỷ vật."
 hunt.9001.e:0 "Ta sẽ giữ một chiếc lông."
 hunt.9001.f:0 "[ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] của ta, [trophy_recipient.GetTitledFirstNameNoTooltip], sẽ trân trọng chiến lợi phẩm này."
 hunt.9001.f.present:0 "[trophy_recipient.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', trophy_recipient)] thân mến của ta, nó là của ngươi!"
 hunt.9001.g:0 "[animal_slayer.GetTitledFirstName] đã hạ nó, nó thuộc về [animal_slayer.GetHerHim]."

 hunt.9002.t:0 "Trở Về Tay Không"
 hunt.9002.opening_master_of_hunt:1 "[ROOT.Char.Custom('GetHuntMasterDesc')], [hunt_participant.GetTitledFirstName], tập hợp đoàn săn thất vọng cùng những con chó săn kiệt sức để lên đường trở về."
 hunt.9002.opening_courtier:1 "[hunt_participant.GetTitledFirstName] tập hợp đoàn săn thất vọng cùng những con chó săn kiệt sức để lên đường trở về."
 hunt.9002.opening:1 "Ta tập hợp đoàn săn thất vọng cùng những con chó săn kiệt sức để lên đường trở về."
 hunt.9002.opening_animal:1 "\n\nCon [activity.Custom('GetAnimalType')] quả thực đã thoát khỏi chúng ta, #EMP lần này#!..."
 hunt.0540.t:0 "Một Sư Săn"
 hunt.0540.desc.intro:0 "Cuộc săn của ta sắp bắt đầu, vậy mà ta vẫn chưa chỉ định một [ROOT.Char.Custom('GetHuntMasterDesc')]. Dĩ nhiên ta có thể tự đảm nhận trách nhiệm đó, nhưng mọi [ROOT.Char.GetTitleAsNameNoTooltip|U] tốt đều biết khi nào nên giao việc cho người khác."
 hunt.0540.desc.hates_candidate_a:0 "Dù ta rất miễn cưỡng phải thừa nhận, tên [host.Custom2('InsultAdjective', ROOT.Char)] [moh_candidate_1.GetFirstName] lại là kẻ có đủ năng lực nhất cho vị trí này.\n\n"
 hunt.0540.desc.candidate_a:0 "Cho đến nay, [moh_candidate_1.GetWomanMan] đủ tiêu chuẩn nhất cho công việc này là [moh_candidate_1.GetName], và [moh_candidate_1.GetSheHe] có vẻ háo hức muốn chứng minh bản thân [moh_candidate_1.GetHerselfHimself].\n\n"
 hunt.0540.desc.nepotism:0 "Tuy nhiên, [moh_candidate_2.Custom2('MyCharacterIntroduction', ROOT.Char)] cũng sẽ là một ứng viên đáng tin cậy và phù hợp như ta có thể mong đợi.\n\n"
 hunt.0540.desc.enthusiasm:0 "[moh_candidate_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tỏ ra rất tha thiết với vị trí này, dù [moh_candidate_3.GetSheHe] không thực sự giỏi bằng [moh_candidate_1.GetFirstNameNoTooltip].\n\n"
 hunt.0540.desc.outro:0 "Nhưng suy cho cùng, ta cũng không buộc phải bổ nhiệm bất kỳ ai."
 hunt.0540.a:0 "[moh_candidate_1.GetFirstNameNoTooltip|U] là ứng viên tốt nhất."
 hunt.0540.b:0 "Ta có thể tin tưởng [moh_candidate_2.GetFirstNameNoTooltip|U]."
 hunt.0540.c:0 "[moh_candidate_3.GetFirstNameNoTooltip|U] rất nhiệt tình."
 hunt.0540.d:0 "Ta không cần ai cả."
 friend_made_me_moh:0 "[CHARACTER.GetShortUIName|U] đã nhận được lòng biết ơn vĩnh viễn của [TARGET_CHARACTER.GetShortUINamePossessive] khi ban cho vị trí $master_of_hunt_court_position$"
 friend_made_me_moh_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] đã nhận được lòng biết ơn vĩnh viễn của [CHARACTER.GetShortUINamePossessive] khi ban cho vị trí $master_of_hunt_court_position$"

 hunt.0550.t:0 "Dựng Trại"
 hunt.0550.host:0 "Trong lúc chờ những vị khách còn lại đến nơi, các [ROOT.Char.Custom('GetServants')] của ta có thể bắt đầu chuẩn bị. Những [ROOT.Char.Custom('GetGameKeepers')] kiểm tra [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] mỗi ngày để tìm dấu vết con mồi, đồng thời dựng trại gần khu săn hơn.\n\n"
 hunt.0550.guest:0 "Trong lúc chờ những vị khách còn lại đến nơi, [host.GetTitledFirstName] đã bắt đầu chuẩn bị. Những [host.Custom('GetGameKeepers')] của [host.GetHerHis|U] kiểm tra [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] mỗi ngày để tìm dấu vết con mồi, đồng thời dựng trại gần khu săn hơn.\n\n"
 hunt.0550.nerge.host.desc: "Trong lúc chờ những vị khách còn lại đến nơi, các [ROOT.Char.Custom('GetServants')] của ta có thể bắt đầu chuẩn bị. Những [ROOT.Char.Custom('GetGameKeepers')] đang xác định khu vực nơi những người tham gia sẽ dồn tất cả thú vật lại cho đại cuộc săn Nerge. Hiểu rõ địa hình là bước đầu tiên trong nhiều bước để đạt được thành công.\n\n"
 hunt.0550.nerge.guest.desc: "Trong lúc chờ những vị khách còn lại đến nơi, [host.GetTitledFirstName] đã bắt đầu chuẩn bị. Những [host.Custom('GetGameKeepers')] của [host.GetHerHis|U] đang xác định khu vực nơi những người tham gia sẽ dồn tất cả thú vật lại cho đại cuộc săn Nerge. Hiểu rõ địa hình là bước đầu tiên trong nhiều bước để đạt được thành công.\n\n"
 hunt.0550.sighting:0 "Những con [activity.Custom('GetAnimalPlural')] đó ở rất gần... Ta có thể cảm nhận được..."
 hunt.0550.falconry:0 "Con chim của ta trở nên bồn chồn khi phải chờ đợi, biết rằng nó sắp được thả ra..."
 hunt.0550.legendary:0 "Ngoài kia, ở đâu đó, con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] đang chờ đợi và quan sát..."
 hunt.0550.nerge: "Con ngựa của ta cũng háo hức trước triển vọng của cuộc săn như ta vậy. Nó biết rằng những thử thách lớn đang chờ đợi chúng ta trong vài ngày tới."
 hunt.0550.standard:0 "Ta đã kiểm tra trang bị và con ngựa của mình nhiều lần, sẽ không còn lâu nữa..."
 hunt.0550.intent_arrived:0 "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] hoàn toàn không hay biết gì về kế hoạch của ta nhằm [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim]."
 hunt.0550.intent:0 "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] vẫn chưa đến, sẽ không lâu nữa trước khi kế hoạch của ta nhằm [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim] có thể tiến hành."
 hunt.0550.a:0 "Sắp rồi."
 
