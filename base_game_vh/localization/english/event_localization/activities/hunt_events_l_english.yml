  hunt_arrow_investigate_log_title:0 "$hunt_arrow_dimiss_log_title$"
  hunt_arrow_investigate_log:0 "[CHARACTER.GetShortUIName|U] không thể xác định ai đã bắn mũi tên suýt trúng [CHARACTER.GetHerHim]"
  hunt_arrow_flee_log_title:0 "$hunt_arrow_dimiss_log_title$"
  hunt_arrow_flee_log:0 "[CHARACTER.GetShortUIName|U] đã chạy trốn khỏi cuộc đi săn sau khi một mũi tên suýt trúng [CHARACTER.GetHerHim]"
  hunt_arrow_forgive_log_title:0 "$hunt_arrow_dimiss_log_title$"
  hunt_arrow_forgive_log:0 "[CHARACTER.GetShortUIName|U] đã tha thứ cho [TARGET_CHARACTER.GetShortUIName] vì đã bắn mũi tên suýt trúng [CHARACTER.GetHerHim]"
  hunt_arrow_arrest_log_title:0 "$hunt_arrow_dimiss_log_title$"
  hunt_arrow_arrest_log:0 "[CHARACTER.GetShortUIName|U] đã giam cầm [TARGET_CHARACTER.GetShortUIName] vì đã bắn mũi tên suýt trúng [CHARACTER.GetHerHim]"
 
  hunt.1337.t: "Quyền Săn Bắn"
  hunt.1337.desc: "Ta không có quyền săn bắn tại [barony_holder.GetTitledFirstNamePossessive] [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]. Ta phải mua quyền này nếu không muốn bị xem là kẻ ngoài vòng pháp luật và kẻ săn trộm.\n\nTất nhiên, ngay cả khi ta có được quyền đó, ta cũng không được phép hạ bất cứ con vật nào mình muốn..."
  hunt.1337.a: "[favor_to_call_in.GetTitledFirstNameNoTooltip] chắc chắn sẽ cho phép ta săn bắn!"
  hunt.1337.b: "Mặc xác mấy #EMP 'quyền'#! này, ta săn ở đâu ta muốn!"
  hunt.1337.c: "Ta sẽ mua quyền săn bắn."
  hunt.1337.d: "Bah, quay lại trại thôi..."
  hunt.1337.e: "May thay ta đã trả tiền cho quyền này rồi!"
 
  mpo_hunt.0001.t: "Từ Thuở Ấu Thơ"
  mpo_hunt.0001.desc: "Chúng ta tiến qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] để tìm kiếm con mồi. Đứa con [child.GetFirstName] của ta, đã tỏ ra kiên cường hơn ta tưởng, tay cầm chặt chiếc cung của nó.\n\n\"Dừng lại,\" ta lầm bầm, nhận thấy có sự chuyển động trong cỏ. Một con [ROOT.Char.Custom('SmallAnimal')] nhỏ đang ăn rễ cây, không hề hay biết về sự hiện diện của chúng ta."
  mpo_hunt.0001.a: "Con này là của ta!"
  mpo_hunt.0001.b: "Con làm được mà, [child.GetFirstNameNoTooltip]!"
  mpo_hunt.0001.c: "Con cầm nó như thế này rồi sau đó..."
  mpo_hunt.0001.c.tt.crit_success: "[child.GetFirstNameNoTooltip] khiến mọi người ấn tượng"
  mpo_hunt.0001.b.tt.success: "[child.GetFirstNameNoTooltip] bắt được con vật"
  mpo_hunt.0001.b.tt.failure: "[child.GetFirstNameNoTooltip] thất bại"
  mpo_hunt.0001.d: "Cứ để nó đi."

  mpo_hunt.0010.t: "Từ Trên Cao"
  mpo_hunt.0010.desc: "\"...Ta luôn thích phần này của [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')],\" [target.GetTitledFirstName] nhận xét khi chúng ta cùng tiến bước. \"Cha ta thường đưa chúng ta đến đây săn bắn.\"\n\nTrước khi ta kịp đáp lời thì một con [ROOT.Char.Custom('GetRegionalEagleType')] lao xuống phía [target.GetHerHim], kêu ré lên như tiếng trẻ sơ sinh.\n\n\"Cứu với!\" [target.GetSheHe] hét lên."
  mpo_hunt.0010.a: "Ta biết cách đối phó với thứ này."
  mpo_hunt.0010.b: "Đến lúc ta tỏa sáng!"
  mpo_hunt.0010.b.tt.success: "Ngươi bắn trúng con chim"
  mpo_hunt.0010.b.tt.failure: "Ngươi làm mình bẽ mặt"
  mpo_hunt.0010.b.tt.crit_failure: "Con chim làm ngươi bị thương"
  mpo_hunt.0010.c: "\"Đứng sau ta, [target.GetFirstNameNoTooltip]!\""
  mpo_hunt.0010.c.tt.success: "[target.GetFirstNameNoTooltip] bị ấn tượng"
  mpo_hunt.0010.d: "Không đáng để làm vậy."
 
  mpo_hunt.0020.t: "Tình Mẫu Tử"
  mpo_hunt.0020.desc.intro: "\"Trời bắt đầu tối rồi,\" [companion.GetTitledFirstName] [companion.Custom('quirk_pos_present')]. \"Chúng ta nên tìm một chỗ để...\".\n\nNhưng câu nói của [companion.GetHerHis] bị cắt ngang đột ngột:"
  mpo_hunt.0020.desc.zud: "một con sói chết nằm trên tuyết, một con sói con đang dụi đầu vào bụng vô hồn của nó."
  mpo_hunt.0020.desc.normal: "một con sói gầm gừ về phía chúng ta, thân hình trưởng thành của nó che chở cho một con sói con."
  mpo_hunt.0020.a: "Thời tiết lạnh chắc đã giết chết con mẹ..."
  mpo_hunt.0020.b: "Chúng ta phải giết con mẹ!"
  mpo_hunt.0020.b.tt.success: "Ngươi giết con sói"
  mpo_hunt.0020.b.tt.failure: "Con sói mẹ tấn công ngươi"
  mpo_hunt.0020.c: "Chúng ta có thể lẻn qua nó..."
  mpo_hunt.0020.c.tt.success: "Ngươi lẻn qua con sói mẹ"
  mpo_hunt.0020.d: "Đừng dừng lại."
  artifact_wolf_pelt_name: "Da Sói"
  artifact_wolf_pelt_desc: "Lấy từ một con sói mẹ đang hấp hối."
 
  mpo_hunt.0030.t: "Bị Lưu Đày"
  mpo_hunt.0030.desc: "Một âm thanh rên rỉ thu hút sự chú ý của chúng ta khi đang di chuyển. Một chiến binh bị thương nằm trên một tảng đá, quần áo của [warrior.GetHerHis] rách rưới và quai hàm sưng vù.\n\n\"Chào người, hỡi người đáng sợ, lãnh chúa của ta, [other_ruler.GetTitledFirstName], đã trục xuất ta khỏi vương quốc của [other_ruler.GetHerHis]. Kẻ thù của ta đã đặt một cái bẫy cho ta và giờ ta phải lang thang không mục đích.\""
  mpo_hunt.0030.a: "\"Ắt hẳn phải có lý do cho việc đó.\""
  mpo_hunt.0030.b: "\"Một chiến binh giỏi luôn được cần đến!\""
  mpo_hunt.0030.c: "\"Lòng từ thiện của ta ai cũng biết.\""
  mpo_hunt.0030.d: "\"Chỉ kẻ mạnh mới sống sót.\""
 
  mpo_hunt.0040.t: "Ngựa Gầy Như Nai"
  mpo_hunt.0040.desc: "Trong vùng [root_location.GetTerrain.GetNameNoTooltip|l] khắc nghiệt của [root_location.GetName], cuộc truy đuổi đã kéo dài. Chúng ta tiếp tục phi nước đại, bỏ lại những kỵ sĩ kém cỏi hơn, những con ngựa yếu hơn... nhưng giờ đây ngay cả những con ngựa thiến khỏe mạnh cũng đang gầy đi.\n\nNhững con chiến mã cao quý của chúng ta có thể đưa ta vượt qua cuộc săn này. Nhưng nếu tiếp tục với nhịp độ này, chúng sẽ trở về nhà gầy gò và không sẵn sàng cho chiến trận."
  mpo_hunt.0040.a: "Con mồi bị rình rập chậm rãi sẽ không bỏ chạy."
  mpo_hunt.0040.b: "Với vài món đồ nhỏ, dân địa phương sẽ cho chúng ta ngựa mới."
  mpo_hunt.0040.c: "Cứ để ngựa đói! Chúng ta không được thất bại."
  mpo_hunt.0040.d: "Giảm nhịp độ."

  mpo_hunt.0050.t: "Thợ Săn của [root_location.GetNameNoTooltip]"
  mpo_hunt.0050.desc: "Khi chúng ta phi nước kiệu theo dấu những người dò vết, một nhóm kỵ sĩ lạ tiến lại gần. Dân địa phương. Trên lưng những con ngựa ướt đẫm mồ hôi của họ, những tấm da thú thô được vắt ngang.\n\n\"[hunter.GetFaith.FertilityGodName] thổi sự sống vào vùng [root_location.GetTerrain.GetNameNoTooltip|l],\" thủ lĩnh của họ, [hunter.GetName], nói. \"Chúng tôi đã có chiến lợi phẩm, nhưng nếu ngài muốn giao dịch — chúng tôi cũng có thể giúp cuộc săn của ngài?\""
  mpo_hunt.0050.a: "Thợ săn này nên thuộc về [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNounNoTooltip] của ta."
  mpo_hunt.0050.b: "Ta đổi ngựa lấy dấu vết con mồi."
  mpo_hunt.0050.c: "\"Chúng ta đang đi săn, kẻ lạ mặt. Và ngươi mang những tấm da rất đẹp!\""
  mpo_hunt.0050.c.flavor: "Những mũi tên của ngươi bay về phía các thợ săn địa phương, và họ đáp trả bằng một loạt tên!"
  mpo_hunt.0050.c.tt.success: "Ngươi có được con mồi"
  mpo_hunt.0050.c.tt.failure: "Mục tiêu của những kẻ lạ mặt chính xác hơn"
  mpo_hunt.0050.d: "\"Nếu muốn sống, thợ săn... hãy rời đi.\""
  mpo_lean_horses_hunt_modifier: "Ngựa Thiến Gầy"
  mpo_lean_horses_hunt_modifier_desc: "Săn bắn quá lâu và khắc nghiệt đã khiến nhiều con ngựa của người du mục này trở nên gầy yếu, không còn thích hợp cho chiến trận."

  mpo_hunt.0060.t: "Lông Thú Trong Cỏ"
  mpo_hunt.0060.desc: "Có thứ gì đó lao qua bụi rậm, rồi một thứ nhanh nhẹn khác — rồi thêm một con nữa! Những thân hình nhỏ bé, béo tròn phủ lông nâu, như những viên đá mềm, chạy vội qua đám cỏ.\n\nCác bạn săn của ta đã ngồi trên ngựa, tên đã lắp sẵn, sẵn sàng chỉ chờ một lời — nhưng ta có nên ra lệnh không? Lông chuột marmot là hàng hóa quý trong buôn bán, nhưng thời gian lột da chúng cũng là thời gian ta bỏ lỡ cuộc truy đuổi..."
  mpo_hunt.0060.a: "Ta biết #EMP đúng#! người buôn để bán số lông này..."
  mpo_hunt.0060.b: "\"#EMP Bắn! Bắn!#! Vì cả gia tài da thú!\""
  mpo_hunt.0060.c: "\"Bỏ qua chúng! #EMP Đuổi theo con mồi!#!\""

 


  tgp_hunt.0002.t:0 "Chẳng Khác Bao Nhiêu"
  tgp_hunt.0002.desc:0 "Trong lúc truy đuổi [activity.Custom('GetAnimalType')], ta tình cờ bắt gặp một con suối nhỏ. Sau đám lau sậy, không phải con mồi của ta, mà là một cặp vịt duyên dáng, cổ quấn lấy nhau trong vòng ôm yêu thương.\n\nTa đứng nhìn, say mê trước đôi uyên ương, thì bất chợt chim ưng của ta lao xuống! Chỉ còn lại một con vịt, máu và lông vũ thay cho bạn đời của nó. Con còn lại kêu lên trong nỗi đau tan nát, tuyệt vọng vỗ cánh như muốn đảo ngược thời gian."
  tgp_hunt.0002.a:0 "Quả là một cảnh tượng kỳ diệu."
  tgp_hunt.0002.a.flavor:0 "Bắt nốt con còn lại!"
  tgp_hunt.0002.b:0 "Có lẽ loài vật cũng chẳng khác chúng ta là bao."
  tgp_hunt.0002.b.flavor:0 "Đời là vậy."
  tgp_hunt.0002.c:0 "Ta không thể chịu nổi khi chứng kiến cảnh thê lương như vậy trong lãnh địa của ta."
  tgp_hunt.0002.c.flavor:0 "Nếu thay đổi phải xảy ra — chính ta sẽ là kẻ khởi đầu."
  hunt_invalidated_warning_ban_tt:0 "@warning_icon! #X Ngươi sẽ không thể tổ chức thêm [GetActivityType( 'activity_hunt' ).GetName] [activity|E] nào trong suốt quãng đời của [host.GetName]."
  hunt_outlawed_falconry_log_title:0 "$tgp_hunt.0002.t$"
  hunt_outlawed_falconry_log:0 "[CHARACTER.GetShortUIName|U] đã bất ngờ cấm thuật săn bằng chim ưng"
  hunt_caught_a_duck_log_title:0 "$tgp_hunt.0002.t$"
  hunt_caught_a_duck_log:0 "Chim ưng của [CHARACTER.GetShortUINamePossessive|U] đã bắt được một con vịt"
  hunt_showed_remorse_log_title:0 "$tgp_hunt.0002.t$"
  hunt_showed_remorse_log:0 "[CHARACTER.GetShortUIName|U] đã tỏ ra hối hận trong lúc săn bắn"

  tgp_hunt.0003.t:0 "Kết Thúc Bất Ngờ"
  tgp_hunt.0003.desc:0 "Khi ta trở về trại, ta nhận được một tin hết sức bất ngờ — [host.GetName] đã hủy cuộc săn, ra lệnh mọi người lập tức giải tán!\n\nNghe đồn rằng [host.GetName] bỗng nảy sinh lòng từ bi [GetReligionByKey('buddhism_religion').GetAdjective] sau khi chim ưng của [host.GetHerHis] giết một con vịt."
  tgp_hunt.0003.a:0 "Nhưng ta vừa mới bắt đầu thôi mà!"
  tgp_hunt.0003.a.flavor:0 "Rốt cuộc là vì sao?"

  tgp_hunt.0004.t:0 "Chạm Mặt [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')]"
  tgp_hunt.0004.desc_common:0 "Trong lúc tìm kiếm [activity.Custom('GetAnimalType')], ta bắt gặp một [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')] đặt trên một tảng đá bên đường mòn.\n\n"
  tgp_hunt.0004.desc_true:0 "$tgp_hunt.0004.desc_common$Đây là cơ hội tuyệt vời để tôn kính [ROOT.Char.Custom('GetAppropriateGodname')]."
  tgp_hunt.0004.desc_astray:0 "$tgp_hunt.0004.desc_common$Có lẽ dân địa phương tôn thờ [local_faith.HighGodName]!"
  tgp_hunt.0004.desc_evil_hostile:0 "$tgp_hunt.0004.desc_common$Biểu tượng tà ác của [local_faith.GetName] nơi đây đang công khai khiêu khích ta."
  tgp_hunt.0004.a:0 "Còn nhiều việc quan trọng hơn cần lo."
  tgp_hunt.0004.a.flavor:0 "Để khi khác vậy."
  tgp_hunt.0004.b:0 "Cầu nguyện trước tượng."
  tgp_hunt.0004.b.flavor:0 "Tâm an."
  tgp_hunt.0004.c:0 "Niềm tin của [local_faith.GetAdherentNamePluralNoTooltip] cũng hòa hợp với chúng ta, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]."
  tgp_hunt.0004.c.flavor:0 "$tgp_hunt.0004.b.flavor$"
  tgp_hunt.0004.d:0 "Đức tin [local_faith.GetAdjectiveNoTooltip] vẫn còn lầm lạc."
  tgp_hunt.0004.d.flavor:0 "Ta phải phá bỏ nó!"
  tgp_hunt.0004.e:0 "Chúng nên tôn thờ [ROOT.Char.GetFaith.HighGodName]!"
  tgp_hunt.0004.e.flavor:0 "$tgp_hunt.0004.d.flavor$"
  hunt_went_past_a_religious_figure_log_title:0 "$tgp_hunt.0004.t$"
  hunt_went_past_a_religious_figure_log:0 "[CHARACTER.GetShortUIName|U] đã đi ngang qua một tượng tôn giáo"
  hunt_prayed_at_a_statue_log_title:0 "$tgp_hunt.0004.t$"
  hunt_prayed_at_a_statue_log:0 "[CHARACTER.GetShortUIName|U] đã cầu nguyện trước một [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')]"
  hunt_desecrated_a_statue_log_title:0 "$tgp_hunt.0004.t$"
  hunt_desecrated_a_statue_log:0 "[CHARACTER.GetShortUIName|U] đã xúc phạm một [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')]"
  tgp_hunt.0004.b.success:0 "Ngươi đã phá hoại bức tượng mà không bị phát hiện"
  tgp_hunt.0004.b.failure:0 "Ngươi bị dân địa phương phát hiện khi đang phá hoại tượng"
  jizo_statue:0 "Tượng Jizō"
  religious_statuette:0 "Tượng Tôn Giáo"

  tgp_hunt.0005.t:0 "Giữa Ruộng Lúa"
  tgp_hunt.0005.desc:0 "Khi chúng ta truy đuổi [activity.Custom('GetAnimalType')], cuộc săn bị gián đoạn khi con vật rút vào một ruộng lúa rậm rạp. Cả đoàn săn nhanh chóng tụ lại và quan sát, nhưng không thấy dấu vết nào của [activity.Custom('GetAnimalType')]!\n\nChúng ta không thể chịu thua một ruộng lúa được!"
  tgp_hunt.0005.success:0 "[activity.Custom('GetAnimalType')] đã bị phát hiện"
  tgp_hunt.0005.failure:0 "Không thấy dấu vết của [activity.Custom('GetAnimalType')]"
  tgp_hunt.0005.a:0 "Ta có một kế sách."
  tgp_hunt.0005.b:0 "Đốt ruộng để dồn con vật ra!"
  tgp_hunt.0005.c:0 "Có lẽ [target_character.GetFirstNameNoTooltip] có ý hay?"
  tgp_hunt.0005.d:0 "Mọi người vào vị trí! Chúng ta sẽ chờ xem."

  tgp_hunt.0006.t:0 "Bài Thơ Của Thợ Săn"
  tgp_hunt.0006.desc:0 "Khi ta trở về trại, ta thấy [poet.GetName] đang nhìn xa xăm, chìm trong suy tư. Khi ta đến gần, [poet.GetHerHis] giật mình tỉnh lại.\n\n\"Thật mừng khi gặp ngài, [poet.Custom2('RelationToMe', SCOPE.sC('host'))] của ta! Ta định viết một bài thơ về cuộc săn đầy hứng khởi này, nhưng lại không thể chọn được chủ đề!\""
  tgp_hunt.0006.a:0 "\"Hãy viết về vẻ đẹp yên bình của thiên nhiên nơi đây.\""
  tgp_hunt.0006.b:0 "\"Đương nhiên là về dũng khí của ta rồi!\""
  tgp_hunt.0006.c:0 "\"Hãy dành tặng nó cho [seduction_target.GetNameNoTooltip].\""
  tgp_hunt.0006.d:0 "\"Hãy viết về tài săn bắn của [befriend_target.GetShortUINamePossessiveNoTooltip]!\""
  tgp_hunt.0006.e:0 "\"Để ta cho ngươi mượn [ROOT.Char.Custom('WritingInstrument')] của ta!\""
  hunt_depends_on_aptitude:0 "Hiệu quả phụ thuộc vào [aptitude|e] của [poet.GetShortUIName]"
  hunt_helped_with_poem:0 "Cùng Nhau Viết Thơ"
  hunt_gives_advice_log_title:0 "$tgp_hunt.0006.t$"
  hunt_gives_advice_log:0 "[CHARACTER.GetShortUIName|U] đã đưa lời khuyên cho [poet.GetShortUIName]"
  hunt_had_poem_written_about_self_log_title:0 "$tgp_hunt.0006.t$"
