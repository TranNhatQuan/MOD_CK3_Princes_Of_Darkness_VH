  hunt_admires_buddhist_principles:0 "[CHARACTER.GetShortUIName|U] đã xem đó là sự can thiệp của thần linh"

  tgp_hunt.0010.t:0 "Hạc Mào Đỏ"
  tgp_hunt.0010.desc_common:0 "\n\nKhi chúng ta chạy đến nơi [activity.Custom('GetAnimalType')] được nhìn thấy lần cuối, ta lại trông thấy một cảnh tượng còn tráng lệ hơn: một đàn hạc mào đỏ.\n\nNhững biểu tượng của trường thọ và bất tử này khiến ta phải suy ngẫm..."
  tgp_hunt.0010.desc_master_of_the_hunt:0 "Trong lúc nghỉ tại trại, chủ săn của ta chạy đến báo rằng một [activity.Custom('GetAnimalType')] đã được phát hiện ở phía đông. $tgp_hunt.0010.desc_common$"
  tgp_hunt.0010.desc_fallback:0 "Trong lúc nghỉ tại trại, một thợ săn khác, [target_character.GetFirstName], chạy đến báo rằng một [activity.Custom('GetAnimalType')] đã được phát hiện ở phía đông. $tgp_hunt.0010.desc_common$"
  tgp_hunt.0010.a:0 "Ngắm nhìn cảnh tượng này."
  tgp_hunt.0010.b:0 "Hừ! Ta cần tiếp tục tìm [activity.Custom('GetAnimalType')]."
  tgp_hunt.0010.c:0 "Để xem chúng bất tử đến mức nào."
  tgp_hunt.0010.c.success:0 Mũi tên của ngươi bắn trúng con hạc
  tgp_hunt.0010.c.failure:0 Phát bắn của ngươi suýt trượt
  tgp_hunt.0010.d:0 "Cảnh này mang đến cho ta cảm hứng."
