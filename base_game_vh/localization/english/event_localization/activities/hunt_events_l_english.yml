  tgp_hunt.0007.t:0 "Thỏ Trong Tầm Tay"
  tgp_hunt.0007.desc: "Khi quay trở lại trại, ta nghe thấy tiếng kêu từ bụi rậm.\n\nTiếng kêu đau đớn cho thấy một con thỏ trong bẫy của kẻ săn trộm. [target_character.GetFirstName], tiến lại gần và nhấc con thú bị mắc bẫy lên, liếm đôi môi của [target_character.GetHerHis]..."
  tgp_hunt.0007.a:0 "Tổn thất của kẻ săn trộm là lợi lộc của chúng ta."
  tgp_hunt.0007.a.flavor:0 "Cuộc săn quả thật đang rất thuận lợi!"
  tgp_hunt.0007.b:0 "Chúng ta không xứng đáng với con mồi này! Ta đề nghị thả nó ra."
  tgp_hunt.0007.b.flavor:0 "Liệu [target_character.GetFirstNameNoTooltip] có phải là một [target_character.GetWomanMan] danh dự không?"
  tgp_hunt.0007.b.success:0 "[target_character.GetFirstName] đồng ý với ngài"
  tgp_hunt.0007.b.failure:0 "[target_character.GetFirstName] tỏ ra thất vọng"
  hunt_found_rabbit_in_a_trap_log_title:0 "$tgp_hunt.0007.t$"
  hunt_found_rabbit_in_a_trap_log:0 "[CHARACTER.GetShortUIName|U] đã phát hiện một con thỏ trong bẫy"
  hunt_released_rabbit_from_trap_log_title:0 "$tgp_hunt.0007.t$"
  hunt_released_rabbit_from_trap_log:0 "[CHARACTER.GetShortUIName|U] đã thả một con thỏ"

  hunt_active_participation:0 "Tham Gia Tích Cực"
  hunt_released_someones_catch:0 "Thả Con Mồi Của Người Khác"

  tgp_hunt.0008.t:0 "Thay Đổi Lối Sống"
  tgp_hunt.0008.desc: "Trong khi rình rập con mồi, ta bắt gặp một [target_character.GetName] đang đau khổ với cây cung săn của [target_character.GetHerHis] bị gãy làm đôi.\n\nTa đề nghị cho hắn mượn cây cung của ta nhưng [target_character.GetSheHe] tuyên bố,\n\n\"Ta từ bỏ môn thể thao đẫm máu săn bắn này, mặc dù ta biết ơn vì nó đã tiết lộ tiếng gọi của ta như một tu sĩ. Từ giờ trở đi thay vì đổ máu, ta sẽ tôn vinh [target_character.GetFaith.HighGodName].\""
  tgp_hunt.0008.a:0 "Thử thuyết phục [target_character.GetFirstNameNoTooltip] đổi ý."
  tgp_hunt.0008.a.flavor:0 "Vài lời nói có thể thay đổi tất cả."
  tgp_hunt.0008.a.success:0 "Ngài thuyết phục được [target_character.GetFirstName] quay lại lối sống cũ"
  tgp_hunt.0008.a.failure:0 "[target_character.GetFirstName] vẫn cứng đầu"
  tgp_hunt.0008.b:0 "Đó là lựa chọn của [target_character.GetHerHis]."
  tgp_hunt.0008.b.flavor:0 "Không ích gì tranh luận với người đã quyết tâm."
  hunt_character_became_a_buddhist_monk_log_title:0 "$tgp_hunt.0008.t$"
  hunt_character_became_a_buddhist_monk_log:0 "[target_character.GetShortUIName] đã trở thành một tu sĩ [GetReligionByKey('buddhism_religion').GetAdjective]"
  hunt_character_got_talked_out_of_becoming_monk_log_title:0 "$tgp_hunt.0008.t$"
  hunt_character_got_talked_out_of_becoming_monk_log:0 "[CHARACTER.GetShortUIName|U] đã thuyết phục [target_character.GetShortUIName] từ bỏ ý định trở thành tu sĩ [GetReligionByKey('buddhism_religion').GetAdjective]"
 

  tgp_hunt.0009.t:0 "Ẩn Sĩ [target_faith.GetReligion.GetAdjectiveNoTooltip]"
  tgp_hunt.0009.desc:0 "Trong lúc truy đuổi con mồi, ta bắt gặp một ẩn sĩ nuôi chim ưng.\n\n\"Hãy chiêm ngưỡng vẻ đẹp của những con chim của ta!\"\n\n\"Hẳn ngài là một thợ săn phi thường.\" Ta đáp, mong được nghe những câu chuyện về chiến tích của [buddhist_hermit.GetHerHis].\n\n\"Không, hoàn toàn không phải vậy, những con chim này không bao giờ được thả ra để giết chóc. Điều đó trái với giáo lý của [buddhist_hermit.GetFaith.HighGodName].\" Có đúng chăng khi ngăn cản lẽ tự nhiên?"
  tgp_hunt.0009.a:0 "Lừa vị tu sĩ."
  tgp_hunt.0009.a.flavor:0 "Ta sẽ không thả chim ưng bay đi đâu, cứ tin ta."
  tgp_hunt.0009.b:0 "Đưa cho [buddhist_hermit.GetHerHim] một đề nghị hậu hĩnh."
  tgp_hunt.0009.b.flavor:0 "Đủ vàng thì ai cũng có thể bị thuyết phục."
  tgp_hunt.0009.c:0 "Hừ! Ta sẽ đi săn với người khác."
  tgp_hunt.0009.c.flavor:0 "Phí thời gian với kẻ lập dị này làm gì?"
  tgp_hunt.0009.d:0 "Ta khâm phục nguyên tắc của [buddhist_hermit.GetHerHis]."
  tgp_hunt.0009.d.flavor:0 "Những niềm tin như vậy đáng được tán thưởng."
  hunt_deceives_a_monk_title:0 "$tgp_hunt.0009.t$"
  hunt_deceives_a_monk:0 "[CHARACTER.GetShortUIName|U] đã cố lừa [buddhist_hermit.GetShortUIName]"
  tgp_hunt.0009.a.success:0 "[buddhist_hermit.GetFirstName] đã bị thuyết phục"
  tgp_hunt.0009.a.failure:0 "[buddhist_hermit.GetFirstName] phát hiện lời nói dối của ta"
  tgp_hunt.0009.b.success:0 "Số vàng đủ để mua chuộc nguyên tắc của [buddhist_hermit.GetFirstNamePossessive]"
  tgp_hunt.0009.b.failure:0 "[buddhist_hermit.GetFirstName] vẫn giữ vững niềm tin của [buddhist_hermit.GetHerHis]"
