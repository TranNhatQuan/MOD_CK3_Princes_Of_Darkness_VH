l_english:

  feast_default_jason.100.t: "Yến Tiệc Thời Chiến"
  feast_default_jason.100.desc: ""Chúng ta có nên lo lắng không," [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('soldier'))] của ta, [soldier.GetFirstName], hỏi, "cho đại nghĩa của [ROOT.Char.GetPrimaryTitle.GetAdjective] trong cuộc chiến [war.GetName]...? Ta thấy những gương mặt u ám quanh bàn này — u ám như thể quân đội [foe.GetPrimaryTitle.GetAdjective] của [foe.GetTitledFirstNamePossessive] đã ở ngay trước cửa!"\n\n"Đừng quá bận tâm đến quân của ngài tại vùng [army_location.GetTerrain.GetNameNoTooltip|l] ở [army_location.GetName], thưa [ROOT.Char.GetTitleAsName]," [other_ruler.GetFirstName] mỉm cười, [other_ruler.GetTitleAsNameNoTooltip] của [other_ruler.GetPrimaryTitle.GetNameNoTier]. "Vận may chắc chắn sẽ đến với họ.""
  feast_default_jason.100.a: ""Còn vận may nào tốt hơn... sự trợ giúp của ngài?""
  feast_default_jason.100.b: ""Hãy nhớ lời này: chiến thắng của ta là điều chắc chắn!""
  feast_default_jason.100.c: "Hãy uống cho đến khi thế gian mờ dần..."
  feast_default_jason.100.c_hungee: "Những cái miệng lo lắng này nên được nhét đầy thức ăn."
 
  boasted_of_victories_modifier: "Rêu Rao Khắp Nơi Về Chiến Thắng"
  victories_reduce_stress_add_prestige_desc: "Chiến thắng trong [battles|E] sẽ giảm @stress_icon![stress|E] và mang lại @prestige_icon![prestige|E], nhưng thất bại sẽ làm tăng @stress_icon![stress|E] và khiến mất @prestige_icon![prestige|E]"
  victories_reduce_stress_add_prestige_tt: "Khi [modifier|E] này còn hiệu lực, ngươi sẽ nhận @prestige_icon![prestige|E] và giảm @stress_icon![stress|E] khi thắng [battles|E], nhưng nếu thua sẽ mất @prestige_icon![prestige|E] và tăng @stress_icon![stress|E]"
  feast_default_jason.100.b_exalt_the_crown: "#low Thời gian [modifier|E] được kéo dài nhờ [intent|e] [THIS.Char.GetInvolvedActivityIntent.GetName] của ngươi#!"
