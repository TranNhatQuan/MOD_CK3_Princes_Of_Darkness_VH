l_english:

 ### PHASES
  playdate_phase:0 "Gặp gỡ"

 ### OPTIONS

 ### INTENTS

  child_return_from_playdate_title:0 "Đứa Trẻ Trở Về"
  child_return_from_playdate_desc:0 "[child_scope.GetShortUIName] đã trở về sau khi gặp gỡ bạn đồng trang lứa tại triều đình của [host.GetShortUINamePossessive]"

  playdate_header:0 "Gặp Gỡ Đồng Lứa:"
  playdate.0010.desc:0 "Tại sao ngươi lại nhận lời mời của ta chỉ để đến buổi gặp gỡ đồng lứa của [other_host.GetTitledFirstNamePossessive]?! Ta sẽ nhớ chuyện này."
  playdate.0010.a:0 "Ối."

  playdate.1001.opening_desc:0 "Hãy đến gặp gỡ bạn đồng lứa tại triều đình của ta ở [barony.GetNameNoTier]!"
  playdate.1001.host_likes_me:0 "Ta hy vọng ngươi sẽ tham dự, vì ta đã chờ cơ hội được gặp ngươi!"
  playdate.1001.host_dislikes_me:0 "Ta mời tất cả những người đáng chú ý, mà thật không may ngươi cũng nằm trong số đó."
  playdate.1001.host_gets_along_with_me:0 "Ta hy vọng ngươi sẽ tham dự, vì ta sẽ rất nhớ ngươi nếu ngươi không đến!"
  playdate.1001.a:0 "Tất nhiên ta sẽ đến."
  playdate.1001.b:0 "Không, ta từ chối!"

  playdate.1002.opening_desc:0 "Ta sẽ rất vui nếu [child_scope.Custom2('YourCharacterIntroduction', ROOT.Char)] có thể ghé thăm gia đình ta ở [barony.GetNameNoTier] để gặp gỡ bạn bè đồng trang lứa của [child_scope.GetHerHis]!"
  playdate.1002.host_likes_child:0 "Ta hy vọng [child_scope.GetSheHe] sẽ tham dự, vì ta đã chờ cơ hội được gặp [child_scope.GetHerHim]!"
  playdate.1002.host_dislikes_child:0 "Ta mời tất cả những người đáng chú ý, mà thật không may [child_scope.GetHerHim] cũng nằm trong số đó."
  playdate.1002.host_gets_along_with_child:0 "Ta hy vọng [child_scope.GetSheHe] sẽ tham dự, vì ta sẽ rất nhớ [child_scope.GetHerHim] nếu [child_scope.GetSheHe] không đến!"
  playdate.1002.a:0 "Tất nhiên [child_scope.GetSheHe] sẽ đến."
  playdate.1002.b:0 "Ta phải từ chối."

  playdate.2001.t:1 "Tụ Họp"
  playdate.2001.desc_opening:0 "Mọi người đều đã ở đây!\n\nKhi tất cả các tiểu lãnh chúa và tiểu quý cô được dẫn vào phòng, ta cảm thấy càng lúc càng phấn khích."
  playdate.2001.desc_guest_of_interest_1_2_3:0 "Ta vô cùng vui mừng khi [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] và [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)] đều có thể đến. Chưa kể đến [guest_of_interest_3.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] nữa!"
  playdate.2001.desc_guest_of_interest_1_and_2:0 "Ta vô cùng vui mừng khi cả [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] và [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)] đều có thể đến!"
  playdate.2001.desc_guest_of_interest_1:0 "Ta vô cùng vui mừng khi [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] có thể đến!"
  playdate.2001.desc:0 "Ta rất vui khi được dành thời gian với những đứa trẻ khác!"
  playdate.2001.desc_guest_of_interest_4:0 "Tuy nhiên, ta không vui lắm khi [guest_of_interest_4.Custom2('MyCharacterIntroduction', ROOT.Char)] dường như cũng đã đến. Thôi kệ [guest_of_interest_4.GetHerHim] vậy."
  playdate.2001.a:0 "Chào mừng!"
  playdate.2001.a.tt:0 "Buổi gặp gỡ đồng lứa bắt đầu"

  playdate.2003.t:0 "$playdate_header$ Một Buổi Tụ Họp Tệ Hại"
  playdate.2003.desc:0 "Ta không thể tin nổi! Mặc dù ta đã gửi lời mời và chuẩn bị đầy đủ, vậy mà không một ai xuất hiện tại buổi gặp gỡ đồng lứa của ta.\n\nThôi kệ. Ta sẽ tự mình thưởng thức những món kẹo này. Và những món đồ chơi này. Và... Và... Tại sao không ai đến?"
  playdate.2003.a:0 "Tại sao lại không ai đến?"
 
  playdate.2501.t:1 "Lời Chào Nồng Nhiệt"
  playdate.2501.likes_host:1 "Mọi người đều tụ tập trong đại sảnh khi [host.GetTitledFirstNameNoTooltip] chào mừng tất cả chúng ta đến buổi gặp gỡ đồng lứa!"
  playdate.2501.dislikes_host:1 "Mọi người đều tụ tập trong đại sảnh khi [host.Custom2('InsultAdjective', ROOT.Char)] [host.GetTitledFirstNameNoTooltip] chào mừng tất cả chúng ta đến buổi gặp gỡ đồng lứa."
  playdate.2501.a:0 "Ta mong chờ điều này!"
  playdate.2501.a_dislike:0 "Mau kết thúc chuyện này đi."

  playdate.0020.t:0 "$playdate_header$ Kết Thúc Trò Chơi"
  playdate.0020.desc:0 "Họ nói rằng [host.Custom2('MyCharacterIntroduction', ROOT.Char)] đã qua đời, nhưng không ai dường như có thể nói cho ta biết điều đó thực sự nghĩa là gì. Điều ta biết là buổi gặp gỡ đồng lứa của [host.GetHerHis] đã kết thúc."
  playdate.0020.a:0 "Nhưng chúng ta đã chơi vui như vậy!"
  playdate.0020.a.tt:0 "#F Ý là... cho đến khi [host.GetSheHe] biến mất.#!"

  playdate.0021.desc:0 "Vì ta giờ đã bị nhốt sau song sắt nên buổi gặp gỡ đồng lứa của ta sẽ bị hủy. Ôi, bao nhiêu giờ ta đã mong chờ nó... Thật lãng phí!"
  playdate.0021.a:0 "Bao nhiêu niềm vui lẽ ra có thể có..."

  playdate.0022.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã bị tống giam, và buổi gặp gỡ đồng lứa của [host.GetHerHis] đã kết thúc. Thật là thời điểm xui xẻo!"

  playdate.3001.t:1 "Chơi Quá Tay"
  playdate.3001.desc:0 "Ta cứ tưởng [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] và đứa trẻ nông dân [peasant_child.Custom('GirlBoy')] chỉ giả vờ đánh nhau, nhưng rồi bỗng nhiên máu đã vấy trên mặt đất.\n\n[guest.GetFirstNameNoTooltip] ngã xuống đất với một tiếng rên, và đứa trẻ nông dân đứng trên [guest.GetHerHim] chuẩn bị tấn công lần nữa."
  playdate.3001.a:0 "Ta sẽ cứu [guest.GetHerHim]!"
  playdate.3001.a_injured:0 "Ngươi bị thương"
  playdate.3001.b:0 ""Có ai đó, làm ơn giúp với!""
  playdate.3001.c:0 "Trông có vẻ vui đấy, để ta thử một tay!"

  playdate.3002.t:1 "Bí Mật"
  playdate.3002.desc:0 "[secret_holder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] rõ ràng đang giấu điều gì đó.\n\nNhưng — đúng lúc [secret_holder.GetSheHe] đồng ý nói cho ta biết đó là gì — [close_participant.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến lại gần và khăng khăng rằng ta phải chơi cờ cùng [close_participant.GetHerHim]."
  playdate.3002.a:0 "Được thôi. Ta chẳng quan tâm mấy bí mật ngớ ngẩn."
  playdate.3002.b:0 "Suỵt, ta muốn biết bí mật!"

  playdate.3003.t:1 "[ROOT.Char.Custom('CatStoryName')]"
  playdate.3003.desc_opening:0 "Ta mang con mèo [ROOT.Char.Custom('CatStoryName')] của mình theo để mọi người thấy ta có một con mèo tuyệt vời thế nào.\n\n"
  playdate.3003.desc_bonding_cat_opening:0 ""Con mèo của ngươi dễ thương quá! Ngươi có muốn xem con của ta không?""
  playdate.3003.desc_bonding_cat:0 "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đưa ra một con mèo màu [guest.Custom('CatFurColor')] về phía ta. "[guest.Custom('CatStoryHerHis')|U] tên là [guest.Custom('CatStoryName')]!""
  playdate.3003.desc_bonding_dog_opening:0 ""Con mèo của ngươi dễ thương quá! Ngươi có muốn xem con chó của ta không?""
  playdate.3003.desc_bonding_dog:0 "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đưa ra một con chó màu [guest.Custom('DogFurColor')] cho ta xem. "[guest.Custom('DogStoryHerHis')|U] tên là [guest.Custom('DogStoryName')]!""
  playdate.3003.a_cat:0 "Con mèo của ngươi dễ thương quá!"
  playdate.3003.a_dog:0 "Con chó của ngươi dễ thương quá!"
  playdate.3003.b:0 "Ồ, cảm ơn! Lại đây nào, [guest.Custom('DogStoryName')]!"
  playdate.3003.c:0 "Eo ôi, con gì mà bẩn thỉu. Không thể so với mèo của ta!"

  playdate.3004.t:1 "[ROOT.Char.Custom('DogStoryName')]"
  playdate.3004.desc_opening:0 "Ta mang con chó [ROOT.Char.Custom('DogStoryName')] của mình theo để mọi người có thể thấy ta có một chú cún tuyệt vời đến thế nào.\n\n"
  playdate.3004.desc_bonding_cat_opening:0 ""Con chó của ngươi dễ thương quá! Ngươi có muốn xem con mèo của ta không?""
  playdate.3004.desc_bonding_dog_opening:0 ""Con chó của ngươi dễ thương quá! Ngươi có muốn xem con của ta không?""
  playdate.3004.b:0 "Ồ, cảm ơn! Lại đây nào, [guest.Custom('CatStoryName')]!"
  playdate.3004.c:0 "Eo ôi, con gì mà đầy bọ chét. Không thể so với chó của ta!"

  playdate.3005.t:1 "Bí Mật "
  playdate.3005.desc:0 "Ta đang nói chuyện với [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] về cuộc sống tại triều đình và những tin đồn gần đây.\n\n"Và ta nghe rằng [secret_owner.GetTitledFirstName] [secret.Custom('SecretDescriptionThirdPerson')]–"\n\nTa chợt nhận ra và dừng lại, nhưng đã quá muộn; [guest.GetFirstNameNoTooltip] đã nghe thấy hết."
  playdate.3005.a: "À... ờ."
  playdate.3005.b:0 "Làm ơn, hãy quên những gì ta đã nói! Ta sẽ làm bất cứ điều gì!"
  playdate.3005.c:0 "Ta sẽ trả tiền cho ngươi! Chỉ cần giữ im lặng!"
  playdate.3005.d:0 "Nếu ngươi nói với ai đó ta sẽ– ta sẽ làm hại ngươi!"
  playdate.3005.d.success:0 "[guest.GetFirstNameNoTooltip] hứa sẽ giữ kín cái miệng của [guest.GetHerHis]"
  playdate.3005.d.failure:0 "[guest.GetFirstNameNoTooltip] không sợ ngươi"
  promise_to_keep_secret: "[guest.GetFirstNameNoTooltip] hứa sẽ không tiết lộ [secret|E]"

  playdate.3006.t:1 "Bạn Đồng Hành Khi Đọc"
  playdate.3006.desc:0 "Ta mang theo một cuốn sách nhỏ – như ta thường làm – và [fellow_nerd.Custom2('MyCharacterIntroduction', ROOT.Char)] tìm thấy ta đúng lúc ta đang ngồi xuống để đọc vài trang.\n\n"Ồ, đó là #EMP [SCOPE.Custom('RandomInformativeTextName')|U]#! sao? Ta недавно đọc nó, ngươi thấy văn phong thế nào?""
  playdate.3006.a:0 "Đây sẽ là một cuộc thảo luận hay!"
  playdate.3006.b:0 "Đi đi, ta đang đọc."

  playdate.3007.t:1 "Leo Trèo"
  playdate.3007.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã leo lên [ROOT.Char.Custom('ObjectToClimb')] cao nhất xung quanh và đang nhiệt tình ra hiệu cho ta leo theo.\n\nĐây không phải lần đầu ta leo [ROOT.Char.Custom('ObjectToClimb')], nhưng trông có vẻ khá cao..."
  playdate.3007.a:0 "Ta sẽ không lùi bước!"
  playdate.3007.a.success:0 "Ngươi leo lên thành công"
  playdate.3007.a.failure:0 "Ngươi bị ngã đau"
  playdate.3007.b:0 "Không, ta nghĩ ta sẽ ở dưới này."

  playdate.3008.t:1 "Đi Bơi"
  playdate.3008.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lao thẳng về phía [ROOT.Char.Custom('IndefiniteBodyOfWater')] mà chẳng chút do dự.\n\nTrò nghịch nước ban đầu chẳng mấy chốc biến thành sự hoảng loạn, và bất thình lình [participant.GetSheHe] biến mất dưới mặt nước. Khoảnh khắc ấy cứ kéo dài, khiến ta chợt nhận ra rằng [participant.GetSheHe] sẽ chẳng thể trồi lên nổi nếu không có kẻ ra tay cứu giúp."
  playdate.3008.a:0 "Chờ đó, ta đến đây!"
  playdate.3008.a.success:0 "Ngươi cứu được [participant.GetFirstNameNoTooltip]"
  playdate.3008.a.failure:0 "Ngươi không đến kịp"
  playdate.3008.a.critical_failure:0 "Ngươi suýt chết đuối"
  playdate.3008.b:0 "Làm ơn, ai đó giúp với!"
  playdate.3008.b.success:0 "Có người nghe thấy và giúp"
  playdate.3008.b.failure:0 "Không ai đến cứu"
  playdate.3008.c:0 "Chắc [participant.GetSheHe|U] đã về nhà rồi..."

  playdate.3009.t:1 "Ngày Tuyết"
  playdate.3009.desc_two:0 "Ta lén đến sau lưng [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] và [to_blame.Custom2('MyCharacterIntroduction', ROOT.Char)] với hai tay đầy tuyết, và đúng lúc [participant.GetFirstNameNoTooltip] chuẩn bị quay lại thì ta nhảy ra!"
  playdate.3009.desc_opening:0 "Ta lén đến sau lưng [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] với hai tay đầy tuyết, và đúng lúc [participant.GetSheHe] chuẩn bị quay lại thì ta nhảy ra!"
  playdate.3009.desc:0 "\n\n[participant.GetSheHe|U] thét lên, nhưng nhanh chóng quay lại phản đòn; chẳng bao lâu sau ta đã phải tháo chạy còn [participant.GetSheHe] thì lao tới chỗ ta với tốc độ kinh người, tay lăm lăm một quả cầu tuyết khổng lồ!"
  playdate.3009.a:0 "Ta sẽ không lùi bước!"
  playdate.3009.a.success:0 "Ngươi thắng trận chiến tuyết"
  playdate.3009.a.failure:0 "Ngươi bị ném trúng đầu bằng một quả cầu tuyết cứng như băng "
  playdate.3009.b:0 "Làm ơn tha cho ta!"
  playdate.3009.c:0 "Là [to_blame.GetFirstNameNoTooltip] làm, không phải ta!"
  playdate.3009.c.success:0 "[participant.GetFirstNameNoTooltip] tin ngươi"
  playdate.3009.c.failure:0 "[participant.GetSheHe|U] nhận ra ngươi đang nói dối"

  playdate.3010.t:1 "Ngày Chợ"
  playdate.3010.desc:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và ta đồng ý rằng buôn bán là một kỹ năng quan trọng mà một quý tộc cần học, vì vậy chúng ta quyết định ghé thăm khu chợ địa phương ở [ROOT.Char.GetCurrentLocation.GetName].\n\nChúng ta chỉ có vài viên sỏi làm tiền, nhưng chúng #EMP rất#! sáng!"
  playdate.3010.a:0 "Ehem, ta muốn mua một món hàng."
  playdate.3010.a.success:0 "Ngươi thuyết phục được người bán trao đổi"
  playdate.3010.a.failure:0 "Người bán đuổi ngươi đi"
  playdate.3010.b:0 "Ngươi phải đưa ta thứ ta muốn! Ta là #EMP [ROOT.Char.GetLadyLord]#!!"
  playdate.3010.c:0 "Hãy lập gian hàng của riêng chúng ta!"
  playdate.3010.c.tt:0 "Một số thương nhân chiều theo trò chơi và "mua" sỏi của ngươi bằng lá cây"

  playdate.3011.t:1 "Chơi Làm Gia Đình"
  playdate.3011.desc:1 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến lại phía ta, ôm theo một đống vải vóc. Khi [participant.GetSheHe] ném chúng xuống sàn, ta mới hay đó là một đống y phục – dành cho người lớn!\n\n\"Hãy cùng chơi trò gia đình nào!\""
  playdate.3011.a:0 "Chỉ khi chúng ta là cha mẹ!"
  playdate.3011.b:0 "Được thôi. Và [disliked_participant.GetFirstNameNoTooltip] sẽ là con chó!"
  playdate.3011.c:0 "Không, ngớ ngẩn quá. Hãy chơi cờ."
  playdate.3011.c.tt:1 "Ngươi tiếp tục học tập nghệ thuật [THIS.Char.Custom('education_focus_child')]"

  playdate.3012.t:1 "Những $knight_culture_player_plural_no_tooltip$ Dũng Cảm"
  playdate.3012.desc_knight:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và ta đang xem các $knight_culture_player_plural_no_tooltip_lowercase$ luyện tập trong sân khi [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến đến với nụ cười."
  playdate.3012.desc_no_knight:0 "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và ta đang xem vài nông dân luyện tập thì một người trong số họ tiến đến với nụ cười."
  playdate.3012.desc:0 "\n\n"Các [participant.Custom('GirlsBoysChildren')] nghĩ sao, các ngươi có thể học những điều cơ bản không?""
  playdate.3012.a:0 "#EMP Có!#!"
  playdate.3012.a.success:0 "Ngươi nắm bắt được những điều cơ bản"
  playdate.3012.a.neutral:0 "Dù cố gắng thế nào ngươi cũng không hiểu được"
  playdate.3012.a.failure:0 "Ngươi bị đánh trúng đầu – #EMP rất#! đau"
  playdate.3012.b:0 "Ta thích xem các ngươi luyện tập hơn."

  playdate.3013.t:1 "[witch.GetWomanMan|U] Thông Thái"
  playdate.3013.desc:0 "Chúng ta đang chơi trong rừng thì đột nhiên ta nhận ra mình ở một mình; ta chắc rằng những người khác vừa ở ngay sau lưng ta!\n\nĐúng lúc ta chuẩn bị hét lên – để họ tìm thấy ta, chứ không phải vì ta #EMP sợ#! – ta tình cờ gặp [witch.Custom2('MyCharacterIntroduction', ROOT.Char)] mặc áo choàng đen. [witch.GetSheHe|U] đang ngồi xổm trên mặt đất xem xét một loại cây trông kỳ lạ, so sánh nó với hình vẽ trong một cuốn sách đen lớn mở trên đất cạnh [witch.GetHerHim].\n\n"Chào [ROOT.Char.GetLadyLord] trẻ tuổi. Có phải tiếng gọi của tri thức đã dẫn ngươi đến đây với ta?""
  playdate.3013.a:0 "Ta chỉ muốn biết về cái cây ngươi đang cầm."
  playdate.3013.a.success:0 "Ngươi học được nhiều điều về thảo mộc và cây cối"
  playdate.3013.a.failure:0 "Ngươi không hiểu [witch.GetSheHe] đang nói gì"
  playdate.3013.b:0 "Vâng, hãy dạy ta mọi thứ ngươi có thể!"
  playdate.3013.c:0 "Ngươi... Ngươi là phù thủy! Ngươi là người xấu."

  playdate.3014.t:1 "[priest.GetCouncilTitle|U]"
  playdate.3014.desc_participant:0 "Chúng ta đang khám phá [ROOT.Char.GetFaith.HouseOfWorship] địa phương thì [participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và ta bắt gặp [priest.Custom2('MyCharacterIntroduction', ROOT.Char)] đang bị bao quanh bởi các cuộn sách.\n\n"Đây là những nhật ký từ rất lâu trước, các ngươi có hứng thú với những thứ như vậy không?""
  playdate.3014.desc:0 "Ta đang khám phá [ROOT.Char.GetFaith.HouseOfWorship] địa phương thì bắt gặp [priest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đang bị bao quanh bởi các cuộn sách.\n\n"Đây là những nhật ký từ rất lâu trước, ngươi có hứng thú với những thứ như vậy không?""
  playdate.3014.a:0 "Có! Hãy dạy ta về chúng."
  playdate.3014.a.success:0 "Ngươi tiếp thu được nghệ thuật viết nhật ký"
  playdate.3014.a.neutral:0 "Ngươi học được vài điều"
  playdate.3014.a.tt:0 "Ngươi tiếp tục học tập nghệ thuật [ROOT.Char.Custom('education_focus_child')]"
  playdate.3014.a.tt_participant:0 "Ngươi và [participant.GetFirstNameNoTooltip] tiếp tục học tập nghệ thuật [ROOT.Char.Custom('education_focus_child')]"
  playdate.3014.a.failure:0 "Ngươi không học được gì"
