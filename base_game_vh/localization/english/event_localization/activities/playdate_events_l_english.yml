# Learning your child drowned - by Isabella Welch

  playdate.4000.t:0 "Đẫm Nước Mắt"
  playdate.4000.desc:0 "Một người đưa tin mang đến tin dữ cùng một chiếc hộp đen nhỏ.\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('drowned_participant'))] của ta, [drowned_participant.GetFirstNameNoTooltip], đã chết đuối khi đang chơi với [host.GetTitledFirstName].\n\nTa gần như không thể nhìn rõ qua đôi mắt đẫm lệ vào trong chiếc hộp — nhưng chỉ một thoáng nhìn cũng đủ xác nhận rằng đây chính là thi thể của đứa con yêu quý của ta."
  playdate.4000.a:0 "Ta hy vọng [participant.GetSheHe] sẽ được vui chơi tại [ROOT.Char.GetFaith.PositiveAfterLife]."
  playdate.4000.b:0 "Sự ngây thơ là một thứ độc dược chết người."
  playdate.4000.c:0 "Ta mong điều tương tự xảy ra với [host.GetTitledFirstNameNoTooltip]."

  playdate.4001.t:1 "Rào Cản Ngôn Ngữ"
  playdate.4001.desc.rowdy:0 ""Ta nói #EMP "búp bê"#! chứ không phải #EMP "ngu ngốc!"#! Trời ơi!" [participant.GetTitledFirstName] rõ ràng đang bực bội vì rào cản ngôn ngữ của chúng ta. Việc vung tay lên trời cho thấy một cơn cáu kỉnh sắp bùng nổ."
  playdate.4001.desc.pensive:0 ""Xin lỗi... #EMP Nơi ở#!. Cô ấy trở về nơi ở khiêm tốn của mình, không phải gói đồ ở nước ngoài." Mặc dù [participant.GetHerHis] cư xử rất lịch sự, lông mày của [participant.GetTitledFirstNamePossessive] vẫn nhíu lại vì bực bội."
  playdate.4001.desc:0 "\n\nNgôn ngữ [ROOT.Char.GetCulture.GetLanguage.GetName] và [participant.GetCulture.GetLanguage.GetName] dường như có nhiều điểm khác biệt hơn là tương đồng, vì vậy chúng ta gặp khó khăn khi nói chuyện với nhau.\n\nCó lẽ ta nên làm gì đó để chúng ta có thể chơi cùng nhau mà không nổi giận, hay chỉ hy vọng mọi thứ tự giải quyết?"
  playdate.4001.a:0 "Ta sẽ nói chậm và to! Chắc chắn sẽ giúp!"
  playdate.4001.b:0 "Có lẽ ta có thể nhờ [participant.GetFirstNameNoTooltip] dạy ta vài từ [participant.GetCulture.GetLanguage.GetNameNoTooltip]?"
  playdate.4001.c:0 "Hừ, tại sao ta phải bận tâm? Ta chỉ muốn vui thôi!"

  playdate.5001.t: "Ra Ngoài Chơi Không?"
  playdate.5001.desc: "Một quả bóng nảy qua trước mặt ta, rồi được [participant.GetFirstName] nhanh tay bắt lại.\n\n"Ngươi có muốn tham gia không? Chúng ta có một quả bóng, và cũng cần thêm vài người chơi."\n\nMột nhóm trẻ con nhỏ tụ tập xung quanh chúng ta với vẻ mong đợi."
  playdate.5001.a: "Ta sẽ tham gia!"
  playdate.5001.a.tt: "Trò chơi bắt đầu!"
  playdate.5001.b: "Ta không thật sự muốn..."

  playdate.5002.t: "Cú Ném Lệch"
  playdate.5002.desc: "Quả bóng nảy loạn xạ khi đi qua ta, bật vào một bức tường... rồi bay thẳng vào khu vườn gần đó! Chỉ một khoảnh khắc sau, tiếng vỡ vụn cùng một tiếng hét tức giận báo hiệu hậu quả sắp đến.\n\n[neighbour.GetFirstName] lao ra khỏi cửa, ôm lấy [broken_artifact.GetName] bị hỏng của [neighbour.GetHerHis]. Nhìn quanh đám đông, [neighbour.GetSheHe] xác định ta là thủ phạm.\n\n"Ngươi có gì để nói cho hành động của mình không, đồ nhóc mũi dãi?" [neighbour.GetSheHe|U] gầm lên. Ta nhìn quanh tìm sự giúp đỡ. Nhưng chẳng có ai."
  playdate.5002.a: ""[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parent'))] của ta sẽ trả tiền sửa chữa!""
  playdate.5002.a.tt: "Hoặc, ờ, có lẽ #EMP ta#! sẽ phải trả, nhưng ta sẽ không thiệt lâu đâu..."
  playdate.5002.b: ""Ta ra lệnh cho ngươi trả lại quả bóng, [neighbour.Custom2('InsultNoun', ROOT.Char)].""
  playdate.5002.b.tt: "Chẳng lẽ [neighbour.GetSheHe] quên rằng ta là một [ROOT.Char.GetTitleAsNameNoTooltip]?"
  playdate.5002.b.success: "[neighbour.GetSheHe|U] ngoan ngoãn trả lại quả bóng"
  playdate.5002.b.failure: "[neighbour.GetSheHe|U] cau mày khi trả lại quả bóng"
  playdate.5002.c: ""Ta xin lỗi. Chúng ta có thể lấy lại quả bóng không?""
  playdate.5002.c.success: "[neighbour.GetSheHe|U] trả lại quả bóng với nụ cười"
  playdate.5002.c.failure: "[neighbour.GetSheHe|U] trả lại quả bóng với tiếng thở dài"

  playdate.5003.t: "Khác Biệt Rõ Rệt"
  playdate.5003.desc: "[other_child.GetFirstName] đơn giản là quá nhanh và quá khỏe! Mỗi khi ta cố theo kịp, ta chỉ bị bật ra khỏi [other_child.GetHerHim]. Ngay cả khi ta lùi lại để nhìn [other_child.GetHerHim] chơi, đá quả bóng qua sân, ta cũng phải dừng lại một lúc để lấy lại hơi thở sau khi chạy theo.\n\nChắc chắn phải có cách nào đó để ta cạnh tranh?"
  playdate.5003.a: "[other_child.GetFirstNameNoTooltip] không hề có bất kỳ bảo vệ ống chân nào..."
  playdate.5003.b: "Ta chỉ cần cố gắng hơn!"
  playdate.5003.b.success: "Ngươi theo kịp được"
  playdate.5003.b.failure: "[other_child.GetFirstNameNoTooltip] đơn giản là quá mạnh"
  playdate.5003.c: "Có lẽ nếu ta cứ tiếp tục quan sát, ta có thể học được gì đó."

  playdate.5004.t: "Một Góc Nhìn Khác"
  playdate.5004.desc: "Khi chúng ta đang vừa cười đùa vừa đuổi theo quả bóng, một dáng hình đơn độc chợt lọt vào mắt ta.\n\n[other_child.GetFirstName] đang ngồi một góc, bẽn lẽn quan sát cuộc vui. [other_child.GetSheHe|U] thoáng nhìn ta rồi lập tức quay đi, giả vờ như đang say sưa ngắm nhìn mấy đóa hoa.\n\nTrông [other_child.GetSheHe|U] có vẻ đang rất cần người bầu bạn."
  playdate.5004.a: ""Ngươi có phiền nếu ta ngồi cùng không?""
  playdate_5004_sports_removal: "Ngươi sẽ không còn tham gia vào trận bóng đang diễn ra nữa"
  playdate.5004.b: ""Nào, tham gia đi!""
  playdate.5004.b.success: "Họ do dự rồi tham gia"
  playdate.5004.b.failure: "Họ không mấy hứng thú với lời đề nghị của ngươi"
  playdate.5004.c: "Tốt hơn cứ để họ yên."

  playdate.5005.t: "Bức Tường Lớn"
  playdate.5005.desc: "Quả bóng kia rồi! Khi nó bay qua ta, ta vung chân đá thật mạnh. Mạnh #EMP quá#!.\n\nQuả bóng lao vút trong không khí, xoay tít. Nó bay qua đám đông, vọt lên cao, rồi vượt qua một bức tường gần đó. Tiếng rơi xuống vang lên rõ ràng.\n\nTa nhìn lên bức tường. Nó khá cao, hơn gấp đôi chiều cao của ta."
  playdate.5005.ending: "Thực lòng mà nói, chỗ đó cao quá mức ta mong đợi. Trong lúc đang phân vân giữa các lựa chọn, ta chợt thấy [bullied_kid.GetFirstName] đứng đằng xa, cố gắng hết sức để nhìn đi chỗ khác thay vì nhìn vào bức tường kia."
  playdate.5005.a: "[bullied_kid.GetFirstNameNoTooltip] nên đi lấy nó!"
  playdate.5005.b: "Được rồi, #EMP tường#!, ta đến đây..."
  playdate.5005.b.success: "Ngươi vượt tường một cách vô cùng đẹp mắt"
  playdate.5005.b.success.tt: "Tất cả người tham gia tăng #positive_value 15#! thiện cảm với ngươi"
  playdate.5005.b.failure: "Ngươi leo qua tường rồi lấy quả bóng"
  playdate.5005.b.failure.tt: "Tất cả người tham gia giảm #negative_value 5#! thiện cảm với ngươi"
  playdate.5005.b.failure.gameends: "Trận bóng kết thúc"
  playdate.5005.b.critfailure: "Ngươi trượt ngã khi leo tường"
  playdate.5005.c: "Hay chúng ta làm gì khác đi?"
  playdate.5005.more_balls: "Ta sẽ mua một quả bóng khác!"

  playdate.5006.t: "Ta Về Nhà Đây!"
  playdate.5006.desc: "Trận bóng đá đã trở nên đầy tính cạnh tranh. Ý nghĩ đó vừa thoáng qua đầu ta thì một vụ va chạm đã xảy ra: [bully_kid.GetFirstName] húc mạnh khiến [ball_kid.GetFirstName] ngã nhào vào bụi rậm gần đó. [bully_kid.GetFirstNameNoTooltip] liền đứng đó cười đắc chí.\n\n\"Đ- đủ rồi!\" [ball_kid.GetFirstNameNoTooltip] giận dữ lắp bắp, chật vật thoát ra khỏi bụi gai. [ball_kid.GetSheHe|U] vừa đứng dậy vừa túm lấy quả bóng. \"Ta về nhà đây, và ta mang theo cả bóng của ta!\"\n\nMột bầu không khí ngượng ngùng bao trùm lấy tất cả."
  playdate.5006.a: ""Ta xin lỗi, [ball_kid.GetFirstNameNoTooltip].""
  playdate.5006.a.tt: "Không phải lỗi của ngươi, nhưng rõ ràng [bully_kid.GetFirstNameNoTooltip] sẽ không xin lỗi..."
  playdate.5006.b: ""Đợi đã, [ball_kid.GetFirstNameNoTooltip]! Làm ơn ở lại.""
  playdate.5006.b.success: "Ngươi thuyết phục được [ball_kid.GetHerHim] ở lại"
  playdate.5006.b.failure: "[ball_kid.GetSheHe|U] vẫn rời đi"
  playdate.5006.c: "Tốt hơn ta nên im lặng."
  playdate.5006.d: ""Ngươi để lại quả bóng. Bây giờ nó là của chúng ta.""

  playdate.5007.t: "Bị Bắt Nạt"
  playdate.5007.desc: "Tiếng cười ầm ĩ vang lên. Ngay bên kia sân, [sad_kid.GetFirstName] co rúm trước [bully_kid.GetFirstName], kẻ đang chỉ tay chế giễu [sad_kid.GetHerHim].\n\n"[sad_kid.GetSheHe|U] thậm chí còn không đá nổi quả bóng! Ai lại muốn làm bạn với cái [sad_kid.Custom2('InsultNoun', SCOPE.sC('bully_kid'))] đó!"\n\n[sad_kid.GetFirstNameNoTooltip], thút thít, nhìn quanh tìm sự giúp đỡ, nhưng dường như chẳng có ai."
  playdate.5007.a: ""Ngươi để [sad_kid.GetHerHim] yên!""
  playdate.5007.a.tt: "Ngươi đứng ra đối đầu với kẻ bắt nạt..."
  playdate.5007.a.success: "Ngươi khiến chúng sợ hãi và rút lui"
  playdate.5007.a.failure: "[bully_kid.GetFirstNameNoTooltip] vạch trần sự liều lĩnh của ngươi và đánh ngươi"
  playdate.5007.b: ""#EMP Ta#! sẽ làm bạn với cậu ấy.""
  playdate.5007.c: "Tốt hơn ta không nên xen vào."

  playdate.5008.t: "Ông Già Cáu Kỉnh"
  playdate.5008.desc: "\"Lũ các ngươi có im lặng nổi không, vì tình yêu đối với [old_timer.GetFaith.HighGodName]?\" [old_timer.GetFirstName] nhoài người ra khỏi khung cửa sổ phía trên, giận dữ vung nắm đấm. \"Đám trẻ ranh các ngươi gây ồn ào quá mức rồi! Ta chẳng thể nghe thấy tiếng suy nghĩ của chính mình nữa!\"\n\nTa nhặt quả bóng lên khi nó lăn tới, nhìn [old_timer.GetWomanMan] già nua đang lầm bầm mắng mỏ phía trên. [old_timer.GetSheHe|U] thực sự là một lão cổ lai hy: có lẽ cũng chừng ba, bốn mươi tuổi đầu!\n\nChẳng trách sao [old_timer.GetSheHe] lại giận dữ đến thế."
  playdate.5008.a: ""Im đi, lão già điên!""
  playdate.5008.b: ""Chúng cháu xin lỗi. Chúng cháu sẽ im lặng hơn.""

  playdate.5009.t: "Bước Chân Dồn Dập"
  playdate.5009.desc: "Dù chúng ta chỉ là trẻ con, bóng đá cũng có thể trở thành một trò chơi cực kỳ thô bạo. Những gì bắt đầu như một trận đấu vui vẻ bỗng biến thành một cuộc hỗn chiến thực sự, và phải mất vài giây ta mới định thần lại được.\n\nKhi làm được điều đó, ta nghe thấy một tiếng kêu the thé vì đau đớn và sợ hãi từ đống trẻ đang đánh nhau. Bị kẹt dưới đáy, ta thấy [small_kid.GetFirstName], đang bị vô số bàn chân giẫm đạp. [small_kid.GetSheHe|U] kêu lên đáng thương, nhưng tiếng ồn quá lớn và những đứa khác quá mải mê với trò chơi."
  playdate.5009.a: ""[small_kid.GetFirstNameNoTooltip]! Cố lên, ta đến đây!""
  playdate.5009.a.critical_success: "Ngươi anh dũng cứu [small_kid.GetHerHim]"
  playdate.5009.a.success: "Ngươi cứu được [small_kid.GetHerHim]"
  playdate.5009.a.failure: "Ngươi phải dùng chính cơ thể mình che chở cho [small_kid.GetHerHis]"
  playdate.5009.b.failure: "[small_kid.GetFirstNameNoTooltip] bị thương khá nặng"
  playdate.5009.b.critfailure: "Vết thương của [small_kid.GetFirstNamePossessiveNoTooltip] thật sự rất kinh khủng"
  playdate_5009_every_child: "Tất cả người tham gia không có tính cách Callous hoặc Sadistic #negative_value nhận stress#!"
  playdate.5009.b: "Ta không thể nhìn tiếp..."
  playdate.5009.c: ""Mọi người, #EMP DỪNG LẠI!#! ""
  playdate.5009.c.success: "Những đứa trẻ đang hỗn loạn lập tức dừng lại"
  playdate.5009.c.failure: "Lời nói của ngươi rơi vào tai điếc"

  playdate.5010.t: "Đó Là [embarrassed_child.Custom('GirlBoy')|U] Của Ta!"
  playdate.5010.desc: ""Bắt nó đi! Đẩy nó vào tường! Đúng rồi!" Giọng của [obnoxious_parent.GetFirstNamePossessive] vang khắp sân. [obnoxious_parent.GetSheHe|U] đứng ở góc để xem [embarrassed_child.GetFirstName] chơi bóng, và rõ ràng thiên vị [embarrassed_child.Custom('GirlBoy')].\n\nPhải nói rằng, [obnoxious_parent.GetFirstNameNoTooltip] đang nghiêm trọng hóa mọi thứ #EMP hơi quá#!.\n\n"Này! Đừng đẩy [embarrassed_child.Custom('HerHim')], đó là gian lận!" Những màn kịch tính của [obnoxious_parent.GetFirstNamePossessiveNoTooltip] bắt đầu khiến ta khó chịu."
  playdate.5010.a: "Tay của [obnoxious_parent.GetHerHis|U] đang vung vẩy khá nhiều..."
  playdate.5010.a_flavor: "Ta sẽ giả vờ rằng [obnoxious_parent.GetFirstNameNoTooltip] đã đánh trúng ta!"
  playdate.5010.a.tt: "Nếu ta giả vờ rằng một cú vung tay lạc đã trúng ta, có lẽ [obnoxious_parent.GetSheHe] sẽ biến đi?"
  playdate.5010.a.tt.success: "Màn diễn của ngươi gây ra phản ứng lớn..."
  playdate.5010.a.success: "Mọi người tụ lại xung quanh trong sự kinh ngạc"
  playdate.5010.a.failure: "Không ai tin ngươi"
  playdate.5010.b: ""Ngươi có thể im lặng được không?!""
  playdate.5010.c: "Ta sẽ cứ chịu đựng vậy."
  scratched_and_bruised: "Trầy Xước Và Bầm Tím"
  scratched_and_bruised_desc: "Đứa trẻ này bị trầy xước và bầm nhẹ, có lẽ do chơi hơi quá mạnh."
  you_perspective_increase_wounds_children_no_death_effect: "Ngươi nhận [GetModifier('scratched_and_bruised').GetNameWithTooltip] hoặc [GetTrait('wounded_1').GetName( GetNullCharacter )]"
  other_perspective_increase_wounds_children_no_death_effect: "[wound_target.GetShortUIName] nhận [GetModifier('scratched_and_bruised').GetNameWithTooltip] hoặc [GetTrait('wounded_1').GetName( GetNullCharacter )]"

  playdate.5011.t: "Quả Báo"
  playdate.5011.desc: "Khi ta đang diễn kịch hết mình trước đám trẻ đang lo lắng xung quanh, đôi mắt của [obnoxious_parent.GetFirstNamePossessive] như muốn lồi ra khỏi hốc mắt.\n\n\"Đồ... #EMP lang băm#! nhỏ mọn!\" [obnoxious_parent.GetSheHe] gầm gừ, chĩa ngón tay phẫn nộ về phía ta. \"Ta sẽ khiến ngươi phải—\"\n\n\"[obnoxious_parent.GetFirstNameNoTooltip]!\" Một tiếng quát giận dữ từ xa vọng lại, đang tiến gần rất nhanh. Khuôn mặt của [obnoxious_parent.GetFirstNamePossessiveNoTooltip] bỗng chốc tái mét khi [responsible_adult.GetFirstName] xông vào sân. \"Chuyện này là thế nào?\"\n\nThật may là ta đã có sự xao lãng này, để chỉ mình [obnoxious_parent.GetFirstNameNoTooltip] thấy được nụ cười đắc ý, tự mãn của ta."
  playdate.5011.a: ""Aaa, đau quá! Aaaaa!""
  playdate.5011.b: "Có lẽ ta nên nói thật..."

  playdate.9001.t:1 "Kết Thúc Niềm Vui"
  playdate.9001.desc:0 "Thật tuyệt khi được quên đi mọi trách nhiệm một lúc và dành thời gian với những đứa trẻ khác, nhưng giờ ta được bảo rằng phải quay lại với bổn phận của mình...\n\nChúng ta đã có rất nhiều niềm vui! Hy vọng chúng ta sẽ sớm làm điều này lần nữa."
  playdate.9001.a:0 "Hẹn gặp lại!"

  playdate.9002.t:1 "Trở Về Nhà"
  playdate.9002.desc:0 "Chúng ta đã có khoảng thời gian thật vui! Ta sẽ còn nhớ những ngày ở cùng [host.GetTitledFirstNamePossessive] rất lâu.\n\nGiờ ta được bảo rằng đã đến lúc thu dọn và trở về nhà với trách nhiệm của mình, nhưng hy vọng chúng ta sẽ sớm gặp lại."
  playdate.9002.a:0 "Tạm biệt [host.GetFirstNameNoTooltip]!"

