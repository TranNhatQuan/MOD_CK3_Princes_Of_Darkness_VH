 ### PHASES
 pilgrimage_phase_solo:0 "Hành hương"
 pilgrimage_phase_solo_desc:0 "Hành hương là chuyến hành trình tâm linh đi sâu vào niềm tin cá nhân. Thành công của một cuộc hành hương được quyết định bởi những lựa chọn trên đường đi cũng nhiều như những lựa chọn tại điểm đến."
 activity_pilgrimage_guest_desc:0 "$BULLET_WITH_TAB$Người tham gia có thể nhận [piety|E]\n$BULLET_WITH_TAB$Người tham gia có thể nhận [legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$Người tham gia có thể giảm [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$Người tham gia có thể nhận [trait|E] [GetTrait('pilgrim').GetName( GetNullCharacter )]"

 ### OPTIONS
 #Type of Pilgrimage [Special Type] Option
 pilgrimage_type_pious:0 "Hành hương sùng đạo"
 pilgrimage_type_pious_desc:1 "$EFFECT_LIST_BULLET$ Một số lựa chọn sự kiện cho phép hành động đặc biệt sùng đạo\n$EFFECT_LIST_BULLET$ Chọn chúng sẽ tăng thêm [piety|E] khi hoàn thành\n\n#weak Mục đích của hành hương là bày tỏ lòng tôn kính với thần linh, để thật sự kết nối với chính bản chất tâm linh của bạn.#!"
 pilgrimage_type_worldly:0 "Hành hương trần thế"
 pilgrimage_type_worldly_desc:1 "$EFFECT_LIST_BULLET$ Một số lựa chọn sự kiện cho phép hành động tham quan\n$EFFECT_LIST_BULLET$ Chọn chúng sẽ nhận modifier đa văn hóa theo bậc khi hoàn thành\n\n#weak Hít thở sự xa lạ ngọt ngào của không khí phương xa, giải mã những nét kỳ quặc của ngôn ngữ lạ — còn gì tuyệt hơn?#!"
 pilgrimage_type_hajj:0 "Hajj"
 pilgrimage_type_hajj_desc:0 "$EFFECT_LIST_BULLET$ Mọi người Hồi giáo có khả năng đều phải thực hiện Hajj ít nhất một lần\n$EFFECT_LIST_BULLET$ Các loại khác mở khóa sau khi có [trait|E] [GetTrait('hajjaj').GetName(GetNullCharacter)]\n\n#weak Hãy nhớ — Hajj không phải nghĩa vụ, mà là cơ hội. Cho sự quy phục, cho khiêm nhường, cho tha thứ. Inshallah!#!"
 #Fidelity Option
 pilgrimage_option_fidelity:0 "Tận tâm"
 pilgrimage_fidelity_obligatory:0 "Bắt buộc"
 pilgrimage_fidelity_obligatory_desc:1 "$EFFECT_LIST_BULLET$ Tốc độ [travel|E] tăng #positive_value 50%#!\n$EFFECT_LIST_BULLET$ Bạn sẽ nhận #EMP ít#! [piety|E] hơn khi hoàn thành\n\n#weak Vâng vâng, sự viên mãn tâm linh, nghĩa vụ đạo đức, số phận linh hồn bất tử của ta, vân vân. Có thể nhanh lên được không?#!"
 pilgrimage_fidelity_pilgrim:0 "Người hành hương"
 pilgrimage_fidelity_pilgrim_desc:0 "$EFFECT_LIST_BULLET$ Tốc độ [travel|E] không thay đổi\n$EFFECT_LIST_BULLET$ Phần thưởng [piety|E] khi hoàn thành không thay đổi\n\n#weak Với trái tim vui vẻ và thiện chí, chúng ta lên đường để chiêm ngưỡng những nơi linh thiêng của thế gian.#!"
 pilgrimage_fidelity_contemplative:0 "Chiêm nghiệm"
 pilgrimage_fidelity_contemplative_desc:1 "$EFFECT_LIST_BULLET$ Tốc độ [travel|E] giảm #negative_value 50%#!\n$EFFECT_LIST_BULLET$ Bạn sẽ nhận nhiều [piety|E] hơn khi hoàn thành\n\n#weak Nếu mục đích của hành hương là suy ngẫm, thì vội vàng để làm gì? Hành trình vốn đã là một nửa ý nghĩa rồi.#!"
#Pomp Option
 pilgrimage_option_pomp:0 "Phô trương"
 pilgrimage_pomp_humble:0 "Khiêm nhường"
 pilgrimage_pomp_humble_desc:1 "$EFFECT_LIST_BULLET$ Không mang theo ai từ [court|E] của bạn, khiến [travel|E] trở nên nguy hiểm\n$EFFECT_LIST_BULLET$ Bạn tham gia đoàn gồm [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_humble_max_value')] người hành hương ngẫu nhiên\n$EFFECT_LIST_BULLET$ Nhận nhiều [piety|E] hơn khi hoàn thành\n\n#weak Hành hương là thời gian để suy ngẫm tĩnh lặng. Một đoàn hành hương bình dân cùng những người xa lạ là nơi thích hợp nhất cho điều đó.#!"
 pilgrimage_pomp_appropriate:0 "Phù hợp"
 pilgrimage_pomp_appropriate_desc:0 "$EFFECT_LIST_BULLET$ Bạn mang theo vệ sĩ hoặc hiệp sĩ giỏi, và có lẽ một người bạn\n$EFFECT_LIST_BULLET$ Tối đa [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_appropriate_max_value')] người hành hương ngẫu nhiên tham gia đoàn\n$EFFECT_LIST_BULLET$ Phần thưởng [piety|E] khi hoàn thành không thay đổi\n\n#weak Con đường nguy hiểm và hành trình dài. Sự thuần khiết tâm linh là một chuyện, hành động liều lĩnh lại là chuyện khác.#!"
 pilgrimage_pomp_ceremonial:0 "Nghi lễ"
 pilgrimage_pomp_ceremonial_desc:0 "$EFFECT_LIST_BULLET$ Bạn #EMP còn#! mang theo tùy tùng và tín đồ sùng đạo\n$EFFECT_LIST_BULLET$ Tối đa [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_ceremonial_max_value')] người hành hương ngẫu nhiên tham gia đoàn\n$EFFECT_LIST_BULLET$ Nhận nhiều [piety|E] hơn khi hoàn thành\n\n#weak Đức tin đòi hỏi sự trang nghiêm, ngay cả khi xa nhà. Và làm sao trang nghiêm nếu không có người theo cùng?#!"
 pilgrimage_pomp_throng:0 "Đoàn đông"
 pilgrimage_pomp_throng_desc:0 "$EFFECT_LIST_BULLET$ Mọi [character|E] tại [court|E] quan tâm đều đi cùng bạn\n$EFFECT_LIST_BULLET$ Tối đa [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_throng_max_value')] người hành hương ngẫu nhiên tham gia đoàn\n$EFFECT_LIST_BULLET$ Nhận nhiều [piety|E] hơn nữa khi hoàn thành\n\n#weak Tất cả tín đồ đều nên thấy những nơi linh thiêng của chúng ta... và ta dự định giúp họ làm điều đó.#!"
 

