 activity_pilgrimage_selection_tooltip:1 "Thực hiện một [pilgrimage|E] để chứng minh lòng tận tâm của ngươi với [GetPlayer.GetFaith.PantheonTerm]\n\nPhần thưởng dự kiến:\n$BULLET_WITH_TAB$[piety_i] [piety|E] nhận được\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E] nhận được\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]"
