 # Tour Church
 pilgrimage.1120.t:0 "$pilgrimage_header$ Kiến Trúc [temple_province.GetCounty.GetFaith.GetReligion.GetAdjectiveNoTooltip]"
 pilgrimage.1120.desc:0 "Đi qua [temple_province.GetTitle.GetDeJureLiege.GetNameNoTooltip], chúng ta tranh thủ ghé thăm [ROOT.Char.GetFaith.HouseOfWorship] tại [temple_province.GetName], một trung tâm quyền lực và thờ phụng [temple_province.GetCounty.GetFaith.GetAdjective] của vùng [temple_liege.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\n[temple_person.GetName], một [temple_person.GetFaith.PriestNeuter] địa phương, dẫn chúng ta tham quan khu đất và các tòa nhà. [temple_person.GetSheHe|U] kể lại lịch sử và chỉ ra các tác phẩm nghệ thuật do những [temple_province.GetCounty.GetFaith.DevoteeNeuterPlural] địa phương tạo ra, những người hiện đang tụ tập cầu nguyện giữa ngày."
 pilgrimage.1120.a:0 "Điều này cho ta một ý tưởng..."
 pilgrimage.1120.b:0 "Đây #EMP chính là#! thứ chúng ta cần ở [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 pilgrimage.1120.c:0 "Thật là cái cớ tồi tệ cho một [ROOT.Char.GetFaith.HouseOfWorship]."
 pilgrimage.1120.d:0 "Được rồi, thế là đủ, cảm ơn."
 pilgrimage.1120.e:0 "Ta sẽ tham gia cầu nguyện với [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.1120.f:0 "Đây #EMP chính là#! thứ chúng ta cần ở [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 # Roadside Shrine
 pilgrimage.1130.t:0 "$pilgrimage_header$ Miếu Bên Đường"
 pilgrimage.1130.desc:0 "Tại một ngã rẽ trên con đường ngay ngoài [shrine_province.GetName], một ngôi miếu [shrine_province.GetCounty.GetFaith.GetAdjective] hiu quạnh mang dấu [shrine_province.GetCounty.GetFaith.ReligiousSymbol] đứng giữa [shrine_province.Custom('GetProvinceGroundDesc')].\n\nMột hốc nhỏ che chở những lễ vật giản dị do khách lữ hành và dân địa phương để lại, xung quanh là tàn tích của vô số ngọn nến đã tắt."
 pilgrimage.1130.both:0 "\n\n[shrine_faithist.GetName] — [ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)] của ta — cúi đầu trước ngôi đền trong khi [shrine_mocker.GetName] — [ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)] của ta — đảo mắt của [shrine_mocker.GetHerHis], tặc lưỡi thật lớn."
 pilgrimage.1130.faithist:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)] của ta, [shrine_faithist.GetName], dừng lại cúi đầu trước ngôi miếu và đặt thêm một lễ vật nhỏ của [shrine_faithist.GetHerHis] vào đó."
 pilgrimage.1130.mocker:0 "\n\n[ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)] của ta, [shrine_mocker.GetName], khịt mũi trước cảnh tượng ấy, lẩm bẩm về [shrine_mocker.GetFaith.NegativeAfterLife]."
 pilgrimage.1130.a:0 "Ta có thể bỏ ra chút ít."
 pilgrimage.1130.b:0 "Ta không phiền nếu lấy chút..."
 pilgrimage.1130.b.flavor:0 "Dù sao với ta cũng hữu dụng hơn!"
 every_root_faith_entourage_member_tt:0 "Mọi thành viên tùy tùng theo [shrine_visitor.GetFaith.GetAdjective]"
 every_province_faith_entourage_member_tt:0 "Mọi thành viên tùy tùng theo [shrine_province.GetCounty.GetFaith.GetAdjective]"
 every_zealous_root_faith_entourage_member_tt:0 "Mọi thành viên tùy tùng [GetTrait('zealous').GetName( GetNullCharacter )] theo [shrine_visitor.GetFaith.GetAdjective]"
 pilgrimage.1130.c:0 "Phá bỏ sự ngu muội [shrine_province.GetCounty.GetFaith.GetAdjectiveNoTooltip] này!"
 pilgrimage.1130.c.flavor:0 "Cho chúng biết tay!"
 pilgrimage.1130.d:0 "[shrine_faithist.GetFaith.HighGodName] sẽ chẳng nhận được thứ đó đâu."
 pilgrimage.1130.d.flavor:0 "Vì [shrine_faithist.GetFaith.HighGodName] vốn không tồn tại!"
 pilgrimage.1130.e:0 "Câm miệng lại, [ROOT.Char.Custom2('GetUnbelieverTerm', shrine_mocker)]."
 pilgrimage.1130.f:0 "Đi thôi, đừng chần chừ nữa."
 pilgrimage.1130.f.other:0 "[ROOT.Char.GetFaith.HighGodName] không chờ đợi bất kỳ [shrine_province.GetCounty.GetFaith.GetAdherentNameNoTooltip] nào."
 # Strength in Numbers
 pilgrimage.1140.t:0 "$pilgrimage_header$ Đông Người An Toàn"
 pilgrimage.1140.desc:0 "Khi chúng ta đi qua [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], một thường dân [group_leader.GetCulture.GetName] tiến đến, tự xưng là thủ lĩnh của một nhóm người hành hương [ROOT.Char.GetFaith.GetAdjective].\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], chúng tôi đã lên đường tới [destination.GetName] suốt nhiều tuần, nhưng con đường quá nguy hiểm, mà giờ lương thực cũng sắp cạn."\n\n"Nếu ngài giúp đỡ, chúng tôi sẽ vô cùng biết ơn.""
 pilgrimage.1140.a:0 "Càng đông càng vui!"
 pilgrimage.1140.a.tt:1 "[group_leader.GetFirstName] và tối đa ba người khác sẽ tham gia [ROOT.Char.GetInvolvedActivity.GetName] của bạn"
 pilgrimage.1140.b:0 "[group_leader.GetCulture.GetNameNoTooltip]? Không đời nào."
 pilgrimage.1140.b.flavor:0 "Đừng bao giờ tin một kẻ [group_leader.GetCulture.GetNameNoTooltip]."
 pilgrimage.1140.c:0 "Cầm ít tiền này đi."
 pilgrimage.1140.d:0 "Không đời nào, đồ nông dân."
 pilgrimage.1140.d.flavor:0 "Cút đi!"
 grateful_pilgrims_title:0 "Những Người Hành Hương Biết Ơn"
 cultural_acceptance_rejected_pilgrims:0 "Những Người Hành Hương Bị Khước Từ"
 #Heathen-hating adherent challenges you
 pilgrimage.2002.t:0 "$pilgrimage_header$ Hãy Yêu Thương Đồng Loại"
 pilgrimage.2002.desc:1 "Trong số những người hành hương cùng ta có một [heathen_hater.GetWomanMan] rao giảng lòng trắc ẩn và tình huynh đệ — cho đến khi [heathen_hater.GetSheHe] nhắc tới [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')].\n\nMột buổi tối bên đống lửa trại, [heathen_hater.GetSheHe] lớn tiếng tuyên bố rằng chúng là "những con quái vật ghê tởm trong mắt [ROOT.Char.GetFaith.PantheonTerm]! Kẻ dị giáo và sát hại trẻ em!" Hầu hết mọi người đều tránh ánh mắt khi [heathen_hater.GetSheHe] nhìn họ. Nhưng tối nay ta không kịp quay đi. "Ngài chẳng đồng ý sao, hỡi [ROOT.Char.GetTitleAsNameNoTooltip]?""
 pilgrimage.2002.a:0 "Không phải #EMP tất cả#! bọn họ đều tệ như vậy."
 pilgrimage.2002.b:0 "Ta đồng ý, và ta cũng không tin kẻ nào dám bênh vực chúng!"
 pilgrimage.2002.c:0 "Đúng vậy! Chúng khạc nhổ vào mặt [ROOT.Char.GetFaith.HighGodName]!"
 #Companions are running low
 pilgrimage.2003.t:1 "$pilgrimage_header$ Vấn Đề An Toàn"
 pilgrimage.2003.desc:1 "Dạo gần đây ta cứ có cảm giác bất an. Cuộc hành hương này nguy hiểm hơn ta dự liệu — hoặc có lẽ ta vẫn chưa chịu đủ thử thách để chứng tỏ mình xứng đáng với sự che chở của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive].\n\nTuy vậy ta #EMP đã#! để ý thấy vài người khá ấn tượng tại khu định cư địa phương ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]; họ chắc chắn có thể cải thiện sự an toàn của chuyến hành hương — theo cách rất thực tế."
 pilgrimage.2003.a:1 "Ta nên thuê vài người cho chuyến hành hương."
 pilgrimage.2003.b:1 "[2002_local_warrior.GetTitledFirstNameNoTooltip] trông là một nhân vật đáng gờm."
 pilgrimage.2003.c:0 "Không. Ta tin vào [ROOT.Char.GetFaith.PantheonTerm]."
 #Run into a Potential Friend
 pilgrimage.2004.t:0 "$pilgrimage_header$ Cuộc Gặp Gỡ Bất Ngờ"
 pilgrimage.2004.desc:1 "Khi ta tiến gần hơn tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], ta gặp ngày càng nhiều người hành hương từ khắp nơi.\n\nMột trong số họ nhận ra ta từ xa: "[ROOT.Char.GetTitledFirstNameNoTooltip]?! Là ngươi sao?"\n\nKhông ai khác ngoài [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 pilgrimage.2004.a:0 "Chúng ta được [ROOT.Char.GetFaith.PantheonTerm] đưa đến với nhau!"
 pilgrimage.2004.b:0 "Một cuộc gặp tốt lành, nhưng ta phải cầu nguyện trong cô tịch."
 #A peasant inadvertedly insults you
 pilgrimage.2005.t:0 "$pilgrimage_header$ Câu Chuyện Thô Lỗ"
 pilgrimage.2005.desc:3 "Khi đi ngang qua đống lửa trại, một người hành hương từ đoàn khác đang kể một câu chuyện mà [rude_pilgrim.GetSheHe] từng nghe về [ROOT.Char.GetTitleAsNameNoTooltip]"
 pilgrimage.2005.desc_close:1 "của vùng đất này,"
 pilgrimage.2005.desc_far:2 "ở một nơi xa xôi gọi là [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 pilgrimage.2005.outro:0 "trước những tràng cười ầm ĩ.\n\nKhi [rude_pilgrim.GetSheHe] nhận thấy sự do dự của ta, người kể chuyện nhìn ta đầy trấn an: \"Đừng lo, [ROOT.Char.Custom('FormOfAddressForLiege')] — điều này chắc chắn là về một quý tộc #EMP khác#! cao sang quyền quý nào đó!\""
 pilgrimage.2005.a:0 ""Thật sao? Hãy kể ta nghe thêm về [ROOT.Char.GetTitleAsNameNoTooltip] này.""
 pilgrimage.2005.a.flavor:0 "Ta ngồi xuống bên đống lửa."
 pilgrimage.2005.b:0 ""Lính đâu! Mang roi của ta đến.""
 pilgrimage.2005.c:0 "Có lẽ ta nên tìm người khác cùng đồng hành."
 #You have gotten lost
 pilgrimage.2006.t:1 "$pilgrimage_header$ Con Đường Phong Cảnh"
 pilgrimage.2006.intro:1 "Hành trình tâm linh đã dừng lại theo đúng nghĩa đen."
 pilgrimage.2006.desc_alone:0 "Ta căng mắt nhìn quanh, cố nhận ra con đường phía trước — nhưng chẳng ra được gì — và bắt đầu hơi lo lắng. Nó #EMP vốn là#!\n\nhướng này, phải không... ? Ta do dự nhìn sang một nông dân địa phương đang làm việc vặt ở phía trước một đoạn."
 pilgrimage.2006.desc_travel_leader:1 "$travel_leader_court_position$ của ta, [caravan_master.GetTitledFirstName], đang nhìn quanh, cuống cuồng tìm con đường phía trước, và mọi người bắt đầu chú ý.\n\nGương mặt [caravan_master.GetTitledFirstNamePossessiveNoTooltip] chuyển sang tái xám khi [caravan_master.GetSheHe] quay ánh nhìn [caravan_master.GetHerHis] về phía ta, tìm câu trả lời xem nên làm gì tiếp theo."
 pilgrimage.2006.a:1 "Ta biết đường tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] như lòng bàn tay!"
 pilgrimage.2006.a_pious:0 "Chúng ta sẽ để [ROOT.Char.GetFaith.HighGodNameAlternate] dẫn đường."
 pilgrimage.2006.b:1 "Hãy tận hưởng tạo vật của [ROOT.Char.GetFaith.CreatorNamePossessive] thêm một lúc nữa."
 pilgrimage.2006.b_cynical:0 "Dù sao cũng chưa phải tận thế."
 pilgrimage.2006.c:0 "Có lẽ ta có thể hỏi người địa phương đường đi..."
 pilgrimage.2006.c_caravan_master:0 "Giờ thì #EMP ngươi#! đi hỏi đường."
 #Fall ill
 pilgrimage.2008.t:0 "$pilgrimage_header$ Bệnh Tật"
 pilgrimage.2008.desc:1 "Có vẻ ta không thích nghi tốt với việc di chuyển liên tục thế này. Có lẽ là những vùng đất xa lạ với bầu không khí khác thường, hoặc đơn giản là ta không hợp với thời tiết nơi đây.\n\nDù sao đi nữa, cơn ho của ta đã kéo dài nhiều tuần, và sáng nay ta gần như không đủ sức để rời khỏi giường."
 pilgrimage.2008.a:1 "Nếu đó là ý chí của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
 pilgrimage.2008.a.tt:0 "Di chuyển khi đang [GetTrait('ill').GetName( GetPlayer )] sẽ gây rủi ro sức khỏe lớn hơn"
 pilgrimage.2008.whole_of_body:0 "Ồ, cơn ho nhỏ này sẽ nhanh chóng qua thôi."
 pilgrimage.2008.court_physician:0 "[traveling_court_physician.GetTitledFirstNameNoTooltip|U], hãy pha cho ta thứ gì đó."
 #Develop pneumonia
 pilgrimage.2009.t:0 "$pilgrimage_header$ Cơn Ho Khò Khè"
 pilgrimage.2009.desc:0 "Chuyến hành trình này không tốt cho ta. Sức khỏe của ta không hề khá lên trong hành trình tìm kiếm ân sủng của [ROOT.Char.GetFaith.PantheonTerm]. Nó còn tệ hơn rất nhiều. Ta thậm chí không còn nhớ cảm giác hít thở mà không phải gắng sức."
 pilgrimage.2009.a:1 "Cầu mong [ROOT.Char.GetFaith.HighGodNameAlternate] thương xót."
 pilgrimage.2009.a.tt:0 "Di chuyển khi đang [GetTrait('pneumonic').GetName( GetPlayer )] gây nguy hiểm nghiêm trọng cho sức khỏe"
 #Meet a mystic
 pilgrimage.2010.t:0 "$pilgrimage_header$ Nhà Thần Bí"
 pilgrimage.2010.desc:1 "[2010_mystic.GetTitledFirstName] là một trong những người kỳ lạ nhất mà ta gặp trong hành trình này. [2010_mystic.GetSheHe|U] dường như là một tín đồ rất mộ đạo, nhưng cũng giảng giải về bản chất thật sự của [ROOT.Char.GetFaith.HighGodName] và ý nghĩa của tất cả điều đó. Ban đêm, lều của [2010_mystic.GetHerHis] sáng lên bởi ánh nến bên trong, và đôi khi những tiếng tụng niệm kỳ lạ cùng hương khói khác thường tỏa ra từ đó.\n\nTa hoàn toàn không chuẩn bị khi [2010_mystic.GetFirstNameNoTooltip] mời ta bước vào."
 pilgrimage.2010.a:0 "Ta khá tò mò..."
 pilgrimage.2010.a.tt:0 "Ngươi bước vào lều"
 pilgrimage.2010.b:0 "Không cảm ơn, chuyện này có mùi dị giáo đối với ta!"
 #The Mystic has a lot to say about your faith
 pilgrimage.2011.desc:1 "Bên trong lều của [2010_mystic.GetTitledFirstNamePossessive], ta được chào đón bởi mùi hương nồng nặc và bầu không khí nóng bức nặng nề. "Điều quan trọng là chúng ta phải hướng ánh nhìn vào chính mình," [2010_mystic.GetSheHe] giải thích rồi ngồi xuống.\n\n"Ta muốn ngươi nhắm mắt lại và tập trung, như ta. Hãy để [ROOT.Char.GetFaith.PantheonTerm] chảy qua ngươi. Hãy vươn tới sự xuất thần của thần tính!""
 pilgrimage.2011.a:0 "Đúng vậy! Ta có thể cảm nhận được sự kết nối với [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 pilgrimage.2011.a.tt:0 "Ngươi trải nghiệm sự xuất thần thần thánh"
 pilgrimage.2011.b:0 "Thoải mái quá, ta có thể ngủ mất..."
 pilgrimage.2011.b.tt:0 "Ngươi có một giấc ngủ dễ chịu"
 pilgrimage.2011.c:0 "Nói ta nghe, chuyện này liên quan gì đến [ROOT.Char.GetFaith.HighGodName]?"
 pilgrimage.2011.c.tt:0 "Ngươi tranh luận với nhà thần bí"
 #Fallback in case something happened in between events
 pilgrimage.2012.desc:1 "Ta không nhớ rõ chuyện gì đã xảy ra sau khi bước vào lều của nhà thần bí. Tất cả những gì ta nhớ chỉ là vài hình ảnh mơ hồ và cảm giác choáng váng.\n\nGiờ đây ta tự hỏi liệu [2010_mystic.GetSheHe] có từng ở đây hay không..."
 pilgrimage.2012.a:1 "[2010_mystic.GetSheHe|U] có rất nhiều ý tưởng kỳ lạ."
 #Outcome of engaging
 pilgrimage.2013.desc:1 "Sau khi làm theo chỉ dẫn của [2010_mystic.GetTitledFirstNamePossessive], ta có thể nhìn thấy mọi thứ rõ ràng hơn nhiều. Ta có thể #EMP cảm nhận#! nó. [ROOT.Char.GetFaith.PantheonTerm|U], thế giới, tất cả đang chảy qua cơ thể ta. Qua linh hồn ta.\n\nKhi ta bước ra khỏi lều nhiều giờ sau đó, ta có một sự thấu hiểu mới về bản thân và về cuộc sống."
 pilgrimage.2013.a:0 "Trước đây ta mù quáng, còn giờ ta đã thấy."
 #Outcome of sleeping
 pilgrimage.2014.desc:1 "Khi ta tỉnh dậy sau khi ngủ quên trong lều của [2010_mystic.GetTitledFirstNamePossessive], chính cái lều đó đã biến mất. Người hầu của ta đang lay ta dậy khỏi tấm chiếu nơi ta ngủ, nhưng không còn dấu vết nào của nhà thần bí.\n\nÍt nhất giấc ngủ này cũng khá sảng khoái!"
 pilgrimage.2014.a:0 "Sao túi tiền của ta lại nhẹ đi kỳ lạ vậy?"
 pilgrimage.2014.pilfered.t:0 "Bị Lấy Trộm"
 pilgrimage.2014.pilfered.desc:0 "Ai đó đã động vào đồ đạc của ngươi"
 pilgrimage.2014.restful.t:0 "Nghỉ Ngơi Tốt"
 pilgrimage.2014.restful.desc:0 "Ngươi ngủ yên bình"
 pilgrimage.2014.a_restful:0 "Đó là một giấc ngủ ngon."
 #Outcome of debating
 pilgrimage.2015.desc:1 "Ta sẽ thành thật, ta chưa bao giờ mong đợi [2010_mystic.GetTitledFirstName] có thể trả lời cho những hành vi kỳ lạ của [2010_mystic.GetHerHis] tốt như [2010_mystic.GetSheHe] đã làm.\n\nTa vẫn còn nghi ngờ về... bất cứ điều gì mà [2010_mystic.GetSheHe] đang làm, nhưng ta chắc chắn đã có thêm một số góc nhìn mới mẻ để xem xét!"
 pilgrimage.2015.a:0 "Làm #EMP thế nào#! để ngươi tiến gần hơn tới [ROOT.Char.GetFaith.PantheonTerm]?"
 pilgrimage.2015.learning.t:0 "Học Thức Tăng"
 pilgrimage.2015.learning.desc:0 "Ngươi học được điều gì đó từ cuộc tranh luận với nhà thần bí"
 pilgrimage.2015.piety.t:0 "Nhận Được Đức Tin"
 pilgrimage.2015.piety.desc:0 "Ngươi nhận được đức tin khi tranh luận về niềm tin của mình"
 #Pilgrimage thieves
 pilgrimage.2020.t:0 "$pilgrimage_header$ Kẻ Trộm"
 pilgrimage.2020.desc:0 "Ta choàng tỉnh khỏi giấc ngủ khi có kẻ trong trại làm đổ một cái chảo sắt. Khi ta nhìn quanh, dường như có hai kẻ ăn mặc như người hành hương đang lục lọi vật tư của chúng ta để tìm đồ quý giá mà trộm."
 pilgrimage.2020.desc_adult:0 "\n\nMột kẻ thấy ta cựa mình thì đứng sững lại, trong khi tên trộm còn lại quay đầu bỏ chạy."
 pilgrimage.2020.desc_child:0 "\n\nKẻ nhỏ hơn trong hai đứa, trông như một đứa trẻ khốn khổ, thấy ta cựa mình thì đứng sững lại trong khi tên trộm còn lại quay đầu bỏ chạy."
 pilgrimage.2020.a:0 "Ngươi nên đi cùng chúng ta tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 pilgrimage.2020.a_child:0 "Lại đây ngồi bên lửa đi, nhóc."
 pilgrimage.2020.a.flavor:0 "[thief_to_convert.GetSheHe|U] rõ ràng là một kẻ đáng thương."
 pilgrimage.2020.b:0 "Đây không phải cuộc sống mà [ROOT.Char.GetFaith.HighGodName] muốn cho ngươi."
 pilgrimage.2020.b.success.desc:0 "Ngươi thuyết phục được đứa trẻ"
 pilgrimage.2020.b.success.tt:0 "Đứa trẻ sẽ cần được chỉ dẫn thêm"
 pilgrimage.2020.b.failure.t:0 "Những Kẻ Trộm Bỏ Chạy"
 pilgrimage.2020.b.failure.desc:0 "Ngươi không thuyết phục được đứa trẻ"
 pilgrimage.2020.c:0 "Ai cũng phải làm điều mình buộc phải làm."
 pilgrimage.2020.c_cynical:0 "Vậy ra #EMP đây#! là ý chí của [ROOT.Char.GetFaith.HighGodNamePossessive], hử."
 pilgrimage.2020.c.flavor:0 "Ta là ai mà can thiệp vào kế hoạch của [ROOT.Char.GetFaith.HighGodNamePossessive]."
 #Pilgrimage thief wants to repent
 pilgrimage.2021.t:0 "$pilgrimage_header$ Sám Hối"
 pilgrimage.2021.desc:0 "Ta đã thuyết phục thành công [thief_to_convert.GetTitledFirstName] thay đổi cách sống của [thief_to_convert.GetHerHis]. [thief_to_convert.GetSheHe|U] đứng trước mặt ta, sức nặng của nỗi xấu hổ của [thief_to_convert.GetHerHis] làm cho đôi vai của [thief_to_convert.GetHerHis] chùng xuống, khi [thief_to_convert.GetSheHe] tránh ánh mắt của ta.\n\n\"Đó không phải là lựa chọn của con, cuộc sống này,\" [thief_to_convert.GetFirstNameNoTooltip] nói chậm rãi. \"Con nên làm gì để sám hối tội lỗi của mình?\""
 pilgrimage.2021.a:0 "Hãy truyền bá lời dạy của [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
 pilgrimage.2021.b:0 "Tự trừng phạt bản thân luôn khiến #EMP ta#! thấy khá hơn..."
 pilgrimage.2021.c:0 "Lao động chăm chỉ giải quyết mọi thứ."
 pilgrimage.2021.c.flavor:0 "[thief_to_convert.GetSheHe|U] sẽ làm việc để trả giá cho tội lỗi của [thief_to_convert.GetHerHis] cho #EMP ta#!."
 #Sea: Encounter a massive rainbow
 pilgrimage.2030.t:0 "$pilgrimage_header$ Hiện Tượng Thời Tiết"
 pilgrimage.2030.desc:0 "Khi băng qua biển hướng tới điểm đến tại [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], ta không ngừng kinh ngạc trước sự bao la của nó và những thất thường [ROOT.Char.Custom('GetWickedDangerous')].\n\nSau khi vừa vượt qua cơn bão tối qua, sáng nay chúng ta được chào đón bằng một cầu vồng rực rỡ, kéo dài từ chân trời này sang chân trời khác.\n\nTa nghe vài người hành hương khác cũng bàn luận về sự hùng vĩ của cảnh tượng ấy, gọi đó là #EMP thần thánh#! và #EMP dấu hiệu từ [ROOT.Char.GetFaith.HighGodName]#!."
 pilgrimage.2030.a:0 "#EMP Thực ra...#!"
 pilgrimage.2030.a.flavor:0 "Thần linh có thể tạo ra mưa, nhưng cầu vồng trước hết vẫn là một hiện tượng thời tiết."
 pilgrimage.2030.b:0 "Đúng vậy! Hãy cảm nhận sự hiện diện của [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.2030.b.flavor:0 "Thứ đẹp đẽ thế này chắc chắn #EMP phải#! mang tính thần thánh!"
 pilgrimage.2030.c:0 "Thật thú vị khi thiên nhiên và thần linh cùng vận hành."
 pilgrimage.2030.d:0 "Quả thật #EMP cũng#! khá ấn tượng."
 #Sea: Go fish
 pilgrimage.2040.t:0 "$pilgrimage_header$ Đi Câu Cá"
 pilgrimage.2040.desc:0 "Khi chúng ta trải qua ngày đêm trên con tàu này, ta cố lấp đầy thời gian bằng những cuộc trò chuyện thú vị, lời cầu nguyện, suy ngẫm về hành trình hoặc đơn giản là lên kế hoạch cho chặng đường phía trước.\n\nTuy nhiên gần đây ta thấy vài người hành hương trong đoàn của ta dành thời gian cho một việc khá tầm thường khác — câu cá.\n\nTrông họ rất vô tư và bản thân hoạt động ấy cũng mang lại cảm giác thư thái."
 pilgrimage.2040.a:0 "Ta tham gia!"
 pilgrimage.2040.a.flavor:0 "Làm một ngư phủ[ROOT.Char.GetWomanMan] dù sao cũng là nghề mộc mạc đáng kính."
 pilgrimage.2040.a.success.t:0 "Cá Lớn"
 pilgrimage.2040.a.success.desc:0 "Ngươi bắt được một con cá lớn"
 pilgrimage.2040.a.less_success.t:0 "Cá Nhỏ"
 pilgrimage.2040.a.less_success.desc:0 "Ngươi bắt được một con cá nhỏ"
 pilgrimage.2040.b:0 "#EMP Lũ phàm tục.#! Ta nên dành thời gian cầu nguyện thì hơn."
 pilgrimage.2040.c:0 "Hay là ngủ một giấc?"
 pilgrimage.2040.d:0 "Không, làm việc khác thôi."
 #Sea: Shipwrecked pilgrims
 pilgrimage.2050.t:0 "$pilgrimage_header$ Dạt Vào Bờ"
 pilgrimage.2050.desc:0 "Ngay trước khi hoàng hôn buông xuống, chúng ta nghe thấy tiếng kêu cứu. Khi ta nhìn qua lan can ra vùng biển rộng lớn, ta thấy một chiếc thuyền nhỏ với ba bóng người.\n\nHọ dường như đang trôi dạt trên biển, mặc cho sóng đưa đẩy.\n\nTa cố nhìn rõ họ là ai, và theo hiểu biết hạn chế của ta thì họ trông giống như những người bị đắm tàu... [first_pilgrim.GetCulture.GetCollectiveNounNoTooltip]? Họ đang làm gì ngoài này vậy?"
 pilgrimage.2050.a:0 "Lên tàu đi!"
 pilgrimage.2050.a.tt:0 "Ngươi thả những người hành hương xuống bờ gần nhất"
 pilgrimage.2050.b:0 "Các ngươi đã nghe về ân sủng của [ROOT.Char.GetFaith.HighGodName] chưa?"
 pilgrimage.2050.b.success.t:0 "Cải Đạo"
 pilgrimage.2050.b.success.desc:0 "Ngươi cải đạo những người hành hương sang [ROOT.Char.GetFaith.GetNameNoTooltip]"
 pilgrimage.2050.b.failure.t:0 "Không Bị Thuyết Phục"
 pilgrimage.2050.b.failure.desc:0 "Những người hành hương không bị thuyết phục, nhưng ngươi vẫn giúp họ vào bờ"
 pilgrimage.2050.c:0 "Cứ... đi tiếp thôi."

 ###BP1 Events
 #Sneaking off to a tavern with your pal
  pilgrimage.6001.t:0 "Càng đông càng vui"
  pilgrimage.6001.desc:1 "Ta đang lê bước trong đoàn hành hương dài dằng dặc hướng tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], vừa đi vừa nghĩ về những tiện nghi ta đã bỏ lại ở [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] thì nghe thấy ai đó gọi to tên ta từ phía sau.\n\nBạn ta [friend.GetFirstNameNoTooltip] chạy tới và kêu lên: \"[ROOT.Char.GetTitledFirstNameNoTooltip]! Thật may mắn khi chúng ta cùng hướng tới đúng một thánh địa! Ngươi có muốn có người bầu bạn trên con đường dài và cô quạnh tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] không?\""
  pilgrimage.6001.a:0 "Ta luôn sẵn lòng lắng nghe một người bạn."
  pilgrimage.6001.b:0 "Ta nghĩ ta thích đi một mình hơn, cảm ơn."
  pilgrimage.6001.c:0 "Thật đáng xấu hổ. Chúng ta ở đây để tập trung vào đức tin!"
 #Tavern, Suggestion
  pilgrimage.6002.desc: "[friend.GetFirstNameNoTooltip|U] và ta dành phần còn lại của ngày hành trình để trò chuyện về chuyện này chuyện kia, những âm mưu và trò đùa, những trận chiến và người tình, bạn cũ và bạn mới. Chúng ta đang ở giữa một cuộc trò chuyện hấp dẫn thì một tiếng hét mệt mỏi vang lên từ phía đầu đoàn người: \"Chúng ta dựng trại ở đây!\"\n\n[friend.GetFirstNameNoTooltip|U] nhìn ta với một nụ cười tinh quái trên khuôn mặt của [friend.GetHerHis] và nói, \"Cuối cùng thì cũng tới! Tuy nhiên, làm một chuyến đi vòng ngắn trước khi dựng trại thì sao? Một ngày hành trình dài có thể làm cho một [friend.GetWomanMan] cảm thấy khát...\""
  pilgrimage.6002.a:0 "Một chút đồ uống nghe thật tuyệt!"
  pilgrimage.6002.a_tt:0 "Ghé thăm quán rượu địa phương"
  pilgrimage.6002.b:1 "Ngươi cứ đi trước đi..."
  pilgrimage.6002.b_tt:0 "Ngươi tiếp tục hành trình của mình"
  pilgrimage.6002.c:1 "[ROOT.Char.Custom('GetHeathenMiscreant')] nào lại ghé quán rượu khi đang hành hương?"
 #Tavern, beginning
  pilgrimage.6003.desc:0 "Chúng ta bước vào quán rượu chật kín người và [friend.GetFirstNameNoTooltip] lập tức gọi hai cốc [ROOT.Char.Custom('RegionalDrink')]. Chúng ta ngồi nghe một người hát rong kể chuyện và thưởng thức đồ uống, thỉnh thoảng trò chuyện về những nỗi khổ và chiến thắng trong đời.\n\nNhân danh [ROOT.Char.GetFaith.HighGodName], thật sảng khoái sau một ngày dài đổ mồ hôi và vất vả trên đường. Ta nâng cốc và hô lớn: \"Xin chúc sức khỏe người bạn của ta, [friend.GetFirstNamePossessiveNoTooltip], vì đã đề nghị một chỗ nghỉ ngơi tuyệt vời sau hành trình hôm nay!\"\n\nCả quán nâng cốc chúc mừng người bạn tuyệt vời của ta và mọi người uống cạn."
  pilgrimage.6003.a:0 "\"Vòng tiếp theo ta mời!\""
  pilgrimage.6003.a_tt:0 "Tiếp tục vui vẻ cùng [friend.GetShortUIName]"
  pilgrimage.6003.b:0 "Chúng ta nên quay lại trại, kẻo mọi người tìm."
  pilgrimage.6003.b.tt:1 "Ngươi và [friend.GetFirstNameNoTooltip] kết thúc đêm vui và quay lại trại"
 #Tavern, crash
  pilgrimage.6004.desc:0 "Sau có lẽ vài vòng [ROOT.Char.Custom('RegionalDrink')] quá đà, [friend.GetFirstNameNoTooltip] và ta khuyến khích những người trong quán cùng hát vang những bài ca uống rượu, vừa gõ nhịp lên mặt bàn.\n\nVới một tiếng #EMP rầm#! và nhiều mảnh gỗ vỡ hơn ta muốn đếm, chúng ta rơi xuyên qua sàn nhà xuống hầm rượu, dũng cảm phiêu lưu tới nơi mà ít [ROOT.Char.GetWomenMen] từng đặt chân.\n\nNhững người đang vui vẻ phía trên nhìn xuống chúng ta từ sàn chính với cảm xúc lẫn lộn giữa lo lắng và khoái chí. Rõ ràng họ đang chờ một báo cáo từ hầm rượu."
  pilgrimage.6004.a:0 "\"[ROOT.Char.Custom('RegionalDrink')|U] cho tất cả mọi người!\""
  pilgrimage.6004.a.tt:1 "Ngươi mở các thùng rượu vừa lộ ra và chia chiến lợi phẩm với đám đông"
  pilgrimage.6004.b:0 "\"Ta nghĩ chúng ta đã ở đây quá lâu rồi...\""
 #Returning to camp
  pilgrimage.6005.desc:0 "Chúng ta không mấy yên lặng quay trở lại trại, thành tâm cầu nguyện rằng mọi người đã đi ngủ từ lâu. Khi đến gần lều của mình, chúng ta thấy ngọn lửa vẫn còn cháy "
  pilgrimage.6005.desc.bad:1 "và mọi thành viên trong đoàn hành hương đều quay sang nhìn chằm chằm vào chúng ta.\n\nChúng ta khó lòng giữ được bình tĩnh với lượng lớn [ROOT.Char.Custom('RegionalDrink')] trong bụng.\n\nKhi chúng ta kể lại cuộc phiêu lưu buổi tối cho bất cứ ai chịu nghe, một thành viên đặc biệt sùng đạo trong trại hành hương nhìn ta nghiêm khắc và khăng khăng rằng chúng ta phải bồi thường thiệt hại cho quán rượu gần đó."
  pilgrimage.6005.desc.good:1 "nhưng không có một động tĩnh nào.\n\nCó vẻ như đống lửa trại đã được thêm củi ngay trước khi đi ngủ để giữ ấm cho giường của chúng ta."
  pilgrimage.6005.a:0 "Bạn đồng hành của chúng ta thật chu đáo và tốt bụng!"
  pilgrimage.6005.b:0 "\"Chúng ta nên trả tiền cho những rắc rối mình gây ra!\""
  pilgrimage.6005.c:0 "\"Tận hưởng một chút niềm vui cũng là tội sao?\""
 #You find out your friend is a Non-Believer
  pilgrimage.6006.desc: "[friend.GetFirstName] và ta đang tiến gần đến cuối hành trình của ngày hôm nay. Chúng ta đang chậm rãi tiến về điểm dừng đã định, thì đột nhiên ai đó phía trước hét lên, \"Nhìn kìa! Một cảnh hoàng hôn #EMP tuyệt vời#! làm sao!\"\n\nMọi người đổ xô về phía trước với chút sức lực cuối cùng để có được cái nhìn về địa điểm hùng vĩ đó. \"Chúng ta thật có đặc ân khi được thấy những điều kỳ diệu trong cuộc đời hữu hạn này! Đây là thời điểm hoàn hảo để suy ngẫm về đức tin của chúng ta,\" ta nói với [friend.GetFirstNameNoTooltip], nhưng [friend.GetSheHe] có vẻ không hề ấn tượng, để cho một tiếng chế nhạo gay gắt thoát ra khỏi đôi môi của [friend.GetHerHis].\n\n\"Nó chỉ là một cảnh hoàng hôn!\" [friend.GetSheHe] hét lên. \"Mọi thứ chúng ta làm trong chuyến đi này phải liên quan đến [ROOT.Char.GetFaith.HighGodName] sao? Ta chỉ muốn đi du lịch và ngắm nhìn thế giới — ta thậm chí không tin rằng [ROOT.Char.GetFaith.HighGodName] tồn tại #EMP chút nào cả!#!\""
  pilgrimage.6006.a:0 "\"Bí mật của ngươi an toàn với ta, bạn à.\""
  pilgrimage.6006.b:0 "\"Ta không thể chấp nhận một người bạn không có đức tin.\""
  pilgrimage.6006.c:0 "\"Ngươi nói cũng có lý...\""
 #You and a friend are on a pilgrimage and your friend is healed in a miracle performed by a wandering priest
  pilgrimage.6007.t:0 "Sống nhờ lời cầu nguyện"
  pilgrimage.6007.desc:1 "[friend.GetFirstName] — [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('friend'))] của ta — bị hành hạ bởi căn bệnh của [friend.GetHerHis], đang phải vật lộn để theo kịp chúng ta trên chuyến hành hương. Vì vậy, ta đi bộ cùng với [friend.GetHerHim] và bầu bạn với [friend.GetHerHim]. Một [ROOT.Char.GetFaith.PriestNeuter] lang thang đã đi cùng chúng ta một thời gian và nhận thấy sự vật lộn của [friend.GetFirstNamePossessiveNoTooltip].\n\n\"Tội nghiệp con. Một đứa con của [ROOT.Char.GetFaith.HighGodName] không nên vất vả như vậy trên con đường đi đến [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip],\" ông nói. \"Có lẽ [ROOT.Char.GetFaith.HealthGodName] có thể ban cho ta sức mạnh để chữa trị căn bệnh của con. Con có cho phép ta thử không?\"\n\n[ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('friend'))] của ta quay sang ta, tìm kiếm sự chỉ dẫn của ta. \"Người nghĩ sao, [ROOT.Char.GetFirstName]?\""
  pilgrimage.6007.a:0 "[ROOT.Char.GetFaith.HighGodName] thực sự đang dõi theo chúng ta."
  pilgrimage.6007.a.success:0 "[friend.GetFirstNameNoTooltip] được chữa khỏi"
  pilgrimage.6007.a.failure:0 "Tình trạng của [friend.GetFirstNamePossessiveNoTooltip] trở nên tệ hơn"
  pilgrimage.6007.b:0 "Người [6007_healer.GetWomanMan] này không đáng để chúng ta tin tưởng."
 
 ###'Temptation/Virtue' Journey Events
 #Rakish or Lustful character considers making a pit stop, or perhaps, a detour to the local brothels
  pilgrimage.2101.t:0 "$pilgrimage_header$ Khao Khát Thân Mật"
  pilgrimage.2101.desc:1 "Đã bao lâu rồi kể từ lần cuối ta cảm nhận hơi ấm của một người khác áp lên làn da mình? Chuyến hành hương này đã đưa ta rời xa quê nhà, cũng như mọi tiện nghi quen thuộc.\n\nÔi, ta khao khát dục vọng của xác thịt biết bao..."
  pilgrimage.2101.desc.lust_vice:0 "\n\n[ROOT.Char.GetFaith.HighGodName], ta biết cảm giác này là tội lỗi! Vì sao ngài lại thử thách ta khắc nghiệt đến vậy? Chẳng lẽ cuộc hành hương của ta vẫn chưa đủ để chứng minh lòng sùng kính của ta sao?"
  pilgrimage.2101.desc.lust_virtue:0 "\n\nẮt hẳn đây là một phần trong thử thách của [ROOT.Char.GetFaith.HighGodNamePossessive]! Liệu ta có thể giữ vững đức hạnh mà không sa ngã trước những kẻ thù của đức tin trong lúc hành hương chăng?"
  pilgrimage.2101.desc.lust_neutral:0 "Cảm giác bứt rứt này thật phiền toái, ta phải tìm cách giải tỏa nó! Nhưng dĩ nhiên chuyện này không phải không có rủi ro. Đây là vùng đất xa lạ, và trong lúc yếu lòng thế này ta có thể bị kẻ khác lợi dụng."
  pilgrimage.2101.a:0 "Chỉ một đêm hưởng thụ thôi..."
  pilgrimage.2101.b:0 "Sao phải giới hạn bản thân ở #EMP một#! nhà chứa?"
  pilgrimage.2101.c:0 "Ta phải tập trung vào cuộc hành hương!"
 #Persistent Beggar
  pilgrimage.2501.t:0 "$pilgrimage_header$ Kẻ Ăn Mày Khốn Khổ"
  pilgrimage.2501.desc.opening:1 "Khi đoàn tùy tùng của ta đi ngang qua một thị trấn nhỏ, ta cảm thấy có người kéo nhẹ vạt áo mình. Quay lại nhìn, ta thấy một [beggar.GetWomanMan] gầy gò, rách rưới đang ngước nhìn ta.\n\n\"Ôi [ROOT.Char.GetLadyLord] cao quý, xin ngài thương xót, liệu ngài có thể bố thí cho kẻ ăn mày đáng thương này vài đồng xu chăng? Ta đang chết đói, mà dân địa phương chẳng ai chịu giúp ta.\""
  pilgrimage.2501.desc.virtue.generous:0 "\n\nDù lòng hào phóng không phải bản tính của ta, nhưng đang trên đường hành hương khiến ta nhớ rằng bố thí là điều được mong đợi từ mọi tín đồ mộ đạo của [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]..."
  pilgrimage.2501.desc.virtue.compassionate:0 "\n\nDù ta chẳng mấy bận tâm đến cảnh ngộ của [beggar.GetHerHis], nhưng đang trên đường hành hương khiến ta nhớ rằng lòng trắc ẩn với kẻ khốn khó là điều được mong đợi từ mọi tín đồ mộ đạo của [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]..."
  pilgrimage.2501.desc.sin.generous:0 "\n\nDù tên khốn này trông thật đáng thương, ta vẫn nhớ rằng [ROOT.Char.GetFaith.PantheonTerm] xem việc bố thí là một [ROOT.Char.Custom('GetSinMisdeed')] nghiêm trọng..."
  pilgrimage.2501.a.virtue:0 "Nhân danh [ROOT.Char.GetFaith.HighGodNamePossessive], ta đoán ngươi có thể cầm lấy mấy đồng xu này..."
  pilgrimage.2501.a.sin:0 "Ta không nỡ từ chối!"
  pilgrimage.2501.b:0 "Bah! Đi tìm việc thật mà làm, tự nuôi thân đi!"
  pilgrimage.2501.c.arrogant:0 "Ngươi dám chạm vào áo của ta sao, đồ tiện dân!?"
 #Beggar wants another favor for their sister
  pilgrimage.2502.t:0 "$pilgrimage.2501.t$"
  pilgrimage.2502.desc.gave:0 "\"Vâng! Vâng! Đa tạ ngài [ROOT.Char.Custom('LadyLordWomanMan')], tạ... [ROOT.Char.GetFaith.HighGodName], phải không? Xin cảm tạ cả ngài ấy nữa! Nhưng, ôi vị [ROOT.Char.Custom('LadyLordWomanMan')] hào hiệp, liệu ta có thể xin thêm một ân huệ nữa chăng?\""
  pilgrimage.2502.desc.refused:0 "\"Không! Không, thưa [ROOT.Char.Custom('LadyLordWomanMan')] của ta, xin hãy rủ lòng thương!\""
  pilgrimage.2502.desc.end:0 "Chị gái ta đang bệnh nặng, và rất cần thuốc men! Tiền của ngài có thể cứu mạng chị ấy, xin ngài! Chúng ta sẽ vô cùng biết ơn ngài!\""
  pilgrimage.2502.a:0 "Ờ... được. Được thôi. Để mua thuốc."
  pilgrimage.2502.b:0 "Không, ta không thể! Chuyện này không #EMP đúng#!!"
  pilgrimage.2502.c.gave:0 "Không, ta đã làm phần của mình rồi!"
  pilgrimage.2502.c.refused:0 "Ta đã nói #EMP không#!! Mau cút đi!"
 #Beggar wants favor for sisters children
  pilgrimage.2503.t:0 "$pilgrimage.2501.t$"
  pilgrimage.2503.desc:0 "\"Tuyệt vời! Mong chị ấy sớm khỏi bệnh. Nhưng liệu ta có thể xin thêm một ân huệ nữa chăng? Chị gái ta có con nhỏ, mà ngài cũng biết trẻ con rồi đấy. Chúng ăn rất nhiều! Nếu ngài có thể cho chúng ít thức ăn nữa...?\""
  pilgrimage.2503.a:0 "Được thôi. Không đứa trẻ nào nên phải chịu đói."
  pilgrimage.2503.b:0 "Ta nghĩ mình đã cho đủ rồi."
 #Happy beggar
  pilgrimage.2504.t:0 "$pilgrimage.2501.t$"
  pilgrimage.2504.desc:0 "Muôn vàn cảm tạ ngài, thưa [ROOT.Char.Custom('LadyLordWomanMan')]! Ta vô cùng biết ơn, bởi ta mắc nợ ngài một ân tình mà suốt đời cũng không thể báo đáp!\n\nLòng hào phóng của [ROOT.Char.GetFaith.HighGodNamePossessive] thật vĩ đại, ta sẽ ca tụng [ROOT.Char.GetFaith.HighGodHerHis] cho đến hết đời!"
  pilgrimage.2504.a:0 "Ngươi quên rồi, ta còn cho cả mấy thứ này nữa."
  pilgrimage.2504.a.flavor:0 "Ngươi định bỏ lại thứ tốt nhất sao?"
  pilgrimage.2504.b:0 "Mắc nợ ta, ngươi nói vậy sao? Hừm..."
  pilgrimage.2504.c.virtue:0 "Không có gì. Giờ hãy đi đi, với phúc lành của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  pilgrimage.2504.c.sin:0 "Ừ, ừ, làm ơn... đi đi."
 #Cocky Lordling
  pilgrimage.2511.t:0 "$pilgrimage_header$ Quý Tộc Trẻ Ngạo Mạn"
  pilgrimage.2511.desc.start:1 "[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] thu hút những người hành hương từ khắp nơi trên thế giới [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], vì vậy không phải là không thể tưởng tượng được rằng ta sẽ tình cờ gặp [lordling.Custom2('MyCharacterIntroduction', ROOT.Char)] trên hành trình của mình.\n\nĐiều #EMP không#! thể tưởng tượng được là cách [lordling.GetSheHe] đối xử với ta một cách xấc xược, cắt ngang đoàn tùy tùng của ta trên con ngựa của [lordling.GetHerHis] và gọi ta là một [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('lordling'))]... #EMP ngay trước mặt ta#!, không hơn không kém!"
  pilgrimage.2511.desc.wrathful:0 "\n\nMáu trong người ta sôi lên, chỉ được kìm lại nhờ nhớ rằng các [ROOT.Char.GetFaith.PriestNeuterPlural] dạy ta phải kiềm chế và không để cảm xúc lấn át."
  pilgrimage.2511.desc.vengeful:0 "\n\nNhững lúc thế này ta lại nhớ rằng [ROOT.Char.GetFaith.PantheonTerm] dạy chúng ta phải tha thứ cho kẻ đã làm điều sai trái với mình."
  pilgrimage.2511.desc.vengeful.christian:0 "\n\nNhững lúc thế này ta lại nhớ rằng Chúa Jesus đã dạy chúng ta hãy đưa má còn lại..."
  pilgrimage.2511.a:0 "Chết tiệt, ta sẽ dạy thằng nhãi đó một bài học!"
  pilgrimage.2511.b:0 "Hít vào... thở ra..."
  pilgrimage.2511.c:0 "Ắt phải có cách #EMP khác#! để xử lý cơn giận này."

 ###Christian Pilgrimage Journey Events
 #Zealous priest giving sermon in freezing rains
  pilgrimage.3001.t:0 "$pilgrimage_header$ Nước Mắt của [ROOT.Char.GetFaith.WaterGodName]"
  pilgrimage.3001.desc:0 "Ngay cả khi đang hành hương, các tu sĩ vẫn cử hành Thánh lễ mỗi Chủ Nhật. Khi không có nhà thờ gần đó thì buổi lễ được tổ chức ngoài trời, nhưng sáng sớm hôm nay một cơn bão đã kéo đến và vẫn chưa hề dứt.\n\nKhông hề nao núng, một [ROOT.Char.Custom('DefaultPriestTitle')] đầy nhiệt thành đang đứng giữa cơn mưa như trút nước, giảng đạo về sự kiên trì trước nghịch cảnh. Dù vậy, số người lắng nghe [zealous_priest.GetHerHis] đang nhanh chóng thưa dần khi các tín đồ nản lòng tìm chỗ trú khỏi cơn mưa xối xả."
  pilgrimage.3001.a:0 "Một chút mưa thì có nghĩa lý gì với một tín đồ trung thành của [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]?"
  pilgrimage.3001.a.tt:0 "$pilgrimage.2008.a.tt$"
  pilgrimage.3001.b:0 "Quên cái sự điên rồ này đi, ta sẽ vào lều."
 #Naked preacher claiming to have reclaimed the lost innocence of Adam & Eve
  pilgrimage.3002.t:0 "$pilgrimage_header$ Sự Ngây Thơ của Adam"
  pilgrimage.3002.desc:0 "Khi đoàn của ta chuẩn bị dỡ trại, ta nhận thấy một cảnh náo động lớn ở gần đó — một [naked_preacher.GetWomanMan] trần truồng đã leo lên một tảng đá lớn và đang giảng đạo cho đám đông tụ tập phía dưới.\n\n\"Tội tổ tông vẫn còn vấy bẩn linh hồn chúng ta, hỡi các bằng hữu, nhưng điều đó không nhất thiết phải như vậy! Nếu chúng ta cởi bỏ xiêm y, chúng ta có thể lấy lại sự ngây thơ đã mất của Adam và Eva... khi ấy, và #EMP chỉ khi ấy#!, Thánh Linh mới đoái hoài chạm đến chúng ta và cho chúng ta thấy tình yêu chân thật của Thượng Đế!\""
  pilgrimage.3002.a:0 "[naked_preacher.GetSheHe|U] nói có lý! Ta chưa từng cảm thấy gần gũi với [ROOT.Char.GetFaith.HighGodName] đến thế!"
  pilgrimage.3002.b:0 "Dị giáo! Lôi [naked_preacher.GetHerHim] xuống khỏi đó!"
  pilgrimage.3002.c:0 "Thách [naked_preacher.GetHerHim] tranh luận thần học."
  pilgrimage.3002.c.success:0 "Ngươi thuyết phục được nhà giảng đạo rằng [naked_preacher.GetHerHis] đã sai lầm"
  pilgrimage.3002.c.success.tt:0 "Ngươi quyết định điều gì sẽ xảy ra tiếp theo"
  pilgrimage.3002.c.failure:0 "Ngươi không thể phản bác được lập luận của nhà giảng đạo"
  pilgrimage.3002.d:0 "Mặc kệ [naked_preacher.GetHerHim] và tiếp tục hành trình."
 #You convinced the naked preacher
  pilgrimage.3003.t:1 "$pilgrimage_header$ Tội Lỗi của Adam"
  pilgrimage.3003.desc:1 "Sau khi bị đánh bại trong cuộc tranh luận thần học, [naked_preacher.GetWomanMan] đã trèo xuống khỏi tảng đá và hiện đang đứng trước mặt ta, bị bất ngờ bởi tình huống này.\n\n\"... Ta thực sự tin rằng chìa khóa nằm ở y phục,\" [naked_preacher.GetSheHe] thì thầm, một cách buồn bã. \"Nhưng quan điểm của người thực sự rất sáng suốt.\"\n\n[naked_preacher.GetSheHe|U] chớp mắt, đột nhiên nhớ ra đám đông và sự trần truồng của [naked_preacher.GetHerHis] nhưng vẫn giữ một khuôn mặt dũng cảm: \"Tuy nhiên, bây giờ ta nên tiến triển như thế nào...\""
  pilgrimage.3003.a:1 "Ngươi có thể mặc những thứ này và đi cùng chúng ta tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
  pilgrimage.3003.a.flavor:1 "Ngươi đưa cho [naked_preacher.GetWomanMan] trần truồng vài bộ quần áo."
  pilgrimage.3003.b:1 "Hãy đi và truyền bá lời dạy #EMP đúng đắn#!."
 #Doomsayer claiming the end is nigh!
  pilgrimage.3004.t:0 "$pilgrimage_header$ Tận Thế Đã Gần"
  pilgrimage.3004.desc:0 "Khi đoàn của ta đi ngang qua một thị trấn nhỏ, ta thấy một đám đông chen kín quảng trường chợ. Ở giữa, một [doomsayer.GetWomanMan] đứng trên chiếc xe cá bị lật úp, gào lên điên cuồng với bất cứ ai chịu lắng nghe.\n\n\"Ngày Phán Xét đã gần kề! Hãy ăn năn! Ta nói hãy ăn năn, nếu không các ngươi sẽ bị nguyền rủa đời đời kiếp kiếp!\n\nNhững người dân thị trấn với vẻ mặt lo lắng thì thầm với nhau, sợ hãi trước lời tiên tri của kẻ báo tận thế."
  pilgrimage.3004.a:0 "\"De die autem illa et hora nemo scit!\""
  pilgrimage.3004.a.flavor:0 "Kinh Thánh đã nói rõ; không ai biết ngày đó sẽ đến khi nào!"
  pilgrimage.3004.b:0 "Ta thật mừng vì cuộc hành hương này đi kèm với ân xá!"
  pilgrimage.3004.c:0 "Tên [doomsayer.GetWomanMan] đó #EMP không#! phải tu sĩ! Lôi [doomsayer.GetHerHim] xuống!"

 ###Muslim Pilgrimage Journey Events
 #Ziyarat - Why am I taking this pilgrimage?
  pilgrimage.3102.t:0 "$pilgrimage_header$ Ziyarat"
  pilgrimage.3102.desc:1 "Dù Hajj là nghĩa vụ bắt buộc đối với mọi người Hồi giáo, những cuộc hành hương tới các địa điểm khác lại ít phổ biến hơn nhiều. Vì các Ziyarat này không được giáo lý Hồi giáo yêu cầu, nên những người Hồi giáo chọn thực hiện chúng có thể mang nhiều động cơ khác nhau.\n\nKhi chúng ta đi trên con đường tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], ta nhận ra mình đang suy nghĩ về điều gì đã khiến ta muốn thực hiện chuyến hành trình này..."
  pilgrimage.3102.a:0 "Ta muốn chiêm ngưỡng toàn bộ tạo vật vinh quang của Allah."
  pilgrimage.3102.b:0 "Lòng nhiệt thành của ta cháy bỏng đến mức ta muốn làm nhiều hơn chỉ mỗi Hajj."
  pilgrimage.3102.c:0 "Những nghi ngờ trong lòng thôi thúc ta tìm câu trả lời ở những vùng đất xa xôi."

 ###Hindu Pilgrimage Journey Events
 #Ritual purification in a river
  pilgrimage.3201.t:0 "$pilgrimage_header$ Thanh Tẩy Nghi Thức"
  pilgrimage.3201.desc:0 "Thanh tẩy nghi thức là một phần thiết yếu trong hành trình của mỗi người hành hương Hindu. Một hình thức phổ biến là tắm rửa trong dòng nước của một con sông linh thiêng.\n\nCó một bến sông như vậy ngay phía trước, nhưng ta không khỏi nhận ra rằng nó đang #EMP chật kín#! những thường dân cũng đang hành hương..."
  pilgrimage.3201.a:0 "Cùng các tín đồ khác bước xuống dòng nước thiêng."
  pilgrimage.3201.b:0 "Ta sẽ không tắm cùng #EMP bọn nông dân#! đâu!!"
 #Contemplating the universe
  pilgrimage.3202.t:0 "$pilgrimage_header$ Sự Thiêng Liêng của Rừng"
  pilgrimage.3202.desc.hinduism:0 "Dù Bảy Thánh Thành là những nơi linh thiêng bậc nhất, vùng hoang dã tự thân cũng mang một dạng thiêng liêng riêng của nó. "
  pilgrimage.3202.desc.buddhism:0 "Gautama Buddha đã dạy rằng mọi sự sống đều thiêng liêng. Dù chúng sinh có tri giác là dạng sống cao nhất, ngay cả một ngọn cỏ nhỏ bé nhất cũng vẫn xứng đáng được tôn trọng."
  pilgrimage.3202.desc.jainism:0 "Ahiṃsā, hay bất bạo động, là một trong những giới luật chính của Kỳ Na giáo. Ngay cả bạo lực đối với cây cỏ cũng bị cấm, trừ mức tối thiểu cần thiết để duy trì sự sống."
  pilgrimage.3202.desc.nature:0 "Sự kiêu ngạo của loài người khiến nhiều kẻ tin rằng mình đứng trên tự nhiên, nhưng họ đã sai. Thế giới tự nhiên tồn tại trong trạng thái chân thật và thuần khiết nhất."
  pilgrimage.3202.desc.end:0 "\n\nKhi chúng ta đi ngang qua một khoảng rừng trống đơn sơ, ta chợt nhận ra nơi này yên bình và tĩnh lặng đến nhường nào. Không đấu tranh, không xung đột... chỉ có sự an hòa giản dị mà cây cối và bụi rậm đang tận hưởng."
  pilgrimage.3202.a:0 "Hãy ở lại đây một lúc, và suy ngẫm về vũ trụ."
  pilgrimage.3202.a.tt:1 "[THIS.Char.GetInvolvedActivity.GetName] của ngươi sẽ bị #N trì hoãn vài tháng#!"
  pilgrimage.3202.b:0 "Nhanh lên, tiếp tục hành trình thôi!"
  pilgrimage.3202.b.tt:0 "Ngươi sẽ đến nơi #P sớm hơn vài tuần#!"

 ###Buddhist Pilgrimage Journey Events
 #Critical Wanderer
  pilgrimage.3301.t:0 "$pilgrimage_header$ Tỳ-kheo Khắt Khe"
  pilgrimage.3301.desc:0 "Trên con đường hành hương ta gặp nhiều kẻ du hành, những người đã từ bỏ thế tục và giải thoát bản thân khỏi mọi ràng buộc trần gian.\n\nHôm nay một lão du tăng già nua nhìn đoàn tùy tùng của ta khi [wanderer.GetSheHe] bước bên cạnh ta. \"Ngươi mang theo quá nhiều thứ. Muốn đạt tới giác ngộ, ngươi phải buông bỏ của cải trần gian như ta, và chỉ du hành với bộ y phục giản dị.\""
  pilgrimage.3301.a:0 "Ta có thể làm vậy, ít nhất là trong chuyến đi này."
  pilgrimage.3301.b:0 "Nhưng lều của ta, chăn của ta thì sao? Quá khó. Ta chưa sẵn sàng!"
  pilgrimage.3301.c:0 "À, nhưng thật trái với Ṛta khi một [ROOT.Char.GetTitleAsNameNoTooltip] phải du hành trong khổ hạnh."

#The Wisdom of Goats
  pilgrimage.3302.t: "$pilgrimage_header$ Trí Tuệ Từ Lũ Dê"
  pilgrimage.3302.desc: "Khi lần đầu tiến vào vùng [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] hoang dã của [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], ta nghĩ hành trình băng qua con đèo sẽ chẳng mấy khó khăn. Sau nhiều giờ leo dốc vất vả, ta nhớ rằng mình nên chào đón những thử thách của Yatra.\n\nTa dừng lại lau mồ hôi trên trán và bị thu hút bởi cảnh tượng những con dê hoang đang đứng trên sườn [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] gần như thẳng đứng.\n\nMột người địa phương già nua [mountain_local.GetWomanMan] quay sang ta.\n\n\"Lũ dê tham lam đó chỉ leo lên để liếm muối.\""
  pilgrimage.3302.a: "Chúng nên buông bỏ sự truy cầu khoái lạc!"
  pilgrimage.3302.b: "Giá như ta cũng có thể kiên định như vậy trên đường leo..."
  pilgrimage.3302.c: "Chỗ muối đó phải thuộc về ta!"
  pilgrimage.3302.c.flavor: "Ngươi thu hoạch muối để buôn bán."

 #Kalama Sutta
  pilgrimage.3303.t: "$pilgrimage_header$ [place_to_teach.GetBaronyNameExplicitlyNoTooltip] Sutta"
  pilgrimage.3303.desc: "Khi đi qua [place_to_teach.GetBaronyNameExplicitlyNoTooltip], một số dân địa phương, dẫn đầu bởi [wisdom_seeker.GetName], tiến lại gần với vẻ mặt đầy bối rối.\n\n\"Kính thưa [ROOT.Char.GetTitleAsName], có nhiều [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] ghé thăm [place_to_teach.GetBaronyNameExplicitlyNoTooltip]. Họ ca ngợi giáo lý của mình, còn với tín ngưỡng của người khác, họ hung dữ như [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')] và xé nát chúng ra từng mảnh. Rồi những [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] khác lại tới và cũng khinh miệt, phỉ báng giáo lý của nhóm trước.\n\nChúng tôi bị nhấn chìm trong sự bất định, nghi ngờ gõ cửa mỗi ngày. Vậy trong số những vị [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] đáng kính ấy, ai nói thật và ai nói dối?\""
  pilgrimage.3303.a: "Đừng theo những lý lẽ ngụy biện, hãy theo con đường của [ROOT.Char.GetFaith.HighGodName]!"
  pilgrimage.3303.b: "Trong những suối nước ngươi uống, suối nào mang lại sức mạnh cho ngươi?"
  pilgrimage.3303.b.flavor: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] rồi sẽ tìm ra con đường suy nghĩ đúng đắn."

### Dharmic Pilgrimage Journey Events
#Brahmacharya Challenged
  pilgrimage.3401.t: "$pilgrimage_header$ Brahmacharya Bị Thử Thách"
  pilgrimage.3401.desc: "Yatra của chúng ta đã đưa ta tới bờ [body_of_water.GetName]. Nước nơi đây lấp lánh như những mảnh vàng trong ánh nắng chiều muộn, vẫy gọi chúng ta xuống tắm.\n\nÁnh mắt ta lướt qua một người hành hương cùng đoàn, [bather.GetName], thân thể trần truồng của [bather.GetHerHis] chỉ được bao phủ bởi ánh sáng lung linh của làn nước.\n\nKhi đang tham gia [ROOT.Char.GetInvolvedActivity.GetShortName], người ta phải giữ lối sống gần như tu sĩ theo [Glossary('Brahmacharya', 'BRAHMACHARAYA_GLOSS')], tránh xa những ý nghĩ và ham muốn dục vọng..."
  pilgrimage.3401.a: "Với khao khát làm kim chỉ nam, ta đắm mình trong vẻ đẹp của [bather.GetFirstNamePossessiveNoTooltip]."
  pilgrimage.3401.b: "Ta bước xuống làn nước mát, dập tắt mọi dục niệm."
  pilgrimage.3401.b.flavor: "Tiến thêm một bước tới Niết-bàn."
  BRAHMACHARAYA_GLOSS: "Từ Phạn ngữ nghĩa là 'sống theo hạnh Brahman', tức thực hành lối sống giúp theo đuổi tri thức thiêng liêng và sự giải thoát tâm linh. Một phần của điều này là nỗ lực đạt tới trạng thái không còn dục vọng."
 ###Hajj Arrival Event
 #Entering state of Ihram
  pilgrimage.3101.t:1 "Ihram"
  pilgrimage.3101.desc:1 "Khi tiến gần Mecca, ta thấy mình đang đứng trước Mīqāt, ranh giới giữa vùng đất thiêng của Mecca và thế giới bên ngoài.\n\nTừ thời khắc này ta phải bước vào trạng thái Ihram, thực hiện nghi thức thanh tẩy và chỉ mặc y phục được quy định. Ta cũng phải kiêng các hành vi tình dục, lời lẽ thô tục, cũng như những suy nghĩ kiêu ngạo hay thô lỗ."
  pilgrimage.3101.a:0 "Ta sẽ giữ Ihram với sự tận tâm tuyệt đối."
  pilgrimage.3101.b:0 "Ờ... cũng chẳng ai biết nếu ta lỡ phạm chút đâu."

 ###Generic Pilgrimage Destination Events
 #Standard arrival
  pilgrimage.4001.t:0 "Đã Đến Nơi"
  pilgrimage.4001.desc:1 "Cuối cùng ta cũng đã ở đây, cả thân lẫn tâm, tại [ROOT.Char.GetFaith.HouseOfWorship] vĩ đại của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nKhi vị [ROOT.Char.GetFaith.BishopNeuter] ban phúc lành cho ta, ta suy ngẫm về mọi điều đã phải xảy ra để [ROOT.Char.GetFaith.PantheonTerm] đưa ta tới nơi này, vào đúng thời khắc này."
  pilgrimage.4001.cynical_end:0 "\n\nCả một quãng đường dài chỉ toàn đi bộ."
  pilgrimage.4001.a:0 "Ta đã bước đi trên con đường thiêng."
  pilgrimage.4001.a_dead:0 "Chúng ta đã bước đi trên con đường thiêng."
  pilgrimage.4001.a_cynical:0 "Điều quan trọng là ta đã được thấy và được nghe ở đây."
 #The Mystic is there!
  pilgrimage.4002.desc:1 "Cuối cùng ta cũng đã tới đây, cả thân lẫn tâm, ở điểm kết thúc của cuộc hành hương vĩ đại. Và ai lại đón ta tại đây nếu không phải [2010_mystic.GetTitledFirstName], kẻ truy cầu chân tri về thần thánh?\n\n\"Hãy nhìn quanh đi, [ROOT.Char.GetFirstNameNoTooltip]!\" [2010_mystic.GetSheHe] nói. \"Vinh quang này chẳng phải đúng như ta đã nói sao?\""
  pilgrimage.4002.a:0 "Quả đúng như vậy, bằng hữu của ta!"
  pilgrimage.4002.a_cynical:0 "Ừm... cũng ra gì đấy."
  pilgrimage.4002.b:1 "Ồ phải, ta thích những gì mình đang thấy."
 #Obligatory Pilgrimage Skip Destination Event
  pilgrimage.4010.t:0 "Đã Từng Đến"
  pilgrimage.4010.desc:0 "Cắt bớt chặng đường và thúc ép đoàn tùy tùng, cuối cùng chúng ta cũng đã đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nKhông muốn chần chừ, ngay khi những nghi thức thiêng liêng cho [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] của chúng ta hoàn tất, những người hầu địa phương báo rằng việc chuẩn bị cho hành trình quay về đã sẵn sàng."
  pilgrimage.4010.a:0 "Ta... ta đã đổi ý. Chuyện này không đúng."
  pilgrimage.4010.a.flavor:0 "Quay đầu lúc này chẳng khác nào phạm thượng!"
  pilgrimage.4010.a.tt:0 "Ngươi sẽ khám phá điểm đến và ở lại [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] trong khoảng thời gian bình thường\n$EFFECT_LIST_BULLET$Kết thúc và phần thưởng từ [THIS.Char.GetInvolvedActivity.GetName] của ngươi vẫn sẽ bị ảnh hưởng tiêu cực"
  pilgrimage.4010.b:0 "Được. Hãy lên đường tới [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]."
  pilgrimage.4010.b.flavor:0 "Đi thôi..."
  pilgrimage.4010.b.tt:0 "[THIS.Char.GetInvolvedActivity.GetName] của ngươi sẽ kết thúc và ngươi lập tức bắt đầu hành trình quay về"
 #Bury old host at Destination
  pilgrimage.4020.t:0 "Memento Mori"
  pilgrimage.4020.desc.intro:0 "Ngay khi chúng ta đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ta bắt đầu sắp xếp nghi lễ cho"
  pilgrimage.4020.desc.relation_family_liked:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))] thân yêu đã khuất của ta.\n\n"
  pilgrimage.4020.desc.relation_liked:0 "[old_pilgrimage_host.GetFirstName] thân mến của ta.\n\n"
  pilgrimage.4020.desc.relation_family:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))] đã khuất của ta.\n\n"
  pilgrimage.4020.desc.relation_neutral:0 "[old_pilgrimage_host.GetTitledFirstName].\n\n"
  pilgrimage.4020.desc.liked:0 "Ta cố giữ bình tĩnh khi tìm một trong những [ROOT.Char.GetFaith.AltPriestTermPlural], sẵn sàng giúp chúng ta thực hiện cuộc tiễn biệt cuối cùng này.\n\nSau đó ta cảm thấy phần nào thanh thản khi biết rằng chúng ta đã tới được [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] và rằng [old_pilgrimage_host.GetFirstName] sẽ mãi yên nghỉ, gần với [ROOT.Char.GetFaith.HighGodNameAlternate] hơn, tại nơi linh thiêng này."
  pilgrimage.4020.desc.neutral:0 "Đám rước thật thanh tịnh và xứng đáng, và các [ROOT.Char.GetFaith.AltPriestTermPlural] địa phương đảm bảo với ta rằng [old_pilgrimage_host.GetSheHe] đang ở một nơi tốt đẹp hơn bây giờ khi [old_pilgrimage_host.GetSheHe] được an nghỉ tại đây ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], gần với [ROOT.Char.GetFaith.HighGodName] hơn."
  pilgrimage.4020.a:0 "Đây là quyết định đúng."
  pilgrimage.4020.a.flavor:0 "Cầu mong [old_pilgrimage_host.GetSheHe] được yên nghỉ."

 ###Specific Pilgrimage Destination Events
 ###Christian
 #Rome
  pilgrimage.5001.t:0 "Mọi Con Đường Đều Dẫn Tới Rome"
  pilgrimage.5001.desc:0 "Những người hành hương đổ về Rome từ khắp thế giới Cơ Đốc. Có người đi theo Via Francigena; có người chọn những con đường ít được biết đến hơn. Cuối cùng, tất cả chúng ta đều hội tụ nơi đây, tại Vương cung Thánh đường Thánh Phêrô, nơi vị thánh vĩ đại ấy được an táng.\n\nĐứng giữa những người hành hương khác, ta cảm nhận được một sự trang nghiêm và tình huynh đệ chung giữa những người tụ họp, tất cả đều đã vượt qua muôn vàn thử thách và gian khổ trên hành trình của mình."
 #Jerusalem
  pilgrimage.5011.t:0 "Ôi Jerusalem, Jerusalem!"
  pilgrimage.5011.desc.beginning:0 "Không thành phố nào trên thế giới có lịch sử như Jerusalem. Ngoài nhiều thánh địa khác, thành phố này còn có "
  pilgrimage.5011.desc.christian:0 "Nhà thờ Mộ Thánh, được xây dựng trên nơi Chúa Jesus bị đóng đinh, an táng và phục sinh."
  pilgrimage.5011.desc.muslim:0 "Haram esh-Sharif, nơi Muhammad đã thăng thiên sau thời gian sống trên trần thế."
  pilgrimage.5011.desc.jewish:0 "Núi Đền, nơi đặt Nơi Chí Thánh, và là nơi Đền Thờ Thứ Ba được tiên tri sẽ được tái dựng."
  pilgrimage.5011.desc.end:0 "\n\nĐứng bên ngoài Núi Đền, tay đặt lên Bức Tường Phía Tây, ta không khỏi suy ngẫm về mọi điều đã xảy ra trên hành trình đưa ta tới thành phố huyền thoại này."
 #Constantinople
  pilgrimage.5021.t:0 "Thành Phố Khát Vọng của Thế Giới!"
  pilgrimage.5021.desc:0 "Cuối cùng ta cũng đứng trên những ngọn đồi ngoài Constantinople, viên ngọc lấp lánh của nền văn minh vang vọng vinh quang của Đế chế La Mã. Quả thật là một cảnh tượng đáng chiêm ngưỡng!\n\nGần trung tâm ta có thể thấy Hagia Sophia, trung tâm thờ phụng vĩ đại, thường được xem là đỉnh cao của kiến trúc Byzantine.\n\nNhưng đó không phải kỳ quan duy nhất nơi đây, và khi nhìn ra khắp thành phố ta không khỏi kinh ngạc trước vinh quang của tạo vật [ROOT.Char.GetFaith.CreatorNamePossessive]."
 #Alexandria
  pilgrimage.5031.t:0 "Alexandria!"
  pilgrimage.5031.desc:0 "Cuối cùng ta cũng đã tới Alexandria, cái nôi của đời sống tu viện Cơ Đốc. Những tu sĩ và ẩn sĩ đầu tiên đã bắt đầu hành trình của họ trong các hang động sa mạc quanh thành phố, và chúng vẫn còn được sử dụng cho tới ngày nay.\n\nDù không nổi tiếng như Jerusalem hay Rome, Alexandria có lịch sử lâu dài như một trung tâm thần học và học thuật. Ngay cả sau nhiều thế kỷ dưới sự cai trị Hồi giáo, những cộng đồng Cơ Đốc sống trong thành phố vẫn giữ vững đức tin của mình."
 ###Jewish
 #Mount Sinai
  pilgrimage.5101.t:0 "Sinai và Horeb"
  pilgrimage.5101.desc:1 "[ROOT.Char.GetFaith.HighGodName] lần đầu nói chuyện với Moses trên đỉnh núi Sinai, hiện thân dưới dạng một bụi gai cháy rực. Sau đó, cũng trên ngọn núi ấy, [ROOT.Char.GetFaith.HighGodNameSheHe|U] đã trao cho ông Mười Điều Răn, nền tảng của toàn bộ giáo lý Abraham.\n\nKhông còn nghi ngờ gì rằng [ROOT.Char.GetFaith.HighGodName] ưu ái nơi này, và ta tự hỏi liệu [ROOT.Char.GetFaith.HighGodNameSheHe|U] có đang dõi nhìn xuống ta khi ta đứng trên những sườn núi thiêng liêng này..."
 ###Muslim
 #Medina
  pilgrimage.5201.t:0 "Cuộc Hegira"
  pilgrimage.5201.desc:0 "Muhammad không phải lúc nào cũng được yêu mến, và trong những ngày đầu của đức tin Hồi giáo nhiều người đã bác bỏ ông cùng giáo lý của ông.\n\nSau khi được cảnh báo về một âm mưu ám sát, ông rời Mecca để đến Yathrib, nơi một cộng đồng Hồi giáo đang lớn mạnh đã chào đón ông với vòng tay rộng mở. Hành trình này được gọi là Hegira, và tại quê hương mới Muhammad đã có thể tập hợp các bộ tộc đang xung đột lại dưới sự phục tùng Allah.\n\nYathrib sau đó được đổi tên thành Medina, thành phố của Nhà Tiên Tri, để tôn vinh sự kiện này. Và giờ ta đang ở đây, sẵn sàng tôn vinh hành trình của ông."
 ###Hindu
 #Varanasi
  pilgrimage.5301.t:0 "Varanasi"
  pilgrimage.5301.desc:0 "Cuối cùng ta đã đến Varanasi. Được thần Shiva lập nên từ thời cổ đại xa xưa, thành phố vĩ đại này thu hút những người hành hương từ khắp nơi.\n\nKhông chỉ người Hindu hành hương đến đây, vì thành phố này nằm gần nơi Gautama Buddha lần đầu giảng dạy cho các đệ tử của mình.\n\nChứng kiến sự hòa trộn của các tín đồ và những tri thức, thảo luận nảy sinh từ đó khiến ta nhận ra rõ hơn rằng tất cả chúng ta đều cùng sống trong thế giới này."
 #Ayodhya
  pilgrimage.5311.t:0 "Ayodhya"
  pilgrimage.5311.desc:1 "Cuối cùng ta đã tới Ayodhya, nơi sinh của thần Rama và bối cảnh của thiên sử thi vĩ đại Ramayana. Là một hóa thân của Vishnu, sự ra đời và cuộc đời của Rama được xem là tấm gương sáng về dharma trong hành động.\n\nLà câu chuyện đã truyền cảm hứng cho bao thế hệ người Hindu, việc đứng tại nơi gắn liền với Ramayana khiến ta tự hỏi di sản của chính mình rồi sẽ để lại dấu ấn gì trong lịch sử..."
 #Mathura
  pilgrimage.5321.t:0 "Mathura"
  pilgrimage.5321.desc:0 "Cuối cùng ta đã tới đích, Mathura. Chính tại nơi đây thần Krishna ra đời, vị thần của lòng trắc ẩn, tình yêu và sự dịu dàng.\n\nNhìn quanh, ta có thể thấy tất cả những phẩm chất ấy được thể hiện bởi những người hành hương tụ họp tại quần thể đền Krishna Janmasthan, một trong những công trình kiến trúc tôn giáo tráng lệ và vĩ đại nhất từng được xây dựng."
 #Haridwar
  pilgrimage.5331.t:0 "Haridwar"
  pilgrimage.5331.desc:0 "Cuối cùng ta đã tới nguồn của dòng sông Hằng linh thiêng, Haridwar.\n\nThành phố này được xây dựng tại nơi nữ thần Ganga giáng thế khi thần Shiva thả dòng sông hùng vĩ khỏi mái tóc của mình.\n\nNổi tiếng với khả năng rửa sạch tội lỗi, những người hành hương từ khắp thế giới đổ về đây để tắm trong dòng nước thiêng. Giờ đây ta cũng sẽ là một trong số họ."
 #Kanchipuram
  pilgrimage.5341.t:0 "Kanchipuram"
  pilgrimage.5341.desc:1 "Cuối cùng ta đã tới Kanchipuram, quê hương của đền Kamakshi Amman.\n\nĐược hiến dâng cho Nữ Thần Mẹ, ngôi đền này nổi tiếng là nơi mang lại hòa bình và thịnh vượng, và vẫn là một trong bảy thánh địa linh thiêng nhất của Hindu giáo. "
 #Ujjayini
  pilgrimage.5351.t:0 "Ujjayini"
  pilgrimage.5351.desc:0 "Đến thành cổ Ujjain, ta bắt đầu tiến về phía Mahakaleshwar Jyotirlinga.\n\nĐược hiến dâng cho thần Shiva trong hóa thân Mahakaleshwar, thành phố này từ lâu vừa là trung tâm hành hương vừa là trung tâm hành chính, tạo nên một đô thị nhộn nhịp tràn đầy sức sống của các tín đồ.\n\nSau khi tới đại đền, ta tìm kiếm phúc lành từ [ROOT.Char.GetFaith.BishopNeuter], thanh tẩy linh hồn khỏi tội lỗi."
 #Dwarka
  pilgrimage.5361.t:0 "Dwarka"
  pilgrimage.5361.desc:0 "Cuối cùng ta cũng đứng trước ngưỡng cửa của Thành Phố Cổng — Dwarka, một trong những thánh địa vĩ đại nhất của Hindu giáo.\n\nTheo truyền thuyết, hóa thân Krishna của Vishnu đã giành lại những vùng đất rộng lớn từ biển cả để thành phố có thể được xây dựng tại đây. Từ đó, thành phố phát triển mạnh mẽ, trở thành trung tâm tôn giáo và kinh tế thu hút những người hành hương từ khắp nơi... trong đó có ta."
 ###Buddhism
 #Bodh Gaya
  pilgrimage.5401.t:0 "Bodh Gaya"
  pilgrimage.5401.desc:0 "Ta đã đến nơi linh thiêng nhất trên thế giới đối với Phật tử, Bodh Gaya là nơi [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] đã đạt được giác ngộ dưới gốc cây Bồ đề.\n\nKể từ đó, ngôi đền Mahabodi tinh xảo đã được xây dựng xung quanh cái cây thiêng liêng, và những người hành hương từ khắp nơi trên thế giới đổ về đây để tìm hiểu thêm về câu chuyện của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] và tôn vinh cuộc đời của [ROOT.Char.GetFaith.HighGodHerHis]."
 #Kushinagar
  pilgrimage.5411.t:0 "Kushinagar"
  pilgrimage.5411.desc:0 "Cuối cùng ta đã tới Kushinagar, nơi được cho là [ROOT.Char.GetFaith.HighGodName] rời bỏ cõi trần.\n\nĐã đạt Niết-bàn khi còn sống, cái chết của [ROOT.Char.GetFaith.HighGodHerHis] được xem là điều đáng tôn vinh, bởi [ROOT.Char.GetFaith.HighGodNameSheHe] đạt tới Parinirvana sau khi qua đời và thoát khỏi vòng luân hồi tái sinh. Sự giải thoát này — moksha — là mục tiêu tối thượng của một Phật tử sùng đạo."
 #Sarnath
  pilgrimage.5421.t:0 "Sarnath"
  pilgrimage.5421.desc:0 "Hành trình của ta cuối cùng đã đưa ta đến Sarnath, địa điểm nơi [ROOT.Char.GetFaith.HighGodName] lần đầu tiên dạy bốn sự thật cao quý cho các tín đồ của [ROOT.Char.GetFaith.HighGodHerHis] cũng như những giáo lý liên quan đến nó.\n\nChính tại đây, ngôi trường Phật giáo đầu tiên đã được thành lập, nơi mà ngày nay vẫn thu hút những người hành hương từ khắp nơi trên thế giới."

 ###Dharmic
 #Parikrama
  pilgrimage.5445.t: "Parikrama"
  pilgrimage.5445.desc: "Ta thu vào tầm mắt vùng [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] với địa hình [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] hùng vĩ của nó, rồi tiếp tục bước sang chặng kế tiếp của chuyến [Glossary('Yatra', 'YATRA_GLOSS')] của ta. Ta dâng lên [ROOT.Char.GetFaith.HighGodName] lòng tôn kính thông qua nghi lễ [Glossary('Puja', 'PUJA_GLOSS')]. Sau đó ta hòa vào đám đông trên con đường [Glossary('Pradakshina', 'PRADAKSHINA_GLOSS')], đi vòng quanh thánh điện theo chiều kim đồng hồ."
  pilgrimage.5445.a: "$pilgrimage.4001.a$"
  pilgrimage.5445.a_dead: "$pilgrimage.4001.a_dead$"
  pilgrimage.5445.a_cynical: "$pilgrimage.4001.a_cynical$"
  PUJA_GLOSS: "Puja là những biểu hiện của sự tôn kính, thờ phụng và lòng sùng mộ được tín đồ Ấn giáo và Phật giáo thực hành."
  PRADAKSHINA_GLOSS: "Từ tiếng Phạn nghĩa là “ở bên phải”, chỉ con đường mà người ta đi vòng quanh thánh điện theo hướng mặt trời trong nghi thức Ấn giáo và Phật giáo. Điều này được thực hiện để cầu mong một kiếp tái sinh tốt lành."
 ###Jainism
 #Shikharj
  pilgrimage.5501.t:0 "Shikharji"
  pilgrimage.5501.desc:1 "Theo Nirvana Kanda, hai mươi trong số hai mươi bốn vị Tirthankara của Kỳ Na giáo đã đạt đến Moksha tại ngọn núi Shikharji này. Lịch sử huy hoàng ấy khiến nơi đây trở thành địa điểm hành hương quan trọng nhất của cộng đồng Kỳ Na, và khi ánh mắt ta dõi từ những đỉnh núi cao nhất xuống tận vùng thấp xa xăm, ta không khỏi suy ngẫm về hành trình của chính mình tới đây và ý nghĩa của nó đối với cuộc đời ta."
 ###Zoroastrian
 #Ushi-darena
  pilgrimage.5601.t:0 "Ý Thức Thiêng Liêng"
  pilgrimage.5601.desc:0 "Khi ta đứng trên sườn núi Ushi-darena, cảnh tượng vùng đất phía dưới trải rộng trước mắt. Đối diện khung cảnh hùng vĩ ấy, ta không khỏi nghĩ đến việc Zoroaster đã đạt được giác ngộ tại nơi này, tiếp nhận tri thức từ Ahura Mazda để truyền bá xuống thế gian. Giống như hầu hết những kẻ hành hương nơi đây, ta không cảm nhận được tia sáng tiên tri nào, nhưng dù vậy ta vẫn không khỏi kinh ngạc trước cảnh tượng trước mắt."
 ###Norse Germanic
 #Paderborn
  pilgrimage.5901.t:0 "Paderborn!"
  pilgrimage.5901.desc:0 "Sâu trong rừng Paderborn xưa kia từng tồn tại Irminsul, Đại Trụ. Công trình ấy được dựng lên để tôn vinh Odin, nhưng đã bị Charlemagne phá hủy trong các cuộc Chiến tranh Saxon. Dẫu vậy dân tộc ta vẫn tiếp tục kéo đến nơi từng đặt thánh trụ ấy để tưởng nhớ. Nay ta cũng có thể nói rằng mình đã thực hiện chuyến hành hương đến chốn linh thiêng này."
 ###Tengri
 #Open Blue Skies
  pilgrimage.5911.t:0 "Bầu Trời Xanh Mênh Mông"
  pilgrimage.5911.desc:1 "Thế giới là ngôi đền của [ROOT.Char.GetFaith.HighGodNamePossessive], bầu trời xanh bao la còn vĩ đại hơn cả trần nhà của bất kỳ nhà thờ Hồi giáo hay nhà thờ nào. Ở đây, trên những thảo nguyên bao la của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ta cảm thấy đặc biệt gần gũi với [ROOT.Char.GetFaith.PantheonTerm], và nhận thấy mình đang suy ngẫm về hành trình để đến được địa điểm thiêng liêng này."
 ###Sanctity of Nature
 #Sacred Groves
  pilgrimage.5921.t:0 "Rừng Thiêng"
  pilgrimage.5921.desc:1 "Cuối cùng ta cũng đã tới [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Trong khi có kẻ thờ phụng nơi giáo đường hay đền thờ, ta biết rằng chốn thiêng liêng nhất chính là khu rừng rộng mở, nơi đôi chân trần được vuốt ve bởi mặt đất mềm mại nuôi dưỡng vạn vật.\n\nNhững khu rừng cổ thụ nơi đây đặc biệt đáng kính, và khi đứng giữa những đại thụ cao lớn, ta không khỏi tự hỏi mình có vị trí ra sao trong thế giới tự nhiên."

 ###Remaining at a Holy Site events
 #Appreciation
  pilgrimage.6500.t:1 "Sự Trân Trọng"
  pilgrimage.6500.desc:1 "[pilgrimage_member.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', pilgrimage_member)] của ta, nhìn ra thánh địa rộng lớn [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] khi chúng ta len qua đám đông:\n\n\"[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] quả thật là cảnh tượng đáng chiêm ngưỡng! Nơi mà các nền văn hóa gặp gỡ và những tín đồ của nhiều đức tin cùng hội tụ để thờ phụng. Chẳng phải chúng ta thật may mắn khi được trải nghiệm sự gần gũi và tình đồng hành như vậy sao?\"\n\n[pilgrimage_member.GetSheHe|U] nhìn ta với vẻ mong đợi."
  pilgrimage.6500.a:1 "Ta #EMP biết chứ!#! Hãy tận hưởng điều này!"
  pilgrimage.6500.a.tt:0 "Văn hóa của ngươi không có truyền thống [GetCultureTradition('tradition_xenophilic').GetName]"
  pilgrimage.6500.b:0 "Những điều tâm linh có thể đạt được thật phi thường!"
  pilgrimage.6500.c:0 "Con người xây nên nơi này, không phải thần linh."
 #Lost in Translation
  pilgrimage.6510.t:1 "Lạc Trong Dịch Thuật"
  pilgrimage.6510.desc:1 "Khi ta dạo bước trên các con phố của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ta dừng lại trước một [ROOT.Char.GetFaith.HouseOfWorship] nhỏ. Tòa nhà trông khá đơn giản và khiêm tốn, nhưng một nhóm người hành hương đã tụ tập trước đó.\n\nKhi tiến lại gần, ta nhận ra họ đang gãi đầu bối rối cố hiểu tấm bảng đặt cạnh một bức tượng canh gác, vì dòng chữ trên đó được viết bằng một ngôn ngữ xa lạ.\n\nĐây có thể là cơ hội để ta giúp đỡ những người hành hương khác!"
  pilgrimage.6510.a:1 "#EMP Ta#! sẽ dịch cho các ngươi!"
  pilgrimage.6510.a.flavor:0 "Ta không thể tin tấm bảng này lại có #EMP lỗi chính tả!#!"
  pilgrimage.6510.b:0 "Tấm bảng kia viết gì...?"
  pilgrimage.6510.b_success.t:0 "Giải Được Tấm Bảng"
  pilgrimage.6510.b_success.desc:0 "Ngươi giải được nội dung tấm bảng"
  pilgrimage.6510.b_failure.t:0 "Không Thể Hiểu"
  pilgrimage.6510.b_failure.desc:0 "Tấm bảng vẫn là điều bí ẩn"
  pilgrimage.6510.c:0 "Chuyện này chẳng đáng bận tâm."
 #Time To Go Home Soon?
  pilgrimage.6520.t:0 "Đã Đến Lúc Trở Về?"
  pilgrimage.6520.desc:1 "[impatient_pilgrim.GetTitledFirstName] đi lại xung quanh với đoàn hành hương của chúng ta, thở dài ầm ĩ và lê đôi chân của [impatient_pilgrim.GetHerHis]: \"Cảm giác như chúng ta đã ở đây từ lâu lắm rồi. Chẳng phải đã đến lúc bắt đầu quay trở về nhà sớm hay sao?\" [impatient_pilgrim.GetSheHe] lầm bầm một cách thiếu kiên nhẫn.\n\nTa liếc nhìn [impatient_pilgrim.GetHerHim] một cái, và"
  pilgrimage.6520.desc_forgiving:0 "cảm thấy đôi chút cảm thông cho [impatient_pilgrim.GetHerHim]. Bị kéo đi mãi cũng chẳng vui vẻ gì."
  pilgrimage.6520.desc_nonforgiving:0 "không thể tin nổi sự #EMP hỗn xược#! của [impatient_pilgrim.GetHerHim]. Ta siết chặt nắm tay."
  pilgrimage.6520.a:1 "Ngươi #EMP dám#! hỗn xược như vậy sao!"
  pilgrimage.6520.b:0 "Lại đây, để ta cho ngươi xem bức tượng tuyệt diệu kia."
  pilgrimage.6520.c:0 "Ta hiểu ý ngươi."
 #Fishy local guide?
  pilgrimage.6530.t:0 "Những Trải Nghiệm Mới"
  pilgrimage.6530.desc_intro:0 "Khi chúng ta đi ngang qua các quầy hàng của khu chợ [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], một"
  pilgrimage.6530.desc_adult:0 "[local_guide.GetWomanMan] kỳ lạ. [local_guide.GetSheHe|U] không hề ngần ngại khi nói với chúng ta:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], người trông giống như một [ROOT.Char.GetWomanMan] quý phái lịch lãm! Ta biết một trải nghiệm đơn giản là #EMP thiêng liêng#! không xa [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], điều này chắc chắn sẽ gây hứng thú cho bất kỳ người hành hương tận tụy nào!\""
  pilgrimage.6530.desc_child:0 "đứa trẻ nhỏ với đôi mắt to, sáng. [local_guide.GetSheHe|U] nhìn chúng ta khi [local_guide.GetSheHe] thốt lên:\n\n\"Ta biết một nơi bí mật nơi [ROOT.Char.GetFaith.HighGodName] sống!\" [local_guide.GetSheHe] tạo vẻ mặt kiên quyết khi tiếp tục: \"Ta có thể chỉ cho người nếu người muốn?\""
  pilgrimage.6530.desc_warning:0 "\n\n[warning_character.GetTitledFirstName], ở bên phải ta, cau mày và lắc đầu của [warning_character.GetHerHis] một cách tinh tế. Một lời cảnh báo?"
  pilgrimage.6530.desc_learned:0 "\n\nSau khi nghiên cứu bản đồ, ta biết phía đó của [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] chẳng có gì ngoài vùng đất hoang nguy hiểm."
  pilgrimage.6530.a:0 "Nghe cũng khiến ta tò mò."
  pilgrimage.6530.a_child.tt:0 "Ngươi đi theo đứa trẻ"
  pilgrimage.6530.divinity.desc:0 "[local_guide.GetShortUIName] dẫn ngươi tới một trải nghiệm thật sự thần diệu"
  pilgrimage.6530.dangerous.desc:0 "Ngươi bị lừa vào tình huống nguy hiểm"
  pilgrimage.6530.b:0 "[ROOT.Char.GetFaith.HighGodName] cũng sẽ mỉm cười với các [local_guide.GetWomenMen] con."
  pilgrimage.6530.b_child:0 "Nói dối không hợp với ngươi đâu, đứa trẻ."
  pilgrimage.6530.b.flavor:0 "[local_guide.GetShortUIName] vội vàng chạy đi."
  pilgrimage.6530.c:0 "Cho ta một lý do để ta không giao ngươi cho lính."
  pilgrimage.6530.c.flavor:0 "Ai cũng phải trả giá cho tội lỗi của mình."
  pilgrimage.6530.d:0 "Ngươi định lừa #EMP ta#! sao, tên dân đen?!"
  pilgrimage.6530.d.flavor:0 "Ta sẽ dạy [local_guide.GetHerHim] thế nào là thành thật!"
  pilgrimage.6530.e:0 "Ta không hứng thú."
 #Fishy guide not so fishy actually
  pilgrimage.6531.t:0 "Thần Tính Ẩn Giấu"
  pilgrimage.6531.desc_wellspring:0 "Cách [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] một quãng khá xa, chúng ta đột ngột dừng lại. Người dẫn đường [local_guide.GetTitledFirstName] chỉ cho chúng ta một lối đi bí mật và chúng ta bước vào một hang động nhỏ, được chiếu sáng bởi ánh ban ngày rọi qua lỗ trên mái.\n\nChính từ lỗ ấy, một mạch nước kỳ diệu chảy xuống êm đềm. Dòng nước tỏa ánh sáng thần thánh và những cầu vồng sương mờ nhạt nhuộm màu không khí xung quanh."
  pilgrimage.6531.desc_crystal_cavern:0 "Khi ta bắt đầu tự hỏi liệu chúng ta có bao giờ đến nơi hay không, người dẫn đường [local_guide.GetTitledFirstName] đột ngột rẽ trái và trước khi kịp nhận ra chúng ta đã bước vào một hang động ẩn trong vùng quê.\n\nMột ánh sáng mờ dần dần mạnh lên phản chiếu trên trang bị của chúng ta khi chúng ta bước vào một hang lớn phủ đầy hàng trăm tinh thể. Những tinh thể bắt lấy ánh sáng từ lỗ trên trần và đoàn người, kể cả ta, không khỏi kinh ngạc trước cảnh tượng ấy."
  pilgrimage.6531.desc_non_cynical:0 "\n\nTa chưa từng cảm nhận sự hiện diện của [ROOT.Char.GetFaith.HighGodNamePossessive] mạnh mẽ đến vậy."
  pilgrimage.6531.desc_cynical:0 "\n\nĐây quả là một kỳ quan thiên nhiên đáng kinh ngạc, ta phải thừa nhận."
  pilgrimage.6531.a:0 "Thật phi thường!"
 #Fishy guide _was_ fishy!
  pilgrimage.6532.t:0 "Con Mồi Hành Hương!"
  pilgrimage.6532.desc:0 "Tiếng huýt sáo vô tư của người dẫn đường [local_guide.GetTitledFirstNamePossessive] là điều cuối cùng chúng ta nghe thấy trước khi lũ côn đồ xuất hiện từ hư không, ở nơi cách xa [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]. Đây là một cái bẫy, và giờ chúng ta bị cô lập không còn hy vọng được cứu giúp.\n\nMạch đập của ta dồn dập khi ta cố nghĩ ra bước tiếp theo. Chúng dám săn đuổi những kẻ hành hương sao?"
  pilgrimage.6532.a:0 "[6532_protector.GetTitledFirstNameNoTooltip]! Xử lý chúng!"
  pilgrimage.6532.a_success.t:0 "Bọn Ác Bị Đuổi Đi"
  pilgrimage.6532.a_success.desc:0 "[6532_protector.GetShortUIName] đã dọa chạy lũ côn đồ"
  pilgrimage.6532.a_failure.t:0 "Bị Thương"
  pilgrimage.6532.a_failure.desc:0 "[6532_protector.GetShortUIName] bị thương trong cuộc chiến"
  pilgrimage.6532.b:0 "#EMP Sức mạnh của [ROOT.Char.GetFaith.HighGodNameAlternate] khiến các ngươi phải lùi bước!#!"
  pilgrimage.6532.c:0 "Đây là nơi linh thiêng! Các ngươi không biết kính sợ thần linh sao?!"
  pilgrimage.6532.c_success.t:0 "Bọn Ác Bị Xua Đuổi"
  pilgrimage.6532.c_success.desc:0 "Ngươi đã xua đuổi bọn chúng thành công"
  pilgrimage.6532.c_failure.t:0 "Bị Cướp"
  pilgrimage.6532.c_failure.desc:0 "Ngươi bị cướp"
 #Fishy child breaks down
  pilgrimage.6533.t:0 "Thời Thế Khốn Khó"
  pilgrimage.6533.desc:0 "Cách [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] một đoạn, khi chúng ta rẽ vào một góc khác, người dẫn đường nhí [local_guide.GetTitledFirstName] dừng khựng lại trong bước chân của [local_guide.GetHerHis]. Cơ thể nhỏ bé bắt đầu run rẩy và ta có thể nghe thấy một tiếng sụt sịt bị kiềm chế khi [local_guide.GetSheHe] cố gắng che giấu việc [local_guide.GetSheHe] đang khóc.\n\n\"Con... xin lỗi m'[ROOT.Char.GetLadyLord], họ buộc con phải làm vậy. Em gái bé bỏng của con bị ốm và chúng con đã không ăn gì trong nhiều ngày... ,\" [local_guide.GetSheHe] nhìn ra xa, đôi mắt to sáng đột nhiên sợ hãi. \"Chúng ta nên quay lại,\" [local_guide.GetSheHe] thì thầm, một cách thận trọng."
  pilgrimage.6533.a:0 "Đứa trẻ đáng thương, sự thành thật của ngươi khiến ta cảm động."
  pilgrimage.6533.a.flavor:0 "Hãy giúp đứa trẻ tội nghiệp này."
  pilgrimage.6533.b:0 "Hành động #EMP đê tiện#! như vậy."
  pilgrimage.6533.b.flavor:0 "Tòng phạm của tội ác!"
 #Find some exotic wares
  pilgrimage.6540.t:0 "Ngài Có Hứng Thú Với..."
  pilgrimage.6540.desc:0 "Khi ta bước trên các con phố của [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], hàng hóa của một khu chợ địa phương thu hút ánh nhìn của ta.\n\nMột thương nhân cười với ta rồi nói: \"Ta có hàng hóa, nếu [ROOT.Char.GetLadyLord] có tiền!\"\n\nNhững món đồ lạ này có thể mang lại lợi nhuận lớn khi đem về quê nhà... hoặc có lẽ đáng để giữ làm quà."
  pilgrimage.6540.a:0 "Lô hàng này có vẻ là khoản đầu tư khôn ngoan!"
  pilgrimage.6540.a.flavor:0 "Ta hẳn có thể dễ dàng kiếm gấp đôi."
  pilgrimage.6540.a.tt:0 "Ngươi mua những món hàng lạ"
  pilgrimage.6540.b:0 "Mấy món kia trông khá thú vị."
  pilgrimage.6540.b.flavor:0 "Ta có thể dễ dàng kiếm gấp ba."
  pilgrimage.6540.c:0 "Của cải thế tục ư? Thật tầm thường."
 #Repentance
  pilgrimage.6750.t:0 "Sám Hối tại [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
  pilgrimage.6750.desc.intro:0 "Khi ta bước vào [ROOT.Char.GetFaith.HouseOfWorship], một cảm giác tội lỗi nặng nề ập đến. Ánh sáng — chiếu rọi bàn thờ như một ngày hè rực rỡ — dày đặc đến mức ta có cảm giác mình có thể chạm vào nó.\n\nTa đang sống cuộc đời kiểu gì? Ta có thể là một [ROOT.Char.GetTitleAsNameNoTooltip] như thế nào? Hay một [ROOT.Char.GetMotherFather]? Hay một [ROOT.Char.Custom('GetDaughterSon')]?\n\nNếu ta không thay đổi"
  pilgrimage.6750.desc.secret:0 "[repent_trait.GetNameNoTooltip]"
  pilgrimage.6750.desc.drunkard:0 "[GetTrait('drunkard').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.hashishiyah:0 "[GetTrait('hashishiyah').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.rakish:0 "[GetTrait('rakish').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.irritable:0 "[GetTrait('irritable').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.flagellant:0 "[GetTrait('flagellant').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.contrite:0 "[GetTrait('contrite').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.profligate:0 "[GetTrait('profligate').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.comfort_eater:0 "[GetTrait('comfort_eater').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.inappetetic:0 "[GetTrait('inappetetic').GetName( ROOT.Char )]"
  pilgrimage.6750.desc.outro:0 "bản tính của mình, thì ánh sáng duy nhất ta còn thấy sẽ là ngọn lửa của [ROOT.Char.GetFaith.NegativeAfterLife]."
  pilgrimage.6750.a:0 "\"Tại đây, ta được sinh ra là một [ROOT.Char.GetWomanMan] mới.\""
  pilgrimage.6750.b:0 ""Vậy thì trong lúc này ta cứ tận hưởng đã.""
 #Theological Debate
  pilgrimage.6760.t:0 "Cuộc Tranh Luận tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
  pilgrimage.6760.desc.intro:0 "Khi chúng ta lắng nghe lời cầu nguyện buổi sáng, ta và [bishop_pilgrim.GetTitledFirstName] bắt đầu một cuộc trò chuyện sôi nổi nhanh chóng chuyển sang vấn đề thần học.\n\n"
  pilgrimage.6760.desc.christian:0 ""Sẽ thật ngu xuẩn nếu nói rằng 'được tạo thành xác thịt' nghĩa là Chúa Kitô một cách khó hiểu và không thể giải thích đã từ Ngôi Lời mà trở thành con người, hợp nhất trong cùng một bản thể."\n\n"Nhưng như chính Nestorius đã nói," [bishop_pilgrim.GetTitledFirstName] phản bác, "con người Kitô cũng có thể trở nên thần thánh, là con bởi ân sủng chứ không phải bởi bản tính.""
  pilgrimage.6760.a:0 ""Ta sẽ không nghe những lời báng bổ ngu xuẩn này!""
  pilgrimage.6760.b:1 ""Và ngươi cũng biết Công đồng Ephesus đã xử lý #EMP hắn#! ra sao rồi đấy.""
  pilgrimage.6760.b.success:0 "[bishop_pilgrim.GetShortUIName] bị thuyết phục"
  pilgrimage.6760.b.failure:0 "[bishop_pilgrim.GetShortUIName] vẫn giữ lập trường của [bishop_pilgrim.GetHerHis]"
  pilgrimage.6760.c:0 ""Nói hay lắm, bằng hữu. Giờ chúng ta đi dạo thôi.""
 #Do you wanna buy a cool relic?
  pilgrimage.6770.t:0 "Thánh Tích Thật Sự"
  pilgrimage.6770.desc.intro:0 "Khi ta dạo quanh các quầy hàng trong chợ — tránh càng nhiều món ăn địa phương càng tốt — ta nhận thấy một đám đông lớn tụ tập quanh một thương nhân.\n\n\"Lại đây mua một thánh tích thật sự với cái giá khiến [ROOT.Char.GetFaith.WealthGodName] phải cười suốt nhiều thập kỷ. Đó là"
  pilgrimage.6770.desc.christian:0 "[SCOPE.Custom('ChristianRelicName')|U]!\""
  pilgrimage.6770.desc.islam:0 "[SCOPE.Custom('IslamRelic')|U]!\""
  pilgrimage.6770.desc.buddhist:0 "[SCOPE.Custom('BuddhismRelicName')|U]!\""
  pilgrimage.6770.desc.judaism:0 "[SCOPE.Custom('JudaismRelicName')|U]!\""
  pilgrimage.6770.desc.fallback:0 "[merchant_relic.GetName|U]!\""
  pilgrimage.6770.desc.outro:0 "Được tìm thấy ngay tại thánh địa này chỉ vài ngày trước!\""
  pilgrimage.6770.a:0 "Nó #EMP phải#! thuộc về ta."
  pilgrimage.6770.b:0 ""Ta chắc rằng ngươi không muốn bán thánh tích với cái giá tham lam..."""
  pilgrimage.6770.b.success:0 "[relic_merchant.GetShortUIName] giảm giá"
  pilgrimage.6770.b.failure:0 "[relic_merchant.GetShortUIName] bị xúc phạm bởi đề nghị của ngươi"
  pilgrimage.6770.c:0 ""Ta còn nhiều thứ đáng để tiêu vàng hơn.""
  pilgrimage.6770.d:0 ""Thứ này trông không thật lắm..."""
 #Recruit skillful local
  pilgrimage.6780.t:0 "Một Cận Thần Tài Giỏi"
  pilgrimage.6780.desc:0 "Một [ROOT.Char.GetWomanMan] chỉ có thể cầu nguyện đến một mức độ nhất định mà không tìm kiếm những cách quan trọng khác để dành thời gian của mình. Và [current_employer.GetTitledFirstName] có một dinh thự đáng yêu mà [current_employer.GetSheHe] rất tử tế cho phép ta đến thăm.\n\nTa nghe thấy vài giọng nói phát ra từ một trong những căn phòng, \"...và bằng cách làm điều này, bạn sẽ đạt được kỹ thuật vĩ đại nhất.\" Ta hé nhìn vào trong và thấy [stolen_courtier.GetTitledFirstName], đang giải thích nghề của [stolen_courtier.GetHerHis] cho một nhóm các triều thần quan tâm, những người đang háo hức làm theo những lời dạy của [stolen_courtier.GetHerHis]."
  pilgrimage.6780.a:0 "Thật là một bậc thầy tài hoa, có lẽ ta nên thuê [stolen_courtier.GetHerHim]."
  pilgrimage.6780.b:0 ""Một chuyên gia như vậy thật lãng phí ở triều đình này..."""
  pilgrimage.6780.b.success.t:0 "Chiêu Mộ Thành Công"
  pilgrimage.6780.b.success.desc:0 "[stolen_courtier.GetShortUIName] gia nhập triều đình của ngươi"
  pilgrimage.6780.b.failure.t:0 "Từ Chối Lời Mời"
  pilgrimage.6780.b.failure.desc:0 "[stolen_courtier.GetShortUIName] từ chối đề nghị của ngươi"
  pilgrimage.6780.c:0 "Một người không đáng để ta chọc giận [current_employer.GetTitledFirstNameNoTooltip]."
  obligation_hook_salary:0 "Lương Nghĩa Vụ"
  obligation_hook_tt:0 "#EMP Nghĩa vụ#! [hooks|E] giảm lương [court_position|E] đi [gold_i]#P -50%#!"
  generic_cp_discount: "Giảm Giá Hợp Đồng"
 #Meet local guru - trait flipping event
  pilgrimage.6790.t:0 "Sự Giác Ngộ Tâm Linh tại [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
  pilgrimage.6790.desc:0 "\"[spiritual_mentor.GetSheHe|U] là [spiritual_mentor.GetWomanMan] giỏi nhất trên khắp trái đất. [spiritual_mentor.GetSheHe|U] dành mỗi ngày để canh giữ địa điểm linh thiêng, mỗi đêm canh thức [spiritual_mentor.GetSheHe] quay trở lại trại của [spiritual_mentor.GetHerHis], ngay bên ngoài thành phố, và cầu nguyện cho đến khi bình minh ló dạng và mặt trăng rời đi.\"\n\nTa hít một hơi thật sâu trước khi đến gần đống lửa nơi [spiritual_mentor.GetSheHe] nghỉ ngơi, sau khi nghe về những kỳ tích của [spiritual_mentor.GetHerHis].\n\n\"Ta đã chờ đợi người,\" [spiritual_mentor.GetSheHe] nói, nhìn thẳng vào ta, \"và [spiritual_mentor.GetFaith.HighGodName] cũng vậy. Người đã sẵn sàng từ bỏ những cách sống [ROOT.Char.Custom('SinfulTrait')|l] của mình chưa?\""
  pilgrimage.6790.a:0 ""Ta sẵn sàng. Ta #EMP thật sự#! sẵn sàng.""
  pilgrimage.6790.b:0 ""Ta hứng thú với giáo huấn của ngươi hơn.""
  pilgrimage.6790.c:0 ""Ta không cần thay đổi #EMP bất cứ thứ gì#! về bản thân.""
 #Entourage member feels The Calling
  pilgrimage.6800.t:0 "Tiếng Gọi"
  pilgrimage.6800.desc:0 "Khi ta bước vào khu đất thiêng, ta thấy [called_member.GetTitledFirstName] đứng nhìn bàn thờ với ánh mắt vô hồn.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [called_member.GetSheHe] nói bình thản, \"ta có điều muốn thưa. [called_member.GetFaith.HighGodName] đã nói với ta và giọng nói của [called_member.GetFaith.HighGodHerHis] rõ ràng, nghiêm khắc, chính xác.\"\n\n\"Nếu được ở lại, ta muốn dâng hiến đời mình cho đức tin [called_member.GetFaith.GetName] và trở thành một [GetTrait('devoted').GetName( called_member )].\""
  pilgrimage.6800.a:0 ""Ta hiểu. Ngươi phải làm điều ngươi tin là đúng.""
  pilgrimage.6800.b:0 ""Chẳng phải ở quê nhà chúng ta cũng có [ROOT.Char.GetFaith.HouseOfWorshipPlural] sao?"""
  pilgrimage.6800.c:0 ""Dừng ngay những lời vô nghĩa đó.""
  pilgrimage.6800.d:0 ""Ở lại? Để #EMP âm mưu#! chống lại ta sao? Không đời nào!""
  pilgrimage.6800.e:0 ""Tuyệt vời! Ta cũng sẽ quyên góp một ít!"""
  pilgrimage.6800.e.tt:0 "Giới giáo sĩ địa phương sẽ rất cảm kích cử chỉ này"
 #Do you wanna buy an indulgence?
  pilgrimage.6810.t:0 "Ân Xá"
  pilgrimage.6810.desc:0 "\"...giờ con có thể đi.\" Ta nghe [bishop_pilgrim.GetTitledFirstName] lẩm bẩm khi ta bước vào [ROOT.Char.GetFaith.HouseOfWorship]. Người hành hương cúi đầu rời đi và ta thấy tay vị giáo sĩ lấp lánh vàng.\n\n\"À, [ROOT.Char.GetTitleAsNameNoTooltip] thân mến, ngài cũng muốn được tha tội chăng? [religious_head_scope.GetTitledFirstName] đã ban lệnh cấp ân xá cho mọi người hành hương đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] — với mức giá thích hợp, tất nhiên.\""
  pilgrimage.6810.a:0 ""Xin hãy cầu khẩn [ROOT.Char.GetFaith.HighGodName] thay ta.""
  pilgrimage.6810.b:0 "Có lẽ nên mua một cái cho [my_heir.GetFirstNameNoTooltip]."
  pilgrimage.6810.c:0 ""Làm sao có thể mua được cánh cổng vào [ROOT.Char.GetFaith.DivineRealm]?"""
 #Do you wanna buy a pilgrim's guide?
  pilgrimage.6820.t:0 "Cẩm Nang Hành Hương"
  pilgrimage.6820.desc:0 "Khu chợ của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] nhộn nhịp với những thương nhân hô lớn bằng những ngôn ngữ ta chưa từng nghe và bán những loại gia vị ta chưa từng nếm.\n\n\"Cẩm nang cho người hành hương! Học những con đường an toàn nhất, khám phá những kỳ quan của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!\" một người hét lên, vẫy cuốn sách nhỏ trước mặt ta."
  pilgrimage.6820.a:0 ""Ta sẽ lấy một cuốn!"""
  pilgrimage.6820.b:0 ""Để ta xem thử — à! Nếu rẽ hướng này..."""
  pilgrim.6820.b.flavor:0 "Ta chắc mình từng thấy cuốn sách này trước đây..."
  pilgrimage.6820.c:0 "[ROOT.Char.GetFaith.HighGodName] sẽ dẫn đường cho ta."
  pilgrim_guide_artifact:0 "Cẩm Nang Hành Hương"
  pilgrim_guide_artifact_desc:0 "Một cuốn sách mô tả những con đường an toàn nhất cho người hành hương, cùng các địa điểm đáng chú ý tại thánh địa."
 #Admire the holy site in a religious way
  pilgrimage.6830.t:0 "Tĩnh Lặng"
  pilgrimage.6830.desc:0 "Tiếng vang từ chính bước chân ta là âm thanh duy nhất trong [ROOT.Char.GetFaith.HouseOfWorship]. Ta ở một mình. Điều cuối cùng ta nhớ từ thế giới bên ngoài là gương mặt những kẻ ăn xin gần cổng và bầu trời xanh thẳm. Giờ đây tất cả thật xa xôi.\n\nTa bước về phía bàn thờ, biết rằng chỉ có mình ta nhưng vẫn cảm thấy bị dõi theo — ánh mắt nghiêm khắc của [ROOT.Char.GetFaith.HighGodName] luôn mở rộng."
  pilgrimage.6830.a:0 "Đã đến lúc cầu nguyện."
  pilgrimage.6830.b:0 "Những mái vòm kia... thật đẹp."
  pilgrimage.6830.c:0 "Ta nên dâng lễ vật."
  pilgrimage.6830.c.tt:0 "Ngươi sẽ mất [votive_artifact.GetName]"
 #Ask a local priest to bless your artifact
  pilgrimage.6840.t:0 "Phúc Lành Vật Chất"
  pilgrimage.6840.desc:0 "Một người hành hương đặt búp bê lễ vật trước bàn thờ rồi cúi đầu. Ta thấy [blessed_bishop.GetTitledFirstName] ban phúc cho nàng và thì thầm điều gì đó vào tai nàng: \"...thiêng liêng\" ta nghe loáng thoáng.\n\nVị [blessed_bishop.GetFaith.BishopNeuter] ra hiệu, \"Ngài cũng mang theo thứ gì để được ban phúc chăng, [ROOT.Char.GetTitleAsNameNoTooltip] thân mến?\""
  pilgrimage.6840.a:0 ""Xin hãy khiến [blessed_artifact.GetNameNoTooltip] của ta trở nên linh thiêng hơn!"""
  pilgrimage.6840.b:0 ""Hãy để mọi người thấy danh tiếng của [blessed_artifact.GetNameNoTooltip] của ta!"""
  pilgrimage.6840.c:0 "Ta có việc đáng làm hơn với số vàng của mình."
  pilgrimage.6840.a.tt:0 "Nhận [piety_i|E]#positive_value +2%#! [piety|E] mỗi tháng"
  pilgrimage.6840.b.tt:0 "Nhận [prestige_i|E]#positive_value +0.5%#! [prestige|E] mỗi tháng"
  blessed_artifact_desc:0 "[blessed_artifact.GetDesc]\n\nNó tỏa ra hào quang tinh khiết sau khi được ban phúc tại Thánh Địa [holy_site_scope.GetNameNoTooltip]."

# A Master Thief
# by Laurence Kennedy
  pilgrimage.6850.t: "Một Bậc Thầy Trộm Cắp"
  pilgrimage.6850.desc: "Ta tỉnh dậy sau giấc ngủ chập chờn và trước mặt trong bóng tối hiện ra một bóng người. Khi ta đang suy ngẫm về kiếp sống tiếp theo của mình, [wise_priest.GetName] bước ra từ bóng tối, gương mặt [wise_priest.GetHerHis] bừng lên với một nụ cười mỉa mai.\n\n“Thưa ngài [ROOT.Char.GetTitleAsNameNoTooltip] cao quý, xin thứ lỗi cho sự xâm nhập của chúng ta, có những bài học chỉ có thể hiểu được khi tự mình trải nghiệm.\n\nMột tên trộm lợi dụng bóng tối, điểm mù và những quan lại tham nhũng để hỗ trợ cho tội ác của [fake_thief.GetHerHis]. Tương tự như vậy, một [ROOT.Char.GetFaith.PriestNeuter] tà ác sẽ buông thả trong bóng tối, rao giảng giáo lý sai lạc nơi điểm mù của ngài và được những quan chức tham nhũng nâng lên địa vị cao.""
  pilgrimage.6850.a: "Ta sẽ chiếu sáng nơi nào có bóng tối."
  pilgrimage.6850.b: "Nếu ta mù lòa thì [ROOT.Char.GetCouncillorPosition( 'councillor_spymaster' ).GetPositionName] của ta sẽ là đôi mắt của ta."
  pilgrimage.6850.c: "Ta biết một quan chức tham nhũng cũng là một [ROOT.Char.GetFaith.PriestNeuter] tà ác."
  pilgrimage.6850.c.flavor: "Ngươi tống giam [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của mình"
 ###Conclusion events
 #Summarizing our activity
  pilgrimage.7000.t:0 "Kết Luận"
  pilgrimage.7000.t_hajj:0 "$pilgrimage_header$ Tawaf al-Wadaa"
  pilgrimage.7000.t_obligatory:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]: ... Xong Việc"
  pilgrimage.7000.desc_obligatory:0 "Sau khi vội vàng hoàn tất chuyến thăm nơi đây, điều ta quan tâm nhất là trở về nhà để tiếp tục những công việc thường nhật của mình.\n\nHy vọng [ROOT.Char.GetFaith.HighGodNameAlternate] sẽ hiểu rằng ta đang bị thời gian thúc ép, nhưng ta vẫn có thể nhận được sự hài lòng của [ROOT.Char.GetFaith.HighGodHerHis] đối với [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] của ta.\n\nDù sao đi nữa, các [ROOT.Char.GetFaith.AltPriestTermPlural] của ta cũng sẽ không có gì để phàn nàn."
  pilgrimage.7000.intro:0 "Khi thời gian của chúng ta tại thánh địa này dần đi đến hồi kết,"
  pilgrimage.7000.intro_hajj:0 "Kỳ Hajj năm nay sắp đi đến hồi kết. Sau hai ngày thực hiện Ramy al-Jamarat, hay còn gọi là 'ném đá quỷ dữ', ta đã sẵn sàng hoàn thành nghi lễ cuối cùng Tawaf al-Wadaa và nói lời tạm biệt với Mecca.\n\n"
  pilgrimage.7000.desc_perfect_pious:0 "Ta vô cùng hân hoan khi chuyến hành hương này có thể xem là một trong những — nếu không muốn nói là #EMP chuyến hành hương#! — sùng đạo nhất trong lịch sử. [ROOT.Char.GetFaith.HighGodNameAlternate] đang mỉm cười với ta."
  pilgrimage.7000.desc_high_pious:0 "Ta hài lòng khi biết rằng phần lớn, nếu không phải tất cả, những quyết định của ta trong suốt chuyến hành trình [activity.Custom('PilgrimageLength')] này đều nhằm chứng minh lòng sùng kính của ta đối với [ROOT.Char.GetFaith.HighGodNameAlternate] và [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
  pilgrimage.7000.desc_mid_pious:0 "Ta cảm thấy yên tâm rằng dù có thể ta không phải là người hành hương sùng đạo nhất, ta vẫn đã chứng minh lòng tận tụy của mình với [ROOT.Char.GetFaith.HighGodNameAlternate] theo nhiều cách."
  pilgrimage.7000.desc_low_pious:0 "Ta có chút lo lắng rằng ta đã không có nhiều cơ hội để chứng minh lòng sùng kính của mình đối với [ROOT.Char.GetFaith.HighGodName] như ta mong muốn."
  pilgrimage.7000.desc_perfect_worldly:0 "Ta vô cùng phấn khởi với kết quả của chuyến hành hương này; những cảnh tượng ta đã thấy và những trải nghiệm ta thu nhận — quả thật đây là một thành công!"
  pilgrimage.7000.desc_high_worldly:0 "Ta hài lòng khi biết rằng chuyến hành trình [activity.Custom('PilgrimageLength')] của chúng ta đã thỏa mãn khía cạnh trần thế của [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip], và qua đó cũng thỏa mãn chính ta."
  pilgrimage.7000.desc_mid_worldly:0 "Có lẽ ta đã bỏ lỡ vài cơ hội trần thế, nhưng nhìn chung ta vẫn hài lòng với trải nghiệm này."
  pilgrimage.7000.desc_low_worldly:0 "Ta hơi lo rằng mình chưa có cơ hội trải nghiệm nhiều nền văn hóa và cảnh tượng khác như ta mong muốn."
  pilgrimage.7000.outro_buried_predecessor_here:0 "\n\nDù những sự kiện đáng tiếc dẫn đến cái chết của người tiền nhiệm của ta, [old_pilgrimage_host.GetTitledFirstNamePossessive], và nỗi tang thương bao trùm chuyến đi này — bản thân cuộc hành hương vẫn là một trải nghiệm đáng nhớ, một điều ta sẽ trân trọng mãi."
  pilgrimage.7000.outro_bury_predecessor_home:0 "\n\nBây giờ chúng ta đã thực hiện điều đáng tôn kính và đang hoàn tất cuộc hành hương của [old_pilgrimage_host.GetTitledFirstNamePossessive] đến nơi này, tất cả những gì còn lại là trở về nhà an toàn và đưa [old_pilgrimage_host.GetHerHim] đến nơi an nghỉ cuối cùng của [old_pilgrimage_host.GetHerHis]."
  pilgrimage.7000.outro_first:0 "\n\nĐây là chuyến hành hương đầu tiên của ta — và dù không có chuyến hành hương nào giống hệt nhau — ta cảm thấy mình đã hiểu rõ hơn điều gì đang chờ đợi trong những hành trình tâm linh như thế này trong tương lai."
  pilgrimage.7000.outro_second:0 "\n\nĐây là chuyến hành hương thứ hai của ta, và ta không khỏi so sánh nó với chuyến viếng thăm trước đây đến [first_pilgrimage_memory.MakeScope.Var('pilgrimage_destination').GetProvince.GetNameNoTooltip], nơi thiêng liêng ấy."
  pilgrimage.7000.outro_second_revisit:0 "\n\nChuyến hành hương này vừa là lần thứ hai, vừa là lần quay trở lại thánh địa [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], ta không hề hối tiếc khi trở lại đây để một lần nữa chiêm ngưỡng sự linh thiêng và huy hoàng của nó."
  pilgrimage.7000.outro_multi:0 "\n\nTrong tất cả [ROOT.Char.Custom('PilgrimageAmount')] chuyến hành hương của ta, đây là chuyến mang lại nhiều giác ngộ nhất."
  pilgrimage.7000.outro_first_hajj:0 "\n\nĐây là lần đầu tiên ta thực hiện Hajj, và ta rất vui vì đã thực hiện chuyến hành trình này, tham gia các nghi lễ và gặp gỡ những tâm hồn đồng đạo. Quả thật, ta cảm thấy tinh thần mình được nâng cao và gần gũi với [ROOT.Char.GetFaith.HighGodName] hơn bao giờ hết."
  pilgrimage.7000.outro_second_hajj:0 "\n\nĐây là lần thứ hai ta thực hiện Hajj, ta vừa gặp được những người bạn mới vừa gặp lại những gương mặt quen thuộc từ chuyến đi trước."
  pilgrimage.7000.outro_multi_hajj:0 "\n\nĐã nhiều lần đến đây trước đó, việc thực hiện Hajj luôn là một niềm vui lớn. Chúng ta đoàn kết dưới đức tin của mình, và chúng ta thật sự là dân của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  pilgrimage.7000.outro_new_holy_site:0 "\n\nTa cũng vô cùng phấn khích vì đã ghé thăm một thánh địa mới!"
  pilgrimage.7000.a:0 "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], thật vinh dự."
  pilgrimage.7000.a_cynical:0 "Dù thú vị, ta vẫn mong sớm được ngủ trên chiếc giường của mình."
  pilgrimage.7000.a_hajj:0 "Mong rằng ta sẽ còn được thấy những bức tường của ngươi lần nữa!"
  pilgrimage.7000.a_hajj_cynical:0 "Dù hoài nghi, nó #EMP quả thực#! rất tráng lệ."
  pilgrimage.7000.a.tt:0 "Đã đến lúc bắt đầu hành trình trở về nhà"
  cultural_acceptance_gain_worldly_pilgrimage:0 "Một chuyến hành hương trần thế đã thay đổi mức độ chấp nhận văn hóa."
  pilgrimage.7000.b: "Ta ăn năn!"

 ###Generic Pilgrimage Return Events
 #Nice spiritual journey
    pilgrimage.9001.t:0 "$pilgrimage_header$ Trở Về"
    pilgrimage.9001.desc_intro:0 "Chuyến hành trình của ta thật dài, nhưng cuối cùng ta cũng đã trở về nhà. "
    pilgrimage.9001.desc_invalidated:0 "\n\nDo một chuỗi sự kiện xui rủi, chuyến hành hương của ta đã bị cắt ngắn và đáng tiếc là ta không thể ghé thăm [missed_holy_site.GetNameNoTooltip]. Điều đó khiến ta bận tâm, nhưng mỗi ngày trôi qua lại bớt đi một chút.\n\nTa chỉ có thể cho rằng tất cả đều nằm trong kế hoạch của [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
    pilgrimage.9001.desc_buried_there:0 "Thông qua sự quyết tâm để hoàn thành cuộc hành hương của [old_pilgrimage_host.GetTitledFirstNamePossessive], giờ đây ta nghỉ ngơi một cách thoải mái khi biết rằng [old_pilgrimage_host.GetSheHe] đã có nơi an nghỉ cuối cùng trong sự tôn nghiêm của [burial_location.GetNameNoTierNoTooltip].\n\nVà trong khi nhiều thứ vẫn không thay đổi, các [ROOT.Char.GetFaith.AltPriestTermPlural] của ta khẳng định rằng hành trình thiêng liêng này đã thay đổi điều gì đó về ta, cho dù ta có thể tự mình nhìn thấy nó hay không."
    pilgrimage.9001.desc:1 "Dù nhiều thứ vẫn như cũ, cách các [ROOT.Char.GetFaith.PriestNeuterPlural] đối xử với ta đã có điều gì đó thay đổi.\n\nTa đã trải qua hành trình của một [ROOT.Char.GetWomanMan] hành hương thiêng liêng, và họ khẳng định rằng điều đó đã thay đổi ta, dù bản thân ta có nhận ra hay không."
    pilgrimage.9001.a:0 "Thật tốt khi được trở về nhà."
    pilgrimage.9001.a_invalidated:0 "Mọi chuyện cứ để mặc nó diễn ra."
    pilgrimage.9001.a.tt:0 "Hành trình của ngươi đã kết thúc"
 #Bury old host back home
  pilgrimage.9010.t:0 "$pilgrimage_header$ Trở Về Quê Nhà"
  pilgrimage.9010.desc.relation_family:0 "Chúng ta đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] vào cuối buổi chiều, và đám gia nhân, #EMP gia nhân của ta#!, lập tức bắt đầu chuẩn bị những sắp xếp cần thiết để đưa [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))] của ta về nơi yên nghỉ cuối cùng của [old_pilgrimage_host.GetHerHis].\n\n"
  pilgrimage.9010.desc.relation_liked:0 "Chúng ta đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] vào cuối buổi chiều, và đám gia nhân, #EMP gia nhân của ta#!, lập tức bắt đầu chuẩn bị những sắp xếp cần thiết để đưa người thân mến [old_pilgrimage_host.GetFirstName] về nơi yên nghỉ cuối cùng của [old_pilgrimage_host.GetHerHis].\n\n"
  pilgrimage.9010.desc.relation_neutral:0 "Chúng ta đến [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] vào cuối buổi chiều, và đám gia nhân, #EMP gia nhân của ta#!, lập tức bắt đầu chuẩn bị những sắp xếp cần thiết để đưa [old_pilgrimage_host.GetTitledFirstName] về nơi yên nghỉ cuối cùng của [old_pilgrimage_host.GetHerHis].\n\n"
  pilgrimage.9010.desc.turned_back_liked:0 "Với lòng nặng trĩu ta giám sát các nghi lễ, và cố tìm chút an ủi trong ý nghĩ rằng [ROOT.Char.GetFaith.HighGodName] hẳn đã ở bên [old_pilgrimage_host.GetHerHim] khi [old_pilgrimage_host.GetSheHe] qua đời, trên đường chúng ta đến thánh địa [previous_holy_site.GetNameNoTierNoTooltip].\n\nDẫu sao đi nữa, nếu không phải những người hành hương thì [ROOT.Char.GetFaith.HighGodNameAlternate] còn trông nom ai đây?"
  pilgrimage.9010.desc.turned_back_neutral:0 "Trong khi ta vẫn đang làm quen với [ROOT.Char.Custom('GetRealmOrDomicile')|l] mới của mình, với các [ROOT.Char.Custom('GetCourtierPlural')|l] vội vã chạy đến bên ta mong được hưởng ân huệ, việc mang thi thể của [old_pilgrimage_host.GetTitledFirstName] trở về càng khẳng định một điều rằng [old_pilgrimage_host.GetSheHe] sẽ không quay lại nữa và #EMP ta#! chính là [ROOT.Char.GetTitleAsNameNoTooltip] mới nơi đây."
  pilgrimage.9010.desc.there_and_back_liked:0 "Trong khi thương tiếc sự ra đi của [old_pilgrimage_host.GetHerHis], ta tìm thấy niềm an ủi trong thực tế rằng ta đã thực hiện những mong muốn của [old_pilgrimage_host.GetHerHis] và hoàn thành chuyến hành hương của chúng ta đến [previous_holy_site.GetNameNoTierNoTooltip].\n\nThật sự, [old_pilgrimage_host.GetSheHe] hẳn phải mãn nguyện bất cứ nơi nào [old_pilgrimage_host.GetSheHe] đang ở, và điều đó mang lại một nụ cười thăm dò trên khuôn mặt ta."
  pilgrimage.9010.desc.there_and_back_neutral:0 "Việc đi du lịch đến [previous_holy_site.GetNameNoTierNoTooltip] và quay trở lại để tôn vinh những mong muốn của [old_pilgrimage_host.GetTitledFirstNamePossessive] đã mang lại cho ta sự tín nhiệm với [old_pilgrimage_host.GetHerHis] [ROOT.Char.Custom('GetCourtierPlural')|l], #EMP của ta#! [ROOT.Char.Custom('GetCourtierPlural')|l], và ta đang bắt đầu làm quen với việc trở thành [ROOT.Char.GetTitleAsNameNoTooltip] mới ở quanh đây."
  pilgrimage.9010.desc.invalidated_pilgrimage_liked:0 "Ta thương tiếc sự ra đi của [old_pilgrimage_host.GetHerHis], và vô cùng hối hận vì đã không thể đưa [old_pilgrimage_host.GetHerHim] yên nghỉ tại [previous_holy_site.GetNameNoTierNoTooltip]."
  pilgrimage.9010.desc.invalidated_pilgrimage_neutral:0 "Ta hơi bực bội vì đã không có cơ hội đưa [old_pilgrimage_host.GetHerHim] yên nghỉ tại [previous_holy_site.GetNameNoTierNoTooltip], nhưng xét cho cùng thì [old_pilgrimage_host.GetSheHe] giờ đây cũng đã được an nghỉ."
  pilgrimage.9010.a:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip], một tấm lòng, một mái nhà."
  pilgrimage.9010.a_interrupted:0 "Ít nhất chúng ta cũng đã trở về nguyên vẹn."
  pilgrimage.9010.a_adventurer: "Ít nhất chúng ta cũng đã trở về nguyên vẹn."
  pilgrimage.9010.a.flavor:0 "$pilgrimage.4020.a.flavor$"
 #Follow-up to exotic wares event
  pilgrimage.9100.t:0 "$pilgrimage_header$ Hàng Hóa Kỳ Lạ"
  pilgrimage.9100.desc_intro:0 "Sau khi mang theo những món hàng kỳ lạ của ta từ tận [ROOT.Var('6540_exotic_wares_location').GetProvince.GetName],"
  pilgrimage.9100.desc:0 "Giờ ta phải quyết định nên làm gì với chúng.\n\nTa nên bán chúng để kiếm lời, hay giữ lại làm quà cho âm mưu cá nhân tiếp theo của mình... ?"
  pilgrimage.9100.desc_has_gift:0 "đã đến lúc thu hoạch thành quả và bán chúng để kiếm lời."
  pilgrimage.9100.a:0 "Tiền bạc đang gọi ta."
  pilgrimage.9100.a_double.tt:0 "Ngươi bán số hàng với giá gấp đôi"
  pilgrimage.9100.a_triple.tt:0 "Ngươi bán số hàng với giá gấp ba"
  pilgrimage.9100.a_has_gift:0 "Vậy thì ta xin nhận!"
  pilgrimage.9100.b:0 "Giữ lại chúng sẽ khôn ngoan hơn."
  pilgrimage.9100.b.tt:0 "Ngươi sẽ có cơ hội dùng số hàng này để tăng sức mạnh và tỉ lệ thành công cho [personal_scheme|E] tiếp theo của mình"
 
  pilgrimage_seasia.100.t: "$pilgrimage_header$ Thợ Lặn Ngọc Trai"
  pilgrimage_seasia.100.desc: "Khi chiếc [Glossary( 'djong', 'DJONG_GLOSS' )] của chúng ta lướt dọc rìa [background_terrain_scope.GetName], chúng ta quyết định dừng lại một lúc tại vùng [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] ven biển [background_terrain_scope.Custom('TerrainTypeProvince')].\n\nMột bóng người đơn độc trồi lên khỏi mặt nước — một đứa trẻ.\n\n\"Linh hồn của một con trai khổng lồ bảo ta dâng báu vật của nó làm quà cho [ROOT.Char.GetTitleAsName] đang chờ phía trên.\" Đứa trẻ đưa tay [pearl_diver_child.GetHerHis] ra, trong đó nằm một viên ngọc trai."
  pilgrimage_seasia.100.a: "Các linh hồn đang giao tiếp với đứa trẻ này, ta phải chăm sóc [pearl_diver_child.GetHerHim]."
  pilgrimage_seasia.100.b: "Đây là điềm báo từ [ROOT.Char.GetFaith.HighGodName]!"
  pilgrimage_seasia.100.c: "Một món trang sức đẹp đấy, cảm ơn ngươi, đứa trẻ."
  DJONG_GLOSS: "Một loại thuyền viễn dương của người Java thời trung cổ, đóng bằng gỗ teak và ghép lại mà không dùng sắt."
 
  pilgrimage_seasia.200.t: "$pilgrimage_header$ Linh Hồn Rừng Ngập Mặn"
  pilgrimage_seasia.200.desc: "Khi ta quan sát khung cảnh [background_terrain_scope.GetName] với vùng [background_terrain_scope.Custom('TerrainTypeProvincePrefix')], bờ biển bỗng bị cắt ngang bởi một bụi rừng ngập mặn.\n\nChiếc [Glossary( 'djong', 'DJONG_GLOSS' )] của chúng ta lướt chậm vào giữa một cụm thuyền nhỏ, nơi những ngư dân đang rải từng nắm gạo xuống làn nước đầm lầy.\n\n\"Lễ vật cho các linh hồn, thưa [ROOT.Char.GetTitleAsName],\" một ngư dân [local_character.GetWomanMan] nói. \"Nó giúp chúng ta tránh khỏi tai họa.\""
  pilgrimage_seasia.200.a: "Hỏi những ngư dân [local_character.GetWomenMen] dẫn đường cho chúng ta."
  pilgrimage_seasia.200.b: "Ném vài nắm gạo xuống nước."
  pilgrimage_seasia.200.c: "Thật rợn người... chúng ta nên mau rời đi."
  local_fishermen_modifier: "Ngư Dân Địa Phương"
  local_fishermen_modifier_desc: "Đoàn lữ hành này được hộ tống bởi một nhóm ngư dân địa phương."
 
  pilgrimage_seasia.300.t: "$pilgrimage_header$ Lời Tiên Tri Tốt Lành"
  pilgrimage_seasia.300.desc: "Những con sóng của [background_terrain_scope.GetName] vỗ nhẹ vào thân tàu — một [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] bay vòng phía trên cột buồm, đón luồng gió ngày càng thuận lợi.\n\nLời tiên tri tốt lành mà ta nhận được quả thật ứng nghiệm. Chúng ta sẽ đến [destination.GetName] trong chốc lát!"
  pilgrimage_seasia.300.a: "Mong rằng cơn gió này sẽ tiếp tục!"
  good_prophecy_travel_modifier: "Lời Tiên Tri Tốt Lành"
  good_prophecy_travel_modifier_desc: "Lời tiên tri mà nhân vật này nhận được đã ứng nghiệm, giúp chuyến hành trình của họ nhanh hơn."
 
 pilgrimage_seasia.400.t: "$pilgrimage_header$ Điện Thờ Trôi Nổi"
 pilgrimage_seasia.400.desc: "Khi bờ biển của [background_terrain_scope.GetName] dần hiện ra trước mắt, một con thuyền lớn mang theo một điện thờ [local_character.GetFaith.GetAdjective] trên boong cũng xuất hiện. Khi chúng ta tiến lại gần, những người trên thuyền chào đón chúng ta — những [GetTrait('devoted').GetName( local_character )] mù lòa, hai tay thành kính chắp lại cầu nguyện.\n\n\"Ngài được chào đón tại đây, [ROOT.Char.GetTitleAsName],\" người dẫn đầu trong số họ nói. \"Liệu chúng ta có thể giúp gì cho ngài, hỡi những thủy thủ mệt mỏi?\""
 pilgrimage_seasia.400.a: "Hãy nói cho ta chân lý của [local_character.GetFaith.GetNameNoTooltip]."
 pilgrimage_seasia.400.b: "Hỡi bậc hiền giả, con đường phía trước của chúng ta ra sao?"
 pilgrimage_seasia.400.c: "Xin hãy ban phúc cho chúng ta."
 a_good_prophecy_tt: "Ngươi nhận được một lời tiên tri may mắn cho hành trình phía trước... hay có lẽ chỉ là những lời rỗng tuếch?"
 
 pilgrimage_seasia.500.t: "$pilgrimage_header$ Những Ngư Dân của [background_terrain_scope.GetNameNoTooltip]"
 pilgrimage_seasia.500.desc: "Vùng nước ven bờ của [background_terrain_scope.GetName] đông nghịt ngư dân, họ quăng [Glossary('jalas', 'JALA_GLOSS')] và kéo lên những [Glossary('bubus', 'BUBU_GLOSS')]. Rồi đột nhiên — hỗn loạn bùng nổ!\n\n\"Đó là [ROOT.Char.GetTitleAsNameNoTooltip]!\" giọng một [local_character.GetWomanMan] vang lên. \"Nhanh lên mọi người, chúng ta phải được tắm mình trong sự hiện diện thiêng liêng của [ROOT.Char.GetHerHis]!\" Chỉ trong chốc lát, chiếc [Glossary( 'djong', 'DJONG_GLOSS' )] của chúng ta bị bao vây bởi những chiếc thuyền đánh cá háo hức."
 pilgrimage_seasia.500.a: "Hãy đến đây, tất cả các ngươi, và chiêm ngưỡng lòng nhân từ của ta!"
 pilgrimage_seasia.500.b: "Hãy tản ra, thần dân của ta, và kể cho mọi người nghe về [local_character.GetFaith.GetNameNoTooltip]."
 pilgrimage_seasia.500.c: "Hãy đến với ta, hỡi những thần dân [local_character.Custom('RandomPositiveShallowAdjective')] nhất của ta!"
 pilgrimage_seasia.500.d: "Chúng ta nên rời khỏi đây nhanh thôi..."
 coastal_ruler_visit_travel_modifier: "Chuyến Thăm của Lãnh Chúa Ven Biển"
 coastal_ruler_visit_travel_modifier_desc: "Lãnh chúa của lãnh địa này đã ban ân huệ cho dân cư vùng ven biển."
 JALA_GLOSS: "Những tấm lưới ném tròn có viền chì quanh mép, được quăng khéo léo bằng tay từ thuyền hoặc bờ."
 BUBU_GLOSS: "Những bẫy cá bằng tre tinh xảo thường được đặt ở cửa sông và vùng rừng ngập mặn."
 
 pilgrimage_seasia.600.t: "$pilgrimage_header$ Lễ Vật Gạo"
 pilgrimage_seasia.600.desc: "Ta nhìn ra [background_terrain_scope.GetName] khi [ROOT.Char.Custom2('RelationToMeShort', entourage_character)] của ta, [entourage_character.GetFirstNameNicknamed], đứng tựa bên cạnh. [entourage_character.GetSheHe|U] rải một nắm gạo xuống biển.\n\n\"Thưa [entourage_character.Custom2('RelationToMeShort', root_scope)] của ta, gạo này không phải cho cá — mà để nhắc nhở các linh hồn rằng chúng ta là khách nơi đây.\" [entourage_character.GetSheHe|U] đưa túi gạo cho ta. \"Vì một chuyến đi an toàn.\""
 pilgrimage_seasia.600.a: "Màu sắc của bầu trời... là một điềm báo chăng?"
 pilgrimage_seasia.600.b: "Hãy cùng xoa dịu các linh hồn, bằng hữu."
 pilgrimage_seasia.600.c: "Ta nghĩ mình sẽ ăn gạo vào bữa tối."
 
 pilgrimage_seasia.700.t: "$pilgrimage_header$ Nạn Nhân của Nāga"
 pilgrimage_seasia.700.desc: "Dù cơn mưa làm mờ tầm nhìn, ta vẫn nhìn thấy một [local_character.GetWomanMan] bám vào khúc gỗ trôi. Người của ta lập tức kéo [local_character.GetHerHim] lên thuyền.\n\n\"Vị ân nhân [ROOT.Char.Custom('ComplimentAdjective')|U], ta nợ ngài mạng sống của mình!\" [local_character.GetSheHe] thở hổn hển. \"Chiếc [Glossary('sampan', 'SAMPAN_GLOSS')] của ta bị một con [Glossary('nāga', 'NAGA_GLOSS')] hung ác kéo xuống nước, ta đáng lẽ phải biết hôm nay là ngày xui xẻo...\""
 pilgrimage_seasia.700.a: "Vận may của ngươi giờ đã đổi, ngươi đang ở cùng ta."
 pilgrimage_seasia.700.b: "Ngươi bị nguyền rủa, hãy rời đi sớm."
 SAMPAN_GLOSS: "Một loại thuyền nhỏ đáy phẳng phổ biến trên sông và vùng biển Đông Nam Á. Thường làm bằng gỗ và chèo tay hoặc chống sào, sampan được dùng để đánh cá, đi lại và buôn bán trên sông."
 NAGA_GLOSS: "Một linh xà được tôn kính tại Nam Á và Đông Nam Á, thường được xem là hộ thần của nước, sự sinh sôi và cõi âm. Không hoàn toàn là thần cũng chẳng phải phàm nhân, nāga vừa đáng sợ vừa được tôn kính."
 
 pilgrimage_seasia.800.t: "$pilgrimage_header$ Bóng Tối Dưới Nước"
 pilgrimage_seasia.800.desc: "Làn nước trong vắt của [background_terrain_scope.GetNameNoTooltip] cuộn lên khi một cái bóng khổng lồ lướt qua bên dưới. Rồi thêm một cái nữa, rồi thêm nữa, đến khi chiếc [Glossary( 'djong', 'DJONG_GLOSS' )] dường như rung lắc vì sự di chuyển của chúng.\n\nTa siết chặt cây lao khi thủy thủ đoàn bắt đầu la hét. Trong cơn hỗn loạn, ta nghe thấy một từ hoảng loạn: #EMP \"[Glossary('nāgas!', 'NAGA_GLOSS')]\"#!"
 pilgrimage_seasia.800.a: "Một điềm lành chăng, chúng đang dẫn đường cho chúng ta?"
 pilgrimage_seasia.800.b: "Nhanh lên, chúng ta phải dâng lễ vật!"
 pilgrimage_seasia.800.c: "Chỉ là cá thôi... cầm lấy lao!"
 a_good_omen_tt: "Có lẽ đây là điềm báo tốt cho tương lai..."
 
 pilgrimage_seasia.900.t: "$pilgrimage_header$ Hải Tặc Sampan"
 pilgrimage_seasia.900.desc: "Khi chúng ta tiến gần bờ rừng ngập mặn của [background_terrain_scope.GetNameNoTooltip], những chiếc [Glossary('sampans', 'SAMPAN_GLOSS')] lao ra từ nơi ẩn nấp — bọn cướp biển la hét và quăng móc lên thuyền. Chúng leo lên chiếc [Glossary( 'djong', 'DJONG_GLOSS' )] rất nhanh, và ta đối mặt với thủ lĩnh của chúng.\n\n\"Nộp vàng ra đây, lũ chó hèn mọn, nếu không ta sẽ...\" [local_character.GetSheHe] khựng lại, làm rơi thanh [local_character.GetHerHis] [Glossary('pedang', 'PEDANG_GLOSS')]. \"Xin tha thứ cho chúng ta, [ROOT.Char.GetTitleAsNameNoTooltip] thiêng liêng! Chúng ta không hề có ý làm hại ngài!\""
 pilgrimage_seasia.900.a: "Đừng sợ, lòng nhân từ của ta rất lớn."
 pilgrimage_seasia.900.b: "Các ngươi là những chiến binh có năng lực, hãy theo ta."
 pilgrimage_seasia.900.c: "[ROOT.Char.GetTitleAsNameNoTooltip] ra lệnh cho các ngươi phải cho chúng ta đi qua an toàn!"
 PEDANG_GLOSS: "Một lưỡi kiếm thẳng, một cạnh, được các chiến binh Mã Lai và Java sử dụng."
 
 pilgrimage_seasia.1000.t: "$pilgrimage_header$ Thương Nhân từ Tanah Makkah"
 pilgrimage_seasia.1000.desc: "Khi chúng ta đi thuyền trên [background_terrain_scope.GetNameNoTooltip], một con tàu buôn khổng lồ rẽ sóng vượt qua những chiếc [Glossary('sampans', 'SAMPAN_GLOSS')] và áp sát bên cạnh. Một [local_character.GetWomanMan] ăn mặc sang trọng, dường như đến từ [Glossary('Tanah Makkah', 'TANAH_MAKKAH_GLOSS')], leo lên thuyền.\n\n\"Kính chào [ROOT.Char.GetTitleAsNameNoTooltip], ta là [local_character.GetFirstNameNicknamed], đến từ [merchant_home.GetNameNoTier],\" [local_character.GetSheHe] cúi đầu. \"Chúng ta là những thương nhân [local_character.GetFaith.GetReligion.GetAdherentName] đang tìm một cảng để xây dựng một [local_character.GetFaith.HouseOfWorship].\"\n\n\"Tất nhiên, chúng ta sẽ trả hậu hĩnh.\""
 pilgrimage_seasia.1000.a: "Liệu [local_character.GetFaith.HighGodName] có chấp nhận chúng ta?"
 pilgrimage_seasia.1000.b: "[local_character.GetFaith.HighGodName]? Để ta nói cho ngươi về sự thần thánh của [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage_seasia.1000.c: "Các ngươi có thể xây một [local_character.GetFaith.HouseOfWorship] tại [mosque_location.GetNameNoTooltip]."
 pilgrimage_seasia.1000.d: "Thực hiện vài giao dịch rồi đi tiếp."
 TANAH_MAKKAH_GLOSS: "Tại Đông Nam Á, Mecca (Makkah) dần trở thành cách gọi tắt cho toàn bộ Ả Rập. \"Tanah Makkah\" có nghĩa là \"Vùng đất của Mecca\" và xuất hiện trong các bản thảo Hồi giáo cổ trong khu vực."
 zealotry_intent_tt: "Ngươi không có Ý Định Cuồng Tín"
 
 pilgrimage_seasia.1100.t: "$pilgrimage_header$ Bẫy Mây"
 pilgrimage_seasia.1100.desc: "Khi chúng ta bước trên một con đường mòn hẹp xuyên qua [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] [background_terrain_scope.Custom('TerrainTypeProvince')] của [background_terrain_scope.GetNameNoTooltip], một giọng nói vang lên từ phía trên. Một [local_character.GetWomanMan] đang bị treo lộn ngược, mắc kẹt trong một chiếc bẫy [Glossary('rattan', 'RATTAN_GLOSS')].\n\n"Cứu với! Ta lỡ giẫm phải bẫy heo rừng và cần một vị cứu tinh [ROOT.Char.Custom('FormalComplimentAdjective')]!" [local_character.GetSheHe] hét lên. "Ta thề mình là một người dẫn đường giỏi — thả ta xuống, ta sẽ gia nhập cùng các ngươi!""
 pilgrimage_seasia.1100.a: "Ngươi có thể gia nhập cùng chúng ta."
 pilgrimage_seasia.1100.b: "Hãy kể với làng của ngươi về lòng sùng đạo của ta."
 pilgrimage_seasia.1100.c: "Heh. Cứ để [local_character.GetHerHim] treo đó."
 RATTAN_GLOSS: "Một loài cọ leo được quý trọng vì độ bền và sự dẻo dai. Được đan thành giỏ, dây buộc và bẫy, mây là công cụ quen thuộc của đời sống rừng rậm, được thợ săn, thương nhân và dân làng sử dụng."
 
 pilgrimage_seasia.1200.t: "$pilgrimage_header$ Một Lữ Khách từ Nalanda"
 pilgrimage_seasia.1200.desc: "Khi chúng ta men theo một con đường quanh co đi xuống, chúng ta bắt gặp một [GetTrait('devoted').GetName( local_character )] đang cắm trại cạnh một [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')] trong vùng [background_terrain_scope.Custom('TerrainTypeProvince')].\n\n"Chào các vị hành hương," [local_character.GetWomanMan] nhẹ nhàng nói. "Ta là một học giả [local_character.GetFaith.GetAdjective] đến từ [GetBuilding('nalanda_university').GetName], đang tìm kiếm những nơi tĩnh lặng nhất tại [exploration_target.GetBaseNameNoTier] để thiền định. Các ngươi có thể chia sẻ hiểu biết của mình về vùng đất này chăng?""
 pilgrimage_seasia.1200.a: "Nếu ngươi kể cho ta nghe về đức tin [local_character.GetFaith.GetAdjectiveNoTooltip] của ngươi!"
 pilgrimage_seasia.1200.b: "Được, nếu ngươi ban phúc cho [blessed_artifact.GetNameNoTooltip] của ta?"
 pilgrimage_seasia.1200.c: "[other_barony.GetBaseNameNoTierNoTooltip] là nơi thanh tịnh nhất để thiền."
 improved_artifact_tt: "[blessed_artifact.GetName] sẽ nhận một modifier ngẫu nhiên"
 
 pilgrimage_seasia.1300.t: "$pilgrimage_header$ Hồ Ếch Kêu"
 pilgrimage_seasia.1300.desc: "Sau khi vất vả lội qua một [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')], chúng ta bắt gặp một cảnh tượng hiếm thấy — một hồ nước tròn hoàn hảo phát sáng. Những con ếch xếp dọc bờ như các tiểu tăng, kêu theo nhịp điệu như thể đang tụng niệm tán dương.\n\nGạo, hoa và [Glossary('betel leaves', 'BETEL_LEAVES_GLOSS')] nổi trên mặt nước, dấu hiệu của một lễ vật đã được dâng lên."
 pilgrimage_seasia.1300.a: "Hãy ở lại và suy ngẫm một lúc."
 pilgrimage_seasia.1300.b: "Hãy dâng một ít gạo làm lễ."
 pilgrimage_seasia.1300.c: "Đẹp thật, nhưng chúng ta phải đi."
 BETEL_LEAVES_GLOSS: "Lá bóng của dây trầu, thường được nhai cùng hạt cau và vôi trong một tập tục phổ biến khắp Nam Á và Đông Nam Á. Nó cũng thường được dùng trong nghi lễ hoặc buôn bán."
 
 pilgrimage_seasia.1400.t: "$pilgrimage_header$ Gương Mặt của Thần"
 pilgrimage_seasia.1400.desc: "Khi chúng ta tiến qua vùng [background_terrain_scope.Custom('TerrainTypeProvince')] đầy sương mù của [background_terrain_scope.GetName], một khối đá khổng lồ hiện ra phía trước — được quấn trong vải rách và dây leo chằng chịt. Ta đã trực diện với chiếc đầu của một vị thần của [character_faith.GetReligion.GetAdherentName], ánh nhìn cổ xưa của nó như xuyên thấu tâm hồn ta.\n\nĐây là vị thần nào... và liệu ta #EMP đã được định sẵn#! phải tìm thấy nó chăng?"
 pilgrimage_seasia.1400.a: "Đó là [character_faith.CreatorName], đấng sáng tạo."
 pilgrimage_seasia.1400.b: "Đó là [character_faith.WealthGodName], kẻ tham lam."
 pilgrimage_seasia.1400.c: "Đó là [character_faith.WarGodName], kẻ chinh phục."
 pilgrimage_seasia.1400.d: "Đó là [character_faith.HighGodName]! Ta được kêu gọi đến với [character_faith.GetNameNoTooltip]!"
 pilgrimage_seasia.1400.e: "Không nghi ngờ gì, đó là thần lữ hành."
 
 pilgrimage_seasia.1500.t: "$pilgrimage_header$ Pawang"
 pilgrimage_seasia.1500.desc: "Chúng ta cố sức tiến qua vùng [background_terrain_scope.Custom('TerrainTypeProvince')] của [background_terrain_scope.GetName], gió và mưa quất vào mặt như ngàn mũi tên. Đột nhiên, cơn bão dịu xuống — gió lặng, mưa nhẹ dần, và mặt trời ló dạng.\n\n"Ta đã làm dịu cơn bão khi các ngươi tiến đến," một [local_character.GetWomanMan] nói với vẻ uy nghi trầm tĩnh. "Ta là [local_character.GetFirstNameNicknamed], một [Glossary('pawang', 'PAWANG_GLOSS')]. Người ở vùng này đều e sợ ta.""
 pilgrimage_seasia.1500.a: "Ta có thể cần một người như ngươi."
 pilgrimage_seasia.1500.b: "Ngươi có thể ban phúc cho thời tiết chăng?"
 pilgrimage_seasia.1500.c: "Vớ vẩn, thời tiết chỉ là thất thường thôi."
 PAWANG_GLOSS: "Một pháp sư nghi lễ được cho là có thể điều khiển thời tiết, thú dữ và linh hồn. Vừa bị e sợ vừa được kính trọng."
 good_weather_modifier: "Thời Tiết Tốt"
 good_weather_modifier_desc: "Thời tiết tốt lành ban phúc cho đoàn tùy tùng này."
