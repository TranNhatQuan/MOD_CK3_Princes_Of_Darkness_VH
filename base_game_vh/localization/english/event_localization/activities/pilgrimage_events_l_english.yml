 activity_pilgrimage_province_very_short_desc:0 "\n#positive_value + Khoảng Cách Rất Ngắn#!\n\nChi Phí Thêm: Không"
 activity_pilgrimage_province_pretty_short_desc:0 "\n#positive_value + Khoảng Cách Ngắn#!\n#negative_value - Chi Phí Tăng Nhẹ#!\n\nChi Phí Thêm: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_1')|0]"
 activity_pilgrimage_province_short_desc:0 "\n#positive_value ++ Khoảng Cách Khá Ngắn#!\n#negative_value -- Chi Phí Tăng Nhẹ#!\n\nChi Phí Thêm: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_2')|0]"
 activity_pilgrimage_province_intermediate_desc:0 "\n#positive_value ++ Khoảng Cách Trung Bình#!\n#negative_value -- Chi Phí Trung Bình#!\n\nChi Phí Thêm: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_3')|0]"
 activity_pilgrimage_province_respectably_desc:0 "\n#positive_value ++ Khoảng Cách Đáng Kể#!\n#negative_value -- Chi Phí Cao#!\n\nChi Phí Thêm: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_4')|0]"
 activity_pilgrimage_province_quite_far_desc:0 "\n#positive_value +++ Khá Xa#!\n#negative_value --- Khá Tốn Kém#!\n\nChi Phí Thêm: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_5')|0]"
 activity_pilgrimage_province_very_far_desc:0 "\n#positive_value +++ Rất Xa#!\n#negative_value --- Tốn Kém#!\n\nChi Phí Thêm: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_6')|0]"
 activity_pilgrimage_province_extraordinarily_far_desc:0 "\n#positive_value +++ Cực Kỳ Xa#!\n#negative_value --- Rất Tốn Kém#!\n\nChi Phí Thêm: [gold_i][SCOPE.ScriptValue('pilgrimage_length_cost_tier_7')|0]"
 activity_pilgrimage_imaginary_friend_location_desc: "\n#positive_value +++ Tôn Vinh Người Bạn Tưởng Tượng Của Ngươi#!"
 #Effects
 activity_pilgrimage_province_medium_mult_desc:0 "\n\n#bold Hiệu ứng khi tổ chức [GetActivityType('activity_pilgrimage').GetName] tại đây#!\n$BULLET_WITH_TAB$[piety_i|E][piety|E] Phần thưởng Hoạt động: #p +[EmptyScope.ScriptValue('medium_pilgrimage_piety_multiplier')|0]%#!"
 activity_pilgrimage_province_long_mult_desc:0 "\n\n#bold Hiệu ứng khi tổ chức [GetActivityType('activity_pilgrimage').GetName] tại đây#!\n$BULLET_WITH_TAB$[piety_i|E][piety|E] Phần thưởng Hoạt động: #p +[EmptyScope.ScriptValue('long_pilgrimage_piety_multiplier')|0]%#!"
 activity_pilgrimage_province_very_long_mult_desc:0 "\n\n#bold Hiệu ứng khi tổ chức [GetActivityType('activity_pilgrimage').GetName] tại đây#!\n$BULLET_WITH_TAB$[piety_i|E][piety|E] Phần thưởng Hoạt động: #p +[EmptyScope.ScriptValue('very_long_pilgrimage_piety_multiplier')|0]%#!"
 

