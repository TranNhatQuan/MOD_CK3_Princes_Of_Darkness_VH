 ### SYSTEM EVENTS
 #Invalidation Event
 pilgrimage.0040.t:1 "$pilgrimage_header$ Kết thúc hành trình"
 pilgrimage.0040.desc:0 "Và thế là hành trình tâm linh của ta kết thúc đột ngột. Giống như chiếc lá rơi vào dòng sông bão tố, ta chỉ có thể xem hoàn cảnh mới sẽ đưa mình tới đâu."
 pilgrimage.0040.desc_moved_capital:0 "Giờ đây thủ đô của ta thực sự ở nơi tráng lệ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], nên không còn nhiều lý do để tiếp tục [GetActivityType('activity_pilgrimage').GetNameNoTooltip] nữa.\n\nTa nên tập trung kết thúc hành trình tại đó và thử vận may với một thánh địa khác."
 pilgrimage.0040.a:0 "Ta chỉ là chiếc lá trên dòng sông."
 pilgrimage.0040.a_moved_capital:0 "Hãy bắt đầu thôi."
 #Illness Event - used in health.1001
 pilgrimage.0041.t:0 "$pilgrimage.0040.t$?"
 pilgrimage.0041.desc:0 "Than ôi, thân xác đang suy yếu. Nhưng tinh thần vẫn mạnh mẽ. Ta có nên đặt mạng sống của mình vào tay [ROOT.Char.GetFaith.HealthGodName] và tiếp tục hành trình tới [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]?"
 pilgrimage.0041.a:0 "Ta #EMP được#! [ROOT.Char.GetFaith.HighGodName] ban phước."
 pilgrimage.0041.a.tt:0 "[THIS.Char.GetInvolvedActivity.GetName] của bạn sẽ tiếp tục"
 pilgrimage.0041.b:0 "Không, việc này quá nguy hiểm."
 #Invalidation because you bury old host back home
 pilgrimage.0042.t:0 "$pilgrimage_header$ Một lễ an táng tại quê nhà"
 pilgrimage.0042.desc:0 "Hành trình của chúng ta bị cắt ngắn và chúng ta sẽ quay về [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] để đưa [old_pilgrimage_host.GetTitledFirstName] về nơi an nghỉ cuối cùng của [old_pilgrimage_host.GetHerHis]."
 pilgrimage.0042.a:0 "Đó là điều [old_pilgrimage_host.GetSheHe] mong muốn."
 #Promise your religious relative to go on a Pilgrimage
 pilgrimage.0500.t:0 "Cái chết của người hành hương"
 pilgrimage.0500.desc:0 "\"[first_holy_site.GetProvince.GetNameNoTooltip]. [second_holy_site.GetProvince.GetNameNoTooltip]. À, [second_holy_site.GetProvince.GetNameNoTooltip]...,\" cơ thể yếu ớt của [pilgrimage_dying_relative.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))] của ta — đang nằm trên giường của [pilgrimage_dying_relative.GetHerHis], chỉ còn là cái vỏ của con người trước đây của [pilgrimage_dying_relative.GetHerHis]. Khi ta tiến lại gần giường, [pilgrimage_dying_relative.GetSheHe] cố gắng tập trung đôi mắt mờ đục của [pilgrimage_dying_relative.GetHerHis] vào ta.\n\n\"[pilgrimage_dying_relative.Custom2('RelationToMe' , ROOT.Char)|U]... những điều con hối tiếc không phải là những gì con đã làm, mà là những gì con đã không làm.\" Ta cúi xuống gần hơn, và có thể ngửi thấy mùi phân hủy từ hơi thở của [pilgrimage_dying_relative.GetHerHis] khi [pilgrimage_dying_relative.GetSheHe] tiếp tục: \"Đừng để những cái bẫy hàng ngày ngăn cản con khỏi con đường chân chính dẫn đến [ROOT.Char.GetFaith.HighGodName].\"\n\nMột vẻ mặt đau đớn hiện lên trên khuôn mặt của [pilgrimage_dying_relative.GetHerHis], và ta hiểu rằng cuộc trò chuyện đã kết thúc."
 pilgrimage.0500.a:0 "Vâng, dĩ nhiên."
 pilgrimage.0500.a.flavor:0 "Nếu điều đó giúp [pilgrimage_dying_relative.GetHerHim] ra đi thanh thản."
 pilgrimage.0500.a.tt_pilgrimage:0 "[pilgrimage|E] tiếp theo của bạn sẽ rẻ hơn"
 pilgrimage.0500.b:0 "Ta là một [ROOT.Char.GetWomanMan] bận rộn vào những ngày này, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))]."
 pilgrimage.0500.b.flavor:0 "Ta thực sự không muốn."


 ###Generic Pilgrimage Journey Events
 # St. Elmo's Fire
 pilgrimage.1100.t.greek:0 "$pilgrimage_header$ Helene Bốc Lửa"
 pilgrimage.1100.t.christian:0 "$pilgrimage_header$ Lửa Thánh Elmo"
 pilgrimage.1100.t.pagan:0 "$pilgrimage_header$ Ngọn Lửa của [ROOT.Char.GetFaith.DivineRealm]"
 pilgrimage.1100.t:0 "$pilgrimage_header$ Ngọn Lửa Thần Thánh"
 pilgrimage.1100.desc:0 "Cơn bão biển ập đến khiến chúng ta hoàn toàn bất ngờ khi bầu trời xé toạc bởi sét bắt đầu trút mưa xuống — và với một tia chớp dữ dội, đầu cột buồm bùng lên ngọn lửa xanh, bao phủ con tàu trong ánh sáng huyền ảo.\n\n"
 pilgrimage.1100.companion:0 ""Đây là điềm báo!" [ROOT.Char.Custom2('RelationToMeShort', panicked_pilgrim)] hoảng loạn của ta, [panicked_pilgrim.GetTitledFirstName], kêu lên, bám chặt dây buồm như bám mạng sống, giọng gần như không nghe thấy giữa tiếng buồm quật loạn. "Chúng ta #EMP phải#! quay lại! Trước khi quá muộn!"\n\n"
 pilgrimage.1100.alone:0 "Con tàu dường như trôi nổi, không hề hấn gì, trên những con sóng dữ, được một sức mạnh thần thánh nào đó dẫn dắt an toàn qua cơn bão."
 pilgrimage.1100.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate|U] đang dẫn lối cho chúng ta!"
 pilgrimage.1100.a.flavor:0 "Giữ hướng đi, người lái tàu!"
 pilgrimage.1100.b:0 "Ta sẽ leo lên gặp ngài, [ROOT.Char.GetFaith.HighGodName]!"
 pilgrimage.1100.b.success.t:0 "Lửa Thần Thánh"
 pilgrimage.1100.b.wounded.t:0 "Bị thương"
 pilgrimage.1100.b.flavor:0 "Hãy để ta cảm nhận vòng tay của [ROOT.Char.GetFaith.random_DivineRealm]!"
 pilgrimage.1100.c:0 "[ROOT.Char.GetFaith.WaterGodName] đòi hỏi một vật hiến tế!"
 pilgrimage.1100.c.flavor:0 "Chúng ta phải chờ cơn dông này qua đi!"
 pilgrimage.1100.d:0 "Quay lại, lũ ngu!"
 pilgrimage.1100.d.flavor:0 "$pilgrimage.1100.c.flavor$"
 every_family_member_tt:0 "Mọi thành viên gia đình"
 pilgrimage.1100.success:0 "Bạn được dẫn dắt an toàn tiếp tục hành trình"
 pilgrimage.1100.failure:0 "Cơn bão đẩy bạn lệch khỏi lộ trình"
 pilgrimage_random_pilgrim_tt:0 "Một người hành hương ngẫu nhiên sẽ chết, khiến mọi thành viên [family|E] đau buồn"
 pilgrimage_fell_overboard_tt:0 "[victim_pilgrim.GetFirstName] rơi xuống biển"
 # Heathen Raiders
 #pilgrimage_joe_0200_army: "[ROOT.Char.GetFaith.WarGodPossessive] Fury"
 pilgrimage.1110.t:0 "$pilgrimage_header$ Cướp Bóc của [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)|U]"
 pilgrimage.1110.desc: "Băng qua [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] của [heathen_raider_county.GetNameNoTierNoTooltip], chúng ta phát hiện ra những lá cờ của một đội quân nhỏ, được trang trí bằng [heathen_raider.GetFaith.ReligiousSymbol] [heathen_raider.GetFaith.GetAdjective]. Họ là những kẻ lang thang rách rưới, săn lùng những người hành hương đang đi đến [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n\nKẻ cầm đầu nhanh chóng chặn đường chúng ta, dựng con ngựa của [ROOT.Char.GetHerHis] lên và tự xưng là [heathen_raider.GetFirstName]."
 pilgrimage.1110.shared_target_heathen_hajj:0 ""Dừng lại [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)]! Nhân danh [ROOT.Char.GetFaith.HighGodName], những kẻ [ROOT.Char.GetFaith.GetAdherentNamePlural] phải nộp phí Kaaba.""
 pilgrimage.1110.shared_target_controlled_hajj:0 ""Một khoản phí nhỏ để được thấy Kaaba, đó là tất cả ta yêu cầu từ những người quản lý [ROOT.Char.GetFaith.GetAdjective] [heathen_raider.Custom2('GetUnbelieverTermAdjective', ROOT.Char)] của nó.""
 pilgrimage.1110.shared_target_heathen_jerusalem:0 ""Đừng sợ [heathen_raider.Custom2('GetUnbelieverTermPlural', ROOT.Char)], kỳ quan của thánh thành chúng ta đang chờ, với một khoản phí nhỏ.""
 pilgrimage.1110.shared_target_controlled_jerusalem:0 ""Nếu thật sự muốn thấy thánh thành quý giá của mình, khoản phí nhỏ của ta chẳng đáng là bao.""
 pilgrimage.1110.shared_target_heathen:0 ""Lũ chó [ROOT.Char.GetFaith.GetAdjective] các ngươi không biết sao? Những [ROOT.Char.Custom2('GetUnbelieverTermPlural', heathen_raider)|U] phải dâng cống để được thấy [heathen_raider.GetFaith.HouseOfWorshipPlural] thiêng liêng.""
 pilgrimage.1110.shared_target_controlled:0 ""[ROOT.Char.GetFaith.HouseOfWorshipPlural] của các ngươi vẫn sẽ ở đó sau khi trả phí qua đường khiêm tốn của chúng ta.""
 pilgrimage.1110.shared_heathen_controlled:0 ""[heathen_raider.GetFaith.HouseOfWorshipPlural] của chúng ta thật kỳ vĩ, như các ngươi sẽ thấy sau khi nộp phí.""
 pilgrimage.1110.fallback:0 ""Dừng lại, [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)]. Ta giữ trật tự trên con đường này, và ngươi phải trả phí như mọi kẻ khác.""
 pilgrimage.1110.a:0 "Nếu muốn vàng của ta, hãy tự đến lấy."
 pilgrimage.1110.a.fled:0 "Bọn cướp đổi ý"
 pilgrimage.1110.a.skirmish:0 "Bạn đẩy lùi đợt tấn công đầu"
 pilgrimage.1110.a.beaten:0 "Vì sự ngạo mạn của bạn, chúng lấy hết mọi thứ"
 pilgrimage.1110.b.religion:0 "Nào [heathen_raider.Custom('SisterBrother')], chúng ta đều theo [ROOT.Char.GetFaith.HighGodName]."
 pilgrimage.1110.b.unreformed:0 "Nào, vẫn chưa quá muộn cho [ROOT.Char.GetFaith.ReligiousText]."
 pilgrimage.1110.b:0 "Không cần bạo lực, hãy nói chuyện."
 pilgrimage.1110.c:0 "Ngươi bị lừa dối, hãy nghe chân lý [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 pilgrimage.1110.c.success:0 "Lời bạn vang lên đầy thuyết phục"
 pilgrimage.1110.c.failure:0 "Tên cướp không hề thích thú"
 pilgrimage.1110.d:0 "Cầm vàng của ngươi đi, tên cướp."
 two_entourage_members_wounded_tt:0 "Tối đa hai thành viên đoàn tùy tùng có thể bị [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 one_entourage_members_wounded_tt:0 "Một thành viên đoàn tùy tùng có thể bị [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 two_entourage_members_die_tt:0 "Tối đa hai thành viên đoàn tùy tùng có thể chết"
