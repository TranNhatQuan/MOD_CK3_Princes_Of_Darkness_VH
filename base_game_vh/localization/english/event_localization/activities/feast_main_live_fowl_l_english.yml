l_english:
  feast_main_live_fowl.0002.t:1 "Trò Chim Quậy Của [fowl_dinner_target.GetFirstNamePossessive]"
  feast_main_live_fowl.0002.entremets_served:0 "Người hầu mang ra những món khai vị được trang trí ấn tượng: vài con [ROOT.GetCharacter.Custom('exotic_fowl_type')], đã lột da, nấu chín và nhồi nhân, sau đó được khoác lại bộ lông tráng lệ của chúng. Tuy nhiên, khi [fowl_dinner_target.GetTitledFirstName] đưa con dao của [fowl_dinner_target.GetHerHis] lại gần một trong số chúng, con vật bỗng sống lại với một tiếng hét! Con này hoàn toàn chưa được nấu chín! Nó mổ vào mũi [fowl_dinner_target.GetFirstNamePossessive], trước khi lao ra giữa những vị khách đang la hét và cười đùa."
  feast_main_live_fowl.0002.bird_killed:0 "\n\nCuộc trốn thoát của con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã kết thúc đủ sớm, khi [fowl_bird_killer.GetTitledFirstName] đứng dậy khỏi chỗ ngồi của [fowl_bird_killer.GetHerHis] và với sự hiệu quả lạnh lùng, tóm lấy cổ nó. Với một cú vặn tay của [fowl_bird_killer.GetHerHis], một tiếng rắc lớn khiến cả hội trường im lặng. Sự im lặng chỉ bị phá vỡ bởi những tiếng rên rỉ đau đớn của [fowl_dinner_target.GetFirstNamePossessive] khi [fowl_dinner_target.GetSheHe] ôm lấy chiếc mũi đang chảy máu của mình."
  feast_main_live_fowl.0002.bird_chased_by_character:0 "\n\nKhi con chim chạy loạn khắp nơi, [fowl_bird_chaser.GetTitledFirstName] đứng dậy nhận thử thách. Cảnh tượng [fowl_bird_chaser.GetHerHim] tuyệt vọng đuổi theo sinh vật điên loạn đó qua các bàn tiệc khiến mọi người được phen giải trí lớn. Cuối cùng [fowl_bird_chaser.GetSheHe] cũng dọa được con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chạy về phía cửa đại sảnh, nơi nó thoát ra ngoài bầu trời đêm đầy sao."
  feast_main_live_fowl.0002.bird_chased_away:0 "\n\nKhi con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chạy loạn khắp nơi, hàng loạt người hầu cố gắng ngăn nó lật đổ các món ăn khác. Trò vui nhất là cảnh đầu bếp cầm muôi đuổi theo nó, cuối cùng dồn con chim chạy ra khỏi cửa đại sảnh và trốn vào màn đêm."
  feast_main_live_fowl.0002.a:0 "Thật là một cảnh hỗn loạn!"
  feast_main_live_fowl.0003.t:1 "Trò Chim Quậy Của [fowl_dinner_target.GetFirstNamePossessive]"
  feast_main_live_fowl.0003.entremets_served:0 "Người hầu mang ra những món khai vị được trang trí ấn tượng: một số con [ROOT.GetCharacter.Custom('exotic_fowl_type')] kiêu hãnh, đã lột da, nấu chín và nhồi nhân, sau đó được khoác lại bộ lông tráng lệ của chúng. Tuy nhiên, khi [fowl_dinner_target.GetTitledFirstName] đưa con dao của [fowl_dinner_target.GetHerHis] lại gần một trong số chúng, con vật bỗng sống lại với một tiếng hét! Con này hoàn toàn chưa được nấu chín! Nó mổ vào mũi [fowl_dinner_target.GetFirstNamePossessive], trước khi lao ra giữa những vị khách đang la hét và cười đùa."
  feast_main_live_fowl.0003.bird_killed:0 "\n\nCuộc trốn thoát của con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã kết thúc đủ sớm, khi [fowl_bird_killer.GetTitledFirstName] đứng dậy khỏi chỗ ngồi của [fowl_bird_killer.GetHerHis], và với sự hiệu quả lạnh lùng, tóm lấy cổ nó. Với một cú vặn tay, một tiếng rắc lớn khiến cả hội trường im lặng.\n\nSự im lặng bị phá vỡ bởi những tiếng rên rỉ đau đớn của [fowl_dinner_target.GetFirstNamePossessive] khi [fowl_dinner_target.GetSheHe] ôm lấy chiếc mũi đang chảy máu của mình."
  feast_main_live_fowl.0003.bird_chased_by_character:0 "\n\nKhi con chim chạy loạn khắp nơi, [fowl_bird_chaser.GetTitledFirstName] đứng dậy nhận thử thách. Cảnh tượng [fowl_bird_chaser.GetHerHim] tuyệt vọng đuổi theo sinh vật điên loạn đó qua các bàn tiệc khiến mọi người được phen giải trí lớn. Cuối cùng [fowl_bird_chaser.GetSheHe] cũng dọa được con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chạy ra cửa đại sảnh và trốn vào màn đêm."
  feast_main_live_fowl.0003.bird_chased_away:0 "Khi con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chạy loạn khắp nơi, nhiều người hầu cố gắng ngăn nó lật đổ các món ăn khác và phá hỏng bữa tiệc. Trò vui nhất là cảnh đầu bếp cầm muôi đuổi theo nó, cuối cùng dồn con chim chạy ra cửa đại sảnh và trốn vào màn đêm."
  feast_main_live_fowl.0003.a:0 "À, yến tiệc nào mà chẳng cần một trò đùa."
  feast_main_live_fowl.0004.t:1 "Trò Chim Quậy Của [fowl_dinner_target.GetFirstNamePossessive]"
  feast_main_live_fowl.0004.entremets_served:1 "Giữa các món ăn, người hầu mang ra những món entremets được trang trí lộng lẫy để phô diễn tài nghệ của đầu bếp chủ tiệc. Một trong những món đáng tự hào là vài con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã bị lột da, nấu chín và nhồi thịt, rồi khoác lại bộ lông huy hoàng của chúng.\nKhi ta đưa dao lại gần, con chim đột nhiên ré lên! Một trong những con [ROOT.GetCharacter.Custom('exotic_fowl_type')] hóa ra hoàn toàn chưa được nấu! Nó mổ vào mũi ta rồi lao vụt ra giữa những vị khách đang la hét và cười ầm."
  feast_main_live_fowl.0004.bird_killed:0 "\n\nCuộc trốn thoát của con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã kết thúc đủ sớm, khi [fowl_bird_killer.GetTitledFirstName] đứng dậy khỏi chỗ ngồi của [fowl_bird_killer.GetHerHis], và với sự hiệu quả lạnh lùng, tóm lấy cổ nó. Với một cú vặn tay, một tiếng rắc lớn khiến cả hội trường im lặng.\n\nTa ngồi rên rỉ đau đớn, ôm chiếc mũi đang chảy máu và nguyền rủa tên chủ tiệc."
  feast_main_live_fowl.0004.bird_chased_by_character:1 "\n\nKhi con chim chạy loạn khắp nơi, [fowl_bird_chaser.GetTitledFirstName] đứng dậy nhận thử thách và tuyệt vọng đuổi theo sinh vật điên loạn đó. Cuối cùng [fowl_bird_chaser.GetSheHe] cũng dọa được con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chạy ra cửa đại sảnh và thoát đi.\n\nTa ngồi rên rỉ đau đớn, ôm chiếc mũi đang chảy máu và nguyền rủa chủ tiệc."
  feast_main_live_fowl.0004.bird_chased_away:0 "\n\nKhi con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chạy loạn, nhiều người hầu cố gắng ngăn nó lật đổ các món ăn. Trò vui nhất là cảnh đầu bếp cầm muôi đuổi theo nó, cuối cùng dồn con chim chạy ra cửa đại sảnh và trốn vào màn đêm.\nTa ngồi rên rỉ đau đớn, ôm chiếc mũi đang chảy máu và nguyền rủa chủ tiệc."
  feast_main_live_fowl.0004.a:0 "Chim quả thật mạnh hơn ta tưởng..."
  feast_main_live_fowl.0005.t:1 "Trò Chim Quậy Của [fowl_dinner_target.GetFirstNamePossessive]"
  feast_main_live_fowl.0005.entremets_served:0 "Người hầu mang ra những món khai vị được trang trí ấn tượng: vài con [ROOT.GetCharacter.Custom('exotic_fowl_type')], đã lột da, nấu chín và nhồi nhân, sau đó được khoác lại bộ lông tráng lệ của chúng. Tuy nhiên, khi [fowl_dinner_target.GetTitledFirstName] đưa con dao của [fowl_dinner_target.GetHerHis] lại gần một trong số chúng, con vật bỗng sống lại với một tiếng hét! Nó mổ vào mũi [fowl_dinner_target.GetFirstNamePossessive], trước khi lao ra giữa những vị khách đang la hét và cười đùa."
  feast_main_live_fowl.0005.bird_killed:0 "\n\nCuối cùng ta cũng chịu hết nổi, và khi nó chạy ngang qua ta liền chộp lấy cổ nó. Cả đại sảnh im bặt khi ta vặn cổ nó cho đến khi nghe tiếng rắc. Đống lông xơ xác của nó nằm lại trên sàn cho đến khi bữa tiệc kết thúc."
  feast_main_live_fowl.0005.a:0 "À, cảm giác sinh mạng tắt lịm trong tay ngươi..."
  feast_main_live_fowl.0006.t:1 "Trò Chim Quậy Của [fowl_dinner_target.GetFirstNamePossessive]"
  feast_main_live_fowl.0006.entremets_served:0 "Người hầu mang ra những món khai vị được trang trí ấn tượng: vài con [ROOT.GetCharacter.Custom('exotic_fowl_type')], đã lột da, nấu chín và nhồi nhân, sau đó được khoác lại bộ lông tráng lệ của chúng. Tuy nhiên, khi [fowl_dinner_target.GetTitledFirstName] đưa con dao của [fowl_dinner_target.GetHerHis] lại gần một trong số chúng, con vật bỗng sống lại với một tiếng hét! Nó mổ vào mũi [fowl_dinner_target.GetFirstNamePossessive], trước khi lao ra giữa những vị khách đang la hét và cười đùa."
  feast_main_live_fowl.0006.bird_chased_by_character:0 "\n\nTa lập tức nắm lấy cơ hội để gây ấn tượng với các vị khách khác. Ta dùng những cử chỉ uy quyền nhất của mình để dồn con chim về phía cửa ra. Dù nó chạy ngang qua vài cái bàn, và dù có lẽ ta đuổi theo hơi quá hăng, màn trình diễn vẫn khá ấn tượng. Khi con “tiểu long” ấy biến mất vào màn đêm mát lạnh, ta cảm thấy như giữa ta và nó vừa có một sự kết nối kỳ lạ."
  feast_main_live_fowl.0006.a:0 "Khoan đã… mọi người đang cười ta sao?"
  feast_main_live_fowl.1001.t:1 "Yến Tiệc Chim: Ký Ức Đau Đớn"
  feast_main_live_fowl.1001.desc:1 "Con chim chết tiệt trong bữa tiệc đó! Ta tưởng vết thương nó để lại sẽ lành hẳn, nhưng rốt cuộc nó lại để lại một vết sẹo xấu xí trên mặt ta!"
  feast_main_live_fowl.1001.a:0 "Nó sẽ mãi nhắc ta nhớ về kẻ thù không đội trời chung..."
  fowl_dinner_peacock:0 "công"
  fowl_dinner_child:0 "con chim sặc sỡ"
  feast_main_live_fowl.9001.t:2 "Kết Cục Của Con Chim"
  feast_main_live_fowl.9001.bird_killer:0 "Bữa tiệc của [host_saying_goodbye.GetTitledFirstNamePossessive] sắp kết thúc rồi.\n\nHầu hết mọi vị khách dường như đều hài lòng, ngoại trừ có lẽ [fowl_dinner_target.GetFirstName], người vẫn đang ôm lấy mũi của [fowl_dinner_target.GetHerHis] nơi con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã đánh dấu lên [fowl_dinner_target.GetHerHim].\n\nCó vẻ cũng không ai muốn ngồi gần [fowl_bird_killer.GetFirstName], sau cách xử lý tàn bạo của [fowl_bird_killer.GetHerHis] đối với con chim."
  feast_main_live_fowl.9001.no_bird_killer:0 "Bữa tiệc của [host_saying_goodbye.GetTitledFirstNamePossessive] sắp kết thúc rồi.\n\nHầu hết mọi vị khách dường như đều hài lòng, ngoại trừ có lẽ [fowl_dinner_target.GetFirstName], người vẫn đang ôm lấy mũi của [fowl_dinner_target.GetHerHis] nơi con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã đánh dấu lên [fowl_dinner_target.GetHerHim]."
  feast_main_live_fowl.9001.a:1 "Chúng ta nên làm chuyện này thường xuyên hơn, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host_saying_goodbye'))] của ta!"
  feast_main_live_fowl.9002.t:2 "Kết Cục Của Con Chim"
  feast_main_live_fowl.9002.bird_killer:2 "Sau những ngày đêm chung vui, bữa tiệc của ta sắp kết thúc rồi!\n\nHầu hết mọi vị khách dường như đều hài lòng, ngoại trừ có lẽ [fowl_dinner_target.GetFirstName], người vẫn đang ôm lấy mũi của [fowl_dinner_target.GetHerHis] nơi con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã đánh dấu lên [fowl_dinner_target.GetHerHim].\n\nCó vẻ cũng không ai muốn ngồi gần [fowl_bird_killer.GetFirstName], sau cách xử lý tàn bạo của [fowl_bird_killer.GetHerHis] đối với con chim."
  feast_main_live_fowl.9002.no_bird_killer:1 "Sau những ngày đêm chung vui, bữa tiệc của ta sắp kết thúc rồi!\n\nHầu hết mọi vị khách dường như đều hài lòng, ngoại trừ có lẽ [fowl_dinner_target.GetFirstName], người vẫn đang ôm lấy mũi của [fowl_dinner_target.GetHerHis] nơi con [ROOT.GetCharacter.Custom('exotic_fowl_type')] đã đánh dấu lên [fowl_dinner_target.GetHerHim]."
  feast_main_live_fowl.9002.a:1 "Chúng ta nên làm chuyện này thường xuyên hơn!"
  feast_main_live_fowl.9003.bird_killer:0 "Cuối cùng thì bữa tiệc cũng sắp kết thúc!\n\nMọi người dường như đều có khoảng thời gian vui vẻ, còn ta thì phải chịu đựng cơn đau do con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chết tiệt đó gây ra!\n\nTa nghĩ mình nên cảm ơn [fowl_bird_killer.GetFirstName] vì đã xử lý con quái vật hung ác đó nhanh gọn như vậy. Chỉ là ta hơi lo khi phải đứng quá gần [fowl_bird_killer.GetHerHim]."
  feast_main_live_fowl.9003.no_bird_killer:1 "Cuối cùng thì bữa tiệc cũng sắp kết thúc!\n\nMọi người dường như đều đã có khoảng thời gian vui vẻ, còn ta thì phải chịu đựng cơn đau do con [ROOT.GetCharacter.Custom('exotic_fowl_type')] chết tiệt đó gây ra! Ta đã mong đợi sự tiếp đãi tốt hơn từ [host_saying_goodbye.GetTitledFirstName].\n\nKhông sao, lần yến tiệc sau ta sẽ cho họ thấy!"
  feast_main_live_fowl.9003.a:1 "Ừ ừ, sắp kết thúc rồi."
  feast_main_live_fowl.9004.desc:1 "Yến tiệc của [host_saying_goodbye.GetTitledFirstNamePossessive] sắp kết thúc. Mọi người cười nói cho đến khi nhìn thấy ta thì lập tức im bặt. Ta biết hình ảnh ta bẻ gãy cổ con chim đó đã in sâu trong ký ức của họ. Và ta chắc chắn cũng nhớ rất rõ cảm giác sinh mạng rời khỏi cơ thể bất lực ấy.\n\nThật dễ chịu khi biết rằng tất cả bọn họ đều có chút lo sợ."
  feast_main_live_fowl.9004.a:1 "Bữa tiệc này cũng không tệ lắm."
  feast_main_live_fowl.9005.desc:0 "Yến tiệc của [host_saying_goodbye.GetTitledFirstNamePossessive] sắp kết thúc. Có vẻ hầu hết khách khứa đã có khoảng thời gian vui vẻ, dù ta ước rằng họ bớt nhắc lại chuyện ta chạy nhảy trên bàn đi.\nÍt ra [fowl_dinner_target.GetFirstName] cũng cảm ơn ta vì đã đuổi con chim đi sau khi nó tấn công [fowl_dinner_target.GetHerHim]."
  feast_main_live_fowl.9005.a:0 "Lần tiệc sau ta sẽ giữ phong thái hơn."
  feast_live_fowl_log_title:0 "Chim Tấn Công"
  feast_live_fowl_log:0 "[TARGET_CHARACTER.GetTitledFirstName] đã bị một con chim sống tấn công ngay trên bàn tiệc."
