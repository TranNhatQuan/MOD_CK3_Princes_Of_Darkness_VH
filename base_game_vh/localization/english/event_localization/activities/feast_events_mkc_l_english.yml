l_english:
 feast_mkc.0001.t: "Một Mình Bên Ký Ức"
 feast_mkc.0001.desc: "Mặc cho trong đại sảnh tiếng yến tiệc rộn ràng và niềm vui lan khắp nơi, ta vẫn để ý thấy một vị khách của mình, [guest_lost_loved_pet.GetShortUIName], đang ngồi lặng lẽ nơi góc phòng cùng con mèo của ta, [ROOT.Char.Custom('CatStoryName')]. [ROOT.Char.Custom('CatStorySheHe')|U] cuộn tròn yên bình trên đùi [guest_lost_loved_pet.GetShortUINamePossessiveNoTooltipNoFormat], khe khẽ rừ rừ, trong khi [guest_lost_loved_pet.GetFirstNameNoTooltip] nhẹ nhàng vuốt ve bộ lông [ROOT.Char.Custom('CatFurColor')] của [ROOT.Char.Custom('CatStoryHerHis')].\n\n\"[ROOT.Char.Custom('CatStorySheHe')|U] khiến ta nhớ đến con mèo cũ của mình quá đỗi,\" [guest_lost_loved_pet.GetSheHe] khẽ nói. Nước mắt dâng lên nơi khóe mắt [guest_lost_loved_pet.GetHerHis]."
 feast_mkc.0001.a: "Ở lại cùng [guest_lost_loved_pet.GetFirstNameNoTooltip] chia sẻ nỗi buồn về con mèo của ngươi ấy"
 feast_mkc.0001.b: "Có lẽ ta càng phải trân trọng quãng thời gian bên [ROOT.Char.Custom('CatStoryName')] hơn nữa"
 feast_helped_overcome_loss_opinion: "Đã cùng ta chia sẻ nỗi đau mất thú cưng"
 feast_sympathy_over_loss_opinion: "Đã giúp ta nguôi ngoai nỗi mất mát thú cưng"
 bonus_to_petting_pet_tt: "Khi vuốt ve mèo của mình, ngươi sẽ mất nhiều [stress|E] hơn"
