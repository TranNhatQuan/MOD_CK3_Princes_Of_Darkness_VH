l_english:
#Tour Travel Events
 tour_travel.1001.title:1 "Một Nông Nô và [angry_peasant.GetHerHis|U] [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1001.desc.intro:2 "Ta bước vào một quán rượu địa phương tại [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], mệt mỏi vì hành trình và khát khao [ROOT.Char.Custom('RegionalDrink')] cùng chút nghỉ ngơi.\n\nSự trầm ngâm yên tĩnh của ta bị phá vỡ bởi tiếng nắm đấm đập mạnh xuống mặt gỗ nứt toác, tiếp theo là một cái khạc nhổ khinh miệt. "Tên [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] đó!"
 tour_travel.1001.desc.mid.wrong_language:1 "[ROOT.Char.GetSheHe|U] còn chẳng biết tiếng [angry_peasant.GetCulture.GetLanguage.GetName], thế mà [ROOT.Char.GetSheHe] lại dám tự xưng là lãnh chúa hợp pháp của chúng ta!\""
 tour_travel.1001.desc.mid.wrong_culture:0 "[ROOT.Char.GetSheHe|U] hoàn toàn là kẻ ngoại bang! Làm sao chúng ta có thể bị cai trị bởi kẻ thậm chí còn không phải người [angry_peasant.GetCulture.GetName]?"" 
 tour_travel.1001.desc.mid.wrong_faith:0 "[ROOT.Char.GetSheHe|U] là một kẻ dị giáo [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))]! Mỗi giây [ROOT.Char.GetSheHe] còn ngồi trên ngai vàng đều là sự xúc phạm ý chí của [angry_peasant.GetFaith.HighGodNamePossessive].""
 tour_travel.1001.desc.mid.pretender:0 "Gia tộc [ROOT.Char.GetHouse.GetName] ư, ta khạc nhổ lên tất cả bọn chúng! Ai cũng biết những kẻ cai trị thực sự của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] là gia tộc [claimant_character_scope.GetHouse.GetName].""
 tour_travel.1001.desc.mid.powerful_diarch:0 "[ROOT.Char.GetTitleAsNameNoTooltip|U] mà chúng ta gọi là lãnh chúa thật yếu đuối! Kẻ cai trị thực sự của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] là tên [ROOT.Char.GetDiarch.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] [ROOT.Char.GetDiarch.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))], [ROOT.Char.GetDiarch.GetFirstName]!""
 tour_travel.1001.desc.mid.just_plain_dislike_em:0 "Chúng ta thậm chí không nên gọi tên [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] đó là [ROOT.Char.GetTitleAsNameNoTooltip], chúng ta nên gọi [ROOT.Char.GetHerHim] là một tên ngốc [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))]!""
 tour_travel.1001.desc.outro.nudist:1 "\n\nTa cố giữ kín thân phận, nhưng có vẻ phong thái [ROOT.Char.GetTitleAsNameNoTooltip|l] của ta và sự hoàn mỹ không thể nhầm lẫn của thân thể được chăm sóc kỹ lưỡng của gia tộc [ROOT.Char.GetHouse.GetName] đã khiến ta lộ diện. Ta phải nghĩ ra điều gì đó trước khi tình hình leo thang."
 tour_travel.1001.desc.outro:1 "\n\nTa cố giữ kín thân phận, nhưng có vẻ phong thái [ROOT.Char.GetTitleAsNameNoTooltip|l] của ta và huy hiệu gia tộc [ROOT.Char.GetHouse.GetName] trên y phục đã khiến ta lộ diện. Ta phải nghĩ ra điều gì đó trước khi tình hình leo thang."
 tour_travel.1001.a:0 "Nói lại trước mặt ta xem, đồ [angry_peasant.Custom2('InsultNoun', ROOT.Char)]!"
 tour_travel.1001.b:0 "Có lẽ giảm thuế sẽ khiến ngươi đổi ý."
 tour_travel.1001.c:0 "Ồ ta chỉ đơn giản trông giống [ROOT.Char.GetNameNoTooltip]!"

 tour_travel.1002.title:1 "Bông [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')|U] Giữa Đám Cỏ Dại"
 tour_travel.1002.desc:1 "Khi chúng ta cưỡi ngựa băng qua [pretty_peasant_county_scope.GetName], ta nhận ra mình dần say mê phong cảnh nơi đây. Quả thật vùng [pretty_peasant_county_scope.GetProvince.Custom('TerrainTypeProvince')] của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] hẳn là đẹp nhất toàn cõi [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], và đẹp hơn nữa là những [pretty_peasant.GetWomenMen] gọi nơi này là nhà.\n\nKhi đoàn tùy tùng hộ tống ta đi qua một ngôi làng nghèo nàn khác, ta bắt gặp một [pretty_peasant.GetWomanMan] trẻ tuổi đặc biệt xinh đẹp đang làm những công việc tầm thường của [pretty_peasant.GetHerHis], và tim ta chợt rung động. Ngắm nhìn [pretty_peasant.Custom('LoverPetName')] này trong sự bình dị của [pretty_peasant.GetHerHis] giống như chứng kiến thi ca hóa thành hình hài, và trước khi ta kịp suy nghĩ, trái tim ta đã ra lệnh cho đoàn tùy tùng dừng lại."
 tour_travel.1002.a:0 "Ta phải bày tỏ cảm xúc của mình."
 tour_travel.1002.b:0 "Ồ ta tưởng vừa thấy thứ gì đó... tiếp tục đi."

 tour_travel.1003.title:0 "Xưng Hô Với Một [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1003.desc:0 "Khi chuyến tuần du của ta tiếp tục băng qua vùng quê [angry_county_scope.GetName], ta được báo rằng đã sắp xếp gặp một đại diện của tầng lớp nông dân bất mãn.\n\nMột sinh vật đáng thương bò rạp trước mặt ta, tranh cãi về cái gọi là phẩm giá của dân thường [angry_county_scope.GetAdjective]. Tuy nhiên chẳng bao lâu ta nhận ra tên [rude_peasant.Custom2('InsultAdjective', ROOT.Char)] [rude_peasant.Custom2('InsultNoun', ROOT.Char)] đó chưa một lần gọi ta là '[ROOT.Char.Custom('FormOfAddressForLiege')|U]', một sự xúc phạm mà ta có thể trừng phạt theo bất cứ cách nào ta thấy thích hợp."
 tour_travel.1003.a:0 "Hãy cho sinh vật này bị quất roi suốt năm dặm."
 tour_travel.1003.b:0 "Nội tạng của [rude_peasant.GetHerHis|U] sẽ trang trí vùng [angry_county_scope.GetProvince.Custom('TerrainTypeProvince')]."
 tour_travel.1003.c:0 "Tha thứ cho sự ngu dốt của [rude_peasant.GetHerHis]."

 tour_travel.1004.title:1 "$altruism_intent_header$ Cái Chạm Chữa Lành"
 tour_travel.1004.desc.intro:0 "Ta tiến vào [diseased_county_scope.GetName], sẵn sàng ban cái chạm hoàng gia của ta cho dân chúng địa phương. Ngay lập tức ta phải đối diện với sinh vật khốn khổ nhất mà ta từng thấy. Chỉ với chút khích lệ nhỏ, [diseased_peasant.GetSheHe] liền chìa đôi bàn chân chai sạn của [diseased_peasant.GetHerHis] ra, chỉ cách đôi tay tinh sạch của ta vài tấc.\n\n"
 tour_travel.1004.desc.outro.christian:1 "Cũng như Chúa đã rửa chân cho các môn đồ, ta cũng được [ROOT.Char.GetFaith.HighGodName] kêu gọi rửa chân cho những thần dân trung thành của mình."
 tour_travel.1004.desc.outro:0 "Dù ta ghê tởm khi phải ở gần kẻ bần cùng bệnh tật bốc mùi này, người ta nói rằng cái chạm của ta có thể chữa lành cả những căn bệnh ghê tởm nhất."
 tour_travel.1004.a.tarantino:0 "Ta ghét phải thừa nhận, nhưng chuyện này hơi... kích thích."
 tour_travel.1004.a:0 "Một phúc lành cho ngươi, một ký ức tồi tệ cho ta."
 tour_travel.1004.b:0 "Ồ ta có thể xoa đôi chân đầy gân guốc này mãi."
 tour_travel.1004.c:0 "Có lẽ chỉ cần chạm nhẹ lên trán."
 tour_travel.1004.d.meat:0 "Cút đôi xúc xích bẩn thỉu đó khỏi ta!"
 tour_travel.1004.d.two_veg:0 "Cút những củ [ROOT.Char.Custom('get_region_root_vegetable_plural')] bẩn thỉu đó khỏi ta!"

 tour_travel.1005.title:1 "$altruism_intent_header$ Cái Chạm Hoàng Gia"
 tour_travel.1005.desc:0 "Tin về sự xuất hiện của ta dường như đã lan khắp [county_to_bless_scope.GetName], vì chẳng bao lâu đoàn tùy tùng của ta bị vô số nông nô vây quanh, cầu xin được ban phúc bởi cái chạm hoàng gia.\n\nTa dĩ nhiên có thể chỉ rảy chút nước do chính ta ban phúc lên họ và họ sẽ hài lòng, nhưng ban cho họ những đồng xu đã được chúc phúc để xoa dịu vết nhiễm bệnh sẽ khiến họ vui mừng và được ban phúc lâu hơn nhiều."
 tour_travel.1005.a:0 "Ta sẽ phát những đồng xu được chúc phúc."
 tour_travel.1005.b:0 "Rảy chút nước là đủ cho họ."
 tour_travel.1005.c:0 "Chúng không nhận được gì!"

 tour_travel.1006.title:1 "$altruism_intent_header$ Bố Thí Cho Kẻ Nghèo"
 tour_travel.1006.desc:0 "Khi chúng ta đi ngang qua [county_holder_to_bless_scope.GetFaith.HouseOfWorship] lớn tại [church_barony_scope.GetNameNoTooltip], ta ra lệnh đoàn hộ tống dừng lại để chiêm ngưỡng nơi linh thiêng phục vụ nhu cầu tinh thần của rất nhiều người tại [county_to_bless_scope.GetNameNoTooltip].\n\nKhuôn viên của [county_holder_to_bless_scope.GetFaith.HouseOfWorship] chật kín những kẻ khốn cùng đến cầu nguyện mong cải thiện hoàn cảnh. Đây có lẽ là cơ hội để cho dân chúng [county_to_bless_scope.GetNameNoTooltip] thấy ta hào hiệp và nhân từ đến mức nào."
 tour_travel.1006.a:0 "Bố thí cho kẻ nghèo!"
 tour_travel.1006.b:0 "Nếu chúng muốn tiền thì chúng không nên sinh ra nghèo."
 tour_travel.1006.c:0 "Lôi lũ sâu bọ này khỏi bậc thềm!"

 tour_travel.1007.title:0 "Hiền Nhân [wise_woman_scope.GetWomanMan|U] của [wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.1007.desc.intro:0 "Khi đoàn của ta tiếp tục hành trình khắp lãnh địa, chúng ta đi qua vùng hẻo lánh và ít ai ngờ tới của [wise_woman_barony_scope.GetNameNoTier]. Ta vốn chẳng bận tâm, nhưng [superstituous_courtier_scope.GetName] kéo ta sang một bên và nhiệt tình ca tụng đức hạnh của cái gọi là "Hiền Nhân [wise_woman_scope.GetWomanMan|U] của [wise_woman_barony_scope.GetNameNoTierNoTooltip]".\n\n"
 tour_travel.1007.desc.mid.ill:0 ""Xin thứ lỗi thưa [ROOT.Char.GetLadyLord], nhưng thần thấy ngài đang chịu đựng bệnh tật và đau đớn khủng khiếp. Hiền Nhân [wise_woman_scope.GetWomanMan|U] của [wise_woman_barony_scope.GetNameNoTierNoTooltip] chỉ cách đây một đoạn ngắn, và thần biết [wise_woman_scope.GetSheHe] có đúng thứ ngài cần để khỏe mạnh trở lại!"" 
 tour_travel.1007.desc.mid.pregnant:0 ""Thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], thần thấy ngài rạng rỡ hơn bao giờ hết, đúng như khi mang thai. Nhưng việc mang thai vất vả khiến ngài rất khó chịu, và Hiền Nhân [wise_woman_scope.GetWomanMan] gần đây có phương thuốc giúp ngài dễ chịu hơn.""
 tour_travel.1007.desc.mid.psychological:0 ""Thần biết tâm trí ngài đang bị dày vò, [ROOT.Char.Custom('FormOfAddressForLiege')], và điều đó khiến ngài khổ sở. Dù tinh thần ngài mạnh mẽ, căn bệnh của tâm trí có lẽ có thể được chữa bằng hương trầm hay thuốc từ Hiền Nhân nổi tiếng [wise_woman_scope.GetWomanMan|U] của [wise_woman_barony_scope.GetNameNoTierNoTooltip]!"" 
 tour_travel.1007.desc.mid.weakened:0 ""Với những vết thương của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')], thần lo cho sự an toàn và sức khỏe của ngài trong chuyến đi này. Nhưng thần biết một thầy thuốc gần đây có thể chữa trị. Hiền Nhân [wise_woman_scope.GetWomanMan|U] của [wise_woman_barony_scope.GetNameNoTierNoTooltip] có thể chữa mọi thứ!"" 
 tour_travel.1007.desc.mid.ugly:0 ""Nếu thần được phép nói thẳng, [ROOT.Char.Custom('FormOfAddressForLiege')], vài người trong đoàn đã bàn tán về... diện mạo của ngài. Nhưng đừng lo! Có một Hiền Nhân [wise_woman_scope.GetWomanMan] gần đây có thể chữa mọi bệnh, họ nói vậy.""
 tour_travel.1007.desc.outro:0 "\n\nTa vẫn nghi ngờ, nhưng [superstituous_courtier_scope.GetNameNoTooltip] tin tưởng tuyệt đối vào vị thầy chữa bệnh thần bí này đến mức ta cũng bị cám dỗ ghé thăm."
 tour_travel.1007.a:0 "Đi đường vòng một chút cũng được."
 tour_travel.1007.b:0 "Toàn chuyện nhảm nhí!"
 go_see_wise_woman_tt:0 "Ngươi đi gặp Hiền Nhân [wise_woman_scope.GetWomanMan], điều này có thể mang lại kết quả tốt hoặc xấu."
 tour_travel.1008.title:0 "$tour_travel.1007.title$"
 tour_travel.1008.desc.intro:0 "Khi màn đêm buông xuống, ta một mình bước vào túp lều mờ ảo của [wise_woman_scope.GetWomanMan] Thông thái, đoàn tùy tùng đứng đợi bên ngoài. Không còn nghi ngờ gì nữa, [wise_woman_scope.GetWomanMan] lập dị đang khập khiễng bên trong chính là người ta cần tìm.\n\n\"À, ta đã đợi người từ lâu. Vào đây! Hãy cùng chia sẻ ngọn lửa này, [ROOT.Char.GetTitleAsNameNoTooltip|U] của ta.\" Trước khi ta kịp thốt lên lời, đôi bàn tay lạnh giá của [wise_woman_scope.GetHerHis] đã bao lấy tay ta."
 tour_travel.1008.desc.mid.ill:0 "Ta trải qua cả đêm uống những chất lỏng đen ghê tởm và ngửi hương trầm say mê, và khi bước ra vào buổi sáng, ta cảm thấy như một [ROOT.Char.GetWomanMan] hoàn toàn mới."
 tour_travel.1008.desc.mid.pregnant:0 "Ta trải qua cả đêm được cho ăn đủ thứ kỳ lạ: nhãn cầu, thảo mộc và những loại trái cây chưa từng thấy, trong khi mọi nhu cầu đều được [wise_woman_scope.GetWomanMan] này tận tình chăm sóc. Đến sáng hôm sau, ta tỉnh dậy và cảm thấy cơ thể tràn đầy sinh lực!"
 tour_travel.1008.desc.mid.psychological:0 "Đôi tay [wise_woman_scope.GetHerHis|U] siết lấy đầu ta như dã thú vồ con mồi. Chúng ta tụng niệm những lời ta không hiểu suốt đêm, và sáng ra ta cảm thấy đầu óc nhẹ nhõm."
 tour_travel.1008.desc.mid.weakened:0 "[wise_woman_scope.GetSheHe|U] bôi lên vết thương ta đủ loại chất sệt và thảo mộc cay rát, và dù đau đớn, sáng ra ta thấy vết thương đã khép lại hơn."
 tour_travel.1008.desc.mid.ugly:0 "[wise_woman_scope.GetSheHe|U] dành cả đêm bôi đủ loại kem và thuốc sặc sỡ lên mặt ta, che phủ khuyết điểm và vết sần. Sáng ra nhìn vào gương, ta thấy một [ROOT.Char.GetWomanMan] mới khiến cả kẻ thanh khiết cũng phải đỏ mặt vì dục vọng!"
 tour_travel.1008.desc.outro:0 "\n\nMọi nghi ngờ của ta tan biến, và bệnh tật của ta đã được chữa khỏi."
 tour_travel.1008.a:0 "Đúng là phép màu!"
 tour_travel.1008.b:0 "[wise_woman_scope.GetSheHe|U] nên làm thầy thuốc của ta!"
 tour_travel.1009.title:0 "Tên Lang Băm của [wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.1009.desc.intro:0 "$tour_travel.1008.desc.intro$"
 tour_travel.1009.desc.mid.ill:0 "Ta trải qua cả đêm hít phải những mùi hôi không thể chịu nổi, uống chất lỏng ghê tởm và bị bôi đầy cỏ gai! Toàn bộ trải nghiệm khiến cơn buồn nôn và đau đớn của ta còn tệ hơn, và ta kết thúc đêm trong tình trạng tệ hơn lúc bắt đầu."
 tour_travel.1009.desc.mid.ugly:0 "[wise_woman_scope.GetSheHe|U] dành cả đêm bôi đủ loại kem và thuốc sặc sỡ lên mặt ta, che phủ khuyết điểm và vết sần. Sáng ra nhìn vào gương, ta hét lên kinh hãi khi thấy con quái vật mà [wise_woman_scope.GetSheHe] đã biến ta thành!"
 tour_travel.1009.desc.mid.nothing:0 "Ta làm mọi điều người đàn bà yêu cầu: uống trà thảo mộc, xoa bóp tay chân, đứng trên lửa và nuốt đủ thảo mộc để hạ gục một người. Nhưng tất cả dường như chẳng có tác dụng gì, ta không thấy khá hơn lúc đến."
 tour_travel.1009.desc.outro:0 "\n\nTa không biết [superstituous_courtier_scope.GetNameNoTooltip] đã nghe gì về vị "hiền nhân" [wise_woman_scope.GetWomanMan] này, nhưng rõ ràng [wise_woman_scope.GetSheHe] chỉ là một kẻ lừa đảo ven đường."
 tour_travel.1009.a:0 "Thật phí thời gian."
 tour_travel.1009.b:0 "Lừa dối [ROOT.Char.GetTitleAsNameNoTooltip|U] là tội đáng chết."
 tour_travel.9010.t:0 "Coi Chừng Bọn Cướp Đường!"
 tour_travel.9010.desc:0 "Đoàn của ta tiếp tục theo lộ trình đến [next_destination.GetName] thì đột nhiên dừng gấp theo lệnh của [travel_leader.GetNamePossessive]!\n\n"Dừng lại, lũ ngu! Người ta nói con đường này đầy rẫy cướp và vô lại, chúng ta phải đổi hướng!"\n\nCon đường [travel_leader.GetSheHe] đề xuất dài hơn, nhưng [travel_leader.GetSheHe] đảm bảo an toàn hơn."
 tour_travel.9010.a:0 "Đi đường an toàn."
 tour_travel.9010.b:0 "Chúng ta phải trừng trị lũ cặn bã đó!"
 tour_travel.9010.success:0 "Bọn cướp bị đánh bại"
 tour_travel.9010.failure:0 "Bọn cướp đánh tan các ngươi"
 tour_travel.9020.t:0 "Công Lý Địa Phương"
 tour_travel.9020.desc.intro:0 "Chúng ta đến một ngôi làng nhỏ tại [ROOT.Char.GetCurrentLocation.GetName] và thấy quảng trường náo loạn. Một sinh vật tội nghiệp bị dân làng phẫn nộ vây quanh, ánh mắt tuyệt vọng của [accused_character.GetHerHis] bỗng lóe lên hy vọng khi [accused_character.GetSheHe] thấy đoàn của ta tiến đến.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')], xin hãy nghe! Đừng tin họ, tất cả đều là dối trá, tôi vô tội! Ngài có ban cho tôi công lý của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip|U] không?"\n\n"
 tour_travel.9020.desc.outro.guilty:0 "Đúng là bằng chứng chỉ mang tính suy đoán, nhưng một nông dân thấp hèn không nên nói chuyện với [ROOT.Char.GetTitleAsNameNoTooltip|U] khi chưa được phép."
 tour_travel.9020.desc.outro:0 "Bằng chứng khá rõ ràng, và [accused_character.GetSheHe] còn dám nói chen."
 tour_travel.9020.a:0 "Hành quyết là công bằng."
 tour_travel.9020.b:0 "Bằng chứng vô nghĩa, thả [accused_character.GetHerHim] đi."
 tour_travel.9020.c:0 "Phục vụ ta sẽ là hình phạt của [accused_character.GetHerHis]."
 tour_travel.9030.t:0 "Ổ Tội Lỗi"
 tour_travel.9030.desc.intro:0 "Khi ta bị đánh thức khỏi giấc ngủ nửa đêm, ta nghe tiếng reo hò ăn mừng tiến gần phía sau. [drunky_entourage.GetName|U] xuất hiện, [drunky_entourage.GetHerHis]"
 tour_travel.9030.desc.mid.hashish:0 "đôi mắt đỏ ngầu vì hashish."
 tour_travel.9030.desc.mid:0 "hơi thở nồng nặc mùi [ROOT.Char.Custom('RegionalAlcoholicDrink')]."
 tour_travel.9030.desc.outro:0 "\n\n"Nhân danh [drunky_entourage.GetFaith.HighGodName]! Có một ổ tội lỗi tuyệt vời cách đây vài phút thôi, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U]. Chúng ta phải ở lại và làm mình ngu đi vì vui vẻ!"" 
 tour_travel.9030.a:0 "Ăn chơi và vui vẻ thôi!"
 tour_travel.9030.b:0 "Chúng ta không được sao nhãng."
 tour_travel.9040.t: "Vị Anh Hùng Vĩ Đại Nhất"
 tour_travel.9040.desc: "Đoàn của ta dừng chân nghỉ ngơi, ta liền lang thang vào một tửu quán tầm thường để tìm hiểu người dân địa phương. Giữ kín thân phận, ta lắng nghe những câu chuyện ồn ào của tầng lớp bình dân.\n\nMột [peasant.GetWomanMan] đang vui vẻ cùng đám chiến hữu, trao đổi về những anh hùng huyền thoại của họ. \"...còn về [ROOT.Char.GetPromotedLegend.GetProtagonist.GetName] này thì sao? Ta chẳng biết liệu [ROOT.Char.GetPromotedLegend.GetProtagonist.GetSheHe] có thực sự tồn tại hay không, hay chỉ là hư cấu trong cái truyền thuyết '[ROOT.Char.GetPromotedLegend.GetName]' đó!\""
 tour_travel.9040.a: "Ta phải bảo vệ huyền thoại của mình!"
 tour_travel.9040.a.success: "Nông dân ca ngợi câu chuyện của ngươi"
 tour_travel.9040.a.failure: "Ngươi bị chế nhạo"
 tour_travel.9040.b: "Rõ ràng câu chuyện vượt quá đầu óc của [peasant.GetHerHis]."

#Tour Arriving at a Stop
#Vassal: Liege arrival event
  tour_general.0001.title:1 "[visiting_liege.GetTitledFirstNameNoTooltip] Đã Đến!"
  tour_general.0001.desc.intro:1 "Cuối cùng, đoàn tùy tùng của [visiting_liege.GetTitledFirstNamePossessive] đã tới cổng thành của ta, ghé thăm [ROOT.Char.GetCapitalLocation.GetName] trong chuyến du hành của [visiting_liege.GetHerHis] qua [visiting_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
  tour_general.0001.desc.type.majesty:0 "Trang phục lộng lẫy và dáng vẻ cao sang của đoàn người cho thấy tham vọng khiến ta phải kinh ngạc.\n\n"
  tour_general.0001.desc.type.intimidation:0 "Những hàng vệ binh nghiêm nghị và kỷ luật khiến rõ ràng rằng nỗi sợ hãi chính là thông điệp của ngày hôm nay.\n\n"
  tour_general.0001.desc.type.taxation:0 "Cỗ xe chở rương tiền cùng đoàn thu thuế cho thấy sau chuyến viếng thăm này ta sẽ nghèo đi.\n\n"
  tour_general.0001.desc.mid.hates_liege:1 "Đã đến lúc cái [visiting_liege.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] đó rời khỏi những đại sảnh tẻ nhạt của [visiting_liege.GetHerHis] và nhìn thấy đất nước thực sự."
  tour_general.0001.desc.mid.lover:0 "Đã quá lâu kể từ khi ta cảm nhận vòng tay của [visiting_liege.GetHerHis] — có lẽ sẽ có thời gian để bù đắp..."
  tour_general.0001.desc.mid.friend:0 "Dù chúng ta gặp nhau dưới gánh nặng lễ nghi, chuyến thăm của một người bạn tốt như vậy vẫn rất đáng hoan nghênh."
  tour_general.0001.desc.mid.close_family:0 "Một cơ hội hiếm hoi nhưng đáng mừng để gặp [ROOT.Char.Custom2('RelationToMeShort', visiting_liege)] của ta; thật tốt khi [visiting_liege.GetHerHim] đã đến."
  tour_general.0001.desc.mid.house:0 "[ROOT.Char.Custom2('RelationToMeShort', visiting_liege)] của ta đã đến để củng cố cả mối quan hệ chư hầu lẫn mối liên kết của Gia tộc [ROOT.Char.GetHouse.GetBaseName]."
  tour_general.0001.desc.mid.powerful_vassal:0 "Là một trong những chư hầu quyền lực nhất của vương quốc, không có gì lạ khi [visiting_liege.GetSheHe] đến gõ cửa ta."
  tour_general.0001.desc.mid.default:1 "Được tiếp đón [visiting_liege.GetLadyLord] của vương quốc ngay tại đại sảnh của ta sẽ là một vinh dự lớn."
  tour_general.0001.desc.phase.tour_grounds:0 "\n\nTa sẽ dẫn [visiting_liege.GetTitleAsNameNoTooltip] tham quan [ROOT.Char.Custom('FortifiedBuilding')] của ta cùng những vùng đất [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip],"
  tour_general.0001.desc.phase.dinner:0 "\n\nTa sẽ tổ chức một bữa tiệc xa hoa xứng đáng với [visiting_liege.GetTitleAsNameNoTooltip] — cơ hội để thể hiện lòng hiếu khách của vùng đất [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] —"
  tour_general.0001.desc.phase.cultural_festival:0 "\n\nTa sẽ cho [visiting_liege.GetTitleAsNameNoTooltip] xem một lễ hội phô bày những tiết mục giải trí và biểu diễn xuất sắc nhất của người [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip],"
  tour_general.0001.desc.outro:1 "và chuẩn bị giường nghỉ cùng các trò giải trí cho đoàn tùy tùng của [visiting_liege.GetHerHis].\n\nCâu hỏi duy nhất là ta có mở cổng cho [visiting_liege.GetHerHim] vào không?"
  tour_general.0001.a:1 "Chào mừng, thưa [visiting_liege.GetTitleAsNameNoTooltip] của ta! Chào mừng!"
  tour_general.0001.b:1 "Hãy giả vờ như không có ai ở nhà..."

#Liege: Phase invalidation
  tour_general.0500.title:0 "Không Có Ai Ở Nhà"
  tour_general.0500.desc.intro:0 "Tin đã đến rằng kế hoạch của ta đã bị gián đoạn và ta không còn có thể thực hiện chuyến viếng thăm hoàng gia tới [tour_location.GetName].\n\n"
  tour_general.0500.desc.self:0 "Ta đã trở thành [ROOT.Char.GetLadyLord] mới của [tour_location.GetName], khiến không còn ai ngoài chính ta để tiếp đón chuyến lưu lại của mình."
  tour_general.0500.desc.already_visited:0 "Ta đã ghé thăm [stop_host_scope.GetName] trước đó trong Đại Chuyến Du Hành của mình, và ta không thể thiên vị [stop_host_scope.GetHerHim]. [stop_host_scope.GetSheHe|U] sẽ chỉ nhận một lần viếng thăm, không hơn."
  tour_general.0500.desc.no_longer_liege:0 "[stop_host_scope.GetTitleAsNameNoTooltip|U] của [tour_location.GetNameNoTooltip] không còn trực tiếp phục tùng ta nữa."
  tour_general.0500.desc.lowly_baron:0 "[tour_location.GetNameNoTooltip|U] giờ thuộc quyền một [stop_host_scope.GetTitleAsNameNoTooltip|U] thấp kém, và việc ghé thăm những [stop_host_scope.GetWomenMen] có địa vị thấp như vậy là điều không xứng với ta."
  tour_general.0500.desc.leading_army:0 "[stop_host_scope.GetName|U] đã ra chiến trường và không còn khả năng tiếp đón ta."
  tour_general.0500.desc.gone_travelling:0 "[stop_host_scope.GetName|U] đã bỏ mặc tư gia và đi lang thang đến những vùng đất không xác định."
  tour_general.0500.desc.imprisoned_by_me:0 "[stop_host_scope.GetName|U] đã bị bắt và giờ đang mục rữa trong ngục tối của ta."
  tour_general.0500.desc.imprisoned:0 "[stop_host_scope.GetName|U] không còn là một [stop_host_scope.GetWomanMan] tự do khi [stop_host_scope.GetSheHe] đang mục rữa trong một ngục tối xa lạ."
  tour_general.0500.desc.deadly_illness:0 "[stop_host_scope.GetName|U] đã mắc một căn bệnh chết người, và ta không thể mạo hiểm ghé thăm rồi hít phải thứ khí độc từ [stop_host_scope.GetHerHis]."
  tour_general.0500.desc.incapable:0 "[stop_host_scope.GetName|U] không còn làm chủ được tâm trí mình và sẽ là một chủ nhà tồi tệ."
  tour_general.0500.desc.gone_adventuring:0 "[stop_host_scope.GetName|U] đã lên đường phiêu lưu tới những vùng đất mà ta không muốn đặt chân tới."
  tour_general.0500.desc.at_war:0 "Bóng tối chiến tranh đã phủ lên [tour_location.GetNameNoTooltip] và [stop_host_scope.GetName] đã cảnh báo ta đừng tới đó."
  tour_general.0500.desc.outro:0 "\n\nDù điều này không chấm dứt chuyến du hành của ta, nó vẫn là một nỗi thất vọng lớn."
  current_phase_skipped_tt:0 "Giai đoạn tiếp theo của ngươi đã bị bỏ qua."
  tour_general.0500.a:0 "Ta đã rất mong chờ điều đó..."

#Liege: Rejected at the gates
  tour_general.0501.title:0 "Bị Từ Chối"
  tour_general.0501.desc:1 "Khi đoàn tùy tùng của ta dừng lại trước cổng thành của [stop_host_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier], lời gọi được cất lên yêu cầu [stop_host_scope.GetName] ra tiếp đón ta, nhưng sau một khoảng thời gian quá mức hào phóng, thậm chí không một người hầu thấp kém nào xuất hiện để chào đón. Lời gọi được lặp lại nhiều lần nữa, nhưng chúng ta không nhận được câu trả lời nào ngoài tiếng chim hoang và tiếng gió nhẹ.\n\nRõ ràng là ta đã bị từ chối ngay tại cổng, và [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.GetTitleAsNameNoTooltip] đã xúc phạm vương quyền!"
  tour_general.0501.a:0 "Thôi, tiếp tục lên đường."
  tour_general.0501.b:0 "Sự sỉ nhục này sẽ không sớm bị quên."
  tour_general.0501.c:0 "Phá tung cái cổng chết tiệt đó!"
  tour_general.0501.liege_merciful:0 "[visiting_liege.GetFirstName] đã tha thứ cho ngươi"
  tour_general.0501.liege_angry:0 "[visiting_liege.GetFirstName] bị xúc phạm"
  tour_general.0501.raid:0 "[visiting_liege.GetFirstName] đã cướp phá lãnh địa của ngươi"

 #Tour Remaining at a Stop
 #Vassal Events
  tour_general.1001.title:0 "$activity_tour$: Một Lời Thỉnh Cầu Lịch Sự"
  tour_general.1001.title_theft:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Một Yêu Sách Lịch Sự"
  tour_general.1001.intro:0 "Ta nhận thấy [visiting_liege.GetTitledFirstName] đang để mắt tới [tour_general_3001_target_courtier.GetTitledFirstName], người nổi tiếng trong vùng bởi [tour_general_3001_target_courtier.Custom('GetCourtierTrait')] của mình."
  tour_general.1001.desc:0 "\n\nNói ngắn gọn, [visiting_liege.GetTitleAsNameNoTooltip] muốn chuyển [tour_general_3001_target_courtier.GetHerHim] tới triều đình của [visiting_liege.GetTitleAsNamePossessiveNoTooltip]."
  tour_general.1001.desc_theft_liege:0 "\n\nKhông mấy bận tâm đến ý kiến của ta, dường như [visiting_liege.GetTitleAsNameNoTooltip] thậm chí đã cố cưỡng ép đưa [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] tới triều đình của [visiting_liege.GetTitleAsNamePossessiveNoTooltip] trong đêm."

  tour_general.1001.outro:0 "\n\nĐây hẳn là cơ hội để ta thể hiện lòng rộng lượng với [visiting_liege.GetHerHim]!"
  tour_general.1001.outro_unusual_courtier:0 "\n\nDù ta không thực sự hiểu lý do của [ROOT.Char.Custom2('RelationToMePossessive', visiting_liege )], ta cũng không quá bận tâm nếu mất [tour_general_3001_target_courtier.GetHerHim]."
  tour_general.1001.outro_unusual_host_unusual_courtier:0 "\n\nTa có thể nghĩ ra #EMP vài lý do#! để giữ [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] ở lại. Tuy nhiên..."
  tour_general.1001.outro_theft_liege:0 "\n\nKhông cần phải nói, điều này khiến ta khó chịu theo nhiều cách."
  tour_general.1001.outro_theft_liege_unusual_courtier:0 "\n\nThú thật, ta không hiểu vì sao [visiting_liege.GetTitledFirstName] lại muốn [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip], nhưng [tour_general_3001_target_courtier.GetSheHe] là #EMP người của ta#! [ROOT.Char.Custom2('RelationToMeShort', tour_general_3001_target_courtier )], chết tiệt."
  tour_general.1001.a:0 "Ta hy vọng [tour_general_3001_target_courtier.GetFirstNameNoTooltip] sẽ phục vụ [visiting_liege.GetHerHim] thật tốt."
  tour_general.1001.a_theft_liege:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] vốn cũng chẳng giúp ích gì cho ta."
  tour_general.1001.b:0 "Có qua có lại, [visiting_liege.GetTitledFirstNameNoTooltip]."
  tour_general.1001.b.tt:0 "Ngươi yêu cầu một ân huệ để đổi lấy việc [tour_general_3001_target_courtier.GetFirstName] gia nhập triều đình của [visiting_liege.GetTitledFirstNamePossessive]"
  tour_general.1001.c:0 "Ta tin rằng [visiting_liege.GetTitleAsNameNoTooltip] có thể khiến việc này đáng giá..."
  tour_general.1001.c.tt:0 "Ngươi yêu cầu một khoản vàng để đổi lấy việc [tour_general_3001_target_courtier.GetFirstName] gia nhập triều đình của [visiting_liege.GetTitledFirstNamePossessive]"
  tour_general.1001.d:0 "Chỉ có #EMP một#! lý do khiến [visiting_liege.GetSheHe] muốn [tour_general_3001_target_courtier.GetFirstNameNoTooltip]..."
  tour_general.1001.d.flavor:0 "Hãy cứ chiều theo."
  tour_general.1001.d.tt:0 "Ngươi đề nghị cùng [visiting_liege.GetShortUIName] chia sẻ một bữa ăn #EMP kỳ lạ#!"
  tour_general.1001.d.tt_extra:0 "[visiting_liege.GetShortUIName] либо sẽ chấp nhận lời mời hoặc lên án việc ăn thịt người của ngươi"
  tour_general.1001.e:0 "#EMP Ngươi chết ngay bây giờ!#!"
  tour_general.1001.e.flavor:0 "Nhân danh [ROOT.Char.GetFaith.DevilName]!"
  tour_general.1001.e.tt:0 "Ngươi lao vào tấn công [visiting_liege.GetShortUIName]"
  tour_general.1001.e.success:0 "Cuộc tấn công của ngươi thành công"
  tour_general.1001.e.success.tt:0 "Ngươi đã sống sót"
  tour_general.1001.e.success.desc:0 "Ngươi sống sót sau trận chiến."
  tour_general.1001.e.bodyguard.desc:0 "Vệ sĩ của ngươi đã bước vào cứu ngươi."
  tour_general.1001.e.slain.tt:0 "Ngươi đã bị giết"
  tour_general.1001.e.slain.desc:0 "Ngươi đã thua trong trận chiến."
  tour_general.1001.e.failure:0 "Ngươi thất bại trong cuộc tấn công"
  tour_general.1001.e.bodyguard:0 "[tour_general_1001_bodyguard.GetTitledFirstNameNoTooltip] bước vào"
  tour_general.1001.f:0 "Chuyện này có vẻ là một ý tưởng tồi."
  tour_general.1001.f_theft_liege:0 "Ta #EMP khó lòng#! đồng ý với yêu cầu này bây giờ."
  tour_general.1001.f.tt:0 "Ngươi không muốn từ bỏ cận thần của mình"

 #Vassal/Liege Event
  tour_general.1002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Một Bữa Tiệc Vừa Kinh Hoàng Vừa Vinh Quang"
  tour_general.1002.title_vassal:0 "$activity_tour$: Một Bữa Tiệc Vừa Kinh Hoàng Vừa Vinh Quang"
  tour_general.1002.desc_host:0 "Ta ngắm lại cách bày biện các món ăn trên bàn thêm một lần nữa. Đầu bếp của ta đã làm việc không ngừng để chuẩn bị từng phần nhỏ của [tour_general_3001_target_courtier.GetFirstName] cho bữa tiệc của chúng ta. Cách trang trí thật tuyệt vời. \n\nTa quay lại khi [visiting_liege.GetTitledFirstName] bước vào căn phòng, một mình, đúng như chúng ta đã thỏa thuận. Ta quan sát khi [visiting_liege.GetSheHe] nhìn quanh và một nụ cười thoáng qua nơi khóe miệng của [visiting_liege.GetHerHis]. [visiting_liege.GetSheHe|U] bước tới và ngồi xuống bàn. Ta ngồi cùng [visiting_liege.GetHerHim]."
  tour_general.1002.desc_liege:0 "Khi ta bước vào căn phòng, không còn nghi ngờ gì nữa rằng [tour_general_3001_target_courtier.GetFirstName] chính là nhân vật chính của bữa tiệc.\n\n[stop_host_scope.GetTitledFirstName] đã không tiếc chi phí và chiếc bàn tràn ngập những món ăn hấp dẫn, tất cả đều tuân theo triết lý không lãng phí thứ gì và tận dụng mọi mẩu ẩm thực ngon lành mà [tour_general_3001_target_courtier.GetFirstNameNoTooltip] có thể đóng góp. \n\nNgay cả cái đầu của [tour_general_3001_target_courtier.GetFirstNamePossessiveNoTooltip] cũng đã được khoét rỗng và làm sạch, cẩn thận đặt ở cuối bàn và trang trí bằng cây cỏ địa phương. Ta dừng lại một lúc để ngắm nhìn tất cả."
  tour_general.1002.a:0 "Thật là #EMP tuyệt hảo#!!"
  tour_general.1002.b:0 "... có lẽ chỉ một miếng nhỏ thôi."
  tour_general.1002.c:0 "Vì ân nhân của chúng ta, [tour_general_3001_target_courtier.GetFirstNameNoTooltip]!"
  tour_general.1002.a.flavor:0 "Ngươi bắt đầu ăn."

 #Liege Events
  tour_general.3001.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Trong Mắt Kẻ Ngắm"
  tour_general.3001.desc_gluttonous_cannibal:0 "Là một kẻ sành #EMP thịt ngon#!, [tour_general_3001_target_courtier.GetFirstName] thực sự nổi bật giữa đám đông. Khối thân thể đồ sộ của [tour_general_3001_target_courtier.GetHerHis|U] khiến đầu gối ta run rẩy. Tay ta run lên khi nhìn [tour_general_3001_target_courtier.GetHerHim] ngấu nghiến thức ăn, những giọt mỡ lấp lánh trên đôi má phúng phính của [tour_general_3001_target_courtier.GetHerHis]. \n\n#EMP Thật béo tốt.#! Ta nghiến chặt răng. Đây chính là định mệnh."
  tour_general.3001.desc_gluttonous:0 "[tour_general_3001_target_courtier.GetFirstName] trông thật sự giống một [tour_general_3001_target_courtier.GetWomanMan] biết tận hưởng điều tốt đẹp trong đời. Có chút ghen tị dâng lên trong lồng ngực ta khi nhìn vóc dáng khỏe mạnh của [tour_general_3001_target_courtier.GetHerHis] và niềm vui thuần khiết mà [tour_general_3001_target_courtier.GetSheHe] dường như tìm thấy trong thức ăn.\n\n[stop_host_scope.GetTitledFirstName] [stop_host_scope.GetHerselfHimself] cứ nói mãi về chất lượng món ăn do [tour_general_3001_target_courtier.GetFirstNamePossessiveNoTooltip] nấu."
  tour_general.3001.desc_insanity_courtier:0 "Có điều gì đó đầy lôi cuốn ở [tour_general_3001_target_courtier.GetFirstName]. Ta không thể nói rõ là gì. Nhưng [tour_general_3001_target_courtier.GetSheHe] mang một bầu không khí bí ẩn và thẳng thắn hiếm thấy ngày nay. \n\nCảm giác như [tour_general_3001_target_courtier.GetSheHe] đang nhìn thẳng vào nơi linh hồn ta lẽ ra phải ở, nếu [ROOT.Char.GetFaith.DevilName] chưa chiếm lấy nó trước. \n\n[tour_general_3001_target_courtier.GetSheHe|U] hiểu điều đó."
  tour_general.3001.desc_beauty:0 "Ngay khi nhìn thấy [tour_general_3001_target_courtier.GetFirstName], ta đã nín thở. Như thể chính [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself] đã ban cho [tour_general_3001_target_courtier.GetFirstNameNoTooltip] vẻ đẹp của hàng ngàn [ROOT.Char.Custom('get_region_flower_type_plural')], thời gian như ngừng trôi khi ta chiêm ngưỡng những nét thanh tú của [tour_general_3001_target_courtier.GetHerHis]. \n\nVẻ đẹp nhường này mà lại phí hoài nơi đám dân đen này."
  tour_general.3001.desc_intellect:0 "[tour_general_3001_target_courtier.GetFirstName] đã nhiều lần khiến ta kinh ngạc bởi trí tuệ của [tour_general_3001_target_courtier.GetHerHis]. Một trí giả thực thụ của thời đại chúng ta, tiềm năng ẩn trong tài năng và phẩm chất của [tour_general_3001_target_courtier.GetHerHis] là vô cùng lớn. Ta chắc chắn có thể tận dụng chúng tốt hơn thay vì để chúng héo úa ở đây như một cái cây thiếu ánh mặt trời."
  tour_general.3001.desc_physique:0 "Khi [tour_general_3001_target_courtier.GetFirstName] cúi xuống nhặt món đồ nhỏ trên sàn hành lang, ta cũng hơi nghiêng người để nhìn rõ những cơ bắp rắn chắc chuyển động dưới làn da. Thân thể như vậy không thể mua được. Nhưng có lẽ nếu ta vây quanh mình bằng nhiều người khỏe mạnh như thế này hơn...\n\n"
  tour_general.3001.desc_martial:0 "Khả năng võ nghệ của [tour_general_3001_target_courtier.GetFirstName] vốn nổi tiếng trong triều đình của [stop_host_scope.GetTitledFirstNamePossessive]. Nếu ngươi muốn bàn về kế hoạch tấn công hay cách mài sắc vũ khí và trí tuệ của mình, ngươi tìm đến [tour_general_3001_target_courtier.GetHerHim]. Đó là một kỹ năng rất được săn đón và khiến ta hứng thú.\n\n"
  tour_general.3001.desc_diplomacy:0 "Khả năng ngoại giao của [tour_general_3001_target_courtier.GetFirstName] chưa bao giờ thôi khiến ta kinh ngạc. [tour_general_3001_target_courtier.GetSheHe|U] có thể nói với [ROOT.Char.GetFaith.ReligiousHeadName] rằng đồ lót của [ROOT.Char.GetFaith.GetReligiousHead.GetHerHis] đang lộ ra, mà vẫn được thưởng vài đồng vàng, một nụ cười và lời 'cảm ơn'."
  tour_general.3001.desc_stewardship:0 "[tour_general_3001_target_courtier.GetFirstName] là một kho kiến thức vô tận về... của cải. [tour_general_3001_target_courtier.GetSheHe|U] có vô số ý tưởng về quản lý mà [tour_general_3001_target_courtier.GetSheHe] than phiền rằng không thể áp dụng tại triều đình của [stop_host_scope.GetTitledFirstNamePossessive]. \n\nThật đáng tiếc nếu tài năng như vậy bị lãng phí."
  tour_general.3001.desc_intrigue:0 "Ta hầu như không để ý tới [tour_general_3001_target_courtier.GetFirstName] cho đến khi [tour_general_3001_target_courtier.GetSheHe] đứng ngay trước mặt ta, bày tỏ sự kính trọng đối với [tour_general_3001_target_courtier.GetHerHis] [tour_general_3001_target_courtier.Char.Custom2('RelationToMePossessive', stop_host_scope )] [stop_host_scope.Char.Custom2('RelationToMeShort', visiting_liege )]. Giờ khi đã chú ý, ta quan sát [tour_general_3001_target_courtier.GetHerHim] khi [tour_general_3001_target_courtier.GetSheHe] dễ dàng di chuyển giữa các nhóm người trong triều. Đôi mắt của [tour_general_3001_target_courtier.GetHerHis|U] luôn tỉnh táo, nhìn khắp mọi nơi và cũng chẳng nhìn đâu cả. \n\nĐiều này khiến ta tò mò."
  tour_general.3001.desc_learning:0 "Một [tour_general_3001_target_courtier.GetWomanMan] uyên bác, đôi mắt sáng của [tour_general_3001_target_courtier.GetFirstNamePossessive] đảo khắp căn phòng tìm kiếm một người phản biện cho luận điểm khoa học mà [tour_general_3001_target_courtier.GetSheHe] vừa nêu ra. Nhưng chẳng ai đứng lên đáp lại, khiến [tour_general_3001_target_courtier.GetHerHis] thất vọng. \n\nCũng dễ hiểu thôi, xét đến trình độ trí tuệ cần có để tranh luận ở mức đó. Ta thật sự ấn tượng. \n\nLoại trí tuệ này hiếm có."
  tour_general.3001.desc_prowess:0 "Nhanh nhẹn và di chuyển trong phòng như một [ROOT.Char.Custom('GetAnimalType')] đang săn mồi, [tour_general_3001_target_courtier.GetFirstName] không hề làm ta thất vọng. Ta dõi theo từng cử động của [tour_general_3001_target_courtier.GetHerHis], một bản giao hưởng cho đôi mắt, khi [tour_general_3001_target_courtier.GetSheHe] biến mất dần xuống hành lang. \n\nThật là bản lĩnh!"
  tour_general.3001.desc_outro:0 "Ta nhất định #EMP phải#! có [tour_general_3001_target_courtier.GetHerHim] trong triều đình của mình."
  tour_general.3001.a:0 "Ngươi giờ là người của triều đình ta. Hãy vui mừng."
  tour_general.3001.a.flavor:0 "Đã lấy một lần thì sẽ là của ta mãi."
  tour_general.3001.a.tt:0 "Cận thần được chuyển đi"
  tour_general.3001.a_cannibal:0 "Một bổ sung thật ngon lành!"
  tour_general.3001.a_cannibal.flavor:0 "Ta sẽ đảm bảo [tour_general_3001_target_courtier.GetSheHe] được nuôi dưỡng thật tốt..."
  tour_general.3001.a_insanity:0 "Đây là điều cần phải làm."
  tour_general.3001.a_insanity.flavor:0 "[tour_general_3001_target_courtier.GetSheHe|U] #EMP hiểu!#!"
  tour_general.3001.b:0 "Ta tin [stop_host_scope.GetTitledFirstNameNoTooltip] sẽ không phiền."
  tour_general.3001.b_host_decides.tt:0 "[stop_host_scope.GetShortUIName] quyết định chuyện tiếp theo"
  tour_general.3001.b.harmful_sideeffects.tt:0 "Do tính cách của [stop_host_scope.GetShortUINamePossessive], việc này có thể dẫn đến hậu quả chết người"
  tour_general.3001.b_liege_decides.tt:0 "[visiting_liege.GetShortUIName] quyết định chuyện tiếp theo"
  tour_general.3001.c:0 "[tour_general_3001_target_courtier.GetSheHe|U] #EMP có thể#! просто biến mất trong đêm..."
  tour_general.3001.c.tt_success:0 "Bị đưa đi trong bí mật"
  tour_general.3001.c.tt_failure:0 "Thất bại"
  tour_general.3001.c.tt_failure.desc:0 "Thất bại của ngươi không hề bị bỏ qua."
  tour_general_3001_stolen_courtier:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] gia nhập triều đình ta mà không ai hay biết"
  tour_general_3001_failed_steal:0 "[stop_host_scope.GetTitledFirstNameNoTooltip] phát hiện ra chuyện này"
  tour_general.3001.d:0 "Thật ngớ ngẩn."
  tour_general.3001.d_cannibal:0 "Không. Ta cần bắt đầu ăn kiêng."
  tour_general.3001.d_cannibal.flavor:0 "Tch!"
  tour_general.3001.d_insanity:0 "Không. Ta phải tự mình chống lại [ROOT.Char.GetFaith.random_EvilGodNames]."
  tour_general.3001.d_insanity.flavor:0 "Giờ chỉ còn mình ta!"
  tour_general.3001.tt_positive:0 "[visiting_liege.GetShortUIName] đã chấp nhận đề nghị của ngươi"
  tour_general.3001.tt_negative:0 "[visiting_liege.GetShortUIName] đã từ chối đề nghị của ngươi"
  tour_general.3001.desc_negative:0 "[visiting_liege.GetShortUIName] mất hứng thú với cận thần của ngươi."

  tour_general.3002.title:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Yêu Cầu Được Chấp Thuận"
  tour_general.3002.title_denied:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Yêu Cầu Bị Từ Chối"
  tour_general.3002.intro:0 "[stop_host_scope.GetTitledFirstName] trực tiếp nói với ta.\n\n'My [stop_host_scope.Custom2('RelationToMeShort', ROOT.Char )], ta đã suy nghĩ về chuyện này và đi đến kết luận rằng "
  tour_general.3002.desc_free:0 "[tour_general_3001_target_courtier.GetFirstName] sẽ vui lòng gia nhập triều đình cao quý của ngài.'"
  tour_general.3002.desc_hook:0 "một ân huệ hôm nay có thể được đáp lại bằng một ân huệ trong tương lai... ?'"
  tour_general.3002.desc_gold:0 "một ít vàng có thể giúp xoa dịu nỗi mất mát nếu chúng ta phải chia tay [tour_general_3001_target_courtier.GetFirstName]."
  tour_general.3002.desc_cannibal:0 "ta có một ý tưởng còn hay hơn. Nếu ngài thích [tour_general_3001_target_courtier.GetFirstName], ngài sẽ #EMP thích mê#! thứ này, [ROOT.Char.Custom('FormOfAddressForLiege')]. Nó đáng để #EMP chết#! vì nó.'\n\n[stop_host_scope.GetSheHe|U] liếc nhìn về phía [tour_general_3001_target_courtier.GetFirstNamePossessive] rồi nhìn thẳng vào ta, như thể đang ra hiệu điều gì đó."
  tour_general.3002.desc_declined:0 "ta không thể đồng ý với yêu cầu này. [tour_general_3001_target_courtier.GetFirstName] quá quý giá đối với ta và triều đình của ta.'\n\nÁnh mắt của [stop_host_scope.GetHerHis|U] bắt đầu đảo quanh căn phòng một cách lúng túng."
  tour_general.3002.a:0 "Rất cảm kích!"
  tour_general.3002.b:0 "Tại sao phải trao đổi thứ ta có thể #EMP tự lấy#!?"
  tour_general.3002.b_declined:0 "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] là #EMP của ta#!."
  tour_general.3002.c:0 "Một ân huệ? Nghe có vẻ công bằng."
  tour_general.3002.d:0 "Vài đồng vàng? Giao dịch hợp lý."
  tour_general.3002.e:0 "Nghĩ lại thì..."
  tour_general.3002.f:0 "#EMP Ôi trời...#!"
  tour_general.3002.g:0 "Hành vi ghê tởm này phải chấm dứt!"
  tour_general.3002.h:0 "Thật đáng tiếc."
  tour_general.3002.h.tt:0 "[visiting_liege.GetShortUIName] Không Hài Lòng"
  tour_general.3002.h.tt.desc:0 "[visiting_liege.GetShortUIName] không vui với quyết định của ngươi."
 
  tour_general.0510.title:0 "Một Yêu Sách Trước Khi Rời Đi"
  tour_general.0510.desc:0 "Ta đã kết thúc chuyến thăm [ROOT.Char.GetCurrentLocation.GetName], và đoàn tùy tùng đang chuẩn bị khởi hành.\n\n[stop_host_scope.GetName] cùng triều thần của lão đều đã xếp hàng cung kính để tiễn ta, và giờ đây, đã đến lúc thu thuế vì sự hiện diện của ta tại đây."
  tour_general.0510.a:0 "Đã đến lúc nộp cống."
  tour_general.0510.b:0 "Ta không đưa ra yêu sách."
  tour_general.0511.title:0 "Món Quà Trước Khi Chia Tay"
  tour_general.0511.desc:0 "Đã đến lúc [visiting_liege.GetName] rời đi, và ta phải nói rằng ta tin mình đã là một chủ nhà rất rộng lượng.\n\nTuy nhiên, có vẻ [visiting_liege.GetName] không cho rằng sự tiếp đãi của ta là đủ, và đã đưa ra một yêu cầu đối với ta.\n\n"
  tour_general.0511.desc.kneel:0 "[visiting_liege.GetSheHe|U] yêu cầu ta quỳ xuống trước [visiting_liege.GetTitleAsNameNoTooltip|U] của mình trước toàn bộ triều đình, thể hiện sự thần phục của ta đối với vương quyền."
  tour_general.0511.desc.money:0 "[visiting_liege.GetSheHe|U] đưa cho ta hóa đơn cho toàn bộ chi phí trong chuyến đi của [visiting_liege.GetHerHis]. Dù nhiều khoản trông có vẻ vô lý, ta vẫn buộc phải trả."
  tour_general.0511.desc.factions:0 "[visiting_liege.GetSheHe|U] chìa bàn tay ra trước mặt ta, yêu cầu ta phải thề trung thành với [visiting_liege.GetHerHim] và [visiting_liege.GetPrimaryTitle.GetName], thề không bao giờ đi ngược lại ý muốn hoàng gia."
  tour_general.0511.a:0 "Ta thần phục."
  tour_general.0511.gave_demand:0 "[stop_host_scope.GetName] đã nhượng bộ"
  tour_general.0511.b:0 "Ta sẽ không làm chuyện đó!"
  tour_general.0512.title:0 "Một Lời Chào Tạm Biệt"
  tour_general.0512.desc:0 "Đã đến lúc [visiting_liege.GetName] rời đi, và ta phải nói rằng ta tin mình đã là một chủ nhà rộng lượng.\n\n[visiting_liege.GetSheHe|U] dường như hoàn toàn hài lòng với sự tiếp đãi của ta, và không yêu cầu gì ngoài lời hứa rằng chúng ta sẽ còn gặp lại."
  tour_general.0512.a:0 "Tuyệt vời."
  tour_general.0513.title:0 "Yêu Sách Bị Từ Chối"
  tour_general.0513.desc:0 "[stop_host_scope.GetName] đã ngang nhiên từ chối phục tùng yêu cầu của ta. Giờ ta không thể làm gì nhiều, nhưng sự xúc phạm như vậy không chỉ chống lại ta mà còn chống lại cả vương quốc!"
  tour_general.0513.a:0 "Chuyện này sẽ không sớm bị quên."

#Tour Mini-Activity Events
#Vassal Events
  tour_grounds_events.1001.title:0 "Tài Săn Bắn"
  tour_grounds_events.1001.desc.intro:0 "Khi [visiting_liege.GetName] vẫn còn đang tham quan lãnh địa quanh dinh cơ của ta, phía trước ta còn rất nhiều cơ hội để gây ấn tượng."
  tour_grounds_events.1001.desc.mid:0 "\n\nMột cơ hội như vậy chính là phô bày khu săn bắn của [touring_grounds_scope.GetNameNoTooltip] và có lẽ khiến lãnh chúa của ta ấn tượng với kỹ nghệ săn bắn của ta!"
  tour_grounds_events.1001.desc.outro:0 "Một chiến thắng trên bãi săn chắc chắn sẽ củng cố địa vị của ta như một [ROOT.Char.GetTitleAsNameNoTooltip] xứng đáng của vương quốc, nhưng nếu thất bại thì đó sẽ là nỗi nhục sâu sắc."
  tour_grounds_events.1001.a:0 "Ta chưa từng bắn trượt!"
  tour_grounds_events.1001.b:0 "Có lẽ thứ khác sẽ khiến [visiting_liege.GetHerHim] ấn tượng hơn..."

  tour_grounds_events.1002.title:0 "Một Mưu Kế"
  tour_grounds_events.1002.desc:0 "Nhìn [visiting_liege.GetTitleAsNameNoTooltip|U] của ta dạo bước quanh khu đất của [touring_grounds_scope.GetNameNoTooltip], trong đầu ta nảy ra một ý tưởng đùa nghịch tinh quái. Như thể bị linh hồn của [ROOT.Char.GetFaith.TricksterGodName] [ROOT.Char.GetFaith.TricksterGodHerHim]self nhập vào, ta hình dung ra một vụ ám sát dàn dựng để mua vui cho khách của ta!\n\n[visiting_liege.GetNameNoTooltip] sẽ được sắp đặt làm vị anh hùng của câu chuyện, phá hỏng âm mưu nhắm vào đoàn người và khiến “sát thủ” phải bỏ chạy! Một màn châm biếm tuyệt vời nhắm vào kẻ thù của [visiting_liege.GetPrimaryTitle.GetNameNoTooltip], chắc chắn [visiting_liege.GetNameNoTooltip] sẽ vừa được tâng bốc vừa thích thú trước điều này!"
  tour_grounds_events.1002.a:0 "Hãy sắp đặt mọi thứ!"
  tour_grounds_events.1002.b:0 "Thôi bỏ đi."
  tour_grounds_events.1003.title:0 "$murder_outcome.5001.t$"
  tour_grounds_events.1003.desc.intro:0 "Khi ta tiếp tục chuyến tham quan quanh khu đất của [touring_grounds_scope.GetNameNoTooltip], ta nghe thấy những giọng nói lạ vang lên khắp nơi quanh chúng ta. Bất chợt, cả đoàn của ta bị bao vây bởi những [fake_assassin_scope.GetWomenMen] trùm mũ, chĩa dao và cung thẳng về phía ta!\n\nMột trong những kẻ ám sát bước tới gần và ép chặt con dao của [fake_assassin_scope.GetHerHis] vào sườn ta. \"Săn bắn vui chứ, [ROOT.Char.Custom('FormOfAddressForLiege')]? Bọn ta đến để săn các [ROOT.Char.GetTitleAsNameNoTooltip]!\""
  tour_grounds_events.1003.desc.paranoid:0 "\n\nTa cảm thấy tim mình đập dồn dập và mồ hôi lạnh toát khắp người trong khi cơ thể cứng đờ. Kẻ ám sát khẽ nháy mắt với ta một cách đầy ẩn ý và ra hiệu về phía vũ khí của [fake_assassin_scope.GetHerHis], khoe khoang chiến thắng của chúng. Mạng sống của ta đang treo trên quyết định tiếp theo của ta, ta phải làm gì?"
  tour_grounds_events.1003.desc.not_paranoid:0 "\n\nDù ban đầu ta có chút giật mình, nhưng nhanh chóng nhận ra đây chỉ là một màn kịch. “Sát thủ” nháy mắt với ta và ta nhận ra vũ khí của hắn hoàn toàn làm bằng gỗ và cùn ở mọi phía. Chúng mong ta nhập vai và phá hỏng âm mưu ám sát nhằm vào mạng sống của ta."
  tour_grounds_events.1003.a.paranoid:0 "$murder_outcome.5001.not_my_time$"
  tour_grounds_events.1003.a:0 "Đỡ chiêu của ta, [fake_assassin_scope.Custom2('InsultNoun', ROOT.Char)]!"
  tour_grounds_1002.assassination_was_fake:0 "Vụ Ám Sát Là Giả"
  tour_grounds_1002.liege_believed_it_was_real:0 "[visiting_liege.GetName] Tin Rằng Vụ Ám Sát Là Thật"
  tour_grounds_1002.liege_played_along:0 "[visiting_liege.GetName] Rất Thích Thú"
  tour_grounds_1002_likes_tt:0 "Nếu [visiting_liege.GetName] thích điều đó"
  tour_grounds_1002_dislikes_tt:0 "Nếu [visiting_liege.GetName] không thích"
  tour_grounds_1002_murder_tt:0 "Nếu [visiting_liege.GetName] tin rằng đó là thật"
  tour_grounds_events.1003.b:0 "Ta đâu phải kẻ mua vui! Tránh xa ta ra!"
  tour_grounds_1002.liege_begrudgingly_played_along:0 "[visiting_liege.GetName] Không Hề Thích Thú"
  tour_grounds_events.1003.c:0 "Chúng sẽ không bắt được ta nếu chưa giao chiến!"

  tour_grounds_events.1004.title:0 "Khoảnh Khắc Giữa Hoang Dã"
  tour_grounds_events.1004.desc.intro:0 "Trong khoảnh khắc, ta nhận ra mình đang ở một mình giữa khu săn bắn hoang dã của [touring_grounds_scope.GetNameNoTooltip] cùng [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)]. Một khoảnh khắc hiếm hoi như thế này cho phép ta theo đuổi niềm say mê của mình dành cho [visiting_liege.GetHerHim]."
  tour_grounds_events.1004.desc.already_shagging:0 "\n\nDẫu trái tim và thân xác của chúng ta đã thuộc về nhau, việc làm người cai trị khiến chúng ta có quá ít thời gian để theo đuổi đam mê, nhưng giờ đây chúng ta có cơ hội được như những dã thú nơi hoang dã."
  tour_grounds_events.1004.desc.trying_to_shag:0 "\n\nCó lẽ đây cuối cùng cũng là cơ hội để ta bộc lộ tình cảm của mình, và nếu [visiting_liege.GetSheHe] cũng cảm thấy như vậy, chúng ta có thể không chỉ còn là '[visiting_liege.GetTitleAsNameNoTooltip]' và '[ROOT.Char.GetTitleAsNameNoTooltip]', mà là những tình nhân đắm chìm trong đam mê."
  tour_grounds_events.1004.desc.outro:0 "\n\nCuộc đời được tạo nên từ những khoảnh khắc, và đôi khi ta có được những khoảnh khắc hiếm hoi như thế này. Ta có nên hành động theo cảm xúc này không?"
  tour_grounds_events.1004.a:0 "Hãy đến với ta ngay!"
  tour_grounds_events.1004.b:0 "Hãy để nó trôi qua."
  tour_grounds_events.1005.title:0 "$tour_grounds_events.1004.title$"
  tour_grounds_events.1005.desc.intro:0 "Ta thấy mình ở một mình trong khu săn bắn của [touring_grounds_scope.GetNameNoTooltip] cùng [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)], tận hưởng sự yên tĩnh tương đối chỉ thỉnh thoảng bị phá vỡ bởi tiếng kêu của thú hoang gần đó."
  tour_grounds_events.1005.desc.already_shagging:0 "Đột nhiên, ta thấy [stop_host_scope.GetNameNoTooltip] lao vào ta như một con [stop_host_scope.Custom('GetAnimalType')] hoang dã, ép chặt ta vào tảng đá với ánh mắt rực cháy.\n\n\"Hiếm khi ta được thấy ngài một mình, [ROOT.Char.Custom('LoverPetName')] của ta, ở đây chẳng có ai ngoài chim chóc và thú rừng chứng giám. Hãy cùng nhau đắm chìm vào niềm đam mê này!\""
  tour_grounds_events.1005.desc.trying_to_shag:0 "Ta thấy [stop_host_scope.GetNameNoTooltip] nhìn ta như một con [stop_host_scope.Custom('GetAnimalType')] sắp vồ lấy bữa ăn tiếp theo.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip|U] của ta, ta phải nói rằng ngài trông còn thần thánh hơn bất kỳ sinh vật nào ta từng thấy ở những vùng [touring_grounds_scope.Custom('TerrainTypeProvince')] này.\"\n[stop_host_scope.GetNameNoTooltip] tiến về phía ta với ánh nhìn săn mồi trong đôi mắt của [stop_host_scope.GetHerHis] và ta cảm thấy sự kiêng khem của mình tan biến."
  tour_grounds_events.1005.desc.outro:0 "\n\nTa sững sờ, nhìn vào đôi mắt khát khao của [stop_host_scope.GetTitleAsNameNoTooltip] của ta. Liệu có thích hợp cho một [ROOT.Char.GetTitleAsNameNoTooltip] đang du hành lại có một khoảnh khắc đam mê ở nơi như thế này không?"
  tour_grounds_events.1005.a:0 "Hãy đến với ta!"
  tour_grounds.moment_in_the_woods:0 "Ngươi Đã Cho [visiting_liege.GetName] Một Khoảnh Khắc Khó Quên"
  tour_grounds_events.1005.b:0 "Tránh xa ta ra, đồ dâm đãng [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]!"
  tour_grounds.rebuffed_in_the_woods:0 "[visiting_liege.GetName] Đã Khước Từ Sự Tán Tỉnh Của Ngươi"

  tour_grounds_events.1006.title:0 "Nói Xen"
  tour_grounds_events.1006.desc.intro:0 "Trong lúc tham quan [touring_grounds_scope.GetNameNoTooltip], ta đang trò chuyện với [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] về"
  tour_grounds_events.1006.desc.mid.martial:0 "vinh quang của chiến tranh và xung đột,"
  tour_grounds_events.1006.desc.mid.learning:0 "kế hoạch thiêng liêng của [ROOT.Char.GetFaith.HighGodNamePossessive] dành cho nhân loại,"
  tour_grounds_events.1006.desc.mid.stewardship:0 "những phức tạp của trị quốc và sổ sách,"
  tour_grounds_events.1006.desc.mid.diplomacy:0 "nghệ thuật tinh tế của ngoại giao và xoa dịu,"
  tour_grounds_events.1006.desc.mid.intrigue:0 "tầm quan trọng của thông tin và lừa dối,"
  tour_grounds_events.1006.desc.outro:0 "thì bị [landless_courtier_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] chen ngang, dường như tin rằng [landless_courtier_scope.GetSheHe] hiểu rõ chủ đề này hơn ta.\n\nDẫu sao đi nữa, thật vô cùng bất kính khi một kẻ cận thần tầm thường lại dám ngắt lời cuộc trò chuyện giữa [visiting_liege.GetTitleAsNameNoTooltip|U] của [visiting_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] và [visiting_liege.GetHerHis] [ROOT.Char.GetTitleAsNameNoTooltip|U]."
  tour_grounds_events.1006.a:0 "Im miệng, đồ [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]."
  tour_grounds_events.1006.b:0 "Bỏ qua và tiếp tục."
  tour_grounds_events.1007.desc.intro:0 "Trong lúc tham quan [touring_grounds_scope.GetNameNoTooltip], ta đang trò chuyện với [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] về"
  tour_grounds_events.1007.desc.outro:0 "thì [stop_host_scope.GetSheHe] bị một trong những triều thần cắt ngang.\n\n[landless_courtier_scope.GetWomanMan] chưa kịp nói được bao câu đã bị lãnh chúa của mình bịt miệng, nhưng những lời khôn ngoan mà [landless_courtier_scope.GetSheHe] vừa thốt ra đã chứng minh rằng [landless_courtier_scope.GetSheHe] hiểu biết về vấn đề này hơn [stop_host_scope.GetNameNoTooltip] nhiều.\n\nNếu [stop_host_scope.GetTitledFirstNameNoTooltip] không sẵn lòng lắng nghe insight này, có lẽ [landless_courtier_scope.GetSheHe] nên gia nhập triều đình của ta thì tốt hơn."
  tour_grounds_events.1007.a:0 "Hãy gia nhập triều đình của ta!"
  tour_grounds_events.1007.b:0 "Không ai được phép nói xen."
  tour_grounds_events.1007.c:0 "Đây là một tội không thể chối cãi!"
  tour_grounds.recruited_my_courtier:0 "[landless_courtier_scope.GetName] Bị Cám Dỗ Rời Đi"
  tour_grounds_events.1017.desc.outro:0 "thì [stop_host_scope.GetSheHe] bị một trong những triều thần cắt ngang.\n\nMặc dù kẻ thuộc hạ này đã nói năng hoàn toàn sai lúc, nhưng [stop_host_scope.GetNameNoTooltip] lại không quở trách [landless_courtier_scope.GetHerHim], mà còn cho phép [landless_courtier_scope.GetHerHim] nói chuyện trực tiếp với ta.\n\nDù những gì [landless_courtier_scope.GetSheHe] nói khá thú vị, nhưng hành động phá vỡ phép tắc xã giao này đã khiến ta hoàn toàn bất ngờ."
  tour_grounds_events.1017.a:0 "Ta sẽ lắng nghe."

  tour_grounds_events.1008.title:0 "Chuyện Ma"
  tour_grounds_events.1008.desc.intro:0 "Khi chúng ta nghỉ chân sau chuyến tham quan, lãnh chúa trẻ tuổi của ta vẫn tràn đầy năng lượng và đòi được giải trí trong khi phần còn lại của đoàn tùy tùng lấy lại sức.\n\nMay thay, [storyteller_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] hăng hái nhận lấy nhiệm vụ này và bắt đầu kể lại những truyền thuyết địa phương. \"Ôi, những vùng [touring_grounds_scope.Custom('TerrainTypeProvince')] này còn nhiều điều hơn những gì mắt thường thấy, [visiting_liege.Custom('GetLassLad')].\""
  tour_grounds_events.1008.desc.mid.banshee:0 "Một banshee gào khóc khủng khiếp ám ảnh vùng hoang dã của [touring_grounds_scope.GetNameNoTooltip], và hãy cẩn thận: nếu ngươi nghe thấy tiếng gọi của ả, chắc chắn sẽ có người thân cận với ngươi gặp kết cục.""
  tour_grounds_events.1008.desc.mid.ghul:0 "Một con quỷ ghoul ghê tởm lang thang quanh các khu mộ của [touring_grounds_scope.GetNameNoTooltip] và ăn thịt người, và nếu hắn nhìn thấy ngươi, có khi hắn sẽ quyết định rằng [visiting_liege.GetTitleAsNameNoTooltip|U] nằm trong thực đơn!""
  tour_grounds_events.1008.desc.mid.azdaha:0 "Một con Azhdaha khổng lồ đáng sợ đang đào hang ngay dưới chân chúng ta, chờ đợi. Khi có cơ hội, nó sẽ phá đất chui lên với hàm răng khủng khiếp và nuốt chửng ngươi!""
  tour_grounds_events.1008.desc.mid.sasabonsam:0 "Con Sasabonsam đáng sợ sống quanh vùng này, có lẽ đang nhìn chúng ta ngay lúc này, chỉ là ngoài tầm mắt. Chỉ cần ngươi lơ là, hắn sẽ từ trên cao lao xuống và hút cạn máu ngươi bằng hàm răng sắt kinh hoàng cho đến khi ngươi đỏ hồng và đẫm máu như hắn!""
  tour_grounds_events.1008.desc.mid.ankou:0 "Chính Ankou lang thang quanh vùng này trên cỗ xe của kẻ chết, thu nhặt những linh hồn lạc lối và đưa họ tới nơi mà chỉ [ROOT.Char.GetFaith.HighGodName] mới biết. Hãy coi chừng, [visiting_liege.Custom('GetLassLad')], kẻo hắn cũng mang ngươi đi.""
  tour_grounds_events.1008.desc.mid.witt_wieven:0 "Những người đàn bà trắng sống giữa chúng ta nơi đây, tìm kiếm những [visiting_liege.GetLadyLord] nhỏ bé như ngươi để dẫn lạc đường. Là hồn ma của những phù thủy đã chết từ lâu, chúng sẽ bắt ngươi đi và làm công việc của [ROOT.Char.GetFaith.DevilNamePossessive] trên ngươi.""
  tour_grounds_events.1008.desc.mid.baba_yaga:0 "Mụ phù thủy kinh hoàng Baba Yaga thi triển phép thuật quanh vùng này. Hãy để ý những căn lều trông không thuộc về nơi này, kẻo mụ nuốt thịt ngươi và trang trí bằng xương của ngươi.""
  tour_grounds_events.1008.desc.mid:0 "Có rất nhiều thứ khủng khiếp lang thang quanh vùng này, những thứ không thuộc về tự nhiên. Những con quái vật còn đáng sợ hơn bất kỳ dã thú nào, và chúng rất muốn thêm một chút [visiting_liege.GetTitleAsNameNoTooltip|U] vào bữa ăn của chúng.""
  tour_grounds_events.1008.desc.outro:0 "\n\nNhững câu chuyện đáng ngờ của [storyteller_scope.GetFirstNamePossessiveNoTooltip] rõ ràng đang ảnh hưởng tới [visiting_liege.GetFirstNameNoTooltip] nhỏ bé, có lẽ ta nên can thiệp."
  tour_grounds_events.1008.a:0 "Rồi sau đó chuyện gì xảy ra?"
  tour_grounds_events.1008.b:0 "Im lặng, [storyteller_scope.GetFirstNameNoTooltip]!"
  tour_grounds_events.1009.title:0 "$tour_grounds_events.1008.title$"
  tour_grounds_events.1009.desc.intro:0 "Những người lớn tuổi trong đoàn của chúng ta dừng lại nghỉ ngơi sau chuyến tham quan, nhưng ta vẫn tràn đầy sinh lực và bắt đầu mất kiên nhẫn với những lão già chậm chạp này.\n\nMay thay, [storyteller_scope.GetName] có vẻ háo hức giải trí cho ta bằng những câu chuyện đáng sợ về nơi này. \"Ôi, những vùng [touring_grounds_scope.Custom('TerrainTypeProvince')] này còn nhiều điều hơn những gì mắt thường thấy, [visiting_liege.Custom('GetLassLad')].\""
  tour_grounds_events.1009.desc.mid.finished:0 "\n\n[stop_host_scope.GetName] sớm tham gia kể chuyện, và ta bị cuốn vào những câu chuyện của cả hai, khiến ta không chỉ hơi sợ hãi."
  tour_grounds_events.1009.desc.outro.interrupted:0 "\n\nNgay khi câu chuyện trở nên thú vị, [stop_host_scope.GetName] ngắt lời và khăng khăng rằng [storyteller_scope.GetSheHe] không được kể tiếp, đồng thời đảm bảo với ta rằng toàn bộ câu chuyện chỉ là vô nghĩa."
  tour_grounds_events.1009.a:0 "Thật là một câu chuyện tuyệt vời!"
  tour_grounds_events.1009.b:0 "Thật kinh khủng."
  tour_grounds_events.1009.c:0 "Ngươi dừng lại đúng đoạn hay nhất!"
  tour_grounds_events.1009.d:0 "May mà ngươi đã dừng lại."

  tour_grounds_events.1010.title:0 "[rival_courtier.GetFirstNameNoTooltip]: Con Tuấn Mã Trung Thành"
  tour_grounds_events.1010.desc:0 "Sau khi cưỡi thú đi khắp vùng đất suốt cả ngày, ta chợt nảy ra một ý tưởng tuyệt vời!\n\nAi cũng biết về sự thù địch giữa [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] và [rival_courtier.GetName], và chắc chắn ta sẽ được [visiting_liege.GetTitleAsNamePossessiveNoTooltip] ưu ái nếu bắt được đối thủ của [visiting_liege.GetHerHis] rồi buộc yên lên người [rival_courtier.GetHerHim] và cưỡi quanh như một con ngựa!\n\nTất nhiên, thử thách duy nhất là đưa [rival_courtier.GetHerHim] tới đây, nhưng ta có cách của mình..."
  tour_grounds_events.1010.a:0 "Làm thôi!"
  tour_grounds_events.1010.b:0 "Nguy hiểm quá lớn."
  tour_grounds_events.1011.title:0 "$tour_grounds_events.1010.title$"
  tour_grounds_events.1011.desc:0 "Khi cưỡi qua vùng đất của [touring_grounds_scope.GetNameNoTooltip], ta bất ngờ bị chủ nhà của ta, [stop_host_scope.GetName], chặn lại giữa đường.\n\nCó vẻ như [stop_host_scope.GetSheHe] đã bắt được [rival_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] và buộc yên lên người [rival_courtier.GetHerHim] như một con ngựa, sẵn sàng để ta cưỡi qua vùng quê!\n\nDù đây là cơ hội tuyệt vời để thể hiện sự vượt trội của ta, ta có thật sự muốn hạ mình đến mức đó không?"
  tour_grounds_events.1011.a:0 "Tất nhiên là có!"
  tour_grounds_events.1011.b:0 "Ngay cả [rival_courtier.GetFirstNameNoTooltip] cũng không đáng chịu nỗi nhục này."

  tour_grounds_events.1012.title:0 "Một [stop_host_scope.Custom('get_region_root_vegetable')|U] Giống Hệt [visiting_liege.GetTitleAsNameNoTooltip|U]"
  tour_grounds_events.1012.desc:0 "Tư gia khiêm tốn của chúng ta thiếu đi sự sang trọng mà [visiting_liege.GetName] vốn đã quen thuộc, nhưng bù lại, chúng ta xin dâng lên sự hiếu khách hết lòng.\n\nTa cứ ngỡ sẽ phải dẫn [visiting_liege.GetTitleAsNameNoTooltip] đi tham quan mà chẳng có lấy món quà nào, nhưng bất chợt ta nhìn thấy một củ [ROOT.Char.Custom('get_region_root_vegetable')] đang phát triển mạnh mà kỳ lạ thay lại trông hệt như [visiting_liege.GetNameNoTooltip]! Ngài ấy hẳn sẽ nhớ mãi chuyến thăm đến [touring_grounds_scope.GetNameNoTooltip] nếu nhận được người anh em song sinh [ROOT.Char.Custom('get_region_root_vegetable')] này! Dù rằng, ngài ấy có thể dễ dàng nổi giận nếu cho rằng ta đang so sánh ngài với một củ [ROOT.Char.Custom('get_region_root_vegetable')]."
  tour_grounds_events.1012.a:0 "Và ta cứ tưởng món quà hoàn hảo không tồn tại."
  tour_grounds_events.1012.b:0 "Âm thầm vứt bỏ củ [ROOT.Char.Custom('get_region_root_vegetable')]."
  tour_grounds_events.1012.c:0 "Thứ này chắc đáng giá cả gia tài!"
  tour_grounds_events.1012.d:0 "Giữ lại để... dùng riêng."
  turnip_that_looks_like_liege:0 "Củ [ROOT.Char.Custom('get_region_root_vegetable')|U] Của [visiting_liege.GetTitleAsNamePossessiveNoTooltip|U]"
  turnip_that_looks_like_liege_description:0 "Một củ [ROOT.Char.Custom('get_region_root_vegetable')] bình thường nhưng trông giống [visiting_liege.GetName] đến kỳ lạ."
  tour_grounds_events.1013.title:0 "$tour_grounds_events.1012.title$"
  tour_grounds_events.1013.desc:0 "[touring_grounds_scope.GetNameNoTooltip] khác xa với điều ta coi là một vùng đất văn minh. Hiếm khi có bóng người sinh sống nơi đây và tiện nghi thì thiếu thốn đủ đường.\n\nHôm nay, [stop_host_scope.GetTitleAsNameNoTooltip] muốn gây ấn tượng với ta bằng cách dâng lên một củ [stop_host_scope.Custom('get_region_root_vegetable')] bình thường mà [stop_host_scope.GetSheHe] khẳng định trông giống hệt ta.\n\nBan đầu ta chỉ đảo mắt coi thường, nhưng chẳng bao lâu sau ta cũng bắt đầu thấy nét giống nhau..."
  tour_grounds_events.1013.a:0 "Thật là một vật kỳ diệu!"
  tour_grounds.liege_impressed:0 "[visiting_liege.GetName] Bị Ấn Tượng"
  tour_grounds_events.1013.b:0 "Thật ghê tởm. Vứt nó đi."
  tour_grounds.liege_insulted:0 "[visiting_liege.GetName] Bị Xúc Phạm"

  tour_grounds_events.1014.title:0 "[visiting_liege.GetNameNoTooltip]: Thợ Săn Nhỏ"
  tour_grounds_events.1014.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] có vẻ rất háo hức muốn đi săn quanh [touring_grounds_scope.GetNameNoTooltip], tìm kiếm con mồi và vinh quang như một người trưởng thành.\n\nTuy nhiên, ta không thể để một [visiting_liege.Custom('GirlBoy')] còn quá trẻ chạy nhảy nơi [visiting_liege.GetSheHe] có thể bị một con [ROOT.Char.Custom('GetAnimalType')] xé xác.\n\nDẫu vậy, ta có thể làm hài lòng vị [visiting_liege.GetLadyLord] nhỏ bằng cách tổ chức một cuộc săn giả mà không có nguy hiểm từ thú thật."
  tour_grounds_events.1014.a:0 "Chắc chắn [visiting_liege.GetSheHe] sẽ thích!"
  tour_grounds_events.1014.b:0 "Thật lãng phí thời gian."
  tour_grounds_events.1015.title:0 "Cuộc Săn Biểu Diễn"
  tour_grounds_events.1015.desc:0 "Ta đã khao khát được rình rập ngoài thiên nhiên và tự tay hạ một con mồi tươi mới, như một [ROOT.Char.GetTitleAsNameNoTooltip] thực thụ, nhưng cho đến giờ các trưởng bối và người giám hộ của ta vẫn chưa cho phép.\n\nTuy nhiên hôm nay, [stop_host_scope.GetName] đã tìm đến ta và đề nghị cho ta thử sức tại khu săn bắn của [touring_grounds_scope.GetNameNoTooltip] như một thợ săn thật sự!\n\nNhưng khi ta đến nơi, thứ chào đón ta không phải là một con [stop_host_scope.Custom('GetAnimalType')] hung dữ, mà chỉ là một khúc gỗ được sơn giống hình con [stop_host_scope.Custom('GetAnimalType')]."
  tour_grounds_events.1015.a:0 "Ta sẽ giết con thú này!"
  tour_grounds_events.1015.b:0 "Đây là trò đùa gì vậy?"
  tour_grounds_events.1015.c:0 "Yêu cầu một con [stop_host_scope.Custom('GetAnimalType')] thật để giết."
  tour_grounds_events.1016.title:0 "Cuộc Săn Thật"
  tour_grounds_events.1016.desc:0 "Yêu cầu của ta được chấp nhận, và chẳng bao lâu sau ta được đưa tới trước một con thú thật để hạ gục. Theo lệnh của ta, con thú được tháo trói và ta bị bỏ lại một mình để hạ gục con quái vật bằng cây cung của mình.\n\nTa hít một hơi thật sâu rồi buông dây, cầu mong mũi tên của ta bay thẳng đến mục tiêu."
  tour_grounds_events.1016.a:0 "Mũi tên của ta trúng đích!"
  tour_grounds.killed_boar:0 "Ta Hạ Gục Con Thú"
  tour_grounds.mauled_by_boar:0 "Ta Bắn Trượt"

#Liege Events
  tour_grounds_events.3001.title:1 "Tham Quan Lãnh Địa Của [stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
  tour_grounds_events.3001.desc.intro:1 "Sự xuất hiện của ta tại [stop_host_scope.GetTitledFirstNamePossessive] [stop_host_scope.Custom('FortifiedBuilding')] ở [touring_grounds_scope.GetProvince.GetName] được chào đón bằng những nghi lễ xứng đáng với một [ROOT.Char.GetTitleAsNameNoTooltip] của vương quốc,"
  tour_grounds_events.3001.desc.type.majesty:0 "và người dân địa phương rõ ràng kinh ngạc trước sự lộng lẫy và oai nghi của đoàn hộ tống của ta.\n\n"
  tour_grounds_events.3001.desc.type.taxation:0 "và sự hiện diện của xe chở ngân khố cùng những người thu thuế của ta nhanh chóng bị chú ý.\n\n"
  tour_grounds_events.3001.desc.type.intimidation:0 "trong khi kỷ luật nghiêm khắc của đội cận vệ khiến thần dân của ta phải dè chừng.\n\n"
  tour_grounds_events.3001.desc.mid.hates_vassal:0 "Chung phòng với tên [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] này thật là một sự chịu đựng ghê tởm; mong sao việc này sớm kết thúc."
  tour_grounds_events.3001.desc.mid.lover:0 "Thật đau lòng khi ta phải giữ vẻ lễ nghi công khai như thế với người ta yêu — giá mà có thời gian để ở riêng cùng nhau..."
  tour_grounds_events.3001.desc.mid.friend:0 "Dù phải tuân theo những nghi lễ phiền phức, việc thăm một người bạn tốt vẫn luôn là niềm an ủi."
  tour_grounds_events.3001.desc.mid.close_family:0 "Ta và [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] ôm lấy nhau, nhưng vẫn cẩn thận giữ đúng phép tắc của dịp này."
  tour_grounds_events.3001.desc.mid.house:0 "Một cơ hội để gặp [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] của ta, và xem liệu hoàn cảnh của [stop_host_scope.GetHerHis] có xứng đáng với danh dự của Gia tộc [ROOT.Char.GetHouse.GetBaseName] hay không."
  tour_grounds_events.3001.desc.mid.powerful_vassal:0 "Ta dành cho [stop_host_scope.GetHerHis] sự công nhận cần thiết về vị thế của họ trong số các chư hầu của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], nhưng chỉ đến một mức độ nào đó..."
  tour_grounds_events.3001.desc.mid.default:1 "Chư hầu của ta cung kính tiếp đón ta với tất cả sự kính cẩn cần thiết."
  tour_grounds_events.3001.desc.mid:2 "\n\n[stop_host_scope.GetFirstNameNoTooltip] trình bày kế hoạch chuyến tham quan và đảm bảo với ta rằng [stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] là một vùng đất đẹp đẽ đến mức chỉ cần nhìn ngắm thị trấn và cánh đồng thôi cũng đủ giải trí."
  tour_grounds_events.3001.desc.outro:1 "\n\nChỉ thời gian mới có thể trả lời."
  tour_grounds_events.3001.a:1 "Bắt đầu thôi!"
 tour_grounds_events.3002.title:0 "Tài Săn Bắn"
 tour_grounds_events.3002.desc.intro:0 "Khi ta tiếp tục tham quan khuôn viên của [touring_grounds_scope.GetNameNoTooltip], chủ nhà quyết định tự mình phô diễn tài săn bắn của [stop_host_scope.GetHerHis]. Khi mọi sự chú ý đang đổ dồn vào lão,"
 tour_grounds_events.3002.desc.mid.crit:0 "[stop_host_scope.GetNameNoTooltip] xuyên thủng hộp sọ một con [stop_host_scope.Custom('GetAnimalType')] ở xa chỉ với một phát bắn.\n\nDù mọi người có vẻ ấn tượng, đây có thể là"
 tour_grounds_events.3002.desc.mid.succ:0 "[stop_host_scope.GetNameNoTooltip] hạ gục một con [stop_host_scope.Custom('GetAnimalType')] gần đó trông chẳng tốn chút công sức nào.\n\nDù mọi người có vẻ ấn tượng, đây có thể là"
 tour_grounds_events.3002.desc.mid.fail:0 "[stop_host_scope.GetNameNoTooltip] thậm chí không chạm nổi mục tiêu của [stop_host_scope.GetHerHis], khiến đoàn tùy tùng của ta bật cười.\n\nTrong lúc mọi người cười rộ, ta nhận ra"
 tour_grounds_events.3002.desc.outro:0 "một cơ hội để vượt mặt chủ nhà của ta và cho mọi người thấy một [ROOT.Char.GetTitleAsNameNoTooltip] bắn tên ra sao!"
 tour_grounds_events.3002.a:0 "Ta mới là thợ săn giỏi hơn!"
 tour_grounds_events.3002.b:0 "Chúc mừng ngài, [stop_host_scope.GetNameNoTooltip]."

 tour_grounds_events.3003.title:0 "Con Mồi Nguy Hiểm"
 tour_grounds_events.3003.desc.intro:0 "Với cây cung săn bên hông, một thành viên trong đoàn báo cho ta biết có một con [stop_host_scope.Custom('GetAnimalType')] ngay dưới triền dốc gần vị trí của chúng ta. Đứng ở mép vách đá, ta hẳn có thể xuyên thẳng tim nó.\n\n"
 tour_grounds_events.3003.desc.mid.high_skill:0 "Với một thợ săn lão luyện như ta, việc này hẳn dễ dàng nhưng không phải không có rủi ro."
 tour_grounds_events.3003.desc.mid.low_skill:0 "Trông như một phát bắn khó, nhưng nếu ta làm được, chắc chắn cả đoàn sẽ phải ấn tượng."
 tour_grounds_events.3003.desc.outro:0 "Mặt đất có vẻ hơi chông chênh, nhưng nếu đặt chân cẩn thận, ta hẳn có thể hạ con thú mà không gặp trở ngại."
 tour_grounds_events.3003.a:0 "Chuyện này hẳn rất dễ."
 tour_grounds_events.3003.b:1 "Để người khác bắn thử."
 tour_grounds_events.3004.title:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] Của Ta, Thợ Săn"
 tour_grounds_events.3004.desc.intro:0 "Trong lúc tham quan lãnh địa, [visiting_liege.GetName] đã thực hiện một phát bắn liều lĩnh từ trên vách đá nhắm vào một con [stop_host_scope.Custom('GetAnimalType')] ngay bên dưới."
 tour_grounds_events.3004.desc:0 "Dù trong thoáng chốc trông như [visiting_liege.GetSheHe] có thể ngã, [visiting_liege.GetSheHe] nhanh chóng giữ vững bước chân của [visiting_liege.GetHerHis] và hạ gục con thú ngay lập tức.\n\nMọi người trong đoàn dường như say mê và ấn tượng trước tài săn bắn của [visiting_liege.GetTitleAsNamePossessiveNoTooltip]. [visiting_liege.GetSheHe|U] tiến lại gần ta, máu từ con mồi tươi còn nhỏ giọt, chờ đợi một lời chúc mừng."
 tour_grounds_events.3004.a:0 "Phát bắn tuyệt vời, thưa [visiting_liege.GetTitleAsNameNoTooltip] của ta."
 tour_grounds_events.3004.b:0 "Ta phải tỏ ra ấn tượng sao?"
 tour_grounds_events.3005.title:0 "Canh Bạc Được Đền Đáp"
 tour_grounds_events.3005.desc.intro:0 "Chỗ đặt chân của ta vững vàng, và tay bắn của ta còn chuẩn xác hơn, khi ta hạ gục con thú chỉ với một mũi tên mà không hề loạng choạng trên vách đá hiểm trở. Đoàn săn tỏ ra ấn tượng, khắp bãi vang lên tiếng vỗ tay của những người đồng hành.\n\n"
 tour_grounds_events.3005.desc.mid.congrats:0 "Chủ nhà của ta, [stop_host_scope.GetName], đích thân tới chúc mừng chiến lợi phẩm của ta. Khi việc ấy xong xuôi, ta đặt con mồi cùng những chiến lợi phẩm khác rồi tiếp tục chuyến tham quan lãnh địa."
 tour_grounds_events.3005.desc.mid.insult: "Tuy nhiên chủ nhà của ta, [stop_host_scope.GetName], dường như không mấy ấn tượng. Gương mặt [stop_host_scope.GetHerHis|U] đầy vẻ khinh miệt và ghen ghét, [stop_host_scope.GetSheHe] tuyên bố phát bắn của ta hoàn toàn tầm thường."
 tour_grounds_events.3005.a:0 "Tuyệt vời."
 tour_grounds_events.3005.a.bad:0 "Đúng là một kẻ trẻ con [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]."
 tour_grounds_events.3006.title:0 "[visiting_liege.GetTitleAsNameNoTooltip|U] Ngã Lăn"
 tour_grounds_events.3006.desc:0 "Trong một khoảnh khắc, cứ ngỡ [visiting_liege.GetSheHe] có thể ghi dấu ấn, nhưng khi [visiting_liege.GetSheHe] bắt đầu mất đà, rõ ràng là nỗi đau và sự xấu hổ sắp ập đến.\n\nTa có thể lao vào cứu lãnh chúa của mình, nhưng làm thế sẽ khiến bản thân ta gặp nguy hiểm."
 tour_grounds_events.3006.a:0 "Ta phải bảo vệ [visiting_liege.GetTitleAsNameNoTooltip|U] của ta!"
 tour_grounds_events.3006.b:0 "Để [visiting_liege.GetHerHim] rơi."
 tour_grounds_events.3006.c:0 "Đẩy [visiting_liege.GetHerHim] sang một bên và tự mình bắn!"
 tour_grounds_events.3007.title:0 "$tour_grounds_events.3006.title$"
 tour_grounds_events.3007.desc.intro:0 "Đáng tiếc thay, chỗ đặt chân của ta dường như không đủ vững và ta cảm thấy thân mình rời khỏi mặt đất, phó mặc cho tạo hóa của [ROOT.Char.GetFaith.CreatorNamePossessive].\n\n"
 tour_grounds_events.3007.desc.mid.protected:0 "Tuy nhiên, ta nhanh chóng được [stop_host_scope.GetName] túm lấy và kéo đứng dậy, vị cứu tinh của ta vì vậy mà ngã sấp mặt trong nỗ lực dũng cảm đó."
 tour_grounds_events.3007.desc.mid.fell:0 "Ta xoay mình giữa không trung và thấy [stop_host_scope.GetName] chỉ đứng đó thờ ơ nhìn [ROOT.Char.GetTitleAsNameNoTooltip] của [stop_host_scope.GetHerHis] ngã xuống. Khi thân thể ta đập xuống đất, ta cảm nhận da thịt mình rách toạc và dòng máu thiêng của ta đổ xuống mặt đất."
 tour_grounds_events.3007.desc.mid.took_the_shot:0 "Ta xoay người giữa không trung thì thấy [stop_host_scope.GetName] đã thay thế vị trí của ta, lão không những không cứu mà còn tự mình thực hiện cú bắn! Khi cơ thể ta va mạnh xuống đất, ta nghe thấy tiếng vỗ tay rộn rã. Rõ ràng, [stop_host_scope.GetNameNoTooltip] đã thành công nơi ta thất bại, để mặc ta quằn quại trong nỗi đau và sự nhục nhã."
 tour_grounds_events.3007.a:0 "Có lẽ hôm nay ta đã làm đủ rồi."

 tour_grounds_events.3008.title:0 "Một Sự Cố Khi Cưỡi Ngựa"
 tour_grounds_events.3008.desc:0 "Ta cưỡi ngựa qua lãnh địa của [touring_grounds_scope.GetNameNoTooltip], đầu óc thư thái chẳng bận tâm điều gì.\n\nĐột nhiên ta bị kéo trở lại thực tại khi một đứa trẻ lao ra trước ngựa của ta, hai tay vung vẩy đầy kính phục khi nhìn thấy [ROOT.Char.GetTitleAsNameNoTooltip] của [trampled_child_scope.GetHerHis]. Sự xuất hiện của nó quá bất ngờ khiến ta hầu như không kịp phản ứng hay nhận ra đó có phải đứa trẻ ta quen biết hay không. Hai tay đẫm mồ hôi nắm dây cương, ta phải hành động!"
 tour_grounds_events.3008.a:0 "Cố tránh nó."
 tour_grounds_events.3008.b:0 "Không gì được cản đường chuyến cưỡi của ta."
 tour_grounds_events.3009.title:0 "Bị Ngựa Hoàng Gia Giẫm Đạp"
 tour_grounds_events.3009.desc.intro:0 "Đó là một ngày nữa trong chuyến viếng thăm của [visiting_liege.GetNamePossessive], và khi mọi thứ đang bắt đầu khá tốt, một đứa trẻ không được trông nom là [trampled_child_scope.GetName] đã chạy ra trước ngựa của [visiting_liege.GetFirstNamePossessiveNoTooltip] và lập tức bị giẫm chết!\n\nĐiều gây sốc nhất là [visiting_liege.GetNameNoTooltip] hoàn toàn không có bất kỳ nỗ lực rõ ràng nào để ngăn chuyện đó xảy ra."
 tour_grounds_events.3009.desc.mid.my_kid:0 "Ta buộc phải chứng kiến chính máu mủ của mình bị giẫm nát dưới móng của con ngựa khổng lồ."
 tour_grounds_events.3009.desc.mid.not_my_kid:0 "Ta không kịp quay đi trước khi đứa trẻ tội nghiệp bị giẫm nát dưới móng con quái vật."
 tour_grounds_events.3009.desc.outro.my_kid_dead:0 "Khi cảnh tượng kinh hoàng ấy kết thúc, ta nhìn thấy thi thể vô hồn của [ROOT.Char.Custom2('RelationToMeShort',trampled_child_scope)] của mình chỉ còn là một đống thịt máu bầy nhầy trên mặt đất."
 tour_grounds_events.3009.desc.outro.not_my_kid_dead:0 "Khi bi kịch ghê rợn khép lại, đứa trẻ tội nghiệp vẫn nằm im, trong vũng máu của chính [trampled_child_scope.GetHerHis]."
 tour_grounds_events.3009.desc.outro.alive:0 "May thay, [trampled_child_scope.GetNameNoTooltip] vẫn còn sống sau biến cố này, dù không tránh khỏi thương tích."
 tour_grounds_events.3009.a.callous:0 "Chẳng liên quan gì đến ta."
 tour_grounds_events.3009.a:0 "Thật tàn nhẫn!"
 tour_grounds_events.3009.b:0 "[visiting_liege.GetNameNoTooltip] đúng là quái vật."
 tour_grounds.trampled_child_nemesis:0 "[stop_host_scope.GetNameNoTooltip] đã thề sẽ Trả thù [stop_host_scope.GetHerHis|U]"

  tour_grounds_events.3010.title:0 "Chiến Mã Không Đáng Tin"
  tour_grounds_events.3010.desc.intro:0 "Chuyến cưỡi ngựa của ta qua lãnh địa [touring_grounds_scope.GetNameNoTooltip] bỗng khựng lại đột ngột khi ta cảm thấy con chiến mã quý của mình vấp phải một hòn đá. Dù nó nhanh chóng lấy lại thăng bằng và ta chỉ thoáng chốc bị chao đảo, ta vẫn nghe thấy vài người trong đoàn tùy tùng khúc khích cười sau lưng.\n\n"
  tour_grounds_events.3010.desc.mid.irritable:0 "Con chiến mã được cho là quý giá của ta đã khiến ta thất vọng, và trong bụng ta sôi lên nỗi nhục nhã cùng cơn giận dữ."
  tour_grounds_events.3010.desc.mid.calm:0 "Ta có chút bối rối, nhưng thật ra ta biết không phải lỗi của con vật."
  tour_grounds_events.3010.desc.outro:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip|U] lẽ ra phải toát ra uy nghi không thể chạm tới và khiến toàn bộ thần dân của [ROOT.Char.GetHerHis] kính phục, vậy mà sự cố này đã làm hoen ố hình ảnh hoàn hảo của ta."
  tour_grounds_events.3010.a:0 "Giết con súc sinh này và mang cho ta con khác!"
  tour_grounds_events.3010.b:0 "Ai cũng có lúc mắc sai lầm."
  tour_grounds_events.3011.title:0 "$tour_grounds_events.3010.title$"
  tour_grounds_events.3011.desc.intro:0 "Khi cưỡi ngựa qua lãnh địa cùng [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)], chiến mã của [visiting_liege.GetHerHis] vấp phải một hòn đá trên mặt đất, khiến [visiting_liege.GetHerHim] thoáng chốc mất thăng bằng. Ngay khi vài người trong đoàn bắt đầu khúc khích cười, [visiting_liege.GetNameNoTooltip] xuống ngựa"
  tour_grounds_events.3011.desc.mid.irritable:0 "trong cơn thịnh nộ và lạnh lùng cắt cổ con vật tội nghiệp, đứng nhìn sinh mạng rời khỏi thân xác nó."
  tour_grounds_events.3011.desc.mid.calm:0 "và cẩn thận bắn một mũi tên vào giữa hai mắt con vật đáng thương."
  tour_grounds_events.3011.desc.outro:0 "\n\n\"Ta không cần những con thú hay thần dân khiến ta thất vọng. Ta luôn có thể tìm cái khác.\""
  tour_grounds_events.3011.a:0 "Thần có thể tìm cho ngài con khác, thưa [visiting_liege.GetLadyLord]!"
  tour_grounds_3011.vassal_paid_for_new_horse:0 "[stop_host_scope.GetNameNoTooltip] Đề Nghị Mua Ngựa Mới"
  tour_grounds_events.3011.b:0 "Đã rõ."
  tour_grounds_3011.vassal_did_not_pay:0 "Ta Đã Mua Ngựa Mới"

  tour_grounds_events.3012.title:0 "Bọn Săn Trộm!"
  tour_grounds_events.3012.desc.intro:0 "Khi ta và đoàn tùy tùng cưỡi ngựa tiến đi, ta nghe thấy những tiếng xì xào vang khắp lãnh địa. Ta ra lệnh cho một cậu bé cưỡi ngựa đi trước, và khi nó quay lại, nó báo rằng có một băng săn trộm trái phép ngay phía trước chúng ta.\n\n"
  tour_grounds_events.3012.desc.mid.sadistic:0 "Đây là cơ hội lý tưởng để giáng xuống vài nỗi đau chính đáng lên những kẻ xấu số, đồng thời lấy lòng [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)]."
  tour_grounds_events.3012.desc.mid:0 "Dù việc này chẳng liên quan đến ta, nhưng nếu ta dọn sạch hoạt động phi pháp này thì chắc chắn sẽ khiến [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] hài lòng."
  tour_grounds_events.3012.desc.outro:0 "\n\nTa có thể bắt gọn bọn côn đồ này và dâng đầu cùng bàn tay của chúng cho [stop_host_scope.GetNameNoTooltip] mà chẳng gặp khó khăn gì."
  tour_grounds_events.3012.a:0 "Đã đến lúc săn bắn."
  tour_grounds_events.3012.b:0 "Tha cho chúng, đổi lấy một khoản phí."
  tour_grounds_events.3012.c:0 "Tránh xa chúng."
  tour_grounds_events.3013.title:0 "Một Bao Tàn Tích"
  tour_grounds_events.3013.desc:0 "Ta đã xa cách [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] một thời gian, và khi đoàn tụ, ta thấy ngài cưỡi ngựa cùng với vài cái bao đỏ sẫm nhỏ giọt máu bên mình.\n\n[visiting_liege.GetSheHe|U] trút những cái bao đó xuống dưới chân ta và ta không khỏi kinh hoàng khi thấy những bàn tay cùng những cái đầu bị chặt lìa của những linh hồn bất hạnh rơi ra, khuôn mặt họ vẫn hằn in nỗi kinh hoàng vĩnh viễn.\n\n\"Ta đã thay ngài dọn sạch lũ săn trộm và phường trộm cướp trên lãnh địa của ngài. Đừng bận tâm, người bạn của ta.\""
  tour_grounds_events.3013.a:0 "Đa tạ, thưa [visiting_liege.GetLadyLord]."
  tour_grounds.vassal_impressed:0 "[stop_host_scope.GetFirstNameNoTooltip] Ấn Tượng"
  tour_grounds_events.3013.b:0 "Thật kinh hoàng!"
  tour_grounds.vassal_horrified:0 "[stop_host_scope.GetFirstNameNoTooltip] Kinh Hãi"

  tour_grounds_events.3014.title:0 "Xa Hoa Đáng Bị Đánh Thuế"
  tour_grounds_events.3014.desc:0 "Khi ta được đưa đi thưởng ngoạn khắp các cảnh quan tại [touring_grounds_scope.GetNameNoTooltip], ta bắt đầu nhận thấy sự xa hoa tột bậc nơi đây.\n\nDẫu chỉ là một [stop_host_scope.GetTitleAsNameNoTooltip], [stop_host_scope.GetFirstNameNoTooltip] lại sống trong cảnh sung túc đến lạ thường và rõ ràng là lão có thừa mứa vàng bạc để phung phí.\n\nNhìn vào vô số những ô cửa sổ trong tư gia của lão, ta có thể áp đặt một loại thuế cửa sổ để rút tỉa bớt sự dư thừa của tên [stop_host_scope.GetTitleAsNameNoTooltip|U] này."
  tour_grounds_events.3014.a:0 "Vậy thì thuế cửa sổ."
  tour_grounds_events.3014.b:0 "Tạm tha cho [stop_host_scope.GetHerHim] lần này."
  tour_grounds_events.3015.title:0 "Thuế Cửa Sổ"
  tour_grounds_events.3015.desc:0 "Ta đã tỉ mỉ đưa [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] đi chiêm ngưỡng mọi cảnh quan tuyệt mỹ tại [touring_grounds_scope.GetNameNoTooltip], tin rằng mình đã là một chủ nhà chu đáo.\n\nTuy nhiên, ta thấy ngài hướng sự chú ý về tư gia của ta, vừa chỉ trỏ vừa lẩm bẩm điều gì đó với chính mình. Ta gặng hỏi thì ngài cười khẩy.\n\n\"À, ta chỉ đang đếm số cửa sổ thôi. Ngài có biết về sắc thuế cửa sổ bắt buộc không? Nó đã tồn tại từ khi [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] mới hình thành, và ta không thể để một số lượng cửa sổ vô lý như thế này mà không áp thuế cho phải đạo được.\""
  tour_grounds_events.3015.a:0 "Được thôi, ta sẽ nộp thuế cửa sổ của ngài."
  tour_grounds.vassal_paid_tax:0 "[stop_host_scope.GetName] Đã Nộp Thuế"
  tour_grounds_events.3015.b:0 "Thuế cửa sổ là cái gì?"
  tour_grounds.vassal_refused_to_pay_tax:0 "[stop_host_scope.GetName] Từ Chối Nộp Thuế"
  tour_grounds.vassal_won_tax_duel:0 "[stop_host_scope.GetName] Tránh Được Thuế"

  tour_grounds_events.3016.title:0 "Kỷ Vật"
  tour_grounds_events.3016.desc:0 "Cuối cùng ta cũng có lúc ở một mình giữa vùng hoang dã của [touring_grounds_scope.GetNameNoTooltip] và tâm trí ta nghĩ đến [liege_lover_scope.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nTa không thể phủ nhận rằng [touring_grounds_scope.GetNameNoTooltip] là nơi tuyệt đẹp, gần như đủ đẹp để sánh với người yêu dấu của ta là [liege_lover_scope.GetNameNoTooltip]. Ta cảm thấy thôi thúc để lại dấu ấn nơi đây để mọi kẻ đi qua [touring_grounds_scope.GetNameNoTooltip] đều biết tình yêu của ta dành cho [liege_lover_scope.GetHerHim]. Có lẽ khắc tên [liege_lover_scope.GetHerHis] lên một [touring_grounds_scope.Custom('get_carvable_surface')]!"
  tour_grounds_events.3016.a:0 "Hãy làm vậy."
  tour_grounds_events.3016.b:0 "Không, nơi này đã hoàn hảo rồi."
  tour_grounds_events.3017.title:0 "Bị Xúc Phạm"
  tour_grounds_events.3017.desc:0 "Cuối cùng ta cũng bắt kịp [visiting_liege.GetTitleAsNameNoTooltip|U] của mình, và kinh hoàng thay, ta thấy [visiting_liege.GetHerHim] đang khắc tên [visiting_liege.GetHerHis] lên một [touring_grounds_scope.Custom('get_carvable_surface')].\n\nKhông nghi ngờ gì nữa, [visiting_liege.GetSheHe] không thể biết rằng [touring_grounds_scope.Custom('get_carvable_surface')] này có ý nghĩa tâm linh vô cùng lớn đối với dân địa phương, và nếu họ phát hiện rằng [visiting_liege.GetTitleAsNameNoTooltip|U] của họ đã báng bổ một nơi linh thiêng như vậy, họ sẽ nguyền rủa cái tên [visiting_liege.GetName] suốt nhiều thế hệ!"
  tour_grounds_events.3017.a:0 "Thật đáng tiếc."
  tour_grounds_events.3017.b:0 "Ta sẽ nhận lỗi!"
  tour_grounds_events.3018.title:0 "$tour_grounds_events.3017.title$"
  tour_grounds_events.3018.desc:1 "Ta đang vui vẻ khắc dấu của mình lên [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] thì bỗng nghe thấy một tiếng hít khí kinh ngạc bên cạnh.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trông hoàn toàn kinh hãi khi [stop_host_scope.GetSheHe] nhìn thấy tác phẩm của ta, rồi nhanh chóng tiến lại gần để giải thích.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], thần tin chắc rằng ngài không hề biết [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] này được dân địa phương tại [touring_grounds_scope.GetNameNoTooltip] xem là vật linh thiêng!"
  tour_grounds_events.3018.desc.outro.took_the_blame:0 "Xin ngài đừng lo, thần sẽ nhận lỗi về việc này. Chỉ xin ngài đừng nhắc lại chuyện này nữa.""
  tour_grounds_events.3018.desc.outro.blamed_liege:0 "Dân chúng và giáo sĩ của [touring_grounds_scope.GetNameNoTooltip] sẽ nguyền rủa tên ngài vĩnh viễn vì hành động báng bổ này!"" 
  tour_grounds_events.3018.a.took_blame:0 "Đa tạ."
  tour_grounds_events.3018.a.was_blamed:1 "Sao một [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] lại không thể chỉ đơn giản là một [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')]?"

  tour_grounds_events.3019.title:0 "Những Thứ Xa Hoa Có Thể Đánh Thuế"
  tour_grounds_events.3019.desc:0 "[touring_grounds_scope.GetNameNoTooltip] dường như là một nơi cực kỳ xa hoa và phô trương, với một [stop_host_scope.GetTitleAsNameNoTooltip] béo tốt làm người cai trị.\n\nĐi đến đâu ta cũng thấy những dấu hiệu chỉ về một điều: các tiện nghi đáng lẽ phải chịu thuế nhưng chưa được khai báo. Số lượng gia súc dường như cao hơn nhiều so với báo cáo, còn dinh thự của [stop_host_scope.GetTitleAsNamePossessiveNoTooltip] thì gần như xa hoa đến mức xứng với một [ROOT.Char.GetTitleAsNameNoTooltip|U]!\n\n[greedy_entourage_member.GetName] gợi ý rằng ta nên đánh thuế phần dư thừa này, vì rõ ràng [stop_host_scope.GetName] chưa hề nộp đủ nghĩa vụ của [stop_host_scope.GetHerHis]."
  tour_grounds_events.3019.a:0 "Đánh thuế [stop_host_scope.GetTitleAsNameNoTooltip]!"
  tour_grounds_events.3019.b:0 "Tạm thời bỏ qua."
  tour_grounds_events.3020.title:0 "$tour_grounds_events.3019.title$"
  tour_grounds_events.3020.desc:0 "[visiting_liege.GetName] dạo này có vẻ xa cách và lơ đễnh, thỉnh thoảng lại lẩm bẩm một mình và thì thầm với [greedy_entourage_member.GetName]. Cuối cùng, ngài trực tiếp tiến lại gần ta và nói thẳng những gì đang trăn trở trong lòng.\n\n\"Là một [stop_host_scope.GetTitleAsNameNoTooltip], ngài hẳn phải ý thức được nghĩa vụ tài chính đối với ta - chúa công của ngài. Khi nhìn quanh sự hoành tráng trong tư gia của ngài, ta không khỏi cảm thấy ngài đã đôi chút gian lận thuế. Có lẽ chúng ta nên sớm chỉnh đốn lại điều đó.\""
  tour_grounds_events.3020.a:0 "Ta đã nộp đủ những gì mình nợ!"
  tour_grounds_events.3020.b:0 "Được thôi."
  tour_grounds_events.3040.title:0 "Thần Dân Bất Trung"
  tour_grounds_events.3040.desc.intro:0 "Ta thấy tò mò muốn xem bọn dân đen ở [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] sống thế nào, nên ghé vào một quán nơi dân địa phương đang trở nên khá ồn ào. Một gã đàn ông đứng trên bàn, thu hút sự chú ý của mọi người xung quanh.\n\n"Rốt cuộc chúng ta cần một [stop_host_scope.GetTitleAsNameNoTooltip|U] để làm gì chứ? [stop_host_scope.GetFirstName]"
  tour_grounds_events.3040.desc.mid.wrong_language:0 "còn chẳng nói được ngôn ngữ của chúng ta,"
  tour_grounds_events.3040.desc.mid.wrong_culture:0 "là một kẻ ngoại quốc chết tiệt,"
  tour_grounds_events.3040.desc.mid.wrong_faith:0 "là một tên [stop_host_scope.GetFaith.GetAdherentName] đáng nguyền rủa sẽ xuống [angry_peasant.GetFaith.NegativeAfterLife],"
  tour_grounds_events.3040.desc.mid.shit_beer:0 "bắt chúng ta uống thứ [angry_peasant.Custom('RegionalAlcoholicDrink')] rác rưởi này,"
  tour_grounds_events.3040.desc.mid.shit_weed:0 "cho chúng ta hút thứ hashish rẻ tiền rồi mong chúng ta im miệng,"
  tour_grounds_events.3040.desc.mid.conscription:0 "bắt chúng ta phải chiến đấu trong các cuộc chiến của lão trong khi lão thì an nhàn hưởng lợi,"
  tour_grounds_events.3040.desc.mid.high_taxes:0 "vắt kiệt chúng ta bằng mấy thứ thuế chết tiệt này,"
  tour_grounds_events.3040.desc.mid.just_plain_dislike_em:0 "là tên [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)] tệ hại nhất ta từng thấy,"
  tour_grounds_events.3040.desc.outro:0 "thế mà lão lại còn mong đợi lòng trung thành vĩnh cửu của chúng ta!\"\n\nCả tòa nhà bùng nổ trong tiếng vỗ tay và dậm chân. Rõ ràng, [stop_host_scope.GetTitleAsNameNoTooltip|U] của ta chẳng hề được lòng dân tại chính nơi lão ngự trị."
  tour_grounds_events.3040.a:0 "Bắt hết lũ phản bội này!"
  tour_grounds_events.3040.b:0 "Không được nói xấu [stop_host_scope.GetTitleAsNameNoTooltip|U]! Đỡ lấy!"
  tour_grounds_events.3040.c:0 "Bọn nông dân này nói cũng có lý."
  tour_grounds_events.3050.title:0 "Một Trận Đánh Dằn Mặt"
  tour_grounds_events.3050.desc:0 ""Đưa tiền đây!"\n\nTiếng máu bắn tung và xương gãy răng rắc khiến ta chú ý đến một con hẻm bẩn thỉu, nơi ta thấy một [beaten_peasant.GetWomanMan] nghèo khổ đang bị một tên côn đồ địa phương túm cổ áo [beaten_peasant.GetHerHis] nhấc lên.\n\nThông thường chuyện như vậy chẳng đáng để ta bận tâm, nhưng ta có thể thật sự làm ngơ trước tội ác trắng trợn ngay trước mắt mình sao?"
  tour_grounds_events.3050.a:0 "Lính đâu! Bắt tên ngu này!"
  tour_grounds_events.3050.b:0 "Một [ROOT.Char.GetTitleAsNameNoTooltip|U] tốt phải biết bảo vệ thần dân của mình!"
  tour_grounds_events.3050.b.success:0 "Ngươi thắng trận"
  tour_grounds_events.3050.b.failure:0 "Ngươi thua trận"
  tour_grounds_events.3050.c:0 ""Này, để ta đánh [beaten_peasant.GetHerHim] vài cái xem!""
  tour_grounds_events.3060.title:0 "Tinh Hoa Của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]"
  tour_grounds_events.3060.desc.intro:0 "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hôm nay quyết định dẫn ta đến doanh trại của [stop_host_scope.GetHerHis].\n\n"
  tour_grounds_events.3060.desc.light_infantry:0 "Hàng dài bộ binh nhẹ đứng nghiêm trong giáp trụ, sẵn sàng cho cuộc kiểm duyệt của ta."
  tour_grounds_events.3060.desc.archers:0 "Hàng dài cung thủ đứng sẵn, cung cầm trong tay."
  tour_grounds_events.3060.desc.heavy_infantry:0 "Một biển giáp trụ lấp lánh đứng trước mắt ta, mỗi binh sĩ dường như không hề nao núng trước sức nặng trên người."
  tour_grounds_events.3060.desc.cavalry:0 "Những con ngựa hí và phì mũi, háo hức chờ kỵ sĩ đưa chúng xung phong."
  tour_grounds_events.3060.desc.camel_cavalry:0 "Lạc đà rên rỉ và đá chân, như thể đang ngứa ngáy muốn dọa khiếp kỵ binh đối phương."
  tour_grounds_events.3060.desc.elephant_cavalry:0 "Ta kinh ngạc trước kích thước khổng lồ của đội voi chiến, và rùng mình khi tưởng tượng những kẻ bị giẫm nát dưới chân chúng."
  tour_grounds_events.3060.desc.outro:0 "Đây là những binh sĩ giỏi, nhưng để họ nhàn rỗi cả ngày thật lãng phí."
  tour_grounds_events.3060.a:0 "Họ có thể dẹp tội phạm!"
  tour_grounds_events.3060.b:0 "Có lẽ có thể quản lý họ hiệu quả hơn."
  tour_grounds_events.3060.b.success:0 "Doanh trại được cải thiện"
  tour_grounds_events.3060.b.failure:0 "Lời khuyên của ngươi không hiệu quả"
  tour_grounds_events.3060.b.vassal:0 "[visiting_liege.GetFirstName] can thiệp vào quân đội của ngươi"
  tour_grounds_events.3060.c:0 "Ta có thể dùng những binh sĩ như thế này."
  tour_grounds_events.3060.d:0 "Có lẽ ta có thể học được điều gì đó."
  tour_grounds_events.3070.title:0 "Một Khoảnh Khắc Tĩnh Lặng"
  tour_grounds_events.3070.desc.intro:0 "Ta cùng đoàn tùy tùng dạo quanh những cảnh đẹp tuyệt vời bên ngoài [ROOT.Char.GetCurrentLocation.GetName], và"
  tour_grounds_events.3070.desc.royal_garden:0 "quanh khu vườn hoàng gia tráng lệ của [stop_host_scope.GetNamePossessive].\n\nBên trong bức tường khu vườn chỉ có ta, vài quý tộc cấp thấp và khu vườn được sắp đặt tinh xảo. Dừng lại một lúc ở đây khiến ta cảm thấy sự thanh thản hiếm khi có được."
  tour_grounds_events.3070.desc.royal_forest:0 "quanh khu rừng hoàng gia mê hoặc của [stop_host_scope.GetNamePossessive].\n\nKhu rừng này hoàn toàn vắng bóng nông dân hay quý tộc cấp thấp; chỉ có ta, những tâm phúc thân cận và tạo vật của [ROOT.Char.GetFaith.CreatorNamePossessive|U]. Ta cảm thấy như được đưa đến một cõi bình yên thuần khiết."
  tour_grounds_events.3070.desc.leisure_palace:0 "quanh cung điện mùa hè của [stop_host_scope.GetNamePossessive].\n\nBên ngoài cung điện được trang trí bằng những bức tượng tuyệt đẹp và cây cỏ bản địa sắp đặt tinh tế, còn bên trong cũng tráng lệ và xa hoa không kém. Mọi thứ nơi đây dường như tồn tại để xoa dịu tâm hồn mệt mỏi."
  tour_grounds_events.3070.desc.outro:0 "\n\nTa có thể ở lại đây mãi mãi."
  tour_grounds_events.3070.a:0 "Ta có thể học được rất nhiều từ nơi này."
  tour_grounds_events.3070.b:0 "Một cuộc dạo chơi nhàn nhã là món quà."
  tour_grounds_events.3070.c:0 "Đóng quân tại đây, sự bình yên này phải được bảo vệ!"
  tour_grounds_events.3080.title:0 "Quân Lực Địa Phương"
  tour_grounds_events.3080.desc.intro:0 "Ta thấy mình đang lang thang tới những cảnh quan mang tính quân sự hơn tại [ROOT.Char.GetCurrentLocation.GetName], và ta vô tình lạc vào lãnh địa của [stop_host_scope.GetNamePossessive]"
  tour_grounds_events.3080.desc.military_academy:0 "học viện quân sự.\n\nKhắp học viện ta thấy những $knight_culture_player_plural_no_tooltip_lowercase$ mang phong thái quý tộc luyện tập và rèn luyện kỹ năng, biết rằng chiến tranh luôn ở phía trước."
  tour_grounds_events.3080.desc.march:0 "vùng biên phòng.\n\nKhắp biên giới, họ chuẩn bị cho bất kỳ kẻ xâm lược hay kẻ phạm pháp nào xuất hiện."
  tour_grounds_events.3080.desc.siege_works:0 "xưởng công thành.\n\nCác cỗ máy được bảo dưỡng liên tục; có cái đang sửa chữa, có cái đang được lắp ráp lần đầu."
  tour_grounds_events.3080.desc.royal_armories:0 "kho vũ khí hoàng gia.\n\nÁnh kim loại đánh bóng của những bộ giáp trong kho vũ khí khiến căn phòng gần như phát sáng."
  tour_grounds_events.3080.desc.jousting_lists:0 "bãi đấu thương.\n\nTiếng ngựa hí vang lên xen lẫn tiếng thương gãy vỡ."
  tour_grounds_events.3080.desc.archery_ranges:0 "trường bắn cung.\n\nTiếng #EMP thud-thud-thud#! đều đặn của mũi tên cắm vào bia vang lên cùng tiếng dây cung rung."
  tour_grounds_events.3080.desc.outro:0 "\n\n[ROOT.Char.GetCurrentLocation.GetName] là một trung tâm quân sự đáng nể, và ta rõ ràng có nhiều điều để học từ họ."
  tour_grounds_events.3080.a:0 "Và ta sẽ học."
  tour_grounds_events.3080.b:0 "Bọn lính nhàn rỗi này nên đi quét tội phạm!"
  tour_grounds_events.3080.c:0 "Có lẽ ta nên học một bài."
  tour_grounds_events.3090.title:0 "Niềm Tự Hào Của Người Nông Dân"
  tour_grounds_events.3090.desc.intro:0 "Lang thang ở vùng quê [ROOT.Char.GetCurrentLocation.GetName], ta bắt gặp một nhóm nông dân tụ tập trong một thôn nhỏ.\n\nĐi cùng với chủ nhân tự hào của chúng,"
  tour_grounds_events.3090.desc.vegetables:0 "những củ [farmer.Custom('RegionalRootVegetablePlural')] khổng lồ chất đầy xe và quầy chợ."
  tour_grounds_events.3090.desc.livestock:0 "những con gia súc béo tốt đang gặm cỏ, trông ngon đến mức muốn cắn một miếng ngay!"
  tour_grounds_events.3090.desc.outro:0 "Thỉnh thoảng nông dân mang sản phẩm của mình ra chấm điểm, so sánh kích thước và sức khỏe. Có vẻ họ đang tổ chức một lễ hội, và khi nhận ra ta, họ háo hức khoe thành quả lao động của mình."
  tour_grounds_events.3090.a:0 "Chúng ta nên khảo sát vùng đất này."
  tour_grounds_events.3090.b:0 ""Thật lãng phí thời gian! Quay lại ruộng đi!""
  tour_grounds_events.3090.c:0 "Thật tuyệt vời, ta sẽ làm giám khảo."
  tour_grounds_events.3100.title:0 "Một Ngày Yên Tĩnh"
  tour_grounds_events.3100.desc.intro:0 "Trong chuyến du hành qua [ROOT.Char.GetCurrentLocation.GetName], ta cuối cùng cũng có một khoảnh khắc hiếm hoi khi không bị chủ nhà dẫn đi khắp nơi hay bị yêu cầu xuất hiện ở đâu đó.\n\nTa thấy các nơi thờ phụng bắt đầu đông người,"
  tour_grounds_events.3100.desc.booze:0 "các quán rượu bắt đầu đón những kẻ uống sớm,"
  tour_grounds_events.3100.desc.hash:0 "những bóng người khả nghi lén lút tiến vào các vườn hashish bí mật,"
  tour_grounds_events.3100.desc.outro:0 "và những kẻ ăn xin nằm trên phố cầu xin chỉ một mẩu bánh để sống."
  tour_grounds_events.3100.a:0 "Phải tiến hành điều tra dân số nơi này."
  tour_grounds_events.3100.b:0 "Ta nên dành ngày hôm nay trong sự hiện diện của [ROOT.Char.GetFaith.HighGodNamePossessive]."
  tour_grounds_events.3100.c:0 "Ta nên xem cách [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural] thờ phụng."
  tour_grounds_events.3100.d:0 "Một cơ hội tuyệt vời để làm từ thiện."
  tour_grounds_events.3100.e:0 "Ta chỉ muốn thư giãn."

  friend_helped_me:0 "[CHARACTER.GetShortUIName|U] đã giúp đỡ [TARGET_CHARACTER.GetShortUIName] đúng lúc cần thiết"
  friend_helped_me_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] đã giúp đỡ [CHARACTER.GetShortUIName] đúng lúc cần thiết"
  rival_incompetence:0 "[TARGET_CHARACTER.GetShortUIName|U] đã chán ngấy sự bất tài của [CHARACTER.GetShortUINamePossessive]"
  rival_incompetence_corresponding:0 "[CHARACTER.GetShortUIName|U] đã chán ngấy sự bất tài của [TARGET_CHARACTER.GetShortUINamePossessive]"
  rival_insulted_me:0 "[CHARACTER.GetShortUIName|U] đã sỉ nhục [TARGET_CHARACTER.GetShortUIName]"
  rival_insulted_me_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] đã sỉ nhục [CHARACTER.GetShortUIName]"

# Host Dinner
  host_dinner_events.1001.title:0 "Bữa Tiệc Cạn Rượu"
  host_dinner_events.1001.desc:0 "Ta đang vui vẻ chè chén cùng [visiting_liege.GetName], đêm nay đầy ắp rượu chè và trò đùa. Nhưng có vẻ ta đã quá hào phóng với kho rượu của mình khi một người hầu lặng lẽ báo rằng giọt [ROOT.Char.Custom('RegionalAlcoholicDrink')] cuối cùng đã bị uống sạch!\n\nChủ quân của ta ngồi ở đầu kia bàn, mặt đỏ như trẻ sơ sinh, đập cốc của [visiting_liege.GetHerHis] xuống bàn.\n\n"Nào! Đêm vẫn còn dài! Rượu đâu?!""
  host_dinner_events.1001.a:0 ""Đi bổ sung kho rượu ngay!""
  host_dinner_events.1001.replenished_stores:0 "[stop_host_scope.GetName] đã bổ sung kho rượu"
  host_dinner_events.1001.b:0 "Ngài uống đủ rồi!"
  host_dinner_events.1001.didnt_replenish_stores:0 "[stop_host_scope.GetName] khiển trách việc uống rượu của ngài"
  host_dinner_events.1001.c:0 "Có lẽ nên đổi địa điểm."
  host_dinner_events.1001.d:0 "Ta sẽ bổ sung... đổi lấy một ân huệ."
  host_dinner_events.1002.title:0 "Một Vài Vại Rượu"
  host_dinner_events.1002.desc:0 "Chủ nhà của ta, [stop_host_scope.GetName], đã đưa ta rời khỏi dinh thự của [stop_host_scope.GetHerHis] đến một quán rượu địa phương. Xung quanh ta là những kẻ khốn khổ và yếu đuối chìm trong rượu chè và trụy lạc, nhưng [stop_host_scope.GetTitledFirstNameNoTooltip] đảm bảo rằng [ROOT.Char.Custom('RegionalAlcoholicDrink')] ở đây ngon đến chết người.\n\nNgay khi vòng rượu đầu tiên chạm môi ta, ta cảm thấy tràn đầy sức sống. Thứ rượu này mạnh như búa tạ, và ta biết đêm nay sẽ là một đêm chè chén bất tận."
  host_dinner_events.1002.a:0 "Ngươi thật sự đã làm rất tốt, [stop_host_scope.GetFirstNameNoTooltip]!"
  host_dinner_events.1002.b:0 "Hãy biết chừng mực."
  host_dinner_events.1002.c:0 "Ta sẽ uống đến chết."
  drank_too_much_toast:0 "Ngươi uống đến mức bất tỉnh"
  host_dinner_events.1003.title:0 "Một [visiting_liege.GetTitleAsNameNoTooltip|U] Đang Ngủ"
  host_dinner_events.1003.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] cuối cùng cũng đã đi nghỉ và đang ngủ yên trong phòng của [visiting_liege.GetHerHis], hẳn đang mơ tiếp tục vét sạch kho đồ ăn thức uống của ta.\n\nĐây có lẽ là cơ hội tốt để làm ngài bất ngờ. Có lẽ là chút giải trí đêm khuya, hay thứ gì đó thú vị để [visiting_liege.GetHerHim] thức dậy thấy..."
  host_dinner_events.1003.a:0 "Dàn dựng một màn ma ám!"
  host_dinner_events.1003.b:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] luôn là món quà tốt!"
  host_dinner_events.1003.c:0 "Bánh hashish sẽ khiến [visiting_liege.GetHerHim] hài lòng."
  host_dinner_events.1003.d:0 "Sự ve vuốt của một cung phi là cách đánh thức tuyệt vời."
  host_dinner_events.1003.e:0 "Sự bầu bạn của ta chắc chắn sẽ làm [visiting_liege.GetHerHim] vui."
  host_dinner_events.1004.title:0 "Một Sự Thức Giấc Kinh Hoàng"
  host_dinner_events.1004.desc.intro:0 "Ta nằm yên trong phòng ngủ tốt nhất của [stop_host_scope.GetTitledFirstNamePossessive], tâm trí không lo nghĩ gì. Bỗng nhiên, giấc ngủ của ta bị xé toạc bởi tiếng cười rùng rợn vang lên cuối hành lang.\n\nTa miễn cưỡng bước ra, tay run rẩy cầm cây nến trong ánh sáng mờ và nhìn xuống hành lang."
  host_dinner_events.1004.desc.ghost:0 "Ta thề rằng thứ ta thấy ở cuối hành lang tối dài kia là một linh hồn tà ác. Nó thì thầm gọi tên ta, có lẽ muốn kéo ta xuống [ROOT.Char.GetFaith.NegativeAfterLife]! Dù nó muốn gì, ta phải hành động để cứu mình!"
  host_dinner_events.1004.desc.cynic:0 "Nỗi sợ của ta lập tức tan biến khi nhận ra đó chỉ là một người hầu trùm tấm vải lanh lên đầu. Hắn tạo ra tiếng động và gọi tên ta, nhưng trẻ con cũng biết đây không phải linh hồn.\n\nĐây chắc chắn là trò đùa của [stop_host_scope.GetNamePossessive]."
  host_dinner_events.1004.a:0 "Kêu cứu!"
  host_dinner_events.1004.b:0 "Chặn cửa lại!"
  host_dinner_events.1004.c:0 "Thật thú vị!"
  host_dinner_events.1004.enjoyed_spooky_ghost:0 "[visiting_liege.GetName] thích trò đùa"
  host_dinner_events.1004.d:0 "[stop_host_scope.GetFirstNameNoTooltip] đánh thức ta vì trò này sao?"
  host_dinner_events.1005.title:0 "Bóng Ma Của [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
  host_dinner_events.1005.desc:0 "Có vẻ như trò đùa của ta đã hiệu quả đến mức quá trớn, vì ta nghe thấy [visiting_liege.GetName] thét lên như một [visiting_liege.Custom('GirlBoy')] nhỏ và gọi ta đến giúp ngài.\n\nTa vội vã chạy tới phòng ngài và thấy ngài tái mét như tờ giấy, tay chỉ vào "con ma" ở cuối hành lang.\n\n\"Ôi tạ ơn Chúa vì ngài đã đến! Có một linh hồn quỷ dữ đang cố kéo ta xuống [visiting_liege.GetFaith.NegativeAfterLife]!\""
  host_dinner_events.1005.a:0 "Đúng là đồ ngu!"
  host_dinner_events.1004.mocked_me:0 "Ta bị chế giễu"
  host_dinner_events.1005.b:0 "Ta có thể trừ tà... đổi lấy một ân huệ."
  host_dinner_events.1004.hooked_me:0 "[stop_host_scope.GetName] đã trừ tà."
  host_dinner_events.1005.c:0 "Cút đi hỡi linh hồn!"
  host_dinner_events.1006.title:0 "Một Lời Đánh Thức Bất Ngờ"
  host_dinner_events.1006.desc.intro:1 "Ta tỉnh dậy sau một đêm yên bình nữa khi ở nhà [stop_host_scope.GetName]. Khi dần tỉnh táo, ta cảm thấy có thứ gì đó nặng nằm bên cạnh mình mà trước đó không hề có.\n\n"
  host_dinner_events.1006.desc.alcohol:0 "Một thùng đầy [stop_host_scope.Custom('RegionalAlcoholicDrink')] nằm bên cạnh ta như người tình, kêu ọc ọc mỗi khi ta cử động."
  host_dinner_events.1006.desc.weed:0 "Bên cạnh ta là đủ bánh hashish để ta ăn hết cân nặng của mình nếu muốn!"
  host_dinner_events.1006.desc.hedonist:0 "Ta cảm nhận được cái chạm quen thuộc của một [concubine_scope.GetWomanMan] đang lướt những ngón tay đầy tò mò qua ngực mình."
  host_dinner_events.1006.desc.vanity:0 "Ta quay lại và thấy [stop_host_scope.GetFirstNameNoTooltip] ngồi ở cuối giường, ăn mặc chỉnh tề.\n\n"Chào buổi sáng, thưa [ROOT.Char.GetTitleAsNameNoTooltip]. Ta nghĩ nên tặng ngài một món quà, và còn món quà nào tốt hơn cuộc trò chuyện với ta?""
  host_dinner_events.1006.desc.outro:0 "\n\nMón quà này thật bất ngờ, nhưng liệu nó có phải thứ dễ chịu để thức dậy cùng không?"
  host_dinner_events.1006.a:0 "Thật là cách thức dậy tuyệt vời."
  host_dinner_events.1006.liked_gift:0 "[visiting_liege.GetTitledFirstName] thích món quà."
  host_dinner_events.1006.b:0 "Biến khỏi mắt ta!"
  host_dinner_events.1006.refused_gift:0 "[visiting_liege.GetTitledFirstName] bị xúc phạm."
  host_dinner_events.3001.title:0 "Một Lời Đề Nghị Thú Vị"
  host_dinner_events.3001.desc.intro:0 "Ta đang tận hưởng bữa tối tĩnh lặng cùng [stop_host_scope.GetName] và [lusty_spouse_scope.GetName] - [stop_host_scope.Custom2('RelationToMeShort', lusty_spouse_scope)] của lão.\n\nChỉ vài khoảnh khắc sau khi [stop_host_scope.GetNameNoTooltip] xin phép lui ra ngoài, [lusty_spouse_scope.GetNameNoTooltip] liền lao vào ta như một con chó dại!"
  host_dinner_events.3001.desc.not_into_it:0 "Ta cố đẩy kẻ sa đọa [lusty_spouse_scope.Custom2('InsultAdjective', ROOT.Char)] này ra, nhưng [lusty_spouse_scope.GetSheHe] cứ khăng khăng đầu độc tâm trí ta bằng những ý nghĩ ô uế."
  host_dinner_events.3001.desc.into_it:0 "Ta bất ngờ trước sự ve vãn của [lusty_spouse_scope.GetHerHis], nhưng không thể ngăn đôi tay mình lướt qua cơ thể [lusty_spouse_scope.GetHerHis]."
  host_dinner_events.3001.desc.mid:0 "Ta chết lặng vì kinh ngạc, thật đáng báo động khi chỉ cần [stop_host_scope.GetFirstNameNoTooltip] rời phòng là [lusty_spouse_scope.GetFirstNameNoTooltip] đã nghĩ tới chuyện ngoại tình với người gần nhất."
  host_dinner_events.3001.desc.outro:0 "\n\n"Ôi xin hãy cứu ta khỏi sự nhàm chán này! [stop_host_scope.GetFirstNameNoTooltip] đâu phải người tình của ta, [stop_host_scope.GetSheHe] yêu thương ta chẳng khác gì khúc gỗ. Hãy lấy ta, và yêu ta như [stop_host_scope.GetSheHe] chưa từng làm.""
  host_dinner_events.3001.a:0 "Rất hân hạnh!"
  host_dinner_events.3001.b:0 "Ta phải nói ngay với [stop_host_scope.GetTitledFirstNameNoTooltip]!"
  host_dinner_events.3001.c:0 "Ta sẽ không nói, nhưng ngươi nợ ta một lần."
  host_dinner_events.3001.d:0 "Tránh xa ta ra, đồ dâm phụ trơ trẽn!"
  host_dinner_events.3002.title:0 "[lusty_spouse_scope.GetFirstNameNoTooltip]: Kẻ Ngoại Tình"
  host_dinner_events.3002.desc:0 "Ta quay lại bữa tối sau một lúc rời đi và thấy [lusty_spouse_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] đang ngồi khó xử cùng [visiting_liege.GetName].\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip], e rằng ta có tin rất đáng sợ. Khi ngài rời đi, kẻ dâm đãng trơ trẽn này đã cố gạ gẫm ta ngoại tình!""
  host_dinner_events.3002.a:0 "Đây là lý do chính đáng để ly hôn."
  host_dinner_events.3002.b:0 "Chúng ta nên giữ chuyện này giữa chúng ta."
  host_dinner_events.3002.c:0 "Ta sẽ giả vờ như chưa nghe gì."
  host_dinner_events.3002.d:0 "Ta sẽ không bao giờ tha thứ cho [lusty_spouse_scope.GetHerHim]."
  host_dinner_events.1007.title:0 "Một Màn Diễn Đáng Nhớ"
  host_dinner_events.1007.desc:0 "Dạo gần đây, [visiting_liege.GetName] có vẻ đang dần chán chường trong sự hiện diện của ta, thường tỏ ra như đang ở ranh giới giữa tỉnh và mơ.\n\nMột ý nghĩ chợt lóe lên khi ta nhìn ngài dửng dưng đẩy qua đẩy lại thức ăn trên đĩa. Ngài đã sống một cuộc đời đầy trải nghiệm, có lẽ ngài sẽ thấy hài lòng nếu chúng ta tái hiện lại một trong những chiến công lẫy lừng của ngài dưới hình thức một vở kịch!\n\nCâu hỏi duy nhất là, [visiting_liege.GetNameNoTooltip] sẽ thấy vở kịch kiểu nào là thú vị nhất?"
  host_dinner_events.1007.a:0 "Dĩ nhiên là một vở kịch chiến tranh!"
  host_dinner_events.1007.b:0 "Một vở hài về cái chết của kẻ thù mà [visiting_liege.GetHerHis] căm ghét!"
  host_dinner_events.1007.c:0 "[visiting_liege.GetSheHe|U] sẽ xúc động trước một bi kịch."
  host_dinner_events.1007.d:0 "Một vở về niềm vui hôn nhân!"
  host_dinner_events.1007.e:0 "Đây là ý tưởng tệ hại."
  host_dinner_events.1008.title:0 "$host_dinner_events.1007.title$"
  host_dinner_events.1008.desc.intro:0 "Có vẻ [stop_host_scope.GetName] đã quyết định tổ chức một màn biểu diễn để mua vui cho ta tối nay. Ta ngồi tại bàn tiệc háo hức chờ đợi trò giải trí của mình, thì"
  host_dinner_events.1008.desc.mid.war_memory:0 "[stop_host_scope.GetNameNoTooltip] xuất hiện trước mặt ta trong bộ giáp.\n\n"Hãy xem đây! Ta là [loser.GetName] hùng mạnh và ta sẽ đích thân đưa tên [visiting_liege.GetNameNoTooltip] hèn hạ về gặp đấng tạo hóa của [visiting_liege.GetHerHis]!"\n\nTrước khi ta kịp đáp lời, một thanh kiếm gỗ đã được đặt vào tay ta. Không nghi ngờ gì nữa, đây là màn tái hiện thời điểm [memory_performance_scope.GetDescription]."
  host_dinner_events.1008.desc.mid.dead_rival_memory:0 "[stop_host_scope.GetNameNoTooltip] xuất hiện với lớp trang điểm xấu xí và bộ y phục rẻ tiền.\n\n"Ôi khổ thay! Ta không thể bám víu cuộc sống phàm trần này lâu hơn nữa. Nguyền rủa thay, ta sẽ không bao giờ làm nhục [visiting_liege.GetNameNoTooltip] thêm lần nào nữa!"\n\nMàn diễn đầy tiếng động ruột và tiếng rên rỉ chế giễu, tái hiện thời điểm [memory_performance_scope.GetDescription]."
  host_dinner_events.1008.desc.mid.dead_positive_relation_memory:0 "[stop_host_scope.GetNameNoTooltip] xuất hiện trong trang phục của người thân yêu đã khuất của ta, [dead_relation.GetName].\n\n"Than ôi, ta sắp đến [dead_positive_relation_memory_scope.dead_relation.GetFaith.PositiveAfterLife|U]. Ta chỉ nghĩ đến [visiting_liege.GetNameNoTooltip] và tất cả những kỷ niệm tuyệt vời chúng ta đã có."\n\nMột màn bi kịch chân thành tái hiện thời điểm [memory_performance_scope.GetDescription]."
  host_dinner_events.1008.desc.mid.marriage_memory:0 "[stop_host_scope.GetNameNoTooltip] xuất hiện với trang phục gần như giống hệt [spouse.GetName] trong ngày cưới của ta.\n\n"Quả thật hôm nay là ngày hạnh phúc nhất đời ta! Ta sẽ kết hôn với [visiting_liege.GetNameNoTooltip] tuyệt vời!"\n\nTa được mời lên sân khấu nắm tay [stop_host_scope.GetName], nhưng"
  host_dinner_events.1008.desc.outro:0 "Ta tự hỏi, liệu ta có nên chiều theo trò này không?"
  host_dinner_events.1008.a:0 "Thật tuyệt vời!"
  host_dinner_events.1008.b:0 "Đây là sự sỉ nhục!"
  host_dinner_events.3003.title:0 "Một Món Đặc Sản Địa Phương"
  host_dinner_events.3003.desc:0 "Bữa tối tối nay hơi khác so với những gì ta quen. Người đầu bếp thờ ơ đặt bát xuống trước mặt ta và ngay lập tức ta ngửi thấy mùi kỳ lạ nhất đời mình.\n\nMón ăn từ tận đáy [ROOT.Char.GetFaith.NegativeAfterLife] này xúc phạm mọi giác quan. Một thứ chất xám nhầy nhụa nằm trong nước dùng nhạt bọt như bô vệ sinh bỏ quên, phía trên đặt một nhánh thảo mộc như nỗ lực vô ích để khiến nó trông ngon miệng.\n\nMọi bản năng của ta thôi thúc ném thứ này ra cửa sổ gần nhất, nhưng [stop_host_scope.GetNameNoTooltip] đảm bảo rằng đây là đặc sản địa phương xứng đáng với một [ROOT.Char.GetTitleAsNameNoTooltip]."
  host_dinner_events.3003.a:0 "Uống cạn!"
  host_dinner_events.3003.disgusting:0 "Món ăn thật kinh tởm"
  host_dinner_events.3003.delicious:0 "Đặc sản này thật tuyệt vời"
  host_dinner_events.3003.b:0 "Ta sẽ không để thứ bẩn thỉu này chạm vào lưỡi mình."
  host_dinner_events.3003.c.my_dog:0 "Có lẽ ta có thể lén đưa cho chó của ta..."
  host_dinner_events.3003.c.lieges_dog:0 "Có lẽ ta có thể lén đưa cho chó của [stop_host_scope.GetFirstNamePossessiveNoTooltip]..."
  host_dinner_events.3003.unnoticed:0 "[stop_host_scope.GetNameNoTooltip] không nhận ra"
  host_dinner_events.3003.host_noticed:0 "[stop_host_scope.GetNameNoTooltip] đã nhận ra"
  host_dinner_events.3004.title:0 "Một Lời Thề Sớm"
  host_dinner_events.3004.desc.intro:0 "Ta đến bữa tối sớm hôm nay, và thấy mình đang ở một mình với người thừa kế của [stop_host_scope.GetNamePossessive], [host_dinner_heir.GetName]."
  host_dinner_events.3004.desc.mid.child:0 "[stop_host_heir.GetSheHe|U] vẫn còn trẻ và rõ ràng bị áp lực khi phải chia sẻ căn phòng với [stop_host_heir.GetHerHis] [ROOT.Char.GetTitleAsNameNoTooltip]."
  host_dinner_events.3004.desc.mid.adult:0 "Bản tính cả tin của [stop_host_heir.GetHerHis|U] đã quá nổi tiếng. Như một đứa trẻ, đầu óc [stop_host_heir.GetHerHis] trống rỗng và dễ uốn nắn, và việc khiến tâm trí nhỏ bé của [stop_host_heir.GetHerHis] đi theo tầm nhìn của ta thật quá dễ dàng."
  host_dinner_events.3004.desc.outro:0 "\n\nSẽ vô cùng dễ dàng thao túng kẻ đáng thương này để sớm trao cho ta lời thề trung thành hợp pháp của [stop_host_heir.GetHerHis], nhưng điều đó chắc chắn sẽ khiến [stop_host_scope.GetNameNoTooltip] phật ý."
  host_dinner_events.3004.a:0 "Làm thôi!"
  host_dinner_events.3004.a.caught:0 "Âm mưu bất chính của ngươi đã bị phát hiện"
  host_dinner_events.3004.a.not_caught:0 "Những lời đã nói ra thì không thể rút lại"
  host_dinner_events.3004.b:0 "Ta chỉ trò chuyện thôi."
  host_dinner_events.3004.friendly_convo:0 "Ngươi đã có một cuộc trò chuyện thân thiện"
  host_dinner_events.3004.awkward_convo:0 "Cuộc trò chuyện trở nên gượng gạo"
  host_dinner_events.3005.title:0 "$host_dinner_events.3004.title$"
  host_dinner_events.3005.desc:0 "Ta bước vào đại sảnh ăn uống và thấy [visiting_liege.GetName] đang nói chuyện với [stop_host_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] về những vấn đề quốc sự và nghĩa vụ.\n\n[visiting_liege.GetName] dường như đang thao túng [stop_host_heir.GetHerHim] để đưa ra lời thề trung thành với vương quyền khi ta vắng mặt! Một lời thề như vậy sẽ ám ảnh [stop_host_heir.GetHerHim] suốt phần đời còn lại và khóa chặt tương lai của chúng ta như những kẻ bề tôi của [visiting_liege.GetNamePossessive]!"
  host_dinner_events.3005.a:0 "Ta sẽ cho phép, đổi lại một ân huệ cho ta."
  host_dinner_events.3005.hook_for_hook:1 "[stop_host_scope.GetName] đòi bồi thường"
  host_dinner_events.3005.b:0 ""Dừng trò điên rồ này ngay!""
  host_dinner_events.3005.disallowed_hook:0 "Ngươi đã bị bắt gặp"
  host_dinner_events.3006.title:0 "Những Giấc Mơ Về Cuộc Đời Tốt Hơn"
  host_dinner_events.3006.desc.intro:0 "Tối nay, ta ngồi cạnh [runaway_courtier.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)], nhìn [runaway_courtier.GetSheHe] thở dài đầy khao khát vào chiếc đĩa của [runaway_courtier.GetHerHis].\n\n"
  host_dinner_events.3006.desc.mid.concubine:0 ""À, xin thứ lỗi cho nỗi u sầu của ta, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U]. Có lẽ [stop_host_scope.GetNameNoTooltip] đã xếp ta ngồi cạnh ngài để làm ngài vui. [stop_host_scope.GetSheHe|U] vẫn luôn như vậy, [stop_host_scope.GetSheHe] chỉ xem ta như một món đồ để ngắm nghía và chơi đùa. Thật lòng mà nói, ta đã mơ được trở về cùng ngài đến [ROOT.Char.GetCapitalLocation.GetName].""
  host_dinner_events.3006.desc.mid.neutral:0 ""Quả thật, ta đã mệt mỏi với cuộc sống ở [stop_host_scope.GetCapitalLocation.GetName] và khao khát nâng cao địa vị của mình. Tài năng của ta bị lãng phí ở đây, và gần đây ta đã nghĩ đến việc lén đi cùng ngài trở về [ROOT.Char.GetCapitalLocation.GetName], nơi ta có thể thật sự chứng tỏ giá trị của mình!""
  host_dinner_events.3006.desc.outro:0 "\n\nLời than thở của [runaway_courtier.GetHerHis|U] có vẻ chân thành, nhưng ta thật sự có thể cướp người khỏi triều đình của [stop_host_scope.GetNamePossessiveNoTooltip] sao?"
  host_dinner_events.3006.a:0 "Dĩ nhiên, đi cùng ta!"
  host_dinner_events.3006.b:0 ""Ta sẽ trân trọng hơn cả vẻ đẹp của ngươi.""
  host_dinner_events.3006.c:0 "Ít nhất ta có thể làm bờ vai cho ngươi khóc."
  host_dinner_events.3006.d:0 ""Biết thân biết phận đi, [runaway_courtier.Custom2('InsultNoun', ROOT.Char)]!""
  host_dinner_events.3007.title:0 "Cận Thần Bị Đánh Cắp"
  host_dinner_events.3007.desc.intro:0 "Ta đã nghĩ rằng xếp [visiting_liege.GetName] ngồi cạnh [runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] là một ý hay, và dường như nó đã diễn ra tốt đẹp. Quá tốt đẹp."
  host_dinner_events.3007.desc.mid.concubine:0 "\n\n[runaway_courtier.GetNameNoTooltip] nhăn mặt khi [runaway_courtier.GetSheHe] thấy ta, rồi lập tức tránh ánh nhìn của [runaway_courtier.GetHerHis]."
  host_dinner_events.3007.desc.mid.neutral:0 "\n\n[runaway_courtier.GetNameNoTooltip] đảo mắt khi nhìn thấy ta, trước khi lập tức quay đi chỗ khác."
  host_dinner_events.3007.desc.outro:0 "[runaway_courtier.GetSheHe|U] dường như đã quyết rời khỏi triều đình của ta để theo [visiting_liege.GetName]! Ta có thể ngăn chuyện này, nhưng điều đó chắc chắn sẽ làm bầu không khí bữa tối trở nên tệ hại."
  host_dinner_events.3007.a:0 "Ta cấm điều đó!"
  host_dinner_events.3007.refused_to_let_them_go:0 "[stop_host_scope.GetName] từ chối để [runaway_courtier.GetHerHim] rời đi"
  host_dinner_events.3007.b:0 "Hãy để [runaway_courtier.GetHerHim] đi."
  host_dinner_events.3008.title:0 "Một Chút Tò Mò"
  host_dinner_events.3008.desc:0 "Đã là buổi sáng, và ta miễn cưỡng bước ra khỏi giấc ngủ khi ánh mặt trời sớm đột ngột xuyên thẳng vào tầm mắt. Ta thấy một người hầu đang lúng túng đi lại trong phòng, loạng choạng khi [nervous_servant.GetSheHe] đặt bữa sáng của ta xuống bên cạnh. Ta hỏi điều gì khiến [nervous_servant.GetHerHim] bận tâm, và chỉ với chút gợi mở như vậy, [nervous_servant.GetSheHe] liền tuôn ra một tràng lời nói.\n\n"Ôi [ROOT.Char.GetTitleAsNameNoTooltip] anh minh và nhân hậu của ta, những bức tường này biết nói. Ôi những điều khủng khiếp mà chúng kể. Ta biết quá nhiều, có những ngày ta nghĩ mình biết quá nhiều rồi. [stop_host_scope.GetName] sẽ không bao giờ tha thứ nếu ta nói với ngài, nhưng ta không thể giữ những bí mật này trong đầu thêm nữa!""
  host_dinner_events.3008.a:0 ""Ngươi phải nói cho ta ngay lập tức!""
  host_dinner_events.3008.secret_discovered:0 "[nervous_servant.GetSheHe|U] đã tiết lộ một bí mật"
  host_dinner_events.3008.b:0 ""Một ít tiền có làm đôi môi kia mở ra không?""
  host_dinner_events.3008.acting_sussy:0 "[stop_host_scope.GetName] nghi ngờ ngươi"
  host_dinner_events.3008.c:0 ""Tốt hơn hết ngươi nên giữ miệng cho kín.""
  host_dinner_events.1009.title:0 "Bệ Hạ"
  host_dinner_events.1009.desc:0 "Khi chúng ta vừa kết thúc món chính, ta nhìn về phía [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] với mong đợi được khen ngợi và tán thưởng, nhưng lại bắt gặp ánh nhìn chờ đợi trong mắt [visiting_liege.GetHerHis]. Rõ ràng những gì ta chuẩn bị vẫn chưa đủ cho vị khách tôn quý của mình, nhưng các đầu bếp đã làm xong mọi thứ ta yêu cầu và ta cũng không chắc còn món gì khác để dọn lên.\n\nRồi ta chợt nhớ ra rằng trong kho thực phẩm của mình vẫn còn cả một đống bánh hashish đang chờ được ăn! Chỉ còn câu hỏi: ta có sẵn lòng chia sẻ món khoái khẩu này với [visiting_liege.GetTitleAsNameNoTooltip|U] của ta hay không?"
  host_dinner_events.1009.a:0 "Mang bánh ra!"
  host_dinner_events.1009.b:0 "Ta chắc [ROOT.Char.Custom('GetExpensiveDessert')] cũng ổn thôi."
  host_dinner_events.1010.title:0 "Bệ Hạ Của Ta"
  host_dinner_events.1010.desc:0 "Khi dùng xong bữa ăn, ta không khỏi cảm thấy có một khoảng trống trong dạ dày nơi mà lẽ ra món tráng miệng phải ở đó. Có vẻ như [stop_host_scope.GetName] có thể đọc được suy nghĩ của ta, vì trước khi ta kịp phàn nàn, lão đã gọi người hầu mang ra những chiếc bánh 'đặc biệt' của lão.\n\n\"Chỉ những chiếc bánh cần sa thượng hạng nhất mới xứng với [visiting_liege.GetTitleAsNameNoTooltip|U] của ta!\" Lão nói khi một núi bánh được đặt lên đĩa của ta."
  host_dinner_events.1010.a:0 "Ta sẽ ăn hết!"
  host_dinner_events.1010.b:0 "Ta tuyệt đối không!"
  host_dinner_events.1011.title:0 "Khác Biệt Khẩu Vị"
  host_dinner_events.1011.desc.intro:0 "Khi [visiting_liege.GetName] vào chỗ ngồi cho một buổi tối với những món ăn [ROOT.Char.GetPrimaryTitle.GetAdjective] tuyệt hảo khác, ta không thể không nhận ra rằng ngài chắc hẳn đã bắt đầu ngán ngẩm món ăn của chúng ta rồi.\n\n\""
  host_dinner_events.1011.desc.vegetarian:0 "Chúng ta chỉ phục vụ những loại thực vật mà [ROOT.Char.GetFaith.CreatorName] ban cho và không bao giờ ăn thịt chim hay thú, nhưng tại [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] thì mọi chuyện lại khác. Ta có nên tạm gác niềm tin của mình để làm một chủ nhà hiếu khách hơn không? Có nên thêm thịt vào thực đơn?"
  host_dinner_events.1011.desc:0 "Chúng ta ăn thịt rất thoải mái, nhưng tại [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] điều đó hoàn toàn bị cấm. Cho đến giờ, [visiting_liege.GetName] vẫn ăn những gì được dọn ra nhưng luôn để thịt sang một bên, khiến bữa ăn của [visiting_liege.GetTitleAsNameNoTooltip|U] trở nên không trọn vẹn! Ta thật sự có thể để chuyện này tiếp diễn sao? Có lẽ tất cả chúng ta nên ăn chay khi [visiting_liege.GetTitleAsNameNoTooltip|U] còn ở đây."
  host_dinner_events.1011.a:0 "Điều này sẽ giúp ta được [visiting_liege.GetHerHis] quý mến."
  host_dinner_events.1011.b:0 "Ta chắc [visiting_liege.GetSheHe] sẽ không sớm quên ân huệ này..."
  host_dinner_events.1011.c:0 "Khi [visiting_liege.GetSheHe] ở đây, [visiting_liege.GetSheHe] sẽ ăn theo cách của chúng ta!"
  host_dinner_events.1020.title:0 "Một Chiếc Bánh Đáng Nhớ"
  host_dinner_events.1020.desc:0 "Một đêm nữa, một món tráng miệng nữa, và ta có thể thấy [visiting_liege.GetName] đã bắt đầu chán [ROOT.Char.Custom('GetExpensiveDessert')] của chúng ta. Có lẽ tối nay là lúc nên làm điều gì đó khác một chút.\n\nCó lẽ cách giải quyết vấn đề này là yêu cầu đầu bếp và thợ làm bánh chuẩn bị một món tráng miệng có hình dạng của thứ gì đó rất có ý nghĩa với vị quân chủ thân yêu của ta. Có thể là một pháo đài tượng trưng cho sức mạnh của [visiting_liege.GetHerHis], hoặc một thứ mà [visiting_liege.GetSheHe] sẽ không bao giờ ngờ tới..."
  host_dinner_events.1020.a:0 "Một pháo đài, dĩ nhiên!"
  host_dinner_events.1020.b:0 "Biểu tượng [visiting_liege.GetFaith.ReligiousSymbol] sẽ là hình dạng tuyệt vời!"
  host_dinner_events.1020.c:0 "Có lẽ là một bộ phận nào đó của cơ thể con người..."
  host_dinner_events.1020.d:0 "Đây là ý tưởng khủng khiếp."
  host_dinner_events.1021.title:0 "$host_dinner_events.1020.title$"
  host_dinner_events.1021.desc.intro:0 "Ta ngồi tại bàn tiệc chờ món tráng miệng, và khi nó cuối cùng được mang ra, ta gần như không thể kìm được sự phấn khích!\n\n"
  host_dinner_events.1021.desc.mid.castle:0 "Một chiếc bánh tuyệt đẹp hình pháo đài [ROOT.Char.GetCulture.GetName] được đặt trước mặt ta. Nó chân thực đến mức ta có thể tưởng tượng ra những kẻ xâm lược nhỏ bé bằng mật ong đang cố phá tường thành của món tráng miệng này."
  host_dinner_events.1021.desc.mid.religious:0 "Một chiếc bánh sùng đạo mang hình dáng [ROOT.Char.GetFaith.ReligiousSymbol] được đưa tới chỗ ta trên một chiếc đĩa chạm khắc tinh xảo. Món ăn được trang trí công phu đến mức cứ như thể chính [ROOT.Char.GetFaith.CreatorName] đã tạo ra nó chỉ dành riêng cho ta!"
  host_dinner_events.1021.desc.mid.lewd:0 "Ta không thể kìm nén nữa và bật cười không kiểm soát khi một cột bánh màu da thịt được đặt trước mặt. Nó có đủ loại chi tiết tục tĩu trên con quái vật khổng lồ này khiến ta chắc rằng ngay cả [ROOT.Char.GetFaith.DevilName] cũng phải đỏ mặt!"
  host_dinner_events.1021.desc.mid.lewd_woman:0 "Ta không thể kìm nén nữa và bật cười không kiểm soát khi hai khối bánh rung rinh được đặt trước mặt ta, phía trên là hai 'núm' trái cây. Món bánh này có đủ loại chi tiết tục tĩu khiến ta chắc rằng ngay cả [ROOT.Char.GetFaith.DevilName] cũng phải đỏ mặt!"
  host_dinner_events.1021.desc.outro:0 "\n\nDĩ nhiên ta rất thích nó, nhưng câu hỏi là ta nên bày tỏ sự cảm kích của mình như thế nào?"
  host_dinner_events.1021.a:0 "Ta sẽ nhớ chuyện này!"
  host_dinner_events.1021.b:0 ""Ta nợ ngươi một lần!""
  host_dinner_events.1022.title:0 "$host_dinner_events.1020.title$"
  host_dinner_events.1022.desc.intro:0 "Ta ngồi tại bàn tiệc chờ món tráng miệng, và khi nó cuối cùng được mang ra, ta gần như không thể kìm được cơn giận!\n\n"
  host_dinner_events.1022.desc.mid.castle:0 "Ta kinh hoàng khi thấy thứ đáng lẽ là chiếc bánh hình pháo đài [ROOT.Char.GetCulture.GetName] đang sụp xuống thảm hại dưới sức nặng của chính nó trên đĩa. Đây là sự sỉ nhục sức mạnh của ta sao?"
  host_dinner_events.1022.desc.mid.religious:0 "Ta sốc khi thấy thứ trông như chiếc bánh mang hình biểu tượng [ROOT.Char.GetFaith.ReligiousSymbol]! Màn trình diễn ẩm thực báng bổ này khiến ta buồn nôn đến mức khó lòng chạm vào."
  host_dinner_events.1022.desc.mid.lewd:0 "Thứ ta thấy là một khối màu da thịt ghê tởm trên đĩa, rõ ràng được làm thành hình một bộ phận tục tĩu của cơ thể. [stop_host_scope.GetName] nghĩ ta sẽ bị cám dỗ bởi thứ thô tục này sao?"
  host_dinner_events.1022.desc.outro:0 "\n\nChỉ nhìn thứ này thôi cũng khiến ta cảm thấy bị xúc phạm, nhưng nhìn ánh mắt ngây thơ như chó con của [stop_host_scope.GetFirstNamePossessiveNoTooltip], ta biết đây là nỗ lực nịnh bợ chân thành."
  host_dinner_events.1022.a:0 "Ôi, ta thích nó!"
  host_dinner_events.1020.likes_it:0 "[visiting_liege.GetFirstName] rất thích"
  host_dinner_events.1022.b:0 ""Ngươi dám sao!""
  host_dinner_events.1020.hates_it:0 "[visiting_liege.GetFirstName] ghét chiếc bánh"
  host_dinner_events.1030.title:0 "Vị Khách Không Mời"
  host_dinner_events.1030.desc:0 "Một bữa tối khác đã được chuẩn bị cho lãnh chúa của ta trong thời gian [visiting_liege.GetHerHis] lưu lại và trông thật tuyệt vời! [visiting_liege.GetName] dường như đã chảy nước miếng chỉ khi nhìn thấy nó, và ngay khi [visiting_liege.GetSheHe] sắp cắn miếng đầu tiên, [rival_scope.Custom2('NamePossessiveCharacterIntroduction', visiting_liege)] xông thẳng vào đại sảnh ăn uống và nghênh ngang tiến tới đĩa của kẻ thù [rival_scope.GetHerHis].\n\n"Thật là một bữa tiệc thịnh soạn! Đáng tiếc thay nó lại bị lãng phí cho cái lưỡi thối rữa của một [visiting_liege.GetTitleAsNameNoTooltip] đê tiện như thế này!"\n\nTâm trạng của [visiting_liege.GetNamePossessiveNoTooltip] lập tức trở nên tồi tệ, và nếu ta không làm gì thì bữa tối của ta có lẽ sẽ sớm biến thành một trận ẩu đả."
  host_dinner_events.1030.a:0 ""Lính đâu! Lôi tên ngu ngốc này ra ngay!""
  host_dinner_events.1030.b:0 "Có lẽ ta có thể loại hắn đi để đổi lấy chút lợi thế."
  host_dinner_events.1030.c:0 "[rival_scope.GetFirstNameNoTooltip] thật hài hước! Chúng ta nên trò chuyện!"
  host_dinner_events.1031.title:0 "$host_dinner_events.1030.title$"
  host_dinner_events.1031.desc.intro:0 "Một bữa tối khác đã được chuẩn bị cho ta trong thời gian ta lưu lại đây và trông thật tuyệt vời! Ta chảy nước miếng chỉ khi nhìn vào món ăn nóng hổi hấp dẫn này, và ngay khi ta sắp cắn miếng đầu tiên thì một giọng nói quen thuộc khó chịu xuyên thẳng vào tai ta.\n\n[rival_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đến để phá hỏng bữa ăn của ta, và chỉ riêng sự hiện diện của [rival_scope.GetHerHis] đã khiến máu ta sôi lên."
  host_dinner_events.1031.desc:0 "\n\n[stop_host_scope.GetName] đã đề nghị loại bỏ tên [rival_scope.Custom2('InsultNoun', ROOT.Char)] phiền phức này, nhưng ta cảm thấy [stop_host_scope.GetSheHe] có động cơ thầm kín."
  host_dinner_events.1031.a:0 "Được, được, gì cũng được!"
  host_dinner_events.1031.b:0 "Ta đã chịu đựng những thứ tệ hơn."
  host_dinner_events.1030.liege_refuses:0 "[visiting_liege.GetFirstName] từ chối cái móc câu"
  host_dinner_events.1032.title:0 "$host_dinner_events.1030.title$"
  host_dinner_events.1032.desc:0 "\n\nĐiều khiến mọi chuyện tệ hơn là [stop_host_scope.GetName] dường như còn hả hê trước sự khốn khổ của ta và thậm chí đã bắt đầu cười đùa với một kẻ thù không đội trời chung của vương quyền!"
  host_dinner_events.1032.a:0 "[stop_host_scope.GetFirstNameNoTooltip] đang chơi một trò nguy hiểm."
  host_dinner_events.1032.b:0 "Ta phải nhẫn nhịn."
  host_dinner_events.3010.title:0 "Một Hương Vị Xa Lạ"
  host_dinner_events.3010.desc:1 "Đó là một buổi tối khác trong thời gian ta lưu lại tại nhà của [stop_host_scope.GetNamePossessive] và thêm một món ăn ngoại quốc nữa được đặt trước mặt ta. Ta khẽ gõ nó bằng con dao, nhìn thứ nước sốt đen xa lạ trượt quanh như bùn lỏng.\n\nÔi, ta sẵn sàng đánh đổi biết bao để có chút đồ ăn từ kinh đô, chỉ cần một ít [ROOT.Char.Custom('GetExpensiveDessert')] đơn giản cũng được. Dĩ nhiên ta có thể yêu cầu [stop_host_scope.GetTitledFirstNameNoTooltip] mang thứ gì đó từ quê nhà, nhưng ta có nguy cơ khiến họ phật ý."
  host_dinner_events.3010.a:0 "Ta cứ hỏi vậy."
  host_dinner_events.3010.b:0 "Thức ăn địa phương chắc cũng ổn."
  host_dinner_events.3011.title:0 "$host_dinner_events.3010.title$"
  host_dinner_events.3011.desc:1 "Ta thực sự đã làm rất tốt với bữa ăn này! Đầu bếp của ta đã chuẩn bị cả một loạt món ăn hấp dẫn, vậy mà [visiting_liege.GetName] lại tỏ ra miễn cưỡng không muốn đụng tới.\n\n"Thức ăn này không hợp khẩu vị của ta. Ngươi có thể mang cho ta một ít [ROOT.Char.Custom('GetExpensiveDessert')] được không? Ôi, ta nhớ cái vị ngọt của chúng trên đầu lưỡi biết bao."\n\nĐiều này hơi xúc phạm, nhưng một cử chỉ như thế này chắc chắn sẽ không sớm bị quên lãng..."
  host_dinner_events.3011.a:0 "Dĩ nhiên rồi!"
  host_dinner_events.3011.gave_local_food:0 "[stop_host_scope.GetName] đã đồng ý"
  host_dinner_events.3011.b:0 "Đây là một sự sỉ nhục!"
  host_dinner_events.3011.refused_local_food:0 "[stop_host_scope.GetName] đã bị xúc phạm"
  host_dinner_events.3020.title:0 "Cuộc Thi"
  host_dinner_events.3020.desc:0 "Đó là một buổi tối dài đầy tiệc tùng và vui vẻ, và không ít ly [stop_host_scope.Custom('RegionalAlcoholicDrink')] đã được chia sẻ giữa ta và chủ nhà tốt bụng của ta, [stop_host_scope.GetName].\n\nTuy nhiên có vẻ như [stop_host_scope.GetTitledFirstNameNoTooltip] đang cố uống nhiều hơn ta, luôn rót ly của [stop_host_scope.GetHerHis] cao hơn một chút so với ly của ta. Đây là một lời thách thức ngầm sao? Có lẽ ta nên đặt chút cược."
  host_dinner_events.3020.a:0 "Ngươi đánh giá thấp bản lĩnh của ta!"
  host_dinner_events.3020.b:0 "Đừng thử."
  host_dinner_events.3021.title:0 "$host_dinner_events.3020.title$"
  host_dinner_events.3021.desc:0 "Đó là một buổi tối dài đầy tiệc tùng và vui vẻ, và không ít ly [stop_host_scope.Custom('RegionalAlcoholicDrink')] đã được chia sẻ giữa ta và lãnh chúa của ta, [visiting_liege.GetName].\n\nTuy nhiên có vẻ như ta đã uống hơi nhiều và [visiting_liege.GetTitledFirstNameNoTooltip] dường như coi đó là một lời thách thức!\n\n"Vậy sao, ngươi nghĩ mình có thể uống hơn một [visiting_liege.GetTitleAsNameNoTooltip|U]? Sao không thử xem? Ai thắng sẽ được... à, ta sẽ nghĩ ra phần thưởng thích hợp sau, được chứ?""
  host_dinner_events.3021.a:0 "Làm luôn!"
  host_dinner_events.3021.b:0 "Ta thật sự nên dừng lại."
  host_dinner_events.3020.refused_to_drink:0 "[stop_host_scope.GetName] từ chối thử thách"
  host_dinner_events.3030.title:0 "Một Học Trò"
  host_dinner_events.3030.desc:0 "Tối nay ta được sắp chỗ ngồi cạnh [promising_child.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] và đứa trẻ này thật sự rất đáng mến. Càng nói chuyện với [promising_child.GetHerHim], ta càng thấy tiềm năng để [promising_child.GetHerHim] được uốn nắn theo hình mẫu của ta.\n\nTa cảm thấy thôi thúc muốn đưa [promising_child.GetHerHim] về nhà làm học trò của mình, nhưng ta không thể làm vậy nếu không có sự đồng ý của [promising_child.GetHerHis] [stop_host_scope.GetMotherFather], và [stop_host_scope.GetSheHe] có thể sẽ yêu cầu điều gì đó đổi lại."
  host_dinner_events.3030.a:0 "Ta phải hỏi."
  host_dinner_events.3030.b:0 "Ta không có thời gian."
  host_dinner_events.3031.title:0 "[promising_child.GetFirstNameNoTooltip]: Học Trò của [visiting_liege.GetTitleAsNamePossessiveNoTooltip]"
  host_dinner_events.3031.desc:0 "Có vẻ như [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] đã dành cảm tình cho [promising_child.Custom2('MyCharacterIntroduction', ROOT.Char)]. Cả hai đã trò chuyện suốt cả buổi tối một cách tự nhiên như thể họ là [visiting_liege.GetMotherFather] và [promising_child.Custom('GetDaughterSon')] vậy!\n\n[visiting_liege.GetNameNoTooltip] tiến lại gần ta với nụ cười lớn trên khuôn mặt [visiting_liege.GetHerHis]. "Đứa [promising_child.Custom('GirlBoy')] đó thật tuyệt vời! Ta chỉ mong có thể đưa [promising_child.GetHerHim] về kinh đô và nuôi dạy [promising_child.GetHerHim] ở đó. Một tài năng trẻ như vậy không nên chỉ quanh quẩn ở [ROOT.Char.GetCurrentLocation.GetName], ngươi thấy đúng không?""
  host_dinner_events.3031.a:0 "Ngươi nói đúng."
  host_dinner_events.3031.b:0 "Sai rồi!"
  host_dinner_events.3030.refused_to_allow_ward:1 "[stop_host_scope.GetFirstName] cấm [promising_child.GetFirstName] rời đi"
  host_dinner_events.3040.title:0 "Ai Ăn Hết Bánh Ngọt?"
  host_dinner_events.3040.desc:0 "Thức ăn lại được bày chất cao tối nay, đúng như ta mong đợi. Tuy nhiên, những chiếc bánh ngọt nhỏ mà ta đã bắt đầu yêu thích lại dường như biến mất. Ta quay sang [stop_host_scope.GetNameNoTooltip] với vẻ mặt khó hiểu.\n\n"Ta biết ngài mong chờ thêm bánh ngọt, thưa [visiting_liege.GetTitleAsNameNoTooltip|U], nhưng đầu bếp nói rằng tất cả đều biến mất ngay trước khi được mang ra phục vụ. Chúng tôi đã cố bắt kẻ trộm, nhưng tên tham ăn đó quá khó lần ra.""
  host_dinner_events.3040.a:0 "Không quá khó với ta!"
  host_dinner_events.3040.didnt_solve_mystery:0 "Ngươi đã không tìm ra chúng"
  host_dinner_events.3040.b:0 "Thật đáng tiếc."
  host_dinner_events.3040.disappointed_in_vassal:0 "Ta không giận, chỉ thất vọng"
  host_dinner_events.3041.title.deviant:0 "Bánh Pie kiểu [pie_eater_scope.GetCulture.GetNameNoTooltip]"
  host_dinner_events.3041.title:0 "[pie_eater_scope.GetFirstNameNoTooltip] Đã Ăn Hết Bánh!"
  host_dinner_events.3041.desc.deviant:0 "Ta lần theo dấu vết của những mảnh vụn và vệt dầu mỡ, nước sốt dọc theo hành lang cho đến khi tìm thấy kẻ thủ ác; nhưng ta không nghĩ bất cứ điều gì có thể chuẩn bị cho ta trước những gì ta sắp chứng kiến.\n\nTa bắt gặp [pie_eater_scope.GetName] trong tình trạng hoàn toàn trần trụi với tấm lưng quay về phía ta, và khi ta bước vào, lão xoay người lại nhìn ta, để lộ cả khay bánh xếp cao ngang hông, một chiếc bánh duy nhất vẫn còn đang che đậy sự khiêm nhường của lão.\n\n\"Ôi! Ta... ừm... không như ngài thấy đâu, [visiting_liege.GetTitleAsNameNoTooltip|U] của ta! Cầu xin ngài đừng nói với bất cứ ai về chuyện này!\""
  host_dinner_events.3041.desc:0 "Ta lần theo dấu vụn bánh cùng những vết nước sốt và mỡ dọc hành lang cho tới khi cuối cùng tìm ra thủ phạm!\n\nTa bước vào một phòng ngủ và thấy [pie_eater_scope.GetName] ngồi một mình với cả đống bánh ngọt ở bên cạnh [pie_eater_scope.GetHerHis].\n\n"Oh! Thưa [visiting_liege.GetTitleAsNameNoTooltip|U], dĩ nhiên là ta định mang bánh đến cho ngài, nhưng ngài thấy đấy... đến lượt ta ăn thì chúng luôn hết mất rồi nên ta nghĩ sẽ lén ăn một hai cái trước. Xin đừng kể cho ai chuyện này!""
  host_dinner_events.3041.a:0 "Ta sẽ bỏ qua, đổi lấy một ân huệ."
  host_dinner_events.3041.b:0 "Một bí mật giữa ngươi và ta."
  host_dinner_events.3041.c:0 "Ta sẽ không nói với ai."
  host_dinner_events.3041.d:0 "Ha! Ngươi bị lộ rồi, đồ [pie_eater_scope.Custom2('InsultAdjective', ROOT.Char)] [pie_eater_scope.Custom2('InsultNoun', ROOT.Char)]."
  host_dinner_events.3041.e:0 "Ta thử một cái được không?"
  host_dinner_events.3041.f:0 "Chúng ta cùng ăn!"
  host_dinner_events.3050.title:0 "Không Có Khẩu Vị"
  host_dinner_events.3050.desc:0 "Bữa ăn tối nay thật tuyệt vời nhưng khi các đầu bếp tiếp tục chất đầy thức ăn, ta nhận ra [non_eater_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] hầu như không đụng đến chút ít mà [non_eater_scope.GetSheHe] đặt lên đĩa của [non_eater_scope.GetHerHis].\n\nDù việc không có khẩu vị cũng không sao vào lúc khác, [stop_host_scope.GetName] dường như đang cảm thấy bị xúc phạm khi một thành viên trong đoàn tùy tùng của ta chỉ khều khều món ăn của họ."
  host_dinner_events.3050.a:0 ""Ăn gì đó đi vì [ROOT.Char.GetFaith.HighGodNamePossessive] đi!""
  host_dinner_events.3050.convinced_to_eat:0 "Ngươi đã thuyết phục [non_eater_scope.GetHerHim] ăn"
  host_dinner_events.3050.annoyed_courtier:0 "Ngươi đã làm [non_eater_scope.GetHerHim] khó chịu"
  host_dinner_events.3050.b:0 "Ta sẽ tìm cớ cho [non_eater_scope.GetHerHim]."
  host_dinner_events.3060.title:0 "Món Ngon Tuyệt Hảo"
  host_dinner_events.3060.desc:0 "Quả thật bữa ăn tối nay là một niềm vui. Ta đã thưởng thức đủ loại món ăn mặn và ngọt, nhưng chẳng có gì khiến ta say mê như những chiếc [stop_host_scope.Custom('GetExpensiveDessert')] tuyệt hảo này!\n\nDù ta ăn bao nhiêu, dù ta tận hưởng hương vị của chúng đến mức nào, vẫn không đủ để khiến chúng rời khỏi tâm trí ta. Ta thấy mình dần chìm đắm trong từng miếng ăn, hương vị bùng nổ trong miệng, đưa ta tiến gần hơn một bước tới việc trải nghiệm [ROOT.Char.GetFaith.PositiveAfterLife].\n\nDù bụng ta đã căng chặt và quần áo bắt đầu chật lại, ta vẫn cảm thấy thôi thúc phải với thêm."
  host_dinner_events.3060.a:0 "Ngon thế này sao có thể không ăn!"
  host_dinner_events.3060.satisfying_dessert:0 "Ngươi đã thỏa mãn"
  host_dinner_events.3060.too_much_dessert:0 "Ngươi đã ăn quá nhiều"
  host_dinner_events.3060.b:0 "Không, ta phải dừng lại."
  host_dinner_events.3061.title:0 "Trái Tim Phản Bội"
  host_dinner_events.3061.desc:0 "Ta ăn nốt phần cuối của bữa tối và thực sự đã ăn no. Ta đi ngủ trong trạng thái hài lòng, dù có hơi khó chịu.\n\nNhưng khi nằm đó, ta cảm thấy vị ngọt lan tới tim mình và #EMP thump!#! mạnh hơn một chút. Cường độ tăng lên theo từng nhịp đập, mạnh hơn và nhanh hơn. Ta cảm thấy tim mình sắp vỡ tung khỏi lồng ngực. Một lớp mồ hôi lạnh phủ khắp cơ thể, cổ họng khô khốc và hơi thở trở nên nông và gấp gáp như một con [ROOT.Char.Custom('GetAnimalType')] bị dồn vào góc.\n\nRồi đột nhiên, mọi thứ dừng lại."
  host_dinner_events.3061.a:0 "Chắc hẳn là có độc!"
  host_dinner_events.3070.title:0 "Câu Chuyện Cho [potential_friend_scope.GetFirstNameNoTooltip]"
  host_dinner_events.3070.desc:0 "Một buổi tối vui vẻ khác dần khép lại, và ta nhận ra mình đang say sưa trò chuyện với [potential_friend_scope.GetName] giữa bao người.\n\nTrước khi ta kịp nhận ra, cả căn phòng đã im lặng ngoại trừ cuộc trò chuyện của chúng ta và mọi người đều chờ đợi lời tiếp theo từ ta. Dù có hơi ngượng ngùng, ta chắc chắn có thể kể một câu chuyện khiến tất cả ở đây thích thú!"
  host_dinner_events.3070.a:0 "Một câu chuyện bi kịch."
  host_dinner_events.3070.boring_story:0 "Câu chuyện của ngươi thật nhàm chán"
  host_dinner_events.3070.b:0 "Một câu chuyện nhẹ nhàng!"
  everyone_at_the_dinner:0 "Mọi nhân vật tại bữa tiệc"
  host_dinner_events.3070.story_was_impressive:0 "Câu chuyện của ngươi thật ấn tượng"
  host_dinner_events.3080.title:0 "Bị Nghẹn!"
  host_dinner_events.3080.desc:0 "Mọi người đang vui vẻ trong bữa tối và ta lại kể thêm một trong những câu chuyện cười huyền thoại của mình, khiến mọi người cười vang và vỗ tay... rồi ho sặc.\n\nTa nhìn quanh và thấy [choking_character_scope.GetName] đang bóp chặt cổ họng [choking_character_scope.GetHerHis] và ho dữ dội, mặt đỏ bừng. Có vẻ trò đùa của ta hơi quá sức với [choking_character_scope.GetHerHim]!\n\nDĩ nhiên ta có thể lao tới cứu giúp, nhưng đó có thực sự là việc của ta không?"
  host_dinner_events.3080.a:0 "Ta có thể cứu [choking_character_scope.GetHerHim]!"
  host_dinner_events.3080.failed_to_save_them:0 "Ngươi đã không cứu được [choking_character_scope.GetFirstName]"
  host_dinner_events.3080.b:0 "Chuyện này thật sự không phải việc của ta."
  host_dinner_events.3081.title:0 "Một Mạng Sống Được Cứu"
  host_dinner_events.3081.desc:0 "Ta đứng dậy và vỗ mạnh vào lưng [choking_character_scope.GetName] hết lần này tới lần khác, và khi [choking_character_scope.GetSheHe] bắt đầu tím tái mặt mày, một cục thức ăn từng là món cao lương mỹ vị bắn ra và rơi tõm vào chén nước sốt thảo mộc đắt tiền.\n\n"Oh cảm ơn ngài! Hôm nay ngài đã cứu một mạng người, thưa [visiting_liege.GetTitleAsNameNoTooltip|U]! Ta sẽ mãi mãi mang ơn ngài.""
  host_dinner_events.3081.a:0 ""Ngươi không nợ ta gì ngoài tình bạn.""
  host_dinner_events.3081.b:0 ""Đúng vậy, ngươi nợ ta mạng sống của mình.""
  host_dinner_events.1040.title:0 "Những Trò Chơi Buồn Chán"
  host_dinner_events.1040.desc:0 "Những bữa tiệc cứ diễn ra mỗi đêm kể từ khi [visiting_liege.GetName] đến, và mỗi buổi tối sau khi đã ăn no nê, ngài lại biến mất về phòng, để ta lại một mình với những suy tư.\n\nDạo gần đây, ta cứ cảm thấy thôi thúc muốn lôi bộ cờ vua cũ ra và làm một ván cược với [visiting_liege.GetTitleAsNameNoTooltip|U] của ta. Phần thưởng chính xác là gì thì ta vẫn chưa quyết định, nhưng ta chắc rằng chúng ta có thể nghĩ ra điều gì đó."
  host_dinner_events.1040.a:0 "Chơi thôi!"
  host_dinner_events.1040.b:0 "Thôi vậy."
  host_dinner_events.1041.title:0 "Thử Thách"
  host_dinner_events.1041.desc:0 "Khi ta vừa ăn xong, một chiếc bàn khác được đặt xuống trước mặt ta, nhưng lần này thay vì thức ăn, trên đó là những quân cờ nhỏ.\n\n"Lãnh chúa của ta, hẳn ngài biết ta nổi danh là một trong những kỳ thủ cờ giỏi nhất của [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]! Nhưng ta không muốn chỉ chơi cho vui, có lẽ chúng ta có thể khiến ván cờ thú vị hơn bằng cách đặt cược một chút..."\n\n[stop_host_scope.GetName] nhe răng cười với ta, lơ đãng xoay một quân cờ giữa các ngón tay [stop_host_scope.GetHerHis], háo hức chờ một trận đấu."
  host_dinner_events.1041.a:0 "Đến lượt ta đi rồi, [stop_host_scope.GetFirstNameNoTooltip]."
  host_dinner_events.1041.b:0 "Ta sẽ không phá hỏng buổi tối của mình vì trò này."
  host_dinner_events.1042.title:0 "Ân Huệ"
  host_dinner_events.1042.desc:1 "Khi quân vua đổ xuống, người chiến thắng đã được xác định.\n\nTa đã giành được một ân huệ từ [bg_loser.GetName] và phần thưởng chưa định của ta giờ có thể được chọn bất cứ lúc nào."
  host_dinner_events.1042.desc.loser:0 "Khi quân vua đổ xuống, người chiến thắng đã được xác định.\n\nTa đã bị [bg_victor.GetName] đánh bại hoàn toàn, và phần thưởng chưa định của [bg_victor.GetHerHis] giờ có thể được chọn bất cứ lúc nào."
  host_dinner_events.1042.a:0 "Tuyệt vời."
  host_dinner_events.1042.a.bad:0 "Chết tiệt!"
  host_dinner_events.1050.title:0 "Kho Lương Trống Rỗng"
  host_dinner_events.1050.desc:0 "Các đầu bếp của ta đã báo rằng kho lương thực dường như đang cạn kiệt và nhiều nguyên liệu đắt đỏ cùng ngoại lai của ta từ lâu đã dùng hết.\n\nSẽ tốn cả một gia tài nhỏ để bổ sung lại kho lương, và tim ta khẽ run lên lo lắng chỉ khi nghĩ đến việc phải mua bánh mì và bơ. [visiting_liege.GetName] có thể sẽ thất vọng trước bữa ăn đạm bạc tối nay, nhưng ta có đủ khả năng làm gì hơn sao?"
  host_dinner_events.1050.a:0 "Bánh mì và nước vậy."
  host_dinner_events.1050.b:0 "Chúng ta có thể chi tốt hơn."
  host_dinner_events.1050.c:0 "Ta có vài mối quan hệ có thể dùng!"
  host_dinner_events.3090.title:0 "Chiếc Sọ"
  host_dinner_events.3090.desc:0 "Ta đã vui vẻ nơi đây, nhưng ta không thể để mình xao nhãng khỏi mục tiêu trở thành một [ROOT.Char.GetTitleAsNameNoTooltip|U] đáng sợ và được kính trọng!\n\nNgục tối của [stop_host_scope.GetNamePossessive] đầy rẫy tội phạm và kẻ phản bội, và chúng chỉ đang hút cạn ngân khố vương miện bằng nhu cầu ăn uống không ngừng của mình. Có lẽ ta có thể giúp chủ nhà hào phóng của ta một việc và đồng thời gieo rắc nỗi sợ trong tim [stop_host_scope.GetHerHis] bằng cách xử tử một tù nhân rồi uống [stop_host_scope.Custom('RegionalAlcoholicDrink')] từ chiếc sọ rỗng của hắn."
  host_dinner_events.3090.a:0 "Ý tưởng tuyệt vời."
  host_dinner_events.3090.skobletted_my_prisoner:0 "[visiting_liege.GetName] đã khoét rỗng sọ của [skoblet_target.GetFirstNamePossessive] thành một chiếc cốc"
  host_dinner_events.3090.b:0 "Thật ghê tởm."
  host_dinner_events.3100.title:0 "Sự Xa Hoa Đáng Ngờ"
  host_dinner_events.3100.desc:0 "Ta đã tận hưởng thời gian ở đây, nhưng ta không thể không nhận ra rằng mỗi ngày ta đều được chiêu đãi xa hoa. Có lẽ [stop_host_scope.GetName] giàu có hơn đáng kể so với những gì ta tưởng ban đầu.\n\nNếu suy đoán của ta là đúng, điều đó có nghĩa [stop_host_scope.GetTitleAsNameNoTooltip|U] nợ ta nhiều vàng hơn số mà [stop_host_scope.GetSheHe] đã nộp cho đến nay, và ta có thể yêu cầu truy thu."
  host_dinner_events.3100.a:0 "Các khoản truy thu phải được thanh toán."
  host_dinner_events.3100.b:0 "[stop_host_scope.GetSheHe|U] phải nộp nhiều hơn trong tương lai."
  host_dinner_events.3100.c:0 "Ta sẽ bỏ qua chuyện này."
  host_dinner_events.3101.title:0 "Sự Xa Hoa Bị Đánh Thuế"
  host_dinner_events.3101.desc.intro:0 "Ta đã là một chủ nhà vô cùng tuyệt vời đối với lãnh chúa của mình, cho [visiting_liege.GetHerHim] mọi thứ mà [visiting_liege.GetSheHe] có thể mong muốn và chỉ phục vụ những món ăn hảo hạng nhất trong kho của ta.\n\nTuy nhiên có vẻ như đây là một sai lầm khi [visiting_liege.GetSheHe] giờ tin rằng sự hiếu khách vượt trội của ta là do trốn thuế!"
  host_dinner_events.3101.desc:0 "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetSheHe|U] đang yêu cầu ta phải trả ngay một khoản tiền gộp cho "những gì ta nợ"."
  host_dinner_events.3101.a:0 "Được thôi."
  host_dinner_events.3101.b:0 "Thật vô lý!"
  host_dinner_events.3102.title:0 "$host_dinner_events.3101.title$"
  host_dinner_events.3102.desc:0 "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetName] giờ yêu cầu tăng thuế của ta từ nay về sau!"
  host_dinner_events.3102.a:0 "Ta chấp nhận."
  host_dinner_events.3102.b:0 "Đi xuống [ROOT.Char.GetFaith.NegativeAfterLife] đi!"
  host_dinner_events.3110.title:0 "Kẻ Lữ Hành Tài Năng"
  host_dinner_events.3110.desc.intro:0 "Có vẻ ta không phải vị khách danh dự duy nhất tại triều đình của [stop_host_scope.GetNamePossessive]! Tối nay ta được ngồi cạnh [talented_pool_character.GetName] đầy thú vị, và cuộc trò chuyện của chúng ta khiến ta vô cùng phấn chấn.\n\n"
  host_dinner_events.3110.desc.mid.claim:0 ""Than ôi, ta đáng lẽ cũng nên thuộc về tầng lớp có đất đai, thưa [visiting_liege.GetTitleAsNameNoTooltip|U]. Nếu thế giới công bằng, quyền thừa kế chính đáng của ta đã được công nhận và ta cũng sẽ có một đại sảnh tiệc lớn để chiêu đãi ngài.""
  host_dinner_events.3110.desc.mid.martial:0 ""Kỹ năng chiến trận của ta đã thành truyền kỳ, thưa [visiting_liege.GetTitleAsNameNoTooltip|U]. Nếu ngài chấp nhận ta, ta sẵn lòng đem những kỹ năng đó phục vụ ngài!""
  host_dinner_events.3110.desc.mid.learning:0 ""Không ai hiểu thế giới và [talented_pool_character.GetFaith.ReligiousText] như ta, thưa [visiting_liege.GetTitleAsNameNoTooltip|U] hào hiệp. Nếu ngài nhận ta, ta rất vinh dự được dâng tài năng của mình cho triều đình của ngài.""
  host_dinner_events.3110.desc.mid.statecraft:0 ""Ta rất thông thạo việc trị quốc, nhưng tài năng của ta đang bị lãng phí khi phải lang thang từ nơi này sang nơi khác. Nếu ngài cho ta chỗ tại triều đình của mình, ta sẽ vinh dự gọi ngài là [visiting_liege.GetTitleAsNameNoTooltip|U].""
  host_dinner_events.3110.desc.outro:0 "\n\nHiếm khi gặp được một người thú vị như vậy mà lại không có nơi chốn riêng, nhưng triều đình của ta liệu có chỗ cho [talented_pool_character.GetHerHim] không?"
  host_dinner_events.3110.a:0 "Dĩ nhiên là có!"
  host_dinner_events.3110.b:0 "Cút đi."
  host_dinner_if_vassal_accepts_tt:0 "Nếu chư hầu của ngươi chấp nhận"
  tour_grounds_if_vassal_rejects_tt:0 "Nếu chư hầu của ngươi không chấp nhận"
  host_dinner_events.3100.vassal_accepts:0 "[stop_host_scope.GetFirstName] chấp nhận"
  host_dinner_events.3100.vassal_refuses:0 "[stop_host_scope.GetFirstName] từ chối"
  host_dinner_events.1009.enjoyed_weed:0 "[visiting_liege.GetFirstName] thích hashish"
  host_dinner_events.1009.didnt_enjoy_weed: "[visiting_liege.GetFirstName] không thích hashish"
  host_dinner_events.3020.won_drinking_duel:0 "Ngươi đã thắng cuộc thi uống rượu"
  host_dinner_events.3020.lost_drinking_duel:0 "Ngươi đã thua cuộc thi uống rượu"
  host_dinner_events.1007.enjoyed_performance:1 "[visiting_liege.GetFirstName] thích màn biểu diễn"
  host_dinner_events.1007.disliked_performance:0 "[visiting_liege.GetFirstName] không thích màn biểu diễn"
  host_dinner_events.1060.title:0 "Khẩu Vị Mạnh Mẽ"
  host_dinner_events.1060.desc.intro:0 "Ta được báo rằng gần đây một trong những chiến binh vĩ đại nhất trong đoàn tùy tùng của ta đã qua đời, nhưng thi thể của [dead_soldier.GetHerHis] vẫn hoàn hảo, không hề bị tổn thương hay bệnh tật.\n\n"
  host_dinner_events.1060.desc.cannibal_legal:0 "Dĩ nhiên, với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip|U] mà [dead_soldier.GetSheHe] đã chiến đấu và chết vì ta, ta có quyền ăn trái tim của [dead_soldier.GetHerHis] và đạt được tinh thần chiến binh của [dead_soldier.GetHerHis],"
  host_dinner_events.1060.desc.secret_cannibal:1 "Dù xu hướng ăn thịt người của ta vẫn chưa bị thế gian biết tới, vài người hầu trung thành đã lấy trái tim của [dead_soldier.GetHerHis] cho ta dùng,"
  host_dinner_events.1060.desc.outro:0 "nhưng vì [visiting_liege.GetTitleAsNameNoTooltip|U] của ta đang ghé thăm, có lẽ ta nên trao cho [visiting_liege.GetHerHim] vinh dự được ăn trái tim của một trong những chiến binh ưu tú nhất của [ROOT.Char.GetPrimaryTitle.GetAdjective]!"
  host_dinner_events.1060.a:0 "Một trái tim xứng đáng với [visiting_liege.GetTitleAsNameNoTooltip|U]!"
  host_dinner_events.1060.b:0 "Ta sẽ tự ăn trái tim này."
  you_ate_a_human_heart:0 "Ngươi đã ăn trái tim người"
  host_dinner_events.1061.title:0 "$host_dinner_events.1060.title$"
  host_dinner_events.1061.desc.intro:0 "Món ăn tiếp theo của ta được mang ra. Trên một chiếc đĩa đẹp là một trái tim được nướng chậm, nằm trong vũng sốt máu.\n\n"Trái tim của một chiến binh vĩ đại, thưa [visiting_liege.GetTitleAsNameNoTooltip|U]! Ăn nó đi, và ngài cũng sẽ sở hữu lòng dũng cảm và tinh thần mà [dead_soldier.GetSheHe] từng có."\n\n"
  host_dinner_events.1061.desc.cannibal_legal:1 "Nó trông hoàn hảo tuyệt đối, được nấu chín hoàn mỹ và mềm đến mức ta thậm chí không cần dùng dao."
  host_dinner_events.1061.desc.secret_cannibal:0 "Ta không còn lựa chọn nào ngoài việc giả vờ sốc và khó chịu khi nhìn thấy nó. Chẳng lẽ [stop_host_scope.GetName] somehow biết bí mật của ta?"
  host_dinner_events.1061.desc.mid:0 "Ta gần như buồn nôn khi nhìn thấy thứ đó! Chẳng lẽ [stop_host_scope.GetName] muốn nói rằng đây là #EMP thịt người!#!"
  host_dinner_events.1061.desc.outro:0 "Chủ nhà nhìn ta đầy mong đợi và nhẹ nhàng đẩy chiếc đĩa lại gần ta hơn."
  host_dinner_events.1061.a:0 "Ngon tuyệt!"
  host_dinner_events.1061.b:0 "Không, vậy là được rồi."
  host_dinner_events.1061.liege_ate_heart:0 "[visiting_liege.GetFirstName] đã ăn trái tim"
  host_dinner_events.1061.liege_refused_heart:0 "[visiting_liege.GetName] từ chối"
  host_dinner_events.1070.title:0 "Tiềm Năng Bị Lãng Phí"
  host_dinner_events.1070.desc:0 "Ta không nghĩ nhiều khi sắp xếp cho [runaway_courtier.GetName] ngồi cạnh ta tối nay, nhưng khi các món ăn được mang ra rồi dọn đi, ta thấy mình ngày càng bị cuốn hút bởi [runaway_courtier.GetWomanMan] tuyệt vời này.\n\n"Oh, giá mà cuộc sống ở kinh đô cũng thú vị như thế này. Hầu hết các ngày ta chỉ nằm dài trong triều đình, trở nên mệt mỏi và lười biếng. Ở đây ta không hề thiếu những cuộc trò chuyện thú vị. Ngài có chào đón ta làm cận thần của mình không?""
  host_dinner_events.1070.a:0 ""Dĩ nhiên, hãy đi cùng ta!""
  host_dinner_events.1070.b:0 ""Không.""
  host_dinner_events.1071.title:0 "Trao Đổi Triều Thần"
  host_dinner_events.1071.desc:1 "[runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã tiếp cận ta và khẳng định rằng lão đã nhận được sự cho phép của [stop_host_scope.GetNamePossessive] để tới gia nhập triều đình của lão thay vì triều đình của ta.\n\nĐể chuyện này trôi qua chắc chắn sẽ cải thiện vị thế của ta với tên [stop_host_scope.GetTitleAsNameNoTooltip|U] kia, nhưng liệu sự sỉ nhục khi bị cướp mất các thành viên trong triều đình có phải là điều ta thực sự có thể bỏ qua?"
  host_dinner_events.1071.a:0 ""[runaway_courtier.GetNameNoTooltip] là người của ta!""
  host_dinner_events.1071.refused_to_let_them_go:0 "[visiting_liege.GetName] đã từ chối để [runaway_courtier.GetName] rời đi"
  host_dinner_events.1071.b:0 ""Hãy đi nơi trái tim ngươi muốn.""
  host_dinner_events.1080.title:0 "Màn Biểu Diễn Độc Ác"
  host_dinner_events.1080.desc:0 "Không phải bí mật rằng ta coi [visiting_liege.GetName] là một [visiting_liege.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)], vậy mà tên ngu đó vẫn tới xúc phạm đại sảnh của ta. Ta rất ghét phải ở gần [visiting_liege.GetHerHis] khi [visiting_liege.GetSheHe] ném thức ăn của ta vào cổ họng [visiting_liege.GetHerHis], nhưng rồi một ý tưởng lóe lên.\n\nTa có thể khiến chuyến thăm của [visiting_liege.GetHerHis] trở thành thứ đáng nhớ nếu ta dựng nên một màn kịch về sự độc ác của [visiting_liege.GetHerHis]!"
  host_dinner_events.1080.a:0 "[visiting_liege.GetSheHe|U] xứng đáng với điều đó."
  host_dinner_events.1080.b:0 "Ta không hạ mình như vậy."
  host_dinner_events.1081.title:1 "[ROOT.Char.GetFirstNameNoTooltip]: Kẻ Phản Diện của [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  host_dinner_events.1081.desc:0 "Như thường lệ, bữa ăn của ta đi kèm với giải trí. Các diễn viên biểu diễn những màn nhào lộn và kỹ năng tuyệt vời, nhưng rồi ta bắt đầu nhận ra điều gì đó. Trong suốt buổi diễn có một [ROOT.Char.GetWomanMan] mặc quần áo giống hệt ta với thứ trông như phân bôi trên mặt [ROOT.Char.GetHerHis], vừa hát vừa kể về sự độc ác bị cho là của ta!\n\nTa quay sang [stop_host_scope.GetName] với vẻ kinh ngạc chỉ để thấy [stop_host_scope.GetSheHe] đang cười ngặt nghẽo trước màn thô tục này! Ta không thể chạm vào thức ăn của mình, chỉ biết nhìn và nghe khi cả triều đình cười nhạo sự chế giễu méo mó về con người ta."
  host_dinner_events.1081.a:0 "Ta sẽ trả thù."
  host_dinner_events.1081.b:0 "Cũng khá buồn cười..."
  host_dinner_events.1081.liked_performance:0 "[visiting_liege.GetName] thích màn biểu diễn"
  host_dinner_events.3120.title:0 "Món Quà Xứng Đáng Cho Một [stop_host_scope.GetTitleAsNameNoTooltip]"
  host_dinner_events.3120.desc:0 "Trong bữa tối, ta tìm được cơ hội để thể hiện uy nghi của mình. Đoàn tùy tùng của ta đầy rẫy của cải và những con người tài năng, và có lẽ ta có thể lấy lòng [stop_host_scope.GetName] nếu ta để lại một phần nhỏ của bản thân mình tại đây.\n\nCó rất nhiều thứ ta có thể ban tặng từ lòng hào phóng của mình, có lẽ..."
  host_dinner_events.3120.a:1 "[courtier_gift.GetNameNoTooltip] có thể ở lại đây."
  host_dinner_events.3120.b:0 "[artifact_gift.GetNameNoTooltip] có thể thuộc về [stop_host_scope.GetHerHis]."
  host_dinner_events.3120.c:0 "Vàng luôn là một món quà tuyệt vời."
  host_dinner_events.3120.d:0 "Món quà của tình bạn chân thành!"
  host_dinner_events.3120.e:0 "Ta không nợ ai món quà nào."
  host_dinner_events.3121.title:0 "$host_dinner_events.3120.title$"
  host_dinner_events.3121.desc.intro:0 "Ta bước vào đại sảnh ăn uống và thấy [visiting_liege.GetName] đang ngồi ở đầu bàn, chân gác hờ hững bên cạnh bữa ăn của [visiting_liege.GetHerHis].\n\n"Chư hầu tốt của ta!"
  host_dinner_events.3121.desc.courtier:0 "Ta đảm bảo với ngươi rằng [courtier_gift.GetName] là một cận thần tốt và trung thành, người sẽ phục vụ ngươi rất tốt trong tương lai."
  host_dinner_events.3121.desc.artifact:0 "Kho báu của ta tràn ngập những di vật và cổ vật quý giá. Có lẽ ngươi sẽ muốn nhận lấy [artifact_gift.GetName] của ta."
  host_dinner_events.3121.desc.gold_gift:0 "Ta đang bị gánh nặng bởi khối tài sản khổng lồ của mình, và ta muốn chia sẻ một phần của cải đó cho những thần dân trung thành nhất."
  host_dinner_events.3121.desc.best_friend:0 "Chúng ta đã là bạn bè một thời gian rồi, và có lẽ đã đến lúc nâng mối quan hệ này lên một tầm cao mới. Ngươi có muốn thề một lời thề về tình bạn #EMP chân chính#! với ta không?"
  host_dinner_events.3121.desc.outro:0 "Đây là món quà ta dành cho ngươi, không cần bất kỳ sự đáp lại nào.""
  host_dinner_events.3121.a:0 ""Cảm ơn ngài!""
  host_dinner_3120_gift_taken:0 "[stop_host_scope.GetFirstName] đã nhận món quà"
  host_dinner_3120_gift_refused:0 "[stop_host_scope.GetFirstName] từ chối món quà"
  host_dinner_events.3121.b:0 ""Chúng ta là bạn bè, mãi mãi.""
  host_dinner_events.3121.c:0 "Ta sẽ không nhận."
  host_dinner_events.3130.title:0 "Không Phải Những Gì [stop_host_scope.GetSheHe|U] Tưởng"
  host_dinner_events.3130.desc:0 "Ta tỉnh dậy trong cơn đói cồn cào, không thể quay lại giấc ngủ.\n\nTa lang thang trong bóng tối đến nhà bếp và nhận ra căn phòng được chiếu sáng bởi thứ gì đó ngoài chiếc đèn của ta. Những kệ trong kho thực phẩm phát sáng với ánh vàng siêu nhiên nhưng đầy hấp dẫn.\n\nSự tò mò tràn ngập trong ta, ta không thể tìm ra nguồn gốc của ánh sáng. Khi ngọn lửa trên đèn bị dập tắt, ta bắt đầu kiểm tra quanh các góc của kho."
  host_dinner_events.3130.a:0 "Ta #EMP phải#! tìm ra sự thật!"
  host_dinner_events.3130.b:0 "Ta không thể lục lọi lung tung như vậy."
  host_dinner_events.3131.title:0 "Căn Phòng Sau Kho Thực Phẩm"
  host_dinner_events.3131.desc:0 "Với một chút nỗ lực, ta phát hiện những vết trầy trên sàn nơi chiếc tủ đứng, và vài phần của kệ ít bụi hơn hẳn so với phần còn lại. Những chiếc kệ hóa ra là các công tắc cơ khí khi chạm vào, và với một chút cố gắng, ta có thể trượt cả kho thực phẩm ra khỏi bức tường để lộ ra một căn phòng bí mật!\n\nGiữa những bức tường đá ẩm ướt là một cánh cửa gỗ chắc chắn với ổ khóa được trang trí tinh xảo trên tay nắm. Khi quan sát kỹ, các ký hiệu trên ổ khóa không phải số hay chữ mà là hình vẽ của đủ loại thú vật và quái vật ghê rợn."
  host_dinner_events.3131.a:0 "Một câu đố, chuyện này hẳn rất đơn giản."
  host_dinner_events.3131.fail_to_get_it_open:0 "Ngươi không mở được cánh cửa"
  host_dinner_events.3131.b:0 "Chỉ cần đá mạnh một cái là được!"
  host_dinner_events.3131.c:0 "Việc này tốn công quá."
  host_dinner_events.3132.title:0 "Thư Viện Bí Mật"
  host_dinner_events.3132.desc:0 "Ở khoảng trống nơi cánh cửa từng đứng, ta thấy một phòng nghiên cứu tinh xảo với đủ loại chất lạ đang sôi lục bục trên ngọn lửa nhỏ, và những con vật nhỏ bị nhốt trong các lồng bé xíu. Ở trung tâm căn phòng là một cuốn sách đặt trên bệ, bìa của nó lấp lánh với những hình vẽ thú vật và quái vật giống hệt các biểu tượng trên ổ khóa câu đố của căn phòng.\n\nTa cầm cuốn sách lên và cảm thấy sự tò mò tràn ngập khi ngón tay lướt trên bề mặt da của nó. Rồi ta thấy ẩn giữa những ký hiệu tà ác trên bìa là một ký tự có thể hiểu được: số một. Ta cố mở cuốn sách, nhưng phát hiện nó bị khóa chặt bằng một câu đố tam giác nhỏ."
  host_dinner_events.3132.a:0 "Điều này có nghĩa là gì?"
  host_dinner_events.3132.b:0 "Thêm một mảnh của bí ẩn."
  artifact_secret_journal_with_cipher_description:0 "Một cặp nhật ký, một cuốn bị khóa chặt bằng một câu đố không thể hiểu được, và cuốn còn lại chứa mật mã của một loại ngôn ngữ được mã hóa. Hai cuốn dường như thuộc về nhau."
  artifact_secret_journal_with_puzzle_description:0 "Một cuốn nhật ký bìa da kỳ lạ bị khóa bằng một câu đố khó hiểu. Đi kèm với nó là một cuốn nhật ký khác chứa chìa khóa giải mã câu đố."
  host_dinner_events.3132.c:0 "Cuối cùng, ta đã có đủ tất cả."
  artifact_secret_journal_unsolved_description:0 "Ba cuốn nhật ký, mỗi cuốn chứa những mảnh khác nhau để giải mã bí ẩn của nhau, nhưng bí ẩn vẫn chưa được giải."
  host_dinner_events.3132.d:0 "Ta nên để nó lại đây."
  host_dinner_events.3133.title:0 "Hầm Ngục Bí Mật"
  host_dinner_events.3133.desc:0 "Cánh cửa bật mở và tiết lộ cho ta... thứ mà ta ước mình chưa từng thấy.\n\nMọi bức tường đều treo những vật kỳ lạ: roi da, giá kẹp, những khối gỗ hình dương vật, chỉ kể vài thứ. Sàn nhà ẩm ướt với thứ mà ta #EMP hy vọng#! chỉ là nước, nhưng với những dụng cụ trong căn phòng này, ta không dám nghĩ đó có thể là hỗn hợp chất dịch cơ thể gì."
  host_dinner_events.3133.a:0 "Ta đã biết quá nhiều."
  host_dinner_events.3134.title:0 "Lò Mổ Bí Mật"
  host_dinner_events.3134.desc:0 "Khi cánh cửa hé mở, một mùi hăng ghê tởm khiến ta ngã nhào xuống đất, phần sau người ta ngập trong một vũng máu tươi.\n\nCăn phòng đầy những xác người, bị xẻ thịt dở dang và treo trên móc thịt. Da người nằm trên bàn mổ cạnh thi thể mà nó từng bám vào, bên cạnh là một con dao phay bẩn thỉu. Những biểu cảm kinh hoàng méo mó trên khuôn mặt các nạn nhân trở thành cảnh tượng vĩnh viễn của căn phòng."
  host_dinner_events.3134.a:0 "Ta sẽ không bao giờ quên được cảnh này."
  host_dinner_events.3135.title:0 "Đường Hầm Thoát Thân"
  host_dinner_events.3135.desc:0 "Cánh cửa mở ra để lộ một đường hầm tối tăm trơn nhớt, phủ đầy địa y và nấm. Ta lội qua nó và đi theo đường hầm cho đến tận cùng, nơi ta bước ra ngoài một con đường quê vắng vẻ.\n\nRõ ràng đây là đường hầm thoát thân của [stop_host_scope.GetNamePossessive] trong trường hợp khẩn cấp."
  host_dinner_events.3135.a:0 "Một phát hiện tuyệt vời!"
  host_dinner_events.3136.title:0 "Phòng Ngủ Bí Mật"
  host_dinner_events.3136.desc:0 "Cánh cửa mở ra kèm theo một tiếng thở dốc kinh hoàng! Đứng ở ngưỡng cửa là một [quasimodo_child.Custom('GirlBoy')] dị dạng, đang nhìn ta với vẻ sốc và kinh hãi tột độ trong ánh mắt.\n\n\"Đừng nhìn ta!\" [quasimodo_child.GetSheHe|U] thét lên, lấy tay che kín khuôn mặt. \"Ôi, nỗi kinh hoàng đang chờ đợi ngài nếu [stop_host_scope.GetMotherFather] phát hiện ra ngài đã nhìn thấy ta!\"\n\nChính lúc đó ta mới nhận ra sự giống nhau, đây rõ ràng là đứa con hoang của [stop_host_scope.GetNamePossessiveNoTooltip]!"
  host_dinner_events.3136.a:0 "Mọi người sẽ biết."
  host_dinner_events.3136.b:0 "Không ai từng biết."
  host_dinner_events.3140.title:0 "Sự Kết Hợp Hương Vị"
  host_dinner_events.3140.desc:0 "Cuộc sống của một [ROOT.Char.GetTitleAsNameNoTooltip|U] mang đến vô vàn món ăn tuyệt vời và xa hoa trên bàn của ta, nhưng gần đây ta đã chán những hương vị và kết cấu quen thuộc này. Ta khao khát thứ gì đó thật sự táo bạo, thật sự kỳ lạ!\n\nBên trái ta là [stop_host_scope.Custom('GetExpensiveDessert')] và bên phải là rau luộc. Điều gì sẽ xảy ra nếu ta thử cả hai hương vị hoàn toàn khác biệt này cùng một lúc!"
  host_dinner_events.3140.a:0 "Một thí nghiệm đáng thử."
  host_dinner_events.3140.satisfying_taste:0 "Hương vị thật tuyệt vời"
  host_dinner_events.3140.it_did_not_work:0 "Thí nghiệm thất bại"
  host_dinner_events.3140.b:0 "Ta không thể liều lĩnh như vậy."
  host_dinner_events.1090.title:0 "Thuốc Độc"
  host_dinner_events.1090.desc:0 "Có vẻ một cơ hội vàng đã rơi vào tay ta khi [visiting_liege.GetNamePossessive] ghé thăm đại sảnh của ta.\n\n[visiting_liege.GetSheHe|U] đang mong chờ một bữa ăn đáng nhớ, và với một ít cà dược nghiền nát, ta có thể đảm bảo rằng [visiting_liege.GetSheHe] sẽ không bao giờ trải nghiệm bữa tối như thế này lần nữa!\n\nThời khắc ra tay đang đến gần, liệu ta có thật sự dám mạo hiểm?"
  host_dinner_events.1090.a:0 "Tất nhiên rồi!"
  host_dinner_events.1090.b:0 "Chưa phải lúc."
  host_dinner_if_you_succeed_tt:0 "Nếu ngươi thành công"
  host_dinner_if_you_fail_tt:0 "Nếu ngươi thất bại"
  host_dinner_events.1091.title:0 "Thuốc Độc!"
  host_dinner_events.1091.desc:0 "Ta ăn [stop_host_scope.Custom('GetExpensiveDessert')] của mình mà không hề lo lắng, hài lòng với thêm một bữa ăn tuyệt vời nữa.\n\nTuy nhiên khi ta bước lên lầu đi ngủ, ta bắt đầu cảm thấy yếu đi, như thể máu trong cơ thể đang đặc lại, gần như đông trong mạch. Trước khi kịp lên đến đỉnh cầu thang, ta gục xuống, thở hổn hển tìm không khí. Khi thế giới xung quanh dần chìm vào bóng tối, điều cuối cùng ta thấy là [stop_host_scope.GetNamePossessive] đang nhìn xuống ta với một nụ cười hiểu rõ."
  host_dinner_1091_murder_succesful:0 "Ngươi đã đầu độc [visiting_liege.GetTitleAsNameNoTooltip|U] của mình"
  host_dinner_events.1091.a:0 "Làm sao... ngươi có thể..."
  host_dinner_events.1092.title:0 "Âm Mưu Giết Người"
  host_dinner_events.1092.desc:0 "Ta quay sang [stop_host_scope.Custom('GetExpensiveDessert')] và chuẩn bị ăn, nhưng một cảm giác khó chịu bỗng tràn qua khiến đôi tay tham ăn của ta dừng lại.\n\nTa kiểm tra món tráng miệng và ngửi kỹ vài lần, và không còn nghi ngờ gì nữa — thức ăn của ta đã bị tẩm độc! Không có lời giải thích nào khác, [stop_host_scope.GetName] đang cố giết ta."
  host_dinner_events.1092.a:0 "Tên ác quỷ!"
  host_dinner_1091_murder_failed:0 "Âm mưu giết người của ngươi đã thất bại"
  host_dinner_events.1093.title:0 "$host_dinner_events.1092.title$"
  host_dinner_events.1093.desc:0 "Người nếm thức ăn trung thành của ta, [food_taster_scope.GetName], đang thực hiện nhiệm vụ của mình. [food_taster_scope.GetSheHe|U] kết thúc việc kiểm tra bằng cách nếm thử món [stop_host_scope.Custom('GetExpensiveDessert')] của ta và gật đầu hài lòng.\n\nThế nhưng chẳng bao lâu sau, [food_taster_scope.GetWomanMan] tội nghiệp bắt đầu nghẹn và sặc, chật vật giành lấy từng hơi thở và đập nắm đấm xuống bàn. Chỉ trong vài giây, đôi môi tái nhợt của [food_taster_scope.GetHerHis] đã trút hơi thở cuối cùng và ta chỉ còn lại một mình với nụ cười khó chịu của [stop_host_scope.GetNamePossessive]."
  host_dinner_events.1093.a:0 ""Kẻ sát nhân!""
  host_dinner_events.3150.title:0 "Vấn Đề Danh Dự"
  host_dinner_events.3150.desc:0 "Ta đã ngồi cạnh hiệp sĩ trung thành [joker_knight.GetName] của [stop_host_scope.GetNamePossessive] suốt cả buổi tối và cho đến nay, [joker_knight.GetWomanMan] này là một người thú vị, chẳng bao giờ thiếu những câu chuyện cười để kể.\n\n\"Ta nói cho ngài nghe, trong mọi [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] mà ta từng gặp, [ROOT.Char.GetName] là kẻ [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] nhất! Hah!\"\n\n\"Ngươi dám nói gì về [ROOT.Char.GetLadyLord] của ta vậy?\" [humorless_knight.GetName] đứng bật dậy từ chỗ ngồi. \"Ta thách đấu ngươi, tên khốn!\""
  host_dinner_events.3150.a:0 "Thật thú vị!"
  host_dinner_events.3150.your_knight_wins:0 "[humorless_knight.GetName] chiến thắng!"
  host_dinner_events.3150.your_knight_loses:0 "[humorless_knight.GetName] thua cuộc"
  host_dinner_events.3150.b:0 "Dừng lại đi, đồ ngu."
  host_dinner_events.3000.title:0 "Ổn Định Cho Bữa Tối"
  host_dinner_events.3000.desc.intro:2 "Ta nhận được sự chào đón xứng đáng với một [ROOT.Char.GetTitleAsNameNoTooltip] tại cổng của [stop_host_scope.GetTitledFirstNamePossessive] [stop_host_scope.Custom('FortifiedBuilding')] ở [ROOT.Char.GetCurrentLocation.GetName],"
  host_dinner_events.3000.desc.type.majesty:0 "và rõ ràng sự huy hoàng của đoàn tùy tùng của ta đã gây ấn tượng lớn.\n\n"
  host_dinner_events.3000.desc.type.taxation:0 "chiếc xe chở kho bạc và những người thu thuế của ta khiến mục đích chuyến thăm trở nên rõ ràng.\n\n"
  host_dinner_events.3000.desc.type.intimidation:0 "và sự tiếp nhận lạnh lùng của ta, được bao quanh bởi những lính gác vũ trang nặng nề, tạo ra bầu không khí mong muốn.\n\n"
  host_dinner_events.3000.desc.mid.hates_vassal:0 "Việc nhận lòng hiếu khách từ tên [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] này đủ để làm ta mất khẩu vị; tốt nhất là phải có [ROOT.Char.Custom('FavoriteTreat')]..."
  host_dinner_events.3000.desc.mid.lover:0 "Phải giữ lễ nghi với [stop_host_scope.Custom('RomanticComplimentNoun')] thân yêu của ta thật là một số phận tàn nhẫn — có lẽ ta sẽ ghé thăm [stop_host_scope.GetHerHim] sau bữa tối..."
  host_dinner_events.3000.desc.mid.friend:0 "Đã quá lâu rồi kể từ khi ta ngồi ăn tối cùng một người bạn tốt như vậy! Những gánh nặng của vương quốc hiếm khi được quên đi trong tinh thần như thế này!"
  host_dinner_events.3000.desc.mid.close_family:0 "Thật tốt khi được gặp lại [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] của ta! Chúng ta ôm nhau trang trọng, công khai khẳng định mối liên kết gia đình."
  host_dinner_events.3000.desc.mid.house:0 "Đây là cơ hội hiếm hoi để ta tận hưởng thời gian trong sự bầu bạn tốt đẹp của một [stop_host_scope.Custom('GetDaughterSon')] của Nhà [ROOT.Char.GetHouse.GetBaseName]."
  host_dinner_events.3000.desc.mid.powerful_vassal:0 "Dĩ nhiên, ta cũng phải công nhận vị thế của [stop_host_scope.GetHerHis] trong số các chư hầu của [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ít nhất là trước công chúng..."
  host_dinner_events.3000.desc.mid.default:1 "Chư hầu của ta cung kính tiếp đón ta với đầy đủ lễ nghi cần thiết."
  host_dinner_events.3000.desc.mid:2 "\n\n[stop_host_scope.GetFirstNameNoTooltip] giải thích về bữa tiệc tối được chuẩn bị, hứa rằng các trò giải trí và món ăn sẽ gần đạt tới tiêu chuẩn những bữa tối tại triều đình của ta."
 #host_dinner_events.3000.desc.outro:1 "\n\nOnly time will tell."
 #host_dinner_events.3000.desc.mid: "I am ushered inside and placed at the head of the table, which is already rich with foods glistening in the candlelight."
  host_dinner_events.3000.desc.outro:0 "\n\n[stop_host_scope.GetName] đảm bảo với ta rằng đây chỉ là những món ăn ngon nhất mà [stop_host_scope.GetSheHe] có thể dâng lên."
  host_dinner_events.3000.a:0 "Hãy bắt đầu!"

  tour_general.9999.opening:0 "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
  tour_general.9999.desc:0 "Ta sắp bắt đầu một chuyến đại tuần du và chẳng bao lâu nữa sẽ ghé thăm [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
  tour_general.9999.phase_tour_grounds:0 "để kiểm tra [ROOT.Char.Custom('FortifiedBuilding')] và lãnh địa của ngươi."
  tour_general.9999.phase_dinner:0 "để được chiêu đãi một yến tiệc thịnh soạn trong [ROOT.Char.Custom('FortifiedBuilding')] của ngươi."
  tour_general.9999.phase_cultural_festival:0 "để thưởng thức một lễ hội địa phương của người [ROOT.Char.GetCulture.GetNameNoTooltip]."
  tour_general.9999.phase_fallback:1 "để xem xét lãnh địa của ngươi và nghe tin tức về những việc ngươi đã làm."
  tour_general.9999.type_majesty:0 "\n\nĐã đến lúc [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] được chiêm ngưỡng sự huy hoàng và ân sủng của [host.GetLadyLord] chính đáng của họ."
  tour_general.9999.type_intimidation:0 "\n\nĐã đến lúc [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] được nhắc nhở họ đang phục vụ ai, và cái giá của sự phản bội."
  tour_general.9999.type_taxation:0 "\n\nCác lãnh chúa và quý tộc của [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] sẽ phải nộp những khoản cống nạp mà họ nợ ta."
  tour_general.9999.closing:0 "\n\nTa mong đợi một sự chào đón xứng đáng với một [host.GetTitleAsNameNoTooltip|U]."
  tour_general.9999.a:0 "Ta phải chuẩn bị mọi thứ!"
  tour_general.9998.opening:0 "[steward.Custom2('AppropriateGreeting', ROOT.Char)]"
  tour_general.9998.desc:0 "[host.GetName] sẽ không còn đến thăm ngươi trong chuyến tuần du của [host.GetHerHis] nữa."
  tour_general.9998.a:0 "Thật đáng tiếc."

