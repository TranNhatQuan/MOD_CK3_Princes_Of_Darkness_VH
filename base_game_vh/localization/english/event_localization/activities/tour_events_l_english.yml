  increased_control_log:0 "[CHARACTER.GetShortUIName|U] đã tăng cường quyền kiểm soát tại các lãnh địa của [TARGET_CHARACTER.GetShortUINamePossessive]"

  cultural_festival.9000.title:0 "Lối Đi Hậu Trường"
  cultural_festival.9000.desc:0 "Mọi cảnh kỳ thú và vui nhộn quen thuộc của lễ hội văn hóa đang diễn ra xung quanh ta, tựa như ta đã được đưa đến một thế giới khác.\n\nThế nhưng ta lại bị kéo trở về thực tại khi thấy vài kẻ khả nghi lảng vảng ở rìa đám đông, lén lút luồn ra phía sau một sân khấu gỗ ọp ẹp.\n\nSự hiếu kỳ dâng tràn trong lòng ta, nhưng ta không thể nhìn rõ bọn ngu độn ấy đang làm gì. Rồi ta thấy [stop_host_scope.GetFirstName] bước ra từ hậu trường cùng một đám người trông đầy vẻ nhơ nhuốc."
  cultural_festival.9000.a:0 "Ta nên điều tra."
  cultural_festival.9000.host_noticed:0 "[stop_host_scope.GetFirstName] bắt gặp ngươi đang rình mò"
  cultural_festival.9000.b:0 "Không, tốt hơn là ta không nên."
  cultural_festival.9001.title:0 "Chiếc Hòm Dưới Sân Khấu"
  cultural_festival.9001.desc:0 "Sau sân khấu, ta chẳng tìm thấy gì ngoài một chiếc rương nhỏ. Chất liệu của nó có vẻ rất bền, nhưng tay nghề chế tác lại kỳ lạ thay vừa khiêm tốn vừa cẩu thả, hoàn toàn không giống món trưng bày người ta mong đợi ở một lễ hội quy mô như thế này.\n\nNó bị khóa bằng một loại ổ khóa dạng câu đố, trên đó phủ đầy những hình chạm thô kệch của đủ loại quái dị và dã thú.\n\nTâm trí ta tràn ngập hiếu kỳ, ta nhất định phải biết bên trong có gì!"
  cultural_festival.9001.a:0 "Ta giải được cái khóa này, dễ thôi!"
  cultural_festival.9001.fail_to_get_it_open:0 "Ngươi không giải được ổ khóa"
  cultural_festival.9001.b:0 "Ta cứ đập vỡ nó!"
  cultural_festival.9001.destroyed_what_was_inside:0 "Ngươi đã phá hủy thứ bên trong"
  cultural_festival.9001.c:0 "Chuyện này tốn công quá."
  cultural_festival.9002.title:0 "Cuốn Nhật Ký Bí Mật"
  cultural_festival.9002.desc:0 "Ẩn sau chiếc hòm gỗ cứng chỉ là một cuốn nhật ký cũ phủ đầy bụi, với nhiều tờ giấy nhét lộn xộn giữa các trang.\n\nTa mở cuốn nhật ký ra và chỉ thấy toàn những dòng chữ vô nghĩa, ký hiệu lạ lẫm, cùng các phương trình toán học dường như chẳng liên quan gì đến phần còn lại của cuốn sách.\n\nẮt hẳn đây là chìa khóa để giải một câu đố nào đó, nhưng rốt cuộc là câu đố gì?"
  artifact_secret_puzzle_description:0 "Một cuốn sách chứa chìa khóa để giải một câu đố chưa rõ."
  cultural_festival.9002.a:0 "Ta sẽ mang nó đi."
  cultural_festival.9002.b:0 "$host_dinner_events.3132.b$"
  artifact_secret_puzzle_with_cipher_description:0 "Hai cuốn nhật ký, một cuốn dường như chứa mật mã, còn cuốn kia là chìa khóa giải câu đố. Ngay cả khi ghép lại, hai cuốn này vẫn chưa hé lộ bí mật nào — hẳn phải còn cuốn thứ ba."
  cultural_festival.9002.c:0 "$host_dinner_events.3132.c$"
  cultural_festival.9002.d:0 "Không, ta nên để nó lại."
  cultural_festival.9003.title:0 "Một Lưỡi Dao"
  cultural_festival.9003.desc:0 "Bên trong chiếc rương là một con dao găm được trang trí cầu kỳ. Khác hẳn sự thô kệch của ổ khóa, con dao được chạm khắc tinh xảo đến mức mỗi lần ngươi nhìn kỹ hơn, lại thấy thêm những chi tiết phức tạp hiện ra.\n\nQuả là một món đồ tuyệt mỹ."
  artifact_ornate_dagger_name:0 "Dao Găm Trang Trí"
  artifact_ornate_dagger_desc:0 "Một con dao găm được chạm khắc tinh xảo, phủ đầy hình quái dị và đủ loại thú vật."
  cultural_festival.9003.a:0 "Và giờ nó là của ta!"
  cultural_festival.9003.b:0 "Ta không thể cứ thế mà trộm nó!"
  cultural_festival.9004.title:0 "Một Khoản Cống"
  cultural_festival.9004.desc:0 "Chiếc hòm đầy ắp vàng! Chắc chắn là một kho báu bí mật mà [stop_host_scope.GetFirstName] đã giấu ta."
  cultural_festival.9004.a:0 "$cultural_festival.9003.a$"
  cultural_festival.9004.b:0 "$cultural_festival.9003.b$"
  cultural_festival.9005.title:0 "Chiếc Vòng Cổ Trang Trí"
  cultural_festival.9005.desc: "Bên trong chiếc rương là một chiếc vòng cổ được trang trí cầu kỳ. Khác hẳn sự thô kệch của ổ khóa, chiếc vòng được chế tác tinh xảo đến mức mỗi lần ngươi nhìn vào, lại phát hiện thêm những chi tiết phức tạp mới.\n\nQuả là một món đồ tuyệt mỹ."
  artifact_strange_necklace_name:0 "Chiếc Vòng Cổ Kỳ Lạ"
  artifact_strange_necklace_desc:0 "Một chiếc vòng cổ chạm khắc tinh xảo. Ở cuối sợi dây là hình một sinh vật quái dị đang kẹp viên ngọc giữa những chi thể kỳ lạ."
  cultural_festival.9005.a:0 "$cultural_festival.9003.a$"
  cultural_festival.9005.b:0 "$cultural_festival.9003.b$"
  cultural_festival.9006.title:0 "Một Món Đồ Đáng Xấu Hổ"
  cultural_festival.9006.desc:0 "Ta mở chiếc rương ra và không khỏi đỏ mặt khi thấy thứ bên trong.\n\nĐược làm từ loại gỗ tốt, vật thể hình dương vật này khác hẳn mọi thứ ta từng thấy — thậm chí nó còn chẳng giống #EMP vật đó#! của con người, mà giống thứ thuộc về một sinh vật thần thoại.\n\nQuả là một món đồ bệnh hoạn."
  grotesque_wooden_phallus:0 "Dương Vật Gỗ Thần Thoại"
  grotesque_wooden_phallus.desc:0 "Một vật chạm khắc cầu kỳ mô phỏng dương vật của một sinh vật thần bí chưa rõ."
  cultural_festival.9006.a:0 "Thật là một thứ lạ lùng!"
  cultural_festival.9006.b:0 "Đốt nó."
  decision_solve_the_journals:0 "Mở Khóa Nhật Ký"
  decision_solve_the_journals_desc:0 "Cuối cùng ta đã gom đủ các mảnh ghép của câu đố, đã đến lúc ta khám phá điều được viết trong những trang này!"
  decision_solve_the_journals_tooltip:0 "Ngươi sẽ cố giải mã các cuốn nhật ký"
  decision_solve_the_journals_confirm:0 "Làm thôi."
  journal_events_prefix:0 "Hiểu Về Cuốn Nhật Ký:"
  tour_general.5000.title:0 "$journal_events_prefix$ Thất Bại"
  tour_general.5000.desc:0 "Ta gom các cuốn nhật ký lại với nhau, đọc kỹ cuốn sách câu đố, rồi áp dụng chúng vào ổ khóa với những động tác chuẩn xác như chính suy nghĩ của mình.\n\nCuối cùng ta tưởng mình đã giải được và #EMP cạch!#! Cuốn nhật ký vẫn khóa chặt, cứng đầu như trước."
  tour_general.5000.a:0 "Chết tiệt!"
  tour_general.5000.b:0 "Ta sẽ thử lại!"
  tour_general.5001.title:0 "$journal_events_prefix$ Lại Thất Bại"
  tour_general.5001.desc:0 "Lần này ta thật sự cảm thấy mình đã giải được. Mọi thứ đều hợp lý, không thể nào ta sai.\n\nXoay sang trái, và... #EMP cạch!#! Cuốn nhật ký vẫn khóa chặt, cứng đầu như trước."
  tour_general.5001.a:0 "Đáng nguyền rủa!"
  tour_general.5001.b:0 "Ta sẽ phá toang cái khóa chết tiệt này!"
  the_journal_is_destroyed_tt:0 "Ngươi phá hỏng nhiều hơn chỉ cái khóa"
  fail_to_open_journal_tt:0 "Ngươi không mở được cuốn nhật ký"
  more_mysteries_inside_tt:0 "Ngươi khám phá nội dung của cuốn nhật ký"
  tour_general.5010.title:0 "$journal_events_prefix$ Giải Mã"
  tour_general.5010.desc.intro:0 "Cuối cùng những trang nhật ký đã lộ ra trước mắt ta, và ta có thể bắt đầu giải mã! Mật mã mở đầu viết \"Dù ta đi đâu, sự thật vẫn luôn chậm hơn hai bước\", và nhờ đó ta giải được câu đố đầu tiên.\n\n"
  tour_general.5010.desc.puzzle.a:0 ""Uvtcpigvjkpiueqwnfdg.""
  tour_general.5010.desc.puzzle.b:0 ""Vjgurktkvuycvejwucnn.""
  tour_general.5010.desc.puzzle.c:0 ""Qwtjkuvqtakuqpnacnkg.""
  tour_general.5010.desc.puzzle.d:0 ""Hcnnudavjgktqypjcpfu.""
  tour_general.5010.desc.outro:0 "\n\nThoạt nhìn chỉ là vô nghĩa, nhưng hẳn phải có ý nghĩa thật sự."
  tour_general.5010.a:0 "Những điều kỳ lạ có thể xảy ra."
  tour_general.5010.b:0 "Các linh hồn dõi theo tất cả chúng ta."
  tour_general.5010.c:0 "Lịch sử của chúng ta chỉ là dối trá."
  tour_general.5010.d:0 "Sa ngã bởi chính tay mình."
  tour_general.5011.title:0 "$journal_events_prefix$ Những Quái Dị"
  tour_general.5011.desc:0 "Đúng rồi! Lần theo mật mã, ta đã có thể hiểu được toàn bộ cuốn sách, và hóa ra đây là một bản ghi chép kỳ lạ mô tả bản chất của đủ loại sinh vật quái dị như [ROOT.Char.Custom('GetGrotesquePlural')].\n\nCụ thể, nó mô tả bản tính của chúng và nơi người ta có thể tìm thấy chúng — chắc chắn là một hiện vật quan trọng nếu một ngày nào đó ta phải du hành đến những vùng đất xa xôi."
  tour_general.5011.a:0 "Thật quái dị!"
  tour_general.5012.title:0 "$journal_events_prefix$ Thần Học Cao Cấp"
  tour_general.5012.desc:0 "Đúng rồi! Lần theo mật mã, ta đã có thể hiểu được toàn bộ cuốn sách, và hóa ra đây là một tác phẩm thần học vô cùng phức tạp! Nó mô tả [ROOT.Char.GetFaith.PantheonTerm], đồng thời đưa ra những tư tưởng đầy hấp dẫn về mối quan hệ giữa [ROOT.Char.GetFaith.PositiveAfterLife] và [ROOT.Char.GetFaith.NegativeAfterLife].\n\nĐây rất có thể là văn bản thần học tiên tiến nhất trong thế giới [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], và giờ nó thuộc về ta!"
  tour_general.5012.a:0 "Thật hấp dẫn!"
  tour_general.5013.title:0 "$journal_events_prefix$ Lịch Sử Bí Mật"
  tour_general.5013.desc:0 "Đúng rồi! Lần theo mật mã, ta đã có thể hiểu được toàn bộ cuốn sách, và nó mô tả lịch sử của [ROOT.Char.GetPrimaryTitle.GetName] theo một cách mà ta chưa từng nghe qua trước đây!\n\nNếu những điều này là thật, cuốn nhật ký này có thể làm lung lay toàn bộ hiểu biết của chúng ta về lịch sử, cũng như về những nhân vật đã góp phần xây dựng nên [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] vĩ đại như ta biết ngày nay!"
  tour_general.5013.a:0 "Không thể tin được!"
  tour_general.5014.title:0 "$journal_events_prefix$ Chiến Đấu"
  tour_general.5014.desc:0 "Đúng rồi! Lần theo mật mã, ta đã có thể hiểu được toàn bộ cuốn sách, và nó chứa thông tin về những kỹ thuật bí mật trong đủ mọi tình huống chiến đấu. Dù là dùng kiếm, tay không, hay thậm chí chiến đấu trên lưng ngựa, cuốn nhật ký này đều mô tả chính xác cách đối phó với mọi đòn thế mà đối thủ có thể tung ra.\n\nNếu ta chăm chỉ nghiên cứu cuốn nhật ký này và luyện tập theo chỉ dẫn của nó, ta hoàn toàn có thể trở thành kiếm sĩ vĩ đại nhất trong lịch sử của [ROOT.Char.GetPrimaryTitle.GetName]!"
  tour_general.5014.a:0 "Không thể tin được!"
  tour_grounds_events.3030.title:0 "Tấm Bản Đồ Bí Ẩn"
  tour_grounds_events.3030.desc:0 "Hôm nay ta đã dành phần lớn thời gian để khám phá khu trung tâm của [touring_grounds_scope.GetNameNoTooltip], đồng thời tận hưởng niềm vui khi được dân địa phương phục vụ.\n\nNgay ngoài tầm với của ta, ta thấy một kẻ choàng áo trùm len lỏi qua đám đông, cố gắng hòa lẫn vào trong vô ích. Một tờ giấy rơi khỏi túi hắn, rồi bị gió cuốn bay về phía ta, như thể được dẫn đường đến tay ta vậy.\n\nCó vẻ đó là một tấm bản đồ — bản đồ khu vực xung quanh [touring_grounds_scope.GetNameNoTooltip]!"
  tour_grounds_events.3030.a:0 "Xem thử nó dẫn đến đâu."
  tour_grounds_events.3030.got_lost:0 "Ngươi bị lạc"
  tour_grounds_events.3030.b:0 "Hừ, thật phí thời gian."
  tour_grounds_events.3031.title:0 "Kho Báu Chôn Giấu"
  tour_grounds_events.3031.desc:0 "Lần theo tấm bản đồ đến điểm cuối, ta chỉ tìm thấy một khoảng đất trống trong vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip], chẳng có gì đặc biệt.\n\nTuy nhiên khi nhìn quanh, ta thấy trên mặt đất có một loạt ụ đất, như thể có thứ gì đó đã bị chôn ở đó. Những ụ đất xuất hiện khá đều đặn, có lẽ vị trí của chúng không phải ngẫu nhiên..."
  tour_grounds_events.3031.a:0 "Ta có thể đoán ra cái nào đúng."
  tour_grounds_events.3031.fail_to_get_it_open:0 "Ngươi không tìm được chỗ đúng"
  tour_grounds_events.3031.b:0 "Ta sẽ đào tung cả bãi đất này!"
  tour_grounds_events.3031.c:0 "Ta đã lần theo dấu vết này đủ rồi."
  tour_grounds_events.3032.title:0 "Cuốn Sách Bị Chôn"
  tour_grounds_events.3032.desc:0 "Cuối cùng ta nghĩ rằng mình đã tìm đúng ụ đất, và khi đào lên thì lộ ra... một cuốn sách kỳ lạ.\n\nBìa sách đã bị dập nát và gần như rã ra, còn bên trong chỉ toàn những ký hiệu lạ và câu đố bí ẩn, ám chỉ một sự thật bị che giấu.\n\nSau một lúc xem xét, ta hiểu rằng đây là một cuốn sách về mật mã, nhưng rốt cuộc nó dùng để giải mã điều gì thì vẫn chưa rõ."
  artifact_secret_cipher_description:0 "Một cuốn sách kỳ lạ chứa những câu đố và mật mã."
  tour_grounds_events.3032.a:0 "Ta sẽ lấy nó!"
  tour_grounds_events.3032.b:0 "$host_dinner_events.3132.b$"
  tour_grounds_events.3032.c:0 "$host_dinner_events.3132.c$"
  tour_grounds_events.3032.d:0 "Ta nên để nó lại nơi đã tìm thấy."
  open_the_journal_tt:0 "Ngươi mở cuốn nhật ký"
  attempt_to_solve_the_cipher_tt:0 "Ngươi cố giải mật mã"
  you_have_journal_1_tt:0 "Ngươi sở hữu Nhật Ký Bí Mật"
  you_have_journal_2_tt:0 "Ngươi sở hữu Chìa Khóa Câu Đố"
  you_have_journal_3_tt:0 "Ngươi sở hữu Cuốn Mật Mã"

  artifact_journal_of_grotesques:0 "Nhật Ký Về Những Quái Dị"
  artifact_journal_of_grotesques_desc:0 "Cuốn nhật ký được mã hóa này chứa đầy thông tin về việc nghiên cứu các sinh vật quái dị và nơi người ta có thể tìm thấy chúng."
  artifact_journal_of_theology:0 "Nhật Ký Thần Học Cao Cấp"
  artifact_journal_of_theology_desc:0 "Cuốn nhật ký được mã hóa này chứa những khám phá mang tính đột phá về thần học [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
  artifact_journal_secret_history:0 "Lịch Sử Bí Mật Của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
  artifact_journal_secret_history_desc:0 "Cuốn nhật ký được mã hóa này chứa thông tin chi tiết về lịch sử của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] cùng các vị cai trị của nó."
  artifact_journal_of_martial_arts:0 "Nhật Ký Võ Nghệ"
  artifact_journal_of_martial_arts_desc:0 "Cuốn nhật ký được mã hóa này đưa ra chỉ dẫn về đủ loại kỹ nghệ chiến đấu; từ kiếm, tay không cho đến cưỡi ngựa."

  cultural_festival.9010.title:0 "Quá Nhiệt Tình"
  cultural_festival.9010.desc:0 "Hôm nay ta đã tận hưởng lễ hội ở [ROOT.Char.GetCurrentLocation.GetName], nhưng chắc chắn không thể sánh bằng [weeb_child.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n[weeb_child.GetSheHe|U] đã nhảy múa và xoay tròn cùng dân địa phương với niềm hân hoan và sức sống mà ta chưa từng thấy ở [weeb_child.GetHerHim] trước đây. Hoàn toàn hòa mình vào những truyền thống xa lạ của văn hóa [festival_culture_scope.GetName], [weeb_child.GetSheHe] trông như đang ở chính quê nhà, và người dân địa phương dường như cũng rất yêu mến [weeb_child.GetHerHim]!"
  cultural_festival.9010.a:0 "Thật tốt."
  cultural_festival.9010.b:0 ""Hãy ở cùng họ đi, [weeb_child.GetFirstNameNoTooltip]!""
  cultural_festival.9020.title:0 "Cao Trào Vĩ Đại"
  cultural_festival.9020.desc:0 "Mặt trời đang dần lặn sau một ngày tại [ROOT.Char.GetCurrentLocation.GetName] và những người dân bản địa dường như đang chuẩn bị cho buổi trình diễn cuối cùng. Một cột gỗ lớn đã được dựng lên, và ta rất phấn khích muốn xem điều gì sẽ xảy ra tiếp theo!\n\nNhưng rồi, một [human_sacrifice.GetWomanMan] ốm yếu bị kéo lê tới trong tiếng la hét và vùng vẫy, rồi bị trói vào cột. Một con dao được đưa tới bụng [human_sacrifice.GetHerHis], và [human_sacrifice.GetSheHe] nhắm mắt lại, chuẩn bị đối mặt với hư vô."
  cultural_festival.9020.b:0 ""Hãy dừng sự điên rồ này nhân danh [ROOT.Char.GetTitleAsNameNoTooltip|U] của các ngươi!""
  cultural_festival.9030.title:0 "Truyền Thống [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|U]"
  cultural_festival.9030.desc:0 "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] dường như hoàn toàn say mê những lễ hội hôm nay. Vũ công, nghệ sĩ biểu diễn và những kẻ mua vui đều cố gắng làm hài lòng lãnh chúa của ta, và dường như họ đang làm rất tốt.\n\nTrong tâm trạng tốt như thế này, lại được bao quanh bởi truyền thống của chúng ta, có lẽ [visiting_liege.GetFirstName] sẽ bắt đầu quan tâm đến việc gìn giữ chúng. Truyền thống của [ROOT.Char.GetFaith.GetAdherentName|U] chắc chắn sẽ mai một nếu không có những bảo hộ pháp lý thích đáng chống lại việc cải đạo."
  cultural_festival.9030.a:0 ""Sẽ thật đáng tiếc nếu những truyền thống này biến mất, phải không?""
  cultural_festival.9030.success:0 "Ngươi đã thuyết phục được [visiting_liege.GetFirstName]"
  cultural_festival.9030.failure:0 "Ngươi không thuyết phục được [visiting_liege.GetFirstName]"
  cultural_festival.9030.b:0 "Ta nên im lặng thì hơn."
  cultural_festival.9040.t:0 "Một Đồng Cho Lời Tiên Tri"
  cultural_festival.9040.desc:0 "Ở một góc xa của lễ hội, ta tìm thấy một chiếc lều được trang trí cầu kỳ. Vật liệu và hoa văn của nó xa lạ với ta, khác hẳn những gì ta từng thấy ở quê nhà. Chủ nhân của nó còn kỳ lạ hơn, mỉm cười đầy ẩn ý với ta qua đôi bàn tay chắp lại.\n\n""À, một [ROOT.Char.GetTitleAsNameNoTooltip|U]! Ta thấy rất nhiều điều trong tương lai của ngài, hãy đưa ta một đồng xu và ta sẽ nói hết.""
  cultural_festival.9040.a:0 ""Một đồng xu thì có sao.""
  cultural_festival.9040.good_reading:0 "Lời tiên tri của ngươi là điềm lành"
  cultural_festival.9040.bad_reading:0 "Lời tiên tri của ngươi báo hiệu tai họa"
  cultural_festival.9040.b:0 ""Ta không hứng thú với bọn bịp bợm tầm thường.""
  cultural_festival.9040.c:0 ""Hãy dạy ta cách của ngươi, bậc hiền giả!""
  cultural_festival.9050.t:0 "Vũ Điệu Gợi Tình"
  cultural_festival.9050.desc:0 "Ta ngồi xuống để thưởng thức thêm một tiết mục giải trí quyến rũ khác. Tiếng nhạc gõ vang lên trong sự im lặng mong chờ, trống dập dồn như nhịp tim.\n\nTừ sau tấm rèm, một [sexy_dancer.GetWomanMan] tuyệt đẹp xuất hiện, chuyển động cơ thể [sexy_dancer.GetHerHis] theo cách vừa khiêu khích vừa kích thích. [sexy_dancer.GetSheHe|U] áp sát cơ thể [sexy_dancer.GetHerHis] một cách táo bạo gần sát ta rồi bỏ lại ta chỉ với một cái nháy mắt, quay về với đám khán giả đang say mê [sexy_dancer.GetHerHis]."
  cultural_festival.9050.a:1 "[sexy_dancer.GetSheHe|U] phải thuộc về ta!"
  cultural_festival.9050.b:0 "Thật buồn cười!"
  cultural_festival.9060.t:0 "Một Màn Trình Diễn Huyền Thoại"
  cultural_festival.9060.desc:0 "Trong lúc vui chơi, ta dạo bước khắp lễ hội và cuối cùng bắt gặp một đoàn nghệ sĩ biểu diễn. Họ dường như đang tập dượt cho điều gì đó, và chỉ cần nhìn cách họ thể hiện, ta đã biết mình sắp được thưởng thức một màn giải trí tuyệt vời.\n\nMột ý nghĩ chợt nảy ra trong đầu ta rằng đoàn kịch này có thể hưởng lợi từ một câu chuyện mới. Quả thật, [ROOT.Char.GetPromotedLegend.GetName] sẽ là chất liệu hoàn hảo cho một nhóm nghệ sĩ tài năng như vậy."
  cultural_festival.9060.a:0 "Họ nên diễn truyền thuyết của ta!"
  cultural_festival.9060.a.success:0 "Màn trình diễn đến tai [stop_host_scope.GetFirstName]"
  cultural_festival.9060.a.failure:0 "Màn trình diễn diễn ra khá tốt"
  cultural_festival.9060.b:0 "Ta chỉ nên tận hưởng những gì họ mang lại."

