l_english:
  feast_main_stable_breakin.0002.t:2 "Phá Chuồng Ngựa"
  feast_main_stable_breakin.0002.breakin_with_helper:0 "Ăn uống đã đi hơi quá đà khi [breakin_stager.GetTitledFirstName] quyết định đã đến lúc cưỡi ngựa cho vui. Chuồng ngựa bị khóa chặt, nhưng với sự chỉ dẫn của [breakin_helper.GetTitledFirstName], [breakin_stager.GetFirstName] nhanh chóng dẫn một nhóm kỵ sĩ hăm hở vào bên trong.\n\nKhông ai kiểm soát được lũ vật, tiếng chửi rủa, tiếng cười và cả xương gãy vang lên khi nam nữ ngã khỏi những con ngựa đang lững thững đi quanh đại sảnh!"
  feast_main_stable_breakin.0002.breakin_with_deviant:0 "Bữa ăn đang diễn ra rôm rả, và rượu thì đã hơi quá chén khi [breakin_stager.GetTitledFirstName] quyết định đã đến lúc cưỡi ngựa cho vui. Chuồng ngựa bị khóa chặt, nhưng với sự chỉ dẫn của [breakin_deviant.GetTitledFirstName], [breakin_stager.GetFirstName] nhanh chóng dẫn một nhóm kỵ sĩ hăm hở vào bên trong.\n\nHoàn toàn không kiểm soát được lũ vật, tiếng chửi rủa, tiếng cười và cả xương gãy vang lên khi nam nữ ngã khỏi những con ngựa đang lững thững đi quanh đại sảnh!"
  feast_main_stable_breakin.0002.breakin_with_noone:0 "Bữa ăn đang diễn ra rôm rả, và rượu thì đã hơi quá chén khi [breakin_stager.GetTitledFirstName] quyết định đã đến lúc cưỡi ngựa cho vui. Chuồng ngựa bị khóa chặt, nhưng [breakin_stager.GetFirstName] bằng cách nào đó vẫn dẫn được một nhóm kỵ sĩ hăm hở vào bên trong.\n\nHoàn toàn không kiểm soát được lũ vật, tiếng chửi rủa, tiếng cười và cả xương gãy vang lên khi nam nữ ngã khỏi những con ngựa đang lững thững đi quanh đại sảnh!"
  feast_main_stable_breakin.0002.bystander_riding:0 "\n\nNhững sinh vật khác trong chuồng cũng chẳng khá hơn, và một con dê suýt nữa gục xuống dưới sức nặng của [breakin_bystander.GetTitledFirstName]."
  feast_main_stable_breakin.0002.deviant_discovered:0 "\n\nTuy nhiên buổi tối bỗng rẽ sang hướng khác khi [breakin_deviant.GetTitledFirstName] bị phát hiện ở phía sau chuồng, đang thực hiện những hành vi không thể nói ra với một con bò đực! Vết nhơ của sự nhục nhã ấy sẽ không bao giờ rời khỏi linh hồn [breakin_deviant.GetHerHis]."
  feast_main_stable_breakin.0002.what_a_silly_bunch:0 "\n\nCuối cùng những người coi chuồng cũng khống chế được lũ vật hoảng loạn, và ít nhất những kẻ còn tỉnh táo trong chúng ta đã được một màn giải trí ra trò!"
  feast_main_stable_breakin.0002.a:0 "Đúng là một lũ hề khiến người ta vui mắt."
  feast_main_stable_breakin.0002.b:0 "Ôi không, con vật tội nghiệp đó!"
  feast_main_stable_breakin.0002.secret_of_my_own:0 "Thật là một chuyện... khủng khiếp..."
  feast_main_stable_breakin.0003.t:2 "$feast_main_stable_breakin.0002.t$"
  feast_main_stable_breakin.0003.breakin_with_helper:1 "Bữa ăn đang diễn ra rôm rả, và rượu thì đã hơi quá chén khi [breakin_stager.GetTitledFirstName] quyết định đã đến lúc cưỡi ngựa cho vui. Chuồng ngựa của ta bị khóa chặt, nhưng với sự chỉ dẫn của [breakin_helper.GetTitledFirstName], [breakin_stager.GetFirstName] nhanh chóng dẫn một nhóm kỵ sĩ hăm hở vào bên trong.\n\nHoàn toàn không kiểm soát được lũ vật của ta, tiếng chửi rủa, tiếng cười và cả xương gãy vang lên khi nam nữ ngã khỏi những con ngựa đang lững thững đi quanh đại sảnh!"
  feast_main_stable_breakin.0003.breakin_with_deviant:1 "Bữa ăn đang diễn ra rôm rả, và rượu thì đã hơi quá chén khi [breakin_stager.GetTitledFirstName] quyết định đã đến lúc cưỡi ngựa cho vui. Chuồng ngựa của ta bị khóa chặt, nhưng với sự chỉ dẫn của [breakin_deviant.GetTitledFirstName], [breakin_stager.GetFirstName] nhanh chóng dẫn một nhóm kỵ sĩ hăm hở vào bên trong.\n\nHoàn toàn không kiểm soát được lũ vật của ta, tiếng chửi rủa, tiếng cười và cả xương gãy vang lên khi nam nữ ngã khỏi những con ngựa đang lững thững đi quanh đại sảnh!"
  feast_main_stable_breakin.0003.breakin_with_noone:1 "Bữa ăn đang diễn ra rôm rả, và rượu thì đã hơi quá chén khi [breakin_stager.GetTitledFirstName] quyết định đã đến lúc cưỡi ngựa cho vui. Chuồng ngựa của ta bị khóa chặt, nhưng [breakin_stager.GetFirstName] bằng cách nào đó vẫn dẫn được một nhóm kỵ sĩ hăm hở vào bên trong.\n\nHoàn toàn không kiểm soát được lũ vật của ta, tiếng chửi rủa, tiếng cười và cả xương gãy vang lên khi nam nữ ngã khỏi những con ngựa đang lững thững đi quanh đại sảnh!"
  feast_main_stable_breakin.0003.bystander_riding:0 "\n\nNhững sinh vật khác trong chuồng cũng chẳng khá hơn, và một con dê suýt nữa gục xuống dưới sức nặng của [breakin_bystander.GetTitledFirstName]."
  feast_main_stable_breakin.0003.deviant_discovered:0 "\nBuổi tối bỗng rẽ sang hướng khác khi [breakin_deviant.GetTitledFirstName] bị phát hiện ở phía sau chuồng, đang thực hiện những hành vi không thể nói ra với một con bò đực của ta!\nVết nhơ của sự nhục nhã ấy sẽ không bao giờ rời khỏi linh hồn [breakin_deviant.GetHerHis]."
  feast_main_stable_breakin.0003.what_a_silly_bunch:0 "\n\nCuối cùng những người coi chuồng cũng khống chế được lũ vật hoảng loạn, và ít nhất những kẻ còn tỉnh táo trong chúng ta đã được một màn giải trí ra trò!"
  feast_main_stable_breakin.0003.a:0 "Những người coi chuồng, cứu bọn họ khỏi chính sự ngu xuẩn của mình!"
  feast_main_stable_breakin.0003.b:0 "Ngươi đang làm bại hoại lũ vật của ta!"
  feast_main_stable_breakin.0003.secret_of_my_own:0 "Samson thân mến của ta! Với [breakin_deviant.GetFirstName] ư?!"
  feast_main_stable_breakin.0004.t:2 "$feast_main_stable_breakin.0002.t$"
  feast_main_stable_breakin.0004.breakin_with_helper:0 "Ăn uống thì cũng tốt, nhưng ta muốn có chút vui vẻ!\n[breakin_helper.GetTitledFirstName] nảy ra một kế tuyệt vời liên quan đến chuồng ngựa, và ta nhanh chóng dẫn một nhóm kỵ sĩ hăm hở vượt qua những cánh cổng và ổ khóa đáng thương đó.\nTiếng la hét và cười vang lên khi chúng ta dắt ngựa vào đại sảnh, nơi ta phô diễn cho các vị khách khác một màn cưỡi ngựa tuyệt vời!"
  feast_main_stable_breakin.0004.breakin_with_deviant:0 "Ăn uống thì cũng tốt, nhưng ta muốn có chút vui vẻ!\n[breakin_deviant.GetTitledFirstName] nảy ra một kế tuyệt vời liên quan đến chuồng ngựa, và ta nhanh chóng dẫn một nhóm kỵ sĩ hăm hở vượt qua những cánh cổng và ổ khóa đáng thương đó.\nTiếng la hét và cười vang lên khi chúng ta dắt ngựa vào đại sảnh, nơi ta phô diễn cho các vị khách khác một màn cưỡi ngựa tuyệt vời!"
  feast_main_stable_breakin.0004.breakin_with_noone:0 "Ăn uống thì cũng tốt, nhưng ta muốn có chút vui vẻ!\n\nTa tự mình dẫn một nhóm kỵ sĩ hăm hở vượt qua những cánh cổng và ổ khóa canh giữ chuồng ngựa.\n\nChẳng bao lâu sau là tiếng la hét và cười vang khi các vị khách nhìn chúng ta cưỡi lũ vật chạy quanh đại sảnh!"
  feast_main_stable_breakin.0004.bystander_riding:0 "\nTrong chuồng còn có những con vật khác ngoài ngựa, và [breakin_bystander.GetTitledFirstName] cưỡi vào trên lưng một con dê! Rất vui cho đến khi nó ngã lăn ra dưới [breakin_bystander.GetHerHim]. Và sau đó vẫn rất vui."
  feast_main_stable_breakin.0004.deviant_discovered:0 "\nTuy nhiên tiếng cười và niềm vui chợt im bặt khi [breakin_deviant.GetTitledFirstName] bị phát hiện ở phía sau chuồng, đang phạm những tội lỗi không thể nói ra với một con bò đực! Đúng là một tên vô lại!"
  feast_main_stable_breakin.0004.signoff:0 "\n\nĐó là một đêm tuyệt vời, dù ký ức của ta về chi tiết có hơi mờ nhạt."
  feast_main_stable_breakin.0004.a:0 "Không thể chờ đến lần sau."
  feast_main_stable_breakin.0005.t:2 "$feast_main_stable_breakin.0002.t$"
  feast_main_stable_breakin.0005.breakin:0 "Cả hai chúng ta đều rất say, [breakin_stager.GetTitledFirstName] muốn một chút thú vị, và ta đã gieo ý tưởng rằng có lẽ nó nên liên quan đến đám thú nuôi của chủ tiệc...\n\nChẳng bao lâu sau, ta thấy mình đi theo [breakin_stager.GetHerHim] đến chuồng ngựa, nơi những vị khách say xỉn khác bắt đầu đưa ngựa vào trong hội trường!"
  feast_main_stable_breakin.0005.bystander_riding:0 "\n\nTrong đó còn có những con vật khác ngoài ngựa, và [breakin_bystander.GetTitledFirstName] cưỡi vào trên lưng một con dê, cho đến khi nó gục xuống dưới sức nặng của [breakin_bystander.GetHerHis]."
  feast_main_stable_breakin.0005.deviant_discovered:0 "\n\nTa biết việc đó sai trái thế nào, nhưng giữa mọi sự hỗn loạn ta פשוט không thể tránh xa con bò đực ở phía sau chuồng.\n\nKhi nghe thấy tiếng gọi tên ta đầy kinh hãi, ta biết danh tiếng của mình đã tiêu tan, nhưng trong khoảnh khắc ấy ta sẵn sàng gánh chịu mọi sự nhục nhã."
  feast_main_stable_breakin.0005.got_away_with_it:0 "\n\nSự hỗn loạn đó chính là điều ta cần, và ta không thể kìm mình tránh xa con bò đực ở phía sau chuồng.\nNhững việc ta làm thật sai trái, nhưng nguy cơ bị phát hiện lại khiến mọi thứ càng thêm kích thích!"
  feast_main_stable_breakin.0005.a:0 "Ta không thể ngừng nghĩ về đêm đó."
  feast_main_stable_breakin.0006.t:2 "$feast_main_stable_breakin.0002.t$"
  feast_main_stable_breakin.0006.breakin_with_helper:0 "Cả hai chúng ta đều say khướt, [breakin_stager.GetTitledFirstName] muốn tìm chút vui và nảy ra ý tưởng rằng nên liên quan đến lũ vật của chủ tiệc...\n\nChẳng bao lâu sau ta đã giúp [breakin_stager.GetHerHim] đột nhập vào chuồng, nơi chúng ta và những vị khách say xỉn khác bắt đầu dắt ngựa vào đại sảnh!"
  feast_main_stable_breakin.0006.bystander_riding:1 "\n\nTrong đó còn có những con vật khác ngoài ngựa, và [breakin_bystander.GetTitledFirstName] cưỡi vào trên lưng một con dê, cho đến khi nó gục xuống dưới sức nặng của [breakin_bystander.GetHerHis]."
  feast_main_stable_breakin.0006.deviant_discovered:0 "\n\nTuy nhiên tiếng cười và niềm vui biến mất khi [breakin_deviant.GetTitledFirstName] bị phát hiện ở phía sau chuồng, đang phạm những tội lỗi không thể nói ra với một con bò đực!"
  feast_main_stable_breakin.0006.all_in_good_fun:0 "\n\nDù sao thì cảnh tượng cũng khá vui, nên [activity.GetOwner.GetTitledFirstName] nói rõ rằng [activity.GetOwner.GetSheHe] sẽ không trừng phạt chúng ta vì hành động này."
  feast_main_stable_breakin.0006.a:0 "Vì một yến tiệc vui vẻ!"
  feast_main_stable_breakin.0007.t:2 "$feast_main_stable_breakin.0002.t$"
  feast_main_stable_breakin.0007.breakin:0 "Cả hai chúng ta đều say khướt, [breakin_stager.GetTitledFirstName] muốn tìm chút vui và nảy ra ý tưởng rằng nên liên quan đến lũ vật của chủ tiệc...\n\nChẳng bao lâu sau ta đã giúp [breakin_stager.GetHerHim] đột nhập vào chuồng, nơi chúng ta và những vị khách say xỉn khác bắt đầu cưỡi ngựa vào đại sảnh!"
  feast_main_stable_breakin.0007.bystander_riding:0 "\n\nTa cưỡi lên bất kỳ con vật nào tìm được, và sau đó mới được nói rằng đó thực ra là một con dê, việc nó gục xuống dưới sức nặng của ta giải thích vài vết bầm tím."
  feast_main_stable_breakin.0007.deviant_discovered:0 "\n\nTuy nhiên mọi thứ kết thúc đột ngột khi [breakin_deviant.GetTitledFirstName] bị bắt gặp đang tham gia một kiểu “vui chơi” rất khác với một con bò đực ở phía sau chuồng! Hẳn ta đã kinh hoàng nếu lúc đó còn tỉnh táo."
  feast_main_stable_breakin.0007.what_a_silly_bunch:0 "\n\nNghe nói chúng ta đã gây ra một cảnh tượng náo loạn. May thay nó đủ thú vị để chủ tiệc không muốn trừng phạt chúng ta."
  feast_main_stable_breakin.0007.a:0 "Ta sẽ cứ giả vờ là mình nhớ hết."
  feast_main_stable_breakin.9001.t:2 "Bớt Làm Trò Với Ngựa"
  feast_main_stable_breakin.9001.deviant_caught:1 "Yến tiệc của [host_saying_goodbye.GetTitledFirstNamePossessive] sắp kết thúc. Nghĩ đến việc phải chia tay thật buồn, dù cũng không tệ khi không còn phải ở cùng [breakin_deviant.GetTitledFirstName] và con bò đực đó..."
  feast_main_stable_breakin.9001.in_good_fun:1 "Yến tiệc của [host_saying_goodbye.GetTitledFirstNamePossessive] sắp kết thúc.\n\nThật buồn khi phải nói lời tạm biệt, nhưng ít nhất chúng ta sẽ còn có thể nhìn lại và cười về trò nghịch ngợm của [breakin_stager.GetFirstName] cùng bọn say rượu của [breakin_stager.GetHerHis] trong nhiều năm tới."
  feast_main_stable_breakin.9001.a:1 "Thật là khoảng thời gian tuyệt vời!"
  feast_main_stable_breakin.9002.deviant_caught:1 "Thật khó tin là ta sắp phải tiễn tất cả khách khứa ra về!\n\nThật buồn khi họ rời đi, ngoại trừ [breakin_deviant.GetTitledFirstName].\nDù vậy ta sẽ không thể quên mỗi khi nhìn thấy con bò đực quý của mình."
  feast_main_stable_breakin.9002.in_good_fun_or_what:1 "Các vị khách của ta đều đang rất vui vẻ!\n\nYến tiệc này đã khiến chúng ta gần gũi hơn, và chúng ta sẽ còn cười về trò nghịch ngợm của [breakin_stager.GetFirstName] cùng bọn say rượu của [breakin_stager.GetHerHis] trong nhiều năm tới.\n\n[breakin_deviant.GetTitledFirstName] thậm chí còn đùa rằng gia súc của ta thật khỏe mạnh!"
  feast_main_stable_breakin.9002.in_good_fun:1 "Các vị khách của ta đều đang rất vui vẻ!\n\nYến tiệc này đã khiến chúng ta gần gũi hơn, và chúng ta sẽ còn cười về trò nghịch ngợm của [breakin_stager.GetFirstName] cùng bọn say rượu của [breakin_stager.GetHerHis] trong nhiều năm tới."
  feast_main_stable_breakin.9002.a:0 "Hãy luôn nhớ đến ta, các chư hầu!"
  feast_main_stable_breakin.9003.deviant_caught:1 "Yến tiệc của [host_saying_goodbye.GetTitledFirstNamePossessive] cuối cùng cũng sắp kết thúc.\n\nTa thấy khó mà nhìn [breakin_deviant.GetTitledFirstName] như trước, nhưng có lẽ ta cũng nên cảm ơn [breakin_deviant.GetHerHim] vì đã thu hút mọi sự chú ý khỏi những kẻ khác trong chúng ta đã đột nhập chuồng ngựa."
  feast_main_stable_breakin.9003.in_good_fun:1 "Thật là khoảng thời gian vui vẻ!\n\n[host_saying_goodbye.GetTitledFirstName] dường như đã tha thứ cho vụ đột nhập nho nhỏ của chúng ta, khi [host_saying_goodbye.GetSheHe] thấy các vị khách khác thích thú ra sao khi xem chúng ta cưỡi ngựa."
  feast_main_stable_breakin.9003.a:0 "Xét cho cùng thì chúng ta cũng đâu làm gì quá tệ."
  feast_main_stable_breakin.9004.deviant_caught:1 "Ta biết rằng không một lãnh chúa hay quý bà nào trong vương quốc sẽ nhìn ta như trước nữa. [host_saying_goodbye.GetTitledFirstName] đã lên án tên tuổi của ta, và [breakin_stager.GetFirstName], người mà ta đã cười đùa và uống rượu cùng không lâu trước đó, giờ không thể nhìn thẳng vào ta nữa."
  feast_main_stable_breakin.9004.in_good_fun:0 "Ta không thể tin là mình đã thoát được!\nSau khi lũ vật được đưa về chuồng, ta còn khen [host_saying_goodbye.GetTitledFirstName] rằng đàn gia súc của [host_saying_goodbye.GetHerHis] thật khỏe mạnh.\n\nGiá như [host_saying_goodbye.GetSheHe] biết!"
  feast_main_stable_breakin.9004.a:0 "Từ nay ta sẽ biết kiềm chế mình! Hy vọng vậy."
