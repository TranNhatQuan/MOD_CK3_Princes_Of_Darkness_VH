l_english:
  feast_lifestyle.1001.t:2 "Lời Lẽ Chiến Tranh"
  feast_lifestyle.1001.desc:0 "Lấy quyền gì mà [strategy_opponent.GetTitledFirstName] nghĩ [strategy_opponent.GetSheHe] có thể tuyên bố rằng các ý tưởng về chiến tranh của ta là sai lầm?\n\nCho rằng ý tưởng của ta sẽ phá sản ngay khi chạm trán chiến đấu. Thực sự thì [strategy_opponent.GetSheHe] biết gì cơ chứ?"
  feast_lifestyle.1001.a:0 "Ta rất muốn có cơ hội phân định chuyện này trên chiến trường."
  feast_lifestyle.1001.a.tt:2 "Ít ra [strategy_opponent.GetFirstName] đã cho ngươi thấy rằng ngươi có thể bảo vệ sự hiểu biết của mình về [martial_lifestyle|E]."

  feast_lifestyle.1002.t:2 "Ý Nghĩa Ẩn Giấu"
  feast_lifestyle.1002.opening:0 "Những vị khách khác cười nói rôm rả trong đại sảnh ồn ào, khiến ta khó tập trung vào bát cháo trước mặt. Ta dùng ngón tay vẽ ra những đường tiến quân và giao chiến trong lớp cháo béo ngậy khi nghĩ cách đối phó với nhiều kế hoạch chiến trận khác nhau."
  feast_lifestyle.1002.cavalry:0 "\n\n#EMP Nếu kỵ binh xông xuống sườn này...#!"
  feast_lifestyle.1002.heavy_infantry:0 "\n\n#EMP Nếu bộ binh hạng nặng giữ vững đúng vị trí này...#!"
  feast_lifestyle.1002.archers:0 "\n\n#EMP Khi một cơn mưa tên trút xuống trung quân...#!"
  feast_lifestyle.1002.skirmishers:0 "\n\n#EMP Nếu quân tán chiến của ta quấy nhiễu sườn cà rốt...#!"
  feast_lifestyle.1002.pikemen:0 "\n\n#EMP Dĩ nhiên, lính thương của ta có thể chống giữ phía này...#!"
  feast_lifestyle.1002.a:0 "Có vẻ cách này có thể hiệu quả trên chiến trường thật!"
  feast_lifestyle.1002.a.tt:2 "Thật không ngờ một bát cháo lại có thể giúp ngươi mở rộng hiểu biết về [martial_lifestyle|E]."

  feast_lifestyle.1003.t:2 "Phòng Khi Nguy Biến"
  feast_lifestyle.1003.desc:0 "Giữa lúc yến tiệc náo nhiệt, ta lại chú ý nhiều hơn đến khả năng phòng thủ của đại sảnh này. Nếu ngay lúc này có một cuộc tấn công từ bên ngoài, tầng lớp quý tộc thấp sẽ là những kẻ gặp nguy hiểm trước tiên. Ngoài ra, có thể dựng một pháo lũy nhỏ từ những chiếc bàn lớn, tạo ra chút ít bảo vệ.\n\nGiờ thì, chúng ta sẽ phải bố trí phản công như thế nào..."
  feast_lifestyle.1003.a:0 "Cẩn trọng bao nhiêu cũng không thừa."
  feast_lifestyle.1003.a.tt:2 "Ngươi thà nghĩ đến những chuyện này còn hơn sống trong sự vô tư rồi chết khi ngày đó đến. Ngươi hiểu [martial_lifestyle|E] hơn thế."
  feast_lifestyle.1003.b:0 "Nhưng nếu cuộc tấn công đến từ bên trong thì sao?!"
  feast_lifestyle.1003.b.tt:3 "Thật ngu ngốc nếu nghĩ rằng mọi vị khách ở đây đều là chiến hữu của ngươi. Ngươi hiểu [martial_lifestyle|e] hơn thế."

  feast_lifestyle.1004.t:2 "Tri Thức Chia Sẻ"
  feast_lifestyle.1004.desc:0 "Yến tiệc là dịp tuyệt vời để trò chuyện với những người mà ta coi trọng ý kiến của họ. [consultant_3.GetTitledFirstName] có vài suy nghĩ thú vị về khả năng cơ động quân sự, còn [consultant_2.GetTitledFirstName] lại đưa ra vài ý tưởng về các chiến lược phòng thủ mới.\n\nTuy nhiên, [consultant_1.GetTitledFirstName] mới là người có ý tưởng thiên tài thực sự. Sau vài chén rượu, [consultant_1.GetTitledFirstName] đã thì thầm với ta điều mà [consultant_1.GetSheHe] cho là cách công thành lý tưởng!"
  feast_lifestyle.1004.a:0 "Ta học được rất nhiều từ những yến tiệc thế này."
  feast_lifestyle.1004.a.tt:2 "Trò chuyện với những chỉ huy dày dạn kinh nghiệm chắc chắn giúp ngươi hiểu rõ hơn về [martial_lifestyle|E]."

  feast_lifestyle.2001.t:2 "Biết Phận Mình Đi"
  feast_lifestyle.2001.mean:0 "Bước sang bên một chút, ta vừa kịp tránh chén rượu mà [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] của ta là [guest_victim.GetTitledFirstName] #EMP vô tình#! làm đổ khi đi ngang qua.\n\nTa bỏ qua lời sỉ nhục mới nhất của [guest_victim.GetHerHis], vì ngay lúc đó [guest_victim.Custom2('InsultNoun', ROOT.Char)] bỗng tái mét và cứng đờ."
  feast_lifestyle.2001.loud:0 ""Nhân nói đến sai lầm, ta đã kể cho các ngươi nghe chuyện khi [ROOT.Char.GetTitledFirstNameNoTooltip]—"\n\n[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] của ta là [guest_victim.GetTitledFirstName] bỗng im bặt, mặt tái nhợt."
  feast_lifestyle.2001.quiet:0 "Những ánh nhìn mà [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] của ta là [guest_victim.GetTitledFirstName] ném về phía ta khi [guest_victim.GetSheHe] thì thầm với những người xung quanh [guest_victim.GetHerHim] thật chẳng khác nào lửa bỏng.\n\nĐột nhiên lưng của [guest_victim.Custom2('InsultNoun', ROOT.Char)] cứng lại, mặt tái mét."
  feast_lifestyle.2001.desc_ending:0 "[guest_victim.GetHerHis|U] bước đi lúng túng khi [guest_victim.GetSheHe] vội vã rời khỏi căn phòng khiến ta mỉm cười, trong khi ta giấu lọ thuốc nhuận tràng nhỏ vào túi."
  feast_lifestyle.2001.a:0 "Thế là cho cái đồ [guest_victim.Custom2('InsultAdjective', ROOT.Char)] [guest_victim.Custom2('InsultNoun', ROOT.Char)] đó chừa!"

  feast_lifestyle.2002.t:2 "Lưỡi Lỏng"
  feast_lifestyle.2002.desc_lover:0 ""Với đôi mắt như thế... ta biết cưỡng lại sao được?""
  feast_lifestyle.2002.desc_cannibal:0 ""Chỉ cần nhìn kết cấu thịt là biết lúc sống chúng mạnh mẽ thế nào. Ta nhớ có một tên lính mà ta từng ăn—""
  feast_lifestyle.2002.desc_homosexual_male:0 ""Rồi ta thấy hắn mỉm cười! Nghĩ mà xem, người ta còn mong ta hài lòng với phụ nữ sau chuyện đó..."" 
  feast_lifestyle.2002.desc_homosexual_female:0 ""Rồi ta thấy nàng mỉm cười! Nghĩ mà xem, người ta còn mong ta hài lòng với đàn ông sau chuyện đó..."" 
  feast_lifestyle.2002.desc_ending:0 "\n\nSau khi uống khá nhiều, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_with_secret'))] của ta là [guest_with_secret.GetTitledFirstName] đang tựa vào bàn, vừa trút bầu tâm sự vừa rót rượu trước mặt ta.\n\n"Ngươi mang cho ta bao nhiêu rượu, lại còn ngồi nghe ta nói mãi... Cảm ơn ngươi, [ROOT.Char.GetFirstNameNoTooltip]!""
  feast_lifestyle.2002.a:0 "Chuyện này hay quá, ta không thể giữ cho riêng mình!"
  feast_lifestyle.2002.b:0 "Không, phải cảm ơn #EMP ngươi#! vì đã tiết lộ chuyện này!"
  feast_lifestyle.2002.c:0 "Ngươi biết đấy, sự im lặng của ta có giá."
  feast_lifestyle.2002.d:0 "Cạn chén! Cho một buổi tối vui vẻ và những bạn nhậu mới!"

  feast_lifestyle.2003.t:2 "Quyền Lực Ảnh Hưởng"
  feast_lifestyle.2003.desc:0 "Trôi chảy từ cuộc trò chuyện này sang cuộc trò chuyện khác, ta dẫn dắt mọi câu chuyện theo hướng ta mong muốn.\n\nChỉ vài lời nói được đặt đúng chỗ, ta đã hiểu rõ hơn về đời sống tình cảm của [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('courtier_to_persuade'))] của ta là [courtier_to_persuade.GetTitledFirstNamePossessive] hơn cả điều mà [courtier_to_persuade.GetHerHis] [courtier_to_persuade.Custom('WifeHusbandOpp')] mong muốn."
  feast_lifestyle.2003.a:0 "Yến tiệc chính là nơi rèn luyện của ta..."
  feast_lifestyle.2003.a.tt:0 "#F ...và lời nói là vũ khí của ta!#!"
  feast_lifestyle.2003.b:0 "Thôi cứ tận hưởng cuộc trò chuyện."

  feast_lifestyle.2004.t:2 "Một Câu Chuyện Chi Tiết"
  feast_lifestyle.2004.desc1_a:1 "[ROOT.Char.Custom('RandomLadyLord')] kia đang mỉm cười với một hầu gái phía bên kia đại sảnh với vẻ thân mật; có lẽ là một vụ ngoại tình."
  feast_lifestyle.2004.desc1_b:1 "[ROOT.Char.Custom('RandomLadyLord')] kia đã rót đầy chiếc ly đang nắm chặt lần thứ ba kể từ khi ngồi cùng phối ngẫu; một mối quan hệ bên bờ sụp đổ."
  feast_lifestyle.2004.desc2_a:1 "[ROOT.Char.Custom('RandomLadyLord')] ở phía bên kia đại sảnh vẫn mang đôi ủng y hệt năm trước; hẳn là đang gặp khó khăn tài chính."
  feast_lifestyle.2004.desc2_b:1 "[ROOT.Char.Custom('RandomLadyLord')] ở phía bên kia đại sảnh đứng sát tường, tránh mọi cuộc trò chuyện lẫn ánh mắt; đang che giấu bí mật chăng?"
  feast_lifestyle.2004.desc_ending:0 "\n\nAi cũng đang che giấu điều gì đó, và với con mắt tinh tường, chỉ một chi tiết nhỏ cũng có thể cho ngươi thấy toàn bộ bức tranh."
  feast_lifestyle.2004.a:1 "Chúng phô bày nỗi hổ thẹn rõ ràng quá!"
  feast_lifestyle.2004.b:0 "Không điều gì được phép thoát khỏi mắt ta!"

  feast_lifestyle.3001.t:2 "Chiếc Ghế Quyền Lực"
  feast_lifestyle.3001.desc:0 "Thật là một yến tiệc tuyệt vời! Cơ hội hoàn hảo để cả ta và [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_1'))] của ta là [important_guest_1.GetTitledFirstName] hiểu thêm về những người đang phục vụ chúng ta.\n\nCả [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_2'))] của ta là [important_guest_2.GetTitledFirstName] lẫn [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_3'))] của ta là [important_guest_3.GetTitledFirstName] đều chưa ngồi xuống, và ta nhanh chóng gọi một người hầu đến sắp xếp lại chỗ ngồi."
  feast_lifestyle.3001.a:0 "[important_guest_1.GetFirstNameNoTooltip] nên ngồi cạnh [important_guest_2.GetTitledFirstNameNoTooltip]."
  feast_lifestyle.3001.b:0 "[important_guest_1.GetFirstNameNoTooltip] hẳn sẽ thích bầu bạn với [important_guest_3.GetTitledFirstNamePossessiveNoTooltip]."
  feast_lifestyle.3001.c:0 "Cả hai sẽ dùng bữa cùng ta."
