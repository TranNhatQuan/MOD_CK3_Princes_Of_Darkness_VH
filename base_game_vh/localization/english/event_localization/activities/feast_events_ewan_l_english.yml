l_english:
 ##################################################
 # #Misc
 feasts_mischievous_t1_modifier:0 "Nụ Cười Tinh Quái"
 feasts_mischievous_t1_modifier_desc:0 "Nhân vật này dường như bình thản một cách kỳ lạ khi những kẻ xung quanh họ gặp phải các tai nạn bất ngờ đầy xấu hổ."

 feasts_mischievous_t2_modifier:0 "Kẻ Bày Trò"
 feasts_mischievous_t2_modifier_desc:0 "Những tai nạn nho nhỏ cùng các phát hiện đáng xấu hổ thường xuyên xảy ra với những ai ở gần nhân vật này."

 feasts_mischievous_t3_modifier:0 "Kẻ Gây Rối"
 feasts_mischievous_t3_modifier_desc:0 "Không ai có thể chứng minh, nhưng ai cũng ngầm biết rằng nhân vật này luôn bày mưu cho trò đùa tiếp theo của mình."

 feast_learnt_habits_modifier:0 "Đã Quan Sát Thói Quen"
 feast_learnt_habits_modifier_desc:0 "Những thói quen cá nhân của mục tiêu khi ở một mình đã bị kẻ âm mưu nắm rõ"
 feast_learnt_habits_modifier.tt:0 "$feast_learnt_habits_modifier$: $VALUE|+0=-+$"
 didnt_knock_hat_off_modifier:0 "Bị Ánh Sáng Làm Lóa Mắt"
 didnt_knock_hat_off_modifier_desc:0 "Vẻ hào nhoáng của mục tiêu sẽ chính là tai họa của ngươi!\n[GetScheme('slander').GetTypeName] [scheme|E] [success_chance|E] #P +20#!"
 didnt_knock_hat_off_modifier.tt:0 "$didnt_knock_hat_off_modifier$: $VALUE|+0=-+$"

 ##################################################
 # #Murder
 feast_events_ewan.0001.t:0 "Làm Trống Đầu Óc"
 feast_events_ewan.0001.desc.intro:0 "Hiếm có ai có thể dự trọn một buổi yến tiệc mà không cần ra ngoài một lát, tránh xa sự ồn ào náo nhiệt, dù chỉ để giải quyết nhu cầu cá nhân.\n\nMay thay cho ta, [intent_target.GetTitledFirstName] cũng không phải ngoại lệ. Từ một hốc tường gần đó, ta quan sát khi [intent_target.GetSheHe]"
 feast_events_ewan.0001.desc.high_place:0 "đứng nhìn ra ngoài cửa sổ của tòa tháp cao và cô độc này. Rõ ràng là đang thưởng thức khung cảnh đẹp đến chết người — chỉ cần một cú đẩy mạnh, sắc gọn là mọi vấn đề của ta sẽ chấm dứt. Thậm chí trông còn như một tai nạn."
 feast_events_ewan.0001.desc.water:0 "lang thang dọc theo mép [activity.GetHost.Custom('IndefiniteBodyOfWater')] gần bức tường. Chiếc dùi cui trong tay ta siết chặt — chỉ cần đánh [intent_target.GetHerHim] đủ mạnh để [intent_target.GetSheHe] choáng váng — phần còn lại nước sẽ lo, và thậm chí trông cũng như một tai nạn."
 feast_events_ewan.0001.desc.critter:1 "dạo bước trên lối đi trong sân. Trong tay ta (hy vọng là vẫn kiểm soát được) là một con [SCOPE.Custom('VenomousCreature')] có nọc độc. Hung dữ, chết người — ta chỉ cần ném nó vào một mảng da trần để nó tự hoàn thành công việc độc ác của mình."
 feast_events_ewan.0001.desc.rock:0 "đi dọc qua những vật trang trí trong sân. Tảng đá trong tay ta khá nặng, lại có một mũi nhọn hiểm ác — một cú ném chuẩn xác vào hộp sọ hẳn là đủ để hoàn thành việc đen tối này."
 feast_events_ewan.0001.desc.outro:0 "\n\nTa nắm được yếu tố bất ngờ, nên nếu kế hoạch trục trặc thì chạy thoát kịp lúc cũng chẳng phải vấn đề. Đáng tiếc là chỉ cần tra hỏi đôi chút, [intent_target.GetFirstNameNoTooltip] rất có thể sẽ nhận ra sự vắng mặt đáng ngờ của ta."
 feast_events_ewan.0001.a:0 "Được rồi, một cú đẩy dứt khoát và..."
 feast_events_ewan.0001.a.tt.success:0 "[intent_target.GetSheHe] rơi xuống!"
 feast_events_ewan.0001.a.tt.failure:0 "[intent_target.GetFirstNameNoTooltip] tự ném [intent_target.GetHerselfHimself] sang một bên"
 feast_events_ewan.0001.b:0 "Một cú đánh chắc tay, một cú đẩy mạnh, và..."
 feast_events_ewan.0001.b.tt.success:0 "Choáng váng, [intent_target.GetFirstNameNoTooltip] gục xuống dưới làn nước"
 feast_events_ewan.0001.b.tt.failure:0 "[intent_target.GetSheHe|U] ngã nhào nhưng vẫn còn tỉnh"
 feast_events_ewan.0001.c:0 "Cú ném phải có #EMP vừa đủ#! lực..."
 feast_events_ewan.0001.c.tt.success:1 "Con [SCOPE.Custom('VenomousCreature')] tấn công"
 feast_events_ewan.0001.c.tt.failure:0 "Sinh vật bật ra rồi bỏ chạy"
 feast_events_ewan.0001.d:0 "Được rồi, ta phải ném trúng đầu [intent_target.GetHerHim]..."
 feast_events_ewan.0001.d.tt.success:0 "Ngươi đánh trúng thái dương của [intent_target.GetHerHim]"
 feast_events_ewan.0001.d.tt.failure:0 "Ngươi ném trượt"
 feast_events_ewan.0001.e:0 "Có lẽ ta nên quan sát thì hơn?"
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme.overwrite:0 "Điều này sẽ ghi đè phần thưởng tiềm năng của ngươi cho [GetScheme('murder').GetTypeName] [ROOT.Char.Var('feast_events_ewan_0001_bonus_value').GetTitledFirstName]"
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme:0 "Ngươi sẽ nhận được #P [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_added_base_success_value')|=+0]%#! tỉ lệ thành công cho bất kỳ [GetScheme('murder').GetTypeName] [scheme|E] nào ngươi khởi xướng chống lại [intent_target.GetTitledFirstName] trong [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_time_to_use_value')|0] năm tới"
 feast_events_ewan.0001.f:0 "Đây là một ý tưởng ngu ngốc."


 ##################################################
 # #Seduce
 feast_events_ewan.0201.t:0 "Bữa Tối Và Một Màn Trình Diễn"
 feast_events_ewan.0201.desc.intro:0 "Ngồi đối diện [intent_target.Custom2('MyCharacterIntroduction', ROOT.Char)] cho ta vô số cách trêu ghẹo [intent_target.GetHerHim] mà vẫn không phá vỡ phép tắc lễ nghi.\n\n"
 feast_events_ewan.0201.desc.meat.dramatic_snap:0 ""... dĩ nhiên, tất cả là ở việc phải", ta bẻ gãy khúc xương nhỏ của con [activity.GetHost.Custom('RegionalEdibleAnimal')] trong tay một cách khéo léo, "#EMP chắc tay#!. Ngươi không nghĩ vậy sao?""
 feast_events_ewan.0201.desc.meat.sink_teeth:0 "Chậm rãi, có chủ ý, ta để răng mình cắm vào miếng thịt #EMP ngon tuyệt#! của [activity.GetHost.Custom('RegionalEdibleMeat')], nhẹ nhàng nhưng chắc chắn xé miếng thịt ra."
 feast_events_ewan.0201.desc.meat.lick:0 "Với một cái liếm đầy hào sảng nhưng uể oải, ta thu một ngụm lớn nước sốt bao phủ phần [activity.GetHost.Custom('RegionalEdibleAnimal')] của mình. Chúng ta duy trì giao tiếp bằng mắt suốt thời gian đó."
 # Weird phrasing to write around a/an because I'm not making a damned Article_RegionalRootVegetablePlural custom loc.
 feast_events_ewan.0201.desc.veggie.suggestive_gesture:0 "Chậm rãi, đầy trêu chọc, ta đưa ngón tay chạy dọc theo đường cong của một cặp [activity.GetHost.Custom('RegionalRootVegetablePlural')], dịu dàng vuốt ve chúng. Đến cuối, ta khẽ kéo móng tay qua bề mặt, để lại một vết xước rất nhẹ."
 feast_events_ewan.0201.desc.veggie.sink_teeth:0 "Đầy hứng khởi, ta cắn mạnh vào một củ [activity.GetHost.Custom('RegionalRootVegetable')] to lớn, mọng nước, #EMP rắn chắc#!, để một ít dịch chảy ra và rơi xuống cằm ta. Hài lòng, lưỡi ta ló ra liếm sạch môi."
 feast_events_ewan.0201.desc.veggie.deep_bite:0 "Với vẻ kịch tính, bàn tay giơ cao của ta thả một miếng [activity.GetHost.Custom('RegionalRootVegetable')] nhỏ vào miệng, và ta nuốt xuống với sự thỏa mãn #EMP nghe rõ#!. Mắt ta thậm chí còn đảo nhẹ về phía sau, như để tăng thêm chút gia vị."
 feast_events_ewan.0201.desc.outro:0 "\n\nTa có thể thấy từ nét mặt của [intent_target.GetHerHis] rằng [intent_target.GetFirstNameNoTooltip] đã hiểu thông điệp của ta. Điều ta chưa rõ là biểu cảm của [intent_target.GetHerHis] — đó là hứng thú dâm đãng hay là dạ dày đang cuộn lên? Thật khó mà nói."
 feast_events_ewan.0201.a:0 "Có lẽ thêm một miếng nữa để nhấn mạnh ý tứ."
 feast_events_ewan.0201.a.tt.success:0 "Ồ, [ROOT.Char.GetFirstNameNoTooltip]..."
 feast_events_ewan.0201.a.tt.failure:0 "Ngươi #EMP đang#! làm cái gì vậy?"
 feast_events_ewan.0201.b:0 "Thế này không ổn. Có lẽ [intent_target.GetSheHe] thích trò chuyện thẳng thắn?"
 feast_events_ewan.0201.b.tt.success:0 "Cuộc trò chuyện của ngươi trở nên thú vị hơn"
 feast_events_ewan.0201.b.tt.failure:0 "Nhân danh [intent_target.GetFaith.KnowledgeGodName], ngươi thật tẻ nhạt!"
 feast_events_ewan.0201.c:0 "Chuyện này không... nóng bỏng như ta hy vọng..."


 ##################################################
 # #Befriend
 feast_events_ewan.0401.t:0 "Bụng Réo"
 feast_events_ewan.0401.desc.intro:0 "Ta đã mất gần cả buổi tối để tiếp cận [intent_target.GetTitledFirstName] mà không khiến mọi thứ trở nên gượng ép. Dù sao thì, tình bạn tốt nhất luôn đến một cách tự nhiên, và ta muốn [intent_target.GetHerHim] nghĩ rằng việc này hoàn toàn ngẫu nhiên.\n\n"
 feast_events_ewan.0401.desc.target_personality.flamboyant: ""Nhân danh [intent_target.GetFaith.WealthGodName]", người bạn có lẽ sắp thành của ta kêu lên, gần như không giấu nổi một tiếng ợ, "món này #EMP nặng#! quá. Lại còn ngay sau món nặng trước đó! Nó đè nặng trong dạ dày quá mức. Ta thật không thể tin rằng bọn gia nhân lại mong tiếp tục phục vụ [activity.GetHost.Custom('MistressMaster')] của mình theo cái kiểu tệ hại này.""
 feast_events_ewan.0401.desc.target_personality.sedate:0 "Người [intent_target.GetWomanMan] khẽ gẩy thức ăn của [intent_target.GetHerHis], đẩy vài miếng nhỏ trên chiếc đĩa gỗ dính mỡ.\n\n"Thật sự có hơi... nặng nề, phải không? Món này, món trước đó, món trước #EMP nữa#!, và", [intent_target.GetSheHe] lo lắng liếc nhìn người hầu đang mang ra vòng món tiếp theo, "cả món kế nữa. Quá nhiều thức ăn béo ngậy liên tiếp, khi thứ chúng ta thực sự cần là một thứ gì đó làm sạch vị giác.""
 feast_events_ewan.0401.desc.target_personality.fallback:0 "Người [intent_target.GetWomanMan] nhẹ nhàng chấm các góc miệng của [intent_target.GetHerHis] bằng một góc khăn trải bàn đã bẩn, gạt đi những vụn bánh ngọt rơi.\n\n"Ta chỉ mong món tiếp theo nhẹ hơn một chút", [intent_target.GetSheHe] nhận xét, "ý nghĩa của yến tiệc là mang lại trải nghiệm ẩm thực phong phú và đa dạng, nhưng đến giờ nó lại giống như đang cố nhồi nhét chúng ta hơn là khiến ta thích thú.""
 feast_events_ewan.0401.a:0 "Đúng vậy — đáng tiếc ta nghĩ đó chỉ là lựa chọn tệ hại."
 feast_events_ewan.0401.a.tt.success:0 "Ngươi khiến [intent_target.GetHerHim] hoàn toàn bị chinh phục"
 feast_events_ewan.0401.a.tt.partial_success:0 "[intent_target.GetSheHe|U] muốn nói chuyện thêm"
 feast_events_ewan.0401.a.tt.failure:0 "Ngươi thú vị, nhưng chưa đủ thú vị"
 feast_events_ewan.0401.b:0 ""Ngươi... #EMP có#! nhận ra đây là yến tiệc của ta không?""
 feast_events_ewan.0401.c:0 ""Cất giọng lớn ca ngợi bữa tiệc.""
 feast_events_ewan.0401.d:0 "Chuyển sang chủ đề ít gây tranh cãi hơn."


 ##################################################
 # #Mischief
 feast_events_ewan.0601.t:0 "Chỉ Là Trò Đùa"
 feast_events_ewan.0601.desc.intro:0 "Theo ta, nhà bếp luôn là nơi tốt nhất để gây một chút #EMP rắc rối#!. Tất nhiên là miễn đám gia nhân không bắt gặp.\n\nCó quá nhiều mục tiêu tiềm năng, mà thời gian lại quá ít: ta nên động tay vào khay [activity.GetHost.Custom('GetExpensiveDrink')], món chính cầu kỳ ở giữa bàn, hay chiếc bàn nhỏ bày các món phụ giữa những lượt món?\n\nDù chọn gì, ta cũng đã chuẩn bị sẵn một thứ để phá hỏng đêm nay của ai đó —"
 # This next one's for you, dear James.
 feast_events_ewan.0601.desc.dead_rat:0 "một con chuột chết cực kỳ hôi thối, gần như sắp nổ tung."
 feast_events_ewan.0601.desc.humongous_beetle:0 "một con bọ khổng lồ, hiện đang kiệt sức. Nhưng sau khi nghỉ ngơi một chút, nó sẽ lại bò ngo ngoe thôi."
 feast_events_ewan.0601.desc.raw_eyeball:0 "một con mắt sống khổng lồ."
 feast_events_ewan.0601.desc.used_sponge:0 "một miếng bọt biển đã được... #EMP sử dụng#! rất rõ ràng."
 feast_events_ewan.0601.desc.rotten_vegetable:0 "một củ [activity.GetHost.Custom('RegionalRootVegetable')] thối rữa bốc mùi đến mức ta cũng ngạc nhiên vì đã giấu được nó."
 feast_events_ewan.0601.desc.dodgy_mushroom:0 "một cây nấm mà ta cực kỳ chắc chắn sẽ khiến bất kỳ ai ăn phải phải chạy thẳng tới nhà xí. Có lẽ suốt cả buổi tối."
 feast_events_ewan.0601.desc.hank_of_hair:0 "một túm lông nhỏ từ một con vật trong sân. Không phải tóc trên đầu."
 feast_events_ewan.0601.a:0 "Làm bẩn đồ uống."
 feast_events_ewan.0601.a.tt.success:0 "Ngươi ra vào nhanh như lời thì thầm của quỷ"
 feast_events_ewan.0601.a.tt.failure:0 "Ngươi thiếu sự khéo léo để hành động lén lút"
 feast_events_ewan.0601.b:0 "Phá hỏng đĩa món sang trọng."
 feast_events_ewan.0601.b.tt.success:0 "$feast_events_ewan.0601.a.tt.success$"
 feast_events_ewan.0601.b.tt.failure:0 "$feast_events_ewan.0601.a.tt.failure$"
 feast_events_ewan.0601.c:0 "Làm hỏng món phụ."
 feast_events_ewan.0601.c.tt.success:0 "$feast_events_ewan.0601.a.tt.success$"
 feast_events_ewan.0601.c.tt.failure:0 "$feast_events_ewan.0601.a.tt.failure$"
 feast_events_ewan.0601.d:0 "Chuyện này không đáng để ta bận tâm."


 ##################################################
 # #Relax
 feast_events_ewan.0801.t:0 "Bầu Không Khí Dễ Chịu"
 feast_events_ewan.0801.desc.intro:0 "Ahhh, còn gì vui vẻ hơn một yến tiệc thịnh soạn?\n\nKhách khứa qua lại tấp nập, vừa ăn vừa chuyện trò trong khi ánh đuốc chập chờn hắt lên mọi bức tường, ánh sáng bật qua lại khắp đại sảnh như tiếng cười vang dội."
 feast_events_ewan.0801.desc.lustful:0 "Biết bao món ăn... #EMP hấp dẫn#! để [ROOT.Char.Custom('SenseObserve_EyeTaste')], biết bao cơ hội cho những ánh nhìn lén lút, thậm chí một cuộc hẹn vụng trộm.\n\nCó lẽ là hai."
 feast_events_ewan.0801.desc.chaste:0 "Chỉ đơn giản là приятно khi thấy nhiều người vui vẻ mà không cần phải dựa vào khoái lạc xác thịt."
 feast_events_ewan.0801.desc.gluttonous:0 "Và thức ăn! Ôi, thức ăn... nhân danh [ROOT.Char.GetFaith.HealthGodName], ta #EMP yêu#! một bữa ăn no nê. Hoặc năm bữa."
 feast_events_ewan.0801.desc.temperate:0 "\n\nDĩ nhiên, ta không quá hứng thú với các món cầu kỳ, nhưng ta vẫn có thể tận hưởng bầu bạn tốt đẹp và tinh thần vui vẻ trong khi nhấm nháp ổ bánh mì của mình."
 feast_events_ewan.0801.desc.greedy:0 "\n\nTrong một yến tiệc, ai cũng có chút tham lam vì điều gì đó — nói thật, thật dễ chịu khi thấy thế gian #EMP thành thật#! như vậy, dù chỉ một lần."
 feast_events_ewan.0801.desc.generous:0 "\n\nCó điều gì đó thật dễ chịu trong việc cho người khác ăn, cùng bẻ bánh mì và nâng chén trong cùng một căn phòng."
 feast_events_ewan.0801.desc.lazy:0 "Còn ta? Ta chẳng cần nhúc nhích một ngón tay. Người, thức ăn, rượu, gối tựa, gia nhân — tất cả đều đến với ta mà ta không cần động tay. #EMP Hoàn hảo#!."
 feast_events_ewan.0801.desc.diligent:0 "Điều phối từng ấy người và gia nhân là một nhiệm vụ ít được coi trọng, lại đầy khó khăn tinh tế, và thật dễ chịu khi thấy nó được thực hiện trọn vẹn."
 feast_events_ewan.0801.desc.wrathful:0 "Đôi khi ta #EMP có thể#!... trở nên cực kỳ nóng nảy. Nhưng ở đây, lúc này, ta lại bình tĩnh, thậm chí trầm ổn.\n\nSự thay đổi nhịp điệu này thật dễ chịu."
 feast_events_ewan.0801.desc.calm:0 "\n\nCó người cho rằng yến tiệc là nơi hỗn loạn, nhưng với ta, đó lại là pháo đài của sự bình yên và hòa thuận xã giao. Dẫu sao thì ai cũng dễ chịu hơn khi bụng no và chén đầy."
 feast_events_ewan.0801.desc.patient:0 "\n\nTa thậm chí còn thích khoảng thời gian chờ giữa các món — đó không chỉ là cơ hội để cười nói, mà còn để suy ngẫm về món vừa ăn và tâm ý đặt vào đó."
 feast_events_ewan.0801.desc.impatient:0 "\n\nMột yến tiệc tử tế là một trong số ít nơi mà ngươi hiếm khi phải chờ đợi điều gì. Muốn ăn? Có ngay. Cần rượu? Họ sẽ rót. Muốn trò chuyện? Bầu bạn khắp nơi. Thật là thiên đường."
 feast_events_ewan.0801.desc.arrogant:0 "\n\nGiao thiệp với những kẻ thấp kém hơn mình như thế này cũng khiến ta thấy dễ chịu, khi [ROOT.Char.Custom('FootFeet')] ta gác lên ghế đẩu, ban phát thiện ý của mình cho đám quý tộc nhỏ bé."
 feast_events_ewan.0801.desc.humble:0 "Biết bao người từ khắp lãnh địa tụ hội về đây. Điều đó khiến ta nhận ra thế gian rộng lớn đến nhường nào."
 feast_events_ewan.0801.desc.deceitful:0 "\n\nTa đã gieo vài lời đồn giữa đám đông rồi, chỉ để mua vui. Thật thú vị khi xem một lời nói dối lan nhanh đến mức nào, ngay cả khi chẳng có mục đích nào khác ngoài gây ra chút hỗn loạn."
 feast_events_ewan.0801.desc.honest:0 "Hiếm có biểu hiện nào chân thực hơn của cuộc sống con người như thế này. Trần trụi, chân thành — chỉ là con người tận hưởng bầu bạn của con người."
 feast_events_ewan.0801.desc.craven:0 "Có điều gì đó thật yên tâm khi ở giữa nhiều người như vậy, như thể chẳng có chuyện gì có thể xảy ra.\n\nCó lẽ vậy."
 feast_events_ewan.0801.desc.brave:0 "Chúng ta là một đám hỗn tạp, đúng thế, nhưng ngay lúc này ta cảm thấy bữa tiệc này có thể đối đầu cả thế giới và chiến thắng."
 feast_events_ewan.0801.desc.shy:0 "Ta yên vị nơi một góc bàn, trò chuyện với vài người thú vị.\n\nThật tốt khi có dịp giao thiệp mà không bị choáng ngợp."
 feast_events_ewan.0801.desc.gregarious:0 "\n\nThật tiếc khi chúng ta không mời thêm vài vị khách nữa, chỉ thêm một bàn thôi cũng được, nhưng không phải ai cũng có tinh thần tiệc tùng. Có lẽ không phải ai cũng vậy, nhưng #EMP ta#! thì có, và một mình ta cũng bằng một hai bàn rồi!"
 feast_events_ewan.0801.desc.ambitious:0 "Biết bao cơ hội để trò chuyện, gặp gỡ, thảo luận, và hoạch định. Mỗi cuộc trò chuyện mới là hạt giống của một mục tiêu mới, mỗi món ăn là cái cớ để kết thêm một mối quan hệ."
 feast_events_ewan.0801.desc.content:0 "Ta không nghĩ ra điều gì cần thay đổi. Mọi thứ đều... hoàn hảo."
 feast_events_ewan.0801.desc.arbitrary:0 "\n\nDĩ nhiên, không phải mọi thứ đều đúng như ý ta, nhưng đó là bản chất của những buổi tụ họp này. Lần sau sẽ khác, và sự thay đổi ấy khiến ta có điều để mong đợi."
 feast_events_ewan.0801.desc.just:0 "\n\nTa luôn thấy trật tự tự nhiên của một yến tiệc thật thú vị. Bàn ghế sắp đặt ngay ngắn, thứ bậc xã hội lặng lẽ được giữ vững, mọi người cười nói vui vẻ đúng vị trí của mình. Chính xác nơi họ nên ở."
 feast_events_ewan.0801.desc.cynical:0 "Dĩ nhiên, phần lớn bọn họ chỉ đến để ăn uống bằng tiền của kẻ khác, nhưng ta có quyền gì để phán xét? Đó chẳng phải lựa chọn đáng trách, và thức ăn thì #EMP ngon tuyệt#!."
 feast_events_ewan.0801.desc.zealous:0 "\n\nTa lẩm bẩm một lời cầu nguyện ngắn với [ROOT.Char.GetFaith.HealthGodName], tạ ơn vì món ăn tuyệt vời tiếp theo đang được dọn tới. Thật vậy, tạo vật của [ROOT.Char.GetFaith.CreatorName] đầy rẫy điều kỳ diệu, và món ăn ngon chắc chắn không phải phép màu nhỏ nhất."
 feast_events_ewan.0801.desc.paranoid:0 "\n\nTa luôn cảnh giác với mọi dấu hiệu nguy hiểm, cố ý hay vô tình, được lên kế hoạch hay bộc phát. Mức độ vừa đủ để khớp với dự đoán của ta — không quá rõ ràng để thành âm mưu hiển nhiên, cũng không quá ít để chứng tỏ âm mưu đã bị che giấu. Hoàn hảo."
 feast_events_ewan.0801.desc.trusting:0 "\n\nDĩ nhiên, khi ai nấy đều vui vẻ như vậy và có quá nhiều món ngon để thử, ai lại mang ác ý đến một buổi tụ họp như thế? Không, đây là một dịp vui, và ta cũng vui theo."
 feast_events_ewan.0801.desc.compassionate:0 "Thật vui khi thấy lòng tốt của con người được chia sẻ rộng rãi như vậy."
 feast_events_ewan.0801.desc.callous:0 "\n\nKhông phải ta sẽ #EMP quá#! bận tâm nếu những kẻ khác không vui, nhưng ta vẫn có thể thưởng thức bầu không khí dễ chịu này. Trong chừng mực."
 feast_events_ewan.0801.desc.sadistic:0 "Ta thích tiếng hét và tiếng nức nở chẳng kém gì một [ROOT.Char.GetTitleAsNameNoTooltip] bình thường khác, nhưng tiếng cười vui vẻ đôi khi cũng là một sự thay đổi thú vị."
 feast_events_ewan.0801.desc.stubborn:0 "Ta đã nghĩ đến việc đứng dậy đi dạo như nhiều người khác, nhưng như thế nghĩa là phải nhường chỗ ngồi này, và ta thề sẽ không nhường."
 feast_events_ewan.0801.desc.fickle:0 "Ta nghĩ điều ta thích nhất ở yến tiệc #EMP hẳn#! là thức ăn. Không, là con người. Thực ra có lẽ là rượu? Hay là trò giải trí, hay..."
 feast_events_ewan.0801.desc.vengeful:0 "\n\nDĩ nhiên, một phần không nhỏ niềm vui của ta đến từ người hầu ta vừa khiến vấp ngã, giờ đang bị phủ đầy món khai vị nhớp nháp. Đáng đời tên khốn vì đã quên rót thêm rượu cho ta ở lượt trước."
 feast_events_ewan.0801.desc.forgiving:0 "\n\nTa hơi lo rằng gia nhân đã bỏ qua chén của ta lần trước họ đi qua, nhưng vẫn còn lượt món tiếp theo. Thật ra đó cũng là điều tuyệt vời của yến tiệc — #EMP luôn#! có món tiếp theo."
 feast_events_ewan.0801.desc.outro:0 "\n\nĐôi khi thật tốt khi chỉ ngồi lại và tận hưởng những điều nhỏ bé của cuộc sống."
 feast_events_ewan.0801.a:0 "Đây chính là nơi ta muốn ở."
 feast_events_ewan.0801.b:0 "Ở đây có nhiều người tốt để giao thiệp."
 feast_events_ewan.0801.c:0 "Cơ hội để được thấy ta đứng cạnh những kẻ quyền quý!"

