l_english:
  feast_events_tova.0001.t: "Kỳ Quan Lưu Danh Muôn Đời"
  feast_events_tova.0001.desc: "Các vị khách của ta bước đi như đang lạc trong một giấc mộng ban ngày, say mê trước mái vòm rực nắng và đài phun nước tráng lệ của cung điện. Hương trầm đậm đà trong khu vườn lan tỏa khắp không gian, mang lại cảm giác dễ chịu cho trái tim và tâm hồn của bất cứ ai chạm đến nó. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ngài thật sự đã vượt xa chính mình với nơi này! Tay nghề của các kiến trúc sư của ngài tỏa sáng trong từng chi tiết,\" [honorary_guest.GetTitledFirstName] lên tiếng, và một làn sóng tán thưởng lan qua đám đông đang vây quanh hắn. \n\nMọi vị khách có mặt đều quay lại nhìn ta đầy chờ đợi, như thể đang đợi ta nói vài lời về cung điện này."
  feast_events_tova.0001.a: "Một nơi xứng đáng để đón tiếp những chiến binh hùng mạnh như chúng ta!"
  feast_events_tova.0001.b: "Để ta dẫn ngươi tham quan một vòng, [honorary_guest.GetTitledFirstNameNoTooltip]."
  feast_events_tova.0001.b.success: "Sự phô bày xa hoa của ngươi khiến [honorary_guest.GetTitledFirstNameNoTooltip] vô cùng ấn tượng"
  feast_events_tova.0001.b.failure: "Cung điện của ngươi khiến [honorary_guest.GetTitledFirstNameNoTooltip] ấn tượng, nhưng lời khoe khoang của ngươi chẳng ai buồn nghe"
  feast_events_tova.0001.c: "Quả thật, đây là minh chứng vĩ đại cho sự trị vì của ta."
