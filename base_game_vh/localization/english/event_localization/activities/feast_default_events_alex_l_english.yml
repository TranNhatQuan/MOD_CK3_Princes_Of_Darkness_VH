l_english:
  feast_default_alex.100.t:0 "Ký Ức Chung"
  feast_default_alex.100.desc:0 "[guest.Custom('quirk_pos_present')] khi [guest.GetSheHe] tiến lại gần ta, [guest.GetTitledFirstName], [root_scope.Custom2('RelationToMeShort', SCOPE.sC('guest'))] của ta.\n\n\"[guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] [root_scope.Custom('ComplimentAdjective')] của ta! Những tháng ngày chúng ta đã cùng trải qua! Biết bao ký ức!\" [guest.GetSheHe|U] cười lớn. \"Như mọi khi, thật là một ngày vui khi ta được hưởng phúc bầu bạn cùng ngài.\"\n\n\"À, phải đấy!\" [other_guest.GetTitledFirstName] gần đó hào hứng chen vào, \"Người ta vẫn kể về quá khứ của ngài: khi [guest_memory.GetThirdPerspectiveDescription]!\""
  feast_default_alex.100.aa:0 "\"Ta chẳng nhớ điều gì đáng kể.\""
  feast_default_alex.100.a:0 "\"Mong rằng chúng ta sẽ còn có những ký ức đẹp phía trước, [guest.GetFirstNameNoTooltip].\""
  feast_default_alex.100.b:0 "\"À, quả là một ngày #EMP tuyệt vời#!!\""
  feast_default_alex.200.t:0 "Tai Ương Lời Đồn"
  feast_default_alex.200.desc:0 "\"[guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] của ta, ta đã nghe tin đồn về một bệnh dịch gọi là [epidemic.GetName]...\" [guest.GetTitledFirstName] nói đầy lo lắng.\n\n\"Nghe nói nó đang lan tràn ở [afflicted_top_liege.GetPrimaryTitle.GetBaseName], với các nạn nhân là [sick_peasant.Custom('disease_desc_short')]... ngay cả [root_scope.Custom('GetExpensiveMeal')] cũng không thể làm ta quên đi điều đó.\""
  feast_default_alex.200.a:0 "Hừm, chúng ta nên chuẩn bị cho [root_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]..."
  feast_default_alex.200.b:0 "Lại đây, bình tâm nào."
  feast_default_alex.200.c:0 "Hãy cầu nguyện cho [afflicted_top_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
  feast_default_alex.200.d:0 "Đừng lo, nó sẽ không bao giờ tới đây!"
  plague_preparations_modifier:0 "Chuẩn Bị Chống Dịch"
  plague_preparations_modifier_desc:0 "Vùng đất này đã được chuẩn bị kỹ càng cho bất kỳ trận dịch nào kéo đến."
