l_english:
  ACTIVITY_LOG_ENTRY_EFFECT:1 "#S Hiệu Ứng#!\n$EFFECT$"
  activity_tournament_province_desc:2 "Ngươi tổ chức một Giải Đấu tại [ROOT.Province.GetName]\nCác tỉnh có công trình phù hợp sẽ cung cấp giảm giá [gold_i][gold|E]"
  activity_feast_guest_desc:0 "$BULLET_WITH_TAB$Người tham gia có thể tăng [opinion|E] với các nhân vật dự tiệc\n$BULLET_WITH_TAB$Người tham gia có thể giảm [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$Người tham gia có thể nhận đặc tính [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait|E]"
  activity_tournament_guest_desc:1 "#weak Nếu ngươi đủ điều kiện, tham gia một Giải Đấu sẽ mang lại cơ hội thắng các cuộc thi và do đó nhận phần thưởng, đồng thời thư giãn và thưởng thức cảnh tượng cùng âm thanh xung quanh. Nó cũng mang lại cơ hội để ngươi rèn luyện kỹ năng võ nghệ của mình.#!"

  guest_friendship_title:0 "$activity_pulse_action_guest_friendship$"
  activity_pulse_action_guest_friendship:0 "[second.GetShortUINameNoTooltip|U] Khen Ngợi [first.GetShortUINameNoTooltip|U]"
  guest_insulted_title:0 "$activity_pulse_action_guest_insulted$"
  activity_pulse_action_guest_insulted:0 "[second.GetShortUINameNoTooltip|U] Xúc Phạm [first.GetShortUINameNoTooltip|U]"

 # Tournament - Activity Invalidated
  activity_system.0040.t:1 "Giải Đấu Kết Thúc"
  activity_system.0040.desc:1 "Than ôi! Với hoàn cảnh mới xoay quanh Giải Đấu, một cuộc trò chuyện nhanh với ban tổ chức xác nhận nỗi lo của ngươi: Giải Đấu phải bị hủy bỏ.\n\nDòng người buồn bã lần lượt rời đi, những đứa trẻ thất vọng khịt mũi nắm chặt tay cha mẹ. Hy vọng rằng trong tương lai gần, sẽ có cơ hội khác để những lễ hội này tiếp tục."
  activity_system.0040.a:1 "Thật đáng tiếc."

 # New Host after Character Death
  activity_system.0080.t:1 "Chủ Tổ Chức Mới"
  activity_system.0080.desc:2 "Sau cái chết của chủ tổ chức trước đó, những lời thì thầm vội vã giữa các nhà tổ chức liên quan nhanh chóng lan rộng. Tất cả những người có mặt vẫn đi lại vui vẻ, hoàn toàn không hay biết sự hoảng hốt đang diễn ra phía sau hậu trường.\n\nCuối cùng, một thỏa thuận đã đạt được."
  activity_system.0080.desc_other:0 "Lễ hội sẽ tiếp tục, nhưng lần này dưới sự dẫn dắt của [host.GetTitledFirstName]!"
  activity_system.0080.desc_me:0 "Lễ hội sẽ tiếp tục, và ta sẽ đứng ra dẫn dắt!"
  activity_system.0080.a:0 "Hãy tiếp tục."

 #Pilgrimages: New Host after Character Death
  activity_system.0081.t:1 "Điểm Đến Cuối Cùng"
  activity_system.0081.desc.relation_family_liked:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] thân yêu của ta, [old_host.GetTitledFirstName], không may đã rời khỏi thế gian này và,"
  activity_system.0081.desc.relation_liked:0 "Người thân mến của ta, [old_host.GetTitledFirstName], không may đã rời khỏi thế gian này và,"
  activity_system.0081.desc.relation_family:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] của ta, [old_host.GetTitledFirstName], không may đã rời khỏi thế gian này và,"
  activity_system.0081.desc.relation_neutral:0 "Thật không may, [old_pilgrimage_host.GetTitledFirstName] đã rời khỏi thế gian này và,"
  activity_system.0081.desc.outro:0 "với tư cách là người thừa kế của [old_host.GetHerHis], ta được giao trách nhiệm.\n\nVì vậy, bất kể cảm xúc của bản thân, ta phải quyết định cách xử lý thi hài và nghi lễ cuối cùng cho [old_host.GetHerHis]."
  activity_system.0081.a:0 "[ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip] là quê nhà của [old_host.GetHerHis]."
  activity_system.0081.a.tt:0 "[old_host.GetShortUIName] sẽ được an táng tại [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"
  activity_system.0081.b:0 "[old_host.GetSheHe|U] xứng đáng được yên nghỉ trong sự linh thiêng của [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
  activity_system.0081.b.tt:0 "[old_host.GetShortUIName] sẽ được an táng tại [THIS.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]"
  activity_system.0081.c:0 "Chúng ta đưa [old_host.GetHerHim] đến [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], rồi trở về nhà."
  activity_system.0081.c.tt:0 "[THIS.Char.GetInvolvedActivity.GetName] sẽ tiếp tục và [old_host.GetShortUIName] sẽ được an táng tại [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"

 # Intent Invalidated
  activity_system.0090.t:0 "Ý Định Không Còn Hiệu Lực"
  activity_system.0090.desc:1 "Với sự thay đổi của hoàn cảnh hiện tại, rõ ràng ý định trước đây của ta không thể tiếp tục theo đuổi. Những người khác đi ngang qua ta một cách vui vẻ khi ta suy ngẫm về tình cảnh của mình, hoàn toàn không nhận ra sự bối rối nhẹ của ta.\n\nTrái tim ta còn mong muốn điều gì nữa? Có lẽ ta nên thư giãn một chút?"
  activity_system.0090.a:1 "Đã đến lúc chuyển sự chú ý sang nơi khác."

 # Intent Target Invalidated
  activity_system.0091.t:1 "Mục Tiêu Ý Định Không Còn Hợp Lệ"
  activity_system.0091.desc:1 "Với sự thay đổi của hoàn cảnh hiện tại, rõ ràng mục tiêu ý định trước đây của ta không còn phù hợp với mục tiêu của mình nữa. Những người khác đi ngang qua ta một cách vui vẻ khi ta suy ngẫm về tình cảnh của mình, hoàn toàn không nhận ra sự bối rối nhẹ của ta.\n\nTa nên tập trung vào ai khác? Hay đơn giản là tập trung vào chính mình?"
  activity_system.0091.a:1 "Đã đến lúc tìm một mục tiêu mới..."

 # Activity Conclusion
  activity_system.0100.t:2 "Một Lễ Hội Thất Bại"
  activity_system.0100.desc:0 "Thật khó tin! Dù ta đã gửi rất nhiều lời mời và chuẩn bị kỹ lưỡng, không một ai xuất hiện tại [activity_type.GetNameNoTooltip()] của ta. Có lẽ con đường đến [location.GetName] nguy hiểm hơn ta tưởng.\n\n"
  activity_system.0100.outro_away:0 "Có lẽ đã đến lúc bắt đầu hành trình trở về nhà tại [ROOT.Char.GetCapitalLocation.GetName]."
  activity_system.0100.outro_home:0 "Ít nhất ta đã tránh được việc phải rời khỏi nhà để đi xa."
  activity_system.0100.a:1 "Nhưng tại sao... tại sao không ai đến?"

  activity_system.1010.t:0 "Chuyến Đi Bị Cắt Ngắn"
  activity_system.1010.desc:0 "Người tiền nhiệm của ta, [host.GetNameRegnal], đã trút hơi thở cuối cùng khi đang đi tuần khắp lãnh địa. Đáng tiếc thay, [host.GetSheHe] [host.GetDeathReason].\n\n"
  activity_system.1010.desc.entourage:0 "Đoàn tùy tùng của [host.GetFirstNamePossessiveNoTooltip] chắc chắn sẽ bắt đầu hành trình trở về nhà trong tang tóc, mang theo thi thể [ROOT.Char.Custom2('RelationToMePossessive',SCOPE.sC('host'))] của ta."
  activity_system.1010.desc.ruler:0 "[host.GetTitleAsName] đã khuất không đáng phải chết xa quê nhà đến vậy."
  activity_system.1010.a:0 "Yên nghỉ nhé, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))]."
  activity_system.1010.tt:0 "[activity|E] của [host.GetShortUINamePossessiveNoTooltip] đã bị hủy"

  activity_system.1011.desc:0 "Lãnh chúa của ta, [host.GetNameRegnal], đã từ bỏ cõi trần trong khi đang đi tuần tra lãnh thổ. Thật bi thảm, [host.GetSheHe] [host.GetDeathReason].\n\nPhần còn lại của Chuyến đi đã bị hủy bỏ khi đoàn tùy tùng của [host.GetFirstNamePossessiveNoTooltip] bắt đầu hành trình tang tóc trở về nhà, mang thi hài của [host.GetHerHis] đến nơi an nghỉ cuối cùng."

# Host has joined a war and has the opportunity to cancel the activity 
  activity_system.0300.t:0 "Chiến Tranh Không Chờ [ROOT.Char.GetWomanMan|U]"
  activity_system.0300.desc.intro.traveling:0 "Tiếng tù và chiến tranh vang vọng đến ta ngay cả tại [target_activity_location.GetName] khi ta đang trên đường đến tham dự [target_activity_type.GetNameNoTooltip] của mình tại [target_activity_location.GetName]. "
  activity_system.0300.desc.intro.activity:0 "Tiếng tù và chiến tranh vang vọng đến ta ngay cả tại [target_activity_location.GetName] khi ta đang tổ chức một [target_activity_type.GetNameNoTooltip]. "
  activity_system.0300.desc.attacker:1 "Ta đã tham gia cuộc chiến chống lại [war_opponent.GetNameRegnal|U]."
  activity_system.0300.desc.defender:0 "Tên [war_opponent.Custom2('InsultNoun', ROOT.Char)] [war_opponent.GetNameRegnal|U] đó đã tuyên chiến với ta!\n\n"
  activity_system.0300.desc.outro:0 "Rất nhiều kế hoạch đã được chuẩn bị để tổ chức [target_activity_type.GetNameNoTooltip] này và ta không muốn phải gửi khách về nhà. Tuy nhiên, tầm quan trọng của cuộc xung đột này không thể bị xem nhẹ.\n\nCó lẽ tốt nhất là tập trung toàn bộ nỗ lực để chuẩn bị cho chiến tranh..."
  activity_system.0300.a:0 "Ta có thể xử lý mọi việc từ đây."
  activity_system.0300.a.tt:0 "[target_activity_type.GetNameNoTooltip] sẽ tiếp tục"
  activity_system.0300.b:0 "Cuộc chiến này cần toàn bộ sự chú ý của ta."
  activity_system.0300.b.tt:0 "[target_activity_type.GetNameNoTooltip] sẽ bị hủy và tất cả người tham dự sẽ bắt đầu trở về nhà"
  activity_system.0300.b.tt.cost:0 "Một số chi phí có thể được hoàn lại"

  activity_system.0301.t:0 "[target_activity_type.GetNameNoTooltip] Bị Hủy"
  activity_system.0301.desc:0 "#EMP "Ra trận! Ra trận!"#! các [knights|l] của [target_activity_host.GetTitledFirstNamePossessive] hô vang khi họ phi nước đại ngang qua, tù và vang dội và cờ xí rực rỡ dưới bầu trời.\n\nTên [war_opponent.Custom2('InsultNoun', ROOT.Char)] [war_opponent.GetNameRegnal] đó dường như chẳng hề quan tâm đến [target_activity_type.GetNameNoTooltip] của chúng ta! Sự kiện buộc phải hủy bỏ khi [target_activity_host.GetTitleAsNameNoTooltip] triệu tập quân lính và cầu nguyện [target_activity_host.GetFaith.WarGodName] ban cho chiến thắng.\n\nMột [target_activity_type.GetNameNoTooltip] là thú vui cao quý và xứng đáng, nhưng tiếng gọi vũ khí luôn vang dội hơn tất cả."
  activity_system.0301.a:0 "Thật là một thảm cảnh..."

  activity_system.0310.desc.intro:0 "Tiếng tù và chiến trận vang dội đã truyền đến tai ta nơi [target_activity_location.GetName] khi ta đang dự [target_activity_type.GetNameNoTooltip] của [target_activity_host.GetNamePossessive|U].\n\n"
  activity_system.0310.desc.primary_defender:0 "Tên [attacker.GetTitledFirstName|U] hèn hạ kia đã tuyên chiến với ta!"
  activity_system.0310.desc.random_defender:0 "Ta đã được triệu tập để trợ chiến trong cuộc chiến giữa [attacker.GetTitledFirstName|U] và [defender.GetTitledFirstName|U]."
  activity_system.0310.a.tt:0 "Ngài tiếp tục dự [target_activity_type.GetNameNoTooltip]"
  activity_system.0310.b.tt:0 "Ngài rời khỏi [target_activity_type.GetNameNoTooltip] và khởi hành hồi gia"
 
  activity_system.0320.t:0 "Một Kết Thúc Bất Ngờ"
  activity_system.0320.desc:1 "Chủ tổ chức của chúng ta, [host.GetName], đã mất các lãnh địa của [host.GetHerHis] và vì vậy [activity_type.GetNameNoTooltip()] đã kết thúc đột ngột.\n\nĐây chắc chắn không phải cách ta nghĩ sự kiện này sẽ kết thúc sau tất cả những lời mời và sự chuẩn bị rầm rộ. Có lẽ điều duy nhất còn lại là ta cùng đoàn tùy tùng trở về nhà tại [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]..."
  activity_system.0320.a:0 "Chuyện đã rồi."

 # If you have gained the incapable trait 
  activity_system.0330.t:0 "Mất Năng Lực"
  activity_system.0330.desc.intro:0 "Ta đã bị coi là mất năng lực và bị xem là hoàn toàn không đủ khả năng quản lý công việc của chính mình, bao gồm cả [activity_type.GetNameNoTooltip()] của ta!\n\n"
  activity_system.0330.desc.memory:0 "Than ôi, [incapable_memory.GetDescription].\n\n"
  activity_system.0330.desc.outro:0 "Không còn gì để làm ngoài việc trở về nhà tại [home.GetName]."
  activity_system.0330.a:0 "Mong các vị khách của ta có thể trở về nhà an toàn."

  activity_system.0331.t:0 "Mất Năng Lực"
  activity_system.0331.desc:0 "Chủ tiệc của chúng ta, [host.GetName], đã bị những người xung quanh [host.GetHerHim] coi là không còn đủ năng lực và bị xem là hoàn toàn không phù hợp để quản lý các công việc của riêng [host.GetHerHis], bao gồm cả [host.GetHerHis] [activity_type.GetNameNoTooltip()]!\n\nThan ôi, tất cả chúng ta phải trở về nhà tay trắng."
  activity_system.0331.a:0 "Thật đáng tiếc."

 # Late to the activity
  activity_system.0400.t:0 "Chậm So Với Lịch Trình"
  activity_system.0400.desc_leader:0 "Khi [travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)] tiến đến gần ta với vẻ xấu hổ và lo lắng hiện rõ trên gương mặt [travel_leader.GetHerHis], ta biết rằng [travel_leader.GetSheHe] mang theo tin xấu.\n\n\"Tôi rất tiếc phải báo rằng chúng ta đang chậm lịch khoảng [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)], thưa [ROOT.Char.GetTitleAsNameNoTooltip], và chúng ta có thể sẽ không kịp đến đích.\""
  activity_system.0400.desc_no_leader:0 "Ta liên tục quan sát bầu trời và tất cả các bản đồ mình có, nhưng rõ ràng phép tính không khớp.\n\nChúng ta đang chậm lịch khoảng [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)] và nếu tiếp tục di chuyển với tốc độ hiện tại theo hành trình này, chúng ta sẽ không thể đến nơi kịp thời."
  activity_system.0400.a:0 "Hãy nhanh lên."
  activity_system.0400.a.tt:0 "Ngươi hy vọng sẽ tăng tốc trên đường đi"
  activity_system.0400.b:0 "Thật ra cũng không đáng."
  activity_system.0401.t:0 "Quá Muộn"
  activity_system.0401.desc_leader:0 "[travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến gần ta với vẻ mặt nghiêm trọng.\n\n\"Tôi rất buồn khi phải báo cáo rằng chúng ta đã không đến kịp, [ROOT.Char.GetTitleAsNameNoTooltip] của ta. Hoạt động đã bắt đầu từ hôm nay, và chúng ta đơn giản là không có mặt ở đó.\""
  activity_system.0401.desc_no_leader:0 "Hôm nay là ngày đó. Hoạt động đã bắt đầu hôm nay, nhưng dù ta đã cố gắng hết sức, chúng ta đơn giản là không có mặt tại đó.\n\nKhông còn gì để làm ngoài việc quay đầu và trở về nhà."
  activity_system.0401.a:0 "Thật đáng thất vọng."

  SELECT_ACTIVITY_DECISION_TITLE:0 "#D Chọn Loại Hoạt Động#!"
  SELECT_ACTIVITY_DECISION_NEXT_STEP_BUTTON:0 "$SELECT_ACTIVITY_DECISION_TITLE$"
  hold_grand_activity_option_tournament:0 "$activity_tournament$"
  hold_grand_activity_option_tournament_desc:0 "$activity_tournament$"
  hold_grand_activity_option_wedding:0 "$activity_wedding$"
  hold_grand_activity_option_wedding_desc:0 "$activity_wedding$"
  hold_grand_activity_option_tour:0 "$activity_tour$"
  hold_grand_activity_option_tour_desc:0 "$activity_tour$"


  hold_standard_activity_option_feast:0 "$activity_feast$"
  hold_standard_activity_option_feast_desc:0 "$activity_feast$"
  hold_standard_activity_option_hunt:0 "$activity_hunt$"
  hold_standard_activity_option_hunt_desc:0 "$activity_hunt$"
  hold_standard_activity_option_pilgrimage:0 "$activity_pilgrimage$"
  hold_standard_activity_option_pilgrimage_desc:0 "$activity_pilgrimage$"
  hold_standard_activity_option_play_date:0 "$activity_playdate$"
  hold_standard_activity_option_play_date_desc:0 "$activity_playdate$"
  hold_standard_activity_option_witch_ritual:0 "$activity_witch_ritual$"
  hold_standard_activity_option_witch_ritual_desc:0 "$activity_witch_ritual$"

  activity_system.0500.t: "Một Kết Cục U Ám"
  activity_system.0500.desc: "Ta đã nhận được tin rằng chủ tổ chức của chúng ta, [host.GetNameNoTooltip], đã qua đời. Do những hoàn cảnh bất ngờ này, hoạt động của [host.GetHerHis] đã bị hủy."
  activity_system.0500.a: "Quả là một bi kịch."

  activity_system.0501.t: "Một Linh Hồn Đã Rời Đi"
  activity_system.0501.desc: "Sự náo động vang lên khắp phòng khảo thí. Các học giả và tu sĩ chạy qua chạy lại. Một đám đông tụ tập trong sân, và từ đó vang lên tiếng khóc.\n\n[ROOT.Char.GetTopLiege.Custom('GetDaughterSon')] của Thiên Mệnh đã qua đời."
  activity_system.0501.a: "Ta không thể tin được..."

  activity_system.0550.t: "Kế Hoạch Bị Phá Hỏng"
  activity_system.0550.desc: "Do việc ta bất ngờ bị giam cầm, ta không thể tiếp tục tham gia hoạt động của mình và nó buộc phải bị hủy.\n\nTất cả thời gian ta đã dành để chuẩn bị..."
  activity_system.0550.a: "Điều này không nằm trong kế hoạch của ta..."

  activity_system.0551.t: "Chủ Tổ Chức Bị Giam"
  activity_system.0551.desc: "Do việc chủ tổ chức của ta, [host.GetNameNoTooltip], bất ngờ bị giam cầm, hoạt động mà ta đang tham gia đã bị hủy."
  activity_system.0551.a: "Đã đến lúc trở về nhà."

  activity_system.0552.t: "Thách Thức Không Được Đáp Lại"
  activity_system.0552.desc: "Chuyện này có nghĩa là gì? Có vẻ như không có phong trào nào khác sẵn sàng đứng lên đối mặt với thách thức của [GetPlayer.Custom('GetMyMovementNoTooltip')].\n\nVì không có ai để tranh luận, cuộc tranh luận đã bị hủy."
  activity_system.0552.a: "Để lần sau vậy..."

  activity_system.0554.opening: "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
  activity_system.0554.a: "Ta phải chấp nhận thử thách này."
  activity_system.0554.b: "Ta sẽ nghĩ ra một cái cớ thuận tiện."
