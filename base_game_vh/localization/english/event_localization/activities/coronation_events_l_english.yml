  ach_coronation.0015.a.tt.initiator.critical_failure: "Thảm họa!"
  ach_coronation.0015.a.tt.initiator.critical_failure.desc: "[host.GetShortUIName] ngăn được hỗn loạn — tệ hơn nữa, [host.GetSheHe] còn được ca tụng vì điều đó!"
  ach_coronation.0015.a.tt.initiator.failure: "Thất bại!"
  ach_coronation.0015.a.tt.initiator.failure.desc: "[host.GetShortUIName] ngăn được thảm họa — chết tiệt!"
  ach_coronation.0015.a.tt.initiator.failure.crackdown.desc: "Binh lính của [host.GetShortUINamePossessive] thành công chấm dứt hỗn loạn — [host.GetSheHe] còn đáng sợ hơn bao giờ hết"
  ach_coronation.0015.a.tt.initiator.failure.physician.desc: "[host.GetShortUIName] dùng kỹ năng thầy thuốc của [host.GetHerHis] để cứu chữa người bị thương và được tung hô như một 'anh hùng'!"
  ach_coronation.0015.a.tt.initiator.success: "Thành công!"
  ach_coronation.0015.a.tt.initiator.success.desc: "[host.GetShortUIName] bị bẽ mặt và lễ đăng quang của [host.GetHerHis] bị phá hỏng!"
  ach_coronation.0015.a.tt.initiator.critical_success: "Thảm sát!"
  ach_coronation.0015.a.tt.initiator.critical_success.desc: "Binh lính của [host.GetShortUINamePossessive] phản ứng thái quá và giết nhiều người — một vụ bê bối thực sự!"
  ach_coronation.0015.b: "Đến giúp người bị thương! Mau lên!"
  ach_coronation.0015.b.flavor: "Bây giờ chúng ta chỉ có thể tập trung cứu mạng người!"
  ach_coronation.0015.c: "Lũ ngu kích động quá mức!"
  ach_coronation.0015.d: "Lính đâu! Lập lại trật tự!"
  ach_coronation.0015.d.byzantines: "Thả đội Varangian!"
  ach_coronation.0015.e: "Ôi không, vài nông dân có thể chết. Dù sao thì..."
  ach_coronation.0015.e.tt: "Ngươi sẽ phải đánh đường thoát thân!"
  ach_coronation.0015.e.success: "Ngươi phá được vòng vây của đám đông!"
  ach_coronation.0015.e.failure: "Một tên dân thường dám giẫm lên đầu ngươi!"
  few_guests_wounded: "#N Một vài khách bị thương#!"
  many_guests_wounded: "#N Nhiều khách bị thương#!"
  many_guests_wounded_or_killed: "#N Nhiều khách bị thương hoặc bị giết — đó là một cuộc thảm sát!#!"
  many_guests_may_be_wounded_or_killed: "@death_icon! #N Nhiều khách có thể bị thương hoặc thiệt mạng#!"
