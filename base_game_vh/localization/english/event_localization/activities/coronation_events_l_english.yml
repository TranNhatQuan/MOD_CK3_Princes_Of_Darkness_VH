  every_wounded_guest_in_crowd_scope_tt: "Mọi vị khách bị thương trong đám đông"

  ach_coronation.0016.t: "Món Quà Xứng Đáng Cho Một [host.GetTitleAsNameNoTooltip]"
  ach_coronation.0016.desc: "Khách khứa đến dự lễ đăng quang của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host') )] ta, [host.GetTitledFirstNameRegnal], đang ùn ùn kéo đến, ai nấy đều đưa ra những lời thề nhỏ, lời cảm ơn vì được mời, và cam kết trung thành hoặc ủng hộ. Chẳng bao lâu nữa sẽ đến lượt ta.\n\nTa có nên nổi bật giữa đám đông? Ta có nên dùng khoảnh khắc diện kiến ngắn ngủi này để thuyết phục [host.GetTitleAsNameNoTooltip] về giá trị của mình?"
  ach_coronation.0016.a.martial: "Ta sẽ hiến tặng một đội quân!"
  ach_coronation.0016.a.stewardship: "Ta sẽ thu xếp một khoản cống nạp từ các vị khách khác!"
  ach_coronation.0016.a.stewardship.greedy.tt: "Tất nhiên, bản thân ngươi sẽ không đóng góp gì"
  ach_coronation.0016.a.diplomacy: "[detractor.GetTitledFirstNameNoTooltip] có thể bị thuyết phục về phía [host.GetTitledFirstNameNoTooltip]..."
  ach_coronation.0016.a.intrigue: "Mạng lưới gián điệp của ta sẽ phục vụ [host.GetHerHis]."
  ach_coronation.0016.a.learning: "Ta sẽ nói với giáo sĩ để ủng hộ [host.GetHerHis]."
  ach_coronation.0016.a.loyal: "Ta sẽ thề trung thành vĩnh viễn."
  ach_coronation.0016.b.impress_attendees: "Ta sẽ tận dụng danh tiếng của mình!"
  ach_coronation.0016.b.impress_attendees.writer: "Di sản của [host.GetHerHis|U] sẽ được bất tử hóa bằng #EMP thi ca!#!"
  coronation_extolled_legitimacy_log_title: "Ca Tụng Chính Danh"
  coronation_extolled_legitimacy_log: "[CHARACTER.GetTitledFirstName] đã tận dụng [Concept('prestige','danh tiếng tốt')|E] của [CHARACTER.GetHerHis] để ủng hộ [TARGET_CHARACTER.GetTitledFirstName]."
  ach_coronation.0016.b.bonds: "Ta sẽ ca ngợi [host.GetHerHis] với tất cả mọi người!"
  ach_coronation.0016.c.artifact: "[gifted_artifact.GetNameNoTooltip] sẽ là một món quà tuyệt vời."
  ach_coronation.0016.c.gold: "Ai có thể từ chối vàng và châu báu chứ?"
  ach_coronation.0016.d: "Chỉ vài lời xã giao thông thường là đủ."
  ach_coronation.0016.d.hate: "Ta sẽ làm bộ phớt lờ cái [host.Custom('InsultNoun')] đó!"
  ach_coronation.0016.reward.tt: "#low #EMP Phần thưởng dựa trên Ý Định [THIS.Char.GetInvolvedActivityIntent.GetName] của ngươi#!#!"
  ach_coronation.0016.praise: "[host.GetTitledFirstNameNoTooltip] công khai ca ngợi ngươi"
  ach_coronation.0016.gold: "[host.GetTitledFirstNameNoTooltip] trả công cho công sức của ngươi"
  ach_coronation.0016.friendship: "[host.GetTitledFirstNameNoTooltip] đích thân cảm ơn ngươi"

  ach_coronation.0017.t: "Thiên Mệnh Chưa Được Xứng Đáng"
  ach_coronation.0017.desc: "Trong buổi cầu nguyện buổi sáng tại [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')], [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] khẽ thúc ta và chỉ về phía [host.Custom2('MyCharacterIntroduction', ROOT.Char)] đang quỳ cho nghi lễ.\n\n"Ngươi không thấy khó chịu sao khi [host.GetSheHe] chưa từng chiến đấu vì đức tin "
  ach_coronation.0017.ending.crusader: "như ngươi và ta đã làm, vậy mà lại tự nhận mình chính trực đến thế?""
  ach_coronation.0017.ending.civilian: "như ngươi đã làm, vậy mà lại tự nhận mình chính trực đến thế?""
  ach_coronation.0017.a: "Với tư cách [GetTrait('faith_warrior').GetName( GetNullCharacter )], [host.GetTitledFirstNameNoTooltip] có sự ủng hộ của ta!"
  ach_coronation.0017.a.christian: "Với tư cách một thập tự quân, ta ủng hộ [host.GetTitledFirstNameNoTooltip]!"
  ach_coronation.0017.b: "Ta sẽ làm nhục kẻ hèn nhát đó trước công chúng!"
  ach_coronation.0017.c: "Hừ! Tập trung cầu nguyện đi."
  ach_coronation.0017.d: "Đức tin không phải là cuộc thi!"
  ach_coronation.0017.d.cynical: "Cái gì? Ai thèm quan tâm đến chuyện đó?"
  crusader_endorsement_opinion: "Được Chiến Binh Đức Tin Ủng Hộ"
  crusader_sellout_opinion: "Làm Rẻ Rúng Thánh Nghiệp"

  ach_coronation.0018.t: "Bổn Phận Gia Tộc"
  ach_coronation.0018.desc: "Việc chuẩn bị cho lễ đăng quang của [host.GetTitledFirstNamePossessive] đang rơi vào hỗn loạn!"
  ach_coronation.0018.desc.seneschal: "Với tư cách là [GetCourtPositionType('seneschal_court_position').GetName], đáng lẽ #EMP phải#! là nhiệm vụ của [servant_boss.Custom2('MyCharacterIntroduction', ROOT.Char)] chỉ huy đám người hầu."
  ach_coronation.0018.desc.steward: "Vì không có [GetCourtPositionType('seneschal_court_position').GetName], đáng lẽ #EMP phải#! là nhiệm vụ của [servant_boss.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] với tư cách [servant_boss.GetCouncilTitle|l] chỉ huy đám người hầu."
  ach_coronation.0018.desc.fallback: "Dường như chẳng có ai chuẩn bị để chỉ huy đám người hầu."
  ach_coronation.0018.desc.ending.servant_boss: "[servant_boss.GetTitledFirstNameNoTooltip], tuy nhiên, trông hoàn toàn quá tải; trong khi đó, đám người hầu thì vui vẻ tán gẫu và lười biếng mà không có sự giám sát thích hợp.\n\n[host.GetTitledFirstNameNoTooltip] lẽ ra nên tập trung vào nghi lễ sắp tới, nhưng [host.GetSheHe] dường như luôn bị quấy rầy bởi những chuyện vụn vặt."
  ach_coronation.0018.desc.ending.no_servant_boss: "Sự thiếu lãnh đạo thể hiện rõ ràng, và những người không hoảng loạn dường như hài lòng với việc tán gẫu và lười biếng.\n\nTrong khi [host.GetTitledFirstNamePossessiveNoTooltip] lẽ ra phải tập trung vào nghi lễ sắp tới, [host.GetSheHe] dường như luôn bị quấy rầy bởi những chuyện vụn vặt."
  ach_coronation.0018.a.intent: "Đây là cơ hội của ta!"
  ach_coronation.0018.a: "Ta sẽ giúp [servant_boss.GetTitledFirstNameNoTooltip] chuẩn bị."
  ach_coronation.0018.a.tt_success: "[host.GetTitledFirstName] chú ý đến sự giúp đỡ của ngươi"
  ach_coronation.0018.a.tt_failure: "Nỗ lực của ngươi không được ai chú ý"
  ach_coronation.0018.b: "Tại sao phải lãnh đạo khi có thể tham gia?"
  ach_coronation.0018.b.tt.gossip_with_servants: "Ngươi có khoảng thời gian tán gẫu rất vui vẻ"
  ach_coronation.0018.b.tt.secret_unknown_desc: "Ồ giờ thì #EMP chuyện này#! thật thú vị"
  ach_coronation.0018.b.tt.secret_unknown: "Ngươi phát hiện một [secret|E]"
  ach_coronation.0018.b.tt.secret: "Ngươi phát hiện [secret_holder.GetFirstNamePossessive] [SECRET.GetName] [secret|E]"
  ach_coronation.0018.c: "Đây có vẻ là cơ hội học hỏi tốt!"
  ach_coronation.0018.c.flavor: "Có rất nhiều điều để học từ những thất bại của đội ngũ phục vụ."
  ach_coronation.0018.d: "May thay đó là vấn đề của [host.GetHerHis], không phải của ta."
  ach_coronation.0018.diplomacy_trait.tt: "Vì ngươi có [GetTrait('diplomat').GetName( GetNullCharacter )] hoặc [GetTrait('gregarious').GetName( GetNullCharacter )] [traits|E], [servant_boss.GetTitledFirstNameNoTooltip] sẽ không cảm thấy bị xúc phạm"
  ach_coronation.0018.servant_boss_opinion.tt: "[servant_boss.GetTitledFirstNameNoTooltip] có thể xem đây là nỗ lực cướp việc của [servant_boss.GetHerHis]"
  ach_coronation.0018.d.pleased_servant_boss: "[servant_boss.GetFirstNameNoTooltip] biết ơn sự giúp đỡ của ngươi"
  ach_coronation.0018.d.annoyed_servant_boss: "[servant_boss.GetFirstNameNoTooltip] cảm thấy ngươi đang cố cướp việc của [servant_boss.GetHerHis]"
  ach_coronation.0018.a.seneschal: "[host.GetTitledFirstNameNoTooltip] bổ nhiệm ngươi làm [GetCourtPositionType('seneschal_court_position').GetName]"
  ach_coronation.0018.a.vassal: "[host.GetTitledFirstNameNoTooltip] ban cho ngươi một [title|E]!"
  ach_coronation.0018.a.tt.vassal: "Ngươi sẽ được ban một tước vị do [host.GetTitledFirstNamePossessive] lựa chọn"
  ach_can_refuse_reward: "Ngươi có thể từ chối phần thưởng sau để nhận [gold_i][host.MakeScope.ScriptValue('minor_gold_value')|0V] [gold|E] hoặc cải thiện quan hệ với [host.GetShortUIName]:"

  ach_coronation.0019.opening: "[host.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  ach_coronation.0019.desc: "Sự giúp đỡ của ngươi tại [host.GetCurrentLocation.Custom('GetCoronationSitePrefix')][host.GetCurrentLocation.Custom('GetCoronationSite')] đã không bị bỏ qua."
  ach_coronation.0019.desc.title: "Ta cần những chư hầu mà ta có thể tin tưởng, và ta tin rằng [grantable_title.GetName] cần một người cai trị mới. Ngươi thấy sao?"
  ach_coronation.0019.desc.court_position: "Ngươi đã chứng minh mình là một [GetCourtPositionType('seneschal_court_position').GetName] vô cùng có năng lực. Ngươi nghĩ sao?"
  ach_coronation.0019.desc.praise: "Ta đã quyết định sẽ chính thức ca ngợi tên tuổi của ngươi trước toàn thể triều đình! Tất cả sẽ biết đến sự tận tụy của ngươi!"
  ach_coronation.0019.a: "Ta chấp nhận!"
  ach_coronation.0019.b: "Ta hy vọng có thứ gì đó... mang tính tiền bạc hơn."
  ach_coronation.0019.c: "Tình bằng hữu của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('host'))] là đủ!"
  your_title_cannot_be_revoked_10_tt: "Tước vị của ngươi sẽ không thể bị thu hồi trong 10 năm."

  ach_coronation.0020.t: "[host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))|U] của Vương Miện"
  ach_coronation.0020.desc: "Trong khi ta bận rộn chuẩn bị cho lễ đăng quang của mình, [helpful_family.Custom2('MyCharacterIntroduction', ROOT.Char)] đã thực sự đứng ra lo liệu mọi việc! Không có người hầu nào làm phiền ta bằng những chuyện vặt vãnh trong nhiều ngày, và cuối cùng ta cũng có thể tập trung vào nghi lễ sắp tới."
  ach_coronation.0020.a: "Giờ thì [helpful_family.GetSheHe] sẽ là một chư hầu mà ta có thể tin tưởng!"
  ach_coronation.0020.b: "#EMP Đây#! chính là cách triều đại [host.GetDynastyNameNoTooltip] làm việc!"
  ach_coronation.0020.c: "[helpful_family.GetSheHe|U] thực sự là một [host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))] tuyệt vời."
  ach_coronation.0020.d: "[helpful_family.GetSheHe|U] là tấm gương cho mọi thần dân của ta."

  ach_coronation.0022.t: "Chiếc Vương Miện Ho Sặc"
  ach_coronation.0022.desc: "Dịch bệnh đáng sợ [epidemic_scope.GetName] gần đây đã trở thành chủ đề trên môi mọi người, đặc biệt là các [zealot.GetFaith.AltPriestTermPlural] của [host.GetPrimaryTitle.GetTierAsName|l]. \"Vì sao [zealot.GetFaith.GoodGodNames] lại trừng phạt [host.GetPrimaryTitle.GetTierAsNameNoTooltip] như vậy?\" một số người than thở."
  ach_coronation.0022.desc.whisper.byzantine: "\"Làm sao [host.GetTitledFirstNameNoTooltip] có thể tuyên bố là [Glossary( 'pistos en Christôi Basileus', 'PISTOS_EN_CHRISTOI_BASILEUS_GLOSS' )] nếu [host.GetFaith.HighGodName] trừng phạt [host.GetHerHim] như vậy?\""
  PISTOS_EN_CHRISTOI_BASILEUS_GLOSS: "Có nghĩa là \"trung thành trong Chúa Kitô, Hoàng Đế\", thuật ngữ Byzantine thay thế cho danh hiệu Latin \"Augustus\"."
  ach_coronation.0022.desc.whisper.hre: "\"Làm sao [host.GetTitledFirstNameNoTooltip] có thể tuyên bố [Glossary( 'sacra majestas', 'SACRA_MAJESTAS_GLOSS' )] trong thời khắc như thế này?\""
  SACRA_MAJESTAS_GLOSS: "Tiếng Latin nghĩa là #BOL \"uy quyền thiêng liêng\"#!, thiên mệnh thần thánh mà các Hoàng đế La Mã Thần Thánh tuyên bố để cai trị thần dân không chỉ như một người cai trị thế tục mà còn là một người lãnh đạo tinh thần."
  ach_coronation.0022.desc.whisper.divine_right: "\"Làm sao [host.GetTitledFirstNameNoTooltip] có thể tuyên bố thiên quyền trước những điềm gở như vậy?\""
  ach_coronation.0022.desc.whisper.sinner: "\"Có phải đây là hậu quả từ bản chất tội lỗi của [host.GetTitledFirstNamePossessiveNoTooltip]?\""
  ach_coronation.0022.desc.whisper.fallback: "\"Có phải [host.GetTitleAsNameNoTooltip] bị nguyền rủa?\""
  ach_coronation.0022.desc.ending: "những người khác hỏi.\n\nNhững lo lắng này dường như ảnh hưởng đến [zealot.GetTitledFirstName] nhiều nhất. [zealot.GetSheHe|U] đã dành cả ngày để cầu nguyện trong lo âu sâu sắc."
  ach_coronation.0022.a.coronation_disrupt_loyalists: "Chắc chắn [zealot.GetShortUINameNoTooltip] có thể thấy ai là người đáng trách?"
  ach_coronation.0022.a.coronation_disrupt_loyalists.flavor: "[zealot.GetShortUIName] nói đúng! [host.GetShortUIName] #EMP chính là#! kẻ đáng trách!"
  ach_coronation.0022.a.coronation_disrupt_loyalists.failure: "[zealot.GetShortUIName] thấy cuộc trò chuyện này gần như báng bổ"
  ach_coronation.0022.a.coronation_disrupt_loyalists.success: "[zealot.GetSheHe] bị thuyết phục rằng [host.GetShortUIName] là kẻ đáng trách"
  ach_coronation.0022.a.offer_support: "Ta sẽ nói chuyện với [zealot.GetHerHim] ngay."
  ach_coronation.0022.a.offer_support.flavor: "[host.GetTitleAsName] chắc chắn sẽ trân trọng lời nhắc nhở về thiên mệnh của [host.GetHerHis]."
  ach_coronation.0022.a.offer_support.success: "[zealot.GetShortUIName] cảm ơn ngươi vì đã nhắc nhở [zealot.GetHerHim] về lòng trung thành của [zealot.GetHerHis]"
  ach_coronation.0022.a.offer_support.failure: "Đức tin của [zealot.GetShortUINamePossessive] dường như còn lung lay hơn trước"
  ach_coronation.0022.b: "Ta cầu nguyện cùng [zealot.GetHerHim] như một [ROOT.Char.Custom('SisterBrother')] trong [zealot.GetFaith.GoodGodNames]."
  ach_coronation.0022.c: "Có rất nhiều người chỉ cần một cú thúc nhẹ cũng sẽ đồng ý..."
  ach_coronation.0022.c.failure: "Mọi người khá khó chịu trước sự dò xét của ngươi"
  ach_coronation.0022.c.success: "Phe [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] liên kết chống lại [host.GetTitledFirstNameNoTooltip]"
  ach_coronation.0022.d: "Giữ khoảng cách có vẻ... khôn ngoan."
  ach_coronation.0022.d.flavor: "Trong thời dịch bệnh, giữ kẻ thù xa và bạn bè còn xa hơn nữa là điều khôn ngoan"

  ach_coronation.0023.t: "[foreign_warrior.Custom('KnightCultureNoTooltip')] Ngoại Quốc của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  ach_coronation.0023.desc: "Ta đang chào đón một hàng những người mới đến thì một người nước ngoài xuất hiện trước mặt ta — một thanh kiếm kỳ lạ ở bên cạnh [foreign_warrior.GetHerHis]. [foreign_warrior.GetSheHe|U] lập tức quỳ xuống và dâng lên thanh kiếm của mình với một động tác điệu nghệ.\n\n\"Ôi [ROOT.Char.GetTitleAsNameNoTooltip] vĩ đại! Tôi đã dành nhiều thời gian trên đường, rời xa [foreign_ruler.GetCapitalLocation.GetName], và đã nghe nói rằng ngài đang tìm kiếm những tôi tớ trung thành. Vị cai trị hùng mạnh, cho phép tôi tìm kiếm vinh quang và phục vụ ngài như tôi phục vụ [foreign_warrior.GetFaith.HighGodName]!\""
  ach_coronation.0023.desc.clergy.angry: "\n\n[clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nhìn đầy khinh miệt khi nghe nhắc đến vị thần [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)]."
  ach_coronation.0023.desc.clergy: "\n\nTa thấy [clergy.Custom2('MyCharacterIntroduction', ROOT.Char)] nhìn đầy tò mò khi nghe nhắc đến vị thần [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)]."
  ach_coronation.0023.a: "Giờ #EMP đây#! chính là một [GetCourtPositionType('bodyguard_court_position').GetNameNoTooltip]!"
  ach_coronation.0023.b: "[foreign_warrior.GetSheHe|U] sẽ trở thành [GetCourtPositionType('champion_court_position').GetNameNoTooltip] của ta!"
  ach_coronation.0023.c: "Hãy chào mừng đến triều đình của ta!"
  ach_coronation.0023.d: "Lập tức tống cổ tên [foreign_warrior.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)] này!"
  cultural_acceptance_gain_accepted_foreign_warrior:0 "Chấp Nhận Chiến Binh Ngoại Quốc"

  ach_coronation.0025.t: "Uống Rượu và Vui Vẻ"
  ach_coronation.0025.desc: "Bên ngoài yến tiệc, ta tận hưởng một làn gió trong lành và khung cảnh của [feast_location.GetBaronyNameExplicitly], cùng với âm thanh của những đôi tình nhân trong bụi cây gần đó và một [ROOT.Char.Custom('KnightCultureNoTooltip')|l] địa phương đang nôn mửa nguy hiểm ngay gần họ. Trên tất cả, âm thanh lễ hội của dân [feast_location.GetTitle.Custom('BaronyTownType')] vang vọng trong không khí.\n\nMột ý tưởng chợt lóe lên!"
  ach_coronation.0025.desc.host: "Chỉ cần vài đêm rượu miễn phí, toàn bộ [feast_location.GetBaronyNameExplicitlyNoTooltip] có thể nâng cốc chúc tụng tên ta. Ta chỉ cần tìm một thương nhân sẵn lòng bán vào giờ này..."
  ach_coronation.0025.desc.guest: "[host.GetTitledFirstName] hẳn sẽ thích thú khi người dân hát vang tên [host.GetHerHis] — và dân [feast_location.GetTitle.Custom('BaronyTownType')] cũng sẽ thích một đêm rượu miễn phí — ta chỉ cần tìm một thương nhân sẵn lòng bán vào giờ này..."
  ach_coronation.0025.a: "Ta sẽ tự trả tiền cho [baron.Custom('RegionalAlcoholicDrink')]!"
  ach_coronation.0025.b: "Nếu [baron.GetTitledFirstName] cũng góp phần thì sao?"
  ach_coronation.0025.b.flavor: "Với tất cả rượu mà cả hai chúng ta có thể chuẩn bị, [feast_location.GetName] sẽ biết thế nào là niềm vui #EMP thực sự#!!"
  ach_coronation.0025.b.tt.success: "[baron.GetTitledFirstName] đồng ý — hãy để niềm vui tuôn trào!"
  ach_coronation.0025.b.tt.failure: "[baron.GetTitledFirstName] không hiểu được ý tưởng tuyệt vời của ngươi"
  ach_coronation.0025.b.tt: "Ngươi là [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] hoặc [GetTrait('drunkard').GetName( GetNullCharacter )], và có ít nhất [gold_i][GetPlayer.MakeScope.ScriptValue('minor_gold_value')|0V] [gold|E]"
  ach_coronation.0025.c: "Có lẽ không... vậy thì dành cho ta!"
  ach_coronation.0025.c.temperate: "Không cần uống rượu cũng có thể vui!"
  ach_coronation.0025.c.flavor: "Bên trong còn nhiều trò vui hơn nữa"

  ach_coronation.0026.t: "Điềm Xấu"
  ach_coronation.0026.desc: "Yến tiệc kéo dài. Mỗi tiếng trống dội lên khiến ta rùng mình và chỉ nghĩ đến thêm [ROOT.Char.Custom('GetExpensiveDrink')] thôi cũng khiến ta buồn nôn. Chắc chắn các tù trưởng sẽ coi đó là điềm xấu nếu ta đổ bệnh vào lúc này!\n\nNhư thể đúng lúc, [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] lững thững tiến đến với một đĩa thức ăn và một cốc thứ gì đó kinh khủng."
  ach_coronation.0026.a: "Ta phải cố gắng chịu đựng!"
  ach_coronation.0026.a.tt: "Ngươi sẽ nghiến răng cố sống sót qua đêm"
  ach_coronation.0026.a.tt.sick: "Ngươi cảm thấy cơn sốt đang đến"
  ach_coronation.0026.a.tt.sick.failure: "Ngươi không thể che giấu điều đó"
  ach_coronation.0026.a.tt.sick.success: "Ngươi giữ vững"
  ach_coronation.0026.a.tt.critical_success: "Cảm tạ [ROOT.Char.GetFaith.HighGodName]! Cảm giác đó qua đi"
  ach_coronation.0026.b: "[vassal.GetTitledFirstNameNoTooltip]! Giúp ta!"
  ach_coronation.0026.b.tt: "[vassal.GetTitledFirstName] sẽ dành phần còn lại của bữa tiệc giúp che giấu bệnh tình của ngươi"
  ach_coronation.0026.c: "Đủ rồi! Ta phải rời đi nghỉ ngơi."
  ach_coronation.0026.c.flavor: "Bỏ dở chính bữa tiệc của mình có lẽ sẽ không được nhìn nhận tốt"

  ach_coronation.0027.t: "Món Ngon Thú Vị"
  ach_coronation.0027.desc: "\"[ROOT.Char.Custom2('RelationToMeAddress', partaker)|U]!\" [partaker.Custom2('MyCharacterIntroduction', ROOT.Char)] bắt đầu — một mùi hương đặc biệt theo [partaker.GetHerHim] đến bàn ta — \"Ngài phải gặp [stoner.GetWomanMan] thú vị này, [stoner.GetSheHe] đã mang đến"
  ach_coronation.0027.desc.char.crusader: "những chiếc bánh Saracen kỳ lạ và ngon miệng từ chuyến phiêu lưu Thập Tự của [stoner.GetHerHis]!\""
  ach_coronation.0027.desc.char.varangian: "những chiếc bánh kỳ lạ này từ chuyến phiêu lưu của [stoner.GetHerHis] giữa dân [emperor_culture.GetCollectiveNoun]!\""
  ach_coronation.0027.desc.char.other: "những chiếc bánh hashish thơm ngát kỳ diệu!\""
  ach_coronation.0027.a: "Ta sẽ mua toàn bộ số hàng của [stoner.GetHerHis]!"
  ach_coronation.0027.b: "Ừm, có hại gì đâu?"
  ach_coronation.0027.b.hashishiyah: "[stoner.GetSheHe|U] nghe có vẻ là một [stoner.GetWomanMan] có gu!"
  ach_coronation.0027.c: "Ngay trong lễ đăng quang của #EMP ta#! sao!? Cút đi!"
  ach_coronation.0027.d: "\"Hãy tận hưởng mà không có ta, [partaker.GetFirstNameNoTooltip].\""
  ach_coronation.0027.d.host: "Một chủ nhà tốt luôn để lại nhiều cho khách của [ROOT.Char.GetHerHis]!"
  purchased_hashish_opinion: "Đã Mua Hashish"

  ach_coronation.0028.t: "Cơn Say Chính Danh"
  ach_coronation.0028.desc: "\"[ROOT.Char.GetFirstName]!\" [drinker.Custom2('MyCharacterIntroduction', ROOT.Char)] hét lớn từ bên kia đại sảnh — đủ to để át tiếng ồn của lễ đăng quang. \"Ngươi nghĩ đội vương miện mới khiến ngươi quyền lực lắm sao!? Vậy thì nhân danh [drinker.GetFaith.HighGodName], uống đi! Hãy chứng minh mình là một [ROOT.Char.GetTitleAsNameNoTooltip] xứng đáng!\"\n\nNhiều ánh mắt mong chờ hướng về phía ta, háo hức đợi câu trả lời."
  ach_coronation.0028.a: "[drinker.GetTitledFirstNameNoTooltip] đã gặp đối thủ của [drinker.GetHerHis]!"
  ach_coronation.0028.a.win: "Ngươi uống khiến [drinker.GetFirstNameNoTooltip] gục dưới bàn!"
  ach_coronation.0028.a.lose: "Ngươi không theo kịp"
  ach_coronation.0028.b.win: "[drinker.GetFirstNameNoTooltip] không có cơ hội"
  ach_coronation.0028.b.lose: "Mưu kế của ngươi bị phát hiện!"
  ach_coronation.0028.b: "Nếu ta có thể bỏ thứ gì đó vào cốc của [drinker.GetHerHis]..."
  ach_coronation.0028.c: "Ta nghĩ là không."

  ach_coronation.0029.t: "Cuộc Săn của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  ach_coronation.0029.desc: "[ROOT.Char.Custom('FunFoodPrefix')]-[ROOT.Char.Custom('GetFoodBird')] quay thật tuyệt vời, nhưng những câu chuyện chúng ta kể còn tuyệt hơn! [first.Custom2('MyCharacterIntroduction', ROOT.Char)|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second') )] của ta [second.GetFirstName], và ta đã dành hàng giờ trao đổi những câu chuyện về các cuộc săn vĩ đại nhất của mình.\n\n\"Đủ rồi!\" [first.GetTitledFirstNameNoTooltip] hét lên. \"Ngươi đã đăng quang, vậy sau bữa tiệc hãy mở một cuộc săn! Chúng ta sẽ làm nó thật đặc biệt cho [ROOT.Char.GetTitleAsNameNoTooltip|l] mới của chúng ta!\"\n\n\"Đúng vậy!\" [second.GetFirstNameNoTooltip] gật đầu háo hức. \"Một cuộc săn cho [ROOT.Char.GetTitleAsNameNoTooltip|l]... Cuộc Săn của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!\""
  ach_coronation.0029.a: "Đúng! Cuộc Săn của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"
  ach_coronation.0029.a.flavor.impress_attendees: "Và các ngươi sẽ đảm bảo toàn bộ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] nghe về nó!"
  ach_coronation.0029.a.flavor.embrace_supporters: "Nó sẽ gắn kết ta với những người ủng hộ!"
  ach_coronation.0029.a.flavor.exalt_crown: "Và chiến lợi phẩm sẽ là biểu tượng cho triều đại của ta!"
  ach_coronation.0029.a.impressive_hunt: "[GetActivityType('activity_hunt').GetName] tiếp theo của ngươi sẽ tăng [opinion|E] của [vassals|E] đối với ngươi"
  ach_coronation.0029.a.personal_hunt: "[GetActivityType('activity_hunt').GetName] tiếp theo của ngươi có thể cho các [guests|E] là [vassal|E] [trait|E] [GetTrait('loyal').GetName( GetNullCharacter )]"
  ach_coronation.0029.a.glorious_hunt: "[GetActivityType('activity_hunt').GetName] tiếp theo của ngươi sẽ tăng [legitimacy|E]"
  ach_coronation.0029.b: "Hay là săn bằng chim ưng?"
  ach_coronation.0029.b.free_falconry: "[GetActivityType('activity_hunt').GetName] kiểu $hunt_type_falconry$ tiếp theo của ngươi sẽ không tốn [gold|E]"
  ach_coronation.0029.b.flavor: "Và hai ngươi sẽ cung cấp chim, tất nhiên!"
  ach_coronation.0029.c: "Ha! Ta sẽ bận rộn lắm!"
  ach_coronation.0029.c.virtuous: "Còn 'tiết độ trong mọi thứ' thì sao?"
  ach_coronation.0029.c.virtuous.tt: "Tùy chọn này khả dụng vì [faith|E] [THIS.Char.GetFaith.GetAdjective] của ngươi xem [trait|E] [GetTrait('temperate').GetName( GetNullCharacter )] là [virtuous|E]"
  hunt_kings_hunt_header: "Cuộc Săn của [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
  hunt_default_header: "Săn Bắn"

  every_non_disloyal_vassal_attendee_tt: "Mọi [vassals|E] không-[GetTrait('disloyal').GetName( GetNullCharacter )] của [host.GetTitledFirstName] tại Lễ Đăng Quang"
  every_detractor_tt: "Mọi [coronation_detractor|E] tại [coronation|E]"
  every_non_detractor_tt: "Mọi [guest|E] [coronation|E] không phải [coronation_detractor|E]"
  every_zealot_vassal_guest_tt: "Mọi [vassal|E] [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName] tại [activity|E] này"
  every_faith_warrior_guest_tt: "Mọi người có [GetTrait('faith_warrior').GetName( GetNullCharacter )] hoặc [GetTrait('crusader_king').GetName( GetNullCharacter )] tại [activity|E] này"
  
  available_because_host_intent_tt: "Tùy chọn này khả dụng vì [intent|e] [host.GetInvolvedActivityIntent.GetName] của [host.GetTitledFirstName]"
  available_because_skill_learning_tt: "Tùy chọn này khả dụng vì [skill|E] [learning|E] cao của ngươi"
  available_because_piety_vs_host_tt: "Tùy chọn này khả dụng vì [piety_level|E] của ngươi cao hơn [host.GetTitledFirstName]"
  available_because_of_shared_religion_tt: "Tùy chọn này khả dụng vì cả hai đều là [THIS.Char.GetFaith.GetReligion.GetAdherentNamePlural]"

  because_you_have_diligent_tt: "#P Vì ngươi có [GetTrait('diligent').GetName( GetNullCharacter )] nên ngươi sẽ không nhận [GetModifier('ach_negative_rumors_modifier').GetNameWithTooltip]#!"
