l_english:
 # Events
  ach_coronation.0001.t: "Đến Nơi"
  ach_coronation.0001.travel: "Ta cuối cùng cũng đã đến [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] để dự lễ đăng quang."
  ach_coronation.0001.notravel: "Tin báo và gia nhân đã được gửi đi từ [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] để chuẩn bị cho lễ đăng quang."
  ach_coronation.0001.intro.hre: "Đăng quang một [host.GetTitleAsName] đâu phải chuyện nhỏ. Khắp [host.GetPrimaryTitle.GetTierAsName] dường như đang đổ về [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], và cờ hiệu của các tuyển hầu cùng hàng trăm quý tộc địa phương đã tung bay."
  ach_coronation.0001.intro.hre_host: "Chẳng bao lâu nữa ta sẽ ngồi trên ngai vàng của Charlemagne, đội vương miện của Otto và cất tiếng nói như Augustus. Các tuyển hầu đã chọn [ROOT.Char.GetTitleAsNameNoTooltip] của họ, giờ là lúc những kẻ khác phải noi theo."
  ach_coronation.0001.intro.byzantine: "Sự kiện này sẽ đặt [host.GetTitledFirstName] ngang hàng với Heraklios và Justinian. Cai trị người [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] tức là cai trị cả thế giới, và người ta chỉ có thể hy vọng [host.GetTitledFirstNameNoTooltip] sẽ xứng đáng với thời khắc này."
  ach_coronation.0001.intro.byzantine_host: "Chẳng bao lâu nữa ta sẽ đứng ngang hàng với Constantine và Theodosius. Ta sẽ là [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')], chủ nhân của vũ trụ, kẻ cai trị toàn cõi La Mã, một [ROOT.Char.GetTitleAsName] đích thực!"
  ach_coronation.0001.intro.host: "Không khí rộn ràng chờ đợi, và ta chợt nhận ra rằng cuối cùng ta cũng sẽ được đội vương miện [ROOT.Char.GetTitleAsNameNoTooltip] của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
  ach_coronation.0001.intro.notravel_host: "Chỉ khi tấm thiệp mời cuối cùng được gửi đi và triều đình bắt đầu chuẩn bị, ta mới chợt nhận ra: cuối cùng ta cũng sẽ được đội vương miện [ROOT.Char.GetTitleAsName] của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
  ach_coronation.0001.guest: "[host.GetTitledFirstName] sẽ được đăng quang tại [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], và ta chỉ có thể hy vọng [host.GetSheHe] xứng đáng với vương miện của [host.GetHerHis]."
  ach_coronation.0001.ending.host_arbitrary: "\n\nChẳng bao lâu nữa ta sẽ là [ROOT.Char.GetTitleAsNameNoTooltip], và sẽ không ai có thể nói khác! Cuối cùng ta cũng được tự do cai trị theo ý #emp ta#! muốn."
  ach_coronation.0001.ending.host_cynical: "\n\nGiờ ta phải chuẩn bị cúi đầu trước [priest.GetFirstName] trước mặt cả lãnh thổ như một kẻ sùng đạo ngu ngốc, nhưng một khi ta đứng lên rồi, sẽ không ai còn ép ta nghe những lời lải nhải của [priest.GetHerHis] nữa!"
  ach_coronation.0001.ending.host_cynical_hof: "\n\nTa thật chẳng mong gì hơn việc thấy [priest.GetTitledFirstName] vênh váo với đám người tẻ nhạt nhất có thể tưởng tượng..."
  ach_coronation.0001.ending.host_impatient: "\n\nTa không thể chờ cho xong việc này! Sự chờ đợi thật tra tấn, [ROOT.Char.Custom('GetBusynessOpinion')] ta sẽ bận rộn đến mức không còn nghĩ tới nó..."
  ach_coronation.0001.ending.host_just: "\n\nCho đến giờ ta vẫn chưa chính danh, chẳng hơn gì một kẻ tiếm vị. Nhưng khi nghi lễ này kết thúc, cuối cùng ta — thực sự — sẽ là [ROOT.Char.GetTitleAsNameNoTooltip]!"
  ach_coronation.0001.ending.host_ambitious: "\n\nBiết rằng chẳng bao lâu nữa một vương miện sẽ đặt lên đầu ta thật vui sướng — nhưng đó mới chỉ là bước đầu menuju vinh quang #EMP thực sự#!."
  ach_coronation.0001.ending.host_compassionate: "\n\nDù vinh quang sắp tới thật lớn lao, ta phải nhớ rằng chính bách tính trong [ROOT.Char.GetPrimaryTitle.GetTierAsName] của ta mới là những người ta phải chứng minh bản thân."
  ach_coronation.0001.ending.host_trusting: "\n\nChẳng bao lâu nữa mọi chư hầu của ta sẽ tụ họp ở đây, và chắc chắn từng người một sẽ hô vang tên ta!"
  ach_coronation.0001.ending.host_paranoid: "\n\nChẳng bao lâu nữa mọi chư hầu của ta sẽ tụ họp ở đây và [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] sẽ biến thành ổ rắn độc. Ta phải cảnh giác phía sau lưng..."
  ach_coronation.0001.ending.host_zealous: "\n\nTa phải cầu nguyện, vì chỉ có [ROOT.Char.GetFaith.HighGodName] mới thật sự quyết định liệu ta có xứng đáng hay không."
  ach_coronation.0001.ending.host_content: "\n\nThành thật mà nói, ta có thể sống mà không cần tất cả những chuyện này, nhưng có những việc một [ROOT.Char.GetTitleAsNameNoTooltip] đơn giản là phải làm."
  ach_coronation.0001.ending.host_gregarious: "\n\nTa sẽ phải nói chuyện với biết bao nhiêu người... chuyện này có lẽ khá vui!"
  ach_coronation.0001.ending.host_craven: "\n\nMọi chuyện chắc sẽ ổn thôi, miễn là chư hầu của ta tuân lệnh... h-họ sẽ tuân lệnh, đúng không?"
  ach_coronation.0001.ending.host_shy: "\n\nCả lãnh thổ sẽ sớm tụ họp tại [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]... càng sớm kết thúc càng tốt."
  ach_coronation.0001.ending.host_arrogant: "\n\nChẳng bao lâu nữa tất cả mọi người — dân thường lẫn quý tộc — sẽ cúi đầu trước ta... tốt."
  ach_coronation.0001.ending.host_calm: "\n\nDù lễ đăng quang đáng ra là ngày vui cho tất cả, ta vẫn phải cẩn trọng; những ngày sắp tới có thể rất nguy hiểm..."
  ach_coronation.0001.ending.host_gluttonous: "\n\nTa không thể chờ được để đăng quang! Thật vinh quang khi dùng bữa cùng cả lãnh thổ với tư cách một [ROOT.Char.GetTitleAsNameNoTooltip] chân chính!"
  ach_coronation.0001.ending.host_eccentric: "\n\nChẳng bao lâu nữa họ sẽ đội vương miện cho ta, và rồi ta sẽ trị vì #EMP mãi mãi#!."
  ach_coronation.0001.ending.host_neutral: "\n\nDù ta đã cai trị, chính lễ đăng quang này mới khiến ta trở thành một [ROOT.Char.GetTitleAsNameNoTooltip] đích thực, và ta đã sẵn sàng."
  ach_coronation.0001.ending.hostile_host: "\n\n[host.GetTitledFirstNameNoTooltip] chắc chắn không phải bạn của ta, nhưng ta — và cả lãnh thổ — sẽ chịu đựng được."
  ach_coronation.0001.ending.friendly_host: "\n\n[host.GetTitledFirstNameNoTooltip] vốn có thiện cảm với ta — mong rằng triều đại của ngài sẽ mang lại lợi ích cho cả hai chúng ta! Hoặc ít nhất là cho ta..."
  ach_coronation.0001.ending.neutral_host: "\n\nYêu hay ghét [host.GetTitleAsNameNoTooltip], không ai có thể phủ nhận cảm giác trọng đại mà những người đứng chứng kiến như chúng ta đang chia sẻ."
  ach_coronation.0001.a: "Chẳng bao lâu nữa triều đại của ta bắt đầu!"
  ach_coronation.0001.a.eccentric: "Mãi mãi..."
  ach_coronation.0001.a.bad: "Xem thử ta có thể gây ra rắc rối gì..."
  ach_coronation.0001.a.good: "Một chương mới bắt đầu hôm nay."
  ach_coronation.0001.tt.hof_visit.title: "Chuyến Viếng Thánh"
  ach_coronation.0001.tt.hof_visit: "[hof.GetCurrentLocation.GetBaronyNameExplicitly] nhận [GetModifier('ach_hof_visit_modifier').GetNameWithTooltip] do sự xuất hiện của [hof.GetTitledFirstNamePossessive]"

  ach_coronation.0010.t: "[hof.GetTitledFirstNameNoTooltip] Đến Nơi"
  ach_coronation.0010.desc.desc_opening: "Chuông vang lên từ mọi [coronation_site.GetCounty.GetFaith.HouseOfWorship] và dân chúng reo hò trên các con phố của [coronation_site.GetHolding.GetName], khi cờ hiệu của [hof.GetTitledFirstName] xuất hiện nơi chân trời."
# Greeting
  ach_coronation.0010.desc.desc_greeting.first_person: "Ta cùng [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của mình, [greeter_2.GetFirstName], là những người đầu tiên nghênh đón [hof.GetTitleAsNameNoTooltip], và sau khi [greeter.Custom2('GetHoFGreeterExchangeFirstPerson', SCOPE.sC('hof'))], chúng ta tiến vào [coronation_site.GetHolding.GetNameNoTooltip].\n\n"
  ach_coronation.0010.desc.desc_greeting.host: "[greeter.GetTitledFirstName] và [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] của [greeter.GetHerHis], [greeter_2.GetFirstName], là những người đầu tiên gặp phái đoàn [hof.GetPrimaryTitle.GetAdjective], và chỉ tiến vào [coronation_site.GetHolding.GetNameNoTooltip] sau khi [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))].\n\n"
  ach_coronation.0010.desc.desc_greeting.baron: "[greeter.GetTitledFirstName] cùng [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] địa phương, [greeter_2.GetTitledFirstName], là những người đầu tiên gặp phái đoàn [hof.GetPrimaryTitle.GetAdjective], và chỉ tiến vào [coronation_site.GetHolding.GetNameNoTooltip] sau khi [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))].\n\n"
# First description
  ach_coronation.0010.desc.desc_first.greedy: "Dân nghèo địa phương đừng mong quá nhiều bố thí — người ta nói [hof.GetTitledFirstNameNoTooltip] khá keo kiệt — nhưng họ chắc chắn sẽ được chứng kiến"
  ach_coronation.0010.desc.desc_first.generous: "[hof.GetTitledFirstName] nổi tiếng là một [hof.GetWomanMan] hào phóng — dân địa phương hẳn sẽ được nhận nhiều bố thí cùng với"
  ach_coronation.0010.desc.desc_first.compassionate: "Lòng trắc ẩn của [hof.GetTitleAsNameNoTooltip] đã thành truyền kỳ, và vô số lời cầu nguyện dành cho tấm lòng nhân hậu của [hof.GetHerHis] vang lên cùng những câu chuyện về"
  ach_coronation.0010.desc.desc_first.cynical: "[hof.GetTitledFirstName] khét tiếng không phải vì đức tin của [hof.GetHerHis] mà vì"
  ach_coronation.0010.desc.desc_first: "Tín đồ đổ về để nhìn thấy [hof.GetTitledFirstNameNoTooltip], và mọi thương nhân cùng kẻ ăn xin trong thành đều kéo theo, cũng như những người chỉ đơn giản hy vọng được chứng kiến"
# Second description
  ach_coronation.0010.desc.desc_second.zealous: "những bài thuyết giảng nảy lửa và lòng nhiệt thành phi thường của [hof.GetHerHis]."
  ach_coronation.0010.desc.desc_second.wrathful: "tính khí nóng nảy huyền thoại và cơn giận bộc trực của [hof.GetHerHis]."
  ach_coronation.0010.desc.desc_second.lustful: "những... khuynh hướng tai tiếng của [hof.GetHerHis]."
  ach_coronation.0010.desc.desc_second.strong: "tầm vóc huyền thoại của [hof.GetHerHis], một thân thể hẳn đã được [hof.GetFaith.HighGodName] ban phước."
  ach_coronation.0010.desc.desc_second.gluttonous: "cơn thèm ăn khét tiếng của [hof.GetHerHis] — nghe nói là tai họa của mọi món [hof.Custom('GetExpensiveDessert')] trong [hof.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
  ach_coronation.0010.desc.desc_second: "tầm quan trọng và uy danh to lớn của [hof.GetHerHis]."
# Ending
  ach_coronation.0010.desc.desc_ending.excommunicated_first_person: "Ta ngạc nhiên khi [hof.GetTitledFirstNameNoTooltip] vẫn đến, xét việc ta đang bị rút phép thông công. Chắc chắn cái giá cho phúc lành của [hof.GetHerHis] sẽ không nhỏ..."
  ach_coronation.0010.desc.desc_ending.excommunicated: "Nhiều người ngạc nhiên khi [hof.GetTitledFirstName] vẫn đến, xét việc [host.GetFirstNamePossessiveNoTooltip] đang bị rút phép thông công — [host.GetTitleAsNameNoTooltip] hẳn sẽ phải trả giá đắt cho vương miện của [host.GetHerHis]..."
  ach_coronation.0010.desc.desc_ending.opinion_very_good_first_person: "[hof.GetFirstNameNoTooltip] và ta là bằng hữu thân thiết, và lễ đăng quang này chắc chắn sẽ là dịp vui cho cả hai chúng ta."
  ach_coronation.0010.desc.desc_ending.opinion_very_good: "[hof.GetTitleAsNameNoTooltip] và [host.GetTitleAsNameNoTooltip] được nói là bằng hữu thân thiết, và lễ đăng quang này chắc chắn sẽ là dịp vui cho cả hai."
  ach_coronation.0010.desc.desc_ending.opinion_bad: "Dẫu vậy, căng thẳng giữa [hof.GetTitleAsNameNoTooltip] và [host.GetTitleAsNameNoTooltip] [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))], và bầu không khí tại lễ đăng quang chắc chắn sẽ căng thẳng."
  ach_coronation.0010.desc.desc_ending.opinion_bad_first_person: "Dẫu vậy, căng thẳng giữa [hof.GetTitleAsNameNoTooltip] và ta [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))], và bầu không khí tại lễ đăng quang chắc chắn sẽ căng thẳng."
  ach_coronation.0010.desc.desc_ending.low_fervor: "Đức tin [hof.GetFaith.GetName] đã trải qua những ngày huy hoàng hơn, chưa bao giờ ngọn lửa đức tin lại yếu ớt và tín đồ chân chính lại hiếm hoi như vậy. Những người sùng đạo cùng [hof.GetTitleAsNameNoTooltip] hẳn đều hy vọng lễ đăng quang của [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('host'))|U] sẽ vực dậy đức tin của [host.GetPrimaryTitle.GetTierAsName]."
  ach_coronation.0010.desc.desc_ending.opinion_good_first_person: "Quan hệ giữa [hof.GetTitleAsNameNoTooltip] và ta khá tốt, và dân chúng tại [coronation_site.GetHolding.GetNameNoTooltip] chắc chắn sẽ nâng cốc chúc tụng chúng ta trong nhiều tuần."
  ach_coronation.0010.desc.desc_ending.opinion_good: "Quan hệ giữa [hof.GetTitleAsNameNoTooltip] và [host.GetTitleAsNameNoTooltip] khá tốt, và dân chúng tại [coronation_site.GetHolding.GetNameNoTooltip] chắc chắn sẽ nâng cốc chúc tụng cả hai trong nhiều tuần."
  ach_coronation.0010.desc.desc_ending.neutral: "Thật ấn tượng khi [host.GetTitleAsNameNoTooltip] được đăng quang bởi chính [hof.GetTitledFirstNameNoTooltip] [hof.GetHerselfHimself] - nhưng chắc chắn cái giá phải trả sẽ rất đắt."
  ach_coronation.0010.desc.desc_ending.neutral_first_person: "Tính chính danh của ta sẽ không thể bị nghi ngờ khi [hof.GetTitledFirstName] đội vương miện cho ta."
  ach_coronation.0010.b: "Quả là cảnh tượng ấn tượng!"
  ach_coronation.0010.b.rival: "Bah! Dịch bệnh giáng xuống cái '[hof.GetTitleAsNameNoTooltip]' đó đi."
  ach_coronation.0010.b.friend: "[hof.GetFirstNameNoTooltip] đến rồi sao? Hoan hô!"
  ach_coronation.0010.b.lover: "Mmm, mong rằng [hof.GetSheHe] có thời gian cho chúng ta..."
  ach_coronation.0010.b.heretic: "Đó đâu phải [hof.GetTitleAsNameNoTooltip] của ta!"
  ach_coronation.0010.b.heathen: "Ai quan tâm chứ?"
  ach_coronation.0010.b.witch: "Có lẽ giờ là lúc nên giữ im lặng..."
  ach_coronation.0010.b.cynical: "Bah! Chuyện bé xé ra to."
  ach_coronation.0010.b.zealous: "Chúng ta thật sự được ban phước!"
  ach_coronation.0010.a: "Khoan! Ta phải nói chuyện với [hof.GetHerHim]!"
  ach_coronation.0010.a.tt.success: "[hof.GetTitledFirstNameNoTooltip] nghe lời thỉnh cầu của ngươi! Tán tụng [ROOT.Char.GetFaith.HighGodName]!"
  ach_coronation.0010.a.tt.failure: "[hof.GetTitledFirstNameNoTooltip] từ chối gặp"
  ach_coronation.0010.a.tt.anger: "[hof.GetTitledFirstNameNoTooltip] bị xúc phạm khi ngươi dám yêu cầu"
  ach_coronation_0010_hof_desc_host.tt: "Sự chấp thuận của [hof.GetTitledFirstNamePossessive] sẽ cải thiện [legitimacy|E] của ngươi và [fervor|E] của [faith|E] [hof.GetFaith.GetAdjective]"
  ach_coronation_0010_hof_desc_guest.tt: "Phúc lành của [hof.GetTitledFirstNamePossessive] sẽ cải thiện [legitimacy|E] của [host.GetTitledFirstNamePossessive] và [fervor|E] của [faith|E] [hof.GetFaith.GetName]"
  activity_hof_arrival_log: "[TARGET_CHARACTER.GetUIName|U] cùng phái đoàn [TARGET_CHARACTER.GetPrimaryTitle.GetAdjective] đã đến lễ đăng quang của [CHARACTER.GetTitledFirstNamePossessive], khiến dân chúng vui mừng ăn mừng."
  activity_hof_arrival_log_title: "$ep2_wedding.1170.t$"

  ach_coronation.0011.t: "Những Bóng Tối Trước Ngai Vàng"
  ach_coronation.0011.desc: "Trong bóng tối của [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')], lũ rắn độc lặng lẽ trườn đi. Giữa những kẻ hầu và quần thần đang chuẩn bị [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')], [plotter.GetTitledFirstName] đang thì thầm với một vòng khách vừa mới đến.\n\nHọ lập tức im bặt khi ta tiến lại gần, trước khi [plotter.GetFirstNameNoTooltip] cúi đầu thật sâu.\n\n"Thưa [plotter.Custom2('RelationToMeShort', SCOPE.sC('host') )] của ta," [plotter.GetSheHe] mở lời, "xin thứ lỗi, chúng ta chỉ đang bàn về... những chuyện mang tính riêng tư.""
  ach_coronation.0011.a: "Rồi ta cũng sẽ moi được sự thật từ [plotter.GetHerHim]..."
  ach_coronation.0011.a.success: "[plotter.GetTitledFirstName] bị bắt gặp đang nói dối"
  ach_coronation.0011.a.success.tt: "Âm mưu bị phơi bày! Ít nhất là nếu thật sự có tồn tại"
  ach_coronation.0011.a.failure: "[plotter.GetTitledFirstName] quá khó nắm bắt"
  ach_coronation.0011.b: "[coward.GetTitledFirstNameNoTooltip], nói ra. #BER Ngay bây giờ.#!"
  ach_coronation.0011.b.flavor: "[coward.GetSheHe|U] đã gần như bật khóc — chỉ cần thúc ép thêm một chút chắc chắn sẽ khiến [coward.GetHerHim] sụp đổ"
  ach_coronation.0011.b.tt: "[coward.GetTitledFirstName] sẽ tiết lộ [scheme|E], và nếu không có, thì một [secret|E]"
  ach_coronation.0011.c: "Ngươi coi ta là kẻ ngu sao!? #EMP Lính đâu!#!"
  ach_coronation.0011.c.paranoid: "Ta #EMP BIẾT NGAY MÀ#!! Bắt hết lũ phản bội này!"
  ach_coronation.0011.c.wrathful: "Ngươi dám sao!? Ngươi nghĩ ta là kẻ ngu à! Lính đâu!"
  ach_coronation.0011.d: "Ta sẽ phải để mắt đến [plotter.GetHerHim]..."
  ach_coronation.0011.scheme.plotter.toast: "[scheme|E] [hostile_scheme.GetSchemeType.GetTypeNameNoTooltip] của [plotter.GetTitledFirstNamePossessive] nhằm vào [hostile_scheme.GetTargetCharacter.GetFirstName] đã bị phát hiện!"
  ach_coronation.0011.scheme.coward.toast: "[scheme|E] [coward_scheme.GetSchemeType.GetTypeNameNoTooltip] của [coward.GetTitledFirstNamePossessive] nhằm vào [coward_scheme.GetTargetCharacter.GetFirstName] đã bị phát hiện!"
  ach_coronation.0011.secret.coward.toast: "Ngươi phát hiện [secret|E] [revealed_secret.GetName] của [coward.GetTitledFirstNamePossessive]"
  ach_coronation.0011.coward.success: "[coward.GetSheHe|U] sụp đổ chỉ trong vài giây"
  ach_coronation.0011.hook.toast: "[coward.GetTitledFirstNamePossessive] bắt đầu khóc lóc và lảm nhảm, đảm bảo với ngươi rằng [coward.GetSheHe] sẽ làm bất cứ điều gì để chứng minh lòng trung thành của [coward.GetHerHis]"
  ach_coronation.0011.false.toast: "[plotter.GetSheHe|U] Thực Ra Đang Chuẩn Bị Một Món Quà Dễ Chịu"

  ach_coronation.0012.t: "Nghi Lễ và Quyền Lợi"
  ach_coronation.0012.desc: "Trong lúc chuẩn bị cho lễ đăng quang, một người hầu với vẻ mặt lo lắng báo tin [first.GetTitledFirstName] và [second.GetTitledFirstName] ngay trước khi họ xông vào phòng. Vì một sai sót nào đó, cả hai đều đã được hứa trao vai trò danh giá là cầm [ROOT.Char.Custom('GetRandomCoronationObject')] trong nghi lễ.\n\nHai người này từ lâu đã nổi tiếng vì mối thù hằn giữa họ, và nếu một người phải nhường vai trò cho kẻ kia thì đó sẽ là nỗi nhục cho gia tộc của họ — dù bản thân vai trò ấy có vẻ nhỏ nhặt đến đâu."
  ach_coronation.0012.a: "[first.GetTitledFirstNameNoTooltip] sẽ nhận vinh dự đó."
  ach_coronation.0012.b: "Nó sẽ thuộc về [second.GetTitledFirstNameNoTooltip]."
  ach_coronation.0012.c: "Chúng ta vẫn có thể sắp xếp được!"
  ach_coronation.0012.c.flavor: "Có lẽ họ có thể cùng nhau mang nó tiến xuống lễ đường?"
  ach_coronation.0012.c.tt.success: "Ngươi có một kế hoạch tuyệt vời"
  ach_coronation.0012.c.tt.failure: "Họ lại bắt đầu cãi vã"
  ach_coronation.0012.d: "Ha! Xem đây mà học."
  ach_coronation.0012.d.flavor: "Cứ như thể lũ nghiệp dư này chưa từng tham dự một nghi lễ triều đình vậy!"
  ach_coronation.0012.e: "[ROOT.Char.Custom('GetRandomCoronationObject')|U]? Do một trong #EMP các ngươi#! mang sao?"
  coronation_elaborate_ceremony_log_title: "Nghi Lễ Cầu Kỳ"
  coronation_elaborate_ceremony_log: "[CHARACTER.GetUIName|U] và [TARGET_CHARACTER.GetUIName|U] đã được thuyết phục thử đảm nhận một vai trò đăng quang hai người phức tạp dù từ lâu họ đã không ưa gì nhau."
  buddy_becomes_supporter_tt: "Trở thành [coronation_supporter|E] cho [coronation|E] của ngươi"
  buddy_becomes_supporter_tt.guest: "Trở thành [coronation_supporter|E] cho [coronation|E] của [host.GetShortUINamePossessive]"
  hater_leaves_supporters_tt: "Không còn là [coronation_supporter|E] của [coronation|E] của ngươi"
  hater_leaves_supporters_tt.guest: "Không còn là [coronation_supporter|E] của [coronation|E] của [host.GetShortUINamePossessive]"
  buddy_leaves_detractors_tt: "Không còn là [coronation_detractor|E] của [coronation|E] của ngươi"
  buddy_leaves_detractors_tt.guest: "Không còn là [coronation_detractor|E] của [coronation|E] của [host.GetShortUINamePossessive]"
  hater_becomes_detractor_tt: "Trở thành [coronation_detractor|E] của [coronation|E] của ngươi"
  hater_becomes_detractor_tt.guest: "Trở thành [coronation_detractor|E] của [coronation|E] của [host.GetShortUINamePossessive]"

  ach_coronation.0013.t: "[ROOT.Char.GetTitleAsNameNoTooltip] và Dân Thường"
  ach_coronation.0013.intro: "Một ngày của ta trôi qua với các nghĩa vụ trong sự yên bình tương đối tại [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]. Chính tại đó,"
  ach_coronation.0013.desc_opening.rainy_day: "tránh cơn mưa"
  ach_coronation.0013.desc_opening.dry_day: "tận hưởng một lúc nghỉ ngơi ngắn ngủi"
  ach_coronation.0013.desc_opening: "gần [ROOT.Char.Custom('GetMainsquareCommons')], ta nghe ai đó hét lên #EMP "[host.GetTitleAsNameNoTooltip]!"#!\n\nNguồn phát ra ở ngay góc phố: vài [ROOT.Char.Custom('GetTaverngoersTribespeople')] đang uống [ROOT.Char.Custom('RegionalAlcoholicDrink')] và buôn chuyện."
  ach_coronation.0013.desc_conversation.mean.1: ""Chưa từng có [host.GetTitleAsNameNoTooltip] nào [host.Custom('InsultAdjectiveGeneric')] đến thế!" một [peasant.Custom2('dummy_peasant_profession', peasant)] khạc ra, cả bàn gật gù tán đồng."
  ach_coronation.0013.desc_conversation.mean.2: "\"Chết tiệt cái kẻ gọi là '[host.GetTitleAsNameNoTooltip]', [host.GetSheHe] sẽ là cái chết của [host.GetPrimaryTitle.GetTierAsName] chẳng bao lâu nữa!\" một [peasant.Custom2('dummy_peasant_profession', peasant)] tuyên bố với đồng bọn của [peasant.GetHerHis]."
  ach_coronation.0013.desc_conversation.mean.3: ""[dummy_gender.Custom('GetRandomRelation')] của ta là một [dummy_gender.Custom('lowly_servant_type')] ở [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')] và [dummy_gender.GetSheHe] nói hơi thở của [host.GetHerHis] lúc nào cũng thối!"" 
  ach_coronation.0013.desc_conversation.mean.4: ""Nghe chưa, [host.GetSheHe] đã ngủ với một [dummy_gender.Custom('lowly_servant_type')] đấy?" một [peasant.Custom2('dummy_peasant_profession', peasant)] cười phá lên, "[host.GetSheHe|U] làm cái trò với [host.Custom('DeviantObjectArticle')] mà [host.GetSheHe]-""
  ach_coronation.0013.desc_conversation.mean.4.chaste: "Trời ơi! Ta bịt tai lại trước khi nghe thêm lời nào nữa."
  ach_coronation.0013.desc_conversation.mean.4.lustful.host: "Trời ơi! Chúng nghĩ ta hiền lành đến thế sao!"
  ach_coronation.0013.desc_conversation.mean.4.lustful.guest: "Trời ơi! Chúng nghĩ [host.GetSheHe] hiền lành đến thế sao!"
  ach_coronation.0013.desc_conversation.mean.4.not_lustful: "Trời ơi! Sao lại có kẻ bịa ra chuyện đó chứ?"
  ach_coronation.0013.desc_conversation.mean.5: "\"Ta nghe nói hắn là một tên khốn [host.Custom('InsultAdjectiveGeneric')], những gì [host.GetSheHe] đã làm? Một con quái vật thực sự nếu đã từng có.\""
  ach_coronation.0013.desc_conversation.nice.1: ""Vạn tuế [host.GetTitleAsNameNoTooltip]!" một [peasant.Custom2('dummy_peasant_profession', peasant)] lè nhè trong tiếng reo hò say khướt."
  ach_coronation.0013.desc_conversation.nice.2: "\"Ta nghe nói [host.GetTitleAsNameNoTooltip] là [host.GetTitleAsNameNoTooltip] [host.Custom('GetPrettyAdjective')] và [host.Custom('GetPiousAdj')] nhất trên thế giới!\" Một người nói với người kia."
  ach_coronation.0013.desc_conversation.nice.3: ""[dummy_gender.Custom('GetRandomRelation')] của ta quen [ROOT.Char.Custom('GetRandomRelation')] và [ROOT.Char.GetSheHe] nói [host.GetTitledFirstNameNoTooltip] nhảy điệu [host.Custom('GetMedievalDance')] hay đến mức khiến ngươi phải khóc!" một [peasant.Custom2('dummy_peasant_profession', peasant)] tuyên bố."
  ach_coronation.0013.desc_conversation.nice.4: ""Ta đã thấy [host.GetTitleAsNameNoTooltip] một lần," một [peasant.Custom2('dummy_peasant_profession', peasant)] nói, "chỉ cần nhìn vào '[host.Custom('GetErIm')]' là ta biết [host.GetHerHim] là người tốt!""
  ach_coronation.0013.desc_conversation.nice.5: ""Chết tiệt cái tên mạo danh [claimant.Custom('InsultAdjectiveGeneric')] đó, [claimant.GetTitledFirstName]!" một [peasant.Custom2('dummy_peasant_profession', peasant)] hô lên giữa tiếng reo hò, "Vạn tuế [host.GetTitleAsNameNoTooltip] chính thống!""
  ach_coronation.0013.ending.agrees: "\n\nHa! Ta nghĩ những người tốt bụng này nói đúng!"
  ach_coronation.0013.ending.disagrees: "\n\nLũ #EMP nông dân#! đầu óc đơn giản này dám xúc phạm lãnh chúa của chúng sao!"
  ach_coronation.0013.ending.neutral: "\n\nNgay cả dân thường dạo này cũng có thời gian bàn chuyện chính trị."
  ach_coronation.0013.a.weaken_detractors: "Này, dân làng! Ta có một đề nghị."
  ach_coronation.0013.a.weaken_detractors.flavor: "Ta có thể nghĩ ra vài tin đồn hay hơn nhiều cho chúng truyền đi!"
  ach_coronation.0013.a.weaken_detractors.tt: "Kẻ thù của ngươi bị đám đông chế giễu"
  ach_coronation.0013.b: "Ừ thì, không thể thắng hết. #EMP LÍNH ĐÂU!#!"
  ach_coronation.0013.c: "Ta sẽ khiến chúng khiếp sợ quyền uy của vương miện!"
  ach_coronation.0013.c.tt.success: "Những người dân — mắt đầy sợ hãi — cầu xin tha mạng"
  ach_coronation.0013.c.tt.failure: "Tin đồn vẫn lan ra..."
  ach_coronation.0013.flavor: "Một trận mắng mỏ ra trò sẽ nhắc lũ ngu này biết giữ mồm giữ miệng."
  ach_coronation.0013.d: "Ngươi kia! Rót cho ta một chén!"
  ach_coronation.0013.d.flavor: "Ta sắp là [host.GetTitleAsNameNoTooltip] và ta muốn uống rượu, chết tiệt!"
  ach_coronation.0013.e: "À, thôi, quay lại việc của ta."
  ach_coronation.0013.e.disagrees: "Ta đứng cao hơn lũ ngu này rất nhiều."
  ach_coronation.0013.e.flavor.mean: "Tại sao ta phải bận tâm đến lời lải nhải của dân thường?"
  ach_coronation.0013.e.flavor.nice: "Ai bảo dân thường là vô học chứ!?"
  two_detractors_get_negative_rumors_tt: "Hai [coronation_detractors|E] sẽ nhận [modifier|E] #N [GetModifier('ach_negative_rumors_modifier').GetNameWithTooltip]#!"
  because_you_have_overseer_tt: "#P Kinh nghiệm của ngươi với tư cách [GetTrait('overseer').GetName( GetNullCharacter )] giúp ngươi tránh hậu quả tiêu cực đối với [coronation_magnificence|E]#!"
  violated_city_rights_opinion: "Vi Phạm Quyền Thành Thị"

  ach_coronation.0014.t: "Bên Bờ Hỗn Loạn"
  ach_coronation.0014.desc: "Từ phía sau đám đông, ta quan sát phái đoàn của [first.GetTitleAsName] xứ [first.GetPrimaryTitle.GetNameNoTier] tiến đến dự lễ đăng quang của [host.GetTitledFirstNamePossessive]."
  ach_coronation.0014.desc.weather.rain: "Mưa đã trút xuống suốt cả ngày hôm nay, và"
  ach_coronation.0014.desc.weather.clear: "Dù hôm nay là một ngày khá dễ chịu,"
  ach_coronation.0014.desc.weather.indoors: "[ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] chật kín người, "
  ach_coronation.0014.desc.reason.rain: "dân thường trở nên bẩn thỉu và cáu kỉnh hơn thường lệ. Một người địa phương trượt chân trong bùn và ngã ra đường, và ngay sau đó những binh lính quá khích của [first.GetTitleAsNamePossessiveNoTooltip] bắt đầu xô vào đám đông, đánh đập và đẩy dân thường ra xa chủ nhân của họ."
  ach_coronation.0014.desc.reason.local_discontent: "bầu không khí trong [coronation_site.GetHolding.GetHoldingType.GetName] đã căng thẳng từ lâu, và vài người dân tụ tập bắt đầu la ó chế nhạo [first.GetTitleAsNameNoTooltip] khi đoàn đi qua — thậm chí có kẻ còn hô vang những lời nguyền rủa nhắm vào [host.GetPrimaryTitle.GetTitleAsNameNoTooltip]!"
  ach_coronation.0014.desc.reason.low_control: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] từ lâu đã bất mãn với sự cai trị của [ROOT.Char.GetCurrentLocation.GetHolder.GetPrimaryTitle.GetAdjective], và đám đông đang theo dõi phái đoàn tỏ ra chẳng mấy thân thiện."
  ach_coronation.0014.desc.reason.generic_indoors: "và đám đông quần thần cùng khách khứa nhanh chóng chật vật tìm chỗ cho những người mới đến tiến vào. Đám đông bắt đầu kích động, đại sảnh thì nóng bức ngột ngạt, và vài [peasant.GetWomenMen] đã bắt đầu la hét và xô đẩy."
  ach_coronation.0014.desc.reason.generic_outdoors: "đám đông dường như đang kích động. Có quá nhiều người kéo đến xem phái đoàn. Mọi người chen chúc quá chặt và lính gác của [first.GetTitleAsNamePossessiveNoTooltip] trông vô cùng căng thẳng."
  ach_coronation.0014.desc.ending: "\n\nMột nhận thức chợt lóe lên — đám đông này có thể phá hủy lễ đăng quang — tất cả những gì chúng cần chỉ là một"
  ach_coronation.0014.desc.ending.byzantine: "\n\nMột nhận thức chợt lóe lên — đám [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] tụ tập này hoàn toàn có thể bị kích động để phá hủy lễ đăng quang — tất cả những gì chúng cần chỉ là một"
  ach_coronation.0014.desc.ending.outdoors: "hòn đá..."
  ach_coronation.0014.desc.ending.indoors: "lời nói..."
  ach_coronation.0014.a.outdoors: "#EMP Nhắm vào [first.GetTitleAsNameNoTooltip]#!"
  ach_coronation.0014.a.indoors: "#BER "CHÁY!"#!"
  ach_coronation.0014.a.tt.success: "Ngươi châm ngòi cho một cuộc giẫm đạp hỗn loạn"
  ach_coronation.0014.a.tt.failure: "Ngươi ném trượt"
  ach_coronation.0014.a.tt.host.success: "Việc này có thể vô tình củng cố danh tiếng của [host.GetTitledFirstNamePossessive] — thất bại của ngươi có thể khiến ngươi chịu [stress|E]"
  ach_coronation.0014.a.tt.host.failure.magnificence: "[coronation_magnificence|E] của lễ đăng quang của [host.GetTitledFirstNamePossessive] có thể bị suy giảm nghiêm trọng"
  ach_coronation.0014.a.tt.host.failure.host: "[host.GetTitledFirstName] có thể mất [legitimacy|E] hoặc [prestige|E]"
  ach_coronation.0014.a.tt.host.failure.crackdown: "[host.GetTitledFirstName] có thể phản ứng thái quá, khiến nhiều người thiệt mạng hơn và làm tăng [dread|E] cùng [tyranny|E] của [host.GetHerHis]"
  ach_coronation.0014.a.tt.failure.indoors: "Không ai nghe thấy ngươi giữa tiếng ồn"
  ach_coronation.0014.a.rock: "[first.GetShortUIName] bị một hòn đá đập trúng mặt và nhận [trait|E] [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
  ach_coronation.0014.b: "Có lẽ đám đông này còn có thể dùng vào việc khác..."
  ach_coronation.0014.b.flavor: "Những điệp viên của ta di chuyển không ai nhận ra khắp [coronation_site.GetHolding.GetHoldingType.GetName]."
  ach_coronation.0014.b.tt: "Ngươi phải là [GetTrait('schemer').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], hoặc có ít nhất [SCOPE.ScriptValue('very_high_skill_rating')|0V] [intrigue|E]"
  ach_coronation.0014.c: "Ta sẽ là người đầu tiên tiến lên bày tỏ kính ý."
  if_host_calms_crowd_desc: "Nếu [TARGET_CHARACTER.GetShortUIName] lập lại trật tự:"
  if_crush_happens_desc: "#X Nếu không:#!"

  ach_coronation.0015.t: "Cuộc Giẫm Đạp Vĩ Đại Năm [GetCurrentDate.GetYear]"
  ach_coronation.0015.desc: "Thảm họa! Đám đông đang theo dõi đoàn tùy tùng của [first.GetTitledFirstName] vừa mới đến — vì những lý do ta không rõ — đã rơi vào hỗn loạn. Ta đến vừa kịp lúc để thấy một khối người địa phương xô đẩy qua lại, lính gác của [first.GetTitleAsNamePossessiveNoTooltip] thì либо đánh đập dân thường đã ngã xuống, либо bị kéo ngã và bị giẫm đạp cùng họ.\n\nLính gác hầu như không thể giữ nổi đám đông và bạo lực chỉ càng khiến sự hoảng loạn lan rộng. Chẳng mấy chốc sẽ biến thành một cuộc giẫm đạp!"
  ach_coronation.0015.has_happened: "Chuyện này xảy ra do hành động của một [coronation_detractor|E] xảo trá!"
  ach_coronation.0015.a: "Ta phải trấn an đám đông!"
  ach_coronation.0015.a.august: "Đồng bào! [ROOT.Char.GetTitleAsNameNoTooltip] của các ngươi yêu cầu trật tự!"
  ach_coronation.0015.a.august.tt: "Uy quyền không thể chối cãi của ngươi khiến đám đông lắng xuống."
  ach_coronation.0015.a.tt.success: "Thành công!"
  ach_coronation.0015.a.tt.success.desc: "Ngươi ngăn được thêm đổ máu — một điềm lành cho triều đại của ngươi!"
  ach_coronation.0015.a.tt.critical_success: "Một bài diễn thuyết huyền thoại"
  ach_coronation.0015.a.tt.critical_success.desc: "Đám đông im bặt trong sự kinh ngạc. Nhiều người thậm chí rơi lệ trước vẻ đẹp của lời nói của ngươi."
  ach_coronation.0015.a.tt.failure.title: "Thất bại"
