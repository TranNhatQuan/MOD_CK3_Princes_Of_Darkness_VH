l_english:
  feast_default_axel.1001.t: "Sự Nông Nổi Của Tuổi Trẻ"
  feast_default_axel.1001.desc: "\"Ta — #EMP HIC#! — hứa đấy, đây là nơi [ROOT.Char.GetTitleAsNameNoTooltip] tốt bụng của chúng ta cất giữ loại đồ uống ngon nhất của [ROOT.Char.GetHerHis],\" ta nghe [youngster_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngster_1'))] của ta, nói với [youngster_2.GetTitledFirstName] khi chúng đang cướp bóc hầm rượu của ta.\n\nRõ ràng hai đứa này đã tìm thấy sự đồng điệu ở nhau và đang không tôn trọng ân huệ của ta."
  feast_default_axel.1001.a: "Tiếc cho chúng, ta đã uống cạn kho dự trữ rồi."
  feast_default_axel.1001.b: "Lại đây, để ta chỉ cho các ngươi..."
  feast_default_axel.1001.c: "Cút ra ngoài, nếu không ta sẽ cho đánh roi!"

  drunk_high_spirits: "Hứng Khởi Vì Men Rượu"
  drunk_high_spirits_desc: "Nhân vật này đang quá chén, lục sạch mọi kho rượu mà họ có thể tìm thấy."
  bad_influence_modifier: "Ảnh Hưởng Xấu"
  bad_influence_modifier_desc: "Nhân vật này nổi tiếng là một kẻ lưu manh đê tiện, thường dẫn dắt người khác đi vào con đường sai trái."
