 # Non Royal Liege
 ## Activity Start: Liege decides whether or not to hear petition
 petition_liege.0001.a.tt_non_royal: "Ngươi tiếp [petition_vassal.GetTitledFirstName] tại [royal_court|E] của [liege|E] của ngươi"
 ## Desc
 petition_liege.0101.desc_non_royal: "[petition_vassal.GetTitledFirstName] cuối cùng cũng được dẫn vào đại sảnh của [liege_possessive|E] của ta, và chẳng hề chần chừ bước thẳng tới ngai rồi cúi mình thật sâu. \n\n"Cảm tạ ngài đã tiếp kiến ta, [petition_liege.GetTitledFirstNamePossessive]. Hôm nay ta đến với một thỉnh cầu khẩn thiết —""
 petition_liege.0101.desc.title_liege_non_royal: "kính thưa [petition_liege.GetTitleAsNameNoTooltip], [petition_claim.GetName] vốn thuộc về ta!" \n\n"Ngài cai quản một [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] hùng mạnh, thưa [petition_liege.GetLadyLord], chẳng lẽ ngài không thể ban cho ta chỉ một [petition_claim.GetTierAsNameNoTooltip] mà ta có yêu sách chính đáng sao?""
 petition_liege.0201.a_non_royal: "Đa tạ ngài, thưa [petition_liege.GetLadyLord]!"

 petition_liege.0221.a: "Ta xin khắc ghi ân tình muôn đời, vĩ đại [petition_liege.GetTitleAsNameNoTooltip]!"
 ## Liege asks for something in return
 petition_liege_skillcheck_counter_tt_non_royal: "Cố gắng thuyết phục [petition_liege.GetHerHim] bằng các phương tiện khác"
 # Ceremonial Liege
 petition_liege.0021.opening: "Kính chào, thưa [petition_liege.GetTitleAsNameNoTooltip],"
 petition_liege.0021.desc.no_travel: "Ta vô cùng vinh dự nếu được diện kiến và được trình bày một vấn đề hệ trọng đối với lòng ta.\n\nTa sẽ kiên nhẫn chờ đợi lời triệu kiến từ hoàng cung vào lúc thuận tiện nhất cho bệ hạ."
 petition_liege.0029.opening: "Xin gửi lời kính chào khiêm nhường nhất tới ngài, vĩ đại [petition_liege.GetTitleAsNameNoTooltip],"
 petition_liege.0121.t.regent: "Ủng Hộ Chức Vụ"
 petition_liege.0121.t.appointment: "Thăng Tiến Gia Tộc"
 petition_liege.0121.t.wedding: "Hôn Nhân Hoàng Gia"
 petition_liege.0121.t.privilege: "Công Nhận Danh Giá"
 petition_liege.0121.desc: "[petition_vassal.GetTitledFirstName] cuối cùng cũng được dẫn vào đại sảnh của ta, và chẳng hề chần chừ bước thẳng tới ngai rồi cúi mình thật sâu. \n\n"Cảm tạ ngài đã tiếp kiến ta, vĩ đại [petition_liege.GetTitleAsNameNoTooltip]. Hôm nay ta đến để bàn một chuyện hệ trọng —""
 petition_liege.0121.desc.regent: "vấn đề ai sẽ trở thành người kế nhiệm của [petition_vassal.GetTopLiege.GetTitledFirstNamePossessive] trong việc quản trị lãnh địa của ngài vẫn chưa được quyết định."\n\n"Ta mong ngài đồng ý rằng, nếu ta khiêm nhường đề cử chính mình cho vinh dự này, ta sẽ phục vụ ngai vàng một cách tốt nhất.""
 petition_liege.0121.desc.appointment: "gia tộc của ta, như nhiều gia tộc cao quý khác tại [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], mong được vinh dự phục vụ ngai vàng, đảm nhiệm vai trò tổng đốc và quan lại."\n\n"Chúng ta đã chứng minh mình là những bề tôi trung thành và khéo léo của lãnh địa, và sẽ vô cùng vinh hạnh nếu nhận được sự ủng hộ của ngài trong việc bổ nhiệm quan chức.""
 petition_liege.0121.desc.wedding: "chỉ những gia tộc cao quý nhất mới dám mong sánh được dù chỉ một phần ân sủng của dòng dõi hoàng gia."\n\n"Với tất cả sự khiêm nhường, ta xin xếp gia tộc mình vào hàng ấy, và cầu xin sự ủng hộ của ngài cho một cuộc hôn nhân hoàng gia.""
 petition_liege.0121.desc.privilege: "nhiều gia tộc tranh chấp trong lãnh địa đã quên mất sự cao quý và phẩm giá mà địa vị của họ từng mang lại. Chỉ còn ít nhà còn giữ được phẩm chất ấy, và ta dám đặt gia tộc mình trong số đó."\n"Với tất cả sự khiêm nhường, ta mong bệ hạ công nhận công trạng của chúng ta như một trong những gia tộc hàng đầu của lãnh địa."
 petition_liege.0121.accept.regent: "Từ lâu ta đã hy vọng ngươi sẽ gánh vác trách nhiệm này."
 petition_liege.0121.accept.appointment: "Ít gia tộc nào phục vụ tận tụy và trung thành đến vậy."
 petition_liege.0121.accept.wedding: "Ngươi đã chứng minh được vị thế của gia tộc mình."
 petition_liege.0121.accept.privilege: "Danh tiếng của gia tộc ngươi không còn gì phải nghi ngờ."
 petition_liege.0121.bribe_gold: "Ngai vàng hào phóng với những kẻ hào phóng với ngai vàng."
 petition_liege.0121.bribe_bloc: "Ngai vàng tưởng thưởng cho những kẻ chứng minh sự ủng hộ của mình."
 petition_liege.0121.bribe_favor: "Ân huệ của ngai vàng không nên sớm bị lãng quên."
 petition_liege.0121.bribe_vows: "Ân huệ của ngai vàng dành cho những kẻ chứng minh lòng sùng đạo."
 petition_liege.0121.bribe_knight: "Ân huệ của ngai vàng dành cho những bề tôi trung thành nhất."
 petition_liege.0121.refusal: "Yêu cầu này không xứng với phẩm giá của vương quyền."

 petition_liege.0221.desc.regent: "\n\nTa khiêm tốn yêu cầu sự hỗ trợ của [petition_liege.GetHerHis] cho nỗ lực của ta để đạt được chức vụ cao nhất, liệt kê những thành tựu trước đây của ta và từng ví dụ về lòng trung thành không lay chuyển của ta."
 petition_liege.0221.desc.appointment: "\n\nTa khẩn cầu [petition_liege.GetLadyLord] của ta ghi nhận những phẩm chất của ta với tư cách là một bề tôi, và ủng hộ sự thăng tiến của ta trong sự phục vụ của [petition_liege.GetHerHis] và vương quốc."
 petition_liege.0221.desc.wedding: "\n\nTa bày tỏ vinh dự to lớn mà gia tộc ta sẽ nhận được nếu được kết thông gia với hoàng thất, đồng thời làm rõ phẩm giá của huyết thống [ROOT.Char.GetHouse.GetNameNoTooltip] và sự xứng đáng của con trai con gái trong gia tộc ta."
 petition_liege.0221.desc.privilege: "Ta khẩn cầu [petition_liege.GetTitleAsNameNoTooltip] chính thức công nhận dòng dõi cao quý của gia tộc ta trong hàng quý tộc của [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]]."
 
 petition_liege.0225.b: "Ta e rằng điều này không thể."

 petition_liege.0229.counter: "Bệ hạ, xin hãy chờ một chút!"

 petition_liege.0221.desc.bridge: "\n\nSau khi nghe xong lời trình bày, [petition_liege.GetSheHe] chờ một lát, rồi [petition_liege.GetSheHe] mỉm cười ấm áp và nói, "Ngươi đưa ra những lý lẽ khôn ngoan! Được thôi, ta sẽ lập tức cho giải quyết việc này.""
 petition_liege.9021.regent: "Ủng hộ ta tranh cử chức vụ cao nhất."
 petition_liege.9021.appointment: "Ủng hộ sự nghiệp của gia tộc ta."
 petition_liege.9021.wedding: "Chấp thuận một cuộc hôn nhân hoàng gia."
 petition_liege.9021.privilege: "Công nhận phẩm giá của gia tộc ta."
 petition_ceremonial_liege_skillcheck_counter_tt: "Thử thuyết phục [petition_liege.GetTitleAsNameNoTooltip] bằng cách khác"
