 # Skill check counter event
 petition_liege.0401.t:0 "$petition_liege_header$ Ý Kiến Thứ Hai"
 petition_liege.0401.desc.intro:2 "[petition_liege.GetTitledFirstName] suy nghĩ một lúc rồi gọi lớn, "[first_portrait.GetFirstName], ta cần lời khuyên của ngươi về chuyện này!" [first_portrait.Custom('GetNotableCharacteristic')] [first_portrait.Custom('GetPetitionLiegeTitle')] bước lên đầy hào hứng, nắm chặt [first_portrait.GetHerHis] [first_portrait.Custom('councillor_flavor_prop')]. "Vâng, một vấn đề vô cùng tinh tế, thưa [petition_liege.GetLadyLord]..."\n\n"
 petition_liege.0401.desc.second:0 "[second_portrait.GetTitledFirstName], [second_portrait.Custom('GetPetitionLiegeTitle')] của [petition_liege.GetTitleAsNamePossessiveNoTooltip], lặng lẽ quan sát từ bên ngoài"
 petition_liege.0401.desc.second_diplomacy:0 "$petition_liege.0401.desc.second$ — có lẽ ta có thể kêu gọi bản tính ngoại giao của [second_portrait.GetHerHis]?\n\n"
 petition_liege.0401.desc.second_martial:0 "$petition_liege.0401.desc.second$ — một lập luận thực tế có thể giành được sự ủng hộ của [second_portrait.GetHerHis]?\n\n"
 petition_liege.0401.desc.second_stewardship:0 "$petition_liege.0401.desc.second$ — những con số phù hợp có thể thuyết phục [second_portrait.GetHerHim] về nhu cầu của ta?\n\n"
 petition_liege.0401.desc.second_intrigue:0 "$petition_liege.0401.desc.second$ — nếu ta công khai qua mặt [second_portrait.GetHerHim]?\n\n"
 petition_liege.0401.desc.second_learning:1 "$petition_liege.0401.desc.second$ — không ai có thể bác bỏ một lập luận mà #EMP [second_portrait.GetHerHim]#! không phản biện được.\n\n"
 petition_liege.0401.desc.third_soulmate:0 "Mặt khác, người tri kỷ của ta [third_portrait.GetTitledFirstName] cũng ở gần đây"
 petition_liege.0401.desc.third_lover:0 "[third_portrait.GetTitledFirstName] kín đáo nháy mắt với ta"
 petition_liege.0401.desc.third_best_friend:0 "Người tâm phúc thân thiết nhất của ta, [third_portrait.GetTitledFirstName], đang có mặt"
 petition_liege.0401.desc.third_friend:0 "Dù vậy... người bạn tốt của ta [third_portrait.GetTitledFirstName] cũng có thể có chút ảnh hưởng"
 petition_liege.0401.desc.third_fallback:0 "Dù sao thì [third_portrait.GetTitledFirstName] vẫn luôn có thiện cảm với ta"
 petition_liege.0401.desc.third:1 " — có lẽ [third_portrait.GetSheHe] sẽ giúp ta trình bày? \n\n"
 petition_liege.0401.desc.outro:0 "[petition_liege.GetTitleAsNameNoTooltip] quay lại nhìn ta, nhưng sự chú ý của [petition_liege.GetHerHis] đã bắt đầu chuyển sang nơi khác. Ta cần #EMP làm#! điều gì đó!"
 petition_liege.0401.first:0 "Ta biết cách khiến [first_portrait.GetFirstNameNoTooltip] lúng túng..."
 petition_liege.0401.second:0 ""[second_portrait.GetFirstNameNoTooltip]!""
 petition_liege.0401.second_diplomacy:0 "$petition_liege.0401.second$ Chắc chắn vẫn có chỗ cho một sự thỏa hiệp?"
 petition_liege.0401.second_martial:0 "$petition_liege.0401.second$ Chắc hẳn #EMP ngài#! thấy rõ quan điểm của ta?"
 petition_liege.0401.second_stewardship:0 "$petition_liege.0401.second$ Lý lẽ này hẳn phải rõ ràng với #EMP ngài#!?"
 petition_liege.0401.second_intrigue:0 "$petition_liege.0401.second$ Chắc #EMP ngài#! cũng thấy điều này hợp lý?"
 petition_liege.0401.second_learning:0 "$petition_liege.0401.second$ #EMP Ngài#! hẳn phải thấy sự khôn ngoan trong đó?"
 petition_liege.0401.wildcard:0 "[third_portrait.GetTitledFirstNameNoTooltip] sẽ nói giúp ta!"
 petition_liege.0401.success:0 "[petition_liege.GetTitledFirstNameNoTooltip] đã bị thuyết phục"
 petition_liege.0401.failure:0 "[petition_liege.GetTitledFirstNameNoTooltip] không bị thuyết phục"
 # Second party request event
 petition_liege.0501.opening:0 "[second_party.Custom2('AppropriateGreeting', ROOT.Char )]"
 petition_liege.0501.desc:0 "Trung thành [second_party.GetTitledFirstName], thật đáng tiếc khi phải đặt ngươi vào tình thế này. \n\nTa phải yêu cầu ngươi từ bỏ [petition_claim.GetName] để nhường lại cho [petition_vassal.GetTitledFirstName], người cũng có tuyên bố chủ quyền đối với tước vị này. Ta tin rằng ngươi sẽ tôn trọng ý nguyện của ta trong vấn đề này."
 petition_liege.0501.a:0 "Ta còn lựa chọn nào khác sao...?"
 petition_liege.0501.b:0 "Ta không thể chấp nhận điều này!"
 petition_liege.0501.refuse_tt:0 "[second_party.GetTitledFirstName] từ chối từ bỏ [petition_claim.GetName]"
 # Invalidated event
 petition_liege.0601.t:0 "$petition_liege_header$ Không Còn Hiệu Lực"
 petition_liege.0601.desc.court:0 "Với lễ đăng quang của ta với tư cách [ROOT.Char.GetTitleAsNameNoTooltip] đã hoàn tất, thỉnh cầu của ta giờ không còn cần thiết nữa..."
 petition_liege.0601.desc.imprisoned_me:0 "$petition_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] đã ném ta vào ngục."
 petition_liege.0601.desc.imprisoned:0 "$petition_liege.0601_shared_intro$ Ta đã bị bắt bởi [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 petition_liege.0601.desc.liege_dead_me:0 "$petition_liege.0601_shared_intro$ Ta đã giết [petition_liege.GetTitledFirstName]... \n\n"
 petition_liege.0601.desc.liege_dead:0 "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] [petition_liege.GetDeathReasonHideKiller]... \n\n"
 petition_liege.0601.desc.liege_imprisoned_me:0 "$petition_liege.0601_shared_intro$ Ta đã bắt giữ [petition_liege.GetTitledFirstName]!"
 petition_liege.0601.desc.liege_imprisoned:0 "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] đã bị bắt bởi [petition_liege.GetImprisonedBy.GetTitledFirstName]."
 petition_liege.0601.desc.new_liege:0 "Yêu cầu của ta giờ sẽ phải được trình lên lãnh chúa mới của ta, [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 petition_liege.0601_shared_intro:0 "Ngay khi thỉnh cầu của ta vừa được khởi động và sắp sửa có kết quả,"
 petition_liege.0601.desc:0 "\n\nĐiều này chắc chắn đã thay đổi tình hình."
