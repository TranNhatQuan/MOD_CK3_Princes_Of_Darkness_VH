l_english:
 # General Loc Strings
 petition_liege_header:0 "Thỉnh cầu:"

 # Activity Start: Liege decides whether or not to hear petition
 petition_liege.0001.opening:1 "[petition_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 petition_liege.0001.desc:1 "Ta và đoàn tùy tùng vừa đến [petition_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] sau chuyến hành trình mệt mỏi để gặp ngài.\n\nTa xin được diện kiến vào thời gian sớm nhất thuận tiện cho ngài."
 petition_liege.0001.a:1 "Hãy gọi [petition_vassal.GetTitledFirstNameNoTooltip] và đưa [petition_vassal.GetHerHim] đến gặp ta!"
 petition_liege.0001.a.tt:1 "Bạn tiếp kiến [petition_vassal.GetTitledFirstName] trong [royal_court|E] của mình"
 petition_liege.0001.b:1 "Ta quá bận để giải quyết [petition_vassal.GetHerHim] lúc này."
 petition_liege.0001.b.arrogant:1 "Bah, ta không có thời gian tiếp một #EMP [petition_vassal.GetTitleAsNameNoTooltip]# tầm thường!!"
 petition_liege.0001.b.humble:1 "Hãy gửi tới [petition_vassal.GetTitledFirstNameNoTooltip] lời xin lỗi chân thành nhất của ta rằng ta không thể tiếp kiến [petition_vassal.GetHerHim]."
 petition_liege.0001.b.tt:1 "Bạn cho [petition_vassal.GetTitledFirstName] rời đi"

# Activity End: Vassal learns that liege refuses to hear petition
 petition_liege.0009.opening:2 "[petition_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 petition_liege.0009.desc:0 "Thật không may, ngài đã đến vào thời điểm khó khăn, và ta phải thông báo rằng ta không thể tiếp đón ngài cùng đoàn tùy tùng trong đại sảnh của ta."
 petition_liege.0009.a:1 "Từ chối thậm chí #EMP lắng nghe#! ta sao? Thật trơ trẽn, cái [petition_liege.GetWomanMan] đó!"

# Liege hears petition, makes a decision
# Title
 petition_liege.0101.t.gold: "$petition_liege_header$ Vàng"
 petition_liege.0101.t.council_seat:0 "$petition_liege_header$ Bổ nhiệm Hội đồng"
 petition_liege.0101.t.pay_debt:0 "$petition_liege_header$ Thanh toán Nợ"
 petition_liege.0101.t.war_aid:0 "$petition_liege_header$ Hỗ trợ Quân sự"
 petition_liege.0101.t.end_war:0 "$petition_liege_header$ Chấm dứt Chiến tranh Chư hầu"
 petition_liege.0101.t.faction_war:0 "$petition_liege_header$ Giải tán Phe phái"
 petition_liege.0101.t.county_control:0 "$petition_liege_header$ Yêu cầu Quan Quản Hạt"
 petition_liege.0101.t.county_convert:0 "$petition_liege_header$ Tài trợ Giáo sĩ"
 petition_liege.0101.t.county_opinion:1 "$petition_liege_header$ Ngự giá Hoàng gia"
 petition_liege.0101.t.fortify_border:0 "$petition_liege_header$ Củng cố Biên giới"
 petition_liege.0101.t.title_liege:0 "$petition_liege_header$ Người yêu sách tước vị"
 petition_liege.0101.t.title_vassal:0 "$petition_liege_header$ Chư hầu yêu sách tước vị"
 petition_liege.0101.t.construct_city:0 "$petition_liege_header$ Phát triển Đô thị"
 petition_liege.0101.t.construct_temple:0 "$petition_liege_header$ Tài trợ [petition_vassal.GetFaith.HouseOfWorship|U]"
 petition_liege.0101.t.development:0 "$petition_liege_header$ Phát triển Thủ đô"
 petition_liege.0101.t.house_fief: "$petition_liege_header$ Lãnh địa $japan_feudal_government$ Fief"
 # Desc
 petition_liege.0101.desc:1 "[petition_vassal.GetTitledFirstName] cuối cùng cũng được dẫn vào đại sảnh của ta, và không lãng phí thời gian tiến thẳng tới ngai vàng rồi cúi chào thật sâu. \n\n\"Cảm tạ ngài đã tiếp kiến, thưa chủ quân. Hôm nay ta đến với một thỉnh cầu khẩn thiết —\""
 petition_liege.0101.desc.council_seat:0 "xin hãy cho phép thần được ngồi trong hội đồng của ngài, thưa [petition_liege.GetLadyLord].\"\n\n\"Tài năng của thần bị bỏ qua trong khi những [petition_vassal.GetWomenMen] kém cỏi hơn lại được lắng nghe ở cấp cao nhất; thần mong được chia sẻ gánh nặng của vương quốc với vai trò [petition_vassal.Custom('GetCouncilPositionRequest')].\""
 petition_liege.0101.desc.gold: "thần tự hỏi liệu ngài có thể ban cho một ít vàng cho một thần dân trung thành, xét đến sự phục vụ và lòng trung thành của thần.\" \n\n\"Thần cam đoan số vàng đó sẽ được dùng để thúc đẩy lợi ích của vương quốc.\""
 petition_liege.0101.desc.pay_debt:0 "thần đã gặp phải một vài... khó khăn tài chính, do những sự việc hoàn toàn nằm ngoài tầm kiểm soát của thần.\" \n\n\"Vì lợi ích của vương quốc, ngài có thể giúp thần thanh toán các khoản nợ không?\""
 petition_liege.0101.desc.war_aid:0 "cuộc chiến [petition_war.GetName] đang diễn biến bất lợi; [second_party.GetTitledFirstNameNoTooltip] đang chiếm ưu thế. \n\nThưa [petition_liege.GetLadyLord], thất bại của thần cũng là thất bại của ngài. Xin hãy hỗ trợ thần vì lợi ích của vương quốc."
 petition_liege.0101.desc.end_war:1 "[second_party.GetTitledFirstNameNoTooltip] đã gây chiến với thần và những thần dân trung thành của ngài tại [petition_vassal.GetPrimaryTitle.GetName]!" \n\n\"Chắc chắn cuộc nội chiến này chỉ làm suy yếu tất cả chúng ta, và nên bị chấm dứt ngay lập tức?\""
 petition_liege.0101.desc.faction_war:0 "thần đang bị [second_party.GetTitledFirstName] và phe [vassal_faction.GetNameNoTooltip|l] của [second_party.GetHerHis] uy hiếp! \n\n\"Xin ngài hãy dạy cho lũ hỗn xược đó một bài học, vì lợi ích của vương quốc!\""
 petition_liege.0101.desc.county_control:0 "lãnh địa [petition_county_example.GetNameNoTooltip] đang bị những kẻ chống đối quấy phá khiến việc thu thuế trở nên bất khả thi!" \n\n\"Xin ngài, thưa [petition_liege.GetLadyLord], hãy giúp thần khuất phục bọn rắn độc này vì lợi ích của vương quốc.\""
 petition_liege.0101.desc.county_convert:0 "lãnh địa [petition_county_example.GetNameNoTooltip] đang bị những kẻ [petition_county_example.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] vô thần hung hăng hoành hành!" \n\n\"Các giáo sĩ của thần đã cố hết sức, nhưng e rằng họ cần thêm trợ giúp nếu vương quốc muốn thoát khỏi cái ác.\""
 petition_liege.0101.desc.county_opinion:0 "một căn bệnh bất mãn đang lan tràn trong lãnh địa của thần."\n\n\"Thưa [petition_liege.GetLadyLord], thần tin rằng một chuyến [petition_liege.Custom('GetRoyalCourtRank')] ngự giá sẽ thay đổi tâm trạng của dân chúng và đưa họ trở lại đúng quỹ đạo."
 petition_liege.0101.desc.fortify_border:0 "lãnh địa của thần nằm giữa [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] và kẻ thù của ngài!" \n\n\"[petition_county_example.GetNameNoTooltip] là một trong những vùng biên cương của vương quốc, và việc phòng thủ của nó cũng là trách nhiệm của ngài cũng như của thần.\""
 petition_liege.0101.desc.title_liege:0 "với tất cả sự kính trọng, bệ hạ, [petition_claim.GetName] vốn thuộc về thần!" \n\n\"Ngài cai trị một [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] hùng mạnh, thưa [petition_liege.GetLadyLord], chẳng lẽ ngài không thể ban cho thần chỉ một [petition_claim.GetTierAsNameNoTooltip] mà thần có yêu sách chính đáng sao?\""
 petition_liege.0101.desc.title_vassal:0 "[second_party.GetTitledFirstNamePossessive] [petition_claim.GetName] vốn thuộc về thần!" \n\n\"Thưa [petition_liege.GetLadyLord], ngài hẳn hiểu các yêu sách quan trọng thế nào đối với lãnh địa của chúng ta, xin hãy buộc [second_party.GetTitleAsNameNoTooltip] từ bỏ thứ không thuộc về [second_party.GetHerHim].\""
 petition_liege.0101.desc.construct_city:0 "[petition_construct_county.GetName] có tiềm năng lớn nhưng thiếu cơ sở hạ tầng cần thiết." \n\n\"Thưa [petition_liege.GetLadyLord], việc tài trợ xây dựng một thị trấn mới tại [petition_construct.GetName] sẽ mang lại lợi ích cho toàn vương quốc chỉ riêng về thương mại.\""
 petition_liege.0101.desc.construct_temple:0 "những tín đồ tại [petition_construct_county.GetNamePossessiveNoTooltip] đang cần một nơi thờ phụng." \n\n\"Thần sẽ vô cùng vinh dự nếu ngài giúp tài trợ xây dựng một [petition_liege.GetFaith.HouseOfWorship] mới tại [petition_construct.GetName], cho đức tin [petition_liege.GetFaith.GetAdjectiveNoTooltip].\""
 petition_liege.0101.desc.development:0 "lãnh địa của thần quá nghèo nàn so với thủ đô hùng mạnh của ngài." \n\n\"Xin hãy chia sẻ một phần tài sản của [petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierPossessive] cho vùng [petition_county_example.GetName] khiêm tốn này, vì lợi ích chung của vương quốc.\""
 petition_liege.0101.desc.house_fief: "xin ban cho thần quyền thừa kế và cơ hội cai trị lãnh địa của riêng mình, để toàn vương quốc có thể thịnh vượng.\""
 petition_liege.0101.desc.council_first_councillor:0 "\n\nVậy là [petition_vassal.GetSheHe] nghĩ rằng [petition_vassal.GetSheHe] có thể làm tốt hơn [second_party.GetTitledFirstName]..."
 petition_liege.0101.desc.council_second_councillor:0 "Có lẽ ta nên thay thế [second_councillor.GetTitledFirstName] thay vào đó."
 # Accept
 petition_liege.0101.accept.gold: "Ta có thể ban cho một ít vàng."
 petition_liege.0101.accept.council_seat:0 "Được thôi, ngươi sẽ có ghế trong hội đồng."
 petition_liege.0101.accept.council_seat_occupied:0 "Ngươi sẽ thay thế [second_party.GetTitledFirstNameNoTooltip] làm [second_party.GetCouncilTitle] của ta."
 petition_liege.0101.accept.pay_debt:0 "Được rồi, các khoản nợ của ngươi đã được thanh toán."
 petition_liege.0101.accept.war_aid:0 "Ta có thể điều một số binh lính."
 petition_liege.0101.accept:0 "Ta hiểu ý của ngươi. Được thôi, ta sẽ buộc chấm dứt cuộc chiến của ngươi."
 petition_liege.0101.accept.faction_war:0 "Những kẻ phản nghịch này sẽ phải trả lời trước ta."
 petition_liege.0101.accept.county_control:0 "Trật tự sẽ được khôi phục."
 petition_liege.0101.accept.county_convert:0 "Lũ con cái của [ROOT.Char.GetFaith.DevilNamePossessive] phải bị quét sạch."
 petition_liege.0101.accept.county_opinion:0 "Quần chúng sẽ được diện kiến [petition_liege.GetTitleAsNameNoTooltip] của họ."
 petition_liege.0101.accept.fortify_border:0 "Biên giới của ngươi cũng là biên giới của ta."
 petition_liege.0101.accept.title_liege:0 "Được thôi, [petition_claim.GetTierAsNameNoTooltip|l] là của ngươi."
 petition_liege.0101.accept.title_vassal:0 "Ta sẽ ủng hộ yêu sách của ngươi."
 petition_liege.0101.accept.construct_city:0 "Tại sao không? [petition_construct_county.GetDeJureLiege.GetNameNoTierNoTooltip] có thể cần một thị trấn mới."
 petition_liege.0101.accept.construct_temple:0 "[petition_construct_county.GetNameNoTierNoTooltip] đã thiếu một [petition_liege.GetFaith.BishopNeuter] quá lâu rồi."
 petition_liege.0101.accept.development:0 "Đúng vậy, [petition_liege.GetCapitalLocation.GetNameNoTooltip] đã quá đông đúc."
 petition_liege.0101.accept.house_fief: "Cách cai trị của ngươi sẽ không còn bị xem là tội lỗi nữa."
 # Bribe gold
 petition_liege.0101.bribe_gold.council_seat:0 "Những người trong vòng thân cận của ta phải chứng minh rằng họ có nền tảng tài chính vững vàng..."
 petition_liege.0101.bribe_gold.war_aid:0 "Huấn luyện, trang bị — và chẳng thứ nào là rẻ cả."
 petition_liege.0101.bribe_gold:0 "Ta có thể sắp xếp hòa bình, nhưng ngươi sẽ phải trả một số khoản #EMP bồi thường#!..."
 petition_liege.0101.bribe_gold.faction_war:0 "Hòa bình cũng có cái giá của nó."
 petition_liege.0101.bribe_gold.county_control:0 "Công việc này vừa khó khăn vừa tốn kém."
 petition_liege.0101.bribe_gold.county_convert:0 "[ROOT.Char.GetFaith.WealthGodName] cho chúng ta thấy rằng những việc như thế này không hề miễn phí."
 petition_liege.0101.bribe_gold.county_opinion:0 "Những chuyến thăm như vậy phát sinh rất nhiều chi phí."
 petition_liege.0101.bribe_gold.fortify_border:0 "Nào, ngươi cũng biết những biện pháp như vậy rất tốn kém."
 petition_liege.0101.bribe_gold.title_liege:0 "Yêu sách của ngươi đáng giá bao nhiêu đối với ngươi?"
 petition_liege.0101.bribe_gold.title_vassal:0 "Nó đáng giá bao nhiêu với ngươi, [petition_vassal.GetFirstNameNoTooltip]?"
 petition_liege.0101.bribe_gold.construct_city:0 "Chắc hẳn ngươi biết những việc như thế này tốn kém ra sao..."
 petition_liege.0101.bribe_gold.construct_temple:0 "Hẳn là ngươi sẽ tài trợ thêm một phần mở rộng chứ?"
 petition_liege.0101.bribe_gold.development:0 "Dĩ nhiên, nhưng sẽ cần một khoản bồi hoàn nhỏ."
 petition_liege.0101.bribe_gold.house_fief: "Chỉ khi ngươi sẵn sàng trả cái giá đó."
 # Bribe favor
 petition_liege.0101.bribe_favor.council_seat:0 "Những ân huệ như thế này phải được báo đáp."
 petition_liege.0101.bribe_favor.pay_debt:0 "Một ngày nào đó ta sẽ gọi ngươi để hoàn trả ân tình này."
 petition_liege.0101.bribe_favor.war_aid:0 "Ta mong ngươi sẽ giúp ta khi ta cần."
 petition_liege.0101.bribe_favor:1 "[second_party.GetFirstNameNoTooltip] sẽ không thích điều đó đâu. Ngươi sẽ nợ ta..."
 petition_liege.0101.bribe_favor.faction_war:0 "Ân huệ của ta tốt nhất là đừng bị lãng quên."
 petition_liege.0101.bribe_favor.county_control:0 "Ta sẽ giúp ngươi, nhưng ngươi cũng phải giúp ta."
 petition_liege.0101.bribe_favor.county_convert:0 "Nếu ngươi còn nhớ ngày hôm nay, và sự trợ giúp ta đã ban."
 petition_liege.0101.bribe_favor.county_opinion:0 "Ân huệ đổi lấy ân huệ."
 petition_liege.0101.bribe_favor.fortify_border:0 "Nếu ta làm điều này, ngươi phải đáp lại lời gọi của ta."
 petition_liege.0101.bribe_favor.title_liege:0 "Ta sẽ không sớm quên món nợ mà ngươi thiếu ta."
 petition_liege.0101.bribe_favor.title_vassal:0 "Ân huệ này phải được hoàn trả đầy đủ."
 petition_liege.0101.bribe_favor.construct_city:0 "Được thôi, nhưng đổi lại ngươi sẽ nợ ta."
 petition_liege.0101.bribe_favor.construct_temple:0 "[petition_liege.GetFaith.HighGodName] sẽ chứng kiến món nợ của ngươi."
 petition_liege.0101.bribe_favor.development:0 "[petition_vassal.GetCapitalLocation.GetNameNoTooltip] sẽ phát triển, nhưng #EMP ngươi#! sẽ mắc nợ."
 petition_liege.0101.bribe_favor.house_fief: "Đổi lấy một ân huệ."
 # Repay favor
 petition_liege.0101.repay_favor:0 "Món nợ của ta với ngươi sẽ kết thúc tại đây."
 # Bribe factions
 petition_liege.0101.bribe_factions.council_seat:0 "Các cố vấn của ta phải không thể bị chê trách."
 petition_liege.0101.bribe_factions.pay_debt:0 "Ngươi mắc nợ ta, và phải hành xử cho đúng."
 petition_liege.0101.bribe_factions.war_aid:0 "Thề trung thành, và ngươi sẽ có binh lính của ta."
 petition_liege.0101.bribe_factions:1 "Ta không thể dung thứ #EMP bất kỳ#! sự bất hòa nội bộ nào. #EMP Hết#!."
 petition_liege.0101.bribe_factions.faction_war:0 "Hãy nhớ điều này, vì ta cũng mong điều tương tự từ ngươi."
 petition_liege.0101.bribe_factions.county_control:0 "Đổi lại, ta tin rằng ta có thể trông cậy vào ngươi?"
 petition_liege.0101.bribe_factions.county_convert:0 "Hãy chứng minh lòng trung thành của ngươi và ta sẽ cử [ROOT.Char.GetFaith.AltPriestTermPlural]."
 petition_liege.0101.bribe_factions.county_opinion:0 "Ta có thể xuất hiện, nhưng ngươi phải tránh xa chính trị."
 petition_liege.0101.bribe_factions.fortify_border:0 "Lòng trung thành của ngươi, đổi lấy sự yên tâm của ngươi."
 petition_liege.0101.bribe_factions.title_liege:0 "Ta có thể nhượng nó, nhưng ta mong đợi lòng trung thành của ngươi."
 petition_liege.0101.bribe_factions.title_vassal:0 "Đổi lấy tước vị này, ta muốn lòng trung thành vô tận của ngươi."
 petition_liege.0101.bribe_factions.construct_city:0 "Thị trấn này sẽ đánh dấu lòng trung thành của ngươi với ta."
 petition_liege.0101.bribe_factions.construct_temple:0 "Từ bỏ phe phái, và ngươi sẽ có [petition_liege.GetFaith.HouseOfWorship] của mình."
 petition_liege.0101.bribe_factions.development:0 "Lòng trung thành của ngươi là cái giá hợp lý cho sự ban ân này."
 petition_liege.0101.bribe_factions.house_fief: "Hãy trung thành, và cách cai trị mới của ngươi sẽ được chấp nhận."
 # Bribe contract
 petition_liege.0101.bribe_contract.council_seat:0 "Một khoản đóng góp hào phóng sẽ đảm bảo cho ngươi một ghế."
 petition_liege.0101.bribe_contract.pay_debt:0 "Ta sẽ tăng nghĩa vụ của ngươi để hoàn trả."
 petition_liege.0101.bribe_contract.war_aid:0 "Quà tặng phải đến từ cả hai phía."
 petition_liege.0101.bribe_contract.vassal_war:0 "Ngươi sẵn sàng trao cho ta điều gì để đổi lấy hòa bình?"
 petition_liege.0101.bribe_contract.faction_war:0 "Hãy thể hiện lòng biết ơn của ngươi, và ta sẽ giúp."
 petition_liege.0101.bribe_contract.county_control:0 "Trật tự có cái giá của nó, và cái giá đó phải được trả."
 petition_liege.0101.bribe_contract.county_convert:0 "Trách nhiệm lớn hơn sẽ bù đắp cho sự trợ giúp này."
 petition_liege.0101.bribe_contract.county_opinion:0 "Ta tin rằng thành quả của sự hài lòng sẽ được chia sẻ?"
 petition_liege.0101.bribe_contract.fortify_border:0 "Nghĩa vụ của ngươi sẽ tăng để bù chi phí của ta."
 petition_liege.0101.bribe_contract.title_liege:0 "Những vùng đất này đi kèm với nghĩa vụ lớn hơn."
 petition_liege.0101.bribe_contract.title_vassal:0 "Nếu ngươi sẵn sàng đóng góp nhiều hơn [second_party.GetSheHe]."
 petition_liege.0101.bribe_contract.construct_city:0 "Nghĩa vụ lớn hơn sẽ bù đắp chi phí."
 petition_liege.0101.bribe_contract.construct_temple:0 "Ta sẽ chia sẻ gánh nặng của ngươi nếu ngươi chia sẻ gánh nặng của ta."
 petition_liege.0101.bribe_contract.development:0 "Ta mong nhận được một phần lợi ích của ngươi."
 petition_liege.0101.bribe_contract.house_fief: "Một yêu cầu như vậy đòi hỏi một số hy sinh."
 # Refuse
 petition_liege.0101.refusal.council_seat:0 "Còn những yếu tố khác cần phải cân nhắc."
 petition_liege.0101.refusal.pay_debt:0 "Sổ sách của chư hầu ta là chuyện của chính họ."
 petition_liege.0101.refusal.war_aid:0 "Ngươi phải tự tìm lấy chiến thắng cho mình."
 petition_liege.0101.refusal:0 "Nếu ngươi quá yếu để cai trị, thì có lẽ ngươi không nên cai trị."
 petition_liege.0101.refusal.faction_war:0 "Ta sẽ không chiến đấu thay cho ngươi."
 petition_liege.0101.refusal.county_control:0 "Lãnh địa của ngươi đi kèm với trách nhiệm, [petition_vassal.GetTitleAsNameNoTooltip]."
 petition_liege.0101.refusal.county_convert:0 "Những linh hồn đó là thần dân của ngươi, vì vậy đó là vấn đề của #EMP ngươi#!."
 petition_liege.0101.refusal.county_opinion:0 "Than ôi, ta quá bận rộn cho những chuyện phù phiếm như vậy."
 petition_liege.0101.refusal.fortify_border:0 "Ta cũng có những lâu đài của riêng mình cần duy trì."
 petition_liege.0101.refusal.title_liege:0 "Chính ta cũng có yêu sách đối với [petition_claim.GetNameNoTierNoTooltip]."
 petition_liege.0101.refusal.title_vassal:0 "Yêu sách của ngươi chỉ mạnh bằng cánh tay cầm kiếm của ngươi."
 petition_liege.0101.refusal.construct_city:0 "Lãnh địa của ngươi là trách nhiệm của chính ngươi."
 petition_liege.0101.refusal.construct_temple:0 "Những người mộ đạo thường tự mình tài trợ nhà thờ."
 petition_liege.0101.refusal.development:0 "Than ôi, có những vùng đất được ban phước nhiều hơn những vùng khác."
 petition_liege.0101.refusal.house_fief: "Ngươi đòi hỏi quá nhiều, điều này #EMP phải#! tiếp tục bị xem là tội."
 # Council
 petition_liege.0101.council_second_occupied:0 "[second_councillor.GetTitledFirstNameNoTooltip] sẽ rời vị trí [second_councillor.GetCouncilTitle]."
 petition_liege.0101.council_second:0 "Ta có một ý định khác."
 # War Aid
 petition_liege.0101.war_aid_join:0 "Chúng ta sẽ đánh bại [second_party.GetFirstNameNoTooltip]."
 # Tooltips
 petition_liege.0101.additional_effects:0 "Sửa đổi mức độ chấp nhận theo những cách sau:"
 petition_liege.0101.bribe_given:1 "Nếu [petition_vassal.GetSheHe] chấp nhận đề nghị phản hồi của bạn"
 petition_liege.0101.bribe_refused:1 "Nếu [petition_vassal.GetSheHe] từ chối đề nghị phản hồi của bạn"
# Liege grants petition
 petition_liege.0201.t:0 "$petition_liege_header$ Được chấp thuận"
 petition_liege.0201.desc.intro:0 "Ta được hộ tống vào phòng ngai của [petition_liege.GetTitledFirstNamePossessive], nơi [petition_liege.GetSheHe] ra hiệu cho ta tiến lên và trình bày với [petition_liege.GetHerHim]."
 petition_liege.0201.desc.council_seat:0 "\n\nTa trình bày rõ ràng những năng lực của mình, đã được chứng minh cũng như chưa, khiến ta trở thành ứng viên phù hợp cho vị trí [petition_liege.GetTitleAsNamePossessiveNoTooltip] [petition_vassal.Custom('GetCouncilPositionRequest')], xin đảm nhận vị trí cố vấn của [petition_liege.GetHerHis]."
 petition_liege.0201.desc.war_aid:0 "\n\nTa khẩn cầu [petition_liege.GetLadyLord] hãy ban sức mạnh để hỗ trợ chính nghĩa của ta bằng bất kỳ cách nào [petition_liege.GetSheHe] có thể, kẻo một chư hầu trung thành của vương quốc bị đánh bại."
 petition_liege.0201.desc.pay_debt:0 "\n\nTa cầu xin [petition_liege.GetTitleAsNameNoTooltip] hãy thấu hiểu những thử thách to lớn mà lãnh địa của ta đã phải đối mặt, khiến kho bạc của ta trống rỗng, và khẩn cầu [petition_liege.GetHerHim] giúp thanh toán các khoản nợ của ta..."
 petition_liege.0201.desc.vassal_war:0 "\n\nTa trình bày rõ nguyên nhân và diễn biến của cuộc xung đột đang diễn ra giữa ta và [second_party.GetTitledFirstName], và yêu cầu [petition_liege.GetTitleAsNameNoTooltip] áp đặt hòa bình để chấm dứt đổ máu trong vương quốc của [petition_liege.GetHerHis]."
 petition_liege.0201.desc.faction_war:0 "\n\nTa tóm lược những sự kiện dẫn đến sự phản nghịch công khai của [second_party.GetTitledFirstName], cùng phe [vassal_faction.GetName|l] của [second_party.GetHerHis], và yêu cầu [petition_liege.GetTitleAsNameNoTooltip] buộc họ đầu hàng."
 petition_liege.0201.desc.county_control:0 "\n\nTa cẩn thận mô tả những vấn đề mà lãnh địa của ta đang phải đối mặt, sự chống đối quyền lực của ta cùng nạn lang thang hoành hành, và xin được hỗ trợ khôi phục trật tự."
 petition_liege.0201.desc.county_convert:0 "\n\nTa nhiệt thành giải thích tình hình tại lãnh địa của mình, và nhu cầu được hỗ trợ để mang ánh sáng của [petition_liege.GetFaith.GetNameNoTooltip] đến với vô số kẻ tội lỗi."
 petition_liege.0201.desc.county_opinion:0 "\n\nTa giải thích sự bất mãn trong lãnh địa của mình, và niềm phấn chấn to lớn mà chỉ một chuyến viếng thăm đơn giản của [petition_liege.GetTitleAsNameNoTooltip] có thể mang lại cho tinh thần của dân chúng."
 petition_liege.0201.desc.fortify_border:0 "\n\nTa bình tĩnh phác họa mối đe dọa từ các láng giềng của vương quốc, nhấn mạnh [second_party.GetPrimaryTitle.GetName] và nguy cơ mà nó gây ra cho lãnh địa của ta."
 petition_liege.0201.desc.title_liege:0 "\n\nTa kính cẩn khẳng định yêu sách hợp pháp của mình đối với [petition_liege.GetHerHis] [petition_claim.GetName], đưa ra những tài liệu dài dòng chứng minh điều đó, rồi chờ đợi câu trả lời của [petition_liege.GetTitleAsNamePossessiveNoTooltip]."
 petition_liege.0201.desc.title_vassal:0 "\n\nTa khéo léo trình bày bằng chứng cho yêu sách của mình đối với [petition_claim.GetName], và nhấn mạnh sức mạnh của nó so với yêu sách của [second_party.GetTitledFirstName]."
 petition_liege.0201.desc.construct_city:0 "\n\nTa trình bày các lập luận cho việc phát triển khu định cư [petition_construct.GetName] tại [petition_construct_county.GetName], liệt kê những lợi ích đúng như đã chuẩn bị."
 petition_liege.0201.desc.construct_temple:0 "\n\nTa khiêm nhường trình bày đề nghị xây dựng một [petition_liege.GetFaith.HouseOfWorship] mới tại [petition_construct_county.GetName], sẽ được dựng lên tại khu định cư [petition_construct.GetName]."
 petition_liege.0201.desc.development:0 "\n\nTa cẩn thận giải thích sự khác biệt giữa tình hình của [petition_county_example.GetName] và [petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], cùng những điều có thể làm để cân bằng lại."
 petition_liege.0201.desc.house_fief: "\n\nTa lập luận cho trường hợp của mình rằng việc ban cho ta quyền thừa kế sẽ mang lại lợi ích cho khu vực."
 petition_liege.0201.desc.bridge:1 "\n\nSau khi nghe bài diễn thuyết của ta, [petition_liege.GetSheHe] khẽ gật đầu và nói, \"Ta sẽ lập tức cử người của mình đi giải quyết vấn đề này.\""
 petition_liege.0201.desc.council_second_party:0 "Chắc chắn ta cũng không thể làm tệ hơn [second_party.GetFullName]..."
 petition_liege.0201.a:0 "Xin cảm tạ, thưa chủ quân!"
 petition_liege_accept_tt:0 "Thỉnh cầu của bạn đã được chấp thuận"

# Liege asks for something in return
 petition_liege.0205.t:0 "$petition_liege_header$ Đề Nghị Đổi Lại"
 petition_liege.0205.desc.intro:0 "$petition_liege.0201.desc.intro$"
 petition_liege.0205.desc.bridge:2 "\n\n[petition_liege.GetSheHe|U] ngồi im lặng vài khoảnh khắc khi [petition_liege.GetSheHe] cân nhắc lời thỉnh cầu của ta. \n\nCuối cùng [petition_liege.GetSheHe] lên tiếng, "Ngươi nói rất hay, nhưng nếu ta phải chấp thuận yêu cầu của ngươi thì ta cũng cần thứ gì đó đổi lại. Chắc hẳn ngươi hiểu rằng nếu chúng ta đạt được một thỏa thuận thì cả hai đều có lợi?""
 petition_liege.0205.counter:0 "Thưa [petition_liege.GetTitleAsNameNoTooltip] của thần, có lẽ thần đã giải thích chưa đủ rõ..."
 petition_liege.0205.a:0 "Một đề nghị công bằng — ta chấp nhận."
 petition_liege.0205.b:0 "Ngài đang đùa sao? Ta đã bị dồn đến giới hạn rồi!"
 petition_liege_skillcheck_counter_tt:0 "Thử thuyết phục lãnh chúa của bạn bằng cách khác"

# Liege refuses petition (end)
 petition_liege.0209.t:0 "$petition_liege_header$ Bị Từ Chối"
 petition_liege.0209.desc.intro:0 "$petition_liege.0201.desc.intro$"
 petition_liege.0209.desc.bridge:0 "\n\nSau khi nghe xong bài trình bày, [petition_liege.GetSheHe] cau mày và bác bỏ ta."
 petition_liege.0209.desc.bridge.apologetic:1 "$petition_liege.0209.desc.bridge$ "Ta xin lỗi, nhưng vì lợi ích của [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], ta phải từ chối yêu cầu của ngươi.""
 petition_liege.0209.desc.bridge.unapologetic:1 "$petition_liege.0209.desc.bridge$ "#EMP Đây#! là chuyện khẩn cấp mà ngươi cần nói với ta sao? Không. Tuyệt đối không. Nếu ngươi cho phép, ta còn có những việc #EMP quan trọng#! hơn cần xử lý.""
 petition_liege.0209.desc.bridge.favor:0 "$petition_liege.0209.desc.bridge$ "Ta thực sự xin lỗi, nhưng ta không thể chấp thuận yêu cầu này. Nếu có thể ta đã cho ngươi điều ngươi muốn, nhưng hãy coi lời hứa về một ân huệ trong tương lai này là bù đắp.""
 petition_liege.0209.counter:0 "Khoan đã, thưa [petition_liege.GetLadyLord]! Xin hãy nghe thần nói!"
 petition_liege.0209.a:0 "Đành vậy."
 petition_liege.0209.favor:0 "Được thôi."

