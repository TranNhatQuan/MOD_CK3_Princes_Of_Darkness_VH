 petition_liege.9001.county_control:0 "Gửi quan lại đến giúp khôi phục quyền kiểm soát tại các quận nổi loạn."
 petition_liege.9001.county_convert:0 "Tài trợ các tu sĩ để giúp cải đạo các quận trong lãnh địa của ta."
 petition_liege.9001.county_opinion:0 "Thực hiện chuyến vi hành hoàng gia để cải thiện lòng dân trong lãnh địa của ta."
 petition_liege.9001.fortify_border:0 "Gia cố biên giới của ta."
