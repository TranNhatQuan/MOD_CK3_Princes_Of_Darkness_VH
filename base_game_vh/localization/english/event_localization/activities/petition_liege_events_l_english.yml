 # Activity End
 petition_liege.9999.t:0 "$petition_liege_header$ Kết Thúc"
 petition_liege.9999.desc:0 "Khi người thỉnh cầu cuối cùng rời đi, nhiều cận thần khác cũng theo họ ra khỏi phòng, còn những công việc khác cần xử lý. Một số người khác vẫn ở lại, bàn tán với nhau về những sự việc vừa diễn ra.\n\nChẳng bao lâu, sự trang nghiêm của buổi thiết triều cũng dần tan biến, nhường chỗ cho sự nhộn nhịp quen thuộc của đời sống triều đình."
 petition_liege.9999.a:0 "Việc của ta ở đây đã xong."
 petition_liege.9999.arrogant:0 "Thật tốt khi để thần dân chiêm ngưỡng uy nghi của ta."
 petition_liege.9999.shy:0 "Ta không thể chờ để quay lại phòng riêng..."
 petition_liege.9999.gregarious:0 "Có vẻ đây là cơ hội tốt để giao lưu với triều đình."
 petition_liege.9999.every_guest_and_courtier:0 "Mọi Khách và Cận Thần:"

 petition_liege.9001.t:0 "$petition_liege_header$ Thay Đổi Chiến Thuật"
 petition_liege.9001.desc:0 "Ta không còn có thể thỉnh cầu [petition_liege.GetTitledFirstName] để [ROOT.Char.Custom( 'GetPetitionType' )|l]. Tuy vậy, ta đã đi suốt chặng đường dài đến [petition_liege.GetCapitalLocation.GetName] để được diện kiến [petition_liege.GetHerHis], và ta sẽ không bỏ lỡ cơ hội này. Ta có thể yêu cầu [petition_liege.GetSheHe]..."
