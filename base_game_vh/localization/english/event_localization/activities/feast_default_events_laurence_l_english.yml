l_english:
  feast_default_laurence.100.t: "Chung Một Mưu Sự"
  feast_default_laurence.100.desc: "Khi quay lại từ việc đi giải quyết nỗi buồn, ta bị một [conspiratorial_fellow.GetName] có ánh mắt sắc lẹm tiếp cận. [conspiratorial_fellow.GetSheHe|U] kể cho ta nghe những câu chuyện về [war_memory.MakeScope.Var('war_cb').GetFlagName] mà [conspiratorial_fellow.GetSheHe] đã chiến đấu chống lại [intent_target.GetName]. Qua kẽ răng, [conspiratorial_fellow.GetSheHe] than thở vì bỏ lỡ cơ hội chẻ đôi [intent_target.GetHerHim] từ rốn đến cằm. Ghé sát lại gần và khóa ánh mắt của [conspiratorial_fellow.GetHerHis] với ta.\n\n\"Hãy để [ROOT.Char.Custom('RegionalEdibleAnimal')] mà các đầu bếp của ngài chuẩn bị một cách ngon lành kia không phải là con quái thú duy nhất bị xiên trong bữa tiệc này! Ngài chỉ cần bảo lính canh của ngài nhắm mắt bịt tai thôi. Phần còn lại ta sẽ lo.\""
  feast_default_laurence.100.a: "Hãy để lưỡi dao của ngươi uống no máu!"
  feast_default_laurence.100.a.tt.success: "[intent_target.GetTitledFirstName] chảy máu như vật hiến tế"
  feast_default_laurence.100.a.tt.failure: "[intent_target.GetTitledFirstName] quá xảo quyệt"
  feast_default_laurence.100.b: "Ý nghĩ về cái chết của [intent_target.GetHerHis] khiến lòng ta dao động, nhưng hãy cứ quan sát và chờ đợi."
  feast_default_laurence.100.c: "Hãy quên những lời ngu ngốc này đi, nhưng nhớ rằng… ta sẽ ghi nhớ."
  feast_default_laurence.101.desc: "Chủ nhân của ta đã cố hết sức bày ra một bàn tiệc tử tế. Tuy khiêm tốn so với những mỹ vị xa hoa của [intent_target.GetCapitalLocation.GetName], ta vẫn trân trọng sự tận tâm hiếu khách của chư hầu mình.\n\nĐột nhiên ta nhận ra trong đại sảnh ít người hơn. Phải rồi, lính canh dường như đã rời đi.\n\nMột cơn nhói bên sườn! Là bọ chét sao? Một cảm giác ấm nóng làm dịu cơn ngứa. Ta nhìn xuống — chuôi của một lưỡi dao đã mọc ra giữa các xương sườn của ta. Thứ đó đang làm gì ở đó..."
  feast_default_laurence.101.a: "Cái chết đã tìm đến ta."
  feast_default_laurence.102.desc: "Ta muốn dâng [intent_target.GetName] một tín vật để thể hiện lòng trung thành của mình. Một món quà lớn đến mức cần toàn bộ lính canh của ta khiêng tới. Nhưng than ôi, khi họ rời phòng để đi lấy nó, vị khách của ta dường như lại mọc ra một lưỡi dao giữa [intent_target.GetHerHis] xương sườn.\n\n[conspiratorial_fellow.GetName] mỉm cười với ta, đôi mắt [conspiratorial_fellow.GetHerHis] rực sáng khi bắt lấy ánh sáng của một sinh mạng vừa tắt."
  feast_default_laurence.102.a: "Hãy để sự hợp tác này trở thành khởi đầu của một tình bằng hữu lớn."
  feast_default_laurence.102.b: "Ngươi phản bội lòng hiếu khách của ta bằng đổ máu!"
  feast_default_laurence.102.b.flavor: "Ngươi cố gắng tống giam [conspiratorial_fellow.GetHerHim]."
  feast_default_laurence.102.b.tt.success: "Lính canh của ngươi quật ngã kẻ phản bội và khống chế hắn."
  feast_default_laurence.102.b.tt.fail: "Lính canh của ngươi không thể bắt được [conspiratorial_fellow.GetName]."
