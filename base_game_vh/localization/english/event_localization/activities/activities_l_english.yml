 activity_gruesome_festival_desc:0 "Đã đến lúc toàn thể [GetPlayer.GetPrimaryTitle.GetNameNoTierNoTooltip] tụ họp để hiến tế cho [GetPlayer.GetFaith.PantheonTerm]. Những nghi lễ này không chỉ gắn kết các tín đồ lại với nhau mà còn khẳng định vị thế của ta với tư cách [GetPlayer.GetTitleAsNameNoTooltip] của toàn bộ vùng đất."
 activity_gruesome_festival_owner:0 "Chủ lễ"
 activity_gruesome_festival_host_desc:1 "\nNgươi tổ chức một $gruesomefestivalname_blot$, bao gồm:\n#indent_newline:0 $EFFECT_LIST_BULLET$ Quyết định quy mô lễ hội\n#indent_newline:0 $EFFECT_LIST_BULLET$ Chọn vật hiến tế, thậm chí chọn một trong các [prisoners|E] của ngươi làm [designate_chief_sacrifice_chief_sacrifice|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ Nhận hoặc mất [county_opinion|E] và [character|E] [opinion|E] tùy thuộc vào [core_tenets|E] trong [faith|E] của thần dân"
 activity_gruesome_festival_guest_help_text:0 "Các [guests|E] được mời sẽ tham gia nghi lễ hiến tế và bữa tiệc sau đó. Họ sẽ tăng hoặc giảm [opinion|E] đối với ngươi tùy theo [core_tenets|E] của [faith|E] họ."
 activity_gruesome_festival_province_desc:1 "$gruesome_festival_size_small_desc$"
 activity_gruesome_festival_fallback_name:0 "Hiến Tế Nghi Lễ"
 activity_gruesome_festival_desc.non_gf_practioner:0 "Có những người trong thần dân của ta thực hành các nghi lễ hiến tế lớn được ban phúc bởi [GetPlayer.GetTitleAsNameNoTooltip]. Đồng ý tổ chức dù chỉ là một biến thể hạn chế chắc chắn sẽ giúp ta nhận được sự tán thành của họ, dù việc chấp nhận những phong tục... man rợ hơn của họ có thể khiến những kẻ khinh miệt chúng coi thường ta."


