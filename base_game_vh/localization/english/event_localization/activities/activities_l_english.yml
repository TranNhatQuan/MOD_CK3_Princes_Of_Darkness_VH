 honorary_guest_desc:0 "Một [GetActivityType('activity_feast').GetName] có thể có một $honorary_guest$, người mà buổi lễ được tổ chức để tôn vinh. Phần trung tâm của yến tiệc — lời chúc rượu — sẽ mang lại cho họ [prestige|E] nhờ vị trí nổi bật này. Nhưng hãy cẩn thận — đó cũng có thể là một cái bẫy... Những chủ tiệc $feast_type_murder$ có xu hướng giết chính $honorary_guest$ của mình."
 honorary_guest_desc_for_host:0 "Sẽ không phải là một $feast_type_murder$ nếu thiếu $honorary_guest_for_host$. Chủ tiệc có thể cẩn thận chọn nạn nhân và kết liễu mạng sống của họ, cùng toàn bộ đoàn tùy tùng nếu muốn. Nhưng phải luôn cảnh giác — nếu ai đó nhận ra sự vắng mặt của nạn nhân, hậu quả có thể xảy ra."
