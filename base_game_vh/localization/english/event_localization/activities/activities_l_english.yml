 #Hunt
 activity_hunt:0 "Săn bắn"
 hunt_phase_desc:0 "Truy đuổi con mồi của ngươi và quyết định cách ngươi sẽ hạ gục nó"
 activity_hunt_name:0 "Cuộc săn của [ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]"
 activity_hunt_desc: "[GetPlayer.Custom('GetHuntDesc')|U]"
 activity_hunt_desc_regular: "Cuộc truy đuổi mang lại vô vàn kích thích và hiểm nguy, đồng thời giúp xây dựng nền tảng vững chắc về cưỡi ngựa và bắn cung.\n\nCác cuộc săn được giám sát bởi [GetCourtPositionType('master_of_hunt_court_position').GetName()], người sẽ thông báo các [hunt_sightings_no_prefix|E] của những con thú thường thấy, hiếm gặp và hung dữ."
 activity_hunt_desc_adventurer: "Cuộc truy đuổi mang lại vô vàn kích thích và hiểm nguy, đồng thời giúp xây dựng nền tảng vững chắc về cưỡi ngựa và bắn cung.\n\nLà một [GetGovernment('landless_adventurer_government').GetName], việc săn bắn mang lại ít [prestige_i][prestige|E] hơn nhưng cung cấp [provisions_i][provisions|E]. Các cuộc săn được giám sát bởi [GetCourtPositionType('huntperson_camp_officer').GetName()].\n\nKhi cuộc săn bắt đầu, ngươi sẽ có cơ hội mua quyền săn bắn bằng [gold_i][gold|E], nếu không ngươi sẽ nhận [GetTrait('gallowsbait').GetName( GetNullCharacter )] [GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'poacher' ).GetName] [trait_level_track_xp|E]."
