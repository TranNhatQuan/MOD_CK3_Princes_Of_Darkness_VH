l_english:
  hunt_events_anna.0001.t: "Thâm Căn Cố Đế"
  hunt_events_anna.0001.desc: "Một cây sồi khổng lồ hiện ra với tán lá uy nghi, vươn rộng và xa — che phủ vạn vật bên dưới trong bóng tối. Ngước nhìn những cành cây ấy khiến ta nhớ về các triều đại khác nhau đã đến rồi đi. Tất cả những người đi trước ta, và cả những người sẽ tiếp nối di sản của ta khi ta không còn nữa.\n\nKhi lại gần hơn, ta nhận thấy một vài chữ cái đầu được khắc trên lớp vỏ cây, một lời nhắc nhở dịu dàng rằng con người chỉ là khách qua đường qua bao thời đại. Và người mà ta muốn cùng truyền lại di sản của mình chính là lẽ sống của ta, [love_interest.GetFirstName]."
  hunt_events_anna.0001.a: "Khắc tên của [love_interest.GetFirstNameNoTooltip] lên vỏ cây"
  hunt_events_anna.0001.b: "Không có thời gian cho những thứ vô nghĩa này!"
  hunt_events_anna.0001.b.t_toast: "Săn bắn là ưu tiên hàng đầu của ta."
 
  hunt_events_anna.0005.t: "Châm Chọc"
  hunt_events_anna.0005.desc: "Giây phút nghỉ ngơi ngắn ngủi của ta bị gián đoạn bởi một tiếng cười giễu cợt hướng về phía mình. Ta ngước lên, và chẳng mấy ngạc nhiên khi thấy nụ cười nhếch mép của [mocking_participant.GetFirstName], trên tay [mocking_participant.GetHerHis] đang cầm một con [ROOT.Char.Custom('SmallAnimal')] đã chết.\n\n\"Ta chưa từng nghĩ ngươi là kẻ có thể tự sinh tồn nơi hoang dã, nên ta cho rằng ngươi cần luyện tập một chút đấy,\" [mocking_participant.GetSheHe|U] nói với giọng mỉa mai, rồi ném cái xác xuống chân ta."
  hunt_events_anna.0005.a: "Thử lột da con vật."
  hunt_events_anna.0005.a.toast.good: "Ta đã lột da con vật thành công"
  hunt_events_anna.0005.a.toast.nothing: "Những gì còn lại không thể nhận dạng được nữa"
  hunt_events_anna.0005.b: "Luyện tập? Đừng ngại, ta sẽ làm..."
  hunt_events_anna.0005.c: "Ta không có nghĩa vụ phải làm những công việc hèn mọn như thế này."
 
  hunt_events_anna.0010.t: "Sa Vào Bẫy"
  hunt_events_anna.0010.desc: "Với những bước chân nặng nề và không vững, ta lần theo dấu vết con mồi qua vùng [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')], tập trung cao độ để giữ nhịp độ. Một tiếng rắc chói tai vang lên bên tai. Ta đột ngột cảm thấy cơ thể hẫng đi, và một sự bất an sâu sắc dâng lên trong lòng. Cú rơi dừng lại, và một cơn đau xé thịt chạy dọc cơ thể sau cú va chạm.\n\nĐau đớn nhìn xung quanh, tất cả những gì ta thấy là bốn bức tường vây quanh mình. Ta đã rơi xuống một cái bẫy, và ta cần tìm cách để thoát ra."
  hunt_events_anna.0010.a: "Leo ra khỏi hố."
  hunt_events_anna.0010.a.desc.good: "Ta đã leo ra ngoài thành công"
  hunt_events_anna.0010.a.toast.good: "Ta đã nén đau để thoát ra ngoài thành công"
  hunt_events_anna.0010.a.toast.bad: "Ta lại trượt chân và bị thương trong quá trình đó"
  hunt_events_anna.0010.a.desc.bad: "Ta trượt chân và rơi ngược trở lại hố"
  hunt_events_anna.0010.b: "\"Có ai ở đó không?!\""
  hunt_events_anna.0010.b.flavor: "Đoàn đi săn dừng cuộc săn lại và quay sang giúp đỡ ta."
 
  hunt_events_anna.0015.t: "Hít Vào... Thở Ra"
  hunt_events_anna.0015.desc: "Tiếng huých lạ lùng, tiếng lầm bầm khe khẽ và đôi khi là một tiếng thở dài vang vọng qua bãi trống. Một bóng người tay cầm cung đang đi đi lại lại, vẻ mặt có vẻ bực bội về điều gì đó.\n\nĐể quan sát kỹ hơn, ta nấp sau một cái cây và liếc nhìn kín đáo. Ta thấy [child_with_bow.Custom('GetDaughterSon')] [child_with_bow.GetFirstName] của mình, xung quanh là vài mũi tên vương vãi trên mặt đất, thậm chí còn chưa chạm được tới cái đích mà [child_with_bow.GetSheHe] đã dựng lên. Có vẻ như [child_with_bow.GetSheHe] cần được hướng dẫn một chút."
  hunt_events_anna.0015.a: "\"Lại đây, để ta chỉ cho con...\""
  hunt_events_anna.0015.a.flavor: "Với tư cách là một thợ săn lành nghề, ta nên sử dụng kinh nghiệm của mình để giúp [child_with_bow.GetHerHim] cải thiện tư thế và độ chính xác."
  hunt_events_anna.0015.a.toast.good: "[child_with_bow.GetFirstNameNoTooltip] làm theo chỉ dẫn của ta"
  hunt_events_anna.0015.a.toast.bad: "[child_with_bow.GetFirstNameNoTooltip] không hiểu được chỉ dẫn của ta"
  hunt_events_anna.0015.b: "Cổ vũ để khích lệ tinh thần [child_with_bow.GetHerHim]."
  hunt_events_anna.0015.c: "Để mặc cho [child_with_bow.GetFirstNameNoTooltip] tự tìm cách."
  hunt_events_anna.0015.c.toast: "[child_with_bow.GetFirstNameNoTooltip] đã tìm được cách sử dụng cây cung"
 
