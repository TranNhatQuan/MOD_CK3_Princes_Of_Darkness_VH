l_english:
 # General Loc Strings
 pay_homage_header:0 "Triều kiến:"

 # Activity Start: Liege decides whether or not to hear petition
 pay_homage.0001.opening:0 "[homage_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 pay_homage.0001.desc:0 "Ta đã đến [homage_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] để triều kiến ngài, vinh quang thay [homage_liege.GetTitleAsNameNoTooltip], như một minh chứng cho lòng trung thành của ta. \n\n"
 pay_homage.0001.desc.submission:0 "Ta hy vọng rằng chỉ riêng lời thề thần phục của ta cũng đủ chứng minh danh dự của mình."
 pay_homage.0001.desc.gold:0 "Ta mang đến những lễ vật giàu có xứng đáng với uy nghi của ngài, như một dấu hiệu của thiện chí và sự phụng sự của ta."
 pay_homage.0001.desc.hook:0 "Ngài có lời hứa của ta rằng ta sẽ làm bất cứ điều gì ngài mong muốn ở ta, thưa [homage_liege.GetLadyLord]."
 pay_homage.0001.desc.contract:0 "Để đánh dấu quyền thống trị của ngài và lòng trung thành của ta, ta sẽ cam kết những nghĩa vụ lớn hơn với tư cách chư hầu của ngài."
 pay_homage.0001.a:0 "Cho [homage_vassal.GetTitledFirstNameNoTooltip] vào ngay."
 pay_homage.0001.a.tt:0 "Ngươi tiếp kiến [homage_vassal.GetTitledFirstName]"
 pay_homage.0001.b:0 "Sự cúi mình của [homage_vassal.GetHerHis|U] chẳng có ý nghĩa gì với ta."
 pay_homage.0001.b.tt:0 "Ngươi đuổi [homage_vassal.GetTitledFirstName] đi"

# Activity End: Vassal learns that liege refuses to hear petition
 pay_homage.0009.opening:1 "[homage_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 pay_homage.0009.desc:0 "Ta không bị lừa bởi màn kịch [homage_vassal.Custom2('InsultAdjective', SCOPE.sC('homage_liege'))] của ngươi; một lời thề triều kiến từ ngươi chẳng có nghĩa lý gì với ta."
 pay_homage.0009.a:1 "Thật quá đáng!"

 # Liege Event: Liege receives homage from vassal
 pay_homage.0101.t:0 "$pay_homage_header$ Quỳ Gối"
 pay_homage.0101.t.language:0 "$pay_homage_header$ Lời Nói Hai Nghĩa"
 pay_homage.0101.t.clumsy:0 "$pay_homage_header$ Bẽ Mặt"
 pay_homage.0101.t.infatuation:0 "$pay_homage_header$ Bị Say Mê"
 pay_homage.0101.t.delivery:0 "$pay_homage_header$ Lắp Bắp"
 pay_homage.0101.desc:0 "Ta kiên nhẫn chờ trên ngai khi [homage_vassal.GetTitledFirstName] đến, chẳng bao lâu sau được xướng tên và dẫn vào trước mặt ta. \n\n"
 pay_homage.0101.desc.submission:0 "[homage_vassal.GetSheHe|U] quỳ xuống tỏ lòng tôn kính, không cung cấp gì ngoài lời thề của [homage_vassal.GetHerHis] để trung thành phục vụ với tư cách là chư hầu của [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n\""
 pay_homage.0101.desc.gold:0 "[homage_vassal.GetSheHe|U] quỳ xuống tỏ lòng tôn kính khi các hầu cận mang tới những lễ vật tiền bạc và vật quý của [homage_vassal.GetHerHis]. Lời thề được tuyên đọc, và các thư lại ghi chép lời cam kết phục vụ [homage_liege.GetPrimaryTitle.GetNameNoTooltip] của [homage_vassal.GetHerHis].\n\n"
 pay_homage.0101.desc.hook:0 "[homage_vassal.GetSheHe|U] quỳ xuống tỏ lòng tôn kính, và, cùng với các lời thề khác của [homage_vassal.GetHerHis] để phục vụ [homage_liege.GetPrimaryTitle.GetNameNoTooltip], đặt bản thân [homage_vassal.GetHerselfHimself] dưới quyền ta và nợ ta.\n\n"
 pay_homage.0101.desc.contract:0 "[homage_vassal.GetSheHe|U] quỳ xuống tỏ lòng tôn kính, và, cùng với các lời thề khác của [homage_vassal.GetHerHis] để phục vụ [homage_liege.GetPrimaryTitle.GetNameNoTooltip], cung cấp cho ta những đóng góp lớn hơn với tư cách là lãnh chúa chư hầu của [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0101.desc.language:3 "Dù [homage_vassal.GetTitleAsNameNoTooltip] rõ ràng đã luyện tập những lời thề bằng [homage_liege.GetCourtLanguage.GetNameNoTooltip], [homage_vassal.GetSheHe] vẫn phát âm sai vài đoạn, khiến ý nghĩa thay đổi một cách hài hước và làm các cận thần của ta phải nén cười."
 pay_homage.0101.desc.clumsy:0 "Khi [homage_vassal.GetTitledFirstNameNoTooltip] đứng dậy, [homage_vassal.GetSheHe] vấp ngã vụng về. Cả triều đình cùng hít một hơi khi [homage_vassal.GetSheHe] ngã nhào, kết thúc nằm dài dưới chân ta, má đỏ bừng vì xấu hổ."
 pay_homage.0101.desc.infatuation:0 "[homage_vassal.GetTitledFirstNameNoTooltip] đứng dậy trông có vẻ lúng túng. Từ khóe mắt ta thấy [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] của ta là [homage_infatuation.GetFullName] đang ngất ngây, rõ ràng bị mê hoặc bởi [homage_vassal.GetTitleAsNameNoTooltip]!"
 pay_homage.0101.desc.delivery:0 "Mọi thứ không suôn sẻ ngay từ đầu. [homage_vassal.Custom('GetHomageDeliveryDescLiege')]"
 pay_homage.0101.desc.success:0 "Cuối cùng ta cho phép [homage_vassal.GetTitleAsNameNoTooltip] đứng dậy, xác nhận sự hài lòng của ta và quyền cai trị những vùng đất mà [homage_vassal.GetSheHe] quản lý thay ta của [homage_vassal.GetFirstNamePossessiveNoTooltip]."
 pay_homage.0101.smooth.submission:0 ""Hãy phục vụ ta cho tốt, [homage_vassal.GetTitledFirstNameNoTooltip].""
 pay_homage.0101.smooth.gold:0 ""Ta chấp nhận những lễ vật hào phóng của ngươi, [homage_vassal.GetTitledFirstNameNoTooltip].""
 pay_homage.0101.smooth.hook:0 ""Ta rất vui khi biết rằng ta có thể trông cậy vào ngươi, [homage_vassal.GetTitledFirstNameNoTooltip].""
 pay_homage.0101.smooth.contract:0 ""Sự phục vụ của ngươi vô cùng quý giá, [homage_vassal.GetTitledFirstNameNoTooltip].""
 pay_homage.0101.faux_pas.language:0 ""Nỗ lực tốt đấy [homage_vassal.GetFirstNameNoTooltip]; đây không phải ngôn ngữ dễ.""
 pay_homage.0101.faux_pas.clumsy:0 ""Những lời thề của ngươi mới là điều quan trọng với ta.""
 pay_homage.0101.faux_pas.infatuation:0 ""Khụm... Ta nghĩ chúng ta kết thúc ở đây.""
 pay_homage.0101.faux_pas.delivery:0 ""Điều quan trọng là lòng trung thành của ngươi, không phải cái lưỡi của ngươi.""
 pay_homage.0101.insult.language:0 ""Ngươi có #EMP chút#! ý niệm nào về những gì ngươi vừa nói không?""
 pay_homage.0101.insult.clumsy:0 ""Thật là một mớ hỗn độn.""
 pay_homage.0101.insult.infatuation:0 ""Ngươi #EMP dám#! sao? Ra ngoài!""
 pay_homage.0101.insult.delivery:0 ""Cái #EMP gì#! vừa xảy ra vậy?""

 # Vassal Event: Vassal hears how it went
 pay_homage.0201.desc: "Những người hầu dẫn ta vào đại sảnh của [homage_liege.GetTitledFirstNamePossessiveRegnal] tại [homage_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], nơi [homage_liege.GetSheHe] ngồi trên ngai vàng của [homage_liege.GetHerHis] chờ đợi để nghe lời cam kết của ta.\n\n\""
 pay_homage.0201.desc.language:2 "Ta quỳ trước [homage_liege.GetHerHim] và đọc những lời thề bằng [homage_liege.GetCourtLanguage.GetNameNoTooltip] mà ta đã luyện tập, nhưng những tiếng cười khúc khích bị che giấu nửa vời của triều đình khiến rõ ràng rằng cái lưỡi của ta cần luyện tập thêm trong ngôn ngữ triều đình của lãnh chúa...\n\n"
 pay_homage.0201.desc.clumsy:0 "Ta tiến tới quỳ trước [homage_liege.GetHerHim], nhưng vì vội vàng mà vấp ngã vụng về thành một đống dưới chân [homage_liege.GetHerHis]. Ta lồm cồm đứng dậy và vẫn đọc lời thề, má đỏ bừng trước triều đình tụ họp...\n\n"
 pay_homage.0201.desc.infatuation:0 "Ta quỳ trước [homage_liege.GetHerHim] và bắt đầu. Khi ta đọc lại những lời thề, ta chạm mắt với [homage_infatuation.GetFullName], [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] của [homage_liege.GetFirstNameNoTooltip], người mỉm cười đầy mời gọi và nháy mắt có chủ ý. Khi ta nhìn lại lãnh chúa của mình, ta gặp phải ánh nhìn giận dữ của [homage_liege.GetHerHis]! Ta vội kết thúc bài nói, tránh ánh mắt khi triều đình rì rầm bàn tán...\n\n"
 pay_homage.0201.desc.delivery:0 "Ta quỳ trước [homage_liege.GetHerHim] và bắt đầu đọc những lời thề, nhưng mọi thứ nhanh chóng rối tung. [homage_vassal.Custom('GetHomageDeliveryDescVassal')]\n\n"
 pay_homage.0201.desc.success:0 "Ta quỳ dưới chân [homage_liege.GetLadyLord] của mình và tuyên đọc nhiều lời thề triều kiến, trong khi các thư lại của [homage_liege.GetHerHis] ghi chép lại sự kiện.\n\n"
 pay_homage.0201.desc.submission:0 "Với điều đó, nghi lễ kết thúc; ta không có gì dâng lên [homage_liege.GetTitleAsNameNoTooltip] ngoài lời hứa trung thành phục vụ với tư cách chư hầu của [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0201.desc.gold:0 "Sau đó các hầu cận của ta tiến lên, dâng những lễ vật giàu có của ta cho [homage_liege.GetTitleAsNameNoTooltip] trước triều đình tụ họp.\n\n"
 pay_homage.0201.desc.hook:0 "Sau đó là lời hứa của ta rằng [homage_liege.GetSheHe] có thể gọi ta giúp bất kỳ ân huệ nào, như một người ủng hộ trung thành của [homage_liege.GetTitleAsNameNoTooltip] trong mọi nỗ lực của [homage_liege.GetHerHis].\n\n"
 pay_homage.0201.desc.contract:0 "Sau đó là món quà của ta; ta xác nhận sẽ tăng cống hiến của mình cho [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] như dấu hiệu trung thành và vì lợi ích của vương quyền.\n\n"
 pay_homage.0201.desc.insult_language:1 "[homage_liege.GetFirstNameNoTooltip] nhìn ta nghiêm khắc, rồi bật cười lớn, nhại lại những lời thề phát âm sai của ta bằng giọng [homage_vassal.GetCulture.GetLanguage.GetNameNoTooltip] vụng về..."
 pay_homage.0201.desc.insult_clumsy:0 "[homage_liege.GetFirstNameNoTooltip] nở nụ cười rộng phía sau bàn tay [homage_liege.GetHerHis], khi triều đình dần dần tràn ngập tiếng cười. Đây sẽ là cách ta được nhớ đến..."
 pay_homage.0201.desc.insult_infatuation:0 "[homage_liege.GetFirstNameNoTooltip] nhìn [homage_liege.GetHerHis] [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] đầy giận dữ, rồi đuổi ta khỏi đại sảnh mà không công nhận gì."
 pay_homage.0201.desc.insult_delivery:0 "[homage_liege.GetFirstNameNoTooltip] cúi gập người cười sằng sặc khi [homage_liege.GetSheHe] kể lại chi tiết vài phần trong bài nói của ta..."
 pay_homage.0201.desc.brush_off:0 "Thật bất ngờ, [homage_liege.GetFirstNameNoTooltip] gần như hành xử như thể chẳng có chuyện gì xảy ra, và chấp nhận lời triều kiến của ta một cách nhã nhặn.\n\n"
 pay_homage.0201.desc.outro:0 "[homage_liege.GetFirstNameNoTooltip] bảo ta đứng dậy và xác nhận sự hài lòng của [homage_liege.GetHerHis], cùng với quyền của ta đối với những vùng đất ta cai trị thay mặt [homage_liege.GetHerHis]."
 pay_homage.0201.smooth.submission:0 "Vạn tuế [homage_liege.GetTitleAsNameNoTooltip]."
 pay_homage.0201.smooth.gold:0 "Cái giá của lòng trung thành..."
 pay_homage.0201.smooth.hook:0 "Hy vọng đó sẽ là một ân huệ nhỏ..."
 pay_homage.0201.smooth.contract:0 "Gánh nặng của sự phục vụ..."
 pay_homage.0201.faux_pas:0 "Dù sao cũng là một lãnh chúa công bằng."
 pay_homage.0201.insult:0 "Ta lẽ ra không nên đến."

 # Custom
 homage_delivery_stutter_liege:1 "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] vừa mới nói được nửa câu thì tật nói lắp của [ROOT.Char.GetHerHis] đã cắt ngang [ROOT.Char.GetHerHim]. Các triều thần đau đớn theo dõi những nỗ lực dũng cảm của [ROOT.Char.GetHerHis] nhằm chinh phục giọng nói của chính mình."
 homage_delivery_lisp_liege:1 "Bài nói của [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] thật... đáng nhớ. Tật nói ngọng của [ROOT.Char.GetHerHis] làm giảm bớt vẻ trang nghiêm, khi [ROOT.Char.GetSheHe] vật lộn với những âm gió và cố phớt lờ tiếng cười khúc khích của vài cận thần kém rộng lượng của ta."
 homage_delivery_wheeze_liege:1 "[ROOT.Char.GetTitledFirstNameNoTooltip] là một trường hợp thú vị. Rõ ràng căng thẳng vì cảnh tượng này và phấn khích vì đến vội vàng, [ROOT.Char.GetSheHe] dường như còn khó thở, khò khè qua bài nói giữa những lần phải dừng lại để hít thở."
 homage_delivery_slow_liege:1 "Bài phát biểu của [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]... không tốt. [ROOT.Char.GetSheHe] mất mạch suy nghĩ ở một vài điểm, lan man sang các chủ đề khác, và hiểu sai hoặc phát âm sai một vài từ quan trọng nhất."
 homage_delivery_inconceivable_liege:1 "Bài nói của [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] thật... thú vị. [ROOT.Char.GetSheHe|U] chèn vào những từ cổ xưa và những từ nặng nề mà [ROOT.Char.GetSheHe] rõ ràng không hiểu nghĩa thật, khiến bài nói dài gấp đôi và làm các cận thần học thức của ta bối rối."
 homage_delivery_stutter_vassal:0 "Ta mới chỉ bắt đầu lời thề đầu tiên thì tật nói lắp đã khiến ta dừng lại. Cuối cùng ta vẫn tiếp tục khi triều đình nhìn với vẻ vừa buồn cười vừa ngượng ngùng, nhưng ngày hôm nay đã bị đánh dấu bởi khuyết điểm của ta."
 homage_delivery_lisp_vassal:0 "Bài nói của ta bị ngắt quãng bởi những tiếng cười bị nén lại khi ta cố gắng phát âm quanh tật nói ngọng của mình, làm giảm bớt sự trang trọng của nghi lễ và lời thề."
 homage_delivery_wheeze_vassal:0 "Ta khó tìm được hơi thở khi tim đập nhanh hơn, và việc vội vàng kết thúc bài nói chỉ khiến mọi thứ tệ hơn. Đây không phải là bài nói đáng nhớ."
 homage_delivery_slow_vassal:0 "Ta cố hết sức, nhưng những cái nhướn mày và ánh nhìn của lãnh chúa cùng triều đình cho ta biết nỗ lực của ta mang tính giải trí hơn là trọng đại."
 homage_delivery_inconceivable_vassal:0 "Ta dốc toàn lực, cố gắng xứng với dịp này và gây ấn tượng với triều đình bằng vốn từ vựng phong phú của mình, dù... phản ứng không hẳn như ta mong đợi."
 # Invalidated event
 pay_homage.0601.t:0 "$pay_homage_header$ Bị Hủy"
 pay_homage.0601.desc.court:0 "Với lễ đăng quang của ta với tư cách [ROOT.Char.GetTitleAsNameNoTooltip] đã hoàn tất, việc chuẩn bị triều kiến của ta không còn cần thiết nữa..."
 pay_homage.0601.desc.imprisoned_me:0 "$pay_homage.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] đã tống ta vào ngục."
 pay_homage.0601.desc.imprisoned:0 "$pay_homage.0601_shared_intro$ Ta bị bắt bởi [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 pay_homage.0601.desc.liege_dead_me:0 "$pay_homage.0601_shared_intro$ Cuối cùng ta đã giết [homage_liege.GetTitledFirstName]... \n\n"
 pay_homage.0601.desc.liege_dead:0 "$pay_homage.0601_shared_intro$ [homage_liege.GetTitledFirstName] [homage_liege.GetDeathReasonHideKiller]... \n\n"
 pay_homage.0601.desc.liege_imprisoned_me:0 "$pay_homage.0601_shared_intro$ Cuối cùng ta đã bắt giữ [homage_liege.GetTitledFirstName]!"
 pay_homage.0601.desc.liege_imprisoned:0 "$pay_homage.0601_shared_intro$ [homage_liege.GetTitledFirstName] bị bắt bởi [homage_liege.GetImprisonedBy.GetTitledFirstName]."
 pay_homage.0601.desc.new_liege:0 "Nếu ta phải tuyên thệ, nó phải hướng tới lãnh chúa mới của ta, [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 pay_homage.0601_shared_intro:0 "Ngay khi ta đang hoàn tất những nét cuối cùng cho lời thề triều kiến của mình,"
 pay_homage.0601.desc:0 "\n\nĐiều này chắc chắn thay đổi tình hình."
 pay_homage.0601.a_court:0 "Tiến lên, đến những điều lớn lao hơn."
 pay_homage.0601.a_prison:0 "Chết tiệt."
 pay_homage.0601.a_liege:0 "Thật phiền toái..."
 pay_homage.0601.a:0 "Đã đến lúc phải suy nghĩ lại..."

 pay_homage_costs_refunded:0 "$pay_homage_decision$ chi phí đã được hoàn lại"
