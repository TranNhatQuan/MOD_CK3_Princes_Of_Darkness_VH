l_english:
  feast_main_stew_flood.0002.t:1 "Biển Hầm"
  feast_main_stew_flood.0002.stew_introduction_blamed:0 "Ta đã uống hơi quá chén khi loạng choạng đâm vào cái vạc khổng lồ treo trên lò sưởi trong đại sảnh yến tiệc. Nó bật chốt và rơi xuống, thứ nước hầm thơm lừng trào ra phủ kín sàn nhà thành một biển món hầm!"
  feast_main_stew_flood.0002.stew_introduction_blame:0 "Trong cơn say loạng choạng, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stew_sea_blamed'))] của ta, [stew_sea_blamed.GetTitledFirstName], đã làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín sàn nhà thành một biển món hầm!"
  feast_main_stew_flood.0002.stew_introduction:0 "Giữa lúc yến tiệc nhộn nhịp, một trong những người hầu của [activity.GetOwner.GetTitledFirstNamePossessive] vô tình làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa căn phòng thành một biển món hầm!"
  feast_main_stew_flood.0002.someone_got_covered:0 "\n\n[stew_sea_gets_covered.Custom('stew_flood_covered_adjective')] [stew_sea_gets_covered.GetTitledFirstName] bị làn sóng ập tới cuốn trúng và lớn tiếng nguyền rủa vẻ ngoài bị hủy hoại của [stew_sea_gets_covered.GetHerHis] khi mỡ chảy xuống mặt [stew_sea_gets_covered.GetHerHis]."
  feast_main_stew_flood.0002.splash_desc_standard:0 "\n\nKhách khứa vội chạy sang phía bên kia đại sảnh khi khối đặc sệt lan ra những vệt dầu mỡ giữa những bước chân nhảy tránh."
  feast_main_stew_flood.0002.every_target:0 "\nĐầu hàng trước cơn đói khát vô độ của [stew_sea_glutton.GetHerHis], [stew_sea_glutton.GetTitledFirstName] đổ sụp xuống sàn, nuốt chửng nhiều nhất có thể đống hỗn độn đầy thịt trong khi [stew_sea_horrified_character.GetTitledFirstName] chứng kiến trong sự kinh hoàng tột độ."
  feast_main_stew_flood.0002.only_glutton:0 "\n\nĐầu hàng trước cơn đói khát vô độ của [stew_sea_glutton.GetHerHis], [stew_sea_glutton.GetTitledFirstName] đổ sụp xuống sàn, nuốt chửng nhiều nhất có thể đống hỗn độn đầy thịt."
  feast_main_stew_flood.0002.only_horror:0 "\n\n[stew_sea_horrified_character.GetTitledFirstName] đứng sững giữa tất cả, chết lặng vì sốc và kinh hoàng trước sự lãng phí xa hoa."
  feast_main_stew_flood.0002.a:0 "Ta chưa từng thấy nhiều món hầm đến thế."
  feast_main_stew_flood.0003.t:1 "Biển Hầm"
  feast_main_stew_flood.0003.stew_introduction_blame:0 "Trong cơn say loạng choạng, [stew_sea_blamed.GetTitledFirstName] làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa căn phòng thành một biển món hầm!"
  feast_main_stew_flood.0003.stew_introduction:0 "Giữa lúc yến tiệc nhộn nhịp, một tên người hầu ngu ngốc đã làm bật chốt cái vạc khổng lồ treo trên lò sưởi trong đại sảnh! Nước hầm thơm lừng trào ra phủ kín nửa sàn nhà thành một biển món hầm!"
  feast_main_stew_flood.0003.someone_got_covered:0 "\n\n[stew_sea_gets_covered.Custom('stew_flood_covered_adjective')] [stew_sea_gets_covered.GetTitledFirstName], ngồi cạnh cái vạc, bị làn sóng ập tới cuốn trúng và lớn tiếng nguyền rủa vẻ ngoài bị hủy hoại của [stew_sea_gets_covered.GetHerHis] khi mỡ chảy xuống mặt [stew_sea_gets_covered.GetHerHis]."
  feast_main_stew_flood.0003.splash_desc_standard:0 "Khách khứa vội chạy sang phía bên kia đại sảnh khi khối đặc sệt lan ra những vệt dầu mỡ giữa những bước chân nhảy tránh."
  feast_main_stew_flood.0003.every_target:0 "\n\nĐầu hàng trước cơn đói khát vô độ của [stew_sea_glutton.GetHerHis], [stew_sea_glutton.GetTitledFirstName] đổ sụp xuống sàn, nuốt chửng nhiều nhất có thể đống hỗn độn đầy thịt trong khi [stew_sea_horrified_character.GetTitledFirstName] chứng kiến trong sự kinh hoàng tột độ."
  feast_main_stew_flood.0003.only_glutton:0 "\n\nĐầu hàng trước cơn đói khát vô độ của [stew_sea_glutton.GetHerHis], [stew_sea_glutton.GetTitledFirstName] đổ sụp xuống sàn, nuốt chửng nhiều nhất có thể đống hỗn độn đầy thịt."
  feast_main_stew_flood.0003.only_horror:0 "\n\n[stew_sea_horrified_character.GetTitledFirstName] đứng sững giữa tất cả, chết lặng vì sốc và kinh hoàng trước sự lãng phí xa hoa."
  feast_main_stew_flood.0003.a:0 "Nguyền rủa cái mớ hỗn độn này!"
  feast_main_stew_flood.0004.t:1 "Biển Hầm"
  feast_main_stew_flood.0004.stew_introduction_blame:0 "Trong cơn say loạng choạng, [stew_sea_blamed.GetTitledFirstName] làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa sàn nhà thành một biển món hầm!"
  feast_main_stew_flood.0004.stew_introduction:0 "Giữa lúc yến tiệc nhộn nhịp, một trong những người hầu của [activity.GetOwner.GetTitledFirstNamePossessive] vô tình làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa căn phòng thành một biển món hầm!"
  feast_main_stew_flood.0004.getting_covered:0 "\nTa ngồi quá gần, và bữa ăn đầy mỡ tràn qua người ta như một con sóng nấu lên từ vực sâu của [ROOT.Char.GetFaith.NegativeAfterLife]. Quần áo ta có thể giặt sạch, nhưng nỗi nhục nhã giữa cả đại sảnh cười ầm thì chẳng bao giờ rửa trôi."
  feast_main_stew_flood.0004.a:0 "Sao chuyện này lại xảy ra với ta?!"
  feast_main_stew_flood.0005.t:1 "Biển Hầm"
  feast_main_stew_flood.0005.stew_introduction_blame:0 "Trong cơn say loạng choạng, [stew_sea_blamed.GetTitledFirstName] làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa sàn nhà thành một biển món hầm!"
  feast_main_stew_flood.0005.stew_introduction:0 "Giữa lúc yến tiệc nhộn nhịp, một trong những người hầu của [activity.GetOwner.GetTitledFirstNamePossessive] vô tình làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa căn phòng thành một biển món hầm!"
  feast_main_stew_flood.0005.cannot_resist:0 "\nVới từng ấy thức ăn ngon đổ tràn khắp nơi, ta thật không thể kiềm chế. Trước khi kịp nhận ra chuyện gì, ta đã chống cả bốn chi xuống đất, húp món hầm như một con chó thường dân! Ta thậm chí không nghĩ tới việc các vị khách khác sẽ nghĩ gì, càng không nghĩ tới chủ nhà!"
  feast_main_stew_flood.0005.being_watched:0 "\nSuốt lúc đó ta chỉ mơ hồ nhận ra [stew_sea_horrified_character.GetTitledFirstName] đang nhìn ta với khuôn mặt vặn vẹo vì ghê tởm."
  feast_main_stew_flood.0005.a:0 "Nó ngon quá!"
  feast_main_stew_flood.0006.t:1 "Biển Hầm"
  feast_main_stew_flood.0006.stew_introduction_blame:0 "Trong cơn say loạng choạng, [stew_sea_blamed.GetTitledFirstName] làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa sàn nhà thành một biển món hầm!"
  feast_main_stew_flood.0006.stew_introduction:0 "Giữa lúc yến tiệc nhộn nhịp, một trong những người hầu của [activity.GetOwner.GetTitledFirstNamePossessive] vô tình làm bật chốt cái vạc khổng lồ treo trên lò sưởi giữa đại sảnh yến tiệc! Nước hầm thơm lừng trào ra phủ kín nửa căn phòng thành một biển món hầm!"
  feast_main_stew_flood.0006.shocking_experience:0 "Thật quá sức chịu đựng khi thấy lượng thức ăn khổng lồ lẽ ra dành cho khách khứa, giờ lại bị lãng phí."
  feast_main_stew_flood.0006.a:0 "Ta phải quay đi."
  feast_main_stew_flood.0041.t:2 "Bụng No"
  feast_main_stew_flood.0041.blame_placed:2 "Chúng ta đều mỉm cười mãn nguyện, chủ nhà có lý do để tự hào. Dù vậy [stew_sea_blamed.GetTitledFirstName] có lẽ mang nhiều nhục nhã hơn là thỏa mãn sau khi làm đổ cái vạc!"
  feast_main_stew_flood.0041.no_blame_placed:1 "Chúng ta đều mỉm cười mãn nguyện, để lại cho chủ nhà lý do để tự hào. Ngoại trừ tên người hầu đã làm đổ cái vạc hầm. Thật là một khoảnh khắc đáng xấu hổ."
  feast_main_stew_flood.0041.a:0 "Thật là một bữa tiệc ngon."
  feast_main_stew_flood.0042.t:2 "Những Cái Bụng No"
  feast_main_stew_flood.0042.blame_placed:1 "Khi ta nhìn các vị khách, tất cả đều mỉm cười mãn nguyện trước đĩa của mình, khiến ta tự hào về sự hào phóng của bản thân. Dù vậy [stew_sea_blamed.GetTitledFirstName] có lẽ mang nhiều nhục nhã hơn là thỏa mãn sau khi làm đổ cái vạc! Dọn dẹp chắc chắn không rẻ."
  feast_main_stew_flood.0042.no_blame_placed:1 "Khi ta nhìn các vị khách, tất cả đều mỉm cười mãn nguyện trước đĩa của mình, khiến ta tự hào về sự hào phóng của bản thân. Dù vậy ta có lẽ phải xử lý tên người hầu chết tiệt đã làm đổ cái vạc hầm. Và dọn dẹp chắc chắn không rẻ."
  feast_main_stew_flood.0042.a:1 "Chúng ta nên làm thế này thường xuyên hơn!"
  feast_main_stew_flood.0043.blame_placed:1 "Bữa tiệc sắp kết thúc, và ta có thể rời đi để lo cho nỗi nhục của mình.\nMón hầm thịt chết tiệt đó văng khắp nơi, và ta không chắc mình có bao giờ tẩy được mùi khỏi tóc! Sẽ còn rất lâu ta mới quên được [stew_sea_blamed.GetTitledFirstName] đã làm gì với ta."
  feast_main_stew_flood.0043.no_blame_placed:1 "Bữa tiệc sắp kết thúc, và ta có thể rời đi để lo cho nỗi nhục của mình.\nMón hầm thịt chết tiệt đó văng khắp nơi, và ta không chắc mình có bao giờ tẩy được mùi khỏi tóc! Sẽ còn rất lâu ta mới quên được tên người hầu đó đã làm gì với ta."
  feast_main_stew_flood.0043.a:0 "Ta sẽ không bao giờ ăn món hầm nữa."
  feast_main_stew_flood.0044.desc:1 "Bữa tiệc sắp kết thúc, nhưng mùi món hầm vẫn lơ lửng trên nó như một bóng ma. Ta không thể tin người xui xẻo lại là ta, và ta chỉ... ước gì chuyện đó chưa từng xảy ra!"
  feast_main_stew_flood.0044.a:0 "Ta hy vọng mọi người say quá nên không nhớ."
  stew_flood_covered_adjective_wrathful:0 "cáu kỉnh"
  stew_flood_covered_adjective_proud:0 "kiêu hãnh"
  stew_flood_covered_adjective_beautiful:0 "xinh đẹp"
  stew_flood_fallback_adjective:0 "không ngờ tới"
  feast_stew_flood_log_title:0 "Lũ Món Hầm"
  feast_stew_flood_log:0 "[TARGET_CHARACTER.GetTitledFirstName] bị phủ đầy món hầm nóng sau một sự cố tràn đổ khổng lồ."
