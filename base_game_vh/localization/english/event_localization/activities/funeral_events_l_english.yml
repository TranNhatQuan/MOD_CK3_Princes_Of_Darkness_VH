l_english:
 activity_funeral: "Tang lễ"
 activity_funeral_desc: "Triệu tập toàn cõi đang than khóc cho một $activity_funeral$, cơ hội tiễn đưa trang trọng một thành viên quý kính của giới quý tộc."
 activity_funeral_province_desc: "Ngươi tổ chức Tang lễ tại [ROOT.Province.GetName]\nCác tỉnh có điểm số cao sẽ tăng thêm [piety_i][piety|E], giảm [stress_loss_i][stress|E], và tăng [legitimacy|E]\n"
 activity_funeral_guest_help_text: "Bất kỳ [activity_guests|E] nào được mời đều có cơ hội tăng [opinion|E] đối với ngươi.\nTang lễ cũng là dịp để trút bỏ gánh nặng trong lòng, giảm bớt [stress|E] và nhận thêm [piety|E]."
 activity_funeral_selection_tooltip: "Tổ chức tang lễ để an táng một thân nhân đã khuất\n\nPhần thưởng dự kiến:\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[legitimacy_i] Tăng [legitimacy|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$[piety_i] Tăng [piety|E]"
 activity_funeral_destination_selection: "Thi thể phải được mai táng ở đâu đó trong lãnh thổ của ngươi. Thánh địa và công trình tôn giáo sẽ cải thiện chất lượng nghi lễ."
 activity_funeral_major_religious_building: "#P +++ Đại Công trình Tôn giáo#!\n"
 activity_funeral_tos: "#P ++ $building_type_tower_of_silence_01$#!\n"
 activity_funeral_wavel: "#P ++ $building_type_wawel_cathedral_01$#!\n"
 activity_funeral_holy_site: "#P ++ Thánh địa#!\n"
 activity_funeral_mountain: "#P ++ Vùng núi#!\n"
 activity_funeral_temple: "#P ++ Đền thờ#!\n"
 activity_window_character_body: "$body_to_bury_for_host$"

 deceased_selection_widget_header: "Chọn thi thể để an táng"

 has_someone_to_bury_tt: "Ngươi phải vừa trải qua một mất mát gần đây"
 has_someone_selected_to_bury: "Ngươi chưa chọn thi thể để an táng"
 body_to_bury_for_host: "Người đã khuất"
 body_to_bury_desc_for_host: "Thi thể sẽ được đưa về cõi bên kia"
 body_to_bury_desc_for_host_required_tt: "#T Khách Đặc Biệt Bắt Buộc\n#!@warning_icon! #X Hoạt động này cần một $body_to_bury_for_host$ để an táng#!"
 body_to_bury_selection_info: "Chọn một người vừa qua đời để tiễn đưa sang thế giới bên kia"
 activity_funeral_host_desc: "$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] [stress_loss|E]\n$BULLET_WITH_TAB$[piety_i] Tăng [piety|E]\n$BULLET_WITH_TAB$[legitimacy_i] Tăng [legitimacy|E]"
 activity_funeral_guest_desc: "$BULLET_WITH_TAB$ Người tham dự có thể tăng [opinion|E] với các nhân vật dự lễ\n$BULLET_WITH_TAB$ Người tham dự có thể giảm [stress_loss_i][stress|E]"
 activity_funeral_conclusion_desc: "[GetActivityType( 'activity_funeral' ).GetName] đã kết thúc"
 funeral_phase_wake: "[GetPlayer.Custom('WakeName')]"
 funeral_phase_wake_desc: "[GetPlayer.Custom('WakeDesc')]"
 funeral_phase_ceremony: "[GetPlayer.Custom('CeremonyName')]"
 funeral_phase_ceremony_desc: "[GetPlayer.Custom('CeremonyDesc')]"
 funeral_option_ceremony: "Nghi lễ"
 funeral_ceremony_bad: "Nghi lễ giản dị"
 funeral_ceremony_bad_desc: "$EFFECT_LIST_BULLET$ Tăng [piety|E] nhỏ\n$EFFECT_LIST_BULLET$ Tăng [legitimacy|E] nhỏ\n$EFFECT_LIST_BULLET$ Giảm [stress|E] nhỏ\n\n#weak Cái chết không phải lúc phô trương xa hoa, mà là lúc tụ họp và dâng lên những lời kính viếng khiêm nhường.#!"
 funeral_ceremony_normal: "Nghi lễ trang nghiêm"
 funeral_ceremony_normal_desc: "$EFFECT_LIST_BULLET$ Tăng [piety|E]\n$EFFECT_LIST_BULLET$ Tăng [legitimacy|E]\n$EFFECT_LIST_BULLET$ Giảm [stress|E]\n\n#weak Cái chết đã ghé đến nơi này, và giờ là lúc tổ chức một nghi lễ long trọng cho người đã khuất.#!"
 funeral_ceremony_good: "Nghi lễ xa hoa"
 funeral_ceremony_good_desc: "$EFFECT_LIST_BULLET$ Tăng mạnh [piety|E]\n$EFFECT_LIST_BULLET$ Tăng mạnh [legitimacy|E]\n$EFFECT_LIST_BULLET$ Giảm mạnh [stress|E]\n\n#weak Một nhân vật vĩ đại của cõi này đã qua đời, lẽ nào họ không xứng đáng với tất cả những gì chúng ta có thể dâng hiến? Không chi phí nào bị tiếc cho tang lễ, và toàn cõi sẽ biết về bi kịch lớn đã giáng xuống.#!"
 mourn_intent: "Tưởng niệm"
 mourn_intent_desc: "Đây là thời khắc để thương tiếc người đã khuất, cũng là lúc thể hiện [piety|E]."
 wakename_offering_of_libations: "Dâng rượu tế"
 wakedesc_offering_of_libations: "Đây là lúc dâng thức ăn và nước uống cho người đã khuất. Thi thể sẽ được tẩy rửa và ướp xác để những người viếng tang tưởng niệm trong những ngày tới."
 wakename_sky_burial: "Tôn vinh người đã khuất"
 wakedesc_sky_burial: "Đây không phải lúc bộc phát cảm xúc, mà là thời khắc buồn thương trầm lặng. Khách viếng có thể an ủi gia quyến đang đau buồn."
 wakename_mummification: "Ướp xác"
 wakedesc_mummification: "Những người viếng tang tụ họp trong mong đợi khi thi thể được ướp và bảo quản, để lưu giữ vĩnh viễn."
 wakename_wake: "Lễ canh thi"
 wakedesc_wake: "Đây là lúc canh giữ thi thể người đã khuất, cơ hội cuối cùng để bày tỏ tâm tư trước khi họ được đưa sang thế giới bên kia."
 wakename_bathing: "Tắm rửa thi thể"
 wakedesc_bathing: "Những người viếng tang tụ họp để tắm rửa thi thể người đã khuất và quấn họ trong vải liệm."
 ceremonyname_public_bewailment: "Khóc than công khai"
 ceremonydesc_public_bewailment: "Đây là lúc trút hết cảm xúc; khóc lóc, than vãn và ai oán quanh thi thể trước khi đưa họ về với đất."
 ceremonyname_sky_burial: "Thiên táng"
 ceremonydesc_sky_burial: "Thi thể sẽ được trao cho loài chim mang lên trời, để người đã khuất nuôi dưỡng thế gian như khi còn sống họ từng được thế gian nuôi dưỡng."
 ceremonyname_ground_burial: "An táng"
 ceremonydesc_ground_burial: "Thi thể được giao lại cho lòng đất và lời cầu nguyện vang lên giữa những người viếng tang. Dẫu linh hồn còn sống mãi, thân xác nay đã an nghỉ."
 ceremonyname_cremation: "Hỏa táng"
 ceremonydesc_cremation: "Thi thể được thiêu trên một giàn hỏa táng lớn."
 ceremonyname_mummification: "An táng trong mộ"
 ceremonydesc_mummification: "Thi thể đã được ướp xác được đặt vào lăng mộ để yên nghỉ."
 ceremonyname_ceremony: "Nghi lễ"
 ceremonydesc_ceremony: "Thi thể sẽ được tiễn sang cõi bên kia trong một nghi lễ truyền thống và [pious|E]."
 activity_funeral_predicted_cost: "Chi phí tang lễ phụ thuộc vào [activity_options|E] ngươi chọn và tập tục tang lễ theo [doctrine|E] của [faith|E] ngươi."
 funeral_cost_increase_great_temple: "Có Đại Đền tại đây"
 funeral_cost_increase_mummification: "Ướp xác"
 funeral_cost_discount_cremation: "Hỏa táng"
 funeral_activity_cost_desc: "Chi phí cơ bản"
 building_funeral_effect_desc:1 "$unlocks_building_desc$Tăng [legitimacy|E] và [piety|E] nhận được khi tổ chức [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] [activities|E] tại [holding|E] này"
 building_funeral_wavel_effect_desc:1 "$unlocks_building_desc$Tăng mạnh [legitimacy|E] và [piety|E] nhận được khi tổ chức [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] [activities|E] tại [holding|E] này"

 # Events
 funeral.0001.t: "Cái Chết Trong Tang Lễ"
 funeral.0001.desc: "Một nỗi tang thương khác lại giáng xuống hôm nay khi chủ lễ của chúng ta, [host.GetName], đã thăng lên [host.GetFaith.PositiveAfterLife].\n\nDẫu điều này khiến nghi thức hiện tại phải kết thúc sớm, nó cũng báo hiệu rằng có lẽ sẽ có thêm một tang lễ nữa đến sớm hơn nhiều so với dự liệu."
 funeral.0001.a: "Thật đáng tiếc."
 funeral.0001.a.tt: "[host.GetName] đã qua đời."
 funeral.0002.t: "Cái Chết Trong Tang Lễ"
 funeral.0002.desc: "Một lý do khác để chịu tang đã giáng xuống chúng ta ngày hôm nay khi chủ tiệc [host.GetName] đã thăng thiên về [host.GetFaith.PositiveAfterLife]. Với tư cách là người thừa kế của [host.GetHerHis], các nghĩa vụ tổ chức của [host.GetHerHis] đã được chuyển giao cho ta.\n\nMặc dù điều này không có nghĩa là kết thúc buổi lễ khiêm nhường của chúng ta, nhưng nó cho thấy rằng có thể sẽ có những đám tang khác sớm hơn đáng kể so với dự kiến."
 funeral.0002.a: "Ta sẽ làm điều cần làm."
 funeral.0002.a.tt: "Trách nhiệm chủ trì tang lễ đã chuyển sang ngươi."
 funeral.0010.t: "Đến Nơi"
 funeral.0010.desc_intro: "[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] sẽ là nơi an nghỉ cuối cùng của [deceased.GetFirstNamePossessive], và ta"
 funeral.0010.self: "được để lại một mình để thu xếp tâm trí và chuẩn bị đón những người đến viếng."
 funeral.0010.dislikes_host: "được chào đón bởi [host.Custom2('InsultAdjective', ROOT.Char)] [host.Custom2('InsultNoun', ROOT.Char)] [host.GetName]. Mặc dù ta rất ghét ở trong sự hiện diện của [host.GetHerHis], ta thực sự ở đây vì [deceased.GetName]. Đây là cơ hội để ta"
 funeral.0010.likes_host: "được [host.GetName] hào hiệp chào đón. Ngoài việc được tận hưởng sự đồng hành của [host.GetHerHis], ta cũng đến đây vì [deceased.GetName]. Đây sẽ là cơ hội cuối cùng để ta"
 funeral.0010.neutral: "được chào đón bởi [host.GetName]. Mặc dù ta không quan tâm lắm đến sự hiện diện của [host.GetHerHis], ngày hôm nay thực sự là vì [deceased.GetName] và đây là cơ hội để ta"
 funeral.0010.disrespect: "cười nhạo lần cuối kẻ khốn đáng khinh kia."
 funeral.0010.respect: "nói lời vĩnh biệt cuối cùng với [deceased.GetHerHim].\n\n"
 funeral.0010.intent_arrived: "\n\nTa thấy [ROOT.Char.GetIntentTarget.GetTitledFirstName] giữa những người viếng tang, hoàn toàn không hay biết kế hoạch của ta là [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim]."
 funeral.0010.intent: "\n\nTa vẫn chưa thấy [ROOT.Char.GetIntentTarget.GetTitledFirstName] đâu cả. Ta nóng lòng chờ [ROOT.Char.GetIntentTarget.GetHerHis] đến để kế hoạch [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetHerHim] của ta có thể bắt đầu."
 funeral.0010.a.bad: "Theo ta tính thì đây là lúc đáng để ăn mừng."
 funeral.0010.a.good: "Ta sẽ không bao giờ quên [deceased.GetHerHim]."
 funeral.0100.t: "Cát Bụi Trở Về Cát Bụi"
 funeral.0100.desc.intro: "Giờ đã đến lúc cử hành nghi thức cuối cùng cho [deceased.GetNamePossessive] trước khi [deceased.GetHerHis] bước vào hành trình cuối cùng sang cõi bên kia.\n\n"
 funeral.0100.desc.intro2.burial: "Thi thể được liệm của [deceased.GetFirstNamePossessive|U] được treo lơ lửng trên một ngôi mộ mở, xung quanh là bạn bè thân thiết và gia đình. Đứng ở đầu của [deceased.GetHerHis] là [host.GetNameOrMe], một vị trí tang lễ đặc quyền chỉ dành cho một chủ tiệc đại lượng."
 funeral.0100.desc.intro2.sky_burial: "Thi thể của [deceased.GetFirstNamePossessive|U] được rước lên điểm cao nhất tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] trong đoàn người viếng tang. Trước khi lên đến đỉnh, thi thể được giao riêng cho [host.GetNameOrMe] để hoàn tất chặng cuối."
 funeral.0100.desc.intro2.mummification: "Thi thể được bảo quản hoàn hảo của [deceased.GetFirstNamePossessive|U] được bày ra cho mọi người chiêm ngưỡng. Công việc tuyệt vời của những người ướp xác khiến [deceased.GetHerHim] trông như thể [deceased.GetSheHe] có thể đứng dậy bước đi bất cứ lúc nào, và trước khi được đặt vào lăng mộ vĩnh viễn, thi thể được để riêng với [host.GetNameOrMe] trong chốc lát."
 funeral.0100.desc.intro2.cremation: "[deceased.GetFirstName] nằm được bọc trong vải quý trên giàn hỏa táng cao lớn. [host.GetFaith.PriestNeuter] đứng cạnh [host.GetNameOrMe] với một ngọn đuốc, ánh lửa lay động trong gió."
 funeral.0100.desc.mid.hate: "\n\nĐối mặt với thi thể trống rỗng sự sống của [deceased.GetHerHis], ta khẽ cười thầm. Ta sẽ là người chôn cất di hài khốn khổ của [deceased.GetHerHis] một lần và mãi mãi."
 funeral.0100.desc.mid.love: "\n\nTa gần như không dám nhìn [deceased.GetHerHim], và ngay lúc này ta vẫn khó tin rằng đây thực sự là khoảnh khắc cuối cùng của chúng ta."
 funeral.0100.desc.mid.spouse: "\n\nTa nhìn người [deceased.Custom('WifeHusband')] đã khuất của mình lần cuối, không khỏi nghĩ đến tất cả những thời gian chúng ta đã bị tước đoạt. Những đứa cháu ta chưa từng bồng bế, những đêm ân tình ta chưa từng cùng nhau chia sẻ."
 funeral.0100.desc.mid.child: "\n\nTa nhìn vào cơ thể không còn sự sống của [deceased.Custom('GetDaughterSon')] mình và than thở. Không [ROOT.Char.GetMotherFather] nào nên phải sống để chứng kiến con cái của chính mình bị dập tắt một cách tàn nhẫn như vậy."
 funeral.0100.desc.mid.predecessor: "\n\nThấy [deceased.GetHerHim] được bao quanh bởi bao người viếng tang và được an táng theo nghi thức [ROOT.Char.GetFaith.GetAdjective] trang trọng khiến ta hy vọng rằng một ngày kia, ta cũng sẽ được nhớ đến như thế khi còn là [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 funeral.0100.desc.mid.young: "\n\nThật là một bi kịch khi một người còn trẻ như vậy đã bị tước đoạt mạng sống ngay trước mắt ta."
 funeral.0100.desc.mid.old: "\n\nTa chỉ có thể tìm chút an ủi khi thấy một người đã sống lâu đến vậy. Một đời dài và rực rỡ khiến bao người ghen tị, và được bao quanh bởi nhiều người viếng tang như thế là điều mà bất kỳ [ROOT.Char.GetWomanMan] nào cũng có thể mong ước."
 funeral.0100.desc.mid.fallback: "\n\nNghi thức cuối cùng cho cơ thể của [deceased.GetHerHis] được để lại cho ta, và gánh nặng của trách nhiệm đó đè nặng lên tâm trí ta."
 funeral.0100.desc.outro.burial: "Cuối cùng, thi thể [deceased.GetHerHis] được hạ xuống lòng đất, và tang lễ chính thức khép lại bằng một lời cầu nguyện."
 funeral.0100.desc.outro.sky_burial: "Những vết rạch nghi lễ được thực hiện để chim ăn xác dễ tiếp cận phần thịt, và nghi thức tạm thời kết thúc. Chỉ còn việc quay lại vài ngày sau để thu nhặt xương."
 funeral.0100.desc.outro.mummification: "Thi thể đã được ướp được giao lại cho ta cùng vài bình đựng nội tạng. Lăng mộ có thể là nơi đặt chúng, nhưng triều đình của ta cũng xứng đáng là nơi yên nghỉ."
 funeral.0100.desc.outro.cremation: "Ta hạ ngọn đuốc xuống bó củi mồi và nhìn tháp gỗ bùng cháy. Giờ chỉ còn chờ [deceased.GetFirstNameNoTooltip] hóa thành tro bụi."
 funeral.0100.a: "Thật trang nghiêm."
 funeral.0100.b: "Giờ [deceased.GetSheHe] sẽ sống mãi tại triều đình."
 funeral.0100.c: "Ta sẽ luôn giữ [deceased.GetHerHim] bên mình."
 funeral.0100.d: "Mọi thứ nên nằm trong lăng mộ."
 funeral.0101.t: "$funeral.0100.t$"
 funeral.0101.desc.intro: "$funeral.0100.desc.intro$"
 funeral.0101.desc.intro2.burial: "$funeral.0100.desc.intro2.burial$"
 funeral.0101.desc.intro2.sky_burial: "$funeral.0100.desc.intro2.sky_burial$"
 funeral.0101.desc.intro2.mummification: "$funeral.0100.desc.intro2.mummification$"
 funeral.0101.desc.intro2.cremation: "$funeral.0100.desc.intro2.cremation$"
 funeral.0101.desc.outro.burial: "\n\nChúng ta đọc vài lời cầu nguyện truyền thống cho người đã khuất, rồi thi thể [deceased.GetHerHis] được từ từ hạ xuống huyệt mộ của [deceased.GetHerHis], nơi [deceased.GetSheHe] có thể yên nghỉ nơi thiên đường vĩnh hằng."
 funeral.0101.desc.outro.sky_burial: "\n\nNhững vết rạch nghi thức được thực hiện trên thi thể, và những con chim đói đã bay lượn phía trên, sẵn sàng xé thịt. Giờ chỉ còn để chúng làm phần việc của mình, và các [host.GetFaith.PriestNeuterPlural] sẽ trở lại sau vài ngày để thu nhặt xương."
 funeral.0101.desc.outro.mummification: "\n\nDi hài giờ được [host.GetName] mang đi cùng với các bình đựng nội tạng của [deceased.GetHerHis] để được bảo quản vĩnh viễn."
 funeral.0101.desc.outro.cremation: "Ngọn đuốc được hạ xuống bó củi mồi và ta nhìn ngọn tháp gỗ bùng cháy. Giờ chỉ còn chờ [deceased.GetFirstNameNoTooltip] hóa thành tro bụi."
 funeral.0101.a: "$funeral.0100.a$"
 funeral.1000.t: "Ta Nhớ [deceased.GetHerHim|U]"
 funeral.1000.desc: "Trong một góc yên tĩnh của [host.GetFaith.HouseOfWorship], ta nghe thấy [random_attendee.GetName] đang trò chuyện với một nhóm người viếng tang. [random_attendee.GetSheHe|U] buồn bã ra hiệu gọi ta lại.\n\n\"Tất cả chúng ta đều có những ký ức đẹp về [deceased.GetName], ta vừa nhắc đến lần [attendee_memory.GetDescription]. Nói xem, ngươi có kỷ niệm nào muốn chia sẻ không?\""
 funeral.1000.a: "Những ký ức ấy quá đau đớn."
 funeral.1000.b: "À—phải, ta biết [deceased.GetHerHim] khá rõ."
 funeral.1000.b.success: "Ngươi nói dối trót lọt"
 funeral.1000.b.failure: "Không ai tin ngươi"
 funeral.1000.c: "Ta thừa nhận, ta chẳng có gì để kể."
 funeral.1000.d: "Sao ta có thể quên được?"
 funeral.1000.d.success: "Ký ức của ngươi khiến mọi người rơi lệ"
 funeral.1000.d.failure: "Ngươi kể không được suôn sẻ"
 funeral.1000.e: "Đây đâu phải cuộc so tài."
 funeral.1010.t: "Đồ Tùy Táng"
 funeral.1010.desc: "Các vị khách quý lần lượt lướt qua thi thể được liệm của [deceased.GetName], chỉ dành cho [deceased.GetHerHim] một cái cúi đầu hoặc cái gật nhẹ, như thể những cử chỉ hời hợt như vậy có thể đủ để tôn vinh một cuộc đời. Trái tim ta nặng trĩu như túi tiền của ta, vốn đầy những món đồ trang sức và ký ức về [deceased.GetFirstNameNoTooltip].\n\nTa không thể không tự hỏi tại sao ta lại được phép tích trữ những đồ vật vốn thuộc về [deceased.GetHerHim] theo lẽ phải."
 funeral.1010.a: "[common_grave_good.GetNameNoTooltip] không phải thứ của ta."
 funeral.1010.b: "[masterwork_grave_good.GetNameNoTooltip] thuộc về [ROOT.Char.GetFaith.PositiveAfterLife]."
 funeral.1010.c: "[famed_grave_good.GetNameNoTooltip] sẽ được chôn theo."
 funeral.1010.d: "Chỉ có [illustrious_grave_good.GetNameNoTooltip] mới xứng đáng."
 funeral.1010.e: "Đừng nghĩ tới chuyện đó."
 funeral.1020.t: "[host.GetTitleAsNameNoTooltip|U] Giả Mạo"
 funeral.1020.desc: "Những người viếng tang vây quanh [host.GetName], dâng lời kính trọng và chúc phúc cho kẻ tự xưng '[host.GetTitleAsNameNoTooltip|U]'. Không một ai dành cho ta sự kính trọng tương tự, dù địa vị của ta hiển nhiên.\n\nLiệu [deceased.GetName] thật sự muốn [host.GetFirstNameNoTooltip] kế vị [deceased.GetHerHis] sao?"
 funeral.1020.c: "[deceased.GetFirstNameNoTooltip] hẳn muốn ta ủng hộ [host.GetHerHim]."
 funeral.1020.a: "Mọi người phải biết quyền thừa kế thật sự của ta!"
 funeral.1020.b: "Giờ chưa phải lúc."
 funeral.1021.t: "$funeral.1020.t$"
 funeral.1021.desc: "Ta ngắm nhìn [deceased.GetName] trong sự chiêm nghiệm lặng lẽ, chỉ bị gián đoạn bởi những người đến thăm đôi khi trao gửi sự cảm thông.\n\n\"[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! Ngươi dám gọi mình là [ROOT.Char.GetTitleAsNameNoTooltip|U] sao?\" [claimant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] lao về phía ta, ngón tay giận dữ vẫy vẫy cách mặt ta vài inch. \"[deceased.GetNameNoTooltip|U] đã có ý định để #EMP ta#! dẫn dắt thay chỗ của [deceased.GetHerHis]! Kẻ phản diện!\""
 funeral.1021.a: ""Cút ra!""
 funeral.1021.a.toast: "Ngươi bị đuổi khỏi tang lễ"
 funeral.1021.b: ""Ta không quan tâm.""
 funeral.1021.b.toast: "Cơn bộc phát của ngươi bị phớt lờ"
 funeral.1030.t: "Dẫu Phải Chờ Mãi"
 funeral.1030.desc: "Ta đã nhìn vô số người đến rồi đi, thực hiện nghĩa vụ viếng tang u ám của họ. Nhưng có một kẻ vẫn nằm bất động bên cạnh [deceased.GetFirstName] đã khuất.\n\nSuốt nhiều giờ nó vẫn ở đó, như thể muốn ở mãi mãi, con chó trung thành của [ROOT.Char.Custom2('RelationToMeShort', deceased)] rên rỉ tìm kiếm [deceased.GetWomanMan] mà [ROOT.Char.GetFaith.HighGodName] đã định làm chủ của nó. Nó chỉ nằm đó chờ đợi, và nếu ta không can thiệp, có lẽ nó sẽ theo thi thể sang cõi bên kia."
 funeral.1030.a: ""Lại đây, ở bên ta cùng tang chế.""
 funeral_1030_adopt_tt: "Ngươi nhận nuôi con chó của [deceased.GetFirstNamePossessiveNoTooltip]."
 funeral.1030.b: ""Rời khỏi chủ nhân bất động của ngươi đi!""
 funeral.1030.c: "Ngửi tang đủ rồi, giờ thử cái giày của ta!"
 funeral.1040.t: "Bất Hoại"
 funeral.1040.desc: "Thi thể của [ROOT.Char.Custom2('RelationToMeShort', deceased)] mà ta thương tiếc đã không còn sự sống nhiều ngày, vậy mà đôi mắt [deceased.GetHerHis] vẫn như còn linh hồn, ánh nhìn của thần linh. [ROOT.Char.GetFaith.HighGodNamePossessive|U] giữ thi thể khỏi sự tàn phá của mục rữa, như thể giữ [deceased.GetHerHim] trong giấc mộng giữa sống và chết.\n\nĐám đông xôn xao đã tuyên bố thi thể này là bất hoại, được chọn để tôn lên thành [GetTrait('saint').GetName( deceased )]."
 funeral.1040.a: "Một phép màu trước mắt ta."
 funeral.1040.b: "Ta phải đóng vai người biện hộ của [ROOT.Char.GetFaith.DevilNamePossessive]."
 funeral.1040.b.success: "Lời phản biện của ngươi có hiệu quả"
 funeral.1040.b.failure: "Lời phản biện của ngươi bị phớt lờ"
 funeral.1040.c: "Chắc hẳn điều tương tự cũng sẽ xảy ra với ta."
 funeral.1050.t: "Khoảnh Khắc Của Chúng Ta"
 funeral.1050.desc: "Trong muôn nhân vật được tôn kính lẫn bị căm ghét, không ai được khao khát hơn người đã khuất của chúng ta, [deceased.GetName]. Khi đám đông khóc than và tò mò của [deceased.GetHerHis] đã tìm sang những đối tượng khác để thỏa trí hiếu kỳ, cuối cùng ta cũng có được khoảnh khắc yên tĩnh giữa ta và [ROOT.Char.Custom2('RelationToMeShort', deceased)]."
 funeral.1050.witch: "Ta sẽ lấy một ít tóc."
 funeral.1050.a: "Một lúc cầu nguyện lặng lẽ."
 funeral.1050.b: "Cho phép mình buồn đau một chút."
 funeral.1050.c: "Hãy trút hết ra."
 funeral.1050.d: "Ta hứa sẽ là một [ROOT.Char.GetTitleAsNameNoTooltip|U] tốt hơn."
 funeral.1060.t: "Ngôi Sao Tang Tóc"
 funeral.1060.desc: "Mọi ánh mắt đều đổ dồn vào [other_mourner.GetName] khi [other_mourner.GetSheHe] ngã xuống đất than khóc, đôi tay che khuất đôi mắt đỏ hoe của [other_mourner.GetHerHis]. Những tiếng thở hổn hển và nghẹn ngào của [other_mourner.GetNamePossessiveNoTooltip|U] đã khiến những người cùng chịu tang phải nín thở, và nhiều người dành cho [other_mourner.GetHerHim] sự an ủi và tôn kính như thể [other_mourner.GetHerHim] mới là người sắp được đưa vào cõi vĩnh hằng."
 funeral.1060.a: "Mọi ánh mắt phải hướng về ta."
 funeral.1060.a.success: "Mọi ánh mắt đều hướng về ngươi"
 funeral.1060.a.failure: "Ngươi tự biến mình thành trò cười"
 funeral.1060.b: "Ta chỉ có thể tang thương theo cách của riêng mình."
 funeral.1060.c: "Ta đến an ủi."
 funeral.1070.t: "Cái Chết Là Gì?"
 funeral.1070.desc: "Cái chết. Xung quanh ta toàn là lời bàn về cái chết, về [ROOT.Char.GetFaith.PositiveAfterLife] và [ROOT.Char.GetFaith.NegativeAfterLife]. Nó vang vọng trong tâm trí ta, hình ảnh gương mặt [deceased.GetFirstNamePossessive] — sẽ không bao giờ còn được thấy nữa — nhưng cái chết và ý nghĩa của nó lại trượt khỏi sự hiểu biết của ta như cát lọt qua kẽ tay.\n\nSố phận này, dù tàn nhẫn hay nhân từ, cũng khiến ngay cả người trưởng thành kiên cường nhất phải rơi lệ, hoặc âm thầm, hoặc gào khóc. Vậy rốt cuộc nó là gì? Có lẽ [other_mourner.GetName] sẽ cho ta một câu trả lời đơn giản."
 funeral.1070.a: "Vì sao mọi người lại buồn đến thế?"
 funeral.1070.b: "Có lẽ ta nên làm theo những gì người khác làm..."
 funeral.1071.t: "Tuổi Trẻ Hữu Hạn"
 funeral.1071.desc: "Một sự bình yên lặng lẽ lan qua ta khi ta nhìn quanh căn phòng đầy người đưa tang. Có đôi mắt đỏ hoe vì khóc, có người lại xem đây chẳng khác gì một dịp tụ họp bình thường. Nhưng có một linh hồn nhìn ta với vẻ bối rối khi [confused_child.GetSheHe] kéo nhẹ tay áo ta.\n\n[confused_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] không khóc nức nở, nhưng cũng không dửng dưng như nhiều đứa trẻ khác. \"[ROOT.Char.GetNameNoTooltip], chuyện gì đã xảy ra với [deceased.GetFirstName]? Vì sao mọi người đều buồn vậy?\""
 funeral.1071.a: ""Đừng lo nghĩ quá, hài tử.""
 funeral.1071.a.tt: "[other_mourner.GetFirstName] đến an ủi ngươi."
 funeral.1071.b: ""[deceased.GetSheHe|U] giờ đã ở nơi [ROOT.Char.GetFaith.PositiveAfterLife].""
 funeral.1071.b.reincarnation: ""[deceased.GetSheHe|U] tiếp tục hành trình luân hồi của [deceased.GetHerHis].""
 funeral.1071.b.taoism: ""[deceased.GetSheHe|U] nay đã trở về với vũ trụ.""
 funeral.1071.a.success: "Đứa trẻ được an ủi"
 funeral.1071.a.success.child: "Ngươi được an ủi bởi ý nghĩ về thế giới bên kia"
 funeral.1071.a.failure: "Đứa trẻ bị ám ảnh"
 funeral.1071.a.failure.child: "Ngươi nhận ra sự hữu hạn của chính mình"
 funeral.1080.t: "Nỗi Đau Của [other_mourner.Custom2('RelationToMeShort', deceased)|U]"
 funeral.1080.desc: "Khom lưng bên cạnh ta, không còn giữ nổi vẻ lễ nghi, [other_mourner.GetFirstName] đau khổ nhìn vào khoảng không trước mặt [other_mourner.GetHerHim]. Không một giọt nước mắt rơi khỏi mắt [other_mourner.GetHerHis], không một lời nào thoát khỏi miệng [other_mourner.GetHerHis], cho đến khi [other_mourner.GetSheHe] quay sang ta.\n\n\"[other_mourner.GetFaith.HighGodName|U] quả thật tàn nhẫn. Vì sao gió vẫn thổi? Vì sao biển vẫn xô vào bờ? Vì sao thân thể ta vẫn đòi ăn và khát nước? [other_mourner.Custom('apocalypse_name')|U] đã đến rồi — [other_mourner.Custom2('RelationToMeShort',deceased)] của ta đã chết.\""
 funeral.1080.a: ""Cảm giác của ta cũng vậy.""
 funeral.1080.b: ""Bình tĩnh. Chúng ta không thể để nỗi đau nuốt chửng mình.""
 funeral.1080.c: ""Còn sống là còn hy vọng.""
 funeral.1080.c.success: "[other_mourner.GetSheHe|U] được an ủi"
 funeral.1080.c.failure: "[other_mourner.GetSheHe|U] bị xúc phạm"
 funeral.1080.d: "Lặng lẽ gật đầu."
 funeral.1090.t: "Cơ Hội Cuối Cùng"
 funeral.1090.desc: "Hàng người đau buồn vẫn tiến bước, hàng người chờ có khoảnh khắc cuối cùng với [deceased.GetName]. Một lời thì thầm cuối, một lời vĩnh biệt cuối, một khoảng lặng cuối ở nơi cuối cùng bất kỳ ai còn nhìn thấy [deceased.GetHerHim]. Thật sự là một đặc ân khi được ở đây.\n\nHàng người đưa ta tiến gần hơn, cho đến khi người đứng trước ta bước sang một bên, và giờ chỉ còn tấm màn giữa ta và [deceased.GetHerHim]."
 funeral.1090.a: "Hãy để mọi người nghe thấy nỗi đau của ta."
 funeral.1090.b: "Cúi đầu lặng lẽ rồi rời đi."
 funeral.1090.c: ""Cuối cùng thì ta đã thắng.""
 funeral.1090.d: "Phát biểu hứa sẽ tiếp nối ý chí của [deceased.GetHerHis]."
 funeral.1090.d.success: "Đám đông xúc động"
 funeral.1090.d.failure: "Ngươi tự làm mình thành trò cười"
 funeral.1090.e: "Nói về những đức hạnh của [deceased.GetHerHis]."
 funeral.1100.t: "Một Trong Những Vĩ Nhân"
 funeral.1100.desc: "Trước mặt ta là một bàn tiệc đầy ắp mọi loại thức ăn và đồ uống, như thể [deceased.GetName] đang cố gắng thực hiện hành động hào hiệp cuối cùng trước khi ra đi.\n\nTuy nhiên, [other_mourner.GetName|U] cho đến nay vẫn từ chối chạm vào bàn tiệc này, chỉ xoay xoay chiếc cốc của [other_mourner.GetHerHis] trong nỗi buồn nhàn rỗi. Ánh mắt nhìn xa xăm của [other_mourner.GetHerHis|U] rơi một cách mệt mỏi vào ta, và với một cái gật đầu lặng lẽ, [other_mourner.GetSheHe] nâng cao đồ uống của [other_mourner.GetHerHis] lên.\n\n\"Vì [deceased.GetNameNoTooltip], thực sự là một trong những người vĩ đại nhất.\""
 funeral.1100.a: ""Vĩ đại thật — nhưng ta sẽ còn vĩ đại hơn nữa.""
 funeral.1100.a.success: "Đám đông xúc động"
 funeral.1100.a.failure: "Lời nói của ngươi gây xúc phạm lớn"
 funeral.1100.b: ""Vì [deceased.GetNameNoTooltip]!"" 
 funeral.1100.c: ""Hãy nói cho chúng ta biết [deceased.GetSheHe] thật sự có ý nghĩa gì với ngươi.""
 funeral.1100.d: "Khẽ đọc một lời cầu nguyện."
 funeral.1110.t: "Thời Khắc Tang Thương"
 funeral.1110.desc: "Bóng dáng những người đưa tang không còn vây quanh ta nữa, và cuối cùng ta cũng có một khoảnh khắc ở một mình. Một sự yên tĩnh hiếm hoi, không còn tiếng lảm nhảm của khách khứa bên tai. Chỉ còn ta và những suy nghĩ về [deceased.GetName]."
 funeral.1110.a: "Cảm giác... thật kỳ lạ."
 funeral.1120.t: "Lễ Dâng Rượu"
 funeral.1120.desc: "Ta và những người chịu tang khác tạm nghỉ để thưởng thức một bữa ăn thịnh soạn. [other_mourner.GetName|U], người thường là linh hồn của bất kỳ bữa tiệc nào, giờ đây ngồi đối diện ta với đôi mắt nhòe lệ cùng một chiếc cốc chưa chạm tới bên cạnh [other_mourner.GetHerHis].\n\n\"Làm sao chúng ta có thể làm cho bản thân béo tốt và vui vẻ trong những thời điểm như thế này? Chúng ta có nên tận hưởng bản thân trong khi [deceased.GetFirstName] chẳng có gì? Hãy tham gia cùng ta! Hãy làm trống những chiếc cốc của các ngươi như một sự hiến tế!\"\n\nCác vị khách dường như đồng ý, có một sự khôn ngoan trong lời than vãn ngớ ngẩn của [other_mourner.GetFirstNamePossessiveNoTooltip]."
 funeral.1120.aniconist: ""Đồ ngu thờ ngẫu tượng!""
 funeral.1120.a: "Tham gia nghi lễ dâng rượu."
 funeral.1120.b: "Một vòng rượu cho tất cả!"
 funeral.1120.c: "Ta sẽ tưởng nhớ [deceased.GetHerHim] theo cách của riêng mình."
 funeral.1130.t: "Khoảnh Khắc Tang Khóc"
 funeral.1130.desc.intro: "Những người đưa tang di chuyển khắp đại sảnh trong một điệu múa u ám, tất cả vì [deceased.GetName]."
 funeral.1130.desc.bewailment: "Căn phòng tràn ngập tiếng khóc than hòa thành bản hợp âm đau khổ, và ta ngồi giữa tất cả, tai ù đi và tâm hồn nhức nhối."
 funeral.1130.desc.stoic: "Sự im lặng đáng sợ của những con người đang cố kìm nén điều họ tuyệt vọng muốn làm. Những tiếng gào câm lặng không bao giờ thoát khỏi môi, những trận chiến chống lại nước mắt, xấu hổ vì chính nỗi đau của mình."
 funeral.1130.desc.outro: "\n\nTa đứng dậy và để mình hòa vào điệu tang cùng những người đưa tiễn."
 funeral.1130.a: "Ta muốn cả thế giới biết cảm giác này."
 funeral.1130.b: "Ta phải giữ vững."
 funeral.1140.t: "Cùng Nhau Hoặc Không Gì Cả"
 funeral.1140.desc: "Ta tạm rời khỏi nỗi đau giữa vô số người đến viếng [deceased.GetName]. Ngoài tầm tiếng ồn u sầu, ta nghe thấy một tiếng gào thét kỳ lạ vọng khắp đại sảnh trống trải.\n\nLần theo âm thanh, ta thấy [soulmate.GetName] ở một mình trong căn phòng tối, tiếng khóc của [soulmate.GetHerHis] dần lặng đi khi [soulmate.GetSheHe] nhìn ta bằng đôi mắt vô hồn. Trong tay [soulmate.GetHerHis] là một chiếc chai không nhãn đáng sợ.\n\n\"Sẽ không còn lâu nữa đâu, cho đến ngày cưới của chúng ta.\""
 funeral.1140.a: ""Đây thật sự là điều [deceased.GetSheHe] mong muốn sao?""
