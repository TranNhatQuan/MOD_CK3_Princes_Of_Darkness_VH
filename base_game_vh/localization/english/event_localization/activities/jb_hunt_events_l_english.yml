l_english:
  hunt.8000.t:0 "Phô Trương"
  hunt.8000.desc:0 "[swooning_attendee.GetName] đã ngắm nhìn con chim săn của ta từ khi chúng ta tách ra để săn bắn, và ta cũng khó mà trách [swooning_attendee.GetHerHim], bởi nó quả thật là một sinh vật tuyệt đẹp và uy nghi.\n\nChúng ta đến gần một con sông nhỏ, nơi đầy cá lớn bơi lội, và ta cảm thấy đây là cơ hội hoàn hảo để cho thấy [activity.Custom('GetRaptorType')] của ta có thể làm được gì!"
  hunt.8000.a:0 "Kỹ năng ưng thuật của ta sẽ gây ấn tượng!"
  hunt.8000.falcon_success:0 "[activity.Custom('GetRaptorType')] của ngươi bắt được một con cá"
  hunt.8000.falcon_failure:0 "[activity.Custom('GetRaptorType')] của ngươi thất bại"
  hunt.8000.b:0 "Ta sẽ tự bắt cá!"
  hunt.8000.fist_success:0 "Ngươi bắt được cá bằng tay không"
  hunt.8000.fist_failure:0 "Ngươi làm mình bẽ mặt"
  hunt.8010.t:0 "Bữa Tiệc của [activity.Custom('GetRaptorType')|U]"
  hunt.8010.desc:0 "[activity.Custom('GetRaptorType')] của ta dường như trở nên khá kích động trên cổ tay, liên tục gõ và mổ vào ta một cách bồn chồn. Không nghi ngờ gì nữa, con thú đang nóng lòng bay lên bầu trời một lần nữa và mang về cho ta một con mồi mới!\n\nĐể nó duỗi cánh thì cũng tốt, nhưng ta vẫn chưa thấy dấu vết nào đáng để săn, nên có lẽ [activity.Custom('GetRaptorType')] của ta sẽ trở về với móng vuốt trống rỗng."
  hunt.8010.a:0 "Bay đi, [activity.Custom('GetRaptorType')] của ta!"
  hunt.8010.falcon_success:0 "[activity.Custom('GetRaptorType')] của ngươi mang về một con mồi"
  hunt.8010.falcon_failure:0 "$hunt.8000.falcon_failure$"
  hunt.8010.b:0 "Tập trung lần theo dấu vết."
  hunt.8020.t:0 "Kẻ Mang Quà"
  hunt.8020.desc:0 "[activity.Custom('GetRaptorType')] của ta đậu xuống và quan sát cảnh vật xung quanh một cách sắc bén. Trong chớp mắt, con chim lao xuống thứ gì đó và trở nên điên cuồng khi chạm tới con mồi. Nó mổ và cào vào thứ gì đó trên mặt đất, dù ta không nhìn rõ đó là gì.\n\nTa vội chạy tới chỗ [activity.Custom('GetRaptorType')] đang kêu inh ỏi và thấy nó không đứng trên xác thú, mà là một đống nhỏ tiền xu và đồ trang sức! Giá trị của chúng không quá lớn, và chắc ta cũng không thể tìm ra chủ nhân ban đầu ngay cả khi muốn."
  hunt.8020.a:0 "\"Một phát hiện tuyệt vời, người bạn có cánh của ta!\""
  hunt.8020.b:0 "\"Những của cải này thuộc về [ROOT.Char.WealthGodName].\""
  hunt.8030.t:0 "Theo Dấu [activity.Custom('GetRaptorType')|U]"
  hunt.8030.desc:0 "[activity.Custom('GetRaptorType')] của ta hoàn toàn biến mất khỏi tầm mắt, và dù nhìn khắp nơi cũng không thấy gì. Rồi ta nghe nó kêu ré gọi ta, và thấy nó đậu với máu nhỏ giọt từ móng vuốt, dù xung quanh không có dấu hiệu của con thú nào khác.\n\nRõ ràng [activity.Custom('GetRaptorType')] của ta vừa giao chiến với thứ gì đó quá lớn để tự mình hạ gục, và nó chắc hẳn đang ở gần đây!"
  hunt.8030.a:0 "Hãy tìm con thú!"
  hunt.8030.success:0 "Ngươi đạt được tiến triển lớn"
  hunt.8030.failure:0 "Ngươi đạt được chút tiến triển"
  hunt.8030.b:0 "\"Theo dấu nó đi, ta sẽ theo sau sau khi nghỉ một chút.\""
  hunt.8040.t:0 "Chiếc Găng Tay May Mắn"
  hunt.8040.desc:0 "[glove_salesman.GetName] đã là ngôi sao của cuộc săn cho đến giờ; móng vuốt của con [activity.Custom('GetRaptorType')] của [glove_salesman.GetHerHis] luôn nhỏ máu đỏ tươi, đến mức chiếc găng tay của [glove_salesman.GetHerHis] dường như đã nhuộm màu đỏ vĩnh viễn. Ta không thể không hỏi [glove_salesman.GetSheHe] đã làm gì để huấn luyện một con chim săn ngoan ngoãn và tài giỏi như vậy, và [glove_salesman.GetSheHe] chỉ cười.\n\n\"Ta ước gì có thể nói đó là nhờ huấn luyện giỏi, nhưng nói thật thì chiếc găng tay của ta được [glove_salesman.GetFaith.FateGodName] ban phúc. Ta sẵn sàng bán nó, nếu được trả đúng giá.\""
  lucky_falconry_glove:0 "Găng Tay Ưng Thuật May Mắn"
  lucky_falconry_glove_desc:0 "Người ta tin rằng chiếc găng tay ưng thuật này mang lại may mắn cho người đeo trong săn bắn và các hoạt động võ nghệ."
  hunt.8040.a:0 "Ta phải có nó!"
  hunt.8040.b:0 "Ta không cần may mắn."
  hunt.8040.c:0 "\"Ta có thể trả #EMP đúng giá#!.\""
  hunt.8050.t:0 "Phát Hiện Dấu Chân!"
  hunt.8050.desc:0 "Một lần nữa ta lại ở nơi hoang dã, tìm kiếm con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] huyền thoại khó nắm bắt, nhưng vẫn chưa thấy một dấu vết nào. Cho đến khi ta thấy một bộ dấu chân động vật dẫn xa khỏi con đường.\n\n[m_hunt.GetName] nắm chặt tay ta và kéo ta đi. [m_hunt.GetSheHe|U] khẳng định rằng đây không phải dấu chân của con thú huyền thoại, mà chỉ là của một con [activity.Custom('GetAnimalType')] bình thường."
  hunt.8050.a:0 "Vẫn cứ theo dấu chân."
  legendary_animal_close_tt:0 "Dấu chân dẫn ngươi đến gần mục tiêu hơn"
  legendary_animal_no_trace_tt:0 "Dấu chân không dẫn đến đâu"
  hunt.8050.b:0 "\"Ta đoán ngươi nói đúng.\""
  hunt.8060.t:0 "Coi Chừng!"
  hunt.8060.desc:0 "Chúng ta đang tiến triển trong việc lần theo con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] thì bị gián đoạn bởi một [eccentric_hunter_scope.GetWomanMan] tiều tụy và mất ngủ.\n\n\"Coi chừng! Coi chừng con thú! Ta đã tìm kiếm con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] suốt nhiều năm, khắp vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! Nó hung dữ và chỉ khát máu người! Rời đi đi, đây là gánh nặng của ta!\""
  hunt.8060.a:0 "\"Hãy nói cho ta mọi điều ngươi biết.\""
  hunt.8060.success:0 "[eccentric_hunter_scope.GetSheHe|U] kể cho ngươi mọi thứ"
  hunt.8060.failure:0 "[eccentric_hunter_scope.GetSheHe|U] không nói gì"
  hunt.8060.b:0 "\"Ngươi biết vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l], hãy đi cùng ta!\""
  hunt.8060.c:0 "\"Đồ điên! Tránh xa ta ra!\""
  hunt.8070.t:0 "Lắp Tên, Ngắm..."
  hunt.8070.desc.intro:0 "Ta đã lục lọi khắp vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] suốt nhiều giờ. Con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] ám ảnh giấc mơ của ta, luôn ngoài tầm với.\n\nNhưng rồi ta thấy nó! Trên một gò đất, [activity.Custom('GetAnimalSoundParticiple')] và phơi mình dưới nắng, như đang chế giễu ta!"
  hunt.8070.desc.mid.lunatic:0 "Ta nghe thấy tiếng thì thầm của nhóm thợ săn xung quanh, họ nghĩ ta không thể giết con thú!"
  hunt.8070.desc.mid.paranoid:0 "Nó trông không thật, có lẽ ai đó trong đoàn đã tạo ra đồ giả để lừa ta!"
  hunt.8070.desc.mid.fallback:0 "Đối tượng ám ảnh này chỉ mang đến cho ta cơn giận dữ trong mọi khoảnh khắc tỉnh táo."
  hunt.8070.desc.outro:0 "Ta không khỏi cảm thấy đây chỉ là một giấc mơ nữa, nhưng ta hoàn toàn tỉnh táo."
  hunt.8070.a:0 "Bắn!"
  hunt.8070.b:0 "Không, điều này không thể thật."
  hunt.8071.t:0 "... Bắn!"
  hunt.8071.desc.intro:0 "Ta thả mũi tên và nhìn nó bay về phía gò đất. Ta thề rằng mình nghe thấy tiếng kêu đau đớn, nhưng không chắc.\n\nTa chạy đến nơi phát ra"
  hunt.8071.desc.outro:0 "và thấy con thú chạy sâu hơn vào vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! Trên đường chạy, nó để lại vệt máu, nhưng cú bắn dường như không làm nó bị thương nặng."
  hunt.8071.a:0 "Theo vết máu!"
  hunt.8072.desc.outro:0 "và ta thấy xác [murder_target.GetNamePossessive] nằm bất động với mũi tên cắm trong sọ [murder_target.GetHerHis]. Da ta lạnh toát và tay chân yếu đi. Sao ta có thể làm chuyện này? [murder_target.GetSheHe|U] trông chẳng giống con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] chút nào!"
  hunt.8072.a:0 "Ta đang mất trí rồi."
  hunt.8073.desc.outro:0 "và tất cả những gì còn lại là một mũi tên cắm sâu xuống đất. Không có dấu chân, không có phân, không có dấu hiệu nào của [activity.Custom('GetAnimalType')]. Nó có thực sự ở đây không, hay tất cả chỉ trong đầu ta? Có thật tồn tại con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] không?"
  hunt.8073.a:0 "Ta không phải kẻ điên!"
  hunt.8074.desc.outro:0 "và ta thấy xác một con [activity.Custom('GetAnimalType')] bình thường, không hề có dấu hiệu gì của màu [activity.Custom('GetLegendaryColor')]. Có lẽ chỉ là ánh sáng đánh lừa, nhưng ít nhất cú hạ gục cũng sạch sẽ."
  hunt.8074.a:0 "Giết được là được."
  hunt.8500.t:0 "Trên Đỉnh Thế Giới"
  hunt.8500.desc:0 "Ta thả [activity.Custom('GetRaptorType')] của mình, nhưng thay vì bay thẳng, con thú ngốc nghếch chỉ vỗ cánh bay lên cây [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTree')] gần nhất rồi đậu ở đó.\n\nNó nhìn lại ta bằng đôi mắt vô cảm, như thể nó vừa không làm ta bẽ mặt trước toàn bộ đoàn săn. Ta gọi nó xuống, và thứ duy nhất nhận lại là tiếng cười nén của các thợ săn khác."
  hunt.8500.a:0 "Ta sẽ tự leo lên đó!"
  hunt.8500.success:0 "Ngươi lấy lại được [activity.Custom('GetRaptorType')]"
  hunt.8500.failure:0 "Ngươi bị ngã"
  hunt.8500.b:0 "Ta tin vào sự huấn luyện của [activity.Custom('GetRaptorType')] của mình."
  hunt.8500.falcon_success:0 "[activity.Custom('GetRaptorType')] của ngươi quay lại"
  hunt.8500.falcon_failure:0 "[activity.Custom('GetRaptorType')] của ngươi vẫn ở trên đó"
  hunt.8510.t:0 "Bị Tấn Công"
  hunt.8510.desc: "Ngay sau khi biến mất vào vùng hoang dã, ta nghe thấy [activity.Custom('GetRaptorType')] của ta rít lên và kêu gào trong đau đớn tột cùng. Ta chạy nước rút đến nơi phát ra tiếng động, và thấy chân của con chim săn mồi cao quý của ta đã bị một con [ROOT.Char.Custom('GetAnimalType')] gớm ghiếc chộp lấy!\n\nCuộc chiến không diễn ra tốt đẹp cho [activity.Custom('GetRaptorType')] thân yêu của ta, máu bao phủ hàm của con [ROOT.Char.Custom('GetAnimalType')]. Ta có nguy cơ bị chính con [ROOT.Char.Custom('GetAnimalType')] tấn công nếu can thiệp, nhưng [activity.Custom('GetRaptorType')] rất tốn kém để thay thế..."
  hunt.8510.a:0 "Ta sẽ tự mình đánh con quái vật!"
  hunt.8510.a.success:0 "Ngươi đẩy lùi [ROOT.Char.Custom('GetAnimalType')]"
  hunt.8510.a.failure:0 "Ngươi bị [ROOT.Char.Custom('GetAnimalType')] cắn xé"
  hunt.8510.b:0 "Tốt nhất đừng can thiệp."
  hunt.8510.b.success:0 "[activity.Custom('GetRaptorType')] của ngươi thoát ra an toàn"
  hunt.8510.b.failure:0 "Ngươi phải mua con thay thế"
  hunt.8510.c:0 "Ta sẽ mua một con [activity.Custom('GetRaptorType')] tốt hơn từ bạn săn."
  hunt.8510.d:0 "Ta biết chính xác cách xử lý [ROOT.Char.Custom('GetAnimalPlural')]!"
  hunt.8520.t:0 "Mỗi Người Một Ngả"
 hunt.8520.desc.intro:0 "Chúng ta đã lần theo dấu vết của một con [activity.Custom('GetAnimalType')] qua vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] được một lúc thì ta nhận ra rằng dấu vết ấy kỳ lạ thay lại tách làm hai! Ta bắt đầu đi theo dấu bên trái, nhưng [m_hunt.GetName] kéo ta sang bên phải.\n\n"Nào nào, thưa [ROOT.Char.GetTitleAsNameNoTooltip|U], rõ ràng những dấu vết kia đã cũ rồi. Chúng ta phải theo những dấu mới hơn."\n\n"
 hunt.8520.desc.outro.obsessed:0 "[m_hunt.GetSheHe] nghĩ ta là kẻ ngu sao? Rõ ràng [m_hunt.GetSheHe] muốn dẫn ta lạc đường."
 hunt.8520.desc.outro.fallback:0 "Quan sát kỹ thì dấu vết bên trái quả thật mờ hơn một chút so với dấu bên phải."
 hunt.8520.a:0 "Ta sẽ rẽ trái."
 hunt.8520.a.success:0 "Dấu vết dẫn ngươi tiến gần hơn"
 hunt.8520.a.failure:0 "Dấu vết dẫn ngươi đến hư không"
 hunt.8520.b:0 "Ta sẽ đi theo bên phải."
 hunt.8520.b.success:0 "$hunt.8520.a.success$"
 hunt.8520.b.failure:0 "$hunt.8520.a.failure$"
 hunt.8530.t:0 "Sập Bẫy"
 hunt.8530.desc.intro:0 "Kìa! Ngoài đường chân trời, ta thấy nó rồi! Con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U]! Ta lập tức phát cuồng, lao về phía nó trước khi nó lại hóa thành sương mù trong tay ta!\n\n#EMP RẮC!#!\n\nTa thậm chí còn không cảm thấy chân mình bị kẹt giữa các tảng đá, tất cả những gì ta thấy là thế giới trước mắt chao đảo khi ta rơi xuống tới tận hông vào một cái bẫy tầm thường của bọn săn trộm! Ta vùng vẫy, nhưng chẳng có gì đủ để giải thoát chân ta."
 hunt.8530.desc.outro.obsessed:0 "Ta không thể để con quái vật chết tiệt đó thoát khỏi ta lần nữa! Có lẽ ta phải dùng đến biện pháp cực đoan..."
 hunt.8530.desc.outro.fallback:0 "Có thể ta sẽ không còn cơ hội nào khác để bắt con thú, nhưng dường như cũng không có lối thoát."
 hunt.8530.a:0 "Chắc chắn nếu ta tìm đúng góc..."
 hunt.8530.a.success:0 "Ngươi được giải thoát"
 hunt.8530.a.failure:0 "Ngươi làm tình hình tệ hơn"
 hunt.8530.b:0 ""Cứu! Cứu với!""
 hunt.8530.c:0 "Ta phải chặt bỏ cái chân chết tiệt này!"
 hunt.8540.t:1 "Con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U]: Điềm Báo"
 hunt.8540.desc.intro:1 "Ta lại mơ về con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] và cách nó trêu ngươi ta. Nó nhìn chằm chằm vào ta, rồi với một tiếng [activity.Custom('GetAnimalSoundParticiple')] vang dội, ta hét lên và tỉnh dậy giữa thế giới thực của trại săn.\n\n"
 hunt.8540.desc.mid.witch:0 "[ROOT.Char.GetFaith.WitchGodName|U] hẳn đang giao tiếp với ta qua giấc mơ, nói rằng con thú đang ở ngoài kia, và nó là con mồi dành cho ta. Ta nhìn ra ngoài cửa sổ và thấy đủ loại động vật đang nhìn về cùng một hướng."
 hunt.8540.desc.mid.orion:0 "Nhìn ra ngoài cửa sổ, chòm sao Thợ Săn tỏa sáng rực rỡ hơn bao giờ hết, như thể đang gọi ta."
 hunt.8540.desc.mid.ursa_major:1 "Nhìn ra ngoài cửa sổ, chòm sao [activity.Custom('GetAnimalType')] lấp lánh rõ ràng trên bầu trời đêm quang đãng, gọi ta tiến vào hoang dã."
 hunt.8540.desc.mid.lights:0 "Nhìn ra ngoài cửa sổ, ta thấy rõ như ban ngày những quả cầu trắng lấp lánh kéo dài vào vùng hoang dã, có lẽ đang dẫn đường cho ta tới con mồi."
 hunt.8540.desc.mid.comet:0 "Nhìn ra ngoài cửa sổ, ta kinh ngạc trước một sao chổi đang băng qua bầu trời, có lẽ đang chỉ ta tới một vị trí cụ thể trong vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]."
 hunt.8540.desc.outro:0 "\n\nTa không thể phủ nhận rằng những gì mình thấy là thật, nhưng cơ thể ta kiệt sức."
 hunt.8540.a:0 "Điều này #EMP hẳn phải#! là dấu hiệu cho ngày mai!"
 hunt.8540.a.success:0 "Ngươi giải đoán đúng dấu hiệu"
 hunt.8540.a.failure:0 "Ngươi bị dẫn đi vô ích"
 hunt.8540.b:0 "Ta không thể ngủ nữa, ta phải khởi hành sớm!"
 hunt.8540.b.success:0 "Ngươi đạt được tiến triển"
 hunt.8540.b.failure:0 "Ngươi không tìm thấy dấu vết con thú"
 hunt.8540.c:0 "Món quà từ [ROOT.Char.GetFaith.CreatorName|U]."
 hunt.8540.d:0 "Thật tuyệt đẹp, ta phải cho [intent_target_character.GetFirstNameNoTooltip] xem!"
 hunt.8550.t:0 "Phân [activity.Custom('GetLegendaryColor')|U]"
 hunt.8550.desc:0 "Ta đang tiến triển trong việc lần theo dấu con [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] huyền thoại. Dấu vết của nó dẫn ta rời khỏi con đường quen thuộc, rồi dần biến mất hoàn toàn. Tuyệt vọng tràn ngập trái tim ta, nhưng đột nhiên ta nhìn thấy thứ khiến mình nín thở.\n\nNhững bãi phân mang màu [activity.Custom('GetLegendaryColor')] thuần khiết, chưa từng thấy trước đây! Nếu chính con thú mang màu [activity.Custom('GetLegendaryColor')], thì hẳn phân của nó cũng phải có màu tương tự."
 hunt.8550.a:0 "Điều này #EMP hẳn phải#! là thật!"
 hunt.8550.a.success:0 "Phân dẫn ngươi tiến gần hơn"
 hunt.8550.a.failure:0 "Ngươi mất mọi dấu vết con thú"
 hunt.8550.b:0 "Có lẽ ta nên thử xác định chúng."
 hunt.8550.b.success:0 "Ngươi xác định đúng"
 hunt.8550.b.failure:0 "Ngươi không thể xác định"
 hunt.8550.c:0 "Đây chỉ là đánh lạc hướng, ta phải tìm thứ khác."
 hunt.8550.d:0 "Đây là phân #EMP huyền thoại#!!"
 legendary_fumes:0 "Khí Huyền Thoại"
 legendary_fumes_desc:0 "Những bãi phân này được cho là của một con [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] thần thoại."
 hunt.8560.t:0 "Mèo Lớn, Con Non"
 hunt.8560.desc:0 "Khi chúng ta lang thang trong hoang dã tìm kiếm con [activity.Custom('GetAnimalType')] chết chóc, ta nghe thấy một tiếng meo yếu ớt đáng thương từ phía bên kia. Ta lần theo âm thanh và tìm thấy một con non [activity.Custom('GetAnimalType')] nhỏ xíu, còn bé hơn cả mèo hoang bình thường, run rẩy đứng trơ trọi giữa khoảng trống.\n\n[hunt_participant.GetName|U] vội chạy tới, bế nó lên khi nó rên rừ rừ trong vòng tay [hunt_participant.GetHerHis].\n\n"Tội nghiệp quá. Bố mẹ nó hẳn đã chết hoặc lạc mất. Bảo vệ những tạo vật yếu ớt của [hunt_participant.GetFaith.CreatorNamePossessive] chẳng phải là nghĩa vụ của chúng ta sao?""
 hunt.8560.a:0 "Ta có thể dùng tiếng kêu của nó để dụ con [activity.Custom('GetAnimalType')] thật!"
 hunt.8560.b:0 "Ta sẽ chăm sóc nó."
 hunt.8560.c:0 ""Ném thứ đó về lại chỗ ngươi tìm thấy đi!""
 hunt.8570.t:0 "Dẫm Đạp!"
 hunt.8570.desc:0 "Ban đầu chỉ là một tiếng rung nhẹ, rồi chẳng mấy chốc cả thế giới bắt đầu rung chuyển, như thể [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself] đang cố xé toạc vùng [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]!\n\nKhông lâu sau, cả một biển [activity.Custom('GetAnimalPlural')] tràn ngập khoảng trống, với [stampede_victim.Custom2('MyCharacterIntroduction', ROOT.Char)] mắc kẹt ngay giữa!\n\nLũ thú dữ dường như đang tránh [stampede_victim.GetHerHim] tạm thời, nhưng nếu ta không hành động, [stampede_victim.GetSheHe] chắc chắn sẽ chết."
 hunt.8570.a:0 ""Ta tới đây!""
 hunt.8570.a.success:0 "Ngươi cứu [stampede_victim.GetHerHim] an toàn"
 hunt.8570.a.failure:0 "Ngươi cứu [stampede_victim.GetHerHim] nhưng bị thương"
 hunt.8570.a.failure_2:0 "You failed to rescue [stampede_victim.GetHerHim]"
 hunt.8570.a.crit_failure:0 "Ngươi chết khi cố cứu"
 hunt.8570.b:0 "Có lẽ ta có thể chuyển hướng đàn thú."
 hunt.8570.b.success:0 "Ngươi chuyển hướng đàn thú"
 hunt.8570.b.failure:0 "Ngươi thất bại trong việc chuyển hướng"
 hunt.8570.c:0 "Cơ hội tốt để hạ vài con tụt lại!"
 hunt.8570.c.success:0 "Ngươi bắn trúng vài phát đẹp"
 hunt.8570.c.failure:0 "Ngươi không giết được con [activity.Custom('GetAnimalType')] nào"
 hunt.8570.c.death:0 "[stampede_victim.GetName] bị giẫm chết"
 hunt.8570.c.survives:0 "[stampede_victim.GetName] sống sót"
 hunt.8570.d:0 "[stampede_victim.GetSheHe|U] có thể tự giúp [stampede_victim.GetHerselfHimself]."
 hunt.8580.t:0 "Đối Mặt"
 hunt.8580.desc:0 "Ta chỉ tách khỏi đoàn săn trong chốc lát, nhưng chừng ấy cũng đủ để một con [activity.Custom('GetAnimalType')] lạc đàn xuất hiện trên tảng đá lớn và đứng lại nhìn ta như bữa ăn kế tiếp của nó. Cổ họng ta khô khốc và tay siết chặt cây cung.\n\nMọi kinh nghiệm săn bắn đều nói rằng phải đứng yên trước [activity.Custom('GetAnimalType')] nếu muốn sống sót, nhưng trong khoảnh khắc ấy, ta chỉ là nô lệ của bản năng."
 hunt.8580.a:0 "Ta phải cố đứng yên."
 hunt.8580.a.success:0 "Con [activity.Custom('GetAnimalType')] lùi lại"
 hunt.8580.a.failure:0 "Ngươi bị con [activity.Custom('GetAnimalType')] cào xé"
 hunt.8580.b:0 "Ta có thể bắn nó."
 hunt.8580.b.success:0 "Ngươi bắn trúng con [activity.Custom('GetAnimalType')]"
 hunt.8580.b.failure:0 "$hunt.8580.a.failure$"
 hunt.8580.c:0 "Chạy và gọi giúp đỡ!"
 hunt.8580.c.success:0 "Ngươi trốn thoát"
 hunt.8580.c.failure:0 "$hunt.8580.a.failure$"
 hunt.8590.t:0 "Hang Ổ của [activity.Custom('GetAnimalPlural')|U]"
 hunt.8590.desc:0 "Khi chúng ta lên tới đỉnh đồi, đoàn săn của ta phát hiện một hang động tối tăm dường như kéo dài vô tận. Quanh lối vào là những dấu hiệu không thể nhầm lẫn của một con [activity.Custom('GetAnimalType')]!\n\nKhông nghi ngờ gì nữa, một con [activity.Custom('GetAnimalType')] hoặc thậm chí cả một bầy [activity.Custom('GetAnimalPlural')] coi nơi này là nhà! Nếu chúng ta chờ ở đây đến khi trời tối, gần như chắc chắn chúng ta sẽ tìm thấy con mồi."
 hunt.8590.a:0 "Vậy thì chúng ta sẽ chờ!"
 hunt.8590.a.success:0 "Con [activity.Custom('GetAnimalType')] trở về hang"
 hunt.8590.a.failure:0 "Con [activity.Custom('GetAnimalType')] không xuất hiện"
 hunt.8590.b:0 "Chúng ta có thể lần theo dấu từ đây."
 hunt.8590.b.success:0 "Ngươi tiến triển trong việc lần theo dấu con [activity.Custom('GetAnimalType')]"
 hunt.8590.b.failure:0 "Ngươi không thể lần theo dấu con [activity.Custom('GetAnimalType')]"

