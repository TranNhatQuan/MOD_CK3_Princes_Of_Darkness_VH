l_english:
  feast_header:0 "Yến Tiệc:"
  feast_default.1001.t:2 "Kinh Ngạc"
  feast_default.1001.very_high_learning:0 "Sau một hồi trò chuyện dài bên những món ăn tuyệt hảo, [impressed_guest.GetTitledFirstName] bày tỏ rằng [impressed_guest.GetSheHe] thấy ta vô cùng uyên bác và khôn ngoan, và rằng những lời ta nói luôn có giá trị vô cùng đối với những kẻ ít học hơn ta."
  feast_default.1001.high_learning:0 "Sau một hồi trò chuyện dài bên bữa ăn, [impressed_guest.GetTitledFirstName] bày tỏ rằng [impressed_guest.GetSheHe] ngưỡng mộ cách ta có thể thao thao bất tuyệt về bất kỳ chủ đề nào."
  feast_default.1001.average_learning:0 "Sau khi trò chuyện một lúc trong bữa tối, [impressed_guest.GetTitledFirstName] nghiêng người nói với ta rằng [impressed_guest.GetSheHe] thấy thật ấn tượng khi ta hiểu biết về rất nhiều thứ khác nhau."
  feast_default.1001.low_learning:0 "Trong khi ta đang nói chuyện với mọi người bên bàn ăn, [impressed_guest.GetTitledFirstName] nghiêng người lại. "Ta ước mình biết cách nói nghe thông minh như ngươi, [ROOT.Char.GetTitledFirstName]!"\n\nTa lau súp dính trên cằm và nở một nụ cười trông đầy trí tuệ."
  feast_default.1001.a:0 "[impressed_guest.GetSheHe|U] nhận ra trí tuệ đích thực, ta thấy vậy."

  feast_default.1002.t:1 "Chờ Đợi Không Chịu Nổi"
  feast_default.1002.desc:0 "Ta không thể tin nổi chúng ta đã phải chờ thức ăn lâu đến thế! Chúng ta đến đây để ăn, hay để ngắm vân gỗ trên chiếc bàn này? Ngươi nhìn cái gì vậy, [other_guest.GetTitledFirstName], ta chỉ là quá đói thôi!"
  feast_default.1002.a:0 "Ta cũng ngửi thấy mùi từ nhà bếp!"
  feast_default.1002.gluttons_and_impatients:0 "Mọi vị khách tham ăn và thiếu kiên nhẫn"

  feast_default.1003.t:1 "Kinh Ngạc"
  feast_default.1003.desc:0 "Sau khi ngồi ăn cạnh nhau một lúc, hẳn ta đã nói điều gì đó đặc biệt thông minh, bởi vì [other_guest.GetTitledFirstName] khen ta thật lanh lợi!\n\nĐáp lại, ta mỉm cười đầy trí tuệ với vị học giả đồng bàn của mình, trước khi bị phân tâm bởi mỡ chảy xuống cằm."
  feast_default.1003.a:0 "Đôi khi ta cũng nói ra vài điều thông minh."
  feast_default.1003.b:0 "Ta không ngờ [other_guest.GetSheHe] lại nghĩ như vậy!"

  feast_default.1004.t:1 "Khoái Lạc Thiên Đường"
  feast_default.1004.desc_exotic:0 "Ah, đây là loại thức ăn gì mà hương vị đậm đà đến vậy? Chưa bao giờ ta thấy hay nếm thử một món ngoại lai tuyệt vời đến thế! Ôi, cả những món ngọt xa hoa tuyệt diệu này nữa!\n\nBữa tiệc này có những món ăn đáng kinh ngạc mà ta chưa từng nếm trước đây và e rằng sẽ không bao giờ nếm lại! Ta phải hỏi nguồn gốc của chúng!"
  feast_default.1004.desc_lavish:0 "Thật là một biển thức ăn và món tráng miệng phong phú vô tận! Đây có phải là những bữa ăn ta có thể mong đợi ở [ROOT.Char.GetFaith.PositiveAfterLife] không? Ôi, còn cả vô vàn món ngọt!\n\nĐây hẳn là lượng thức ăn nhiều nhất ta từng thấy trong một nơi!"
  feast_default.1004.desc_meager:0 "Đây là cái gì vậy? Có chút thịt nào trên cái xương này không? Người ta thường ăn rau bé tí thế này sao? Đây có phải là những bữa ăn ta có thể mong đợi ở [ROOT.Char.GetFaith.NegativeAfterLife] không? Còn đồ ngọt đâu?\n\nĐây hẳn là cách bọn nông dân ăn!"
  feast_default.1004.desc:0 "Ah, đây là loại thịt gì mà đậm đà đến vậy? Những loại rau này là gì, gần như ngọt? Ôi, cả những món tráng miệng nhỏ tuyệt vời này nữa!\n\nBữa tiệc này có một số món ngon nhất mà ta từng nếm!"
  feast_default.1004.a:0 "Tuyệt vời!"
  feast_default.1004.a_meager:0 "Thật thảm hại!"
  feast_default.1004.b:0 "Thật đáng kinh ngạc! Đưa ta thêm một phần nữa!"
  feast_default.1004.b_meager:0 "Chỉ vậy thôi sao? Có thêm phần nữa không?"

  feast_default.1005.t:1 "Cô Lập"
  feast_default.1005.desc:0 "Quá sức chịu đựng. Tiếng huyên náo không dứt của những kẻ xung quanh ta, vô số gương mặt mong ta trò chuyện... #EMP Con người#!...\n\nTa biết bữa tiệc này sẽ là một gánh nặng, nhưng ta không ngờ quy mô của nó lại lớn đến vậy."
  feast_default.1005.desc_friendly_guest:0 "\n\nÍt ra ta cũng may mắn vì [friendly_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] có mặt ở đây."
  feast_default.1005.a:0 "Ắt phải có nơi nào đó ta có thể ở một mình."
  feast_default.1005.b:0 "[friendly_guest.GetFirstNameNoTooltip], đừng bỏ ta một mình với lũ dã thú này!"
  feast_default.1005.c:0 ""Ờ, ta... ta... Thời tiết thật đáng sợ, phải không?""

  feast_default.1006.table_companions:0 "Mọi người ngồi gần ta"
  feast_default.1006.t:1 "Như Ở Nhà"
  feast_default.1006.desc:0 "Ah, không gì sánh được với một bữa tiệc! Nó nhắc nhở tất cả chúng ta về những điều tốt đẹp trong đời, và bạn đồng bàn cũng không tệ chút nào! Ít nhất những người ngồi gần ta dường như nghĩ vậy.\n\n"Ngài thật đặc biệt, [ROOT.Char.GetFirstNameNoTooltip]," [guest_1.GetTitledFirstName] nói với ta. [guest_2.GetTitledFirstName] và [guest_3.GetTitledFirstName] gật đầu đồng tình."
  feast_default.1006.a:0 "Ta chỉ làm điều mình thấy đúng!"
  feast_default.1006.b:0 "Thêm một vòng nữa cho mọi người!"
  feast_default.1006.c:0 "Không có cách nào khác để thật sự sống, các bằng hữu!"

  feast_default.1007.t:1 "Tham Ăn"
  feast_default.1007.desc:0 "Với việc liên tục dọn lên những món ăn ngon, hầu hết khách đã bỏ cuộc với việc ăn uống trong đêm, chỉ còn tận hưởng màn giải trí. Ta vui khi thấy [other_glutton.GetTitledFirstName] hiểu rõ hơn!\n\n[other_glutton.GetSheHe|U] và ta đều háo hức nếm thử miễn là còn thức ăn!"
  feast_default.1007.a:0 "Cùng nhau chúng ta có thể ăn hết cả một con ngựa!"
  feast_default.1007.b:0 "Ta cá là ta có thể ăn nhiều hơn [other_glutton.GetHerHim]."

  feast_default.1008.t:1 "Phán Đoán Hoen Ố"
  feast_default.1008.desc:0 "Khi mắt [secret_recipient.GetTitledFirstNamePossessive] mở to trước lời ta nói, ta nhận ra mình vừa thừa nhận điều gì. Ta cố đẩy ly rượu ra xa.\n\n"Ta uống quá nhiều rồi." Ta cố đứng dậy, hơi loạng choạng. "Đừng tin một lời nào ta nói!""
  feast_default.1008.a:0 "Ta đã làm gì thế này..."
  feast_default.1008.a.flavor:0 "#F [secret_recipient.GetSheHe|U] không tin lời biện hộ của ta...#!"

  feast_default.1009.t:1 "Phán Đoán Hoen Ố"
  feast_default.1009.desc:0 "Khi mắt [secret_recipient.GetTitledFirstNamePossessive] mở to trước lời ta nói, ta nhận ra mình vừa nói gì về [secret_owner.GetTitledFirstName]. Ta cố đẩy ly rượu ra xa.\n\n"Ta uống quá nhiều rồi." Ta cố đứng dậy, hơi loạng choạng. "Đừng tin một lời nào ta nói!""
  feast_default.1009.a:0 "Ta đã làm gì thế này..."

  feast_default.1010.t:3 "Một Lời Thề Bất Ngờ"
  feast_default.1010.desc:1 "Tối qua ta đã hứa điều gì vậy? Ta không nhớ chuyện gì dẫn đến nó, nhưng ta nhớ mình đã vỗ lưng [favor_recipient.Custom2('MyCharacterIntroduction', ROOT.Char )], nói với [favor_recipient.GetHerHim] rằng ta sẽ làm bất cứ điều gì [favor_recipient.GetSheHe] yêu cầu.\n\nGiờ đây tin đồn lan khắp nơi về "lời thề" ta đã tuyên!"
  feast_default.1010.a:0 "Lời hứa vẫn là lời hứa, dù thế nào."
  feast_default.1010.b:0 "Chỉ là mấy lời say xỉn thôi!"
  feast_default.1010.every_participant_with_high_opinion:1 "Mọi người tham dự khác tôn trọng [favor_recipient.GetFirstNameNoTooltip]"

  feast_default.1011.t:1 "Trên Con Đường Chiến Tranh"
  feast_default.1011.desc:0 "Thật say mê – rượu trong máu ta, và cơn giận trong huyết quản.\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] của ta, [guest_to_murder.GetTitledFirstName], loạng choạng đụng vào ta bên ngoài đại sảnh, và ta nhầm [guest_to_murder.GetHerHim] với [disliked_guest.Custom2('InsultAdjective', ROOT.Char)] [disliked_guest.GetTitledFirstName]. Chỉ trong chớp mắt máu [guest_to_murder.GetHerHis] nhỏ xuống lưỡi dao của ta. Khi thân thể [guest_to_murder.GetHerHis] gục xuống đất, ta bỗng trở nên tỉnh táo lạ thường."
  feast_default.1011.a:0 "[guest_to_murder.GetSheHe|U] tự lao vào dao của ta! Ta thề!"
  feast_default.1011.a.success:0 "Mọi người tin đó là tai nạn"
  feast_default.1011.a.failure:0 "Mọi người không tin lời dối trá của ta"
  feast_default.1011.b:0 "Ta– ta cần lau sạch lưỡi dao...!"
  feast_default.1011.b.success:0 "Vụ giết người vẫn là bí ẩn"
  feast_default.1011.b.failure:0 "Ta bị lộ là kẻ giết người"
  feast_default.1011.c:0 "[disliked_guest.GetTitledFirstNameNoTooltip], sao ngươi có thể làm vậy?!"

  feast_default.1012.t:1 "Chất Lỏng Chết Người"
  feast_default.1012.desc_opening:0 "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] của ta, [guest_to_murder.GetTitledFirstNamePossessive], vui vẻ nhận thêm một ly nữa, che lấp tiếng nước bắn khi ta đổ đồ uống của mình xuống sàn.\n\nKhi hơi thở [guest_to_murder.GetHerHis] trở nên khó nhọc và toàn bộ sắc mặt rời khỏi gương mặt [guest_to_murder.GetHerHis], ta cảm thấy nụ cười lan rộng trên môi mình. Một tiếng cười nhỏ thoát ra khi thân thể [guest_to_murder.GetHerHis] đổ sập xuống bàn."
  feast_default.1012.a:1 "Nâng cốc vì [guest_to_murder.GetTitleTierName|U], và cơn khát cuộc đời của [guest_to_murder.GetHerHis]!"

  feast_default.1013.t:1 "Người Bảo Vệ"
  feast_default.1013.desc:0 "Khi [guest_to_kill.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_kill'))] của ta, tiến về phía [guest_to_save.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_save'))] của ta, với sự giận dữ sôi sục trong mắt và một con dao trong tay, ta thậm chí không dừng lại để suy nghĩ.\n\nTa chộp lấy thứ gần nhất có thể dùng làm vũ khí, và lao lên."
  feast_default.1013.a:0 "Ai ngờ dao nĩa lại sắc đến vậy?"
  feast_default.1013.a_1:0 "Ta hy vọng [ROOT.Char.GetFaith.NegativeAfterLife] chào đón ấm áp tên [guest_to_kill.Custom2('InsultAdjective', ROOT.Char)] [guest_to_kill.Custom2('InsultNoun', ROOT.Char)] đó."
  feast_default.1013.b:0 "Ta sẽ gạt lưỡi dao đi!"
  feast_default.1013.b.success:0 "Không ai bị thương"
  feast_default.1013.b.failure:0 "Ta #EMP suýt#! thành công"
  feast_default.1013.b.big_failure:0 "Ta thất bại"
  feast_default.1013.c:0 "...và lao thẳng đi tìm chỗ nấp."
  feast_default.1013.d:0 ""Ta hành động để bảo vệ [guest_to_save.GetFirstNameNoTooltip], các ngươi đều thấy rồi.""

  feast_default.1014.t:1 "Nhân Chứng"
  feast_default.1014.desc:0 "[guest_to_murder.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] của ta, [guest_to_murder.GetTitledFirstName], nhếch mép khi ta loạng choạng ra ngoài tìm chỗ giải quyết nhu cầu. Cơn giận vốn đã sôi sục trong huyết quản ta càng bùng lên khi [guest_to_murder.GetSheHe] tiến lại gần. "Xem ai đây này! [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('guest_to_murder'))] [ROOT.Char.GetFirstNameNoTooltip]! Ta cá ngươi—"\n\nNgay khi ta cắm lưỡi dao vào khuôn mặt đáng ghét của [guest_to_murder.GetFirstNamePossessive], ta nghe một tiếng thở hắt nhẹ phía sau."
  feast_default.1014.a:0 "Xin hãy, [witness.GetTitledFirstNameNoTooltip], đừng nói với ai!"
  feast_default.1014.a_2:0 "Ngươi sẽ không kể cho ai điều ngươi đã thấy."
  feast_default.1014.b:0 "Đúng là ở sai chỗ vào sai thời điểm!"

 #Shiny Trinkets
  feast_default.1016.t:1 "Món Đồ Lấp Lánh"
  feast_default.1016.desc_intro:0 "Ta nhìn quanh căn phòng náo nhiệt. Lửa cháy rực, rượu chảy tràn. Những món ngon được đặt vào mọi bàn tay còn trống và bầu không khí tràn đầy hứng khởi.\n\nTrong một góc tối, bắt lấy ánh lửa chập chờn, ta thấy [trinket_to_steal.GetName] lóe lên. Nó dường như bị bỏ lại trên một chiếc bàn bên và gần như đang gọi tên ta."
  feast_default.1016.desc_greedy:0 "\n\nSẽ là tội lỗi nếu ta #EMP không#! giải thoát nó khỏi sự cô độc! Ta liếc nhanh quanh phòng để chắc rằng không ai đang nhìn."
  feast_default.1016.desc_hesitant:0 "\n\nTa siết chặt nắm tay để cố vượt qua ham muốn của mình, mong rằng không ai để ý."
  feast_default.1016.desc_default:0 "\n\n[activity.GetOwner.GetTitledFirstNameNoTooltip] chắc hẳn rất giàu có, [activity.GetOwner.GetSheHe] hẳn sẽ chẳng thể nào nhớ đến món trang sức nhỏ bé này..."
  feast_default.1016.a_greedy:0 "Nếu vậy thì ta xin nhận!"
  feast_default.1016.a_hesitant:0 "Ta thật sự không cưỡng lại được..."
  feast_default.1016.a:0 "Quả thật #EMP là#! một món trang sức trông rất đẹp."
  feast_default.1016.b:0 "Không. Như vậy là sai."
  feast_default_1016_stealth.desc:0 "Hành vi trộm cắp của ngươi không bị phát hiện"
  feast_default_1016_observed.desc:0 "Có người đã nhìn thấy"
  feast_default.1016.tt:0 "Trang sức bị đánh cắp"

 #Shiny Trinkets continued - Thievery resolution
  feast_default.1017.t:1 "Điều Ẩn Trong Bóng Tối"
  feast_default.1017.desc_intro:0 "Ta từ từ tiến về phía chiếc bàn bên, vẫn giữ các cuộc trò chuyện với những vị khách ta đi ngang qua.\nKhi đã đến [new_trinket.GetName], chỉ trong một động tác ta nhanh chóng nhưng nhẹ nhàng đẩy món đồ ra mép bàn và vào chiếc khăn ăn đang chờ sẵn của mình. Thành công!"
  feast_default.1017.desc_discovered:0 "\n\nCơn adrenaline dâng trào, nhưng... ta có cảm giác bất an rằng ta không phải người duy nhất chứng kiến vụ trộm này.\n\nThời gian sẽ trả lời..."
  feast_default.1017.desc_stealth:0 "\n\nCơn adrenaline dâng trào, tiếng tim đập trong lồng ngực và vị ngọt của chiến thắng khi đạt được món đồ.\n\nTrong khoảnh khắc này, chẳng còn gì khác quan trọng."
  feast_default.1017.a:0 "Chuyện này không ổn."
  feast_default.1017.b:0 "Thật tuyệt vời!"
  feast_default.1017.b_honest:0 "Mong là không ai phát hiện..."

 #Shiny Trinkets continued - The witness confronts you via proxy
  feast_default.1018.t:1 "... Sẽ Lộ Diện"
  feast_default.1018.desc_intro:1 "Bất ngờ, một sứ giả từ [witness.GetTitledFirstName], tên là [witness_proxy.GetTitledFirstName], xuất hiện trước cửa nhà ta. "Xin chào, [ROOT.Char.Custom('FormOfAddressForLiege')]! Ta mang lời từ [witness.GetTitledFirstNameNoTooltip]."\n\nSứ giả trông hơi lúng túng: "[witness.GetTitledFirstNameNoTooltip] muốn cho ngài biết rằng [feast_host.GetTitledFirstName] đang tìm kiếm [trinket_to_steal.GetName] của [feast_host.GetHerHis] và... ", [witness_proxy.GetSheHe] dừng lại một chút, "có vẻ như [witness.Custom('MistressMaster')] của ta nghĩ rằng ngài có thể đã thấy nó trong bữa tiệc?" [witness_proxy.GetTitledFirstNameNoTooltip] nhìn ta từ đầu đến chân."
  feast_default.1018.desc_greedy:0 "\n\nSao [witness.GetTitledFirstNameNoTooltip] dám làm vậy! Móng tay cắm vào lòng bàn tay, ta cố giữ bình tĩnh trước những lời cáo buộc này."
  feast_default.1018.desc_default:1 "\n\nTim ta đập thình thịch trong tai khi mồ hôi chảy dọc sống lưng. Đây chính là cái giá phải trả cho khoảnh khắc chiếm đoạt ngọt ngào ấy."
  feast_default.1018.a:0 "Ta có một túi tiền ở đây, có lẽ..."
  feast_default.1018.a_contempt:0 "Cầm túi tiền này rồi biến đi!"
  feast_default.1018.a_tt:1 "[witness.GetTitledFirstNameNoTooltip] tốt hơn nên giữ kín chuyện này cho chính mình!"
  feast_default.1018.b:0 "Thứ cũ kỹ đó à? Chưa từng thấy."
  feast_default.1018.b_contempt:0 "Thứ đó à? Chưa. Bao. Giờ. Thấy."
  feast_default_1018_success.desc:0 "[witness.GetTitledFirstNameNoTooltip] bị thuyết phục"
  feast_default_1018_failure.desc:0 "[witness.GetTitledFirstNameNoTooltip] không bị thuyết phục"
  feast_default_1018_success.t:0 "Thuyết Phục Thành Công"
  feast_default_1018_failure.t:0 "Thuyết Phục Thất Bại"
  feast_default.1018.c:0 "Nhìn thấy à... #EMP và cả chạm tay#! vào nó!"

 #OPRHANED - Shiny Trinkets continued - You return the piece to the feast_host
  feast_default.1019.t:1 "Lời Xin Lỗi"
  feast_default.1019_start:0 "Khi ta bước vào phòng của [feast_host.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))] của ta nhìn ta với một"
  feast_default.1019.desc_intro_redeemed:0 "$feast_default.1019_start$ ánh mắt thất vọng.\n\n"Ta phải thừa nhận là không ngờ tới. Chính [feast_host.Custom2('RelationToMe', ROOT.Char)] của ta lại sa vào hành vi đáng xấu hổ như vậy... hẳn điều này đè nặng lên ngươi. Ta hoan nghênh lời thú nhận của ngươi, đó là bước đầu để trở nên tốt hơn.""
  feast_default.1019.desc_intro_condemned:0 "$feast_default.1019_start$ ánh mắt không hài lòng.\n\n"Chúng ta chưa bao giờ hợp nhau, ngươi và ta. Chính [feast_host.Custom2('RelationToMe', ROOT.Char)] của ta lại rơi vào thứ như trộm cắp vặt... thật #EMP vô cùng#! đáng xấu hổ, cũng như đáng khinh. Ngươi cần phải làm tốt hơn.""
  feast_default.1019.desc_redemption_greedy:0 "\n\nTa đóng vai trong vở kịch này, dù biết rõ lựa chọn khác sẽ tệ hơn nhiều. Ít ra lần này ta đã thoát rắc rối."
  feast_default.1019.desc_condemnation_greedy:0 "\n\nCố kiềm chế bản thân, ta nhìn xuống đất trước mặt [feast_host.GetHerHim] và gật đầu. Phải. #EMP Lần sau ta sẽ làm tốt hơn.#!"
  feast_default.1019.desc_redemption:0 "\n\nXấu hổ vì hành vi của mình, ta thực sự biết ơn trước phản ứng khoan dung của [feast_host.GetHerHis] với lời cầu xin của ta. Một gánh nặng quả thật đã được nhấc khỏi vai."
  feast_default.1019.desc_condemnation:0 "\n\nMá đỏ bừng vì xấu hổ, ta ghê tởm chính hành vi của mình. Dù điều gì đã khiến ta làm vậy, giờ ta phải chịu hậu quả."
  feast_default.1019.a:0 "... có lẽ ta nên giữ món đồ như dấu hiệu cho khuyết điểm của mình?"
  feast_default.1019.a_tt:0 "Cố giữ lại [trinket_to_steal.GetName]"
  feast_default.1019.b:0 "Ta chỉ mong nhận được sự tha thứ của ngài, thưa [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))]."
  feast_default_1019_success.desc:0 "[feast_host.GetTitledFirstNameNoTooltip] bị thuyết phục"
  feast_default_1019_failure.desc:0 "[feast_host.GetTitledFirstNameNoTooltip] không bị thuyết phục"
  feast_default_1019_redeemed.t:0 "Được Tha Thứ"
  feast_default_1019_condemned.t:0 "Bị Lên Án"

 #Dislike the host, deface a displayed Court Artifact
  feast_default.1020.t:1 "Tai Nạn"
  feast_default.1020.desc:0 "Khi ta thong thả đi dạo trong đại sảnh của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))] đáng ghét của ta, [feast_host.GetTitledFirstNameNoTooltip], ta xem xét bộ sưu tập hiện vật trưng bày của [feast_host.GetHerHis]. Thật phô trương — có lẽ [feast_host.GetSheHe] nên bị hạ bớt kiêu ngạo...\n\nÁnh mắt ta dừng lại ở [feast_target_artifact.GetName]."
  feast_default.1020.a_knock_over:0 "Có lẽ ta sẽ #EMP vô tình#! làm nó rơi..."
  feast_default.1020.a_scratch:0 "Ta sẽ cào xước nó thật kỹ..."
  feast_default.1020.a_drunkard:0 "Ta có thể đổ [ROOT.Char.Custom('RegionalDrink')] của mình lên khắp nó..."
  feast_default.1020.a_lustful:0 "Ta #EMP rất#! muốn phá hoại nó hoàn toàn..."
  feast_default.1020.a.tt_success:0 "Ngươi phá hoại hiện vật mà không bị phát hiện"
  feast_default.1020.a.tt_fined:0 "[feast_host.GetTitledFirstNameNoTooltip] phạt tiền ngươi vì hành động đó"
  feast_default.1020.a.tt_imprisoned:0 "[feast_host.GetTitledFirstNameNoTooltip] trả đũa"
  feast_default.1020.b:0 "Không, tốt hơn ta không nên mạo hiểm."
  feast_default.1020.tt:0 "Hiện Vật Bị Phá Hoại"
  GUESTS_LIKED_DEFACING:0 "#z [CHARACTER.MakeScope.Var('num_unhappy_guests').GetValue|0]#! khách hài lòng với hành động này:"
  feast_default.1020.tt_guests: "#z [THIS.Var('num_unhappy_guests').GetValue|0]#! khách hài lòng với hành động này và tăng thiện cảm với ngươi"

  feast_default.1030.t:0 "Anh Hùng Thời Đại Chúng Ta"
  feast_default.1030.desc:0 "Một động tác điệu nghệ kết thúc bài ngâm thơ đầy đam mê của [minstrel.GetFirstNamePossessive]. Mắt đã khô, bàn đã được đập mạnh.\n\n\"Một câu chuyện nữa!\" [minstrel.GetSheHe] đề nghị. \"Ta sẽ hát về việc $knight_culture_player_no_tooltip_lowercase$ vĩ đại [knight_1.GetFirstName] đã làm như thế nào\""
  feast_default.1030.ethical:0 "cao quý bảo vệ kẻ yếu?"
  feast_default.1030.amoral:0 "tàn sát kẻ thù đủ loại?"
  feast_default.1030.leader:0 "dẫn dắt đồng đội vượt qua hiểm nguy?"
  feast_default.1030.morally_neutral:0 "lần đầu chứng minh đức hạnh của [knight_1.GetHerHis]?"
  feast_default.1030.aggressive:0 "Hay [knight_2.GetFirstName] xông pha không thể ngăn cản?"
  feast_default.1030.defensive:0 "Hay [knight_2.GetFirstName] đứng vững như núi?"
  feast_default.1030.champion:0 "Hay [knight_2.GetFirstName] giành chiến thắng một mình?"
  feast_default.1030.stance_neutral:0 "Hay [knight_2.GetFirstName] khôi phục danh tiếng bị lãng quên của [knight_2.GetHerHis]?"

  feast_default.1030.subtle:0 "Người khôn ngoan nhất trong [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
  feast_default.1030.forceful:0 "Người mạnh mẽ nhất trong [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
  feast_default.1030.equestrian:0 "Kỵ sĩ [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
  feast_default.1030.intensity_neutral:0 "Người xuất sắc nhất trong [knight_3.GetCulture.GetCollectiveNounNoTooltip], [knight_3.GetFirstName]?"
  feast_default.1030.courtly:0 "[knight_4.GetFirstName] và những tình bằng hữu chân thành của [knight_4.GetHerHis]?"
  feast_default.1030.militant:0 "[knight_4.GetFirstName] và những trận chiến [knight_4.GetHerHis] đã thắng?"
  feast_default.1030.fighty_neutral:0 "[knight_4.GetFirstName] và những lời thề danh dự của [knight_4.GetHerHis]?"
  feast_default.1030.wrap_up:0 "Những chiến binh này sánh ngang với các anh hùng xưa!"\n\nChắc chắn rằng khi những nghệ sĩ của bữa tiệc này rong ruổi tới các triều đình khác, câu chuyện ta yêu thích sẽ còn được kể lại nhiều lần."

  feast_default.1030.a:0 "[knight_1.GetFirstNameNoTooltip], [accolade_1.GetNameNoTooltip]!"
  feast_default.1030.a.tt:0 "Những câu chuyện kể lại sẽ truyền cảm hứng cho tất cả, từ người hầu thấp kém nhất đến những $knight_culture_player_plural_no_tooltip_lowercase$ vĩ đại."
  feast_default.1030.b:0 "[knight_2.GetFirstNameNoTooltip], [accolade_2.GetNameNoTooltip]!"
  feast_default.1030.b.tt:0 "Họ sẽ nói rằng [knight_2.GetSheHe] không thể bị đánh bại!"
  feast_default.1030.c:0 "[knight_3.GetFirstNameNoTooltip], [accolade_3.GetNameNoTooltip]!"
  feast_default.1030.c.tt:0 "Tất cả sẽ biết [knight_3.GetHerHim] ngang hàng với bất kỳ anh hùng cổ xưa nào."
  feast_default.1030.d:0 "[knight_4.GetFirstNameNoTooltip], [accolade_4.GetNameNoTooltip]!"
  feast_default.1030.d.tt:0 "Một người thực hiện chiến công ngày càng nổi tiếng... thật và cả không thật."

  knightly_tales_modifier:0 "Hiệp Sĩ Trong Khúc Ca"
  knightly_tales_modifier_desc:0 "Các hiệp sĩ của nhân vật này truyền cảm hứng cho những câu chuyện phổ biến, nâng cao địa vị của toàn bộ tầng lớp của họ."

  riders_of_song_modifier:0 "Kỵ Sĩ Của Khúc Ca"
  riders_of_song_modifier_desc:0 "Cả những tân binh trẻ tuổi lẫn những kỵ sĩ dày dạn đều khao khát xông trận bên cạnh các hiệp sĩ của nhân vật này."

  tales_of_knightly_valor_modifier:0 "Truyền Thuyết Về Lòng Dũng Cảm Hiệp Sĩ"
  tales_of_knightly_valor_modifier_desc:0 "Những kẻ đầy tham vọng, có khi chẳng hơn gì kẻ lang thang, cầu xin được phục vụ cùng các hiệp sĩ của nhân vật này."

  tales_of_knightly_leadership_modifier:0 "Truyền Thuyết Về Lãnh Đạo Hiệp Sĩ"
  tales_of_knightly_leadership_modifier_desc:0 "Được phục vụ dưới quyền uy khôn ngoan của các hiệp sĩ của nhân vật này được xem là một vinh dự."

#feared by all enemies

 feast_default.2001.t:1 "Sự Nôn Nóng Đáng Xấu Hổ"
 feast_default.2001.desc:0 "[host.GetTitledFirstName] tuyên bố việc dọn thức ăn sẽ hơi chậm trễ, và [glutton.GetTitledFirstName] trông như sắp nổ tung vì bực bội!\n\nGiữa những tiếng cồn cào từ bụng của [glutton.GetHerHis], ta chỉ nghe thấy những lời càu nhàu khó chịu."
 feast_default.2001.a:0 "[glutton.GetSheHe|U] đang tự biến [glutton.GetHerselfHimself] thành kẻ ngốc."
 feast_default.2001.b:0 "[glutton.GetFirstNameNoTooltip] nói cũng có lý! Thức ăn của chúng ta đâu?!"

 feast_default.2002.t:1 "Một Kẻ Ngưỡng Mộ"
 feast_default.2002.desc:0 "Một kẻ nào đó không lộ diện đã lén nhét cho ta một mảnh giấy trong bữa tiệc:\n\n\"[letterAuthor.Custom2('love_letter', SCOPE.sC('letterRecipient'))]\"\n\nBức thư dịu dàng này rốt cuộc là của ai? Có điều gì đó trong cách [crush_1.GetTitledFirstName] nhìn ta đầy bẽn lẽn. Hoặc nụ cười của [crush_2.GetTitledFirstName] khi chúng ta chạm mặt. Nhưng rồi, [crush_3.GetTitledFirstName] dường như cũng rất háo hức muốn ngồi gần ta..."
 feast_default.2002.a:0 "Ắt hẳn là [crush_1.GetFirstNameNoTooltip]!"
 feast_default.2002.b:0 "Có thể là [crush_2.GetFirstNameNoTooltip] chăng?"
 feast_default.2002.c:0 "Chuyện này rõ ràng là của [crush_3.GetFirstNameNoTooltip]."
 feast_default.2002.potential_lover_tt:0 "Nếu đoán đúng, việc khiến họ trở thành [lover|E] của ngươi sẽ dễ dàng hơn nhiều"

 feast_default.2003.t:1 "Tâm Ý Tương Đồng"
 feast_default.2003.desc:0 "Điều khởi đầu chỉ là một bữa tiệc bình thường đã trở nên đặc biệt nhờ sự hiện diện của [other_guest.GetTitledFirstName]!\n\nChúng ta trò chuyện suốt cả buổi tối về đủ mọi chuyện, và hóa ra giữa chúng ta có rất nhiều điểm chung! Ta đã có khoảng thời gian thật tuyệt cùng [other_guest.GetHerHim]."
 feast_default.2003.a:0 "Thật là một buổi tối tuyệt vời!"

 feast_default.2005.t:1 "Dây Bẩn Cả [ROOT.Char.Custom('GetClothingArticle')|U] Mới Của Ta"
 feast_default.2005.desc:0 "Tất cả chúng ta đều nhận ra [drunk.GetTitledFirstName] đã uống quá chén, mặc dù [drunk.GetSheHe] khăng khăng cho chúng ta thấy [drunk.GetSheHe] tỉnh táo đến mức nào.\n\nChỉ riêng việc đứng dậy khỏi chỗ ngồi của [drunk.GetHerHis] đã là quá sức đối với [drunk.GetHerHim], và giờ ta đang bị bắn đầy những bãi nôn mửa hôi thối!"
 feast_default.2005.a:0 "\"Ngươi nên thấy xấu hổ về bản thân, [drunk.GetFirstNameNoTooltip]!\""
 feast_default.2005.b:0 "\"Ha! Ngươi diễn cũng ra trò đấy!\""

 feast_default.2006.t:2 "[befriending_guest.GetTitleTierName|U] Quá Nhiệt Tình"
 feast_default.2006.desc:0 "Khi [befriending_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] lại một lần nữa chen ngang cuộc trò chuyện bằng tiếng cười lớn, ta không thể phủ nhận rằng [befriending_guest.GetSheHe] đang hành xử thật kỳ lạ.\n\n[befriending_guest.GetSheHe|U] chưa từng rời xa ta, tham gia mọi cuộc trò chuyện của ta, và tỏ ra tán thưởng mọi điều ta nói..."
 feast_default.2006.a:0 "Đó là cách lạ lùng để lấy lòng ta, nhưng phải nói là có hiệu quả."
 feast_default.2006.b:0 "Ta có thể quen với chuyện này!"
 feast_default.2006.c:0 "Ta không chịu nổi việc có kẻ cứ bám theo mình thế này!"
 feast_default.2006.d:0 "Làm ơn, hãy để ta yên!"

 feast_default.2007.t:1 "Chuyện Tình Bại Lộ!"
 feast_default.2007.desc:0 "Một tiếng động lớn vang lên khắp đại sảnh khi cánh cửa dẫn tới phòng của gia nhân bị bật tung.\n\nTrong tình trạng gần như không mảnh vải che thân, [lover_guest_1.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_1') )] của ta — và [lover_guest_2.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_2') )] của ta — ngã nhào ra sàn trước mặt mọi người."
 feast_default.2007.a_chaste:0 "Ta không dám nhìn!"
 feast_default.2007.a_lustful:0 "Chỉ cần #EMP tưởng tượng#! xem họ đã làm gì..."
 feast_default.2007.a_sadistic:0 "Ha! Thật là thú vị!"
 feast_default.2007.a_compassionate:0 "Không ai đáng phải chịu nỗi nhục này..."
 feast_default.2007.b:0 "Không ngờ rằng #EMP họ#! lại có bí mật như vậy!"

 feast_default.2008.t:1 "Sau Cánh Cửa Khóa"
 feast_default.2008.desc:1 "Khi [homosexual_character.Custom2('MyCharacterIntroduction', ROOT.Char )] cố lén rời khỏi bữa tiệc mà không ai để ý, ta thoáng thấy bàn tay của [homosexual_character.GetHerHis] lén nắm lấy tay một gia nhân [romance_target.Custom('FemaleMale')]!\n\nNghi ngờ của ta được xác nhận khi ta bắt gặp họ trong một căn phòng vắng, cả hai đều gần như cởi dở!"
 feast_default.2008.a:0 "Tư thông với một [homosexual_character.GetWomanMan] khác?! Thiên hạ phải biết chuyện này!"
 feast_default.2008.b:0 "Bí mật của ngươi an toàn với ta, [homosexual_character.GetFirstNameNoTooltip]. Tạm thời."
 feast_default.2008.c:0 "Dám làm bại hoại #EMP gia nhân của ta#! mà không có sự cho phép của ta?!"
 feast_default.2008.d:0 "Ôi [homosexual_character.GetFirstNameNoTooltip], giá như ta biết sớm hơn."
 feast_default.2008.d.unlock_text:0 "Lựa chọn này khả dụng nhờ [sexuality|E] của ngươi"

 feast_default.2009.t:1 "Xin Cứ Nói Tiếp"
 feast_default.2009.desc:1 "Ta lắng nghe chăm chú [secret_holder.GetTitledFirstName] khi [secret_holder.GetSheHe] bất cẩn tiết lộ đủ mọi thứ. Bị phân tâm bởi việc cố gắng vét nốt giọt cuối cùng từ cốc của [secret_holder.GetHerHis], [secret_holder.GetSheHe] không hề hay biết ta đang chú ý kỹ đến thế nào.\n\nMột khi [secret_holder.GetSheHe] nhận ra, [secret_holder.GetSheHe] bắt đầu đứng dậy. \"Ta chỉ đang lảm nhảm thôi! Chẳng có gì là thật cả, không có gì hết!\""
 feast_default.2009.a:0 "Ồ, nhưng những lời lảm nhảm đó lại #EMP rất#! thú vị."

 feast_default.2011.t:2 "Lời Hứa Là Lời Hứa"
 feast_default.2011.desc:0 "Không chút bận tâm đến lễ nghi, [favor_character.Custom2('MyCharacterIntroduction', ROOT.Char )] vỗ mạnh vào lưng ta. \"Ta nói thật đấy!\" [favor_character.GetSheHe] kêu lên. \"Ta sẽ làm bất cứ điều gì ngươi yêu cầu. Bất cứ điều gì. Chỉ cần nói, và ta sẽ làm!\"\n\nTa có thể ngửi thấy mùi rượu trong hơi thở của [favor_character.GetFirstNamePossessive], nhưng lời hứa ấy đã được mọi vị khách có mặt nghe thấy."
 feast_default.2011.a:0 "Ngươi là một [favor_character.GetWomanMan] giữ lời, phải không?"
 feast_default.2011.b:0 "\"Hah, [favor_character.GetTitledFirstNameNoTooltip] quá say để biết [favor_character.GetSheHe] đang nói gì rồi!\""

 feast_default.2012.t:1 "Nhân Chứng"
 feast_default.2012.desc:0 "Khi ta loạng choạng bước ra ngoài để tìm chỗ giải quyết nỗi buồn, ta nghe thấy tiếng la hét quanh góc tường. Khi rẽ vào, ta thấy [murderer.GetTitledFirstName] - [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] của ta - nhếch mép khi [murderer.GetSheHe] cắm thanh kiếm của [murderer.GetHerHis] vào mặt [murdered_guest.GetTitledFirstName] đang co rúm.\n\nBất cứ âm thanh nào ta tạo ra hẳn phải đủ lớn, vì [murderer.GetFirstName] quay về phía ta, vẻ ngạc nhiên hiện rõ trên khuôn mặt [murderer.GetHerHis]."
 feast_default.2012.a:0 "Ngươi đã #EMP làm gì#! vậy?!"
 feast_default.2012.b:0 "Tội ác của ngươi sẽ bị mọi người biết đến!"
 feast_default.2012.c:0 "Sự im lặng của ta có giá của nó."

 feast_default.2013.t:1 "Kẻ Nịnh Bợ"
 feast_default.2013.desc:0 "Những tin đồn rằng [bootlicker.GetTitledFirstName] muốn lấy lòng [shared_liege.GetTitledFirstName] đã được chứng thực khi [bootlicker.GetSheHe] trao cho [shared_liege.GetHerHim] một món quà.\n\n\"[bootlicker.Custom2('RelationToMeShort', SCOPE.sC('shared_liege'))] thân mến của ta, thật vui khi được gặp ngài! Biết rằng chúng ta sẽ gặp nhau tại đây, ta đã mang theo tấm da thú tuyệt vời này như một dấu hiệu bày tỏ lòng kính trọng.\"\n\n[shared_liege.GetTitledFirstName] mỉm cười khi [shared_liege.GetSheHe] ngắm nghía tấm da. Thấy [shared_liege.GetSheHe] vui vẻ vì món quà, ta nhận ra mình có thể bỏ lỡ cơ hội cải thiện vị thế trước [shared_liege.GetHerHim]!"
 feast_default.2013.a:0 "\"[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shared_liege'))] của ta! Ta cũng có một món quà dành cho ngài!\""
 feast_default.2013.a.success:0 "[shared_liege.GetTitledFirstName] ấn tượng với món quà ngẫu hứng của ngươi"
 feast_default.2013.a.failure:0 "[shared_liege.GetTitledFirstName] không mấy ấn tượng với món quà ngẫu hứng của ngươi"
 feast_default.2013.b:0 "\"#EMP Ahem!#! Ta xin nâng chén chúc mừng [shared_liege.GetTitledFirstNameNoTooltip]!\""
 feast_default.2013.b.success:0 "[shared_liege.GetTitledFirstName] ấn tượng với lời nâng chén ngẫu hứng của ngươi"
 feast_default.2013.b.failure:0 "[shared_liege.GetTitledFirstName] không ấn tượng với lời nâng chén của ngươi"
 feast_default.2013.c:0 "Làm đổ rượu lên tấm da được tặng rồi nói đó chỉ là tai nạn."
 feast_default.2013.c.success:0 "Mọi người tin rằng đó chỉ là tai nạn"
 feast_default.2013.c.failure:0 "Không ai tin đó là tai nạn"
 feast_default.2013.d:0 "Không cần vội. Ta sẽ nghĩ cách khác sau."

 feast_default.3001.t:1 "Bữa Tiệc Với Một Bằng Hữu"
 feast_default.3001.desc:0 "Thật vui khi được gặp lại [friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char )]! Một lần nữa chúng ta cùng ăn, uống và ca hát như thể chưa từng có thời gian chia cách.\n\nDù cho chúng ta có đang ăn trong một cái chuồng bò, đây vẫn sẽ là một trong những bữa tiệc tuyệt vời nhất ta từng dự."
 feast_default.3001.a:0 "À, cuộc đời sẽ ra sao nếu thiếu [friend.GetFirstNameNoTooltip]?"

 feast_default.3002.t:1 "Những Nụ Hôn Lén Lút"
 feast_default.3002.desc:0 "[lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )] của ta. Chúng ta mỉm cười và chào hỏi nhau như thể chưa từng thân mật. Như thể chưa từng ôm nhau trong cơn say đắm. Như thể không khao khát được gần nhau.\n\nKhi sau đó chúng ta lướt qua nhau trong một hành lang vắng, ta lại được cảm nhận đôi môi của [lover.GetHerHis] trên môi mình. Rồi [lover.GetSheHe] chỉ về một cánh cửa tối chưa thắp đèn..."
 feast_default.3002.a:0 "Đi thôi! Chúng ta không có thời gian để lãng phí!"
 feast_default.3002.discovery_tt:0 "#F Gia nhân nhìn thấy rất nhiều, và họ có thể buôn chuyện...#!"
 feast_default.3002.b:0 "Không, chúng ta có thể bị phát hiện."

 feast_default.3003.t:1 "Bạn Đồng Hành Khó Chịu"
 feast_default.3003.desc:1 "Bữa tiệc đang rất dễ chịu, nhưng rồi #EMP [rival.GetSheHe]#! xuất hiện. Ta chẳng thể có nổi một buổi tối yên bình mà không bị vấy bẩn bởi mùi khó chịu của [rival.GetTitledFirstNameNoTooltip] sao?\n\nTệ nhất là giọng nói the thé của [rival.GetHerHis] khi [rival.GetSheHe] lân la lại gần ta. \"Sao mặt mày khó chịu thế, [ROOT.Char.GetFirstNameNoTooltip]?\""
 feast_default.3003.a:0 "[rival.GetSheHe|U] khiến ta chỉ muốn đấm thẳng vào mặt [rival.GetHerHim]!"

 feast_default.3004.t:1 "Cuộc Cãi Vã Xúc Phạm"
 feast_default.3004.desc:0 "Sau khi tiêu thụ vô số thức ăn và đồ uống, ta tìm thấy [rival_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] giữa một cuộc trò chuyện ồn ào. [rival_guest.GetSheHe|U] quay lại nhìn ta ngay khi [rival_guest.GetSheHe] nhận ra sự hiện diện của ta.\n\n\"Và #EMP ngươi#! – sự hiện diện đơn thuần của ngươi làm vấy bẩn buổi tối này!\""
 feast_default.3004.a:0 "Ta nghĩ ngươi đã uống quá đủ cho tối nay rồi."
 feast_default.3004.b:0 "Ngươi chỉ là một [rival_guest.Custom2('InsultAdjective', ROOT.Char)] [rival_guest.Custom2('InsultNoun', ROOT.Char)]!"
 feast_default.3004.b.success:0 "Ngươi thắng cuộc ẩu đả"
 feast_default.3004.b.failure:0 "[rival_guest.GetFirstNameNoTooltip] thắng cuộc ẩu đả"
 feast_default.3004.c:0 "Có kẻ mang niềm vui đến bất cứ nơi nào họ đi; kẻ khác thì chỉ mang niềm vui khi họ rời đi."
 feast_default.3004.c.tt:0 "#F Đã đến lúc [rival_guest.GetFirstNameNoTooltip] mang niềm vui đi nơi khác#!"
 feast_default.3004.d:0 "Một cú đấm vào mặt cũng là câu trả lời thích đáng!"

 feast_default.3005.t:1 "Một Lời Thách Đấu"
 feast_default.3005.desc:0 "Hội trường vang vọng tiếng cười của [rival_to_duel.GetTitledFirstName] - [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_to_duel'))] của ta, cùng với những lời chế nhạo và lăng mạ của [rival_to_duel.GetHerHis] — khi [rival_to_duel.GetSheHe] gọi ta là [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('rival_to_duel'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_to_duel'))], ta rút kiếm."
 feast_default.3005.desc_won:0 "\n\nTa lấy lại bình tĩnh khi cúi xuống nhìn [rival_to_duel.GetHerHim], chiếc ủng đặt trên ngực [rival_to_duel.GetHerHis], cả hai chúng ta đều thở dốc."
 feast_default.3005.desc_lost:0 "\n\nTa tỉnh lại khi [rival_to_duel.GetSheHe] cúi xuống nhìn ta, chiếc ủng đè lên ngực ta. [rival_to_duel.GetSheHe|U] rít bên tai ta: \"Ta muốn nghe ngươi cầu xin tha mạng.\""
 feast_default.3005.a:0 "\"Ngươi sẽ phải trả giá cho tất cả những gì đã làm.\""
 feast_default.3005.b:0 "\"Ta thà chết chứ không chịu khuất phục trước hạng #EMP như ngươi#!\""
 feast_default.3005.c:0 "\"Xin đừng làm hại ta!\""
 feast_default.3005.d:0 "\"Ta muốn nghe ngươi cầu xin tha mạng.\""
 feast_default.3005.e:0 "Ta vươn tay lên và cắt đứt gân Achilles của [rival_to_duel.GetHerHis] chỉ bằng một nhát gọn gàng."

 feast_default.3096.t:0 "Một Khả Năng Mới"
 feast_default.3096.desc:0 "Khi buổi tiệc tiếp diễn, ta không khỏi nhận ra mình liên tục trao đổi ánh nhìn với [partner.GetName].\n\nTa là một [ROOT.Char.GetWomanMan] danh dự, nhưng hiếm khi nào ta cảm thấy bị cám dỗ muốn thử một mối quan hệ mới đến vậy..."
 feast_default.3096.a:0 "Hãy xem buổi tối sẽ đưa chúng ta đến đâu"
 fest_default.3906.a.tt:0 "Ngươi nằm cùng [partner.GetName]"
 feast_default.3096.b:0 "Ta không thể làm vậy."

 feast_default.3006.t:1 "Một Đêm Duy Nhất"
 feast_default.3006.opening_1:0 "Bị men rượu và dục vọng cuốn lấy, [partner.Custom2('MyCharacterIntroduction', ROOT.Char )] và ta thấy mình ở riêng cùng nhau. Cánh tay [partner.GetHerHis|U] ôm lấy ta, đôi môi [partner.GetHerHis] áp vào cổ ta, chúng ta dập tắt ngọn lửa đang cháy trong lồng ngực và nơi dục vọng của mình."
 feast_default.3006.opening_2:1 "Ta tỉnh dậy trên một chiếc giường xa lạ, với một bạn giường ngoài dự liệu. Ký ức của đêm qua dần dần hiện rõ từ màn sương đau nhức trong đầu ta. Ta và [partner.Custom2('MyCharacterIntroduction', ROOT.Char )|U], bị ham muốn ràng buộc với nhau."
 feast_default.3006.opening_3:0 "Ta đã từng khăng khăng rằng đây chính là điều ta tuyệt đối sẽ không làm. Thế nhưng chỉ sau vài chén rượu, ta lại dễ dàng ngã vào vòng tay của [partner.Custom2('MyCharacterIntroduction', ROOT.Char )] – mắc kẹt trong tấm lưới quyến rũ của [partner.GetHerHis]. Chẳng bao lâu sau ta đã nằm trên giường của [partner.GetHerHis]."
 feast_default.3006.both_married_love:1 "\n\nTa không thể chịu nổi ý nghĩ phải rời xa [partner.GetHerHim], nhưng [partner.GetHerHis] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] tuyệt đối không được biết, và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] của ta cũng vậy!"
 feast_default.3006.married_love:1 "\n\nTa không thể chịu nổi ý nghĩ phải sống thiếu [partner.GetHerHim], nhưng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] của ta không được phép biết chuyện đã xảy ra ở đây."
 feast_default.3006.partner_married_love:1 "\n\nTa không thể chịu nổi ý nghĩ phải sống thiếu [partner.GetHerHim], nhưng xét đến [partner.GetHerHis] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))], [partner.GetTitledFirstName], ta còn có thể làm gì?"
 feast_default.3006.unmarried_love:0 "\n\nNgoài khuôn phép hôn nhân và lễ giáo, chúng ta không thể để thế gian biết chuyện đã xảy ra ở đây. Thế nhưng ta cũng không thể chịu nổi ý nghĩ phải xa [partner.GetHerHim] dù chỉ một ngày."
 feast_default.3006.both_married:1 "\n\n[partner.GetHerHis|U] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] không được phép biết, chưa kể đến [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] của chính ta!"
 feast_default.3006.married:1 "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] của ta tuyệt đối không được biết về sự phản bội này."
 feast_default.3006.partner_married:1 "\n\n[partner.GetHerHis|u] [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] không được phép biết chuyện đã xảy ra ở đây."
 feast_default.3006.unmarried:0 "\n\nNgoài khuôn phép hôn nhân và lễ giáo, chúng ta không thể để thế gian biết chuyện đã xảy ra ở đây."
 feast_default.3006.a:0 "Ta phải gặp lại ngươi!"
 feast_default.3006.b:0 "Hãy tận hưởng khoảnh khắc này..."
 feast_default.3006.b.mistake_tt:0 "#F [partner.GetFirstNameNoTooltip] không hề có hứng thú#!"
 feast_default.3006.c:0 "Hãy coi như chuyện này chưa từng xảy ra."
 feast_default.3006.c.tt:1 "#F Ngươi tránh xa [partner.GetFirstNameNoTooltip]#!"

 feast_default.3007.t:1 "Bị Bắt Quả Tang"
 feast_default.3007.love:0 "Khi các vị khách khác đang say mềm trong men rượu, ta và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của ta tìm được một căn phòng để ở riêng qua đêm. Ta đang rải những nụ hôn lên tấm lưng trần của [lover.GetFirstNamePossessive] thì một giọng nói khiến ta vội vã che thân."
 feast_default.3007.not_love:0 "Ta dẫn [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của mình, [lover.GetTitledFirstName], đến một căn phòng bỏ hoang để tránh đám đông. Ta đang giữa lúc thỏa mãn cơn khát dục thì một giọng nói quen thuộc khiến máu trong người đông cứng."
 feast_default.3007.ambiguous:0 "Hy vọng có thể dành chút thời gian với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] của mình, ta đưa [lover.GetTitledFirstName] rời khỏi bữa tiệc. Ngay khi ta chuẩn bị quay lại, một giọng nói quen thuộc khiến ta chết sững."
 feast_default.3007.end:0 "\n\n\"[ROOT.Char.GetFirstNameNoTooltip]?!\" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta, [spouse.GetTitledFirstName], đang nhìn chúng ta với vẻ kinh hoàng. \"Sao ngươi có thể lên giường với thứ [lover.Custom2('InsultAdjective', SCOPE.sC('spouse'))] [lover.Custom2('InsultNounSexual', SCOPE.sC('spouse'))] đó?!\""
 feast_default.3007.a:0 "Chuyện này chẳng có ý nghĩa gì cả, ái khanh!"
 feast_default.3007.b:0 "Ta yêu [lover.GetHerHim]!"
 feast_default.3007.c:0 "Ta làm điều ta muốn."

 feast_default.5001.t:1 "Nụ Cười Méo Móc"
 feast_default.5001.friend_reminder:0 "Ta tin rằng [friend.GetTitledFirstName] chỉ nói như một lời cảnh báo, nhưng sau khi [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend'))] của ta nhắc đến danh tiếng đáng sợ của [host.GetTitledFirstNamePossessive], ta chẳng thể nghĩ đến điều gì khác."
 feast_default.5001.rival_reminder:0 "Ta biết [rival.GetTitledFirstName] chỉ nói vậy để khiến ta lo lắng, nhưng giờ khi [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('rival'))] của ta nhắc đến danh tiếng đáng sợ của [host.GetTitledFirstNamePossessive], ta chẳng thể nghĩ đến điều gì khác."
 feast_default.5001.spouse_reminder:0 "Chạm nhẹ vào tay ta để thu hút sự chú ý, [spouse.GetTitledFirstName] nói bằng giọng trầm đầy lo lắng. \"[host.GetTitledFirstName] đã nhìn ngươi khá nhiều tối nay...\"\nXét đến danh tiếng của [spouse.GetTitledFirstNamePossessive], ta gần như ước gì [spouse.GetSheHe] đừng nói gì cả."
 feast_default.5001.sadist_reminder:1 "[sadist.GetTitledFirstName] kể lại vài câu chuyện đáng sợ về cách... ngoại giao của [host.GetTitledFirstNamePossessive] với một nụ cười khiến người ta rợn gáy. Ta không nên để tâm đến chuyện đó, nhưng giờ thật khó nghĩ đến điều gì khác."
 feast_default.5001.reminder:0 "Dù bữa tiệc là dịp của niềm vui và ăn mừng, thật khó để không nghĩ đến danh tiếng đáng sợ của [host.GetTitledFirstNamePossessive]..."
 feast_default.5001.worry:0 "\n\nMỗi nụ cười của chủ tiệc giờ trông rộng quá mức, và mỗi tràng cười bất chợt khiến ta giật mình, lo sợ rằng ai đó đã khiến [host.GetHerHis] nổi giận chỉ vì một xúc phạm nhỏ. Hoặc tệ hơn, kẻ đó chính là ta."
 feast_default.5001.a:0 "Ta sẽ vượt qua được. Đây chỉ là một bữa tiệc."

 feast_default.5002.t:1 "Ảo Tưởng"
 feast_default.5002.desc_chair:0 "Chủ tiệc của chúng ta, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] của ta là [lunatic_host.GetTitledFirstName], cúi xuống để trò chuyện với chiếc ghế bên cạnh [lunatic_host.GetHerHim]. Trước cảnh tượng đó, mọi cuộc trò chuyện khác nhanh chóng lắng xuống.\n\n\"Ngài vừa nói gì vậy, [ROOT.Char.Custom('RandomLadyLord')] tốt bụng của ta? Phải rồi, dĩ nhiên, ta tin ngài hơn bất cứ ai ở đây!\""
 feast_default.5002.desc_chicken:0 "Chủ tiệc của chúng ta, [lunatic_host.GetTitledFirstName] - [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] của ta, nhẹ nhàng ôm một con gà đã vặt lông — và đã nấu chín — vào ngực của [lunatic_host.GetHerHis], thì thầm những lời ngọt ngào với nó. Khi [lunatic_host.GetSheHe] bắt đầu lớn tiếng tuyên bố tình cảm của [lunatic_host.GetHerHis] dành cho con gia cầm, tâm trạng trong đại sảnh nhanh chóng chuyển sang hướng rắc rối."
 feast_default.5002.desc_drapes:0 "Chủ tiệc của chúng ta, [lunatic_host.GetTitledFirstName] - [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('lunatic_host'))] của ta, sà vào sàn nhảy, trên tay ôm một trong những tấm biểu ngữ dùng để trang trí tường của [lunatic_host.GetHerHis].\n\nCác vị khách không thể làm gì khác ngoài việc đứng nhìn khi hắn dẫn dắt mảnh vải đó qua một điệu nhảy công phu, say mê bởi màn trình diễn này."
 feast_default.5002.a:0 "[lunatic_host.GetLadyLord] của ta, hay chúng ta ra ngoài hít chút không khí?"
 feast_default.5002.b:0 "Ta phải chấm dứt sự điên rồ này!"
 feast_default.5002.c:0 "[lunatic_host.GetFirstNameNoTooltip]! Hãy để ta tham gia cùng hai người!"

 feast_default.5003.t:1 "Trò Tiêu Khiển Đau Đớn"
 feast_default.5003.desc:0 "Những mảnh kim loại sắc nhọn trong một vài món ăn, dằm gỗ trên ghế, những #EMP tai nạn#! nhỏ hứa hẹn những vết bầm tím...\n\nNgồi ở đầu bàn, [sadistic_host.GetTitledFirstName] - [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sadistic_host'))] của ta không thể che giấu nụ cười lạnh lẽo đang lan rộng trên khuôn mặt [sadistic_host.GetHerHis] khi một [guest.GetLadyLord] khác, [guest.GetTitledFirstName], phun máu lên đĩa của [guest.GetHerHis]."
 feast_default.5003.a:0 "\"Chuyện này thật không thể chấp nhận!\""
 feast_default.5003.b:0 "Trước mắt ta sẽ chăm sóc [guest.GetFirstNameNoTooltip]."
 feast_default.5003.c:0 "Thật là một bữa tiệc huy hoàng!"

 feast_default.5004.t:1 "Đáy Chén"
 feast_default.5004.desc:0 "\"Đó có phải là âm thanh của một chiếc cốc rỗng vừa được đặt xuống bàn không?\" Để nghe thấy bất cứ điều gì giữa tiếng ồn này, [host.GetTitledFirstName] hẳn phải có đôi tai thần. Chủ tiệc hào phóng của ta vẫy tay gọi gia nhân. \"Mang thêm rượu! Không ai được khát!\""
 feast_default.5004.a:0 "Đa tạ, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] của ta!"
 feast_default.5004.b:0 "Ta nghĩ mình đã uống đủ rồi."
 feast_default.5004.c:0 "Ta viện cớ rồi lẩn vào đám đông."

 feast_default.5005.t:1 "Garum!"
 feast_default.5005.desc:0 "Ôi, hương vị tuyệt vời này! Đậm đà, hơi mặn, gợi nhớ đến biển cả...\n\nĐây có lẽ là thứ garum ngon nhất ta từng nếm, và đầu bếp của [host.GetTitledFirstNamePossessive] đã sử dụng nó thật xuất sắc!"
 feast_default.5005.a:0 "Ta phải ăn món này thường xuyên!"
 feast_default.5005.b:0 "\"Đây là một bữa ăn tuyệt vời, [host.GetFirstNameNoTooltip]!\""
 feast_default.5005.c:0 "\"Ngươi có biết murri được lấy cảm hứng từ garum không?\""
 feast_default.5005.c.flavor:0 "Có vẻ không nhiều vị khách khác biết điều này!"
 feast_default.5005.d:0 "Nếu có thể ta sẽ #EMP hít thở#! garum!"

 feast_default.6001.t:1 "[spouse.GetWomanMan|U] Phù Hợp Cho Công Việc"
 feast_default.6001.dislike_spouse:1 "Dù giữa chúng ta có nhiều điều không hòa hợp, ta phải thừa nhận rằng [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse'))] của ta đã làm rất tốt với bữa tiệc này. [spouse.GetFirstName] đảm bảo thức ăn được dọn đúng giờ, khách khứa ngồi đúng chỗ, và mọi người dường như đều hài lòng.\n\nVới [spouse.GetHerHim] bên cạnh ta tại bàn tiệc lớn và lễ hội sắp bắt đầu, ta cho [spouse.GetHerHim] biết rằng ta trân trọng công sức [spouse.GetHerHis] đã bỏ ra cho bữa tiệc này."
 feast_default.6001.like_spouse:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse'))] thân yêu của ta, [spouse.GetFirstName], đã làm việc rất chăm chỉ để đảm bảo mọi thứ của bữa tiệc diễn ra suôn sẻ. Thức ăn được dọn đúng giờ, khách khứa ngồi đúng chỗ, và mọi người đều hài lòng.\n\nVới [spouse.GetFirstName] bên cạnh ta tại bàn tiệc lớn, mọi thứ đã sẵn sàng. Ta siết nhẹ tay [spouse.GetHerHis] và mỉm cười với [spouse.GetHerHim], rồi đứng dậy tuyên bố khai tiệc."
 feast_default.6001.a:0 "Ta sẽ làm sao nếu thiếu [spouse.GetHerHim]."

 feast_default.6002.t:1 "Một Nỗ Lực Đáng Khen"
 feast_default.6002.desc:0 "Khi bữa tiệc đang diễn ra và các vị khách ăn uống vui vẻ, [guest.GetTitledFirstName] tiến đến bàn tiệc lớn nơi ta và [spouse.GetFirstName] đang ngồi.\n\"Đây là một bữa tiệc tuyệt vời! Xin gửi lời khen đến chủ nhân.\""
 feast_default.6002.a:0 "\"Đúng vậy, ta đã làm rất tốt, phải không?\""
 feast_default.6002.b:0 "\"[spouse.GetFirstNameNoTooltip] mới là người đáng nhận mọi công lao.\""

 feast_default.6003.t:1 "Trong Nhà Của Ta"
 feast_default.6003.opening:0 "Ta đã làm mọi thứ có thể để đảm bảo [fighter_1.GetTitledFirstName] và [fighter_2.GetTitledFirstName] ở cách xa nhau nhất có thể. Nhưng vẫn không đủ, và giờ họ gần như sắp đánh nhau ngay giữa bữa tiệc của ta!"
 feast_default.6003.bodyguard:0 "\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bodyguard'))] của ta, [bodyguard.GetTitledFirstName], đứng gần cuộc ẩu đả và nhìn về phía ta chờ lệnh can thiệp."
 feast_default.6003.guard:0 "\nMột tên lính canh của ta đứng gần cuộc ẩu đả và nhìn về phía ta chờ lệnh can thiệp."
 feast_default.6003.a:0 "Tống [fighter_2.GetFirstNameNoTooltip] ra ngoài để hạ hỏa."
 feast_default.6003.b:0 "Khống chế [fighter_1.GetFirstNameNoTooltip] cho đến khi mọi chuyện lắng xuống."
 feast_default.6003.c:0 "\"Dừng lại! Chuyện này chúng ta sẽ nói sau.\""


  feast_default.6101.t:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))|U] Phiền Não"
  feast_default.6101.desc_opening:0 "Ánh mắt cầu khẩn mà ta nhận được từ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))] của ta, [troubled_guest.GetFirstName], ngày càng trở nên tuyệt vọng. Một nhóm khách đang tiến lại gần góc phòng nơi [troubled_guest.GetSheHe] đã trốn suốt cả buổi tối, còn những bức tường thì ngăn cản đường thoát của [troubled_guest.GetHerHis].\n\n"
  feast_default.6101.desc_liked:0 "Tội nghiệp [troubled_guest.GetWomanMan], từ trước đến nay vẫn không giỏi giao thiệp với người khác!"
  feast_default.6101.desc_disliked:0 "Không ngờ một [troubled_guest.GetTitleTierName] lại hành xử như vậy..."
  feast_default.6101.desc_disliked_unlanded:0 "Không ngờ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))] của ta lại hành xử như vậy..."
  feast_default.6101.a:0 "Ta sẽ đánh lạc hướng đám khách đang kéo tới."
  feast_default.6101.b:0 "Nào nào, [troubled_guest.GetFirstNameNoTooltip]. Hãy kể cho chúng ta một câu chuyện!"
  feast_default.6101.c:0 "[troubled_guest.GetFirstNameNoTooltip]! Ta cần nói chuyện với ngươi. Riêng tư."
  feast_default.6101.c.tt:0 "Có lẽ cả hai chúng ta đều cần nghỉ ngơi một chút..."

  feast_default.6111.t:1 "Người Đối Thoại"
  feast_default.6111.desc:0 "Khi từng đĩa thức ăn được thay bằng đĩa khác, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_talk_to'))] của ta, [guest_to_talk_to.GetTitledFirstName], cứ thao thao bất tuyệt về [guest_to_talk_to.Custom('subject_of_interest')].\n\n\"...và đó là cách chúng ta cứu vãn mớ hỗn độn đó! Ngài chắc rằng ta không làm ngài chán chứ, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
  feast_default.6111.a:0 "Không không, xin cứ tiếp tục!"
  feast_default.6111.b:0 "Hay là chúng ta nói thêm về chính ngươi đi?"
  feast_default.6111.c:0 "Nhìn ngươi làm trò hề sao có thể khiến ta chán được!"
  feast_default.6111.d: "Ta đã kể cho ngươi nghe về [ROOT.Char.GetPromotedLegend.GetName] chưa?"
  feast_default.6111.d.success: "Truyền thuyết của ngài thật lôi cuốn"
  feast_default.6111.d.failure: "Ngài thật nhàm chán"
  feast_default.6111.e: "Thật thú vị, phải, nhưng chúng ta hãy nói về ta đi?"
  every_evil_guest_scope_tt:0 "Mọi vị khách không thiện cảm"

  feast_default.6121.t:1 "Xúc Phạm Một Cách Tinh Tế"
  feast_default.6121.desc:0 "Khi từng đĩa thức ăn được mang vào đại sảnh, một mùi hương không thể nhầm lẫn chạm đến mũi ta khiến ta mỉm cười. Rằng [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('hated_guest'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hated_guest'))] của ta, [hated_guest.GetTitledFirstName], lại rất nhạy cảm với [ROOT.GetCharacter.Custom('GetFoodDetail')] là điều ta #EMP đáng tiếc#! đã quên không nói với đầu bếp.\n\n\"Ta chào mừng tất cả các vị, và cầu mong các vị sẽ thấy món ăn hợp khẩu vị.\""
  feast_default.6121.a:0 "Đặc biệt là ngươi, [hated_guest.GetFirstNameNoTooltip]. #EMP Thưởng thức#! đi!!"
  feast_default.6121.b:0 "Biểu cảm trên mặt [hated_guest.GetHerHis|U] khi ta 'cứu' [hated_guest.GetHerHim] khỏi món ăn đó thật khiến ta hài lòng!"

  feast_default.6231.t:1 "Tai Họa Ập Đến"
  feast_default.6231.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]. Rượu... Chúng thần vừa mở thùng tiếp theo – nó đã hỏng. Nó #EMP hỏng hết#! rồi!\"\n\nBữa tiệc vẫn đang náo nhiệt, nhưng không có rượu thì bầu không khí chắc chắn sẽ nhanh chóng lụi tàn."
  feast_default.6231.a:0 "Người buôn rượu hẳn vẫn còn ở trong thị trấn!"
  every_drunkard_guest_scope_tt:0 "Mọi vị khách say rượu có mặt"
  feast_default.6231.b:0 "Tất cả chúng ta phải góp sức. Nào."
  feast_default.6231.c:0 "Đến lúc mở kho bí mật của ta."
  feast_default.6231.d: "Mang những loại rượu ngon hơn của ta ra."

  feast_default.6251.t:1 "Thế Tiến Thoái Lưỡng Nan"
  feast_default.6251.desc:0 "Bữa tiệc đang dần tàn, và ta thấy mình đang chìm sâu vào cuộc trò chuyện với [guest.GetTitledFirstName] - [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] của ta.\n\n[guest.GetSheHe|U] hỏi về ý kiến của ta về [guest.Custom('subject_of_interest')] – một chủ đề mà [guest.GetSheHe] vô cùng quan tâm."
  feast_default.6251.a:0 "Đó cũng là chủ đề khiến ta say mê!"
  feast_default.6251.b:0 "Ta chẳng quan tâm chút nào."
  feast_default.6251.c:0 "Ta hứng thú với #EMP ngươi#! hơn...!"

  feast_default.6261.t:1 "Phục Vụ Con Người"
  feast_default.6261.desc_lunatic:0 "\"Chính tay ta đã góp sức chuẩn bị bữa ăn này, và ta hy vọng kết quả sẽ làm các vị hài lòng!\""
  feast_default.6261.desc_not_lunatic:0 "\"Trợ lý đầu bếp đã dốc hết thân tâm để chuẩn bị bữa ăn này, và ta hy vọng kết quả sẽ làm các vị hài lòng!\""
  feast_default.6261.desc_cannibal_guest:0 "\n\nKhi chúng ta ngồi xuống dùng bữa, ta không khỏi nhận thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cannibal_guest'))] của ta, [cannibal_guest.GetTitledFirstName], dường như đặc biệt thích thú với món ăn."
  feast_default.6261.desc_concerned_guest:0 "\n\nTuy nhiên khi ngồi xuống ăn, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_guest'))] của ta, [concerned_guest.GetTitledFirstName], chỉ chọc chọc vào thức ăn trước mặt [concerned_guest.GetHerHim] và nhìn ta với ánh mắt nghi ngờ."
  feast_default.6261.a_exposed:0 "Cứ như thể [concerned_guest.GetSheHe] không tin ta!"
  feast_default.6261.a:0 "Hãy để [concerned_guest.GetHerHim] nghi ngờ bất cứ điều gì [concerned_guest.GetSheHe] muốn."
  feast_default.6261.b:0 "Mang cho [concerned_guest.GetTitleTierName] thứ gì khác để ăn."
  feast_default.6261.c:0 "Có lẽ chúng ta sẽ có nhiều điều về khẩu phần ăn để bàn bạc!"

  feast_default.6301.t:1 "Trách Nhiệm Về Cổ Vật"
  feast_default.6301.desc:0 "Giữa lúc bữa tiệc đang náo nhiệt, đội trưởng lính gác vội vã tiến về phía ta.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], có vẻ ai đó đã [feast_target_artifact.Custom('DamageArtifactAction')] [feast_target_artifact.GetName]! Bằng chứng chỉ về phía [ROOT.Char.GetLadyLord] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_artifact_culprit'))], [feast_artifact_culprit.GetTitledFirstNameNoTooltip], kẻ đã hành xử rất kỳ lạ tối nay.\" [captain_of_the_guard_dummy.GetSheHe|U] liếc về phía [feast_artifact_culprit.GetFirstNamePossessiveNoTooltip].\n\n\"[ROOT.Char.GetLadyLord] muốn thần làm gì?\""
  feast_default.6301.desc_learning_guard:0 "\n\n[feast_target_artifact.Custom('DamageArtifactActionFollowup')]"
  feast_default.6301.desc_learning:0 "\n\nNhìn qua, [feast_artifact_culprit.GetTitledFirstNameNoTooltip] quả thật trông rất bất an."
  feast_default.6301.a:0 "Bắt giữ [feast_artifact_culprit.GetTitledFirstNameNoTooltip] ngay lập tức!"
  feast_default.6301.b:0 "Đưa [feast_artifact_culprit.GetHerHim] đến gặp ta."
  feast_default.6301.b.tt:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] tốt hơn nên trả giá cho thiệt hại."
  feast_default.6301.b.tt_innocent:1 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] vô tội"
  feast_default.6301.b.tt_guilty:1 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] có tội"
  feast_default.6301.c_learning:0 "Ta tin rằng ngươi biết nhiều hơn những gì ngươi nói, đội trưởng..."
  feast_default.6301.c.tt:0 "Ngươi loại bỏ viên đội trưởng xảo quyệt của mình."
  feast_default.6301.d:0 "Dù sao ta cũng chưa từng thích món đồ đó."

 #...turns out the suspect was innocent after all
  feast_default.6302.t:1 "Sự Vô Tội Lên Tiếng"
  feast_default.6302.t_lover:0 "Sự Vô Tội Nằm Ở Đây"
  feast_default.6302.desc_intro:0 "[feast_trusted_friend.GetTitledFirstNameNoTooltip] bước vào thư phòng của ta. \"[feast_trusted_friend.Custom2('RelationToMe', ROOT.Char)] thân mến của ta, ta chỉ mới biết về việc [feast_artifact_culprit.GetFirstNamePossessiveNoTooltip] bị giam.\""
  feast_default.6302.desc_secret_lover:0 "\n\n[feast_trusted_friend.GetSheHe|U] liếc nhìn ta lo lắng. \"Có lẽ đã có nhầm lẫn — ta đã... theo dõi... [feast_artifact_culprit.GetTitledFirstNameNoTooltip] vào lúc sự việc xảy ra và chắc chắn không thể là [feast_artifact_culprit.GetHerHim].\"\nMột vệt đỏ lan trên má [feast_trusted_friend.GetHerHis]."
  feast_default.6302.desc_spirited_debate:0 "\n\n[feast_trusted_friend.GetSheHe|U] nhìn ta bình tĩnh nhưng lo ngại. \"Ta nhớ rõ rằng [feast_artifact_culprit.GetHerHim] đang tranh luận sôi nổi với [feast_debatee_character.GetTitledFirstNameNoTooltip] lúc sự việc xảy ra, vì vậy thật không thể để [feast_artifact_culprit.GetHerHim] là thủ phạm.\""
  feast_default.6302.a:0 "Ai cũng có thể mắc sai lầm."
  feast_default.6302.a.tt:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] sẽ nhớ chuyện này."
  feast_default.6302.a_lover:0 "#EMP [feast_trusted_friend.GetTitledFirstNameNoTooltip]!#!"
  feast_default.6302.b:0 "Hãy giữ chuyện này giữa chúng ta."
  feast_default.6302.b.tt:0 "Ta tin rằng [feast_artifact_culprit.GetTitledFirstNameNoTooltip] chắc chắn có tội #EMP chuyện gì đó#!."
  feast_default.6302.b.tt_callous:0 "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] là một tù nhân rất thích hợp."

  feast_default.6351.t:1 "Thiệt Hại Ngoài Ý Muốn"
  feast_default.6351.desc_intro:0 "Ta vừa mới ngồi xuống thì nghe thấy tiếng hét phát ra từ [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]. Có vẻ như [feast_default_6351_fighter_2.GetSheHe] và [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] đã thực sự ẩu đả với nhau, khi [feast_default_6351_fighter_2.GetFirstNameNoTooltip] đang nhận được một trận đòn ra trò từ [feast_default_6351_fighter_1.GetFirstNameNoTooltip]. Quá muộn ta mới nhận ra cuộc ẩu đả của họ đã san phẳng con đường xuyên qua [feast_target_artifact.GetName]!"
  feast_default.6351.desc_calm:0 "\n\nTa ra hiệu cho lính canh tách hai kẻ đang gầm gừ với nhau ra."
  feast_default.6351.desc_wrathful:0 "\n\nTa gầm lên từ bên kia đại sảnh: \"#EMP Chuyện này là sao đây!#!\""
  feast_default.6351.desc_outro:0 "\n\nCả hai bị đưa đến trước mặt ta, vẫn không ngừng đổ lỗi cho nhau."
  feast_default.6351.a:0 "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], sao ngươi lại làm vậy?"
  feast_default.6351.a_wrathful:0 "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], #EMP ngươi dám sao!#!"
  feast_default.6351.a.tt:0 "Bắt [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] bồi thường."
  feast_default.6351.b:0 "Sao ngươi lại để [feast_default_6351_fighter_1.GetHerHim] khiêu khích ngươi, [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]?"
  feast_default.6351.b_wrathful:0 "Sự kiên nhẫn của ta đang cạn dần, [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]..."
  feast_default.6351.b.tt:0 "Bắt [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip] bồi thường."
  feast_default.6351.c:0 "Ai bắt đầu không quan trọng. Cả hai đều có trách nhiệm."
  feast_default.6351.c_wrathful:0 "#EMP Đủ rồi!#! Cả hai phải bồi thường."
  feast_default.6351.c.tt:0 "Bắt cả hai bồi thường."
  feast_default.6351.d:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName], ta sẽ quay má kia."
  feast_default.6351.d.tt:0 "Hãy để [ROOT.Char.GetFaith.HighGodName] phán xét họ."
  feast_default.6351.e:0 "Chuyện như vậy vẫn xảy ra. Đó không phải món ta thích."
  feast_default.6351.e_wrathful:0 "#EMP May cho lũ ngốc các ngươi#! là ta vốn chẳng thích món đó..."
  feast_default.6351.e.tt:0 "Tha cho họ."

  feast_default.6501.t:1 "Lời Nói Nước Đôi"
  feast_default.6501.desc.opening:0 "\"Ta biết ta đã nói gì, ta chỉ không hiểu tại sao ngươi lại thấy nó buồn cười đến vậy?\"\n\n[innocent_guest.GetTitledFirstName] nghiêng đầu sang một bên trong khi ta cố nén tiếng cười khúc khích. Ta chưa nói với [innocent_guest.GetHerHim] rằng những gì [innocent_guest.GetSheHe] nói có thể bị hiểu là điều gì đó tục tĩu.\n\n\""
  feast_default.6501.joke_a:0 "\"Nếu ngươi bóp cái đầu, một chất đặc sẽ trào ra!\""
  feast_default.6501.joke_b:0 "\"Ta gặp khó khăn khi hiểu phương ngữ này, và ta nghe nói ngươi là bậc thầy ngôn ngữ!\""
  feast_default.6501.joke_c:0 "\"Nàng ta khoe một bộ ngực tuyệt đẹp ngay tại tòa án!\""
  feast_default.6501.desc.ending_solo:0 "\n\nChẳng lẽ chỉ mình ta thấy buồn cười sao? Ta sẽ không biết nếu không lên tiếng. Có đáng để khiến [innocent_guest.GetFirstNameNoTooltip] xấu hổ vì một trò đùa không?"
  feast_default.6501.desc.ending_duo:0 "\n\nTa có lẽ không đơn độc khi nghĩ điều này buồn cười; [fellow_pervert.GetTitledFirstName] đã phun ra một ít đồ uống của [fellow_pervert.GetHerHis] khi [innocent_guest.GetTitledFirstNameNoTooltip] lặp lại chính mình. Cả hai có thể chia sẻ cùng một khiếu hài hước thô lỗ như ta, hoặc họ có thể bị xúc phạm bởi nó. Ta sẽ không biết họ nghĩ gì trừ khi ta lên tiếng."
  feast_default.6501.a:0 "Ta, ừm... Thôi bỏ đi..."
  feast_default.6501.b:0 "Nhắc lại điều ngươi vừa nói đi, nhưng chậm thôi. Nghĩ kỹ xem."
  feast_default.6501.b.tt:0 "#F Ngươi mạo hiểm khiến [innocent_guest.GetTitledFirstNameNoTooltip] xấu hổ với hy vọng hai người có cùng khiếu hài hước"
  feast_default.6501.b.success:0 "[innocent_guest.GetTitledFirstNameNoTooltip] thấy câu nói nước đôi thật buồn cười"
  feast_default.6501.b.failure:0 "[innocent_guest.GetTitledFirstNameNoTooltip] kinh hoàng trước sự dung tục của ngươi"

 feast_default.6510.t: "Dưới Gầm Bàn"
 feast_default.6510.desc.intro: "Món ăn tiếp theo được mang tới bàn và tất cả những gì ta thấy là một thứ nhầy nhụa đáng ngờ được đặt trên đĩa, quằn quại như thể còn sống. Dạ dày ta sôi lên cảnh báo, và ta sẵn lòng bỏ qua món kế tiếp này... [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('primary_spouse'))] của ta, [ROOT.Char.GetPrimarySpouse.GetFirstName], nhận ra vẻ ghê tởm của ta và nghiêng người tới trước, nhìn ta nghiêm khắc, chậm rãi lắc đầu [primary_spouse.GetHerHis] tỏ ý không tán thành.\n\nNhư thể để cứu ta khỏi số phận ghê rợn này, chính [ROOT.Char.GetFaith.PositiveAfterLife|U] đã can thiệp — ta chợt trông thấy"
 feast_default.6510.desc.cat: "con mèo của ta [ROOT.Char.Custom('CatStoryName')]"
 feast_default.6510.desc.dog: "con chó của ta [ROOT.Char.Custom('DogStoryName')]"
 feast_default.6510.desc_cat_and_dog: "những thú cưng của ta, [ROOT.Char.Custom('CatStoryName')] và [ROOT.Char.Custom('DogStoryName')]"
 feast_default.6510.desc.outro: "đang tìm kiếm chút thức ăn thừa trên sàn. Đây chính là cơ hội để ta tránh món ăn khó nuốt kia!"
 feast_default.6510.a: ""#EMP Lại đây...#""
 feast_default.6510.a.tt.success: "Dường như không ai để ý"
 feast_default.6510.a.tt.failure: "Dường như ai cũng để ý"
 feast_default.6510.b: "Tốt hơn là cắn răng chịu đựng..."
 feast_default.6510.b.tt.success: "Ta thấy khá hơn mong đợi"
 feast_default.6510.b.tt.failure: "Ta thấy không ổn lắm"
 feast_default.6510.c: "Ta tự chọn thứ mình ăn!"

 feast_default.8001.t.fire:1 "Từ Tro Tàn Đến Ngọn Lửa"
 feast_default.8001.t.knights:1 "Món Ngon Nhất Khi Dùng Lạnh"
 feast_default.8001.desc.sadistic:1 "Ngọn lửa liếm lên mái nhà, và tiếng thét vang vọng trong đêm. Ta tựa lưng vào cánh cửa đã đóng, phớt lờ những gương mặt kinh hoàng của nạn nhân, và mỉm cười. Để sự oán giận âm ỉ bùng lên thành ngọn lửa quả thật là cách tốt nhất để xử lý sự chống đối!\n\nKhi những cú đập phía bên kia dần yếu đi, ta cuối cùng cũng cho phép mình bật cười."
 feast_default.8001.desc.compassionate:0 "Ta không thể rời mắt khỏi chiếc đĩa của mình. Thịt [ROOT.Char.Custom('RegionalEdibleMeat')] gần như còn nguyên. Ly [ROOT.Char.Custom('GetExpensiveDrink_Singular')] của ta vẫn đầy. Ta tránh nhìn [honorary_guest.GetTitledFirstName] khi [honorary_guest.GetSheHe] nói về [honorary_guest.Custom('herhis_subject_of_interest')]. Thật đáng xấu hổ.\n\n\"Xin thứ lỗi, bằng hữu của ta,\" ta cáo lui, vội vã rời khỏi phòng. Ta thở nặng nề. Đây là điều #EMP cần#! phải làm. Ta ra hiệu cho một người hầu và nhắm mắt lại.\n\nNgọn lửa, rồi tiếng thét."
 feast_default.8001.desc.just:0 "Mọi người khác đã rời đi. Tất cả — ngoại trừ vị khách danh dự của ta và đoàn tùy tùng lộng lẫy của [honorary_guest.GetHerHis]. Ta nhấp một ngụm từ chiếc cốc của mình, khi [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')]. Họ không được phép nghi ngờ. \"Xin thứ lỗi,\" ta nhìn thẳng vào mắt [honorary_guest.GetTitledFirstName] trước khi rời đi. Không ai được biết. Không ai sẽ biết.\n\nKhi ta ra lệnh đóng cửa, ta dừng lại hít một hơi. Điều đúng đắn không phải lúc nào cũng nhân từ.\n\nChẳng bao lâu sau, ngọn lửa xuất hiện, và tiếng thét theo sau."
 feast_default.8001.desc.random_1:1 "Cuộc trò chuyện với [honorary_guest.GetTitledFirstName] không thể thân thiện hơn. Ánh mắt ta lướt về phía [host.Custom('GetExpensiveDrink_Singular')] khi [honorary_guest.GetSheHe] tiếp tục bài diễn thuyết dài về [honorary_guest.Custom('herhis_subject_of_interest')]. Tất cả các khách khác đã rời đi. Dĩ nhiên, họ không muốn làm gián đoạn những chuyện quan trọng mà vị khách danh dự của ta muốn bàn.\n\nChất độc không mùi vị. Không thể phát hiện."
 feast_default.8001.desc.random_2:1 "Âm nhạc và điệu nhảy đã ồn ào đến mức gần như không thể trò chuyện. Người rót rượu lại rót đầy chiếc cốc của [honorary_guest.GetTitledFirstNamePossessive] và ánh mắt chúng ta gặp nhau trong thoáng chốc.\n\n\"[ROOT.Char.GetHouse.GetMotto],\" ta lẩm bẩm, khi [honorary_guest.GetFirstNameNoTooltip] nghẹn lại vì chất độc."
 feast_default.8001.a:0 "Cuối cùng... chúng đã biến mất."
