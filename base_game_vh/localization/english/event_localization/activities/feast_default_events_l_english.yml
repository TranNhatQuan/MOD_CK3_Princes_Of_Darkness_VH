 feast_default.8002.t:1 "Lưỡi Dao Trong Bóng Tối"
 feast_default.8002.t.poison:0 "Thêm Một Ly Nữa"
 feast_default.8002.desc.random_2:0 "Cuối cùng. Chỉ còn ta và [honorary_guest.GetTitledFirstName]. Hoàn toàn riêng tư. \"Một lời thôi, bằng hữu.\" Tất cả khách khác đã bắt đầu nhảy múa và âm nhạc vọng tới chỗ chúng ta, bị đá tường làm nghẹt lại. Một tiếng vọng. Có lẽ tiếng vọng của [honorary_guest.GetHerHis] cũng sẽ vang lên.\n\n[honorary_guest.GetFirstNameNoTooltip] nhướng [honorary_guest.GetHerHis] mày, một trong những $knight_culture_player_plural_no_tooltip_lowercase$ của ta đang rót thêm rượu cho [honorary_guest.GetHerHim]. \"Có chuyện gì quan trọng sao?,\" [honorary_guest.GetSheHe] hỏi. Chiếc cốc gần chạm môi [honorary_guest.GetHerHis]. Gần thôi. Một âm thanh nghẹt lại xuyên qua bức tường đá. Cổ họng [honorary_guest.GetHerHis|U] đã bị cắt. Một tiếng vọng."
 feast_default.8002.desc.sadistic:0 ""Lối này, [honorary_guest.GetFirstName], ta sẽ cho ngươi xem chiếc trâm mới ta đặt làm cho ngươi. Một món quà xứng đáng cho vị khách tuyệt vời nhất."\n\nTa dẫn đường, và [honorary_guest.GetSheHe] theo sau, khi [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')]. \"Ở đây,\" ta nói, mở cánh cửa vào một căn phòng nhỏ, ánh sáng lờ mờ. Ta thấy sự bối rối trong mắt [honorary_guest.GetHerHis] — chỉ trong chốc lát. Sự nhận ra đến rất nhanh. \"Không... ngươi không thể.\"\n\n\"Ồ, ta đảm bảo là ta sẽ làm.\""
 feast_default.8002.desc.just:1 "Khoảnh khắc đã đến. Ta nhìn chằm chằm [honorary_guest.GetTitledFirstName] khi [honorary_guest.GetSheHe] [honorary_guest.Custom('quirk_pos_present')]. Thật đáng tiếc, nhưng điều này phải được thực hiện. \"Ngài có muốn đi dạo một chút không?,\" câu hỏi của ta được đáp lại bằng nụ cười tò mò. \"Có chuyện chính sự nào liên quan tới [ROOT.Char.GetTitleAsNameNoTooltip] của chúng ta sao?\"\n\nRất nhiều. Sắp tới sẽ bớt đi một.\n\nTa dẫn đường tới một trong những căn phòng nhỏ nhất. Cánh cửa đóng lại phía sau. Ngọn lửa bùng lên. Một cú ra tay gọn gàng."
 feast_default.8002.a:0 "Xong rồi."
 
 feast_default.8003.t:1 "Một Tai Nạn Đáng Tiếc"
 feast_default.8003.desc.poison:0 "Tất cả các vị khách dường như đang tập trung vào tiếng hát và điệu múa. Chỉ còn vài người vẫn ngồi yên. May thay, cuộc trò chuyện của ta với [honorary_guest.GetTitledFirstName] dường như đủ để giữ [honorary_guest.GetHerHim] ở lại. \"Một bữa tiệc tuyệt vời,\" [honorary_guest.GetSheHe] nói, bỏ chiếc cốc [honorary_guest.GetHerHis] sang một bên để cắn thêm một miếng.\n\n\"À, ngài khiến trái tim ta ấm lên,\" ta đáp, khi ra hiệu cho người rót rượu. Đây sẽ là bữa tiệc cuối cùng của [honorary_guest.GetHerHis]. Ánh mắt ta gặp ánh mắt [honorary_guest.GetFirstNamePossessiveNoTooltip]. Một khoảnh khắc do dự."
 feast_default.8003.desc.compassionate:0 "Ta vội vàng lau những giọt mồ hôi rơi trên trán, nắm chặt chiếc khăn tay với sức lực nhiều hơn mức cần thiết. [honorary_guest.GetTitledFirstName] nói về [honorary_guest.Custom('subject_of_interest')], và ta không thể giữ cho mắt mình tập trung. \"Một lát nhé...\" ta cáo lỗi khi thấy [honorary_guest.GetHerHim] đưa chiếc cốc của [honorary_guest.GetHerHis] lại gần môi của [honorary_guest.GetHerHis].\n\nTa biết thứ nó chứa đựng."
 feast_default.8003.desc.sadistic:0 ""Xin mời, bằng hữu của ta, để ta rót đầy chiếc cốc cho ngài, vì ngài là vị khách ta yêu quý nhất,\" ta nói với nụ cười nồng hậu nhất. [honorary_guest.GetTitledFirstName] gật đầu, đưa cho ta chiếc cốc [honorary_guest.GetHerHis]. Các vị khách đã bắt đầu một điệu [ROOT.Char.Custom('GetMedievalDance')], và sự ồn ào của họ đủ để đánh lạc hướng.\n\nTa rót chất độc từ chiếc nhẫn của mình một cách cẩn thận nhất. \"Ta hy vọng ngài đang khát.\""
 feast_default.8003.a:0 "#EMP Cạn ly.#!"
 feast_default.8003.a.success:0 "[honorary_guest.GetShortUIName] uống từ chiếc cốc"
 feast_default.8003.a.failure:0 "[honorary_guest.GetShortUIName] không uống"
 
 feast_default.8004.t:0 "Hãy Mở To Mắt"
 feast_default.8004.desc.intro:0 "Ta nhấp một ngụm [host.Custom('RegionalDrink')] khi buổi tối dần đi đến hồi kết. Đôi mắt ta đã mệt mỏi, nhưng"
 feast_default.8004.desc.goh_intro:0 "[host.GetTitledFirstName] khăng khăng rằng ta phải ở lại để bàn về chuyện của vương quốc. \"Như ta đang nói,\" [host.GetSheHe] tiếp tục, không hề để ý tới những cái ngáp ta cố che giấu.\n\n"
 feast_default.8004.desc.goh_solo:0 "$feast_default.8004.desc.goh_intro$Nhưng khi ta mở mắt lần nữa, ta thấy một tia sáng bạc. \"Bữa tiệc kết thúc ở đây.\""
 feast_default.8004.desc.goh_group:0 "$feast_default.8004.desc.goh_intro$\"Cứu với!\" Một tiếng hét cắt ngang cuộc trò chuyện. \"#EMP Cứu với!#!\" Lại thêm một tiếng nữa. Khi ta nhìn quanh, ta thấy ánh bạc của những lưỡi kiếm. Và một trong số đó đang chĩa thẳng vào ta.\n\n\"Kết thúc rồi, [murder_victim.GetTitleAsNameNoTooltip].\""
 feast_default.8004.desc.fallback:0 "[host.GetTitledFirstName] đã khăng khăng rằng [honorary_guest.GetTitledFirstName] phải ở lại cho một cuộc nói chuyện vô cùng quan trọng. Và dĩ nhiên, đoàn tùy tùng của [honorary_guest.GetHerHis] cũng phải đi cùng [honorary_guest.GetHerHim]."
 feast_default.8004.a:0 "Khoan... chuyện gì đang xảy ra?"
 feast_default.8004.a.tt.success:0 "Ngươi chết"
 feast_default.8004.a.tt.success.host:0 "[murder_victim.GetShortUIName] đã chết"
 feast_default.8004.a.tt.failure:0 "Ngươi sống sót"
 feast_default.8004.a.tt.failure.host:0 "[murder_victim.GetShortUIName] đã sống sót"
 feast_default.8004.a.goh_murder.tt:0 "[honorary_guest.GetShortUIName] chết"
 every_attending_travel_companion_goh:0 "Mọi thành viên trong đoàn tùy tùng"

 feast_default.8052.t:1 "Một Kết Cục Đột Ngột"
 feast_default.8052.desc:0 ""Cháy!"\n\nKhi sự hoảng loạn lan khắp các vị khách, ta nhìn quanh tìm [host.Custom2('MyCharacterIntroduction', ROOT.Char)] nhưng thấy chiếc ghế của [host.GetHerHis] trống rỗng.\n\nNgọn lửa lan nhanh — những tấm vải thấm [ROOT.Char.Custom('RegionalDrink')] và những kẻ ăn vận cầu kỳ bốc cháy nhanh chóng. Da ta phồng rộp, #EMP bong tróc#!, và ta hét lên; nhưng chẳng bao lâu sau ngay cả điều đó cũng trở nên bất khả khi khói cuồn cuộn bóp nghẹt tiếng kêu của ta."
 feast_default.8052.a:0 "Ta luôn muốn kết thúc trong vinh quang rực lửa..."

 feast_default.8061.t.fire:1 "Cháy! Cháy...?"
 feast_default.8061.t:0 "$feast.7151.t$"
 feast_default.8061.desc.fire:1 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vội vàng đưa ta và vài người khác ra khỏi đại sảnh yến tiệc trước khi cố gắng đóng cửa lại.\n\nTuy nhiên — trước khi [host.GetSheHe] kịp làm — tiếng kêu la vang lên từ bên trong, và tất cả người tham dự tràn ra ngoài đêm tối khi ngọn lửa bắt đầu bốc lên từ đại sảnh."
 feast_default.8061.desc.fail:0 "$feast.7151.desc$"
 feast_default.8061.desc.fail_me:0 "Hai tay ta vẫn còn run rẩy sau sự việc đêm qua, và những lính đánh thuê vốn được thuê để lấy mạng ta đã bị [host.GetTitledFirstName] tống giam.\n\nTuy vậy, cảm giác bất an này không dễ gì biến mất."
 feast_default.8061.desc.death_alone:1 "Bầu không khí u ám hơn ta mong đợi khi chúng ta chuẩn bị rời khỏi yến tiệc của [host.GetTitledFirstNamePossessive]. Thi thể của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('murder_guest'))] của ta, [murder_guest.GetTitledFirstName], đã được tìm thấy, vẫn còn ấm trên sàn.\n\nCái chết đã ám lấy những bức tường này và rượu trên môi chúng ta cũng trở nên chua chát."
 feast_default.8061.a:2 "Có lẽ bữa tiệc giờ đã kết thúc."
 feast_default.8061.a.good:0 "[murder_guest.GetFirstNameNoTooltip]... ra đi như thế này."

 feast_default.9001.t:1 "Khi Khách Khứa Rời Đi"
 feast_default.9001.desc_exotic:0 "Khi mọi người trở về nhà với bụng đầy những món ngon kỳ lạ, ta tự hào nói rằng yến tiệc đã thành công!"
 feast_default.9001.desc_lavish:0 "Khi mọi vị khách rời đi với cả kho lương thực rộng lớn của ta nằm gọn trong bụng họ, ta tự hào nói rằng yến tiệc đã thành công!"
 feast_default.9001.desc_meager:0 "Khi tất cả khách khứa vừa tranh giành những mẩu thức ăn ít ỏi cuối cùng trên bàn của ta, ta vô cùng nhẹ nhõm khi cuối cùng thấy họ rời đi với quần áo lỏng lẻo và dạ dày vẫn réo lên."
 feast_default.9001.desc:0 "Khi mọi người trở về nhà riêng của mình, ta tự hào nói rằng yến tiệc đã thành công!"
 feast_default.9001.spouse:0 "\n\nTa phải cảm ơn [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta, [spouse.GetFirstName], vì phần lớn thành công này, và ta chỉ cảm thấy biết ơn khi [spouse.GetSheHe] tiễn những vị khách cuối cùng."
 feast_default.9001.no_spouse:0 "Dẫu vậy, ta vẫn biết ơn vì công việc này cuối cùng cũng tạm khép lại."
 feast_default.9001.a:0 "Hẹn lần sau!"

 feast_default.9002.desc_roughed_up: "\n\nThật là một bữa tiệc! Túi của ta đầy ắp dao nĩa chôm được và [host.Custom('GetExpensiveMeal')], cái tên [host.Custom2('InsultNoun', ROOT.Char)] [host.GetFirstNameNoTooltip] đó lẽ ra không nên xúc phạm ta!"
 feast_default.9002.desc_exotic:0 "Thật là một bữa tiệc! Trước khi đến đây, ta chưa từng tưởng tượng mình sẽ được nếm những món ngon kỳ lạ trong thời gian ở đại sảnh của [host.GetTitledFirstNamePossessive]. Đây là bữa tiệc ta sẽ không bao giờ quên!"
 feast_default.9002.desc_lavish:0 "Thật là một bữa tiệc! Trước khi đến đây quần áo ta còn rộng thùng thình, giờ ta lảo đảo bước ra khỏi đại sảnh của [host.GetTitledFirstNamePossessive] với bụng đầy thức ăn và niềm vui gấp đôi lúc đến! Đây là bữa tiệc ta khó mà quên được!"
 feast_default.9002.desc_meager:0 "Thật là một bữa tiệc ư? Dù thường ta mong đợi nhiều thức ăn hơn ở một bữa tiệc, ta rời đại sảnh của [host.GetTitledFirstNamePossessive] trong cơn đói, nhưng ít ra bạn đồng hành cũng khá tốt. Đây là bữa tiệc ta ước gì có thể quên đi."
 feast_default.9002.desc:0 "Thật là một bữa tiệc! Ta sẽ còn nhớ những ngày ở đại sảnh của [host.GetTitledFirstNamePossessive] trong thời gian dài."
 feast_default.9002.desc_ending:1 "\n\nGiờ là lúc rửa sạch dấu vết của rượu chè và vui vẻ, và một lần nữa quay lại với bổn phận của ta..."
 feast_default.9002.a:0 "Tạm biệt, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] của ta!"
 feast_default.5010.t: "Sự Im Lặng Huyền Thoại"
 feast_default.5010.desc: "Giữa tất cả tiếng ăn mừng và yến tiệc, bỗng có một khoảng lặng trong cuộc trò chuyện của toàn bộ những người tham dự. [rando_guest.GetName|U] là những người duy nhất vẫn còn trao đổi lời nói, nhưng ta cảm thấy mình bị buộc phải im lặng khi ánh mắt mọi người dần đổ dồn về phía ta.\n\nCó lẽ khoảnh khắc yên tĩnh này chính là cơ hội để ta nói về [ROOT.Char.GetPromotedLegend.GetName]."
 feast_default.5010.a: "[rando_guest.GetFirstName|U], để ta kể cho ngươi một câu chuyện."
 feast_default.5010.a.success: "[rando_guest.GetFirstName|U] ấn tượng"
 feast_default.5010.a.failure: "[rando_guest.GetFirstName|U] chán nản"
 feast_default.5010.b: "Mọi người đều phải nghe truyền thuyết."
 feast_default.5010.c: "Cuối cùng cũng có một khoảnh khắc im lặng."

  feast_default.5020.t: "Yên lặng"
  feast_default.5020.desc: "Những chiếc cốc va vào nhau, tiếng chuyện trò ồn ào, tay đập xuống bàn — tất cả hòa thành một bản hợp âm hỗn loạn của những âm thanh vô nghĩa. Tôi cảm nhận làn sóng âm rung lên trong cơ thể mình, rồi đột nhiên mọi thứ quanh tôi chậm lại, chỉ còn vài lời nói và đôi ba tiếng cười khẽ.\n\nTrong sự tĩnh lặng này, tôi cảm thấy trái tim mình cuộn xoáy, và trong đầu tôi hiện ra trọn vẹn một bài diễn thuyết — từ một tiếng thì thầm dần lớn thành tiếng hô vang, khẩn thiết muốn được chia sẻ! Một bài diễn thuyết về tính chính danh của ta với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip|U]."
  feast_default.5020.a: "Ta có trí tuệ của [ROOT.Char.GetFaith.TricksterGodName]!"
  feast_default.5020.a.success: "Bài diễn thuyết của bạn khiến các vị khách phấn khích"
  feast_default.5020.a.failure: "Bài diễn thuyết của bạn không truyền cảm hứng được bao nhiêu"
  feast_default.5020.b: "[ROOT.Char.GetFaith.KnowledgeGodName|U] hành động thông qua ta!"
  feast_default.5020.c: "Ta có trái tim và dạ dày của [ROOT.Char.GetFaith.WarGodName]!"
  feast_default.5020.d: "Tại sao phải làm vấy bẩn một sự tĩnh lặng đẹp như vậy?"

# Knock off an equal's Eboshi hat
  feast_default.3008.t: "Mũ Càng Cao..."
  feast_default.3008.desc: "Trong một khoảng lặng của lễ hội, mắt ta bị thu hút bởi tia sáng nhảy múa trên lớp sơn mài đen của chiếc [Glossary('Eboshi', 'EBOSHI_GLOSS')] thuộc [hat_man.GetFirstNamePossessive]. Chẳng phải đó là lẽ thường tình sao, ánh sáng nên tìm đến và chiếu rọi lên [hat_man.GetHerHim] phía trên chúng ta?\n\nNgười ta sẽ nghĩ gì nếu đột nhiên [hat_man.GetSheHe] đánh mất chiếc eboshi của [hat_man.GetHerHis]? Liệu khi đó [hat_man.GetSheHe] còn tỏa sáng rực rỡ đến mức nào?! [hat_man.GetSheHe|U] sẽ bị hủy hoại! Một đứa trẻ. Thậm chí còn thấp kém hơn con người."
  feast_default.3008.a: "Chiếc mũ đó phải biến mất!"
  feast_default.3008.b: "Nuôi dưỡng sự ghen tị như vậy thật không xứng đáng."
  feast_default.3008.c: "Cầu mong ánh sáng làm [hat_man.GetHerHim] lóa mắt trước mưu mẹo của ta."
  feast_default.3008.c.tt: "[scheme|E] của bạn nhận được [GetModifier('didnt_knock_hat_off_modifier').GetNameWithTooltip]"
  feast_default.3008.c.flavor: "Danh tiếng của [hat_man.GetHerHis|U] phải bị bôi nhọ!"
  EBOSHI_GLOSS: "Một loại mũ cao, được sơn bóng và làm từ giấy cứng. Chúng được trao cho các quý tộc nam khi họ trưởng thành và là biểu tượng cho địa vị, nam tính và nhân cách của họ. Chiếc mũ cũng dùng để bảo vệ 'motodori' (búi tóc trên đỉnh đầu) và giữ cho nó sạch sẽ (và vì vậy là thuần khiết)."

  feast_default.3009.t: "...Thì Rơi Càng Xa."
  feast_default.3009.desc: "Như con rắn cuộn mình chờ đợi, ta ra tay! Chiếc eboshi của [hat_man.GetFirstNamePossessive] trượt dài trên sàn. [hat_man.GetSheHe|U] cố che giấu nỗi nhục của mình, nhưng [hat_man.GetHerHis] [Glossary('Motodori', 'MOTODORI_GLOSS')] bù xù đã lộ ra cho tất cả cùng thấy — sự lơ là về mặt tinh thần của [hat_man.GetHerHis] bị phơi bày hoàn toàn. Khi ảo tưởng về sự vĩ đại của [hat_man.GetHerHis] đã bị dập tắt, có lẽ đã đến lúc một người khác bước ra ánh sáng?"
  feast_default.3009.a: "Hãy để thời khắc ta tỏa sáng bắt đầu!"
  MOTODORI_GLOSS: "Kiểu búi tóc trên đỉnh đầu phổ biến trong thời kỳ Heian. Không giống những kiểu sau này như 'chonmage', lúc đó không có tập tục cạo phần tóc trên đỉnh đầu."

  feast_default.3010.t: "Mũ của ta!"
  feast_default.3010.desc: "Có một khoảng lặng trong buổi tiệc. Trong khoảnh khắc, như thể thời gian chậm lại, những lo âu của thế gian và áp lực của hiện tại tạm thời tan biến.\n\nRồi như một con rắn lao ra từ bóng tối, bàn tay của [hat_knocker.GetName] đánh bật chiếc [Glossary('Eboshi', 'EBOSHI_GLOSS')] của tôi. Tôi nhìn theo trong kinh ngạc khi nó trượt dài trên sàn. Tôi cố che giấu nỗi nhục của mình, nhưng [Glossary('Motodori', 'MOTODORI_GLOSS')] bù xù của tôi đã lộ ra cho tất cả cùng thấy — sự lơ là về mặt tinh thần của tôi bị phơi bày."
  feast_default.3010.a: "[hat_knocker.GetSheHe|U] sẽ phải hối hận về ngày hôm nay!"
  feast_default.3010.a.flavor: "Ta sẽ cho [hat_knocker.GetHerHim|U] biết thế nào là một con rắn!"
  feast_default.3010.a.tt: "[scheme|E] của bạn nhận được [GetModifier('scheme_apa_positive_2101_modifier').GetNameWithTooltip]"
  feast_default.3010.b: "Có lẽ ngươi đã uống quá nhiều rồi, [hat_knocker.GetFirstNameNoTooltip]."
  feast_default.3010.b.flavor: "Sự bình thản của ta sẽ không bị phá vỡ."
