l_english:

  festival.001.t: "Lạc Giữa Đám Đông"
  festival.001.desc: "Quan sát đám đông đến dự hội, ta vui mừng khi thấy nơi đây tràn ngập tiếng cười của trẻ nhỏ cùng nụ cười mãn nguyện của cha mẹ chúng. Thế nhưng một chuyển động đột ngột và khác thường lọt vào mắt ta — quá nhỏ để là một đứa trẻ, mà lại quá... #EMP lông lá#!?\n\nCó vẻ đó là một con chó con, tập tễnh giữa những bước chân khổng lồ, lạc lõng và cô độc."
  festival.001.a.tt: "#weak Hãy tìm cho chú chó này một mái nhà mới #!"
  festival.001.a: "Lại đây nào, bé nhỏ, ta sẽ chăm lo cho ngươi."
  festival.001.b: "Số phận của nó chẳng liên quan đến ta."
  festival.001.b.tt: "Ắt hẳn con chó con rồi cũng tìm được mái nhà mới...?"
  festival.001.b.custom.tooltip: "Ngươi bỏ mặc con chó con cho số phận"

  festival.002.t: "Một Tâm Trí Hiếu Kỳ"
  festival.002.desc: "Một cái kéo nhẹ nơi tay áo khiến sự chú ý của ta rời khỏi cảnh hội — cúi xuống nhìn, ánh mắt ta gặp ánh mắt tròn xoe đầy kinh ngạc của một đứa trẻ.\n\n\"Vì sao lại có nhiều người đến thế?\" [curious_child.GetSheHe] hỏi với sự tò mò ngây thơ. \"Đang xảy ra chuyện gì vậy?\""
  festival.002.a: "À, để ta kể cho ngươi nghe một câu chuyện..."
  festival.002.a.inspired_child: "[curious_child.GetSheHe|U] có vẻ rất háo hức lắng nghe"
  festival.002.a.bored_child: "Đứa trẻ không thích nghe kể chuyện"
  festival.002.b: "Cha mẹ ngươi chưa dạy rằng không được nói chuyện với người lạ sao?"
  festival.002.b.flavor: "#weak Đứa nhóc hỗn xược này xứng đáng nhận một \"phần thưởng\" cho sự vô lễ của nó.#!"
  festival.002.c: "Có ai đưa [curious_child.GetHerHim] về lại với cha mẹ [curious_child.GetHerHis] đi. #EMP Nhanh#!."

  child_is_excited: "Đứa trẻ vô cùng phấn khích trước những câu chuyện của ngươi"
  child_is_bored: "Đứa trẻ ngáp dài rồi bỏ đi khi ngươi còn đang nói"
  child_is_kicked: "Một cú tát tai nhanh khiến đứa trẻ chạy biến vào đám đông"

  festival.003.t: "Những Món Ngon Quyến Rũ"
  festival.003.desc: "Mùi [ROOT.Char.Custom('GetLocalStreetFoodPlural')] bay từ các quầy hàng, thì thầm những lời hứa ngọt ngào và đậm đà với cái bụng đang réo của ta.\n\nMột hàng người dài dằng dặc chứng tỏ nhu cầu lớn lao dành cho những món này, nhưng hẳn chủ nhân của ngày hội cũng xứng được hưởng #EMP chút#! đặc quyền chứ?"
  festival.003.a: "Tránh đường cho [ROOT.Char.GetTitleAsNameNoTooltip]!"
  festival.003.b: "Hãy để dân chúng tận hưởng niềm vui nhỏ bé của họ."

  festival.004.t: "Những Điều Ước Thầm Thì"
  festival.004.desc: "Khách khứa tụ tập quanh bụi trúc, những cành cây mang theo các mảnh giấy ghi điều ước của chủ nhân.\n\nDưới ánh sao dịu nhẹ, dân chúng gửi gắm ước mơ của mình tới các đấng tình nhân nơi thiên thượng, và ta chợt nghĩ rằng chính ta cũng có một điều ước muốn gửi đi."
  festival.004.a: "Cầu mong chư thần ban phúc thịnh vượng và sung túc cho tất cả."
  festival.004.b: "Ta ước có một tình yêu vĩnh cửu như những vì sao."
  festival.004.c: "Hãy ban cho ta sức lực để thực hiện tham vọng của mình."
  festival.004.d: "Ta mong sớm tìm được tình yêu."
  prosperity_festival_in_province_modifier: "Điều Ước Thịnh Vượng"
  prosperity_festival_in_province_modifier_desc: "Những vì sao dường như đang ưu ái vùng đất này, và vị lãnh chúa đã cầu chúc thịnh vượng cho tất cả"
  prosperity_festival_find_love_modifier: "Điều Ước Tình Yêu"
  prosperity_festival_find_love_modifier_desc: "Nhân vật này đã cầu mong tìm được tình yêu"
  prosperity_festival_health_modifier: "Điều Ước Sức Khỏe"
  prosperity_festival_health_modifier_desc: "Nhân vật này đã cầu mong sức khỏe"

  festival.005.t: "Thính Giả Bất Đắc Dĩ"
  festival.005.desc: "Khi lễ hội tiến gần đến cao trào, [target.chaplain.Custom('MyPriestTitle')] của ta bước lên sân khấu, giọng [target_chaplain.GetHerHis] vang dội trên đám đông. [target_chaplain.GetSheHe|U] bắt đầu ca ngợi cải cách đạo đức và kỷ luật tinh thần, cố gắng chuyển nguồn năng lượng vui tươi của lễ hội thành một bài giảng đạo. Có người thấy lời [target_chaplain.GetHerHis] đầy cảm hứng, nhưng cũng có kẻ càu nhàu rằng lễ hội không phải nơi dành cho sự nghiêm nghị như vậy."
  festival.005.a: "[target_chaplain.GetSheHe|U] đang nói thay ý chỉ của thần linh."
  festival.005.b: "Chính ta sẽ nói cho [target_chaplain.GetHerHim] hiểu lẽ phải."
  festival.005.c: "Ta đã chán ngấy bài diễn thuyết này; kéo [target_chaplain.GetHerHim] xuống ngay!"
  festival.005.b.success: "Ngươi khiến [target_chaplain.GetHerHim] rời khỏi sân khấu"
  festival.005.b.tt.success: "Ngươi đã thuyết phục được [target_chaplain.GetHerHim]"
  festival.005.b.failure: "Lòng nhiệt thành do thần linh hun đúc của [target_chaplain.GetHerHis] vẫn không hề suy giảm"
  festival.005.b.tt.failure: "Ngươi không thuyết phục được [target_chaplain.GetHerHim]"

  festival.006.t: "Nghi Lễ Thanh Tẩy"
  festival.006.desc: "Khi những lời cầu nguyện trang nghiêm kết thúc, các [ROOT.Char.GetFaith.PriestNeuterPlural] bắt đầu nghi thức thanh tẩy, nhằm rửa sạch mọi ô uế tâm linh và đảm bảo một năm hài hòa phía trước. Là một phần của nghi lễ, trách nhiệm thiêng liêng của ta là múc nước tinh khiết từ giếng thánh."
  festival.006.a: "Hôm nay, khiêm nhường tốt hơn kiêu hãnh."
  festival.006.b: "Một màn phô trương xa hoa lúc này có thể nâng cao thanh danh của ta."
  festival.006.c: "Hãy để kẻ thấp kém hơn làm việc này; thân phận ta không hợp."

  festival.007.t: "Cuộc Tranh Tài Dưới Ánh Trăng"
  festival.007.desc: "Khi mặt trăng lên đến đỉnh trời, nửa đêm cũng vừa điểm, và cùng lúc đó bắt đầu một cuộc thi sức mạnh vốn luôn được dân chúng ưa thích. [ROOT.Char.GetFaith.PriestMale] sẽ ném những thanh gậy vào giữa đám đông, và theo truyền thống, ai bước ra khỏi cuộc tranh giành với một thanh trong tay sẽ nhận được vận may lớn trong năm tới."
  festival.007.a: "Vận may ấy sẽ thuộc về ta!"
  festival.007.b: "Ta sẽ để kẻ khác mệt trước, rồi lặng lẽ giành chiến thắng."
  festival.007.c: "Có những cuộc thi chỉ nên đứng xem."
  festival.007.a.success: "Ngươi áp đảo các đối thủ"
  festival.007.a.failure: "Các đối thủ áp đảo ngươi"
  festival.007.b.success: "Ngươi dùng mưu trí vượt qua các đối thủ"
  festival.007.b.failure: "Các đối thủ không mắc lừa"
  festival.007.a.tt.success: "Ngươi Thắng"
  festival.007.a.tt.failure: "Ngươi Thua"

  festival.008.t: "Vũ Điệu Sung Túc"
  festival.008.desc: "Không khí rung lên bởi tiếng sáo réo rắt và tiếng trống dồn dập, trong khi những [dancer.GetWomenMen] trẻ tuổi uyển chuyển múa trong những bộ y phục rực rỡ bay lượn.\n\nChính màn trình diễn thanh nhã ấy, làm hài lòng cả phàm nhân lẫn thần linh, sẽ ban phúc cho mảnh đất dưới chân chúng ta một mùa màng bội thu."
  festival.008.a: "Một điệu múa thật tuyệt mỹ."
  festival.008.b: "Nhìn họ, ta cảm thấy tâm hồn bình yên."
  respected_tradition_modifier: "Tôn Trọng Truyền Thống"

  festival.009.t: "Điều Ước Trên Cây"
  festival.009.desc: "Tại [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitlyNoTooltip] có một phong tục địa phương: dân chúng viết những điều ước chân thành nhất của mình lên giấy rồi treo lên cây.\n\nNhìn kỹ hơn, ta thấy phần lớn điều ước đều quen thuộc — giàu sang, tình yêu, thịnh vượng — nhưng trong số đó cũng có vài mảnh giấy ghi những mong cầu đen tối."
  festival.009.a: "Biết được suy nghĩ sâu kín của kẻ khác là một lợi thế lớn."
  festival.009.b: "Ác ý không có chỗ trên những cành cây này."

  festival.010.t: "Phúc Lành Bằng Giấy"
  festival.010.desc: "Con phố rực rỡ sắc màu, vô số vật trang trí tung bay trong gió. Tiếng reo hò và tiếng cười vang khắp nơi khi dân chúng ngắm nhìn hàng hóa của các nghệ nhân. Có lẽ ta cũng nên mua một món cho mình?"
  festival.010.a: "Một bộ hạc giấy đầy màu sắc, nhắc nhở về tầm quan trọng của gia đình."
  festival.010.b: "Một chiếc kimono giấy gấp tinh xảo, biểu tượng của sức khỏe."
  festival.010.c: "Cứ để kẻ khác trang sức như vậy; sự giản dị hợp với ta hơn."
  good_health_modifier: "Cuộc Sống Khỏe Mạnh"
  good_health_modifier_desc: "Nhân vật này đã mua một món trang trí kimono giấy."
  strong_family_modifier: "Sợi Dây Gia Đình"
  strong_family_modifier_desc: "Nhân vật này đã mua một món trang trí hạc giấy."

  festival.012.t: "Cuộc Vui Náo Nhiệt"
  festival.012.desc: "Đèn lồng thắp sáng buổi hội đêm khi không khí rung động bởi âm nhạc và những tràng cười. Cảnh tượng trước mắt khiến lòng ta cũng bị khuấy động."
  festival.012.a: "Niềm vui giản dị của họ xoa dịu tâm hồn."
  festival.012.b: "Sự náo nhiệt này thật khiến tinh thần phấn chấn."
  festival.012.c: "Âm thanh hỗn độn khiến ta choáng váng — ta chỉ mong được yên tĩnh."
  festival_spirit_modifier: "Tinh Thần Lễ Hội"
  festival_spirit_modifier_desc: "Tinh thần của nhân vật này đã được tiếp thêm sinh khí bởi bầu không khí lễ hội."

  festival.014.t: "Những Ngày Tay Áo Nhảy Múa"
  festival.014.desc: "Hôm nay là dịp để ăn mừng, nhưng cũng là lúc cầu xin phúc lành của thần linh. Ánh mắt của cả phàm nhân lẫn thần thánh đều dõi theo hành vi và lễ vật của chúng ta, vì vậy mọi thứ phải được chuẩn bị chu toàn."
  festival.014.a: "Cầu mong chư thần nhìn chúng ta với lòng ưu ái."

  festival.016.t: "Danh Dự Bị Hoen Ố"
  festival.016.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('clumsy_oaf'))] của ta, [clumsy_oaf.GetFirstName], đứng chết lặng trong kinh hoàng khi cả hai chúng ta cùng nhìn xuống rượu sake đang nhỏ giọt từ áo bào của ta, tấm y phục xa hoa ấy đã sẫm màu vì vết loang đang lan rộng.\n\nNhững kẻ xung quanh đứng sững lại vì tò mò, che giấu phản ứng sau những chiếc quạt vẽ sặc sỡ, chờ đợi — không, mong chờ — một cơn bùng nổ sắp xảy ra."
  festival.016.a: "Đồ ngu bất cẩn! [clumsy_oaf.GetSheHe|U] sẽ phải trả giá vì chuyện này!"
  festival.016.b: "Áo bào thì có thể thay."

  festival.017.t: "Những Con Rối Nổi Loạn"
  festival.017.desc: "Một gã múa rối lang thang đã quyết định biến lễ hội thành sân khấu của [puppeteer.GetHerHis], xung quanh là hàng chục khán giả cười khúc khích.\n\nKhi ta nhìn những con rối nhảy múa, màn diễn bắt đầu mang một sắc thái khó chịu — hình tượng vị quân chủ quyền lực trông quá quen thuộc với ta, và đám đông dường như quá thích thú trước sự vụng về của [ROOT.Char.GetHerHis]."
  festival.017.a: "Ta sẽ cười to hơn bất kỳ ai!"
  festival.017.b: "Đốt sạch lũ búp bê láo xược này."
  festival.017.c: "Bảo mật thám của ta quan sát phản ứng của đám đông."

  festival.018.t: "Xuất Thần Và Cống Phẩm"
  festival.018.desc: "Nữ tư tế của đền run rẩy dữ dội như thể bị nhập hồn, giọng nói siêu phàm của nàng cất lên những mệnh lệnh thiêng liêng.\n\nCó vẻ vị thần này đặc biệt ưa thích rượu sake — và là số lượng không hề nhỏ. Từ chối có thể xúc phạm một thực thể quyền năng, nhưng ta không khỏi tự hỏi liệu đây là nghi lễ thần thánh hay chỉ là một màn trình diễn phạm thượng."
  festival.018.a: "Mang sake đến, chúng ta cùng uống!"
  festival.018.b: "Hay chỉ một chén nhỏ cùng lời mời..."
  festival.018.c: "Trò diễn này kết thúc tại đây."
  friend_invited_priestess: "[CHARACTER.GetShortUIName|U] đã mời [TARGET_CHARACTER.GetShortUIName] gia nhập triều đình của [CHARACTER.GetHerHis] sau khi chứng kiến màn trình diễn ấn tượng của [TARGET_CHARACTER.GetHerHis] tại lễ hội."
  friend_invited_priestess_corresponding: "[CHARACTER.GetShortUIName|U] đã được mời đến triều đình của [TARGET_CHARACTER.GetShortUINamePossessive] sau khi chứng kiến màn trình diễn ấn tượng của [CHARACTER.GetHerHis] tại một lễ hội."

  festival.019.t: "Vở Kịch Theo Chiếu Lệnh"
  festival.019.desc: "Quản gia của ta, [play_planner.GetFirstName], cúi mình cung kính trước mặt ta. \"Sẽ có một vở kịch, thưa [ROOT.Char.Custom('FormOfAddressForLiege')],\" [play_planner.GetSheHe] nói. \"Nhưng chọn câu chuyện nào là đặc quyền của ngài.\" Liệu đó nên là một câu chuyện giải trí cho dân chúng, hay nhắc nhở họ về vị trí của mình?"
  festival.019.a: "Hãy để đó là thiên sử ca về vinh quang của gia tộc ta."
  festival.019.b: "Một vở kịch đạo đức sẽ dạy họ đức hạnh của sự phục tùng."
  festival.019.c: "Hãy dâng nó lên các vị thần để cầu phúc."

  festival.020.t: "Vinh Quang Phi Mã"
  festival.020.desc: "Con sông lấp lánh dưới ánh nắng giữa trưa khi các cung thủ cưỡi lên ngựa, còn bên kia dòng nước những người hầu giơ cao mục tiêu: một chiếc quạt giấy.\n\nỞ đâu đó, tiếng trống vang lên, trong khoảnh khắc lấn át tiếng bàn tán và cá cược xem cung thủ nào sẽ giành chiến thắng."
  festival.020.a: "Chuẩn bị ngựa cho ta — phần thưởng sẽ thuộc về ta!"
  festival.020.b: "Ta cũng đặt cược một phen!"
  festival.020.c: "Cứ để họ bắn, nhưng mang cho ta một mảnh quạt làm bùa may."

  festival.021.t: "Diễu Hành Quỷ Dị"
  festival.021.desc: "Nhịp điệu quen thuộc của lễ hội bất chợt bị phá vỡ khi những \"quỷ dữ\" đeo mặt nạ xuất hiện, cầm đuốc cháy rực và tung tàn lửa vào đám đông đang chạy tán loạn. Gần đó, các tư tế chuẩn bị phản công — nghi thức chiến thắng quen thuộc trước những linh hồn tà ác."
  festival.021.a: "Chính ta sẽ dẫn đầu cuộc \"phản công\" này!"
  festival.021.b: "Đảm bảo mỗi nhà đều chuẩn bị sẵn thùng nước."
  festival.021.c: "Dù là truyền thống, nguy cơ cháy nổ vẫn quá lớn."

  festival.022.t: "Xô Xát Lễ Hội"
  festival.022.desc: "Hai nhóm [rumbler_one.GetWomenMen] từ những ngôi làng lân cận đã tụ họp tại lễ hội để giải quyết mâu thuẫn theo truyền thống — nâng kiệu của mình lên cao rồi đâm sầm vào kiệu đối thủ nhằm quật nó xuống đất.\n\nMảnh gỗ văng tung tóe sau mỗi cú va chạm! Tiếng reo hò cuồng nhiệt của đám đông khiến các đấu thủ càng lao vào những cú đụng độ dữ dội hơn."
  festival.022.a: "Ta sẽ không cho phép bạo lực, dù là truyền thống!"
  festival.022.b: "Kẻ thắng cuộc sẽ được ban thưởng hậu hĩnh!"
  festival.022.c: "Nếu đám đông muốn xem trò náo nhiệt, họ phải trả tiền."

  festival.023.t: "Đoàn Rước Lâm Nguy"
  festival.023.desc: "Tiếng trống da hươu vang rền báo hiệu đoàn rước nghi lễ bắt đầu. Những người cầm cờ dẫn đầu đoàn diễu hành trong trang phục lễ hội rực rỡ, theo sau là chiếc kiệu uy nghi được nâng cao trên vai những người khiêng.\n\n\"Coi chừng!\" Một người khiêng kiệu hét lên khi buông tay, khiến chiếc kiệu nghiêng đi nguy hiểm, phá tan cảnh tượng trang nghiêm."
  festival.023.a: "Giữ vững, ta đến đây!"
  festival.023.b: "Đánh đòn tên ngu đó, và bắt làng hắn nộp phạt."

  festival.024.t: "Vũ Điệu Gậy Gỗ"
  festival.024.desc: "#EMP RẮC!#! #EMP RẮC!#! Những âm thanh vang dội ấy hẳn sẽ khiến mọi tà linh phải tháo chạy! Trước mặt ta, những thanh niên trong làng tiếp tục dậm chân và đập gậy gỗ với khí thế của những chiến binh hung mãnh.\n\nTruyền thống hào hứng này có thể hữu ích ở những nơi khác nếu những cây gậy ấy được thay bằng giáo."
  festival.024.a: "Đánh dấu những kẻ khỏe nhất — ta có thể dùng những người như vậy."
  festival.024.b: "Độ chuẩn xác của họ thật đáng nể!"
  festival.024.c: "Thật là một màn phô trương sức mạnh."

