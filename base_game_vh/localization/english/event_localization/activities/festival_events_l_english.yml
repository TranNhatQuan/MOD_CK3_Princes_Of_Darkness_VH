  festival_shamed_me: "Làm Ta bẽ mặt"

  festival.107.t: "Những Cuộc Phiêu Lưu Ái Tình"
  festival.107.desc: ""[ROOT.Char.GetTitledFirstNameNoTooltip]!" [target_character2.GetTitledFirstName] gọi ta khi ta đi ngang, vẫy ta lại gần nhóm của [target_character2.GetHerHis].\n\n"Ngài có nghe chuyện đã xảy ra giữa [target_character.GetTitledFirstName] và [courtier_host.GetTitledFirstNamePossessive] [courtier_host.Custom2('RelationToMeShort', SCOPE.sC('character_of_rumor'))], [character_of_rumor.GetTitledFirstName] chưa?" [target_character2.GetSheHe] thì thầm, "Ta có lý do để tin rằng [target_character.GetSheHe] đã vào đến tận phòng riêng của [character_of_rumor.GetHerHis], nhưng tên hầu ta mua chuộc được chẳng nói thêm gì nữa."\n\nGia nhân dĩ nhiên là nguồn tin đồn #EMP nổi tiếng#! đáng tin, nhưng dù những lời này thật hay giả, đây vẫn là cơ hội tuyệt vời để ảnh hưởng đến danh tiếng của [target_character.GetTitledFirstNamePossessiveNoTooltip]."
  festival.107.a: "Ồ, #EMP ta#! nghe rằng [character_of_rumor.GetSheHe] đã để [target_character.GetHerHim] đứng ngoài cửa suốt cả đêm!"
  festival.107.b: "Họ thấy không nhiều, nhưng chắc chắn #EMP nghe#! được không ít!"
  festival.107.c: "Nếu ngài thích những chiến tích ái tình, bằng hữu của ta còn nhiều chuyện hơn thế."

  festival_embarrassed_me: "Làm Ta xấu hổ"
  festival_reinforced_group_cohesion: "Củng cố gắn kết"
  festival_enhanced_amorous_reputation: "Tăng danh tiếng phong lưu"

  festival.108.t: "Đọc Giữa Những Nếp Gấp"
  festival.108.desc: "Ta thấy [target_character2.GetTitledFirstName] tiến lại, ánh mắt lấp lánh tinh nghịch. "Ta nhặt được thứ này dưới bóng đình," [target_character2.GetSheHe] nói. "Ta nhớ rõ chỉ vài giờ trước nó còn trong tay [target_character.GetTitledFirstNamePossessive], và trên đó có khắc một thông điệp rất... #EMP gợi ý#!."\n\n"Chúng ta #EMP có thể#! trả lại cho [target_character.GetHerHim]... #EMP hoặc#! ta có thể sắp xếp để nó được 'gửi' thật nổi bật cho người khác dưới danh nghĩa của [target_character.GetHerHis]. Chẳng hạn [target_character4.GetTitledFirstName], [target_character3.Custom2('RelationToMeShort', SCOPE.sC('target_character4'))] của [target_character.GetHerHis] [target_character3.Custom('MistressMaster')], [target_character3.GetTitledFirstName]?"" 
  festival.108.a: "Ý hay! Cứ làm vậy."
  festival.108.b: "Đưa nó đây, ta sẽ tự mình trả lại #EMP tận tay#!."
  festival.108.c: "Hãy giữ chuyện này giữa chúng ta thôi."

  festival.109.t: "Thi Phú Trong Cảnh Éo Le"
  festival.109.desc: "Một làn cười rộ kéo ta đến nơi một nhóm nhỏ đang tụ quanh hai người quen. "Ngâm cho chúng ta một bài thơ đi, [target_character2.GetTitledFirstName]!" [target_character.GetTitledFirstName] thúc giục, giọng đầy mỉa mai khó giấu. "Chắc ngươi ít nhất cũng làm được #EMP một#! bài chứ?"\n\n[target_character2.GetFirstNameNoTooltip], kẻ nổi tiếng có tâm hồn thi ca cứng như đá, nhìn ta với ánh mắt cầu cứu của con thú bị dồn vào góc."
  festival.109.a: "Chúng ta đối thơ. Ta mở đầu, rồi #EMP ngươi#! tiếp theo, [target_character.GetFirstNameNoTooltip]."
  festival.109.b: "Hãy khiến chúng ta kinh ngạc với tài trí của ngươi, [target_character2.GetFirstNameNoTooltip]."
  festival.109.c: "Nếu tìm nghệ thuật chân chính, hãy nhìn vào #EMP chúng ta#!."

  opposed_me: "Chống đối Ta"
  helped_me: "Giúp Ta"
  compelled_poetry: "Bị ép làm thơ"
  festival_praised_poetic_prowess: "Ca ngợi tài thi phú"

  festival.114.t: "Bị Bỏ Lại Trên Bờ"
  festival.114.desc: "Khi ta cùng bằng hữu hít thở không khí đêm, chúng ta bắt gặp [target_character.GetTitledFirstName] đang nhìn xuống mặt nước với vẻ tiếc nuối.\n\nThoạt đầu ta tưởng hắn say mê vẻ đẹp phản chiếu của trăng, nhưng tiếng ồn từ một nhóm người vui chơi gần đó khiến ta chú ý. Hóa ra họ đã lên thuyền rời đi, bỏ lại tội nghiệp [target_character.GetTitledFirstName] phía sau!"
  festival.114.a: ""Quên bọn họ đi, lại đây với chúng ta!""
  festival.114.b: ""Thật đáng thương! Cảm giác bị vứt bỏ như món đồ hỏng ra sao?""
  festival.114.c: "#EMP Chúng ta#! sẽ không bao giờ bỏ rơi người của mình."

