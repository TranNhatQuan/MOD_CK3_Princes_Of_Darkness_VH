  festival.105.c.success: "Ngươi vừa giải đố vừa khiến những người đố khác bối rối"
  festival.105.c.success.toast: "Buổi đố vui thành công rực rỡ"
  festival.105.c.failure: "Phần thể hiện của ngươi không ấn tượng"
  festival.105.c.failure.toast: "Buổi đố vui biến thành tranh cãi vụn vặt"

