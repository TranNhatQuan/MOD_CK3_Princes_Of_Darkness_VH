  festival.105.t: "Thử Thách Trí Tuệ"
  festival.105.desc: "Một tờ giấy, viết bằng nét chữ tao nhã, treo lơ lửng trên cành cây. "[target_character.GetTitledFirstName] đã đưa ra cho chúng ta một câu đố!" [target_character2.GetTitledFirstName] kêu lên.\n\n"Một thử thách," [target_character3.GetTitledFirstName] đáp. "[target_character.GetSheHe|U] cho rằng [target_character.GetHerselfHimself] là kẻ thông minh nhất trong chúng ta. Người đã hứa rằng ai giải được trước sẽ nhận bất cứ ân huệ nào họ mong muốn từ [target_character.GetHerHim]; #EMP rõ ràng#! [target_character.GetSheHe] không mong ai trong chúng ta làm được.""
  festival.105.a: "Ta sẽ giải câu đố này, và cùng lúc phá tan sự ngạo mạn của [target_character.GetTitledFirstNamePossessiveNoTooltip]!"
  festival.105.b: "Thật là câu đố khó lường! Trí tuệ của [target_character.GetHerHis|U] quả thật vô song."
  festival.105.c: "Khởi đầu cho một cuộc thi trí tuệ!"

  festival.105.a.success: "Ngươi giải được câu đố một cách đáng kinh ngạc"
  festival.105.a.success.toast: "Ngươi nhanh chóng giải được câu đố"
  festival.105.a.failure: "Ngươi bó tay trước câu đố"
