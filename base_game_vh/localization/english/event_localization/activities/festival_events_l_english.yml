  festival_toasted_head_house_log: "[CHARACTER.GetHouse.GetName] đã nâng chén chúc tụng [TARGET_CHARACTER.GetHouse.GetName]"

  festival.103.t: "Lưỡi Lời Khoe Khoang"
  festival.103.desc: "Khi ta và những người đồng hành trôi theo đám đông, ta nghe thấy một giọng nói lớn.\n\n\"$language_chinese_name$ của ta thật #EMP tinh tế#!!! Tại sao chứ, chỉ mới một nửa tháng trước [target_character2.GetTitledFirstName] đã đưa khả năng thi ca của ta vào thử thách, và đã phải cúi đầu trước nghệ thuật của ta!\" [target_character.GetTitledFirstName] khoe khoang.\n\nTa không nhớ có tin đồn nào về việc [target_character.GetHerHim] sở hữu kỹ năng làm thơ; nhưng việc ủng hộ tuyên bố của [target_character.GetHerHis] có thể giúp ta có lợi thế. Mặc dù vậy, việc làm cho một kẻ khoác lác phải im lặng đúng chỗ của [target_character.GetHerHis] thật khó mà cưỡng lại."
  festival.103.a: ""[target_character.GetSheHe|U] nói không sai.""
  festival.103.b: ""Xin cho chúng ta chiêm ngưỡng tài nghệ của ngài, [target_character.GetTitledFirstNameNoTooltip].""
  festival.103.c: "Tài nghệ của #EMP bằng hữu ta#! còn cao hơn nhiều."
  friend_defended_talents: "[CHARACTER.GetShortUIName|U] đã bênh vực những lời khoe khoang ngạo mạn của [TARGET_CHARACTER.GetShortUINamePossessive|U] tại một lễ hội."
  friend_defended_talents_corresponding: "Những tuyên bố kiêu ngạo của [TARGET_CHARACTER.GetShortUINamePossessive|U] đã được [CHARACTER.GetShortUIName|U] hậu thuẫn tại một lễ hội."

