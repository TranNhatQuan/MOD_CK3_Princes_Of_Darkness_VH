  festival.101.t: "Tay Áo Thơm Hương"
  festival.101.desc: "Còn lâu mới thấy được [target_character.GetTitledFirstName], nhưng chắc chắn người ta đã #EMP ngửi thấy#! [target_character.GetHerHim] rồi. Mặc dù việc thấm đẫm y phục bằng hương liệu thơm #EMP là#! phong tục, nhưng hiệu quả hiếm khi nào được dự định để cảm nhận được từ khoảng cách trăm bước chân tính từ người đeo.\n\nCó lẽ một tờ giấy ghi chú kín đáo là cần thiết, mặc dù một lời thì thầm vào tai người khác có thể đảm bảo tật xấu này sẽ còn tồn tại rất lâu sau khi mùi hương đã phai nhạt."
  festival.101.a: "Sai người khéo léo... và có chiếc mũi kém nhạy."
  festival.101.b: "Mọi người #EMP phải#! biết chuyện này."

  appreciated_discretion: "Cảm kích sự kín đáo"
  harmed_my_reputation: "Làm tổn hại danh tiếng của Ta"
  festival_odious_odor: "Mùi hôi khó chịu"

  festival.102.t: "Nâng Chén Cao"
  festival.102.desc: "Sau một ngày lễ hội vui vầy, hoàng hôn buông xuống và cuộc ăn mừng #EMP thực sự#! mới bắt đầu, rượu của chủ nhân chảy như dòng sông không dứt.\n\nMỗi chén lại mời thêm một chén khác, rồi lại thêm nữa. [target_character2.GetTitledFirstName] buông một câu đùa mà ta chỉ nghe kịp đoạn cuối, nhưng [target_character.GetTitledFirstName] dường như thấy buồn cười mãi không thôi. Có lẽ thêm chút rượu nữa sẽ giúp ta thấy cái thú vị trong đó..."
  festival.102.a: "Rượu khơi dậy điều gì đó trong ta; một khúc thơ sắp thành hình!"
  festival.102.b: "Chén này ta nâng kính vị cao quý [target_character.GetTitledFirstNameNoTooltip]!"
  festival.102.c: "Ta nghĩ đêm nay mình đã uống đủ rồi."

  festival_impressive_poetry: "Thi tài ấn tượng"
  festival_bad_poetry: "Thơ tệ hại"
