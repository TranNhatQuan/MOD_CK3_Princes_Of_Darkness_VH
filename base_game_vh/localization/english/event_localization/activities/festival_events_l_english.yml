  festival_praised_poetic_talents: "Ca ngợi tài thi phú"

  festival.104.t: "Lạc Giữa Đám Đông"
  festival.104.desc: "Mỗi buổi tụ hội đều có lúc thịnh lúc suy, người ta phải cẩn trọng với dòng chảy ấy kẻo tự mình bị bỏ lại.\n\nKhi [target_character3.GetTitledFirstName] quay sang chào [target_character4.GetTitledFirstName], ta bỗng thấy mình lạc giữa đám đông, chẳng còn ai trò chuyện.\n\nỞ cách đó không xa, ta thấy [target_character.GetTitledFirstName] và [target_character2.GetTitledFirstName] nhìn về phía ta và thì thầm sau chiếc quạt của họ."
  festival.104.a: "Ta sẽ mạnh dạn tiến tới."
  festival.104.b: "Vài lời thì thầm của ta có thể gieo nên vài ý tưởng #EMP thú vị#!."
  festival.104.c: "Để ta quay lại với bằng hữu."

  festival.104.a.success: "Ngươi gây ấn tượng với cách tiếp cận táo bạo"
