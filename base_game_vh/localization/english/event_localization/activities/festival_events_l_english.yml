  festival.106.t: "Hôn Lễ Cáo"
  festival.106.desc: "Ta may mắn được đứng dưới bóng râm của đình khi cơn mưa ào xuống giữa bầu trời nắng — người ta gọi đó là hôn lễ của cáo.\n\nThan ôi, tội nghiệp [target_character.GetTitledFirstName] lại hứng trọn cơn mưa, lạch bạch chạy vào trú với dáng vẻ chẳng khác gì một con mèo ướt sũng.\n\n"Ta cầu xin ngài, cho ta thay y phục!" [target_character.GetSheHe] van nài. "[target_character2.GetTitledFirstName] đang tiến về phía này, nếu bị nhìn thấy trong bộ dạng này thì ta thật mất mặt.""
  festival.106.a: "Thị tùng của ta sẽ mang đến vài thứ."
  festival.106.b: "Ta sẽ đánh lạc hướng [target_character2.GetHerHim], mau chạy đi!"
  festival.106.c: "[target_character2.GetFirstNameNoTooltip] hẳn sẽ thấy chuyện này #EMP khá#! thú vị."

  festival.106.b.success: "Ngươi đã thành công đánh lạc hướng [target_character2.GetTitledFirstName]"
  festival.106.b.success.toast: "Ngươi có một cuộc trò chuyện dễ chịu với [target_character2.GetTitledFirstName]"
  festival.106.b.failure: "[target_character2.GetTitledFirstName] nhận ra có điều gì đó không ổn"
  festival.106.b.failure.toast: "[target_character2.GetTitledFirstNameNoTooltip] nghi ngờ ngươi"

  festival_enjoyed_talk: "Thích thú trò chuyện"
