  festival.1000.t: "Bằng Hữu Danh Giá"
  festival.1000.desc: "Lặng lẽ thưởng thức nhịp điệu thong thả của lễ hội, ta cùng [bloc_member_head_1.GetTitledFirstName] của nhà [bloc_member_head_1.GetHouse.GetBaseName] và [bloc_member_head_2.GetTitledFirstName] của nhà [bloc_member_head_2.GetHouse.GetBaseName] trao đổi lời xã giao và bánh kẹo dưới bóng râm."
  festival.1000.outro: "\n\nCả ba chúng ta đều thuộc hàng quý tộc hàng đầu trong vương quốc, và những dịp có thể tự nhiên giao lưu như vậy thật hiếm hoi."
  festival.1000.a: ""Gia tộc ta thật may mắn khi được bầu bạn cùng những người cao quý như vậy.""
  festival.1000.b: ""Nhà [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] luôn nằm trong số bằng hữu đáng kính của ta.""
  festival.1000.c: "[bloc_member_head_1.GetFirstNameNoTooltip], ngươi có thích cúi đầu trước nhà [bloc_member_head_1.GetHouse.GetConfederation.GetLeadingHouse.GetBaseNameNoTooltip] không?"
  festival.1000.e: ""Trang viên nhà [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] thật đáng chiêm ngưỡng.""
  festival.1000.f: ""Năm nay nhà [bloc_member_head_2.GetHouse.GetBaseNameNoTooltip] thể hiện thật ấn tượng.""
  festival.1000.g: "Những khoảnh khắc như thế này nên được tận hưởng."

  festival.2000.t: "Chia Tay"
  festival.2000.intro_desc: "Khi cuộc vui đêm tàn và nhường chỗ cho những tia nắng đầu tiên của bình minh, những người tham dự tận hưởng những khoảnh khắc cuối cùng trước khi trở lại với trách nhiệm thường ngày.\n\n"
  festival.2000.intro_part_two: "[friendly_attendee.GetTitledFirstName], [ROOT.Char.Custom2( 'RelationToMeShort', friendly_attendee )] của ta, tiến lại gần. "Những ngày qua được bầu bạn cùng ngài thật đáng quý," [friendly_attendee.GetSheHe] dừng lại với nụ cười ấm áp.\n\n"
  festival.2000.bloc_invitation: ""Chính vì thế mà ta và đồng liêu muốn gửi lời mời: ngài có thể xem mình là một phần trong hàng ngũ của chúng ta, và chúng ta cũng sẽ luôn đứng sau ngài.""
  festival.2000.befriending: ""Thật vinh hạnh nếu trong tương lai ngài coi ta là người tri kỷ.""
  festival.2000.nobody_likes_you: "Dòng người lảo đảo no say rời khỏi nơi nghỉ dần thưa thớt, chẳng mấy chốc chỉ còn lại ta và đoàn tùy tùng."

  festival.2000.a_accept: "Ngài có thể trông cậy vào sự ủng hộ của ta, như ta cũng sẽ trông cậy vào ngài."
  festival.2000.a_decline: "Ta cảm tạ, nhưng ta hài lòng với hiện tại."
  festival.2000.b_accept: "Những mối giao tình như vậy thật hiếm, đáng để trân trọng."
  festival.2000.b_decline: "Ta trân trọng thiện ý của ngài, nhưng phải từ chối."
  festival.2000.c: "Những niềm vui thoáng qua này sẽ còn trong ký ức chúng ta."

