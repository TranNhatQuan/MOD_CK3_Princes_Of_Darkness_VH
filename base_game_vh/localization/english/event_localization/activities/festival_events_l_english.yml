  festival.100.t: "Dưới Đêm Trăng"
  festival.100.desc: "Sứ giả mời ta đến bữa tiệc ngắm trăng của [target_character.GetTitledFirstNamePossessive] vừa mới rời đi thì một người khác lại đến, lần này mang theo bức thư mời ta tham gia bữa tiệc của [target_character2.GetTitledFirstName] thay thế!\n\nThời điểm như vậy #EMP khó có thể#! là sự trùng hợp ngẫu nhiên. Mỗi bên rõ ràng đều muốn thăm dò ta, và việc chấp nhận một lời mời sẽ bị coi là dấu hiệu cho thấy sự đồng cảm của ta với người gửi, đồng thời cũng là sự khinh miệt đối với đối thủ của [target_character.GetHerHis]."
  festival.100.a: "Ta sẽ ban vinh dự cho [target_character.GetTitledFirstNameNoTooltip] bằng sự hiện diện của ta."
  festival.100.b: "Có lẽ ta thích bầu bạn cùng [target_character2.GetTitledFirstNamePossessiveNoTooltip] hơn."
  festival.100.c: "Gửi lời cáo lỗi tới cả hai, kèm theo chút lễ vật tỏ lòng kính trọng."
  festival.100.d: "Chi bằng chính ta tổ chức một buổi tụ hội và vượt trội cả hai!"

