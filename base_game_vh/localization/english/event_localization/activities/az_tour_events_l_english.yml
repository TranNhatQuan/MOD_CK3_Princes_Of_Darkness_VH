l_english:

  az_tour.0001.t: "Một Học Giả Ngâm Vịnh"
  az_tour.0001.desc: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] giơ tay ra hiệu im lặng khi các gia nhân dọn những món ăn cuối cùng. Từ bên cạnh [stop_host_scope.GetHerHim], [scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] bước lên và, với giọng điệu chừng mực, bắt đầu ngâm một bài thơ — những câu từ tao nhã về sự trôi qua của thời gian và gánh nặng của đức hạnh.\n\nKhi tràng vỗ tay lắng xuống, [stop_host_scope.GetTitledFirstNameNoTooltip] quay sang tôi với nụ cười. "Vậy trái tim ngài sẽ dâng lên những lời nào, [ROOT.Char.GetTitledFirstNameNoTooltip]?"
  az_tour.0001.a.diplomacy: "Nói về cách sự hòa hợp duy trì vương quốc."
  az_tour.0001.a.martial: "Lập luận rằng đức hạnh phải được bảo vệ bằng sức mạnh."
  az_tour.0001.a.stewardship: "Suy ngẫm về gánh nặng của việc cai trị chính trực."
  az_tour.0001.a.intrigue: "Gợi ý rằng [stop_host_scope.GetTitleAsName] thừa nhận quyền lực thầm lặng."
  az_tour.0001.a.learning: "Đưa ra một lời chú giải dựa trên kinh điển."
  az_tour.0001.a.fallback: "Đáp lại bằng một cách diễn giải đầy suy tư."
  az_tour.0001.b: "Ngâm một bài thơ ngắn về sự vô thường."
  az_tour.0001.c: "Đưa ra một bài diễn thuyết về khát vọng vươn lên."

  az_tour.0002.t: "Cái Giá Của Sự Tinh Tế"
  az_tour.0002.desc: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] bước tới với nụ cười và trao một chiếc hộp sơn mài, buộc bằng dải ruy băng từ loại vải [stop_host_scope.Custom('RegionalFabric')] thượng hạng.\n\n"Thật đáng xấu hổ nếu để [ROOT.Char.Custom('FormOfAddressForLiege')] rời đi mà không có chút tín vật từ lòng kính trọng của tôi," [stop_host_scope.GetSheHe] nói. "Bên trong là vài món nhỏ — đồ sơn mài được đánh bóng, một bài thơ cổ viết bằng nét bút mềm mại, và trầm hương từng được ưa chuộng trong những đại sảnh của quan lại cấp cao."\n\nCử chỉ thật tao nhã. Nhưng ánh bạc của những khay đựng, vân gỗ hiếm của các tấm [ROOT.Province.Custom('GetRandomRegionalWood')] — chúng cho thấy nguồn lực vượt quá những gì vị trí này đáng lẽ có thể chi trả. Tôi lại nhìn món quà. Nó thật... xa xỉ."
  az_tour.0002.a: ""Một món quà thật tao nhã. Tôi rất vinh hạnh.""
  az_tour.0002.b: ""Gu thẩm mỹ của ngài thật tinh tế... gần như đáng nghi.""
  az_tour.0002.c: ""Tôi không thể, với lương tâm mình, nhận món này.""

  az_tour.0003.t: "Lời Thì Thầm Trong Chén Rượu"
  az_tour.0003.desc: "Khi [stop_host_scope.Custom('RegionalDrink')] được rót tràn và cuộc trò chuyện trôi quanh tôi, [servant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bước tới rót thêm vào chén của tôi. Nhưng thay vì chỉ rót, những ngón tay của [servant.GetHerHis] khẽ nhét một mảnh giấy gấp vào tay tôi — rồi biến mất nhanh như khi [servant.GetSheHe] đến.\n\nDưới bàn, tôi mở nó ra. Một cái tên. Một hành động. Một bê bối. Liên quan đến chủ nhà của tôi: [stop_host_scope.GetTitledHouseNameOrFirstName]. Mảnh giấy rất ngắn, nhưng hàm ý thì không thể nhầm lẫn.\n\nVà ở bên kia bàn, [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mỉm cười, hoàn toàn không hay biết."
  az_tour.0003.a: "Ta sẽ giữ chuyện này... cho riêng mình, lúc này."
  az_tour.0003.b: "Chuyện này không nên bị im lặng."
  az_tour.0003.b.tt: "[stop_host_scope.GetTitledHouseNameOrFirstName] sẽ phản ứng theo tính cách của [stop_host_scope.GetHerHis]."
  az_tour.0003.c: "Có những chuyện tốt hơn nên để yên."
  az_tour.0003.d: "Ta sẽ đem chuyện này thẳng lên cấp trên!"

  az_tour.1003.t: "Lời Thì Thầm Trong Chén Rượu"
  az_tour.1003.desc: "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] khẽ ra hiệu cho tôi theo [visiting_liege.GetHerHim] tới gian phòng bên cạnh, đúng lúc gia nhân bắt đầu dọn sang món tiếp theo.\n\n"[ROOT.Char.GetFirstName]," [visiting_liege.GetSheHe] bắt đầu, giọng nói mềm mại nhưng sắc như thép. "Một bức thư đã đến tay ta — mực còn chưa khô. Nó kể về vài... sự thất thố. Người ta có thể bỏ qua những lời đồn ấy, nếu chúng không được thì thầm bởi nhiều hơn một cái miệng."\n\nBên ngoài, tiếng bát đĩa va chạm và tiếng cười khe khẽ vẫn tiếp diễn, tấm bình phong hắt những bóng rung rinh lên sàn gỗ bóng loáng."
  az_tour.1003.a: ""Là dối trá và vu khống. Ta không muốn nghe thêm lời nào nữa!""
  az_tour.1003.b: ""Ngài sẽ có sự im lặng của ta... và cả những gì đi kèm với nó.""
  az_tour.1003.c: "Một gia tài để khiến ngài im lặng."
  az_tour.1003.d: ""Ta sẽ từ bỏ yêu sách của mình.""
  az_tour.1003.e: ""Ta mua sự im lặng của ngài bằng chính sự im lặng của ta.""

  az_tour.0004.t: "Một Vấn Đề Cai Trị"
  az_tour.0004.desc.intro: "Giữa những miếng ăn và những ngụm [stop_host_scope.Custom('RegionalDrink')] lịch sự, cuộc trò chuyện trên bàn bỗng trở nên căng thẳng. [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nêu ra một vấn đề cấp bách về quản trị — không trực tiếp nói với tôi, nhưng rõ ràng đủ lớn để tôi nghe thấy.\n\n"
  az_tour.0004.desc.stewardship: ""Chúng ta không thể để thêm một đồng xu nào mất vì sự ngu ngốc," [stop_host_scope.GetTitledHouseNameOrFirstName] khẳng định. "Ngân sách phát triển phải được dùng nơi mang lại lợi ích lớn nhất."\n\n"Thế mà đường sá nứt vỡ và kênh mương cạn khô trong khi kho bạc vẫn nằm yên," [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] phản bác."
  az_tour.0004.desc.martial: ""Doanh trại của tôi thiếu ngựa, vậy mà ngài lại nói đến áo giáp diễu hành?" [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] nói lạnh lùng.\n\n"Kỷ luật bắt đầu từ niềm tự hào về vị trí của mình," [stop_host_scope.GetTitledHouseNameOrFirstName] đáp lại, nhướng mày."
  az_tour.0004.desc.learning: ""Phương pháp đo đạc đất đai mới này có sự hậu thuẫn từ những văn bản đáng tin," [stop_host_scope.GetTitledHouseNameOrFirstName] lập luận, giọng chắc chắn.\n\n"Thế nhưng chưa có học giả nào ở đây bảo đảm cho tính đúng đắn của nó," [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] đáp lại lạnh lùng."
  az_tour.0004.a: "Ta phải đồng ý với đánh giá của chủ nhà."
  az_tour.0004.b.stewardship: "Ngân sách cân bằng phục vụ tất cả — ta đề xuất một thỏa hiệp."
  az_tour.0004.b.stewardship.tt: "Chuyển một phần thặng dư cho việc sửa chữa khẩn cấp, phần còn lại cho đầu tư dài hạn. Tiết kiệm không nhất thiết phải là bỏ bê."
  az_tour.0004.b.martial: "An ninh phải thực tế, không phải phô trương. Để ta góp lời."
  az_tour.0004.b.martial.tt: "Trang bị doanh trại vì chức năng, không phải phô trương — áo giáp dùng cho chiến trường và đủ ngựa cho tuần tra. Vinh quang đến từ kỷ luật, không phải vàng son."
  az_tour.0004.b.learning: "Hãy để lý trí lên tiếng. Ta đề xuất một giải pháp hợp lý."
  az_tour.0004.b.learning.tt: "Thử phương pháp mới tại một khu vực dưới sự quan sát cẩn thận. Nếu hiệu quả, hãy mở rộng. Nếu không, hãy loại bỏ — như mọi học thuyết tốt đều phải chấp nhận."
  az_tour.0004.c: "Đây là bữa tiệc tối, không phải hội trường tranh luận."

  az_tour.0005.t: "Một Nốt Nhạc Gãy"
  az_tour.0005.desc: "Sự im lặng bao trùm cả hội trường khi một nhạc công gảy một nốt quá mạnh — một âm thanh chói tai vang lên giữa những tiếng thì thầm như một cái tát. Giai điệu chết lặng.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] cứng đờ tại chỗ.\n\n\"À — tôi xin lỗi,\" nhạc công lắp bắp, cúi thấp người với nhạc cụ trên tay đang run rẩy. Một vài vị khách dừng lại giữa chừng khi đang nhấp [stop_host_scope.Custom('RegionalDrink')], nhìn quanh một cách không chắc chắn.\n\n[stop_host_scope.GetTitledHouseNameOrFirstName] cố gắng nở một nụ cười, nhưng vệt đỏ trên má [stop_host_scope.GetHerHis] là không thể nhầm lẫn. \"Một sự cố nhỏ thôi,\" [stop_host_scope.GetSheHe] nói một cách nhẹ nhàng, giọng căng thẳng. \"Đừng để mất niềm vui của buổi tối vì chuyện này.\""
  az_tour.0005.a: ""Một màn trình diễn tuyệt vời, dù có chút sự cố!""
  az_tour.0005.b: ""Chúng ta mới chỉ bắt đầu thôi; mang [ROOT.Char.Custom('GetMusicalInstrument')] của ta đến!""
  az_tour.0005.c: ""Thật ra ta cũng chẳng để ý lắm.""

  az_tour.1005.t: "Một Giai Điệu Cao Hơn"
  az_tour.1005.desc: "Một tiếng rắc — rồi im lặng. Cây [ROOT.GetCharacter.Custom('GetMusicalInstrument')] gãy giữa nốt nhạc, và sự im lặng sững sờ sau đó còn chói tai hơn cả âm nhạc. Một người biểu diễn khác lỡ nhịp. Người thứ ba ho lúng túng. Buổi diễn sụp đổ, từng nốt sai một.\n\nTrước khi tôi kịp đứng lên hay gọi người thay thế, [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bước tới và nhấc một cây [visiting_liege.Custom('GetMusicalInstrument')] khỏi hộp. Không phô trương, không tuyên bố — chỉ là sự tự tin lặng lẽ của một người quen được lắng nghe.\n\nNhững nốt đầu tiên trôi ra như làn hương trầm, chậm rãi và dò tìm. Cuộc trò chuyện lắng xuống. Ly rượu hạ xuống. Ngay cả gia nhân cũng dừng lại. [visiting_liege.GetTitleAsNameNoTooltip], từng là khách của tôi, giờ đây làm chủ cả đại sảnh bằng âm nhạc.\n\nVà khi hợp âm cuối cùng rung lên rồi tan vào im lặng, tất cả những gì tôi có thể làm là ngồi đó, cảm nhận sức nặng của nó."
  az_tour.1005.a: "Một màn trình diễn tuyệt vời vô song — thật tráng lệ!"
  az_tour.1005.b: "Thật điêu luyện! Ta cảm thấy được thôi thúc phải hoàn thiện bản thân hơn."
  az_tour.1005.c: ""Màn trình diễn này không xứng với địa vị của [visiting_liege.GetHerHis].""
  az_tour.1005.c.toast: "[stop_host_scope.GetTitledHouseNameOrFirstName] chỉ trích màn trình diễn của bạn"

  az_tour.0006.t: "Một Sự Quấy Rầy Vô Lễ"
  az_tour.0006.desc: "Một tiếng hét xé tan tiếng cười và âm nhạc của lễ hội. Một [angry_farmer.GetWomanMan] trong bộ quần áo sờn cũ lao về phía trước, khuôn mặt đỏ bừng vì phẫn nộ. [angry_farmer.GetSheHe|U] đứng vững và nâng cao giọng nói át cả đám đông.\n\n\"Chúng tôi làm việc vất vả trên đồng ruộng, nhưng tất cả tiền bạc đều dồn vào lụa là và yến tiệc! Ngài ngồi dưới ánh đèn, uống [stop_host_scope.Custom('RegionalDrink')] — nhưng ai là người quan tâm đến những người như chúng tôi với cái bát rỗng?\"\n\nLễ hội im bặt. [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] liếc nhìn ta — thận trọng, và rõ ràng là không hài lòng."
  az_tour.0006.a: ""Chuyện này sẽ được xem xét. Ta hứa.""
  az_tour.0006.b: ""Lễ hội không phải nơi để than phiền.""
  az_tour.0006.c: ""Uống chút [stop_host_scope.Custom('RegionalDrink')] cho nguôi giận đi.""
  tgp_heard_complaints_modifier: "Đã Lắng Nghe Khiếu Nại"
  tgp_heard_complaints_modifier_desc: "Người cai trị quận này đã lắng nghe những lời than phiền của thần dân"
  tgp_dismissed_complaints_modifier: "Phớt Lờ Khiếu Nại"
  tgp_dismissed_complaints_modifier_desc: "Người cai trị quận này đã phớt lờ những lời than phiền của thần dân"

  az_tour.1006.t: "Một Sự Quấy Rầy Vô Lễ"
  az_tour.1006.desc.intro: "Quảng trường chợ rộn ràng âm nhạc và tiếng ồn của lễ hội, nhưng không phải mọi giọng nói đều mang niềm vui. Một nông dân địa phương, mặt đỏ gay và kích động, chen qua đám đông, trừng mắt nhìn [stop_host_scope.GetTitledHouseNameOrFirstName]."
  az_tour.1006.desc.a: ""Chúng tôi làm việc quần quật ngoài đồng, nhưng tiền bạc lại đổ vào lụa là và yến tiệc! Các ngài ngồi dưới đèn lồng, uống [stop_host_scope.Custom('RegionalDrink')] — nhưng ai đang nghĩ cho những người bát còn trống như chúng tôi?"\n\nGương mặt chủ nhà căng lại, nhưng [stop_host_scope.GetSheHe] đáp lại bình tĩnh, hứa sẽ bồi thường và giao cho một quản gia xử lý thiệt hại."
  az_tour.1006.desc.b: ""Chúng tôi làm việc quần quật ngoài đồng, nhưng tiền bạc lại đổ vào lụa là và yến tiệc! Các ngài ngồi dưới đèn lồng, uống [stop_host_scope.Custom('RegionalDrink')] — nhưng ai đang nghĩ cho những người bát còn trống như chúng tôi?"\n\n[stop_host_scope.GetSheHe|U] nở nụ cười chậm rãi đầy khinh miệt. "Cái bát của ngươi không phải việc của ta. Lính đâu, bắt tên [angry_farmer.Custom2('InsultNoun', ROOT.Char)] này!" Tiếng kinh hãi lan qua đám đông khi người nông dân bị lính của [stop_host_scope.GetFirstNamePossessiveNoTooltip] bắt giữ và kéo đi, những lời nguyền rủa của [angry_farmer.GetHerHis] dần chìm trong tiếng nhạc."
  az_tour.1006.desc.c: "\"Chúng tôi làm việc vất vả trên đồng ruộng, nhưng tất cả tiền bạc đều dồn vào lụa là và yến tiệc! Ngài ngồi dưới ánh đèn, uống [stop_host_scope.Custom('RegionalDrink')] — nhưng ai là người quan tâm đến những người như chúng tôi với cái bát rỗng?\"\n\n\"[stop_host_scope.GetSheHe|U] giơ tay lên nhẹ nhàng, giọng điệu bình tĩnh nhưng kiên quyết. \"Chúng ta tụ họp trong hòa bình. Hãy để cơn giận dịu xuống và những chiếc cốc được làm đầy — ta tin rằng chúng ta có thể lắng nghe lời than phiền của ngươi mà không cần sự gián đoạn.\" Người nông dân cử động một cách khó chịu, sự phẫn nộ vẫn còn trong mắt [angry_farmer.GetHerHis], nhưng giọng điệu của [angry_farmer.GetHerHis] dịu lại dưới sức nặng của sự trang trọng.\""
  az_tour.1006.a: ""Một thái độ xứng đáng với vị [stop_host_scope.Custom('ComplimentAdjective')] [stop_host_scope.GetTitleAsNameNoTooltip]!""
  az_tour.1006.a.toast: "[visiting_liege.GetTitleAsNameNoTooltip] đã lên tiếng ủng hộ cách xử lý của bạn"
  az_tour.1006.b: ""Ta hẳn sẽ xử lý chuyện đó theo cách khác.""
  az_tour.1006.b.toast: "[visiting_liege.GetTitleAsNameNoTooltip] không tán thành phản ứng của bạn với người nông dân"
  az_tour.1006.c: ""Xin lỗi, ta đã mải mê với điệu múa đầy sắc màu này.""
  az_tour.1006.c.toast: "[visiting_liege.GetTitleAsNameNoTooltip] phớt lờ sự náo động và giữ thái độ riêng cho mình"

  az_tour.0007.t: "Lời Tâng Bốc Nở Hoa"
  az_tour.0007.desc: "Dưới tán cây nở hoa được thắp sáng bởi những chiếc đèn lồng, một người hầu cận xướng tên [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)]. Họ bước lên phía trước, ôm một cuộn giấy với nét vẽ tinh xảo. Những ngọn núi vẽ từ lụa nhô lên, đỉnh núi đội vương miện với những hàng cây nở hoa, trong khi những dòng chữ mềm mại uốn lượn bên cạnh — một sự kết hợp của hài hòa và sức mạnh.\n\n\"Những ngọn đồi có thể sụp đổ,\" [elegant_noble.GetSheHe] nói với một nụ cười khiêm tốn, \"nhưng mùa xuân luôn quay trở lại — ngay cả khi chỉ trong một hơi thở. Đây,\" [elegant_noble.GetSheHe] tiếp tục, giữ ánh mắt của ta, \"là sự phản ánh sự cai trị của ngài, [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\nSự nghệ thuật là không thể phủ nhận, cảm xúc đầy sự tâng bốc. [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nghiêng đầu [stop_host_scope.GetHerHis] một cách tán thành lặng lẽ, chờ đợi câu trả lời của ta."
  az_tour.0007.a: ""Thật cân bằng! Chỉ riêng nét bút cũng xứng đáng một chức vị.""
  az_tour.0007.b: ""Khi xuân qua, lời khoe khoang của ngươi cũng vậy.""
  az_tour.0007.c: ""Nghệ thuật thật sự ở đây là sự nịnh hót, không phải hoa.""
  tgp_mocked_elites_modifier: "Chế Giễu Giới Tinh Hoa"

  az_tour.1007.t: "Đóa Hoa Tàn"
  az_tour.1007.desc: "Không khí nặng trĩu với nước hoa và thơ ca — mỗi từ được chọn lựa, mỗi cử chỉ được tập dượt. Các triều thần nghiêng người về phía trước khi [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)] hoàn thành khổ thơ cuối cùng, giọng của [elegant_noble.GetHerHis] vương vấn, ngọt ngào như khói hương trầm.\n\n[visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] nở một nụ cười chậm rãi, đầy chủ ý. \"Thật duyên dáng,\" [visiting_liege.GetSheHe] nói, giọng mượt mà như sơn mài. \"Có một sức quyến rũ nhất định trong sự trung thực mang tính địa phương như vậy.\" Trước khi ta kịp thở, những lời thì thầm bắt đầu — một tiếng xào xạc dọc theo các băng ghế, những chiếc quạt được nghiêng để che giấu những cái nhếch mép. [visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] nghiêng đầu, nụ cười chậm rãi và đầy chủ ý, như thể đang thưởng thức sự khó chịu của ta."
  az_tour.1007.a: "Cứ để [visiting_liege.GetHerHim] cười, nếu [visiting_liege.GetSheHe] muốn."
  az_tour.1007.b: "[visiting_liege.GetSheHe] đang làm nhục người của ta!"

  az_tour.0008.t: "Nét Bút và Phán Xét"
  az_tour.0008.desc: "Theo lời yêu cầu của ta, [revered_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] ngồi xuống dưới mái lều lụa, một đám đông tụ lại gần để quan sát. Cầm bút trong tay, [revered_scholar.GetSheHe] bắt đầu chép lại từ kinh điển một cách cẩn trọng, từng ký tự được viết ra với sự kiên nhẫn cho đến khi tờ giấy dường như thở cùng ý nghĩa.\n\nSẽ rất đáng nói, phải không, nếu [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] là người phán xét tác phẩm này? Chỉ một lời nhận định trước bao nhiêu ánh mắt, và sự tinh tường của [visiting_liege.GetHerHis] sẽ được phô bày rõ ràng."
  az_tour.0008.a: "Mời [visiting_liege.GetTitledHouseNameOrFirstName] đánh giá màn trình diễn."
  az_tour.0008.a.tt: "Bạn sẽ được thưởng tùy theo đánh giá của lãnh chúa về màn trình diễn"
  az_tour.0008.b: "Hãy để [visiting_liege.GetTitledHouseNameOrFirstName] thưởng thức trong yên lặng."

  az_tour.1008.t: "Nét Bút Lên Tiếng"
  az_tour.1008.desc.intro: "Ta được đưa đến dưới tán lụa bởi [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)], nơi một đám đông đã tập trung. \"[revered_scholar.GetTitledHouseNameOrFirstName] sẽ cho chúng ta thấy vẻ đẹp của các tác phẩm kinh điển.\" [revered_scholar.GetSheHe|U] cúi chào ta và [stop_host_scope.GetTitledHouseNameOrFirstName] một cách trang trọng, [revered_scholar.GetSheHe] vào vị trí ở giữa và mở một cuộn giấy tinh xảo. Với nhịp điệu cẩn thận, [revered_scholar.GetSheHe] đặt mực lên giấy, từng nét bút chảy tràn vào nét tiếp theo cho đến khi các từ ngữ tạo hình duyên dáng. [stop_host_scope.GetTitleAsNameNoTooltip] nhìn ta chăm chú. \"[ROOT.Char.Custom('FormOfAddressForLiege')], phán xét của ngài mang sức nặng lớn. Ngài có muốn vinh danh nghệ sĩ của chúng ta bằng cách nói lên phán xét của mình trước mặt mọi người không?\"\n\n\""
  az_tour.1008.desc.praise_subtle: "Ta nhận ra sự cân bằng cẩn trọng và chuyển động uyển chuyển trong từng nét bút. Chữ viết mang cảm giác có chủ ý, chừng mực—kỹ năng đi cùng với ý định suy xét."
  az_tour.1008.desc.arrogant_judgment: "Mắt ta bắt gặp sự chính xác của từng ký tự, nhưng có điều gì đó quá gò bó, gần như quá tính toán. Nó thiếu sự ấm áp hay tự nhiên."
  az_tour.1008.desc.shy_discomfort: "Cuộn thư pháp rất đẹp, nhưng một sự căng thẳng lặng lẽ bao trùm không khí. Ta giữ lời nói ngắn gọn và cẩn trọng, không chắc nên bộc lộ bao nhiêu."
  az_tour.1008.desc.generic_comment: "Các dòng chữ rõ ràng và đều đặn. Ta đưa ra một nhận xét dè dặt, cẩn thận không nói vượt quá hiểu biết của mình."
  az_tour.1008.a: ""Một màn trình diễn bậc thầy: tinh tế, cân bằng, sống động.""
  az_tour.1008.a.toast: "The [visiting_liege.GetTitleAsNameNoTooltip] spoke highly of the demonstration"
  az_tour.1008.b: ""Gọn gàng đấy, dù hơi... thôn dã.""
  az_tour.1008.b.toast: "The [visiting_liege.GetTitleAsNameNoTooltip] mocked the demonstration"
  az_tour.1008.c: ""Hình thức đáng khen, nhưng ta cũng phải xét đến tinh thần.""
  az_tour.1008.c.toast: "The [visiting_liege.GetTitleAsNameNoTooltip] lauded the demonstration"
  az_tour.1008.d: ""Xin thứ lỗi. Ta còn việc khác cần lo.""
  az_tour.1008.d.toast: "The [visiting_liege.GetTitleAsNameNoTooltip] refused to judge the demonstration"

  az_tour.0009.t: "Chúng Ta Có Nên Nhảy Không?"
  az_tour.0009.desc: "Mùa này trùng với một truyền thống địa phương: những vũ công đeo mặt nạ, khoác vải lấp lánh và giấy, biểu diễn một điệu múa cổ trước những bàn thờ cổ xưa. Nó mộc mạc — ồn ào, rực rỡ, hỗn loạn — nhưng được yêu mến.\n\n[chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến lại gần khẽ nói. "[visiting_liege.Custom2('MyCharacterIntroduction', chancellor)|U] sắp đến. Có lẽ màn trình diễn này sẽ làm [visiting_liege.GetHerHim] thích thú? Nó giản dị, nhưng chân thành — một cái nhìn thoáng qua vào tâm hồn của người dân."\n\nĐó là một ý kiến hợp lý, nhưng thời gian của chúng ta thì ngắn ngủi và quý giá..."
  az_tour.0009.a: "Hãy để họ chuẩn bị điệu múa."
  az_tour.0009.a.tt: "Bạn sẽ được thưởng tùy theo đánh giá của lãnh chúa về điệu múa"
  az_tour.0009.b: "Thời gian của chúng ta nên dành để bàn về bổn phận."

  az_tour.1009.t: "Điệu Múa Dân Gian"
  az_tour.1009.desc: "Tiếng trống dội vang như vó ngựa, tiếng cười lan qua đám đông. Dưới những lá cờ phấp phới và mùi hương trầm, dân làng khoác lụa sặc sỡ và trang phục ngựa giấy nhảy múa xoay vòng trong một điệu múa dân gian cổ.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã mời ta chứng kiến lễ hội sống động này của di sản [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]. [stop_host_scope.GetSheHe|U] đứng gần đó, niềm tự hào hiện rõ trong nụ cười của [stop_host_scope.GetHerHis]. Khi một vũ công cúi đầu thật thấp trước ta, ta thừa nhận sự kính trọng dành cho địa vị của mình và niềm tin họ đặt vào phán xét của ta."
  az_tour.1009.a: "Ta tiến lại gần các vũ công để vinh danh họ."
  az_tour.1009.a.toast: "The [visiting_liege.GetTitleAsNameNoTooltip] honored the dance"
  az_tour.1009.b: "Một món quà nhỏ, để tôn vinh tài nghệ của họ."
  az_tour.1009.b.toast: "The [visiting_liege.GetTitleAsNameNoTooltip] gifted the dancers"
  az_tour.1009.c: "Tốt hơn ta nên tập trung vào lời cầu nguyện của mình."
  az_tour.1009.c.toast: "The [visiting_liege.GetTitleAsNameNoTooltip] focused on [visiting_liege.GetHerHis] prayers"
  tgp_popular_festival_performance_modifier: "Màn Trình Diễn Lễ Hội Danh Giá"
  tgp_popular_festival_performance_modifier_desc: "Quận này từng có một vị lãnh chúa danh tiếng tán thưởng điệu múa văn hóa của họ trong một lễ hội."
