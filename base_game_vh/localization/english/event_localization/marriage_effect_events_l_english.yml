  marriage_effect.0012.desc.pregnancy:0 "Kể từ ngày Ta biết [real_mother.GetTitledFirstName] mang thai con chúng Ta, Ta đã lo lắng đến phát ốm về tương lai của đứa trẻ. Giờ đây, khi chúng Ta đã chính thức gắn bó, nỗi sợ có thể được xua tan."
  marriage_effect.0012.desc.pregnancy_not_knowing:0 "[real_mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến, đặt tay lên bụng [real_mother.GetHerHis].\n\n\"Trước đây Ta chưa nói với ngươi, nhưng... đứa trẻ Ta đang mang là con của ngươi. Giờ đây khi chúng ta đã chính thức gắn bó, bí mật này sẽ không còn gây hại.\""

  marriage_effect.0013.desc.pregnancy:0 "Kể từ ngày Ta biết [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] mang thai con của [new_spouse.GetTitledFirstNamePossessive], Ta đã giữ bí mật này chặt trong lòng. Giờ đây khi họ đã chính thức gắn bó, Ta có thể yên tâm."
