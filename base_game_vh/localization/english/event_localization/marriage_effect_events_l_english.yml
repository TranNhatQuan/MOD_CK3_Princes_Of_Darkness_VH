l_english:
  marriage_effect.0001.t:0 "Làm Lại Cho Đúng"
  marriage_effect.0001.desc.multiple:0 "Cuối cùng mọi thứ đã trở về đúng như lẽ vốn dĩ. Bí mật bao trùm lên [illegitimate_child.Custom('TwinDaughtersSonsChildren')] của Ta không còn làm hại chúng nữa, giờ đây khi cha của chúng, [new_spouse.GetTitledFirstName], và Ta đã chính thức kết hôn."
  marriage_effect.0001.desc.child:0 "Ta đã trải qua nhiều đêm mất ngủ, lo lắng cho [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] và chuyện gì sẽ xảy ra nếu sự thật về thân phận của [illegitimate_child.GetHerHis] bị lộ.\n\nGiờ khi cha của [illegitimate_child.GetHerHis], [new_spouse.GetTitledFirstName], và Ta đã chính thức kết hôn, nỗi sợ cũ của Ta cuối cùng có thể yên nghỉ."
  marriage_effect.0001.desc.pregnancy:0 "Kể từ ngày Ta biết mình có thai, Ta đã lo lắng đến phát ốm về tương lai của đứa trẻ. Giờ đây Ta được giải tỏa nỗi sợ, khi cha của nó, [new_spouse.GetTitledFirstName], và Ta đã chính thức kết hôn."
  marriage_effect.0001.a:0 "Bí mật này sẽ không ám ảnh Ta nữa."

  marriage_effect.0002.desc.multiple:0 "Cuối cùng mọi thứ đã trở về đúng như lẽ vốn dĩ. Bí mật bao trùm lên [illegitimate_child.Custom('TwinDaughtersSonsChildren')] không còn làm hại chúng hoặc mẹ chúng, [real_mother.GetTitledFirstName], giờ đây khi chúng Ta đã chính thức kết hôn."
  marriage_effect.0002.desc.child:0 "Ta đã trải qua bao đêm không ngủ vì lo lắng cho [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] và điều gì sẽ xảy ra với [illegitimate_child.GetHerHim] nếu sự thật về nguồn gốc của [illegitimate_child.GetHerHis] bị phơi bày.\n\nGiờ đây khi mẹ của [illegitimate_child.GetHerHis], [real_mother.GetTitledFirstName], và ta đã chính thức kết hôn, những nỗi sợ cũ của ta cuối cùng có thể được gác lại."
  marriage_effect.0002.desc.pregnancy:0 "Kể từ ngày Ta biết [real_mother.GetTitledFirstName] mang thai con chúng Ta, Ta đã lo lắng đến phát ốm về tương lai của đứa trẻ. Giờ đây, khi chúng Ta đã chính thức kết hôn, nỗi sợ có thể được xua tan."
  marriage_effect.0002.desc.pregnancy_not_knowing:0 "[real_mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến, đặt tay lên bụng [real_mother.GetHerHis].\n\n\"Trước đây Ta chưa nói với ngươi, nhưng... đứa trẻ Ta đang mang là con của ngươi. Giờ đây khi chúng ta đã chính thức kết hôn, bí mật này sẽ không còn gây hại.\""
  marriage_effect.0001.a_not_knowing:0 "Ồ, Ta– Ta thật vui."

  marriage_effect.0003.desc.pregnancy:0 "Kể từ ngày Ta biết [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] mang thai con của [new_spouse.GetTitledFirstNamePossessive], Ta đã giữ bí mật này chặt trong lòng. Giờ đây khi họ đã chính thức kết hôn, Ta có thể yên tâm."
  marriage_effect.0003.desc.multiple:0 "Ta đã lo lắng cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] và [illegitimate_child.Custom('TwinDaughtersSonsChildren')] của [real_mother.GetHerHis] từ khi chúng chào đời, biết rằng chúng được sinh ra từ mối quan hệ trái phép giữa [real_mother.GetHerHis] và [new_spouse.GetTitledFirstName].\n\nGiờ đây khi [new_spouse.GetTitledFirstName] và [real_mother.GetFirstName] đã chính thức kết hôn, nỗi sợ cũ cuối cùng có thể yên nghỉ."
  marriage_effect.0003.desc:0 "Ta đã lo lắng cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] và [illegitimate_child.Custom('GetDaughterSon')] [illegitimate_child.GetTitledFirstName] của [real_mother.GetHerHis] từ khi đứa trẻ chào đời, biết rằng nó được sinh ra từ mối quan hệ trái phép giữa [real_mother.GetHerHis] và [new_spouse.GetTitledFirstName].\n\nGiờ đây khi [new_spouse.GetTitledFirstName] và [real_mother.GetFirstName] đã chính thức kết hôn, nỗi sợ cũ cuối cùng có thể yên nghỉ."

#For concubines - similar events and text to marriage
  marriage_effect.0011.desc.multiple:0 "Cuối cùng mọi thứ đã trở về đúng như lẽ vốn dĩ. Bí mật bao trùm lên [illegitimate_child.Custom('TwinDaughtersSonsChildren')] không còn làm hại chúng Ta, giờ đây khi cha của chúng, [new_spouse.GetTitledFirstName], và Ta đã chính thức gắn bó."
