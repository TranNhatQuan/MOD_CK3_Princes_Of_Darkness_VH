  marriage_effect.1001.t:0 "Tình Yêu Chiến Thắng"
  marriage_effect.1001.desc:1 "Ôi [spouse.GetTitledFirstName], [spouse.Custom('LoverPetName')] của Ta! Nghĩ rằng Ta có thể ôm Ngài công khai giờ đây, với lời chúc phúc từ cả [ROOT.Char.GetFaith.FertilityGodName] và mọi người xung quanh... Ta là [ROOT.Char.GetWomanMan] hạnh phúc nhất trên đời!"
  marriage_effect.1001.a:0 "Lại đây, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse') )] của Ta!"

  marriage_effect.1002.desc:1 "Ôi [spouse_2.GetTitledFirstName], [spouse_2.Custom('LoverPetName')] của Ta! Nghĩ rằng Ta có thể ôm Ngài công khai giờ đây, với lời chúc phúc từ cả [ROOT.Char.GetFaith.FertilityGodName] và mọi người xung quanh... Ta là [ROOT.Char.GetWomanMan] hạnh phúc nhất trên đời!"
  marriage_effect.1002.a:0 "Lại đây, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse_2') )] của Ta!"


  marriage_effect.2001.t:0 "Lễ Cưới"
  marriage_effect.2001.desc.start_normal:0 "Với hôn lễ của Ta cùng [new_spouse.GetTitledFirstName], chúng Ta được mong đợi sẽ tổ chức một buổi lễ cưới thật xa hoa."
  marriage_effect.2001.desc.start_divine_marriage:0 "Với hôn lễ của Ta cùng [new_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)], cả vương quốc đang háo hức chờ đón một buổi tiếp đón hoành tráng để kỷ niệm sự đoàn tụ của dòng máu thần thánh."
  marriage_effect.2001.desc.start_prison:0 "Tân phu quân của Ta, [new_spouse.GetTitledFirstName], hiện đang bị giam giữ. Dù vậy, hôn lễ vẫn hợp pháp và vương quốc vẫn mong đợi một buổi lễ cưới xa hoa."
  marriage_effect.2001.desc.end:0 "\n\nTa có quyền thu thuế Hỗ Trợ Hoàng Gia trong dịp này, nhưng một số người có thể cho rằng đánh thuế thêm trong thời gian vui vẻ là vô vị..."
  marriage_effect.2001.a:0 "Tất nhiên Ta sẽ thu! Ai tự trả cho đám cưới của mình chứ?"
  marriage_effect.2001.b:0 "Ta để cho thần dân tận hưởng lễ hội mà không lo lắng gì."
