l_english:
  south_asia.0001.t:0 "Một Kỷ Nguyên Mới"
  south_asia.0001.desc:0 "Đám đông hô vang tên Ta khi Ta được thanh tẩy trong dòng nước của suối trời. Ta đứng lên như Chakravarti, vị vua chính đáng và nhân từ của toàn thế giới.\n\n[ROOT.Char.GetFaith.AltPriestTermPlural] của Ta nói rằng đã đến lúc thế giới được dẫn dắt dưới ánh sáng của Ta, nhưng Ta không cần lời đảm bảo của họ. Khi nhìn ra khắp đồng bằng, Ta cảm nhận điều đó trong tâm hồn mình."
  south_asia.0001.a:0 "Thế giới đang gọi tên Ta."

  south_asia.0002.t:0 "Vị Chakravarti"
  south_asia.0002.intro:0 "Đám đông đã đi bộ nhiều ngày, thậm chí nhiều tuần để tham dự buổi lễ. Cả cuộc đời [chakravarti.GetTitledFirstNamePossessive] đã dẫn đến khoảnh khắc này."
  south_asia.0002.text:0 "\n\nTa đứng trầm trồ khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] xuất hiện từ suối linh thiêng. [chakravarti.GetHerHis|U] [chakravarti.GetFaith.AltPriestTermPlural] tuyên bố [chakravarti.GetHerHim] là Chakravarti, [chakravarti.GetLadyLord] nhân từ của chúng ta.\n\nKhông ai có thể tranh cãi rằng [chakravarti.GetSheHe] là vị vua chính đáng của toàn thế giới."
  south_asia.0002.a:0 "Thật vinh dự khi được chứng kiến khoảnh khắc này."
  south_asia.0002.b:0 "Hãy để Ta quỳ trước chân ngài và hân hoan cùng ngài!"

  south_asia.0003.text:0 "\n\nChỉ khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] xuất hiện từ suối linh thiêng, Ta mới thực sự cảm nhận sức mạnh của khoảnh khắc. [chakravarti.GetHerHis|U] [chakravarti.GetFaith.AltPriestTermPlural] tuyên bố [chakravarti.GetHerHim] là Chakravarti, vị vua chính đáng của toàn thế giới.\n\nKhi [chakravarti.GetTitledFirstName] nhìn ra đồng bằng phía dưới, Ta không thể không cảm thấy điều đó là sự thật."
  south_asia.0003.a:0 "Hãy để Ta cùng ngài chiến thắng, bệ hạ!"
  south_asia.0003.b:0 "Vị vua của thế giới sẽ làm gì tiếp theo?"

  south_asia.0004.relevant_religion:0 "Các sứ giả đã đến với số lượng lớn để mang tin tức từ Đế quốc Ấn Độ. Lần đầu tiên trong một thời đại, một Chakravarti đã xuất hiện."
  south_asia.0004.desc:0 "Các sứ giả từ đất Ấn Độ đã đến đông đảo, công bố sự xuất hiện của Chakravarti, ca ngợi [chakravarti.GetHerHis] lòng nhân từ."
  south_asia.0004.text:0 "\n\nVới các nghi lễ trọng thể và đám đông tín đồ dưới chân [chakravarti.GetHerHis], [chakravarti.GetTitledFirstName] đã đảm nhận vai trò vị vua chính đáng của toàn thế giới."
  south_asia.0004.a:0 "[chakravarti.GetSheHe] sẽ là mối đe dọa mới hay là đồng minh vĩ đại?"
  south_asia.0004.b:0 "[ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] có thể giữ lấy những lời nói vô lý của họ!"

  south_asia.0011.t:0 "Dòng Nước Linh Thiêng"
  south_asia.0011.desc:0 "Suốt cả ngày, từ bình minh đến hoàng hôn, Ta đứng đến ngang thắt lưng trong dòng sông. Múc nước bằng tay, Ta đưa nước lên trời, rồi thả rơi. Lặp đi lặp lại.\n\nTa run rẩy khi trở lại bờ, nơi được các [ROOT.Char.GetFaith.PriestNeuterPlural] phụ tá chào đón. Ta đã thề bảo vệ không chỉ dòng nước hôm nay chảy qua tay Ta, mà toàn bộ con sông, và qua đó, sự tồn tại vĩnh hằng."
  south_asia.0011.a:0 "Không ai có thể nghi ngờ sự tận tụy của Ta đối với [ROOT.Char.GetFaith.HighGodName]."

  south_asia.0012.desc:0 "Với quyền kiểm soát toàn bộ dòng sông Hằng, [ruler_of_ganges.GetTitledFirstName] đã tuyên bố bảo hộ tinh thần cho dòng nước linh thiêng. Đây là một quyền lực chưa từng có ai tuyên bố, nhưng [ruler_of_ganges.GetFaith.PriestNeuterPlural] đã xác nhận điều đó."
  south_asia.0012.a.like:0 "Dường như sự tồn tại vĩnh hằng có một người bảo hộ mới."
  south_asia.0012.a.dislike:0 "Như thể ai đó sẽ tôn trọng một kẻ cơ hội như [ruler_of_ganges.GetHerHim]!"

  south_asia.0013.t:0 "Mục Đích Thiêng Liêng Bị Chiếm"
  south_asia.0013.desc:0 "Với việc mất lãnh thổ, quyền lực của Ta trên sông Hằng không còn được dân chúng và [ROOT.Char.GetFaith.PriestNeuterPlural] trong lãnh thổ tôn trọng! Thay vào đó, [ruler_of_ganges.GetTitledFirstName] đã chiếm vị trí mà Ta từng giữ như Quản Gia Dòng Sông Linh Thiêng."
  south_asia.0013.a:0 "Kẻ mới nổi ấy chẳng là gì ngoài một kẻ gian lận!"

  south_asia.0021.t:0 "[founder.GetTitleAsNameNoTooltip] của $k_bene_israel$"
  south_asia.0021.desc:0 "Bị buộc sống du mục và sinh sống trong các khu nhỏ khắp thế giới, người Do Thái đã thiếu một quê hương. Những thế kỷ lang thang cuối cùng dường như đã kết thúc.\n\n[founder.GetNameNoTooltip] đã được tôn làm [founder.GetTitleAsNameNoTooltip] của $k_bene_israel$. Dù khó tin, người Do Thái dường như đã tìm thấy quê hương dọc bờ Tây Ấn Độ, với [founder.GetFaith.ReligiousHeadTitleName] được phục hồi và tuyên bố Israel mới, [founder.GetTitledFirstNameNoTooltip] tin rằng [founder.GetHerselfHimself] đang mở ra một kỷ nguyên vàng mới cho người Do Thái trên toàn thế giới."
  south_asia.0021.a:0 "Một quê hương mới cho chúng Ta!"
  south_asia.0021.b:0 "Chỉ có một Israel!"
  south_asia.0021.c:0 "Thật là một lễ đăng quang khó tin."
 
 
  south_asia.0030.t:0 "Lan Truyền Đức Tin Theravada"
  south_asia.0030.desc:0 "Dù chúng Ta là một trong những pháo đài cuối cùng của giáo lý Theravada, quý tộc vẫn tiếp tục nhiệt tình theo đạo. Tuy nhiên, dân thường vẫn giữ niềm tự hào với truyền thống, và việc thờ cúng các thần Nat tà ác vẫn phổ biến.\n\nMột vị vua khôn ngoan có thể thấy hợp lý khi thỏa hiệp, nhưng có lẽ cần một cách tiếp cận cứng rắn hơn..."
  south_asia.0030.a:0 "Những nông dân ngây ngô này cần được khuất phục!"
  south_asia.0030.b:0 "Họ có thể thờ các thần cũ, trong giới hạn."
  south_asia.0030.c:0 "Ta sẽ xử lý việc này sau."
  south_asia.0030.a.tt:0 "Tất cả các hạt trong vùng Burma"
  south_asia.0030.a.ari.tt:0 "Tất cả chư hầu Ari"
  south_asia.0030.b.theravada.tt:0 "Tất cả chư hầu Theravada"

  south_asia.0031.t:0 "Tình Hình Tôn Giáo Leo Thang"
  south_asia.0031.desc:0 "Là kẻ xâm nhập văn hóa đã khó, nhưng khẳng định bá quyền tôn giáo còn khó hơn. Dân chúng tức giận, và có không ít lời xỉ nhục khi nhắc tên Ngài trong giới quý tộc truyền thống, [ari_vassal.GetTitledFirstName] cũng vậy.\n\nTa có thể mở lòng như hòa giải, hoặc nắm tay thành nắm đấm của một vị vua không khoan nhượng. Hoặc, Ta có thể rút hoàn toàn và để lửa tự tắt theo thời gian. Ta phải chọn khôn ngoan..."
  south_asia.0031.a:0 "Đàn áp dân nghèo, và nhận diện kẻ bảo vệ họ."
  south_asia.0031.b:0 "Chúng ta không thể để hủy hoại lãnh thổ."
  south_asia.0031.c:0 "Gửi thông điệp. Thi hành công khai với kẻ cầm đầu."
  south_asia.0031.d:0 "Ta đã làm hết khả năng của mình."
  south_asia.0031.a.tt:0 "Tất cả các hạt"
  south_asia.0031.b.theravada:0 "Tất cả chư hầu Theravada"
  south_asia.0031.c.all.tt:0 "Tất cả chư hầu còn lại"

  south_asia.0032.t:0 "Căng Thẳng Tôn Giáo Hạ Nhiệt"
  south_asia.0032.desc:0 "Các vị thần dân gian Burma vẫn còn vững chắc, đặc biệt ở nông thôn. Loại bỏ quyền thờ cúng tự do của dân sẽ gây hại nhiều hơn, vì vậy việc đưa vị thần thứ ba mươi bảy — Thagyamin, thần bảo hộ Phật giáo — vào đền thờ như vị thần đầu tiên được đón nhận hoàn toàn thuận hòa.\n\nCơ hội vàng hiện ra trước mắt Ngài. Trung tâm truyền thống của Phật giáo [ROOT.Char.GetFaith.GetAdjective] nằm ở Lanka, nhưng luôn bị đe dọa bởi các thế lực đất liền. Hoặc, đây có thể là lúc quyết định con đường cho đức tin mới mạnh mẽ của chúng ta."
  south_asia.0032.a:0 "Mời tị nạn tôn giáo từ Lanka đến triều đình."
  south_asia.0032.b:0 "Chúng ta sẽ là người giám hộ duy nhất của [ROOT.Char.GetFaith.GetNameNoTooltip]."
  south_asia.0032.a.tt:0 "Khách Lanka đến"
  south_asia.0032.a.ruler.tt:0 "Tất cả các vua Theravadan Sinhala"
  south_asia.0032.a.lankan:0 "Người tị nạn tôn giáo Lanka đã đến triều đình"

  south_asia.0033.t:0 "Ý Chí Tôn Giáo Được Áp Đặt"
  south_asia.0033.desc:0 "Những kẻ nổi loạn tôn giáo đã biến mất. Những ai dám chống lại bị trừng trị, nhưng phần lớn giữ im lặng vì sợ bị đàn áp. Các lãnh đạo tôn giáo [ari_vassal.GetFaith.GetAdjective] chạy ra vùng nông thôn để tiếp tục nghi lễ thờ cúng.\n\nCâu hỏi giờ đây là với những người từng công khai ủng hộ, giờ lại im lặng."
  south_asia.0033.a:0 "Tất cả triều thần phải thừa nhận sự theo đuổi đức tin chân chính!"
  south_asia.0033.b:0 "Đủ máu đã đổ; để họ đi."
  south_asia.0033.c:0 "Ngài đã có cơ hội. Vệ binh!"
 
  south_asia.0034.t:0 "Xung Đột Tôn Giáo Tránh Được"
  south_asia.0034.desc:0 "Đẩy đất nước đến bờ vực nội chiến để bảo vệ đức tin thể hiện lòng nhiệt thành, nhưng biết khi nào rút tay thể hiện lòng từ bi. Dân vẫn lẩm bẩm, nhưng mặc kệ.\n\nSự chia rẽ tôn giáo ở thung lũng Irrawaddy vẫn còn, nhưng ít nhất quyền cai trị của Ta vẫn nguyên vẹn, và khả năng chuyển đổi thêm bằng phương pháp thông thường vẫn có thể."
  south_asia.0034.a:0 "Siddhārtha Gautama sẽ đồng ý với lòng từ bi của Ta."
  south_asia.0034.b:0 "Và chúng ta sẽ tiếp tục chuyển đổi họ."
  south_asia.0034.counties:0 "Tất cả các hạt"
  south_asia.0034.vassals:0 "Tất cả chư hầu"
  south_asia.0034.aricounties:0 "Tất cả hạt Ari"
 
  south_asia.0035.t:0 "Bảo Tồn Đất Thánh Theravadan"
  south_asia.0035.desc:0 "Mọi tín đồ chân chính của Phật có thể hiểu tầm quan trọng linh thiêng của việc bảo tồn lời dạy. Kinh Pāli, dù được viết hàng trăm năm sau khi Siddhārtha Gautama qua đời, là tập hợp chính xác nhất lời Phật dạy còn biết đến.\n\nVới âm mưu chính trị trên đất Ấn, mối đe dọa ngày càng tăng đến sự an toàn của các kinh này ở vùng đất [ROOT.Char.GetFaith.GetAdjective] trên bán đảo Lanka. Ta phải hành động!"
  south_asia.0035.a:0 "Chúng ta sẽ cử các [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] trung thành giúp bảo tồn đức tin."
  south_asia.0035.b:0 "Gửi sứ giả và đề nghị kết giao hữu nghị."
  south_asia.0035.b.theravada.tt:0 "Tất cả vua độc lập Theravadan"
  south_asia.0035.a.lanka:0 "Tất cả hạt ở Lanka"
 
  south_asia.0036.t:0 "Xử Lý Các Ari"
  south_asia.0036.desc:0 "Với tương lai của đức tin ngoài thung lũng Irrawaddy đã an toàn, câu hỏi còn lại là phải làm gì với các tu sĩ [ari_faith.GetName] còn quyền lực lớn nhưng khoe khoang lối sống hưởng lạc. Ảnh hưởng của họ có thể bị giảm, nhưng không thể coi thường.\n\nNhững lãnh đạo tôn giáo uống rượu, hiến sinh động vật phải được xử lý, nhưng khéo léo để tránh gây ra mối đe dọa với hòa bình còn mong manh trong vùng."
  south_asia.0036.a:0 "Người dân cần biết tội lỗi của họ. Chia rẽ để trị."
  south_asia.0036.b:0 "Họ có thể cải đạo, hoặc chạy trốn vào rừng núi."
  south_asia.0036.b.tt:0 "Tất cả hạt khác ở Burma"
 
  south_asia.0037.t:0 "Đức Tin Được Bảo Vệ"
  south_asia.0037.desc:0 "Khi quyền lực cuối cùng của các tu sĩ tan biến, cảm giác như trút bỏ gánh nặng. Quan hệ tôn giáo trong vương quốc hòa hợp, đức tin thịnh vượng, và dân chúng nhìn Ta như lãnh đạo cả về chính trị lẫn tâm linh.\n\nCuộc hành trình vĩ đại của Ta kết thúc, và lãnh thổ của Ta xứng đáng được gọi là pháo đài thực sự của đức tin [ROOT.Char.GetFaith.GetName] mạnh mẽ và lành mạnh."
  south_asia.0037.a:0 "Chúng ta sẽ xây dựng đức tin hơn nữa!"
  south_asia.0037.b:0 "Ta chỉ làm theo ý muốn của Đức Phật."
  south_asia.0037.b.tt:0 "Tất cả chư hầu"

  south_asia.0038.t:0 "Sự Phân Chia Lớn"
  south_asia.0038.desc:0 "Trong nhiều năm nay, các tín đồ trên khắp Thung lũng Irrawaddy đã phải vật lộn với một sự chia rẽ tôn giáo thực sự. Các quý tộc sống trong thành phố và những kẻ đồng đảng của họ là những người theo [proselytiser.GetFaith.GetName], trong khi thường dân và những người sống trong các khu rừng trải dài của thung lũng vẫn tiếp tục thờ phụng các vị thần và linh hồn đa dạng của đức tin Ari.\n\nLãnh chúa của ta, [proselytiser.GetFullName], đã tự mình gánh vác việc hàn gắn sự chia rẽ này và thiết lập đức tin Theravada như một đức tin thống trị trên các vùng đất của [proselytiser.GetHerHis] và mở rộng ra là cả của ta nữa. Ngay cả bây giờ, các nhà sư của [proselytiser.GetHerHis] đang quét qua các vùng đất của ta, tái tạo lại cảnh quan tôn giáo theo hình ảnh mà họ ưa thích."
  south_asia.0038.a:0 "Đức tin Theravada sẽ hưng thịnh!"
  south_asia.0038.b:0 "Thật là một sự xúc phạm!"
  south_asia.0038.c:0 "Chẳng qua là chuyện vô lý như thường lệ."
  south_asia.0038.tt:0 "Một số [counties|E] của Ngài có thể chuyển sang đức tin Theravada."

  south_asia.0039.t:0 "Một Kẻ Cường Điệu Tàn Bạo"
  south_asia.0039.desc:0 "Công việc truyền đạo của [proselytiser.GetFullName] dường như không thành công. Phương pháp áp đặt nặng tay của [proselytiser.GetHerHis|U] trong việc lan truyền đức tin Theravada đã dẫn đến phản đối và biểu tình, sau đó bị đàn áp tàn bạo.\n\nBất kỳ lãnh chúa nào dám bảo vệ tín đồ đức tin Ari đều biến mất hoặc giờ khăng khăng rằng họ bị trích dẫn sai, và không ai dám thử thách sự kiên nhẫn của bệ hạ nhiệt thành.\n\nLiệu còn hậu quả nào cho những người đứng về phía bị áp bức hay không vẫn còn phải chờ xem..."
  south_asia.0039.a:0 "Chẳng qua là họ đáng bị vậy."
  south_asia.0039.b:0 "Một ngày nào đó, tín đồ bị ngã sẽ được báo thù."
  south_asia.0039.c:0 "Chỉ là thêm trò cãi vã vặt giữa [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]."

  south_asia.0040.t:0 "Đức Tin Được Bảo Vệ?"
  south_asia.0040.desc:1 "[proselytiser.GetFullName], bệ hạ và người cai trị vùng đất này, đã làm việc chăm chỉ để cải đạo dân chúng sang đức tin [proselytiser.GetHerHis], [proselytiser.GetFaith.GetName]. Khi âm mưu của [proselytiser.GetHerHis] tiến triển, không thể ngăn cản dòng tu sĩ và Bhāṇaka tràn qua vùng đất của Ta để truyền bá đức tin của họ, và của [proselytiser.GetLadyLord] của họ.\n\nNgay cả khi Theravada chiếm ưu thế, các tín đồ Ari truyền thống vẫn trốn vào các pháo đài rừng núi quanh Arakan, giảm dần về số lượng và né tránh việc thờ cúng công khai."
  south_asia.0040.a:0 "Tuyệt vời! Đức tin chân chính sẽ phát triển!"
  south_asia.0040.b:0 "Hành động này sẽ không bị quên lãng."
  south_asia.0040.c:0 "Chuyện này thật ra không phải là mối quan tâm của Ta."
  south_asia.0040.tt:0 "Một số [counties|E] của Ngài có thể chuyển sang đức tin Theravada."

  south_asia.0041.t:0 "Món Quà Từ Nước Ngoài"
  south_asia.0041.desc:0 "Vị tu sĩ thứ năm trong ngày đi qua triều đình đã khiến Ta chú ý; hiếm khi các thành viên của đạo xuất hiện công khai nhiều như vậy. Việc tra hỏi nhanh cho thấy lý do cho sự tràn ngập tín đồ mới trên vùng đất của Ta.\n\n[proselytiser.GetFullName], một [proselytiser.GetLadyLord] ngoại quốc, đã thiết lập đức tin [proselytiser.GetFaith.GetName] khắp vùng lãnh thổ của [proselytiser.GetHerHis], và tin tức về những thử thách mà đạo chúng ta trải qua tại lãnh thổ Ta trong nhiều thế hệ cũng đến được họ.\n\nĐáp lại, [proselytiser.GerSheHe] đã gửi nhiều bhikku để giúp lan truyền và hỗ trợ đức tin ở quê hương tổ tiên."
  south_asia.0041.a:0 "Ta sẽ không quên cử chỉ này."

 
  south_asia.0050.t: "Các Vương Quốc Hindustan"
  south_asia.0050.desc: "Maurya, Kushana, Gupta, Pala, và Pratihara, suốt thiên niên kỷ, đồng bằng Ấn-Hằng vừa là trung tâm vừa là chiến trường của nhiều đế chế vĩ đại. Một số vua là ngoại quốc, nhiều người khác xuất phát từ tiểu lục địa.\n\n[founder.GetHouse.GetNameNoTooltip] không cổ xưa bằng, nhưng chúng Ta đã tạo ra một vương quốc của riêng mình nơi những triều đại kia thất bại. Giờ đây là thời điểm để xây dựng Đế chế và cơ quan chính quyền để cai trị vô số dân tộc và tín ngưỡng trên vùng đất này."
  south_asia.0050.a: "Thủ đô mới sẽ được dựng tại Delhi!"
  south_asia.0050.b: "Chúng ta sẽ chọn Lahore làm trung tâm Đế chế"
  south_asia.0050.c: "Đế chế sẽ được cai trị từ [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 
  south_asia.0051.t: "Sultanate của [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
  south_asia.0051.desc: "Tin tức đến với chúng Ta rằng [founder.GetHouse.GetNameNoTooltip] đã củng cố quyền kiểm soát đồng bằng Ấn-Hằng, lập ra một Đế chế Hồi giáo mới trên đống đổ nát của các triều đại Hindu và Phật giáo trước đây.\n\nTự xưng [founder.GetHerselfHimself] là [founder.GetFullName], với tham vọng thống trị toàn bộ Ấn Độ từ [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [founder.GetFirstNameNoTooltip] nhanh chóng vừa được kính sợ vừa được ngưỡng mộ."
  south_asia.0051.a: "$middle_europe_decisions.0016.a$"
  south_asia.0051.b: "Chúng ta sẽ nghiền nát những kẻ ngông cuồng này!"
  south_asia.0051.c: "Cuối cùng đã có một người bảo vệ đức tin chân chính!"
  south_asia.0051.d: "Một diễn biến đáng lo ngại"
  south_asia.0051.e: "$middle_europe_decisions.0016.d$"
