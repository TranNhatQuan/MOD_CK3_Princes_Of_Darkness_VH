 # Special Events #
 ##################

 #Successor's Squabble — Resolve a dispute between your heir and a powerful vassal, by Sean Hughes
  diplomacy_family_special.2200.t:0 "Tranh Cãi Của Người Thừa Kế"
  diplomacy_family_special.2200.desc:2 "Ta đang thư giãn trong [ROOT.Char.Custom('ResidenceBuilding')] của mình vào cuối ngày thì [heir.Custom2('MyCharacterIntroduction', ROOT.Char)] bước vào, trông vô cùng bối rối.\n\n"[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] thật là một kẻ phiền phức!" [heir.GetSheHe] kêu lên. "[vassal.GetSheHe|U] lúc nào cũng lải nhải rằng ta không xứng đáng kế vị ngươi. [vassal.GetSheHe|U] nghĩ ta quá [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')] để trở thành"
  diplomacy_family_special.2200.same_title.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip]"
  diplomacy_family_special.2200.same_sex_title.desc:0 "$diplomacy_family_special.2200.same_title.desc$"
  diplomacy_family_special.2200.opposite_sex_title.desc:0 "[ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip]"
  diplomacy_family_special.2200.ruler.desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip]"
  diplomacy_family_special.2200.end.desc:0 "của [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!"" 
  diplomacy_family_special.2200.a:0 "Lại đây ngồi với ta, chúng ta sẽ bàn chuyện này."
  diplomacy_family_special.2200.a.tt:0 "Ta sẽ giúp [heir.GetFirstNameNoTooltip] tìm cách đáp lại những lời chỉ trích"
  diplomacy_family_special.2200.b:0 "Ta sẽ nói chuyện với [vassal.GetTitledFirstNameNoTooltip] về chuyện này."
  diplomacy_family_special.2200.b.tt:0 "Ta sẽ yêu cầu [vassal.GetFirstNameNoTooltip] giải thích vì sao [vassal.GetSheHe] lại chỉ trích người thừa kế của ta"
  diplomacy_family_special.2200.c:0 "Sao ngươi lại làm phiền ta vì chuyện này?"

  diplomacy_family_special.2201.desc:0 "Ta kéo [heir.GetFirstName] sang một bên để nói chuyện thẳng thắn. Ta có thể thấy [heir.GetSheHe] đang bực bội vì tình hình với [vassal.GetTitledFirstName] và sẵn sàng lắng nghe lời khuyên của ta."
  diplomacy_family_special.2201.a:0 "Hai người có nhiều điểm chung hơn ngươi nghĩ."
  diplomacy_family_special.2201.a.success:0 "[heir.GetFirstNameNoTooltip] và [vassal.GetFirstNameNoTooltip] giải quyết được bất hòa"
  diplomacy_family_special.2201.a.failure:0 "[heir.GetFirstNameNoTooltip] không muốn hòa giải với [vassal.GetFirstNameNoTooltip]"
  diplomacy_family_special.2201.b:0 "Ta có thể giúp ngươi luyện tập để trở nên [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]..."
  diplomacy_family_special.2201.b.success:0 "Ta thuyết phục [heir.GetFirstNameNoTooltip] thay đổi tính cách của hắn"
  diplomacy_family_special.2201.b.failure:0 "[heir.GetFirstNameNoTooltip] từ chối thay đổi tính cách của hắn"
  diplomacy_family_special.2201.b.success.tt:0 "[heir.GetTitledFirstName] bắt đầu cố gắng trở nên [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')] hơn"
  diplomacy_family_special.2201.b.failure.tt:0 "[heir.GetTitledFirstName] vẫn giữ nguyên tính cách [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagTraitLink')]"
  diplomacy_family_special.2201.c:0 "Ta sẽ khiến [vassal.GetHerHim] phải trả giá vì đã chỉ trích ngươi!"

  diplomacy_family_special.2202.desc:0 "Ta sắp xếp một cuộc gặp với [vassal.GetTitledFirstName] để bàn về vấn đề của hắn với [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] của ta là [heir.GetTitledFirstName].\n\n"Chuyện rất đơn giản, [ROOT.Char.GetTitledFirstNameNoTooltip]; ta không thích ý nghĩ phải phục tùng một lãnh chúa [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')]. Vì lợi ích của [ROOT.Char.Custom('GetRealmOrDomicile')], ta sẵn sàng bày tỏ sự bất mãn của mình, cho dù điều đó có khiến bản thân gặp nguy hiểm.""
  diplomacy_family_special.2202.a:0 "Nhưng còn những phẩm chất tốt của [heir.GetHerHis] thì sao?"
  diplomacy_family_special.2202.a.success:0 "[vassal.GetFirstNameNoTooltip] và [heir.GetFirstNameNoTooltip] giải quyết được bất hòa"
  diplomacy_family_special.2202.a.failure:0 "[vassal.GetFirstNameNoTooltip] không muốn hòa giải với [heir.GetFirstNameNoTooltip]"
  diplomacy_family_special.2202.b:0 "Ngươi nói đúng, [heir.GetFirstNameNoTooltip] đúng là một nỗi thất vọng."
  diplomacy_family_special.2202.c:0 "Ngươi sẽ không được chỉ trích [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] của ta!"

  diplomacy_family_special.2210.desc:0 "Sau khi nói chuyện với [vassal.GetTitledFirstName], [vassal.GetSheHe] quyết định thử làm hòa với [heir.GetTitledFirstName], tập trung vào những điểm chung thay vì sự khác biệt giữa họ. Sự thay đổi này thật đáng khích lệ!"
  diplomacy_family_special.2210.a:0 "Điềm báo tốt cho tương lai!"

  diplomacy_family_special.2211.desc:0 "Bất chấp nỗ lực của Ta nhằm thuyết phục [vassal.GetTitledFirstName] rằng hắn có thể hòa hợp với [heir.GetTitledFirstName] nếu cố gắng, tên ngốc đó vẫn từ chối thừa nhận bất kỳ điều gì đáng mến trong tính cách của [heir.GetTitledFirstNamePossessive]."
  diplomacy_family_special.2211.a:0 "[vassal.GetTitledFirstNameNoTooltip] đúng là một kẻ thô lỗ đáng ghét!"
  diplomacy_family_special.2211.a.high_opinion:0 "Ta đã mong đợi nhiều hơn từ [vassal.GetTitledFirstNameNoTooltip]."

  diplomacy_family_special.2212.desc:0 "Sau khi nói chuyện với [heir.GetHerHim], [heir.GetTitledFirstName] nói rằng [heir.GetSheHe] sẽ cố gắng cư xử tốt hơn khi ở gần [vassal.GetTitledFirstName].\n\nBằng cách tập trung vào những điểm chung thay vì khác biệt, rất có thể một tình bạn mới sẽ nảy sinh giữa hai người."
  diplomacy_family_special.2212.a:0 "Điềm báo tốt cho tương lai!"

  diplomacy_family_special.2213.desc:0 "Mặc cho ta đã cố gắng hết sức để thuyết phục [heir.GetTitledFirstName] rằng [heir.GetSheHe] có thể hòa hợp với [vassal.GetTitledFirstName] nếu chịu thử, [heir.GetFirstNameNoTooltip] vẫn từ chối thay đổi cách cư xử của [heir.GetHerHis] khi ở gần [vassal.GetTitledFirstNameNoTooltip].\n\nCó vẻ như sự thù địch giữa họ sẽ còn kéo dài một thời gian..."
  diplomacy_family_special.2213.a:0 "Ta thật thất vọng về [heir.GetFirstNameNoTooltip]."

  diplomacy_family_special.2220.desc:0 "Ta ngồi xuống cùng [heir.GetFirstName] và giải thích rằng đôi khi vì lợi ích của [ROOT.Char.Custom('GetRealmOrDomicile')], một người cần phải trở nên [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')], cho dù hành vi đó không đến một cách tự nhiên.\n\n[heir.GetSheHe|U] ban đầu có vẻ nghi ngờ, nhưng đã được khích lệ khi ta nói với [heir.GetHerHim] rằng những điều như vậy sẽ trở nên dễ dàng hơn theo thời gian và luyện tập."
  diplomacy_family_special.2220.a:0 "Thời gian sẽ cho thấy điều này thay đổi mọi thứ ra sao."
  diplomacy_family_special.2220.a.tt:0 "[heir.GetFirstName] sẽ cố gắng trở nên [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')] hơn"

  diplomacy_family_special.2221.desc:0 "Ta đã cố thuyết phục [heir.GetFirstName] rằng việc bớt đi [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')] sẽ có lợi cho chính hắn, chỉ cho [heir.GetHerHim] thấy lợi thế khi trở thành một [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')] [ROOT.Char.GetTitleAsNameNoTooltip].\n\nBất chấp điều đó, [heir.GetSheHe] từ chối xem xét việc thay đổi hành vi. [heir.GetSheHe|U] dường như quyết giữ lối sống của mình, ngay cả khi điều đó khiến người khác xa lánh."
  diplomacy_family_special.2221.a:0 "Sao [heir.GetSheHe] không thể thấy được sự thật trong lời ta nói?"

  diplomacy_family_special.2231.desc:0 "Mối quan hệ giữa [heir.GetTitledFirstName] và [vassal.GetTitledFirstNamePossessive] có thể đã bắt đầu bằng sự thù địch và cay nghiệt, nhưng dưới sự dẫn dắt của ta họ đã học được cách thấu hiểu và tin tưởng lẫn nhau. Sự nuôi dưỡng cẩn thận những điều này đã tạo nên một tình bạn bền chặt giữa họ!"
  diplomacy_family_special.2231.a:0 "Ta biết chúng ta có thể giải quyết được mà!"

  diplomacy_family_special.2233.desc:0 "Ta đã khuyến khích [heir.GetFirstName] thay đổi hành vi của [heir.GetHerHis] trong nhiều năm nay, và có vẻ những nỗ lực của ta cuối cùng cũng được đền đáp!\n\nViệc trở nên [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')] dường như đã trở thành bản năng thứ hai của [heir.GetHerHim], một thói quen ăn sâu đến mức [heir.GetSheHe] không còn cần phải cố gắng để hành động như vậy nữa."
  diplomacy_family_special.2233.a:0 "Ta rất vui khi thấy [heir.GetFirstNameNoTooltip] trưởng thành hơn."

  diplomacy_family.2400.story_title: "Giáo Dục Người Kế Vị" 
  diplomacy_family.2400.t: "$diplomacy_family.2400.story_title$: Lời Đề Nghị"
  diplomacy_family.2400.desc: "Một buổi sáng sớm, [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('spouse') )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của Ta bước vào [ROOT.Char.Custom('GetChambersOrTent')] của Ta.\n\n"Thưa [ROOT.Char.Custom('ComplimentAdjective')] [spouse.Custom2('RelationToMe', ROOT.Char)] của tôi! Gần đây tôi đã suy nghĩ về việc học vấn của [heir.GetFirstNamePossessive]. Tôi tin rằng kiến thức về [spouse.Custom('highest_skill_noun')] của mình có thể hữu ích cho [heir.GetHerHim]. Ngài có để tôi hỗ trợ việc học tập của nó không?""
  diplomacy_family.2400.a: "Ta nên để [spouse.GetHerHim] thử sức."
  diplomacy_family.2400.a.tt: "[spouse.GetFirstNameNoTooltip] sẽ thử dạy dỗ [heir.GetFirstNameNoTooltip]"
  diplomacy_family.2400.a.result.tt_first: "#weak Việc này #EMP có thể#! cải thiện nền tảng học vấn của [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip]#!"
  diplomacy_family.2400.b: "Chỉ cần ta dạy bảo là đủ rồi."
  diplomacy_family.2410.t: "$diplomacy_family.2400.story_title$: Bế Tắc"
  diplomacy_family.2410.desc: "Vào một đêm trằn trọc, Ta bắt đầu đi lang thang. Khi đến kho lưu trữ thực phẩm, Ta nghe thấy một tiếng động lạ. Ngạc nhiên thay, Ta thấy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] đang nhồi nhét [ROOT.Char.Custom('GetExpensiveDessert')] vào miệng. [spouse.GetSheHe|U] nhìn Ta với vẻ xấu hổ và tuyệt vọng.\n\n"Tôi đang bế tắc trong việc kèm cặp [heir.GetFirstName]! Thay vì lắng nghe tôi, nó cứ...""
  diplomacy_family.2410.rowdy: "cứ chạy nhảy lung tung và nghịch ngợm đủ trò.\""
  diplomacy_family.2410.charming: "cứ mải mê trò chuyện không dứt với những đứa trẻ khác.\""
  diplomacy_family.2410.curious: "khiến thiếp phát điên với những câu hỏi chẳng liên quan.\""
  diplomacy_family.2410.pensive: "luôn cắm cúi mũi vào sách vở [heir.GetHerHis]."
  diplomacy_family.2410.bossy:0 "làm hoàn toàn trái ngược với những gì ta bảo [heir.GetHerHim]."
  diplomacy_family.2410.desc.after: "Thiếp không thể tiếp tục mà không phát điên mất.\""
  diplomacy_family.2410.a: "Ta nên mua thêm tài liệu nghiên cứu cho [spouse.GetHerHim]."
  diplomacy_family.2410.a.tt: "Ngài hỗ trợ [spouse.GetFirstNameNoTooltip] dạy dỗ [heir.GetNameNoTooltip]"
  diplomacy_family.2410.a.possible_outcome_good.tt_first:0 "#weak Nhờ vào kỹ năng kết hợp của các ngươi, nền tảng học vấn của [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] có thể cải thiện #P rất nhiều#! #!"
  diplomacy_family.2410.a.possible_outcome_mediocre.tt_first:0 "#weak Nhờ vào kỹ năng kết hợp của các ngươi, nền tảng học vấn của [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] có thể cải thiện #M một chút#! #!"
  diplomacy_family.2410.b: "\"Nàng cần phải cố gắng hơn nữa.\""
  diplomacy_family.2410.b.tt: "Ngài khuyến khích [spouse.GetFirstNameNoTooltip] tiếp tục dạy dỗ [heir.GetFirstNameNoTooltip]"
  diplomacy_family.2410.b.possible_outcome.tt_first:0 "#weak Nền tảng học vấn của [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] sẽ được cải thiện #!"
  diplomacy_family.2410.c: "Để đó ta lo liệu thay cho nàng."
  diplomacy_family.2410.c.possible_outcome_you.tt_first:0 "#weak Nền tảng học vấn của [TARGET_CHARACTER.GetFirstNamePossessiveNoTooltip] sẽ được cải thiện #!"
  diplomacy_family.2411.t: "$diplomacy_family.2400.story_title$: Nỗ Lực Chung"
  diplomacy_family.2411.desc:0 "Sau nhiều tháng làm việc chăm chỉ và tận tụy cho sự kèm cặp [heir.GetFirstNamePossessive], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] của ta đến gặp ta tại [ROOT.Char.Custom('GetChambersOrTent')]. Gương mặt [spouse.GetHerHis|U] bừng sáng niềm tự hào.\n\n"Ôi, [ROOT.Char.GetFirstNameNoTooltip]! Nhờ có sự hướng dẫn và hỗ trợ của ngài, [heir.Custom('PetName')] [heir.GetNameNoTooltip] của chúng ta đã xuất sắc trong học tập. Tôi sẽ lạc lối biết bao nếu không có ngài.""
  diplomacy_family.2411.a: "Tương lai rộng mở đang chờ đón [heir.GetFirstNameNoTooltip]."
  diplomacy_family.2411.a.outcome_spouse_medium.tt_global_past: "#weak từ kỹ năng tương đối tốt của bạn đời.#!"
  diplomacy_family.2411.a.outcome_you_medium.tt_global_past: "#weak từ kỹ năng tương đối tốt của Ngài.#!"
  diplomacy_family.2411.a.outcome_spouse_good.tt_global_past: "#weak từ kỹ năng xuất chúng của bạn đời.#!"
  diplomacy_family.2411.a.outcome_you_good.tt_global_past: "#weak từ kỹ năng xuất chúng của Ngài.#!"
