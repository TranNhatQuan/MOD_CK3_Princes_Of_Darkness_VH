 ###################
 # Standard Events #
 ###################

 # An Opportune Moment, by Mathilda Bjarnehed
  diplomacy_family.0007.t:0 "Thời Cơ Thuận Lợi"
  diplomacy_family.0007.desc:1 "Bữa tối do ta cẩn thận sắp đặt đã diễn ra đúng như kế hoạch, và ta nhận ra mình đang ở riêng cùng [voter.GetTitledFirstName]. Nhờ rượu vang và món [voter.Custom('FavoriteTreat')] ưa thích của [voter.GetHerHis], [voter.GetSheHe] trông vui vẻ hơn bất cứ lúc nào ta từng thấy [voter.GetHerHim] trong nhiều tháng qua.\n\nĐây là cơ hội hoàn hảo để thuyết phục [voter.GetFirstNameNoTooltip] bỏ phiếu cho [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('candidate'))] của ta, [candidate.GetTitledFirstName]..."
  diplomacy_family.0007.a:0 "Đưa ra những lập luận thuyết phục nhất của ta."
  diplomacy_family.0007.a.success.tt:1 "Ngươi thuyết phục được [voter.GetTitledFirstNameNoTooltip]"
  diplomacy_family.0007.a.success.desc:0 "Ta đã thuyết phục [voter.GetTitledFirstName] bỏ phiếu cho [candidate.GetTitledFirstName]."
  diplomacy_family.0007.a.failure.tt:1 "Ngươi không thuyết phục được [voter.GetTitledFirstNameNoTooltip]"
  diplomacy_family.0007.a.failure.desc:0 "Nỗ lực thuyết phục [voter.GetTitledFirstName] của ta đã thất bại."
  diplomacy_family.0007.c:0 "Một ân huệ đổi lấy một ân huệ, công bằng chứ?"
  diplomacy_family.0007.b:0 "Túi tiền này có thể khiến [voter.GetHerHis] đổi ý..."
  diplomacy_family.0007.placeholder.tt:0 "[voter.GetShortUIName|U] sẽ bỏ phiếu để bầu [candidate.GetShortUIName] làm người cai trị tiếp theo của [title.GetNameNoTier]"

 # A Flaw of Character, by Mathilda Bjarnehed
  diplomacy_family.0008.t:0 "Khiếm Khuyết Tính Cách"
  diplomacy_family.0008.start.desc:1 "Khi ta rời khỏi cõi đời này, [disagreeable_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] sẽ cai trị thay ta.\n\nĐáng tiếc thay, những lời đồn về [disagreeable_heir.GetFirstNamePossessiveNoTooltip]"
  diplomacy_family.0008.lazy.desc:0 "sự lười biếng đáng xấu hổ"
  diplomacy_family.0008.craven.desc:0 "sự hèn nhát tột cùng"
  diplomacy_family.0008.arbitrary.desc:0 "sự thiếu đạo đức hoàn toàn"
  diplomacy_family.0008.callous.desc:0 "trái tim lạnh lùng như đá"
  diplomacy_family.0008.stubborn.desc:0 "sự bướng bỉnh khó chịu"
  diplomacy_family.0008.gluttonous.desc:0 "sự phàm ăn đáng ghê tởm"
  diplomacy_family.0008.greedy.desc:0 "lòng tham vô đáy"
  diplomacy_family.0008.arrogant.desc:0 "sự kiêu ngạo không hối cải"
  diplomacy_family.0008.deceitful.desc:0 "dối trá và mưu mẹo"
  diplomacy_family.0008.vengeful.desc:0 "những mối hằn thù không dứt"
  diplomacy_family.0008.end.desc:0 "đang lan truyền khắp triều đình của ta. Điều đó khiến ta tự hỏi liệu [disagreeable_heir.GetSheHe] có giữ được sự ủng hộ của các chư hầu của ta sau khi ta qua đời hay không..."
  diplomacy_family.0008.end_no_vassals.desc:0 "đang lan truyền khắp [ROOT.Char.Custom('GetCourt')] của ta. Điều đó khiến ta tự hỏi liệu [disagreeable_heir.GetSheHe] có thể gánh vác trách nhiệm của [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] và thần dân của nó sau khi ta qua đời hay không..."
  diplomacy_family.0008.a:0 "Cố gắng sửa chữa những khuyết điểm của [disagreeable_heir.GetFirstNamePossessiveNoTooltip]."
  diplomacy_family.0008.a.tt:0 "[disagreeable_heir.GetShortUIName|U] có thể vượt qua những khuyết điểm của [disagreeable_heir.GetHerHis]"
  diplomacy_family.0008.b:0 "Thay vào đó hãy ca ngợi những phẩm chất tốt của [disagreeable_heir.GetHerHis]."
  diplomacy_family.0008.b.custom:0 "Mọi [ROOT.Char.Custom('GetFollowerOrVassal')]"
  diplomacy_family.0008.c:0 "Tập trung vào bản thân và làm gương."


  diplomacy_family.0009.desc:0 "[disagreeable_heir.GetTitledFirstName] đã đồng ý để Ta làm người cố vấn, dù sự nhiệt tình của [disagreeable_heir.GetHerHis] có phần thiếu hụt.\n\nTa lo rằng những thói hư tật xấu của [disagreeable_heir.GetHerHis] đã ăn sâu, nhưng một trải nghiệm thức tỉnh thực sự có thể khiến hắn nhận ra sự dại dột trong cách hành xử của mình.\n\nChúng ta nên làm gì đây?"
  diplomacy_family.0009.wronglessonstart.desc:0 "Khi Ta quan sát [disagreeable_heir.GetFirstName] thực hiện nhiệm vụ được giao, sự nghi ngờ dần len lỏi trong Ta. [disagreeable_heir.GetSheHe|U] không hề cố gắng để"
  diplomacy_family.0009.compassion.desc:0 "đặt mình vào vị trí của những người kém may mắn hơn để thấu hiểu họ,"
  diplomacy_family.0009.honor.desc:0 "thừa nhận những lỗi lầm và đối mặt với hậu quả của chúng,"
  diplomacy_family.0009.greed.desc:0 "từ bỏ của cải vật chất,"
  diplomacy_family.0009.energy.desc:0 "cai trị thay ta,"
  diplomacy_family.0009.vengefulness.desc:0 "thể hiện sự tha thứ chân thành,"
  diplomacy_family.0009.wronglessonend.desc:0 "và [disagreeable_heir.GetSheHe] dường như chẳng học được gì từ bài học này.\n\nTa sẽ cho [disagreeable_heir.GetFirstNameNoTooltip] thêm một cơ hội, và có lẽ ta nên thay đổi phương pháp.\n\nLần này, chúng ta sẽ..."

  diplomacy_family.0009.rightlessonstart.desc:0 "Thật bực bội khi thấy [disagreeable_heir.GetFirstName] chật vật để"
  diplomacy_family.0009.rightlessonend.desc:0 "Ta nghi rằng [disagreeable_heir.GetSheHe] thậm chí còn chẳng cố gắng!\n\nTa gần như chắc chắn lỗi nằm ở mức độ nhiệt tình của [disagreeable_heir.GetFirstNamePossessiveNoTooltip], chứ không phải bài học của ta. Ta sẽ cho [disagreeable_heir.GetHerHim] thêm một cơ hội nữa...\n\nCâu hỏi là, chúng ta nên thử một cách tiếp cận mới? Hay cứ kiên trì đến cùng hôm nay?"
  diplomacy_family.0009.a:0 "Ra phố và trò chuyện với người nghèo."
  diplomacy_family.0009.a.tt:0 "Một bài học phù hợp cho kẻ cần rèn luyện lòng trắc ẩn"
  diplomacy_family.0009.b:0 "Thừa nhận một lỗi lầm và sửa chữa nó."
  diplomacy_family.0009.b.tt:0 "Một bài học phù hợp cho kẻ cần rèn luyện danh dự"
  diplomacy_family.0009.c:0 "Ban phát tài sản cho những kẻ túng thiếu."
  diplomacy_family.0009.c.tt:0 "Một bài học phù hợp cho kẻ cần rèn luyện sự hào phóng"
  diplomacy_family.0009.d:0 "[disagreeable_heir.GetFirstNameNoTooltip] sẽ thiết triều thay ta."
  diplomacy_family.0009.d.tt:0 "Một bài học phù hợp cho kẻ cần rèn luyện sự quyết đoán"
  diplomacy_family.0009.e:0 "Tha thứ cho kẻ đã làm điều sai trái với [disagreeable_heir.GetHerHim]."
  diplomacy_family.0009.e.tt:0 "Một bài học phù hợp cho kẻ cần học cách buông bỏ"


  diplomacy_family.0010.t:1 "$diplomacy_family.0008.t$: Sự Thấu Hiểu Mới"
  diplomacy_family.0010.start.desc:0 "Ta vô cùng vui mừng khi thấy những thay đổi ở [disagreeable_heir.GetTitledFirstName]!"
  diplomacy_family.0010.compassion.desc:0 "Ban đầu [disagreeable_heir.GetSheHe] tỏ ra thờ ơ, nhưng những câu chuyện của những kẻ khốn khổ mà chúng ta gặp dường như đã lay động điều gì đó trong trái tim [disagreeable_heir.GetHerHis].\n\nTrên đường trở về, [disagreeable_heir.GetSheHe] ngồi lặng lẽ suy ngẫm, và từ đó không còn tỏ ra quá"
  diplomacy_family.0010.honor.desc:0 "Dù ban đầu [disagreeable_heir.GetSheHe] không cho rằng mình sai, nhưng phản ứng nhận được khi sửa chữa vấn đề đã tác động đến [disagreeable_heir.GetHerHim].\n\nTa nghi rằng [disagreeable_heir.GetFirstNameNoTooltip] chưa bao giờ được đối xử bằng sự tôn trọng đó, và kể từ đó hắn dường như không còn"
  diplomacy_family.0010.greed.desc:0 "Dĩ nhiên lúc đầu [disagreeable_heir.GetSheHe] đã rất khó khăn khi phải từ bỏ những tài sản của [disagreeable_heir.GetHerHis], nhưng được chứng kiến niềm vui và lòng biết ơn của những người thực sự túng thiếu là điều hoàn toàn mới mẻ đối với [disagreeable_heir.GetHerHim].\n\nTrên đường về, [disagreeable_heir.GetFirstNameNoTooltip] thậm chí còn thú nhận rằng [disagreeable_heir.GetSheHe] chẳng hề nhớ nhung phần lớn những món đồ đó, và từ đó không còn tỏ ra quá"
  diplomacy_family.0010.energy.desc:0 "Ban đầu ta cũng lo lắng về kết quả khi giao cho [disagreeable_heir.GetHerHim] quá nhiều trách nhiệm, nhưng khi [disagreeable_heir.GetSheHe] không có ai để dựa dẫm hay giao phó lại, [disagreeable_heir.GetSheHe] đã đứng ra gánh vác nhiệm vụ.\n\n[disagreeable_heir.GetFirstNameNoTooltip] thậm chí còn bất ngờ hơn cả ta trước những tài năng tiềm ẩn của [disagreeable_heir.GetHerHis], và từ đó không còn tỏ ra quá"
  diplomacy_family.0010.vengefulness.desc:0 "Ta có thể thấy thật khó khăn cho [disagreeable_heir.GetHerHim] khi phải đối mặt với [dummy_gender.GetWomanMan] mà hắn đã đối xử bất công, những lời nói nghẹn lại nơi cổ họng khi [disagreeable_heir.GetSheHe] cố gắng nói.\n\nMay mắn thay, [dummy_gender.GetWomanMan] đã đáp lại một cách nhân từ, và bằng cách noi gương [dummy_gender.GetHerHis], [disagreeable_heir.GetFirstName] đã tha thứ cho người đó một cách chân thành. [disagreeable_heir.GetSheHe|U] dường như không còn"
  diplomacy_family.0010.lazy.desc:0 "lười biếng"
  diplomacy_family.0010.craven.desc:0 "bất an"
  diplomacy_family.0010.arbitrary.desc:0 "tùy tiện"
  diplomacy_family.0010.callous.desc:0 "lạnh lùng"
  diplomacy_family.0010.stubborn.desc:0 "bướng bỉnh"
  diplomacy_family.0010.gluttonous.desc:0 "phàm ăn"
  diplomacy_family.0010.greedy.desc:0 "ích kỷ"
  diplomacy_family.0010.arrogant.desc:0 "tự cao tự đại"
  diplomacy_family.0010.deceitful.desc:0 "dối trá"
  diplomacy_family.0010.sadistic.desc:0 "lạnh lùng tàn nhẫn"
  diplomacy_family.0010.vengeful.desc:0 "thù dai"
  diplomacy_family.0010.end.desc:0 "kể từ đó."
  diplomacy_family.0010.a:0 "Một thành tựu lớn, cho cả hai chúng ta!"
  diplomacy_family.0010.b:0 "Đây chỉ là một bài học giáo dục, không hơn."
  diplomacy_family.0010.c:0 "Đây mới chỉ là bước đầu! Chúng ta phải cố gắng hơn nữa!"

  diplomacy_family.0011.t:1 "$diplomacy_family.0008.t$: Cứng đầu trong lối sống cũ"
  diplomacy_family.0011.start.desc:0 "[disagreeable_heir.GetTitledFirstName] và [disagreeable_heir.GetHerHis]"
  diplomacy_family.0011.end.desc:0 "đang khiến ta phát điên! Dù ta đã cố gắng hết sức, [disagreeable_heir.GetSheHe] vẫn không hề tiến bộ.\n\nNếu trái tim [disagreeable_heir.GetHerHis] không muốn thay đổi, thì điều đó sẽ chẳng bao giờ xảy ra."
  diplomacy_family.0011.a:0 "Ta bỏ cuộc..."

 # Family Quarrel, by Petter Vilberg
  diplomacy_family.2101.t:0 "Cuộc Cãi Vã"
  diplomacy_family.2101.desc:0 "[family_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã cãi vã với [family_2.Custom2('HerHisCharacterIntroduction', family_1)] suốt nhiều ngày qua. Ngay lúc này ta có thể nghe lén họ tranh cãi trong [ROOT.Char.Custom('GetRoom')] bên cạnh về...\n\n"Thật không thể tin nổi!" [family_1.GetFirstName] hét lên, "Một [family_2.Custom2('InsultNoun', SCOPE.sC('family_1'))] như ngươi sao dám tin rằng mình là hiện thân lý tưởng của những đức hạnh gia tộc [ROOT.Char.GetDynastyName]! Rõ ràng ta #EMP còn#! xứng đáng với danh hiệu đó hơn ngươi nhiều!"
  diplomacy_family.2101.a:0 "Gia đình không được đánh nhau!"
  diplomacy_family.2101.a.tt: "Ngươi cố gắng ngăn cuộc ẩu đả của họ"
  diplomacy_family.2101.b:0 "Cứ để họ tự giải quyết mâu thuẫn."

  diplomacy_family.2102.desc:0 "Khi ta bước vào [ROOT.Char.Custom('GetRoom')], [family_1.GetFirstName] quay sang nhìn ta. "Thật may khi ngươi ở đây, [ROOT.Char.GetFirstNameNoTooltip]. Ngươi có thể nói vài lời phải trái với [family_2.Custom2('YourCharacterIntroduction', ROOT.Char)] được không? [family_2.GetSheHe|U] hoàn toàn vô lý!"
  diplomacy_family.2102.a:0 "Đúng vậy, thật đáng xấu hổ [family_2.GetFirstNameNoTooltip]!"
  diplomacy_family.2102.b:0 "Ngươi mới là kẻ sai ở đây, [family_1.GetFirstNameNoTooltip]."
  diplomacy_family.2102.c:0 "Hai người cư xử chẳng khác gì lũ trẻ con!"
  diplomacy_family.2102.c.success:0 "Họ chịu nghe lý lẽ"
  diplomacy_family.2102.c.failure:0 "Họ từ chối lắng nghe"
  diplomacy_family.2102.d:0 "Ha! Rõ ràng #EMP ta#! mới là [ROOT.Char.GetDynastyNameNoTooltip] xuất sắc nhất!"
  diplomacy_family.2102.d.flavor:0 "Ừ thì... đó cũng là một cách khiến họ ngừng cãi nhau với #EMP nhau#!..."

 # Choosing Best Friend, by Flavio Verna

  diplomacy_family.2200.t:0 "Người Bạn Thân Thiết Nhất"
  diplomacy_family.2200.desc:0 "Ít [ruler.GetWomenMen] nào may mắn có được nhiều bằng hữu như ta. Ta trân trọng sự ủng hộ của họ và dành cho họ lòng tin như nhau, nhưng ta cảm thấy rằng, giữa tất cả những tâm hồn dũng cảm mà ta xem là bạn đồng hành trung thành trong đời, có một người hiểu ta hơn tất cả."
  diplomacy_family.2200.a:0 "[friend_1.GetTitledFirstNameNoTooltip] là bằng hữu thân thiết nhất của ta."
  diplomacy_family.2200.a.tt:1 "[friend_1.GetTitledFirstName] có thể trở thành Bạn Thân của ngươi"
  diplomacy_family.2200.b:0 "Ta tin tưởng [friend_2.GetFirstNameNoTooltip] hơn bất kỳ ai."
  diplomacy_family.2200.b.tt:1 "[friend_2.GetTitledFirstName] có thể trở thành Bạn Thân của ngươi"
  diplomacy_family.2200.c:0 "Còn ai khác ngoài [friend_3.GetTitledFirstNameNoTooltip]?"
  diplomacy_family.2200.c.tt:1 "[friend_3.GetTitledFirstName] có thể trở thành Bạn Thân của ngươi"
  diplomacy_family.2200.d:1 "Ta không nên thiên vị."

  diplomacy_family.2201.desc:0 "Chỉ gần đây ta mới nhận ra mình phụ thuộc vào lời khuyên và sự ủng hộ của [ruler.GetFirstNamePossessive] nhiều đến mức nào. Ta đã xem [ruler.GetHerHim] là người bạn thân thiết và gần gũi nhất của mình."
  diplomacy_family.2201.a:0 "Chúng ta quả thật là tri kỷ."
  diplomacy_family.2201.b:0 "Chúng ta là bạn, nhưng cũng chỉ thế thôi."
  diplomacy_family.2201.b.tt:1 "Chúng ta vẫn chỉ là bạn"
  diplomacy_family.2201.a.tt:0 "Chúng ta trở thành bạn thân thực sự"

 # Jealous relative vs lover's spouse, by Flavio Verna

  diplomacy_family.2250.t:0 "[lover.Custom2('RelationToMeShort', SCOPE.sC('ruler'))|U] Ghen Tuông"
  diplomacy_family.2250.desc.intro:0 "Ta không thể chịu nổi cảnh người ta yêu, [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))], [lover.GetFirstName], dành thời gian với [spouse.Custom2('InsultAdjective', ROOT.Char)] [spouse.GetWifeHusband] của [lover.GetHerHis], [spouse.GetTitledFirstName]."
  diplomacy_family.2250.desc.legal.pure:0 "\n\nÝ nghĩ về những bàn tay ô uế chạm vào thân thể [lover.GetHerHis] thật không thể chịu nổi. Chúng ta đều thuộc gia tộc [ruler.GetHouse.GetName], chúng ta phải ở bên nhau!"
  diplomacy_family.2250.desc.legal.same:0 "\n\nTại sao [ruler.GetFaith.HighGodName] lại ưu ái [ruler.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] của ta hơn ta? Chúng ta đều thuộc gia tộc [ruler.GetHouse.GetName], vậy mà [spouse.GetFirstNameNoTooltip] có thể sống cùng [lover.GetHerHim] còn ta chỉ có thể lẩn khuất trong bóng tối của họ."
  diplomacy_family.2250.desc.illegal:0 "\n\nNgay cả khi chúng ta không thể kết hôn, điều đó không có nghĩa là Ta không quan tâm đến việc [lover.GetSheHe] sẽ dành phần đời còn lại của mình với ai!"
  diplomacy_family.2250.a:0 "[spouse.GetFirstNameNoTooltip] tốt nhất nên giữ đôi bàn tay của hắn tránh xa người khác!"
  diplomacy_family.2250.a.tt:0 "Ta sẽ cố khiến [spouse.GetTitledFirstName] tránh xa [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))] của ta"
  diplomacy_family.2250.a.success.duel:0 "Ta đã thành công đe dọa [spouse.GetTitledFirstName]"
  diplomacy_family.2250.a.failure.duel:0 "[spouse.GetTitledFirstName] phớt lờ lời cảnh cáo của ta"
  diplomacy_family.2250.a.failure.tt:0 "[spouse.GetTitledFirstName] đã phớt lờ lời cảnh cáo của ta về [lover.GetFirstName]"
  diplomacy_family.2250.b.a:0 ""Sao ngươi vẫn chưa chết đi!?!"" 
  diplomacy_family.2250.b.b:0 "[spouse.GetSheHe|U] phải bị xử lý."
  diplomacy_family.2250.b.tt:0 "Âm mưu sẽ có [success_chance|E] cao hơn"
  diplomacy_family.2250.b.spouse_joining:0 "[lover.GetFirstName] #P sẽ#! tham gia [scheme|E] của ta"
  diplomacy_family.2250.b.spouse_refusing:0 "[lover.GetFirstName] #N sẽ KHÔNG#! tham gia [scheme|E] của ta"
  diplomacy_family.2250.c.a:0 "[house_head.GetTitledFirstNameNoTooltip] phải chấm dứt cuộc hôn nhân này!"
  diplomacy_family.2250.c.b:0 "Ta phải chấm dứt cuộc hôn nhân này!"
  diplomacy_family.2250.c.flavor:0 "[house_head|E] có quyền hủy bỏ cuộc hôn nhân của [lover.GetFirstNamePossessive]"
  diplomacy_family.2250.d:0 "Ta phải học cách sống chung với nỗi đau này."

  diplomacy_family.2251.desc:0 "[spouse.GetTitledFirstName] sẽ phải suy nghĩ kỹ trước khi chạm vào [lover.GetFirstName] của ta lần nữa. Ta đã rất cẩn thận không để lộ lý do của mình, nhưng có lẽ sẽ là ngu ngốc nếu tiếp tục gây sức ép chuyện này trong tương lai.\n\nSớm hay muộn, [spouse.GetFirstNameNoTooltip] cũng sẽ tìm ra cách phớt lờ những lời đe dọa của ta, nhưng hiện tại ta có thể yên tâm nghỉ ngơi."
  diplomacy_family.2251.a:0 "Ta hy vọng [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))] của ta sẽ trân trọng điều đó."
  diplomacy_family.2252.desc:0 ""Sao ngài có thể vô tâm đến vậy?!" [lover.GetFirstName] rít lên với Ta, không dám nâng cao giọng, ngay cả trong [ROOT.Char.Custom('GetRoomPlural')] của Ta.\n\nCó vẻ như [spouse.GetTitledFirstName] đã phớt lờ những cảnh báo của Ta và thông báo cho [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))] của Ta về cuộc trò chuyện giữa chúng ta.\n\n"Tôi không thể vì ngài mà bỏ bê nghĩa vụ vợ chồng, thưa [ruler.GetFirstNameNoTooltip]!" Nói đoạn, [lover.GetSheHe] vội vã rời đi."
  diplomacy_family.2252.a:0 "Nhưng...!"
  diplomacy_family.2253.desc.a:0 "Kế hoạch của Ta đã thành công mỹ mãn! [lover.GetFirstName] đã thoát khỏi kẻ thô lỗ [spouse.Custom2('InsultNoun', ROOT.Char)] đó — [spouse.GetTitledFirstName] — và chúng ta không thể hài lòng hơn.\n\n[lover.GetSheHe|U] vội vã chạy đến [ROOT.Char.Custom('GetRoomPlural')] của Ta ngay khi nghe tin từ [house_head.GetTitledFirstName] để bày tỏ lòng biết ơn theo cách ngọt ngào nhất."
  diplomacy_family.2253.desc.b:0 "Kế hoạch của Ta đã thành công mỹ mãn! [lover.GetFirstName] đã thoát khỏi kẻ thô lỗ [spouse.Custom2('InsultNoun', ROOT.Char)] đó — [spouse.GetTitledFirstName] — và chúng ta không thể hài lòng hơn.\n\n[lover.GetSheHe|U] vội vã chạy đến [ROOT.Char.Custom('GetRoomPlural')] của Ta ngay khi nhận được thư của Ta để bày tỏ lòng biết ơn theo cách ngọt ngào nhất."
  diplomacy_family.2253.a:0 "Giờ cuối cùng chúng ta có thể ở bên nhau mãi mãi!"
  diplomacy_family.2253.b:0 "Những điều ta làm vì gia tộc..."
  diplomacy_family.2253.c:0 "Tất cả mọi người sẽ biết về tình yêu của chúng ta!"
  diplomacy_family.2254.desc.a:0 "Ta đã hy vọng [lover.GetFirstName] sẽ cảm ơn ta vì đã thỉnh cầu [house_head.GetTitledFirstName] ly hôn [lover.GetHerHim] khỏi [spouse.GetFirstName], nhưng mọi chuyện hoàn toàn không như vậy.\n\n[lover.GetSheHe|U] vô cùng tức giận vì ta xen vào đời sống hôn nhân của [lover.GetHerHis], và không còn muốn dính dáng gì đến ta nữa."
  diplomacy_family.2254.desc.b:0 "Ta đã hy vọng [lover.GetFirstName] sẽ cảm ơn ta vì đã sắp xếp cho [lover.GetHerHim] một cuộc ly hôn, nhưng mọi chuyện hoàn toàn không như vậy.\n\n[lover.GetSheHe|U] vô cùng tức giận vì ta xen vào đời sống hôn nhân của [lover.GetHerHis], và không còn muốn dính dáng gì đến ta nữa."
  diplomacy_family.2254.a:0 "Đây không phải chuyện của chúng ta, mà là của gia tộc!"
  diplomacy_family.2254.b:0 "Ta không biết phải nói gì..."

 # Dealing with lackluster family member, by Flavio Verna

  diplomacy_family.2300.t:0 "Tỉa Tót Gia Tộc"
  diplomacy_family.2300.desc.intro:0 "Chỉ riêng sự tồn tại của [bad_relative.GetFirstNamePossessive] đã là một sự sỉ nhục đối với danh tiếng của vương triều huy hoàng của chúng ta."
  diplomacy_family.2300.desc.a:0 "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] của ta là một tên ngu ngốc lẩm cẩm, lóng ngóng khắp nơi, khiến gia tộc [ruler.GetDynastyName] trở thành trò cười với mỗi lời [bad_relative.GetSheHe] buột miệng nói ra."
  diplomacy_family.2300.desc.b:0 "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] của ta là một nỗi thất vọng hoàn toàn trong mọi việc mà [bad_relative.GetSheHe] cố gắng làm."
  diplomacy_family.2300.desc.c:0 "\n\nMột kẻ dị dạng xấu xí, [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] của Ta làm hoen ố dòng tộc [bad_relative.GetDynasty.GetName] với mỗi hơi thở của hắn. Làm sao một dòng dõi cao quý như vậy lại sinh ra một sinh vật như [bad_relative.GetHerHim]?"
  diplomacy_family.2300.desc.d:0 "\n\nMột nhánh khô héo và vặn vẹo treo lủng lẳng trên cây gia phả tràn đầy sức sống của chúng ta, [ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))] của ta là lời nhắc nhở thường trực về sự ngoại tình của [bad_parent.GetFirstNamePossessive]."
  diplomacy_family.2300.a:0 "Có lẽ ta có thể rèn giũa [bad_relative.GetHerHim] thành người có ích."
  diplomacy_family.2300.a.success.tt:0 "Ta giúp [bad_relative.GetFirstName] học được điều gì đó hữu ích"
  diplomacy_family.2300.a.success.effect.tt:0 "Một trong các [skills|E] của [bad_relative.GetFirstNamePossessive] sẽ tăng"
  diplomacy_family.2300.a.failure.tt:0 "[bad_relative.GetFirstName] từ chối sự giúp đỡ của ta"
  diplomacy_family.2300.a.failure.toast:0 "Ta đã không thể dạy [bad_relative.GetFirstName] điều gì đáng kể"
  diplomacy_family.2300.b.a:0 "Ta phải tiếp tục nỗ lực loại bỏ [bad_relative.GetHerHim]."
  diplomacy_family.2300.b.b:0 "Đôi khi phải tỉa bớt cành cây..."
  diplomacy_family.2300.c:0 "Ta phải trục xuất [bad_relative.GetHerHim]!"
  diplomacy_family.2300.c.flavor:0 "[dynast|E] có quyền tước quyền thừa kế của các thành viên gia tộc"
  diplomacy_family.2300.d:0 "Ai cũng có khuyết điểm."
  diplomacy_family.2301.desc:0 "Thật khó khăn để nhét được điều gì đó vào cái đầu cứng như đá của [bad_relative.GetFirstNamePossessive], nhưng bằng cách nào đó ta đã làm được. Ít nhất thì [bad_relative.GetSheHe] giờ đây không còn hoàn toàn là một nỗi thất vọng nữa..."
  diplomacy_family.2301.a:0 "Ta đã làm hết sức mình."

