l_english:
 ###################
 # Standard Events #
 ###################

 # The Power of Words
  diplomacy_majesty.0004.t:0 "Sức Mạnh Của Lời Nói"
  diplomacy_majesty.0004.desc:0 "Cả ta và [compliment_receiver.Custom2('MyCharacterIntroduction', ROOT.Char)] đều nhận ra điều đó — những nụ cười gượng gạo, những cuộc trò chuyện ngập ngừng, rồi sau đó là một khoảng im lặng khó chịu. Dường như giữa ta và ngài có điều gì đó không ổn.\n\nCó lẽ một lời khen khéo léo sẽ khiến việc giao tiếp giữa chúng ta dễ dàng hơn? Lần tới gặp mặt, ta có thể ca ngợi [compliment_receiver.GetHerHis]..."
  diplomacy_majesty.0004.compassionate:0 "Sự thấu cảm và tấm lòng nhân hậu."
  diplomacy_majesty.0004.bold:0 "Lòng dũng cảm không lay chuyển."
  diplomacy_majesty.0004.honorable:0 "Sự trung thành và danh dự."
  diplomacy_majesty.0004.greed:0 "Tham vọng vươn cao."
  diplomacy_majesty.0004.rational:0 "Sự lý trí sáng suốt."
  diplomacy_majesty.0004.zealous:0 "Niềm tin kiên định vào [compliment_receiver.GetFaith.HighGodName]."
  diplomacy_majesty.0004.energetic:0 "Sức sống trẻ trung."
  diplomacy_majesty.0004.forgiving:0 "Tấm lòng khoan dung."
  diplomacy_majesty.0004.beautiful:0 "Dung mạo anh tuấn."
  diplomacy_majesty.0004.strong:0 "Sức mạnh nơi cánh tay."
  diplomacy_majesty.0004.extroverted:0 "Khả năng giao tiếp xuất chúng."
  diplomacy_majesty.0004.dominant:0 "Khí chất uy quyền."
  diplomacy_majesty.0004.fallback:0 "...thôi vậy. Ta e rằng mình có thể xúc phạm [compliment_receiver.GetHerHim]!"
  diplomacy_majesty.0004.compliment.tt:0 "Phản ứng của [compliment_receiver.GetTitledFirstNamePossessive] sẽ phụ thuộc vào việc lời khen có phù hợp với [compliment_receiver.GetHerHim] hay không:"
  diplomacy_majesty.0004.success.tt:1 "Lời khen của ngươi được đón nhận nồng hậu"
  diplomacy_majesty.0004.neutral.tt:1 "Lời khen của ngươi chẳng gây ấn tượng"
  diplomacy_majesty.0004.failure.tt:1 "Lời khen của ngươi nghe như một lời xúc phạm"
  diplomacy_majesty.0004.neutral_outcome.desc:0 "Lời khen ta dành cho [compliment_receiver.GetTitledFirstName] chẳng gây được ấn tượng."
  diplomacy_majesty.0005.t:1 "$diplomacy_majesty.0004.t$: Ngọt Như Mật"
  diplomacy_majesty.0005.desc:0 "Lời khen mà ta chuẩn bị cẩn thận được đáp lại bằng một nụ cười biết ơn và chút ửng đỏ trên má của [compliment_receiver.GetTitledFirstNamePossessive]. Cuộc trò chuyện sau đó trở nên dễ chịu hơn bất kỳ lần nào chúng ta có trong nhiều tháng qua."
  diplomacy_majesty.0005.a:0 "Vài lời tử tế quả thật có thể tạo nên điều kỳ diệu!"

  diplomacy_majesty.0006.t:1 "$diplomacy_majesty.0004.t$: Đắng Như Ngải"
  diplomacy_majesty.0006.desc:0 "Ta vốn định nói lời tử tế, nhưng phản ứng của [compliment_receiver.GetTitledFirstNamePossessive] khiến ta không còn nghi ngờ gì về thất bại của mình. Ánh mắt phẫn nộ trên gương mặt [compliment_receiver.GetHerHis] khiến tim ta như rơi xuống tận đáy."
  diplomacy_majesty.0006.a:0 "Sao ta lại có thể vụng về đến vậy..."
 
 # Kindred Spirits
  diplomacy_majesty.0016.t:0 "Tâm Hồn Đồng Điệu"
  diplomacy_majesty.0016.desc:0 "Ta nhận ra rằng ta và [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] dường như suy nghĩ và hành động khá giống nhau. Có lẽ chúng ta không phải lúc nào cũng đồng ý, nhưng sâu thẳm bên trong, ta nghĩ chúng ta khá tương hợp.\n\nĐây có thể là nền tảng của một tình bằng hữu lâu dài — hoặc một điểm yếu để khai thác..."
  diplomacy_majesty.0016.a:0 "Chúng ta sẽ trở thành bằng hữu thân thiết!"
  diplomacy_majesty.0016.a.tt:0 "[scheme|E] này sẽ có [success_chance|E] cao hơn"
  diplomacy_majesty.0016.b:0 "Ta sẽ khiến [potential_friend.GetHerHim] nằm gọn trong tay ta..."
  diplomacy_majesty.0016.c:0 "Ta không cần bằng hữu, ta có dao!"

 # Loyal Subjects
  diplomacy_majesty.1020.t:0 "Trung Thành Hay Sợ Hãi"
  diplomacy_majesty.1020.desc:0 "Với tư cách là [ROOT.Char.GetTitleAsName] của họ, các [ROOT.Char.Custom('GetFollowerOrVassalPlural')] phải thề trung thành với ta. Lời ta chính là luật. Nhưng sự phục tùng mà không có lòng tận tâm thì đáng giá bao nhiêu?\n\nTrong lúc khủng hoảng, chỉ cần phản ứng chậm chạp hay nỗ lực nửa vời cũng có thể dẫn đến thảm họa. Ta có thể chấp nhận rủi ro đó sao?"
  diplomacy_majesty.1020.a:0 "Ta sẽ giành được lòng trung thành tuyệt đối của họ."
  diplomacy_majesty.1020.b:0 "Ta còn những [important_ruler.GetWomenMen] quan trọng hơn để gây ấn tượng."
  diplomacy_majesty.1020.c:0 "Nỗi sợ là công cụ hiệu quả hơn nhiều."
  diplomacy_majesty.1020.d:0 "Tại sao ta phải bận tâm người khác nghĩ gì về ta?"

 # A Battle of Ideas
  diplomacy_majesty.4030.t:0 "Trận Chiến Tư Tưởng"
  diplomacy_majesty.4030.desc:0 "Khi dành nhiều thời gian hơn để rèn luyện kỹ nghệ cai trị và ngoại giao, ta nhận thấy những điểm tương đồng giữa cuộc sống ở [ROOT.Char.Custom('GetCourt')] và chiến tranh. Đọc vị đối thủ... các nước cờ... \n\nGiữ kín những suy nghĩ này có thể mang lại cho ta một vũ khí bí mật để đảm bảo đạt được mục đích. Hoặc là, ta có thể chia sẻ ý tưởng này với [event_target.GetTitledFirstName] để giành được sự thiện chí [event_target.GetHerHis] của hắn..."
  diplomacy_majesty.4030.a:0 "Ta phải phát triển thêm học thuyết này!"
  diplomacy_majesty.4030.a.success:0 "Chiến thuật mới của ta hoạt động vô cùng hiệu quả"
  diplomacy_majesty.4030.a.failure:0 "Ta không thể phát triển được chiến thuật hữu ích"
  diplomacy_majesty.4030.b:0 "Đồng minh là điều cần thiết trong cả chiến tranh lẫn hòa bình."
  diplomacy_majesty.4030.c:0 "Chỉ cần suy nghĩ như vậy cũng đã có lợi rồi."

  diplomacy_majesty.4031.t:1 "$diplomacy_majesty.4030.t$: Ảnh Hưởng"
  diplomacy_majesty.4031.desc:0 "Sau nhiều đêm suy ngẫm, ta đã nghĩ ra một chiến lược vững chắc để chứng minh quan điểm của mình trong một cuộc tranh luận.\n\nTa sẽ bắt đầu từ một vị thế vững chắc bằng cách chọn một lập trường phổ biến về một chủ đề không thể bị bác bỏ, rồi từ đó công kích các lập luận của đối thủ và chỉ ra mọi sai sót của họ.\n\nBằng cách đó ta sẽ loại bỏ mọi giải pháp có thể cho vấn đề... ngoại trừ giải pháp mà ta ủng hộ."
  diplomacy_majesty.4031.a:0 "Kỹ thuật này sẽ khiến mọi người đứng về phía ta."

  diplomacy_majesty.4032.t:1 "$diplomacy_majesty.4030.t$: Những Cuộc Đụng Độ Khó Lường"
  diplomacy_majesty.4032.desc:0 "Ta đã dành nhiều đêm nghĩ ra chiến thuật để dẫn dắt các cuộc trò chuyện theo hướng mình mong muốn, cân nhắc mọi cách mà người khác có thể phản ứng với lời nói của ta.\n\nThế nhưng mỗi lần ta thử áp dụng những chiến lược này, mọi chuyện lại không bao giờ diễn ra như ta dự đoán. Có lẽ chẳng có kế hoạch nào tồn tại được khi đối mặt với đối thủ."
  diplomacy_majesty.4032.a:0 "Ít ra thất bại này không khiến ai mất mạng."

  diplomacy_majesty.4033.t:0 "Chuỗi Cung Ứng Ý Tưởng"
  diplomacy_majesty.4033.desc:0 "Hôm nay [thinker.GetTitledFirstName] đến gặp ta với một ý tưởng khá thú vị. [thinker.GetSheHe|U] nói rằng có thể xem một cuộc tranh luận tại triều đình giống như một trận chiến chính diện. Mỗi người tham gia đều theo đuổi mục tiêu riêng, cố gắng lái cuộc trò chuyện theo lợi thế của mình, nhưng rốt cuộc chỉ có một kẻ chiến thắng."
  diplomacy_majesty.4033.a:0 "[thinker.GetSheHe|U] quả thật có những ý tưởng ngoại giao rất thú vị!"

 # Lure of Language
  diplomacy_majesty.4070.t:0 "Sức Hấp Dẫn Của Ngôn Ngữ"
  diplomacy_majesty.4070.desc:0 "Cai trị vùng đất đa văn hóa [ROOT.Char.GetPrimaryTitle.GetName] mang theo những thử thách riêng. Những [ROOT.Char.Custom('GetCourtierPlural')] ngoại quốc thường cảm thấy lạc lõng khi họ không thể nói tiếng mẹ đẻ tại [ROOT.Char.Custom('GetCourt')], từ đó nảy sinh oán giận.\n\n[my_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] gợi ý rằng ta có thể cải thiện đáng kể quan hệ với các [my_vassal.GetCulture.GetName] [ROOT.Char.Custom('GetCourtierPlural')] của mình nếu học nói ngôn ngữ của họ bên cạnh tiếng của ta."
  diplomacy_majesty.4070.a:0 "Đã đến lúc vùi đầu vào sách vở!"
  diplomacy_majesty.4070.b:0 "Thuê một gia sư dạy ta."
  diplomacy_majesty.4070.c:0 "Tại sao phải bận tâm? [ROOT.Char.GetCulture.GetNameNoTooltip] rõ ràng ưu việt hơn."
  diplomacy_majesty.4070.d:0 "Gia sư triều đình của ta chắc chắn có thể giúp!"
  diplomacy_majesty.4070.success:0 "Ta học được cách nói ngôn ngữ [my_vassal.GetCulture.GetName]"
  diplomacy_majesty.4070.failure:0 "Ta không thể học được ngôn ngữ mới"
  diplomacy_majesty.4070.failure.tt:1 "Ngươi có thể chọn tiếp tục học"

  diplomacy_majesty.4071.t:1 "$diplomacy_majesty.4070.t$: Đã Học Được Ngôn Ngữ"
  diplomacy_majesty.4071.desc:0 "Sau nhiều tuần dài học tập, cuối cùng ta cũng nắm vững những nền tảng cơ bản của ngôn ngữ [my_vassal.GetCulture.GetName].\n\nNếu tiếp tục luyện tập, sự lưu loát của ta sẽ tăng lên, nhưng ngay cả hiểu biết cơ bản này cũng đã cải thiện quan hệ giữa ta và các [my_vassal.GetCulture.GetNameNoTooltip] [ROOT.Char.Custom('GetCourtierPlural')]."
  diplomacy_majesty.4071.a:0 "Thời gian bỏ ra thật xứng đáng."
  diplomacy_majesty.4071.b:0 "Một nền văn hóa thật thú vị... ta muốn tìm hiểu thêm!"
  diplomacy_majesty.4070.b.custom:1 "Mọi [close_family|E] [ROOT.Char.Custom('GetCourtier')] và chư hầu trực hệ là con cái"

  diplomacy_majesty.4072.t:1 "$diplomacy_majesty.4070.t$: Khó Hiểu!"
  diplomacy_majesty.4072.desc:0 "Dù đã học nhiều tuần, ta vẫn không thể nắm vững ngôn ngữ [my_vassal.GetCulture.GetName]. Ta đã học được vài từ, nhưng ngữ pháp, cách diễn đạt... tất cả vẫn lẩn tránh ta. Ta không nghĩ việc này còn hiệu quả nữa."
  diplomacy_majesty.4072.a:0 "Ta phải tiếp tục cố gắng!"
  diplomacy_majesty.4072.b:0 "Thời gian của ta nên dành cho việc khác."
  diplomacy_majesty.4072.c:0 "$diplomacy_majesty.4070.b$"

  diplomacy_majesty.4073.t:1 "$diplomacy_majesty.4070.t$: Công Cốc"
  diplomacy_majesty.4073.desc:0 "Dù ta không muốn thừa nhận, nhưng có lẽ ta sẽ không bao giờ thành thạo ngôn ngữ [my_vassal.GetCulture.GetName]. Ta đã thử hết lần này đến lần khác nhưng vẫn không tiến bộ... ta phải chấp nhận điều đó."
  diplomacy_majesty.4073.a:0 "Ta bỏ cuộc."

 # Trappings of Majesty
  diplomacy_majesty.4090.t:0 "Vẻ Uy Nghi Của Vương Quyền"
  diplomacy_majesty.4090.desc:0 "Ta đứng trên thần dân với tư cách là vị quân chủ tối cao, không ai trong lãnh địa có thể sánh bằng. Khoác lên mình những y phục lộng lẫy và trang sức quý giá sẽ là lời nhắc nhở tinh tế cho mọi người rằng ta chính là người nắm quyền."
  diplomacy_majesty.4090.a:0 "Chỉ những tấm lông chồn và nhung thượng hạng mới xứng với ta!"
  diplomacy_majesty.4090.b:0 "Trang phục địa phương mang ý nghĩa biểu tượng."
  diplomacy_majesty.4090.b.desc:0 "Ta tìm một thợ may giỏi trong việc sử dụng vật liệu địa phương"
  diplomacy_majesty.4090.b.success:0 "Ta có được một bộ y phục xứng với một [me.GetTitleAsNameNoTooltip]"
  diplomacy_majesty.4090.b.success.tt:1 "Bộ y phục mới lộng lẫy của ngươi thực sự xứng với một [me.GetTitleAsNameNoTooltip]!"
  diplomacy_majesty.4090.b.failure:0 "Ta có được một bộ y phục tẻ nhạt và chẳng ấn tượng"
  diplomacy_majesty.4090.b.failure.tt:1 "Bộ y phục mới của ngươi không gây ấn tượng với bất kỳ ai."
  diplomacy_majesty.4090.c:0 "Ta không cần #EMP những thứ đó#! để hợp pháp hóa quyền lực của mình!"
  diplomacy_majesty.4090.c.zealous:0 "Những người phụng sự [ROOT.Char.GetFaith.HighGodNamePossessive] không cần xa hoa!"
  diplomacy_majesty.4090.d.lunatic.male:0 "Quần chỉ là nhà tù cho đôi chân!"
  diplomacy_majesty.4090.d.lunatic.neutral:0 "Quần áo chỉ là nhà tù của cơ thể!"
  diplomacy_majesty.4090.d.lunatic.female:0 "Đai nịt chỉ là xiềng xích áp bức!"
  diplomacy_majesty.4090.d.lunatic_beautiful:0 "Không trang phục nào sánh được với vẻ đẹp tự nhiên của ta!"

 ##################
 # Special Events #
 ################## 

 # A Tedious Disagreement
  diplomacy_majesty_special.1010.t:0 "Một Cuộc Tranh Cãi Mệt Mỏi"
  diplomacy_majesty_special.1010.start.desc:0 "[debater.Custom2('MyCharacterIntroduction', ROOT.Char)|U] và ta lúc nào cũng kết thúc bằng việc tranh luận về"
  diplomacy_majesty_special.1010.divine_attributes.desc:0 "sự tương thích của các thuộc tính thần thánh."
  diplomacy_majesty_special.1010.free_will.desc:0 "sự hòa hợp giữa tri thức toàn tri của thần linh và ý chí tự do."
  diplomacy_majesty_special.1010.faith_reason.desc:0 "mối quan hệ giữa đức tin và lý trí."
  diplomacy_majesty_special.1010.just_war.desc:0 "bản chất của chiến tranh chính nghĩa."
  diplomacy_majesty_special.1010.chivalry.desc:0 "giá trị của tinh thần hiệp sĩ."
  diplomacy_majesty_special.1010.seven_virtues.desc:0 "đức hạnh quan trọng nhất trong bảy đức hạnh."
  diplomacy_majesty_special.1010.duty_women.desc:0 "bổn phận của phụ nữ."
  diplomacy_majesty_special.1010.mercy.desc:0 "liệu lòng nhân từ có phải là dấu hiệu của sự yếu đuối."
  diplomacy_majesty_special.1010.ambition.desc:0 "tham vọng là tội lỗi hay sức mạnh."
  diplomacy_majesty_special.1010.inheritance.desc:0 "những vấn đề về luật thừa kế."
  diplomacy_majesty_special.1010.mapped_territory.desc:0 "điều gì nằm ngoài rìa của những vùng đất đã được vẽ trên bản đồ."
  diplomacy_majesty_special.1010.heroism.desc:0 "liệu chủ nghĩa anh hùng là lòng dũng cảm hay sự ngu ngốc."
  diplomacy_majesty_special.1010.end.desc:0 "Chúng ta chẳng bao giờ đi đến đâu, chỉ lặp lại cùng một lập luận hết lần này đến lần khác...\n\nĐủ rồi. Lần tới khi chủ đề này được nhắc lại sẽ là lần cuối."
  diplomacy_majesty_special.1010.o.tt:1 "Ngươi sẽ tranh luận với [debater.GetFirstNameNoTooltip] trong thời gian gần"
  diplomacy_majesty_special.1010.a:0 "Nghiên cứu kỹ chủ đề này để chuẩn bị."
  diplomacy_majesty_special.1010.a.success.desc:0 "Ta hiểu rõ chủ đề hơn"
  diplomacy_majesty_special.1010.a.success.tt:1 "Ngươi tăng cơ hội thắng trong cuộc tranh luận cuối cùng thêm #P 20%#!"
  diplomacy_majesty_special.1010.a.success.message:0 "Việc nghiên cứu của ta diễn ra thuận lợi và giờ ta đã chuẩn bị tốt hơn cho cuộc tranh luận cuối cùng."
  diplomacy_majesty_special.1010.a.failure.desc:0 "Ta tự làm mình kiệt sức"
  diplomacy_majesty_special.1010.a.failure.tt:1 "Ngươi giảm cơ hội thắng trong cuộc tranh luận cuối cùng #N 20%#!"
  diplomacy_majesty_special.1010.a.failure.message:0 "Ta kiệt sức vì học quá nhiều và chẳng nhớ được bao nhiêu."
  diplomacy_majesty_special.1010.b:0 "Nghiên cứu đối thủ có thể giúp ta chiếm ưu thế..."
  diplomacy_majesty_special.1010.b.success.desc:0 "Ta hiểu rõ hơn về [debater.GetTitledFirstNameNoTooltip]"
  diplomacy_majesty_special.1010.b.success.tt:1 "Ngươi sẽ nhận được gợi ý về chiến thuật nên chọn trong cuộc tranh luận cuối cùng"
  diplomacy_majesty_special.1010.c:0 "Nghỉ ngơi một chút sẽ giúp ta sẵn sàng đối đầu."
  diplomacy_majesty_special.1010.d:0 "Ta sẽ cho tên [debater.Custom2('InsultNoun', ROOT.Char)] kia biết ai mới là người nắm quyền!"
  diplomacy_majesty_special.1010.e:0 "Có lẽ để [debater.GetHerHim] thắng sẽ dễ dàng hơn."
 
  diplomacy_majesty_special.1011.start.desc:0 "Lại là chuyện này nữa, đúng như ta dự đoán, chúng ta lại cãi vã về"
  diplomacy_majesty_special.1011.study_subject_success.desc:0 "May thay việc chuẩn bị của ta diễn ra rất thuận lợi — ta có vài lập luận mới trong tay!"
  diplomacy_majesty_special.1011.study_opponent_success.desc:0 "Thật may là ta phát hiện ra mình có thể lợi dụng điểm mạnh [debater.Custom('StrongestAIValueNoun')] của [debater.GetFirstNamePossessive]!"
  diplomacy_majesty_special.1011.failure.desc:0 "Không may là thời điểm thật tệ. Đêm qua ta thức quá khuya để chuẩn bị."
  diplomacy_majesty_special.1011.end.desc:0 "\n\nTừng người xung quanh bắt đầu dừng lại lắng nghe cuộc tranh luận của chúng ta — có kẻ kín đáo, có kẻ thì không. Đã đến lúc kết thúc chuyện này, một lần và mãi mãi.\n\nTrước khi bắt đầu, ta nên quyết định kết quả mà ta mong muốn nhất."
  diplomacy_majesty_special.1011.a:0 "Ta muốn thuyết phục [debater.GetHerHim] đứng về phía mình."
  diplomacy_majesty_special.1011.a.flavor:0 "Để làm được điều đó, ta phải trình bày ý tưởng theo cách mà [debater.GetFirstNameNoTooltip] có thể chấp nhận..."
  diplomacy_majesty_special.1011.b:0 "Ta muốn nghiền nát [debater.GetHerHim] trước mặt mọi người!"
  diplomacy_majesty_special.1011.b.flavor:0 "Để làm được điều đó, ta phải lợi dụng một khuyết điểm trong tính cách của [debater.GetFirstNamePossessiveNoTooltip] để khiến [debater.GetHerHim] không thể suy nghĩ lý trí..."
  diplomacy_majesty_special.1011.a.desc:0 "Kết quả có thể xảy ra của cuộc tranh luận cuối cùng"
  diplomacy_majesty_special.1011.a.success.desc:0 "Nếu ta thắng cuộc tranh luận cuối cùng"
  diplomacy_majesty_special.1011.a.failure.desc:0 "Nếu ta thua cuộc tranh luận cuối cùng"
  diplomacy_majesty_special.1011.b.rival:0 "Có thể trở thành kình địch của ta"

  diplomacy_majesty_special.1012.desc:0 "Xét đến những gì ta biết về tính cách của [debater.GetFirstNamePossessive], ta tin rằng cách tốt nhất để thuyết phục [debater.GetHerHim] là..."
  diplomacy_majesty_special.1012.a:0 "... xây dựng lập luận dựa trên logic."
  diplomacy_majesty_special.1012.a.tt:0 "Hiệu quả với những kẻ lý trí, ích kỷ, hoài nghi hoặc lạnh lùng"
  diplomacy_majesty_special.1012.b:0 "... giữ bình tĩnh, dù chuyện gì xảy ra."
  diplomacy_majesty_special.1012.generic.tt:0 "Hiệu quả của chiến thuật phụ thuộc vào mức độ phù hợp với tính cách của [debater.GetTitledFirstNamePossessive]"
  diplomacy_majesty_special.1012.b.tt:0 "Hiệu quả với những kẻ táo bạo, năng động, thù dai hoặc thiếu danh dự"
  diplomacy_majesty_special.1012.c:0 "... kêu gọi những giá trị cao cả."
  diplomacy_majesty_special.1012.c.tt:0 "Hiệu quả với những kẻ danh dự, tốt bụng, khoan dung, sùng đạo hoặc thiếu tham vọng"
  diplomacy_majesty_special.1012.d:0 "... chăm chú lắng nghe lời [debater.GetHerHis]."
  diplomacy_majesty_special.1012.d.tt:0 "Hiệu quả với những kẻ thận trọng, uể oải hoặc thiếu hiểu biết"

  diplomacy_majesty_special.1013.logic.desc:0 "Bằng cách trình bày rõ ràng từng ý nối tiếp nhau, ta dựng nên một lập luận vững chắc chẳng khác gì tường thành của [ROOT.Char.Custom('FortifiedBuilding')]. Khi ta đi đến kết luận, [debater.GetFirstName] ngoài việc đồng ý ra thì không còn lựa chọn nào khác."
  diplomacy_majesty_special.1013.calm.desc:0 "Dù [debater.GetFirstName] có khiêu khích ta thế nào, ta vẫn giữ cảm xúc trong tầm kiểm soát, đáp lời bằng giọng điềm tĩnh và vững vàng. Điều đó khiến những kẻ đứng xem ấn tượng, họ bắt đầu gật đầu và khe khẽ đồng tình khi ta nói. Rồi [debater.GetFirstName] cũng bắt đầu lắng nghe, chẳng bao lâu sau chính [debater.GetHerHim] cũng bị thuyết phục."
  diplomacy_majesty_special.1013.higher_values.desc:0 "Biết rằng [debater.GetFirstName] là một [debater.GetWomanMan] luôn quan tâm đến lợi ích chung, ta viện dẫn những giá trị cao cả mà [debater.GetSheHe] trân trọng. Với góc nhìn ấy, cuối cùng [debater.GetSheHe] cũng nhận ra giá trị trong lập luận của ta. "
  diplomacy_majesty_special.1013.listen.desc:0 "Biết rằng [debater.GetFirstName] thiếu dũng khí để giữ vững lập trường [debater.GetHerHis] trong các cuộc tranh luận, ta đã làm điều mà chưa ai từng làm — ta lắng nghe [debater.GetHerHim]. Việc được coi trọng khiến [debater.GetHerHim] rất hài lòng, và sau khi [debater.GetSheHe] nói xong, [debater.GetSheHe] vui vẻ lắng nghe lại ý kiến của ta."
  diplomacy_majesty_special.1013.a.cruel:0 "Kẻ yếu bị thao túng thật dễ dàng."
  diplomacy_majesty_special.1013.a.compassionate:0 "Thật mừng vì chúng ta có thể gác lại chuyện này."

  diplomacy_majesty_special.1014.desc:0 "Nhớ đến những điểm yếu của [debater.GetFirstNamePossessive], ta nghĩ cách hiệu quả nhất để bẽ mặt [debater.GetHerHim] trước mọi người là..."
  diplomacy_majesty_special.1014.a:0 "... tỏ ra tàn nhẫn và khiến [debater.GetHerHim] khiếp sợ."
  diplomacy_majesty_special.1014.generic.tt:0 "#F Hiệu quả của chiến thuật phụ thuộc vào việc nó khai thác điểm yếu của [debater.GetTitledFirstNamePossessive] tốt đến mức nào.#!"
  diplomacy_majesty_special.1014.a.tt:0 "#F Hiệu quả với những kẻ thận trọng, tốt bụng, dễ tha thứ và lười biếng.#!"
  diplomacy_majesty_special.1014.b:0 "...khiêu khích [debater.GetHerHim] khiến hắn mất bình tĩnh [debater.GetHerHis]."
  diplomacy_majesty_special.1014.b.tt:0 "#F Hiệu quả với những kẻ táo bạo, năng nổ, thù dai và trọng danh dự.#!"
  diplomacy_majesty_special.1014.c:0 "... chỉ ra nhân cách thấp kém của [debater.GetHerHis]."
  diplomacy_majesty_special.1014.c.tt:0 "#F Hiệu quả với những kẻ vô danh dự, lạnh lùng, ích kỷ hoặc hoài nghi.#!"
  diplomacy_majesty_special.1014.d:0 "... phóng đại lập trường của [debater.GetHerHis]."
  diplomacy_majesty_special.1014.d.tt:0 "#F Hiệu quả với những kẻ ngu muội, cả tin hoặc thiếu tham vọng.#!"

  diplomacy_majesty_special.1015.scare.desc:0 "Ta lẽ ra có thể tinh tế hơn một chút, nhưng những lời đe dọa ẩn ý và những lời đáp trả cay độc của ta chắc chắn đã phát huy tác dụng. [debater.GetFirstName] gần như không thể diễn đạt được những luận điểm [debater.GetHerHis] của chính mình, chứ đừng nói đến chuyện phản đối ta!"
  diplomacy_majesty_special.1015.provoke.desc:0 "Thật dễ dàng để khiến [debater.GetFirstName] đáng thương phát điên. Ngay khi [debater.GetSheHe] nhận ra ánh mắt kinh ngạc của khán giả, thì đã quá muộn. So với [debater.GetHerHim], ta trông giống như một tấm gương sáng của trí tuệ mà hầu như không cần phải cố gắng."
  diplomacy_majesty_special.1015.exaggerate.desc:0 "Thay vì giải thích lập trường của mình, ta tập trung bóp méo và phóng đại quan điểm của [debater.GetFirstName]. Lúc đầu [debater.GetSheHe] không nhận ra, vẫn tiếp tục bảo vệ những quan điểm ngày càng lố bịch. Khi ta cuối cùng đưa ra lập luận của mình, khán giả đã đứng về phía ta."
  diplomacy_majesty_special.1015.low_character.desc:0 "Thay vì đáp lại lập luận của [debater.GetFirstNamePossessive] bằng sự thật và lý lẽ, ta so sánh quan điểm của [debater.GetHerHis] với những khuyết điểm trong nhân cách của [debater.GetHerHis]. Vì những thói xấu [debater.GetHerHis] như một [debater.Custom2('InsultAdjective', ROOT.Char)] đã quá nổi tiếng, chẳng bao lâu khán giả cũng nhìn nhận lập trường của [debater.GetHerHis] bằng ánh mắt khinh miệt, bất kể [debater.GetSheHe] nói gì."
  diplomacy_majesty_special.1015.a.cruel:0 "Ôi, vẻ mặt của [debater.GetHerHis] lúc đó! Thật vô giá!"
  diplomacy_majesty_special.1015.a.compassionate:0 "Có lẽ ta đã hơi quá lời..."

  diplomacy_majesty_special.1016.start.desc:0 "Dù ta đã cố gắng hết sức để"
  diplomacy_majesty_special.1016.logic.desc:0 "dùng lý lẽ thuyết phục [debater.GetFirstName], nhưng [debater.GetSheHe] lại quá bị cảm xúc chi phối để nhìn nhận rõ ràng."
  diplomacy_majesty_special.1016.calm.desc:0 "giữ bình tĩnh, những quan điểm lố bịch của [debater.GetFirstName] nhanh chóng khiến ta run lên vì tức giận. Cái tên [debater.Custom2('InsultAdjective', ROOT.Char)] [debater.Custom2('InsultNoun', ROOT.Char)] đó!"
  diplomacy_majesty_special.1016.higher_values.desc:0 "kêu gọi những giá trị cao cả của [debater.GetFirstNamePossessive], [debater.GetFirstName] lại quay sang cáo buộc ta cố tình lạc đề."
  diplomacy_majesty_special.1016.listen.desc:0 "chăm chú lắng nghe, [debater.GetFirstName] vẫn thao thao bất tuyệt theo cái kiểu vô nghĩa quen thuộc của [debater.GetHerHis]. Trong lúc ta mơ màng nghĩ đến những việc mình thích làm hơn, [debater.GetFirstName] dường như lại đưa ra vài luận điểm khá thuyết phục."
  diplomacy_majesty_special.1016.scare.desc:0 "đe dọa [debater.GetFirstName], [debater.GetSheHe] chỉ bật cười, còn ta thì trông vừa nhỏ nhen vừa ngu ngốc."
  diplomacy_majesty_special.1016.provoke.desc:0 "khiêu khích [debater.GetFirstName], [debater.GetSheHe] vẫn giữ bình tĩnh. Điều đó khiến khán giả ấn tượng, còn ta thì chỉ trông nhỏ nhen."
  diplomacy_majesty_special.1016.exaggerate.desc:0 "bóp méo quan điểm của [debater.GetFirstNamePossessive] để chống lại [debater.GetHerHim], ta lại vô tình rơi đúng vào cái bẫy của [debater.GetHerHis]."
  diplomacy_majesty_special.1016.low_character.desc:0 "chuyển trọng tâm sang nhân cách thấp kém của [debater.GetFirstNamePossessive], hóa ra chẳng ai khác nghĩ vậy cả. Trái lại, khán giả bắt đầu đứng ra bênh vực [debater.GetHerHim]!"
  diplomacy_majesty_special.1016.end.desc:0 "\n\nDù ta đúng đi nữa – [debater.GetFirstName] đã khiến những kẻ đứng xem hoàn toàn bị cuốn theo lời nói của [debater.GetHerHis], và họ chấp nhận mọi điều [debater.GetHerHis] nói mà không chút nghi ngờ."
  diplomacy_majesty_special.1016.a:0 "Thật là mất mặt..."

  diplomacy_majesty_special.1050.title:0 "Cuộc Tranh Luận Kết Thúc Bất Phân Thắng Bại"
  diplomacy_majesty_special.1050.message:0 "Ta chưa từng có cơ hội thử tài tranh biện của mình với [debater.GetTitledFirstName]."
