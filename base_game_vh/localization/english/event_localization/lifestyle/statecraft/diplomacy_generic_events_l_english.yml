l_english:

  diplomacy_lifestyle_rank_up_indication:1 "Ta có thể nhận được một [perk|E] thuộc [diplomacy_lifestyle|E]"
 
 ###################
 # Standard Events #
 ###################

 #Social Manipulation (Put a vassal in their place by manipulating them), by Mathilda Bjarnehed
  diplomacy_generic.0012.t:0 "Thao Túng Xã Hội"
  diplomacy_generic.0012.start.desc:0 "Lần đầu chuyện đó xảy ra, ta hầu như không để tâm, nhưng [disobedient_subject.Custom2('MyCharacterIntroduction', ROOT.Char)] ngày càng trở nên táo bạo. Những thách thức của [disobedient_subject.GetHerHis|U] giờ đây không còn bị bỏ qua"
  diplomacy_generic.0012.council.desc:0 "trên bàn hội nghị."
  diplomacy_generic.0012.vassal.desc:0 "giữa các chư hầu của ta."
  diplomacy_generic.0012.end.desc:0 "\n\n[disobedient_subject.GetSheHe|U] đang thử thách giới hạn của ta. Những kẻ khác chắc chắn sẽ bắt chước — trừ khi ta cho [disobedient_subject.GetHerHim] nếm trải quả đắng do chính [disobedient_subject.GetHerHis] tạo ra..."
  diplomacy_generic.0012.a:0 "Ta sẽ phớt lờ [disobedient_subject.GetHerHim] và chiếm lấy ý tưởng của [disobedient_subject.GetHerHis]."
  make_invisible_option.tt:2 "Ngài đoán rằng [disobedient_subject.GetFirstName] thiếu quyết đoán, uể oải, hoặc không có tham vọng"
  diplomacy_generic.0012.b:0 "Chế giễu [disobedient_subject.GetHerHis] [disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)] sẽ khiến [disobedient_subject.GetHerHim] câm miệng."
  ridicule_option.tt:2 "Ngài đoán rằng [disobedient_subject.GetFirstName] tự ti và quan tâm đến suy nghĩ của người khác"
  diplomacy_generic.0012.c:0 ""Quên" mời [disobedient_subject.GetHerHim] sẽ khiến [disobedient_subject.GetHerHim] bị bỏ ngoài cuộc."
  withhold_information_option.tt:0 "Ngươi đoán [disobedient_subject.GetFirstName] là kẻ yếu đuối hoặc chỉ biết giữ kín cho riêng [disobedient_subject.GetHerselfHimself]"
  diplomacy_generic.0012.d:0 "[disobedient_subject.GetSheHe|U] sẽ nhận những nhiệm vụ không thể hoàn thành."
  impossible_task_option.tt:0 "Ngươi đoán [disobedient_subject.GetFirstName] sẽ làm mọi cách trong khả năng của [disobedient_subject.GetHerHis] để hoàn thành nhiệm vụ"
  diplomacy_generic.0012.e:0 "Mọi vấn đề sẽ bị đổ lỗi cho [disobedient_subject.GetHerHim]."
  shame_option.tt:0 "Ngươi đoán [disobedient_subject.GetFirstName] là người có lương tâm, hoặc ít nhất muốn mọi người nghĩ tốt về [disobedient_subject.GetHerHim]"
  diplomacy_generic.0012.f:0 "Bình luận về [disobedient_subject.GetHerHis] [disobedient_subject.Custom('ObjectifiedFeature')] sẽ khiến [disobedient_subject.GetHerHim] mất bình tĩnh."
  objectification_option.tt:0 "Ngươi đoán [disobedient_subject.GetFirstName] thường bị coi như một món hàng vì vẻ bề ngoài [disobedient_subject.GetHerHis] của mình"
  diplomacy_generic.0012.g:0 "Một lời đe dọa bạo lực "tinh tế" sẽ chấm dứt chuyện này."
  threat_option.tt:2 "Ngài đoán rằng [disobedient_subject.GetFirstName] nhát gan hoặc muốn giữ hòa khí"
  diplomacy_generic.0012.h:1 ""Ngươi dám thách thức chính #EMP [ROOT.Char.GetTitleAsNameNoTooltip]# của mình sao!?""
  diplomacy_generic.0012.tt:0 "Không mấy ngoại giao, nhưng vẫn hiệu quả..."
 
  diplomacy_generic.0012.good_outcome.desc:1 "Ngài đã thao túng [disobedient_subject.GetTitledFirstNameNoTooltip]"
  diplomacy_generic.0012.bad_outcome.desc:0 "[disobedient_subject.GetTitledFirstNameNoTooltip] không bị lừa"
  diplomacy_generic.0012.terrible_outcome.desc:1 "[disobedient_subject.GetTitledFirstNameNoTooltip] đã qua mặt ngài"
  diplomacy_generic.0012.failure.desc:1 "Ngài không thể thao túng [disobedient_subject.GetTitledFirstName]"

  diplomacy_generic.0013.t:0 "Con Rối Trên Dây"
  diplomacy_generic.0013.make_invisible.desc:0 "Có vẻ như [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] [suppressor.GetTitledFirstName] của ta đã mất hứng thú với ý kiến của ta. Khi ta lên tiếng, [suppressor.GetSheHe] ngắt lời hoặc chuyển hướng sự chú ý [suppressor.GetHerHis] sang thứ khác. Nhưng đôi khi, có vẻ như [suppressor.GetSheHe] có lắng nghe, vì [suppressor.GetSheHe] lặp lại những ý tưởng của ta và tự nhận chúng là của [suppressor.GetHerHis]..."
  diplomacy_generic.0013.ridicule.desc:0 "Ta phải làm gì để được [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] của ta coi trọng? Mỗi khi ta nói, [suppressor.GetTitledFirstName] lại ngắt lời để chế giễu ý tưởng hoặc "[disobedient_subject.Custom2('PointOfRidicule', SCOPE.sC('suppressor'))]" của ta."
  diplomacy_generic.0013.withhold_information.desc:0 "Gần đây, dường như ai cũng biết chuyện trừ ta! Ta trông thật ngu ngốc khi liên tục phải hỏi [suppressor.GetTitledFirstName] giải thích trong các cuộc họp hoặc khi đưa ra đề xuất dựa trên thông tin cũ. Ta e rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] của ta đang cố tình giấu ta."
  diplomacy_generic.0013.impossible_task.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] của ta, [suppressor.GetTitledFirstName], cứ giao cho ta những nhiệm vụ không thể hoàn thành đúng hạn! Khi ta làm cẩn thận thì bị gọi là lười biếng, còn khi vội vàng thì [suppressor.GetSheHe] lại cho rằng ta cẩu thả."
  diplomacy_generic.0013.shame.desc:0 "Mỗi khi có vấn đề, [suppressor.GetTitledFirstName] dường như luôn nghĩ rằng ta là kẻ có lỗi. Nhưng khi chính ta nêu ra vấn đề, [suppressor.GetSheHe] lại buộc tội ta tập trung sai chỗ!"
  diplomacy_generic.0013.objectification.desc:0 "Mỗi khi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))] gọi họp, ta lại cảm thấy dạ dày nặng trĩu. Trong vài tuần qua, đã có không ít lời bình luận về "[disobedient_subject.Custom('ObjectifiedFeature')]" của ta, và khi ta nói, [suppressor.GetSheHe] dường như dành nhiều thời gian nhìn chằm chằm hơn là lắng nghe. Vì sao [suppressor.GetTitledFirstName] quan tâm đến thân thể ta hơn là lời nói và hành động của ta?"
  diplomacy_generic.0013.threat.desc:0 "Gần đây, ta nhận thấy một ánh nhìn kỳ lạ trên gương mặt [suppressor.GetTitledFirstNamePossessive] mỗi khi ta nói, pha trộn giữa bực bội và tức giận. Nhưng ta chỉ thật sự biết có điều không ổn cho đến hôm nay. Khi ta bất đồng với [suppressor.GetHerHim] trong cuộc họp, [suppressor.GetSheHe] đã đe dọa sẽ cho người đánh đòn ta!"
  diplomacy_generic.0013.a:0 "Trò chơi này không chỉ mình ngươi biết chơi."
  diplomacy_generic.0013.a.success.tt:1 "Ngài thao túng thành công [suppressor.GetTitledFirstNameNoTooltip]"
  diplomacy_generic.0013.a.failure.tt:1 "Ngài bị [suppressor.GetTitledFirstNameNoTooltip] thao túng"
  diplomacy_generic.0013.b:0 "Có lẽ ta xứng đáng bị đối xử như vậy..."

  diplomacy_generic.0014.t:1 "$diplomacy_generic.0012.t$: Bậc Thầy Áp Chế"
  diplomacy_generic.0014.make_invisible.desc:0 "Bất cứ khi nào [disobedient_subject.GetTitledFirstName] cất giọng [disobedient_subject.GetHerHis] lên để nói, ta đều ngáp dài, quay sang hướng khác hoặc cắt ngang lời [disobedient_subject.GetHerHim]. Khi những người khác bắt đầu làm theo gương ta, [disobedient_subject.GetTitledFirstNameNoTooltip] càng lúc càng trở nên ngập ngừng."
  diplomacy_generic.0014.ridicule.desc:0 "Những lời mỉa mai liên tục của ta về [disobedient_subject.GetTitledFirstNamePossessive] [disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)] dường như đã thực sự tác động đến [disobedient_subject.GetHerHim]! Khi những người khác bắt đầu làm theo ta, [disobedient_subject.GetTitledFirstNameNoTooltip] ngày càng do dự hơn."
  diplomacy_generic.0014.withhold_information.desc:0 "Kể từ khi ta bắt đầu giấu thông tin với [disobedient_subject.GetTitledFirstName], [disobedient_subject.GetSheHe] đã tự làm mình trở thành một gã ngốc [disobedient_subject.GetHerselfHimself] nhiều lần không đếm xuể. Việc bác bỏ những đề xuất lỗi thời [disobedient_subject.GetHerHis] còn dễ dàng hơn cả việc lừa một con chó."
  diplomacy_generic.0014.impossible_task.desc:0 "Khi [disobedient_subject.GetTitledFirstName] cố gắng hoàn thành nhiệm vụ [disobedient_subject.GetHerHis] một cách kỹ lưỡng, ta đã mắng nhiếc [disobedient_subject.GetHerHim] trước mặt mọi người, và khi [disobedient_subject.GetSheHe] vội vàng để hoàn thành đúng hạn, ta trưng ra kết quả công việc cẩu thả [disobedient_subject.GetHerHis] cho tất cả thấy. [disobedient_subject.GetSheHe|U] đã cố gắng hết sức [disobedient_subject.GetHerselfHimself] để làm hài lòng ta, nhưng ta chưa bao giờ ghi nhận nỗ lực [disobedient_subject.GetHerHis] của hắn."
  diplomacy_generic.0014.shame.desc:0 "Vấn đề mà [disobedient_subject.GetTitledFirstName] nêu ra trước đây khiến ta trông thật tệ, nhưng giờ tình thế đã đảo ngược. Mỗi lần [disobedient_subject.GetSheHe] nêu ra điều đáng lo, ta khéo léo đổ lỗi ngược lại cho [disobedient_subject.GetHerHim], hoặc khiến [disobedient_subject.GetHerHim] trông nhỏ nhặt vì đã nhắc đến nó."
  diplomacy_generic.0014.objectification.desc:0 "Những câu đùa dung tục, ánh nhìn kéo dài, ngắt lời [disobedient_subject.GetHerHis] để "khen" [disobedient_subject.GetHerHis] [disobedient_subject.Custom('ObjectifiedFeature')]. Từng chút một, ta đã bẻ gãy tinh thần [disobedient_subject.GetTitledFirstName], khiến [disobedient_subject.GetHerHim] trở nên căng thẳng và tự ti."
  diplomacy_generic.0014.threat.desc:0 "Đôi khi, chỉ cần một lời đe dọa bạo lực đơn giản là đủ."
  diplomacy_generic.0014.end.desc:0 "Giờ đây [disobedient_subject.GetSheHe] chỉ còn im lặng, mắt cúi xuống."
  diplomacy_generic.0014.a.cruel:0 "[disobedient_subject.GetSheHe|U] sẽ phải suy nghĩ kỹ trước khi dám thách thức ta lần nữa!"
  diplomacy_generic.0014.a.compassionate:0 "Có lẽ tàn nhẫn, nhưng cần phải làm vậy."

  diplomacy_generic.0015.t:1 "$diplomacy_generic.0012.t$: Từ Kẻ Giật Dây Thành Con Rối"
  diplomacy_generic.0015.make_invisible.desc:0 "Khi [disobedient_subject.GetTitledFirstName] cất giọng [disobedient_subject.GetHerHis] lên để nói, ta ngáp dài và quay sang đọc giấy tờ. Ta mong những người khác làm theo, nhưng thay vào đó họ lại tham gia vào cuộc đối thoại. Khi ta cuối cùng nuốt lòng kiêu hãnh để tham gia thì [disobedient_subject.GetFirstName] đã nắm thế thượng phong và những lời của ta sớm bị lãng quên."
  diplomacy_generic.0015.ridicule.desc:0 "Hóa ra trí tuệ của [disobedient_subject.GetTitledFirstNamePossessive] sắc bén hơn ta tưởng. Khi ta chế giễu [disobedient_subject.GetHerHis] [disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)], [disobedient_subject.GetSheHe] lập tức xoay chuyển tình thế và khiến ta trông nhỏ nhen vì dùng lời mỉa mai để đáp lại một vấn đề nghiêm túc."
  diplomacy_generic.0015.impossible_task.desc:0 "Đến ngạc nhiên, [disobedient_subject.GetTitledFirstName] đã xoay xở để nhờ một người khác giúp hoàn thành nhiệm vụ [disobedient_subject.GetHerHim] mà ta đã giao cho [disobedient_subject.GetHerHim]. Vì họ hầu như không có thời gian để thực hiện nó một cách tử tế, rõ ràng là ta đã đòi hỏi quá nhiều. Ta thậm chí không thể phàn nàn về cách họ thực hiện."
  diplomacy_generic.0015.shame.desc:0 "Đổ lỗi cho [disobedient_subject.GetTitledFirstName] khó hơn ta tưởng. Đúng, ta có thể thuyết phục, nhưng hóa ra [disobedient_subject.GetSheHe] còn giỏi trò này hơn ta. Chỉ với một câu, [disobedient_subject.GetSheHe] đã xé nát lời giải thích của ta, khiến ta trông như kẻ ngu ngốc hoặc không đáng tin. Ta cũng không biết cái nào tệ hơn."
  diplomacy_generic.0015.objectification.desc:0 "Ta tưởng những lời đùa dung tục sẽ khiến [disobedient_subject.GetTitledFirstName] im miệng, nhưng phản ứng của [disobedient_subject.GetHerHis] vừa đàng hoàng vừa sắc bén. Giờ đây mọi người nghĩ [disobedient_subject.GetSheHe] như một vị thánh, còn ta lại trông tầm thường và vô đạo đức."
  diplomacy_generic.0015.threat.desc:0 "Ta nghĩ những lời đe dọa của mình sẽ khiến [disobedient_subject.GetTitledFirstName] im lặng, nhưng [disobedient_subject.GetSheHe] chỉ đơn giản phớt lờ và tiếp tục. Sự không hề sợ hãi của [disobedient_subject.GetHerHis|U] khiến lời ta nghe thật tầm thường thay vì đáng sợ."
  diplomacy_generic.0015.withhold_information.desc:0 "Dù ta thường xuyên "quên" gửi tin nhắn cho [disobedient_subject.GetTitledFirstName] hoặc mời [disobedient_subject.GetHerHim] đến họp, [disobedient_subject.GetSheHe] dường như vẫn luôn nắm rõ mọi chuyện. Giờ đây so ra ta lại trông bối rối và kém cỏi!"
  diplomacy_generic.0015.a:0 "Lần này ngươi thắng, [disobedient_subject.GetFirstNameNoTooltip]."
