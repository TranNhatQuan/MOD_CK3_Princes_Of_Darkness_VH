l_english:

 ###################
 # Standard Events #
 ###################

 # Diplomacy (Majesty) Events:
 	# 1074		 : Religious Refugees (Oppressed faithful in neighboring county), by Sean Hughes
 	# 3001 — 3008: Correspondence (Become pen pals with a foreign ruler), by Linnéa Thimrén and Sean Hughes

 # Diplomay (Majesty) Special Events:
 	#1010 — 1031: Foreign Relations (Invite a foreign ruler to your court), by Mathilda Bjarnehed
 	#1032 — 1051: The Weak Link	(One of your neighbor's vassals is disloyal), by Mathilda Bharnehed

 # Religious Refugees, by Sean Hughes
	diplomacy_foreign.1074.t:0 "Những Người Tị Nạn Tôn Giáo"
	diplomacy_foreign.1074.desc:0 "[heretic_ruler.GetTitledFirstName] cai trị [target_county.GetName] ở gần đây, nơi sinh sống của rất nhiều tín đồ sùng đạo [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. [heretic_ruler.GetFaith.GetAdherentName] [heretic_ruler.GetTitleAsName] hoàn toàn có thể đàn áp những tín đồ trung thành [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] sống tại đó, và trách nhiệm của ta là bảo vệ họ khỏi ảnh hưởng [ROOT.GetCharacter.Custom2('ToleranceValue', SCOPE.sC('heretic_ruler'))] của [heretic_ruler.GetHerHis]."
	diplomacy_foreign.1074.a:0 "Chúng ta không thể để [heretic_ruler.GetHerHim] đàn áp những người trung thành!"
	diplomacy_foreign.1074.b:0 "Lén đưa càng nhiều [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] đến nơi an toàn càng tốt."
	diplomacy_foreign.1074.c:0 "Gửi một sứ giả đến chỗ [heretic_ruler.GetFirstNameNoTooltip] để thảo luận về cách đối xử của họ."
	diplomacy_foreign.1074.c.success:0 "[heretic_ruler.GetFirstName] tiếp đón sứ giả của ta một cách cởi mở"
	diplomacy_foreign.1074.c.failure:0 "[heretic_ruler.GetFirstName] nghi ngờ ý định của sứ giả ta"

 # Correspondence, by Linnéa Thimrén and Sean Hughes
	diplomacy_foreign.3001.t:0 "Thư Từ Qua Lại" # <DELETE THIS KEY>
	diplomacy_foreign.3001.opening:0 "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
	diplomacy_foreign.3001.desc:0 "Ta đã nghe nhiều điều tốt đẹp về ngài, và ta muốn bắt đầu một cuộc trao đổi thư từ. Mong rằng bức thư này đến tay ngài khi ngài sẵn lòng, bởi ta đang chờ hồi âm nhanh chóng của ngài."
	diplomacy_foreign.3001.a:0 "Bắt đầu trao đổi thư từ với [neighboring_ruler.GetFirstNameNoTooltip]."
	diplomacy_foreign.3001.a.tt:1 "Ngươi sẽ tiếp tục nhận được thư từ [neighboring_ruler.GetFirstName]"
	diplomacy_foreign.3001.b:0 "Đóng khung lá thư của [neighboring_ruler.GetTitleAsNamePossessiveNoTooltip] trong đại sảnh của ta!"
	diplomacy_foreign.3001.c:0 "Lịch sự từ chối."

	diplomacy_foreign.3003.desc_dead:0 "Người tiền nhiệm của ta, [dead_ruler.GetTitledFirstName], đã khuyến khích ta tiếp tục việc trao đổi thư từ của [dead_ruler.GetHerHis] với ngài. Ta phải thừa nhận rằng ta không chắc nên viết gì — xin ngài hãy chọn một chủ đề!"
	diplomacy_foreign.3003.desc:0 "Cảm ơn ngài vì hồi âm nhanh chóng! Ta rất mong chờ cuộc trao đổi thư từ của chúng ta. Xin ngài hãy chọn chủ đề đầu tiên để chúng ta cùng bàn luận!"
	diplomacy_foreign.3003.a_lifestyle_diplomat:0 "Hãy bàn về những quy tắc lễ nghi tinh tế!"
	diplomacy_foreign.3003.a_lifestyle_general:0 "Ta có vài câu chuyện chiến trận rất hay để kể."
	diplomacy_foreign.3003.a_lifestyle_administrator:0 "Những điều đặc biệt trong việc quản lý lãnh địa thật sự #EMP hấp dẫn!#!"
	diplomacy_foreign.3003.a_lifestyle_schemer:0 "Ồ, ta cá là [neighboring_ruler.GetSheHe] sẽ thích nghe những tin đồn mới nhất..."
	diplomacy_foreign.3003.a_lifestyle_scholar:0 "Những cuộc tranh luận triết học luôn thú vị!"
	diplomacy_foreign.3003.a.tt:1 "Bắt đầu với chủ đề ngươi am hiểu có thể gây ấn tượng với [neighboring_ruler.GetHerHim]"
	diplomacy_foreign.3003.b:2 "Xin hãy kể cho ta nghe về [neighboring_ruler.Custom('subject_of_interest')]."
	diplomacy_foreign.3003.b.tt:1 "Ngươi nghe đồn rằng chủ đề này rất được [neighboring_ruler.GetHerHis] quan tâm"
	diplomacy_foreign.3003.c:1 "Ta sẽ gửi một món quà để thể hiện sự trân trọng."
	diplomacy_foreign.3003.c.tt:1 "Ngươi tin rằng [neighboring_ruler.GetSheHe] là một [neighboring_ruler.GetWomanMan] coi trọng vật chất"

	diplomacy_foreign.3007.desc_dead:0 "Người tiền nhiệm của ta, [dead_ruler_2.GetTitledFirstName], đã khuyến khích ta tiếp tục việc trao đổi thư từ của [dead_ruler_2.GetHerHis] với ngài. Lá thư cuối cùng ngài gửi đã để lại cho ta ấn tượng rất tốt!"
	diplomacy_foreign.3007.desc_lifestyle:0 "Ta rất vui khi thấy ngài tận tâm với niềm đam mê của mình. Lá thư trước của ngài thực sự chứng minh tài năng của ngài!"
	diplomacy_foreign.3007.desc_interest:0 "Không ngờ ngài lại hỏi về một chủ đề thân thuộc với ta đến vậy — ngài hiểu ta hơn hầu hết mọi người!"
	diplomacy_foreign.3007.desc_gift:0 "Món quà ngài gửi cho ta thật đáng quý!"
	diplomacy_foreign.3007.desc_ending:0 "Vì ngài đã chiều ý ta như vậy, ta phải hỏi: có điều gì ta có thể làm cho ngài không?"
	diplomacy_foreign.3007.a:0 "Ta chỉ mong tiếp tục trao đổi thư từ!"
	diplomacy_foreign.3007.a_random_list_good:0 "Cuộc trao đổi thư từ giúp ta học được nhiều điều về ngoại giao"
	diplomacy_foreign.3007.a_random_list_bad:0 "Ta không học được nhiều từ những lá thư của [neighboring_ruler.GetFirstNamePossessiveNoTooltip]"
	diplomacy_foreign.3007.b:0 "Có lẽ chúng ta có thể sắp xếp một thỏa thuận thương mại?"
	diplomacy_foreign.3007.c:0 "Giờ ta đã chiều theo mong muốn trò chuyện của ngài..."
	diplomacy_foreign.3007.c_tt:0 "Ta cố thuyết phục [neighboring_ruler.GetFirstNameNoTooltip] rằng [neighboring_ruler.GetSheHe] nợ ta!"
	diplomacy_foreign.3007.c_random_list_good:0 "Ta thuyết phục được [neighboring_ruler.GetFirstNameNoTooltip]"
	diplomacy_foreign.3007.c_random_list_bad:0 "Ta khiến bản thân trở nên lố bịch"


	diplomacy_foreign.3008.opening:0 "Gửi tới [neighboring_ruler.Custom2('RelationDescriptor', ROOT.Char)] [ROOT.Char.GetTitledFirstNameNoTooltip],"
	diplomacy_foreign.3008.desc.dead:0 "Người tiền nhiệm của ta, [dead_ruler_2.GetTitledFirstName], đã khuyến khích ta tiếp tục việc trao đổi thư từ của [dead_ruler_2.GetHerHis] với ngài. Tuy nhiên, sau lá thư cuối cùng ngài gửi, ta sẽ chấm dứt việc trao đổi thư từ này; có vẻ như [dead_ruler_2.GetSheHe] đã nhầm về mức độ thú vị của ngài!"
	diplomacy_foreign.3008.desc.skilled:0 "Ngài đang cố khiến ta cảm thấy như một kẻ ngu sao? Lá thư trước của ngài đầy những điều tối nghĩa đến mức ta không thể hiểu nổi một câu trong ba câu!"
	diplomacy_foreign.3008.desc.special:0 "Ngài đã đánh giá sai ta nếu nghĩ rằng sự nịnh bợ sẽ giúp ngài đạt được điều gì. Giờ ta thấy lời nói của ngài rỗng tuếch chẳng khác gì cái đầu của ngài."
	diplomacy_foreign.3008.desc.bribe:0 "Ngài đã đánh giá sai ta nếu nghĩ rằng hối lộ sẽ giúp ngài đạt được điều gì. Lòng tham là một tính cách vô cùng đáng khinh."
	diplomacy_foreign.3008.desc.end:0 "Vậy mà trước đây ta từng coi trọng tình bằng hữu của ngài..."
	diplomacy_foreign.3008.a:0 "Ôi..."
	diplomacy_foreign.3008.a.tt:1 "Ít nhất ngươi cũng học được điều gì đó!"

 ##################
 # Special Events #
 ##################

 # Foreign Relations (Invite a foreign ruler to your court), by Mathilda Bjarnehed
		diplomacy_foreign_special.1017.t:0 "Lòng Hiếu Khách"
		diplomacy_foreign_special.1017.desc:0 "Càng nghiên cứu nghệ thuật trị quốc cao quý, ta càng nhận ra quan hệ tốt đẹp với các láng giềng có lợi đến mức nào.\n\nTa nên mời một trong số họ đến thăm triều đình của ta để cho họ thấy ta có thể là một người bạn tốt đến thế nào — nhưng ta nên mời ai đây? "
		diplomacy_foreign_special.1017.a:0 "[target_list_member_a.GetNameNoTooltip]."
		diplomacy_foreign_special.1017.b:0 "[target_list_member_b.GetNameNoTooltip]."
		diplomacy_foreign_special.1017.c:0 "[target_list_member_c.GetNameNoTooltip]."
		diplomacy_foreign_special.1017.d:0 "Ta nên tập trung xoa dịu các chư hầu của chính mình."
		diplomacy_foreign_special.1017.great:0 "[THIS.Char.GetFirstName] rất ấn tượng trước lòng hiếu khách của ta"
		diplomacy_foreign_special.1017.good:0 "[THIS.Char.GetFirstName] tận hưởng chuyến thăm của [THIS.Char.GetHerHis]"
		diplomacy_foreign_special.1017.bad:0 "[THIS.Char.GetFirstName] thất vọng và rời đi sớm"
		diplomacy_foreign_special.1017.friends_a:0 "[target_list_member_a.GetShortUIName|U] và ta có thể trở thành bằng hữu"
		diplomacy_foreign_special.1017.friends_b:0 "[target_list_member_b.GetShortUIName|U] và ta có thể trở thành bằng hữu"
		diplomacy_foreign_special.1017.friends_c:0 "[target_list_member_c.GetShortUIName|U] và ta có thể trở thành bằng hữu"

		diplomacy_foreign_special.1018.opening:0 "[foreign_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
		diplomacy_foreign_special.1018.desc:0 "Ta chân thành cảm ơn ngài vì lời mời đến triều đình của ngài. Ta và đoàn tùy tùng sẽ đến [root_realm.GetNameNoTierNoTooltip] trong vài tuần tới."
		diplomacy_foreign_special.1017.a.spouse:0 "[helper_spouse.GetFirstNameNoTooltip], hãy bảo người hầu bắt tay vào việc!"
		diplomacy_foreign_special.1017.a.no_spouse:0 "Ta sẽ lập tức cho người hầu bắt tay vào việc!"
		diplomacy_foreign_special.1018.a.tt:0 "[foreign_guest.GetTitledFirstName] sẽ sớm đến"

		diplomacy_foreign_special.1019.t:1 "$diplomacy_foreign_special.1017.t$: Lời Chào Nồng Nhiệt"
		diplomacy_foreign_special.1019.start.desc:0 "[foreign_guest.Custom('ComplimentAdjective')] [foreign_guest.GetTitledFirstName] cuối cùng cũng đã đến! Tối nay, chúng ta sẽ mở tiệc để chào đón vị khách phương xa.\n\n"
		diplomacy_foreign_special.1019.spouse.desc:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helper_spouse') )] của ta, [helper_spouse.GetFirstName], đã vất vả lo liệu mọi kế hoạch và chuẩn bị. [helper_spouse.GetSheHe|U] hỏi ta xem ta có gợi ý nào cho những khâu hoàn thiện cuối cùng không."
		diplomacy_foreign_special.1019.no_spouse.desc:0 "Ta đã vất vả lo liệu mọi kế hoạch và chuẩn bị. Mọi thứ gần như đã sẵn sàng và ta còn chút thời gian để thêm một điểm nhấn cuối."
		diplomacy_foreign_special.1019.a:0 "Ta biết vài món đặc sản từ [foreign_guest_realm.GetNameNoTierNoTooltip]."
		diplomacy_foreign_special.1019.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] cảm thấy như đang ở nhà"
		diplomacy_foreign_special.1019.a.failure.tt:1 "Ngươi đã nhầm và [foreign_guest.GetTitledFirstNameNoTooltip] bị xúc phạm"
		diplomacy_foreign_special.court_visit.very_well:0 "Chuyến thăm triều đình diễn ra #P rất suôn sẻ#!"
		diplomacy_foreign_special.court_visit.poorly:0 "Chuyến thăm triều đình diễn ra #N tệ hại#!"
		diplomacy_foreign_special.1019.b:0 "Phải thật xa hoa! Nhiều hơn nữa... mọi thứ!"
		diplomacy_foreign_special.1019.b.rl.desc:0 "Kết quả phụ thuộc vào tính cách của [foreign_guest.GetTitledFirstNamePossessiveNoTooltip]"

		diplomacy_foreign_special.1019.b.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] trân trọng cử chỉ này, như hầu hết mọi người"
		diplomacy_foreign_special.1019.b.failure.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] thích điều gì đó giản dị hơn"
		diplomacy_foreign_special.1019.c:0 "Ta sẽ không mạo hiểm với thay đổi phút chót."
		diplomacy_foreign_special.court_visit.normal:0 "Chuyến thăm triều đình diễn ra #Z bình thường#!"
		diplomacy_foreign_special.court_visit.well:0 "Chuyến thăm triều đình diễn ra #P tốt đẹp#!"
		diplomacy_foreign_special.court_visit.disaster:0 "Chuyến thăm triều đình kết thúc trong #N thảm họa#!"

		diplomacy_foreign_special.1020.t:1 "$diplomacy_foreign_special.1017.t$: Vận Động Hay Thư Giãn"
		diplomacy_foreign_special.1020.desc:0 "Nhìn lên bầu trời hôm nay, có vẻ chúng ta sẽ có thời tiết tuyệt vời! Đây là cơ hội hoàn hảo để ta cho vị khách của mình là [foreign_guest.GetTitledFirstName] thấy vẻ đẹp vùng quê nơi đây. Ta tự hỏi liệu [foreign_guest.GetSheHe] có thích một chuyến săn đầy sôi động không? Hay có lẽ một bữa trưa thư thả dưới nắng?"
		diplomacy_foreign_special.1020.a:0 "Một chuyến đi săn sẽ thật hoàn hảo!"
		diplomacy_foreign_special.1020.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] thích thú với cuộc săn"
		diplomacy_foreign_special.1020.a.failure.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] có một trải nghiệm tồi tệ"
		diplomacy_foreign_special.1020.b:0 "Ta nghĩ [foreign_guest.GetSheHe] sẽ thích một bữa trưa hơn."
		diplomacy_foreign_special.1020.b.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] tận hưởng bữa trưa"

		diplomacy_foreign_special.1021.t:1 "$diplomacy_foreign_special.1017.t$: Vui Chơi Hay Tôn Kính"
		diplomacy_foreign_special.1021.desc:0 "Ta muốn cho vị khách của mình là [foreign_guest.GetTitledFirstName] thấy những nét văn hóa nổi bật của [root_realm.GetNameNoTier]. Vấn đề là, liệu [foreign_guest.GetSheHe] sẽ thích một buổi vũ hội lớn cùng toàn bộ quý tộc triều đình, hay một chuyến viếng thăm [ROOT.Char.GetFaith.HouseOfWorship] trang nghiêm nhất của chúng ta?"
		diplomacy_foreign_special.1021.a:0 "Ta cá [foreign_guest.GetSheHe] là một vũ công tuyệt vời!"
		diplomacy_foreign_special.1021.b:0 "[ROOT.Char.GetFaith.HouseOfWorship] có vẻ hợp với sở thích của [foreign_guest.GetHerHis] hơn."
		diplomacy_foreign_special.1021.a.success.tt:0 "[foreign_guest.GetTitledFirstNameNoTooltip] thích thú với buổi khiêu vũ"
		diplomacy_foreign_special.1021.b.success.tt:1 "[foreign_guest.GetTitledFirstNameNoTooltip] thích chuyến viếng thăm [ROOT.Char.GetFaith.HouseOfWorship]"

		diplomacy_foreign_special.1022.t:1 "$diplomacy_foreign_special.1017.t$: Một Yêu Cầu Kỳ Lạ"
		diplomacy_foreign_special.1022.desc:0 ""[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('interesting_relation') )] của ngài là một [interesting_relation.GetWomanMan] tuyệt vời," [foreign_guest.GetTitledFirstName] nói trong khi chậm rãi xoay cốc [foreign_guest.Custom('RegionalDrink')] của [foreign_guest.GetHerHis]. Ánh mắt [foreign_guest.GetHerHis|U] hướng về phía [interesting_relation.GetFirstName], người đang ngồi ở phía xa bàn.\n\n"Hỡi [ROOT.GetCharacter.GetTitledFirstNameNoTooltip] đáng kính, ngài có cho phép ta sắp xếp một buổi gặp riêng với [interesting_relation.GetLadyLord] [interesting_relation.GetFirstNameNoTooltip] không? Dĩ nhiên không có gì mờ ám cả. Chỉ là một bữa tối đơn giản trong phòng của ta.""
		diplomacy_foreign_special.1022.a:0 ""Dĩ nhiên! Chuyện đó không thành vấn đề.""
		diplomacy_foreign_special.1022.a.tt:1 "Ngươi sẽ không biết điều gì diễn ra sau cánh cửa đóng kín"
		diplomacy_foreign_special.1022.b:0 "Cho phép, nhưng bí mật nghe lén..."
		diplomacy_foreign_special.1022.b.duel.success:1 "Ngươi phát hiện ra họ đang làm gì"
		diplomacy_foreign_special.1022.b.duel.failure:1 "Ngươi bị phát hiện"
		diplomacy_foreign_special.1022.c:0 ""Ta không nghĩ điều đó là thích hợp.""

		diplomacy_foreign_special.1023.t:1 "$diplomacy_foreign_special.1017.t$: Nghi Ngờ Vô Căn Cứ"
		diplomacy_foreign_special.1023.desc:0 "Ta ở trong lối đi bí mật suốt buổi gặp riêng giữa [foreign_guest.GetTitledFirstNamePossessive] và [interesting_relation.GetFirstNamePossessive]. Có vẻ như mọi lo lắng của ta hoàn toàn vô căn cứ. Không lời đề nghị, không âm mưu, không quyến rũ."
		diplomacy_foreign_special.1023.a:0 "Thật nhẹ nhõm!"

		diplomacy_foreign_special.1024.t:1 "$diplomacy_foreign_special.1017.t$: Một Khoảng Thời Gian Vui Vẻ"
		diplomacy_foreign_special.1024.desc:0 "Ta đã ở trong lối đi bí mật này hàng giờ rồi, lắng nghe cuộc trò chuyện dường như bất tận giữa [foreign_guest.GetTitledFirstNamePossessive] và [interesting_relation.GetFirstNamePossessive]. Không có gì đáng ngờ trong lời nói của họ, chỉ là một sự đồng cảm kỳ lạ giữa hai người vừa mới quen."
		diplomacy_foreign_special.1024.a:0 "Chuyện này chẳng có gì hại."
		diplomacy_foreign_special.1024.b:0 "Chuyện này kết thúc ngay bây giờ!"

	diplomacy_foreign_special.1025.t:1 "$diplomacy_foreign_special.1017.t$: Con Rắn Trong Lòng Ta"
	diplomacy_foreign_special.1025.desc:0 "Từ nơi ẩn nấp trong lối đi bí mật, ta nghe rõ ràng những lời dối trá của [foreign_guest.GetTitledFirstNamePossessive]. [foreign_guest.GetSheHe|U] đang cố đầu độc tâm trí của [interesting_relation.GetFirstNamePossessive] chống lại ta, và có vẻ điều đó đang phát huy tác dụng."
	diplomacy_foreign_special.1025.a:0 "Hừ! Ta sẽ để [foreign_guest.GetHerHim] nghĩ rằng [foreign_guest.GetSheHe] có cơ hội."
	diplomacy_foreign_special.1025.b:0 "Phản đồ! Cả hai các ngươi!"

	diplomacy_foreign_special.1026.t:1 "$diplomacy_foreign_special.1017.t$: Lừa Dối Và Dục Vọng"
	diplomacy_foreign_special.1026.desc:0 "Khi lời gợi ý dâm đãng thoát khỏi môi [foreign_guest.GetTitledFirstNamePossessive], ta không chắc mình nên phẫn nộ vì sự vô liêm sỉ của [foreign_guest.GetHerHis], hay ấn tượng trước sự trơ trẽn của [foreign_guest.GetHerHis]. Quyến rũ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('interesting_relation') )] của ta ngay dưới mái nhà của ta! Ta tựa lưng vào bức tường mát lạnh của lối đi bí mật, cố gắng kiềm chế cơn bão cảm xúc."
	diplomacy_foreign_special.1026.a.tt:1 "Ngươi sẽ biết về [secret|E] của họ"
	diplomacy_foreign_special.1026.a:0 "Cứ để họ vui vẻ, ta quan tâm làm gì."
	diplomacy_foreign_special.1026.b:0 "Bỏ đôi bàn tay bẩn thỉu của ngươi khỏi [interesting_relation.GetHerHim], [foreign_guest.Custom2('InsultNoun', ROOT.Char)]!"
	diplomacy_foreign_special.1026.c:0 "Chiếc giường đó có chỗ cho ba người không?"
	diplomacy_foreign_special.1026.c.success:0 "Cả ba chúng ta cùng qua đêm với nhau"
	diplomacy_foreign_special.1026.c.failure:0 "Họ hoàn toàn kinh hoàng"

	diplomacy_foreign_special.1027.t:1 "$diplomacy_foreign_special.1017.t$: Con Chuột Trong Hang"
	diplomacy_foreign_special.1027.desc:0 "Lặng lẽ như một lời thì thầm, ta rón rén đi qua những lối đi bí mật đến tận phòng của [foreign_guest.GetTitledFirstNamePossessive]. Khi đến nơi, ta khom người xuống, chuẩn bị cho một buổi tối dài.\n\nRồi đột nhiên, một bàn tay chộp lấy vai ta và cơ thể ta cứng đờ vì sợ hãi. \"Ngài tiếp đãi khách như vậy sao, [ROOT.GetCharacter.GetTitledFirstName]?\""
	diplomacy_foreign_special.1027.a:0 "Ta— Ta xin lỗi!"

	diplomacy_foreign_special.1028.t:1 "$diplomacy_foreign_special.1017.t$: Cánh Hoa Và Gai Nhọn"
	diplomacy_foreign_special.1028.desc:0 "Trong lúc dạo bước qua khu vườn, ta và [foreign_guest.GetTitledFirstName] dừng lại để ngắm cảnh. \"Tỷ lệ, màu sắc — ta hiếm khi thấy điều gì đẹp như thế này, [ROOT.GetCharacter.GetTitledFirstNameNoTooltip],\" [foreign_guest.GetSheHe] nói và ra hiệu về cảnh tượng trước mắt.\n\nTa cảm thấy mình nên đáp lại bằng một lời tốt đẹp. Có lẽ là điều gì đó về [foreign_guest.GetHerHis]..."
	diplomacy_foreign_special.1028.compassionate:0 "Sự ấm áp và lòng nhân hậu."
	diplomacy_foreign_special.1028.bold:0 "Lòng dũng cảm không lay chuyển."
	diplomacy_foreign_special.1028.honorable:0 "Sự trung thành và danh dự."
	diplomacy_foreign_special.1028.greed:0 "Tham vọng vút cao."
	diplomacy_foreign_special.1028.rational:0 "Sự lý trí rõ ràng."
	diplomacy_foreign_special.1028.zealous:0 "Niềm tin không lay chuyển."
	diplomacy_foreign_special.1028.energetic:0 "Năng lượng và sự tự phát."
	diplomacy_foreign_special.1028.forgiving:0 "Bản tính khoan dung."
	diplomacy_foreign_special.1028.beautiful:0 "Vẻ đẹp vương giả."
	diplomacy_foreign_special.1028.strong:0 "Sức mạnh của cánh tay."
	diplomacy_foreign_special.1028.extroverted:0 "Tài giao tiếp với mọi người."
	diplomacy_foreign_special.1028.dominant:0 "Sự hiện diện đầy uy quyền."
	diplomacy_foreign_special.1028.good:0 "Lời khen của ta được đón nhận tốt"
	diplomacy_foreign_special.1028.neutral:0 "Lời khen của ta không gây ấn tượng"
	diplomacy_foreign_special.1028.bad:0 "Lời khen của ta lại giống như một sự xúc phạm"
	diplomacy_foreign_special.1028.compliment.tt:1 "Việc [foreign_guest.GetTitledFirstName] đón nhận lời khen ra sao chủ yếu phụ thuộc vào mức độ phù hợp của nó với [foreign_guest.GetHerHim], cũng như ý kiến của [foreign_guest.GetHerHis] về ngươi và kỹ năng [diplomacy|E] của ngươi."
	diplomacy_foreign_special.1029.good.message:0 "[foreign_guest.GetTitledFirstName] rất hài lòng với lời khen của ta!"
	diplomacy_foreign_special.1029.neutral.message:0 "[foreign_guest.GetTitledFirstName] dường như không chú ý đến lời khen của ta."
	diplomacy_foreign_special.1029.bad.message:0 "[foreign_guest.GetTitledFirstName] có vẻ bị xúc phạm bởi lời khen của ta..."
	diplomacy_foreign_special.1030.t:1 "$diplomacy_foreign_special.1017.t$: Một Mối Gắn Kết Lâu Dài"
	diplomacy_foreign_special.1030.desc:0 "Sau những gì có thể gọi là một chuyến thăm vô cùng dễ chịu, [foreign_guest.GetTitledFirstName] và đoàn tùy tùng [foreign_guest.GetHerHis] sắp khởi hành về [foreign_guest_realm.GetNameNoTierNoTooltip].\n\nTrước khi [foreign_guest.GetTitleTierName] bước vào cỗ xe [foreign_guest.GetHerHis], [foreign_guest.GetSheHe] [ROOT.GetCharacter.Custom('GestureOfFriendship')] và bày tỏ [foreign_guest.GetHerHis]"
	diplomacy_foreign_special.1030.bad_guest.desc:0 "Tên [foreign_guest.GetTitledFirstName] xảo trá và đoàn tùy tùng [foreign_guest.GetHerHis] sắp khởi hành về [foreign_guest_realm.GetNameNoTierNoTooltip].\n\nTrước khi [foreign_guest.GetTitleTierName] bước vào cỗ xe [foreign_guest.GetHerHis], [foreign_guest.GetSheHe] [ROOT.GetCharacter.Custom('GestureOfFriendship')] và bày tỏ [foreign_guest.GetHerHis]"
	diplomacy_foreign_special.1030.spouse.desc:0 "lòng biết ơn với ta và \"[helper_spouse.Custom('ComplimentAdjective')] nhất\" [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helper_spouse') )] của ta. Ta hứa sẽ chuyển lại lời khen của [foreign_guest.GetHerHis]."
	diplomacy_foreign_special.1030.no_spouse.desc:0 "lòng biết ơn. Ta đảm bảo với [foreign_guest.GetHerHim] rằng [foreign_guest.GetSheHe] luôn được chào đón quay lại."
	diplomacy_foreign_special.1030.a_bad_guest:0 "[foreign_guest.GetSheHe|U] nghĩ rằng [foreign_guest.GetSheHe] đã qua mặt ta, nhưng ta biết [foreign_guest.GetSheHe] đã làm gì."
	diplomacy_foreign_special.1030.a_extroverted:0 "Cầu mong [foreign_guest.GetSheHe] sớm ghé thăm chúng ta lần nữa!"
	diplomacy_foreign_special.1030.a_introverted:0 "Cuối cùng cũng có chút yên tĩnh."
	diplomacy_foreign_special.1030.a:0 "Chúc chuyến đi của ngài nhanh chóng và an toàn!"

	diplomacy_foreign_special.1031.t:1 "$diplomacy_foreign_special.1017.t$: Rời Đi Sớm"
	diplomacy_foreign_special.1031.desc:1 "Mặt trời vừa mới mọc khi ta nhận thấy một người hầu của [foreign_guest.GetTitledFirstNamePossessive] đang mang một chiếc rương lớn. Ta theo [dummy_servant_gender.GetWomanMan] đó đến sân trong, nơi ta thấy vị khách của mình đang giám sát việc chất hành lý lên xe ngựa của [foreign_guest.GetHerHis].\n\n[foreign_guest.GetFirstName] giật mình khi ta chào [foreign_guest.GetHerHim] và vội vàng đưa ra một lời giải thích mơ hồ về một bức thư và công việc khẩn cấp. Ngượng ngùng, ta chúc [foreign_guest.GetHerHim] một chuyến đi an toàn rồi vội quay về phòng riêng."
	diplomacy_foreign_special.1031.a:0 "Không phải kết cục ta tưởng tượng..."

 # Foreign Relations (Rulers arrange meeting between respective heirs), by Flavio Verna
	diplomacy_foreign.0100.opening:0 "[other_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
	diplomacy_foreign.0100.desc:0 "Ta nghĩ rằng vì lợi ích tốt nhất của các lãnh địa chúng ta, chúng ta nên sắp xếp một cuộc gặp giữa những người thừa kế của mình, [main_heir.GetTitledFirstName] và [other_heir.GetTitledFirstName]. Đảm bảo rằng họ xây dựng được một mối quan hệ ổn định và lành mạnh ngay từ bây giờ chắc chắn sẽ giúp đảm bảo sự ổn định tương lai cho vùng đất của chúng ta."
	diplomacy_foreign.1100.a:0 "Thật là một ý tưởng tuyệt vời!"
	diplomacy_foreign.1100.b:0 "Có lẽ chúng ta nên làm quen với nhau trước."
	diplomacy_foreign.1100.t:0 "Tình Bằng Hữu Nở Hoa"
	diplomacy_foreign.1101.desc:0 "Cuộc gặp được sắp xếp giữa [other_heir.GetFirstName] và [main_heir.GetFirstName] là cơ hội hoàn hảo để xây dựng nền móng cho một mối quan hệ lâu dài giữa lãnh địa của ta và [other_ruler.GetTitledFirstNamePossessive].\n\nTa phải thật cẩn trọng khi lên kế hoạch cho cuộc gặp này."
	diplomacy_foreign.1101.a:0 "[other_heir.GetFirstNameNoTooltip] nên đến [scoped_capital.GetNameNoTooltip]."

	diplomacy_foreign.1101.court_visit.very_well:0 "Chuyến thăm triều đình diễn ra #P rất thuận lợi#!"
	diplomacy_foreign.1101.court_visit.poorly:0 "Chuyến thăm triều đình diễn ra #N rất tệ hại#!"
	diplomacy_foreign.1101.court_visit.well:0 "Chuyến thăm triều đình diễn ra #P thuận lợi#!"

	diplomacy_foreign.1101.a.tooltip:1 "Làm chủ nhà sẽ cho phép ngài ảnh hưởng đến cuộc gặp"
	diplomacy_foreign.1101.b:0 "[main_heir.GetTitledFirstNameNoTooltip] sẽ đến thăm triều đình của [other_ruler.GetTitledFirstNamePossessiveNoTooltip]."
	diplomacy_foreign.1101.b.tooltip:1 "Ngài sẽ #N không#! thể ảnh hưởng đến cuộc gặp"
	diplomacy_foreign.1102.desc:0 "[other_heir.GetTitledFirstName] được tiếp đón với mọi nghi lễ và sự long trọng xứng đáng dành cho một vị khách danh giá như vậy. [other_heir.GetSheHe|U] sẽ ở lại [scoped_capital.GetNameNoTooltip] trong vài tuần, trong thời gian đó [other_heir.GetSheHe] và [main_heir.GetFirstName] sẽ có cơ hội hiểu nhau hơn."
	diplomacy_foreign.1102.a:0 "Ta sẽ đảm bảo giúp đỡ [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('main_heir') )] của ta."
	diplomacy_foreign.1102.a.duel_success:0 "[other_heir.GetTitledFirstNameNoTooltip] ấn tượng với lòng hiếu khách của ta"
	tooltip.diplomacy_foreign.1102.a.duel_success:0 "[other_heir.GetTitledFirstNameNoTooltip] đã ấn tượng với lòng hiếu khách của ta"
	diplomacy_foreign.1102.a.duel_failure:0 "Sự hiện diện của ta làm gián đoạn cuộc gặp giữa hai người thừa kế trẻ"
	tooltip.diplomacy_foreign.1102.a.duel_failure:0 "Sự hiện diện của ta đã làm gián đoạn cuộc gặp giữa hai người thừa kế trẻ"
	diplomacy_foreign.1102.b:0 "Ta sẽ tâng bốc [other_heir.GetFirstNameNoTooltip] bằng những món quà xa hoa!"
	diplomacy_foreign.1102.c:0 "Ta tin [main_heir.GetFirstNameNoTooltip] sẽ tự biết cách lo liệu [main_heir.GetHerselfHimself]."
	diplomacy_foreign.1102.c.tooltip.high:0 "[main_heir.GetTitledFirstName] sẽ thể hiện #P tốt#!"
	diplomacy_foreign.1102.c.tooltip.medium:0 "[main_heir.GetTitledFirstName] sẽ thể hiện #P khá ổn#!"
	diplomacy_foreign.1102.c.tooltip.low:0 "[main_heir.GetTitledFirstName] sẽ thể hiện #N tệ hại#!"
	diplomacy_foreign.1103.start.desc:0 "Thời điểm để [other_heir.GetTitledFirstName] trở về nhà cuối cùng cũng đã đến."
	diplomacy_foreign.1103.culture_conversion.desc:0 "Có vẻ như trong thời gian lưu lại đây, người trẻ tuổi [other_heir.GetWomanMan] này đã trở nên yêu thích văn hóa của chúng ta và quyết định tiếp thu một vài phong tục từ triều đình của ta."
	diplomacy_foreign.1103.faith_conversion.desc:0 "Ta rất vui khi biết rằng trong thời gian lưu lại đây, người trẻ tuổi [other_heir.GetWomanMan] này đã quyết định đón nhận [main_heir.GetFaith.GetName] và từ bỏ đức tin cũ [other_heir.GetHerHis] của mình."
	diplomacy_foreign.1103.present.desc:0 "Trước khi rời đi, [other_heir.GetWomanMan] trẻ tuổi đã quyết định vinh danh chúng ta bằng một món quà vô cùng tinh xảo thay mặt cho [other_heir.GetHerHis] [other_heir.Custom2('RelationToMe' , SCOPE.sC('other_ruler') )]."
	diplomacy_foreign.1103.prestige.desc:0 "[other_heir.GetSheHe|U] đã bị ấn tượng bởi lòng hiếu khách của chúng ta và hứa sẽ truyền bá danh tiếng triều đình của ta khắp nơi."
	diplomacy_foreign.1103.empty.desc:0 ""
	diplomacy_foreign.1103.friendship.desc:0 "\n\nMọi chuyện giữa [other_heir.GetHerHim] và [main_heir.GetFirstName] còn tốt đẹp hơn mong đợi: hai người đã trở nên không thể tách rời."
	diplomacy_foreign.1103.love.desc:0 "\n\nMọi chuyện giữa [other_heir.GetHerHim] và [main_heir.GetFirstName] còn tốt đẹp hơn mong đợi: rõ ràng hai người đã phải lòng nhau."
	diplomacy_foreign.1103.rivalry.desc:0 "\n\nĐáng tiếc, mọi chuyện không diễn ra như kế hoạch: [other_heir.GetFirstNameNoTooltip] và [main_heir.GetFirstName] hoàn toàn không thể chịu nổi nhau."
	diplomacy_foreign.1103.opinion_gain.desc:0 "\n\nMọi chuyện giữa [other_heir.GetHerHim] và [main_heir.GetFirstName] diễn ra tốt đẹp như [other_ruler.GetTitledFirstName] và ta đã hy vọng, và hai người thừa kế trẻ có lẽ sẽ trở thành bằng hữu tốt theo thời gian."
	diplomacy_foreign.1103.opinion_loss.desc:0 "\n\nĐáng tiếc, mọi chuyện không diễn ra như kế hoạch: [other_heir.GetFirstNameNoTooltip] và [main_heir.GetFirstName] dường như không có nhiều điểm chung..."
	diplomacy_foreign.1103.tainted_exp.desc:0 "\n\nÍt nhất thì trải nghiệm này cũng giúp ta hiểu sâu hơn về chính trị."
	diplomacy_foreign.1103.good_exp.desc:0 "\n\nHơn nữa, chuyến thăm này đã chứng tỏ là cơ hội tuyệt vời để ta rèn luyện kỹ năng ngoại giao."
	diplomacy_foreign.1103.no_exp.desc:0 "\n\nĐiều thật sự khiến ta khó chịu về toàn bộ chuyện này là ta thậm chí chẳng học hỏi được bao nhiêu từ nó."
	tooltip.diplomacy_foreign.1103.a.culture_conversion_success:0 "Cải đổi Văn hóa"
	tooltip.diplomacy_foreign.1103.a.faith_conversion_success:0 "Cải đổi Đức tin"
	diplomacy_foreign.1103.a:0 "Phải ra tay khi sắt còn nóng!"
	diplomacy_foreign.1103.b:0 "Chúng ta nên thử lại việc này vào lúc khác..."
	diplomacy_foreign.1104.start.desc:0 "[main_heir.GetFirstName] cuối cùng đã trở về sau chuyến thăm đến triều đình của [other_ruler.GetTitledFirstNamePossessive]."
	diplomacy_foreign.1104.culture_conversion.desc:0 "\n\nTrong thời gian lưu trú ngắn ngủi, [main_heir.GetSheHe] có vẻ đã dành nhiều cảm tình cho các phong tục của những người chủ nhà [main_heir.GetHerHis]."
	diplomacy_foreign.1104.faith_conversion.desc:0 "\n\nCó vẻ như trong chuyến thăm, [main_heir.GetSheHe] đã tìm thấy mục đích sống mới trong việc thờ phụng [other_heir.GetFaith.HighGodName]."
	diplomacy_foreign.1104.present.desc:0 "\n\nĐể phù hợp với địa vị cao quý [main_heir.GetHerHis], [main_heir.GetSheHe] đã được ban tặng những món quà xa xỉ trong suốt thời gian lưu trú [main_heir.GetHerHis]."
	diplomacy_foreign.1104.prestige.desc:0 "\n\nĐể phù hợp với địa vị cao quý [main_heir.GetHerHis], [main_heir.GetSheHe] đã được tiếp đón ân cần bởi chủ nhà [main_heir.GetHerHis], người đã công khai khen ngợi gia đình chúng ta trong nhiều dịp trong suốt thời gian [main_heir.GetFirstNamePossessiveNoTooltip] lưu lại."
	diplomacy_foreign.1105.hostdead.desc:0 "Với sự qua đời đáng tiếc của [other_ruler.GetTitledFirstName], kế hoạch để con cái chúng ta làm quen với nhau và đảm bảo mối quan hệ hòa hảo giữa hai lãnh địa cũng theo đó tan biến."
	diplomacy_foreign.1105.guestdead.desc:0 "Đáng buồn thay, kế hoạch của ta và [other_ruler.GetTitledFirstNamePossessive] đã bị cắt đứt bởi cái chết đột ngột của [other_heir.GetFirstName]."
	diplomacy_foreign.1105.fallback.desc:0 "Có vẻ như Số Mệnh đã ngăn cản cuộc gặp giữa [main_heir.GetFirstName] và [other_heir.GetFirstName]. Có lẽ một cơ hội khác sẽ xuất hiện trong tương lai."
	diplomacy_foreign.1105.a:0 "Thật bi thảm..."

 # Foreign Relations (Neighboring rulers tidying up their borders), by Flavio Verna
	diplomacy_foreign.1150.t:0 "Sắp Xếp Lại Biên Giới"
	diplomacy_foreign.1150.desc:0 "Đã một thời gian ta suy nghĩ về sự khác biệt giữa biên giới lịch sử và hiện tại của lãnh địa [neighbor.GetTitledFirstNamePossessive] và của ta. \n\n[neighbor.GetSheHe|U] đang cai trị [county.GetName], vùng đất lẽ ra thuộc về [ruler.GetPrimaryTitle.GetNameNoTierNoTooltip], trong khi ta hiện kiểm soát [neighbor_county.GetName], nơi mà [neighbor.GetTitledFirstNameNoTooltip] tuyên bố có quyền cai trị."
	diplomacy_foreign.1150.a:0 "Giải pháp rất đơn giản..."
	diplomacy_foreign.1160.a.success:0 "Ta thuyết phục được [neighbor.GetTitledFirstName]"
	diplomacy_foreign.1160.a.failure:0 "[neighbor.GetTitledFirstName] từ chối đề nghị của ta"
	diplomacy_foreign.1150.b:0 "Chắc hẳn chúng ta có thể tìm ra một thỏa thuận?"
	diplomacy_foreign.1150.c:0 "Không phải lời nói, mà là gươm giáo sẽ giải quyết tranh chấp này."
	diplomacy_foreign.1151.desc:0 "Nhờ sự nhạy bén ngoại giao của mình, ta đã thuyết phục được [neighbor.GetTitledFirstName] từ bỏ [county.GetNameNoTier] để đổi lấy [neighbor_county.GetNameNoTier]. Hy vọng hành động này sẽ ngăn chặn đổ máu không cần thiết giữa hai lãnh địa trong tương lai."
	diplomacy_foreign.1151.a:0 "Chỉ có thể hy vọng."
	diplomacy_foreign.1152.desc:0 "Đáng tiếc, ta không thể thuyết phục [neighbor.GetTitledFirstName] từ bỏ [county.GetNameNoTier] để đổi lấy [neighbor_county.GetNameNoTier]. Ta chỉ có thể hy vọng sự bướng bỉnh của [neighbor.GetHerHis] sẽ không dẫn hai lãnh địa chúng ta đến con đường đen tối."
	diplomacy_foreign.1152.a:0 "Xung đột có lẽ là điều không thể tránh khỏi."
	diplomacy_foreign.1153.desc:0 "[ruler.GetTitledFirstName] đã gửi cho ta một đề xuất kỳ lạ ngày hôm nay.\n\n[ruler.GetSheHe|U] tuyên bố rằng [ruler.GetSheHe] sẵn sàng từ bỏ quyền kiểm soát [neighbor_county.GetNameNoTier], một tỉnh mà vương quốc của ta có tuyên bố chủ quyền từ lâu đời, để đổi lấy [county.GetName], nơi mà tổ tiên [ruler.GetHerHis] được cho là đã từng thống trị."
	diplomacy_foreign.1153.a:0 "Một đề nghị công bằng."
	diplomacy_foreign.1153.b:0 "Ta sẽ không từ bỏ thứ thuộc về ta!"

 # Foreign Relations (Gaining friend), by Flavio Verna
	diplomacy_foreign.1200.t:0 "Những Vấn Đề Tế Nhị"
	diplomacy_foreign.1200.spouse.desc:0 ""Lại làm việc khuya sao, [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\n[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('diplomacy_friend') )] của ta nhìn qua vai ta, liếc nhìn đống tài liệu chất đầy trên bàn. "Ta cũng có chút kinh nghiệm trong những việc này," [diplomacy_friend.GetSheHe] dè dặt nói. "Có lẽ ta có thể giúp ngài giành được lòng tin của [neighbor_ruler.GetTitledFirstNamePossessive]?""
	diplomacy_foreign.1200.relative.desc:0 ""Ta nghe nói ngài đang tập trung cải thiện vị thế của lãnh địa với các nước láng giềng, [diplomacy_friend.Custom2('RelationToMe' , ROOT.GetCharacter )]." \n\n[diplomacy_friend.GetFirstName] tiến đến gần ta một cách thân thiện. "Ta đã quan tâm đến những việc này từ lâu, và rất sẵn lòng giúp ngài giành được lòng tin của [neighbor_ruler.GetTitledFirstNamePossessive]. Dù sao thì chúng ta cũng là người một nhà.""
	diplomacy_foreign.1200.fallback.desc:0 "[diplomacy_friend.GetTitledFirstName] đã thực sự giúp đỡ rất nhiều trong vài ngày qua, hỗ trợ ta trong những nỗ lực củng cố mối quan hệ của vương quốc với các nước láng giềng. [diplomacy_friend.GetSheHe|U] vừa tự đề nghị [diplomacy_friend.GetHerselfHimself] giúp ta giành lấy sự tin tưởng của [neighbor_ruler.GetTitledFirstNamePossessive]. \n\nThật khó để tìm được một người thực sự đáng tin cậy trong thời buổi này..."
	diplomacy_foreign.1200.a.a:0 "Không gì khiến ta vui hơn thế."
	diplomacy_foreign.1200.a.b:0 "Ngài khiến ta vô cùng vinh dự, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('diplomacy_friend') )]."
	diplomacy_foreign.1200.a.c:0 "Ta sẽ ghi nhớ lòng tốt của ngài."
	diplomacy_foreign.1200.b:0 "Ta nghĩ ta có thể tự xử lý [neighbor_ruler.GetTitledFirstNameNoTooltip]."
	diplomacy_foreign.1200.b.success:0 "Nỗ lực ngoại giao của ta đã sinh kết quả"
	diplomacy_foreign.1200.b.failure:0 "Ta không thể gây ấn tượng với [neighbor_ruler.GetTitledFirstName]"
	diplomacy_foreign.1200.c:0 "[neighbor_ruler.GetTitledFirstNameNoTooltip] không đáng để tốn công..."
