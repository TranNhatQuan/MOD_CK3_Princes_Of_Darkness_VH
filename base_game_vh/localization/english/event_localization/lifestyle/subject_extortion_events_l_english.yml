l_english:
 # Extort a Powerful Vassal, by Petter Vilberg
  subject_extortion.0001.t:0 "Tống Tiền Thần Tử: Vassal Quyền Lực"
  subject_extortion.0001.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extortion_target'))], [extortion_target.GetTitledFirstName] — thật là một [extortion_target.GetWomanMan] giàu có. Nhìn biểu cảm của [extortion_target.GetHerHis], rõ ràng [extortion_target.GetSheHe] đã đoán được mục đích ta đến gặp [extortion_target.GetHerHim].\n\n\"Ta trung thành, ta đóng thuế đầy đủ,\" [extortion_target.GetSheHe] quả quyết. \"Ngươi còn đòi hỏi gì hơn nữa sao?\""
  subject_extortion.0001.a:0 "Hãy coi đây là một thử thách nhỏ về lòng trung thành!"
  subject_extortion.0001.b:0 "Đừng lo, ta sẽ #EMP bắt tất cả mọi người#! trả."
  subject_extortion.0001.c:0 "Ôi, nhưng ngươi vẫn còn nợ ta, nhớ chứ?"
  subject_extortion.0001.d:0 "Ta chỉ đùa thôi, [extortion_target.GetFirstNameNoTooltip]!"
  subject_extortion.0001.d.flavor:0 "[extortion_target.GetSheHe|U] có vẻ bực bội hơn ta nghĩ."

 # Extort a County, by Petter Vilberg
  subject_extortion.0002.t:0 "Tống Tiền Thần Tử: Nông Dân"
  subject_extortion.0002.desc:0 "Nông dân ở [extortion_target.GetName] dường như sống khá hơn mức ta dự đoán từ số thuế thu được. Một khoản đóng góp thêm cho kho bạc của ta chắc không gây hại gì.\n\nHọ sẽ than phiền, nhưng nông dân chẳng phải lúc nào cũng vậy sao? Họ sẽ vượt qua được, ta chắc chắn."
  subject_extortion.0002.a:0 "Họ muốn làm gì thì làm, miễn là ta có vàng!"
  subject_extortion.0002.b:0 "Tại sao họ chẳng bao giờ biết ơn những gì họ #EMP đang có#!"
  subject_extortion.0002.c:0 "Hiện giờ không đáng để làm họ phật lòng."

 # Extort Theocratic Vassals, by Petter Vilberg
  subject_extortion.0003.t:0 "Tống Tiền Thần Tử: [ROOT.Char.GetFaith.AltPriestTermPlural|U]"
  subject_extortion.0003.desc:0 "Chẳng lẽ [ROOT.Char.GetFaith.WealthGodName] không muốn ta thịnh vượng? Và một kho bạc đầy ắp chẳng phải là cách tốt nhất để đạt được điều đó sao?\n\nVì lý do nào đó, các [ROOT.Char.GetFaith.AltPriestTermPlural] lại miễn cưỡng đồng ý. Họ dường như nghĩ rằng ảnh hưởng họ có trên tín đồ sẽ bảo vệ họ."
  subject_extortion.0003.a:0 "[ROOT.Char.GetFaith.PriestNeuterPlural|U] phải đóng góp như mọi người khác!"
  subject_extortion.0003.b:0 "Ta chẳng phải đã xứng đáng nhận điều này, nhờ [ROOT.Char.GetFaith.HighGodName] sao?"
  subject_extortion.0003.c:0 "Không nên làm phiền các tôi tớ của [ROOT.Char.GetFaith.HighGodNameAlternate]..."

 # Extort all Vassals, by Petter Vilberg
  subject_extortion.0004.t:0 "Tống Tiền Thần Tử: Tất Cả Vassal"
  subject_extortion.0004.desc:0 "Mục đích của các thần tử là hỗ trợ nỗ lực của ta. Trong khi họ đã đóng thuế cho đặc quyền này, ta không thể không nghĩ rằng sẽ kiếm được bao nhiêu nếu tất cả họ góp thêm một chút...\n\nGiàu sang cho ta, gần như không tốn gì cho họ!"
  subject_extortion.0004.a:0 "Thật là giải pháp hoàn hảo!"
  subject_extortion.0004.b:0 "Sao chỉ lấy một ít, khi ta có thể #EMP lấy nhiều#!?"
  subject_extortion.0004.c:0 "Không, nghĩa vụ của họ đã hoàn thành rồi."

 # Extort Courtiers, by Petter Vilberg
  subject_extortion.0005.t:0 "Tống Tiền Thần Tử: Triều Thần"
  subject_extortion.0005.desc:0 "Các triều thần của ta gần như sống nhờ vào lòng rộng lượng của ta. Chẳng phải đã đến lúc họ bày tỏ lòng biết ơn sao?\n\nNgay cả một quý tộc hạng thấp cũng phải hiểu về danh dự và bổn phận."
  subject_extortion.0005.a:0 "Họ thậm chí #EMP sống#! nhờ vào lòng thương xót của ta!"
  subject_extortion.0005.b:0 "Đây không phải là một yêu cầu, nhưng ta mong nhận quà."
  subject_extortion.0005.c:0 "Ôi, họ vốn đã quá ít ỏi trong thế giới này…"

 # Failed to find an extortion target, by Petter Vilberg
  subject_extortion.9998.t:0 "Tống Tiền Thần Tử"
  subject_extortion.9998.desc.steward:0 "[steward.GetCouncilTitle] của ta dường như đã thất bại trong việc tìm thêm nguồn vàng trong vương quốc.\n\n\"Xin lỗi, bệ hạ, nhưng không còn gì chúng ta có thể lấy được.\""
  subject_extortion.9998.desc:0 "Dù với ân huệ và phẩm hạnh cao quý, ta dường như không thể tìm ai sẵn lòng hỗ trợ nhiều hơn những gì luật định buộc họ. Không ai tỏ ra hứng thú với các ý tưởng luật mới của ta.\n\nTa có bị buộc phải chịu cảnh bần cùng bởi những thần tử tham lam và ích kỷ sao?!"
  subject_extortion.9998.a:0 "Chờ đã! Tiếng leng keng trong túi ngươi là gì vậy?"
  subject_extortion.9998.b:0 "Khoan đã, đây là gì dưới ghế ta?"
