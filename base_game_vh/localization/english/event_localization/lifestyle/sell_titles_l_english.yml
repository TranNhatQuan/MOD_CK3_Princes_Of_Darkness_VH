l_english:
  sell_titles.0001.opening:0 "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
  sell_titles.0001.desc.dislike:0 "Ta không quan tâm đến những lời hứa rỗng mà ngươi đang bán, nhưng nếu ngươi quá cần vàng, ta tin rằng chúng ta có thể đạt được một thỏa thuận."
  sell_titles.0001.desc.normal:0 "Ta không tìm kiếm vinh dự cao quý, [vassal.Custom2('RelationToMeShort', ROOT.Char)], nhưng nếu ngươi cần vàng, ta tin rằng chúng ta có thể đạt được một thỏa thuận."
  sell_titles.0001.a:0 "Ta cần số tiền này vì lợi ích của vương quốc, ngươi hiểu chứ."
  sell_titles.0001.b:0 "Đây không phải là mặc cả ở chợ của dân thường!"

  sell_titles.0002.opening:0 "[friend.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
  sell_titles.0002.desc:1 "Nghe nói ngươi đang trao tước hiệu để đổi lấy “quà cáp”.\n\nBạn ta, nếu ngươi cần vàng, đáng lẽ nên nói với ta!"
  sell_titles.0002.a:0 "Ngươi thật là một người bạn chân thành, [friend.GetFirstNameNoTooltip]!"
  sell_titles.0002.b:0 "Ta không thể chấp nhận việc này."

  sell_titles.0003.desc:0 "Ta cảm kích trước các tước hiệu ngươi đã trao, và dĩ nhiên ta sẽ hỗ trợ chúng, như lẽ phải và chính đáng!\n\nTa không biết phải cảm ơn ngươi thế nào cho đủ. Dù ngươi đòi hỏi gì, ta sẽ cố gắng hết sức."
  sell_titles.0003.a:0 "Ngươi là một thần tử trung thành và chân thật."
  sell_titles.0003.a.flavor:0 "Ước gì ai cũng hiểu rằng ta đang cực kỳ hào phóng."

  sell_titles.0004.opening:0 "[vassal.Custom2('AppropriateGreeting', ROOT.Char )]"
  sell_titles.0004.desc:0 "Ta được biết ngươi đang bán các tước hiệu, mặc dù ta bản thân chưa được vinh danh xứng đáng với công lao.\n\nThật vậy, xét đến những thành tích của ta vì ngươi, vài tước hiệu mới cũng không hề thừa."
  sell_titles.0004.a:0 "Vậy thì được thôi."
  sell_titles.0004.b:0 "Đừng tự đại quá!"

  sell_titles.0005.desc:0 "Dù chúng không kèm điền trang, những nghĩa vụ đi kèm với các tước hiệu ngươi đưa ra còn rộng lượng hơn những gì ta có thể mong đợi.\n\nDĩ nhiên ta sẽ tỏ lòng biết ơn với món quà thích hợp!"
  sell_titles.0005.a:0 "Thật sao? À."
  sell_titles.0005.b:0 "Chuyện này không phải… Chết tiệt!"

  sell_titles.0006.desc:0 "Dù biết rằng ta đang liều lĩnh trước cơn giận của ngươi, danh dự buộc ta phải lên tiếng. Lời đề nghị trao “tước hiệu” để đổi lấy “quà cáp” chỉ vì lòng tham thấp hèn, điều này rõ ràng!"
  sell_titles.0006.a:0 "Ngươi dám làm nhục ta như thế sao?!"

  sell_titles.1002.t:0 "Bán Tước Hiệu: Một Đề Xuất Khiêm Tốn"
  sell_titles.1002.desc:1 "Một [merchant.GetTitledFirstName], thương gia giàu có, nghe nói về nỗ lực của ta trong việc bán bớt các tước hiệu dư thừa. Tuy nhiên, [merchant.GetSheHe|U] có một đề xuất táo bạo hơn nhiều:\n\n\"Nếu ta chứng minh rằng mình là họ hàng xa của triều đại [ROOT.Char.GetDynasty.GetBaseName], ngươi sẽ ủng hộ yêu cầu của ta chứ?\"\n\nĐề xuất này hoàn toàn phi lý, nhưng [merchant.GetSheHe] lại sở hữu một lượng vàng khổng lồ..."
  sell_titles.1002.a.muslim:0 "Ngay cả Muhammad cũng là một thương gia!"
  sell_titles.1002.a:0 "Hãy chào mừng sự trở lại của [merchant.Custom('SisterBrother')] mà ta đã mất từ lâu!"
  sell_titles.1002.b:0 "Tên ta không bán, bất cứ hoàn cảnh nào!"

  sell_titles.1004.t:0 "Bán Tước Hiệu: Một Giao Dịch Tuyệt Hảo"
  sell_titles.1004.desc:0 "Ngược lại mọi dự đoán, [merchant.GetTitledFirstName], thương gia hóa ra là họ hàng xa xôi, đã chứng tỏ [merchant.GetHerselfHimself] là một chiến binh xuất sắc!\n\nAi có thể ngờ một dân thường lại đạt được đỉnh cao như vậy?"
  sell_titles.1004.a:0 "Có lẽ [merchant.GetSheHe] thật sự là dòng dõi quý tộc, sau tất cả?"

  sell_titles.1005.desc:0 "Kể từ khi ta chấp nhận [merchant.GetTitledFirstNamePossessive] — ý ta là, kể từ khi [merchant.GetSheHe] trở về gia tộc, [merchant.GetSheHe] đã chứng tỏ [merchant.GetHerselfHimself] được các [ROOT.Char.GetFaith.AltPriestTermPlural] ưa thích. Rõ ràng [merchant.GetSheHe] rất khôn ngoan. Khôn hơn nhiều so với một dân thường đơn giản."
  sell_titles.1005.a:0 "Vàng vẫn được tìm thấy trong đá trắng, có lẽ vậy."

  sell_titles.1006.desc:0 "Có lẽ những góc nhìn mới #EMP cũng#! tốt đôi khi chứ? [merchant.GetTitledFirstName], vốn đã đủ tài năng để có chỗ trong Gia tộc ta, đã chứng tỏ [merchant.GetHerselfHimself] cực kỳ khéo léo trong việc đối phó với nguy hiểm tại triều đình. Thỉnh thoảng ta còn phải tự hỏi liệu [merchant.GetSheHe] có biết nhiều hơn về những gì đang xảy ra hay không!"
  sell_titles.1006.a:0 "Cảm ơn [ROOT.Char.GetFaith.HighGodName] vì [merchant.GetSheHe] còn nợ ta vì điều này."

  sell_titles.1007.t:0 "Bán Tước Hiệu: Con Cừu Đen"
  sell_titles.1007.desc:0 "Có lý do vì sao dân thường không được phong tước tùy hứng. Kể từ khi [merchant.GetTitledFirstName] gia nhập triều đình, [merchant.GetSheHe] chẳng khác gì một nỗi nhục!\n\nTa đã ủng hộ yêu cầu của [merchant.GetHerHis] là thuộc Gia tộc ta, nên giờ không thể làm gì khác, nhưng đó là sai lầm mà ta khó lòng lặp lại!"
  sell_titles.1007.a:0 "Thật đáng tiếc…"
