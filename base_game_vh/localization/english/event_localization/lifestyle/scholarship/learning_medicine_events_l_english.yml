l_english:

# Become a herbalist, by Mathilda Bjarnehed
  learning_medicine.2001.t:0 "Những Bí Mật Của Tự Nhiên"
  learning_medicine.2001.pool.desc:0 "Ta đã nhận được một lời đề nghị từ [herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Nếu bức thư là thật, [herbalist.GetSheHe] là một nhà thảo dược giàu kinh nghiệm và sẵn lòng chia sẻ kiến thức của [herbalist.GetHerHis] để đổi lấy chỗ ở và ăn uống tại [ROOT.Char.Custom('GetRoom')]."
  learning_medicine.2001.no_pool.desc:0 "[herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] là một nhà thảo dược lành nghề, am hiểu cả những cây thuốc chữa bệnh lẫn những loài độc hại. Không chỉ một lần, [herbalist.GetSheHe] đã đề nghị chia sẻ chuyên môn của [herbalist.GetHerHis] với ta."
  learning_medicine.2001.chaplain_hates_herbs.desc:1 "\n\nLời đề nghị này thật hấp dẫn, nhưng ta biết [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] luôn nghi kỵ bùa chú và dược phẩm. [chaplain_hates_herbs.GetSheHe|U] tin rằng [ROOT.Char.GetFaith.DevilName] dùng chúng cho những mục đích tà ác của [ROOT.Char.GetFaith.DevilHerHis]... "

  learning_medicine.2001.a:0 "Ta luôn háo hức học thêm điều mới."
  learning_medicine.2001.b:0 "Một đóa hoa hiếm chắc sẽ khiến ngày của [flower_receiver.GetFirstNamePossessiveNoTooltip] tươi sáng hơn."
  learning_medicine.2001.c:0 "[herbalist.GetSheHe|U] có thể trồng một khu vườn thảo dược thiêng liêng."
  learning_medicine.2001.d:1 "Ta không có thời gian vùi mình vào đất và cây cỏ."
  learning_medicine.2001.d.chaplain_hates_herbs:0 "Ta tin vào phán đoán của [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetNamePossessiveNoTooltip] trong chuyện này."

  learning_medicine.2002.start.desc:0 "[herbalist.GetFirstName] và ta lại dành thêm một đêm khuya để phân loại cây cỏ và pha chế dược phẩm. Ta đang lật qua một trong những cuốn sách cũ kỹ của [herbalist.GetHerHis] thì phát hiện"
  learning_medicine.2002.chaplain_hates_herbs.desc:0 "một đoạn văn có thể khiến [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] sùi bọt mép!"
  learning_medicine.2002.not_witchcraft_accepted.desc:0 "một đoạn văn có thể khiến các [ROOT.Char.Custom('DefaultPriestTitlePlural')] sùi bọt mép!"
  learning_medicine.2002.witchcraft_accepted.desc:0 "một công thức vô cùng hấp dẫn. Ta không ngờ chỉ những loại thảo dược bình thường lại có sức mạnh như vậy..."
  learning_medicine.2002.a:0 "Ta phải đào sâu hơn vào tri thức bí mật này!"
  learning_medicine.2002.a.success.t:0 "[herbalist.GetFirstNameNoTooltip] là một phù thủy"
  learning_medicine.2002.a.failure.t:0 "[herbalist.GetFirstNameNoTooltip] kinh hãi trước lời ám chỉ của ta"
  learning_medicine.2002.b:0 "Nếu [herbalist.GetSheHe] đang che giấu bí mật, ta sẽ tìm ra."
  learning_medicine.2002.b.success.t:0 "Ta phát hiện sự thật về [herbalist.GetFirstNameNoTooltip]"
  learning_medicine.2002.b.success.tt:0 "Nếu [herbalist.GetShortUIName] có Bí Mật Phù Thủy, nó sẽ bị lộ trước ta"
  learning_medicine.2002.b.success.witch.t:0 "[herbalist.GetFirstNameNoTooltip] là một phù thủy"
  learning_medicine.2002.b.success.no_witch.t:0 "[herbalist.GetFirstNameNoTooltip] không phải phù thủy"
  learning_medicine.2002.b.success.no_witch.desc:1 "Ta chắc chắn về sự vô tội của [herbalist.GetTitledFirstNamePossessive]"
  learning_medicine.2002.b.inconclusive.t:0 "Cuộc điều tra của ta không có kết luận"
  learning_medicine.2002.b.inconclusive.desc:0 "Ta không tìm thấy bằng chứng phù thủy"
  learning_medicine.2002.b.failure.t:0 "[herbalist.GetFirstNameNoTooltip] bắt gặp ta đang lục lọi"
  learning_medicine.2002.c:0 "Ta sẽ không để những lời đồn và huyền thoại làm xao nhãng."

  learning_medicine.2003.desc:0 ""Đây là điều ta muốn học," ta nói khi trao cuốn sách cho [herbalist.GetFirstName]. "Ngươi có dạy ta không?"\n\n[herbalist.GetSheHe|U] nhìn ta rất lâu. "Ngài đã thật sự sẵn sàng chưa, [ROOT.Char.GetFirstNameNoTooltip]? Ngài có sẵn lòng hiến mình cho [herbalist.GetFaith.WitchGodName] để đổi lấy phúc lành của [herbalist.GetFaith.WitchGodHerHis|U] không?""
  learning_medicine.2003.a:0 "Không gì ta khao khát hơn."

# Improve the skills of your court physician, by Mathilda Bjarnehed
  learning_medicine.2010.t:0 "Một Bản Dịch Phiền Phức"
  learning_medicine.2010.start.desc:0 "Khi tôi bước qua ngưỡng cửa phòng làm việc của [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_physician'))] [court_physician.GetFirstNamePossessive], tôi thấy [court_physician.GetHerHim] đang cúi sâu bên cuốn sách.\n\n\"Bản dịch này của\""
  learning_medicine.2010.galen.desc:0 "Galen"
  learning_medicine.2010.hippocrates.desc:0 "Hippocrates"
  learning_medicine.2010.herophilus.desc:0 "Herophilus"
  learning_medicine.2010.hildegard.desc:0 "Hildegard xứ Bingen"
  learning_medicine.2010.mundinus.desc:0 "Mundinus"
  learning_medicine.2010.avicenna.desc:0 "Avicenna"
  learning_medicine.2010.trota.desc:0 "Trota xứ Salerno"
  learning_medicine.2010.sun_simiao.desc: "Sun Simiao"
  learning_medicine.2010.zhan_zhongjing.desc:0 "Trương Trung Cảnh"
  learning_medicine.2010.hua_tuo.desc:0 "Hoa Đà"
  learning_medicine.2010.tamba_yasuyori.desc:0 "Tamba Yasuyori"
  learning_medicine.2010.bianque.desc:0 "[Glossary( 'Bian Que', 'BIAN_QUE_GLOSS' )]"
  learning_medicine.2010.fallback.desc:0 "một báo cáo giải phẫu"
  learning_medicine.2010.end.desc:0 "thật khủng khiếp," [court_physician.GetSheHe] thở dài nói. "Nếu ta theo đúng những hướng dẫn này, khả năng chữa lành bệnh nhân chẳng khác gì khả năng giết họ ngay lập tức."

  learning_medicine.2010.a:0 "Để ta xem qua..."
  learning_medicine.2010.a.success.desc:0 "Tôi giúp [court_physician.GetFirstNameNoTooltip] dịch đoạn văn bản"
  learning_medicine.2010.a.failure.desc:0 "Tôi làm trò cười cho bản thân"
  learning_medicine.2010.b:0 "Ta sẽ mua cho ngươi một bản dịch tốt hơn."
  learning_medicine.2010.c:0 "Ngươi nên tìm đến [ROOT.Char.GetFaith.ReligiousText] để được chỉ dẫn."

 # Fertility treatment, by Mathilda Bjarnehed
  learning_medicine.2021.t:0 "Gửi tới [ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetTitledFirstNameNoTooltip]"
  learning_medicine.2021.desc:0 "Tên ta là [physician.GetTitledFirstNameNoTooltip], một thầy thuốc được đào tạo chuyên về các vấn đề sinh sản. Có lẽ lời khuyên kín đáo của ta sẽ có ích cho [ROOT.Char.GetLadyLord]? Ta rất vinh dự được phục vụ — với một khoản phí tượng trưng."
  learning_medicine.2021.a:0 "Ta có thể cần sự giúp đỡ của ngươi..."
  learning_medicine.2021.a.tt:0 "Ngươi chấp nhận phương pháp điều trị sinh sản"
  learning_medicine.2021.b:0 "Một [physician.GetWomanMan] y tế được đào tạo luôn luôn được chào đón."
  learning_medicine.2021.b.tt:0 "Ngươi từ chối liệu pháp sinh sản"
  learning_medicine.2021.c:0 "Ta không có vấn đề #EMP như thế!#!"

  learning_medicine.2022.t:0 "Vấn Đề Sinh Sản"
  learning_medicine.2022.old_physician.desc:0 "Ta đã thấy [physician.GetTitledFirstName] xử lý mọi thứ từ đỉa hút máu đến xác chết thối rữa, nhưng sự lúng túng trên gương mặt [physician.GetHerHis] thì hoàn toàn mới.\n\n"Với tư cách là thầy thuốc của ngài, ta là người bảo vệ sức khỏe của ngài," [physician.GetSheHe] nói, mắt nhìn chằm chằm vào đôi giày của [physician.GetHerHis]. "Điều đó cũng bao gồm... sức khỏe #EMP sinh sản#! của ngài. Ta có thể pha một loại dược dịch giúp ích cho ngài và [spouse.Custom('WifeHusband')] của ngài. Ta cũng đã đọc về vài phương pháp thử nghiệm với kết quả đầy hứa hẹn.""
  learning_medicine.2022.new_physician.desc:0 "Ta định cho vị thầy thuốc mới của mình thời gian ổn định, nhưng chỉ vài giờ sau khi [physician.GetHerHis] đến nơi, [physician.GetFirstName] đã xông vào phòng ta với một chiếc rương lớn. [physician.GetSheHe|U] đặt mạnh nó lên bàn ta với một tiếng #EMP clang#! đáng ngại.\n\n"Ngài và [spouse.Custom('WifeHusband')] của ngài có nhiều lựa chọn, [ROOT.Char.Custom('FormOfAddressForLiege')]. Có những dược dịch đã được kiểm chứng — nhưng ta cũng đang phát triển vài phương pháp thử nghiệm.""
  learning_medicine.2022.b:0 "Một loại dược dịch đơn giản có vẻ hợp lý."
  learning_medicine.2022.b.success:0 "Liệu pháp thành công"
  learning_medicine.2022.b.failure:0 "Liệu pháp thất bại"
  learning_medicine.2022.a:0 "Tương lai của vương quốc đang bị đe dọa! Ta sẽ thử bất cứ thứ gì!"
  learning_medicine.2022.a.success:0 "Liệu pháp rất thành công"
  learning_medicine.2022.a.unexpected:0 "Liệu pháp gây ra tác dụng phụ kỳ lạ"
  learning_medicine.2022.a.failure:0 "Liệu pháp gây ra tác dụng phụ nghiêm trọng"
  learning_medicine.2022.c:0 "Thật ra ta chỉ muốn vài... lời khuyên."
  learning_medicine.2022.a.unexpected.tt:0 "Điều gì đó bất ngờ có thể xảy ra"

  learning_medicine.2023.urine.desc:0 ""Cơ thể của hai ngài chưa hòa hợp, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng ta có cách khắc phục. Ngài phải uống nước tiểu của [spouse.Custom('WifeHusbandPossessive')], và [spouse.GetSheHe] uống của ngài. Mỗi đêm trước khi ngủ, trong suốt một tuần. Khi đó năng lượng của hai người chắc chắn sẽ hòa hợp!"\n\nĐó là một tuần rất dài."
  learning_medicine.2023.unpleasant_end.desc:0 "\n\nDù bản thân phương pháp trị liệu này không mấy dễ chịu,"
  learning_medicine.2023.pig_testicles.desc:0 ""Ta đã tìm được con lợn đực sung mãn nhất trong toàn [location.GetNameNoTooltip] và cho sấy khô rồi nghiền bột tinh hoàn của nó. Hòa vào rượu mà uống trong hai tuần, khả năng sinh sản của ngài sẽ tăng gấp mười lần!""
  learning_medicine.2023.pig_testicles_end.desc:0 "\n\nDù bột khiến rượu có vị mốc khó chịu, nhìn chung đó lại là một trải nghiệm khá dễ chịu."
  learning_medicine.2023.udder.desc:0 ""Sữa mang lại sự sống, nên ta phải tìm đến nguồn của nó. Đầu bếp sẽ nấu món vú bò hầm cho hai ngài. Trong một tuần hãy chỉ ăn món đó, và phần thưởng chắc chắn sẽ đến."\n\nĐó là một tuần rất dài."
  learning_medicine.2023.female_orgasm.start.desc:0 ""Như ngài có lẽ đã biết, khoái lạc của người nữ cũng quan trọng ngang với người nam."
  learning_medicine.2023.female_orgasm.female.desc:1 "Hạt giống của ngài phải tuôn ra và hòa cùng với của [spouse.Custom('WifeHusbandPossessive')]. [spouse.GetSheHe|U] nên đọc cuốn sách này về các kỹ thuật trong phòng ngủ tại [ROOT.Char.Custom('GetChamber')]."\n\nTa không thể mong có phương pháp điều trị nào tốt hơn.\n\n"
  learning_medicine.2023.female_orgasm.male.desc:0 "Ngài phải khiến hạt giống của [spouse.Custom('WifeHusbandPossessive')] tuôn ra, để nó hòa cùng với của ngài. Ngài nên đọc cuốn sách này về các kỹ thuật trong phòng ngủ tại [ROOT.Char.Custom('GetChamber')]."\n\nPhải tốn rất nhiều công sức để làm chủ những phương pháp xa lạ ấy, nhưng cuối cùng ta cũng làm được — ít nhất nếu phản ứng của [spouse.GetFirstNamePossessive] là dấu hiệu!\n\n"
  learning_medicine.2023.milk_bath.desc:0 ""Mọi loại sữa đều mang lại sự sống, và sữa dê đặc biệt mạnh mẽ. Mỗi khi ngài và [spouse.Custom('WifeHusband')] muốn thụ thai, trước hết hãy tắm trong sữa dê. Thậm chí hai người có thể thử luôn trong bồn!""
  learning_medicine.2023.milk_bath_end.desc:0 "\n\nDù sữa có mùi #EMP khá nồng#!,"
  learning_medicine.2023.end.desc:0 "[physician.GetFirstNameNoTooltip] rất lạc quan về kết quả, và ta cảm thấy tuyệt vời! [physician.GetSheHe|U] bảo chúng ta hãy kiên nhẫn, nhưng ta nghĩ sớm thôi gia đình sẽ có thêm thành viên mới."
  learning_medicine.2023.a:0 "Chúng ta lui về [ROOT.Char.Custom('GetChamber')] của ta thôi, [spouse.GetFirstNameNoTooltip]..."

  learning_medicine.2024.end.desc:0 "\n\nDù ta đã làm theo lời khuyên của [physician.GetFirstNamePossessive] từng chút một, và [physician.GetSheHe] bảo ta phải kiên nhẫn, nhưng sự nghi ngại của ta vẫn rất lớn. Ta cảm thấy buồn nôn và choáng váng, còn [spouse.GetFirstName] thì đã nằm liệt giường suốt ba ngày."
  learning_medicine.2024.a:0 "Ta chỉ muốn nghỉ ngơi..."
  learning_medicine.2024.b:0 "Lính đâu! Tống giam tên lang băm này!"

  learning_medicine.2025.start.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta có tin tốt! Tuy còn sớm, nhưng [spouse.Custom('WifeHusband')] của ngài đã có đầy đủ dấu hiệu mang thai!"\n\nBan đầu, niềm hạnh phúc và nhẹ nhõm tràn qua ta, nhưng ngay sau đó là sự bối rối. "Nhưng ngươi còn chưa bắt đầu phương pháp điều trị của mình, [physician.GetFirstName]," ta nói đầy ẩn ý.\n\n"
  learning_medicine.2025.fertilitygod.desc:0 ""[physician.GetFaith.FertilityGodName]"
  learning_medicine.2025.the_universe.desc:0 ""Vũ trụ"
  learning_medicine.2025.end.desc:0 "vận hành theo những cách bí ẩn, [ROOT.Char.Custom('FormOfAddressForLiege')]. Đôi khi tốt hơn hết là đón nhận phúc lành của mình thay vì cố gắng giải thích chúng.""
  learning_medicine.2025.b:0 "Lời nói thật khôn ngoan!"
  learning_medicine.2025.a:0 "[spouse.GetFirstNameNoTooltip]. Chúng ta cần nói chuyện. Riêng tư."
  learning_medicine.2025.a.tt:0 "Ta đối chất với [spouse.GetShortUIName]"

 #Healthy coping mechanism: becoming a confider
  learning_medicine.2030.t:0 "Chiếc Vương Miện Nặng Nề"
  learning_medicine.2030.desc:0 "Đôi khi, trách nhiệm với tư cách là [ROOT.Char.GetTitleAsNameNoTooltip] khiến Ta thấy hoàn toàn quá tải. Làm thế nào một [ROOT.Char.GetWomanMan] có thể gánh vác tất cả [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] trên đôi vai của [ROOT.Char.GetHerHis]?\n\nCó lẽ có những gánh nặng mà Ta không cần phải tự mình đối mặt. Phải chi Ta có một người để tin tưởng..."
  learning_medicine.2030.a:0 "Lời khuyên của [confider_target.GetFirstNamePossessiveNoTooltip] luôn khiến lòng ta dịu lại."
  learning_medicine.2030.a.message:0 "Tâm sự giúp ta giảm bớt căng thẳng"
  learning_medicine.2030.b:0 "[confider_target_2.GetFirstNameNoTooltip] là một người biết lắng nghe."
  learning_medicine.2030.c:0 "Chúng ta có thể giữ bí mật đen tối nhất của nhau."
  learning_medicine.2030.d:0 "Dựa dẫm vào người khác chỉ khiến ta yếu đuối."
  learning_medicine.2030.c.tt:0 "Nếu [confider_target.GetShortUIName] có [secret|E], [confider_target.GetSheHe] sẽ tiết lộ cho ta"
  learning_medicine.2030.c.message:0 "[confider_target.GetFirstNameNoTooltip] tiết lộ một bí mật"

 #Healthy coping mechanism: journaller or athletic, by Mathilda Bjarnehed
  learning_medicine.2040.t:0 "Tâm Trí Và Thể Xác"
  learning_medicine.2040.start.desc:0 "Càng đào sâu vào việc học, ta càng nhận ra rõ mối liên hệ giữa tâm trí và thể xác. Lo lắng quá mức có thể khiến người ta lâm bệnh, và tâm trí cũng không mạnh hơn chiếc thân xác chứa đựng nó!\n\n"
  learning_medicine.2040.athletic_friend.desc:0 "Người bạn thông thái [friend.GetTitledFirstName] của Ta thề rằng vận động mạnh giúp [friend.GetHerHim] kiểm soát được sự căng thẳng. Ta cũng từng đọc về lợi ích của việc viết nhật ký để xoa dịu sự lo âu."
  learning_medicine.2040.journaller_friend.desc:0 "Người bạn khôn ngoan của ta, [friend.GetTitledFirstName], viết nhật ký về những lo lắng của [friend.GetHerHis] và khẳng định điều đó giúp tâm trí [friend.GetHerHis] nhẹ nhõm. Ta cũng đã đọc về lợi ích của vận động mạnh để xoa dịu thần kinh căng thẳng."
  learning_medicine.2040.no_friend.desc:0 "Ta cần một lối thoát lành mạnh để đối phó với áp lực của việc cai trị. Ta đã đọc về lợi ích của việc vận động mạnh cũng như viết nhật ký để xoa dịu thần kinh căng thẳng."
  learning_medicine.2040.a:0 "Tập luyện cùng [friend.GetFirstNameNoTooltip]."
  learning_medicine.2040.b:0 "Hỏi [friend.GetFirstNameNoTooltip] về cách viết nhật ký."
  learning_medicine.2040.c:0 "Đi chạy."
  learning_medicine.2030.c.trait:0 "Việc tập luyện khiến ta bình tâm"
  learning_medicine.2030.c.modifier:0 "Ta không thấy thư giãn, nhưng cơ thể mạnh mẽ hơn"
  learning_medicine.2040.d:0 "Dành buổi chiều để viết nhật ký."
  learning_medicine.2030.d.trait:0 "Viết nhật ký khiến ta bình tâm"
  learning_medicine.2030.d.modifier:0 "Ta không thấy thư giãn, nhưng khả năng viết lách được cải thiện"
  learning_medicine.2040.e:0 "Nghỉ trọn cả ngày."

 #Helping healing hand (medicine friend), by Mathilda Bjarnehed
  learning_medicine.2050.t:0 "Chảy Máu Đến Chết"
  learning_medicine.2050.start.desc:0 "Ta đang thanh tra trạm xá [Select_CString(IsLandlessAdventurer(ROOT.Char),'của trại','của doanh trại')] thì một người lính bị thương nặng được đưa vào. "[soldier.GetSheHe|U] đang mất quá nhiều máu! Bác sĩ đâu rồi?!"\n\n"
  learning_medicine.2050.physician.desc:0 "[physician.GetTitledFirstName] không thấy đâu."
  learning_medicine.2050.no_physician.desc:0 "Người chữa bệnh không thấy đâu."
  learning_medicine.2050.end.desc:0 "Một luồng khí lạnh chạy dọc sống lưng Ta. #EMP Ta#! có thể là hy vọng duy nhất của [soldier.Custom('WomanManPossessive')] này.\n\nĐột nhiên, như thể [helper.GetSheHe] xuất hiện từ hư không, [helper.Custom2('MyCharacterIntroduction', ROOT.Char)] đứng ngay cạnh Ta. [helper.GetSheHe|U] xắn tay áo lên và nhìn Ta."
  learning_medicine.2050.a:0 "Đưa ta băng garô!"
  learning_medicine.2050.a.success:0 "[helper.GetFirstNameNoTooltip] và ta cứu được người lính"
  learning_medicine.2050.a.failure:0 "Dù đã cố gắng, chúng ta vẫn mất [soldier.GetHerHim]"
  learning_medicine.2050.b:0 "#EMP Lùi lại#!! Đây là bệnh nhân của #EMP ta#!"
  learning_medicine.2050.b.success:0 "Ta tự mình cứu được người lính"
  learning_medicine.2050.b.failure:0 "Ta không thể cứu [soldier.GetHerHim]"
  learning_medicine.2050.c:0 "Cứ để [soldier.GetHerHim] chảy máu. [soldier.GetSheHe|U] không đáng được cứu."

  learning_medicine.2051.start_our.desc:0 "Bệnh nhân của chúng ta"
  learning_medicine.2051.start.desc:0 "la hét và vùng vẫy. Dù ba [soldier.GetWomenMen] trưởng thành đang giữ chặt [soldier.GetHerHim], từng bước vẫn là một cuộc vật lộn."
  learning_medicine.2051.middle.desc:0 "Nhưng [helper.GetTitledFirstName] vẫn bình tĩnh, và cuối cùng một sự tập trung lặng lẽ bao trùm lấy chúng ta.\n\nTa không rõ chúng ta đã làm được bằng cách nào, nhưng cuối cùng có vẻ người lính sẽ sống. "Thật là một kỳ công ấn tượng,""
  learning_medicine.2051.my_ladylord.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U],"" 
  learning_medicine.2051.firstname.desc:1 "[ROOT.Char.GetFirstNameNoTooltip],"" 
  learning_medicine.2051.end.desc:0 "[helper.GetFirstNameNoTooltip] nói với nụ cười mệt mỏi. "Thật vinh dự khi được phục vụ bên cạnh ngài.""
  learning_medicine.2051.a:0 "Nếu không có ngươi ta đã không làm được."

  learning_medicine.2052.middle.desc:0 "\n\nChúng ta làm việc điên cuồng, hét ra lệnh giữa cảnh hỗn loạn, nhưng vô vọng. Người [soldier.GetWomanMan] chỉ càng lúc càng yếu đi, sinh lực của [soldier.GetHerHis] tuôn trào qua những ngón tay của chúng ta.\n\n"Chúng ta đã làm mọi thứ có thể," 
  learning_medicine.2052.end.desc:0 "[helper.GetFirstNameNoTooltip] nói với một tiếng thở dài nặng nề khi họ mang thi thể đi. "Người [soldier.GetWomanMan] đó đã định sẵn cái chết từ lâu trước khi chúng ta đặt mắt lên [soldier.GetHerHim]."" 
  learning_medicine.2052.a:0 "Ngươi nói đúng. Cảm ơn ngươi, [helper.GetFirstNameNoTooltip]."
  learning_medicine.2052.b:0 "Ta không cần sự thương hại của ngươi!"

  learning_medicine.2053.start_my.desc:0 "Của ta"
  learning_medicine.2053.desc:0 "Nhưng kiến thức của ta không phản bội ta, và đôi tay ta vẫn vững vàng.\n\nTa không rõ mình đã làm được bằng cách nào, nhưng cuối cùng có vẻ người lính sẽ sống. Đồng đội của [soldier.GetHerHis|U] vỗ lưng ta, lễ nghi bị quên lãng trong niềm nhẹ nhõm. "Cảm ơn ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]. Chúng ta đã mất [soldier.GetFirstName] nếu không có ngài!"" 
  learning_medicine.2053.a:0 "Hôm nay ta đã cứu một mạng người!"

  learning_medicine.2054.desc:0 "\n\nTa làm việc điên cuồng, hét ra lệnh giữa cảnh hỗn loạn, nhưng vô vọng. Người [soldier.GetWomanMan] chỉ càng lúc càng yếu đi, sinh lực của [soldier.GetHerHis] tuôn trào qua những ngón tay ta.\n\nKhi họ mang thi thể đi, [helper.GetFirstName] nhìn ta với"
  learning_medicine.2054.disgust.desc:0 "sự khinh ghét không hề che giấu."
  learning_medicine.2054.pity.desc:0 "sự thương hại."
  learning_medicine.2054.a:0 "Ta... Giá như ta chỉ..."

 #A vassal (or your liege) wants to eat some hashish while visiting your capital, by Ewan Cowhig Croft.
  learning_medicine.2110.t:0 "Chuyện Trò Bên Bánh Ngọt"
  learning_medicine.2110.desc:0 "Ta cùng đoàn tùy tùng đang dạo bước trở về sau một chuyến ghé thăm ngắn tại [capital.GetNameNoTooltip], thì bất ngờ chạm mặt [hashish_vassal_or_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] cùng đoàn người của [hashish_vassal_or_liege.GetHerHis], đang lén lút quanh quẩn trong kinh đô của ta vì một việc chưa hề báo trước.\n\n"
  learning_medicine.2110.desc_good_terms:0 ""À, [ROOT.Char.GetFirstNameNoTooltip]! Ta hy vọng sẽ gặp được ngài. Lại đây, ta đã tìm thấy một quán rượu nhỏ tuyệt vời chỉ cách đây không xa. Ngài có muốn cùng ta thưởng thức chút [ROOT.Char.Custom('GetExpensiveDrink')] và bánh ngọt tẩm hashish không?"" 
  learning_medicine.2110.desc_bad_terms:0 "Không khí căng thẳng đến mức có thể cảm nhận được, vệ binh hai bên đều sẵn sàng giao chiến. "[ROOT.Char.Custom('FormOfAddressForLiege')|U]", một binh sĩ trẻ đứng sau lưng ta lắp bắp, "có lẽ tất cả chúng ta có thể bình tĩnh lại bên vài chiếc bánh hashish ở quán rượu nhỏ kia?"\n\nSự im lặng bao trùm hai đoàn người khi [hashish_vassal_or_liege.GetFirstNameNoTooltip] chờ đợi câu trả lời của ta."
  learning_medicine.2110.desc_neutral_terms:0 "Bị bắt gặp bất ngờ, vài khoảnh khắc im lặng khó xử trôi qua trước khi ánh mắt của [hashish_vassal_or_liege.GetFirstNamePossessiveNoTooltip] dừng lại ở thứ gì đó phía sau ta.\n\n"À, [hashish_vassal_or_liege.Custom2('RelationToMe', ROOT.Char)] của ta, có lẽ ngài sẽ cùng ta quên chuyện này đi bên chút [ROOT.Char.Custom('GetExpensiveDrink')] và bánh hashish chứ?"" 
  learning_medicine.2110.a.good_terms:0 "Xin lỗi, nhưng ta phải tiếp tục lên đường."
  learning_medicine.2110.a.bad_terms:0 "Với con chó này ư? Không bao giờ!"
  learning_medicine.2110.a.neutral_terms:0 "Ta e rằng ta còn việc phải làm."
  learning_medicine.2110.b.good_terms:0 "Có lẽ ta cũng có thể buông thả một chút..."
  learning_medicine.2110.b.bad_terms:0 "Được thôi. Nhưng #EMP chỉ một#! cái bánh."
  learning_medicine.2110.b.neutral_terms:0 "Có lẽ chúng ta có thể ăn một hai cái bánh..."
  learning_medicine.2110.b.flavour:0 "Một cái bánh thành hai, rồi ba, rồi năm..."
  cosmic_insights_modifier:0 "Nhận Thức Vũ Trụ"
  cosmic_insights_modifier_desc:0 "Một đêm dài dùng hashish đã thật sự cho nhân vật này cái nhìn sâu sắc về bản chất của thực tại."
  learning_medicine.2110.c.good_terms:0 "Cố mà theo kịp ta, bằng hữu!"
  learning_medicine.2110.c.bad_terms:0 "Tửu lượng của ta là huyền thoại!"
  learning_medicine.2110.c.neutral_terms:0 "Đêm nay sẽ là một đêm sa hoa!"
  learning_medicine.2110.c.tt_success:0 "Hashish khiến [hashish_vassal_or_liege.GetHerHim] nói quá nhiều"
  learning_medicine.2110.c.tt_fail:0 "Quá chén khiến ta lỡ lời"

##########
#learning_medicine_special
###########

# Study human cadavers, by Linnéa Thimrén and Flavio Verna
  learning_medicine_special.1001.t:0 "Bí Mật Của Cơ Thể"
  learning_medicine_special.1001.desc:0 "Ta nhận ra mình bị mê hoặc bởi cơ thể con người và tất cả những bí mật mà nó vẫn còn giữ kín với chúng ta. Những câu hỏi về sự sống và cái chết luôn hiện diện trong tâm trí ta.\n\nĐọc sách về chủ đề này cũng tốt, nhưng ta không khỏi cảm thấy rằng mình sẽ học được nhiều hơn nếu tự tay nghiên cứu."
  learning_medicine_special.1001.a:0 "Ta sẽ nghiên cứu sự tàn phá của bệnh tật trên một thi thể."
  learning_medicine_special.1001.b:0 "Thi thể người chết xứng đáng được tôn trọng!"

  learning_medicine_special.1002.desc:0 "Ta cố nín thở khi bới tung đống nội tạng nhầy nhụa, sưng phồng trào ra từ bụng thi thể, nhưng vô ích. Mùi thối rữa ghê tởm của sự phân hủy chậm rãi len vào phổi ta, khiến ta nôn khan.\n\nBỗng thứ gì đó rách toạc, và một dòng dịch vàng sánh đặc tràn khắp bàn mổ.\n\n "Cái #EMP đó#! là gì vậy?"" 
  learning_medicine_special.1002.a:0 "Có lẽ [scoped_physician.GetTitledFirstNameNoTooltip] có thể giúp ta?"
  learning_medicine_special.1002.a.good:0 "[scoped_physician.GetTitledFirstName] giúp đỡ ta trong nghiên cứu"
  learning_medicine_special.1002.a.bad:0 "[scoped_physician.GetTitledFirstName] kinh hoàng trước thí nghiệm của ta"
  learning_medicine_special.1002.b:0 "Ta chỉ cần tìm thêm thi thể... bằng cách nào đó."
  learning_medicine_special.1002.c:0 "Đủ rồi! Thật ghê tởm!"

  learning_medicine_special.1003.desc_physician:0 "[scoped_physician.GetTitledFirstName] vô cùng phấn khích khi biết ta vừa nảy sinh hứng thú với giải phẫu học. Với sự giúp đỡ của [scoped_physician.GetHerHis], ta đã hiểu sâu hơn đáng kể về cơ thể con người."
  learning_medicine_special.1003.desc_fallback:0 "Nhờ vài đồng tiền đặt đúng chỗ và một người hầu kín miệng, ta đã đảm bảo nguồn cung thi thể ổn định để thí nghiệm. Đáng tiếc là ta làm hỏng phần lớn chúng, nhưng làm sao học được nếu không phạm phải vài sai lầm — hay cả tá sai lầm?"
  learning_medicine_special.1003.desc_ending:0 "\n\nChỉ ước có cách nào đó ngăn được mùi hôi... Ta bắt đầu lo rằng hít phải thứ không khí độc này lâu dài có lẽ không tốt cho sức khỏe."
  learning_medicine_special.1003.a:0 "Có lẽ vài bông hoa sẽ giúp được?"
  learning_medicine_special.1003.a.good:0 "Những biện pháp phòng ngừa giúp ta tránh khỏi bệnh tật"
  learning_medicine_special.1003.a.bad:0 "Mùi thi thể bắt đầu ảnh hưởng đến thể dịch của ta"
  learning_medicine_special.1003.b:0 "Ta nghĩ mình đã học đủ rồi."

  learning_medicine_special.1004.desc:0 "[scoped_physician.GetTitledFirstName] hoàn toàn không hài lòng khi biết về các thí nghiệm của ta. [scoped_physician.GetSheHe|U] từ chối giúp đỡ và khiển trách ta rằng những việc như vậy không thuộc trách nhiệm của một [ROOT.Char.GetTitleTierName]."
  learning_medicine_special.1004.unavailable.desc:0 "Vì [scoped_physician.GetTitledFirstName] không còn có thể hỗ trợ ta nữa, ta cũng không thể tiếp tục các thí nghiệm giải phẫu người."
  learning_medicine_special.1004.a:0 "Có lẽ ngươi nói đúng..."
  learning_medicine_special.1004.unavailable.a:0 "Đành vậy."
  learning_medicine_special.1004.unavailable.tt:0 "Ngươi ngừng nghiên cứu thi thể người"

  learning_medicine_special.1005.desc:0 "May mắn thay, việc sử dụng đúng cách các luống hoa, hương trầm và thông gió dường như đã giúp giảm bớt ảnh hưởng của những luồng khí độc bốc ra từ thi thể.\n\nCuối cùng ta có thể tập trung vào nghiên cứu mà không lo ảnh hưởng đến sự cân bằng thể dịch của bản thân."
  learning_medicine_special.1005.a:0 "Không gì có thể cản bước tri thức!"

  learning_medicine_special.1006.desc_opening:0 "Khi ta đứng trên một trong những thi thể đã nằm trong phòng nghiên cứu nhiều ngày, ta đột nhiên cảm thấy chóng mặt — lần nữa."
  learning_medicine_special.1006.desc_death:0 "Cơn ho đến không lâu sau đó, và khi ta cúi xuống vì đau đớn, ta cảm thấy máu rỉ ra giữa đôi môi.\n\nTa chớp mắt và nhận ra mình đang nằm trên sàn. Ta hít một hơi run rẩy, rồi không thể hít thêm được nữa. Ta nhắm mắt lại..."
  learning_medicine_special.1006.desc:0 "Ta không thể tiếp tục phớt lờ nhu cầu của chính cơ thể mình nữa, ta phải dừng việc này lại và nghỉ ngơi một lúc..."
  learning_medicine_special.1006.a:0 "Mùi tử khí đã làm rối loạn thể dịch của ta!"

 

 #You consume a hallucinogenic fish, by Ewan Cowhig Croft.
  learning_medicine_special.2100.t:0 "Con Cá Kỳ Diệu"
  learning_medicine_special.2100.desc:1 "Một [fish_alchemist.GetWomanMan] chài lưới địa phương từ [hallucinogenic_fish_county.GetNameNoTierNoTooltip], [fish_alchemist.GetName], đã đến gặp Ta và tuyên bố có thể nấu một bữa tối đầy mê hoặc.\n\nNghe nói, [fish_alchemist.GetSheHe] bắt được loài cá mộng từ một địa điểm bí mật và thực hiện những nghi lễ kỳ lạ lên chúng. [fish_alchemist.GetSheHe|U] sau đó phục vụ phần đầu cá, thứ sẽ truyền cảm hứng cho những ảo giác xuất thần suốt nhiều ngày sau đó.\n\nNgười [fish_alchemist.GetWomanMan] chài lưới vặn xoắn đôi bàn tay [fish_alchemist.GetHerHis] khi nhìn Ta, ánh mắt đan xen giữa lòng tham và sự sợ hãi."
  learning_medicine_special.2100.a:0 "Chuẩn bị cho ta một con cá ma thuật của ngươi."
  learning_medicine_special.2100.a.tt_success:0 "Ta nhận được những khải thị thiêng liêng về [ROOT.Char.GetFaith.PositiveAfterLife]"
  hallucinogenic_visions_uplifting_modifier:0 "Khải Tượng Hân Hoan Về Thế Giới Bên Kia"
  hallucinogenic_visions_uplifting_modifier_desc:0 "Nhân vật này đã nhận được những khải thị làm biến đổi tâm trí về niềm hạnh phúc chờ đợi những kẻ được chọn ở thế giới bên kia."
  learning_medicine_special.2100.a.tt_failure:0 "Ta bị ám ảnh bởi ác mộng về [ROOT.Char.GetFaith.NegativeAfterLife]"
  hallucinogenic_visions_terrifying_modifier:0 "Khải Tượng Kinh Hoàng Về Thế Giới Bên Kia"
  hallucinogenic_visions_terrifying_modifier_desc:0 "Nhân vật này bị dày vò bởi những ảo ảnh kinh hoàng khắc sâu trong tâm trí về số phận đang chờ đợi kẻ không xứng đáng ở thế giới bên kia."
  learning_medicine_special.2100.b:0 "Nghi lễ này... ngươi phải dạy nó cho ta."
  learning_medicine_special.2100.b.tt_success:0 "Tên nông dân tiết lộ bí mật của [fish_alchemist.GetHerHis]"
  learning_medicine_special.2100.b.tt_success.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] gia nhập triều đình của ta với tư cách một bề tôi trung thành"
  learning_medicine_special.2100.b.tt_fail:0 "Ta cãi vã dữ dội với kẻ thường dân"
  learning_medicine_special.2100.b.tt_failure.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] bỏ trốn khỏi triều đình ta trong cơn phẫn nộ"
  associates_with_strange_peasants_modifier:0 "Giao Thiệp Với Những Nông Dân Kỳ Lạ"
  associates_with_strange_peasants_modifier_desc:0 "Nhân vật này nổi tiếng vì đã tham gia những cuộc tranh cãi kỳ quái với những kẻ ở địa vị thấp hơn mình rất nhiều."
  learning_medicine_special.2100.c:0 "Đừng để mụ phù thủy đó sống!"
  learning_medicine_special.2100.c.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] bị thiêu sống trên cọc"
  learning_medicine_special.2100.d:0 "Có ai vui lòng đuổi kẻ thường dân này ra ngoài không?"
  learning_medicine_special.2100.d.tt:0 "[fish_alchemist.GetShortUINameNoTooltip] bị ném khỏi triều đình của ta, mang theo nỗi cay đắng"
  aloof_from_the_commoners_modifier:0 "Xa Cách Với Thường Dân"
  aloof_from_the_commoners_modifier_desc:0 "Nhân vật này nổi tiếng vì thường xua đuổi những nông dân đến làm phiền."
