# Learn to read, by Linnéa Thimrén
  learning_scholarship.1101.t:0 "Thiếu Khả Năng Đọc Viết"
  learning_scholarship.1101.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta nhận thấy rằng ngài có lẽ cần được chỉ dạy đôi chút trong nghệ thuật... giải mã chữ viết," [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] nói khi trao cho ta một cuộn da.\n\n"Nếu [ROOT.Char.GetLadyLord] cho phép, ta sẵn lòng dạy ngài; ta có sẵn văn bản hoàn hảo ngay tại đây.""
  learning_scholarship.1101.a:0 "Nh... nhà v- vua có... một chiếc vương miện lớn..."
  learning_scholarship.1101.b:0 "Ta đọc rất thành thạo!"

# Automaton, by Linnéa Thimrén & Mathilda Bjarnehed
  learning_scholarship.1201.t:0 "Chim Hót"
  learning_scholarship.1201.desc:0 "Lông vũ bằng kim loại lấp lánh, đôi mắt bằng đá quý, giọng ca vang như tiếng chuông... Con chim máy được [bird_sender.Custom2('MyCharacterIntroduction', ROOT.Char)] tặng cho ta quả là một kiệt tác!\n\n"Bức chim này được chế tác bởi những nghệ nhân tài giỏi nhất trong toàn [bird_sender.GetPrimaryTitle.GetNameNoTierNoTooltip]," bức thư của [bird_sender.GetTitledFirstNamePossessiveNoTooltip] viết. "Ta nghĩ ngài sẽ thấy nó rất thú vị.""
  learning_scholarship.1201.a:0 "Bán nó."
  learning_scholarship.1201.b:0 "Đem ra trưng bày."
  learning_scholarship.1201.c:0 "Tháo rời nó và nghiên cứu cơ chế."
  learning_scholarship.1201.c.success:0 "[bird_sender.GetTitledFirstNameNoTooltip] là một [bird_sender.GetWomanMan] uyên bác"
  learning_scholarship.1201.c.failure:0 "[bird_sender.GetTitledFirstNameNoTooltip] bị xúc phạm"

# Acquire a reading stone, by Linnéa Thimrén
  learning_scholarship.1401.t:0 "Hòn Đá Thủy Tinh"
  learning_scholarship.1401.desc:0 "Khi ta cố đọc những chữ tí hon trên cuộn da trước mặt, cơn đau đầu quen thuộc lại dâng lên. Tại sao bọn thư lại cứ phải viết những ký tự nhỏ đến vậy?!\n\nTa nheo mắt và thử lại.\n\n"...không khác gì phép màu. Với sự trợ giúp của một hòn đá thủy tinh, ngay cả những [ROOT.Char.GetWomenMen] già nua mắt kém cũng có thể đọc dễ dàng.""
  learning_scholarship.1401.a:1 "Ta cần một hòn đá như vậy!"
  learning_scholarship.1401.b:0 "Bán hết những thứ không thể đọc nổi."
  learning_scholarship.1401.c:0 "[bishop.GetTitledFirstNameNoTooltip], ta cần sự trợ giúp của ngươi!"
 
 # Scientific Experiments, by Petter Vilberg
  learning_scholarship.3001.t:0 "Khải Tượng Thiêng Liêng"
  learning_scholarship.3001.desc:0 "Ta ra hiệu cho [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))] của mình, [chaplain.GetTitledFirstName], bước vào vòng tròn những quả cầu đồng và nến được đặt trên các giá trong căn phòng tối. Khói hương dày đặc để xua đuổi khí độc khiến mắt chúng ta sớm cay xè. "Bằng cách này, nơi khóe mắt, chúng ta sẽ thấy được hình dạng khó hiểu của các thiên thần."\n\nTuy nhiên, [chaplain.GetFirstNameNoTooltip] nhanh chóng chần chừ. "Việc này có vẻ sai trái. Đó là những thực thể thiêng liêng, không dành cho mắt phàm nhân.""
  learning_scholarship.3001.a:0 "Ngươi có thể rời đi, nhưng bằng cách nào đó, ta sẽ biết."
  learning_scholarship.3001.b:0 "Đúng vậy, đây là việc ngu ngốc — nếu không muốn nói là tội lỗi."
  learning_scholarship.3001.c:0 "Ý định của ta là trong sáng, ta đảm bảo!"
  learning_scholarship.3001.c.tt1:0 "Ta thuyết phục [chaplain.GetFirstName] trợ giúp"
  learning_scholarship.3001.c.toast.tt1:0 "[chaplain.GetFirstName] bị thuyết phục bởi lời cầu xin của ta."
  learning_scholarship.3001.c.tt2:0 "Ta không thể lay chuyển [chaplain.GetFirstName]"
  learning_scholarship.3001.c.toast.tt2:0 "[chaplain.GetFirstName] bác bỏ lý lẽ của ta"

# Translate a Great Work, by Petter Vilberg
#story cycle loc
 book_translation_story: "Translate a Great Work"
 book_translation_story_desc: "Translating a great work will empower others to benefit from its wisdom. Accomplishing this ambitious intellectual feat will be a reflection of your scintillating brilliance, failure will mark you as a dullard."
 TRANSLATION_STORY: "You are translating [Story.GetOwner.Custom('TranslationBookLong')]"
 TRANSLATION_QUALITY: "Translation Quality"
 POOR_TRANSLATION: "Poor"
 EXCELLENT_TRANSLATION: "Excellent"
 DURATION_LEFT: "Duration Remaining"
 PROGRESS_TOWARDS_CYNICISM: "Progress Towards Cynicism"
 CYNICISM: "Cynicism"
 ZEALOTRY: "Zealotry"
#event loc
  learning_scholarship_special.2001.t:0 "Một Bản Dịch Mới"
  learning_scholarship_special.2001.desc:0 "Hơn hết thảy, hành trình trở thành một [ROOT.Char.GetWomanMan] uyên bác khiến ta nhận ra mình còn biết quá ít. Hơn nữa, chắc hẳn đã có vô số tri thức thất lạc theo dòng thời gian, khi sách vở mục nát hoặc ngôn ngữ bị lãng quên...\n\nCó lẽ ta có thể đóng góp bằng cách thực hiện một bản dịch mới cho một trong những tác phẩm kinh điển?\n\nTuy vậy, ta nên dịch tác phẩm nào...?"
  learning_scholarship_special.2001.regula_pastoralis:0 "Regula Pastoralis — về cách sống một đời tốt đẹp."
  learning_scholarship_special.2001.physica_elementa:0 "Một tác phẩm khoa học kinh điển — Physica của Aristotle!"
  learning_scholarship_special.2001.almagest:0 "Nghiên cứu bầu trời qua Almagest của Ptolemy."
  learning_scholarship_special.2001.elements:0 "Elements — luận thuyết toán học của Euclid!"
  learning_scholarship_special.2001.corpus_hermeticus:0 "Tri thức huyền bí của Corpus Hermeticus!"
  learning_scholarship_special.2001.treatises_of_hippocrates:0 "Những hiểu biết y học từ các Luận thuyết của Hippocrates."
  learning_scholarship_special.2001.peri_psyches:0 "Tác phẩm nổi tiếng Peri Psyches của Aristotle!"
  learning_scholarship_special.2001.kategoriai:0 "Categories — định nghĩa mọi chủ thể và vị ngữ."
  learning_scholarship_special.2001.avesta:0 "Kinh thánh Ba Tư cổ đại — Avesta."
  learning_scholarship_special.2001.de_oratore:0 "Bài học hùng biện của Cicero trong De Oratore!"
  learning_scholarship_special.2001.book_of_arda_viraf:0 "Hành trình trong mộng từ Sách Arda Viraf."
  learning_scholarship_special.2001.upanishads:0 "Những Áo Nghĩa Thư nổi tiếng của Vệ Đà!"
  learning_scholarship_special.2001.rigveda:0 "Những bài thánh ca tôn giáo của Rigveda."
  learning_scholarship_special.2001.book_of_balances:0 "Compendious Book on Calculation."
  learning_scholarship_special.2001.secret_of_secrets:0 "Secret of Secrets được truyền cho Alexander."
  learning_scholarship_special.2001.court_of_agriculture:0 "Court of Agriculture."
  learning_scholarship_special.2001.lanterns_of_wisdom:0 "Chỉ dẫn giả kim trong Lanterns of Wisdom."
  learning_scholarship_special.2001.shahnameh:0 "Trường ca lịch sử Ba Tư — Shahnameh."
  learning_scholarship_special.2001.arithmetica:0 "Arithmetica và chú giải của Diophantus."
  learning_scholarship_special.2001.pali_canon:0 "Một văn bản từ Tam Tạng Pali."
  learning_scholarship_special.2001.the_norse_sagas:0 "Một trong những Saga Bắc Âu!"
  learning_scholarship_special.2001.family_history:0 "Điều gì đó mang tính cá nhân — gia phả của ta."
  learning_scholarship_special.2001.ancient_myths:0 "Điều gì đó vĩ đại — một thần thoại cổ xưa!"
  learning_scholarship_special.2001.decline:0 "Việc này nghe có vẻ quá khó."

  book_translation_tooltip.unchanged:0 "#V Chất lượng bản dịch#! sẽ không thay đổi"
  book_translation_tooltip.more_good:0 "#V Chất lượng bản dịch#! sẽ cải thiện đáng kể"
  book_translation_tooltip.less_good:0 "#V Chất lượng bản dịch#! sẽ cải thiện đôi chút"
  book_translation_tooltip.finish_faster:0 "Bản dịch sẽ hoàn thành nhanh hơn"

  book_translation_toast.unchanged:0 "#V Chất lượng bản dịch#! không thay đổi"
  book_translation_toast.more_good:0 "#V Chất lượng bản dịch#! cải thiện đáng kể"
  book_translation_toast.less_good:0 "#V Chất lượng bản dịch#! cải thiện đôi chút"
  book_translation_toast.finish_faster:0 "Bản dịch sẽ hoàn thành nhanh hơn"

  learning_scholarship_special.2011.desc:0 "Bản dịch của ta về [ROOT.Char.Custom('TranslationBook')] đang tiến triển, nhưng một đoạn trong bản gốc khiến ta phải dừng lại.\n\nNhững người chép sách của ta khẳng định rằng dòng chữ này có nghĩa là "khi ta giữ hai bàn chân và rìa dâng lên của linh hồn thợ săn."\n\nĐiều đó không thể đúng, phải không?"
  learning_scholarship_special.2011.a:0 "Ta có thể nghĩ ra cách diễn đạt phù hợp hơn."
  learning_scholarship_special.2011.a.success:0 "Ta cải thiện văn bản"
  learning_scholarship_special.2011.a.failure:0 "Ta làm mất ý nghĩa"
  learning_scholarship_special.2011.b:0 "Chúng ta dịch y nguyên như đã viết!"
  learning_scholarship_special.2011.c:0 "Ôi, ý nghĩa quá rõ ràng, để ta xử lý."

  learning_scholarship_special.2012.desc:0 "Một cụm từ cụ thể trong [ROOT.Char.Custom('TranslationBook')] đã làm ta đau đầu suốt nhiều ngày. Thậm chí đôi khi ta còn lẩm bẩm nó một mình.\n\n"Vẫn còn mắc kẹt ở đoạn đó sao?" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))] của ta nâng một cuốn sách cổ dày cộp. "Chỉ cần biết tìm đúng chỗ.""
  learning_scholarship_special.2012.a:0 "Hãy giúp ta giải mã điều này, [realm_priest.GetFirstNameNoTooltip]!"
  learning_scholarship_special.2012.a.success:0 "[realm_priest.GetShortUINameNoTooltip] tìm ra câu trả lời"
  learning_scholarship_special.2012.a.failure:0 "[realm_priest.GetShortUINameNoTooltip] tìm ra một kiểu câu trả lời"
  learning_scholarship_special.2012.b:0 "Đừng vòng vo. Hãy nói ta phải tìm gì."
  learning_scholarship_special.2012.c:0 "Ngươi muốn chỉ cho ta xem chứ, bằng hữu?"
  learning_scholarship_special.2012.c.friendship_tooltip:0 "Tùy chọn này khả dụng nhờ tình bằng hữu của ta với [realm_priest.GetFirstNameNoTooltip]"

  learning_scholarship_special.2013.desc:0 "Ta đang cho người đọc lại các ghi chú cho bản dịch [ROOT.Char.Custom('TranslationBook')] của mình, thì bỗng chợt bừng hiểu. "Các thư lại! Hãy thêm lời chú giải sau...""
  learning_scholarship_special.2013.a:0 ""Không giống như [ROOT.Char.GetFaith.ReligiousText], tác phẩm này cho rằng...""
  learning_scholarship_special.2013.b:0 ""Như đã thể hiện qua ý chí của [ROOT.Char.GetFaith.HighGodName]...""

  learning_scholarship_special.2014.desc:0 "Ta đang cho đọc lại các ghi chú cho bản dịch [ROOT.Char.Custom('TranslationBook')] của mình, thì...\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]? Xin thứ lỗi, nhưng... ngài vừa ngủ gật sao?!"\n\nTrời cao chứng giám, cái “tác phẩm kinh điển” này đúng là thứ rác rưởi!"
  learning_scholarship_special.2014.a:0 "Dẫu vậy, ta vẫn sẽ ép mình đọc hết!"
  learning_scholarship_special.2014.b:0 "Các thư lại của ta có thể gánh thêm trách nhiệm."
  learning_scholarship_special.2014.c:0 "Ta cần nghỉ ngơi một chút."

  learning_scholarship_special.2015.desc:0 "Ta nhận ra mình đã làm việc hàng giờ liền dưới ánh nến chập chờn để dịch [ROOT.Char.Custom('TranslationBook')]. Nhiều khi ta hầu như không nhận ra thời gian trôi qua. Nhưng các thư lại thì có.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chắc giờ đã quá nửa đêm rồi. Có lẽ đã đến lúc nghỉ ngơi?""
  learning_scholarship_special.2015.a:0 ""Không, chúng ta phải tiếp tục cho đến khi ta hài lòng!""
  learning_scholarship_special.2015.b:0 ""Phải, ngủ một chút sẽ tốt cho tất cả.""
  learning_scholarship_special.2015.c:0 ""Các ngươi cứ tiếp tục làm việc, còn ta nghỉ một lát.""

  learning_scholarship_special.2016.desc:0 "Một trong các thư lại của ta đã tự ý chỉnh sửa bản dịch [ROOT.Char.Custom('TranslationBook')] của ta mà không hề cho ta biết!\n\n"Ta chỉ muốn làm cho nó trở nên hoàn hảo hơn! Ngài đã thích nó mỗi khi nghĩ đó là tác phẩm của mình!""
  learning_scholarship_special.2016.a:0 "Ngươi sẽ không bao giờ được sao chép văn bản cho bất kỳ ai nữa!"
  learning_scholarship_special.2016.b:0 "Ta sẽ bắt ngươi phải trả giá!"
  learning_scholarship_special.2016.b.flavor:0 ""Các ngươi, những thư lại còn lại, hãy lấy đây làm bài học!""
  learning_scholarship_special.2016.c:0 "Thực ra... cũng khá tốt đấy."

  learning_scholarship_special.2017.desc:0 "Nỗ lực không ngừng để dịch [ROOT.Char.Custom('TranslationBook')] khiến ta mệt mỏi. Sự tập trung, thấu hiểu và sáng tạo cần thiết để hoàn thành nó dần rút cạn sức lực của ta khi ta tiến gần đến đoạn kết."
  learning_scholarship_special.2017.a:0 "Chỉ thêm vài trang nữa tối nay, rồi sáng mai thêm vài trang..."
  learning_scholarship_special.2017.b:0 "Ta phải tự cách ly khỏi mọi thứ khác cho đến khi xong việc."
  learning_scholarship_special.2017.c:0 "Cuốn sách có thể chờ thêm một thời gian."

  learning_scholarship_special.2097.t:0 "Một Bản Dịch Xuất Sắc"
  learning_scholarship_special.2097.opening:0 "Bản dịch [ROOT.Char.Custom('TranslationBook')] của ta cuối cùng cũng hoàn thành. Lời văn của ta nằm trên những trang được minh họa tinh mỹ, tất cả được bảo vệ bởi bìa sách xa hoa xứng đáng với tầm quan trọng của tác phẩm."
  learning_scholarship_special.2097.conclusion:0 "\n\nCuốn sách đã chiếm vị trí trang trọng trong bộ sưu tập của ta, và mỗi [ROOT.Char.GetFaith.PriestNeuter] đọc nó đều vô cùng ấn tượng với nỗ lực của ta. Một số người thậm chí đã bắt đầu nói đến việc sao chép bản riêng."
  learning_scholarship_special.2097.a:0 "Công việc này đã dạy ta rất nhiều."

  learning_scholarship_special.2098.t:0 "Bản Dịch Của Ta Hoàn Thành"
  learning_scholarship_special.2098.opening:0 "Cuối cùng, bản dịch [ROOT.Char.Custom('TranslationBook')] của ta đã hoàn thành. Những dòng chữ được bao quanh bởi các minh họa tuyệt đẹp, trong đó những bức lộng lẫy nhất khéo léo thu hút ánh nhìn khỏi những đoạn ta còn chưa chắc chắn."
  learning_scholarship_special.2098.conclusion:0 "\n\nDù có vài chỗ hơi khó hiểu, không ai có thể phủ nhận rằng bản dịch này rất cần thiết. Khi nó nằm trong bộ sưu tập của ta — nơi các [ROOT.Char.GetFaith.DevoteeNeuterPlural] thường đọc — ta háo hức chờ đợi những bản sao đầu tiên được tạo ra."
  learning_scholarship_special.2098.a:0 "Ta đã học được rất nhiều từ việc này!"

# Lead to Gold, by Sean Hughes
  learning_scholarship_special.3001.t:0 "Chì Thành Vàng"
  learning_scholarship_special.3001.desc_opening:0 "Biến chì thành vàng từ lâu đã là giấc mơ của các nhà giả kim trên khắp thế giới. Dù nhiều người đã thử sức, chưa ai được biết là đã thành công.\n\n"
  learning_scholarship_special.3001.desc_alchemist:0 "Tuy nhiên, [alchemist.Custom2('MyCharacterIntroduction', ROOT.Char)] đã tìm thấy vài ghi chú viết bên lề một cuốn sách về thực vật. Họ cho rằng có thể tạo ra “mưa vàng” bằng cách đun đường chì trong dung dịch tro rong biển đã lọc."
  learning_scholarship_special.3001.desc:1 "Dù vậy, ta đã tìm thấy vài ghi chú viết bên lề một cuốn sách về thực vật. Chúng cho rằng có thể tạo ra “mưa vàng” bằng cách đun đường chì trong dung dịch tro rong biển đã lọc."
  learning_scholarship_special.3001.desc_ending:0 "\n\nLiệu điều đó có thể là thật?"
  learning_scholarship_special.3001.a:0 "Dù sao cũng đáng để thử..."
  learning_scholarship_special.3001.b:0 "Những dòng nguệch ngoạc này rõ ràng chỉ là trò đùa vô nghĩa."
  learning_scholarship_special.3001.c:0 "Theo đuổi của cải như vậy là bất kính!"
  learning_scholarship_special.3001.d:0 "Ta sẽ không bị cám dỗ bởi lời hứa của phù thủy!"

  learning_scholarship_special.3002.desc_alchemist:0 "Thuốc thử đầu tiên chúng ta cần là đường chì, một nguyên liệu dùng để làm ngọt rượu.\n\nChúng ta có thể tìm nhà cung cấp để nhập khẩu, dù sẽ khá tốn kém. Hoặc chúng ta có thể tự sản xuất rẻ hơn bằng cách đốt chì kim loại rồi hòa tro vào giấm..."
  learning_scholarship_special.3002.desc:0 "Thuốc thử đầu tiên ta cần là đường chì, một nguyên liệu dùng để làm ngọt rượu.\n\nTa có thể tìm nhà cung cấp để nhập khẩu, dù khá tốn kém. Hoặc ta có thể tự sản xuất rẻ hơn bằng cách đốt chì kim loại rồi hòa tro vào giấm..."
  learning_scholarship_special.3002.a:0 "Muốn kiếm tiền thì phải bỏ tiền!"
  learning_scholarship_special.3002.b:0 "Làm sao ta học được nếu người khác làm hết việc!?"
  learning_scholarship_special.3002.b_alchemist:0 "Làm sao chúng ta học được nếu người khác làm hết việc!?"
  learning_scholarship_special.3002.a.success:1 "Ngươi tạo ra đường chì mà không gặp sự cố"
  learning_scholarship_special.3002.a.failure:1 "Khói chì khiến ngươi đau đầu"
  learning_scholarship_special.3002.tt:1 "Ngươi thu được đường chì"
  learning_scholarship_special.3002.c:0 "Nghĩ lại thì, đây là ý tưởng tồi..."

  learning_scholarship_special.3003.desc_alchemist:0 "Thuốc thử thứ hai chúng ta cần là rong biển... rất nhiều rong biển. Một trăm dram, được xé nhỏ rồi phơi khô. Chúng ta có thể tìm đâu ra nhiều đến vậy?"
  learning_scholarship_special.3003.desc:0 "Thuốc thử thứ hai ta cần là rong biển... rất nhiều rong biển. Một trăm dram, được xé nhỏ rồi phơi khô. Ta có thể tìm đâu ra nhiều đến vậy?"
  learning_scholarship_special.3003.a:0 "Ta sẽ nhập khẩu từ các thị trấn ven biển."
  learning_scholarship_special.3003.b:0 "Áp thuế rong biển lên thần dân!"
  learning_scholarship_special.3003.c:0 "Ta có thể dùng chì để làm ngọt rượu thay vào đó..."
  learning_scholarship_special.3003.tt:1 "Ngươi thu được rong biển"

  learning_scholarship_special.3004.desc_alchemist:0 "Cuối cùng, chúng ta đã có đủ mọi thuốc thử cần thiết để tạo ra mưa vàng!\n\nĐường chì được cất an toàn trong các thùng chống nước. Những bó rong biển khô được xếp trong lò, sẵn sàng để đốt.\n\nĐây sẽ là kiệt tác của chúng ta chăng?"
  learning_scholarship_special.3004.desc:0 "Cuối cùng, ta đã có đủ mọi thuốc thử cần thiết để tạo ra mưa vàng!\n\nĐường chì được cất an toàn trong các thùng chống nước. Những bó rong biển khô được xếp trong lò, sẵn sàng để đốt.\n\nĐây sẽ là kiệt tác của ta chăng?"
  learning_scholarship_special.3004.a:0 "Bắt đầu thí nghiệm!"
  learning_scholarship_special.3004.a.success:1 "Ngươi tạo ra được mưa vàng"
  learning_scholarship_special.3004.a.success.tt:1 "Vinh quang và tài phú thuộc về ngươi!"
  learning_scholarship_special.3004.a.failure:0 "Công thức không hoạt động như mong đợi"
  learning_scholarship_special.3004.a.failure.tt:1 "Nhưng rốt cuộc ngươi đã tạo ra thứ gì?"
  learning_scholarship_special.3004.b:0 "...ta đang làm cái quái gì vậy? Thật ngu ngốc."

  learning_scholarship_special.3005.desc_alchemist:0 "Sau khi trộn đường chì vào dung dịch, nó đột nhiên chuyển sang màu vàng rực! Chúng ta đã lo lắng khi hỗn hợp trở nên trong suốt sau khi đun sôi, nhưng khi nguội lại, những tinh thể nhỏ màu vàng bắt đầu hình thành trong bình.\n\nKhi xem xét, chúng ta nhận ra chúng không phải vàng thật vì chúng trong suốt. Tuy vậy, phản ứng này có thể là một trong những “12 quá trình trọng yếu” huyền thoại để tạo ra vàng!"
  learning_scholarship_special.3005.desc:0 "Sau khi trộn đường chì vào dung dịch, nó đột nhiên chuyển sang màu vàng rực! Ta đã lo lắng khi hỗn hợp trở nên trong suốt sau khi đun sôi, nhưng khi nguội lại, những tinh thể nhỏ màu vàng xuất hiện trong bình của ta.\n\nKhi xem xét, ta biết rằng chúng không phải vàng thật vì chúng trong suốt. Tuy vậy, phản ứng này có thể là một trong những “12 quá trình trọng yếu” huyền thoại để tạo ra vàng!"
  learning_scholarship_special.3005.a:0 "Ta đã tiến gần hơn tới việc biến đổi thật sự chăng?"
  learning_scholarship_special.3005.a_alchemist:0 "Chúng ta đã tiến gần hơn tới việc biến đổi thật sự chăng?"

  learning_scholarship_special.3006.desc_alchemist:0 "Khi trộn đường chì vào tro rong biển đã đun sôi, hỗn hợp bỗng chuyển sang màu vàng rực.\n\nDù chúng ta không tạo ra vàng thật, dung dịch này có thể dùng làm thuốc nhuộm sánh ngang nghệ tây. Bán thuốc nhuộm này sẽ giúp ta thu hồi một phần chi phí."
  learning_scholarship_special.3006.desc:0 "Khi trộn đường chì vào tro rong biển đã đun sôi, hỗn hợp bỗng chuyển sang màu vàng rực.\n\nDù ta không tạo ra vàng thật, dung dịch này có thể dùng làm thuốc nhuộm sánh ngang nghệ tây. Bán thuốc nhuộm này sẽ giúp ta thu hồi một phần chi phí."
  learning_scholarship_special.3006.a:0 "Đẹp đấy, dù sản xuất chẳng lời lãi."

  learning_scholarship_special.3007.desc_alchemist:0 "Sau khi đốt rong biển và trộn với nước, chúng ta thu được một lượng bùn nâu ghê tởm đáng báo động. Không biết làm gì tiếp, chúng ta trộn đường chì vào dung dịch, nhưng không có thay đổi nào xảy ra.\n\nĐáng tiếc, công dụng duy nhất ta nghĩ ra cho thí nghiệm này là dùng làm phân bón."
  learning_scholarship_special.3007.desc:0 "Sau khi đốt rong biển và trộn với nước, ta thu được một lượng bùn nâu ghê tởm đáng báo động. Không biết làm gì tiếp, ta trộn đường chì vào dung dịch, nhưng không có thay đổi nào xảy ra.\n\nĐáng tiếc, công dụng duy nhất ta nghĩ ra cho thí nghiệm này là dùng làm phân bón."
  learning_scholarship_special.3007.a:0 "Ít nhất mùa màng năm nay sẽ tốt chăng?"

  learning_scholarship_special.3099.termination.toast:0 "Sự Chuyển Hóa Bị Cản Trở"
  learning_scholarship_special.3099.termination.desc.prison:0 "Ta không thể tiếp tục các thí nghiệm chuyển hóa khi đang bị giam trong ngục."
  learning_scholarship_special.3099.termination.desc.incapable:0 "Ta không thể tiếp tục các thí nghiệm chuyển hóa trong lúc bản thân bất lực."
 
 #Dear god, go outside by Isabella Welch
  learning_scholarship.4000.t:1 "Ra Ngoài Đi!"
  learning_scholarship.4000.desc:0 "Đêm đã khuya, và ta đang chăm chú đọc một luận văn hấp dẫn về ngữ pháp cổ điển. Vừa lúc ta bật cười khúc khích trước vài dòng ghi chú mỉa mai thú vị do người đọc trước để lại bên lề, thì [spouse_uninterested_in_study.GetWifeHusband] bước vào [ROOT.Char.Custom('GetRoom')].\n\n\"Đồ hèn nhát [ROOT.Char.GetWomanMan]! Ngươi bỏ bê mọi thứ chỉ để vùi đầu vào việc học, ngồi đọc một mình trong nhà từ hoàng hôn đến rạng sáng. Hãy nhấc cái đầu ra khỏi đống cuộn giấy bụi bặm đó đi, nếu không tối nay đừng hòng bước lên giường của ta.\""
  learning_scholarship.4000.a:0 "Theo ý ngài."
  learning_scholarship.4000.b:0 "Có lẽ từ nay chúng ta có thể cùng nhau đọc vài đoạn."
  learning_scholarship.4000.c:0 "Ta phải làm việc khuya để chuẩn bị bài học cho [child_educated.GetFirstNameNoTooltip] thân mến."
  learning_scholarship.4000.c.tt:0 "[spouse_uninterested_in_study.GetFirstName] không phải là [spouse_uninterested_in_study.GetMotherFather] của [child_educated.GetFirstNameNoTooltip]."
  learning_scholarship.4000.d:0 "Ta đâu cần nằm cùng ngươi — ta đã có vòng tay ấm áp của tri thức!"

# Bibliomancy by Chad Uhl
  bibliomancy_chain_header:0 "Một Thánh Thư:"

  learning_scholarship.5000.t:0 "Một Thánh Thư"
  learning_scholarship.5000.desc:0 "Khi đang dạo quanh chợ, một thương nhân gọi Ta lại và khẳng định [merchant_mystic.GetSheHe] có thứ gì đó sẽ thu hút sự quan tâm của Ta.\n\nMùi thảo mộc khô và những tinh chất lạ lẫm tràn ngập các giác quan khi Ta tiến gần đến quầy hàng. [merchant_mystic.GetSheHe|U] đang lục lọi trong bộ sưu tập các tập sách bụi bặm và những báu vật khác của [merchant_mystic.GetHerHis].\n\nSau một hồi tìm kiếm, thương nhân lấy ra một cuốn sách cũ và khăng khăng Ta cần nó cho "những điều sắp tới.""
  learning_scholarship.5000.a:0 "Được, ta sẽ xem thử."
  learning_scholarship.5000.b:0 "Có lẽ chúng ta có thể đạt được một thỏa thuận."
  learning_scholarship.5000.c:0 "Ta lấy thứ ta cần."
  learning_scholarship.5000.d:0 "Ta cần gì sách của ngươi?"

  learning_scholarship.5000.b.success:0 "Ngươi thương lượng được giá tốt hơn"
  learning_scholarship.5000.b.failure:0 "Ngươi thất bại trong việc thương lượng giá"

  bibliomancy_book_purchased:0 "Ngươi sẽ nhận được một cuốn sách [artifact|E]"
  learning_scholarship_sacred_artifact_obtained:0 "Ngươi nhận được thánh thư"

  learning_scholarship.5001.t:0 "$bibliomancy_chain_header$ Thư Bói"
  learning_scholarship.5001.desc:0 "Khi ta đang cất đi cuốn [sacred_text.GetName] vừa mới có được, một mảnh giấy da rơi ra. Trên đó là những chỉ dẫn cho một phương pháp gọi là thư bói, nơi người ta có thể đoán vận mệnh của mình từ một đoạn trong sách.\n\nTất cả những gì ta cần làm là mở cuốn sách này vào một trang bất kỳ và đọc câu định mệnh đầu tiên mà ánh mắt ta chạm tới."
  learning_scholarship.5001.a:0 "Sự cám dỗ này thật khó cưỡng."
  learning_scholarship.5001.b:0 "Ta không dính líu gì đến thứ tà thuật này."

  learning_scholarship.5002.t:0 "$bibliomancy_chain_header$ Lời Đọc Định Mệnh"
  learning_scholarship.5002.desc:0 "Ta làm theo chỉ dẫn từng chữ một và chọn ngẫu nhiên một đoạn trong cuốn sách trước mặt. Run lên vì chờ đợi, ta mở mắt và đọc:\n\n#EMP Nỗi sợ là kẻ hủy diệt tâm trí. Kẻ hèn nhát chết hàng ngàn cái chết nhỏ, nhưng người dũng cảm chỉ chết một lần.#!\n\nTa nên hiểu điều này ra sao?"
  learning_scholarship.5002.a:0 "Nỗi sợ là cái chết nhỏ dẫn đến sự hủy diệt hoàn toàn."
  learning_scholarship.5002.b:0 "Thật thú vị. Điều này cần được nghiên cứu thêm."
  learning_scholarship.5002.b.success:0 "Ta khám phá ra ý nghĩa thật sự của đoạn văn này"
  learning_scholarship.5002.b.failure:0 "Đoạn văn vẫn khiến ta bối rối"
  learning_scholarship.5002.c:0 "Thật là lời lẽ vô nghĩa!"
  learning_scholarship.5002.c.tt:0 "Ngươi bỏ qua đoạn văn"
  learning_scholarship.5002.d:0 "$antiquarian_court_position$ của ta, [antiquarian.GetTitledFirstNameNoTooltip], nên xem qua điều này."

  learning_scholarship.5003.t:0 "$bibliomancy_chain_header$ Thư Bói"
  learning_scholarship.5003.desc:0 "Chư hầu của ta, [bibliomancy_antagonist.GetName], đã âm thầm hoài nghi năng lực của ta suốt nhiều năm. Tuy nhiên gần đây, quản gia của ta báo rằng [bibliomancy_antagonist.GetSheHe] đã bắt đầu công khai chỉ trích quyền cai trị của ta. [bibliomancy_antagonist.GetSheHe|U] có ảnh hưởng lớn với các chư hầu khác và hoàn toàn có thể khiến cuộc sống của ta trở nên khó khăn.\n\nLiệu đoạn văn từ [sacred_text.GetName] đã tiên đoán điều này chăng? Nỗi sợ là kẻ hủy diệt tâm trí..."
  learning_scholarship.5003.a:0 "Ta sẽ đối mặt với nỗi sợ của mình."
  learning_scholarship.5003.a.tt:0 "Ta tranh luận với [bibliomancy_antagonist.GetName] trước công chúng"
  learning_scholarship.5003.b:0 "Một cách tiếp cận tinh tế sẽ tốt hơn."
  learning_scholarship.5003.b.tt:0 "Ta đưa ra đề nghị hòa giải chính thức với [bibliomancy_antagonist.GetName]"
  learning_scholarship.5003.c:0 "Chuyện này để sau hãy bàn."
  learning_scholarship.5003.vassal.tt:0 "Mọi chư hầu"

  learning_scholarship.5003.a.success:0 "Ngươi thắng cuộc tranh luận với chư hầu"
  learning_scholarship.5003.a.failure:0 "Ngươi thua cuộc tranh luận với chư hầu"
  learning_scholarship.5003.b.success:0 "Ngươi thành công trong việc xoa dịu chư hầu"
  learning_scholarship.5003.b.failure:0 "Ngươi thất bại trong việc xoa dịu chư hầu"

  learning_scholarship.5004.t:0 "$bibliomancy_chain_header$ Đoạn Văn Đáng Lo"
  learning_scholarship.5004.desc:0 "Dù cố gắng thế nào, ta vẫn không thể hiểu nổi đoạn văn này trong [sacred_text.GetName], và nó đang ám ảnh tâm trí ta!\n\nNỗi sợ là kẻ hủy diệt tâm trí... Điều đó có thể nghĩa là gì? Ta nên sợ điều gì? #EMP Ta đã bỏ sót điều gì#!?\n\nCó lẽ ai đó khác có thể giúp làm sáng tỏ điều này."
  learning_scholarship.5004.a:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstNameNoTooltip] chắc sẽ biết câu trả lời."
  learning_scholarship.5004.b:0 "[ROOT.Char.Custom('GetCourtier')] của ta, [target_courtier.GetTitledFirstNameNoTooltip], sẽ giúp ta."
  learning_scholarship.5004.c:0 "Ta bỏ cuộc."
  learning_scholarship.5004.a.success:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] làm sáng tỏ đoạn văn"
  learning_scholarship.5004.a.failure:0 "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] không hiểu đoạn văn"
  learning_scholarship.5004.b.success:0 "[target_courtier.GetFirstNameNoTooltip] làm sáng tỏ đoạn văn"
  learning_scholarship.5004.b.failure:0 "[target_courtier.GetFirstNameNoTooltip] không hiểu đoạn văn"

  learning_scholarship.5005.t:0 "$bibliomancy_chain_header$ Không Còn Gì Phải Sợ"
  learning_scholarship.5005.desc:0 "Cuối cùng ta đã giải được đoạn văn bí ẩn trong [sacred_text.GetName], và cảm thấy mình trở nên khôn ngoan hơn nhờ điều đó. Nhờ người thương nhân kia, những sợi chỉ của số mệnh bỗng hiện ra rõ ràng hơn trước mắt ta.\n\nCó thể nỗi sợ là kẻ hủy diệt tâm trí, nhưng ta đã đối mặt với nỗi sợ của mình."
  learning_scholarship.5005.a:0 "Không còn sợ hãi, ta chỉ chết một lần."

  learning_scholarship.5006.t:0 "$bibliomancy_chain_header$ Sự Hoang Tưởng Lớn Dần"
  learning_scholarship.5006.desc:0 "Sau nhiều ngày nghiền ngẫm đoạn văn khó hiểu và rắc rối này, cuối cùng ta đã bỏ cuộc. Ta hoàn toàn không biết nó có nghĩa gì, và toàn bộ chuyện này khiến ta lạnh sống lưng.\n\nĐiều gì sẽ xảy ra đây? Chẳng lẽ ta phải sống trong nỗi sợ #EMP mãi mãi#! sao?"
  learning_scholarship.5006.a:0 "Nỗi sợ là cái chết nhỏ dẫn đến sự hủy diệt hoàn toàn."

  learning_scholarship_paranoid_trait.tt:0 "Ngươi có được đặc tính này vì không thể hiểu được đoạn văn trong [sacred_text.GetName]"
  learning_scholarship_paranoid_trait_possible:0 "Ngươi có thể nhận được [trait|E] [GetTrait('paranoid').GetName( GetNullCharacter )]"

# The Man of Few Letters by Jason Cantalini
  learning_scholarship.6000.t:0 "[illiterate.GetWomanMan|U] Ít Chữ"

  learning_scholarship.6000.desc:0 "Có vẻ như, bất chấp mọi nỗ lực của [teacher.Custom2('HerHisCharacterIntroduction',illiterate)], [illiterate.GetName] vẫn mù chữ chẳng khác gì một kẻ ngốc làng.\n\n"Ôi [ROOT.Char.GetTitleTierName] thông thái và sáng suốt nhất," [teacher.GetFirstNameNoTooltip] nịnh nọt. "Làm sao ta có thể truyền cảm hứng để chủ nhân của ta học đọc đây?""
  learning_scholarship.6000.willing_pupil:0 "\n\n[teacher.GetSheHe|U] thở dài đầy bực bội.\n\n"[illiterate.GetTitleAsNameNoTooltip] sẽ không dành [illiterate.GetHerselfHimself] hàng giờ học hành chỉ vì chuyện đọc sách...""
  learning_scholarship.6000.holy_book_insult:0 "\n\n[teacher.GetSheHe|U] do dự, rồi lẩm bẩm:\n\n"Những gì [illiterate.GetTitleAsNameNoTooltip] nói sau khi vật lộn đọc những dòng thiêng liêng đầu tiên của [illiterate.GetFaith.ReligiousText]... chẳng hề thiêng liêng #EMP cũng chẳng#! khai sáng...""
  learning_scholarship.6000.poetry_insult:0 "\n\nNgười thầy nhăn mặt.\n\n"Những gì [illiterate.GetTitledFirstNameNoTooltip] nói sau khi khổ sở đọc qua những vần thơ tao nhã nhất của [illiterate.GetCulture.GetNameNoTooltip]... chẳng hề tao nhã #EMP cũng chẳng#! khai sáng...""
  learning_scholarship.6000.very_willing_pupil:0 "\n\n[teacher.GetSheHe|U] ra hiệu về kho tri thức mà ta tích lũy.\n\n"[illiterate.GetTitleTierName] lo sợ rằng dù có vật lộn đọc qua cả nghìn dòng chữ cũng sẽ không bao giờ đạt được trí tuệ như của ngài.""

