l_english:
# Your realm priest asks for books, by Linnéa Thimrén
  learning_theology.1301.t:0 "Văn Thư Được Khao Khát"
  learning_theology.1301.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiến đến chỗ ta với vẻ khẩn trương.\n\n"
  learning_theology.1301.desc_regula_pastoralis:0 ""Một thương nhân địa phương có một bản sao của cuốn Regula Pastoralis đầy ảnh hưởng nhưng từ chối bán nó cho ta."
  learning_theology.1301.desc:0 ""Một thương nhân địa phương có một bản sao của cuốn The Compendious Book on Calculation by Completion and Balancing nhưng từ chối bán nó cho ta."
  learning_theology.1301.desc_ending:0 "Nếu ngài khiến hắn nhận ra sai lầm của mình, ta sẽ mang ơn ngài!"" 
  learning_theology.1301.a:0 "Ta sẽ đảm bảo cuốn sách đó đến tay ngươi."
  learning_theology.1301.b:0 "Hm, cuốn sách này nghe có vẻ thú vị..."
  learning_theology.1301.c:0 "Nghe như đây là vấn đề của #EMP chính ngươi#!."

# Flatter your court chaplain with some bible verses, by Mathilda Bjarnehed
  learning_theology.2020.t:0 "Sức Mạnh của [ROOT.Char.GetFaith.ReligiousText|U]"
  learning_theology.2020.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] thường trích dẫn các đoạn từ [ROOT.Char.GetFaith.ReligiousText] về những đức hạnh thiêng liêng. Ta nên chứng minh rằng mình đã chú ý lắng nghe bằng cách trích dẫn một đoạn của riêng ta — tốt nhất là đoạn nào đó ca ngợi tính cách của [court_chaplain.GetHerHis].\n\nTa sẽ ghi nhớ và đọc lại một đoạn về..."
  learning_theology.2020.brave:0 "...lòng dũng cảm."
  learning_theology.2020.just:0 "...sự công bằng."
  learning_theology.2020.temperate:0 "...sự tiết độ."
  learning_theology.2020.chaste:0 "...sự trinh khiết."
  learning_theology.2020.compassionate:0 "...lòng trắc ẩn."
  learning_theology.2020.honest:0 "...sự trung thực."
  learning_theology.2020.forgiving:0 "...sự tha thứ."
  learning_theology.2020.wrathful:0 "...sự hung nộ."
  learning_theology.2020.vengeful:0 "...tính báo thù."
  learning_theology.2020.content:0 "...sự mãn nguyện."
  learning_theology.2020.patient:0 "...sự kiên nhẫn."
  learning_theology.2020.calm:0 "...sự điềm tĩnh."
  learning_theology.2020.humble:0 "...sự khiêm nhường."
  learning_theology.2020.diligent:0 "...sự siêng năng."
  learning_theology.2020.generous:0 "...sự hào phóng."
  learning_theology.2020.greedy:0 "...của cải."
  learning_theology.2020.lustful:0 "...dục vọng."
  learning_theology.2020.ambitious:0 "...tham vọng."
  learning_theology.2020.gluttonous:0 "...một khẩu vị khỏe mạnh."

  learning_theology.2020.success.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] cảm thấy được tâng bốc"
  learning_theology.2020.neutral.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] cảm thấy hài lòng"
  learning_theology.2020.failure.desc:0 "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] nghĩ rằng ta đang chế nhạo [court_chaplain.GetHerHim]"

  learning_theology.2021.desc:0 "Ta chắc rằng [court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] đã từng nói điều gì đó về đức hạnh của việc trở nên [SCOPE.Custom('virtue_choice')]. Ta không thể nhớ chính xác lời của ông ta, nên đành cho phép bản thân sáng tạo đôi chút.\n\nThật không may, vị [court_chaplain.GetCouncilTitle|U] này khá bảo thủ. "Ngươi đang nói gì vậy?" [court_chaplain.GetSheHe] khinh khỉnh. "Đó đâu phải là lời của [ROOT.Char.GetFaith.HighGodName]!"" 
  learning_theology.2021.a:0 "Có lẽ ta nên đọc [ROOT.Char.GetFaith.ReligiousText] thường xuyên hơn..."

  learning_theology.3002.t:0 "Tuổi Đời của Thế Giới"
  learning_theology.3002.desc:0 "Ta đã nghiên cứu các văn bản tôn giáo cổ và các trước tác của học giả, và tất cả dường như đều đồng ý rằng [ROOT.Char.Custom('WorldDeadline')]. Theo tính toán của ta thì chưa đầy một thế kỷ nữa.\n\nTuy nhiên, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))] của ta, [chaplain.GetTitledFirstName], khuyên ta nên giữ điều đó cho riêng mình. "Hãy để việc này cho các [ROOT.Char.GetFaith.AltPriestTermPlural] và tránh gây hoảng loạn. Nếu tính toán của ngài sai thì sao?""
  learning_theology.3002.a:0 "Mọi người đều xứng đáng biết sự thật!"
  learning_theology.3002.b:0 "Một ý kiến hợp lý, [chaplain.GetFirstNameNoTooltip]."
  learning_theology.3002.c:0 "Ta nên tham khảo thêm các [ROOT.Char.GetFaith.PriestNeuterPlural]."

  learning_theology.3003.t:0 "Ngắm Nhìn Những Vì Sao"
  learning_theology.3003.desc:0 "Từ tất cả những buổi tối quan sát các vì sao, ta đã tận mắt thấy điều mà trước đây chỉ từng nghe nói.\n\nCác ngôi sao di chuyển với tốc độ khác nhau, và đổi hướng vào những thời điểm khác nhau, nhưng dường như theo từng nhóm lớn, tùy thuộc vào thiên cầu mà chúng thuộc về. Quả thật, với những phép tính đúng đắn, người ta thậm chí còn có thể dự đoán chuyển động của chúng.\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))] của ta tất nhiên không tán thành. "Hãy để bầu trời yên như vậy. Thiên giới là thứ dành cho các [ROOT.Char.GetFaith.AltPriestTermPlural] hiểu biết.""
  learning_theology.3003.a:0 "Ta sẽ tìm câu trả lời của mình trên thiên không."
  learning_theology.3003.b:0 "Ngươi nói đúng, ta nên tập trung vào những việc trần thế."

 #Worship in the same church (theology friend), by Linnéa Thimrén
  learning_theology.3011.t:0 "Lời Cầu Nguyện Chung"
  learning_theology.3011.desc_friend:0 "Rời khỏi [ROOT.Char.GetFaith.HouseOfWorship] tại [temple_county.GetName], ta và [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))] của ta là [believer.GetTitledFirstName] tình cờ đứng cùng vài thương nhân địa phương."
  learning_theology.3011.desc:0 "Rời khỏi [ROOT.Char.GetFaith.HouseOfWorship] tại [temple_county.GetName], ta tình cờ đứng cùng vài thương nhân địa phương, cũng như [believer.GetTitledFirstName]."
  learning_theology.3011.ending:0 "Họ đang ở giữa một cuộc thảo luận về thần học và của cải thế gian.\n\n"Ta #EMP sẽ#! đầu tư vào [ROOT.Char.GetFaith.HouseOfWorship], nhưng làm sao ta biết đó có phải là ý muốn của [ROOT.Char.GetFaith.WealthGodNamePossessive] hay không?"" 
  learning_theology.3011.a_friend:0 "Chúng ta sẽ thuyết phục họ rằng [ROOT.Char.GetFaith.WealthGodName] đã ban dấu hiệu!"
  learning_theology.3011.a:0 "Hãy giúp ta thuyết phục họ, [believer.GetTitledFirstNameNoTooltip]!"
  learning_theology.3011.a.success:0 "Các thương nhân bị thuyết phục"
  learning_theology.3011.a.failure:0 "[ROOT.Char.GetFaith.HouseOfWorship] không nhận được một đồng nào"
  learning_theology.3011.b:0 "Ta biết nơi khác vàng của các ngươi sẽ hữu ích hơn...!"

 #Send fan mail to religious head, by Linnéa Thimrén
  learning_theology.3021.t:0 "Thánh Thư"
  learning_theology.3021.desc_opening:0 "Những nỗ lực gần đây của ta trong lĩnh vực thần học khiến ta càng trân trọng hơn những đại diện của [ROOT.Char.GetFaith.HighGodNamePossessive] trên trần thế. Cố gắng bày tỏ những cảm xúc đó, ta sẽ viết một bức thư gửi đến [compliment_receiver.GetTitleAsName], [compliment_receiver.GetFirstName].\n\n"
  learning_theology.3021.desc_friend:0 "Ta ngồi xuống cùng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))] của ta, [believer.GetTitledFirstName],"
  learning_theology.3021.desc:0 "Ta ngồi xuống cùng một người chép sách, "
  learning_theology.3021.desc_christian:0 "và cùng nhau chúng ta soạn một bức thư tuyệt vời nêu bật sự Thánh Thiêng của [compliment_receiver.GetHerHis|U]..."
  learning_theology.3021.desc_other:0 "và cùng nhau, chúng ta viết nên một lá thư thật lộng lẫy nhằm làm nổi bật [compliment_receiver.GetHerHis]..."
  learning_theology.3021.success.tt:0 "Theo quyết định của [believer.GetTitledFirstNameNoTooltip]:"
  learning_theology.3021.b:0 "Chỉ có ngài là tối cao, [ROOT.Char.GetFaith.HighGodName|U]!"

  learning_theology.3022.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
  learning_theology.3022.desc:0 "Bức thư của ngươi thật đáng trân trọng! Sự thấu hiểu của ngươi về lĩnh vực của [ROOT.Char.GetFaith.HighGodName|U] cũng như bản chất con người thật đáng kinh ngạc."
  learning_theology.3022.a:0 "Ca ngợi [ROOT.Char.GetFaith.HighGodNameAlternate]!"

  learning_theology.3023.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
  learning_theology.3023.desc:0 "Ta ấn tượng với sự hiểu biết của ngươi về tôn giáo của chúng ta, nhưng ít ấn tượng hơn với sự hiểu biết của ngươi về đồng loại của mình."
  learning_theology.3023.a:0 "Vậy cũng đành vậy."

  learning_theology.3024.opening:0 "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
  learning_theology.3024.desc:0 "Những lời khoa trương rỗng tuếch của ngươi với tư cách một [ROOT.Char.GetWomanMan] của [ROOT.Char.GetFaith.HighGodName] không thể đánh lừa ta, và cái nhìn mù mờ của ngươi về trái tim con người đã phản bội chính ngươi!"
  learning_theology.3024.a:0 "Chết tiệt...!"

# Deal with county of different faith, by Linnéa Thimrén
  learning_theology.3031.t:0 "Khác Biệt Đức Tin"
  learning_theology.3031.desc_opening:0 "Ở [county.GetName] người dân tin theo [county.GetProvince.GetCounty.GetFaith.GetNameNoTooltip].\n\n"
  learning_theology.3031.desc_bishop:0 "[bishop.GetCouncilTitle|U] [bishop.GetFirstName] lên án điều đó là dị giáo, nhưng người dân lại mong được thấu hiểu..."
  learning_theology.3031.desc:0 "Nhiều người lên án đó là dị giáo, nhưng người dân lại mong được thấu hiểu..."
  learning_theology.3031.a:0 "Họ thờ phụng thế nào không phải việc của ta."
  learning_theology.3031.b:0 "Họ #EMP sẽ#! cầu nguyện với [ROOT.Char.GetFaith.PantheonTerm]!"
  learning_theology.3031.b_confucian: "Họ sẽ đi theo chính đạo!"
  learning_theology.3031.b_tt:1 "Tăng tiến độ nhiệm vụ hội đồng $task_conversion$"
  learning_theology.3031.b_tt2:0 "Việc Cải Đạo Đức Tin tại [county.GetNameNoTooltip] sẽ dễ dàng hơn trong 30 năm"

 # Study Mysticism, by Petter Vilberg
  learning_theology.3041.t:0 "Tri Thức Huyền Bí"
  learning_theology.3041.desc:0 "Ta đã nghe kể rằng các [ROOT.Char.GetFaith.DevoteeNeuterPlural] đôi khi rơi vào trạng thái xuất thần và khải tượng cực lạc để giao cảm với [ROOT.Char.GetFaith.HighGodName].\n\nLiệu ta cũng có thể đạt được dạng kết nối thần thánh này không?"
  learning_theology.3041.a:0 "Ta tự hỏi điều gì sẽ xảy ra nếu bắt chước các nghi thức của họ."
  learning_theology.3041.a.tt:0 "Ngươi thử nghiệm các nghi thức huyền bí"
  learning_theology.3041.b:0 "Các văn bản khác nói gì?"
  learning_theology.3041.b.tt:0 "Ngươi cố gắng tìm hiểu thêm về nghi thức qua sách vở"

  learning_theology.3042.desc:0 "Bị khóa trong một căn phòng, những loại bột lạ trên ngọn lửa cháy tỏa ra sức nóng, khói và mùi nồng nặc khi ta cố cảm nhận những thứ nằm ngoài thế giới giác quan.\n\nTa không biết đã bao lâu trôi qua trước khi những khải tượng kỳ lạ, khó hiểu của ánh sáng và âm thanh dập dềnh xuất hiện. Đó là trí tưởng tượng của ta, hay một thoáng nhìn về thần thánh? Liệu có cách nào biết được không?"
  learning_theology.3042.a:0 "Ta cần thử lại xem có gì khác không!"
  learning_theology.3042.a.tt:0 "Ngươi tiếp tục thử nghiệm"
  learning_theology.3042.b:0 "Thú vị đấy. Ta sẽ ghi chép lại phát hiện của mình cho tương lai."

  learning_theology.3043.desc:0 "Càng thử nghiệm nhiều, ta càng nắm bắt rõ ràng hơn. Như thể giờ đây ta có thể triệu gọi sự hiện diện mà mình cảm nhận khi bắt đầu nghi thức nhỏ của mình.\n\nNó mang lại sự ổn định và an ủi khi hỗn loạn của thế giới xoáy quanh ta."
  learning_theology.3043.a:0 "Đây chính là điều ta tìm kiếm!"
  learning_theology.3043.b:0 "Chẳng có gì thần thánh cả — nhưng rất thư giãn!"

  learning_theology.3044.desc:0 "Ta càng đào sâu vào các văn bản cổ, ta càng khám phá nhiều điều. Liệu những nghi thức bí ẩn của các [ROOT.Char.GetFaith.DevoteeNeuterPlural] cổ đại có còn xuất hiện trước cả [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]?\n\nCó vẻ như ta đã tình cờ phát hiện ra điều gì đó đáng kinh ngạc."
  learning_theology.3044.a:0 "Điều này dạy ta rất nhiều về đức tin của mình!"
  learning_theology.3044.b:0 "Có lẽ cuối cùng ta cũng nên thử nghiệm một chút..."

  learning_theology.3045.desc:0 "Thật bực bội! Dù ta làm gì, ta cũng không thể nắm lại cảm giác từ những thử nghiệm huyền bí đầu tiên.\n\nCảm giác rằng #EMP có thứ gì đó#! ở đó, ngay ngoài tầm với, đã biến mất hoàn toàn, dù ta làm gì!"
  learning_theology.3045.a:0 "Ta phải lấy lại cảm giác đó!"
  learning_theology.3045.b:0 "Một lời cầu nguyện là đủ để ta giao cảm với [ROOT.Char.GetFaith.HighGodNameAlternate]."

  learning_theology.3046.desc:0 "Ta đã tìm kiếm tri thức và trải nghiệm huyền bí quá lâu rồi, vậy mà... chẳng có gì! Câu trả lời duy nhất còn lại là quay về từ đầu và tái tạo hoàn hảo điều kiện của thí nghiệm ban đầu.\n\nTa cần giao cảm với thần linh. Phải chăng ta đang bị cố tình phớt lờ?!"
  learning_theology.3046.a:0 "Ta phải tìm ra câu trả lời!"
  learning_theology.3046.a.success:0 "Một thí nghiệm thành công"
  learning_theology.3046.a.success.tt:1 "Ngươi có thể nhận được [GetTrait('lifestyle_mystic').GetName( GetPlayer )]"
  learning_theology.3046.a.failure:0 "Vẫn không có gì!"
  learning_theology.3046.a.failure.tt:0 "Cuộc truy cầu khiến ngươi phát điên"
  learning_theology.3046.b:0 "Ta đang làm gì vậy... Đã đến lúc từ bỏ sự ngu ngốc này."

  learning_theology.3047.desc:0 "Ta không cần những nghi thức cổ xưa để giao cảm với thần linh. Thần linh luôn nói chuyện với ta. Ta nghe thấy. Ta không có gì phải lo lắng, cũng chẳng cần tìm kiếm gì nữa. Tất cả đều ở ngay đây với ta, mỗi sáng, mỗi chiều, mỗi đêm.\n\nNgài nói với ta, và chỉ với riêng ta!"
  learning_theology.3047.a:0 "[ROOT.Char.GetFaith.HighGodName] đã chọn ta! Ta là kẻ được chọn!"

# Passion Play fanfiction drama, by James Beaumont
  learning_theology.3051.t:0 "Vở Kịch [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] tại [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
  learning_theology.3051.desc.intro:1 "Ta được báo rằng [passion_playwright.GetName], một nhà soạn kịch [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] nổi tiếng, dự định trình diễn tác phẩm của [passion_playwright.GetHerHis] mang tên:"
  learning_theology.3051.passion:0 "Cuộc Khổ Nạn của [ROOT.Char.GetFaith.random_GoodGodNames]"
  learning_theology.3051.arabian_nights:0 "2000 Đêm [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), ROOT.Char.GetCulture.GetCollectiveNounNoTooltip, ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip ) ]"
  learning_theology.3051.inferno:0 "Địa Ngục của [ROOT.Char.GetFaith.random_EvilGodNames]"
  learning_theology.3051.my_immortal:0 "Người Bất Tử [passion_playwright.GetRandomPositiveTrait] của Ta"
  learning_theology.3051.desc.passion:0 ""$learning_theology.3051.passion$.""
  learning_theology.3051.desc.arabian_nights:0 ""$learning_theology.3051.arabian_nights$.""
  learning_theology.3051.desc.inferno:0 ""$learning_theology.3051.inferno$.""
  learning_theology.3051.desc.my_immortal:0 ""$learning_theology.3051.my_immortal$.""
  learning_theology.3051.desc.outro:0 "\n\nGiá vé khá đắt, nhưng đây có lẽ là cơ hội hiếm có trong đời để tận mắt chứng kiến một vở kịch của [passion_playwright.GetNameNoTooltip]!"
  learning_theology.3051.a:0 "Một đêm đạo hạnh tại nhà hát!"
  learning_theology.3051.b:0 "Ta sẽ không biến công trình của [ROOT.Char.GetFaith.CreatorName] thành trò tiêu khiển."
  learning_theology.3052.desc: "Khi ta xem vở kịch diễn ra trước mắt, nhanh chóng rõ ràng vì sao [passion_playwright.GetName] nổi tiếng như một thiên tài văn chương.\n\nVăn từ, diễn xuất — tất cả khiến ta cảm thấy như đang chứng kiến những sự kiện trong [ROOT.Char.GetFaith.ReligiousText] diễn ra trước mắt — như thể chính ta đang tận mắt nhìn thấy công trình của [ROOT.Char.GetFaith.CreatorName]!\n\nKhi vở kịch kết thúc, ta thấy mình ở riêng với [passion_playwright.GetNameNoTooltip]."
  learning_theology.3052.a:0 "Ngươi phải dạy ta cách diễn giải [ROOT.Char.GetFaith.ReligiousText] như ngươi!"
  learning_theology.3052.b:0 "Ta có thể viết hay hơn thế này!"
  learning_theology.3053.desc:1 "Ta xem vở kịch diễn ra trước mắt và không nghi ngờ gì nữa — nó hoàn toàn là rác rưởi. Những gì ta vừa chứng kiến thậm chí không xứng được gọi là văn chương.\n\nCâu chuyện kể về [ROOT.Char.GetCapitalLocation.Custom('GetRandomRegionalWood')|U] [ROOT.Char.Custom('GetRandomRegionalBird')|U]way, một học giả trẻ nghiên cứu huyền thuật và phù thủy [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip], đồng thời theo đuổi hết người tình này đến người tình khác trong giới học giả của [passion_playwright.GetHerHis].\n\nVở kịch hầu như chẳng liên quan gì đến [ROOT.Char.GetFaith.ReligiousText], và khán giả xung quanh ta đã bắt đầu chế giễu và la ó trước lối viết tồi tệ của [passion_playwright.GetNamePossessive]."
  learning_theology.3053.a:0 "Boo!"
  learning_theology.3053.b:0 "Ta sẽ viết vở kịch của riêng mình!"
  learning_theology.3053.c:0 "Những kẻ ngốc này không hiểu được thiên tài của [passion_playwright.GetFirstNamePossessiveNoTooltip]!"
  learning_theology.3054.t:0 "Vở Kịch [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] Của Riêng Ta"
  learning_theology.3054.desc.intro: "Đã khá lâu kể từ khi ta thề sẽ vượt qua tác phẩm tầm thường của [passion_playwright.GetName], và khi mực của các thư lại khô dần, ta chiêm ngưỡng tác phẩm của chính mình.\n\n"
  learning_theology.3054.desc.outro:0 "là một tác phẩm xứng đáng được gọi là "kiệt tác" theo đánh giá khiêm tốn của chính ta.\n\nCâu hỏi duy nhất còn lại là ai sẽ đóng vai chính?"
  learning_theology.3054.a:0 "Chính ta cải trang, tất nhiên!"
  learning_theology.3054.b:0 "Đã đến lúc [family_actor.Custom2('RelationToMeShort', ROOT.Char)|U] tỏa sáng!"
  learning_theology.3054.c:0 "[ROOT.Char.Custom2('RelationToMeShort', random_actor)], [random_actor.GetTitledFirstNameNoTooltip], là một người quyến rũ bẩm sinh."
  learning_theology.3055.t:0 "Màn Ra Mắt Kịch Tính"
  learning_theology.3055.desc.intro.solo:0 "Ta hít một hơi sâu và chuẩn bị biểu diễn vở kịch của mình, tin chắc rằng nó sẽ hoàn hảo khi ta ở đây để truyền tải thông điệp đạo hạnh."
  learning_theology.3055.desc.intro.hired_actor:0 "Ta ngồi giữa đám đông khán giả, theo dõi [lead_actor.GetName] khi [lead_actor.GetSheHe] bắt đầu màn trình diễn kiệt tác của Ta."
  learning_theology.3055.desc.victory.solo: "\n\nHít thêm một hơi, ta đọc lời thoại hoàn hảo và khán giả xung quanh bị cuốn theo từng lời của ta. Ta khiến họ say mê bằng cách diễn giải bậc thầy những câu chuyện từ [ROOT.Char.GetFaith.ReligiousText]."
  learning_theology.3055.desc.defeat_writing.solo:0 "\n\nDù ta đọc lời thoại hoàn hảo, những gương mặt mong đợi của khán giả nhanh chóng trở nên khó chịu và bối rối."
  learning_theology.3055.desc.defeat_acting.solo: "\n\nKhi cố đọc những câu mở đầu, ta lập tức nghẹn lời và cứng nhắc vấp váp qua kịch bản, không thể nhớ chính những gì mình viết. Khán giả không tha thứ và nhanh chóng la ó, huýt sáo phản đối!"
  learning_theology.3055.desc.victory.hired_actor:0 "\n\nThật vui mừng, [lead_actor.GetSheHe] mang đến màn trình diễn xứng đáng không chỉ với tác phẩm của ta mà còn với chính [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! "
  learning_theology.3055.desc.defeat_writing.hired_actor:0 "\n\nThật kinh hoàng, dù [lead_actor.GetSheHe] đọc lời thoại đúng như ta hình dung, khán giả nhanh chóng quay sang chế giễu [lead_actor.GetHerHim], la ó dù [lead_actor.GetSheHe] đang biểu diễn xuất sắc!"
  learning_theology.3055.desc.defeat_acting.hired_actor:0 "\n\nKinh hãi thay, [lead_actor.GetSheHe] nghẹn lời và thất bại trong việc mang đến một màn trình diễn chấp nhận được. Máu trong người Ta sôi lên khi chứng kiến [lead_actor.GetHerHim] phá nát tác phẩm vĩ đại của mình, bất lực ngồi đó mà không thể ngăn cản những tiếng chế giễu từ khán giả."
  learning_theology.3055.desc.victory_outro: "\n\nKhi đám đông bùng nổ trong tràng pháo tay, ta chắc chắn rằng mình đã vượt qua chính mình và cho [passion_playwright.GetName] thấy một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] thực thụ viết kịch như thế nào!"
  learning_theology.3055.desc.defeat_outro.solo:0 "\n\nTa vẫn cố tiếp tục, hy vọng có thể lấy lại phong độ và cứu vãn buổi biểu diễn, nhưng vô ích. Trước khi ta kịp kết thúc, nhà hát đã trống ghế và ta chỉ còn lại nỗi nhục."
  learning_theology.3055.desc.defeat_outro.hired_actor:0 "\n\n[lead_actor.GetTitledFirstNameNoTooltip|U] vẫn cố tiếp tục, hy vọng vở kịch có thể cứu vãn, nhưng buổi diễn đã thất bại. Trước khi chúng ta kịp kết thúc, nhà hát đã trống ghế và ta chỉ còn lại nỗi nhục."
  learning_theology.3055.a:0 "Một đêm tuyệt vời cho các tín đồ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] khắp nơi!"
  learning_theology.3055.b:0 "Có lẽ diễn xuất không dành cho ta..."

  learning_theology.3054.a.tt:0 "Bạn sẽ cố gắng vượt qua [passion_playwright.GetName] trong một cuộc đấu bằng [diplomacy_skill] của mình."
  learning_theology.3054.b.tt:0 "[family_actor.GetName] sẽ cố gắng vượt qua [passion_playwright.GetName] trong một cuộc đấu bằng [diplomacy_skill] của bạn."
  learning_theology.3054.c.tt:0 "[random_actor.GetName] sẽ cố gắng vượt qua [passion_playwright.GetName] trong một cuộc đấu bằng [diplomacy_skill] của bạn."

# Find old text, by Linnéa Thimrén & Flavio Verna
  learning_theology_special.1001.t:0 "Ngụy Thư"
  learning_theology_special.1001.desc:0 "Sự theo đuổi tri thức không ngừng của ta đã dẫn ta đến việc phát hiện ra một văn bản cổ xưa kỳ lạ.\n\nCuốn sách này, được cho là của một nhà thần học cổ đại hiếm khi được nhắc tới trong các nguồn chính thống, đã soi sáng một số khía cạnh của [ROOT.Char.GetFaith.GetName] mà trước đây ta không hề biết là thuộc về giáo lý của đức tin."
  learning_theology_special.1001.d:0 "Chúng ta phải phục hưng những thực hành cổ xưa này."
  learning_theology_special.1001.d.success:0 "Ta thành công tích hợp những phát hiện của mình vào giáo lý [THIS.Char.GetFaith.GetAdjective] hiện tại"
  learning_theology_special.1001.d.failure:0 "Ta không thể thuyết phục phần còn lại của giới giáo sĩ"
  learning_theology_special.1001.d.failure.toast:0 "Nỗ lực tích hợp văn bản ngụy thư của ta đã thất bại"
  learning_theology_special.1001.e:0 "[vassal_pope.GetTitledFirstNameNoTooltip] phải được thông báo về chuyện này!"
  learning_theology_special.1001.e.success:0 "Ta thuyết phục được [vassal_pope.GetTitledFirstName] tích hợp phát hiện của ta vào giáo lý [THIS.Char.GetFaith.GetAdjective] hiện tại"
  learning_theology_special.1001.e.failure:0 "[vassal_pope.GetTitledFirstNameNoTooltip] từ chối chấp nhận văn bản này là xác thực"
  learning_theology_special.1001.e.failure.toast:0 "[vassal_pope.GetTitledFirstName] bác bỏ văn bản này như một trò lừa dị giáo"
  learning_theology_special.1001.a:0 "[bishop.GetTitledFirstNameNoTooltip] có thể giúp ta nghiên cứu văn bản này."
  learning_theology_special.1001.a.desc:0 "Tùy thuộc vào mức độ sùng đạo của [bishop.GetTitledFirstName]"
  learning_theology_special.1001.a.success:0 "[bishop.GetSheHe|U] sẽ giúp ta nghiên cứu"
  learning_theology_special.1001.a.success.toast:0 "[bishop.GetTitledFirstName] chúc mừng ta vì phát hiện hiếm có này"
  learning_theology_special.1001.a.failure:0 "[bishop.GetSheHe|U] sẽ cho đốt cuốn sách"
  learning_theology_special.1001.a.failure.toast:0 "[bishop.GetTitledFirstName] cảm ơn ta vì đã mang cuốn sách dị giáo này đến giàn thiêu"
  learning_theology_special.1001.b:0 "Tốt hơn ta nên nghiên cứu chuyện này trong bí mật..."
  learning_theology_special.1001.c:0 "Thứ dị giáo bẩn thỉu này nên bị thiêu rụi!"

  learning_theology_special.1002.t:0 "Giáo Lý Mới"
  learning_theology_special.1002.a.desc:0 "Bằng cách tích hợp nội dung của văn bản cổ vào các thực hành [ROOT.Char.GetFaith.GetAdjective] hiện đại, ta đã để lại một dấu ấn lịch sử lên đức tin của chúng ta, một dấu ấn mà rất ít người kế vị của ta có thể hy vọng sánh được.\n\nMột số đại diện nổi bật của giới giáo sĩ vẫn chế giễu sự thay đổi bất thường này trong giáo lý của chúng ta, nhưng nhờ tài hùng biện của ta, phần lớn các thần quyền gia có ảnh hưởng đã bị thuyết phục về tính chính đáng của cuộc cải cách."
  learning_theology_special.1002.b.desc:0 "Không hề dễ dàng khi trước hết phải thuyết phục [vassal_pope.GetTitledFirstName] về tính xác thực của văn bản, rồi sau đó là những đại diện lớn khác của đức tin [ROOT.Char.GetFaith.GetAdjective] dưới quyền [vassal_pope.GetHerHim], nhưng lòng nhiệt huyết và kiến thức thần học của ta đã mang lại chiến thắng.\n\nMột số đại diện nổi bật của giới giáo sĩ vẫn chế giễu sự thay đổi bất thường này trong giáo lý của chúng ta, nhưng phần lớn các thần quyền gia có ảnh hưởng đã bị thuyết phục về tính chính đáng của nó."
  learning_theology_special.1002.a:0 "Rõ ràng, chính [ROOT.Char.GetFaith.HighGodName] đã dẫn dắt Ta đến với cuốn sách này!"

  learning_theology_special.1003.a.desc:0 "Với tất cả trí tuệ vô biên của mình, [player_pope.GetTitledFirstName] đã khám phá ra một văn bản tôn giáo cổ đại làm thay đổi đáng kể giáo điều [ROOT.Char.GetFaith.GetAdjective].\n\nSau khi thảo luận những phát hiện của mình với các giáo sĩ quan trọng, [player_pope.GetTitleTierName] đã quyết định tích hợp nội dung của cuốn sách vào giáo lý chính thức của đức tin."
  learning_theology_special.1003.b.desc:0 "Sau quá trình nghiên cứu gian khổ và vô số giờ học thần học, [pope_liege.GetTitledFirstName] đã phát hiện ra một văn bản tôn giáo cổ đại làm thay đổi đáng kể giáo lý [ROOT.Char.GetFaith.GetAdjective].\n\nSau khi trình bày những phát hiện của [pope_liege.GetHerHis] trước [vassal_pope.GetTitledFirstName], [vassal_pope.GetTitleTierName] đã quyết định tích hợp nội dung cuốn sách vào giáo lý chính thức của đức tin."
  learning_theology_special.1003.a:0 "Vậy điều này chính xác có ý nghĩa gì đối với phần còn lại của chúng ta?"

# Learned scholar come to your court, by Linnéa Thimrén
  learning_theology_special.1101.t:0 "Bình Giải"
  learning_theology_special.1101.desc:0 ""Phúc lành đến với ngài, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tên tôi là [scholar.GetTitledFirstName]." Vị giáo sĩ Do Thái trước mặt tôi cúi chào kính trọng.\n\n"Tôi đã dành cả đời để nghiên cứu và viết các bản bình giải về Tanakh và Talmud. Có lẽ những tác phẩm và sự hướng dẫn của tôi sẽ hữu ích cho ngài trong việc nghiên cứu [ROOT.Char.GetFaith.ReligiousText].""
  learning_theology_special.1101.desc.fallback:0 ""Xin chào, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tên tôi là [scholar.GetTitledFirstName]." Vị linh mục trước mặt tôi cúi chào kính trọng.\n\n"Tôi đã dành cả đời để nghiên cứu và viết về [ROOT.Char.GetFaith.ReligiousText]. Có lẽ những tác phẩm và sự hướng dẫn của tôi sẽ hữu ích cho việc học tập của ngài.""
  learning_theology_special.1101.a:0 "Hãy cùng viết các bản bình giải về [ROOT.Char.GetFaith.ReligiousText]!"
  learning_theology_special.1101.b:0 "Ta còn những việc cấp bách hơn trong thế giới #emp thực#!."
  learning_theology_special.1101.c:0 "Ta sẽ không bao giờ chứa chấp kẻ dị giáo dưới mái nhà mình!"

  learning_theology_special.1102.desc:0 "Sau nhiều ngày lao động vất vả, chúng ta nhìn những trang bản thảo nằm rải rác trước mặt; các bản bình giải chúng ta viết ra thật toàn diện và chi tiết. Nhờ sự hướng dẫn của [scholar.GetTitledFirstNamePossessive], ta đã có một sự hiểu biết mới về [ROOT.Char.GetFaith.ReligiousText]."
  learning_theology_special.1102.desc_dead:0 "Sau nhiều ngày lao động vất vả, ta nhìn những trang bản thảo nằm rải rác trước mặt; các bản bình giải được viết ra thật toàn diện và chi tiết. Thật tiếc [scholar.GetTitledFirstName] không ở đây để thấy điều đó."
  learning_theology_special.1102.desc_ending:0 "\n\nTa tin rằng giới giáo sĩ sẽ quan tâm đến công trình mà ta đã thực hiện!"
  learning_theology_special.1102.a.success:0 "Ta thuyết phục được [scholar.GetTitledFirstNameNoTooltip] tiếp tục"
  learning_theology_special.1102.a.failure:0 "[scholar.GetTitledFirstNameNoTooltip] không bị thuyết phục"
  learning_theology_special.1102.b:0 "Tại sao ta phải chia sẻ vinh quang?"
  learning_theology_special.1102.c:0 "Tất cả là nhờ [scholar.GetFirstNameNoTooltip]!"
  learning_theology_special.1102.c.rl_desc:1 "Tùy thuộc vào mức độ danh dự của [scholar.GetTitledFirstNameNoTooltip]"
  learning_theology_special.1102.c.success:0 "[scholar.GetSheHe|U] sẽ chia sẻ vinh quang với ta"
  learning_theology_special.1102.c.failure:0 "[scholar.GetSheHe|U] sẽ nhận hết công lao"
  learning_theology_special.1102.c.success.toast:0 "[scholar.GetTitledFirstName] đã chia sẻ vinh quang với ta"
  learning_theology_special.1102.c.failure.toast:0 "[scholar.GetTitledFirstName] đã nhận hết công lao"
 
  learning_theology_special.1102.b.success:0 "Ta qua mặt [scholar.GetShortUINameNoTooltip]"
  learning_theology_special.1102.b.failure:0 "[scholar.GetShortUINameNoTooltip] vạch trần sự dối trá của ta"
  learning_theology_special.1102.d:0 "Dù sao ta cũng học được rất nhiều!"
