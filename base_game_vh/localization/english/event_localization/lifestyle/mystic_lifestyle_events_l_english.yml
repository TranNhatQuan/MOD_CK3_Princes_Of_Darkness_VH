l_english:
  mystic_lifestyle_communion_header:0 "Giao Thông Huyền Bí: "
  mystic_lifestyle.1001.t:0 "$mystic_lifestyle_communion_header$Không Hài Lòng"
  mystic_lifestyle.1001.desc:0 "Các chuẩn bị cho giao thông huyền bí của Ta đang tiến triển thì [SCOPE.sC('priest').Custom2('MyCharacterIntroduction', ROOT.Char )] tiến đến.\n\n\"Ta không nghĩ những gì ngài đang làm hoàn toàn… chính thống,\" [priest.GetSheHe] nói với Ta. \"Một [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] tốt sẽ tránh xa loại hành vi này.\""
  mystic_lifestyle.1001.a:0 "Điều này đưa Ta gần [ROOT.Char.GetFaith.HighGodName] hơn những gì ngài có thể hy vọng!"
  mystic_lifestyle.1001.b:0 "Đương nhiên. Ta đã nghĩ gì vậy nhỉ?"
  mystic_lifestyle.1001.b.flavor:0 "Nói với [priest.GetHerHim] rằng bạn nghĩ về [ROOT.Char.GetFaith.HighGodNameAlternate] chắc chắn sẽ không được lòng đâu"

  mystic_lifestyle.1002.opening:0 "[SCOPE.sC('religious_head').Custom2('AppropriateGreeting', ROOT.Char)]"
  mystic_lifestyle.1002.desc:0 "Ta được biết rằng ngài thường tham gia vào những hình thức cầu nguyện rất khác thường.\n\nTa yêu cầu ngài chấm dứt việc làm lố này, và thực hiện sám hối thích hợp cho sự hiểu lầm về đức tin của chúng ta."
  mystic_lifestyle.1002.a:0 "Ta hiểu ý muốn của [ROOT.Char.GetFaith.HighGodName] còn rõ hơn cả ngài!"

  mystic_lifestyle.1003.opening:0 "Đối với [SCOPE.sC('vassal').Custom2('RelationToMeShort', ROOT.Char )] lầm lạc của Ta"
  mystic_lifestyle.1003.desc:0 "Những thực hành kỳ lạ của ngài không được [ROOT.Char.GetFaith.PriestNeuterPlural] công nhận, và ai đó phải trách mắng ngài. Nếu Ta không làm ngay bây giờ, thì [ROOT.Char.GetFaith.HighGodName] sẽ làm.\n\nXin hãy tỉnh táo và rút lui khỏi con đường lạ lùng này. Ai biết được dị giáo hay thờ quỷ nào nó có thể dẫn tới!"
  mystic_lifestyle.1003.a:1 "Sự ngu dốt của ngài về những bí mật của [ROOT.Char.GetFaith.HighGodNamePossessive] sẽ không làm Ta chùn bước!"

  mystic_lifestyle.1004.t:0 "$mystic_lifestyle_communion_header$Tin Đồn"
  mystic_lifestyle.1004.desc:0 "Hình như những thói quen tôn giáo hơi khác thường của Ta đang thu hút ngày càng nhiều sự chú ý.\n\nĐiều đó hầu như không phải là vấn đề – họ không thể hiểu Ta đang làm gì – nhưng những lời thì thầm nói rằng Ta đang #EMP làm#! những việc kín đáo, và mọi người nên để mắt tới."
  mystic_lifestyle.1004.a:0 "Ta không quan tâm họ thì thầm gì."
  mystic_lifestyle.1004.b:0 "Nếu Ta cởi mở và thân thiện, có lẽ họ sẽ hiểu?"

  mystic_lifestyle.1005.opening:0 "Người [SCOPE.sC('vassal').Custom2('RelationToMeShort', ROOT.Char )] thân mến"
  mystic_lifestyle.1005.desc:0 "Ta không tuyên bố rằng mình hoàn toàn hiểu những thói quen và thực hành của ngài. Tuy nhiên, Ta phải khen ngợi nỗ lực rõ ràng mà ngài bỏ vào cầu nguyện.\n\nƯớc gì mọi tín đồ chân chính đều sùng đạo như ngài."
  mystic_lifestyle.1005.a:0 "Ta vui khi ngài nhận ra nỗ lực của Ta."
  mystic_lifestyle.1005.b:0 "Hãy để Ta dạy ngài cách thực hiện!"

  mystic_lifestyle.1006.t:0 "$mystic_lifestyle_communion_header$Danh Tiếng"
  mystic_lifestyle.1006.desc:0 "Với các thực hành huyền bí của Ta, hình như Ta đã có được một danh tiếng khá ấn tượng. Mọi người không biết chính xác Ta làm gì, nhưng họ biết rằng không nên chống lại Ta và tìm hiểu.\n\nThật nực cười, nhưng có lẽ cũng không hẳn là điều xấu..."
  mystic_lifestyle.1006.a:0 "Họ có thể sợ hãi tùy theo sức chịu đựng của linh hồn bé nhỏ của họ."
  mystic_lifestyle.1006.b:0 "Thề rằng Ta không gây hại sẽ khiến họ yên tâm."

  mystic_lifestyle.1007.t:0 "$mystic_lifestyle_communion_header$Điều Gì Đó Sai"
  mystic_lifestyle.1007.desc:0 "Những giao thông với thần thánh của Ta gần đây có gì đó khác lạ. Chúng không còn khiến Ta phấn khích nữa, mà thay vào đó khiến Ta yếu đi.\n\nHôm nay, Ta thậm chí không đủ sức để ngồi dậy khỏi giường."
  mystic_lifestyle.1007.a:0 "Các đầy tớ… Giúp ta…"

  mystic_lifestyle.1008.t:0 "$mystic_lifestyle_communion_header$Một Phép Màu"
  mystic_lifestyle.1008.desc:0 "Dù trong tình trạng yếu ớt, Ta vẫn làm những gì có thể để thực hiện giao thông.\n\nNó mãnh liệt hơn bao giờ hết, và sáng nay, nhìn kìa! [ROOT.Char.GetFaith.HighGodName|U] đã ban cho Ta một phép màu!"
  mystic_lifestyle.1008.a:0 "Ta đã được chữa lành!"

  mystic_lifestyle.1009.opening:0 "Người [SCOPE.sC('mystic').Custom2('RelationToMeShort', ROOT.Char )] thân mến"
  mystic_lifestyle.1009.desc:0 "Ta phải khen ngợi việc khám phá huyền bí của ngài về đức tin của chúng ta!\n\nTheo tin đồn Ta nghe được, có vẻ Ta còn một hai điều phải học thêm!"
  mystic_lifestyle.1009.a:0 "Ta sẽ vui lòng chia sẻ!"
