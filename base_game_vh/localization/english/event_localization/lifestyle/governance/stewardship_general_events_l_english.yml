 # Standard Events #
 ###################

 # Peasant mob brings someone before you, accusing them of witchcraft. By Sean Hughes 
 stewardship_general.1054.t:0 "Cáo Buộc [witch.Custom('MagicPracticeTerm')|U]"
 stewardship_general.1054.desc:0 "Những mảnh vải dính máu... lông quạ... các hợp chất có mùi lạ. Đây là bằng chứng mà nhóm dân làng từ [target_county.GetNameNoTier] trình lên Ta, để chứng minh [witch.GetFirstName] đã thực hành [witch.Custom('MagicPracticeTerm')] trong túp lều ở ngoại ô ngôi làng của họ.\n\nDân làng khẳng định những việc làm tà ác của [witch.GetHerHis] là nguyên nhân gây ra [witch.Custom('MagicSuperstitionTerm')] và đang kêu gọi Ta hành quyết [witch.GetHerHis]."
 stewardship_general.1054.a:0 "Những 'bằng chứng' này chỉ là suy đoán. Thả [witch.GetHerHim] ra."
 stewardship_general.1054.b:0 "[witch.GetSheHe|U] phải bị thiêu vì những tội ác chống lại [ROOT.Char.GetFaith.HighGodName]!"
 stewardship_general.1054.c:0 "Một [witch.Custom('MagicUserTerm')] sao? Ta có thể dùng thêm một cố vấn."
 stewardship_general.1054.d:0 "Hãy dàn dựng một cuộc hành hình công phu cho [witch.GetHerHim]..."
 stewardship_general.1054.d.flavor:0 "...nhưng thực chất bí mật đưa [witch.GetHerHim] về triều đình của ta!"

 # Visited by a Trinket Peddler, by Filippa Gannholm
 stewardship_general.2001.t:0 "Khứu Giác Kiếm Lời"
 stewardship_general.2001.desc_intro:0 "Trong lúc tản bộ thong thả, tiếng rao của một thương nhân nào đó nổi bật giữa sự náo nhiệt thường ngày của con phố.\n\n\"Kính chào, [ROOT.Char.Custom('FormOfAddressForLiege')]! Ta có một bộ sưu tập hàng hóa tuyệt vời, nếu [ROOT.Char.Custom('FormOfAddressForLiege')] có đủ tiền...\""
 stewardship_general.2001.desc:0 "\n\nQuầy hàng của người thương nhân chất đầy đủ loại trang sức và đồ lặt vặt."
 stewardship_general.2001.desc_high_skill:0 "$stewardship_general.2001.desc$ Là người sành sỏi về hàng hóa tinh xảo, vài món đồ nhỏ đã lọt vào mắt ta giữa đống đồ linh tinh."
 stewardship_general.2001.desc_steward:0 "\n\nKhi ta quan sát vô số hàng hóa trong quầy, ta nghe [helpful_councillor.GetShortUIName] lẩm bẩm: 'Những nét chạm khắc trên món kia chắc chắn là thật... và rất có giá trị!'. [helpful_councillor.GetSheHe|U] nhìn ta với nụ cười đắc ý."
 stewardship_general.2001.desc_chaplain:0 "\n\nNgười đồng hành [helpful_councillor.GetShortUIName] của Ta đột ngột dừng bước, đầu nghiêng đi và chăm chú nhìn vào thứ gì đó tại quầy hàng của thương nhân. [helpful_councillor.GetSheHe|U] cúi người, thì thầm với Ta: 'Món đồ chơi kia, đó rõ ràng là một thánh vật từ thời xa xưa. Sẽ là khôn ngoan nếu có được món bảo vật này.'"
 stewardship_general_2001_success_msg.t:0 "Mặc Cả Thành Công"
 stewardship_general_2001_failure_msg.t:0 "Mặc Cả Thất Bại"
 stewardship_general_2001_free_msg.desc:0 "Kỹ năng mặc cả của ngươi thật xuất sắc"
 stewardship_general_2001_tiny_msg.desc:0 "Kỹ năng mặc cả của ngươi tạm ổn"
 stewardship_general_2001_minor_msg.desc:0 "Kỹ năng mặc cả của ngươi khá kém"
 stewardship_general_2001_expensive_msg.desc:0 "Ngươi đã bị thương nhân qua mặt"
 stewardship_general.2001.free:0 "Ngươi có được một món hời thực sự"
 stewardship_general.2001.tiny_cost:0 "Ngươi là người đàm phán khá tốt"
 stewardship_general.2001.minor_cost:0 "Đó không phải là một thương vụ tốt"
 stewardship_general.2001.expensive_cost:0 "Người thương nhân đã qua mặt ngươi"
 stewardship_haggle_cheap_trinket_tt:0 "Ngươi chọn món đồ rẻ tiền"
 stewardship_haggle_expensive_trinket_tt:0 "Ngươi chọn món đồ đắt tiền"
 stewardship_haggle_helpful_trinket_tt:0 "Ngươi chọn món đồ được gợi ý"
 stewardship_general.2001.a:0 "Ta cảm thấy may mắn."
 stewardship_general.2001.a.ignore_help:0 "Món này chắc chắn là món hời."
 stewardship_general.2001.b:0 "Chi tiết của món đồ này khiến ta tò mò."
 stewardship_general.2001.b.ignore_help:0 "Ta tin món này sẽ mang lại lợi nhuận hơn."
 stewardship_general.2001.c.steward:0 "Ta tin vào chuyên môn của ngươi, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helpful_councillor')) ]."
 stewardship_general.2001.c.chaplain:0 "Lời của ngươi nghe rất khôn ngoan, [helpful_councillor.GetFirstNameNoTooltip]."
 stewardship_general.2001.d:0 "Chúng ta đi tiếp."
 stewardship_general.2001.d.irritable:0 "Ta đã nói #EMP không#!. Biến đi trước khi #EMP ta khiến ngươi phải biến!#!"
 stewardship_general.2001.tt:0 "Nhận được món đồ"

 stewardship_general.2002.t:1 "Một Màn Trình Diễn Ấn Tượng"
 stewardship_general.2002.t_insulting:1 "Một Màn Trình Diễn Đáng Xấu Hổ"
 stewardship_general.2002.desc.intro:0 "Khi chúng ta đi qua hai quầy hàng tiếp theo, "
 stewardship_general.2002.desc_impressed:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] mỉm cười với ta.\n\n'Phải, thật tốt! Ta cũng khó mà làm tốt hơn được.'\n\n[helpful_councillor.GetSheHe|U] liếc nhìn những món đồ ở quầy bên cạnh và nhìn ta đầy mong đợi."
 stewardship_general.2002.desc_very_impressed:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] kéo tay áo ta đầy phấn khích.\n\n'Nhân danh [ROOT.Char.GetFaith.HighGodName], đó thật là một màn trình diễn tuyệt vời! Lời lẽ thật trôi chảy! Người ta gần như không thể theo kịp những câu nói ngọt như mật trong điệu #EMP khiêu vũ#! mặc cả đó.'\n\n[helpful_councillor.GetSheHe|U] nhìn ta với vẻ ngưỡng mộ."
 stewardship_general.2002.desc_insulted:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] nhìn ta với vẻ không hài lòng.\n\n'Đó là một... màn trình diễn thú vị. Ta không chắc mục đích của chúng ta là gì, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng chắc chắn người bán đã đạt được điều họ muốn...'\n\n[helpful_councillor.GetSheHe|U] bắt đầu bước đi trước, kết thúc cuộc trò chuyện."
 stewardship_general.2002.desc_very_insulted:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] khịt mũi khó chịu.\n\n'Người kém thông minh hơn có thể cho rằng [bought_trinket.GetName] thậm chí không xứng với cái tên của nó. Nhưng #EMP ta chắc chắn#! chúng ta đã chọn đúng...'\n\n[helpful_councillor.GetSheHe|U] rõ ràng rất bực bội vì màn thể hiện tệ hại của ta."
 stewardship_general.2002.a.high_stewardship:0 "Có lẽ ta có thể dạy ngươi vài chiến lược."
 stewardship_general.2002.mentor_success:0 "Hai người trò chuyện suốt đêm về nghệ thuật mặc cả"
 stewardship_general.2002.mentor_failure:0 "[helpful_councillor.GetTitledFirstNameNoTooltip] vẫn chưa hoàn toàn bị thuyết phục"
 stewardship_general.2002.impressed:0 "Đó là một cuộc mặc cả tuyệt vời, phải không."
 stewardship_general.2002.b.high_stewardship:0 "Đó chỉ là một thử nghiệm. #EMP Ta#! đã đạt được điều mình muốn."
 stewardship_general.2002.convince_success:0 "À đúng rồi, [bought_trinket.GetName] là khoản đầu tư tốt hơn vì..."
 stewardship_general.2002.convince_failure:0 "$stewardship_general.2002.mentor_failure$"
 stewardship_general.2002.t_success:0 "Thuyết Phục Thành Công"
 stewardship_general.2002.t_failure:0 "Thuyết Phục Thất Bại"
 stewardship_general.2002.insulted:0 "Chuyện đã qua rồi."

 # Build a fish pond, by Linnéa Thimrén
 stewardship_general.5011.t:0 "Cá Chép"
 stewardship_general.5011.desc:0 "\"Nếu [ROOT.Char.Custom('FormOfAddressForLiege')] muốn một hồ cá chép, ta có thể xây cho ngài một cái tuyệt vời!\"\n\nNgười thợ trước mặt ta có hồ sơ tốt, và các cận thần của ta dường như rất hào hứng với ý tưởng này..."
 stewardship_general.5011.a:0 "Ngươi sẽ có mọi tài nguyên cần thiết!"
 stewardship_general.5011.b:0 "Đó #EMP thật sự#! là mức giá tốt nhất sao?"
 stewardship_general.5011.b.message_1:0 "Ngươi đạt được một thỏa thuận tuyệt vời"
 stewardship_general.5011.b.message_2:1 "Người thợ đã qua mặt ngươi"
 stewardship_general.5011.c:0 "Đừng phí thời gian của ta!"
 stewardship_general.5011.every_courtier:1 "Mọi [courtier|E]"

 stewardship_general.5013.t:0 "Những Quái Vật Dưới Nước"
 stewardship_general.5013.desc:1 "Khi đang dạo bước trong vườn, Ta nhận thấy [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('carp_food'))] [carp_food.GetTitledFirstName] của Ta đang ngồi trên tảng đá bên hồ cá chép. Cúi người xuống mép nước, [carp_food.GetSheHe] kéo những ngón tay xuyên qua mặt nước. Một cái bóng đang trườn dưới bề mặt..."
 stewardship_general.5013.a:0 "[carp_food.GetFirstNameNoTooltip], lùi lại! Lùi khỏi đó... KHÔNG!"

 # Catch a servant stealing from me, by Linnéa Thimrén
 stewardship_general.5041.t:0 "Kẻ Hầu Phản Bội"
 stewardship_general.5041.desc:0 "Một tên [servant_character.Custom('lowly_servant_type')] thấp hèn đã ăn cắp của cải trong triều đình của Ta!"
 stewardship_general.5041.desc_highgod:0 "Tên [servant_character.GetWomanMan] run rẩy trước mặt ta, rên rỉ về những đứa con đói khát và xin lòng thương xót nhân danh [ROOT.Char.GetFaith.HouseholdGodName]."
 stewardship_general.5041.desc_other:0 "Tên [servant_character.GetWomanMan] run rẩy trước mặt ta, rên rỉ về những đứa con đói khát và cầu xin lòng thương xót."
 stewardship_general.5041.desc_ending:0 "\n\n\"Xin ngài, thưa [ROOT.Char.GetLadyLord], tôi sẽ làm bất cứ điều gì ngài yêu cầu!\""
 stewardship_general.5041.a:0 "Cho [servant_character.GetHerHim] biết cơn đói thật sự là gì."
 stewardship_general.5041.b:0 "Tống giam [servant_character.GetHerHim]."
 stewardship_general.5041.c:0 "Ban lòng thương xót và giành lấy lòng trung thành của [servant_character.GetHerHis]."
