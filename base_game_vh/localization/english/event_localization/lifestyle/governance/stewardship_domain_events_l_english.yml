l_english:
 #################
 # Normal Events #
 #################

 # Guild Dispute, by Sean Hughes
  stewardship_domain.1041.t:0 "Tranh Chấp Nghiệp Đoàn"
  stewardship_domain.1041.desc:0 "Cả Nghiệp đoàn Thợ Rèn lẫn Nghiệp đoàn Thương Nhân tại [guild_county.GetName] đều đã cử đại diện đến gặp ta. Hai nghiệp đoàn này đã rơi vào bế tắc về việc buôn bán sắt thô trong hạt và muốn ta phân xử tranh chấp của họ.\n\nTrong bí mật, mỗi đại diện đều đã đề nghị với ta một thỏa thuận béo bở với nghiệp đoàn của họ nhằm khiến ta đứng về phía họ."
  stewardship_domain.1041.a:0 "Cả hai sẽ cùng có lợi nếu họ hợp tác với nhau."
  stewardship_domain.1041.a.success:0 "Ta khiến hai nghiệp đoàn hợp tác với nhau"
  stewardship_domain.1041.a.success.tt:0 "Các nghiệp đoàn tại [guild_county.GetNameNoTier] giờ đây hợp tác để tăng cường sản xuất vũ khí"
  stewardship_domain.1041.a.failure:0 "Ta không thể khiến các nghiệp đoàn đạt được thỏa thuận"
  stewardship_domain.1041.a.failure.tt:0 "Các nghiệp đoàn tại [guild_county.GetNameNoTier] không thể thống nhất cách xử lý việc sản xuất sắt"
  stewardship_domain.1041.b:0 "Chỉ thợ rèn mới phân biệt được sắt tốt với sắt xấu..."
  stewardship_domain.1041.b.flavor:0 "...và Nghiệp đoàn Thợ Rèn sẽ cung cấp vũ khí miễn phí cho quân lính của ta!"
  stewardship_domain.1041.c:0 "Buôn bán hiển nhiên là lĩnh vực của thương nhân..."
  stewardship_domain.1041.c.flavor:0 "...và Nghiệp đoàn Thương Nhân sẽ chia cho ta một phần lợi nhuận của họ!"
  stewardship_domain.1041.d:0 "[guild_county.GetNameNoTierNoTooltip] là #EMP của ta#!! Chỉ ta mới kiểm soát thương mại nơi đó!"

 # Domineering Guild, by Sean Hughes
  stewardship_domain.1042.t:0 "Nghiệp Đoàn Lộng Quyền"
  stewardship_domain.1042.desc:0 "[guild_county.Custom('Governance_1041_GuildType')] tại [guild_county.GetName] đã nắm giữ gần như toàn bộ việc buôn bán sắt ở nơi đây.\n\nGiờ họ lợi dụng quyền lực ấy để nâng giá hàng hóa lên mức vô lý, làm giàu cho các bậc thầy trong nghiệp đoàn nhưng lại khiến thương mại rời bỏ hạt."
  stewardship_domain.1042.a:0 "Thương lượng với họ để giảm giá."
  stewardship_domain.1042.a.success:0 "Ta khiến [guild_county.Custom('Governance_1041_GuildType')] giảm giá"
  stewardship_domain.1042.a.failure:0 "[guild_county.Custom('Governance_1041_GuildType')] từ chối giảm giá"
  stewardship_domain.1042.b:0 "Miễn là họ nộp đủ thuế cho ta..."
  stewardship_domain.1042.c:0 "Nếu họ không chịu chơi công bằng, họ sẽ không được chơi nữa!"
 
 # Granary Infestation, by Sean Hughes
  stewardship_domain.1052.t:0 "Kho Thóc Bị Phá Hoại"
  stewardship_domain.1052.desc:0 "Lũ chuột bọ đã tràn vào nhiều kho thóc tại [target_county.GetName], phá hủy số hạt giống được cất trữ. Không còn gì để gieo cho vụ mùa năm sau, những nông dân sống ở đó đã đến cầu xin ta trợ giúp.\n\nTrong hoàn cảnh tuyệt vọng như vậy, chắc chắn họ sẽ buộc phải chấp nhận bất cứ điều kiện nào ta đưa ra."
  stewardship_domain.1052.a:0 "Ta có rất nhiều lúa, miễn là họ thề trung thành với ta..."
  stewardship_domain.1052.b:0 "Hãy thương xót họ và mở kho lương của ta."
  stewardship_domain.1052.c:0 "Ra lệnh cho các [ROOT.Char.Custom('DefaultPriestTitlePlural')] ban phát bố thí cho họ."
  stewardship_domain.1052.d:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('almoner'))] của ta sẽ phân phát lúa cho họ."

 # Corrupt Tax Collector, by Sean Hughes
  stewardship_domain.1053.t:0 "Quan Thu Thuế Tham Nhũng"
  stewardship_domain.1053.desc:0 "Ta đã nhận thấy nhiều sự bất thường và thiếu sót trong sổ sách thuế của [target_county.GetNameNoTier]. Rõ ràng những sai sót này không thể chỉ là nhầm lẫn — có kẻ đã biển thủ tiền!\n\nĐáng tiếc, dấu vết của kẻ thủ phạm này quá rối rắm khiến ta khó xác định chính xác viên thu thuế nào phải chịu trách nhiệm."
  stewardship_domain.1053.a:0 "Điều tra chuyện này một cách kín đáo..."
  stewardship_domain.1053.a.success:0 "Ta phát hiện thủ phạm và đưa hắn ra công lý"
  stewardship_domain.1053.a.failure:0 "Kẻ thủ phạm vẫn thoát khỏi tay ta"
  stewardship_domain.1053.c:0 "Ta sẽ trực tiếp kiểm soát việc thu thuế tại [target_county.GetNameNoTierNoTooltip]."
  stewardship_domain.1053.d:0 "Xử tử tất cả bọn chúng rồi tuyển người thu thuế mới!"

 # Culture Clash, by Sean Hughes
  stewardship_domain.1073.t:0 "Xung Đột Văn Hóa"
  stewardship_domain.1073.desc:0 "Phần lớn dân thường sống tại [target_county.GetName] có nguồn gốc từ văn hóa [target_ruler.GetCulture.GetName]. Tự hào về truyền thống của mình, họ không hài lòng khi phải phục vụ một kẻ ngoại lai như ta trong khi người láng giềng của ta là [target_ruler.GetTitledFirstName] lại chia sẻ cùng văn hóa và lịch sử với họ."
  stewardship_domain.1073.a:0 "Hãy dạy họ sự ưu việt của văn hóa [me.GetCulture.GetNameNoTooltip]!"
  stewardship_domain.1073.a.success:0 "Dân thường chấp nhận phong tục [me.GetCulture.GetNameNoTooltip]"
  stewardship_domain.1073.a.failure:0 "Dân thường từ chối được khai hóa"
  stewardship_domain.1073.c:0 "Ta không quan tâm nếu họ giữ những truyền thống kỳ quặc đó."
  stewardship_domain.1073.c.warning:0 "Tốc độ Quảng bá Văn hóa: #N -75%#!"
  stewardship_domain.1073.d:0 "Cảm xúc của nông dân không quan trọng — ta là người cai trị của họ."

 # Reduce revolt risk by being diligent, by Linnéa Thimrén
  stewardship_domain.5031.t:0 "Một Hạt Đang Khốn Khó"
  stewardship_domain.5031.desc:0 "Đây là những thời khắc đầy biến động đối với [county.GetName]. Báo cáo liên tiếp được gửi đến, mô tả tình trạng thảm hại của khu vực, và đám nông dân đã bắt đầu thì thầm về những giải pháp #EMP khác#!..."
  stewardship_domain.5031.a:0 "Đích thân xử lý những vấn đề này."
  stewardship_domain.5031.b:0 "Tăng thuế như một hình phạt."

 # Marshland Clearing, by Petter Vilberg
  stewardship_domain.6001.t:0 "Thoát Nước"
  stewardship_domain.6001.desc:0 "Vài tháng trước, [baron.GetTitledFirstName] đã bắt đầu một nỗ lực công phu để khai khẩn vùng đầm lầy nhằm định cư ở [barony.GetNameNoTier]. Những chiếc cày hạng nặng và các con mương mới làm cho đất trở nên cứng cáp, nhưng đó là một công việc chậm chạp.\n\n[baron.GetFirstName] hiện đã viết thư cho [steward.GetCouncilTitle] của ta, để yêu cầu giảm bớt nghĩa vụ phu phen của [baron.GetHerHis]. Vì lo lắng hoàn thành các công trình trước vụ thu hoạch tiếp theo, [baron.GetSheHe] hy vọng thay vào đó sẽ tuyển mộ binh lính để làm lao động."
  stewardship_domain.6001.a:0 "Hãy lấy bao nhiêu dân thường ngươi cần, [baron.GetFirstNameNoTooltip]!"
  stewardship_domain.6001.b:0 "Toàn bộ [county.GetNameNoTierNoTooltip] cũng có thể hưởng lợi từ việc này."
  stewardship_domain.6001.c:0 "Không, chiến trường năm nay sẽ cần rất nhiều người!"

 # Forest Clearing, by Petter Vilberg
  stewardship_domain.6002.t:0 "Khai Phá"
  stewardship_domain.6002.desc:0 "Vài tháng trước, [baron.GetTitledFirstName] đã bắt đầu khai khẩn đất đai trong các khu rừng của [barony.GetNameNoTier] để chuẩn bị định cư. Cây cối bị nhổ bỏ, đường mòn được cắt tỉa, và mặt đất được san phẳng.\n\n[baron.GetFirstName] hiện đã viết thư cho [steward.GetCouncilTitle] [steward.GetFirstName], để yêu cầu giảm bớt nghĩa vụ phu phen của [baron.GetHerHis]. Vì lo lắng hoàn thành các công trình trước vụ thu hoạch tiếp theo, [baron.GetSheHe] hy vọng thay vào đó sẽ tuyển mộ binh lính để làm lao động."

 # Haggle with Masons, by Petter Vilberg
  stewardship_domain.6011.t:0 "Thỏa Thuận Với Thợ Nề"
  stewardship_domain.6011.desc:0 "Một nghiệp đoàn thợ nề đã định cư tại [county.GetName]. Có những người thợ lành nghề phục vụ trực tiếp cho ta có thể giúp vùng đất này phát triển."
  stewardship_domain.6011.a:0 "Ta sẽ thương lượng với trưởng thợ nề."
  stewardship_domain_6011_great_deal:0 "Một Thỏa Thuận Tuyệt Vời"
  stewardship_domain.6011.offer_tt:0 "Ta được đề nghị:"
  stewardship_domain_6011_fair_deal:0 "Một Thỏa Thuận Công Bằng"
  stewardship_domain_6011_bad_deal:0 "Một Thỏa Thuận Bất Lợi"
  stewardship_domain.6011.b:1 "[steward.GetTitledFirstNameNoTooltip], hãy khiến họ tuyên thệ trung thành với ta!"
  stewardship_domain.6011.c:0 "Ta cần gì họ khi ta đã có nông nô?"

  stewardship_domain.6012.desc:0 "Người đứng đầu thợ nề dường như không muốn ký kết bất kỳ thỏa thuận nào thay mặt nghiệp đoàn, cho đến khi ta chỉ ra rằng việc đó sẽ mang lại lợi ích lớn thế nào cho cả hai bên."
  stewardship_domain.6012.a:0 "Ta thậm chí còn chưa phải dùng đến lời đe dọa!"

  stewardship_domain.6013.desc:0 "Sau một buổi tiếp kiến dài, trưởng thợ nề không chịu nhượng bộ thêm.\n\n\"Với mức giá thấp hơn thế này, việc ấy không thể thực hiện.\""
  stewardship_domain.6013.a:0 "\"Vậy thì chúng ta đã đạt được thỏa thuận.\""
  stewardship_domain.6013.b:0 "Chắc chắn ta có thể tìm thợ nề rẻ hơn ở nơi khác."

  stewardship_domain.6014.desc:0 "\"Ngài đang xúc phạm ta và toàn bộ nghề nghiệp của ta, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" Trưởng thợ nề hoàn toàn không hài lòng với những đề nghị ta đưa ra. \"Thực ra giá cả đang tăng lên. Chỉ là chi phí lao động thôi, dĩ nhiên. Ta chắc rằng [ROOT.Char.GetTitleTierName] hiểu.\""
  stewardship_domain.6014.a:0 "\"Ta hiểu rất rõ.\""
  stewardship_domain.6014.b:1 "[county.GetTierAsNameNoTooltip|l] phục vụ ta, và các nghiệp đoàn cũng vậy!"

  stewardship_domain.6015.desc:1 "Trưởng thợ nề hẳn đã rất hài lòng với cuộc trò chuyện cùng [steward.GetCouncilTitle] của ta là [steward.GetTitledFirstName], bởi vì [steward.GetSheHe] đã trở về với một thỏa thuận từ nghiệp đoàn thợ nề còn vượt quá cả yêu cầu của ta."
  stewardship_domain.6015.a:0 "Ta khó có thể thương lượng tốt hơn thế!"

  stewardship_domain.6016.desc:0 "[steward.GetTitledFirstName] đã trở về với một đề nghị từ nghiệp đoàn thợ nề.\n\n\"Thần đã kiểm tra sổ sách của họ, thưa ngài. Thần không tin có thể đạt được thỏa thuận tốt hơn.\""
  stewardship_domain.6016.a:0 "Nghe có vẻ rất tốt."
  stewardship_domain.6016.b:0 "Vậy thì ta thật ngu ngốc khi cử ngươi đi, [steward.GetFirstNameNoTooltip]!"

  stewardship_domain.6017.desc:0 "\"Việc thương lượng đã không... hoàn toàn diễn ra như dự định, thưa ngài.\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('steward'))] của ta nói với vẻ áy náy. \"Tuy vậy, thần vẫn có một đề nghị, dù nghiệp đoàn thợ nề từ chối nói chuyện thêm với thần.\""
  stewardship_domain.6017.a:0 "Ta phải chấp nhận những gì bề tôi của mình đạt được."
  stewardship_domain.6017.b:0 "Vậy ta sẽ tự nói chuyện với họ! Ta sẽ ra lệnh!"


 ##################
 # Special Events #
 ##################

 # Bad harvest, by Linnéa Thimrén and Sean Hughes
  stewardship_domain_special.1001.t:0 "Mùa Gặt tại [development_county.GetNameNoTier|U]"
  stewardship_domain_special.1001.desc:0 "Đây là những thời khắc khốn khó, và vùng đất của [county_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] tại [development_county.GetNameNoTier] đã chịu thiệt hại nặng nề hơn hầu hết.\n\nHết bản báo cáo này đến bản khác được trình lên trước mặt ta, mô tả về vụ mùa thất bát, và ta bắt đầu tự hỏi liệu năm nay ta có còn nhận được phần thuế của mình từ họ hay không..."
  stewardship_domain_special.1001.a:0 "Điều tra vấn đề của hạt."
  stewardship_domain_special.1001.a.tt:0 "Số phận của [development_county.GetNameNoTier] sẽ nằm trong tay ta..."
  stewardship_domain_special.1001.b:0 "Dùng vũ lực đoạt lấy phần thuế thuộc về ta!"
  stewardship_domain_special.1001.c:0 "Đó là trách nhiệm của [county_holder.GetFirstNamePossessiveNoTooltip], không phải của ta."

  stewardship_domain_special.1002.desc:0 "Rõ ràng [development_county.GetName] gặp bất hạnh một phần do quản lý yếu kém. Đất đai không được khai khẩn đúng cách, hạt giống bị gieo sai mùa, và đồng cỏ bị chăn thả quá mức."
  stewardship_domain_special.1002.desc.repentant:1 "\n\nMột [county_holder.GetTitledFirstName] hối lỗi đứng trước mặt ta, vắt đôi bàn tay [county_holder.GetHerHis]. "Xin ngài [ROOT.Char.Custom2('RelationToMeAddress', county_holder)], hãy cho tôi một cơ hội nữa! Tôi có thể sửa chữa điều này, tôi thề đấy!""
  stewardship_domain_special.1002.desc.uncaring:0 "\n\n[county_holder.GetTitledFirstName] đứng trước mặt ta với vẻ chán nản, dường như chẳng hề quan tâm. \"Đám nông dân rồi cũng sẽ tự giải quyết thôi. Lúc nào họ chẳng làm thế. Đó chẳng phải công việc của họ sao?\""
  stewardship_domain_special.1002.desc.blaming:0 "\n\n[county_holder.GetTitledFirstName] đứng trước mặt ta với vẻ bực bội, rõ ràng đang căng thẳng. \"Sao lũ nông dân đó có thể làm hỏng chuyện đến mức này chứ? Chúng chỉ đào đất thôi mà! Đó là việc duy nhất chúng làm!\""

  stewardship_domain_special.1002.a:0 "Ta quy trách nhiệm chuyện này cho ngươi, [county_holder.GetFirstNameNoTooltip]."
  stewardship_domain_special.1002.a.success:0 "[county_holder.GetTitledFirstName] và ta đều học được từ sai lầm của [county_holder.GetHerHis]"
  stewardship_domain_special.1002.a.failure:0 "[county_holder.GetTitledFirstName] không thể khắc phục vấn đề tại [development_county.GetNameNoTier]"
  stewardship_domain_special.1002.b:0 "Ta sẽ đích thân sửa chữa việc này, bất kể phải làm gì!"
  stewardship_domain_special.1002.b.success:0 "Ta đã thành công sửa chữa các vấn đề tại [development_county.GetNameNoTier]"
  stewardship_domain_special.1002.b.failure:0 "Ta thất bại trong việc sửa chữa các vấn đề tại [development_county.GetNameNoTier]"
  stewardship_domain_special.1002.c:0 "Ngươi đã đánh mất quyền cai quản [development_county.GetNameNoTierNoTooltip]!"
  stewardship_domain_special.1002.c.tt:0 "Ta tước [development_county.GetName] khỏi [county_holder.GetTitledFirstName]"
 
  stewardship_domain_special.1003.desc:1 ""Cảm ơn ngài đã tin tưởng tôi, [ROOT.Char.Custom2('RelationToMeAddress', county_holder)]!"\n\n[county_holder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã xoay xở để giải quyết cuộc khủng hoảng mà [county_holder.GetSheHe] gặp phải. Đôi khi cách hành động tốt nhất là tin tưởng vào kỹ năng của người khác, rồi học hỏi từ họ!"
  stewardship_domain_special.1003.a:0 "Hãy kể ta nghe ngươi đã làm thế nào!"

  stewardship_domain_special.1004.desc:0 "Các báo cáo từ [development_county.GetName] ngày càng trở nên thảm hại, và chẳng mấy chốc đã rõ rằng [county_holder.GetTitledFirstName] chỉ làm tình hình tệ hơn."
  stewardship_domain_special.1004.a:0 "[county_holder.GetSheHe] là loại [county_holder.GetTitleTierName] gì vậy?!"

  stewardship_domain_special.1005.desc:0 "Khi ta nhìn thấy [development_county.GetName] thịnh vượng dưới sự chỉ dẫn của mình, ta không khỏi cảm thấy tự hào về những gì đã đạt được. Đôi khi tự mình can dự vào việc quản lý nhỏ nhặt cũng là cách tốt để học hỏi!"
  stewardship_domain_special.1005.a:0 "Kiến thức này chắc chắn sẽ hữu ích!"

  stewardship_domain_special.1006.desc:0 "Dù ta thử làm gì đi nữa, [development_county.GetName] vẫn không thể thoát khỏi khó khăn. Tình hình đã khá hơn trước, nhưng ta vẫn không biết phải giải quyết những vấn đề còn lại ra sao."
  stewardship_domain_special.1006.a:0 "Thôi vậy, không phải lúc nào ta cũng thành công..."

 # Charter fair, by Linnéa Thimrén
  stewardship_domain_special.1101.t:0 "Hội Chợ tại [county.GetNameNoTierNoTooltip|U]"
  stewardship_domain_special.1101.desc:0 "Trong [county.GetName] có một cánh đồng rất thích hợp để tổ chức một hội chợ lớn hằng năm.\n\nHai quý tộc địa phương, [local_baron.GetTitledFirstName] và [second_local_baron.GetTitledFirstName], đã thỉnh cầu ta trao cho họ đặc quyền cho phép tổ chức hội chợ dưới danh nghĩa của ta."
  stewardship_domain_special.1101.a:0 "Đặc quyền sẽ được trao cho [second_barony.Custom('BaronyTownType')] tại [second_barony.GetNameNoTierNoTooltip]."
  stewardship_domain_special.1101.all_goes_well:0 "Nếu mọi việc suôn sẻ:"
  stewardship_domain_special.1101.b:0 "[local_baron.GetFaith.HouseOfWorship] tại [barony.GetNameNoTierNoTooltip] sẽ nhận được đặc quyền."
  stewardship_domain_special.1101.c:0 "Dùng cánh đồng để chăn thả gia súc thay."

  stewardship_domain_special.1102.desc:0 "[second_local_baron.GetTitledFirstName] trình lên ta hàng hóa từ khắp nơi trên thế giới; lụa từ tận cùng Con Đường Tơ Lụa, nông sản trồng tại địa phương, những kỳ vật kỹ thuật từ phương Đông...\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta nên quảng bá loại hàng hóa nào cho hội chợ mới?\""
  stewardship_domain_special.1102.a:0 "Chúng ta sẽ nhập khẩu càng nhiều lụa càng tốt!"
  stewardship_domain_special.1102.a.tt:0 "Người dân sẽ đánh giá cao hơn nếu vùng này ổn định và thịnh vượng"
  stewardship_domain_special.1102.b:0 "Chúng ta sẽ tập trung vào nông sản địa phương!"
  stewardship_domain_special.1102.b.tt:0 "Người dân sẽ đánh giá cao hơn nếu khu vực đang hỗn loạn"
  stewardship_domain_special.1102.c:0 "Những kỳ vật công nghệ sẽ là tâm điểm!"
  stewardship_domain_special.1102.c.tt:0 "Người dân sẽ đánh giá cao hơn nếu mức phát triển trong vùng thấp"

  stewardship_domain_special.1103.desc_silk:0 "Lụa thượng hạng đã thu hút giới giàu có tại [county.GetNameNoTier] đến chợ, và nông dân cũng theo sau — cả tuần lễ tràn ngập lễ hội và thương mại!"
  stewardship_domain_special.1103.desc_crops:0 "Thực phẩm dồi dào đã thu hút nông dân đến chợ, còn những mặt hàng hạng nhất tại các quầy khiến họ quay lại — cả tuần lễ tràn ngập lễ hội và thương mại!"
  stewardship_domain_special.1103.desc_technology:0 "Những kỳ vật công nghệ khiến dân chúng mê mẩn, cùng với hàng hóa hạng nhất ở mọi quầy — cả tuần lễ tràn ngập lễ hội và thương mại!"
  stewardship_domain_special.1103.a:0 "Ta cho phép các ngươi tổ chức việc này hằng năm từ nay."

  stewardship_domain_special.1104.desc_silk:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta phải làm gì với đống lụa này đây?\"\n\nRõ ràng nhu cầu lụa trong vùng không cao, và [second_local_baron.GetTitledFirstName] phải giữ lại rất nhiều vải đắt tiền chưa bán được."
  stewardship_domain_special.1104.desc_crops:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], nông sản đang hỏng và mốc rồi, chúng ta phải làm gì với tất cả chúng?\"\n\nRõ ràng nhu cầu nông sản địa phương không cao, và [second_local_baron.GetTitledFirstName] phải giữ lại rất nhiều chưa bán được."
  stewardship_domain_special.1104.desc_technology:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta phải làm gì với những món đồ lặt vặt này?\"\n\nRõ ràng nhu cầu đối với các kỳ vật công nghệ trong vùng không cao, và [second_local_baron.GetTitledFirstName] còn lại rất nhiều hàng chưa bán."
  stewardship_domain_special.1104.a:0 "Khởi đầu đầy sóng gió, nhưng ta tin dân địa phương sẽ xoay xở được!"

  stewardship_domain_special.1105.desc:0 "[local_baron.GetTitledFirstName] trình lên ta hàng hóa từ khắp nơi; đồ tôn giáo từ các thánh địa, thực phẩm do [local_baron.GetFaith.DevoteeMalePlural] và [local_baron.GetFaith.DevoteeFemalePlural] trong vùng sản xuất, cùng những kỳ vật từ các tôn giáo ngoại lai...\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta nên quảng bá loại hàng hóa nào cho hội chợ mới?\""
  stewardship_domain_special.1105.a:0 "Chúng ta sẽ tôn vinh các vị thánh địa phương bằng cách tập trung vào đồ tôn giáo!"
  stewardship_domain_special.1105.a.tt:1 "Người dân sẽ đánh giá cao hơn nếu lòng sùng đạo của họ mạnh mẽ"
  stewardship_domain_special.1105.b:0 "Hãy mang vào càng nhiều thực phẩm càng tốt!"
  stewardship_domain_special.1105.b.tt:0 "Người dân sẽ đánh giá cao hơn nếu khu vực đang cần được hỗ trợ"
  stewardship_domain_special.1105.c:0 "Nếu ta trưng bày tôn giáo khác, chúng sẽ mất đi sự mới lạ!"
  stewardship_domain_special.1105.c.tt:1 "Người dân sẽ đánh giá cao hơn nếu lòng sùng đạo của họ yếu"

  stewardship_domain_special.1106.desc_religious_objects:0 "Những vật phẩm tôn giáo từ các thánh địa khiến dân chúng say mê và bị cuốn hút, cùng với hàng hóa hạng nhất ở mọi quầy — cả tuần lễ tràn ngập lễ hội sùng đạo và thương mại!"
  stewardship_domain_special.1106.desc_religious_food:0 "Thực phẩm do các [local_baron.GetFaith.DevoteeMalePlural] và [local_baron.GetFaith.DevoteeFemalePlural] trong vùng cung cấp bán chạy gần như hơn mọi thứ khác tại hội chợ — cả tuần lễ tràn ngập lễ hội sùng đạo và thương mại!"
  stewardship_domain_special.1106.desc_religious_other:0 "Đối mặt với các tôn giáo ngoại lai, người dân [county.GetNameNoTier] càng cầu nguyện nhiều hơn và trân trọng cộng đồng của mình — cả tuần lễ tràn ngập lễ hội sùng đạo và thương mại!"
  stewardship_domain_special.1106.a:0 "Ta cho phép các ngươi tổ chức việc này hằng năm từ nay."

  stewardship_domain_special.1107.desc_religious_objects:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta phải làm gì với những món đồ thánh này?\"\n\nRõ ràng các vật phẩm linh thiêng không thu hút tín đồ nhiều như ta mong đợi, và [local_baron.GetTitledFirstName] còn lại rất nhiều hàng chưa bán."
  stewardship_domain_special.1107.desc_religious_food:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta phải làm gì với đống thức ăn này?\"\n\nRõ ràng các món ăn do [local_baron.GetFaith.DevoteeMalePlural] và [local_baron.GetFaith.DevoteeFemalePlural] chuẩn bị lẽ ra cần chút phép màu — hầu như chẳng bán được gì."
  stewardship_domain_special.1107.desc_religious_other:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], chúng ta phải làm gì với những món đồ báng bổ này?\"\n\nCác món đồ ngoại lai chỉ khiến dân chúng ghê sợ — làm họ không muốn đến chợ. [local_baron.GetTitledFirstName] sớm được lệnh đem chúng đi đốt, nhưng thiệt hại đã xảy ra."
  stewardship_domain_special.1107.a:0 "Khởi đầu đầy sóng gió, nhưng ta tin dân địa phương sẽ xoay xở được!"


 # Building a Road chain, by Petter Vilberg
  stewardship_domain_special.1301.increase_road_progress_1:0 "#V Tiến Độ Con Đường#! tăng #P 1#!"
  stewardship_domain_special.1301.increase_road_progress_2:0 "#V Tiến Độ Con Đường#! tăng #P 2#!"
  stewardship_domain_special.1301.increase_road_quality_1:0 "#V Chất Lượng Con Đường#! tăng #P 1#!"
  stewardship_domain_special.1301.increase_road_quality_2:0 "#V Chất Lượng Con Đường#! tăng #P 2#!"
  stewardship_domain_special.1301.decrease_road_quality_1:0 "#V Chất Lượng Con Đường#! giảm #N 1#!"

  stewardship_domain_special.1301.t:0 "Con Đường"
  stewardship_domain_special.1301.steward_opening:0 "[ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] của ta, [steward.GetTitledFirstName], báo với ta"
  stewardship_domain_special.1301.no_steward_opening:0 "Các thị trưởng của ta báo với ta"
  stewardship_domain_special.1301.desc:0 "rằng [project_county.GetName] đang vô cùng cần một con đường mới để đi lại. Nhiều con đường cũ đã xuống cấp trầm trọng, thậm chí nguy hiểm!\n\nMột thường dân tên là [peasant_leader.GetTitledFirstName] đã được đề cử làm người lãnh đạo việc xây dựng này."
  stewardship_domain_special.1301.a:0 "Hãy làm cho xong việc."
  stewardship_domain_special.1301.a.peasant_leader_tt:0 "Dự án bắt đầu, do [peasant_leader.GetTitledFirstName] giám sát"
  stewardship_domain_special.1301.b:0 "Quản gia của ta sẽ xử lý việc này."
  stewardship_domain_special.1301.a.steward_tt:0 "Dự án bắt đầu, do [steward.GetTitledFirstName] giám sát"
  stewardship_domain_special.1301.c:0 "Những con đường đó đã đủ tốt cho tổ tiên ta!"
  stewardship_domain_special.1301.c.tt:0 "Vậy thì cũng đủ tốt cho chúng ta!"


  stewardship_domain_special.1311.t:0 "Con Đường: Lãnh Địa Xa Xôi"
  stewardship_domain_special.1311.desc:0 "Công việc xây đường tại [project_county.GetNameNoTier] đang tiến triển, nhưng đoạn đất hiện đang chuẩn bị lại nằm phía sau một ngọn đồi, xa cả hai ngôi làng hai bên.\n\nCả hai làng đều không muốn cung cấp nhân công, và cũng chẳng rõ ai là người sở hữu lãnh địa bên kia ngọn đồi!"
  stewardship_domain_special.1311.a:0 "Vậy thì lấy nhân công từ cả hai làng."
  stewardship_domain_special.1311.b:0 "Ta sẽ tự trả tiền cho công việc ở đó."
  stewardship_domain_special.1311.c:0 "Nếu còn tranh chấp, lãnh địa đó sẽ thuộc về ta!"

  stewardship_domain_special.1312.t:0 "Con Đường: Sử Dụng Thường Xuyên"
  stewardship_domain_special.1312.desc:0 "Ngay cả khi chưa hoàn thành, các thương nhân đã bắt đầu đi lại trên con đường mới tại [project_county.GetNameNoTier].\n\n[project_leader.GetTitledFirstName] đề xuất rằng những người sử dụng con đường nên góp phần vào việc xây dựng nó."
  stewardship_domain_special.1312.a:0 "Hoặc họ có thể góp phần vào kho bạc của ta."
  stewardship_domain_special.1312.b:0 "Ý tưởng thật mới mẻ... Ta thích!"

  stewardship_domain_special.1313.t:0 "Con Đường: Bọn Cướp"
  stewardship_domain_special.1313.desc:0 "Có vẻ như ngay cả con đường chưa hoàn thiện cũng đã có cướp đường. [project_leader.GetTitledFirstName] gặp rắc rối khi vật tư không bao giờ đến nơi, còn công nhân thì sợ rời khỏi làng. Nếu cứ thế này, con đường tại [project_county.GetNameNoTier] sẽ chẳng bao giờ hoàn thành."
  stewardship_domain_special.1313.a:0 "Bố trí lính gác dọc theo con đường."
  stewardship_domain_special.1313.b:0 "Ta không quan tâm. #EMP Hoàn. Thành. Con. Đường.#!"

  stewardship_domain_special.1314.t:0 "Con Đường: Tiếng Giày Hành Quân"
  stewardship_domain_special.1314.war:0 "Với cuộc chiến đang diễn ra, quân lính đang sử dụng những đoạn đường đã hoàn thành tại [project_county.GetNameNoTier] để hành quân nhanh hơn."
  stewardship_domain_special.1314.end:0 "\n\nVốn đã bị mài mòn và hư hại, [project_leader.GetTitledFirstName] nói rằng công nhân sẽ phải quay lại gia cố nó trước khi hoàn thành."
  stewardship_domain_special.1314.a:0 "Không đáng để bỏ công sức."
  stewardship_domain_special.1314.b:0 "Thật đáng tiếc, nhưng cần thiết."

  stewardship_domain_special.1315.t:0 "Con Đường: Tiếng Giày Hành Quân"
  stewardship_domain_special.1315.end:0 "\n\nMay mắn thay, việc sử dụng nhiều lại chính là điều cần thiết để nén chặt mặt đất! Nếu may mắn, phần lớn quân lính cũng sẽ hành quân trở lại trên con đường này."
  stewardship_domain_special.1315.a:0 "Hãy đưa họ ra tiền tuyến!"
  stewardship_domain_special.1315.b:0 "Họ sẽ hành quân theo lệnh của [project_leader.GetTitledFirstNameNoTooltip]."

  stewardship_domain_special.1316.t:0 "Con Đường: Khoản Đầu Tư"
  stewardship_domain_special.1316.desc:0 "Nhận thấy các đoạn đường đã hoàn thành vô cùng hữu ích, hội thương nhân tại [project_county.GetNameNoTier] đã quyên góp tiền để mở rộng con đường hơn nữa."
  stewardship_domain_special.1316.a:0 "Điều này sẽ giúp ích cho con đường."
  stewardship_domain_special.1316.b:0 "Điều này sẽ giúp ích cho túi tiền của ta."

  stewardship_domain_special.1317.t:0 "Con Đường: Một Quán Rượu"
  stewardship_domain_special.1317.desc:0 "Việc xây dựng đường tại [project_county.GetNameNoTier] đã bị trì hoãn. [project_leader.GetTitledFirstName] báo rằng công nhân bị một người muốn mở quán trọ giữ lại. Để xoa dịu tâm hồn họ và cả những lữ khách khác, họ đang xây một quán rượu ven đường."
  stewardship_domain_special.1317.a:0 "Dĩ nhiên nó sẽ thuộc sở hữu của vương quyền."
  stewardship_domain_special.1317.b:0 "Đưa họ trở lại làm đường!"

  stewardship_domain_special.1318.t:0 "Con Đường: Tiến Triển"
  stewardship_domain_special.1318.desc:0 "Theo [project_leader.GetTitledFirstName], công việc xây đường tại [project_county.GetNameNoTier] đang tiến triển tốt.\n\n\"Mặt đất chắc hơn và các đoạn đường bằng phẳng hơn chúng ta mong đợi, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
  stewardship_domain_special.1318.a:0 "Hãy mở rộng con đường hơn nữa!"
  stewardship_domain_special.1318.b:0 "Mọi thứ đang diễn ra đúng như ta muốn."
  stewardship_domain_special.1318.c:0 "Cơ hội hoàn hảo để cắt giảm chi phí!"

  stewardship_domain_special.1319.t:0 "Con Đường: Tinh Thần Lao Động"
  stewardship_domain_special.1319.desc:0 "Quản gia của ta trông gần như kinh ngạc. \"Thần đã kiểm tra công trình xây đường tại [project_county.GetNameNoTier], và những nông dân làm việc hiệu quả hơn nhiều so với thần nghĩ... Ngay cả thần cũng có thể học được vài điều từ họ.\""
  stewardship_domain_special.1319.a:0 "Chúng ta có thể áp dụng kiến thức này ở nơi khác không?"
  stewardship_domain_special.1319.b:0 "Học từ nông dân ư? Nghĩ thôi đã thấy ghê tởm."

  stewardship_domain_special.1320.t:0 "Con Đường: Chuyên Môn của [peasant_leader.GetTitledFirstNamePossessiveNoTooltip]"
  stewardship_domain_special.1320.desc:0 "Không thường khi một thường dân trực tiếp nói chuyện với ta, nhưng [peasant_leader.GetTitledFirstName] đang báo cáo về việc xây đường tại [project_county.GetNameNoTier].\n\n\"Kế hoạch ban đầu là cho con đường đi qua cánh đồng này, thưa ngài, nhưng thần biết loại đất ở đây. Có lẽ thân phận nông dân của thần có thể xin rằng— rằng chúng ta đổi hướng qua khu rừng gần đó?\""
  stewardship_domain_special.1320.a:0 "Ta tin vào phán đoán của ngươi."
  stewardship_domain_special.1320.b:0 "Quá xa và quá tốn kém. Làm theo kế hoạch của ta."

  stewardship_domain_special.1321.t:0 "Con Đường: Thiếu Chuyên Môn"
  stewardship_domain_special.1321.desc:0 ""Ta cứ bảo họ đi thẳng qua cánh đồng, nhưng [peasant_leader.GetTitledFirstName] lại khăng khăng chuyển hướng qua khu rừng gần đó!" [steward.GetTitledFirstName] rõ ràng đang rất bực bội về việc xây đường tại [project_county.GetNameNoTier].\n\nTuy vậy, [peasant_leader.GetTitledFirstName] vẫn kiên quyết với cách làm của [peasant_leader.GetHerHis]. "Đất ở cánh đồng không bằng phẳng và cũng không đủ chắc, thưa ngài! Con đường qua rừng sẽ tốt hơn nhiều.""
  stewardship_domain_special.1321.a:0 "Hãy nghe lời bề trên của ngươi, tên nông dân!"
  stewardship_domain_special.1321.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip] dường như hiểu rõ hơn..."

  stewardship_domain_special.1391.t:0 "Con Đường: Thiếu Người Chỉ Huy"
  stewardship_domain_special.1391.desc:0 "Khi [project_leader.GetTitledFirstName] đã rời đi, việc xây dựng con đường tại [project_county.GetNameNoTier] trở nên thiếu định hướng rõ ràng. Nếu muốn hoàn thành, phải có người khác đứng ra phụ trách."
  stewardship_domain_special.1391.a:0 "[peasant_leader.GetTitledFirstNameNoTooltip] có vẻ là người thay thế thích hợp."
  stewardship_domain_special.1391.b:0 "Đã đến lúc [steward.GetTitledFirstNameNoTooltip] tiếp quản."

  stewardship_domain_special.1392.t:0 "Con Đường: Cắt Lỗ"
  stewardship_domain_special.1392.desc:0 "Sau khi mất [project_county.GetName], việc hoàn thành con đường ở đó không còn mang lại nhiều lợi ích cho ta. Ít nhất số thuế thu cho dự án vẫn nằm trong kho bạc của ta, thay vì bị lãng phí cho con đường."
  stewardship_domain_special.1392.a:0 "Không phải mọi thứ đều mất."

  stewardship_domain_special.1396.t:0 "Điểm Cuối Con Đường"
  stewardship_domain_special.1396.desc:0 "Con đường tại [project_county.GetNameNoTier] cuối cùng cũng hoàn thành.\n\n"Nó... rất thực dụng," [project_leader.GetTitledFirstName] nói với ta."
  stewardship_domain_special.1396.a:0 "Một con đường không cần xa hoa. Như vậy là đủ."

  stewardship_domain_special.1397.desc:0 "Mạng lưới đường qua [project_county.GetNameNoTier] cuối cùng đã hoàn thành.\n\n"Con đường này sẽ đưa người dân đến nơi họ cần đến trong nhiều thập kỷ tới," [project_leader.GetTitledFirstName] nói với ta."
  stewardship_domain_special.1397.a:0 "Ta nóng lòng thu về lợi ích từ nó!"
  stewardship_domain_special.1397.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip]! Ta còn việc khác cho ngươi!"

  stewardship_domain_special.1398.desc:0 "Mạng lưới đường qua [project_county.GetNameNoTier] cuối cùng đã hoàn thành.\n\n"Những con đường này sẽ là mạch máu của hạt trong nhiều thế hệ!" [project_leader.GetTitledFirstName] tuyên bố đầy tự hào."
  stewardship_domain_special.1398.a:0 "Ta nóng lòng thu về lợi ích từ nó!"
  stewardship_domain_special.1398.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip]! Ta còn việc khác cho ngươi!"

  stewardship_domain_special.1399.desc:0 "Mạng lưới đường qua [project_county.GetNameNoTier] cuối cùng đã hoàn thành.\n\n"Đây có lẽ là những con đường tốt nhất trong toàn bộ vương quốc, thưa ngài!" [project_leader.GetTitledFirstName] tuyên bố đầy tự hào."
  stewardship_domain_special.1399.a:0 "Ta nóng lòng thu về lợi ích từ nó!"
  stewardship_domain_special.1399.b:0 "[peasant_leader.GetTitledFirstNameNoTooltip]! Ta còn việc khác cho ngươi!"

 # A Missing Village, by Petter Vilberg
  stewardship_domain_special.1401.t:0 "Một Ngôi Làng Biến Mất"
  stewardship_domain_special.1401.desc:0 "Chỉ được thắp sáng bởi một cây nến duy nhất, ngón tay ta dừng lại trên một dòng trong sổ thuế. Có điều gì đó không đúng... Chẳng mấy chốc ta bắt đầu lục lại mọi hồ sơ liên quan đến [county.GetName] mà ta có thể tìm thấy.\n\nCuối cùng, sự thật hiện ra rõ ràng. Dường như cả một ngôi làng đã biến mất khỏi sổ sách thuế!"
  stewardship_domain_special.1401.a:0 "Người thu thuế tại [county.GetNameNoTierNoTooltip] phải điều tra!"
  stewardship_domain_special.1401.a.tt:0 "Người thu thuế sẽ dẫn đầu cuộc điều tra"
  stewardship_domain_special.1401.b:0 "Ta sẽ đích thân đến ngôi làng."
  stewardship_domain_special.1401.b.tt:0 "Ta tự mình tiến hành điều tra"
  stewardship_domain_special.1401.c:0 "Làng mạc biến mất là chuyện thường, bỏ qua đi."

  stewardship_domain_special.1411.desc:0 "[collector.GetTitledFirstName], người thu thuế của [county.GetName], đã cố hết sức thuyết phục ta rằng ta phải tận mắt đến xem ngôi làng "biến mất" này.\n\nSau nhiều ngày di chuyển, cuối cùng ta cũng cưỡi ngựa vào làng. Nó trông chẳng khác gì một khu định cư nghèo nàn bình thường. Tuy vậy, [collector.GetTitledFirstName] vẫn khăng khăng. "[ROOT.Char.Custom('FormOfAddressForLiege')|U], xin hãy cho thần dẫn ngài đi xem quanh đây. Đây là quê hương của thần.""
  stewardship_domain_special.1411.a:0 "Được thôi, dẫn ta đi xem."
  stewardship_domain_special.1411.a.tt:0 "[collector.GetTitledFirstName] dẫn ta đi quanh làng của [collector.GetHerHis]"
  stewardship_domain_special.1411.b:0 "Ngươi đã lãng phí quá nhiều thời gian của ta rồi!"
  stewardship_domain_special.1411.b.tt:0 "Tại sao ta lại đến đây chứ!?"

  stewardship_domain_special.1412.desc:0 "Khi đôi chân của [collector.GetTitledFirstNamePossessive] đung đưa phía trên bãi cỏ làng, ta chuẩn bị rời đi cùng lính canh. Chúng ta vừa bỏ lại những ngôi nhà đầu tiên phía sau thì một cô bé chạy đến bên cạnh ngựa của ta.\n\n"Ôi [ROOT.Char.GetLadyLord] kính yêu, chúng tôi sẽ ra sao? Không ai trong chúng tôi có thể trả khoản phạt mà ngài yêu cầu.""
  stewardship_domain_special.1412.a:0 "Người thu thuế năm sau sẽ giải quyết món nợ của các ngươi."
  stewardship_domain_special.1412.b:0 "Ta sẽ thu đủ món nợ của các ngươi. Ngay bây giờ."
  stewardship_domain_special.1412.b.flavor:0 "Tịch thu mọi thứ có giá trị, rồi đốt phần còn lại!"

  stewardship_domain_special.1413.desc:0 "Khi [collector.GetTitledFirstName] dẫn ta đi quanh ngôi làng, tất cả những gì ta thấy là những con bò gầy gò, gà bới đất, và nông dân trở về từ các cánh đồng với những gánh nặng nhẹ tênh. Khi ta bình luận về điều đó, [collector.GetSheHe] đưa ra luận điểm của [collector.GetHerHis].\n\n"Những người này hầu như không đủ thức ăn cho vật nuôi của họ. Nếu tôi yêu cầu thêm từ họ, họ sẽ chết đói.""
  stewardship_domain_special.1413.a:0 "Có lẽ ta có thể cho họ hoãn thuế..."
  stewardship_domain_special.1413.b:0 "Dù thế nào họ vẫn phải trả."
  stewardship_domain_special.1413.c:0 "Đây là thứ ngươi muốn cho ta xem sao? Phản nghịch!"
  stewardship_domain_special.1413.c.tt:0 "Ta sẽ quyết định cách xử lý ngôi làng"

  stewardship_domain_special.1414.desc:0 "Ngôi làng vẫn còn bốc khói khi ta và lính canh rời đi.\n\nĐôi khi cái cũ phải bị thanh tẩy để nhường chỗ cho cái mới."
  stewardship_domain_special.1414.a:0 "Có nhiều cách để cai trị."

  stewardship_domain_special.1421.collector_opening:0 "Người thu thuế được cử đi điều tra ngôi làng biến mất đã không bao giờ trở lại. Dưới sự hộ tống nghiêm ngặt, ta quyết định tự mình điều tra, và cuối cùng phát hiện ra lý do..."
  stewardship_domain_special.1421.self_opening:0 "Khi ta đến làng cùng lính canh, cuối cùng ta cũng phát hiện ra vì sao dân làng ngừng nộp thuế."
  stewardship_domain_special.1421.desc:0 "\n\nMọi ngôi nhà đều hoang phế và bị bỏ lại. Không có dấu vết của bất kỳ người nào, kể cả người thu thuế của ta.\n\nMột cảm giác lo sợ dần dâng lên khi lính của ta lục soát những căn nhà im lặng, nhanh chóng biến thành hoảng loạn khi một người đột nhiên hét lên."
  stewardship_domain_special.1421.a:0 "Ngươi tìm thấy gì vậy!?!"
  stewardship_domain_special.1421.a.tt:0 "Có thể là bất cứ thứ gì"
  stewardship_domain_special.1421.b:0 "Chúng ta rời khỏi đây. Ngay."

  stewardship_domain_special.1422.desc:0 "Người lính hét lên bước ra khỏi cánh cửa mục nát với một đứa trẻ dưới tay. Đứa [foundling.Custom('GirlBoy')] đã cố trốn ở phía sau căn nhà.\n\nDù ta hỏi thế nào, đứa trẻ cũng không nói một lời về chuyện gì đã xảy ra với ngôi làng — hay thậm chí bất kỳ lời nào."
  stewardship_domain_special.1422.a:0 "Tội nghiệp [foundling.Custom('GirlBoy')] không còn nhà nữa... Ta sẽ nhận nuôi [foundling.GetHerHim]!"
  stewardship_domain_special.1422.b:0 "Để đứa trẻ ở ngôi làng gần nhất."
  stewardship_domain_special.1422.c:0 "Đốt ngôi làng và đứa trẻ bị nguyền rủa này cùng nó."

  stewardship_domain_special.1423.foundling:0 "[foundling.GetTitledFirstName] bé nhỏ giờ đã an toàn tại triều đình, chơi đùa — thậm chí nói chuyện — với những đứa trẻ khác.\n\n"
  stewardship_domain_special.1423.no_foundling:0 "Tiếng ồn và chuyện trò nơi triều đình không giúp ta quên đi những gì đã thấy."
  stewardship_domain_special.1423.desc:0 "Ký ức về ngôi làng im lặng vẫn ám ảnh ta. Cuối cùng, chúng ta không tìm thấy dù chỉ một dấu vết của bất kỳ ai từng sống ở đó."
  stewardship_domain_special.1423.a:0 "Vùng đất bị nguyền này không bao giờ được tái định cư."
  stewardship_domain_special.1423.b:0 "Thời gian sẽ chiếm lại ngôi làng đó, như nó chiếm lấy mọi thứ."

  stewardship_domain_special.1424.desc:0 "Thứ chờ ta trong căn nhà bỏ hoang là mùi hôi thối và một đống xác chết. Sự phân hủy khiến không thể biết họ chết như thế nào,"
  stewardship_domain_special.1424.collector_end:0 "nhưng ngay cả cái xác mới hơn dựa vào tường — người thu thuế của ta — cũng không có dấu vết bị giết."
  stewardship_domain_special.1424.self_end:0 "nhưng ngay cả những xác ít mục nát nhất cũng không có dấu vết bị giết."
  stewardship_domain_special.1424.a:0 "Đốt cái ổ địa ngục này."
  stewardship_domain_special.1424.b:0 "Chôn các xác chết và ra lệnh tái định cư."

  stewardship_domain_special.1425.desc:0 "Việc xử lý các xác chết khá dễ dàng. Khó hơn là tìm gia đình sẵn sàng định cư trong một ngôi làng của người chết. Tuy vậy, không nông dân nào cưỡng lại được sức hút của một mảnh đất tốt quá lâu. Hoặc của đầu mũi giáo thúc ép.\n\nViệc giám sát công cuộc tái thiết ban đầu cũng dạy ta nhiều điều!"
  stewardship_domain_special.1425.a:0 "Giá như cơn ho chết tiệt này chịu hết..."
 
  stewardship_domain_special.1426.desc:0 "Không trang trọng, nhưng ngọn lửa làm được điều cần làm. Ta nhìn ngọn lửa nuốt chửng những căn nhà bị bỏ hoang từ lâu, nhưng không lâu. Ta đã thấy mọi thứ cần thấy ở đây."
  stewardship_domain_special.1426.a:0 "Đã đến lúc trở về nhà."

  stewardship_domain_special.1431.desc:0 "Sau nhiều ngày di chuyển, ta tìm thấy ngôi làng biến mất khỏi sổ sách của mình. Không chỉ tồn tại — nó còn cực kỳ thịnh vượng! – và dân làng khẳng định họ #EMP vẫn#! nộp thuế.\n\n[collector.GetTitledFirstName], người thu thuế của lãnh địa, đã không hoàn toàn trung thực."
  stewardship_domain_special.1431.a:0 "[collector.GetFirstNameNoTooltip] có vài câu hỏi cần trả lời..."
  stewardship_domain_special.1431.a.tt:0 "Ta sẽ đối chất với [collector.GetFirstName]"
  stewardship_domain_special.1431.b:0 "Tập hợp dân làng lại. Họ sẽ phải trả thuế lần nữa."


  stewardship_domain_special.1432.desc:0 ""Số tiền đó rất quan trọng cho, ờ... việc phòng thủ của [county.GetNameNoTier]!" [collector.GetTitledFirstName], người thu thuế tại [barony.GetNameNoTier], đang vô cùng hoảng sợ, không ít vì những binh lính lực lưỡng ta mang theo đến trang viên của [collector.GetHerHis].\n\n"Ôi xin ngài, thần sẽ làm bất cứ điều gì để được tha thứ!""
  stewardship_domain_special.1432.a:0 "Ngươi sẽ bị lãng quên trong bóng tối."
  stewardship_domain_special.1432.b:0 "Ta có thể dùng một kẻ mang ơn mạng sống với ta."
  stewardship_domain_special.1432.b.collector_loyal:0 "Lòng Biết Ơn và Trung Thành"
  stewardship_domain_special.1432.b.collector_bad:0 "Một Cơ Hội Trốn Thoát"
  stewardship_domain_special.1432.b.collector_bad.tt:0 "[collector.GetFirstNameNoTooltip] trốn thoát!"
  stewardship_domain_special.1432.c:0 "Bất cứ điều gì sao? Vậy hãy đi đếm giun đi!"

  stewardship_domain_special.1433.desc:0 "Tên giòi bọ phản trắc đó! Ta ban sự tha thứ, và ngay giây tiếp theo [collector.GetTitledFirstName] đã lao vào ta với thanh kiếm trong tay và vẻ mặt hung ác trên khuôn mặt [collector.GetHerHis].\n\nTa vật lộn một lúc để tự vệ trước khi một lính gác áp sát [collector.GetHerHim]."
  stewardship_domain_special.1433.a:0 "Bóp cổ [collector.GetHerHim] ngay lập tức."
  stewardship_domain_special.1433.b:0 "Ngươi sẽ không bao giờ thấy ánh sáng nữa, [collector.GetFirstNameNoTooltip]!"

  stewardship_domain_special.1441.desc:0 "Những khoản thuế áp lên nông dân của ta đôi khi thật nặng nề. Tuy vậy, những sự việc gần đây đã cho ta thấy rằng cuộc sống #EMP vốn dĩ#! đã khắc nghiệt. Không có lòng tốt nào ta ban ra có thể thay đổi điều đó."
  stewardship_domain_special.1441.a:0 "Ta đã học được rất nhiều."

  stewardship_domain_special.1442.desc:0 "Những khoản thuế áp lên nông dân trong lãnh địa của ta đôi khi khắc nghiệt đến mức bóp nghẹt cả cuộc sống. Nới lỏng chúng đôi khi lại là con đường dẫn tới sự thịnh vượng lớn hơn cho một [ROOT.Char.GetTitleTierName] biết kiên nhẫn."

  stewardship_domain_special.1443.t:1 "$stewardship_domain_special.1401.t$: Thu Thuế Cải Thiện"
  stewardship_domain_special.1443.opening:0 "Khi rà soát sổ sách thuế, ta lại nhớ đến vụ việc ngôi làng biến mất tại [barony.GetNameNoTier]."
  stewardship_domain_special.1443.end:0 "\n\nTình hình từ đó đã cải thiện rất nhiều, và nguồn thu từ [barony.GetNameNoTier] giờ cao hơn bao giờ hết!"
  stewardship_domain_special.1443.a:0 "Tuyệt vời!"

  stewardship_domain_special.1444.t:1 "$stewardship_domain_special.1401.t$: Trốn Thuế Tràn Lan"
  stewardship_domain_special.1444.end:0 "\n\nMọi chuyện giờ đã khác, nhưng ta đã học được rằng lòng thương xót và sự khoan dung đôi khi chỉ dẫn đến tổn thất lớn hơn. Mọi cách tránh thuế sẽ lan giữa nông dân như bọ chét."
  stewardship_domain_special.1444.a:0 "Thật là thảm họa."

  stewardship_domain_special.1445.t:1 "$stewardship_domain_special.1401.t$: Tiếp Tục Bị Bỏ Hoang"
  stewardship_domain_special.1445.end:0 "\n\nGiờ đây nhiều ngôi làng khác cũng biến mất, nhưng những người thu thuế của ta biết rõ nguyên nhân. Thuế quá cao khiến nhiều vùng đất tốt bị bỏ hoang, hoặc do nạn đói, hoặc do người dân trốn sang các hạt khác."
  stewardship_domain_special.1445.a:0 "Nếu họ không thể nuôi nổi bản thân..."

  stewardship_domain_special.1451.t:1 "$stewardship_domain_special.1401.t$: Khắc Sâu Trong Ký Ức"
  stewardship_domain_special.1451.desc:0 "Ta tỉnh giấc giữa đêm, vẫn nhớ ánh nhìn buộc tội của đứa trẻ khi ngôi làng tại [barony.GetNameNoTier] bị thiêu rụi."
  stewardship_domain_special.1451.a:0 "Sao chuyện này lại ám ảnh ta đến vậy?"
  stewardship_domain_special.1451.b:0 "À, ta gần như đã quên mất!"

 # Domesday Book, by Stephen Arthur and Sean Hughes
  stewardship_domain_special.1500.t.a:0 "Cuộc Khảo Sát Vĩ Đại"
  stewardship_domain_special.1500.t.b:0 "Sổ Domesday"
  stewardship_domain_special.1500.desc:1 "[domesday_steward.GetCouncilTitle] của ta, [domesday_steward.GetTitledFirstName], đã đưa ra một ý tưởng táo bạo: đánh giá toàn bộ tài sản trong lãnh địa của ta bằng một cuộc khảo sát khổng lồ, tạo ra bản ghi chép hoàn chỉnh về mọi sở hữu của ta.\n\nBằng cách tổng hợp kiến thức này, ta sẽ kiểm soát tốt hơn các vấn đề hành chính cũng như thu thuế — dù khoản đầu tư ban đầu sẽ không hề rẻ."
  stewardship_domain_special.1500.a:0 "Ta sẽ biết từng mẫu đất, từng nông nô và từng gia súc."
  stewardship_domain_special.1500.a.tt:0 "#F Một cuộc đánh giá kỹ lưỡng rất tốn kém, nhưng chất lượng sẽ cao hơn.#!"
  stewardship_domain_special.1500.b:0 "Một bản tóm tắt tài sản của ta là đủ."
  stewardship_domain_special.1500.b.tt:0 "#F Một cuộc đánh giá sơ bộ rẻ hơn, nhưng có thể không đạt chất lượng cao.#!"
  stewardship_domain_special.1500.c:0 "Bận tâm làm gì? Thần dân của ta biết họ nợ ta những gì."
  stewardship_domain_special.1500.c.tt:0 "Tất cả các chư hầu khác của ta"
  stewardship_domain_special.1500.quality_increase.tt:0 "Cuộc khảo sát sẽ #P tăng chất lượng#!"
  stewardship_domain_special.1500.quality_decrease.tt:0 "Cuộc khảo sát sẽ #N giảm chất lượng#!"
  stewardship_domain_special.1500.quality_based_taxes:0 "Dựa trên chất lượng của cuộc khảo sát hoàn thành"
  stewardship_domain_special.1500.every_county_control:0 "[control|E] tăng theo chất lượng khảo sát"
  stewardship_domain_special.1500.every_county_summary:0 "Tăng [holding|E] Taxes theo tỷ lệ trong #V 5 Years#!"
  stewardship_domain_special.1500.survey_not_completed:0 "Nếu cuộc khảo sát không hoàn thành"

  stewardship_domain_special.1501.desc:0 "[domesday_marshal.GetTitledFirstName], thống chế của ta, lo ngại rằng các viên khảo sát sẽ trở thành mục tiêu của bọn cướp. Ngay cả một cuộc khảo sát chưa hoàn chỉnh cũng có thể cung cấp thông tin quý giá cho tội phạm về những mục tiêu dễ tấn công!\n\nĐể giữ an toàn cho thần dân, [domesday_marshal.GetFirstNameNoTooltip] khuyên nên cử lính hộ tống cho mỗi nhóm khảo sát."
  stewardship_domain_special.1501.a:0 "Luật pháp của ta đủ để bảo vệ thần dân!"
  stewardship_domain_special.1501.a.tt:0 "Các viên khảo sát có thể bị tấn công tại những hạt có [control|E] thấp."
  stewardship_domain_special.1501.b:0 "Tổ chức dân binh để bảo vệ các viên khảo sát."
  stewardship_domain_special.1501.b.success:0 "Dân binh bảo vệ được các viên khảo sát"
  stewardship_domain_special.1501.b.failure:0 "Dân binh không thể bảo vệ các viên khảo sát"
  stewardship_domain_special.1501.c:0 "Cử một [ROOT.Char.Custom('MountedWarriorTerm')] đi cùng mỗi nhóm khảo sát."
  stewardship_domain_special.1501.c.tt:0 "Các viên khảo sát sẽ được bảo vệ khỏi các cuộc tấn công trên đường."

  stewardship_domain_special.1510.opening:0 "[upset_priest.Custom2('AppropriateGreeting', ROOT.Char)]"
  stewardship_domain_special.1510.desc_opening:0 "Tôi đã rất sốc khi sáng nay những người duy nhất đến buổi lễ của tôi lại là các viên khảo sát thuế của ngài! Rõ ràng những quan chức nghiêm nghị đứng trước cửa đã khiến nhiều tín đồ [upset_priest.GetFaith.GetAdherentNamePluralNoTooltip] không dám đến dự lễ."
  stewardship_domain_special.1510.desc_ending:0 "\n\nTôi sẵn lòng nộp nghĩa vụ cho ngài, nhưng công việc của giáo hội vốn là vấn đề tinh thần, không phải thế tục, và các viên khảo sát của ngài không có quyền ở đây phá rối buổi lễ!"
  stewardship_domain_special.1510.desc_ending_not_endorsed:0 "\n\nCông việc của giáo hội vốn là vấn đề tinh thần, không phải thế tục, và tay sai của ngài không có quyền ở đây phá rối buổi lễ!"
  stewardship_domain_special.1510.a:0 "Các [upset_priest.GetFaith.HouseOfWorshipPlural] sẽ bị đánh giá tài sản, dù [upset_priest.GetSheHe] thích hay không!"
  stewardship_domain_special.1510.b:0 "[upset_priest.GetSheHe|U] nói đúng, các [upset_priest.GetFaith.HouseOfWorshipPlural] thuộc lãnh địa của [upset_priest.GetFaith.HighGodNamePossessive]."
  stewardship_domain_special.1510.b.tt:0 "Ta loại trừ tài sản của [upset_priest.GetTitledFirstNamePossessive] khỏi cuộc khảo sát"
  stewardship_domain_special.1510.c:0 "Ta sẽ dùng [upset_priest.GetFaith.ReligiousText] để biện minh cho cuộc khảo sát."
  stewardship_domain_special.1510.c.success:0 "Ta thuyết phục được [upset_priest.GetTitledFirstName]"
  stewardship_domain_special.1510.c.success.tt:0 "Ta thuyết phục [upset_priest.GetTitledFirstName] rằng việc khảo sát là hợp lý"
  stewardship_domain_special.1510.c.failure:0 "Ta không thuyết phục được [upset_priest.GetTitledFirstName]"
  stewardship_domain_special.1510.c.failure.tt:0 "Ta không thuyết phục được [upset_priest.GetTitledFirstName] rằng việc khảo sát là hợp lý"
 
  stewardship_domain_special.1520.opening:0 "[concerned_noble.Custom2('AppropriateGreeting', ROOT.Char)]"
  stewardship_domain_special.1520.desc:0 "Tôi đã trung thành nộp nghĩa vụ cho vương quyền mỗi năm, vậy mà mới hôm trước các viên khảo sát thuế của ngài lại xuất hiện trước cửa nhà tôi đòi kiểm tra tài sản!\n\nNgài tin tôi ít đến vậy sao mà phải cử người xâm phạm đời tư của tôi?"
  stewardship_domain_special.1520.a:0 "Dĩ nhiên ta tin ngươi! Người của ta sẽ rút đi ngay."
  stewardship_domain_special.1520.a.tt:0 "Ta loại trừ tài sản của [concerned_noble.GetTitledFirstNamePossessive] khỏi cuộc khảo sát"
  stewardship_domain_special.1520.b:0 "Ta phải biết lãnh địa của mình có gì. Không ngoại lệ."
  stewardship_domain_special.1520.c:0 "Ngươi đang giấu gì sao, [concerned_noble.GetSheHe]? Thay các viên khảo sát bằng gián điệp!"
  stewardship_domain_special.1520.c.tt:0 "Ta phát hiện một trong các [secrets|E] của [concerned_noble.GetTitledFirstNamePossessive]"

  stewardship_domain_special.1530.desc:0 "[city_mayor.GetTitledFirstName] báo rằng Nghiệp đoàn Thợ Mộc tại [guild_town.GetNameNoTierNoTooltip] thuộc [guild_county.GetName] đang phản đối việc bị đưa vào cuộc khảo sát.\n\nHọ cho rằng việc này vi phạm đặc quyền quản lý nội bộ của họ, và yêu cầu các viên khảo sát của ta rời khỏi hạt để họ tự do hoạt động."
  stewardship_domain_special.1530.a:0 "Các nghiệp đoàn vẫn sẽ bị khảo sát, mặc kệ đặc quyền!"
  stewardship_domain_special.1530.b:0 "Ta có thể miễn cho họ nếu họ phục vụ ta..."
  stewardship_domain_special.1530.c:0 "Chúng dám thách thức quyền lực của ta!? Tước bỏ đặc quyền của chúng!"

  stewardship_domain_special.1540.desc.a:0 "Khi đi qua [domesday_robbed_county.GetName], một nhóm cướp đã tấn công các viên khảo sát của ta. Một số người bị giết và hồ sơ họ mang theo đã mất."
  stewardship_domain_special.1540.desc.b:0 "Khi đi qua [domesday_robbed_county.GetName], một nhóm cướp đã tấn công các viên khảo sát của ta. May mắn thay, lính hộ tống đã tiêu diệt bọn cướp."
  stewardship_domain_special.1540.a:0 "Bỏ qua [domesday_robbed_county.GetNameNoTierNoTooltip]. Nó sẽ không được khảo sát."
  stewardship_domain_special.1540.b:0 "Tăng tuần tra và gửi thêm người khảo sát!"
  stewardship_domain_special.1540.c:0 "Hãy để đây là bài học cho những kẻ chống lại ta tại [domesday_robbed_county.GetNameNoTierNoTooltip]!"

  stewardship_domain_special.1550.desc:1 "Khi so sánh số thuế năm ngoái với dữ liệu khảo sát mới, ta nhận ra nhiều sai lệch lớn... hoặc thần dân của ta đã nộp quá nhiều, hoặc cuộc khảo sát này có vấn đề!\n\nĐiều tra sâu hơn, ta phát hiện [domesday_steward.GetCouncilTitle] của ta, [domesday_steward.GetTitledFirstName], đã làm sai lệch cuộc khảo sát bằng cách nhận hối lộ từ địa chủ để bỏ tài sản của họ khỏi bản đánh giá!"
  stewardship_domain_special.1550.a:0 "Hủy cuộc khảo sát và buộc [domesday_steward.GetHerHim] hoàn trả chi phí."
  stewardship_domain_special.1550.b:0 "Dùng tiền hối lộ để khảo sát lại những tài sản đó."
  stewardship_domain_special.1550.c:1 "Tống giam [domesday_steward.GetTitledFirstNameNoTooltip], nhiệm kỳ [domesday_steward.GetCouncilTitle] của [domesday_steward.GetHerHis] đã kết thúc."

  stewardship_domain_special.1560.desc:0 "[city_mayor.GetTitledFirstName] báo rằng các thương nhân đi lại đang phàn nàn về các viên khảo sát của ta tại [trade_county.GetName].\n\nHọ cho rằng thật bất công khi hàng hóa của họ bị kiểm tra dù họ không phải cư dân của [ROOT.Char.GetPrimaryTitle.GetName], và nhiều người đang đe dọa rời đi vĩnh viễn."
  stewardship_domain_special.1560.a:0 "Ai cũng phải bị khảo sát, dù là cư dân hay không!"
  stewardship_domain_special.1560.b:0 "Nếu họ trả một khoản phí, ta sẽ miễn cho họ."
  stewardship_domain_special.1560.c:0 "Các thương nhân cũng có lý."

  stewardship_domain_special.1590.desc.start:0 "Sau nhiều tháng dài khảo sát lãnh địa của ta, cuối cùng cũng đã hoàn tất."
  stewardship_domain_special.1590.perfect.desc:0 "Dưới sự chỉ đạo của ta, các quan thẩm định đã lập nên một bản ghi chép hoàn hảo tuyệt đối về toàn bộ tài sản của ta. Mọi thứ đều được ghi lại chi tiết đến tận con gà cuối cùng, bảo đảm rằng mỗi năm ta sẽ thu đủ toàn bộ số thuế đáng lẽ thuộc về ta!"
  stewardship_domain_special.1590.excellent:0 "Các quan thẩm định lập nên bản ghi chép chính xác về tài sản của ta"
  stewardship_domain_special.1590.excellent.desc:0 "Các quan thẩm định của ta đã lập nên một bản ghi chép cực kỳ chính xác về tài sản của ta. Điều này sẽ bảo đảm rằng mỗi năm ta thu đủ toàn bộ số thuế đáng lẽ thuộc về ta!"
  stewardship_domain_special.1590.good:0 "Các quan thẩm định lập nên bản ước tính chính xác về tài sản của ta"
  stewardship_domain_special.1590.good.desc:0 "Các quan thẩm định của ta đã lập nên một bản ước tính chính xác về tài sản của ta. Điều này sẽ bảo đảm những người thu thuế của ta không bỏ sót điều gì quan trọng khi tính toán số thuế ta được hưởng."
  stewardship_domain_special.1590.mediocre:0 "Các quan thẩm định lập nên bản ước tính mơ hồ về tài sản của ta"
  stewardship_domain_special.1590.mediocre.desc:0 "Các quan thẩm định của ta chỉ lập nên một bản ước tính khá mơ hồ về tài sản của ta. Tuy vẫn có ích phần nào, nhưng những người thu thuế của ta gần như chắc chắn sẽ bỏ sót nhiều thứ khi tính toán số thuế ta được hưởng."
  stewardship_domain_special.1590.poor:0 "Bản khảo sát sai lệch đến mức không thể sử dụng"
  stewardship_domain_special.1590.poor.desc:0 "Đáng tiếc thay, các quan thẩm định của ta đã lập nên một bản khảo sát sai lệch đến mức hoàn toàn vô dụng! Những người thu thuế của ta năm nay sẽ phải tự xoay xở..."
  stewardship_domain_special.1590.none.desc:0 "\n\nThật đáng kinh ngạc, từng tỉnh trong lãnh địa của ta bằng cách nào đó đều giành được quyền miễn trừ khiến họ bị loại khỏi cuộc khảo sát. Kết quả là bản ghi chép hoàn thành hoàn toàn không chứa bất kỳ thông tin nào về tài sản trong lãnh địa của ta."
  stewardship_domain_special.1590.every_county:0 "Mọi quận trong [THIS.Char.GetPrimaryTitle.GetName]"
  stewardship_domain_special.1590.every_nonexcluded_county:0 "Mọi quận không bị loại trừ trong [THIS.Char.GetPrimaryTitle.GetName]"
  stewardship_domain_special.1590.high_quality.desc:1 "\n\nRạng rỡ vì tự hào, [domesday_final_steward.GetCouncilTitle] của ta là [domesday_final_steward.GetFirstName] hỏi rằng giờ khi hồ sơ đã hoàn tất, chúng ta nên cất giữ chúng ở đâu."
  stewardship_domain_special.1590.low_quality.desc:1 "\n\n[domesday_final_steward.GetCouncilTitle] của ta là [domesday_final_steward.GetFirstName] tỏ ra thất vọng, nói rằng đây không phải kết quả mà [domesday_final_steward.GetSheHe] mong đợi."
  stewardship_domain_special.1590.no_steward.desc:1 "\n\nGiá như ta vẫn còn một [ROOT.GetCouncillorPosition( 'councillor_steward' ).GetPositionName], cuộc khảo sát này hẳn đã tốt hơn."
  stewardship_domain_special.1590.high_quality.a:0 "Chỉ cho phép những người thu thuế của ta tiếp cận."
  stewardship_domain_special.1590.high_quality.a.tt:0 "#F Hạn chế quyền tiếp cận các hồ sơ này sẽ cho ta thông tin độc quyền về lãnh địa của mình để khai thác.#!"
  stewardship_domain_special.1590.high_quality.b:0 "Phổ biến các hồ sơ này cho dân chúng!"
  stewardship_domain_special.1590.high_quality.b.tt:0 "#F Khi các hồ sơ này trở thành tri thức chung, dân chúng sẽ kinh ngạc và được truyền cảm hứng, giúp cải thiện sự phát triển trong lãnh địa của ta.#!"
  stewardship_domain_special.1590.poor_quality.a:0 "Thật là phí thời gian và tiền bạc..."
  stewardship_domain_special.1590.poor_quality.b:0 "Cách chức [domesday_final_steward.GetFirstNameNoTooltip] vì sự bất tài của [domesday_final_steward.GetHerHis]!"
  stewardship_domain_special.1590.poor_quality.d.tt:0 "Bị sa thải khỏi [council|E] của ta"
  stewardship_domain_special.1590.poor_quality.c:0 "[domesday_final_steward.GetSheHe|U] sẽ phải trả giá cho thất bại này bằng mạng sống của [domesday_final_steward.GetHerHis]!"

 # Visit displeased county, by Stephen Arthur
  stewardship_domain_special.3010.t:0 "Bất ổn tại [stewardship_domain_special_3010_county.GetNameNoTier]"
  stewardship_domain_special.3010.desc:0 "Người dân tại [stewardship_domain_special_3010_county.GetNameNoTier] dường như không hài lòng với sự cai trị của ta.\n\nNếu ta đích thân tới thăm quận này, ta có thể khiến họ hiểu rõ... ừm, #EMP sự cần thiết#! của quyền uy của ta."
  stewardship_domain_special.3010.a:0 "Ta sẽ cho họ thấy ta là kẻ thế nào!"
  stewardship_domain_special.3010.b:0 "Thời gian của ta quá quý giá để phí phạm vào ý kiến của họ."

  stewardship_domain_special.3012.t:0 "Chuyến thăm [stewardship_domain_special_3010_county.GetNameNoTier]"
  stewardship_domain_special.3012.desc.a:0 "[stewardship_domain_special_3010_baron.GetTitledFirstName] áy náy giải thích rằng dân chúng nơi đây vốn ngang bướng, và họ cần phải hiểu rằng sự cai trị của ta không thể bị nghi ngờ. Chỉ miễn cưỡng chấp nhận là chưa đủ, ta cần lòng trung thành và sự phục tùng.\n\nTa nên thuyết phục họ tuân phục bằng cách nào?"
  stewardship_domain_special.3012.desc.b:0 "Người dân nơi đây vốn ngang bướng. Họ cần phải hiểu rằng sự cai trị của ta không thể bị nghi ngờ. Chỉ miễn cưỡng chấp nhận là chưa đủ, ta cần lòng trung thành và sự phục tùng.\nTa nên thuyết phục họ tuân phục bằng cách nào?"
  stewardship_domain_special.3012.a:0 "Bằng vàng bạc, ta sẽ thể hiện lòng hào phóng."
  stewardship_domain_special.3012.b:0 "Gây ấn tượng với họ bằng một bài diễn thuyết hùng hồn về sự cai trị của ta."
  stewardship_domain_special.3012.b.success:0 "Ta khiến dân chúng ấn tượng bằng bài diễn thuyết của mình"
  stewardship_domain_special.3012.b.failure:0 "Lời nói của ta trở nên vô nghĩa và dân chúng không hề lay chuyển"
  stewardship_domain_special.3012.c:0 "Lũ nông dân sẽ phải chịu khổ vì sự hỗn xược của chúng!"

  stewardship_domain_special.3014.t.a:0 "Trật tự được khôi phục tại [stewardship_domain_special_3010_county.GetNameNoTier]"
  stewardship_domain_special.3014.t.b:0 "Bất ổn tại [stewardship_domain_special_3010_county.GetNameNoTier]"
  stewardship_domain_special.3014.spent_gold.desc:0 "Tiền bạc được dùng đúng chỗ. Sự hào phóng của ta đã mua được sự phục tùng của dân chúng đối với sự cai trị của ta."
  stewardship_domain_special.3014.popular_appeal_fail_learn_success.desc:0 "[stewardship_domain_special_3010_county.GetNameNoTier] vẫn ngang bướng như trước. Ban đầu các bài diễn thuyết của ta khá vụng về, nhưng ta nghĩ chúng đã khá hơn vào cuối chuyến thăm."
  stewardship_domain_special.3014.popular_appeal_fail_learn_fail.desc:0 "Những bài diễn thuyết của ta rơi vào tai điếc. Ta không biết mình đã sai ở đâu. [stewardship_domain_special_3010_county.GetNameNoTier] vẫn ngang bướng như trước."
  stewardship_domain_special.3014.popular_appeal_success.desc:0 "Những lời nói của ta đã chạm tới họ và giờ [stewardship_domain_special_3010_county.GetNameNoTier] tỏ ra phục tùng hơn đối với sự cai trị của ta."
  stewardship_domain_special.3014.intimidate_success.desc:0 "Việc phô trương quyền lực tại [stewardship_domain_special_3010_county.GetNameNoTier] dường như đã có tác dụng. Họ run sợ trước uy thế của ta và từ nay sẽ là thần dân ngoan ngoãn hơn."

  stewardship_domain_special.3014.a:0 "Vàng luôn tìm thấy những bàn tay trống rỗng."
  stewardship_domain_special.3014.b:0 "Ít nhất ta cũng học được điều gì đó."
  stewardship_domain_special.3014.c:0 "Lời nói của ta lay động cả lãnh địa."
  stewardship_domain_special.3014.e:0 "Cứ để họ căm ghét, miễn là họ biết sợ."
  stewardship_domain_special.3014.f:0 "Thật bực bội. Liệu ta có bao giờ cải thiện tài ngoại giao của mình không?"
  stewardship_domain_special.3014.f.tt:0 "Ta không học được gì về quản trị."

  stewardship_domain_special.8031.t:0 "$stewardship_domain_special.8001.t$: Mang Sự Sống"
  stewardship_domain_special.8031.aqueduct:0 "Ta có mặt để chứng kiến những viên đá cuối cùng được đặt vào cống dẫn nước mới của ta tại [county.GetName]. Quản gia của ta đưa ra một chiếc cốc, hứng những giọt nước đầu tiên chảy ra rồi dâng nó cho ta."
  stewardship_domain_special.8031.irrigation:0 "Ta có mặt vào ngày những con đê được hạ xuống để đưa nước vào mạng lưới kênh mương mới của ta tại [county.GetName]. Phải mất hàng giờ để dòng nước bắt đầu lan ra đúng cách,"
  stewardship_domain_special.8031.interlude:0 "\n\nMặt đất vẫn cứng cằn và khắc nghiệt, và còn rất nhiều việc phải làm,"
  stewardship_domain_special.8031.full_scope:0 "nhưng dòng nước thì trong lành,"
  stewardship_domain_special.8031.scoped_down:0 "đặc biệt khi công trình của ta không hoành tráng như ta từng hình dung. Tuy vậy, dòng nước vẫn trong lành,"
  stewardship_domain_special.8031.conclusion:0 "và theo thời gian sẽ mang lại sự sống mới cho vùng đất này. Khi những dòng nước nhỏ hợp lại thành suối, ta suy ngẫm về tất cả những điều công trình này đã dạy ta."
  stewardship_domain_special.8031.a:0 "Ngay cả nhiều thập kỷ sau, chúng ta vẫn sẽ gặt hái thành quả từ việc này."

 # The Irrigation Project, by Petter Vilberg
  stewardship_domain_special.8001.progress_is_made:0 "Đã Có Tiến Triển Đáng Kể"
  stewardship_domain_special.8001.continued_problems:0 "Vấn Đề Tiếp Diễn"
  stewardship_domain_special.8001.troubled_construction:0 "Công Trình Trắc Trở"
  stewardship_domain_special.8001.slow_progress:0 "Tiến Độ Chậm Chạp"
  stewardship_domain_special.8001.high_death_count:0 "Số Người Chết Rất Cao"
  stewardship_domain_special.8001.project_continues:0 "#V Công trình vẫn tiếp tục#!"
  stewardship_domain_special.8001.project_completed:0 "#P Công trình đã hoàn thành#!"

  stewardship_domain_special.8001.t:0 "Thủy Lợi"
  stewardship_domain_special.8001.desc:2 "Trong [county.GetName] vẫn còn nhiều dải đất bỏ hoang, thường bị cho là do địa hình không thích hợp.\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đã đề xuất rằng một dự án thủy lợi có thể khiến vùng đất này trở nên canh tác được, từ đó trở nên có giá trị."
  stewardship_domain_special.8001.a:0 "Ta sẽ thiết kế một cầu dẫn nước!"
  stewardship_domain_special.8001.b:0 "Ta cần một mạng lưới mương và đất."
  stewardship_domain_special.8001.c:0 "Vùng đất ấy bỏ hoang hẳn là có lý do."
  stewardship_domain_special.8001.if_successful:0 "Nếu thành công:"

  stewardship_domain_special.8011.t:1 "$stewardship_domain_special.8001.t$: Vượt Quá Ngân Sách"
  stewardship_domain_special.8011.desc:0 "Vị kiến trúc sư phụ tá mà ta bổ nhiệm đã đến gặp ta, xin thêm tiền cho dự án cầu dẫn nước tại [county.GetName].\n\n\"Hẳn chính ngài cũng thấy rằng việc xây dựng trong điều kiện như thế này sẽ vô cùng tốn kém, thưa [ROOT.Char.Custom('FormOfAddressForLiege')].\""
  stewardship_domain_special.8011.a:1 "[steward.GetFirstNameNoTooltip], hãy tìm cho ta một kẻ khác!"
  stewardship_domain_special.8011.a.tt:0 "#F Ta từng đặt nhiều kỳ vọng vào kẻ này...#!"
  stewardship_domain_special.8011.b:0 "Ngươi nói đúng. Hãy lấy những gì ngươi cần."

  stewardship_domain_special.8012.t:1 "$stewardship_domain_special.8001.t$: Vấn Đề Tiếp Diễn"
  stewardship_domain_special.8012.desc:0 "Trong lãnh địa của ta chẳng lẽ không có nổi một kiến trúc sư ra hồn sao?! Vị phụ tá kiến trúc sư mới của ta, phụ trách công trình cầu dẫn nước tại [county.GetNameNoTier], cũng đang khiến ngân sách vượt mức!\n\nTa đã quá chán ngấy những lời bào chữa vô nghĩa như \"không thể làm được, thưa [ROOT.Char.Custom('FormOfAddressForLiege')]\"!"
  stewardship_domain_special.8012.a:0 "Cầm lấy vàng đi, nhưng lần này ngươi phải hoàn thành nó!"
  stewardship_domain_special.8012.a.tt:0 "#F Làm sao một cây cầu dẫn nước đơn giản lại tốn đến thế?#!"
  stewardship_domain_special.8012.b:0 "Hãy bắt thêm nông dân đi lao dịch."

  stewardship_domain_special.8013.t:1 "$stewardship_domain_special.8001.t$: Công Trình Trắc Trở"
  stewardship_domain_special.8013.desc:0 "Tài nguyên bị chuyển nhầm nơi, công trình xây dựng không đúng như ý ta... Rốt cuộc mệnh lệnh \"xây cầu dẫn nước đúng như ta muốn\" khó hiểu đến thế sao?"
  stewardship_domain_special.8013.a:0 "Ta sẽ tự mình giám sát công trình."
  stewardship_domain_special.8013.b:0 "Trưng dụng nông dân để bù lại thời gian đã mất."

  stewardship_domain_special.8021.t:1 "$stewardship_domain_special.8001.t$: Khó Khăn Không Lường Trước"
  stewardship_domain_special.8021.desc:2 "Dự án thủy lợi của ta tại [county.GetNameNoTier] vẫn đang tiến triển, nhưng khó khăn hơn dự đoán.\n\nTheo lời [steward.Custom2('MyCharacterIntroduction', ROOT.Char)], nền đất ở đây vừa \"nhiều đá gấp đôi\" vừa \"thấm nước gấp đôi so với chúng ta nghĩ.\""
  stewardship_domain_special.8021.a:0 "Vậy thì nông dân phải làm việc gấp đôi!"
  stewardship_domain_special.8021.b:0 "Chúng ta nên chậm lại và làm cho đúng."
  stewardship_domain_special.8021.c:0 "Luôn có cách lách luật để đưa mọi thứ trở lại đúng tiến độ!"

  stewardship_domain_special.8022.t:1 "$stewardship_domain_special.8001.t$: Điều Kiện Bất Lợi"
  stewardship_domain_special.8022.desc:0 "\"Dự án thủy lợi tại [county.GetNameNoTier] vẫn đang tiến triển tốt, thưa [ROOT.Char.Custom('FormOfAddressForLiege')],\" quan quản gia của ta báo cáo. Niềm đắc ý của ta nhanh chóng tan biến. \"Đáng tiếc là những nông dân lao dịch đang chết với tốc độ đáng báo động.\""
  stewardship_domain_special.8022.a:0 "Có lẽ từ nay ta nên giám sát kỹ hơn."
  stewardship_domain_special.8022.b:0 "Chẳng phải chúng sinh ra để phục vụ ta sao?"
  stewardship_domain_special.8022.c:0 "Ừm... Hãy trưng dụng người thay thế khi cần."
  stewardship_domain_special.8022.c.tt:0 "#F Đừng nói cho chúng biết vì sao cần họ.#!"

  stewardship_domain_special.8023.t:1 "$stewardship_domain_special.8001.t$: Tiến Độ Đình Trệ"
  stewardship_domain_special.8023.desc:1 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], dự án thủy lợi tại [county.GetNameNoTier] đang chậm tiến độ,\" [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] báo cáo. \"Chậm rất nhiều. Sau khi kiểm tra công trình, ta e rằng nó sẽ không hoàn thành trong đời ta.\" \n\nTa không rõ [steward.GetSheHe] có nói nghiêm túc hay không."
  stewardship_domain_special.8023.a:0 "Thay hết bọn quản công. Và phát cho chúng roi mới."
  stewardship_domain_special.8023.b:0 "Thuê bao nhiêu lao động cũng được!"
  stewardship_domain_special.8023.c:0 "Có lẽ đã đến lúc hạ thấp mục tiêu..."
  stewardship_domain_special.8023.c.tt:0 "Điều này sẽ làm giảm hiệu quả của dự án"

 #Localisation for completion of the governance lifestyle.
  stewardship_domain_special.9999.t:0 "Mọi Thứ Đều Nằm Trong Sổ Sách Của Ta"
  stewardship_domain_special.9999.desc_opening:0 "Can dự vào mọi việc, dõi mắt đến từng vấn đề, và luôn có ý kiến về mọi quyết định — ta đã dành rất lâu để tập trung vào công việc quản trị."
  stewardship_domain_special.9999.desc_education_4:0 "\n\nKhi nhìn lại những thành tựu của mình, ta nhận ra rằng chẳng còn điều gì để học thêm nữa!"
  stewardship_domain_special.9999.desc_not_education:0 "\n\nKhi nhìn lại những thành tựu của mình, ta nhận ra rằng mình đã trở thành một thế lực đáng gờm trong việc quản trị!"
  stewardship_domain_special.9999.a:0 "Không điều gì trong nghệ thuật trị quốc có thể qua mắt ta!"
  stewardship_domain_special.9999.a.tt:1 "Ta cảm thấy mình đã đạt tới giới hạn cao nhất trong việc nghiên cứu [stewardship_lifestyle|E]."
