l_english:
 
 ###################
 # Standard Events #
 ###################

 # Bankrupt, by Stephen Arthur and Sean Hughes
  stewardship_wealth.1001.t:0 "Phá Sản!"
  stewardship_wealth.1001.desc:0 "Kho bạc của ta trống rỗng, kho lương cạn sạch. Ngay cả lũ chuột cũng đã bị bán đi để trả chi phí, vậy mà ta vẫn không thể thanh toán hết những món nợ đang đè lên mình!\n\nLàm sao ta có thể thoát khỏi tình cảnh này đây?"
  stewardship_wealth.1001.a:0 "Rà soát sổ sách xem có gì có thể cứu vãn!"
  stewardship_wealth.1001.a.success:0 "Ta phát hiện vài khoản nợ bị bỏ quên mà có thể thu hồi"
  stewardship_wealth.1001.a.failure:0 "Ta không tìm thấy điều gì hữu ích"
  stewardship_wealth.1001.b.havehook:0 "Ta sẽ triệu tập [wealthy_vassal.GetTitledFirstNameNoTooltip] để đòi lại ân huệ hắn nợ Ta."
  stewardship_wealth.1001.b.givehook:0 "Ta sẽ mắc nợ [wealthy_vassal.GetTitledFirstNameNoTooltip] một ân tình nếu [wealthy_vassal.GetSheHe] giúp ta."
  stewardship_wealth.1001.c:0 "Ta sẽ yêu cầu chư hầu cống nạp!"
  stewardship_wealth.1001.c.tt:0 "Mọi chư hầu:"
  stewardship_wealth.1001.d:1 "Tịch thu tài sản tôn giáo để gây quỹ."
  stewardship_wealth.1001.e:0 "Ta sẽ thắt lưng buộc bụng và tiết kiệm những gì có thể."
 
 # Minting New Coins, bu Stephen Arthur and Sean Hughes
  stewardship_wealth.1011.t:0 "Đúc Tiền Mới"
  stewardship_wealth.1011.desc:0 "Quyền và trách nhiệm của ta là quyết định loại tiền tệ nào sẽ được sử dụng trên khắp [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nNhững lựa chọn của ta sẽ quyết định cách đồng tiền — và rộng hơn là cả lãnh địa của ta — được nhìn nhận trên toàn thế giới."
  stewardship_wealth.1011.a:0 "Đúc tiền bạc để thúc đẩy thương mại."
  stewardship_wealth.1011.b:0 "Đúc tiền vàng khắc hình dung mạo của chính ta!"
  stewardship_wealth.1011.c:0 "Pha loãng tiền bằng kim loại rẻ tiền như niken."
  stewardship_wealth.1011.c.success:0 "Ta tiết kiệm được cả gia tài nhờ việc đúc tiền pha loãng"
  stewardship_wealth.1011.c.failure:0 "Mọi người đều nhận ra đồng tiền mới rẻ tiền thế nào"
  stewardship_wealth.1011.custom:0 "Mọi quận trong [THIS.Char.GetPrimaryTitle.GetName]"

 # War Taxes, by Sean Hughes
  stewardship_wealth.1021.t:0 "Chi Phí Chiến Tranh"
  stewardship_wealth.1021.desc:0 "Chiến tranh luôn tốn kém, và [current_war.GetName] cũng không ngoại lệ.\n\nKhi kho bạc của ta nhanh chóng cạn kiệt, ta cần suy nghĩ xem làm thế nào để tiếp tục trả tiền cho binh lính trên chiến trường."
  stewardship_wealth.1021.a:0 "Tăng thêm thuế từ nông dân."
  stewardship_wealth.1021.a.custom:0 "Mọi [county|E] trong [domain|E] của ta"
  stewardship_wealth.1021.b:0 "Cắt giảm những chi tiêu quân sự không thiết yếu."
  stewardship_wealth.1021.b.success:0 "Ta cải thiện hiệu quả ngân sách quân đội"
  stewardship_wealth.1021.b.failure:0 "Ta vô tình cắt nhầm những chi phí quân sự quan trọng"
  stewardship_wealth.1021.c:1 "Rồi mọi chuyện sẽ ổn thôi. Lúc nào chẳng thế."
  stewardship_wealth.1021.c.tt:0 "Chiến tranh sẽ tạo ra nhiều cơ hội..."

 # War Profiteering, by Isabella Welch
  stewardship_wealth.1022.t:0 "Cướp Bóc Thần Thánh"
  stewardship_wealth.1022.desc:0 "[GetPlayer.Custom( 'KnightCultureNoTooltipLowercase' )] của ta, [church_burner.GetName], tiến đến báo cáo với vẻ hớn hở từ đoàn tùy tùng của [church_burner.GetHerHis]:\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], sau quyết định sáng suốt của ngài khi để việc tài trợ chiến tranh tùy chúng tôi xử lý, chúng tôi đã thực hiện cuộc cướp bóc màu mỡ nhất mà [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] từng thấy! Chúng tôi đã lùa được hàng chục con cừu, lấy được hàng trăm món đồ lặt vặt, và thậm chí còn thiêu rụi một [ROOT.Char.GetFaith.HouseOfWorship] với cả nghìn người còn sống bên trong!\""
  stewardship_wealth.1022.a:0 "Kho bạc của ta quả thật cần khoản tiền bất ngờ này... nhưng đừng làm vậy nữa."
  stewardship_wealth.1022.b:0 "Ta sẽ không bị xem là đồ tể! Số tiền này sẽ dùng để bồi thường."
  stewardship_wealth.1022.c:0 "Làm tốt lắm! Chúng ta sẽ tiếp tục làm theo ý mình."
 
 # Wealthy free farmer wants to buy land, by Sean Hughes
  stewardship_wealth.1051.t:0 "Gia Tài Của Người Tự Do"
  stewardship_wealth.1051.desc:0 "[freeman.GetFirstName], một tá điền tự do đang thuê đất của Ta ở [target_county.GetNameNoTier], đã có một vụ mùa bội thu nhờ vào cách canh tác tỉ mỉ của [freeman.GetHerHis].\n\n[freeman.GetSheHe|U] mong muốn dùng một phần lợi nhuận để mua lại một mảnh đất của Ta, ngõ hầu có thể mở rộng quy mô sản xuất trong năm tới."
  stewardship_wealth.1051.a:0 "Quên chuyện cày cấy đi, một [freeman.GetWomanMan] như [freeman.GetHerHim] nên phục vụ tại triều đình của ta!"
  stewardship_wealth.1051.a.arrogant:0 "Một nông dân học thức sao? Thật mới lạ! Ngươi #EMP phải#! vào triều đình của ta!"
  stewardship_wealth.1051.b:0 "Nếu [freeman.GetSheHe] trả bằng tiền mặt, mảnh đất đó sẽ là của [freeman.GetHersHis]."
  stewardship_wealth.1051.d:0 "Đất ở [target_county.GetNameNoTierNoTooltip] là của ta và chỉ của ta!"

 # Pick a new thing to obtain, by Sean Hughes
  stewardship_wealth.1061.t:0 "Những Món Thu Mới"
  stewardship_wealth.1061.desc:0 "Trong quá trình quản lý hằng ngày đối với [ROOT.Char.Custom('GetRealmOrDomicile')] của mình, ta đã biết đến một số cơ hội khác nhau có thể theo đuổi.\n\nMỗi cơ hội đều có tiềm năng lớn, nhưng thực tế ta chỉ có thể theo đuổi một — ta phải quyết định điều gì sẽ mang lại giá trị lớn nhất."
  stewardship_wealth.1061.a:0 "Ta nghe tin đồn về một cuốn sách thất lạc vừa được tìm thấy."
  stewardship_wealth.1061.a.success:0 "Cuốn sách thất lạc chứa đựng kho tri thức vô giá"
  stewardship_wealth.1061.a.success.good:0 "Ngươi nhận được một [artifact|E] sách rất tốt"
  stewardship_wealth.1061.a.failure:0 "Cuốn sách chỉ là một quyển sổ ghi chép cũ"
  stewardship_wealth.1061.a.success.bad:0 "Ngươi nhận được một [artifact|E] sách cũ tầm thường"
  stewardship_wealth.1061.b:0 "[vassal.GetTitledFirstNameNoTooltip] cần giúp quản lý lãnh địa của [vassal.GetHerHis]."
  stewardship_wealth.1061.c:0 "Đảm bảo các thỏa thuận thương mại đó sẽ làm đầy kho bạc của ta."

 # Buy some cows, by Linnéa Thimrén
  stewardship_wealth.5001.t:0 "Gia Súc Sung Mãn"
  stewardship_wealth.5001.desc:0 "Như một phần thanh toán bổ sung trong một giao dịch gần đây, ta bất ngờ sở hữu một đàn gia súc lớn.\n\nTa được đảm bảo rằng những con vật này có chất lượng cao nhất, nhưng câu hỏi vẫn còn đó: nên làm gì với chúng?"
  stewardship_wealth.5001.a:0 "[capital.GetNameNoTierNoTooltip] sẽ thịnh vượng nhờ đàn gia súc này."
  stewardship_wealth.5001.b:0 "Một đàn đẹp thật, nhưng có thể còn lớn hơn nữa..."
  stewardship_wealth.5001.b.message_1:0 "Kế hoạch nhân giống của ta thành công"
  stewardship_wealth.5001.b.message_2:0 "Kế hoạch nhân giống của ta thất bại"
  stewardship_wealth.5001.c:0 "Da của chúng sẽ mang lại lợi nhuận tốt. Mang dao mổ tới!"

 #Investment advice (wealth friend), by Mathilda Bjarnehed
  stewardship_wealth.5002.t:0 "Một Lời Khuyên"
  stewardship_wealth.5002.start.desc:0 "Ta dạo bước giữa những quầy hàng tại chợ [capital.GetNameNoTooltip], túi tiền nặng trĩu kéo lệch thắt lưng. Làm sao để số tiền này sinh lời cho ta?\n\nKhi ta đang ngắm nghía hàng hóa của một "
  stewardship_wealth.5002.safe_smithy.desc:0 "thợ rèn — thép tốt,"
  stewardship_wealth.5002.safe_mason.desc:0 "thợ xây đá — hình khối hoàn hảo,"
  stewardship_wealth.5002.safe_religious_sculptor.desc:0 "nhà điêu khắc – hình tượng [ROOT.Char.GetFaith.GetAdjectiveNoTooltip],"
  stewardship_wealth.5002.safe_jeweler.desc:0 "thợ kim hoàn — hoa văn tinh xảo,"
  stewardship_wealth.5002.middle.desc:1 "một khoản đầu tư vững chắc – [investor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] bất ngờ xuất hiện bên cạnh ta.\n\n\"Một lời khuyên, [ROOT.Char.Custom2('RelationToMeAddress', investor)]? Hãy xem thử"
  stewardship_wealth.5002.risky_smithy.desc:0 "lò rèn"
  stewardship_wealth.5002.risky_mason.desc:0 "xưởng thợ đá"
  stewardship_wealth.5002.risky_religious_sculptor.desc:0 "quầy của nhà điêu khắc"
  stewardship_wealth.5002.risky_jeweler.desc:0 "quầy của thợ kim hoàn"
  stewardship_wealth.5002.end.desc:0 "đằng kia. Hàng hóa của họ có thể đơn giản, nhưng tiềm năng thì rất lớn.\""

  stewardship_wealth.5002.b.success:0 "[investor.GetFirstNameNoTooltip] và ta gắn kết nhờ một khoản đầu tư thành công"
  stewardship_wealth.5002.b.failure:0 "Khoản đầu tư của ta thất bại"
  stewardship_wealth.5002.b.failure.tt:0 "Ngươi mất số tiền đã đầu tư"

  stewardship_wealth.5002.a.smithy:0 "Đầu tư vào lò rèn."
  stewardship_wealth.5002.a.tavern:0 "Đầu tư vào một quán rượu."
  stewardship_wealth.5002.a.mason:0 "Đầu tư vào xưởng thợ đá."
  stewardship_wealth.5002.a.religious_sculptor:0 "Đầu tư vào xưởng điêu khắc."
  stewardship_wealth.5002.a.jeweler:0 "Đầu tư vào quầy thợ kim hoàn."
  stewardship_wealth.5002.c:0 "Kiếm lợi nhanh bằng vài thương vụ khôn ngoan."

#Roadside Stall selling carvings by Daniel Moore
  stewardship_wealth.6001.t:0 "Quầy Hàng Bên Đường"
  stewardship_wealth.6001.desc:0 "Trong lúc băng qua vùng [stall_county.Custom('TerrainTypeCountyScope')] của [stall_county.GetName], ta bắt gặp một quầy hàng dựng tạm bên lề đường.\n\nKhi ta dừng lại xem thử, một nông dân tên [stall_owner.GetFirstName] lập tức chạy tới, cố thuyết phục ta mua một trong những bức chạm khắc nhỏ hình [stall_owner.GetFaith.ReligiousSymbol] mà [stall_owner.GetSheHe] đang bày bán.\n\n\"Tôi tự tay làm chúng, thưa [ROOT.Char.Custom('FormOfAddressForLiege')], mỗi cái đều mất hàng giờ lao động.\""
  stewardship_wealth.6001.a:0 "Ta sẽ mua một cái."
  stewardship_wealth.6001.a.tt_high:0 "Ngươi nhận được một bức chạm khắc chất lượng cao"
  stewardship_wealth.6001.a.tt_low:0 "Ngươi nhận được một bức chạm khắc chất lượng thấp"
  stewardship_wealth.6001.b:0 "Ta nghi quầy này không nộp thuế — phá nó đi!"
  stewardship_wealth.6001.c:0 "Ta sẽ nói chuyện với [stall_owner.GetHerHim] để học hỏi đôi chút về nghệ thuật buôn bán."

  small_religious_carving:0 "Tượng Chạm Khắc Tôn Giáo Nhỏ"
  small_religious_carving_desc:0 "Đây là một bức chạm khắc nhỏ nhưng tinh xảo theo phong cách [stall_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip], khắc hình biểu tượng [stall_owner.GetFaith.ReligiousSymbol]."

# Rogue Administration by Jason Cantalini
  stewardship_wealth.7000.t:0 "Bộ Máy Thu Thuế Lệch Lạc"
  stewardship_wealth.7000.desc:0 "Với vẻ mặt đầy tự mãn, $knight_culture_player_no_tooltip_lowercase$ của ta là [enforcer.GetTitledFirstName] ném một bao tải phồng to xuống trước mặt ta.\n\n\"Nhìn xem,\" [enforcer.GetSheHe] nói.\n\nTa đổ hết đồ bên trong ra: kim loại quý, gia bảo, đủ loại đồ trang sức.\n\n\"Ta đã #EMP thuyết phục#! vài thường dân của [victim.GetTitledFirstNamePossessive],\" [enforcer.GetFirstNameNoTooltip] cười toe, \"rằng số thuế ấy vốn phải thuộc về ngài, thưa bệ hạ.\"\n\nMột khoản thu bất ngờ khá lớn! Và còn tốt hơn nữa — ta có thể tưởng tượng ra vẻ mặt tức tối của [victim.GetTitleAsNamePossessiveNoTooltip] đáng ghét kia."

  stewardship_wealth.7000.a:0 "Thật đáng đời tên [victim.Custom2('InsultAdjective', ROOT.Char)] [victim.GetFirstNameNoTooltip]!"
  stewardship_wealth.7000.b:0 "Ta có thể biện minh cho khoản thu này."
  stewardship_wealth.7000.b.tt:0 "Đổ tội, làm rối sự thật, hoàn trả chút ít — bất cứ điều gì để làm dịu lời buộc tội về bạo quyền"
  stewardship_wealth.7000.c:0 "Nhận lấy số của cải này. Hãy mang về thêm nữa."
  stewardship_wealth.7000.c.tt:0 "Trên lãnh địa của ngài và của [victim.GetHersHis], ngài sẽ giải phóng những kẻ thực thi công lý sắc bén nhất mà một [ROOT.Char.GetTitleAsNameNoTooltip] có thể yêu cầu!"
  stewardship_wealth.7000.d:0 "Than ôi... số đồ bị đánh cắp nên được trả lại."
  stewardship_wealth.7000.d.tt:0 "Báo thù là sai trái và đại loại thế..."

# Beyond Boundaries by Jason Cantalini
  stewardship_wealth.7001.t:0 "Vượt Quá Ranh Giới"
  stewardship_wealth.7001.desc:1 "Khốn kiếp [thieving_rival.GetTitledFirstName] cùng lũ tay sai trộm cắp của [thieving_rival.GetHerHis]! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('messenger'))] của ta là [messenger.GetTitledFirstName] lắp bắp truyền tin rằng, với sự trơ tráo trắng trợn, bọn côn đồ đó đã ép dân thường ở [ROOT.Char.GetCapitalLocation.GetName] giao nộp số của cải vốn phải thuộc về ta!\n\n[messenger.GetFirstNameNoTooltip] cho biết các quan chức của ta đã sẵn sàng đi thu các khoản phí thường lệ... nhưng ta đã thấy trước cảnh góa phụ khóc than, trẻ con chết đói, và những gia đình nghèo bị đuổi khỏi nhà.\n\nNgàn lời nguyền rủa dành cho linh hồn tham lam của [thieving_rival.GetTitledFirstNamePossessiveNoTooltip]!"
  stewardship_wealth.7001.tt.crime_alert:0 "[victim.GetTitledFirstName] sẽ ghi nhớ chuyện này"
  stewardship_wealth.7001.justification:0 "[thieving_rival.GetSheHe|U] lan truyền những lời dối trá yếu ớt về quyền của [thieving_rival.GetHerHis] với tư cách là lãnh chúa của ta, nhưng ta biết [thieving_rival.GetSheHe] đã lấy đi thứ thuộc về ta..."
  stewardship_wealth.7001.unleashed_knights:0 "[thieving_rival.GetSheHe|U] và đoàn tùy tùng của [thieving_rival.GetHerHis], lũ cướp đáng ghê tởm, ngày càng mang tiếng xấu..."

  stewardship_wealth.7001.a:0 "Ta vẫn giữ quyền được nhận khoản thu của mình."
  stewardship_wealth.7001.a.tt:0 "Phái những kẻ chấp pháp của ngươi tới các ngôi làng!"
  stewardship_wealth.7001.b:0 "Mối thù cá nhân của ta không phải của dân ta."
  stewardship_wealth.7001.b.tt:0 "Miễn thuế cho các nạn nhân của [thieving_rival.GetFirstNameNoTooltip]"

  stewardship_wealth.2000.t:0 "Cân Nhắc Cơ Hội"
  stewardship_wealth.2000.desc:0 "Ta bước qua những con phố của [loc_capital_county.GetNameNoTier] cùng với [ROOT.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] của mình, tìm kiếm cơ hội để cải thiện kho bạc đang vơi dần. Khi chúng ta tới khu nhà cân của chợ, [loc_steward.GetFirstName] bắt đầu nói bằng giọng thì thầm:\n\n\"Chúng ta có thể lặng lẽ kiếm thêm thu nhập nếu... #EMP sáng tạo#! một chút với thuế đánh lên hàng hóa được mang tới đây. Tôi có thể chuẩn bị một bộ đá cân khác, hơi điều chỉnh trọng lượng một chút nhưng trông vẫn giống hệt. Khi đó, với cùng số hàng hóa, các thương nhân sẽ phải trả nhiều hơn! Không ai nghi ngờ đâu!\"\n\nNếu ngài muốn, chúng ta có thể thay đổi các quả cân và nhìn tiền chảy vào kho bạc của ngài!\""
  stewardship_wealth.2000.a:0 "Đêm nay chúng ta sẽ thay đá cân."
  stewardship_wealth.2000.a.tt.success:0 "Những quả cân được thay đổi mà không ai nhận ra"
  stewardship_wealth.2000.a.tt.failure:0 "Âm mưu của ngươi bị phát hiện"
  stewardship_wealth.2000.b:0 "Chúng ta cần một bộ cân thực sự tốt hơn."
  stewardship_wealth.2000.b.tt:0 "Dù khó thực hiện, một giải pháp có lợi cho cả kho bạc của ngươi lẫn các thương nhân là hoàn toàn có thể."
