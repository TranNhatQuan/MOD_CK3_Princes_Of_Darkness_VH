l_english:

 # The Diplomatic craft — Mediating between disagreeing subjects, by Mathilda Bjarnehed 
  stewardship_duty.0001.t:0 "Bài Tập Hòa Giải"
  stewardship_duty.0001.start.desc:0 "Khi những tiếng cãi vã lại một lần nữa vọng đến tai ta, ta cố kìm bản năng quay lưng bỏ đi. Sự cãi cọ không ngừng của"
  stewardship_duty.0001.vassals.desc:0 "hai chư hầu của ta là [arguer_1.GetTitledFirstName] và [arguer_2.GetTitledFirstName]"
  stewardship_duty.0001.vassalandcourtier.desc:0 "chư hầu của ta [arguer_1.GetTitledFirstName] và [arguer_2.Custom2('MyCharacterIntroduction', ROOT.Char)]"
  stewardship_duty.0001.end.desc:0 "đủ khiến bất cứ [ROOT.Char.GetWomanMan] nào phát điên — hẳn phải có cách giải quyết!\n\nTa có thể xem tình huống này như một bài tập hòa giải, hoặc lén nghe rồi sau đó tiếp cận một trong hai người với lời cảm thông..."
  stewardship_duty.0001.a:0 "Cố khiến họ nhìn ra lẽ phải."
  stewardship_duty.0001.b:0 "\"Hừ, [arguer_2.GetFirstNameNoTooltip] đúng là một [arguer_2.Custom2('InsultNoun', ROOT.Char)]!\""
  stewardship_duty.0001.c:0 "\"Ngươi có tin nổi [arguer_1.GetFirstNameNoTooltip] không? [arguer_1.GetSheHe|U] thật quá trơ trẽn!\""
  stewardship_duty.0001.a.success.tt:0 "Cuộc hòa giải của ta thành công"
  stewardship_duty.0001.a.failure.tt:0 "Ta trông như một kẻ xen vào vô duyên"
  stewardship_duty_0001_mediation_success.tt:0 "[arguer_1.GetShortUIName|U] và [arguer_2.GetShortUIName] tăng [opinion|e] đối với nhau"

 # Conflict at the Council, by Mathilda Bjarnehed
  stewardship_duty.0017.t:0 "Tiếng Nói Lý Trí"
  stewardship_duty.0017.start.desc:0 "Một buổi họp hội đồng nữa, lại thêm một cuộc tranh cãi. [councillor_1.GetCouncilTitle] [councillor_1.GetFirstName] và [councillor_2.GetCouncilTitle] [councillor_2.GetFirstName] đang cãi vã dữ dội về"
  stewardship_duty.0017.war.desc:0 "cuộc chiến đang diễn ra."
  stewardship_duty.0017.election.desc:0 "việc bầu chọn người kế vị ta."
  stewardship_duty.0017.building_projects.desc:0 "những công trình xây dựng sắp tới."
  stewardship_duty.0017.troop_training.desc:0 "chế độ huấn luyện quân lính."
  stewardship_duty.0017.charity_projects.desc:0 "dự án từ thiện tiếp theo của ta."
  stewardship_duty.0017.religious_minorities.desc:0 "vấn đề các nhóm tôn giáo thiểu số."
  stewardship_duty.0017.health_issues.desc:0 "dịch bệnh đang lan rộng."
  stewardship_duty.0017.end.desc:0 "\n\nVới tư cách là [ROOT.GetCharacter.GetTitleAsNameNoTooltip], ta có thể khiến họ im lặng chỉ bằng một lời, nhưng ta có ý hay hơn. Những kinh nghiệm ngoại giao đã dạy ta cách xử lý tình huống như thế này để làm hài lòng mọi người."
  stewardship_duty.0017.a:0 "Ủng hộ [councillor_1.GetFirstNameNoTooltip] mà không làm phật ý [councillor_2.GetFirstNameNoTooltip]."
  stewardship_duty.0017.b:0 "Ủng hộ quan điểm của [councillor_2.GetFirstNamePossessiveNoTooltip] mà không làm phật ý [councillor_1.GetFirstNameNoTooltip]."
  stewardship_duty.0017.c:0 "Tìm một thỏa hiệp khiến mọi người đều hài lòng."
  stewardship_duty.0017.c.criticial_success.tt:0 "Ta đạt được một thỏa hiệp tuyệt vời"
  stewardship_duty.0017.c.criticial_success.desc:0 "Ta đã dàn xếp một thỏa hiệp tuyệt vời, khiến cả [councillor_1.GetFirstName] và [councillor_2.GetFirstName] đều hài lòng."
  stewardship_duty.0017.c.success.tt:0 "Ta đạt được một thỏa hiệp tốt"
  stewardship_duty.0017.c.success.desc:0 "Ta đã dàn xếp một thỏa hiệp hợp lý, làm dịu cả [councillor_1.GetFirstName] và [councillor_2.GetFirstName]."
  stewardship_duty.0017.c.failure.tt:0 "Ta không thể tìm được thỏa hiệp"
  stewardship_duty.0017.c.failure.desc:0 "Ta không thể tìm được thỏa hiệp, khiến cả [councillor_1.GetFirstName] và [councillor_2.GetFirstName] đều thất vọng."

 # Unwanted Pregnancy, by Sean Hughes
  stewardship_duty.1055.t:0 "Mang Thai Ngoài Ý Muốn"
  stewardship_duty.1055.desc:0 "Một cảnh tượng kịch tính diễn ra trong phòng tiếp kiến của ta khi [new_mothers_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] cáo buộc [new_father.Custom2('MyCharacterIntroduction', ROOT.Char)] đã khiến [new_mothers_parent.GetHerHis] [new_mothers_parent.Custom2('RelationToMeShort', new_mother)][new_mother.Custom('Governance_1055_OutOfWedlock')] mang thai.\n\n[new_fathers_parent.GetTitledFirstName] phẫn nộ tuyên bố rằng không có bằng chứng nào về tội lỗi của con trai mình. \"Và dù có là nó đi nữa, thì cũng là lỗi của [new_mother.GetFirstNamePossessive] vì sống buông thả!\"\n\nCuộc cãi vã ngày càng căng thẳng, và ta phải làm gì đó trước khi mọi chuyện vượt khỏi tầm kiểm soát."
  stewardship_duty.1055.a:0 "Ngươi sẽ có được công lý mà ngươi mong muốn, [new_mothers_parent.GetFirstNameNoTooltip]."
  stewardship_duty.1055.b:0 "[new_father.GetFirstNameNoTooltip] vô tội, hắn không nợ [new_mothers_parent.GetFirstNameNoTooltip] điều gì!"
  stewardship_duty.1055.e:0 "Sao các ngươi lại làm phiền ta vì chuyện cãi vã tầm thường này!?"

 # Wealth Aplenty, by Sean Hughes
  stewardship_duty.1062.t:0 "Của Cải Dồi Dào"
  stewardship_duty.1062.desc:0 "Ngân khố của ta tràn đầy vàng bạc, và mọi chi phí đều được chăm lo. Là một [ROOT.Char.GetLadyLord] giàu có, ta [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'có thể','được kỳ vọng sẽ')] bảo trợ cho một nghệ sĩ hoặc học giả nào đó.\n\nThật may mắn, ba ứng cử viên tiềm năng vừa đến [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]... nhưng liệu có ai trong số họ gây ấn tượng với ta không?"
  stewardship_duty.1062.a:0 "[client_1.GetTitledFirstNameNoTooltip] nổi tiếng với việc tạo ra những khu vườn tuyệt đẹp."
  stewardship_duty.1062.b:0 "Những bài thơ tôn giáo của [client_2.GetTitledFirstNamePossessiveNoTooltip] đã lay động nhiều tâm hồn."
  stewardship_duty.1062.c:0 "Những phát kiến của [client_3.GetTitledFirstNameNoTooltip] cho thấy nhiều hứa hẹn."
  stewardship_duty.1062.d:0 "Không, ta còn kế hoạch khác cho số tiền đó..."
  stewardship_duty.1062.e:0 "Kỳ vọng ư? Hừ! Ta sẽ đi tận hưởng vinh quang của kho báu mình!"

  stewardship_duty.1063.t:0 "Gia Hạn Bảo Trợ"
  stewardship_duty.1063.desc:0 "Sau 5 năm, khoản tiền ta dành để bảo trợ cho [client.Custom('Governance_1062_Client')] của ta là [client.GetTitledFirstName] đã cạn. Giờ ta có thể chọn gia hạn bảo trợ thêm 5 năm nữa hoặc để [client.GetHerHim] rời đi."
  stewardship_duty.1063.a:0 "Gia hạn sự bảo trợ của ta thêm một kỳ."
  stewardship_duty.1063.b:0 "[client.GetSheHe|U] đã làm việc rất tốt, hãy thưởng thêm cho [client.GetHerHim]!"
  stewardship_duty.1063.c:0 "Dịch vụ của [client.GetHerHis|U] không còn cần thiết."

  stewardship_duty.1064.desc:0 "[client.Custom('Governance_1062_Client_U')] của ta đã rời khỏi triều đình"
  stewardship_duty.1065.desc:0 "[client.Custom('Governance_1062_Client_U')|U] của ta đã qua đời"
  stewardship_duty.1065.guilty.desc:0 "Ta đã giết [client.Custom('Governance_1062_Client_U')] của mình"
  stewardship_duty.1066.desc:0 "Ta đã tống giam [client.Custom('Governance_1062_Client_U')] của mình"

  stewardship_duty.1068.desc.a:0 "Chư hầu ấn tượng với khu vườn của ta"
  stewardship_duty.1068.desc.b:0 "[ROOT.Char.GetFaith.AltPriestTermPlural|U] ấn tượng với [client.Custom('Governance_1062_Client_U')] của ta"
  stewardship_duty.1068.desc.c:0 "[client.Custom('Governance_1062_Client_U')] đã có phát kiến mới"

 # Serf Refugees, by Sean Hughes
  stewardship_duty.1071.t:0 "Nông Nô Tị Nạn"
  stewardship_duty.1071.desc:0 "Một làn sóng nông nô đã tràn vào [target_county.GetName] từ vùng [origin_county.GetName] lân cận. Họ nói rằng họ đang chạy trốn khỏi sự cai trị tàn bạo của [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], và mong được sống dưới quyền cai trị của ta thay vì của [origin_county_owner.GetHerHis].\n\nXét theo luật pháp, họ vẫn là nông nô của [origin_county_owner.GetFirstName], nhưng nếu ta cho họ định cư trong lãnh địa của mình thì gần như không thể để [origin_county_owner.GetHerHim] chứng minh họ thực sự là nông nô của [origin_county_owner.GetHerHis]."
  stewardship_duty.1071.a:0 "Tử tế trả lại các nông nô cho [origin_county_owner.GetFirstNameNoTooltip]."
  stewardship_duty.1071.b:0 "Trả họ về, nhưng khiển trách nghiêm khắc [origin_county_owner.GetFirstNameNoTooltip]."
  stewardship_duty.1071.c:0 "Hãy dẫn #EMP nông nô của ta#! đến những nông trại mới..."
  stewardship_duty.1071.c.compassionate:0 "Ta sẽ cho họ tị nạn khỏi [origin_county_owner.GetFirstNameNoTooltip]..."
  stewardship_duty.1071.c.flavor:0 "...và mong rằng [origin_county_owner.GetFirstName] sẽ không biết ta dính líu!"

  stewardship_duty.1072.opening:0 "[origin_county_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
  stewardship_duty.1072.desc.rival:0 "Ta biết ngươi đã cướp nông nô của ta. Dù ta không có cách nào lấy lại họ, đừng tưởng ta sẽ quên sự xúc phạm này. Ngươi đã chuốc lấy thù hằn của ta — mong rằng điều đó xứng đáng."
  stewardship_duty.1072.desc.relationship:0 "Vì sao ngươi lại cướp nông nô của ta!? Ta thực sự sốc và đau lòng khi ngươi phản bội ta như vậy... Ta không biết liệu còn có thể nhìn ngươi như trước sau chuyện này."
  stewardship_duty.1072.desc.vassal:0 "Ta biết ngươi đã đưa nông nô của ta đến định cư trên đất của ngươi. Vì sao ngươi lại làm vậy với chính chư hầu của mình? Chẳng phải ta vẫn luôn nộp thuế đầy đủ cho ngươi sao?\n\nKhông còn nông nô làm việc trên ruộng, ta chẳng thể trồng trọt gì. Chẳng khác nào ngươi đã cướp luôn đất của ta! Ta sẽ không quên sự xúc phạm này."
  stewardship_duty.1072.desc.subvassal:0 "Ta biết ngươi đã đưa nông nô của ta đến định cư trên đất của mình. Hành động như vậy phá vỡ chính nền tảng của xã hội!\n\nDù giờ ta không thể làm gì, hãy yên tâm rằng [origin_county_owner_liege.GetTitledFirstName] sẽ biết vì sao năm nay ta có ít thuế hơn để nộp cho [origin_county_owner_liege.GetHerHim]."
  stewardship_duty.1072.a:0 "Đó là nông nô của ngươi sao? Ta xin lỗi, ta sẽ trả họ lại."
  stewardship_duty.1072.b:0 "Cứ than phiền bao nhiêu tùy thích, cũng chẳng thay đổi được gì."
  stewardship_duty.1072.b.compassionate:0 "Đó là lỗi của ngươi. Ngươi không nên ngược đãi họ."

 # Vassal Factionalism — Persuade a vassal to leave a faction for 10 years, by Sean Hughes
  stewardship_duty.4010.t:0 "Phe Phái Chư Hầu"
  stewardship_duty.4010.desc.start:0 "[faction_member.GetTitledFirstName] đã dùng ảnh hưởng của [faction_member.GetHerHis] để thúc đẩy sự phát triển của"
  stewardship_duty.4010.desc.independence:1 "[targeting_faction.GetName]. Họ muốn thoát khỏi sự cai trị của ta, cho rằng ta không phải chủ quân chính đáng của họ."
  stewardship_duty.4010.desc.liberty:0 "[targeting_faction.GetName]. Họ muốn bãi bỏ một số luật trong [ROOT.Char.GetPrimaryTitle.GetName] mà họ cho là xâm phạm quyền truyền thống của [faction_member.Custom('StatecraftGetVassalType')]."
  stewardship_duty.4010.desc.claimant:2 "[targeting_faction.GetName], tin rằng kẻ đứng đầu của họ cuối cùng sẽ là một vị quân chủ tốt hơn ta."
  stewardship_duty.4010.desc.peasant:0 "[targeting_faction.GetName]. Họ không hài lòng khi phải phục tùng một người mà họ xem là [ROOT.Char.Custom2('GetUnbelieverAndForeignerTerm', faction_member)], và muốn có một vị cai trị như [faction_leader.GetTitledFirstName], người cùng văn hóa và tín ngưỡng với họ."

  stewardship_duty.4010.desc.end:0 "\n\nTa không nghi ngờ niềm tin của [faction_member.GetFirstNamePossessiveNoTooltip], nhưng [faction_member.GetSheHe] cũng chỉ là con người. Nếu ta thuyết phục được [faction_member.GetHerHim] kiềm chế những hoạt động này, việc củng cố quyền lực của ta đối với các chư hầu sẽ dễ dàng hơn."
  stewardship_duty.4010.bribe:0 "Một món quà hậu hĩnh sẽ khiến [faction_member.GetHerHis] đổi ý."
  stewardship_duty.4010.bribe.flavor:0 "Những [faction_member.GetWomenMen] vị kỷ thường dễ nhận hối lộ hơn."
  stewardship_duty.4010.favor:0 "Nếu [faction_member.GetSheHe] giúp ta lúc này, ta sẽ trả ơn."
  stewardship_duty.4010.favor.flavor:0 "Những [faction_member.GetWomenMen] vị kỷ hoặc nhân hậu dễ chấp nhận đề nghị này."
  stewardship_duty.4010.prestige:0 "Những lời tán dương cổ điển luôn khơi dậy lòng trung thành."
  stewardship_duty.4010.prestige.flavor:0 "Những [faction_member.GetWomenMen] kiêu hãnh hoặc danh dự dễ bị lay động bởi lời khen."
  stewardship_duty.4010.piety:0 "Nhắc [faction_member.GetHerHim] rằng lợi ích của ta cũng là lợi ích của [faction_member.GetFaith.HighGodNamePossessive]."
  stewardship_duty.4010.piety.flavor:0 "Những [faction_member.GetWomenMen] sùng đạo thường hành động theo đức tin của họ."
  stewardship_duty.4010.attempt.tt:0 "Quyết định của [faction_member.GetTitledFirstNamePossessiveNoTooltip] sẽ phụ thuộc vào tính cách của [faction_member.GetHerHis]"
  stewardship_duty.4010.success:0 "[faction_member.GetTitledFirstNameNoTooltip] chấp nhận đề nghị của ta"
  stewardship_duty.4010.failure:0 "[faction_member.GetTitledFirstNameNoTooltip] từ chối đề nghị của ta"
  stewardship_duty.4010.decline:0 "[faction_member.GetTitledFirstNameNoTooltip] chỉ đang thực thi quyền của [faction_member.GetHerHis]."
  stewardship_duty.4010.decline.tt:0 "Mọi [faction_member.GetWomenMen] đều thích được tự do làm điều mình muốn."

  stewardship_duty.4011-4.desc.start:0 "[my_liege.GetTitledFirstName] đã tìm đến ta, nói rằng việc ta tham gia [targeting_faction.GetName] đang gây khó khăn lớn cho [my_liege.GetHerHim], và rằng việc này cần phải chấm dứt."

  stewardship_duty.4011-4.b:0 "Ta sẽ không rời bỏ con đường của mình!"
  stewardship_duty.4011-4.b.tt:0 "Ta vẫn ở lại trong [targeting_faction.GetName]"
 
  stewardship_duty.4011.t:0 "Lời Mời Gọi Của Lòng Tham"
  stewardship_duty.4011.desc:0 "\n\nĐể đạt được điều đó, [my_liege.GetSheHe] đã đưa cho ta một túi tiền nặng trĩu như phần thưởng nếu ta rời khỏi phe phái và chú tâm vào những việc khác."
  stewardship_duty.4011.a:0 "Một giao dịch công bằng."

  stewardship_duty.4012.t:0 "Lời Mời Gọi Của Tham Vọng"
  stewardship_duty.4012.desc:0 "\n\n[my_liege.GetSheHe|U] cầu xin ta nhìn sự việc từ góc nhìn của [my_liege.GetHerHis], và hứa ban ân huệ nếu ta chấm dứt việc ủng hộ phe phái."
  stewardship_duty.4012.a:0 "Ngươi giúp ta, ta giúp lại ngươi!"

  stewardship_duty.4013.t:0 "Lời Mời Gọi Của Niềm Kiêu Hãnh"
  stewardship_duty.4013.desc:0 "\n\nVì vậy [my_liege.GetSheHe] hứa sẽ công khai ca ngợi công lao của ta trong những lĩnh vực khác, qua đó nâng cao danh tiếng của ta trong [my_liege.GetPrimaryTitle.GetName]."
  stewardship_duty.4013.a:0 "Chỉ cần [my_liege.GetSheHe] tán dương [faction_member.Custom('quirk_pos_noun')] của ta, ta sẽ hài lòng."

  stewardship_duty.4014.t:0 "Lời Mời Gọi Của Đức Tin"
  stewardship_duty.4014.desc:0 "\n\nSau đó [my_liege.GetSheHe|U] nhắc ta rằng [my_liege.GetSheHe] ngồi trên ngai vàng theo ý chỉ của [faction_member.GetFaith.HighGodNamePossessive], và chống lại [my_liege.GetHerHim] cũng chính là chống lại [faction_member.GetFaith.HighGodName]."
  stewardship_duty.4014.a:0 "Ta phục vụ [faction_member.GetFaith.HighGodName] khi phục vụ [my_liege.GetTitledFirstNameNoTooltip]."

  stewardship_duty.4015.t:0 "Chư Hầu Từ Bỏ Phe Phái"
  stewardship_duty.4015.desc:0 "Bằng cách làm rõ ràng [faction_member.GetSheHe] sẽ đạt được gì khi trung thành với ta, ta đã thuyết phục được [faction_member.GetTitledFirstName] từ bỏ sự ủng hộ của [faction_member.GetHerHis] đối với [targeting_faction.GetName].\n\nNhững bất bình của [faction_member.GetHerHis|U] đơn giản là quá tầm thường so với những gì ta có thể mang lại!"
  stewardship_duty.4015.a:0 "Ta biết mình có thể khiến [faction_member.GetHerHim] hiểu ra!"

  stewardship_duty.4019.t:0 "Chư Hầu Bám Chặt Phe Phái"
  stewardship_duty.4019.desc:0 "Dù ta đã cố hết sức thuyết phục [faction_member.GetHerHim], [faction_member.GetTitledFirstName] vẫn từ chối rời khỏi [targeting_faction.GetName], và [faction_member.GetSheHe] tiếp tục đặt lợi ích của họ lên trên lợi ích của ta."
  stewardship_duty.4019.a:0 "Sao [faction_member.GetSheHe] không thấy lợi ích khi đứng về phía ta?"

  stewardship_duty.4020.t:0 "Đề Nghị Không Còn Hiệu Lực"
  stewardship_duty.4020.desc:0 "[faction_member.GetTitledFirstName] không còn thuộc phe phái nào."
  stewardship_duty.4020.desc.switch:0 "[faction_member.GetTitledFirstName] đã đổi sang phe phái khác."

 # Altering the Deal - Persuade a vassal to accept a contract change, by Sean Hughes
  stewardship_duty.4040.t:0 "Thay Đổi Khế Ước"
  stewardship_duty.4040.desc:0 "[ROOT.Char.Custom2('RelationToMe', my_vassal)] của ta, [my_vassal.GetTitledFirstName], có một khế ước khá dễ dãi với ta, miễn cho [my_vassal.GetHerHim] nhiều nghĩa vụ mà ta thường yêu cầu từ chư hầu.\n\nNếu ta khiến [my_vassal.GetHerHim] chấp nhận gia tăng nghĩa vụ, điều đó sẽ có lợi lớn cho lãnh địa về lâu dài..."
  stewardship_duty.4040.a:0 "Một phần thưởng đủ lớn sẽ mua được sự đồng ý của [my_vassal.GetHerHis]."
  stewardship_duty.4040.b:0 "Ta tin mình có thể thuyết phục [my_vassal.GetHerHim] chấp nhận thay đổi."
  stewardship_duty.4040.b.success:0 "[my_vassal.GetFirstNameNoTooltip] bị thuyết phục chấp nhận thay đổi khế ước"
  stewardship_duty.4040.b.failure:0 "[my_vassal.GetFirstNameNoTooltip] vẫn không chấp nhận thay đổi khế ước"
  stewardship_duty.4040.c:0 "[my_vassal.GetSheHe|U] sẽ chấp nhận thay đổi của ta, nếu không thì..."
  stewardship_duty.4040.c.success:0 "[my_vassal.GetFirstNameNoTooltip] bị ép phải chấp nhận thay đổi khế ước"
  stewardship_duty.4040.c.failure:0 "[my_vassal.GetFirstNameNoTooltip] từ chối thay đổi khế ước"
  stewardship_duty.4040.d:0 "Lòng trung thành quý hơn quân dịch."
  stewardship_duty.4040.d.tt:0 "#F [my_vassal.GetFirstNameNoTooltip] giữ hợp đồng hiện tại của [my_vassal.GetHerHis] với sự chúc phúc của ta:#!"

  stewardship_duty.4040.contractchange:0 "Ta có thể thay đổi khế ước của [my_vassal.GetTitledFirstNamePossessive] theo hướng có lợi cho ta."

  stewardship_duty.4041.desc:0 "Trong nỗ lực thuyết phục [my_vassal.GetTitledFirstName] chấp nhận một hợp đồng hạn chế hơn, Ta đã ngồi lại với [my_vassal.GetHerHim] và giải thích cặn kẽ lý do tại sao cần phải cập nhật nó. \n\n[my_vassal.GetSheHe|U] lúc đầu tỏ ra miễn cưỡng, nhưng sau nhiều hồi thảo luận, Ta đã khiến [my_vassal.GetHerHim] đồng ý rằng việc sửa đổi hợp đồng của [my_vassal.GetHerHis] là điều hợp lý."
  stewardship_duty.4041.a:0 "Ta biết rõ cách khiến [my_vassal.GetHerHim] bị thuyết phục!"

  stewardship_duty.4042.desc:0 "Ngay từ đầu cuộc trò chuyện, Ta đã biết mình sẽ gặp khó khăn khi thuyết phục [my_vassal.GetTitledFirstName] từ bỏ các quyền lợi mà [my_vassal.GetSheHe] được hưởng theo hợp đồng của [my_vassal.GetHerHis].\n\nBất chấp mọi nỗ lực và lời lẽ của Ta, [my_vassal.GetSheHe] vẫn giữ vững lập trường, tuyên bố rằng nếu Ta không thể xoay xở với những gì [my_vassal.GetSheHe] hiện đang cung cấp, thì đó là lỗi của Ta chứ không phải lỗi của [my_vassal.GetHerHis]."
  stewardship_duty.4042.a:0 "Ta sẽ phải thử cách khác..."

  stewardship_duty.4043.desc:0 "Đó không phải là một cuộc đàm phán — mà là một mệnh lệnh. Ta đã làm rõ với [my_vassal.GetTitledFirstName] rằng [my_vassal.GetSheHe] tiếp tục giữ được các tước hiệu của [my_vassal.GetHerHis] chỉ vì điều đó làm Ta hài lòng, và nếu [my_vassal.GetSheHe] muốn duy trì sự ân sủng của Ta thì cần phải nhượng bộ.\n\n[my_vassal.GetSheHe|U] vội vàng đồng ý, mừng rỡ khi Ta rời đi mà không gây thêm rắc rối nào."
  stewardship_duty.4043.a:0 "$stewardship_duty.4041.a$"

  stewardship_duty.4044.desc:0 "[my_vassal.GetTitledFirstName] tỏ ra phản đối khi ta yêu cầu [my_vassal.GetSheHe] chấp nhận một khế ước khắt khe hơn.\n\n[my_vassal.GetSheHe|U] nói rằng dù ta là [ROOT.Char.GetTitleAsNameNoTooltip] và là người cai trị vùng đất này, khế ước hiện tại của [my_vassal.GetHerHis] vẫn cho [my_vassal.GetHerHim] những đặc quyền mà ta không thể tùy tiện tước bỏ — ít nhất là không hợp pháp."
  stewardship_duty.4044.a:0 "$stewardship_duty.4042.a$"

 # Faction Organizing — Lower a faction's discontent during wartime, by Sean Hughes
  stewardship_duty.4060.t:0 "Tổ Chức Phe Phái"
  stewardship_duty.4060.desc.default:0 "Ngay cả giữa lúc chiến tranh, [faction_leader.GetTitledFirstName] và những kẻ ủng hộ [faction_leader.GetHerHis] trong [targeting_faction.GetName] vẫn sẵn sàng vin vào bất kỳ cái cớ nào để thúc đẩy chương trình nghị sự của họ!"
  stewardship_duty.4060.desc.self_claim:0 "Ngay cả giữa lúc chiến tranh, [faction_leader.GetTitledFirstName] vẫn sẵn sàng vin vào bất kỳ cái cớ nào để thúc đẩy yêu sách của [faction_leader.GetHerHis] đối với [targeting_faction.GetSpecialTitle.GetName]!"
  stewardship_duty.4060.desc.other_claim:0 "Ngay cả giữa lúc chiến tranh, [faction_leader.GetTitledFirstName] vẫn sẵn sàng vin vào bất kỳ cái cớ nào để thúc đẩy yêu sách của [targeting_faction.GetSpecialCharacter.GetTitledFirstNamePossessive] đối với [targeting_faction.GetSpecialTitle.GetName]!"
  stewardship_duty.4060.desc.end:0 "\n\nTrong khi binh lính và vàng bạc của ta đang hao mòn trên chiến trường, ta phải cân nhắc kỹ những lựa chọn mình có để giảm thiểu mối đe dọa này..."
  stewardship_duty.4060.a:0 "Ta #EMP phải#! khiến vương quốc đoàn kết."
  stewardship_duty.4060.a.success:0 "Ta thuyết phục phe phái thể hiện sự đoàn kết"
  stewardship_duty.4060.a.success.every_faction_member:0 "Mọi thành viên của [targeting_faction.GetName|V]"
  stewardship_duty.4060.a.failure:0 "Phe phái không bị lay chuyển bởi lời nói của ta"
  stewardship_duty.4060.b:0 "Một khoản tiền kha khá sẽ khiến [faction_leader.GetHerHim] chùn bước..."
  stewardship_duty.4060.c:0 "[faction_leader.GetSheHe|U] không được phép thực hiện kế hoạch của [faction_leader.GetHerHis]!"
  stewardship_duty.4060.d:0 "Ta không thể bận tâm đến chuyện này lúc này."
  stewardship_duty.4060.attempt.tt:0 "[faction_leader.GetTitledFirstNameNoTooltip] sẽ quyết định dựa trên tính cách của [faction_leader.GetHerHis]"
  stewardship_duty.4060.decline.tt:1 "Ngươi tạm thời phớt lờ phe phái"
  stewardship_duty.4060.failure.tt:0 "[targeting_faction.GetName] không mất đi mức bất mãn nào"

 # A Vassal cheats their contract, by Linnéa Thimrén
  stewardship_duty.5021.t:0 "Chư Hầu Bất Trung"
  stewardship_duty.5021.desc:0 "Ta đang xem xét những sổ sách ghi lại thu nhập từ các chư hầu. Những con số này không khớp... Tên [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('cheater_vassal'))] [cheater_vassal.GetTitledFirstName] tưởng ta là kẻ ngu và đã nộp thiếu cống nạp!"
  stewardship_duty.5021.a:0 "[cheater_vassal.GetTitleAsNameNoTooltip] phải trả đủ phần của [cheater_vassal.GetHerHis]."
  stewardship_duty.5021.a.message_1:0 "[cheater_vassal.GetFirstNameNoTooltip] trả lại những gì [cheater_vassal.GetSheHe] nợ ta"
  stewardship_duty.5021.a.message_2:0 "Ta nghi ngờ [cheater_vassal.GetFirstNameNoTooltip] vẫn còn giấu tiền"
  stewardship_duty.5021.b:0 "Từ nay ta sẽ quản [cheater_vassal.GetHerHim] thật chặt!"
  stewardship_duty.5021.c:0 "Ai mà chẳng từng tìm cách làm đầy túi mình?"

 # Resolve a war between two ai vassals, by Linnéa Thimrén
  stewardship_duty.7001.t:0 "Chư Hầu Giao Chiến"
  stewardship_duty.7001.desc:0 "Hai chư hầu của ta, [war_vassal.GetTitledFirstName] và [war_vassal_2.GetTitledFirstName], đang giao chiến với nhau. Cuộc '[war_scope.GetName]' này có nguy cơ làm bất ổn cả vương quốc, và ta phải hành động nhanh nếu muốn can thiệp."
  stewardship_duty.7001.a:0 "Thuyết phục họ gác lại hiềm khích."
  stewardship_duty.7001.a.desc_1:0 "[war_vassal.GetFirstNameNoTooltip] nhận ra sự khôn ngoan của hòa bình"
  stewardship_duty.7001.a.desc_2:0 "[war_vassal.GetFirstNameNoTooltip] không nghe theo lập luận của ta"
  stewardship_duty.7001.b:0 "Chuyện này là của họ — ta sẽ không can thiệp."
  stewardship_duty.7001.c:0 ""Các ngươi sẽ dừng sự ngu xuẩn này lại. #EMP Ngay!#!"" 

  stewardship_duty.7002.toast.peace:0 "[war_vassal.GetFirstName] và [war_vassal_2.GetFirstName] đã đồng ý hòa bình trắng"
  stewardship_duty.7002.toast.invalid:0 "Cuộc [war_scope.GetName] đã kết thúc trước khi ta kịp can thiệp"

 # About that Favor, by Stephen Arthur and Sean Hughes
  stewardship_duty.7023.t:0 "Về Ân Huệ Kia..."
  stewardship_duty.7023.desc:0 "Việc ta nợ một ân huệ lớn với [hook_holder.GetTitledFirstName] khiến ta nặng lòng.\n\nSẽ thật nhẹ nhõm nếu ta có thể giải quyết nó ngay lúc này, theo điều kiện của mình. Nếu chờ [hook_holder.GetHerHim] đòi lại, ta có thể rơi vào tình thế khó xử."
  stewardship_duty.7023.success:0 "Ta thuyết phục [hook_holder.GetFirstNameNoTooltip] xóa bỏ ân huệ mà Ta nợ [hook_holder.GetHerHim]."
  stewardship_duty.7023.failure:0 "[hook_holder.GetFirstNameNoTooltip] khăng khăng đòi Ta phải trả ân huệ mà Ta nợ [hook_holder.GetHerHim]."
  stewardship_duty.7023.a:0 "Đưa [hook_holder.GetHerHim] vàng để giải quyết chuyện này."
  stewardship_duty.7023.a.success:0 "[hook_holder.GetTitledFirstNameNoTooltip] chấp nhận vàng của Ta thay cho ân huệ mà Ta nợ [hook_holder.GetHerHim]."
  stewardship_duty.7023.b:0 "Thuyết phục [hook_holder.GetHerHim] bỏ qua chuyện cũ."
  stewardship_duty.7023.c:0 "[hook_holder.GetSheHe|U] sẽ quên chuyện này đi, nếu không thì..."
  stewardship_duty.7023.d:0 "Một [ROOT.Char.GetHouse.GetBaseNameNoTooltip] luôn trả các khoản nợ của mình!"
  stewardship_duty.7023.d.tt:0 "Ta vẫn nợ [hook_holder.GetTitledFirstName] một ân huệ."
  stewardship_duty.7023.player:0 "#weak Người chơi khác luôn có thể từ chối, dù họ có thể nhận [stress|e] vì làm vậy.#!"

  stewardship_duty.7023.invalidated.hooked_ruler:0 "Vì Ta không còn nợ [hook_holder.GetTitledFirstName] ân huệ nào nữa, yêu cầu của Ta về việc xóa bỏ nó không còn hiệu lực."
  stewardship_duty.7023.invalidated.hook_holder:0 "Vì [hooked_ruler.GetTitledFirstName] không còn nợ ta ân huệ, yêu cầu của [hooked_ruler.GetHerHis] về việc ta bỏ qua nó không còn hợp lệ."

  stewardship_duty.7025.opening:0 "[hooked_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
  stewardship_duty.7025.desc.gold:0 "Ngươi từng giúp ta một việc lớn, và ta rất biết ơn. Để đáp lại, ta muốn trao cho ngươi một phần kho bạc của mình.\n\nNgươi thấy đề nghị này có chấp nhận được không?"
  stewardship_duty.7025.desc.diplomacy.success:0 "Ta viết thư để bàn về ân huệ mà ta từng nợ ngươi. Những người hợp lý đều sẽ đồng ý rằng hành động của ta trong quá khứ đã đủ để hoàn thành nghĩa vụ.\n\nVì vậy, ta cho rằng ta không còn nợ ngươi gì nữa."
  stewardship_duty.7025.desc.diplomacy.failure:0 "Ta nợ ngươi một ân huệ, nhưng thật ra ta không muốn. Ý ta là, ai lại muốn nợ ai chứ?\n\nHay là ngươi... quên luôn ân huệ đó đi? Ta sẽ rất vui nếu vậy."
  statectaft_ongoing.7025.desc.intimidation.success:0 "Ngươi có thể đã từng giúp ta, nhưng đừng nghĩ ta nợ ngươi điều gì. Chỉ riêng việc được ở trong ân sủng của ta đã là phần thưởng đủ rồi. Tin ta đi, ngươi không muốn biến ta thành kẻ thù..."
  stewardship_duty.7025.desc.intimidation.failure:0 "Ngươi dường như tưởng rằng mình xứng đáng nhận ân huệ của ta. Ta không nợ gì một [hook_holder.Custom2('InsultAdjective', SCOPE.sC('hooked_ruler'))] [hook_holder.Custom2('InsultNoun', SCOPE.sC('hooked_ruler'))] như ngươi! Quên chuyện đó đi, nếu không thì..."
  stewardship_duty.7025.gold.a:0 "Ta sẽ lấy vàng."
  stewardship_duty.7025.gold.b:0 "Ân huệ đáng giá hơn vàng."
  stewardship_duty.7025.diplomacy.a:0 "Một lập luận thuyết phục."
  stewardship_duty.7025.diplomacy.b:0 "[hooked_ruler.GetSheHe] nghiêm túc đấy à?! Không đời nào!"
  stewardship_duty.7025.intimidation.a:0 "Ta không muốn chọc giận [hooked_ruler.GetHerHim]..."
  stewardship_duty.7025.intimidation.b:0 "Những lời đe dọa suông sẽ chẳng giúp [hooked_ruler.GetHerHim] đạt được điều gì cả!"
  stewardship_duty.7025.refuse.tt:0 "[hooked_ruler.GetTitledFirstName] vẫn còn nợ ta một ân huệ"
  stewardship_duty.7025.stress.tt:0 "Ta có xu hướng bỏ qua ân huệ này, nên việc từ chối sẽ gây căng thẳng"

  stewardship_duty.7027.opening:0 "[hook_holder.Custom2('AppropriateGreeting', ROOT.Char)]"
  stewardship_duty.7027.desc.accepted.gold:0 "Cảm ơn món quà của ngươi. Hãy xem như món nợ đã được thanh toán."
  stewardship_duty.7027.desc.refused.gold:0 "Nghĩa vụ của ngươi đáng giá hơn vàng. Ngươi vẫn còn nợ ta."
  stewardship_duty.7027.desc.accepted.diplomacy:0 "Ta thấy sự khôn ngoan trong lời nói của ngươi. Hãy quên chuyện ân huệ cũ đi."
  stewardship_duty.7027.desc.refused.diplomacy:0 "Những lời hoa mỹ của ngươi rỗng tuếch như những lời hứa của ngươi. Ta vẫn xem ngươi còn nợ ta."
  stewardship_duty.7027.desc.accepted.intimidation:0 "Dĩ nhiên ta sẽ tha thứ món nợ của ngươi. Điều đó chưa từng là vấn đề! Ta ở trong tay ngươi."
  stewardship_duty.7027.desc.refused.intimidation:0 "Ngươi không làm ta sợ. Ngươi sẽ phải trả nghĩa vụ của mình, bằng cách này hay cách khác."
  stewardship_duty.7027.a:0 "Cuối cùng cũng giải quyết xong."
  stewardship_duty.7027.b:0 "Mọi chuyện đáng ra có thể tốt hơn."

 ##################
 # Special Events #
 ##################

 # Map Painting Journey, by Petter Vilberg
  stewardship_duty_special.1201.t:0 "Khảo Sát Lãnh Thổ"
  stewardship_duty_special.1201.desc:0 "[steward.GetCouncilTitle] của ta, [steward.GetTitledFirstName], đang đề xuất một chuyến hành trình mà [steward.GetSheHe] tin rằng sẽ mang lại lợi ích cho [ROOT.Char.Custom('RealmType')].\n\n[steward.GetSheHe|U] cho rằng ta nên cùng đoàn tùy tùng đi khảo sát các vùng đất của [painting_land_owner.GetTitledFirstName]. Ta sẽ hiểu rõ lãnh địa của mình hơn, và [steward.GetFirstNameNoTooltip] tin rằng ta sẽ có cái nhìn sâu sắc hơn về [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('painting_land_owner'))] của mình."
  stewardship_duty_special.1201.a:0 "Một nỗ lực đáng giá."
  stewardship_duty_special.1201.a.tt:0 "Ngươi lập tức bắt đầu chuẩn bị!"
  stewardship_duty_special.1201.b:0 "Đây không phải lúc cho một chuyến đi như vậy."
  stewardship_duty_special.1201.b.tt:0 "Ngươi không thực hiện chuyến hành trình"
  stewardship_duty_special.1201.continue_tooltip:0 "Cuộc khảo sát của ta tiếp tục."

  stewardship_duty_special.1202.desc:0 "Khi tiến vào lãnh địa của [painting_land_owner.GetTitledFirstNamePossessive], chúng ta được đón tiếp bởi một [painting_land_owner.Custom('MountedWarriorTerm')] cùng đoàn tùy tùng của [dummy_gender.GetHerHis].\n\n"[painting_land_owner.GetTitledFirstName] cung kính chào đón ngài, thưa [ROOT.Char.Custom('my_title')] của ta. Ngài cứ tự nhiên lưu lại vùng đất này bao lâu tùy ý.""
  stewardship_duty_special.1202.a:0 "Ta hy vọng sẽ học hỏi được nhiều điều."
  stewardship_duty_special.1202.a.tt:0 "Ta bắt đầu vẽ bản đồ khu vực."

  stewardship_duty_special.1203.desc:0 "Con đường trông thật yên tĩnh — nhưng chẳng phải chính điều đó khiến nó trở nên hoàn hảo cho một cuộc phục kích sao?\n\nBọn cướp bất ngờ lao ra từ phía sau một ngọn đồi, mũi tên và tiếng hô lệnh lập tức tràn ngập không khí."
  stewardship_duty_special.1203.a:0 "Đừng để tên tội phạm nào sống sót!"
  stewardship_duty_special.1203.b:0 "Dừng lại! Chúng ta sẽ trả tiền để được đi qua an toàn!"

  stewardship_duty_special.1204.desc:0 "Một đêm nọ chúng ta cắm trại bên bờ [painting_land_owner.Custom('IndefiniteBodyOfWater')]. Thần dân của ta thức dậy trong trạng thái khoan khoái trước tiếng chim hót và làn sương nhẹ phủ trên mặt nước."
  stewardship_duty_special.1204.a:0 "Đây là nơi tốt để nghỉ lại một thời gian."
  stewardship_duty_special.1204.a.tt:0 "Chuyến hành trình của ta bị trì hoãn đôi chút."
  stewardship_duty_special.1204.b:0 "Chúng ta tiếp tục lên đường ngay."

  stewardship_duty_special.1205.desc:0 "Những nông dân đang làm việc bên cánh đồng ven đường hẳn chưa từng thấy một đoàn người uy nghi như đoàn ta dẫn đầu.\n\n\"Người kia là ai vậy?\" ta nghe một người hỏi kẻ bên cạnh."
  stewardship_duty_special.1205.a:0 "\"Ta là lãnh chúa và người cai trị của các ngươi, chủ nhân của vùng đất này!\""
  stewardship_duty_special.1205.b:0 "Ta nên tìm hiểu cuộc sống của nông dân nơi đây."

  stewardship_duty_special.1206.desc:0 "Ta đã thấy nhiều pháo đài trong vùng, nằm ở những vị trí phòng thủ khác nhau giữa địa hình thay đổi liên tục. Một buổi sáng khi chúng ta tiến gần một trong số đó, ta thấy vị [local_baron.GetTitleAsNameNoTooltip] địa phương đang chỉ huy việc chăm sóc ngựa bên ngoài cổng của [local_baron.GetHerHis]."
  stewardship_duty_special.1206.a:0 "Xin tham quan [local_baron.Custom('FortifiedBuilding')]."
  stewardship_duty_special.1206.b:0 "Mời [local_baron.GetTitledFirstNameNoTooltip] dùng bữa tối với ta."

  stewardship_duty_special.1207.desc:0 "Nhiều tuần rong ruổi trên đường có thể khiến bất kỳ [ROOT.Char.GetWomanMan] nào mệt mỏi. Vì vậy thật may mắn khi cuối cùng chúng ta bắt gặp một quán trọ trông có vẻ đủ tiện nghi — như một chiếc giường thật sự. Thậm chí có thể có chỗ ở cho những con vật lớn hơn chuột."
  stewardship_duty_special.1207.a:0 "Ta sẽ tự trả tiền phòng và bữa ăn."
  stewardship_duty_special.1207.b:0 "Chủ quán hẳn sẽ vinh dự khi được tiếp đón [ROOT.Char.GetTitleAsNameNoTooltip]!"

  stewardship_duty_special.1208.desc:0 "Lãnh địa của [painting_land_owner.GetTitledFirstNamePossessive] chằng chịt sông suối, các cây cầu tạm bợ và bến vượt tạo nên hầu hết lối đi. Chắc chắn những dòng nước hiền hòa này có thể được sử dụng hữu ích hơn thế này?"
  stewardship_duty_special.1208.a:0 "Ta sẽ gửi thư cho nhà bản đồ của mình bằng những chiếc bát nhỏ thả trôi theo nước!"
  stewardship_duty_special.1208.b:0 "Nếu những bờ bùn này được san lại, có lẽ sẽ thành đất canh tác tốt..."

  stewardship_duty_special.1281.opening:0 "Đồi núi và thung lũng, bình nguyên và hồ nước, những con đường lớn và lối mòn trong rừng. Ta đã quan sát tất cả trong vương quốc của [painting_land_owner.GetTitledFirstNamePossessive], và các họa sĩ bản đồ của Ta đang háo hức ghi chép, phác thảo bằng than mọi cảnh tượng mới lạ."
  stewardship_duty_special.1281.end:0 "\n\nĐây cũng là dịp khảo sát thú vị về các thị trấn và làng mạc, cũng như những con người đi lại trong vùng đất của [ROOT.Char.Custom('RealmType')]."
  stewardship_duty_special.1281.a:0 "Thông tin này tốt nhất nên giữ cho riêng ta."
  stewardship_duty_special.1281.b:0 "[painting_land_owner.GetTitledFirstNameNoTooltip] nên nghe về những phát hiện của ta."

  stewardship_duty_special.1282.end:0 "\n\nTa cũng đã cho họ ghi lại những pháo đài đang mục nát và những địa hình tự nhiên đặc biệt dễ phòng thủ."
  stewardship_duty_special.1282.a:0 "Không ai biết khi nào điều này sẽ hữu ích."
  stewardship_duty_special.1282.b:0 "[painting_land_owner.GetFirstNameNoTooltip] nên củng cố phòng thủ của [painting_land_owner.GetHerHis]... Ta cũng vậy!"

  stewardship_duty_special.1283.end:0 "\n\nMức độ chi tiết mà các nhà bản đồ của ta đạt được thật đáng kinh ngạc. Dường như không một con đường nào bị bỏ sót, và các bản đồ đầy ắp ghi chú chi tiết về địa hình."
  stewardship_duty_special.1283.a:0 "Giờ đây không ai hiểu địa thế vùng đất này hơn ta."
  stewardship_duty_special.1283.b:0 "Các tướng lĩnh của ta sẽ biết cách tận dụng chúng."

  stewardship_duty_special.1284.end:0 "\n\nTa đặc biệt chú ý đến số lượng lớn sông và suối chảy qua lãnh địa của [painting_land_owner.Custom('my_title')]."
  stewardship_duty_special.1284.a:0 "Có lẽ chúng hữu ích cho việc truyền tin?"
  stewardship_duty_special.1284.b:0 "Ta sẽ cân nhắc ý nghĩa quân sự của điều này."

  stewardship_duty_special.1285.end:0 "\n\nRõ ràng nơi đây có nhiều vùng hiếm khi có người đặt chân tới — nếu từng có dấu chân người."
  stewardship_duty_special.1285.a:0 "Còn rất nhiều điều cần khám phá về chính vùng đất ta đang bước đi."
  stewardship_duty_special.1285.b:0 "Nếu khuyến khích người định cư đến đó, và thoát nước ở chỗ này..."

  stewardship_duty_special.1286.end:0 "\n\nTa có cái nhìn mới về sự tinh tế của lãnh địa mình. Ai ngờ mọi thứ lại khác biệt đến vậy so với [capital.GetNameNoTier]?"
  stewardship_duty_special.1286.a:0 "Kiến thức này sẽ rất hữu ích."
  stewardship_duty_special.1286.b:0 "Ta cũng là [ROOT.Char.GetLadyLord] của những vùng đất này!"

 # Vassal Mediation, by Petter Vilberg
  statecraft_mediation_unfair:0 "Quyết định này sẽ bị xem là không công bằng"
  statecraft_mediation_fair:0 "Quyết định này sẽ được xem là tương đối công bằng"
  statecraft_mediation_very_fair:0 "Quyết định này sẽ được xem là rất công bằng"
  statecraft_mediation_favor_vassal_1:0 "Quyết định này sẽ bị xem là thiên vị [vassal_1.GetTitledFirstName]"
  statecraft_mediation_favor_vassal_2:0 "Quyết định này sẽ bị xem là thiên vị [vassal_2.GetTitledFirstName]"
  story_diplomacy_lifestyle_mediation: "Hòa Giải Chư Hầu"
  story_diplomacy_lifestyle_mediation_desc: "Một phần của việc xây dựng mối gắn kết trung thành chính là dàn xếp ổn thỏa các cuộc cãi vã của những chư hầu hay gây xích mích."
  FRACTIOUS_VASSAL: "Chư Hầu Ngỗ Ngược"
  PERCEIVED_FAIRNESS: "Độ Khách Quan"
  FAVOR_VASSAL_1: "Lòng biết ơn từ [Story.MakeScope.Var('stewardship_duty_special_vassal_1').Char.GetShortUIName]"
  FAVOR_VASSAL_2: "Lòng biết ơn từ [Story.MakeScope.Var('stewardship_duty_special_vassal_2').Char.GetShortUIName]"
  FAIRNESS_MIN_VALUE_LABEL: "Bất công"
  FAIRNESS_MAX_VALUE_LABEL: "Công bằng"
  stewardship_duty_special.2001.t:0 "Hòa Giải"
  stewardship_duty_special.2001.desc:0 "Mối thù giữa hai chư hầu của ta, [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName], đã trở thành chuyện nổi tiếng, đến mức các quý tộc khác trong lãnh địa đã yêu cầu ta phải can thiệp.\n\nTranh chấp biên giới, quyền thu thuế, lịch sử gia tộc... Họ có cả một danh sách dài những bất hòa, và ngay tại triều đình của ta họ cũng chỉ miễn cưỡng giữ được phép lịch sự tối thiểu."
  stewardship_duty_special.2001.a:0 "Hòa giải giữa hai người này chắc chắn sẽ là một thử thách!"
  stewardship_duty_special.2001.b:0 "Đây là vấn đề thuộc thẩm quyền của [ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle] Ta."
  stewardship_duty_special.2001.c:0 "\"Các ngươi dám làm phiền ta vì những chuyện vặt vãnh này sao?!\""

  stewardship_duty_special.2011.t:0 "Hòa Giải: Tranh Chấp Đất Đai"
  stewardship_duty_special.2011.desc:0 "Ta đã nghĩ cuộc tranh luận đã dữ dội #EMP trước đó#! — cho đến khi bản đồ được mang ra.\n\n[vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName] đều có bản đồ lãnh địa của mình, và cả hai bản đồ đều cho thấy cùng một bến vượt sông thuộc về họ. Không ai trong hai người chịu nhượng dù chỉ một tấc đất.\n\nChưa bao giờ ta thấy một tấm da thuộc gây ra nhiều phẫn nộ đến vậy, và rõ ràng cần phải xác lập một đường biên mới."
  stewardship_duty_special.2011.a:0 "Ta sẽ đích thân hòa giải cuộc tranh luận này."
  stewardship_duty_special.2011.b:0 "[vassal_1.GetFirstNameNoTooltip] sẽ được bồi thường cho mọi tổn thất."
  stewardship_duty_special.2011.c:0 "[vassal_2.GetFirstNameNoTooltip] dường như #EMP rất#! mong ta đưa ra phán quyết đúng đắn..."
  statecraft_mediation_debug_improve_contract:0 "Cải thiện Khế Ước Chư Hầu với [vassal_2.GetTitledFirstName]"

  stewardship_duty_special.2012.t:0 "Hòa Giải: Tranh Chấp Gia Tộc"
  stewardship_duty_special.2012.desc:0 "Cuộc thảo luận hôm nay giữa [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName] khởi đầu chẳng mấy suôn sẻ.\n\n\"Kể từ khi ngươi được trao chiếc khiên của ông nội—\"\n\"Lại chuyện cái khiên đó nữa sao? Ngay tại triều đình của [ROOT.Char.GetTitlePossessive] ư?!\""
  stewardship_duty_special.2012.a:0 "Gia đình phải gắn kết chúng ta lại, chứ không phải chia rẽ."
  stewardship_duty_special.2012.a.success:0 "Lời Khuyên Khôn Ngoan"
  stewardship_duty_special.2012.a.failure:0 "Lời Nói Rỗng Tuếch"
  stewardship_duty_special.2012.b:0 "Gia tộc của các ngươi dường như mang trong mình sự vĩ đại."
  stewardship_duty_special.2012.c:0 "Ta biết cách dàn xếp những tranh cãi gia đình!"
  statecraft_sc_mediation_debug_add_dynasty_prestige:0 "#D Thêm Danh Vọng Gia Tộc#!"
  stewardship_duty_special.2012.c.major_progress:0 "Ta kéo hai kẻ tranh cãi lại gần nhau hơn, tăng đáng kể cơ hội đạt kết quả tốt"

  stewardship_duty_special.2013.t:0 "Hòa Giải: Quyền Thu Thuế"
  stewardship_duty_special.2013.desc:0 "[vassal_1.GetTitledFirstName] cho rằng [vassal_2.GetTitledFirstName] đang phủ nhận quyền thu thuế của [vassal_1.GetHerHis].\n\n\"Hoàn toàn không!\" [vassal_1.GetFirstName] phản đối. \"Gia đình đó đã sống bên phần biên giới của ta suốt nhiều thế hệ. Chỉ vì một mảnh ruộng ở phía bên kia mà ngươi đòi cả một phần thuế thập phân sao!\""
  stewardship_duty_special.2013.a:0 "Nếu các ngươi không thể quyết định, phần thuế đó sẽ thuộc về [ROOT.Char.GetTitleAsNameNoTooltip]."
  stewardship_duty_special.2013.b:0 "Truyền thống phải được ưu tiên."
  stewardship_duty_special.2013.c:0 "Chủ đất sẽ nhận thuế, bất kể ai canh tác."

  stewardship_duty_special.2014.t:0 "Hòa Giải: Hôn Ước"
  stewardship_duty_special.2014.desc:0 "\"[betrothal_candidate_lord.GetTitledFirstNamePossessive] [betrothal_candidate_lord.Custom2('RelationToMe', SCOPE.sC('betrothal_candidate'))] đã được hứa gả cho [vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))] của ta từ khi—\" [vassal_1.GetTitledFirstName] bắt đầu, trước khi bị [vassal_2.GetTitledFirstName] cắt lời.\n\n\"[betrothal_candidate.GetTitledFirstName] vốn dĩ phải cưới [vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))] của ta!\""
  stewardship_duty_special.2014.a:0 "[betrothal_candidate.GetTitledFirstNameNoTooltip] sẽ kết hôn với [vassal_1.GetFirstNamePossessiveNoTooltip] [vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))]."
  stewardship_duty_special.2014.b:0 "Hôn ước sẽ được lập với [vassal_2.GetFirstNamePossessiveNoTooltip] [vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))]."
  stewardship_duty_special.2014.c:0 "Sự cãi vã này khiến cả hai mất quyền!"

  stewardship_duty_special.2015.t:0 "Hòa Giải: Phán Quyết"
  stewardship_duty_special.2015.desc:0 "\"Có lần [vassal_2.GetTitledFirstName] chứa chấp một tên trộm khét tiếng!\" [vassal_1.GetTitledFirstName] buộc tội.\n\n\"Nhân danh [vassal_2.GetFaith.HighGodName]!\" [vassal_2.GetFirstName] rõ ràng đã nghe điều này trước đây. \"Ngươi không có quyền xét xử thần dân của ta trong lãnh địa của ta!\"\n\n\"Chỉ vì hắn đã trốn thoát lần trước—\"\n\nHọ lập tức im lặng khi ta giơ tay nhắc họ về sự hiện diện của mình."
  stewardship_duty_special.2015.a:0 "Tên trộm này sẽ bị xử tử, và tranh chấp chấm dứt."
  stewardship_duty_special.2015.b:0 "Nếu [vassal_2.GetFirstNameNoTooltip] có quyền xét xử, vậy là đủ."
  stewardship_duty_special.2015.c:0 "[ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle] Ta sẽ tổ chức phiên tòa xét xử tên trộm vặt này."

  stewardship_duty_special.2018.t:0 "Hòa Giải: Ngựa Chiến"
  stewardship_duty_special.2018.desc:0 "[vassal_1.GetTitledFirstName] hôm nay lại có thêm lời than phiền. \"Ngựa được gây giống tại [barony_1.GetNameNoTier] từ lâu đã nổi tiếng, nhưng giờ thương nhân từ [barony_2.GetNameNoTier] lại bán chúng như thể họ mới là người nuôi! Ngay tại [barony_2.GetNameNoTier]!\"\n\n[vassal_2.GetTitledFirstName] phản đối: \"Chúng #EMP đúng là#! được nuôi ở đó! Thương nhân chẳng lẽ phải nói dối về hàng hóa của mình sao?\""
  stewardship_duty_special.2018.a:0 "Nguồn gốc phải được tôn trọng."
  stewardship_duty_special.2018.b:0 "Chúng không thuộc [barony_1.GetNameNoTier] hay [barony_2.GetNameNoTier], mà là của [new_name.GetNameNoTier]!"
  stewardship_duty_special.2018.c:0 "Có lẽ chúng ta cần một khoản phí kiểm định ngựa chính thức."

  stewardship_duty_special.2019.t:0 "Hòa Giải: Mỏ Đá"
  stewardship_duty_special.2019.desc:0 "[vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName] đã liệt kê những bất mãn của họ suốt nhiều giờ.\n\n\"... rồi còn viên quản lý mỏ ở biên giới từ chối nộp thuế nhờ một chiếu thư khoan dung mà #EMP chính ngài#! ban cho!\"\n\"Cái gì?! Chính ngươi mới là kẻ đã vét sạch của họ trước khi người thu thuế của ta—\"\n\nCuối cùng họ dừng lại khi nhận ra cả hai đều bị qua mặt."
  stewardship_duty_special.2019.a:0 "Khoản thuế thất lạc sẽ được thu lại và chia đều."
  stewardship_duty_special.2019.b:0 "Cả hai các ngươi đều đáng bị làm trò cười!"
  stewardship_duty_special.2019.c:0 "Xử tử quản lý mỏ và đốt phá mỏ đá."
  stewardship_duty_special.2019.d:0 "Đây là tội chống lại [ROOT.Char.GetTitleAsNameNoTooltip], và chính [ROOT.Char.GetTitleAsNameNoTooltip] sẽ xử lý!"
 
  stewardship_duty_special.2021.t:0 "Hòa Giải: Yến Tiệc"
  stewardship_duty_special.2021.desc:0 "[vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName] có vô số bất mãn với nhau, từ lớn đến nhỏ.\n\n\"[uninvited.GetFirstName] đã cấm các lãnh chủ của [uninvited.GetHerHis] tham dự yến tiệc mùa thu của ta!\" [host.GetFirstName] phàn nàn.\n\n\"Dĩ nhiên rồi, ta đâu muốn chư hầu của mình mang thêm bọ chét về nhà.\""
  stewardship_duty_special.2021.a:0 "Chúng là chư hầu của [uninvited.GetFirstNamePossessiveNoTooltip]. Chúng phải phục tùng mệnh lệnh của [uninvited.GetSheHe]."
  stewardship_duty_special.2021.b:0 "Không ai nên bị từ chối một bữa tiệc!"
  stewardship_duty_special.2021.c:0 "Từ giờ các ngươi #EMP bắt buộc#! phải dự tiệc của nhau!"

  stewardship_duty_special.2022.t:0 "Hòa Giải: Lời Sỉ Nhục"
  stewardship_duty_special.2022.desc:0 "\"[insulter.GetTitledFirstName] đã sỉ nhục [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] của ta một cách nặng nề!\" [insultee.GetTitledFirstName] thốt lên. \"Hắn ám chỉ rằng [spouse.GetSheHe] ngủ chung với lợn!\"\n\n[insulter.GetFirstName] vẫn bình thản. \"Đôi khi sự thật không mấy dễ nghe, [insultee.GetFirstName].\""
  stewardship_duty_special.2022.a:0 "Điều này đòi hỏi một lời xin lỗi công khai!"
  stewardship_duty_special.2022.b:0 "Những cãi vã nhỏ nhặt này thật không đáng."
  stewardship_duty_special.2022.c:0 "Nhưng nếu nghĩ kỹ thì đó có thể là lời khen?"

  stewardship_duty_special.2025.t:0 "Hòa Giải: Cơ Hội"
  stewardship_duty_special.2025.desc:0 "Với đòn bẩy ta nắm giữ đối với [hooked_vassal.GetTitledFirstName], ta có thể yêu cầu rằng bất kể kết quả tranh chấp giữa [hooked_vassal.GetHerHis] và [other_vassal.GetTitledFirstName], [hooked_vassal.GetSheHe] sẽ nói với mọi người rằng ta đã đưa ra phán quyết công bằng thế nào."
  stewardship_duty_special.2025.a:0 "[hooked_vassal.GetFirstNameNoTooltip], có #EMP một#! việc ngươi có thể làm cho ta..."
  stewardship_duty_special.2025.b:0 "Đây không phải cách giải quyết."
  statecraft_mediation_progress_fairness:0 "[hooked_vassal.GetFirstNameNoTooltip] nhấn mạnh sự công bằng của ta, tăng đáng kể cơ hội đạt kết quả tốt"

  stewardship_duty_special.2026.t:0 "Hòa Giải: Kết Cục"
  stewardship_duty_special.2026.desc:0 "Tiếng la hét và những bàn tay đẫm máu chào đón ta. Chiếc cốc cuối cùng đã tràn, và [killer.GetTitledFirstName] đang đứng trên xác của [victim.GetTitledFirstName], [killer.Custom('signature_weapon')] vẫn còn trong tay.\n\n\"Đây là cách dàn xếp công bằng duy nhất mà ta có thể có.\""
  stewardship_duty_special.2026.a:0 "Ngươi đã làm gì vậy... Mắt đền mắt."
  stewardship_duty_special.2026.b:0 "Ngươi sẽ phải sống trong ngục tối."
  stewardship_duty_special.2026.c:0 "Vậy là tranh chấp đã được giải quyết!"

  stewardship_duty_special.2027.t:0 "Hòa Giải: Gia Tộc"
  stewardship_duty_special.2027.desc:0 "Những tranh chấp giữa [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstNamePossessive] dường như không bao giờ chấm dứt, và rõ ràng chúng đã kéo dài qua nhiều thế hệ.\n\nCha mẹ, ông bà, tổ tiên xa xưa — tất cả đều tranh cãi vì chuyện này chuyện kia. Liệu có cách nào phá vỡ vòng luẩn quẩn này không?"
  stewardship_duty_special.2027.a:0 "Một gia tộc danh giá hơn là gia tộc quan trọng hơn."
  stewardship_duty_special.2027.b:0 "Danh tiếng lớn không làm nên những [lower_prestige.Custom('WomenMen')] vĩ đại."
  stewardship_duty_special.2027.c:0 "Vương quốc của chúng ta được xây dựng từ nhiều gia tộc lớn."
  statecraft_mediation_favor_higher_prestige:0 "Điều này sẽ bị xem là thiên vị [higher_prestige.GetTitledFirstName]"
  statecraft_mediation_favor_lower_prestige:0 "Điều này sẽ bị xem là thiên vị [lower_prestige.GetTitledFirstName]"

  stewardship_duty_special.2071.t:0 "Hòa Giải: Khởi Đầu Mới"
  stewardship_duty_special.2071.desc:0 "Đó là một quá trình mệt mỏi, nhưng giờ đây [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName] không còn luôn chĩa mũi vào nhau nữa.\n\nThực vậy, họ rời triều đình của ta không chỉ với tranh chấp đã được giải quyết, mà còn như những bằng hữu mới."
  stewardship_duty_special.2071.a:0 "Một phép màu, nếu ta từng thấy."

  stewardship_duty_special.2072.desc:0 "Khi [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName] rời khỏi triều đình của ta — cuối cùng — họ không còn mang theo sự thù hằn và cay độc như khi đến. Liệu điều đó kéo dài bao lâu còn phải chờ xem, nhưng hiện giờ họ đã dành cho nhau sự tôn trọng mới nhờ nỗ lực của ta."
  stewardship_duty_special.2072.a:0 "Không phải chiến công nhỏ!"

  stewardship_duty_special.2073.t:0 "Hòa Giải: Thiên Vị"
  stewardship_duty_special.2073.desc:0 ""Đây chưa bao giờ là một cuộc hòa giải công bằng cả!" [accuser.GetTitledFirstName] vô cùng phẫn nộ khi bước ra khỏi sảnh tiếp kiến. "Sự thiên vị bày ra trước mắt thật đáng ghê tởm!"\n\n[favorite.GetTitledFirstName] vẫn bình tĩnh. "Tôi không đồng ý với điều đó, thưa [ROOT.Char.Custom('FormOfAddressForLiege')] của tôi.""
  stewardship_duty_special.2073.a:0 "Cứ để kẻ vô ơn đó đi."

  stewardship_duty_special.2074.t:0 "Hòa Giải: Vẫn Thù Địch"
  stewardship_duty_special.2074.desc:0 "Khi [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName] đến đây, ta không nghĩ họ có thể ném vào nhau nhiều hận thù và cay đắng hơn nữa. Nhưng khi rời đi, họ đã chứng minh ta sai."
  stewardship_duty_special.2074.a:0 "Cuộc hòa giải của ta đáng lẽ có thể tốt hơn."

  stewardship_duty_special.2081.t:0 "Hòa Giải: Kết Thúc"
  stewardship_duty_special.2081.both_dead:0 "Với cái chết của [vassal_1.GetTitledFirstName] và [vassal_2.GetTitledFirstName], những cuộc cãi vã nhỏ nhặt của họ giờ trở nên xa vời và vô nghĩa."
  stewardship_duty_special.2081.vassal_1:0 "Với cái chết của [vassal_1.GetTitledFirstName], những tranh chấp giữa [vassal_1.GetSheHe] và [vassal_2.GetTitledFirstName] giờ có vẻ nhỏ bé và vô nghĩa."
  stewardship_duty_special.2081.vassal_2:0 "Với cái chết của [vassal_2.GetTitledFirstName], những tranh chấp giữa [vassal_2.GetSheHe] và [vassal_1.GetTitledFirstName] giờ có vẻ nhỏ bé và vô nghĩa."
  stewardship_duty_special.2081.a:0 "Theo thời gian, mọi thứ rồi cũng qua."
  stewardship_duty_special.2081.tt:0 "Nỗ lực hòa giải của ta kết thúc."
 
  stewardship_duty_special.2082.t:0 "Hòa Giải: Kết Thúc"
  stewardship_duty_special.2082.desc:0 "Khi [prisoner.GetTitledFirstName] đã bị giam giữ, tranh chấp giữa [prisoner.GetHerHim] và [other.GetTitledFirstName] dường như trở nên kém quan trọng hơn nhiều."
  stewardship_duty_special.2082.a:0 "Mỗi người đều có cách giải quyết xung đột của mình."
