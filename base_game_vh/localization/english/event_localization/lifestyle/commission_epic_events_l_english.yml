  commission_epic.0001.t:0 "Sử thi Gia tộc"
  commission_epic.0001.desc:0 "Ta cần một câu chuyện cổ điển ca ngợi sự vĩ đại của gia tộc mình. Một [ROOT.Char.Custom('CompositionType')] kể về nguồn gốc triều đại [ROOT.Char.GetDynasty.GetBaseName] và cách chúng ta được định mệnh cho sự vĩ đại!\n\nTa chỉ cần một người biết kể chuyện..."
  commission_epic.0001.a:1 "[writer.GetTitledFirstNameNoTooltip], nhà kể chuyện lão luyện!"
  writer_writes_epic:0 "[writer.GetTitledFirstName] nhà kể chuyện soạn sử thi"
  commission_epic.0001.b:0 "Ta sẽ tập hợp một số [ROOT.Char.Custom('CommissionEpicScribes')] giỏi nhất của mình."
  scribes_write_epic:0 "Các thư ký của ta soạn sử thi"
  bards_write_epic:0 "Các ca sĩ của ta soạn sử thi"
  commission_epic.0001.c:0 "Chắc chắn một [servant.Custom('GenderedLowlyServantType')] tầm thường nào đó cũng làm được chứ?"
  servant_writes_epic:0 "[servant.GetTitledFirstName] người hầu soạn sử thi"
  commission_epic.0001.d:0 "Nghĩ lại thì..."
  commission_epic.writing_begins:0 "Bắt đầu sáng tác..."
  commission_epic.high_chance:1 "Cơ hội cao tạo ra một [exceptional_epic|E]"
  commission_epic.medium_chance:1 "Cơ hội không chắc chắn tạo ra một [exceptional_epic|E]"
  commission_epic.low_chance:1 "Cơ hội thấp tạo ra một [exceptional_epic|E]"
  commission_epic.opt_out:0 "Hiện tại tôi không viết Sử thi Gia tộc"
  commission_epic.reduced_chance:1 "Cơ hội tạo ra một [exceptional_epic|E] giảm"
  commission_epic.increased_chance:1 "Cơ hội tạo ra một [exceptional_epic|E] tăng"

  commission_epic.0002.t:0 "Sử thi Gia tộc: Góc nhìn"
  commission_epic.0002.writer:0 "Sử thi Gia tộc của ta có vẻ đang tiến triển tốt, và một số dòng nghe có vẻ sẽ được trích dẫn trong nhiều thập kỷ tới, nhưng [writer.GetTitledFirstName] lại có rất nhiều câu hỏi về trọng tâm của câu chuyện.\n\nSẽ dễ dàng hơn để trả lời nếu [writer.GetSheHe] viết xong hết trước. Sau đó ta có thể nói với [writer.GetHerHim] những gì ta không thích về nó, nhưng [writer.GetSheHe] khăng khăng rằng [writer.GetSheHe] cần câu trả lời ngay bây giờ."
  commission_epic.0002.servant:0 "[servant.GetFirstName], người hầu mà tôi giao viết lịch sử gia tộc, có vẻ hơi gặp khó khăn. Tuy nhiên, việc [servant.GetSheHe] vẫn có tiến triển là khá ấn tượng. Hóa ra [servant.GetSheHe] không biết đọc cũng không biết làm thơ.\n\nDẫu vậy, [servant.GetSheHe] làm việc ngày đêm và giờ đây đã đến gặp tôi với một câu hỏi quan trọng. \"Nó nên viết về điều gì, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
  commission_epic.0002.scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] của ta đã bắt đầu làm việc với sử thi gia tộc, nhưng họ đã gặp rắc rối. Họ không thể đồng ý xem câu chuyện nên tập trung vào cái gì, với mỗi [ROOT.Char.Custom('CommissionEpicScribe')] đều tình cờ khăng khăng rằng lĩnh vực trách nhiệm của riêng họ nên được nhấn mạnh nhất.\n\n"Chúng tôi không muốn gây áp lực, [ROOT.Char.Custom('FormOfAddressForLiege')], nhưng ngài #EMP phải#! giải quyết chuyện này trước khi chúng tôi xâu xé lẫn nhau!""
  commission_epic.0002.iberia_epic.a:0 "Viết về quyền trị vì Iberia của gia tộc ta!"
  commission_epic.0002.a:1 "Tập trung vào những câu chuyện về quyền tổ tiên của gia tộc"
  commission_epic.propaganda:0 "Tôi sẽ giành được [claims|E] trên các tước vị lân cận khi sử thi hoàn tất"
  commission_epic.0002.b:1 "Tất nhiên, nó phải tập trung vào ta và định mệnh của ta!"
  commission_epic.more_prestige:0 "Tôi sẽ có thêm [prestige|E] cá nhân khi sử thi hoàn tất"
  commission_epic.0002.c:1 "Đây là lịch sử #EMP gia tộc#!, hãy rộng lượng."
  commission_epic.more_dynasty_prestige:0 "Tôi sẽ có thêm [dynasty_prestige|E] khi sử thi hoàn tất"
  commission_epic.0002.d:0 "Kể câu chuyện thật chân thực."
  commission_epic.more_piety:0 "Tôi cũng sẽ có thêm [piety|E] khi sử thi hoàn tất"


  commission_epic.1001.t:0 "Sử thi Gia tộc: Câu hỏi về Thời gian"
  commission_epic.1001.opening:0 "Tôi đã không được trình bày công việc mới về sử thi gia tộc trong nhiều tuần, và toàn bộ quá trình này hoặc là quá lâu, hoặc"
  commission_epic.1001.composer:0 "[composer.GetSheHe] cuối cùng lại làm việc cẩu thả! Liệu có quá đáng không khi yêu cầu [composer.GetSheHe] mang lại sự xuất sắc, và phải mang lại ngay bây giờ?"
  commission_epic.1001.scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] của tôi cuối cùng cũng làm việc cẩu thả! Thật sự quá đáng để yêu cầu họ làm xuất sắc, và làm nhanh sao?"
  commission_epic.1001.a:0 "Tôi muốn nó thật tốt, và tôi muốn #EMP ngay bây giờ!#!"
  commission_epic.1001.b:0 "Tôi sẽ để [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] tiếp tục cho đến khi hoàn thành."
  commission_epic.1001.b_scribes:0 "Tôi sẽ để [ROOT.Char.Custom('CommissionEpicComposerThem')] tiếp tục cho đến khi hoàn thành."
  commission_epic.1001.c:0 "Giờ thì, nếu chúng ta chia phần đã hoàn thành thành Phần 1..."

  commission_epic.1002.t:0 "Sử thi Gia tộc: Tư liệu phong phú"
  commission_epic.1002.composer:0 "[composer.GetTitledFirstName] kể với [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] về nhiều chi tiết thú vị mà [composer.GetSheHe] đã phát hiện về tổ tiên của tôi. \"Giờ đây, tôi tin rằng phần với [ROOT.Char.Custom('CompositionDetail')] có thể thực sự là sự thật, bởi vì—\"\n\nThật hấp dẫn, nhưng [composer.GetSheHe] không có một [ROOT.Char.Custom('CompositionType')] vĩ đại để hoàn thành sao? Còn về giai thoại này..."
  commission_epic.1002.scribes:0 "Một số thư ký của tôi kể với [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] về nhiều chi tiết thú vị họ đã phát hiện về tổ tiên tôi.\n\n\"Giờ đây, tôi tin rằng phần với [ROOT.Char.Custom('CompositionDetail')] có thể thực sự là sự thật, bởi vì—\"\n\nThật hấp dẫn, nhưng họ không có một [ROOT.Char.Custom('CompositionType')] vĩ đại để hoàn thành sao? Còn về giai thoại này..."
  commission_epic.1002.a:0 "Nó nên được chia sẻ với tất cả các chư hầu của tôi!"
  commission_epic.1002.a.tt:0 "Khi hoàn tất, bạn sẽ nhận được một cuốn sách Sử thi Gia tộc [artifact|E] giúp cải thiện [vassal|E] [opinion|E]"
  commission_epic.1002.b:0 "Đặt vào [ROOT.Char.Custom('CompositionType')] để hoàn thành sớm hơn!"
  commission_epic.1002.b.tt:0 "Điều này cũng có nghĩa là tôi có thể lấy lại một phần lương!"

  commission_epic.1003.t:0 "Sử thi Gia tộc: Nghỉ ngơi cho nhà văn"
  commission_epic.1003.composer:0 "[composer.GetTitledFirstName] đã bị bắt gặp đang cố gắng lẻn ra khỏi nhiệm vụ của [composer.GetHerHis]! Rất may là một lính gác đã nhận ra [composer.GetHerHim] khi [composer.GetSheHe] đi qua cổng.\n\n"Đó là một công việc mệt mỏi," [composer.GetSheHe] biện hộ cho [composer.GetHerselfHimself]. "Ngày và đêm, thưa [ROOT.Char.GetLadyLord] nhân từ của tôi! Tôi đang rất cần nghỉ ngơi vài ngày.""
  commission_epic.1003.scribes:0 "Một số thư ký của tôi bị bắt khi cố gắng lẩn tránh nhiệm vụ sử thi gia tộc! May mà một lính gác nhận ra họ khi đi qua cổng.\n\n\"Công việc mệt mỏi lắm,\" họ giải thích. \"Ngày đêm, [ROOT.Char.Custom('FormOfAddressForLiege')]! Chúng tôi rất cần vài ngày nghỉ.\""
  commission_epic.1003.a:0 "Được thôi, có lẽ nên cho nghỉ một chút."
  commission_epic.1003.b:0 "Xích [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] vào bàn làm việc của [ROOT.Char.Custom2('CommissionEpicComposerTheir', composer)]!"
  commission_epic.1003.b_scribes:0 "Xích [ROOT.Char.Custom('CommissionEpicComposerThem')] vào bàn làm việc của [ROOT.Char.Custom('CommissionEpicComposerTheir')]!"

  commission_epic.1004.t:0 "Sử thi Gia tộc: Họa sĩ minh họa chuyên nghiệp"
  commission_epic.1004.opening:0 "Tin đồn đến tai tôi rằng một"
  commission_epic.1004.devotee_male:0 "[ROOT.Char.GetFaith.DevoteeMale]"
  commission_epic.1004.devotee_female:0 "[ROOT.Char.GetFaith.DevoteeFemale]"
  commission_epic.1004.ending:1 "nổi tiếng với các minh họa của [illuminator.GetHerHis] đang ở một thị trấn trong [barony.GetNameNoTier]. Với việc sử thi gia tộc tiến triển, đây có thể là thời điểm lý tưởng để nghĩ về cách trang sách sẽ trông ra sao khi hoàn tất."
  commission_epic.1004.a:0 "Thuê họa sĩ minh họa, bất kể chi phí!"
  commission_epic.1004.b:1 "[composer.GetTitledFirstNameNoTooltip] có thể tự mình làm [composer.GetHerselfHimself]."
  commission_epic.1004.b_scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] của tôi có thể tự làm."
  commission_epic.1004.success:0 "Minh họa tuyệt vời"
  commission_epic.1004.failure:0 "Minh họa tệ"
  commission_epic.1004.c:0 "Tôi luôn coi mình là một phần nghệ sĩ..."

  commission_epic.1005.t:0 "Sử thi Gia tộc: Bài ca của Dân tộc chúng tôi"
  commission_epic.1005.opening:0 "Tôi suy ngẫm vài câu cuối"
  commission_epic.1005.composer:0 "[composer.GetFirstName] đã"
  commission_epic.1005.scribes:0 "[ROOT.Char.Custom('CommissionEpicScribes')] của tôi đã"
  commission_epic.1005.ending:0 "trình bày cho tôi từ sử thi gia tộc, và khi tôi bắt đầu ngân nga, nhận ra nhịp điệu giống với một bài hát ưa thích của bộ tộc tôi!\n\nNếu câu chuyện tổ tiên tôi được đặt trên giai điệu dễ nhớ này, chắc chắn sẽ không bao giờ bị quên!"
  commission_epic.1005.a:0 "Lẽ ra tôi nên yêu cầu điều này ngay từ đầu!"
  commission_epic.1005.b_composer:0 "Tôi chắc rằng [ROOT.Char.Custom2('CommissionEpicComposer', composer)] có thể nghĩ ra điều gì đó tương tự."
  commission_epic.1005.b:0 "Tôi chắc rằng [ROOT.Char.Custom('CommissionEpicComposer')] có thể nghĩ ra điều gì đó tương tự."
  commission_epic.1005.classic:0 "Soạn nhạc cổ điển"
  commission_epic.1005.enjoyable:0 "Soạn nhạc vui tai"
  commission_epic.1005.terrible:0 "Soạn nhạc tệ"

  commission_epic.1006.opening:0 "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
  commission_epic.1006.desc:0 "Tôi đã [ROOT.Char.Custom('CompositionTypeActionPast')] các phần của sử thi gia tộc mới của bạn, và lòng trung thành thật sự, xuất phát từ tình bạn sâu sắc giữa những anh hùng huyền thoại này, truyền cảm hứng cho tôi.\n\nTôi rất vinh dự được gọi bạn là bạn của tôi, khi tôi trung thành phục vụ."
  commission_epic.1006.a:0 "Bạn luôn là bạn tôi, [vassal.GetFirstNameNoTooltip]!"
  commission_epic.1006.b:0 "Lòng trung thành của bạn nên được đảm bảo, dù bất cứ chuyện gì."

  commission_epic.1007.opening:0 "[vassal.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
  commission_epic.1007.desc:0 "Tôi đã [ROOT.Char.Custom('CompositionTypeActionPast')] các phần của sử thi gia tộc mới của bạn, và tôi bàng hoàng khi thấy nó phớt lờ đóng góp của tổ tiên tôi!\n\nSự nhục nhã này là giọt nước tràn ly. Rõ ràng bạn chỉ mang ác ý đối với tôi và gia tộc tôi!"
  commission_epic.1007.a:0 "Bạn dám nói với chúa tể của mình như vậy sao?!"
  commission_epic.1007.b:0 "Tôi xin lỗi, gia tộc của bạn tất nhiên sẽ được đề cập!"

  commission_epic.2001.t:0 "Sử thi Gia tộc: Quyền ưu tiên"
  commission_epic.2001.desc_composer:0 "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đến gặp tôi, phấn khích với tin tức. \"Tôi đã [ROOT.Char.Custom('CompositionTypeActionPP')] phần mới nhất của sử thi gia tộc, và [ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] phát hiện điều rất thú vị!\""
  commission_epic.2001.desc_scribes:0 "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] đến gặp tôi, phấn khích với tin tức. \"Tôi đã [ROOT.Char.Custom('CompositionTypeActionPP')] phần mới nhất của sử thi gia tộc, và [ROOT.Char.Custom('CommissionEpicComposer')] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] phát hiện điều rất thú vị!\""
  commission_epic.2001.desc:1 "\n\nHóa ra [county.GetName] không bao giờ được định để thuộc về House [vassal.GetHouse.GetName] vĩnh viễn. Tôi có thể đưa ra yêu sách hợp lý chống lại [vassal.GetTitledFirstName]!"
  commission_epic.2001.a:0 "Nếu đúng là của tôi, tôi sẽ lấy lại."
  commission_epic.2001.b:0 "[vassal.GetFirstNameNoTooltip] chắc hẳn muốn chính thức hóa nhượng quyền."
  commission_epic.2001.c:0 "Chúng ta có thể bỏ qua."
  commission_epic.2001.c.flavor:0 "Nhưng hãy chắc rằng [vassal.GetTitleTierName] biết."
  commission_epic.2002.t:0 "Sử thi Gia tộc: Niềm tự hào Gia tộc"
  commission_epic.2002.desc:0 "[spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] có vẻ là người mới nhất đã [ROOT.Char.Custom('CompositionTypeActionPast')] các đoạn trích từ sử thi gia tộc của ta.\n\n"Cụ cố của ngài là một nhân vật hấp dẫn và tháo vát," [spymaster.GetSheHe] nói với ta. "Nếu chúng ta cho mọi người biết rằng ngài dù chỉ bằng một nửa sự tinh quái như cụ của ngài, mọi người sẽ phải suy nghĩ kỹ trước khi hành động chống lại ngài.""
  commission_epic.2002.a:0 "Máu rắn đó chảy trong huyết quản tôi!"
  commission_epic.2002.a.tt:0 "Khi hoàn tất, bạn sẽ nhận một cuốn sách Sử thi Gia tộc [artifact|E] giúp cải thiện [hostile_scheme_resistance|E]"
  commission_epic.2002.b:0 "Hoặc chúng ta cho rằng [grandparent.GetSheHe] đáng kính và ngay thẳng..."

  commission_epic.2003.t:0 "Sử thi Gia tộc: Nghĩa vụ vĩnh hằng"
  commission_epic.2003.desc:0 "Dường như [court_chaplain.GetFirstName] đã [ROOT.Char.Custom('CompositionTypeActionPP')] các phần của sử thi gia tộc mới. Dĩ nhiên, [court_chaplain.GetSheHe] phát hiện những “khác biệt” giữa lời hứa trước đây và thực tế hiện nay.\n\nTôi biết [court_chaplain.GetSheHe] sẽ không bỏ qua sớm. \"Chắc chắn ngài thấy khôn ngoan và nhân từ khi thực hiện lời hứa của tổ tiên, ngay cả bây giờ chứ?\""
  commission_epic.2003.a_same_dynasty:0 "Chúng ta đều biết gia tộc giữ lời hứa."
  commission_epic.2003.a:0 "Tôi thuộc dòng dõi giữ lời hứa lâu đời."
  commission_epic.2003.b:0 "Tổ tiên tôi là [ROOT.Char.Custom('GetPiousBelievers')], nhưng chưa chắc khôn ngoan."

  commission_epic.2004.t:0 "Sử thi Gia tộc: Cảm hứng đến"
  commission_epic.2004.desc_scribes:0 "[ROOT.Char.Custom('CommissionEpicComposer')|U] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] lấy một số..."
  commission_epic.2004.desc_composer:0 "[ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] lấy một số..."
  commission_epic.2004.desc:1 "tự do trong sử thi gia tộc của ta liên quan đến chiến tranh và các trận chiến. Nó tạo ra những cảnh tượng kịch tính, nhưng ta lo rằng [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] của ta đã bị xúc phạm khi [marshal.GetSheHe] cau mày [marshal.GetHerHis] tại một cảnh cụ thể.\n\nTa gần như cảm thấy nhẹ nhõm khi [marshal.GetSheHe] cuối cùng cũng chia sẻ suy nghĩ của [marshal.GetHerHis]. "Tất cả đều là nhảm nhí, nhưng phần này với [ROOT.Char.Custom('CompositionDetail')] đã cho tôi vài ý tưởng...""
  commission_epic.2004.a:0 "Bất cứ cảm hứng nào cũng nên được sử dụng!"
  commission_epic.2004.a.tt:0 "Khi hoàn tất, bạn sẽ nhận sách Sử thi Gia tộc [artifact|E] giúp cải thiện [advantage|E] trong chiến đấu"
  commission_epic.2004.b:0 "Giải thích cho tôi, chi tiết..."

  commission_epic.2005.t:0 "Sử thi Gia tộc: Trung thực và Nhận thức"
  commission_epic.2005.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chancellor'))], [chancellor.GetTitledFirstName], đang [ROOT.Char.Custom('CompositionTypeActionPP')] sử thi gia tộc khi nó dần hình thành.\n\n\"Nhiều phần không thực tế, như phần với [ROOT.Char.Custom('CompositionDetail')],\" [chancellor.GetSheHe] nói. \"Nhưng ai mà biết quá khứ ra sao? Nếu đã thêm thắt, sao không làm hết sức?\""
  commission_epic.2005.a:0 "Quan trọng là kể câu chuyện hay..."
  commission_epic.2005.b:0 "Không, phải chân thực nhất có thể."
  commission_epic.2005.b.tt:0 "Khi hoàn tất, bạn sẽ nhận sách Sử thi Gia tộc [artifact|E] giúp cải thiện [personal_scheme|E] [success_chance|E]"

  commission_epic.2006.t:0 "Sử thi Gia tộc: Gắn kết trong Đạo"
  commission_epic.2006.desc:0 "Tôi không biết nên nhẹ nhõm hay lo lắng về sự nhiệt tình của [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))], [court_chaplain.GetTitledFirstName], khi [ROOT.Char.Custom('CompositionTypeActionPP')] các phần hoàn tất.\n\n\"Đây là một bài học đạo đức tuyệt vời!\" [court_chaplain.GetSheHe] tuyên bố. \"Triều đại [ROOT.Char.GetDynasty.GetBaseName] luôn vĩ đại khi nghe lời [ROOT.Char.GetFaith.AltPriestTermPlural], và gặp thời khốn khó khi bỏ qua! Hy vọng ngài sẽ rút ra bài học.\""
  commission_epic.2006.a:0 "Đúng vậy, tôi biết rõ."
  commission_epic.2006.a.tt:0 "Khi hoàn tất, nhận sách Sử thi Gia tộc [artifact|E] tăng [piety|E] và cùng [faith|E] thuế"
  commission_epic.2006.b:0 "Ha! Ngược lại mới đúng."
  commission_epic.2006.b.flavor:0 "Chúng ta luôn dẫn đầu cho [ROOT.Char.GetFaith.AltPriestTermPlural]."
  commission_epic.2006.c:0 "Chúng ta đều biết gia đình là trên hết."
  commission_epic.2006.c.same_dynasty:0 "Tùy chọn này có sẵn vì [court_chaplain.GetFirstNameNoTooltip] cùng [dynasty|E] với tôi"

  commission_epic.6001.t:0 "Một vài Thêm thắt Nhỏ"
  commission_epic.6001.writerservant:0 "Sau khi làm việc với biên niên sử của ta một thời gian, [composer.GetName] tìm đến ta.\n\n"[Select_CString(ROOT.Char.IsFemale,'Milady','Sire')]", [composer.GetSheHe] nói, "Tôi phải thú nhận rằng, mặc dù vương triều của ngài quả thực rất vĩ đại, nhưng những tuyên bố về tổ tiên mà ngài hy vọng tìm thấy có thể... không dễ dàng để chứng thực. Tôi cần thêm thời gian và nhiều nguồn lực hơn để đào sâu vào các văn bản cũ. Nếu không, tôi sẽ phải thực hiện một vài #italic chỉnh sửa nhỏ#! vào các câu chuyện, và các tuyên bố của ngài có thể sẽ ít thuyết phục hơn..."
  commission_epic.6001.scribes:0 "Các thư lại của ta đã làm việc ngày đêm lục lọi các bản thảo cũ, tìm cách xác định các tuyên bố lãnh thổ từ tổ tiên của ta để tôn vinh trong biên niên sử.\n\n"Than ôi", họ nói, "chúng tôi có thể phải thực hiện một vài chỉnh sửa nhỏ khi nói đến... sự thật của vấn đề này, những công lao và lãnh địa của tổ tiên ngài, v.v. Chắc chắn ngài hiểu điều đó, [Select_CString(ROOT.Char.IsFemale,'milady','sire')]?""
  commission_epic.6001.a:0 "Thêm thắt gì cũng được, chỉ cần hoàn thành!"
  commission_epic.6001.b:0 "Cứ lấy vàng của tôi, rồi nghiên cứu kỹ hơn."
  commission_epic.less_credible:0 "Biên niên sử sẽ kém tin cậy hơn"
  commission_epic.more_credible:0 "Biên niên sử có thể đáng tin hơn"

  commission_epic.6003.t:0 "Yêu Sách Lạnh Lùng"
  commission_epic.6003.writer:0 "[composer.GetName] đã và đang làm việc siêng năng với biên niên sử của ta, thứ ngày càng trở nên vĩ đại và đáng nghi vấn theo cùng một mức độ.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]", [composer.GetSheHe] nói, "Tôi tìm thấy một văn bản cũ rách nát, nơi người ta nói rằng một [Select_CString(ancestor_1.IsFemale,'queen','king')] tên là [ancestor_1.GetFirstNameNoTooltip] từng cai trị ở [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] và [neighboring_county_3.GetNameNoTier]. Tôi có thể đi sâu vào các bảng gia phả, và thực hiện một vài, hãy gọi là #italic những bổ sung sáng tạo#! để xác lập rằng [ancestor_1.GetSheHe] là tổ tiên của ngài. Sau đó, tôi có thể sử dụng câu chuyện của [ancestor_1.GetHerHis] để mang lại cho ngài những tuyên bố ít nhiều đáng tin cậy về một số vùng đất đó, hoặc thậm chí là tất cả chúng...""
  commission_epic.6003.servant:0 "[composer.GetName] đã và đang làm việc siêng năng với biên niên sử ngày càng đáng ngờ của ta.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]", [composer.GetSheHe] nói, "Tôi tìm thấy một bản khắc tạ ơn khô héo từ [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Huntress','the Elbow-High')], [Select_CString(ancestor_1.IsFemale,'queen','king')] của [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] và [neighboring_county_3.GetNameNoTier] vào những ngày xưa cũ. Tôi có thể thực hiện một vài bổ sung sáng tạo vào cây gia phả của ngài, để xác lập rằng [ancestor_1.GetSheHe] là tổ tiên của ngài. Sau đó trong biên niên sử, tôi có thể thực hiện một vài chỉnh sửa nhỏ, v.v., để xác lập vững chắc tuyên bố của ngài đối với một số vùng đất đó - hoặc thậm chí là tất cả chúng.""
  commission_epic.6003.scribes:0 "Các thư lại của ta đã làm việc chăm chỉ với biên niên sử ngày càng phức tạp của ta.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]", họ nói, "Chúng tôi tìm thấy một ghi chú bên lề trong một bản thảo cổ, đề cập đến một [ancestor_1.GetWomanMan] tên là [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Generous','the One-Eyed')], người đã có một số ảnh hưởng ở [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] và [neighboring_county_3.GetNameNoTier] vào những ngày xưa cũ. Chúng tôi có thể đi sâu vào các bảng gia phả, để một cách sáng tạo #italic xác lập#! rằng [ancestor_1.GetSheHe] là tổ tiên của ngài. Sau đó trong biên niên sử, chúng tôi có thể sử dụng nó để chứng thực quyền cai trị của ngài đối với một số vùng đất đó - hoặc thậm chí là tất cả chúng...""
  commission_epic.6003.a:0 "Tất cả chúng!"
  commission_epic.6003.b:0 "[neighboring_county_1.GetNameNoTierNoTooltip] hợp lý vào thời điểm này trong năm!"
  commission_epic.6003.c:0 "[neighboring_county_2.GetNameNoTierNoTooltip] là những gì tôi muốn!"
  commission_epic.6003.d:0 "[neighboring_county_3.GetNameNoTierNoTooltip] phải là của tôi."
  commission_epic.paranoid_neighbors:0 "láng giềng  của ngài sẽ rất tức giận khi biết về biên niên sử này"

  commission_epic.6004.t:0 "Yêu Sách Đáng Tin"
  commission_epic.6004.writerservant:0 "[composer.GetName] đã và đang làm việc siêng năng với biên niên sử của ta, thứ ngày càng trở nên lớn hơn về cả quy mô lẫn khối lượng.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]", [composer.GetSheHe] nói, "Tôi tìm thấy một tài liệu cũ về quyền thuế và đất đai, một bài đọc khá tẻ nhạt, nhưng nó đề cập đến một [ancestor_1.GetLadyLord] tên là [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Tall','the Bald')], người đã cai trị [neighboring_county_1.GetNameNoTier] và [neighboring_county_2.GetNameNoTier] vào những ngày xưa cũ. Tôi đã lần theo dòng dõi của [ancestor_1.GetHerHis] từ cuối thời cổ đại đến tận ngài! Do đó, tôi có thể mang lại cho ngài các tuyên bố về một trong hai vùng đất đó, đáng tin cậy đến mức không ai có thể phủ nhận chúng.""
  commission_epic.6004.scribes:0 "Các thư lại của ta đã làm việc chăm chỉ với biên niên sử của ta, thứ ngày càng dài và lớn hơn theo từng ngày.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]", họ nói, "Chúng tôi tìm thấy một hiến chương hoàng gia có nguồn gốc rất cổ xưa, trao quyền cai trị [neighboring_county_1.GetNameNoTier] và [neighboring_county_2.GetNameNoTier] cho một [ancestor_1.GetLadyLord] tên là [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Good','the Fortunate')]. Thông qua sự dẫn dắt của [ROOT.GetCharacter.GetFaith.HighGodName], chúng tôi có thể lần theo dòng dõi của ngài trở lại [ancestor_1.GetHerHim], và chúng tôi đã chắc chắn làm điều đó trong biên niên sử. Một trong hai vùng đất đó sẽ là của ngài một cách hợp pháp.""
  commission_epic.6004.a:0 "Tại sao không lấy cả hai?"
  commission_epic.6004.b:0 "[neighboring_county_1.GetNameNoTierNoTooltip] chắc chắn là một phần thừa kế của tôi."
  commission_epic.6004.c:0 "Tôi luôn nghĩ [neighboring_county_2.GetNameNoTierNoTooltip] nên thuộc về tôi!"

  commission_epic.6005.t:0 "Một Sử Thi Chưa Hoàn Thành"
  commission_epic.6005.writerservant:0 "\"Tôi đã nghi ngờ có điều gì không ổn với biên niên sử của mình từ lâu, và quả thật, [composer.GetName] đến gặp tôi với vẻ lo lắng.\n\n'Chà, [ROOT.Char.Custom('FormOfAddressForLiege')]', [composer.GetSheHe] nói, 'dù tôi đã cố gắng, tôi không thể tìm thấy lịch sử yêu sách đủ tốt để chứng minh. Tôi không thể tiếp tục công việc này. Tuy nhiên, tôi đã tạo ra một biên niên sử ca ngợi đức hạnh của dòng tộc ngài. Xin ngài hài lòng với điều này, và đừng trừng phạt tôi vì thất bại...'\""
  commission_epic.6005.scribes:0 "Các thư ký của tôi dường như gặp khó khăn với biên niên sử, và quả thật, họ đến gặp tôi với vẻ lo lắng.\n\n'Chà', họ nói, 'chúng tôi không thể tìm thấy lịch sử yêu sách đủ tốt để chứng minh. Chúng tôi đã cố gắng, nhưng vượt ngoài khả năng. Tuy nhiên, chúng tôi đã tạo ra biên niên sử ca ngợi đức hạnh dòng tộc ngài. Xin ngài hài lòng, và đừng trừng phạt chúng tôi vì thất bại...'\""
  commission_epic.6005.a:0 "Vào ngục với các ngươi!"
  commission_epic.6005.b:0 "Các kẻ bất tài..."
  commission_epic.6005.c:0 "[ROOT.GetCharacter.GetFaith.HighGodName] có đang trừng phạt tôi vì kiêu ngạo?"
  commission_epic.6005.d:0 "Ít ra tôi cũng có một biên niên sử..."

  commission_epic.6006.t:0 "Tuyên Truyền Mạnh Mẽ"
  commission_epic.6006.writerservant:0 "\"Hoàn tất rồi, [ROOT.Char.GetLadyLord]\", [composer.GetName] nói, nhẹ nhõm, trao cho tôi một cuốn sách lớn.\n\n\"Đây là biên niên sử của nhà [ROOT.Char.GetDynastyHouseNameNoTooltip], mô tả chi tiết lịch sử cai trị các vùng đất mà ngài mong muốn. Chắc chắn không ai có thể tranh cãi yêu sách chính đáng của ngài!\""
  commission_epic.6006.scribes:0 "Cuối cùng, các thư lại của ta đã hoàn thành biên niên sử tuyên truyền. Họ trông có vẻ nhẹ nhõm khi trao cho ta một cuốn sách to lớn.\n\n"Đây rồi, [Select_CString(ROOT.Char.IsFemale,'Milady','Sire')], biên niên sử vĩ đại của gia tộc [ROOT.Char.GetDynastyHouseNameNoTooltip], trình bày chi tiết về tất cả các tuyên bố của ngài. Chúc nó mang lại cho ngài vận may lớn.""
  commission_epic.6006.a:0 "Hoàn hảo!"

  propaganda_chronicle_name:0 "Biên Niên Sử Tuyên Truyền Nhà [ROOT.Char.GetDynastyHouseNameNoTooltip]"
  propaganda_chronicle_desc:0 "Cuốn sách đồ sộ này trình bày chi tiết về vinh quang của nhà [ROOT.Char.GetDynastyHouseNameNoTooltip], và các yêu sách lãnh thổ khác nhau, ít nhiều kỳ lạ."
 
  half_baked_propaganda_chronicle_name:0 "Biên Niên Sử Tuyên Truyền Chưa Hoàn Thành"
  half_baked_propaganda_chronicle_desc:0 "Cuốn sách này có thể đã nổi tiếng tai tiếng nếu hoàn tất. Nhưng hiện tại, nó không thuyết phục bất kỳ độc giả nào về các yêu sách lãnh thổ, thay vào đó ca ngợi các đức hạnh được cho là của dòng tộc [ROOT.Char.GetDynastyNameNoTooltip]."
 



  commission_epic.9001.t:0 "Sử Thi Gia Đình"
  commission_epic.9001.writer:1 "Sử thi [ROOT.Char.Custom('CompositionType')] của gia tộc tôi cuối cùng đã hoàn tất, và [composer.GetTitledFirstName] có lý do để tự hào!"
  commission_epic.9001.servant:0 "Có vẻ như ta đã khôn ngoan khi chọn [composer.GetTitledFirstName] để soạn thảo [ROOT.Char.Custom('CompositionType')] của gia đình ta. Bất chấp những thách thức của [composer.GetHerHis], tác phẩm hoàn chỉnh khá ấn tượng."
  commission_epic.9001.scribes:1 "Sử thi [ROOT.Char.Custom('CompositionType')] của gia tộc tôi cuối cùng đã hoàn tất, và các [ROOT.Char.Custom('CommissionEpicScribes')] của tôi có lý do để tự hào!"
  commission_epic.9001.conclusion:0 "\n\nTổ tiên của tôi là trung tâm của nó, như tấm gương sáng về ý nghĩa của một nhà cai trị trong thời đại chúng tôi, dù có vài chỗ kéo dài, và phần về [ROOT.Char.Custom('CompositionDetail')] thật hết sức vô lý. Tuy nhiên, tôi tự hào giữ nó trong thư viện gia đình, để các thế hệ sau thưởng thức và học hỏi."
  commission_epic.9001.a:0 "Lịch sử kể chuyện thật kỳ diệu."

  commission_epic.9002.t:0 "Một Sử Thi Tuyệt Vời"
  commission_epic.9002.writer:0 "[composer.GetTitledFirstName] đã hoàn thành sử thi gia đình tôi, và một [ROOT.Char.Custom('CompositionType')] vinh quang mà [composer.GetSheHe] sáng tác!"
  commission_epic.9002.scribes:0 "Các [ROOT.Char.Custom('CommissionEpicScribes')] của tôi đã hoàn thành sử thi gia đình, và một [ROOT.Char.Custom('CompositionType')] vinh quang mà họ sáng tác!"
  commission_epic.9002.conclusion:0 "\n\nNó có cao trào kịch tính, những băn khoăn đạo đức và các trận đấu căng thẳng. Mọi thứ gia tộc tôi được rèn luyện từ đó đều có mặt! Ngay cả phần về [ROOT.Char.Custom('CompositionDetail')], dường như phi thực tế, đã trở thành một khoảnh khắc cảm động vạch ra định mệnh của Nhà tôi!"
  commission_epic.9002.a:0 "Có thể đây là [ROOT.Char.Custom('CompositionType')] vĩ đại nhất từng được viết!"

  commission_epic.9101.t:0 "Sử Thi Gia Đình: Tác Phẩm Hoàn Thành"
  commission_epic.9101.desc:0 "Sau tất cả thời gian [composer.GetTitledFirstName] dành tại triều đình của tôi, và mức độ hiểu biết của [composer.GetSheHe] về tôi, thật kỳ lạ khi [composer.GetSheHe] sắp rời đi.\n\n'Tôi còn nhiều nơi phải đến, và những câu chuyện khác cần kể,' [composer.GetSheHe] cố giải thích."
  commission_epic.9101.a:0 "Chắc tôi phải nói lời tạm biệt."
  commission_epic.9101.b:0 "Vẫn còn rất nhiều điều cho ngài!"
  commission_epic.9101.c:0 "Tôi cũng cần ngài. Ở đây."
  commission_epic.9101.d:0 "Miễn là ngài viết thư cho tôi!"
  commission_epic.9101.d.tt: "[composer.GetTitledFirstName] sẽ rời triều đình của ngài"

  commission_epic.9102.t:0 "Sử Thi Gia Đình: Phục Vụ"
  commission_epic.9102.desc:0 "[composer.GetTitledFirstName] đã chứng tỏ [composer.GetHerselfHimself] năng lực hơn nhiều so với tôi mong đợi từ một người hầu bình thường. Nếu tôi không biết rõ hơn, tôi có thể đã nghĩ [composer.GetHerHim] đến từ dòng dõi thi nhân!\n\nSau tất cả thời gian bên nhau, thật kỳ lạ khi [composer.GetSheHe] phải quay lại xúc đất, hay bất cứ việc gì trước kia [composer.GetSheHe] từng làm."
  commission_epic.9102.a:0 "[composer.GetSheHe|U] nên ra thế giới bên ngoài."
  commission_epic.9102.a.flavor:0 "Để [composer.GetSheHe] xem liệu [composer.GetSheHe] có thể làm được điều gì với [composer.GetHerselfHimself]"
  commission_epic.9102.b:0 "Tôi chắc chắn có thể tìm ra việc gì đó cho [composer.GetHerHim]."
  commission_epic.9102.c:0 "Nghe có vẻ lạ, nhưng tôi muốn giữ [composer.GetHerHim] ở lại."

  commission_epic.9103.desc:0 "Sau tất cả thời gian [composer.GetTitledFirstName] dành tại triều đình của tôi, và mức độ hiểu biết của [composer.GetSheHe] về tôi, thật lạ khi [composer.GetSheHe] không đi đâu cả.\n\n[composer.GetFirstNameNoTooltip] đồng ý. 'Tôi còn nhiều câu chuyện chưa kể, và có lẽ tôi nên tiếp tục kể chúng tại đây.'"
  commission_epic.9103.a:0 "Ngài sẽ tiếp tục phục vụ tôi một cách danh dự."

  commission_epic.9104.desc:0 "Sau tất cả thời gian [composer.GetTitledFirstName] dành tại triều đình của tôi, và mức độ hiểu biết của [composer.GetSheHe] về tôi, thật kỳ lạ khi [composer.GetSheHe] không ở đây để chứng kiến phản ứng với tác phẩm của [composer.GetHerHis].\n\nNgười học thức và trẻ em đều [ROOT.Char.Custom('CompositionTypeActionPP')] nó, và ngay cả tôi cũng thấy thật cảm hứng."
  commission_epic.9104.a:0 "Ít nhất [composer.GetSheHe] không đi mất mãi!"
  commission_epic.9104.b:0 "Cuộc sống mà, đôi khi là vậy."
  commission_epic.9104.b.flavor:0 "[ROOT.Char.Custom('CompositionTypeActionPP')|U] câu chuyện, tôi tự hỏi. [composer.GetFirstNameNoTooltip] có biết đây sẽ là kết thúc chăng?"

  commission_epic.9998.t:0 "Sử Thi Gia Đình: Một Phiền Toái"
  commission_epic.9998.imprisoned_by_me:0 "Với [composer.GetTitledFirstName] trong ngục của tôi,"
  commission_epic.9998.imprisoned:0 "Với [composer.GetTitledFirstName] bị giam,"
  commission_epic.9998.incapacitated:0 "Với [composer.GetTitledFirstName] trong tình trạng hiện tại của [composer.GetHerHis],"
  commission_epic.9998.left_court:0 "Với [composer.GetTitledFirstName] không còn tại triều đình của tôi,"
  commission_epic.9998.ending:0 "thật khó để [composer.GetHerHim] tiếp tục công việc [composer.GetHerHis] về sử thi gia đình của ta.\n\nRất may là [ROOT.Char.Custom('CommissionEpicScribes')] của ta sẽ sẵn sàng tiếp nhận công việc."
  commission_epic.9998.a:0 "Tôi chắc họ sẽ làm tốt thôi."
  commission_epic.9998.tt:0 "Công việc vẫn tiếp tục"

  commission_epic.9999.t:0 "Sử Thi Gia Đình: Kết Thúc"
  commission_epic.9999.murdered_by_me:0 "Xét đến những biện pháp nghiêm khắc tôi phải thực hiện với [composer.GetTitledFirstName], có vẻ như [composer.GetSheHe] vốn không thực sự phù hợp để sáng tác sử thi gia đình tôi.\n\nMay mắn thay, các [ROOT.Char.Custom('CommissionEpicScribes')] của tôi hoàn toàn có khả năng tự mình thực hiện."
  commission_epic.9999.died:0 "Với sự ra đi của [composer.GetTitledFirstName], sử thi gia đình tôi chưa hoàn tất.\n\nĐó sẽ là nhiệm vụ khó khăn, nhưng các [ROOT.Char.Custom('CommissionEpicScribes')] của tôi sẽ phải tiếp tục nỗ lực."
  commission_epic.9999.a:1 "Công việc của [composer.GetHerHis|U] sẽ được hoàn tất."
