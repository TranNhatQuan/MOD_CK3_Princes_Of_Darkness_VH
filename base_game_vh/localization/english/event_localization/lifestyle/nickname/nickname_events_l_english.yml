l_english:
  lifestyle_nicknames.0001.t:0 "Quy Ước Danh Hiệu"
  lifestyle_nicknames.0001.desc:0 "Sau vô số giờ vùi đầu vào sổ sách, tính toán từng con số và quản lý [ROOT.Char.Custom('GetCourt')], sự tỉ mỉ của ta cuối cùng cũng được đền đáp. Ta đã khiến [ROOT.Char.Custom('GetRealmOrDomicile')|l] của mình trở nên phồn thịnh hơn bao giờ hết!\n\nMọi [ROOT.Char.GetTitleAsNameNoTooltip|l] tài cán như ta, [ROOT.Char.GetFullName], đều nên được người đời biết đến nhờ thành tựu của mình.\n\nVậy giờ ta nên gọi bản thân là gì?"
  lifestyle_nicknames.0001.a:0 "Ta muốn được biết đến vì tài quản trị!"
  lifestyle_nicknames.0001.b:0 "Người đời sẽ nhớ đến sự công bằng của ta!"
  lifestyle_nicknames.0001.c:0 "Thiên hạ sẽ biết đến ta qua luật lệ của ta!"
  lifestyle_nicknames.0001.d:0 "Nghĩ lại thì thôi vậy."
  lifestyle_nicknames.0001.tt:0 "Ngươi quyết định để hành động của mình — thay vì một [epithet|E] — tự nói lên tất cả."
 
  lifestyle_nicknames.0002.desc:0 ""Ý ngài sẽ được thi hành, thưa [ROOT.Char.Custom('GetCourtOwner')] của ta!" [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_steward'))] của ta lớn tiếng nói khi [my_steward.GetSheHe] rời khỏi [ROOT.Char.Custom('GetChamberPlural')] của ta.\n\nTa đứng dậy khỏi ghế và bước ra [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames.0002.laamp',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames.0002.laamp','lifestyle_nicknames.0002.landed'))] Ta muốn họ nhớ đến ta vì điều gì?"
  lifestyle_nicknames.0002.landed: "ban công. Bên dưới ta thấy hàng ngàn người, tất cả đều được hưởng thịnh vượng dưới sự cai trị của ta."
  lifestyle_nicknames.0002.laamp: "trung tâm trại. Xung quanh ta là hàng trăm người, tất cả đều được hưởng thịnh vượng dưới lá cờ của ta."
  lifestyle_nicknames.0002.a:0 "Ta muốn được nhớ đến vì sự hào phóng của mình."
  lifestyle_nicknames.0002.b:0 "Ta mong họ biết đến lòng nhân từ của ta."
  lifestyle_nicknames.0002.c:0 "Mong rằng một ngày họ sẽ nhìn lại #EMP sự tao nhã trong cách ta trị quốc#!."
  lifestyle_nicknames.0002.d:0 "Nghĩ lại thì thôi vậy."
  lifestyle_nicknames.0002.tt:0 "Có lẽ một lãnh địa phồn thịnh đã là phần thưởng đủ lớn, hơn bất kỳ [nickname|E] hoa mỹ nào."
 
  lifestyle_nicknames.0003.t:0 "Lời Nói Là Bạc"
  lifestyle_nicknames.0003.desc:0 "Mọi nỗ lực dành cho ngoại giao cuối cùng cũng mang lại kết quả. Người ta nói im lặng là vàng, nhưng ta nhận ra rằng khả năng giao tiếp, tranh luận và thuyết phục còn quý giá hơn vàng.\n\nMỗi vị quân chủ đáng kính đều được nhớ đến bằng một danh xưng thứ hai vì thành tựu của họ, vậy ta nên được ghi nhớ ra sao?"
  lifestyle_nicknames.0003.a:0 "Ta biết rồi! Thế còn "Vĩ Đại" thì sao?"
  lifestyle_nicknames.0003.b:0 "[ROOT.Char.GetFullName] Khoan Hồng!"
  lifestyle_nicknames.0003.c:0 "Kẻ Kiến Tạo Hòa Bình. Nghe cũng rất hay!"
  lifestyle_nicknames.0003.d:0 "Nghĩ lại thì thôi vậy."
  lifestyle_nicknames.0003.tt:0 "Một [cognomen|E] nên được giành lấy bằng công lao, chứ không phải tự nhận."
 
  lifestyle_nicknames.0004.desc:0 "Mọi nỗ lực hoàn thiện nghệ thuật trị quốc của ta đã khiến quan hệ trong và ngoài nước đều ở trạng thái tuyệt vời. Dân chúng vui vẻ vẫy chào đoàn tùy tùng của ta trên đường phố, và ta biết tên hầu hết các cận thần của mình.\n\nTa nghĩ mình đã tạo dựng được danh tiếng, nhưng đó sẽ là gì?"
  lifestyle_nicknames.0004.a:0 "Ta đối xử công bằng với tất cả mọi người, bất kể địa vị của họ, vậy nên..."
  lifestyle_nicknames.0004.b:0 "Ta mong được trân trọng vì lòng tốt của mình."
  lifestyle_nicknames.0004.c:0 "Ai cũng nói nói chuyện với ta rất dễ chịu."
  lifestyle_nicknames.0004.d:0 "Nghĩ lại thì thôi vậy."
  lifestyle_nicknames.0004.tt:0 "Hành động của một quân vương nên vang dội hơn bất kỳ [epithet|E] nào."
 
  lifestyle_nicknames.0005.t:0 "Thanh Kiếm Của Lý Trí"
  lifestyle_nicknames.0005.desc:0 "Một buổi tối yên bình, sau khi tất cả [ROOT.Char.Custom('GetCourtierPlural')] đã rời khỏi [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')], ta ngồi xuống suy ngẫm một lúc.\n\n"Tất cả những bậc quân vương vĩ đại trên đời đều có danh xưng lẫy lừng, vậy tại sao ta lại không? Từ nay về sau, qua bao thế hệ, ta sẽ được biết đến với cái tên [ROOT.Char.GetTitledFirstName]..."
  lifestyle_nicknames.0005.a:0 "...$nick_the_conqueror$!"
  lifestyle_nicknames.0005.b:0 "...$nick_haardraade$!"
  lifestyle_nicknames.0005.c:0 "...$nick_the_noble$!"
  lifestyle_nicknames.0005.d:0 "..."
  lifestyle_nicknames.0005.tt:0 "Ngươi tựa lưng lại: chiến lược và thanh kiếm của ngươi rồi sẽ khắc nên một [cognomen|E] xứng đáng."
 
  lifestyle_nicknames.0006.desc:0 "Ta nhìn qua những kế hoạch chiến trận trải trước mặt và cầm lên một quân lính gỗ. Khi còn nhỏ ta từng chơi với chúng trong phòng mình, và giờ đây ta dùng chính những món đồ chơi ấy cho chiến tranh.\n\n"[ROOT.Char.GetTitledFirstName]?" — [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_marshal'))] của ta bước vào lều — "Các chỉ huy muốn nói chuyện với ngài. Ngài muốn được giới thiệu như thế nào?"\n\n[my_marshal.GetSheHe|U] ngụ ý rất đúng, [ROOT.Char.Custom('WomenMenPeople_GenderPreference')] cần biết rằng họ đang chiến đấu dưới trướng một nhân vật phi thường."
  lifestyle_nicknames_second: "[GetCourtPositionType('second_camp_officer').GetNameNoTooltip]"
  lifestyle_nicknames_marshal: "[GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName]"
  lifestyle_nicknames_steward: "[GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]"
  lifestyle_nicknames_kurultai: "[GetPlayer.GetCouncillorPosition( 'councillor_kurultai_1' ).GetPositionName]"
  lifestyle_nicknames.0006.a:0 "Ta muốn họ biết đến ta vì đầu óc chiến lược của mình."
  lifestyle_nicknames.0006.b:0 "Họ sẽ biết đến ý chí kiên định của ta."
  lifestyle_nicknames.0006.c:0 "Lòng dũng cảm đã đưa ta đến đây..."
  lifestyle_nicknames.0006.d:0 "Xin hãy gọi ta là [ROOT.Char.GetFirstNameNoTooltip]."
  lifestyle_nicknames.0006.tt:0 "Ngươi cũng chỉ là một [ROOT.Char.GetWomanMan] phàm trần, và không [epithet|E] nào có thể thay đổi điều đó."
 
  lifestyle_nicknames.0007.t:0 "Im Lặng Là Vàng"
  lifestyle_nicknames.0007.desc:0 "Người ta nói ảnh hưởng giống như cỏ mùa xuân. Nó có thể tự mọc lên, nhưng ta đã kiên nhẫn chăm bón cho của mình cho đến khi nó lan khắp lãnh địa của ta, rồi còn xa hơn nữa. Khu vườn ấy, thứ ta đã dày công vun trồng, nay đã nở rộ thành một cảnh tượng thực sự mỹ lệ.\n\nQuyền lực hiện hữu ở nơi ta mong muốn. Cái giá ta phải trả để khiến người khác giữ im lặng không hề nhỏ, nhưng đó là sự hy sinh ta sẵn sàng chấp nhận. Ta là một thế lực không thể xem thường, và người đời nên nhớ đến ta vì tầm ảnh hưởng ta nắm giữ! Một danh xưng đầy uy lực hẳn sẽ khắc sâu vị trí của ta trong lịch sử..."
  lifestyle_nicknames.0007.a:0 "Ta như một cái bóng. Ta dõi theo mọi bước đi."
  lifestyle_nicknames.0007.b:0 "Ta quan sát từ xa và ra tay không chút do dự."
  lifestyle_nicknames.0007.c:0 "Thấy thần dân run sợ chính là phần thưởng lớn nhất."
  lifestyle_nicknames.0007.d:0 "Bí mật của thành công chính là bí mật."
  lifestyle_nicknames.0007.tt:0 "Ngươi quyết định từ bỏ ý định ấy. Mang lấy một [nickname|E] tai tiếng chắc chắn chỉ cản trở những toan tính của ngươi sau này."
 
  lifestyle_nicknames.0008.desc:0 "Một [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'quân chủ')], người có thể khiến [ROOT.Char.GetHerHis] [ROOT.Char.Custom('GetFollowerOrVassalPlural')] phải khiếp sợ và truyền cảm hứng cho thần dân. Một [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'nhà cai trị')] được thần dân yêu mến, nắm trong tay quyền lực để thay đổi vận mệnh của [ROOT.Char.Custom('GetRealmOrDomicile')]. Một vùng đất nơi kẻ mạnh không áp bức kẻ yếu.\n\nĐó là những giá trị Ta hằng tin tưởng! Ta muốn hiện thực hóa giấc mơ này.\n\nTừ nay Ta sẽ được biết đến vì..."
  lifestyle_nicknames.0008.a:0 "Sự sắc sảo của ta trong việc quản lý quốc sự."
  lifestyle_nicknames.0008.b:0 "Những bí mật và lời thì thầm có thể làm sụp đổ cả đế chế."
  lifestyle_nicknames.0008.c:0 "Mạng lưới ảnh hưởng được ta dày công dệt nên."
  lifestyle_nicknames.0008.d:0 "Những hành động ta thực hiện để phụng sự gia tộc và lãnh địa."
  lifestyle_nicknames.0008.tt:0 "Ngươi quyết định không nhận lấy một [epithet|E] — một lãnh địa phồn vinh đã là phần thưởng đủ lớn."
 
  lifestyle_nicknames.0009.t:0 "Ngòi Bút Mạnh Hơn Gươm"
  lifestyle_nicknames.0009.desc:0 "Thư viện trong cung điện của ta thực sự là một cảnh tượng đáng chiêm ngưỡng. Hàng ngàn sổ sách, sách vở và cuộn da, chứa đựng tri thức mà phần lớn thiên hạ chưa từng biết đến. Đó là niềm tự hào của ta, một trong những thành tựu vĩ đại nhất của ta.\n\nNhững trí tuệ vĩ đại của quá khứ vẫn còn được ghi nhớ, tác phẩm của họ được trích dẫn và nghiên cứu. Ta xứng đáng gia nhập hàng ngũ ấy. Từ nay ta sẽ được biết đến với cái tên [ROOT.Char.GetTitledFirstName]..."
  lifestyle_nicknames.0009.a:0 "...$nick_the_enlightened$!"
  lifestyle_nicknames.0009.b:0 "...$nick_the_truthseeker$!"
  lifestyle_nicknames.0009.c:0 "...$nick_the_chronicler$!"
  lifestyle_nicknames.0009.d:0 "..."
  lifestyle_nicknames.0009.tt:0 "Ngươi không nhận lấy một [cognomen|E], xấu hổ vì ý nghĩ kiêu ngạo ấy thậm chí đã thoáng qua trong đầu."
 
  lifestyle_nicknames.0010.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], đã đến lúc." [my_chaplain.GetCouncilTitle|U] [my_chaplain.GetFirstName] cúi đầu thật sâu trước cửa phòng của ta.\n\nTa gom các ghi chép thành một chồng trên bàn viết; ta sắp phải đọc một bài diễn thuyết về những thành tựu văn hóa gần đây của lãnh địa, trước mặt các sứ giả và đại sứ.\n\n[my_chaplain.GetCouncilTitle] của ta chặn ta lại trước khi bước vào đại sảnh:\n"Ai cũng biết #EMP về#! ngài, dĩ nhiên rồi — nhưng ngài muốn ta giới thiệu ngài như thế nào?""
  lifestyle_nicknames.0010.a:0 "Ta là ai nếu không phải "$nick_the_sage$?""
  lifestyle_nicknames.0010.b:0 "Hm. Thế "$nick_the_scholar$" thì sao?"
  lifestyle_nicknames.0010.c:0 "Có lẽ ta cũng là một sử gia..."
  lifestyle_nicknames.0010.d:0 "Ta chỉ là [ROOT.Char.GetTitleAsName]."
  lifestyle_nicknames.0010.tt:0 "Ngươi bước vào đại sảnh mà không mang theo một [nickname|E] mới."
 
  lifestyle_nicknames.0011.t:0 "Dư Âm"
  lifestyle_nicknames.0011.desc:0 "Dù ta đi đến đâu, ta cũng không thể tránh khỏi những ánh nhìn đầy bất bình của cả quý tộc lẫn thứ dân. Dù ta có ý tốt đến đâu, cái tên ta tự chọn cho mình dường như đã bị khinh miệt nhiều hơn ta dự liệu.\n\nTa lui về phòng riêng và suy ngẫm xem mình nên làm gì..."
  lifestyle_nicknames.0011.a:0 "Có thể họ không tôn trọng ta, nhưng họ sẽ phải tuân lệnh!"
  lifestyle_nicknames.0011.a.tt:0 "Ngươi cho mọi người biết rằng ngươi sẽ giữ lấy [cognomen|E] đã chọn và sẽ không thay đổi."
  lifestyle_nicknames.0011.b:0 "Họ nói đúng. Ta đã nghĩ gì vậy?"
 
  lifestyle_nicknames.1000.t:0 "Biệt Danh: [nickname_getter.GetNicknameNoTooltip|U]"
  lifestyle_nicknames.1000.desc:0 ""Này [informer.Custom2('RelationToMeShort', SCOPE.sC('nickname_getter'))] của ta, ngươi đã nghe họ gọi ngươi là gì chưa?" [nickname_getter.Custom2('RelationToMeShort', SCOPE.sC('informer'))] của ta, [informer.GetFirstName], nói với ta, trong khi [informer.Custom('quirk_pos_pp')].\n\n"
  lifestyle_nicknames.1000.desc_prison:0 ""[nickname_getter.GetFirstNameNoTooltip], ngươi đã nghe họ gọi ngươi là gì chưa?" [informer.GetFirstName] lắp bắp, gõ chiếc cốc vào song sắt.\n\n"
  lifestyle_nicknames.1000.desc_good:0 ""Họ gọi ngươi là #EMP '[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]'#!, thật lẫy lừng phải không? Từ nông dân đến quý tộc đều nhắc đến cái tên ấy.""
  lifestyle_nicknames.1000.desc_bad:0 ""Họ gọi ngươi là #EMP '[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]'#!... có lẽ không phải điều #EMP dễ nghe#! cho lắm, nhưng e rằng ngươi chẳng thể làm gì để thay đổi nó.""
  lifestyle_nicknames.1000.end_bad_bad:0 "\n\n"Thôi thì làm quen với nó đi!" [informer.GetFirstNameNoTooltip] cười khẩy khi [informer.GetSheHe] quay lưng bước đi."
  lifestyle_nicknames.1000.end_good_bad:0 "\n\n"Không phải cái tên ta sẽ chọn cho ngươi..." [informer.GetFirstNameNoTooltip] nói, rõ ràng đầy bực bội."
  lifestyle_nicknames.1000.end_bad_good:0 "\n\n"Dù sao đi nữa, ta hứa sẽ không gọi ngươi bằng cái tên đó." [informer.GetFirstNameNoTooltip] nói và mỉm cười."
  lifestyle_nicknames.1000.end_good_good:0 "\n\n"Đáng để ăn mừng đấy!" [informer.GetFirstNameNoTooltip] reo lên với giọng đầy vui vẻ."
  lifestyle_nicknames.1000.a:0 "Ta có thể quen với cái tên này!"
  lifestyle_nicknames.1000.b:0 "'[nickname_getter.GetNicknameNoTooltip|U]'? #EMP Cái gì cơ!?#! Thật nực cười!"
  lifestyle_nicknames.1000.c:0 "Một tia sáng nhỏ nhoi giữa bóng tối..."
  lifestyle_nicknames.1000.d:0 "À. Hóa ra đời #emp vẫn có thể#! tệ hơn."
  lifestyle_nicknames.1000.e:0 "*Gầm gừ tán thành*"
  lifestyle_nicknames.1000.f:0 "*Gầm gừ phản đối*"
