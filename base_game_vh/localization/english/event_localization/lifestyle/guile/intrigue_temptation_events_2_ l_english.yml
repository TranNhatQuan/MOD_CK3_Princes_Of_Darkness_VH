l_english:
 #A courtier propositions you via a lewd image, by Ewan Cowhig Croft
  intrigue_temptation.3100.cloth_t:0 "Đường Khâu Thật... Đẹp"
  intrigue_temptation.3100.stone_t:0 "Bức Khắc Thật... Đẹp"
  intrigue_temptation.3100.wax_t:0 "Nét Khắc Thật... Đẹp"
  intrigue_temptation.3100.wood_t:0 "Tác Phẩm Chạm Khắc Thật... Đẹp"
  intrigue_temptation.3100.vellum_t:0 "Bức Vẽ Thật... Đẹp"
  intrigue_temptation.3100.start_desc:0 "Một [ROOT.Char.Custom('lowly_servant_type')] lặng lẽ đặt gói đồ cạnh ta. Ta ngáp dài, miễn cưỡng chịu đựng bữa tiệc tẻ nhạt này rồi mở nó ra.\n\nBên trong là"
  intrigue_temptation.3100.end_desc:1 "khắc họa hình thể của một [propositioning_courtier.GetWomanMan] được ưu ái về thân thể, uốn mình trong tư thế \"quyến rũ\".\n\nTa nhìn quanh [ROOT.Char.Custom('GetRoom')], sững sờ, rồi thấy [propositioning_courtier.GetTitledFirstNameNoTooltip] đang nhìn lại. [propositioning_courtier.GetSheHe|U] nở nụ cười, còn đôi lông mày của [propositioning_courtier.GetHerHis] thì nhúc nhích như sâu bướm điên loạn."
  intrigue_temptation.3100.cloth_desc:0 "một mảnh vải bẩn, thêu vụng về,"
  intrigue_temptation.3100.stone_desc:0 "một phiến đá mỏng, khắc thô sơ,"
  intrigue_temptation.3100.wax_desc:0 "một bảng sáp có mùi khó chịu, khắc cẩu thả,"
  intrigue_temptation.3100.wood_desc:0 "một tấm gỗ, chạm khắc vụng về,"
  intrigue_temptation.3100.vellum_desc:0 "một tờ da dê với bản phác thảo mực lem"
  intrigue_temptation.3100.a:0 "Thật ghê tởm!"
  intrigue_temptation.3100.a.tt:0 "Bất kỳ nhân vật đoan chính nào trong [ROOT.Char.Custom('GetCourt')] của ngươi sẽ thêm chút kính trọng đối với ngươi"
  intrigue_temptation.3100.b:0 "Lại thêm một kẻ ngu si háo hức, lại thêm một bí mật."
  intrigue_temptation.3100.b.tt:0 "Ta cố moi ra một bí mật từ [propositioning_courtier.GetShortUINameNoTooltip]"
  intrigue_temptation.3100.b.tt.secret_gained:0 "Trên giường, [propositioning_courtier.GetShortUINameNoTooltip] kể những câu chuyện thật thú vị."
  intrigue_temptation.3100.b.tt.xp_gained:0 "Đáng tiếc, [propositioning_courtier.GetShortUINameNoTooltip] chẳng biết gì cả."
  intrigue_temptation.3100.cloth_c:0 "Một [propositioning_courtier.GetWomanMan] với đôi tay khéo léo..."
  intrigue_temptation.3100.stone_c:0 "Ồ, trông [propositioning_courtier.GetSheHe] thật #EMP rắn chắc#!..."
  intrigue_temptation.3100.wax_c:0 "Ồ, sáp vẫn còn ấm..."
  intrigue_temptation.3100.wood_c:0 "[propositioning_courtier.GetSheHe|U] trông thật hấp dẫn..."
  intrigue_temptation.3100.vellum_c:0 "Vậy ra [propositioning_courtier.GetSheHe] thích làm bừa bộn..."
  intrigue_temptation.3100.d:0 "Ta nghĩ nên cho mọi người cùng xem."
  public_shamer_modifier:0 "Chia Sẻ Nghệ Thuật Nghiệp Dư"
 #While drinking with a courtier, you lead them towards deviancy, by Ewan Cowhig Croft
  intrigue_temptation.3110.t:0 "Một Chút Thử Nghiệm"
  intrigue_temptation.3110.start_desc:1 "Một buổi tối dài bàn chuyện quốc sự với [potential_deviant.GetTitledFirstNameNoTooltip] dần biến thành cảnh cả hai say khướt, líu lưỡi kể cho nhau những câu chuyện tục tĩu.\n\nTa vừa kể xong câu chuyện"
  intrigue_temptation.3110.end_desc:0 "thì thấy ánh nhìn kỳ lạ trong mắt người bạn đồng hành.\n\nÝ nghĩ tống tiền bất chợt lóe lên trong đầu ta. Có lẽ [potential_deviant.GetTitledFirstNameNoTooltip] hứng thú với chủ đề này hơn [potential_deviant.GetSheHe] nghĩ?"
  intrigue_temptation.3110.0_desc:0 "về mối tình cấm kỵ giữa dê và lửng,"
  intrigue_temptation.3110.1_desc:0 "về nỗi ham muốn u sầu dành cho hình ảnh phản chiếu không thể chạm tới của mình,"
  intrigue_temptation.3110.2_desc:0 "về một mối quan hệ khó tin liên quan đến một con ngựa,"
  intrigue_temptation.3110.3_desc:0 "về một lãnh chúa yêu mảnh đất của mình hơi #EMP quá#! mức,"
  intrigue_temptation.3110.4_desc:0 "liên quan đến ba [ROOT.Char.GetFaith.PriestNeuterPlural] dâm đãng và một chiếc mũ nỉ đã mòn tả tơi,"
  intrigue_temptation.3110.5_desc:0 "về những cuộc phiêu lưu tình ái của ông nội ta với một con cá ranh mãnh,"
  intrigue_temptation.3110.6_desc:0 "về một chiếc bánh ngọt có đường cong hấp dẫn,"
  intrigue_temptation.3110.7_desc:0 "liên quan đến một gốc cây được tên cướp vô cùng yêu thích,"
  intrigue_temptation.3110.8_desc:0 "về sức quyến rũ của vài quái vật biển kỳ lạ,"
  intrigue_temptation.3110.9_desc:0 "kể về những khuynh hướng tự nhiên của vài nền văn hóa man rợ,"
  intrigue_temptation.3110.a:0 "Ta còn biết vài câu chuyện tương tự..."
  intrigue_temptation.3110.a.tt_success:0 "[potential_deviant.GetShortUINameNoTooltip] khám phá ra một thú vui mới"
  intrigue_temptation.3110.a.tt_fail:0 "[potential_deviant.GetShortUINameNoTooltip] ghê tởm trước sự tục tĩu của ta"
  intrigue_temptation.3110.b:0 "Thế là #EMP quá#! đủ cho hôm nay rồi."
 #You enjoy a dinner with one of your guests, and try to tempt them into staying, by Ewan Cowhig Croft
  intrigue_temptation.3120.t:0 "Những Trái Tim Lang Thang"
  intrigue_temptation.3120.desc:1 "Tối nay, lần thứ mười mấy, ta lại ngồi bên lò sưởi tàn cùng [tempted_guest.GetTitledFirstName]. Ở cạnh [tempted_guest.GetHerHis|U] thật tự nhiên, thật dễ chịu, như thể [tempted_guest.GetSheHe] đã ở lại [capital.GetNameNoTooltip] nhiều năm chứ không phải chỉ vài tuần.\n\nGiá như [tempted_guest.GetFirstNameNoTooltip] đồng ý ở lại vĩnh viễn, thì những buổi tối dài lười biếng này có thể kéo dài mãi. Dĩ nhiên, chỉ cần một chút thúc đẩy đúng lúc..."
  intrigue_temptation.3120.a:0 "Hãy để Ta cho ngươi thấy #EMP chính xác#! lòng hiếu khách của Ta có thể đến mức nào."
  intrigue_temptation.3120.a.tt_success:0 "[tempted_guest.GetShortUINameNoTooltip] bị mê hoặc"
  intrigue_temptation.3120.a.tt_fail:0 "[tempted_guest.GetShortUINameNoTooltip] ghê tởm"
  intrigue_temptation.3120.b:0 "Chỉ cần ngươi nói, ta sẽ hái trăng cho ngươi."
  intrigue_temptation.3120.c:0 "Nâng chén vì người bạn tốt, dù chỉ thoáng qua!"
 #You seduce the spouse of a potential rival to cement the foeship, by Ewan Cowhig Croft
  intrigue_temptation.3130.t:0 "Trái Tim Lạnh Lẽo"
  intrigue_temptation.3130.desc:0 "[rival_main.Custom2('MyCharacterIntroduction', ROOT.Char)|U] khiến ta nổi cơn phẫn nộ mù quáng đến mức có những ngày ta gần như không còn nhớ vì sao chúng ta thù địch. Nhưng giờ điều đó chẳng còn quan trọng: ta đang ôm trong tay [rival_main.GetHerHis] [rival_spouse.GetWifeHusband], [rival_spouse.GetFirstName], cảm nhận ngọn lửa đam mê của [rival_spouse.GetHerHis] đang bùng cháy.\n\nChẳng bao lâu nữa, giữa những nụ cười khinh khỉnh của ta và vài kẻ chuyên buôn chuyện được trả công hậu hĩnh, [rival_main.GetFirstNameNoTooltip] sẽ biết. Ta sẽ #EMP chắc chắn#! rằng [rival_main.GetFirstNameNoTooltip] biết.\n\nMột nụ hôn cấm đoán sẽ niêm phong mối thù này."
  intrigue_temptation.3130.a:0 "Người yêu dấu, ngươi đã từng hôn một [ROOT.Char.GetWomanMan] #EMP thực thụ#! chưa?"
  intrigue_temptation.3130.a.tt_success:0 "Một nụ hôn… rồi thêm một nụ nữa..."
  intrigue_temptation.3130.a.tt_fail:0 "[rival_spouse.GetFirstNameNoTooltip] lùi lại"
  intrigue_temptation.3130.b:0 "Ta không thể làm vậy."
  saucy_reputation_01_modifier:0 "Kẻ Cắm Sừng Tính Toán"
  saucy_reputation_02_modifier:0 "Kẻ Cắm Sừng Tính Toán"
  saucy_reputation_03_modifier:0 "Kẻ Cắm Sừng Tính Toán"
 #Flirt openly with courtiers, pleasing some and irritating others, by Ewan Cowhig Croft
  intrigue_temptation.3140.t:0 "Phô Diễn Sức Hấp Dẫn"
  intrigue_temptation.3140.desc:0 "Sáng nay ta có một cuộc gặp gỡ thú vị với một [ROOT.Char.Custom('OppositeGenderedLowlyServantType')] trẻ trung đầy duyên dáng. Chúng ta đùa giỡn, cười nói rồi chia tay trong tâm trạng vui vẻ, chỉ vì ta chịu khó tỏ ra thân thiện hơn một chút.\n\nCó lẽ ta nên đem sự tự tin đầy tán tỉnh này áp dụng không chỉ cho chuyện riêng của mình?"
  intrigue_temptation.3140.a:0 "Có lẽ ta nên nhìn người khác lâu hơn một chút..."
  intrigue_temptation.3140.b:0 "Một cái chạm thoáng qua cũng đủ khiến tâm hồn xao động."
  intrigue_temptation.3140.c:0 "Chỉ ánh nhìn của ta cũng có thể mê hoặc cả [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself]!"
  intrigue_temptation.3140.d:0 "Những chuyện này quá tầm thường đối với ta."
  licentious_01_modifier:0 "Tán Tỉnh Vụng Về"
  licentious_02_modifier:0 "Tán Tỉnh Quá Mức"
  licentious_03_modifier:0 "Tán Tỉnh Có Tính Toán"
  licentious_04_modifier:0 "Bậc Thầy Tán Tỉnh"
  licentious_05_modifier:0 "Tán Tỉnh Quỷ Quyệt"
 #Caught chatting up a courtier, you back out, carry on, or double-down, by Ewan Cowhig Croft
  intrigue_temptation.3150.t:0 "Bị Bắt Quả Tang"
  intrigue_temptation.3150.desc:1 "Căn phòng riêng chỉ được chiếu sáng lờ mờ, và [primary_seducee.GetTitledFirstName] cùng ta đứng sát bên nhau, môi gần như chạm nhau. Không khí đêm mát lạnh, nhưng thân thể [primary_seducee.GetSheHe] lại nóng rực khi chạm vào, hơi thở [primary_seducee.GetHerHis] gấp gáp và run rẩy.\n\nNgay vào khoảnh khắc tệ hại nhất, [secondary_seducee.Custom2('MyCharacterIntroduction', ROOT.Char)] bước vào [ROOT.Char.Custom('GetRoom')], giọng điệu đầy gấp gáp.\n\n"Thưa [ROOT.Char.GetTitleAsNameNoTooltip], chúng ta cần bàn về thàn— ồ. Ta không biết ngài đang có khách.""
  intrigue_temptation.3150.a:0 "Ồ, [primary_seducee.GetFirstNameNoTooltip], ta không thấy ngươi ở đó!"
  intrigue_temptation.3150.b:0 "Chúng ta vừa định rời đi. Đến một nơi #EMP riêng tư#! hơn."
  intrigue_temptation.3150.b.tt_success:0 "[primary_seducee.GetFirstNameNoTooltip] cười nhếch mép rồi theo ngươi"
  intrigue_temptation.3150.b.tt_failure:0 "Bầu không khí bị phá hỏng"
  intrigue_temptation.3150.c:0 "... [secondary_seducee.GetFirstNameNoTooltip], đóng cửa lại."
  intrigue_temptation.3150.c.tt_success:0 "Ngươi đưa cả hai vào một cuộc vui cuồng nhiệt"
  intrigue_temptation.3150.c.tt_success.lovers:0 "Ta trở thành người tình của cả hai."
  intrigue_temptation.3150.c.tt_failure:0 "Những lời trách móc cay độc nối tiếp"
  silver_tongued_modifier:0 "Miệng Lưỡi Bạc"
  quick_thinker_modifier:0 "Kẻ Suy Nghĩ Nhanh"
 #Sleep with someone who dislikes you for fun or profit, by Ewan Cowhig Croft
  intrigue_temptation.3160.t:0 "Cực Đoan Của Đam Mê"
  intrigue_temptation.3160.desc:1 ""[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('sometime_rival'))|U] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('sometime_rival'))]!" [sometime_rival.GetTitledFirstName] gào lên, nước bọt văng tung tóe từ cái miệng hôi hám của [sometime_rival.GetHerHis]. [sometime_rival.GetWomanMan] này dường như đã nuôi mối thù với ta, nhưng cuộc cãi vã hôm nay đặc biệt dữ dội.\n\nKhi [sometime_rival.GetTitledFirstNameNoTooltip] đỏ bừng mặt, thở hổn hển vì giận dữ, ta thề rằng ánh mắt [sometime_rival.GetHerHis] đã lướt xuống thân thể ta trong chốc lát trước khi quay lại nhìn thẳng vào mắt ta.\n\nLiệu đó #EMP thực sự#! là cơn thịnh nộ hiện rõ trên gương mặt [sometime_rival.GetHerHis]?"
  intrigue_temptation.3160.a:0 "Ta lao tới và hôn [sometime_rival.GetHerHim]."
  intrigue_temptation.3160.a.tt_success:0 "Bất ngờ, [sometime_rival.GetShortUINameNoTooltip] đáp lại"
  intrigue_temptation.3160.a.tt_success.tt:0 "Sau đó chúng ta giải quyết cảm xúc của mình."
  intrigue_temptation.3160.a.tt_fail:0 "Ghê tởm, [sometime_rival.GetShortUINameNoTooltip] đẩy ngươi ra"
  intrigue_temptation.3160.b:0 "Ngươi không đáng để một con chó chú ý, chứ đừng nói đến ta."
  intrigue_temptation.3161.desc:1 "Vài giờ sau, hai chúng ta nằm trên giường, kiệt sức hoàn toàn, xung quanh là ga trải giường rách nát và đồ đạc vỡ vụn. Lần đầu tiên trong cả tuần, [sometime_rival.GetTitledFirstNameNoTooltip] và ta cuối cùng cũng ngừng cãi vã.\n\nLồng ngực của kẻ thù khi trước ấy lên xuống theo nhịp thở ngày càng chậm; bất cứ lúc nào [sometime_rival.GetSheHe] cũng có thể chìm vào giấc ngủ."
  intrigue_temptation.3161.a:0 "Có lẽ chúng ta vốn luôn mong điều này?"
  intrigue_temptation.3161.b:0 "Ta từng có những buổi tối thú vị hơn khi ngồi trên cái cầu tiêu của mình!"
  intrigue_temptation.3161.b_flavour:0 "Ta chộp lấy quần áo của [sometime_rival.GetHerHis] rồi cười sằng sặc chạy khỏi phòng."
  intrigue_temptation.3161.c:0 "Ta bóp nghẹt [sometime_rival.GetHerHim] khi [sometime_rival.GetSheHe] đang ngủ."
  malignant_hearsay_modifier:0 "Lời Đồn Độc Địa"
  malignant_hearsay_modifier_desc:0 "Đám gia nhân và dân thường rỉ tai nhau rằng người này có liên quan đến một cái chết đáng ngờ."
