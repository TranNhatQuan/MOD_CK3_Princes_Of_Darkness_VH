 # Your court thinks you're soft, by Luke Bean
  intrigue_dread.2301.t:0 "Cho Chúng Thấy Ngươi Là Ai"
  intrigue_dread.2301.desc.a:0 ""Thật may mắn biết bao khi chúng ta có một [ROOT.Char.Custom('GetCourtOwner')] dịu dàng, nhân hậu và thuần khiết như vậy!" Gương mặt cười nhếch mép của [smirking_courtier.GetNamePossessive] lơ lửng trước mắt ta. "Chúng ta thật có phúc khi sống trong [ROOT.Char.Custom('GetCourt')] nơi có thể sống mà không cần sợ hãi!""
  intrigue_dread.2301.desc.b:0 ""Thật may mắn biết bao khi chúng ta có một [ROOT.Char.Custom('GetCourtOwner')] chân thành và ngay thật đến thế, hoàn toàn không biết đến dối trá!" Gương mặt cười nhếch mép của [smirking_courtier.GetNamePossessive] lơ lửng trước mắt ta. "Chúng ta thật có phúc khi sống trong [ROOT.Char.Custom('GetCourt')] nơi có thể sống mà không cần sợ hãi!""
  intrigue_dread.2301.desc.c:0 ""Chúng ta thật may mắn khi có một [ROOT.Char.Custom('GetCourtOwner')] đơn giản và khiêm nhường, không đòi hỏi gì ở chúng ta!" Gương mặt nhếch mép của [smirking_courtier.GetNamePossessive] hiện lên trước mắt Ta. "Thật hồng phúc khi được sống trong một [ROOT.Char.Custom('GetCourt')] nơi chúng ta thoát khỏi nỗi sợ hãi!""
  intrigue_dread.2301.desc.d:0 ""Thật may mắn biết bao khi chúng ta có một [ROOT.Char.Custom('GetCourtOwner')] chính trực như vậy, thật sự tôn trọng luật pháp!" Gương mặt cười nhếch mép của [smirking_courtier.GetNamePossessive] lơ lửng trước mắt ta. "Chúng ta thật có phúc khi sống trong [ROOT.Char.Custom('GetCourt')] nơi có thể sống mà không cần sợ hãi!""
  intrigue_dread.2301.desc.e:0 ""Thật may mắn biết bao khi chúng ta có một [ROOT.Char.Custom('GetCourtOwner')] quan tâm đến chúng ta, người sẽ không bao giờ ngược đãi thần dân của [ROOT.Char.GetHerHis]!" Gương mặt cười nhếch mép của [smirking_courtier.GetNamePossessive] lơ lửng trước mắt ta. "Chúng ta thật có phúc khi sống trong [ROOT.Char.Custom('GetCourt')] nơi có thể sống mà không cần sợ hãi!""
  intrigue_dread.2301.desc.outro:0 "\n\nĐằng sau [smirking_courtier.GetFirstNameNoTooltip], cả [ROOT.Char.Custom('GetCourt')] của ta cười cợt và vỗ tay. Những kẻ này không sợ ta. Chúng không tôn trọng ta. Chúng không hề biết ta là ai. Ta sẽ cho chúng thấy con người thật của ta."
  intrigue_dread.2301.a:0 "Đâm [smirking_courtier.GetFirstNameNoTooltip] vào cổ họng."
  intrigue_dread.2301.b:0 "Lôi [smirking_courtier.GetFirstNameNoTooltip] xuống [ROOT.Char.Custom('GetDungeon')]."
  intrigue_dread.2301.c:0 "Mỉm cười, cười lớn, và lên kế hoạch trả thù."
  intrigue_dread.2301.d:0 "[smirking_courtier.GetFirstNameNoTooltip] sẽ chết trong đêm. Cứ để chúng tự suy đoán lý do."
  intrigue_show_them_all_modifier:0 "Đang Lên Kế Hoạch Cho Tất Cả Thấy"

 # Executions could be better, by Luke Bean
  intrigue_dread.2401.t:0 "Hành Quyết Có Thể Tốt Hơn"
  intrigue_dread.2401.desc:0 "Tên trộm bị kết án giật mạnh ở cuối sợi dây, rồi bất động. Đám đông thường dân lẩm bẩm tán thành rồi dần tản đi.\n\nNhưng đâu là tiếng reo hò, tiếng rên rỉ, nỗi kinh hoàng? Ta có thể cải thiện những cuộc hành quyết công khai tại [execution_county.GetName] chỉ bằng một thay đổi đơn giản..."
  intrigue_dread.2401.a:0 "Nhiều. Hơn. Nữa."
  intrigue_dread.2401.a.tt.success:0 "Tội phạm bị thanh trừng khắp [execution_county.GetNameNoTier]"
  tooltip.intrigue_dread.2401.a.duel_success:0 "$intrigue_dread.2401.a.tt.success$"
  intrigue_dread.2401.a.tt.failure:0 "Những vụ hành quyết bất công khiến [execution_county.GetNameNoTier] phẫn nộ"
  tooltip.intrigue_dread.2401.a.duel_failure:0 "$intrigue_dread.2401.a.tt.failure$"
  intrigue_dread.2401.b:0 "Việc tham dự hành quyết là bắt buộc!"
  intrigue_dread.2401.b.tt.success:0 "Người dân [execution_county.GetNameNoTier] run sợ trước công lý"
  tooltip.intrigue_dread.2401.b.duel_success:0 "$intrigue_dread.2401.b.tt.success$"
  intrigue_dread.2401.b.tt.failure:0 "Người dân [execution_county.GetNameNoTier] phí thời gian đứng xem hành quyết"
  tooltip.intrigue_dread.2401.b.duel_failure:0 "$intrigue_dread.2401.b.tt.failure$"
  intrigue_dread.2401.c:0 "Hành quyết nên chậm rãi. Và #EMP sáng tạo#!..."
  intrigue_dread.2401.d:0 "Thường dân không nên lãng phí thời gian vào những cuộc hành quyết."

