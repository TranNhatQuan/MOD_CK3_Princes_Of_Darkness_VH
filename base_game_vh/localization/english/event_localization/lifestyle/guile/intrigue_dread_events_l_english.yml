l_english:
# Join a touring theater company
  intrigue_dread_special.1101.t:0 "Lên Sân Diễn"
  intrigue_dread_special.1101.desc:0 "Hai con ngựa đi đầu, được trang trí bằng dây cương lộng lẫy và lông vũ, theo sau là một cỗ xe chất đầy rương hòm cùng người.\n\nChẳng bao lâu sau, đoàn tùy tùng của ta bị một gánh kịch lưu diễn chặn lại — toàn những bộ y phục sặc sỡ và những con người đầy sức sống.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" Một [ROOT.Char.Custom('RandomWomanMan')] già cất tiếng gọi từ cỗ xe đang đi ngang qua, "Ta thấy ánh mắt đầy mộng mơ của ngài. Sao ngài không tham gia cùng chúng ta trong một buổi diễn?""
  intrigue_dread_special.1101.a.a:0 "Ta sẽ đóng vai gã nông dân tham lam!"
  intrigue_dread_special.1101.a.b:0 "Ta sẽ đóng vai người [ROOT.Char.GetWifeHusband] già!"
  intrigue_dread_special.1101.a.c:0 "Ta sẽ đóng vai tên gia nhân xảo quyệt!"
  intrigue_dread_special.1101.a.d:0 "Ta sẽ đóng vai kẻ tình nhân trẻ tuổi!"
  intrigue_dread_special.1101.a.e:0 "Ta sẽ đóng vai gã hề u sầu!"
  intrigue_dread_special.1101.b:0 "Để dành cho ta một chỗ ở hàng ghế đầu."
  intrigue_dread_special.1101.c:0 "Chuyện này quá thấp kém với ta."

  intrigue_dread_special.1102.desc:0 "Bước đầu tiên của bất kỳ màn trình diễn nào, dù là trong [ROOT.Char.Custom('FortifiedBuilding')] của ta hay trên sân khấu, đều là sự chuẩn bị.\n\nBị bao quanh bởi sự nhộn nhịp của gánh hát và ẩn danh trong bộ quần áo mượn tạm, ta thấy mình có chút thời gian rảnh trước khi buổi diễn bắt đầu."
  intrigue_dread_special.1102.a:0 "Không, chuyển đạo cụ kia sang chỗ đó!"
  intrigue_dread_special.1102.a.duel_success:1 "Ngươi tận dụng tốt khả năng tổ chức của mình"
  tooltip.intrigue_dread_special.1102.a.duel_success:1 "Ngươi sắp xếp sân khấu thật tuyệt vời"
  intrigue_dread_special.1102.a.duel_failure:1 "Chỉ dẫn của ngươi khiến các diễn viên bối rối"
  tooltip.intrigue_dread_special.1102.a.duel_failure:0 "Đạo cụ trở nên hỗn loạn"

  intrigue_dread_special.1102.b:0 "Hãy cùng nhau luyện tập lại!"
  intrigue_dread_special.1102.b.duel_success:1 "Ngươi làm quen với các diễn viên"
  tooltip.intrigue_dread_special.1102.b.duel_success:1 "Các diễn viên đánh giá cao sự giúp đỡ của ngươi"
  intrigue_dread_special.1102.b.duel_failure:1 "Chỉ dẫn của ngươi khiến các diễn viên bối rối"
  tooltip.intrigue_dread_special.1102.b.duel_failure:1 "Các diễn viên dường như không tin tưởng ngươi"

  intrigue_dread_special.1102.c:0 "Ta sẽ đọc lại kịch bản #EMP một#! lần nữa."
  intrigue_dread_special.1102.c.flavor:1 "Một lựa chọn an toàn, nhưng ít rủi ro cũng mang lại phần thưởng nhỏ."

  intrigue_dread_special.1103.desc:0 "Khi ta bước ra sân khấu cùng các diễn viên khác, toàn bộ khán giả đều dõi theo không rời mắt.\n\nCảnh này nối tiếp cảnh kia, và ta có thể cảm nhận được nhịp điệu của câu chuyện đang được kể; nó như đang dâng trào trong ta. Khi đến lúc ta nói câu thoại đầu tiên, dường như cả khán phòng đều nín thở."
  intrigue_dread_special.1103.a:0 "Khán giả phải #EMP cảm nhận#! được điều đó!"
  intrigue_dread_special.1103.a.duel_success:0 "Ta nhập vai nhân vật đến mức hoàn hảo"
  tooltip.intrigue_dread_special.1103.a.duel_success:0 "Khán giả bị ấn tượng bởi màn trình diễn của ta"
  intrigue_dread_special.1103.a.duel_failure:0 "Ta không thể nhập vai"
  tooltip.intrigue_dread_special.1103.a.duel_failure:0 "Khán giả không mấy ấn tượng"
  intrigue_dread_special.1103.b:0 "Ta sẽ tập trung đọc từng câu thoại thật hoàn hảo."
  intrigue_dread_special.1103.b.duel_success:0 "Khán giả ấn tượng với cách phát âm của ta"
  intrigue_dread_special.1103.b.duel_failure:0 "Ta lắp bắp trong lúc diễn"
  intrigue_dread_special.1103.c:0 "Cứ bám sát kịch bản và đứng ở hậu cảnh."

  intrigue_dread_special.1199.desc_win_feeling:0 "Vai diễn không dài, nhưng ta khiến nó trở nên đáng nhớ. Khán giả chăm chú vào từng lời ta nói, bị cuốn vào câu chuyện ta kể cho họ."
  intrigue_dread_special.1199.desc_loose_feeling:0 "Vai diễn không dài, nhưng bằng cách nào đó ta lại diễn hỏng toàn bộ. Ta vốn giỏi thao túng người khác trong triều đình, nhưng đứng trước đông người thế này... quả thật là một trải nghiệm hoàn toàn khác."
  intrigue_dread_special.1199.desc_win_reading:0 "Ta đọc các câu thoại một cách hoàn hảo, nắm bắt khoảnh khắc và thu hút toàn bộ sự chú ý của khán giả."
  intrigue_dread_special.1199.desc_loose_reading:0 "Khi tiếng cười của khán giả dần lắng xuống, ta cố gắng gượng lại sau sai lầm của mình. Nói đúng điều vào đúng thời điểm vốn là điều ta rất giỏi, nhưng làm điều đó trên sân khấu lại khó hơn ta tưởng."
  intrigue_dread_special.1199.desc_fallback:0 "Ta bám sát kịch bản, và cảnh diễn trôi qua suôn sẻ nhưng không có gì nổi bật."
  intrigue_dread_special.1199.desc_win:0 "\n\nSau cảnh cuối cùng, chúng ta rời sân khấu trong tiếng vỗ tay như sấm dậy. Lừa được cả khán phòng, duy trì lớp ngụy trang và đánh lừa biết bao người cùng lúc... cảm giác ấy thật mạnh mẽ!"
  intrigue_dread_special.1199.desc_loose:0 "\n\nKhi chúng ta hoàn thành cảnh cuối cùng và lần lượt cúi chào khán giả, sự im lặng khi đến lượt ta đã nói lên tất cả. Dù đã cố gắng, ta vẫn không thể khiến khán giả tin vào màn diễn của mình, và nỗi thất vọng ấy thật khó nuốt trôi."
  intrigue_dread_special.1199.z:0 "Và ta muốn cảm nhận nó lần nữa! Rồi lần nữa!"
  intrigue_dread_special.1199.a:0 "Hạ màn, rời sân khấu."
  intrigue_dread_special.1199.b:0 "Nhưng lần sau thì cứ chờ xem!"
  intrigue_dread_special.1199.c.a:0 "Các ngươi #EMP sẽ#! vỗ tay! Lính đâu!"
  intrigue_dread_special.1199.c.b:0 "Đây chắc chắn là âm mưu làm nhục ta! Lính đâu!"

  intrigue_dread_special.1197.t:0 "Một Màn Trình Diễn Kinh Hoàng"
  intrigue_dread_special.1197.desc:0 "Ta phải thừa nhận rằng buổi biểu diễn đầu tiên của ta có lẽ hơi... thiếu sót. Nhưng việc trói cả gánh hát lên cột bêu ngoài quảng trường lại nhận được phản ứng tốt hơn nhiều từ đám dân quê. À, có lẽ không hẳn là #EMP tốt#!, nhưng ít ra cũng khiến ta hài lòng."
  intrigue_dread_special.1197.a:0 "Ít ra thì ta cũng đã vui."

  intrigue_dread_special.1198.desc:0 "Chúng ta lặp lại màn diễn hết lần này đến lần khác, trong khi đám đông, dưới ánh mắt giám sát của lính gác của ta, cứ phải vỗ tay cổ vũ mỗi lần.\n\nSau mỗi lần thử mới, màn diễn của ta càng hoàn thiện hơn, trong khi các nghệ sĩ khác ngày càng rối loạn, bị kéo xuống bởi nỗi sợ và sự kiệt sức, cho đến khi từng người một gục xuống, để lại ta một mình đứng chiến thắng trên sân khấu."
  intrigue_dread_special.1198.a:0 "Một trải nghiệm thật siêu phàm, phải không?"

# Retinue members are concerned, by Linnéa Thimrén
  intrigue_dread_special.1301.t:0 "[ROOT.Char.Custom('GetCourtierPlural')|U] Lo Lắng"
  intrigue_dread_special.1301.desc:0 ""...và bao lâu nữa trước khi [ROOT.Char.GetSheHe] bắt đầu âm mưu chống lại #EMP chúng ta#!? Mấy trò mưu mô này đang vượt quá giới hạn." [courtier_first.GetTitledFirstName] và [courtier_second.GetTitledFirstName] đứng sát đầu vào nhau, rồi giật mình khi ta bước ra từ góc hành lang.\n\n"[ROOT.Char.GetTitleTierName] của chúng ta! Chúng thần chỉ đang nói về... những hoạt động giải trí của ngài. Dường như chúng chiếm khá nhiều thời gian của ngài.""
  intrigue_dread_special.1301.a:0 "Ta nghe thấy các ngươi âm mưu chống lại ta! Lính đâu!"
  intrigue_dread_special.1301.b:0 "Chẳng có gì mà những [ROOT.Char.Custom('GetServants')] #EMP trung thành#! phải lo cả..."
  intrigue_dread_special.1301.c:0 "Ta đảm bảo với các ngươi, chẳng có gì đáng lo."
  intrigue_dread_special.1301.c.duel_success:0 "Ta trấn an thành công [ROOT.Char.Custom('GetCourtierPlural')|U]"
  tooltip.intrigue_dread_special.1301.c.duel_success:0 "Lời giải thích của ta đủ thuyết phục"
  intrigue_dread_special.1301.c.duel_failure:0 "Thần dân của ta vẫn bất an"
  tooltip.intrigue_dread_special.1301.c.duel_failure:0 "Ta không đủ thuyết phục"
  intrigue_dread_special.1301.d:0 "Lo việc của các ngươi đi!"

# Cannibal cook, by Linnéa Thimrén
  intrigue_dread.1501.t:0 "Bữa Tối"
  intrigue_dread.1501.desc:0 ""Món hầm có hợp khẩu vị ngài không, [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\nGiữa những miếng rau là các khối thịt béo ngậy, thớ thịt dai xen lẫn những sợi lông ngắn và thưa. Khi ta hỏi về nguyên liệu, đầu bếp riêng của ta [cannibal_cook.GetTitledFirstName] chỉ mỉm cười và cố xoa dịu ta.\n\n"Ước nguyện duy nhất của thần là được phục vụ #EMP ngài#!, [ROOT.Char.Custom('FormOfAddressForLiege')].""
  intrigue_dread.1501.a:0 "Trong bữa ăn của ta có gì cũng chẳng quan trọng."
  intrigue_dread.1501.b:0 "[cannibal_cook.GetSheHe|U] nghĩ [cannibal_cook.GetSheHe] có thể giấu bí mật khỏi #EMP ta#! sao?"
  intrigue_dread.1501.b.flavor:1 "Vô tri có thể là hạnh phúc, nhưng ta #EMP cần#! phải biết"
  intrigue_dread.1501.b.tt1:0 "Ta lén lút và khéo léo tìm cách vào nhà bếp"
  intrigue_dread.1501.b.tt2:0 "[cannibal_cook.GetSheHe|U] giữ kín công thức thành công"
  intrigue_dread.1501.c:0 "Hương thảo với thịt người sao? Lựa chọn tuyệt vời!"

  intrigue_dread.1502.desc:0 "Khi ta bước vào nhà bếp, nơi đây tối tăm và vắng lặng, không khí nặng mùi khói. Trong góc phòng ta thấy cuốn sách nấu ăn của [cannibal_cook.GetTitledFirstNamePossessive], đầy vết bẩn.\n\n#EMP Khi nấu gan, người ta ghi nhận rằng việc uống quá nhiều [ROOT.Char.Custom('RegionalDrink')] có thể làm giảm đáng kể chất lượng của cơ quan này-#!\nMột cảm giác lạnh buốt lan trong lồng ngực khi ta lật sang trang khác.\n#EMP ...tuy nhiên, khi nấu những đứa trẻ nhỏ dưới độ tuổi-#!"
  intrigue_dread.1502.a:0 "Mang đầu [cannibal_cook.GetHerHis] đến cho ta!"
  intrigue_dread.1502.a.flavor:0 "Nhưng đừng đặt trên khay"
  intrigue_dread.1502.b:0 "Quăng [cannibal_cook.GetHerHim] vào [ROOT.Char.Custom('GetDungeon')]!"
  intrigue_dread.1502.c:0 "Nhưng quả thật rất ngon..."

  intrigue_dread.1503.desc:0 "Dù đã cố gắng hết sức, ta vẫn không thể vào được nhà bếp mà không khiến [cannibal_cook.GetTitledFirstNamePossessive] nghi ngờ."
  intrigue_dread.1503.a:0 "Bí ẩn này sẽ khiến ta day dứt..."

# Poison tasting, by Petter Vilberg
  intrigue_dread.1801.t:0 "Thử Nghiệm"
  intrigue_dread.1801.mentor_desc:0 ""Chỉ cần thêm một chút nữa của thứ này là có thể khiến [test_subject.GetHerHim] bất tỉnh hoàn toàn," [intrigue_mentor.GetFirstName] nói với ta. "Tình nguyện viên" của chúng ta, [test_subject.GetTitledFirstName], gần như đã gục hẳn.\n\n[intrigue_mentor.GetFirstName] bắt đầu cất các lọ thuốc đi. "Đáng tiếc, ta tin rằng tối nay đối tượng thử nghiệm chỉ chịu được đến thế.""
  intrigue_dread.1801.desc:0 "Ta chân thành cảm ơn [test_subject.GetTitledFirstName] khi [test_subject.GetSheHe] nhìn ta đầy giận dữ qua làn sương mờ của các chất giả kim. Không dễ gì tìm được người "tình nguyện" thử bộ sưu tập... dược chất của ta. Với [test_subject.GetHerHim], đây là một buổi tối đầy đau đớn, cảm giác bỏng rát và đôi khi bất tỉnh."
  intrigue_dread.1801.a:0 "Thật là một trải nghiệm đầy bổ ích."
  intrigue_dread.1801.b:0 "Chúng ta vẫn chưa xong đâu."
  intrigue_dread.1801.c:0 "Đừng bao giờ làm chuyện này nữa."

# Torturing Courtier
  intrigue_dread.1901.t:0 "Tên Ngốc [disliked_courtier.Custom2('InsultAdjective', ROOT.Char)|U]"
  intrigue_dread.1901.desc:0 "Ngày qua ngày ta phải chịu đựng sự hiện diện của [disliked_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nMỗi khi ta nói chuyện với [disliked_courtier.GetHerHim], [disliked_courtier.GetSheHe] lại [disliked_courtier.Custom('quirk_neg_present')]. Phải chăng [disliked_courtier.GetSheHe] #EMP đang cố#! xúc phạm ta? Ta sẽ không chấp nhận thêm sự bất kính nào từ tên [disliked_courtier.Custom2('InsultNoun', ROOT.Char)] này, phải có kẻ dạy cho [disliked_courtier.GetHerHim] một bài học!"
  intrigue_dread.1901.a:0 "Ta có một loại độc dược muốn thử..."
  intrigue_dread.1901.b:0 "Thật là một sự sỉ nhục nếu [disliked_courtier.GetSheHe] tự biến mình thành kẻ ngốc tại triều đình."
  intrigue_dread.1901.b.tt:0 "Lựa chọn này có sẵn vì đặc tính [GetTrait('gregarious').GetName( GetPlayer )] của [disliked_courtier.GetFirstNamePossessiveNoTooltip]"
  intrigue_dread.1901.c:1 "Túi tiền của [disliked_courtier.GetHerHim] nhẹ đi thì tâm trạng ta cũng nhẹ nhõm hơn!"
  intrigue_dread.1901.c.tt:0 "Lựa chọn này có sẵn vì đặc tính [GetTrait('greedy').GetName( GetPlayer )] của [disliked_courtier.GetFirstNamePossessiveNoTooltip]"
  intrigue_dread.1901.d:0 ""Ngươi đã nghe chưa? [disliked_courtier.GetSheHe|U] trên giường nhạt nhẽo như bột mì.""
  intrigue_dread.1901.d.tt:0 "Lựa chọn này có sẵn vì đặc tính [GetTrait('lustful').GetName( GetPlayer )] của [disliked_courtier.GetFirstNamePossessiveNoTooltip]"
 
# Mind Break, by Sean Hughes
  intrigue_dread.4001.t:0 "Nỗi Đau Tinh Tế"
  intrigue_dread.4001.desc.start:0 "Ta không còn thỏa mãn với những hình thức tra tấn thông thường mà ta đã quen dùng lên tù nhân. Ta muốn tạo nên một kiệt tác — một tác phẩm nghệ thuật khắc ghi nỗi thống khổ và đau đớn, vượt xa mọi thứ ta từng làm trước đây!"
  intrigue_dread.4001.desc.single:0 "\n\nTuy nhiên, ta không khỏi tự hỏi liệu [prisoner_1.GetTitledFirstName] có phải là tấm toan thích hợp cho kiệt tác vĩ đại của ta hay không?"
  intrigue_dread.4001.desc.multiple:0 "\n\nCâu hỏi là, ai sẽ là tấm toan của ta?"
  intrigue_dread.4001.a.single:0 "Phải, [prisoner_1.GetSheHe] sẽ rất phù hợp..."
  intrigue_dread.4001.a:0 "[prisoner_1.GetTitledFirstNameNoTooltip] thật hoàn hảo!"
  intrigue_dread.4001.b:0 "Có lẽ [prisoner_2.GetTitledFirstNameNoTooltip] sẽ tốt hơn?"
  intrigue_dread.4001.c:0 "Ta thích dùng [prisoner_3.GetTitledFirstNameNoTooltip] hơn."
  intrigue_dread.4001.a-c.tt:0 "Ta sẽ dùng [THIS.Char.GetTitledFirstName] làm đối tượng cho nỗ lực này."
  intrigue_dread.4001.kinslayer:0 "Nếu [THIS.Char.GetTitledFirstName] chết vì việc này ta có thể bị gọi là [GetTrait('kinslayer_3').GetName( GetPlayer )]."
  intrigue_dread.4001.d:0 "Không, bây giờ chưa phải lúc."
  intrigue_dread.4001.d.flavor:0 "Ta sẽ xem xét lại ý tưởng này trong vài năm nữa, hy vọng khi đó có thêm tù nhân mới"

  intrigue_dread.4002.desc:0 "Giờ khi ta đã chọn được tấm toan, ta cần quyết định kiệt tác của mình sẽ mang hình dạng nào.\n\nTa có thể nghĩ ra vô số nỗi đau mà ta muốn giáng xuống [victim.GetTitledFirstName], nhưng nếu muốn tạo nên một kiệt tác thực sự ta phải tập trung hoàn hảo vào một điều duy nhất."
  intrigue_dread.4002.a:0 "Tạo hình cơ thể lột da của [victim.GetHerHis] thành một bức tượng tuyệt mỹ."
  intrigue_dread.4002.a.flavor:0 "Ta sẽ trưng bày nó cho cả [ROOT.Char.Custom('GetRealmOrDomicile')] chiêm ngưỡng!"
  intrigue_dread.4002.b:0 "[victim.GetSheHe|U] sẽ hát cho ta khúc ca thống khổ..."
  intrigue_dread.4002.b.flavor:0 "Ta sẽ trân trọng ký ức về những tiếng gào thét của [victim.GetHerHis] suốt nhiều năm."
  intrigue_dread.4002.c:0 "Bẻ gãy tâm trí [victim.GetHerHis] và biến [victim.GetHerHim] thành nô lệ của ta!"
  intrigue_dread.4002.c.flavor:0 "Ta sẽ bắt đầu quá trình dài và gian khổ tước bỏ cá tính của [victim.GetTitledFirstNamePossessiveNoTooltip], biến [victim.GetHerHim] thành kẻ hầu trung thành của ta."
  intrigue_dread.4002.c.compassionate.tt: "@warning_icon! #warning Vì bản tính nhân từ của ta, lựa chọn con đường này sẽ làm tăng [stress|E] của ta đáng kể.#!"
  intrigue_dread.4002.c.success.desc:0 "Ta thành công trong việc tái định hình tâm trí của [victim.GetFirstNamePossessiveNoTooltip] theo ý muốn của mình"
  intrigue_dread.4002.c.failure.desc:0 "[victim.GetFirstNameNoTooltip] chết trước khi ta hoàn tất quá trình"
  intrigue_dread.4002.d:0 "Ta đổi ý rồi, [victim.GetSheHe] không phù hợp cho việc này..."

  intrigue_dread.4004.desc:0 "Để tái định hình tâm trí của [victim.GetTitledFirstNamePossessive], trước tiên ta phải khiến [victim.GetHerHim] chịu đựng áp lực cực độ.\n\nTa nên cẩn thận chọn một phương pháp tra tấn mà [victim.GetFirstNameNoTooltip] đặc biệt dễ tổn thương — như vậy ta có thể đảm bảo gây ra mức chấn thương tâm lý lớn nhất có thể."
  intrigue_dread.4004.desc.followup:0 "[victim.GetTitledFirstName] đang dần trở nên chai lì với phương pháp tra tấn hiện tại của ta, và nó không còn tác động như trước nữa. Ta sẽ cần chọn cách tiếp cận khác..."
  intrigue_dread.4004.o.flavor:0 "Hiệu quả của kỹ thuật này sẽ thay đổi tùy theo [victim.GetTitledFirstNamePossessiveNoTooltip] [traits|E]."
  intrigue_dread.4004.a:0 "Tra tấn thể xác và đau đớn."
  intrigue_dread.4004.b:0 "Bỏ đói và tước đoạt giấc ngủ."
  intrigue_dread.4004.c:0 "Sỉ nhục và hạ nhục."

  intrigue_dread.4005.desc:0 "[victim.GetTitledFirstName] cuối cùng đã từ bỏ hy vọng, và không còn chống lại ta trong ngục tối nữa.\n\nĐiều này có nghĩa là đã đến lúc bước sang giai đoạn thứ hai, nơi ta phải tạo đủ cảm giác tội lỗi và hoang mang trong tâm trí [victim.GetHerHis] để phá hủy cảm giác đạo đức, mục đích, thậm chí cả bản sắc của [victim.GetHerHis]."
  intrigue_dread.4005.desc.followup:0 "[victim.GetTitledFirstName] vẫn còn bám víu vào những tàn dư rách nát của bản sắc [victim.GetHerHis], bị tổn hại nhưng chưa bị phá hủy hoàn toàn. Ta phải dùng một chiến thuật khác để hoàn tất công việc..."
  intrigue_dread.4005.a:0 "Đưa ra lời an ủi... trong khi vẫn tiếp tục tra tấn!"
  intrigue_dread.4005.b:0 "Khẳng định rằng tất cả chỉ là sự trừng phạt cho [victim.GetHerHis] [ROOT.Char.Custom('GetSinMisdeedPlural')]."
  intrigue_dread.4005.c:0 "Để [victim.GetHerHim] mong chờ được tha thứ, rồi nghiền nát hy vọng của [victim.GetHerHis]."

  intrigue_dread.4006.desc:0 "Cuối cùng ta đã tước bỏ những tàn dư cuối cùng của bản sắc [victim.GetTitledFirstNamePossessive]. [victim.GetSheHe|U] giờ chỉ còn là một cái vỏ rỗng, không thể tương tác với thế giới quanh [victim.GetHerHim]."
  intrigue_dread.4006.a:0 "Ta sẽ tái tạo [victim.GetHerHim] theo mục đích của mình."
  intrigue_dread.4006.a.tt:0 "Ta bắt đầu biến [victim.GetTitledFirstName] thành kẻ hầu phục tùng"
  intrigue_dread.4006.b:0 "Ta thấy thú vị hơn khi trả [victim.GetHerHim] về như một cái vỏ rỗng."

  intrigue_dread.4007.desc:0 "Đã xong — [victim.GetTitledFirstName] đứng trước mặt Ta, một nô lệ phục tùng, sẵn sàng làm bất cứ điều gì Ta yêu cầu."
  intrigue_dread.4007.a:0 "Ồ, chúng ta sẽ còn làm được biết bao điều!"

  intrigue_dread.4008.desc:0 "Đã vài năm kể từ khi ta thả [victim.GetTitledFirstName] trở lại thế giới để thi hành ý muốn của ta."
  intrigue_dread.4008.desc.success:0 "[victim.GetSheHe|U] đã thích nghi lại với môi trường cũ và tiếp tục các trách nhiệm thường nhật — tất cả đều trong sự trung thành tuyệt đối với Ta."
  intrigue_dread.4008.desc.lunatic:0 "\n\nĐáng tiếc thay, khoảng cách giữa sự điều kiện hóa của ta và thực tại cuộc sống mới của [victim.GetHerHis] đã trở nên quá sức với [victim.GetHerHim], và cuối cùng [victim.GetSheHe] đã phát điên."
  intrigue_dread.4008.desc.failure:0 "\n\nĐáng tiếc thay, bạn bè và gia đình của [victim.GetHerHis] đã xoá bỏ phần lớn công sức tinh vi của ta trên [victim.GetHerHim], và [victim.GetSheHe] không còn trung thành với ta nữa."
  intrigue_dread.4008.a.success:0 "Tuyệt vời..."
  intrigue_dread.4008.a.lunatic:0 "Dù sao thì chúng ta cũng đã có một thời gian tốt."
  intrigue_dread.4008.a.failure:0 "Nguyền rủa chúng vì đã phá hủy tác phẩm của ta!"

  intrigue_dread.4011.desc:0 "Vì [victim.GetTitledFirstName] không còn trong [ROOT.Char.Custom('GetDungeonPlural')] của ta nữa, ta không thể tiếp tục công việc biến [victim.GetHerHim] thành kiệt tác của mình. Kế hoạch của ta sẽ phải tạm dừng cho đến khi ta tìm được một tấm toan truyền cảm hứng khác, bởi ngay cả khi ta bắt lại [victim.GetHerHim] thì mọi thứ cũng sẽ không còn như trước."
  intrigue_dread.4011.a:0 "Một bước lùi đáng tiếc..."

  intrigue_dread.4013.desc:0 "Có vẻ như những #EMP biện pháp#! của ta đã quá sức đối với [victim.GetTitledFirstName], kẻ đã chết trong [ROOT.Char.Custom('GetDungeonPlural')] của ta.\n\nGiờ ta sẽ không thể hoàn thành kiệt tác của mình, trừ khi tìm được một tấm toan truyền cảm hứng khác, và [ROOT.Char.GetFaith.HighGodName] mới biết điều đó sẽ mất bao lâu..."
  intrigue_dread.4013.a:0 "Lần sau ta sẽ phải cẩn thận hơn."

  intrigue_dread.4100.t:0 "Những Phiên Điều Trần Bất Tận"
  intrigue_dread.4100.desc.intro:0 "Không có ngày nào trôi qua mà không có chuyện vặt vãnh nào đó được mang ra trước triều đình cho ta xử lý. Hôm nay, có vẻ đến lượt [petitioner_1.GetTitledFirstNamePossessive] và [petitioner_2.GetTitledFirstNamePossessive] lãng phí thời gian của ta với một tranh chấp nhỏ nhặt."
  intrigue_dread.4100.desc.lazy:0 "\n\nTa gần như không thể nghe nổi những lời than phiền của chúng... Làm sao ta có thể cai trị khi phần lớn thời gian và sức lực ít ỏi của mình bị lãng phí vào những chuyện vô nghĩa thế này?"
  intrigue_dread.4100.desc.councillors:0 "\n\nChúng muốn ta tin rằng đây là vấn đề đe dọa đến sự an toàn của cả vương quốc, nhưng ta không thể không cảm thấy rằng chúng đang phóng đại mức độ nghiêm trọng chỉ để thỏa mãn cái tôi của mình."
  intrigue_dread.4100.desc.fallback:0 "\n\nCàng nghe lý lẽ của chúng, ta càng tin rằng toàn bộ buổi điều trần này không đáng để ta bận tâm."
  intrigue_dread.4100.z:0 "Ta tự hỏi, những cái đầu bị chặt của các ngươi sẽ còn nói nhiều đến mức nào?"
  intrigue_dread.4100.a:0 "Lính đâu, lôi bọn vô lại này khỏi tầm mắt ta!"
  intrigue_dread.4100.b:0 "Ta sẽ dạy các ngươi bài học vì dám lãng phí thời gian triều đình!"
  intrigue_dread.4100.b.duel_success:0 "Những kẻ thỉnh cầu run sợ trước cơn thịnh nộ của ta"
  intrigue_dread.4100.b.duel_failure:0 "Những kẻ thỉnh cầu bị xúc phạm bởi lời đe dọa của ta"
  intrigue_dread.4100.c:0 "Để ta nghe lại một lần nữa..."
  intrigue_dread.4100.c.tooltip:1 "Ngươi sẽ dành thời gian để đưa ra quyết định"
  intrigue_dread.4100.c.support.petitioner_1:1 "Nếu ngươi ủng hộ [petitioner_1.GetTitledFirstName]"
  intrigue_dread.4100.c.support.petitioner_2:1 "Nếu ngươi ủng hộ [petitioner_2.GetTitledFirstName]"
  intrigue_dread.4100.d:0 "[scoped_chancellor.GetTitledFirstNameNoTooltip] nên xử lý chuyện này."

  intrigue_dread.4102.desc.commanders:0 "Cốt lõi vấn đề giữa [petitioner_1.GetFirstName] và [petitioner_2.GetFirstName] liên quan đến một cuộc cãi vã giữa các chỉ huy và vài cựu binh trong quân đội."
  intrigue_dread.4102.desc.guests:0 "Rõ ràng vấn đề bắt nguồn từ một sự cố ngoại giao nào đó..."
  intrigue_dread.4102.desc.fallback:0 "Ta hy vọng rằng việc lắng nghe lời than phiền của chúng sẽ hé lộ ý nghĩa sâu xa nào đó, nhưng sự cãi vã của [petitioner_1.GetFirstNamePossessive] và [petitioner_2.GetFirstNamePossessive] chỉ càng nghe càng nông cạn."
  intrigue_dread.4102.desc.antagonizer:0 "\n\nNếu có điều gì đáng nói, thì [scoped_antagonizer.GetFirstNameNoTooltip] rõ ràng là kẻ khó chịu hơn trong hai người thỉnh cầu."
  intrigue_dread.4102.a:0 "Ta yêu cầu các ngươi lập tức hòa giải. Nếu không..."
  intrigue_dread.4102.b:0 "[petitioner_1.GetFirstNameNoTooltip] rõ ràng là người đúng."
  intrigue_dread.4102.c:0 "Lời của [petitioner_2.GetFirstNamePossessiveNoTooltip] nghe hợp lý hơn với ta."

  intrigue_dread.4200.t:0 "Khu Rừng Trong Giấc Mơ Của Ta"
  intrigue_dread.4200.desc.intro:0 "Nhờ những nỗ lực của ta để trở thành một nhân vật thật sự đáng sợ và được kính nể, vô số kẻ có tội và bất trung đã bị tống vào ngục tối của ta."
  intrigue_dread.4200.desc.noble_forest:2 "Ngục thất của ta đã chật kín đối thủ, kẻ phản bội và tội phạm thường dân. Có lẽ đã đến lúc chúng phải gặp [ROOT.Char.GetFaith.DeathDeityName] tại [ROOT.Char.GetFaith.NegativeAfterLife], đồng thời phục vụ lợi ích của [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] trong lúc đó!"
  intrigue_dread.4200.desc.commoner_forest:0 "Nhiều tên cắt cổ và móc túi hèn hạ từ nông thôn lẫn thành thị đang chờ đợi số phận của mình, bị tách khỏi xã hội, nhưng có lẽ ta có một ý tưởng tốt hơn cho chúng."
  intrigue_dread.4200.desc.middle:0 "\n\nTrong những toan tính rùng rợn của mình, ta hình dung ra một khu rừng những kẻ hèn hạ và phản bội bị đóng cọc xuyên người bao quanh [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] từ mọi phía: một lời nhắc nhở ghê rợn cho tất cả về điều gì sẽ xảy ra khi [ROOT.Char.GetTitleAsNameNoTooltip] bị phản bội."
  intrigue_dread.4200.desc.noble_forest.outro:1 "Ta thấy [random_prisoner_scope.GetName] trên một cọc nhọn, xung quanh là thường dân bị dựng lên theo cùng một cách. Giờ chỉ còn việc biến giấc mơ này thành hiện thực!"
  intrigue_dread.4200.desc.commoner_forest.outro:0 "Ta thấy hàng hàng lớp lớp tội phạm thường dân kéo dài đến tận chân trời, vùng [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip] nhuốm đầy máu của chúng. Chỉ cần chút công sức, ta có thể gom đủ lũ sâu bọ này để biến giấc mơ của mình thành hiện thực."
  intrigue_dread.4200.a:0 "Bắt đầu thôi!"
  intrigue_dread.4200.b:1 "[random_prisoner_scope.GetTitledFirstNameNoTooltip] và vài thường dân cũng đủ gửi đi thông điệp."
  intrigue_dread.4200.c:0 "Một bộ sưu tập nhỏ xác chết là đủ."
  intrigue_dread.4200.d:0 "Tất cả phải sợ ta!"
  intrigue_dread.4200.e:0 "Nhân danh [ROOT.Char.GetFaith.HighGodName]! Ta không thể làm điều này!"
  intrigue_dread.4201.t:0 "Khu Rừng Xác Chết"
  intrigue_dread.4201.desc.intro:0 "Cuối cùng viễn cảnh của ta đã trở thành hiện thực nhờ xác chết của vô số tội phạm. Ta thong thả dạo bước giữa âm thanh chim kêu chát chúa và tiếng máu cũ nhỏ giọt nhẹ nhàng xuống nền đất ẩm."
  intrigue_dread.4201.desc.noble_forest:0 "\n\nTa bắt gặp thi thể của [random_prisoner.GetNameNoTooltip], gương mặt đông cứng trong vẻ kinh hãi tột độ, như thể [random_prisoner.GetSheHe] đã biết trước số phận của mình."
  intrigue_dread.4201.desc.commoner_forest:0 "\n\nTa đi ngang qua hàng hàng lớp lớp những kẻ hèn hạ và thảo khấu vô danh, chắc chắn rằng bất cứ kẻ cướp đường hay đạo tặc nào dám đến gần [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] đều có thể thấy rõ điều gì sẽ xảy ra với những kẻ gieo rắc tội ác và hỗn loạn trong [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"
  intrigue_dread.4201.desc.outro:0 "\n\nKhi kết thúc chuyến dạo quanh, ta hít một hơi cuối cùng mùi tử khí trước khi trở về, hài lòng với công trình của mình."
  intrigue_dread.4201.a:0 "Giờ đây tất cả sẽ sợ cái tên "[ROOT.Char.GetNameNoTooltip].""

  forest_of_corpses_1_modifier:0 "Khu Rừng Xác Chết"
  forest_of_corpses_1_modifier_desc:0 "Một khu rừng lớn những xác chết bị đóng cọc đã được dựng lên tại hạt này"
  forest_of_corpses_2_modifier:0 "$forest_of_corpses_1_modifier$"
  forest_of_corpses_2_modifier_desc:0 "$forest_of_corpses_1_modifier_desc$"
  forest_of_corpses_3_modifier:0 "$forest_of_corpses_1_modifier$"
  forest_of_corpses_3_modifier_desc:0 "$forest_of_corpses_1_modifier_desc$"

 # Scaring a loved one, by Luke Bean
  intrigue_dread.2001.t:0 "Ngay Cả [loved_one.GetSheHe|U] Cũng Sợ Ta"
  intrigue_dread.2001.desc:0 "Bàn tay [loved_one.GetTitledFirstNamePossessive] run rẩy dưới tay ta. Khi ta đưa tay vuốt má [loved_one.GetHerHis], [loved_one.GetSheHe] giật mình lùi lại.\n\n[loved_one.GetSheHe|U] kể cho ta nghe những điều kỳ lạ người ta nói về ta. Những điều đáng sợ. [loved_one.GetSheHe|U] tự hỏi bao nhiêu trong số đó là thật."
  intrigue_dread.2001.a:0 "Chúng còn chưa biết #EMP một nửa#! những gì ta đã làm."
  intrigue_dread.2001.a.tt:1 "Lại gần đây. #EMP Gần hơn nữa#!. Ta sẽ thì thầm vào tai ngươi."
  intrigue_dread.2001.b:0 "Mọi thứ ta làm đều để bảo vệ ngươi!"
  intrigue_dread.2001.c:0 "Cụ thể là ai nói những điều đó? Ta muốn tên."
  intrigue_dread.2001.d:0 "Chỉ cần mỉm cười rồi bước đi."
  intrigue_dread.2001.b.into_it:0 "[loved_one.GetFirstName] cảm động trước sự tận tâm của ngươi"
  intrigue_dread.2001.b.reassured:0 "[loved_one.GetFirstName] yên tâm rằng [loved_one.GetSheHe] được an toàn"
  intrigue_dread.2001.b.terrified:0 "Lời thú nhận của ngươi khiến [loved_one.GetFirstName] khiếp sợ"
  tooltip.intrigue_dread.2001.c.duel_success:1 "Lính của ngươi tóm cổ những kẻ buôn chuyện"
  tooltip.intrigue_dread.2001.c.duel_failure:1 "[loved_one.GetFirstName] công khai chống lại ngươi"
  intrigue_protected_by_loved_one_modifier:1 "Được Người Thân Bảo Vệ"
  intrigue_protected_by_loved_one_modifier_desc:0 "Người này có một người thân sẵn sàng làm #EMP bất cứ điều gì#! để bảo vệ họ."
  intrigue_defied_loved_one_opinion:1 "Chống Lại Người Thân"

 # Rumors about a relative, by Luke Bean
  intrigue_dread.2101.t:0 "Tin Đồn Về [family_member.GetFirstNameNoTooltip]"
  intrigue_dread.2101.desc.intro:0 ""Những tin đồn hèn hạ về [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))] [family_member.GetTitledFirstName] của ngài... Ta đã truy tìm được tận nguồn gốc." [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vỗ nhẹ vào xấp thư.\n\nNhững lá thư này chứng minh [hater.GetName] đã cố tình bôi nhọ danh tiếng của [family_member.GetFirstNamePossessive]. "
  intrigue_dread.2101.desc.failed_assassination:0 "[hater.GetSheHe|U] thậm chí còn buộc tội [family_member.GetFirstName] đã cố giết [hater.GetHerHim]!"
  intrigue_dread.2101.desc.committed_adultery:0 "[hater.GetSheHe|U] khẳng định rằng [family_member.GetFirstName] là một [family_member.GetWifeHusband] không chung thủy, và kể lại những câu chuyện trụy lạc về [family_member.GetHerHis]!"
  intrigue_dread.2101.desc.bullied_me:0 "[hater.GetSheHe|U] khẳng định [family_member.GetFirstName] đã có mầm mống cái ác từ khi còn nhỏ, lúc còn bắt nạt [hater.GetNameNoTooltip] một cách hung bạo."
  intrigue_dread.2101.desc.bad_friend:0 "[hater.GetSheHe|U] nói rằng [family_member.GetFirstName] là một người bạn tồi, và rằng điều đó khiến [hater.GetHerHim] đau đớn khi [family_member.GetFirstName] bỏ rơi tình bạn của họ."
  intrigue_dread.2101.desc.sinner:0 "[hater.GetSheHe|U] chế giễu nhân cách của [family_member.GetFirstNamePossessive], buộc tội [family_member.GetHerHim] những [ROOT.GetCharacter.Custom('GetSinMisdeedPlural')] đáng kinh ngạc."
  intrigue_dread.2101.desc.outro:0 "\n\nNgười ta thật sự nghĩ rằng họ có thể nói về [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))] của ta như thế sao?"
  intrigue_dread.2101.a:0 "Lan truyền những tin đồn còn đen tối hơn về [family_member.GetFirstNameNoTooltip] để tất cả phải sợ chúng ta."
  intrigue_dread.2101.a.tt.success:0 "Mọi người tin rằng [family_member.GetFirstName] có thể làm bất cứ điều gì"
  tooltip.intrigue_dread.2101.a.duel_success:0 "Chúng tin, và run sợ"
  intrigue_dread.2101.a.tt.failure:0 "Không ai tin những câu chuyện phóng đại của ngươi"
  tooltip.intrigue_dread.2101.a.duel_failure:0 "Mọi người chế nhạo những lời phóng đại của ngươi"
  intrigue_dread.2101.b:0 "Đưa cho [hater.GetTitledFirstNameNoTooltip] ít tiền để bịt miệng [hater.GetHerHis]."
  intrigue_dread.2101.b.tt.success:0 "[hater.GetTitledFirstName] sẽ giữ im lặng"
  tooltip.intrigue_dread.2101.b.duel_success:0 "[hater.GetTitledFirstName] im lặng, mọi người đều hài lòng"
  intrigue_dread.2101.b.tt.failure:0 "[hater.GetTitledFirstName] sẽ tiếp tục buôn chuyện"
  tooltip.intrigue_dread.2101.b.duel_failure:0 "[hater.GetTitledFirstName] nhận tiền của ngươi rồi vẫn tiếp tục lắm miệng"
  intrigue_everyone_is_satisfied_tt:0 "[hater.GetTitledFirstName] và [family_member.GetFirstName] đều hài lòng với cách giải quyết này"
  intrigue_dread.2101.c:0 "Âm thầm thuê bọn côn đồ đánh [hater.GetTitledFirstNameNoTooltip]."
  intrigue_dread.2101.c.tt.success:0 "Không ai dám nói xấu gia đình ngươi nữa"
  tooltip.intrigue_dread.2101.c.duel_success:0 "[hater.GetTitledFirstName] đang hồi phục sau một tai nạn đau đớn"
  intrigue_suspect_you_in_attack_success_tt:0 "Không ai chứng minh được ngươi liên quan, nhưng họ nghi ngờ đủ để sợ ngươi"
  intrigue_dread.2101.c.tt.failure:0 "Mối liên hệ của ngươi với tội phạm thường dân bị lộ"
  tooltip.intrigue_dread.2101.c.duel_failure:0 "[hater.GetTitledFirstName] nghi ngờ ngươi đứng sau vụ tấn công thất bại"
  intrigue_dread.2101.d:0 "Giữ khoảng cách với [family_member.GetFirstNameNoTooltip]."
  intrigue_everyone_heard_rumours_tt:0 "Mọi người trong triều đình nghe những tin đồn đáng xấu hổ về [family_member.GetNameNoTooltip]"
  intrigue_everyone_heard_horrifying_rumours_tt:0 "Mọi người trong triều đình nghe những tin đồn kinh hoàng về [family_member.GetNameNoTooltip]"
  intrigue_bumbling_tyrant_modifier:0 "Bạo Chúa Lóng Ngóng"
  intrigue_blanket_of_fear_modifier:0 "Bầu Không Khí Sợ Hãi"
  intrigue_controlling_the_narrative_modifier:0 "Kiểm Soát Câu Chuyện"
  intrigue_thrown_under_the_carriage_opinion:0 "Bị Ta Bỏ Rơi"
  intrigue_made_me_sound_scary_opinion:0 "Khiến Ta Trông Đáng Sợ"

 # Councillor is too scared to speak their mind, by Luke Bean
  intrigue_dread.2201.t:0 "Sợ hãi không dám nói lên suy nghĩ của mình"
  intrigue_dread.2201.desc:0 ""Một quyết định thật khôn ngoan, thưa lãnh chúa của tôi!" [yesman.Custom2('MyCharacterIntroduction', ROOT.Char)] cười lo lắng và gật đầu với Ta như một con bồ câu. "Thật sự, tôi không có gì để thêm vào cả!"\n\n[yesman.GetNameNoTooltip] quá sợ hãi nên không dám phản đối quyết định của Ta. Điều đó khiến [yesman.GetHerHim] khá vô dụng trong vai trò [yesman.GetCouncilTitle]."
  intrigue_dread.2201.a:0 "Hoàn hảo. Hội đồng của ta #EMP nên#! sợ ta."
  intrigue_dread.2201.b:0 "Ta sẽ tự làm việc của ngươi, đồ ngu!"
  intrigue_dread.2201.c:0 "Hãy nói thẳng suy nghĩ của ngươi. Chức vị của ngươi vẫn an toàn."
  intrigue_guaranteed_position_block_firing_councillor_effect_tt:0 "[yesman.GetShortUIName|U] không thể bị cách chức khỏi [council|E] trong 5 năm"
  intrigue_dread.2201.c.tt.success:0 "[yesman.GetFirstNameNoTooltip] tin tưởng ngươi đủ để nói thật"
  tooltip.intrigue_dread.2201.c.duel_success:0 "$intrigue_dread.2201.c.tt.success$"
  intrigue_dread.2201.c.tt.failure:0 "[yesman.GetFirstNameNoTooltip] nghĩ rằng ngươi đang cố gài bẫy [yesman.GetHerHim]"
  tooltip.intrigue_dread.2201.c.duel_failure:0 "$intrigue_dread.2201.c.tt.failure$"

